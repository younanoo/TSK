<script>window.CATALOG=[{"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 20, "nv": 480, "refs": 6756, "last": "20:49", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 31, "abbr": "Oba", "en": "Obadiah", "verses": [{"c": 1, "v": 1, "text": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم».", "groups": [{"kw": "concerning", "raw": "Psa_137:7; Isa_21:11, 34:1-17, Isa_63:1-6; Jer_9:25, Jer_9:26, Jer_25:17, Jer_25:21; Jer_49:17-22; Lam_4:21, Lam_4:22; Eze_25:12-14, Eze_35:3-15; Joe_3:19; Amo_1:11, Amo_1:12; Mal_1:3, Mal_1:4", "note": "", "refs": [{"l": "Psa 137:7", "n": "", "vs": [[7, "اذكر يارب لبني أدوم ما فعلوه يوم خراب أورشليم، إذ قالوا: «اهدموا اهدموا حتى يتعرى أساسها»."]]}, {"l": "Isa 21:11", "n": "", "vs": [[11, "نبوءة بشأن أدوم: هتف صارخ من سعير: «يا رقيب، ماذا بقي من الليل؟ أما آن له أن ينتهي؟»"]]}, {"l": "Isa 34:1-17", "n": "", "vs": [[1, "اقتربوا أيها الأمم للاستماع، اصغوا أيها الشعوب. لتسمع الأرض وملؤها، المسكونة وكل ما يخرج منها،"], [2, "لأن الرب ساخط على كل الشعوب، وغضبه منصب على جميع أجنادهم. قضى عليهم بالفناء، وأسلمهم إلى الذبح،"], [3, "فتطرح قتلاهم وينتشر نتن جيفهم في الفضاء، وتفيض الجبال بدمائهم،"], [4, "وتنحل كل كواكب السماء، وتطوى السماوات كدرج، وتتساقط كل نجومها كتساقط أوراق الكرمة أو حبات التين المتغضنة."], [5, "لأن سيفي قد تشرب بالسخط في السماء، وها هو ينزل ليعاقب أدوم، وينتقم من الشعب الذي قضيت عليه بالفناء."], [6, "للرب سيف مشبع بالدم، مطلي بالشحم، بدم حملان وتيوس، وبشحم كلى كباش، لأن للرب ذبيحة في بصرة، ومذبحة في أدوم."], [7, "ويسقط معهم البقر الوحشي، والعجول والثيران القوية، فتتشبع أرضهم بالدماء، ويخصب ترابهم بالشحم،"], [8, "لأن للرب يوم انتقام، سنة ثأر لدعوى صهيون،"], [9, "فتنقلب أنهار أدوم إلى زفت، وترابهم إلى كبريت، وتصبح أرضها قارا مشتعلا."], [10, "فلا تنطفيء ليلا ونهارا، ويحلق دخانها إلى الفضاء مدى الدهر، وتظل خرابا جيلا بعد جيل، فلا يعبر بها أحد إلى الأبد،"], [11, "ولا يرثها سوى الصقور والقنافذ، ويسكن فيها البوم والغراب، ويمد الرب عليها خيط الدمار ومطمار الهلاك،"], [12, "ولا يجد فيها أشرافها أثرا للملك، وينقرض جميع رؤسائها."], [13, "ينمو الشوك في قصورها، ويزحف العوسج على حصونها، فتصبح مأوى لبنات آوى، ومسكنا للنعام."], [14, "وتجتمع فيها الوحوش البرية مع الذئاب، ووعل البر يدعو صاحبه، وهناك تستقر وحوش الليل وتجد لنفسها ملاذ راحة."], [15, "هناك تعيش البوم وتبيض وتفرخ وترعى صغارها تحت أجنحتها، وهناك أيضا تتلاقى الصقور بعضها ببعض."], [16, "ابحثوا في سفر الرب واقرأوا: فكلمة واحدة لا يمكن أن تسقط، إذ كل أليف سيجتمع بأليفه، لأن فم الرب قد أمر، وروحه يجمعها معا."], [17, "فهو قد ألقى عليها القرعة، ويده قد وزعتها بقسطاس، فترثها إلى الأبد وتقيم فيها جيلا بعد جيل."]]}, {"l": "Isa 63:1-6", "n": "", "vs": [[1, "من هذا المقبل من أدوم، بثياب حمراء من بصرة؛ هذا المتسربل بالبهاء. السائر بخيلاء قوته؟ إنه أنا الرب الناطق بالبر، العظيم للخلاص."], [2, "ما بال ردائك أحمر وثيابك كمن داس عنب المعصرة؟"], [3, "لقد دست المعصرة وحدي، ولم يكن معي أحد من الشعوب. قد دستهم في سخطي ووطئتهم في غيظي، فتناثر دمهم على ردائي ولطخت ثيابي."], [4, "لأن يوم الانتقام كان كامنا في قلبي، وسنة مفديي قد أتت."], [5, "تلفت فلم أعثر على معين، وعجبت إذ لم يكن من ناصر، فانتصرت بقوة ذراعي، وتأيدت بنجدة سخطي،"], [6, "فدست الشعوب في غيظي، وأسكرتهم في غضبي، وسكبت دماءهم فوق الأرض."]]}, {"l": "Jer 9:25", "n": "", "vs": [[25, "«ها أيام مقبلة»، يقول الرب، «أعاقب فيها كل مختون وأغلف"]]}, {"l": "Jer 9:26", "n": "", "vs": [[26, "أهل مصر ويهوذا وأدوم وبني عمون وموآب، وسائر المقيمين في الصحراء ممن يقصون شعر أصداغهم، لأن جميع الشعوب غلف، أما كل بيت إسرائيل فإنهم ذوو قلوب غلفاء»."]]}, {"l": "Jer 25:17", "n": "", "vs": [[17, "فتناولت الكأس من يد الرب وسقيت منها جميع الأمم التي بعثني إليها الرب:"]]}, {"l": "Jer 25:21", "n": "", "vs": [[21, "وآدوم، وموآب، وبني عمون،"]]}, {"l": "Jer 49:17-22", "n": "", "vs": [[17, "ستصبح أدوم مثار رعب، وكل من يمر بها تعتريه رعدة، ويصفر من جراء كل نكباتها،"], [18, "ويصيبها ما أصاب سدوم وعمورة وما جاورهما، من انقلاب، يقول الرب، فلا يسكن هناك إنسان ولا يتغرب فيها أحد."], [19, "ها هو ينقض على الأدوميين في مواطن صخورهم كما ينقض فجأة أسد من أجمات نهر الأردن؛ وفي لحظة أطردهم منها وأقيم عليها من أختاره، لأنه من هو مثلي؟ ومن يحاكمني؟ وأي راع يقوى على مواجهتي؟"], [20, "لذلك اسمعوا ما خططه الرب ضد أدوم، وما دبره ضد ساكني تيمان: ها صغار القوم يجرون، وتنهدم مساكنهم عليهم."], [21, "من صوت سقوطهم ترجف الأرض، وأصداء صراخهم تبلغ البحر الأحمر."], [22, "ها هو يحلق كالنسر، وينشر جناحيه على بصرة، فتصبح قلوب جبابرة أدوم كقلب امرأة ماخض»."]]}, {"l": "Lam 4:21", "n": "", "vs": [[21, "ابتهجي وافرحي ياابنة أدوم، ياساكنة عوص. إنما هذه الكأس ستجوز عليك أيضا فتسكرين وتتعرين."]]}, {"l": "Lam 4:22", "n": "", "vs": [[22, "قد تم إثمك ياابنة صهيون، ولن يطيل (الله ) من حقبة سبيك. أما أنت ياابنة أدوم فإنه يعاقبك ويفضح خطاياك."]]}, {"l": "Eze 25:12-14", "n": "", "vs": [[12, "وهذا أيضا ما يعلنه السيد الرب: لأن الأدوميين أقدموا على الانتقام من شعب يهوذا، وأساءوا إليه أشد إساءة."], [13, "ها أنا أعاقب الأدوميين وأستأصل من أرضهم الإنسان والحيوان، وأحولها إلى أطلال دارسة من التيمن إلى ددان، إذ يقتل أهلها جميعا بالسيف."], [14, "وأعهد بنقمتي إلى شعبي إسرائيل، فيفعلون بالأدوميين بمقتضى غضبي وسخطي، فيدركون شدة نقمتي، يقول السيد الرب."]]}, {"l": "Eze 35:3-15", "n": "", "vs": [[3, "وقل لأهله: ها أنا أنقلب عليك ياجبل سعير وأعاقبك لأجعلك خرابا مقفرا."], [4, "أجعل مدنك أطلالا وتكون أنت مقفرا، فتدرك أني أنا الرب."], [5, "لأنك أضمرت في نفسك بغضة أبدية، وأسلمت بني إسرائيل إلى حد السيف في أثناء محنتهم، في ساعة دينونة إثمهم."], [6, "لذلك حي أنا يقول السيد الرب، إني أعدك لسفك الدم، والدم يتعقبك. لأنك لم تمقت سفك الدم فالدم يتعقبك."], [7, "فأحول جبل سعير إلى أطلال وأستأصل منه كل ذاهب وآيب."], [8, "وأجعل جباله تكتظ بقتلاه، فيتساقطون في تلالك وأوديتك وجميع أنهارك صرعى السيف."], [9, "وأحيلك إلى خرائب أبدية، فلا يبقى لمدنك أثر، فتدركون أني أنا الرب."], [10, "لأنك قلت: إن هاتين الأمتين، وهاتين الأرضين تصبحان لي فأمتلكهما، ولو كان الرب هناك."], [11, "لذلك حي أنا يقول السيد الرب: لأعاملنك بمقتضى غضبك وحسدك اللذين أبديتهما في بغضائك لهم، فأعلن ذاتي عندما أدينك."], [12, "فتدرك أني أنا الرب قد سمعت كل إهانتك التي عيرت بها جبال إسرائيل قائلا: قد أصبحت خرابا وصارت لنا مغنما."], [13, "قد تباهيتم علي بأفواهكم، وأكثرتم من لغوكم علي وأنا سمعت."], [14, "ففي موسم الربيع أجعلك مقفرا"], [15, "وكما فرحت لخراب ميراث شعب إسرائيل، كذلك أفعل بك، فتصير ياجبل سعير خرابا أنت وكل بلاد أدوم فتدركون أني أنا الرب»."]]}, {"l": "Joe 3:19", "n": "", "vs": [[19, "وتصبح مصر خرابا، وأدوم قفرا موحشا لفرط ما أنزلوه من ظلم بأبناء يهوذا، ولأنهم سفكوا دما بريئا في ديارهم."]]}, {"l": "Amo 1:11", "n": "", "vs": [[11, "وهذا ما يقوله الرب: من أجل معاصي أدوم الثلاث والأربع لن أرد عنهم سخطي، لأنهم تعقبوا إخوتهم بالسيف، وتغاضوا عن كل رحمة، وجعلوا غضبهم يتأجج ملتهما باستمرار، وظلوا حاقدين على الدوام."]]}, {"l": "Amo 1:12", "n": "", "vs": [[12, "فأرسل نارا على تيمان، فتلتهم حصون بصرة."]]}, {"l": "Mal 1:3", "n": "", "vs": [[3, "وأبغضت عيسو، وحولت جباله إلى أراض موحشة، وجعلت ميراثه لبنات آوى البرية."]]}, {"l": "Mal 1:4", "n": "", "vs": [[4, "وإن قال الأدوميون: مع إننا تحطمنا فإننا نبني الخرب، فإن الرب القدير يقول: هم يعمرون وأنا أهدم، ويدعو الناس بلادهم، «أرض النفاق»، وأهلها بالأمة التي سخط الرب عليها إلى الأبد."]]}], "kwAr": "بشأن", "noteAr": ""}, {"kw": "We", "raw": "Jer_49:14, Jer_49:15, Jer_51:46; Mat_24:6; Mar_13:7", "note": "", "refs": [{"l": "Jer 49:14", "n": "", "vs": [[14, "تبلغت رسالة من لدن الرب، أن سفيرا قد بعث إلى الأمم قائلا: «احشدوا أنفسكم لمهاجمتها. هبوا للقتال."]]}, {"l": "Jer 49:15", "n": "", "vs": [[15, "قد جعلتك صغيرا في الأمم، حقيرا بين الناس."]]}, {"l": "Jer 51:46", "n": "", "vs": [[46, "لا يخر قلبكم ولا تفزعوا مما يشيع في الديار من أنباء، إذ تروج شائعة في هذه السنة وأخرى في السنة التالية، ويسود العنف الأرض، ويقوم متسلط على متسلط."]]}, {"l": "Mat 24:6", "n": "", "vs": [[6, "وسوف تسمعون بحروب وأخبار حروب. فإياكم أن ترتعبوا! فلابد أن يحدث هذا كله، ولكن ليست النهاية بعد."]]}, {"l": "Mar 13:7", "n": "", "vs": [[7, "ولكن، عندما تسمعون بالحروب وأخبار الحروب لا ترتعبوا؛ فإن ذلك لابد أن يحدث، ولكن ليست النهاية بعد."]]}], "kwAr": "بلغنا", "noteAr": ""}, {"kw": "and an", "raw": "Isa_18:2, Isa_18:3, Isa_30:4", "note": "", "refs": [{"l": "Isa 18:2", "n": "", "vs": [[2, "التي تبعث رسلا في البحر في قوارب البردي السابحة فوق المياه، امضوا أيها الرسل المسرعون إلى شعب طوال القامة جرد، إلى شعب بث الرعب في القاصي والداني، إلى قوم أقوياء وقاهرين تشطر الأنهار أرضهم."]]}, {"l": "Isa 18:3", "n": "", "vs": [[3, "ياجميع أهل الأرض والساكنين فيها، عندما ترتفع راية على الجبال فانظروا، وعندما يدوي نفير بوق فاسمعوا."]]}, {"l": "Isa 30:4", "n": "", "vs": [[4, "ومع أن سلطانه امتد إلى صوعن وحانيس حتى أقام فيها لنفسه ولاة وممثلين"]]}], "kwAr": "أنه أرسل", "noteAr": ""}, {"kw": "Arise", "raw": "Jer_6:4, Jer_6:5, Jer_50:9-15, Jer_51:27, Jer_51:28; Mic_2:13", "note": "", "refs": [{"l": "Jer 6:4", "n": "", "vs": [[4, "أعدوا عليها حربا. قوموا نهاجمها عند الظهيرة. ويل لنا فقد مال النهار وانتشرت ظلال المساء."]]}, {"l": "Jer 6:5", "n": "", "vs": [[5, "هبوا لنهجم في الليل ونهدم قصورها»."]]}, {"l": "Jer 50:9-15", "n": "", "vs": [[9, "فها أنا أثير وأجلب على بابل حشود أمم عظيمة من أرض الشمال فيتألبون عليها، ويستولون عليها من الشمال، وتكون سهامهم كجبار متمرس لا يرجع فارغا،"], [10, "فتصبح أرض الكلدانيين غنيمة، وكل من يسلبها يتخم، يقول الرب."], [11, "لأنكم تبتهجون وتطفرون غبطة يا ناهبي شعبي، وتمرحون كعجلة فوق العشب وتصهلون كالخيل."], [12, "فإن أمكم قد لحقها الخزي الشديد وانتابها الخجل. ها هي تضحي أقل الشعوب، وأرضها تصير قفرا جافا وصحراء."], [13, "وتظل بأسرها مهجورة وخربة، كل من يمر ببابل يصيبه الذعر ويصفر دهشة لما ابتليت به من نكبات، لأنها أثارت غضب الرب."], [14, "اصطفوا على بابل من كل ناحية ياجميع موتري الأقواس. ارموا السهام ولا تبقوا منها سهما واحدا، لأنها قد أخطأت في حق الرب."], [15, "أطلقوا هتاف الحرب عليها من كل جانب، فقد استسلمت وانهارت أسسها، وتقوضت أسوارها، لأن هذا هو انتقام الرب، فاثأروا منها، وعاملوها بمثل ما عاملتكم."]]}, {"l": "Jer 51:27", "n": "", "vs": [[27, "انصبوا راية في الأرض. انفخوا في البوق بين الأمم. أثيروا عليها الأمم لقتالها، وألبوا عليها ممالك أراراط ومني وأشكناز. أقيموا عليها قائدا. اجعلوا الخيل تزحف عليها كجحافل الجنادب الشرسة."]]}, {"l": "Jer 51:28", "n": "", "vs": [[28, "أثيروا عليها الأمم وملوك الماديين وكل حكامهم وولاتهم وسائر الديار التي يحكمونها."]]}, {"l": "Mic 2:13", "n": "", "vs": [[13, "والذي يفتح الثغرة يتقدمهم فيقتحمون ويعبرون الباب خارجا، وفي طليعتهم يسير ملكهم والرب في مقدمتهم."]]}], "kwAr": "تأهبوا", "noteAr": ""}], "arS": [["هذه ", []], ["نبوءة", ["H2377"]], [" ", []], ["عوبديا", ["H5662"]], [": هذا ما ", []], ["يقوله", ["H559"]], [" ", []], ["السيد", ["H136"]], [" ", []], ["الرب", ["H3069"]], [" بشأن ", []], ["أدوم", ["H123"]], [": قد ", []], ["بلغنا", ["H8085"]], [" ", []], ["خبر", ["H8052"]], [" من ", []], ["عند", ["H4480", "H854"]], [" ", []], ["الرب", ["H3068"]], [" أنه ", []], ["أرسل", ["H7971"]], [" ", []], ["رسولا", ["H6735"]], [" إلى ", []], ["الأمم", ["H1471"]], [" قائلا: «", []], ["تأهبوا", ["H6965"]], ["، ", []], ["ولننهض", ["H6965"]], [" ", []], ["لمحاربة", ["H4421"]], [" ", []], ["أدوم", ["H123"]], ["».", []]]}, {"c": 1, "v": 2, "text": "ها أنا أجعلك صغيرا بين الأمم وأشدها احتقارا.", "groups": [{"kw": "", "raw": "Num_24:18; 1Sa_2:7, 1Sa_2:8; Job_34:25-29; Psa_107:39, Psa_107:40; Isa_23:9; Eze_29:15; Mic_7:10; Luk_1:51, Luk_1:52", "note": "", "refs": [{"l": "Num 24:18", "n": "", "vs": [[18, "ويرث أرض أدوم، ويتملك ديار سعير. أما إسرائيل فيزداد قوة."]]}, {"l": "1Sa 2:7", "n": "", "vs": [[7, "الرب يفقر ويغني، يذل ويعز."]]}, {"l": "1Sa 2:8", "n": "", "vs": [[8, "ينهض المسكين من التراب، ويرفع البائس من كومة الرماد، ليجلسه مع النبلاء، ويملكه عرش المجد، لأن للرب أساسات الأرض التي أرسى عليها المسكونة."]]}, {"l": "Job 34:25-29", "n": "", "vs": [[25, "لذلك هو مطلع على أعمالهم، فيطيح بهم في الليل فيسحقون."], [26, "يضربهم لشرهم على مرأى من الناس،"], [27, "لأنهم انحرفوا عن اتباعه، ولم يتأملوا في طرقه،"], [28, "فكانوا سببا في ارتفاع صراخ البائس إليه، والله يستجيب استغاثة المسكين."], [29, "فإن هيمن بسكينته فمن يدينه، وإن وارى وجهه فمن يعاينه، سواء أكانوا شعبا أم فردا"]]}, {"l": "Psa 107:39", "n": "", "vs": [[39, "عندما يقل الشعب ويذل بفعل الضيق والبلايا والأحزان،"]]}, {"l": "Psa 107:40", "n": "", "vs": [[40, "يصب الله الهوان على الرؤساء، ويضلهم في أرض تيه ليس فيها طريق."]]}, {"l": "Isa 23:9", "n": "", "vs": [[9, "إن الرب القدير هو الذي قضى بذلك، ليحط من كبرياء كل مجد، وليذل كل شرفاء الأرض."]]}, {"l": "Eze 29:15", "n": "", "vs": [[15, "بل تكون أحقر الممالك فلا تتشامخ بعد على بقية الأمم، وأجعلهم أقلية لئلا يتسلطوا على الشعوب."]]}, {"l": "Mic 7:10", "n": "", "vs": [[10, "عندئذ ترى ذلك عدوتي فيعتريها الخزي إذ قالت لي: «أين هو الرب إلهك؟» ستشهدها عيناي تداس كطين الشوارع والأزقة."]]}, {"l": "Luk 1:51", "n": "", "vs": [[51, "عمل بذراعه قوة؛ شتت المتكبرين في نيات قلوبهم."]]}, {"l": "Luk 1:52", "n": "", "vs": [[52, "أنزل المقتدرين عن عروشهم، ورفع المتواضعين."]]}], "kwAr": "", "noteAr": ""}], "arS": [["ها أنا ", []], ["أجعلك", ["H5414"]], [" ", []], ["صغيرا", ["H6996"]], [" بين ", []], ["الأمم", ["H1471"]], [" ", []], ["وأشدها", ["H3966"]], [" ", []], ["احتقارا", ["H959"]], [".", []]]}, {"c": 1, "v": 3, "text": "قد غرتك كبرياء قلبك أيها المقيم في شقوق الصخور، ومساكنه في القمم، القائل في قلبه: من يهوي بي إلى الأرض؟", "groups": [{"kw": "pride", "raw": "Pro_16:18, Pro_18:12, Pro_29:23; Isa_10:14-16, Isa_16:6; Jer_48:29, Jer_48:30, Jer_49:16; Mal_1:4", "note": "", "refs": [{"l": "Pro 16:18", "n": "", "vs": [[18, "قبل الانكسار الكبرياء، وقبل السقوط غطرسة الروح."]]}, {"l": "Pro 18:12", "n": "", "vs": [[12, "قبل الانكسار تشامخ القلب، وقبل الكرامة التواضع."]]}, {"l": "Pro 29:23", "n": "", "vs": [[23, "كبرياء الإنسان تحط من قدره، والمتواضع الروح يحرز كرامة."]]}, {"l": "Isa 10:14-16", "n": "", "vs": [[14, "وكما تستحوذ يد الإنسان على العش، هكذا استحوذت يدي على ثروات الشعوب. وكما يجمع الإنسان البيض المهجور، هكذا جمعت الأرض بأسرها، فلم يجرؤ أحد أن يحرك جناحا أو يفتح فاها أو ينبس بهمسة."], [15, "أتزهو الفأس على من يقطع بها، أم يتعظم المنشار على من ينشر به، وكأن القضيب يحرك رافعه، أو كأن العصا ترفع ما ليس خشبا؟!"], [16, "لذلك فإن الرب القدير سيفشي وبأ مهلكا بين محاربيه الشجعان، ويوقد تحت مجده وقيدا كاشتعال النار،"]]}, {"l": "Isa 16:6", "n": "", "vs": [[6, "قد سمعنا بكبرياء موآب، وبعجرفتها وغطرستها الطاغيتين، وبغرورها وصلفها، ولكن كل افتخارها باطل."]]}, {"l": "Jer 48:29", "n": "", "vs": [[29, "قد سمعنا عن عجرفة موآب المفرطة. إنه شديد الكبرياء. سمعنا عن غطرسته وتشامخه وغروره، وعن ارتفاع قلبه."]]}, {"l": "Jer 48:30", "n": "", "vs": [[30, "قد عرفت كبرياءه يقول الرب، إنما زهوه باطل، وتفاخره عديم الجدوى."]]}, {"l": "Jer 49:16", "n": "", "vs": [[16, "قد خدعك ما تثيره من رعب، وأغوتك كبرياء قلبك، يامن تقيم في شقوق الصخر وتعتصم بقمة التل. ولكنني سأطرحك من هناك ولو بنيت عشك عاليا كعش النسر، يقول الرب."]]}, {"l": "Mal 1:4", "n": "", "vs": [[4, "وإن قال الأدوميون: مع إننا تحطمنا فإننا نبني الخرب، فإن الرب القدير يقول: هم يعمرون وأنا أهدم، ويدعو الناس بلادهم، «أرض النفاق»، وأهلها بالأمة التي سخط الرب عليها إلى الأبد."]]}], "kwAr": "كبرياء", "noteAr": ""}, {"kw": "thou", "raw": "2Ki_14:7; 2Ch_25:12", "note": "", "refs": [{"l": "2Ki 14:7", "n": "", "vs": [[7, "وهو الذي قتل عشرة آلاف من الأدوميين في وادي الملح، واستولى على سالع بالحرب، ودعا اسمها يقتئيل إلى هذا اليوم."]]}, {"l": "2Ch 25:12", "n": "", "vs": [[12, "وسبى بنو يهوذا عشرة آلاف آخرين أتوا بهم إلى قمة جبل سالع حيث طرحوهم من فوقها، فتهشمت عظامهم جميعا."]]}], "kwAr": "أيها المقيم", "noteAr": ""}, {"kw": "saith", "raw": "Isa_14:13-15, Isa_47:7, Isa_47:8; Jer_49:4; Rev_18:7, Rev_18:8", "note": "", "refs": [{"l": "Isa 14:13-15", "n": "", "vs": [[13, "قد قلت في قلبك: إني أرتقي إلى السماء وأرفع عرشي فوق كواكب الله، وأجلس على جبل الاجتماع في أقصى الشمال"], [14, "أرتقي فوق أعالي السحاب، وأصبح مثل العلي."], [15, "ولكنك طرحت إلى الهاوية، إلى أعماق الجب."]]}, {"l": "Isa 47:7", "n": "", "vs": [[7, "وقلت: سأظل السيدة إلى الأبد. لذلك لم تفكري بهذه الأمور في نفسك ولا تأملت بما تؤول إليه."]]}, {"l": "Isa 47:8", "n": "", "vs": [[8, "فالآن اسمعي هذا أيتها المترفهة المتنعمة المطمئنة، القائلة في قلبها: أنا وحدي وليس هناك غيري، لن أعرف الترمل ولن أثكل"]]}, {"l": "Jer 49:4", "n": "", "vs": [[4, "ما بالك تباهين بالأودية أيتها الابنة المخادعة التي اتكلت على نفائسها قائلة: من يهاجمني؟"]]}, {"l": "Rev 18:7", "n": "", "vs": [[7, "أنزلوا بها من العذاب والشقاء على قدر ما عظمت نفسها وترفهت. فإنها تقول في نفسها: أنا ملكة على العرش، ولست أرملة، ولن أذوق طعم الحزن."]]}, {"l": "Rev 18:8", "n": "", "vs": [[8, "لذلك ستنقض عليها البلايا في يوم واحد، من موت وحزن وجوع، و كحلت عينيك بالأثمد، فباطلا تجملين ذاتك، فقد نبذك عشاقك وسعوا للقضاء عليك."]]}, {"l": "Jer 30:14", "n": "", "vs": [[14, "قد نسيك محبوك، وأهملوك إهمالا، لأني ضربتك كما يضرب عدو، وعاقبتك عقاب مبغض قاس، لأن إثمك عظيم وخطاياك متكاثرة."]]}, {"l": "Lam 1:19", "n": "", "vs": [[19, "دعوت محبي فخدعوني. فني كهنتي وشيوخي في المدينة وهم ينشدون قوتا لإحيا ء نفوسهم."]]}, {"l": "Eze 23:22-25", "n": "", "vs": [[22, "لذلك ياأهوليبة، هذا ما يعلنه السيد الرب: ها أنا أثير عليك عشاقك الذين جفتهم نفسك، وآتي بهم عليك من كل ناحية."], [23, "أبناء البابليين، وسائر الكلدانيين من أقوام فقود وشوع وقوع ومعهم جميع أبناء أشور، شبان شهوة، من ولاة وقادة ورؤساء مركبات وذوي الشهرة، وكلهم فرسان خيل."], [24, "فيهاجمونك بأسلحة ومركبات وعربات وأقوام شعوب ويحاصرونك بترس ومجن وخوذة. وأعهد إليهم بمقاضاتك فيحكمون عليك بمقتضى أحكامهم."], [25, "وأصب سخطي عليك فيعاملونك بغيظ. يجدعون أنفك وأذنيك، وتقتل بقيتك بالسيف. يأسرون أبناءك وبناتك، وتلتهم النار بقيتك،"]]}, {"l": "Rev 17:12-17", "n": "", "vs": [[12, "وأما القرون العشرة التي رأيت هي عشرة ملوك لم يتولوا الملك بعد، وسيتولون سلطة الملك مع الوحش لمدة ساعة واحدة،"], [13, "يتفقون فيها برأي واحد أن يعطوا الوحش قوتهم وسلطتهم."], [14, "ثم يحاربون الحمل، ولكن الحمل يهزمهم، لأنه رب الأرباب وملك الملوك، والذين معه هم المدعوون، المختارون، المؤمنون»."], [15, "ثم قال لي الملاك: «أما الميا ه التي رأيت حيث تجلس الزانية، فترمز إلى شعوب وجماهير وأمم ولغات."], [16, "وأما القرون العشرة التي رأيتها، والوحش، فسيبغضون الزانية ويجعلونها معزولة وعارية، ويأكلون لحمها ويحرقونها بالنار،"], [17, "لأن الله جعل في قلوبهم أن يعملوا وفق قصده، فيتفقوا على أن يعطوا الوحش ملكهم، حتى تتم كلمات الله."]]}], "kwAr": "حلفائك", "noteAr": "الكلدانيون، الذين صار أتباعهم أدوات في اضطهاد اليهود. انظر مز 55: 12، 13؛ إر 4: 30؛ 30: 14؛ مرا 1: 19؛ حز 23: 22-25؛ رؤ 17: 12-17"}, {"kw": "men that were at peace with thee", "raw": "Heb. men of thy peace, Jer_20:10, Jer_38:22 *marg.", "note": "Heb. men of thy peace, Jer_20:10, Jer_38:22 *marg.", "refs": [{"l": "Jer 20:10", "n": "", "vs": [[10, "لأني سمعت نفثات تهديد يين: «هذا ما يعلنه الرب القدير: ألم تبق في تيمان حكمة بعد؟ هل بادت المشورة من ذوي الفهم؟ هل تلاشت حكمتهم؟"]]}, {"l": "Jer 49:20", "n": "", "vs": [[20, "لذلك اسمعوا ما خططه الرب ضد أدوم، وما دبره ضد ساكني تيمان: ها صغار القوم يجرون، وتنهدم مساكنهم عليهم."]]}, {"l": "Eze 25:13", "n": "", "vs": [[13, "ها أنا أعاقب الأدوميين وأستأصل من أرضهم الإنسان والحيوان، وأحولها إلى أطلال دارسة من التيمن إلى ددان، إذ يقتل أهلها جميعا بالسيف."]]}, {"l": "Amo 1:12", "n": "", "vs": [[12, "فأرسل نارا على تيمان، فتلتهم حصون بصرة."]]}], "kwAr": "ياتيمان", "noteAr": ""}, {"kw": "every", "raw": "Isa_34:5-8, Isa_63:1-3", "note": "", "refs": [{"l": "Isa 34:5-8", "n": "", "vs": [[5, "لأن سيفي قد تشرب بالسخط في السماء، وها هو ينزل ليعاقب أدوم، وينتقم من الشعب الذي قضيت عليه بالفناء."], [6, "للرب سيف مشبع بالدم، مطلي بالشحم، بدم حملان وتيوس، وبشحم كلى كباش، لأن للرب ذبيحة في بصرة، ومذبحة في أدوم."], [7, "ويسقط معهم البقر الوحشي، والعجول والثيران القوية، فتتشبع أرضهم بالدماء، ويخصب ترابهم بالشحم،"], [8, "لأن للرب يوم انتقام، سنة ثأر لدعوى صهيون،"]]}, {"l": "Isa 63:1-3", "n": "", "vs": [[1, "من هذا المقبل من أدوم، بثياب حمراء من بصرة؛ هذا المتسربل بالبهاء. السائر بخيلاء قوته؟ إنه أنا الرب الناطق بالبر، العظيم للخلاص."], [2, "ما بال ردائك أحمر وثيابك كمن داس عنب المعصرة؟"], [3, "لقد دست المعصرة وحدي، ولم يكن معي أحد من الشعوب. قد دستهم في سخطي ووطئتهم في غيظي، فتناثر دمهم على ردائي ولطخت ثيابي."]]}], "kwAr": "كل", "noteAr": ""}, {"kw": "mount", "raw": "Oba_1:21; Deu_2:5", "note": "", "refs": [{"l": "Oba 1:21", "n": "", "vs": [[21, "ويصعد المنقذون إلى جبل صهيون ليحكموا جبل عيسو، ويصبح الملك للرب."]]}, {"l": "Deu 2:5", "n": "", "vs": [[5, "فاحذروا جدا أن تهاجموهم، لأنني لا أورثكم من أرضهم ولا وطأة قدم، لأني قد أعطيت جبل سعير ميراثا لعيسو."]]}], "kwAr": "جبل", "noteAr": ""}], "arS": [["فيرتعب", ["H2865"]], [" ", []], ["أبطالك", ["H1368"]], [" ", []], ["ياتيمان", ["H8487"]], [" حتى ", []], ["ينقرض", ["H3772"]], [" ", []], ["قتلا", ["H4480", "H6993"]], [" كل ", []], ["رجل", ["H376"]], [" من ", []], ["جبل", ["H4480", "H2022"]], [" ", []], ["عيسو", ["H6215"]], [".", []]]}, {"c": 1, "v": 10, "text": "فمن أجل ما أنزلت بأخيك يعقوب من ظلم، يغشاك العار وتنقرض إلى الأبد.", "groups": [{"kw": "violence", "raw": "Gen_27:11, Gen_27:41; Num_20:14-21; Psa_83:5-9, Psa_137:7; Lam_4:21; Eze_25:12; Eze_35:5, Eze_35:6, Eze_35:12-15; Amo_1:11", "note": "", "refs": [{"l": "Gen 27:11", "n": "", "vs": [[11, "فقال يعقوب لرفقة أمه: «أخي عيسو رجل أشعر، وأنا رجل أملس."]]}, {"l": "Gen 27:41", "n": "", "vs": [[41, "وحقد عيسو على يعقوب من أجل ما ناله من بركة أبيه. فناجى نفسه: «قريبا يموت أبي، وبعدئذ أقتل أخي يعقوب»."]]}, {"l": "Num 20:14-21", "n": "", "vs": [[14, "وبعث موسى رسلا من قادش إلى ملك أدوم يقولون له: «هذا ما يقوله لك أخوك إسرائيل: قد بلغك ما أصابنا من مشقة،"], [15, "فقد انحدر آباؤنا إلى مصر فمكثنا فيها أياما كثيرة، فسامنا المصريون، نحن وآباءنا سوء العذاب،"], [16, "فتضرعنا إلى الرب فاستجاب لصوتنا، وأرسل ملاكا أخرجنا من مصر. وها نحن نازلون في مدينة قادش في طرف تخومك."], [17, "فأذن لنا أن نمر في أرضك من غير أن ندوس في حقل أو كرم أو نشرب ماء بئر، بل نسير في الطريق العامة المخصصة للسفر. لا نميل يمينا أو شمالا حتى نتجاوز حدودك»."], [18, "فقال لهم ملك أدوم: «إياكم المرور بأرضي لئلا أجابهكم بالسيف»."], [19, "فأجابه بنو إسرائيل: «لن نسير إلا على طريق السفر، وإن استقينا نحن ومواشينا من مائك ندفع ثمنه. إننا لا نطلب أكثر من المرور راجلين»."], [20, "فقال: «لا تمروا». وعبأ ملك أدوم جيشا قويا وخرج للقاء إسرائيل."], [21, "وأبى ملك أدوم أن يأذن للإسرائيليين باجتياز أراضيه. فتحولوا عنه."]]}, {"l": "Psa 83:5-9", "n": "", "vs": [[5, "فإنهم قد تآمروا معا بقلب واحد، وعقدوا حلفا ضدك."], [6, "عشائر أدوم وبنو إسماعيل، نسل موآب وبنو هاجر."], [7, "جبال وعمون وعماليق، الفلسطينيون وأهل صور،"], [8, "وقوم أشور أيضا انضموا إليهم، صاروا عونا لبني لوط."], [9, "افعل بهم كما فعلت بمديان وسيسرا ويابين في نهر قيشون."]]}, {"l": "Psa 137:7", "n": "", "vs": [[7, "اذكر يارب لبني أدوم ما فعلوه يوم خراب أورشليم، إذ قالوا: «اهدموا اهدموا حتى يتعرى أساسها»."]]}, {"l": "Lam 4:21", "n": "", "vs": [[21, "ابتهجي وافرحي ياابنة أدوم، ياساكنة عوص. إنما هذه الكأس ستجوز عليك أيضا فتسكرين وتتعرين."]]}, {"l": "Eze 25:12", "n": "", "vs": [[12, "وهذا أيضا ما يعلنه السيد الرب: لأن الأدوميين أقدموا على الانتقام من شعب يهوذا، وأساءوا إليه أشد إساءة."]]}, {"l": "Eze 35:5", "n": "", "vs": [[5, "لأنك أضمرت في نفسك بغضة أبدية، وأسلمت بني إسرائيل إلى حد السيف في أثناء محنتهم، في ساعة دينونة إثمهم."]]}, {"l": "Eze 35:6", "n": "", "vs": [[6, "لذلك حي أنا يقول السيد الرب، إني أعدك لسفك الدم، والدم يتعقبك. لأنك لم تمقت سفك الدم فالدم يتعقبك."]]}, {"l": "Eze 35:12-15", "n": "", "vs": [[12, "فتدرك أني أنا الرب قد سمعت كل إهانتك التي عيرت بها جبال إسرائيل قائلا: قد أصبحت خرابا وصارت لنا مغنما."], [13, "قد تباهيتم علي بأفواهكم، وأكثرتم من لغوكم علي وأنا سمعت."], [14, "ففي موسم الربيع أجعلك مقفرا"], [15, "وكما فرحت لخراب ميراث شعب إسرائيل، كذلك أفعل بك، فتصير ياجبل سعير خرابا أنت وكل بلاد أدوم فتدركون أني أنا الرب»."]]}, {"l": "Amo 1:11", "n": "", "vs": [[11, "وهذا ما يقوله الرب: من أجل معاصي أدوم الثلاث والأربع لن أرد عنهم سخطي، لأنهم تعقبوا إخوتهم بالسيف، وتغاضوا عن كل رحمة، وجعلوا غضبهم يتأجج ملتهما باستمرار، وظلوا حاقدين على الدوام."]]}], "kwAr": "ظلم", "noteAr": ""}, {"kw": "shame", "raw": "Psa_69:7, Psa_89:45, Psa_109:29, Psa_132:18; Jer_3:25, Jer_51:51; Eze_7:18; Mic_7:10", "note": "", "refs": [{"l": "Psa 69:7", "n": "", "vs": [[7, "لأنني تحملت العار من أجلك، وغطى الخجل وجهي."]]}, {"l": "Psa 89:45", "n": "", "vs": [[45, "قصرت أيام شبابه وغطيته بالخزي."]]}, {"l": "Psa 109:29", "n": "", "vs": [[29, "ليكتس خصومي خجلا، وليتلفعوا بخزيهم كالرداء."]]}, {"l": "Psa 132:18", "n": "", "vs": [[18, "أكسو أعداءه خزيا. أما هو، فعلى رأسه يتألق تاجه»."]]}, {"l": "Jer 3:25", "n": "", "vs": [[25, "فلننطرح في خزينا، وليغمرنا عارنا لأننا أخطأنا في حق الرب إلهنا، نحن وآباؤنا منذ صبانا حتى هذا اليوم، ولم نطع صوت الرب إلهنا»."]]}, {"l": "Jer 51:51", "n": "", "vs": [[51, "قد لحقنا الخزي لأننا استمعنا للإهانة، فكسا الخجل وجوهنا، إذ انتهك الغرباء مقادس هيكل الرب."]]}, {"l": "Eze 7:18", "n": "", "vs": [[18, "يتلفعون بالمسوح، ويغشاهم الرعب، ويكسو العار وجوههم جميعا، ويطغى القرع على رؤوسهم."]]}, {"l": "Mic 7:10", "n": "", "vs": [[10, "عندئذ ترى ذلك عدوتي فيعتريها الخزي إذ قالت لي: «أين هو الرب إلهك؟» ستشهدها عيناي تداس كطين الشوارع والأزقة."]]}], "kwAr": "العار", "noteAr": ""}, {"kw": "and", "raw": "Jer_49:13, Jer_49:17-20; Eze_25:13, Eze_25:14, Eze_35:6, Eze_35:7, Eze_35:15; Mal_1:3, Mal_1:4", "note": "", "refs": [{"l": "Jer 49:13", "n": "", "vs": [[13, "ها أنا قد أقسمت بنفسي، يقول الرب، أن تصبح بصرة عرضة للرعب والعار والخراب واللعنة، وتغدو مدنها خرائب دائمة."]]}, {"l": "Jer 49:17-20", "n": "", "vs": [[17, "ستصبح أدوم مثار رعب، وكل من يمر بها تعتريه رعدة، ويصفر من جراء كل نكباتها،"], [18, "ويصيبها ما أصاب سدوم وعمورة وما جاورهما، من انقلاب، يقول الرب، فلا يسكن هناك إنسان ولا يتغرب فيها أحد."], [19, "ها هو ينقض على الأدوميين في مواطن صخورهم كما ينقض فجأة أسد من أجمات نهر الأردن؛ وفي لحظة أطردهم منها وأقيم عليها من أختاره، لأنه من هو مثلي؟ ومن يحاكمني؟ وأي راع يقوى على مواجهتي؟"], [20, "لذلك اسمعوا ما خططه الرب ضد أدوم، وما دبره ضد ساكني تيمان: ها صغار القوم يجرون، وتنهدم مساكنهم عليهم."]]}, {"l": "Eze 25:13", "n": "", "vs": [[13, "ها أنا أعاقب الأدوميين وأستأصل من أرضهم الإنسان والحيوان، وأحولها إلى أطلال دارسة من التيمن إلى ددان، إذ يقتل أهلها جميعا بالسيف."]]}, {"l": "Eze 25:14", "n": "", "vs": [[14, "وأعهد بنقمتي إلى شعبي إسرائيل، فيفعلون بالأدوميين بمقتضى غضبي وسخطي، فيدركون شدة نقمتي، يقول السيد الرب."]]}, {"l": "Eze 35:6", "n": "", "vs": [[6, "لذلك حي أنا يقول السيد الرب، إني أعدك لسفك الدم، والدم يتعقبك. لأنك لم تمقت سفك الدم فالدم يتعقبك."]]}, {"l": "Eze 35:7", "n": "", "vs": [[7, "فأحول جبل سعير إلى أطلال وأستأصل منه كل ذاهب وآيب."]]}, {"l": "Eze 35:15", "n": "", "vs": [[15, "وكما فرحت لخراب ميراث شعب إسرائيل، كذلك أفعل بك، فتصير ياجبل سعير خرابا أنت وكل بلاد أدوم فتدركون أني أنا الرب»."]]}, {"l": "Mal 1:3", "n": "", "vs": [[3, "وأبغضت عيسو، وحولت جباله إلى أراض موحشة، وجعلت ميراثه لبنات آوى البرية."]]}, {"l": "Mal 1:4", "n": "", "vs": [[4, "وإن قال الأدوميون: مع إننا تحطمنا فإننا نبني الخرب، فإن الرب القدير يقول: هم يعمرون وأنا أهدم، ويدعو الناس بلادهم، «أرض النفاق»، وأهلها بالأمة التي سخط الرب عليها إلى الأبد."]]}], "kwAr": "وتنقرض", "noteAr": ""}], "arS": [["فمن أجل ما ", []], ["أنزلت", ["H4480", "H2555"]], [" ", []], ["بأخيك", ["H251"]], [" ", []], ["يعقوب", ["H3290"]], [" من ظلم، ", []], ["يغشاك", ["H3680"]], [" ", []], ["العار", ["H955"]], [" ", []], ["وتنقرض", ["H3772"]], [" إلى ", []], ["الأبد", ["H5769"]], [".", []]]}, {"c": 1, "v": 11, "text": "ففي ذلك اليوم الذي وقفت فيه بعيدا، يوم غنم الغرباء كنوزه، واقتحم الأجانب أبوابه وألقوا القرعة على أورشليم، كنت أنت أيضا كواحد منهم.", "groups": [{"kw": "in the day that the", "raw": "2Ki_24:10-16, 2Ki_25:11; Jer_52:28-30", "note": "", "refs": [{"l": "2Ki 24:10-16", "n": "", "vs": [[10, "وفي أيامه زحف قادة نبوخذناصر ملك بابل على أورشليم وحاصروا المدينة."], [11, "ثم جاء نبوخذناصر ملك بابل بنفسه في أثناء حصار المدينة وتسلم زمام القيادة،"], [12, "فاستسلم يهوياكين ملك يهوذا وأمه ورجاله وقادته وخصيانه إلى ملك بابل، فقبض عليه نبوخذناصر. وكان ذلك في السنة الثامنة لملكه."], [13, "واستولى على جميع ما في خزائن الهيكل وخزائن القصر، وحطم كل آنية الذهب التي صنعها سليمان ملك إسرائيل لهيكل الرب، تماما كما قضى الرب."], [14, "وسبى نبوخذناصر أهل أورشليم، وكل الرؤساء، وجميع رجال الحرب الأشداء، والخصيان. فكانت جملة المسبيين عشرة آلاف مسبي، كما أخذ الصناع والحدادين، ولم يترك في يهوذا سوى فقراء الشعب المساكين."], [15, "وسبى يهوياكين وأم الملك ونساءه وخصيانه وعظماء البلاد من أورشليم إلى بابل."], [16, "كما ساق سبعة آلاف من المحاربين الأشداء وألفا من الصناع والحدادين إلى بابل،"]]}, {"l": "2Ki 25:11", "n": "", "vs": [[11, "وسبى نبوزرادان بقية الشعب الذي بقي في المدينة، والهاربين الذين لجأوا إلى ملك بابل وسواهم من السكان."]]}, {"l": "Jer 52:28-30", "n": "", "vs": [[28, "وهذا هو إحصاء الشعب الذين سباهم نبوخذناصر في السنة السابعة: ثلاثة آلاف وثلاثة وعشرون من اليهود."], [29, "وسبى نبوخذناصر من أورشليم في السنة الثامنة عشرة لحكمه ثماني مئة واثنين وثلاثين شخصا."], [30, "وفي السنة الثالثة والعشرين لحكم نبوخذناصر سبى نبوزرادان رئيس الشرط n": "", "vs": [[25, "«ها أيام مقبلة»، يقول الرب، «أعاقب فيها كل مختون وأغلف"]]}, {"l": "Jer 9:26", "n": "", "vs": [[26, "أهل مصر ويهوذا وأدوم وبني عمون وموآب، وسائر المقيمين في الصحراء ممن يقصون شعر أصداغهم، لأن جميع الشعوب غلف، أما كل بيت إسرائيل فإنهم ذوو قلوب غلفاء»."]]}, {"l": "Jer 25:15-29", "n": "", "vs": [[15, "وهذا ما أعلنه لي الرب إله إسرائيل: «خذ كأس خمر غضبي من يدي، واسق منها جميع الأمم التي أرسلك إليها،"], [16, "فتشرب وتترنح، وتجن بفعل السيف الذي أرسله بينها»."], [17, "فتناولت الكأس من يد الرب وسقيت منها جميع الأمم التي بعثني إليها الرب:"], [18, "أورشليم ومدن يهوذا وملوكها وعظماءها، لأجعلها قفرا خرابا ومثار صفير ولعنة إلى هذا اليوم."], [19, "وسقيت منها كذلك فرعون ملك مصر وخدامه وعظماءه وكل شعبه،"], [20, "وكل الغرباء المقيمين في وسطهم، وجميع ملوك أرض عوص، وسائر ملوك الفلسطينيين: ملوك أشقلون، وغزة، وعقرون وبقية أشدود،"], [21, "وآدوم، وموآب، وبني عمون،"], [22, "وكل ملوك صور وصيدون وملوك الجزائر عبر البحر،"], [23, "وددان وتيماء وبوز، وكل ذوي الشعر المقصوص الزوايا،"], [24, "وكل ملوك العرب، وسائر ملوك القبائل المنضمة إليهم المقيمين في الصحراء،"], [25, "وكل ملوك زمري، وعيلام، وجميع ملوك مادي."], [26, "وكل ملوك الشمال، القريبين والبعيدين، الواحد تلو الآخر، وكل الممالك المنتشرة على وجه الأرض. ثم بعد ذلك يشرب منها ملك بابل."], [27, "ثم قل لهم، هذا ما يعلنه الرب القدير إله إسر ائيل: اشربوا واثملوا وتقيأوا واسقطوا صرعى، ولا تقوموا من جراء السيف الذي أرسله في وسطكم."], [28, "وإن أبوا أن يتناولوا الكأس من يدك ليشربوا منها، فقل لهم: هذا ما يعلنه الرب القدير: لابد لكم من شربها،"], [29, "لأني شرعت أعاقب المدينة التي دعي اسمي عليها، فهل تفلتون أنتم من العقاب؟ فها أنا قد سلطت السيف على جميع سكان الأرض، يقول الرب القدير."]]}, {"l": "Jer 49:12", "n": "", "vs": [[12, "لأن هذا ما يعلنه الرب: إن كان الذين لا يستحقون تجرع كأس العقاب قد تجرعوه، أتفلت أنت من العقاب؟ إنك لن تفلت من العقاب، بل عليك أن تجرعه حتما."]]}, {"l": "Lam 4:21", "n": "", "vs": [[21, "ابتهجي وافرحي ياابنة أدوم، ياساكنة عوص. إنما هذه الكأس ستجوز عليك أيضا فتسكرين وتتعرين."]]}, {"l": "Lam 4:22", "n": "", "vs": [  [[7, "وها أنا الآن أنهضهم من الموضع حيث بعتموهم، وأرد على رؤوسكم سوء أعمالكم."]]}, {"l": "Joe 3:8", "n": "", "vs": [[8, "وأبيع أبناءكم وبناتكم بأيدي أبناء يهوذا، فيبيعونهم بدورهم إلى السبئيين، إلى أمة بعيدة، لأن الرب قد أصدر قضاءه."]]}, {"l": "Hab 2:8", "n": "", "vs": [[8, "لأنك سلبت أمما كثيرة فإن بقية الشعوب ينهبونك ثأرا لما سفكت من دماء وارتكبت من جور في الأرض، فدمرت مدنا وأهلكت الساكنين فيها."]]}, {"l": "Mat 7:2", "n": "", "vs": [[2, "فإنكم بالدينونة التي بها تدينون تدانون؛ وبالكيل الذي به تكيلون يكال لكم."]]}, {"l": "Jam 2:13", "n": "", "vs": [[13, "فلابد أن يكون الحكم على الذين لا يمارسون الرحمة، حكما خاليا من الرحمة، أما الرحمة فهي تتفوق على الحكم!"]]}], "kwAr": "وكما", "noteAr": ""}], "arS": [["لأن يوم الرب ", []], ["قريب", ["H7138"]], [" آت على كل ", []], ["الأمم", ["H1471"]], ["، وكما ", []], ["فعلت", ["H6213"]], ["، لابد أن ", []], ["يفعل", ["H6213"]], [" بك أيضا، ", []], ["فيرتد", ["H7725"]], [" ", []], ["عملك", ["H1576"]], [" على ", []], ["رأسك", ["H7218"]], [".", []]]}, {"c": 1, "v": 16, "text": "فإنه كما شربت على جبل قدسي فإن جميع الأمم تشرب في كل حين. يشربون ويجرعون ويتلاشون كمن لم يكونوا.", "groups": [{"kw": "as ye", "raw": "Psa_75:8, Psa_75:9; Isa_49:25, Isa_49:26, Isa_51:22, Isa_51:23; Jer_25:15, Jer_25:16, Jer_25:27-29, Jer_49:12; Joe_3:17; 1Pe_4:17", "note": "", "refs": [{"l": "Psa 75:8", "n": "", "vs": [[8, "في يد الرب كأس خمر مزبدة ممزوجة. يصبها فيشربها كل الأشرار حتى ثمالتها."]]}, {"l": "Psa 75:9", "n": "", "vs": [[9, "أما أنا فلن أكف عن الحديث عن إله يعقوب. أرنم له دائما."]]}, {"l": "Isa 49:25", "n": "", "vs": [[25, "نعم سبي الجبار يسلب منه، وتسترد الغنيمة من الغالب، لأنني أخاصم مخاصميك وأنقذ أبناءك،"]]}, {"l": "Isa 49:26", "n": "", "vs": [[26, "وأجعل مضطهديك يلتهمون لحوم أجسادهم، ويسكرون بدمهم كمن يشرب خمرا. عندئذ يدرك كل ذي جسد أنني أنا الرب مخلصك وفاديك إله يعقوب القدير."]]}, {"l": "Isa 51:22", "n": "", "vs": [[22, "هذا ما يقوله سيدك الرب، إلهك الذي يدافع عن دعوى شعبه: ها أنا قد أخذت من يدك كأس الترنح، ولن تجرعي من كأس غضبي بعد."]]}, {"l": "Isa 51:23", "n": "", "vs": [[23, "وأضعها في يد معذبيك الذين قالوا لك: انحني حتى ندوس عليك عابرين. فجعلت ظهرك لهم أرضا، وطريقا لهم يمرون عليه."]]}, {"l": "Jer 25:15", "n": "", "vs": [[15, "وهذا ما أعلنه لي الرب إله إسرائيل: «خذ كأس خمر غضبي من يدي، واسق منها جميع الأمم التي أرسلك إليها،"]]}, {"l": "Jer 25:16", "n": "", "vs": [[16, "فتشرب وتترنح، وتجن بفعل السيف الذي أرسله بينها»."]]}, {"l": "Jer 25:27-29", "n": "", "vs": [[27, "ثم قل لهم، هذا ما يعلنه الرب القدير إله إسر ائيل: اشربوا واثملوا وتقيأوا واسقطوا صرعى، ولا تقوموا من جراء السيف الذي أرسله في وسطكم."], [28, "وإن أبوا أن يتناولوا الكأس من يدك ليشربوا منها، فقل لهم: هذا ما يعلنه الرب القدير: لابد لكم من شربها،"], [29, "لأني شرعت أعاقب المدينة التي دعي اسمي عليها، فهل تفلتون أنتم من العقاب؟ فها أنا قد سلطت السيف على جميع سكان الأرض، يقول الرب القدير."]]}, {"l": "Jer 49:12", "n": "", "vs": [[12, "لأن هذا ما يعلنه الرب: إن كان الذين لا يستحقون تجرع كأس العقاب قد تجرعوه، أتفلت أنت من العقاب؟ إنك لن تفلت من العقاب، بل عليك أن تجرعه حتما."]]}, {"l": "Joe 3:17", "n": "", "vs": [[17, "فتدركون أني أنا هو الرب إلهكم الساكن في صهيون جبلي المقدس، وتكون أورشليم مقدسة ولا يجتاز فيها الغرباء أبدا."]]}, {"l": "1Pe 4:17", "n": "", "vs": [[17, "حقا إن الوقت قد حان ليبتديء القضاء بأهل بيت الله. فإن كان القضاء يبدأ بنا أولا، فما هو مصير الذين لا يؤمنون بإنجيل الله؟"]]}], "kwAr": "فإنه كما", "noteAr": ""}, {"kw": "swallow down", "raw": "or, sup up, Isa_42:14 *marg. Hab_1:9", "note": "or, sup up, Isa_42:14 *marg. Hab_1:9", "refs": [{"l": "Isa 42:14", "n": "*marg.", "vs": [[14, "لكم اعتصمت بالصمت، ولزمت السكينة ولجمت نفسي. أما الآن فأنا أصيح وأزفر كامرأة تقاسي من المخاض."]]}, {"l": "Hab 1:9", "n": "", "vs": [[9, "يقبلون جميعهم ليعيثوا فسادا، ويطغى الرعب منهم على قلوب الناس قبل وصولهم، فيجمعون أسرى كالرمل."]]}], "kwAr": "ويجرعون", "noteAr": "أو: «يرشفون». انظر إش 42: 14؛ حب 1: 9"}, {"kw": "and they shall be", "raw": "Isa_8:9, Isa_8:10, Isa_29:7, Isa_29:8", "note": "", "refs": [{"l": "Isa 8:9", "n": "", "vs": [[9, "افعلوا ما شئتم أيها الشعوب وانهزموا. أصغي ياجميع أقاصي الأرض. تأهبوا للمعركة وانهزموا."]]}, {"l": "Isa 8:10", "n": "", "vs": [[10, "تشاوروا معا ولكن على غير طائل، ارسموا الخطط فلا تتحقق لأن الله معنا."]]}, {"l": "Isa 29:7", "n": "", "vs": [[7, "وتصبح كل الشعوب التي تحارب أورشليم، وتحاصر حصونها كالحلم أو كرؤيا الليل."]]}, {"l": "Isa 29:8", "n": "", "vs": [[8, "وكما يحلم الجائع أنه يأكل ثم يستيقظ من غير أن يشبع جوعه، وكما يحلم الظاميء أنه يشرب ثم يفيق من غير أن يرتوي عطشه، هكذا يكون جمهور الأمم كلها المتألبين على جبل صهيون."]]}], "kwAr": "ويتلاشون", "noteAr": ""}], "arS": [["فإنه كما ", []], ["شربت", ["H8354"]], [" على ", []], ["جبل", ["H2022"]], [" ", []], ["قدسي", ["H6944"]], [" فإن جميع ", []], ["الأمم", ["H1471"]], [" ", []], ["تشرب", ["H8354"]], [" في كل ", []], ["حين", ["H8548"]], [". ", []], ["يشربون", ["H8354"]], [" ", []], ["ويجرعون", ["H3886"]], [" ", []], ["ويتلاشون", ["H1961"]], [" كمن لم ", []], ["يكونوا", ["H1961"]], [".", []]]}, {"c": 1, "v": 17, "text": "أما جبل صهيون فيصبح ملاذ النجاة، ويكون قدسا، ويرث بيت يعقوب نصيبه.", "groups": [{"kw": "upon", "raw": "Isa_46:13; Joe_2:32", "note": "", "refs": [{"l": "Isa 46:13", "n": "", "vs": [[13, "لقد جعلت أوان بري قريبا. لم يعد بعيدا، وخلاصي لا يبطيء. سأجعل خلاصا في صهيون، وفي إسرائيل مجدي."]]}, {"l": "Joe 2:32", "n": "", "vs": [[32, "إنما كل من يدعو باسم الرب يخلص، لأن النجاة تكون في جبل صهيون وفي أورشليم، كما قال الرب، إذ يكون بين الناجين من يدعوه الرب."]]}], "kwAr": "أما", "noteAr": ""}, {"kw": "shall be", "raw": "Jer_46:28; Amo_9:8", "note": "", "refs": [{"l": "Jer 46:28", "n": "", "vs": [[28, "لا تخافوا ياذرية عبدي يعقوب، يقول الرب، لأني معكم وأفني جميع الأمم التي شتتكم إليها. أما أنتم فلا أفنيكم بل أؤدبكم بالحق، إنما لا أبرئكم جميعا»."]]}, {"l": "Amo 9:8", "n": "", "vs": [[8, "ها إن عيني الرب مسلطتان على المملكة الخاطئة لأمحوها عن وجه الأرض، إلا أني لن أستأصل بيت يعقوب قاطبة يقول الرب."]]}], "kwAr": "فيصبح", "noteAr": ""}, {"kw": "deliverance", "raw": "or, they that escape, Jer_44:14, Jer_44:28; Eze_7:16", "note": "or, they that escape, Jer_44:14, Jer_44:28; Eze_7:16", "refs": [{"l": "Jer 44:14", "n": "", "vs": [[14, "فلا يفلت منهم ناج، ولا يسلم أحد من بقية يهوذا المرتحلين ليتغربوا هناك في مصر، ليرجع إلى أرض يهوذا التي يتوق للعودة إليها والإقامة فيها، لأنه لن يرجع إليها إلا قلة من الطريدين»."]]}, {"l": "Jer 44:28", "n": "", "vs": [[28, "وترجع القلة الناجية من السيف من مصر إلى أرض يهوذا، فتعلم كل بقية يهوذا الذين هاجروا إلى مصر ليتغربوا فيها أي كلام يتحقق: كلامي أم كلامهم؟»"]]}, {"l": "Eze 7:16", "n": "", "vs": [[16, "أما الناجون منهم فيلوذون بالجبال كحمام الأودية، يبكي كل واحد منهم على إثمه."]]}], "kwAr": "النجاة", "noteAr": "أو: «الناجون». انظر إر 44: 14، 28؛ حز 7: 16"}, {"kw": "there shall be holiness", "raw": "or, it shall be holy, Isa_1:27, Isa_4:3, Isa_4:4, Isa_60:21; Joe_3:17; Zec_8:3, Zec_14:20,Zec_14:21; Rev_21:27", "note": "or, it shall be holy, Isa_1:27, Isa_4:3, Isa_4:4, Isa_60:21; Joe_3:17; Zec_8:3, Zec_14:20,Zec_14:21; Rev_21:27", "refs": [{"l": "Isa 1:27", "n": "", "vs": [[27, "فتفدى صهيون بالحق، وتائبوها بالبر."]]}, {"l": "Isa 4:3", "n": "", "vs": [[3, "ويدعى كل من يبقى في صهيون ممن مكث في أورشليم قدوسا، كل من كتب للحياة في أورشليم،"]]}, {"l": "Isa 4:4", "n": "", "vs": [[4, "إذ يغسل الرب قذر بنات صهيون، ويطهر أورشليم من لطخات الدماء بروح العدل وبروح النار المحرقة."]]}, {"l": "Isa 60:21", "n": "", "vs": [[21, "ويكون شعبك جميعا أبرارا ويرثون الأرض إلى الأبد، فهم غصن غرسي وعمل يدي لأتمجد."]]}, {"l": "Joe 3:17", "n": "", "vs": [[17, "فتدركون أني أنا هو الرب إلهكم الساكن في صهيون جبلي المقدس، وتكون أورشليم مقدسة ولا يجتاز فيها الغرباء أبدا."]]}, {"l": "Zec 8:3", "n": "", "vs": [[3, "لهذا يقول الرب القدير: ها أنا عائد إلى صهيون لأقيم في أورشليم، فتدعى آنئذ مدينة الحق، كما يدعى جبل الرب القدير الجبل المقدس."]]}, {"l": "Zec 14:20", "n": "", "vs": [[20, "وينقش في ذلك اليوم على أجراس الخيل: «قدس للرب». وتكون القدور في الهيكل مقدسة كالمناضح التي أمام المذبح."]]}, {"l": "Zec 14:21", "n": "", "vs": [[21, "بل يكون كل قدر في أورشليم وفي يهوذا مقدسا للرب القدير، فيصبح في وسع المقربين أن يأتوا ويستخدموا ما يشاؤون منها، ليطبخوا فيها لحم الذبيحة. ولا يبقى في هيكل الرب القدير تجار في ذلك اليوم."]]}, {"l": "Rev 21:27", "n": "", "vs": [[27, "ولن يدخلها شيء نجس، ولا الذين يعملون القبائح ويدجلون، بل فقط الذين كتبت أسماؤهم في سجل الحياة للحمل!"]]}], "kwAr": "ويكون قدسا", "noteAr": "أو: «يصير مقدسا». انظر إش 1: 27؛ 4: 3، 4؛ 60: 21؛ يوء 3: 17؛ زك 8: 3؛ 14: 20، 21؛ رؤ 21: 27"}, {"kw": "possess", "raw": "Isa_14:1, Isa_14:2; Joe_3:19-21; Amo_9:11-15", "note": "", "refs": [{"l": "Isa 14:1", "n": "", "vs": [[1, "ولكن الرب ينعم برحمته على ذرية يعقوب، ويصطفي شعب إسرائيل ثانية ويحلهم في أرضهم، فينضم الغرباء إليهم ويلحقون ببيت يعقوب."]]}, {"l": "Isa 14:2", "n": "", "vs": [[2, "وتمد شعوب الأرض إليهم يد العون ليساعدوا إسرائيل على العودة لدياره. ويصيرون عبيدا لبني إسرائيل، في أرض الرب، ويتسلطون على آسريهم وظالميهم."]]}, {"l": "Joe 3:19-21", "n": "", "vs": [[19, "وتصبح مصر خرابا، وأدوم قفرا موحشا لفرط ما أنزلوه من ظلم بأبناء يهوذا، ولأنهم سفكوا دما بريئا في ديارهم."], [20, "أما يهوذا فإنه يسكن الأرض إلى الأبد، وتعمر أورشليم مدى الأجيال."], [21, "وأزكي دمهم الذي لم أبرئه، لأن الرب يسكن في صهيون."]]}, {"l": "Amo 9:11-15", "n": "", "vs": [[11, "في ذلك اليوم أقيم مسكن داود الذي تهاوى، وأسد ثغراته وأعمر خرائبه وأعيد بناءه كالعهد به في الأيام الغابرة."], [12, "لكي يرث إسرائيل ما تبقى من أدوم وجميع الأمم التي دعي اسمي عليها، يقول الرب صانع هذه الأمور."], [13, "ها أيام تأتي يقول الرب، يدرك فيها الحارث الحاصد، ودائس العنب باذر الحب، وتسيل الخمور الطيبة من كروم الجبال وتفيض بها التلال كلها."], [14, "وأرد سبي شعبي إسرائيل فيعيدون بناء المدن الخربة ويسكنونها، ويزرعون كروما ويشربون من خمرها، ويغرسون جنات ويأكلون من ثمارها."], [15, "وأغرس شعبي في أرضهم فلا يستأصلون ثانية أبدا من الأرض التي وهبتها لهم، يقول الرب إلهكم."]]}], "kwAr": "يرث", "noteAr": ""}], "arS": [["أما ", []], ["جبل", ["H2022"]], [" ", []], ["صهيون", ["H6726"]], [" ", []], ["فيصبح", ["H1961"]], [" ", []], ["ملاذ", ["H6413"]], [" ", []], ["النجاة", ["H6413"]], ["، ويكون ", []], ["قدسا", ["H6944"]], ["، ", []], ["ويرث", ["H3423"]], [" ", []], ["بيت", ["H1004"]], [" ", []], ["يعقوب", ["H3290"]], [" ", []], ["نصيبه", ["H4180"]], [".", []]]}, {"c": 1, "v": 18, "text": "ويصير بيت يعقوب نارا، وبيت يوسف لهيبا، وبيت عيسو قشا فيوقدونهم ويلتهمونهم، ولا يفلت من بيت عيسو أحد، يقول الرب.", "groups": [{"kw": "shall be", "raw": "Isa_10:17, Isa_31:9; Mic_5:8; Zec_12:6", "note": "", "refs": [{"l": "Isa 10:17", "n": "", "vs": [[17, "فيصبح نور إسرائيل نارا، وقدوسه لهيبا، فتشتعل وتلتهم شوكه وحسكه في يوم واحد،"]]}, {"l": "Isa 31:9", "n": "", "vs": [[9, "وتفنى صخورهم من الفزع، ويولي قادتهم الأدبار عندما يرون علم إسرائيل». هذا ما يقوله الرب الذي ناره في صهيون، وتنوره في أورشليم."]]}, {"l": "Mic 5:8", "n": "", "vs": [[8, "وتكون بقية ذرية يعقوب بين الشعوب الكثيرة كأسد بين وحوش الغابة، أو كشبل بين قطعان الغنم، الذي إن اقتحم يدوس ويفترس وليس من منقذ."]]}, {"l": "Zec 12:6", "n": "", "vs": [[6, "في ذلك اليوم أجعل عشائر يهوذا كمستوقد نار بين الحطب، أو كمشعل ملتهب بين أكداس الحنطة، فيلتهمون الشعوب من حولهم ممن عن يمينهم وعن يسارهم، بينما تظل أورشليم مستقرة آمنة آهلة في موضعها."]]}], "kwAr": "ويصير", "noteAr": ""}, {"kw": "the house of Joseph", "raw": "2Sa_19:20; Eze_37:16, Eze_37:19; Amo_5:15, Amo_6:6", "note": "", "refs": [{"l": "2Sa 19:20", "n": "", "vs": [[20, "لأن عبدك قد أدرك أني قد أخطأت، ها أنا قد جئت اليوم في طليعة بيت يوسف لاستقبال سيدي الملك»."]]}, {"l": "Eze 37:16", "n": "", "vs": [[16, "«وأنت ياابن آدم، خذ لك قضيبا واحدا واكتب عليه: هذا ليهوذا ولأبناء إسرائيل رفاقه، ثم خذ قضيبا آخر واكتب عليه: هذا ليوسف قضيب أفرايم وكل شعب إسرائيل رفاقه."]]}, {"l": "Eze 37:19", "n": "", "vs": [[19, "فقل لهم: هذا ما يعلنه السيد الرب: ها أنا أتناول قضيب يوسف الذي في حوزة أفرايم وأسباط إسرائيل رفاقه، وأضم إليه قضيب يهوذا، وأجعلهم جميعا قضيبا واحدا فيصبحون واحدا في يدي."]]}, {"l": "Amo 5:15", "n": "", "vs": [[15, "امقتوا الشر وأحبوا الخير وأقيموا العدل في ساحة القضاء، لعل الرب الإله القدير يترفق على بقية بيت يوسف."]]}, {"l": "Amo 6:6", "n": "", "vs": [[6, "الشاربين خمرا في كؤوس، المتطيبين بأفضل العطور، ولا يكتئبون على خراب يوسف."]]}], "kwAr": "بيت يوسف", "noteAr": ""}, {"kw": "for stubble", "raw": "Psa_83:6-15; Isa_5:24, Isa_47:14; Joe_2:5; Nah_1:10; 1Co_3:12", "note": "", "refs": [{"l": "Psa 83:6-15", "n": "", "vs": [[6, "عشائر أدوم وبنو إسماعيل، نسل موآب وبنو هاجر."], [7, "جبال وعمون وعماليق، الفلسطينيون وأهل صور،"], [8, "وقوم أشور أيضا انضموا إليهم، صاروا عونا لبني لوط."], [9, "افعل بهم كما فعلت بمديان وسيسرا ويابين في نهر قيشون."], [10, "بادوا في عين دور، وصاروا زبلا للأرض."], [11, "اجعل مصير أشرافهم كمصير غراب وذئب، وجميع أمرائهم مثل زبح وصلمناع، الذين قالوا: لنستول على مساكن الله."], [12, ""], [13, "ياإلهي، بددهم كالقش المتطاير، وكالتبن في مهب الريح."], [14, "كما تحرق النار الغابة، وكما يشعل لهيبها الجبال،"], [15, "هكذا طاردهم بعاصفتك، وأفزعهم بزوبعتك."]]}, {"l": "Isa 5:24", "n": "", "vs": [[24, "لهذا كما تلتهم النار القش، وكما يفنى الحشيش الجاف في اللهب، كذلك يصيب أصولهم العفن، ويتناثر زهرهم كالتراب، لأنهم نبذوا شريعة الله واستهانوا بكلمة قدوس إسرائيل"]]}, {"l": "Isa 47:14", "n": "", "vs": [[14, "غير أنهم أنفسهم أصبحوا كالهشيم الذي تلتهمه النار عاجزين عن إنقاذ أنفسهم وإنقاذك من شدة اللهب المحرق، فلا هو جمر للاستدفاء ولا هي نار للجلوس حولها."]]}, {"l": "Joe 2:5", "n": "", "vs": [[5, "يثبون على رؤوس الجبال في جلبة كجلبة المركبات، كفرقعة لهيب نار يلتهم القش، وكجيش عات مصطف للقتال."]]}, {"l": "Nah 1:10", "n": "", "vs": [[10, "وتلتهمهم النار كما تلتهم شجرة عليق كثيفة أو سكارى مترنحين من خمرهم أو حزمة قش جافة."]]}, {"l": "1Co 3:12", "n": "", "vs": [[12, "فإن بنى أحد على هذا الأساس ذهبا وفضة وحجارة كريمة، أو خشبا وعشبا وقشا،"]]}], "kwAr": "قشا", "noteAr": ""}, {"kw": "and there", "raw": "Oba_1:9, Oba_1:10,Oba_1:16", "note": "", "refs": [{"l": "Oba 1:9", "n": "", "vs": [[9, "فيرتعب أبطالك ياتيمان حتى ينقرض قتلا كل رجل من جبل عيسو."]]}, {"l": "Oba 1:10", "n": "", "vs": [[10, "فمن أجل ما أنزلت بأخيك يعقوب من ظلم، يغشاك العار وتنقرض إلى الأبد."]]}, {"l": "Oba 1:16", "n": "", "vs": [[16, "فإنه كما شربت على جبل قدسي فإن جميع الأمم تشرب في كل حين. يشربون ويجرعون ويتلاشون كمن لم يكونوا."]]}], "kwAr": "ولا", "noteAr": ""}], "arS": [["ويصير", ["H1961"]], [" ", []], ["بيت", ["H1004"]], [" ", []], ["يعقوب", ["H3290"]], [" ", []], ["نارا", ["H784"]], ["، وبيت ", []], ["يوسف", ["H3130"]], [" ", []], ["لهيبا", ["H3852"]], ["، وبيت ", []], ["عيسو", ["H6215"]], [" ", []], ["قشا", ["H7179"]], [" ", []], ["فيوقدونهم", ["H1814"]], [" ", []], ["ويلتهمونهم", ["H398"]], ["، ولا ", []], ["يفلت", ["H8300"]], [" من بيت عيسو أحد، ", []], ["يقول", ["H1696"]], [" ", []], ["الرب", ["H3068"]], [".", []]]}, {"c": 1, "v": 19, "text": "ويرث أهل النقب جبل عيسو، وسكان السهول أرض الفلسطينيين، ويملكون أرض أفرايم وبلاد السامرة، ويرث بنيامين جلعاد.", "groups": [{"kw": "the south", "raw": "Num_24:18, Num_24:19; Jos_15:21; Jer_32:44; Amo_9:12; Mal_1:4, Mal_1:5", "note": "", "refs": [{"l": "Num 24:18", "n": "", "vs": [[18, "ويرث أرض أدوم، ويتملك ديار سعير. أما إسرائيل فيزداد قوة."]]}, {"l": "Num 24:19", "n": "", "vs": [[19, "ويبرز حاكم من يعقوب فيدمر ما تبقى من مدن (الأعداء)»."]]}, {"l": "Jos 15:21", "n": "", "vs": [[21, "كانت المدن القصية التابعة لسبط يهوذا جنوبا باتجاه تخوم أدوم هي: قبصئيل وعيدر وياجور،"]]}, {"l": "Jer 32:44", "n": "", "vs": [[44, "فتشترى الحقول بفضة، وتسجل بنود العقود في الصكوك وتختم، ويوقع الشهود في أرض بنيامين والقرى المجاورة لأورشليم، وفي مدن يهوذا وفي المناطق الجبلية وفي مدن السهل، ومدن الجنوب لأني أرد سبيهم، يقول الرب»."]]}, {"l": "Amo 9:12", "n": "", "vs": [[12, "لكي يرث إسرائيل ما تبقى من أدوم وجميع الأمم التي دعي اسمي عليها، يقول الرب صانع هذه الأمور."]]}, {"l": "Mal 1:4", "n": "", "vs": [[4, "وإن قال الأدوميون: مع إننا تحطمنا فإننا نبني الخرب، فإن الرب القدير يقول: هم يعمرون وأنا أهدم، ويدعو الناس بلادهم، «أرض النفاق»، وأهلها بالأمة التي سخط الرب عليها إلى الأبد."]]}, {"l": "Mal 1:5", "n": "", "vs": [[5, "وتشهد عيونكم هذا، وتقولون ما أعظم الرب الذي يمتد سلطانه إلى ما وراء تخوم إسرائيل."]]}], "kwAr": "أهل النقب", "noteAr": ""}, {"kw": "the plain", "raw": "Jos_13:2, Jos_13:3, Jos_15:33, Jos_15:45, Jos_15:46; Jdg_1:18, Jdg_1:19; Isa_11:13, Isa_11:14; Eze_25:16; Amo_1:8; Zep_2:4-7; Zec_9:5-7", "note": "", "refs": [{"l": "Jos 13:2", "n": "", "vs": [[2, "وهذه هي الأرض المتبقية: كل مناطق أرض الفلسطينيين والجشوريين،"]]}, {"l": "Jos 13:3", "n": "", "vs": [[3, "الممتدة من نهر شيحور شرقي مصر حتى إقليم عقرون شمالا، وجميعها تعتبر ملكا للكنعانيين. وهي مناطق للحكام الفلسطينيين الخمسة المقيمين في غزة وأشدود وأشقلون وجت وعقرون والعويين،"]]}, {"l": "Jos 15:33", "n": "", "vs": [[33, "أما مدن السهل الغربي فكانت: أشتأول وصرعة وأشنة،"]]}, {"l": "Jos 15:45", "n": "", "vs": [[45, "وكذلك عقرون وقراها وضياعها"]]}, {"l": "Jos 15:46", "n": "", "vs": [[46, "كما اشتملت حدود سبط يهوذا من عقرون غربا، على كل المنطقة المجاورة لأشدود وضياعها."]]}, {"l": "Jdg 1:18", "n": "", "vs": [[18, "واستولى رجال يهوذا على غزة وتخومها وأشقلون وتخومها وعقرون وتخومها."]]}, {"l": "Jdg 1:19", "n": "", "vs": [[19, "وكان الرب مع أبناء يهوذا فتملكوا الجبل، ولكنهم أخفقوا في طرد سكان الوادي لأنهم كانوا يملكون مركبات حديدية."]]}, {"l": "Isa 11:13", "n": "", "vs": [[13, "فيتلاشى حسد أفرايم، وتزول عداوة يهوذا، فلا أفرايم يحسد يهوذا، ولا يهوذا يعادي أفرايم،"]]}, {"l": "Isa 11:14", "n": "", "vs": [[14, "وينقضان على أكتاف الفلسطينيين غربا ويغزوان أبناء المشرق معا، ويستوليان على بلاد أدوم وموآب، ويخضع لهم بنو عمون."]]}, {"l": "Eze 25:16", "n": "", "vs": [[16, "ها أنا أعاقب الفلسطينيين وأستأصل الكريتيين، وأبيد بقية سكان ساحل البحر،"]]}, {"l": "Amo 1:8", "n": "", "vs": [[8, "وأستأصل أهل أشدود، وأهلك حامل صولجان ملك أشقلون، وأوجه ضرباتي ضد عقرون فيفنى من بقي من الفلسطينيين."]]}, {"l": "Zep 2:4-7", "n": "", "vs": [[4, "فإن غزة تصبح مهجورة، وأشقلون موحشة، وأهل أشدود يطردون عند الظهيرة، وعقرون تستأصل."], [5, "ويل لكم ياأهل ساحل البحر، أمة الكريتيين. إن قضاء الرب منصب عليكم ياسكان كنعان أرض الفلسطينيين. سأدمرك حتى لا يبقى فيك مقيم."], [6, "وأنت ياأرض ساحل البحر تصبحين مراعي ومروجا للرعاة وحظائر للمواشي."], [7, "ويصبح ساحل البحر ملكا لبقية بيت يهوذا فيرعون فيه قطعانهم، ويرقدون في المساء في بيوت أشقلون، لأن الرب إلههم يفتقدهم ويرد سبيهم."]]}, {"l": "Zec 9:5-7", "n": "", "vs": [[5, "فتشهد مدينة أشقلون هذا فتفزع، وتتلوى غزة ألما. تتوجع عقرون أيضا لأن رجاءها قد تبدد. يهلك ملك غزة وتصبح أشقلون موحشة."], [6, "ويستوطن الزنيم في أشدود، ويستأصل الرب كبرياء الفلسطينيين."], [7, "لا يعودون يأكلون لحما بدمه أو طعاما نجسا ويصبحون هم أيضا بقية ناجية للرب، يصيرون كعشيرة في سبط يهوذا، وتغدو عقرون نظير اليبوسيين."]]}], "kwAr": "وسكان السهول", "noteAr": ""}, {"kw": "the fields of Ephraim", "raw": "2Ki_17:24; Ezr_4:2, Ezr_4:7-10,Ezr_4:17; Psa_69:35; Jer_31:4-6; Eze_36:6-12, Eze_36:28; Eze_37:21-25, Eze_47:13-21, Eze_48:1-9", "note": "", "refs": [{"l": "2Ki 17:24", "n": "", "vs": [[24, "ونقل ملك أشور أقواما من بابل وكوث وعوا وحماة وسفروايم، وأسكنهم مدن السامرة محل بني إسرائيل، فاستولوا على السامرة وأقاموا في مدنها."]]}, {"l": "Ezr 4:2", "n": "", "vs": [[2, "أقبلوا إلى زربابل ورؤساء العشائر قائلين لهم: «دعونا نبني معكم، لأننا مثلكم نعبد إلهكم، وله قربنا الذبائح منذ أيام الملك أسرحدون ملك أشور، الذي أتى بنا إلى هذه الأرض»."]]}, {"l": "Ezr 4:7-10", "n": "", "vs": [[7, "وفي عهد أرتحششتا، كتب بشلام ومثرداث وطبئيل وسائر رفقائهم، رسالة باللغة الأرامية رفعت إلى أرتحششتا الملك مترجمة،"], [8, "كما كتب رحوم المتولي شؤون القضاء، وشمشاي الكاتب رسالة ضد أورشليم، عرضت على الملك أرتحششتا جاء فيها:"], [9, "«من رحوم الوالي، وشمشاي الكاتب وسائر رفقائهما القضاة والأفرستكيين والطرفليين والأفرسيين والأركويين والبابليين والشوشنيين والدهويين والعيلاميين،"], [10, "وبقية الأمم الذين أجلاهم أسنفر العظيم النبيل، وأسكنهم في مدن السامرة، وسائر الذين يقيمون في عبر نهر الفرات»."]]}, {"l": "Ezr 4:17", "n": "", "vs": [[17, "فبعث الملك جوابا إلى رحوم الوالي وشمشاي الكاتب وسائر رفقائهما المقيمين في السامرة وإلى باقي القاطنين في عبر نهر الفرات، قال فيها: «سلام وبعد،"]]}, {"l": "Psa 69:35", "n": "", "vs": [[35, "لأن الله يخلص صهيون ويبني مدن يهوذا، فيسكن الشعب فيها ويمتلكها."]]}, {"l": "Jer 31:4-6", "n": "", "vs": [[4, "لهذا أبنيك ياعذراء إسرائيل (أي أورشليم) فتبنين، وتتزينين ثانية بدفوفك، وتبرزين في مراقص الطربين."], [5, "تغرسين كروما ثانية فوق جبال السامرة. يغرس الفلاحون ويجنون الثمار."], [6, "لأنه سيأتي يوم ينادي فيه المراقبون في جبل أفرايم قائلين: هلموا فنصعد إلى صهيون إلى الرب إلهنا»."]]}, {"l": "Eze 36:6-12", "n": "", "vs": [[6, "لذلك تنبأ عن أرض إسرائيل وقل للجبال والتلال والأودية: هذا ما يعلنه السيد الرب: ها أنا في غيرتي وسخطي قد أصدرت قضائي لأنكم قد تحملتم تعيير الأمم،"], [7, "فأقسمت أن تتحمل الأمم المحيطة بكم عار أنفسهم."], [8, "أما أنت ياجبال إسرائيل فتفرخين فروعك، وتحمل أشجارك أثمارا لشعبي إسرائيل لأن موعد رجوعهم بات وشيكا."], [9, "فأنا لك، أعتني بك فتحرثين وتزرعين."], [10, "وأجعلك آهلة بالناس، كل شعب إسرائيل، فتعمر المدن وتبنى الخرائب."], [11, "وأكثر عليك الإنسان والبهيمة فيكثرون ويثمرون، فتصبحين آهلة كسالف الزمان، وأحسن إليك أكثر مما أحسنت في الأيام الغابرة، فتدركون جميعا أني أنا الرب."], [12, "وأجعل الناس من شعبي إسرائيل يخطرون عليك، فيرثونك وتكونين لهم ملكا ولا تثكلينهم من بعد."]]}, {"l": "Eze 36:28", "n": "", "vs": [[28, "وتستوطنون الأرض التي وهبتها لآبائكم وتكونون لي شعبا وأنا أكون لكم إلها،"]]}, {"l": "Eze 37:21-25", "n": "", "vs": [[21, "وها أنا أحشد أبناء إسرائيل من بين الأمم التي تفرقوا فيها وأجمعهم من كل جهة وأحضرهم إلى أرضهم."], [22, "وأجعلهم أمة واحدة في الأرض وعلى الجبال، تحت رئاسة ملك واحد، فلا يكونون بعد أمتين، ولا ينقسمون إلى مملكتين."], [23, "ولا يتدنسون بعد بأصنامهم ورجاساتهم ولا بأي من معاصيهم، بل أخلصهم من مواطن إثمهم، وأطهرهم فيكونون لي شعبا وأنا أكون لهم إلها."], [24, "ويصبح داود عبدي (أي المسيح) ملكا عليهم، فيكون لهم جميعا راع واحد فيمارسون أحكامي ويطيعون فرائضي عاملين بها."], [25, "ويقيمون في الأرض التي وهبتها لعبدي يعقوب التي سكن فيها آباؤكم، فيستوطنون فيها هم وأبناؤهم وأحفادهم إلى الأبد. ويكون عبدي داود (أي المسيح) رئيسا عليهم مدى الدهر."]]}, {"l": "Eze 47:13-21", "n": "", "vs": [[13, "وهذه هي حدود الأرض التي تمتلكونها بحسب أسباط إسرائيل الاثني عشر. يكون لذرية يوسف نصيبان."], [14, "وتقسمون بينكم بالتساوي هذه الأرض التي أقسمت لآبائكم أن أهبها لهم لتكون لكم ميراثا."], [15, "وهذه هي حدود الأرض نحو الشمال: من البحر الكبير مرورا بطريق حثلون حتى صدد."], [16, "ومن حماة وبيروثة وسبرائم الواقعة بين تخم دمشق وتخم حماة وحصر الوسطى التي على حدود حوران."], [17, "فتمتد الحدود الشمالية من البحر إلى حصر عينان التي على الحدود الشمالية مع حماة وإلى حدود دمشق جنوبا. فتكون هذه هي حدودكم الشمالية."], [18, "وتمتد الحدود الشرقية من حصر عينان، بين حوران ودمشق وعلى طول الأردن الفاصل بين جلعاد وإسرائيل، مرورا (بالبحر الميت) حت ثامار. فتكون هذه هي حدودكم الشرقية."], [19, "أما الحدود الجنوبية فتمتد غربا من ثامار إلى مياه مريبوث قادش، ومن متفرع نهر مصر إلى البحر الكبير، فتكون هذه هي حدودكم الجنوبية."], [20, "أما الحدود الغربية فتكون تخم البحر الكبير، فتمتد من الحدود الجنوبية إلى مدخل حماة شمالا. فتكون هذه هي حدودكم الغربية."], [21, "وهكذا تقتسمون هذه الأرض بحسب أسباط إسرائيل."]]}, {"l": "Eze 48:1-9", "n": "", "vs": [[1, "وهذه هي أسماء أسباط إسرائيل. بدءا من الحدود الشمالية بجانب طريق حثلون حتى مدخل حماة حصر عينان على تخوم دمشق باتجاه الشمال بجانب حماة، امتدادا من الشرق إلى البحر غربا تكون لدان حصة واحدة."], [2, "ومن تخوم دان شرقا حتى البحر غربا تكون لأشير حصة واحدة."], [3, "ومن حدود أشير شرقا حتى البحر غربا تكون لنفتالي حصة واحدة."], [4, "ومن حدود نفتالي شرقا حتى البحر غربا تكون لمنسى حصة واحدة."], [5, "ومن تخوم منسى شرقا حتى البحر غربا تكون لأفرايم حصة واحدة."], [6, "ومن تخوم أفرايم شرقا حتى البحر غربا تكون لرأوبين حصة واحدة."], [7, "ومن حدود رأوبين شرقا حتى البحر غربا تكون ليهوذا حصة واحدة."], [8, "ومن حدود يهوذا شرقا حتى البحر غربا يكون عرض قطعة الأرض التي تقدمونها قدسا لله خمسة وعشرين ألف ذراع (نحو اثني عشر كيلومترا ونصف الكيلومتر). ويضاهي طولها طول أي حصة من الشرق إلى البحر غربا، ويكون المقدس في وسطها."], [9, "ويكون طول الحصة التي تقدمونها للرب خمسة وعشرين ألف ذراع (نحو اثني عشر كيلومترا ونصف الكيلومتر). أما عرضها فيكون عشرة آلاف ذراع (نحو خمسة كيلومترات)."]]}], "kwAr": "أرض أفرايم", "noteAr": ""}, {"kw": "Benjamin", "raw": "Jos_13:25, Jos_13:31, Jos_18:21-28; 1Ch_5:26; Jer_49:1; Amo_1:13; Mic_7:14", "note": "", "refs": [{"l": "Jos 13:25", "n": "", "vs": [[25, "كانت حدودهم تشمل يعزير وكل مدن جلعاد ونصف أرض بني عمون إلى عروعير القائمة مقابل ربة."]]}, {"l": "Jos 13:31", "n": "", "vs": [[31, "ونصف جلعاد وعشتاروث وإذرعي وهي مدن عوج الملكية في باشان. وقد وهبت هذه لنصف ذرية ماكير بن منسى بحسب عشائرهم."]]}, {"l": "Jos 18:21-28", "n": "", "vs": [[21, "وهذه هي مدن سبط بنيامين حسب عشائرهم: أريحا وبيت حجلة ووادي قصيص،"], [22, "وبيت العربة وصمارايم وبيت إيل،"], [23, "والعويم والفارة وعفرة،"], [24, "وكفر العموني والعفني وجبع، وهي في جملتها ست عشرة مدينة مع ضياعها."], [25, "وأيضا جبعون والرامة وبئيروت،"], [26, "والمصفاة والكفيرة والموصة،"], [27, "وراقم ويرفئيل وترالة،"], [28, "وصيلع وآلف واليبوسي التي هي أورشليم وجبعة وقرية. وهي في جملتها أربع عشرة مدينة مع ضياعها. هذا هو ميراث سبط بنيامين حسب عشائرهم."]]}, {"l": "1Ch 5:26", "n": "", "vs": [[26, "فأثار إله إسرائيل عليهم فول ملك أشور، المعروف بتلغث فلناسر، وسبى سبطي رأوبين وجاد ونصف سبط منسى ونقلهم إلى حلح وخابور وهارا، ونهر جوزان إلى هذا اليوم."]]}, {"l": "Jer 49:1", "n": "", "vs": [[1, "نبوءة عن بني عمون، هذا ما يعلنه الرب: «أليس لإسرائيل أبناء؟ أليس له وارث؟ فما بال ملك العمونيين قد استولى على ميراث سبط جاد وسكن شعبه في مدنه؟"]]}, {"l": "Amo 1:13", "n": "", "vs": [[13, "هذا ما يقوله الرب: من أجل معاصي العمونيين الثلاث والأربع لن أرد عنهم سخطي، لأنهم شقوا بطون الحوامل في جلعاد ليوسعوا تخمهم."]]}, {"l": "Mic 7:14", "n": "", "vs": [[14, "ارع يارب شعبك بعصاك، فهم قطيع ميراثك الرابضون وحدهم في الغابة في وسط الكرمل. قدهم إلى باشان وجلعاد ليتمتعوا بخصب أرضهما كالعهد بهم في أيام القدم."]]}], "kwAr": "بنيامين", "noteAr": ""}], "arS": [["ويرث أهل ", []], ["النقب", ["H5045"]], [" ", []], ["جبل", ["H2022"]], [" ", []], ["عيسو", ["H6215"]], ["، وسكان ", []], ["السهول", ["H8219"]], [" أرض ", []], ["الفلسطينيين", ["H6430"]], ["، ", []], ["ويملكون", ["H3423"]], [" أرض ", []], ["أفرايم", ["H669"]], [" وبلاد ", []], ["السامرة", ["H8111"]], ["، ", []], ["ويرث", ["H3423"]], [" ", []], ["بنيامين", ["H1144"]], [" ", []], ["جلعاد", ["H1568"]], [".", []]]}, {"c": 1, "v": 20, "text": "ويستولي جيش مسبيي بني إسرائيل على أرض الكنعانيين حتى صرفة، ويحتل مسبيو أورشليم في صفارد مدن جنوب يهوذا.", "groups": [{"kw": "the captivity of this", "raw": "Jer_3:18, Jer_33:26; Eze_34:12, Eze_34:13; Hos_1:10,Hos_1:11; Amo_9:14, Amo_9:15; Zec_10:6-10", "note": "", "refs": [{"l": "Jer 3:18", "n": "", "vs": [[18, "وتنضم في تلك الأيام ذرية يهوذا إلى ذرية إسرائيل ويأتون معا من أرض الشمال إلى الديار التي أورثتها لآبائهم."]]}, {"l": "Jer 33:26", "n": "", "vs": [[26, "فإني أرفض ذرية يعقوب وداود عبدي، فلا أصطفي من ذريته من يحكم على نسل إبراهيم وإسحق ويعقوب. ولكني سأرد سبيهم وأرحمهم»."]]}, {"l": "Eze 34:12", "n": "", "vs": [[12, "وكما يتفقد الراعي قطيعه في اليوم الذي يكون فيه بين غنمه المشتتة، هكذا أتفقد قطيعي وأخلصه من كل الأماكن التي تفرق إليها في يوم غائم كئيب."]]}, {"l": "Eze 34:13", "n": "", "vs": [[13, "وأخرجه من بين الشعوب وأجمعه من البلدان، وأرده إلى أرضه، حيث أرعاه على جبال إسرائيل وفي الأودية وفي جميع أماكن الأرض الآهلة."]]}, {"l": "Hos 1:10", "n": "", "vs": [[10, "ومع ذلك فإن عدد بني إسرائيل يكون كرمل البحر الذي لا يكال ولا يحصى. وفي الموضع الذي قيل لهم فيه: أنتم لستم شعبي، يقال لهم: أنتم أبناء الله الحي."]]}, {"l": "Hos 1:11", "n": "", "vs": [[11, "ويجتمع أبناء يهوذا وأبناء إسرائيل معا وينصبون عليهم قائدا واحدا، ويرجعون من أرض السبي، لأن يوم يزرعيل عظيم»."]]}, {"l": "Amo 9:14", "n": "", "vs": [[14, "وأرد سبي شعبي إسرائيل فيعيدون بناء المدن الخربة ويسكنونها، ويزرعون كروما ويشربون من خمرها، ويغرسون جنات ويأكلون من ثمارها."]]}, {"l": "Amo 9:15", "n": "", "vs": [[15, "وأغرس شعبي في أرضهم فلا يستأصلون ثانية أبدا من الأرض التي وهبتها لهم، يقول الرب إلهكم."]]}, {"l": "Zec 10:6-10", "n": "", "vs": [[6, "إني أشدد شعب يهوذا وأخلص ذرية يوسف وأردهم إلى أرضهم لأني أكن لهم الرحمة، فيكونون كأني لم أنبذهم لأني أنا الرب إلههم فأستجيبهم."], [7, "ويصبح شعب إسرائيل كجبابرة الحرب، وتنتشي قلوبهم كمن شرب خمرة، ويشهد أبناؤهم هذا ويفرحون، وتبتهج نفوسهم بالرب."], [8, "أصدر إشارتي لهم فأجمع شتاتهم، لأني افتديتهم، ويكثرون كما في الحقب الأولى."], [9, "مع أني بددتهم بين الأمم، فإنهم يظلون يذكرونني في المنافي البعيدة، ويحيون مع أولادهم ويرجعون."], [10, "سأردهم إلى موطنهم من ديار مصر، وأجمع شتاتهم من أشور، وآتي بهم إلى أرض جلعاد ولبنان حتى لا يبقى متسع لهم بعد."]]}], "kwAr": "مسبيي", "noteAr": ""}, {"kw": "Zarephath", "raw": "1Ki_17:9, 1Ki_17:10; Luk_4:26, Sarepta", "note": "1Ki_17:9, 1Ki_17:10; Luk_4:26, Sarepta", "refs": [{"l": "1Ki 17:9", "n": "", "vs": [[9, "«قم وتوجه إلى صرفة التابعة لصيدون، وامكث هناك، فقد أمرت هناك أرملة أن تتكفل بإعالتك»."]]}, {"l": "1Ki 17:10", "n": "", "vs": [[10, "فذهب إلى صرفة. وعندما وصل إلى بوابة المدينة شاهد امرأة تجمع حطبا، فقال لها: «هاتي لي بعض الماء في إناء لأشرب»."]]}, {"l": "Luk 4:26", "n": "", "vs": [[26, "ولكن إيليا لم يرسل إلى أية واحدة منهن بل إلى امرأة أرملة في صرفة صيدا."]]}], "kwAr": "صرفة", "noteAr": "انظر 1مل 17: 9، 10؛ لو 4: 26"}, {"kw": "which is in Sepharad, shall possess", "raw": "or, shall possess that which is in Sepharad, they shall possess, Jer_13:19, Jer_32:44, Jer_33:13", "note": "or, shall possess that which is in Sepharad, they shall possess, Jer_13:19, Jer_32:44, Jer_33:13", "refs": [{"l": "Jer 13:19", "n": "", "vs": [[19, "قد أغلقت مدن النقب وليس من يفتحها. سبي أهل يهوذا بجملتهم. سبوا جميعا ولم يبق منهم أحد."]]}, {"l": "Jer 32:44", "n": "", "vs": [[44, "فتشترى الحقول بفضة، وتسجل بنود العقود في الصكوك وتختم، ويوقع الشهود في أرض بنيامين والقرى المجاورة لأورشليم، وفي مدن يهوذا وفي المناطق الجبلية وفي مدن السهل، ومدن الجنوب لأني أرد سبيهم، يقول الرب»."]]}, {"l": "Jer 33:13", "n": "", "vs": [[13, "وفي مدن المناطق الجبلية ومدن السفوح القريبة، ومدن النقب، وفي أرض بنيامين وفي القرى المجاورة لأورشليم، وفي مدن يهوذا تمر الغنم أمام المحصي."]]}], "kwAr": "مسبيو أورشليم في صفارد", "noteAr": "أو: «يرث ما في صفارد، يرثون». انظر إر 13: 19؛ 32: 44؛ 33: 13"}], "arS": [["ويستولي", ["H3423"]], [" ", []], ["جيش", ["H2426"]], [" ", []], ["مسبيي", ["H1546"]], [" بني ", []], ["إسرائيل", ["H3478"]], [" على أرض ", []], ["الكنعانيين", ["H3669"]], [" حتى ", []], ["صرفة", ["H6886"]], ["، ويحتل ", []], ["مسبيو", ["H1546"]], [" ", []], ["أورشليم", ["H3389"]], [" في ", []], ["صفارد", ["H5614"]], [" ", []], ["مدن", ["H5892"]], [" ", []], ["جنوب", ["H5045"]], [" يهوذا.", []]]}, {"c": 1, "v": 21, "text": "ويصعد المنقذون إلى جبل صهيون ليحكموا جبل عيسو، ويصبح الملك للرب.", "groups": [{"kw": "saviours", "raw": "Jdg_2:16, Jdg_3:9; 2Ki_13:5; Isa_19:20; Dan_12:3; Joe_2:32; Mic_5:4-9; Zec_9:11-17, Zec_10:5-12; 1Ti_4:16; Jam_5:20", "note": "", "refs": [{"l": "Jdg 2:16", "n": "", "vs": [[16, "وأقام الرب من بينهم قضاة فأنقذوهم من أيدي غزاتهم."]]}, {"l": "Jdg 3:9", "n": "", "vs": [[9, "واستغاث بنو إسرائيل بالرب، فأقام لهم مخلصا أنقذهم هو عثنيئيل بن قناز أخو كالب الأصغر."]]}, {"l": "2Ki 13:5", "n": "", "vs": [[5, "فأقام الرب من بينهم منقذا خلصهم من نير الأراميين فسكن الإسرائيليون في منازلهم بطمأنينة كعهدهم في الأيام الغابرة."]]}, {"l": "Isa 19:20", "n": "", "vs": [[20, "فيكون علامة وشهادة للرب القدير في ديار مصر، لأنهم يستغيثون بالرب من مضايقيهم، فيبعث إليهم مخلصا ومدافعا ينقذهم."]]}, {"l": "Dan 12:3", "n": "", "vs": [[3, "ويضيء الحكماء (أي شعب الله) كضياء الجلد، وكذلك الذين ردوا كثيرين إلى البر يشعون كالكواكب إلى مدى الدهر."]]}, {"l": "Joe 2:32", "n": "", "vs": [[32, "إنما كل من يدعو باسم الرب يخلص، لأن النجاة تكون في جبل صهيون وفي أورشليم، كما قال الرب، إذ يكون بين الناجين من يدعوه الرب."]]}, {"l": "Mic 5:4-9", "n": "", "vs": [[4, "فيقوم ويرعى شعبه بقوة الرب وبجلال اسم الرب إلهه، فيعيشون بأمن، لأن عظمته تمتد إلى أقاصي الأرض."], [5, "ويصبح الرب سلامهم، إذ حين يزحف الأشوريون إلى أرضنا ويطأون ترابنا، فإننا نثير عليهم سبعة رعاة وثمانية أمراء من الناس،"], [6, "فيحكمون بلاد أشور بقوة السيف، ويقتحمون بوابات أرض نمرود، وينقذنا ( الله ) من الأشوريين عندما يزحفون إلى أرضنا ويطأون تخومنا."], [7, "عندئذ تغدو بقية ذرية يعقوب بين الأمم الكثيرة كندى من لدن الرب، كالمطر الوابل على العشب الذي لا يتوانى من أجل الناس أو يرجو أبناء البشر."], [8, "وتكون بقية ذرية يعقوب بين الشعوب الكثيرة كأسد بين وحوش الغابة، أو كشبل بين قطعان الغنم، الذي إن اقتحم يدوس ويفترس وليس من منقذ."], [9, "فتتعاظم ياشعبي على مبغضيك، ويبيد جميع أعدائك."]]}, {"l": "Zec 9:11-17", "n": "", "vs": [[11, "أما أنتم فبفضل دم عهدي معكم أطلق أسراكم من الجب الذي لا ماء فيه."], [12, "ارجعوا إلى الحصن ياأسرى الرجاء، فأنا أعلن اليوم أني أضاعف لكم الأجر لقاء ما عانيتم من ويلات."], [13, "ها أنا أوتر يهوذا كقوس وأجعل أفرايم كسهم وأثير رجال صهيون على أبناء اليونان فتكونين كسيف جبار."], [14, "ثم يتجلى الرب، وينفذ سهمه كالبرق. ينفخ السيد الرب بالبوق ويقتحم في زوابع الجنوب."], [15, "يقيهم الرب القدير فلا تنالهم حجارة المقلاع، بل تقصر عنهم ويطأونها، ويشربون (من دماء أعدائهم) ويصخبون كالسكارى من الخمر ويمتلئون كمناضح المحرقات وزوايا المذبح."], [16, "في ذلك اليوم يخلصهم الرب إلههم لأنهم شعبه قطيعه، ويتألقون في أرضه كحجارة كريمة مرصعة في تاج."], [17, "فما أجملهم وما أبهاهم! الحنطة تجعل الفتيان أكثر ازدهارا، والخمرة تجعل الفتيات أكثر نضرة»."]]}, {"l": "Zec 10:5-12", "n": "", "vs": [[5, "ويدوسون الأعداء معا كما يدوس الجبابرة الطين في الشوارع، ويحاربون لأن الرب معهم فيلحقون العار بفرسان الأعداء."], [6, "إني أشدد شعب يهوذا وأخلص ذرية يوسف وأردهم إلى أرضهم لأني أكن لهم الرحمة، فيكونون كأني لم أنبذهم لأني أنا الرب إلههم فأستجيبهم."], [7, "ويصبح شعب إسرائيل كجبابرة الحرب، وتنتشي قلوبهم كمن شرب خمرة، ويشهد أبناؤهم هذا ويفرحون، وتبتهج نفوسهم بالرب."], [8, "أصدر إشارتي لهم فأجمع شتاتهم، لأني افتديتهم، ويكثرون كما في الحقب الأولى."], [9, "مع أني بددتهم بين الأمم، فإنهم يظلون يذكرونني في المنافي البعيدة، ويحيون مع أولادهم ويرجعون."], [10, "سأردهم إلى موطنهم من ديار مصر، وأجمع شتاتهم من أشور، وآتي بهم إلى أرض جلعاد ولبنان حتى لا يبقى متسع لهم بعد."], [11, "يجتازون عبر بحر المشقات، فتنحسر الأمواج وتجف لجج النيل. تذل كبرياء أشور ويزول صولجان مصر."], [12, "وأشددهم بالرب فيسلكون بمقتضى اسمه، يقول الرب."]]}, {"l": "1Ti 4:16", "n": "", "vs": [[16, "انتبه جيدا لنفسك وللتعليم. فإنك إذ تواظب على ذلك، تنقذ نفسك وسامعيك أيضا."]]}, {"l": "Jam 5:20", "n": "", "vs": [[20, "فليتأكد أن الذي يرد خاطئا عن ضلال مسلكه، فإنما ينقذ نفسا من الموت، ويستر خطايا كثيرة!"]]}], "kwAr": "المنقذون", "noteAr": ""}, {"kw": "to judge", "raw": "Psa_149:5-9; Dan_7:27; Luk_22:30; 1Co_6:2, 1Co_6:3; Rev_19:11-13, Rev_20:4", "note": "", "refs": [{"l": "Psa 149:5-9", "n": "", "vs": [[5, "ليبتهج الأتقياء بهذا المجد. ليهتفوا فرحا في أسرتهم."], [6, "ليهتفوا مسبحين الرب ملء أفواههم وليتقلدوا بسيف ذي حدين في أيديهم،"], [7, "لتنفيذ الانتقام في الأمم، ومعاقبة الشعوب."], [8, "ليقيدوا ملوكهم بالسلاسل وشرفاءهم بأغلال من حديد."], [9, "ليتم فيهم حكم الله المكتوب، فيكون هذا تكريما لجميع قديسيه. هللويا."]]}, {"l": "Dan 7:27", "n": "", "vs": [[27, "وتوهب المملكة والسلطان وعظمة الممالك القائمة تحت كل السماء إلى شعب قديسي العلي، فيكون ملكوت العلي ملكوتا أبديا، وتعبده جميع السلاطين ويطيعونه."]]}, {"l": "Luk 22:30", "n": "", "vs": [[30, "لكي تأكلوا وتشربوا على مائدتي في ملكوتي، وتجلسوا على عروش تدينون أسباط إسرائيل الاثني عشر."]]}, {"l": "1Co 6:2", "n": "", "vs": [[2, "أما تعلمون أن القديسين سيدينون العالم؟ وما دمتم ستدينون العالم، أفلا تكونون أهلا لأن تحكموا في القضايا البسيطة؟"]]}, {"l": "1Co 6:3", "n": "", "vs": [[3, "أما تعلمون أننا سندين الملائكة؟ أفليس أولى بنا أن نحكم في قضايا هذه الحياة؟"]]}, {"l": "Rev 19:11-13", "n": "", "vs": [[11, "ثم رأيت السماء مفتوحة، وإذا حصان أبيض يسمى راكبه «الأمين الصادق» الذي يقضي ويحارب بالعدل."], [12, "عيناه كلهيب نار، وعلى رأسه أكاليل كثيرة، وقد كتب على جبهته اسم لا يعرفه أحد إلا هو."], [13, "وكان يرتدي ثوبا مغمسا بالدم؛ أما اسمه فهو «كلمة الله»"]]}, {"l": "Rev 20:4", "n": "", "vs": [[4, "ثم رأيت عروشا منح الجالسون عليها حق القضاء. ورأيت نفوس الذين قتلوا في سبيل الشهادة ليسوع وفي سبيل كلمة الله، والذين رفضوا أن يسجدوا للوحش ولتمثاله، والذين رفضوا علامته على أيديهم وجباههم، وقد عادوا إلى الحياة، وملكوا مع المسيح ألف سنة."]]}], "kwAr": "ليحكموا", "noteAr": ""}, {"kw": "and the", "raw": "Psa_2:6-9, Psa_22:28, Psa_102:15; Isa_9:6, Isa_9:7; Dan_2:35, Dan_2:44, Dan_7:14, Dan_7:27; Zec_14:9; Mat_6:10,Mat_6:13; Luk_1:32, Luk_1:33; Rev_11:15, Rev_19:6", "note": "", "refs": [{"l": "Psa 2:6-9", "n": "", "vs": [[6, "قائلاَ: «أما أنا فقد مسحت ملكي، وأجلسته على صهيون، جبلي المقدس»."], [7, "وها أنا أعلن ما قضى به الرب: قال لي الرب: «أنت ابني، أنا اليوم ولدتك."], [8, "اطلب مني فأعطيك الأمم ميراثا، وأقاصي الأرض ملكا لك."], [9, "فتكسرهم بقضيب من حديد، وتحطمهم كآنية الفخار»."]]}, {"l": "Psa 22:28", "n": "", "vs": [[28, "لأن الملك للرب، وهو يتسلط على الأمم."]]}, {"l": "Psa 102:15", "n": "", "vs": [[15, "فتخشى الأمم اسم الرب، ويهاب جميع ملوك الأرض مجدك."]]}, {"l": "Isa 9:6", "n": "", "vs": [[6, "لأنه يولد لنا ولد ويعطى لنا ابن يحمل الرياسة على كتفه، ويدعى اسمه عجيبا، مشيرا، إلها قديرا، أبا أبديا، رئيس السلام."]]}, {"l": "Isa 9:7", "n": "", "vs": [[7, "ولا تكون نهاية لنمو رياسته وللسلام اللذين يسودان عرش داود ومملكته، ليثبتها ويعضدها بالحق والبر، من الآن وإلى الأبد. إن غيرة الرب القدير تتمم هذا."]]}, {"l": "Dan 2:35", "n": "", "vs": [[35, "فتحطم الحديد والخزف والنحاس والفضة والذهب معا، وانسحقت وصارت كعصافة البيدر في الصيف، فحملتها الريح حتى لم يبق لها أثر. أما الحجر الذي ضرب التمثال فتحول إلى جبل كبير وملأ الأرض كلها."]]}, {"l": "Dan 2:44", "n": "", "vs": [[44, "وفي عهد هؤلاء الملوك يقيم إله السماوات مملكة لا تنقرض إلى الأبد، ولا يترك ملكها لشعب آخر، وتسحق وتبيد جميع هذه الممالك. أما هي فتخلد إلى الأبد."]]}, {"l": "Dan 7:14", "n": "", "vs": [[14, "فأنعم عليه بسلطان ومجد وملكوت لتتعبد له كل الشعوب والأمم من كل لسان. سلطانه سلطان أبدي لا يفنى، وملكه لا ينقرض."]]}, {"l": "Dan 7:27", "n": "", "vs": [[27, "وتوهب المملكة والسلطان وعظمة الممالك القائمة تحت كل السماء إلى شعب قديسي العلي، فيكون ملكوت العلي ملكوتا أبديا، وتعبده جميع السلاطين ويطيعونه."]]}, {"l": "Zec 14:9", "n": "", "vs": [[9, "ويملك الرب على الأرض كلها، فيكون في ذلك اليوم رب واحد لا يذكر سوى اسمه."]]}, {"l": "Mat 6:10", "n": "", "vs": [[10, "ليأت ملكوتك! لتكن مشيئتك على الأرض كما هي في السماء!"]]}, {"l": "Mat 6:13", "n": "", "vs": [[13, "ولا تدخلنا في تجربة، لكن نجنا من الشرير، لأن لك الملك والقوة والمجد إلى الأبد. آمين."]]}, {"l": "Luk 1:32", "n": "", "vs": [[32, "إنه يكون عظيما، وابن العلي يدعى، ويمنحه الرب الإله عرش داود أبيه،"]]}, {"l": "Luk 1:33", "n": "", "vs": [[33, "فيملك على بيت يعقوب إلى الأبد، ولن يكون لملكه نهاية»."]]}, {"l": "Rev 11:15", "n": "", "vs": [[15, "ونفخ الملاك السابع في بوقه فسمعت أصوات عالية في السماء تقول: «قد صار ملك العالم لربنا ومسيحه. إنه يملك إلى أبد الآبدين»."]]}, {"l": "Rev 19:6", "n": "
