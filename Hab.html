<script>window.CATALOG=[{"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 20, "nv": 480, "refs": 6756, "last": "20:49", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 35, "abbr": "Hab", "en": "Habakkuk", "verses": [{"c": 1, "v": 1, "text": "هذه رؤيا حبقوق النبي:", "groups": [{"kw": "", "raw": "Isa_22:1; Nah_1:1", "note": "", "refs": [{"l": "Isa 22:1", "n": "", "vs": [[1, "نبوءة بشأن أورشليم: ماذا حدث حتى إنكم جميعا صعدتم إلى سطوح المنازل؟"]]}, {"l": "Nah 1:1", "n": "", "vs": [[1, "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."]]}], "kwAr": "", "noteAr": ""}], "arS": [["هذه ", []], ["رؤيا", ["H4853"]], [" ", []], ["حبقوق", ["H2265"]], [" ", []], ["النبي", ["H5030"]], [":", []]]}, {"c": 1, "v": 2, "text": "إلى متى يارب أستغيث وأنت لا تستجيب؟ وأصرخ إليك مستجيرا من الظلم وأنت لا تخلص؟", "groups": [{"kw": "how", "raw": "Psa_13:1, Psa_13:2, Psa_74:9, Psa_74:10, Psa_94:3; Rev_6:10", "note": "", "refs": [{"l": "Psa 13:1", "n": "", "vs": [[1, "إلى متى يارب تنساني؟ أإلى الأبد؟"]]}, {"l": "Psa 13:2", "n": "", "vs": [[2, "إلى متى أرعى هموما في نفسي وحزنا في قلبي كل يوم؟ إلى متى يتشامخ عدوي علي؟"]]}, {"l": "Psa 74:9", "n": "", "vs": [[9, "لم نعد نشهد رموز عبادتنا، ولم يبق نبي بعد، وليس بيننا من يعرف متى تكون خاتمة الأمر."]]}, {"l": "Psa 74:10", "n": "", "vs": [[10, "ياالله : إلى متى يعيرنا الخصم؟ أيظل العدو يستهين باسمك إلى الأبد؟"]]}, {"l": "Psa 94:3", "n": "", "vs": [[3, "إلى متى يارب يشمت الأشرار فرحين؟"]]}, {"l": "Rev 6:10", "n": "", "vs": [[10, "وهم يصرخون للرب بأعلى صوتهم: «حتى متى، أيها السيد القدوس والحق، تؤخر معاقبة أهل الأرض على ما فعلوه بنا؟ متى تنتقم منهم لدمائنا؟»"]]}], "kwAr": "إلى متى", "noteAr": ""}, {"kw": "and thou wilt not save", "raw": "Psa_22:1, Psa_22:2; Jer_14:9; Lam_3:8", "note": "", "refs": [{"l": "Psa 22:1", "n": "", "vs": [[1, "إلهي، إلهي، لماذا تركتني؟ لماذا تباعدت عن خلاصي وعن سماع صوت تنهداتي؟"]]}, {"l": "Psa 22:2", "n": "", "vs": [[2, "إلهي، أصرخ إليك مستغيثا في النهار فلا تجيبني، وفي الليل فلا راحة لي،"]]}, {"l": "Jer 14:9", "n": "", "vs": [[9, "لماذا تكون كالرجل المتحير وكجبار يعجز عن الخلاص؟ وأنت يارب قائم في وسطنا، وباسمك دعينا، فلا تتركنا."]]}, {"l": "Lam 3:8", "n": "", "vs": [[8, "حتى حين أصرخ وأستغيث يصد صلاتي."]]}], "kwAr": "وأنت لا تخلص", "noteAr": ""}], "arS": [["إلى متى", ["H5704", "H575"]], [" ", []], ["يارب", ["H3068"]], [" ", []], ["أستغيث", ["H7768"]], [" وأنت ", []], ["لا", ["H3808"]], [" ", []], ["تستجيب", ["H8085"]], ["؟ ", []], ["وأصرخ", ["H2199"]], [" ", []], ["إليك", ["H413"]], [" مستجيرا من ", []], ["الظلم", ["H2555"]], [" وأنت ", []], ["لا", ["H3808"]], [" ", []], ["تخلص", ["H3467"]], ["؟", []]]}, {"c": 1, "v": 3, "text": "لماذا تريني الإثم، وتتحمل رؤية الظلم؟ أينما تلفت أشهد أمامي جورا واغتصابا، ويثور حولي خصام ونزاع.", "groups": [{"kw": "", "raw": "Psa_12:1, Psa_12:2, Psa_55:9-11, Psa_73:3-9, Psa_120:5, Psa_120:6; Ecc_4:1, Ecc_5:8; Jer_9:2-6; Eze_2:6; Mic_7:1-4; Mat_10:16; 2Pe_2:8", "note": "", "refs": [{"l": "Psa 12:1", "n": "", "vs": [[1, "أغث يارب لأنه قد انقرض التقي، واختفى الأمناء من بين بني البشر."]]}, {"l": "Psa 12:2", "n": "", "vs": [[2, "كل إنسان يخاطب صاحبه بالباطل: بشفاه ملقة وقلوب منافقة يتحادثون."]]}, {"l": "Psa 55:9-11", "n": "", "vs": [[9, "بلبل ألسنة (أعدائي) يارب وأبكمهم، فإني أرى في المدينة عنفا وعدوانا،"], [10, "يحدقان بأسوارها نهارا وليلا، وفي وسطها الإثم والأذى."], [11, "المفاسد في وسطها، والظلم والغش لا يفارقان ساحاتها."]]}, {"l": "Psa 73:3-9", "n": "", "vs": [[3, "لأني حسدت المتكبرين، إذ شاهدت نجاح الأشرار."], [4, "فإن أوجاع الموت لا تصيبهم وأجسامهم سمينة."], [5, "لا يقاسون من أتعاب البشر، ولا يعانون من المصائب كالناس."], [6, "لذلك لبسوا الكبرياء كقلادة، وارتدوا الظلم كثوب."], [7, "عيونهم جاحظة من كثرة شحم طمعهم. وشرهم تجاوز ما يتصوره القلب."], [8, "يستهزئون ويتكلمون بالظلم خبثا، وبكبرياء ينطقون."], [9, "جدفوا على السماء بأفواههم، ولوثوا الأرض بخبث ألسنتهم."]]}, {"l": "Psa 120:5", "n": "", "vs": [[5, "ويلي لأني تغربت في ماشك، وسكنت في خيام قيدار."]]}, {"l": "Psa 120:6", "n": "", "vs": [[6, "طال سكني مع أناس يبغضون السلام."]]}, {"l": "Ecc 4:1", "n": "", "vs": [[1, "ثم تأملت حولي فرأيت جميع المظالم التي ترتكب تحت الشمس. شهدت دموع المظلومين الذين لا معزي لهم، أما ظالموهم فيتمتعون بالقوة، غير أن المظلومين لا معزي لهم."]]}, {"l": "Ecc 5:8", "n": "", "vs": [[8, "إن شهدت في البلاد الفقير مظلوما، والحق والعدل مزهوقين فلا تعجب من الأمر، فإن فوق المسئول الكبير مسئولا أعلى منه رتبة يراقبه وفوقهما من هو أعظم مقاما منهما."]]}, {"l": "Jer 9:2-6", "n": "", "vs": [[2, "ياليت لي في الصحراء مبيت عابر سبيل، فأهجر شعبي وأنطلق بعيدا عنهم، لأنهم جميعا زناة وجماعة خونة."], [3, "«قد وتروا ألسنتهم كقسي جاهزة ليطلقوا الأكاذيب التي تقولوا بها في الأرض من دون الحق، إذ أنهم انتهوا من شر إلى شر، وإياي لم يعرفوا» يقول الرب."], [4, "«ليحترس كل واحد من جاره، ولا يثق بأحد من أقربائه، لأن كل قريب مخادع، وكل صاحب واش."], [5, "كل واحد منهم يخدع جاره ولا ينطقون بالصدق. دربوا ألسنتهم على قول الكذب، وأرهقوا أنفسهم في ارتكاب الإثم."], [6, "يجمعون ظلما فوق ظلم، وخداعا على خداع، وأبوا أن يعرفوني»."]]}, {"l": "Eze 2:6", "n": "", "vs": [[6, "أما أنت، ياابن آدم، فلا ترهبهم ولا تخش كلامهم، وإن كانوا لك قريسا وشوكا. وأنت ساكن بين عقارب، فلا ترهب كلامهم، ولا تفزع من محضرهم لأنهم شعب متمرد."]]}, {"l": "Mic 7:1-4", "n": "", "vs": [[1, "ويل لي، فقد صرت كرجل جائع جاء يبحث عن جني الصيف وبقايا قطاف العنب، فلم يجد عنقودا للأكل ولا شيئا من باكورة التين مما تشتهيه نفسي."], [2, "قد باد الصالح من الأرض واختفى المستقيم من بين الناس. جميعهم يكمنون لسفك الدماء، وكل واحد منهم يقتنص أخاه."], [3, "تجد أيديهم في ارتكاب الشر، ويسعى الرئيس والقاضي وراء الرشوة، ويملي العظيم عليهم أهواء نفسه، فيتآمرون جميعا على الحق."], [4, "أفضلهم مثل العوسج، وأكثرهم استقامة أسوأ من سياج الشوك. وها يوم عقابكم الذي أنذر به أنبياؤكم قد وافى. عندئذ يعتريكم الارتباك."]]}, {"l": "Mat 10:16", "n": "", "vs": [[16, "ها أنا أرسلكم مثل الخراف بين الذئاب، فكونوا متنبهين كالحيات ومسالمين كالحمام."]]}, {"l": "2Pe 2:8", "n": "", "vs": [[8, "فإذ كان ساكنا بينهم، وهو رجل بار، كانت نفسه الزكية تتألم يوميا من جرائمهم التي كان يراها أو يسمع بها."]]}], "kwAr": "", "noteAr": ""}], "arS": [["لماذا", ["H4100"]], [" ", []], ["تريني", ["H7200"]], [" ", []], ["الإثم", ["H205"]], ["، ", []], ["وتتحمل", ["H5027"]], [" رؤية ", []], ["الظلم", ["H5999"]], ["؟ أينما تلفت أشهد ", []], ["أمامي", ["H5048"]], [" ", []], ["جورا", ["H7701"]], [" ", []], ["واغتصابا", ["H2555"]], ["، ", []], ["ويثور", ["H5375"]], [" حولي ", []], ["خصام", ["H7379"]], [" ", []], ["ونزاع", ["H4066"]], [".", []]]}, {"c": 1, "v": 4, "text": "لذلك بطلت الشريعة، وباد العدل لأن الأشرار يحاصرون الصديق فيصدر الحكم منحرفا عن الحق.", "groups": [{"kw": "the law", "raw": "Psa_11:3, Psa_119:126; Mar_7:9; Rom_3:31", "note": "", "refs": [{"l": "Psa 11:3", "n": "", "vs": [[3, "إذا تقوضت الأساسات، فماذا يعمل الصديق؟"]]}, {"l": "Psa 119:126", "n": "", "vs": [[126, "يارب آن لك أن تعمل، فقد نقضوا شريعتك."]]}, {"l": "Mar 7:9", "n": "", "vs": [[9, "وقال لهم: «حقا أنكم رفضتم وصية الله لتحافظوا على تقليدكم أنتم!"]]}, {"l": "Rom 3:31", "n": "", "vs": [[31, "إذن، هل نحن نبطل الشريعة بالإيمان؟ حاشا، بل إننا به نثبت الشريعة."]]}], "kwAr": "الشريعة", "noteAr": ""}, {"kw": "for", "raw": "1Ki_21:13; Job_21:7; Psa_22:16, Psa_58:1, Psa_58:2, Psa_59:2, Psa_59:4, Psa_82:1-5, Psa_94:3, Psa_94:20,Psa_94:21; Isa_1:21-23, Isa_59:2-8, Isa_59:13-15; Jer_5:27-29, Jer_12:1, Jer_12:6, Jer_26:8, Jer_26:21-23; Jer_37:14-16, Jer_38:4-6; Eze_22:25-30; Hos_10:4; Amo_5:7, Amo_5:12; Mic_2:1, Mic_2:2; Mic_3:1-3, Mic_7:2-4; Mat_23:34-36, Mat_26:59-66, Mat_27:1, Mat_27:2, Mat_27:25, Mat_27:26; Act_7:52, Act_7:59; Act_23:12-14; Jam_2:6, Jam_2:7", "note": "", "refs": [{"l": "1Ki 21:13", "n": "", "vs": [[13, "ثم أقبل شاهدا زور وجلسا تجاهه، وشهدا على نابوت أمام الشعب قائلين: «قد جدف نابوت على الله وعلى الملك». فجروه إلى خارج المدينة ورجموه بالحجارة حتى مات."]]}, {"l": "Job 21:7", "n": "", "vs": [[7, "لماذا يحيا الأشرار ويطعنون في السن ويزدادون قوة؟"]]}, {"l": "Psa 22:16", "n": "", "vs": [[16, "أحاط بي الأدنياء. جماعة من الأشرار طوقتني. ثقبوا يدي ورجلي."]]}, {"l": "Psa 58:1", "n": "", "vs": [[1, "أحقا تنطقون بالحق أيها الحكام، وتقضون بالاستقامة يابني البشر؟"]]}, {"l": "Psa 58:2", "n": "", "vs": [[2, "لا! إنما تضمرون الباطل في القلب وترتكب أيديكم الظلم في الأرض."]]}, {"l": "Psa 59:2", "n": "", "vs": [[2, "نجني من فاعلي الإثم، وخلصني من سافكي الدماء."]]}, {"l": "Psa 59:4", "n": "", "vs": [[4, "يسرعون متأهبين للإيقاع بي، من غير أن أقترف إثما. فانهض لإغاثتي وانظر إلى ما يجري."]]}, {"l": "Psa 82:1-5", "n": "", "vs": [[1, "الله يترأس ساحة قضائه، وعلى القضاة يصدر حكما."], [2, "حتى متى تقضون بالظلم وتنحازون إلى الأشرار؟"], [3, "احكموا للذليل واليتيم. وأنصفوا المسكين والبائس."], [4, "أنقذوا المسكين والفقير؛ أنقذوهما من قبضة الأشرار."], [5, "هم من غير معرفة وفهم، يتمشون في الظلمة وتتزعزع أسس الأرض من كثرة الجور."]]}, {"l": "Psa 94:3", "n": "", "vs": [[3, "إلى متى يارب يشمت الأشرار فرحين؟"]]}, {"l": "Psa 94:20", "n": "", "vs": [[20, "أيحالفك ملك الشر المختلق إثما ليجعل الظلم شريعة للقضاء؟"]]}, {"l": "Psa 94:21", "n": "", "vs": [[21, "يجتمعون معا للقضاء على حياة الصديق، ويحكمون على البريء بالموت."]]}, {"l": "Isa 1:21-23", "n": "", "vs": [[21, "كيف صارت المدينة الأمينة عاهرة؟ كانت تفيض حقا، ويأوي إليها العدل، فأصبحت وكرا للمجرمين."], [22, "صارت فضتك مزيفة، وخمرك مغشوشة بماء."], [23, "أصبح رؤساؤك عصاة وشركاء لصوص، يولعون بالرشوة ويسعون وراء الهبات، لا يدافعون عن اليتيم، ولا ترفع إليهم دعوى الأرملة»."]]}, {"l": "Isa 59:2-8", "n": "", "vs": [[2, "إنما خطاياكم أضحت تفصل بينكم وبين إلهكم، وآثامكم حجبت وجهه عنكم، فلم يسمع،"], [3, "لأن أيديكم تلوثت بالدم وأصابعكم بالإثم، ونطقت شفاهكم بالكذب، ولهجت ألسنتكم بالشر."], [4, "ليس بينكم من يطالب بالعدل، أو يحكم بالحق. يتكلون على الباطل ويتفوهون بالزور، يحبلون بالغش، ويلدون بالإثم."], [5, "يفقسون بيض أفعى، وينسجون خيوط العنكبوت. من يأكل من بيضهم يموت، ومن البيضة المكسورة تخرج حية."], [6, "لا تصلح خيوطهم لنسيج الثياب، ولا يكتسون بأعمالهم، لأن أعمالهم هي أعمال إثم، وأفعال الظلم قد ارتكبتها أيديهم."], [7, "تسرع أرجلهم لاقتراف الشر، ويهرولون لسفك دم البريء، أفكارهم أفكار أثيمة، وفي طرقهم دمار وخراب"], [8, "لم يعرفوا سبيل السلام، ولا عدل في مسالكهم. عوجوا طرقهم، والسالك فيها لا يعرف سلاما."]]}, {"l": "Isa 59:13-15", "n": "", "vs": [[13, "تمردنا وتنكرنا للرب. ارتددنا عن اتباع طرق إلهنا، تفوهنا بالظلم والعصيان افتراء، وبكلام زور من القلب."], [14, "قد ارتد عنا الإنصاف، ووقف العدل بعيدا، إذ سقط الحق صريعا في الشوارع، والبر لم يستطع الدخول."], [15, "أضحى الحق مفقودا، والحائد عن الشر ضحية. رأى الرب ذلك فأسخطه فقدان الإنصاف."]]}, {"l": "Jer 5:27-29", "n": "", "vs": [[27, "بيوتهم تكتظ بالخديعة كقفص مملوء طيورا، لذلك عظموا وأثروا."], [28, "ازدادوا سمنا ونعومة، وارتكبوا الشر متجاوزين كل حد. لم يحكموا بعدل في دعوى اليتيم حتى تنجح، ولم يدافعوا عن حقوق المساكين."], [29, "أفلا أعاقبهم على هذه الأمور؟» يقول الرب. ألا أنتقم لنفسي من أمة كهذه؟"]]}, {"l": "Jer 12:1", "n": "", "vs": [[1, "أنت دائما عادل حين أعرض عليك دعواي، ولكن دعني أحدثك بشأن أحكامك: لماذا تفلح طريق الأشرار؟ ولماذا يتمتع الغادرون بالعيش الرغيد؟"]]}, {"l": "Jer 12:6", "n": "", "vs": [[6, "حتى إخوتك وأفراد أسرتك قد تنكروا لك، ودعوا عليك وراءك بملء أفواههم. لا تأتمنهم، وإن خاطبوك بألفاظ معسولة."]]}, {"l": "Jer 26:8", "n": "", "vs": [[8, "فلما فرغ إرميا من الإدلاء بكل ما أمره الرب أن يخاطب به الشعب، قبض الكهنة والأنبياء وسائر الشعب عليه قائلين: «لابد أن تموت."]]}, {"l": "Jer 26:21-23", "n": "", "vs": [[21, "فبلغ كلامه مسامع الملك يهوياقيم وجميع محاربيه الأشداء وسائر الرؤساء، فطلب الملك قتله، فلما سمع أوريا بذلك خاف وهرب إلى مصر."], [22, "فبعث الملك يهوياقيم رجالا إلى مصر، منهم ألناثان بن عكبور يصحبه نفر من المرافقين،"], [23, "فأخرجوا أوريا من مصر وأتوا به إلى الملك يهوياقيم فقتله بالسيف، وطرح جثته في مقابر عامة الناس."]]}, {"l": "Jer 37:14-16", "n": "", "vs": [[14, "فأجابه إرميا: «هذا كذب، أنا لست هاربا للانضمام إلى الكلدانيين». فلم يصغ إليه يرئيا بل اعتقله وأتى به إلى الرؤساء."], [15, "فثار غضب الرؤساء على إرميا وضربوه، وزجوه في بيت يوناثان الكاتب الذي حولوه إلى سجن."], [16, "فعندما دخل إرميا إلى زنزانات الجب مكث هناك أياما كثيرة."]]}, {"l": "Jer 38:4-6", "n": "", "vs": [[4, "فقال رؤساء البلاد للملك: «يجب إعدام هذا الرجل، لأنه يثبط عزيمة المحاربين الباقين في هذه المدينة وعزيمة سائر الشعب، لأنه يخاطبهم بمثل هذا الكلام. فهذا الرجل لا يلتمس لهذا الشعب خيرا بل شرا»."], [5, "فأجاب الملك صدقيا: «ها هو بين أيديكم. افعلوا به ما تشاؤون، لأن الملك لا يستطيع أن يعارضكم»."], [6, "فأخذوا إرميا وطرحوه في جب ملكيا ابن الملك القائم في دار الحرس. ودلوا إرميا بحبال، ولم يكن في الجب ماء بل وحل، فغاص فيه إرميا."]]}, {"l": "Eze 22:25-30", "n": "", "vs": [[25, "تواطأ أنبياؤها الكذبة فيها مثل أسد مزمجر يمزق الفريسة. التهموا نفوسا، واستولوا على نفائس الناس وكنوزهم، وكثروا أراملها فيها."], [26, "خالف كهنتها شريعتي ونجسوا مقادسي. لم يميزوا بين المقدس والرجس، ولم يعلموا الفرق بين الطاهر والنجس، وحجبوا عيونهم عن أيام سبوتي فصرت مدنسا في وسطهم."], [27, "رؤساؤها فيها كذئاب خاطفة تمزق فرائسها إذ يسفكون دماء الناس في سبيل الربح الحرام."], [28, "وأنبياؤها قد طلوا لهم بماء الكلس، إذ يرون لهم رؤى باطلة، ويعرفون لهم عرافة كاذبة قائلين: هذا ما يعلنه السيد الرب، مع أن الرب لم يعلن شيئا."], [29, "أفرطوا في ظلم شعب الأرض واغتصبوا سالبين، واضطهدوا الفقير والمسكين، وظلموا الغريب جورا."], [30, "فالتمست من بينهم رجلا واحدا يبني جدارا ويقف في الثغرة أمامي مدافعا عن الأرض، حتى لا أخربها فلم أجد."]]}, {"l": "Hos 10:4", "n": "", "vs": [[4, "ينطقون بكلام لغو ويبرمون عهودا بأقسام باطلة، فيحل بهم القضاء كأعشاب سامة نبتت في أرض محروثة."]]}, {"l": "Amo 5:7", "n": "", "vs": [[7, "إنكم تحولون العدل مرارة، وتطرحون الحق إلى الأرض."]]}, {"l": "Amo 5:12", "n": "", "vs": [[12, "لأنني عالم بكثرة معاصيكم وعظم خطاياكم، إذ أنكم تضايقون البار أيها المرتشون الذين تصدون المسكين عن حقه في ساحة القضاء."]]}, {"l": "Mic 2:1", "n": "", "vs": [[1, "ويل للمتآمرين بالسوء، الذين يحوكون الشر وهم في مضاجعهم، الذين ينفذون عند طلوع الصباح ما خططوا له، لأن ذلك في متناول قدرتهم."]]}, {"l": "Mic 2:2", "n": "", "vs": [[2, "يشتهون حقولا ويغتصبونها، وبيوتا فيستولون عليها. يجورون على الرجل وعلى بيته والإنسان وميراثه."]]}, {"l": "Mic 3:1-3", "n": "", "vs": [[1, "وقلت اسمعوا يارؤساء يعقوب وياقضاة شعب إسرائيل: ألا ينبغي لكم أن تعرفوا الحق؟"], [2, "أنتم يامن تبغضون الخير وتحبون الشر، وتسلخون جلود شعبي وتجردون لحومهم عن عظامهم."], [3, "الذين تأكلون لحوم شعبي، وتسلخون جلودهم عنهم وتهشمون عظامهم، وتقطعونهم كما يقطع اللحم في القدر، أو كاللحم المعد للمقلى."]]}, {"l": "Mic 7:2-4", "n": "", "vs": [[2, "قد باد الصالح من الأرض واختفى المستقيم من بين الناس. جميعهم يكمنون لسفك الدماء، وكل واحد منهم يقتنص أخاه."], [3, "تجد أيديهم في ارتكاب الشر، ويسعى الرئيس والقاضي وراء الرشوة، ويملي العظيم عليهم أهواء نفسه، فيتآمرون جميعا على الحق."], [4, "أفضلهم مثل العوسج، وأكثرهم استقامة أسوأ من سياج الشوك. وها يوم عقابكم الذي أنذر به أنبياؤكم قد وافى. عندئذ يعتريكم الارتباك."]]}, {"l": "Mat 23:34-36", "n": "", "vs": [[34, "لذلك: ها أنا أرسل إليكم أنبياء وحكماء ومعلمين، فبعضهم تقتلون وتصلبون، وبعضهم تجلدون في مجامعكم، وتطاردونهم من مدينة إلى أخرى."], [35, "وبهذا يقع عليكم كل دم زكي سفك على الأرض: من دم هابيل البار إلى دم زكريا بن برخيا الذي قتلتموه بين الهيكل والمذبح."], [36, "الحق أقول لكم: إن عقاب ذلك كله سينزل بهذا الجيل."]]}, {"l": "Mat 26:59-66", "n": "", "vs": [[59, "وانعقد المجلس من رؤساء الكهنة والشيوخ كلهم، وبحثوا عن شهادة زور على يسوع، ليحكموا عليه بالموت،"], [60, "ولكنهم لم يجدوا، مع أنه حضر شهود زور كثيرون. أخيرا تقدم اثنان"], [61, "وقالا: «هذا قال: إني أقدر أن أهدم هيكل الله وأبنيه في ثلاثة أيام»."], [62, "فوقف رئيس الكهنة وسأله: «أما تجيب بشيء على ما يشهد به هذان عليك؟»"], [63, "ولكن يسوع ظل صامتا. فعاد رئيس الكهنة يسأله: قال: «أستحلفك بالله الحي أن تقول لنا: هل أنت المسيح ابن الله؟»"], [64, "فأجابه يسوع: «أنت قلت! وأقول لكم أيضا إنكم منذ الآن سوف ترون ابن الإنسان جالسا عن يمين القدرة ثم آتيا على سحب السماء!»"], [65, "فشق رئيس الكهنة ثيابه وصرخ: «قد جدف! لا حاجة بنا بعد إلى شهود. وها أنتم قد سمعتم تجديفه."], [66, "فما رأيكم؟» أجابوا: «يستحق عقوبة الموت!»"]]}, {"l": "Mat 27:1", "n": "", "vs": [[1, "ولما طلع الصباح، عقد رؤساء الكهنة وشيوخ الشعب اجتماعا آخر، وتآمروا على يسوع لينزلوا به عقوبة الموت."]]}, {"l": "Mat 27:2", "n": "", "vs": [[2, "ثم قيدوه وساقوه فسلموه إلى بيلاطس الحاكم."]]}, {"l": "Mat 27:25", "n": "", "vs": [[25, "فأجاب الشعب بأجمعه: «ليكن دمه علينا وعلى أولادنا!»"]]}, {"l": "Mat 27:26", "n": "", "vs": [[26, "فأطلق لهم باراباس؛ وأما يسوع فجلده، ثم سلمه إلى الصلب."]]}, {"l": "Act 7:52", "n": "", "vs": [[52, "فأي نبي نجا من اضطهادهم وقد قتلوا الذين أنبأوا بمجيء البار الذي سلمتموه أنتم وقتلتموه!"]]}, {"l": "Act 7:59", "n": "", "vs": [[59, "وبينما كانوا يرجمون استفانوس، كان يدعو: «أيها الرب يسوع، اقبل روحي!»"]]}, {"l": "Act 23:12-14", "n": "", "vs": [[12, "ولما طلع الصباح حاك بعض اليهود مؤامرة لقتل بولس، وحرموا على أنفسهم الطعام والشراب إلى أن يقتلوه."], [13, "وكان عدد الذين حاكوا هذه المؤامرة نحو أربعين رجلا."], [14, "وذهبوا إلى رؤساء الكهنة والشيوخ وقالوا: «حرام علينا الطعام والشراب حتى نقتل بولس."]]}, {"l": "Jam 2:6", "n": "", "vs": [[6, "ولكنكم أنتم عاملتم الفقير معاملة مهينة. ألا تعرفون أن الأغنياء هم الذين يتسلطون عليكم ويجرونكم إلى المحاكم،"]]}, {"l": "Jam 2:7", "n": "", "vs": [[7, "وهم الذين يستهزئون بالمسيح الذي تحملون اسمه الجميل؟"]]}], "kwAr": "لأن الأشرار", "noteAr": ""}, {"kw": "wrong", "raw": "or, wrested, Exo_23:2, Exo_23:6; Deu_16:19; Eze_9:9", "note": "or, wrested, Exo_23:2, Exo_23:6; Deu_16:19; Eze_9:9", "refs": [{"l": "Exo 23:2", "n": "", "vs": [[2, "لا تنسق وراء الأغلبية لارتكاب الشر، ولا تحرف شهادتك في دعوى انجرافا مع الأكثرية،"]]}, {"l": "Exo 23:6", "n": "", "vs": [[6, "لا تحرف حق فقيرك في دعواه لكونه فقيرا."]]}, {"l": "Deu 16:19", "n": "", "vs": [[19, "لا تعوجوا القضاء ولا تحابوا، ولا تقبلوا رشوة، لأن الرشوة تعمي أبصار الحكماء، وتعوج أقوال الصديقين."]]}, {"l": "Eze 9:9", "n": "", "vs": [[9, "فأجابني: «إن إثم شعب إسرائيل ويهوذا عظيم جدا جدا، وقد غرقت الأرض بالدماء، وامتلأت المدينة فسادا لأنهم يقولون: قد هجر الرب الأرض، والرب لا يرى."]]}], "kwAr": "منحرفا", "noteAr": "أو: «معوج». انظر خر 23: 2، 6؛ تث 16: 19؛ حز 9: 9"}], "arS": [["لذلك", ["H5921", "H3651"]], [" ", []], ["بطلت", ["H6313"]], [" ", []], ["الشريعة", ["H8451"]], ["، ", []], ["وباد", ["H3808", "H5331"]], [" ", []], ["العدل", ["H4941"]], [" ", []], ["لأن", ["H3588"]], [" ", []], ["الأشرار", ["H7563"]], [" ", []], ["يحاصرون", ["H3803"]], [" ", []], ["الصديق", ["H6662"]], [" ", []], ["فيصدر", ["H3318"]], [" ", []], ["الحكم", ["H4941"]], [" ", []], ["منحرفا", ["H6127"]], [" عن الحق.", []]]}, {"c": 1, "v": 5, "text": "تأملوا الأمم وأبصروا. تعجبوا وتحيروا لأني مقبل على إنجاز أعمال في عهدكم إذا حدثتم بها لا تصدقونها.", "groups": [{"kw": "ye among", "raw": "Deu_4:27; Jer_9:25, Jer_9:26, 25:14-29", "note": "", "refs": [{"l": "Deu 4:27", "n": "", "vs": [[27, "ويشتتكم الرب بين الأمم فتصبحون أقلية بين الشعوب التي يسوقكم إليها."]]}, {"l": "Jer 9:25", "n": "", "vs": [[25, "«ها أيام مقبلة»، يقول الرب، «أعاقب فيها كل مختون وأغلف"]]}, {"l": "Jer 9:26", "n": "", "vs": [[26, "أهل مصر ويهوذا وأدوم وبني عمون وموآب، وسائر المقيمين في الصحراء ممن يقصون شعر أصداغهم، لأن جميع الشعوب غلف، أما كل بيت إسرائيل فإنهم ذوو قلوب غلفاء»."]]}, {"l": "Jer 25:14-29", "n": "", "vs": [[14, "إذ أن أمما كثيرة وملوكا عظماء يستعبدونهم أيضا، وهكذا أجازيهم بمقتضى أفعالهم وما جنته أيديهم من أعمال أثيمة»."], [15, "وهذا ما أعلنه لي الرب إله إسرائيل: «خذ كأس خمر غضبي من يدي، واسق منها جميع الأمم التي أرسلك إليها،"], [16, "فتشرب وتترنح، وتجن بفعل السيف الذي أرسله بينها»."], [17, "فتناولت الكأس من يد الرب وسقيت منها جميع الأمم التي بعثني إليها الرب:"], [18, "أورشليم ومدن يهوذا وملوكها وعظماءها، لأجعلها قفرا خرابا ومثار صفير ولعنة إلى هذا اليوم."], [19, "وسقيت منها كذلك فرعون ملك مصر وخدامه وعظماءه وكل شعبه،"], [20, "وكل الغرباء المقيمين في وسطهم، وجميع ملوك أرض عوص، وسائر ملوك الفلسطينيين: ملوك أشقلون، وغزة، وعقرون وبقية أشدود،"], [21, "وآدوم، وموآب، وبني عمون،"], [22, "وكل ملوك صور وصيدون وملوك الجزائر عبر البحر،"], [23, "وددان وتيماء وبوز، وكل ذوي الشعر المقصوص الزوايا،"], [24, "وكل ملوك العرب، وسائر ملوك القبائل المنضمة إليهم المقيمين في الصحراء،"], [25, "وكل ملوك زمري، وعيلام، وجميع ملوك مادي."], [26, "وكل ملوك الشمال، القريبين والبعيدين، الواحد تلو الآخر، وكل الممالك المنتشرة على وجه الأرض. ثم بعد ذلك يشرب منها ملك بابل."], [27, "ثم قل لهم، هذا ما يعلنه الرب القدير إله إسر ائيل: اشربوا واثملوا وتقيأوا واسقطوا صرعى، ولا تقوموا من جراء السيف الذي أرسله في وسطكم."], [28, "وإن أبوا أن يتناولوا الكأس من يدك ليشربوا منها، فقل لهم: هذا ما يعلنه الرب القدير: لابد لكم من شربها،"], [29, "لأني شرعت أعاقب المدينة التي دعي اسمي عليها، فهل تفلتون أنتم من العقاب؟ فها أنا قد سلطت السيف على جميع سكان الأرض، يقول الرب القدير."]]}], "kwAr": "تأملوا الأمم", "noteAr": ""}, {"kw": "and regard", "raw": "Isa_29:14; Lam_4:12; Dan_9:12; Act_13:40,Act_13:41", "note": "", "refs": [{"l": "Isa 29:14", "n": "", "vs": [[14, "لذلك سأنتقم من هؤلاء المنافقين، فتبيد حكمة حكمائه وتتلاشى فطنة فهمائه."]]}, {"l": "Lam 4:12", "n": "", "vs": [[12, "لم يصدق ملوك الأرض وسكان المعمورة أن العدو والخصم يقتحمان بوابات أورشليم."]]}, {"l": "Dan 9:12", "n": "", "vs": [[12, "وقد نفذت قضاءك الذي قضيت به علينا وعلى قضاتنا الذين تولوا أمرنا، جالبا علينا وعلى أورشليم شرا عظيما لم يحدث له مثيل تحت السماء."]]}, {"l": "Act 13:40", "n": "", "vs": [[40, "فاحذروا لئلا يحل بكم ما قيل في كتب الأنبياء:"]]}, {"l": "Act 13:41", "n": "", "vs": [[41, "انظروا أيها المتهاونون، وتعجبوا واهلكوا! فإني أعمل في أيامكم عملا لو حدثكم به أحد لما صدقتم!»‍"]]}], "kwAr": "وأبصروا", "noteAr": ""}, {"kw": "for", "raw": "Isa_28:21, Isa_28:22; Jer_5:12, Jer_5:13, Jer_18:18; Eze_12:22-28; Zep_1:2; Act_6:13, Act_6:14", "note": "", "refs": [{"l": "Isa 28:21", "n": "", "vs": [[21, "وسيقبل الرب بسخط، كما أقبل في جبل فراصيم وفي وادي جبعون ليجري أفعاله الغريبة ويعاقب أشد عقاب."]]}, {"l": "Isa 28:22", "n": "", "vs": [[22, "لذلك لا تتهكموا لئلا يتفاقم عقابكم لأن رب كل الأرض القدير قد أبلغني قضاءه بهلاككم."]]}, {"l": "Jer 5:12", "n": "", "vs": [[12, "قد جحدوا الرب وقالوا: «لن يعاقبنا ولن يصيبنا مكروه، ولن نرى سيفا ولن نتعرض لجوع،"]]}, {"l": "Jer 5:13", "n": "", "vs": [[13, "والأنبياء كالريح ووحي الرب ليس معهم. فليأت عليهم ما تنبأوا به»."]]}, {"l": "Jer 18:18", "n": "", "vs": [[18, "ثم قالوا: «تعالوا نتآمر على إرميا، لأن الشريعة لا تبيد عن الكاهن، ولا المشورة عن الحكيم، ولا الوحي عن النبي. تعالوا نلذعه بوخزات اللسان ونصم آذاننا عن كلامه»."]]}, {"l": "Eze 12:22-28", "n": "", "vs": [[22, "«ياابن آدم، ما هذا المثل الشائع في أرض إسرائيل القائل: قد طالت الأيام وكذبت كل رؤيا؟."], [23, "لذلك قل لهم: هذا ما يعلنه السيد الرب: ها أنا قد أبطلت هذا المثل فلا يعودون يرددونه في إسرائيل، بل قل لهم: قد أزفت الأيام وحان تحقيق كلام كل رؤيا،"], [24, "إذ لن تكون بعد رؤيا باطلة ولا عرافة متملقة في وسط شعب إسرائيل."], [25, "لأني أنا الرب أتكلم، والكلمة التي أقضي بها تتم، من غير مماطلة، بل ها أنا أنطق بقضائي في أيامكم أيها الشعب المتمرد وأنفذه في حينه، يقول السيد الرب»."], [26, "ثم أوحى إلي الرب بكلمته قائلا:"], [27, "«ياابن آدم، ها شعب إسرائيل يقولون: إن الرؤيا التي تراها لا تتم إلا بعد أيام كثيرة، ونبوءتك لا تتحقق إلا في أزمنة بعيدة"], [28, "لذلك قل لهم: هذا ما يعلنه السيد الرب: لن يتأخر بعد تنفيذ كلمة من كلامي الذي قضيت به، فكل كلمة نطقت بها لابد أن تتم، يقول السيد الرب»."]]}, {"l": "Zep 1:2", "n": "", "vs": [[2, "يقول الرب: «سأمحو محوا كل شيء عن وجه الأرض."]]}, {"l": "Act 6:13", "n": "", "vs": [[13, "وأقاموا عليه شهود زور ادعوا أنه: «لا يكف عن التعرض بكلامه للهيكل المقدس وللشريعة"]]}, {"l": "Act 6:14", "n": "", "vs": [[14, "فقد سمعناه يقول إن يسوع الناصري سيهدم هذا الهيكل ويغير الطقوس التي تسلمناها من موسى»."]]}], "kwAr": "لأني", "noteAr": ""}], "arS": [["تأملوا", ["H7200"]], [" ", []], ["الأمم", ["H1471"]], [" ", []], ["وأبصروا", ["H5027"]], [". ", []], ["تعجبوا", ["H8539"]], [" ", []], ["وتحيروا", ["H8539"]], [" ", []], ["لأني", ["H3588"]], [" مقبل على ", []], ["إنجاز", ["H6466"]], [" ", []], ["أعمال", ["H6467"]], [" في ", []], ["عهدكم", ["H3117"]], [" ", []], ["إذا", ["H3588"]], [" ", []], ["حدثتم", ["H5608"]], [" بها ", []], ["لا", ["H3808"]], [" ", []], ["تصدقونها", ["H539"]], [".", []]]}, {"c": 1, "v": 6, "text": "فها أنا أثير الكلدانيين، هذه الأمة الحانقة المندفعة الزاحفة في رحاب الأرض، لتستولي على مساكن ليست لها.", "groups": [{"kw": "I raise", "raw": "Deu_28:49-52; 2Ki_24:2; 2Ch_36:6, 2Ch_36:17; Isa_23:13, Isa_39:6, Isa_39:7; Jer_1:15, Jer_1:16; Jer_4:6, Jer_4:8, Jer_5:15, Jer_6:22, Jer_6:23, Jer_21:4, Jer_25:9", "note": "", "refs": [{"l": "Deu 28:49-52", "n": "", "vs": [[49, "ويجلب الرب عليكم من بعيد، من أقصى الأرض، أمة لا تفهمون لغتها، فتنقض عليكم كالنسر."], [50, "أمة يثير منظرها الرعب، لا تهاب الشيخ ولا ترأف بالطفل،"], [51, "فتستولي على نتاج بهائمكم، وتلتهم غلات أرضكم حتى تفنوا، ولا تبقي لكم قمحا ولا خمرا ولا زيتا ولا نتاج بقركم ونعاجكم حتى تهلككم."], [52, "وتحاصركم في جميع مدنكم حتى تتهدم أسواركم الشامخة الحصينة التي وثقتم بمناعتها في كل مدنكم. فتحاصركم في جميع مدنكم في كل أرضكم التي يهبها الرب إلهكم لكم."]]}, {"l": "2Ki 24:2", "n": "", "vs": [[2, "فأرسل الرب غزاة من كلدانيين وأراميين وموآبيين وعمونيين للإغارة على مملكة يهوذا وإبادتها، بموجب ما قضى به الرب على لسان عبيده الأنبياء."]]}, {"l": "2Ch 36:6", "n": "", "vs": [[6, "ثم هاجمه نبوخذناصر ملك بابل وأخذه أسيرا مقيدا إلى بابل."]]}, {"l": "2Ch 36:17", "n": "", "vs": [[17, "فأرسل إليهم ملك الكلدانيين، فقتل نخبتهم بالسيف في عقر الهيكل المقدس. ولم يرحم الرب فتى أو عذراء أو شيخا أو أشيب، بل أسلمهم جميعا ليد الكلدانيين،"]]}, {"l": "Isa 23:13", "n": "", "vs": [[13, "تأملي في أرض الكلدانيين وانظري إلى شعبها، فهم وليس الأشوريون الذين سيجعلون صور مرتعا للوحوش، وسينصبون حولها أبراجهم، ويمسحون قصورها عن وجه الأرض، ويحولونها إلى خراب."]]}, {"l": "Isa 39:6", "n": "", "vs": [[6, "ها أيام تأتي ينقل فيها إلى بابل كل ما في قصرك مما ادخره أسلافك ولا يبقى منها شيء."]]}, {"l": "Isa 39:7", "n": "", "vs": [[7, "ويسبى بعض أبنائك الخارجين من صلبك ليكونوا خصيانا في قصر ملك بابل»."]]}, {"l": "Jer 1:15", "n": "", "vs": [[15, "لأني ها أنا داع جميع عشائر الممالك الشمالية ليأتوا، فينصب كل واحد منهم عرشه عند مدخل بوابات مدينة أورشليم وعلى جميع أسوارها المحيطة بها وعلى جميع مدن يهوذا."]]}, {"l": "Jer 1:16", "n": "", "vs": [[16, "وأصدر عليهم حكم قضائي من أجل كل شرهم لأنهم تركوني، وأحرقوا بخورا لآلهة أخرى وعبدوا صنعة أيديهم."]]}, {"l": "Jer 4:6", "n": "", "vs": [[6, "ارفعوا الراية داعين للجوء إلى صهيون. لوذوا بمأمن. لا تتقاعسوا، لأني جالب عليكم من الشمال دمارا وخرابا."]]}, {"l": "Jer 4:8", "n": "", "vs": [[8, "لذلك تمنطقوا بالمسوح، ونوحوا وولولوا، لأن غضب الرب المحتدم لم يرتد عنا»"]]}, {"l": "Jer 5:15", "n": "", "vs": [[15, "ها أنا أجلب عليكم ياذرية إسرائيل، أمة قديمة قوية من أرض نائية، تجهلون لغة أهلها ولا تفهمون ما يقولون."]]}, {"l": "Jer 6:22", "n": "", "vs": [[22, "«انظروا، ها شعب زاحف من الشمال، وأمة عظيمة تهب من أقاصي الأرض،"]]}, {"l": "Jer 6:23", "n": "", "vs": [[23, "تسلحت بالقوس والرمح، وهي قاسية لا ترحم. جلبتها كهدير البحر وهي مقبلة على صهوات الخيل. قد اصطفت كإنسان واحد لمحاربتك ياأورشليم»."]]}, {"l": "Jer 21:4", "n": "", "vs": [[4, "هذا ما يعلنه الرب إله إسرائيل: ها أنا أرد أسلحتكم التي بأيديكم التي تحاربون بها ملك بابل والكلدانيين الذين يحاصرونكم من خارج السور، وأجمعهم في وسط هذه المدينة."]]}, {"l": "Jer 25:9", "n": "", "vs": [[9, "فها أنا أجند جميع قبائل الشمال بقيادة نبوخذناصر عبدي، وآتي بها إلى هذه الأرض فيجتاحونها ويهلكون جميع سكانها مع سائر الأمم المحيطة بها، وأجعلهم مثار دهشة وصفير، وخرائب أبدية."]]}], "kwAr": "أثير", "noteAr": ""}, {"kw": "breadth", "raw": "Heb. breadths", "note": "Heb. breadths", "refs": [], "kwAr": "رحاب الأرض", "noteAr": "بالعبرية: «رحاب»."}], "arS": [["فها", ["H2009"]], [" أنا ", []], ["أثير", ["H6965"]], [" ", []], ["الكلدانيين", ["H3778"]], ["، هذه ", []], ["الأمة", ["H1471"]], [" ", []], ["الحانقة", ["H4751"]], [" ", []], ["المندفعة", ["H4116"]], [" ", []], ["الزاحفة", ["H1980"]], [" في ", []], ["رحاب", ["H4800"]], [" ", []], ["الأرض", ["H776"]], ["، ", []], ["لتستولي", ["H3423"]], [" على ", []], ["مساكن", ["H4908"]], [" ", []], ["ليست", ["H3808"]], [" لها.", []]]}, {"c": 1, "v": 7, "text": "أمة مخيفة مرعبة، تستمد حكمها وعظمتها من ذاتها.", "groups": [{"kw": "their judgment", "raw": "etc. or, from them shall proceed the judgment of these and the captivity of these, Jer_39:5-9, Jer_52:9-11, Jer_52:25-27; Deu_5:19, Deu_5:27", "note": "etc. or, from them shall proceed the judgment of these and the captivity of these, Jer_39:5-9, Jer_52:9-11, Jer_52:25-27; Deu_5:19, Deu_5:27", "refs": [{"l": "Jer 39:5-9", "n": "", "vs": [[5, "فتعقبهم جيش الكلدانيين، فأدركوا صدقيا في سهل أريحا، فقبضوا عليه وقادوه إلى نبوخذناصر ملك بابل في ربلة في أرض حماة، فأصدر عليه حكمه."], [6, "وقتل ملك بابل أبناء صدقيا في ربلة على مرأى منه كما قتل سائر أشراف يهوذا."], [7, "وفقأ عيني صدقيا وقيده بسلاسل من نحاس ليأخذه أسيرا إلى بابل."], [8, "وأحرق الكلدانيون قصر الملك وبيوت الشعب ونقضوا أسوار أورشليم."], [9, "وسبى نبوزرادان رئيس شرطة بابل بقية الشعب الذي بقي في المدينة، وكل من لجأ إليه."]]}, {"l": "Jer 52:9-11", "n": "", "vs": [[9, "فقبضوا عليه وأخذوه إلى ملك بابل في ربلة، في منطقة حماة، فأصدر عليه قضاءه."], [10, "وذبح ملك بابل أبناء صدقيا على مرأى منه وقتل أيضا جميع أشراف يهوذا في ربلة."], [11, "وفقأ عيني صدقيا وأوثقه بسلسلتين من نحاس، ثم ساقه إلى بابل حيث زجه في السجن إلى يوم وفاته."]]}, {"l": "Jer 52:25-27", "n": "", "vs": [[25, "واعتقل من المدينة الخصي القائد الذي كان يتولى قيادة المحاربين، كما اعتقل سبعة رجال من حاشية الملك ممن عثر عليهم في المدينة، وكذلك أمين سر قائد الجيش الذي كان يجند شعب البلد، وستين رجلا من أهل الأرض الذين كانوا قد اختبأوا داخل المدينة."], [26, "فأخذهم نبوزرادان رئيس الشرطة وساقهم إلى ملك بابل في ربلة،"], [27, "فضربهم ملك بابل وقتلهم في ربلة في منطقة حماة. وهكذا سبي شعب يهوذا من أرضه."]]}, {"l": "Deu 5:19", "n": "", "vs": [[19, "لا تسرق."]]}, {"l": "Deu 5:27", "n": "", "vs": [[27, "فتقدم أنت واستمع كل ما ينطق به الرب إلهنا، وخاطبنا بجميع ما يكلمك به، فنستمع ونطيع."]]}], "kwAr": "حكمها وعظمتها", "noteAr": "إلخ. أو: «منهم يخرج حكم هؤلاء وسبي هؤلاء». انظر إر 39: 5-9؛ 52: 9-11؛ 52: 25-27؛ تث 5: 19، 27"}], "arS": [["أمة ", []], ["مخيفة", ["H366"]], [" ", []], ["مرعبة", ["H3372"]], ["، ", []], ["تستمد", ["H3318"]], [" ", []], ["حكمها", ["H4941"]], [" ", []], ["وعظمتها", ["H7613"]], [" ", []], ["من", ["H4480"]], [" ذاتها.", []]]}, {"c": 1, "v": 8, "text": "خيولها أسرع من النمور، وأكثر ضراوة من ذئاب المساء. فرسانها يندفعون بكبرياء قادمين من أماكن بعيدة، متسابقين كالنسر المسرع للانقضاض على فريسته.", "groups": [{"kw": "horses", "raw": "Deu_28:49; Isa_5:26-28", "note": "", "refs": [{"l": "Deu 28:49", "n": "", "vs": [[49, "ويجلب الرب عليكم من بعيد، من أقصى الأرض، أمة لا تفهمون لغتها، فتنقض عليكم كالنسر."]]}, {"l": "Isa 5:26-28", "n": "", "vs": [[26, "فيرفع راية لأمم بعيدة، ويصفر لمن في أطراف الأرض، فيقبلون مسرعين (إلى أورشليم)،"], [27, "دون أن يكلوا أو يتعثروا أو يعتريهم نعاس أو نوم، أو يحل أحد منهم حزاما عن حقويه، ولا ينقطع لأحد سيور حذاء."], [28, "سهامهم مسننة، وقسيهم مشدودة. حوافر خيلهم كأنها صوان. عجلات مركباتهم مندفعة كالإعصار."]]}], "kwAr": "خيولها", "noteAr": ""}, {"kw": "fierce", "raw": "Heb. sharp", "note": "Heb. sharp", "refs": [], "kwAr": "ضراوة", "noteAr": "بالعبرية: «حادة»."}, {"kw": "evening", "raw": "Jer_5:6; Zep_3:3", "note": "", "refs": [{"l": "Jer 5:6", "n": "", "vs": [[6, "لذلك ينقض عليهم أسد من الغاب ويقتلهم، ويفترسهم ذئب من الصحراء، ويكمن النمر حول مدنهم، فيمزق إربا كل من يخرج منهم، لأن آثامهم كثيرة، وارتداداتهم متعاظمة."]]}, {"l": "Zep 3:3", "n": "", "vs": [[3, "رؤساؤها في داخلها أسود زائرة، وقضاتها كذئاب المساء الجائعة التي لا تبقي شيئا من فرائسها إلى الصباح."]]}], "kwAr": "ذئاب المساء", "noteAr": ""}, {"kw": "they", "raw": "Jer_4:13; Lam_4:19; Eze_17:3, Eze_17:12; Hos_8:1; Mat_24:28; Luk_17:37", "note": "", "refs": [{"l": "Jer 4:13", "n": "", "vs": [[13, "انظروا، ها هو مقبل كسحاب، ومركباته كزوبعة، وجياده أسرع من النسور. ويل لنا لأننا قد هلكنا."]]}, {"l": "Lam 4:19", "n": "", "vs": [[19, "كان مطاردونا أسرع من نسور السماء، تعقبونا على الجبال، وتربصوا بنا في الصحراء."]]}, {"l": "Eze 17:3", "n": "", "vs": [[3, "وقل هذا ما يعلنه السيد الرب: قد حضر إلى لبنان نسر عظيم ضخم الجناحين، طويل القوادم، كث الريش الملون، وأخذ ناصية الأرز."]]}, {"l": "Eze 17:12", "n": "", "vs": [[12, "«قل للشعب المتمرد: ألم تعلموا مغزى هذه الأحجية؟ ها إن ملك بابل قد زحف إلى أورشليم وأسر ملكها ورؤساءها وأتى بهم إليه، إلى بابل."]]}, {"l": "Hos 8:1", "n": "", "vs": [[1, "ضع البوق بين شفتيك لتنفخ فيه، لأن نسرا ينقض على بيت الرب، فإن الشعب قد نقضوا عهدي وتعدوا على شريعتي."]]}, {"l": "Mat 24:28", "n": "", "vs": [[28, "فحيث توجد الجيفة، تتجمع النسور!"]]}, {"l": "Luk 17:37", "n": "", "vs": [[37, "فردوا سائلين: «أين، يارب؟» فقال لهم: «حيث تكون الجيفة، هناك تتجمع النسور!»"]]}], "kwAr": "كالنسر", "noteAr": ""}], "arS": [["خيولها", ["H5483"]], [" ", []], ["أسرع", ["H7043"]], [" ", []], ["من", ["H4480"]], [" ", []], ["النمور", ["H5246"]], ["، ", []], ["وأكثر", ["H2300"]], [" ضراوة ", []], ["من", ["H4480"]], [" ", []], ["ذئاب", ["H2061"]], [" ", []], ["المساء", ["H6153"]], [". ", []], ["فرسانها", ["H6571"]], [" ", []], ["يندفعون", ["H6335"]], [" بكبرياء ", []], ["قادمين", ["H935"]], [" ", []], ["من", ["H4480"]], [" أماكن ", []], ["بعيدة", ["H7350"]], ["، ", []], ["متسابقين", ["H5774"]], [" ", []], ["كالنسر", ["H5404"]], [" ", []], ["المسرع", ["H2363"]], [" ", []], ["للانقضاض", ["H398"]], [" على فريسته.", []]]}, {"c": 1, "v": 9, "text": "يقبلون جميعهم ليعيثوا فسادا، ويطغى الرعب منهم على قلوب الناس قبل وصولهم، فيجمعون أسرى كالرمل.", "groups": [{"kw": "for", "raw": "Hab_1:6, Hab_2:5-13; Deu_28:51, Deu_28:52; Jer_4:7, Jer_5:15-17, Jer_25:9", "note": "", "refs": [{"l": "Hab 1:6", "n": "", "vs": [[6, "فها أنا أثير الكلدانيين، هذه الأمة الحانقة المندفعة الزاحفة في رحاب الأرض، لتستولي على مساكن ليست لها."]]}, {"l": "Hab 2:5-13", "n": "", "vs": [[5, "وكما أن الخمر غادرة، كذلك تأخذ المغتر نشوة الانتصار فلا يستكين، فإن جشعه في سعة الهاوية، وهو كالموت لا يشبع. لهذا يجمع لنفسه كل الأمم ويسبي جميع الشعوب."], [6, "ولكن لا يلبث أن يسخر منه سباياه قائلين: «ويل لمن يكوم لنفسه الأسلاب، ويثرى على حساب ما نهب. إنما إلى متى؟"], [7, "ألا يقوم عليك دائنوك بغتة، أو لا يثورون عليك ويملأونك رعبا، فتصبح لهم غنيمة؟"], [8, "لأنك سلبت أمما كثيرة فإن بقية الشعوب ينهبونك ثأرا لما سفكت من دماء وارتكبت من جور في الأرض، فدمرت مدنا وأهلكت الساكنين فيها."], [9, "ويل لمن يدخر لبنيه مكسب ظلم، ويشيد مسكنه في مقام حصين ليكون في مأمن من الخطر."], [10, "لقد لطخت مؤامرتك بيتك بالعار حين استأصلت أمما عديدة وجلبت الدمار على نفسك."], [11, "حتى حجارة الجدران تصرخ من شرك، فتردد الدعائم الخشبية أصداءها."], [12, "ويل لمن يبني مدينة بالدماء، ويؤسس قرية بالإثم."], [13, "ألم يصدر القضاء من عند الرب القدير أن يؤول تعب الشعوب إلى النار وجهد الأمم إلى الباطل؟"]]}, {"l": "Deu 28:51", "n": "", "vs": [[51, "فتستولي على نتاج بهائمكم، وتلتهم غلات أرضكم حتى تفنوا، ولا تبقي لكم قمحا ولا خمرا ولا زيتا ولا نتاج بقركم ونعاجكم حتى تهلككم."]]}, {"l": "Deu 28:52", "n": "", "vs": [[52, "وتحاصركم في جميع مدنكم حتى تتهدم أسواركم الشامخة الحصينة التي وثقتم بمناعتها في كل مدنكم. فتحاصركم في جميع مدنكم في كل أرضكم التي يهبها الرب إلهكم لكم."]]}, {"l": "Jer 4:7", "n": "", "vs": [[7, "قد برز أسد من أجمته، وزحف مدمر الشعوب. قد أقبل من خدره ليخرب أرضكم، فتصبح مدنكم أطلالا مهجورة من السكان."]]}, {"l": "Jer 5:15-17", "n": "", "vs": [[15, "ها أنا أجلب عليكم ياذرية إسرائيل، أمة قديمة قوية من أرض نائية، تجهلون لغة أهلها ولا تفهمون ما يقولون."], [16, "جعبتها كقبر مفتوح، وكل رجالها جبابرة،"], [17, "فيأكلون حصادكم وطعامكم، ويهلكون أبناءكم وبناتكم، ويلتهمون مواشيكم وقطعانكم، ويأكلون كرومكم وأشجار تينكم، ويدمرون بالسيف مدنكم الحصينة التي عليها تتوكلون."]]}, {"l": "Jer 25:9", "n": "", "vs": [[9, "فها أنا أجند جميع قبائل الشمال بقيادة نبوخذناصر عبدي، وآتي بها إلى هذه الأرض فيجتاحونها ويهلكون جميع سكانها مع سائر الأمم المحيطة بها، وأجعلهم مثار دهشة وصفير، وخرائب أبدية."]]}], "kwAr": "ليعيثوا فسادا", "noteAr": ""}, {"kw": "their faces shall sup up as the east", "raw": "or, the supping up of their faces, as, etc. or, their faces shall look toward the east. Heb. the opposition of their faces shall be toward the east. Isa_27:8; Jer_4:11; Eze_17:10, Eze_19:12; Hos_13:15", "note": "or, the supping up of their faces, as, etc. or, their faces shall look toward the east. Heb. the opposition of their faces shall be toward the east. Isa_27:8; Jer_4:11; Eze_17:10, Eze_19:12; Hos_13:15", "refs": [{"l": "Isa 27:8", "n": "", "vs": [[8, "عاقبته إذ خاصمته ونفيته بنفخة عاصفة في يوم هبوب ريح شرقية."]]}, {"l": "Jer 4:11", "n": "", "vs": [[11, "ويقال في ذلك الحين لهذا الشعب ولأهل أورشليم: ستهب ريح لافحة من هضاب الصحر اء نحو بنت شعبي، لا تستهدف التذرية ولا التنقية،"]]}, {"l": "Eze 17:10", "n": "", "vs": [[10, "وإذا غرست ثانية فهل تزدهر؟ ألا تذوي ذويا كاملا حين تهب عليها الريح الشرقية؟ إنها حتما تذبل في حوض مغرسها»."]]}, {"l": "Eze 19:12", "n": "", "vs": [[12, "لكنها اقتلعت بحنق وطرحت على الأرض، فيبست الريح الشرقية أثمارها، وقصفت فروعها القوية حتى جفت فالتهمتها النيران."]]}, {"l": "Hos 13:15", "n": "", "vs": [[15, "وحتى ولو ازدهر كالعشب بين إخوته تهب ريح شرقية، ريح الرب المقبلة من الصحراء فتجفف ينبوعه وتنضب عينه وتنهب مخابيء كنزه من كل شيء نفيس."]]}], "kwAr": "ويطغى الرعب منهم", "noteAr": "أو: «ابتلاع وجوههم»، أو: «تكون وجوههم نحو الشرق»؛ بالعبرية: «مقابلة وجوههم نحو الشرق». انظر إش 27: 8؛ إر 4: 11؛ حز 17: 10؛ 19: 12؛ هو 13: 15"}, {"kw": "they shall gather", "raw": "Hab_2:5; Gen_41:49; Jdg_7:12; Job_29:18; Psa_139:18; Jer_15:8, Jer_34:22; Hos_1:10; Rom_9:27", "note": "", "refs": [{"l": "Hab 2:5", "n": "", "vs": [[5, "وكما أن الخمر غادرة، كذلك تأخذ المغتر نشوة الانتصار فلا يستكين، فإن جشعه في سعة الهاوية، وهو كالموت لا يشبع. لهذا يجمع لنفسه كل الأمم ويسبي جميع الشعوب."]]}, {"l": "Gen 41:49", "n": "", "vs": [[49, "وادخر يوسف كميات هائلة من القمح حتى كف عن إحصائها لوفرتها العظيمة."]]}, {"l": "Jdg 7:12", "n": "", "vs": [[12, "وكان المديانيون والعمالقة وسائر بني المشرق مخيمين في الوادي، في كثرة الجراد، وجمالهم لا تحصى كالرمل الذي على شاطيء البحر."]]}, {"l": "Job 29:18", "n": "", "vs": [[18, "ثم حدثت نفسي: إني سأموت في خيمتي وتتكاثر أيامي كحبات الرمل."]]}, {"l": "Psa 139:18", "n": "", "vs": [[18, "إن أحصيتها زادت على الرمل عددا. عندما أستيقظ أجدني مازلت معك."]]}, {"l": "Jer 15:8", "n": "", "vs": [[8, "وأجعل عدد أراملهم أكثر من عدد رمل البحر، وأجلب في رابعة النهار مهلكا على أمهات الشبان، وأوقع عليهم الرعب والهول بغتة."]]}, {"l": "Jer 34:22", "n": "", "vs": [[22, "ها أنا آمرهم، يقول الرب، فيرجعون لمحاربة هذه المدينة ويستولون عليها ويحرقونها بالنار، وأجعل مدن يهوذا أطلالا خاوية»."]]}, {"l": "Hos 1:10", "n": "", "vs": [[10, "ومع ذلك فإن عدد بني إسرائيل يكون كرمل البحر الذي لا يكال ولا يحصى. وفي الموضع الذي قيل لهم فيه: أنتم لستم شعبي، يقال لهم: أنتم أبناء الله الحي."]]}, {"l": "Rom 9:27", "n": "", "vs": [[27, "أما إشعياء، فيهتف متكلما على إسرائيل: «ولو كان بنو إسرائيل كرمل البحر عددا، فإن بقية منهم ستخلص."]]}], "kwAr": "فيجمعون", "noteAr": ""}], "arS": [["يقبلون", ["H935"]], [" ", []], ["جميعهم", ["H3605"]], [" ليعيثوا ", []], ["فسادا", ["H2555"]], ["، ", []], ["ويطغى", ["H4041"]], [" ", []], ["الرعب", ["H6440"]], [" منهم على قلوب الناس قبل وصولهم، ", []], ["فيجمعون", ["H622"]], [" ", []], ["أسرى", ["H7628"]], [" ", []], ["كالرمل", ["H2344"]], [".", []]]}, {"c": 1, "v": 10, "text": "يهزأون بالملوك ويعبثون بالحكام. يسخرون من الحصون، يكومون حولها تلالا من التراب، ويستولون عليها.", "groups": [{"kw": "scoff", "raw": "2Ki_24:12, 2Ki_25:6, 2Ki_25:7; 2Ch_36:6, 2Ch_36:10", "note": "", "refs": [{"l": "2Ki 24:12", "n": "", "vs": [[12, "فاستسلم يهوياكين ملك يهوذا وأمه ورجاله وقادته وخصيانه إلى ملك بابل، فقبض عليه نبوخذناصر. وكان ذلك في السنة الثامنة لملكه."]]}, {"l": "2Ki 25:6", "n": "", "vs": [[6, "فأسروا الملك واقتادوه إلى ملك بابل المقيم في ربلة، وحرضوه على القضاء عليه."]]}, {"l": "2Ki 25:7", "n": "", "vs": [[7, "ثم قتلوا أبناء صدقيا على مرأى منه، وقلعوا عينيه، وقيدوه بسلسلتين من نحاس، وساقوه إلى بابل."]]}, {"l": "2Ch 36:6", "n": "", "vs": [[6, "ثم هاجمه نبوخذناصر ملك بابل وأخذه أسيرا مقيدا إلى بابل."]]}, {"l": "2Ch 36:10", "n": "", "vs": [[10, "وفي مطلع السنة الجديدة، أرسل الملك نبوخذناصر فقبض عليه ونقله إلى بابل مع آنية بيت الرب الثمينة، وولى أخاه صدقيا خلفا له على يهوذا وأورشليم."]]}], "kwAr": "يهزأون", "noteAr": ""}, {"kw": "they shall deride", "raw": "Isa_14:16; Jer_32:24, Jer_33:4, Jer_52:4-7", "note": "", "refs": [{"l": "Isa 14:16", "n": "", "vs": [[16, "والذين يرونك يحملقون فيك ويتأملون متسائلين: أهذا هو الإنسان الذي زعزع الأرض وهز الممالك؟"]]}, {"l": "Jer 32:24", "n": "", "vs": [[24, "انظر، ها المتاريس قد أقيمت حول المدينة لِلاستيلاء عليها، ومن جراء السيف والجوع والوباء أصبحت المدينة في يد الذين يحاربونها من الكلدانيين. فكل ما نطقت به قد تم، وها أنت على ذلك شاهد."]]}, {"l": "Jer 33:4", "n": "", "vs": [[4, "لأن هذا ما يعلنه الرب إله إسرائيل عن بيوت هذه المدينة وعن قصور ملوك يهوذا التي تم هدمها، ليقام منها سور دفاع ضد متاريس الحصار والمجانيق."]]}, {"l": "Jer 52:4-7", "n": "", "vs": [[4, "وفي اليوم العاشر من الشهر العاشر من السنة التاسعة لحكمه، زحف نبوخذناصر ملك بابل بجيشه على أورشليم وحاصرها وبنى حولها المتاريس."], [5, "وظلت المدينة تحت الحصار حتى السنة الحادية عشرة من حكم صدقيا."], [6, "وفي اليوم التاسع من الشهر الرابع استفحل الجوع في المدينة حتى لم يبق طعام لشعب الأرض."], [7, "ففتح الشعب ثغرة في المدينة وهرب جميع المحاربين وغادروا المدينة ليلا من طريق البوابة الواقعة بين السورين القريبين من بستان الملك، والكلدانيون ما برحوا محاصرين المدينة من كل جهة، وانطلقوا في طريق البرية."]]}], "kwAr": "يسخرون", "noteAr": ""}], "arS": [["يهزأون", ["H7046"]], [" ", []], ["بالملوك", ["H4428"]], [" ", []], ["ويعبثون", ["H4890"]], [" ", []], ["بالحكام", ["H7336"]], [". ", []], ["يسخرون", ["H7832"]], [" من ", []], ["الحصون", ["H3605", "H4013"]], ["، ", []], ["يكومون", ["H6651"]], [" حولها تلالا من ", []], ["التراب", ["H6083"]], ["، ", []], ["ويستولون", ["H3920"]], [" عليها.", []]]}, {"c": 1, "v": 11, "text": "ثم يجتاحون كالريح ويرحلون، فقوة هؤلاء الرجال هي إلههم.", "groups": [{"kw": "shall his", "raw": "Dan_4:30-34", "note": "", "refs": [{"l": "Dan 4:30-34", "n": "", "vs": [[30, "قال: «أليست هذه هي بابل العظيمة التي بنيتها بقوة اقتداري لتكون عاصمة للمملكة، ولجلال مجدي؟»"], [31, "وفيما كانت كلماته بعد تتردد على شفتيه تجاوب صوت من السماء قائلا: «يانبوخذناصر الملك، لك يقولون الآن قد زال عنك الملك."], [32, "ثم يطردونك من بين الناس فتأوي مع حيوان الصحراء، ويطعمونك العشب كالثيران إلى أن تنقضي عليك سبعة أزمنة، حتى تعلم أن العلي متسلط في مملكة الناس يهبها لمن يشاء»."], [33, "في تلك الساعة تم حكم القضاء على نبوخذناصر، فطرد من بين الناس وأكل العشب كالثيران، وابتل جسمه بندى السماء حتى استرخى شعره مثل النسور، وطالت أظفاره مثل براثن الطيور."], [34, "وفي ختام السبعة الأزمنة، أنا نبوخذناصر، التفت نحو السماء، فرجع إلي عقلي، وباركت العلي وسبحت وحمدت الحي الأبدي ذا السلطان السرمدي، والذي ملكه على مدى الأجيال."]]}], "kwAr": "يجتاحون", "noteAr": ""}, {"kw": "imputing", "raw": "Dan_5:3, Dan_5:4, Dan_5:20", "note": "", "refs": [{"l": "Dan 5:3", "n": "", "vs": [[3, "فأحضروها وشرب بها الملك ونبلاء مملكته وزوجاته ومحظياته"]]}, {"l": "Dan 5:4", "n": "", "vs": [[4, "وأخذوا يسبحون آلهة الذهب والفضة والنحاس والحديد والخشب والحجر."]]}, {"l": "Dan 5:20", "n": "", "vs": [[20, "وعندما شمخ قلبه وقست روحه تعنتا، عزل عن عرش ملكه وجرد من جلاله،"]]}], "kwAr": "فقوة هؤلاء الرجال", "noteAr": ""}], "arS": [["ثم", ["H227"]], [" ", []], ["يجتاحون", ["H2498"]], [" ", []], ["كالريح", ["H7307"]], [" ", []], ["ويرحلون", ["H5674", "H816"]], ["، ", []], ["فقوة", ["H3581"]], [" ", []], ["هؤلاء", ["H2098"]], [" الرجال هي ", []], ["إلههم", ["H433"]], [".", []]]}, {"c": 1, "v": 12, "text": "ألست أنت منذ الأزل أيها الرب إلهي، قدوسي؟ لهذا لن نفنى. لقد أقمت الكلدانيين لمقاضاتنا واخترتهم ياصخرتي لتعاقبنا.", "groups": [{"kw": "thou not", "raw": "Deu_33:27; Psa_90:2, Psa_93:2, Isa_40:28, Isa_57:15; Lam_5:19; Mic_5:2; 1Ti_1:17, 1Ti_6:16; Heb_1:10-12, Heb_13:8; Rev_1:8, Rev_1:11", "note": "", "refs": [{"l": "Deu 33:27", "n": "", "vs": [[27, "فالإله الأبدي هو ملجأكم، وتحتكم تنبسط الأذرع الأبدية، يطرد أمامكم أعداءكم قائلا: أهلكوهم."]]}, {"l": "Psa 90:2", "n": "", "vs": [[2, "قبل أن أوجدت الجبال أو كونت المسكونة، أنت الله من الأزل وإلى الأبد."]]}, {"l": "Psa 93:2", "n": "", "vs": [[2, "عرشك ثابت منذ القديم، لأنك الله منذ الأزل."]]}, {"l": "Isa 40:28", "n": "", "vs": [[28, "ألم تعلموا؟ ألم تسمعوا؟ إن الرب هو إله سرمدي وخالق أقاصي الأرض. لا يهن ولا يخور، وفهمه لا يستقصى."]]}, {"l": "Isa 57:15", "n": "", "vs": [[15, "لأنه هكذا يقول العلي السامي، المقيم في الأبد، الذي يدعى اسمه القدوس: إنني أسكن في العلى وفي الموضع المقدس، وأقيم مع المنسحق، وذوي الروح المتواضعة، لأحيي أرواح المتواضعين، وأنعش قلوب المنسحقين."]]}, {"l": "Lam 5:19", "n": "", "vs": [[19, "أما أنت يارب، فتملك إلى الأبد، وعرشك ثابت من جيل إلى جيل."]]}, {"l": "Mic 5:2", "n": "", "vs": [[2, "أما أنت يابيت لحم أفراتة، مع أنك قرية صغيرة بين ألوف قرى يهوذا، إلا أن منك يخرج لي من يصبح ملكا في إسرائيل وأصله منذ القديم، منذ الأزل."]]}, {"l": "1Ti 1:17", "n": "", "vs": [[17, "فللملك الأزلي، الله الواحد غير المنظور وغير الفاني، الكرامة والمجد إلى أبد الآبدين. آمين!"]]}, {"l": "1Ti 6:16", "n": "", "vs": [[16, "الذي وحده لا فناء له، الساكن في نور لا يدنى منه، الذي لم يره أي إنسان ولا يقدر أن يراه. له الكرامة والقدرة الأبدية. آمين!"]]}, {"l": "Heb 1:10-12", "n": "", "vs": [[10, "كما يخاطب الابن أيضا بقوله: «أنت، يارب، وضعت أساس الأرض في البداية. والسماوات هي صنع يديك."], [11, "هي تفنى، وأنت تبقى. فسوف تبلى كلها كما تبلى الثياب،"], [12, "فتطويها كالرداء، ثم تبدلها. ولكنك أنت الدائم الباقي، وسنوك لن تنتهي!»"]]}, {"l": "Heb 13:8", "n": "", "vs": [[8, "يسوع المسيح هو هو أمسا واليوم وإلى الأبد."]]}, {"l": "Rev 1:8", "n": "", "vs": [[8, "«أنا الألف والياء» (البداية والنهاية). هذا يقوله الرب الإله الكائن والذي كان والذي سيأتي، القادر على كل شيء."]]}, {"l": "Rev 1:11", "n": "", "vs": [[11, "يقول: «دون ما تراه في كتاب، وابعث به إلى الكنائس السبع: في أفسس، وسميرنا، وبرغامس، وثياتيرا، وساردس، وفيلادلفيا، ولاودكية»."]]}], "kwAr": "ألست أنت", "noteAr": ""}, {"kw": "mine", "raw": "Isa_43:15, Isa_49:7; Act_3:14", "note": "", "refs": [{"l": "Isa 43:15", "n": "", "vs": [[15, "أنا هو الرب قدوسكم خالق إسرائيل وملككم."]]}, {"l": "Isa 49:7", "n": "", "vs": [[7, "وهذا ما يقوله الرب فادي إسرائيل وقدوسه لمن صار محتقرا ومرذولا لدى الأمم وعبدا للمتسلطين: يراك الملوك وينهضون، ويسجد لك الرؤساء من أجل الرب الأمين، قدوس إسرائيل الذي اصطفاك."]]}, {"l": "Act 3:14", "n": "", "vs": [[14, "أنتم أنكرتم القدوس البار وطلبتم العفو عن رجل قاتل،"]]}], "kwAr": "قدوسي", "noteAr": ""}, {"kw": "we", "raw": "Hab_3:2; Psa_118:17; Isa_27:6-9; Jer_4:27, Jer_5:18, Jer_30:11, Jer_33:24-26, Jer_46:28; Eze_37:11-14; Amo_9:8, Amo_9:9", "note": "", "refs": [{"l": "Hab 3:2", "n": "", "vs": [[2, "«يارب قد بلغني ما فعلت فخفت يارب، عملك في وسط السنين أحيه، وعرف به على مر الأيام، واذكر الرحمة في الغضب."]]}, {"l": "Psa 118:17", "n": "", "vs": [[17, "لا أموت بل أحيا وأذيع أعمال الرب."]]}, {"l": "Isa 27:6-9", "n": "", "vs": [[6, "ويتأصل يعقوب في الأيام المقبلة ويزهر إسرائيل، وينبت فروعا تملأ الأرض كلها بالثمار."], [7, "هل ضربه الرب كما ضرب ضاربيه، أم هلك كما هلك قاتلوه؟"], [8, "عاقبته إذ خاصمته ونفيته بنفخة عاصفة في يوم هبوب ريح شرقية."], [9, "لهذا يكفر عن إثم يعقوب، ويكون هذا هو كل ثمر محو خطيئته، عندما يجعل جميع حجارة المذبح كحجارة الكلس المسحوقة، ولا يبقى تمثال لعشتاروث أو مذبح قائما."]]}, {"l": "Jer 4:27", "n": "", "vs": [[27, "وهذا ما يقوله الرب: «ستحيق الوحشة بكل الأرض، ولكني لن أفنيها."]]}, {"l": "Jer 5:18", "n": "", "vs": [[18, "ولكن حتى في تلك الأيام لن أفنيكم»، يقول الرب."]]}, {"l": "Jer 30:11", "n": "", "vs": [[11, "لأني معك لأخلصك، يقول الرب، فأبيد جميع الأمم التي شتتك بينها. أما أنت فلن أفنيك بل أؤدبك بالحق ولا أبرئك تبرئة كاملة»."]]}, {"l": "Jer 33:24-26", "n": "", "vs": [[24, "«ألم تسمع ما قاله ذلك الشعب: قد نبذ الرب العشيرتين اللتين اختارهما؟ كذلك احتقروا شعبي وكأنهم لم يعودوا أمة."], [25, "وهذا ما يعلنه الرب: إن كنت لم أعقد ميثاقا مع النهار والليل، ولم أسن أحكاما للسماوات والأرض،"], [26, "فإني أرفض ذرية يعقوب وداود عبدي، فلا أصطفي من ذريته من يحكم على نسل إبراهيم وإسحق ويعقوب. ولكني سأرد سبيهم وأرحمهم»."]]}, {"l": "Jer 46:28", "n": "", "vs": [[28, "لا تخافوا ياذرية عبدي يعقوب، يقول الرب، لأني معكم وأفني جميع الأمم التي شتتكم إليها. أما أنتم فلا أفنيكم بل أؤدبكم بالحق، إنما لا أبرئكم جميعا»."]]}, {"l": "Eze 37:11-14", "n": "", "vs": [[11, "ثم قال لي: «ياابن آدم، هذه العظام هي جملة شعب إسرائيل. ها هم يقولون قد يبست عظامنا ومات رجاؤنا وانقطعنا."], [12, "لذلك تنبأ وقل لهم هذا ما يعلنه السيد الرب: ها أنا أفتح قبوركم وأخرجكم منها ياشعبي وأحضركم إلى أرض إسرائيل،"], [13, "فتدركون أني أنا الرب حين أفتح قبوركم وأخرجكم منها ياشعبي."], [14, "وأضع روحي فيكم فتحيون، وأردكم إلى أرضكم فتدركون أني أنا الرب قد تكلمت وأنجزت ما وعدت به، يقول الرب»."]]}, {"l": "Amo 9:8", "n": "", "vs": [[8, "ها إن عيني الرب مسلطتان على المملكة الخاطئة لأمحوها عن وجه الأرض، إلا أني لن أستأصل بيت يعقوب قاطبة يقول الرب."]]}, {"l": "Amo 9:9", "n": "", "vs": [[9, "أغربل بيت إسرائيل بين جميع الأمم كما تغربل الحنطة في غربال، فلا تسقط حبة على الأرض."]]}], "kwAr": "لن نفنى", "noteAr": ""}, {"kw": "thou hast ordained", "raw": "2Ki_19:25; Psa_17:13; Isa_10:5-7, Isa_37:26; Jer_25:9-14; Eze_30:25", "note": "", "refs": [{"l": "2Ki 19:25", "n": "", "vs": [[25, "ألم تسمع؟ منذ زمن طويل قدرت ذلك. منذ الأيام القديمة قررته وها أنا الآن أحققه، إذ أقمتك لتدمير مدن محصنة فتحولها إلى روابي خربة."]]}, {"l": "Psa 17:13", "n": "", "vs": [[13, "قم يارب تصد له. اصرعه. وبسيفك نج نفسي من الشرير."]]}, {"l": "Isa 10:5-7", "n": "", "vs": [[5, "ويل للأشوريين، قضيب غضبي، الحاملين في أيديهم عصا سخطي."], [6, "أرسلهم ضد أمة منافقة، وأوصيهم على شعبي الذي غضبت عليه، ليغنموا غنائمهم ويستولوا على أسلابهم، ويطأوهم كما يطأون الوحل."], [7, "ولكن ملك أشور لا يعرف أنني أنا الذي أرسلته، ويظن أنه بقدرته قد هاجم شعبي، وفي نيته أن يدمر ويجتاح أمما كثيرة."]]}, {"l": "Isa 37:26", "n": "", "vs": [[26, "ألم تسمع؟ منذ زمن طويل قد قدرت ذلك. منذ الأيام القديمة قررته وها أنا الآن أحققه، إذ أقمتك لتدمير مدن محصنة فتحولها إلى روابي خربة."]]}, {"l": "Jer 25:9-14", "n": "", "vs": [[9, "فها أنا أجند جميع قبائل الشمال بقيادة نبوخذناصر عبدي، وآتي بها إلى هذه الأرض فيجتاحونها ويهلكون جميع سكانها مع سائر الأمم المحيطة بها، وأجعلهم مثار دهشة وصفير، وخرائب أبدية."], [10, "وأبيد من بينهم أهازيج الفرح والطرب وصوت غناء العريس والعروس، وضجيج الرحى ونور السراج."], [11, "فتصبح هذه الأرض بأسرها قفرا خرابا، وتستعبد جميع هذه الأمم لملك بابل طوال سبعين سنة."], [12, "وفي ختام السبعين سنة أعاقب ملك بابل وأمته، وأرض الكلدانيين على إثمهم، وأحولها إلى خراب أبدي»، يقول الرب."], [13, "«وأنفذ في تلك الأرض كل القضاء الذي نطقت به عليها، كل ما دون في هذا الكتاب وتنبأ به إرميا على جميع الأمم."], [14, "إذ أن أمما كثيرة وملوكا عظماء يستعبدونهم أيضا، وهكذا أجازيهم بمقتضى أفعالهم وما جنته أيديهم من أعمال أثيمة»."]]}, {"l": "Eze 30:25", "n": "", "vs": [[25, "وأشدد ذراعي ملك بابل. أما ذراعا فرعون فتتهاويان، فيدركون أني أنا الرب حين أضع سيفي في يد ملك بابل، فيجرده على ديار مصر."]]}], "kwAr": "أقمت", "noteAr": ""}, {"kw": "mighty God", "raw": "Heb. Rock, Deu_32:4, Deu_32:30,Deu_32:31; 1Sa_2:2; Psa_18:1", "note": "Heb. Rock, Deu_32:4, Deu_32:30,Deu_32:31; 1Sa_2:2; Psa_18:1", "refs": [{"l": "Deu 32:4", "n": "", "vs": [[4, "هو الصخر، وصنائعه كلها كاملة، سبله جميعها عدل. هو إله أمانة لا يرتكب جورا، صديق وعادل هو."]]}, {"l": "Deu 32:30", "n": "", "vs": [[30, "إذ كيف يدحر واحد ألفا، ويهزم اثنان من أعدائهم عشرة آلاف منهم، لولا أن صخرهم قد هجرهم والرب قد سلمهم؟"]]}, {"l": "Deu 32:31", "n": "", "vs": [[31, "لأن ليس صخرهم كصخرنا، وهذا ما يقر به أعداؤنا."]]}, {"l": "1Sa 2:2", "n": "", "vs": [[2, "إذ ليس قدوس نظير الرب، ولا يوجد من يماثلك، وليس صخرة كإلهنا."]]}, {"l": "Psa 18:1", "n": "", "vs": [[1, "أحبك يارب، يا قوتي."]]}], "kwAr": "ياصخرتي", "noteAr": "بالعبرية: «صخر». انظر تث 32: 4، 30، 31؛ 1صم 2: 2؛ مز 18: 1"}, {"kw": "established", "raw": "Heb. founded", "note": "Heb. founded", "refs": [], "kwAr": "واخترتهم", "noteAr": "بالعبرية: «أسّستهم»."}, {"kw": "for", "raw": "Isa_27:9, Isa_27:10; Jer_30:11, Jer_31:18-20, Jer_46:28; Heb_12:5, Heb_12:6", "note": "", "refs": [{"l": "Isa 27:9", "n": "", "vs": [[9, "لهذا يكفر عن إثم يعقوب، ويكون هذا هو كل ثمر محو خطيئته، عندما يجعل جميع حجارة المذبح كحجارة الكلس المسحوقة، ولا يبقى تمثال لعشتاروث أو مذبح قائما."]]}, {"l": "Isa 27:10", "n": "", "vs": [[10, "لأن المدينة المنيعة تصبح مقفرة، ويصبح المسكن مهجورا متروكا كالقفر. وهناك يرعى العجل ويربض ويقرض أغصانها."]]}, {"l": "Jer 30:11", "n": "", "vs": [[11, "لأني معك لأخلصك، يقول الرب، فأبيد جميع الأمم التي شتتك بينها. أما أنت فلن أفنيك بل أؤدبك بالحق ولا أبرئك تبرئة كاملة»."]]}, {"l": "Jer 31:18-20", "n": "", "vs": [[18, "قد سمعت أفرايم ينتحب قائلا: أدبتني فتأدبت كعجل غير مروض. أرجعني فأرجع لأنك أنت الرب إلهي."], [19, "فقد تبت بعد أن غويت، وبعد أن تعلمت صفقت على فخذي ندما. خجلت وخزيت لأني حملت عار حداثتي."], [20, "هل أفرايم ابن أثير لدي؟ أليس هو ابنا مسرا؟ لأني مع كثرة تنديدي به فإني مازلت أذكره، لذلك يشتاق قلبي إليه، وأكن له الرحمة»، يقول الرب."]]}, {"l": "Jer 46:28", "n": "", "vs": [[28, "لا تخافوا ياذرية عبدي يعقوب، يقول الرب، لأني معكم وأفني جميع الأمم التي شتتكم إليها. أما أنتم فلا أفنيكم بل أؤدبكم بالحق، إنما لا أبرئكم جميعا»."]]}, {"l": "Heb 12:5", "n": "", "vs": [[5, "فهل نسيتم الوعظ الذي يخاطبكم به الله بوصفكم أبناء له؟ إذ يقول: «ياابني، لا تستخف بتأديب الرب. ولا تفقد العزيمة حين يوبخك على الخطأ."]]}, {"l": "Heb 12:6", "n": "", "vs": [[6, "فإن الذي يحبه الرب يؤدبه. وهو يجلد كل من يتخذه له اب ."}, {"kw": "wherefore", "raw": "Psa_10:1, Psa_10:2, Psa_10:15, Psa_73:3; Jer_12:1, Jer_12:2", "note": "", "refs": [{"l": "Psa 10:1", "n": "", "vs": [[1, "رب، لماذا تقف بعيدا وتحتجب في أزمنة الضيق؟"]]}, {"l": "Psa 10:2", "n": "", "vs": [[2, "الشرير، بعجرفة، يجد في تعقب المسكين، غير أن الأشرار يسقطون في مؤامرتهم التي فكروا فيها."]]}, {"l": "Psa 10:15", "n": "", "vs": [[15, "حطم ذراع الشرير والفاجر. حاسبه على شره، حتى إذا طلبته لا تجده."]]}, {"l": "Psa 73:3", "n": "", "vs": [[3, "لأني حسدت المتكبرين، إذ شاهدت نجاح الأشرار."]]}, {"l": "Jer 12:1", "n": "", "vs": [[1, "أنت دائما عادل حين أعرض عليك دعواي، ولكن دعني أحدثك بشأن أحكامك: لماذا تفلح طريق الأشرار؟ ولماذا يتمتع الغادرون بالعيش الرغيد؟"]]}, {"l": "Jer 12:2", "n": "", "vs": [[2, "أنت غرستهم فتأصلوا ونموا وأثمروا. اسمك يتردد على أفواههم، ولكنه بعيد عن قلوبهم."]]}], "kwAr": "فكيف تحتمل", "noteAr": ""}, {"kw": "deal", "raw": "Isa_21:2, Isa_33:1", "note": "", "refs": [{"l": "Isa 21:2", "n": "", "vs": [[2, "لقد أعلنت لي رؤيا رهيبة: رأيت الناهب ينهب، والمدمر يدمر. فاصعدي يا عيلام، وحاصري يا مادي، لأنني سأسكت كل الأنين الذي سببته."]]}, {"l": "Isa 33:1", "n": "", "vs": [[1, "ويل لك أيها المدمر الذي لم تدمر بعد، والناهب الذي لم ينهبوك، فعندما تكف عن التدمير تدمر، وحين تمتنع عن النهب ينهبونك."]]}], "kwAr": "الأثمة", "noteAr": ""}, {"kw": "holdest", "raw": "Est_4:14; Psa_35:22, Psa_50:3, Psa_50:21, Psa_83:1; Pro_31:8, Pro_31:9; Isa_64:12", "note": "", "refs": [{"l": "Est 4:14", "n": "", "vs": [[14, "لأنك إن لزمت الصمت في مثل هذا الوقت، فإن الفرج والنجاة لابد أن يأتيا لليهود من مصدر آخر، وأما أنت وبيت أبيك فتفنون. ومن يدري، فلربما قد وصلت إلى عرش الملك لوقت مثل هذا!»"]]}, {"l": "Psa 35:22", "n": "", "vs": [[22, "قد رأيت يارب ذلك. لا تسكت ولا تبتعد عني."]]}, {"l": "Psa 50:3", "n": "", "vs": [[3, "يأتي إلهنا ولا يصمت، تحيط به النار الآكلة والعواصف الثائرة."]]}, {"l": "Psa 50:21", "n": "", "vs": [[21, "هذه كلها فعلت وأنا سكت، فظننت أني مثلك. غير أني أوبخك وأصف إثمك أمام عينيك."]]}, {"l": "Psa 83:1", "n": "", "vs": [[1, "ياالله ل "فرحين", ["H1523"]], [".", []]]}, {"c": 1, "v": 16, "text": "لهذا هم يقربون ذبائح لشباكهم، ويحرقون بخورا لمصائدهم، لأنهم بفضلها يتمتعون بالرفاهية ويتلذذون بأطايب الطعام.", "groups": [{"kw": "they", "raw": "Hab_1:11; Deu_8:17; Isa_10:13-15, Isa_37:24; Eze_28:3, Eze_29:3; Dan_4:30, Dan_5:23", "note": "", "refs": [{"l": "Hab 1:11", "n": "", "vs": [[11, "ثم يجتاحون كالريح ويرحلون، فقوة هؤلاء الرجال هي إلههم."]]}, {"l": "Deu 8:17", "n": "", "vs": [[17, "خوفا من أن تقولوا في قلوبكم: لقد أحرزنا هذا الثراء بفضل قوتنا وقدرة أيدينا."]]}, {"l": "Isa 10:13-15", "n": "", "vs": [[13, "لأنه يقول: بقوة ذراعي قد صنعت هذا، وبحكمتي، لأنني فهيم! قد نقلت تخوم الأمم، ونهبت كنوزهم، وعزلت الجالسين على العروش كما يفعل ذو البطش."], [14, "وكما تستحوذ يد الإنسان على العش، هكذا استحوذت يدي على ثروات الشعوب. وكما يجمع الإنسان البيض المهجور، هكذا جمعت الأرض بأسرها، فلم يجرؤ أحد أن يحرك جناحا أو يفتح فاها أو ينبس بهمسة."], [15, "أتزهو الفأس على من يقطع بها، أم يتعظم المنشار على من ينشر به، وكأن القضيب يحرك رافعه، أو كأن العصا ترفع ما ليس خشبا؟!"]]}, {"l": "Isa 37:24", "n": "", "vs": [[24, "لقد عيرت السيد على لسان رسلك، وقلت: بكثرة مركباتي قد صعدت إلى أعالي الجبال، وبلغت أقاصي لبنان قاطعا أطول أرزه وخيار سروه واخترقت أبعد ربوعه وأفضل غاباته."]]}, {"l": "Eze 28:3", "n": "", "vs": [[3, "ها أنت أحكم من دانيآل ولا يخفى عليك سر."]]}, {"l": "Eze 29:3", "n": "", "vs": [[3, "وقل هذا ما يعلنه السيد الرب: ها أنا أنقلب عليك يافرعون ملك مصر، أيها التمساح الكامن في وسط أنهاره، القائل: النهر لي وقد صنعته لنفسي."]]}, {"l": "Dan 4:30", "n": "", "vs": [[30, "قال: «أليست هذه هي بابل العظيمة التي بنيتها بقوة اقتداري لتكون عاصمة للمملكة، ولجلال مجدي؟»"]]}, {"l": "Dan 5:23", "n": "", "vs": [[23, "بل تغطرست على رب السماء، فأحضروا أمامك آنية هيكله لتشرب بها الخمر، أنت ونبَلاء دولتك وزوجاتك ومحظياتك، وسبحت آلهة الفضة والذهب والنحاس والحديد والخشب والحجر التي لا تبصر ولا تسمع ولا تدرك، أما الله الذي بيده روحك وله كل طرقك، فلم تمجده."]]}], "kwAr": "يقربون", "noteAr": ""}, {"kw": "plenteous", "raw": "or, dainty, Heb. fat", "note": "or, dainty, Heb. fat", "refs": [], "kwAr": "بأطايب الطعام", "noteAr": "أو: «شهي»، بالعبرية: «سمين»."}], "arS": [["لهذا", ["H5921", "H3651"]], [" هم ", []], ["يقربون", ["H2076"]], [" ذبائح ", []], ["لشباكهم", ["H2764"]], ["، ", []], ["ويحرقون", ["H6999"]], [" بخورا ", []], ["لمصائدهم", ["H4365"]], ["، ", []], ["لأنهم", ["H3588"]], [" ", []], ["بفضلها", ["H1992"]], [" ", []], ["يتمتعون", ["H2506"]], [" ", []], ["بالرفاهية", ["H8082"]], [" ويتلذذون ", []], ["بأطايب", ["H1277"]], [" ", []], ["الطعام", ["H3978"]], [".", []]]}, {"c": 1, "v": 17, "text": "أمن أجل هذا يظلون يفرغون شباكهم ولا يكفون عن إهلاك الأمم إلى الأبد؟", "groups": [{"kw": "and", "raw": "Hab_1:9, Hab_1:10, Hab_2:5-8, Hab_2:17; Isa_14:16, Isa_14:17; Jer. 25:9-26, 46:1-49:39, 52:1-34; Ezek. 25:1-30:26", "note": "", "refs": [{"l": "Hab 1:9", "n": "", "vs": [[9, "يقبلون جميعهم ليعيثوا فسادا، ويطغى الرعب منهم على قلوب الناس قبل وصولهم، فيجمعون أسرى كالرمل."]]}, {"l": "Hab 1:10", "n": "", "vs": [[10, "يهزأون بالملوك ويعبثون بالحكام. يسخرون من الحصون، يكومون حولها تلالا من التراب، ويستولون عليها."]]}, {"l": "Hab 2:5-8", "n": "", "vs": [[5, "وكما أن الخمر غادرة، كذلك تأخذ المغتر نشوة الانتصار فلا يستكين، فإن جشعه في سعة الهاوية، وهو كالموت لا يشبع. لهذا يجمع لنفسه كل الأمم ويسبي جميع الشعوب."], [6, "ولكن لا يلبث أن يسخر منه سباياه قائلين: «ويل لمن يكوم لنفسه الأسلاب، ويثرى على حساب ما نهب. إنما إلى متى؟"], [7, "ألا يقوم عليك دائنوك بغتة، أو لا يثورون عليك ويملأونك رعبا، فتصبح لهم غنيمة؟"], [8, "لأنك سلبت أمما كثيرة فإن بقية الشعوب ينهبونك ثأرا لما سفكت من دماء وارتكبت من جور في الأرض، فدمرت مدنا وأهلكت الساكنين فيها."]]}, {"l": "Hab 2:17", "n": "", "vs": [[17, "لأن ما ارتكبته من ظلم في حق لبنان يغطيك، وما أهلكته من بهائم يروعك. من أجل ما سفكته من دماء واقترفته من جور في الأرض والمدن والساكنين فيها."]]}, {"l": "Isa 14:16", "n": "", "vs": [[16, "والذين يرونك يحملقون فيك ويتأملون متسائلين: أهذا هو الإنسان الذي زعزع الأرض وهز الممالك؟"]]}, {"l": "Isa 14:17", "n": "", "vs": [[17, "الذي حول المسكونة إلى مثل القفر، وقلب مدنها، ولم يطلق أسراه ليرجعوا إلى بيوتهم؟"]]}, {"l": "Jer 25:9-26", "n": "", "vs": [[9, "فها أنا أجند جميع قبائل الشمال بقيادة نبوخذناصر عبدي، وآتي بها إلى هذه الأرض فيجتاحونها ويهلكون جميع سكانها مع سائر الأمم المحيطة بها، وأجعلهم مثار دهشة وصفير، وخرائب أبدية."], [10, "وأبيد من بينهم أهازيج الفرح والطرب وصوت غناء العريس والعروس، وضجيج الرحى ونور السراج."], [11, "فتصبح هذه الأرض بأسرها قفرا خرابا، وتستعبد جميع هذه الأمم لملك بابل طوال سبعين سنة."], [12, "وفي ختام السبعين سنة أعاقب ملك بابل وأمته، وأرض الكلدانيين على إثمهم، وأحولها إلى خراب أبدي»، يقول الرب."], [13, "«وأنفذ في تلك الأرض كل القضاء الذي نطقت به عليها، كل ما دون في هذا الكتاب وتنبأ به إرميا على جميع الأمم."], [14, "إذ أن أمما كثيرة وملوكا عظماء يستعبدونهم أيضا، وهكذا أجازيهم بمقتضى أفعالهم وما جنته أيديهم من أعمال أثيمة»."], [15, "وهذا ما أعلنه لي الرب إله إسرائيل: «خذ كأس خمر غضبي من يدي، واسق منها جميع الأمم التي أرسلك إليها،"], [16, "فتشرب وتترنح، وتجن بفعل السيف الذي أرسله بينها»."], [17, "فتناولت الكأس من يد الرب وسقيت منها جميع الأمم التي بعثني إليها الرب:"], [18, "أورشليم ومدن يهوذا وملوكها وعظماءها، لأجعلها قفرا خرابا ومثار صفير ولعنة إلى هذا اليوم."], [19, "وسقيت منها كذلك فرعون ملك مصر وخدامه وعظماءه وكل شعبه،"], [20, "وكل الغرباء المقيمين في وسطهم، وجميع ملوك أرض عوص، وسائر ملوك الفلسطينيين: ملوك أشقلون، وغزة، وعقرون وبقية أشدود،"], [21, "وآدوم، وموآب، وبني عمون،"], [22, "وكل ملوك صور وصيدون وملوك الجزائر عبر البحر،"], [23, "وددان وتيماء وبوز، وكل ذوي الشعر المقصوص الزوايا،"], [24, "وكل ملوك العرب، وسائر ملوك القبائل المنضمة إليهم المقيمين في الصحراء،"], [25, "وكل ملوك زمري، وعيلام، وجميع ملوك مادي."], [26, "وكل ملوك الشمال، القريبين والبعيدين، الواحد تلو الآخر، وكل الممالك المنتشرة على وجه الأرض. ثم بعد ذلك يشرب منها ملك بابل."]]}, {"l": "Jer 46:1-49:39", "n": "", "vs": [[1, "هذه هي النبوءة التي أوحى بها الرب إلى إرميا عن الأمم."], [2, "نبوءة عن مصر، عن جيش فرعون نخو ملك مصر الذي كان معسكرا على نهر الفرات في كركميش، حيث قضى عليه نبوخذناصر ملك بابل في السنة الرابعة ليهوياقيم بن يوشيا ملك يهوذا."], [3, "«أعدوا المجن والترس وازحفوا للقتال."], [4, "أسرجوا الخيل وامتطوها أيها الفرسان، وانتصبوا بالخوذ. اصقلوا الرماح والبسوا الدروع."], [5, "ولكن مالي أراهم يولون الأدبار مرتعبين؟ قد دحر محاربوهم وفروا مسرعين. لم يلتفتوا إلى الوراء، قد حاصرهم الهول من كل جانب»، يقول الرب."], [6, "«عجز الخفيف عن الجري للفرار، وليس في وسع المحارب الهرب. في الشمال عثروا وسقطوا إلى جوار نهر الفرات."], [7, "من هذا الطاغي كالنيل، كالأنهار المتلاطمة الأمواج؟"], [8, "تتعالى مصر كفيضان النيل، كالأنهار المتلاطمة الأمواج. تقول: أفيض وأغمر الأرض، أهدم المدن وأهلك سكانها."], [9, "اقتحمي أيتها الخيل، وثوري يامركبات، وليبرز المحاربون من رجال كوش وفوط، الحاملين التروس، ومن رجال لوديم رماة السهام بالقسي."], [10, "فهذا اليوم هو يوم قضاء السيد الرب القدير، يوم الانتقام. فيه يثأر لنفسه من أعدائه، فيلتهم السيف ويشبع، ويرتوي من دمائهم، لأن للسيد الرب القدير ذبيحة في أرض الشمال إلى جوار نهر الفرات."], [11, "اصعدي إلى جلعاد وخذي بلسانا ياعذراء ابنة مصر. ولكن باطلا تكثرين من العقاقير، إذ لا شفاء لك."], [12, "ستسمع الأمم بما لحق بك من عار، ويملأ صراخك الأرض، لأن بطلا محاربا يصطدم ببطل محارب فيسقطان كلاهما معا»."], [13, "النبوءة التي أوحى بها الرب إلى إرميا النبي عن زحف نبوخذناصر ملك بابل لمهاجمة مصر:"], [14, "«أذيعوا في مصر وأعلنوا في مجدل. خبروا في ممفيس وفي تحفنحيس، قولوا: قف متأهبا وتهيأ لأن السيف يلتهم من حولك."], [15, "لماذا فر إلهك الثور أبيس ولم يصمد في القتال؟ لأن الرب طرحه."], [16, "كثر العاثرين، فسقط كل واحد على صاحبه. فتقول بقية اليهود آنئذ: قوموا لنرجع إلى قومنا وإلى أرض موطننا، هربا من سيف الطاغي."], [17, "ويهتفون هناك: إن فرعون ملك مصر ليس سوى طبل أجوف أضاع فرصته."], [18, "حي أنا يقول الملك الذي اسمه الرب القدير، سيقبل نبوخذناصر كجبل تابور بين الجبال وكالكرمل عند البحر."], [19, "تأهبوا للجلاء ياأهل مصر، لأن ممفيس ستضحى أطلالا وخربا مهجورة."], [20, "مصر عجلة فاتنة هاجمها الهلاك من الشمال."], [21, "حتى مرتزقتها في وسطها كعجول مسمنة قد نكصوا على أعقابهم هاربين معا ولم يصمدوا، لأن يوم بلائهم قد حل بهم في وقت عقابهم."], [22, "صوتها كحفيف الحية المتلوية، لأن أعداءها زاحفون إليها بفؤوس كحطابي الأشجار."], [23, "سيقطعون غابها، يقول الرب، وإن كان يتعذر اختراقه، لأن عددهم يفوق الجراد في الكثرة."], [24, "لحق الخزي بابنة مصر، ووقعت في أسر أهل الشمال»."], [25, "ويقول الرب القدير إله إسرائيل: «ها أنا أعاقب آمون طيبة وفرعون، ومصر وآلهتها، وملوكها، وكل من يتكل على فرعون."], [26, "وأسلمهم إلى يد طالبي حياتهم: إلى يد نبوخذناصر ملك بابل ويد رجاله، ثم تعود بعد ذلك وتصبح آهلة بالسكان كالعهد بها في الحقب السالفة، يقول الرب."], [27, "ولكن لا تخافوا ياذرية عبدي يعقوب، ولا تفزع ياإسرائيل، لأني سأنقذكم من الغربة وأخلص نسلكم من أرض السبي، فترجع ذرية يعقوب وتتمتع بالدعة والطمأنينة من غير أن يرعبها أحد."], [28, "لا تخافوا ياذرية عبدي يعقوب، يقول الرب، لأني معكم وأفني جميع الأمم التي شتتكم إليها. أما أنتم فلا أفنيكم بل أؤدبكم بالحق، إنما لا أبرئكم جميعا»."], [1, "هذه هي النبوءة التي أوحى بها الرب إلى إرميا عن الفلسطينيين قبل أن يهاجم فرعون غزة."], [2, "هذا ما يعلنه الرب: «ها هي مياه تطغى من الشمال، فتصبح سيلا جارفا، فتغمر الأرض ومن عليها، المدينة والساكنين فيها. فيستغيث الناس ويولول كل أهل البلاد،"], [3, "من صوت وقع حوافر خيله، ومن جلبة مركباته، ومن صرير عجلاتها، فلا يلتفت الآباء إلى الأبناء من فرط ما يعتريهم من وهن."], [4, "رعبا من اليوم المقبل لإبادة الفلسطينيين، ولاستئصال صور وصيدون وكل معين باق، لأن الرب يدمر الفلسطينيين بقية جزيرة كفتور."], [5, "قد أصبحت غزة جرداء، وساد أشقلون صمت الموت. يابقية العناقيين، إلى متى تظلون تجرحون أنفسكم حزنا؟"], [6, "ياسيف الرب، متى تستكين؟ استقر في غمدك واهدأ واسترح."], [7, "كيف يمكن له أن يستكين، وقد أصدر الرب له أمره ليضرب أشقلون ومدن ساحل البحر، هناك واعده الرب على اللقاء»."], [1, "نبوءة عن الموآبيين: هذا ما يعلنه الرب القدير إله إسرائيل: «ويل لنبو لأنها أصبحت أطلالا. لحق العار بقريتايم وتم الاستيلاء عليها. خزي الحصن وارتعب."], [2, "زال فخر موآب وتآمروا في حشبون عليها شرا قائلين: هيا نهدمها فلا تكون أمة بعد. وأنت أيضا يامدمين، يهيمن عليك صمت الموت ويلاحقك السيف."], [3, "اسمعوا صوت صراخ من حورونايم: قد حل بنا هلاك ودمار عظيمان."], [4, "قد تحطمت موآب، وبلغ صراخها صوغر."], [5, "إذ على مرتفع لوحيت يصعدون باكين بمرارة، وعلى منحدر حورونايم يتردد صراخ الانكسار."], [6, "اهربوا وانجوا بأنفسكم. كونوا كعرعر في البرية."], [7, "لأنكم اتكلتم على أعمالكم وكنوزكم، ستسبون أيضا ويقع الصنم كموش أيضا أسيرا ويؤخذ إلى المنفى مع كهنته ورؤسائه."], [8, "ويزحف المدمر إلى كل مدينة، فلا تفلت منه إحداها، فيبيد الوادي، ويتلف السهل، لأن الرب قد قضى."], [9, "أعطوا موآب أجنحة، فيحلق طائرا. قد أصبحت مدنه أطلالا مهجورة من الناس."], [10, "ملعون من يقوم بعمل الرب متهاونا، وملعون من حظر على سيفه الدم."], [11, "قد قضى موآب حياة مترفة منذ حداثته، كالخمر المستقر على عكره. لم يفرغ من إناء إلى إناء، ولم يذهب إلى السبي قط لذلك ظل محتفظا بطعمه ولم تتغير رائحته."], [12, "ها هي أيام مقبلة، يقول الرب، أرسل فيها إليه عابري السبيل ساكبي الجرار، فيسكبونه ويفرغون جراره ويحطمون دنانه."], [13, "فيعتري الموآبيين الخجل من كموش، كما اعترى الخجل الإسرائيليين من بيت إيل، متكلهم."], [14, "كيف تقولون: إننا أبطال وجبابرة حرب؟"], [15, "إن موآب سيدمر، وتغزى مدنه، وتنزل نخبة شبانه للذبح، يقول الملك الذي اسمه الرب القدير."], [16, "قد أزفت بلية موآب ومحنته أقبلت مسرعة."], [17, "فارثوه ياجميع المحيطين به وسائر العارفين اسمه. قولوا انكسر صولجان العز وقضيب المجد."], [18, "اهبطي من المجد واجلسي على الأرض الظمأى أيتها الساكنة في ديبون، لأن مدمر موآب قد زحف عليك وهدم حصونك."], [19, "قفي على قارعة الطريق وراقبي ياساكنة عروعير. اسألي الهارب والناجية بنفسها: ماذا جرى؟"], [20, "فيأتي الجواب: قد لحق الخزي بموآب، لأنه صار أطلالا فولولوا وأعولوا. أذيعوا في أرنون أن موآب قد أصبح خرابا."], [21, "قد وقع القضاء على أرض السهل، وعلى حولون، وعلى يهصة، وعلى ميفعة،"], [22, "وعلى ديبون، وعلى نبو، وعلى بيت دبلتايم،"], [23, "وعلى قريتايم، وعلى بيت جامول، وعلى بيت معون،"], [24, "وعلى قريوت، وعلى بصرة، وعلى كافة مدن بلاد موآب البعيدة والقريبة."], [25, "قد كسر قرن موآب، وتحطمت ذراعه، يقول الرب."], [26, "أسكروه حتى يتمرغ في قيئه، ويصبح مهزأة، لأنه تغطرس على الرب."], [27, "ألم يصبح إسرائيل مهزأة لديك؟ أكان بين اللصوص حتى كنت تهز رأسك باحتقار كلما جاء ذكره على لسانك؟"], [28, "اهجروا المدن وأقيموا بين الصخور ياأهل موآب، وكونوا كالحمامة التي تعشش عند حافة فوهة الكهف."], [29, "قد سمعنا عن عجرفة موآب المفرطة. إنه شديد الكبرياء. سمعنا عن غطرسته وتشامخه وغروره، وعن ارتفاع قلبه."], [30, "قد عرفت كبرياءه يقول الرب، إنما زهوه باطل، وتفاخره عديم الجدوى."], [31, "لذلك أنوح على موآب وأعول على كل أهله، وأئن على رجال قير حارس."], [32, "أبكي عليك أكثر من البكاء على يعزير ياجفنة سبمة التي امتدت فروعها حتى البحر، بل بلغت بحر يعزير، فإن المدمر قد انقض على حصادك الناضج وقطافك."], [33, "قد تلاشى الفرح والغبطة من بساتين موآب ومن حقوله، وأوقف تدفق الخمر من المعاصر فلا يدوسها دائس بهتاف، بل تعلو صرخات لا هتاف فيها."], [34, "يرتفع الصراخ من حشبون إلى ألعالة فياهص. أطلقوا أصواتهم من صوغر إلى حورونايم حتى العجلة الثالثة، لأن مياه نمريم أيضا قد نضبت."], [35, "وأبيد من موآب، يقول الرب، من يقرب ذبيحة على مرتفعة، ومن يحرق بخورا لآلهة الوثن."], [36, "لذلك يئن قلبي على موآب كأنين مزمار، وينوح فؤادي على رجال قير حارس كنوح الناي، فإن ثروتهم التي اكتسبوها قد تبددت."], [37, "قد أصبح كل رأس أقرع، وكل لحية محلوقة، تجرحت الأيدي وتمنطقت الأحقاء بالمسوح."], [38, "شاع النوح على سطوح موآب وفي شوارعها كلها، لأني حطمت موآب كإناء ليس لأحد رغبة فيه، يقول الرب."], [39, "لشد ما تحطمت! لشد ما يولولون: كيف أدبر موآب مجللا بالخزي؟ قد صار مثار هزء ورعب لكل من حوله»."], [40, "لأن هذا ما يعلنه الرب: «انظروا، ها واحد يطير مسرعا كالنسر باسطا جناحيه ضد موآب."], [41, "فيستولي على المدن، وتسقط الحصون، وتصبح في ذلك اليوم قلوب محاربي موآب كقلب امرأة في مخاضها."], [42, "يهلك موآب ولا يبقى أمة، لأنه قد تغطرس على الرب."], [43, "يترصدكم الرعب والحفرة والفخ ياأهل موآب، يقول الرب."], [44, "من يهرب من الخوف يقع في الحفرة، ومن يصعد من الحفرة يعلق بالفخ، لأني أجلب على موآب هذه المحن في سنة عقابهم، يقول الرب."], [45, "في ظل حشبون وقف الهاربون خائري القوى، لأن نارا اندلعت من حشبون، وشعلة من سيحون، فالتهمت ركن موآب وهامة المتبجحين الغوغائيين."], [46, "ويل لك ياموآب! قد باد شعب كموش، لأن بنيك وبناتك أخذوا إلى السبي."], [47, "ولكني أرد سبي موآب في الأيام الآتية»، يقول الرب. إلى هنا ختام القضاء على موآب."], [1, "نبوءة عن بني عمون، هذا ما يعلنه الرب: «أليس لإسرائيل أبناء؟ أليس له وارث؟ فما بال ملك العمونيين قد استولى على ميراث سبط جاد وسكن شعبه في مدنه؟"], [2, "لذلك ها أيام مقبلة، يقول الرب، أجعل فيها هتاف القتال يتردد في ربة العمونيين، فتصير تلة أطلال، وتحرق قراها بالنار فيجلي الإسرائيليون الذين أجلوهم، يقول الرب."], [3, "أعولي ياحشبون لأن عاي قد خربت. ابكين يابنات ربة وتمنطقن بالمسوح. اندبن واذرعن الأرض بين السياجات فإن ملككن سيذهب إلى السبي مع كهنته ورؤسائه جميعا."], [4, "ما بالك تباهين بالأودية أيتها الابنة المخادعة التي اتكلت على نفائسها قائلة: من يهاجمني؟"], [5, "ها أنا أوقع بك الرعب من جميع المحيطين بك، فيتشرد كل واحد منكم مطرودا، وليس من يجمع شتات الهاربين."], [6, "ثم أعود فأرد سبي العمونيين، يقول الرب»."], [7, "نبوءة عن الأدوميين: «هذا ما يعلنه الرب القدير: ألم تبق في تيمان حكمة بعد؟ هل بادت المشورة من ذوي الفهم؟ هل تلاشت حكمتهم؟"], [8, "اهربوا: أدبروا، اختبئوا في الأعماق ياسكان ددان، لأني سأوقع البلية بذرية عيسو في أوان عقابها."], [9, "لو أقبل قاطفو العنب إليك، ألا يبقون خصاصة؟ ولو انسل اللصوص ليلا، ألا يقنعون بسلب ما يكفيهم؟"], [10, "أما أنا فقد جردت ذرية عيسو، وكشفت عن مخابئها السرية، وليس في وسعها الاختفاء. هلك أبناء عيسو وإخوته وجيرانه ولم يبق له أثر بعد."], [11, "اترك أيتامك فإني أحييهم، ولتتكل أراملك علي."], [12, "لأن هذا ما يعلنه الرب: إن كان الذين لا يستحقون تجرع كأس العقاب قد تجرعوه، أتفلت أنت من العقاب؟ إنك لن تفلت من العقاب، بل عليك أن تجرعه حتما."], [13, "ها أنا قد أقسمت بنفسي، يقول الرب، أن تصبح بصرة عرضة للرعب والعار والخراب واللعنة، وتغدو مدنها خرائب دائمة."], [14, "تبلغت رسالة من لدن الرب، أن سفيرا قد بعث إلى الأمم قائلا: «احشدوا أنفسكم لمهاجمتها. هبوا للقتال."], [15, "قد جعلتك صغيرا في الأمم، حقيرا بين الناس."], [16, "قد خدعك ما تثيره من رعب، وأغوتك كبرياء قلبك، يامن تقيم في شقوق الصخر وتعتصم بقمة التل. ولكنني سأطرحك من هناك ولو بنيت عشك عاليا كعش النسر، يقول الرب."], [17, "ستصبح أدوم مثار رعب، وكل من يمر بها تعتريه رعدة، ويصفر من جراء كل نكباتها،"], [18, "ويصيبها ما أصاب سدوم وعمورة وما جاورهما، من انقلاب، يقول الرب، فلا يسكن هناك إنسان ولا يتغرب فيها أحد."], [19, "ها هو ينقض على الأدوميين في مواطن صخورهم كما ينقض فجأة أسد من أجمات نهر الأردن؛ وفي لحظة أطردهم
