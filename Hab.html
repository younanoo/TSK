["يارب", ["H3068"]], ["؟ أعلى ", []], ["الأنهار", ["H5104"]], [" احتدم ", []], ["سخطك", ["H639"]], ["؟ أم على ", []], ["البحر", ["H3220"]], [" سكبت جام ", []], ["غيظك", ["H5678"]], ["، ", []], ["عندما", ["H3588"]], [" ", []], ["ركبت", ["H7392"]], [" ", []], ["خيولك", ["H5483"]], [" ", []], ["ومركبات", ["H4818"]], [" ", []], ["ظفرك", ["H3444"]], ["؟", []]]}, {"c": 3, "v": 9, "text": "جردت قوسك وتأهبت لإطلاق سهامك الكثيرة، وشققت الأرض أنهارا.", "groups": [{"kw": "bow", "raw": "Deu_32:23; Psa_7:12, Psa_7:13, Psa_35:1-3; Isa_51:9, Isa_51:10, Isa_52:10; Lam_2:4", "note": "", "refs": [{"l": "Deu 32:23", "n": "", "vs": [[23, "أكوم عليهم شرورا وأنفذ سهامي فيهم."]]}, {"l": "Psa 7:12", "n": "", "vs": [[12, "صقل سيفه ليضرب به الشرير الذي لا يتوب. وتر قوسه وهيأها."]]}, {"l": "Psa 7:13", "n": "", "vs": [[13, "أعد له الأسلحة القتالة، وجعل سهامه محرقة."]]}, {"l": "Psa 35:1-3", "n": "", "vs": [[1, "يارب كن خصما لمن يخاصمونني، وحارب الذين يحاربونني."], [2, "تقلد الترس والدرع وهب لنجدتي."], [3, "جرد رمحا وتصد لمطاردي، وقل لنفسي: خلاصك أنا."]]}, {"l": "Isa 51:9", "n": "", "vs": [[9, "استيقظي، استيقظي، تسربلي بالقوة ياذراع الرب، استيقظي كالعهد بك في الأيام القديمة، وفي الأجيال الغابرة. ألست أنت التي مزقت رهب إربا إربا، وطعنت التنين؟"]]}, {"l": "Isa 51:10", "n": "", "vs": [[10, "ألست أنت التي جففت البحر، ومياه اللجج العميقة، وجعلت أعماق البحر طريقا يعبر فوقه المفديون؟"]]}, {"l": "Isa 52:10", "n": "", "vs": [[10, "شمر الرب عن ذراع قدسه أمام عيون كل الأمم، فترى أقاصي الأرض خلاص إلهنا."]]}, {"l": "Lam 2:4", "n": "", "vs": [[4, "وتر قوسه كعدو. نصب يمينه كمبغض. ذبح كعدو كل عزيز في عيوننا. وسكب سخطه كنار على خيمة ابنة صهيون."]]}], "kwAr": "قوسك", "noteAr": ""}, {"kw": "according", "raw": "Gen_15:18-21, Gen_17:7, Gen_17:8, Gen_22:16-18, Gen_26:3, Gen_26:4, Gen_28:13, Gen_28:14; Psa_105:8-11; Luk_1:72-75; Heb_6:13-18", "note": "", "refs": [{"l": "Gen 15:18-21", "n": "", "vs": [[18, "في ذلك اليوم عقد الله ميثاقا مع أبرام قائلا: «سأعطي نسلك هذه الأرض من وادي العريش إلى النهر الكبير، نهر الفرات."], [19, "أرض القينيين والقنزيين، والقدمونيين"], [20, "والحثيين والفرزيين والرفائيين"], [21, "والأموريين والكنعانيين والجرجاشيين واليبوسيين»."]]}, {"l": "Gen 17:7", "n": "", "vs": [[7, "وأقيم عهدي الأبدي بيني وبينك، وبين نسلك من بعدك جيلا بعد جيل، فأكون إلها لك ولنسلك من بعدك."]]}, {"l": "Gen 17:8", "n": "", "vs": [[8, "وأهبك أنت وذريتك من بعدك جميع أرض كنعان، التي نزلت فيها غريبا، ملكا أبديا. وأكون لهم إلها»."]]}, {"l": "Gen 22:16-18", "n": "", "vs": [[16, "وقال: «ها أنا أقسم بذاتي يقول الرب: لأنك صنعت هذا الأمر، ولم تمنع ابنك وحيدك عني،"], [17, "لأباركنك وأكثرن ذريتك فتكون كنجوم السماء وكرمل شاطيء البحر، وترث ذريتك مدن أعدائها."], [18, "وبذريتك تتبارك جميع أمم الأرض، لأنك أطعتني»."]]}, {"l": "Gen 26:3", "n": "", "vs": [[3, "أقم في هذه الأرض فأكون معك وأباركك، لأنني أعطي لك ولذريتك جميع هذه الأرض وفاء بقسمي الذي أقسمت لإبراهيم أبيك."]]}, {"l": "Gen 26:4", "n": "", "vs": [[4, "وأكثر ذريتك كنجوم السماء وأهبها جميع هذه البلاد. وتتبارك في نسلك جميع أمم الأرض."]]}, {"l": "Gen 28:13", "n": "", "vs": [[13, "والرب نفسه واقف فوقها يقول: «أنا هو الرب إله أبيك إبراهيم وإله إسحق. إن الأرض التي ترقد عليها الآن أعطيها لك ولذريتك،"]]}, {"l": "Gen 28:14", "n": "", "vs": [[14, "التي ستكون كتراب الأرض، وتمتد غربا وشرقا، وشمالا وجنوبا، وتتبارك بك وبذريتك جميع شعوب الأرض."]]}, {"l": "Psa 105:8-11", "n": "", "vs": [[8, "لم ينس عهده قط ولا وعده الذي قطعه إلى ألف جيل،"], [9, "العهد الذي أبرمه مع إبراهيم، والقسم الذي أقسم به لإسحق."], [10, "ثم ثبته ليعقوب فريضة، ولإسرائيل ميثاقا أبديا،"], [11, "قائلا: «لك أعطي أرض كنعان نصيب ميراث لكم»."]]}, {"l": "Luk 1:72-75", "n": "", "vs": [[72, "ليتم الرحمة نحو آبائنا ويتذكر عهده المقدس"], [73, "ذلك القسم الذي أقسم لإبراهيم أبينا: بأن يمنحنا،"], [74, "بعد تخليصنا من أيدي أعدائنا، أن نعبده بلا خوف،"], [75, "بقداسة وبر أمامه، طوال حياتنا."]]}, {"l": "Heb 6:13-18", "n": "", "vs": [[13, "لنأخذ وعد الله لإبراهيم مثلا. فلما قطع له ذلك الوعد، أقسم بنفسه، إذ ليس هنالك من هو أعظم منه حتى يقسم به."], [14, "وقد قال له: «لأباركنك وأعطينك نسلا كثيرا!»"], [15, "وهكذا، انتظر إبراهيم بصبر فنال ما وعد به."], [16, "فالواقع أن الناس يقسمون بالأعظم. والقسم عندهم، يضع حدا لكل مشاجرة لأنه يحسم الأمور."], [17, "ولذلك، لما أراد الله أن يؤكد بصورة قاطعة لوارثي وعده، أن قراره لا يتغير أبدا، ثبته بالقسم."], [18, "فاستنادا إلى وعد الله وقسمه، وهما أمران ثابتان لا يتغيران ويستحيل أن يكذب الله فيهما، نحصل على تشجيع قوي، بعدما التجأنا إلى التمسك بالرجاء الموضوع أمامنا."]]}], "kwAr": "لإطلاق", "noteAr": ""}, {"kw": "Selah", "raw": "Hab_3:9; Psa_143:6", "note": "", "refs": [{"l": "Hab 3:9", "n": "", "vs": [[9, "جردت قوسك وتأهبت لإطلاق سهامك الكثيرة، وشققت الأرض أنهارا."]]}, {"l": "Psa 143:6", "n": "", "vs": [[6, "بسطت إليك يدي.. عطشت إليك نفسي كأرض ظامئة."]]}], "kwAr": "", "noteAr": ""}, {"kw": "Thou", "raw": "Exo_17:6; Num_20:11; Psa_78:15, Psa_78:16, Psa_105:41; 1Co_10:4", "note": "", "refs": [{"l": "Exo 17:6", "n": "", "vs": [[6, "فها أنا أقف هناك أمامك على الصخرة في حوريب. اضرب الصخرة فينفجر منها الماء ليشرب الشعب». وهكذا فعل موسى أمام شيوخ إسرائيل."]]}, {"l": "Num 20:11", "n": "", "vs": [[11, "ورفع موسى يده وضرب الصخرة بعصاه مرتين، فتفجر ماء غزير، فشربت الجماعة ومواشيها."]]}, {"l": "Psa 78:15", "n": "", "vs": [[15, "شق صخورا في البرية وسقاهم ماء غزيرا كأنه من اللجج."]]}, {"l": "Psa 78:16", "n": "", "vs": [[16, "أخرج من الصخرة سواقي، أجرى مياهها كأنهار."]]}, {"l": "Psa 105:41", "n": "", "vs": [[41, "فلق الصخرة وفجر منها المياه، فجرت في الصحراء كأنها نهر."]]}, {"l": "1Co 10:4", "n": "", "vs": [[4, "وشربوا كلهم شرابا واحدا له رمز روحي، إذ شربوا من صخرة روحية تبعتهم، وقد كانت هذه الصخرة هي المسيح."]]}], "kwAr": "وشققت", "noteAr": ""}, {"kw": "the earth with rivers", "raw": "or, the rivers of the earth", "note": "or, the rivers of the earth", "refs": [], "kwAr": "الأرض أنهارا", "noteAr": "أو: «أنهار الأرض»."}], "arS": [["جردت", ["H5783", "H6181"]], [" ", []], ["قوسك", ["H7198"]], [" وتأهبت لإطلاق ", []], ["سهامك", ["H7621"]], [" الكثيرة، ", []], ["وشققت", ["H1234"]], [" ", []], ["الأرض", ["H776"]], [" ", []], ["أنهارا", ["H5104"]], [".", []]]}, {"c": 3, "v": 10, "text": "رأتك الجبال فارتعدت، وطمت المياه الهائجة. زأرت اللجج وارتفعت أمواجها عالية.", "groups": [{"kw": "mountains", "raw": "Hab_3:6; Exo_19:16-18; Jdg_5:4, Jdg_5:5; Psa_68:7, Psa_68:8, Psa_77:18, Psa_97:4, Psa_97:5, Psa_114:4, Psa_114:6; Isa_64:1, Isa_64:2; Jer_4:24; Mic_1:4; Nah_1:5; Mat_27:51; Rev_6:14, Rev_20:11", "note": "", "refs": [{"l": "Hab 3:6", "n": "", "vs": [[6, "وقف وزلزل الأرض، تفرس فأرعب الأمم، اندكت الجبال الأبدية وانهارت التلال القديمة، أما مسالكه فهي من الأزل."]]}, {"l": "Exo 19:16-18", "n": "", "vs": [[16, "وفي صباح اليوم الثالث حدثت رعود وبروق، وخيم سحاب كثيف على الجبل، ودوى صوت بوق قوي جدا، فارتعد كل الشعب الذي في المخيم،"], [17, "فأخرج موسى الشعب من المخيم للقاء الله، فوقفوا عند سفح الجبل."], [18, "وكان جبل سيناء كله مغطى بدخان، لأن الرب نزل عليه في هيئة نار. وتصاعد دخانه كدخان الأتون، واهتز الجبل كله بعنف."]]}, {"l": "Jdg 5:4", "n": "", "vs": [[4, "يارب، عندما خرجت من سعير وتقدمت من صحراء أدوم، ارتعدت الأرض، وسكبت السماء أمطارها، وقطرت السحب ماء."]]}, {"l": "Jdg 5:5", "n": "", "vs": [[5, "تزلزلت الأرض أمام الرب وارتعد جبل سيناء هذا من حضرة الرب إله إسرائيل."]]}, {"l": "Psa 68:7", "n": "", "vs": [[7, "ياالله ، عندما خرجت أمام شعبك، وقدتهم في البرية،"]]}, {"l": "Psa 68:8", "n": "", "vs": [[8, "رجفت الأرض، وهطلت السماء مطرا، وارتعد جبل سيناء من حضرة الله إله إسرائيل."]]}, {"l": "Psa 77:18", "n": "", "vs": [[18, "(زأر) صوت رعدك في الزوبعة، فأضاءت البروق المسكونة، وارتعدت الأرض واهتزت."]]}, {"l": "Psa 97:4", "n": "", "vs": [[4, "أنارت بروقه المسكونة. رأت الأرض ذلك فارتجفت."]]}, {"l": "Psa 97:5", "n": "", "vs": [[5, "ذابت الجبال كالشمع من نظرة الرب سيد الأرض كلها."]]}, {"l": "Psa 114:4", "n": "", "vs": [[4, "قفزت الجبال كأنها كباش، والتلال كأنها حملان."]]}, {"l": "Psa 114:6", "n": "", "vs": [[6, "مالك ياجبال تقفزين كالكباش، وياتلال كالحملان؟"]]}, {"l": "Isa 64:1", "n": "", "vs": [[1, "ليتك تشق السماوات وتنزل فتتزلزل الجبال من حضرتك!"]]}, {"l": "Isa 64:2", "n": "", "vs": [[2, "فتكون كالنار التي تضرم الهشيم، وتجعل المياه تغلي لكي تعرف أعداءك اسمك، فترتعب الأمم من حضرتك."]]}, {"l": "Jer 4:24", "n": "", "vs": [[24, "نظرت إلى الجبال وإذا بها ترتجف، وإلى الآكام وإذا بها تتقلقل."]]}, {"l": "Mic 1:4", "n": "", "vs": [[4, "فتذوب الجبال من تحت قدميه، وتتصدع الوديان كالشمع أمام النار، كالمياه المنصبة في المنخفضات."]]}, {"l": "Nah 1:5", "n": "", "vs": [[5, "تتزلزل الجبال أمامه، وتذوب التلال، وتتصدع الأرض في حضرته والمسكونة والساكنون فيها."]]}, {"l": "Mat 27:51", "n": "", "vs": [[51, "وإذا ستار الهيكل قد انشق شطرين، من الأعلى إلى الأسفل، وتزلزلت الأرض، وتشققت الصخور،"]]}, {"l": "Rev 6:14", "n": "", "vs": [[14, "وطويت السماء كما تطوى لفافة من ورق، فتزحزحت الجبال والجزر كلها من مواضعها."]]}, {"l": "Rev 20:11", "n": "", "vs": [[11, "ثم رأيت عرشا عظيما أبيض هربت السماء والأرض من أمام الجالس عليه، فلم يبق لهما مكان."]]}], "kwAr": "الجبال", "noteAr": ""}, {"kw": "the overflowing", "raw": "Exo_14:22-28; Jos_3:15, Jos_3:16, Jos_4:18, Jos_4:23, Jos_4:24; Neh_9:11; Psa_18:15, Psa_66:6; Psa_74:13-15, Psa_77:16-19, Psa_114:3-8, Psa_136:13-15; Isa_11:15, Isa_11:16, Isa_63:11-13; Heb_11:29; Rev_16:12", "note": "", "refs": [{"l": "Exo 14:22-28", "n": "", "vs": [[22, "فاجتاز الإسرائيليون في وسط البحر على أرض يابسة، فكان الماء بمثابة سورين عن يمينهم وعن يسارهم."], [23, "ولحق بهم المصريون ودخلوا وراءهم إلى وسط البحر، بجميع خيل فرعون ومركباته وفرسانه."], [24, "وقبل طلوع الصباح أشرف الرب في عمود النار والسحاب على عسكر المصريين وأربكهم."], [25, "فجعل عجلات مركباتهم تتخلع. فطفقوا يجرونها بمشقة حتى قال المصريون: «لنهرب من الإسرائيليين، لأن الرب يحارب عنهم ضدنا»."], [26, "وقال الرب لموسى: «ابسط يدك فوق البحر ليرتد الماء على المصريين مع مركباتهم وفرسانهم»."], [27, "فبسط موسى يده فوق البحر عند انبثاق الصباح، فارتد البحر إلى موضعه على المصريين الهاربين في اتجاهه، فجرفهم الرب نحو وسط البحر."], [28, "وارتدت المياه وأغرقت المركبات والفرسان وكل جيش فرعون الذي لحق بهم إلى البحر، فلم يفلت منهم ناج واحد."]]}, {"l": "Jos 3:15", "n": "", "vs": [[15, "كان نهر الأردن يفيض على جميع ضفافه، لحلول موسم الحصاد. وما إن أقبل الكهنة حاملو التابوت على مياه الأردن وغسلوا أرجلهم في ضفة المياه،"]]}, {"l": "Jos 3:16", "n": "", "vs": [[16, "حتى توقفت المياه المنحدرة من المرتفعات عن الجريان، وأخذت تتراكم على نفسها كما لو كانت محجوزة وراء سد، بعيدا جدا عن مدينة أدام المجاورة لبلدة صرتان. أما المياه المنصبة في البحر الميت فقد انقطعت تماما عنه. وهكذا عبر الشعب قبالة أريحا."]]}, {"l": "Jos 4:18", "n": "", "vs": [[18, "فما إن صعد الكهنة حاملو تابوت عهد الرب من وسط الأردن ووطئت بطون أقدامهم اليابسة، حتى رجعت مياه الأردن تتدفق ثانية وغمرت شطوطه كما كانت تفعل من قبل."]]}, {"l": "Jos 4:23", "n": "", "vs": [[23, "لأن الرب إلهكم شق مياه الأردن أمامكم، فعبرتم النهر فوق أرض يابسة، كما فعل الرب إلهكم بالبحر الأحمر الذي شقه أمامنا حتى عبرنا."]]}, {"l": "Jos 4:24", "n": "", "vs": [[24, "حتى تدرك جميع الشعوب أن يد الرب قوية، فتتقوا الرب إلهكم إلى الأبد»."]]}, {"l": "Neh 9:11", "n": "", "vs": [[11, "إذ فلقت البحر أمام آبائنا، فاجتازوا في وسطه على اليابسة، وطرحت مطارديهم في الأعماق كما يطرح حجر في مياه هائجة،"]]}, {"l": "Psa 18:15", "n": "", "vs": [[15, "ظهرت مجاري المياه العميقة، وانكشفت أسس المسكونة من زجرك يارب، ومن أنفك اللافحة."]]}, {"l": "Psa 66:6", "n": "", "vs": [[6, "حول البحر أرضا يابسة، فاجتازوا في النهر بأقدامهم. هناك فرحنا به."]]}, {"l": "Psa 74:13-15", "n": "", "vs": [[13, "أنت فلقت البحر بقوتك وحطمت رؤوس التنانين."], [14, "أنت مزقت رؤوس فرعون وجيشه، وجعلته قوتا للحيوانات المتوحشة"], [15, "فجرت نبعا وجدولا، وجففت أنهارا دائمة الجريان."]]}, {"l": "Psa 77:16-19", "n": "", "vs": [[16, "رأتك المياه ياالله فارتجفت واضطربت أعماقها أيضا."], [17, "سكبت الغيوم ماء وأرعدت السحب، وتطايرت سهامك."], [18, "(زأر) صوت رعدك في الزوبعة، فأضاءت البروق المسكونة، وارتعدت الأرض واهتزت."], [19, "إنما في البحر طريقك، ومسالكك في المياه الغامرة، وآثار خطواتك لا تتقصى."]]}, {"l": "Psa 114:3-8", "n": "", "vs": [[3, "رأى البحر الأحمر ذلك فهرب، وتراجع نهر الأردن إلى الوراء."], [4, "قفزت الجبال كأنها كباش، والتلال كأنها حملان."], [5, "ما لك يابحر قد هربت، وياأردن قد رجعت إلى الوراء؟"], [6, "مالك ياجبال تقفزين كالكباش، وياتلال كالحملان؟"], [7, "تزلزلي ياأرض في حضرة الرب إله يعقوب."], [8, "الذي حول الصخرة إلى جداول، والصوان إلى ينابيع مياه."]]}, {"l": "Psa 136:13-15", "n": "", "vs": [[13, "الذي فلق البحر الأحمر إلى شطرين، لأن رحمته إلى الأبد تدوم."], [14, "وأجاز الإسرائيليين في وسطه، لأن رحمته إلى الأبد تدوم."], [15, "ودفع فرعون وجيشه إلى البحر، لأن رحمته إلى الأبد تدوم."]]}, {"l": "Isa 11:15", "n": "", "vs": [[15, "ويجفف الرب تماما لسان بحر مصر، ويهز يده على النهر فتهب ريح عاصفة تقسم ماءه إلى سبع ممرات تعبر فيها الجيوش."]]}, {"l": "Isa 11:16", "n": "", "vs": [[16, "ويمد الرب طريقا من أشور ليعود منه من بقي هناك من بني إسرائيل، كما أعاد الرب جميع إسرائيل من مصر."]]}, {"l": "Isa 63:11-13", "n": "", "vs": [[11, "ثم تذكروا الأيام القديمة، أيام موسى عبده وتساءلوا: أين من أصعدنا من البحر مع راعي قطيعه؟ أين من أقام روحه القدوس في وسطنا؟"], [12, "من جعل ذراع قوته المجيدة تسير إلى يمين موسى؟ من شق مياه البحر أمامنا ليكتسب اسما أبديا؟"], [13, "من اقتادنا في اللجج؟ فسرنا كفرس في البرية من غير أن نعثر؟"]]}, {"l": "Heb 11:29", "n": "", "vs": [[29, "بالإيمان اجتاز الشعب في البحر الأحمر كأنه أرض يابسة. أما المصريون، فإذ حاولوا ذلك غرقوا!"]]}, {"l": "Rev 16:12", "n": "", "vs": [[12, "وسكب الملاك السادس كأسه على نهر «الفرات» الكبير فجف ماؤه، ليصير ممرا للملوك القادمين من الشرق."]]}], "kwAr": "وطمت المياه", "noteAr": ""}, {"kw": "the deep", "raw": "Psa_65:13, Psa_93:3, Psa_96:11-13, Psa_98:7, Psa_98:8; Isa_43:20, Isa_55:12", "note": "", "refs": [{"l": "Psa 65:13", "n": "", "vs": [[13, "تتغطى المروج بالقطعان، وتتوشح الوديان بالحنطة، فيهتف لك الكل فرحا وتسبيحا."]]}, {"l": "Psa 93:3", "n": "", "vs": [[3, "يارب قد رفعت الأنهار صوتها. ترفع الأنهار صوت موجها الهادر."]]}, {"l": "Psa 96:11-13", "n": "", "vs": [[11, "لتفرح السماوات ولتبتهج الأرض وليهدر البحر بهجة بأمواجه وبكل ما يحويه."], [12, "ليتهلل الحقل وكل ما فيه، فتترنم فرحا جميع أشجار الغابة"], [13, "في حضرة الرب لأنه آت ليدين العالم بالعدل والشعوب بالحق."]]}, {"l": "Psa 98:7", "n": "", "vs": [[7, "ليهتف البحر بأمواجه وبكل ما فيه، والمسكونة أيضا ومن عليها."]]}, {"l": "Psa 98:8", "n": "", "vs": [[8, "لتصفق الأنهار بالأيدي، وتترنم الجبال معا."]]}, {"l": "Isa 43:20", "n": "", "vs": [[20, "فيكرمني وحش الصحراء: الذئاب والنعام لأني فجرت في القفر ماء، وفي الصحراء أنهارا لأسقي شعبي الذي اخترته،"]]}, {"l": "Isa 55:12", "n": "", "vs": [[12, "لأنكم ستتركون بابل بفرح وسلام فتترنم الجبال والتلال أمامكم بهجة وتصفق أشجار الحقل بأيديها غبطة،"]]}], "kwAr": "اللجج", "noteAr": ""}], "arS": [["رأتك", ["H7200"]], [" ", []], ["الجبال", ["H2022"]], [" ", []], ["فارتعدت", ["H2342"]], ["، ", []], ["وطمت", ["H5674"]], [" ", []], ["المياه", ["H4325"]], [" ", []], ["الهائجة", ["H2230"]], [". ", []], ["زأرت", ["H5414", "H6963"]], [" ", []], ["اللجج", ["H8415"]], [" ", []], ["وارتفعت", ["H5375"]], [" ", []], ["أمواجها", ["H3027"]], [" ", []], ["عالية", ["H7315"]], [".", []]]}, {"c": 3, "v": 11, "text": "القمر والشمس توقفا في منازلهما أمام وميض سهامك المندفعة وبريق رمحك المتلأليء.", "groups": [{"kw": "sun", "raw": "Jos_10:12, Jos_10:13; Isa_28:21, Isa_38:8", "note": "", "refs": [{"l": "Jos 10:12", "n": "", "vs": [[12, "في ذلك اليوم الذي هزم فيه الرب الأموريين أمام بني إسرائيل، ابتهل يشوع إلى الرب على مسمع من الشعب: «ياشمس دومي على جبعون، وياقمر على وادي أيلون»."]]}, {"l": "Jos 10:13", "n": "", "vs": [[13, "فثبتت الشمس، وتوقف القمر حتى انتقم الجيش من أعدائه. أليس هذا مدونا في كتاب ياشر؟ فوقفت الشمس في كبد السماء ولم تسرع للغروب نحو يوم كامل."]]}, {"l": "Isa 28:21", "n": "", "vs": [[21, "وسيقبل الرب بسخط، كما أقبل في جبل فراصيم وفي وادي جبعون ليجري أفعاله الغريبة ويعاقب أشد عقاب."]]}, {"l": "Isa 38:8", "n": "", "vs": [[8, "سأرجع ظل الشمس إلى الوراء عشر درجات على مقياس درجات آحاز». وهكذا تراجعت الشمس عشر درجات إلى الوراء بعد أن كانت قد تخطتها."]]}], "kwAr": "الشمس", "noteAr": ""}, {"kw": "habitation", "raw": "Psa_19:4", "note": "", "refs": [{"l": "Psa 19:4", "n": "", "vs": [[4, "انطلق صوتهم إلى الأرض كلها وكلامهم إلى أقاصي العالم. جعل للشمس مسكنا فيها،"]]}], "kwAr": "منازلهما", "noteAr": ""}, {"kw": "at the light of thine arrows they went", "raw": "or, thine arrows walked in the light, Jos_10:11; Psa_18:12-14, Psa_77:17, Psa_77:18, Psa_144:5, Psa_144:6", "note": "or, thine arrows walked in the light, Jos_10:11; Psa_18:12-14, Psa_77:17, Psa_77:18, Psa_144:5, Psa_144:6", "refs": [{"l": "Jos 10:11", "n": "", "vs": [[11, "وفيما هم لائذون بالفرار أمام الإسرائيليين عند منحدر بيت حورون، قذفهم الرب بعاصفة من برد عظيم انهمرت عليهم من السماء حتى أشرفوا على عزيقة فماتوا. وكان الذين قضى عليهم البرد أكثر من الذين قتلهم سيف بني إسرائيل."]]}, {"l": "Psa 18:12-14", "n": "", "vs": [[12, "من بهاء طلعته عبرت السحب أمامه. حدثت عاصفة برد وبرق كالجمر الملتهب."], [13, "أرعد الرب في السماوات، أطلق العلي صوته فانهمر برد، واندلعت نار!"], [14, "أطلق سهامه فبدد أعدائي، وأرسل بروقه فأزعجهم."]]}, {"l": "Psa 77:17", "n": "", "vs": [[17, "سكبت الغيوم ماء وأرعدت السحب، وتطايرت سهامك."]]}, {"l": "Psa 77:18", "n": "", "vs": [[18, "(زأر) صوت رعدك في الزوبعة، فأضاءت البروق المسكونة، وارتعدت الأرض واهتزت."]]}, {"l": "Psa 144:5", "n": "", "vs": [[5, "يارب طأطىء سماواتك وانزل. المس الجبال فتدخن."]]}, {"l": "Psa 144:6", "n": "", "vs": [[6, "أرسل بروقك وبددهم، أطلق سهامك النارية وأزعجهم."]]}], "kwAr": "وميض سهامك", "noteAr": "أو: «سهامك سارت في النور». انظر يش 10: 11؛ مز 18: 12-14؛ 77: 17، 18؛ 144: 5، 6"}], "arS": [["القمر", ["H3394"]], [" ", []], ["والشمس", ["H8121"]], [" ", []], ["توقفا", ["H5975"]], [" في ", []], ["منازلهما", ["H2073"]], [" أمام ", []], ["وميض", ["H216"]], [" ", []], ["سهامك", ["H2671"]], [" ", []], ["المندفعة", ["H1980"]], [" ", []], ["وبريق", ["H5051"]], [" ", []], ["رمحك", ["H2595"]], [" ", []], ["المتلأليء", ["H1300"]], [".", []]]}, {"c": 3, "v": 12, "text": "تطأ الأرض بسخط، وبغضب تدوس الأمم.", "groups": [{"kw": "didst march", "raw": "Num_21:23-35; Josh. 6:1-12:24; Neh_9:22-24; Psa_44:1-3, Psa_78:55; Act_13:19", "note": "", "refs": [{"l": "Num 21:23-35", "n": "", "vs": [[23, "فلم يأذن سيحون للإسرائيليين بالمرور في تخومه، بل حشد جيشه وخرج للقائهم إلى الصحراء، وحاربهم عند ياهص،"], [24, "فهزمه الإسرائيليون بحد السيف، واستولوا على بلاده من أرنون إلى يبوق حتى حدود العمونيين ولم يتجاوزوها لمناعتها."], [25, "وامتلك الإسرائيليون كل مدن الأموريين، ومن جملتها حشبون وضواحيها وأقاموا فيها،"], [26, "لأن حشبون كانت عاصمة سيحون ملك الأموريين الذي كان قد حارب ملك موآب السابق واستولى على أراضيه كلها حتى أرنون."], [27, "لهذا يقول الشعراء: «هيا إلى حشبون فتبنى، وتشيد مدينة سيحون."], [28, "فقد اندلعت نار من حشبون، لهيب من مدينة سيحون، فالتهمت عار موآب، وأهلكت أهل مرتفعات أرنون."], [29, "ويل لك ياموآب. هلكت ياأمة كموش. قد هرب أبناؤه وأصبحت بناته سبايا سيحون ملك الأموريين."], [30, "لكن قد طوحنا بهم. هلكت حشبون إلى ديبون، دمرنا البلاد حتى نوفح التي تمتد إلى ميدبا»."], [31, "فأقام الإسرائيليون في بلاد الأموريين."], [32, "وأرسل موسى ليستكشف منطقة يعزير، وما لبث بنو إسرائيل أن استولوا على قراها وطردوا منها الأموريين،"], [33, "ثم اتجهوا نحو طريق باشان. فهب عوج ملك باشان مع جميع قومه للقائهم في إذرعي ومحاربتهم."], [34, "فقال الرب لموسى: «لا تخف منه لأنني قد دفعته ليدك مع جميع قومه وأرضه، فتفعل به ما فعلته بسيحون ملك الأموريين في حشبون»."], [35, "فقضوا عليه وعلى أبنائه وقومه حتى لم يبق منهم حي، وامتلكوا دياره."]]}, {"l": "Jos 6:1-12:24", "n": "", "vs": [[1, "وكانت أريحا قد أحكمت إغلاق بواباتها خوفا من الإسرائيليين، فلم يكن يخرج منها أو يدخل إليها أحد."], [2, "فقال الرب ليشوع: «ها أنا قد أخضعت لك أريحا وملكها ومحاربيها الأشداء."], [3, "فليدر محاربوكم دورة واحدة كل يوم حول المدينة، مدة ستة أيام."], [4, "وليحمل سبعة كهنة أبواق الهتاف ويتقدموا أمام التابوت، وفي اليوم السابع تدورون حول المدينة سبع مرات بينما ينفخ الكهنة بالأبواق."], [5, "وما إن يسمع جميع الشعب صوت نفخ بوق ممتدا حتى يطلقوا دوي هتاف عظيم، فينهار سور المدينة في موضعه، فيندفع الشعب نحوها، كل رجل حسب وجهته»."], [6, "فاستدعى يشوع بن نون الكهنة وقال لهم: «احملوا تابوت العهد، وليتقدمه سبعة كهنة حاملين سبعة أبواق هتاف»."], [7, "وأمر الشعب: «هيا دوروا حول المدينة دورة واحدة، ودعوا الجنود المسلحين يمشون في الطليعة أمام تابوت الرب»."], [8, "فسار الشعب بمقتضى ما أمر يشوع، إذ تقدم السبعة الكهنة حاملين أبواق الهتاف السبعة أمام الرب، ونفخوا بالأبواق، بينما كان تابوت الرب يسير خلفهم."], [9, "وانطلق المحاربون أمام الكهنة النافخين بالأبواق. أما مؤخرة الجيش فقد سارت وراء التابوت، فكانوا يمشون والكهنة تنفخ بالأبواق."], [10, "وأمر يشوع الشعب: «لا تهتفوا ولا تتكلموا، ولا يصدر عن أفواهكم صوت حتى آمركم بالهتاف، وعندئذ تهتفون»."], [11, "فدار تابوت الرب حول المدينة مرة واحدة، ثم رجعوا إلى المخيم وباتوا فيه."], [12, "فبكر يشوع في صباح اليوم التالي، وحمل الكهنة تابوت الرب."], [13, "وانطلق المحاربون في الطليعة يتبعهم الكهنة النافخون في أبواق الهتاف، سائرين أمام تابوت الرب، وفي أعقابه تقدمت مؤخرة الجيش. وكانوا يسيرون وينفخون في الأبواق."], [14, "وداروا حول المدينة في اليوم الثاني دورة واحدة، ثم رجعوا إلى المخيم. وظلوا يفعلون هكذا ستة أيام."], [15, "وفي اليوم السابع بكروا عند طلوع الفجر وداروا حول المدينة على هذا النمط سبع مرات، وهو اليوم الوحيد الذي داروا فيه سبع مرات."], [16, "وعندما نفخ الكهنة في الأبواق في المرة السابعة قال يشوع للشعب: «اهتفوا، لأن الرب قد وهبكم المدينة."], [17, "واجعلوا المدينة وكل ما فيها محرما للرب، باستثناء راحاب الزانية وكل من لاذ ببيتها فاستحيوهم، لأنها خبأت الجاسوسين المرسلين لاستطلاع أحوال المدينة."], [18, "وأما أنتم فإياكم أن تأخذوا ما هو محرم لئلا تهلكوا وتجعلوا مخيم إسرائيل محرما وتسببوا له الكوارث."], [19, "أما كل غنائم الفضة والذهب وآنية النحاس والحديد، فتخصص للرب وتحفظ فى خزانته»."], [20, "فهتف الشعب، ونفخ الكهنة في الأبواق. وكان هتاف الشعب لدى سماعهم صوت نفخ الأبواق عظيما، فانهار السور في موضعه. فاندفع الشعب نحو المدينة كل إلى وجهته، واستولوا عليها."], [21, "ودمروا المدينة وقضوا بحد السيف على كل من فيها من رجال ونساء وأطفال وشيوخ حتى البقر والغنم والحمير."], [22, "وقال يشوع للرجلين اللذين ذهبا لاستكشاف المدينة: «ادخلا بيت المرأة الزانية وأخرجاها مع كل ما لها من هناك كما حلفتما لها»."], [23, "فمضى الجاسوسان إلى بيت راحاب، فأخرجاها هي وأباها وأمها وإخوتها وكل ما لها، وأقرباءها، وذهبا بهم إلى مكان آمن خارج مخيم إسرائيل."], [24, "ثم أحرق الإسرائيليون المدينة بالنار بكل ما فيها. أما الفضة والذهب وآنية النحاس والحديد فقد حفظوها في خزانة بيت الرب."], [25, "واستحيا يشوع راحاب الزانية وبيت أبيها وكل ما لها، فأقامت في وسط شعب إسرائيل (وكذلك ذريتها) إلى هذا اليوم، لأنها خبأت الجاسوسين اللذين أرسلهما يشوع لكي يستطلعا أحوال أريحا."], [26, "في ذلك الوقت أنذر يشوع الشعب قائلا: «ملعون أمام الرب كل من يحاول أن يعيد بناء مدينة أريحا، فإن بكره يموت وهو يضع أساساتها، وصغيره يهلك وهو يقيم بواباتها»."], [27, "وكان الرب مع يشوع فشاع صيته في كل الأرض."], [1, "ولكن الإسرائيليين ارتكبوا خيانة، إذ أخذ عخان بن كرمي بن زبدي بن زارح من سبط يهوذا مما هو مخصص للرب، فاحتدم غضب الرب على بني إسرائيل."], [2, "وبعث يشوع بعض رجاله من أريحا إلى عاي الواقعة شرقي بيت إيل بقرب بيت آون، وأمرهم أن يتجسسوا الأرض. فذهبوا"], [3, "ثم رجعوا إلى يشوع قائلين له: «إن أهل عاي قليلو العدد، فلا توجه كل الجيش إلى هناك، بل أرسل نحو ألفي رجل أو ثلاثة آلاف رجل فقط»."], [4, "فصعد من الشعب نحو ثلاثة آلاف رجل، إلا أنهم هزموا أمام أهل عاي،"], [5, "وقتل منهم أهل عاي نحو ستة وثلاثين رجلا، وتعقبوهم من أمام بوابة المدينة حتى شباريم وكسروهم عند المنحدر. فدب الرعب في قلوب بني إسرائيل."], [6, "فمزق يشوع ثيابه وأكب على وجهه إلى الأرض أمام تابوت الرب إلى المساء، هو وشيوخ إسرائيل، وأهالوا التراب على رؤوسهم."], [7, "وقال يشوع: «آه ياسيد الرب، لماذا جعلت هذا الشعب يجتاز نهر الأردن لكي تدفعنا إلى يد الأموريين حتى يبيدونا؟ ليتنا كنا قنعنا وأقمنا شرقي نهر الأردن."], [8, "آه ياسيد، ماذا أقول الآن بعد أن ولى الإسرائيليون الأدبار أمام أعدائهم."], [9, "إذ يبلغ هذا الخبر مسامع الكنعانيين وسائر سكان الأرض، فيتألبون علينا ويزيلوننا من الوجود! وماذا تصنع لاسمك العظيم؟»"], [10, "فقال الرب ليشوع: «قم، لماذا أنت ساقط على وجهك؟"], [11, "لقد ارتكب إسرائيل خطيئة، بل تعدوا على عهدي الذي أمرتهم به، بل أخذوا مما حرمته عليهم وسرقوا وأنكروا، بل خبأوا في أمتعتهم."], [12, "لهذا عجز بنو إسرائيل عن الثبات أمام أعدائهم، فولوا أمامهم الأدبار، لأنهم هالكون إذ لن أعود أكون معكم ما لم تستأصلوا الحرام من وسطكم،"], [13, "قم، واطلب من الشعب أن يتقدسوا ليوم غد، لأنه هكذا قال الرب إله إسرائيل: في وسطك حرام ياإسرائيل، ولن تتمكنوا من هزيمة أعدائكم حتى تستأصلوا الحرام من بينكم."], [14, "فلتتقدم أسباطكم في يوم غد، سبط تلو سبط، والسبط الذي يشير إليه الرب يمثل بعشائره والعشيرة التي يعينها الرب تتقدم ببيوتها، والبيت الذي يحدده الرب يتقدم برجاله."], [15, "والذي تثبت عليه جريمة السرقة مما هو محرم، يحرق بالنار هو وكل ما له، لأنه نقض عهد الرب، وارتكب قباحة في إسرائيل»."], [16, "فبكر يشوع في صباح اليوم التالي، وعرض أمام الرب أسباط إسرائيل، فأشار الرب إلى سبط يهوذا،"], [17, "ثم عرض سبط يهوذا، فعين الرب عشيرة الزارحيين، ثم قدم عشيرة الزارحيين برجالها فأشار الرب إلى زبدي،"], [18, "فعرض بيته برجاله، فحدد الرب عخان بن كرمي بن زبدي بن زارح من سبط يهوذا."], [19, "فقال يشوع لعخان: «ياابني، مجد الرب إله إسرائيل واعترف له، وأخبرني الآن ماذا جنيت؟ لا تخف عني شيئا»."], [20, "فأجاب عخان: «حقا إني أخطأت إلى الرب إله إسرائيل وجنيت هذا الأمر."], [21, "رأيت بين الغنائم رداء شنعاريا نفيسا، ومئتي شاقل فضة (نحو كيلوجرامين ونصف)، وسبيكة من ذهب وزنها خمسون شاقلا (نحو ست مئة جرام)، فاشتهيتها وأخذتها. وها هي مطمورة في الأرض في وسط خيمتي، والفضة تحتها»."], [22, "فأرسل يشوع رسلا فهرعوا إلى الخيمة حيث عثروا عليها مطمورة فيها، والفضة تحتها،"], [23, "فأخرجوها من وسط الخيمة وحملوها إلى يشوع وإلى جميع بني إسرائيل وعرضوها أمام الرب."], [24, "فأخذ يشوع وجميع بني إسرائيل عخان بن زارح والفضة والرداء وسبيكة الذهب، وأبناءه وبناته وبقره وحميره وغنمه وخيمته وكل ماله، وذهبوا بهم إلى وادي عخور."], [25, "وقال يشوع: «لماذا جلبت علينا هذه الكارثة؟ لتحل بك اليوم الفواجع». فرجمه جميع إسرائيل بالحجارة مع أهل بيته وأحرقوهم بالنار،"], [26, "وأقاموا فوقه كومة كبيرة من الحجارة، ما برحت باقية إلى هذا اليوم. فهدأ غضب الرب ولذلك دعي اسم ذلك الموضع وادي عخور ومعناه: (وادي الإزعاج) إلى هذا اليوم."], [1, "وقال الرب ليشوع: «لا تجزع ولا تثبط همتك. خذ جيشك برمته وحاصر عاي لأني قد أسلمتك ملك عاي وشعبه ومدينته وأرضه."], [2, "فتجري على عاي وملكها ما أجريته على أريحا وملكها، غير أنكم تنهبون لأنفسكم غنيمتها وبهائمها. انصب كمينا خلف المدينة»."], [3, "فهب يشوع وجميع المحاربين وتوجهوا لمهاجمة عاي. واختار يشوع ثلاثين ألف رجل من محاربيه الأشداء، وأرسلهم ليلا، بعد أن أوصاهم قائلا:"], [4, "«اذهبوا واكمنوا خلف المدينة. لا تبتعدوا عنها كثيرا وتأهبوا جميعكم للقتال."], [5, "وأما أنا وبقية المحاربين الذين معي فنقترب إلى المدينة. فما إن يخرجوا للقائنا، كما حدث سابقا، حتى نتظاهر بالهرب أمامهم،"], [6, "فيتعقبونا، وبذلك نجذبهم بعيدا عن المدينة، ظنا منهم أننا هاربون أمامهم كما جرى في المرة الماضية،"], [7, "فتنقضون أنتم من المكمن وتستولون على المدينة التي يخضعها الرب إلهكم لكم."], [8, "ولدى استيلائكم على المدينة تضرمون فيها النار كأمر الرب، فافعلوا ونفذوا ما أوصيتكم به»."], [9, "وأطلقهم يشوع فتوجهوا إلى المكمن، حيث تربصوا بالمدينة ما بين بيت إيل وغربي عاي. وقضى يشوع ليلته تلك في وسط الشعب."], [10, "وفي الصباح التالي نهض يشوع مبكرا، وأحصى الجيش وسار هو وشيوخ إسرائيل في طليعتهم نحو عاي."], [11, "وتقدمت معه قواته كلها حتى أتوا إلى مقابل المدينة، حيث نزلوا شماليها، لا يفصل بينهم وبين عاي سوى الوادي."], [12, "وأرسل يشوع قوة دعم أخرى مؤلفة من خمسة آلاف محارب لتكمن بين بيت إيل وعاي غربي المدينة."], [13, "وتمركز الجيش الرئيسي في شمالي المدينة، في حين تربص الكمين في غربيها، أما يشوع فقد قضى تلك الليلة في وسط الوادي."], [14, "ولما رأى ملك عاي ما يجري، خرج بجيشه مبكرا للقاء إسرائيل ومحاربته في السهل، وهو لا يدري أن هناك كمينا يتحفز للهجوم عليهم من خلف المدينة."], [15, "فتظاهر يشوع وبقية الجيش بالانكسار أمامهم، ولاذوا بالفرار في طريق الصحراء."], [16, "فتنادى جميع الشعب الذين في المدينة لتعقب يشوع، فجدوا وراءهم مبتعدين عن المدينة."], [17, "ولم يبق في عاي أو في بيت إيل رجل لم يسع في مطاردة الإسرائيليين، تاركين المدينة مفتوحة للكمين."], [18, "فقال الرب ليشوع: «مد رمحك نحو عاي لأنني وهبتك المدينة». فمد يشوع الحربة التي بيده نحو المدينة،"], [19, "فاندفع الكمين من مكانه بسرعة عندما مد يده بالحربة وركضوا واقتحموا المدينة واستولوا عليها وأحرقوها بالنار."], [20, "فالتفت رجال عاي وراءهم وإذ بهم يشاهدون دخان المدينة يتصاعد إلى السماء، فلم يكن لهم من مهرب، فانقلب الجيش الهارب إلى الصحراء على مطارديه."], [21, "ولما رأى يشوع ومحاربوه أن الكمين قد استولى على المدينة، وأن دخانها قد ملأ الفضاء، شرعوا في مهاجمة رجال عاي والقضاء عليهم."], [22, "كذلك خرج الكمين من المدينة لقطع طريق الهرب عليهم. فوجد أهل عاي أنفسهم محصورين بين الإسرائيليين من الأمام ومن الخلف، ففتك بهم الإسرائيليون، فلم ينج منهم أحد."], [23, "أما ملك عاي فقد وقع في الأسر فتسلمه يشوع."], [24, "وعندما تم القضاء على جيش عاي في الصحراء حيث تعقبوا الإسرائيليين، وفنوا جميعهم بحد السيف، رجع المحاربون الإسرائيليون إلى عاي وقتلوا كل من فيها."], [25, "فكان جميع من قتل في ذلك اليوم من رجال ونساء اثني عشر ألفا، وهم جميع أهل عاي."], [26, "وظل يشوع مادا يده بالحربة نحو المدينة حتى تم القضاء على جميع أهل عاي."], [27, "أما البهائم وغنائم المدينة فقد نهبها الإسرائيليون لأنفسهم، بمقتضى أمر الرب الذي أصدره إلى يشوع."], [28, "وهكذا أحرق يشوع عاي وحولها إلى تل خراب أبدي إلى هذا اليوم."], [29, "وشنق ملك عاي على شجرة إلى وقت المساء، وعند غروب الشمس أمر يشوع فأنزلوا جثته عن الشجرة وطرحوها عند مدخل بوابة المدينةوهالوا عليها كومة حجارة عظيمة إلى هذا اليوم."], [30, "حينئذ بنى يشوع مذبحا للرب إله إسرائيل في جبل عيبال."], [31, "كما أمر موسى عبد الرب بني إسرائيل، بحسب ما هو مدون في كتاب توراة موسى، فكان المذبح مبنيا من حجارة صحيحة لم ينحتها أحد بآلة من حديد، وقدموا عليه محرقات، وقربوا ذبائح سلامة."], [32, "وعلى مرأى من بني إسرائيل نقش يشوع على حجارة المذبح نسخة من شريعة موسى التي كان موسى قد أملاها عليه"], [33, "وكان جميع الإسرائيليين، غرباء ومواطنين، مع شيوخهم وعرفائهم وقضاتهم يقفون إلى جانبي تابوت عهد الرب في مواجهة الكهنة اللاويين حاملي التابوت. وقف نصفهم أمام جبل جرزيم، ووقف النصف الآخر أمام جبل عيبال تنفيذا لتعليمات موسى عبد الرب السابقة التي أصدرها بشأن بركة الشعب."], [34, "ثم تلا يشوع جميع عبارات التوراة المختصة بالبركة واللعنة، كما وردت في كتاب الشريعة."], [35, "لم يغفل يشوع كلمة من كل ما أمر به موسى، بل قرأها كلها أمام جميع بني إسرائيل، حتى أمام النساء والأطفال والغرباء المقيمين بينهم."], [1, "وعندما سمع جميع ملوك الحثيين والأموريين والكنعانيين والفرزيين والحويين واليبوسيين المقيمين غربي نهر الأردن، المستوطنين في الجبال وفي السهول، وعند ساحل البحر (الأبيض المتوسط)، حتى حدود ساحل لبنان، هذه الأمور"], [2, "سارعوا بتوحيد جيوشهم لمحاربة يشوع وبني إسرائيل."], [3, "وحين عرف أهل جبعون بما صنعه يشوع بأريحا وعاي،"], [4, "لجأوا إلى الحيلة الماكرة، فأقبلوا كوفد محملين حميرهم بعدال رثة وزقاق خمر بالية مربوطة،"], [5, "وارتدوا نعالا بالية ومرقعة في أرجلهم، ولبسوا عليهم ثيابا مهترئة، وتزودوا بخبز يابس فقط، تحول إلى فتات،"], [6, "وقدموا على يشوع في مخيم الجلجال، وقالوا له ولقادة إسرائيل: «ها نحن قد جئنا من أرض بعيدة، فاقطعوا لنا عهدا»."], [7, "فقال قادة إسرائيل للحويين: «كيف نقطع لكم عهدا؟ ربما أنتم من سكان هذه المنطقة»."], [8, "فقالوا ليشوع: «نحن عبيد لك» فسألهم يشوع: «من أنتم، ومن أين أقبلتم؟»"], [9, "فأجابوه: «لقد جاء عبيدك على اسم الرب إلهك من أرض بعيدة جدا، لأننا قد سمعنا بقدرته وبكل ما أجراه على مصر،"], [10, "وبكل ما صنعه بملكي الأموريين: سيحون ملك حشبون وعوج ملك باشان، الذي في عشتاروث المقيمين في شرقي الأردن."], [11, "فأشار علينا شيوخنا وسائر سكان أرضنا أن نتزود لهذه الرحلة الطويلة، ونأتي للقائكم ونعلن لكم أن شعبنا صار لكم عبيدا، فتعالوا واقطعوا لنا عهدا."], [12, "هذا هو خبزنا أخذناه من بيوتنا ساخنا يوم بدأنا رحلتنا إليكم، وصار الآن يابسا فتاتا."], [13, "وهذه هي زقاق الخمر التي كانت جديدة يوم ملأناها، قد أصبحت مشققة، وهذه ثيابنا ونعالنا قد بليت من طول المسير على الطريق»."], [14, "فأخذ قادة إسرائيل من زادهم من غير استشارة الرب."], [15, "وعقد يشوع لهم معاهدة صلح، وأبرم معهم ميثاقا للمحافظة على حياتهم، وكذلك حلف لهم قادة إسرائيل."], [16, "وفي نهاية ثلاثة أيام، بعد أن قطعوا لهم عهدا، اكتشف الإسرائيليون أنهم من الحويين القريبين منهم والمقيمين في وسطهم."], [17, "وما لبث أن ارتحل الإسرائيليون في اليوم الثالث وجاءوا إلى مدن الحويين التي هي جبعون والكفيرة وبئيروت وقرية يعاريم."], [18, "فلم يهاجمهم المحاربون لأن قادة الجماعة قد أبرموا معهم عهدا حالفين بالرب إله إسرائيل. فتذمر جميع الشعب على القادة."], [19, "فقال القادة لبني إسرائيل: «إننا قد حلفنا لهم بالرب إله إسرائيل، ولا يمكننا الآن أن نمسهم بسوء."], [20, "ولا يسعنا إلا أن نستحييهم لئلا يحل علينا سخط الرب من جراء اليمين التي حلفنا بها لهم»."], [21, "وأضافوا: «ليحيوا، ولكن ليكونوا لكل الجماعة عبيدا، يحتطبون حطبا ويستقون لهم ماء». وهكذا لم ينكث القادة عهدهم."], [22, "واستدعاهم يشوع وقال لهم: «لماذا خدعتمونا مدعين أنكم تقيمون بعيدا جدا، بينما أنتم ساكنون في وسطنا؟"], [23, "فلتكونوا ملعونين الآن، لا ينقطع منكم العبيد ومحتطبو الحطب ومستقو الماء لبيت إلهي»."], [24, "فأجابوا يشوع قائلين: «لقد بلغ عبيدك أخبار ما وعد به الرب إلهك موسى عبده، أن يهبكم كل الأرض ويهلك جميع سكانها من أمامكم، فخشينا جدا على أنفسنا منكم، فتوسلنا بالحيلة."], [25, "والآن ها نحن تحت رحمتك، فافعل بنا ما تراه صالحا وحقا»."], [26, "وهكذا أنقذهم يشوع من الإسرائيليين فلم يقتلوهم،"], [27, "ولكنه استخدمهم منذ ذلك اليوم في احتطاب الحطب، واستقاء الماء لكل جماعة إسرائيل، ولمذبح الرب إلى هذا اليوم، في الموضع الذي يختاره الرب."], [1, "وعندما سمع أدوني صادق ملك أورشليم أن يشوع استولى على عاي ودمرها وقتل ملكها كما صنع بأريحا وملكها، وأن أهل جبعون قد صالحوا الإسرائيليين وأقاموا في وسطهم،"], [2, "اعتراه خوف شديد، لأن جبعون كانت مدينة عظيمة كإحدى المدن التي يقيم فيها الملوك وهي أعظم من عاي، وكل رجالها محاربون جبابرة."], [3, "فبعث أدوني صادق ملك أورشليم إلى هوهام ملك حبرون وفرآم ملك يرموت ويافيع ملك لخيش ودبير ملك عجلون قائلا:"], [4, "«أقبلوا إلي وأعينوني على تدمير جبعون، لأنها عقدت صلحا مع يشوع وبني إسرائيل»."], [5, "فوحد ملوك الأموريين الخمسة جيوشهم للقيام بهجوم على جبعون."], [6, "فأرسل أهل جبعون إلى يشوع إلى المخيم في الجلجال قائلين: «لا تتقاعس عن إعانة عبيدك، بل أسرع إلينا وأنقذنا وأعنا، لأنه قد تألب علينا جميع ملوك الأموريين المستوطنين في الجبل»."], [7, "فانطلق يشوع من الجلجال بقواته وجنوده الأشداء."], [8, "فقال الرب ليشوع: «لا تخف منهم، لأنني قد أسلمتهم إلى يدك، ولن يجرؤ رجل منهم على مقاومتك»."], [9, "فباغتهم يشوع على حين غرة إذ سار طوال الليل كله من الجلجال."], [10, "وألقى الرب فيهم الرعب أمام الإسرائيليين الذين هزموهم هزيمة نكراء في جبعون، وتعقبوهم في طريق عقبة بيت حورون حتى بلغوا عزيقة ومقيدة."], [11, "وفيما هم لائذون بالفرار أمام الإسرائيليين عند منحدر بيت حورون، قذفهم الرب بعاصفة من برد عظيم انهمرت عليهم من السماء حتى أشرفوا على عزيقة فماتوا. وكان الذين قضى عليهم البرد أكثر من الذين قتلهم سيف بني إسرائيل."], [12, "في ذلك اليوم الذي هزم فيه الرب الأموريين أمام بني إسرائيل، ابتهل يشوع إلى الرب على مسمع من الشعب: «ياشمس دومي على جبعون، وياقمر على وادي أيلون»."], [13, "فثبتت الشمس، وتوقف القمر حتى انتقم الجيش من أعدائه. أليس هذا مدونا في كتاب ياشر؟ فوقفت الشمس في كبد السماء ولم تسرع للغروب نحو يوم كامل."], [14, "ولم يحدث نظير ذلك اليوم لا من قبل ولا من بعد، فيه استجاب الرب دعاء إنسان، لأن الرب حارب حقا عن إسرائيل."], [15, "ثم رجع يشوع وجيشه إلى المخيم في الجلجال."], [16, "وهرب الملوك الخمسة واختبأوا في كهف في مقيدة."], [17, "وعندما قيل ليشوع إن الملوك الخمسة مختبئون في الكهف في مقيدة"], [18, "قال: «دحرجوا حجارة كبيرة على مدخل الكهف وأقيموا عليهم حراسا."], [19, "أما أنتم فتعقبوا جيش العدو وهاجموا مؤخرته ولا تدعوا محاربيه يدخلون مدنهم لأن الرب قد أسلمهم إليكم»."], [20, "وبعد أن هزم يشوع وبنو إسرائيل الملوك الخمسة هزيمة فادحة، ولم ينج منهم إلا قلة من الشاردين الذين لجأوا إلى المدن الحصينة"], [21, "رجع بنو إسرائيل إلى المخيم في مقيدة بسلام حيث كان يشوع. ولم يجرؤ أحد على معارضتهم."], [22, "ثم قال يشوع: «افتحوا مدخل الكهف وأخرجوا إلي الملوك الخمسة»"], [23, "فنفذوا أمره وأخرجوا الملوك الخمسة: ملك أورشليم وملك حبرون وملك يرموت وملك لخيش وملك عجلون،"], [24, "وما إن أقبلوا بهم إليه حتى استدعى كل محاربيه، وقال لقادتهم الذين ساروا معه: «تقدموا وطئوا بأرجلكم رقاب هؤلاء الملوك». ففعلوا كذلك."], [25, "فقال لهم يشوع: «لا تخافوا ولا تجزعوا، بل تقووا وتشجعوا، لأنه هكذا يصنع الرب بجميع أعدائكم الذين تحاربونهم»."], [26, "ثم قتلهم يشوع بعد ذلك وعلق جثثهم على خمسة أشجار، حتى المساء."], [27, "وعند غروب الشمس أمر يشوع فأنزلوهم عنها وطرحوهم في الكهف الذي لجأوا إليه وسدوا مدخله بحجارة كبيرة باقية إلى هذا اليوم."], [28, "واستولى يشوع في ذلك اليوم على مقيدة وقتل بالسيف ملكها وكل نفس فيها. لم يفلت منها ناج، وصنع بملك مقيدة ما صنعه بملك أريحا."], [29, "ثم توجه يشوع على رأس جيشه من مقيدة إلى لبنة وحاربها،"], [30, "فأسلمها الرب هي أيضا إلى يد إسرائيل مع ملكها، فدمرها وقتل كل نفس فيها بحد السيف فلم يفلت منها ناج، وصنع بملكها ما صنعه بملك أريحا."], [31, "بعد ذلك تقدم يشوع من لبنة إلى لخيش وحاصرها وهاجمها،"], [32, "فأسلم الرب لخيش إلى يد إسرائيل، فاستولوا عليها في اليوم التالي ودمروها وقتلوا كل نفس فيها بحد السيف، نظير ما صنعوا بلبنة."], [33, "عندئذ أقبل هورام ملك جازر لمعونة لخيش، فقضى يشوع عليه وعلى جيشه فلم يفلت منهم ناج."], [34, "ثم تحرك يشوع وجيش إسرائيل من لخيش نحو عجلون فحاصروها وحاربوها،"], [35, "واستولوا عليها في ذلك اليوم ودمروها، وقضوا على كل نفس فيها بحد السيف، على غرار ما صنعوا بلخيش."], [36, "ثم اتجه يشوع بقواته من عجلون إلى حبرون وهاجموها،"], [37, "واستولوا عليها ودمروها مع بقية ضواحيها التابعة لها، وقتلوا ملكها وكل نفس فيها بحد السيف فلم يفلت منها ناج، على غرار ما صنعوا بعجلون. وهكذا قضوا على كل نفس فيها."], [38, "ثم عاد يشوع إلى دبير وهاجمها،"], [39, "واستولى عليها ودمرها مع ضواحيها وقتل ملكها وكل نفس فيها بحد السيف فلم يفلت منها ناج، فصنع بدبير وملكها نظير ما صنع بلبنة وملكها."], [40, "وهكذا هاجم يشوع كل أرض الجبل والمناطق السهلية والسفح ودمرها وقتل كل ملوكها، ولم يفلت منها ناج، بل قضى على كل حي كما أمر الرب إله إسرائيل."], [41, "وهكذا أخضع يشوع المنطقة بدءا من قادش برنيع إلى غزة، بما في ذلك منطقة جوشن وجبعون."], [42, "وظفر يشوع بجميع هؤلاء الملوك واستولى على أرضهم دفعة واحدة، لأن الرب إله إسرائيل حارب عنهم."], [43, "ثم رجع يشوع وجميع جيشه معه إلى المخيم، إلى الجلجال."], [1, "وما إن سمع يابين ملك حاصور بانتصارات يشوع حتى بعث بدعوات إلى يوباب ملك مادون وإلى ملك شمرون وإلى ملك أكشاف،"], [2, "وإلى ملوك الجبل شمالا وملوك وادي الأردن جنوبي بحيرة الجليل، وملوك السهل وملوك مرتفعات دور غربا،"], [3, "وإلى ملوك الكنعانيين في الشرق والغرب، والأموريين والحثيين والفرزيين واليبوسيين في إقليم الجبل، والحويين المقيمين على سفح جبل حرمون في أرض المصفاة."], [4, "فاحتشدوا هم وجيوشهم الغفيرة وخيولهم ومركباتهم فكانوا في كثرتهم كرمل البحر."], [5, "والتقى جميع هؤلاء الملوك في موعد محدد حيث خيموا معا عند مياه ميروم لمحاربة الإسرائيليين."], [6, "فقال الرب ليشوع: «لا تخش منهم. غدا في مثل هذا الوقت أهلكهم أمام إسرائيل، فتعرقب خيولهم وتحرق مركباتهم بالنار»."], [7, "فجاء يشوع وجميع جنوده وباغتوهم عند مياه ميروم وهجموا عليهم،"], [8, "فأسلمهم الرب إلى يد إسرائيل، فضربوهم وطاردوهم شمالا حتى صيدون العظيمة وإلى مسرفوت مايم وإلى وادي مصفاة شرقا، وقضوا عليهم بحيث لم يفلت منهم ناج."], [9, "وفعل بهم يشوع كما أمره الرب، فعرقب خيولهم وأحرق مركباتهم بالنار."], [10, "ثم رجع يشوع واستولى على حاصور وقتل ملكها بالسيف، لأن حاصور كانت قبل ذلك زعيمة جميع تلك الممالك."], [11, "وقضوا فيها على كل نسمة بحد السيف، فلم يبق فيها حي، وأحرقوها بالنار."], [12, "واستولى يشوع على كل مدن أعدائه وقضى على ملوكها بحد السيف كما أمر موسى عبد الرب."], [13, "غير أنه لم يحرق المدن القائمة على التلال، إلا حاصور وحدها التي أضرم فيها النار"], [14, "ونهب الإسرائيليون لأنفسهم كل غنائم تلك المدن. أما الرجال فقتلوهم بحد السيف فلم يبق منهم حي."], [15, "كما أمر الرب موسى عبده هكذا أمر موسى يشوع، فنفذ يشوع ما عهد إليه به فلم يغفل شيئا من كل ما أمر الرب به موسى."], [16, "واستولى يشوع على كل الأراضي: إقليم الجبل وكل منطقة الجنوب وسائر أرض جوشن والسهل ووادي الأردن وجبل إسرائيل وسهله."], [17, "فأصبحت أرض إسرائيل تمتد من الجبل الأقرع باتجاه أرض أدوم في الجنوب، إلى بعل جاد شمالا في وادي لبنان عند سفح حرمون، وأسر جميع ملوكها وقتلهم."], [18, "فخاض يشوع حربا مع أولئك الملوك أياما كثيرة."], [19, "ولم تعقد مدينة واحدة صلحا مع الإسرائيليين إلا الحويين سكان جبعون، إنما استولى الإسرائيليون على جميع المدن بالحرب."], [20, "لأن الرب نفسه هو الذي قسى قلوبهم لخوض الحرب ضد إسرائيل، ليدمرهم الإسرائيليون ويفنوهم من غير رأفة كما أمر الرب موسى."], [21, "وهاجم يشوع العناقيين أيضا وأبادهم من الجبل في حبرون ومن دبير ومن عناب ومن سائر جبل يهوذا ومن جبال إسرائيل، فقضى عليهم ودمر مدنهم."], [22, "فلم يبق منهم أحد في أرض بني إسرائيل سوى قلة لجأت إلى غزة وجت وأشدود،"], [23, "فاستولى يشوع على كل الأرض كما وعد الرب موسى، ووهبها يشوع ميراثا لإسرائيل وفقا لطوائفهم وأسباطهم. وأخيرا استراحت الأرض من الحرب."], [1, "وهذه هي أسماء الملوك الذين قضى عليهم بنو إسرائيل وامتلكوا أرضهم شرقي نهر الأردن، من وادي أرنون حتى جبل حرمون بما في ذلك المنطقة الشرقية من العربة:"], [2, "سيحون ملك الأموريين المقيم في حشبون، وكانت مملكته تمتد من عروعير على أطراف وادي أرنون، ومن وسط وادي نهر أرنون حتى نهر يبوق على حدود بني عمون بما في ذلك نصف أراضي جلعاد."], [3, "وكذلك حكم المنطقة الشرقية من وادي نهر الأردن بدءا من بحر الجليل إلى البحر الميت حتى طريق بيت يشيموت، وشمالا حتى سفوح الفسجة."], [4, "أما حدود مملكة عوج ملك باشان، آخر بقية الرفائيين المقيم في عشتاروث وفي إذرعي،"], [5, "فكانت تمتد من جبل حرمون وسلخة وعلى كل باشان حتى تخوم الجشوريين والمعكيين ونصف جلعاد من حدود سيحون ملك حشبون."], [6, "فقضى موسى عبد الرب وبنو إسرائيل على هاتين المملكتين، ووهبهما موسى عبد الرب ميراثا للرأوبينيين والجاديين ولنصف سبط منسى."], [7, "وهذه أسماء الملوك الذين قضى عليهم يشوع وبنو إسرائيل في غربي نهر الأردن، من بعل جاد في وادي لبنان إلى الجبل الأقرع المتجه إلى أدوم، والتي وهبها يشوع ميراثا لأسباط إسرائيل بحسب فرقهم:"], [8, "وهذه البلاد هي الأقاليم الجبلية وسفوح التلال الغربية والعربة والمنحدرات الجبلية والصحراء والنقب، وبلاد الحثيين والأموريين والكنعانيين والفرزيين والحويين واليبوسيين."], [9, "أما الملوك فهم: ملك أريحا واحد. ملك عاي المجاورة لبيت إيل واحد."], [10, "ملك أورشليم واحد. ملك حبرون واحد."], [11, "ملك يرموت واحد. ملك لخيش واحد."], [12, "ملك عجلون واحد. ملك جازر واحد."], [13, "ملك دبير واحد. ملك جادر واحد."], [14, "ملك حرمة واحد. ملك عراد واحد."], [15, "ملك لبنة واحد. ملك عدلام واحد."], [16, "ملك مقيدة واحد. ملك بيت إيل واحد."], [17, "ملك تفوح واحد. ملك حافر واحد."], [18, "ملك أفيق واحد. ملك لشارون واحد."], [19, "ملك مادون واحد. ملك حاصور واحد."], [20, "ملك شمرون مرأون واحد. ملك أكشاف واحد."], [21, "ملك تعنك واحد. ملك مجدو واحد."], [22, "ملك قادش واحد. ملك يقنعام في كرمل واحد."], [23, "ملك دور في مرتفعات دور واحد. ملك جوييم في الجلجال واحد."], [24, "ملك ترصة واحد. فكانت جملة عدد الملوك واحدا وثلاثين ملكا."]]}, {"l": "Neh 9:22-24", "n": "", "vs": [[22, "ووهبت لهم ممالك وأمما، ووزعت عليهم أنصبة في أقصى البلاد فامتلكوا بلاد سيحون وأرض ملك حشبون وديار عوج ملك باشان،"], [23, "وأكثرت نسلهم فصاروا كنجوم السماء عددا، وأتيت بهم إلى الأرض التي وعدت آباءهم أن يدخلوها ويرثوها،"], [24, "فاستولى عليها الأبناء وورثوا الأرض بعد أن أخضعت لهم سكانها الكنعانيين، وأسلمتهم لهم مع ملوكهم وأمم البلاد ليصنعوا بهم حسب ما يطيب لهم."]]}, {"l": "Psa 44:1-3", "n": "", "vs": [[1, "ياالله ، بآذاننا قد سمعنا، وآباؤنا أخبرونا بما عملته في أيامهم القديمة."], [2, "بيدك اقتلعت الأمم، وغرست آباءنا. حطمت الشعوب وأنميتهم."], [3, "لم يمتلكوا الأرض بسيفهم ولا بذراعهم خلصوا، ولكن بفضل يمناك وذراعك ونور وجهك، لأنك رضيت عنهم."]]}, {"l": "Psa 78:55", "n": "", "vs": [[55, "ثم طرد الأمم من أمامهم وقسم أرضهم بالحبل ليجعلها ميراثا لشعبه، وأسكن في خيامهم أسباط إسرائيل."]]}, {"l": "Act 13:19", "n": "", "vs": [[19, "ثم أزال سبعة شعوب من بلاد كنعان، وأورثهم أرضها،"]]}], "kwAr": "تطأ", "noteAr": ""}, {"kw": "thresh", "raw": "Jer_51:33; Amo_1:3; Mic_4:12, Mic_4:13", "note": "", "refs": [{"l": "Jer 51:33", "n": "", "vs": [[33, "لأن هذا ما يعلنه الرب القدير إله إسرائيل: إن أهل بابل كالبيدر، وقد حان أوان درس حنطته. وبعد قليل يأزف موعد حصادهم."]]}, {"l": "Amo 1:3", "n": "", "vs": [[3, "هذا ما يقوله الرب: من أجل معاصي دمشق الثلاث والأربع لن أرد عنها سخطي، لأن أهلها قد داسوا شعبي في جلعاد بنوارج من حديد."]]}, {"l": "Mic 4:12", "n": "", "vs": [[12, "لكنهم لم يعرفوا نوايا الرب، ولم يفهموا مقاصده، فإنه قد جمعهم كأكداس إلى البيدر ليعاقبهم."]]}, {"l": "Mic 4:13", "n": "", "vs": [[13, "فانهضي ياابنة صهيون وادرسي أعداءك، لأني سأجعل لك قرنا من حديد وأظلافا من نحاس فتسحقين أمما كثيرة، وتكرسين كل ما تغنمينه منهم للرب، وتقدمين ثروتهم لسيد الأرض كلها."]]}], "kwAr": "تدوس", "noteAr": ""}], "arS": [["تطأ", ["H6805"]], [" ", []], ["الأرض", ["H776"]], [" ", []], ["بسخط", ["H2195"]], ["، ", []], ["وبغضب", ["H639"]], [" ", []], ["تدوس", ["H1758"]], [" ", []], ["الأمم", ["H1471"]], [".", []]]}, {"c": 3, "v": 13, "text": "خرجت لخلاص شعبك، لخلاص مختارك. هشمت رؤوس زعماء البلاد الأشرار وتركتهم مطروحين عراة من العنق حتى أخمص القدم.", "groups": [{"kw": "wentest", "raw": "Exo_14:13, Exo_14:14, Exo_15:1, Exo_15:2; Psa_68:7, Psa_68:19-23", "note": "", "refs": [{"l": "Exo 14:13", "n": "", "vs": [[13, "فقال موسى للشعب: «لا تخافوا. قفوا وانظروا خلاص الرب الذي يجريه لكم اليوم، لأن المصريين الذين رأيتموهم اليوم، لن تروهم في ما بعد إلى الأبد."]]}, {"l": "Exo 14:14", "n": "", "vs": [[14, "فالرب يحارب عنكم وأنتم تصمتون»."]]}, {"l": "Exo 15:1", "n": "", "vs": [[1, "عندئذ شدا موسى وبنو إسرائيل بهذه التسبحة للرب قائلين: «أرنم للرب لأنه تمجد جدا، الفرس وراكبه قد طرحهما في البحر."]]}, {"l": "Exo 15:2", "n": "", "vs": [[2, "الرب قوتي ونشيدي وقد صار خلاصي، هذا هو إلهي فأسبحه. وإله أبي فأعظمه."]]}, {"l": "Psa 68:7", "n": "", "vs": [[7, "ياالله ، عندما خرجت أمام شعبك، وقدتهم في البرية،"]]}, {"l": "Psa 68:19-23", "n": "", "vs": [[19, "تبارك الرب الذي يحمل أثقالنا يوما فيوما. إنه إله خلاصنا."], [20, "إلهنا هو إله الخلاص، وعند الرب السيد منافذ من الموت."], [21, "حقا سيضرب الرب رؤوس أعدائه، وكذلك الهامة المكسوة شعرا لمن يمعن في طريق المعاصي."], [22, "يقول السيد: «سأرجع أعداءكم من باشان، سأرجعهم من أعماق البحر،"], [23, "فتغمسون أرجلكم في دمهم، وتأخذ ألسنة الكلاب نصيبها من الأعداء»."]]}], "kwAr": "خرجت", "noteAr": ""}, {"kw": "with", "raw": "Psa_77:20, Psa_89:19-21, Psa_99:6, Psa_105:15, Psa_105:26; Isa_63:11", "note": "", "refs": [{"l": "Psa 77:20", "n": "", "vs": [[20, "هديت شعبك كقطيع على يد موسى وهارون."]]}, {"l": "Psa 89:19-21", "n": "", "vs": [[19, "فبالرؤيا كلمت أنبياءك قديما وقلت لعبيدك الأمناء: هيأت عونا للجبار ورفعت شابا من الشعب."], [20, "وجدت داود عبدي فمسحته بزيتي المقدس."], [21, "أثبته بيدي، وأشدده بقوتي."]]}, {"l": "Psa 99:6", "n": "", "vs": [[6, "موسى وهرون بين كهنته، وصموئيل بين الداعين باسمه، دعوا الرب فاستجاب لهم."]]}, {"l": "Psa 105:15", "n": "", "vs": [[15, "قائلا: «لا تمسوا مسحائي، ولا تؤذوا أنبيائي»."]]}, {"l": "Psa 105:26", "n": "", "vs": [[26, "عندئذ أرسل موسى عبده وهارون مختاره."]]}, {"l": "Isa 63:11", "n": "", "vs": [[11, "ثم تذكروا الأيام القديمة، أيام موسى عبده وتساءلوا: أين من أصعدنا من البحر مع راعي قطيعه؟ أين من أقام روحه القدوس في وسطنا؟"]]}], "kwAr": "مختارك", "noteAr": ""}, {"kw": "thou woundedst", "raw": "Exo_12:29, Exo_12:30; Jos_10:11, Jos_10:24, Jos_10:42, Jos_11:8, Jos_11:12; Psa_18:37-45, Psa_68:21, Psa_74:13, Psa_74:14; Psa_110:6", "note": "", "refs": [{"l": "Exo 12:29", "n": "", "vs": [[29, "وفي منتصف الليل أهلك الرب كل بكر في بلاد مصر، من بكر فرعون المتربع على العرش إلى بكر الحبيس في السجن، وأبكار البهائم جميعا أيضا."]]}, {"l": "Exo 12:30", "n": "", "vs": [[30, "فاستيقظ فرعون وحاشيته وجميع المصريين وإذا عويل عظيم في أرض مصر، لأنه لم يوجد بيت ليس فيه ميت."]]}, {"l": "Jos 10:11", "n": "", "vs": [[11, "وفيما هم لائذون بالفرار أمام الإسرائيليين عند منحدر بيت حورون، قذفهم الرب بعاصفة من برد عظيم انهمرت عليهم من السماء حتى أشرفوا على عزيقة فماتوا. وكان الذين قضى عليهم البرد أكثر من الذين قتلهم سيف بني إسرائيل."]]}, {"l": "Jos 10:24", "n": "", "vs": [[24, "وما إن أقبلوا بهم إليه حتى استدعى كل محاربيه، وقال لقادتهم الذين ساروا معه: «تقدموا وطئوا بأرجلكم رقاب هؤلاء الملوك». ففعلوا كذلك."]]}, {"l": "Jos 10:42", "n": "", "vs": [[42, "وظفر يشوع بجميع هؤلاء الملوك واستولى على أرضهم دفعة واحدة، لأن الرب إله إسرائيل حارب عنهم."]]}, {"l": "Jos 11:8", "n": "", "vs": [[8, "فأسلمهم الرب إلى يد إسرائيل، فضربوهم وطاردوهم شمالا حتى صيدون العظيمة وإلى مسرفوت مايم وإلى وادي مصفاة شرقا، وقضوا عليهم بحيث لم يفلت منهم ناج."]]}, {"l": "Jos 11:12", "n": "", "vs": [[12, "واستولى يشوع على كل مدن أعدائه وقضى على ملوكها بحد السيف كما أمر موسى عبد الرب."]]}, {"l": "Psa 18:37-45", "n": "", "vs": [[37, ""], [38, "أسحقهم فلا يستطيعون النهوض. يسقطون تحت قدمي."], [39, "تمنطقني بحزام من القوة تأهبا للقتال. تخضع لسلطاني المتمردين علي."], [40, "يولون الأدبار هربا أمامي. وأفني الذين يبغضونني."], [41, "يستغيثون ولا مخلص. ينادون الرب فلا يستجيب لهم."], [42, "فأسحقهم كالغبار في مهب الريح، وأطرحهم مثل الطين في الشوارع."], [43, "تنقذني من ثورات الشعب، وتجعلني سيدا للأمم، حتى صار شعب لم أكن أعرفه عبدا يخدمني."], [44, "فما إن يسمعوا أمري حتى يلبوه. الغرباء يتذللون لي"], [45, "الغرباء يخورون، يخرجون من حصونهم مرتعدين."]]}, {"l": "Psa 68:21", "n": "", "vs": [[21, "حقا سيضرب الرب رؤوس أعدائه، وكذلك الهامة المكسوة شعرا لمن يمعن في طريق المعاصي."]]}, {"l": "Psa 74:13", "n": "", "vs": [[13, "أنت فلقت البحر بقوتك وحطمت رؤوس التنانين."]]}, {"l": "Psa 74:14", "n": "", "vs": [[14, "أنت مزقت رؤوس فرعون وجيشه، وجعلته قوتا للحيوانات المتوحشة"]]}, {"l": "Psa 110:6", "n": "", "vs": [[6, "يقضي بين الأمم، فيملأ الأرض الرحبة بجثث رؤسائها."]]}], "kwAr": "هشمت", "noteAr": ""}, {"kw": "discovering", "raw": "Heb. making naked", "note": "Heb. making naked", "refs": [], "kwAr": "عراة", "noteAr": "بالعبرية: «كشف العري»."}], "arS": [["خرجت ،"]]}, {"l": "Act 4:28", "n": "", "vs": [[28, "وعملوا به كل ما سبق أن رسمت يدك وقضت مشيئتك أن يكون."]]}], "kwAr": "المندفع", "noteAr": ""}, {"kw": "came out", "raw": "Heb. were tempestuous, Dan_11:40; Zec_9:14", "note": "Heb. were tempestuous, Dan_11:40; Zec_9:14", "refs": [{"l": "Dan 11:40", "n": "", "vs": [[40, "وعندما تأزف النهاية يحاربه ملك الجنوب، فينقض عليه ملك الشمال كالزوبعة بمركبات وفرسان وسفن كثيرة، ويقتحم دياره كالطوفان الجارف."]]}, {"l": "Zec 9:14", "n": "", "vs": [[14, "ثم يتجلى الرب، وينفذ سهمه كالبرق. ينفخ السيد الرب بالبوق ويقتحم في زوابع الجنوب."]]}], "kwAr": "كإعصار", "noteAr": "بالعبرية: «عصفوا». انظر دا 11: 40؛ زك 9: 14"}, {"kw": "their", "raw": "Exo_1:10-16, Exo_1:22; Psa_10:8, Psa_64:2-7", "note": "", "refs": [{"l": "Exo 1:10-16", "n": "", "vs": [[10, "فلنتآمر عليهم لكيلا يتكاثروا وينضموا إلى أعدائنا إذا نشب قتال ويحاربونا ثم يخرجوا من الأرض»."], [11, "فعهدوا بهم إلى مشرفين عتاة ليسخروهم بالأعمال الشاقة. فبنوا مدينتي فيثوم ورعمسيس لتكونا مخازن لفرعون."], [12, "ولكن كلما زادوا من إذلالهم، ازداد تكاثرهم ونموهم، فتخوفوا من بني إسرائيل"], [13, "فتفاقم عنف استعباد المصريين لبني إسرائيل."], [14, "وأتعسوا حياتهم بالأعمال الشاقة في الطين واللبن كادحين في الحقول. وسخرهم المصريون بعنف في كل أعمالهم الشاقة."], [15, "ثم قال ملك مصر للقابلتين العبرانيتين المدعوتين شفرة وفوعة:"], [16, "«عندما تشرفان على توليد النساء العبرانيات راقباهن على كرسي الولادة، فإن كان المولود صبيا فاقتلاه، وإن كان بنتا فاتركاها تحيا."]]}, {"l": "Exo 1:22", "n": "", "vs": [[22, "ثم أصدر فرعون أمره لجميع شعبه قائلا: «اطرحوا كل ابن (عبراني) يولد في النهر، أما البنات فاستحيوهن»."]]}, {"l": "Psa 10:8", "n": "", "vs": [[8, "يتربص في كمائن الديار ليقتل البريء. عيناه تترصدان المسكين."]]}, {"l": "Psa 64:2-7", "n": "", "vs": [[2, "استرني من مؤامرة الأشرار، ومن هياج جمهور فاعلي الإثم،"], [3, "الذين سنوا ألسنتهم كالسيف، وصوبوا سهام كلامهم المر،"], [4, "ليرموا البريء من مكامنهم. يرمونه فجأة ومن غير رادع."], [5, "يشددون عزائمهم في أمر شرير، ويكيدون لنصب الفخاخ خفية، قائلين: «من يرانا؟»"], [6, "يد  "أمة مخيفة مرعبة، تستمد حكمها وعظمتها من ذاتها."], [8, "خيولها أسرع من النمور، وأكثر ضراوة من ذئاب المساء. فرسانها يندفعون بكبرياء قادمين من أماكن بعيدة، متسابقين كالنسر المسرع للانقضاض على فريسته."], [9, "يقبلون جميعهم ليعيثوا فسادا، ويطغى الرعب منهم على قلوب الناس قبل وصولهم، فيجمعون أسرى كالرمل."], [10, "يهزأون بالملوك ويعبثون بالحكام. يسخرون من الحصون، يكومون حولها تلالا من التراب، ويستولون عليها."], [11, "ثم يجتاحون كالريح ويرحلون، فقوة هؤلاء الرجال هي إلههم."]]}], "kwAr": "سمعت", "noteAr": ""}, {"kw": "my belly", "raw": "Psa_119:120; Jer_23:9; Eze_3:14; Dan_8:27, Dan_10:8", "note": "", "refs": [{"l": "Psa 119:120", "n": "", "vs": [[120, "اقشعر بدني رعبا منك وجزعت من أحكامك."]]}, {"l": "Jer 23:9", "n": "", "vs": [[9, "ثم تكلم إرميا عن الأنبياء الكذبة فقال: «إن قلبي منكسر في داخلي، وجميع عظامي ترتجف، فأنا بتأثير الرب وبفعل كلامه المقدس كرجل سكران غلبت عليه الخمر"]]}, {"l": "Eze 3:14", "n": "", "vs": [[14, "وهكذا حلق بي روح الرب وحملني بعيدا، وقد جاشت حرارة روحي بمرارة نفسي، ولكن كانت يد الرب علي شديدة."]]}, {"l": "Dan 8:27", "n": "", "vs": [[27, "فضعفت أنا دانيآل ونحلت أياما، ثم قمت وعدت أباشر أعمال الملك. وروعتني الرؤيا، ولم أكن أفهمها."]]}, {"l": "Dan 10:8", "n": "", "vs": [[8, "وبقيت أنا وحدي أشهد الرويا العظيمة، وقد تلاشت مني القوة، وتحولت نضارتي إلى ذبول، وفقدت قدرتي."]]}], "kwAr": "فتولاني الفزع", "noteAr": ""}, {"kw": "that I", "raw": "Psa_91:15, Psa_94:12, Psa_94:13; Isa_26:20,Isa_26:21; Jer_15:10,Jer_15:11, Jer_45:3-5; Eze_9:4-6; 2Th_1:6-9", "note": "", "refs": [{"l": "Psa 91:15", "n": "", "vs": [[15, "يدعوني فأستجيب له، أرافقه في الضيق، أنقذه وأكرمه"]]}, {"l": "Psa 94:12", "n": "", "vs": [[12, "طوبى للإنسان الذي تؤدبه، وتعلمه من شريعتك يارب!"]]}, {"l": "Psa 94:13", "n": "", "vs": [[13, "لتريحه من أيام السوء، إلى أن يموت الشرير ويتوارى في مثواه."]]}, {"l": "Isa 26:20", "n": "", "vs": [[20, "تعالوا يا شعبي وادخلوا إلى مخادعكم، وأوصدوا أبوابكم خلفكم. تواروا قليلا حتى يعبر السخط."]]}, {"l": "Isa 26:21", "n": "", "vs": [[21, "وانظروا فإن الرب خارج من مكانه ليعاقب سكان الأرض على آثامهم، فتكشف الأرض عما سفك عليها من دماء ولا تغطي قتلاها فيما بعد."]]}, {"l": "Jer 15:10", "n": "", "vs": [[10, "ويل لي ياأمي لأنك أنجبتني لأكون إنسان خصام ورجل نزاع لكل الأرض. لم أقرض ولم أقترض. ومع ذلك كل واحد يلعنني."]]}, {"l": "Jer 15:11", "n": "", "vs": [[11, "دعهم يشتموا يارب. ألم أتضرع إليك من أجل خيرهم؟ إني أبتهل إليك الآن من أجل أعدائي في وقت الضيق والمحنة."]]}, {"l": "Jer 45:3-5", "n": "", "vs": [[3, "قد قلت: ويل لي لأن الرب قد أضاف حزنا إلى ألمي، وأعييت في أنيني، ولم أجد راحة."], [4, "لذلك هذا ما تقوله له: هكذا يعلن الرب، ها أنا أهدم ما بنيته وأستأصل ما غرسته في كل هذه الأرض."], [5, "وأنت، هل تلتمس لنفسك عظائم الأمور؟ لا تلتمس، فها أنا جالب بلاء على كل بشر يقول الرب. أما أنت فأهب لك النجاة، فتكون لك نفسك غنيمة في جميع الأماكن التي تذهب إليها»."]]}, {"l": "Eze 9:4-6", "n": "", "vs": [[4, "وقال له الرب: «اجتز وسط مدينة أورشليم وارسم سمة على جباه الرجال الذين يئنون ويزفرون على كل ما ارتكب من أرجاس فيها»."], [5, "ثم قال للستة الآخرين على مسمعي: «اعبروا في المدينة خلفه واقتلوا. لا تترَأف عيونكم ولا تعفوا."], [6, "أهلكوا الشيخ والشاب والعذراء والطفل والنساء. ولكن لا تقربوا من أي إنسان عليه السمة، وابتدئوا من مقدسي». فابتدأوا يهلكون الرجال والشيوخ الموجودين أمام الهيكل."]]}, {"l": "2Th 1:6-9", "n": "", "vs": [[6, "فمن العدل عند الله حقا أن يجازي بالضيقة أولئك الذين يضايقونكم،"], [7, "وأن يكافئكم، أنتم الذين تتضايقون، كما يكافئنا نحن، بالراحة لدى ظهور الرب يسوع علنا من السماء، ومعه ملائكة قدرته،"], [8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."], [9, "فهؤلاء سيكابدون عقاب الهلاك الأبدي، بعيدا من حضرة الرب ومن مجد قوته،"]]}], "kwAr": "ولكن سأنتظر", "noteAr": ""}, {"kw": "he will", "raw": "Hab_1:6; Deu_28:49-52; 2Ki_24:1, 2Ki_24:2; Jer_25:9-11", "note": "", "refs": [{"l": "Hab 1:6", "n": "", "vs": [[6, "فها أنا أثير الكلدانيين، هذه الأمة الحانقة المندفعة الزاحفة في رحاب الأرض، لتستولي على مساكن ليست لها."]]}, {"l": "Deu 28:49-52", "n": "", "vs": [[49, "ويجلب الرب عليكم من بعيد، من أقصى الأرض، أمة لا تفهمون لغتها، فتنقض عليكم كالنسر."], [50, "أمة يثير منظرها الرعب، لا تهاب الشيخ ولا ترأف بالطفل،"], [51, "فتستولي على نتاج بهائمكم، وتلتهم غلات أرضكم حتى تفنوا، ولا تبقي لكم قمحا ولا خمرا ولا زيتا ولا نتاج بقركم ونعاجكم حتى تهلككم."], [52, "وتحاصركم في جميع مدنكم حتى تتهدم أسواركم الشامخة الحصينة التي وثقتم بمناعتها في كل مدنكم. فتحاصركم في جميع مدنكم في كل أرضكم التي يهبها الرب إلهكم لكم."]]}, {"l": "2Ki 24:1", "n": "", "vs": [[1, "وفي غضون حكمه هاجم نبوخذناصر ملك بابل مملكة يهوذا، فخضع له يهوياقيم طوال ثلاث سنوات، ثم تمرد عليه."]]}, {"l": "2Ki 24:2", "n": "", "vs": [[2, "فأرسل الرب غزاة من كلدانيين وأراميين وموآبيين وعمونيين للإغارة على مملكة يهوذا وإبادتها، بموجب ما قضى به الرب على لسان عبيده الأنبياء."]]}, {"l": "Jer 25:9-11", "n": "", "vs": [[9, "فها أنا أجند جميع قبائل الشمال بقيادة نبوخذناصر عبدي، وآتي بها إلى هذه الأرض فيجتاحونها ويهلكون جميع سكانها مع سائر الأمم المحيطة بها، وأجعلهم مثار دهشة وصفير، وخرائب أبدية."], [10, "وأبيد من بينهم أهازيج الفرح والطرب وصوت غناء العريس والعروس، وضجيج الرحى ونور السراج."], [11, "فتصبح هذه الأرض بأسرها قفرا خرابا، وتستعبد جميع هذه الأمم لملك بابل طوال سبعين سنة."]]}], "kwAr": "يحيق", "noteAr": ""}, {"kw": "invade them", "raw": "or cut them in pieces", "note": "or cut them in pieces", "refs": [], "kwAr": "غزتنا", "noteAr": "أو: «يقطعهم إربا»."}], "arS": [["سمعت", ["H8085"]], [" هذا ", []], ["فتولاني", ["H990"]], [" ", []], ["الفزع", ["H7264"]], [" ", []], ["وارتجفت", ["H6750"]], [" ", []], ["شفتاي", ["H8193"]], [" من ", []], ["الصوت", ["H6963"]], ["، ", []], ["وتسرب", ["H935"]], [" ", []], ["النخر", ["H7538"]], [" إلى ", []], ["عظامي", ["H6106"]], ["، ", []], ["وارتعشت", ["H7264"]], [" ", []], ["قدماي", ["H8478"]], [". ", []], ["ولكن", ["H834"]], [" ", []], ["سأنتظر", ["H5117"]], [" بصبر ", []], ["يوم", ["H3117"]], [" ", []], ["البلية", ["H6869"]], [" الذي ", []], ["يحيق", ["H5927"]], [" ", []], ["بالأمة", ["H5971"]], [" التي ", []], ["غزتنا", ["H1464"]], [".", []]]}, {"c": 3, "v": 17, "text": "فمع أنه لا يزهر التين ولا يكون حمل في الكروم يكذب عمل الزيتونة والحقول لا تصنع طعاما ينقطع الغنم من الحظيرة ولا بقر في المذاود", "groups": [{"kw": "the fig tree", "raw": "Deu_28:15-18, Deu_28:30-41; Jer_14:2-8; Joe_1:10-13, Joe_1:16-18; Amo_4:6-10; Hag_2:16, Hag_2:17", "note": "", "refs": [{"l": "Deu 28:15-18", "n": "", "vs": [[15, "ولكن إن عصيتم صوت الرب إلهكم ولم تحرصوا على العمل بجميع وصاياه وفرائضه التي أنا آمركم اليوم بها، فإن جميع هذه اللعنات تحل بكم وتلازمكم."], [16, "تكونون ملعونين في المدينة وملعونين في الحقول."], [17, "وتكون سلالكم ومعاجنكم ملعونة."], [18, "وتحل اللعنة بأبنائكم وغلات أرضكم ونتاج بقركم ونعاجكم،"]]}, {"l": "Deu 28:30-41", "n": "", "vs": [[30, "يخطب أحدكم امرأة ولكن آخر يتزوجها ويضاجعها. تبني بيتا ولا تسكن فيه، وتغرس كرما ولا تجنيه."], [31, "يذبح ثورك أمام عينيك ولا تأكل منه، ويغتصب حمارك على مرأى منك ولا يرد إليك، ويستولي أعداؤك على ماشيتك وليس من منقذ."], [32, "يساق أولادك وبناتك إلى أمة أخرى وعيناك تراقبانهم طوال النهار، حتى تكلا، وما في يدك حيلة."], [33, "محصول أرضك وثمر تعبك يأكله شعب غريب عنك، ولا تكون سوى مظلوم مسحوق دائما."], [34, "ويصيبك الجنون من هول ما ترى."], [35, "ويبتليك الرب بقروح خبيثة تغطي الركبتين والساقين، حتى لا تجد لها شفاء من قمة الرأس إلى أخمص القدم."], [36, "ينفيكم الرب أنتم وملككم الذي تختارونه إلى أمة لا تعرفونها أنتم ولا آباؤكم، حيث تعبدون هناك آلهة أخرى من خشب وحجر،"], [37, "وتصبحون مثار دهشة وسخرية وعبرة في نظر جميع الشعوب التي ينفيكم الرب إليهم"], [38, "تبذرون كثيرا من البذار في الحقول، ولا تحصدون إلا القليل، لأن الجراد يلتهمه."], [39, "تكدحون في غرس كروم ومن خمرها لا تشربون، ومن ثمرها لا تجنون، لأن الدود ينخرها."], [40, "تكتظ أراضيكم بأشجار الزيتون، ولكن من زيتها لا تدهنون، لأن زيتونكم ينتثر على الأرض قبل نضجه."], [41, "تنجبون بنين وبنات ولا يكونون لكم، لأنهم يسبون."]]}, {"l": "Jer 14:2-8", "n": "", "vs": [[2, "«أرض يهوذا تنوح وأبوابها واهية. أهلها يندبون مطروحين إلى الأرض، وعويل أورشليم قد صعد إلى العلى."], [3, "أرسل أشرافهم خدامهم ليحملوا إليهم الماء، فأقبلوا إلى الجباب وإذا بها فارغة من الماء، فرجعوا بجرار خاوية وقد اعتراهم الخزي والخجل وغطوا رؤوسهم."], [4, "خزي الفلاحون وغطوا رؤوسهم لأن الأرض قد تشققت لانقطاع المطر عنها."], [5, "حتى الإيل في الصحراء قد هجرت وليدها لتعذر وجود الكَلإ."], [6, "وقفت الفراء على الروابي وتنسمت الريح كبنات آوى فكلت عيونها لعدم وجود العشب»."], [7, "وإن تكن آثامنا تشهد علينا يارب، فلأجل اسمك خلصنا، لأن معاصينا كثرت وقد أخطأنا إليك."], [8, "يارجاء إسرائيل ومخلصه في وقت الضيق، لماذا تكون كغريب في الأرض، وكعابر سبيل يميل ليبيت ثم يمضي؟"]]}, {"l": "Joe 1:10-13", "n": "", "vs": [[10, "قد خربت الحقول، وناحت الأرض لأن الحنطة تلفت والخمرة انقطعت، وافتقد زيت الزيتون."], [11, "اخزوا أيها الحراثون وأعولوا أيها الكرامون على الحنطة والشعير، لأن حصاد الحقل قد تلف."], [12, "قد ذوى الكرم وذبل التين والرمان والنخيل والتفاح ويبست سائر أشجار الحقل، وزالت البهجة من أبناء البشر."], [13, "أيها الكهنة اتشحوا بالمسوح ونوحوا. ولولوا ياخدام المذبح. تعالوا وبيتوا ليلتكم بالمسوح ياخدام إلهي، لأن تقدمات الدقيق والخمر قد منعت عن هيكل الله."]]}, {"l": "Joe 1:16-18", "n": "", "vs": [[16, "ألم ينقطع الطعام أمام عيوننا، ألم يتلاش الفرح والغبطة من بيت إلهنا؟"], [17, "قد تعفنت الحبوب المزروعة في الأرض الجافة، وتهدمت المخازن وفرغت الأهراء من القمح، لأن الحبوب قد جفت."], [18, "لكم أنت البهائم، وشردت المواشي إذ افتقرت إلى المرعى. حتى قطعان الغنم هلكت أيضا."]]}, {"l": "Amo 4:6-10", "n": "", "vs": [[6, "قد جعلت الجوع يعم مدنكم، فلم تتسخ أسنانكم بالطعام! وأفقرتكم إلى الخبز في كل أماكن سكناكم، ولكنكم لم ترجعوا إلي تائبين، يقول الرب."], [7, "منعت عنكم المطر ولم يكن قد بقي للحصاد سوى ثلاثة أشهر، وأمطرت على مدينة دون مدينة، وعلى حقل دون الآخر، فجف الحقل الذي لم أمطر عليه."], [8, "فأقبلت مدينتان أو ثلاث على مدينة واحدة لتشرب ماء، ولكنها لم ترتو، ومع ذلك لم ترجعوا إلي تائبين، يقول الرب."], [9, "أرسلت الرياح اللافحة واليرقان لتجفف محاصيلكم، والتهم الجراد حدائقكم وكرومكم وأشجار تينكم وزيتونكم. وما رجعتم إلي!"], [10, "أصبتكم بالأوبئة التي أصيبت بها مصر، وقضيت على شبابكم بالسيف وسبيت خيولكم، وجعلت نتن معسكركم يزكم أنوفكم. ولكنكم لم ترجعوا إلي تائبين يقول الرب."]]}, {"l": "Hag 2:16", "n": "", "vs": [[16, "عندما كان يقبل ب أيها الأبرار، فإن الحمد يليق بالمستقيمين."]]}, {"l": "Psa 46:1-5", "n": "", "vs": [[1, "الله لنا ملجأ وقوة، عونه متوافر لنا دائما في الضيقات."], [2, "لذلك لا نخاف ولو تزحزحت الأرض وانقلبت الجبال إلى قلب البحار."], [3, "تهيج وتزبد مياهها؛ تتزلزل الجبال من عنف جيشانها."], [4, "تفرح مدينة الله حيث مساكن العلي بنهر دائم الجريان."], [5, "الله في وسط المدينة فلن تتزعزع. يعينها الله في الفجر المبكر."]]}, {"l": "Psa 85:6", "n": "", "vs": [[6, "أما تحيينا من جديد فيفرح بك شعبك؟"]]}, {"l": "Psa 97:12", "n": "", "vs": [[12, "افرحوا أيها الصديقون بالرب، وارفعوا الشكر لاسمه الأقدس."]]}, {"l": "Psa 104:34", "n": "", "vs": [[34, "فيلذ له نشيدي، وأنا أفرح بالرب."]]}, {"l": "Psa 118:15", "n": "", "vs": [[15, "صوت هتاف النصر والخلاص في مساكن الأبرار. يمين الرب مقتدرة في فعلها."]]}, {"l": "Psa 149:2", "n": "", "vs": [[2, "ليفرح شعب إسرائيل بصانعه، وليبتهج بنو صهيون بملكهم."]]}, {"l": "Isa 41:16", "n": "", "vs": [[16, "فتذريها، وتحملها الريح بعيدا، وتبددها الزوبعة. أما أنت فتبتهج بالرب وتمجد قدوس إسرائيل."]]}, {"l": "Isa 61:10", "n": "", "vs": [[10, "إنني أبتهج حقا بالرب وتفرح نفسي بإلهي، لأنه كساني ثياب الخلاص وسربلني برداء البر، مثل عريس يزين رأسه بتاج، وكعروس تتجمل بحليها."]]}, {"l": "Zec 10:7", "n": "", "vs": [[7, "ويصبح شعب إسرائيل كجبابرة الحرب، وتنتشي قلوبهم كمن شرب خمرة، ويشهد أبناؤهم هذا ويفرحون، وتبتهج نفوسهم بالرب."]]}, {"l": "Luk 1:46", "n": "", "vs": [[46, "فقالت مريم: «تعظم نفسي الرب،"]]}, {"l": "Luk 1:47", "n": "", "vs": [[47, "وتبتهج روحي بالله مخلصي."]]}, {"l": "Rom 5:2", "n": "", "vs": [[2, "وبه أيضا تم لنا الدخول بالإيمان إلى هذه النعمة التي نقيم فيها الآن؛ ونحن نفتخر برجائنا في التمتع بمجد الله."]]}, {"l": "Rom 5:3", "n": "", "vs": [[3, "ليس هذا فقط، بل نفتخر أيضا في وسط الضيقات، لعلمنا أن الضيق ينتج فينا الصبر،"]]}, {"l": "Phi 4:4", "n": "", "vs": [[4, "افرحوا في الرب دائما، وأقول أيضا: افرحوا."]]}, {"l": "Jam 1:2", "n": "", "vs": [[2, "ياإخوتي، عندما تنزل بكم التجارب والمحن المختلفة، اعتبروها سبيلا إلى الفرح الكلي."]]}, {"l": "Jam 1:9", "n": "", "vs": [[9, "من كان فقيرا وأخا مؤمنا، فليسر بمقامه الذي رفعه الله إليه."]]}, {"l": "Jam 1:10", "n": "", "vs": [[10, "وأما الغني، فعليه أن يسر بأن ما له لا يغنيه عن الله: لأن نهايته ستكون كنهاية الأعشاب المزهرة."]]}, {"l": "1Pe 1:8", "n": "", "vs": [[8, "أنتم لم تروا المسيح، ولكنكم تحبونه. ومع أنكم لا ترونه الآن، فأنتم تؤمنون به وتبتهجون بفرح مجيد يفوق الوصف."]]}, {"l": "1Pe 4:12", "n": "", "vs": [[12, "أيها الأحباء، لا تستغربوا نار الاضطهاد المشتعلة عندكم لاختباركم وكأن أمرا غريبا قد أصابكم!"]]}, {"l": "1Pe 4:13", "n": "", "vs": [[13, "وإنما افرحوا: لأنكم كما تشاركون المسيح في الآلام الآن، لابد أن تفرحوا بمشاركته في الابتهاج عند ظهور مجده."]]}], "kwAr": "أبتهج", "noteAr": ""}, {"kw": "the God", "raw": "Exo_15:2; Psa_25:5, Psa_27:1, Psa_118:14; Isa_12:2; Mic_7:7; Luk_2:30", "note": "", "refs": [{"l": "Exo 15:2", "n": "", "vs": [[2, "الرب قوتي ونشيدي وقد صار خلاصي، هذا هو إلهي فأسبحه. وإله أبي فأعظمه."]]}, {"l": "Psa 25:5", "n": "", "vs": [[5, "دربني في حقك وعلمني، فإنك أنت الإله مخلصي، وإياك أرجو طوال النهار."]]}, {"l": "Psa 27:1", "n": "", "vs": [[1, "الرب نوري وخلاصي، ممن أخاف؟ الرب حصن حياتي ممن أرتعب؟"]]}, {"l": "Psa 118:14", "n": "", "vs": [[14, "الرب قوتي وترنيمي وقد صار لي خلاصا."]]}, {"l": "Isa 12:2", "n": "", "vs": [[2, "ها إن الله خلاصي فأطمئن ولا أرتعد، لأن الرب الله هو قوتي وترنيمتي وقد أصبح لي خلاصا»."]]}, {"l": "Mic 7:7", "n": "", "vs": [[7, "أما أنا فأرتقب الرب وأنتظر إله خلاصي فيسمعني إلهي."]]}, {"l": "Luk 2:30", "n": "", "vs": [[30, "فإن عيني قد أبصرتا خلاصك"]]}], "kwAr": "بإله خلاصي", "noteAr": ""}], "arS": [["فإني", ["H589"]], [" ", []], ["أبتهج", ["H5937"]], [" ", []], ["بالرب", ["H3068"]], [" ", []], ["وأفرح", ["H1523"]], [" ", []], ["بإله", ["H430"]], [" ", []], ["خلاصي", ["H3468"]], [".", []]]}, {"c": 3, "v": 19, "text": "الرب الإله هو قوتي؛ يجعل قدمي كقدمي غزال، ويعينني على ارتقاء المرتفعات.إلى قائد الجوقة: تغنى على ذوات الأوتار.", "groups": [{"kw": "my strength", "raw": "Psa_18:1, Psa_27:1, Psa_46:1; Isa_12:2, Isa_45:24; Zec_10:12; 2Co_12:9, 2Co_12:10; Eph_3:16; Phi_4:13; Col_1:11", "note": "", "refs": [{"l": "Psa 18:1", "n": "", "vs": [[1, "أحبك يارب، يا قوتي."]]}, {"l": "Psa 27:1", "n": "", "vs": [[1, "الرب نوري وخلاصي، ممن أخاف؟ الرب حصن حياتي ممن أرتعب؟"]]}, {"l": "Psa 46:1", "n": "", "vs": [[1, "الله لنا ملجأ وقوة، عونه متوافر لنا دائما في الضيقات."]]}, {"l": "Isa 12:2", "n": "", "vs": [[2, "ها إن الله خلاصي فأطمئن ولا أرتعد، لأن الرب الله هو قوتي وترنيمتي وقد أصبح لي خلاصا»."]]}, {"l": "Isa 45:24", "n": "", "vs": [[24, "ويقولون عني: إنما بالرب وحده البر والقوة، وكل من يغتاظ منه يأتي إلى الرب ويخزى."]]}, {"l": "Zec 10:12", "n": "", "vs": [[12, "وأشددهم بالرب فيسلكون بمقتضى اسمه، يقول الرب."]]}, {"l": "2Co 12:9", "n": "", "vs": [[9, "فقال لي: «نعمتي تكفيك، لأن قدرتي تكمل في الضعف!» فأنا أرضى بأن أفتخر مسرورا بالضعفات التي في، لكي تخيم علي قدرة المسيح."]]}, {"l": "2Co 12:10", "n": "", "vs": [[10, "فلأجل المسيح، تسرني الضعفات والإهانات والضيقات والاضطهادات والصعوبات، لأني حينما أكون ضعيفا، فحينئذ أكون قويا!"]]}, {"l": "Eph 3:16", "n": "", "vs": [[16, "لكي يمنحكم، وفقا لغنى مجده، أن يمد الروح الكيان الداخلي في كل منكم بالقوة المؤيدة،"]]}, {"l": "Phi 4:13", "n": "", "vs": [[13, "إني أستطيع كل شيء، في المسيح الذي يقويني."]]}, {"l": "Col 1:11", "n": "", "vs": [[11, "متشددين بكل قوة موافقة لقدرة مجده، لتتمكنوا تماما من الاحتمال وطول البال،"]]}], "kwAr": "قوتي", "noteAr": ""}, {"kw": "like", "raw": "2Sa_22:34; Psa_18:33", "note": "", "refs": [{"l": "2Sa 22:34", "n": "", "vs": [[34, "يجعل رجلي كرجلي الإيل ويقيمني آمنا على المرتفعات."]]}, {"l": "Psa 18:33", "n": "", "vs": [[33, "يثبت قدمي كأقدام الإيل ويصعدني على مرتفعاتي الوعرة."]]}], "kwAr": "كقدمي غزال", "noteAr": ""}, {"kw": "to walk", "raw": "Deu_32:13, Deu_33:29; Isa_58:14", "note": "", "refs": [{"l": "Deu 32:13", "n": "", "vs": [[13, "أصعدهم على هضاب الأرض فأكلوا ثمار الصحراء، وغذاهم بعسل من صخر، وزيت من حجر الصوان،"]]}, {"l": "Deu 33:29", "n": "", "vs": [[29, "طوباكم يابني إسرائيل، أي شعب مثلكم منتصر بالرب؟ إنه ترسكم وعونكم وسيفكم المجيد. لكم يخضع أعداؤكم، وأنتم تطأون مرتفعاتهم»."]]}, {"l": "Isa 58:14", "n": "", "vs": [[14, "عندئذ تبتهج بالرب، وأجعلك تمتطي مرتفعات الأرض، وأنعم عليك بمير اث يعقوب أبيك، لأن فم الرب قد تكلم."]]}], "kwAr": "ارتقاء", "noteAr": ""}, {"kw": "stringed instruments", "raw": "Heb. Neginoth, Psa_4:1-8, Psa_6:1-10, Psa_54:1-7, 55:1-23, Psa_67:1-7, Psa_76:1-12 *titles", "note": "Heb. Neginoth, Psa_4:1-8, Psa_6:1-10, Psa_54:1-7, 55:1-23, Psa_67:1-7, Psa_76:1-12 *titles", "refs": [{"l": "Psa 4:1-8", "n": "", "vs": [[1, "استجب لي عندما أدعوك ياإله بري، فقد أفرجت لي دوما في الضيق، فأنعم علي وأصغ إلى صلاتي."], [2, "إلى متى يابني البشر تحولون مجدي عارا؟ وإلى متى تحبون الأمور الباطلة، وتسعون وراء الأكاذيب؟"], [3, "اعلموا أن الرب قد ميز لنفسه تقيه؛ الرب يسمع عندما أدعوه."], [4, "ارتعدوا ولا تخطئوا. فكروا في قلوبكم على مضاجعكم معتصمين بالصمت."], [5, "قدموا ذبائح البر، واتكلوا على الرب."], [6, "ما أكثر المتسائلين: «من يرينا خيرا؟» أشرق علينا أيها الرب بنور وجهك."], [7, "غرست في قلبي فرحا أعظم من فرح من امتلأت بيوتهم وأجرانهم بالحنطة والخمر الجديدة."], [8, "بسلام أضطجع وأنام، لأنك أنت وحدك يارب تنعم علي بالطمأنينة والسلام."]]}, {"l": "Psa 6:1-10", "n": "", "vs": [[1, "يارب لا توبخني في إبان غضبك، ولا تؤدبني في احتدام سخطك."], [2, "ارحمني يارب لأني ضعيف. اشفني يارب لأن عظامي راجفة،"], [3, "ونفسي مرتعدة جدا. وأنت يارب فإلى متى (تنتظر)؟"], [4, "ارجع يارب وحرر نفسي، أنقذني بفضل رحمتك."], [5, "إذ ليس في عالم الموت من يذكرك، أو في مقر الأموات من يسبحك."], [6, "لقد أرهقني تنهدي، فأغرق سريري في كل ليلة بدموعي وأبلل بها فراشي."], [7, "وهنت عيناي من فرط الغم، وكلتا بسبب جميع خصومي."], [8, "ابتعدوا عني ياجميع فاعلي الإثم، لأن الرب قد سمع صوت بكائي."], [9, "سمع الرب تضرعي. الرب يتقبل صلاتي."], [10, "ليخز جميع أعدائي ويرتاعوا جدا، وليتراجعوا إذ لحق بهم العار فجأة."]]}, {"l": "Psa 54:1-7", "n": "", "vs": [[1, "ياالله باسمك خلصني، وبقوتك أنصفني."], [2, "ياالله اسمع صلاتي واصغ إلى كلامي."], [3, "لأن غرباء قاموا علي، وعتاة يسعون إلى قتلي، ولم يجعلوا الله نصب أعينهم"], [4, "هوذا الله معيني والسيد الرب عاضدي."], [5, "يرد الشر على أعدائي، وبحق (عدلك) استأصلهم."], [6, "طوعا أذبح لك، وأحمد اسمك يارب لأنه طيب."], [7, "فإنه نجاني من كل ضيق ورأيت بعيني (ما حل) بأعدائي."]]}, {"l": "Psa 55:1-23", "n": "", "vs": [[1, "اصغ ياالله إلى صلاتي، ولا تتغافل عن تضرعي."], [2, "استمع لي واستجب، لأني حائر ومضطرب في كربتي،"], [3, "من تهديدات الأعداء وجور الشرير، لأنهم يجلبون علي المتاعب، وبغضب يضطهدونني."], [4, "قلبي يتوجع في داخلي، وأهوال الموت أحاطت بي."], [5, "اعتراني الخوف والارتعاد، وطغى علي الرعب."], [6, "فقلت: «ليت لي جناحا كالحمامة فأطير وأستريح."], [7, "كنت أشرد هاربا وأبيت في البرية."], [8, "كنت أسرع للنجاة من الريح العاصفة، ومن نوء البحر»."], [9, "بلبل ألسنة (أعدائي) يارب وأبكمهم، فإني أرى في المدينة عنفا وعدوانا،"], [10, "يحدقان بأسوارها نهارا وليلا، وفي وسطها الإثم والأذى."], [11, "المفاسد في وسطها، والظلم والغش لا يفارقان ساحاتها."], [12, "لو كان عدوي هو الذي يعيرني لكنت أحتمل. ولو كان من يبغضني هو الذي يتجبر علي لكنت أختبيء منه."], [13, "ولكنك عديلي، وإلفي وصديقي الحميم،"], [14, "الذي كانت لنا عشر ة معه، وكنا نترافق في الحضور إلى بيت الله مع جمهور العابدين."], [15, "ليفاجيء الموت أعدائي فينزلوا إلى الهاوية أحياء، لأن الشر جاثم في وسط مساكنهم."], [16, "أما أنا فبالرب أستغيث والرب يخلصني."], [17, "مساء وصباحا وظهرا أشكو له صارخا ونائحا، فيسمع صوتي."], [18, "يخلص نفسي بسلام من المعارك الناشبة حولي إذ إن المتألبين علي كثيرون."], [19, "حقا إن الله الجالس على العرش منذ الأزل يسمع لي فيذل أعدائي، الذين لا يتغيرون ولا يخافون الله ."], [20, "(رفيقي القديم) هاجم أصحابه المسالمين ونقض عهده معهم."], [21, "كان كلامه أنعم من الزبدة، وفي قلبه يضمر القتال. كلماته ألين من الزيت، ولكنها سيوف مسلولة."], [22, "ألق على الرب همك وهو يعتني بك: إنه لا يدع الصديق يتزعزع إلى الأبد."], [23, "وأنت ياالله تطرح الأشرار إلى هوة الهلاك وتقصر أعمار سافكي الدماء والغشاشين. أما أنا فأتكل عليك."]]}, {"l": "Psa 67:1-7", "n": "", "vs": [[1, "ليترَأف الله علينا وليباركنا، وليضيء بوجهه علينا"], [2, "لكي يعرف في الأرض طريقك، وبين جميع الأمم خلاصك."], [3, "تحمدك الشعوب ياالله ، تحمدك الشعوب كلها."], [4, "تفرح وتبتهج الأمم لأنك تدين الشعوب بالاستقامة، وتهدي أمم الأرض."], [5, "تحمدك الشعوب ياالله ، تحمدك الشعوب كلها."], [6, "أعطت الأرض غلتها الوفيرة."], [7, "يباركنا الله إلهنا، فتخافه كل أقاصي الأرض."]]}, {"l": "Psa 76:1-12", "n": "", "vs": [[1, "الله معروف في يهوذا واسمه معظم في إسرائيل."], [2, "خيمته في أورشليم ومسكنه في جبل صهيون."], [3, "هناك حطم السهام البارقة، والترس والسيف وكل أسلحة الحرب."], [4, "أنت أمجد وأعظم جلالا من الجبال الخالدة"], [5, "سلبت أبطالهم، فناموا نوم الموت، ولم تنفعهم قدراتهم."], [6, "من زجرك ياإله يعقوب تصرع الفرسان والخيول."], [7, "إنما أنت مهوب، فمن يقف أمامك في غضبك؟"], [8, "من السماء أصدرت حكما فلما سمعته الأرض فزعت وصمتت."], [9, "كان ذلك عندما قمت للقضاء لتخلص ودعاء الأرض كلهم."], [10, "حقا يحمدك غضب الإنسان، وما تبقى من الغضب تتمنطق أنت به."], [11, "انذروا وأوفوا للرب إلهكم. ياجميع من حوله قدموا هدية للمهوب،"], [12, "فهو يستأصل أرواح رؤساء الأرض، ويرهب ملوكها العظماء."]]}], "kwAr": "ذوات الأوتار", "noteAr": "بالعبرية: «نجينوت». انظر عناوين المزامير 4 و6 و54 و55 و67 و76."}], "arS": [["الرب", ["H3068"]], [" ", []], ["الإله", ["H136"]], [" هو ", []], ["قوتي", ["H2428"]], ["؛ ", []], ["يجعل", ["H7760"]], [" ", []], ["قدمي", ["H7272"]], [" كقدمي ", []], ["غزال", ["H355"]], ["، ويعينني على ", []], ["ارتقاء", ["H1869"]], [" ", []], ["المرتفعات", ["H1116"]], [".إلى ", []], ["قائد", ["H5329"]], [" الجوقة: تغنى على ذوات ", []], ["الأوتار", ["H5058"]], [".", []]]}], "strong": true}];</script>
