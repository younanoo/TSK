 منها وأقيم عليها من أختاره، لأنه من هو مثلي؟ ومن يحاكمني؟ وأي راع يقوى على مواجهتي؟"], [20, "لذلك اسمعوا ما خططه الرب ضد أدوم، وما دبره ضد ساكني تيمان: ها صغار القوم يجرون، وتنهدم مساكنهم عليهم."], [21, "من صوت سقوطهم ترجف الأرض، وأصداء صراخهم تبلغ البحر الأحمر."], [22, "ها هو يحلق كالنسر، وينشر جناحيه على بصرة، فتصبح قلوب جبابرة أدوم كقلب امرأة ماخض»."], [23, "نبوءة عن دمشق: «قد لحق الخزي بحماة وأرفاد إذ بلغتهما الأنباء المزعجة، ذابتا خوفا واضطربتا كالبحر الهائج."], [24, "خارت قوى دمشق وأدبرت لتهرب، واستولى عليها الرعب، وأدركها الكرب والألم كامرأة ماخض."], [25, "كيف لم يبق على المدينة الشهيرة، مدينة مسرتي؟"], [26, "لذلك سيتساقط شبابها في ساحاتها، ويبيد جميع جنودها في ذلك اليوم، يقول الرب القدير."], [27, "سأضرم النار في سور دمشق فتلتهم قصور بنهدد»."], [28, "نبوءة عن قيدار وممالك حاصور التي هاجمها نبوخذناصر: «هذا ما يعلنه الرب: هبوا وازحفوا على قيدار. دمروا أمم المشرق."], [29, "فإن خيامهم وقطعان أغنامهم يستولى عليها، وتؤخذ أستارهم وأمتعتهم، وتنهب جمالهم منهم، ويهتف بهم الرجال: الرعب يحدق من كل جانب."], [30, "اهربوا سريعا. تفرقوا. تواروا في الأعماق ياأهل حاصور، يقول الرب، لأن نبوخذناصر ملك بابل تآمر عليكم ودبر خطته ضدكم."], [31, "هبوا، وازحفوا على أمة مترفة تسكن في دعة، يقول الرب. لا بوابات لها ولا مزاليج بل تسكن منفردة."], [32, "ستصبح إبلهم غنيمة وماشيتهم سلبا، وأذري لكل ريح كل مقصوصي زوايا الشعر، وأوقع بهم البلية من كل جوانبهم، يقول الرب."], [33, "فتصبح حاصور مأوى لبنات آوى، وخرابا إلى الأبد. لا يقيم هناك أحد، ولا يتغرب فيها إنسان»."], [34, "النبوءة التي أوحى بها الرب إلى إرميا عن عيلام في مستهل حكم صدقيا ملك يهوذا:"], [35, "هذا ما يعلنه الرب القدير: «ها أنا أحطم قوس عيلام، عماد قوتهم."], [36, "وأرسل على عيلام الرياح الأربع من أطراف السماء الأربعة، وأذريهم لكل تلك الرياح، فلا تبقى أمة لا يسبى إليها العيلاميون."], [37, "وأفزع عيلام أمام أعدائهم وأمام طالبي نفوسهم، وأعاقبهم بالشر وبغضبي اللاهب، وأجعل السيف يتعقبهم حتى أفنيهم."], [38, "وأنصب عرشي في عيلام، وأقضي على ملكهم وعلى عظمائهم."], [39, "ولكن أرد سبي عيلام في الأيام الآتية يقول الرب»."]]}, {"l": "Jer 52:1-34", "n": "", "vs": [[1, "كان صدقيا في الحادية والعشرين من عمره حين ملك، وتولى الحكم في أورشليم إحدى عشرة سنة، واسم أمه حميطل بنت إرميا من لبنة."], [2, "وارتكب الشر في عيني الرب على غرار ما عمل يهوياقيم."], [3, "ولم يكن ما أصاب أورشليم ويهوذا إلا نتيجة لغضب الرب، حتى إنه نبذهم من حضرته. وتمرد صدقيا على ملك بابل."], [4, "وفي اليوم العاشر من الشهر العاشر من السنة التاسعة لحكمه، زحف نبوخذناصر ملك بابل بجيشه على أورشليم وحاصرها وبنى حولها المتاريس."], [5, "وظلت المدينة تحت الحصار حتى السنة الحادية عشرة من حكم صدقيا."], [6, "وفي اليوم التاسع من الشهر الرابع استفحل الجوع في المدينة حتى لم يبق طعام لشعب الأرض."], [7, "ففتح الشعب ثغرة في المدينة وهرب جميع المحاربين وغادروا المدينة ليلا من طريق البوابة الواقعة بين السورين القريبين من بستان الملك، والكلدانيون ما برحوا محاصرين المدينة من كل جهة، وانطلقوا في طريق البرية."], [8, "لكن جيش الكلدانيين تعقب الملك، وأدرك صدقيا في سهول أريحا وقد تفرق عنه جميع جيشه،"], [9, "فقبضوا عليه وأخذوه إلى ملك بابل في ربلة، في منطقة حماة، فأصدر عليه قضاءه."], [10, "وذبح ملك بابل أبناء صدقيا على مرأى منه وقتل أيضا جميع أشراف يهوذا في ربلة."], [11, "وفقأ عيني صدقيا وأوثقه بسلسلتين من نحاس، ثم ساقه إلى بابل حيث زجه في السجن إلى يوم وفاته."], [12, "وفي اليوم العاشر من الشهر الخامس من السنة التاسعة عشرة من حكم نبوخذناصر ملك بابل، جاء نبوزرادان رئيس الشرطة الذي كان يقف دائما في حضرة ملك بابل، إلى أورشليم،"], [13, "وأحرق هيكل الرب وقصر الملك وجميع بيوت أورشليم، وأضرم النار في كل بيت من بيوت العظماء،"], [14, "وهدم كل جيش الكلدانيين المرافق لرئيس الشرطة كل أسوار أورشليم المحيطة بها."], [15, "وأجلى نبوزرادان رئيس الشرطة بعضا من فقراء البلد، ومن بقي من الشعب في المدينة، والهاربين الذين لجأوا إلى ملك بابل مع سائر الحرفيين."], [16, "ولكنه أبقى على بعض المساكين ليكونوا كرامين وفلاحين."], [17, "وحطم الكلدانيون أعمدة النحاس في هيكل الرب، والقواعد والبركة النحاسية القائمة فيه، ونقلوا كل نحاسها إلى بابل."], [18, "واستولوا أيضا على القدور والرفوش والمجارف والمناضح والصحون وكل آنية النحاس التي كانت تستخدم في الهيكل."], [19, "كما أخذ رئيس الشرطة الطسوس والمجامر والمناضح والقدور والمنائر والصحون والأقداح الذهبية والفضية."], [20, "كذلك استولى على العمودين والبركة والاثني عشر ثورا من نحاس القائمة تحت القواعد التي صنعها الملك سليمان لهيكل الرب، فكان النحاس لكثرته يفوق كل وزن."], [21, "وكان طول كل عمود ثماني عشرة ذراعا (نحو تسعة أمتار)، ومحيطه اثنتي عشرة ذراعا (نحو ستة أمتار)، وسمكه أربع أصابع، وكان أجوف،"], [22, "وعليه تاج من نحاس ارتفاعه خمس أذرع (نحو مترين ونصف المتر) ويحيط بالتاج شبكة ورمانات وكلها مصنوعة من نحاس. وكان العمود الثاني مماثلا له بما في ذلك الرمانات."], [23, "وكان عدد الرمانات على محيطه ستا وتسعين رمانة، وجملة الرمان على محيط الشبكة مئة رمانة."], [24, "وأخذ رئيس الشرطة سرايا رئيس الكهنة ونائبه صفنيا الكاهن وحراس الباب الثلاثة."], [25, "واعتقل من المدينة الخصي القائد الذي كان يتولى قيادة المحاربين، كما اعتقل سبعة رجال من حاشية الملك ممن عثر عليهم في المدينة، وكذلك أمين سر قائد الجيش الذي كان يجند شعب البلد، وستين رجلا من أهل الأرض الذين كانوا قد اختبأوا داخل المدينة."], [26, "فأخذهم نبوزرادان رئيس الشرطة وساقهم إلى ملك بابل في ربلة،"], [27, "فضربهم ملك بابل وقتلهم في ربلة في منطقة حماة. وهكذا سبي شعب يهوذا من أرضه."], [28, "وهذا هو إحصاء الشعب الذين سباهم نبوخذناصر في السنة السابعة: ثلاثة آلاف وثلاثة وعشرون من اليهود."], [29, "وسبى نبوخذناصر من أورشليم في السنة الثامنة عشرة لحكمه ثماني مئة واثنين وثلاثين شخصا."], [30, "وفي السنة الثالثة والعشرين لحكم نبوخذناصر سبى نبوزرادان رئيس الشرطة من اليهود سبع مئة وخمسة وأربعين شخصا، فكانت جملة المسبيين أربعة آلاف وست مئة شخص."], [31, "وفي اليوم الخامس والعشرين من الشهر الثاني عشر(أي شباط فبراير) من السنة السابعة والثلاثين لسبي يهوياكين ملك يهوذا، أكرم أويل مرودخ، ملك بابل، في سنة اعتلائه العرش، يهوياكين ملك يهوذا وأخرجه من السجن."], [32, "وخاطبه بطيب الكلام، ورفع مقامه فوق مقام سائر الملوك الذين معه في بابل."], [33, "فخلع يهوياكين عن نفسه ثياب سجنه، وظل يتناول الطعام في حضرة ملك بابل طوال أيام حياته."], [34, "وعينت له نفقة دائمة يقبضها من خزانة مال الملك كل يوم بيومه مدى أيام حياته، وإلى يوم وفاته."]]}, {"l": "Eze 25:1-30:26", "n": "", "vs": [[1, "وأوحى إلي الرب بكلمته قائلا:"], [2, "«ياابن آدم، التفت بوجهك نحو بني عمون وتنبأ عليهم."], [3, "وقل لهم اسمعوا ما يعلنه السيد الرب من قضاء: لأنك شمت بمقدسي لأنه تدنس، وبأرض إسرائيل لأنها خربت وبشعب يهوذا لأنهم سيقوا إلى السبي،"], [4, "أسلمك للبدو وأبناء المشرق، فتصيرين ملكا لهم فينصبون مضاربهم فيك، ويقيمون مساكنهم فوق أرضك. هم يلتهمون غلتك، ويشربون لبنك."], [5, "وأجعل مدينة ربة مناخا للإبل، وسائر مدن بني عمون مرابض للغنم، فتدركون أني أنا الرب."], [6, "لأنك صفقت بكفيك طربا، وخبطت برجليك، وفرحت بكل ما فيك من لؤم لما حل بأرض إسرائيل."], [7, "لذلك ها أنا أثقل يدي عليك، وأسلمك غنيمة للأمم، وأستأصلك من بين الشعوب، وأفنيك من بين البلدان، وأدمرك، فتدرك أني أنا الرب."], [8, "وهذا ما يعلنه السيد الرب: لأن الموآبيين وأهل سعير يقولون: هل شعب يهوذا كبقية الأمم."], [9, "لذلك ها أنا أقوض جبهتهم الشرقية، وأدمر مدن حدودهم، بيت بشيموت وبعل معون وقريتايم وهي مدن مفخرة موآب."], [10, "فيستولى قبائل البدو عليها، ويصير بنو عمون ملكا لهم فلا يعود لهم ذكر بين الأمم."], [11, "وأنفذ في الموآبيين أحكاما، فيدركون أني أنا الرب."], [12, "وهذا أيضا ما يعلنه السيد الرب: لأن الأدوميين أقدموا على الانتقام من شعب يهوذا، وأساءوا إليه أشد إساءة."], [13, "ها أنا أعاقب الأدوميين وأستأصل من أرضهم الإنسان والحيوان، وأحولها إلى أطلال دارسة من التيمن إلى ددان، إذ يقتل أهلها جميعا بالسيف."], [14, "وأعهد بنقمتي إلى شعبي إسرائيل، فيفعلون بالأدوميين بمقتضى غضبي وسخطي، فيدركون شدة نقمتي، يقول السيد الرب."], [15, "وهذا أيضا ما يعلنه السيد الرب لأن الفلسطينيين قد أقدموا على الانتقام وأفرطوا فيه بكل لؤم قلوبهم، عامدين إلى الخراب بسبب عداوة أبدية،"], [16, "ها أنا أعاقب الفلسطينيين وأستأصل الكريتيين، وأبيد بقية سكان ساحل البحر،"], [17, "وأنفذ فيهم انتقامي العظيم بتأديب مفعم بالسخط، فيدركون أني أنا الرب، إذ أصب نقمتي عليهم»."], [1, "وفي السنة الحادية عشرة (من سبي الملك يهوياكين)، في اليوم الأول من الشهر، أوحى إلي الرب بكلمته قائلا:"], [2, "«ياابن آدم، لأن صور قد شمتت بأورشليم، وقالت: ها بوابة الشعوب قد انهارت، وتحولت القوافل إلي. ها أنا أزدهر إذ حل بها الدمار."], [3, "لذلك يعلن السيد الرب: ها أنا أعاقبك ياصور، فأجعل أمما كثيرة تهاجمك كما يهجم البحر بأمواجه."], [4, "فيهدمون أسوار صور وأبراجها، وأكشط ترابها عنها، وأحولها إلى صخرة جرداء."], [5, "فتصبح منشرا للشباك في وسط البحر لأني أنا قضيت، يقول السيد الرب، ثم تغدو غنيمة للأمم."], [6, "وتهلك ضواحيها الريفية بالسيف، فيدركون أني أنا الرب."], [7, "لأن هذا ما يعلنه السيد الرب: ها أنا آتي بملك الملوك، نبوخذناصر ملك بابل من الشمال بخيل وبمركبات وبفرسان وأقوام غفيرة،"], [8, "فيبيد بالسيف قرى ريفك ويشيد حولك سور حصار، ويبني عليك أبراجا، ويقيم مترسة، ويهاجمك بترس."], [9, "ويقذف أسوارك بمجانق، ويهدم أبراجك بعدة حربه."], [10, "ولكثرة خيله يحجبك غبار حوافرها، وتتزلزل أسوارك من صوت الفرسان والعربات والمركبات عند اقتحامه أبوابك كما تقتحم مدينة مثغورة،"], [11, "فيدوس بحوافر خيله كل شوارعك، ويقضي بالسيف على شعبك، فتتهاوى إلى الأرض أركان عزك،"], [12, "وينهبون ثروتك، ويستولون على تجارتك ويهدمون أسوارك وبيوتك المبهجة، ويطرحون حجارتك وخشبك وترابك إلى مياه البحر."], [13, "وأخرس أهازيج أغانيك، ولا تتردد بعد رنات أعوادك،"], [14, "وأجعلك كصخرة جرداء، فتكونين منشرا للشباك، ولا تعمرين في ما بعد. لأني أنا الرب قضيت يقول السيد الرب."], [15, "وهذا ما يعلنه السيد الرب عن مدينة صور: ألا ترتعد مدن السواحل لجلبة سقوطك، ولصراخ الجرحى، ولوقوع القتل فيك،"], [16, "فينزل جميع رؤساء المدن الساحلية عن عروشهم ويخلعون جببهم ويطرحون عنهم أرديتهم المزركشة، ويكتسون الرعب ثوبا، ويجلسون على الأرض مرتجفين في كل لحظة، مذعورين لما أصابك"], [17, "عندئذ ينوحون عليك بمرثاة قائلين: كيف تلاشيت من بين البحار أيتها المدينة العامرة الشهيرة، التي كانت مسيطرة هي وسكانها على البحر، فألقوا رعبهم على جميع جيرانها."], [18, "الآن ترتعد مدن السواحل في وقت سقوطك، وتضطرب الجزائر في وسط البحر لانهيارك،"], [19, "إذ أحولك إلى مدينة خربة كالمدن المقفرة. أطغي عليك لجج البحر وأغمرك بالمياه الكثيرة،"], [20, "وأحدرك مع الهابطين إلى الهاوية، إلى الشعب القديم، وأجعلك تقيمين في أسافل الأرض في الخرب الدائرة لتظلي مقفرة، فلا يكون لك مكان في أرض الأحياء،"], [21, "وأجلب الرعب عليك فلا يبقى منك أثر وإذ يبحث عنك لا يعثر عليك أبدا، يقول السيد الرب»."], [1, "وأوحى إلي الرب بكلمته قائلا:"], [2, "«وأما أنت ياابن آدم، فاندب صور بمرثاة،"], [3, "وقل لصور القائمة عند مداخل البحر، تاجرة الشعوب، القاطنة في مدن السواحل: ياصور أنت قلت: أنا كاملة الجمال."], [4, "تخومك في قلب البحار، وبناؤوك أكملوا جمالك،"], [5, "صنعوا كل ألواحك من سرو سنير، وأخذوا أرزا من لبنان ليعملوا لك سواري."], [6, "من بلوط باشان صنعوا مجاذيفك، وطعموا مقاعدك بالعاج المستجلب من سواحل قبرص."], [7, "نصبوا شراعك من كتان مطرز من مصر ليكون لك راية. وكانت مظلتك من قماش أزرق وأرجواني من جزائر أليشة."], [8, "كان أهل صيدون وإرواد ملاحيك، وحكماؤك المهرة ياصور الذين كانوا فيك هم ربابينك،"], [9, "شيوخ جبيل وصناعها المهرة الذين كانوا فيك هم قلافوك الذين يسدون شقوقك. جميع سفن البحر وملاحوها قدموا إليك للمتاجرة معك."], [10, "أقوام من فارس ولود وفوط انخرطوا في جيشك وكانوا من رجال حربك. علقوا على أسوارك أتراسا وخوذا، وخلعوا عليك بهاءك."], [11, "أبناء إرواد مع جيشك قائمون على أسوارك المحيطة بك، وتمنعت أبراجك برجال أبطال، علقوا أتراسهم على أسوارك المحيطة بك، وأكملوا جمالك."], [12, "ترشيش تاجرت معك لكثرة ما فيك من أنواع الغنى، فدفعت فضة وحديدا وقصديرا ورصاصا لقاء بضائعك."], [13, "تاجرت معك اليونان وتوبال وماشك، فقايضوا بضائعك بالرقيق وآنية النحاس،"], [14, "وقايض أهل بيت توجرمة بضائعك بالخيل والفرسان والبغال."], [15, "تاجر معك أهل رودس، ومدن ساحلية كثيرة كانت مراكز أسواقك، فدفعوا لك قرون العاج والآبنوس."], [16, "أدوم تاجرت معك، فقايضوا بضائعك في أسواقك بحجارة البهرمان والأرجوان، والقماش المطرز والبوص والمرجان والياقوت،"], [17, "وتاجرت معك أرض يهوذا وإسرائيل، فقايضوا بضائعك بالحنطة والزيتون وأوائل التين والعسل والزيت والبلسان."], [18, "دمشق تاجرت معك لكثرة بضائعك وفرط غناك، فقايضت بضائعك بخمرة حلبون والصوف الأبيض."], [19, "وقايض أهل دان واليونان بضائعك بخمرة أوزال والحديد المشغول والقرفة الصينية وقصب الذريرة."], [20, "وقايضت رودس بضائعك بأغطية السروج."], [21, "وتاجر معك العرب وكل رؤساء قيدار، فقايضوا بضائعك بالخرفان والكباش والأعتدة."], [22, "وتاجر معك أيضا تجار شبا ورعمة، فقايضوا بضائعك بأفخر أنواع الطيب والحجارة الكريمة والذهب."], [23, "ومن المتاجرين معك أيضا أهل حران وكنة وعدن وشبا، وأشور وكلمد."], [24, "هؤلاء قايضوا بضائعك بنفائس الأردية الأسمانجونية والمطرزة، وبسجاجيد ملونة مبرومة الخيطان ومضفورة بإحكام."], [25, "وكانت سفن ترشيش قوافلك البحرية المحملة بتجارتك، فامتلأت وتعظمت جدا في عرض البحار."], [26, "أبحر بك ملاحوك إلى لجج المياه حيث جعلتك الريح الشرقية حطاما في قلب البحار."], [27, "غرقت ثروتك وأسواقك وبضاعتك وملاحوك وربابينك وقلافوك والمتاجرون بمنتوجاتك في أعماق البحر في يوم سقوطك."], [28, "ترتعش مسارح القطعان من صوت صراخ ربابينك."], [29, "يهجر كل المجذفين والملاحين وربابنة البحر سفنهم ويقفون على البر."], [30, "يرفعون صوتهم بالنواح عليك ويصرخون بمرارة، ويذرون ترابا فوق رؤوسهم، ويتمرغون في الرماد."], [31, "يحلقون شعر رؤوسهم عليك، ويرتدون المسوح، ويندبونك بمرارة نفس ندبا أليما."], [32, "وفي ندبهم يقيمون عليك مناحة، ويرثونك قائلين: أية مدينة عمها الصمت مثل صور في قلب البحار؟"], [33, "عند وصول بضائعك عبر البحار أشبعت أمما كثيرة، وأغنيت ملوك الأرض بكثرة ثروتك وتجارتك."], [34, "ولكن حين أغرقتك العواصف في أعماق المياه، غرق معك ملاحوك وتجارتك."], [35, "فاعترى الذعر عليك كل سكان المدن الساحلية، واقشعر ملوكهم رعبا، واضطربت وجوههم."], [36, "يصفر تجار الشعوب دهشة عليك لما حل بك من مصير رهيب، ولن يبقى بعد منك أثر»."], [1, "وأوحى إلي الرب بكلمته قائلا:"], [2, "«ياابن آدم، قل لملك صور، هذا ما يعلنه السيد الرب: لأنك تكبرت وقلت: «أنا إله، وأتربع في مجلس الآلهة، في قلب البحار»؛ مع أنك إنسان ولست إلها، وإن ظننت أن لديك حكمة الآلهة!"], [3, "ها أنت أحكم من دانيآل ولا يخفى عليك سر."], [4, "قد استحوذت بحكمتك وفهمك على الذهب والفضة وادخرتها في خزائنك،"], [5, "وبمهارتك العظيمة في التجارة ضاعفت ثروتك، فتكبر قلبك لفرط غناك."], [6, "لذلك يقول السيد الرب: لأنك ظننت أن لديك حكمة الآلهة،"], [7, "ها أنا أثير عليك غرباء من أعتى الأمم، فيجردون سيوفهم على بهاء حكمتك، ويدنسون جمالك."], [8, "يطر حونك إلى الهاوية فتموت موت القتلى في أعماق البحار."], [9, "أتظل تقول أنئذ أمام قاتلك: أنا إله؟ أنت إنسان لا إله في قبضة ذابحيك."], [10, "فتلقى حتفك كالغلف بيد الغرباء، لأني أنا قضيت يقول السيد الرب»."], [11, "وأوحى إلي الرب بكلمته قائلا:"], [12, "«ياابن آدم، اندب ملك صور بمرثاة وقل له هذا ما يعلنه السيد الرب: كنت خاتم الكمال، مفعما بالحكمة وكامل الجمال."], [13, "كنت في جنة الله عدن، حجابك كل حجر كريم: عقيق أحمر وياقوت أصفر وعقيق أبيض وزبرجد وجزع ويشب وياقوت أزرق وبهرمان وزمرد وذهب. صاغوا منه بيوت حجارتك الكريمة وترصيعاتك يوم خلقت."], [14, "ومسحتك لتكون الكروبيم المظلل وأقمتك على جبل الله المقدس، وتمشيت بين حجار ة النار."], [15, "كنت كاملا في طرقك منذ يوم خلقت إلى أن وجد فيك إثم."], [16, "إنما بسبب كثرة تجارتك امتلأ داخلك ظلما، فأخطأت. لهذا أطرحك من جبل الله كشيء نجس، وأبيدك أيها الكروب المظلل من بين حجارة النار."], [17, "قد تكبر قلبك بسبب بهائك، وأفسدت حكمتك من جراء جلالك. سألقي بك إلى الأرض أمام الملوك لتكون عرضة لعيونهم الهازئة."], [18, "قد نجست مقادسك بفرط آثامك وتجارتك الظالمة. لذلك أجعل النار تندلع من وسطك فتلتهمك، وأحولك إلى رماد على الأرض أمام كل من يراك."], [19, "فيتحير لما أصابك جميع الذين يعرفونك بين الشعوب، إذ تحل بك الأهوال ولا يبقى منك أثر»."], [20, "وأوحى إلي الرب بكلمته قائلا:"], [21, "«ياابن آدم، التفت بوجهك نحو صيدون وتنبأ عليها."], [22, "وقل هذا ما يعلنه السيد الرب: ها أنا أنقلب عليك ياصيدون وأتجلى بمجدي فيك فيدرك سكانك أني أنا الرب حين أنفذ فيك أحكاما وأتقدس في وسطك."], [23, "أجعل الوبأ يتفشى فيك وتسفك دماء في أزقتك، ويتساقط في وسطك جرحى السيف الذي يحدق بك من كل ناحية، فيدركون أني أنا الرب."], [24, "فلا يتعرض شعب إسرائيل إلى وخزات العليق ولا إلى شوكة مؤذية من الأمم المحيطة بهم ممن تبغضهم، فيدركون أني أنا السيد الرب."], [25, "وهذا ما يعلنه السيد الرب: عندما أجمع شعب إسرائيل من بين الشعوب التي تفرقوا إليها، وتتجلى قداستي فيهم أمام عيون الأمم، عندما يعودون ويستوطنون في أرضهم التي وهبتها لعبدي يعقوب،"], [26, "ويقيمون فيها مطمئنين ويشيدون بيوتا ويغرسون كروما ويسكنون آمنين. وعندما أنفذ أحكاما في جميع أعدائهم المحيطين بهم، عندئذ يدركون أني أنا الرب إلههم»."], [1, "وفي اليوم الثاني عشر من الشهر العاشر العبري (أي كانون الأول ; ديسمبر) من السنة العاشرة (لسبي الملك يهوياكين)، أوحى إلي الرب بكلمته قائلا:"], [2, "«ياابن آدم، التفت نحو فرعون ملك مصر وتنبأ عليه وعلى مصر كلها"], [3, "وقل هذا ما يعلنه السيد الرب: ها أنا أنقلب عليك يافرعون ملك مصر، أيها التمساح الكامن في وسط أنهاره، القائل: النهر لي وقد صنعته لنفسي."], [4, "ها أنا أضع خزائم في فكيك وأجعل سمك أنهارك يلتصق بحراشفك، وأخرجك قسرا من أنهارك، وأسماكها ما برحت لاصقة بحراشفك."], [5, "وأهجرك في البرية مع جميع سمك أنهارك، فتتهاوى على سطح أرض الصحراء فلا تجمع ولاتلم بل تكون قوتا لوحوش البر ولطيور السماء."], [6, "فيدرك كل أهل مصر أني أنا الرب، لأنهم كانوا عكاز قصب هشة لشعب إسرائيل،"], [7, "ما إن اعتمدوا عليك بأكفهم حتى انكسرت ومزقت أكتافهم، وعندما توكأوا عليك تحطمت وقصفت كل متونهم."], [8, "لذلك ها أنا أجلب عليك سيفا وأستأصل منك الإنسان والحيوان،"], [9, "فتصبح ديار مصر مقفرة خربة، فيدركون أني أنا الرب، لأن فرعون قال: لي النهر وأنا قد صنعته."], [10, "لذلك ها أنا أنقلب عليك وعلى أنهارك، وأجعل أراضي مصر خرائب متردمة مقفرة، من مجدل إلى أسوان حتى تخوم إثيوبيا."], [11, "لا تمر بها قدم إنسان ولا تجتازها رجل بهيمة، وتظل مهجورة من الناس طوال أربعين سنة."], [12, "وأجعل ديار مصر الأكثر وحشة بين الأراضي المقفرة، وتظل مدنها الأكثر خرابا بين المدن الخربة وأشدها وحشة طوال أربعين سنة، وأشتت المصريين بين الأمم وأفرقهم في البلدان."], [13, "وفي نهاية الأربعين سنة أجمع المصريين من بين الشعوب التي تشتتوا بينها."], [14, "وأرد سبيهم، وأعيدهم إلى أرض فتروس موطنهم، فيكونون هناك مملكة حقيرة."], [15, "بل تكون أحقر الممالك فلا تتشامخ بعد على بقية الأمم، وأجعلهم أقلية لئلا يتسلطوا على الشعوب."], [16, "فلا تكون بعد محط اعتماد لشعب إسرائيل، بل تذكرهم بإثمهم حين ضلوا وراءهم، فيدركون أني أنا السيد الرب»."], [17, "وفي مطلع الشهر الأول العبري (أي آذار ; مارس) في السنة السابعة والعشرين (من سبي الملك يهوياكين) أوحى إلي الرب بكلمته قائلا:"], [18, "«ياابن آدم، إن نبوخذناصر ملك بابل قد سخر جيشه أشد تسخير ضد صور، فأصبحت كل رأس من رؤوس جنوده صلعاء، وكل كتف مجردة من الثياب. ولكن لم يغنم هو ولا جيشه شيئا من صور رغم ما كابده من جهد للاستيلاء عليها."], [19, "لذلك هذا ما يعلنه السيد الرب: ها أنا أبذل ديار مصر لنبوخذناصر ملك بابل فيستولي على ثروتها، ويسلبها غنائمها وينهبها، فتكون هذه أجرة لجيشه."], [20, "قد أعطيته أرض مصر لقاء تعبه، لأنه وجيشه قد عملوا في خدمتي، يقول السيد الرب."], [21, "في ذلك اليوم، أنمي قوة شعب إسرائيل وأفتح فمك بينهم، فيدركون أني أنا الرب»."], [1, "وأوحى إلي الرب بكلمته قائلا:"], [2, "«ياابن آدم، تنبأ وقل: هذا ما يعلنه السيد الرب: ولولوا قائلين: يالليوم الرهيب!"], [3, "إن يوم الرب بات وشيكا؛ يوم الرب قريب، إنه يوم مكفهر بالغيوم، ساعة دينونة للأمم،"], [4, "إذ يجرد سيف على مصر، فيعم الذعر الشديد إثيوبيا، عندما يتهاوى قتلى مصر ويستولى على ثروتها، وتنقض أسسها."], [5, "ثم تسقط معهم بالسيف إثيوبيا وفوط ولود وشبه الجزيرة العربية وليبيا وشعوب الأرض المتحالفة معهم."], [6, "حقا يسقط مناصر مصر وتذل كبرياء عزتها، فيتهاوى بالسيف سكانها من مجدل إلى أسوان، يقول السيد الرب."], [7, "فتصبح أكثر الأراضي المقفرة وحشة، وتضحى مدنها أكثر المدن خرابا!"], [8, "فيدركون أني أنا الرب حين أضرم نارا في مصر وينهار جميع حلفائها."], [9, "في ذلك اليوم يسرع رسلي إلى إثيوبيا المطمئنة ليثيروا فيها الرعب في يوم هلاك مصر، الذي لابد أن يتحقق."], [10, "لأني سأفني جماهير مصر بيد نبوخذناصر ملك بابل."], [11, "إذ يقبل هو وجيشه، أعتى جيوش الأمم، لخراب ديار مصر، فيجردون عليها سيوفهم ويملأون أرضها بالقتلى."], [12, "وأجفف مجاري نهر النيل، وأبيع الأرض لقوم أشرار، وأخرب البلاد فيها بيد غرباء. أنا الرب قضيت."], [13, "ثم أحطم الأصنام وأزيل الأوثان من ممفيس، ولا يبقى بعد رئيس في ديار مصر، وألقي فيها الرعب."], [14, "وأخرب فتروس، وأضرم نارا في صوعن، وأنفذ أحكاما في طيبة."], [15, "وأصب غضبي على سين حصن مصر، وأبيد أهل طيبة."], [16, "وأضرم نارا في مصر فتقاسي سين أشد الألم، وتتمزق طيبة شر تمزيق، وتتعرض ممفيس للرعب في كل يوم."], [17, "ويتساقط بالسيف شبان آون وفيبستة، ويسبى بقية سكانها"], [18, "ويظلم النهار في تحفنحيس عندما أحطم أنيار مصر هناك، وتتلاشى كبرياء عزتها. أما هي فتغشاها سحابة، وتسبى بناتها."], [19, "وهكذا أنفذ أحكاما في مصر، فيدركون أني أنا الرب»."], [20, "وفي اليوم السابع من الشهر الأول العبري (أي آذار ; مارس) من السنة الحادية عشرة (من سبي الملك يهوياكين)، أوحى إلي الرب بكلمته قائلا:"], [21, "«ياابن آدم، إني حطمت ذراع فرعون ملك مصر، ولن تجبر بالرفائد أو العصائب، فتجرد سيفا،"], [22, "وها أنا أنقلب على فرعون ملك مصر وأحطم ذراعيه، السليمة والمكسورة، وأسقط السيف من يده."], [23, "وأشتت المصريين بين الأمم وأفرقهم في البلدان."], [24, "وأشدد ذراعي ملك بابل وأضع سيفي في يده، وأحطم ذراع فرعون، فيئن أمامه أنين الجريح."], [25, "وأشدد ذراعي ملك بابل. أما ذراعا فرعون فتتهاويان، فيدركون أني أنا الرب حين أضع سيفي في يد ملك بابل، فيجرده على ديار مصر."], [26, "وأبدد المصريين بين الأمم وأمزقهم في البلدان، فيدركون أني أنا الرب»."]]}], "kwAr": "ولا يكفون", "noteAr": ""}], "arS": [["أمن أجل ", []], ["هذا", ["H5921", "H3651"]], [" يظلون ", []], ["يفرغون", ["H7324"]], [" ", []], ["شباكهم", ["H2764"]], [" ", []], ["ولا", ["H3808"]], [" ", []], ["يكفون", ["H2550"]], [" عن ", []], ["إهلاك", ["H2026"]], [" ", []], ["الأمم", ["H1471"]], [" إلى ", []], ["الأبد", ["H8548"]], ["؟", []]]}, {"c": 2, "v": 1, "text": "سأقف على مرصدي وأنتصب على الحصن، وأترقب لأرى ماذا يقول لي الرب، وبما أجيب عن شكواي.", "groups": [{"kw": "stand", "raw": "Psa_73:16, Psa_73:17; Isa_21:8, Isa_21:11, Isa_21:12", "note": "", "refs": [{"l": "Psa 73:16", "n": "", "vs": [[16, "وعندما نويت أن أفهم هذا، تعذر الأمر علي،"]]}, {"l": "Psa 73:17", "n": "", "vs": [[17, "إلى أن دخلت أقداس الله، وتأملت مآل الأشرار"]]}, {"l": "Isa 21:8", "n": "", "vs": [[8, "ثم هتف الرقيب: ها أنا أقف على برج المراقبة يوما بعد يوم أيها الرب، وأقوم على المحرس طوال الليل."]]}, {"l": "Isa 21:11", "n": "", "vs": [[11, "نبوءة بشأن أدوم: هتف صارخ من سعير: «يا رقيب، ماذا بقي من الليل؟ أما آن له أن ينتهي؟»"]]}, {"l": "Isa 21:12", "n": "", "vs": [[12, "فأجاب الرقيب: «أشرق الصبح ولكن الليل أقبل معه، فإن رغبتم في السؤال فاسألوا، ثم تعالوا وارجعوا إلى الله»."]]}], "kwAr": "سأقف", "noteAr": ""}, {"kw": "tower", "raw": "Heb. fenced place, 2Sa_18:24; 2Ki_9:17, 2Ki_17:9; Isa_21:5, Isa_62:6", "note": "Heb. fenced place, 2Sa_18:24; 2Ki_9:17, 2Ki_17:9; Isa_21:5, Isa_62:6", "refs": [{"l": "2Sa 18:24", "n": "", "vs": [[24, "وبينما كان داود جالسا في الساحة الفاصلة بين البوابة الخارجية والبوابة الداخلية طلع الرقيب إلى السور فوق سطح الباب، وتلفت حوله وإذا به يرى رجلا يركض وحده،"]]}, {"l": "2Ki 9:17", "n": "", "vs": [[17, "وكان الرقيب قائما على برج يزرعيل، فشاهد جماعة ياهو مقبلين، فقال للملك: «إني أرى قوما قادمين». فأمره يهورام: «أرسل فارسا للقائهم، فيسألهم: أللخير قدومهم؟»"]]}, {"l": "2Ki 17:9", "n": "", "vs": [[9, "وارتكب بنو إسرائيل في الخفاء معاصي في حق الرب إلههم، وشيدوا لأنفسهم مرتفعات في جميع مدنهم من برج النواطير إلى المدينة المحصنة،"]]}, {"l": "Isa 21:5", "n": "", "vs": [[5, "أعدوا مائدة وفرشوا السجاجيد، أكلوا وشربوا، فانهضوا يا أمراء، وادهنوا بالزيت تروسكم."]]}, {"l": "Isa 62:6", "n": "", "vs": [[6, "على أسوارك ياأورشليم أقمت حراسا يبتهلون نهارا وليلا. ياذاكري الرب لا تكفوا."]]}], "kwAr": "الحصن", "noteAr": "بالعبرية: «مكان محصن». انظر 2صم 18: 24؛ 2مل 9: 17؛ 17: 9؛ إش 21: 5؛ 62: 6"}, {"kw": "and will", "raw": "Hab_1:12-17; Psa_85:8", "note": "", "refs": [{"l": "Hab 1:12-17", "n": "", "vs": [[12, "ألست أنت منذ الأزل أيها الرب إلهي، قدوسي؟ لهذا لن نفنى. لقد أقمت الكلدانيين لمقاضاتنا واخترتهم ياصخرتي لتعاقبنا."], [13, "إن عينيك أطهر من أن تشهدا الشر، وأنت لا تطيق رؤية الظلم، فكيف تحتمل مشاهدة الأثمة، وتصمت عندما يبتلع المنافقون من هم أبر منهم؟"], [14, "وكيف تجعل الناس كأسماك البحر، أو كأسراب الحشرات التي لا قائد لها؟"], [15, "إن الكلدانيين يستخرجونهم بالشصوص، ويصطادونهم بالشبكة، ويجمعونهم في مصيدتهم متهللين فرحين."], [16, "لهذا هم يقربون ذبائح لشباكهم، ويحرقون بخورا لمصائدهم، لأنهم بفضلها يتمتعون بالرفاهية ويتلذذون بأطايب الطعام."], [17, "أمن أجل هذا يظلون يفرغون شباكهم ولا يكفون عن إهلاك الأمم إلى الأبد؟"]]}, {"l": "Psa 85:8", "n": "", "vs": [[8, "إني أسمع ما يتكلم به الله الرب، فإنه يتكلم بالسلام لشعبه ولأتقيائه، فلا يرجعون إلى الجهالة."]]}], "kwAr": "وأترقب", "noteAr": ""}, {"kw": "unto me", "raw": "or, in me, 2Co_13:3; Gal_1:16", "note": "or, in me, 2Co_13:3; Gal_1:16", "refs": [{"l": "2Co 13:3", "n": "", "vs": [[3, "مادمتم تطلبون برهانا على أن المسيح يتكلم في. وهو ليس ضعيفا تجاهكم، بل قوي في ما بينكم."]]}, {"l": "Gal 1:16", "n": "", "vs": [[16, "أن يعلن ابنه في لأبشر به بين الأمم، في الحال لم أستشر لحما ودما،"]]}], "kwAr": "يقول لي", "noteAr": "أو: «فيّ». انظر 2كو 13: 3؛ غل 1: 16"}, {"kw": "when I am reproved", "raw": "or, when I am argued with, Heb. upon my reproof, or arguing, Job_23:5-7, Job_31:35, Job_31:37; Jer_12:1", "note": "or, when I am argued with, Heb. upon my reproof, or arguing, Job_23:5-7, Job_31:35, Job_31:37; Jer_12:1", "refs": [{"l": "Job 23:5-7", "n": "", "vs": [[5, "فأطلع على جوابه وأفهم ما يقوله لي؟"], [6, "أيخاصمني بعظمة قوته؟ لا! بل يلتفت مترئفا علي."], [7, "هناك يمكن للمستقيم أن يحاجه، وأبريء ساحتي إلى الأبد من قاضي."]]}, {"l": "Job 31:35", "n": "", "vs": [[35, "آه من لي بمن يستمع لي! هوذا توقيعي، فليجبني القدير. ليت خصمي يكتب شكواه ضدي،"]]}, {"l": "Job 31:37", "n": "", "vs": [[37, "لكنت أقدم له حسابا عن كل خطواتي، وأدنو منه كما أدنو من أمير."]]}, {"l": "Jer 12:1", "n": "", "vs": [[1, "أنت دائما عادل حين أعرض عليك دعواي، ولكن دعني أحدثك بشأن أحكامك: لماذا تفلح طريق الأشرار؟ ولماذا يتمتع الغادرون بالعيش الرغيد؟"]]}], "kwAr": "عن شكواي", "noteAr": "أو: «عندما يُحاجَجني»؛ بالعبرية: «على توبيخي أو محاجتي». انظر أي 23: 5-7؛ 31: 35، 37؛ إر 12: 1"}], "arS": [["سأقف", ["H5975"]], [" ", []], ["على", ["H5921"]], [" ", []], ["مرصدي", ["H4931"]], [" ", []], ["وأنتصب", ["H3320"]], [" ", []], ["على", ["H5921"]], [" ", []], ["الحصن", ["H4692"]], ["، ", []], ["وأترقب", ["H6822"]], [" ", []], ["لأرى", ["H7200"]], [" ", []], ["ماذا", ["H4100"]], [" ", []], ["يقول", ["H1696"]], [" لي الرب، ", []], ["وبما", ["H4100"]], [" ", []], ["أجيب", ["H7725"]], [" ", []], ["عن", ["H5921"]], [" ", []], ["شكواي", ["H8433"]], [".", []]]}, {"c": 2, "v": 2, "text": "فأجابني الرب: «اكتب الرؤيا بوضوح على الألواح ليستطيع حتى الراكض قراءتها بسهولة وحملها للآخرين.", "groups": [{"kw": "Write", "raw": "Deu_27:8, Deu_31:19, Deu_31:22; Isa_8:1, Isa_30:8; Jer_36:2-4, Jer_36:27-32; Dan_12:4; Rev_1:18, Rev_1:19, Rev_14:13, Rev_19:9, Rev_21:5-8", "note": "", "refs": [{"l": "Deu 27:8", "n": "", "vs": [[8, "وتنقشون على الحجارة نقشا دقيقا كلمات هذه الشريعة جميعها»."]]}, {"l": "Deu 31:19", "n": "", "vs": [[19, "فالآن دونوا لأنفسكم هذا النشيد وعلموه لبني إسرائيل. ضعوه في أفواههم ليكون هذا النشيد شهادة عليهم."]]}, {"l": "Deu 31:22", "n": "", "vs": [[22, "فكتب موسى هذا النشيد في ذلك اليوم، وعلمه لبني إسرائيل."]]}, {"l": "Isa 8:1", "n": "", "vs": [[1, "ثم قال الرب لي: «خذ لنفسك لوحا كبيرا، واكتب عليه بحروف واضحة «مهير شلال حاش بز» (بمعنى مسرع إلى الغنيمة)»"]]}, {"l": "Isa 30:8", "n": "", "vs": [[8, "والآن، امض ودون ذلك على لوح، وسجله في كتاب ليكون شاهدا أبديا في الأيام الآتية."]]}, {"l": "Jer 36:2-4", "n": "", "vs": [[2, "«خذ لك درج كتاب ودون فيه كل الكلام الذي أمليته عليك عن إسرائيل، ويهوذا وعن جميع الأمم، منذ اليوم الذي أوحيت فيه إليك في عهد يوشيا إلى الآن."], [3, "لعل شعب يهوذا يسمعون عن جميع الشر الذي عزمت أن أوقعه بهم، فيتوب كل واحد عن غيه، فأعفو عن إثمهم وخطيئتهم»."], [4, "فاستدعى إرميا باروخ بن نيريا، فدون باروخ عن فم إرميا في درج كتاب جميع وحي الرب الذي أوحى إليه به."]]}, {"l": "Jer 36:27-32", "n": "", "vs": [[27, "وأوحى الرب إلى إرميا بعد أن أحرق الملك الكتاب وما دونه باروخ من كلام عن لسان إرميا قائلا:"], [28, "«خذ كتابا آخر ودون فيه ما ورد من كلام في الكتاب الأول الذي أحرقه يهوياقيم ملك يهوذا."], [29, "وقل فيه عن يهوياقيم ملك يهوذا: هذا ما يعلنه الرب: إنك قد أحرقت هذا الكتاب قائلا: لماذا دونت فيه أن ملك بابل سيزحف على هذه الأرض ويدمرها ويقضي على ما فيها من إنسان وحيوان؟"], [30, "لذلك هكذا يعلن الرب عن يهوياقيم ملك يهوذا: إنه لن يخلفه من ذريته من يجلس على عرش داود، وتطرح جثته خارجا لتكون عرضة للحر في النهار والبرد في الليل."], [31, "وأعاقبه وأعاقب ذريته وعبيده لإثمهم، وأوقع بهم وبجميع أهل أورشليم وبرجال يهوذا جميع ما قضيت به من شر عليهم إذ لم يسمعوا»."], [32, "فأخذ إرميا كتابا آخر وناوله لباروخ بن نيريا فدون فيه عن لسان إرميا كل ما ورد في الكتاب الذي أحرقه يهوياقيم ملك يهوذا بالنار من كلام، وأضاف إليه أيضا عبارات كثيرة مماثلة."]]}, {"l": "Dan 12:4", "n": "", "vs": [[4, "أما أنت يادانيآل فاكتم الكلام، واختم على الكتاب إلى ميعاد النهاية. وكثيرون يطوفون في الأرض وتزداد المعرفة»."]]}, {"l": "Rev 1:18", "n": "", "vs": [[18, "أنا الحي. كنت ميتا، ولكن ها أنا حي إلى أبد الآبدين. ولي مفاتيح الموت والهاوية."]]}, {"l": "Rev 1:19", "n": "", "vs": [[19, "دون ما رأيته، وما يحدث الآن، وما يوشك أن يحدث بعده."]]}, {"l": "Rev 14:13", "n": "", "vs": [[13, "وسمعت صوتا من السماء يقول: «اكتب: طوبى للأموات الذين يموتون منذ الآن وهم في الرب! يقول الروح: نعم! فليستريحوا من متاعبهم، لأن أعمالهم ترافقهم»."]]}, {"l": "Rev 19:9", "n": "", "vs": [[9, "وأملى علي الملاك أن أكتب: «طوبى للمدعوين إلى وليمة عرس الحمل». ثم قال: «الله نفسه يقول هذا القول الحق»."]]}, {"l": "Rev 21:5-8", "n": "", "vs": [[5, "وقال الجالس على العرش: «سأصنع كل شيء جديدا». ثم قال لي: «اكتب هذا، فإن ما أقوله هو الصدق والحق»."], [6, "ثم قال: «قد تم. أنا الألف والياء (البداية والنهاية). أنا أسقي العطشان من ينبوع ماء الحياة مجانا."], [7, "هذا كله نصيب المنتصر، وأكون إلها له، وهو يكون ابنا لي."], [8, "أما الجبناء وغير المؤمنين، والفاسدون والقاتلون والزناة، والمتصلون بالشياطين وعبدة الأصنام وجميع الدجالين، فمصيرهم إلى البحيرة المتقدة بالنار والكبريت، الذي هو الموت الثاني»."]]}], "kwAr": "اكتب", "noteAr": ""}, {"kw": "make", "raw": "Joh_11:28, Joh_11:29; 1Co_14:19; 2Co_3:12", "note": "", "refs": [{"l": "Joh 11:28", "n": "", "vs": [[28, "قالت هذا، وذهبت تدعو أختها مريم، فقالت لها سرا: «المعلم هنا، وهو يطلبك!»"]]}, {"l": "Joh 11:29", "n": "", "vs": [[29, "فلما سمعت مريم هبت واقفة، وأسرعت إلى يسوع."]]}, {"l": "1Co 14:19", "n": "", "vs": [[19, "ولكن، حيث أكون في الكنيسة، أفضل أن أقول خمس كلمات بعقلي، لكي أعلم بها الآخرين أيضا، على أن أقول عشرة آلاف كلمة بلغة مجهولة."]]}, {"l": "2Co 3:12", "n": "", "vs": [[12, "فإذ لنا هذا الرجاء الوطيد، نعمل بكثير من الجرأة."]]}], "kwAr": "بوضوح", "noteAr": ""}], "arS": [["فأجابني", ["H6030"]], [" ", []], ["الرب", ["H3068"]], [": «", []], ["اكتب", ["H3789"]], [" ", []], ["الرؤيا", ["H2377"]], [" ", []], ["بوضوح", ["H874"]], [" ", []], ["على", ["H5921"]], [" ", []], ["الألواح", ["H3871"]], [" ", []], ["ليستطيع", ["H4616"]], [" حتى ", []], ["الراكض", ["H7323"]], [" ", []], ["قراءتها", ["H7121"]], [" بسهولة وحملها للآخرين.", []]]}, {"c": 2, "v": 3, "text": "لأن الرؤيا لا تتحقق إلا في ميعادها، وتسرع إلى نهايتها. إنها لا تكذب وإن توانت فانتظرها، لأنها لابد أن تتحقق ولن تتأخر طويلا.", "groups": [{"kw": "the vision", "raw": "Jer_27:7; Dan_8:19, Dan_9:24-27, Dan_10:1, Dan_10:14, Dan_11:27, Dan_11:35; Act_1:7, Act_17:26; Gal_4:2; 2Th_2:6-8", "note": "", "refs": [{"l": "Jer 27:7", "n": "", "vs": [[7, "فتستعبد له وَلابنه ولحفيده جميع أمم الأرض، إلى أن يحين موعد استعباد أرضه، عندئذ تستعبده أمم كثيرة وملوك عظماء."]]}, {"l": "Dan 8:19", "n": "", "vs": [[19, "وقال: «ها أنا أطلعك على ما سيحدث في آخر حقبة الغضب، لأن الرويا ترتبط بميعاد الانتهاء."]]}, {"l": "Dan 9:24-27", "n": "", "vs": [[24, "قد صدر القضاء أن يمضي سبعون أسبوعا على شعبك وعلى مدينة قدسك، للانتهاء من المعصية والقضاء على الخطيئة، وللتكفير عن الإثم، ولإشاعة البر الأبدي وختم الرؤيا والنبوءة ولمسح قدوس القدوسين."], [25, "لهذا فاعلم وافهم أن الحقبة الممتدة منذ صدور الأمر بإعادة بناء أورشليم إلى مجيء المسيح، سبعة أسابيع، ثم اثنان وستون أسبوعا يبنى في غضونها سوق وخليج. إنما تكون تلك أزمنة ضيق."], [26, "وبعد اثنين وستين أسبوعا يقتل المسيح، ولكن ليس من أجل نفسه، ويدمر شعب رئيس آت المدينة والقدس، وتقبل آخرتها كطوفان، وتستمر الحرب حتى النهاية، ويعم الخراب المقضي به."], [27, "ويبرم عهدا ثابتا مع كثيرين لمدة أسبوع واحد، ولكنه في وسط الأسبوع يبطل الذبيحة والتقدمة، ويقيم على جناح الهيكل رجاسة الخراب، إلى أن يتم القضاء، فينصب العقاب على المخرب»."]]}, {"l": "Dan 10:1", "n": "", "vs": [[1, "وفي السنة الثالثة لحكم كورش ملك فارس، أعلن وحي لدانيآل المدعو بلطشاصر، والوحي دائما حق. وبعد مكابدة مجهدة، أدرك فحوى الوحي وفهم معنى الرؤيا."]]}, {"l": "Dan 10:14", "n": "", "vs": [[14, "وقد جئت الآن لأطلعك على ما يصيب شعبك في الأيام الأخيرة، لأن الرويا تختص بالأيام المقبلة»."]]}, {"l": "Dan 11:27", "n": "", "vs": [[27, "ويضمر هذان الملكان ارتكاب المكائد، وينطقان بالكذب وهما يجلسان على مائدة واحدة، ولا يفلحان لأن موعد حلول قضاء الله بات وشيكا."]]}, {"l": "Dan 11:35", "n": "", "vs": [[35, "ويعثر بعض الحكماء تمحيصا لهم وتنقية، حتى يأزف وقت النهاية في ميقات الله المعين."]]}, {"l": "Act 1:7", "n": "", "vs": [[7, "فأجابهم: «ليس لكم أن تعرفوا المواعيد والأوقات التي حددها الآب بسلطته."]]}, {"l": "Act 17:26", "n": "", "vs": [[26, "وقد أخرج الشعوب جميعا من أصل واحد، وأسكنهم بلاد الأرض كلها، وحدد مسبقا أزمنة وجودهم وحدود أوطانهم،"]]}, {"l": "Gal 4:2", "n": "", "vs": [[2, "بل يبقى خاضعا للأوصياء والوكلاء إلى أن تنقضي الفترة التي حددها أبوه."]]}, {"l": "2Th 2:6-8", "n": "", "vs": [[6, "وأنتم الآن تعرفون ما الذي يحتجزه حتى لا يظهر إلا في الوقت المعين له."], [7, "فإن التمرد الآن يعمل خفية كأنه سر. ولكن فقط إلى أن يرفع من الوسط ذاك الذي يحتجز المتمرد."], [8, "عندئذ سيظهر الإنسان المتمرد ظهورا جليا فيبيده الرب يسوع بنفخة فمه ويلاشيه ببهاء ظهوره عند عودته."]]}], "kwAr": "الرؤيا", "noteAr": ""}, {"kw": "but", "raw": "Exo_12:41; Psa_102:13; Jer_25:12-14; Heb_10:36", "note": "", "refs": [{"l": "Exo 12:41", "n": "", "vs": [[41, "وفي اليوم الأخير بالذات، في ختام أربع مئة وثلاثين سنة خرج جميع أجناد الرب من أرض مصر."]]}, {"l": "Psa 102:13", "n": "", "vs": [[13, "أنت تقوم وترحم صهيون لأنه قد أزف وقت إظهار رضاك،"]]}, {"l": "Jer 25:12-14", "n": "", "vs": [[12, "وفي ختام السبعين سنة أعاقب ملك بابل وأمته، وأرض الكلدانيين على إثمهم، وأحولها إلى خراب أبدي»، يقول الرب."], [13, "«وأنفذ في تلك الأرض كل القضاء الذي نطقت به عليها، كل ما دون في هذا الكتاب وتنبأ به إرميا على جميع الأمم."], [14, "إذ أن أمما كثيرة وملوكا عظماء يستعبدونهم أيضا، وهكذا أجازيهم بمقتضى أفعالهم وما جنته أيديهم من أعمال أثيمة»."]]}, {"l": "Heb 10:36", "n": "", "vs": [[36, "إنكم تحتاجون إلى الصبر لتعملوا إرادة الله، فتنالوا البركة التي وعدتم بها."]]}], "kwAr": "وتسرع", "noteAr": ""}, {"kw": "wait", "raw": "2Ki_6:33; Psa_27:14, Psa_130:5, Psa_130:6; Isa_30:18; Lam_3:25, Lam_3:26; Mic_7:7; Luk_2:25; Jam_5:7, Jam_5:8", "note": "", "refs": [{"l": "2Ki 6:33", "n": "", "vs": [[33, "وبينما هو يخاطبهم أقبل الرسول إليه، وتبعه الملك الذي قال: «إن هذا الشر قد حل بنا من عند الرب، فأي شيء أتوقع من الرب بعد؟»"]]}, {"l": "Psa 27:14", "n": "", "vs": [[14, "انتظر الرب. تقو وليتشجع قلبك. وانتظر الرب دائما."]]}, {"l": "Psa 130:5", "n": "", "vs": [[5, "انتظرتك يارب. نفسي تنتظرك، وفي كلمتك رجائي."]]}, {"l": "Psa 130:6", "n": "", "vs": [[6, "نفسي تنتظر الرب بلهفة أكثر من لهفة الحراس مترقبي الصبح."]]}, {"l": "Isa 30:18", "n": "", "vs": [[18, "ومع ذلك فإن الرب ينتطر حتى يبدي نحوكم عطفه، لهذا يقوم ليرحمكم، لأن الرب هو إله عدل، فطوبى لجميع الذين ينتظرونه."]]}, {"l": "Lam 3:25", "n": "", "vs": [[25, "الرب صالح لمن يرجونه وللنفس التي تلتمسه."]]}, {"l": "Lam 3:26", "n": "", "vs": [[26, "خير للمرء أن ينتظر بصمت خلاص الرب."]]}, {"l": "Mic 7:7", "n": "", "vs": [[7, "أما أنا فأرتقب الرب وأنتظر إله خلاصي فيسمعني إلهي."]]}, {"l": "Luk 2:25", "n": "", "vs": [[25, "وكان في أورشليم رجل اسمه سمعان، وهو رجل بار تقي ينتظر العزاء لإسرائيل وكان الروح القدس عليه."]]}, {"l": "Jam 5:7", "n": "", "vs": [[7, "وأما أنتم، ياإخوتي، فاصبروا منتظرين عودة الرب. خذوا العبرة من الفلاح: فهو ينتظر أن تعطيه الأرض غلالا ثمينة، صابرا على الزرع حتى يشرب من مطر الخريف ومطر الربيع."]]}, {"l": "Jam 5:8", "n": "", "vs": [[8, "فاصبروا أنتم إذن، وشددوا قلوبكم لأن عودة الرب قد صارت قريبة."]]}], "kwAr": "فانتظرها", "noteAr": ""}, {"kw": "it will surely", "raw": "Luk_18:7, Luk_18:8; 2Pe_2:3", "note": "", "refs": [{"l": "Luk 18:7", "n": "", "vs": [[7, "أفلا ينصف الله مختاريه الذين يصرخون إليه نهارا وليلا؟ أما يسرع في الاستجابة لهم؟"]]}, {"l": "Luk 18:8", "n": "", "vs": [[8, "أقول لكم: إنه ينصفهم سريعا. ولكن، عندما يعود ابن الإنسان، أيجد إيمانا على الأرض؟»"]]}, {"l": "2Pe 2:3", "n": "", "vs": [[3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}], "kwAr": "لابد أن تتحقق", "noteAr": ""}], "arS": [["لأن", ["H3588"]], [" ", []], ["الرؤيا", ["H2377"]], [" لا تتحقق إلا في ", []], ["ميعادها", ["H4150"]], ["، ", []], ["وتسرع", ["H6315"]], [" إلى ", []], ["نهايتها", ["H7093"]], [". إنها ", []], ["لا تكذب", ["H3576", "H3808"]], [" ", []], ["وإن", ["H518"]], [" ", []], ["توانت", ["H4102"]], [" ", []], ["فانتظرها", ["H2442"]], ["، ", []], ["لأنها", ["H3588"]], [" ", []], ["لابد", ["H935", "H935"]], [" أن تتحقق ", []], ["ولن", ["H3808"]], [" ", []], ["تتأخر", ["H309"]], [" طويلا.", []]]}, {"c": 2, "v": 4, "text": "أما الرسالة فهي: إن ذا النفس المنتفخة غير المستقيمة مصيره الهلاك، أما البار فبالإيمان يحيا.", "groups": [{"kw": "his", "raw": "Job_40:11, Job_40:12; Dan_4:30,Dan_4:37, Dan_5:20-23; Luk_18:14; 2Th_2:4; 1Pe_5:5", "note": "", "refs": [{"l": "Job 40:11", "n": "", "vs": [[11, "صب فيض غضبك، وانظر إلى كل متكبر واخفضه."]]}, {"l": "Job 40:12", "n": "", "vs": [[12, "انظر إلى كل متعظم وذلله، ودس الأشرار في مواضعهم."]]}, {"l": "Dan 4:30", "n": "", "vs": [[30, "قال: «أليست هذه هي بابل العظيمة التي بنيتها بقوة اقتداري لتكون عاصمة للمملكة، ولجلال مجدي؟»"]]}, {"l": "Dan 4:37", "n": "", "vs": [[37, "فالآن، أنا نبوخذناصر، أسبح وأمجد وأحمد ملك السماء الذي جميع أعماله حق، وطرقه عادلة وقادر على إذلال كل من يسلك بالكبرياء."]]}, {"l": "Dan 5:20-23", "n": "", "vs": [[20, "وعندما شمخ قلبه وقست روحه تعنتا، عزل عن عرش ملكه وجرد من جلاله،"], [21, "وطرد من بين الناس، وماثل عقله الحيوانات، وصار مأواه مع الحمير الوحشية، فأطعموه العشب كالثيران، وابتل جسمه بندى السماء، حتى علم أن الله العلي هو المتسلط في مملكة الناس، وأنه يولي عليها من يشاء."], [22, "وأنت يابيلشاصر ابنه لم يتواضع قلبك، مع علمك بكل هذا،"], [23, "بل تغطرست على رب السماء، فأحضروا أمامك آنية هيكله لتشرب بها الخمر، أنت ونبَلاء دولتك وزوجاتك ومحظياتك، وسبحت آلهة الفضة والذهب والنحاس والحديد والخشب والحجر التي لا تبصر ولا تسمع ولا تدرك، أما الله الذي بيده روحك وله كل طرقك، فلم تمجده."]]}, {"l": "Luk 18:14", "n": "", "vs": [[14, "أقول لكم: إن هذا الإنسان نزل إلى بيته مبررا، بعكس الآخر. فإن كل من يرفع نفسه يوضع؛ ومن يضع نفسه يرفع»."]]}, {"l": "2Th 2:4", "n": "", "vs": [[4, "الذي يتحدى كل ما يدعى إلها أو معبودا، ويعاديه مترفعا عليه. بل إنه أيضا يتخذ من هيكل الله مقرا له، محاولا أن يبرهن أنه إله."]]}, {"l": "1Pe 5:5", "n": "", "vs": [[5, "كذلك، أيها الشباب، اخضعوا للشيوخ. البسوا جميعا ثوب التواضع في معاملتكم بعضكم لبعض. لأن الله يقاوم المتكبرين، ولكنه يعطي المتواضعين نعمة."]]}], "kwAr": "ذا النفس", "noteAr": ""}, {"kw": "but", "raw": "Joh_3:36; Rom_1:17; Gal_2:16, Gal_3:11, Gal_3:12; Heb_10:38; 1Jo_5:10-12", "note": "", "refs": [{"l": "Joh 3:36", "n": "", "vs": [[36, "من يؤمن بالابن، فله الحياة الأبدية. ومن يرفض أن يؤمن بالابن، فلن يرى الحياة. بل يستقر عليه غضب الله»."]]}, {"l": "Rom 1:17", "n": "", "vs": [[17, "ففيه قد أعلن البر الذي يمنحه الله على أساس الإيمان والذي يؤدي إلى الإيمان، على حد ما قد كتب: «أما من تبرر بالإيمان، فبالإيمان يحيا»."]]}, {"l": "Gal 2:16", "n": "", "vs": [[16, "ولكننا، إذ علمنا أن الإنسان لا يتبرر على أساس الأعمال المطلوبة في الشريعة بل فقط بالإيمان بيسوع المسيح، آمنا نحن أيضا بالمسيح يسوع، لنتبرر على أساس الإيمان به، لا على أساس أعمال الشريعة، لأنه على أعمال الشريعة لا يبرر أي إنسان."]]}, {"l": "Gal 3:11", "n": "", "vs": [[11, "أما أن أحدا لا يتبر ر عند الله بفضل الشريعة، فذلك واضح، لأن «من تبرر بالإيمان فبالإيمان يحيا»."]]}, {"l": "Gal 3:12", "n": "", "vs": [[12, "ولكن الشريعة لا تراعي مبدأ الإيمان، بل «من عمل بهذه الوصايا، يحيا بها»."]]}, {"l": "Heb 10:38", "n": "", "vs": [[38, "وأما من تبرر بالإيمان، فبالإيمان يحيا. ومن ارتد لا تسر به نفسي!"]]}, {"l": "1Jo 5:10-12", "n": "", "vs": [[10, "فمن يؤمن بابن الله، يثق في قلبه بصحة هذه الشهادة. أما من لا يصدق الله ، إذ يرفض تصديق الشهادة التي شهد بها لابنه، فهو يتهم الله بالكذب."], [11, "وهذه الشهادة هي أن الله أعطانا حياة أبدية، وأن هذه الحياة هي في ابنه."], [12, "فمن كان له ابن الله كانت له الحياة. ومن لم يكن له ابن الله، لم تكن له الحياة!"]]}], "kwAr": "أما البار", "noteAr": ""}], "arS": [["أما الرسالة فهي: إن ذا ", []], ["النفس", ["H5315"]], [" ", []], ["المنتفخة", ["H6075"]], [" ", []], ["غير", ["H3808"]], [" ", []], ["المستقيمة", ["H3474"]], [" مصيره الهلاك، أما ", []], ["البار", ["H6662"]], [" ", []], ["فبالإيمان", ["H530"]], [" ", []], ["يحيا", ["H2421"]], [".", []]]}, {"c": 2, "v": 5, "text": "وكما أن الخمر غادرة، كذلك تأخذ المغتر نشوة الانتصار فلا يستكين، فإن جشعه في سعة الهاوية، وهو كالموت لا يشبع. لهذا يجمع لنفسه كل الأمم ويسبي جميع الشعوب.", "groups": [{"kw": "Yea also", "raw": "or, How much more", "note": "or, How much more", "refs": [], "kwAr": "وكما أن الخمر", "noteAr": "أو: «فكم بالحري»."}, {"kw": "he transgresseth", "raw": "Pro_20:1, Pro_23:29-33, Pro_31:4, Pro_31:5; Isa_5:11, Isa_5:12, Isa_5:22, Isa_5:23, Isa_21:5; Jer_51:39; Dan_5:1-4, Dan_5:23; Nah_1:9, Nah_1:10", "note": "", "refs": [{"l": "Pro 20:1", "n": "", "vs": [[1, "الخمر مستهزئة، والمسكر صخاب، ومن يدمن عليها فليس بحكيم."]]}, {"l": "Pro 23:29-33", "n": "", "vs": [[29, "لمن المعاناة؟ لمن الويل والشقاء والمخاصمات والشكوى؟ لمن الجر اح بلا سبب؟ ولمن احمرار العينين؟"], [30, "إنها للمدمنين الخمر، الساعين وراء المسكر الممزوج."], [31, "لا تنظر إلى الخمر إذا التهبت بالاحمرار، وتألقت في الكأس، وسالت سائغة،"], [32, "فإنها في آخرها تلسع كالحية وتلدغ كالأفعوان."], [33, "فتشاهد عيناك أمورا غريبة، وقلبك يحدثك بأشياء ملتوية،"]]}, {"l": "Pro 31:4", "n": "", "vs": [[4, "ليس للملوك يالموئيل، ليس للملوك أن يدمنوا الخمر، ولا للعظماء أن يجرعوا المسكر."]]}, {"l": "Pro 31:5", "n": "", "vs": [[5, "لئلا يسكروا فينسوا الشريعة، ويجوروا على حقوق البائسين."]]}, {"l": "Isa 5:11", "n": "", "vs": [[11, "ويل لمن ينهضون في الصباح مبكرين يسعون وراء المسكر حتى ساعة متأخرة من الليل إلى أن تلهبهم الخمر."]]}, {"l": "Isa 5:12", "n": "", "vs": [[12, "يتلهون في مآدبهم بالعود والرباب والدف والناي والخمر، غير مكترثين لأعمال الرب ولا ناظرين إلى صنع يديه،"]]}, {"l": "Isa 5:22", "n": "", "vs": [[22, "ويل للعتاة في شرب الخمر والمتفوقين في مزج المسكر،"]]}, {"l": "Isa 5:23", "n": "", "vs": [[23, "الذين يبرئون المذنب بفضل الرشوة، وينكرون على البريء حقه."]]}, {"l": "Isa 21:5", "n": "", "vs": [[5, "أعدوا مائدة وفرشوا السجاجيد، أكلوا وشربوا، فانهضوا يا أمراء، وادهنوا بالزيت تروسكم."]]}, {"l": "Jer 51:39", "n": "", "vs": [[39, "عند شبعهم أعد لهم مأدبة وأسكرهم حتى تأخذهم النشوة فينامون نوما أبديا لا يقظة منه، يقول الرب."]]}, {"l": "Dan 5:1-4", "n": "", "vs": [[1, "وأقام بيلشاصر الملك مأدبة عظيمة لنبلاء دولته الألف، وشرب خمرا أمامهم."], [2, "وفيما كان يحتسي الخمر أمر بإحضار آنية الذهب والفضة التي استولى عليها أبوه نبوخذناصر من هيكل أورشليم، ليشرب بها مع نبلاء مملكته وزوجاته ومحظياته."], [3, "فأحضروها وشرب بها الملك ونبلاء مملكته وزوجاته ومحظياته"], [4, "وأخذوا يسبحون آلهة الذهب والفضة والنحاس والحديد والخشب والحجر."]]}, {"l": "Dan 5:23", "n": "", "vs": [[23, "بل تغطرست على رب السماء، فأحضروا أمامك آنية هيكله لتشرب بها الخمر، أنت ونبَلاء دولتك وزوجاتك ومحظياتك، وسبحت آلهة الفضة والذهب والنحاس والحديد والخشب والحجر التي لا تبصر ولا تسمع ولا تدرك، أما الله الذي بيده روحك وله كل طرقك، فلم تمجده."]]}, {"l": "Nah 1:9", "n": "", "vs": [[9, "لماذا تتآمرون على الرب؟ إنه يقضي على مؤامرتكم، ويفنيكم بضربة واحدة."]]}, {"l": "Nah 1:10", "n": "", "vs": [[10, "وتلتهمهم النار كما تلتهم شجرة عليق كثيفة أو سكارى مترنحين من خمرهم أو حزمة قش جافة."]]}], "kwAr": "غادرة", "noteAr": ""}, {"kw": "a proud man", "raw": "Hab_2:4; Psa_138:6; Pro_30:13, Pro_30:14; Isa_2:11, Isa_2:12, Isa_2:17, Isa_16:6; Jer_50:29; Dan_5:20-23; Jam_4:6", "note": "", "refs": [{"l": "Hab 2:4", "n": "", "vs": [[4, "أما الرسالة فهي: إن ذا النفس المنتفخة غير المستقيمة مصيره الهلاك، أما البار فبالإيمان يحيا."]]}, {"l": "Psa 138:6", "n": "", "vs": [[6, "فمع تعاليك، تلتفت إلى المتواضعين، أما المتكبر فتعرفه من بعيد."]]}, {"l": "Pro 30:13", "n": "", "vs": [[13, "رب جيل: لشد ما هو متشامخ العيون ومتعالي النظرات."]]}, {"l": "Pro 30:14", "n": "", "vs": [[14, "رب جيل أسنانه مرهفة كالسيوف، وأنيابه حادة كالسكاكين، ليفترس المساكين في الأرض والبائسين من بين أبناء البشر."]]}, {"l": "Isa 2:11", "n": "", "vs": [[11, "فعيون البشر المتشامخة تخفض، وكبرياؤهم تذل، ويتعظم الرب وحده في ذلك اليوم."]]}, {"l": "Isa 2:12", "n": "", "vs": [[12, "فإن للرب القدير يوما فيه يوضع كل متعظم ومتكبر ومتغطرس."]]}, {"l": "Isa 2:17", "n": "", "vs": [[17, "فيعتري الهوان غطرسة كل إنسان، ويذل تشامخ البشر، ويتعظم الرب وحده في ذلك اليوم،"]]}, {"l": "Isa 16:6", "n": "", "vs": [[6, "قد سمعنا بكبرياء موآب، وبعجرفتها وغطرستها الطاغيتين، وبغرورها وصلفها، ولكن كل افتخارها باطل."]]}, {"l": "Jer 50:29", "n": "", "vs": [[29, "استدعوا إلى بابل رماة السهام، جميع موتري القسي. عسكروا حولها فلا يفلت منها أحد. جازوها بمقتضى أعمالها، واصنعوا بها كما صنعت بكم، لأنها بغت على الرب قدوس إسرائيل."]]}, {"l": "Dan 5:20-23", "n": "", "vs": [[20, "وعندما شمخ قلبه وقست روحه تعنتا، عزل عن عرش ملكه وجرد من جلاله،"], [21, "وطرد من بين الناس، وماثل عقله الحيوانات، وصار مأواه مع الحمير الوحشية، فأطعموه العشب كالثيران، وابتل جسمه بندى السماء، حتى علم أن الله العلي هو المتسلط في مملكة الناس، وأنه يولي عليها من يشاء."], [22, "وأنت يابيلشاصر ابنه لم يتواضع قلبك، مع علمك بكل هذا،"], [23, "بل تغطرست على رب السماء، فأحضروا أمامك آنية هيكله لتشرب بها الخمر، أنت ونبَلاء دولتك وزوجاتك ومحظياتك، وسبحت آلهة الفضة والذهب والنحاس والحديد والخشب والحجر التي لا تبصر ولا تسمع ولا تدرك، أما الله الذي بيده روحك وله كل طرقك، فلم تمجده."]]}, {"l": "Jam 4:6", "n": "", "vs": [[6, "لا، بل إنه يجود علينا بنعمة أعظم. لذلك يقول الكتاب: «إن الله يقاوم المتكبرين، ولكنه يعطي المتواضعين نعمة»."]]}], "kwAr": "المغتر", "noteAr": ""}, {"kw": "keepeth", "raw": "2Ki_14:10; 1Th_4:11 *Gr.", "note": "", "refs": [{"l": "2Ki 14:10", "n": "", "vs": [[10, "لقد هزمت الأدوميين فانتابك الغرور، ولكن خير لك أن تمكث في قصرك وتتمتع بمجد انتصارك. فلماذا تسعى إلى الشر فتجلب الدمار عليك وعلى يهوذا؟»"]]}, {"l": "1Th 4:11", "n": "*Gr.", "vs": [[11, "وأن تسعوا بجد إلى العيش بهدوء، مهتمين بممارسة شؤونكم الخاصة، ومحصلين معيشتكم بعمل أيديكم، كما أوصيناكم."]]}], "kwAr": "فلا يستكين", "noteAr": ""}, {"kw": "who", "raw": "Isa_5:8, Isa_10:7-13", "note": "", "refs": [{"l": "Isa 5:8", "n": "", "vs": [[8, "اشتريتم البيوت والحقول حتى لم يبق لأحد غيركم مكان يسكن فيه! صارت الأرض لكم وحدكم!"]]}, {"l": "Isa 10:7-13", "n": "", "vs": [[7, "ولكن ملك أشور لا يعرف أنني أنا الذي أرسلته، ويظن أنه بقدرته قد هاجم شعبي، وفي نيته أن يدمر ويجتاح أمما كثيرة."], [8, "لأنه يقول: أليس كل قوادي ملوكا؟"], [9, "أليس مصير كلنو كمصير كركميش؟ أو ليس مآل حماة كمآل أرفاد؟ أليست السامرة كدمشق؟"], [10, "لقد قضيت على ممالك وثنية أصنامها أعظم من أصنام أورشليم والسامرة!"], [11, "أفلا أقضي على أورشليم وأصنامها كما قضيت على السامرة وأصنامها؟"], [12, "ولكن حالما ينتهي الرب من عمله بجبل صهيون، فإنه سيعاقب ملك أشور على غرور قلبه وتشامخ عينيه،"], [13, "لأنه يقول: بقوة ذراعي قد صنعت هذا، وبحكمتي، لأنني فهيم! قد نقلت تخوم الأمم، ونهبت كنوزهم، وعزلت الجالسين على العروش كما يفعل ذو البطش."]]}], "kwAr": "فإن جشعه", "noteAr": ""}, {"kw": "as hell", "raw": "Pro_27:20, Pro_30:15, Pro_30:16; Ecc_5:10", "note": "", "refs": [{"l": "Pro 27:20", "n": "", "vs": [[20, "كما أن الهاوية والهلاك لا يشبعان، هكذا لا تشبع عينا الإنسان."]]}, {"l": "Pro 30:15", "n": "", "vs": [[15, "للعلقة بنتان هاتفتان: هات، هات. ثلاثة أشياء لا تشبع قط، والرابعة لا تقول كفى:"]]}, {"l": "Pro 30:16", "n": "", "vs": [[16, "الهاوية، والرحم العقيم، وأرض لا ترتوي من الماء، والنار التي لا تقول أبدا كفى."]]}, {"l": "Ecc 5:10", "n": "", "vs": [[10, "من يحب الفضة لا يشبع منها، والمولع بالغنى لا يشبع من ربح. وهذا أيضا باطل."]]}], "kwAr": "الهاوية", "noteAr": ""}, {"kw": "gathereth", "raw": "Hab_2:8-10; Isa_14:16, Isa_14:17; Jer_25:9, Jer_25:17-29", "note": "", "refs": [{"l": "Hab 2:8-10", "n": "", "vs": [[8, "لأنك سلبت أمما كثيرة فإن بقية الشعوب ينهبونك ثأرا لما سفكت من دماء وارتكبت من جور في الأرض، فدمرت مدنا وأهلكت الساكنين فيها."], [9, "ويل لمن يدخر لبنيه مكسب ظلم، ويشيد مسكنه في مقام حصين ليكون في مأمن من الخطر."], [10, "لقد لطخت مؤامرتك بيتك بالعار حين استأصلت أمما عديدة وجلبت الدمار على نفسك."]]}, {"l": "Isa 14:16", "n": "", "vs": [[16, "والذين يرونك يحملقون فيك ويتأملون متسائلين: أهذا هو الإنسان الذي زعزع الأرض وهز الممالك؟"]]}, {"l": "Isa 14:17", "n": "", "vs": [[17, "الذي حول المسكونة إلى مثل القفر، وقلب مدنها، ولم يطلق أسراه ليرجعوا إلى بيوتهم؟"]]}, {"l": "Jer 25:9", "n": "", "vs": [[9, "فها أنا أجند جميع قبائل الشمال بقيادة نبوخذناصر عبدي، وآتي بها إلى هذه الأرض فيجتاحونها ويهلكون جميع سكانها مع سائر الأمم المحيطة بها، وأجعلهم مثار دهشة وصفير، وخرائب أبدية."]]}, {"l": "Jer 25:17-29", "n": "", "vs": [[17, "فتناولت الكأس من يد الرب وسقيت منها جميع الأمم التي بعثني إليها الرب:"], [18, "أورشليم ومدن يهوذا وملوكها وعظماءها، لأجعلها قفرا خرابا ومثار صفير ولعنة إلى هذا اليوم."], [19, "وسقيت منها كذلك فرعون ملك مصر وخدامه وعظماءه وكل شعبه،"], [20, "وكل الغرباء المقيمين في وسطهم، وجميع ملوك أرض عوص، وسائر ملوك الفلسطينيين: ملوك أشقلون، وغزة، وعقرون وبقية أشدود،"], [21, "وآدوم، وموآب، وبني عمون،"], [22, "وكل ملوك صور وصيدون وملوك الجزائر عبر البحر،"], [23, "وددان وتيماء وبوز، وكل ذوي الشعر المقصوص الزوايا،"], [24, "وكل ملوك العرب، وسائر ملوك القبائل المنضمة إليهم المقيمين في الصحراء،"], [25, "وكل ملوك زمري، وعيلام، وجميع ملوك مادي."], [26, "وكل ملوك الشمال، القريبين والبعيدين، الواحد تلو الآخر، وكل الممالك المنتشرة على وجه الأرض. ثم بعد ذلك يشرب منها ملك بابل."], [27, "ثم قل لهم، هذا ما يعلنه الرب القدير إله إسر ائيل: اشربوا واثملوا وتقيأوا واسقطوا صرعى، ولا تقوموا من جراء السيف الذي أرسله في وسطكم."], [28, "وإن أبوا أن يتناولوا الكأس من يدك ليشربوا منها، فقل لهم: هذا ما يعلنه الرب القدير: لابد لكم من شربها،"], [29, "لأني شرعت أعاقب المدينة التي دعي اسمي عليها، فهل تفلتون أنتم من العقاب؟ فها أنا قد سلطت السيف على جميع سكان الأرض، يقول الرب القدير."]]}], "kwAr": "يجمع لنفسه", "noteAr": ""}], "arS": [["وكما", ["H637", "H3588"]], [" أن ", []], ["الخمر", ["H3196"]], [" ", []], ["غادرة", ["H898"]], ["، كذلك تأخذ ", []], ["المغتر", ["H3093", "H1397"]], [" نشوة الانتصار ", []], ["فلا", ["H3808"]], [" ", []], ["يستكين", ["H5115"]], ["، فإن ", []], ["جشعه", ["H5315"]], [" في ", []], ["سعة", ["H7337"]], [" ", []], ["الهاوية", ["H7585"]], ["، وهو ", []], ["كالموت", ["H4194"]], [" ", []], ["لا", ["H3808"]], [" ", []], ["يشبع", ["H7646"]], [". لهذا ", []], ["يجمع", ["H622"]], [" لنفسه ", []], ["كل", ["H3605"]], [" ", []], ["الأمم", ["H1471"]], [" ", []], ["ويسبي", ["H6908"]], [" ", []], ["جميع", ["H3605"]], [" ", []], ["الشعوب", ["H5971"]], [".", []]]}, {"c": 2, "v": 6, "text": "ولكن لا يلبث أن يسخر منه سباياه قائلين: «ويل لمن يكوم لنفسه الأسلاب، ويثرى على حساب ما نهب. إنما إلى متى؟", "groups": [{"kw": "take", "raw": "Num_23:7, Num_23:18; Isa. 14:4-19; Jer_29:22, Jer_50:13; Eze_32:21; Mic_2:4", "note": "", "refs": [{"l": "Num 23:7", "n": "", "vs": [[7, "فنطق بنبوءته قائلا: «أتى بي بالاق ملك موآب من بلاد أرام من الجبال الشرقية، وقال: تعال العن لي يعقوب، واشتم لي إسرائيل."]]}, {"l": "Num 23:18", "n": "", "vs": [[18, "فضرب مثله قائلا: «انهض يابالاق واصغ، استمع إلي ياابن صفور"]]}, {"l": "Isa 14:4-19", "n": "", "vs": [[4, "فتسخرون من ملك بابل قائلين: كيف استكان الظالم، وكيف خمدت غضبته المتعجرفة؟"], [5, "قد حطم الرب عصا المنافق وصولجان المتسلطين،"], [6, "الذين انهالوا على الناس ضربا بسخط لا يتوقف؛ الذين تسلطوا على الأمم بغضب واضطهاد شديد."], [7, "فاستراحت الأرض كلها وسادها الهدوء، فتغنت شعوبها ترنما."], [8, "حتى شجر السرو وأرز لبنان عمها الفرح فقالت: «منذ أن انكسرت شوكتك لم يصعد إلينا قاطع حطب»"], [9, "ثارت الهاوية من أسفل لاَستقبالك عند قدومك وحشدت الأخيلة، من كل العظماء، لتحيتك؛ أنهضت كل ملوك الأمم عن عروشهم"], [10, "كلهم يخاطبونك قائلين: لقد صرت ضعيفا مثلنا، أصبحت مماثلا لنا!"], [11, "طرحت كل عظمتك في الهاوية مع رنة عيدانك، وأصبحت الرمم فراشك والدود غطاء لك!"], [12, "كيف هويت من السماء يازهرة بنت الصبح؟ كيف قطعت وطرحت إلى الأرض ياقاهر الأمم؟"], [13, "قد قلت في قلبك: إني أرتقي إلى السماء وأرفع عرشي فوق كواكب الله، وأجلس على جبل الاجتماع في أقصى الشمال"], [14, "أرتقي فوق أعالي السحاب، وأصبح مثل العلي."], [15, "ولكنك طرحت إلى الهاوية، إلى أعماق الجب."], [16, "والذين يرونك يحملقون فيك ويتأملون متسائلين: أهذا هو الإنسان الذي زعزع الأرض وهز الممالك؟"], [17, "الذي حول المسكونة إلى مثل القفر، وقلب مدنها، ولم يطلق أسراه ليرجعوا إلى بيوتهم؟"], [18, "لقد رقد كل ملوك الأمم بكرامة، كل في ضريحه،"], [19, "أما أنت فقد طرحت بعيدا عن قبرك كغصن مكسور تغطيك رمم قتلى المعارك الذين انحدروا إلى مقر الموتى، وصرت كجنة داستها حوافر الخيل"]]}, {"l": "Jer 29:22", "n": "", "vs": [[22, "فيصبحان مثل لعنة بين جميع المسبيين من يهوذا في بابل، فيقال: ليجعلك الله نظير صدقيا وأخآب اللذين قلاهما ملك بابل بالنار،"]]}, {"l": "Jer 50:13", "n": "", "vs": [[13, "وتظل بأسرها مهجورة وخربة، كل من يمر ببابل يصيبه الذعر ويصفر دهشة لما ابتليت به من نكبات، لأنها أثارت غضب الرب."]]}, {"l": "Eze 32:21", "n": "", "vs": [[21, "يخاطبه صناديد الجبابر ة هو وأعوانه من وسط مقر الموتى. قد هبطوا واضطجعوا. جميعهم غلف قتلى السيف."]]}, {"l": "Mic 2:4", "n": "", "vs": [[4, "في ذلك اليوم يسخر أعداؤكم منكم، وتنوحون بمثل هذا الرثاء: «قد تم تدميرنا واستبدل الرب نصيب شعبه. كيف أخذه منا وقسم حقولنا بين آسرينا؟»"]]}], "kwAr": "يسخر منه", "noteAr": ""}, {"kw": "Woe to him", "raw": "or, Ho, he", "note": "or, Ho, he", "refs": [], "kwAr": "ويل لمن", "noteAr": "أو: «هوذا»."}, {"kw": "that increaseth", "raw": "Hab_1:9, Hab_1:10,Hab_1:15; Job_20:15-29, Job_22:6-10; Pro_22:16; Jer_51:34, Jer_51:35; Jam_5:1-4", "note": "", "refs": [{"l": "Hab 1:9", "n": "", "vs": [[9, "يقبلون جميعهم ليعيثوا فسادا، ويطغى الرعب منهم على قلوب الناس قبل وصولهم، فيجمعون أسرى كالرمل."]]}, {"l": "Hab 1:10", "n": "", "vs": [[10, "يهزأون بالملوك ويعبثون بالحكام. يسخرون من الحصون، يكومون حولها تلالا من التراب، ويستولون عليها."]]}, {"l": "Hab 1:15", "n": "", "vs": [[15, "إن الكلدانيين يستخرجونهم بالشصوص، ويصطادونهم بالشبكة، ويجمعونهم في مصيدتهم متهللين فرحين."]]}, {"l": "Job 20:15-29", "n": "", "vs": [[15, "ويتقيأ ما ابتلعه من أموال، ويستخرجها الله من جوفه."], [16, "لقد رضع سم الصل، فقتله لسان الأفعى."], [17, "لن تكتحل عيناه بمرأى الأنهار الجارية، ولا بالجداول الفياضة بالعسل والزبد."], [18, "يرد ثمار تعبه ولا يبلعه ولا يستمتع بكسب تجارته."], [19, "لأنه هضم حق الفقراء وخذلهم وسلب بيوتا لم يبنها."], [20, "وإذ لا يعرف طمعه قناعة، فإنه لن يدخر شيئا يستمتع به."], [21, "لم يبق نهمه على شيء، لذلك لن يدوم خيره."], [22, "في وفرة سعته يصيبه الضنك، وتحل به أقسى الكوارث."], [23, "وعندما يملأ بطنه ينفث عليه الله غضبه الحارق ويمطره عليه طعاما له."], [24, "إن فر من آلة حرب من حديد، تخترقه قوس النحاس."], [25, "اخترقته عميقا وخرجت من جسده، ونفذ حدها اللامع من مرارته، وحل به رعب."], [26, "كل ظلمة تتربص بذخائره، وتأكله نار لم تنفخ، وتلتهم ما بقي من خيمته."], [27, "تفضح السماوات إثمه، وتتمرد الأرض عليه،"], [28, "تفنى مدخرات بيته وتحترق في يوم غضب الرب."], [29, "هذا هو المصير الذي يعده الله للأشرار، والميراث الذي كتبه الله لهم»."]]}, {"l": "Job 22:6-10", "n": "", "vs": [[6, "لقد ارتهنت أخاك بغير حق، وجردت العراة من ثيابهم."], [7, "لم تسق المعيي ماء، ومنعت عن الجائع طعامك."], [8, "صاحب القوة استحوذ على الأرض، وذو الحظوة أقام فيها."], [9, "أرسلت الأرامل فارغات وحطمت أذرع اليتامى،"], [10, "لذلك أحدقت بك الفخاخ وطغى عليك رعب مفاجيء."]]}, {"l": "Pro 22:16", "n": "", "vs": [[16, "من يجور على الفقير ليثرى ظلما، ومن يهدي الغني (على حساب الفقير) يؤول به الأمر إلى الفاقة."]]}, {"l": "Jer 51:34", "n": "", "vs": [[34, "«يقول المسبيون: قد افترسنا نبوخذناصر ملك بابل وسحقنا وجعلنا إناء فارغا. ابتلعنا كتنين، وملأ جوفه من أطايبنا، ثم لفظنا من فمه."]]}, {"l": "Jer 51:35", "n": "", "vs": [[35, "يقول أهل أورشليم: ليحل ببابل ما أصابنا وأصاب لحومنا من ظلم. وتقول أورشليم: دمي على أهل أرض الكلدانيين."]]}, {"l": "Jam 5:1-4", "n": "", "vs": [[1, "أيها الأغنياء، هيا الآن ابكوا مولولين بسبب ما ينتظركم من أهوال وشقاء."], [2, "إن ثرواتكم الكثيرة قد فسدت، وثيابكم الفاخرة قد أكلها العث"], [3, "ذهبكم وفضتكم قد تآكلا، وسيكون تآكلهما شاهدا ضدكم، ويأكل لحمكم كنار جمعتموها ثروة للأيام الأخيرة؟"], [4, "وهذه أجرة العمال الذين حصدوا حقولكم، تلك الأجرة التي مازلتم تحبسونها عنهم ظلما، إنها تصرخ، وصراخ أولئك العمال أنفسهم قد سمعه رب الجنود!"]]}], "kwAr": "يكوم لنفسه", "noteAr": ""}, {"kw": "how", "raw": "Psa_94:3; Luk_12:20; 1Co_7:29-31; 1Pe_4:7", "note": "", "refs": [{"l": "Psa 94:3", "n": "", "vs": [[3, "إلى متى يارب يشمت الأشرار فرحين؟"]]}, {"l": "Luk 12:20", "n": "", "vs": [[20, "ولكن الله قال له: ياغبي، هذه الليلة تطلب نفسك منك، فلمن يبقى ما أعددته؟"]]}, {"l": "1Co 7:29-31", "n": "", "vs": [[29, "فإني، أيها الإخوة، أقول لكم إن الوقت يتقاصر. ففي ما يخص المسائل الأخرى، ليكن الذين لهم زوجات كأنهم بلا زوجات،"], [30, "والذين يبكون كأنهم لا يبكون، والذين يفرحون كأنهم لا يفرحون، والذين يشترون كأنهم لا يملكون،"], [31, "والذين يستغلون هذا العالم كأنهم لا يستغلونه. ذلك لأن طراز هذا العالم زائل."]]}, {"l": "1Pe 4:7", "n": "", "vs": [[7, "إن نهاية كل شيء قد صارت قريبة. فتعقلوا إذن، وكونوا متنبهين لرفع الصلاة دائما."]]}], "kwAr": "إلى متى", "noteAr": ""}, {"kw": "ladeth", "raw": "Hab_2:13; Isa_44:20, Isa_55:2", "note": "", "refs": [{"l": "Hab 2:13", "n": "", "vs": [[13, "ألم يصدر القضاء من عند الرب القدير أن يؤول تعب الشعوب إلى النار وجهد الأمم إلى الباطل؟"]]}, {"l": "Isa 44:20", "n": "", "vs": [[20, "لكأنه يأكل الرماد! يجري وراء سراب ويعجز عن إنقاذ نفسه أو الاعتراف أن الصنم الذي يمسكه بيده هو محض ضلال!"]]}, {"l": "Isa 55:2", "n": "", "vs": [[2, "لماذا تنفقون الفضة على ما ليس بخبز، وتتعبون لغير شبع؟ أحسنوا الاستماع إلي، وكلوا الشهي ولتتمتع أنفسكم بالدسم."]]}], "kwAr": "ويثرى", "noteAr": ""}], "arS": [["ولكن لا يلبث أن ", []], ["يسخر", ["H5375"]], [" منه سباياه ", []], ["قائلين", ["H559"]], [": «", []], ["ويل", ["H1945"]], [" لمن ", []], ["يكوم", ["H7235"]], [" لنفسه ", []], ["الأسلاب", ["H5671"]], ["، ", []], ["ويثرى", ["H3513", "H5921"]], [" على حساب ما نهب. إنما إلى ", []], ["متى", ["H5704", "H4970"]], ["؟", []]]}, {"c": 2, "v": 7, "text": "ألا يقوم عليك دائنوك بغتة، أو لا يثورون عليك ويملأونك رعبا، فتصبح لهم غنيمة؟", "groups": [{"kw": "they", "raw": "Pro_29:1; Isa_13:1-5, Isa_13:16-18, Isa_21:2-9, Isa_41:25, Isa_45:1-3, Isa_46:11, Isa_47:11; Isa_48:14, Isa_48:15; Jer_50:21-32, Jer_51:11, Jer_51:27, Jer_51:28, Jer_51:57; Dan_5:25-31; Nah_1:9, Nah_1:10; 1Th_5:3", "note": "", "refs": [{"l": "Pro 29:1", "n": "", "vs": [[1, "من كثر توبيخه وظل معتصما بعناده، يتحطم فجأة ولا شفاء له."]]}, {"l": "Isa 13:1-5", "n": "", "vs": [[1, "رؤيا إشعياء بن آموص بشأن بابل:"], [2, "انصبوا راية فوق جبل أجرد. اصرخوا فيهم لوحوا بأيديكم حتى يدخلوا أبواب العظماء."], [3, "إني أمرت مقدسي واستدعيت جبابرتي المفتخرين بعظمتي لينفذوا عقاب غضبي."], [4, "ها جلبة على الجبال مثل صوت أقوام غفيرة. صوت صخب ممالك أمم مجتمعة، لأن الرب القدير يستعرض جنود القتال."], [5, "يقبلون من أرض نائية، من أقصى السماوات هم جنود الرب وأسلحة سخطه لتدمير الأرض كلها."]]}, {"l": "Isa 13:16-18", "n": "", "vs": [[16, "ويمزق أطفالهم على مرأى منهم، وتنهب بيوتهم، وتغتصب نساؤهم."], [17, "ها أنا أثير عليهم الماديين الذين لا يكترثون للفضة ولا يسرون بالذهب،"], [18, "تمزق قسيهم الفتيان ولا يرحمون الأولاد أو الرضع."]]}, {"l": "Isa 21:2-9", "n": "", "vs": [[2, "لقد أعلنت لي رؤيا رهيبة: رأيت الناهب ينهب، والمدمر يدمر. فاصعدي يا عيلام، وحاصري يا مادي، لأنني سأسكت كل الأنين الذي سببته."], [3, "لذلك امتلأت حقواى ألما، وانتابني مخاض كمخاض الوالدة. فقدت الوعي من جراء ما سمعت، وذهلت مما رأيت"], [4, "تحير قلبي، وأرعبني الفزع، فتحول ليلي الذي كنت أتوق إليه إلى رعدة."], [5, "أعدوا مائدة وفرشوا السجاجيد، أكلوا وشربوا، فانهضوا يا أمراء، وادهنوا بالزيت تروسكم."], [6, "لأنه هكذا قال الرب لي: اذهب وأقم رقيبا ليعلن ما يراه."], [7, "وعندما يشاهد راكبين فرسانا أزواجا أزواجا، أو راكبين على حمير، وراكبين على جمال، فليصغ إصغاء شديدا."], [8, "ثم هتف الرقيب: ها أنا أقف على برج المراقبة يوما بعد يوم أيها الرب، وأقوم على المحرس طوال الليل."], [9, "فها ركب قادم، فرسان أزواج أزواج. فأجاب: سقطت سقطت بابل وتحطمت سائر أصنامها على الأرض."]]}, {"l": "Isa 41:25", "n": "", "vs": [[25, "قد آثرت رجلا من الشمال، ها هو مقبل من مشرق الشمس يدعو باسمي، يطأ الولاة كما يطأ فوق الوحل، ويدوس عليهم كما يدوس الخزاف فوق الطين."]]}, {"l": "Isa 45:1-3", "n": "", "vs": [[1, "هذا ما يقوله الرب لكورش مختاره، الذي أخذت بيمينه حتى أخضع أمامه أمما وأكسر شوكة ملوك، لأفتح أمامه كوات ولا توصد في وجهه مصاريع."], [2, "ها أنا أتقدمك لأسوي الجبال بالأرض وأحطم أبواب النحاس، وأكسر مغاليق الحديد،"], [3, "وأهبك كنوز الأقبية المظلمة وذخائر المخابيء، لتعرف أني أنا هو الرب إله إسرائيل الذي دعاك باسمك."]]}, {"l": "Isa 46:11", "n": "", "vs": [[11, "أدعو من المشرق الطائر الجارح، ومن الأرض البعيدة رجل مشورتي. قد نطقت بقضائي ولابد أن أجريه، وما رسمته من خطة لابد أن أنفذه."]]}, {"l": "Isa 47:11", "n": "", "vs": [[11, "سيدهمك شر لا تدرين كيف تدفعينه عنك، وتباغتك داهية تعجزين عن التكفير عنها، ويفاجئك خراب لا تتوقعينه."]]}, {"l": "Isa 48:14", "n": "", "vs": [[14, "اجتمعوا كلكم وأنصتوا: من من بين الأصنام أنبأ بهذه؟ إن الرب أحب كورش، وهو ينفذ قضاءه على بابل ويكون ذراعه على الكلدانيين."]]}, {"l": "Isa 48:15", "n": "", "vs": [[15, "لقد دعوت أنا بذاتي (كورش) وعهدت إليه بما أريد، وسأكلل أعماله بالنجاح"]]}, {"l": "Jer 50:21-32", "n": "", "vs": [[21, "ازحف على أرض ميراثايم (ومعناه: المفرط في التمرد)، وعلى المقيمين في فقود (ومعناه: العقاب). خرب، ودمر وراءهم، يقول الرب وافعل كل ما آمرك به."], [22, "قد علت جلبة القتال في الأرض. صوت تحطيم عظيم."], [23, "كيف تكسرت وتحطمت بابل، مطرقة الأرض كلها؟ كيف أصبحت بابل مثار دهشة عند الأمم؟"], [24, "قد نصبت الشرك فوقعت فيه، يابابل، من غير أن تشعري به. قد وجدت وقبض عليك، لأنك خاصمت الرب."], [25, "قد فتح الرب مخزن سلاحه، وأخرج آلات سخطه، لأنه ما برح للسيد الرب القدير عمل ينجزه في ديار الكلدانيين."], [26, "ازحفوا عليها من أقاصي الأرض، وافتحوا أهراءها، وكوموها أعراما واقضوا عليها قاطبة ولا تتركوا منها بقية."], [27, "اذبحوا جميع ثيرانها، أحضروها للذبح. ويل لهم لأن يوم موعد عقابهم قد حان."], [28, "اسمعوا! ها جلبة الفارين الناجين من ديار بابل لكي يذيعوا في صهيون أنباء انتقام الرب إلهنا والثأر لهيكله."], [29, "استدعوا إلى بابل رماة السهام، جميع موتري القسي. عسكروا حولها فلا يفلت منها أحد. جازوها بمقتضى أعمالها، واصنعوا بها كما صنعت بكم، لأنها بغت على الرب قدوس إسرائيل."], [30, "لذلك يصرع شبانها في ساحاتها، ويبيد في ذلك اليوم جميع جنودها، يقول الرب."], [31, "ها أنا أقاومك أيتها المتغطرسة، يقول الرب القدير، لأن يوم إدانتك وتنفيذ العقاب فيك قد حان،"], [32, "فيتعثر المتغطرس ويكبو ولا يوجد من ينهضه، وأضرم نارا في مدنه فتلتهم ما حوله»."]]}, {"l": "Jer 51:11", "n": "", "vs": [[11, "سنوا السهام، وتقلدوا الأتراس، لأن الرب قد أثار روح ملوك الماديين، إذ وطد العزم على إهلاك بابل، لأن هذا هو انتقام الرب، والثأر لهيكله."]]}, {"l": "Jer 51:27", "n": "", "vs": [[27, "انصبوا راية في الأرض. انفخوا في البوق بين الأمم. أثيروا عليها الأمم لقتالها، وألبوا عليها ممالك أراراط ومني وأشكناز. أقيموا عليها قائدا. اجعلوا الخيل تزحف عليها كجحافل الجنادب الشرسة."]]}, {"l": "Jer 51:28", "n": "", "vs": [[28, "أثيروا عليها الأمم وملوك الماديين وكل حكامهم وولاتهم وسائر الديار التي يحكمونها."]]}, {"l": "Jer 51:57", "n": "", "vs": [[57, "إني أسكر رؤساءها وحكماءها ومحاربيها، فينامون نوما أبديا لا يقظة منه، يقول الملك، الرب القدير اسمه."]]}, {"l": "Dan 5:25-31", "n": "", "vs": [[25, "وهي: منا منا تقيل وفرسين"], [26, "وتفسيرها منا: أحصى الله أيام ملكك وأنهاه."], [27, "تقيل: وزنت بالموازين فوجدت ناقصا."], [28, "فرس: شطرت مملكتك وأعطيت لمادي وفارس»."], [29, "حينئذ أمر بيلشاصر أن يخلعوا على دانيآل الأرجوان ويطوقوا عنقه بقلادة من ذهب ويذيعوا في كل أرجاء البلاد أنه أصبح المتسلط الثالث في المملكة."], [30, "في تلك الليلة قتل بيلشاصر ملك الكلدانيين،"], [31, "واستولى داريوس المادي على المملكة وهو في الثانية والستين من عمره."]]}, {"l": "Nah 1:9", "n": "", "vs": [[9, "لماذا تتآمرون على الرب؟ إنه يقضي على مؤامرتكم، ويفنيكم بضربة واحدة."]]}, {"l": "Nah 1:10", "n": "", "vs": [[10, "وتلتهمهم النار كما تلتهم شجرة عليق كثيفة أو سكارى مترنحين من خمرهم أو حزمة قش جافة."]]}, {"l": "1Th 5:3", "n": "", "vs": [[3, "فبينما الناس يقولون: حل السلام والأمن! ينزل بهم الهلاك المفاجيء كالمخاض الذي يدهم الحبلى، فلا يستطيعون أبدا أن يفلتوا."]]}], "kwAr": "يقوم عليك", "noteAr": ""}, {"kw": "bite", "raw": "Ecc_10:8; Jer_8:17", "note": "", "refs": [{"l": "Ecc 10:8", "n": "", "vs": [[8, "كل من يحفر حفرة يقع فيها، ومن ينقض جدارا تلدغه حية."]]}, {"l": "Jer 8:17", "n": "", "vs": [[17, "انظروا، ها أنا أرسل عليكم أفاعي مميتة لا تنجع معها رقى فتلدغكم»، يقول الرب."]]}], "kwAr": "دائنوك", "noteAr": ""}], "arS": [["ألا", ["H3808"]], [" ", []], ["يقوم", ["H6965"]], [" عليك ", []], ["دائنوك", ["H5391"]], [" ", []], ["بغتة", ["H6621"]], ["، أو لا ", []], ["يثورون", ["H3364"]], [" عليك ", []], ["ويملأونك", ["H2111"]], [" رعبا، ", []], ["فتصبح", ["H1961"]], [" لهم ", []], ["غنيمة", ["H4933"]], ["؟", []]]}, {"c": 2, "v": 8, "text": "لأنك سلبت أمما كثيرة فإن بقية الشعوب ينهبونك ثأرا لما سفكت من دماء وارتكبت من جور في الأرض، فدمرت مدنا وأهلكت الساكنين فيها.", "groups": [{"kw": "thou", "raw": "Hab_2:10,Hab_2:17; Isa_33:1, Isa_33:4; Jer_27:7, Jer_30:16, Jer_50:10,Jer_50:37, Jer_51:13, Jer_51:44, Jer_51:48, Jer_51:55, Jer_51:56; Zec_2:8, Zec_2:9", "note": "", "refs": [{"l": "Hab 2:10", "n": "", "vs": [[10, "لقد لطخت مؤامرتك بيتك بالعار حين استأصلت أمما عديدة وجلبت الدمار على نفسك."]]}, {"l": "Hab 2:17", "n": "", "vs": [[17, "لأن ما ارتكبته من ظلم في حق لبنان يغطيك، وما أهلكته من بهائم يروعك. من أجل ما سفكته من دماء واقترفته من جور في الأرض والمدن والساكنين فيها."]]}, {"l": "Isa 33:1", "n": "", "vs": [[1, "ويل لك أيها المدمر الذي لم تدمر بعد، والناهب الذي لم ينهبوك، فعندما تكف عن التدمير تدمر، وحين تمتنع عن النهب ينهبونك."]]}, {"l": "Isa 33:4", "n": "", "vs": [[4, "وكما يلتهم الجراد كل ما هو أخضر، هكذا يجمع سلبكم، ويتواثب الناس عليه كتواثب الجنادب."]]}, {"l": "Jer 27:7", "n": "", "vs": [[7, "فتستعبد له وَلابنه ولحفيده جميع أمم الأرض، إلى أن يحين موعد استعباد أرضه، عندئذ تستعبده أمم كثيرة وملوك عظماء."]]}, {"l": "Jer 30:16", "n": "", "vs": [[16, "ولكن سيأتي يوم يفترس فيه جميع مفترسيك ويذهب جميع مضايقيك إلى السبي، ويصبح ناهبوك منهوبين،"]]}, {"l": "Jer 50:10", "n": "", "vs": [[10, "فتصبح أرض الكلدانيين غنيمة، وكل من يسلبها يتخم، يقول الرب."]]}, {"l": "Jer 50:37", "n": "", "vs": [[37, "ها سيف على خيلها، وعلى مركباتها، وعلى فرق مرتزقتها، فيصيرون كالنساء. ها سيف على كنوزها فتنهب."]]}, {"l": "Jer 51:13", "n": "", "vs": [[13, "أيتها الساكنة إلى جوار المياه الغزيرة، ذات الكنوز الوفيرة، إن نهايتك قد أزفت، وحان موعد اقتلاعك."]]}, {"l": "Jer 51:44", "n": "", "vs": [[44, "وأعاقب الصنم: بيل في بابل، وأستخرج من فمه ما ابتلعه، فتكف الأمم عن التوافد إليه، وينهدم أيضا سور بابل."]]}, {"l": "Jer 51:48", "n": "", "vs": [[48, "عندئذ تتغنى بسقوط بابل السماوات والأرض وكل ما فيها، لأن المدمرين يتقاطرون عليها من الشمال، يقول الرب."]]}, {"l": "Jer 51:55", "n": "", "vs": [[55, "لأن الرب قد خرب بابل، وأخرس جلبتها العظيمة، إذ طغت عليها جحافل أعدائها كمياه عجاجة، وعلا ضجيج أصواتهم."]]}, {"l": "Jer 51:56", "n": "", "vs": [[56, "لأن المدمر قد انقض على بابل وأسر محاربيها، وتكسرت كل قسيها، لأن الرب إله مجازاة، وهو حتما يحاسبها."]]}, {"l": "Zec 2:8", "n": "", "vs": [[8, "فإن الرب القدير يقول إنه أرسلني إلى الأمم التي سلبتكم إعلاء لمجده، لأن من يمسكم يمس حدقة عينه."]]}, {"l": "Zec 2:9", "n": "", "vs": [[9, "ها أنا أضربهم بيدي فيصيرون نهبا لعبيدهم، فتدركون أن الرب القدير قد أرسلني حقا."]]}], "kwAr": "سلبت", "noteAr": ""}, {"kw": "blood", "raw": "Heb. bloods, Hab_2:17", "note": "Heb. bloods, Hab_2:17", "refs": [{"l": "Hab 2:17", "n": "", "vs": [[17, "لأن ما ارتكبته من ظلم في حق لبنان يغطيك، وما أهلكته من بهائم يروعك. من أجل ما سفكته من دماء واقترفته من جور في الأرض والمدن والساكنين فيها."]]}], "kwAr": "دماء", "noteAr": "بالعبرية: «دماء». انظر حب 2: 17"}, {"kw": "the violence", "raw": "Psa_137:8; Isa_47:6; Jer_50:11, Jer_50:17, Jer_50:18, Jer_50:28, Jer_50:33, Jer_50:34, Jer_51:8, Jer_51:24, Jer_51:34, Jer_51:35; Mic_4:11-13; Zec_1:15, Zec_2:8, Zec_12:2-4, Zec_14:12; Rev_6:10, Rev_18:20-24", "note": "", "refs": [{"l": "Psa 137:8", "n": "", "vs": [[8, "يابنت بابل المحتم خرابها، طوبى لمن يجازيك بما جزيتنا به."]]}, {"l": "Isa 47:6", "n": "", "vs": [[6, "قد سخطت على شعبي ونجست ميراثي. أسلمتهم إلى يديك، فلم تبدي نحوهم رحمة بل أرهقت الشيخ بنيرك الثقيل جدا."]]}, {"l": "Jer 50:11", "n": "", "vs": [[11, "لأنكم تبتهجون وتطفرون غبطة يا ناهبي شعبي، وتمرحون كعجلة فوق العشب وتصهلون كالخيل."]]}, {"l": "Jer 50:17", "n": "", "vs": [[17, "إسرائيل قطيع غنم متشتت، طردته الأسود. كان ملك أشور أول من افترسه، ونبوخذناصر آخر من هشم عظامه."]]}, {"l": "Jer 50:18", "n": "", "vs": [[18, "لذلك هذا ما يعلنه الرب القدير إله إسرائيل: ها أنا أعاقب ملك بابل وأرضه. كما عاقبت ملك أشور من قبل."]]}, {"l": "Jer 50:28", "n": "", "vs": [[28, "اسمعوا! ها جلبة الفارين الناجين من ديار بابل لكي يذيعوا في صهيون أنباء انتقام الرب إلهنا والثأر لهيكله."]]}, {"l": "Jer 50:33", "n": "", "vs": [[33, "وهذا ما يعلنه الرب القدير: «قد وقع الظلم على شعب إسرائيل وعلى شعب يهوذا، وجميع الذين سبوهم تشبثوا بهم وأبوا أن يطلقوهم."]]}, {"l": "Jer 50:34", "n": "", "vs": [[34, "غير أن فاديهم قوي، الرب القدير اسمه، وهو حتما يدافع عن قضيتهم لكي يشيع راحة في الأرض ويقلق أهل بابل."]]}, {"l": "Jer 51:8", "n": "", "vs": [[8, "فجأة سقطت بابل وتحطمت، فولولوا عليها، خذوا بلسانا لجرحها لعلها تبرأ."]]}, {"l": "Jer 51:24", "n": "", "vs": [[24, "سأجازي بابل وسائر الكلدانيين على كل شرهم الذي ارتكبوه في حق صهيون، على مرأى منكم، يقول الرب."]]}, {"l": "Jer 51:34", "n": "", "vs": [[34, "«يقول المسبيون: قد افترسنا نبوخذناصر ملك بابل وسحقنا وجعلنا إناء فارغا. ابتلعنا كتنين، وملأ جوفه من أطايبنا، ثم لفظنا من فمه."]]}, {"l": "Jer 51:35", "n": "", "vs": [[35, "يقول أهل أورشليم: ليحل ببابل ما أصابنا وأصاب لحومنا من ظلم. وتقول أورشليم: دمي على أهل أرض الكلدانيين."]]}, {"l": "Mic 4:11-13", "n": "", "vs": [[11, "والآن ها أمم غفيرة قد اجتمعت عليك قائلة «لتتدنس أورشليم حتى تتفرس عيوننا في خرابها»."], [12, "لكنهم لم يعرفوا نوايا الرب، ولم يفهموا مقاصده، فإنه قد جمعهم كأكداس إلى البيدر ليعاقبهم."], [13, "فانهضي ياابنة صهيون وادرسي أعداءك، لأني سأجعل لك قرنا من حديد وأظلافا من نحاس فتسحقين أمما كثيرة، وتكرسين كل ما تغنمينه منهم للرب، وتقدمين ثروتهم لسيد الأرض كلها."]]}, {"l": "Zec 1:15", "n": "", "vs": [[15, "ولكن غضبي متأجج على الأمم المتنعمة. لقد اغتظت قليلا من شعبي إلا أنهم زادوا من فواجعهم."]]}, {"l": "Zec 2:8", "n": "", "vs": [[8, "فإن الرب القدير يقول إنه أرسلني إلى الأمم التي سلبتكم إعلاء لمجده، لأن من يمسكم يمس حدقة عينه."]]}, {"l": "Zec 12:2-4", "n": "", "vs": [[2, "«ها أنا مزمع أن أجعل أورشليم كأس خمر تترنح منها جميع الشعوب المحيطة بها، فتحاصر يهوذا أيضا في أثناء حصارها لأورشليم."], [3, "في ذلك اليوم أجعل أورشليم كصخرة ثقيلة تعجز عن حملها جميع الشعوب. وكل من يحاول حملها ينشق شقا، ويتألب عليها جميع شعوب الأرض."], [4, "في ذلك اليوم، يقول الرب: أصيب كل فرس من جيوش الأعداء بالرعب، وفارسه بالجنون، وأرعى برضاي شعب يهوذا، وأبتلي جميع خيول الأمم بالعمى."]]}, {"l": "Zec 14:12", "n": "", "vs": [[12, "وهذا هو البلاء الذي يعاقب به الرب جميع الشعوب الذين اجتمعوا على أورشليم: تتهرأ لحومهم وهم واقفون على أرجلهم، وتتآكل عيونهم في أوقابها، وتتلف ألسنتهم في أفواههم."]]}, {"l": "Rev 6:10", "n": "", "vs": [[10, "وهم يصرخون للرب بأعلى صوتهم: «حتى متى، أيها السيد القدوس والحق، تؤخر معاقبة أهل الأرض على ما فعلوه بنا؟ متى تنتقم منهم لدمائنا؟»"]]}, {"l": "Rev 18:20-24", "n": "", "vs": [[20, "اشمتي بها أيتها السماء! واشمتوا بها أيها القديسون والرسل والأنبياء، فقد أصدر الله حكمه عليها بعدما أصدرت أحكامها عليكم»."], [21, "وتناول ملاك قوي حجرا كأنه حجر طاحونة عظيم وألقاه في البحر قائلا: «هكذا تدفع وتطرح بابل المدينة العظمى، فتختفي إلى الأبد!"], [22, "لن يسمع فيك عزف موسيقى بعد، لا صوت قيثارة ولا مزمار ولا بوق، ولن تقوم فيك صناعة بعد الآن، ولن يسمع فيك صوت رحى"], [23, "ولن يضيء فيك نور مصباح. ولن يسمع فيك صوت عريس وعروس. فقد كان تجارك سادة الأرض، وبسحرك ضللت جميع الأمم."], [24, "وفيها وجدت دماء أنبياء وقديسين وجميع الذين قتلوا على الأرض»."]]}], "kwAr": "جور", "noteAr": ""}], "arS": [["لأنك", ["H3588", "H859"]], [" ", []], ["سلبت", ["H7997"]], [" ", []], ["أمما", ["H1471"]], [" ", []], ["كثيرة", ["H7227"]], [" فإن ", []], ["بقية", ["H3499"]], [" ", []], ["الشعوب", ["H5971"]], [" ", []], ["ينهبونك", ["H7997"]], [" ثأرا لما ", []], ["سفكت", ["H4480", "H1818"]], [" من ", []], ["دماء", ["H120"]], [" وارتكبت من ", []], ["جور", ["H2555"]], [" في ", []], ["الأرض", ["H776"]], ["، فدمرت ", []], ["مدنا", ["H7151"]], [" وأهلكت ", []], ["الساكنين", ["H3427"]], [" فيها.", []]]}, {"c": 2, "v": 9, "text": "ويل لمن يدخر لبنيه مكسب ظلم، ويشيد مسكنه في مقام حصين ليكون في مأمن من الخطر.", "groups": [{"kw": "that coveteth an evil covetousness", "raw": "or, that gaineth an evil gain, Gen_13:10-13, Gen_19:26-38; Deu_7:25, Deu_7:26; Jos_7:21-26; 1Ki_21:2-4, 1Ki_21:19-24; 2Ki_5:20-27; Job_20:19-28; Jer_22:13-19; Zec_5:1-4; Act_1:17-25; Jud_1:11", "note": "or, that gaineth an evil gain, Gen_13:10-13, Gen_19:26-38; Deu_7:25, Deu_7:26; Jos_7:21-26; 1Ki_21:2-4, 1Ki_21:19-24; 2Ki_5:20-27; Job_20:19-28; Jer_22:13-19; Zec_5:1-4; Act_1:17-25; Jud_1:11", "refs": [{"l": "Gen 13:10-13", "n": "", "vs": [[10, "وتلفت لوط حوله فشاهد السهول المحيطة بنهر الأردن وإذا بها ريانة كلها، قبلما دمر الرب سدوم وعمورة، وكأنها جنة الرب كأرض مصر الممتدة إلى صوغر."], [11, "فاختار لوط لنفسه حوض الأردن كله وارتحل شرقا. وهكذا اعتزل أحدهما عن الآخر."], [12, "وسكن أبرام في أرض كنعان، وأقام لوط في مدن السهل حيث نصب خيامه بجوار سدوم."], [13, "وكان أهل سدوم متورطين في الشر وخاطئين جدا لدى الرب."]]}, {"l": "Gen 19:26-38", "n": "", "vs": [[26, "وتلفتت زوجة لوط السائرة خلفه وراءها، فتحولت إلى عمود من الملح."], [27, "ومضى إبراهيم مبكرا في الصباح إلى المكان الذي وقف فيه أمام الرب."], [28, "وتطلع نحو سدوم وعمورة ولسائر أرض السهل، فأبصر الدخان يتصاعد منها كالأتون."], [29, "وهكذا عندما دمر الله مدن السهل ذكر إبراهيم، فأخرج لوطا قبيل وقوع الكارثة حين قلب المدن التي قطن فيها لوط."], [30, "وغادر لوط وابنتاه بعد ذلك صوغر، واستقروا في الجبل لأنه خاف أن يسكن في صوغر. فلجأ هو وابنتاه إلى كهف هناك."], [31, "فقالت الابنة البكر لأختها الصغيرة: «إن أبانا قد شاخ وليس في الأرض حولنا رجل يتزوجنا كعادة كل الناس."], [32, "فتعالي نسقيه خمرا ونضطجع معه فلا تنقطع ذرية أبينا»."], [33, "فسقتا في تلك الليلة أباهما خمرا، وأقبلت الابنة الكبرى وضاجعت أباها فلم يعلم باضطجاعها ولا بقيامها."], [34, "وفي اليوم الثاني قالت الابنة البكر لأختها الصغيرة: «إني قد اضطجعت مع أبي ليلة أمس، فتعالي نسقيه الليلة أيضا خمرا ثم ادخلي واضطجعي معه فنحيي من أبينا نسلا»."], [35, "فسقتا أباهما خمرا في تلك الليلة أيضا وأقبلت الابنة الصغيرة وضاجعت أباها. فلم يعلم باضطجاعها ولا بقيامها."], [36, "وهكذا حملت الابنتان كلتاهما من أبيهما."], [37, "فولدت الكبرى ابنا دعته موآب (ومعناه من الأب)، وهو أبو الموآبيين إلى اليوم،"], [38, "أما الصغرى فولدت ابنا ودعته «بن عمي) (ومعناه ابن قومي) وهو أبو بني عمون إلى اليوم."]]}, {"l": "Deu 7:25", "n": "", "vs": [[25, "أحرقوا تماثيل آلهتهم ولا تشتهوا ما عليها من فضة وذهب فتغنموها لأنفسكم، لئلا تقتنصكم، لأنها رجس عند الرب إلهكم."]]}, {"l": "Deu 7:26", "n": "", "vs": [[26, "لا تدخلوا شيئا رجسا إلى بيوتكم لئلا تصبحوا أهلا للدمار مثله، بل عليكم أن تستقبحوه وتمقتوه، لأن مآله الدمار."]]}, {"l": "Jos 7:21-26", "n": "", "vs": [[21, "رأيت بين الغنائم رداء شنعاريا نفيسا، ومئتي شاقل فضة (نحو كيلوجرامين ونصف)، وسبيكة من ذهب وزنها خمسون شاقلا (نحو ست مئة جرام)، فاشتهيتها وأخذتها. وها هي مطمورة في الأرض في وسط خيمتي، والفضة تحتها»."], [22, "فأرسل يشوع رسلا فهرعوا إلى الخيمة حيث عثروا عليها مطمورة فيها، والفضة تحتها،"], [23, "فأخرجوها من وسط الخيمة وحملوها إلى يشوع وإلى جميع بني إسرائيل وعرضوها أمام الرب."], [24, "فأخذ يشوع وجميع بني إسرائيل عخان بن زارح والفضة والرداء وسبيكة الذهب، وأبناءه وبناته وبقره وحميره وغنمه وخيمته وكل ماله، وذهبوا بهم إلى وادي عخور."], [25, "وقال يشوع: «لماذا جلبت علينا هذه الكارثة؟ لتحل بك اليوم الفواجع». فرجمه جميع إسرائيل بالحجارة مع أهل بيته وأحرقوهم بالنار،"], [26, "وأقاموا فوقه كومة كبيرة من الحجارة، ما برحت باقية إلى هذا اليوم. فهدأ غضب الرب ولذلك دعي اسم ذلك الموضع وادي عخور ومعناه: (وادي الإزعاج) إلى هذا اليوم."]]}, {"l": "1Ki 21:2-4", "n": "", "vs": [[2, "فقال أخآب لنابوت: «قايضني كرمك لأجعله حديقة خضروات، لأنه مجاور لقصري، فأعطيك بدلا منه كرما أفضل منه، أو إذا راق لك أدفع ثمنه فضة»."], [3, "فأجاب نابوت: «معاذ الله أن أفرط في ميراث آبائي»."], [4, "فدخل أخآب قصره مكتئبا مهموما متأثرا من قول نابوت اليزرعيلي: «لا أفرط في ميراث آبائي». واستلقى فوق سريره مشيحا بوجهه نحو الحائط عازفا عن الطعام."]]}, {"l": "1Ki 21:19-24", "n": "", "vs": [[19, "وقل له: هذا ما يقوله الرب: هل قتلت وامتلكت أيضا؟ في المكان الذي لعقت فيه الكلاب دم نابوت تلعق الكلاب دمك أيضا»."], [20, "وما إن رأى أخآب إيليا حتى قال: «هل وجدتني ياعدوي؟» فأجابه: «قد وجدتك لأنك بعت نفسك لارتكاب الشر في عيني الرب."], [21, "لهذا يقول الرب: ها أنا أجلب عليك شرا وأبيد ذريتك وأفني كل ذكر لك، حرا كان أم عبدا."], [22, "وأجعل مصير بيتك كمصير بيت يربعام بن نباط، وكمصير بيت بعشا بن أخيا، لفرط ما أثرته من غيظي، ولأ نك استغويت إسرائيل لارتكاب المعصية»."], [23, "وأصدر الرب قضاءه على إيزابل قائلا: «إن الكلاب ستلتهم جثتها عند مترسة يزرعيل."], [24, "وكل من يموت من أسرتك في المدينة تأكله الكلاب ومن يموت منهم في الحقل تنهشه الطيور»."]]}, {"l": "2Ki 5:20-27", "n": "", "vs": [[20, "حتى حدث جيحزي خادم أليشع نفسه: «سيدي امتنع عن قبول ما أحضره نعمان من هدايا. حي هو الرب لأسرعن وراءه وآخذ منه شيئا»."], [21, "فلحق جيحزي بنعمان. ولما أبصره نعمان راكضا نحوه، ترجل عن المركبة للقائه سائلا: «أللخير جئت؟»"], [22, "فأجاب: «للخير. إن سيدي قد أرسلني قائلا: إن رجلين من جبل أفرايم من بني الأنبياء جاءاه، فأرجوك أن تعطيهما وزنة من الفضة وحلتي ثياب»."], [23, "فقال نعمان: «أرجوك أن تأخذ وزنتين» وألح عليه، وصرهما في كيسين وحلتي ثياب، وأعطاهما لرجلين من رجاله، فحملاهما وانطلقا أمام جيحزي."], [24, "وعندما وصل إلى الأكمة حيث يقيم أليشع أخذها منهما وأخفاها في البيت، وصرف الرجلين."], [25, "ثم دخل إلى أليشع، فسأله: «من أين جئت ياجيحزي؟» فأجاب: «لم يذهب عبدك إلى أي مكان»."], [26, "فقال له: «ألا تعرف أن قلبي كان حاضرا هناك حين ترجل الرجل من مركبته للقائك؟ أهذا وقت الحصول على فضة أو أخذ ثياب وزيتون وكروم وغنم وبقر وعبيد وجوار؟"], [27, "فليحل برص نعمان بك وبنسلك إلى الأبد». فخرج من أمامه وجلده أبرص في لون الثلج."]]}, {"l": "Job 20:19-28", "n": "", "vs": [[19, "لأنه هضم حق الفقراء وخذلهم وسلب بيوتا لم يبنها."], [20, "وإذ لا يعرف طمعه قناعة، فإنه لن يدخر شيئا يستمتع به."], [21, "لم يبق نهمه على شيء، لذلك لن يدوم خيره."], [22, "في وفرة سعته يصيبه الضنك، وتحل به أقسى الكوارث."], [23, "وعندما يملأ بطنه ينفث عليه الله غضبه الحارق ويمطره عليه طعاما له."], [24, "إن فر من آلة حرب من حديد، تخترقه قوس النحاس."], [25, "اخترقته عميقا وخرجت من جسده، ونفذ حدها اللامع من مرارته، وحل به رعب."], [26, "كل ظلمة تتربص بذخائره، وتأكله نار لم تنفخ، وتلتهم ما بقي من خيمته."], [27, "تفضح السماوات إثمه، وتتمرد الأرض عليه،"], [28, "تفنى مدخرات بيته وتحترق في يوم غضب الرب."]]}, {"l": "Jer 22:13-19", "n": "", "vs": [[13, "«ويل لمن يبني بيته على الظلم ومخادعه العالية على الجور، الذي يستخدم جاره مجانا ولا يوفيه أجرة عمله،"], [14, "الذي يقول: «سأبني لنفسي بيتا رحبا وغرفا عالية فسيحة. وأفتح له كوى وأغشيه بألواح الأرز وأدهنه بألوان حمراء."], [15, "أتظن أنك صرت ملكا لأنك بنيت بيتك من الأرز؟ أما أكل أبوك وشرب وأجرى عدلا وحقا، فتمتع بالخيرات؟"], [16, "قد قضى بالعدل للبائس والمسكين فأحرز خيرا. أليست هذه هي معرفتي؟» يقول الرب"], [17, "«أما أنت فعيناك وقلبك متهافتة على الربح الحرام، وعلى سفك الدم البريء، وعلى الظلم والابتزاز»."], [18, "لذلك هذا ما يقوله الرب عن يهوياقيم بن يوشيا، ملك يهوذا: «لن يندبك أحد قائلا: آه ياأخي أو آه ياأختي، أو يندبون عليه قائلين: آواه ياسيدي، أو آه على جلاله."], [19, "بل يدفن دفن حمار، مجرورا ومطروحا خارج بوابات أورشليم»."]]}, {"l": "Zec 5:1-4", "n": "", "vs": [[1, "وعدت ورفعت عيني وإذا بي أشاهد درجا طائرا."], [2, "فسألني الملاك: «ماذا ترى؟» فأجبت: «أرى درجا طائرا، طوله عشرون ذراعا (نحو عشرة أمتار) وعرضه عشر أذرع (نحو خمسة أمتار)»."], [3, "فقال لي: «هذه هي اللعنة المنصبة على وجه الأرض كلها. كل من يسرق يستأصل بمقتضى ما هو مدون فيها، وكل حالف زور يعاقب بموجب ما هو منصوص فيها»."], [4, "ويقول الرب القدير: «إني أصب هذه اللعنة على بيت كل سارق أو حالف باسمي زورا، فتحل في وسط بيته وتبيده مع خشبه وحجره»."]]}, {"l": "Act 1:17-25", "n": "", "vs": [[17, "وكان يهوذا يعتبر واحدا منا، وقد شاركنا في خدمتنا."], [18, "ثم إنه اشترى حقلا بالمال الذي تقاضاه ثمنا للخيانة، وفيه وقع على وجهه، فانشق من وسطه واندلقت أمعاؤه كلها."], [19, "وعلم أهل أورشليم جميعا بهذه الحادثة، فأطلقوا على حقله اسم ¢حقل دمخ¢ بلغتهم، أي حقل الدم."], [20, "فتمت النبوءة الواردة في كتاب المزامير: لتصر داره خرابا، ولا يسكنها ساكن. وأيضا: ليستلم وظيفته آخر!"], [21, "فعلينا إذن أن نختار واحدا من الرجال الذين رافقونا طوال المدة التي قضاها الرب يسوع معنا،"], [22, "منذ أن عمده يوحنا إلى يوم ارتفاعه عنا إلى السماء، ليكون معنا شاهدا بقيامة يسوع»."], [23, "فرشح الحاضرون رجلين هما: يوسف الذي يدعى بارسابا ويلقب بيستس، ومتياس."], [24, "ثم صلوا قائلين: «أيها الرب العارف قلوب الناس جميعا، بين لنا أي هذين الرجلين تختار"], [25, "ليشاركنا في الخدمة والرسالة بدلا من يهوذا الذي ذهب إلى المكان الذي يستحقه»."]]}, {"l": "Jud 1:11", "n": "", "vs": [[11, "الويل لهم! لأنهم سلكوا طريق قايين، واندفعوا إلى ارتكاب خطيئة بلعام طلبا للمال، وتمردوا كما تمرد قورح، فدمروا أنفسهم."]]}], "kwAr": "يدخر لبنيه مكسب ظلم", "noteAr": "أو: «الذي يكسب كسبا شريرا». انظر تك 13: 10-13؛ 19: 26-38؛ تث 7: 25، 26؛ يش 7: 21-26؛ 1مل 21: 2-4؛ 21: 19-24؛ 2مل 5: 20-27؛ أي 20: 19-28؛ إر 22: 13-19؛ زك 5: 1-4؛ أع 1: 17-25؛ يه 1: 11"}, {"kw": "set", "raw": "Psa_10:3-6, Psa_49:11, Psa_52:7; Pro_18:11, Pro_18:12; Isa_28:15, Isa_47:7-9; Jer_49:16; Oba_1:4", "note": "", "refs": [{"l": "Psa 10:3-6", "n": "", "vs": [[3, "الشرير يفتخر بشهوات نفسه، والرجل الطماع يلعن ويجدف على الله."], [4, "في تكبره وتشامخه لا يلتمس الله ، ولا مكان لله في أفكاره كلها،"], [5, "ومع ذلك فإن مساعيه تبدو ناجحة، ويستخف بجميع أعدائه. ولكن أحكامك عالية أسمى منه"], [6, "قال في نفسه: «لن يزحزحني شيء، ولن ينالني مكروه قط»."]]}, {"l": "Psa 49:11", "n": "", "vs": [[11, "يتوهمون أن بيوتهم خالدة، وأن مساكنهم باقية من جيل إلى جيل، فأطلقوا أسماءهم على أراضيهم (تخليدا لذكرهم)."]]}, {"l": "Psa 52:7", "n": "", "vs": [[7, "هذا هو الرجل الذي لم يتخذ الله حصنا له، بل اتكل على وفرة غناه واعتز بغوايته."]]}, {"l": "Pro 18:11", "n": "", "vs": [[11, "ثروة ا
