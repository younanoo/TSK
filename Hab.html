لغني مدينته الحصينة، وهي في وهمه سور شامخ."]]}, {"l": "Pro 18:12", "n": "", "vs": [[12, "قبل الانكسار تشامخ القلب، وقبل الكرامة التواضع."]]}, {"l": "Isa 28:15", "n": "", "vs": [[15, "لأنكم قلتم: «قد أبرمنا عهدا مع الموت، وعقدنا ميثاقا مع الهاوية، فإن الأشوريين المقتحمين أرضنا لن يسلخونا، لأن السوط الجارف إذا عبر لا يصيبنا لأننا اعتصمنا بالمراوغة ولجأنا إلي النفاق»."]]}, {"l": "Isa 47:7-9", "n": "", "vs": [[7, "وقلت: سأظل السيدة إلى الأبد. لذلك لم تفكري بهذه الأمور في نفسك ولا تأملت بما تؤول إليه."], [8, "فالآن اسمعي هذا أيتها المترفهة المتنعمة المطمئنة، القائلة في قلبها: أنا وحدي وليس هناك غيري، لن أعرف الترمل ولن أثكل"], [9, "لذلك ستبتلين بكلا الأمرين معا في لحظة، في يوم واحد، إذ تثكلين وتترملين حتى النهاية على الرغم من كثرة سحرك وقوة رقاك."]]}, {"l": "Jer 49:16", "n": "", "vs": [[16, "قد خدعك ما تثيره من رعب، وأغوتك كبرياء قلبك، يامن تقيم في شقوق الصخر وتعتصم بقمة التل. ولكنني سأطرحك من هناك ولو بنيت عشك عاليا كعش النسر، يقول الرب."]]}, {"l": "Oba 1:4", "n": "", "vs": [[4, "ولكن إن كنت تحلق كالنسر ومنازلك مبنية بين الكواكب، فإني سأهوي بك إلى الحضيض يقول الرب."]]}], "kwAr": "ويشيد", "noteAr": ""}, {"kw": "power of evil", "raw": "Heb. palm of the hand", "note": "Heb. palm of the hand", "refs": [], "kwAr": "في مأمن", "noteAr": "بالعبرية: «كف الشر»."}], "arS": [["ويل", ["H1945"]], [" لمن ", []], ["يدخر", ["H1214"]], [" ", []], ["لبنيه", ["H1004"]], [" ", []], ["مكسب", ["H1215"]], [" ", []], ["ظلم", ["H7451"]], ["، ", []], ["ويشيد", ["H7760"]], [" ", []], ["مسكنه", ["H7064"]], [" في ", []], ["مقام", ["H4791"]], [" حصين ", []], ["ليكون", ["H5337"]], [" في مأمن من ", []], ["الخطر", ["H4480", "H3709", "H7451"]], [".", []]]}, {"c": 2, "v": 10, "text": "لقد لطخت مؤامرتك بيتك بالعار حين استأصلت أمما عديدة وجلبت الدمار على نفسك.", "groups": [{"kw": "consulted", "raw": "2Ki_9:26, 2Ki_10:7; Isa_14:20-22; Jer_22:30, Jer_36:31; Nah_1:14; Mat_27:25", "note": "", "refs": [{"l": "2Ki 9:26", "n": "", "vs": [[26, "فالرب يقول: لقد رأيت أمسا دم نابوت ودماء أبنائه، لهذا لابد أن أعاقبك في هذا الحقل. فالآن ارفعه واطرحه في الحقل حسب قول الرب»."]]}, {"l": "2Ki 10:7", "n": "", "vs": [[7, "فلما بلغتهم رسالة ياهو قبضوا على الأمراء وقتلوا سبعين رجلا ووضعوا رؤوسهم في سلال وأرسلوها إليه في يزرعيل."]]}, {"l": "Isa 14:20-22", "n": "", "vs": [[20, "لا تنضم إليهم في مدفن، لأنك خربت أرضك، وذبحت شعبك، فذرية فاعلي الإثم يبيد ذكرها إلى الأبد."], [21, "أعدوا مذبحة لأبنائه جزاء إثم آبائهم، لئلا يقوموا ويرثوا الأرض فيملأوا وجه البسيطة مدنا."], [22, "إني أهب ضدهم، يقول الرب القدير، وأمحو من بابل اسما وبقية ونسلا وذرية،"]]}, {"l": "Jer 22:30", "n": "", "vs": [[30, "«سجلوا أن هذا الإنسان عقيم، رجل لن يفلح في حياته، ولن ينجح أحد من ذريته في الجلوس على عرش داود وتولي ملك يهوذا»."]]}, {"l": "Jer 36:31", "n": "", "vs": [[31, "وأعاقبه وأعاقب ذريته وعبيده لإثمهم، وأوقع بهم وبجميع أهل أورشليم وبرجال يهوذا جميع ما قضيت به من شر عليهم إذ لم يسمعوا»."]]}, {"l": "Nah 1:14", "n": "", "vs": [[14, "وها الرب قد أصدر قضاءه بشأنك ياأشور: لن تبقى لك ذرية تحمل اسمك. وأستأصل من هيكل آلهتك منحوتاتك ومسبوكاتك، وأجعله قبرك، لأنك صرت نجسا."]]}, {"l": "Mat 27:25", "n": "", "vs": [[25, "فأجاب الشعب بأجمعه: «ليكن دمه علينا وعلى أولادنا!»"]]}], "kwAr": "مؤامرتك", "noteAr": ""}, {"kw": "sinned", "raw": "Num_16:38; 1Ki_2:23; Pro_1:18, Pro_8:36; Isa_33:11", "note": "", "refs": [{"l": "Num 16:38", "n": "", "vs": [[38, "واطرقوا مجامر هؤلاء الذين أخطأوا في حق نفوسهم صفائح، لتكون غشاء للمذبح، لأنهم قدموها في حضرة الرب فتقدست، فتكون عبرة لبني إسرائيل»."]]}, {"l": "1Ki 2:23", "n": "", "vs": [[23, "وحلف سليمان الملك بالرب قائلا: «ليعاقبني الرب أشد عقاب ويزد إن لم يدفع أدونيا حياته ثمنا لهذا المطلب."]]}, {"l": "Pro 1:18", "n": "", "vs": [[18, "إنما هم يتربصون لسفك دم أنفسهم، ويكمنون لإهدار حياتهم."]]}, {"l": "Pro 8:36", "n": "", "vs": [[36, "ومن يضل عني يؤذي نفسه، ومن يبغضني يحب الموت."]]}, {"l": "Isa 33:11", "n": "", "vs": [[11, "فكل ما بذلتموه من جهد أيها الأشوريون لا جدوى منه كالحشيش والتبن وصارت أنفاسكم نارا تلتهمكم."]]}], "kwAr": "وجلبت الدمار", "noteAr": ""}], "arS": [["لقد لطخت ", []], ["مؤامرتك", ["H3289"]], [" ", []], ["بيتك", ["H1004"]], [" ", []], ["بالعار", ["H1322"]], [" حين ", []], ["استأصلت", ["H7096"]], [" ", []], ["أمما", ["H5971"]], [" ", []], ["عديدة", ["H7227"]], [" ", []], ["وجلبت", ["H2398"]], [" الدمار على ", []], ["نفسك", ["H5315"]], [".", []]]}, {"c": 2, "v": 11, "text": "حتى حجارة الجدران تصرخ من شرك، فتردد الدعائم الخشبية أصداءها.", "groups": [{"kw": "the stone", "raw": "Gen_4:10; Jos_24:27; Job_31:38-40; Luk_19:40; Heb_12:24; Jam_5:3, Jam_5:4; Rev_6:10", "note": "", "refs": [{"l": "Gen 4:10", "n": "", "vs": [[10, "فقال الرب له: «ماذا فعلت؟ إن صوت دم أخيك يصرخ إلي من الأرض."]]}, {"l": "Jos 24:27", "n": "", "vs": [[27, "ثم قال للشعب جميعه: «إن هذا الحجر شاهد عليكم لئلا تجحدوا إلهكم»."]]}, {"l": "Job 31:38-40", "n": "", "vs": [[38, "إن كانت أرضي قد احتجت علي وتباكت أتلامها جميعا،"], [39, "إن كنت قد أكلت غلاتها بلا ثمن، أو سحقت نفوس أصحابها،"], [40, "فلينبت فيها الشوك بدل الحنطة والزوان بدل الشعير» تمت هنا أقوال أيوب."]]}, {"l": "Luk 19:40", "n": "", "vs": [[40, "فأجابهم قائلا: «أقول لكم: إن سكت هؤلاء، هتفت الحجارة!»"]]}, {"l": "Heb 12:24", "n": "", "vs": [[24, "كذلك، تقدمتم إلى يسوع، وسيط العهد الجديد، وإلى دمه المرشوش الذي يتكلم مطالبا بأفضل مما طالب به دم هابيل."]]}, {"l": "Jam 5:3", "n": "", "vs": [[3, "ذهبكم وفضتكم قد تآكلا، وسيكون تآكلهما شاهدا ضدكم، ويأكل لحمكم كنار جمعتموها ثروة للأيام الأخيرة؟"]]}, {"l": "Jam 5:4", "n": "", "vs": [[4, "وهذه أجرة العمال الذين حصدوا حقولكم، تلك الأجرة التي مازلتم تحبسونها عنهم ظلما، إنها تصرخ، وصراخ أولئك العمال أنفسهم قد سمعه رب الجنود!"]]}, {"l": "Rev 6:10", "n": "", "vs": [[10, "وهم يصرخون للرب بأعلى صوتهم: «حتى متى، أيها السيد القدوس والحق، تؤخر معاقبة أهل الأرض على ما فعلوه بنا؟ متى تنتقم منهم لدمائنا؟»"]]}], "kwAr": "حجارة", "noteAr": ""}, {"kw": "beam", "raw": "or, piece, or, fastening", "note": "or, piece, or, fastening", "refs": [], "kwAr": "الدعائم الخشبية", "noteAr": "أو: «قطعة»، أو «وصلة»."}, {"kw": "answer it", "raw": "or, witness against it", "note": "or, witness against it", "refs": [], "kwAr": "فتردد", "noteAr": "أو: «يشهد عليه»."}], "arS": [["حتى ", []], ["حجارة", ["H68"]], [" ", []], ["الجدران", ["H4480", "H7023"]], [" ", []], ["تصرخ", ["H2199"]], [" من شرك، ", []], ["فتردد", ["H6030"]], [" ", []], ["الدعائم", ["H3714"]], [" ", []], ["الخشبية", ["H4480", "H6086"]], [" أصداءها.", []]]}, {"c": 2, "v": 12, "text": "ويل لمن يبني مدينة بالدماء، ويؤسس قرية بالإثم.", "groups": [{"kw": "him", "raw": "Gen_4:11-17; Jos_6:26; 1Ki_16:34; Jer_22:13-17; Eze_24:9; Dan_4:27-31; Mic_3:10; Nah_3:1; Joh_11:47-50; Rev_17:6", "note": "", "refs": [{"l": "Gen 4:11-17", "n": "", "vs": [[11, "فمنذ الآن، تحل عليك لعنة الأرض التي فتحت فاها وابتلعت دم أخيك الذي سفكته يدك."], [12, "عندما تفلحها لن تعطيك خيرها، وتكون شريدا وطريدا في الأرض»."], [13, "فقال قايين للرب: «عقوبتي أعظم من أن تحتمل."], [14, "ها أنت اليوم قد طردتني عن وجه الأرض، ومن أمام حضرتك أختفي، وأكون شريدا طريدا في الأرض، ويقتلني كل من يجدني»."], [15, "فقال الرب له: «سأعاقب كل من يقتلك بسبعة أضعاف العقوبة التي عاقبتك بها». ووسم الرب قايين بعلامة تحظر على من يلقاه اغتياله."], [16, "وهكذا خرج قايين من حضرة الرب وسكن في أرض نود شرقي عدن."], [17, "وعاشر قايين زوجته فحبلت وأنجبت ابنا دعاه «حنوك». وكان قايين آنئذ يبني مدينة فسماها «حنوك» على اسم ابنه."]]}, {"l": "Jos 6:26", "n": "", "vs": [[26, "في ذلك الوقت أنذر يشوع الشعب قائلا: «ملعون أمام الرب كل من يحاول أن يعيد بناء مدينة أريحا، فإن بكره يموت وهو يضع أساساتها، وصغيره يهلك وهو يقيم بواباتها»."]]}, {"l": "1Ki 16:34", "n": "", "vs": [[34, "وفي عهده بنى حيئيل البيتئيلي أريحا. وعندما أرسى أساسها مات ابنه الأكبر أبيرام، وعندما نصب بواباتها مات ابنه الأصغر سجوب، فتحقق بذلك وعيد الرب الذي نطق به على لسان يشوع بن نون."]]}, {"l": "Jer 22:13-17", "n": "", "vs": [[13, "«ويل لمن يبني بيته على الظلم ومخادعه العالية على الجور، الذي يستخدم جاره مجانا ولا يوفيه أجرة عمله،"], [14, "الذي يقول: «سأبني لنفسي بيتا رحبا وغرفا عالية فسيحة. وأفتح له كوى وأغشيه بألواح الأرز وأدهنه بألوان حمراء."], [15, "أتظن أنك صرت ملكا لأنك بنيت بيتك من الأرز؟ أما أكل أبوك وشرب وأجرى عدلا وحقا، فتمتع بالخيرات؟"], [16, "قد قضى بالعدل للبائس والمسكين فأحرز خيرا. أليست هذه هي معرفتي؟» يقول الرب"], [17, "«أما أنت فعيناك وقلبك متهافتة على الربح الحرام، وعلى سفك الدم البريء، وعلى الظلم والابتزاز»."]]}, {"l": "Eze 24:9", "n": "", "vs": [[9, "لذلك ويل للمدينة سافكة الدماء، فإني أنا أجعل كومة حطبها عظيمة."]]}, {"l": "Dan 4:27-31", "n": "", "vs": [[27, "لذلك أيها الملك، تقبل مشورتي وتخل عن خطاياك بالبر وآثامك بممارسة الرحمة مع البائسين، عسى أن يطول فلاحك»."], [28, "وقد أصاب نبوخذناصر الملك كل ما أنبأ به دانيآل."], [29, "فبعد انقضاء اثني عشر شهرا على هذا الحلم، وفيما كان نبوخذناصر يتمشى على سطح قصر بابل الملكي،"], [30, "قال: «أليست هذه هي بابل العظيمة التي بنيتها بقوة اقتداري لتكون عاصمة للمملكة، ولجلال مجدي؟»"], [31, "وفيما كانت كلماته بعد تتردد على شفتيه تجاوب صوت من السماء قائلا: «يانبوخذناصر الملك، لك يقولون الآن قد زال عنك الملك."]]}, {"l": "Mic 3:10", "n": "", "vs": [[10, "الذين يبنون صهيون بالدم وأورشليم بالظلم."]]}, {"l": "Nah 3:1", "n": "", "vs": [[1, "ويل للمدينة السافكة الدماء الممتلئة كذبا، المكتظة بالغنائم المنهوبة، التي لا تخلو أبدا من الضحايا."]]}, {"l": "Joh 11:47-50", "n": "", "vs": [[47, "فعقد رؤساء الكهنة والفريسيون مجلسا، وقالوا: «ماذا نفعل؟ هذا الرجل يعمل آيات كثيرة."], [48, "فإذا تركناه وشأنه يؤمن به الجميع، فيأتي الرومانيون ويدمرون هيكلنا المقدس وأمتنا!»"], [49, "فقال واحد منهم، وهو قيافا الذي كان رئيسا للكهنة في تلك السنة: «إنكم لا تعرفون شيئا!"], [50, "ألا تفهمون أنه من الأفضل أن يموت رجل واحد فدى الأمة، بدلا من أن تهلك الأمة كلها»."]]}, {"l": "Rev 17:6", "n": "", "vs": [[6, "ورأيت المرأة سكرى لكثرة ما شربت من دم القديسين، ودم شهداء يسوع الذين قتلتهم. فتملكتني الدهشة لمنظرها،"]]}], "kwAr": "لمن يبني", "noteAr": ""}, {"kw": "blood", "raw": "Heb. bloods, Hab_2:8", "note": "Heb. bloods, Hab_2:8", "refs": [{"l": "Hab 2:8", "n": "", "vs": [[8, "لأنك سلبت أمما كثيرة فإن بقية الشعوب ينهبونك ثأرا لما سفكت من دماء وارتكبت من جور في الأرض، فدمرت مدنا وأهلكت الساكنين فيها."]]}], "kwAr": "بالدماء", "noteAr": "بالعبرية: «دماء». انظر حب 2: 8"}], "arS": [["ويل", ["H1945"]], [" لمن ", []], ["يبني", ["H1129"]], [" ", []], ["مدينة", ["H5892"]], [" ", []], ["بالدماء", ["H1818"]], ["، ", []], ["ويؤسس", ["H3559"]], [" ", []], ["قرية", ["H7151"]], [" ", []], ["بالإثم", ["H5766"]], [".", []]]}, {"c": 2, "v": 13, "text": "ألم يصدر القضاء من عند الرب القدير أن يؤول تعب الشعوب إلى النار وجهد الأمم إلى الباطل؟", "groups": [{"kw": "is it", "raw": "Gen_11:6-9; 2Sa_15:31; Job_5:13, Job_5:14; Psa_39:6, Psa_127:1, Psa_127:2; Pro_21:30; Isa_41:5-8, Isa_50:11, Isa_55:2; Jer_51:58, Jer_51:64; Mal_1:4", "note": "", "refs": [{"l": "Gen 11:6-9", "n": "", "vs": [[6, "فقال الرب: «إن كانوا، كشعب واحد ينطقون بلغة واحدة، قد عملوا هذا منذ أول الأمر، فلن يمتنع إذا عليهم أي شيء عزموا على فعله."], [7, "هيا ننزل إليهم ونبلبل لسانهم، حتى لا يفهم بعضهم كلام بعض»."], [8, "وهكذا شتتهم الرب من هناك على سطح الأرض كلها، فكفوا عن بناء المدينة،"], [9, "لذلك سميت المدينة «بابل» لأن الرب بلبل لسان أهل كل الأرض، وبالتالي شتتهم من هناك في أرجاء الأرض كلها."]]}, {"l": "2Sa 15:31", "n": "", "vs": [[31, "وقيل لداود إن أخيتوفل بين المتمردين الذين انضموا إلى أبشالوم. فصلى داود: «حمق يارب مشورة أخيتوفل»."]]}, {"l": "Job 5:13", "n": "", "vs": [[13, "أو يوقع الحكماء في خدعتهم، فتتلاشى مشورة الماكرين."]]}, {"l": "Job 5:14", "n": "", "vs": [[14, "يكتنفهم ظلام في النهار، ويتحسسون طريقهم في الظهيرة، كمن يمشي في الليل."]]}, {"l": "Psa 39:6", "n": "", "vs": [[6, "إنما كخيال يتمشى الإنسان، فعبثا يكافح الناس. يجمع الواحد منهم ثروة ولا يدري من يرثها من بعده."]]}, {"l": "Psa 127:1", "n": "", "vs": [[1, "إن لم يبن الرب البيت، فباطلا يتعب البناؤون. وإن لم يحرس الرب المدينة فباطلا يسهر الحارس."]]}, {"l": "Psa 127:2", "n": "", "vs": [[2, "باطلا تكدون من الفجر المبكر وإلى وقت متأخر من الليل في سبيل لقمة العيش، فإن الرب يسد حاجة أحبائه حتى وهم نيام."]]}, {"l": "Pro 21:30", "n": "", "vs": [[30, "ليس من حكمة، ولا من مشورة، ولا من فطنة بقادر ة على مقاومة الله."]]}, {"l": "Isa 41:5-8", "n": "", "vs": [[5, "شاهدت الجزائر فعلي وخافت، وارتجفت أقاصي الأرض فتجمعوا معا."], [6, "شرع كل واحد يشجع جاره قائلا له: تشدد."], [7, "فشجع الصانع الصائغ، والصاقل بالمطرقة الضارب على السندان قائلا عن الإلحام: هذا عمل جيد. ثم يثبت الصنم بمسامير كي لا يتقلقل."], [8, "أما أنت ياإسرائيل عبدي. يايعقوب الذي اصطفيته، ياذرية إبراهيم خليلي،"]]}, {"l": "Isa 50:11", "n": "", "vs": [[11, "انظروا، ياجميع موقدي النار، الذين يضيئون لأنفسهم مشاعل، سيروا في نور نيرانكم، وعلى وهج مشاعلكم التي أوقدتموها، وهذا ما تنالونه من يدي؛ تضطجعون وأنتم تتضورون من الألم."]]}, {"l": "Isa 55:2", "n": "", "vs": [[2, "لماذا تنفقون الفضة على ما ليس بخبز، وتتعبون لغير شبع؟ أحسنوا الاستماع إلي، وكلوا الشهي ولتتمتع أنفسكم بالدسم."]]}, {"l": "Jer 51:58", "n": "", "vs": [[58, "وهذا ما يعلنه الرب القدير: إن سور بابل العريض يقوض ويسوى بالأرض، وبواباتها العالية تحترق بالنار، ويذهب تعب الشعوب باطلا، ويكون مصير جهد الأمم للنار»."]]}, {"l": "Jer 51:64", "n": "", "vs": [[64, "وقل: كذلك تغرق بابل ولا تطفو بعد لما أوقعه عليها من عقاب فيعيا كل أهلها».إلى هنا تنتهي نبوءات إرميا."]]}, {"l": "Mal 1:4", "n": "", "vs": [[4, "وإن قال الأدوميون: مع إننا تحطمنا فإننا نبني الخرب، فإن الرب القدير يقول: هم يعمرون وأنا أهدم، ويدعو الناس بلادهم، «أرض النفاق»، وأهلها بالأمة التي سخط الرب عليها إلى الأبد."]]}], "kwAr": "ألم يصدر", "noteAr": ""}, {"kw": "for very vanity", "raw": "or, in vain", "note": "or, in vain", "refs": [], "kwAr": "إلى الباطل", "noteAr": "أو: «عبثا»."}], "arS": [["ألم", ["H2009", "H3808"]], [" يصدر القضاء ", []], ["من", ["H4480"]], [" ", []], ["عند", ["H854"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["القدير", ["H6635"]], [" أن يؤول ", []], ["تعب", ["H3021"]], [" ", []], ["الشعوب", ["H5971"]], [" إلى ", []], ["النار", ["H784"]], [" ", []], ["وجهد", ["H3286"]], [" ", []], ["الأمم", ["H3816"]], [" إلى ", []], ["الباطل", ["H1767", "H7385"]], ["؟", []]]}, {"c": 2, "v": 14, "text": "لأن الأرض ستمتليء من معرفة مجد الرب كما تغمر المياه البحر.", "groups": [{"kw": "the earth", "raw": "Psa_22:27, Psa_67:1, Psa_67:2, Psa_72:19, Psa_86:9, Psa_98:1-3; Isa_6:3, Isa_11:9; Zec_14:8, Zec_14:9; Rev_11:15, Rev_15:4", "note": "", "refs": [{"l": "Psa 22:27", "n": "", "vs": [[27, "تتذكر جميع أقاصي الأرض وترجع إلى الرب، وتتعبد أمامك جميع قبائل الأمم."]]}, {"l": "Psa 67:1", "n": "", "vs": [[1, "ليترَأف الله علينا وليباركنا، وليضيء بوجهه علينا"]]}, {"l": "Psa 67:2", "n": "", "vs": [[2, "لكي يعرف في الأرض طريقك، وبين جميع الأمم خلاصك."]]}, {"l": "Psa 72:19", "n": "", "vs": [[19, "تبارك اسمه المجيد إلى الأبد، ولتمتليء الأرض كلها من مجده. آمين ثم آمين."]]}, {"l": "Psa 86:9", "n": "", "vs": [[9, "تقبل جميع الأمم التي صنعتها لتسجد أمامك يارب وتمجد اسمك."]]}, {"l": "Psa 98:1-3", "n": "", "vs": [[1, "رنموا للرب ترنيمة جديدة، لأنه قد صنع عجائب. وبيمينه وذراعه المقدسة أحرز خلاصا."], [2, "أعلن الرب خلاصه؛ أمام أنظار الأمم كشف بره."], [3, "ذكر رحمته وأمانته لبيت إسرائيل. رأت كل أقاصي الأرض خلاص إلهنا."]]}, {"l": "Isa 6:3", "n": "", "vs": [[3, "ونادى أحدهم الآخر: «قدوس، قدوس، قدوس الرب القدير. مجده ملء كل الأرض»."]]}, {"l": "Isa 11:9", "n": "", "vs": [[9, "لا يؤذون ولا يسيئون في كل جبل قدسي، لأن الأرض تمتليء من معرفة الرب كما تغمر المياه البحر."]]}, {"l": "Zec 14:8", "n": "", "vs": [[8, "في ذلك اليوم تجري مياه حية من أورشليم، يصب نصفها في البحر الشرقي (البحر الميت)، ونصفها الآخر في البحر الغربي (البحر الأبيض المتوسط) طوال الصيف والشتاء."]]}, {"l": "Zec 14:9", "n": "", "vs": [[9, "ويملك الرب على الأرض كلها، فيكون في ذلك اليوم رب واحد لا يذكر سوى اسمه."]]}, {"l": "Rev 11:15", "n": "", "vs": [[15, "ونفخ الملاك السابع في بوقه فسمعت أصوات عالية في السماء تقول: «قد صار ملك العالم لربنا ومسيحه. إنه يملك إلى أبد الآبدين»."]]}, {"l": "Rev 15:4", "n": "", "vs": [[4, "من لا يخافك يارب ولا يمجد اسمك؟ فأنت وحدك قدوس! والأمم جميعا سيأتون ويسجدون لك، لأن أحكامك قد ظهرت جلية»."]]}], "kwAr": "الأرض", "noteAr": ""}, {"kw": "with the knowledge of the glory", "raw": "or, by knowing the glory", "note": "or, by knowing the glory", "refs": [], "kwAr": "من معرفة مجد الرب", "noteAr": "أو: «بمعرفة مجد…»."}], "arS": [["لأن", ["H3588"]], [" ", []], ["الأرض", ["H776"]], [" ", []], ["ستمتليء", ["H4390"]], [" من ", []], ["معرفة", ["H1847"]], [" ", []], ["مجد", ["H3519"]], [" ", []], ["الرب", ["H3068"]], [" كما ", []], ["تغمر", ["H3680", "H5921"]], [" ", []], ["المياه", ["H4325"]], [" ", []], ["البحر", ["H3220"]], [".", []]]}, {"c": 2, "v": 15, "text": "ويل لمن يسقي صاحبه من كأس الغضب إلى أن يسكر لينظر إلى خزيه.", "groups": [{"kw": "unto", "raw": "Gen_19:32-35; 2Sa_11:13, 2Sa_13:26-28; Jer_25:15, Jer_51:7; Rev_17:2, Rev_17:6, Rev_18:3", "note": "", "refs": [{"l": "Gen 19:32-35", "n": "", "vs": [[32, "فتعالي نسقيه خمرا ونضطجع معه فلا تنقطع ذرية أبينا»."], [33, "فسقتا في تلك الليلة أباهما خمرا، وأقبلت الابنة الكبرى وضاجعت أباها فلم يعلم باضطجاعها ولا بقيامها."], [34, "وفي اليوم الثاني قالت الابنة البكر لأختها الصغيرة: «إني قد اضطجعت مع أبي ليلة أمس، فتعالي نسقيه الليلة أيضا خمرا ثم ادخلي واضطجعي معه فنحيي من أبينا نسلا»."], [35, "فسقتا أباهما خمرا في تلك الليلة أيضا وأقبلت الابنة الصغيرة وضاجعت أباها. فلم يعلم باضطجاعها ولا بقيامها."]]}, {"l": "2Sa 11:13", "n": "", "vs": [[13, "ولبى دعوة الملك، فأكل في حضرته وشرب حتى أسكره داود. ثم خرج عند المساء ليرقد في مضجعه إلى جوار رجال سيده، ولم يتوجه إلى بيته أيضا."]]}, {"l": "2Sa 13:26-28", "n": "", "vs": [[26, "فقال أبشالوم: «إذا دع أخي أمنون يذهب معنا» فقال الملك: «ولماذا يذهب أمنون معك؟»"], [27, "فألح عليه أبشالوم حتى رضي أن يذهب أمنون وأبناء الملك مع أبشالوم."], [28, "وأوصى أبشالوم رجاله: «متى ذهبت الخمر بعقل أمنون وقلت لكم اضربوا أمنون واقتلوه، فلا تخافوا. ألست أنا الذي أمرتكم بذلك؟ تشجعوا وتصرفوا كأبطال»."]]}, {"l": "Jer 25:15", "n": "", "vs": [[15, "وهذا ما أعلنه لي الرب إله إسرائيل: «خذ كأس خمر غضبي من يدي، واسق منها جميع الأمم التي أرسلك إليها،"]]}, {"l": "Jer 51:7", "n": "", "vs": [[7, "كانت بابل كأس ذهب في يد الله، فسكر ت الأرض قاطبة. تجرعت الأمم من خمرها، لذلك جنت الشعوب."]]}, {"l": "Rev 17:2", "n": "", "vs": [[2, "والتي زنى معها ملوك الأرض، وسكر أهل الأرض من خمر زناها»."]]}, {"l": "Rev 17:6", "n": "", "vs": [[6, "ورأيت المرأة سكرى لكثرة ما شربت من دم القديسين، ودم شهداء يسوع الذين قتلتهم. فتملكتني الدهشة لمنظرها،"]]}, {"l": "Rev 18:3", "n": "", "vs": [[3, "لأن جميع الأمم شربت من خمر زناها، وملوك الأرض زنوا معها، وتجار الأرض اغتنوا من كثرة ترفها!»"]]}], "kwAr": "ويل لمن", "noteAr": ""}, {"kw": "that puttest", "raw": "Hos_7:5", "note": "", "refs": [{"l": "Hos 7:5", "n": "", "vs": [[5, "في يوم احتفال ملكنا انتشى الرؤساء من سورة الخمر، وانضم هو إلى المتبذلين."]]}], "kwAr": "يسقي", "noteAr": ""}, {"kw": "that thou", "raw": "Gen_9:22; Exo_32:25", "note": "", "refs": [{"l": "Gen 9:22", "n": "", "vs": [[22, "فشاهد حام أبو الكنعانيين عري أبيه، فخرج وأخبر أخويه اللذين كانا خارجا."]]}, {"l": "Exo 32:25", "n": "", "vs": [[25, "ولما رأى موسى أن الشعب غارق في مجونه بعد أن أفلت هرون زمامهم فصاروا بذلك مثار سخرية أعدائهم،"]]}], "kwAr": "لينظر", "noteAr": ""}], "arS": [["ويل", ["H1945"]], [" لمن ", []], ["يسقي", ["H8248"]], [" ", []], ["صاحبه", ["H7453"]], [" من ", []], ["كأس", ["H5596", "H2573"]], [" الغضب إلى أن ", []], ["يسكر", ["H7937"]], [" ", []], ["لينظر", ["H5027"]], [" إلى ", []], ["خزيه", ["H4589"]], [".", []]]}, {"c": 2, "v": 16, "text": "فأنت تشبع خزيا عوض المجد، فاشرب أنت، وترنح، فإن كأس يمين الرب تدور عليك ويجلل العار مجدك.", "groups": [{"kw": "with shame for glory", "raw": "or, more with shame than with glory, Pro_3:35; Isa_47:3; Hos_4:7; Phi_3:19", "note": "or, more with shame than with glory, Pro_3:35; Isa_47:3; Hos_4:7; Phi_3:19", "refs": [{"l": "Pro 3:35", "n": "", "vs": [[35, "يرث الحكماء كرامة، أما الحمقى فيرتدون العار."]]}, {"l": "Isa 47:3", "n": "", "vs": [[3, "فيظل عريك مكشوفا وعارك ظاهرا، فإني أنتقم ولا أعفو عن أحد."]]}, {"l": "Hos 4:7", "n": "", "vs": [[7, "وبقدر ما تكاثروا تفاقمت خطيئتهم، لذلك أحول مجدهم إلى عار."]]}, {"l": "Phi 3:19", "n": "", "vs": [[19, "الذين مصيرهم الهلاك، وإلههم بطونهم، ومفخرتهم في عيبتهم، وفكرهم منصرف إلى الأمور الأرضية."]]}], "kwAr": "خزيا عوض المجد", "noteAr": "أو: «بالخزي أكثر من المجد». انظر أم 3: 35؛ إش 47: 3؛ هو 4: 7؛ في 3: 19"}, {"kw": "drink", "raw": "Psa_75:8; Isa_49:26, Isa_51:21-23; Jer_25:26, Jer_25:27, Jer_51:57; Rev_18:6", "note": "", "refs": [{"l": "Psa 75:8", "n": "", "vs": [[8, "في يد الرب كأس خمر مزبدة ممزوجة. يصبها فيشربها كل الأشرار حتى ثمالتها."]]}, {"l": "Isa 49:26", "n": "", "vs": [[26, "وأجعل مضطهديك يلتهمون لحوم أجسادهم، ويسكرون بدمهم كمن يشرب خمرا. عندئذ يدرك كل ذي جسد أنني أنا الرب مخلصك وفاديك إله يعقوب القدير."]]}, {"l": "Isa 51:21-23", "n": "", "vs": [[21, "لذلك اسمعي هذا أيتها المنكوبة، والسكرى ولكن من غير خمر."], [22, "هذا ما يقوله سيدك الرب، إلهك الذي يدافع عن دعوى شعبه: ها أنا قد أخذت من يدك كأس الترنح، ولن تجرعي من كأس غضبي بعد."], [23, "وأضعها في يد معذبيك الذين قالوا لك: انحني حتى ندوس عليك عابرين. فجعلت ظهرك لهم أرضا، وطريقا لهم يمرون عليه."]]}, {"l": "Jer 25:26", "n": "", "vs": [[26, "وكل ملوك الشمال، القريبين والبعيدين، الواحد تلو الآخر، وكل الممالك المنتشرة على وجه الأرض. ثم بعد ذلك يشرب منها ملك بابل."]]}, {"l": "Jer 25:27", "n": "", "vs": [[27, "ثم قل لهم، هذا ما يعلنه الرب القدير إله إسر ائيل: اشربوا واثملوا وتقيأوا واسقطوا صرعى، ولا تقوموا من جراء السيف الذي أرسله في وسطكم."]]}, {"l": "Jer 51:57", "n": "", "vs": [[57, "إني أسكر رؤساءها وحكماءها ومحاربيها، فينامون نوما أبديا لا يقظة منه، يقول الملك، الرب القدير اسمه."]]}, {"l": "Rev 18:6", "n": "", "vs": [[6, "افعلوا بها كما فعلت بكم، وضاعفوا لها جزاء ما اقترفت. في الكأس التي مزجت فيها للآخرين، امزجوا لها ضعفا."]]}], "kwAr": "فاشرب", "noteAr": ""}, {"kw": "and let", "raw": "Isa_20:4, Isa_47:3; Nah_3:5", "note": "", "refs": [{"l": "Isa 20:4", "n": "", "vs": [[4, "هكذا يقود ملك أشور أسرى مصر وكوش صغارا وكبارا، عراة حفاة بأقفية مكشوفة، عارا لمصر."]]}, {"l": "Isa 47:3", "n": "", "vs": [[3, "فيظل عريك مكشوفا وعارك ظاهرا، فإني أنتقم ولا أعفو عن أحد."]]}, {"l": "Nah 3:5", "n": "", "vs": [[5, "ها أنا أقاومك، يقول الرب القدير، فأكشف عارك لأطلع الأمم على عورتك والممالك على خزيك."]]}], "kwAr": "وترنح", "noteAr": ""}, {"kw": "the cup", "raw": "Jer_25:27-29", "note": "", "refs": [{"l": "Jer 25:27-29", "n": "", "vs": [[27, "ثم قل لهم، هذا ما يعلنه الرب القدير إله إسر ائيل: اشربوا واثملوا وتقيأوا واسقطوا صرعى، ولا تقوموا من جراء السيف الذي أرسله في وسطكم."], [28, "وإن أبوا أن يتناولوا الكأس من يدك ليشربوا منها، فقل لهم: هذا ما يعلنه الرب القدير: لابد لكم من شربها،"], [29, "لأني شرعت أعاقب المدينة التي دعي اسمي عليها، فهل تفلتون أنتم من العقاب؟ فها أنا قد سلطت السيف على جميع سكان الأرض، يقول الرب القدير."]]}], "kwAr": "كأس", "noteAr": ""}, {"kw": "and shameful", "raw": "Isa_28:7, Isa_28:8; Hos_7:5", "note": "", "refs": [{"l": "Isa 28:7", "n": "", "vs": [[7, "ولكن هؤلاء أيضا أضلتهم الخمر وترنحوا بالسكر، فسلب المسكر عقول أنبيائهم وكهنتهم، فأربكهم ورنحهم، فأخطأوا الرؤيا، وتعثروا في الأحكام."]]}, {"l": "Isa 28:8", "n": "", "vs": [[8, "فامتلأت موائدهم كلها بالقيء، ولم يبق مكان لم يتلوث."]]}, {"l": "Hos 7:5", "n": "", "vs": [[5, "في يوم احتفال ملكنا انتشى الرؤساء من سورة الخمر، وانضم هو إلى المتبذلين."]]}], "kwAr": "ويجلل العار", "noteAr": ""}], "arS": [["فأنت ", []], ["تشبع", ["H7646"]], [" ", []], ["خزيا", ["H7036"]], [" ", []], ["عوض", ["H4480"]], [" ", []], ["المجد", ["H3519"]], ["، ", []], ["فاشرب", ["H8354"]], [" ", []], ["أنت", ["H859", "H1571"]], ["، ", []], ["وترنح", ["H6188"]], ["، فإن ", []], ["كأس", ["H3563"]], [" ", []], ["يمين", ["H3225"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["تدور", ["H5437"]], [" ", []], ["عليك", ["H5921"]], [" ", []], ["ويجلل", ["H7022"]], [" العار ", []], ["مجدك", ["H3519"]], [".", []]]}, {"c": 2, "v": 17, "text": "لأن ما ارتكبته من ظلم في حق لبنان يغطيك، وما أهلكته من بهائم يروعك. من أجل ما سفكته من دماء واقترفته من جور في الأرض والمدن والساكنين فيها.", "groups": [{"kw": "the violence", "raw": "Zec_11:1", "note": "", "refs": [{"l": "Zec 11:1", "n": "", "vs": [[1, "افتح أبوابك يالبنان حتى تلتهم النار أرزك."]]}], "kwAr": "ظلم", "noteAr": ""}, {"kw": "because", "raw": "Hab_2:8; Psa_55:23, Psa_137:8; Pro_28:17; Rev_18:20-24", "note": "", "refs": [{"l": "Hab 2:8", "n": "", "vs": [[8, "لأنك سلبت أمما كثيرة فإن بقية الشعوب ينهبونك ثأرا لما سفكت من دماء وارتكبت من جور في الأرض، فدمرت مدنا وأهلكت الساكنين فيها."]]}, {"l": "Psa 55:23", "n": "", "vs": [[23, "وأنت ياالله تطرح الأشرار إلى هوة الهلاك وتقصر أعمار سافكي الدماء والغشاشين. أما أنا فأتكل عليك."]]}, {"l": "Psa 137:8", "n": "", "vs": [[8, "يابنت بابل المحتم خرابها، طوبى لمن يجازيك بما جزيتنا به."]]}, {"l": "Pro 28:17", "n": "", "vs": [[17, "من هو مثقل بارتكاب سفك دم، يظل طريدا حتى وفاته، ولا يعينه أحد."]]}, {"l": "Rev 18:20-24", "n": "", "vs": [[20, "اشمتي بها أيتها السماء! واشمتوا بها أيها القديسون والرسل والأنبياء، فقد أصدر الله حكمه عليها بعدما أصدرت أحكامها عليكم»."], [21, "وتناول ملاك قوي حجرا كأنه حجر طاحونة عظيم وألقاه في البحر قائلا: «هكذا تدفع وتطرح بابل المدينة العظمى، فتختفي إلى الأبد!"], [22, "لن يسمع فيك عزف موسيقى بعد، لا صوت قيثارة ولا مزمار ولا بوق، ولن تقوم فيك صناعة بعد الآن، ولن يسمع فيك صوت رحى"], [23, "ولن يضيء فيك نور مصباح. ولن يسمع فيك صوت عريس وعروس. فقد كان تجارك سادة الأرض، وبسحرك ضللت جميع الأمم."], [24, "وفيها وجدت دماء أنبياء وقديسين وجميع الذين قتلوا على الأرض»."]]}], "kwAr": "من أجل", "noteAr": ""}, {"kw": "of the city", "raw": "Jer_50:28, Jer_50:33, Jer_50:34, Jer_51:24, Jer_51:34-37", "note": "", "refs": [{"l": "Jer 50:28", "n": "", "vs": [[28, "اسمعوا! ها جلبة الفارين الناجين من ديار بابل لكي يذيعوا في صهيون أنباء انتقام الرب إلهنا والثأر لهيكله."]]}, {"l": "Jer 50:33", "n": "", "vs": [[33, "وهذا ما يعلنه الرب القدير: «قد وقع الظلم على شعب إسرائيل وعلى شعب يهوذا، وجميع الذين سبوهم تشبثوا بهم وأبوا أن يطلقوهم."]]}, {"l": "Jer 50:34", "n": "", "vs": [[34, "غير أن فاديهم قوي، الرب القدير اسمه، وهو حتما يدافع عن قضيتهم لكي يشيع راحة في الأرض ويقلق أهل بابل."]]}, {"l": "Jer 51:24", "n": "", "vs": [[24, "سأجازي بابل وسائر الكلدانيين على كل شرهم الذي ارتكبوه في حق صهيون، على مرأى منكم، يقول الرب."]]}, {"l": "Jer 51:34-37", "n": "", "vs": [[34, "«يقول المسبيون: قد افترسنا نبوخذناصر ملك بابل وسحقنا وجعلنا إناء فارغا. ابتلعنا كتنين، وملأ جوفه من أطايبنا، ثم لفظنا من فمه."], [35, "يقول أهل أورشليم: ليحل ببابل ما أصابنا وأصاب لحومنا من ظلم. وتقول أورشليم: دمي على أهل أرض الكلدانيين."], [36, "لذلك هذا ما يعلنه الرب: ها أنا أدافع عن دعواك وأنتقم لك، فأجفف بحر بابل وينابيعها،"], [37, "فتصير بابل ركاما ومأوى لبنات آوى، ومثار دهشة وصفير وأرضا موحشة."]]}], "kwAr": "المدن", "noteAr": ""}], "arS": [["لأن", ["H3588"]], [" ما ارتكبته من ", []], ["ظلم", ["H2555"]], [" في حق ", []], ["لبنان", ["H3844"]], [" ", []], ["يغطيك", ["H3680"]], ["، وما ", []], ["أهلكته", ["H7701"]], [" من ", []], ["بهائم", ["H929"]], [" ", []], ["يروعك", ["H2865"]], [". ", []], ["من أجل", ["H4480"]], [" ما ", []], ["سفكته", ["H1818"]], [" من ", []], ["دماء", ["H120"]], [" واقترفته من ", []], ["جور", ["H2555"]], [" في ", []], ["الأرض", ["H776"]], [" ", []], ["والمدن", ["H7151"]], [" ", []], ["والساكنين", ["H3427"]], [" فيها.", []]]}, {"c": 2, "v": 18, "text": "أي جدوى من تمثال حتى يصوغه صانع، أو صنم يعلم الكذب لأن من يصنعه يتكل على ما صنعه، وهو لم يصنع سوى أصنام بكماء.", "groups": [{"kw": "profiteth", "raw": "Isa_37:38, Isa_42:17, Isa_44:9, Isa_44:10, Isa_45:16, Isa_45:20, Isa_46:1, Isa_46:2, Isa_46:6-8; Jer_2:27, Jer_2:28, Jer_10:3-5; Jer_50:2; Rom_6:21", "note": "", "refs": [{"l": "Isa 37:38", "n": "", "vs": [[38, "وفيما هو يتعبد في هيكل إلهه نسروخ اغتاله ابناه أدرملك وشرآصر وفرا إلى أرض أراراط، فخلفه ابنه آسرحدون على العرش."]]}, {"l": "Isa 42:17", "n": "", "vs": [[17, "أما المتوكلون على الأصنام، القائلون للأوثان: «أنتم آلهتنا» فإنهم يدبرون مجللين بالخزي."]]}, {"l": "Isa 44:9", "n": "", "vs": [[9, "كل صانعي التماثيل لا جدوى منهم، ومشتهياتهم لا طائل منها. وهم شهود عليها أنها لا تبصر ولا تعلم لكي يخزوا."]]}, {"l": "Isa 44:10", "n": "", "vs": [[10, "من يصور صنما أو يسبك تمثالا لا ترتجى منه فائدة؟"]]}, {"l": "Isa 45:16", "n": "", "vs": [[16, "لقد خزوا وخجلوا جميعهم، ومضى صانعو الأصنام وهم يجرون أذيال العار."]]}, {"l": "Isa 45:20", "n": "", "vs": [[20, "اجتمعوا وتعالوا. اقتربوا معا أيها الناجون من الأمم، فإن الجهال وحدهم هم الذين يحملون الأصنام الخشبية ويواظبون على الصلاة لإله لا يخلص."]]}, {"l": "Isa 46:1", "n": "", "vs": [[1, "قد خر وانحنى بيل ونبو إلها بابل وحملوا تماثيلهما على الحمير المرهقة التي ناءت بأثقالها."]]}, {"l": "Isa 46:2", "n": "", "vs": [[2, "سقطت جميعها وعجزت عن حماية نفسها بل أخذت هي نفسها إلى السبي مع المأسورين."]]}, {"l": "Isa 46:6-8", "n": "", "vs": [[6, "هل بالذين يفرغون الذهب من الكيس ويزنون الفضة بالميزان، ويستأجرون صائغا ليسبكها إلها، ويخرون لها ساجدين؟"], [7, "يرفعونها على أكتافهم وينقلونها لينصبوها في موضعها حيث تستقر هناك لا تبرح من مكانها، وإن استغاث بها أحد لا تستجيب ولا تنجيه من محنته؟"], [8, "اذكروا هذا واتعظوا. انقشوه في أذهانكم ياعصاة!"]]}, {"l": "Jer 2:27", "n": "", "vs": [[27, "إذ قالوا لنصب الخشب: أنت أبي، وللحجر المنحوت صنما: أنت أنجبتني. وولوا أدبارهم وليس وجوههم نحوي، وفي وقت بليتهم استغاثوا بي قائلين: قم وأنقذنا."]]}, {"l": "Jer 2:28", "n": "", "vs": [[28, "فأين إذا الآلهة التي صنعتموها لأنفسكم؟ لتقم إن كانت قادرة على إنقاذكم في وقت ضيقكم، لأن عدد آلهتكم ياأبناء يهوذا صار كعدد مدنكم."]]}, {"l": "Jer 10:3-5", "n": "", "vs": [[3, "لأن عادات الأمم باطلة، إذ تقطع الشجرة من الغابة ثم تشذبها وتنحتها يدا صانع بفأس."], [4, "ثم يزينونها بالفضة والذهب وتثبت بالمسامير والمطارق لئلا تتحرك."], [5, "فتكون كفزاعة في حقل قثاء لا تنطق، بل تحمل لأنها عاجزة عن المشي. فلا تخافوها لأنها لا تضر ولا تنفع»."]]}, {"l": "Jer 50:2", "n": "", "vs": [[2, "«أذيعوا بين الأمم، وأعلنوا. انصبوا الراية وخبروا. لا تكتموا. قولوا: قد تم الاستيلاء على بابل ولحق ببيل العار وتحطم مرودخ. خربت أصنامها وانسحقت أوثانها."]]}, {"l": "Rom 6:21", "n": "", "vs": [[21, "ولكن أي ثمر أنتجتم حينذاك من الأمور التي تخجلون بها الآن، وما عاقبتها إلا الموت؟"]]}], "kwAr": "جدوى", "noteAr": ""}, {"kw": "a teacher", "raw": "Jer_10:8, Jer_10:14, Jer_10:15; Jon_2:8; Zec_10:2; Rom_1:23-25; 2Th_2:9-11; 1Ti_4:1, 1Ti_4:2; Rev_13:11-15, Rev_19:20", "note": "", "refs": [{"l": "Jer 10:8", "n": "", "vs": [[8, "جميعهم بلداء وحمقى، يتلقفون العلم من أصنام خشبية."]]}, {"l": "Jer 10:14", "n": "", "vs": [[14, "كل امريء خامل وعديم المعرفة، وكل صائغ أخزاه تمثاله لأن صنمه المسبوك كاذب ولا حياة فيه."]]}, {"l": "Jer 10:15", "n": "", "vs": [[15, "جميع الأصنام باطلة، صنعة ضلال، وفي زمن عقابها تبيد."]]}, {"l": "Jon 2:8", "n": "", "vs": [[8, "إن الذين يبجلون الأصنام الباطلة يتخلون عن مصدر نعمتهم."]]}, {"l": "Zec 10:2", "n": "", "vs": [[2, "أما الأوثان فإنها تنطق بالباطل، ويرى العرافون رؤى كاذبة، وينبئون بأحلام زور. وعبثا يعزون. لذلك شرد الناس كغنم، وقاسوا مشقة لافتقارهم إلى راع."]]}, {"l": "Rom 1:23-25", "n": "", "vs": [[23, "واستبدلوا بمجد الله الخالد تماثيل لصور الإنسان الفاني والطيور وذوات الأربع والزواحف."], [24, "لذلك أسلمهم الله ، في شهوات قلوبهم، إلى النجاسة، ليهينوا أجسادهم فيما بينهم."], [25, "إذ قد استبدلوا بحق الله ما هو باطل، فاتقوا المخلوق وعبدوه بدل الخالق، المبارك إلى الأبد. آمين!"]]}, {"l": "2Th 2:9-11", "n": "", "vs": [[9, "أما بروز المتمرد، فسوف يكون بقدر طاقة الشيطان على المعجزات والعلامات والعجائب المزيفة كلها،"], [10, "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا."], [11, "ولهذا السبب، سيرسل الله إليهم طاقة الضلال حتى يصدقوا ما هو دجل،"]]}, {"l": "1Ti 4:1", "n": "", "vs": [[1, "إلا أن الروح يعلن صراحة أن قوما في الأزمنة الأخيرة سوف يرتدون عن الإيمان، منساقين وراء أرواح مضللة وتعاليم شيطانية،"]]}, {"l": "1Ti 4:2", "n": "", "vs": [[2, "في موجة رياء ينشرها معلمون دجالون لهم ضمائر كويت بالنار."]]}, {"l": "Rev 13:11-15", "n": "", "vs": [[11, "ثم رأيت وحشا آخر خارجا من الأرض، له قرنان صغيران كقرني خروف، ولكن صوته كصوت تنين،"], [12, "وقد استمد سلطته من الوحش الأول الذي خرج من البحر ليعمل بها في حضوره، فجعل سكان الأرض يسجدون للوحش الأول الذي شفي من جرحه المميت."], [13, "وقام الوحش الثاني بآيات خارقة، حتى إنه أنزل من السماء نارا على الأرض بمشهد من الناس جميعا،"], [14, "فخدع سكان الأرض بالآيات التي كان يقوم بها في حضور الوحش الأول. وأمر سكان الأرض أن يقيموا تمثالا للوحش الأول الذي كان قد جرح جرحا مميتا ولكنه عاش!"], [15, "وأعطي سلطة على أن يبعث الروح في التمثال لينطق، وأن يمد يده فيقتل كل من يرفض السجود لتمثال الوحش،"]]}, {"l": "Rev 19:20", "n": "", "vs": [[20, "فقبض على الوحش وعلى النبي الدجال الذي قام بالمعجزات في حضور الوحش وأضل بها الذين قبلوا علامة الوحش، وسجدوا لتمثاله. وطرح كلاهما حيا في بحيرة النار والكبريت المتقدة،"]]}], "kwAr": "يعلم الكذب", "noteAr": ""}, {"kw": "that the", "raw": "Psa_115:4-8, Psa_135:15-18; Isa_1:31, Isa_44:14-20", "note": "", "refs": [{"l": "Psa 115:4-8", "n": "", "vs": [[4, "أما أوثانهم فهي فضة وذهب من صنع أيدي البشر."], [5, "لها أفواه لكنها لا تنطق. لها عيون ولكنها لا تبصر."], [6, "وآذان لكنها لا تسمع. وأنوف لكنها لا تشم."], [7, "لها أيد لكنها لا تلمس. وأرجل لكنها لا تمشي، ولا تصدر من حناجرها صوتا."], [8, "مثلها يصير صانعوها وكل من يتوكل عليها."]]}, {"l": "Psa 135:15-18", "n": "", "vs": [[15, "أما أصنام الأمم فهي من فضة وذهب، صنعة أيدي الناس."], [16, "لها أفواه لكنها لا تتكلم، وعيون لكنها لا ترى."], [17, "وآذان لكنها لا تسمع. وليس في أفواهها نسمة حياة."], [18, "مثلها يصير صانعوها وكل من يتوكل عليها."]]}, {"l": "Isa 1:31", "n": "", "vs": [[31, "فيصير القوي كنسالة وأعماله (الشريرة) شرارة لاهبة فيحترقان معا بنار لا يقوى أحد على إخمادها»."]]}, {"l": "Isa 44:14-20", "n": "", "vs": [[14, "يقطع شجرة أرز أو يختار سنديانا أو بلوطا. يتركها تنمو بين أشجار الغابة. أو يزرع شجرة صنوبر فينميها المطر."], [15, "ثم تصبح وقودا لنيران الناس: يأخذ بعضا منها ليدفيء نفسه، أو يوقده ليخبز خبزه، أو ينحت منه إلها يعبده، يصنع منه تمثالا يخر أمامه ساجدا."], [16, "يوقد نصفه في النار وعلى نصفه الآخر يأكل لحما، يشوي شواء ويشبع، ويدفيء نفسه قائلا: آه، أنا مستدفيء، وأرى نارا."], [17, "ويصنع ما تبقى منه إلها، صنما يخر أمامه ساجدا مبتهلا إليه قائلا: أنقذني. أنت إلهي."], [18, "إنهم لا يفقهون ولا يدركون، إذ غشي على عيونهم فلا يبصرون، وأغلق على قلوبهم فلا يفهمون."], [19, "ليس من متأمل أو ذي معرفة أو إدراك يقول: قد أحرقت نصف الشجرة بالنار وخبزت خبزي على جمراتها، شويت لحما عليها وأكلته. أفأصنع من بقيتها رجسا وأسجد أمام قطعة خشب؟"], [20, "لكأنه يأكل الرماد! يجري وراء سراب ويعجز عن إنقاذ نفسه أو الاعتراف أن الصنم الذي يمسكه بيده هو محض ضلال!"]]}], "kwAr": "لأن", "noteAr": ""}, {"kw": "maker of his work", "raw": "Heb. fashioner of his fashion", "note": "Heb. fashioner of his fashion", "refs": [], "kwAr": "يصنعه", "noteAr": "بالعبرية: «صانع صنعته»."}, {"kw": "dumb", "raw": "1Co_12:2", "note": "", "refs": [{"l": "1Co 12:2", "n": "", "vs": [[2, "تعلمون أنكم، عندما كنتم من الأمم، كنتم تنجرفون إلى الأصنام الخرساء أيما انجراف."]]}], "kwAr": "بكماء", "noteAr": ""}], "arS": [["أي ", []], ["جدوى", ["H3276", "H4100"]], [" من ", []], ["تمثال", ["H6459"]], [" حتى ", []], ["يصوغه", ["H6458"]], [" ", []], ["صانع", ["H3335"]], ["، أو ", []], ["صنم", ["H4541"]], [" ", []], ["يعلم", ["H3384"]], [" ", []], ["الكذب", ["H8267"]], [" ", []], ["لأن", ["H3588"]], [" من ", []], ["يصنعه", ["H3335"]], [" ", []], ["يتكل", ["H982"]], [" على ما ", []], ["صنعه", ["H3336"]], ["، وهو لم ", []], ["يصنع", ["H6213"]], [" سوى ", []], ["أصنام", ["H457"]], [" ", []], ["بكماء", ["H483"]], [".", []]]}, {"c": 2, "v": 19, "text": "ويل لمن يقول لمنحوت خشبي: «استيقظ» أو لحجر أبكم: «انهض». أيمكن أن يهدي؟ إنما هو مغشى بالذهب والفضة وخال من كل حياة.", "groups": [{"kw": "that", "raw": "1Ki_18:26-29; Psa_97:7; Isa_44:17; Jer_51:47; Dan_3:7, Dan_3:18, Dan_3:29, Dan_5:23; Jon_1:5", "note": "", "refs": [{"l": "1Ki 18:26-29", "n": "", "vs": [[26, "فأحضروا الثور الذي أعطي لهم ووضعوه على المذبح، وظلوا يدعون باسم البعل من الصباح إلى الظهر قائلين: «يابعل استجب لنا». فلم يكن هناك صوت أو مجيب. فراحوا يرقصون حول المذبح المشيد."], [27, "وعند الظهر سخر بهم إيليا وقال: «ادعوا بصوت أعلى فهو حقا إله! لعله مستغرق في التأمل أو في خلوة أو في سفر! أو لعله نائم فيستيقظ»."], [28, "فشرعوا يهتفون بصوت أعلى، ويمزقون أجسادهم بالسيوف والرماح كعادتهم، حتى سال منهم الدم."], [29, "وانقضت ساعات الظهر، وظلوا يهذون صارخين حتى حل وقت إصعاد التقدمة المسائية، من غير أن يكون هناك صوت أو مجيب."]]}, {"l": "Psa 97:7", "n": "", "vs": [[7, "يخزى كل عابدي التماثيل المنحوتة، المفتخرين بالأصنام. اسجدوا له ياجميع الآلهة."]]}, {"l": "Isa 44:17", "n": "", "vs": [[17, "ويصنع ما تبقى منه إلها، صنما يخر أمامه ساجدا مبتهلا إليه قائلا: أنقذني. أنت إلهي."]]}, {"l": "Jer 51:47", "n": "", "vs": [[47, "لذلك ها أيام مقبلة أعاقب فيها أصنام بابل ويلحق العار بأرضها كلها، ويتساقط قتلاها في وسطها."]]}, {"l": "Dan 3:7", "n": "", "vs": [[7, "لهذا حالما سمعت الشعوب الحاضرة أصوات تلك الالات الموسيقية المختلفة، انحنت وسجدت لتمثال الذهب المنصوب."]]}, {"l": "Dan 3:18", "n": "", "vs": [[18, "وحتى إن لم ينقذنا، فاعلم يقينا أيها الملك أننا لا نعبد آلهتك، ولا نسجد لتمثال الذهب الذي نصبته»."]]}, {"l": "Dan 3:29", "n": "", "vs": [[29, "لهذا قد صدر مني أمر أن أي شعب أو أمة أو قوم من أي لسان يذمون إله شدرخ وميشخ وعبدنغو، يمزقون إربا إربا، وتصبح بيوتهم أنقاضا، إذ ليس هناك إله آخر يقدر أن ينجي مثله»."]]}, {"l": "Dan 5:23", "n": "", "vs": [[23, "بل تغطرست على رب السماء، فأحضروا أمامك آنية هيكله لتشرب بها الخمر، أنت ونبَلاء دولتك وزوجاتك ومحظياتك، وسبحت آلهة الفضة والذهب والنحاس والحديد والخشب والحجر التي لا تبصر ولا تسمع ولا تدرك، أما الله الذي بيده روحك وله كل طرقك، فلم تمجده."]]}, {"l": "Jon 1:5", "n": "", "vs": [[5, "ففزع الملاحون واستغاث كل واحد منهم بإلهه، وطرحوا ما في السفينة من أمتعة ليخففوا من حمولتها. أما يونان فلجأ إلى جوف السفينة ورقد مستغرقا في نوم عميق."]]}], "kwAr": "ويل لمن", "noteAr": ""}, {"kw": "it is", "raw": "Isa_40:19, Isa_46:6; Jer_10:4, Jer_10:9; Dan_3:1; Act_17:29; Rev_17:4", "note": "", "refs": [{"l": "Isa 40:19", "n": "", "vs": [[19, "إن كان تمثالا فالتمثال يصوغه الصانع ويغشيه الصائغ بالذهب، ويسبك له سلاسل من الفضة."]]}, {"l": "Isa 46:6", "n": "", "vs": [[6, "هل بالذين يفرغون الذهب من الكيس ويزنون الفضة بالميزان، ويستأجرون صائغا ليسبكها إلها، ويخرون لها ساجدين؟"]]}, {"l": "Jer 10:4", "n": "", "vs": [[4, "ثم يزينونها بالفضة والذهب وتثبت بالمسامير والمطارق لئلا تتحرك."]]}, {"l": "Jer 10:9", "n": "", "vs": [[9, "يحضرون لصنعها الفضة المطرقة من ترشيش، والذهب من أوفاز، فهي عمل صانع ماهر وصوغ يدي صائغ، وتكسى بثياب زرقاء وأرجوانية. كلها صنعة صناع مهرة."]]}, {"l": "Dan 3:1", "n": "", "vs": [[1, "ثم صنع نبوخذناصر تمثالا من ذهب، ارتفاعه ستون ذراعا (نحو ثلاثين مترا)، وعرضه ست أذرع (نحو ثلاثة أمتار)، ونصبه في سهل دورا في ولاية بابل."]]}, {"l": "Act 17:29", "n": "", "vs": [[29, "فما دمنا ذرية الله، فيجب ألا ننظر إلى الألوهية كأنها صنم من ذهب أو فضة أو حجر يستطيع إنسان أن ينحته أو يصوغه كما يتخيل!"]]}, {"l": "Rev 17:4", "n": "", "vs": [[4, "وكانت المرأة تلبس ملابس من أرجوان وقرمز، وتتحلى بالذهب والحجارة الكريمة واللؤلوء، وقد أمسكت كأس ذهب مملوءة بزناها المكروه النجس،"]]}], "kwAr": "مغشى", "noteAr": ""}, {"kw": "and there", "raw": "Psa_135:17", "note": "", "refs": [{"l": "Psa 135:17", "n": "", "vs": [[17, "وآذان لكنها لا تسمع. وليس في أفواهها نسمة حياة."]]}], "kwAr": "خال من كل حياة", "noteAr": ""}], "arS": [["ويل", ["H1945"]], [" لمن ", []], ["يقول", ["H559"]], [" لمنحوت ", []], ["خشبي", ["H6086"]], [": «", []], ["استيقظ", ["H6974"]], ["» أو ", []], ["لحجر", ["H68"]], [" ", []], ["أبكم", ["H1748"]], [": «", []], ["انهض", ["H5782"]], ["». أيمكن أن ", []], ["يهدي", ["H3384"]], ["؟ إنما هو ", []], ["مغشى", ["H8610"]], [" ", []], ["بالذهب", ["H2091"]], [" ", []], ["والفضة", ["H3701"]], [" ", []], ["وخال", ["H369"]], [" من ", []], ["كل", ["H3605"]], [" ", []], ["حياة", ["H7307"]], [".", []]]}, {"c": 2, "v": 20, "text": "أما الرب ففي هيكله المقدس، فلتصمت الأرض كلها في محضره».", "groups": [{"kw": "the Lord", "raw": "Psa_11:4, Psa_115:3, Psa_132:13, Psa_132:14; Isa_6:1, Isa_66:1, Isa_66:6; Jon_2:4, Jon_2:7; Eph_2:21, Eph_2:22", "note": "", "refs": [{"l": "Psa 11:4", "n": "", "vs": [[4, "مازال الرب في هيكله المقدس. الرب في السماء عرشه. تبصر عيناه بني آدم، وتتقصاهم أجفانه."]]}, {"l": "Psa 115:3", "n": "", "vs": [[3, "إن إلهنا في السماوات. كل ما شاء صنع."]]}, {"l": "Psa 132:13", "n": "", "vs": [[13, "لأن الرب قد اختار أورشليم ورغب أن تكون له مسكنا."]]}, {"l": "Psa 132:14", "n": "", "vs": [[14, "وقال: «هذه مقر راحتي إلى الأبد، فيها أسكن لأني أحببتها»."]]}, {"l": "Isa 6:1", "n": "", "vs": [[1, "وفي سنة وفاة الملك عزيا، شاهدت السيد جالسا على عرش مرتفع سام، وقد امتلأ الهيكل من أهدابه،"]]}, {"l": "Isa 66:1", "n": "", "vs": [[1, "هذا ما يقوله الرب: السماء عرشي والأرض موطيء قدمي، فأي بيت تشيدون لي؟ وأين مقر راحتي؟"]]}, {"l": "Isa 66:6", "n": "", "vs": [[6, "اسمعوا صوت جلبة في المدينة، صوتا من الهيكل، صوت الرب يجازي أعداءه."]]}, {"l": "Jon 2:4", "n": "", "vs": [[4, "فقلت: قد طردت من حضرتك، ولن أعود أتفرس في هيكلك المقدس."]]}, {"l": "Jon 2:7", "n": "", "vs": [[7, "عندما وهنت نفسي في داخلي، تذكرت إلهي، فحلقت صلاتي إليك، إلى هيكلك المقدس."]]}, {"l": "Eph 2:21", "n": "", "vs": [[21, "الذي فيه يتناسق البناء كله فيرتفع ليصير هيكلا مقدسا في الرب."]]}, {"l": "Eph 2:22", "n": "", "vs": [[22, "وفيه أنتم أيضا قد بنيتم معا فصرتم مسكنا لله بوجود الروح."]]}], "kwAr": "الرب", "noteAr": ""}, {"kw": "let all the earth keep silence before him", "raw": "Heb. be silent all the earth before him, Psa_46:10, Psa_76:8, Psa_76:9; Zep_1:7; Zec_2:13", "note": "Heb. be silent all the earth before him, Psa_46:10, Psa_76:8, Psa_76:9; Zep_1:7; Zec_2:13", "refs": [{"l": "Psa 46:10", "n": "", "vs": [[10, "استكينوا واعلموا أني أنا الله ، أتعالى بين الأمم وأتعالى في الأرض."]]}, {"l": "Psa 76:8", "n": "", "vs": [[8, "من السماء أصدرت حكما فلما سمعته الأرض فزعت وصمتت."]]}, {"l": "Psa 76:9", "n": "", "vs": [[9, "كان ذلك عندما قمت للقضاء لتخلص ودعاء الأرض كلهم."]]}, {"l": "Zep 1:7", "n": "", "vs": [[7, "اصمتوا في محضر السيد الرب لأن يوم الرب بات وشيكا. قد أعد الرب ذبيحة وقدس مدعويه."]]}, {"l": "Zec 2:13", "n": "", "vs": [[13, "ليصمت كل بشر في حضرة الرب لأنه قد هب من مسكن قدسه."]]}], "kwAr": "فلتصمت الأرض كلها في محضره", "noteAr": "بالعبرية: «لتصمت كل الأرض أمامه». انظر مز 46: 10؛ 76: 8، 9؛ صف 1: 7؛ زك 2: 13"}], "arS": [["أما ", []], ["الرب", ["H3068"]], [" ففي ", []], ["هيكله", ["H1964"]], [" ", []], ["المقدس", ["H6944"]], ["، ", []], ["فلتصمت", ["H2013"]], [" ", []], ["الأرض", ["H776"]], [" ", []], ["كلها", ["H3605"]], [" في ", []], ["محضره", ["H4480", "H6440"]], ["».", []]]}, {"c": 3, "v": 1, "text": "هذه صلاة النبي حبقوق:", "groups": [{"kw": "prayer", "raw": "Psa. 86:1-17 *title Psa. 90:1-17 *title", "note": "Psa. 86:1-17 *title Psa. 90:1-17 *title", "refs": [{"l": "Psa 86:1-17", "n": "", "vs": [[1, "أرهف يارب إلي أذنك، استجب لي، فإني مسكين وبائس."], [2, "احفظ نفسي فإني تقي ياإلهي، خلص أنت عبدك الواثق بك."], [3, "ارحمني يارب فإني بك أستغيث طوال النهار."], [4, "فرح نفس عبدك، فإني إليك أيها السيد أرفع نفسي."], [5, "لأنك أنت يارب طيب وغفور، وكثير الرحمة لجميع الذين يدعونك."], [6, "يارب اصغ إلى صلاتي واستمع إلى صوت تضرعاتي."], [7, "في يوم ضيقي أدعوك لأنك تستجيبني."], [8, "لا نظير لك بين الآلهة يارب، وليس من يعمل كأعمالك."], [9, "تقبل جميع الأمم التي صنعتها لتسجد أمامك يارب وتمجد اسمك."], [10, "فإنك عظيم وصانع عجائب. أنت الله وحدك."], [11, "يارب علمني طريقك فأسلك بموجب حقك. وحد قلبي ليخاف اسمك."], [12, "أحمدك يارب إلهي بكامل قلبي، وأمجد اسمك إلى الأبد."], [13, "لأن رحمتك عظيمة نحوي، وقد نجيت نفسي من الهاوية السفلى."], [14, "ياالله قد ثار علي المتكبرون، وجماعة الظالمين يطلبون قتلي، غير عابئين بك."], [15, "إنما أنت يارب إله رحيم ورؤوف وبطيء الغضب ووافر الرحمة والحق."], [16, "التفت إلي وارحمني. أعطني أنا عبدك قوتك، وخلصني أنا ابن أمتك."], [17, "اصنع معي آية للخير، فيراها مبغضي ويعتريهم الخزي، فإنك أنت يارب قد أعنتني وعزيتني."]]}, {"l": "Psa 90:1-17", "n": "", "vs": [[1, "يارب أنت كنت ملجَأ لنا نلوذ به جيلا بعد جيل."], [2, "قبل أن أوجدت الجبال أو كونت المسكونة، أنت الله من الأزل وإلى الأبد."], [3, "تعيد الإنسان إلى التراب قائلا: عودوا إليه يابني آدم."], [4, "فإن ألف سنة في عينيك كيوم أمس العابر، أو مثل هزيع من الليل."], [5, "تجرف البشر كما يجرفهم الطوفان، فيزولون كالحلم عند الصباح مثل العشب الذي ينمو."], [6, "يزهر في الصباح وينمو، وفي المساء يقطع ويجف."], [7, "إن غضبك قد أفنانا وسخطك قد روعنا."], [8, "جعلت آثامنا أمامك وخطايانا الخفية ظاهرة لديك."], [9, "لأن أيامنا كلها تنقضي في غضبك الشديد، وأعوامنا تتلاشى كزفرة."], [10, "قد نعيش سبعين سنة، وإن كنا ذوي عافية فثمانين وأفضل أيامنا تعب وبلية، لأنها سرعان ما تزول فنطير."], [11, "من يعرف شدة غضبك؟ إن سخطك هو بحسب مهابتك؟"], [12, "علمنا إحصاء أيامنا، لعلنا نتعقل بقلب حكيم."], [13, "إلى متى يطول يارب غضبك؟ ارجع وتعطف على عبيدك."], [14, "أفض علينا باكرا من رحمتك، فنترنم فرحا ونبتهج طوال أعمارنا."], [15, "فرحنا بمقدار الأيام التي بليتنا بها، وبمقدار السنين التي رأينا فيها المصائب"], [16, "ليظهر صنيعك أمام عبيدك وجلالك أمام أبنائهم."], [17, "ولتكن نعمة الرب إلهنا علينا. أنجح عمل أيدينا، نعم أنجح لنا عمل أيدينا."]]}], "kwAr": "صلاة", "noteAr": "انظر عنوان المزمور 86 وعنوان المزمور 90."}, {"kw": "upon Shigionoth", "raw": "or, according to variable songs, or tunes, called in Hebrew, Shigionoth. Psa. 7:1-17 *title", "note": "or, according to variable songs, or tunes, called in Hebrew, Shigionoth. Psa. 7:1-17 *title", "refs": [{"l": "Psa 7:1-17", "n": "", "vs": [[1, "أيها الرب إلهي، إليك التجأت، فأنقذني ونجني من جميع مطاردي،"], [2, "لئلا يفترس العدو نفسي كالأسد، ولا من ينقذني."], [3, "أيها الرب إلهي، إن كنت قد اقترفت هذه الإساءة، وكانت يداي قد ارتكبتا هذا الإثم،"], [4, "إن كنت قد أسأت لمن أحسن إلي وسلبت عدوي من غير سبب،"], [5, "إذن فليطارد العدو نفسي وينزعها مني، وليدس في الأرض حياتي، ويعفر في التراب شرفي."], [6, "انهض يارب في احتدام غضبك، وانتصب في وجه سخط خصومي، يامن أوصيت بالعدل."], [7, "لتحط بك جماعة الشعوب فتحكمها من منصة القضاء العالية."], [8, "إن الرب يدين الأمم. اقض لي يارب كحقي، بحسب ما في من كمال."], [9, "ضع حدا لشر الأشرار، وأثبت براءة الأبرار، أيها الإله العادل فاحص القلوب والدخائل."], [10, "ملجإي عند الله مخلص مستقيمي القلوب."], [11, "الله قاض عادل، وهو إله يسخط على الأشرار في كل يوم."], [12, "صقل سيفه ليضرب به الشرير الذي لا يتوب. وتر قوسه وهيأها."], [13, "أعد له الأسلحة القتالة، وجعل سهامه محرقة."], [14, "هوذا العدو يتمخض بالإثم، يحبل بالأذى، ويلد كذبا."], [15, "حفر بئرا وعمقها، فسقط فيها."], [16, "شره يرتد على رأسه، وظلمه يهبط على هامته."], [17, "إني أحمد الرب من أجل عدالته، وأترنم لاَسم الرب العلي."]]}], "kwAr": "", "noteAr": "أو: «على ألحان متنوعة»، وتسمى بالعبرية «شجيونوت». انظر عنوان المزمور 7."}], "arS": [["هذه ", []], ["صلاة", ["H8605"]], [" ", []], ["النبي", ["H5030"]], [" ", []], ["حبقوق", ["H2265"]], [":", []]]}, {"c": 3, "v": 2, "text": "«يارب قد بلغني ما فعلت فخفت يارب، عملك في وسط السنين أحيه، وعرف به على مر الأيام، واذكر الرحمة في الغضب.", "groups": [{"kw": "I have", "raw": "Hab_3:16, Hab_1:5-10; Exo_9:20,Exo_9:21; 2Ch_34:27, 2Ch_34:28; Job_4:12-21; Psa_119:120; Isa_66:2; Jer_36:21-24; Dan_8:17; Heb_11:7, Heb_12:21; Rev_15:4", "note": "", "refs": [{"l": "Hab 3:16", "n": "", "vs": [[16, "سمعت هذا فتولاني الفزع وارتجفت شفتاي من الصوت، وتسرب النخر إلى عظامي، وارتعشت قدماي. ولكن سأنتظر بصبر يوم البلية الذي يحيق بالأمة التي غزتنا."]]}, {"l": "Hab 1:5-10", "n": "", "vs": [[5, "تأملوا الأمم وأبصروا. تعجبوا وتحيروا لأني مقبل على إنجاز أعمال في عهدكم إذا حدثتم بها لا تصدقونها."], [6, "فها أنا أثير الكلدانيين، هذه الأمة الحانقة المندفعة الزاحفة في رحاب الأرض، لتستولي على مساكن ليست لها."], [7, "أمة مخيفة مرعبة، تستمد حكمها وعظمتها من ذاتها."], [8, "خيولها أسرع من النمور، وأكثر ضراوة من ذئاب المساء. فرسانها يندفعون بكبرياء قادمين من أماكن بعيدة، متسابقين كالنسر المسرع للانقضاض على فريسته."], [9, "يقبلون جميعهم ليعيثوا فسادا، ويطغى الرعب منهم على قلوب الناس قبل وصولهم، فيجمعون أسرى كالرمل."], [10, "يهزأون بالملوك ويعبثون بالحكام. يسخرون من الحصون، يكومون حولها تلالا من التراب، ويستولون عليها."]]}, {"l": "Exo 9:20", "n": "", "vs": [[20, "فكل من خاف كلمة الرب من رجال فرعون لاذ بعبيده وماشيته بالبيوت،"]]}, {"l": "Exo 9:21", "n": "", "vs": [[21, "أما الذين استخفوا بكلام الرب فقد تركوا عبيدهم ومواشيهم في الحقل."]]}, {"l": "2Ch 34:27", "n": "", "vs": [[27, "من حيث أن قلبك قد رق، وتذللت أمام الله لدى سماعك ما قضت به الشريعة على هذا الموضع وعلى أهله، وتواضعت أمامي ومزقت ثيابك وبكيت في حضرتي، فإنني قد استجبت لك أنا أيضا، يقول الرب."]]}, {"l": "2Ch 34:28", "n": "", "vs": [[28, "لذلك ها أنا أتوفاك فتدفن في قبرك بسلام، ولا تشهد عيناك ما سأنزل بهذا الموضع وأهله من شر». فحمل الرجال ردها إلى الملك."]]}, {"l": "Job 4:12-21", "n": "", "vs": [[12, "ذات مرة أسر إلي بكلمة، فتلقفت أذني منها همسا"], [13, "ففي غمرة الهواجس، في رؤى الليل، عندما طغى السبات على الناس،"], [14, "انتابني رعب ورعدة أرجفا عظامي،"], [15, "وخطرت روح أمام وجهي، فاقشعر شعر جسدي."], [16, "ثم وقفت، غير أني لم أتبين ملامحها. تماثل لي شكل ما، فران صمت ثم سمعت صوتا منخفضا يقول:"], [17, "أيمكن أن يكون الإنسان أبر من الله، أم الرجل أطهر من خالقه؟"], [18, "ها إنه لا يأتمن عبيده، وإلى ملائكته ينسب حماقة،"], [19, "فكم بالحري المخلوقون من طين، الذين أساسهم في التراب، ويسحقون مثل العث؟"], [20, "يتحطمون بين صباح ومساء، ويبيدون إلى الأبد من غير أن ينتبه لهم أحد."], [21, "ألا تنتزع منهم حبال خيامهم (أي تنطفيء شعل حياتهم) فيموتون من غير حكمة؟"]]}, {"l": "Psa 119:120", "n": "", "vs": [[120, "اقشعر بدني رعبا منك وجزعت من أحكامك."]]}, {"l": "Isa 66:2", "n": "", "vs": [[2, "جميع هذه صنعتها يدي فوجدت كلها، لكنني أسر بالرجل المتواضع المنسحق الروح الذي يرتعد من كلمتي."]]}, {"l": "Jer 36:21-24", "n": "", "vs": [[21, "فبعث الملك يهودي ليأتي بالكتاب، فأحضره من مخدع أليشاماع الكاتب، ثم أخذ في تلاوته على مسامع الملك وسائر الرؤساء الماثلين لديه."], [22, "وكان ذلك في الشهر التاسع، والملك آنذاك جالس في حجر ته الشتوية يستدفيء على نار كانون متأجج أمامه."], [23, "فبعد أن قرأ يهودي ثلاثة أو أربعة أقسام منه، تناول الملك مبراة الكاتب وشق الكتاب وطرحه إلى نار الكانون فاحترق الكتاب بكامله."], [24, "ولم يخف الملك ولا أحد من خدامه الذين سمعوا هذا الكلام، ولم يمزقوا ثيابهم."]]}, {"l": "Dan 8:17", "n": "", "vs": [[17, "فجاء إلي حيث وقفت، فتولاني الخوف وانطرحت على وجهي، فقال لي: «افهم ياابن آدم. إن الرؤيا تختص بوقت المنتهى»."]]}, {"l": "Heb 11:7", "n": "", "vs": [[7, "وبالإيمان نوح، لما أنذره الله عن طريق الوحي بالطوفان الآتي، دفعه خوف الله إلى بناء سفينة ضخمة كانت وسيلة النجاة له ولعائلته، مع أنه لم يكن قد رأى طوفانا من قبل. وبعمله هذا، حكم على العالم وأصبح وارثا للبر القائم على أساس الإيمان."]]}, {"l": "Heb 12:21", "n": "", "vs": [[21, "والواقع أن ذلك المشهد كان مرعبا إلى درجة جعلت موسى يقول: «أنا خائف جدا بل مرتجف خوفا!»"]]}, {"l": "Rev 15:4", "n": "", "vs": [[4, "من لا يخافك يارب ولا يمجد اسمك؟ فأنت وحدك قدوس! والأمم جميعا سيأتون ويسجدون لك، لأن أحكامك قد ظهرت جلية»."]]}], "kwAr": "بلغني", "noteAr": ""}, {"kw": "speech", "raw": "Heb. report, or hearing, Isa_53:1; Rom_10:16", "note": "Heb. report, or hearing, Isa_53:1; Rom_10:16", "refs": [{"l": "Isa 53:1", "n": "", "vs": [[1, "من آمن بكلامنا، ولمن ظهرت يد الرب؟"]]}, {"l": "Rom 10:16", "n": "", "vs": [[16, "ولكن، ليس كلهم أطاعوا الإنجيل. فإن إشعياء يقول: «يارب! من صدق ما أسمعناه إياه؟»"]]}], "kwAr": "ما فعلت", "noteAr": "بالعبرية: «خبر»، أو «سمع». انظر إش 53: 1؛ رو 10: 16"}, {"kw": "O Lord", "raw": "Ezr_9:8; Psa_85:6, Psa_90:13-17, Psa_138:7, Psa_138:8; Isa_51:9-11, Isa_63:15-19, Isa_64:1-4; Hos_6:2, Hos_6:3; Joh_10:10; Phi_1:6", "note": "", "refs": [{"l": "Ezr 9:8", "n": "", "vs": [[8, "ولكنك الآن أنعمت علينا بلحظة (سلام) وتعطفت علينا فأنجيت لنا بقية لتعطينا موطيء قدم في مكانك المقدس حتى تنير أعيننا وتمنحنا بعض الحياة في عبوديتنا."]]}, {"l": "Psa 85:6", "n": "", "vs": [[6, "أما تحيينا من جديد فيفرح بك شعبك؟"]]}, {"l": "Psa 90:13-17", "n": "", "vs": [[13, "إلى متى يطول يارب غضبك؟ ارجع وتعطف على عبيدك."], [14, "أفض علينا باكرا من رحمتك، فنترنم فرحا ونبتهج طوال أعمارنا."], [15, "فرحنا بمقدار الأيام التي بليتنا بها، وبمقدار السنين التي رأينا فيها المصائب"], [16, "ليظهر صنيعك أمام عبيدك وجلالك أمام أبنائهم."], [17, "ولتكن نعمة الرب إلهنا علينا. أنجح عمل أيدينا، نعم أنجح لنا عمل أيدينا."]]}, {"l": "Psa 138:7", "n": "", "vs": [[7, "ولو سلكت في وسط الضيق فإنك تحييني، إذ بيدك تدفع عني غضب أعدائي ويمينك تخلصني."]]}, {"l": "Psa 138:8", "n": "", "vs": [[8, "الرب ينجز مقاصده لي. رحمتك يارب إلى الأبد تدوم، فلا تتخل عني لأني صنع يديك."]]}, {"l": "Isa 51:9-11", "n": "", "vs": [[9, "استيقظي، استيقظي، تسربلي بالقوة ياذراع الرب، استيقظي كالعهد بك في الأيام القديمة، وفي الأجيال الغابرة. ألست أنت التي مزقت رهب إربا إربا، وطعنت التنين؟"], [10, "ألست أنت التي جففت البحر، ومياه اللجج العميقة، وجعلت أعماق البحر طريقا يعبر فوقه المفديون؟"], [11, "سيرجع الذين افتداهم الرب ويأتون إلى صهيون بترنم، يكلل رؤوسهم فرح أبدي، فتطغى عليهم بهجة وغبطة، أما الحزن والتنهد فيهربان بعيدا."]]}, {"l": "Isa 63:15-19", "n": "", "vs": [[15, "تطلع من السماء وانظر من مسكنك المقدس والمجيد. أين غيرتك واقتدارك؟ قد امتنع عني لهيب أشواقك وإحساناتك."], [16, "فأنت هو أبونا، مع أن إبراهيم لا يعرفنا، وإسرائيل لا يعترف بنا، فأنت أيها الرب، هو أبونا، واسمك فادينا منذ القديم."], [17, "لماذا يارب تركتنا نضل عن طرقك وقسيت قلوبنا حتى لم نعد نتقيك؟ ارجع إلينا من أجل عبيدك، أسباط ميراثك."], [18, "قد داس أعداؤنا هيكلك الذي امتلكه شعبك المقدس زمنا يسيرا،"], [19, "وأصبحنا نظير الذين لم تتسلط عليهم قط ولم يدع عليهم باسمك."]]}, {"l": "Isa 64:1-4", "n": "", "vs": [[1, "ليتك تشق السماوات وتنزل فتتزلزل الجبال من حضرتك!"], [2, "فتكون كالنار التي تضرم الهشيم، وتجعل المياه تغلي لكي تعرف أعداءك اسمك، فترتعب الأمم من حضرتك."], [3, "عندما أجريت أعمالا مخيفة لم نتوقعها، نزلت فتزلزلت الجبال من حضرتك."], [4, "منذ الأزل لم يسمع أحد ولم تصغ أذن ولم تر عين إلها سواك يجري ما تصنعه للذين ينتظرونك."]]}, {"l": "Hos 6:2", "n": "", "vs": [[2, "بعد يومين يحيينا، وفي اليوم الثالث يقيمنا، لنحيا أمامه."]]}, {"l": "Hos 6:3", "n": "", "vs": [[3, "لنعرف، بل لنجد حتى نعرف الرب، فمجيئه يقين كالفجر، يقبل إلينا كإقبال المطر وكغيوث الربيع التي تروي الأرض»."]]}, {"l": "Joh 10:10", "n": "", "vs": [[10, "السارق لا يأتي إلا ليسرق ويذبح ويهلك. أما أنا فقد أتيت لتكون لهم حياة، بل ملء الحياة!"]]}, {"l": "Phi 1:6", "n": "", "vs": [[6, "ولي ثقة في هذا الأمر بالذات: أن الذي بدأ فيكم عملا صالحا سوف يتممه إلى يوم المسيح يسوع."]]}], "kwAr": "فخفت يارب", "noteAr": ""}, {"kw": "revive", "raw": "or, preserve alive", "note": "or, preserve alive", "refs": [], "kwAr": "أحيه", "noteAr": "أو: «أبقِه حيا»."}, {"kw": "in the", "raw": "Jer_25:11, Jer_25:12, Jer_52:31-34; Dan_9:2", "note": "", "refs": [{"l": "Jer 25:11", "n": "", "vs": [[11, "فتصبح هذه الأرض بأسرها قفرا خرابا، وتستعبد جميع هذه الأمم لملك بابل طوال سبعين سنة."]]}, {"l": "Jer 25:12", "n": "", "vs": [[12, "وفي ختام السبعين سنة أعاقب ملك بابل وأمته، وأرض الكلدانيين على إثمهم، وأحولها إلى خراب أبدي»، يقول الرب."]]}, {"l": "Jer 52:31-34", "n": "", "vs": [[31, "وفي اليوم الخامس والعشرين من الشهر الثاني عشر(أي شباط فبراير) من السنة السابعة والثلاثين لسبي يهوياكين ملك يهوذا، أكرم أويل مرودخ، ملك بابل، في سنة اعتلائه العرش، يهوياكين ملك يهوذا وأخرجه من السجن."], [32, "وخاطبه بطيب الكلام، ورفع مقامه فوق مقام سائر الملوك الذين معه في بابل."], [33, "فخلع يهوياكين عن نفسه ثياب سجنه، وظل يتناول الطعام في حضرة ملك بابل طوال أيام حياته."], [34, "وعينت له نفقة دائمة يقبضها من خزانة مال الملك كل يوم بيومه مدى أيام حياته، وإلى يوم وفاته."]]}, {"l": "Dan 9:2", "n": "", "vs": [[2, "في السنة الأولى من ملكه، أدركت أنا دانيآل، من دراسة الأسفار التي دون فيها وحي الرب إلى إرميا، أن عدد السنوات التي قضي بها على خراب أورشليم هو سبعون سنة."]]}], "kwAr": "في وسط السنين", "noteAr": ""}, {"kw": "in wrath", "raw": "Exo_32:10-12; Num_14:10-23, Num_16:46, Num_16:47; 2Sa_24:10-17; Psa_6:1, Psa_6:2, Psa_38:1; Psa_78:38; Jer_10:24, Jer_29:10; Lam_3:32; Zec_1:12", "note": "", "refs": [{"l": "Exo 32:10-12", "n": "", "vs": [[10, "والآن دعني وغضبي المحتدم فأفنيهم، ثم أجعلك أنت شعبا عظيما»."], [11, "فابتهل موسى إلى الرب وقال: «لماذا يحتدم غضبك على شعبك الذي أخرجته من ديار مصر بقوة عظيمة وذراع مقتدرة؟"], [12, "لماذا يشمت المصريون فينا قائلين: لقد احتال عليهم إلههم فأخرجهم من ههنا ليهلكهم في الجبال ويفنيهم عن وجه الأرض. ارجع عن حمو غضبك ولا توقع هذا العقاب بشعبك."]]}, {"l": "Num 14:10-23", "n": "", "vs": [[10, "ولكن الشعب طالب برجمهما بالحجارة. غير أن مجد الرب ظهر في خيمة الاجتماع على مرأى منهم جميعا."], [11, "وقال الرب لموسى: «إلى متى يمعن هذا الشعب في إهانتي، وإلى متى لا يصدقونني على الرغم من معجزاتي التي أجريتها في وسطهم؟"], [12, "سأبيدهم بالوبأ، وأجعلك شعبا أكبر وأعظم منهم»."], [13, "فقال موسى للرب: «عندئذ يسمع المصريون، الذين أخرجت هذا الشعب من بينهم بقدرتك، بهذا"], [14, "ويخبرون به أهل هذه الأرض، الذين قد سمعوا يارب أنك قائم في وسط هذا الشعب، وأنك قد ظهرت لهم وجها لوجه تظللهم بحمايتك، وتسير أمامهم في عمود سحاب نهارا وفي عمود نار ليلا."], [15, "فإن أهلكت هذا الشعب دفعة واحدة، فإن الأمم التي سمعت بخبرك تقول"], [16, "إنك قد عجزت عن أن تدخل هذا الشعب إلى الأرض التي وعدتهم بها، فأهلكتهم في الصحراء."], [17, "والآن لتتعظم قدرة سيدي كما نطقت قائلا:"], [18, "الرب طويل الأناة، وافر الرحمة، يغفر الذنب والسيئة. لكنه لا يبريء، بل يفتقد ذنب الآباء في الأبناء إلى الجيل الثالث والرابع."], [19, "فاصفح عن ذنب هذا الشعب بحسب نعمتك، واغفر له كما غفرت ذنوبه من مصر إلى ههنا»."], [20, "فأجاب الرب: «قد صفحت بحسب قولك."], [21, "ولكن كما أنا حقا حي، وكما أن مجد الرب حقا يملأ الأرض،"], [22, "فإن جميع الرجال الذين عاينوا مجدي ومعجزاتي التي أجريتها في مصر وفي الصحراء، وجربوني عشر مرات من غير أن يطيعوا قولي،"], [23, "لن يروا الأرض التي وعدت بها آباءهم. جميع الذين استخفوا بي، لن يشاهدوها."]]}, {"l": "Num 16:46", "n": "", "vs": [[46, "ثم قال موسى لهرون: «خذ المجمرة وضع فيها نارا من على المذبح، وأيضا بخورا، وأسرع إلى الجماعة لتكفر عنهم، لأن الغضب المحتدم قد صدر عن الرب وتفشى فيهم الوبأ»."]]}, {"l": "Num 16:47", "n": "", "vs": [[47, "فنفذ هرون أمر موسى، وأسرع إلى وسط الجماعة، وإذا بالوبأ قد ابتدأ يتفشى فيهم، فوضع البخور وكفر عن الشعب."]]}, {"l": "2Sa 24:10-17", "n": "", "vs": [[10, "وبعد أن تم إحصاء الشعب اعترى الندم قلب داود، فتضرع إلى الرب قائلا: «أخطأت جدا بما ارتكبته، فأرجوك يارب أن تزيل إثم عبدك لأنني تصرفت تصرفا أحمق»."], [11, "وقبل أن ينهض داود من نومه صباحا، قال الرب لجاد النبي، رائي داود:"], [12, "«اذهب وقل لداود: هذا ما يقوله الرب، أنا أعرض عليك ثلاثة أمور، فاختر لنفسك واحدا منها فأجريه عليك»."], [13, "فمثل جاد أمام داود وقال: «اختر إما أن تجتاح البلاد سبع سني جوع، أو تهرب ثلاثة أشهر أمام أعدائك وهم يتعقبونك، أو يتفشى وبأ في أرضك طوال ثلاثة أيام. ففكر في الأمر مليا وأخبرني عما استقر عليه ردك على من أرسلني؟»"], [14, "فأجاب داود: «قد ضاق بي الأمر، ولكن خير لي أن أقع في يد الرب، لأن مراحمه كثيرة من أن أقع بين يدي إنسان»."], [15, "فأفشى الرب وبأ في إسرائيل من الصباح حتى نهاية ثلاثة أيام، فمات من الشعب من دان إلى بئر سبع سبعون ألف رجل."], [16, "ومد ملاك الرب يده فوق أورشليم ليهلكها ولكن أخذت الرب رأفة على ما أصاب الشعب من شر وقال للملاك المهلك: «كفى، رد يدك». وكان ملاك الرب عندئذ قد بلغ بيدر أرونة اليبوسي."], [17, "فقال داود للرب عندما شاهد الملاك المهلك «أنا هو المخطيء والمذنب، وأما هؤلاء الخراف فماذا جنوا؟ ليحل عقابك علي وعلى بيت أبي»."]]}, {"l": "Psa 6:1", "n": "", "vs": [[1, "يارب لا توبخني في إبان غضبك، ولا تؤدبني في احتدام سخطك."]]}, {"l": "Psa 6:2", "n": "", "vs": [[2, "ارحمني يارب لأني ضعيف. اشفني يارب لأن عظامي راجفة،"]]}, {"l": "Psa 38:1", "n": "", "vs": [[1, "يارب لا توبخني بغضبك، ولا تؤدبني بسخطك،"]]}, {"l": "Psa 78:38", "n": "", "vs": [[38, "لكنه كان رحيما، فعفا عن الإثم ولم يهلكهم. وكثيرا ما كبح غضبه عنهم ولم يضرم كل سخطه."]]}, {"l": "Jer 10:24", "n": "", "vs": [[24, "قومني يارب ": "", "vs": [[12, "سأبيدهم بالوبأ، وأجعلك شعبا أكبر وأعظم منهم»."]]}, {"l": "Num 16:46-49", "n": "", "vs": [[46, "ثم قال موسى لهرون: «خذ المجمرة وضع فيها نارا من على المذبح، وأيضا بخورا، وأسرع إلى الجماعة لتكفر عنهم، لأن الغضب المحتدم قد صدر عن الرب وتفشى فيهم الوبأ»."], [47, "فنفذ هرون أمر موسى، وأسرع إلى وسط الجماعة، وإذا بالوبأ قد ابتدأ يتفشى فيهم، فوضع البخور وكفر عن الشعب."], [48, "ووقف هرون بين الموتى والأحياء، فتوقف الوبأ."], [49, "فكان الذين هلكوا بالوبإ أربعة عشر ألفا وسبع مئة، عدا الذين ماتوا بسبب قورح."]]}, {"l": "Psa 78:50", "n": "", "vs": [[50, "أفلت عنان غضبه، ولم يحفظهم من الموت، بل أهلكهم بالوبإ،"]]}, {"l": "Psa 78:51", "n": "", "vs": [[51, "وأباد كل أبكار مصر، طلائع ثمار الرجولة في خيام حام."]]}, {"l": "Nah 1:2", "n": "", "vs": [[2, "الرب إله غيور ومنتقم. الرب منتقم وساخط ينتقم من أعدائه، ويضمر الغضب لخصومه."]]}, {"l": "Nah 1:3", "n": "", "vs": [[3, "الرب بطيء في غضبه وعظيم العزة، إنما لا يبريء الخاطيء البتة. طريق الرب في الزوبعة والعاصفة، والغمام غبار قدميه."]]}], "kwAr": "يتقدمه", "noteAr": ""}, {"kw": "and", "raw": "Psa_18:7-13", "note": "", "refs": [{"l": "Psa 18:7-13", "n": "", "vs": [[7, "عندئذ ارتجت الأرض وتزلزلت. ارتجفت أساسات الجبال واهتزت، لأن الرب غضب."], [8, "نفث أنفه دخانا، وانقذفت نار آكلة من فمه، وكأنها جمر ملتهب."], [9, "طأطأ السماوات ونزل، فكانت الغيوم المتجهمة تحت قدميه."], [10, "امتطى مركبة من ملائكة الكروبيم، وطار مسرعا على أجنحة الرياح."], [11, "جعل الظلمة ستارا له، وصار ضباب المياه وسحب السماء الداكنة مظلته المحيطة به."], [12, "من بهاء طلعته عبرت السحب أمامه. حدثت عاصفة برد وبرق كالجمر الملتهب."], [13, "أرعد الرب في السماوات، أطلق العلي صوته فانهمر برد، واندلعت نار!"]]}], "kwAr": "والموت", "noteAr": ""}, {"kw": "burning coals", "raw": "or, burning diseases, Deu_32:24", "note": "or, burning diseases, Deu_32:24", "refs": [{"l": "Deu 32:24", "n": "", "vs": [[24, "وحين يكونون خائرين من الجوع، منهوكين من الحمى والداء السام، أجعل أنياب الوحوش مع سم زواحف الأرض تنشب فيهم."]]}], "kwAr": "خطاه", "noteAr": "أو: «أمراض محرقة». انظر تث 32: 24"}], "arS": [["يتقدمه", ["H6440", "H1980"]], [" ", []], ["وبأ", ["H1698"]], ["، ", []], ["والموت", ["H7565"]], [" ", []], ["يقتفي", ["H3318"]], [" ", []], ["خطاه", ["H7272"]], [".", []]]}, {"c": 3, "v": 6, "text": "وقف وزلزل الأرض، تفرس فأرعب الأمم، اندكت الجبال الأبدية وانهارت التلال القديمة، أما مسالكه فهي من الأزل.", "groups": [{"kw": "and measured", "raw": "Exo_15:17, Exo_21:31; Num. 34:1-29; Deu_32:8; Act_17:26", "note": "", "refs": [{"l": "Exo 15:17", "n": "", "vs": [[17, "تأتي بهم وتغرسهم في جبل ميراثك، الموضع الذي جعلته يارب لسكناك، المقدس الذي أعدته يارب يداك."]]}, {"l": "Exo 21:31", "n": "", "vs": [[31, "وإذا نطح ابنا أو ابنة، ينفذ فيه هذا الحكم."]]}, {"l": "Num 34:1-29", "n": "", "vs": [[1, "وقال الرب لموسى:"], [2, "«أوص بني إسرائيل وقل لهم: إنكم داخلون إلى أرض كنعان، وهذه هي حدود الأرض التي تكون نصيبا لكم:"], [3, "تشكل صحراء صين المتاخمة لبلاد آدوم الجزء الجنوبي من الأرض، وتبدأ الحدود الجنوبية من طرف البحر الميت إلى الشرق."], [4, "وتمتد نحو عقبة العقارب، مرورا بصحراء صين حتى تبلغ قادش برنيع جنوبا، ثم تتجه نحو حصر أدار عبورا إلى عصمون."], [5, "ثم تلتف الحدود من عصمون إلى وادي العريش، حيث تنتهي عند البحر الأبيض المتوسط."], [6, "أما الحدود الغربية فتكون بمحاذاة سواحل البحر الأبيض المتوسط."], [7, "وتبدأ الحدود الشمالية من البحر الأبيض المتوسط وتمتد شرقا حتى جبل هور،"], [8, "ومن جبل هور إلى مدخل حماة، ثم تتجه نحو صدد،"], [9, "فزفرون وتنتهي عند حصر عينان. هذا يكون لكم الحد الشمالي."], [10, "أما الحدود الشرقية فتمتد من حصر عينان جنوبا إلى شفام."], [11, "ثم تنحدر من شفام إلى ربلة شرقي عين، وتستمر حتى تصل إلى المنحدرات الواقعة شرقي بحر الجليل."], [12, "ثم تتجه نحو نهر الأردن، حتى تنتهي عند البحر الميت. هذه هي أرضكم التي تشتمل عليها حدودكم من جهاتها الأربع»."], [13, "وأوصى موسى بني إسرائيل قائلا: «هذه هي الأرض التي تقتسمونها بالقرعة، التي أمر الرب أن توزع على التسعة الأسباط ونصف السبط."], [14, "لأن سبطي رأوبين وجاد ونصف سبط منسى قد حصلوا على نصيبهم حسب عدد عائلاتهم،"], [15, "من الأراضي الواقعة في شرقي نهر الأردن مقابل أريحا»."], [16, "وقال الرب لموسى:"], [17, "«إليك اسمي الرجلين اللذين يتوليان تقسيم الأرض: ألعازار الكاهن ويشوع بن نون"], [18, "فضلا عن رئيس واحد يمثل كل سبط."], [19, "وهذه أسماء رؤساء الأسباط: كالب بن يفنة عن سبط يهوذا."], [20, "شموئيل بن عميهود عن سبط شمعون."], [21, "أليداد بن كسلون عن سبط بنيامين."], [22, "الرئيس بقي بن يجلي عن سبط دان."], [23, "الرئيس حنيئيل بن إيفود عن سبط منسى من بني يوسف."], [24, "الرئيس قموئيل بن شفطان عن سبط أفرايم من بني يوسف."], [25, "الرئيس أليصافان بن فرناخ عن سبط زبولون."], [26, "الرئيس فلطيئيل بن عزان عن سبط يساكر."], [27, "الرئيس أخيهود بن شلومي عن سبط أشير."], [28, "الرئيس فدهئيل بن عميهود عن سبط نفتالي»."], [29, "هؤلاء هم الرجال الذين عينهم الرب ليتولوا تقسيم أرض كنعان على بني إسرائيل."]]}, {"l": "Deu 32:8", "n": "", "vs": [[8, "عندما قسم العلي الميراث على الأمم، وحين فرق بني آدم، أقام حدودا للشعوب على عدد بني إسرائيل،"]]}, {"l": "Act 17:26", "n": "", "vs": [[26, "وقد أخرج الشعوب جميعا من أصل واحد، وأسكنهم بلاد الأرض كلها، وحدد مسبقا أزمنة وجودهم وحدود أوطانهم،"]]}], "kwAr": "وزلزل", "noteAr": ""}, {"kw": "and drove", "raw": "Jos_10:42, Jos_11:18-23; Neh_9:22-24; Psa_135:8-12", "note": "", "refs": [{"l": "Jos 10:42", "n": "", "vs": [[42, "وظفر يشوع بجميع هؤلاء الملوك واستولى على أرضهم دفعة واحدة، لأن الرب إله إسرائيل حارب عنهم."]]}, {"l": "Jos 11:18-23", "n": "", "vs": [[18, "فخاض يشوع حربا مع أولئك الملوك أياما كثيرة."], [19, "ولم تعقد مدينة واحدة صلحا مع الإسرائيليين إلا الحويين سكان جبعون، إنما استولى الإسرائيليون على جميع المدن بالحرب."], [20, "لأن الرب نفسه هو الذي قسى قلوبهم لخوض الحرب ضد إسرائيل، ليدمرهم الإسرائيليون ويفنوهم من غير رأفة كما أمر الرب موسى."], [21, "وهاجم يشوع العناقيين أيضا وأبادهم من الجبل في حبرون ومن دبير ومن عناب ومن سائر جبل يهوذا ومن جبال إسرائيل، فقضى عليهم ودمر مدنهم."], [22, "فلم يبق منهم أحد في أرض بني إسرائيل سوى قلة لجأت إلى غزة وجت وأشدود،"], [23, "فاستولى يشوع على كل الأرض كما وعد الرب موسى، ووهبها يشوع ميراثا لإسرائيل وفقا لطوائفهم وأسباطهم. وأخيرا استراحت الأرض من الحرب."]]}, {"l": "Neh 9:22-24", "n": "", "vs": [[22, "ووهبت لهم ممالك وأمما، ووزعت عليهم أنصبة في أقصى البلاد فامتلكوا بلاد سيحون وأرض ملك حشبون وديار عوج ملك باشان،"], [23, "وأكثرت نسلهم فصاروا كنجوم السماء عددا، وأتيت بهم إلى الأرض التي وعدت آباءهم أن يدخلوها ويرثوها،"], [24, "فاستولى عليها الأبناء وورثوا الأرض بعد أن أخضعت لهم سكانها الكنعانيين، وأسلمتهم لهم مع ملوكهم وأمم البلاد ليصنعوا بهم حسب ما يطيب لهم."]]}, {"l": "Psa 135:8-12", "n": "", "vs": [[8, "هو الذي ضرب أبكار مصر، أبكار الناس والبهائم."], [9, "وهو الذي أجرى آيات ومعجزات في وسطك يامصر، وعلى فرعون وجميع عبيده."], [10, "ضرب أمما عظيمة، وقتل ملوكا مقتدرين:"], [11, "سيحون ملك الأموريين، وعوج ملك باشان، وجميع ممالك كنعان."], [12, "ووهب أرضهم ميراثا لإسرائيل شعبه."]]}], "kwAr": "فأرعب", "noteAr": ""}, {"kw": "the everlasting", "raw": "Hab_3:10; Gen_49:26; Deu_33:15; Jdg_5:5; Psa_68:16, Psa_114:4-7; Isa_64:1-3; Nah_1:5; Zec_14:4, Zec_14:5", "note": "", "refs": [{"l": "Hab 3:10", "n": "", "vs": [[10, "رأتك الجبال فارتعدت، وطمت المياه الهائجة. زأرت اللجج وارتفعت أمواجها عالية."]]}, {"l": "Gen 49:26", "n": "", "vs": [[26, "إن بركات أبيك أعظم من بركات الجبال الدهرية، وأعظم من ذخائر التلال القديمة، فلتحل جميعها على رأسك يايوسف وعلى جبين الذي انفصل عن إخوته."]]}, {"l": "Deu 33:15", "n": "", "vs": [[15, "وبأنفس ما تدخره الجبال القديمة، وبأثمن كنوز التلال الأبدية،"]]}, {"l": "Jdg 5:5", "n": "", "vs": [[5, "تزلزلت الأرض أمام الرب وارتعد جبل سيناء هذا من حضرة الرب إله إسرائيل."]]}, {"l": "Psa 68:16", "n": "", "vs": [[16, "أيتها الجبال الكثيرة القمم لماذا تتفرسن بحسد في الجبل الذي اشتهاه الله لسكناه؟ إن الله سيسكن فيه إلى الأبد."]]}, {"l": "Psa 114:4-7", "n": "", "vs": [[4, "قفزت الجبال كأنها كباش، والتلال كأنها حملان."], [5, "ما لك يابحر قد هربت، وياأردن قد رجعت إلى الوراء؟"], [6, "مالك ياجبال تقفزين كالكباش، وياتلال كالحملان؟"], [7, "تزلزلي ياأرض في حضرة الرب إله يعقوب."]]}, {"l": "Isa 64:1-3", "n": "", "vs": [[1, "ليتك تشق السماوات وتنزل فتتزلزل الجبال من حضرتك!"], [2, "فتكون كالنار التي تضرم الهشيم، وتجعل المياه تغلي لكي تعرف أعداءك اسمك، فترتعب الأمم من حضرتك."], [3, "عندما أجريت أعمالا مخيفة لم نتوقعها، نزلت فتزلزلت الجبال من حضرتك."]]}, {"l": "Nah 1:5", "n": "", "vs": [[5, "تتزلزل الجبال أمامه، وتذوب التلال، وتتصدع الأرض في حضرته والمسكونة والساكنون فيها."]]}, {"l": "Zec 14:4", "n": "", "vs": [[4, "وتقف قدماه في ذلك اليوم على جبل الزيتون الممتد أمام أورشليم باتجاه الشرق، فينشق جبل الزيتون إلى شطرين من الشرق إلى الغرب عن واد عظيم جدا، فيتراجع نصف الجبل إلى الشمال، والنصف الآخر نحو الجنوب."]]}, {"l": "Zec 14:5", "n": "", "vs": [[5, "ويهربون من خلال وادي جبالي الممتد إلى آصل. تهربون كما هربتم من الزلزلة في أيام حكم عزيا ملك يهوذا، ويأتي الرب إلهي في موكب من جميع قديسيه."]]}], "kwAr": "الجبال الأبدية", "noteAr": ""}, {"kw": "his", "raw": "Psa_90:2, Psa_103:17; Isa_51:6, Isa_51:8; Mic_5:8; Mat_24:35; Luk_1:50; Heb_13:8", "note": "", "refs": [{"l": "Psa 90:2", "n": "", "vs": [[2, "قبل أن أوجدت الجبال أو كونت المسكونة، أنت الله من الأزل وإلى الأبد."]]}, {"l": "Psa 103:17", "n": "", "vs": [[17, "أما رحمة الرب فهي من الأزل وإلى الأبد على متقيه، وعدله يمتد إلى بني البنين،"]]}, {"l": "Isa 51:6", "n": "", "vs": [[6, "ارفعوا عيونكم إلى السماوات وتفرسوا في الأرض من تحت، فإن السماوات كدخان تضمحل، والأرض كثوب تبلى، ويبيد سكانها كالذباب. أما خلاصي فيبقى إلى الأبد، وبري يثبت مدى الدهر."]]}, {"l": "Isa 51:8", "n": "", "vs": [[8, "لأن العث يأكلهم كثوب، ويقرضهم السوس كالصوف، أما بري فيبقى إلى الأبد، وخلاصي يثبت مدى الدهر."]]}, {"l": "Mic 5:8", "n": "", "vs": [[8, "وتكون بقية ذرية يعقوب بين الشعوب الكثيرة كأسد بين وحوش الغابة، أو كشبل بين قطعان الغنم، الذي إن اقتحم يدوس ويفترس وليس من منقذ."]]}, {"l": "Mat 24:35", "n": "", "vs": [[35, "إن السماء والأرض تزولان؛ ولكن كلامي لا يزول أبدا."]]}, {"l": "Luk 1:50", "n": "", "vs": [[50, "ورحمته للذين يتقونه جيلا بعد جيل."]]}, {"l": "Heb 13:8", "n": "", "vs": [[8, "يسوع المسيح هو هو أمسا واليوم وإلى الأبد."]]}], "kwAr": "مسالكه", "noteAr": ""}], "arS": [["وقف", ["H5975"]], [" ", []], ["وزلزل", ["H4128"]], [" ", []], ["الأرض", ["H776"]], ["، ", []], ["تفرس", ["H7200"]], [" ", []], ["فأرعب", ["H5425"]], [" ", []], ["الأمم", ["H1471"]], ["، ", []], ["اندكت", ["H6327"]], [" ", []], ["الجبال", ["H2042"]], [" ", []], ["الأبدية", ["H5703"]], [" ", []], ["وانهارت", ["H7817"]], [" ", []], ["التلال", ["H1389"]], [" ", []], ["القديمة", ["H5769"]], ["، أما ", []], ["مسالكه", ["H1979"]], [" فهي من ", []], ["الأزل", ["H5769"]], [".", []]]}, {"c": 3, "v": 7, "text": "لقد رأيت خيام كوشان تنوء بالبلية وشقق أخبية ديار مديان ترجف رعبا.", "groups": [{"kw": "saw the", "raw": "Exo_15:14-16; Num_22:3, Num_22:4; Jos_2:10, Jos_9:24", "note": "", "refs": [{"l": "Exo 15:14-16", "n": "", "vs": [[14, "فتسمع الشعوب وترتعب، وتستولي الرعدة على أهل فلسطين."], [15, "آنئذ يندهش أمراء أدوم، جبابرة موآب تأخذهم الرجفة، ويذوب حكام كنعان هلعا."], [16, "يسودهم الخوف والرعدة وبقدرة ذراعك يجمدون كالحجارة حتى يعبر شعبك يارب، حتى يعبر شعبك الذي اشتريته."]]}, {"l": "Num 22:3", "n": "", "vs": [[3, "اعتراه الفزع لكثرة عددهم، وملأ الخوف قلب شعبه من الإسرائيليين."]]}, {"l": "Num 22:4", "n": "", "vs": [[4, "فقال بالاق لشيوخ مديان: «إن هذا الجمهور قادر على لحس كل ما حولنا كما يلحس الثور عشب الحقل»."]]}, {"l": "Jos 2:10", "n": "", "vs": [[10, "لأننا سمعنا كيف شق الرب لكم طريقا عبر مياه البحر الأحمر لدى مغادرتكم ديار مصر، وما صنعتموه بملكي الأموريين سيحون وعوج اللذين في شرقي الأردن، وكيف قضيتم عليهما."]]}, {"l": "Jos 9:24", "n": "", "vs": [[24, "فأجابوا يشوع قائلين: «لقد بلغ عبيدك أخبار ما وعد به الرب إلهك موسى عبده، أن يهبكم كل الأرض ويهلك جميع سكانها من أمامكم، فخشينا جدا على أنفسنا منكم، فتوسلنا بالحيلة."]]}], "kwAr": "رأيت", "noteAr": ""}, {"kw": "Cushan", "raw": "or, Ethiopia, Gen_10:6, Gen_10:7", "note": "or, Ethiopia, Gen_10:6, Gen_10:7", "refs": [{"l": "Gen 10:6", "n": "", "vs": [[6, "وأبناء حام: كوش ومصرايم وفوط وكنعان."]]}, {"l": "Gen 10:7", "n": "", "vs": [[7, "وأبناء كوش: سبا، وحويلة، وسبتة ورعمة وسبتكا. وأبناء رعمة: شبا وددان."]]}], "kwAr": "كوشان", "noteAr": "أو: «كوش (إثيوبيا)». انظر تك 10: 6، 7"}, {"kw": "in affliction", "raw": "or, under affliction, or vanity", "note": "or, under affliction, or vanity", "refs": [], "kwAr": "تنوء بالبلية", "noteAr": "أو: «تحت بلية»، أو «باطل»."}, {"kw": "Midian", "raw": "Gen_25:1-4; Num_31:2-12; Psa_83:5-10", "note": "", "refs": [{"l": "Gen 25:1-4", "n": "", "vs": [[1, "وعاد إبراهيم فاتخذ لنفسه زوجة تدعى قطورة،"], [2, "فأنجبت له زمران ويقشان ومدان ومديان ويشباق وشوحا."], [3, "وأنجب يقشان شبا وددان. أما أبناء ددان فهم: أشوريم ولطوشيم ولأميم."], [4, "وأبناء مديان هم: عيفة وعفر وحنوك وأبيداع، وألدعة. وهؤلاء جميعا من ذرية قطورة."]]}, {"l": "Num 31:2-12", "n": "", "vs": [[2, "«انتقم من المديانيين لبني إسرائيل، وبعدها تموت وتنضم إلى قومك»."], [3, "فقال موسى للشعب: «جهزوا منكم رجالا مجندين لمحاربة المديانيين والانتقام للرب منهم."], [4, "أرسلوا للحرب ألفا واحدا من كل سبط من أسباط إسرائيل»."], [5, "فتم اختيار ألف من كل سبط، فكانوا اثني عشر ألفا من بين ألوف إسرائيل مجردين للقتال."], [6, "فأرسلهم موسى، ألفا من كل سبط، للحرب بقيادة فينحاس بن ألعازار الكاهن، الذي أخذ معه أمتعة القدس وأبواق الهتاف."], [7, "فحاربوا المديانيين كما أمر الرب وقتلوا كل ذكر؛"], [8, "وقتلوا معهم ملوكهم الخمسة: أوي وراقم وصور وحور ورابع، كما قتلوا بلعام بن بعور بحد السيف."], [9, "وأسر بنو إسرائيل نساء المديانيين وأطفالهم، وغنموا جميع بهائمهم ومواشيهم وسائر أملاكهم،"], [10, "وأحرقوا مدنهم كلها بمساكنها وحصونها،"], [11, "واستولوا على كل الغنائم والأسلاب من الناس والحيوان،"], [12, "ورجعوا إلى موسى وألعازار الكاهن وجماعة إسرائيل بالسبي والأسلاب والغنيمة إلى المخيم في سهول موآب بالقرب من نهر الأردن مقابل أريحا."]]}, {"l": "Psa 83:5-10", "n": "", "vs": [[5, "فإنهم قد تآمروا معا بقلب واحد، وعقدوا حلفا ضدك."], [6, "عشائر أدوم وبنو إسماعيل، نسل موآب وبنو هاجر."], [7, "جبال وعمون وعماليق، الفلسطينيون وأهل صور،"], [8, "وقوم أشور أيضا انضموا إليهم، صاروا عونا لبني لوط."], [9, "افعل بهم كما فعلت بمديان وسيسرا ويابين في نهر قيشون."], [10, "بادوا في عين دور، وصاروا زبلا للأرض."]]}], "kwAr": "مديان", "noteAr": ""}], "arS": [["لقد ", []], ["رأيت", ["H7200"]], [" ", []], ["خيام", ["H168"]], [" ", []], ["كوشان", ["H3572"]], [" ", []], ["تنوء", ["H8478"]], [" ", []], ["بالبلية", ["H205"]], [" ", []], ["وشقق", ["H3407"]], [" أخبية ", []], ["ديار", ["H776"]], [" ", []], ["مديان", ["H4080"]], [" ", []], ["ترجف", ["H7264"]], [" رعبا.", []]]}, {"c": 3, "v": 8, "text": "هل غضبك منصب على الأنهار يارب؟ أعلى الأنهار احتدم سخطك؟ أم على البحر سكبت جام غيظك، عندما ركبت خيولك ومركبات ظفرك؟", "groups": [{"kw": "the Lord", "raw": "Exo_14:21, Exo_14:22; Jos_3:16, Jos_3:17; Psa_114:3, Psa_114:5; Isa_50:2; Nah_1:4; Mar_4:39; Rev_16:12", "note": "", "refs": [{"l": "Exo 14:21", "n": "", "vs": [[21, "وبسط موسى يده فوق البحر، فأرسل الرب طوال تلك الليلة ريحا شرقية قوية ردت البحر إلى الوراء، وحولته إلى يابسة. وهكذا انشق البحر،"]]}, {"l": "Exo 14:22", "n": "", "vs": [[22, "فاجتاز الإسرائيليون في وسط البحر على أرض يابسة، فكان الماء بمثابة سورين عن يمينهم وعن يسارهم."]]}, {"l": "Jos 3:16", "n": "", "vs": [[16, "حتى توقفت المياه المنحدرة من المرتفعات عن الجريان، وأخذت تتراكم على نفسها كما لو كانت محجوزة وراء سد، بعيدا جدا عن مدينة أدام المجاورة لبلدة صرتان. أما المياه المنصبة في البحر الميت فقد انقطعت تماما عنه. وهكذا عبر الشعب قبالة أريحا."]]}, {"l": "Jos 3:17", "n": "", "vs": [[17, "فوقف الكهنة حاملو تابوت عهد الرب في وسط مجرى نهر الأردن ريثما تم عبور جميع الشعب فوق أرضه اليابسة نحو الضفة الأخرى."]]}, {"l": "Psa 114:3", "n": "", "vs": [[3, "رأى البحر الأحمر ذلك فهرب، وتراجع نهر الأردن إلى الوراء."]]}, {"l": "Psa 114:5", "n": "", "vs": [[5, "ما لك يابحر قد هربت، وياأردن قد رجعت إلى الوراء؟"]]}, {"l": "Isa 50:2", "n": "", "vs": [[2, "فمالي إذا حين أتيت لم أجد أحدا؟ ناديت ولا من مجيب؟ هل قصرت يدي عن الفداء؟ أم لم تعد لي طاقة على الإنقاذ؟ ها أنا بزجرتي أجفف البحر وأحول الأنهار إلى صحراء ينتن سمكها لخلوها من الماء، فيموت من العطش."]]}, {"l": "Nah 1:4", "n": "", "vs": [[4, "يزجر البحر فيجففه. ينضب جميع الأنهار، فتذوي مراعي باشان والكرمل، ويذبل زهر لبنان."]]}, {"l": "Mar 4:39", "n": "", "vs": [[39, "فنهض، وزجر الريح، وقال للبحر: «اصمت. اخرس!» فسكنت الريح وساد هدوء تام."]]}, {"l": "Rev 16:12", "n": "", "vs": [[12, "وسكب الملاك السادس كأسه على نهر «الفرات» الكبير فجف ماؤه، ليصير ممرا للملوك القادمين م
