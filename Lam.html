, Deu_28:57; 2Ki_6:29", "note": "", "refs": [{"l": "Lam 3:48", "n": "", "vs": [[48, "تفيض عيناي بأنهار مياه على دمار ابنة شعبي."]]}, {"l": "Deu 28:56", "n": "", "vs": [[56, "وكذلك فإن أكثر النساء رقة ورأفة، والتي لنعومتها وترفهها لا تجرؤ على لمس الأرض بباطن قدمها، تبخل على زوجها رجل حضنها وعلى ابنها وابنتها"]]}, {"l": "Deu 28:57", "n": "", "vs": [[57, "بمشيمتها الساقطة منها، وبأولادها الذين تلدهم، لأنها تنوي أن تأكلهم سرا في أثناء الحصار، في الضيقة التي يضايقكم بها عدوكم في كل مدنكم."]]}, {"l": "2Ki 6:29", "n": "", "vs": [[29, "فسلقنا ابني وأكلناه. وعندما قلت لها في اليوم التالي: هاتي ابنك لنأكله، خبأت ابنها»."]]}], "kwAr": "في أثناء دمار", "noteAr": ""}], "arS": [["طهت", ["H1310"]], [" ", []], ["أيدي", ["H3027"]], [" ", []], ["الأمهات", ["H802"]], [" ", []], ["الحانيات", ["H7362"]], [" ", []], ["أولادهن", ["H3206"]], [" ", []], ["ليكونوا", ["H1961"]], [" ", []], ["طعاما", ["H1262"]], [" لهن في أثناء ", []], ["دمار", ["H7667"]], [" ", []], ["ابنة", ["H1323"]], [" ", []], ["شعبي", ["H5971"]], [".", []]]}, {"c": 4, "v": 11, "text": "نفث الرب كامل سخطه وصب حمو غضبه، وأضرم نارا في صهيون فالتهمت أسسها.", "groups": [{"kw": "Lord", "raw": "Lam_4:22, Lam_2:8, Lam_2:17; Deu_32:21-25; Jer_6:11, Jer_6:12, Jer_7:20, Jer_9:9-11, Jer_13:14; Jer_14:15, Jer_14:16, Jer_15:1-4, Jer_19:3-11, Jer_23:19, Jer_23:20, Jer_24:8-10; Eze_20:47, Eze_20:48; Eze_22:31; Dan_9:12; Zec_1:6; Luk_21:22", "note": "", "refs": [{"l": "Lam 4:22", "n": "", "vs": [[22, "قد تم إثمك ياابنة صهيون، ولن يطيل (الله ) من حقبة سبيك. أما أنت ياابنة أدوم فإنه يعاقبك ويفضح خطاياك."]]}, {"l": "Lam 2:8", "n": "", "vs": [[8, "عزم الرب أن يقوض سور ابنة صهيون. مد خيط القياس ولم يرد يده عن سحقها، فاستبكى المترسة والسور فسقطا معا."]]}, {"l": "Lam 2:17", "n": "", "vs": [[17, "نفذ الرب قضاءه، وحقق وعيده الذي حكم به منذ الحقب السالفة. هدم ولم يرأف، فأشمت بك الخصم، وعظم قوة عدوك."]]}, {"l": "Deu 32:21-25", "n": "", "vs": [[21, "هيجوا غيرتي بعبادة أوثانهم، وأسخطوني بأصنامهم الباطلة. لذلك سأثير غيرتهم بشعب متوحش، وأغيظهم بأمة حمقاء."], [22, "فها قد أضرم غضبي نارا تحرق حتى الهاوية السفلى، وتأكل الأرض وغلاتها، وتشعل أسس الجبال."], [23, "أكوم عليهم شرورا وأنفذ سهامي فيهم."], [24, "وحين يكونون خائرين من الجوع، منهوكين من الحمى والداء السام، أجعل أنياب الوحوش مع سم زواحف الأرض تنشب فيهم."], [25, "يثكلهم سيف العدو في الطريق، ويستولي عليهم الرعب داخل الخدور، فيهلك الفتى مع الفتاة، والرضيع مع الشيخ."]]}, {"l": "Jer 6:11", "n": "", "vs": [[11, "لذلك امتلأت من سخط الرب وأعياني كظمه. أسكبه على الأولاد في الطريق وعلى الشبان المجتمعين في مجالسهم، فيصيب الرجل وزوجته والشيخ والطاعن في السن."]]}, {"l": "Jer 6:12", "n": "", "vs": [[12, "وتتحول بيوتهم وحقولهم لآخرين، وكذلك نساؤهم، لأني أبسط يدي ضد سكان الأرض»، يقول الرب"]]}, {"l": "Jer 7:20", "n": "", "vs": [[20, "لذلك يعلن السيد الرب: ها غضبي وسخطي ينصبان على هذا الموضع، وعلى البشر والبهائم والأشجار والحقول وأثمار الأرض، فيتقدان ولا يخمدان»."]]}, {"l": "Jer 9:9-11", "n": "", "vs": [[9, "ألا أعاقبهم على هذه الأمور؟» يقول الرب. «ألا أنتقم لنفسي من أمة كهذه؟»"], [10, "سأنتحب وأنوح على الجبال وأندب على مراعي البرية لأنها احترقت وأوحشت، فلا يجتاز بها عابر ولا يتردد فيها صوت القطعان، وقد هجرتها طيور السماء والوحوش."], [11, "«سأجعل أورشليم رجمة خراب، ومأوى لبنات آوى، وأحول مدن يهوذا إلى قفر مهجور»."]]}, {"l": "Jer 13:14", "n": "", "vs": [[14, "وأهشمهم الواحد فوق الآخر، الآباء والأبناء معا، يقول الرب. لا أشفق ولا أترَأف ولا أرحم، بل أهلكهم»."]]}, {"l": "Jer 14:15", "n": "", "vs": [[15, "لذلك هكذا يقول الرب عن هؤلاء الأنبياء المتنبئين باسمي: مع أني لم أرسلهم فإنهم يقولون: لن تبتلى هذه الأرض بسيف ولا مجاعة، لهذا فإن هولاء الأنبياء يفنون بالسيف والمجاعة."]]}, {"l": "Jer 14:16", "n": "", "vs": [[16, "ويغدو الشعب الذي يتنبأون له، مطروحا صريعا في شوارع أورشليم فريسة الجوع والسيف، وليس من يدفنهم هم ونساءهم وأبناءهم وبناتهم، وأصب شرهم عليهم»."]]}, {"l": "Jer 15:1-4", "n": "", "vs": [[1, "ثم قال لي الرب: «وحتى لو مثل موسى وصموئيل أمامي، من أجل الشعب فإن قلبي لن يلتفت إلى هذا الشعب. اطرحهم من محضري فيخرجوا."], [2, "وعندما يسألونك: إلى أين نذهب؟ أجبهم: هذا ما يعلنه الرب: من هو للوبأ فبالوبأ يموت، ومن هو للسيف فبالسيف يقتل، ومن هو للمجاعة فبالمجاعة يفنى، ومن هو للسبي فإلى السبي يذهب."], [3, "وأعهد بهم إلى أربعة أصناف من الخراب يقول الرب: السيف للذبح، والكلاب للتمزيق، وطيور السماء ووحوش الأرض للافتراس والإهلاك."], [4, "وأجعلهم مثار رعب أمم الأرض نتيجة لما ارتكبه منسى بن حزقيا في أورشليم."]]}, {"l": "Jer 19:3-11", "n": "", "vs": [[3, "وقل: اسمعوا ياملوك يهوذا، وياأهل أورشليم كلمة الرب. هذا ما يعلنه الرب القدير إله إسرائيل: انظروا، ها أنا أجلب على هذا الموضع شرا تطن له أذنا كل من يسمع به،"], [4, "لأنهم تركوني، وتنكروا لهذا الموضع ودنسوه بإحراق بخور لآلهة أوثان لم يعرفوها لا هم ولا آباؤهم ولا ملوك يهوذا أيضا، ولأنهم ملأوا هذا الموضع من دم الأبرياء."], [5, "وبنوا مرتفعات لعبادة البعل ليحرقوا بنيهم بالنار كقرابين محرقات للبعل مما لم أوص به ولم أتحدث عنه ولم يخطر ببالي."], [6, "لذلك، ها أيام مقبلة، يقول الرب، لا يدعى فيها هذا المكان توفة من بعد أو وادي ابن هنوم، بل وادي القتل."], [7, "وأبطل في هذا الموضع مشورات أهل يهوذا وأورشليم، فيتساقطون بحد السيف أمام أعدائهم وبأيدي طالبي نفوسهم، وأجعل جثثهم طعاما لجوارح السماء ووحوش الأرض."], [8, "وأدمر هذه المدينة وأجعلها مثار صفير. كل من يمر بها تعتريه الدهشة ويصفر لما حل بها من نكبات."], [9, "وأطعمهم لحوم أبنائهم وبناتهم، ويأكل كل واحد لحم جاره في أثناء الحصار والضيقة التي يضايقهم بها أعداؤهم وطالبو نفوسهم."], [10, "ثم حطم الجرة على مرأى الرجال الذاهبين معك،"], [11, "وقل لهم: هذا ما يعلنه الرب القدير: سأحطم هذا الشعب وأدمر هذه المدينة كما يحطم المرء إناء الخزاف، بحيث لا يمكن إصلاحه، ويدفن الرجال في توفة إذ لن يتوافر موضع آخر للدفن."]]}, {"l": "Jer 23:19", "n": "", "vs": [[19, "ها عاصفة سخط الرب قد انطلقت، وزوبعة هوجاء قد ثارت لتجتاح رؤوس الأشرار."]]}, {"l": "Jer 23:20", "n": "", "vs": [[20, "فغضب الرب لن يرتد حتى ينجز مقاصد قلبه التي ستدركونها بوضوح في آخر الأيام."]]}, {"l": "Jer 24:8-10", "n": "", "vs": [[8, "أما صدقيا ملك يهوذا وعظماؤه وسائر أهل أورشليم الذين مكثوا في هذه الأرض والذين نزحوا إلى ديار مصر، فإني أجعلهم مثل هذا التين الرديء الذي تعاف النفس أكله لفرط رداءته."], [9, "وأوقعهم في الضيق والشر في جميع ممالك الأرض، وأجعلهم عارا وعبرة وأحدوثة ولعنة في جميع الأماكن التي أجليهم إليها."], [10, "وأعرضهم للسيف والجوع والوباء حتى يفنوا في الأرض التي وهبتها لهم ولآبائهم»."]]}, {"l": "Eze 20:47", "n": "", "vs": [[47, "وقل لغابات النقب: اسمعوا قضاء الرب، فهذا ما يعلنه السيد الرب: ها أنا أضرم نارا فيك فتلتهم كل شجرة خضراء ويابسة، ولا ينطفيء لهيبها المتأجج، فتحترق بها كل الوجوه من الجنوب إلى الشمال."]]}, {"l": "Eze 20:48", "n": "", "vs": [[48, "فيرى كل بشر أني أنا الرب الذي أضرمتها، ولا يمكن أن تنطفيء»."]]}, {"l": "Eze 22:31", "n": "", "vs": [[31, "فصببت سخطي عليهم، التهمتهم بنار غضبي، جازيتهم بحسب طرقهم، يقول السيد الرب»."]]}, {"l": "Dan 9:12", "n": "", "vs": [[12, "وقد نفذت قضاءك الذي قضيت به علينا وعلى قضاتنا الذين تولوا أمرنا، جالبا علينا وعلى أورشليم شرا عظيما لم يحدث له مثيل تحت السماء."]]}, {"l": "Zec 1:6", "n": "", "vs": [[6, "ولكن ألم تدرك أقوالي وفرائضي التي أمرت بها عبيدي الأنبياء آباءكم فتابوا قائلين: لقد نفذ الرب القدير ما عزم أن يعاقبنا بمقتضى ما ارتكبناه من أعمال باطلة؟»"]]}, {"l": "Luk 21:22", "n": "", "vs": [[22, "فإن هذه الأيام أيام انتقام يتم فيها كل ما قد كتب."]]}], "kwAr": "الرب", "noteAr": ""}, {"kw": "kindled", "raw": "Deu_32:22; Jer_21:14", "note": "", "refs": [{"l": "Deu 32:22", "n": "", "vs": [[22, "فها قد أضرم غضبي نارا تحرق حتى الهاوية السفلى، وتأكل الأرض وغلاتها، وتشعل أسس الجبال."]]}, {"l": "Jer 21:14", "n": "", "vs": [[14, "ها أنا أعاقبكم بحسب ثمار أعمالكم، وأوقد نارا في غابة مدينتكم فتلتهم كل ما حولها»."]]}], "kwAr": "وأضرم نارا", "noteAr": ""}], "arS": [["نفث", ["H3615"]], [" ", []], ["الرب", ["H3068"]], [" كامل ", []], ["سخطه", ["H639"]], [" ", []], ["وصب", ["H8210"]], [" ", []], ["حمو", ["H2740"]], [" ", []], ["غضبه", ["H2534"]], ["، ", []], ["وأضرم", ["H3341"]], [" ", []], ["نارا", ["H784"]], [" في ", []], ["صهيون", ["H6726"]], [" ", []], ["فالتهمت", ["H398"]], [" ", []], ["أسسها", ["H3247"]], [".", []]]}, {"c": 4, "v": 12, "text": "لم يصدق ملوك الأرض وسكان المعمورة أن العدو والخصم يقتحمان بوابات أورشليم.", "groups": [{"kw": "", "raw": "Deu_29:24-28; 1Ki_9:8, 1Ki_9:9; Psa_48:4-6", "note": "", "refs": [{"l": "Deu 29:24-28", "n": "", "vs": [[24, "فتقول جميع الأمم: لماذا فعل الرب هذا كله بهذه الأرض؟ ولماذا احتدام هذا الغضب العظيم؟"], [25, "فيكون الجواب: لأن هذا الشعب نقض عهد الرب إله آبائهم الذي قطعه معهم حين أخرجهم من ديار مصر،"], [26, "وغووا وعبدوا آلهة أخرى وسجدوا لها، آلهة غريبة لم يعرفوها ولم يعطها الرب لهم،"], [27, "فالتهب غضب الرب على تلك الأرض، فصب عليها كل اللعنات المدونة فى هذا الكتاب"], [28, "واجتثهم من أرضهم بغضب وسخط وغيظ عظيم، وطوح بهم إلى أرض أخرى كما هو حادث اليوم."]]}, {"l": "1Ki 9:8", "n": "", "vs": [[8, "ويصبح هذا الهيكل عبرة يثير عجب كل من يمر به، فيصفر ويتساءل: لماذا صنع الرب هكذا بهذه الأرض وبهذا الهيكل؟"]]}, {"l": "1Ki 9:9", "n": "", "vs": [[9, "فيأتيهم الجواب: لأنهم تركوا الرب إلههم الذي أخرج آباءهم من ديار مصر، وتشبثوا بآلهة أخرى وسجدوا لها وعبدوها، لذلك جلب الرب عليهم كل هذا البلاء»."]]}, {"l": "Psa 48:4-6", "n": "", "vs": [[4, "هوذا الملوك قد احتشدوا وعبروا معا."], [5, "رأوا بيت الله فذهلوا. ارتاعوا وفروا."], [6, "هناك اعترتهم رعدة فتوجعوا كامرأة في مخاضها."]]}], "kwAr": "", "noteAr": ""}], "arS": [["لم", ["H3808"]], [" ", []], ["يصدق", ["H539"]], [" ", []], ["ملوك", ["H4428"]], [" ", []], ["الأرض", ["H776"]], [" ", []], ["وسكان", ["H3427"]], [" ", []], ["المعمورة", ["H8398"]], [" ", []], ["أن", ["H3588"]], [" ", []], ["العدو", ["H341"]], [" والخصم ", []], ["يقتحمان", ["H935"]], [" ", []], ["بوابات", ["H8179"]], [" ", []], ["أورشليم", ["H3389"]], [".", []]]}, {"c": 4, "v": 13, "text": "عقابا لها على خطايا أنبيائها وآثام كهنتها، الذين سفكوا في وسطها دم الصديقين.", "groups": [{"kw": "the sins", "raw": "Lam_2:14; Jer_5:31, Jer_6:13, Jer_14:14, Jer_23:11-21; Eze_22:26-28; Mic_3:11, Mic_3:12; Zep_3:3, Zep_3:4", "note": "", "refs": [{"l": "Lam 2:14", "n": "", "vs": [[14, "رأى لك أنبياؤك رؤى باطلة خادعة. لم يفضحوا إثمك ليردوا سبيك. إنما رأوا لك وحيا كاذبا مضلا."]]}, {"l": "Jer 5:31", "n": "", "vs": [[31, "فالأنبياء يتنبأون زورا، والكهنة يتصرفون بمقتضى أحكامهم، وشعبي أحب مثل هذا. ولكن ماذا تصنعون في نهاية المطاف؟»"]]}, {"l": "Jer 6:13", "n": "", "vs": [[13, "لأنهم جميعا، صغارهم وكبارهم، مولعون بالربح الحرام. حتى النبي والكاهن يرتكبان الزور في أعمالهما."]]}, {"l": "Jer 14:14", "n": "", "vs": [[14, "وقال لي الرب: «إن الأنبياء يتنبأون زورا باسمي وأنا لم أرسلهم ولم آمرهم، ولم أكلمهم، إنما هم يتنبأون لكم برؤيا كاذبة وعرافة باطلة مستوحاة من ضلال قلوبهم."]]}, {"l": "Jer 23:11-21", "n": "", "vs": [[11, "ويقول الرب: «النبي والكاهن كافران، وفي بيتي وجدت شرهما."], [12, "لذلك يضحي طريقهما مزالق لهما، تفضي بهما إلى الظلمات التي يطردون إليها، ويهويان فيها لأني أجلب عليهما شرا في سنة عقابهما»."], [13, "في أوساط أنبيا ء السامرة شهدت أمورا كريهة، إذ تنبأوا باسم البعل، وأضلوا شعبي إسرائيل."], [14, "وفي أوساط أنبياء أورشليم رأيت أمورا مهولة: يرتكبون الفسق، ويسلكون في الأكاذيب، يشددون أيدي فاعلي الإثم لئلا يتوب أحد عن شره. صاروا جميعا كسكان سدوم وأصبح أهلها كأهل عمورة."], [15, "لذلك هذا ما يقوله الرب القدير عن الأنبياء: «ها أنا أطعمهم أفسنتينا وأسقيهم ماء مسموما، لأنه من أنبياء أورشليم شاع الكفر في كل أرجاء الأرض»."], [16, "«لا تسمعوا لأقوال الأنبياء الذين يتنبأون لكم ويخدعونكم بالأوهام، لأنهم ينطقون برؤى مخيلاتهم، ولا يتكلمون بما أوحى به فمي."], [17, "قائلين بإصرار لمن يحتقرونني: قد أعلن الرب أن السلام يسودكم ويرددون لكل من يجري وراء أهواء قلبه: لن يصيبكم ضر."], [18, "مع أنه ليس بينهم من مثل في مجلس الرب ورأى وأنصت لكلمته، ولا من أصغى لقوله وأطاعه."], [19, "ها عاصفة سخط الرب قد انطلقت، وزوبعة هوجاء قد ثارت لتجتاح رؤوس الأشرار."], [20, "فغضب الرب لن يرتد حتى ينجز مقاصد قلبه التي ستدركونها بوضوح في آخر الأيام."], [21, "إني لم أرسل هؤلاء الأنبياء، ومع ذلك انطلقوا راكضين، ولم أوح لهم ومع ذلك يتنبأون."]]}, {"l": "Eze 22:26-28", "n": "", "vs": [[26, "خالف كهنتها شريعتي ونجسوا مقادسي. لم يميزوا بين المقدس والرجس، ولم يعلموا الفرق بين الطاهر والنجس، وحجبوا عيونهم عن أيام سبوتي فصرت مدنسا في وسطهم."], [27, "رؤساؤها فيها كذئاب خاطفة تمزق فرائسها إذ يسفكون دماء الناس في سبيل الربح الحرام."], [28, "وأنبياؤها قد طلوا لهم بماء الكلس، إذ يرون لهم رؤى باطلة، ويعرفون لهم عرافة كاذبة قائلين: هذا ما يعلنه السيد الرب، مع أن الرب لم يعلن شيئا."]]}, {"l": "Mic 3:11", "n": "", "vs": [[11, "إذ يحكم رؤساؤها بالرشوة، وكهنتها يعلمون بالأجرة ويتعاطى أنبياؤها العرافة لقاء المال، ومع ذلك يدعون الاتكال على الله قائلين: «أليس الرب في وسطنا؟ لذلك لن يصيبنا مكروه»."]]}, {"l": "Mic 3:12", "n": "", "vs": [[12, "لهذا من جراء أعمالكم ستحرث صهيون كالحقل وتصبح أورشليم كومة من الخرائب، وجبل الهيكل مرتفعا تنمو عليه أشجار الغاب."]]}, {"l": "Zep 3:3", "n": "", "vs": [[3, "رؤساؤها في داخلها أسود زائرة، وقضاتها كذئاب المساء الجائعة التي لا تبقي شيئا من فرائسها إلى الصباح."]]}, {"l": "Zep 3:4", "n": "", "vs": [[4, "أنبياؤها مغرورون وخونة، وكهنتها يدنسون المقدس ويتعدون على الشريعة."]]}], "kwAr": "خطايا أنبيائها", "noteAr": ""}, {"kw": "that", "raw": "Jer_2:20, Jer_26:8, Jer_26:9; Mat_23:31, Mat_23:33-37; Luk_11:47-51; Act_7:52; 1Th_2:15, 1Th_2:16", "note": "", "refs": [{"l": "Jer 2:20", "n": "", "vs": [[20, "قد حطمت نيري من زمن بعيد، وقطعت قيودك وقلت: لن أتعبد لك، وصرت تضطجعين كزانية فوق كل أكمة مرتفعة وتحت كل شجرة خضراء (أي عبدت الأوثان)."]]}, {"l": "Jer 26:8", "n": "", "vs": [[8, "فلما فرغ إرميا من الإدلاء بكل ما أمره الرب أن يخاطب به الشعب، قبض الكهنة والأنبياء وسائر الشعب عليه قائلين: «لابد أن تموت."]]}, {"l": "Jer 26:9", "n": "", "vs": [[9, "لماذا تنبأت باسم الرب قائلا: إن مصير هذا الهيكل سيكون كمصير شيلوه، وهذه المدينة تصير خربا مهجورة؟». وأحاط الشعب كله بإرميا في بيت الرب."]]}, {"l": "Mat 23:31", "n": "", "vs": [[31, "فبهذا تشهدون على أنفسكم بأنكم أبناء قاتلي الأنبياء!"]]}, {"l": "Mat 23:33-37", "n": "", "vs": [[33, "أيها الحيات، أولاد الأفاعي! كيف تفلتون من عقاب جهنم؟"], [34, "لذلك: ها أنا أرسل إليكم أنبياء وحكماء ومعلمين، فبعضهم تقتلون وتصلبون، وبعضهم تجلدون في مجامعكم، وتطاردونهم من مدينة إلى أخرى."], [35, "وبهذا يقع عليكم كل دم زكي سفك على الأرض: من دم هابيل البار إلى دم زكريا بن برخيا الذي قتلتموه بين الهيكل والمذبح."], [36, "الحق أقول لكم: إن عقاب ذلك كله سينزل بهذا الجيل."], [37, "ياأورشليم، ياأورشليم، ياقاتلة الأنبياء وراجمة المرسلين إليها! كم مرة أردت أن أجمع أولادك كما تجمع الدجاجة فراخها تحت جناحيها، فلم تريدوا!"]]}, {"l": "Luk 11:47-51", "n": "", "vs": [[47, "الويل لكم، فإنكم تبنون قبور الأنبياء وآباؤكم قتلوهم."], [48, "فأنتم إذن تشهدون موافقين على أعمال آبائكم: فهم قتلوا الأنبياء، وأنتم تبنون قبورهم."], [49, "لهذا السبب أيضا قالت حكمة الله: سأرسل إليهم أنبياء ورسلا، فيقتلون منهم ويضطهدون،"], [50, "حتى إن دماء جميع الأنبياء المسفوكة منذ تأسيس العالم، يطالب بها هذا الجيل،"], [51, "من دم هابيل إلى دم زكريا الذي قتل بين المذبح والقدس! أقول لكم: نعم، إن تلك الدماء يطالب بها هذا الجيل."]]}, {"l": "Act 7:52", "n": "", "vs": [[52, "فأي نبي نجا من اضطهادهم وقد قتلوا الذين أنبأوا بمجيء البار الذي سلمتموه أنتم وقتلتموه!"]]}, {"l": "1Th 2:15", "n": "", "vs": [[15, "الذين قتلوا الرب يسوع والأنبياء واضطهدونا نحن أيضا، وهم لا يرضون الله ويعادون الناس جميعا،"]]}, {"l": "1Th 2:16", "n": "", "vs": [[16, "إذ يمنعوننا من تبشير الأمم ليخلصوا، وبذلك يستكملون خطاياهم كل حين، ولكن الغضب قد حل عليهم إلى الغاية."]]}], "kwAr": "الذين سفكوا", "noteAr": ""}], "arS": [["عقابا لها على ", []], ["خطايا", ["H2403"]], [" ", []], ["أنبيائها", ["H5030"]], [" ", []], ["وآثام", ["H5771"]], [" ", []], ["كهنتها", ["H3548"]], ["، الذين ", []], ["سفكوا", ["H8210"]], [" في ", []], ["وسطها", ["H7130"]], [" ", []], ["دم", ["H1818"]], [" ", []], ["الصديقين", ["H6662"]], [".", []]]}, {"c": 4, "v": 14, "text": "تاهوا كعمي في الشوارع، ملطخين بالدم حتى لم يقدر أحد أن يلمس ثيابهم.", "groups": [{"kw": "have wandered", "raw": "Deu_28:28, Deu_28:29; Isa_29:10-12, Isa_56:10, Isa_59:9-11; Mic_3:6, Mic_3:7; Mat_15:14; Eph_4:18", "note": "", "refs": [{"l": "Deu 28:28", "n": "", "vs": [[28, "ويبتليكم الرب بالجنون والعمى وارتباك الفكر،"]]}, {"l": "Deu 28:29", "n": "", "vs": [[29, "فتتحسسون طرقكم في الظهر كما يتحسس الأعمى طريقه في الظلام، وتبوء طرقكم بالإخفاق، ولا تكونون إلا مظلومين مغصوبين كل الأيام، وليس من منقذ."]]}, {"l": "Isa 29:10-12", "n": "", "vs": [[10, "لأن الرب قد سكب عليكم روح سبات عميق، فأغلق عيون أنبيائكم وغطى رؤوس رائييكم."], [11, "وصارت لكم هذه الرؤيا جميعها ككلمات كتاب مختوم، حين يناولونه لمن يتقن القراءة قائلين: اقرأ هذا، يجيب: لا أستطيع لأنه مختوم."], [12, "وعندما يناولونه لمن يجهل القراءة قائلين: اقرأ هذا، يجيب: لا أستطيع القراءة."]]}, {"l": "Isa 56:10", "n": "", "vs": [[10, "فإن رقباءهم عمي، وكلهم جهال، وكلاب بكم عاجزون عن النباح، حالمون راقدون مولعون بالنوم."]]}, {"l": "Isa 59:9-11", "n": "", "vs": [[9, "الحق ابتعد عنا، ولم يدركنا العدل. نرتقب نورا، فيحدق بنا الظلام، وننشد ضوءا فنسلك في العتمة."], [10, "نتحسس الحائط كالأعمى، ونتلمس كالمكفوف، نتعثر في الظهيرة كما لو كنا نسير في عتمة الليل ونكون كالأموات بين المتدفقين بالحياة"], [11, "كلنا نزمجر كالدببة، وننوح كالحمام. نبحث عن العدل فلا نجده، وعن الخلاص وإذا به قد ابتعد عنا،"]]}, {"l": "Mic 3:6", "n": "", "vs": [[6, "لذلك يطغى عليكم ليل خال من الرؤيا، وظلام من غير عرافة، وتغرب الشمس عن الأنبياء ويظلم عليهم النهار."]]}, {"l": "Mic 3:7", "n": "", "vs": [[7, "يعتري الرائين الخزي وينتاب العرافين الخجل، ويغطون جميعهم شفاههم لأنهم لا ينالون جوابا من الرب."]]}, {"l": "Mat 15:14", "n": "", "vs": [[14, "دعوهم وشأنهم، فهم عميان يقودون عميانا. وإذا كان الأعمى يقود أعمى، يسقطان معا في حفرة»."]]}, {"l": "Eph 4:18", "n": "", "vs": [[18, "لكونهم مظلمي البصيرة ومتغربين عن حياة الله بسبب ما فيهم من جهل وقساوة قلب."]]}], "kwAr": "تاهوا", "noteAr": ""}, {"kw": "they have polluted", "raw": "Num_35:33; Isa_1:15; Jer_2:34", "note": "", "refs": [{"l": "Num 35:33", "n": "", "vs": [[33, "لا تدنسوا الأرض التي أنتم فيها، لأن سفك الدم يدنس الأرض، ولا يكفر عن الأرض التي سفك عليها الدم إلا بدم السافك."]]}, {"l": "Isa 1:15", "n": "", "vs": [[15, "عندما تبسطون نحوي أيديكم أحجب وجهي عنكم، وإن أكثرتم الصلاة لا أستجيب، لأن أيديكم مملوءة دما."]]}, {"l": "Jer 2:34", "n": "", "vs": [[34, "فوجد في أذيالكم أيضا دم المساكين الأبرياء الذين لم تقبضوا عليهم متلبسين بجريمة الاقتحام. ومع كل ذلك"]]}], "kwAr": "ملطخين بالدم", "noteAr": ""}, {"kw": "so that men could not touch", "raw": "or, in that they could not but touch, Num_19:16; Hos_4:2", "note": "or, in that they could not but touch, Num_19:16; Hos_4:2", "refs": [{"l": "Num 19:16", "n": "", "vs": [[16, "وكل من لمس على وجه الصحراء قتيلا بسيف أو ميتا، أو عظم إنسان أو قبرا، يكون نجسا سبعة أيام."]]}, {"l": "Hos 4:2", "n": "", "vs": [[2, "وتفشت فيها اللعنة والكذب والقتل والسرقة والفسق. قد تخطوا كل حد، وسفك الدم يعقبه سفك دم."]]}], "kwAr": "حتى لم يقدر أحد أن يلمس ثيابهم", "noteAr": "أو: لأنهم لا بد أن يلمسوا. انظر عد 19: 16؛ هو 4: 2"}], "arS": [["تاهوا", ["H5128"]], [" ", []], ["كعمي", ["H5787"]], [" في ", []], ["الشوارع", ["H2351"]], ["، ", []], ["ملطخين", ["H1351"]], [" ", []], ["بالدم", ["H1818"]], [" حتى ", []], ["لم", ["H3808"]], [" ", []], ["يقدر", ["H3201"]], [" أحد أن ", []], ["يلمس", ["H5060"]], [" ", []], ["ثيابهم", ["H3830"]], [".", []]]}, {"c": 4, "v": 15, "text": "هتفوا بهم: «ابتعدوا: تنحوا لا تلمسوا شيئا». فهربوا وتشردوا! غير أن أهل الأمم قالوا: لا يمكن أن يسكنوا معنا!", "groups": [], "arS": [["هتفوا", ["H7121"]], [" بهم: «", []], ["ابتعدوا", ["H5493"]], [": ", []], ["تنحوا", ["H5493"]], [" ", []], ["لا", ["H3808"]], [" ", []], ["تلمسوا", ["H5060"]], [" شيئا». ", []], ["فهربوا", ["H5132"]], [" ", []], ["وتشردوا", ["H5128"]], ["! ", []], ["غير", ["H3588"]], [" أن أهل ", []], ["الأمم", ["H1471"]], [" ", []], ["قالوا", ["H559"]], [": ", []], ["لا", ["H408"]], [" يمكن أن ", []], ["يسكنوا", ["H1481"]], [" معنا!", []]]}, {"c": 4, "v": 16, "text": "قد بددهم الرب نفسه، ولم يعد يعبأ بهم، لم يكرموا الكهنة ولم يترَأفوا بالشيوخ.", "groups": [{"kw": "anger", "raw": "or, face", "note": "or, face", "refs": [], "kwAr": "الرب نفسه", "noteAr": "أو: وجه."}, {"kw": "hath", "raw": "Gen_49:7; Lev_26:33-39; Deu_28:25, Deu_28:64, Deu_28:65, Deu_32:26; Jer_15:4, Jer_24:9", "note": "", "refs": [{"l": "Gen 49:7", "n": "", "vs": [[7, "لأنهما في غضبهما اغتالا إنسانا، وفي عبثهما عرقبا ثورا. ملعون سخطهما لأنه عنيف وغضبهما لأنه ضار. أفرقهما في يعقوب وأشتتهما في إسرائيل."]]}, {"l": "Lev 26:33-39", "n": "", "vs": [[33, "وأشتتكم بين الشعوب، وأجرد عليكم سيفي، وألاحقكم، وأحول أرضكم إلى قفر ومدنكم إلى خرائب."], [34, "عندئذ تستوفي الأرض راحة سبوتها طوال سني وحشتها وأنتم مشتتون في ديار أعدائكم. حينئذ ترتاح الأرض وتستوفي سني سبوتها."], [35, "فتعوض في أيام وحشتها عن راحتها التي لم تنعم بها في سنوات سبوتكم عندما كنتم تقيمون عليها."], [36, "أما الباقون منكم في أرض أعدائكم، فإني ألقي الرعب في قلوبهم فيهربون من حفيف ورقة تسوقها الريح، وكأنهم يهربون من السيف، ويسقطون وليس ثمة من طارد لهم."], [37, "ويعثر بعضهم ببعض كمن يفر من أمام سيف من غير طارد لهم، ولا تثبتون أمام أعدائكم"], [38, "فتهلكون بين الشعوب، وتبتلعكم أرض أعدائكم."], [39, "أما بقيتكم فتفنى بذنوبها وذنوب آبائها في أرض أعدائكم كما فني آباؤهم من قبلهم."]]}, {"l": "Deu 28:25", "n": "", "vs": [[25, "ويهزمكم الرب أمام أعدائكم فتقبلون عليهم في طريق واحدة وتولون الأدبار أمامهم متفرقين في سبع طرق، وتصبحون عبرة لجميع ممالك الأرض."]]}, {"l": "Deu 28:64", "n": "", "vs": [[64, "ويشتتكم الرب بين جميع الأمم من أقصى الأرض إلى أقصاها، فتعبدون هناك آلهة أخرى من خشب أو حجر لم تعرفوها أنتم ولا آباؤكم،"]]}, {"l": "Deu 28:65", "n": "", "vs": [[65, "ولا تجدون بين تلك الأمم اطمئنانا ولا مقرا لقدم، بل يعطيكم الرب قلبا هلعا، وعيونا أوهنها الترقب، ونفوسا يائسة."]]}, {"l": "Deu 32:26", "n": "", "vs": [[26, "قلت: أشتتهم في زوايا الأرض، وأمحو من بين الناس ذكرهم."]]}, {"l": "Jer 15:4", "n": "", "vs": [[4, "وأجعلهم مثار رعب أمم الأرض نتيجة لما ارتكبه منسى بن حزقيا في أورشليم."]]}, {"l": "Jer 24:9", "n": "", "vs": [[9, "وأوقعهم في الضيق والشر في جميع ممالك الأرض، وأجعلهم عارا وعبرة وأحدوثة ولعنة في جميع الأماكن التي أجليهم إليها."]]}], "kwAr": "قد بددهم", "noteAr": ""}, {"kw": "he will", "raw": "Psa_106:44; Heb_8:9", "note": "", "refs": [{"l": "Psa 106:44", "n": "", "vs": [[44, "غير أنه التفت إلى ضيقتهم إذ سمع صراخهم."]]}, {"l": "Heb 8:9", "n": "", "vs": [[9, "هذا العهد الجديد ليس كالعهد الذي أبرمته مع آبائهم، حين أمسكت بأيديهم وأخرجتهم من أرض مصر. فبما أنهم خرقوا ذلك العهد، يقول الرب، أصبح من حقي أن ألغيه!"]]}], "kwAr": "ولم يعد يعبأ بهم", "noteAr": ""}, {"kw": "they respected", "raw": "Lam_5:12; 2Ki_25:18-21; 2Ch_36:17; Isa_9:14-16", "note": "", "refs": [{"l": "Lam 5:12", "n": "", "vs": [[12, "علق النبلاء بأيديهم ولم يوقروا الشيوخ."]]}, {"l": "2Ki 25:18-21", "n": "", "vs": [[18, "وسبى رئيس الحرس الملكي سرايا رئيس الكهنة، وصفنيا مساعده، وحراس الباب الثلاثة."], [19, "وقبض على خصي واحد من أهل المدينة، كان قائدا للجيش، وعلى خمسة رجال من ندماء الملك الذين تم العثور عليهم في المدينة، وكاتب قائد الجيش المسئول عن التجنيد، وستين رجلا من الفلاحين أهل المدينة."], [20, "واقتادهم نبوزرادان رئيس الحرس إلى ملك بابل المعسكر في ربلة،"], [21, "فقتلهم ملك بابل في ربلة في أرض حماة. وهكذا سبي شعب يهوذا من أرضه."]]}, {"l": "2Ch 36:17", "n": "", "vs": [[17, "فأرسل إليهم ملك الكلدانيين، فقتل نخبتهم بالسيف في عقر الهيكل المقدس. ولم يرحم الرب فتى أو عذراء أو شيخا أو أشيب، بل أسلمهم جميعا ليد الكلدانيين،"]]}, {"l": "Isa 9:14-16", "n": "", "vs": [[14, "لذلك سيقطع الرب من إسرائيل في يوم واحد الرأس والذنب، النخل والأسل."], [15, "إن الشيخ والوجيه هو الرأس، والنبي الذي يلقن الكذب هو الذنب"], [16, "فمرشدو هذا الشعب يضلونه، والمرشدون يبتلعون."]]}], "kwAr": "لم يكرموا الكهنة", "noteAr": ""}], "arS": [["قد ", []], ["بددهم", ["H2505"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["نفسه", ["H6440"]], ["، ", []], ["ولم", ["H3808"]], [" ", []], ["يعد", ["H3254"]], [" ", []], ["يعبأ", ["H5027"]], [" بهم، ", []], ["لم", ["H3808"]], [" ", []], ["يكرموا", ["H5375", "H6440"]], [" ", []], ["الكهنة", ["H3548"]], [" ", []], ["ولم", ["H3808"]], [" ", []], ["يترَأفوا", ["H2603"]], [" ", []], ["بالشيوخ", ["H2205"]], [".", []]]}, {"c": 4, "v": 17, "text": "كلت عيوننا من ترقب نصرة باطلة. في أبراجنا انتظرنا معونة أمة لا تخلص.", "groups": [{"kw": "our eyes", "raw": "Lam_1:19; 2Ki_24:7; Isa_20:5, Isa_30:1-7, Isa_31:1-3; Jer_2:18, Jer_2:36, Jer_8:20; Jer_37:7-10; Eze_29:6, Eze_29:7, Eze_29:16", "note": "", "refs": [{"l": "Lam 1:19", "n": "", "vs": [[19, "دعوت محبي فخدعوني. فني كهنتي وشيوخي في المدينة وهم ينشدون قوتا لإحيا ء نفوسهم."]]}, {"l": "2Ki 24:7", "n": "", "vs": [[7, "ولم يعد ملك مصر يخرج من دياره، لأن ملك بابل استولى على كل الأراضي الواقعة من حدود مصر الشمالية إلى نهر الفرات، والتي كانت مصر تحتلها."]]}, {"l": "Isa 20:5", "n": "", "vs": [[5, "عندئذ يفزع الفلسطينيون الذين اعتمدوا على كوش رجائهم ومصر فخرهم."]]}, {"l": "Isa 30:1-7", "n": "", "vs": [[1, "يقول الرب: «ويل للبنين المتمردين الذين ينصاعون لمشورة لم تصدر عني، ويبرمون عهدا ليس من روحي، ليضيفوا خطيئة إلى خطيئة."], [2, "الذين يتأهبون للانحدار إلى مصر من غير أن يلجأوا إلى مشورتي، ليلوذوا بحمى فرعون ويعتصموا بظل مصر،"], [3, "لذلك يصير لكم حصن فرعون عارا، والاحتماء بظل مصر خزيا،"], [4, "ومع أن سلطانه امتد إلى صوعن وحانيس حتى أقام فيها لنفسه ولاة وممثلين"], [5, "فإنهم يلحقون بكم العار ويجلبون عليكم الخزي لأنهم شعب لا جدوى منه»."], [6, "نبؤة بشأن وحوش النقب: عبر أرض العناء والأهوال حيث تعيش الأسود والأفاعي، تحمل قوافلهم أموالهم على ظهور حميرهم، وكنوزهم على أسنمة جمالهم إلى مصر التي لا رجاء فيها."], [7, "لأن عون مصر باطل لا طائل منه، لذلك دعوتها «التنين العاصي»"]]}, {"l": "Isa 31:1-3", "n": "", "vs": [[1, "ويل للمنحدرين إلى مصر طلبا للعون، المتوكلين على الخيل، الواثقين بكثرة المركبات وببأس الفرسان، من غير أن يلتفتوا إلى قدوس إسرائيل، أو يطلبوا مشورة الرب."], [2, "ومع ذلك فهو حكيم يجلب الشر، ولا ينقض كلامه بل سيهب ليعاقب بيت الأشرار وناصري فعلة الإثم."], [3, "ليس المصريون آلهة بل بشرا، وخيولهم مجرد أجساد وليست أرواحا، وعندما يمد الرب يده، يتعثر المعين ويسقط المستعين، ويهلكان كلاهما معا."]]}, {"l": "Jer 2:18", "n": "", "vs": [[18, "والآن ما بالك تتوجهين صوب مصر لشرب مياه شيحور؟ وما بالك تقصدين إلى أشور لشرب مياه الفرات؟"]]}, {"l": "Jer 2:36", "n": "", "vs": [[36, "لماذا تتهافتون على تغيير اتجاهكم؟ ستلحق بكم مصر الخزي كما ألحقه بكم الأشوريون."]]}, {"l": "Jer 8:20", "n": "", "vs": [[20, "قد انقضى موسم الحصاد، وانتهى الصيف، ونحن لم نخلص»."]]}, {"l": "Jer 37:7-10", "n": "", "vs": [[7, "«هذا ما يعلنه الرب إله إسرائيل: هذا ما تبلغونه لملك يهوذا الذي بعثكم إلي لتستشيروني: إن جيش فرعون الزاحف لإغاثتكم على وشك العودة إلى أرضه، مصر."], [8, "فيعود الكلدانيون ويحاربون هذه المدينة ويستولون عليها ويحرقونها بالنار."], [9, "لذلك يقول الرب لا تخدعوا أنفسكم قائلين: سينسحب عنا الكلدانيون، فإنهم لا ينسحبون."], [10, "وحتى لو قضيتم على محاربيكم من جيش الكلدانيين بأسره، ولم يبق منهم سوى الجرحى القابعين في خيامهم، فإنهم سيهبون ويحرقون هذه المدينة بالنار»."]]}, {"l": "Eze 29:6", "n": "", "vs": [[6, "فيدرك كل أهل مصر أني أنا الرب، لأنهم كانوا عكاز قصب هشة لشعب إسرائيل،"]]}, {"l": "Eze 29:7", "n": "", "vs": [[7, "ما إن اعتمدوا عليك بأكفهم حتى انكسرت ومزقت أكتافهم، وعندما توكأوا عليك تحطمت وقصفت كل متونهم."]]}, {"l": "Eze 29:16", "n": "", "vs": [[16, "فلا تكون بعد محط اعتماد لشعب إسرائيل، بل تذكرهم بإثمهم حين ضلوا وراءهم، فيدركون أني أنا السيد الرب»."]]}], "kwAr": "كلت عيوننا", "noteAr": ""}, {"kw": "for a", "raw": "For the Egyptians, who were their pretended allies; but who were neither able nor willing to help them.", "note": "For the Egyptians, who were their pretended allies; but who were neither able nor willing to help them.", "refs": [], "kwAr": "أمة لا تخلص", "noteAr": "أي المصريين، حلفاؤهم المزعومون، الذين لم يكونوا قادرين ولا راغبين في معونتهم."}], "arS": [["كلت", ["H3615"]], [" ", []], ["عيوننا", ["H5869"]], [" من ", []], ["ترقب", ["H6836"]], [" نصرة ", []], ["باطلة", ["H1892"]], [". ", []], ["في", ["H413"]], [" أبراجنا ", []], ["انتظرنا", ["H6822"]], [" ", []], ["معونة", ["H5833"]], [" ", []], ["أمة", ["H1471"]], [" ", []], ["لا", ["H3808"]], [" ", []], ["تخلص", ["H3467"]], [".", []]]}, {"c": 4, "v": 18, "text": "تصيد الرجال خطواتنا حتى لا نخطو في شوارعنا. آذنت نهايتنا، وتمت أيامنا وأزفت خاتمتنا.", "groups": [{"kw": "hunt", "raw": "Lam_3:52; 1Sa_24:14; 2Ki_25:4, 2Ki_25:5; Job_10:16; Psa_140:11; Jer_16:16; Jer_39:4, Jer_39:5, Jer_52:7-9", "note": "", "refs": [{"l": "Lam 3:52", "n": "", "vs": [[52, "قد اصطادني، كعصفور، أعدائي الذين لم أسيء إليهم،"]]}, {"l": "1Sa 24:14", "n": "", "vs": [[14, "ثم وراء من يسعى ملك إسرائيل؟ من هو الذي تطارده؟ أتسعى وراء كلب ميت؟ وراء برغوث واحد؟"]]}, {"l": "2Ki 25:4", "n": "", "vs": [[4, "وفي تلك الليلة فتح صدقيا ورجاله ثغرة في سور المدينة، وتسلل مع رجاله المحاربين من خلال البوابة القائمة بين السورين نحو حديقة الملك. وكان الكلدانيون محيطين بالمدينة. فتوجه صدقيا ومقاتلوه إلى طريق الصحراء."]]}, {"l": "2Ki 25:5", "n": "", "vs": [[5, "فتعقبت جيوش الكلدانيين الملك، وأدركته في صحراء أريحا، بعد أن تفرقت قواته عنه."]]}, {"l": "Job 10:16", "n": "", "vs": [[16, "وإن شمخت برأسي تقتنصني كالأسد، ثم تعود فتصول علي."]]}, {"l": "Psa 140:11", "n": "", "vs": [[11, "لا تدع ذا اللسان السليط يثبت في الأرض: فالشر يتصيد رجل الظلم ليهلكه."]]}, {"l": "Jer 16:16", "n": "", "vs": [[16, "ها أنا أرسل صيادين كثيرين، ليصطادوهم، ثم أبعث بقناصين كثيرين ليقتنصوهم من كل جبل ومن كل رابية ومن شقوق الصخور."]]}, {"l": "Jer 39:4", "n": "", "vs": [[4, "وعندما شاهدهم صدقيا ملك يهوذا وكل المحاربين فروا هاربين من المدينة ليلا عن طريق جنة الملك، من الباب القائم بين السورين، واتجهوا نحو العربة."]]}, {"l": "Jer 39:5", "n": "", "vs": [[5, "فتعقبهم جيش الكلدانيين، فأدركوا صدقيا في سهل أريحا، فقبضوا عليه وقادوه إلى نبوخذناصر ملك بابل في ربلة في أرض حماة، فأصدر عليه حكمه."]]}, {"l": "Jer 52:7-9", "n": "", "vs": [[7, "ففتح الشعب ثغرة في المدينة وهرب جميع المحاربين وغادروا المدينة ليلا من طريق البوابة الواقعة بين السورين القريبين من بستان الملك، والكلدانيون ما برحوا محاصرين المدينة من كل جهة، وانطلقوا في طريق البرية."], [8, "لكن جيش الكلدانيين تعقب الملك، وأدرك صدقيا في سهول أريحا وقد تفرق عنه جميع جيشه،"], [9, "فقبضوا عليه وأخذوه إلى ملك بابل في ربلة، في منطقة حماة، فأصدر عليه قضاءه."]]}], "kwAr": "تصيد الرجال خطواتنا", "noteAr": ""}, {"kw": "our end is near", "raw": "Jer_1:12, Jer_51:33; Eze_7:2-12, Eze_12:22, Eze_12:23, Eze_12:27; Amo_8:2", "note": "", "refs": [{"l": "Jer 1:12", "n": "", "vs": [[12, "فقال لي الرب: «قد أحسنت الرؤية، لأني ساهر على كلمتي لأتممها»."]]}, {"l": "Jer 51:33", "n": "", "vs": [[33, "لأن هذا ما يعلنه الرب القدير إله إسرائيل: إن أهل بابل كالبيدر، وقد حان أوان درس حنطته. وبعد قليل يأزف موعد حصادهم."]]}, {"l": "Eze 7:2-12", "n": "", "vs": [[2, "«ياابن آدم، هذا ما يعلنه الرب لأرض إسرائيل. النهاية قد أزفت على زوايا الأرض الأربع."], [3, "قد أقبلت النهاية عليك، فأطلق غضبي عليك وأدينك بمقتضى طرقك، وأجازيك على كل رجاساتك ياأرض إسرائيل،"], [4, "فلا تتر أف عليك عيني، ولا أعفو، بل أجازيك بمقتضى طرقك، وتكون رجاساتك في وسطك. عندئذ تدركون أني أنا الرب»."], [5, "وهذا ما يعلنه السيد الرب: «هوذا شر قد أقبل، شر لا مثيل له."], [6, "قد أزفت النهاية قد أزفت النهاية. انتبهت لك، وها هي مقبلة."], [7, "قد حل بك القضاء ياساكن الأرض، وأزف الموعد، اقترب يوم الاضطراب لا يوم الهتاف في الجبال."], [8, "أنا موشك على صب غضبي عليك وأنفث غيظي فيك، وأدينك بمقتضى طرقك، وأجازيك على كل رجاساتك،"], [9, "فلا تترَأف عليك عيني ولا أعفو، بل أجازيك بمقتضى طرقك، وتكون رجاساتك في وسطك. وعندئذ تدركون أني أنا الضارب."], [10, "ها هو اليوم قد أقبل! قد أزف القضاء وأزهر الظلم وأفرخت الكبرياء"], [11, "انتصب الجور وصار عصا للشر، لذلك يفنى الظالمون وتفنى ثروتهم وضجيجهم ولا من ينوح عليهم."], [12, "قد حان الموعد واقترب اليوم، فلا يفرحن المشتري ولا يحزنن البائع، لأن الغضب منصب على جمهورهم بأسره."]]}, {"l": "Eze 12:22", "n": "", "vs": [[22, "«ياابن آدم، ما هذا المثل الشائع في أرض إسرائيل القائل: قد طالت الأيام وكذبت كل رؤيا؟."]]}, {"l": "Eze 12:23", "n": "", "vs": [[23, "لذلك قل لهم: هذا ما يعلنه السيد الرب: ها أنا قد أبطلت هذا المثل فلا يعودون يرددونه في إسرائيل، بل قل لهم: قد أزفت الأيام وحان تحقيق كلام كل رؤيا،"]]}, {"l": "Eze 12:27", "n": "", "vs": [[27, "«ياابن آدم، ها شعب إسرائيل يقولون: إن الرؤيا التي تراها لا تتم إلا بعد أيام كثيرة، ونبوءتك لا تتحقق إلا في أزمنة بعيدة"]]}, {"l": "Amo 8:2", "n": "", "vs": [[2, "وسألني: «ماذا ترى ياعاموس؟» فأجبت: «سلة مليئة بثمار الصيف الناضجة». فقال لي الرب: «لقد دنت نهاية شعبي إسرائيل ولن أعفو عنهم بعد."]]}], "kwAr": "آذنت نهايتنا", "noteAr": ""}], "arS": [["تصيد", ["H6679"]], [" الرجال ", []], ["خطواتنا", ["H6806"]], [" حتى لا ", []], ["نخطو", ["H4480", "H1980"]], [" في ", []], ["شوارعنا", ["H7339"]], [". ", []], ["آذنت", ["H7126"]], [" ", []], ["نهايتنا", ["H7093"]], ["، وتمت ", []], ["أيامنا", ["H3117"]], [" ", []], ["وأزفت", ["H935"]], [" ", []], ["خاتمتنا", ["H7093"]], [".", []]]}, {"c": 4, "v": 19, "text": "كان مطاردونا أسرع من نسور السماء، تعقبونا على الجبال، وتربصوا بنا في الصحراء.", "groups": [{"kw": "persecutors", "raw": "Deu_28:49; Isa_5:26-28, Isa_30:16, Isa_30:17; Jer_4:13; Hos_8:1; Hab_1:8; Mat_24:27, Mat_24:28", "note": "", "refs": [{"l": "Deu 28:49", "n": "", "vs": [[49, "ويجلب الرب عليكم من بعيد، من أقصى الأرض، أمة لا تفهمون لغتها، فتنقض عليكم كالنسر."]]}, {"l": "Isa 5:26-28", "n": "", "vs": [[26, "فيرفع راية لأمم بعيدة، ويصفر لمن في أطراف الأرض، فيقبلون مسرعين (إلى أورشليم)،"], [27, "دون أن يكلوا أو يتعثروا أو يعتريهم نعاس أو نوم، أو يحل أحد منهم حزاما عن حقويه، ولا ينقطع لأحد سيور حذاء."], [28, "سهامهم مسننة، وقسيهم مشدودة. حوافر خيلهم كأنها صوان. عجلات مركباتهم مندفعة كالإعصار."]]}, {"l": "Isa 30:16", "n": "", "vs": [[16, "وقلتم: لا بل نهرب على الخيل، أنتم حقا تهربون. وقلتم: سنركب على متون جياد سريعة، لهذا فإن مطارديكم يسرعون في تعقبكم."]]}, {"l": "Isa 30:17", "n": "", "vs": [[17, "يهرب ألف منكم أمام زجرة واحد، ويتشتتون جميعا أمام زجرة خمسة، حتى تتركوا كسارية على رأس جبل أو كراية على قمة تل»."]]}, {"l": "Jer 4:13", "n": "", "vs": [[13, "انظروا، ها هو مقبل كسحاب، ومركباته كزوبعة، وجياده أسرع من النسور. ويل لنا لأننا قد هلكنا."]]}, {"l": "Hos 8:1", "n": "", "vs": [[1, "ضع البوق بين شفتيك لتنفخ فيه، لأن نسرا ينقض على بيت الرب، فإن الشعب قد نقضوا عهدي وتعدوا على شريعتي."]]}, {"l": "Hab 1:8", "n": "", "vs": [[8, "خيولها أسرع من النمور، وأكثر ضراوة من ذئاب المساء. فرسانها يندفعون بكبرياء قادمين من أماكن بعيدة، متسابقين كالنسر المسرع للانقضاض على فريسته."]]}, {"l": "Mat 24:27", "n": "", "vs": [[27, "فكما أن البرق يومض من الشرق فيضيء في الغرب، هكذا يكون رجوع ابن الإنسان."]]}, {"l": "Mat 24:28", "n": "", "vs": [[28, "فحيث توجد الجيفة، تتجمع النسور!"]]}], "kwAr": "مطاردونا", "noteAr": ""}, {"kw": "the eagles", "raw": "The eagle, whose wings are of an extraordinary length, darts with amazing rapidity through the voids of heaven.", "note": "The eagle, whose wings are of an extraordinary length, darts with amazing rapidity through the voids of heaven.", "refs": [], "kwAr": "نسور السماء", "noteAr": "النسر، وأجنحته بالغة الطول، يندفع بسرعة مذهلة عبر فضاءات السماء."}, {"kw": "they pursued", "raw": "Amo_2:14, Amo_9:1-3", "note": "", "refs": [{"l": "Amo 2:14", "n": "", "vs": [[14, "فلا يتاح الهرب للسريع، وتتلاشى قوة الجبار، ويعجز القوي عن إنقاذ نفسه."]]}, {"l": "Amo 9:1-3", "n": "", "vs": [[1, "ورأيت السيد واقفا إلى جوار المذبح قائلا: «اضرب تيجان الأعمدة حتى تهتز العتبات، وحطمها على رؤوس جميع الشعب. ومن ينجو منهم أهلكه بالسيف، فلا يهرب منهم أحد ولا يفلت منهم ناج."], [2, "وإن نقبوا لأنفسهم ملجأ في أعماق الهاوية، فإن يدي تطولهم هناك، وإن ارتقوا إلى السماوات فمن هناك أنزلهم."], [3, "وإن اختبأوا في أعالي الكرمل فهناك أبحث عنهم وأعتقلهم. وإن تواروا عني في أعماق البحر فإني آمر هناك الحية فتلدغهم."]]}], "kwAr": "تعقبونا", "noteAr": ""}], "arS": [["كان", ["H1961"]], [" ", []], ["مطاردونا", ["H7291"]], [" ", []], ["أسرع", ["H7031"]], [" ", []], ["من", ["H4480"]], [" ", []], ["نسور", ["H5404"]], [" ", []], ["السماء", ["H8064"]], ["، ", []], ["تعقبونا", ["H1814"]], [" ", []], ["على", ["H5921"]], [" ", []], ["الجبال", ["H2022"]], ["، ", []], ["وتربصوا", ["H693"]], [" بنا في ", []], ["الصحراء", ["H4057"]], [".", []]]}, {"c": 4, "v": 20, "text": "وقع في حفرهم مصدر حياتنا، الملك الذي اختاره الرب، الذي قلنا: في ظله نعيش بين الأمم.", "groups": [{"kw": "breath", "raw": "Lam_2:9; Gen_2:7, Gen_44:30; 2Sa_18:3", "note": "", "refs": [{"l": "Lam 2:9", "n": "", "vs": [[9, "غاصت في الأرض بواباتها، دمر وحطم مزاليجها. نفى ملكها ورؤساءها بين الأمم. زالت الشريعة، ولم يعد أنبياؤها يحصلون على رؤيا من عند الرب."]]}, {"l": "Gen 2:7", "n": "", "vs": [[7, "ثم جبل الرب الإله آدم من تراب الأرض ونفخ في أنفه نسمة حياة، فصار آدم نفسا حية."]]}, {"l": "Gen 44:30", "n": "", "vs": [[30, "فإذا عدت إلى عبدك أبي الذي تعلقت نفسه بنفس الغلام، ولم يكن الغلام معنا،"]]}, {"l": "2Sa 18:3", "n": "", "vs": [[3, "لكن الشعب قال: «لا تخرج معنا، لأننا إذا انهزمنا فإنهم لا يبالون بنا. وإذا مات نصفنا فلا يكترثون بنا أيضا. أما أنت فإنك تعادل عشرة آلاف منا، ومن الأفضل أن تمكث في المدينة وتسعفنا بنجدة إن دعا الأمر»."]]}], "kwAr": "مصدر حياتنا", "noteAr": ""}, {"kw": "the anointed", "raw": "1Sa_12:3, 1Sa_12:5, 1Sa_16:6, 1Sa_24:6, 1Sa_24:10, 1Sa_26:9, 1Sa_26:16; 2Sa_1:14, 2Sa_1:21, 2Sa_19:21; Psa_89:20,Psa_89:21", "note": "", "refs": [{"l": "1Sa 12:3", "n": "", "vs": [[3, "فاشهدوا علي في حضرة الرب، وأمام ملكه المختار، إن كنت قد أخذت ثورا أو حمارا من أحد، أو ظلمت أو جرت على أحد أو قبلت رشوة من أحد لأغمض عيني عنه، فأعوض ذلك عليكم»."]]}, {"l": "1Sa 12:5", "n": "", "vs": [[5, "فقال لهم: «ليكن الرب وملكه المختار شاهدين في هذا اليوم على براءتي الكاملة». فقالوا: «يشهد الرب»."]]}, {"l": "1Sa 16:6", "n": "", "vs": [[6, "وعندما أقبلوا وشاهد صموئيل أليآب بن يسى قال: «إن هذا هو مختار الرب»."]]}, {"l": "1Sa 24:6", "n": "", "vs": [[6, "فقال لرجاله: «معاذ الله أن أقترف هذا الإثم بحق سيدي المختار من الرب فأمد يدي وأسيء إليه لأن الرب قد مسحه ملكا»."]]}, {"l": "1Sa 24:10", "n": "", "vs": [[10, "ها أنت قد رأيت اليوم بعينيك كيف أوقعك الرب في قبضتي عندما كنت في الكهف، وجاء من يحرضني على قتلك، ولكني أشفقت عليك وقلت: لا! لن أمد يدي بالإساءة إلى سيدي، لأن الرب هو الذي اختاره."]]}, {"l": "1Sa 26:9", "n": "", "vs": [[9, "فأجاب داود: «لا تقض عليه، إذ من يمد يده ليسيء لمسيح الرب ويتبرأ؟"]]}, {"l": "1Sa 26:16", "n": "", "vs": [[16, "إن ما عملته لا يستحق الثناء، فحي هو الرب إنكم أبناء الموت، لأنكم لم تحرسوا سيدكم مسيح الرب، فانظر حولك الآن، أين هو رمح الملك وكوز الماء اللذان كانا عند رأسه؟»."]]}, {"l": "2Sa 1:14", "n": "", "vs": [[14, "فقال داود: «كيف جرؤت أن تمد يدك لتقتل الملك مختار الرب؟»"]]}, {"l": "2Sa 1:21", "n": "", "vs": [[21, "ياجبال جلبوع، لا يكن عليكن طل ولا مطر، ولا حقول تغل محاصيل تقدمات، لأن هناك تهاوى ترس الأبطال. ترس شاول لم يعد يلمع بالزيت."]]}, {"l": "2Sa 19:21", "n": "", "vs": [[21, "فقال أبيشاي بن صروية: «ألا ينبغي أن يقتل شمعي لأجل هذا؟ لقد شتم مختار الرب»."]]}, {"l": "Psa 89:20", "n": "", "vs": [[20, "وجدت داود عبدي فمسحته بزيتي المقدس."]]}, {"l": "Psa 89:21", "n": "", "vs": [[21, "أثبته بيدي، وأشدده بقوتي."]]}], "kwAr": "الملك الذي اختاره الرب", "noteAr": ""}, {"kw": "was taken", "raw": "Jer_39:5, Jer_52:8; Eze_12:13, Eze_17:18, Eze_19:4-8", "note": "", "refs": [{"l": "Jer 39:5", "n": "", "vs": [[5, "فتعقبهم جيش الكلدانيين، فأدركوا صدقيا في سهل أريحا، فقبضوا عليه وقادوه إلى نبوخذناصر ملك بابل في ربلة في أرض حماة، فأصدر عليه حكمه."]]}, {"l": "Jer 52:8", "n": "", "vs": [[8, "لكن جيش الكلدانيين تعقب الملك، وأدرك صدقيا في سهول أريحا وقد تفرق عنه جميع جيشه،"]]}, {"l": "Eze 12:13", "n": "", "vs": [[13, "وأبسط شبكتي عليه فيقع في شركي، وأحضره إلى بابل إلى أرض الكلدانيين، ولكن لن يراها، هناك يموت."]]}, {"l": "Eze 17:18", "n": "", "vs": [[18, "لقد ازدرى الحلف حين نكث العهد، وها هو قد مد يد الولاء إلى مصر. ولكنه وإن فعل هذا كله لن يفلت."]]}, {"l": "Eze 19:4-8", "n": "", "vs": [[4, "وعندما بلغ أمره الأمم وقع في حفرتهم، فأخذوه مسوقا بخزائمه إلى ديار مصر."], [5, "وعندما أدركت في أثناء انتظارها أن رجاءها قد هلك، أخذت جروا آخر وجعلته شبلا."], [6, "فتمشى بين الأسود وصار شبلا وتعلم الصيد، وأكل الناس،"], [7, "وهدم قصور هم وخرب مدنهم، فارتعبت الأرض ومن فيها من زمجرة زئيره،"], [8, "فاجتمعت عليه الأمم من كل صوب، وألقوا عليه شبكتهم فوقع في حفرتهم،"]]}], "kwAr": "وقع في حفرهم", "noteAr": ""}], "arS": [["وقع", ["H3920"]], [" في ", []], ["حفرهم", ["H7825"]], [" مصدر ", []], ["حياتنا", ["H7307", "H639"]], ["، الملك ", []], ["الذي", ["H834"]], [" ", []], ["اختاره", ["H4899"]], [" ", []], ["الرب", ["H3068"]], ["، الذي ", []], ["قلنا", ["H559"]], [": في ", []], ["ظله", ["H6738"]], [" ", []], ["نعيش", ["H2421"]], [" بين ", []], ["الأمم", ["H1471"]], [".", []]]}, {"c": 4, "v": 21, "text": "ابتهجي وافرحي ياابنة أدوم، ياساكنة عوص. إنما هذه الكأس ستجوز عليك أيضا فتسكرين وتتعرين.", "groups": [{"kw": "be glad", "raw": "Psa_83:3-12, Psa_137:7; Ecc_11:9; Eze_25:6, Eze_25:8, Eze_26:2, Eze_35:11-15; Oba_1:10-16", "note": "", "refs": [{"l": "Psa 83:3-12", "n": "", "vs": [[3, "يتآمرون بالمكر على شعبك، ويكيدون للإيقاع بمن تحميهم."], [4, "يقولون: «هلم نستأصلهم من بين الأمم، فلا يذكر اسم إسرائيل فيما بعد»."], [5, "فإنهم قد تآمروا معا بقلب واحد، وعقدوا حلفا ضدك."], [6, "عشائر أدوم وبنو إسماعيل، نسل موآب وبنو هاجر."], [7, "جبال وعمون وعماليق، الفلسطينيون وأهل صور،"], [8, "وقوم أشور أيضا انضموا إليهم، صاروا عونا لبني لوط."], [9, "افعل بهم كما فعلت بمديان وسيسرا ويابين في نهر قيشون."], [10, "بادوا في عين دور، وصاروا زبلا للأرض."], [11, "اجعل مصير أشرافهم كمصير غراب وذئب، وجميع أمرائهم مثل زبح وصلمناع، الذين قالوا: لنستول على مساكن الله."], [12, ""]]}, {"l": "Psa 137:7", "n": "", "vs": [[7, "اذكر يارب لبني أدوم ما فعلوه يوم خراب أورشليم، إذ قالوا: «اهدموا اهدموا حتى يتعرى أساسها»."]]}, {"l": "Ecc 11:9", "n": "", "vs": [[9, "افرح أيها الشاب في حداثتك، وليمتعك قلبك في أيام شبابك، واتبع أهواء قلبك، وكل ما تشهده عيناك. ولكن اعلم أنه بسبب هذه الأمور كلها يأتي الله بك إلى كرسي القضاء."]]}, {"l": "Eze 25:6", "n": "", "vs": [[6, "لأنك صفقت بكفيك طربا، وخبطت برجليك، وفرحت بكل ما فيك من لؤم لما حل بأرض إسرائيل."]]}, {"l": "Eze 25:8", "n": "", "vs": [[8, "وهذا ما يعلنه السيد الرب: لأن الموآبيين وأهل سعير يقولون: هل شعب يهوذا كبقية الأمم."]]}, {"l": "Eze 26:2", "n": "", "vs": [[2, "«ياابن آدم، لأن صور قد شمتت بأورشليم، وقالت: ها بوابة الشعوب قد انهارت، وتحولت القوافل إلي. ها أنا أزدهر إذ حل بها الدمار."]]}, {"l": "Eze 35:11-15", "n": "", "vs": [[11, "لذلك حي أنا يقول السيد الرب: لأعاملنك بمقتضى غضبك وحسدك اللذين أبديتهما في بغضائك لهم، فأعلن ذاتي عندما أدينك."], [12, "فتدرك أني أنا الرب قد سمعت كل إهانتك التي عيرت بها جبال إسرائيل قائلا: قد أصبحت خرابا وصارت لنا مغنما."], [13, "قد تباهيتم علي بأفواهكم، وأكثرتم من لغوكم علي وأنا سمعت."], [14, "ففي موسم الربيع أجعلك مقفرا"], [15, "وكما فرحت لخراب ميراث شعب إسرائيل، كذلك أفعل بك، فتصير ياجبل سعير خرابا أنت وكل بلاد أدوم فتدركون أني أنا الرب»."]]}, {"l": "Oba 1:10-16", "n": "", "vs": [[10, "فمن أجل ما أنزلت بأخيك يعقوب من ظلم، يغشاك العار وتنقرض إلى الأبد."], [11, "ففي ذلك اليوم الذي وقفت فيه بعيدا، يوم غنم الغرباء كنوزه، واقتحم الأجانب أبوابه وألقوا القرعة على أورشليم، كنت أنت أيضا كواحد منهم."], [12, "ما كان يجب أن تشمت بيوم مصير أخيك، في يوم فاجعته، وما كان يجب أن تبتهج في يوم دمار شعب يهوذا أو تتباهى في يوم الضيق."], [13, "وما كان يجب أن تقتحم أبواب شعبي في يوم كارثته، أو تشمت لمصيبته في يوم نكبته، أو تنهب ثروته في يوم بليته،"], [14, "أو تقف عند مفترق الطرق لتقضي على الناجين من قومه وتسلم الباقين الأحياء منهم في يوم الضيق."], [15, "لأن يوم الرب قريب آت على كل الأمم، وكما فعلت، لابد أن يفعل بك أيضا، فيرتد عملك على رأسك."], [16, "فإنه كما شربت على جبل قدسي فإن جميع الأمم تشرب في كل حين. يشربون ويجرعون ويتلاشون كمن لم يكونوا."]]}], "kwAr": "وافرحي", "noteAr": ""}, {"kw": "the land", "raw": "Gen_36:28; Job_1:1", "note": "", "refs": [{"l": "Gen 36:28", "n": "", "vs": [[28, "أما ابنا ديشان فهما: عوص وأران."]]}, {"l": "Job 1:1", "n": "", "vs": [[1, "عاش في أرض عوص رجل اسمه أيوب، كان صالحا كاملا يتقي الله ويحيد عن الشر."]]}], "kwAr": "ياساكنة عوص", "noteAr": ""}, {"kw": "the cup", "raw": "Isa. 34:1-17, Isa_63:1-6; Jer_25:15-29, Jer_49:12; Eze_25:12-14, Eze_35:3-9; Amo_1:11; Oba_1:1, Oba_1:10-14; Mal_1:2-4", "note": "", "refs": [{"l": "Isa 34:1-17", "n": "", "vs": [[1, "اقتربوا أيها الأمم للاستماع، اصغوا أيها الشعوب. لتسمع الأرض وملؤها، المسكونة وكل ما يخرج منها،"], [2, "لأن الرب ساخط على كل الشعوب، وغضبه منصب على جميع أجنادهم. قضى عليهم بالفناء، وأسلمهم إلى الذبح،"], [3, "فتطرح قتلاهم وينتشر نتن جيفهم في الفضاء، وتفيض الجبال بدمائهم،"], [4, "وتنحل كل كواكب السماء، وتطوى السماوات كدرج، وتتساقط كل نجومها كتساقط أوراق الكرمة أو حبات التين المتغضنة."], [5, "لأن سيفي قد تشرب بالسخط في السماء، وها هو ينزل ليعاقب أدوم، وينتقم من الشعب الذي قضيت عليه بالفناء."], [6, "للرب سيف مشبع بالدم، مطلي بالشحم، بدم حملان وتيوس، وبشحم كلى كباش، لأن للرب ذبيحة في بصرة، ومذبحة في أدوم."], [7, "ويسقط معهم البقر الوحشي، والعجول والثيران القوية، فتتشبع أرضهم بالدماء، ويخصب ترابهم بالشحم،"], [8, "لأن للرب يوم انتقام، سنة ثأر لدعوى صهيون،"], [9, "فتنقلب أنهار أدوم إلى زفت، وترابهم إلى كبريت، وتصبح أرضها قارا مشتعلا."], [10, "فلا تنطفيء ليلا ونهارا، ويحلق دخانها إلى الفضاء مدى الدهر، وتظل خرابا جيلا بعد جيل، فلا يعبر بها أحد إلى الأبد،"], [11, "ولا يرثها سوى الصقور والقنافذ، ويسكن فيها البوم والغراب، ويمد الرب عليها خيط الدمار ومطمار الهلاك،"], [12, "ولا يجد فيها أشرافها أثرا للملك، وينقرض جميع رؤسائها."], [13, "ينمو الشوك في قصورها، ويزحف العوسج على حصونها، فتصبح مأوى لبنات آوى، ومسكنا للنعام."], [14, "وتجتمع فيها الوحوش البرية مع الذئاب، ووعل البر يدعو صاحبه، وهناك تستقر وحوش الليل وتجد لنفسها ملاذ راحة."], [15, "هناك تعيش البوم وتبيض وتفرخ وترعى صغارها تحت أجنحتها، وهناك أيضا تتلاقى الصقور بعضها ببعض."], [16, "ابحثوا في سفر الرب واقرأوا: فكلمة واحدة لا يمكن أن تسقط، إذ كل أليف سيجتمع بأليفه، لأن فم الرب قد أمر، وروحه يجمعها معا."], [17, "فهو قد ألقى عليها القرعة، ويده قد وزعتها بقسطاس، فترثها إلى الأبد وتقيم فيها جيلا بعد جيل."]]}, {"l": "Isa 63:1-6", "n": "", "vs": [[1, "من هذا المقبل من أدوم، بثياب حمراء من بصرة؛ هذا المتسربل بالبهاء. السائر بخيلاء قوته؟ إنه أنا الرب الناطق بالبر، العظيم للخلاص."], [2, "ما بال ردائك أحمر وثيابك كمن داس عنب المعصرة؟"], [3, "لقد دست المعصرة وحدي، ولم يكن معي أحد من الشعوب. قد دستهم في سخطي ووطئتهم في غيظي، فتناثر دمهم على ردائي ولطخت ثيابي."], [4, "لأن يوم الانتقام كان كامنا في قلبي، وسنة مفديي قد أتت."], [5, "تلفت فلم أعثر على معين، وعجبت إذ لم يكن من ناصر، فانتصرت بقوة ذراعي، وتأيدت بنجدة سخطي،"], [6, "فدست الشعوب في غيظي، وأسكرتهم في غضبي، وسكبت دماءهم فوق الأرض."]]}, {"l": "Jer 25:15-29", "n": "", "vs": [[15, "وهذا ما أعلنه لي الرب إله إسرائيل: «خذ كأس خمر غضبي من يدي، واسق منها جميع الأمم التي أرسلك إليها،"], [16, "فتشرب وتترنح، وتجن بفعل السيف الذي أرسله بينها»."], [17, "فتناولت الكأس من يد الرب وسقيت منها جميع الأمم التي بعثني إليها الرب:"], [18, "أورشليم ومدن يهوذا وملوكها وعظماءها، لأجعلها قفرا خرابا ومثار صفير ولعنة إلى هذا اليوم."], [19, "وسقيت منها كذلك فرعون ملك مصر وخدامه وعظماءه وكل شعبه،"], [20, "وكل الغرباء المقيمين في وسطهم، وجميع ملوك أرض عوص، وسائر ملوك الفلسطينيين: ملوك أشقلون، وغزة، وعقرون وبقية أشدود،"], [21, "وآدوم، وموآب، وبني عمون،"], [22, "وكل ملوك صور وصيدون وملوك الجزائر عبر البحر،"], [23, "وددان وتيماء وبوز، وكل ذوي الشعر المقصوص الزوايا،"], [24, "وكل ملوك العرب، وسائر ملوك القبائل المنضمة إليهم المقيمين في الصحراء،"], [25, "وكل ملوك زمري، وعيلام، وجميع ملوك مادي."], [26, "وكل ملوك الشمال، القريبين والبعيدين، الواحد تلو الآخر، وكل الممالك المنتشرة على وجه الأرض. ثم بعد ذلك يشرب منها ملك بابل."], [27, "ثم قل لهم، هذا ما يعلنه الرب القدير إله إسر ائيل: اشربوا واثملوا وتقيأوا واسقطوا صرعى، ولا تقوموا من جراء السيف الذي أرسله في وسطكم."], [28, "وإن أبوا أن يتناولوا الكأس من يدك ليشربوا منها، فقل لهم: هذا ما يعلنه الرب القدير: لابد لكم من شربها،"], [29, "لأني شرعت أعاقب المدينة التي دعي اسمي عليها، فهل تفلتون أنتم من العقاب؟ فها أنا قد سلطت السيف على جميع سكان الأرض، يقول الرب القدير."]]}, {"l": "Jer 49:12", "n": "", "vs": [[12, "لأن هذا ما يعلنه الرب: إن كان الذين لا يستحقون تجرع كأس العقاب قد تجرعوه، أتفلت أنت من العقاب؟ إنك لن تفلت من العقاب، بل عليك أن تجرعه حتما."]]}, {"l": "Eze 25:12-14", "n": "", "vs": [[12, "وهذا أيضا ما يعلنه السيد الرب: لأن الأدوميين أقدموا على الانتقام من شعب يهوذا، وأساءوا إليه أشد إساءة."], [13, "ها أنا أعاقب الأدوميين وأستأصل من أرضهم الإنسان والحيوان، وأحولها إلى أطلال دارسة من التيمن إلى ددان، إذ يقتل أهلها جميعا بالسيف."], [14, "وأعهد بنقمتي إلى شعبي إسرائيل، فيفعلون بالأدوميين بمقتضى غضبي وسخطي، فيدركون شدة نقمتي، يقول السيد الرب."]]}, {"l": "Eze 35:3-9", "n": "", "vs": [[3, "وقل لأهله: ها أنا أنقلب عليك ياجبل سعير وأعاقبك لأجعلك خرابا مقفرا."], [4, "أجعل مدنك أطلالا وتكون أنت مقفرا، فتدرك أني أنا الرب."], [5, "لأنك أضمرت في نفسك بغضة أبدية، وأسلمت بني إسرائيل إلى حد السيف في أثناء محنتهم، في ساعة دينونة إثمهم."], [6, "لذلك حي أنا يقول السيد الرب، إني أعدك لسفك الدم، والدم يتعقبك. لأنك لم تمقت سفك الدم فالدم يتعقبك."], [7, "فأحول جبل سعير إلى أطلال وأستأصل منه كل ذاهب وآيب."], [8, "وأجعل جباله تكتظ بقتلاه، فيتساقطون في تلالك وأوديتك وجميع أنهارك صرعى السيف."], [9, "وأحيلك إلى خرائب أبدية، فلا يبقى لمدنك أثر، فتدركون أني أنا الرب."]]}, {"l": "Amo 1:11", "n": "", "vs": [[11, "وهذا ما يقوله الرب: من أجل معاصي أدوم الثلاث والأربع لن أرد عنهم سخطي، لأنهم تعقبوا إخوتهم بالسيف، وتغاضوا عن كل رحمة، وجعلوا غضبهم يتأجج ملتهما باستمرار، وظلوا حاقدين على الدوام."]]}, {"l": "Oba 1:1", "n": "", "vs": [[1, "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."]]}, {"l": "Oba 1:10-14", "n": "", "vs": [[10, "فمن أجل ما أنزلت بأخيك يعقوب من ظلم، يغشاك العار وتنقرض إلى الأبد."], [11, "ففي ذلك اليوم الذي وقفت فيه بعيدا، يوم غنم الغرباء كنوزه، واقتحم الأجانب أبوابه وألقوا القرعة على أورشليم، كنت أنت أيضا كواحد منهم."], [12, "ما كان يجب أن تشمت بيوم مصير أخيك، في يوم فاجعته، وما كان يجب أن تبتهج في يوم دمار شعب يهوذا أو تتباهى في يوم الضيق."], [13, "وما كان يجب أن تقتحم أبواب شعبي في يوم كارثته، أو تشمت لمصيبته في يوم نكبته، أو تنهب ثروته في يوم بليته،"], [14, "أو تقف عند مفترق الطرق لتقضي على الناجين من قومه وتسلم الباقين الأحياء منهم في يوم الضيق."]]}, {"l": "Mal 1:2-4", "n": "", "vs": [[2, "«يقول الرب: إنني أحببتكم، ولكنكم تسألون: كيف أحببتنا؟ ويجيب الرب: أليس عيسو أخا ليعقوب؟ ومع ذلك أحببت يعقوب،"], [3, "وأبغضت عيسو، وحولت جباله إلى أراض موحشة، وجعلت ميراثه لبنات آوى البرية."], [4, "وإن قال الأدوميون: مع إننا تحطمنا فإننا نبني الخرب، فإن الرب القدير يقول: هم يعمرون وأنا أهدم، ويدعو الناس بلادهم، «أرض النفاق»، وأهلها بالأمة التي سخط الرب عليها إلى الأبد."]]}], "kwAr": "هذه الكأس", "noteAr": ""}, {"kw": "and shalt", "raw": "2Ch_28:19; Mic_1:11; Rev_16:15", "note": "", "refs": [{"l": "2Ch 28:19", "n": "", "vs": [[19, "لأن الرب أذل يهوذا بسبب شرور آحاز ملك يهوذا الذي أضل شعبه وخان الرب."]]}, {"l": "Mic 1:11", "n": "", "vs": [[11, "اخرجوا ياأهل شافير عرايا مجللين بالعار، وليمكث سكان صانان في منازلهم خجلا. وعندما تسمعون عويل أهل هأيصل تدركون أنها قد سقطت ولا ملجأ لكم فيها."]]}, {"l": "Rev 16:15", "n": "", "vs": [[15, "»ها أنا آت كما يأتي اللص، طوبى لمن يكون بانتظاري، ساهرا وحارسا لثيابه، لئلا يمشي عريانا فيرى الناس عورته!«"]]}], "kwAr": "وتتعرين", "noteAr": ""}], "arS": [["ابتهجي", ["H8055"]], [" وافرحي ", []], ["ياابنة", ["H1323"]], [" ", []], ["أدوم", ["H123"]], ["، ", []], ["ياساكنة", ["H3427"]], [" ", []], ["عوص", ["H5780"]], [". إنما هذه ", []], ["الكأس", ["H3563"]], [" ", []], ["ستجوز", ["H5674"]], [" ", []], ["عليك", [ "", "vs": [[7, "فاذكر ياالله أن حياتي ليست سوى نسمة، وأن عيني لن تعودا تريان الخير."]]}, {"l": "Job 10:9", "n": "", "vs": [[9, "اذكر أنك جبلتني من طين، أترجعني بعد إلى التراب؟"]]}, {"l": "Jer 15:15", "n": "", "vs": [[15, "يارب، أنت عرفت. اذكرني وارعني وانتقم لي من مضطهدي. لا تتمهل طويلا في الانتقام لي، فأنت تعلم أني من أجلك احتملت التعيير."]]}, {"l": "Hab 3:2", "n": "", "vs": [[2, "«يارب قد بلغني ما فعلت فخفت يارب، عملك في وسط السنين أحيه، وعرف به على مر الأيام، واذكر الرحمة في الغضب."]]}, {"l": "Luk 23:42", "n": "", "vs": [[42, "ثم قال: «يايسوع، اذكرني عندما تجيء في ملكوتك!»"]]}], "kwAr": "اذكر يارب", "noteAr": ""}, {"kw": "behold", "raw": "Lam_2:15, Lam_3:61; Neh_1:3, Neh_4:4; Psa_44:13-16, Psa_74:10,Psa_74:11, Psa_79:4, Psa_79:12, Psa_89:50,Psa_89:51; Psa_123:3, Psa_123:4", "note": "", "refs": [{"l": "Lam 2:15", "n": "", "vs": [[15, "كل عابري السبيل صفقوا عليك بالأيادي فرحا. صفروا وهزوا رؤوسهم على ابنة أورشليم وتساءلوا: أهذه هي المدينة التي تدعى كاملة الجمال وبهجة الأرض بأسرها؟"]]}, {"l": "Lam 3:61", "n": "", "vs": [[61, "سمعت تعييرهم يارب، وجميع مؤامراتهم علي."]]}, {"l": "Neh 1:3", "n": "", "vs": [[3, "فقالوا لي: «إن الناجين الذين بقوا من السبي، ممن رجعوا إلى هناك، يقاسون من شقاء عظيم وعار. فسور أورشليم منهدم وأبوابها محروقة بالنار»."]]}, {"l": "Neh 4:4", "n": "", "vs": [[4, "فصليت إلى الرب: «استمع ياإلهنا، لأننا قد أصبحنا مثار احتقار، واجعل تعييرهم يرتد على رؤوسهم وليصيروا غنيمة في أرض السبي."]]}, {"l": "Psa 44:13-16", "n": "", "vs": [[13, "تجعلنا عارا عند جيراننا، ومثار هزء وسخرية لمن حولنا."], [14, "تجعلنا مثلا بين الأمم وأضحوكة بين الشعوب."], [15, "اليوم كله خجلي ماثل أمامي، وخزي وجهي قد غمرني"], [16, "من صوت المعير والمجدف ومرأى العدو المنتقم."]]}, {"l": "Psa 74:10", "n": "", "vs": [[10, "ياالله : إلى متى يعيرنا الخصم؟ أيظل العدو يستهين باسمك إلى الأبد؟"]]}, {"l": "Psa 74:11", "n": "", "vs": [[11, "لماذا ترفض أن تمد يد العون؟ لماذا تبقي يمينك خلفك؟ أخرجها وأفنهم."]]}, {"l": "Psa 79:4", "n": "", "vs": [[4, "قد صرنا عارا عند جيراننا، ومثار هزء وأضحوكة لمن حولنا."]]}, {"l": "Psa 79:12", "n": "", "vs": [[12, "رد يارب على الأمم سبع مرات ما عيروك وأهانوك به،"]]}, {"l": "Psa 89:50", "n": "", "vs": [[50, "اذكر يارب عار عبيدك الذي تحملته في صدري من جميع الشعوب،"]]}, {"l": "Psa 89:51", "n": "", "vs": [[51, "العار الذي عيرنا به أعداؤك يارب، إذ عيروا خطوات الملك الذي مسحته."]]}, {"l": "Psa 123:3", "n": "", "vs": [[3, "ارحمنا يارب، ارحمنا، فقد شبعنا احتقارا."]]}, {"l": "Psa 123:4", "n": "", "vs": [[4, "شبعت نفوسنا كثيرا من هزء المطمئنين وازدراء المتكبرين."]]}], "kwAr": "انظر وعاين", "noteAr": ""}], "arS": [["اذكر", ["H2142"]], [" ", []], ["يارب", ["H3068"]], [" ", []], ["ما", ["H4100"]], [" ", []], ["أصابنا", ["H1961"]], [". ", []], ["انظر", ["H7200"]], [" ", []], ["وعاين", ["H5027"]], [" ", []], ["عارنا", ["H2781"]], [".", []]]}, {"c": 5, "v": 2, "text": "قد تحول ميراثنا إلى الغرباء وبيوتنا إلى الأجانب.", "groups": [{"kw": "", "raw": "Deut. 28:30-68; Psa_79:1, Psa_79:2; Isa_1:7, Isa_5:17, Isa_63:18; Jer_6:12; Eze_7:21, Eze_7:24; Zep_1:13", "note": "", "refs": [{"l": "Deu 28:30-68", "n": "", "vs": [[30, "يخطب أحدكم امرأة ولكن آخر يتزوجها ويضاجعها. تبني بيتا ولا تسكن فيه، وتغرس كرما ولا تجنيه."], [31, "يذبح ثورك أمام عينيك ولا تأكل منه، ويغتصب حمارك على مرأى منك ولا يرد إليك، ويستولي أعداؤك على ماشيتك وليس من منقذ."], [32, "يساق أولادك وبناتك إلى أمة أخرى وعيناك تراقبانهم طوال النهار، حتى تكلا، وما في يدك حيلة."], [33, "محصول أرضك وثمر تعبك يأكله شعب غريب عنك، ولا تكون سوى مظلوم مسحوق دائما."], [34, "ويصيبك الجنون من هول ما ترى."], [35, "ويبتليك الرب بقروح خبيثة تغطي الركبتين والساقين، حتى لا تجد لها شفاء من قمة الرأس إلى أخمص القدم."], [36, "ينفيكم الرب أنتم وملككم الذي تختارونه إلى أمة لا تعرفونها أنتم ولا آباؤكم، حيث تعبدون هناك آلهة أخرى من خشب وحجر،"], [37, "وتصبحون مثار دهشة وسخرية وعبرة في نظر جميع الشعوب التي ينفيكم الرب إليهم"], [38, "تبذرون كثيرا من البذار في الحقول، ولا تحصدون إلا القليل، لأن الجراد يلتهمه."], [39, "تكدحون في غرس كروم ومن خمرها لا تشربون، ومن ثمرها لا تجنون، لأن الدود ينخرها."], [40, "تكتظ أراضيكم بأشجار الزيتون، ولكن من زيتها لا تدهنون، لأن زيتونكم ينتثر على الأرض قبل نضجه."], [41, "تنجبون بنين وبنات ولا يكونون لكم، لأنهم يسبون."], [42, "تلتهم أسراب الجراد أشجاركم وغلات أرضكم."], [43, "يعظم شأن الغرباء المقيمين بينكم، ويتفاقم انحطاط شأنكم."], [44, "هم يقرضونكم وأنتم لا تقرضونهم، وهم يكونون رأسا وأنتم تكونون ذنبا،"], [45, "وتحل بكم هذه اللعنات وتلازمكم وتلاحقكم حتى تهلكوا، لأنكم لم تطيعوا صوت الرب إلهكم لتحفظوا وصاياه وفرائضه التي أمركم بها،"], [46, "فتكون فيكم وفي ذريتكم عبرة ونذيرا إلى الأبد."], [47, "ولأنكم لم تعبدوا الرب إلهكم بفرح وغبطة في زمن الازدهار والوفرة،"], [48, "فإنكم تصبحون عبيدا لأعدائكم الذين يرسلهم الرب عليكم في أحوال الجوع والعطش والعري والفاقة، ويضع نير حديد على أعناقكم حتى يهلككم."], [49, "ويجلب الرب عليكم من بعيد، من أقصى الأرض، أمة لا تفهمون لغتها، فتنقض عليكم كالنسر."], [50, "أمة يثير منظرها الرعب، لا تهاب الشيخ ولا ترأف بالطفل،"], [51, "فتستولي على نتاج بهائمكم، وتلتهم غلات أرضكم حتى تفنوا، ولا تبقي لكم قمحا ولا خمرا ولا زيتا ولا نتاج بقركم ونعاجكم حتى تهلككم."], [52, "وتحاصركم في جميع مدنكم حتى تتهدم أسواركم الشامخة الحصينة التي وثقتم بمناعتها في كل مدنكم. فتحاصركم في جميع مدنكم في كل أرضكم التي يهبها الرب إلهكم لكم."], [53, "فتأكلون في أثناء الحصار والضيقة التي يضايقكم بها عدوكم ثمار بطونكم، لحم أبنائكم وبناتكم الذين رزقكم بهم الرب إلهكم."], [54, "فيقسو قلب أكثركم رقة ورأفة على أخيه وامرأته التي في حضنه وسائر أبنائه الأحياء."], [55, "فلا يعطي أحدهم من لحم أبنائه، الذي يأكله، لأنه لم يبق لديه شيء سواه في الحصار والضيقة التي يضايقكم بها عدوكم في جميع مدنكم."], [56, "وكذلك فإن أكثر النساء رقة ورأفة، والتي لنعومتها وترفهها لا تجرؤ على لمس الأرض بباطن قدمها، تبخل على زوجها رجل حضنها وعلى ابنها وابنتها"], [57, "بمشيمتها الساقطة منها، وبأولادها الذين تلدهم، لأنها تنوي أن تأكلهم سرا في أثناء الحصار، في الضيقة التي يضايقكم بها عدوكم في كل مدنكم."], [58, "فإن لم تحرصوا على العمل بجميع كلمات هذه الشريعة المكتوبة في هذا الكتاب، لتهابوا اسم الرب إلهكم الجليل المرهوب،"], [59, "فإن الرب يجعل الضربات النازلة بكم وبذريتكم ضربات مخيفة وكوارث رهيبة دائمة وأمراضا خبيثة مزمنة،"], [60, "ويرسل عليكم كل أمراض مصر التي فزعتم منها فتلازمكم،"], [61, "ويسلط الرب عليكم أيضا كل داء وكل بلية لم ترد في كتاب الشريعة هذا، حتى تهلكوا."], [62, "فتصيرون قلة بعد أن كنتم في كثرة نجوم السماء، لأنكم لم تسمعوا صوت الرب إلهكم."], [63, "وكما سر الرب بكم فأحسن إليكم وكثركم، فإنه سيسر بأن يفنيكم ويهلككم فتنقرضون من الأرض التي أنتم ماضون إليها لامتلاكها."], [64, "ويشتتكم الرب بين جميع الأمم من أقصى الأرض إلى أقصاها، فتعبدون هناك آلهة أخرى من خشب أو حجر لم تعرفوها أنتم ولا آباؤكم،"], [65, "ولا تجدون بين تلك الأمم اطمئنانا ولا مقرا لقدم، بل يعطيكم الرب قلبا هلعا، وعيونا أوهنها الترقب، ونفوسا يائسة."], [66, "وتعيشون حياة مفعمة دائما بالتوتر، مليئة بالرعب ليلا ونهارا."], [67, "وتقولون في الصباح: يا ليته المساء، وفي المساء: يا ليته الصباح، من فرط ارتعاب قلوبكم وما تشهده عيونكم من هول."], [68, "ويردكم الرب إلى ديار مصر في سفن في طريق وعدكم ألا تعودوا ترونها، فتباعون هناك لأعدائكم عبيدا وإماء، وليس من يشتري»."]]}, {"l": "Psa 79:1", "n": "", "vs": [[1, "ياالله ، إن الأمم قد دخلت ميراثك ونجست هيكلك المقدس وجعلت أورشليم أكواما."]]}, {"l": "Psa 79:2", "n": "", "vs": [[2, "جعلوا جثث عبيدك مأكلا لطيور السماء، ولحوم قديسيك لوحوش الأرض."]]}, {"l": "Isa 1:7", "n": "", "vs": [[7, "عم الخراب بلادكم والتهمت النار مدنكم. نهب الغرباء حقولكم أمام أعينكم. هي خربة، عاث فيها الغرباء فسادا."]]}, {"l": "Isa 5:17", "n": "", "vs": [[17, "عندئذ ترعى الحملان في مراعيهم، والخرفان والماعز تأكل بين خربهم."]]}, {"l": "Isa 63:18", "n": "", "vs": [[18, "قد داس أعداؤنا هيكلك الذي امتلكه شعبك المقدس زمنا يسيرا،"]]}, {"l": "Jer 6:12", "n": "", "vs": [[12, "وتتحول بيوتهم وحقولهم لآخرين، وكذلك نساؤهم، لأني أبسط يدي ضد سكان الأرض»، يقول الرب"]]}, {"l": "Eze 7:21", "n": "", "vs": [[21, "أسلمها إلى أيدي الغرباء نهبا، ولأشرار الأرض سلبا فينجسونها."]]}, {"l": "Eze 7:24", "n": "", "vs": [[24, "لذلك، أجلب أشر الأمم فيرثون بيوتهم، وأقضي على كبرياء الأقوياء فتتنجس مقادسهم."]]}, {"l": "Zep 1:13", "n": "", "vs": [[13, "فتصبح ثروتهم غنيمة، وبيوتهم خرابا. يشيدون بيوتا ولا يسكنون فيها، ويغرسون كروما ولا يشربون من خمرها."]]}], "kwAr": "", "noteAr": ""}], "arS": [["قد ", []], ["تحول", ["H2015"]], [" ", []], ["ميراثنا", ["H5159"]], [" إلى ", []], ["الغرباء", ["H2114"]], [" ", []], ["وبيوتنا", ["H1004"]], [" إلى ", []], ["الأجانب", ["H5237"]], [".", []]]}, {"c": 5, "v": 3, "text": "أصبحنا أيتاما لا أب لنا، وأمهاتنا كالأرامل.", "groups": [{"kw": "", "raw": "Exo_22:24; Jer_18:21; Hos_14:3", "note": "", "refs": [{"l": "Exo 22:24", "n": "", "vs": [[24, "فيحتدم غضبي وأقتلكم بالسيف، فتصبح زوجاتكم أرامل وأولادكم يتامى."]]}, {"l": "Jer 18:21", "n": "", "vs": [[21, "لذلك أسلم بنيهم لأنياب الجوع، واعهد بهم إلى قبضة السيف فتصبح نساؤهم ثكالى وأرامل، وليمت رجالهم، وليلق شبانهم حتفهم في المعارك بحد السيف."]]}, {"l": "Hos 14:3", "n": "", "vs": [[3, "إن أشور لن تخلصنا، ولن نعتمد على خيول مصر لإنقاذنا، ولن نقول للأوثان صنعة أيدينا: «أنتم آلهتنا» لأن فيك وحدك يجد اليتيم رحمة»."]]}], "kwAr": "", "noteAr": ""}], "arS": [["أصبحنا ", []], ["أيتاما", ["H3490"]], [" ", []], ["لا", ["H369"]], [" ", []], ["أب", ["H1"]], [" لنا، ", []], ["وأمهاتنا", ["H517"]], [" ", []], ["كالأرامل", ["H490"]], [".", []]]}, {"c": 5, "v": 4, "text": "بالفضة شربنا ماءنا. وبثمن ابتعنا حطبنا.", "groups": [{"kw": "have", "raw": "Deu_28:48; Isa_3:1; Eze_4:9-17", "note": "", "refs": [{"l": "Deu 28:48", "n": "", "vs": [[48, "فإنكم تصبحون عبيدا لأعدائكم الذين يرسلهم الرب عليكم في أحوال الجوع والعطش والعري والفاقة، ويضع نير حديد على أعناقكم حتى يهلككم."]]}, {"l": "Isa 3:1", "n": "", "vs": [[1, "ها هو الرب القدير مزمع أن يقطع عن أورشليم ويهوذا الطعام والماء."]]}, {"l": "Eze 4:9-17", "n": "", "vs": [[9, "أما أنت فخذ لنفسك قمحا وشعيرا وفولا وعدسا ودخنا وكرسنة، واعجنها في وعاء واحد، واصنع لنفسك خبزا تأكل منه ثلاث مئة وتسعين يوما كعدد الأيام التي تتكيء فيها على جنبك."], [10, "ويكون وزن كمية الطعام التي تأكلها في كل يوم تعادل عشرين شاقلا (نحو مئتين وأربعين جراما). تأكل وجبة واحدة في اليوم."], [11, "وتشرب الماء بالكيل، فلا يزيد عن سدس الهين (نحو ثلثي لتر)، تشرب منه بين حين وآخر."], [12, "وتأكله ككعك الشعير، بعد أن تخبزه على مشهد منهم فوق براز الإنسان."], [13, "لأنه هكذا سيأكل أبناء إسرائيل خبزهم النجس بين الأمم الذين أجليهم إليهم»."], [14, "ولكني قلت: «آه، أيها السيد الرب، أنا لم أنجس نفسي أبدا فمنذ حداثتي حتى الآن لم آكل ميتة أو فريسة، ولم يدخل فمي لحم نجس»."], [15, "فقال: «انظر ها أنا أعطيك بعر البقر لتستعيض به عن براز الإنسان لتصنع عليه خبزك."], [16, "ياابن آدم، ها أنا أبيد مؤونة الخبز في أورشليم، فيأكلون الخبز بالوزن معجونا بالغم، ويشربون الماء بالكيل ممزوجا بالحيرة."], [17, "إذ يعوزهم الخبز والماء، ويلجأ الواحد إلى أخيه وقد اعترتهم الحيرة فيفنون جميعا بإثمهم."]]}], "kwAr": "شربنا", "noteAr": ""}, {"kw": "is sold", "raw": "Heb. cometh for price", "note": "Heb. cometh for price", "refs": [], "kwAr": "ابتعنا حطبنا", "noteAr": "بالعبرانية: يأتي بثمن."}], "arS": [["بالفضة", ["H3701"]], [" ", []], ["شربنا", ["H8354"]], [" ", []], ["ماءنا", ["H4325"]], [". وبثمن ", []], ["ابتعنا", ["H935", "H4242"]], [" ", []], ["حطبنا", ["H6086"]], [".", []]]}, {"c": 5, "v": 5, "text": "داس مضطهدونا أعناقنا، أعيينا ولم نجد راحة.", "groups": [{"kw": "Our necks are under persecution", "raw": "Heb. On our necks are we persecuted, Lam_1:14, Lam_4:19; Deu_28:48, Deu_28:65, Deu_28:66; Jer_27:2, Jer_27:8, Jer_27:11, Jer_27:12, Jer_28:14; Mat_11:29; Act_15:10", "note": "Heb. On our necks are we persecuted, Lam_1:14, Lam_4:19; Deu_28:48, Deu_28:65, Deu_28:66; Jer_27:2, Jer_27:8, Jer_27:11, Jer_27:12, Jer_28:14; Mat_11:29; Act_15:10", "refs": [{"l": "Lam 1:14", "n": "", "vs": [[14, "شد معاصي إلى نير، وبيده حبكها، فناء بها عنقي. أوهن الرب قواي وأسلمني إلى يد لا طاقة لي على مقاومتها."]]}, {"l": "Lam 4:19", "n": "", "vs": [[19, "كان مطاردونا أسرع من نسور السماء، تعقبونا على الجبال، وتربصوا بنا في الصحراء."]]}, {"l": "Deu 28:48", "n": "", "vs": [[48, "فإنكم تصبحون عبيدا لأعدائكم الذين يرسلهم الرب عليكم في أحوال الجوع والعطش والعري والفاقة، ويضع نير حديد على أعناقكم حتى يهلككم."]]}, {"l": "Deu 28:65", "n": "", "vs": [[65, "ولا تجدون بين تلك الأمم اطمئنانا ولا مقرا لقدم، بل يعطيكم الرب قلبا هلعا، وعيونا أوهنها الترقب، ونفوسا يائسة."]]}, {"l": "Deu 28:66", "n": "", "vs": [[66, "وتعيشون حياة مفعمة دائما بالتوتر، مليئة بالرعب ليلا ونهارا."]]}, {"l": "Jer 27:2", "n": "", "vs": [[2, "«هذا ما أعلنه الرب: اصنع لنفسك ربطا وأنيارا وضعها على عنقك،"]]}, {"l": "Jer 27:8", "n": "", "vs": [[8, "ولكن إن أبت أية أمة أو مملكة الاستعباد لنبوخذناصر ملك بابل، ورفضت أن تضع عنقها تحت نيره، فإني أعاقبها بالسيف والجوع والوباء إلى أن أبيدهم بيده، يقول الرب."]]}, {"l": "Jer 27:11", "n": "", "vs": [[11, "ولكن كل أمة تستسلم لملك بابل وتستعبد له أبقيها في أرضها، يقول الرب، فتحرثها وتقيم فيها»."]]}, {"l": "Jer 27:12", "n": "", "vs": [[12, "فبلغت صدقيا ملك يهوذا جميع هذا الكلام وقلت: «اخضعوا لملك بابل واخدموه وشعبه فتحيوا."]]}, {"l": "Jer 28:14", "n": "", "vs": [[14, "لأن هذا ما يعلنه الرب القدير إله إسرائيل: إني قد وضعت نيرا من حديد على أعناق جميع الأمم لتستعبد لنبوخذناصر ملك بابل، فيكونون له عبيدا وقد عهدت إليه أيضا بحيوان الحقل»."]]}, {"l": "Mat 11:29", "n": "", "vs": [[29, "احملوا نيري عليكم، وتتلمذوا على يدي، لأني وديع ومتواضع القلب، فتجدوا الراحة لنفوسكم."]]}, {"l": "Act 15:10", "n": "", "vs": [[10, "فلماذا تعارضون الله فتحملون تلاميذ الرب عبئا ثقيلا عجز الآباء وعجزنا نحن عن حمله؟"]]}], "kwAr": "داس مضطهدونا أعناقنا", "noteAr": "بالعبرانية: على أعناقنا نُضطهد. انظر مرا 1: 14؛ 4: 19؛ تث 28: 48، 65، 66؛ إر 27: 2، 8، 11، 12؛ 28: 14؛ مت 11: 29؛ أع 15: 10"}, {"kw": "labour", "raw": "Neh_9:36, Neh_9:37", "note": "", "refs": [{"l": "Neh 9:36", "n": "", "vs": [[36, "وها نحن اليوم مستعبدون في الأرض التي وهبتها لآبائنا ليأكلوا أثمارها وخيرها."]]}, {"l": "Neh 9:37", "n": "", "vs": [[37, "تذهب غلاتها الوفيرة إلى الملوك الذين سلطتهم علينا من جراء معاصينا، وهم يتحكمون في أجسادنا وبهائمنا كما يطيب لهم، بينما نحن في كرب شديد."]]}], "kwAr": "أعيينا", "noteAr": ""}], "arS": [["داس مضطهدونا ", []], ["أعناقنا", ["H6677"]], ["، ", []], ["أعيينا", ["H3021"]], [" ", []], ["ولم", ["H3808"]], [" ", []], ["نجد", ["H7291"]], [" ", []], ["راحة", ["H5117"]], [".", []]]}, {"c": 5, "v": 6, "text": "خضعنا باسطين أيدينا إلى أشور ومصر لنشبع خبزا.", "groups": [{"kw": "given", "raw": "Gen_24:2; 2Ki_10:15; Jer_50:15; Eze_17:18", "note": "", "refs": [{"l": "Gen 24:2", "n": "", "vs": [[2, "وقال إبراهيم لرئيس عبيده، المتولي جميع شؤون بيته: «ضع يدك تحت فخذي،"]]}, {"l": "2Ki 10:15", "n": "", "vs": [[15, "ثم انطلق من هناك فالتقى يهوناداب بن ركاب، الذي كان قادما لمقابلته، فحياه ياهو ثم سأله: «هل قلبك مخلص لقلبي مثل إخلاص قلبي لقلبك؟» فأجابه يهوناداب: «نعم». فقال ياهو: «إذن هات يدك». فمد إليه يده فأصعده معه إلى المركبة،"]]}, {"l": "Jer 50:15", "n": "", "vs": [[15, "أطلقوا هتاف الحرب عليها من كل جانب، فقد استسلمت وانهارت أسسها، وتقوضت أسوارها، لأن هذا هو انتقام الرب، فاثأروا منها، وعاملوها بمثل ما عاملتكم."]]}, {"l": "Eze 17:18", "n": "", "vs": [[18, "لقد ازدرى الحلف حين نكث العهد، وها هو قد مد يد الولاء إلى مصر. ولكنه وإن فعل هذا كله لن يفلت."]]}], "kwAr": "خضعنا باسطين أيدينا", "noteAr": ""}, {"kw": "to the Egyptians", "raw": "Isa_30:1-6, Isa_31:1-3, Isa_57:9; Jer_2:18, Jer_2:36, Jer_44:12-14; Hos_5:13, Hos_7:11, Hos_9:3; Hos_12:1", "note": "", "refs": [{"l": "Isa 30:1-6", "n": "", "vs": [[1, "يقول الرب: «ويل للبنين المتمردين الذين ينصاعون لمشورة لم تصدر عني، ويبرمون عهدا ليس من روحي، ليضيفوا خطيئة إلى خطيئة."], [2, "الذين يتأهبون للانحدار إلى مصر من غير أن يلجأوا إلى مشورتي، ليلوذوا بحمى فرعون ويعتصموا بظل مصر،"], [3, "لذلك يصير لكم حصن فرعون عارا، والاحتماء بظل مصر خزيا،"], [4, "ومع أن سلطانه امتد إلى صوعن وحانيس حتى أقام فيها لنفسه ولاة وممثلين"], [5, "فإنهم يلحقون بكم العار ويجلبون عليكم الخزي لأنهم شعب لا جدوى منه»."], [6, "نبؤة بشأن وحوش النقب: عبر أرض العناء والأهوال حيث تعيش الأسود والأفاعي، تحمل قوافلهم أموالهم على ظهور حميرهم، وكنوزهم على أسنمة جمالهم إلى مصر التي لا رجاء فيها."]]}, {"l": "Isa 31:1-3", "n": "", "vs": [[1, "ويل للمنحدرين إلى مصر طلبا للعون، المتوكلين على الخيل، الواثقين بكثرة المركبات وببأس الفرسان، من غير أن يلتفتوا إلى قدوس إسرائيل، أو يطلبوا مشورة الرب."], [2, "ومع ذلك فهو حكيم يجلب الشر، ولا ينقض كلامه بل سيهب ليعاقب بيت الأشرار وناصري فعلة الإثم."], [3, "ليس المصريون آلهة بل بشرا، وخيولهم مجرد أجساد وليست أرواحا، وعندما يمد الرب يده، يتعثر المعين ويسقط المستعين، ويهلكان كلاهما معا."]]}, {"l": "Isa 57:9", "n": "", "vs": [[9, "ارتحلتم إلى ملوك محملين بالدهن، وبكثرة الأطياب، وأرسلتم سفراءكم إلى أرض بعيدة، وانحدرتم حتى إلى الهاوية."]]}, {"l": "Jer 2:18", "n": "", "vs": [[18, "والآن ما بالك تتوجهين صوب مصر لشرب مياه شيحور؟ وما بالك تقصدين إلى أشور لشرب مياه الفرات؟"]]}, {"l": "Jer 2:36", "n": "", "vs": [[36, "لماذا تتهافتون على تغيير اتجاهكم؟ ستلحق بكم مصر الخزي كما ألحقه بكم الأشوريون."]]}, {"l": "Jer 44:12-14", "n": "", "vs": [[12, "وآخذ بقية يهوذا الذين وطدوا العزم على الرحيل إلى مصر ليتغربوا فيها، وأفنيهم كلهم هناك، فيهلكون بالسيف والجوع من صغيرهم إلى كبيرهم، فيموتون ويصبحون سبة ودهشة ولعنة وعارا."], [13, "وأعاقب المقيمين في مصر كما عاقبت أهل أورشليم بالسيف والجوع والوباء،"], [14, "فلا يفلت منهم ناج، ولا يسلم أحد من بقية يهوذا المرتحلين ليتغربوا هناك في مصر، ليرجع إلى أرض يهوذا التي يتوق للعودة إليها والإقامة فيها، لأنه لن يرجع إليها إلا قلة من الطريدين»."]]}, {"l": "Hos 5:13", "n": "", "vs": [[13, "عندما تبين إسرائيل داءه، ويهوذا جراحه، لجأ إسرائيل إلى أشور يلتمس معونة الملك العظيم، إلا أنه أخفق في علاجه أو في مداواة جراحه."]]}, {"l": "Hos 7:11", "n": "", "vs": [[11, "إن أفرايم مثل حمامة غبية حمقاء، تستنجد بمصر تارة وتستغيث بأشور تارة أخرى."]]}, {"l": "Hos 9:3", "n": "", "vs": [[3, "لن تظلوا مقيمين في أرض الرب بل يرجع أفرايم إلى ديار مصر، ويأكلوا لحما نجسا في أشور."]]}, {"l": "Hos 12:1", "n": "", "vs": [[1, "يرعى أفرايم الريح، ويطارد الريح الشرقية طوال اليوم، ويرتكب الأكاذيب والجور بكثرة، ويبرم عهدا مع أشور، ويبعث بزيت الزيتون إلى مصر."]]}], "kwAr": "ومصر", "noteAr": ""}], "arS": [["خضعنا", ["H5414"]], [" باسطين ", []], ["أيدينا", ["H3027"]], [" إلى ", []], ["أشور", ["H804"]], [" ", []], ["ومصر", ["H4714"]], [" ", []], ["لنشبع", ["H7646"]], [" ", []], ["خبزا", ["H3899"]], [".", []]]}, {"c": 5, "v": 7, "text": "قد أخطأ آباؤنا، وتواروا عن الوجود، ونحن نتحمل عقاب آثامهم.", "groups": [{"kw": "fathers", "raw": "Exo_20:5; Jer_16:12, Jer_31:29; Eze_18:2; Mat_23:32-36", "note": "", "refs": [{"l": "Exo 20:5", "n": "", "vs": [[5, "لا تسجد لهن ولا تعبدهن، لأني أنا الرب إلهك، إله غيور، أفتقد آثام الآباء في البنين حتى الجيل الثالث والرابع من مبغضي،"]]}, {"l": "Jer 16:12", "n": "", "vs": [[12, "ولأنكم أنتم أيضا قد أسأتم أكثر من آبائكم، وغوى كل واحد منكم وراء قلبه الشرير العنيد ورفض طاعتي."]]}, {"l": "Jer 31:29", "n": "", "vs": [[29, "«وفي تلك الأيام لن يقول أحد: قد أكل الآباء الحصرم فضرست أسنان الأبناء»."]]}, {"l": "Eze 18:2", "n": "", "vs": [[2, "«ما بالكم تضربون هذا المثل بشأن أرض إسرائيل قائلين: أكل الآباء الحصرم فضرست أسنان الأبناء؟"]]}, {"l": "Mat 23:32-36", "n": "", "vs": [[32, "فأكملوا ما بدأه آباؤكم ليطفح الكيل!"], [33, "أيها الحيات، أولاد الأفاعي! كيف تفلتون من عقاب جهنم؟"], [34, "لذلك: ها أنا أرسل إليكم أنبياء وحكماء ومعلمين، فبعضهم تقتلون وتصلبون، وبعضهم تجلدون في مجامعكم، وتطاردونهم من مدينة إلى أخرى."], [35, "وبهذا يقع عليكم كل دم زكي سفك على الأرض: من دم هابيل البار إلى دم زكريا بن برخيا الذي قتلتموه بين الهيكل والمذبح."], [36, "الحق أقول لكم: إن عقاب ذلك كله سينزل بهذا الجيل."]]}], "kwAr": "آباؤنا", "noteAr": ""}, {"kw": "and are", "raw": "Gen_42:13, Gen_42:36; Job_7:8, Job_7:21; Jer_31:15; Zec_1:5", "note": "", "refs": [{"l": "Gen 42:13", "n": "", "vs": [[13, "فأجابوه: «إن عبيدك اثنا عشر أخا، أبناء رجل واحد مقيم في أرض كنعان. وقد بقي أخونا الصغير عند أبينا اليوم، والآخر مفقود»."]]}, {"l": "Gen 42:36", "n": "", "vs": [[36, "فقال لهم أبوهم: «لقد أثكلتموني أولادي. يوسف مفقود، وشمعون مفقود، وها أنتم تأخذون بنيامين بعيدا! كل هذه الدواهي حلت بي!»"]]}, {"l": "Job 7:8", "n": "", "vs": [[8, "إن عين من يراني الآن لن تبصرني فيما بعد، وعندما تلتفت عيناك إلي لا تجدني بعد."]]}, {"l": "Job 7:21", "n": "", "vs": [[21, "لماذا لا تصفح عن إثمي وتزيل ذنبي، لأنني الآن أرقد في التراب، وعندما تبحث عني أكون قد فنيت»."]]}, {"l": "Jer 31:15", "n": "", "vs": [[15, "وهذا ما يعلنه الرب: «قد تردد في الرامة صوت ندب وبكاء مر. راحيل تنوح على أبنائها وتأبى أن تتعزى عنهم لأنهم غير موجودين»."]]}, {"l": "Zec 1:5", "n": "", "vs": [[5, ; Amo_6:4-7, Amo_8:10; Jam_4:9, Jam_4:10", "note": "", "refs": [{"l": "Psa 30:11", "n": "", "vs": [[11, "حولت نوحي إلى رقص. خلعت عني مسح الحداد وكسوتني رداء الفرح."]]}, {"l": "Amo 6:4-7", "n": "", "vs": [[4, "ويل للراقدين فوق أسرة من عاج، المسترخين فوق الأرائك، الآكلين لحم خيرة الحملان والعجول المختارة من وسط المعلف."], [5, "المغنين على صوت الرباب، المخترعين لأنفسهم آلات غناء كداود."], [6, "الشاربين خمرا في كؤوس، المتطيبين بأفضل العطور، ولا يكتئبون على خراب يوسف."], [7, "لهذا سيكونون أول الذاهبين إلى السبي، ويزول ما أنتم عليه من لهو وعبث."]]}, {"l": "Amo 8:10", "n": "", "vs": [[10, "أحول أعيادكم إلى مآتم، وأغانيكم إلى مراث، وألبسكم المسوح على أحقائكم، وأفشي الصلع في كل رأس، فتصبح أعيادكم كمناحة على وحيد، ونهايتها كيوم مفعم بالمرارة."]]}, {"l": "Jam 4:9", "n": "", "vs": [[9, "احزنوا مولولين ونائحين وباكين. ليتحول ضحككم إلى نواح، وفرحكم إلى كآبة."]]}, {"l": "Jam 4:10", "n": "", "vs": [[10, "تواضعوا في حضرة الرب فيرفعكم!"]]}], "kwAr": "رقصنا", "noteAr": ""}], "arS": [["انقطع", ["H7673"]], [" ", []], ["فرح", ["H4885"]], [" ", []], ["قلبنا", ["H3820"]], [" وتحول ", []], ["رقصنا", ["H4234"]], [" إلى ", []], ["نوح", ["H60"]], [".", []]]}, {"c": 5, "v": 16, "text": "تهاوى إكليل رأسنا، فويل لنا لأننا قد أخطأنا.", "groups": [{"kw": "The crown", "raw": "Lam_1:1; Job_19:9; Psa_89:39; Jer_13:18; Eze_21:26; Rev_2:10, Rev_3:11", "note": "", "refs": [{"l": "Lam 1:1", "n": "", "vs": [[1, "كيف أصبحت المدينة الآهلة بالسكان مهجورة وحيدة؟ صارت كأرملة! هذه التي كانت عظيمة بين الأمم. السيدة بين المدن صارت تحت الجزية!"]]}, {"l": "Job 19:9", "n": "", "vs": [[9, "جردني من مجدي ونزع تاجي عن رأسي."]]}, {"l": "Psa 89:39", "n": "", "vs": [[39, "وتنكرت لعهدك مع عبدك، لطخت تاجه بالتراب."]]}, {"l": "Jer 13:18", "n": "", "vs": [[18, "قل للملك وللملكة: «تواضعا، وتنازلا عن موضعكما لأن تاج مجدكما قد سقط عن رأسيكما»."]]}, {"l": "Eze 21:26", "n": "", "vs": [[26, "اخلع العمامة، وانزع التاج، فلن يبقى الحال كسالف العهد به، ارفع الوضيع، وضع الرفيع."]]}, {"l": "Rev 2:10", "n": "", "vs": [[10, "دع عنك الخوف مم "", "vs": [[17, "جميع الأيدي مسترخية، وكل الركب مائعة كالمياه."], [18, "يتلفعون بالمسوح، ويغشاهم الرعب، ويكسو العار وجوههم جميعا، ويطغى القرع على رؤوسهم."], [19, "يطرحون فضتهم في الشوارع، ويضحى ذهبهم نجاسة، وتعجز فضتهم وذهبهم عن إنقاذهم في يوم غضب الرب. لا يشبعون منهما جوعهم، ولا يملأون منهما أجوافهم لأنهما كانا معثرة إثم لهم."], [20, "حولوا جمال زينة هيكل الرب إلى زهو، وصنعوا من الذهب والفضة تماثيل أرجاسهم وأصنامهم المكروهة، لذلك جعلتها رجاسة لهم."], [21, "أسلمها إلى أيدي الغرباء نهبا، ولأشرار الأرض سلبا فينجسونها."], [22, "وأشيح بوجهي عنهم فيدنسون هيكلي، ويدخل إليه الناهبون وينجسونه."]]}, {"l": "Eze 22:12-16", "n": "", "vs": [[12, "فيك أخذوا الرشوة لقاء سفك الدماء. أخذت الربا ومال الحرام، وسلبت أقرباءك ظلما ونسيتني، يقول السيد الرب."], [13, "ها أنا قد صفقت بكفي من جراء ما حصلت عليه من ربح حرام، وما سفك من دم في وسطك."], [14, "فهل يصمد قلبك أو تحتفظ يداك بقوتهما في الأيام التي فيها أتعامل معك؟ أنا الرب قد تكلمت وأتمم ما أنطق به."], [15, "سأشتتك بين الأمم، وأبعثرك في البلدان، وأزيل نجاستك منك."], [16, "وتتدنسين بنفسك أمام عيون الأمم، وتدركين أني أنا الرب»."]]}, {"l": "2Pe 2:4-6", "n": "", "vs": [[4, "فإن الله لم يشفق على الملائكة الذين أخطأوا، بل طرحهم في أعماق هاوية الظلام مقيدين بالسلاسل، حيث يظلون محبوسين إلى يوم الحساب."], [5, "كذلك لم يشفق على العالم القديم عندما أحدث الطوفان على عالم الفاجرين، إلا أنه حفظ نوحا المنادي ببر الله وعدله. وكان نوح واحدا من ثمانية أشخاص نجوا من الطوفان."], [6, "وإذ حكم الله على مدينتي سدوم وعمورة بالخراب، حولهما إلى رماد، جاعلا منهما عبرة للذين يعيشون حياة فاجرة."]]}], "kwAr": "فويل لنا", "noteAr": ""}], "arS": [["تهاوى", ["H5307"]], [" ", []], ["إكليل", ["H5850"]], [" ", []], ["رأسنا", ["H7218"]], ["، ", []], ["فويل", ["H188"]], [" لنا ", []], ["لأننا", ["H3588"]], [" قد ", []], ["أخطأنا", ["H2398"]], [".", []]]}, {"c": 5, "v": 17, "text": "لهذا غشي على قلوبنا، وأظلمت عيوننا.", "groups": [{"kw": "our heart", "raw": "Lam_1:13, Lam_1:22; Lev_26:36; Isa_1:5; Jer_8:18, Jer_46:5; Eze_21:7, Eze_21:15; Mic_6:13", "note": "", "refs": [{"l": "Lam 1:13", "n": "", "vs": [[13, "من العلاء صب نارا في عظامي فسرت فيها. نصب شركا لقدمي فردني إلى الوراء. جعلني أطلالا أئن طول النهار."]]}, {"l": "Lam 1:22", "n": "", "vs": [[22, "ليأت كل شرهم أمامك فتعاقبهم كما عاقبتني على كل ذنوبي، لأن تنهداتي كثيرة وقلبي مغشي عليه."]]}, {"l": "Lev 26:36", "n": "", "vs": [[36, "أما الباقون منكم في أرض أعدائكم، فإني ألقي الرعب في قلوبهم فيهربون من حفيف ورقة تسوقها الريح، وكأنهم يهربون من السيف، ويسقطون وليس ثمة من طارد لهم."]]}, {"l": "Isa 1:5", "n": "", "vs": [[5, "على أي موضع أضربكم بعد؟ لماذا تواظبون على التمرد؟ إن الرأس بجملته سقيم والقلب بكامله مريض."]]}, {"l": "Jer 8:18", "n": "", "vs": [[18, "قد غلب علي الحزن وقلبي في سقيم."]]}, {"l": "Jer 46:5", "n": "", "vs": [[5, "ولكن مالي أراهم يولون الأدبار مرتعبين؟ قد دحر محاربوهم وفروا مسرعين. لم يلتفتوا إلى الوراء، قد حاصرهم الهول من كل جانب»، يقول الرب."]]}, {"l": "Eze 21:7", "n": "", "vs": [[7, "فإن سألوك: على ماذا تتنهد؟ تجبهم: على الأخبار الواردة التي تذيب كل قلب، فتسترخي الأيدي ويعتري القنوط كل روح، وتصبح الركب كالماء. ها هي الأخبار واردة ولابد أن تتم، يقول السيد الرب»."]]}, {"l": "Eze 21:15", "n": "", "vs": [[15, "لكي تذوب القلوب، فيتهاوى كثيرون صرعى عند كل بواباتهم. لهذا جردت سيفا متقلبا براقا مصقولا متأهبا للذبح."]]}, {"l": "Mic 6:13", "n": "", "vs": [[13, "لذلك شرعت في تدميرك لأجعلك خرابا من أجل خطاياك."]]}], "kwAr": "غشي على قلوبنا", "noteAr": ""}, {"kw": "our eyes", "raw": "Lam_2:11; Deu_28:65; Job_17:7; Psa_6:7, Psa_31:9, Psa_69:3; Isa_38:14", "note": "", "refs": [{"l": "Lam 2:11", "n": "", "vs": [[11, "كلت عيناي من البكاء، جاشت أحشائي وأريقت كبدي على الأرض حزنا لدمار ابنة شعبي، لأن الأطفال والرضع غشي عليهم في شوارع المدينة."]]}, {"l": "Deu 28:65", "n": "", "vs": [[65, "ولا تجدون بين تلك الأمم اطمئنانا ولا مقرا لقدم، بل يعطيكم الرب قلبا هلعا، وعيونا أوهنها الترقب، ونفوسا يائسة."]]}, {"l": "Job 17:7", "n": "", "vs": [[7, "كلت عيناي حزنا وأصبحت أعضائي كالظل،"]]}, {"l": "Psa 6:7", "n": "", "vs": [[7, "وهنت عيناي من فرط الغم، وكلتا بسبب جميع خصومي."]]}, {"l": "Psa 31:9", "n "أما أنت يارب فجالس على عرشك إلى الأبد، وذكرك باق مدى الدهر."]]}, {"l": "Psa 102:25-27", "n": "", "vs": [[25, "من قدم أسست الأرض، والسماوات هي صنع يديك."], [26, "هي زائلة أما أنت فباق. تبلى كلها كالثوب. وتستبدلها كما يستبدل الرداء القديم بالجديد."], [27, "لكنك أنت الدائم الخالد، وسنوك لن تنتهي."]]}, {"l": "Hab 1:12", "n": "", "vs": [[12, "ألست أنت منذ الأزل أيها الرب إلهي، قدوسي؟ لهذا لن نفنى. لقد أقمت الكلدانيين لمقاضاتنا واخترتهم ياصخرتي لتعاقبنا."]]}, {"l": "1Ti 1:17", "n": "", "vs": [[17, "فللملك الأزلي، الله الواحد غير المنظور وغير الفاني، الكرامة والمجد إلى أبد الآبدين. آمين!"]]}, {"l": "1Ti 6:15", "n": "", "vs": [[15, "هذا الظهور سوف يتممه الله في وقته الخاص، هو السيد المبارك الأوحد، ملك الملوك ورب الأرباب،"]]}, {"l": "1Ti 6:16", "n": "", "vs": [[16, "الذي وحده لا فناء له، الساكن في نور لا يدنى منه، الذي لم يره أي إنسان ولا يقدر أن يراه. له الكرامة والقدرة الأبدية. آمين!"]]}, {"l": "Heb 1:10-12", "n": "", "vs": [[10, "كما يخاطب الابن أيضا بقوله: «أنت، يارب، وضعت أساس الأرض في البداية. والسماوات هي صنع يديك."], [11, "هي تفنى، وأنت تبقى. فسوف تبلى كلها كما تبلى الثياب،"], [12, "فتطويها كالرداء، ثم تبدلها. ولكنك أنت الدائم الباقي، وسنوك لن تنتهي!»"]]}, {"l": "Heb 13:8", "n": "", "vs": [[8, "يسوع المسيح هو هو أمسا واليوم وإلى الأبد."]]}, {"l": "Rev 1:4", "n": "", "vs": [[4, "من يوحنا، إلى الكنائس السبع في مقاطعة آسيا: لكم النعمة والسلام من الكائن والذي كان والذي سيأتي، ومن الأرواح السبعة الماثلة أمام عرشه،"]]}, {"l": "Rev 1:8", "n": "", "vs": [[8, "«أنا الألف والياء» (البداية والنهاية). هذا يقوله الرب الإله الكائن والذي كان والذي سيأتي، القادر على كل شيء."]]}, {"l": "Rev 1:17", "n": "", "vs": [[17, "فلما رأيته ارتميت عند قدميه كالميت، فلمسني بيده اليمنى وقال: «لا تخف! أنا الأول والآخر،"]]}, {"l": "Rev 1:18", "n": "", "vs": [[18, "أنا الحي. كنت ميتا، ولكن ها أنا حي إلى أبد الآبدين. ولي مفاتيح الموت والهاوية."]]}], "kwAr": "فتملك", "noteAr": ""}, {"kw": "thy throne", "raw": "Psa_45:6, Psa_145:13, Psa_146:10; Dan_2:44, Dan_7:14, Dan_7:27; Heb_1:8, Heb_1:9", "note":
