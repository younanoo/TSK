], [8, "هل انتهت رحمته إلى الأبد؟ هل انقطعت عنا مواعيده؟"], [9, "ألعل الله نسي رأفته؟ أم حبس بغضب مراحمه؟"], [10, "ثم قلت: «هذا يسقمني: أن يمين الله العلي قد تحولت (عنا)»"]]}, {"l": "Psa 79:5", "n": "", "vs": [[5, "إلى متى يدوم هذا يارب؟ أتبقى غاضبا تتقد غيرتك كالنار إلى الأبد؟"]]}, {"l": "Psa 85:5", "n": "", "vs": [[5, "أتسخط علينا إلى الأبد؟ أتطيل غضبك من جيل إلى جيل؟"]]}, {"l": "Psa 89:46", "n": "", "vs": [[46, "حتى متى يارب؟ هل إلى الأبد تظل محتجبا عني، يتقد غضبك كالنار؟"]]}, {"l": "Psa 94:3", "n": "", "vs": [[3, "إلى متى يارب يشمت الأشرار فرحين؟"]]}, {"l": "Psa 94:4", "n": "", "vs": [[4, "إلى متى يهذر عمال الإثم ويتواقحون ويتباهون بأنفسهم؟"]]}, {"l": "Isa 64:9-12", "n": "", "vs": [[9, "لا توغل في غضبك علينا يارب، ولا تذكر الإثم إلى الأبد. إنما انظر إلينا، فكلنا شعبك."], [10, "قد استحالت مدينتك المقدسة إلى قفر، وأصبحت صهيون برية وأورشليم موحشة،"], [11, "واحترق بالنار هيكلنا المقدس البهي، الذي شدا آباؤنا فيه بتسبيحك، وصار كل ما هو أثير لدينا خرابا."], [12, "هل بعد هذا كله تسكت يارب، وتعتصم بالصمت وتنزل بنا أشد البلاء؟"]]}, {"l": "Jer 14:19-21", "n": "", "vs": [[19, "هل تنكرت ليهوذا كل التنكر؟ وهل كرهت نفسك صهيون؟ ما بالك قد ابتليتنا بضربة لا شفاء منها؟ وقد طلبنا السلام فلم نحظ بالخير. رجونا وقت الشفاء وإذا بنا نلقى الرعب."], [20, "نحن نقر بشرنا يارب وبآثام آبائنا، لأننا قد أخطأنا إليك."], [21, "لا ترفضنا من أجل اسمك ولا تهن عرشك المجيد. اذكر عهدك معنا ولا تنقضه."]]}], "kwAr": "لماذا تنسانا", "noteAr": ""}, {"kw": "so long time", "raw": "Heb. for length of days", "note": "Heb. for length of days", "refs": [], "kwAr": "طول الأيام", "noteAr": "بالعبرانية: لطول الأيام."}], "arS": [["لماذا", ["H4100"]], [" ", []], ["تنسانا", ["H7911"]], [" إلى ", []], ["الأبد", ["H5331"]], [" ", []], ["وتتركنا", ["H5800"]], [" ", []], ["طول", ["H753"]], [" ", []], ["الأيام", ["H3117"]], ["؟", []]]}, {"c": 5, "v": 21, "text": "ردنا يارب إليك فنرجع. جدد أيامنا كما في العهود السالفة.", "groups": [{"kw": "Turn", "raw": "1Ki_18:37; Psa_80:3, Psa_80:7, Psa_80:19, Psa_85:4; Jer_31:18, Jer_32:39, Jer_32:40; Eze_11:19, Eze_11:20; Eze_36:25-27, Eze_36:37; Hab_3:2", "note": "", "refs": [{"l": "1Ki 18:37", "n": "", "vs": [[37, "استجبني يارب، استجبني، ليدرك هذا الشعب أنك أنت الرب الإله، وأنك أنت ترد قلوبهم إليك»."]]}, {"l": "Psa 80:3", "n": "", "vs": [[3, "ياالله ردنا إليك وأنر بوجهك علينا فنخلص."]]}, {"l": "Psa 80:7", "n": "", "vs": [[7, "ياإله الجنود ردنا إليك، وأنر بوجهك علينا فنخلص."]]}, {"l": "Psa 80:19", "n": "", "vs": [[19, "يارب إله الجنود ردنا إليك، وأنر بوجهك علينا فنخلص."]]}, {"l": "Psa 85:4", "n": "", "vs": [[4, "ردنا إليك ياالله مخلصنا، واصرف غيظك عنا."]]}, {"l": "Jer 31:18", "n": "", "vs": [[18, "قد سمعت أفرايم ينتحب قائلا: أدبتني فتأدبت كعجل غير مروض. أرجعني فأرجع لأنك أنت الرب إلهي."]]}, {"l": "Jer 32:39", "n": "", "vs": [[39, "وأعطيهم قلبا واحدا وطريقا واحدا ليتقوني كل الأيام، وذلك لخيرهم وخير أولادهم من بعدهم."]]}, {"l": "Jer 32:40", "n": "", "vs": [[40, "وأبرم معهم عهدا أبديا أن لا أكف عن الإحسان إليهم، وأضع تقواي في قلوبهم لئلا يرتدوا عني،"]]}, {"l": "Eze 11:19", "n": "", "vs": [[19, "وأعطيهم جميعا قلبا واحدا، وأجعل في داخلهم روحا جديدا، وأزيل قلب الحجر من لحمهم. وأستبدله بقلب من لحم،"]]}, {"l": "Eze 11:20", "n": "", "vs": [[20, "لكي يسلكوا في فرائضي ويطيعوا أحكامي ويمارسوها، ويكونوا لي شعبا وأنا أكون لهم إلها."]]}, {"l": "Eze 36:25-27", "n": "", "vs": [[25, "وأرش عليكم ماء نقيا فتطهرون من كل نجاستكم ومن كل أصنامكم،"], [26, "وأهبكم قلبا جديدا، وأضع في داخلكم روحا جديدة، وأنتزع من لحمكم قلب الحجر وأعطيكم عوضا عنه قلب لحم."], [27, "وأضع روحي في داخلكم فأجعلكم تمارسون فرائضي وتطيعون أحكامي عاملين بها،"]]}, {"l": "Eze 36:37", "n": "", "vs": [[37, "عندئذ أجعل شعب إسرائيل يلتمسون هذا مني، فأستجيب لمطلبهم: أن أكثرهم كقطيع غنم."]]}, {"l": "Hab 3:2", "n": "", "vs": [[2, "«يارب قد بلغني ما فعلت فخفت يارب، عملك في وسط السنين أحيه، وعرف به على مر الأيام، واذكر الرحمة في الغضب."]]}], "kwAr": "ردنا", "noteAr": ""}, {"kw": "renew", "raw": "Jer_31:4, Jer_31:23-25, Jer_33:10,Jer_33:13; Zec_8:3-6; Mal_3:4", "note": "", "refs": [{"l": "Jer 31:4", "n": "", "vs": [[4, "لهذا أبنيك ياعذراء إسرائيل (أي أورشليم) فتبنين، وتتزينين ثانية بدفوفك، وتبرزين في مراقص الطربين."]]}, {"l": "Jer 31:23-25", "n": "", "vs": [[23, "وهذا ما يعلنه الرب القدير إله إسرائيل: «سيرددون هذه العبارة مرة أخرى في أرض يهوذا وفي أرجاء مدنها، عندما أردهم من سبيهم: ليباركك الرب يامسكن البر، ياأيها الجبل المقدس."], [24, "فيقيم هناك يهوذا وكل أهل مدنه والفلاحون والسارحون بقطعانهم."], [25, "لأني سأنعش النفس المعيية، وأشبع النفوس الواهنة»."]]}, {"l": "Jer 33:10", "n": "", "vs": [[10, "وهذا ما يعلنه الرب: في هذا الموضع الذي تقولون عنه إنه خراب هجره الإنسان والحيوان، وفي مدن يهوذا وشوارع أورشليم الموحشة المقفرة من الناس، والتي لا يقيم فيها حيوان، ستتردد فيها ثانية"]]}, {"l": "Jer 33:13", "n": "", "vs": [[13, "وفي مدن المناطق الجبلية ومدن السفوح القريبة، ومدن النقب، وفي أرض بنيامين وفي القرى المجاورة لأورشليم، وفي مدن يهوذا تمر الغنم أمام المحصي."]]}, {"l": "Zec 8:3-6", "n": "", "vs": [[3, "لهذا يقول الرب القدير: ها أنا عائد إلى صهيون لأقيم في أورشليم، فتدعى آنئذ مدينة الحق، كما يدعى جبل الرب القدير الجبل المقدس."], [4, "ويعود الشيوخ من رجال ونساء، ممن يتكئون على عصيهم لفرط كبر أعمارهم، فيجلسون في شوارع أورشليم."], [5, "وتكتظ طرقاتها بالأولاد والبنات اللاعبين فيها."], [6, "فإن كان هذا الأمر عجيبا في أعين البقية الناجية من هذا الشعب، أيكون عجيبا في عيني الرب؟"]]}, {"l": "Mal 3:4", "n": "", "vs": [[4, "عندئذ تكون تقدمة يهوذا وشعب أورشليم مرضية عند الرب، كالعهد بها في سالف الأيام وفي السنين الغابرة."]]}], "kwAr": "جدد", "noteAr": ""}], "arS": [["ردنا", ["H7725"]], [" ", []], ["يارب", ["H3068"]], [" ", []], ["إليك", ["H413"]], [" ", []], ["فنرجع", ["H7725"]], [". ", []], ["جدد", ["H2318"]], [" أيامنا ", []], ["كما", ["H3117"]], [" في العهود ", []], ["السالفة", ["H6924"]], [".", []]]}, {"c": 5, "v": 22, "text": "إلا إن كنت قد رفضتنا كل الرفض وغضبت علينا أشد الغضب.", "groups": [{"kw": "But thou hast utterly rejected us", "raw": "or, For wilt thou utterly reject us, Psa_44:9, Psa_60:1, Psa_60:2; Jer_15:1-5; Eze_37:11; Hos_1:6", "note": "or, For wilt thou utterly reject us, Psa_44:9, Psa_60:1, Psa_60:2; Jer_15:1-5; Eze_37:11; Hos_1:6", "refs": [{"l": "Psa 44:9", "n": "", "vs": [[9, "غير أنك قد رذلتنا وأخجلتنا، ولم تعد ترافق جنودنا إلى الحرب."]]}, {"l": "Psa 60:1", "n": "", "vs": [[1, "ياالله قد رذلتنا، وبددتنا وسخطت علينا، فردنا إليك."]]}, {"l": "Psa 60:2", "n": "", "vs": [[2, "زلزلت الأرض وصدعتها، فاجبر كسرها لأنها تهتز."]]}, {"l": "Jer 15:1-5", "n": "", "vs": [[1, "ثم قال لي الرب: «وحتى لو مثل موسى وصموئيل أمامي، من أجل الشعب فإن قلبي لن يلتفت إلى هذا الشعب. اطرحهم من محضري فيخرجوا."], [2, "وعندما يسألونك: إلى أين نذهب؟ أجبهم: هذا ما يعلنه الرب: من هو للوبأ فبالوبأ يموت، ومن هو للسيف فبالسيف يقتل، ومن هو للمجاعة فبالمجاعة يفنى، ومن هو للسبي فإلى السبي يذهب."], [3, "وأعهد بهم إلى أربعة أصناف من الخراب يقول الرب: السيف للذبح، والكلاب للتمزيق، وطيور السماء ووحوش الأرض للافتراس والإهلاك."], [4, "وأجعلهم مثار رعب أمم الأرض نتيجة لما ارتكبه منسى بن حزقيا في أورشليم."], [5, "فمن يعطف عليك ياأورشليم، ومن يرثي لك؟ من يتوقف ليسأل عن سلامتك؟"]]}, {"l": "Eze 37:11", "n": "", "vs": [[11, "ثم قال لي: «ياابن آدم، هذه العظام هي جملة شعب إسرائيل. ها هم يقولون قد يبست عظامنا ومات رجاؤنا وانقطعنا."]]}, {"l": "Hos 1:6", "n": "", "vs": [[6, "ثم حملت ثانية فأنجبت ابنة، فقال له الرب: «سمها لورحامة (ومعناه: لا رحمة) لأني لا أعود أرحم بيت إسرائيل ولن أصفح عنهم."]]}], "kwAr": "إلا إن كنت قد رفضتنا كل الرفض", "noteAr": "أو: أفترفضنا كل الرفض؟ انظر مز 44: 9؛ 60: 1، 2؛ إر 15: 1-5؛ حز 37: 11؛ هو 1: 6"}], "arS": [["إلا ", []], ["إن", ["H3588"]], [" كنت قد ", []], ["رفضتنا", ["H3988"]], [" ", []], ["كل", ["H3966"]], [" ", []], ["الرفض", ["H3988"]], [" وغضبت ", []], ["علينا", ["H5921"]], [" ", []], ["أشد", ["H5704"]], [" ", []], ["الغضب", ["H7107"]], [".", []]]}], "strong": true}];</script>
