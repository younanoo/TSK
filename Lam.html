 سبوتي."], [9, "أقام فيك وشاة عملوا على سفك الدم، وأكلوا أمام الأصنام على الجبال، وارتكبوا في وسطك الموبقات."], [10, "فيك فضح الإنسان عري أبيه، وفيك أذلوا من برحت متنجسة بطمثها."], [11, "فيك إنسان زنى مع امرأة قريبه، واقترف إنسان الرذيلة مع كنته، وفيك ضاجع إنسان أخته ابنة أبيه."], [12, "فيك أخذوا الرشوة لقاء سفك الدماء. أخذت الربا ومال الحرام، وسلبت أقرباءك ظلما ونسيتني، يقول السيد الرب."], [13, "ها أنا قد صفقت بكفي من جراء ما حصلت عليه من ربح حرام، وما سفك من دم في وسطك."], [14, "فهل يصمد قلبك أو تحتفظ يداك بقوتهما في الأيام التي فيها أتعامل معك؟ أنا الرب قد تكلمت وأتمم ما أنطق به."], [15, "سأشتتك بين الأمم، وأبعثرك في البلدان، وأزيل نجاستك منك."]]}], "kwAr": "ارتكبت", "noteAr": ""}, {"kw": "removed", "raw": "Heb. become a removing, or wandering, Jer_15:4, Jer_24:9, Jer_34:17; Eze_23:46 *marg.", "note": "Heb. become a removing, or wandering, Jer_15:4, Jer_24:9, Jer_34:17; Eze_23:46 *marg.", "refs": [{"l": "Jer 15:4", "n": "", "vs": [[4, "وأجعلهم مثار رعب أمم الأرض نتيجة لما ارتكبه منسى بن حزقيا في أورشليم."]]}, {"l": "Jer 24:9", "n": "", "vs": [[9, "وأوقعهم في الضيق والشر في جميع ممالك الأرض، وأجعلهم عارا وعبرة وأحدوثة ولعنة في جميع الأماكن التي أجليهم إليها."]]}, {"l": "Jer 34:17", "n": "", "vs": [[17, "لذلك يقول الرب: «لأنكم لم تطيعوني ولم تنادوا بعتق إخوتكم، لذلك سأنادي أنا بعتقكم فأطلقكم لتسقطوا بحد السيف والوباء والجوع، وأجعلكم عرضة للرعب في جميع ممالك الأرض،"]]}, {"l": "Eze 23:46", "n": "*marg.", "vs": [[46, "لأن هذا ما يعلنه السيد الرب: ها أنا أجلب عليهما قوما من الأعداء، وأوقع بهما الرعب والنهب،"]]}], "kwAr": "رجسة", "noteAr": "بالعبرانية: صارت تنقلا أو تجولا. انظر إر 15: 4؛ 24: 9؛ 34: 17؛ حز 23: 46"}, {"kw": "all", "raw": "Lam_4:15, Lam_4:16, Lam_5:12-16; 1Sa_2:30", "note": "", "refs": [{"l": "Lam 4:15", "n": "", "vs": [[15, "هتفوا بهم: «ابتعدوا: تنحوا لا تلمسوا شيئا». فهربوا وتشردوا! غير أن أهل الأمم قالوا: لا يمكن أن يسكنوا معنا!"]]}, {"l": "Lam 4:16", "n": "", "vs": [[16, "قد بددهم الرب نفسه، ولم يعد يعبأ بهم، لم يكرموا الكهنة ولم يترَأفوا بالشيوخ."]]}, {"l": "Lam 5:12-16", "n": "", "vs": [[12, "علق النبلاء بأيديهم ولم يوقروا الشيوخ."], [13, "سخروا الشبان للطحن، وهوى الصبيان تحت الحطب."], [14, "هجر الشيوخ بوابة المدينة، وكف الشبان عن غنائهم."], [15, "انقطع فرح قلبنا وتحول رقصنا إلى نوح."], [16, "تهاوى إكليل رأسنا، فويل لنا لأننا قد أخطأنا."]]}, {"l": "1Sa 2:30", "n": "", "vs": [[30, "لذلك يقول الرب إله إسرائيل: لقد وعدت أن يظل بيتك وبيت أبيك يخدمون في محضري إلى الأبد. أما الآن، يقول الرب: فحاشا لي أن أفعل ذلك، لأنني أكرم الذين يكرمونني، أما الذين يحتقرونني فيصغرون."]]}], "kwAr": "جميع مكرميها", "noteAr": ""}, {"kw": "they", "raw": "Lam_4:21; Isa_47:3; Jer_13:22, Jer_13:26; Eze_16:37-39, Eze_23:29; Hos_2:3, Hos_2:10; Rev_3:18", "note": "", "refs": [{"l": "Lam 4:21", "n": "", "vs": [[21, "ابتهجي وافرحي ياابنة أدوم، ياساكنة عوص. إنما هذه الكأس ستجوز عليك أيضا فتسكرين وتتعرين."]]}, {"l": "Isa 47:3", "n": "", "vs": [[3, "فيظل عريك مكشوفا وعارك ظاهرا، فإني أنتقم ولا أعفو عن أحد."]]}, {"l": "Jer 13:22", "n": "", "vs": [[22, "وإن تساءلت في نفسك: «لماذا ابتليت بهذه الأمور؟» إنها عاقبة كثرة آثامك. قد هتكت أذيالك، واغتصب جسدك."]]}, {"l": "Jer 13:26", "n": "", "vs": [[26, "فأنا أيضا أرفع أذيالك على وجهك لينكشف عارك."]]}, {"l": "Eze 16:37-39", "n": "", "vs": [[37, "ها أنا أحشد جميع عشاقك الذين تلذذت بهم، وجميع من تدلهت بهم مع كل الذين أبغضتهم فأجمعهم عليك من كل ناحية، وأكشف عن عريك فيشاهدون عورتك كلها،"], [38, "وأدينك كما تدان الزانيات وسافكات الدماء، وأوقع بك عقاب دم سخطي وغيرتي،"], [39, "وأسلمك لأيديهم فيهدمون ماخورك ومرتفعة نصبك، ويسلبونك ثيابك ويستولون على جواهر زينتك ويتركونك عارية متجردة،"]]}, {"l": "Eze 23:29", "n": "", "vs": [[29, "فيعاملونك ببغض ويستولون على كل ثمار تعبك، ويتركونك متجردة عارية، فتنفضح عورة زناك وعهرك."]]}, {"l": "Hos 2:3", "n": "", "vs": [[3, "لئلا أعريها وأردها كما كانت يوم مولدها، وأجعلها كالقفر أو كأرض جرداء، وأميتها ظمأ."]]}, {"l": "Hos 2:10", "n": "", "vs": [[10, "وأكشف عورتها أمام عشاقها، ولا ينقذها أحد من يدي."]]}, {"l": "Rev 3:18", "n": "", "vs": [[18, "نصيحتي لك أن تشتري مني ذهبا نقيا، صفته ا  "raw": "Lam_1:17; Jer_2:34, Jer_13:27; Eze_24:12, Eze_24:13", "note": "", "refs": [{"l": "Lam 1:17", "n": "", "vs": [[17, "تمد صهيون يديها تلتمس معزيا، ولكن على غير طائل. قد أمر الرب أن يكون مضايقو يعقوب هم جيرانه الذين حوله. قد أصبحت أورشليم رجسا بينهم."]]}, {"l": "Jer 2:34", "n": "", "vs": [[34, "فوجد في أذيالكم أيضا دم المساكين الأبرياء الذين لم تقبضوا عليهم متلبسين بجريمة الاقتحام. ومع كل ذلك"]]}, {"l": "Jer 13:27", "n": "", "vs": [[27, "قد شهدت على التلال في الحقول فسقك وحمحمة فجورك وعهر زناك. ويل لك ياأورشليم. إلى متى تظلين غير طاهرة؟»"]]}, {"l": "Eze 24:12", "n": "", "vs": [[12, "قد أجهدت نفسي بمتاعبها ولم تتطهر من كثرة زنجارها فصار مآله للنار."]]}, {"l": "Eze 24:13", "n": "", "vs": [[13, "في قذارتك رذيلة لأني سعيت لتطهيرك، فلم تطهري ولن تطهري من نجاستك حتى أصب عليك غضبي."]]}], "kwAr": "رجسها", "noteAr": ""}, {"kw": "she remembereth", "raw": "Deu_32:29; Isa_47:7; Jer_5:31; 1Pe_4:17", "note": "", "refs": [{"l": "Deu 32:29", "n": "", "vs": [[29, "لو عقلوا لفطنوا لمآلهم وتأملوا في مصيرهم،"]]}, {"l": "Isa 47:7", "n": "", "vs": [[7, "وقلت: سأظل السيدة إلى الأبد. لذلك لم تفكري بهذه الأمور في نفسك ولا تأملت بما تؤول إليه."]]}, {"l": "Jer 5:31", "n": "", "vs": [[31, "فالأنبياء يتنبأون زورا، والكهنة يتصرفون بمقتضى أحكامهم، وشعبي أحب مثل هذا. ولكن ماذا تصنعون في نهاية المطاف؟»"]]}, {"l": "1Pe 4:17", "n": "", "vs": [[17, "حقا إن الوقت قد حان ليبتديء القضاء بأهل بيت الله. فإن كان القضاء يبدأ بنا أولا، فما هو مصير الذين لا يؤمنون بإنجيل الله؟"]]}], "kwAr": "لم تذكر آخرتها", "noteAr": ""}, {"kw": "came", "raw": "Lam_1:1, Lam_4:1; Isa_3:8; Jer_13:17, Jer_13:18", "note": "", "refs": [{"l": "Lam 1:1", "n": "", "vs": [[1, "كيف أصبحت المدينة الآهلة بالسكان مهجورة وحيدة؟ صارت كأرملة! هذه التي كانت عظيمة بين الأمم. السيدة بين المدن صارت تحت الجزية!"]]}, {"l": "Lam 4:1", "n": "", "vs": [[1, "كيف اكمد الذهب واكدر لون النضار الخالص؟ كيف تبعثرت حجارة القدس في ناصية كل شارع؟"]]}, {"l": "Isa 3:8", "n": "", "vs": [[8, "قد كبت أورشليم؛ انهارت يهوذا لأنهما أساءتا بالقول والفعل إلى الرب وتمردتا على سلطانه."]]}, {"l": "Jer 13:17", "n": "", "vs": [[17, "وإن لم تنصتوا فإن نفسي تبكي في الخفاء من أجل كبريائكم، وتذرف عيناي الدموع المريرة، فتسيل العبرات لأن الرب قد سبى شعبه."]]}, {"l": "Jer 13:18", "n": "", "vs": [[18, "قل للملك وللملكة: «تواضعا، وتنازلا عن موضعكما لأن تاج مجدكما قد سقط عن رأسيكما»."]]}], "kwAr": "كان سقوطها رهيبا", "noteAr": ""}, {"kw": "she had", "raw": "Lam_1:2, Lam_1:17, Lam_1:21, Lam_2:13; Ecc_4:1; Isa_40:2, Isa_54:11; Hos_2:14; Joh_11:19", "note": "", "refs": [{"l": "Lam 1:2", "n": "", "vs": [[2, "تبكي بمرارة في الليل، ودموعها تنهمر على خديها. لا معزي لها بين محبيها. غدر بها جميع خلانها وأصبحوا لها أعداء."]]}, {"l": "Lam 1:17", "n": "", "vs": [[17, "تمد صهيون يديها تلتمس معزيا، ولكن على غير طائل. قد أمر الرب أن يكون مضايقو يعقوب هم جيرانه الذين حوله. قد أصبحت أورشليم رجسا بينهم."]]}, {"l": "Lam 1:21", "n": "", "vs": [[21, "قد سمعوا تنهدي فلم يكن من معز لي. جميع أعدائي عرفوا ببليتي فشمتوا بما فعلت بي. أسرع بيوم العقاب الذي توعدت به فيصيروا مثلي."]]}, {"l": "Lam 2:13", "n": "", "vs": [[13, "بماذا أنذرك وبأي شيء أشبهك ياابنة أورشليم؟ بماذا أقارنك فأعزيك أيتها العذراء ابنة صهيون؟ إن خرابك عظيم كالبحر، فمن ذا يبرئك؟"]]}, {"l": "Ecc 4:1", "n": "", "vs": [[1, "ثم تأملت حولي فرأيت جميع المظالم التي ترتكب تحت الشمس. شهدت دموع المظلومين الذين لا معزي لهم، أما ظالموهم فيتمتعون بالقوة، غير أن المظلومين لا معزي لهم."]]}, {"l": "Isa 40:2", "n": "", "vs": [[2, "طيبوا خاطر أورشليم وبلغوها أن أيام محنتها قد انتهت، وإثمها قد غفر، وتلقت من يد الرب ضعفين عن جميع ما ارتكبته من خطايا»."]]}, {"l": "Isa 54:11", "n": "", "vs": [[11, "أيتها المنكوبة وغير المتعزية، التي اقتلعتها العاصفة، ها أنا أبني بالأثمد حجارتك، وأرسي أساساتك بالياقوت الأزرق،"]]}, {"l": "Hos 2:14", "n": "", "vs": [[14, "لهذا، ها أنا أتملقها وآخذها إلى الصحراء وأخاطبها بحنان،"]]}, {"l": "Joh 11:19", "n": "", "vs": [[19, "وكان كثيرون من اليهود قد توافدوا إلى مرثا ومريم يعزونهما عن أخيهما."]]}], "kwAr": "ولا معزي لها", "noteAr": ""}, {"kw": "behold", "raw": "Exo_3:7, Exo_3:17, Exo_4:31; Deu_26:7; 1Sa_1:11; 2Sa_16:12; 2Ki_14:26; Neh_9:32; Psa_25:18, Psa_119:153; Dan_9:17-19", "note": "", "refs": [{"l": "Exo 3:7", "n": "", "vs": [[7, "فقال الرب: «قد شهدت مذلة شعبي الذي في مصر وسمعت صراخهم من جراء عتو مسخريهم وأدركت معاناتهم،"]]}, {"l": "Exo 3:17", "n": "", "vs": [[17, "وها أنا قد وعدت أن أخرجكم من ضيقة مصر إلى أرض الكنعانيين والحثيين والأموريين والفرزيين والحويين واليبوسيين، هذه الأرض التي تفيض لبنا وعسلا،"]]}, {"l": "Exo 4:31", "n": "", "vs": [[31, "فآمن الشعب. وعندما سمعوا أن الله قد افتقدهم ونظر إلى مذلتهم انحنوا ساجدين."]]}, {"l": "Deu 26:7", "n": "", "vs": [[7, "فصرخنا إلى الرب إله آبائنا، فاستجاب لنا ورأى بؤسنا وتعبنا وضيقنا،"]]}, {"l": "1Sa 1:11", "n": "", "vs": [[11, "ونذرت نذرا للرب قائلة: «يارب الجنود، إن عطفت على مذلة أمتك، وذكرتني ولم تنسني، بل وهبت أمتك ذرية، فإنني أعطيه للرب كل أيام حياته، ولن أحلق رأسه»."]]}, {"l": "2Sa 16:12", "n": "", "vs": [[12, "لعل الرب ينظر إلى مذلتي، ويكافئني خيرا عوض شتائمه في هذا اليوم»."]]}, {"l": "2Ki 14:26", "n": "", "vs": [[26, "لأن الرب رأى ما يعانيه الإسرائيليون من عبيد وأحرار من ضيق أليم مرير. ولم يكن لهم من معين."]]}, {"l": "Neh 9:32", "n": "", "vs": [[32, "والآن ياإلهنا، أيها الإله العظيم الجبار المرهوب حافظ العهد ومغدق الرحمة، لا تستصغر كل المشقات التي أصابتنا نحن وملوكنا ورؤساءنا وكهنتنا وأنبياءنا وآباءنا وكل شعبك، منذ أيام ملوك أشور إلى هذا اليوم،"]]}, {"l": "Psa 25:18", "n": "", "vs": [[18, "انظر إلى مذلتي ومعاناتي، واصفح عن جميع خطاياي."]]}, {"l": "Psa 119:153", "n": "", "vs": [[153, "انظر إلى مذلتي وأنقذني، لأني لم أنس شريعتك."]]}, {"l": "Dan 9:17-19", "n": "", "vs": [[17, "فأنصت الآن ياإلهنا إلى صلاة عبدك وابتهالاته، وأضيء بوجهك على هيكلك المتهدم، من أجل ذاتك."], [18, "أرهف أذنك ياإلهي واستمع، وافتح عينيك وشاهد خرائبنا والمدينة التي دعي اسمك عليها، فإننا لا من أجل بر فينا نرفع تضرعاتنا إليك، بل بفضل مراحمك العظيمة."], [19, "فاستمع أيها السيد واغفر. أصغ أيها السيد وتصرف ولا تبطىء من أجل نفسك ياإلهي، لأن اسمك دعي على مدينتك وعلى شعبك»."]]}], "kwAr": "انظر يارب", "noteAr": ""}, {"kw": "for", "raw": "Deu_32:27; Psa_74:8, Psa_74:9, Psa_74:22, Psa_74:23, Psa_140:8; Isa_37:4, Isa_37:17, Isa_37:23, Isa_37:29; Jer_48:26; Jer_50:29; Zep_2:10; 2Th_2:4-8", "note": "", "refs": [{"l": "Deu 32:27", "n": "", "vs": [[27, "لولا خوفي من تبجح العدو، إذ يظنون قائلين: إن يدنا قد عظمت، وليس ما جرى هو من فعل الرب."]]}, {"l": "Psa 74:8", "n": "", "vs": [[8, "قالوا في أنفسهم: لنبدهم جميعا. وأحرقوا كل محافل الله في البلاد."]]}, {"l": "Psa 74:9", "n": "", "vs": [[9, "لم نعد نشهد رموز عبادتنا، ولم يبق نبي بعد، وليس بيننا من يعرف متى تكون خاتمة الأمر."]]}, {"l": "Psa 74:22", "n": "", "vs": [[22, "قم ياالله ودافع عن دعواك. اذكر كيف يعيرك الجاهل طول النهار."]]}, {"l": "Psa 74:23", "n": "", "vs": [[23, "لا تنس أصوات خصومك، فإن ضجيج الثائرين عليك يتصاعد دائما."]]}, {"l": "Psa 140:8", "n": "", "vs": [[8, "لا تحقق يارب رغبات الأشرار، ولا تنجح مكيدتهم لئلا يستكبروا."]]}, {"l": "Isa 37:4", "n": "", "vs": [[4, "لعل الرب إلهك قد سمع وعيد ربشاقى الذي أوفده سيده ملك أشور ليهين الإله الحي، فيعاقبه الرب إلهك على ما صدر منه من تعيير، فصل من أجل البقية الناجية»."]]}, {"l": "Isa 37:17", "n": "", "vs": [[17, "أرهف يارب أذنيك واصغ. افتح يارب عينيك وانظر، واسمع كل تهديدات سنحاريب التي بعث بها ليعير الله الحي."]]}, {"l": "Isa 37:23", "n": "", "vs": [[23, "من عيرت وجدفت؟ وعلى من رفعت صوتك وشمخت بعينيك زهوا؟ أعلى قدوس إسرائيل؟"]]}, {"l": "Isa 37:29", "n": "", "vs": [[29, "ولأن ثورتك علي وعجرفتك قد بلغتا مسامعي، فإني سأشكمك بخزامتي في أنفك، وأضع لجامي في فمك، وأعيدك في نفس الطريق الذي أقبلت منه."]]}, {"l": "Jer 48:26", "n": "", "vs": [[26, "أسكروه حتى يتمرغ في قيئه، ويصبح مهزأة، لأنه تغطرس على الرب."]]}, {"l": "Jer 50:29", "n": "", "vs": [[29, "استدعوا إلى بابل رماة السهام، جميع موتري القسي. عسكروا حولها فلا يفلت منها أحد. جازوها بمقتضى أعمالها، واصنعوا بها كما صنعت بكم، لأنها بغت على الرب قدوس إسرائيل."]]}, {"l": "Zep 2:10", "n": "", "vs": [[10, "هذا ما يجنونه لقاء تشامخهم، لأنهم احتقروا وتباهوا على شعب الرب القدير."]]}, {"l": "2Th 2:4-8", "n": "", "vs": [[4, "الذي يتحدى كل ما يدعى إلها أو معبودا، ويعاديه مترفعا عليه. بل إنه أيضا يتخذ من هيكل الله مقرا له، محاولا أن يبرهن أنه إله."], [5, "ألا تذكرون أني كثيرا ما قلت لكم هذا عندما كنت عندكم؟"], [6, "وأنتم الآن تعرفون ما الذي يحتجزه حتى لا يظهر إلا في الوقت المعين له."], [7, "فإن التمرد الآن يعمل خفية كأنه سر. ولكن فقط إلى أن يرفع من الوسط ذاك الذي يحتجز المتمرد."], [8, "عندئذ سيظهر الإنسان المتمرد ظهورا جليا فيبيده الرب يسوع بنفخة فمه ويلاشيه ببهاء ظهوره عند عودته."]]}], "kwAr": "لأن العدو قد انتصر", "noteAr": ""}], "arS": [["قد علق ", []], ["رجسها", ["H2932"]], [" ", []], ["بذيولها", ["H7757"]], [". ", []], ["لم", ["H3808"]], [" ", []], ["تذكر", ["H2142"]], [" ", []], ["آخرتها", ["H319"]], [" لهذا كان ", []], ["سقوطها", ["H3381"]], [" ", []], ["رهيبا", ["H6382"]], ["، ", []], ["ولا", ["H369"]], [" ", []], ["معزي", ["H5162"]], [" لها. ", []], ["انظر", ["H7200"]], [" ", []], ["يارب", ["H3068"]], [" إلى ", []], ["شقائي", ["H6040"]], [" ", []], ["لأن", ["H3588"]], [" ", []], ["العدو", ["H341"]], [" قد ", []], ["انتصر", ["H1431"]], [".", []]]}, {"c": 1, "v": 10, "text": "امتدت يد العدو إلى كل ذخائرها، وأبصرت الأمم ينتهكون حرمة مقادسها. هؤلاء الذين حظرت عليهم أن يدخلوا في جماعتك.", "groups": [{"kw": "spread", "raw": "Lam_1:7; Isa_5:13, Isa_5:14; Jer_15:13, Jer_20:5, Jer_52:17-20", "note": "", "refs": [{"l": "Lam 1:7", "n": "", "vs": [[7, "تذكرت أورشليم في أيام شقائها ومحنتها جميع ما كانت تتمتع به من مشتهيات في حقبها الغابرة. عندما وقع شعبها في قبضة العدو لم يكن لها مسعف، رآها العدو صريعة وسخر لهلاكها."]]}, {"l": "Isa 5:13", "n": "", "vs": [[13, "لذلك يسبى شعبي لأنهم لا يعرفون، ويموت عظماؤهم جوعا، ويهلك العامة ظمأ."]]}, {"l": "Isa 5:14", "n": "", "vs": [[14, "لهذا وسعت الهاوية أحشاءها وفغرت شدقها إلى ما لا نهاية، لينحدر فيها شرفاء أورشليم وجماهيرها وعجيجها وكل طرب فيها"]]}, {"l": "Jer 15:13", "n": "", "vs": [[13, "سأجعل ثروتك وكنوزك نهبا بلا ثمن بسبب كل خطاياك في جميع أرضك."]]}, {"l": "Jer 20:5", "n": "", "vs": [[5, "وأدفع كل ثروة هذه المدينة، وكل نتاجها ونفائسها، وكل كنوز ملوك يهوذا إلى يد أعدائها، فيغنمونها ويستولون عليها وينقلونها معهم إلى بابل."]]}, {"l": "Jer 52:17-20", "n": "", "vs": [[17, "وحطم الكلدانيون أعمدة النحاس في هيكل الرب، والقواعد والبركة النحاسية القائمة فيه، ونقلوا كل نحاسها إلى بابل."], [18, "واستولوا أيضا على القدور والرفوش والمجارف والمناضح والصحون وكل آنية النحاس التي كانت تستخدم في الهيكل."], [19, "كما أخذ رئيس الشرطة الطسوس والمجامر والمناضح والقدور والمنائر والصحون والأقداح الذهبية والفضية."], [20, "كذلك استولى على العمودين والبركة والاثني عشر ثورا من نحاس القائمة تحت القواعد التي صنعها الملك سليمان لهيكل الرب، فكان النحاس لكثرته يفوق كل وزن."]]}], "kwAr": "امتدت يد العدو", "noteAr": ""}, {"kw": "pleasant", "raw": "or, desirable, Lam_1:7", "note": "or, desirable, Lam_1:7", "refs": [{"l": "Lam 1:7", "n": "", "vs": [[7, "تذكرت أورشليم في أيام شقائها ومحنتها جميع ما كانت تتمتع به من مشتهيات في حقبها الغابرة. عندما وقع شعبها في قبضة العدو لم يكن لها مسعف، رآها العدو صريعة وسخر لهلاكها."]]}], "kwAr": "ذخائرها", "noteAr": "أو: مشتهيات. انظر مرا 1: 7"}, {"kw": "seen", "raw": "Psa_74:4-8, Psa_79:1-7; Isa_63:18, Isa_64:10,Isa_64:11; Jer_51:51, Jer_52:13; Eze_7:22; Eze_9:7", "note": "", "refs": [{"l": "Psa 74:4-8", "n": "", "vs": [[4, "إن خصومك يزمجرون في وسط محفلك، وينصبون أصنامهم شارات للنصر."], [5, "يظهر العدو كأنه يهوي بالفؤوس على الأشجار الكثيفة."], [6, "هدموا منقوشاته كلها بالمطارق والمعاول."], [7, "أضرموا النار في مقدسك، ودنسوه إذ قوضوا مقر اسمك إلى الأرض."], [8, "قالوا في أنفسهم: لنبدهم جميعا. وأحرقوا كل محافل الله في البلاد."]]}, {"l": "Psa 79:1-7", "n": "", "vs": [[1, "ياالله ، إن الأمم قد دخلت ميراثك ونجست هيكلك المقدس وجعلت أورشليم أكواما."], [2, "جعلوا جثث عبيدك مأكلا لطيور السماء، ولحوم قديسيك لوحوش الأرض."], [3, "سفكوا دماءهم كالماء حول أورشليم، وليس هناك من يدفنهم."], [4, "قد صرنا عارا عند جيراننا، ومثار هزء وأضحوكة لمن حولنا."], [5, "إلى متى يدوم هذا يارب؟ أتبقى غاضبا تتقد غيرتك كالنار إلى الأبد؟"], [6, "صب غضبك على الأمم الذين لم يعرفوك، وعلى الممالك التي لم تدع باسمك،"], [7, "فإنهم قد افترسوا يعقوب وقوضوا مسكنه."]]}, {"l": "Isa 63:18", "n": "", "vs": [[18, , []], ["حظرت", ["H6680"]], [" عليهم ", []], ["أن", ["H3588"]], [" ", []], ["يدخلوا", ["H935"]], [" في ", []], ["جماعتك", ["H6951"]], [".", []]]}, {"c": 1, "v": 11, "text": "شعبها كله يتنهد وهو يبحث عن القوت. قد قايضوا ذخائرهم بالطعام لإنعاش النفس الخائرة. (وقالت:) «انظر يارب وتأمل كيف أصبحت محتقرة».", "groups": [{"kw": "seek", "raw": "Lam_1:19, Lam_2:12, Lam_4:4-10; Deu_28:52-57; 2Ki_6:25; Jer_19:9, Jer_38:9, Jer_52:6; Eze_4:15-17, Eze_5:16, Eze_5:17", "note": "", "refs": [{"l": "Lam 1:19", "n": "", "vs": [[19, "دعوت محبي فخدعوني. فني كهنتي وشيوخي في المدينة وهم ينشدون قوتا لإحيا ء نفوسهم."]]}, {"l": "Lam 2:12", "n": "", "vs": [[12, "يقولون لأمهاتهم باكين: «أين الخبز والخمر؟» ثم يغشى عليهم كالجرحى في شوارع المدينة، حين تهرق حياتهم في أحضان أمهاتهم."]]}, {"l": "Lam 4:4-10", "n": "", "vs": [[4, "قد التصق لسان الرضيع بحنكه عطشا، والتمس الأطفال خبزا وليس من يعطيه لهم."], [5, "هلك في الشوارع الذين كانوا يأكلون الطيبات، واحتضن المزابل المتربون على لبس الحرية."], [6, "لأن عقاب إثم ابنة شعبي أعظم من عقاب خطيئة سدوم التي انقلبت في لحظة، من غير أن تمتد إليها يد إنسان."], [7, "كان نبلاؤها أنقى من الثلج وأنصع من اللبن. أجسادهم أكثر حمرة من المرجان، وقاماتاهم كالياقوت العأزرق،"], [8, "فأصبحت صورتهم أكثر سوادا من الفحم، فلم يعرفوا فاي الشوارع. لصقت جلودهم بعظامهم، وصارت جافة كالحطب."], [9, "كان مصير ضحايا السيف أفضل من مصير ضحايا الجوع، الذين اضمحلوا من طعنة عقم الحقل."], [10, "طهت أيدي الأمهات الحانيات أولادهن ليكونوا طعاما لهن في أثناء دمار ابنة شعبي."]]}, {"l": "Deu 28:52-57", "n": "", "vs": [[52, "وتحاصركم في جميع مدنكم حتى تتهدم أسواركم الشامخة الحصينة التي وثقتم بمناعتها في كل مدنكم. فتحاصركم في جميع مدنكم في كل أرضكم التي يهبها الرب إلهكم لكم."], [53, "فتأكلون في أثناء الحصار والضيقة التي يضايقكم بها عدوكم ثمار بطونكم، لحم أبنائكم وبناتكم الذين رزقكم بهم الرب إلهكم."], [54, "فيقسو قلب أكثركم رقة ورأفة على أخيه وامرأته التي في حضنه وسائر أبنائه الأحياء."], [55, "فلا يعطي أحدهم من لحم أبنائه، الذي يأكله، لأنه لم يبق لديه شيء سواه في الحصار والضيقة التي يضايقكم بها عدوكم في جميع مدنكم."], [56, "وكذلك فإن أكثر النساء رقة ورأفة، والتي لنعومتها وترفهها لا تجرؤ على لمس الأرض بباطن قدمها، تبخل على زوجها رجل حضنها وعلى ابنها وابنتها"], [57, "بمشيمتها الساقطة منها، وبأولادها الذين تلدهم، لأنها تنوي أن تأكلهم سرا في أثناء الحصار، في الضيقة التي يضايقكم بها عدوكم في كل مدنكم."]]}, {"l": "2Ki 6:25", "n": "", "vs": [[25, "وإذ طال الحصار، عمت المجاعة السامرة حتى صار رأس الحمار يباع بثمانين قطعة من الفضة، وأوقية زبل الحمام بخمس قطع من الفضة."]]}, {"l": "Jer 19:9", "n": "", "vs": [[9, "وأطعمهم لحوم أبنائهم وبناتهم، ويأكل كل واحد لحم جاره في أثناء الحصار والضيقة التي يضايقهم بها أعداؤهم وطالبو نفوسهم."]]}, {"l": "Jer 38:9", "n": "", "vs": [[9, "«يامولاي الملك، قد أساء هؤلاء الرجال إلى إرميا النبي بما أوقعوه به من شر حين زجوه في الجب. فإنه لابد أن يتعرض للموت من جراء الجوع، إذ لا خبز في المدينة»."]]}, {"l": "Jer 52:6", "n": "", "vs": [[6, "وفي اليوم التاسع من الشهر الرابع استفحل الجوع في المدينة حتى لم يبق طعام لشعب الأرض."]]}, {"l": "Eze 4:15-17", "n": "", "vs": [[15, "فقال: «انظر ها أنا أعطيك بعر البقر لتستعيض به عن براز الإنسان لتصنع عليه خبزك."], [16, "ياابن آدم، ها أنا أبيد مؤونة الخبز في أورشليم، فيأكلون الخبز بالوزن معجونا بالغم، ويشربون الماء بالكيل ممزوجا بالحيرة."], [17, "إذ يعوزهم الخبز والماء، ويلجأ الواحد إلى أخيه وقد اعترتهم الحيرة فيفنون جميعا بإثمهم."]]}, {"l": "Eze 5:16", "n": "", "vs": [[16, "وعندما أرسل عليهم سهام الجوع المميتة التي أعدت للتدمير، السهام التي أرسلتها لخرابكم، عندئذ أزيد من الجوع عليكم وأبيد مؤونة خبزكم،"]]}, {"l": "Eze 5:17", "n": "", "vs": [[17, "وأرسل عليكم المجاعة والوحوش الضارية، فتثكلكم ويعمكم الوباء وسفك الدماء، وأجلب عليكم السيف. أنا الرب قد قضيت»."]]}], "kwAr": "يبحث عن القوت", "noteAr": ""}, {"kw": "relieve the soul", "raw": "Heb. make the soul to come again, 1Sa_30:11, 1Sa_30:12", "note": "Heb. make the soul to come again, 1Sa_30:11, 1Sa_30:12", "refs": [{"l": "1Sa 30:11", "n": "", "vs": [[11, "فصادفوا رجلا مصريا ملقى في الحقل، فأحضروه إلى داود، فقدموا إليه طعاما وماء فأكل وشرب."]]}, {"l": "1Sa 30:12", "n": "", "vs": [[12, "ثم أعطوه قرصا من تين وعنقودين من زبيب. وبعد أن أكلها انتعشت روحه، لأنه لم يكن قد أكل طعاما ولا شرب ماء منذ ثلاثة أيام وثلاث ليال."]]}], "kwAr": "لإنعاش النفس الخائرة", "noteAr": "بالعبرانية: لإرجاع النفس. انظر 1صم 30: 11، 12"}, {"kw": "see", "raw": "Lam_1:9, Lam_1:20, Lam_2:20; Job_40:4; Psa_25:15-19", "note": "", "refs": [{"l": "Lam 1:9", "n": "", "vs": [[9, "قد علق رجسها بذيولها. لم تذكر آخرتها لهذا كان سقوطها رهيبا، ولا معزي لها. انظر يارب إلى شقائي لأن العدو قد انتصر."]]}, {"l": "Lam 1:20", "n": "", "vs": [[20, "انظر يارب فإني في ضيقة. أحشائي جائشة وقلبي متلاطم في داخلي، لأني أكثرت التمرد. ها السيف يثكل في الخارج وفي البيت يسود الموت."]]}, {"l": "Lam 2:20", "n": "", "vs": [[20, "انظر يارب وتأمل! بمن صنعت هذا؟ أعلى النساء أن يأكلن ثمرة بطونهن، وأطفال حضانتهن؟ أيتحتم على الكاهن والنبي أن يقتلا في مقدس الرب؟"]]}, {"l": "Job 40:4", "n": "", "vs": [[4, "«انظر، أنا حقير فبماذا أجيبك؟ ها أنا أضع يدي على فمي"]]}, {"l": "Psa 25:15-19", "n": "", "vs": [[15, "تتجه عيناي دائما نحو الرب، لأنه يحرر رجلي من فخ الشرير."], [16, "التفت نحوي وارحمني، فأنا وحيد ومسكين."], [17, "قد تكاثرت متاعب قلبي، فأنقذني من شدائدي."], [18, "انظر إلى مذلتي ومعاناتي، واصفح عن جميع خطاياي."], [19, "انظر كيف تكاثر علي أعدائي وهم يبغضونني ظلما."]]}], "kwAr": "انظر يارب وتأمل", "noteAr": ""}], "arS": [["شعبها", ["H5971"]], [" ", []], ["كله", ["H3605"]], [" ", []], ["يتنهد", ["H584"]], [" وهو ", []], ["يبحث", ["H1245"]], [" عن ", []], ["القوت", ["H3899"]], [". قد ", []], ["قايضوا", ["H5414"]], [" ", []], ["ذخائرهم", ["H4262"]], [" ", []], ["بالطعام", ["H400"]], [" ", []], ["لإنعاش", ["H7725"]], [" ", []], ["النفس", ["H5315"]], [" الخائرة. (وقالت:) «", []], ["انظر", ["H7200"]], [" ", []], ["يارب", ["H3068"]], [" ", []], ["وتأمل", ["H5027"]], [" كيف ", []], ["أصبحت", ["H1961"]], [" ", []], ["محتقرة", ["H2151"]], ["».", []]]}, {"c": 1, "v": 12, "text": "ألا يعنيكم هذا ياجميع عابري الطريق؟ تأملوا وانظروا، هل من ألم كألمي الذي ابتلاني به الرب في يوم احتدام غضبه؟", "groups": [{"kw": "Is it others, and then an equal dividend made, share and share alike, rather than approve such an arrangement, each would be ready to say, Pray give me my own again. - Henry. Lam_2:13, Lam_4:6-11; Dan_9:12; Mat_24:21; Luk_21:22, Luk_21:23, Luk_23:28-31", "refs": [{"l": "Lam 2:13", "n": "", "vs": [[13, "بماذا أنذرك وبأي شيء أشبهك ياابنة أورشليم؟ بماذا أقارنك فأعزيك أيتها العذراء ابنة صهيون؟ إن خرابك عظيم كالبحر، فمن ذا يبرئك؟"]]}, {"l": "Lam 4:6-11", "n": "", "vs": [[6, "لأن عقاب إثم ابنة شعبي أعظم من عقاب خطيئة سدوم التي انقلبت في لحظة، من غير أن تمتد إليها يد إنسان."], [7, "كان نبلاؤها أنقى من الثلج وأنصع من اللبن. أجسادهم أكثر حمرة من المرجان، وقاماتاهم كالياقوت العأزرق،"], [8, "فأصبحت صورتهم أكثر سوادا من الفحم، فلم يعرفوا فاي الشوارع. لصقت جلودهم بعظامهم، وصارت جافة كالحطب."], [9, "كان مصير ضحايا السيف أفضل من مصير ضحايا الجوع، الذين اضمحلوا من طعنة عقم الحقل."], [10, "طهت أيدي الأمهات الحانيات أولادهن ليكونوا طعاما لهن في أثناء دمار ابنة شعبي."], [11, "نفث الرب كامل سخطه وصب حمو غضبه، وأضرم نارا في صهيون فالتهمت أسسها."]]}, {"l": "Dan 9:12", "n": "", "vs": [[12, "وقد نفذت قضاءك الذي قضيت به علينا وعلى قضاتنا الذين تولوا أمرنا، جالبا علينا وعلى أورشليم شرا عظيما لم يحدث له مثيل تحت السماء."]]}, {"l": "Mat 24:21", "n": "", "vs": [[21, "فسوف تحدث عندئذ ضيقة عظيمة لم يحدث مثلها منذ بدء العالم إلى الآن، ولن يحدث."]]}, {"l": "Luk 21:22", "n": "", "vs": [[22, "فإن هذه الأيام أيام انتقام يتم فيها كل ما قد كتب."]]}, {"l": "Luk 21:23", "n": "", "vs": [[23, "ولكن الويل للحبالى والمرضعات في تلك الأيام، لأن ضيقة عظيمة سوف تقع على الأرض وغضبا شديدا سينزل بهذا الشعب،"]]}, {"l": "Luk 23:28-31", "n": "", "vs": [[28, "فالتفت إليهن يسوع، وقال: «يابنات أورشليم، لا تبكين علي، بل ابكين على أنفسكن وعلى أولادكن!"], [29, "فها إن أياما ستأتي فيها يقول الناس: طوبى للعواقر اللواتي ما حملت بطونهن ولا أرضعت أثداؤهن!"], [30, "عندئذ يقولون للجبال: اسقطي علينا، وللتلال: غطينا!"], [31, "فإن كانوا قد فعلوا هذا بالغصن الأخضر، فماذا يجري لليابس؟»"]]}], "kwAr": "هل من ألم كألمي", "noteAr": "تعظّم الكنيسة في ضيقها هنا بلواها، ومع ذلك لم يكن أنينها أثقل من ضرباتها. وهي تناشد كل المشاهدين: انظروا هل من ألم كألمي. وقد يقال هذا بحق عن الآلام التي قاستها أورشليم قديما؛ لكن المسيحيين يميلون إلى تطبيق هذه الكلمات على أنفسهم بحساسية مفرطة إذا ضاقوا، وأحيانا أكثر مما يبرره السبب. فكل إنسان يشعر بحمله هو أشد الشعور ولا يُقنَع بالتسليم به؛ فكم يصرخون بالكلمات التي نشرحها! ولو أُلقيت متاعبهم في مخزون مشترك مع متاعب غيرهم ثم قُسمت قسمة عادلة، حصة بحصة، لما ارتضوا هذا الترتيب، بل قال كل واحد: أرجو أن تردوا لي ما هو لي. - هنري. انظر مرا 2: 13؛ 4: 6-11؛ دا 9: 12؛ مت 24: 21؛ لو 21: 22، 23؛ 23: 28-31"}], "arS": [["ألا", ["H3808"]], [" يعنيكم هذا ", []], ["ياجميع", ["H3605"]], [" ", []], ["عابري", ["H5674"]], [" ", []], ["الطريق", ["H1870"]], ["؟ ", []], ["تأملوا", ["H7200"]], [" وانظروا، ", []], ["هل", ["H518"]], [" ", []], ["من", ["H834"]], [" ", []], ["ألم", ["H4341"]], [" ", []], ["كألمي", ["H4341"]], [" ", []], ["الذي", ["H834"]], [" ", []], ["ابتلاني", ["H5953", "H3013"]], [" به ", []], ["الرب", ["H3068"]], [" ", []], ["في", ["H413"]], [" ", []], ["يوم", ["H3117"]], [" ", []], ["احتدام", ["H2740"]], [" ", []], ["غضبه", ["H639"]], ["؟", []]]}, {"c": 1, "v": 13, "text": "من العلاء صب نارا في عظامي فسرت فيها. نصب شركا لقدمي فردني إلى الوراء. جعلني أطلالا أئن طول النهار.", "groups": [{"kw": "above", "raw": "Lam_2:3, Lam_2:4; Deu_32:21-25; Job_30:30; Psa_22:14, Psa_31:10, Psa_102:3-5; Nah_1:6; Hab_3:16; 2Th_1:8; Heb_12:29", "note": "", "refs": [{"l": "Lam 2:3", "n": "", "vs": [[3, "بتر في احتدام غضبه كل قوة إسرائيل. رد يمينه إلى الوراء أمام الأعداء، واشتعل مثل نار ملتهبة في إسرائيل، تلتهم كل ما حولها."]]}, {"l": "Lam 2:4", "n": "", "vs": [[4, "وتر قوسه كعدو. نصب يمينه كمبغض. ذبح كعدو كل عزيز في عيوننا. وسكب سخطه كنار على خيمة ابنة صهيون."]]}, {"l": "Deu 32:21-25", "n": "", "vs": [[21, "هيجوا غيرتي بعبادة أوثانهم، وأسخطوني بأصنامهم الباطلة. لذلك سأثير غيرتهم بشعب متوحش، وأغيظهم بأمة حمقاء."], [22, "فها قد أضرم غضبي نارا تحرق حتى الهاوية السفلى، وتأكل الأرض وغلاتها، وتشعل أسس الجبال."], [23, "أكوم عليهم شرورا وأنفذ سهامي فيهم."], [24, "وحين يكونون خائرين من الجوع، منهوكين من الحمى والداء السام، أجعل أنياب الوحوش مع سم زواحف الأرض تنشب فيهم."], [25, "يثكلهم سيف العدو في الطريق، ويستولي عليهم الرعب داخل الخدور، فيهلك الفتى مع الفتاة، والرضيع مع الشيخ."]]}, {"l": "Job 30:30", "n": "", "vs": [[30, "اسود جلدي علي وتقشر، واحترقت عظامي من الحمى"]]}, {"l": "Psa 22:14", "n": "", "vs": [[14, "صارت قوتي كالماء، وانحلت عظامي. صار قلبي كالشمع، وذاب في داخلي."]]}, {"l": "Psa 31:10", "n": "", "vs": [[10, "لأن حياتي قد فنيت بالحزن وسني حياتي بالتنهد. خارت قواي من قصاص إثمي."]]}, {"l": "Psa 102:3-5", "n": "", "vs": [[3, "لأن أيامي قد تبددت كالدخان، وعظامي اضطرمت كالوقيد."], [4, "قلبي منكوب ويابس كالعشب الجاف، حتى غفلت عن أكل طعامي."], [5, "التصقت عظامي بلحمي من جراء أناتي المرتفعة."]]}, {"l": "Nah 1:6", "n": "", "vs": [[6, "من يصمد أمام سخطه؟ من يتحمل فرط اضطرام غضبه؟ ينصب غضبه كالنار وتنحل تحت وطأته الصخور."]]}, {"l": "Hab 3:16", "n": "", "vs": [[16, "سمعت هذا فتولاني الفزع وارتجفت شفتاي من الصوت، وتسرب النخر إلى عظامي، وارتعشت قدماي. ولكن سأنتظر بصبر يوم البلية الذي يحيق بالأمة التي غزتنا."]]}, {"l": "2Th 1:8", "n": "", "vs": [[8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."]]}, {"l": "Heb 12:29", "n": "", "vs": [[29, "متذكرين أن «إلهنا نار آكلة!»"]]}], "kwAr": "من العلاء", "noteAr": ""}, {"kw": "he hath spread", "raw": "Lam_4:17-20; Job_18:8, Job_19:6; Psa_66:11; Eze_12:13, Eze_17:20, Eze_32:3; Hos_7:12", "note": "", "refs": [{"l": "Lam 4:17-20", "n": "", "vs": [[17, "كلت عيوننا من ترقب نصرة باطلة. في أبراجنا انتظرنا معونة أمة لا تخلص."], [18, "تصيد الرجال خطواتنا حتى لا نخطو في شوارعنا. آذنت نهايتنا، وتمت أيامنا وأزفت خاتمتنا."], [19, "كان مطاردونا أسرع من نسور السماء، تعقبونا على الجبال، وتربصوا بنا في الصحراء."], [20, "وقع في حفرهم مصدر حياتنا، الملك الذي اختاره الرب، الذي قلنا: في ظله نعيش بين الأمم."]]}, {"l": "Job 18:8", "n": "", "vs": [[8, "لأن قدميه توقعانه في الشرك وتطرحانه في حفرة،"]]}, {"l": "Job 19:6", "n": "", "vs": [[6, "فاعلموا إذا أن الله هو الذي أوقعني في الخطأ ولف أحبولته حولي."]]}, {"l": "Psa 66:11", "n": "", "vs": [[11, "أوقعتنا في الشبكة وألقيت حملا ثقيلا على ظهورنا."]]}, {"l": "Eze 12:13", "n": "", "vs": [[13, "وأبسط شبكتي عليه فيقع في شركي، وأحضره إلى بابل إلى أرض الكلدانيين، ولكن لن يراها، هناك يموت."]]}, {"l": "Eze 17:20", "n": "", "vs": [[20, "وأنشر شبكتي عليه فيقع في شركي، وأحضره إلى بابل وأحاكمه هناك على ما ارتكبه من تعد علي."]]}, {"l": "Eze 32:3", "n": "", "vs": [[3, "لذلك ها أنا أنشر عليك شبكتي مع أقوام شعوب غفيرة فيصعدونك وأنت عالق فيها."]]}, {"l": "Hos 7:12", "n": "", "vs": [[12, "إذا ذهبوا أبسط عليهم شبكتي وأطرحهم كطيور السماء، وأعاقبهم بمقتضى شرورهم."]]}], "kwAr": "نصب شركا", "noteAr": ""}, {"kw": "he hath turned", "raw": "Psa_35:4, Psa_70:2, Psa_70:3, Psa_129:5; Isa_42:17", "note": "", "refs": [{"l": "Psa 35:4", "n": "", "vs": [[4, "ليخز وليخجل الساعون إلى قتلي. لينهزم ويخجل المتواطئون على أذيتي."]]}, {"l": "Psa 70:2", "n": "", "vs": [[2, "ليخز ويخجل الساعون إلى قتلي. ليرتد ويخجل المغتبطون بأذيتي."]]}, {"l": "Psa 70:3", "n": "", "vs": [[3, "ليرجع الساخرون مني مجللين بالعار."]]}, {"l": "Psa 129:5", "n": "", "vs": [[5, "فليخز وليدبر جميع مبغضي صهيون."]]}, {"l": "Isa 42:17", "n": "", "vs": [[17, "أما المتوكلون على الأصنام، القائلون للأوثان: «أنتم آلهتنا» فإنهم يدبرون مجللين بالخزي."]]}], "kwAr": "فردني", "noteAr": ""}, {"kw": "desolate", "raw": "Lam_1:22, Lam_5:17; Deu_28:65; Jer_4:19-29", "note": "", "refs": [{"l": "Lam 1:22", "n": "", "vs": [[22, "ليأت كل شرهم أمامك فتعاقبهم كما عاقبتني على كل ذنوبي، لأن تنهداتي كثيرة وقلبي مغشي عليه."]]}, {"l": "Lam 5:17", "n": "", "vs": [[17, "لهذا غشي على قلوبنا، وأظلمت عيوننا."]]}, {"l": "Deu 28:65", "n": "", "vs": [[65, "ولا تجدون بين تلك الأمم اطمئنانا ولا مقرا لقدم، بل يعطيكم الرب قلبا هلعا، وعيونا أوهنها الترقب، ونفوسا يائسة."]]}, {"l": "Jer 4:19-29", "n": "", "vs": [[19, "لشد ما أتعذب! لشد ما أتعذب! قلبي يتلوى ألما. فؤادي يئن في داخلي فلا أستطيع الصمت، لأني سمعت دوي البوق وصيحات القتال."], [20, "كارثة في أعقاب كارثة، والأرض قاطبة قد استحالت خرابا، فتهدمت في لحظة خيامي، وبيوتي تدمرت بغتة."], [21, "إلى متى أظل أرى راية المعركة، وأسمع دوي البوق؟"], [22, "إن قومي حمقى لا يعرفونني. هم أبناء أغبياء مجردون من الفهم، حاذقون في ارتكاب الشر، وجهلاء في صنع الخير»."], [23, "تأملت الأرض فإذا هي خربة خاوية، وتطلعت إلى السماء فإذا هي مظلمة."], [24, "نظرت إلى الجبال وإذا بها ترتجف، وإلى الآكام وإذا بها تتقلقل."], [25, "تلفت حولي فلم أجد إنسانا، وإذا كل الطيور قد هربت."], [26, "نظرت وإذا بالأرض الخصيبة قد تحولت إلى بر ية، وأصبحت جميع مدنها أطلالا أمام الرب وأمام غضبه المحتدم."], [27, "وهذا ما يقوله الرب: «ستحيق الوحشة بكل الأرض، ولكني لن أفنيها."], [28, "فمن أجل هذا تنوح الأرض وتظلم السماوات من فوق، لأني قد نطقت بقضائي. وهكذا قررت، لذلك لا أندم ولا أرجع عن عزمي."], [29, "من جلبة الفارس ورامي السهام يهرب أهل المدن، ويوغلون في الغابات ويتسلقون الصخور. قد أصبحت المدن جميعها مهجورة لا يقيم فيها إنسان."]]}], "kwAr": "جعلني أطلالا", "noteAr": ""}], "arS": [["من", ["H4480"]], [" ", []], ["العلاء", ["H4791"]], [" ", []], ["صب", ["H7971"]], [" ", []], ["نارا", ["H784"]], [" في ", []], ["عظامي", ["H6106"]], [" ", []], ["فسرت", ["H7287"]], [" فيها. ", []], ["نصب", ["H6566"]], [" ", []], ["شركا", ["H7568"]], [" ", []], ["لقدمي", ["H7272"]], [" ", []], ["فردني", ["H7725"]], [" إلى ", []], ["الوراء", ["H268"]], [". ", []], ["جعلني", ["H5414"]], [" ", []], ["أطلالا", ["H8074"]], [" ", []], ["أئن", ["H1739"]], [" ", []], ["طول", ["H3605"]], [" ", []], ["النهار", ["H3117"]], [".", []]]}, {"c": 1, "v": 14, "text": "شد معاصي إلى نير، وبيده حبكها، فناء بها عنقي. أوهن الرب قواي وأسلمني إلى يد لا طاقة لي على مقاومتها.", "groups": [{"kw": "yoke", "raw": "Deu_28:48; Pro_5:22; Isa_14:25, Isa_47:6; Jer_27:8, Jer_27:12, Jer_28:14", "note": "", "refs": [{"l": "Deu 28:48", "n": "", "vs": [[48, "فإنكم تصبحون عبيدا لأعدائكم الذين يرسلهم الرب عليكم في أحوال الجوع والعطش والعري والفاقة، ويضع نير حديد على أعناقكم حتى يهلككم."]]}, {"l": "Pro 5:22", "n": "", "vs": [[22, "آثام المنافق تتصيده، ويعلق بحبال خطيئته."]]}, {"l": "Isa 14:25", "n": "", "vs": [[25, "أن أحطم أشور في أرضي وأطأه على جبالي، فيلقي عنهم نيره، ويزول عن كاهلهم حمله."]]}, {"l": "Isa 47:6", "n": "", "vs": [[6, "قد سخطت على شعبي ونجست ميراثي. أسلمتهم إلى يديك، فلم تبدي نحوهم رحمة بل أرهقت الشيخ بنيرك الثقيل جدا."]]}, {"l": "Jer 27:8", "n": "", "vs": [[8, "ولكن إن أبت أية أمة أو مملكة الاستعباد لنبوخذناصر ملك بابل، ورفضت أن تضع عنقها تحت نيره، فإني أعاقبها بالسيف والجوع والوباء إلى أن أبيدهم بيده، يقول الرب."]]}, {"l": "Jer 27:12", "n": "", "vs": [[12, "فبلغت صدقيا ملك يهوذا جميع هذا الكلام وقلت: «اخضعوا لملك بابل واخدموه وشعبه فتحيوا."]]}, {"l": "Jer 28:14", "n": "", "vs": [[14, "لأن هذا ما يعلنه الرب القدير إله إسرائيل: إني قد وضعت نيرا من حديد على أعناق جميع الأمم لتستعبد لنبوخذناصر ملك بابل، فيكونون له عبيدا وقد عهدت إليه أيضا بحيوان الحقل»."]]}], "kwAr": "نير", "noteAr": ""}, {"kw": "delivered", "raw": "Jer_25:9, Jer_34:20,Jer_34:21, Jer_37:17, Jer_39:1-9; Eze_11:9, Eze_21:31, Eze_23:28, Eze_25:4, Eze_25:7; Hos_5:14", "note": "", "refs": [{"l": "Jer 25:9", "n": "", "vs": [[9, "فها أنا أجند جميع قبائل الشمال بقيادة نبوخذناصر عبدي، وآتي بها إلى هذه الأرض فيجتاحونها ويهلكون جميع سكانها مع سائر الأمم المحيطة بها، وأجعلهم مثار دهشة وصفير، وخرائب أبدية."]]}, {"l": "Jer 34:20", "n": "", "vs": [[20, "إلى يد أعدائهم وطالبي نفوسهم، فتصبح جثثهم مأكلا لجوارح السماء ولوحوش الأرض."]]}, {"l": "Jer 34:21", "n": "", "vs": [[21, "وأدفع صدقيا ملك يهوذا ورؤساءه إلى يد أعدائهم وطالبي نفوسهم، وإلى يد جيش ملك بابل الذين انسحبوا من محاصرتكم."]]}, {"l": "Jer 37:17", "n": "", "vs": [[17, "ثم استدعاه الملك صدقيا، وسأله في قصره سرا: «هل عندك كلمة وحي من عند الرب؟» فأجابه إرميا: «نعم». ثم أضاف: «إنك ستسلم إلى يد ملك بابل»."]]}, {"l": "Jer 39:1-9", "n": "", "vs": [[1, "وفي الشهر العاشر من السنة التاسعة من حكم صدقيا ملك يهوذا، زحف الملك نبوخذناصر وكل جيشه على أورشليم وحاصرها."], [2, "وفي اليوم التاسع من الشهر الرابع من السنة الحادية عشرة من حكم صدقيا فتحت ثغرة في سور المدينة."], [3, "وما لبث أن دخل كل رؤساء ملك بابل وجلسوا في الباب الأوسط وهم: نرجل شراصر، وسمجر نبو، وسرسخيم رئيس الخصيان، ونرجل شراصر رئيس المجوس، وسائر قواد ملك بابل."], [4, "وعندما شاهدهم صدقيا ملك يهوذا وكل المحاربين فروا هاربين من المدينة ليلا عن طريق جنة الملك، من الباب القائم بين السورين، واتجهوا نحو العربة."], [5, "فتعقبهم جيش الكلدانيين، فأدركوا صدقيا في سهل أريحا، فقبضوا عليه وقادوه إلى نبوخذناصر ملك بابل في ربلة في أرض حماة، فأصدر عليه حكمه."], [6, "وقتل ملك بابل أبناء صدقيا في ربلة على مرأى منه كما قتل سائر أشراف يهوذا."], [7, "وفقأ عيني صدقيا وقيده بسلاسل من نحاس ليأخذه أسيرا إلى بابل."], [8, "وأحرق الكلدانيون قصر الملك وبيوت الشعب ونقضوا أسوار أورشليم."], [9, "وسبى نبوزرادان رئيس شرطة بابل بقية الشعب الذي بقي في المدينة، وكل من لجأ إليه."]]}, {"l": "Eze 11:9", "n": "", "vs": [[9, "وأخرجكم من وسط المدينة وأسلمكم إلى قبضة أعدائكم، وأنفذ فيكم أحكاما،"]]}, {"l": "Eze 21:31", "n": "", "vs": [[31, "وأصب عليك غضبي، وأنفخ عليك بنار غيظي وأسلمك لقبضة رجال أفظاظ متمرسين في التدمير."]]}, {"l": "Eze 23:28", "n": "", "vs": [[28, "ها أنا أسلمك إلى يد الذين كرهتهم وإلى أيدي الذين جفتهم نفسك."]]}, {"l": "Eze 25:4", "n": "", "vs": [[4, "أسلمك للبدو وأبناء المشرق، فتصيرين ملكا لهم فينصبون مضاربهم فيك، ويقيمون مساكنهم فوق أرضك. هم يلتهمون غلتك، ويشربون لبنك."]]}, {"l": "Eze 25:7", "n": "", "vs": [[7, "لذلك ها أنا أثقل يدي عليك، وأسلمك غنيمة للأمم، وأستأصلك من بين الشعوب، وأفنيك من بين البلدان، وأدمرك، فتدرك أني أنا الرب."]]}, {"l": "Hos 5:14", "n": "", "vs": [[14, "فإني سأكون كالأسد المفترس لإسرائيل، وكالشبل لأبناء يهوذا. أفترس وأمضي. أخطف ولا من منقذ."]]}], "kwAr": "أسلمني", "noteAr": ""}], "arS": [["شد", ["H8244"]], [" ", []], ["معاصي", ["H6588"]], [" ", []], ["إلى", ["H5921"]], [" ", []], ["نير", ["H5923"]], ["، ", []], ["وبيده", ["H3027"]], [" ", []], ["حبكها", ["H8276"]], ["، ", []], ["فناء", ["H5927"]], [" بها ", []], ["عنقي", ["H6677"]], [". ", []], ["أوهن", ["H3782"]], [" ", []], ["الرب", ["H136"]], [" ", []], ["قواي", ["H3581"]], [" وأسلمني إلى ", []], ["يد", ["H3027"]], [" ", []], ["لا", ["H3808"]], [" ", []], ["طاقة", ["H3201"]], [" لي على ", []], ["مقاومتها", ["H6965"]], [".", []]]}, {"c": 1, "v": 15, "text": "بدد الرب جميع جبابرتي في وسطي، وألب علي حشدا من أعدائي ليسحقوا شباني. داس الرب العذراء بنت صهيون كما يداس العنب في المعصرة.", "groups": [{"kw": "trodden", "raw": "2Ki_9:33, 2Ki_24:14-16, 2Ki_25:4-7; Psa_119:118; Isa_5:5, Isa_28:18; Jer_50:26 *marg. Dan_3:13; Mic_7:10; Mal_4:3; Luk_21:24; Heb_10:29", "note": "", "refs": [{"l": "2Ki 9:33", "n": "", "vs": [[33, "فقال: «اطرحوها». فألقوا بها من الكوة فتناثر بعض دمها على الجدار وعلى الخيل التي داستها بحوافرها."]]}, {"l": "2Ki 24:14-16", "n": "", "vs": [[14, "وسبى نبوخذناصر أهل أورشليم، وكل الرؤساء، وجميع رجال الحرب الأشداء، والخصيان. فكانت جملة المسبيين عشرة آلاف مسبي، كما أخذ الصناع والحدادين، ولم يترك في يهوذا سوى فقراء الشعب المساكين."], [15, "وسبى يهوياكين وأم الملك ونساءه وخصيانه وعظماء البلاد من أورشليم إلى بابل."], [16, "كما ساق سبعة آلاف من المحاربين الأشداء وألفا من الصناع والحدادين إلى بابل،"]]}, {"l": "2Ki 25:4-7", "n": "", "vs": [[4, "وفي تلك الليلة فتح صدقيا ورجاله ثغرة في سور المدينة، وتسلل مع رجاله المحاربين من خلال البوابة القائمة بين السورين نحو حديقة الملك. وكان الكلدانيون محيطين بالمدينة. فتوجه صدقيا ومقاتلوه إلى طريق الصحراء."], [5, "فتعقبت جيوش الكلدانيين الملك، وأدركته في صحراء أريحا، بعد أن تفرقت قواته عنه."], [6, "فأسروا الملك واقتادوه إلى ملك بابل المقيم في ربلة، وحرضوه على القضاء عليه."], [7, "ثم قتلوا أبناء صدقيا على مرأى منه، وقلعوا عينيه، وقيدوه بسلسلتين من نحاس، وساقوه إلى بابل."]]}, {"l": "Psa 119:118", "n": "", "vs": [[118, "احتقرت الضالين عن فرائضك، ومكرهم لا يجديهم نفعا."]]}, {"l": "Isa 5:5", "n": "", "vs": [[5, "وا لآن أخبركم ما أصنع بكرمي: سأزيل سياجه فيصبح مرعى ماشية، وأهدم سوره فيضحى مداس أقدام،"]]}, {"l": "Isa 28:18", "n": "", "vs": [[18, "عندئد يبطل عهدكم مع الموت، ويلغى ميثاقكم مع الهاوية ويدوسكم أعداؤكم عند اقتحامهم بلادكم."]]}, {"l": "Jer 50:26", "n": "*marg.", "vs": [[26, "ازحفوا عليها من أقاصي الأرض، وافتحوا أهراءها، وكوموها أعراما واقضوا عليها قاطبة ولا تتركوا منها بقية."]]}, {"l": "Dan 3:13", "n": "", "vs": [[13, "حينئذ أمر نبوخذناصر باحتدام غضب وغيظ أن يؤتى بشدرخ وميشخ وعبدنغو فأحضروهم أمام الملك."]]}, {"l": "Mic 7:10", "n": "", "vs": [[10, "عندئذ ترى ذلك عدوتي فيعتريها الخزي إذ قالت لي: «أين هو الرب إلهك؟» ستشهدها عيناي تداس كطين الشوارع والأزقة."]]}, {"l": "Mal 4:3", "n": "", "vs": [[3, "وتطأون الأشرار، إذ يكونون رمادا تحت بطون أقدامكم، في اليوم الذي أجري فيه أعمالي، يقول الرب القدير."]]}, {"l": "Luk 21:24", "n": "", "vs": [[24, "فيسقطون بحد السيف ويساقون أسرى إلى جميع الأمم، وتبقى أورشليم تدوسها الأمم إلى أن تكتمل أزمنة الأمم."]]}, {"l": "Heb 10:29", "n": "", "vs": [[29, "ففي ظنكم، كم يكون أشد كثيرا ذلك العقاب الذي يستحقه من يدوس ابن الله، إذ يعتبر أن دم العهد، الذي يتقدس به، هو دم نجس، وبذلك يهين روح النعمة؟"]]}], "kwAr": "بدد الرب", "noteAr": ""}, {"kw": "crush", "raw": "Lam_3:34; Deu_28:33; Jdg_10:8 *marg. Jer_51:34", "note": "", "refs": [{"l": "Lam 3:34", "n": "", "vs": [[34, "ولا أن يسحق أسرى الأرض تحت الأقدام،"]]}, {"l": "Deu 28:33", "n": "", "vs": [[33, "محصول أرضك وثمر تعبك يأكله شعب غريب عنك، ولا تكون سوى مظلوم مسحوق دائما."]]}, {"l": "Jdg 10:8", "n": "*marg.", "vs": [[8, "مدة ثماني عشرة سنة، فساموا الإسرائيليين المقيمين في أرض الأموريين في جلعاد. شرقي نهر الأردن، سوء العذاب"]]}, {"l": "Jer 51:34", "n": "", "vs": [[34, "«يقول المسبيون: قد افترسنا نبوخذناصر ملك بابل وسحقنا وجعلنا إناء فارغا. ابتلعنا كتنين، وملأ جوفه من أطايبنا، ثم لفظنا من فمه."]]}], "kwAr": "ليسحقوا شباني", "noteAr": ""}, {"kw": "the virgin", "raw": "etc. or, the winepress of the virgin, etc. Jer_14:17", "note": "etc. or, the winepress of the virgin, etc. Jer_14:17", "refs": [{"l": "Jer 14:17", "n": "", "vs": [[17, "وقل لهم هذا الكلام: «لتذرف عيناي دموعا ليلا ونهارا، ولا تكفا أبدا لأن أورشليم سحقت سحقا عظيما بضربة أليمة جدا."]]}], "kwAr": "العذراء بنت صهيون", "noteAr": "إلخ، أو: معصرة العذراء، إلخ. انظر إر 14: 17"}, {"kw": "as in", "raw": "Isa_63:3; Rev_14:19, Rev_14:20, Rev_19:15", "note": "", "refs": [{"l": "Isa 63:3", "n": "", "vs": [[3, "لقد دست المعصرة وحدي، ولم يكن معي أحد من الشعوب. قد دستهم في سخطي ووطئتهم في غيظي، فتناثر دمهم على ردائي ولطخت ثيابي."]]}, {"l": "Rev 14:19", "n": "", "vs": [[19, "فألقى الملاك منجله إلى الأرض وقطف العناقيد وألقاها في معصرة غضب الله العظمى،"]]}, {"l": "Rev 14:20", "n": "", "vs": [[20, "فديست المعصرة بالأرجل خارج المدينة، فانبثق منها الدم وجرى أنهارا حتى إلى لجم الخيل، مسافة ثلثمائة وعشرين كيلومترا."]]}, {"l": "Rev 19:15", "n": "", "vs": [[15, "وكان يخرج من فمه سيف حاد ليضرب به الأمم ويحكمهم بعصا من حديد، ويدوسهم في معصرة شدة غضب الله القادر على كل شيء."]]}], "kwAr": "كما يداس العنب في المعصرة", "noteAr": ""}], "arS": [["بدد", ["H5541"]], [" ", []], ["الرب", ["H136"]], [" ", []], ["جميع", ["H3605"]], [" ", []], ["جبابرتي", ["H47"]], [" في ", []], ["وسطي", ["H7130"]], ["، ", []], ["وألب", ["H7121"]], [" ", []], ["علي", ["H5921"]], [" ", []], ["حشدا", ["H4150"]], [" من أعدائي ", []], ["ليسحقوا", ["H7665"]], [" ", []], ["شباني", ["H970"]], [". ", []], ["داس", ["H1869"]], [" ", []], ["الرب", ["H136"]], [" ", []], ["العذراء", ["H1330"]], [" ", []], ["بنت", ["H1323"]], [" صهيون كما يداس العنب في ", []], ["المعصرة", ["H1660"]], [".", []]]}, {"c": 1, "v": 16, "text": "على هذه كلها أبكي. عيناي، عيناي تفيضان بالدموع، إذ ابتعد عني كل معز ينعش نفسي. هلك أبنائي لأن العدو قد ظفر.", "groups": [{"kw": "I weep", "raw": "Lam_1:2, Lam_1:9, Lam_2:11, Lam_2:18, Lam_3:48, Lam_3:49; Psa_119:136; Jer_9:1, Jer_9:10, Jer_13:17, Jer_14:17; Luk_19:41-44; Rom_9:1-3", "note": "", "refs": [{"l": "Lam 1:2", "n": "", "vs": [[2, "تبكي بمرارة في الليل، ودموعها تنهمر على خديها. لا معزي لها بين محبيها. غدر بها جميع خلانها وأصبحوا لها أعداء."]]}, {"l": "Lam 1:9", "n": "", "vs": [[9, "قد علق رجسها بذيولها. لم تذكر آخرتها لهذا كان سقوطها رهيبا، ولا معزي لها. انظر يارب إلى شقائي لأن العدو قد انتصر."]]}, {"l": "Lam 2:11", "n": "", "vs": [[11, "كلت عيناي من البكاء، جاشت أحشائي وأريقت كبدي على الأرض حزنا لدمار ابنة شعبي، لأن الأطفال والرضع غشي عليهم في شوارع المدينة."]]}, {"l": "Lam 2:18", "n": "", "vs": [[18, "استغاثت قلوبهم بالرب. لتجر الدموع، ياأسوار ابنة صهيون، كالنهر ليلا ونهارا. لا تستكيني ولا تكف عيناك عن البكاء."]]}, {"l": "Lam 3:48", "n": "", "vs": [[48, "تفيض عيناي بأنهار مياه على دمار ابنة شعبي."]]}, {"l": "Lam 3:49", "n": "", "vs": [[49, "لن تكف عيناي عن البكاء أبدا،"]]}, {"l": "Psa 119:136", "n": "", "vs": [[136, "فاضت من عيني ينابيع دمع، لأنهم لم يراعوا شريعتك."]]}, {"l": "Jer 9:1", "n": "", "vs": [[1, "ياليت رأسي فيض مياه، وعيني ينبوع دموع، فأبكي نهارا وليلا قتلى بنت شعبي"]]}, {"l": "Jer 9:10", "n": "", "vs": [[10, "سأنتحب وأنوح على الجبال وأندب على مراعي البرية لأنها احترقت وأوحشت، فلا يجتاز بها عابر ولا يتردد فيها صوت القطعان، وقد هجرتها طيور السماء والوحوش."]]}, {"l": "Jer 13:17", "n": "", "vs": [[17, "وإن لم تنصتوا فإن نفسي تبكي في الخفاء من أجل كبريائكم، وتذرف عيناي الدموع المريرة، فتسيل العبرات لأن الرب قد سبى شعبه."]]}, {"l": "Jer 14:17", "n": "", "vs": [[17, "وقل لهم هذا الكلام: «لتذرف عيناي دموعا ليلا ونهارا، ولا تكفا أبدا لأن أورشليم سحقت سحقا عظيما بضربة أليمة جدا."]]}, {"l": "Luk 19:41-44", "n": "", "vs": [[41, "ولما اقترب، ورأى المدينة، بكى عليها،"], [42, "قائلا: «ليتك أنت أيضا، في يومك هذا، عرفت ما فيه سلامك! ولكن ذلك محجوب الآن عن عينيك."], [43, "فستأتي عليك أيام يحاصرك فيها أعداؤك بالمتاريس، ويطبقون عليك، ويشددون عليك الحصار من كل جهة،"], [44, "ويهدمونك على أبنائك الذين فيك، فلا يتركون فيك حجرا فوق حجر: لأنك لم تعرفي وقت افتقاد الله لك»."]]}, {"l": "Rom 9:1-3", "n": "", "vs": [[1, "أقول الحق في المسيح، لست أكذب، وضميري شاهد لي في الروح القدس،"], [2, "إن بي حزنا شديدا، وبقلبي ألم لا ينقطع:"], [3, "فقد كنت أتمنى لو أكون أنا نفسي محروما من المسيح في سبيل إخوتي، بني جنسي حسب الجسد."]]}], "kwAr": "أبكي", "noteAr": ""}, {"kw": "relieve", "raw": "Heb. bring back, Hos_9:12", "note": "Heb. bring back, Hos_9:12", "refs": [{"l": "Hos 9:12", "n": "", "vs": [[12, "وحتى إن أنجبوا أولادا فإني أحرمكم منهم حتى لا يبقى منهم أحد. ويل لكم حين أنصرف عنكم."]]}], "kwAr": "ينعش نفسي", "noteAr": "بالعبرانية: يُرجع. انظر هو 9: 12"}, {"kw": "my children", "raw": "Lam_1:5, Lam_1:6, Lam_2:20-22, Lam_4:2-10; Jer_9:21", "note": "", "refs": [{"l": "Lam 1:5", "n": "", "vs": [[5, "أصبح أعداؤها سادة، ونجح مضايقوها، لأن الرب أشقاها بسبب خطاياها المتكاثرة. قد ذهب أولادها إلى السبي أمام العدو."]]}, {"l": "Lam 1:6", "n": "", "vs": [[6, "تعرت بنت صهيون من كل بهائها، وغدا أشرافها كأيائل شاردة من غير مرعى. فروا بقوة خائرة أمام المطارد."]]}, {"l": "Lam 2:20-22", "n": "", "vs": [[20, "انظر يارب وتأمل! بمن صنعت هذا؟ أعلى النساء أن يأكلن ثمرة بطونهن، وأطفال حضانتهن؟ أيتحتم على الكاهن والنبي أن يقتلا في مقدس الرب؟"], [21, "قد انطرح الصبي والشيوخ في غبار الطرقات. سقط عذاراي وشباني بالسيف. قد قتلتهم في يوم غضبك، ونحرتهم من غير رحمة."], [22, "أنت دعوت، كما في يوم عيد، مروعي المحيطين بي. فلم يفلت ولم ينج أحد في يوم سخطك يارب. قد أفنى عدوي الذين حضنتهم وربيتهم."]]}, {"l": "Lam 4:2-10", "n": "", "vs": [[2, "كيف حسب أبناء صهيون الكرام الموزونون بالذهب النقي، كآنية خزفية من عمل يد الفخاري؟"], [3, "حتى بنات آوى تكشف عن ثديها وترضع أجراءها، أما ابنة شعبي فقاسية كالنعام في الصحراء."], [4, "قد التصق لسان الرضيع بحنكه عطشا، والتمس الأطفال خبزا وليس من يعطيه لهم."], [5, "هلك في الشوارع الذين كانوا يأكلون الطيبات، واحتضن المزابل المتربون على لبس الحرية."], [6, "لأن عقاب إثم ابنة شعبي أعظم من عقاب خطيئة سدوم التي انقلبت في لحظة، من غير أن تمتد إليها يد إنسان."], [7, "كان نبلاؤها أنقى من الثلج وأنصع من اللبن. أجسادهم أكثر حمرة من المرجان، وقاماتاهم كالياقوت العأزرق،"], [8, "فأصبحت صورتهم أكثر سوادا من الفحم، فلم يعرفوا فاي الشوارع. لصقت جلودهم بعظامهم، وصارت جافة كالحطب."], [9, "كان مصير ضحايا السيف أفضل من مصير ضحايا الجوع، الذين اضمحلوا من طعنة عقم الحقل."], [10, "طهت أيدي الأمهات الحانيات أولادهن ليكونوا طعاما لهن في أثناء دمار ابنة شعبي."]]}, {"l": "Jer 9:21", "n": "", "vs": [[21, "فإن الموت قد تسلق إلى كوانا وتسلل إلى قصورنا، فاستأصل الأطفال من الشوارع والشبان من الساحات."]]}], "kwAr": "أبنائي", "noteAr": ""}], "arS": [["على", ["H5921"]], [" ", []], ["هذه", ["H428"]], [" كلها ", []], ["أبكي", ["H1058"]], [". ", []], ["عيناي", ["H5869"]], ["، ", []], ["عيناي", ["H5869"]], [" ", []], ["تفيضان", ["H3381"]], [" ", []], ["بالدموع", ["H4325"]], ["، ", []], ["إذ", ["H3588"]], [" ", []], ["ابتعد", ["H7368"]], [" ", []], ["عني", ["H4480"]], [" كل ", []], ["معز", ["H5162"]], [" ", []], ["ينعش", ["H7725"]], [" ", []], ["نفسي", ["H5315"]], [". ", []], ["هلك", ["H8074"]], [" ", []], ["أبنائي", ["H1121"]], [" ", []], ["لأن", ["H3588"]], [" ", []], ["العدو", ["H341"]], [" قد ", []], ["ظفر", ["H1396"]], [".", []]]}, {"c": 1, "v": 17, "text": "تمد صهيون يديها تلتمس معزيا، ولكن على غير طائل. قد أمر الرب أن يكون مضايقو يعقوب هم جيرانه الذين حوله. قد أصبحت أورشليم رجسا بينهم.", "groups": [{"kw": "spreadeth", "raw": "1Ki_8:22, 1Ki_8:38; Isa_1:15; Jer_4:31", "note": "", "refs": [{"l": "1Ki 8:22", "n": "", "vs": [[22, "وانتصب سليمان أمام مذبح الرب، في مواجهة كل جماعة إسرائيل، وبسط يديه إلى السماء،"]]}, {"l": "1Ki 8:38", "n": "", "vs": [[38, "فحين يصلي أو يتضرع أي واحد من كل شعبك إسرائيل، بعد أن يدرك ما ارتكبه من معصية، ويبسط يديه نحو هذا الهيكل،"]]}, {"l": "Isa 1:15", "n": "", "vs": [[15, "عندما تبسطون نحوي أيديكم أحجب وجهي عنكم، وإن أكثرتم الصلاة لا أستجيب، لأن أيديكم مملوءة دما."]]}, {"l": "Jer 4:31", "n": "", "vs": [[31, "لأني سمعت صرخة كصرخة امرأة في مخاض، وأنة عذاب كعذاب من تقاسي في ولادة بكرها. إنها صرخة ابنة صهيون التي تزفر لاهثة وتبسط يديها قائلة: «ويل لي! قد غشي علي أمام القتلة»."]]}], "kwAr": "تمد صهيون يديها", "noteAr": ""}, {"kw": "none", "raw": "Lam_1:2, Lam_1:9, Lam_1:16, Lam_1:19, Lam_1:21", "note": "", "refs": [{"l": "Lam 1:2", "n": "", "vs": [[2, "تبكي بمرارة في الليل، ودموعها تنهمر على خديها. لا معزي لها بين محبيها. غدر بها جميع خلانها وأصبحوا لها أعداء."]]}, {"l": "Lam 1:9", "n": "", "vs": [[9, "قد علق رجسها بذيولها. لم تذكر آخرتها لهذا كان سقوطها رهيبا، ولا معزي لها. انظر يارب إلى شقائي لأن العدو قد انتصر."]]}, {"l": "Lam 1:16", "n": "", "vs": [[16, "على هذه كلها أبكي. عيناي، عيناي تفيضان بالدموع، إذ ابتعد عني كل معز ينعش نفسي. هلك أبنائي لأن العدو قد ظفر."]]}, {"l": "Lam 1:19", "n": "", "vs": [[19, "دعوت محبي فخدعوني. فني كهنتي وشيوخي في المدينة وهم ينشدون قوتا لإحيا ء نفوسهم."]]}, {"l": "Lam 1:21", "n": "", "vs": [[21, "قد سمعوا تنهدي فلم يكن من معز لي. جميع أعدائي عرفوا ببليتي فشمتوا بما فعلت بي. أسرع بيوم العقاب الذي توعدت به فيصيروا مثلي."]]}], "kwAr": "معزيا", "noteAr": ""}, {"kw": "commanded", "raw": "Lam_2:1-8, Lam_2:17-22; 2Ki_24:2-4, 2Ki_25:1; Jer_6:3, Jer_16:6, Jer_21:4, Jer_21:5, Jer_34:22; Eze_7:23, Eze_7:24; Hos_8:8; Luk_19:43, Luk_19:44", "note": "", "refs": [{"l": "Lam 2:1-8", "n": "", "vs": [[1, "كيف خيم الرب في غضبه بالظلام على ابنة صهيون، وطرح من السماء إلى الأرض جلال إسرائيل، ولم يذكر موطيء قدميه في يوم سخطه؟"], [2, "قد هدم الرب من غير رحمة جميع مساكن يعقوب. قوض بغضبه معاقل ابنة يهوذا، وألحق العار بالمملكة وحكامها، إذ سواها بالأرض."], [3, "بتر في احتدام غضبه كل قوة إسرائيل. رد يمينه إلى الوراء أمام الأعداء، واشتعل مثل نار ملتهبة في إسرائيل، تلتهم كل ما حولها."], [4, "وتر قوسه كعدو. نصب يمينه كمبغض. ذبح كعدو كل عزيز في عيوننا. وسكب سخطه كنار على خيمة ابنة صهيون."], [5, "وأصبح الرب كعدو، فقوض إسرائيل، وهدم جميع قصورها، ودمر حصونها، وأكثر النوح والعويل في ابنة صهيون."], [6, "نقض مظلته كما ينقض كوخ من الأغصان في حديقة، وردم مقر مجتمعه. جعل الرب صهيون تنسى مواسم أعيادها وسبوتها. ونبذ باحتدام سخطه الملك والكاهن."], [7, "كره الرب مذبحه، وتبرأ من مقدسه، وسلم أسوار قصورها إلى يد الأعداء الذين علا هتافهم في بيت الرب كما كان يعلو هتافنا في الأعياد."], [8, "عزم الرب أن يقوض سور ابنة صهيون. مد خيط القياس ولم يرد يده عن سحقها، فاستبكى المترسة والسور فسقطا معا."]]}, {"l": "Lam 2:17-22", "n": "", "vs": [[17, "نفذ الرب قضاءه، وحقق وعيده الذي حكم به منذ الحقب السالفة. هدم ولم يرأف، فأشمت بك الخصم، وعظم قوة عدوك."], [18, "استغاثت قلوبهم بالرب. لتجر الدموع، ياأسوار ابنة صهيون، كالنهر ليلا ونهارا. لا تستكيني ولا تكف عيناك عن البكاء."], [19, "قومي وانتحبي في الربع الأول من الليل. اسكبي كالماء قلبك في محضر الرب. ارفعي إليه يديك من أجل نفوس أطفالك المغشي عليهم من الجوع عند ناصية كل شارع."], [20, "انظر يارب وتأمل! بمن صنعت هذا؟ أعلى النساء أن يأكلن ثمرة بطونهن، وأطفال حضانتهن؟ أيتحتم على الكاهن والنبي أن يقتلا في مقدس الرب؟"], [21, "قد انطرح الصبي والشيوخ في غبار الطرقات. سقط عذاراي وشباني بالسيف. قد قتلتهم في يوم غضبك، ونحرتهم من غير رحمة."], [22, "أنت دعوت، كما في يوم عيد، مروعي المحيطين بي. فلم يفلت ولم ينج أحد في يوم سخطك يارب. قد أفنى عدوي الذين حضنتهم وربيتهم."]]}, {"l": "2Ki 24:2-4", "n": "", "vs": [[2, "فأرسل الرب غزاة من كلدانيين وأراميين وموآبيين وعمونيين للإغارة على مملكة يهوذا وإبادتها، بموجب ما قضى به الرب على لسان عبيده الأنبياء."], [3, "وقد قضى الرب بذلك ليستأصل إسرائيل من أمامه بسبب ما ارتكبه منسى من آثام،"], [4, "وانتقاما للدم البريء الذي سفكه، إذ إنه ملأ أورشليم بدماء الأبرياء، فلم يشإ الرب أن يصفح عنه."]]}, {"l": "2Ki 25:1", "n": "", "vs": [[1, "وفي السنة التاسعة لملك صدقيا، في اليوم العاشر من الشهر العاشر، زحف نبوخذناصر ملك بابل بكامل جيشه على أورشليم وحاصرها، وأقام حولها أبراجا."]]}, {"l": "Jer 6:3", "n": "", "vs": [[3, "فيحل بها الرعاة مع قطعانهم، ويضربون حولها خيامهم، ويرعى كل منهم حيث نزل."]]}, {"l": "Jer 16:6", "n": "", "vs": [[6, "فيموت الصغير والكبير في هذه الأرض فلا يدفنون ولا يندبون أو يخدش أحد نفسه أو يحلق شعره حدادا عليهم."]]}, {"l": "Jer 21:4", "n": "", "vs": [[4, "هذا ما يعلنه الرب إله إسرائيل: ها أنا أرد أسلحتكم التي بأيديكم التي تحاربون بها ملك بابل والكلدانيين الذين يحاصرونكم من خارج السور، وأجمعهم في وسط هذه المدينة."]]}, {"l": "Jer 21:5", "n": "", "vs": [[5, "وأحاربكم بنفسي بيد ممدودة وذراع شديدة، بغضب وحنق وسخط عظيم."]]}, {"l": "Jer 34:22", "n": "", "vs": [[22, "ها أنا آمرهم، يقول الرب، فيرجعون لمحاربة هذه المدينة ويستولون عليها ويحرقونها بالنار، وأجعل مدن يهوذا أطلالا خاوية»."]]}, {"l": "Eze 7:23", "n": "", "vs": [[23, "اصنع السلسلة لشعبي لأن الأرض قد عمها سفك الدماء، وساد المدينة الجور."]]}, {"l": "Eze 7:24", "n": "", "vs": [[24, "لذلك، أجلب أشر الأمم فيرثون بيوتهم، وأقضي على كبرياء الأقوياء فتتنجس مقادسهم."]]}, {"l": "Hos 8:8", "n": "", "vs": [[8, "قد ابتلع إسرائيل، وأصبح بين الشعوب كإناء لا جدوى منه،"]]}, {"l": "Luk 19:43", "n": "", "vs": [[43, "فستأتي عليك أيام يحاصرك فيها أعداؤك بالمتاريس، ويطبقون عليك، ويشددون عليك الحصار من كل جهة،"]]}, {"l": "Luk 19:44", "n": "", "vs": [[44, "ويهدمونك على أبنائك الذين فيك، فلا يتركون فيك حجرا فوق حجر: لأنك لم تعرفي وقت افتقاد الله لك»."]]}], "kwAr": "أمر الرب", "noteAr": ""}, {"kw": "Jerusalem", "raw": "Lam_1:9, Lam_4:15; Lev_15:19-27; Eze_36:17", "note": "", "refs": [{"l": "Lam 1:9", "n": "", "vs": [[9, "قد علق رجسها بذيولها. لم تذكر آخرتها لهذا كان سقوطها رهيبا، ولا معزي لها. انظر يارب إلى شقائي لأن العدو قد انتصر."]]}, {"l": "Lam 4:15", "n": "", "vs": [[15, "هتفوا بهم: «ابتعدوا: تنحوا لا تلمسوا شيئا». فهربوا وتشردوا! غير أن أهل الأمم قالوا: لا يمكن أن يسكنوا معنا!"]]}, {"l": "Lev 15:19-27", "n": "", "vs": [[19, "وإذا حاضت المرأة فسبعة أيام تكون في طمثها، وكل من يلمسها يكون نجسا إلى المساء."], [20, "كل ما تنام عليه في أثناء حيضها أو تجلس عليه يكون نجسا،"], [21, "وكل من يلمس فراشها يغسل ثيابه ويستحم بماء ويكون نجسا إلى المساء."], [22, "وكل من مس متاعا تجلس عليه، يغسل ثيابه ويستحم بماء، ويكون نجسا إلى المساء."], [23, "وكل من يلمس شيئا كان موجودا على الفراش أو على المتاع الذي تجلس عليه يكون نجسا إلى المساء."], [24, "وإن عاشرها رجل وأصابه شيء من طمثها، يكون نجسا سبعة أيام. وكل فراش ينام عليه يصبح نجسا."], [25, "إذا نزف دم امرأة فترة طويلة في غير أوان طمثها، أو استمر الحيض بعد موعده، تكون كل أيام نزفها نجسة كما في أثناء طمثها."], [26, "كل ما تنام عليه في أثناء نزفها يكون نجسا كفراش طمثها، وكل ما تجلس عليه من متاع يكون نجسا كنجاسة طمثها."], [27, "وأي شخص يلمسهن يكون نجسا، فيغسل ثيابه ويستحم بماء، ويكون نجسا إلى المساء"]]}, {"l": "Eze 36:17", "n": "", "vs": [[17, "«ياابن آدم، عندما أقام شعب إسرائيل في أرضهم نجسوها بطرقهم الشريرة وتصرفاتهم. كانت طريقهم أمامي نجسة كنجاسة الطامث."]]}], "kwAr": "أصبحت أورشليم رجسا", "noteAr": ""}], "arS": [["تمد", ["H6566"]], [" ", []], ["صهيون", ["H6726"]], [" ", []], ["يديها", ["H3027"]], [" تلتمس ", []], ["معزيا", ["H5162"]], ["، ولكن على ", []], ["غير", ["H369"]], [" طائل. قد ", []], ["أمر", ["H6680"]], [" ", []], ["الرب", ["H3068"]], [" أن ", []], ["يكون", ["H1961"]], [" ", []], ["مضايقو", ["H6862"]], [" ", []], ["يعقوب", ["H3290"]], [" هم جيرانه الذين ", []], ["حوله", ["H5439"]], [". قد أصبحت ", []], ["أورشليم", ["H3389"]], [" ", []], ["رجسا", ["H5079"]], [" ", []], ["بينهم", ["H996"]], [".", []]]}, {"c": 1, "v": 18, "text": "الرب حقا عادل، وأنا قد تمردت على أمره. فاستمعوا ياجميع الشعوب واشهدوا وجعي. قد ذهب عذاراي وشباني إلى السبي.", "groups": [{"kw": "Lord", "raw": "Exo_9:27; Deu_32:4; Jdg_1:7; Ezr_9:13; Neh_9:33; Psa_119:75, Psa_145:17; Jer_12:1; Dan_9:7, Dan_9:14; Zep_3:5; Rom_2:5, Rom_3:19; Rev_15:3, Rev_15:4, Rev_16:5-7", "note": "", "refs": [{"l": "Exo 9:27", "n": "", "vs": [[27, "فأرسل فرعون واستدعى موسى وهرون وقال لهما: «لقد أخطأت هذه المرة والرب هو البار، أما أنا وشعبي فأشرار،"]]}, {"l": "Deu 32:4", "n": "", "vs": [[4, "هو الصخر، وصنائعه كلها كاملة، سبله جميعها عدل. هو إله أمانة لا يرتكب جورا، صديق وعادل هو."]]}, {"l": "Jdg 1:7", "n": "", "vs": [[7, "فقال أدوني بازق: «لقد قطعت أباهم أيدي وأرجل سبعين ملكا كانوا يلتقطون الفتات تحت مائدتي، فها الرب قد جازاني بمثل ما فعلت». وأتوا به إلى أورشليم حيث مات."]]}, {"l": "Ezr 9:13", "n": "", "vs": [[13, "والآن بعد كل ما جرى علينا من جراء أعمالنا السيئة وآثامنا العظيمة، نعلم أنك عاقبتنا ياإلهنا بأقل من آثامنا، ووهبتنا نجاة مثل هذه."]]}, {"l": "Neh 9:33", "n": "", "vs": [[33, "فقد كنت عادلا في كل ما حل بنا، لأنك عاقبتنا بالحق، ونحن الذين أذنبنا."]]}, {"l": "Psa 119:75", "n": "", "vs": [[75, "قد علمت يارب أن أحكامك عادلة، وأنك بالحق أدبتني."]]}, {"l": "Psa 145:17", "n": "", "vs": [[17, "الرب عادل في جميع طرقه، ورحيم في كل أعماله."]]}, {"l": "Jer 12:1", "n": "", "vs": [[1, "أنت دائما عادل حين أعرض عليك دعواي، ولكن دعني أحدثك بشأن أحكامك: لماذا تفلح طريق الأشرار؟ ولماذا يتمتع الغادرون بالعيش الرغيد؟"]]}, {"l": "Dan 9:7", "n": "", "vs": [[7, "لك أيها السيد البر، ولنا الخزي، كما هو حادث اليوم لرجال يهوذا ولأهل أورشليم، ولسائر بني إسرائيل القريبين والبعيدين، المشتتين في كل البلدان التي أجليتهم إليها عقابا لهم على ما اقترفوه من خيانة في حقك."]]}, {"l": "Dan 9:14", "n": "", "vs": [[14, "فأضمرت لنا العقاب وأوقعته بنا لأنك إلهنا البار في كل أعمالك التي صنعتها لأننا لم نستمع إليك."]]}, {"l": "Zep 3:5", "n": "", "vs": [[5, "ولكن الرب ما برح صديقا في وسطها، لا يرتكب خطأ، ويبدي في كل صباح عدله وفي كل فجر حقه. لا يخفق قط؛ أما الأثيم فلا يعرف ما هو الخزي."]]}, {"l": "Rom 2:5", "n": "", "vs": [[5, "ولكنك بسبب قساوتك وقلبك غير التائب، تخزن لنفسك غضبا ليوم الغضب، يوم تعلن دينونة الله العادلة."]]}, {"l": "Rom 3:19", "n": "", "vs": [[19, "ونحن نعلم أن كل ما تقوله الشريعة إنما تخاطب به الذين هم تحت الشريعة، لكي يسد كل فم ويقع العالم كله تحت دينونة من الله."]]}, {"l": "Rev 15:3", "n": "", "vs": [[3, "وينشدون ترتيلة موسى، عبد الله وترتيلة الحمل قائلين: «عظيمة وعجيبة أعمالك أيها الرب الإله القادر على كل شيء، عادلة ومستقيمة طرقك ياملك الدهور."]]}, {"l": "Rev 15:4", "n": "", "vs": [[4, "من لا يخافك يارب ولا يمجد اسمك؟ فأنت وحدك قدوس! والأمم جميعا سيأتون ويسجدون لك، لأن أحكامك قد ظهرت جلية»."]]}, {"l": "Rev 16:5-7", "n": "", "vs": [[5, "وسمعت ملاك المياه يقول: «عادل أنت في أحكامك، أيها الإله القدوس، الكائن والذي كان،"], [6, "فقد سفك الناس دم قديسين وأنبياء، وها أنت تسقي قاتليهم دما! إنهم ينالون ما يستحقون!»"], [7, "وسمعت ملاك المذبح يقول: «إن أحكامك حق وعدل أيها الرب الإله القادر على كل شيء»."]]}], "kwAr": "الرب حقا عادل", "noteAr": ""}, {"kw": "for I", "raw": "Lam_3:42; 1Sa_12:14, 1Sa_12:15, 1Sa_15:23; Neh_1:6-8, Neh_9:26; Psa_107:11; Dan_9:9-16", "note": "", "refs": [{"l": "Lam 3:42", "n": "", "vs": [[42, "قد تعدينا وتمردنا، وأنت لم تغفر."]]}, {"l": "1Sa 12:14", "n": "", "vs": [[14, "فإن اتقيتم الرب وعبدتموه وأطعتم وصاياه ولم تعصوا أمره واتبعتم الرب إلهكم أنتم وملككم المتسلط عليكم: فلن يصيبكم مكروه."]]}, {"l": "1Sa 12:15", "n": "", "vs": [[15, "ولكن إن عصيتم وصايا الرب وأمره، فإن عقاب الرب ينزل بكم كما نزل بآبائكم."]]}, {"l": "1Sa 15:23", "n": "", "vs": [[23, "فالتمرد مماثل لخطيئة العرافة، والعناد شبيه بشر عبادة الوثن والإثم. ولأنك رفضت كلام الرب فقد رفضك الرب من الملك»."]]}, {"l": "Neh 1:6-8", "n": "", "vs": [[6, "أرهف أذنيك وافتح عينيك لتسمع صلاة عبدك الذي يبتهل إليك الآن نهارا وليلا، لأجل بني إسرائيل عبيدك، ويعترف بآثامهم التي ارتكبناها، نحن الإسرائيليين، بحقك، ومن جملتهم أنا وبيت أبي، إذ قد أخطأنا إليك."], [7, "لقد اقترفنا الشر في حقك، ولم نطع الوصايا والفرائض والأحكام التي أمرت بها عبدك موسى."], [8, "اذكر تحذيرك الذي أنذرت به عبدك موسى قائلا: إن خنتم عهدي فإني أشتت شملكم بين الشعوب."]]}, {"l": "Neh 9:26", "n": "", "vs": [[26, "ومع ذلك ثاروا عليك وتمردوا وطرحوا شريعتك خلف ظهورهم، وقتلوا أنبياءك الذين حذروهم وأنذروهم ليرتدوا إليك، وارتكبوا الشرور الفواحش."]]}, {"l": "Psa 107:11", "n": "", "vs": [[11, "لأنهم تمردوا على كلام الله، واستهانوا بمشورة العلي."]]}, {"l": "Dan 9:9-16", "n": "", "vs": [[9, "إنما للرب إلهنا الرحمة والمغفرة لأننا عصيناك."], [10, "ولم نطع صوت الرب إلهنا لنسلك في شرائعه التي أعلنها لنا على لسان عبيده الأنبياء."], [11, "قد تعدى كل شعب إسرائيل على شريعتك، وانحرفوا فلم يسمعوا صوتك، فسكبت علينا اللعنة وما أقسمت أن توقعه بنا، كما نصت عليه شريعة موسى عبد الله، لأننا أخطأنا إليك."], [12, "وقد نفذت قضاءك الذي قضيت به علينا وعلى قضاتنا الذين تولوا أمرنا، جالبا علينا وعلى أورشليم شرا عظيما لم يحدث له مثيل تحت السماء."], [13, "وكما ورد في شريعة موسى، أصابنا جميع هذا البلاء، ولم نستعطف وجهك أيها الرب إلهنا تائبين عن آثامنا ومتنبهين لحقك."], [14, "فأضمرت لنا العقاب وأوقعته بنا لأنك إلهنا البار في كل أعمالك التي صنعتها لأننا لم نستمع إليك."], [15, "والآن أيها السيد إلهنا، يامن أخرجت شعبك من ديار مصر بقوة مقتدرة، وأشهرت اسمك كما هو حادث اليوم، قد أخطأنا وارتكبنا الشر."], [16, "فاصرف ياسيد، حسب رحمتك، سخطك وغضبك عن مدينتك أورشليم جبل قدسك إذ من جراء خطايانا وآثام آبائنا أصبحت أورشليم مثار عار لنا عند جميع المحيطين بنا."]]}], "kwAr": "وأنا قد تمردت", "noteAr": ""}, {"kw": "commandment", "raw": "Heb. mouth, 1Ki_13:21", "note": "Heb. mouth, 1Ki_13:21", "refs": [{"l": "1Ki 13:21", "n": "", "vs": [[21, "فقال لرجل الله الوافد من يهوذا: «هذا ما يقوله الرب: لأنك خالفت أمر الرب ولم تطع وصيته التي أوصاك بها الرب إلهك،"]]}], "kwAr": "على أمره", "noteAr": "بالعبرانية: فمه. انظر 1مل 13: 21"}, {"kw": "hear", "raw": "Lam_1:12; Deu_29:22-28; 1Ki_9:8, 1Ki_9:9; Jer_22:8, Jer_22:9, Jer_25:28, Jer_25:29, Jer_49:12; Eze_14:22, Eze_14:23", "note": "", "refs": [{"l": "Lam 1:12", "n": "", "vs": [[12, "ألا يعنيكم هذا ياجميع عابري الطريق؟ تأملوا وانظروا، هل من ألم كألمي الذي ابتلاني به الرب في يوم احتدام غضبه؟"]]}, {"l": "Deu 29:22-28", "n": "", "vs": [[22, "فيشاهد أبناؤكم من الأجيال القادمة، والغرباء الوافدون من أرض بعيدة بلايا تلك الأرض وما يصيبها الرب به من أمراض،"], [23, "إذ تصبح جميع الأرض كبريتا، محترقة لا زرع فيها ولا نبات ولا عشب، وكأنها انقلبت كما جرى لسدوم وعمورة وأدمة وصبوييم، التي قلبها الرب من جراء غضبه وسخطه."], [24, "فتقول جميع الأمم: لماذا فعل الرب هذا كله بهذه الأرض؟ ولماذا احتدام هذا الغضب العظيم؟"], [25, "فيكون الجواب: لأن هذا الشعب نقض عهد الرب إله آبائهم الذي قطعه معهم حين أخرجهم من ديار مصر،"], [26, "وغووا وعبدوا آلهة أخرى وسجدوا لها، آلهة غريبة لم يعرفوها ولم يعطها الرب لهم،"], [27, "فالتهب غضب الرب على تلك الأرض، فصب عليها كل اللعنات المدونة فى هذا الكتاب"], [28, "واجتثهم من أرضهم بغضب وسخط وغيظ عظيم، وطوح بهم إلى أرض أخرى كما هو حادث اليوم."]]}, {"l": "1Ki 9:8", "n": "", "vs": [[8, "ويصبح هذا الهيكل عبرة يثير عجب كل من يمر به، فيصفر ويتساءل: لماذا صنع الرب هكذا بهذه الأرض وبهذا الهيكل؟"]]}, {"l": "1Ki 9:9", "n": "", "vs": [[9, "فيأتيهم الجواب: لأنهم تركوا الرب إلههم الذي أخرج آباءهم من ديار مصر، وتشبثوا بآلهة أخرى وسجدوا لها وعبدوها، لذلك جلب الرب عليهم كل هذا البلاء»."]]}, {"l": "Jer 22:8", "n": "", "vs": [[8, "وتعبر في هذه المدينة أمم كثيرة، فيقول كل واحد لرفيقه: لماذا صنع الرب هكذا بهذه المدينة العظيمة؟"]]}, {"l": "Jer 22:9", "n": "", "vs": [[9, "فيجيبون: لأنهم نبذوا عهد الرب إلههم وسجدوا للأوثان وعبدوها»."]]}, {"l": "Jer 25:28", "n": "", "vs": [[28, "وإن أبوا أن يتناولوا الكأس من يدك ليشربوا منها، فقل لهم: هذا ما يعلنه الرب القدير: لابد لكم من شربها،"]]}, {"l": "Jer 25:29", "n": "", "vs": [[29, "لأني شرعت أعاقب المدينة التي دعي اسمي عليها، فهل تفلتون أنتم من العقاب؟ فها أنا قد سلطت السيف على جميع سكان الأرض، يقول الرب القدير."]]}, {"l": "Jer 49:12", "n": "", "vs": [[12, "لأن هذا ما يعلنه الرب: إن كان الذين لا يستحقون تجرع كأس العقاب قد تجرعوه، أتفلت أنت من العقاب؟ إنك لن تفلت من العقاب، بل عليك أن تجرعه حتما."]]}, {"l": "Eze 14:22", "n": "", "vs": [[22, "ولكن ستبقى فيها بقية ناجية من أبناء وبنات، يخرجون منها، فيقبلون إليكم فتشهدون حسن سلوكهم وتصرفاتهم فتتعزون عن المصائب التي أوقعتها بأورشليم وعن جميع ما ابتليتها به."]]}, {"l": "Eze 14:23", "n": "", "vs": [[23, "عندئذ يعزونكم حين تشهدون حسن سلوكهم وتصرفاتهم، فتدركون أن كل ما صنعته فيها لم يكن عبثا، يقول السيد الرب»."]]}], "kwAr": "فاستمعوا", "noteAr": ""}, {"kw": "my virgins", "raw": "Lam_1:5, Lam_1:6; Deu_28:32-41", "note": "", "refs": [{"l": "Lam 1:5", "n": "", "vs": [[5, "أصبح أعداؤها سادة، ونجح مضايقوها، لأن الرب أشقاها بسبب خطاياها المتكاثرة. قد ذهب أولادها إلى السبي أمام العدو."]]}, {"l": "Lam 1:6", "n": "", "vs": [[6, "تعرت بنت صهيون من كل بهائها، وغدا أشرافها كأيائل شاردة من غير مرعى. فروا بقوة خائرة أمام المطارد."]]}, {"l": "Deu 28:32-41", "n": "", "vs": [[32, "يساق أولادك وبناتك إلى أمة أخرى وعيناك تراقبانهم طوال النهار، حتى تكلا، وما في يدك حيلة."], [33, "محصول أرضك وثمر تعبك يأكله شعب غريب عنك، ولا تكون سوى مظلوم مسحوق دائما."], [34, "ويصيبك الجنون من هول ما ترى."], [35, "ويبتليك الرب بقروح خبيثة تغطي الركبتين والساقين، حتى لا تجد لها شفاء من قمة الرأس إلى أخمص القدم."], [36, "ينفيكم الرب أنتم وملككم الذي تختارونه إلى أمة لا تعرفونها أنتم ولا آباؤكم، حيث تعبدون هناك آلهة أخرى من خشب وحجر،"], [37, "وتصبحون مثار دهشة وسخرية وعبرة في نظر جميع الشعوب التي ينفيكم الرب إليهم"], [38, "تبذرون كثيرا من البذار في الحقول، ولا تحصدون إلا القليل، لأن الجراد يلتهمه."], [39, "تكدحون في غرس كروم ومن خمرها لا تشربون، ومن ثمرها لا تجنون، لأن الدود ينخرها."], [40, "تكتظ أراضيكم بأشجار الزيتون، ولكن من زيتها لا تدهنون، لأن زيتونكم ينتثر على الأرض قبل نضجه."], [41, "تنجبون بنين وبنات ولا يكونون لكم، لأنهم يسبون."]]}], "kwAr": "عذاراي", "noteAr": ""}], "arS": [["الرب", ["H3068"]], [" حقا ", []], ["عادل", ["H6662"]], ["، وأنا قد ", []], ["تمردت", ["H4784"]], [" على ", []], ["أمره", ["H6310"]], [". ", []], ["فاستمعوا", ["H8085"]], [" ", []], ["ياجميع", ["H3605"]], [" ", []], ["الشعوب", ["H5971"]], [" ", []], ["واشهدوا", ["H7200"]], [" ", []], ["وجعي", ["H4341"]], [". قد ", []], ["ذهب", ["H1980"]], [" ", []], ["عذاراي", ["H1330"]], [" وشباني إلى ", []], ["السبي", ["H7628"]], [".", []]]}, {"c": 1, "v": 19, "text": "دعوت محبي فخدعوني. فني كهنتي وشيوخي في المدينة وهم ينشدون قوتا لإحيا ء نفوسهم.", "groups": [{"kw": "for", "raw": "Lam_1:2, Lam_4:17; Job_19:13-19; Jer_2:28, Jer_30:14, Jer_37:7-9", "note": "", "refs": [{"l": "Lam 1:2", "n": "", "vs": [[2, "تبكي بمرارة في الليل، ودموعها تنهمر على خديها. لا معزي لها بين محبيها. غدر بها جميع خلانها وأصبحوا لها أعداء."]]}, {"l": "Lam 4:17", "n": "", "vs": [[17, "كلت عيوننا من ترقب نصرة باطلة. في أبراجنا انتظرنا معونة أمة لا تخلص."]]}, {"l": "Job 19:13-19", "n": "", "vs": [[13, "أبعد عني إخوتي، فاعتزل عني معارفي."], [14, "خذلني ذوو قرابتي ونسيني أصدقائي."], [15, "وحسبني ضيوفي وإمائي غريبا، أصبحت في أعينهم أجنبيا."], [16, "أدعو خادمي فلا يجيب، مع أني توسلت إليه."], [17, "عافت زوجتي رائحة أنفاسي الخبيثة، وكرهني إخوتي فابتعدوا عني."], [18, "حتى الصبيان يزدرونني. إذا قمت يسخرون مني."], [19, "مقتني أصدقائي الحميمون، والذين أحببتهم انقلبوا علي."]]}, {"l": "Jer 2:28", "n": "", "vs": [[28, "فأين إذا الآلهة التي صنعتموها لأنفسكم؟ لتقم إن كانت قادرة على إنقاذكم في وقت ضيقكم، لأن عدد آلهتكم ياأبناء يهوذا صار كعدد مدنكم."]]}, {"l": "Jer 30:14", "n": "", "vs": [[14, "قد نسيك محبوك، وأهملوك إهمالا، لأني ضربتك كما يضرب عدو، وعاقبتك عقاب مبغض قاس، لأن إثمك عظيم وخطاياك متكاثرة."]]}, {"l": "Jer 37:7-9", "n": "", "vs": [[7, "«هذا ما يعلنه الرب إله إسرائيل: هذا ما تبلغونه لملك يهوذا الذي بعثكم إلي لتستشيروني: إن جيش فرعون الزاحف لإغاثتكم على وشك العودة إلى أرضه، مصر."], [8, "فيعود الكلدانيون ويحاربون هذه المدينة ويستولون عليها ويحرقونها بالنار."], [9, "لذلك يقول الرب لا تخدعوا أنفسكم قائلين: سينسحب عنا الكلدانيون، فإنهم لا ينسحبون."]]}], "kwAr": "دعوت محبي", "noteAr": ""}, {"kw": "my priests", "raw": "Lam_1:11, Lam_2:20, Lam_4:7-9, Lam_5:12; Jer_14:15-18, Jer_23:11-15, Jer_27:13-15", "note": "", "refs": [{"l": "Lam 1:11", "n": "", "vs": [[11, "شعبها كله يتنهد وهو يبحث عن القوت. قد قايضوا ذخائرهم بالطعام لإنعاش النفس الخائرة. (وقالت:) «انظر يارب وتأمل كيف أصبحت محتقرة»."]]}, {"l": "Lam 2:20", "n": "", "vs": [[20, "انظر يارب وتأمل! بمن صنعت هذا؟ أعلى النساء أن يأكلن ثمرة بطونهن، وأطفال حضانتهن؟ أيتحتم على الكاهن والنبي أن يقتلا في مقدس الرب؟"]]}, {"l": "Lam 4:7-9", "n": "", "vs": [[7, "كان نبلاؤها أنقى من الثلج وأنصع من اللبن. أجسادهم أكثر حمرة من المرجان، وقاماتاهم كالياقوت العأزرق،"], [8, "فأصبحت صورتهم أكثر سوادا من الفحم، فلم يعرفوا فاي الشوارع. لصقت جلودهم بعظامهم، وصارت جافة كالحطب."], [9, "كان مصير ضحايا السيف أفضل من مصير ضحايا الجوع، الذين اضمحلوا من طعنة عقم الحقل."]]}, {"l": "Lam 5:12", "n": "", "vs": [[12, "علق النبلاء بأيديهم ولم يوقروا الشيوخ."]]}, {"l": "Jer 14:15-18", "n": "", "vs": [[15, "لذلك هكذا يقول الرب عن هؤلاء الأنبياء المتنبئين باسمي: مع أني لم أرسلهم فإنهم يقولون: لن تبتلى هذه الأرض بسيف ولا مجاعة، لهذا فإن هولاء الأنبياء يفنون بالسيف والمجاعة."], [16, "ويغدو الشعب الذي يتنبأون له، مطروحا صريعا في شوارع أورشليم فريسة الجوع والسيف، وليس من يدفنهم هم ونساءهم وأبناءهم وبناتهم، وأصب شرهم عليهم»."], [17, "وقل لهم هذا الكلام: «لتذرف عيناي دموعا ليلا ونهارا، ولا تكفا أبدا لأن أورشليم سحقت سحقا عظيما بضربة أليمة جدا."], [18, "إن خرجت إلى الحقول أشهد قتلى السيف، وإن دخلت المدينة أرى ضحايا المجاعة. وها النبي والكاهن كلاهما يذهبان إلى أرض لا يعرفانها»."]]}, {"l": "Jer 23:11-15", "n": "", "vs": [[11, "ويقول الرب: «النبي والكاهن كافران، وفي بيتي وجدت شرهما."], [12, "لذلك يضحي طريقهما مزالق لهما، تفضي بهما إلى الظلمات التي يطردون إليها، ويهويان فيها لأني أجلب عليهما شرا في سنة عقابهما»."], [13, "في أوساط أنبيا ء السامرة شهدت أمورا كريهة، إذ تنبأوا باسم البعل، وأضلوا شعبي إسرائيل."], [14, "وفي أوساط أنبياء أورشليم رأيت أمورا مهولة: يرتكبون الفسق، ويسلكون في الأكاذيب، يشددون أيدي فاعلي الإثم لئلا يتوب أحد عن شره. صاروا جميعا كسكان سدوم وأصبح أهلها كأهل عمورة."], [15, "لذلك هذا ما يقوله الرب القدير عن الأنبياء: «ها أنا أطعمهم أفسنتينا وأسقيهم ماء مسموما، لأنه من أنبياء أورشليم شاع الكفر في كل أرجاء الأرض»."]]}, {"l": "Jer 27:13-15", "n": "", "vs": [[13, "فلماذا تموت أنت وشعبك بحد السيف والجوع والوباء كما قضى الرب على الأمة التي لا تستعبد لملك بابل؟"], [14, "لا تستمعوا لكلام الأنبياء الكذبة الذين يقولون لكم: لا تستعبدوا لملك بابل لأنهم يتنبأون لكم كذبا،"], [15, "فأنا لم أرسلهم، يقول الرب، إنما هم يتنبأون باسمي كذبا لأجلكم فتطردون أنتم وأنبياؤكم المتنبئون لكم»."]]}], "kwAr": "كهنتي وشيوخي", "noteAr": ""}], "arS": [["دعوت", ["H7121"]], [" ", []], ["محبي", ["H157"]], [" ", []], ["فخدعوني", ["H7411"]], [". ", []], ["فني", ["H1478"]], [" ", []], ["كهنتي", ["H3548"]], [" ", []], ["وشيوخي", ["H2205"]], [" في ", []], ["المدينة", ["H5892"]], [" وهم ", []], ["ينشدون", ["H1245"]], [" ", []], ["قوتا", ["H400"]], [" ", []], ["لإحيا", ["H7725"]], [" ء ", []], ["نفوسهم", ["H5315"]], [".", []]]}, {"c": 1, "v": 20, "text": "انظر يارب فإني في ضيقة. أحشائي جائشة وقلبي متلاطم في داخلي، لأني أكثرت التمرد. ها السيف يثكل في الخارج وفي البيت يسود الموت.", "groups": [{"kw": "Behold", "raw": "Lam_1:9, Lam_1:11; Isa_38:14", "note": "", "refs": [{"l": "Lam 1:9", "n": "", "vs": [[9, "قد علق رجسها بذيولها. لم تذكر آخرتها لهذا كان سقوطها رهيبا، ولا معزي لها. انظر يارب إلى شقائي لأن العدو قد انتصر."]]}, {"l": "Lam 1:11", "n": "", "vs": [[11, "شعبها كله يتنهد وهو يبحث عن القوت. قد قايضوا ذخائرهم بالطعام لإنعاش النفس الخائرة. (وقالت:) «انظر يارب وتأمل كيف أصبحت محتقرة»."]]}, {"l": "Isa 38:14", "n": "", "vs": [[14, "أصيح كسنونة، وأنوح كهديل الحمامة. كلت عيناي من النظر إلى السماء، يارب إني متضايق فكن لي مأمنا."]]}], "kwAr": "انظر يارب", "noteAr": ""}, {"kw": "my bowels", "raw": "Lam_2:11; Job_30:27; Psa_22:14; Isa_16:11; Jer_4:19, Jer_31:20, Jer_48:36; Hos_11:8; Hab_3:16", "note": "", "refs": [{"l": "Lam 2:11", "n": "", "vs": [[11, "كلت عيناي من البكاء، جاشت أحشائي وأريقت كبدي على الأرض حزنا لدمار ابنة شعبي، لأن الأطفال والرضع غشي عليهم في شوارع المدينة."]]}, {"l": "Job 30:27", "n": "", "vs": [[27, "قلبي يغلي ولن يهدأ، وأيام البلية غشيتني."]]}, {"l": "Psa 22:14", "n": "", "vs": [[14, "صارت قوتي كالماء، وانحلت عظامي. صار قلبي كالشمع، وذاب في داخلي."]]}, {"l": "Isa 16:11", "n": "", "vs": [[11, "لهذا تئن روحي على موآب كعود، وأحشائي تتلوى على قير حارس."]]}, {"l": "Jer 4:19", "n": "", "vs": [[19, "لشد ما أتعذب! لشد ما أتعذب! قلبي يتلوى ألما. فؤادي يئن في داخلي فلا أستطيع الصمت، لأني سمعت دوي البوق وصيحات القتال."]]}, {"l": "Jer 31:20", "n": "", "vs": [[20, "هل أفرايم ابن أثير لدي؟ أليس هو ابنا مسرا؟ لأني مع كثرة تنديدي به فإني مازلت أذكره، لذلك يشتاق قلبي إليه، وأكن له الرحمة»، يقول الرب."]]}, {"l": "Jer 48:36", "n": "", "vs": [[36, "لذلك يئن قلبي على موآب كأنين مزمار، وينوح فؤادي على رجال قير حارس كنوح الناي، فإن ثروتهم التي اكتسبوها قد تبددت."]]}, {"l": "Hos 11:8", "n": "", "vs": [[8, "كيف أتخلى عنك ياأفرايم؟ وكيف أسلمك إلى العدو ياإسرائيل؟ كيف أعاملك كما عاملت أدمة؟ وكيف أجري عليك ما أجريته على صبوئيم؟ إن قلبي يتلوى أسى في داخلي وتضرم في مراحمي."]]}, {"l": "Hab 3:16", "n": "", "vs": [[16, "سمعت هذا فتولاني الفزع وارتجفت شفتاي من الصوت، وتسرب النخر إلى عظامي، وارتعشت قدماي. ولكن سأنتظر بصبر يوم البلية الذي يحيق بالأمة التي غزتنا."]]}], "kwAr": "أحشائي جائشة", "noteAr": ""}, {"kw": "for", "raw": "Lam_1:18; Lev_26:40-42; 1Ki_8:47-50; Job_33:27; Psa_51:3, Psa_51:4; Pro_28:13; Jer_2:35, Jer_3:13; Luk_15:18, Luk_15:19, Luk_18:13, Luk_18:14", "note": "", "refs": [{"l": "Lam 1:18", "n": "", "vs": [[18, "الرب حقا عادل، وأنا قد تمردت على أمره. فاستمعوا ياجميع الشعوب واشهدوا وجعي. قد ذهب عذاراي وشباني إلى السبي."]]}, {"l": "Lev 26:40-42", "n": "", "vs": [[40, "ولكن إن اعترفوا بخطاياهم وخطايا آبائهم وبخيانتهم لي وعداوتهم،"], [41, "التي جعلتني أنقلب عليهم وأنفيهم إلى أرض أعدائهم، وإن خضعت قلوبهم النجسة بعد أن استوفوا عقاب خطاياهم،"], [42, "فإني أذكر ميثاقي مع يعقوب، وميثاقي مع إسحق، وميثاقي مع إبراهيم، وأذكر الأرض،"]]}, {"l": "1Ki 8:47-50", "n": "", "vs": [[47, "فإن تابوا في أرض سبيهم ورجعوا متضرعين إليك قائلين: قد أخطأنا وانحرفنا وأذنبنا،"], [48, "وتابوا حقا من كل قلوبهم ونفوسهم وهم أسرى في ديار أعدائهم، متوجهين نحو أرضهم التي وهبتها لآبائهم، نحو المدينة التي اخترتها والهيكل الذي شيدته لاسمك،"], [49, "فاستجب صلاتهم وتضرعهم من السماء مقر سكناك، وانصر قضيتهم،"], [50, "واصفح عن خطايا شعبك وعن جميع ذنوبهم التي ارتكبوها في حقك، واجعل آسريهم يبدون نحوهم رحمة،"]]}, {"l": "Job 33:27", "n": "", "vs": [[27, "ثم يرنم أمام الناس قائلا: لقد أخطأت وحرفت ما هو حق ولم أجاز عليه،"]]}, {"l": "Psa 51:3", "n": "", "vs": [[3, "فإ نني أقر بمعاصي، وخطيئتي ماثلة أمامي دائما."]]}, {"l": "Psa 51:4", "n": "", "vs": [[4, "إليك وحدك أخطأت، والشر قدام عينيك صنعت. لكي تتبرر إذا حكمت وتزكو إذا قضيت."]]}, {"l": "Pro 28:13", "n": "", "vs": [[13, "من يكتم آثامه لا يفلح، ومن يعترف بها ويقلع عنها يحظى بالرحمة."]]}, {"l": "Jer 2:35", "n": "", "vs": [[35, "تقولون: نحن أبرياء، فلذلك قد تحول عنا غضب الرب. غير أني سأدينكم لقولكم إننا لم نخطيء."]]}, {"l": "Jer 3:13", "n": "", "vs": [[13, "إنما اعترفي بإثمك وأقري أنك قد تمردت على الرب إلهك، وأغدقت غرامك على الغرباء تحت كل شجرة خضراء، وأنك أبيت طاعة صوتي."]]}, {"l": "Luk 15:18", "n": "", "vs": [[18, "سأقوم وأرجع إلى أبي، وأقول له: ياأبي، أخطأت إلى السماء وأمامك؛"]]}, {"l": "Luk 15:19", "n": "", "vs": [[19, "ولا أستحق بعد أن أدعى ابنا لك: اجعلني كواحد من خدامك المأجورين!"]]}, {"l": "Luk 18:13", "n": "", "vs": [[13, "ولكن جابي الضرائب، وقف من بعيد وهو لا يجرؤ أن يرفع عينيه نحو السماء، بل قرع صدره قائلا: ارحمني، ياالله ، أنا الخاطيء!"]]}, {"l": "Luk 18:14", "n": "", "vs": [[14, "أقول لكم: إن هذا الإنسان نزل إلى بيته مبررا، بعكس الآخر. فإن كل من يرفع نفسه يوضع؛ ومن يضع نفسه يرفع»."]]}], "kwAr": "لأني أكثرت التمرد", "noteAr": ""}, {"kw": "abroad", "raw": "Lam_4:9, Lam_4:10; Deu_32:25; Jer_9:21, Jer_9:22, Jer_14:18; Eze_7:15", "note": "", "refs": [{"l": "Lam 4:9", "n": "", "vs": [[9, "كان مصير ضحايا السيف أفضل من مصير ضحايا الجوع، الذين اضمحلوا من طعنة عقم الحقل."]]}, {"l": "Lam 4:10", "n": "", "vs": [[10, "طهت أيدي الأمهات الحانيات أولادهن ليكونوا طعاما لهن في أثناء دمار ابنة شعبي."]]}, {"l": "Deu 32:25", "n": "", "vs": [[25, "يثكلهم سيف العدو في الطريق، ويستولي عليهم الرعب داخل الخدور، فيهلك الفتى مع الفتاة، والرضيع مع الشيخ."]]}, {"l": "Jer 9:21", "n": "", "vs": [[21, "فإن الموت قد تسلق إلى كوانا وتسلل إلى قصورنا، فاستأصل الأطفال من الشوارع والشبان من الساحات."]]}, {"l": "Jer 9:22", "n": "", "vs": [[22, "وهذا ما يعلنه الرب: «ستتهاوى جثث الناس مثل نفاية على وجه الحقل، وتتساقط كقبضات وراء الحاصد، وليس من يجمعها»."]]}, {"l": "Jer 14:18", "n": "", "vs": [[18, "إن خرجت إلى الحقول أشهد قتلى السيف، وإن دخلت المدينة أرى ضحايا المجاعة. وها النبي والكاهن كلاهما يذهبان إلى أرض لا يعرفانها»."]]}, {"l": "Eze 7:15", "n": "", "vs": [[15, "السيف مسلط من خارج، والوباء والجوع من داخل. والذي في الصحراء يقضي عليه السيف، ومن في المدينة يفترسه الجوع والوباء."]]}], "kwAr": "في الخارج", "noteAr": ""}], "arS": [["انظر", ["H7200"]], [" ", []], ["يارب", ["H3068"]], [" ", []], ["فإني", ["H3588"]], [" في ", []], ["ضيقة", ["H6862"]], [". ", []], ["أحشائي", ["H4578"]], [" ", []], ["جائشة", ["H2560"]], [" ", []], ["وقلبي", ["H3820"]], [" ", []], ["متلاطم", ["H2015"]], [" في ", []], ["داخلي", ["H7130"]], ["، ", []], ["لأني", ["H3588"]], [" أكثرت ", []], ["التمرد", ["H4784"]], [". ها ", []], ["السيف", ["H2719"]], [" ", []], ["يثكل", ["H7921"]], [" في ", []], ["الخارج", ["H2351"]], [" وفي ", []], ["البيت", ["H1004"]], [" يسود ", []], ["الموت", ["H4194"]], [".", []]]}, {"c": 1, "v": 21, "text": "قد سمعوا تنهدي فلم يكن من معز لي. جميع أعدائي عرفوا ببليتي فشمتوا بما فعلت بي. أسرع بيوم العقاب الذي توعدت به فيصيروا مثلي.", "groups": [{"kw": "have heard that", "raw": "Lam_1:2, Lam_1:8, Lam_1:11, Lam_1:12, Lam_1:16, Lam_1:22", "note": "", "refs": [{"l": "Lam 1:2", "n": "", "vs": [[2, "تبكي بمرارة في الليل، ودموعها تنهمر على خديها. لا معزي لها بين محبيها. غدر بها جميع خلانها وأصبحوا لها أعداء."]]}, {"l": "Lam 1:8", "n": "", "vs": [[8, "ارتكبت أورشليم خطيئة نكراء فأصبحت رجسة. جميع مكرميها يحتقرونها لأنهم شهدوا عريها، أما هي فتنهدت وتراجعت القهقرى."]]}, {"l": "Lam 1:11", "n": "", "vs": [[11, "شعبها كله يتنهد وهو يبحث عن القوت. قد قايضوا ذخائرهم بالطعام لإنعاش النفس الخائرة. (وقالت:) «انظر يارب وتأمل كيف أصبحت محتقرة»."]]}, {"l": "Lam 1:12", "n": "", "vs": [[12, "ألا يعنيكم هذا ياجميع عابري الطريق؟ تأملوا وانظروا، هل من ألم كألمي الذي ابتلاني به الرب في يوم احتدام غضبه؟"]]}, {"l": "Lam 1:16", "n": "", "vs": [[16, "على هذه كلها أبكي. عيناي، عيناي تفيضان بالدموع، إذ ابتعد عني كل معز ينعش نفسي. هلك أبنائي لأن العدو قد ظفر."]]}, {"l": "Lam 1:22", "n": "", "vs": [[22, "ليأت كل شرهم أمامك فتعاقبهم كما عاقبتني على كل ذنوبي، لأن تنهداتي كثيرة وقلبي مغشي عليه."]]}], "kwAr": "سمعوا تنهدي", "noteAr": ""}, {"kw": "they are", "raw": "Lam_2:15, Lam_4:21, Lam_4:22; Psa_35:15, Psa_38:16, Psa_137:7; Jer_48:27, Jer_50:11; Eze_25:3, Eze_25:6, Eze_25:8, Eze_25:15, Eze_26:2; Oba_1:12, Oba_1:13", "note": "", "refs": [{"l": "Lam 2:15", "n": "", "vs": [[15, "كل عابري السبيل صفقوا عليك بالأيادي فرحا. صفروا وهزوا رؤوسهم على ابنة أورشليم وتساءلوا: أهذه هي المدينة التي تدعى كاملة الجمال وبهجة الأرض بأسرها؟"]]}, {"l": "Lam 4:21", "n": "", "vs": [[21, "ابتهجي وافرحي ياابنة أدوم، ياساكنة عوص. إنما هذه الكأس ستجوز عليك أيضا فتسكرين وتتعرين."]]}, {"l": "Lam 4:22", "n": "", "vs": [[22, "قد تم إثمك ياابنة صهيون، ولن يطيل (الله ) من حقبة سبيك. أما أنت ياابنة أدوم فإنه يعاقبك ويفضح خطاياك."]]}, {"l": "Psa 35:15", "n": "", "vs": [[15, "وأما هم فشمتوا فرحا عند سقطتي، وتجمعوا علي شاتمين، وشرع غرباء لا أعرفهم يضربونني. مزقوني ولم يرتدعوا."]]}, {"l": "Psa 38:16", "n": "", "vs": [[16, "قلت: «لا تدعهم يشمتون بي فحالما زلت قدمي تغطرسوا علي»"]]}, {"l": "Psa 137:7", "n": "", "vs": [[7, "اذكر يارب لبني أدوم ما فعلوه يوم خراب أورشليم، إذ قالوا: «اهدموا اهدموا حتى يتعرى أساسها»."]]}, {"l": "Jer 48:27", "n": "", "vs": [[27, "ألم يصبح إسرائيل مهزأة لديك؟ أكان بين اللصوص حتى كنت تهز رأسك باحتقار كلما جاء ذكره على لسانك؟"]]}, {"l": "Jer 50:11", "n": "", "vs": [[11, "لأنكم تبتهجون وتطفرون غبطة يا ناهبي شعبي، وتمرحون كعجلة فوق العشب وتصهلون كالخيل."]]}, {"l": "Eze 25:3", "n": "", "vs": [[3, "وقل لهم اسمعوا ما يعلنه السيد الرب من قضاء: لأنك شمت بمقدسي لأنه تدنس، وبأرض إسرائيل لأنها خربت وبشعب يهوذا لأنهم سيقوا إلى السبي،"]]}, {"l": "Eze 25:6", "n": "", "vs": [[6, "لأنك صفقت بكفيك طربا، وخبطت برجليك، وفرحت بكل ما فيك من لؤم لما حل بأرض إسرائيل."]]}, {"l": "Eze 25:8", "n": "", "vs": [[8, "وهذا ما يعلنه السيد الرب: لأن الموآبيين وأهل سعير يقولون: هل شعب يهوذا كبقية الأمم."]]}, {"l": "Eze 25:15", "n": "", "vs": [[15, "وهذا أيضا ما يعلنه السيد الرب لأن الفلسطينيين قد أقدموا على الانتقام وأفرطوا فيه بكل لؤم قلوبهم، عامدين إلى الخراب بسبب عداوة أبدية،"]]}, {"l": "Eze 26:2", "n": "", "vs": [[2, "«ياابن آدم، لأن صور قد شمتت بأورشليم، وقالت: ها بوابة الشعوب قد انهارت، وتحولت القوافل إلي. ها أنا أزدهر إذ حل بها الدمار."]]}, {"l": "Oba 1:12", "n": "", "vs": [[12, "ما كان يجب أن تشمت بيوم مصير أخيك، في يوم فاجعته، وما كان يجب أن تبتهج في يوم دمار شعب يهوذا أو تتباهى في يوم الضيق."]]}, {"l": "Oba 1:13", "n": "", "vs": [[13, "وما كان يجب أن تقتحم أبواب شعبي في يوم كارثته، أو تشمت لمصيبته في يوم نكبته، أو تنهب ثروته في يوم بليته،"]]}], "kwAr": "فشمتوا", "noteAr": ""}, {"kw": "thou wilt", "raw": "Isa. 13:1-14:32, Isa_47:1-15; Jer_25:17-29, 46:1-51:64; Ezek. 25:1-32:32; Amo_1:1-15", "note": "", "refs": [{"l": "Isa 13:1-14:32", "n": "", "vs": [[1, "رؤيا إشعياء بن آموص بشأن بابل:"], [2, "انصبوا راية فوق جبل أجرد. اصرخوا فيهم لوحوا بأيديكم حتى يدخلوا أبواب العظماء."], [3, "إني أمرت مقدسي واستدعيت جبابرتي المفتخرين بعظمتي لينفذوا عقاب غضبي."], [4, "ها جلبة على الجبال مثل صوت أقوام غفيرة. صوت صخب ممالك أمم مجتمعة، لأن الرب القدير يستعرض جنود القتال."], [5, "يقبلون من أرض نائية، من أقصى السماوات هم جنود الرب وأسلحة سخطه لتدمير الأرض كلها."], [6, "ولولوا، فإن يوم الرب بات وشيكا قادما من عند الرب محملا بالدمار."], [7, "لذلك ترتخي كل يد، ويذوب قلب كل إنسان."], [8, "ينتابهم الفزع، وتأخذهم أوجاع ومخاض، يتلوون كوالدة تقاسي من آلآم المخاض. ويحملق بعضهم ببعض مبهوتين بوجوه ملتهبة."], [9, "ها هو يوم الرب آت مفعما بالقسوة والسخط والغضب العنيف، ليجعل الأرض خرابا ويبيد منها الخطاة."], [10, "فإن نجوم السماء وكواكبها لا تشرق بنورها، والشمس تظلم عند بزوغها، والقمر لا يشع بضوئه."], [11, "وأعاقب العالم على شره والمنافقين
