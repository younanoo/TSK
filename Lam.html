: 11"}, {"kw": "tabernacle", "raw": "or, hedge", "note": "or, hedge", "refs": [], "kwAr": "مظلته", "noteAr": "أو: سياج."}, {"kw": "as if", "raw": "Isa_1:8", "note": "", "refs": [{"l": "Isa 1:8", "n": "", "vs": [[8, "فأضحت أورشليم مهجورة كمظلة حارس في كرم أو خيمة في حقل للقثاء أو كمدينة محاصرة."]]}], "kwAr": "كما ينقض كوخ", "noteAr": ""}, {"kw": "caused", "raw": "Lam_1:4; Zep_3:18", "note": "", "refs": [{"l": "Lam 1:4", "n": "", "vs": [[4, "تنوح الطرق المفضية إلى صهيون، لأنها أقفرت من القادمين إلى الأعيا د! تهدمت بواباتها جميعا. كهنتها يتنهدون؛ عذاراها متحسرات وهي تقاسي مر العذاب."]]}, {"l": "Zep 3:18", "n": "", "vs": [[18, "وكما في يوم موسم عيد، أزيل عنك بلاياك، فلا تتحملين من أجلها أي عار."]]}], "kwAr": "جعل الرب", "noteAr": ""}, {"kw": "the king", "raw": "Lam_4:16, Lam_4:20, Lam_5:12; Isa_43:28; Jer. 52:11-27; Eze_12:12, Eze_12:13, Eze_17:18; Mal_2:9", "note": "", "refs": [{"l": "Lam 4:16", "n": "", "vs": [[16, "قد بددهم الرب نفسه، ولم يعد يعبأ بهم، لم يكرموا الكهنة ولم يترَأفوا بالشيوخ."]]}, {"l": "Lam 4:20", "n": "", "vs": [[20, "وقع في حفرهم مصدر حياتنا، الملك الذي اختاره الرب، الذي قلنا: في ظله نعيش بين الأمم."]]}, {"l": "Lam 5:12", "n": "", "vs": [[12, "علق النبلاء بأيديهم ولم يوقروا الشيوخ."]]}, {"l": "Isa 43:28", "n": "", "vs": [[28, "لذلك أدنس عظماء مقادسي وأقضي على إسرائيل بالهلاك وأتركه عرضة للخزي والعار."]]}, {"l": "Jer 52:11-27", "n": "", "vs": [[11, "وفقأ عيني صدقيا وأوثقه بسلسلتين من نحاس، ثم ساقه إلى بابل حيث زجه في السجن إلى يوم وفاته."], [12, "وفي اليوم العاشر من الشهر الخامس من السنة التاسعة عشرة من حكم نبوخذناصر ملك بابل، جاء نبوزرادان رئيس الشرطة الذي كان يقف دائما في حضرة ملك بابل، إلى أورشليم،"], [13, "وأحرق هيكل الرب وقصر الملك وجميع بيوت أورشليم، وأضرم النار في كل بيت من بيوت العظماء،"], [14, "وهدم كل جيش الكلدانيين المرافق لرئيس الشرطة كل أسوار أورشليم المحيطة بها."], [15, "وأجلى نبوزرادان رئيس الشرطة بعضا من فقراء البلد، ومن بقي من الشعب في المدينة، والهاربين الذين لجأوا إلى ملك بابل مع سائر الحرفيين."], [16, "ولكنه أبقى على بعض المساكين ليكونوا كرامين وفلاحين."], [17, "وحطم الكلدانيون أعمدة النحاس في هيكل الرب، والقواعد والبركة النحاسية القائمة فيه، ونقلوا كل نحاسها إلى بابل."], [18, "واستولوا أيضا على القدور والرفوش والمجارف والمناضح والصحون وكل آنية النحاس التي كانت تستخدم في الهيكل."], [19, "كما أخذ رئيس الشرطة الطسوس والمجامر والمناضح والقدور والمنائر والصحون والأقداح الذهبية والفضية."], [20, "كذلك استولى على العمودين والبركة والاثني عشر ثورا من نحاس القائمة تحت القواعد التي صنعها الملك سليمان لهيكل الرب، فكان النحاس لكثرته يفوق كل وزن."], [21, "وكان طول كل عمود ثماني عشرة ذراعا (نحو تسعة أمتار)، ومحيطه اثنتي عشرة ذراعا (نحو ستة أمتار)، وسمكه أربع أصابع، وكان أجوف،"], [22, "وعليه تاج من نحاس ارتفاعه خمس أذرع (نحو مترين ونصف المتر) ويحيط بالتاج شبكة ورمانات وكلها مصنوعة من نحاس. وكان العمود الثاني مماثلا له بما في ذلك الرمانات."], [23, "وكان عدد الرمانات على محيطه ستا وتسعين رمانة، وجملة الرمان على محيط الشبكة مئة رمانة."], [24, "وأخذ رئيس الشرطة سرايا رئيس الكهنة ونائبه صفنيا الكاهن وحراس الباب الثلاثة."], [25, "واعتقل من المدينة الخصي القائد الذي كان يتولى قيادة المحاربين، كما اعتقل سبعة رجال من حاشية الملك ممن عثر عليهم في المدينة، وكذلك أمين سر قائد الجيش الذي كان يجند شعب البلد، وستين رجلا من أهل الأرض الذين كانوا قد اختبأوا داخل المدينة."], [26, "فأخذهم نبوزرادان رئيس الشرطة وساقهم إلى ملك بابل في ربلة،"], [27, "فضربهم ملك بابل وقتلهم في ربلة في منطقة حماة. وهكذا سبي شعب يهوذا من أرضه."]]}, {"l": "Eze 12:12", "n": "", "vs": [[12, "ويحمل الرئيس المتولي شؤونهم أحماله على كتفه في العتمة ويخرج. وتنقب له ثغرة في الحائط ليخرج منها وهو يغطي وجهه لئلا يرى الأرض بعينيه."]]}, {"l": "Eze 12:13", "n": "", "vs": [[13, "وأبسط شبكتي عليه فيقع في شركي، وأحضره إلى بابل إلى أرض الكلدانيين، ولكن لن يراها، هناك يموت."]]}, {"l": "Eze 17:18", "n": "", "vs": [[18, "لقد ازدرى الحلف حين نكث العهد، وها هو قد مد يد الولاء إلى مصر. ولكنه وإن فعل هذا كله لن يفلت."]]}, {"l": "Mal 2:9", "n": "", "vs": [[9, "لذلك أحقركم وأذلكم أمام جميع الناس، لأنكم لم تطيعوا طرقي، وحابيتم في تطبيق شريعتي»."]]}], "kwAr": "الملك", "noteAr": ""}], "arS": [["نقض", ["H2554"]], [" ", []], ["مظلته", ["H7900"]], [" كما ينقض كوخ من الأغصان في ", []], ["حديقة", ["H1588"]], ["، ", []], ["وردم", ["H7843"]], [" مقر ", []], ["مجتمعه", ["H4150"]], [". جعل ", []], ["الرب", ["H3068"]], [" ", []], ["صهيون", ["H6726"]], [" ", []], ["تنسى", ["H7911"]], [" ", []], ["مواسم", ["H4150"]], [" أعيادها ", []], ["وسبوتها", ["H7676"]], [". ", []], ["ونبذ", ["H5006"]], [" ", []], ["باحتدام", ["H2195"]], [" ", []], ["سخطه", ["H639"]], [" ", []], ["الملك", ["H4428"]], [" ", []], ["والكاهن", ["H3548"]], [".", []]]}, {"c": 2, "v": 7, "text": "كره الرب مذبحه، وتبرأ من مقدسه، وسلم أسوار قصورها إلى يد الأعداء الذين علا هتافهم في بيت الرب كما كان يعلو هتافنا في الأعياد.", "groups": [{"kw": "cast off", "raw": "Lam_2:1; Lev_26:31, Lev_26:44; Psa_78:59-61; Isa_64:10,Isa_64:11; Jer_7:12-14, Jer_26:6, Jer_26:18; Jer_52:13; Eze_7:20-22, Eze_24:21; Mic_3:12; Mat_24:2; Act_6:13, Act_6:14", "note": "", "refs": [{"l": "Lam 2:1", "n": "", "vs": [[1, "كيف خيم الرب في غضبه بالظلام على ابنة صهيون، وطرح من السماء إلى الأرض جلال إسرائيل، ولم يذكر موطيء قدميه في يوم سخطه؟"]]}, {"l": "Lev 26:31", "n": "", "vs": [[31, "وأحول مدنكم إلى خرائب، وأجعل مقادسكم موحشة، ولا أبتهج برائحة تقدمات سروركم،"]]}, {"l": "Lev 26:44", "n": "", "vs": [[44, "ولكن على الرغم من ذلك فإنني لم أنبذهم وهم في أرض أعدائهم، ولا كرهتهم حتى أبيدهم وأنقض ميثاقي معهم، لأني أنا الرب إلههم،"]]}, {"l": "Psa 78:59-61", "n": "", "vs": [[59, "سمع الله فغضب، وعافت نفسه إسرائيل جدا."], [60, "هجر مسكنه في شيلوه، تلك الخيمة التي نصبها مسكنا له بين الناس."], [61, "وأسلم تابوت عهد عزته إلى السبي وجلاله إلى يد العدو."]]}, {"l": "Isa 64:10", "n": "", "vs": [[10, "قد استحالت مدينتك المقدسة إلى قفر، وأصبحت صهيون برية وأورشليم موحشة،"]]}, {"l": "Isa 64:11", "n": "", "vs": [[11, "واحترق بالنار هيكلنا المقدس البهي، الذي شدا آباؤنا فيه بتسبيحك، وصار كل ما هو أثير لدينا خرابا."]]}, {"l": "Jer 7:12-14", "n": "", "vs": [[12, "لكن امضوا إلى موضعي في شيلوه، حيث جعلت فيه مقرا لاسمي أولا، وشاهدوا ما فعلت به من جراء شر شعبي إسرائيل."], [13, "والآن لأنكم ارتكبتم هذه الشرور، يقول الرب، على الرغم من تحذيراتي المبكرة التي أبيتم الاستماع لها، ورفضتم الاستجابة لدعوتي،"], [14, "فإن ما أنزلته بشيلوه سأنزله بالهيكل الذي دعي باسمي والذي عليه تتكلون، وبالموضع الذي وهبته لكم ولآبائكم،"]]}, {"l": "Jer 26:6", "n": "", "vs": [[6, "فإني أجعل هذا الهيكل نظير شيلوه، وهذه المدينة لعنة لجميع أمم الأرض»."]]}, {"l": "Jer 26:18", "n": "", "vs": [[18, "«إن ميخا المورشتي تنبأ في عهد حزقيا ملك يهوذا، وخاطب كل شعب يهوذا قائلا هذا ما يعلنه الرب القدير: إن صهيون ستحرث كحقل وتصير أورشليم كومة من الخرائب، وجبل الهيكل مرتفعا تنمو عليه أشجار الغاب."]]}, {"l": "Jer 52:13", "n": "", "vs": [[13, "وأحرق هيكل الرب وقصر الملك وجميع بيوت أورشليم، وأضرم النار في كل بيت من بيوت العظماء،"]]}, {"l": "Eze 7:20-22", "n": "", "vs": [[20, "حولوا جمال زينة هيكل الرب إلى زهو، وصنعوا من الذهب والفضة تماثيل أرجاسهم وأصنامهم المكروهة، لذلك جعلتها رجاسة لهم."], [21, "أسلمها إلى أيدي الغرباء نهبا، ولأشرار الأرض سلبا فينجسونها."], [22, "وأشيح بوجهي عنهم فيدنسون هيكلي، ويدخل إليه الناهبون وينجسونه."]]}, {"l": "Eze 24:21", "n": "", "vs": [[21, "أبلغ شعب إسرائيل: ها أنا مزمع على تنجيس مقدسي فخر عزكم ومشتهى أعينكم، وبهجة نفوسكم، فيتهاوى أبناؤكم وبناتكم الذين خلفتهم وراءكم صرعى بالسيف."]]}, {"l": "Mic 3:12", "n": "", "vs": [[12, "لهذا من جراء أعمالكم ستحرث صهيون كالحقل وتصبح أورشليم كومة من الخرائب، وجبل الهيكل مرتفعا تنمو عليه أشجار الغاب."]]}, {"l": "Mat 24:2", "n": "", "vs": [[2, "فقال لهم: «أما ترون هذه المباني كلها؟ الحق أقول لكم: لن يترك هنا حجر فوق حجر إلا ويهدم! »"]]}, {"l": "Act 6:13", "n": "", "vs": [[13, "وأقاموا عليه شهود زور ادعوا أنه: «لا يكف عن التعرض بكلامه للهيكل المقدس وللشريعة"]]}, {"l": "Act 6:14", "n": "", "vs": [[14, "فقد سمعناه يقول إن يسوع الناصري سيهدم هذا الهيكل ويغير الطقوس التي تسلمناها من موسى»."]]}], "kwAr": "كره الرب مذبحه", "noteAr": ""}, {"kw": "given up", "raw": "Heb. shut up, Lam_2:5; 2Ch_36:19; Jer_32:29, Jer_33:3, Jer_33:4, Jer_39:8; Eze_7:24; Amo_2:5", "note": "Heb. shut up, Lam_2:5; 2Ch_36:19; Jer_32:29, Jer_33:3, Jer_33:4, Jer_39:8; Eze_7:24; Amo_2:5", "refs": [{"l": "Lam 2:5", "n": "", "vs": [[5, "وأصبح الرب كعدو، فقوض إسرائيل، وهدم جميع قصورها، ودمر حصونها، وأكثر النوح والعويل في ابنة صهيون."]]}, {"l": "2Ch 36:19", "n": "", "vs": [[19, "وأحرقوا الهيكل وهدموا سور أورشليم، وأشعلوا النار في جميع قصورها، ودمروا تحفها الثمينة."]]}, {"l": "Jer 32:29", "n": "", "vs": [[29, "ويقتحمها الكلدانيون الذين يحاربون هذه المدينة، ويضرمون فيها النار ويحرقونها هي وبيوتها التي أصعدوا على سطوحها بخورا وسكائب خمر للبعل ولآلهة الأوثان، ليثيروا سخطي."]]}, {"l": "Jer 33:3", "n": "", "vs": [[3, "ادعني فأجيبك وأطلعك على عظائم وغرائب لم تعرفها."]]}, {"l": "Jer 33:4", "n": "", "vs": [[4, "لأن هذا ما يعلنه الرب إله إسرائيل عن بيوت هذه المدينة وعن قصور ملوك يهوذا التي تم هدمها، ليقام منها سور دفاع ضد متاريس الحصار والمجانيق."]]}, {"l": "Jer 39:8", "n": "", "vs": [[8, "وأحرق الكلدانيون قصر الملك وبيوت الشعب ونقضوا أسوار أورشليم."]]}, {"l": "Eze 7:24", "n": "", "vs": [[24, "لذلك، أجلب أشر الأمم فيرثون بيوتهم، وأقضي على كبرياء الأقوياء فتتنجس مقادسهم."]]}, {"l": "Amo 2:5", "n": "", "vs": [[5, "لهذا أرسل نارا على يهوذا فتلتهم حصون أورشليم."]]}], "kwAr": "سلم", "noteAr": "بالعبرانية: أغلق. انظر مرا 2: 5؛ 2أخ 36: 19؛ إر 32: 29؛ 33: 3، 4؛ 39: 8؛ حز 7: 24؛ عا 2: 5"}, {"kw": "they have", "raw": "Psa. 72:4-20, Psa_74:3-8; Eze_7:21, Eze_7:22", "note": "", "refs": [{"l": "Psa 72:4-20", "n": "", "vs": [[4, "ليحكم الملك بالحق للمساكين، وينقذ بني البائسين، ويحطم الظالم."], [5, "ليرهبوك مادامت الشمس والقمر، من جيل إلى جيل."], [6, "ليكن الملك كالمطر المنهمر على المراعي المجزوزة، كالغيوث التي تسقي الأرض."], [7, "ليزدهر في أيامه الصديق، ويتوافر السلام مادام القمر يضيء."], [8, "ولتمتد مملكته من البحر إلى البحر، ومن النهر إلى أقاصي الأرض."], [9, "أمامه يركع أهل البادية، وأعداؤه يلحسون التراب."], [10, "ملوك ترشيش والجزر يحملون إليه الهدايا. ملوك شبا وسبَإ يقدمون عطايا."], [11, "ينحني أمامه جميع الملوك. وتتعبد له كل الأمم."], [12, "لأنه ينقذ المسكين المستغيث البائس الذي لا معين له."], [13, "يعطف على الفقير والمحتاج ويخلص نفوس المساكين."], [14, "إذ يفتدي نفوسهم من الظلم والعنف، ويحفظ حياتهم لأنها ثمينة في عينيه."], [15, "ليحي الملك! ليعط له ذهب شبا. وليصلوا من أجله دائما ويطلبوا له بركة الله كل النهار."], [16, "لتتكاثر الغلال في الأرض وعلى رؤوس الجبال، وتتماوج مثل أرز لبنان، ويزهر أهل المدينة كعشب الأرض."], [17, "يخلد اسمه إلى الدهر، ويدوم اسمه كديمومة الشمس، ويتبارك الناس به، وتطوبه كل الأمم."], [18, "تبارك الرب إله إسرائيل، فهو وحده صانع العجائب."], [19, "تبارك اسمه المجيد إلى الأبد، ولتمتليء الأرض كلها من مجده. آمين ثم آمين."], [20, "هنا تنتهي صلوات داود بن يسى."]]}, {"l": "Psa 74:3-8", "n": "", "vs": [[3, "سر يارب مسرعا وسط هذه الخرائب الدائمة، فإن العدو قد دمر كل شيء في بيتك المقدس."], [4, "إن خصومك يزمجرون في وسط محفلك، وينصبون أصنامهم شارات للنصر."], [5, "يظهر العدو كأنه يهوي بالفؤوس على الأشجار الكثيفة."], [6, "هدموا منقوشاته كلها بالمطارق والمعاول."], [7, "أضرموا النار في مقدسك، ودنسوه إذ قوضوا مقر اسمك إلى الأرض."], [8, "قالوا في أنفسهم: لنبدهم جميعا. وأحرقوا كل محافل الله في البلاد."]]}, {"l": "Eze 7:21", "n": "", "vs": [[21, "أسلمها إلى أيدي الغرباء نهبا، ولأشرار الأرض سلبا فينجسونها."]]}, {"l": "Eze 7:22", "n": "", "vs": [[22, "وأشيح بوجهي عنهم فيدنسون هيكلي، ويدخل إليه الناهبون وينجسونه."]]}], "kwAr": "علا هتافهم", "noteAr": ""}], "arS": [["كره", ["H2186"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["مذبحه", ["H4196"]], ["، ", []], ["وتبرأ", ["H5010"]], [" من ", []], ["مقدسه", ["H4720"]], ["، ", []], ["وسلم", ["H5462"]], [" ", []], ["أسوار", ["H2346"]], [" ", []], ["قصورها", ["H759"]], [" إلى ", []], ["يد", ["H3027"]], [" ", []], ["الأعداء", ["H341"]], [" الذين ", []], ["علا", ["H5414"]], [" ", []], ["هتافهم", ["H6963"]], [" في ", []], ["بيت", ["H1004"]], [" ", []], ["الرب", ["H136"]], [" ", []], ["كما", ["H3117"]], [" كان يعلو هتافنا في ", []], ["الأعياد", ["H4150"]], [".", []]]}, {"c": 2, "v": 8, "text": "عزم الرب أن يقوض سور ابنة صهيون. مد خيط القياس ولم يرد يده عن سحقها، فاستبكى المترسة والسور فسقطا معا.", "groups": [{"kw": "purposed", "raw": "Lam_2:17; Isa_5:5; Jer_5:10", "note": "", "refs": [{"l": "Lam 2:17", "n": "", "vs": [[17, "نفذ الرب قضاءه، وحقق وعيده الذي حكم به منذ الحقب السالفة. هدم ولم يرأف، فأشمت بك الخصم، وعظم قوة عدوك."]]}, {"l": "Isa 5:5", "n": "", "vs": [[5, "وا لآن أخبركم ما أصنع بكرمي: سأزيل سياجه فيصبح مرعى ماشية، وأهدم سوره فيضحى مداس أقدام،"]]}, {"l": "Jer 5:10", "n": "", "vs": [[10, "اذهبوا إلى أتلام كرومها ودمروها ولكن لا تفنوها. انزعوا أغصانها لأنها ليست للرب."]]}], "kwAr": "عزم", "noteAr": ""}, {"kw": "stretched", "raw": "2Sa_8:2; 2Ki_21:13; Isa_28:17, Isa_34:11; Amo_7:7, Amo_7:8", "note": "", "refs": [{"l": "2Sa 8:2", "n": "", "vs": [[2, "وقهر أيضا الموآبيين وجعلهم يرقدون على الأرض في صفوف متراصة، وقاسهم بالحبل. فكان يقتل صفين ويستبقي صفا. فأصبح الموآبيون عبيدا لداود يدفعون له الجزية."]]}, {"l": "2Ki 21:13", "n": "", "vs": [[13, "وسأوقع على أورشليم العقاب الذي أوقعته بالسامرة، وبأخآب ونسله. وأمسح أورشليم من الوجود كما يمسح الطبق من بقايا الطعام، ثم يقلب على وجهه ليجف."]]}, {"l": "Isa 28:17", "n": "", "vs": [[17, "وسأجعل العدل خيط قياس والحق مطمارا (لأكشف عن زيف أعمالكم) فيجرف البرد معتصم الكذب وتطفو المياه على المخابيء"]]}, {"l": "Isa 34:11", "n": "", "vs": [[11, "ولا يرثها سوى الصقور والقنافذ، ويسكن فيها البوم والغراب، ويمد الرب عليها خيط الدمار ومطمار الهلاك،"]]}, {"l": "Amo 7:7", "n": "", "vs": [[7, "ثم رأيت، وإذا الرب واقف بجوار حائط مبني، وفي يده ميزان البناء."]]}, {"l": "Amo 7:8", "n": "", "vs": [[8, "فقال لي الرب: «ياعاموس، ماذا ترى؟» فأجبت: «ميزان البناء». فقال الرب: «ها أنا أمد ميزان البناء في وسط شعبي إسرائيل، ولن أعفو عنهم."]]}], "kwAr": "مد خيط القياس", "noteAr": ""}, {"kw": "he hath not", "raw": "Job_13:21; Eze_20:22", "note": "", "refs": [{"l": "Job 13:21", "n": "", "vs": [[21, "ارفع يديك عني ولا تدع هيبتك تفزعني،"]]}, {"l": "Eze 20:22", "n": "", "vs": [[22, "ولكني كففت يدي عنهم وتصرفت على غير ذلك إكراما لاسمي، لئلا يتنجس أمام عيون الأمم التي أخرجت شعب إسرائيل على مشهد منها."]]}], "kwAr": "ولم يرد", "noteAr": ""}, {"kw": "destroying", "raw": "Heb. swallowing up, Lam_2:2, Lam_2:5", "note": "Heb. swallowing up, Lam_2:2, Lam_2:5", "refs": [{"l": "Lam 2:2", "n": "", "vs": [[2, "قد هدم الرب من غير رحمة جميع مساكن يعقوب. قوض بغضبه معاقل ابنة يهوذا، وألحق العار بالمملكة وحكامها، إذ سواها بالأرض."]]}, {"l": "Lam 2:5", "n": "", "vs": [[5, "وأصبح الرب كعدو، فقوض إسرائيل، وهدم جميع قصورها، ودمر حصونها، وأكثر النوح والعويل في ابنة صهيون."]]}], "kwAr": "سحقها", "noteAr": "بالعبرانية: ابتلاع. انظر مرا 2: 2، 5"}, {"kw": "he made", "raw": "Isa_3:26; Jer_14:2", "note": "", "refs": [{"l": "Isa 3:26", "n": "", "vs": [[26, "فتنوح عليهم أبواب المدينة وتنطرح على الأرض مهجورة."]]}, {"l": "Jer 14:2", "n": "", "vs": [[2, "«أرض يهوذا تنوح وأبوابها واهية. أهلها يندبون مطروحين إلى الأرض، وعويل أورشليم قد صعد إلى العلى."]]}], "kwAr": "فاستبكى", "noteAr": ""}], "arS": [["عزم", ["H2803"]], [" ", []], ["الرب", ["H3068"]], [" أن ", []], ["يقوض", ["H7843"]], [" ", []], ["سور", ["H2346"]], [" ", []], ["ابنة", ["H1323"]], [" ", []], ["صهيون", ["H6726"]], [". ", []], ["مد", ["H5186"]], [" ", []], ["خيط", ["H6957"]], [" القياس ", []], ["ولم", ["H3808"]], [" ", []], ["يرد", ["H7725"]], [" ", []], ["يده", ["H3027"]], [" ", []], ["عن", ["H4480"]], [" ", []], ["سحقها", ["H1104"]], ["، ", []], ["فاستبكى", ["H56"]], [" ", []], ["المترسة", ["H2426"]], [" والسور ", []], ["فسقطا", ["H535"]], [" ", []], ["معا", ["H3162"]], [".", []]]}, {"c": 2, "v": 9, "text": "غاصت في الأرض بواباتها، دمر وحطم مزاليجها. نفى ملكها ورؤساءها بين الأمم. زالت الشريعة، ولم يعد أنبياؤها يحصلون على رؤيا من عند الرب.", "groups": [{"kw": "gates", "raw": "Neh_1:3; Jer_39:2, Jer_39:8, Jer_51:30, Jer_52:14", "note": "", "refs": [{"l": "Neh 1:3", "n": "", "vs": [[3, "فقالوا لي: «إن الناجين الذين بقوا من السبي، ممن رجعوا إلى هناك، يقاسون من شقاء عظيم وعار. فسور أورشليم منهدم وأبوابها محروقة بالنار»."]]}, {"l": "Jer 39:2", "n": "", "vs": [[2, "وفي اليوم التاسع من الشهر الرابع من السنة الحادية عشرة من حكم صدقيا فتحت ثغرة في سور المدينة."]]}, {"l": "Jer 39:8", "n": "", "vs": [[8, "وأحرق الكلدانيون قصر الملك وبيوت الشعب ونقضوا أسوار أورشليم."]]}, {"l": "Jer 51:30", "n": "", "vs": [[30, "قد أحجم محاربو بابل الجبابرة عن القتال، واعتصموا في معاقلهم. خارت شجاعتهم، وصاروا كالنساء. احترقت مساكن بابل وتحطمت مزاليجها."]]}, {"l": "Jer 52:14", "n": "", "vs": [[14, "وهدم كل جيش الكلدانيين المرافق لرئيس الشرطة كل أسوار أورشليم المحيطة بها."]]}], "kwAr": "بواباتها", "noteAr": ""}, {"kw": "her king", "raw": "Lam_1:3, Lam_4:15, Lam_4:20; Deu_28:36; 2Ki_24:12-16, 2Ki_25:7; Jer_52:8, Jer_52:9; Eze_12:13; Eze_17:20", "note": "", "refs": [{"l": "Lam 1:3", "n": "", "vs": [[3, "سبيت يهوذا إلى المنفى بعد كل ما عانته من عنت وعبودية، فأقامت بين الأمم شقية، وأدركها مطاردوها في خضم ضيقاتها."]]}, {"l": "Lam 4:15", "n": "", "vs": [[15, "هتفوا بهم: «ابتعدوا: تنحوا لا تلمسوا شيئا». فهربوا وتشردوا! غير أن أهل الأمم قالوا: لا يمكن أن يسكنوا معنا!"]]}, {"l": "Lam 4:20", "n": "", "vs": [[20, "وقع في حفرهم مصدر حياتنا، الملك الذي اختاره الرب، الذي قلنا: في ظله نعيش بين الأمم."]]}, {"l": "Deu 28:36", "n": "", "vs": [[36, "ينفيكم الرب أنتم وملككم الذي تختارونه إلى أمة لا تعرفونها أنتم ولا آباؤكم، حيث تعبدون هناك آلهة أخرى من خشب وحجر،"]]}, {"l": "2Ki 24:12-16", "n": "", "vs": [[12, "فاستسلم يهوياكين ملك يهوذا وأمه ورجاله وقادته وخصيانه إلى ملك بابل، فقبض عليه نبوخذناصر. وكان ذلك في السنة الثامنة لملكه."], [13, "واستولى على جميع ما في خزائن الهيكل وخزائن القصر، وحطم كل آنية الذهب التي صنعها سليمان ملك إسرائيل لهيكل الرب، تماما كما قضى الرب."], [14, "وسبى نبوخذناصر أهل أورشليم، وكل الرؤساء، وجميع رجال الحرب الأشداء، والخصيان. فكانت جملة المسبيين عشرة آلاف مسبي، كما أخذ الصناع والحدادين، ولم يترك في يهوذا سوى فقراء الشعب المساكين."], [15, "وسبى يهوياكين وأم الملك ونساءه وخصيانه وعظماء البلاد من أورشليم إلى بابل."], [16, "كما ساق سبعة آلاف من المحاربين الأشداء وألفا من الصناع والحدادين إلى بابل،"]]}, {"l": "2Ki 25:7", "n": "", "vs": [[7, "ثم قتلوا أبناء صدقيا على مرأى منه، وقلعوا عينيه، وقيدوه بسلسلتين من نحاس، وساقوه إلى بابل."]]}, {"l": "Jer 52:8", "n": "", "vs": [[8, "لكن جيش الكلدانيين تعقب الملك، وأدرك صدقيا في سهول أريحا وقد تفرق عنه جميع جيشه،"]]}, {"l": "Jer 52:9", "n": "", "vs": [[9, "فقبضوا عليه وأخذوه إلى ملك بابل في ربلة، في منطقة حماة، فأصدر عليه قضاءه."]]}, {"l": "Eze 12:13", "n": "", "vs": [[13, "وأبسط شبكتي عليه فيقع في شركي، وأحضره إلى بابل إلى أرض الكلدانيين، ولكن لن يراها، هناك يموت."]]}, {"l": "Eze 17:20", "n": "", "vs": [[20, "وأنشر شبكتي عليه فيقع في شركي، وأحضره إلى بابل وأحاكمه هناك على ما ارتكبه من تعد علي."]]}], "kwAr": "نفى ملكها", "noteAr": ""}, {"kw": "the law", "raw": "2Ch_15:3; Eze_7:26; Hos_3:4", "note": "", "refs": [{"l": "2Ch 15:3", "n": "", "vs": [[3, "لقد قضى الإسرائيليون حقبة طويلة كانوا فيها بلا إله حق، وبلا كاهن يعلمهم، وبلا شريعة."]]}, {"l": "Eze 7:26", "n": "", "vs": [[26, "وتتوالى بلية فوق بلية، وتروج إشاعة تلو إشاعة، فيطلبون رؤيا من النبي. غير أن الشريعة تنصرف عن الكاهن والمشورة عن الشيوخ."]]}, {"l": "Hos 3:4", "n": "", "vs": [[4, "لأن أبناء إسرائيل يمكثون أمدا طويلا من غير ملك أو أمير، ومن غير ذبيحة ولا تماثيل ولا أفود ولا ترافيم."]]}], "kwAr": "زالت الشريعة", "noteAr": ""}, {"kw": "her prophets", "raw": "Psa_74:9; Amo_8:11, Amo_8:12; Mic_3:6, Mic_3:7", "note": "", "refs": [{"l": "Psa 74:9", "n": "", "vs": [[9, "لم نعد نشهد رموز عبادتنا، ولم يبق نبي بعد، وليس بيننا من يعرف متى تكون خاتمة الأمر."]]}, {"l": "Amo 8:11", "n": "", "vs": [[11, "ستأتي أيام أجعل فيها المجاعة تنتشر في الأرض، لا مجاعة إلى الخبز، ولا ظمأ إلى الماء إنما لسماع كلام الرب، يقول السيد الرب."]]}, {"l": "Amo 8:12", "n": "", "vs": [[12, "فيهيمون من بحر إلى بحر، ومن الشمال إلى الشرق. يذهبون ويجيئون بحثا عن كلمة الرب ولا يحظون بها."]]}, {"l": "Mic 3:6", "n": "", "vs": [[6, "لذلك يطغى عليكم ليل خال من الرؤيا، وظلام من غير عرافة، وتغرب الشمس عن الأنبياء ويظلم عليهم النهار."]]}, {"l": "Mic 3:7", "n": "", "vs": [[7, "يعتري الرائين الخزي وينتاب العرافين الخجل، ويغطون جميعهم شفاههم لأنهم لا ينالون جوابا من الرب."]]}], "kwAr": "أنبياؤها", "noteAr": ""}], "arS": [["غاصت", ["H2883"]], [" في ", []], ["الأرض", ["H776"]], [" ", []], ["بواباتها", ["H8179"]], ["، ", []], ["دمر", ["H6"]], [" ", []], ["وحطم", ["H7665"]], [" ", []], ["مزاليجها", ["H1280"]], [". نفى ", []], ["ملكها", ["H4428"]], [" ", []], ["ورؤساءها", ["H8269"]], [" بين ", []], ["الأمم", ["H1471"]], [". زالت ", []], ["الشريعة", ["H8451"]], ["، ", []], ["ولم", ["H3808"]], [" يعد ", []], ["أنبياؤها", ["H5030"]], [" ", []], ["يحصلون", ["H4672"]], [" على ", []], ["رؤيا", ["H2377"]], [" ", []], ["من", ["H4480"]], [" عند ", []], ["الرب", ["H3068"]], [".", []]]}, {"c": 2, "v": 10, "text": "يجلس شيوخ ابنة صهيون على الأرض صامتين. عفروا بالرماد رؤوسهم، وارتدوا المسوح، وطأطأت عذارى أورشليم رؤوسهن إلى الأرض.", "groups": [{"kw": "elders", "raw": "Lam_4:5, Lam_4:16, Lam_5:12, Lam_5:14; Job_2:13; Isa_3:26, Isa_47:1, Isa_47:5", "note": "", "refs": [{"l": "Lam 4:5", "n": "", "vs": [[5, "هلك في الشوارع الذين كانوا يأكلون الطيبات، واحتضن المزابل المتربون على لبس الحرية."]]}, {"l": "Lam 4:16", "n": "", "vs": [[16, "قد بددهم الرب نفسه، ولم يعد يعبأ بهم، لم يكرموا الكهنة ولم يترَأفوا بالشيوخ."]]}, {"l": "Lam 5:12", "n": "", "vs": [[12, "علق النبلاء بأيديهم ولم يوقروا الشيوخ."]]}, {"l": "Lam 5:14", "n": "", "vs": [[14, "هجر الشيوخ بوابة المدينة، وكف الشبان عن غنائهم."]]}, {"l": "Job 2:13", "n": "", "vs": [[13, "ومكثوا جالسين معه على الأرض سبعة أيام وسبع ليال، لم يكلمه فيها أحد منهم بكلمة لشدة ما كان عليه من كآبة."]]}, {"l": "Isa 3:26", "n": "", "vs": [[26, "فتنوح عليهم أبواب المدينة وتنطرح على الأرض مهجورة."]]}, {"l": "Isa 47:1", "n": "", "vs": [[1, "انزلي واجلسي على التراب أيتها العذراء ابنة بابل. اجلسي على الأرض لا على العرش ياابنة الكلدانيين، لأنك لن تدعي من بعد الناعمة المترفهة."]]}, {"l": "Isa 47:5", "n": "", "vs": [[5, "اجلسي صامتة وأوغلي في الظلام ياابنة الكلدانيين، لأنك لن تدعي بعد سيدة الممالك."]]}], "kwAr": "شيوخ ابنة صهيون", "noteAr": ""}, {"kw": "sit", "raw": "Sitting on the ground was a posture of mourning and deep distress. Hence the coin struck by Vespasian, on the capture of Jerusalem, has on the obverse side a palm tree, the emblem of Judea, and under it a woman, the emblem of Jerusalem, sitting down, with her elbow on her knee, and her head supported by her hand, with the legend Judea capta. Lam_1:1", "note": "Sitting on the ground was a posture of mourning and deep distress. Hence the coin struck by Vespasian, on the capture of Jerusalem, has on the obverse side a palm tree, the emblem of Judea, and under it a woman, the emblem of Jerusalem, sitting down, with her elbow on her knee, and her head supported by her hand, with the legend Judea capta. Lam_1:1", "refs": [{"l": "Lam 1:1", "n": "", "vs": [[1, "كيف أصبحت المدينة الآهلة بالسكان مهجورة وحيدة؟ صارت كأرملة! هذه التي كانت عظيمة بين الأمم. السيدة بين المدن صارت تحت الجزية!"]]}], "kwAr": "يجلس", "noteAr": "كان الجلوس على الأرض وضع حداد وضيق شديد. ومن هنا فإن العملة التي سكّها فسباسيان عند الاستيلاء على أورشليم عليها في وجهها نخلة، رمز اليهودية، وتحتها امرأة، رمز أورشليم، جالسة وقد أسندت مرفقها إلى ركبتها ورأسها بيدها، مع نقش: Judea capta (اليهودية المأسورة). انظر مرا 1: 1"}, {"kw": "and keep", "raw": "Lam_3:28; Jer_8:14; Amo_5:13, Amo_8:3", "note": "", "refs": [{"l": "Lam 3:28", "n": "", "vs": [[28, "ليعتكف وحيدا في صمت لأن الرب قد وضع النير عليه."]]}, {"l": "Jer 8:14", "n": "", "vs": [[14, "فما لنا قابعون هنا؟ اجتمعوا معا ولنلجأ إلى المدن الحصينة ونهلك هناك، لأن الرب إلهنا قد قضى علينا بالهلاك، وأعطانا ماء مسموما لنشربه، لأننا أخطأنا في حقه."]]}, {"l": "Amo 5:13", "n": "", "vs": [[13, "لهذا يصمت العاقل في مثل هذا الزمان الرديء."]]}, {"l": "Amo 8:3", "n": "", "vs": [[3, "فتتحول أغاني قصورهم إلى عويل في ذلك اليوم، وتكثر الجثث ويطرحونها في كل مكان بصمت»."]]}], "kwAr": "صامتين", "noteAr": ""}, {"kw": "cast up", "raw": "Jos_7:6; 2Sa_13:19; Job_2:12; Rev_18:19", "note": "", "refs": [{"l": "Jos 7:6", "n": "", "vs": [[6, "فمزق يشوع ثيابه وأكب على وجهه إلى الأرض أمام تابوت الرب إلى المساء، هو وشيوخ إسرائيل، وأهالوا التراب على رؤوسهم."]]}, {"l": "2Sa 13:19", "n": "", "vs": [[19, "فمزقت الثوب الملون وعفرت رأسها بالرماد ووضعت عليه يدها ومضت باكية."]]}, {"l": "Job 2:12", "n": "", "vs": [[12, "وإذ رأوه من ], [" ", []], ["أورشليم", ["H3389"]], [" رؤوسهن إلى ", []], ["الأرض", ["H776"]], [".", []]]}, {"c": 2, "v": 11, "text": "كلت عيناي من البكاء، جاشت أحشائي وأريقت كبدي على الأرض حزنا لدمار ابنة شعبي، لأن الأطفال والرضع غشي عليهم في شوارع المدينة.", "groups": [{"kw": "eyes", "raw": "Lam_1:16, Lam_3:48-51; 1Sa_30:4; Psa_6:7, Psa_31:9, Psa_69:3; Isa_38:14", "note": "", "refs": [{"l": "Lam 1:16", "n": "", "vs": [[16, "على هذه كلها أبكي. عيناي، عيناي تفيضان بالدموع، إذ ابتعد عني كل معز ينعش نفسي. هلك أبنائي لأن العدو قد ظفر."]]}, {"l": "Lam 3:48-51", "n": "", "vs": [[48, "تفيض عيناي بأنهار مياه على دمار ابنة شعبي."], [49, "لن تكف عيناي عن البكاء أبدا،"], [50, "حتى يشرف الرب من السماء ويبصر."], [51, "تتلف عيناي على مصير كل بنات مدينتي."]]}, {"l": "1Sa 30:4", "n": "", "vs": [[4, "فعلت أصواتهم بالبكاء حتى أصابهم الإعياء."]]}, {"l": "Psa 6:7", "n": "", "vs": [[7, "وهنت عيناي من فرط الغم، وكلتا بسبب جميع خصومي."]]}, {"l": "Psa 31:9", "n": "", "vs": [[9, "ارحمني يارب فأنا في ضيق: كلت عيناي غما، واعتلت نفسي ودخيلتي أيضا."]]}, {"l": "Psa 69:3", "n": "", "vs": [[3, "تعبت من صراخي. جف حلقي. كلت عيناي وأنا أنتظر إلهي."]]}, {"l": "Isa 38:14", "n": "", "vs": [[14, "أصيح كسنونة، وأنوح كهديل الحمامة. كلت عيناي من النظر إلى السماء، يارب إني متضايق فكن لي مأمنا."]]}], "kwAr": "كلت عيناي", "noteAr": ""}, {"kw": "my bowels", "raw": "Lam_1:20; Jer_4:19", "note": "", "refs": [{"l": "Lam 1:20", "n": "", "vs": [[20, "انظر يارب فإني في ضيقة. أحشائي جائشة وقلبي متلاطم في داخلي، لأني أكثرت التمرد. ها السيف يثكل في الخارج وفي البيت يسود الموت."]]}, {"l": "Jer 4:19", "n": "", "vs": [[19, "لشد ما أتعذب! لشد ما أتعذب! قلبي يتلوى ألما. فؤادي يئن في داخلي فلا أستطيع الصمت، لأني سمعت دوي البوق وصيحات القتال."]]}], "kwAr": "جاشت أحشائي", "noteAr": ""}, {"kw": "my liver", "raw": "Job_16:13; Psa_22:14", "note": "", "refs": [{"l": "Job 16:13", "n": "", "vs": [[13, "حاصرني رماته وشق كليتي من غير رحمة، أهرق مرارتي على الأرض."]]}, {"l": "Psa 22:14", "n": "", "vs": [[14, "صارت قوتي كالماء، وانحلت عظامي. صار قلبي  {"l": "Jer 6:13", "n": "", "vs": [[13, "لأنهم جميعا، صغارهم وكبارهم، مولعون بالربح الحرام. حتى النبي والكاهن يرتكبان الزور في أعمالهما."]]}, {"l": "Jer 6:14", "n": "", "vs": [[14, "يعالجون جراح شعبي باستخفاف قائلين: سلام، سلام. في حين لا يوجد سلام."]]}, {"l": "Jer 8:10", "n": "", "vs": [[10, "لذلك أعطي نساءهم لآخرين وحقولهم للوارثين القاهرين، لأنهم جميعا من صغيرهم إلى كبيرهم مولعون بالربح. حتى النبي والكاهن يرتكبان الزور في أعمالهما،"]]}, {"l": "Jer 8:11", "n": "", "vs": [[11, "ويعالجون جراح شعبي باستخفاف قائلين: سلام، سلام في حين لا يوجد سلام."]]}, {"l": "Jer 14:13-15", "n": "", "vs": [[13, "ثم قلت: «آه أيها السيد الرب، ها الأنبياء الكذبة يقولون لهم: لن تتعرضوا للسيف ولا للجوع، بل أنعم عليكم بسلام محقق في هذا الموضع»."], [14, "وقال لي الرب: «إن الأنبياء يتنبأون زورا باسمي وأنا لم أرسلهم ولم آمرهم، ولم أكلمهم، إنما هم يتنبأون لكم برؤيا كاذبة وعرافة باطلة مستوحاة من ضلال قلوبهم."], [15, "لذلك هكذا يقول الرب عن هؤلاء الأنبياء المتنبئين باسمي: مع أني لم أرسلهم فإنهم يقولون: لن تبتلى هذه الأرض بسيف ولا مجاعة، لهذا فإن هولاء الأنبياء يفنون بالسيف والمجاعة."]]}, {"l": "Jer 23:11-17", "n": "", "vs": [[11, "ويقول الرب: «النبي والكاهن كافران، وفي بيتي وجدت شرهما."], [12, "لذلك يضحي طريقهما مزالق لهما، تفضي بهما إلى الظلمات التي يطردون إليها، ويهويان فيها لأني أجلب عليهما شرا في سنة عقابهما»."], [13, "في أوساط أنبيا ء السامرة شهدت أمورا كريهة، إذ تنبأوا باسم البعل، وأضلوا شعبي إسرائيل."], [14, "وفي أوساط أنبياء أورشليم رأيت أمورا مهولة: يرتكبون الفسق، ويسلكون في الأكاذيب، يشددون أيدي فاعلي الإثم لئلا يتوب أحد عن شره. صاروا جميعا كسكان سدوم وأصبح أهلها كأهل عمورة."], [15, "لذلك هذا ما يقوله الرب القدير عن الأنبياء: «ها أنا أطعمهم أفسنتينا وأسقيهم ماء مسموما، لأنه من أنبياء أورشليم شاع الكفر في كل أرجاء الأرض»."], [16, "«لا تسمعوا لأقوال الأنبياء الذين يتنبأون لكم ويخدعونكم بالأوهام، لأنهم ينطقون برؤى مخيلاتهم، ولا يتكلمون بما أوحى به فمي."], [17, "قائلين بإصرار لمن يحتقرونني: قد أعلن الرب أن السلام يسودكم ويرددون لكل من يجري وراء أهواء قلبه: لن يصيبكم ضر."]]}, {"l": "Jer 27:14-16", "n": "", "vs": [[14, "لا تستمعوا لكلام الأنبياء الكذبة الذين يقولون لكم: لا تستعبدوا لملك بابل لأنهم يتنبأون لكم كذبا،"], [15, "فأنا لم أرسلهم، يقول الرب، إنما هم يتنبأون باسمي كذبا لأجلكم فتطردون أنتم وأنبياؤكم المتنبئون لكم»."], [16, "وقلت للكهنة وكل الشعب: «هذا ما يعلنه الرب: لا تسمعوا لكلام أنبيائكم الكذبة الذين يتنبأون لكم قائلين إن آنية هيكل الرب سترد سريعا من بابل، فإنهم يتنبأون لكم كذبا."]]}, {"l": "Jer 28:15", "n": "", "vs": [[15, "وأضاف إرميا النبي مخاطبا حننيا المتنبيء: «اسمع ياحننيا، هذا ما يعلنه الرب: إن الرب لم يبعثك، وأنت جعلت هذا الشعب يصدق كذبك."]]}, {"l": "Jer 29:8", "n": "", "vs": [[8, "لأن هذا ما يعلنه الرب القدير إله إسرائيل: لا يخدعنكم أنبياؤكم الكذبة المقيمون في وسطكم، والعرافون. لا تستمعوا إلى أحلامهم التي توهمكم بالأمل،"]]}, {"l": "Jer 29:9", "n": "", "vs": [[9, "لأنهم يتنبأون لكم باسمي كذبا، وأنا لم أبعثهم»، يقول الرب."]]}, {"l": "Jer 37:19", "n": "", "vs": [[19, "وأين أنبياؤكم الذين تنبأوا لكم قائلين: إن ملك بابل لن يزحف عليكم وعلى هذه الأرض؟"]]}, {"l": "Eze 13:2-16", "n": "", "vs": [[2, "«ياابن آدم، تنبأ على أنبياء إسرائيل الكذبة المتنبئين من عند أنفسهم وقل لهم: اسمعوا كلمة الرب."], [3, "ويل للأنبياء الحمقى الضالين وراء أرواحهم من غير أن يروا شيئا."], [4, "أنبياؤك ياإسرائيل هم كالثعالب في الخرائب."], [5, "لم تبرزوا إلى الثغرات، ولم تشيدوا جدارا حول بيت إسرائيل لتصمدوا في القتال في يوم الرب،"], [6, "إنما رؤياهم باطلة، وعرافتهم كاذبة. يقولون: يقول الرب، والرب لم يرسلهم، ومع ذلك يطمعون في تحقيق كلمتهم."], [7, "ألم تروا رؤيا باطلة، وتنطقوا بعرافة كاذبة قائلين: يقول الرب، وأنا لم أتكلم؟"], [8, "لذلك يعلن الرب: لأنكم تكلمتم باطلا وادعيتم رؤيا كاذبة، فها أنا أنقلب عليكم يقول السيد الرب."], [9, "فتكون يدي على الأنبياء ذوي الرؤيا الباطلة والعرافة الكاذبة، فلا يكون لهم مقام في جماعة شعبي، ولا تدون أسماؤهم في كتاب بيت إسرائيل، ولا يدخلون أرض إسرائيل، فتدركون أني أنا السيد الرب."], [10, "لأنهم حقا أضلوا شعبي قائلين: سيكون لكم سلام مع أنه ليس هناك سلام، فكان شعبي يبني حائطا وهم يطلونه بماء الكلس."], [11, "قل للطالين بماء الكلس: إن الحائط يتداعى، إذ ينهمر مطر جارف. وأنتن ياحجارة البر د تساقطن، ولتعصف به ريح جائحة."], [12, "فلا يلبث السور أن ينهار أفلا تسألون آنئذ: أين الطين الذي طينتم به؟"], [13, "لذلك، هذا ما يعلنه السيد الرب: ها أنا أجعل ريحا عاتية تخترق السور بفعل حنقي، ومطرا جارفا ينهمر في خضم غضبي، وحجارة برد تتساقط في أثناء سخطي لكي تهلك،"], [14, "فأهدم السور الذي طليتموه بماء الكلس وأسويه بالأرض فيتعرى أساسه وتتداعى المدينة وتفنون جميعا في وسطها فتدركون أني أنا الرب."], [15, "فأنفث غضبي بالسور وبمن يطلونه بماء الكلس وأقول لكم: قد تلاشى السور والذين يطلونه."], [16, "الذين هم أنبياء إسرائيل الأدعياء، المتنبئون لإسرائيل، الذين يرون لها رؤى سلام، مع أنه لا سلام هناك، يقول السيد الرب."]]}, {"l": "Mic 2:11", "n": "", "vs": [[11, "إن جال رجل يتنبأ بينكم بالكذب وباللغو الباطل قائلا: إنني أتنبأ لكم بالخمر الوفير والمسكر، فإنه يصبح نبي هذا الشعب."]]}, {"l": "Mic 3:5-7", "n": "", "vs": [[5, "وهذا ما يقوله الرب بشأن الأنبياء الذين يضلون شعبه، الذين ينادون قائلين: «سلام» لمن يعطيهم طعاما، ويعلنون الحرب على من لا يلقم أفواههم."], [6, "لذلك يطغى عليكم ليل خال من الرؤيا، وظلام من غير عرافة، وتغرب الشمس عن الأنبياء ويظلم عليهم النهار."], [7, "يعتري الرائين الخزي وينتاب العرافين الخجل، ويغطون جميعهم شفاههم لأنهم لا ينالون جوابا من الرب."]]}, {"l": "2Pe 2:1-3", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."], [2, "وكثيرون سيسيرون وراءهم في طرق الإباحية. وبسببهم توجه الإهانة إلى طريق الحق."], [3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}], "kwAr": "أنبياؤك", "noteAr": ""}, {"kw": "they have", "raw": "Isa_58:1; Jer_23:22; Eze_13:22", "note": "", "refs": [{"l": "Isa 58:1", "n": "", "vs": [[1, "ناد بأعلى صوتك، لا تصمت. اهتف بصوتك كنفير بوق، وأخبر شعبي بإثمهم، وذرية يعقوب بخطاياهم."]]}, {"l": "Jer 23:22", "n": "", "vs": [[22, "لو مثلوا حقا في مجلسي لبلغوا كلامي لشعبي، ولكانوا ردوهم عن مساوئهم وعن شر أعمالهم."]]}, {"l": "Eze 13:22", "n": "", "vs": [[22, "لأنكن أحزنتن قلب الصديق بأكاذيبكن، مع أنني لم أحزنه، وشددتن عزائم الشرير لئلا يرجع عن طريقه الأثيمة فيحيا."]]}], "kwAr": "لم يفضحوا إثمك", "noteAr": ""}, {"kw": "false", "raw": "Jer_23:14-17, Jer_23:31, Jer_23:32, Jer_27:9, Jer_27:10; Eze_22:25, Eze_22:28; Mic_3:5; Zep_3:4", "note": "", "refs": [{"l": "Jer 23:14-17", "n": "", "vs": [[14, "وفي أوساط أنبياء أورشليم رأيت أمورا مهولة: يرتكبون الفسق، ويسلكون في الأكاذيب، يشددون أيدي فاعلي الإثم لئلا يتوب أحد عن شره. صاروا جميعا كسكان سدوم وأصبح أهلها كأهل عمورة."], [15, "لذلك هذا ما يقوله الرب القدير عن الأنبياء: «ها أنا أطعمهم أفسنتينا وأسقيهم ماء مسموما، لأنه من أنبياء أورشليم شاع الكفر في كل أرجاء الأرض»."], [16, "«لا تسمعوا لأقوال الأنبياء الذين يتنبأون لكم ويخدعونكم بالأوهام، لأنهم ينطقون برؤى مخيلاتهم، ولا يتكلمون بما أوحى به فمي."], [17, "قائلين بإصرار لمن يحتقرونني: قد أعلن الرب أن السلام يسودكم ويرددون لكل من يجري وراء أهواء قلبه: لن يصيبكم ضر."]]}, {"l": "Jer 23:31", "n": "", "vs": [[31, "وأقاوم الأنبياء الذين يسخرون ألسنتهم قائلين: الرب يقول هذا."]]}, {"l": "Jer 23:32", "n": "", "vs": [[32, "ها أنا أقاوم المتنبئين بأحلام كاذبة ويقصونها مضلين شعبي بأكاذيبهم واستخفافهم، مع أني لم أرسلهم ولم أكلفهم بشيء. ولا جدوى منهم لهذا الشعب."]]}, {"l": "Jer 27:9", "n": "", "vs": [[9, "فلا تصغوا إلى أنبيائكم الكذبة وعرافيكم وحالميكم وعائفيكم وسحرتكم القائلين لكم: لن تستعبدوا لملك بابل،"]]}, {"l": "Jer 27:10", "n": "", "vs": [[10, "لأنهم إنما يتنبأون لكم بالباطل ليبعدوكم عن أرضكم ولأجليكم عنها فتهلكوا"]]}, {"l": "Eze 22:25", "n": "", "vs": [[25, "تواطأ أنبياؤها الكذبة فيها مثل أسد مزمجر يمزق الفريسة. التهموا نفوسا، واستولوا على نفائس الناس وكنوزهم، وكثروا أراملها فيها."]]}, {"l": "Eze 22:28", "n": "", "vs": [[28, "وأنبياؤها قد طلوا لهم بماء الكلس، إذ يرون لهم رؤى باطلة، ويعرفون لهم عرافة كاذبة قائلين: هذا ما يعلنه السيد الرب، مع أن الرب لم يعلن شيئا."]]}, {"l": "Mic 3:5", "n": "", "vs": [[5, "وهذا ما يقوله الرب بشأن الأنبياء الذين يضلون شعبه، الذين ينادون قائلين: «سلام» لمن يعطيهم طعاما، ويعلنون الحرب على من لا يلقم أفواههم." ن جراء غضبه وسخطه."], [24, "فتقول جميع الأمم: لماذا فعل الرب هذا كله بهذه الأرض؟ ولماذا احتدام هذا الغضب العظيم؟"], [25, "فيكون الجواب: لأن هذا الشعب نقض عهد الرب إله آبائهم الذي قطعه معهم حين أخرجهم من ديار مصر،"], [26, "وغووا وعبدوا آلهة أخرى وسجدوا لها، آلهة غريبة لم يعرفوها ولم يعطها الرب لهم،"], [27, "فالتهب غضب الرب على تلك الأرض، فصب عليها كل اللعنات المدونة فى هذا الكتاب"], [28, "واجتثهم من أرضهم بغضب وسخط وغيظ عظيم، وطوح بهم إلى أرض أخرى كما هو حادث اليوم."]]}, {"l": "1Ki 9:7-9", "n": "", "vs": [[7, "فإني أبيد إسرائيل عن وجه الأرض التي وهبتها لهم، وأنبذ الهيكل الذي قدسته لاسمي، فيصبح إسرائيل مثلا ومثار هزء لجميع الأمم."], [8, "ويصبح هذا الهيكل عبرة يثير عجب كل من يمر به، فيصفر ويتساءل: لماذا صنع الرب هكذا بهذه الأرض وبهذا الهيكل؟"], [9, "فيأتيهم الجواب: لأنهم تركوا الرب إلههم الذي أخرج آباءهم من ديار مصر، وتشبثوا بآلهة أخرى وسجدوا لها وعبدوها، لذلك جلب الرب عليهم كل هذا البلاء»."]]}, {"l": "2Ch 7:21", "n": "", "vs": [[21, "ويغدو هذا الهيكل الذي كان شامخا عبرة يثير عجب كل من يمر به، فيتساءل: لماذا صنع الرب هكذا بهذه الأرض وبهذا الهيكل؟"]]}, {"l": "Jer 18:16", "n": "", "vs": [[16, "فتصبح أرضه خرابا، مثار صفير دهشة، وكل من يعبر بها يعتريه رعب ويهز رأسه."]]}], "kwAr": "عابري", "noteAr": ""}, {"kw": "by", "raw": "Heb. by the way", "note": "Heb. by the way", "refs": [], "kwAr": "السبيل", "noteAr": "بالعبرانية: في الطريق."}, {"kw": "clap", "raw": "Lam_1:8; Job_27:22, Job_27:23; Eze_25:6; Nah_3:19", "note": "", "refs": [{"l": "Lam 1:8", "n": "", "vs": [[8, "ارتكبت أورشليم خطيئة نكراء فأصبحت رجسة. جميع مكرميها يحتقرونها لأنهم شهدوا عريها، أما هي فتنهدت وتراجعت القهقرى."]]}, {"l": "Job 27:22", "n": "", "vs": [[22, "تطبق عليه من غير رحمة وهو هارب من وجه عنفوانها."]]}, {"l": "Job 27:23", "n": "", "vs": [[23, "تصفر الريح عليه، وترعبه بقوتها المدمرة."]]}, {"l": "Eze 25:6", "n": "", "vs": [[6, "لأنك صفقت بكفيك طربا، وخبطت برجليك، وفرحت بكل ما فيك من لؤم لما حل بأرض إسرائيل."]]}, {"l": "Nah 3:19", "n": "", "vs": [[19, "لا جبر لكسرك، وجرحك مميت. وكل من يسمع بما جرى لك يصفق
