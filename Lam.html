"v": 35, "text": "ولا أن يجور أحد على حقوق الإنسان، أمام عيني الرب العلي", "groups": [{"kw": "turn", "raw": "Psa_12:5, Psa_140:12; Pro_17:15, Pro_22:22, Pro_23:10; Zec_1:15, Zec_1:16", "note": "", "refs": [{"l": "Psa 12:5", "n": "", "vs": [[5, "ولكن الرب يقول: إنقاذا للمساكين، واستجابة لتنهدات المظلومين، أهب الآن لأفرج كربة المتضايقين."]]}, {"l": "Psa 140:12", "n": "", "vs": [[12, "قد علمت أن الرب ينصف دعوى المساكين ويحكم بالحق للمحتاجين."]]}, {"l": "Pro 17:15", "n": "", "vs": [[15, "مبريء المذنب ومذنب البريء كلاهما رجس عند الرب."]]}, {"l": "Pro 22:22", "n": "", "vs": [[22, "لا تسلب الفقير لأنه فقير، ولا تسحق البائس الماثل عند الباب،"]]}, {"l": "Pro 23:10", "n": "", "vs": [[10, "لا تنقل معالم تخم قديم، ولا تدخل حقول الأيتام،"]]}, {"l": "Zec 1:15", "n": "", "vs": [[15, "ولكن غضبي متأجج على الأمم المتنعمة. لقد اغتظت قليلا من شعبي إلا أنهم زادوا من فواجعهم."]]}, {"l": "Zec 1:16", "n": "", "vs": [[16, "لذلك يقول الرب سأرجع إلى أورشليم بفيض من المراحم، فيبنى هيكلي فيها وتعمر أورشليم، يقول الرب القدير."]]}], "kwAr": "يجور أحد على حقوق الإنسان", "noteAr": ""}, {"kw": "the most High", "raw": "or, a superior", "note": "or, a superior", "refs": [], "kwAr": "الرب العلي", "noteAr": "أو: أعلى."}], "arS": [["ولا أن ", []], ["يجور", ["H5186"]], [" أحد على ", []], ["حقوق", ["H4941"]], [" ", []], ["الإنسان", ["H1397"]], ["، ", []], ["أمام", ["H6440"]], [" عيني الرب ", []], ["العلي", ["H5945"]]]}, {"c": 3, "v": 36, "text": "أو أن لا ينصف الإنسان في دعواه. ألا يرى الرب هذه الأمور؟", "groups": [{"kw": "the Lord", "raw": "2Sa_11:27; Isa_59:15; Hab_1:13", "note": "", "refs": [{"l": "2Sa 11:27", "n": "", "vs": [[27, "وحين انقضت فترة الحداد، أرسل داود وأحضرها إلى القصر وتزوجها وولدت ابنا ولكن الرب استاء من هذا الأمر الذي ارتكبه داود."]]}, {"l": "Isa 59:15", "n": "", "vs": [[15, "أضحى الحق مفقودا، والحائد عن الشر ضحية. رأى الرب ذلك فأسخطه فقدان الإنصاف."]]}, {"l": "Hab 1:13", "n": "", "vs": [[13, "إن عينيك أطهر من أن تشهدا الشر، وأنت لا تطيق رؤية الظلم، فكيف تحتمل مشاهدة الأثمة، وتصمت عندما يبتلع المنافقون من هم أبر منهم؟"]]}], "kwAr": "الرب هذه الأمور", "noteAr": ""}, {"kw": "approveth", "raw": "Heb. seeth", "note": "Heb. seeth", "refs": [], "kwAr": "ألا يرى", "noteAr": "بالعبرانية: يرى."}], "arS": [["أو", ["H3808"]], [" أن لا ", []], ["ينصف", ["H5791"]], [" ", []], ["الإنسان", ["H120"]], [" في ", []], ["دعواه", ["H7379"]], [". ألا ", []], ["يرى", ["H7200"]], [" ", []], ["الرب", ["H136"]], [" هذه الأمور؟", []]]}, {"c": 3, "v": 37, "text": "من ذا الذي يقضي بأمر فيتحقق إن لم يكن الرب قد أمر به؟", "groups": [{"kw": "saith", "raw": "Psa_33:9-11; Pro_16:9, Pro_19:21, Pro_21:30; Isa_46:10; Dan_4:35; Rom_9:15; Eph_1:11; Jam_4:13-15", "note": "", "refs": [{"l": "Psa 33:9-11", "n": "", "vs": [[9, "قال كلمة فكان. وأمر فصار!"], [10, "الرب أحبط مؤامرة الأمم. أبطل أفكار الشعوب."], [11, "أما مقاصد الرب فتثبت إلى الأبد، وأفكار قلبه تدوم مدى الدهور."]]}, {"l": "Pro 16:9", "n": "", "vs": [[9, "عقل الإنسان يسعى في تخطيط طريقه، والرب يوجه خطواته."]]}, {"l": "Pro 19:21", "n": "", "vs": [[21, "كثيرة هي نوايا قلب الإنسان، إنما مشورة الرب هي التي تسود."]]}, {"l": "Pro 21:30", "n": "", "vs": [[30, "ليس من حكمة، ولا من مشورة، ولا من فطنة بقادر ة على مقاومة الله."]]}, {"l": "Isa 46:10", "n": "", "vs": [[10, "وقد أنبأت بالنهاية منذ البدء، وأخبرت من القدم بأمور لم تكن قد حدثت بعد، قائلا: مقاصدي لابد أن تتم، ومشيئتي لابد أن تتحقق."]]}, {"l": "Dan 4:35", "n": "", "vs": [[35, "وعرفت أن كل أهل الأرض لا يحسبون شيئا، وأنه يفعل ما يشاء في جند السماء وسكان الأرض، وليس من يكف يده أو يقول له: ماذا تفعل؟"]]}, {"l": "Rom 9:15", "n": "", "vs": [[15, "فإنه يقول لموسى: «إني أرحم من أرحمه، وأشفق على من أشفق عليه!»"]]}, {"l": "Eph 1:11", "n": "", "vs": [[11, "وفي المسيح أيضا قد حصلنا على الميراث الذي سبق أن عينا له، وفقا لقصده، هو الذي يعمل كل شيء كما تقضي مشيئته."]]}, {"l": "Jam 4:13-15", "n": "", "vs": [[13, "وأنتم، يامن تخططون قائلين: «اليوم أو غدا، نذهب إلى مدينة كذا، ونقضي هناك سنة، فنتاجر ونربح...»"], [14, "مهلا! فأنتم لا تعرفون ماذا يحدث غدا! وما هي حياتكم؟ إنها بخار، يظهر فترة قصيرة ثم يتلاشى!"], [15, "بدلا من ذلك، كان يجب أن تقولوا: «إن شاء الرب، نعيش ونعمل هذا الأمر أو ذاك!»"]]}], "kwAr": "يقضي بأمر", "noteAr": ""}], "arS": [["من", ["H4310"]], [" ", []], ["ذا", ["H2088"]], [" الذي يقضي ", []], ["بأمر", ["H559"]], [" فيتحقق إن ", []], ["لم", ["H3808"]], [" ", []], ["يكن", ["H1961"]], [" ", []], ["الرب", ["H136"]], [" قد ", []], ["أمر", ["H6680"]], [" به؟", []]]}, {"c": 3, "v": 38, "text": "أليس من فم العلي يصدر الضر والخير؟", "groups": [{"kw": "", "raw": "Job_2:10; Psa_75:7; Pro_29:26; Isa_45:7; Amo_3:6", "note": "", "refs": [{"l": "Job 2:10", "n": "", "vs": [[10, "فأجابها: «أنت تتكلمين كالجاهلات! أنقبل الخير من عند الله والشر لا نقبل؟». في هذا كله لم ترتكب شفتا أيوب خطأ في حق الله."]]}, {"l": "Psa 75:7", "n": "", "vs": [[7, "فالله هو الديان، يرفع واحدا ويخفض آخر."]]}, {"l": "Pro 29:26", "n": "", "vs": [[26, "كثيرون يلتمسون رضى المتسلط، إنما من الرب يصدر قضاء كل إنسان."]]}, {"l": "Isa 45:7", "n": "", "vs": [[7, "أنا مبدع النور وخالق الظلمة، أنا صانع الخير وخالق الضر، أنا هو الرب فاعل كل هذه."]]}, {"l": "Amo 3:6", "n": "", "vs": [[6, "أيدوي بوق في المدينة ولا يعتري الشعب الخوف؟ أيقع بلاء في المدينة ما لم يكن الرب قد أرسله؟"]]}], "kwAr": "", "noteAr": ""}], "arS": [["أليس", ["H3808"]], [" ", []], ["من", ["H4480"]], [" ", []], ["فم", ["H6310"]], [" ", []], ["العلي", ["H5945"]], [" ", []], ["يصدر", ["H3318"]], [" ", []], ["الضر", ["H7451"]], [" ", []], ["والخير", ["H2896"]], ["؟", []]]}, {"c": 3, "v": 39, "text": "فلماذا يشتكي الإنسان الحي حين يعاقب على خطاياه؟", "groups": [{"kw": "doth", "raw": "Lam_3:22; Num_11:11; Pro_19:3; Isa_38:17-19", "note": "", "refs": [{"l": "Lam 3:22", "n": "", "vs": [[22, "من إحسانات الرب أننا لم نفن، لأن مراحمه لا تزول."]]}, {"l": "Num 11:11", "n": "", "vs": [[11, "فقال موسى للرب: «لماذا أسأت إلى عبدك ولم ترض عنه حتى إنك حملته مسئولية هذا الشعب؟"]]}, {"l": "Pro 19:3", "n": "", "vs": [[3, "عندما تسيء حماقة الإنسان إلى حياته، يسخط قلبه على الله."]]}, {"l": "Isa 38:17-19", "n": "", "vs": [[17, "حقا إن ما قاسيته من مرارة كان من أجل خيري، فقد حفظتني بحبك من حفرة الهلاك، وألقيت جميع خطاياي خلف ظهرك."], [18, "لأنه ليس في وسع الهاوية أن تحمدك، والموت لا يسبحك، ولا يقدر الذين ذهبوا إلى الهاوية أن يرجوا أمانتك."], [19, "الأحياء وحدهم يسبحونك كما أفعل اليوم، ويحدث الآباء أبناءهم عن أمانتك"]]}], "kwAr": "فلماذا", "noteAr": ""}, {"kw": "complain", "raw": "or, murmur", "note": "or, murmur", "refs": [], "kwAr": "يشتكي", "noteAr": "أو: يتذمر."}, {"kw": "a man", "raw": "Gen_4:5-7, Gen_4:13, Gen_4:14; Lev_26:41, Lev_26:43; Num_16:41, Num_17:12; Jos_7:6-13; 2Sa_6:7, 2Sa_6:8; 2Ki_3:13, 2Ki_6:32; Ezr_9:13; Job_11:6; Isa_51:20; Jon_2:3, Jon_2:4; Jon_4:8, Jon_4:9; Mic_7:9; Heb_12:5-12; Rev_16:9", "note": "", "refs": [{"l": "Gen 4:5-7", "n": "", "vs": [[5, "لكنه لم يتقبل قربان قايين ولم يرض عنه. فاغتاظ قايين جدا وتجهم وجهه كمدا."], [6, "فسأل الرب قايين: «لماذا اغتظت؟ لماذا تجهم وجهك؟"], [7, "لو أحسنت في تصرفك ألا يشرق وجهك فرحا؟ وإن لم تحسن التصرف، فعند الباب خطيئة تنتظرك، تتشوق أن تتسلط عليك، لكن يجب أن تتحكم فيها»"]]}, {"l": "Gen 4:13", "n": "", "vs": [[13, "فقال قايين للرب: «عقوبتي أعظم من أن تحتمل."]]}, {"l": "Gen 4:14", "n": "", "vs": [[14, "ها أنت اليوم قد طردتني عن وجه الأرض، ومن أمام حضرتك أختفي، وأكون شريدا طريدا في الأرض، ويقتلني كل من يجدني»."]]}, {"l": "Lev 26:41", "n": "", "vs": [[41, "التي جعلتني أنقلب عليهم وأنفيهم إلى أرض أعدائهم، وإن خضعت قلوبهم النجسة بعد أن استوفوا عقاب خطاياهم،"]]}, {"l": "Lev 26:43", "n": "", "vs": [[43, "التي أقفرت منهم، فاستوفت راحة سبوتها في أثناء نفيهم عنها، ويكونون آنئذ قد استوفوا عقاب خطاياهم لأنهم تنكروا لشرائعي وكرهوا فرائضي."]]}, {"l": "Num 16:41", "n": "", "vs": [[41, "وفي اليوم الثاني تذمر جميع بني إسرائيل على موسى وهرون قائلين: «لقد قتلتما شعب الرب»."]]}, {"l": "Num 17:12", "n": "", "vs": [[12, "وقال بنو إسرائيل لموسى: «إننا انقرضنا وهلكنا جميعا،"]]}, {"l": "Jos 7:6-13", "n": "", "vs": [[6, "فمزق يشوع ثيابه وأكب على وجهه إلى الأرض أمام تابوت الرب إلى المساء، هو وشيوخ إسرائيل، وأهالوا التراب على رؤوسهم."], [7, "وقال يشوع: «آه ياسيد الرب، لماذا جعلت هذا الشعب يجتاز نهر الأردن لكي تدفعنا إلى يد الأموريين حتى يبيدونا؟ ليتنا كنا قنعنا وأقمنا شرقي نهر الأردن."], [8, "آه ياسيد، ماذا أقول الآن بعد أن ولى الإسرائيليون الأدبار أمام أعدائهم."], [9, "إذ يبلغ هذا الخبر مسامع الكنعانيين وسائر سكان الأرض، فيتألبون علينا ويزيلوننا من الوجود! وماذا تصنع لاسمك العظيم؟»"], [10, "فقال الرب ليشوع: «قم، لماذا أنت ساقط على وجهك؟"], [11, "لقد ارتكب إسرائيل خطيئة، بل تعدوا على عهدي الذي أمرتهم به، بل أخذوا مما حرمته عليهم وسرقوا وأنكروا، بل خبأوا في أمتعتهم."], [12, "لهذا عجز بنو إسرائيل عن الثبات أمام أعدائهم، فولوا أمامهم الأدبار، لأنهم هالكون إذ لن أعود أكون معكم ما لم تستأصلوا الحرام من وسطكم،"], [13, "قم، واطلب من الشعب أن يتقدسوا ليوم غد، لأنه هكذا قال الرب إله إسرائيل: في وسطك حرام ياإسرائيل، ولن تتمكنوا من هزيمة أعدائكم حتى تستأصلوا الحرام من بينكم."]]}, {"l": "2Sa 6:7", "n": "", "vs": [[7, "فاحتدم غضب الرب عليه، وأهلكه لأجل جسارته وجهله، فمات هناك بجوار التابوت."]]}, {"l": "2Sa 6:8", "n": "", "vs": [[8, "فشق الأمر على داود لأن الرب أهلك عزة وأباده. ودعا ذلك الموضع فارص عزة (ومعناه انكسار عزة) إلى هذا اليوم."]]}, {"l": "2Ki 3:13", "n": "", "vs": [[13, "فقال أليشع لملك إسرائيل: «ما شأني بك؟ اذهب واستشر أنبياء أبيك وأنبياء أمك». فأجابه ملك إسرائيل: «كلا إذ يبدو أن الرب قد دعانا نحن الملوك الثلاثة ليسلمنا ليد ملك موآب»."]]}, {"l": "2Ki 6:32", "n": "", "vs": [[32, "وكان أليشع آنئذ مجتمعا في بيته مع شيوخ إسرائيل، فوجه الملك رسولا إليه يتقدمه. وقبل أن يصل الرسول قال أليشع للشيوخ: «أرأيتم كيف أن هذا القاتل قد أرسل رسولا ليقطع رأسي؟ فحالما يأتي الرسول أغلقوا الباب واتركوه موصدا في وجهه. فإن وقع خطوات سيده يتجاوب وراءه»"]]}, {"l": "Ezr 9:13", "n": "", "vs": [[13, "والآن بعد كل ما جرى علينا من جراء أعمالنا السيئة وآثامنا العظيمة، نعلم أنك عاقبتنا ياإلهنا بأقل من آثامنا، ووهبتنا نجاة مثل هذه."]]}, {"l": "Job 11:6", "n": "", "vs": [[6, "ويكشف لك أسرار حكمته، فللحكمة الصالحة وجهان، فتدرك آنئذ أن الله عاقبك على إثمك بأقل مما تستحق."]]}, {"l": "Isa 51:20", "n": "", "vs": [[20, "قد أعيا أبناؤك وانطرحوا عند رأس كل شارع كوعل وقع في شبكة. امتلأوا من غضب الرب ومن زجر إلهك."]]}, {"l": "Jon 2:3", "n": "", "vs": [[3, "لأنك طرحتني إلى اللجج العميقة في قلب البحار، فاكتنفني الغمر وأحاطت بي تياراتك وأمواجك"]]}, {"l": "Jon 2:4", "n": "", "vs": [[4, "فقلت: قد طردت من حضرتك، ولن أعود أتفرس في هيكلك المقدس."]]}, {"l": "Jon 4:8", "n": "", "vs": [[8, "فلما أشرقت الشمس، أرسل الله ريحا شرقية حارة لفحت رأس يونان، فأصابه الإعياء وتمنى لنفسه الموت قائلا: «خير لي أن أموت من أن أظل حيا»."]]}, {"l": "Jon 4:9", "n": "", "vs": [[9, "فقال الله ليونان: «أأنت محق في غضبك من أجل اليقطينة؟» فأجاب: «أنا محق في غضبي حتى الموت»."]]}, {"l": "Mic 7:9", "n": "", "vs": [[9, "إني أخطأت إلى الرب لذلك أتحمل غضبه، إلى أن يدافع عني ويثبت استقامتي، فيخرجني إلى النور لأشاهد عدله."]]}, {"l": "Heb 12:5-12", "n": "", "vs": [[5, "فهل نسيتم الوعظ الذي يخاطبكم به الله بوصفكم أبناء له؟ إذ يقول: «ياابني، لا تستخف بتأديب الرب. ولا تفقد العزيمة حين يوبخك على الخطأ."], [6, "فإن الذي يحبه الرب يؤدبه. وهو يجلد كل من يتخذه له ابنا!»"], [7, "إذن، تحملوا تأديب الرب. فهو يعاملكم معاملة الأبناء: وأي ابن لا يؤدبه أبوه؟"], [8, "فإن كنتم لا تتلقون التأديب الذي يشترك فيه أبناء الله جميعا، فمعنى ذلك أنكم لستم أبناء شرعيين له."], [9, "إن آباءنا الأرضيين كانوا يؤدبوننا ونحن أولاد، وكنا نحترمهم. أفلا يجدر بنا الآن أن نخضع خضوعا تاما لتأديب أبي الأرواح، لنحيا حياة فضلى؟"], [10, "وقد أدبنا آباؤنا فترة من الزمان، حسب ما رأوه مناسبا. أما الله ، فيؤدبنا دائما من أجل منفعتنا: لكي نشترك في قداسته."], [11, "وطبعا، كل تأديب لا يبدو في الحال باعثا على الفرح، بل على الحزن. ولكنه فيما بعد، ينتج بسلام في الذين يتلقونه ثمر البر."], [12, "لذلك، شددوا أيديكم المرتخية، وركبكم المنحلة."]]}, {"l": "Rev 16:9", "n": "", "vs": [[9, "فاحترق الناس من الحر الشديد. ولكنهم لم يتوبوا ليمجدوا الله ، بل جدفوا على اسم الله صاحب السلطة على هذه البلايا."]]}], "kwAr": "الإنسان الحي", "noteAr": ""}], "arS": [["فلماذا", ["H4100"]], [" ", []], ["يشتكي", ["H596"]], [" ", []], ["الإنسان", ["H120"]], [" ", []], ["الحي", ["H2416"]], [" حين يعاقب ", []], ["على", ["H5921"]], [" ", []], ["خطاياه", ["H2399"]], ["؟", []]]}, {"c": 3, "v": 40, "text": "لنفحص طرقنا ونختبرها ونرجع إلى الرب.", "groups": [{"kw": "search", "raw": "1Ch_15:12, 1Ch_15:13; Job_11:13-15, Job_34:31, Job_34:32; Psa_4:4, Psa_119:59, Psa_139:23, Psa_139:24; Eze_18:28; Hag_1:5-9; 1Co_11:28, 1Co_11:31; 2Co_13:5", "note": "", "refs": [{"l": "1Ch 15:12", "n": "", "vs": [[12, "وقال لهم: «أنتم رؤساء بيوت اللاويين، فتطهروا مع بقية إخوتكم اللاويين لتنقلوا تابوت الرب إله إسرائيل إلى الموضع الذي جهزته له،"]]}, {"l": "1Ch 15:13", "n": "", "vs": [[13, "لأن الرب إلهنا قد غضب علينا في المرة السابقة، لأنكم لم تكونوا موجودين لنقل التابوت، ولأننا لم نستشر الرب في كيفية القيام بمراسيم نقله»."]]}, {"l": "Job 11:13-15", "n": "", "vs": [[13, "إن هيأت قلبك وبسطت إليه يديك،"], [14, "وإن نبذت الإثم الذي تلطخت به كفاك، فلم يعد الجور يقيم في خيمتك."], [15, "حينئذ ترفع وجهك بكرامة، وتكون راسخا من غير خوف،"]]}, {"l": "Job 34:31", "n": "", "vs": [[31, "هل قال أحد لله: لقد تحملت العقاب فلن أعود إلى الإساءة؟"]]}, {"l": "Job 34:32", "n": "", "vs": [[32, "علمني ما لا أراه، وإن كنت قد أثمت فإنني عنه أرتدع."]]}, {"l": "Psa 4:4", "n": "", "vs": [[4, "ارتعدوا ولا تخطئوا. فكروا في قلوبكم على مضاجعكم معتصمين بالصمت."]]}, {"l": "Psa 119:59", "n": "", "vs": [[59, "تأملت في انحرافي فعدت وتحولت نحو شهاداتك."]]}, {"l": "Psa 139:23", "n": "", "vs": [[23, "تفحصني ياالله واعرف قلبي. امتحني واعرف أفكاري."]]}, {"l": "Psa 139:24", "n": "", "vs": [[24, "وانظر إن كان في طريق سوء، واهدني الطريق الأبدي."]]}, {"l": "Eze 18:28", "n": "", "vs": [[28, "لأنه اعتبر وتاب عن كل ذنوبه التي ارتكبها. لذلك حتما يحيا. لا يموت."]]}, {"l": "Hag 1:5-9", "n": "", "vs": [[5, "والآن هذا ما يقوله الرب القدير: «تأملوا فيما فعلتم:"], [6, "لقد زرعتم كثيرا وحصدتم قليلا. أكلتم ولم تشبعوا. شربتم ولم ترتووا. اكتسيتم ولم تستدفئوا. ومن ينال أجرة سرعان ما تتبدد، وكأنها وضعت في صرة مثقوبة»."], [7, "هكذا يقول الرب القدير: «تأملوا فيما فعلتم:"], [8, "اصعدوا إلى الجبل واجلبوا خشبا وشيدوا الهيكل فأرضى عنه وأتمجد، قال الرب."], [9, "لقد توقعتم كثيرا فحصلتم على قليل، وما أتيتم به إلى البيت من غلة نفخت عليه وبددته. لماذا فعلت هذا يقول الرب القدير؟ من أجل بيتي الذي ما برح مهدما بينما كل واحد منكم منهمك في بناء بيته."]]}, {"l": "1Co 11:28", "n": "", "vs": [[28, "ولكن، ليفحص الإنسان نفسه، ثم يأكل من الخبز ويشرب من الكأس."]]}, {"l": "1Co 11:31", "n": "", "vs": [[31, "فلو كنا حكمنا على نفوسنا، لما كان حكم علينا."]]}, {"l": "2Co 13:5", "n": "", "vs": [[5, "لذلك امتحنوا أنفسكم لتروا هل أنتم في الإيمان. اختبروا أنفسكم. ألستم تعرفون أنفسكم، أن يسوع المسيح فيكم، إلا إذا تبين أنكم فاشلون؟"]]}], "kwAr": "لنفحص", "noteAr": ""}, {"kw": "turn", "raw": "Deu_4:30; 2Ch_30:6, 2Ch_30:9; Isa_55:7; Hos_6:1, Hos_12:6, Hos_14:1-3; Joe_2:12, Joe_2:13; Zec_1:3, Zec_1:4; Act_26:20", "note": "", "refs": [{"l": "Deu 4:30", "n": "", "vs": [[30, "فعندما يكتنفكم الضيق وتصيبكم في آخر الأيام جميع هذه الأمور، عندئذ ترجعون إلى الرب إلهكم وتطيعون أوامره."]]}, {"l": "2Ch 30:6", "n": "", "vs": [[6, "فانطلق السعاة حاملين رسائل الملك وقادته إلى جميع إسرائيل ويهوذا، داعين الناس بموجب أمر الملك، وقائلين لهم: «يابني إسرائيل، ارجعوا إلى الرب إله إبراهيم وإسحق وإسرائيل، فيرجع إليكم أنتم الباقين الناجين من يد ملوك أشور."]]}, {"l": "2Ch 30:9", "n": "", "vs": [[9, "لأن رجوعكم إلى الرب يجعل إخوتكم وأبناءكم يلقون رحمة من آسريهم فيرجعون إلى هذه الأرض، لأن الرب إلهكم رؤوف رحيم، ولا يحول وجهه عنكم إن رجعتم إليه»."]]}, {"l": "Isa 55:7", "n": "", "vs": [[7, "ليترك الشرير طريقه والأثيم أفكاره، وليتب إلى الرب فيرحمه، وليرجع إلى إلهنا لأنه يكثر الغفران."]]}, {"l": "Hos 6:1", "n": "", "vs": [[1, "«تعالوا نرجع إلى الرب. هو الذي مزقنا إربا إربا، وهو وحده يبرئنا. هو الذي ضربنا، وهو وحده الذي يجبرنا."]]}, {"l": "Hos 12:6", "n": "", "vs": [[6, "أما أنتم فارجعوا إلى إلهكم تائبين. تمسكوا برحمته وعدله، وداوموا على الا تكال عليه."]]}, {"l": "Hos 14:1-3", "n": "", "vs": [[1, "ارجع تائبا ياإسرائيل إلى الرب إلهك، لأنك قد تعثرت بخطيئتك."], [2, "احملوا معكم كلام ابتهال وارجعوا إلى الرب قائلين له: «انزع إثمنا، وتقبلنا بفائق رحمتك، فنزجي إليك حمد شفاهنا كالقرابين."], [3, "إن أشور لن تخلصنا، ولن نعتمد على خيول مصر لإنقاذنا، ولن نقول للأوثان صنعة ", "n": "", "vs": [[35, "فإنه سوف يطبق كالفخ على جميع الساكنين على وجه الأرض كلها."]]}], "kwAr": "الرعب", "noteAr": ""}, {"kw": "desolation", "raw": "Lam_1:4, Lam_1:13, Lam_2:1-9", "note": "", "refs": [{"l": "Lam 1:4", "n": "", "vs": [[4, "تنوح الطرق المفضية إلى صهيون، لأنها أقفرت من القادمين إلى الأعيا د! تهدمت بواباتها جميعا. كهنتها يتنهدون؛ عذاراها متحسرات وهي تقاسي مر العذاب."]]}, {"l": "Lam 1:13", "n": "", "vs": [[13, "من العلاء صب نارا في عظامي فسرت فيها. نصب شركا لقدمي فردني إلى الوراء. جعلني أطلالا أئن طول النهار."]]}, {"l": "Lam 2:1-9", "n": "", "vs": [[1, "كيف خيم الرب في غضبه بالظلام على ابنة صهيون، وطرح من السماء إلى الأرض جلال إسرائيل، ولم يذكر موطيء قدميه في يوم سخطه؟"], [2, "قد هدم الرب من غير رحمة جميع مساكن يعقوب. قوض بغضبه معاقل ابنة يهوذا، وألحق العار بالمملكة وحكامها، إذ سواها بالأرض."], [3, "بتر في احتدام غضبه كل قوة إسرائيل. رد يمينه إلى الوراء أمام الأعداء، واشتعل مثل نار ملتهبة في إسرائيل، تلتهم كل ما حولها."], [4, "وتر قوسه كعدو. نصب يمينه كمبغض. ذبح كعدو كل عزيز في عيوننا. وسكب سخطه كنار على خيمة ابنة صهيون."], [5, "وأصبح الرب كعدو، فقوض إسرائيل، وهدم جميع قصورها، ودمر حصونها، وأكثر النوح والعويل في ابنة صهيون."], [6, "نقض مظلته كما ينقض كوخ من الأغصان في حديقة، وردم مقر مجتمعه. جعل الرب صهيون تنسى مواسم أعيادها وسبوتها. ونبذ باحتدام سخطه الملك والكاهن."], [7, "كره الرب مذبحه، وتبرأ من مقدسه، وسلم أسوار قصورها إلى يد الأعداء الذين علا هتافهم في بيت الرب كما كان يعلو هتافنا في الأعياد."], [8, "عزم الرب أن يقوض سور ابنة صهيون. مد خيط القياس ولم يرد يده عن سحقها، فاستبكى المترسة والسور فسقطا معا."], [9, "غاصت في الأرض بواباتها، دمر وحطم مزاليجها. نفى ملكها ورؤساءها بين الأمم. زالت الشريعة، ولم يعد أنبياؤها يحصلون على رؤيا من عند الرب."]]}], "kwAr": "والدمار", "noteAr": ""}], "arS": [["وحل", ["H1961"]], [" بنا ", []], ["الرعب", ["H6343"]], [" ", []], ["والهلاك", ["H6354"]], [" ", []], ["والدمار", ["H7612"]], [" ", []], ["والسحق", ["H7667"]], [".", []]]}, {"c": 3, "v": 48, "text": "تفيض عيناي بأنهار مياه على دمار ابنة شعبي.", "groups": [{"kw": "", "raw": "Lam_2:11, Lam_2:18; Psa_119:136; Jer_4:19, Jer_9:1, Jer_9:18, Jer_13:17; Rom_9:1-3", "note": "", "refs": [{"l": "Lam 2:11", "n": "", "vs": [[11, "كلت عيناي من البكاء، جاشت أحشائي وأريقت كبدي على الأرض حزنا لدمار ابنة شعبي، لأن الأطفال والرضع غشي عليهم في شوارع المدينة."]]}, {"l": "Lam 2:18", "n": "", "vs": [[18, "استغاثت قلوبهم بالرب. لتجر الدموع، ياأسوار ابنة صهيون، كالنهر ليلا ونهارا. لا تستكيني ولا تكف عيناك عن البكاء."]]}, {"l": "Psa 119:136", "n": "", "vs": [[136, "فاضت من عيني ينابيع دمع، لأنهم لم يراعوا شريعتك."]]}, {"l": "Jer 4:19", "n": "", "vs": [[19, "لشد ما أتعذب! لشد ما أتعذب! قلبي يتلوى ألما. فؤادي يئن في داخلي فلا أستطيع الصمت، لأني سمعت دوي البوق وصيحات القتال."]]}, {"l": "Jer 9:1", "n": "", "vs": [[1, "ياليت رأسي فيض مياه، وعيني ينبوع دموع، فأبكي نهارا وليلا قتلى بنت شعبي"]]}, {"l": "Jer 9:18", "n": "", "vs": [[18, "ليسرعن حتى يطلقن أصواتهن علينا بالندب فتذرف عيوننا دموعا، وتفيض أجفاننا ماء."]]}, {"l": "Jer 13:17", "n": "", "vs": [[17, "وإن لم تنصتوا فإن نفسي تبكي في الخفاء من أجل كبريائكم، وتذرف عيناي الدموع المريرة، فتسيل العبرات لأن الرب قد سبى شعبه."]]}, {"l": "Rom 9:1-3", "n": "", "vs": [[1, "أقول الحق في المسيح، لست أكذب، وضميري شاهد لي في الروح القدس،"], [2, "إن بي حزنا شديدا، وبقلبي ألم لا ينقطع:"], [3, "فقد كنت أتمنى لو أكون أنا نفسي محروما من المسيح في سبيل إخوتي، بني جنسي حسب الجسد."]]}], "kwAr": "", "noteAr": ""}], "arS": [["تفيض", ["H3381"]], [" ", []], ["عيناي", ["H5869"]], [" ", []], ["بأنهار", ["H6388"]], [" ", []], ["مياه", ["H4325"]], [" ", []], ["على", ["H5921"]], [" ", []], ["دمار", ["H7667"]], [" ", []], ["ابنة", ["H1323"]], [" ", []], ["شعبي", ["H5971"]], [".", []]]}, {"c": 3, "v": 49, "text": "لن تكف عيناي عن البكاء أبدا،", "groups": [{"kw": "and", "raw": "Lam_1:16; Psa_77:2; Jer_14:17", "note": "", "refs": [{"l": "Lam 1:16", "n": "", "vs": [[16, "على هذه كلها أبكي. عيناي، عيناي تفيضان بالدموع، إذ ابتعد عني كل معز ينعش نفسي. هلك أبنائي لأن العدو قد ظفر."]]}, {"l": "Psa 77:2", "n": "", "vs": [[2, "في يوم ضيقي طلبت ال ع المحيطين بنا."], [17, "فأنصت الآن ياإلهنا إلى صلاة عبدك وابتهالاته، وأضيء بوجهك على هيكلك المتهدم، من أجل ذاتك."], [18, "أرهف أذنك ياإلهي واستمع، وافتح عينيك وشاهد خرائبنا والمدينة التي دعي اسمك عليها، فإننا لا من أجل بر فينا نرفع تضرعاتنا إليك، بل بفضل مراحمك العظيمة."], [19, "فاستمع أيها السيد واغفر. أصغ أيها السيد وتصرف ولا تبطىء من أجل نفسك ياإلهي، لأن اسمك دعي على مدينتك وعلى شعبك»."]]}], "kwAr": "", "noteAr": ""}], "arS": [["حتى", ["H5704"]], [" ", []], ["يشرف", ["H8259"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["من", ["H4480"]], [" ", []], ["السماء", ["H8064"]], [" ", []], ["ويبصر", ["H7200"]], [".", []]]}, {"c": 3, "v": 51, "text": "تتلف عيناي على مصير كل بنات مدينتي.", "groups": [{"kw": "eye", "raw": "Gen_44:34; 1Sa_30:3, 1Sa_30:4; Jer_4:19-21, Jer_14:18; Luk_19:41-44", "note": "", "refs": [{"l": "Gen 44:34", "n": "", "vs": [[34, "إذ كيف يمكنني أن أرجع إلى أبي والغلام ليس معي وأشهد ما يحل به من الشر؟»."]]}, {"l": "1Sa 30:3", "n": "", "vs": [[3, "وعندما دخل داود ورجاله إلى المدينة وجدوها محروقة، وأسرت نساؤهم وبناتهم وأبناؤهم."]]}, {"l": "1Sa 30:4", "n": "", "vs": [[4, "فعلت أصواتهم بالبكاء حتى أصابهم الإعياء."]]}, {"l": "Jer 4:19-21", "n": "", "vs": [[19, "لشد ما أتعذب! لشد ما أتعذب! قلبي يتلوى ألما. فؤادي يئن في داخلي فلا أستطيع الصمت، لأني سمعت دوي البوق وصيحات القتال."], [20, "كارثة في أعقاب كارثة، والأرض قاطبة قد استحالت خرابا، فتهدمت في لحظة خيامي، وبيوتي تدمرت بغتة."], [21, "إلى متى أظل أرى راية المعركة، وأسمع دوي البوق؟"]]}, {"l": "Jer 14:18", "n": "", "vs": [[18, "إن خرجت إلى الحقول أشهد قتلى السيف، وإن دخلت المدينة أرى ضحايا المجاعة. وها النبي والكاهن كلاهما يذهبان إلى أرض لا يعرفانها»."]]}, {"l": "Luk 19:41-44", "n": "", "vs": [[41, "ولما اقترب، ورأى المدينة، بكى عليها،"], [42, "قائلا: «ليتك أنت أيضا، في يومك هذا، عرفت ما فيه سلامك! ولكن ذلك محجوب الآن عن عينيك."], [43, "فستأتي عليك أيام يحاصرك فيها أعداؤك بالمتاريس، ويطبقون عليك، ويشددون عليك الحصار من كل جهة،"], [44, "ويهدمونك على أبنائك الذين فيك، فلا يتركون فيك حجرا فوق حجر: لأنك لم تعرفي وقت افتقاد الله لك»."]]}], "kwAr": "عيناي", "noteAr": ""}, {"kw": "mine heart", "raw": "Heb. my soul", "note": "Heb. my soul", "refs": [], "kwAr": "تتلف", "noteAr": "بالعبرانية: نفسي."}, {"kw": "because of all", "raw": "or, more than all", "note": "or, more than all", "refs": [], "kwAr": "على مصير كل", "noteAr": "أو: أكثر من كل."}, {"kw": "the daughters", "raw": "Lam_1:18, Lam_2:21, Lam_5:11; Jer_11:22, Jer_14:16, Jer_19:9", "note": "", "refs": [{"l": "Lam 1:18", "n": "", "vs": [[18, "الرب حقا عادل، وأنا قد تمردت على أمره. فاستمعوا ياجميع الشعوب واشهدوا وجعي. قد ذهب عذاراي وشباني إلى السبي."]]}, {"l": "Lam 2:21", "n": "", "vs": [[21, "قد انطرح الصبي والشيوخ في غبار الطرقات. سقط عذاراي وشباني بالسيف. قد قتلتهم في يوم غضبك، ونحرتهم من غير رحمة."]]}, {"l": "Lam 5:11", "n": "", "vs": [[11, "اغتصبوا النساء في صهيون والعذارى في مدن يهوذا."]]}, {"l": "Jer 11:22", "n": "", "vs": [[22, "لهذا يعلن الرب القدير: ها أنا أعاقبهم فيموت شبابهم بحد السيف، ويهلك أبناؤهم وبناتهم جوعا."]]}, {"l": "Jer 14:16", "n": "", "vs": [[16, "ويغدو الشعب الذي يتنبأون له، مطروحا صريعا في شوارع أورشليم فريسة الجوع والسيف، وليس من يدفنهم هم ونساءهم وأبناءهم وبناتهم، وأصب شرهم عليهم»."]]}, {"l": "Jer 19:9", "n": "", "vs": [[9, "وأطعمهم لحوم أبنائهم وبناتهم، ويأكل كل واحد لحم جاره في أثناء الحصار والضيقة التي يضايقهم بها أعداؤهم وطالبو نفوسهم."]]}], "kwAr": "بنات مدينتي", "noteAr": ""}], "arS": [["تتلف", ["H5953"]], [" ", []], ["عيناي", ["H5869"]], [" على مصير ", []], ["كل", ["H3605"]], [" ", []], ["بنات", ["H1323"]], [" ", []], ["مدينتي", ["H5892"]], [".", []]]}, {"c": 3, "v": 52, "text": "قد اصطادني، كعصفور، أعدائي الذين لم أسيء إليهم،", "groups": [{"kw": "chased", "raw": "Jer_37:15, Jer_37:16, Jer_38:4-6", "note": "", "refs": [{"l": "Jer 37:15", "n": "", "vs": [[15, "فثار غضب الرؤساء على إرميا وضربوه، وزجوه في بيت يوناثان الكاتب الذي حولوه إلى سجن."]]}, {"l": "Jer 37:16", "n": "", "vs": [[16, "فعندما دخل إرميا إلى زنزانات الجب مكث هناك أياما كثيرة."]]}, {"l": "Jer 38:4-6", "n": "", "vs": [[4, "فقال رؤساء البلاد للملك: «يجب إعدام هذا الرجل، لأنه يثبط عزيمة المحاربين الباقين في هذه المدينة وعزيمة سائر الشعب، لأنه يخاطبهم بمثل هذا الكلام. فهذا الرجل لا يلتمس لهذا الشعب خيرا بل شرا»."], [5, "فأجاب الملك صدقيا: «ها هو بين أيديكم. افعلوا به ما تشاؤون، لأن الملك لا يستطيع أن يعارضكم»."], [6, "فأخذوا إرميا وطرحوه في جب ملكيا ابن الملك القائم في دار الحرس. ودلوا إرميا بحبال، ولم يكن في الجب ماء بل وحل، فغاص فيه إرميا."]]}], "kwAr": "اصطادني", "noteAr": ""}, {"kw": "without", "raw": "1Sa_24:10-15, 1Sa_25:28, 1Sa_25:29, 1Sa_26:18-20; Psa_35:7, Psa_35:19, Psa_69:4, Psa_109:3, Psa_119:161; Jer_37:18; Joh_15:25", "note": "", "refs": [{"l": "1Sa 24:10-15", "n": "", "vs": [[10, "ها أنت قد رأيت اليوم بعينيك كيف أوقعك الرب في قبضتي عندما كنت في الكهف، وجاء من يحرضني على قتلك، ولكني أشفقت عليك وقلت: لا! لن أمد يدي بالإساءة إلى سيدي، لأن الرب هو الذي اختاره."], [11, "فانظر يا أبي ما بيدي، إنه طرف جبتك. إن قطعي طرف جبتك وعدم قتلي إياك خير دليل على أنني لم أرتكب شرا أو ذنبا، ولم أخطيء إليك، بينما أنت تتربص بي لتقتلني."], [12, "فليقض الرب بيني وبينك وينتقم لي الرب منك، أما أنا فلن أمسك بسوء."], [13, "وكما قيل في مثل القدماء: عن الأشرار يصدر شر، لذلك فإن يدي لن تنالك بأذى."], [14, "ثم وراء من يسعى ملك إسرائيل؟ من هو الذي تطارده؟ أتسعى وراء كلب ميت؟ وراء برغوث واحد؟"], [15, "ليكن الرب هو الديان فيقضي بيني وبينك ويتولى قضيتي ويبرئني وينقذني من قبضتك»."]]}, {"l": "1Sa 25:28", "n": "", "vs": [[28, "واعف عن ذنب أمتك، لأن الرب لابد أن يثبت كرسي ملك سيدي إلى الأبد، لأن سيدي يحارب حروب الرب، فلا يوجد فيك شر كل أيامك."]]}, {"l": "1Sa 25:29", "n": "", "vs": [[29, "وإن قام من يتعقبك ليقتلك، فلتكن نفس سيدي محزومة في حزمة الأحياء مع الرب إلهك. وأما نفس أعدائك فليقذف بها كما يقذف حجر من وسط كفة مقلاع."]]}, {"l": "1Sa 26:18-20", "n": "", "vs": [[18, "ثم تابع حديثه: «لماذا لايزال سيدي يسعى وراء عبده؟ أي ذنب جنيت، وأي جرم اقترفت؟"], [19, "فليسمع سيدي الملك كلام عبده الآن: إن كان الرب قد أثارك ضدي فلأقدمن له قربان رضي. وإن كان الناس هم الذين أوغروا صدرك علي فليكونوا ملعونين أمام الرب، لأنهم نفوني من أرض ميراث الرب قائلين: اذهب اعبد آلهة أخرى."], [20, "والآن لا تدع دمي يهدر على أرض غريبة بعيدا عن حضرة الرب، لأن ملك إسرائيل قد خرج ليبحث عن برغوث واحد ويتعقبه كما يتعقب الحجل في الجبال؟»."]]}, {"l": "Psa 35:7", "n": "", "vs": [[7, "فإنهم من غير سبب أخفوا لي شبكة فوق الهوة، ومن غير علة حفروا لي حفرة."]]}, {"l": "Psa 35:19", "n": "", "vs": [[19, "لا يشمت بي أعدائي بحجة باطلة، ولا يتغامز مبغضي علي، بغير علة."]]}, {"l": "Psa 69:4", "n": "", "vs": [[4, "مبغضي من غير علة أكثر عددا من شعر رأسي، وطالبو هلاكي طغاة جائرون. حينئذ رددت مالم أغتصبه."]]}, {"l": "Psa 109:3", "n": "", "vs": [[3, "يحاصرونني بكلام بغض، ويهاجمونني من غير علة."]]}, {"l": "Psa 119:161", "n": "", "vs": [[161, "اضطهدني رؤساء من غير علة، لكن قلبي لا يهاب سوى كلامك."]]}, {"l": "Jer 37:18", "n": "", "vs": [[18, "ثم قال إرميا للملك صدقيا: «بماذا أسأت إليك وإلى رجالك وإلى هذا الشعب حتى زججتم بي في السجن؟"]]}, {"l": "Joh 15:25", "n": "", "vs": [[25, "وقد صار ذلك لتتم الكلمة المكتوبة في شريعتهم: أبغضوني بلا سبب!"]]}], "kwAr": "الذين لم أسيء إليهم", "noteAr": ""}], "arS": [["قد ", []], ["اصطادني", ["H6679", "H6679"]], ["، ", []], ["كعصفور", ["H6833"]], ["، ", []], ["أعدائي", ["H341"]], [" الذين لم أسيء إليهم،", []]]}, {"c": 3, "v": 53, "text": "طرحوني حيا في الجب ورجموني بالحجارة.", "groups": [{"kw": "cut", "raw": "Jer_37:20, Jer_38:6, Jer_38:9", "note": "", "refs": [{"l": "Jer 37:20", "n": "", "vs": [[20, "والآن اسمع ياسيدي الملك، وليحظ توسلي بقبولك، لا ترجعني إلى بيت يوناثان الكاتب لئلا أموت»."]]}, {"l": "Jer 38:6", "n": "", "vs": [[6, "فأخذوا إرميا وطرحوه في جب ملكيا ابن الملك القائم في دار الحرس. ودلوا إرميا بحبال، ولم يكن في الجب ماء بل وحل، فغاص فيه إرميا."]]}, {"l": "Jer 38:9", "n": "", "vs": [[9, "«يامولاي الملك، قد أساء هؤلاء الرجال إلى إرميا النبي بما أوقعوه به من شر حين زجوه في الجب. فإنه لابد أن يتعرض للموت من جراء الجوع، إذ لا خبز في المدينة»."]]}], "kwAr": "طرحوني حيا", "noteAr": ""}, {"kw": "and", "raw": "Dan_6:17; Mat_27:60,Mat_27:66", "note": "", "refs": [{"l": "Dan 6:17", "n": "", "vs": [[17, ."]]}, {"l": "2Ch 33:12", "n": "", "vs": [[12, "وفي ضيقه استغاث بالرب إلهه وتذلل جدا أمام إله آبائه،"]]}, {"l": "Psa 18:5", "n": "", "vs": [[5, "حاقت بي حبال الهاوية، وأطبقت علي فخاخ الموت."]]}, {"l": "Psa 18:6", "n": "", "vs": [[6, "في ضيقي دعوت الرب وصرخت إلى إلهي، فسمع صوتي من هيكله، وصعد صراخي أمامه، بل دخل أذنيه."]]}, {"l": "Psa 40:1", "n": "", "vs": [[1, "انتظرت الرب صابرا، فالتفت إلي وسمع صراخ استغاثتي،"]]}, {"l": "Psa 40:2", "n": "", "vs": [[2, "وانتشلني من هوة الهلاك، من طين المستنقع. وأوقف قدمي على أرض صخرية، فصرت أمشي بخطوات ثابتة."]]}, {"l": "Psa 69:13-18", "n": "", "vs": [[13, "أما أنا فإليك صلاتي يارب؛ لأن هذا أوان الرضى، فاستجب لي ياالله برحمتك الغزيرة وبحق خلاصك."], [14, "أنقذني من الوحل فلا أغرق. نجني من مبغضي وانتشلني من أعماق الميا ه."], [15, "لا يطم علي سيل المياه، ولا يبتلعني العمق، ولا تطبق الهوة علي فمها."], [16, "استجب أيها الرب لأن رحمتك صالحة، وبحسب مراحمك الوفيرة التفت إلي."], [17, "لا تحجب وجهك عن عبدك، لأنني في ضيق، فأسرع واستجب لي."], [18, "اقترب إلى نفسي، وفكها. افدني (نكاية) بأعدائي"]]}, {"l": "Psa 116:3", "n": "", "vs": [[3, "طوقتني حبال الموت. أطبق علي رعب الهاوية. قاسيت ضيقا وحزنا."]]}, {"l": "Psa 116:4", "n": "", "vs": [[4, "فدعوت الرب: آه يارب نج نفسي!"]]}, {"l": "Psa 130:1", "n": "", "vs": [[1, "أيها الرب إياك أدعو من الأعماق."]]}, {"l": "Psa 130:2", "n": "", "vs": [[2, "فاسمع يارب صوتي، ولتكن أذناك مرهفتين إلى صوت تضرعي."]]}, {"l": "Psa 142:3-7", "n": "", "vs": [[3, "عندما غشي على روحي في داخلي كنت أنت عالما بمسلكي. في الطريق التي سلكتها نصبوا لي فخا."], [4, "التفت نحو يميني فلا تجد من يحفل بي، لم يبق لي ملاذ أو من يسأل عني."], [5, "إياك دعوت يارب قائلا: أنت ملجإي، أنت نصيبي في أرض الأحياء."], [6, "أصغ إلى صراخي لأنني قد تذللت جدا. أنقذني من مضطهدي لأنهم أشد مني."], [7, "أفرج كربة نفسي لأسبح باسمك، فيلتف الصديقون حولي ثوابا لي منك."]]}, {"l": "Jer 38:6", "n": "", "vs": [[6, "فأخذوا إرميا وطرحوه في جب ملكيا ابن الملك القائم في دار الحرس. ودلوا إرميا بحبال، ولم يكن في الجب ماء بل وحل، فغاص فيه إرميا."]]}, {"l": "Jon 2:2-4", "n": "", "vs": [[2, "قائلا: «استغثت بالرب في ضيقي فاستجاب لي، ومن جوف الهاوية ابتهلت فسمعت صوتي."], [3, "لأنك طرحتني إلى اللجج العميقة في قلب البحار، فاكتنفني الغمر وأحاطت بي تياراتك وأمواجك"], [4, "فقلت: قد طردت من حضرتك، ولن أعود أتفرس في هيكلك المقدس."]]}, {"l": "Act 16:24-28", "n": "", "vs": [[24, "ونفذ ضابط السجن هذا الأمر المشدد. فزج بهما في السجن الداخلي، وأدخل أرجلهما في مقطرة خشبية."], [25, "ونحو منتصف الليل كان بولس وسيلا يصليان ويسبحان الله، والمسجونون يسمعونهما،"], [26, "وفجأة حدث زلزال شديد هز أركان السجن، فانفتحت جميع أبوابه حالا، وسقطت قيود السجناء كلهم."], [27, "وأيقظ الزلزال ضابط السجن. فلما رأى الأبواب مفتوحة ظن أن السجناء هربوا، فاستل سيفه ليقتل نفسه،"], [28, "ولكن بولس صاح به بأعلى صوته: «لا تمس نفسك بسوء، فنحن جميعا هنا!»"]]}], "kwAr": "", "noteAr": ""}], "arS": [["استغثت", ["H7121"]], [" ", []], ["باسمك", ["H8034"]], [" ", []], ["يارب", ["H3068"]], [" ", []], ["من", ["H4480"]], [" أعماق ", []], ["الجب", ["H953"]], ["،", []]]}, {"c": 3, "v": 56, "text": "فسمعت صوتي. لا تصم أذنيك عن صراخ استغاثتي.", "groups": [{"kw": "hast", "raw": "2Ch_33:13, 2Ch_33:19; Job_34:28; Psa_3:4, Psa_6:8, Psa_6:9, Psa_34:6, Psa_66:19, Psa_116:1, Psa_116:2; Isa_38:5", "note": "", "refs": [{"l": "2Ch 33:13", "n": "", "vs": [[13, "وابتهل إليه فاستجاب له، وسمع تضرعه ورده إلى أورشليم وإلى مملكته. فعلم منسى أن الرب هو الله ."]]}, {"l": "2Ch 33:19", "n": "", "vs": [[19, "كما أن صلاته واستجابة الرب له، وسائر خطاياه وخيانته، والأماكن التي شيد فيها المرتفعات ونصب فيها تماثيل عشتاروث، والأصنام التي أقامها قبل تذلله فهي مدونة في أخبار الأنبياء."]]}, {"l": "Job 34:28", "n": "", "vs": [[28, "فكانوا سببا في ارتفاع صراخ البائس إليه، والله يستجيب استغاثة المسكين."]]}, {"l": "Psa 3:4", "n": "", "vs": [[4, "بملء صوتي أدعو إلى الرب فيجيبني من جبله المقدس."]]}, {"l": "Psa 6:8", "n": "", "vs": [[8, "ابتعدوا عني ياجميع فاعلي الإثم، لأن الرب قد سمع صوت بكائي."]]}, {"l": "Psa 6:9", "n": "", "vs": [[9, "سمع الرب تضرعي. الرب يتقبل صلاتي."]]}, {"l": "Psa 34:6", "n": "", "vs": [[6, "هذا المسكين استغاث، فسمعه الرب وأنقذه من جميع ضيقاته."]]}, {"l": "Psa 66:19", "n": "", "vs": [[19, "ولكن الله قد استجاب لي. أصغى إلى صوت صلاتي."]]}, {"l": "Psa 116:1", "n": "", "vs": [[1, "إني أحب الرب لأنه يسمع ابتهالي ويستجيب إلى تضرعاتي."]]}, {"l": "Psa 116:2", "n": "", "vs": [[2, "أمال أذنه إلي لذلك أدعوه مادمت حيا."]]}, {"l": "Isa 38:5", "n": "", "vs": [[5, "«اذهب بلغ حزقيا: هذا ما يقوله الرب إله داود أبيك: قد سمعت صلاتك ورأيت دموعك، وها أنا أضيف إلى عمرك خمس عشرة سنة،"]]}], "kwAr": "فسمعت صوتي", "noteAr": ""}, {"kw": "hide", "raw": "Psa_55:1, Psa_88:13, Psa_88:14; Rom_8:26", "note": "", "refs": [{"l": "Psa 55:1", "n": "", "vs": [[1, "اصغ ياالله إلى صلاتي، ولا تتغافل عن تضرعي."]]}, {"l": "Psa 88:13", "n": "", "vs": [[13, "أما أنا فإليك أصرخ مستغيثا يارب، وفي الصباح تمثل صلاتي أمامك."]]}, {"l": "Psa 88:14", "n": "", "vs": [[14, "لماذا يارب ترفض نفسي، وتحجب عني وجهك؟"]]}, {"l": "Rom 8:26", "n": "", "vs": [[26, "وكذلك الروح أيضا يمدنا بالعون لنقهر ضعفنا. فإننا لا نعلم ما يجب أن نصلي لأجله كما يليق، ولكن الروح نفسه يؤدي الشفاعة عنا بأنات تفوق التعبير."]]}], "kwAr": "لا تصم أذنيك", "noteAr": ""}], "arS": [["فسمعت", ["H8085"]], [" ", []], ["صوتي", ["H6963"]], [". ", []], ["لا", ["H408"]], [" ", []], ["تصم", ["H5956"]], [" ", []], ["أذنيك", ["H241"]], [" عن ", []], ["صراخ", ["H7775"]], [" ", []], ["استغاثتي", ["H7309"]], [".", []]]}, {"c": 3, "v": 57, "text": "اقتربت حين دعوتك إذ قلت: «لا تخف».", "groups": [{"kw": "drewest", "raw": "Psa_69:18, Psa_145:18; Isa_58:9; Jam_4:8", "note": "", "refs": [{"l": "Psa 69:18", "n": "", "vs": [[18, "اقترب إلى نفسي، وفكها. افدني (نكاية) بأعدائي"]]}, {"l": "Psa 145:18", "n": "", "vs": [[18, "الرب قريب من جميع الذين يدعونه بصدق،"]]}, {"l": "Isa 58:9", "n": "", "vs": [[9, "عندئذ تدعو فيستجيب الرب. تستغيث فيقول ها أنا. إن أزلت من وسط بيتك النير، والإيماء بالأصبع احتقارا، والنطق بالشر،"]]}, {"l": "Jam 4:8", "n": "", "vs": [[8, "اقتربوا إلى الله فيقترب إليكم. أيها الخاطئون نظفوا أيديكم، وياأصحاب الرأيين طهروا قلوبكم."]]}], "kwAr": "اقتربت", "noteAr": ""}, {"kw": "thou saidst", "raw": "Isa_41:10,Isa_41:14, Isa_43:1, Isa_43:2; Jer_1:17; Act_18:9, Act_27:24; Rev_1:17, Rev_2:10", "note": "", "refs": [{"l": "Isa 41:10", "n": "", "vs": [[10, "لا تخف لأني معك. لا تتلفت حولك جزعا، لأني إلهك، أشددك وأعينك وأعضدك بيمين بري"]]}, {"l": "Isa 41:14", "n": "", "vs": [[14, "لا تخف يايعقوب الضعيف كالحشرة، وياإسرائيل العليل كالشرذمة، لأني سأعينك، يقول الرب فاديك قدوس إسرائيل."]]}, {"l": "Isa 43:1", "n": "", "vs": [[1, "أما الآن، فهذا ما يقوله الرب خالقك يايعقوب وجابلك ياإسرائيل: «لا تجزع لأني افتديتك، دعوتك باسمك. أنت لي."]]}, {"l": "Isa 43:2", "n": "", "vs": [[2, "إذا اجتزت في وسط المياه أكون معك، وإن خضت الأنهار لا تغمرك. إن عبرت في النار لا تلذعك. واللهيب لا يحرقك."]]}, {"l": "Jer 1:17", "n": "", "vs": [[17, "أما أنت فتأهب، وقم وكلمهم بكل ما آمرك به. لا تخف من حضرتهم لئلا أفزعك أمامهم."]]}, {"l": "Act 18:9", "n": "", "vs": [[9, "وذات ليلة رأى بولس الرب في رؤيا يقول له: «لا تخف، بل تكلم ولا تسكت،"]]}, {"l": "Act 27:24", "n": "", "vs": [[24, "وقال لي: لا تخف يابولس! فلابد أن تمثل أمام القيصر. وقد وهبك الله حياة جميع المسافرين معك!"]]}, {"l": "Rev 1:17", "n": "", "vs": [[17, "فلما رأيته ارتميت عند قدميه كالميت، فلمسني بيده اليمنى وقال: «لا تخف! أنا الأول والآخر،"]]}, {"l": "Rev 2:10", "n": "", "vs": [[10, "دع عنك الخوف مما ينتظرك من آلام، فإن إبليس سيزج ببعضكم في السجن لكي تمتحنوا، فتقاسون الاضطهاد عشرة أيام. فابق أمينا حتى الموت، فأمنحك إكليل الحياة."]]}], "kwAr": "قلت", "noteAr": ""}], "arS": [["اقتربت", ["H7126"]], [" ", []], ["حين", ["H3117"]], [" ", []], ["دعوتك", ["H7121"]], [" إذ ", []], ["قلت", ["H559"]], [": «", []], ["لا", ["H408"]], [" ", []], ["تخف", ["H3372"]], ["».", []]]}, {"c": 3, "v": 58, "text": "قد دافعت عن دعواي يارب، وافتديت حياتي.", "groups": [{"kw": "thou hast pleaded", "raw": "1Sa_25:39; Psa_35:1; Jer_51:36", "note": "", "refs": [{"l": "1Sa 25:39", "n": "", "vs": [[39, "فلما سمع داود بموت نابال قال: «مبارك الرب الذي انتقم لي بذاته من إهانة نابال، وجنبني ارتكاب الشر وعاقب نابال على إثمه». وأرسل داود إلى أبيجايل يسألها الزواج منه."]]}, {"l": "Psa 35:1", "n": "", "vs": [[1, "يارب كن خصما لمن يخاصمونني، وحارب الذين يحاربونني."]]}, {"l": "Jer 51:36", "n": "", "vs": [[36, "لذلك هذا ما يعلنه الرب: ها أنا أدافع عن دعواك وأنتقم لك، فأجفف بحر بابل وينابيعها،"]]}], "kwAr": "قد دافعت عن دعواي", "noteAr": ""}, {"kw": "thou hast redeemed", "raw": "Gen_48:16; Psa_34:22, Psa_71:23, Psa_103:4", "note": "", "refs": [{"l": "Gen 48:16", "n": "", "vs": [[16, "الملاك الذي أنقذني من كل شر، يبارك الغلامين، وليدع عليهما اسمي واسما أبوي إبراهيم وإسحق، وليكثرا كثيرا في الأرض»."]]}, {"l": "Psa 34:22", "n": "", "vs": [[22, "الرب يفدي نفوس عبيده، وكل من اعتصم به ينجو."]]}, {"l": "Psa 71:23", "n": "", "vs": [[23, "تبتهج شفتاي عندما أرنم لك، وكذلك نفسي التي فديتها."]]}, {"l": "Psa 103:4", "n": "", "vs": [[4, "ويفدي من الموت حياتك ويتوجك بالرحمة والرأفة."]]}], "kwAr": "وافتديت حياتي", "noteAr": ""}], "arS": [["قد دافعت عن ", []], ["دعواي", ["H7378"]], [" ", []], ["يارب", ["H136"]], ["، ", []], ["وافتديت", ["H1350"]], [" ", []], ["حياتي", ["H2416"]], [".", []]]}, {"c": 3, "v": 59, "text": "أنت شهدت ما أساءوا به إلي يارب، فاقض في دعواي.", "groups": [{"kw": "thou hast", "raw": "Jer_11:19-21, Jer_15:10, Jer_18:18-23, Jer_20:7-10, 37:1-38:28", "note": "", "refs": [{"l": "Jer 11:19-21", "n": "", "vs": [[19, "ولكني كنت كحمل أليف يساق إلى الذبح، لم أدرك أنهم يتآمرون علي قائلين: «لنتلف الشجرة وثمارها، ولنستأصله من أرض الأحياء فيندثر اسمه إلى الأبد."], [20, "ولكن أيها الرب القدير، القاضي بالإنصاف، الفاحص القلوب والنوايا، دعني أشهد انتقامك منهم لأني إليك رفعت دعواي."], [21, "«لذلك، هكذا يقول الرب عن رجال عناثوث الذين يلتمسون نفسك قائلين: لا تتنبأ باسم الرب لئلا تموت بأيدينا."]]}, {"l": "Jer 15:10", "n": "", "vs": [[10, "ويل لي ياأمي لأنك أنجبتني لأكون إنسان خصام ورجل نزاع لكل الأرض. لم أقرض ولم أقترض. ومع ذلك كل واحد يلعنني."]]}, {"l": "Jer 18:18-23", "n": "", "vs": [[18, "ثم قالوا: «تعالوا نتآمر على إرميا، لأن الشريعة لا تبيد عن الكاهن، ولا المشورة عن الحكيم، ولا الوحي عن النبي. تعالوا نلذعه بوخزات اللسان ونصم آذاننا عن كلامه»."], [19, "أصغ لي يارب، واستمع إلى اتهامات خصومي."], [20, "هل يجازى عن خير بشر؟ قد نقروا حفرة لنفسي. اذكر كيف وقفت أمامك أثني عليهم خيرا لأصرف غضبك عنهم."], [21, "لذلك أسلم بنيهم لأنياب الجوع، واعهد بهم إلى قبضة السيف فتصبح نساؤهم ثكالى وأرامل، وليمت رجالهم، وليلق شبانهم حتفهم في المعارك بحد السيف."], [22, "ليتردد صراخ في بيوتهم عندما ترسل عليهم جيش الغزاة بغتة، لأنهم حفروا هوة ليقتنصوني، ونصبوا فخاخا لرجلي."], [23, "أما أنت يارب فقد عرفت جميع ما تآمروا به علي، فلا تصفح عن إثمهم، ولا تمح خطيئتهم من أمامك، بل ليعثروا منطرحين في حضرتك، وعاقبهم في أوان غضبك."]]}, {"l": "Jer 20:7-10", "n": "", "vs": [[7, "يارب قد أقنعتني فاقتنعت، أنت أقوى مني فغلبت، فأصبحت مثار سخرية طوال النهار. كل واحد يستهزيء بي."], [8, "لأني كلما تكلمت أصرخ منددا، وأنادي: «ظلم واغتصاب» فجلبت علي كلمة الرب الاحتقار والعار طوال النهار."], [9, "إن قلت: «سأكف عن ذكره ولا أتكلم باسمه بعد» صار كلامه في قلبي كنار محرقة محصورة في عظامي، فأعياني كتمانه وعجزت عن كبته."], [10, "لأني سمعت نفثات تهديد من كثيرين، وأحاط بي رعب من كل جانب. يقولون: «اشتكوا عليه فنشتكي عليه»، حتى جميع أصدقائي الحميمين يرقبون كبوتي قائلين: «لعله يتعثر فنتغلب عليه وننتقم منه»."]]}, {"l": "Jer 37:1-38:28", "n": "", "vs": [[1, "وحكم الملك صدقيا بن يوشيا مكان كنياهو بن يهوياقيم، لأن نبوخذناصر ملك بابل ولاه على أرض يهوذا."], [2, "ولم يطع هو ولا عبيده ولا سكان البلاد كلام الرب، الذي نطق به على لسان إرميا النبي."], [3, "وبعث الملك صدقيا يهوخل بن شلميا، وصفنيا بن معسيا الكاهن إلى إرميا النبي قائلا: «تضرع إلى الرب إلهنا من أجلنا»،"], [4, "وكان إرميا في ذلك الوقت طليقا يتجول بين الشعب، إذ لم يكن قد اعتقل بعد في السجن."], [5, "وزحف جيش فرعون من مصر، فبلغ خبرهم الكلدانيين الذين يحاصرون أورشليم، ففكوا عنها الحصار."], [6, "فأوحى الرب بهذه النبوءة إلى إرميا قائلا:"], [7, "«هذا ما يعلنه الرب إله إسرائيل: هذا ما تبلغونه لملك يهوذا الذي بعثكم إلي لتستشيروني: إن جيش فرعون الزاحف لإغاثتكم على وشك العودة إلى أرضه، مصر."], [8, "فيعود الكلدانيون ويحاربون هذه المدينة ويستولون عليها ويحرقونها بالنار."], [9, "لذلك يقول الرب لا تخدعوا أنفسكم قائلين: سينسحب عنا الكلدانيون، فإنهم لا ينسحبون."], [10, "وحتى لو قضيتم على محاربيكم من جيش الكلدانيين بأسره، ولم يبق منهم سوى الجرحى القابعين في خيامهم، فإنهم سيهبون ويحرقون هذه المدينة بالنار»."], [11, "ولما فك جيش الكلدانيين الحصار عن أورشليم لمواجهة زحف جيش فرعون،"], [12, "غادر إرميا أورشليم لينطلق إلى أرض بنيامين ليحصل على نصيبه الذي اشتراه هناك بين الشعب."], [13, "فلما بلغ بوابة بنيامين قبض عليه رئيس الحراس واسمه يرئيا بن شلميا بن حننيا قائلا لإرميا النبي: «أنت هارب للانضمام إلى الكلدانيين»."], [14, "فأجابه إرميا: «هذا كذب، أنا لست هاربا للانضمام إلى الكلدانيين». فلم يصغ إليه يرئيا بل اعتقله وأتى به إلى الرؤساء."], [15, "فثار غضب الرؤساء على إرميا وضربوه، وزجوه في بيت يوناثان الكاتب الذي حولوه إلى سجن."], [16, "فعندما دخل إرميا إلى زنزانات الجب مكث هناك أياما كثيرة."], [17, "ثم استدعاه الملك صدقيا، وسأله في قصره سرا: «هل عندك كلمة وحي من عند الرب؟» فأجابه إرميا: «نعم». ثم أضاف: «إنك ستسلم إلى يد ملك بابل»."], [18, "ثم قال إرميا للملك صدقيا: «بماذا أسأت إليك وإلى رجالك وإلى هذا الشعب حتى زججتم بي في السجن؟"], [19, "وأين أنبياؤكم الذين تنبأوا لكم قائلين: إن ملك بابل لن يزحف عليكم وعلى هذه الأرض؟"], [20, "والآن اسمع ياسيدي الملك، وليحظ توسلي بقبولك، لا ترجعني إلى بيت يوناثان الكاتب لئلا أموت»."], [21, "فأصدر الملك صدقيا أمره بايداع إرميا دار الحرس وأن يقدم له رغيف من الخبز كل يوم من سوق الخبازين إلى أن ينفد الخبز كله من المدينة. وهكذا مكث إرميا في دار الحرس."], [1, "وبلغ مسامع شفطيا بن متان، وجدليا بن فشحور، ويوخل بن شلميا، وفشحور بن ملكيا، الكلام الذي كان إرميا يخاطب به كل الشعب قائلا:"], [2, "«هذا ما يعلنه الرب: إن كل من يمكث في هذه المدينة يموت بحد السيف وبالجوع والوباء. أما من يلجأ إلى الكلدانيين فإنه ينجو بنفسه ويفلت بحياته ويحيا."], [3, "ستسلم هذه المدينة حتما إلى يد جيش ملك بابل فيستولي عليها»."], [4, "فقال رؤساء البلاد للملك: «يجب إعدام هذا الرجل، لأنه يثبط عزيمة المحاربين الباقين في هذه المدينة وعزيمة سائر الشعب، لأنه يخاطبهم بمثل هذا الكلام. فهذا الرجل لا يلتمس لهذا الشعب خيرا بل شرا»."], [5, "فأجاب الملك صدقيا: «ها هو بين أيديكم. افعلوا به ما تشاؤون، لأن الملك لا يستطيع أن يعارضكم»."], [6, "فأخذوا إرميا وطرحوه في جب ملكيا ابن الملك القائم في دار الحرس. ودلوا إرميا بحبال، ولم يكن في الجب ماء بل وحل، فغاص فيه إرميا."], [7, "فلما سمع عبد ملك الخصي الإثيوبي المقيم في قصر الملك أنهم ألقوا بإرميا في الجب، وكان الملك آنئذ جالسا في بوابة بنيامين،"], [8, "غادر عبد ملك القصر، وقال للملك:"], [9, "«يامولاي الملك، قد أساء هؤلاء الرجال إلى إرميا النبي بما أوقعوه به من شر حين زجوه في الجب. فإنه لابد أن يتعرض للموت من جراء الجوع، إذ لا خبز في المدينة»."], [10, "فأمر الملك عبد ملك الإثيوبي: «اصطحب معك من هنا ثلاثين رجلا، واسحب إرميا من الجب قبل أن يموت»."], [11, "فاصطحب عبد ملك الرجال معه، ومضى إلى قصر الملك إلى قبو المستودع، وأخذ من هناك ثيابا رثة، وخرقا بالية، ودلاها إلى إرميا إلى الجب بحبال،"], [12, "وقال لإرميا: «ضع الثياب الرثة والخرق البالية بين إبطيك والحبال». ففعل إرميا كذلك."], [13, "فسحبوا إرميا بالحبال وأخرجوه من الجب. ومكث إرميا في دار الحرس."], [14, "ثم بعث الملك صدقيا واستدعى إليه إرميا النبي، واستقبله في المدخل الثالث لهيكل الرب. وقال الملك لإرميا: «أسألك عن أمر فلا تكتم عني شيئا»."], [15, "فأجاب إرميا صدقيا: «إن أنبأتك، ألا تقتلني حتما؟ وإن أشرت عليك فأنت لا تقبل مشورتي»."], [16, "فحلف الملك صدقيا لإرميا سرا قائلا: «حي هو الرب الذي صنع لنا أنفسنا، أني لا أقتلك ولا أسلمك إلى يد أعدائك طالبي نفسك»."], [17, "عندئذ قال إرميا لصدقيا: «هذا ما يعلنه الرب القدير إله إسرائيل: إن استسلمت إلى قواد ملك بابل تنجو بنفسك من الموت، ولا تحرق هذه المدينة بالنار بل تحيا أنت وأهل بيتك."], [18, "ولكن إن لم تستسلم لقواد ملك بابل فإن هذه المدينة تقع في قبضة الكلدانيين، فيحرقونها بالنار، وأنت لا تفلت من أيديهم»."], [19, "فأجاب الملك: «أخشى أن أقع في يد اليهود الذين لجأوا إلى الكلدانيين فيسخروا مني»."], [20, "فقال إرميا: «إنك لن تسلم إليهم. اسمع لصوت الرب في كل ما أقوله لك، فتنعم بالخير وتنجو نفسك."], [21, "لكن إن أبيت الاستسلام، فإليك الرؤيا التي أعلنها لي الرب:"], [22, "ها جميع النساء اللواتي ما برحن في قصر ملك يهوذا يؤسرن ويحملن إلى قواد ملك بابل، وهن قائلات: قد خدعك أصدقاؤك موضع ثقتك وتغلبوا على رأيك. وحالما غرقت رجلاك في الحمأة تخلوا عنك."], [23, "وتحمل جميع نسائك وأبنائك إلى الكلدانيين، وأنت لا تفلت من أيديهم، بل يأسرك ملك بابل، وتحرق هذه المدينة بالنار»."], [24, "فقال صدقيا لإرميا: «اكتم هذا الحديث فلا يعلم به أحد لئلا تموت."], [25, "فإذا سمع الرؤساء أني تحدثت إليك وسألوك: بماذا خاطبت الملك، وماذا قال الملك؟ لا تكتم عنا شيئا، ونحن لن نقتلك."], [26, "فأجبهم: إني توسلت إلى الملك أن لا يردني إلى بيت يوناثان لأموت هناك»."], [27, "فأقبل كل الرؤساء إلى إرميا واستجوبوه، فأخبرهم بمقتضى ما أوصاه به الملك من كلام. فكفوا عنه لأن الحديث الذي دار بينهما لم يشع."], [28, "فأقام إرميا في دار الحرس إلى اليوم الذي سقطت فيه أورشليم."]]}], "kwAr": "أنت شهدت", "noteAr": ""}, {"kw": "judge", "raw": "Gen_31:42; Psa_9:4, Psa_26:1, Psa_35:1, Psa_35:23, Psa_43:1; 1Pe_2:23", "note": "", "refs": [{"l": "Gen 31:42", "n": "", "vs": [[42, "ولولا أن إله أبي، إله إبراهيم وهيبة إسحق كانا معي لكنت الآن قد صرفتني فارغا. لكن الرب قد رأى مذلتي وتعب يدي فوبخك ليلة أمس»."]]}, {"l": "Psa 9:4", "n": "", "vs": [[4, "لأنك برأتني ودافعت عن قضيتي، إذ جلست على عرشك لتقضي بالعدل."]]}, {"l": "Psa 26:1", "n": "", "vs": [[1, "رب أظهر براءتي لأني قد سلكت بكمالي، وعليك توكلت فلا أتزعزع"]]}, {"l": "Psa 35:1", "n": "", "vs": [[1, "يارب كن خصما لمن يخاصمونني، وحارب الذين يحاربونني."]]}, {"l": "Psa 35:23", "n": "", "vs": [[23, "انهض ياإلهي وسيدي واستيقظ لإحقاق حقي وإنصاف دعواي."]]}, {"l": "Psa 43:1", "n": "", "vs": [[1, "ياالله احكم ببراءتي، ودافع عن قضيتي ضد شعب لا يرحم. أنقذني من الغشاش والظالم."]]}, {"l": "1Pe 2:23", "n": "", "vs": [[23, "ومع أنه أهين، فلم يكن يرد الإهانة. وإذ تحمل الآلام، لم يكن يهدد بالانتقام، بل أسلم أمره لله الذي يحكم بالعدل."]]}], "kwAr": "فاقض في دعواي", "noteAr": ""}], "arS": [["أنت ", []], ["شهدت", ["H7200"]], [" ما ", []], ["أساءوا", ["H5792"]], [" به إلي ", []], ["يارب", ["H3068"]], ["، ", []], ["فاقض", ["H8199"]], [" في ", []], ["دعواي", ["H4941"]], [".", []]]}, {"c": 3, "v": 60, "text": "قد رأيت انتقامهم كله وسائر مؤامراتهم علي.", "groups": [{"kw": "", "raw": "Lam_3:59; Psa_10:14; Jer_11:19, Jer_11:20", "note": "", "refs": رأة قائلة: «أغث ياسيدي الملك»."], [27, "فقال لها: «إن لم يغثك الرب، فمن أين يمكنني أن أحصل لك على الغوث؟ أمن قمح البيدر أم من نبيذ المعصرة؟»"], [28, "ثم سألها الملك: «مالك؟» فأجابت: «لقد قالت لي هذه المرأة، هاتي ابنك فنأكله اليوم، ثم نأكل ابني في اليوم التالي."], [29, "فسلقنا ابني وأكلناه. وعندما قلت لها في اليوم التالي: هاتي ابنك لنأكله، خبأت ابنها»."]]}, {"l": "Isa 49:15", "n": "", "vs": [[15, "هل تنسى المرأة رضيعها ولا ترحم ابن أحشائها؟ حتى هؤلاء ينسين، أما أنا فلا أنساكم."]]}, {"l": "Jer 19:9", "n": "", "vs": [[9, "وأطعمهم لحوم أبنائهم وبناتهم، ويأكل كل واحد لحم جاره في أثناء الحصار والضيقة التي يضايقهم بها أعداؤهم وطالبو نفوسهم."]]}, {"l": "Eze 5:10", "n": "", "vs": [[10, "إذ يأكل الآباء أبناءهم، والأبناء آباءهم، لأنني أجري فيك قضاء وأذري بقيتك كلها مع كل ريح."]]}, {"l": "Luk 23:28", "n": "", "vs": [[28, "فالتفت إليهن يسوع، وقال: «يابنات أورشليم، لا تبكين علي، بل ابكين على أنفسكن وعلى أولادكن!"]]}, {"l": "Luk 23:29", "n": "", "vs": [[29, "فها إن أياما ستأتي فيها يقول الناس: طوبى للعواقر اللواتي ما حملت بطونهن ولا أرضعت أثداؤهن!"]]}], "kwAr": "ابنة شعبي", "noteAr": ""}, {"kw": "like", "raw": "Job_39:13-16; Rom_1:31", "note": "", "refs": [{"l": "Job 39:13-16", "n": "", "vs": [[13, "يرفرف جناحا النعامة بغبطة، ولكن أهما جناحان مكسوان بريش المحبة؟"], [14, "فهي تترك بيضها على الأرض ليدفأ بالتراب،"], [15, "وتنسى أن القدم قد تطأ عليه، وأن بعض الحيوانات الكاسرة قد تحطمه."], [16, "إنها تعامل صغارها بقسوة كأنها ليست لها، غير آسفة على ضياع تعبها،"]]}, {"l": "Rom 1:31", "n": "", "vs": [[31, "لا فهم عندهم، ولا أمانة، ولا حنان، ولا رحمة."]]}], "kwAr": "كالنعام", "noteAr": ""}], "arS": [["حتى", ["H1571"]], [" ", []], ["بنات", ["H1323"]], [" ", []], ["آوى", ["H8565"]], [" ", []], ["تكشف", ["H2502"]], [" عن ", []], ["ثديها", ["H7699"]], [" ", []], ["وترضع", ["H3243"]], [" ", []], ["أجراءها", ["H1482"]], ["، أما ابنة ", []], ["شعبي", ["H5971"]], [" ", []], ["فقاسية", ["H393"]], [" ", []], ["كالنعام", ["H3283"]], [" في ", []], ["الصحراء", ["H4057"]], [".", []]]}, {"c": 4, "v": 4, "text": "قد التصق لسان الرضيع بحنكه عطشا، والتمس الأطفال خبزا وليس من يعطيه لهم.", "groups": [{"kw": "tongue", "raw": "Psa_22:15, Psa_137:6", "note": "", "refs": [{"l": "Psa 22:15", "n": "", "vs": [[15, "جفت نضارتي كقطعة الفخار، والتصق لساني بحنكي. إلى تراب الأرض تضعني."]]}, {"l": "Psa 137:6", "n": "", "vs": [[6, "ليلتصق لساني بحنكي إن لم أذكرك ولم أفضلك على ذروة أفراحي."]]}], "kwAr": "لسان الرضيع", "noteAr": ""}, {"kw": "the young", "raw": "Lam_1:11, Lam_2:11, Lam_2:12; Deu_32:24; Mat_7:9-11", "note": "", "refs": [{"l": "Lam 1:11", "n": "", "vs": [[11, "شعبها كله يتنهد وهو يبحث عن القوت. قد قايضوا ذخائرهم بالطعام لإنعاش النفس الخائرة. (وقالت:) «انظر يارب وتأمل كيف أصبحت محتقرة»."]]}, {"l": "Lam 2:11", "n": "", "vs": [[11, "كلت عيناي من البكاء، جاشت أحشائي وأريقت كبدي على الأرض حزنا لدمار ابنة شعبي، لأن الأطفال والرضع غشي عليهم في شوارع المدينة."]]}, {"l": "Lam 2:12", "n": "", "vs": [[12, "يقولون لأمهاتهم باكين: «أين الخبز والخمر؟» ثم يغشى عليهم كالجرحى في شوارع المدينة، حين تهرق حياتهم في أحضان أمهاتهم."]]}, {"l": "Deu 32:24", "n": "", "vs": [[24, "وحين يكونون خائرين من الجوع، منهوكين من الحمى والداء السام، أجعل أنياب الوحوش مع سم زواحف الأرض تنشب فيهم."]]}, {"l": "Mat 7:9-11", "n": "", "vs": [[9, "وإلا، فأي إنسان منكم يطلب منه ابنه خبزا، فيعطيه حجرا،"], [10, "أو سمكة، فيعطيه حية؟"], [11, "فإن كنتم وأنتم أشرار، تعرفون أن تعطوا أولادكم عطايا جيدة، فكم بالأحرى جدا يعطي أبوكم السماوي عطايا جيدة للذين يطلبون منه؟"]]}], "kwAr": "الأطفال", "noteAr": ""}], "arS": [["قد ", []], ["التصق", ["H1692"]], [" ", []], ["لسان", ["H3956"]], [" ", []], ["الرضيع", ["H3243"]], [" ", []], ["بحنكه", ["H2441"]], [" ", []], ["عطشا", ["H6772"]], ["، ", []], ["والتمس", ["H7592"]], [" ", []], ["الأطفال", ["H5768"]], [" ", []], ["خبزا", ["H3899"]], [" ", []], ["وليس", ["H369"]], [" من ", []], ["يعطيه", ["H6566"]], [" لهم.", []]]}, {"c": 4, "v": 5, "text": "هلك في الشوارع الذين كانوا يأكلون الطيبات، واحتضن المزابل المتربون على لبس الحرية.", "groups": [{"kw": "that did", "raw": "Deu_28:54-56; Isa_3:16-26, Isa_24:6-12, Isa_32:9-14; Jer_6:2, Jer_6:3; Amo_6:3-7; Luk_7:25; 1Ti_5:6; Rev_18:7-9", "note": "", "refs": [{"l": "Deu 28:54-56", "n": "", "vs": [[54, "فيقسو قلب أكثركم رقة ورأفة على أخيه وامرأته التي في حضنه وسائر أبنائه الأحياء."], [55, "فلا يعطي أحدهم من لحم أبنائه، الذي يأكله، لأنه لم يبق لديه شيء سواه في الحصار والضيقة التي يضايقكم بها عدوكم في جميع مدنكم."], [56, "وكذلك فإن أكثر النساء رقة ورأفة، والتي لنعومتها وترفهها لا تجرؤ على لمس الأرض بباطن قدمها، تبخل على زوجها رجل حضنها وعلى ابنها وابنتها"]]}, {"l": "Isa 3:16-26", "n": "", "vs": [[16, "ويقول الرب: «لأن بنات صهيون متغطرسات، يمشين بأعناق مشرئبة متغزلات بعيونهن، متخطرات في سيرهن، مجلجلات بخلاخيل أقدامهن."], [17, "سيصيبهن الرب بالصلع، ويعري عوراتهن»."], [18, "في ذلك اليوم ينزع الرب زينة الخلاخيل، وعصابات رؤوسهن والأهلة،"], [19, "والأقراط والأساور والبراقع،"], [20, "والعصائب والسلاسل والأحزمة، وآنية الطيب والتعاويذ"], [21, "والخواتم وخزائم الأنف،"], [22, "والثيا ب المزخرفة والعباءات والمعاطف والأكياس"], [23, "والمرايا والأردية الكتانية، والعصائب المزينة وأغطية الرؤوس"], [24, "فتحل العفونة محل الطيب، والحبل عوض الحزام، والصلع بدل الشعر المنسق، وحزام المسح في موضع الثوب الفاخر، والعار عوض الجمال،"], [25, "فيسقط رجالك في الحرب، ويلقى أبطالك حتفهم في ساحة الوغى"], [26, "فتنوح عليهم أبواب المدينة وتنطرح على الأرض مهجورة."]]}, {"l": "Isa 24:6-12", "n": "", "vs": [[6, "لذلك التهمت اللعنة الأرض، وعوقب أهلها بإثمهم، فاحترق سكان الأرض ولم يبق منهم سوى قلة."], [7, "قد انتحبت الخمرة، وذبلت الكرمة، وأن جميع ذوي القلوب الطربة."], [8, "خرس طرب الدفوف، كف ضجيج المبتهجين، وصمت مرح العود."], [9, "لا يعودون يشربون الخمر مع الغناء، ويكون المسكر مرا لشاربيه."], [10, "قد تدمرت مدينة الفوضى، وأغلق كل بيت، فلا يقدر أحد على الدخول."], [11, "ترتفع صرخة في الأزقة طلبا للخمرة المفقودة. زال كل فرح، وتلاشى السرور من الأرض"], [12, "بقي الخراب في المدينة، وتحطمت البوابات فأصبحت ردما."]]}, {"l": "Isa 32:9-14", "n": "", "vs": [[9, "أيتها النساء المترفات المتكاسلات، انهضن واستمعن إلى صوتي. أيتها البنات المطمئنات اصغين إلى أقوالي."], [10, "ما تكاد تنقضي أيام على سنة حتى تعتريكن رعدة أيتها الآمنات، لأن القطاف قد تلف، وموعد جني الأثمار قد أخلف."], [11, "ارتعدن أيتها النساء المطمئنات وارتجفن أيتها الفتيات الآمنات. تجردن من ثيابكن وتعرين ومنطقن أحقاءكن بالمسوح."], [12, "اضربن على صدوركن حسرة على المروج المبهجة والكروم المثمرة."], [13, "لأن أرض شعبي تنبت الشوك والحسك، فتنمو حتى في كل بيوت الفرح في المدينة المبتهجة."], [14, "لأن القصر يصبح مهجورا، والمدن العامرة خالية، والتلال والبروج مغاور إلى الأبد، ومراحا للحمير الوحشية ومرعى للقطعان،"]]}, {"l": "Jer 6:2", "n": "", "vs": [[2, "ها أنا أهلك أورشليم الجميلة المترفة ابنة صهيون،"]]}, {"l": "Jer 6:3", "n": "", "vs": [[3, "فيحل بها الرعاة مع قطعانهم، ويضربون حولها خيامهم، ويرعى كل منهم حيث نزل."]]}, {"l": "Amo 6:3-7", "n": "", "vs": [[3, "أنتم يامن تتجاهلون يوم السوء وتقربون كرسي الظلم."], [4, "ويل للراقدين فوق أسرة من عاج، المسترخين فوق الأرائك، الآكلين لحم خيرة الحملان والعجول المختارة من وسط المعلف."], [5, "المغنين على صوت الرباب، المخترعين لأنفسهم آلات غناء كداود."], [6, "الشاربين خمرا في كؤوس، المتطيبين بأفضل العطور، ولا يكتئبون على خراب يوسف."], [7, "لهذا سيكونون أول الذاهبين إلى السبي، ويزول ما أنتم عليه من لهو وعبث."]]}, {"l": "Luk 7:25", "n": "", "vs": [[25, "بل ماذا خرجتم لتروا؟ أإنسانا يلبس ثيابا ناعمة؟ ها إن لابسي الثياب الفاخرة والمترفهين هم في قصور الملوك."]]}, {"l": "1Ti 5:6", "n": "", "vs": [[6, "أما تلك التي تعيش منغمسة في اللذات، فقد ماتت، وإن كانت حية."]]}, {"l": "Rev 18:7-9", "n": "", "vs": [[7, "أنزلوا بها من العذاب والشقاء على قدر ما عظمت نفسها وترفهت. فإنها تقول في نفسها: أنا ملكة على العرش، ولست أرملة، ولن أذوق طعم الحزن."], [8, "لذلك ستنقض عليها البلايا في يوم واحد، من موت وحزن وجوع، وستحترق بالنار، فإن الله الذي يدينها هو رب قدير."], [9, "وسيبكي عليها ملوك الأرض الذين زنوا وترفهوا معها، وسينوحون وهم ينظرون إلى دخان حريقها،"]]}], "kwAr": "الذين كانوا يأكلون الطيبات", "noteAr": ""}, {"kw": "brought", "raw": "2Sa_1:24; Pro_31:21; Luk_16:19", "note": "", "refs": [{"l": "2Sa 1:24", "n": "", "vs": [[24, "يابنات إسرائيل، نحن على شاول الذي ألبسكن ثياب القرمز ورفهكن وزين ثيابكن بالحلي الذهبية."]]}, {"l": "Pro 31:21", "n": "", "vs": [[21, "لا تخشى على أهل بيتها من الثلج، لأن جميعهم يرتدون الحلل القرمزية."]]}, {"l": "Luk 16:19", "n": "", "vs": [[19, "كان هنالك إنسان غني، يلبس الأرجوان وناعم الثياب، ويقيم الولائم المترفة، متنعما كل يوم."]]}], "kwAr": "المتربون", "noteAr": ""}, {"kw": "embrace", "raw": "Job_24:8; Jer_9:21, Jer_9:22; Luk_15:16", "note": "", "refs": [{"l": "Job 24:8", "n": "", "vs": [[8, "يبتلون من مطر الجبال، ويركنون إلى الصخر لافتقارهم إلى المأوى."]]}, {"l": "Jer 9:21", "n": "", "vs": [[21, "فإن الموت قد تسلق إلى كوانا وتسلل إلى قصورنا، فاستأصل الأطفال من الشوارع والشبان من الساحات."]]}, {"l": "Jer 9:22", "n": "", "vs": [[22, "وهذا ما يعلنه الرب: «ستتهاوى جثث الناس مثل نفاية على وجه الحقل، وتتساقط كقبضات وراء الحاصد، وليس من يجمعها»."]]}, {"l": "Luk 15:16", "n": "", "vs": [[16, "وكم اشتهى لو يملأ بطنه من الخرنوب الذي كانت الخنازير تأكله، فما أعطاه أحد!"]]}], "kwAr": "احتضن المزابل", "noteAr": ""}], "arS": [["هلك", ["H8074"]], [" في ", []], ["الشوارع", ["H2351"]], [" الذين كانوا ", []], ["يأكلون", ["H398"]], [" ", []], ["الطيبات", ["H4574"]], ["، واحتضن ", []], ["المزابل", ["H830"]], [" ", []], ["المتربون", ["H539"]], [" ", []], ["على", ["H5921"]], [" لبس ", []], ["الحرية", ["H8438"]], [".", []]]}, {"c": 4, "v": 6, "text": "لأن عقاب إثم ابنة شعبي أعظم من عقاب خطيئة سدوم التي انقلبت في لحظة، من غير أن تمتد إليها يد إنسان.", "groups": [{"kw": "punishment of the iniquity of the daughter", "raw": "or, iniquity of the daughter, etc. Isa_1:9, Isa_1:10; Eze_16:48-50; Mat_11:23, Mat_11:24; Luk_10:12, Luk_12:47", "note": "or, iniquity of the daughter, etc. Isa_1:9, Isa_1:10; Eze_16:48-50; Mat_11:23, Mat_11:24; Luk_10:12, Luk_12:47", "refs": [{"l": "Isa 1:9", "n": "", "vs": [[9, "لولا أن الرب القدير حفظ لنا بقية يسيرة، لأصبحنا مثل سدوم وعمورة."]]}, {"l": "Isa 1:10", "n": "", "vs": [[10, "اسمعوا كلمة الرب ياحكام سدوم. أصغوا إلى شريعة إلهنا ياأهل عمورة:"]]}, {"l": "Eze 16:48-50", "n": "", "vs": [[48, "لذلك يقول السيد الرب حي أنا، إن سدوم أختك وبناتها لم يقترفن المفاسد التي اقترفتها أنت وبناتك."], [49, "أما إثم أختك سدوم، فإنها مع بناتها طغت عليها الغطرسة والتخمة وسلام الاطمئنان، ولم تغث الفقير والمسكين."], [50, "وتشامخن وارتكبن الرجس أمامي، فمحوتهن عندما شاهدت ذلك."]]}, {"l": "Mat 11:23", "n": "", "vs": [[23, "وأنت ياكفر ناحوم: هل ارتفعت حتى السماء؟ إنك إلى قعر الهاوية ستهبطين. فلو جرى في سدوم ما جرى فيك من المعجزات، لبقيت حتى اليوم."]]}, {"l": "Mat 11:24", "n": "", "vs": [[24, "ولكني أقول لكم إن حالة بلاد سدوم في يوم الدينونة، ستكون أخف وطأة من حالتك! »"]]}, {"l": "Luk 10:12", "n": "", "vs": [[12, "أقول لكم: إن سدوم ستكون حالتها في ذلك اليوم أخف وطأة من حالة تلك المدينة…"]]}, {"l": "Luk 12:47", "n": "", "vs": [[47, "وأما ذلك العبد الذي يعمل بإرادة سيده، فإنه سيضرب كثيرا."]]}], "kwAr": "عقاب إثم ابنة شعبي", "noteAr": "أو: إثم الابنة، إلخ. انظر إش 1: 9، 10؛ حز 16: 48-50؛ مت 11: 23، 24؛ لو 10: 12؛ 12: 47"}, {"kw": "the punishment", "raw": "Lam_4:9; Gen_19:25; Dan_9:12; Mat_24:21", "note": "", "refs": [{"l": "Lam 4:9", "n": "", "vs": [[9, "كان مصير ضحايا السيف أفضل من مصير ضحايا الجوع، الذين اضمحلوا من طعنة عقم الحقل."]]}, {"l": "Gen 19:25", "n": "", "vs": [[25, "وقلب تلك المدن والساكنين فيها، والسهل المحيط بها وكل مزروعات الأرض."]]}, {"l": "Dan 9:12", "n": "", "vs": [[12, "وقد نفذت قضاءك الذي قضيت به علينا وعلى قضاتنا الذين تولوا أمرنا، جالبا علينا وعلى أورشليم شرا عظيما لم يحدث له مثيل تحت السماء."]]}, {"l": "Mat 24:21", "n": "", "vs": [[21, "فسوف تحدث عندئذ ضيقة عظيمة لم يحدث مثلها منذ بدء العالم إلى الآن، ولن يحدث."]]}], "kwAr": "من عقاب خطيئة سدوم", "noteAr": ""}], "arS": [["لأن ", []], ["عقاب", ["H5771"]], [" إثم ", []], ["ابنة", ["H1323"]], [" ", []], ["شعبي", ["H5971"]], [" ", []], ["أعظم", ["H1431"]], [" ", []], ["من", ["H4480"]], [" ", []], ["عقاب", ["H2403"]], [" خطيئة ", []], ["سدوم", ["H5467"]], [" التي ", []], ["انقلبت", ["H2015"]], [" ", []], ["في", ["H3027"]], [" ", []], ["لحظة", ["H7281"]], ["، من ", []], ["غير", ["H3808"]], [" أن ", []], ["تمتد", ["H2342"]], [" إليها يد إنسان.", []]]}, {"c": 4, "v": 7, "text": "كان نبلاؤها أنقى من الثلج وأنصع من اللبن. أجسادهم أكثر حمرة من المرجان، وقاماتاهم كالياقوت العأزرق،", "groups": [{"kw": "Nazarites", "raw": "Num. 6:2-21; Jdg_13:5, Jdg_13:7, Jdg_16:17; Amo_2:11, Amo_2:12; Luk_1:15", "note": "", "refs": [{"l": "Num 6:2-21", "n": "", "vs": [[2, "«أوص بني إسرائيل وقل لهم: أي رجل أو امرأة تعهد بنذر خاص يتنسك فيه للرب،"], [3, "فليمتنع عن الخمر والمسكر، ولا يشرب خل الخمر ولا خل المسكر أو نقيع العنب، ولا يأكل عنبا رطبا ولا يابسا."], [4, "لا يذق كل أيام نذره شيئا من نتاج الكرمة حتى بذور العنب وقشره."], [5, "ولا يحلق رأسه طوال مدة نذره إلى أن تتم الأيام التي نذر فيها نفسه للرب، لأنه مقدس، فعليه أن يرخي خصل شعر رأسه."], [6, "لا يقرب جسد ميت كل أيام نذره للرب."], [7, "سواء كان الميت أباه أم أمه أم أخاه أم أخته فلا يتنجس من أجلهم عند موتهم، لأن رمز نسك إلهه على رأسه."], [8, "ويكون كل أيام نذره مقدسا للرب."], [9, "وإذا تنجس شعر انتذاره على أثر موت أحد عنده بغتة، يحلق شعره بعد ذلك بسبعة أيام فيطهر."], [10, "ثم في اليوم الثامن يأتي بيمامتين أو فرخي حمام إلى الكاهن عند مدخل خيمة الاجتماع."], [11, "فيقدم الكاهن أحدهما ذبيحة خطيئة والآخر محرقة، ويكفر عنه خطيئته لوجوده أمام جثة ميت، ويقدس رأسه في ذلك اليوم بعينه."], [12, "ولا تحسب له أيام نذره التي سبقت تنجيسه بسبب الميت، وعليه أن يبدأ عد أيام فترة نذره من جديد، ويأتي بحمل حولي ويقدمه ذبيحة إثم."], [13, "وهذه هي شريعة النذير عندما يستوفي أيام نذره: يأتي إلى مدخل خيمة الاجتماع،"], [14, "فيقدم قربانه للرب حملا حوليا، بلا عيب، ليكون محرقة، ونعجة حولية، صحيحة، لتكون ذبيحة خطيئة، وكبشا سليما ليكون ذبيحة سلامة."], [15, "فضلا عن سل من كعك فطير معجون بزيت، ورقاق غير مختمرة مدهونة بالزيت مع تقدمة دقيق وخمر."], [16, "فيقدمها الكاهن أمام الرب ذبيحة خطيئته ومحرقته."], [17, "ثم يقرب كبش ذبيحة السلامة مع سل كعك الفطير. وأخيرا يرفع الكاهن تقدمة الدقيق والخمر."], [18, "ثم يحلق النذير شعر انتذاره عند مدخل خيمة الاجتماع، ويحرقه على نار ذبيحة السلامة."], [19, "ثم يأخذ الكاهن كتف الكبش بعد سلقه، وكعكة فطير واحدة ورقاقة واحدة. ويضعها بين يدي النذير بعد حلقه شعر انتذاره."], [20, "ويرجحها الكاهن أمام الرب، فتكون نصيبا مقدسا للكاهن مع صدر الترجيح وساق الذبيحة. وبعد ذلك يشرب النذير خمرا."], [21, "هذه هي شريعة النذير الذي ينذر تقدمة للرب وقت نسكه، فضلا عن تقدماته الطوعية التي يبذلها. وعليه أن يفي بما نذر حسب شريعة انتذاره»."]]}, {"l": "Jdg 13:5", "n": "", "vs": [[5, "لأنك ستحملين وتنجبين ابنا. فلا تحلقي شعر رأسه لأن الصبي يكون نذيرا لله من مولده، وهو يشرع في إنقاذ إسرائيل من تسلط الفلسطينيين"]]}, {"l": "Jdg 13:7", "n": "", "vs": [[7, "وقال لي: ها أنت ستحبلين وتلدين ابنا، فإياك أن تشربي خمرا ولا مسكرا، ولا تأكلي شيئا محرما، لأن الصبي يكون نذيرا للرب منذ مولده حتى يوم وفاته»."]]}, {"l": "Jdg 16:17", "n": "", "vs": [[17, "فكشف لها عن مكنون قلبه، وقال لها: «إنني نذير الرب منذ مولدي، لهذا لم أحلق شعري. وإن حلقته فإن قوتي تفارقني وأصبح ضعيفا كأي واحد من الناس»."]]}, {"l": "Amo 2:11", "n": "", "vs": [[11, "وأقمت من بين أبنائكم أنبياء ومن فتيانكم نذيرين. أليس هذا صحيحا ياأبناء إسرائيل، يقول الرب؟"]]}, {"l": "Amo 2:12", "n": "", "vs": [[12, "ولكنكم سقيتم النذيرين خمرا، وأمرتم الأنبياء قائلين: لا تتنبأوا."]]}, {"l": "Luk 1:15", "n": "", "vs": [[15, "وسوف يكون عظيما أمام الرب، ولا يشرب خمرا ولا مسكرا، ويمتليء بالروح القدس وهو بعد في بطن أمه،"]]}], "kwAr": "نبلاؤها", "noteAr": ""}, {"kw": "purer", "raw": "1Sa_16:12; Psa_51:7, Psa_144:12; Son_5:10; Dan_1:15", "note": "", "refs": [{"l": "1Sa 16:12", "n": "", "vs": [[12, "فبعث يسى من استدعاه، وكان فتى أشقر، أخاذ العينين وسيم الطلعة. فقال الرب: « قم امسحه، لأن هذا هو من اخترته»."]]}, {"l": "Psa 51:7", "n": "", "vs": [[7, "طهرني بالزوفا فأتنقى. اغسلني فأبيض أكثر من الثلج."]]}, {"l": "Psa 144:12", "n": "", "vs": [[12, "حتى يكون أبناؤنا كأغراس نامية في حداثتها، وبناتنا مثل أعمدة زوايا القصور المنحوتة."]]}, {"l": "Son 5:10", "n": "", "vs": [[10, "(المحبوبة): حبيبي متألق وأحمر، علم بين عشرة آلاف."]]}, {"l": "Dan 1:15", "n": "", "vs": [[15, "وبعد عشرة أيام بدت مظاهرهم أكثر عافية وأوفر سمنا من جميع الفتيان الذين يتناولون من طعام الملك"]]}], "kwAr": "أنقى من الثلج", "noteAr": ""}, {"kw": "th
