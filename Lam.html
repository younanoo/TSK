 على آثامهم، وأضع حدا لصلف المتغطرسين وأذل كبرياء العتاة،"], [12, "فيصبح الرجال لقلة عددهم أندر من الذهب النقي وأعز من ذهب أوفير."], [13, "وأزلزل السماوات فتتزعزع الأرض في موضعها من غضب الرب القدير في يوم احتدام سخطه."], [14, "وتولي جيوش بابل الأدبار حتى ينهكها التعب، عائدين إلى أرضهم كأنهم غزال مطارد أو غنم لا راعي لها."], [15, "كل من يؤسر يطعن، ومن يقبض عليه يصرع بالسيف،"], [16, "ويمزق أطفالهم على مرأى منهم، وتنهب بيوتهم، وتغتصب نساؤهم."], [17, "ها أنا أثير عليهم الماديين الذين لا يكترثون للفضة ولا يسرون بالذهب،"], [18, "تمزق قسيهم الفتيان ولا يرحمون الأولاد أو الرضع."], [19, "أما بابل، مجد الممالك وبهاء وفخر الكلدانيين، فتصبح كسدوم وعمورة اللتين قلبهما الله ."], [20, "لا يسكن فيها، ولا تعمر من جيل إلى جيل، لا ينصب فيها بدوي خيمته، ولا يربض فيها راع قطعانه."], [21, "إنما تأوي إليها وحوش القفر وتعج بيوت خرائبها بالبوم، وتلجأ إليها بنات النعام، وتتواثب فيها الماعز البرية،"], [22, "وتتعاوى الضباع بين أبراجها، وبنات آوى بين قصورها الفخمة. إن وقت عقابها بات وشيكا، وأيامها لن تطول!"], [1, "ولكن الرب ينعم برحمته على ذرية يعقوب، ويصطفي شعب إسرائيل ثانية ويحلهم في أرضهم، فينضم الغرباء إليهم ويلحقون ببيت يعقوب."], [2, "وتمد شعوب الأرض إليهم يد العون ليساعدوا إسرائيل على العودة لدياره. ويصيرون عبيدا لبني إسرائيل، في أرض الرب، ويتسلطون على آسريهم وظالميهم."], [3, "في ذلك اليوم يريحكم الرب من عنائكم وشقائكم وعبوديتكم القاسية،"], [4, "فتسخرون من ملك بابل قائلين: كيف استكان الظالم، وكيف خمدت غضبته المتعجرفة؟"], [5, "قد حطم الرب عصا المنافق وصولجان المتسلطين،"], [6, "الذين انهالوا على الناس ضربا بسخط لا يتوقف؛ الذين تسلطوا على الأمم بغضب واضطهاد شديد."], [7, "فاستراحت الأرض كلها وسادها الهدوء، فتغنت شعوبها ترنما."], [8, "حتى شجر السرو وأرز لبنان عمها الفرح فقالت: «منذ أن انكسرت شوكتك لم يصعد إلينا قاطع حطب»"], [9, "ثارت الهاوية من أسفل لاَستقبالك عند قدومك وحشدت الأخيلة، من كل العظماء، لتحيتك؛ أنهضت كل ملوك الأمم عن عروشهم"], [10, "كلهم يخاطبونك قائلين: لقد صرت ضعيفا مثلنا، أصبحت مماثلا لنا!"], [11, "طرحت كل عظمتك في الهاوية مع رنة عيدانك، وأصبحت الرمم فراشك والدود غطاء لك!"], [12, "كيف هويت من السماء يازهرة بنت الصبح؟ كيف قطعت وطرحت إلى الأرض ياقاهر الأمم؟"], [13, "قد قلت في قلبك: إني أرتقي إلى السماء وأرفع عرشي فوق كواكب الله، وأجلس على جبل الاجتماع في أقصى الشمال"], [14, "أرتقي فوق أعالي السحاب، وأصبح مثل العلي."], [15, "ولكنك طرحت إلى الهاوية، إلى أعماق الجب."], [16, "والذين يرونك يحملقون فيك ويتأملون متسائلين: أهذا هو الإنسان الذي زعزع الأرض وهز الممالك؟"], [17, "الذي حول المسكونة إلى مثل القفر، وقلب مدنها، ولم يطلق أسراه ليرجعوا إلى بيوتهم؟"], [18, "لقد رقد كل ملوك الأمم بكرامة، كل في ضريحه،"], [19, "أما أنت فقد طرحت بعيدا عن قبرك كغصن مكسور تغطيك رمم قتلى المعارك الذين انحدروا إلى مقر الموتى، وصرت كجنة داستها حوافر الخيل"], [20, "لا تنضم إليهم في مدفن، لأنك خربت أرضك، وذبحت شعبك، فذرية فاعلي الإثم يبيد ذكرها إلى الأبد."], [21, "أعدوا مذبحة لأبنائه جزاء إثم آبائهم، لئلا يقوموا ويرثوا الأرض فيملأوا وجه البسيطة مدنا."], [22, "إني أهب ضدهم، يقول الرب القدير، وأمحو من بابل اسما وبقية ونسلا وذرية،"], [23, "وأجعلها ميراثا للقنافذ، ومستنقعات للمياه، وأكنسها بمكنسة الدمار»."], [24, "لقد أقسم الرب القدير قائلا: «حقا ما عزمت عليه لابد أن يتحقق، وما نويت عليه حتما يتم:"], [25, "أن أحطم أشور في أرضي وأطأه على جبالي، فيلقي عنهم نيره، ويزول عن كاهلهم حمله."], [26, "هذا هو القضاء الذي حكمت به على الأرض كلها، وهذه هي اليد التي امتدت على كل الأمم."], [27, "لأن الرب القدير قد قضى، فمن يبطل قضاءه؟ ويده قد امتدت فمن يردها؟»"], [28, "وفي السنة التي توفي فيها الملك آحاز أوحى الرب لإشعياء:"], [29, "«لا تفرحي ياكل فلسطين، لأن القضيب الذي ضربك قد انكسر. فإن من أصل تلك الأفعى يخرج أفعوان، وذريته تكون ثعبانا ساما طيارا"], [30, "أما أبكار البائسين فيرعون، والمساكين يربضون آمنين. لكنني أهلك أصلك بالمجاعة وأقضي على بقيتك."], [31, "ولول أيها الباب ونوحي أيتها المدينة! ذوبي خوفا يافلسطين قاطبة لأن جيشا مدربا قد زحف نحوك من الشمال"], [32, "فبماذا نجيب رسل الأمة؟ لتقل لهم: قد أسس الرب أورشليم ليلوذ بها منكوبو شعبه»."]]}, {"l": "Isa 47:1-15", "n": "", "vs": [[1, "انزلي واجلسي على التراب أيتها العذراء ابنة بابل. اجلسي على الأرض لا على العرش ياابنة الكلدانيين، لأنك لن تدعي من بعد الناعمة المترفهة."], [2, "خذي حجري الرحى واطحني الدقيق. اكشفي نقابك، وشمري عن الذيل، واكشفي عن الساق، واعبري الأنهار،"], [3, "فيظل عريك مكشوفا وعارك ظاهرا، فإني أنتقم ولا أعفو عن أحد."], [4, "إن فادينا، الرب القدير اسمه، هو قدوس إسرائيل."], [5, "اجلسي صامتة وأوغلي في الظلام ياابنة الكلدانيين، لأنك لن تدعي بعد سيدة الممالك."], [6, "قد سخطت على شعبي ونجست ميراثي. أسلمتهم إلى يديك، فلم تبدي نحوهم رحمة بل أرهقت الشيخ بنيرك الثقيل جدا."], [7, "وقلت: سأظل السيدة إلى الأبد. لذلك لم تفكري بهذه الأمور في نفسك ولا تأملت بما تؤول إليه."], [8, "فالآن اسمعي هذا أيتها المترفهة المتنعمة المطمئنة، القائلة في قلبها: أنا وحدي وليس هناك غيري، لن أعرف الترمل ولن أثكل"], [9, "لذلك ستبتلين بكلا الأمرين معا في لحظة، في يوم واحد، إذ تثكلين وتترملين حتى النهاية على الرغم من كثرة سحرك وقوة رقاك."], [10, "قد تولتك طمأنينة في شرك، وقلت: لا يراني أحد ولكن حكمتك ومعرفتك أضلاك، فقلت في نفسك: أنا وحدي، وليس هناك غيري."], [11, "سيدهمك شر لا تدرين كيف تدفعينه عنك، وتباغتك داهية تعجزين عن التكفير عنها، ويفاجئك خراب لا تتوقعينه."], [12, "تشبثي برقاك وكثرة سحرك التي تعبت فيها منذ صباك، فقد يحالفك النجاح أو تثيرين الرعب."], [13, "لقد ضعفت من كثرة طلب المشورة، فادعي المنجمين والفلكيين ليكشفوا لك طوالع المستقبل وينقذوك مما يأتي عليك."], [14, "غير أنهم أنفسهم أصبحوا كالهشيم الذي تلتهمه النار عاجزين عن إنقاذ أنفسهم وإنقاذك من شدة اللهب المحرق، فلا هو جمر للاستدفاء ولا هي نار للجلوس حولها."], [15, "هكذا يجري على الذين تعبت فيهم وتاجروا معك منذ صباك، قد شرد كل منهم في طريقه وليس من ينقذك."]]}, {"l": "Jer 25:17-29", "n": "", "vs": [[17, "فتناولت الكأس من يد الرب وسقيت منها جميع الأمم التي بعثني إليها الرب:"], [18, "أورشليم ومدن يهوذا وملوكها وعظماءها، لأجعلها قفرا خرابا ومثار صفير ولعنة إلى هذا اليوم."], [19, "وسقيت منها كذلك فرعون ملك مصر وخدامه وعظماءه وكل شعبه،"], [20, "وكل الغرباء المقيمين في وسطهم، وجميع ملوك أرض عوص، وسائر ملوك الفلسطينيين: ملوك أشقلون، وغزة، وعقرون وبقية أشدود،"], [21, "وآدوم، وموآب، وبني عمون،"], [22, "وكل ملوك صور وصيدون وملوك الجزائر عبر البحر،"], [23, "وددان وتيماء وبوز، وكل ذوي الشعر المقصوص الزوايا،"], [24, "وكل ملوك العرب، وسائر ملوك القبائل المنضمة إليهم المقيمين في الصحراء،"], [25, "وكل ملوك زمري، وعيلام، وجميع ملوك مادي."], [26, "وكل ملوك الشمال، القريبين والبعيدين، الواحد تلو الآخر، وكل الممالك المنتشرة على وجه الأرض. ثم بعد ذلك يشرب منها ملك بابل."], [27, "ثم قل لهم، هذا ما يعلنه الرب القدير إله إسر ائيل: اشربوا واثملوا وتقيأوا واسقطوا صرعى، ولا تقوموا من جراء السيف الذي أرسله في وسطكم."], [28, "وإن أبوا أن يتناولوا الكأس من يدك ليشربوا منها، فقل لهم: هذا ما يعلنه الرب القدير: لابد لكم من شربها،"], [29, "لأني شرعت أعاقب المدينة التي دعي اسمي عليها، فهل تفلتون أنتم من العقاب؟ فها أنا قد سلطت السيف على جميع سكان الأرض، يقول الرب القدير."]]}, {"l": "Jer 46:1-51:64", "n": "", "vs": [[1, "هذه هي النبوءة التي أوحى بها الرب إلى إرميا عن الأمم."], [2, "نبوءة عن مصر، عن جيش فرعون نخو ملك مصر الذي كان معسكرا على نهر الفرات في كركميش، حيث قضى عليه نبوخذناصر ملك بابل في السنة الرابعة ليهوياقيم بن يوشيا ملك يهوذا."], [3, "«أعدوا المجن والترس وازحفوا للقتال."], [4, "أسرجوا الخيل وامتطوها أيها الفرسان، وانتصبوا بالخوذ. اصقلوا الرماح والبسوا الدروع."], [5, "ولكن مالي أراهم يولون الأدبار مرتعبين؟ قد دحر محاربوهم وفروا مسرعين. لم يلتفتوا إلى الوراء، قد حاصرهم الهول من كل جانب»، يقول الرب."], [6, "«عجز الخفيف عن الجري للفرار، وليس في وسع المحارب الهرب. في الشمال عثروا وسقطوا إلى جوار نهر الفرات."], [7, "من هذا الطاغي كالنيل، كالأنهار المتلاطمة الأمواج؟"], [8, "تتعالى مصر كفيضان النيل، كالأنهار المتلاطمة الأمواج. تقول: أفيض وأغمر الأرض، أهدم المدن وأهلك سكانها."], [9, "اقتحمي أيتها الخيل، وثوري يامركبات، وليبرز المحاربون من رجال كوش وفوط، الحاملين التروس، ومن رجال لوديم رماة السهام بالقسي."], [10, "فهذا اليوم هو يوم قضاء السيد الرب القدير، يوم الانتقام. فيه يثأر لنفسه من أعدائه، فيلتهم السيف ويشبع، ويرتوي من دمائهم، لأن للسيد الرب القدير ذبيحة في أرض الشمال إلى جوار نهر الفرات."], [11, "اصعدي إلى جلعاد وخذي بلسانا ياعذراء ابنة مصر. ولكن باطلا تكثرين من العقاقير، إذ لا شفاء لك."], [12, "ستسمع الأمم بما لحق بك من عار، ويملأ صراخك الأرض، لأن بطلا محاربا يصطدم ببطل محارب فيسقطان كلاهما معا»."], [13, "النبوءة التي أوحى بها الرب إلى إرميا النبي عن زحف نبوخذناصر ملك بابل لمهاجمة مصر:"], [14, "«أذيعوا في مصر وأعلنوا في مجدل. خبروا في ممفيس وفي تحفنحيس، قولوا: قف متأهبا وتهيأ لأن السيف يلتهم من حولك."], [15, "لماذا فر إلهك الثور أبيس ولم يصمد في القتال؟ لأن الرب طرحه."], [16, "كثر العاثرين، فسقط كل واحد على صاحبه. فتقول بقية اليهود آنئذ: قوموا لنرجع إلى قومنا وإلى أرض موطننا، هربا من سيف الطاغي."], [17, "ويهتفون هناك: إن فرعون ملك مصر ليس سوى طبل أجوف أضاع فرصته."], [18, "حي أنا يقول الملك الذي اسمه الرب القدير، سيقبل نبوخذناصر كجبل تابور بين الجبال وكالكرمل عند البحر."], [19, "تأهبوا للجلاء ياأهل مصر، لأن ممفيس ستضحى أطلالا وخربا مهجورة."], [20, "مصر عجلة فاتنة هاجمها الهلاك من الشمال."], [21, "حتى مرتزقتها في وسطها كعجول مسمنة قد نكصوا على أعقابهم هاربين معا ولم يصمدوا، لأن يوم بلائهم قد حل بهم في وقت عقابهم."], [22, "صوتها كحفيف الحية المتلوية، لأن أعداءها زاحفون إليها بفؤوس كحطابي الأشجار."], [23, "سيقطعون غابها، يقول الرب، وإن كان يتعذر اختراقه، لأن عددهم يفوق الجراد في الكثرة."], [24, "لحق الخزي بابنة مصر، ووقعت في أسر أهل الشمال»."], [25, "ويقول الرب القدير إله إسرائيل: «ها أنا أعاقب آمون طيبة وفرعون، ومصر وآلهتها، وملوكها، وكل من يتكل على فرعون."], [26, "وأسلمهم إلى يد طالبي حياتهم: إلى يد نبوخذناصر ملك بابل ويد رجاله، ثم تعود بعد ذلك وتصبح آهلة بالسكان كالعهد بها في الحقب السالفة، يقول الرب."], [27, "ولكن لا تخافوا ياذرية عبدي يعقوب، ولا تفزع ياإسرائيل، لأني سأنقذكم من الغربة وأخلص نسلكم من أرض السبي، فترجع ذرية يعقوب وتتمتع بالدعة والطمأنينة من غير أن يرعبها أحد."], [28, "لا تخافوا ياذرية عبدي يعقوب، يقول الرب، لأني معكم وأفني جميع الأمم التي شتتكم إليها. أما أنتم فلا أفنيكم بل أؤدبكم بالحق، إنما لا أبرئكم جميعا»."], [1, "هذه هي النبوءة التي أوحى بها الرب إلى إرميا عن الفلسطينيين قبل أن يهاجم فرعون غزة."], [2, "هذا ما يعلنه الرب: «ها هي مياه تطغى من الشمال، فتصبح سيلا جارفا، فتغمر الأرض ومن عليها، المدينة والساكنين فيها. فيستغيث الناس ويولول كل أهل البلاد،"], [3, "من صوت وقع حوافر خيله، ومن جلبة مركباته، ومن صرير عجلاتها، فلا يلتفت الآباء إلى الأبناء من فرط ما يعتريهم من وهن."], [4, "رعبا من اليوم المقبل لإبادة الفلسطينيين، ولاستئصال صور وصيدون وكل معين باق، لأن الرب يدمر الفلسطينيين بقية جزيرة كفتور."], [5, "قد أصبحت غزة جرداء، وساد أشقلون صمت الموت. يابقية العناقيين، إلى متى تظلون تجرحون أنفسكم حزنا؟"], [6, "ياسيف الرب، متى تستكين؟ استقر في غمدك واهدأ واسترح."], [7, "كيف يمكن له أن يستكين، وقد أصدر الرب له أمره ليضرب أشقلون ومدن ساحل البحر، هناك واعده الرب على اللقاء»."], [1, "نبوءة عن الموآبيين: هذا ما يعلنه الرب القدير إله إسرائيل: «ويل لنبو لأنها أصبحت أطلالا. لحق العار بقريتايم وتم الاستيلاء عليها. خزي الحصن وارتعب."], [2, "زال فخر موآب وتآمروا في حشبون عليها شرا قائلين: هيا نهدمها فلا تكون أمة بعد. وأنت أيضا يامدمين، يهيمن عليك صمت الموت ويلاحقك السيف."], [3, "اسمعوا صوت صراخ من حورونايم: قد حل بنا هلاك ودمار عظيمان."], [4, "قد تحطمت موآب، وبلغ صراخها صوغر."], [5, "إذ على مرتفع لوحيت يصعدون باكين بمرارة، وعلى منحدر حورونايم يتردد صراخ الانكسار."], [6, "اهربوا وانجوا بأنفسكم. كونوا كعرعر في البرية."], [7, "لأنكم اتكلتم على أعمالكم وكنوزكم، ستسبون أيضا ويقع الصنم كموش أيضا أسيرا ويؤخذ إلى المنفى مع كهنته ورؤسائه."], [8, "ويزحف المدمر إلى كل مدينة، فلا تفلت منه إحداها، فيبيد الوادي، ويتلف السهل، لأن الرب قد قضى."], [9, "أعطوا موآب أجنحة، فيحلق طائرا. قد أصبحت مدنه أطلالا مهجورة من الناس."], [10, "ملعون من يقوم بعمل الرب متهاونا، وملعون من حظر على سيفه الدم."], [11, "قد قضى موآب حياة مترفة منذ حداثته، كالخمر المستقر على عكره. لم يفرغ من إناء إلى إناء، ولم يذهب إلى السبي قط لذلك ظل محتفظا بطعمه ولم تتغير رائحته."], [12, "ها هي أيام مقبلة، يقول الرب، أرسل فيها إليه عابري السبيل ساكبي الجرار، فيسكبونه ويفرغون جراره ويحطمون دنانه."], [13, "فيعتري الموآبيين الخجل من كموش، كما اعترى الخجل الإسرائيليين من بيت إيل، متكلهم."], [14, "كيف تقولون: إننا أبطال وجبابرة حرب؟"], [15, "إن موآب سيدمر، وتغزى مدنه، وتنزل نخبة شبانه للذبح، يقول الملك الذي اسمه الرب القدير."], [16, "قد أزفت بلية موآب ومحنته أقبلت مسرعة."], [17, "فارثوه ياجميع المحيطين به وسائر العارفين اسمه. قولوا انكسر صولجان العز وقضيب المجد."], [18, "اهبطي من المجد واجلسي على الأرض الظمأى أيتها الساكنة في ديبون، لأن مدمر موآب قد زحف عليك وهدم حصونك."], [19, "قفي على قارعة الطريق وراقبي ياساكنة عروعير. اسألي الهارب والناجية بنفسها: ماذا جرى؟"], [20, "فيأتي الجواب: قد لحق الخزي بموآب، لأنه صار أطلالا فولولوا وأعولوا. أذيعوا في أرنون أن موآب قد أصبح خرابا."], [21, "قد وقع القضاء على أرض السهل، وعلى حولون، وعلى يهصة، وعلى ميفعة،"], [22, "وعلى ديبون، وعلى نبو، وعلى بيت دبلتايم،"], [23, "وعلى قريتايم، وعلى بيت جامول، وعلى بيت معون،"], [24, "وعلى قريوت، وعلى بصرة، وعلى كافة مدن بلاد موآب البعيدة والقريبة."], [25, "قد كسر قرن موآب، وتحطمت ذراعه، يقول الرب."], [26, "أسكروه حتى يتمرغ في قيئه، ويصبح مهزأة، لأنه تغطرس على الرب."], [27, "ألم يصبح إسرائيل مهزأة لديك؟ أكان بين اللصوص حتى كنت تهز رأسك باحتقار كلما جاء ذكره على لسانك؟"], [28, "اهجروا المدن وأقيموا بين الصخور ياأهل موآب، وكونوا كالحمامة التي تعشش عند حافة فوهة الكهف."], [29, "قد سمعنا عن عجرفة موآب المفرطة. إنه شديد الكبرياء. سمعنا عن غطرسته وتشامخه وغروره، وعن ارتفاع قلبه."], [30, "قد عرفت كبرياءه يقول الرب، إنما زهوه باطل، وتفاخره عديم الجدوى."], [31, "لذلك أنوح على موآب وأعول على كل أهله، وأئن على رجال قير حارس."], [32, "أبكي عليك أكثر من البكاء على يعزير ياجفنة سبمة التي امتدت فروعها حتى البحر، بل بلغت بحر يعزير، فإن المدمر قد انقض على حصادك الناضج وقطافك."], [33, "قد تلاشى الفرح والغبطة من بساتين موآب ومن حقوله، وأوقف تدفق الخمر من المعاصر فلا يدوسها دائس بهتاف، بل تعلو صرخات لا هتاف فيها."], [34, "يرتفع الصراخ من حشبون إلى ألعالة فياهص. أطلقوا أصواتهم من صوغر إلى حورونايم حتى العجلة الثالثة، لأن مياه نمريم أيضا قد نضبت."], [35, "وأبيد من موآب، يقول الرب، من يقرب ذبيحة على مرتفعة، ومن يحرق بخورا لآلهة الوثن."], [36, "لذلك يئن قلبي على موآب كأنين مزمار، وينوح فؤادي على رجال قير حارس كنوح الناي، فإن ثروتهم التي اكتسبوها قد تبددت."], [37, "قد أصبح كل رأس أقرع، وكل لحية محلوقة، تجرحت الأيدي وتمنطقت الأحقاء بالمسوح."], [38, "شاع النوح على سطوح موآب وفي شوارعها كلها، لأني حطمت موآب كإناء ليس لأحد رغبة فيه، يقول الرب."], [39, "لشد ما تحطمت! لشد ما يولولون: كيف أدبر موآب مجللا بالخزي؟ قد صار مثار هزء ورعب لكل من حوله»."], [40, "لأن هذا ما يعلنه الرب: «انظروا، ها واحد يطير مسرعا كالنسر باسطا جناحيه ضد موآب."], [41, "فيستولي على المدن، وتسقط الحصون، وتصبح في ذلك اليوم قلوب محاربي موآب كقلب امرأة في مخاضها."], [42, "يهلك موآب ولا يبقى أمة، لأنه قد تغطرس على الرب."], [43, "يترصدكم الرعب والحفرة والفخ ياأهل موآب، يقول الرب."], [44, "من يهرب من الخوف يقع في الحفرة، ومن يصعد من الحفرة يعلق بالفخ، لأني أجلب على موآب هذه المحن في سنة عقابهم، يقول الرب."], [45, "في ظل حشبون وقف الهاربون خائري القوى، لأن نارا اندلعت من حشبون، وشعلة من سيحون، فالتهمت ركن موآب وهامة المتبجحين الغوغائيين."], [46, "ويل لك ياموآب! قد باد شعب كموش، لأن بنيك وبناتك أخذوا إلى السبي."], [47, "ولكني أرد سبي موآب في الأيام الآتية»، يقول الرب. إلى هنا ختام القضاء على موآب."], [1, "نبوءة عن بني عمون، هذا ما يعلنه الرب: «أليس لإسرائيل أبناء؟ أليس له وارث؟ فما بال ملك العمونيين قد استولى على ميراث سبط جاد وسكن شعبه في مدنه؟"], [2, "لذلك ها أيام مقبلة، يقول الرب، أجعل فيها هتاف القتال يتردد في ربة العمونيين، فتصير تلة أطلال، وتحرق قراها بالنار فيجلي الإسرائيليون الذين أجلوهم، يقول الرب."], [3, "أعولي ياحشبون لأن عاي قد خربت. ابكين يابنات ربة وتمنطقن بالمسوح. اندبن واذرعن الأرض بين السياجات فإن ملككن سيذهب إلى السبي مع كهنته ورؤسائه جميعا."], [4, "ما بالك تباهين بالأودية أيتها الابنة المخادعة التي اتكلت على نفائسها قائلة: من يهاجمني؟"], [5, "ها أنا أوقع بك الرعب من جميع المحيطين بك، فيتشرد كل واحد منكم مطرودا، وليس من يجمع شتات الهاربين."], [6, "ثم أعود فأرد سبي العمونيين، يقول الرب»."], [7, "نبوءة عن الأدوميين: «هذا ما يعلنه الرب القدير: ألم تبق في تيمان حكمة بعد؟ هل بادت المشورة من ذوي الفهم؟ هل تلاشت حكمتهم؟"], [8, "اهربوا: أدبروا، اختبئوا في الأعماق ياسكان ددان، لأني سأوقع البلية بذرية عيسو في أوان عقابها."], [9, "لو أقبل قاطفو العنب إليك، ألا يبقون خصاصة؟ ولو انسل اللصوص ليلا، ألا يقنعون بسلب ما يكفيهم؟"], [10, "أما أنا فقد جردت ذرية عيسو، وكشفت عن مخابئها السرية، وليس في وسعها الاختفاء. هلك أبناء عيسو وإخوته وجيرانه ولم يبق له أثر بعد."], [11, "اترك أيتامك فإني أحييهم، ولتتكل أراملك علي."], [12, "لأن هذا ما يعلنه الرب: إن كان الذين لا يستحقون تجرع كأس العقاب قد تجرعوه، أتفلت أنت من العقاب؟ إنك لن تفلت من العقاب، بل عليك أن تجرعه حتما."], [13, "ها أنا قد أقسمت بنفسي، يقول الرب، أن تصبح بصرة عرضة للرعب والعار والخراب واللعنة، وتغدو مدنها خرائب دائمة."], [14, "تبلغت رسالة من لدن الرب، أن سفيرا قد بعث إلى الأمم قائلا: «احشدوا أنفسكم لمهاجمتها. هبوا للقتال."], [15, "قد جعلتك صغيرا في الأمم، حقيرا بين الناس."], [16, "قد خدعك ما تثيره من رعب، وأغوتك كبرياء قلبك، يامن تقيم في شقوق الصخر وتعتصم بقمة التل. ولكنني سأطرحك من هناك ولو بنيت عشك عاليا كعش النسر، يقول الرب."], [17, "ستصبح أدوم مثار رعب، وكل من يمر بها تعتريه رعدة، ويصفر من جراء كل نكباتها،"], [18, "ويصيبها ما أصاب سدوم وعمورة وما جاورهما، من انقلاب، يقول الرب، فلا يسكن هناك إنسان ولا يتغرب فيها أحد."], [19, "ها هو ينقض على الأدوميين في مواطن صخورهم كما ينقض فجأة أسد من أجمات نهر الأردن؛ وفي لحظة أطردهم منها وأقيم عليها من أختاره، لأنه من هو مثلي؟ ومن يحاكمني؟ وأي راع يقوى على مواجهتي؟"], [20, "لذلك اسمعوا ما خططه الرب ضد أدوم، وما دبره ضد ساكني تيمان: ها صغار القوم يجرون، وتنهدم مساكنهم عليهم."], [21, "من صوت سقوطهم ترجف الأرض، وأصداء صراخهم تبلغ البحر الأحمر."], [22, "ها هو يحلق كالنسر، وينشر جناحيه على بصرة، فتصبح قلوب جبابرة أدوم كقلب امرأة ماخض»."], [23, "نبوءة عن دمشق: «قد لحق الخزي بحماة وأرفاد إذ بلغتهما الأنباء المزعجة، ذابتا خوفا واضطربتا كالبحر الهائج."], [24, "خارت قوى دمشق وأدبرت لتهرب، واستولى عليها الرعب، وأدركها الكرب والألم كامرأة ماخض."], [25, "كيف لم يبق على المدينة الشهيرة، مدينة مسرتي؟"], [26, "لذلك سيتساقط شبابها في ساحاتها، ويبيد جميع جنودها في ذلك اليوم، يقول الرب القدير."], [27, "سأضرم النار في سور دمشق فتلتهم قصور بنهدد»."], [28, "نبوءة عن قيدار وممالك حاصور التي هاجمها نبوخذناصر: «هذا ما يعلنه الرب: هبوا وازحفوا على قيدار. دمروا أمم المشرق."], [29, "فإن خيامهم وقطعان أغنامهم يستولى عليها، وتؤخذ أستارهم وأمتعتهم، وتنهب جمالهم منهم، ويهتف بهم الرجال: الرعب يحدق من كل جانب."], [30, "اهربوا سريعا. تفرقوا. تواروا في الأعماق ياأهل حاصور، يقول الرب، لأن نبوخذناصر ملك بابل تآمر عليكم ودبر خطته ضدكم."], [31, "هبوا، وازحفوا على أمة مترفة تسكن في دعة، يقول الرب. لا بوابات لها ولا مزاليج بل تسكن منفردة."], [32, "ستصبح إبلهم غنيمة وماشيتهم سلبا، وأذري لكل ريح كل مقصوصي زوايا الشعر، وأوقع بهم البلية من كل جوانبهم، يقول الرب."], [33, "فتصبح حاصور مأوى لبنات آوى، وخرابا إلى الأبد. لا يقيم هناك أحد، ولا يتغرب فيها إنسان»."], [34, "النبوءة التي أوحى بها الرب إلى إرميا عن عيلام في مستهل حكم صدقيا ملك يهوذا:"], [35, "هذا ما يعلنه الرب القدير: «ها أنا أحطم قوس عيلام، عماد قوتهم."], [36, "وأرسل على عيلام الرياح الأربع من أطراف السماء الأربعة، وأذريهم لكل تلك الرياح، فلا تبقى أمة لا يسبى إليها العيلاميون."], [37, "وأفزع عيلام أمام أعدائهم وأمام طالبي نفوسهم، وأعاقبهم بالشر وبغضبي اللاهب، وأجعل السيف يتعقبهم حتى أفنيهم."], [38, "وأنصب عرشي في عيلام، وأقضي على ملكهم وعلى عظمائهم."], [39, "ولكن أرد سبي عيلام في الأيام الآتية يقول الرب»."], [1, "النبوءة التي قضى بها الرب على بابل وعلى بلاد الكلدانيين على لسان إرميا النبي:"], [2, "«أذيعوا بين الأمم، وأعلنوا. انصبوا الراية وخبروا. لا تكتموا. قولوا: قد تم الاستيلاء على بابل ولحق ببيل العار وتحطم مرودخ. خربت أصنامها وانسحقت أوثانها."], [3, "لأن أمة من الشمال قد زحفت عليها لتجعل أرضها مهجورة. شرد منها الناس والبهائم جميعا."], [4, "وفي تلك الأيام، يقول الرب، يتوافد أبناء إسرائيل وأبناء يهوذا معا. يبكون في سيرهم ويلتمسون الرب إلههم."], [5, "يسألون عن الطريق إلى صهيون، ويتوجهون إليها قائلين: هلم ننضم إلى الرب بعهد أبدي لا ينسى."], [6, "إن شعبي كغنم ضالة، أضلهم رعاتهم، وشردوهم على الجبال، فتاهوا ما بين الجبل والتل ونسوا مربضهم."], [7, "كل من وجدهم افترسهم، وقال أعداؤهم: لا ذنب علينا لأنهم هم الذين أخطأوا في حق الرب الذي هو ملاذهم الحق، ورجاء آبائهم."], [8, "اهربوا من وسط بابل واخرجوا من ديار الكلدانيين وكونوا كالتيوس أمام قطيع الغنم."], [9, "فها أنا أثير وأجلب على بابل حشود أمم عظيمة من أرض الشمال فيتألبون عليها، ويستولون عليها من الشمال، وتكون سهامهم كجبار متمرس لا يرجع فارغا،"], [10, "فتصبح أرض الكلدانيين غنيمة، وكل من يسلبها يتخم، يقول الرب."], [11, "لأنكم تبتهجون وتطفرون غبطة يا ناهبي شعبي، وتمرحون كعجلة فوق العشب وتصهلون كالخيل."], [12, "فإن أمكم قد لحقها الخزي الشديد وانتابها الخجل. ها هي تضحي أقل الشعوب، وأرضها تصير قفرا جافا وصحراء."], [13, "وتظل بأسرها مهجورة وخربة، كل من يمر ببابل يصيبه الذعر ويصفر دهشة لما ابتليت به من نكبات، لأنها أثارت غضب الرب."], [14, "اصطفوا على بابل من كل ناحية ياجميع موتري الأقواس. ارموا السهام ولا تبقوا منها سهما واحدا، لأنها قد أخطأت في حق الرب."], [15, "أطلقوا هتاف الحرب عليها من كل جانب، فقد استسلمت وانهارت أسسها، وتقوضت أسوارها، لأن هذا هو انتقام الرب، فاثأروا منها، وعاملوها بمثل ما عاملتكم."], [16, "استأصلوا الزارع من بابل والحاصد بالمنجل في موسم الحصاد إذ يرجع كل واحد إلى قومه، ويهرب إلى أرضه فرارا من سيف العاتي."], [17, "إسرائيل قطيع غنم متشتت، طردته الأسود. كان ملك أشور أول من افترسه، ونبوخذناصر آخر من هشم عظامه."], [18, "لذلك هذا ما يعلنه الرب القدير إله إسرائيل: ها أنا أعاقب ملك بابل وأرضه. كما عاقبت ملك أشور من قبل."], [19, "وأرد إسرائيل إلى مرتعه، فيرعى في الكرمل وفي باشان، وتشبع نفسه في جبل أفرايم وجلعاد."], [20, "وفي ذلك الزمان والأوان، يقول الرب، يلتمس إثم إسرائيل فلا يوجد، وخطيئة يهوذا فلا تكون، لأني أعفو عمن أبقيته منهما."], [21, "ازحف على أرض ميراثايم (ومعناه: المفرط في التمرد)، وعلى المقيمين في فقود (ومعناه: العقاب). خرب، ودمر وراءهم، يقول الرب وافعل كل ما آمرك به."], [22, "قد علت جلبة القتال في الأرض. صوت تحطيم عظيم."], [23, "كيف تكسرت وتحطمت بابل، مطرقة الأرض كلها؟ كيف أصبحت بابل مثار دهشة عند الأمم؟"], [24, "قد نصبت الشرك فوقعت فيه، يابابل، من غير أن تشعري به. قد وجدت وقبض عليك، لأنك خاصمت الرب."], [25, "قد فتح الرب مخزن سلاحه، وأخرج آلات سخطه، لأنه ما برح للسيد الرب القدير عمل ينجزه في ديار الكلدانيين."], [26, "ازحفوا عليها من أقاصي الأرض، وافتحوا أهراءها، وكوموها أعراما واقضوا عليها قاطبة ولا تتركوا منها بقية."], [27, "اذبحوا جميع ثيرانها، أحضروها للذبح. ويل لهم لأن يوم موعد عقابهم قد حان."], [28, "اسمعوا! ها جلبة الفارين الناجين من ديار بابل لكي يذيعوا في صهيون أنباء انتقام الرب إلهنا والثأر لهيكله."], [29, "استدعوا إلى بابل رماة السهام، جميع موتري القسي. عسكروا حولها فلا يفلت منها أحد. جازوها بمقتضى أعمالها، واصنعوا بها كما صنعت بكم، لأنها بغت على الرب قدوس إسرائيل."], [30, "لذلك يصرع شبانها في ساحاتها، ويبيد في ذلك اليوم جميع جنودها، يقول الرب."], [31, "ها أنا أقاومك أيتها المتغطرسة، يقول الرب القدير، لأن يوم إدانتك وتنفيذ العقاب فيك قد حان،"], [32, "فيتعثر المتغطرس ويكبو ولا يوجد من ينهضه، وأضرم نارا في مدنه فتلتهم ما حوله»."], [33, "وهذا ما يعلنه الرب القدير: «قد وقع الظلم على شعب إسرائيل وعلى شعب يهوذا، وجميع الذين سبوهم تشبثوا بهم وأبوا أن يطلقوهم."], [34, "غير أن فاديهم قوي، الرب القدير اسمه، وهو حتما يدافع عن قضيتهم لكي يشيع راحة في الأرض ويقلق أهل بابل."], [35, "ها سيف على الكلدانيين، يقول الرب، وعلى أهل بابل، وعلى أشرافها، وعلى حكمائها."], [36, "ها سيف على عرافيها، فيصبحون حمقى. وها سيف على محاربيها، فيمتلئون رعبا."], [37, "ها سيف على خيلها، وعلى مركباتها، وعلى فرق مرتزقتها، فيصيرون كالنساء. ها سيف على كنوزها فتنهب."], [38, "ها الحر على مياهها فيصيبها الجفاف لأنها أرض أصنام، وقد أولع أهلها بالأوثان."], [39, "لذلك يسكنها وحش القفر مع بنات آوى، وتأوي إليها رعال النعام، وتظل مهجورة إلى الأبد، غير آهلة بالسكان إلى مدى الدهر."], [40, "وكما قلب الله سدوم وعمورة وما جاورهما، هكذا لن يسكن فيها أحد أو يقيم فيها إنسان."], [41, "ها شعب مقبل من الشمال، أمة عظيمة ولفيف من الملوك قد هبوا من أقاصي الأرض."], [42, "يمسكون بالقسي ويتقلدون بالرماح. قساة لا يعرفون الرحمة، جلبتهم كهدير البحر، يمتطون الخيل وقد اصطفوا كرجل واحد لمحاربتك يابنت بابل."], [43, "قد بلغ خبرهم ملك بابل فاسترخت يده وانتابته الضيقة ووجع امرأة في مخاضها."], [44, "انظر، ها هو كما ينقض عليها كما ينقض أسد من أجمات نهر الأردن، هكذا وفي لحظة أطردهم منها، وأولي عليها من أختاره لأنه من هو نظيري؟ ومن يحاكمني؟ وأي راع يقوى على مواجهتي؟"], [45, "لذلك اسمعوا ما خططه الرب ضد بابل، وما دبره ضد ديار الكلدانيين. ها صغارهم يجرون جرا، ويخرب مساكنهم عليهم."], [46, "من دوي أصداء سقوط بابل ترجف الأرض، ويتردد صراخها بين الأمم."], [1, "وهذا ما يعلنه الرب: ها أنا أثير على بابل وعلى المقيمين في ديار الكلدانيين ريحا مهلكة."], [2, "وأبعث إلى بابل مذرين يذرونها، ويجعلون أرضها قفرا، ويهاجمونها من كل جانب في يوم بليتها."], [3, "ليوتر الرامي قوسه وليتدجج بسلاحه. لا تعفوا عن شبانها، بل أبيدوا كل جيشها إبادة."], [4, "يتساقط القتلى في أرض الكلدانيين، والجرحى في شوارعها،"], [5, "لأن إسرائيل ويهوذا لم يهملهما الرب القدير وإن تكن أرضهما تفيض بالإثم ضد قدوس إسرائيل."], [6, "اهربوا من وسط بابل، ولينج كل واحد بحياته. لا تبيدوا من جراء إثمها، لأن هذا هو وقت انتقام الرب، وموعد مجازاتها."], [7, "كانت بابل كأس ذهب في يد الله، فسكر ت الأرض قاطبة. تجرعت الأمم من خمرها، لذلك جنت الشعوب."], [8, "فجأة سقطت بابل وتحطمت، فولولوا عليها، خذوا بلسانا لجرحها لعلها تبرأ."], [9, "قمنا بمداواة بابل، ولكن لم ينجع فيها علاج. اهجروها وليمض كل واحد منا إلى أرضه، لأن قضاءها قد بلغ عنان السماء، وتصاعد حتى ارتفع إلى الغيوم."], [10, "قد أظهر الرب برنا، فتعالوا لنذيع في صهيون ما صنعه الرب إلهنا."], [11, "سنوا السهام، وتقلدوا الأتراس، لأن الرب قد أثار روح ملوك الماديين، إذ وطد العزم على إهلاك بابل، لأن هذا هو انتقام الرب، والثأر لهيكله."], [12, "انصبوا راية على أسوار بابل. شددوا الحراسة. أقيموا الأرصاد. أعدوا الكمائن، لأن الرب قد خطط وأنجز ما قضى به على أهل بابل."], [13, "أيتها الساكنة إلى جوار المياه الغزيرة، ذات الكنوز الوفيرة، إن نهايتك قد أزفت، وحان موعد اقتلاعك."], [14, "قد أقسم الرب القدير بذاته قائلا: لأملأنك أناسا كالغوغاء فتعلو جلبتهم عليك."], [15, "هو الذي صنع الأرض بقدرته، وأسس الدنيا بحكمته، ومد السماوات بفطنته."], [16, "ما إن ينطق بصوته حتى تتجمع غمار المياه في السماوات، وتصعد السحب من أقاصي الأرض، ويجعل للمطر بروقا، ويطلق الريح من خزائنه."], [17, "كل امريء خامل وعديم المعرفة، وكل صائغ خزي من تمثاله، لأن صنمه المسبوك كاذب ولا حياة فيه."], [18, "جميع الأصنام باطلة وصنعة ضلال، وفي زمن عقابها تبيد."], [19, "أما نصيب يعقوب فليس مثل هذه الأوثان، بل هو جابل كل الأشياء. وشعب إسرائيل هو سبط ميراثه، واسمه الرب القدير."], [20, "أنت فأس معركتي وآلة حربي. بك أمزق الأمم إربا وأحطم ممالك."], [21, "بك أجعل الفرس وفارسها أشلاء، وأهشم المركبة وراكبها."], [22, "بك أحطم الرجل والمرأة، والشيخ والفتى، والشاب والعذراء."], [23, "بك أسحق الراعي وقطيعه، والحارث وفدانه، والحكام والولاة."], [24, "سأجازي بابل وسائر الكلدانيين على كل شرهم الذي ارتكبوه في حق صهيون، على مرأى منكم، يقول الرب."], [25, "ها أنا أنقلب عليك أيها الجبل المخرب، يقول الرب. أنت تفسد كل الأرض، لذلك أمد يدي عليك وأدحرجك من بين الصخور، وأجعلك جبلا محترقا."], [26, "فلا يقطع منك حجر لزاوية، ولا حجر يوضع كأساس، بل تكون خرابا أبديا، يقول الرب."], [27, "انصبوا راية في الأرض. انفخوا في البوق بين الأمم. أثيروا عليها الأمم لقتالها، وألبوا عليها ممالك أراراط ومني وأشكناز. أقيموا عليها قائدا. اجعلوا الخيل تزحف عليها كجحافل الجنادب الشرسة."], [28, "أثيروا عليها الأمم وملوك الماديين وكل حكامهم وولاتهم وسائر الديار التي يحكمونها."], [29, "الأرض ترجف وتقشعر، لأن قضاء الرب على بابل يتم، ليجعل أرض بابل خرابا وقفرا."], [30, "قد أحجم محاربو بابل الجبابرة عن القتال، واعتصموا في معاقلهم. خارت شجاعتهم، وصاروا كالنساء. احترقت مساكن بابل وتحطمت مزاليجها."], [31, "يركض عداء لملاقاة عداء آخر. ويسرع مخبر للقاء مخبر ليبلغ ملك بابل أن مدينته قد تم الاستيلاء عليها من كل جانب."], [32, "قد سقطت المعابر وأحرقت أجمات القصب بالنار واعترى الذعر المحاربين،"], [33, "لأن هذا ما يعلنه الرب القدير إله إسرائيل: إن أهل بابل كالبيدر، وقد حان أوان درس حنطته. وبعد قليل يأزف موعد حصادهم."], [34, "«يقول المسبيون: قد افترسنا نبوخذناصر ملك بابل وسحقنا وجعلنا إناء فارغا. ابتلعنا كتنين، وملأ جوفه من أطايبنا، ثم لفظنا من فمه."], [35, "يقول أهل أورشليم: ليحل ببابل ما أصابنا وأصاب لحومنا من ظلم. وتقول أورشليم: دمي على أهل أرض الكلدانيين."], [36, "لذلك هذا ما يعلنه الرب: ها أنا أدافع عن دعواك وأنتقم لك، فأجفف بحر بابل وينابيعها،"], [37, "فتصير بابل ركاما ومأوى لبنات آوى، ومثار دهشة وصفير وأرضا موحشة."], [38, "إنهم يزأرون كالأسود ويزمجرون كالأشبال."], [39, "عند شبعهم أعد لهم مأدبة وأسكرهم حتى تأخذهم النشوة فينامون نوما أبديا لا يقظة منه، يقول الرب."], [40, "وأحضرهم كالحملان للذبح وكالكباش والتيوس."], [41, "كيف استولي على بابل! كيف سقطت فخر كل الأرض! كيف صارت بابل مثار دهشة بين الأمم!"], [42, "قد طغى البحر على بابل فغمرها بأمواجه الهائجة،"], [43, "وأصبحت مدنها موحشة وأرض قفر وصحراء، أرضا لا يأوي إليها أحد ولا يجتاز بها إنسان."], [44, "وأعاقب الصنم: بيل في بابل، وأستخرج من فمه ما ابتلعه، فتكف الأمم عن التوافد إليه، وينهدم أيضا سور بابل."], [45, "اخرجوا من وسطها ياشعبي ولينج كل واحد بحياته هربا من احتدام غضب الرب."], [46, "لا يخر قلبكم ولا تفزعوا مما يشيع في الديار من أنباء، إذ تروج شائعة في هذه السنة وأخرى في السنة التالية، ويسود العنف الأرض، ويقوم متسلط على متسلط."], [47, "لذلك ها أيام مقبلة أعاقب فيها أصنام بابل ويلحق العار بأرضها كلها، ويتساقط قتلاها في وسطها."], [48, "عندئذ تتغنى بسقوط بابل السماوات والأرض وكل ما فيها، لأن المدمرين يتقاطرون عليها من الشمال، يقول الرب."], [49, "كما صرعت بابل قتلى إسرائيل، هكذا يصرع قتلى بابل في كل الأرض."], [50, "ياأيها الناجون من السيف، اهربوا ولا تقفوا، اذكروا الرب في مكانكم البعيد، ولا تبرح أورشليم من خواطركم."], [51, "قد لحقنا الخزي لأننا استمعنا للإهانة، فكسا الخجل وجوهنا، إذ انتهك الغرباء مقادس هيكل الرب."], [52, "لذلك ها أيام مقبلة، يقول الرب، أنفذ فيها قضائي على أصنام بابل، ويئن جرحاها في كل ديارها."], [53, "وحتى لو ارتفعت بابل فبلغت السماء، وحتى لو حصنت معاقلها الشامخة، فإن المدمرين ينقضون عليها من عندي، يقول الرب."], [54, "ها صوت صراخ يتردد في بابل، صوت جلبة دمار عظيم من أرض الكلدانيين،"], [55, "لأن الرب قد خرب بابل، وأخرس جلبتها العظيمة، إذ طغت عليها جحافل أعدائها كمياه عجاجة، وعلا ضجيج أصواتهم."], [56, "لأن المدمر قد انقض على بابل وأسر محاربيها، وتكسرت كل قسيها، لأن الرب إله مجازاة، وهو حتما يحاسبها."], [57, "إني أسكر رؤساءها وحكماءها ومحاربيها، فينامون نوما أبديا لا يقظة منه، يقول الملك، الرب القدير اسمه."], [58, "وهذا ما يعلنه الرب القدير: إن سور بابل العريض يقوض ويسوى بالأرض، وبواباتها العالية تحترق بالنار، ويذهب تعب الشعوب باطلا، ويكون مصير جهد الأمم للنار»."], [59, "هذه هي النبوءة التي أودعها إرميا النبي سرايا بن نيريا بن محسيا، عندما رافق صدقيا ملك يهوذا إلى بابل في السنة الرابعة لحكمه. وكان سرايا آنئذ رئيس المعسكر."], [60, "وكان إرميا قد دون في كتاب واحد جميع الكوارث التي ستبتلى بها بابل، أي جميع النبوءات المدونة عن بابل."], [61, "وقال إرميا لسرايا: «حالما تصل إلى بابل، اعمل على تلاوة جميع هذه النبوءات."], [62, "وقل: أيها الرب قد قضيت على هذا الموضع بالانقراض، فلا يسكن فيه أحد من الناس والبهائم، بل يصبح خرابا أبديا."], [63, "ومتى فرغت من تلاوة هذا الكتاب، اربط به حجرا واطرحه في وسط الفرات."], [64, "وقل: كذلك تغرق بابل ولا تطفو بعد لما أوقعه عليها من عقاب فيعيا كل أهلها».إلى هنا تنتهي نبوءات إرميا."]]}, {"l": "Eze 25:1-32:32", "n": "", "vs": [[1, "وأوحى إلي الرب بكلمته قائلا:"], [2, "«ياابن آدم، التفت بوجهك نحو بني عمون وتنبأ عليهم."], [3, "وقل لهم اسمعوا ما يعلنه السيد الرب من قضاء: لأنك شمت بمقدسي لأنه تدنس، وبأرض إسرائيل لأنها خربت وبشعب يهوذا لأنهم سيقوا إلى السبي،"], [4, "أسلمك للبدو وأبناء المشرق، فتصيرين ملكا لهم فينصبون مضاربهم فيك، ويقيمون مساكنهم فوق أرضك. هم يلتهمون غلتك، ويشربون لبنك."], [5, "وأجعل مدينة ربة مناخا للإبل، وسائر مدن بني عمون مرابض للغنم، فتدركون أني أنا الرب."], [6, "لأنك صفقت بكفيك طربا، وخبطت برجليك، وفرحت بكل ما فيك من لؤم لما حل بأرض إسرائيل."], [7, "لذلك ها أنا أثقل يدي عليك، وأسلمك غنيمة للأمم، وأستأصلك من بين الشعوب، وأفنيك من بين البلدان، وأدمرك، فتدرك أني أنا الرب."], [8, "وهذا ما يعلنه السيد الرب: لأن الموآبيين وأهل سعير يقولون: هل شعب يهوذا كبقية الأمم."], [9, "لذلك ها أنا أقوض جبهتهم الشرقية، وأدمر مدن حدودهم، بيت بشيموت وبعل معون وقريتايم وهي مدن مفخرة موآب."], [10, "فيستولى قبائل البدو عليها، ويصير بنو عمون ملكا لهم فلا يعود لهم ذكر بين الأمم."], [11, "وأنفذ في الموآبيين أحكاما، فيدركون أني أنا الرب."], [12, "وهذا أيضا ما يعلنه السيد الرب: لأن الأدوميين أقدموا على الانتقام من شعب يهوذا، وأساءوا إليه أشد إساءة."], [13, "ها أنا أعاقب الأدوميين وأستأصل من أرضهم الإنسان والحيوان، وأحولها إلى أطلال دارسة من التيمن إلى ددان، إذ يقتل أهلها جميعا بالسيف."], [14, "وأعهد بنقمتي إلى شعبي إسرائيل، فيفعلون بالأدوميين بمقتضى غضبي وسخطي، فيدركون شدة نقمتي، يقول السيد الرب."], [15, "وهذا أيضا ما يعلنه السيد الرب لأن الفلسطينيين قد أقدموا على الانتقام وأفرطوا فيه بكل لؤم قلوبهم، عامدين إلى الخراب بسبب عداوة أبدية،"], [16, "ها أنا أعاقب الفلسطينيين وأستأصل الكريتيين، وأبيد بقية سكان ساحل البحر،"], [17, "وأنفذ فيهم انتقامي العظيم بتأديب مفعم بالسخط، فيدركون أني أنا الرب، إذ أصب نقمتي عليهم»."], [1, "وفي السنة الحادية عشرة (من سبي الملك يهوياكين)، في اليوم الأول من الشهر، أوحى إلي الرب بكلمته قائلا:"], [2, "«ياابن آدم، لأن صور قد شمتت بأورشليم، وقالت: ها بوابة الشعوب قد انهارت، وتحولت القوافل إلي. ها أنا أزدهر إذ حل بها الدمار."], [3, "لذلك يعلن السيد الرب: ها أنا أعاقبك ياصور، فأجعل أمما كثيرة تهاجمك كما يهجم البحر بأمواجه."], [4, "فيهدمون أسوار صور وأبراجها، وأكشط ترابها عنها، وأحولها إلى صخرة جرداء."], [5, "فتصبح منشرا للشباك في وسط البحر لأني أنا قضيت، يقول السيد الرب، ثم تغدو غنيمة للأمم."], [6, "وتهلك ضواحيها الريفية بالسيف، فيدركون أني أنا الرب."], [7, "لأن هذا ما يعلنه السيد الرب: ها أنا آتي بملك الملوك، نبوخذناصر ملك بابل من الشمال بخيل وبمركبات وبفرسان وأقوام غفيرة،"], [8, "فيبيد بالسيف قرى ريفك ويشيد حولك سور حصار، ويبني عليك أبراجا، ويقيم مترسة، ويهاجمك بترس."], [9, "ويقذف أسوارك بمجانق، ويهدم أبراجك بعدة حربه."], [10, "ولكثرة خيله يحجبك غبار حوافرها، وتتزلزل أسوارك من صوت الفرسان والعربات والمركبات عند اقتحامه أبوابك كما تقتحم مدينة مثغورة،"], [11, "فيدوس بحوافر خيله كل شوارعك، ويقضي بالسيف على شعبك، فتتهاوى إلى الأرض أركان عزك،"], [12, "وينهبون ثروتك، ويستولون على تجارتك ويهدمون أسوارك وبيوتك المبهجة، ويطرحون حجارتك وخشبك وترابك إلى مياه البحر."], [13, "وأخرس أهازيج أغانيك، ولا تتردد بعد رنات أعوادك،"], [14, "وأجعلك كصخرة جرداء، فتكونين منشرا للشباك، ولا تعمرين في ما بعد. لأني أنا الرب قضيت يقول السيد الرب."], [15, "وهذا ما يعلنه السيد الرب عن مدينة صور: ألا ترتعد مدن السواحل لجلبة سقوطك، ولصراخ الجرحى، ولوقوع القتل فيك،"], [16, "فينزل جميع رؤساء المدن الساحلية عن عروشهم ويخلعون جببهم ويطرحون عنهم أرديتهم المزركشة، ويكتسون الرعب ثوبا، ويجلسون على الأرض مرتجفين في كل لحظة، مذعورين لما أصابك"], [17, "عندئذ ينوحون عليك بمرثاة قائلين: كيف تلاشيت من بين البحار أيتها المدينة العامرة الشهيرة، التي كانت مسيطرة هي وسكانها على البحر، فألقوا رعبهم على جميع جيرانها."], [18, "الآن ترتعد مدن السواحل في وقت سقوطك، وتضطرب الجزائر في وسط البحر لانهيارك،"], [19, "إذ أحولك إلى مدينة خربة كالمدن المقفرة. أطغي عليك لجج البحر وأغمرك بالمياه الكثيرة،"], [20, "وأحدرك مع الهابطين إلى الهاوية، إلى الشعب القديم، وأجعلك تقيمين في أسافل الأرض في الخرب الدائرة لتظلي مقفرة، فلا يكون لك مكان في أرض الأحياء،"], [21, "وأجلب الرعب عليك فلا يبقى منك أثر وإذ يبحث عنك لا يعثر عليك أبدا، يقول السيد الرب»."], [1, "وأوحى إلي الرب بكلمته قائلا:"], [2, "«وأما أنت ياابن آدم، فاندب صور بمرثاة،"], [3, "وقل لصور القائمة عند مداخل البحر، تاجرة الشعوب، القاطنة في مدن السواحل: ياصور أنت قلت: أنا كاملة الجمال."], [4, "تخومك في قلب البحار، وبناؤوك أكملوا جمالك،"], [5, "صنعوا كل ألواحك من سرو سنير، وأخذوا أرزا من لبنان ليعملوا لك سواري."], [6, "من بلوط باشان صنعوا مجاذيفك، وطعموا مقاعدك بالعاج المستجلب من سواحل قبرص."], [7, "نصبوا شراعك من كتان مطرز من مصر ليكون لك راية. وكانت مظلتك من قماش أزرق وأرجواني من جزائر أليشة."], [8, "كان أهل صيدون وإرواد ملاحيك، وحكماؤك المهرة ياصور الذين كانوا فيك هم ربابينك،"], [9, "شيوخ جبيل وصناعها المهرة الذين كانوا فيك هم قلافوك الذين يسدون شقوقك. جميع سفن البحر وملاحوها قدموا إليك للمتاجرة معك."], [10, "أقوام من فارس ولود وفوط انخرطوا في جيشك وكانوا من رجال حربك. علقوا على أسوارك أتراسا وخوذا، وخلعوا عليك بهاءك."], [11, "أبناء إرواد مع جيشك قائمون على أسوارك المحيطة بك، وتمنعت أبراجك برجال أبطال، علقوا أتراسهم على أسوارك المحيطة بك، وأكملوا جمالك."], [12, "ترشيش تاجرت معك لكثرة ما فيك من أنواع الغنى، فدفعت فضة وحديدا وقصديرا ورصاصا لقاء بضائعك."], [13, "تاجرت معك اليونان وتوبال وماشك، فقايضوا بضائعك بالرقيق وآنية النحاس،"], [14, "وقايض أهل بيت توجرمة بضائعك بالخيل والفرسان والبغال."], [15, "تاجر معك أهل رودس، ومدن ساحلية كثيرة كانت مراكز أسواقك، فدفعوا لك قرون العاج والآبنوس."], [16, "أدوم تاجرت معك، فقايضوا بضائعك في أسواقك بحجارة البهرمان والأرجوان، والقماش المطرز والبوص والمرجان والياقوت،"], [17, "وتاجرت معك أرض يهوذا وإسرائيل، فقايضوا بضائعك بالحنطة والزيتون وأوائل التين والعسل والزيت والبلسان."], [18, "دمشق تاجرت معك لكثرة بضائعك وفرط غناك، فقايضت بضائعك بخمرة حلبون والصوف الأبيض."], [19, "وقايض أهل دان واليونان بضائعك بخمرة أوزال والحديد المشغول والقرفة الصينية وقصب الذريرة."], [20, "وقايضت رودس بضائعك بأغطية السروج."], [21, "وتاجر معك العرب وكل رؤساء قيدار، فقايضوا بضائعك بالخرفان والكباش والأعتدة."], [22, "وتاجر معك أيضا تجار شبا ورعمة، فقايضوا بضائعك بأفخر أنواع الطيب والحجارة الكريمة والذهب."], [23, "ومن المتاجرين معك أيضا أهل حران وكنة وعدن وشبا، وأشور وكلمد."], [24, "هؤلاء قايضوا بضائعك بنفائس الأردية الأسمانجونية والمطرزة، وبسجاجيد ملونة مبرومة الخيطان ومضفورة بإحكام."], [25, "وكانت سفن ترشيش قوافلك البحرية المحملة بتجارتك، فامتلأت وتعظمت جدا في عرض البحار."], [26, "أبحر بك ملاحوك إلى لجج المياه حيث جعلتك الريح الشرقية حطاما في قلب البحار."], [27, "غرقت ثروتك وأسواقك وبضاعتك وملاحوك وربابينك وقلافوك والمتاجرون بمنتوجاتك في أعماق البحر في يوم سقوطك."], [28, "ترتعش مسارح القطعان من صوت صراخ ربابينك."], [29, "يهجر كل المجذفين والملاحين وربابنة البحر سفنهم ويقفون على البر."], [30, "يرفعون صوتهم بالنواح عليك ويصرخون بمرارة، ويذرون ترابا فوق رؤوسهم، ويتمرغون في الرماد."], [31, "يحلقون شعر رؤوسهم عليك، ويرتدون المسوح، ويندبونك بمرارة نفس ندبا أليما."], [32, "وفي ندبهم يقيمون عليك مناحة، ويرثونك قائلين: أية مدينة عمها الصمت مثل صور في قلب البحار؟"], [33, "عند وصول بضائعك عبر البحار أشبعت أمما كثيرة، وأغنيت ملوك الأرض بكثرة ثروتك وتجارتك."], [34, "ولكن حين أغرقتك العواصف في أعماق المياه، غرق معك ملاحوك وتجارتك."], [35, "فاعترى الذعر عليك كل سكان المدن الساحلية، واقشعر ملوكهم رعبا، واضطربت وجوههم."], [36, "يصفر تجار الشعوب دهشة عليك لما حل بك من مصير رهيب، ولن يبقى بعد منك أثر»."], [1, "وأوحى إلي الرب بكلمته قائلا:"], [2, "«ياابن آدم، قل لملك صور، هذا ما يعلنه السيد الرب: لأنك تكبرت وقلت: «أنا إله، وأتربع في مجلس الآلهة، في قلب البحار»؛ مع أنك إنسان ولست إلها، وإن ظننت أن لديك حكمة الآلهة!"], [3, "ها أنت أحكم من دانيآل ولا يخفى عليك سر."], [4, "قد استحوذت بحكمتك وفهمك على الذهب والفضة وادخرتها في خزائنك،"], [5, "وبمهارتك العظيمة في التجارة ضاعفت ثروتك، فتكبر قلبك لفرط غناك."], [6, "لذلك يقول السيد الرب: لأنك ظننت أن لديك حكمة الآلهة،"], [7, "ها أنا أثير عليك غرباء من أعتى الأمم، فيجردون سيوفهم على بهاء حكمتك، ويدنسون جمالك."], [8, "يطر حونك إلى الهاوية فتموت موت القتلى في أعماق البحار."], [9, "أتظل تقول أنئذ أمام قاتلك: أنا إله؟ أنت إنسان لا إله في قبضة ذابحيك."], [10, "فتلقى حتفك كالغلف بيد الغرباء، لأني أنا قضيت يقول السيد الرب»."], [11, "وأوحى إلي الرب بكلمته قائلا:"], [12, "«ياابن آدم، اندب ملك صور بمرثاة وقل له هذا ما يعلنه السيد الرب: كنت خاتم الكمال، مفعما بالحكمة وكامل الجمال."], [13, "كنت في جنة الله عدن، حجابك كل حجر كريم: عقيق أحمر وياقوت أصفر وعقيق أبيض وزبرجد وجزع ويشب وياقوت أزرق وبهرمان وزمرد وذهب. صاغوا منه بيوت حجارتك الكريمة وترصيعاتك يوم خلقت."], [14, "ومسحتك لتكون الكروبيم المظلل وأقمتك على جبل الله المقدس، وتمشيت بين حجار ة النار."], [15, "كنت كاملا في طرقك منذ يوم خلقت إلى أن وجد فيك إثم."], [16, "إنما بسبب كثرة تجارتك امتلأ داخلك ظلما، فأخطأت. لهذا أطرحك من جبل الله كشيء نجس، وأبيدك أيها الكروب المظلل من بين حجارة النار."], [17, "قد تكبر قلبك بسبب بهائك، وأفسدت حكمتك من جراء جلالك. سألقي بك إلى الأرض أمام الملوك لتكون عرضة لعيونهم الهازئة."], [18, "قد نجست مقادسك بفرط آثامك وتجارتك الظالمة. لذلك أجعل النار تندلع من وسطك فتلتهمك، وأحولك إلى رماد على الأرض أمام كل من يراك."], [19, "فيتحير لما أصابك جميع الذين يعرفونك بين الشعوب، إذ تحل بك الأهوال ولا يبقى منك أثر»."], [20, "وأوحى إلي الرب بكلمته قائلا:"], [21, "«ياابن آدم، التفت بوجهك نحو صيدون وتنبأ عليها."], [22, "وقل هذا ما يعلنه السيد الرب: ها أنا أنقلب عليك ياصيدون وأتجلى بمجدي فيك فيدرك سكانك أني أنا الرب حين أنفذ فيك أحكاما وأتقدس في وسطك."], [23, "أجعل الوبأ يتفشى فيك وتسفك دماء في أزقتك، ويتساقط في وسطك جرحى السيف الذي يحدق بك من كل ناحية، فيدركون أني أنا الرب."], [24, "فلا يتعرض شعب إسرائيل إلى وخزات العليق ولا إلى شوكة مؤذية من الأمم المحيطة بهم ممن تبغضهم، فيدركون أني أنا السيد الرب."], [25, "وهذا ما يعلنه السيد الرب: عندما أجمع شعب إسرائيل من بين الشعوب التي تفرقوا إليها، وتتجلى قداستي فيهم أمام عيون الأمم، عندما يعودون ويستوطنون في أرضهم التي وهبتها لعبدي يعقوب،"], [26, "ويقيمون فيها مطمئنين ويشيدون بيوتا ويغرسون كروما ويسكنون آمنين. وعندما أنفذ أحكاما في جميع أعدائهم المحيطين بهم، عندئذ يدركون أني أنا الرب إلههم»."], [1, "وفي اليوم الثاني عشر من الشهر العاشر العبري (أي كانون الأول ; ديسمبر) من السنة العاشرة (لسبي الملك يهوياكين)، أوحى إلي الرب بكلمته قائلا:"], [2, "«ياابن آدم، التفت نحو فرعون ملك مصر وتنبأ عليه وعلى مصر كلها"], [3, "وقل هذا ما يعلنه السيد الرب: ها أنا أنقلب عليك يافرعون ملك مصر، أيها التمساح الكامن في وسط أنهاره، القائل: النهر لي وقد صنعته لنفسي."], [4, "ها أنا أضع خزائم في فكيك وأجعل سمك أنهارك يلتصق بحراشفك، وأخرجك قسرا من أنهارك، وأسماكها ما برحت لاصقة بحراشفك."], [5, "وأهجرك في البرية مع جميع سمك أنهارك، فتتهاوى على سطح أرض الصحراء فلا تجمع ولاتلم بل تكون قوتا لوحوش البر ولطيور السماء."], [6, "فيدرك كل أهل مصر أني أنا الرب، لأنهم كانوا عكاز قصب هشة لشعب إسرائيل،"], [7, "ما إن اعتمدوا عليك بأكفهم حتى انكسرت ومزقت أكتافهم، وعندما توكأوا عليك تحطمت وقصفت كل متونهم."], [8, "لذلك ها أنا أجلب عليك سيفا وأستأصل منك الإنسان والحيوان،"], [9, "فتصبح ديار مصر مقفرة خربة، فيدركون أني أنا الرب، لأن فرعون قال: لي النهر وأنا قد صنعته."], [10, "لذلك ها أنا أنقلب عليك وعلى أنهارك، وأجعل أراضي مصر خرائب متردمة مقفرة، من مجدل إلى أسوان حتى تخوم إثيوبيا."], [11, "لا تمر بها قدم إنسان ولا تجتازها رجل بهيمة، وتظل مهجورة من الناس طوال أربعين سنة."], [12, "وأجعل ديار مصر الأكثر وحشة بين الأراضي المقفرة، وتظل مدنها الأكثر خرابا بين المدن الخربة وأشدها وحشة طوال أربعين سنة، وأشتت المصريين بين الأمم وأفرقهم في البلدان."], [13, "وفي نهاية الأربعين سنة أجمع المصريين من بين الشعوب التي تشتتوا بينها."], [14, "وأرد سبيهم، وأعيدهم إلى أرض فتروس موطنهم، فيكونون هناك مملكة حقيرة."], [15, "بل تكون أحقر الممالك فلا تتشامخ بعد على بقية الأمم، وأجعلهم أقلية لئلا يتسلطوا على الشعوب."], [16, "فلا تكون بعد محط اعتماد لشعب إسرائيل، بل تذكرهم بإثمهم حين ضلوا وراءهم، فيدركون أني أنا السيد الرب»."], [17, "وفي مطلع الشهر الأول العبري (أي آذار ; مارس) في السنة السابعة والعشرين (من سبي الملك يهوياكين) أوحى إلي الرب بكلمته قائلا:"], [18, "«ياابن آدم، إن نبوخذناصر ملك بابل قد سخر جيشه أشد تسخير ضد صور، فأصبحت كل رأس من رؤوس جنوده صلعاء، وكل كتف مجردة من الثياب. ولكن لم يغنم هو ولا جيشه شيئا من صور رغم ما كابده من جهد للاستيلاء عليها."], [19, "لذلك هذا ما يعلنه السيد الرب: ها أنا أبذل ديار مصر لنبوخذناصر ملك بابل فيستولي على ثروتها، ويسلبها غنائمها وينهبها، فتكون هذه أجرة لجيشه."], [20, "قد أعطيته أرض مصر لقاء تعبه، لأنه وجيشه قد عملوا في خدمتي، يقول السيد الرب."], [21, "في ذلك اليوم، أنمي قوة شعب إسرائيل وأفتح فمك بينهم، فيدركون أني أنا الرب»."], [1, "وأوحى إلي الرب بكلمته قائلا:"], [2, "«ياابن آدم، تنبأ وقل: هذا ما يعلنه السيد الرب: ولولوا قائلين: يالليوم الرهيب!"], [3, "إن يوم الرب بات وشيكا؛ يوم الرب قريب، إنه يوم مكفهر بالغيوم، ساعة دينونة للأمم،"], [4, "إذ يجرد سيف على مصر، فيعم الذعر الشديد إثيوبيا، عندما يتهاوى قتلى مصر ويستولى على ثروتها، وتنقض أسسها."], [5, "ثم تسقط معهم بالسيف إثيوبيا وفوط ولود وشبه الجزيرة العربية وليبيا وشعوب الأرض المتحالفة معهم."], [6, "حقا يسقط مناصر مصر وتذل كبرياء عزتها، فيتهاوى بالسيف سكانها من مجدل إلى أسوان، يقول السيد الرب."], [7, "فتصبح أكثر الأراضي المقفرة وحشة، وتضحى مدنها أكثر المدن خرابا!"], [8, "فيدركون أني أنا الرب حين أضرم نارا في مصر وينهار جميع حلفائها."], [9, "في ذلك اليوم يسرع رسلي إلى إثيوبيا المطمئنة ليثيروا فيها الرعب في يوم هلاك مصر، الذي لابد أن يتحقق."], [10, "لأني سأفني جماهير مصر بيد نبوخذناصر ملك بابل."], [11, "إذ يقبل هو وجيشه، أعتى جيوش الأمم، لخراب ديار مصر، فيجردون عليها سيوفهم ويملأون أرضها بالقتلى."], [12, "وأجفف مجاري نهر النيل، وأبيع الأرض لقوم أشرار، وأخرب البلاد فيها بيد غرباء. أنا الرب قضيت."], [13, "ثم أحطم الأصنام وأزيل الأوثان من ممفيس، ولا يبقى بعد رئيس في ديار مصر، وألقي فيها الرعب."], [14, "وأخرب فتروس، وأضرم نارا في صوعن، وأنفذ أحكاما في طيبة."], [15, "وأصب غضبي على سين حصن مصر، وأبيد أهل طيبة."], [16, "وأضرم نارا في مصر فتقاسي سين أشد الألم، وتتمزق طيبة شر تمزيق، وتتعرض ممفيس للرعب في كل يوم."], [17, "ويتساقط بالسيف شبان آون وفيبستة، ويسبى بقية سكانها"], [18, "ويظلم النهار في تحفنحيس عندما أحطم أنيار مصر هناك، وتتلاشى كبرياء عزتها. أما هي فتغشاها سحابة، وتسبى بناتها."], [19, "وهكذا أنفذ أحكاما في مصر، فيدركون أني أنا الرب»."], [20, "وفي اليوم السابع من الشهر الأول العبري (أي آذار ; مارس) من السنة الحادية عشرة (من سبي الملك يهوياكين)، أوحى إلي الرب بكلمته قائلا:"], [21, "«ياابن آدم، إني حطمت ذراع فرعون ملك مصر، ولن تجبر بالرفائد أو العصائب، فتجرد سيفا،"], [22, "وها أنا أنقلب على فرعون ملك مصر وأحطم ذراعيه، السليمة والمكسورة، وأسقط السيف من يده."], [23, "وأشتت المصريين بين الأمم وأفرقهم في البلدان."], [24, "وأشدد ذراعي ملك بابل وأضع سيفي في يده، وأحطم ذراع فرعون، فيئن أمامه أنين الجريح."], [25, "وأشدد ذراعي ملك بابل. أما ذراعا فرعون فتتهاويان، فيدركون أني أنا الرب حين أضع سيفي في يد ملك بابل، فيجرده على ديار مصر."], [26, "وأبدد المصريين بين الأمم وأمزقهم في البلدان، فيدركون أني أنا الرب»."], [1, "وفي مطلع الشهر الثالث العبري (أي أيار ; مايو) من السنة الحادية عشرة (لسبي الملك يهوياكين)، أوحى إلي الرب بكلمته قائلا:"], [2, "«ياابن آدم، قل لفرعون ملك مصر ولشعبه: من ماثلت بعظمتك؟"], [3, "إنني أشبهك بشجرة أرز في لبنان، بهية الأغصان، وارفة الظل، شامخة تطاول قمتها الغيوم،"], [4, "ترويها المياه، وتنميها اللجج. تجري أنهارها حول مغرسها، وتنساب جداولها إلى كل أشجار الحقل."], [5, "لهذا طاولت قامتها خميع أشجار الحقل وتكاثرت أغصانها، وامتدت فروعها التي نبتت لغزارة مياهها."], [6, "وعششت في أغصانها كل طيور السماء، وتحت فروعها ولدت كل حيوان البر، وأوت تحت ظلها كل أمم الأرض العظيمة."], [7, "فكانت رائعة في عظمتها وفي شموخ قامتها لأن جذورها كانت مغروسة في مياه غريرة."], [8, "لم يضاهها الأرز في جنة الله، ولم يعادل السرو أغصانها، ولم يماثل الدلب فروعها. كل الأشجار في جنة الله لم تشبهها في حسنها."], [9, "جعلتها بهية لكثرة أغصانها حتى حسدتها كل أشجار عدن التي في جنة الله."], [10, "لذلك يقول السيد الرب: لأنك يافرعون شمخت بقامتك وطاولت بهامتك الغيوم، تكبر قلبك من جراء عظمتك."], [11, "أسلمتك إلى يد المتسلط على الأمم فيعاملك أقسى معاملة. إني نبذتك لفرط شرك."], [12, "ويستأصله الغرباء عتاة الأمم، ويتركونه، فتتهاوى أغصانه على الجبال وفي جميع الوهاد، وتتحطم فروعه إلى جوار كل أنهار الأرض، ويهجر ظله كل شعوب الأرض وينبذونه."], [13, "وتجثم على حطامه طيور السماء جميعها، وتربض فوق قضبانه كل حيوان البر"], [14, "لئلا تشمخ شجرة ما مغروسة على المياه لاَرتفاع قامتها، ولا تطاول بهامتها الغيوم، ولكي لا تبلغ أية شجرة ترويها المياه مثل هذا العلو، لأنها جميعها مآلها الموت، حيث تمضي إلى الأرض السفلى بين الفانين من بني آدم، مع الهابطين إلى الهاوية."], [15, "وهذا ما يعلنه السيد الرب: وفي يوم هبوطه إلى الهاوية يعم النواح الطبيعة، فأكسو الغمر ثياب الحداد عليه، وأكبح جريان أنهاره، وتكف مياهه عن التدفق وأجعل لبنان ينوح عليه، وتذبل كل أشجار الحقل حزنا على هلاكه."], [16, "من جلبة سقوطه حين أنزلته إلى الهاوية مع الهابطين إليها ارتعدت الأمم، فتتعزى في الأرض السفلى كل أشجار عدن ونخبة أشجار لبنان، وكل مرتوية من ماء."], [17, "هم أيضا ينحدرون معه إلى الهاوية لينضموا إلى قتلى السيف، وكذلك يهلك حلفاؤه من الأمم المقيمين تحت ظله."], [18, "من ماثلت بين أشجار عدن في المجد والعظمة؟ ستنحدر إلى الأرض السفلى مع أشجار عدن، وترقد مع الغلف، مع المقتولين بالسيف. هذا هو مصير فرعون وكل شعبه، يقول السيد الرب»."], [1, "وفي مطلع الشهر الثاني عشر (أي شباط ; فبراير) من السنة الثانية عشرة (لسبي الملك يهوياكين) أوحى إلي الرب بكلمته قائلا:"], [2, "«ياابن آدم، اندب فرعون ملك مصر بمرثاة وقل له: أنت شبهت نفسك بشبل بين الأمم، مع أنك مثل تمساح في البحار. اقتحمت أنهارك وكدرت الماء بقدميك وعكرت أنهارهم."], [3, "لذلك ها أنا أنشر عليك شبكتي مع أقوام شعوب غفيرة فيصعدونك وأنت عالق فيها."], [4, "وأتركك ملقى على الأرض وأطرحك في العراء، فأجعل كل طيور السماء تستقر عليك، وأشبع منك جميع وحوش الأرض."], [5, "وأنثر لحمك على الجبال، ومن جيفك أملأ الأودية."], [6, "وأروي الأرض من دمك الجاري حتى يبلغ الجبال وتفيض به الوهاد."], [7, "وعندما أخمدك أحجب السماوات وأظلم نجومها، وأكفن الشمس بسحاب، ولا ينير القمر بضوئه."], [8, "وأعتم فوقك كل أنوار السماء المضيئة، وأجعل الظلمة تغمر أرضك يقول السيد الرب."], [9, "وأشيع الغم في قلوب أمم كثيرة عندما أكسرك بين الشعوب في أراض غريبة عنك."], [10, "ولأجل ما يصيبك يعتري الفزع شعوبا كثيرة، وتنتاب ملوكهم قشعريرة رهيبة، عندما أخطر أمامهم بسيفي، فيرتعدون جميعا في كل لحظة، كل واحد خوفا على نفسه في يوم سقوطك."], [11, "لأن هذا ما يعلنه السيد الرب: ها سيف ملك بابل يقع عليك،"], [12, "فأهلك جيوشك بسيوف الجبابرة من أعتى الأمم فيذلون كبرياء مصر ويفنون جيوشها."], [13, "وأبيد جميع بهائمها المرتوية من المياه الكثيرة، فلا تكدرها من بعد رجل إنسان ولا تعكرها أظلاف البهائم."], [14, "حينئذ أجعل مياههم صافية، وأنهارهم تجري بنعومة كالزيت، يقول السيد الرب."], [15, "وحين أحول أرض مصر إلى خراب، وأقفرها ممن فيها، وعندما أقضي على جميع سكانها، حينئذ يدركون أني أنا الرب."], [16, "هذه هي المرثاة التي ترثو بها بنات الأمم مصر وكل جندها، يقول السيد الرب»."], [17, "وفي اليوم الخامس عشر من الشهر نفسه، في السنة الثانية عشرة أوحى إلي الرب بكلمته قائلا:"], [18, "«ياابن آدم، أعول على جند مصر، وأحدره مع سائر الأمم العظيمة إلى طبقات الأرض السفلى مع الهابطين إلى الجب."], [19, "على من تفوقت بالجمال؟ انزل وارقد مع الغلف."], [20, "يسقطون صرعى وسط قتلى السيف. قد أسلمت مصر للسيف، وأسروها مع كل حلفائها."], [21, "يخاطبه صناديد الجبابر ة هو وأعوانه من وسط مقر الموتى. قد هبطوا واضطجعوا. جميعهم غلف قتلى السيف."], [22, "هناك أشور وقومه جميعا قد أحاطت به قبورهم. كلهم صرعى السيف."], [23, "الذين صارت قبورهم في أسافل الجب، وحوله قبور حلفائه، كلهم قتلى، صرعى السيف. أولئك الذين أشاعوا الرعب في أرض الأحياء."], [24, "وهناك أيضا عيلام وحلفاؤها بأسرهم يحيطون بقبرها. جميعهم غلف صرعى السيف. هبطوا إلى الأرض السفلى، أولئك الذين أشاعوا الرعب في أرض الأحياء، فحملوا عارهم مع المنحدرين إلى الجب."], [25, "قد جعلوا لمصر ولحلفائها مثوى بين القتلى، وقبورهم حول عيلام، كلهم غلف قتلى السيف مع أنهم أشاعوا الرعب في أرض الأحياء. وها هم قد حملوا عارهم مع المنحدرين إلى الجب. عيلام أيضا وسط القتلى."], [26, "وهناك أيضا ماشك وتوبال وكل حلفائهما تحيط بهما قبورهم. كلهم غلف قتلى السيف، مع أنهم أشاعوا الرعب في أرض الأحياء."], [27, "إنهم لا يثوون مع الجبابرة الصرعى من الغلف المنحدرين إلى مقر الموتى، الذين دفنوا بأسلحتهم، وقد وضعت سيوفهم تحت رؤوسهم. إنما يحل على عظامهم عقاب آثامهم مع أنهم أشاعوا الرعب في أرض الأحياء."], [28, "أما أنت يافرعون ففي وسط الغلف تنكسر، وترقد بين قتلى السيف."], [29, "وهناك أيضا أدوم وملوكها ورؤساؤها ممن طرحوا مع قتلى السيف رغم عتوهم. هؤلاء يرقدون مع الغلف ومع المنحدرين إلى الجب."], [30, "وهناك أمراء الشمال جميعهم وكل الصيدونيين المنحدرين مع القتلى، رغم ما أشاعوه من رعب ناجم عن طغيانهم. قد رقدوا غلفا مع قتلى السيف، وحملوا عارهم مع المنحدرين إلى الجب."], [31, "يراهم فرعون جميعا فيتعزى عن جميع حلفائه الذين قتلهم السيف، ولم ينج منه حتى فرعون وجيشه، يقول السيد الرب."], [32, "فمع أني أشعت رعبه في أرض الأحياء، فإن فرعون وحلفاءه كلهم سيرقدون بين الغلف قتلى السيف يقول السيد الرب»."]]}, {"l": "Amo 1:1-15", "n": "", "vs": [[1, "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."], [2, "قال: «يزأر الرب من صهيون ويدوي بصوته من أورشليم، فتنتحب مراعي الرعاة، وتذوي قمة الكرمل."], [3, "هذا ما يقوله الرب: من أجل معاصي دمشق الثلاث والأربع لن أرد عنها سخطي، لأن أهلها قد داسوا شعبي في جلعاد بنوارج من حديد."], [4, "لذلك أرسل نارا على بيت حزائيل فتلتهم حصون بنهدد."], [5, "وأحطم مزلاج دمشق وأستأصل أهل وادي آون، وأهلك حامل صولجان ملك بيت عدن، ويساق شعب أرام إلى السبي إلى أرض قير."], [6, "هذا ما يقوله الرب: من أجل معاصي غزة الثلاث والأربع لن أرد عنها سخطي، لأن أهلها نفوا شعبا عن آخره ليسلموه إلى أدوم."], [7, "لذلك سأرسل نارا على أسوار غزة تلتهم حصونها."], [8, "وأستأصل أهل أشدود، وأهلك حامل صولجان ملك أشقلون، وأوجه ضرباتي ضد عقرون فيفنى من بقي من الفلسطينيين."], [9, "هذا ما يقوله الرب: من أجل معاصي صور الثلاث والأربع لن أرد عنها سخطي، لأن أهلها سلموا شعبا بكامله إلى أدوم، ونقضوا عهد الإخوة."], [10, "لهذا أرسل نارا على أسوار صور فتلتهم حصونها."], [11, "وهذا ما يقوله الرب: من أجل معاصي أدوم الثلاث والأربع لن أرد عنهم سخطي، لأنهم تعقبوا إخوتهم بالسيف، وتغاضوا عن كل رحمة، وجعلوا غضبهم يتأجج ملتهما باستمرار، وظلوا حاقدين على الدوام."], [12, "فأرسل نارا على تيمان، فتلتهم حصون بصرة."], [13, "هذا ما يقوله الرب: من أجل معاصي العمونيين الثلاث والأربع لن أرد عنهم سخطي، لأنهم شقوا بطون الحوامل في جلعاد ليوسعوا تخمهم."], [14, "لهذا أضرم نارا في سور ربة فتلتهم حصونها في معترك جلبة يوم الحرب، وفي وسط عاصفة في يوم الزوبعة."], [15, "ويساق ملكهم إلى السبي مع سائر رؤسائه يقول الرب."]]}], "kwAr": "أسرع", "noteAr": ""}, {"kw": "the day", "raw": "Psa_37:13; Joe_3:14", "note": "", "refs": [{"l": "Psa 37:13", "n": "", "vs": [[13, "ولكن الرب يضحك منه لأنه يرى أن يوم عقابه آت."]]}, {"l": "Joe 3:14", "n": "", "vs": [[14, "جماهير جماهير متزاحمة في وادي القضاء، لأن يوم الرب قريب في وادي القضاء."]]}], "kwAr": "بيوم العقاب", "noteAr": ""}, {"kw": "called", "raw": "or, proclaimed", "note": "or, proclaimed", "refs": [], "kwAr": "توعدت به", "noteAr": "أو: نادى به."}, {"kw": "they shall", "raw": "Lam_4:22; Deu_32:41-43; Psa_137:8, Psa_137:9; Isa_51:22, Isa_51:23; Jer_50:15, Jer_50:29, Jer_50:31; Jer_51:24, Jer_51:49; Mic_7:9, Mic_7:10; Hab_2:15-17; Rev_18:6", "note": "", "refs": [{"l": "Lam 4:22", "n": "", "vs": [[22, "قد تم إثمك ياابنة صهيون، ولن يطيل (الله ) من حقبة سبيك. أما أنت ياابنة أدوم فإنه يعاقبك ويفضح خطاياك."]]}, {"l": "Deu 32:41-43", "n": "", "vs": [[41, "إذا سننت سيفي البارق وأمسكت به يدي للقضاء، فإني أنتقم من أعدائي، وأجازي مبغضي."], [42, "أسكر سهامي بالدم ويلتهم سيفي لحما، من دم القتلى والسبايا ورؤوس قادة العدو."], [43, "تهللي أيتها الأمم مع شعبه، لأنه سينتقم لدماء عبيده ويثأر من أعدائه ويصفح عن أرضه وعن شعبه»."]]}, {"l": "Psa 137:8", "n": "", "vs": [[8, "يابنت بابل المحتم خرابها، طوبى لمن يجازيك بما جزيتنا به."]]}, {"l": "Psa 137:9", "n": "", "vs": [[9, "طوبى لمن يمسك صغارك ويضرب بهم الصخرة."]]}, {"l": "Isa 51:22", "n": "", "vs": [[22, "هذا ما يقوله سيدك الرب، إلهك الذي يدافع عن دعوى شعبه: ها أنا قد أخذت من يدك كأس الترنح، ولن تجرعي من كأس غضبي بعد."]]}, {"l": "Isa 51:23", "n": "", "vs": [[23, "وأضعها في يد معذبيك الذين قالوا لك: انحني حتى ندوس عليك عابرين. فجعلت ظهرك لهم أرضا، وطريقا لهم يمرون عليه."]]}, {"l": "Jer 50:15", "n": "", "vs": [[15, "أطلقوا هتاف الحرب عليها من كل جانب، فقد استسلمت وانهارت أسسها، وتقوضت أسوارها، لأن هذا هو انتقام الرب، فاثأروا منها، وعاملوها بمثل ما عاملتكم."]]}, {"l": "Jer 50:29", "n": "", "vs": [[29, "استدعوا إلى بابل رماة السهام، جميع موتري القسي. عسكروا حولها فلا يفلت منها أحد. جازوها بمقتضى أعمالها، واصنعوا بها كما صنعت بكم، لأنها بغت على الرب قدوس إسرائيل."]]}, {"l": "Jer 50:31", "n": "", "vs": [[31, "ها أنا أقاومك أيتها المتغطرسة، يقول الرب القدير، لأن يوم إدانتك وتنفيذ العقاب فيك قد حان،"]]}, {"l": "Jer 51:24", "n": "", "vs": [[24, "سأجازي بابل وسائر الكلدانيين على كل شرهم الذي ارتكبوه في حق صهيون، على مرأى منكم، يقول الرب."]]}, {"l": "Jer 51:49", "n": "", "vs": [[49, "كما صرعت بابل قتلى إسرائيل، هكذا يصرع قتلى بابل في كل الأرض."]]}, {"l": "Mic 7:9", "n": "", "vs": [[9, "إني أخطأت إلى الرب لذلك أتحمل غضبه، إلى أن يدافع عني ويثبت استقامتي، فيخرجني إلى النور لأشاهد عدله."]]}, {"l": "Mic 7:10", "n": "", "vs": [[10, "عندئذ ترى ذلك عدوتي فيعتريها الخزي إذ قالت لي: «أين هو الرب إلهك؟» ستشهدها عيناي تداس كطين الشوارع والأزقة."]]}, {"l": "Hab 2:15-17", "n": "", "vs": [[15, "ويل لمن يسقي صاحبه من كأس الغضب إلى أن يسكر لينظر إلى خزيه."], [16, "فأنت تشبع خزيا عوض المجد، فاشرب أنت، وترنح، فإن كأس يمين الرب تدور عليك ويجلل العار مجدك."], [17, "لأن ما ارتكبته من ظلم في حق لبنان يغطيك، وما أهلكته من بهائم يروعك. من أجل ما سفكته من دماء واقترفته من جور في الأرض والمدن والساكنين فيها."]]}, {"l": "Rev 18:6", "n": "", "vs": [[6, "افعلوا بها كما فعلت بكم، وضاعفوا لها جزاء ما اقترفت. في الكأس التي مزجت فيها للآخرين، امزجوا لها ضعفا."]]}], "kwAr": "فيصيروا مثلي", "noteAr": ""}], "arS": [["قد ", []], ["سمعوا", ["H8085"]], [" ", []], ["تنهدي", ["H584"]], [" ", []], ["فلم", ["H369"]], [" ", []], ["يكن", ["H1961"]], [" من ", []], ["معز", ["H5162"]], [" ", []], ["لي", ["H589"]], [". ", []], ["جميع", ["H3605"]], [" ", []], ["أعدائي", ["H341"]], [" عرفوا ببليتي ", []], ["فشمتوا", ["H7797"]], [" بما ", []], ["فعلت", ["H6213"]], [" بي. ", []], ["أسرع", ["H935"]], [" ", []], ["بيوم", ["H3117"]], [" ", []], ["العقاب", ["H7451"]], [" الذي ", []], ["توعدت", ["H7121"]], [" به فيصيروا ", []], ["مثلي", ["H3644"]], [".", []]]}, {"c": 1, "v": 22, "text": "ليأت كل شرهم أمامك فتعاقبهم كما عاقبتني على كل ذنوبي، لأن تنهداتي كثيرة وقلبي مغشي عليه.", "groups": [{"kw": "all their", "raw": "Neh_4:4, Neh_4:5; Psa_109:14, Psa_109:15, Psa_137:7-9; Jer_10:25, Jer_18:23, Jer_51:35; Luk_23:31; Rev_6:10", "note": "", "refs": [{"l": "Neh 4:4", "n": "", "vs": [[4, "فصليت إلى الرب: «استمع ياإلهنا، ل  Jer_13:14, Jer_21:7; Eze_5:11, Eze_7:4, Eze_7:9, Eze_8:18, Eze_9:10; Zec_11:5, Zec_11:6; Mat_18:33", "note": "", "refs": [{"l": "Lam 2:17", "n": "", "vs": [[17, "نفذ الرب قضاءه، وحقق وعيده الذي حكم به منذ الحقب السالفة. هدم ولم يرأف، فأشمت بك الخصم، وعظم قوة عدوك."]]}, {"l": "Lam 2:21", "n": "", "vs": [[21, "قد انطرح الصبي والشيوخ في غبار الطرقات. سقط عذاراي وشباني بالسيف. قد قتلتهم في يوم غضبك، ونحرتهم من غير رحمة."]]}, {"l": "Lam 3:43", "n": "", "vs": [[43, "لفعت نفسك بالغضب وتعقبتنا. قتلت من غير رحمة."]]}, {"l": "Job 2:3", "n": "*marg.", "vs": [[3, "فقال الرب للشيطان: «هل راقبت عبدي أيوب فإنه لا نظير له في الأرض، فهو رجل كامل صالح، يتقي الله ويحيد عن الشر، وحتى الآن لا يزال معتصما بكماله، مع أنك أثرتني عليه لأهلكه من غير داع»."]]}, {"l": "Psa 21:9", "n": "", "vs": [[9, "حين يتجلى وجهك تحرقهم كما بتنور مشتعل. تلتهمهم في غضبك فتأكلهم النار."]]}, {"l": "Isa 27:11", "n": "", "vs": [[11, "ومتى يبست فروعها تتكسر، فتقبل النساء ويستخدمنها وقودا للنار. لأن هذا شعب جاهل، لذلك لا يرحمه صانعه ولا يرفق به خالقه."]]}, {"l": "Jer 13:14", "n": "", "vs": [[14, "وأهشمهم الواحد فوق الآخر، الآباء والأبناء معا، يقول الرب. لا أشفق ولا أترَأف ولا أرحم، بل أهلكهم»."]]}, {"l": "Jer 21:7", "n": "", "vs": [[7, "وأسلم صدقيا ملك يهوذا وخدامه ومن بقي من أهل هذه المدينة، الناجين من الوبأ والسيف والجوع، إلى يد نبوخذناصر ملك بابل، وإلى أيدي أعدائهم وطالبي نفوسهم، فيقتلهم بحد السيف، ولا يرثي لهم ولا يشفق أو يرحم."]]}, {"l": "Eze 5:11", "n": "", "vs": [[11, "لهذا حي أنا يقول السيد الرب، لأنك قد دنست مقدسي بكل أصنامك المكروهة، وبجميع رجاساتك، فأنا أيضا أستأصل، ولا تترَأف عليك عيني ولا أعفو."]]}, {"l": "Eze 7:4", "n": "", "vs": [[4, "فلا تتر أف عليك عيني، ولا أعفو، بل أجازيك بمقتضى طرقك، وتكون رجاساتك في وسطك. عندئذ تدركون أني أنا الرب»."]]}, {"l": "Eze 7:9", "n": "", "vs": [[9, "فلا تترَأف عليك عيني ولا أعفو، بل أجازيك بمقتضى طرقك، وتكون رجاساتك في وسطك. وعندئذ تدركون أني أنا الضارب."]]}, {"l": "Eze 8:18", "n": "", "vs": [[18, "لذلك أعاقبهم بالغضب، ولا تترَأف عيني عليهم، ولا أعفو، وإن استغاثوا بصو
