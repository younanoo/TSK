<script>window.CATALOG=[{"id": 17, "abbr": "Est", "en": "Esther", "nc": 10, "nv": 167, "refs": 1266, "last": "10:3", "first": "وحدث في أيام أحشويروش، الذي امتد حكمه من الهند إلى كوش، فملك على مئة وسبعة وعشرين إقليما،"}, {"id": 18, "abbr": "Job", "en": "Job", "nc": 42, "nv": 1070, "refs": 10209, "last": "42:17", "first": "عاش في أرض عوص رجل اسمه أيوب، كان صالحا كاملا يتقي الله ويحيد عن الشر."}, {"id": 19, "abbr": "Psa", "en": "Psalms", "nc": 150, "nv": 2461, "refs": 33395, "last": "150:6", "first": "طوبى للإنسان الذي لا يتبع مشورة الأشرار، ولا يقف في طريق الخاطئين، ولا يجالس المستهزئين."}, {"id": 20, "abbr": "Pro", "en": "Proverbs", "nc": 31, "nv": 915, "refs": 10457, "last": "31:31", "first": "هذه هي أمثال سليمان بن داود ملك إسرائيل،"}, {"id": 21, "abbr": "Ecc", "en": "Ecclesiastes", "nc": 12, "nv": 222, "refs": 3186, "last": "12:14", "first": "هذه أقوال الجامعة ابن داود ملك أورشليم."}, {"id": 22, "abbr": "Son", "en": "Song of Solomon", "nc": 8, "nv": 117, "refs": 1802, "last": "8:14", "first": "هذا نشيد الأناشيد لسليمان."}, {"id": 23, "abbr": "Isa", "en": "Isaiah", "nc": 66, "nv": 1292, "refs": 21959, "last": "66:24", "first": "هذه هي رؤيا إشعياء بن آموص، التي أعلنت له بشأن يهوذا وأورشليم في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا."}, {"id": 24, "abbr": "Jer", "en": "Jeremiah", "nc": 52, "nv": 1364, "refs": 20659, "last": "52:34", "first": "هذه نبوءة إرميا بن حلقيا أحد الكهنة المقيمين في عناثوث بأرض سبط بنيامين."}, {"id": 25, "abbr": "Lam", "en": "Lamentations", "nc": 5, "nv": 154, "refs": 2238, "last": "5:22", "first": "كيف أصبحت المدينة الآهلة بالسكان مهجورة وحيدة؟ صارت كأرملة! هذه التي كانت عظيمة بين الأمم. السيدة بين المدن صارت تحت الجزية!"}, {"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 48, "nv": 1273, "refs": 15264, "last": "48:35", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 25, "abbr": "Lam", "en": "Lamentations", "verses": [{"c": 1, "v": 1, "text": "كيف أصبحت المدينة الآهلة بالسكان مهجورة وحيدة؟ صارت كأرملة! هذه التي كانت عظيمة بين الأمم. السيدة بين المدن صارت تحت الجزية!", "groups": [{"kw": "How doth", "raw": "The LXX have the following words as an introduction: And it came to pass after Israel had been carried captive, and Jerusalem was become desolate, that Jeremiah sat weeping, and lamented with this lamentation over Jerusalem, and said. Lam_2:1, Lam_4:1; Isa_14:12; Jer_50:23; Zep_2:15; Rev_18:16, Rev_18:17", "note": "The LXX have the following words as an introduction: And it came to pass after Israel had been carried captive, and Jerusalem was become desolate, that Jeremiah sat weeping, and lamented with this lamentation over Jerusalem, and said. Lam_2:1, Lam_4:1; Isa_14:12; Jer_50:23; Zep_2:15; Rev_18:16, Rev_18:17", "refs": [{"l": "Lam 2:1", "n": "", "vs": [[1, "كيف خيم الرب في غضبه بالظلام على ابنة صهيون، وطرح من السماء إلى الأرض جلال إسرائيل، ولم يذكر موطيء قدميه في يوم سخطه؟"]]}, {"l": "Lam 4:1", "n": "", "vs": [[1, "كيف اكمد الذهب واكدر لون النضار الخالص؟ كيف تبعثرت حجارة القدس في ناصية كل شارع؟"]]}, {"l": "Isa 14:12", "n": "", "vs": [[12, "كيف هويت من السماء يازهرة بنت الصبح؟ كيف قطعت وطرحت إلى الأرض ياقاهر الأمم؟"]]}, {"l": "Jer 50:23", "n": "", "vs": [[23, "كيف تكسرت وتحطمت بابل، مطرقة الأرض كلها؟ كيف أصبحت بابل مثار دهشة عند الأمم؟"]]}, {"l": "Zep 2:15", "n": "", "vs": [[15, "هذه هي المدينة الطروب التي سكنت آمنة قائلة لنفسها: أنا وليس لي نظير! كيف صارت أطلالا، ومأوى للوحوش البرية؟ كل من يجتاز بها يصفر دهشة ويهز يده»."]]}, {"l": "Rev 18:16", "n": "", "vs": [[16, "قائلين: الويل، الويل على المدينة العظمى! كانت ترتدي أفضل الكتان والأرجوان والقرمز، وتتحلى بالذهب والأحجار الكريمة واللؤلوء،"]]}, {"l": "Rev 18:17", "n": "", "vs": [[17, "وقد زال هذا الغنى كله في ساعة واحدة!"]]}], "kwAr": "كيف أصبحت", "noteAr": "أضافت السبعينية المقدمة التالية: وكان بعد أن سُبي إسرائيل وخربت أورشليم أن جلس إرميا يبكي، ورثى أورشليم بهذا الرثاء وقال. انظر مرا 2: 1؛ 4: 1؛ إش 14: 12؛ إر 50: 23؛ صف 2: 15؛ رؤ 18: 16، 17"}, {"kw": "sit", "raw": "Lam_2:10; Isa_3:26, Isa_47:1-15, Isa_50:5, Isa_52:2, Isa_52:7; Jer_9:11; Eze_26:16", "note": "", "refs": [{"l": "Lam 2:10", "n": "", "vs": [[10, "يجلس شيوخ ابنة صهيون على الأرض صامتين. عفروا بالرماد رؤوسهم، وارتدوا المسوح، وطأطأت عذارى أورشليم رؤوسهن إلى الأرض."]]}, {"l": "Isa 3:26", "n": "", "vs": [[26, "فتنوح عليهم أبواب المدينة وتنطرح على الأرض مهجورة."]]}, {"l": "Isa 47:1-15", "n": "", "vs": [[1, "انزلي واجلسي على التراب أيتها العذراء ابنة بابل. اجلسي على الأرض لا على العرش ياابنة الكلدانيين، لأنك لن تدعي من بعد الناعمة المترفهة."], [2, "خذي حجري الرحى واطحني الدقيق. اكشفي نقابك، وشمري عن الذيل، واكشفي عن الساق، واعبري الأنهار،"], [3, "فيظل عريك مكشوفا وعارك ظاهرا، فإني أنتقم ولا أعفو عن أحد."], [4, "إن فادينا، الرب القدير اسمه، هو قدوس إسرائيل."], [5, "اجلسي صامتة وأوغلي في الظلام ياابنة الكلدانيين، لأنك لن تدعي بعد سيدة الممالك."], [6, "قد سخطت على شعبي ونجست ميراثي. أسلمتهم إلى يديك، فلم تبدي نحوهم رحمة بل أرهقت الشيخ بنيرك الثقيل جدا."], [7, "وقلت: سأظل السيدة إلى الأبد. لذلك لم تفكري بهذه الأمور في نفسك ولا تأملت بما تؤول إليه."], [8, "فالآن اسمعي هذا أيتها المترفهة المتنعمة المطمئنة، القائلة في قلبها: أنا وحدي وليس هناك غيري، لن أعرف الترمل ولن أثكل"], [9, "لذلك ستبتلين بكلا الأمرين معا في لحظة، في يوم واحد، إذ تثكلين وتترملين حتى النهاية على الرغم من كثرة سحرك وقوة رقاك."], [10, "قد تولتك طمأنينة في شرك، وقلت: لا يراني أحد ولكن حكمتك ومعرفتك أضلاك، فقلت في نفسك: أنا وحدي، وليس هناك غيري."], [11, "سيدهمك شر لا تدرين كيف تدفعينه عنك، وتباغتك داهية تعجزين عن التكفير عنها، ويفاجئك خراب لا تتوقعينه."], [12, "تشبثي برقاك وكثرة سحرك التي تعبت فيها منذ صباك، فقد يحالفك النجاح أو تثيرين الرعب."], [13, "لقد ضعفت من كثرة طلب المشورة، فادعي المنجمين والفلكيين ليكشفوا لك طوالع المستقبل وينقذوك مما يأتي عليك."], [14, "غير أنهم أنفسهم أصبحوا كالهشيم الذي تلتهمه النار عاجزين عن إنقاذ أنفسهم وإنقاذك من شدة اللهب المحرق، فلا هو جمر للاستدفاء ولا هي نار للجلوس حولها."], [15, "هكذا يجري على الذين تعبت فيهم وتاجروا معك منذ صباك، قد شرد كل منهم في طريقه وليس من ينقذك."]]}, {"l": "Isa 50:5", "n": "", "vs": [[5, "قد فتح السيد الرب أذني فلم أعاند أو أتراجع إلى الوراء"]]}, {"l": "Isa 52:2", "n": "", "vs": [[2, "انفضي عنك الغبار، وانهضي واجلسي وفكي عن عنقك الأغلال ياأورشليم، أيتها المسبية ابنة صهيون،"]]}, {"l": "Isa 52:7", "n": "", "vs": [[7, "ما أجمل على الجبال وقع قدمي المبشر الذي يذيع سلاما وينشر بشائر الخير، القائل لصهيون: قد ملك إلهك!"]]}, {"l": "Jer 9:11", "n": "", "vs": [[11, "«سأجعل أورشليم رجمة خراب، ومأوى لبنات آوى، وأحول مدن يهوذا إلى قفر مهجور»."]]}, {"l": "Eze 26:16", "n": "", "vs": [[16, "فينزل جميع رؤساء المدن الساحلية عن عروشهم ويخلعون جببهم ويطرحون عنهم أرديتهم المزركشة، ويكتسون الرعب ثوبا، ويجلسون على الأرض مرتجفين في كل لحظة، مذعورين لما أصابك"]]}], "kwAr": "مهجورة وحيدة", "noteAr": ""}, {"kw": "full", "raw": "Psa_122:4; Isa_22:2; Zec_8:4, Zec_8:5", "note": "", "refs": [{"l": "Psa 122:4", "n": "", "vs": [[4, "إليها صعدت الأسباط، أسباط الرب لترفع الشكر له بحسب أوامره."]]}, {"l": "Isa 22:2", "n": "", "vs": [[2, "أيتها المدينة الممتلئة جلبة، العجاجة المرحة، إن قتلاك ليسوا قتلى سيف أو صرعى حرب."]]}, {"l": "Zec 8:4", "n": "", "vs": [[4, "ويعود الشيوخ من رجال ونساء، ممن يتكئون على عصيهم لفرط كبر أعمارهم، فيجلسون في شوارع أورشليم."]]}, {"l": "Zec 8:5", "n": "", "vs": [[5, "وتكتظ طرقاتها بالأولاد والبنات اللاعبين فيها."]]}], "kwAr": "الآهلة بالسكان", "noteAr": ""}, {"kw": "as a", "raw": "Isa_47:8, Isa_47:9, Isa_54:4; Rev_18:7", "note": "", "refs": [{"l": "Isa 47:8", "n": "", "vs": [[8, "فالآن اسمعي هذا أيتها المترفهة المتنعمة المطمئنة، القائلة في قلبها: أنا وحدي وليس هناك غيري، لن أعرف الترمل ولن أثكل"]]}, {"l": "Isa 47:9", "n": "", "vs": [[9, "لذلك ستبتلين بكلا الأمرين معا في لحظة، في يوم واحد، إذ تثكلين وتترملين حتى النهاية على الرغم من كثرة سحرك وقوة رقاك."]]}, {"l": "Isa 54:4", "n": "", "vs": [[4, "لا تجزعي لأنك لن تخزي، ولا تخجلي لأنه لن يلحق بك عار، فأنت ستنسين خزي صباك، ولن تذكري من بعد عار ترملك."]]}, {"l": "Rev 18:7", "n": "", "vs": [[7, "أنزلوا بها من العذاب والشقاء على قدر ما عظمت نفسها وترفهت. فإنها تقول في نفسها: أنا ملكة على العرش، ولست أرملة، ولن أذوق طعم الحزن."]]}], "kwAr": "كأرملة", "noteAr": ""}, {"kw": "great", "raw": "1Ki_4:21; 2Ch_9:26; Ezr_4:20", "note": "", "refs": [{"l": "1Ki 4:21", "n": "", "vs": [[21, "وامتد سلطان سليمان على جميع الممالك الواقعة ما بين نهر الفرات إلى أرض الفلسطينيين وحتى تخوم مصر. فكانت هذه الممالك تقدم له الجزية وتخضع له كل أيام حياته."]]}, {"l": "2Ch 9:26", "n": "", "vs": [[26, "وقد خضع له جميع الملوك الحاكمين من نهر الفرات إلى أرض الفلسطينيين حتى تخوم مصر."]]}, {"l": "Ezr 4:20", "n": "", "vs": [[20, "وقد تولى عرش أورشليم ملوك مقتدرون تسلطوا على جميع منطقة عبر النهر، التي أدى أهلها لهم جزية وخراجا وخفارة."]]}], "kwAr": "عظيمة", "noteAr": ""}, {"kw": "how is", "raw": "Lam_5:16; 2Ki_23:33, 2Ki_23:35; Neh_5:4, Neh_9:37", "note": "", "refs": [{"l": "Lam 5:16", "n": "", "vs": [[16, "تهاوى إكليل رأسنا، فويل لنا لأننا قد أخطأنا."]]}, {"l": "2Ki 23:33", "n": "", "vs": [[33, "واعتقل فرعون نخو يهوآحاز وقيده في ربلة في أرض حماة لئلا يملك في أورشليم، وفرض جزية على البلاد: مئة وزنة من الفضة (نحو ثلاث مئة وستين كيلو جراما)، ووزنة من الذهب (نحو ثلاثة كيلوجرامات)."]]}, {"l": "2Ki 23:35", "n": "", "vs": [[35, "وأدى يهوياقيم جزية الفضة والذهب لفرعون، إلا أنه فرض ضرائب على أهل البلاد ليتمكن من دفعها، بحسب ما يمتلكون."]]}, {"l": "Neh 5:4", "n": "", "vs": [[4, "ومن قائل: إننا استقرضنا فضة لندفع خراج الملك على حقولنا وكرومنا،"]]}, {"l": "Neh 9:37", "n": "", "vs": [[37, "تذهب غلاتها الوفيرة إلى الملوك الذين سلطتهم علينا من جراء معاصينا، وهم يتحكمون في أجسادنا وبهائمنا كما يطيب لهم، بينما نحن في كرب شديد."]]}], "kwAr": "صارت تحت الجزية", "noteAr": ""}], "arS": [["كيف", ["H349"]], [" ", []], ["أصبحت", ["H1961"]], [" ", []], ["المدينة", ["H5892"]], [" ", []], ["الآهلة", ["H3427"]], [" ", []], ["بالسكان", ["H5971"]], [" مهجورة ", []], ["وحيدة", ["H910"]], ["؟ ", []], ["صارت", ["H1961"]], [" ", []], ["كأرملة", ["H490"]], ["! هذه التي كانت ", []], ["عظيمة", ["H7227"]], [" بين ", []], ["الأمم", ["H1471"]], [". ", []], ["السيدة", ["H8282"]], [" بين ", []], ["المدن", ["H4082"]], [" صارت تحت ", []], ["الجزية", ["H4522"]], ["!", []]]}, {"c": 1, "v": 2, "text": "تبكي بمرارة في الليل، ودموعها تنهمر على خديها. لا معزي لها بين محبيها. غدر بها جميع خلانها وأصبحوا لها أعداء.", "groups": [{"kw": "weepeth", "raw": "Lam_1:16, Lam_2:11, Lam_2:18, Lam_2:19; Job_7:3; Psa_6:6, Psa_77:2-6; Jer_9:1, Jer_9:17-19, Jer_13:17", "note": "", "refs": [{"l": "Lam 1:16", "n": "", "vs": [[16, "على هذه كلها أبكي. عيناي، عيناي تفيضان بالدموع، إذ ابتعد عني كل معز ينعش نفسي. هلك أبنائي لأن العدو قد ظفر."]]}, {"l": "Lam 2:11", "n": "", "vs": [[11, "كلت عيناي من البكاء، جاشت أحشائي وأريقت كبدي على الأرض حزنا لدمار ابنة شعبي، لأن الأطفال والرضع غشي عليهم في شوارع المدينة."]]}, {"l": "Lam 2:18", "n": "", "vs": [[18, "استغاثت قلوبهم بالرب. لتجر الدموع، ياأسوار ابنة صهيون، كالنهر ليلا ونهارا. لا تستكيني ولا تكف عيناك عن البكاء."]]}, {"l": "Lam 2:19", "n": "", "vs": [[19, "قومي وانتحبي في الربع الأول من الليل. اسكبي كالماء قلبك في محضر الرب. ارفعي إليه يديك من أجل نفوس أطفالك المغشي عليهم من الجوع عند ناصية كل شارع."]]}, {"l": "Job 7:3", "n": "", "vs": [[3, "هكذا كتبت علي أشهر سوء، وليالي شقاء قدرت لي."]]}, {"l": "Psa 6:6", "n": "", "vs": [[6, "لقد أرهقني تنهدي، فأغرق سريري في كل ليلة بدموعي وأبلل بها فراشي."]]}, {"l": "Psa 77:2-6", "n": "", "vs": [[2, "في يوم ضيقي طلبت الرب. انبسطت يدي طول الليل فلم تكل. أبت نفسي العزاء."], [3, "أذكر الرب فأتنهد، أناجي نفسي فيغشى على روحي."], [4, "أمسكت أجفاني عن النوم. اعتراني القلق فعجزت عن الكلام."], [5, "فكرت في الأيام القديمة وفي السنين السحيقة."], [6, "في الليل أتذكر ترنيمي، وأناجي قلبي، وتجد في البحث نفسي."]]}, {"l": "Jer 9:1", "n": "", "vs": [[1, "ياليت رأسي فيض مياه، وعيني ينبوع دموع، فأبكي نهارا وليلا قتلى بنت شعبي"]]}, {"l": "Jer 9:17-19", "n": "", "vs": [[17, "وهذا ما يعلنه الرب القدير: «تأملوا واستدعوا النادبات ليأتين، وأرسلوا إلى الحكيمات فيقبلن."], [18, "ليسرعن حتى يطلقن أصواتهن علينا بالندب فتذرف عيوننا دموعا، وتفيض أجفاننا ماء."], [19, "ها صوت رثاء قد تجاوب في صهيون: ما أشد دمارنا، وما أعظم عارنا، لأننا قد فارقنا أرضنا، ولأنهم قد هدموا مساكننا!»"]]}, {"l": "Jer 13:17", "n": "", "vs": [[17, "وإن لم تنصتوا فإن نفسي تبكي في الخفاء من أجل كبريائكم، وتذرف عيناي الدموع المريرة، فتسيل العبرات لأن الرب قد سبى شعبه."]]}], "kwAr": "تبكي بمرارة", "noteAr": ""}, {"kw": "among", "raw": "Lam_1:19; Jer_4:30, Jer_22:20-22, Jer_30:14; Eze_16:37, Eze_23:22-25; Hos_2:7; Rev_17:13, Rev_17:16", "note": "", "refs": [{"l": "Lam 1:19", "n": "", "vs": [[19, "دعوت محبي فخدعوني. فني كهنتي وشيوخي في المدينة وهم ينشدون قوتا لإحيا ء نفوسهم."]]}, {"l": "Jer 4:30", "n": "", "vs": [[30, "وأنت أيتها المدينة الموحشة، ماذا تصنعين؟ مهما لبست الثيا ب القرمزية، وتحليت بزينة من ذهب، مهما كحلت عينيك بالأثمد، فباطلا تجملين ذاتك، فقد نبذك عشاقك وسعوا للقضاء عليك."]]}, {"l": "Jer 22:20-22", "n": "", "vs": [[20, "«اصعدي ياأورشليم إلى لبنان واصرخي. أطلقي صوتك في باشان وأعولي من عباريم لأن جميع محبيك قد سحقوا."], [21, "حذرتك في أثناء عزك فقلت: لن أصغي. أنت متمردة منذ صباك لا تسمعين لصوتي."], [22, "ستعصف الريح بكل رعاتك، ويذهب محبوك إلى السبي. عندئذ يعتريك الخزي والعار لشرك."]]}, {"l": "Jer 30:14", "n": "", "vs": [[14, "قد نسيك محبوك، وأهملوك إهمالا، لأني ضربتك كما يضرب عدو، وعاقبتك عقاب مبغض قاس، لأن إثمك عظيم وخطاياك متكاثرة."]]}, {"l": "Eze 16:37", "n": "", "vs": [[37, "ها أنا أحشد جميع عشاقك الذين تلذذت بهم، وجميع من تدلهت بهم مع كل الذين أبغضتهم فأجمعهم عليك من كل ناحية، وأكشف عن عريك فيشاهدون عورتك كلها،"]]}, {"l": "Eze 23:22-25", "n": "", "vs": [[22, "لذلك ياأهوليبة، هذا ما يعلنه السيد الرب: ها أنا أثير عليك عشاقك الذين جفتهم نفسك، وآتي بهم عليك من كل ناحية."], [23, "أبناء البابليين، وسائر الكلدانيين من أقوام فقود وشوع وقوع ومعهم جميع أبناء أشور، شبان شهوة، من ولاة وقادة ورؤساء مركبات وذوي الشهرة، وكلهم فرسان خيل."], [24, "فيهاجمونك بأسلحة ومركبات وعربات وأقوام شعوب ويحاصرونك بترس ومجن وخوذة. وأعهد إليهم بمقاضاتك فيحكمون عليك بمقتضى أحكامهم."], [25, "وأصب سخطي عليك فيعاملونك بغيظ. يجدعون أنفك وأذنيك، وتقتل بقيتك بالسيف. يأسرون أبناءك وبناتك، وتلتهم النار بقيتك،"]]}, {"l": "Hos 2:7", "n": "", "vs": [[7, "فتسعى وراء عشاقها ولكنها لا تدركهم، وتلتمسهم فلا تجدهم، ثم تقول، لأنطلقن وأرجعن إلى زوجي الأول، فقد كنت معه في حال خير مما أنا عليه الآن."]]}, {"l": "Rev 17:13", "n": "", "vs": [[13, "يتفقون فيها برأي واحد أن يعطوا الوحش قوتهم وسلطتهم."]]}, {"l": "Rev 17:16", "n": "", "vs": [[16, "وأما القرون العشرة التي رأيتها، والوحش، فسيبغضون الزانية ويجعلونها معزولة وعارية، ويأكلون لحمها ويحرقونها بالنار،"]]}], "kwAr": "بين محبيها", "noteAr": ""}, {"kw": "none", "raw": "Lam_1:9, Lam_1:16, Lam_1:17, Lam_1:21; Isa_51:18, Isa_51:19", "note": "", "refs": [{"l": "Lam 1:9", "n": "", "vs": [[9, "قد علق رجسها بذيولها. لم تذكر آخرتها لهذا كان سقوطها رهيبا، ولا معزي لها. انظر يارب إلى شقائي لأن العدو قد انتصر."]]}, {"l": "Lam 1:16", "n": "", "vs": [[16, "على هذه كلها أبكي. عيناي، عيناي تفيضان بالدموع، إذ ابتعد عني كل معز ينعش نفسي. هلك أبنائي لأن العدو قد ظفر."]]}, {"l": "Lam 1:17", "n": "", "vs": [[17, "تمد صهيون يديها تلتمس معزيا، ولكن على غير طائل. قد أمر الرب أن يكون مضايقو يعقوب هم جيرانه الذين حوله. قد أصبحت أورشليم رجسا بينهم."]]}, {"l": "Lam 1:21", "n": "", "vs": [[21, "قد سمعوا تنهدي فلم يكن من معز لي. جميع أعدائي عرفوا ببليتي فشمتوا بما فعلت بي. أسرع بيوم العقاب الذي توعدت به فيصيروا مثلي."]]}, {"l": "Isa 51:18", "n": "", "vs": [[18, "لم يكن بين أبنائها الذين أنجبتهم من يهديها، ولا من يأخذ بيدها من كل البنين الذين ربتهم."]]}, {"l": "Isa 51:19", "n": "", "vs": [[19, "لقد ابتليت بهاتين المحنتين، فمن يرثي لك: التدمير والخراب، والمجاعة والسيف، فمن يعزيك؟"]]}], "kwAr": "لا معزي لها", "noteAr": ""}, {"kw": "all her friends", "raw": "Job_6:15, Job_19:13, Job_19:14; Psa_31:11; Pro_19:7; Mic_7:5", "note": "", "refs": [{"l": "Job 6:15", "n": "", "vs": [[15, "قد غدر بي إخواني كسيل انقطع ماؤه، وكمياه الأودية العابرة،"]]}, {"l": "Job 19:13", "n": "", "vs": [[13, "أبعد عني إخوتي، فاعتزل عني معارفي."]]}, {"l": "Job 19:14", "n": "", "vs": [[14, "خذلني ذوو قرابتي ونسيني أصدقائي."]]}, {"l": "Psa 31:11", "n": "", "vs": [[11, "صرت محتقرا من كل أعدائي ومصدر رعب لجيراني. الذين يرونني في الشارع يتهربون مني."]]}, {"l": "Pro 19:7", "n": "", "vs": [[7, "جميع إخوة الفقير يمقتونه، فما أحرى أن يتهرب منه أصدقاؤه؛ يلاحقهم بتوسلاته ولا يجد لهم أثرا."]]}, {"l": "Mic 7:5", "n": "", "vs": [[5, "لا تأتمن جارك ولا تثق بصديق، واحترس مما تنطق به شفتاك ممن ترقد في حضنك."]]}], "kwAr": "غدر بها جميع خلانها", "noteAr": ""}], "arS": [["تبكي", ["H1058"]], [" ", []], ["بمرارة", ["H1058"]], [" في ", []], ["الليل", ["H3915"]], ["، ", []], ["ودموعها", ["H1832"]], [" تنهمر ", []], ["على", ["H5921"]], [" ", []], ["خديها", ["H3895"]], [". ", []], ["لا", ["H369"]], [" ", []], ["معزي", ["H5162"]], [" لها ", []], ["بين", ["H4480", "H3605"]], [" ", []], ["محبيها", ["H157"]], [". ", []], ["غدر", ["H898"]], [" بها ", []], ["جميع", ["H3605"]], [" ", []], ["خلانها", ["H7453"]], [" ", []], ["وأصبحوا", ["H1961"]], [" لها ", []], ["أعداء", ["H341"]], [".", []]]}, {"c": 1, "v": 3, "text": "سبيت يهوذا إلى المنفى بعد كل ما عانته من عنت وعبودية، فأقامت بين الأمم شقية، وأدركها مطاردوها في خضم ضيقاتها.", "groups": [{"kw": "gone", "raw": "2Ki_24:14, 2Ki_24:15, 2Ki_25:11, 2Ki_25:21; 2Ch_36:20,2Ch_36:21; Jer_39:9, Jer_52:15, Jer_52:27-30", "note": "", "refs": [{"l": "2Ki 24:14", "n": "", "vs": [[14, "وسبى نبوخذناصر أهل أورشليم، وكل الرؤساء، وجميع رجال الحرب الأشداء، والخصيان. فكانت جملة المسبيين عشرة آلاف مسبي، كما أخذ الصناع والحدادين، ولم يترك في يهوذا سوى فقراء الشعب المساكين."]]}, {"l": "2Ki 24:15", "n": "", "vs": [[15, "وسبى يهوياكين وأم الملك ونساءه وخصيانه وعظماء البلاد من أورشليم إلى بابل."]]}, {"l": "2Ki 25:11", "n": "", "vs": [[11, "وسبى نبوزرادان بقية الشعب الذي بقي في المدينة، والهاربين الذين لجأوا إلى ملك بابل وسواهم من السكان."]]}, {"l": "2Ki 25:21", "n": "", "vs": [[21, "فقتلهم ملك بابل في ربلة في أرض حماة. وهكذا سبي شعب يهوذا من أرضه."]]}, {"l": "2Ch 36:20", "n": "", "vs": [[20, "وسبى نبوخذناصر الذين نجوا من السيف إلى بابل، فأصبحوا عبيدا له ولأبنائه إلى أن قامت مملكة فارس."]]}, {"l": "2Ch 36:21", "n": "", "vs": [[21, "وذلك لكي يتم كلام الرب الذي نطق به على لسان إرميا، حتى تستوفي الأرض سبوتها، إذ أنها بقيت من غير إنتاج كل أيام خرابها حتى انقضاء سبعين سنة."]]}, {"l": "Jer 39:9", "n": "", "vs": [[9, "وسبى نبوزرادان رئيس شرطة بابل بقية الشعب الذي بقي في المدينة، وكل من لجأ إليه."]]}, {"l": "Jer 52:15", "n": "", "vs": [[15, "وأجلى نبوزرادان رئيس الشرطة بعضا من فقراء البلد، ومن بقي من الشعب في المدينة، والهاربين الذين لجأوا إلى ملك بابل مع سائر الحرفيين."]]}, {"l": "Jer 52:27-30", "n": "", "vs": [[27, "فضربهم ملك بابل وقتلهم في ربلة في منطقة حماة. وهكذا سبي شعب يهوذا من أرضه."], [28, "وهذا هو إحصاء الشعب الذين سباهم نبوخذناصر في السنة السابعة: ثلاثة آلاف وثلاثة وعشرون من اليهود."], [29, "وسبى نبوخذناصر من أورشليم في السنة الثامنة عشرة لحكمه ثماني مئة واثنين وثلاثين شخصا."], [30, "وفي السنة الثالثة والعشرين لحكم نبوخذناصر سبى نبوزرادان رئيس الشرطة من اليهود سبع مئة وخمسة وأربعين شخصا، فكانت جملة المسبيين أربعة آلاف وست مئة شخص."]]}], "kwAr": "سبيت", "noteAr": ""}, {"kw": "because of great servitude", "raw": "Heb. for the greatness of servitude", "note": "Heb. for the greatness of servitude", "refs": [], "kwAr": "بعد كل ما عانته من عنت وعبودية", "noteAr": "بالعبرانية: لعظم العبودية."}, {"kw": "she", "raw": "Lam_2:9; Lev_26:36-39; Deu_28:64-67; Jer_24:9; Eze_5:12", "note": "", "refs": [{"l": "Lam 2:9", "n": "", "vs": [[9, "غاصت في الأرض بواباتها، دمر وحطم مزاليجها. نفى ملكها ورؤساءها بين الأمم. زالت الشريعة، ولم يعد أنبياؤها يحصلون على رؤيا من عند الرب."]]}, {"l": "Lev 26:36-39", "n": "", "vs": [[36, "أما الباقون منكم في أرض أعدائكم، فإني ألقي الرعب في قلوبهم فيهربون من حفيف ورقة تسوقها الريح، وكأنهم يهربون من السيف، ويسقطون وليس ثمة من طارد لهم."], [37, "ويعثر بعضهم ببعض كمن يفر من أمام سيف من غير طارد لهم، ولا تثبتون أمام أعدائكم"], [38, "فتهلكون بين الشعوب، وتبتلعكم أرض أعدائكم."], [39, "أما بقيتكم فتفنى بذنوبها وذنوب آبائها في أرض أعدائكم كما فني آباؤهم من قبلهم."]]}, {"l": "Deu 28:64-67", "n": "", "vs": [[64, "ويشتتكم الرب بين جميع الأمم من أقصى الأرض إلى أقصاها، فتعبدون هناك آلهة أخرى من خشب أو حجر لم تعرفوها أنتم ولا آباؤكم،"], [65, "ولا تجدون بين تلك الأمم اطمئنانا ولا مقرا لقدم، بل يعطيكم الرب قلبا هلعا، وعيونا أوهنها الترقب، ونفوسا يائسة."], [66, "وتعيشون حياة مفعمة دائما بالتوتر، مليئة بالرعب ليلا ونهارا."], [67, "وتقولون في الصباح: يا ليته المساء، وفي المساء: يا ليته الصباح، من فرط ارتعاب قلوبكم وما تشهده عيونكم من هول."]]}, {"l": "Jer 24:9", "n": "", "vs": [[9, "وأوقعهم في الضيق والشر في جميع ممالك الأرض، وأجعلهم عارا وعبرة وأحدوثة ولعنة في جميع الأماكن التي أجليهم إليها."]]}, {"l": "Eze 5:12", "n": "", "vs": [[12, "ثلث سكانك يموتون بالوباء والجوع في وسطك، وثلث ثان يقتل حولك بالسيف، وثلث أخير أشتته بين الأمم وأتعقبه بسيف مسلول."]]}], "kwAr": "فأقامت", "noteAr": ""}, {"kw": "all", "raw": "Lam_4:18, Lam_4:19; Jer_16:16, Jer_52:8; Amo_9:1-4", "note": "", "refs": [{"l": "Lam 4:18", "n": "", "vs": [[18, "تصيد الرجال خطواتنا حتى لا نخطو في شوارعنا. آذنت نهايتنا، وتمت أيامنا وأزفت خاتمتنا."]]}, {"l": "Lam 4:19", "n": "", "vs": [[19, "كان مطاردونا أسرع من نسور السماء، تعقبونا على الجبال، وتربصوا بنا في الصحراء."]]}, {"l": "Jer 16:16", "n": "", "vs": [[16, "ها أنا أرسل صيادين كثيرين، ليصطادوهم، ثم أبعث بقناصين كثيرين ليقتنصوهم من كل جبل ومن كل رابية ومن شقوق الصخور."]]}, {"l": "Jer 52:8", "n": "", "vs": [[8, "لكن جيش الكلدانيين تعقب الملك، وأدرك صدقيا في سهول أريحا وقد تفرق عنه جميع جيشه،"]]}, {"l": "Amo 9:1-4", "n": "", "vs": [[1, "ورأيت السيد واقفا إلى جوار المذبح قائلا: «اضرب تيجان الأعمدة حتى تهتز العتبات، وحطمها على رؤوس جميع الشعب. ومن ينجو منهم أهلكه بالسيف، فلا يهرب منهم أحد ولا يفلت منهم ناج."], [2, "وإن نقبوا لأنفسهم ملجأ في أعماق الهاوية، فإن يدي تطولهم هناك، وإن ارتقوا إلى السماوات فمن هناك أنزلهم."], [3, "وإن اختبأوا في أعالي الكرمل فهناك أبحث عنهم وأعتقلهم. وإن تواروا عني في أعماق البحر فإني آمر هناك الحية فتلدغهم."], [4, "وإن سيقوا إلى السبي أمام أعدائهم ألاحقهم بالسيف لأفنيهم، وأتعقبهم لأبتليهم بالشر لا بالخير»."]]}], "kwAr": "مطاردوها", "noteAr": ""}], "arS": [["سبيت", ["H1540"]], [" ", []], ["يهوذا", ["H3063"]], [" إلى المنفى بعد ", []], ["كل", ["H3605"]], [" ما عانته ", []], ["من", ["H4480"]], [" ", []], ["عنت", ["H6040"]], [" ", []], ["وعبودية", ["H5656"]], ["، ", []], ["فأقامت", ["H3427"]], [" ", []], ["بين", ["H996"]], [" ", []], ["الأمم", ["H1471"]], [" ", []], ["شقية", ["H4672", "H3808", "H4494"]], ["، ", []], ["وأدركها", ["H5381"]], [" ", []], ["مطاردوها", ["H7291"]], [" في خضم ", []], ["ضيقاتها", ["H4712"]], [".", []]]}, {"c": 1, "v": 4, "text": "تنوح الطرق المفضية إلى صهيون، لأنها أقفرت من القادمين إلى الأعيا د! تهدمت بواباتها جميعا. كهنتها يتنهدون؛ عذاراها متحسرات وهي تقاسي مر العذاب.", "groups": [{"kw": "ways", "raw": "Lam_2:6, Lam_2:7, Lam_5:13; Isa_24:4-6; Jer_14:2; Mic_3:12", "note": "", "refs": [{"l": "Lam 2:6", "n": "", "vs": [[6, "نقض مظلته كما ينقض كوخ من الأغصان في حديقة، وردم مقر مجتمعه. جعل الرب صهيون تنسى مواسم أعيادها وسبوتها. ونبذ باحتدام سخطه الملك والكاهن."]]}, {"l": "Lam 2:7", "n": "", "vs": [[7, "كره الرب مذبحه، وتبرأ من مقدسه، وسلم أسوار قصورها إلى يد الأعداء الذين علا هتافهم في بيت الرب كما كان يعلو هتافنا في الأعياد."]]}, {"l": "Lam 5:13", "n": "", "vs": [[13, "سخروا الشبان للطحن، وهوى الصبيان تحت الحطب."]]}, {"l": "Isa 24:4-6", "n": "", "vs": [[4, "وتنوح الأرض وتذوي، وتضنى المسكونة وتذبل، ويحزن معها عظماؤها."], [5, "تدنست الأرض تحت سكانها، لأنهم تعدوا على الشريعة، ونقضوا الفرائض ونكثوا العهد الأبدي،"], [6, "لذلك التهمت اللعنة الأرض، وعوقب أهلها بإثمهم، فاحترق سكان الأرض ولم يبق منهم سوى قلة."]]}, {"l": "Jer 14:2", "n": "", "vs": [[2, "«أرض يهوذا تنوح وأبوابها واهية. أهلها يندبون مطروحين إلى الأرض، وعويل أورشليم قد صعد إلى العلى."]]}, {"l": "Mic 3:12", "n": "", "vs": [[12, "لهذا من جراء أعمالكم ستحرث صهيون كالحقل وتصبح أورشليم كومة من الخرائب، وجبل الهيكل مرتفعا تنمو عليه أشجار الغاب."]]}], "kwAr": "الطرق", "noteAr": ""}, {"kw": "all her gates", "raw": "Lam_2:9; Jer_9:11, Jer_10:22, Jer_33:10-12", "note": "", "refs": [{"l": "Lam 2:9", "n": "", "vs": [[9, "غاصت في الأرض بواباتها، دمر وحطم مزاليجها. نفى ملكها ورؤساءها بين الأمم. زالت الشريعة، ولم يعد أنبياؤها يحصلون على رؤيا من عند الرب."]]}, {"l": "Jer 9:11", "n": "", "vs": [[11, "«سأجعل أورشليم رجمة خراب، ومأوى لبنات آوى، وأحول مدن يهوذا إلى قفر مهجور»."]]}, {"l": "Jer 10:22", "n": "", "vs": [[22, "اسمعوا، ها أخبار تتواتر عن جيش عظيم مقبل من الشمال ليحول مدن يهوذا إلى خرائب ومأوى لبنات آوى."]]}, {"l": "Jer 33:10-12", "n": "", "vs": [[10, "وهذا ما يعلنه الرب: في هذا الموضع الذي تقولون عنه إنه خراب هجره الإنسان والحيوان، وفي مدن يهوذا وشوارع أورشليم الموحشة المقفرة من الناس، والتي لا يقيم فيها حيوان، ستتردد فيها ثانية"], [11, "أصوات الطرب والسرور، وهتاف العريس والعروس، وأصوات المقبلين إلى هيكل الرب بقرابين الشكر القائلين: احمدوا الرب القدير، لأن الرب صالح ورحمته إلى الأبد تدوم، لأني أرد سبي الأرض فتصبح آهلة كالأيام الخوالي."], [12, "في هذا الموضع الخرب المقفر من الإنسان والحيوان، وفي جميع مدنه، ستكون مساكن للرعاة يربضون فيها قطعانهم."]]}], "kwAr": "تهدمت بواباتها جميعا", "noteAr": ""}, {"kw": "her priests", "raw": "Lam_1:11, Lam_1:12, Lam_1:18-20, Lam_2:10,Lam_2:11, Lam_2:19-21; Isa_32:9-14; Joe_1:8-13", "note": "", "refs": [{"l": "Lam 1:11", "n": "", "vs": [[11, "شعبها كله يتنهد وهو يبحث عن القوت. قد قايضوا ذخائرهم بالطعام لإنعاش النفس الخائرة. (وقالت:) «انظر يارب وتأمل كيف أصبحت محتقرة»."]]}, {"l": "Lam 1:12", "n": "", "vs": [[12, "ألا يعنيكم هذا ياجميع عابري الطريق؟ تأملوا وانظروا، هل من ألم كألمي الذي ابتلاني به الرب في يوم احتدام غضبه؟"]]}, {"l": "Lam 1:18-20", "n": "", "vs": [[18, "الرب حقا عادل، وأنا قد تمردت على أمره. فاستمعوا ياجميع الشعوب واشهدوا وجعي. قد ذهب عذاراي وشباني إلى السبي."], [19, "دعوت محبي فخدعوني. فني كهنتي وشيوخي في المدينة وهم ينشدون قوتا لإحيا ء نفوسهم."], [20, "انظر يارب فإني في ضيقة. أحشائي جائشة وقلبي متلاطم في داخلي، لأني أكثرت التمرد. ها السيف يثكل في الخارج وفي البيت يسود الموت."]]}, {"l": "Lam 2:10", "n": "", "vs": [[10, "يجلس شيوخ ابنة صهيون على الأرض صامتين. عفروا بالرماد رؤوسهم، وارتدوا المسوح، وطأطأت عذارى أورشليم رؤوسهن إلى الأرض."]]}, {"l": "Lam 2:11", "n": "", "vs": [[11, "كلت عيناي من البكاء، جاشت أحشائي وأريقت كبدي على الأرض حزنا لدمار ابنة شعبي، لأن الأطفال والرضع غشي عليهم في شوارع المدينة."]]}, {"l": "Lam 2:19-21", "n": "", "vs": [[19, "قومي وانتحبي في الربع الأول من الليل. اسكبي كالماء قلبك في محضر الرب. ارفعي إليه يديك من أجل نفوس أطفالك المغشي عليهم من الجوع عند ناصية كل شارع."], [20, "انظر يارب وتأمل! بمن صنعت هذا؟ أعلى النساء أن يأكلن ثمرة بطونهن، وأطفال حضانتهن؟ أيتحتم على الكاهن والنبي أن يقتلا في مقدس الرب؟"], [21, "قد انطرح الصبي والشيوخ في غبار الطرقات. سقط عذاراي وشباني بالسيف. قد قتلتهم في يوم غضبك، ونحرتهم من غير رحمة."]]}, {"l": "Isa 32:9-14", "n": "", "vs": [[9, "أيتها النساء المترفات المتكاسلات، انهضن واستمعن إلى صوتي. أيتها البنات المطمئنات اصغين إلى أقوالي."], [10, "ما تكاد تنقضي أيام على سنة حتى تعتريكن رعدة أيتها الآمنات، لأن القطاف قد تلف، وموعد جني الأثمار قد أخلف."], [11, "ارتعدن أيتها النساء المطمئنات وارتجفن أيتها الفتيات الآمنات. تجردن من ثيابكن وتعرين ومنطقن أحقاءكن بالمسوح."], [12, "اضربن على صدوركن حسرة على المروج المبهجة والكروم المثمرة."], [13, "لأن أرض شعبي تنبت الشوك والحسك، فتنمو حتى في كل بيوت الفرح في المدينة المبتهجة."], [14, "لأن القصر يصبح مهجورا، والمدن العامرة خالية، والتلال والبروج مغاور إلى الأبد، ومراحا للحمير الوحشية ومرعى للقطعان،"]]}, {"l": "Joe 1:8-13", "n": "", "vs": [[8, "نوحوا كما تنوح صبية متشحة بالمسوح على زوجها الذي مات."], [9, "لأن تقدمات الدقيق والخمر قد انقطعت عن بيت الرب، وانتحب الكهنة خدام الرب."], [10, "قد خربت الحقول، وناحت الأرض لأن الحنطة تلفت والخمرة انقطعت، وافتقد زيت الزيتون."], [11, "اخزوا أيها الحراثون وأعولوا أيها الكرامون على الحنطة والشعير، لأن حصاد الحقل قد تلف."], [12, "قد ذوى الكرم وذبل التين والرمان والنخيل والتفاح ويبست سائر أشجار الحقل، وزالت البهجة من أبناء البشر."], [13, "أيها الكهنة اتشحوا بالمسوح ونوحوا. ولولوا ياخدام المذبح. تعالوا وبيتوا ليلتكم بالمسوح ياخدام إلهي، لأن تقدمات الدقيق والخمر قد منعت عن هيكل الله."]]}], "kwAr": "كهنتها", "noteAr": ""}], "arS": [["تنوح", ["H57"]], [" ", []], ["الطرق", ["H1870"]], [" المفضية إلى ", []], ["صهيون", ["H6726"]], ["، لأنها ", []], ["أقفرت", ["H1097"]], [" ", []], ["من", ["H4480"]], [" ", []], ["القادمين", ["H935"]], [" إلى ", []], ["الأعيا", ["H4150"]], [" د! ", []], ["تهدمت", ["H8074"]], [" ", []], ["بواباتها", ["H8179"]], [" ", []], ["جميعا", ["H3605"]], [". ", []], ["كهنتها", ["H3548"]], [" ", []], ["يتنهدون", ["H584"]], ["؛ ", []], ["عذاراها", ["H1330"]], [" ", []], ["متحسرات", ["H3013"]], [" ", []], ["وهي", ["H1931"]], [" تقاسي ", []], ["مر", ["H4843"]], [" العذاب.", []]]}, {"c": 1, "v": 5, "text": "أصبح أعداؤها سادة، ونجح مضايقوها، لأن الرب أشقاها بسبب خطاياها المتكاثرة. قد ذهب أولادها إلى السبي أمام العدو.", "groups": [{"kw": "adversaries", "raw": "Lam_2:17, Lam_3:46; Lev_26:17; Deu_28:43, Deu_28:44; Psa_80:6, Psa_89:42; Isa_63:18; Jer_12:7; Mic_7:8-10", "note": "", "refs": [{"l": "Lam 2:17", "n": "", "vs": [[17, "نفذ الرب قضاءه، وحقق وعيده الذي حكم به منذ الحقب السالفة. هدم ولم يرأف، فأشمت بك الخصم، وعظم قوة عدوك."]]}, {"l": "Lam 3:46", "n": "", "vs": [[46, "فغر علينا جميع أعدائنا أشداقهم،"]]}, {"l": "Lev 26:17", "n": "", "vs": [[17, "وأنقلب عليكم فتنهزمون أمام أعدائكم، ويتحكم بكم مبغضوكم وتهربون من غير طارد لكم."]]}, {"l": "Deu 28:43", "n": "", "vs": [[43, "يعظم شأن الغرباء المقيمين بينكم، ويتفاقم انحطاط شأنكم."]]}, {"l": "Deu 28:44", "n": "", "vs": [[44, "هم يقرضونكم وأنتم لا تقرضونهم، وهم يكونون رأسا وأنتم تكونون ذنبا،"]]}, {"l": "Psa 80:6", "n": "", "vs": [[6, "جعلتنا مصدر نزاع لجيراننا ومثار هزء لأعدائنا."]]}, {"l": "Psa 89:42", "n": "", "vs": [[42, "رفعت يمين ظالميه وأبهجت جميع أعدائه."]]}, {"l": "Isa 63:18", "n": "", "vs": [[18, "قد داس أعداؤنا هيكلك الذي امتلكه شعبك المقدس زمنا يسيرا،"]]}, {"l": "Jer 12:7", "n": "", "vs": [[7, "قد نبذت هيكلي وهجرت ميراثي، وسلمت حبيبة نفسي إلى أيدي أعدائها."]]}, {"l": "Mic 7:8-10", "n": "", "vs": [[8, "لا تشمتي بي ياعدوتي، لأني إن سقطت أقوم، وإن جلست في الظلمة يكون الرب نورا لي."], [9, "إني أخطأت إلى الرب لذلك أتحمل غضبه، إلى أن يدافع عني ويثبت استقامتي، فيخرجني إلى النور لأشاهد عدله."], [10, "عندئذ ترى ذلك عدوتي فيعتريها الخزي إذ قالت لي: «أين هو الرب إلهك؟» ستشهدها عيناي تداس كطين الشوارع والأزقة."]]}], "kwAr": "أعداؤها", "noteAr": ""}, {"kw": "for", "raw": "Lam_1:18, Lam_3:39-43; Lev. 26:15-46; Deu_4:25-27, 28:15-68, Deu_29:18-28; Deu_31:16-18, Deu_31:29, Deu_32:15-27; 2Ch_36:14-16; Neh_9:33, Neh_9:34; Psa_90:7, Psa_90:8; Jer_5:3-9, Jer_5:29, Jer_23:14, Jer_30:14, Jer_30:15, Jer_44:21, Jer_44:22; Eze_8:17, Eze_8:18, Eze_9:9, Eze_22:24-31; Dan_9:7-16; Mic_3:9-12; Zep_3:1-8", "note": "", "refs": [{"l": "Lam 1:18", "n": "", "vs": [[18, "الرب حقا عادل، وأنا قد تمردت على أمره. فاستمعوا ياجميع الشعوب واشهدوا وجعي. قد ذهب عذاراي وشباني إلى السبي."]]}, {"l": "Lam 3:39-43", "n": "", "vs": [[39, "فلماذا يشتكي الإنسان الحي حين يعاقب على خطاياه؟"], [40, "لنفحص طرقنا ونختبرها ونرجع إلى الرب."], [41, "لنرفع قلوبنا وأيدينا إلى الله في السماوات."], [42, "قد تعدينا وتمردنا، وأنت لم تغفر."], [43, "لفعت نفسك بالغضب وتعقبتنا. قتلت من غير رحمة."]]}, {"l": "Lev 26:15-46", "n": "", "vs": [[15, "وإن تنكرتم لفرائضي وكرهتم أحكامي ولم تعملوا بكل وصاياي، بل نكثتم ميثاقي،"], [16, "فإني أبتليكم بالرعب المفاجيء وداء السل والحمى التي تفني العينين وتتلف النفس، وتزرعون على غير طائل، وينهب أعداؤكم زرعكم."], [17, "وأنقلب عليكم فتنهزمون أمام أعدائكم، ويتحكم بكم مبغضوكم وتهربون من غير طارد لكم."], [18, "وإن أمعنتم في عصيانكم أزيد من عقابكم سبع مرات وفقا لخطاياكم."], [19, "أذل غطرستكم، وأجعل سماءكم كالحديد لا تمطر وأرضكم كالنحاس لا تغل"], [20, "فيذهب جهدكم باطلا لأن أرضكم لن تعطي غلتها، وأشجار الأرض لن تعطي أثمارها."], [21, "وإن واظبتم على عصيانكم وأبيتم طاعتي، أضاعف عقابي لكم سبع مرات وفقا لخطاياكم."], [22, "وأطلق عليكم وحوش الصحراء فتفترس أولادكم وتهلك بهائمكم، وتنقص من عددكم، فتقفر طرقاتكم."], [23, "وإن لم تتعظوا، وتماديتم في عصيانكم،"], [24, "أنقلب عليكم وأزيد في بلائكم سبع مرات وفقا لخطاياكم."], [25, "أسلط عليكم سيف العدو. فينتقم منكم لنقضكم ميثاقي، فتلوذون بمدنكم حيث أرسل عليكم الوباء وتسلمون إلى يد العدو"], [26, "وحين أقطع عنكم مؤونة الدقيق، تخبز عشر نساء خبزكم في فرن واحد لقلة الدقيق، وتقسمون الخبز بالميزان فتأكلون ولا تشبعون."], [27, "وإن لم يجد هذا العقاب في تأديبكم، فتماديتم في عصيانكم،"], [28, "فإني أزيد في احتدام غضبي، من عدائي لكم وأضاعف عقابي سبع مرات أخرى وفقا لخطاياكم،"], [29, "فتأكلون لحم أبنائكم وبناتكم."], [30, "وأدك مذابح مرتفعاتكم، وأحطم أنصاب شموسكم وأكوم جثثكم فوق بقايا أصنامكم، وتنبذكم نفسي."], [31, "وأحول مدنكم إلى خرائب، وأجعل مقادسكم موحشة، ولا أبتهج برائحة تقدمات سروركم،"], [32, "وأجعل الأرض قفرا فيرتاع من وحشتها أعداؤكم الساكنون فيها"], [33, "وأشتتكم بين الشعوب، وأجرد عليكم سيفي، وألاحقكم، وأحول أرضكم إلى قفر ومدنكم إلى خرائب."], [34, "عندئذ تستوفي الأرض راحة سبوتها طوال سني وحشتها وأنتم مشتتون في ديار أعدائكم. حينئذ ترتاح الأرض وتستوفي سني سبوتها."], [35, "فتعوض في أيام وحشتها عن راحتها التي لم تنعم بها في سنوات سبوتكم عندما كنتم تقيمون عليها."], [36, "أما الباقون منكم في أرض أعدائكم، فإني ألقي الرعب في قلوبهم فيهربون من حفيف ورقة تسوقها الريح، وكأنهم يهربون من السيف، ويسقطون وليس ثمة من طارد لهم."], [37, "ويعثر بعضهم ببعض كمن يفر من أمام سيف من غير طارد لهم، ولا تثبتون أمام أعدائكم"], [38, "فتهلكون بين الشعوب، وتبتلعكم أرض أعدائكم."], [39, "أما بقيتكم فتفنى بذنوبها وذنوب آبائها في أرض أعدائكم كما فني آباؤهم من قبلهم."], [40, "ولكن إن اعترفوا بخطاياهم وخطايا آبائهم وبخيانتهم لي وعداوتهم،"], [41, "التي جعلتني أنقلب عليهم وأنفيهم إلى أرض أعدائهم، وإن خضعت قلوبهم النجسة بعد أن استوفوا عقاب خطاياهم،"], [42, "فإني أذكر ميثاقي مع يعقوب، وميثاقي مع إسحق، وميثاقي مع إبراهيم، وأذكر الأرض،"], [43, "التي أقفرت منهم، فاستوفت راحة سبوتها في أثناء نفيهم عنها، ويكونون آنئذ قد استوفوا عقاب خطاياهم لأنهم تنكروا لشرائعي وكرهوا فرائضي."], [44, "ولكن على الرغم من ذلك فإنني لم أنبذهم وهم في أرض أعدائهم، ولا كرهتهم حتى أبيدهم وأنقض ميثاقي معهم، لأني أنا الرب إلههم،"], [45, "بل أذكر ميثاقي مع آبائهم الأولين الذين أخرجتهم من ديار مصر على مشهد من الشعوب لأكون لهم إلها. أنا الرب»."], [46, "هذه هي الفرائض والأحكام والشرائع التي أقامها الرب بينه وبين بني إسرائيل في جبل سيناء على لسان موسى."]]}, {"l": "Deu 4:25-27", "n": "", "vs": [[25, "وإذا أنجبتم بنين وأحفادا ومكثتم طويلا في الأرض، ثم غويتم فنحتم لكم تمثالا لصورة شيء ما، وارتكبتم الشر في عيني الرب إلهكم لإثارة غيظه،"], [26, "فإنني أشهد عليكم اليوم السماء والأرض، أنكم تنقرضون سريعا من الأرض التي أنتم عابرون نهر الأردن إليها لترثوها، ولن تطول بكم الأيام عليها، إذ لابد أنكم حينئذ هالكون."], [27, "ويشتتكم الرب بين الأمم فتصبحون أقلية بين الشعوب التي يسوقكم إليها."]]}, {"l": "Deu 28:15-68", "n": "", "vs": [[15, "ولكن إن عصيتم صوت الرب إلهكم ولم تحرصوا على العمل بجميع وصاياه وفرائضه التي أنا آمركم اليوم بها، فإن جميع هذه اللعنات تحل بكم وتلازمكم."], [16, "تكونون ملعونين في المدينة وملعونين في الحقول."], [17, "وتكون سلالكم ومعاجنكم ملعونة."], [18, "وتحل اللعنة بأبنائكم وغلات أرضكم ونتاج بقركم ونعاجكم،"], [19, "وتكونون ملعونين في ذهابكم وإيابكم،"], [20, "ويصب الرب عليكم اللعنة والفوضى والفشل في كل ما تنتجه أيديكم، حتى تهلكوا وتفنوا سريعا لسوء أفعالكم، إذ تركتموني."], [21, "ويتفشى بينكم الوباء حتى يبيدكم عن الأرض التي أنتم ماضون إليها لامتلاكها،"], [22, "ويضربكم الرب بالسل والحمى والرعشة والالتهاب والجفاف واللفح والذبول، فتلازمكم حتى تفنوا."], [23, "وتصبح السماء التي فوقكم كالنحاس والأرض تحتكم كالحديد."], [24, "ويحول الرب مطر أرضكم إلى غبار وعواصف ترابية تنهمر عليكم من السماء حتى تهلكوا."], [25, "ويهزمكم الرب أمام أعدائكم فتقبلون عليهم في طريق واحدة وتولون الأدبار أمامهم متفرقين في سبع طرق، وتصبحون عبرة لجميع ممالك الأرض."], [26, "وتكون جثثكم طعاما لجميع طيور السماء ووحوش الأرض ولا يطردها أحد."], [27, "ويصيبكم الرب بداء قرحة مصر وبالبواسير والجرب والحكة، ولا تجدون لها علاجا."], [28, "ويبتليكم الرب بالجنون والعمى وارتباك الفكر،"], [29, "فتتحسسون طرقكم في الظهر كما يتحسس الأعمى طريقه في الظلام، وتبوء طرقكم بالإخفاق، ولا تكونون إلا مظلومين مغصوبين كل الأيام، وليس من منقذ."], [30, "يخطب أحدكم امرأة ولكن آخر يتزوجها ويضاجعها. تبني بيتا ولا تسكن فيه، وتغرس كرما ولا تجنيه."], [31, "يذبح ثورك أمام عينيك ولا تأكل منه، ويغتصب حمارك على مرأى منك ولا يرد إليك، ويستولي أعداؤك على ماشيتك وليس من منقذ."], [32, "يساق أولادك وبناتك إلى أمة أخرى وعيناك تراقبانهم طوال النهار، حتى تكلا، وما في يدك حيلة."], [33, "محصول أرضك وثمر تعبك يأكله شعب غريب عنك، ولا تكون سوى مظلوم مسحوق دائما."], [34, "ويصيبك الجنون من هول ما ترى."], [35, "ويبتليك الرب بقروح خبيثة تغطي الركبتين والساقين، حتى لا تجد لها شفاء من قمة الرأس إلى أخمص القدم."], [36, "ينفيكم الرب أنتم وملككم الذي تختارونه إلى أمة لا تعرفونها أنتم ولا آباؤكم، حيث تعبدون هناك آلهة أخرى من خشب وحجر،"], [37, "وتصبحون مثار دهشة وسخرية وعبرة في نظر جميع الشعوب التي ينفيكم الرب إليهم"], [38, "تبذرون كثيرا من البذار في الحقول، ولا تحصدون إلا القليل، لأن الجراد يلتهمه."], [39, "تكدحون في غرس كروم ومن خمرها لا تشربون، ومن ثمرها لا تجنون، لأن الدود ينخرها."], [40, "تكتظ أراضيكم بأشجار الزيتون، ولكن من زيتها لا تدهنون، لأن زيتونكم ينتثر على الأرض قبل نضجه."], [41, "تنجبون بنين وبنات ولا يكونون لكم، لأنهم يسبون."], [42, "تلتهم أسراب الجراد أشجاركم وغلات أرضكم."], [43, "يعظم شأن الغرباء المقيمين بينكم، ويتفاقم انحطاط شأنكم."], [44, "هم يقرضونكم وأنتم لا تقرضونهم، وهم يكونون رأسا وأنتم تكونون ذنبا،"], [45, "وتحل بكم هذه اللعنات وتلازمكم وتلاحقكم حتى تهلكوا، لأنكم لم تطيعوا صوت الرب إلهكم لتحفظوا وصاياه وفرائضه التي أمركم بها،"], [46, "فتكون فيكم وفي ذريتكم عبرة ونذيرا إلى الأبد."], [47, "ولأنكم لم تعبدوا الرب إلهكم بفرح وغبطة في زمن الازدهار والوفرة،"], [48, "فإنكم تصبحون عبيدا لأعدائكم الذين يرسلهم الرب عليكم في أحوال الجوع والعطش والعري والفاقة، ويضع نير حديد على أعناقكم حتى يهلككم."], [49, "ويجلب الرب عليكم من بعيد، من أقصى الأرض، أمة لا تفهمون لغتها، فتنقض عليكم كالنسر."], [50, "أمة يثير منظرها الرعب، لا تهاب الشيخ ولا ترأف بالطفل،"], [51, "فتستولي على نتاج بهائمكم، وتلتهم غلات أرضكم حتى تفنوا، ولا تبقي لكم قمحا ولا خمرا ولا زيتا ولا نتاج بقركم ونعاجكم حتى تهلككم."], [52, "وتحاصركم في جميع مدنكم حتى تتهدم أسواركم الشامخة الحصينة التي وثقتم بمناعتها في كل مدنكم. فتحاصركم في جميع مدنكم في كل أرضكم التي يهبها الرب إلهكم لكم."], [53, "فتأكلون في أثناء الحصار والضيقة التي يضايقكم بها عدوكم ثمار بطونكم، لحم أبنائكم وبناتكم الذين رزقكم بهم الرب إلهكم."], [54, "فيقسو قلب أكثركم رقة ورأفة على أخيه وامرأته التي في حضنه وسائر أبنائه الأحياء."], [55, "فلا يعطي أحدهم من لحم أبنائه، الذي يأكله، لأنه لم يبق لديه شيء سواه في الحصار والضيقة التي يضايقكم بها عدوكم في جميع مدنكم."], [56, "وكذلك فإن أكثر النساء رقة ورأفة، والتي لنعومتها وترفهها لا تجرؤ على لمس الأرض بباطن قدمها، تبخل على زوجها رجل حضنها وعلى ابنها وابنتها"], [57, "بمشيمتها الساقطة منها، وبأولادها الذين تلدهم، لأنها تنوي أن تأكلهم سرا في أثناء الحصار، في الضيقة التي يضايقكم بها عدوكم في كل مدنكم."], [58, "فإن لم تحرصوا على العمل بجميع كلمات هذه الشريعة المكتوبة في هذا الكتاب، لتهابوا اسم الرب إلهكم الجليل المرهوب،"], [59, "فإن الرب يجعل الضربات النازلة بكم وبذريتكم ضربات مخيفة وكوارث رهيبة دائمة وأمراضا خبيثة مزمنة،"], [60, "ويرسل عليكم كل أمراض مصر التي فزعتم منها فتلازمكم،"], [61, "ويسلط الرب عليكم أيضا كل داء وكل بلية لم ترد في كتاب الشريعة هذا، حتى تهلكوا."], [62, "فتصيرون قلة بعد أن كنتم في كثرة نجوم السماء، لأنكم لم تسمعوا صوت الرب إلهكم."], [63, "وكما سر الرب بكم فأحسن إليكم وكثركم، فإنه سيسر بأن يفنيكم ويهلككم فتنقرضون من الأرض التي أنتم ماضون إليها لامتلاكها."], [64, "ويشتتكم الرب بين جميع الأمم من أقصى الأرض إلى أقصاها، فتعبدون هناك آلهة أخرى من خشب أو حجر لم تعرفوها أنتم ولا آباؤكم،"], [65, "ولا تجدون بين تلك الأمم اطمئنانا ولا مقرا لقدم، بل يعطيكم الرب قلبا هلعا، وعيونا أوهنها الترقب، ونفوسا يائسة."], [66, "وتعيشون حياة مفعمة دائما بالتوتر، مليئة بالرعب ليلا ونهارا."], [67, "وتقولون في الصباح: يا ليته المساء، وفي المساء: يا ليته الصباح، من فرط ارتعاب قلوبكم وما تشهده عيونكم من هول."], [68, "ويردكم الرب إلى ديار مصر في سفن في طريق وعدكم ألا تعودوا ترونها، فتباعون هناك لأعدائكم عبيدا وإماء، وليس من يشتري»."]]}, {"l": "Deu 29:18-28", "n": "", "vs": [[18, "لئلا يكون بينكم رجل أو امرأة أو عشيرة أو سبط مال قلبه عن الرب إلهنا، فغوى ليعبد آلهة تلك الأمم. فاحرصوا ألا يكون بينكم من تأصل فيه الشر، فيحمل ثمرا علقما ساما."], [19, "فإن سمع كلام هذا القسم يستمطر بركة على نفسه قائلا: «سأكون آمنا حتى ولو أصررت على الاستمرار فى سلوك طريقي إن هذا يفضي إلى فناء الأخضر واليابس على حد سواء."], [20, "إن الرب لا يشاء الرفق بمثل هذا الإنسان، بل يحتدم غضبه وغيرته عليه، فتنزل به كل اللعنات المدونة في هذا الكتاب، ويمحو اسمه من تحت السماء."], [21, "ويفرزه الرب من بين أسباط إسرائيل ليهلكه بمقتضى جميع لعنات العهد المدونة في كتاب الشريعة هذا."], [22, "فيشاهد أبناؤكم من الأجيال القادمة، والغرباء الوافدون من أرض بعيدة بلايا تلك الأرض وما يصيبها الرب به من أمراض،"], [23, "إذ تصبح جميع الأرض كبريتا، محترقة لا زرع فيها ولا نبات ولا عشب، وكأنها انقلبت كما جرى لسدوم وعمورة وأدمة وصبوييم، التي قلبها الرب من جراء غضبه وسخطه."], [24, "فتقول جميع الأمم: لماذا فعل الرب هذا كله بهذه الأرض؟ ولماذا احتدام هذا الغضب العظيم؟"], [25, "فيكون الجواب: لأن هذا الشعب نقض عهد الرب إله آبائهم الذي قطعه معهم حين أخرجهم من ديار مصر،"], [26, "وغووا وعبدوا آلهة أخرى وسجدوا لها، آلهة غريبة لم يعرفوها ولم يعطها الرب لهم،"], [27, "فالتهب غضب الرب على تلك الأرض، فصب عليها كل اللعنات المدونة فى هذا الكتاب"], [28, "واجتثهم من أرضهم بغضب وسخط وغيظ عظيم، وطوح بهم إلى أرض أخرى كما هو حادث اليوم."]]}, {"l": "Deu 31:16-18", "n": "", "vs": [[16, "وقال الرب لموسى: «ما إن تموت وتلحق بآبائك حتى يسرع هذا الشعب ويفجر وراء آلهة الغرباء المقيمين في الأرض التي هو داخل إليها في وسطهم، ويتخلى عني وينكث عهدي الذي أبرمته معه،"], [17, "فيحتدم غضبي عليه في ذلك اليوم، وأنبذه وأحجب وجهي عنه، فيكون فريسة. وتلحق به شرور كثيرة ومصائب، حتى يقول: أليس لأن إلهي قد هجرني، قد أصابتني هذه الشرور؟"], [18, "وأحجب وجهي عنهم من أجل جميع ما ارتكبوه من شرور، إذ سعوا وراء آلهة أخرى."]]}, {"l": "Deu 31:29", "n": "", "vs": [[29, "لأنني واثق أنكم بعد موتي تفسدون وتضلون عن الطريق التي أوصيتكم بها، فيصيبكم الشر في آخر الأيام، لأنكم تقترفون الشر أمام الرب حتى تثيروا غيظه بما تجنيه أيديكم»."]]}, {"l": "Deu 32:15-27", "n": "", "vs": [[15, "فسمن بنو إسرائيل ورفسوا، سمنوا وغلظوا واكتسوا شحما، فرفضوا الإله صانعهم وتنكروا لصخرة خلاصهم."], [16, "أثاروا غيرته بآلهتهم الغريبة، وأغاظوه بأصنامهم الرجسة."], [17, "قدموا محرقات لأوثان ليست هي الله، لآلهة غريبة لم يعرفوها بل ظهرت حديثا، آلهة لم يرهبها آباؤهم من قبل."], [18, "لقد نبذتم الصخر الذي أنجبكم، ونسيتم الله الذي أنشأكم."], [19, "فرأى الرب ذلك ورذلهم، إذ أثار أبناؤه وبناته غيظه."], [20, "وقال: سأحجب وجهي عنهم، فأرى ماذا يكون مصيرهم؟ إنهم جيل متقلب وأولاد خونة،"], [21, "هيجوا غيرتي بعبادة أوثانهم، وأسخطوني بأصنامهم الباطلة. لذلك سأثير غيرتهم بشعب متوحش، وأغيظهم بأمة حمقاء."], [22, "فها قد أضرم غضبي نارا تحرق حتى الهاوية السفلى، وتأكل الأرض وغلاتها، وتشعل أسس الجبال."], [23, "أكوم عليهم شرورا وأنفذ سهامي فيهم."], [24, "وحين يكونون خائرين من الجوع، منهوكين من الحمى والداء السام، أجعل أنياب الوحوش مع سم زواحف الأرض تنشب فيهم."], [25, "يثكلهم سيف العدو في الطريق، ويستولي عليهم الرعب داخل الخدور، فيهلك الفتى مع الفتاة، والرضيع مع الشيخ."], [26, "قلت: أشتتهم في زوايا الأرض، وأمحو من بين الناس ذكرهم."], [27, "لولا خوفي من تبجح العدو، إذ يظنون قائلين: إن يدنا قد عظمت، وليس ما جرى هو من فعل الرب."]]}, {"l": "2Ch 36:14-16", "n": "", "vs": [[14, "وأغوى معه رؤساء الكهنة والشعب الذين ازدادوا تورطا في خيانة الرب، مقترفين كل رجاسات الأمم، حتى إنهم نجسوا بيت الرب الذي قدسه في أورشليم."], [15, "وأرسل الرب إله آبائهم إليهم رسلا بصورة متوالية محذرا إياهم لأنه أشفق على شعبه وعلى مسكنه."], [16, "فكانوا يهزأون برسل الله، ورفضوا كلامه، واستهانوا بأنبيائه، حتى ثار غضب الرب على شعبه وامتنع كل شفاء!"]]}, {"l": "Neh 9:33", "n": "", "vs": [[33, "فقد كنت عادلا في كل ما حل بنا، لأنك عاقبتنا بالحق، ونحن الذين أذنبنا."]]}, {"l": "Neh 9:34", "n": "", "vs": [[34, "ولم يطع ملوكنا ورؤساؤنا وكهنتنا وآباؤنا شريعتك، ولا استمعوا إلى وصاياك وتحذيراتك التي أنذرتهم بها."]]}, {"l": "Psa 90:7", "n": "", "vs": [[7, "إن غضبك قد أفنانا وسخطك قد روعنا."]]}, {"l": "Psa 90:8", "n": "", "vs": [[8, "جعلت آثامنا أمامك وخطايانا الخفية ظاهرة لديك."]]}, {"l": "Jer 5:3-9", "n": "", "vs": [[3, "أيها الرب، أليست عيناك تطلبان الحق؟ لقد عاقبتهم ولكنهم لم يتوجعوا. أهلكتهم ولكنهم أبوا التقويم. صلبوا وجوههم أكثر من الصخر، ورفضوا التوبة."], [4, "فقلت في نفسي: «إنما هم مساكين حمقى، يجهلون طريق الرب وقضاء إلههم."], [5, "فلأقصدن العظماء وأكلمهم لأنهم يعرفون طريق الرب وقضاء إلههم». فإذا هؤلاء جميعا قد حطموا النير وقطعوا الربط."], [6, "لذلك ينقض عليهم أسد من الغاب ويقتلهم، ويفترسهم ذئب من الصحراء، ويكمن النمر حول مدنهم، فيمزق إربا كل من يخرج منهم، لأن آثامهم كثيرة، وارتداداتهم متعاظمة."], [7, "«كيف أعفو عن أعمالك؟ تخلى عني أبناؤك وأقسموا بأوثان. وعندما أشبعتهم ارتكبوا الفسق، وهرولوا طوائف إلى مواخير الزانيات."], [8, "صاروا كحصن معلوفة سائبة يصهل كل واحد منهم على امرأة صاحبه."], [9, "ألا أعاقبهم على هذه الأمور؟» يقول الرب، ألا أنتقم لنفسي من أمة مثل هذه؟"]]}, {"l": "Jer 5:29", "n": "", "vs": [[29, "أفلا أعاقبهم على هذه الأمور؟» يقول الرب. ألا أنتقم لنفسي من أمة كهذه؟"]]}, {"l": "Jer 23:14", "n": "", "vs": [[14, "وفي أوساط أنبياء أورشليم رأيت أمورا مهولة: يرتكبون الفسق، ويسلكون في الأكاذيب، يشددون أيدي فاعلي الإثم لئلا يتوب أحد عن شره. صاروا جميعا كسكان سدوم وأصبح أهلها كأهل عمورة."]]}, {"l": "Jer 30:14", "n": "", "vs": [[14, "قد نسيك محبوك، وأهملوك إهمالا، لأني ضربتك كما يضرب عدو، وعاقبتك عقاب مبغض قاس، لأن إثمك عظيم وخطاياك متكاثرة."]]}, {"l": "Jer 30:15", "n": "", "vs": [[15, "لماذا تنوحين من ضربتك؟ إن جرحك مستعص من جراء إثمك العظيم وخطاياك المتكاثرة، لهذا أوقعت بك المحن."]]}, {"l": "Jer 44:21", "n": "", "vs": [[21, "«أليس ما أحرقتموه من بخور في مدن يهوذا وفي شوارع أورشليم أنتم وآباؤكم وملوككم ورؤساؤكم وسكان الأرض، هو الذي ذكره الرب وخطر على باله؟"]]}, {"l": "Jer 44:22", "n": "", "vs": [[22, "فلم يطق الرب بعد تحمل ما ارتكبتم من شر وما اقترفتم من أرجاس، فصارت أرضكم أطلالا ومثار دهشة ولعنة ومهجورة كالعهد بها في هذا اليوم."]]}, {"l": "Eze 8:17", "n": "", "vs": [[17, "فقال لي: «أشهدت ياابن آدم؟ أقليل ما ارتكبه شعب يهوذا من رجاسات هنا؟ فقد عاثوا في الأرض فسادا، وثابروا على إغاظتي، وقربوا كل ما هو منتن في هيكلي"]]}, {"l": "Eze 8:18", "n": "", "vs": [[18, "لذلك أعاقبهم بالغضب، ولا تترَأف عيني عليهم، ولا أعفو، وإن استغاثوا بصوت عال لا أستجيب لهم»."]]}, {"l": "Eze 9:9", "n": "", "vs": [[9, "فأجابني: «إن إثم شعب إسرائيل ويهوذا عظيم جدا جدا، وقد غرقت الأرض بالدماء، وامتلأت المدينة فسادا لأنهم يقولون: قد هجر الرب الأرض، والرب لا يرى."]]}, {"l": "Eze 22:24-31", "n": "", "vs": [[24, "«ياابن آدم، تنبأ وقل لها: أنت أرض لم تتطهري ولم يمطر عليها في يوم الغضب."], [25, "تواطأ أنبياؤها الكذبة فيها مثل أسد مزمجر يمزق الفريسة. التهموا نفوسا، واستولوا على نفائس الناس وكنوزهم، وكثروا أراملها فيها."], [26, "خالف كهنتها شريعتي ونجسوا مقادسي. لم يميزوا بين المقدس والرجس، ولم يعلموا الفرق بين الطاهر والنجس، وحجبوا عيونهم عن أيام سبوتي فصرت مدنسا في وسطهم."], [27, "رؤساؤها فيها كذئاب خاطفة تمزق فرائسها إذ يسفكون دماء الناس في سبيل الربح الحرام."], [28, "وأنبياؤها قد طلوا لهم بماء الكلس، إذ يرون لهم رؤى باطلة، ويعرفون لهم عرافة كاذبة قائلين: هذا ما يعلنه السيد الرب، مع أن الرب لم يعلن شيئا."], [29, "أفرطوا في ظلم شعب الأرض واغتصبوا سالبين، واضطهدوا الفقير والمسكين، وظلموا الغريب جورا."], [30, "فالتمست من بينهم رجلا واحدا يبني جدارا ويقف في الثغرة أمامي مدافعا عن الأرض، حتى لا أخربها فلم أجد."], [31, "فصببت سخطي عليهم، التهمتهم بنار غضبي، جازيتهم بحسب طرقهم، يقول السيد الرب»."]]}, {"l": "Dan 9:7-16", "n": "", "vs": [[7, "لك أيها السيد البر، ولنا الخزي، كما هو حادث اليوم لرجال يهوذا ولأهل أورشليم، ولسائر بني إسرائيل القريبين والبعيدين، المشتتين في كل البلدان التي أجليتهم إليها عقابا لهم على ما اقترفوه من خيانة في حقك."], [8, "فلنا أيها السيد الخزي، نحن وملوكنا ورؤسائنا وآبائنا، لأننا أخطأنا إليك."], [9, "إنما للرب إلهنا الرحمة والمغفرة لأننا عصيناك."], [10, "ولم نطع صوت الرب إلهنا لنسلك في شرائعه التي أعلنها لنا على لسان عبيده الأنبياء."], [11, "قد تعدى كل شعب إسرائيل على شريعتك، وانحرفوا فلم يسمعوا صوتك، فسكبت علينا اللعنة وما أقسمت أن توقعه بنا، كما نصت عليه شريعة موسى عبد الله، لأننا أخطأنا إليك."], [12, "وقد نفذت قضاءك الذي قضيت به علينا وعلى قضاتنا الذين تولوا أمرنا، جالبا علينا وعلى أورشليم شرا عظيما لم يحدث له مثيل تحت السماء."], [13, "وكما ورد في شريعة موسى، أصابنا جميع هذا البلاء، ولم نستعطف وجهك أيها الرب إلهنا تائبين عن آثامنا ومتنبهين لحقك."], [14, "فأضمرت لنا العقاب وأوقعته بنا لأنك إلهنا البار في كل أعمالك التي صنعتها لأننا لم نستمع إليك."], [15, "والآن أيها السيد إلهنا، يامن أخرجت شعبك من ديار مصر بقوة مقتدرة، وأشهرت اسمك كما هو حادث اليوم، قد أخطأنا وارتكبنا الشر."], [16, "فاصرف ياسيد، حسب رحمتك، سخطك وغضبك عن مدينتك أورشليم جبل قدسك إذ من جراء خطايانا وآثام آبائنا أصبحت أورشليم مثار عار لنا عند جميع المحيطين بنا."]]}, {"l": "Mic 3:9-12", "n": "", "vs": [[9, "استمعوا هذا يارؤساء بيت يعقوب وقضاة شعب إسرائيل الذين يكرهون العدل ويحرفون الحق."], [10, "الذين يبنون صهيون بالدم وأورشليم بالظلم."], [11, "إذ يحكم رؤساؤها بالرشوة، وكهنتها يعلمون بالأجرة ويتعاطى أنبياؤها العرافة لقاء المال، ومع ذلك يدعون الاتكال على الله قائلين: «أليس الرب في وسطنا؟ لذلك لن يصيبنا مكروه»."], [12, "لهذا من جراء أعمالكم ستحرث صهيون كالحقل وتصبح أورشليم كومة من الخرائب، وجبل الهيكل مرتفعا تنمو عليه أشجار الغاب."]]}, {"l": "Zep 3:1-8", "n": "", "vs": [[1, "ويل للمدينة الظالمة المتمردة الدنسة،"], [2, "التي لا تصغي لصوت أحد، وتأبى التقويم، ولا تتكل على الرب، ولا تتقرب من إلهها."], [3, "رؤساؤها في داخلها أسود زائرة، وقضاتها كذئاب المساء الجائعة التي لا تبقي شيئا من فرائسها إلى الصباح."], [4, "أنبياؤها مغرورون وخونة، وكهنتها يدنسون المقدس ويتعدون على الشريعة."], [5, "ولكن الرب ما برح صديقا في وسطها، لا يرتكب خطأ، ويبدي في كل صباح عدله وفي كل فجر حقه. لا يخفق قط؛ أما الأثيم فلا يعرف ما هو الخزي."], [6, "استأصلت أمما فغدت بروجهم أطلالا. أقفرت شوارعهم فلا يعبر بها أحد. صارت مدنهم خرابا لا يقيم فيها إنسان أو ساكن."], [7, "فقلت: لو إن أهلها يخافونني ويقبلون تقويمي، فلا تستأصل مساكنهم ولا ينصب عليهم كل غضبي. ولكنهم جدوا مبكرين بارتكاب الفساد في كل عمل أقدموا عليه."], [8, "لذلك يقول الرب: انتظروني لأني عزمت في اليوم الذي أقوم فيه كشاهد أن أجمع الأمم وأحشد الممالك لأسكب عليهم سخطي واحتدام غضبي، لأن الأرض بكاملها ستؤكل بنار غيرة غيظي."]]}], "kwAr": "لأن الرب أشقاها", "noteAr": ""}, {"kw": "her children", "raw": "Jer_39:9, Jer_52:27-30", "note": "", "refs": [{"l": "Jer 39:9", "n": "", "vs": [[9, "وسبى نبوزرادان رئيس شرطة بابل بقية الشعب الذي بقي في المدينة، وكل من لجأ إليه."]]}, {"l": "Jer 52:27-30", "n": "", "vs": [[27, "فضربهم ملك بابل وقتلهم في ربلة في منطقة حماة. وهكذا سبي شعب يهوذا من أرضه."], [28, "وهذا هو إحصاء الشعب الذين سباهم نبوخذناصر في السنة السابعة: ثلاثة آلاف وثلاثة وعشرون من اليهود."], [29, "وسبى نبوخذناصر من أورشليم في السنة الثامنة عشرة لحكمه ثماني مئة واثنين وثلاثين شخصا."], [30, "وفي السنة الثالثة والعشرين لحكم نبوخذناصر سبى نبوزرادان رئيس الشرطة من اليهود سبع مئة وخمسة وأربعين شخصا، فكانت جملة المسبيين أربعة آلاف وست مئة شخص."]]}], "kwAr": "أولادها", "noteAr": ""}], "arS": [["أصبح", ["H1961"]], [" ", []], ["أعداؤها", ["H6862"]], [" ", []], ["سادة", ["H7218"]], ["، ونجح مضايقوها، ", []], ["لأن", ["H3588"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["أشقاها", ["H3013"]], [" ", []], ["بسبب", ["H5921"]], [" ", []], ["خطاياها", ["H6588"]], [" ", []], ["المتكاثرة", ["H7230"]], [". قد ", []], ["ذهب", ["H1980"]], [" ", []], ["أولادها", ["H5768"]], [" إلى ", []], ["السبي", ["H7628"]], [" ", []], ["أمام", ["H6440"]], [" ", []], ["العدو", ["H341"]], [".", []]]}, {"c": 1, "v": 6, "text": "تعرت بنت صهيون من كل بهائها، وغدا أشرافها كأيائل شاردة من غير مرعى. فروا بقوة خائرة أمام المطارد.", "groups": [{"kw": "from", "raw": "2Ki_19:21; Psa_48:2, Psa_48:3; Isa_1:21, Isa_4:5, Isa_12:6; Zep_3:14-17", "note": "", "refs": [{"l": "2Ki 19:21", "n": "", "vs": [[21, "وهذا هو رد الرب عليه: «ها العذراء ابنة صهيون قد احتقرتك واستهزأت بك، وهزت ابنة أورشليم رأسها سخرية منك."]]}, {"l": "Psa 48:2", "n": "", "vs": [[2, "جبل صهيون جميل في شموخه، (هو) فرح كل الأرض حتى أقاصي الشمال. هو مدينة الملك العظيم."]]}, {"l": "Psa 48:3", "n": "", "vs": [[3, "الله المقيم في قصورها معروف بأنه حصن منيع."]]}, {"l": "Isa 1:21", "n": "", "vs": [[21, "كيف صارت المدينة الأمينة عاهرة؟ كانت تفيض حقا، ويأوي إليها العدل، فأصبحت وكرا للمجرمين."]]}, {"l": "Isa 4:5", "n": "", "vs": [[5, "ثم يخلق الرب فوق جبل صهيون بكامله، وعلى محفلها، سحابة نهارا، ودخانا ووهج لهيب نار ليلا، فيكون على كل أرض مجيدة غطاء."]]}, {"l": "Isa 12:6", "n": "", "vs": [[6, "اهتفوا وتغنوا ياأهل صهيون، لأن قدوس إسرائيل عظيم بينكم»."]]}, {"l": "Zep 3:14-17", "n": "", "vs": [[14, "اشدي ياابنة صهيون واهتف ياإسرائيل، ابتهجي وتهللي ياابنة أورشليم."], [15, "لأن الرب قد رفع عنك حكم قضائه ورد عنك أعداءك. إن الرب ملك إسرائيل هو في وسطك، فلا تخشي شرا في ما بعد."], [16, "ويقال في ذلك اليوم لأورشليم: لا تخافي ياصهيون، ولا ترتخ يداك."], [17, "فالرب إلهك في وسطك، جبار يخلص. يسر فرحا بك، ويجدد بمحبته حياتك، ويبتهج بك مترنما."]]}], "kwAr": "تعرت", "noteAr": ""}, {"kw": "all", "raw": "Lam_2:1-7; 2Sa_4:11, 2Sa_4:12; Psa_50:2, Psa_96:9, Psa_132:12, Psa_132:13; Jer_52:8, Jer_52:11, Jer_52:13; Eze_7:20-22, Eze_11:22, Eze_11:23, Eze_24:21, Eze_24:25", "note": "", "refs": [{"l": "Lam 2:1-7", "n": "", "vs": [[1, "كيف خيم الرب في غضبه بالظلام على ابنة صهيون، وطرح من السماء إلى الأرض جلال إسرائيل، ولم يذكر موطيء قدميه في يوم سخطه؟"], [2, "قد هدم الرب من غير رحمة جميع مساكن يعقوب. قوض بغضبه معاقل ابنة يهوذا، وألحق العار بالمملكة وحكامها، إذ سواها بالأرض."], [3, "بتر في احتدام غضبه كل قوة إسرائيل. رد يمينه إلى الوراء أمام الأعداء، واشتعل مثل نار ملتهبة في إسرائيل، تلتهم كل ما حولها."], [4, "وتر قوسه كعدو. نصب يمينه كمبغض. ذبح كعدو كل عزيز في عيوننا. وسكب سخطه كنار على خيمة ابنة صهيون."], [5, "وأصبح الرب كعدو، فقوض إسرائيل، وهدم جميع قصورها، ودمر حصونها، وأكثر النوح والعويل في ابنة صهيون."], [6, "نقض مظلته كما ينقض كوخ من الأغصان في حديقة، وردم مقر مجتمعه. جعل الرب صهيون تنسى مواسم أعيادها وسبوتها. ونبذ باحتدام سخطه الملك والكاهن."], [7, "كره الرب مذبحه، وتبرأ من مقدسه، وسلم أسوار قصورها إلى يد الأعداء الذين علا هتافهم في بيت الرب كما كان يعلو هتافنا في الأعياد."]]}, {"l": "2Sa 4:11", "n": "", "vs": [[11, "فماذا أفعل بالأحرى برجلين باغيين يقتلان رجلا بريئا في بيته وعلى سريره؟ ألا أطالب الآن بدمه من أيديكما وأستأصلكما من الأرض؟»"]]}, {"l": "2Sa 4:12", "n": "", "vs": [[12, "وأمر داود رجاله فقتلوهما وقطعوا أيديهما وأرجلهما، وعلقوا جثتيهما على البركة في حبرون. وأما رأس إيشبوشث فأخذوه وواروه في قبر أبنير في حبرون."]]}, {"l": "Psa 50:2", "n": "", "vs": [[2, "من صهيون الكاملة الجمال أشرق مجد الله."]]}, {"l": "Psa 96:9", "n": "", "vs": [[9, "اسجدوا للرب بزينة مقدسة، ارتعدوا أمامه ياجميع ساكني الأرض."]]}, {"l": "Psa 132:12", "n": "", "vs": [[12, "إذا حفظ بنوك عهدي وشهاداتي التي أعلمهم إياها، يجلس بنوهم أيضا على عرشك إلى الأبد."]]}, {"l": "Psa 132:13", "n": "", "vs": [[13, "لأن الرب قد اختار أورشليم ورغب أن تكون له مسكنا."]]}, {"l": "Jer 52:8", "n": "", "vs": [[8, "لكن جيش الكلدانيين تعقب الملك، وأدرك صدقيا في سهول أريحا وقد تفرق عنه جميع جيشه،"]]}, {"l": "Jer 52:11", "n": "", "vs": [[11, "وفقأ عيني صدقيا وأوثقه بسلسلتين من نحاس، ثم ساقه إلى بابل حيث زجه في السجن إلى يوم وفاته."]]}, {"l": "Jer 52:13", "n": "", "vs": [[13, "وأحرق هيكل الرب وقصر الملك وجميع بيوت أورشليم، وأضرم النار في كل بيت من بيوت العظماء،"]]}, {"l": "Eze 7:20-22", "n": "", "vs": [[20, "حولوا جمال زينة هيكل الرب إلى زهو، وصنعوا من الذهب والفضة تماثيل أرجاسهم وأصنامهم المكروهة، لذلك جعلتها رجاسة لهم."], [21, "أسلمها إلى أيدي الغرباء نهبا، ولأشرار الأرض سلبا فينجسونها."], [22, "وأشيح بوجهي عنهم فيدنسون هيكلي، ويدخل إليه الناهبون وينجسونه."]]}, {"l": "Eze 11:22", "n": "", "vs": [[22, "ثم فرد الكروبيم أجنحتهم وحلقوا مع العجلات ومع مجد الرب الذي ما برح مخيما عليهم من فوق."]]}, {"l": "Eze 11:23", "n": "", "vs": [[23, "وارتفع مجد الرب عن وسط المدينة ووقف على الجبل شرقي المدينة."]]}, {"l": "Eze 24:21", "n": "", "vs": [[21, "أبلغ شعب إسرائيل: ها أنا مزمع على تنجيس مقدسي فخر عزكم ومشتهى أعينكم، وبهجة نفوسكم، فيتهاوى أبناؤكم وبناتكم الذين خلفتهم وراءكم صرعى بالسيف."]]}, {"l": "Eze 24:25", "n": "", "vs": [[25, "أما أنت ياابن آدم، ففي اليوم الذي أحرمهم فيه من عزهم وبهجة فخرهم، ومشتهى عيونهم، ولذة قلوبهم (أي أبنائهم وبناتهم)،"]]}], "kwAr": "كل بهائها", "noteAr": ""}, {"kw": "her princes", "raw": "Lev_26:36, Lev_26:37; Deu_28:25, Deu_32:30; Jos_7:12, Jos_7:13; Psa_44:9-11; Jer_29:4; Jer_48:41, Jer_51:30-32, Jer_52:7", "note": "", "refs": [{"l": "Lev 26:36", "n": "", "vs": [[36, "أما الباقون منكم في أرض أعدائكم، فإني ألقي الرعب في قلوبهم فيهربون من حفيف ورقة تسوقها الريح، وكأنهم يهربون من السيف، ويسقطون وليس ثمة من طارد لهم."]]}, {"l": "Lev 26:37", "n": "", "vs": [[37, "ويعثر بعضهم ببعض كمن يفر من أمام سيف من غير طارد لهم، ولا تثبتون أمام أعدائكم"]]}, {"l": "Deu 28:25", "n": "", "vs": [[25, "ويهزمكم الرب أمام أعدائكم فتقبلون عليهم في طريق واحدة وتولون الأدبار أمامهم متفرقين في سبع طرق، وتصبحون عبرة لجميع ممالك الأرض."]]}, {"l": "Deu 32:30", "n": "", "vs": [[30, "إذ كيف يدحر واحد ألفا، ويهزم اثنان من أعدائهم عشرة آلاف منهم، لولا أن صخرهم قد هجرهم والرب قد سلمهم؟"]]}, {"l": "Jos 7:12", "n": "", "vs": [[12, "لهذا عجز بنو إسرائيل عن الثبات أمام أعدائهم، فولوا أمامهم الأدبار، لأنهم هالكون إذ لن أعود أكون معكم ما لم تستأصلوا الحرام من وسطكم،"]]}, {"l": "Jos 7:13", "n": "", "vs": [[13, "قم، واطلب من الشعب أن يتقدسوا ليوم غد، لأنه هكذا قال الرب إله إسرائيل: في وسطك حرام ياإسرائيل، ولن تتمكنوا من هزيمة أعدائكم حتى تستأصلوا الحرام من بينكم."]]}, {"l": "Psa 44:9-11", "n": "", "vs": [[9, "غير أنك قد رذلتنا وأخجلتنا، ولم تعد ترافق جنودنا إلى الحرب."], [10, "جعلتنا نتقهقر أمام عدونا. أما مبغضونا فيغنمون لأنفسهم."], [11, "أسلمتنا كغنم معدة للذبح، وبددتنا بين الأمم."]]}, {"l": "Jer 29:4", "n": "", "vs": [[4, "هذا ما يعلنه الرب القدير إله إسرائيل لكل المسبيين الذين أجليتهم من أورشليم إلى بابل."]]}, {"l": "Jer 48:41", "n": "", "vs": [[41, "فيستولي على المدن، وتسقط الحصون، وتصبح في ذلك اليوم قلوب محاربي موآب كقلب امرأة في مخاضها."]]}, {"l": "Jer 51:30-32", "n": "", "vs": [[30, "قد أحجم محاربو بابل الجبابرة عن القتال، واعتصموا في معاقلهم. خارت شجاعتهم، وصاروا كالنساء. احترقت مساكن بابل وتحطمت مزاليجها."], [31, "يركض عداء لملاقاة عداء آخر. ويسرع مخبر للقاء مخبر ليبلغ ملك بابل أن مدينته قد تم الاستيلاء عليها من كل جانب."], [32, "قد سقطت المعابر وأحرقت أجمات القصب بالنار واعترى الذعر المحاربين،"]]}, {"l": "Jer 52:7", "n": "", "vs": [[7, "ففتح الشعب ثغرة في المدينة وهرب جميع المحاربين وغادروا المدينة ليلا من طريق البوابة الواقعة بين السورين القريبين من بستان الملك، والكلدانيون ما برحوا محاصرين المدينة من كل جهة، وانطلقوا في طريق البرية."]]}], "kwAr": "أشرافها", "noteAr": ""}, {"kw": "harts", "raw": "Jer_14:5, Jer_14:6, Jer_47:3", "note": "", "refs": [{"l": "Jer 14:5", "n": "", "vs": [[5, "حتى الإيل في الصحراء قد هجرت وليدها لتعذر وجود الكَلإ."]]}, {"l": "Jer 14:6", "n": "", "vs": [[6, "وقفت الفراء على الروابي وتنسمت الريح كبنات آوى فكلت عيونها لعدم وجود العشب»."]]}, {"l": "Jer 47:3", "n": "", "vs": [[3, "من صوت وقع حوافر خيله، ومن جلبة مركباته، ومن صرير عجلاتها، فلا يلتفت الآباء إلى الأبناء من فرط ما يعتريهم من وهن."]]}], "kwAr": "أيائل شاردة", "noteAr": ""}], "arS": [["تعرت", ["H3318"]], [" ", []], ["بنت", ["H1323"]], [" ", []], ["صهيون", ["H6726"]], [" ", []], ["من", ["H4480"]], [" ", []], ["كل", ["H3605"]], [" ", []], ["بهائها", ["H1926"]], ["، وغدا ", []], ["أشرافها", ["H8269"]], [" كأيائل شاردة من ", []], ["غير", ["H3808"]], [" ", []], ["مرعى", ["H4829"]], [". ", []], ["فروا", ["H1980"]], [" ", []], ["بقوة", ["H3581"]], [" خائرة ", []], ["أمام", ["H6440"]], [" ", []], ["المطارد", ["H7291"]], [".", []]]}, {"c": 1, "v": 7, "text": "تذكرت أورشليم في أيام شقائها ومحنتها جميع ما كانت تتمتع به من مشتهيات في حقبها الغابرة. عندما وقع شعبها في قبضة العدو لم يكن لها مسعف، رآها العدو صريعة وسخر لهلاكها.", "groups": [{"kw": "remembered", "raw": "Job 29:2-25, Job_30:1; Psa_42:4, Psa_77:3, Psa_77:5-9; Hos_2:7; Luk_15:17, Luk_16:25", "note": "", "refs": [{"l": "Job 29:2-25", "n": "", "vs": [[2, "«ياليتني مازلت كما كنت في الشهور الغابرة، في الأيام التي حفظني فيها الله ،"], [3, "حين كان مصباحه يضيء فوق رأسي، فأسلك عبر الظلمة في نوره."], [4, "يوم كنت في ريعان قوتي ورضى الله مخيما فوق بيتي."], [5, "وا لقدير ما برح معي، وأولادي مازالوا حولي."], [6, "حين كنت أغسل خطواتي باللبن، والصخر يفيض لي أنهارا من الزيت."], [7, "حين كنت أخرج إلى بوابة المدينة، وأحتل في الساحة مجلسي،"], [8, "فيراني الشبان ويتوارون، ويقف الشيوخ احتراما لي."], [9, "يمتنع العظماء عن الكلام ويضعون أيديهم على أفواههم."], [10, "يتلاشى صوت النبلاء، وتلتصق ألسنتهم بأحناكهم."], [11, "إذا سمعت لي الأذن تطوبني، وإذا شهدتني العين تثني علي،"], [12, "لأ ني أنقذت البائس المستغيث، وأجرت اليتيم طالب العون،"], [13, "فحلت علي بركة المشرف على الموت، وجعلت قلب الأرملة يتهلل فرحا."], [14, "ارتديت البر فكساني، وكجبة وعمامة كان عدلي."], [15, "كنت عيونا للأعمى، وأقداما للأعرج،"], [16, "وكنت أبا للمسكين، أتقصى دعوى من لم أعرفه."], [17, "هشمت أنياب الظالم ومن بين أسنانه نزعت الفريسة،"], [18, "ثم حدثت نفسي: إني سأموت في خيمتي وتتكاثر أيامي كحبات الرمل."], [19, "ستمتد أصولي إلى المياه، والطل يبيت على أغصاني."], [20, "يتجدد مجدي دائما، وقوسي أبدا جديدة في يدي."], [21, "يستمع الناس لي وينتظرون، ويصمتون منصتين لمشورتي."], [22, "بعد كلامي لا يثنون على أقوالي، وحديثي يقطر عليهم كالندى."], [23, "يترقبونني كالغيث، ويفتحون أفواههم كمن ينهل من مطر الربيع"], [24, "إن ابتسمت لهم لا يصدقون، ونور وجهي لم يطرحوه عنهم بعيدا."], [25, "أختار لهم طريقهم وأتصدر مجلسهم، وأكون بينهم كملك بين جيوشه، وكا لمعزي بين النائحين."]]}, {"l": "Job 30:1", "n": "", "vs": [[1, "أما الآن فقد هزأ بي من هم أصغر مني سنا، ممن كنت آنف أن أجعل آباءهم مع كلاب غنمي."]]}, {"l": "Psa 42:4", "n": "", "vs": [[4, "حين أتأمل في نفسي تعاودني هذه الذكرى: كيف كنت أرافق حشود العابدين المحتفلين بالعيد وأقودهم في الحضور إلى بيت الله، هاتفا معهم فرحا وحمدا."]]}, {"l": "Psa 77:3", "n": "", "vs": [[3, "أذكر الرب فأتنهد، أناجي نفسي فيغشى على روحي."]]}, {"l": "Psa 77:5-9", "n": "", "vs": [[5, "فكرت في الأيام القديمة وفي السنين السحيقة."], [6, "في الليل أتذكر ترنيمي، وأناجي قلبي، وتجد في البحث نفسي."], [7, "هل إلى الأبد يرفضنا الرب ولا يرضى عنا أبدا؟"], [8, "هل انتهت رحمته إلى الأبد؟ هل انقطعت عنا مواعيده؟"], [9, "ألعل الله نسي رأفته؟ أم حبس بغضب مراحمه؟"]]}, {"l": "Hos 2:7", "n": "", "vs": [[7, "فتسعى وراء عشاقها ولكنها لا تدركهم، وتلتمسهم فلا تجدهم، ثم تقول، لأنطلقن وأرجعن إلى زوجي الأول، فقد كنت معه في حال خير مما أنا عليه الآن."]]}, {"l": "Luk 15:17", "n": "", "vs": [[17, "ثم رجع إلى نفسه، وقال: ما أكثر خدام أبي المأجورين الذين يفضل عنهم الخبز، وأنا هنا أكاد أهلك جوعا!"]]}, {"l": "Luk 16:25", "n": "", "vs": [[25, "ولكن إبراهيم قال: يابني، تذكر أنك نلت خيراتك كاملة في أثناء حياتك، ولعازر نال البلايا. ولكنه الآن يتعزى هنا، وأنت هناك تتعذب."]]}], "kwAr": "تذكرت", "noteAr": ""}, {"kw": "all her", "raw": "Deu_4:7, Deu_4:8, Deu_4:34-37, Deu_8:7-9; Psa_147:19, Psa_147:20; Isa_5:1-4", "note": "", "refs": [{"l": "Deu 4:7", "n": "", "vs": [[7, "لأنه أي شعب، مهما عظم، له آلهة قريبة منه مثل الرب إلهنا في كل ما ندعوه؟"]]}, {"l": "Deu 4:8", "n": "", "vs": [[8, "وأي شعب، مهما عظم، لديه شرائع وأحكام عادلة نظير هذه الشرائع التي أضعها اليوم أمامكم؟"]]}, {"l": "Deu 4:34-37", "n": "", "vs": [[34, "وهل حاول إله قط أن يأخذ لنفسه شعبا من وسط شعب آخر مجريا تجارب وآيات ومعجزات وحروبا وقدرة فائقة وقوة شديدة ومخاوف عظيمة كما صنع معكم الرب إلهكم في مصر على مرأى منكم؟"], [35, "لقد اطلعتم على هذه كلها لتعلموا أن الرب هو الإله، وليس آخر سواه."], [36, "فقد أسمعكم صوته من السماء لينذركم. وأراكم ناره العظيمة على الأرض، وسمعتم صوته من وسط النار."], [37, "ولأنه قد أحب آباءكم، واختار ذريتهم من بعدهم، أخرجكم بنفسه وبقدرته العظيمة من ديار مصر،"]]}, {"l": "Deu 8:7-9", "n": "", "vs": [[7, "لأن الرب إلهكم آت بكم إلى أرض خصيبة، تكثر فيها الأنهار والآبار، وعيون ماء تتدفق في الوديان والجبال."], [8, "إلى أرض حنطة وشعير وكروم وتين ورمان وزيتون وعسل."], [9, "إلى أرض لا تأكلون بالذل خبزكم ولا يعوزكم فيها شيء. هي أرض يتوافر في حجارتها الحديد، ومن جبالها تستخرجون النحاس."]]}, {"l": "Psa 147:19", "n": "", "vs": [[19, "يعلن ليعقوب كلمته ولإسرائيل فرائضه وأحكامه."]]}, {"l": "Psa 147:20", "n": "", "vs": [[20, "لم يعامل أمة أخرى هكذا، ولم يعرفها أحكامه هللويا."]]}, {"l": "Isa 5:1-4", "n": "", "vs": [[1, "سأشدو لحبيبي أغنية عن كرمه: كان لحبيبي كرم على تل خصيب،"], [2, "حرث أرضه ونقاه من الحجارة، وغرس فيه أفضل كرمة، وشيد في وسطه برجا، ونقر في الصخر معصرة. ثم انتظر أن يثمر له عنبا فأنتج له حصرما!"], [3, "والآن ياأهل أورشليم ورجال يهوذا، احكموا بيني وبين كرمي."], [4, "أي شيء يمكن أن يصنع لكرمي لم أصنعه؟ وعندما انتظرت منه أن يثمر لي عنبا، لماذا أنتج حصرما؟"]]}], "kwAr": "جميع ما كانت تتمتع به", "noteAr": ""}, {"kw": "pleasant", "raw": "or, desirable, Lam_1:10", "note": "or, desirable, Lam_1:10", "refs": [{"l": "Lam 1:10", "n": "", "vs": [[10, "امتدت يد العدو إلى كل ذخائرها، وأبصرت الأمم ينتهكون حرمة مقادسها. هؤلاء الذين حظرت عليهم أن يدخلوا في جماعتك."]]}], "kwAr": "مشتهيات", "noteAr": "أو: مشتهيات. انظر مرا 1: 10"}, {"kw": "the adversaries", "raw": "Lam_2:15, Lam_2:16; Psa_79:4, Psa_137:3, Psa_137:4; Mic_4:11", "note": "", "refs": [{"l": "Lam 2:15", "n": "", "vs": [[15, "كل عابري السبيل صفقوا عليك بالأيادي فرحا. صفروا وهزوا رؤوسهم على ابنة أورشليم وتساءلوا: أهذه هي المدينة التي تدعى كاملة الجمال وبهجة الأرض بأسرها؟"]]}, {"l": "Lam 2:16", "n": "", "vs": [[16, "قد فغر جميع أعدائك أشداقهم. يصفرون ويحرقون الأسنان. يهتفون: قد ابتلعناها. هذا هو اليوم الذي طال انتظارنا له. قد عشنا وشهدناه!"]]}, {"l": "Psa 79:4", "n": "", "vs": [[4, "قد صرنا عارا عند جيراننا، ومثار هزء وأضحوكة لمن حولنا."]]}, {"l": "Psa 137:3", "n": "", "vs": [[3, "هناك طلب منا الذين سبونا أن نشدو بترنيمة، والذين عذبونا أن نطربهم قائلين: «أنشدوا لنا من ترانيم صهيون»."]]}, {"l": "Psa 137:4", "n": "", "vs": [[4, "كيف نشدو بترنيمة الرب في أرض غريبة؟"]]}, {"l": "Mic 4:11", "n": "", "vs": [[11, "والآن ها أمم غفيرة قد اجتمعت عليك قائلة «لتتدنس أورشليم حتى تتفرس عيوننا في خرابها»."]]}], "kwAr": "رآها العدو", "noteAr": ""}], "arS": [["تذكرت", ["H2142"]], [" ", []], ["أورشليم", ["H3389"]], [" ", []], ["في", ["H3027"]], [" ", []], ["أيام", ["H3117"]], [" ", []], ["شقائها", ["H6040"]], [" ", []], ["ومحنتها", ["H4788"]], [" ", []], ["جميع", ["H3605"]], [" ", []], ["ما", ["H834"]], [" ", []], ["كانت", ["H1961"]], [" تتمتع به ", []], ["من", ["H4480"]], [" ", []], ["مشتهيات", ["H4262"]], [" في حقبها ", []], ["الغابرة", ["H6924"]], [". عندما ", []], ["وقع", ["H5307"]], [" ", []], ["شعبها", ["H5971"]], [" في قبضة ", []], ["العدو", ["H6862"]], [" ", []], ["لم", ["H369"]], [" يكن لها ", []], ["مسعف", ["H5826"]], ["، ", []], ["رآها", ["H7200"]], [" ", []], ["العدو", ["H6862"]], [" صريعة ", []], ["وسخر", ["H7832"]], [" ", []], ["لهلاكها", ["H4868"]], [".", []]]}, {"c": 1, "v": 8, "text": "ارتكبت أورشليم خطيئة نكراء فأصبحت رجسة. جميع مكرميها يحتقرونها لأنهم شهدوا عريها، أما هي فتنهدت وتراجعت القهقرى.", "groups": [{"kw": "hath", "raw": "Lam_1:5, Lam_1:20; 1Ki_8:46, 1Ki_8:47, 1Ki_9:7, 1Ki_9:9; Isa_59:2-13; Jer_6:28; Eze_14:13-21; Eze_22:2-15", "note": "", "refs": [{"l": "Lam 1:5", "n": "", "vs": [[5, "أصبح أعداؤها سادة، ونجح مضايقوها، لأن الرب أشقاها بسبب خطاياها المتكاثرة. قد ذهب أولادها إلى السبي أمام العدو."]]}, {"l": "Lam 1:20", "n": "", "vs": [[20, "انظر يارب فإني في ضيقة. أحشائي جائشة وقلبي متلاطم في داخلي، لأني أكثرت التمرد. ها السيف يثكل في الخارج وفي البيت يسود الموت."]]}, {"l": "1Ki 8:46", "n": "", "vs": [[46, "وإذا أخطأوا إليك، إذ ليس إنسان لا يأثم، وغضبت عليهم وأسلمتهم للعدو فسباهم آسروهم إلى ديار العدو، بعيدة أو قريبة."]]}, {"l": "1Ki 8:47", "n": "", "vs": [[47, "فإن تابوا في أرض سبيهم ورجعوا متضرعين إليك قائلين: قد أخطأنا وانحرفنا وأذنبنا،"]]}, {"l": "1Ki 9:7", "n": "", "vs": [[7, "فإني أبيد إسرائيل عن وجه الأرض التي وهبتها لهم، وأنبذ الهيكل الذي قدسته لاسمي، فيصبح إسرائيل مثلا ومثار هزء لجميع الأمم."]]}, {"l": "1Ki 9:9", "n": "", "vs": [[9, "فيأتيهم الجواب: لأنهم تركوا الرب إلههم الذي أخرج آباءهم من ديار مصر، وتشبثوا بآلهة أخرى وسجدوا لها وعبدوها، لذلك جلب الرب عليهم كل هذا البلاء»."]]}, {"l": "Isa 59:2-13", "n": "", "vs": [[2, "إنما خطاياكم أضحت تفصل بينكم وبين إلهكم، وآثامكم حجبت وجهه عنكم، فلم يسمع،"], [3, "لأن أيديكم تلوثت بالدم وأصابعكم بالإثم، ونطقت شفاهكم بالكذب، ولهجت ألسنتكم بالشر."], [4, "ليس بينكم من يطالب بالعدل، أو يحكم بالحق. يتكلون على الباطل ويتفوهون بالزور، يحبلون بالغش، ويلدون بالإثم."], [5, "يفقسون بيض أفعى، وينسجون خيوط العنكبوت. من يأكل من بيضهم يموت، ومن البيضة المكسورة تخرج حية."], [6, "لا تصلح خيوطهم لنسيج الثياب، ولا يكتسون بأعمالهم، لأن أعمالهم هي أعمال إثم، وأفعال الظلم قد ارتكبتها أيديهم."], [7, "تسرع أرجلهم لاقتراف الشر، ويهرولون لسفك دم البريء، أفكارهم أفكار أثيمة، وفي طرقهم دمار وخراب"], [8, "لم يعرفوا سبيل السلام، ولا عدل في مسالكهم. عوجوا طرقهم، والسالك فيها لا يعرف سلاما."], [9, "الحق ابتعد عنا، ولم يدركنا العدل. نرتقب نورا، فيحدق بنا الظلام، وننشد ضوءا فنسلك في العتمة."], [10, "نتحسس الحائط كالأعمى، ونتلمس كالمكفوف، نتعثر في الظهيرة كما لو كنا نسير في عتمة الليل ونكون كالأموات بين المتدفقين بالحياة"], [11, "كلنا نزمجر كالدببة، وننوح كالحمام. نبحث عن العدل فلا نجده، وعن الخلاص وإذا به قد ابتعد عنا،"], [12, "لأن معاصينا كثرت أمامك، وآثامنا تشهد علينا. فمعاصينا معنا، وذنوبنا نعرفها."], [13, "تمردنا وتنكرنا للرب. ارتددنا عن اتباع طرق إلهنا، تفوهنا بالظلم والعصيان افتراء، وبكلام زور من القلب."]]}, {"l": "Jer 6:28", "n": "", "vs": [[28, "فكلهم عصاة متمردون ساعون في النميمة. هم نحاس وحديد وكلهم فاسدون."]]}, {"l": "Eze 14:13-21", "n": "", "vs": [[13, "«ياابن آدم، إذا أخطأت إلي أرض وخانت عهدي، أعاقبها وأعوزها مؤونة الخبز وأشيع فيها الجوع، وأفني منها الناس والبهائم،"], [14, "وحتى لو كان فيها هؤلاء الرجال الثلاثة: نوح ودانيآل وأيوب، فإنهم يخلصون وحدهم فقط ببرهم."], [15, "وإن أطلقت في تلك الأرض وحوشا ضارية فأقفرتها، وأصبحت أطلالا لا يجتاز فيها عابر خوفا من الوحوش،"], [16, "وكان يقيم فيها هؤلاء الثلاثة الرجال، فحي أنا يقول السيد الرب، إنهم لا يقدرون على إنقاذ أبناء لها وبنات. إنما هم وحدهم يخلصون، وتصير الأرض موحشة."], [17, "وإذا جلبت سيفا على تلك الأرض وقلت: ياسيف اعبر في الأرض وافنها وأبدت منها الناس والبهائم،"], [18, "وكان يقيم فيها هؤلاء الثلاثة الرجال، فحي أنا يقول الرب، إنهم لا يقدرون على إنقاذ أبناء لها وبنات، إنما هم وحدهم يخلصون."], [19, "إذا أفشيت وبأ في تلك الأرض، وسكبت عليها غضبي بسفك الدم لأفني منها الناس والبهائم،"], [20, "وكان يقيم فيها هؤلاء الثلاثة الرجال، فحي أنا يقول الرب إنهم لا يقدرون على إنقاذ ابن لها أو ابنة، إنما يخلصون وحدهم فقط ببرهم."], [21, "فكم بالأحرى يحدث إذا أرسلت أحكامي الأربعة الشديدة: الحرب والمجاعة والوحوش الضارية والوباء على أورشليم لأبيد منها الناس والبهائم."]]}, {"l": "Eze 22:2-15", "n": "", "vs": [[2, "«وأنت ياابن آدم، أتدين المدينة السافكة الدماء؟ إذا عرفها بكل رجاساتها،"], [3, "وقل: هذا ما يعلنه السيد الرب: أيتها المدينة التي تسفك الدماء في وسطها لتستجلب العقاب على نفسها، التي تصنع لنفسها أصناما تتنجس بها."], [4, "قد أثمت بما سفكت من دماء، وتنجست بما عملت من أصنامك. قد قربت يوم دينونتك، وبلغت منتهى أيامك، لذلك جعلتك عارا عند الأمم ومثار سخرية لجميع البلدان."], [5, "تسخر منك البلدان القريبة والنائية على حد سواء، أنت يانجسة، ياكثيرة الشغب."], [6, "هوذا كل واحد من رؤساء إسرائيل ممن كانوا فيك انهمك في سفك الدماء على قدر طاقته."], [7, "فيك استخفوا بأب وأم وجاروا في وسطك على الغريب، واضطهدوا اليتيم والأرملة،"], [8, "احتقرت مقدساتي ونجست أيام
