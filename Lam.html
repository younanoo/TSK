"تجعلنا مثلا بين الأمم وأضحوكة بين الشعوب."]]}, {"l": "Psa 44:15", "n": "", "vs": [[15, "اليوم كله خجلي ماثل أمامي، وخزي وجهي قد غمرني"]]}, {"l": "Isa 37:22", "n": "", "vs": [[22, "وهذا هو رد الرب عليه: ها العذراء ابنة صهيون قد احتقرتك واستهزأت بك، وهزت ابنة أورشليم رأسها سخرية منك."]]}, {"l": "Jer 18:16", "n": "", "vs": [[16, "فتصبح أرضه خرابا، مثار صفير دهشة، وكل من يعبر بها يعتريه رعب ويهز رأسه."]]}, {"l": "Mat 27:39", "n": "", "vs": [[39, "وكان المارة يشتمونه، وهم يهزون رؤوسهم"]]}, {"l": "Mar 15:29", "n": "", "vs": [[29, "وكان المارة يشتمونه، وهم يهزون رؤوسهم قائلين: «هه! ياهادم الهيكل وبانيه في ثلاثة أيام،"]]}], "kwAr": "هزوا رؤوسهم", "noteAr": ""}, {"kw": "Is this", "raw": "Lam_2:6; Psa_48:2, Psa_50:2; Isa_64:11", "note": "", "refs": [{"l": "Lam 2:6", "n": "", "vs": [[6, "نقض مظلته كما ينقض كوخ من الأغصان في حديقة، وردم مقر مجتمعه. جعل الرب صهيون تنسى مواسم أعيادها وسبوتها. ونبذ باحتدام سخطه الملك والكاهن."]]}, {"l": "Psa 48:2", "n": "", "vs": [[2, "جبل صهيون جميل في شموخه، (هو) فرح كل الأرض حتى أقاصي الشمال. هو مدينة الملك العظيم."]]}, {"l": "Psa 50:2", "n": "", "vs": [[2, "من صهيون الكاملة الجمال أشرق مجد الله."]]}, {"l": "Isa 64:11", "n": "", "vs": [[11, "واحترق بالنار هيكلنا المقدس البهي، الذي شدا آباؤنا فيه بتسبيحك، وصار كل ما هو أثير لدينا خرابا."]]}], "kwAr": "أهذه هي المدينة", "noteAr": ""}], "arS": [["كل", ["H3605"]], [" ", []], ["عابري", ["H5674"]], [" ", []], ["السبيل", ["H1870"]], [" ", []], ["صفقوا", ["H5606"]], [" ", []], ["عليك", ["H5921"]], [" ", []], ["بالأيادي", ["H3709"]], [" فرحا. ", []], ["صفروا", ["H8319"]], [" ", []], ["وهزوا", ["H5128"]], [" ", []], ["رؤوسهم", ["H7218"]], [" ", []], ["على", ["H5921"]], [" ", []], ["ابنة", ["H1323"]], [" ", []], ["أورشليم", ["H3389"]], [" ", []], ["وتساءلوا", ["H559"]], [": ", []], ["أهذه", ["H2063"]], [" هي ", []], ["المدينة", ["H5892"]], [" التي تدعى ", []], ["كاملة", ["H3632"]], [" ", []], ["الجمال", ["H3308"]], [" ", []], ["وبهجة", ["H4885"]], [" ", []], ["الأرض", ["H776"]], [" بأسرها؟", []]]}, {"c": 2, "v": 16, "text": "قد فغر جميع أعدائك أشداقهم. يصفرون ويحرقون الأسنان. يهتفون: قد ابتلعناها. هذا هو اليوم الذي طال انتظارنا له. قد عشنا وشهدناه!", "groups": [{"kw": "thine", "raw": "Lam_3:46; Job_16:9, Job_16:10; Psa_22:13, Psa_35:21, Psa_109:2", "note": "", "refs": [{"l": "Lam 3:46", "n": "", "vs": [[46, "فغر علينا جميع أعدائنا أشداقهم،"]]}, {"l": "Job 16:9", "n": "", "vs": [[9, "مزقني غضبه، واضطهدني. حرق علي أسنانه. طعنني عدوي بنظراته الحادة."]]}, {"l": "Job 16:10", "n": "", "vs": [[10, "فغر الناس أفواههم علي، لطموني تعييرا على خدي، وتضافروا علي جميعا."]]}, {"l": "Psa 22:13", "n": "", "vs": [[13, "فغروا علي أشداقهم كأنهم أسود مفترسة مزمجرة."]]}, {"l": "Psa 35:21", "n": "", "vs": [[21, "فغروا علي أفواههم على وسعها، وقالوا: «هه! هه! قد رأينا بأعيننا (ما فعلت)»"]]}, {"l": "Psa 109:2", "n": "", "vs": [[2, "فقد فغر أشرار مخادعون أفواههم ضدي، وتقولوا علي بالكذب،"]]}], "kwAr": "جميع أعدائك", "noteAr": ""}, {"kw": "gnash", "raw": "Psa_35:16, Psa_37:12, Psa_112:10; Act_7:54", "note": "", "refs": [{"l": "Psa 35:16", "n": "", "vs": [[16, "كفجار ماجنين مجتمعين حول وليمة حرقوا علي أسنانهم."]]}, {"l": "Psa 37:12", "n": "", "vs": [[12, "يكيد الشرير كثيرا للصديق ويصر عليه بأسنانه."]]}, {"l": "Psa 112:10", "n": "", "vs": [[10, "يرى الشرير ذلك فيغتاظ، يصر بأسنانه ويذوب إذ شهوة الشرير لا تتحقق."]]}, {"l": "Act 7:54", "n": "", "vs": [[54, "فلما سمع المجتمعون كلام استفانوس، ملأ الغيظ قلوبهم، وأخذوا يصرون بأسنانهم توعدا."]]}], "kwAr": "يحرقون الأسنان", "noteAr": ""}, {"kw": "We have swallowed", "raw": "Psa_56:2, Psa_57:3, Psa_124:3; Isa_49:19; Jer_50:7, Jer_50:17, Jer_51:34; Eze_25:3, Eze_25:6, Eze_25:15; Eze_36:3; Hos_8:8; Zep_2:8-10", "note": "", "refs": [{"l": "Psa 56:2", "n": "", "vs": [[2, "يتربص بي أعدائي طوال اليوم لاَبتلاعي، وما أكثر الذين يحاربونني بكبرياء المتجبرين."]]}, {"l": "Psa 57:3", "n": "", "vs": [[3, "فيرسل من السماوات ويخلصني، ويملأ بالخزي من يريد أن يفترسني. يرسل الله رحمته وحقه."]]}, {"l": "Psa 124:3", "n": "", "vs": [[3, "لابتلعونا ونحن أحياء، عندما احتدم غضبهم علينا،"]]}, {"l": "Isa 49:19", "n": "", "vs": [[19, "وتعج أرضك الخربة وديارك المتهدمة، ومناطقك المدمرة بالسكان حتى تضيق بهم، ويبتعد عنك مبتلعوك."]]}, {"l": "Jer 50:7", "n": "", "vs": [[7, "كل من وجدهم افترسهم، وقال أعداؤهم: لا ذنب علينا لأنهم هم الذين أخطأوا في حق الرب الذي هو ملاذهم الحق، ورجاء آبائهم."]]}, {"l": "Jer 50:17", "n": "", "vs": [[17, "إسرائيل قطيع غنم متشتت، طردته الأسود. كان ملك أشور أول من افترسه، ونبوخذناصر آخر من هشم عظامه."]]}, {"l": "Jer 51:34", "n": "", "vs": [[34, "«يقول المسبيون: قد افترسنا نبوخذناصر ملك بابل وسحقنا وجعلنا إناء فارغا. ابتلعنا كتنين، وملأ جوفه من أطايبنا، ثم لفظنا من فمه."]]}, {"l": "Eze 25:3", "n": "", "vs": [[3, "وقل لهم اسمعوا ما يعلنه السيد الرب من قضاء: لأنك شمت بمقدسي لأنه تدنس، وبأرض إسرائيل لأنها خربت وبشعب يهوذا لأنهم سيقوا إلى السبي،"]]}, {"l": "Eze 25:6", "n": "", "vs": [[6, "لأنك صفقت بكفيك طربا، وخبطت برجليك، وفرحت بكل ما فيك من لؤم لما حل بأرض إسرائيل."]]}, {"l": "Eze 25:15", "n": "", "vs": [[15, "وهذا أيضا ما يعلنه السيد الرب لأن الفلسطينيين قد أقدموا على الانتقام وأفرطوا فيه بكل لؤم قلوبهم، عامدين إلى الخراب بسبب عداوة أبدية،"]]}, {"l": "Eze 36:3", "n": "", "vs": [[3, "لذلك تنبأ وقل: لأنهم قد دمروكم واقتحموكم من كل جهة لتصبحوا ميراثا لسائر الأمم، وصرتم حديث كل شفة ومذمة الشعب،"]]}, {"l": "Hos 8:8", "n": "", "vs": [[8, "قد ابتلع إسرائيل، وأصبح بين الشعوب كإناء لا جدوى منه،"]]}, {"l": "Zep 2:8-10", "n": "", "vs": [[8, "قد سمعت تعيير موآب وتجاديف بني عمون، وكيف احتقروا شعبي وهددوا تخمهم."], [9, "لذلك، كما أنا حي، يقول الرب القدير إله إسرائيل، ليصبحن أهل موآب كسدوم، والعمونيون كعمورة، منبتا للقريص وحفرة للملح وخرابا إلى الأبد، وتنهبهم بقية شعبي ويمتلكهم الناجون من أمتي."], [10, "هذا ما يجنونه لقاء تشامخهم، لأنهم احتقروا وتباهوا على شعب الرب القدير."]]}], "kwAr": "قد ابتلعناها", "noteAr": ""}, {"kw": "we have seen", "raw": "Psa_35:21, Psa_41:8; Oba_1:12-16", "note": "", "refs": [{"l": "Psa 35:21", "n": "", "vs": [[21, "فغروا علي أفواههم على وسعها، وقالوا: «هه! هه! قد رأينا بأعيننا (ما فعلت)»"]]}, {"l": "Psa 41:8", "n": "", "vs": [[8, "قائلين: «قد اعتراه داء عضال، ولن يقوم من فراشه أبدا»."]]}, {"l": "Oba 1:12-16", "n": "", "vs": [[12, "ما كان يجب أن تشمت بيوم مصير أخيك، في يوم فاجعته، وما كان يجب أن تبتهج في يوم دمار شعب يهوذا أو تتباهى في يوم الضيق."], [13, "وما كان يجب أن تقتحم أبواب شعبي في يوم كارثته، أو تشمت لمصيبته في يوم نكبته، أو تنهب ثروته في يوم بليته،"], [14, "أو تقف عند مفترق الطرق لتقضي على الناجين من قومه وتسلم الباقين الأحياء منهم في يوم الضيق."], [15, "لأن يوم الرب قريب آت على كل الأمم، وكما فعلت، لابد أن يفعل بك أيضا، فيرتد عملك على رأسك."], [16, "فإنه كما شربت على جبل قدسي فإن جميع الأمم تشرب في كل حين. يشربون ويجرعون ويتلاشون كمن لم يكونوا."]]}], "kwAr": "قد عشنا وشهدناه", "noteAr": ""}], "arS": [["قد ", []], ["فغر", ["H6475"]], [" ", []], ["جميع", ["H3605"]], [" ", []], ["أعدائك", ["H341"]], [" ", []], ["أشداقهم", ["H6310"]], [". ", []], ["يصفرون", ["H8319"]], [" ", []], ["ويحرقون", ["H2786"]], [" ", []], ["الأسنان", ["H8127"]], [". ", []], ["يهتفون", ["H559"]], [": قد ", []], ["ابتلعناها", ["H1104"]], [". ", []], ["هذا", ["H2088"]], [" هو ", []], ["اليوم", ["H3117"]], [" الذي طال ", []], ["انتظارنا", ["H6960"]], [" له. قد ", []], ["عشنا", ["H4672"]], [" ", []], ["وشهدناه", ["H7200"]], ["!", []]]}, {"c": 2, "v": 17, "text": "نفذ الرب قضاءه، وحقق وعيده الذي حكم به منذ الحقب السالفة. هدم ولم يرأف، فأشمت بك الخصم، وعظم قوة عدوك.", "groups": [{"kw": "done", "raw": "Lam_2:8; Lev. 26:14-46; Deut. 28:15-68, Deu_29:18-23, Deu_31:16, Deu_31:17, Deu_32:15-27; Jer_18:11; Mic_2:3", "note": "", "refs": [{"l": "Lam 2:8", "n": "", "vs": [[8, "عزم الرب أن يقوض سور ابنة صهيون. مد خيط القياس ولم يرد يده عن سحقها، فاستبكى المترسة والسور فسقطا معا."]]}, {"l": "Lev 26:14-46", "n": "", "vs": [[14, "ولكن إن عصيتموني ولم تعملوا بكل هذه الوصايا،"], [15, "وإن تنكرتم لفرائضي وكرهتم أحكامي ولم تعملوا بكل وصاياي، بل نكثتم ميثاقي،"], [16, "فإني أبتليكم بالرعب المفاجيء وداء السل والحمى التي تفني العينين وتتلف النفس، وتزرعون على غير طائل، وينهب أعداؤكم زرعكم."], [17, "وأنقلب عليكم فتنهزمون أمام أعدائكم، ويتحكم بكم مبغضوكم وتهربون من غير طارد لكم."], [18, "وإن أمعنتم في عصيانكم أزيد من عقابكم سبع مرات وفقا لخطاياكم."], [19, "أذل غطرستكم، وأجعل سماءكم كالحديد لا تمطر وأرضكم كالنحاس لا تغل"], [20, "فيذهب جهدكم باطلا لأن أرضكم لن تعطي غلتها، وأشجار الأرض لن تعطي أثمارها."], [21, "وإن واظبتم على عصيانكم وأبيتم طاعتي، أضاعف عقابي لكم سبع مرات وفقا لخطاياكم."], [22, "وأطلق عليكم وحوش الصحراء فتفترس أولادكم وتهلك بهائمكم، وتنقص من عددكم، فتقفر طرقاتكم."], [23, "وإن لم تتعظوا، وتماديتم في عصيانكم،"], [24, "أنقلب عليكم وأزيد في بلائكم سبع مرات وفقا لخطاياكم."], [25, "أسلط عليكم سيف العدو. فينتقم منكم لنقضكم ميثاقي، فتلوذون بمدنكم حيث أرسل عليكم الوباء وتسلمون إلى يد العدو"], [26, "وحين أقطع عنكم مؤونة الدقيق، تخبز عشر نساء خبزكم في فرن واحد لقلة الدقيق، وتقسمون الخبز بالميزان فتأكلون ولا تشبعون."], [27, "وإن لم يجد هذا العقاب في تأديبكم، فتماديتم في عصيانكم،"], [28, "فإني أزيد في احتدام غضبي، من عدائي لكم وأضاعف عقابي سبع مرات أخرى وفقا لخطاياكم،"], [29, "فتأكلون لحم أبنائكم وبناتكم."], [30, "وأدك مذابح مرتفعاتكم، وأحطم أنصاب شموسكم وأكوم جثثكم فوق بقايا أصنامكم، وتنبذكم نفسي."], [31, "وأحول مدنكم إلى خرائب، وأجعل مقادسكم موحشة، ولا أبتهج برائحة تقدمات سروركم،"], [32, "وأجعل الأرض قفرا فيرتاع من وحشتها أعداؤكم الساكنون فيها"], [33, "وأشتتكم بين الشعوب، وأجرد عليكم سيفي، وألاحقكم، وأحول أرضكم إلى قفر ومدنكم إلى خرائب."], [34, "عندئذ تستوفي الأرض راحة سبوتها طوال سني وحشتها وأنتم مشتتون في ديار أعدائكم. حينئذ ترتاح الأرض وتستوفي سني سبوتها."], [35, "فتعوض في أيام وحشتها عن راحتها التي لم تنعم بها في سنوات سبوتكم عندما كنتم تقيمون عليها."], [36, "أما الباقون منكم في أرض أعدائكم، فإني ألقي الرعب في قلوبهم فيهربون من حفيف ورقة تسوقها الريح، وكأنهم يهربون من السيف، ويسقطون وليس ثمة من طارد لهم."], [37, "ويعثر بعضهم ببعض كمن يفر من أمام سيف من غير طارد لهم، ولا تثبتون أمام أعدائكم"], [38, "فتهلكون بين الشعوب، وتبتلعكم أرض أعدائكم."], [39, "أما بقيتكم فتفنى بذنوبها وذنوب آبائها في أرض أعدائكم كما فني آباؤهم من قبلهم."], [40, "ولكن إن اعترفوا بخطاياهم وخطايا آبائهم وبخيانتهم لي وعداوتهم،"], [41, "التي جعلتني أنقلب عليهم وأنفيهم إلى أرض أعدائهم، وإن خضعت قلوبهم النجسة بعد أن استوفوا عقاب خطاياهم،"], [42, "فإني أذكر ميثاقي مع يعقوب، وميثاقي مع إسحق، وميثاقي مع إبراهيم، وأذكر الأرض،"], [43, "التي أقفرت منهم، فاستوفت راحة سبوتها في أثناء نفيهم عنها، ويكونون آنئذ قد استوفوا عقاب خطاياهم لأنهم تنكروا لشرائعي وكرهوا فرائضي."], [44, "ولكن على الرغم من ذلك فإنني لم أنبذهم وهم في أرض أعدائهم، ولا كرهتهم حتى أبيدهم وأنقض ميثاقي معهم، لأني أنا الرب إلههم،"], [45, "بل أذكر ميثاقي مع آبائهم الأولين الذين أخرجتهم من ديار مصر على مشهد من الشعوب لأكون لهم إلها. أنا الرب»."], [46, "هذه هي الفرائض والأحكام والشرائع التي أقامها الرب بينه وبين بني إسرائيل في جبل سيناء على لسان موسى."]]}, {"l": "Deu 28:15-68", "n": "", "vs": [[15, "ولكن إن عصيتم صوت الرب إلهكم ولم تحرصوا على العمل بجميع وصاياه وفرائضه التي أنا آمركم اليوم بها، فإن جميع هذه اللعنات تحل بكم وتلازمكم."], [16, "تكونون ملعونين في المدينة وملعونين في الحقول."], [17, "وتكون سلالكم ومعاجنكم ملعونة."], [18, "وتحل اللعنة بأبنائكم وغلات أرضكم ونتاج بقركم ونعاجكم،"], [19, "وتكونون ملعونين في ذهابكم وإيابكم،"], [20, "ويصب الرب عليكم اللعنة والفوضى والفشل في كل ما تنتجه أيديكم، حتى تهلكوا وتفنوا سريعا لسوء أفعالكم، إذ تركتموني."], [21, "ويتفشى بينكم الوباء حتى يبيدكم عن الأرض التي أنتم ماضون إليها لامتلاكها،"], [22, "ويضربكم الرب بالسل والحمى والرعشة والالتهاب والجفاف واللفح والذبول، فتلازمكم حتى تفنوا."], [23, "وتصبح السماء التي فوقكم كالنحاس والأرض تحتكم كالحديد."], [24, "ويحول الرب مطر أرضكم إلى غبار وعواصف ترابية تنهمر عليكم من السماء حتى تهلكوا."], [25, "ويهزمكم الرب أمام أعدائكم فتقبلون عليهم في طريق واحدة وتولون الأدبار أمامهم متفرقين في سبع طرق، وتصبحون عبرة لجميع ممالك الأرض."], [26, "وتكون جثثكم طعاما لجميع طيور السماء ووحوش الأرض ولا يطردها أحد."], [27, "ويصيبكم الرب بداء قرحة مصر وبالبواسير والجرب والحكة، ولا تجدون لها علاجا."], [28, "ويبتليكم الرب بالجنون والعمى وارتباك الفكر،"], [29, "فتتحسسون طرقكم في الظهر كما يتحسس الأعمى طريقه في الظلام، وتبوء طرقكم بالإخفاق، ولا تكونون إلا مظلومين مغصوبين كل الأيام، وليس من منقذ."], [30, "يخطب أحدكم امرأة ولكن آخر يتزوجها ويضاجعها. تبني بيتا ولا تسكن فيه، وتغرس كرما ولا تجنيه."], [31, "يذبح ثورك أمام عينيك ولا تأكل منه، ويغتصب حمارك على مرأى منك ولا يرد إليك، ويستولي أعداؤك على ماشيتك وليس من منقذ."], [32, "يساق أولادك وبناتك إلى أمة أخرى وعيناك تراقبانهم طوال النهار، حتى تكلا، وما في يدك حيلة."], [33, "محصول أرضك وثمر تعبك يأكله شعب غريب عنك، ولا تكون سوى مظلوم مسحوق دائما."], [34, "ويصيبك الجنون من هول ما ترى."], [35, "ويبتليك الرب بقروح خبيثة تغطي الركبتين والساقين، حتى لا تجد لها شفاء من قمة الرأس إلى أخمص القدم."], [36, "ينفيكم الرب أنتم وملككم الذي تختارونه إلى أمة لا تعرفونها أنتم ولا آباؤكم، حيث تعبدون هناك آلهة أخرى من خشب وحجر،"], [37, "وتصبحون مثار دهشة وسخرية وعبرة في نظر جميع الشعوب التي ينفيكم الرب إليهم"], [38, "تبذرون كثيرا من البذار في الحقول، ولا تحصدون إلا القليل، لأن الجراد يلتهمه."], [39, "تكدحون في غرس كروم ومن خمرها لا تشربون، ومن ثمرها لا تجنون، لأن الدود ينخرها."], [40, "تكتظ أراضيكم بأشجار الزيتون، ولكن من زيتها لا تدهنون، لأن زيتونكم ينتثر على الأرض قبل نضجه."], [41, "تنجبون بنين وبنات ولا يكونون لكم، لأنهم يسبون."], [42, "تلتهم أسراب الجراد أشجاركم وغلات أرضكم."], [43, "يعظم شأن الغرباء المقيمين بينكم، ويتفاقم انحطاط شأنكم."], [44, "هم يقرضونكم وأنتم لا تقرضونهم، وهم يكونون رأسا وأنتم تكونون ذنبا،"], [45, "وتحل بكم هذه اللعنات وتلازمكم وتلاحقكم حتى تهلكوا، لأنكم لم تطيعوا صوت الرب إلهكم لتحفظوا وصاياه وفرائضه التي أمركم بها،"], [46, "فتكون فيكم وفي ذريتكم عبرة ونذيرا إلى الأبد."], [47, "ولأنكم لم تعبدوا الرب إلهكم بفرح وغبطة في زمن الازدهار والوفرة،"], [48, "فإنكم تصبحون عبيدا لأعدائكم الذين يرسلهم الرب عليكم في أحوال الجوع والعطش والعري والفاقة، ويضع نير حديد على أعناقكم حتى يهلككم."], [49, "ويجلب الرب عليكم من بعيد، من أقصى الأرض، أمة لا تفهمون لغتها، فتنقض عليكم كالنسر."], [50, "أمة يثير منظرها الرعب، لا تهاب الشيخ ولا ترأف بالطفل،"], [51, "فتستولي على نتاج بهائمكم، وتلتهم غلات أرضكم حتى تفنوا، ولا تبقي لكم قمحا ولا خمرا ولا زيتا ولا نتاج بقركم ونعاجكم حتى تهلككم."], [52, "وتحاصركم في جميع مدنكم حتى تتهدم أسواركم الشامخة الحصينة التي وثقتم بمناعتها في كل مدنكم. فتحاصركم في جميع مدنكم في كل أرضكم التي يهبها الرب إلهكم لكم."], [53, "فتأكلون في أثناء الحصار والضيقة التي يضايقكم بها عدوكم ثمار بطونكم، لحم أبنائكم وبناتكم الذين رزقكم بهم الرب إلهكم."], [54, "فيقسو قلب أكثركم رقة ورأفة على أخيه وامرأته التي في حضنه وسائر أبنائه الأحياء."], [55, "فلا يعطي أحدهم من لحم أبنائه، الذي يأكله، لأنه لم يبق لديه شيء سواه في الحصار والضيقة التي يضايقكم بها عدوكم في جميع مدنكم."], [56, "وكذلك فإن أكثر النساء رقة ورأفة، والتي لنعومتها وترفهها لا تجرؤ على لمس الأرض بباطن قدمها، تبخل على زوجها رجل حضنها وعلى ابنها وابنتها"], [57, "بمشيمتها الساقطة منها، وبأولادها الذين تلدهم، لأنها تنوي أن تأكلهم سرا في أثناء الحصار، في الضيقة التي يضايقكم بها عدوكم في كل مدنكم."], [58, "فإن لم تحرصوا على العمل بجميع كلمات هذه الشريعة المكتوبة في هذا الكتاب، لتهابوا اسم الرب إلهكم الجليل المرهوب،"], [59, "فإن الرب يجعل الضربات النازلة بكم وبذريتكم ضربات مخيفة وكوارث رهيبة دائمة وأمراضا خبيثة مزمنة،"], [60, "ويرسل عليكم كل أمراض مصر التي فزعتم منها فتلازمكم،"], [61, "ويسلط الرب عليكم أيضا كل داء وكل بلية لم ترد في كتاب الشريعة هذا، حتى تهلكوا."], [62, "فتصيرون قلة بعد أن كنتم في كثرة نجوم السماء، لأنكم لم تسمعوا صوت الرب إلهكم."], [63, "وكما سر الرب بكم فأحسن إليكم وكثركم، فإنه سيسر بأن يفنيكم ويهلككم فتنقرضون من الأرض التي أنتم ماضون إليها لامتلاكها."], [64, "ويشتتكم الرب بين جميع الأمم من أقصى الأرض إلى أقصاها، فتعبدون هناك آلهة أخرى من خشب أو حجر لم تعرفوها أنتم ولا آباؤكم،"], [65, "ولا تجدون بين تلك الأمم اطمئنانا ولا مقرا لقدم، بل يعطيكم الرب قلبا هلعا، وعيونا أوهنها الترقب، ونفوسا يائسة."], [66, "وتعيشون حياة مفعمة دائما بالتوتر، مليئة بالرعب ليلا ونهارا."], [67, "وتقولون في الصباح: يا ليته المساء، وفي المساء: يا ليته الصباح، من فرط ارتعاب قلوبكم وما تشهده عيونكم من هول."], [68, "ويردكم الرب إلى ديار مصر في سفن في طريق وعدكم ألا تعودوا ترونها، فتباعون هناك لأعدائكم عبيدا وإماء، وليس من يشتري»."]]}, {"l": "Deu 29:18-23", "n": "", "vs": [[18, "لئلا يكون بينكم رجل أو امرأة أو عشيرة أو سبط مال قلبه عن الرب إلهنا، فغوى ليعبد آلهة تلك الأمم. فاحرصوا ألا يكون بينكم من تأصل فيه الشر، فيحمل ثمرا علقما ساما."], [19, "فإن سمع كلام هذا القسم يستمطر بركة على نفسه قائلا: «سأكون آمنا حتى ولو أصررت على الاستمرار فى سلوك طريقي إن هذا يفضي إلى فناء الأخضر واليابس على حد سواء."], [20, "إن الرب لا يشاء الرفق بمثل هذا الإنسان، بل يحتدم غضبه وغيرته عليه، فتنزل به كل اللعنات المدونة في هذا الكتاب، ويمحو اسمه من تحت السماء."], [21, "ويفرزه الرب من بين أسباط إسرائيل ليهلكه بمقتضى جميع لعنات العهد المدونة في كتاب الشريعة هذا."], [22, "فيشاهد أبناؤكم من الأجيال القادمة، والغرباء الوافدون من أرض بعيدة بلايا تلك الأرض وما يصيبها الرب به من أمراض،"], [23, "إذ تصبح جميع الأرض كبريتا، محترقة لا زرع فيها ولا نبات ولا عشب، وكأنها انقلبت كما جرى لسدوم وعمورة وأدمة وصبوييم، التي قلبها الرب من جراء غضبه وسخطه."]]}, {"l": "Deu 31:16", "n": "", "vs": [[16, "وقال الرب لموسى: «ما إن تموت وتلحق بآبائك حتى يسرع هذا الشعب ويفجر وراء آلهة الغرباء المقيمين في الأرض التي هو داخل إليها في وسطهم، ويتخلى عني وينكث عهدي الذي أبرمته معه،"]]}, {"l": "Deu 31:17", "n": "", "vs": [[17, "فيحتدم غضبي عليه في ذلك اليوم، وأنبذه وأحجب وجهي عنه، فيكون فريسة. وتلحق به شرور كثيرة ومصائب، حتى يقول: أليس لأن إلهي قد هجرني، قد أصابتني هذه الشرور؟"]]}, {"l": "Deu 32:15-27", "n": "", "vs": [[15, "فسمن بنو إسرائيل ورفسوا، سمنوا وغلظوا واكتسوا شحما، فرفضوا الإله صانعهم وتنكروا لصخرة خلاصهم."], [16, "أثاروا غيرته بآلهتهم الغريبة، وأغاظوه بأصنامهم الرجسة."], [17, "قدموا محرقات لأوثان ليست هي الله، لآلهة غريبة لم يعرفوها بل ظهرت حديثا، آلهة لم يرهبها آباؤهم من قبل."], [18, "لقد نبذتم الصخر الذي أنجبكم، ونسيتم الله الذي أنشأكم."], [19, "فرأى الرب ذلك ورذلهم، إذ أثار أبناؤه وبناته غيظه."], [20, "وقال: سأحجب وجهي عنهم، فأرى ماذا يكون مصيرهم؟ إنهم جيل متقلب وأولاد خونة،"], [21, "هيجوا غيرتي بعبادة أوثانهم، وأسخطوني بأصنامهم الباطلة. لذلك سأثير غيرتهم بشعب متوحش، وأغيظهم بأمة حمقاء."], [22, "فها قد أضرم غضبي نارا تحرق حتى الهاوية السفلى، وتأكل الأرض وغلاتها، وتشعل أسس الجبال."], [23, "أكوم عليهم شرورا وأنفذ سهامي فيهم."], [24, "وحين يكونون خائرين من الجوع، منهوكين من الحمى والداء السام، أجعل أنياب الوحوش مع سم زواحف الأرض تنشب فيهم."], [25, "يثكلهم سيف العدو في الطريق، ويستولي عليهم الرعب داخل الخدور، فيهلك الفتى مع الفتاة، والرضيع مع الشيخ."], [26, "قلت: أشتتهم في زوايا الأرض، وأمحو من بين الناس ذكرهم."], [27, "لولا خوفي من تبجح العدو، إذ يظنون قائلين: إن يدنا قد عظمت، وليس ما جرى هو من فعل الرب."]]}, {"l": "Jer 18:11", "n": "", "vs": [[11, "لذلك قل لرجال يهوذا وأهل أورشليم، هذا ما يعلنه الرب: ها أنا أدبر لكم شرا، وأعد لكم مؤامرة، فليرجع كل واحد منكم عن طريقه الشرير وقوموا سبلكم وأعمالكم."]]}, {"l": "Mic 2:3", "n": "", "vs": [[3, "لهذا، هكذا يقول الرب. ها أنا أدبر شرا لهذا الشعب تعجزون عن فك رقابكم منه، ولن تمشوا بعد متشامخين لأن الزمن يكون زمن سوء."]]}], "kwAr": "نفذ الرب قضاءه", "noteAr": ""}, {"kw": "he hath thrown", "raw": "Lam_2:1, Lam_2:2; Eze_5:11, Eze_7:8, Eze_7:9, Eze_8:18, Eze_9:10", "note": "", "refs": [{"l": "Lam 2:1", "n": "", "vs": [[1, "كيف خيم الرب في غضبه بالظلام على ابنة صهيون، وطرح من السماء إلى الأرض جلال إسرائيل، ولم يذكر موطيء قدميه في يوم سخطه؟"]]}, {"l": "Lam 2:2", "n": "", "vs": [[2, "قد هدم الرب من غير رحمة جميع مساكن يعقوب. قوض بغضبه معاقل ابنة يهوذا، وألحق العار بالمملكة وحكامها، إذ سواها بالأرض."]]}, {"l": "Eze 5:11", "n": "", "vs": [[11, "لهذا حي أنا يقول السيد الرب، لأنك قد دنست مقدسي بكل أصنامك المكروهة، وبجميع رجاساتك، فأنا أيضا أستأصل، ولا تترَأف عليك عيني ولا أعفو."]]}, {"l": "Eze 7:8", "n": "", "vs": [[8, "أنا موشك على صب غضبي عليك وأنفث غيظي فيك، وأدينك بمقتضى طرقك، وأجازيك على كل رجاساتك،"]]}, {"l": "Eze 7:9", "n": "", "vs": [[9, "فلا تترَأف عليك عيني ولا أعفو، بل أجازيك بمقتضى طرقك، وتكون رجاساتك في وسطك. وعندئذ تدركون أني أنا الضارب."]]}, {"l": "Eze 8:18", "n": "", "vs": [[18, "لذلك أعاقبهم بالغضب، ولا تترَأف عيني عليهم، ولا أعفو، وإن استغاثوا بصوت عال لا أستجيب لهم»."]]}, {"l": "Eze 9:10", "n": "", "vs": [[10, "لذلك أنا أيضا لا تترَأف عيني ولا أعفو، إنما أوقع ذنب تصرفاتهم على رؤوسهم»."]]}], "kwAr": "هدم", "noteAr": ""}, {"kw": "he hath caused", "raw": "Lam_1:5; Deu_28:43, Deu_28:44; Psa_38:16, Psa_89:42", "note": "", "refs": [{"l": "Lam 1:5", "n": "", "vs": [[5, "أصبح أعداؤها سادة، ونجح مضايقوها، لأن الرب أشقاها بسبب خطاياها المتكاثرة. قد ذهب أولادها إلى السبي أمام العدو."]]}, {"l": "Deu 28:43", "n": "", "vs": [[43, "يعظم شأن الغرباء المقيمين بينكم، ويتفاقم انحطاط شأنكم."]]}, {"l": "Deu 28:44", "n": "", "vs": [[44, "هم يقرضونكم وأنتم لا تقرضونهم، وهم يكونون رأسا وأنتم تكونون ذنبا،"]]}, {"l": "Psa 38:16", "n": "", "vs": [[16, "قلت: «لا تدعهم يشمتون بي فحالما زلت قدمي تغطرسوا علي»"]]}, {"l": "Psa 89:42", "n": "", "vs": [[42, "رفعت يمين ظالميه وأبهجت جميع أعدائه."]]}], "kwAr": "فأشمت بك الخصم", "noteAr": ""}], "arS": [["نفذ", ["H6213"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["قضاءه", ["H2161"]], ["، ", []], ["وحقق", ["H1214"]], [" ", []], ["وعيده", ["H565"]], [" ", []], ["الذي", ["H834"]], [" ", []], ["حكم", ["H6680"]], [" به ", []], ["منذ", ["H4480"]], [" ", []], ["الحقب", ["H3117"]], [" ", []], ["السالفة", ["H6924"]], [". ", []], ["هدم", ["H2040"]], [" ", []], ["ولم", ["H3808"]], [" ", []], ["يرأف", ["H2550"]], ["، ", []], ["فأشمت", ["H8055"]], [" ", []], ["بك", ["H5921"]], [" ", []], ["الخصم", ["H341"]], ["، وعظم ", []], ["قوة", ["H7161"]], [" ", []], ["عدوك", ["H6862"]], [".", []]]}, {"c": 2, "v": 18, "text": "استغاثت قلوبهم بالرب. لتجر الدموع، ياأسوار ابنة صهيون، كالنهر ليلا ونهارا. لا تستكيني ولا تكف عيناك عن البكاء.", "groups": [{"kw": "heart", "raw": "Psa_119:145; Isa_26:16, Isa_26:17; Hos_7:14", "note": "", "refs": [{"l": "Psa 119:145", "n": "", "vs": [[145, "صرخت إليك من كل قلبي، فاستجب لي يارب، وسأراعي شرائعك."]]}, {"l": "Isa 26:16", "n": "", "vs": [[16, "يارب قد طلبوك في المحنة، وسكبوا دعاءهم عند تأديبك لهم،"]]}, {"l": "Isa 26:17", "n": "", "vs": [[17, "وكنا في حضرتك يارب كالحبلى المشرفة على الولادة، التي تتلوى وتصرخ في مخاضها."]]}, {"l": "Hos 7:14", "n": "", "vs": [[14, "لم يستغيثوا بي من كل قلوبهم، بل أعولوا في مضاجعهم، وتألبوا حول أصنامهم يطلبون قمحا وخمرا، وارتدوا عني."]]}], "kwAr": "استغاثت قلوبهم", "noteAr": ""}, {"kw": "O wall", "raw": "Lam_2:8; Hab_2:11", "note": "", "refs": [{"l": "Lam 2:8", "n": "", "vs": [[8, "عزم الرب أن يقوض سور ابنة صهيون. مد خيط القياس ولم يرد يده عن سحقها، فاستبكى المترسة والسور فسقطا معا."]]}, {"l": "Hab 2:11", "n": "", "vs": [[11, "حتى حجارة الجدران تصرخ من شرك، فتردد الدعائم الخشبية أصداءها."]]}], "kwAr": "ياأسوار ابنة صهيون", "noteAr": ""}, {"kw": "let tears", "raw": "Lam_1:2, Lam_1:16, Lam_3:48, Lam_3:49; Psa_119:136; Jer_4:31, Jer_9:1, Jer_9:17, Jer_9:18, Jer_13:17, Jer_14:17", "note": "", "refs": [{"l": "Lam 1:2", "n": "", "vs": [[2, "تبكي بمرارة في الليل، ودموعها تنهمر على خديها. لا معزي لها بين محبيها. غدر بها جميع خلانها وأصبحوا لها أعداء."]]}, {"l": "Lam 1:16", "n": "", "vs": [[16, "على هذه كلها أبكي. عيناي، عيناي تفيضان بالدموع، إذ ابتعد عني كل معز ينعش نفسي. هلك أبنائي لأن العدو قد ظفر."]]}, {"l": "Lam 3:48", "n": "", "vs": [[48, "تفيض عيناي بأنهار مياه على دمار ابنة شعبي."]]}, {"l": "Lam 3:49", "n": "", "vs": [[49, "لن تكف عيناي عن البكاء أبدا،"]]}, {"l": "Psa 119:136", "n": "", "vs": [[136, "فاضت من عيني ينابيع دمع، لأنهم لم يراعوا شريعتك."]]}, {"l": "Jer 4:31", "n": "", "vs": [[31, "لأني سمعت صرخة كصرخة امرأة في مخاض، وأنة عذاب كعذاب من تقاسي في ولادة بكرها. إنها صرخة ابنة صهيون التي تزفر لاهثة وتبسط يديها قائلة: «ويل لي! قد غشي علي أمام القتلة»."]]}, {"l": "Jer 9:1", "n": "", "vs": [[1, "ياليت رأسي فيض مياه، وعيني ينبوع دموع، فأبكي نهارا وليلا قتلى بنت شعبي"]]}, {"l": "Jer 9:17", "n": "", "vs": [[17, "وهذا ما يعلنه الرب القدير: «تأملوا واستدعوا النادبات ليأتين، وأرسلوا إلى الحكيمات فيقبلن."]]}, {"l": "Jer 9:18", "n": "", "vs": [[18, "ليسرعن حتى يطلقن أصواتهن علينا بالندب فتذرف عيوننا دموعا، وتفيض أجفاننا ماء."]]}, {"l": "Jer 13:17", "n": "", "vs": [[17, "وإن لم تنصتوا فإن نفسي تبكي في الخفاء من أجل كبريائكم، وتذرف عيناي الدموع المريرة، فتسيل العبرات لأن الرب قد سبى شعبه."]]}, {"l": "Jer 14:17", "n": "", "vs": [[17, "وقل لهم هذا الكلام: «لتذرف عيناي دموعا ليلا ونهارا، ولا تكفا أبدا لأن أورشليم سحقت سحقا عظيما بضربة أليمة جدا."]]}], "kwAr": "لتجر الدموع", "noteAr": ""}, {"kw": "the apple", "raw": "Bath ayin which sometimes means the pupil of the eye, seems here to denote tears, the produce of the eye; and therefore elegantly termed the daughter of the eye.", "note": "Bath ayin which sometimes means the pupil of the eye, seems here to denote tears, the produce of the eye; and therefore elegantly termed the daughter of the eye.", "refs": [], "kwAr": "تكف عيناك", "noteAr": "كلمة «بت عين» التي تعني أحيانا بؤبؤ العين تدل هنا على ما يبدو على الدموع، ثمرة العين، ولذلك سُميت ببلاغة «ابنة العين»."}], "arS": [["استغاثت", ["H6817"]], [" ", []], ["قلوبهم", ["H3820"]], [" ", []], ["بالرب", ["H136"]], [". ", []], ["لتجر", ["H3381"]], [" ", []], ["الدموع", ["H1832"]], ["، ", []], ["ياأسوار", ["H2346"]], [" ", []], ["ابنة", ["H1323"]], [" ", []], ["صهيون", ["H6726"]], ["، ", []], ["كالنهر", ["H5158"]], [" ", []], ["ليلا", ["H3915"]], [" ", []], ["ونهارا", ["H3119"]], [". ", []], ["لا", ["H408"]], [" ", []], ["تستكيني", ["H6314"]], [" ", []], ["ولا", ["H408"]], [" ", []], ["تكف", ["H1826"]], [" ", []], ["عيناك", ["H5869"]], [" عن البكاء.", []]]}, {"c": 2, "v": 19, "text": "قومي وانتحبي في الربع الأول من الليل. اسكبي كالماء قلبك في محضر الرب. ارفعي إليه يديك من أجل نفوس أطفالك المغشي عليهم من الجوع عند ناصية كل شارع.", "groups": [{"kw": "cry out", "raw": "Psa_42:8, Psa_62:8, Psa_119:55, Psa_119:147, Psa_119:148; Isa_26:9; Mar_1:35; Luk_6:12", "note": "", "refs": [{"l": "Psa 42:8", "n": "", "vs": [[8, "يبدي الرب لي رحمته في النهار، وفي الليل ترافقني ترنيمته، صلاة لإله حياتي."]]}, {"l": "Psa 62:8", "n": "", "vs": [[8, "ثقوا به في كل حين أيها الشعب. اسكبوا أمامه قلوبكم، الله ملجأنا."]]}, {"l": "Psa 119:55", "n": "", "vs": [[55, "ذكرت في الليل اسمك يارب، وحفظت شريعتك."]]}, {"l": "Psa 119:147", "n": "", "vs": [[147, "استيقظت قبل الفجر واستغثت؛ رجائي في كلامك."]]}, {"l": "Psa 119:148", "n": "", "vs": [[148, "الليل كله أظل مستيقظا، أتأمل في أقوالك"]]}, {"l": "Isa 26:9", "n": "", "vs": [[9, "تتوق إليك نفسي في الليل، وفي الصباح تشتاق إليك روحي. عندما تسود أحكامك في الأرض يتعلم أهلها العدل."]]}, {"l": "Mar 1:35", "n": "", "vs": [[35, "وفي اليوم التالي، نهض باكرا قبل الفجر، وخرج إلى مكان مقفر وأخذ يصلي هناك."]]}, {"l": "Luk 6:12", "n": "", "vs": [[12, "وفي تلك الأيام، خرج إلى الجبل ليصلي، وقضى الليل كله في الصلاة لله."]]}], "kwAr": "وانتحبي", "noteAr": ""}, {"kw": "watches", "raw": "Jdg_7:19; Mat_14:25; Mar_13:35", "note": "", "refs": [{"l": "Jdg 7:19", "n": "", "vs": [[19, "فأقبل جدعون وفرقته إلى طرف المعسكر في منتصف الليل، بعد تغيير نوبة الحراسة، فنفخوا بالأبواق وحطموا الجرار التي بأيديهم."]]}, {"l": "Mat 14:25", "n": "", "vs": [[25, "وفي الربع الأخير من الليل جاء يسوع إلى التلاميذ ماشيا على ماء البحيرة."]]}, {"l": "Mar 13:35", "n": "", "vs": [[35, "إذن اسهروا، لأنكم لا تعرفون متى يعود رب البيت: أمساء، أم في منتصف الليل، أم عند صياح الديك، أم صباحا،"]]}], "kwAr": "الربع الأول من الليل", "noteAr": ""}, {"kw": "pour", "raw": "1Sa_1:15, 1Sa_7:6; Job_3:24; Psa_62:8, Psa_142:2", "note": "", "refs": [{"l": "1Sa 1:15", "n": "", "vs": [[15, "فأجابته: «لا يا سيِّدي: إنني امرأة حزينة الروح، لم أشرب خمرا ولا مسكرا، بل أسكب نفسي أمام الرب."]]}, {"l": "1Sa 7:6", "n": "", "vs": [[6, "فاجتمعوا في المصفاة حيث استقوا ماء وسكبوه أمام الرب، وصاموا في ذلك اليوم قائلين هناك: «قد أخطأنا إلى الرب». وكان صموئيل يقضي لبني إسرائيل في المصفاة."]]}, {"l": "Job 3:24", "n": "", "vs": [[24, "استبدلت طعامي بالأنين، وزفرتي تنسكب كالمياه،"]]}, {"l": "Psa 62:8", "n": "", "vs": [[8, "ثقوا به في كل حين أيها الشعب. اسكبوا أمامه قلوبكم، الله ملجأنا."]]}, {"l": "Psa 142:2", "n": "", "vs": [[2, "أبثه شكواي وأحدثه بضيقي."]]}], "kwAr": "اسكبي", "noteAr": ""}, {"kw": "lift up", "raw": "Psa_28:2, Psa_63:4, Psa_134:2, Psa_141:2; 1Ti_2:8", "note": "", "refs": [{"l": "Psa 28:2", "n": "", "vs": [[2, "استمع صوت تضرعي عندما أستغيث بك، رافعا يدي نحو محراب قداستك."]]}, {"l": "Psa 63:4", "n": "", "vs": [[4, "أحمدك على بركاتك مدى حياتي، وباسمك أرفع يدي مبتهلا."]]}, {"l": "Psa 134:2", "n": "", "vs": [[2, "ارفعوا أيديكم نحو المقدس وباركوا الرب."]]}, {"l": "Psa 141:2", "n": "", "vs": [[2, "لتكن صلاتي أمامك كالبخور، ورفع يدي مثل تقدمة المساء."]]}, {"l": "1Ti 2:8", "n": "", "vs": [[8, "فأريد إذن، أن يصلي الرجال في كل مكان، رافعين أيادي طاهرة، وهم لا يضمرون أي حقد أو شكوك."]]}], "kwAr": "ارفعي", "noteAr": ""}, {"kw": "that faint", "raw": "Lam_2:11, Lam_2:12, Lam_4:1-9; Isa_51:20; Eze_5:10,Eze_5:16; Nah_3:10", "note": "", "refs": [{"l": "Lam 2:11", "n": "", "vs": [[11, "كلت عيناي من البكاء، جاشت أحشائي وأريقت كبدي على الأرض حزنا لدمار ابنة شعبي، لأن الأطفال والرضع غشي عليهم في شوارع المدينة."]]}, {"l": "Lam 2:12", "n": "", "vs": [[12, "يقولون لأمهاتهم باكين: «أين الخبز والخمر؟» ثم يغشى عليهم كالجرحى في شوارع المدينة، حين تهرق حياتهم في أحضان أمهاتهم."]]}, {"l": "Lam 4:1-9", "n": "", "vs": [[1, "كيف اكمد الذهب واكدر لون النضار الخالص؟ كيف تبعثرت حجارة القدس في ناصية كل شارع؟"], [2, "كيف حسب أبناء صهيون الكرام الموزونون بالذهب النقي، كآنية خزفية من عمل يد الفخاري؟"], [3, "حتى بنات آوى تكشف عن ثديها وترضع أجراءها، أما ابنة شعبي فقاسية كالنعام في الصحراء."], [4, "قد التصق لسان الرضيع بحنكه عطشا، والتمس الأطفال خبزا وليس من يعطيه لهم."], [5, "هلك في الشوارع الذين كانوا يأكلون الطيبات، واحتضن المزابل المتربون على لبس الحرية."], [6, "لأن عقاب إثم ابنة شعبي أعظم من عقاب خطيئة سدوم التي انقلبت في لحظة، من غير أن تمتد إليها يد إنسان."], [7, "كان نبلاؤها أنقى من الثلج وأنصع من اللبن. أجسادهم أكثر حمرة من المرجان، وقاماتاهم كالياقوت العأزرق،"], [8, "فأصبحت صورتهم أكثر سوادا من الفحم، فلم يعرفوا فاي الشوارع. لصقت جلودهم بعظامهم، وصارت جافة كالحطب."], [9, "كان مصير ضحايا السيف أفضل من مصير ضحايا الجوع، الذين اضمحلوا من طعنة عقم الحقل."]]}, {"l": "Isa 51:20", "n": "", "vs": [[20, "قد أعيا أبناؤك وانطرحوا عند رأس كل شارع كوعل وقع في شبكة. امتلأوا من غضب الرب ومن زجر إلهك."]]}, {"l": "Eze 5:10", "n": "", "vs": [[10, "إذ يأكل الآباء أبناءهم، والأبناء آباءهم، لأنني أجري فيك قضاء وأذري بقيتك كلها مع كل ريح."]]}, {"l": "Eze 5:16", "n": "", "vs": [[16, "وعندما أرسل عليهم سهام الجوع المميتة التي أعدت للتدمير، السهام التي أرسلتها لخرابكم، عندئذ أزيد من الجوع عليكم وأبيد مؤونة خبزكم،"]]}, {"l": "Nah 3:10", "n": "", "vs": [[10, "ومع ذلك فقد وقعت أسيرة واقتيدت إلى السبي، وتمزق أطفالها أشلاء في زاوية كل شارع، واقترع على عظمائها، وصفد نبلاؤها بالأغلال."]]}], "kwAr": "المغشي عليهم من الجوع", "noteAr": ""}], "arS": [["قومي", ["H6965"]], [" ", []], ["وانتحبي", ["H7442"]], [" ", []], ["في", ["H413"]], [" ", []], ["الربع", ["H821"]], [" ", []], ["الأول", ["H7218"]], [" ", []], ["من", ["H5921"]], [" ", []], ["الليل", ["H3915"]], [". ", []], ["اسكبي", ["H8210"]], [" ", []], ["كالماء", ["H4325"]], [" ", []], ["قلبك", ["H3820"]], [" في ", []], ["محضر", ["H6440"]], [" ", []], ["الرب", ["H136"]], [". ", []], ["ارفعي", ["H5375"]], [" إليه ", []], ["يديك", ["H3709"]], [" من أجل ", []], ["نفوس", ["H5315"]], [" ", []], ["أطفالك", ["H5768"]], [" ", []], ["المغشي", ["H5848"]], [" عليهم من ", []], ["الجوع", ["H7458"]], [" عند ", []], ["ناصية", ["H7218"]], [" ", []], ["كل", ["H3605"]], [" ", []], ["شارع", ["H2351"]], [".", []]]}, {"c": 2, "v": 20, "text": "انظر يارب وتأمل! بمن صنعت هذا؟ أعلى النساء أن يأكلن ثمرة بطونهن، وأطفال حضانتهن؟ أيتحتم على الكاهن والنبي أن يقتلا في مقدس الرب؟", "groups": [{"kw": "consider", "raw": "Exo_32:11; Deu_9:26; Isa_63:16-19, Isa_64:8-12; Jer_14:20-21", "note": "", "refs": [{"l": "Exo 32:11", "n": "", "vs": [[11, "فابتهل موسى إلى الرب وقال: «لماذا يحتدم غضبك على شعبك الذي أخرجته من ديار مصر بقوة عظيمة وذراع مقتدرة؟"]]}, {"l": "Deu 9:26", "n": "", "vs": [[26, "وابتهلت إلى الرب قائلا: ياسيد الرب، لا تهلك شعبك وميراثك الذي افتديته بقوتك العظيمة، وأخرجته من مصر بقدرة فائقة."]]}, {"l": "Isa 63:16-19", "n": "", "vs": [[16, "فأنت هو أبونا، مع أن إبراهيم لا يعرفنا، وإسرائيل لا يعترف بنا، فأنت أيها الرب، هو أبونا، واسمك فادينا منذ القديم."], [17, "لماذا يارب تركتنا نضل عن طرقك وقسيت قلوبنا حتى لم نعد نتقيك؟ ارجع إلينا من أجل عبيدك، أسباط ميراثك."], [18, "قد داس أعداؤنا هيكلك الذي امتلكه شعبك المقدس زمنا يسيرا،"], [19, "وأصبحنا نظير الذين لم تتسلط عليهم قط ولم يدع عليهم باسمك."]]}, {"l": "Isa 64:8-12", "n": "", "vs": [[8, "ومع ذلك فأنت أيها الرب أبونا، نحن الطين وأنت الخزاف، وكلنا عمل يديك."], [9, "لا توغل في غضبك علينا يارب، ولا تذكر الإثم إلى الأبد. إنما انظر إلينا، فكلنا شعبك."], [10, "قد استحالت مدينتك المقدسة إلى قفر، وأصبحت صهيون برية وأورشليم موحشة،"], [11, "واحترق بالنار هيكلنا المقدس البهي، الذي شدا آباؤنا فيه بتسبيحك، وصار كل ما هو أثير لدينا خرابا."], [12, "هل بعد هذا كله تسكت يارب، وتعتصم بالصمت وتنزل بنا أشد البلاء؟"]]}, {"l": "Jer 14:20-21", "n": "", "vs": [[20, "نحن نقر بشرنا يارب وبآثام آبائنا، لأننا قد أخطأنا إليك."], [21, "لا ترفضنا من أجل اسمك ولا تهن عرشك المجيد. اذكر عهدك معنا ولا تنقضه."]]}], "kwAr": "وتأمل", "noteAr": ""}, {"kw": "Shall the women", "raw": "Lam_4:10; Lev_26:29; Deu_28:53-57; 2Ki_6:28, 2Ki_6:29; Jer_19:9; Eze_5:10", "note": "", "refs": [{"l": "Lam 4:10", "n": "", "vs": [[10, "طهت أيدي الأمهات الحانيات أولادهن ليكونوا طعاما لهن في أثناء دمار ابنة شعبي."]]}, {"l": "Lev 26:29", "n": "", "vs": [[29, "فتأكلون لحم أبنائكم وبناتكم."]]}, {"l": "Deu 28:53-57", "n": "", "vs": [[53, "فتأكلون في أثناء الحصار والضيقة التي يضايقكم بها عدوكم ثمار بطونكم، لحم أبنائكم وبناتكم الذين رزقكم بهم الرب إلهكم."], [54, "فيقسو قلب أكثركم رقة ورأفة على أخيه وامرأته التي في حضنه وسائر أبنائه الأحياء."], [55, "فلا يعطي أحدهم من لحم أبنائه، الذي يأكله، لأنه لم يبق لديه شيء سواه في الحصار والضيقة التي يضايقكم بها عدوكم في جميع مدنكم."], [56, "وكذلك فإن أكثر النساء رقة ورأفة، والتي لنعومتها وترفهها لا تجرؤ على لمس الأرض بباطن قدمها، تبخل على زوجها رجل حضنها وعلى ابنها وابنتها"], [57, "بمشيمتها الساقطة منها، وبأولادها الذين تلدهم، لأنها تنوي أن تأكلهم سرا في أثناء الحصار، في الضيقة التي يضايقكم بها عدوكم في كل مدنكم."]]}, {"l": "2Ki 6:28", "n": "", "vs": [[28, "ثم سألها الملك: «مالك؟» فأجابت: «لقد قالت لي هذه المرأة، هاتي ابنك فنأكله اليوم، ثم نأكل ابني في اليوم التالي."]]}, {"l": "2Ki 6:29", "n": "", "vs": [[29, "فسلقنا ابني وأكلناه. وعندما قلت لها في اليوم التالي: هاتي ابنك لنأكله، خبأت ابنها»."]]}, {"l": "Jer 19:9", "n": "", "vs": [[9, "وأطعمهم لحوم أبنائهم وبناتهم، ويأكل كل واحد لحم جاره في أثناء الحصار والضيقة التي يضايقهم بها أعداؤهم وطالبو نفوسهم."]]}, {"l": "Eze 5:10", "n": "", "vs": [[10, "إذ يأكل الآباء أبناءهم، والأبناء آباءهم، لأنني أجري فيك قضاء وأذري بقيتك كلها مع كل ريح."]]}], "kwAr": "أعلى النساء", "noteAr": ""}, {"kw": "of a span long", "raw": "or, swaddled with their hands", "note": "or, swaddled with their hands", "refs": [], "kwAr": "أطفال حضانتهن", "noteAr": "أو: المقمطين بأيديهم."}, {"kw": "shall the priest", "raw": "Lam_1:19, Lam_4:13, Lam_4:16; Psa_78:64; Isa_9:14-17; Jer_5:31, Jer_14:15-18, Jer_23:11-15; Eze_9:5, Eze_9:6", "note": "", "refs": [{"l": "Lam 1:19", "n": "", "vs": [[19, "دعوت محبي فخدعوني. فني كهنتي وشيوخي في المدينة وهم ينشدون قوتا لإحيا ء نفوسهم."]]}, {"l": "Lam 4:13", "n": "", "vs": [[13, "عقابا لها على خطايا أنبيائها وآثام كهنتها، الذين سفكوا في وسطها دم الصديقين."]]}, {"l": "Lam 4:16", "n": "", "vs": [[16, "قد بددهم الرب نفسه، ولم يعد يعبأ بهم، لم يكرموا الكهنة ولم يترَأفوا بالشيوخ."]]}, {"l": "Psa 78:64", "n": "", "vs": [[64, "سقط كهنتهم صرعى السيف، وأراملهم لم يندبن عليهم."]]}, {"l": "Isa 9:14-17", "n": "", "vs": [[14, "لذلك سيقطع الرب من إسرائيل في يوم واحد الرأس والذنب، النخل والأسل."], [15, "إن الشيخ والوجيه هو الرأس، والنبي الذي يلقن الكذب هو الذنب"], [16, "فمرشدو هذا الشعب يضلونه، والمرشدون يبتلعون."], [17, "لذلك لا يسر الرب بشبانهم، ولا يترَأف على أيتامهم وأراملهم، لأن جميعهم منافقون وفاعلو شر، كل فم ينطق بالحماقة، ومع كل هذا فإن غضبه لم يرتد، وما برحت يده ممدودة للعقاب."]]}, {"l": "Jer 5:31", "n": "", "vs": [[31, "فالأنبياء يتنبأون زورا، والكهنة يتصرفون بمقتضى أحكامهم، وشعبي أحب مثل هذا. ولكن ماذا تصنعون في نهاية المطاف؟»"]]}, {"l": "Jer 14:15-18", "n": "", "vs": [[15, "لذلك هكذا يقول الرب عن هؤلاء الأنبياء المتنبئين باسمي: مع أني لم أرسلهم فإنهم يقولون: لن تبتلى هذه الأرض بسيف ولا مجاعة، لهذا فإن هولاء الأنبياء يفنون بالسيف والمجاعة."], [16, "ويغدو الشعب الذي يتنبأون له، مطروحا صريعا في شوارع أورشليم فريسة الجوع والسيف، وليس من يدفنهم هم ونساءهم وأبناءهم وبناتهم، وأصب شرهم عليهم»."], [17, "وقل لهم هذا الكلام: «لتذرف عيناي دموعا ليلا ونهارا، ولا تكفا أبدا لأن أورشليم سحقت سحقا عظيما بضربة أليمة جدا."], [18, "إن خرجت إلى الحقول أشهد قتلى السيف، وإن دخلت المدينة أرى ضحايا المجاعة. وها النبي والكاهن كلاهما يذهبان إلى أرض لا يعرفانها»."]]}, {"l": "Jer 23:11-15", "n": "", "vs": [[11, "ويقول الرب: «النبي والكاهن كافران، وفي بيتي وجدت شرهما."], [12, "لذلك يضحي طريقهما مزالق لهما، تفضي بهما إلى الظلمات التي يطردون إليها، ويهويان فيها لأني أجلب عليهما شرا في سنة عقابهما»."], [13, "في أوساط أنبيا ء السامرة شهدت أمورا كريهة، إذ تنبأوا باسم البعل، وأضلوا شعبي إسرائيل."], [14, "وفي أوساط أنبياء أورشليم رأيت أمورا مهولة: يرتكبون الفسق، ويسلكون في الأكاذيب، يشددون أيدي فاعلي الإثم لئلا يتوب أحد عن شره. صاروا جميعا كسكان سدوم وأصبح أهلها كأهل عمورة."], [15, "لذلك هذا ما يقوله الرب القدير عن الأنبياء: «ها أنا أطعمهم أفسنتينا وأسقيهم ماء مسموما، لأنه من أنبياء أورشليم شاع الكفر في كل أرجاء الأرض»."]]}, {"l": "Eze 9:5", "n": "", "vs": [[5, "ثم قال للستة الآخرين على مسمعي: «اعبروا في المدينة خلفه واقتلوا. لا تترَأف عيونكم ولا تعفوا."]]}, {"l": "Eze 9:6", "n": "", "vs": [[6, "أهلكوا الشيخ والشاب والعذراء والطفل والنساء. ولكن لا تقربوا من أي إنسان عليه السمة، وابتدئوا من مقدسي». فابتدأوا يهلكون الرجال والشيوخ الموجودين أمام الهيكل."]]}], "kwAr": "أيتحتم على الكاهن", "noteAr": ""}], "arS": [["انظر", ["H7200"]], [" ", []], ["يارب", ["H3068"]], [" ", []], ["وتأمل", ["H5027"]], ["! ", []], ["بمن", ["H4310"]], [" ", []], ["صنعت", ["H5953"]], [" ", []], ["هذا", ["H3541"]], ["؟ أعلى ", []], ["النساء", ["H802"]], [" أن ", []], ["يأكلن", ["H398"]], [" ", []], ["ثمرة", ["H6529"]], [" بطونهن، ", []], ["وأطفال", ["H5768"]], [" ", []], ["حضانتهن", ["H2949"]], ["؟ أيتحتم على ", []], ["الكاهن", ["H3548"]], [" ", []], ["والنبي", ["H5030"]], [" أن ", []], ["يقتلا", ["H2026"]], [" في ", []], ["مقدس", ["H4720"]], [" ", []], ["الرب", ["H136"]], ["؟", []]]}, {"c": 2, "v": 21, "text": "قد انطرح الصبي والشيوخ في غبار الطرقات. سقط عذاراي وشباني بالسيف. قد قتلتهم في يوم غضبك، ونحرتهم من غير رحمة.", "groups": [{"kw": "young", "raw": "Deu_28:50; Jos_6:21; 1Sa_15:3; 2Ch_36:17; Est_3:13; Jer_51:22; Eze_9:6", "note": "", "refs": [{"l": "Deu 28:50", "n": "", "vs": [[50, "أمة يثير منظرها الرعب، لا تهاب الشيخ ولا ترأف بالطفل،"]]}, {"l": "Jos 6:21", "n": "", "vs": [[21, "ودمروا المدينة وقضوا بحد السيف على كل من فيها من رجال ونساء وأطفال وشيوخ حتى البقر والغنم والحمير."]]}, {"l": "1Sa 15:3", "n": "", "vs": [[3, "فاذهب الآن وهاجم عماليق واقض على كل ماله. لا تعف عن أحد منهم بل اقتلهم جميعا رجالا ونساء، وأطفالا ورضعا، بقرا وغنما، جمالا وحميرا»."]]}, {"l": "2Ch 36:17", "n": "", "vs": [[17, "فأرسل إليهم ملك الكلدانيين، فقتل نخبتهم بالسيف في عقر الهيكل المقدس. ولم يرحم الرب فتى أو عذراء أو شيخا أو أشيب، بل أسلمهم جميعا ليد الكلدانيين،"]]}, {"l": "Est 3:13", "n": "", "vs": [[13, "وحمل السعاة الرسائل إلى جميع أقاليم المملكة، وفيها أمر بإبادة وقتل وإهلاك جميع اليهود، شبانا وشيوخا وأطفالا ونساء في يوم واحد، هو الثالث عشر من الشهر الثاني عشر، أي شهر أذار، والاستيلاء على غنائمهم."]]}, {"l": "Jer 51:22", "n": "", "vs": [[22, "بك أحطم الرجل والمرأة، والشيخ والفتى، والشاب والعذراء."]]}, {"l": "Eze 9:6", "n": "", "vs": [[6, "أهلكوا الشيخ والشاب والعذراء والطفل والنساء. ولكن لا تقربوا من أي إنسان عليه السمة، وابتدئوا من مقدسي». فابتدأوا يهلكون الرجال والشيوخ الموجودين أمام الهيكل."]]}], "kwAr": "انطرح الصبي", "noteAr": ""}, {"kw": "my virgins", "raw": "Lam_1:15, Lam_1:18; Psa_78:63; Jer_9:21, Jer_11:22, Jer_18:21; Amo_4:10", "note": "", "refs": [{"l": "Lam 1:15", "n": "", "vs": [[15, "بدد الرب جميع جبابرتي في وسطي، وألب علي حشدا من أعدائي ليسحقوا شباني. داس الرب العذراء بنت صهيون كما يداس العنب في المعصرة."]]}, {"l": "Lam 1:18", "n": "", "vs": [[18, "الرب حقا عادل، وأنا قد تمردت على أمره. فاستمعوا ياجميع الشعوب واشهدوا وجعي. قد ذهب عذاراي وشباني إلى السبي."]]}, {"l": "Psa 78:63", "n": "", "vs": [[63, "فالتهمت النار فتيانهم، ولم تنشد لعذاراهم أغنية زواج."]]}, {"l": "Jer 9:21", "n": "", "vs": [[21, "فإن الموت قد تسلق إلى كوانا وتسلل إلى قصورنا، فاستأصل الأطفال من الشوارع والشبان من الساحات."]]}, {"l": "Jer 11:22", "n": "", "vs": [[22, "لهذا يعلن الرب القدير: ها أنا أعاقبهم فيموت شبابهم بحد السيف، ويهلك أبناؤهم وبناتهم جوعا."]]}, {"l": "Jer 18:21", "n": "", "vs": [[21, "لذلك أسلم بنيهم لأنياب الجوع، واعهد بهم إلى قبضة السيف فتصبح نساؤهم ثكالى وأرامل، وليمت رجالهم، وليلق شبانهم حتفهم في المعارك بحد السيف."]]}, {"l": "Amo 4:10", "n": "", "vs": [[10, "أصبتكم بالأوبئة التي أصيبت بها مصر، وقضيت على شبابكم بالسيف وسبيت خيولكم، وجعلت نتن معسكركم يزكم أنوفكم. ولكنكم لم ترجعوا إلي تائبين يقول الرب."]]}], "kwAr": "عذاراي", "noteAr": ""}, {"kw": "thou hast killed", "raw": "Lam_2:2, Lam_2:17, Lam_3:43; Isa_27:11; Jer_13:14, Jer_21:7; Eze_5:11, Eze_7:4, Eze_7:9, Eze_8:18; Eze_9:5, Eze_9:10; Zec_11:6", "note": "", "refs": [{"l": "Lam 2:2", "n": "", "vs": [[2, "قد هدم الرب من غير رحمة جميع مساكن يعقوب. قوض بغضبه معاقل ابنة يهوذا، وألحق العار بالمملكة وحكامها، إذ سواها بالأرض."]]}, {"l": "Lam 2:17", "n": "", "vs": [[17, "نفذ الرب قضاءه، وحقق وعيده الذي حكم به منذ الحقب السالفة. هدم ولم يرأف، فأشمت بك الخصم، وعظم قوة عدوك."]]}, {"l": "Lam 3:43", "n": "", "vs": [[43, "لفعت نفسك بالغضب وتعقبتنا. قتلت من غير رحمة."]]}, {"l": "Isa 27:11", "n": "", "vs": [[11, "ومتى يبست فروعها تتكسر، فتقبل النساء ويستخدمنها وقودا للنار. لأن هذا شعب جاهل، لذلك لا يرحمه صانعه ولا يرفق به خالقه."]]}, {"l": "Jer 13:14", "n": "", "vs": [[14, "وأهشمهم الواحد فوق الآخر، الآباء والأبناء معا، يقول الرب. لا أشفق ولا أترَأف ولا أرحم، بل أهلكهم»."]]}, {"l": "Jer 21:7", "n": "", "vs": [[7, "وأسلم صدقيا ملك يهوذا وخدامه ومن بقي من أهل هذه المدينة، الناجين من الوبأ والسيف والجوع، إلى يد نبوخذناصر ملك بابل، وإلى أيدي أعدائهم وطالبي نفوسهم، فيقتلهم بحد السيف، ولا يرثي لهم ولا يشفق أو يرحم."]]}, {"l": "Eze 5:11", "n": "", "vs": [[11, "لهذا حي أنا يقول السيد الرب، لأنك قد دنست مقدسي بكل أصنامك المكروهة، وبجميع رجاساتك، فأنا أيضا أستأصل، ولا تترَأف عليك عيني ولا أعفو."]]}, {"l": "Eze 7:4", "n": "", "vs": [[4, "فلا تتر أف عليك عيني، ولا أعفو، بل أجازيك بمقتضى طرقك، وتكون رجاساتك في وسطك. عندئذ تدركون أني أنا الرب»."]]}, {"l": "Eze 7:9", "n": "", "vs": [[9, "فلا تترَأف عليك عيني ولا أعفو، بل أجازيك بمقتضى طرقك، وتكون رجاساتك في وسطك. وعندئذ تدركون أني أنا الضارب."]]}, {"l": "Eze 8:18", "n": "", "vs": [[18, "لذلك أعاقبهم بالغضب، ولا تترَأف عيني عليهم، ولا أعفو، وإن استغاثوا بصوت عال لا أستجيب لهم»."]]}, {"l": "Eze 9:5", "n": "", "vs": [[5, "ثم قال للستة الآخرين على مسمعي: «اعبروا في المدينة خلفه واقتلوا. لا تترَأف عيونكم ولا تعفوا."]]}, {"l": "Eze 9:10", "n": "", "vs": [[10, "لذلك أنا أيضا لا تترَأف عيني ولا أعفو، إنما أوقع ذنب تصرفاتهم على رؤوسهم»."]]}, {"l": "Zec 11:6", "n": "", "vs": [[6, "ويقول الرب: «لذلك لا أشفق بعد على سكان الأرض، بل أنا أسلم كل واحد إلى قريبه أو مالكه، فيهلكون الناس ولا أنقذ أحدا من أيديهم»."]]}], "kwAr": "قتلتهم", "noteAr": ""}], "arS": [["قد ", []], ["انطرح", ["H7901"]], [" ", []], ["الصبي", ["H5288"]], [" ", []], ["والشيوخ", ["H2205"]], [" في غبار ", []], ["الطرقات", ["H2351"]], [". ", []], ["سقط", ["H5307"]], [" ", []], ["عذاراي", ["H1330"]], [" وشباني ", []], ["بالسيف", ["H2719"]], [". قد ", []], ["قتلتهم", ["H2026"]], [" في ", []], ["يوم", ["H3117"]], [" ", []], ["غضبك", ["H639"]], ["، ", []], ["ونحرتهم", ["H2873"]], [" من ", []], ["غير", ["H3808"]], [" ", []], ["رحمة", ["H2550"]], [".", []]]}, {"c": 2, "v": 22, "text": "أنت دعوت، كما في يوم عيد، مروعي المحيطين بي. فلم يفلت ولم ينج أحد في يوم سخطك يارب. قد أفنى عدوي الذين حضنتهم وربيتهم.", "groups": [{"kw": "my terrors", "raw": "Psa_31:13; Isa_24:17, Isa_24:18; Jer_6:25, Jer_20:3, Jer_46:5; Amo_9:1-4", "note": "", "refs": [{"l": "Psa 31:13", "n": "", "vs": [[13, "لأني سمعت المذمة من كثيرين، حتى بات الخوف يطوقني، إذ يتآمرون جميعا علي، عازمين على قتلي."]]}, {"l": "Isa 24:17", "n": "", "vs": [[17, "فالرعب والحفرة والفخ عليكم ياساكني الأرض."]]}, {"l": "Isa 24:18", "n": "", "vs": [[18, "وكل من يهرب من صوت الرعب يقع في الحفرة، ومن يتسلق الحفرة ناجيا يعلق بالفخ، لأن الهلاك يهبط عليكم من السماء، وتتزلزل الأرض تحت أقدامكم."]]}, {"l": "Jer 6:25", "n": "", "vs": [[25, "لا تخرجوا إلى الحقل ولا تمشوا في الطريق، فللعدو سيف، والهول محدق من كل جهة."]]}, {"l": "Jer 20:3", "n": "", "vs": [[3, "وفي اليوم الثاني عندما أخرج فشحور إرميا من المقطرة، قال له إرميا: إن الرب لم يدع اسمك فشحور، بل مجور مسا بيب (أي: رعبا من كل ناحية)."]]}, {"l": "Jer 46:5", "n": "", "vs": [[5, "ولكن مالي أراهم يولون الأدبار مرتعبين؟ قد دحر محاربوهم وفروا مسرعين. لم يلتفتوا إلى الوراء، قد حاصرهم الهول من كل جانب»، يقول الرب."]]}, {"l": "Amo 9:1-4", "n": "", "vs": [[1, "ورأيت السيد واقفا إلى جوار المذبح قائلا: «اضرب تيجان الأعمدة حتى تهتز العتبات، وحطمها على رؤوس جميع الشعب. ومن ينجو منهم أهلكه بالسيف، فلا يهرب منهم أحد ولا يفلت منهم ناج."], [2, "وإن نقبوا لأنفسهم ملجأ في أعماق الهاوية، فإن يدي تطولهم هناك، وإن ارتقوا إلى السماوات فمن هناك أنزلهم."], [3, "وإن اختبأوا في أعالي الكرمل فهناك أبحث عنهم وأعتقلهم. وإن تواروا عني في أعماق البحر فإني آمر هناك الحية فتلدغهم."], [4, "وإن سيقوا إلى السبي أمام أعدائهم ألاحقهم بالسيف لأفنيهم، وأتعقبهم لأبتليهم بالشر لا بالخير»."]]}], "kwAr": "مروعي", "noteAr": ""}, {"kw": "those", "raw": "Deu_28:18; Jer_16:2-4; Hos_9:12-16; Luk_23:29, Luk_23:30", "note": "", "refs": [{"l": "Deu 28:18", "n": "", "vs": [[18, "وتحل اللعنة بأبنائكم وغلات أرضكم ونتاج بقركم ونعاجكم،"]]}, {"l": "Jer 16:2-4", "n": "", "vs": [[2, "«لا تتزوج في هذا الموضع ولا تنجب فيه أبناء ولا بنات»."], [3, "لأن هذا ما يقوله الرب عن الأبناء والبنات المولودين في هذا الموضع، وعن الأمهات والآباء الذين أنجبوهم في هذه البلاد:"], [4, "«سيموتون بالأمراض، فلا يندبون، ولا يدفنون بل يصبحون نفاية مطروحة على وجه الأرض، ويفنون بالسيف والجوع، وتكون جثثهم طعاما لجوارح السماء ولوحوش الأرض."]]}, {"l": "Hos 9:12-16", "n": "", "vs": [[12, "وحتى إن أنجبوا أولادا فإني أحرمكم منهم حتى لا يبقى منهم أحد. ويل لكم حين أنصرف عنكم."], [13, "مصير أبناء أفرايم، كما أرى، هو الوقوع في قبضة الصياد، لأن أفرايم، يقتاد أبناءه للذبح."], [14, "أعطهم يارب: ولكن ماذا تعطيهم؟ أعطهم نساء ذوات أرحام مسقطة، وأثداء جافة."], [15, "في الجلجال ارتكبوا جميع شرورهم، فكر Hos 13:8", "n": "", "vs": [[8, "وأنقض عليهم كدبة ثاكل، وأمزق قلوبهم أشلاء وأفترسهم هناك كلبوءة، ووحش البر يقطعهم إربا إربا."]]}, {"l": "Amo 5:18-20", "n": "", "vs": [[18, "ويل للذين يتشوقون ليوم الرب. لماذا تطلبون مجيء يوم الرب؟ فيوم الرب هو ظلمة لا نور."], [19, "فتكونون كرجل هرب من وجه أسد فلقيه دب، أو كمن دخل إلى بيت واتكأ بيده على حائط فلدغته أفعى."], [20, "أو ليس يوم الرب ظلمة لا نورا، وقتاما خاليا من الضياء؟"]]}], "kwAr": "هو لي كدب متربص", "noteAr": ""}, {"kw": "in secret", "raw": "Psa_10:9, Psa_17:12", "note": "", "refs": [{"l": "Psa 10:9", "n": "", "vs": [[9, "يكمن في الخفاء، كأسد في عرينه ليخطف المسكين ويجره في شبكته."]]}, {"l": "Psa 17:12", "n": "", "vs": [[12, "الشرير كأسد متلهف للافتراس، وكالشبل الكامن في مخبئه."]]}], "kwAr": "في مكمنه", "noteAr": ""}], "arS": [["هو", ["H1931"]], [" لي ", []], ["كدب", ["H1677"]], [" ", []], ["متربص", ["H693"]], ["، ", []], ["وكأسد", ["H738"]], [" مترصد في ", []], ["مكمنه", ["H4565"]], [".", []]]}, {"c": 3, "v": 11, "text": "أضل طرقي ومزقني إربا. دمرني.", "groups": [{"kw": "pulled", "raw": "Job_16:12, Job_16:13; Psa_50:22; Jer_5:6, Jer_51:20-22; Dan_2:40-44, Dan_7:23; Mic_5:8; Hos_6:1", "note": "", "refs": [{"l": "Job 16:12", "n": "", "vs": [[12, "كنت مطمئنا مستقرا، فزعزعني الرب وقبض علي من عنقي، وحطمني ونصبني له هدفا."]]}, {"l": "Job 16:13", "n": "", "vs": [[13, "حاصرني رماته وشق كليتي من غير رحمة، أهرق مرارتي على الأرض."]]}, {"l": "Psa 50:22", "n": "", "vs": [[22, "والآن تنبهوا أيها الناسون الله ، لئلا أمزقكم وليس من ينقذكم."]]}, {"l": "Jer 5:6", "n": "", "vs": [[6, "لذلك ينقض عليهم أسد من الغاب ويقتلهم، ويفترسهم ذئب من الصحراء، ويكمن النمر حول مدنهم، فيمزق إربا كل من يخرج منهم، لأن آثامهم كثيرة، وارتداداتهم متعاظمة."]]}, {"l": "Jer 51:20-22", "n": "", "vs": [[20, "أنت فأس معركتي وآلة حربي. بك أمزق الأمم إربا وأحطم ممالك."], [21, "بك أجعل الفرس وفارسها أشلاء، وأهشم المركبة وراكبها."], [22, "بك أحطم الرجل والمرأة، والشيخ والفتى، والشاب والعذراء."]]}, {"l": "Dan 2:40-44", "n": "", "vs": [[40, "ثم تعقبها مملكة رابعة صلبة كالحديد، فتحطم وتسحق كل تلك الممالك كالحديد الذي يدق ويسحق كل شيء."], [41, "وكما رأيت أن القدمين والأصابع هي خليط من خزف وحديد، فإن المملكة تكون منقسمة فيكون فيها من قوة الحديد، بمقدار ما شاهدت فيها من الحديد مختلطا بالخزف."], [42, "وكما أن أصابع القدمين بعضها من حديد والبعض من خزف، فإن بعض المملكة يكون صلبا والبعض الآخر هشا."], [43, "وكما رأيت الحديد مختلطا بخزف الطين، فإن هذه المملكة تعقد صلات زواج مع ممالك الناس الأخرى، إنما لا يلتحمون معا، كما أن الحديد لا يختلط بالخزف."], [44, "وفي عهد هؤلاء الملوك يقيم إله السماوات مملكة لا تنقرض إلى الأبد، ولا يترك ملكها لشعب آخر، وتسحق وتبيد جميع هذه الممالك. أما هي فتخلد إلى الأبد."]]}, {"l": "Dan 7:23", "n": "", "vs": [[23, "فأجاب: إن الحيوان الرابع هو رمز للمملكة الرابعة على الأرض، وهي تختلف عن سائر الممالك لأنها تستولي على كل الأرض وتخضعها وتسحقها."]]}, {"l": "Mic 5:8", "n": "", "vs": [[8, "وتكون بقية ذرية يعقوب بين الشعوب الكثيرة كأسد بين وحوش الغابة، أو كشبل بين قطعان الغنم، الذي إن اقتحم يدوس ويفترس وليس من منقذ."]]}, {"l": "Hos 6:1", "n": "", "vs": [[1, "«تعالوا نرجع إلى الرب. هو الذي مزقنا إربا إربا، وهو وحده يبرئنا. هو الذي ضربنا، وهو وحده الذي يجبرنا."]]}], "kwAr": "مزقني إربا", "noteAr": ""}, {"kw": "he hath made", "raw": "Lam_1:13; Job_16:7; Isa_3:26; Jer_6:8, Jer_9:10,Jer_9:11, Jer_19:8, Jer_32:43; Mat_23:38; Rev_18:19", "note": "", "refs": [{"l": "Lam 1:13", "n": "", "vs": [[13, "من العلاء صب نارا في عظامي فسرت فيها. نصب شركا لقدمي فردني إلى الوراء. جعلني أطلالا أئن طول النهار."]]}, {"l": "Job 16:7", "n": "", "vs": [[7, "إن الله قد مزقني حقا وأهلك كل قومي."]]}, {"l": "Isa 3:26", "n": "", "vs": [[26, "فتنوح عليهم أبواب المدينة وتنطرح على الأرض مهجورة."]]}, {"l": "Jer 6:8", "n": "", "vs": [[8, "فاحذري ياأورشليم لئلا أجفوك وأجعلك موحشة وأرضا مهجورة»."]]}, {"l": "Jer 9:10", "n": "", "vs": [[10, "سأنتحب وأنوح على الجبال وأندب على مراعي البرية لأنها احترقت وأوحشت، فلا يجتاز بها عابر ولا يتردد فيها صوت القطعان، وقد هجرتها طيور السماء والوحوش."]]}, {"l": "Jer 9:11", "n": "", "vs": [[11, "«سأجعل أورشليم رجمة خراب، ومأوى لبنات آوى، وأحول مدن يهوذا إلى قفر مهجور»."]]}, {"l": "Jer 19:8", "n": "", "vs": [[8, "وأدمر هذه المدينة وأجعلها مثار صفير. كل من يمر بها تعتريه الدهشة ويصفر لما حل بها من نكبات."]]}, {"l": "Jer 32:43", "n": "", "vs": [[43, "فتشترى الحقول في هذه الأرض التي تدعون أنها خربة هجرها الإنسان والحيوان، وقد استولى عليها الكلدانيون."]]}, {"l": "Mat 23:38", "n": "", "vs": [[38, "ها إن بيتكم يترك لكم خرابا!"]]}, {"l": "Rev 18:19", "n": "", "vs": [[19, "ويذرون التراب على رؤوسهم وهم يصرخون باكين منتحبين: الويل، الويل على المدينة العظمى التي اغتنى أصحاب سفن البحر جميعا بفضل ثروتها! ها هي في ساعة واحدة قد زالت!"]]}], "kwAr": "دمرني", "noteAr": ""}], "arS": [["أضل", ["H5493"]], [" ", []], ["طرقي", ["H1870"]], [" ومزقني إربا. ", []], ["دمرني", ["H8074"]], [".", []]]}, {"c": 3, "v": 12, "text": "وتر قوسه ونصبني هدفا لسهمه.", "groups": [{"kw": "bent", "raw": "Job_6:4, Job_7:20, Job_16:12, Job_16:13; Psa_7:12, Psa_7:13, Psa_38:2", "note": "", "refs": [{"l": "Job 6:4", "n": "", "vs": [[4, "لأن سهام القدير ناشبة في، وروحي تشرب من سمها، وأهوال الله متألبة ضدي."]]}, {"l": "Job 7:20", "n": "", "vs": [[20, "إن أخطأت فماذا أفعل لك يارقيب الناس؟ لماذا جعلتني هدفا لك؟ لماذا جعلتني حملا على نفسي؟"]]}, {"l": "Job 16:12", "n": "", "vs": [[12, "كنت مطمئنا مستقرا، فزعزعني الرب وقبض علي من عنقي، وحطمني ونصبني له هدفا."]]}, {"l": "Job 16:13", "n": "", "vs": [[13, "حاصرني رماته وشق كليتي من غير رحمة، أهرق مرارتي على الأرض."]]}, {"l": "Psa 7:12", "n": "", "vs": [[12, "صقل سيفه ليضرب به الشرير الذي لا يتوب. وتر قوسه وهيأها."]]}, {"l": "Psa 7:13", "n": "", "vs": [[13, "أعد له الأسلحة القتالة، وجعل سهامه محرقة."]]}, {"l": "Psa 38:2", "n": "", "vs": [[2, "لأن سهامك قد أصابتني وضرباتك قد ثقلت علي."]]}], "kwAr": "وتر قوسه", "noteAr": ""}], "arS": [["وتر", ["H1869"]], [" ", []], ["قوسه", ["H7198"]], [" ", []], ["ونصبني", ["H5324"]], [" ", []], ["هدفا", ["H4307"]], [" ", []], ["لسهمه", ["H2671"]], [".", []]]}, {"c": 3, "v": 13, "text": "اخترق كليتي بنبال جعبته.", "groups": [{"kw": "arrows", "raw": "Heb. sons, Deu_32:23; Job_6:4, Job_41:28", "note": "Heb. sons, Deu_32:23; Job_6:4, Job_41:28", "refs": [{"l": "Deu 32:23", "n": "", "vs": [[23, "أكوم عليهم شرورا وأنفذ سهامي فيهم."]]}, {"l": "Job 6:4", "n": "", "vs": [[4, "لأن سهام القدير ناشبة في، وروحي تشرب من سمها، وأهوال الله متألبة ضدي."]]}, {"l": "Job 41:28", "n": "", "vs": [[28, "لا يرغمه السهم على الفرار، وحجارة المقلاع لديه كالقش."]]}], "kwAr": "بنبال جعبته", "noteAr": "بالعبرانية: بنو. انظر تث 32: 23؛ أي 6: 4؛ 41: 28"}], "arS": [["اخترق", ["H935"]], [" ", []], ["كليتي", ["H3629"]], [" ", []], ["بنبال", ["H1121"]], [" ", []], ["جعبته", ["H827"]], [".", []]]}, {"c": 3, "v": 14, "text": "صرت مثار هزء لشعبي وأهجية لهم اليوم كله.", "groups": [{"kw": "", "raw": "Lam_3:63; Neh_4:2-4; Job_30:1-9; Psa_22:6, Psa_22:7, Psa_35:15, Psa_35:16, Psa_44:13, Psa_69:11, Psa_69:12; Psa_79:4, Psa_123:3, Psa_123:4, Psa_137:3; Jer_20:7, Jer_48:27; Mat_27:39-44; 1Co_4:9-13", "note": "", "refs": [{"l": "Lam 3:63", "n": "", "vs": [[63, "راقب جلوسهم وقيامهم، فقد أصبحت أهجية لهم."]]}, {"l": "Neh 4:2-4", "n": "", "vs": [[2, "وتساءل أمام أقربائه وجيش السامرة: «أي شيء يفعله هؤلاء اليهود الضعفاء؟ هل في وسعهم أن يعيدوا بناء السور؟ هل يعودون لتقريب الذبائح؟ هل يكملون البناء في يوم واحد؟ هل يحيون الحجارة من أكوام الركام وهي محترقة؟»"], [3, "وكان طوبيا العموني واقفا إلى جواره، فقال: «إن ما يبنونه إذا صعد عليه ثعلب فإنه يهدم حجارة سورهم»."], [4, "فصليت إلى الرب: «استمع ياإلهنا، لأننا قد أصبحنا مثار احتقار، واجعل تعييرهم يرتد على رؤوسهم وليصيروا غنيمة في أرض السبي."]]}, {"l": "Job 30:1-9", "n": "", "vs": [[1, "أما الآن فقد هزأ بي من هم أصغر مني سنا، ممن كنت آنف أن أجعل آباءهم مع كلاب غنمي."], [2, "إذ ما جدوى قوة أيديهم لي بعد أن نضب عنفوانهم؟"], [3, "يهيمون هزالى جياعا، ينبشون اليابسة الخربة المهجورة."], [4, "يلتقطون الملاح بين العليق، وخبزهم عروق الرتم."], [5, "يطردون من بين الناس، ويصرخون خلفهم كما يصرخون على لص."], [6, "يقيمون في كهوف الوديان الجافة، بين الصخور وفي ثقوب الأرض."], [7, "ينهقون بين العليق، ويربضون تحت العوسج."], [8, "هم حمقى، أبناء قوم خاملين منبوذين من الأرض."], [9, "أما الآن فقد أصبحت مثار سخرية لهم ومثلا يتندرون به"]]}, {"l": "Psa 22:6", "n": "", "vs": [[6, "أما أنا فدودة لا إنسان. عار في نظر البشر، ومنبوذ في عيني شعبي."]]}, {"l": "Psa 22:7", "n": "", "vs": [[7, "جميع الذين يرونني يستهزئون بي، يفتحون شفاههم علي بالباطل، ويهزون رؤوسهم قائلين:"]]}, {"l": "Psa 35:15", "n": "", "vs": [[15, "وأما هم فشمتوا فرحا عند سقطتي، وتجمعوا علي شاتمين، وشرع غرباء لا أعرفهم يضربونني. مزقوني ولم يرتدعوا."]]}, {"l": "Psa 35:16", "n": "", "vs": [[16, "كفجار ماجنين مجتمعين حول وليمة حرقوا علي أسنانهم."]]}, {"l": "Psa 44:13", "n": "", "vs": [[13, "تجعلنا عارا عند جيراننا، ومثار هزء وسخرية لمن حولنا."]]}, {"l": "Psa 69:11", "n": "", "vs": [[11, "اتشحت بالمسوح فصرت عندهم مثلا."]]}, {"l": "Psa 69:12", "n": "", "vs": [[12, "صرت حديث الجالسين في باب المدينة، وأغنية للسكارى."]]}, {"l": "Psa 79:4", "n": "", "vs": [[4, "قد صرنا عارا عند جيراننا، ومثار هزء وأضحوكة لمن حولنا."]]}, {"l": "Psa 123:3", "n": "", "vs": [[3, "ارحمنا يارب، ارحمنا، فقد شبعنا احتقارا."]]}, {"l": "Psa 123:4", "n": "", "vs": [[4, "شبعت نفوسنا كثيرا من هزء المطمئنين وازدراء المتكبرين."]]}, {"l": "Psa 137:3", "n": "", "vs": [[3, "هناك طلب منا الذين سبونا أن نشدو بترنيمة، والذين عذبونا أن نطربهم قائلين: «أنشدوا لنا من ترانيم صهيون»."]]}, {"l": "Jer 20:7", "n": "", "vs": [[7, "يارب قد أقنعتني فاقتنعت، أنت أقوى مني فغلبت، فأصبحت مثار سخرية طوال النهار. كل واحد يستهزيء بي."]]}, {"l": "Jer 48:27", "n": "", "vs": [[27, "ألم يصبح إسرائيل مهزأة لديك؟ أكان بين اللصوص حتى كنت تهز رأسك باحتقار كلما جاء ذكره على لسانك؟"]]}, {"l": "Mat 27:39-44", "n": "", "vs": [[39, "وكان المارة يشتمونه، وهم يهزون رؤوسهم"], [40, "ويقولون: «ياهادم الهيكل وبانيه في ثلاثة أيام، خلص نفسك! إن كنت ابن الله فانزل عن الصليب!»"], [41, "وسخر منه أيضا رؤساء الكهنة والكتبة والشيوخ، قائلين:"], [42, "«خلص غيره؛ أما نفسه فلا يقدر أن يخلص! أهو ملك إسرائيل؟ فلينزل الآن عن الصليب فنؤمن به!"], [43, "توكل على الله، فليخلصه الآن إن كان يريده! فهو قد قال: أنا ابن الله!»"], [44, "وكان اللصان المصلوبان معه يسخران منه بمثل هذا الكلام!"]]}, {"l": "1Co 4:9-13", "n": "", "vs": [[9, "فإني أرى أن الله عرضنا، نحن الرسل، في آخر الموكب كأنه محكوم علينا بالموت، لأننا صرنا معرضا للعالم، للملائكة والبشر معا."], [10, "نحن جهلاء من أجل المسيح، وأنتم حكماء في المسيح. نحن ضعفاء وأنتم أقوياء. أنتم مكرمون ونحن مهانون."], [11, "فما زلنا حتى هذه الساعة نجوع ونعطش، ونعرى ونلطم ونحرم محلا للإقامة"], [12, "ونجهد أنفسنا في الشغل بأيدينا. نتعرض للإهانة فنبارك، وللاضطهاد فنحتمل"], [13, "وللتجريح فنسالم. صرنا كأقذار العالم ونفاية الجميع، ومازلنا!"]]}], "kwAr": "", "noteAr": ""}], "arS": [["صرت", ["H1961"]], [" مثار ", []], ["هزء", ["H7814"]], [" ", []], ["لشعبي", ["H5971"]], [" ", []], ["وأهجية", ["H5058"]], [" لهم ", []], ["اليوم", ["H3117"]], [" ", []], ["كله", ["H3605"]], [".", []]]}, {"c": 3, "v": 15, "text": "أشبعني مرارة، وأرواني أفسنتينا.", "groups": [{"kw": "filled", "raw": "Lam_3:19; Rth_1:20; Job_9:18; Psa_60:3; Isa_51:17-22; Jer_9:15, Jer_23:15; Jer_25:15-18, Jer_25:27", "note": "", "refs": [{"l": "Lam 3:19", "n": "", "vs": [[19, "اذكر بليتي وتيهاني والأفسنتين والمرارة."]]}, {"l": "Rut 1:20", "n": "", "vs": [[20, "فقالت لهم: «لا تدعوني نعمي بل مرة، لأن الله القدير قد مرر حياتي."]]}, {"l": "Job 9:18", "n": "", "vs": [[18, "لا يدعني ألتقط أنفاسي بل يشبعني مرائر."]]}, {"l": "Psa 60:3", "n": "", "vs": [[3, "جعلت شعبك يعاني المشقات. وترنحنا تحت وقع ضرباتك كالسكارى."]]}, {"l": "Isa 51:17-22", "n": "", "vs": [[17, "استيقظي، استيقظي، انهضي ياأورشليم، يامن تجرعت من يد الرب كأس غضبه، يامن شربت ثمالة كأس الترنح."], [18, "لم يكن بين أبنائها الذين أنجبتهم من يهديها، ولا من يأخذ بيدها من كل البنين الذين ربتهم."], [19, "لقد ابتليت بهاتين المحنتين، فمن يرثي لك: التدمير والخراب، والمجاعة والسيف، فمن يعزيك؟"], [20, "قد أعيا أبناؤك وانطرحوا عند رأس كل شارع كوعل وقع في شبكة. امتلأوا من غضب الرب ومن زجر إلهك."], [21, "لذلك اسمعي هذا أيتها المنكوبة، والسكرى ولكن من غير خمر."], [22, "هذا ما يقوله سيدك الرب، إلهك الذي يدافع عن دعوى شعبه: ها أنا قد أخذت من يدك كأس الترنح، ولن تجرعي من كأس غضبي بعد."]]}, {"l":  قدم في مكانك المقدس حتى تنير أعيننا وتمنحنا بعض الحياة في عبوديتنا."]]}, {"l": "Ezr 9:9", "n": "", "vs": [[9, "ومع أننا عبيد لم تتخل عنا في عبوديتنا، بل ظللتنا بالرحمة أمام ملوك فارس ومنحتنا حياة لنبني هيكلا ونرمم خرائبه ونتمتع بالحماية في يهوذا وفي أورشليم."]]}, {"l": "Ezr 9:13-15", "n": "", "vs": [[13, "والآن بعد كل ما جرى علينا من جراء أعمالنا السيئة وآثامنا العظيمة، نعلم أنك عاقبتنا ياإلهنا بأقل من آثامنا، ووهبتنا نجاة مثل هذه."], [14, "أنعود بعد ذلك ونتعدى على وصاياك ونصاهر الأمم الذين يرتكبون هذه الرجاسات؟ ألا تسخط علينا آنئذ حتى تفنينا فلا تبقى منا بقية ولا نجاة؟"], [15, "أيها الرب إله إسرائيل، أنت عادل لأننا مازلنا بقية ناجية إلى هذا اليوم، وها نحن نمثل أمامك في آثامنا، مع أنه لا حق لنا في ذلك»."]]}, {"l": "Neh 9:31", "n": "", "vs": [[31, "ولكن من أجل مراحمك العميمة لم تبدهم، ولم تتخل عنهم، لأنك إله حنان رحيم."]]}, {"l": "Psa 78:38", "n": "", "vs": [[38, "لكنه كان رحيما، فعفا عن الإثم ولم يهلكهم. وكثيرا ما كبح غضبه عنهم ولم يضرم كل سخطه."]]}, {"l": "Psa 106:45", "n": "", "vs": [[45, "تذكر عهده لهم ورق لهم حسب كثرة رحمته،"]]}, {"l": "Eze 20:8", "n": "", "vs": [[8, "ولكنهم تمردوا علي ولم يسمعوا لي، ولم يتركوا الأرجاس التي تنجس عيونهم، ولم يهجروا أصنام مصر. فقلت: سأسكب عليهم غضبي وأنفث فيهم كامل سخطي في وسط ديار مصر."]]}, {"l": "Eze 20:9", "n": "", "vs": [[9, "غير أني تصرفت على غير ذلك إكراما لاسمي، لئلا يتنجس أمام عيون الأمم التي يسكن شعب إسرائيل بينها. إذ أعلنت نفسي أمام عيون الأمم حين أخرجت شعب إسرائيل من ديار مصر."]]}, {"l": "Eze 20:13", "n": "", "vs": [[13, "لكن شعب إسرائيل تمردوا علي في البرية ولم يمارسوا فرائضي، وتنكروا لأحكامي التي إن عمل بها إنسان يحيا، ونجسوا أيام سبوتي كثيرا. فقلت: سأسكب غضبي عليهم في البرية لأميتهم."]]}, {"l": "Eze 20:14", "n": "", "vs": [[14, "لكنني تصرفت على غير ذلك إكراما لاسمي، لئلا يتنجس أمام عيون الأمم التي أخرجت شعب إسرائيل على مشهد منها."]]}, {"l": "Eze 20:21", "n": "", "vs": [[21, "فتمرد الأبناء علي. لم يسلكوا في فرائضي ولم يحفظوا أحكامي ليعملوها التي إن عملها إنسان يحيا بها، ونجسوا سبوتي. فقلت إني أسكب غضبي عليهم لأتم سخطي عليهم في البرية."]]}, {"l": "Eze 20:22", "n": "", "vs": [[22, "ولكني كففت يدي عنهم وتصرفت على غير ذلك إكراما لاسمي، لئلا يتنجس أمام عيون الأمم التي أخرجت شعب إسرائيل على مشهد منها."]]}, {"l": "Mal 3:6", "n": "", "vs": [[6, "فإني أنا الرب لا أتغير، لذلك أنتم أيضا لم تفنوا ياأبناء يعقوب."]]}], "kwAr": "من إحسانات الرب", "noteAr": ""}, {"kw": "because", "raw": "Psa_77:8, Psa_86:15; Mic_7:18, Mic_7:19; Luk_1:50", "note": "", "refs": [{"l": "Psa 77:8", "n": "", "vs": [[8, "هل انتهت رحمته إلى الأبد؟ هل انقطعت عنا مواعيده؟"]]}, {"l": "Psa 86:15", "n": "", "vs": [[15, "إنما أنت يارب إله رحيم ورؤوف وبطيء الغضب ووافر الرحمة والحق."]]}, {"l": "Mic 7:18", "n": "", "vs": [[18, "إي إله مثلك يصفح عن الإثم ويعفو عن معصية بقية ميراثه؟ لا يحتفظ إلى الأبد بغضبه لأنه يسر بالرحمة."]]}, {"l": "Mic 7:19", "n": "", "vs": [[19, "يعود يرحمنا ويطأ ذنوبنا بقدميه، ويطرح معاصينا إلى أعماق البحر."]]}, {"l": "Luk 1:50", "n": "", "vs": [[50, "ورحمته للذين يتقونه جيلا بعد جيل."]]}], "kwAr": "لأن مراحمه لا تزول", "noteAr": ""}], "arS": [["من ", []], ["إحسانات", ["H2617"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["أننا", ["H3588"]], [" ", []], ["لم", ["H3808"]], [" ", []], ["نفن", ["H8552"]], ["، ", []], ["لأن", ["H3588"]], [" ", []], ["مراحمه", ["H7356"]], [" ", []], ["لا", ["H3808"]], [" ", []], ["تزول", ["H3615"]], [".", []]]}, {"c": 3, "v": 23, "text": "تتجدد في كل صباح. فائقة أمانتك.", "groups": [{"kw": "new", "raw": "Psa_30:5; Isa_33:2; Zep_3:5", "note": "", "refs": [{"l": "Psa 30:5", "n": "", "vs": [[5, "فإن غضبه يدوم للحظة، أما رضاه فمدى الحياة. يبقى البكاء لليلة، أما في الصباح فيعم الابتهاج."]]}, {"l": "Isa 33:2", "n": "", "vs": [[2, "يارب ارحمنا. إياك انتظرنا، كن عضدنا في الصباح، وخلاصنا في أثناء المحنة."]]}, {"l": "Zep 3:5", "n": "", "vs": [[5, "ولكن الرب ما برح صديقا في وسطها، لا يرتكب خطأ، ويبدي في كل صباح عدله وفي كل فجر حقه. لا يخفق قط؛ أما الأثيم فلا يعرف ما هو الخزي."]]}], "kwAr": "تتجدد في كل صباح", "noteAr": ""}, {"kw": "great", "raw": "Exo_34:6; Psa_36:5, Psa_89:1, Psa_89:2, Psa_89:33, Psa_146:6; Tit_1:2; Heb_6:18, Heb_10:23", "note": "", "refs": [{"l": "Exo 34:6", "n": "", "vs": [[6, "وعبر من أمام موسى مناديا: «أنا الرب. الرب إله رؤوف رحيم، بطيء الغضب وكثير الإحسان والوفاء."]]}, {"l": "Psa 36:5", "n": "", "vs": [[5, "يارب، إن رحمتك في السماوات، وأمانتك تبلغ الغيوم."]]}, {"l": "Psa 89:1", "n": "", "vs": [[1, "أترنم بمراحم الرب إلى الأبد، وأعلن بفمي أمانتك من جيل إلى جيل،"]]}, {"l": "Psa 89:2", "n": "", "vs": [[2, "لأني قلت إن مراحمك ثابتة إلى الأبد، وقد ثبت في السماوات أمانتك."]]}, {"l": "Psa 89:33", "n": "", "vs": [[33, "ولكني لا أنزع رحمتي عنه، ولا أنكث وعدي."]]}, {"l": "Psa 146:6", "n": "", "vs": [[6, "خالق السماوات والأرض والبحر وكل ما فيها، الأمين إلى الأبد."]]}, {"l": "Tit 1:2", "n": "", "vs": [[2, "في رجاء الحياة الأبدية، التي وعد بها الله المنزه عن الكذب، من قبل أزمنة الأزل،"]]}, {"l": "Heb 6:18", "n": "", "vs": [[18, "فاستنادا إلى وعد الله وقسمه، وهما أمران ثابتان لا يتغيران ويستحيل أن يكذب الله فيهما، نحصل على تشجيع قوي، بعدما التجأنا إلى التمسك بالرجاء الموضوع أمامنا."]]}, {"l": "Heb 10:23", "n": "", "vs": [[23, "ولنتمسك دائما بالرجاء الذي نعترف به، دون أن نشك في أنه سيتحقق، لأن الذي وعدنا بتحقيقه، هو أمين وصادق."]]}], "kwAr": "فائقة أمانتك", "noteAr": ""}], "arS": [["تتجدد", ["H2319"]], [" في كل ", []], ["صباح", ["H1242"]], [". ", []], ["فائقة", ["H7227"]], [" ", []], ["أمانتك", ["H530"]], [".", []]]}, {"c": 3, "v": 24, "text": "تقول نفسي: «الرب هو نصيبي فلذلك أرجوه».", "groups": [{"kw": "my portion", "raw": "Psa_16:5, Psa_73:26, Psa_119:57, Psa_142:5; Jer_10:16, Jer_51:19", "note": "", "refs": [{"l": "Psa 16:5", "n": "", "vs": [[5, "الرب نصيبي وميراثي وكأس ارتوائي. أنت حافظ قسمتي."]]}, {"l": "Psa 73:26", "n": "", "vs": [[26, "إن جسدي وقلبي يفنيان، أما الله فهو صخرة قلبي ونصيبي إلى الدهر."]]}, {"l": "Psa 119:57", "n": "", "vs": [[57, "أنت يارب نصيبي، فأعدك بطاعة شريعتك."]]}, {"l": "Psa 142:5", "n": "", "vs": [[5, "إياك دعوت يارب قائلا: أنت ملجإي، أنت نصيبي في أرض الأحياء."]]}, {"l": "Jer 10:16", "n": "", "vs": [[16, "أما (الله ) نصيب يعقوب فليس مثل هذه الأوثان، بل هو جابل كل الأشياء، وشعب إسرائيل هو شعب ميراثه، واسمه الرب القدير."]]}, {"l": "Jer 51:19", "n": "", "vs": [[19, "أما نصيب يعقوب فليس مثل هذه الأوثان، بل هو جابل كل الأشياء. وشعب إسرائيل هو سبط ميراثه، واسمه الرب القدير."]]}], "kwAr": "الرب هو نصيبي", "noteAr": ""}, {"kw": "therefore", "raw": "Lam_3:21; 1Sa_30:6; 1Ch_5:20; Job_13:15; Psa_31:24, Psa_33:18, Psa_42:11, Psa_43:5; Psa_62:8, Psa_84:12, Psa_130:7; Rom_15:12; 1Pe_1:21", "note": "", "refs": [{"l": "Lam 3:21", "n": "", "vs": [[21, "ولكن هذا ما أناجي به نفسي، لذلك يغمرني الرجاء:"]]}, {"l": "1Sa 30:6", "n": "", "vs": [[6, "وتفاقم ضيق داود لأن الرجال، من فرط ما حل بهم من مرارة وأسى على أبنائهم وبناتهم، طالبوا برجمه، غير أن داود تشبث وتقوى بالرب إلهه."]]}, {"l": "1Ch 5:20", "n": "", "vs": [[20, "فانتصروا عليهم وظفروا بالهاجريين وحلفائهم، لأنهم استعانوا بالرب في أثناء القتال واتكلوا عليه فاستجاب لهم."]]}, {"l": "Job 13:15", "n": "", "vs": [[15, "فها هو حتما يقضي علي ولا أمل لي. ومع ذلك فإني أبسط حجتي لأزكي طريقي أمامه."]]}, {"l": "Psa 31:24", "n": "", "vs": [[24, "لتتقو ولتتشجع قلوبكم ياجميع المنتظرين الرب."]]}, {"l": "Psa 33:18", "n": "", "vs": [[18, "هوذا عين الرب على خائفيه، المتكلين على رحمته،"]]}, {"l": "Psa 42:11", "n": "", "vs": [[11, "لماذا أنت مكتئبة يانفسي، ولماذا أنت قلقة؟ ترجي الله ، فإني سأظل أحمده، لأنه عوني وإلهي."]]}, {"l": "Psa 43:5", "n": "", "vs": [[5, "لماذا أنت مكتئبة يانفسي؟ لماذا أنت قلقة في داخلي؟ ترجي الله فإني سأظل أحمده، لأنه عوني وإلهي."]]}, {"l": "Psa 62:8", "n": "", "vs": [[8, "ثقوا به في كل حين أيها الشعب. اسكبوا أمامه قلوبكم، الله ملجأنا."]]}, {"l": "Psa 84:12", "n": "", "vs": [[12, "يارب الجنود، طوبى للإنسان المتكل عليك."]]}, {"l": "Psa 130:7", "n": "", "vs": [[7, "ليترج إسرائيل الرب، لأن منه الرحمة والفداء الكثير."]]}, {"l": "Rom 15:12", "n": "", "vs": [[12, "ويقول إشعياء أيضا: «سيطلع أصل يسى، والقائم، ليسود على الأمم: عليه تعلق الشعوب الرجاء»."]]}, {"l": "1Pe 1:21", "n": "", "vs": [[21, "أنتم الذين تؤمنون بالله بالمسيح الذي أقامه من الموت وأعطاه المجد، حتى يكون الله غاية إيمانكم ورجائكم."]]}], "kwAr": "فلذلك أرجوه", "noteAr": ""}], "arS": [["تقول", ["H559"]], [" ", []], ["نفسي", ["H5315"]], [": «", []], ["الرب", ["H3068"]], [" هو ", []], ["نصيبي", ["H2506"]], [" ", []], ["فلذلك", ["H3651"]], [" ", []], ["أرجوه", ["H3176"]], ["».", []]]}, {"c": 3, "v": 25, "text": "الرب صالح لمن يرجونه وللنفس التي تلتمسه.", "groups": [{"kw": "good", "raw": "Lam_3:26; Gen_49:18; Psa_25:8, Psa_27:14, Psa_37:7, Psa_37:34, Psa_39:7, Psa_40:1-5, Psa_61:1, Psa_61:5; Psa_130:5, Psa_130:6; Isa_25:9, Isa_30:18, Isa_40:31, Isa_64:4; Mic_7:7, Mic_7:8; Zep_3:8; 1Th_1:10; Jam_5:7", "note": "", "refs": [{"l": "Lam 3:26", "n": "", "vs": [[26, "خير للمرء أن ينتظر بصمت خلاص الرب."]]}, {"l": "Gen 49:18", "n": "", "vs": [[18, "إنني انتظرت خلاصك يارب."]]}, {"l": "Psa 25:8", "n": "", "vs": [[8, "الرب صالح ومستقيم لذلك يهدي الضالين الطريق."]]}, {"l": "Psa 27:14", "n": "", "vs": [[14, "انتظر الرب. تقو وليتشجع قلبك. وانتظر الرب دائما."]]}, {"l": "Psa 37:7", "n": "", "vs": [[7, "اسكن أمام الرب وانتظره بصبر، ولا تغر من الذي ينجح في مسعاه، بفضل مكائده."]]}, {"l": "Psa 37:34", "n": "", "vs": [[34, "انتظر الرب واسلك دائما في طريقه، فيرفعك لتمتلك الأرض، وتشهد انقراض الأشرار."]]}, {"l": "Psa 39:7", "n": "", "vs": [[7, "والآن، فأي شيء أنتظر يارب؟ إنما فيك رجائي."]]}, {"l": "Psa 40:1-5", "n": "", "vs": [[1, "انتظرت الرب صابرا، فالتفت إلي وسمع صراخ استغاثتي،"], [2, "وانتشلني من هوة الهلاك، من طين المستنقع. وأوقف قدمي على أرض صخرية، فصرت أمشي بخطوات ثابتة."], [3, "وضع في فمي ترنيمة جديدة، قصيدة تسبيح لإلهنا. يرى ذلك كثيرون فيخافون الرب."], [4, "طوبى لرجل وضع في الرب ثقته، ولم يلتفت إلى المتكبرين والمنحرفين إلى الكذب."], [5, "أيها الرب إلهي، ما أكثر أعمالك العجيبة. إن تحدثت عن خططك الرائعة لنا فلن أقدر أن أحصيها. زادت عن أن تعد."]]}, {"l": "Psa 61:1", "n": "", "vs": [[1, "استمع ياالله إلى صراخي واصغ إلى صلاتي."]]}, {"l": "Psa 61:5", "n": "", "vs": [[5, "لأنك أنت ياالله قد استمعت إلى نذوري. أعطيتني ميراثا كميراث الذين يتقون اسمك."]]}, {"l": "Psa 130:5", "n": "", "vs": [[5, "انتظرتك يارب. نفسي تنتظرك، وفي كلمتك رجائي."]]}, {"l": "Psa 130:6", "n": "", "vs": [[6, "نفسي تنتظر الرب بلهفة أكثر من لهفة الحراس مترقبي الصبح."]]}, {"l": "Isa 25:9", "n": "", "vs": [[9, "ويقولون في ذلك اليوم: «ها هو إلهنا الذي انتظرناه فخلصنا. هذا هو الرب الذي انتظرناه نبتهج ونفرح بخلاصه»."]]}, {"l": "Isa 30:18", "n": "", "vs": [[18, "ومع ذلك فإن الرب ينتطر حتى يبدي نحوكم عطفه، لهذا يقوم ليرحمكم، لأن الرب هو إله عدل، فطوبى لجميع الذين ينتظرونه."]]}, {"l": "Isa 40:31", "n": "", "vs": [[31, "أما الراجون الرب فإنهم يجددون قوتهم، ويحلقون بأجنحة النسور. يركضون ولا يعيون. يمشون ولا يتعبون."]]}, {"l": "Isa 64:4", "n": "", "vs": [[4, "منذ الأزل لم يسمع أحد ولم تصغ أذن ولم تر عين إلها سواك يجري ما تصنعه للذين ينتظرونك."]]}, {"l": "Mic 7:7", "n": "", "vs": [[7, "أما أنا فأرتقب الرب وأنتظر إله خلاصي فيسمعني إلهي."]]}, {"l": "Mic 7:8", "n": "", "vs": [[8, "لا تشمتي بي ياعدوتي، لأني إن سقطت أقوم، وإن جلست في الظلمة يكون الرب نورا لي."]]}, {"l": "Zep 3:8", "n": "", "vs": [[8, "لذلك يقول الرب: انتظروني لأني عزمت في اليوم الذي أقوم فيه كشاهد أن أجمع الأمم وأحشد الممالك لأسكب عليهم سخطي واحتدام غضبي، لأن الأرض بكاملها ستؤكل بنار غيرة غيظي."]]}, {"l": "1Th 1:10", "n": "", "vs": [[10, "وتنتظروا من السماوات ابنه الذي أقامه من بين الأموات، يسوع مخلصنا من الغضب الآتي."]]}, {"l": "Jam 5:7", "n": "", "vs": [[7, "وأما أنتم، ياإخوتي، فاصبروا منتظرين عودة الرب. خذوا العبرة من الفلاح: فهو ينتظر أن تعطيه الأرض غلالا ثمينة، صابرا على الزرع حتى يشرب من مطر الخريف ومطر الربيع."]]}], "kwAr": "الرب صالح", "noteAr": ""}, {"kw": "unto", "raw": "1Ch_28:9; 2Ch_15:2, 2Ch_19:3, 2Ch_30:19, 2Ch_31:21; Psa_22:26, Psa_27:8, Psa_69:32, Psa_105:3; Psa_119:2; Isa_26:9, Isa_55:6; Hos_10:12", "note": "", "refs": [{"l": "1Ch 28:9", "n": "", "vs": [[9, "أما أنت ياابني سليمان، فاعرف إله أبيك واعبده بكمال قلب، وبنفس راغبة، لأن الرب يتفحص جميع القلوب، ويفهم كل تصور وفكر. فإن طلبته تجده، وإن تركته ينبذك إلى الأبد."]]}, {"l": "2Ch 15:2", "n": "", "vs": [[2, "فتوجه للقاء آسا وقال له: «اسمع لي ياآسا وياجميع أبناء يهوذا وبنيامين: الرب معكم ما برحتم معه، فإن طلبتموه يوجد لكم، وإن تخليتم عنه ينبذكم."]]}, {"l": "2Ch 19:3", "n": "", "vs": [[3, "ولكن فيك أمورا صالحة، فقد استأصلت تماثيل عشتاروث من الأرض، وأعددت قلبك لطلب الله»."]]}, {"l": "2Ch 30:19", "n": "", "vs": [[19, "عن كل من أعد قلبه لطلب الرب إله آبائه، حتى لو لم يكن طاهرا وفق فرائض التطهير التي نصت عليها أحكام الهيكل»."]]}, {"l": "2Ch 31:21", "n": "", "vs": [[21, "وكل ما قام به في خدمة بيت الله كان طاعة للشريعة والوصية، وسعيا وراء طلب الله، بكل ولاء، فأفلح."]]}, {"l": "Psa 22:26", "n": "", "vs": [[26, "يأكل الودعاء ويشبعون، وطالبو الرب يسبحونه. تحيا قلوبكم إلى الأبد."]]}, {"l": "Psa 27:8", "n": "", "vs": [[8, "قلت: اطلبوا وجهي! فوجهك يارب أطلب."]]}, {"l": "Psa 69:32", "n": "", "vs": [[32, "يرى الودعاء ذلك فيفرحون. وتحيا نفوسكم ياطالبي الله."]]}, {"l": "Psa 105:3", "n": "", "vs": [[3, "تباهوا باسمه القدوس، لتفرح قلوب طالبي الرب."]]}, {"l": "Psa 119:2", "n": "", "vs": [[2, "طوبى لمن يحفظون وصايا الرب، الذين يطلبونه بكل القلب،"]]}, {"l": "Isa 26:9", "n": "", "vs": [[9, "تتوق إليك نفسي في الليل، وفي الصباح تشتاق إليك روحي. عندما تسود أحكامك في الأرض يتعلم أهلها العدل."]]}, {"l": "Isa 55:6", "n": "", "vs": [[6, "اطلبوا الرب مادام موجودا، ادعوه وهو قريب."]]}, {"l": "Hos 10:12", "n": "", "vs": [[12, "ازرعوا لأنفسكم بذار البر، فتحصدوا بمقتضاه ثمار الرحمة، احرثوا لكم حرثا لأن هذا أوان التماس الرب، حتى يأتي ويمطر عليكم غيوث صلاحه."]]}], "kwAr": "لمن يرجونه", "noteAr": ""}], "arS": [["الرب", ["H3068"]], [" ", []], ["صالح", ["H2896"]], [" لمن ", []], ["يرجونه", ["H6960"]], [" ", []], ["وللنفس", ["H5315"]], [" التي ", []], ["تلتمسه", ["H1875"]], [".", []]]}, {"c": 3, "v": 26, "text": "خير للمرء أن ينتظر بصمت خلاص الرب.", "groups": [{"kw": "good", "raw": "Psa_52:9, Psa_54:6, Psa_73:28, Psa_92:1; Gal_4:18", "note": "", "refs": [{"l": "Psa 52:9", "n": "", "vs": [[9, "أحمدك إلى الأبد على ما فعلت، وأنتظر اسمك الصالح في محضر أتقيائك."]]}, {"l": "Psa 54:6", "n": "", "vs": [[6, "طوعا أذبح لك، وأحمد اسمك يارب لأنه طيب."]]}, {"l": "
