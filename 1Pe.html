<script>window.CATALOG=[{"id": 17, "abbr": "Est", "en": "Esther", "nc": 10, "nv": 167, "refs": 1266, "last": "10:3", "first": "وحدث في أيام أحشويروش، الذي امتد حكمه من الهند إلى كوش، فملك على مئة وسبعة وعشرين إقليما،"}, {"id": 18, "abbr": "Job", "en": "Job", "nc": 42, "nv": 1070, "refs": 10209, "last": "42:17", "first": "عاش في أرض عوص رجل اسمه أيوب، كان صالحا كاملا يتقي الله ويحيد عن الشر."}, {"id": 19, "abbr": "Psa", "en": "Psalms", "nc": 150, "nv": 2461, "refs": 33395, "last": "150:6", "first": "طوبى للإنسان الذي لا يتبع مشورة الأشرار، ولا يقف في طريق الخاطئين، ولا يجالس المستهزئين."}, {"id": 20, "abbr": "Pro", "en": "Proverbs", "nc": 31, "nv": 915, "refs": 10457, "last": "31:31", "first": "هذه هي أمثال سليمان بن داود ملك إسرائيل،"}, {"id": 21, "abbr": "Ecc", "en": "Ecclesiastes", "nc": 12, "nv": 222, "refs": 3186, "last": "12:14", "first": "هذه أقوال الجامعة ابن داود ملك أورشليم."}, {"id": 22, "abbr": "Son", "en": "Song of Solomon", "nc": 8, "nv": 117, "refs": 1802, "last": "8:14", "first": "هذا نشيد الأناشيد لسليمان."}, {"id": 23, "abbr": "Isa", "en": "Isaiah", "nc": 66, "nv": 1292, "refs": 21959, "last": "66:24", "first": "هذه هي رؤيا إشعياء بن آموص، التي أعلنت له بشأن يهوذا وأورشليم في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا."}, {"id": 24, "abbr": "Jer", "en": "Jeremiah", "nc": 52, "nv": 1364, "refs": 20659, "last": "52:34", "first": "هذه نبوءة إرميا بن حلقيا أحد الكهنة المقيمين في عناثوث بأرض سبط بنيامين."}, {"id": 25, "abbr": "Lam", "en": "Lamentations", "nc": 5, "nv": 154, "refs": 2238, "last": "5:22", "first": "كيف أصبحت المدينة الآهلة بالسكان مهجورة وحيدة؟ صارت كأرملة! هذه التي كانت عظيمة بين الأمم. السيدة بين المدن صارت تحت الجزية!"}, {"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 48, "nv": 1273, "refs": 15264, "last": "48:35", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 60, "abbr": "1Pe", "en": "1 Peter", "verses": [{"c": 1, "v": 1, "text": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب", "groups": [{"kw": "Peter", "raw": "Mat_4:18, Mat_10:2; Joh_1:41, Joh_1:42, Joh_21:15-17", "note": "", "refs": [{"l": "Mat 4:18", "n": "", "vs": [[18, "وبينما كان يسوع يمشي على شاطيء بحيرة الجليل، رأى أخوين، هما سمعان الذي يدعى بطرس وأندراوس أخوه، يلقيان الشبكة في البحيرة، إذ كانا صيادين."]]}, {"l": "Mat 10:2", "n": "", "vs": [[2, "وهذه أسماء الاثني عشر رسولا: سمعان الذي دعي بطرس، وأندراوس أخوه، ويعقوب بن زبدي، ويوحنا أخوه؛"]]}, {"l": "Joh 1:41", "n": "", "vs": [[41, "فما إن وجد أخاه سمعان، حتى قال له: «وجدنا المسيا» أي المسيح."]]}, {"l": "Joh 1:42", "n": "", "vs": [[42, "واقتاده إلى يسوع. فنظر يسوع مليا إلى سمعان وقال: «أنت سمعان بن يونا، ولكني سأدعوك: صفا» أي صخرا."]]}, {"l": "Joh 21:15-17", "n": "", "vs": [[15, "وبعدما أكلوا سأل يسوع سمعان بطرس: «ياسمعان بن يونا، أتحبني أكثر مما يحبني هؤلاء؟» فأجابه «نعم يارب، أنت تعلم أني أحبك!» فقال له: «أطعم حملاني!»"], [16, "ثم سأله ثانية: «ياسمعان بن يونا، أتحبني؟» فأجابه: «نعم يارب. أنت تعلم أني أحبك!» قال له: «ارع خرافي»"], [17, "فسأله مرة ثالثة: «ياسمعان بن يونا، أتحبني؟» فحزن بطرس لأن يسوع قال له في المرة الثالثة: «أتحبني». وقال له: «يارب، أنت تعلم كل شيء. أنت تعلم أني أحبك!» فقال له يسوع: «أطعم خرافي!"]]}], "kwAr": "بطرس", "noteAr": ""}, {"kw": "the", "raw": "1Pe_2:11; Act_2:5-11; Eph_2:12, Eph_2:19; Heb_11:13", "note": "", "refs": [{"l": "1Pe 2:11", "n": "", "vs": [[11, "أيها الأحباء، ما أنتم إلا غرباء تزورون الأرض زيارة عابرة. لذلك أطلب إليكم أن تبتعدوا عن الشهوات الجسدية التي تصارع النفس."]]}, {"l": "Act 2:5-11", "n": "", "vs": [[5, "وكانت أورشليم في ذلك الوقت مزدحمة باليهود الأتقياء الذين جاءوا إليها من أمم العالم كلها."], [6, "فلما دوى الصوت، توافدت إليهم الجموع، وقد أخذتهم الحيرة لأن كل واحد كان يسمعهم يتكلمون بلغته."], [7, "واستولت الدهشة عليهم. فأخذوا يتساءلون: «أليس هؤلاء المتكلمون جميعا من أهل الجليل؟"], [8, "فكيف يسمع كل واحد منا لغة البلد الذي ولد فيه؟"], [9, "فبعضنا فرتيون، وماديون، وعيلاميون. وبعضنا من سكان ما بين النهرين واليهودية، وكبدوكية، وبنتس، وأسيا،"], [10, "وفريجية، وبمفيلية، ومصر، ونواحي ليبيا المواجهة للقيروان. وبيننا كثيرون من الرومانيين الزائرين،"], [11, "يهودا ومتهودين، وبعض الكريتيين والعرب. وها نحن نسمعهم يكلموننا بلغاتنا عن أعمال الله العظيمة»."]]}, {"l": "Eph 2:12", "n": "", "vs": [[12, "أنكم كنتم في ذلك الحين بلا مسيح، أجانب عن جماعة إسرائيل، وغرباء عن العهود الموعودة، لا رجاء لكم، ومنكرين لله في العالم."]]}, {"l": "Eph 2:19", "n": "", "vs": [[19, "إذن، لستم غرباء وأجانب بعد الآن، بل أنتم رعية مع القديسين وأعضاء في عائلة الله،"]]}, {"l": "Heb 11:13", "n": "", "vs": [[13, "هؤلاء جميعا، حافظوا على إيمانهم إلى النهاية. وماتوا قبل أن تتحقق وعود الله لهم في أثناء حياتهم. ولكنهم رأوها من بعيد، وتوقعوا تحقيقها كاملة في المستقبل. وإذ آمنوا بتلك الوعود الإلهية اعترفوا بأنهم ليسوا إلا غرباء على الأرض يزورونها زيارة عابرة."]]}], "kwAr": "المغتربين", "noteAr": ""}, {"kw": "scattered", "raw": "Lev_26:33; Deu_4:27, Deu_28:64, Deu_32:26; Est_3:8; Psa_44:11; Eze_6:8; Joh_7:35; Joh_11:52; Act_8:4; Jam_1:1", "note": "", "refs": [{"l": "Lev 26:33", "n": "", "vs": [[33, "وأشتتكم بين الشعوب، وأجرد عليكم سيفي، وألاحقكم، وأحول أرضكم إلى قفر ومدنكم إلى خرائب."]]}, {"l": "Deu 4:27", "n": "", "vs": [[27, "ويشتتكم الرب بين الأمم فتصبحون أقلية بين الشعوب التي يسوقكم إليها."]]}, {"l": "Deu 28:64", "n": "", "vs": [[64, "ويشتتكم الرب بين جميع الأمم من أقصى الأرض إلى أقصاها، فتعبدون هناك آلهة أخرى من خشب أو حجر لم تعرفوها أنتم ولا آباؤكم،"]]}, {"l": "Deu 32:26", "n": "", "vs": [[26, "قلت: أشتتهم في زوايا الأرض، وأمحو من بين الناس ذكرهم."]]}, {"l": "Est 3:8", "n": "", "vs": [[8, "فقال هامان للملك أحشويروش: «هناك شعب ما متشتت ومتفرق بين الشعوب في كل أرجاء مملكتك، تغاير شرائعهم شرائع جميع الأمم، وهم لا ينفذون سنن الملك. فلا يجدر بالملك إغفال أمرهم."]]}, {"l": "Psa 44:11", "n": "", "vs": [[11, "أسلمتنا كغنم معدة للذبح، وبددتنا بين الأمم."]]}, {"l": "Eze 6:8", "n": "", "vs": [[8, "وأعفو عن بقية منكم ليكون لكم ناجون من السيف يتشتتون بين الأمم، إذ تتبددون في كل الأرض."]]}, {"l": "Joh 7:35", "n": "", "vs": [[35, "فتساءل اليهود فيما بينهم: «إلى أين ينوي أن يذهب فلا نجده؟ أيذهب إلى المدن اليونانية التي تشتت فيها اليهود، ويعلم اليونانيين؟"]]}, {"l": "Joh 11:52", "n": "", "vs": [[52, "وليس فدى الأمة وحسب بل أيضا ليجمع أبناء الله المشتتين فيجعلهم واحدا."]]}, {"l": "Act 8:4", "n": "", "vs": [[4, "والذين تشتتوا كانوا ينتقلون من مكان إلى مكان مبشرين بالكلمة."]]}, {"l": "Jam 1:1", "n": "", "vs": [[1, "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"]]}], "kwAr": "المشتتين", "noteAr": ""}, {"kw": "Pontus", "raw": "Act_2:5, Act_2:9, Act_2:10, Act_18:2", "note": "", "refs": [{"l": "Act 2:5", "n": "", "vs": [[5, "وكانت أورشليم في ذلك الوقت مزدحمة باليهود الأتقياء الذين جاءوا إليها من أمم العالم كلها."]]}, {"l": "Act 2:9", "n": "", "vs": [[9, "فبعضنا فرتيون، وماديون، وعيلاميون. وبعضنا من سكان ما بين النهرين واليهودية، وكبدوكية، وبنتس، وأسيا،"]]}, {"l": "Act 2:10", "n": "", "vs": [[10, "وفريجية، وبمفيلية، ومصر، ونواحي ليبيا المواجهة للقيروان. وبيننا كثيرون من الرومانيين الزائرين،"]]}, {"l": "Act 18:2", "n": "", "vs": [[2, "فالتقى هناك بيهودي اسمه أكيلا، من مواليد بنطس، كان قد جاء حديثا مع زوجته بريسكلا من إيطالية، لأن القيصر كلوديوس أمر بطرد اليهود من روما، فقصد بولس إليهما."]]}], "kwAr": "بنطس", "noteAr": ""}, {"kw": "Galatia", "raw": "Act_16:6, Act_18:23; Gal_1:2", "note": "", "refs": [{"l": "Act 16:6", "n": "", "vs": [[6, "ومنعهم الروح القدس من التبشير في مقاطعة أسيا، فسافروا في مقاطعتي فريجية وغلاطية."]]}, {"l": "Act 18:23", "n": "", "vs": [[23, "فأمضى فيها بعض الوقت. ثم طاف مقاطعتي غلاطية وفريجية منتقلا من بلدة إلى أخرى وهو يشدد عزيمة التلاميذ جميعا."]]}, {"l": "Gal 1:2", "n": "", "vs": [[2, "ومن جميع الإخوة الذين معي، إلى الكنائس في مقاطعة غلاطية."]]}], "kwAr": "غلاطية", "noteAr": ""}, {"kw": "Cappadocia", "raw": "Act_2:9", "note": "", "refs": [{"l": "Act 2:9", "n": "", "vs": [[9, "فبعضنا فرتيون، وماديون، وعيلاميون. وبعضنا من سكان ما بين النهرين واليهودية، وكبدوكية، وبنتس، وأسيا،"]]}], "kwAr": "كبدوكية", "noteAr": ""}, {"kw": "Asia", "raw": "Act_6:9, Act_16:6, Act_19:10, Act_20:16-18; 1Co_16:19; 2Co_1:8; 2Ti_1:15; Rev_1:11", "note": "", "refs": [{"l": "Act 6:9", "n": "", "vs": [[9, "فعارضه بعض المنتمين إلى جماعة العبيد المحررين، يساندهم بعض اليهود من القيروان والإسكندرية، وغيرهم من مقاطعتي كيليكيا وأسيا، وأخذوا يجادلونه."]]}, {"l": "Act 16:6", "n": "", "vs": [[6, "ومنعهم الروح القدس من التبشير في مقاطعة أسيا، فسافروا في مقاطعتي فريجية وغلاطية."]]}, {"l": "Act 19:10", "n": "", "vs": [[10, "وداوم على ذلك مدة سنتين. وهكذا وصلت كلمة الرب إلى جميع سكان مقاطعة أسيا من اليهود واليونانيين."]]}, {"l": "Act 20:16-18", "n": "", "vs": [[16, "وكان بولس قد قرر أن يتجاوز أفسس في البحر لكي لا يتأخر في مقاطعة أسيا، فقد كان يريد السرعة لعله يتمكن من الوصول إلى أورشليم في يوم الخمسين."], [17, "ومن ميليتس أرسل بولس إلى أفسس يستدعي شيوخ الكنيسة."], [18, "فلما جاءوا إليه، قال لهم:"]]}, {"l": "1Co 16:19", "n": "", "vs": [[19, "الكنائس في مقاطعة أسيا تسلم عليكم. ويسلم عليكم في الرب كثيرا، أكيلا وبريسكلا مع الكنيسة التي في بيتهما."]]}, {"l": "2Co 1:8", "n": "", "vs": [[8, "فيا أيها الإخوة، نريد أن لا يخفى عليكم أمر الضيقة التي مررنا بها في مقاطعة أسيا. فقد كانت وطأتها علينا شديدة جدا وفوق طاقتنا، حتى يئسنا من الحياة نفسها."]]}, {"l": "2Ti 1:15", "n": "", "vs": [[15, "أنت على علم بأن معاوني الذين في مقاطعة أسيا، ومنهم فيجلس وهرموجينس، قد تخلوا عني."]]}, {"l": "Rev 1:11", "n": "", "vs": [[11, "يقول: «دون ما تراه في كتاب، وابعث به إلى الكنائس السبع: في أفسس، وسميرنا، وبرغامس، وثياتيرا، وساردس، وفيلادلفيا، ولاودكية»."]]}], "kwAr": "آسيا", "noteAr": ""}, {"kw": "Bithynia", "raw": "Act_16:7", "note": "", "refs": [{"l": "Act 16:7", "n": "", "vs": [[7, "ولما وصلوا حدود مقاطعة ميسيا، اتجهوا نحو مقاطعة بيثينية، ولكن روح يسوع لم يسمح لهم بالدخول إليها،"]]}], "kwAr": "بيثينية", "noteAr": ""}], "arS": [["من ", []], ["بطرس", ["G4074"]], ["، ", []], ["رسول", ["G652"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [" إلى ", []], ["المشتتين", ["G1290"]], [" ", []], ["المغتربين", ["G3927"]], [" في بلاد ", []], ["بنطس", ["G4195"]], [" ", []], ["وغلاطية", ["G1053"]], [" ", []], ["وكبدوكية", ["G2587"]], [" ", []], ["وآسيا", ["G773"]], [" ", []], ["وبيثينية", ["G978"]], ["، أولئك الذين اختارهم الله الآب", []]]}, {"c": 1, "v": 2, "text": "بحسب علمه السابق ثم قدسهم بالروح ليطيعوا يسوع المسيح ويطهروا برش دمه عليهم.", "groups": [{"kw": "Elect", "raw": "1Pe_2:9; Deu_7:6; Isa_65:9, Isa_65:22; Mat_24:22, Mat_24:24, Mat_24:31; Mar_13:20,Mar_13:22, Mar_13:27; Luk_18:7; Joh_15:16-19; Rom_8:29, Rom_8:33, Rom_11:2, Rom_11:5-7, Rom_11:28; Eph_1:4, Eph_1:5; Col_3:12; 2Ti_2:10; Tit_1:1; 2Jo_1:1, 2Jo_1:13", "note": "", "refs": [{"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}, {"l": "Deu 7:6", "n": "", "vs": [[6, "لأنكم شعب مقدس للرب إلهكم. فإياكم قد اختار الرب إلهكم من بين جميع شعوب الأرض لتكونوا شعبه الخاص."]]}, {"l": "Isa 65:9", "n": "", "vs": [[9, "بل أخرج من صلب يعقوب ذرية، ومن يهوذا وارثا لجبالي، فيملكها مختاري، ويقيم فيها عبيدي،"]]}, {"l": "Isa 65:22", "n": "", "vs": [[22, "لا يبنون ليأتي آخر فيسكن فيها، ولا يغرسون كروما ليجنيها آخر، لأن أيام شعبي تكون مديدة كأيام الشجر، ويتمتع مختاري بعمل أيديهم."]]}, {"l": "Mat 24:22", "n": "", "vs": [[22, "ولولا أن تلك الأيام ستختصر، لما كان أحد من البشر ينجو. ولكن من أجل المختارين ستختصر تلك الأيام."]]}, {"l": "Mat 24:24", "n": "", "vs": [[24, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات عظيمة وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Mat 24:31", "n": "", "vs": [[31, "ويرسل ملائكته بصوت بوق عظيم ليجمعوا مختاريه من الجهات الأربع، من أقاصي السماوات إلى أقاصيها."]]}, {"l": "Mar 13:20", "n": "", "vs": [[20, "ولولا أن الرب قد اختصر تلك الأيام، لما كان أحد من البشر ينجو. ولكنه لأجل المختارين الذين اختارهم، قد اختصر تلك الأيام."]]}, {"l": "Mar 13:22", "n": "", "vs": [[22, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Mar 13:27", "n": "", "vs": [[27, "فيرسل عندئذ ملائكته ويجمع مختاريه من الجهات الأربع، من أقصى الأرض إلى أقصى السماء."]]}, {"l": "Luk 18:7", "n": "", "vs": [[7, "أفلا ينصف الله مختاريه الذين يصرخون إليه نهارا وليلا؟ أما يسرع في الاستجابة لهم؟"]]}, {"l": "Joh 15:16-19", "n": "", "vs": [[16, "ليس أنتم اخترتموني، بل أنا اخترتكم وعينتكم لتنطلقوا وتنتجوا ثمرا ويدوم ثمركم، فيعطيكم الآب كل ما تطلبونه باسمي."], [17, "فبهذا أوصيكم إذن: أن تحبوا بعضكم بعضا."], [18, "إن أبغضكم العالم، فاعلموا أنه قد أبغضني من قبلكم."], [19, "لو كنتم من أهل العالم، لكان العالم يحب أهله، ولكن لأنكم لستم من أهل العالم، بل إني اخترتكم من وسط العالم، لذلك يبغضكم العالم."]]}, {"l": "Rom 8:29", "n": "", "vs": [[29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."]]}, {"l": "Rom 8:33", "n": "", "vs": [[33, "ومن سيتهم مختاري الله؟ إن الله هو الذي يبرر،"]]}, {"l": "Rom 11:2", "n": "", "vs": [[2, "إن الله لم يرفض شعبه الذي كان قد اختاره. أما تعلمون ما يقوله الكتاب في أمر إيليا لما رفع إلى الله شكوى على إسرائيل قائلا:"]]}, {"l": "Rom 11:5-7", "n": "", "vs": [[5, "فكذلك، في الزمان الحاضر، ماتزال بقية اختارها الله بالنعمة."], [6, "ولكن، بما أن ذلك قد تم بالنعمة، فليس بعد على أساس الأعمال، وإلا فليست النعمة نعمة بعد."], [7, "فما الخلاصة إذا؟ إن ما يسعى إليه إسرائيل لم ينالوه، بل ناله المختارون منهم، والباقون عميت بصائرهم،"]]}, {"l": "Rom 11:28", "n": "", "vs": [[28, "ففيما يتعلق بالإنجيل، هم أعداء الله من أجلكم. وأما فيما يتعلق بالاختيار الإلهي فهم محبوبون من أجل الآباء."]]}, {"l": "Eph 1:4", "n": "", "vs": [[4, "كما كان قد اختارنا فيه قبل تأسيس العالم، لنكون قديسين بلا لوم أمامه."]]}, {"l": "Eph 1:5", "n": "", "vs": [[5, "إذ سبق فعيننا في المحبة ليتخذنا أبناء له بيسوع المسيح. وذلك موافق للقصد الذي سرت به مشيئته،"]]}, {"l": "Col 3:12", "n": "", "vs": [[12, "فباعتباركم جماعة مختارة من الله، قديسين محبوبين، البسوا دائما عواطف الحنان واللطف والتواضع والوداعة وطول البال،"]]}, {"l": "2Ti 2:10", "n": "", "vs": [[10, "لهذا السبب أحتمل كل شيء بصبر لأجل الذين اختارهم الله ، لكي يحصلوا، هم أيضا، على الخلاص الذي في المسيح يسوع مع المجد الأبدي."]]}, {"l": "Tit 1:1", "n": "", "vs": [[1, "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"]]}, {"l": "2Jo 1:1", "n": "", "vs": [[1, "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."]]}, {"l": "2Jo 1:13", "n": "", "vs": [[13, "يسلم عليك أولاد أختك التي اختارها الله ."]]}], "kwAr": "اختارهم", "noteAr": ""}, {"kw": "the foreknowledge", "raw": "Act_2:23, Act_15:18; Rom_8:29, Rom_8:30, Rom_9:23, Rom_9:24, Rom_11:2", "note": "", "refs": [{"l": "Act 2:23", "n": "", "vs": [[23, "ومع ذلك فقد سمح الله ، وفقا لمشيئته المحتومة وعلمه السابق، أن تقبضوا عليه وتصلبوه وتقتلوه بأيدي الأثمة."]]}, {"l": "Act 15:18", "n": "", "vs": [[18, "المعروفة لديه منذ الأزل."]]}, {"l": "Rom 8:29", "n": "", "vs": [[29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."]]}, {"l": "Rom 8:30", "n": "", "vs": [[30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."]]}, {"l": "Rom 9:23", "n": "", "vs": [[23, "وذلك بقصد أن يعلن غنى مجده في أوعية الرحمة التي سبق فأعدها للمجد،"]]}, {"l": "Rom 9:24", "n": "", "vs": [[24, "فينا نحن الذين دعاهم لا من بين اليهود فقط بل من بين الأمم أيضا؟"]]}, {"l": "Rom 11:2", "n": "", "vs": [[2, "إن الله لم يرفض شعبه الذي كان قد اختاره. أما تعلمون ما يقوله الكتاب في أمر إيليا لما رفع إلى الله شكوى على إسرائيل قائلا:"]]}], "kwAr": "علمه السابق", "noteAr": ""}, {"kw": "sanctification", "raw": "Act_20:32; Rom_15:16; 1Co_1:30, 1Co_6:11; 2Th_2:13", "note": "", "refs": [{"l": "Act 20:32", "n": "", "vs": [[32, "وا لآن أسلمكم إلى الله وإلى كلمة نعمته القادرة أن تبنيكم وتعطيكم ميراثا تشتركون فيه مع جميع المقدسين لله."]]}, {"l": "Rom 15:16", "n": "", "vs": [[16, "وبذلك أكون خادم المسيح يسوع، المرسل إلى الأمم، حاملا إنجيل الله وكأني أقوم بخدمة كهنوتية، بقصد أن ترفع لله من بين الأمم تقدمة تكون مقبولة ومقدسة بالروح القدس."]]}, {"l": "1Co 1:30", "n": "", "vs": [[30, "وبفضل الله صار لكم مقام في المسيح يسوع الذي جعل لنا حكمة من الله وبرا وقداسة وفداء،"]]}, {"l": "1Co 6:11", "n": "", "vs": [[11, "وهكذا كان بعضكم، إلا أنكم قد اغتسلتم، بل تقدستم، بل تبررتم، باسم الرب يسوع المسيح وبروح إلهنا."]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}], "kwAr": "قدسهم بالروح", "noteAr": ""}, {"kw": "unto", "raw": "1Pe_1:22; Rom_1:5, Rom_8:13, Rom_16:19, Rom_16:26; 2Co_10:5; Heb_5:9", "note": "", "refs": [{"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}, {"l": "Rom 1:5", "n": "", "vs": [[5, "الذي به ولأجل اسمه نلنا نعمة ورسالة لإطاعة الإيمان بين جميع الأمم،"]]}, {"l": "Rom 8:13", "n": "", "vs": [[13, "لأنه إن عشتم بحسب الجسد، فإنكم ستموتون، ولكن إن كنتم بالروح تميتون أعمال الجسد، فستحيون."]]}, {"l": "Rom 16:19", "n": "", "vs": [[19, "إن خبر طاعتكم قد بلغ الجميع. ولذلك أفرح بكم، ولكن أريد لكم أن تكونوا حكماء في ما هو خير، وبسطاء في ما هو شر."]]}, {"l": "Rom 16:26", "n": "", "vs": [[26, "ولكن أذيع الآن، بأمر الله الأزلي في الكتابات النبوية، على جميع الأمم لأجل إطاعة الإيمان؛"]]}, {"l": "2Co 10:5", "n": "", "vs": [[5, "وكل ما يعلو مرتفعا لمقاومة معرفة الله، ونأسر كل فكر إلى طاعة المسيح."]]}, {"l": "Heb 5:9", "n": "", "vs": [[9, "وبذلك، أصبح مؤهلا لمهمته، فصار لجميع الذين يطيعونه مصدرا للخلاص الأبدي."]]}], "kwAr": "ليطيعوا", "noteAr": ""}, {"kw": "sprinkling", "raw": "Heb_9:19-22, Heb_11:28, Heb_12:24", "note": "", "refs": [{"l": "Heb 9:19-22", "n": "", "vs": [[19, "فمعلوم أن موسى، بعد تلاوة وصايا الشريعة كلها على الشعب، أخذ دم العجول والتيوس مع بعض الماء، ورشه على كتاب الشريعة، وعلى أفراد الشعب، بباقة من نبات الزوفا وصوف أحمر اللون."], [20, "وقال: هذا دم العهد الذي أوصاكم الله بحفظه."], [21, "وقد رش موسى الدم أيضا على خيمة العبادة، وعلى أدوات الخدمة التي فيها."], [22, "فالشريعة توصي بأن يتطهر كل شيء تقريبا بالدم. ولا غفران إلا بسفك الدم!"]]}, {"l": "Heb 11:28", "n": "", "vs": [[28, "وبالإيمان، أقام الفصح ورش الدم، لكي لا يمس مهلك الأبكار أحدا من أبناء شعبه."]]}, {"l": "Heb 12:24", "n": "", "vs": [[24, "كذلك، تقدمتم إلى يسوع، وسيط العهد الجديد، وإلى دمه المرشوش الذي يتكلم مطالبا بأفضل مما طالب به دم هابيل."]]}], "kwAr": "برش دمه", "noteAr": ""}, {"kw": "Grace", "raw": "Rom_1:7; 2Co_13:14", "note": "", "refs": [{"l": "Rom 1:7", "n": "", "vs": [[7, "إلى جميع من هم في روما من أحباء الله القديسين المدعوين. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}, {"l": "2Co 13:14", "n": "", "vs": [[14, "ولتكن معكم جميعا نعمة ربنا يسوع المسيح، ومحبة الله، وشركة الروح القدس. آمين!"]]}], "kwAr": "النعمة", "noteAr": ""}, {"kw": "be", "raw": "Isa_55:7 *marg. Dan_4:1, Dan_6:25; 2Pe_1:2; Jud_1:2", "note": "", "refs": [{"l": "Isa 55:7", "n": "*marg.", "vs": [[7, "ليترك الشرير طريقه والأثيم أفكاره، وليتب إلى الرب فيرحمه، وليرجع إلى إلهنا لأنه يكثر الغفران."]]}, {"l": "Dan 4:1", "n": "", "vs": [[1, "من نبوخذناصر الملك إلى جميع الشعوب والأمم والأقوام من كل لسان المقيمين في كل الأرض: ليكثر سلامكم."]]}, {"l": "Dan 6:25", "n": "", "vs": [[25, "ثم بعث الملك داريوس إلى كل الشعوب والأمم من كل لسان من الساكنين في مملكته برسائل قائلا: «ليكثر سلامكم."]]}, {"l": "2Pe 1:2", "n": "", "vs": [[2, "ليكن لكم المزيد من النعمة والسلام بفضل معرفة الله ويسوع ربنا!"]]}, {"l": "Jud 1:2", "n": "", "vs": [[2, "لتكن لكم الرحمة والسلام والمحبة في وفرة وازدياد!"]]}], "kwAr": "لتكثر لكم النعمة والسلام", "noteAr": ""}], "arS": [["بحسب", ["G2596"]], [" ", []], ["علمه السابق", ["G4268"]], [" ثم ", []], ["قدسهم", ["G38"]], [" ", []], ["بالروح", ["G4151"]], [" ", []], ["ليطيعوا", ["G5218"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [" ويطهروا ", []], ["برش", ["G4473"]], [" ", []], ["دمه", ["G129"]], [" عليهم.", []]]}, {"c": 1, "v": 3, "text": "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،", "groups": [{"kw": "Blessed", "raw": "1Ki_8:15; 1Ch_29:10-13, 1Ch_29:20; Psa_41:13, Psa_72:18, Psa_72:19; 2Co_1:3; Eph_1:3, Eph_1:17; Eph_3:20", "note": "", "refs": [{"l": "1Ki 8:15", "n": "", "vs": [[15, "قائلا: «تبارك الرب إله إسرائيل الذي حقق اليوم وعده الذي قطعه لأبي داود قائلا:"]]}, {"l": "1Ch 29:10-13", "n": "", "vs": [[10, "وسبح داود الرب أمام الجمع المحتشد قائلا: «لك الحمد أيها الرب إله أبينا إسرائيل، من الأزل وإلى الأبد."], [11, "لك يارب العظمة والسطوة والجلال والبهاء والمجد، لأن لك كل ما في السماء والأرض. أنت يارب صاحب الملك وقد تعاليت فوق رؤوس الجميع."], [12, "أنت مصدر كل غنى وكرامة، وأنت المتسلط على الجميع، والمالك للقوة والسطوة، وأنت القادر على تعظيم الجميع وتقوية عزيمتهم."], [13, "والآن، نحمدك ياإلهنا ونسبح اسمك الجليل."]]}, {"l": "1Ch 29:20", "n": "", "vs": [[20, "ثم قال داود للجمع الحاضر: «باركوا الرب إلهكم». فسبح كل الجمع الرب إله آبائهم وسجدوا للرب وللملك."]]}, {"l": "Psa 41:13", "n": "", "vs": [[13, "تبارك الرب إله إسرائيل، من الأزل وإلى الأبد. آمين فآمين."]]}, {"l": "Psa 72:18", "n": "", "vs": [[18, "تبارك الرب إله إسرائيل، فهو وحده صانع العجائب."]]}, {"l": "Psa 72:19", "n": "", "vs": [[19, "تبارك اسمه المجيد إلى الأبد، ولتمتليء الأرض كلها من مجده. آمين ثم آمين."]]}, {"l": "2Co 1:3", "n": "", "vs": [[3, "تبارك الله ، أبو ربنا يسوع المسيح، أبو المراحم وإله كل تعزية،"]]}, {"l": "Eph 1:3", "n": "", "vs": [[3, "تبارك الله ، أبو ربنا يسوع المسيح الذي باركنا بكل بركة روحية في الأماكن السماوية."]]}, {"l": "Eph 1:17", "n": "", "vs": [[17, "حتى يهبكم إله ربنا يسوع المسيح، أبو المجد، روح حكمة وإلهام: لتعرفوه معرفة كاملة"]]}, {"l": "Eph 3:20", "n": "", "vs": [[20, "والقادر أن يفعل، وفقا للقدرة العاملة فينا، ما يفوق بلا حصر كل ما نطلب أو نتصور،"]]}], "kwAr": "تبارك الله", "noteAr": ""}, {"kw": "which", "raw": "Exo_34:6; Psa_86:5, Psa_86:15; Jon_4:2; Rom_5:15-21; Eph_1:7, Eph_2:4, Eph_2:7-10; 1Ti_1:14; Tit_3:4-6", "note": "", "refs": [{"l": "Exo 34:6", "n": "", "vs": [[6, "وعبر من أمام موسى مناديا: «أنا الرب. الرب إله رؤوف رحيم، بطيء الغضب وكثير الإحسان والوفاء."]]}, {"l": "Psa 86:5", "n": "", "vs": [[5, "لأنك أنت يارب طيب وغفور، وكثير الرحمة لجميع الذين يدعونك."]]}, {"l": "Psa 86:15", "n": "", "vs": [[15, "إنما أنت يارب إله رحيم ورؤوف وبطيء الغضب ووافر الرحمة والحق."]]}, {"l": "Jon 4:2", "n": "", "vs": [[2, "وصلى إلى الرب قائلا: «أيها الرب، أليس هذا ما قلته عندما كنت في بلادي؟ لهذا أسرعت إلى الهرب إلى ترشيش، لأني عرفت أنك إله رحيم رؤوف بطيء الغضب كثير الإحسان، ترجع عن العقاب."]]}, {"l": "Rom 5:15-21", "n": "", "vs": [[15, "ولكن مفعول المعصية ليس كمفعول النعمة! فإذا كان الكثيرون بمعصية إنسان واحد قد ماتوا، فكم بالأحرى في الإنسان الواحد يسوع المسيح تتوافر للكثيرين نعمة الله والعطية المجانية بالنعمة."], [16, "ثم إن أثر خطيئة إنسان واحد ليس كأثر الهبة! فإن الحكم من جراء معصية واحدة يؤدي إلى الدينونة. وأما فعل النعمة، من جراء معاص كثيرة، فيؤدي إلى التبرير."], [17, "فما دام الموت بمعصية الإنسان الواحد، قد ملك بذلك الواحد، فكم بالأحرى يملك في الحياة بيسوع المسيح الواحد أولئك الذين ينالون فيض النعمة وعطية البر المجانية."], [18, "فإذن، كما أن معصية واحدة جلبت الدينونة على جميع البشر، كذلك فإن برا واحدا يجلب التبرير المؤدي إلى الحياة لجميع البشر."], [19, "فكما أنه بعصيان الإنسان الواحد جعل الكثيرون خاطئين، فكذلك أيضا بطاعة الواحد سيجعل الكثيرون أبرارا."], [20, "وأما الشريعة فقد أدخلت لتظهر كثرة المعصية. ولكن، حيث كثرت الخطيئة، تتوافر النعمة أكثر جدا،"], [21, "حتى إنه كما ملكت الخطيئة بالموت، فكذلك أيضا تملك النعمة على أساس البر مؤدية إلى الحياة الأبدية بيسوع المسيح ربنا."]]}, {"l": "Eph 1:7", "n": "", "vs": [[7, "ففيه لنا بدمه الفداء، أي غفران الخطايا؛ بحسب غنى نعمته"]]}, {"l": "Eph 2:4", "n": "", "vs": [[4, "أما الله ، وهو غني في الرحمة، فبسبب محبته العظيمة التي أحبنا بها،"]]}, {"l": "Eph 2:7-10", "n": "", "vs": [[7, "وذلك كي يعرض في الدهور القادمة غنى نعمته الفائق في لطفه علينا في المسيح يسوع."], [8, "فإنكم بالنعمة مخلصون، بالإيمان، وهذا ليس منكم. إنه هبة من الله،"], [9, "لا على أساس الأعمال، حتى لا يفتخر أحد."], [10, "فإننا نحن تحفة الله، وقد خلقنا في المسيح يسوع لأعمال صالحة أعدها سلفا لنسلك فيها."]]}, {"l": "1Ti 1:14", "n": "", "vs": [[14, "إلا أن نعمة ربنا قد فاضت علي فوق كل حد، ومعها الإيمان والمحبة، وذلك في المسيح يسوع."]]}, {"l": "Tit 3:4-6", "n": "", "vs": [[4, "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،"], [5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"], [6, "الذي سكبه علينا بغنى بيسوع المسيح مخلصنا."]]}], "kwAr": "فمن فرط رحمته", "noteAr": ""}, {"kw": "abundant", "raw": "Gr. much.", "note": "Gr. much.", "refs": [], "kwAr": "العظيمة", "noteAr": "في اليونانية: كثيرة."}, {"kw": "hath", "raw": "1Pe_1:23, 1Pe_2:2; Joh_1:13, Joh_3:3-8; Jam_1:18; 1Jo_2:29, 1Jo_3:9, 1Jo_4:7, 1Jo_5:1, 1Jo_5:4, 1Jo_5:18", "note": "", "refs": [{"l": "1Pe 1:23", "n": "", "vs": [[23, "فأنتم قد ولدتم ولادة ثانية لا من زرع بشري يفنى، بل مما لا يفنى: بكلمة الله الحية الباقية إلى الأبد."]]}, {"l": "1Pe 2:2", "n": "", "vs": [[2, "وكأطفال مولودين حديثا، تشوقوا إلى اللبن الروحي النقي لكي تنموا به إلى أن تبلغوا الخلاص،"]]}, {"l": "Joh 1:13", "n": "", "vs": [[13, "وهم الذين ولدوا ليس من دم، ولا من رغبة جسد، ولا من رغبة بشر، بل من الله."]]}, {"l": "Joh 3:3-8", "n": "", "vs": [[3, "فأجابه يسوع: «الحق الحق أقول لك: لا أحد يمكنه أن يرى ملكوت الله إلا إذا ولد من جديد»."], [4, "فسأله نيقوديموس: «كيف يمكن الإنسان أن يولد وهو كبير السن؟ ألعله يستطيع أن يدخل بطن أمه ثانية ثم يولد؟»"], [5, "أجابه يسوع: «الحق الحق أقول لك: لا يمكن أن يدخل أحد ملكوت الله إلا إذا ولد من الماء والروح."], [6, "فالمولود من الجسد هو جسد، والمولود من الروح هو روح."], [7, "فلا تتعجب إذا قلت لك إنكم بحاجة إلى الولادة من جديد."], [8, "الريح تهب حيث تشاء وتسمع صفيرها، ولكنك لا تعلم من أين تأتي ولا إلى أين تذهب. هكذا كل من ولد من الروح»."]]}, {"l": "Jam 1:18", "n": "", "vs": [[18, "وهو قد شاء أن يجعلنا أولادا له، فولدنا بكلمته، كلمة الحق. وغايته أن نكون باكورة خليقته."]]}, {"l": "1Jo 2:29", "n": "", "vs": [[29, "وما دمتم تعلمون أن الله بار، فاعلموا أن كل من يفعل الصلاح، يظهر أنه مولود من الله حقا."]]}, {"l": "1Jo 3:9", "n": "", "vs": [[9, "فكل مولود من الله، لا يمارس الخطيئة، لأن طبيعة الله صارت ثابتة فيه. بل إنه لا يستطيع أن يمارس الخطيئة، لأنه مولود من الله."]]}, {"l": "1Jo 4:7", "n": "", "vs": [[7, "أيها الأحباء، لنحب بعضنا بعضا: لأن المحبة تصدر من الله. إذن، كل من يحب، يكون مولودا من الله ويعرف الله ."]]}, {"l": "1Jo 5:1", "n": "", "vs": [[1, "كل من يؤمن حقا أن يسوع هو المسيح، فهو مولود من الله. ومن يحب الوالد، فلابد أن يحب المولودين منه أيضا."]]}, {"l": "1Jo 5:4", "n": "", "vs": [[4, "ذلك لأن المولود من الله ينتصر على العالم. فالإيمان هو الذي يجعلنا ننتصر على العالم."]]}, {"l": "1Jo 5:18", "n": "", "vs": [[18, "نحن واثقون بأن كل من ولد من الله لا يمارس الخطيئة، لأن ابن الله يحميه فلا يمسه إبليس الشرير."]]}], "kwAr": "ولدنا ولادة ثانية", "noteAr": ""}, {"kw": "unto", "raw": "Rom_5:4, Rom_5:5, Rom_8:24, Rom_12:12, Rom_15:13; 1Co_13:13; Col_1:23, Col_1:27; 1Th_1:3; Tit_2:13; Heb_3:6, Heb_6:18, Heb_6:19; 1Jo_3:3", "note": "", "refs": [{"l": "Rom 5:4", "n": "", "vs": [[4, "والصبر يؤهلنا للفوز في الامتحان، والفوز يبعث فينا الرجاء،"]]}, {"l": "Rom 5:5", "n": "", "vs": [[5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."]]}, {"l": "Rom 8:24", "n": "", "vs": [[24, "فإننا قد خلصنا، إنما بالرجاء؛ ولكن الرجاء متى رأيناه لا يكون رجاء؛ فما يراه الإنسان لماذا يرجوه بعد؟"]]}, {"l": "Rom 12:12", "n": "", "vs": [[12, "فرحين بالرجاء، صابرين في الضيق، مواظبين على الصلاة،"]]}, {"l": "Rom 15:13", "n": "", "vs": [[13, "فليملأكم إله الرجاء كل فرح وسلام في إيمانكم حتى تزدادوا رجاء بقوة الروح القدس."]]}, {"l": "1Co 13:13", "n": "", "vs": [[13, "أما الآن، فهذه الثلاثة باقية: الإيمان، والرجاء، والمحبة. ولكن أعظمها هي المحبة!"]]}, {"l": "Col 1:23", "n": "", "vs": [[23, "على أن تثبتوا فعلا في الإيمان، مؤسسين وراسخين وغير متحولين عن رجاء الإنجيل الذي سمعتموه والذي بشر به للخليقة كلها تحت السماء، وله صرت أنا بولس خادما."]]}, {"l": "Col 1:27", "n": "", "vs": [[27, "الذين أراد الله أن يعلن لهم كم هو غني مجد هذا السر بين الأمم: إنه المسيح فيكم، وهو رجاء المجد؛"]]}, {"l": "1Th 1:3", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "Heb 3:6", "n": "", "vs": [[6, "أما المسيح، فهو أمين بصفته ابنا يترَأس على البيت. وهذا البيت هو نحن المؤمنين، على أن نتمسك بالثقة والافتخار برجائنا تمسكا ثابتا حتى النهاية."]]}, {"l": "Heb 6:18", "n": "", "vs": [[18, "فاستنادا إلى وعد الله وقسمه، وهما أمران ثابتان لا يتغيران ويستحيل أن يكذب الله فيهما، نحصل على تشجيع قوي، بعدما التجأنا إلى التمسك بالرجاء الموضوع أمامنا."]]}, {"l": "Heb 6:19", "n": "", "vs": [[19, "هذا الرجاء هو لنا بمثابة مرساة أمينة ثابتة تشد نفوسنا إلى ما وراء الحجاب السماوي."]]}, {"l": "1Jo 3:3", "n": "", "vs": [[3, "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر."]]}], "kwAr": "مليئة بالرجاء", "noteAr": ""}, {"kw": "by", "raw": "1Pe_3:21; Isa_26:19; Rom_4:25, Rom_5:10, Rom_8:11; 1Co_15:20; Eph_2:6; 1Th_4:13", "note": "", "refs": [{"l": "1Pe 3:21", "n": "", "vs": [[21, "وعملية النجاة هذه مصورة في المعمودية التي لا نقصد بها أن نغتسل من أوساخ أجسامنا، بل هي تعهد ضمير صالح أمام الله بفضل قيامة يسوع المسيح،"]]}, {"l": "Isa 26:19", "n": "", "vs": [[19, "ولكن أمواتك يحيون، وتقوم أجسادهم فيا سكان التراب استيقظوا واشدوا بفرح لأن طلك هو ندى متلأليء، جعلته يهطل على أرض الأشباح."]]}, {"l": "Rom 4:25", "n": "", "vs": [[25, "الذي أسلم للموت من أجل معاصينا ثم أقيم من أجل تبريرنا."]]}, {"l": "Rom 5:10", "n": "", "vs": [[10, "فإن كنا، ونحن أعداء، قد تصالحنا مع الله بموت ابنه، فكم بالأحرى نخلص بحياته ونحن مصالحون!"]]}, {"l": "Rom 8:11", "n": "", "vs": [[11, "وإذا كان روح الذي أقام يسوع من بين الأموات يسكن فيكم، فإن الذي أقام المسيح من بين الأموات سوف يحيي أيضا أجسادكم الفانية بسبب روحه الذي يسكن فيكم."]]}, {"l": "1Co 15:20", "n": "", "vs": [[20, "أما الآن فالمسيح قد قام من بين الأموات بكرا للراقدين."]]}, {"l": "Eph 2:6", "n": "", "vs": [[6, "وأقامنا معه وأجلسنا معه في الأماكن السماوية في المسيح يسوع."]]}, {"l": "1Th 4:13", "n": "", "vs": [[13, "على أننا نريد، أيها الإخوة، ألا يخفى عليكم أمر الراقدين، حتى لا يصيبكم الحزن كغيركم من الناس الذين لا رجاء لهم."]]}], "kwAr": "قيامة يسوع المسيح", "noteAr": ""}], "arS": [["تبارك", ["G2128"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["أبو", ["G3962"]], [" ", []], ["ربنا", ["G2962", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], ["! فمن فرط ", []], ["رحمته", ["G1656"]], [" ", []], ["العظيمة", ["G4183"]], [" ", []], ["ولدنا ولادة ثانية", ["G313"]], ["، (معطيا إيانا ", []], ["حياة", ["G2198"]], [" جديدة) مليئة ", []], ["بالرجاء", ["G1680"]], [" على أساس ", []], ["قيامة", ["G386"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [" من بين ", []], ["الأموات", ["G3498"]], ["،", []]]}, {"c": 1, "v": 4, "text": "وإرثا لا يفنى ولا يفسد ولا يزول،", "groups": [{"kw": "an", "raw": "1Pe_3:9; Mat_25:34; Act_20:32, Act_26:18; Gal_3:18; Eph_1:11, Eph_1:14, Eph_1:18; Col_1:12; Heb_9:15", "note": "", "refs": [{"l": "1Pe 3:9", "n": "", "vs": [[9, "لا تبادلوا الشر بشر، ولا الشتيمة بشتيمة. بل بالعكس: باركوا، فترثوا البركة، لأنه لهذا دعاكم الله ."]]}, {"l": "Mat 25:34", "n": "", "vs": [[34, "ثم يقول الملك للذين عن يمينه: تعالوا يامن باركهم أبي، رثوا الملكوت الذي أعد لكم منذ إنشاء العالم:"]]}, {"l": "Act 20:32", "n": "", "vs": [[32, "وا لآن أسلمكم إلى الله وإلى كلمة نعمته القادرة أن تبنيكم وتعطيكم ميراثا تشتركون فيه مع جميع المقدسين لله."]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "Gal 3:18", "n": "", "vs": [[18, "فلو كان الميراث يتم على مبدأ الشريعة، لما كان الأمر متعلقا بعد بالوعد. غير أن الله ، بالوعد، أنعم بالميراث على إبراهيم."]]}, {"l": "Eph 1:11", "n": "", "vs": [[11, "وفي المسيح أيضا قد حصلنا على الميراث الذي سبق أن عينا له، وفقا لقصده، هو الذي يعمل كل شيء كما تقضي مشيئته."]]}, {"l": "Eph 1:14", "n": "", "vs": [[14, "هذا الروح الذي هو عربون ميراثنا إلى أن يتم فداء ما قد اقتني: بغر ض مدح مجده."]]}, {"l": "Eph 1:18", "n": "", "vs": [[18, "إذ تستنير بصائر قلوبكم، فتعلموا ما في دعوته لكم من رجاء، وما هو غنى مجد ميراثه في القديسين،"]]}, {"l": "Col 1:12", "n": "", "vs": [[12, "رافعين الشكر بفرح للآب الذي جعلكم أهلا للاشتراك في ميراث القديسين في (ملكوت) النور،"]]}, {"l": "Heb 9:15", "n": "", "vs": [[15, "ولذلك، فالمسيح هو الوسيط لهذا العهد الجديد. فبما أنه قد تم الموت فداء للمخالفات الحاصلة تحت العهد الأول، ينال المدعوون الوعد بالإرث الأبدي."]]}], "kwAr": "وإرثا", "noteAr": ""}, {"kw": "incorruptible", "raw": "1Co_9:25, 1Co_15:52-54", "note": "", "refs": [{"l": "1Co 9:25", "n": "", "vs": [[25, "وكل متبار يفرض على نفسه تدريبا صارما في شتى المجالات. فهؤلاء المتبارون يفعلون ذلك ليفوزوا بإكليل فان، وأما نحن فلنفوز بإكليل غير فان."]]}, {"l": "1Co 15:52-54", "n": "", "vs": [[52, "في لحظة، بل في طرفة عين عندما ينفخ في البوق الأخير. فإنه سوف ينفخ في البوق، فيقوم الأموات بلا انحلال. وأما نحن، فسنتغير."], [53, "فلابد لهذا الجسم القابل للانحلال أن يلبس عدم انحلال، ولهذا الفاني أن يلبس خلودا."], [54, "وبعد أن يلبس هذا المنحل عدم انحلال، وهذا الفاني خلودا، تتم الكلمة التي قد كتبت: «ابتلع الموت في النصر!»"]]}], "kwAr": "لا يفنى", "noteAr": ""}, {"kw": "undefiled", "raw": "Rev_21:27", "note": "", "refs": [{"l": "Rev 21:27", "n": "", "vs": [[27, "ولن يدخلها شيء نجس، ولا الذين يعملون القبائح ويدجلون، بل فقط الذين كتبت أسماؤهم في سجل الحياة للحمل!"]]}], "kwAr": "ولا يفسد", "noteAr": ""}, {"kw": "fadeth", "raw": "1Pe_5:4; Isa_40:7, Isa_40:8; Eze_47:12; Jam_1:11", "note": "", "refs": [{"l": "1Pe 5:4", "n": "", "vs": [[4, "وعندما يظهر رئيس الرعاة، تنالون إكليل المجد الذي لا يفنى."]]}, {"l": "Isa 40:7", "n": "", "vs": [[7, "يذبل العشب ويذوي الزهر لأن نفخة الرب تهب عليه. حقا إن الشعب عشب."]]}, {"l": "Isa 40:8", "n": "", "vs": [[8, "يذبل العشب ويذوي الزهر، أما كلمة إلهنا فتثبت إلى الأبد»."]]}, {"l": "Eze 47:12", "n": "", "vs": [[12, "وتنمو على ضفتيه كل أنواع أشجار الفاكهة التي تؤكل. لا يذبل ورقها ولا ينقطع ثمرها. تحمل أثمارها في كل شهر، لأن مياه النهر تنبع من المقدس، فتكون ثمار أشجاره للأكل وورقها عقاقير للمداواة."]]}, {"l": "Jam 1:11", "n": "", "vs": [[11, "فعندما تشرق الشمس بحرها المحرق، تيبس تلك الأعشاب، فيسقط زهرها، ويتلاشى جمال منظرها. هكذا يذبل الغني في طرقه!"]]}], "kwAr": "ولا يزول", "noteAr": ""}, {"kw": "reserved", "raw": "Psa_31:19; Col_1:5, Col_3:3, Col_3:4; 2Ti_4:8", "note": "", "refs": [{"l": "Psa 31:19", "n": "", "vs": [[19, "يارب، ما أعظم صلاحك الذي ذخرته لخائفيك، وأظهرته للواثقين بك على مرأى جميع البشر،"]]}, {"l": "Col 1:5", "n": "", "vs": [[5, "بسبب الرجاء المحفوظ لكم في السماوات، الرجاء الذي سمعتم به سابقا في كلمة الحق التي في الإنجيل"]]}, {"l": "Col 3:3", "n": "", "vs": [[3, "فإنكم قد متم، وحياتكم مستورة مع المسيح في الله."]]}, {"l": "Col 3:4", "n": "", "vs": [[4, "فعندما يظهر المسيح، وهو حياتنا، عندئذ تظهرون أنتم أيضا معه في المجد."]]}, {"l": "2Ti 4:8", "n": "", "vs": [[8, "إنما ينتظرني الآن إكليل البر المحفوظ لي، والذي سيهبه لي الرب الديان العادل في ذلك اليوم؛ ولن يوهب لي وحدي، بل أيضا لجميع الذين يحبون ظهوره."]]}], "kwAr": "محفوظا لكم في السماوات", "noteAr": ""}, {"kw": "for you", "raw": "or, for us", "note": "or, for us", "refs": [], "kwAr": "لكم", "noteAr": "أو: لأجلنا."}], "arS": [["وإرثا", ["G2817"]], [" ", []], ["لا يفنى", ["G862"]], [" ولا ", []], ["يفسد", ["G283"]], [" ولا ", []], ["يزول", ["G263"]], ["،", []]]}, {"c": 1, "v": 5, "text": "محفوظا لكم في السماوات. فإنكم محفوظون بقدرة الله العاملة من خلال إيمانكم، إلى أن تفوزوا بالخلاص النهائي المعد لكم والذي سوف يتجلى في الزمان الأخير.", "groups": [{"kw": "kept", "raw": "1Sa_2:9; Psa_37:23, Psa_37:24, Psa_37:28, Psa_103:17, Psa_103:18, Psa_125:1, Psa_125:2; Pro_2:8; Isa_54:17; Jer_32:40; Joh_4:14, Joh_5:24, Joh_10:28-30, Joh_17:11, Joh_17:12, Joh_17:15; Rom_8:31-39; Phi_1:6; Jud_1:1, Jud_1:24", "note": "", "refs": [{"l": "1Sa 2:9", "n": "", "vs": [[9, "هو يحفظ أقدام أتقيائه، أما الأشرار فينطوون في الظلام، لأنه ليس بالقوة يتغلب الإنسان."]]}, {"l": "Psa 37:23", "n": "", "vs": [[23, "الرب يثبت خطوات الإنسان الذي تسره طريقه."]]}, {"l": "Psa 37:24", "n": "", "vs": [[24, "إن تعثر لا يسقط، لأن الرب يسنده بيده."]]}, {"l": "Psa 37:28", "n": "", "vs": [[28, "لأن الرب يحب العدل، ولا يتخلى عن أتقيائه، بل يحفظهم إلى الأبد. أما ذرية الأشرار فتفنى."]]}, {"l": "Psa 103:17", "n": "", "vs": [[17, "أما رحمة الرب فهي من الأزل وإلى الأبد على متقيه، وعدله يمتد إلى بني البنين،"]]}, {"l": "Psa 103:18", "n": "", "vs": [[18, "للذين يراعون عهده والذين يتذكرون وصاياه ويمارسونها."]]}, {"l": "Psa 125:1", "n": "", "vs": [[1, "الواثقون بالرب هم مثل جبل صهيون الراسخ الذي لا يتزعزع إلى الأبد."]]}, {"l": "Psa 125:2", "n": "", "vs": [[2, "كما تحيط الجبال بأورشليم، كذلك يحيط الرب بشعبه من الآن وإلى الأبد،"]]}, {"l": "Pro 2:8", "n": "", "vs": [[8, "يرعى سبل العدل، ويحافظ على طريق أتقيائه."]]}, {"l": "Isa 54:17", "n": "", "vs": [[17, "لا يحالف التوفيق أي سلاح صنع لمهاجمتك، وكل لسان يتهمك أمام القضاء تفحمينه، لأن هذا هو ميراث عبيد الرب، وبرهم الذي أنعمت به عليهم»، يقول الرب."]]}, {"l": "Jer 32:40", "n": "", "vs": [[40, "وأبرم معهم عهدا أبديا أن لا أكف عن الإحسان إليهم، وأضع تقواي في قلوبهم لئلا يرتدوا عني،"]]}, {"l": "Joh 4:14", "n": "", "vs": [[14, "ولكن الذي يشرب من الماء الذي أعطيه أنا، لن يعطش بعد ذلك أبدا، بل إن ما أعطيه من ماء يصبح في داخله نبعا يفيض فيعطي حياة أبدية»."]]}, {"l": "Joh 5:24", "n": "", "vs": [[24, "الحق الحق أقول لكم إن من يسمع كلامي ويؤمن بالذي أرسلني تكون له الحياة الأبدية، ولا يحاكم في اليوم الأخير، لأنه قد انتقل من الموت إلى الحياة."]]}, {"l": "Joh 10:28-30", "n": "", "vs": [[28, "وأعطيها حياة أبدية، فلا تهلك إلى الأبد، ولا ينتزعها أحد من يدي."], [29, "إن الآب الذي أعطاني إياها هو أعظم من الجميع، ولا يقدر أحد أن ينتزع من يد الآب شيئا."], [30, "أنا والآب واحد!»"]]}, {"l": "Joh 17:11", "n": "", "vs": [[11, "هؤلاء باقون في العالم؛ أما أنا فلست باقيا فيه، لأني عائد إليك. أيها الآب القدوس احفظ في اسمك الذين وهبتهم لي، ليكونوا واحدا، كما نحن واحد."]]}, {"l": "Joh 17:12", "n": "", "vs": [[12, "حين كنت معهم، كنت أحفظهم في اسمك. فالذين وهبتهم لي، رعيتهم، ولم يهلك منهم أحد إلا ابن الهلاك، ليتم الكتاب."]]}, {"l": "Joh 17:15", "n": "", "vs": [[15, "وأنا لا أطلب أن تأخذهم من العالم، بل أن تحفظهم من الشرير."]]}, {"l": "Rom 8:31-39", "n": "", "vs": [[31, "فبعد هذا، ماذا نقول؟ مادام الله معنا، فمن يكون علينا؟ ذاك الذي لم يمسك عنا ابنه،"], [32, "بل بذله لأجلنا جميعا، كيف لا يجود علينا معه بكل شيء أيضا؟"], [33, "ومن سيتهم مختاري الله؟ إن الله هو الذي يبرر،"], [34, "فمن ذا يدين؟ إنه المسيح يسوع هو الذي مات، بل بالأحرى قام، وهو أيضا عن يمين الله، وهو يشفع فينا أيضا."], [35, "فمن سيفصلنا عن محبة المسيح لنا؟ هل الشدة أم الضيق أم الاضطهاد أم الجوع أم العري أم الخطر أم السيف؟"], [36, "بل كما قد كتب: «إننا من أجلك نعاني الموت طول النهار. قد حسبنا كأننا غنم للذبح!»"], [37, "ولكننا، في جميع هذه الأمور، نحرز ما يفوق الانتصار على يد من أحبنا."], [38, "فإني لعلى يقين بأنه لا الموت ولا الحياة، ولا الملائكة ولا الرياسات، ولا الأمور الحاضرة ولا الآتية، ولا القوات،"], [39, "ولا الأعالي ولا الأعماق، ولا خليقة أخرى، تقدر أن تفصلنا عن محبة الله التي لنا في المسيح يسوع ربنا."]]}, {"l": "Phi 1:6", "n": "", "vs": [[6, "ولي ثقة في هذا الأمر بالذات: أن الذي بدأ فيكم عملا صالحا سوف يتممه إلى يوم المسيح يسوع."]]}, {"l": "Jud 1:1", "n": "", "vs": [[1, "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."]]}, {"l": "Jud 1:24", "n": "", "vs": [[24, "وللقادر أن يحرسكم من السقوط حتى يوصلكم إلى المثول أمامه في المجد مبتهجين ولا عيب فيكم …"]]}], "kwAr": "محفوظون", "noteAr": ""}, {"kw": "through", "raw": "Rom_11:20; 2Co_1:24; Gal_2:20; Eph_2:8, Eph_3:17; 2Ti_3:15; Heb_6:12", "note": "", "refs": [{"l": "Rom 11:20", "n": "", "vs": [[20, "صحيح! فهي قطعت لسبب عدم الإيمان، وأنت إنما تثبت بسبب الإيمان. فلا يأخذك الغرور، بل خف"]]}, {"l": "2Co 1:24", "n": "", "vs": [[24, "وهذا لا يعني أننا نتسلط على إيمانكم، بل إننا معاونون لكم نعمل لأجل فرحكم. فبالإيمان أنتم ثابتون."]]}, {"l": "Gal 2:20", "n": "", "vs": [[20, "مع المسيح صلبت، وفيما بعد لا أحيا أنا بل المسيح يحيا في. أما الحياة التي أحياها الآن في الجسد، فإنما أحياها بالإيمان في ابن الله، الذي أحبني وبذل نفسه عني."]]}, {"l": "Eph 2:8", "n": "", "vs": [[8, "فإنكم بالنعمة مخلصون، بالإيمان، وهذا ليس منكم. إنه هبة من الله،"]]}, {"l": "Eph 3:17", "n": "", "vs": [[17, "ليسكن المسيح في قلوبكم بالإيمان؛ حتى إذا تأصلتم وتأسستم في المحبة،"]]}, {"l": "2Ti 3:15", "n": "", "vs": [[15, "وتعلم أنك منذ حداثة سنك تعرف الكتب المقدسة، وهي القادرة أن تجعلك حكيما لبلوغ الخلاص عن طريق الإيمان في المسيح يسوع."]]}, {"l": "Heb 6:12", "n": "", "vs": [[12, "وذلك حتى لا تتكاسلوا، بل تقتدوا بالذين يرثون ما وعد الله به، عن طريق الإيمان والصبر."]]}], "kwAr": "من خلال إيمانكم", "noteAr": ""}, {"kw": "unto", "raw": "Isa_45:17, Isa_51:6; 1Th_1:3, 1Th_1:4; 2Th_2:13, 2Th_2:14; Heb_9:28", "note": "", "refs": [{"l": "Isa 45:17", "n": "", "vs": [[17, "أما إسرائيل فقد خلصه الرب بخلاص أبدي، ولن يلحقكم عار أو خزي مدى الدهور،"]]}, {"l": "Isa 51:6", "n": "", "vs": [[6, "ارفعوا عيونكم إلى السماوات وتفرسوا في الأرض من تحت، فإن السماوات كدخان تضمحل، والأرض كثوب تبلى، ويبيد سكانها كالذباب. أما خلاصي فيبقى إلى الأبد، وبري يثبت مدى الدهر."]]}, {"l": "1Th 1:3", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"]]}, {"l": "1Th 1:4", "n": "", "vs": [[4, "ونحن عالمون، أيها الإخوة أحباء الله، حقيقة اختياركم من قبل الله:"]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "2Th 2:14", "n": "", "vs": [[14, "فإلى هذا الأمر قد دعاكم ببشارتنا لكم، لنوال مجد ربنا يسوع المسيح."]]}, {"l": "Heb 9:28", "n": "", "vs": [[28, "كذلك المسيح أيضا: مات مرة واحدة حاملا خطايا كثيرين، مقربا نفسه (لله) عوضا عنهم. ولا بد أن يعود إلى الظهور. لا ليعالج الخطايا، بل ليحقق الخلاص النهائي لجميع منتظريه!"]]}], "kwAr": "بالخلاص", "noteAr": ""}, {"kw": "ready", "raw": "1Pe_1:13; 1Ti_6:14, 1Ti_6:15; Tit_2:13; 1Jo_3:2", "note": "", "refs": [{"l": "1Pe 1:13", "n": "", "vs": [[13, "لذلك اجعلوا أذهانكم متنبهة دائما، وتيقظوا، وعلقوا رجاءكم كله على النعمة التي ستكون من نصيبكم عندما يعود يسوع المسيح ظاهرا بمجده!"]]}, {"l": "1Ti 6:14", "n": "", "vs": [[14, "أن تحفظ الوصية خالية من العيب واللوم إلى يوم ظهور ربنا يسوع المسيح علنا."]]}, {"l": "1Ti 6:15", "n": "", "vs": [[15, "هذا الظهور سوف يتممه الله في وقته الخاص، هو السيد المبارك الأوحد، ملك الملوك ورب الأرباب،"]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "1Jo 3:2", "n": "", "vs": [[2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"]]}], "kwAr": "المعد لكم", "noteAr": ""}, {"kw": "in", "raw": "Job_19:25; Joh_12:48", "note": "", "refs": [{"l": "Job 19:25", "n": "", "vs": [[25, "أما أنا فإني موقن أن فادي حي، وأنه لابد في النهاية أن يقوم على الأرض."]]}, {"l": "Joh 12:48", "n": "", "vs": [[48, "فالذي يرفضني ولا يقبل كلامي، له من يحكم عليه: فإن الكلمة التي قلتها هي تحكم عليه في اليوم الأخير؛"]]}], "kwAr": "في الزمان الأخير", "noteAr": ""}], "arS": [["محفوظا", ["G5083"]], [" لكم في ", []], ["السماوات", ["G3772"]], [". فإنكم ", []], ["محفوظون", ["G5432"]], [" ", []], ["بقدرة", ["G1411"]], [" ", []], ["الله", ["G2316"]], [" العاملة من خلال ", []], ["إيمانكم", ["G4102"]], ["، إلى أن تفوزوا ", []], ["بالخلاص", ["G4991"]], [" النهائي ", []], ["المعد", ["G2092"]], [" لكم والذي سوف ", []], ["يتجلى", ["G601"]], [" في ", []], ["الزمان", ["G2540"]], [" ", []], ["الأخير", ["G2078"]], [".", []]]}, {"c": 1, "v": 6, "text": "وهذا يدعوكم إلى الابتهاج، مع أنه لابد لكم الآن من الحزن فترة قصيرة تحت وطأة التجارب المتنوعة!", "groups": [{"kw": "ye greatly", "raw": "1Pe_1:8, 1Pe_4:13; 1Sa_2:1; Psa_9:14, Psa_35:10, Psa_95:1; Isa_12:2, Isa_12:3, Isa_61:3, Isa_61:10; Mat_5:12; Luk_1:47, Luk_2:10, Luk_10:20; Joh_16:22; Rom_5:2, Rom_5:11, Rom_12:12; 2Co_6:10, 2Co_12:9, 2Co_12:10; Gal_5:22; Phi_3:3, Phi_4:4; 1Th_1:6; Jam_1:2, Jam_1:9", "note": "", "refs": [{"l": "1Pe 1:8", "n": "", "vs": [[8, "أنتم لم تروا المسيح، ولكنكم تحبونه. ومع أنكم لا ترونه الآن، فأنتم تؤمنون به وتبتهجون بفرح مجيد يفوق الوصف."]]}, {"l": "1Pe 4:13", "n": "", "vs": [[13, "وإنما افرحوا: لأنكم كما تشاركون المسيح في الآلام الآن، لابد أن تفرحوا بمشاركته في الابتهاج عند ظهور مجده."]]}, {"l": "1Sa 2:1", "n": "", "vs": [[1, "وصلت حنة قائلة: «ابتهج قلبي بالرب وسمت عزتي به. أفتخر على أعدائي لأني فرحت بخلاصك."]]}, {"l": "Psa 9:14", "n": "", "vs": [[14, "لكي أحدث بجميع تسابيحك في أبواب ساكني صهيون، مبتهجا بخلاصك."]]}, {"l": "Psa 35:10", "n": "", "vs": [[10, "جميع عظامي تقول: يارب من مثلك، المخلص المسكين ممن هو أقوى منه ومنقذ الفقير والبائس من يد ناهبه؟"]]}, {"l": "Psa 95:1", "n": "", "vs": [[1, "هيا نرنم عاليا للرب، ونهتف فرحا لصخرة خلاصنا."]]}, {"l": "Isa 12:2", "n": "", "vs": [[2, "ها إن الله خلاصي فأطمئن ولا أرتعد، لأن الرب الله هو قوتي وترنيمتي وقد أصبح لي خلاصا»."]]}, {"l": "Isa 12:3", "n": "", "vs": [[3, "فتستقون ببهجة من ينابيع الخلاص."]]}, {"l": "Isa 61:3", "n": "", "vs": [[3, "لأمنح نائحي صهيون تاج جمال بدل الرماد، ودهن السرور بدل النوح، ورداء تسبيح بدل الروح اليائسة، فيدعون أشجار البر وغرس الرب لكي يتمجد."]]}, {"l": "Isa 61:10", "n": "", "vs": [[10, "إنني أبتهج حقا بالرب وتفرح نفسي بإلهي، لأنه كساني ثياب الخلاص وسربلني برداء البر، مثل عريس يزين رأسه بتاج، وكعروس تتجمل بحليها."]]}, {"l": "Mat 5:12", "n": "", "vs": [[12, "افرحوا وتهللوا، فإن مكافأتكم في السماوات عظيمة. فإنهم هكذا اضطهدوا الأنبياء من قبلكم!"]]}, {"l": "Luk 1:47", "n": "", "vs": [[47, "وتبتهج روحي بالله مخلصي."]]}, {"l": "Luk 2:10", "n": "", "vs": [[10, "فقال لهم الملاك: «لا تخافوا! فها أنا أبشركم بفرح عظيم يعم الشعب كله:"]]}, {"l": "Luk 10:20", "n": "", "vs": [[20, "إنما لا تفرحوا بهذا: بأن الأرواح تخضع لكم، بل افرحوا بأن أسماءكم قد كتبت في السماوات»."]]}, {"l": "Joh 16:22", "n": "", "vs": [[22, "فكذلك أنتم، تحزنون الآن؛ ولكن عندما أعود للقائكم، تبتهج قلوبكم، ولا أحد يسلبكم فرحكم."]]}, {"l": "Rom 5:2", "n": "", "vs": [[2, "وبه أيضا تم لنا الدخول بالإيمان إلى هذه النعمة التي نقيم فيها الآن؛ ونحن نفتخر برجائنا في التمتع بمجد الله."]]}, {"l": "Rom 5:11", "n": "", "vs": [[11, "وليس هذا فقط، بل إننا نفتخر أيضا بالله، بفضل ربنا يسوع المسيح الذي به نلنا المصالحة الآن."]]}, {"l": "Rom 12:12", "n": "", "vs": [[12, "فرحين بالرجاء، صابرين في الضيق، مواظبين على الصلاة،"]]}, {"l": "2Co 6:10", "n": "", "vs": [[10, "كمحزونين ونحن دائما فرحون، كفقراء ونحن نغني كثيرين، كمن لا شيء عندهم ونحن نملك كل شيء."]]}, {"l": "2Co 12:9", "n": "", "vs": [[9, "فقال لي: «نعمتي تكفيك، لأن قدرتي تكمل في الضعف!» فأنا أرضى بأن أفتخر مسرورا بالضعفات التي في، لكي تخيم علي قدرة المسيح."]]}, {"l": "2Co 12:10", "n": "", "vs": [[10, "فلأجل المسيح، تسرني الضعفات والإهانات والضيقات والاضطهادات والصعوبات، لأني حينما أكون ضعيفا، فحينئذ أكون قويا!"]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Phi 3:3", "n": "", "vs": [[3, "فإننا نحن أهل الختان الحق، لأننا إنما نعبد بروح الله ونفتخر في المسيح يسوع، ولا نعتمد على أمور الجسد،"]]}, {"l": "Phi 4:4", "n": "", "vs": [[4, "افرحوا في الرب دائما، وأقول أيضا: افرحوا."]]}, {"l": "1Th 1:6", "n": "", "vs": [[6, "وقد صرتم مقتدين بنا وبالرب، إذ تقبلتم كلمة الله في وسط ضيقة شديدة بفرح الروح القدس."]]}, {"l": "Jam 1:2", "n": "", "vs": [[2, "ياإخوتي، عندما تنزل بكم التجارب والمحن المختلفة، اعتبروها سبيلا إلى الفرح الكلي."]]}, {"l": "Jam 1:9", "n": "", "vs": [[9, "من كان فقيرا وأخا مؤمنا، فليسر بمقامه الذي رفعه الله إليه."]]}], "kwAr": "الابتهاج", "noteAr": ""}, {"kw": "for", "raw": "1Pe_4:7, 1Pe_5:10; 2Co_4:17", "note": "", "refs": [{"l": "1Pe 4:7", "n": "", "vs": [[7, "إن نهاية كل شيء قد صارت قريبة. فتعقلوا إذن، وكونوا متنبهين لرفع الصلاة دائما."]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}, {"l": "2Co 4:17", "n": "", "vs": [[17, "ذلك لأن ما يضايقنا الآن من صعوبات بسيطة عابرة، ينتج لنا بمقدار لا يحد وزنة أبدية من المجد،"]]}], "kwAr": "فترة قصيرة", "noteAr": ""}, {"kw": "if", "raw": "1Pe_1:7; Psa_119:75; Lam_3:32, Lam_3:33; Heb_12:7-11", "note": "", "refs": [{"l": "1Pe 1:7", "n": "", "vs": [[7, "إلا أن غاية هذه التجارب هي اختبار حقيقة إيمانكم. فكما تختبر النار الذهب وتنقيه، تختبر التجارب حقيقة إيمانكم، وهو أثمن جدا من الذهب الفاني. وهكذا، يكون إيمانكم مدعاة مدح وإكرام وتمجيد لكم، عندما يعود يسوع المسيح ظاهرا بمجده."]]}, {"l": "Psa 119:75", "n": "", "vs": [[75, "قد علمت يارب أن أحكامك عادلة، وأنك بالحق أدبتني."]]}, {"l": "Lam 3:32", "n": "", "vs": [[32, "فإنه ولو أحزن يرأف بمقتضى رحمته الفائقة."]]}, {"l": "Lam 3:33", "n": "", "vs": [[33, "لأنه لا يتعمد أن يبتلي أبناء البشر بالبؤس والأسى،"]]}, {"l": "Heb 12:7-11", "n": "", "vs": [[7, "إذن، تحملوا تأديب الرب. فهو يعاملكم معاملة الأبناء: وأي ابن لا يؤدبه أبوه؟"], [8, "فإن كنتم لا تتلقون التأديب الذي يشترك فيه أبناء الله جميعا، فمعنى ذلك أنكم لستم أبناء شرعيين له."], [9, "إن آباءنا الأرضيين كانوا يؤدبوننا ونحن أولاد، وكنا نحترمهم. أفلا يجدر بنا الآن أن نخضع خضوعا تاما لتأديب أبي الأرواح، لنحيا حياة فضلى؟"], [10, "وقد أدبنا آباؤنا فترة من الزمان، حسب ما رأوه مناسبا. أما الله ، فيؤدبنا دائما من أجل منفعتنا: لكي نشترك في قداسته."], [11, "وطبعا، كل تأديب لا يبدو في الحال باعثا على الفرح، بل على الحزن. ولكنه فيما بعد، ينتج بسلام في الذين يتلقونه ثمر البر."]]}], "kwAr": "لابد لكم", "noteAr": ""}, {"kw": "ye are", "raw": "Job_9:27, Job_9:28; Psa_69:20, Psa_119:28; Isa_61:3; Mat_11:28, Mat_26:37; Rom_9:2; Phi_2:26; Heb_12:11; Jam_4:9", "note": "", "refs": [{"l": "Job 9:27", "n": "", "vs": [[27, "إن قلت: أنسى ضيقتي، وأطلق أساريري، وأبتسم وأبدي بشرا،"]]}, {"l": "Job 9:28", "n": "", "vs": [[28, "فإني أظل أخشى أوجاعي، عالما أنك لن تبرئني."]]}, {"l": "Psa 69:20", "n": "", "vs": [[20, "كسر العار قلبي فمرضت. التمست عطفا فلم أجد، ومعزين فلم أعثر على أحد."]]}, {"l": "Psa 119:28", "n": "", "vs": [[28, "نفسي ذائبة من الحزن. قوني بحسب وعدك."]]}, {"l": "Isa 61:3", "n": "", "vs": [[3, "لأمنح نائحي صهيون تاج جمال بدل الرماد، ودهن السرور بدل النوح، ورداء تسبيح بدل الروح اليائسة، فيدعون أشجار البر وغرس الرب لكي يتمجد."]]}, {"l": "Mat 11:28", "n": "", "vs": [[28, "تعالوا إلي ياجميع المتعبين والرازحين تحت الأحمال الثقيلة، وأنا أريحكم."]]}, {"l": "Mat 26:37", "n": "", "vs": [[37, "وقد أخذ معه بطرس وابني زبدي وبدأ يشعر بالحزن والكآبة."]]}, {"l": "Rom 9:2", "n": "", "vs": [[2, "إن بي حزنا شديدا، وبقلبي ألم لا ينقطع:"]]}, {"l": "Phi 2:26", "n": "", "vs": [[26, "إذ كان مشتاقا إليكم جميعا، ومكتئبا لسماعكم بمرضه."]]}, {"l": "Heb 12:11", "n": "", "vs": [[11, "وطبعا، كل تأديب لا يبدو في الحال باعثا على الفرح، بل على الحزن. ولكنه فيما بعد، ينتج بسلام في الذين يتلقونه ثمر البر."]]}, {"l": "Jam 4:9", "n": "", "vs": [[9, "احزنوا مولولين ونائحين وباكين. ليتحول ضحككم إلى نواح، وفرحكم إلى كآبة."]]}], "kwAr": "الحزن", "noteAr": ""}, {"kw": "manifold", "raw": "Psa_34:19; Joh_16:33; Act_14:22; 1Co_4:9-13; 2Co_4:7-11, 2Co_11:23-27; Heb_11:35-38; Jam_1:2", "note": "", "refs": [{"l": "Psa 34:19", "n": "", "vs": [[19, "ما أكثر مصائب الصديق، ولكن من جميعها ينقذه الرب."]]}, {"l": "Joh 16:33", "n": "", "vs": [[33, "أخبرتكم بهذا كله ليكون لكم في سلام. فإنكم في العالم ستقاسون الضيق. ولكن تشجعوا، فأنا قد انتصرت على العالم!»"]]}, {"l": "Act 14:22", "n": "", "vs": [[22, "وفي هذه الأماكن كلها كانا يشددان عزيمة التلاميذ، ويحثانهم على الثبات في الإيمان، مؤكدين لهم أن دخول ملكوت الله يقتضي أن نقاسي صعوبات كثيرة."]]}, {"l": "1Co 4:9-13", "n": "", "vs": [[9, "فإني أرى أن الله عرضنا، نحن الرسل، في آخر الموكب كأنه محكوم علينا بالموت، لأننا صرنا معرضا للعالم، للملائكة والبشر معا."], [10, "نحن جهلاء من أجل المسيح، وأنتم حكماء في المسيح. نحن ضعفاء وأنتم أقوياء. أنتم مكرمون ونحن مهانون."], [11, "فما زلنا حتى هذه الساعة نجوع ونعطش، ونعرى ونلطم ونحرم محلا للإقامة"], [12, "ونجهد أنفسنا في الشغل بأيدينا. نتعرض للإهانة فنبارك، وللاضطهاد فنحتمل"], [13, "وللتجريح فنسالم. صرنا كأقذار العالم ونفاية الجميع، ومازلنا!"]]}, {"l": "2Co 4:7-11", "n": "", "vs": [[7, "ولكن هذا الكنز نحمله نحن في أوعية من فخار، ليتبين أن القدرة الفائقة آتية من الله لا صادرة منا."], [8, "فالصعوبات تضيق علينا من كل جهة، ولكن لا ننهار. لا نجد حلا مناسبا، ولكن لا نيأس."], [9, "يطاردنا الاضطهاد، ولكن لا يتخلى الله عنا. نطرح أرضا، ولكن لا نموت."], [10, "وحيثما ذهبنا، نحمل موت يسوع دائما في أجسادنا لتظهر فيها أيضا حياة يسوع."], [11, "فمع أننا مازلنا أحياء، فإننا نسلم دائما إلى الموت من أجل يسوع، لتظهر في أجسادنا الفانية حياة يسوع أيضا."]]}, {"l": "2Co 11:23-27", "n": "", "vs": [[23, "وإن كانوا خدام المسيح، أتكلم كأني فقدت صوابي، فأنا متفوق عليهم: في الأتعاب أوفر منهم جدا، في الجلدات فوق الحد، في السجون أوفر جدا، في التعرض للموت أكثر مرارا."], [24, "من اليهود تلقيت الجلد خمس مرات، كل مرة أربعين جلدة إلا واحدة."], [25, "ضربت بالعصي ثلاث مرات. رجمت بالحجارة مرة. تحطمت بي السفينة ثلاث مرات. قضيت في عرض البحر يوما بنهاره وليله."], [26, "سافرت أسفارا عديدة؛ وواجهتني أخطار السيول الجارفة، وأخطار قطاع الطرق، وأخطار من بني جنسي، وأخطار من الأمم، وأخطار في المدن، وأخطار في البراري، وأخطار في البحر، وأخطار بين إخوة دجالين."], [27, "وكم عانيت من التعب والكد والسهر الطويل، والجوع والعطش والصوم الكثير، والبرد والعري."]]}, {"l": "Heb 11:35-38", "n": "", "vs": [[35, "وبالإيمان، استرجعت بعض النساء أمواتهن بعدما أعيدوا إلى الحياة. وبه، تحمل كثيرون العذاب والضرب، وماتوا رافضين النجاة لعلمهم أنهم سوف يقومون إلى حياة أفضل."], [36, "وكثيرون غيرهم تحملوا المحاكمات الظالمة تحت الإهانة والجلد، والإلقاء في السجون مقيدين بالسلاسل."], [37, "ومنهم من حوكموا فماتوا رجما بالحجارة، أو نشرا بالمنشار، أو ذبحا بالسيف. وبعضهم، تشردوا متسترين بجلود الغنم والمعزى، يعانون من الحاجة والضيق والظلم،"], [38, "ولم يكن العالم يستحقهم، تائهين في البراري والجبال والمغاور والكهوف."]]}, {"l": "Jam 1:2", "n": "", "vs": [[2, "ياإخوتي، عندما تنزل بكم التجارب والمحن المختلفة، اعتبروها سبيلا إلى الفرح الكلي."]]}], "kwAr": "التجارب المتنوعة", "noteAr": ""}], "arS": [["وهذا يدعوكم إلى ", []], ["الابتهاج", ["G21"]], ["، مع أنه ", []], ["لابد", ["G1163"]], [" لكم ", []], ["الآن", ["G737"]], [" من ", []], ["الحزن", ["G3076"]], [" ", []], ["فترة قصيرة", ["G3641"]], [" تحت وطأة ", []], ["التجارب", ["G3986"]], [" ", []], ["المتنوعة", ["G4164"]], ["!", []]]}, {"c": 1, "v": 7, "text": "إلا أن غاية هذه التجارب هي اختبار حقيقة إيمانكم. فكما تختبر النار الذهب وتنقيه، تختبر التجارب حقيقة إيمانكم، وهو أثمن جدا من الذهب الفاني. وهكذا، يكون إيمانكم مدعاة مدح وإكرام وتمجيد لكم، عندما يعود يسوع المسيح ظاهرا بمجده.", "groups": [{"kw": "the trial", "raw": "1Pe_4:12; Job_23:10; Psa_66:10-12; Pro_17:3; Isa_48:10; Jer_9:7; Zec_13:9; Mal_3:3; Rom_5:3, Rom_5:4; Jam_1:3, Jam_1:4, Jam_1:12; Rev_2:10, Rev_3:10", "note": "", "refs": [{"l": "1Pe 4:12", "n": "", "vs": [[12, "أيها الأحباء، لا تستغربوا نار الاضطهاد المشتعلة عندكم لاختباركم وكأن أمرا غريبا قد أصابكم!"]]}, {"l": "Job 23:10", "n": "", "vs": [[10, "ولكنه يعرف الطريق الذي أسلكه، وإذا امتحنني أخرج كالذهب"]]}, {"l": "Psa 66:10-12", "n": "", "vs": [[10, "فإنك قد اختبرتنا ياالله ، فنقيتنا كما تنقى الفضة."], [11, "أوقعتنا في الشبكة وألقيت حملا ثقيلا على ظهورنا."], [12, "سلطت أناسا علينا. اجتزنا في النار والماء، ولكنك أخرجتنا إلى أراض خصيبة."]]}, {"l": "Pro 17:3", "n": "", "vs": [[3, "كما تنقي البوتقة الفضة، والكور الذهب، فإن الرب يمتحن القلوب أيضا."]]}, {"l": "Isa 48:10", "n": "", "vs": [[10, "نقيتك وليس كالفضة وامتحنتك في كور الألم."]]}, {"l": "Jer 9:7", "n": "", "vs": [[7, "لذلك يعلن الرب القدير: «ها أنا أمحصهم وأمتحنهم، إذ أي شيء آخر يمكن أن أفعله عقابا لخطايا أورشليم؟"]]}, {"l": "Zec 13:9", "n": "", "vs": [[9, "فأجيز هذا الثلث في النار لأنقيه تنقية الفضة، وأمحصه كما يمحص الذهب. هو يدعو باسمي وأنا أستجيبه. أنا أقول: هو شعبي، وهو يقول: الرب هو إلهي»."]]}, {"l": "Mal 3:3", "n": "", "vs": [[3, "فيجلس ممحصا ومنقيا للفضة ليطهر أبناء لاوي ويمحصهم كالفضة والذهب، حتى يقربوا للرب تقدمات بقلوب طاهرة."]]}, {"l": "Rom 5:3", "n": "", "vs": [[3, "ليس هذا فقط، بل نفتخر أيضا في وسط الضيقات، لعلمنا أن الضيق ينتج فينا الصبر،"]]}, {"l": "Rom 5:4", "n": "", "vs": [[4, "والصبر يؤهلنا للفوز في الامتحان، والفوز يبعث فينا الرجاء،"]]}, {"l": "Jam 1:3", "n": "", "vs": [[3, "وكونوا على ثقة بأن امتحان إيمانكم هذا ينتج صبرا."]]}, {"l": "Jam 1:4", "n": "", "vs": [[4, "ودعوا الصبر يعمل عمله الكامل فيكم، لكي يكتمل نضوجكم وتصيروا أقوياء قادرين على مواجهة جميع الأحوال."]]}, {"l": "Jam 1:12", "n": "", "vs": [[12, "طوبى لمن يتحمل المحنة بصبر. فإنه، بعد أن يجتاز الامتحان بنجاح، سينال «إكليل الحياة» الذي وعد به الرب محبيه!"]]}, {"l": "Rev 2:10", "n": "", "vs": [[10, "دع عنك الخوف مما ينتظرك من آلام، فإن إبليس سيزج ببعضكم في السجن لكي تمتحنوا، فتقاسون الاضطهاد عشرة أيام. فابق أمينا حتى الموت، فأمنحك إكليل الحياة."]]}, {"l": "Rev 3:10", "n": "", "vs": [[10, "ولأنك حفظت كلمتي وصبرت، فسأحفظك أنا أيضا من ساعة التجربة التي ستأتي على العالم أجمع لتجرب الساكنين على الأرض."]]}], "kwAr": "اختبار حقيقة إيمانكم", "noteAr": ""}, {"kw": "precious", "raw": "1Pe_2:4, 1Pe_2:7; Pro_3:13-15, Pro_8:19, Pro_16:16; 2Pe_1:1, 2Pe_1:4", "note": "", "refs": [{"l": "1Pe 2:4", "n": "", "vs": [[4, "فأنتم قد أتيتم إليه، باعتباره الحجر الحي الذي رفضه الناس، واختاره الله ، وهو ثمين في نظره."]]}, {"l": "1Pe 2:7", "n": "", "vs": [[7, "فإن هذا الحجر هو ثمين في نظركم، أنتم المؤمنين به. أما بالنسبة إلى الذين لا يؤمنون، «فالحجر الذي رفضه البناؤون صار هو الحجر الأساسي رأس زاوية البيت»،"]]}, {"l": "Pro 3:13-15", "n": "", "vs": [[13, "طوبى للإنسان الذي عثر على الحكمة وللرجل الذي أحرز فهما،"], [14, "لأن مكاسبها أفضل من مكاسب الفضة، وأرباحها خير من أرباح الذهب الخالص."], [15, "هي أثمن من الجواهر، وكل نفائسك لا تعادلها."]]}, {"l": "Pro 8:19", "n": "", "vs": [[19, "ثمري أفضل من الذهب الخالص، وغلتي خير من الفضة المنتقاة."]]}, {"l": "Pro 16:16", "n": "", "vs": [[16, "اقتناء الحكمة أفضل من الذهب، وإحراز الفطنة خير من الفضة."]]}, {"l": "2Pe 1:1", "n": "", "vs": [[1, "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"]]}, {"l": "2Pe 1:4", "n": "", "vs": [[4, "اللذين بهما أعطانا الله بركاته العظمى الثمينة التي كان قد وعد بها. وبهذا صار بإمكانكم أن تتخلصوا من الفساد الذي تنشره الشهوة في العالم، وتشتركوا في الطبيعة الإلهية."]]}], "kwAr": "أثمن جدا", "noteAr": ""}, {"kw": "that", "raw": "Ecc_5:14; Jer_48:36; Luk_12:20,Luk_12:21, Luk_12:33; Act_8:20; Jam_5:2, Jam_5:3; 2Pe_3:10-12; Rev_18:16, Rev_18:17", "note": "", "refs": [{"l": "Ecc 5:14", "n": "", "vs": [[14, "أو ثروة تلفت في مشروع خاسر، ولم يبق (صاحبها) لابنه الذي أنجبه شيئا."]]}, {"l": "Jer 48:36", "n": "", "vs": [[36, "لذلك يئن قلبي على موآب كأنين مزمار، وينوح فؤادي على رجال قير حارس كنوح الناي، فإن ثروتهم التي اكتسبوها قد تبددت."]]}, {"l": "Luk 12:20", "n": "", "vs": [[20, "ولكن الله قال له: ياغبي، هذه الليلة تطلب نفسك منك، فلمن يبقى ما أعددته؟"]]}, {"l": "Luk 12:21", "n": "", "vs": [[21, "هذه هي حالة من يخزن الكنوز لنفسه ولا يكون غنيا عند الله!»"]]}, {"l": "Luk 12:33", "n": "", "vs": [[33, "بيعوا ما تملكون وأعطوا صدقة، واجعلوا لكم أكياسا لا تبلى، كنزا في السماوات لا ينفد، حيث لا يقترب لص ولا يفسد سوس."]]}, {"l": "Act 8:20", "n": "", "vs": [[20, "فقال له بطرس: «لتبق لك فضتك لهلاكك! لأنك ظننت أنك تقدر أن تشتري هبة الله بالمال!"]]}, {"l": "Jam 5:2", "n": "", "vs": [[2, "إن ثرواتكم الكثيرة قد فسدت، وثيابكم الفاخرة قد أكلها العث"]]}, {"l": "Jam 5:3", "n": "", "vs": [[3, "ذهبكم وفضتكم قد تآكلا، وسيكون تآكلهما شاهدا ضدكم، ويأكل لحمكم كنار جمعتموها ثروة للأيام الأخيرة؟"]]}, {"l": "2Pe 3:10-12", "n": "", "vs": [[10, "إلا أن «يوم الرب» سيأتي كما يأتي اللص في الليل. في ذلك اليوم، تزول السماوات محدثة دويا هائلا وتنحل العناصر محترقة بنار شديدة، وتحترق الأرض وما فيها من منجزات."], [11, "ومادامت هذه الأشياء جميعا ستنحل، فكيف يجب أن تكونوا أنتم أصحاب سلوك مقدس يتصف بالتقوى،"], [12, "منتظرين «يوم الله» الأبدي وطالبين حلوله بسرعة. ففي ذلك اليوم، تنحل السماوات ملتهبة، وتذوب العناصر محترقة."]]}, {"l": "Rev 18:16", "n": "", "vs": [[16, "قائلين: الويل، الويل على المدينة العظمى! كانت ترتدي أفضل الكتان والأرجوان والقرمز، وتتحلى بالذهب والأحجار الكريمة واللؤلوء،"]]}, {"l": "Rev 18:17", "n": "", "vs": [[17, "وقد زال هذا الغنى كله في ساعة واحدة!"]]}], "kwAr": "الذهب الفاني", "noteAr": ""}, {"kw": "tried", "raw": "1Pe_4:12; Job_23:10; Psa_66:10; Pro_17:3; Isa_48:10; Zec_13:9; 1Co_3:13; Rev_3:18", "note": "", "refs": [{"l": "1Pe 4:12", "n": "", "vs": [[12, "أيها الأحباء، لا تستغربوا نار الاضطهاد المشتعلة عندكم لاختباركم وكأن أمرا غريبا قد أصابكم!"]]}, {"l": "Job 23:10", "n": "", "vs": [[10, "ولكنه يعرف الطريق الذي أسلكه، وإذا امتحنني أخرج كالذهب"]]}, {"l": "Psa 66:10", "n": "", "vs": [[10, "فإنك قد اختبرتنا ياالله ، فنقيتنا كما تنقى الفضة."]]}, {"l": "Pro 17:3", "n": "", "vs": [[3, "كما تنقي البوتقة الفضة، والكور الذهب، فإن الرب يمتحن القلوب أيضا."]]}, {"l": "Isa 48:10", "n": "", "vs": [[10, "نقيتك وليس كالفضة وامتحنتك في كور الألم."]]}, {"l": "Zec 13:9", "n": "", "vs": [[9, "فأجيز هذا الثلث في النار لأنقيه تنقية الفضة، وأمحصه كما يمحص الذهب. هو يدعو باسمي وأنا أستجيبه. أنا أقول: هو شعبي، وهو يقول: الرب هو إلهي»."]]}, {"l": "1Co 3:13", "n": "", "vs": [[13, "فعمل كل واحد سينكشف علنا إذ يظهره ذلك اليوم الذي سيعلن في نار، وسوف تمتحن النار قيمة عمل كل واحد."]]}, {"l": "Rev 3:18", "n": "", "vs": [[18, "نصيحتي لك أن تشتري مني ذهبا نقيا، صفته النار، فتغتني حقا، وثيابا بيضاء ترتديها فتستر عريك المعيب، وكحلا لشفاء عينيك فيعود إليك البصر."]]}], "kwAr": "تختبر النار الذهب", "noteAr": ""}, {"kw": "might", "raw": "1Sa_2:30; Mat_19:28, Mat_25:21, Mat_25:23; Joh_5:44, Joh_12:26; Rom_2:7, Rom_2:29; 1Co_4:5; 2Th_1:7-12; Jud_1:24", "note": "", "refs": [{"l": "1Sa 2:30", "n": "", "vs": [[30, "لذلك يقول الرب إله إسرائيل: لقد وعدت أن يظل بيتك وبيت أبيك يخدمون في محضري إلى الأبد. أما الآن، يقول الرب: فحاشا لي أن أفعل ذلك، لأنني أكرم الذين يكرمونني، أما الذين يحتقرونني فيصغرون."]]}, {"l": "Mat 19:28", "n": "", "vs": [[28, "فأجابهم يسوع: «الحق أقول لكم: إنه عندما يجلس ابن الإنسان على عرش مجده في زمن التجديد، تجلسون أنتم الذين تبعتموني على اثني عشر عرشا لتدينوا أسباط إسرائيل الاثني عشر."]]}, {"l": "Mat 25:21", "n": "", "vs": [[21, "فقال له سيده: حسنا فعلت أيها العبد الصالح والأمين! كنت أمينا على القليل، فسأقيمك على الكثير. ادخل إلى فرح سيدك!"]]}, {"l": "Mat 25:23", "n": "", "vs": [[23, "فقال له سيده: حسنا فعلت أيها العبد الصالح والأمين! كنت أمينا على القليل، فسأقيمك على الكثير. ادخل إلى فرح سيدك!"]]}, {"l": "Joh 5:44", "n": "", "vs": [[44, "من أين لكم أن تؤمنوا بي وأنتم تقبلون المجد بعضكم من بعض، دون أن تسعوا في طلب المجد الذي لا يمنحه إلا الله !"]]}, {"l": "Joh 12:26", "n": "", "vs": [[26, "من أراد أن يخدمني فليتبعني. وحيث أكون أنا يكون خادمي أيضا. وكل من يخدمني يكرمه أبي."]]}, {"l": "Rom 2:7", "n": "", "vs": [[7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"]]}, {"l": "Rom 2:29", "n": "", "vs": [[29, "وإنما اليهودي هو من كان يهوديا في الباطن، والختان هو ما كان ختانا للقلب بالروح لا بالحرف. وهذا يأتيه المدح لا من الناس بل من الله!"]]}, {"l": "1Co 4:5", "n": "", "vs": [[5, "إذن، لا تحكموا في شيء قبل الأوان، ريثما يرجع الرب الذي سيسلط النور على الأشياء التي يحجبها الظلام الآن، ويكشف نيات القلوب، عندئذ ينال كل واحد حقه من المدح من عند الله!"]]}, {"l": "2Th 1:7-12", "n": "", "vs": [[7, "وأن يكافئكم، أنتم الذين تتضايقون، كما يكافئنا نحن، بالراحة لدى ظهور الرب يسوع علنا من السماء، ومعه ملائكة قدرته،"], [8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."], [9, "فهؤلاء سيكابدون عقاب الهلاك الأبدي، بعيدا من حضرة الرب ومن مجد قوته،"], [10, "عندما يعود في ذلك اليوم ليتمجد في قديسيه ويكون موضع العجب عند جميع الذين آمنوا، وأنتم قد آمنتم بشهادتنا لكم!"], [11, "لأجل ذلك أيضا نصلي من أجلكم على الدوام، لكي يجعلكم إلهنا مؤهلين للدعوة الإلهية ويتم فيكم، بقدرته، كل ما يسره من الصلاح وفعالية الإيمان،"], [12, "حتى يتمجد اسم ربنا يسوع فيكم وتتمجدوا أنتم فيه وفقا لنعمة إلهنا وربنا يسوع المسيح."]]}, {"l": "Jud 1:24", "n": "", "vs": [[24, "وللقادر أن يحرسكم من السقوط حتى يوصلكم إلى المثول أمامه في المجد مبتهجين ولا عيب فيكم …"]]}], "kwAr": "مدعاة مدح وإكرام وتمجيد", "noteAr": ""}, {"kw": "at", "raw": "1Pe_1:5; Rev_1:7", "note": "", "refs": [{"l": "1Pe 1:5", "n": "", "vs": [[5, "محفوظا لكم في السماوات. فإنكم محفوظون بقدرة الله العاملة من خلال إيمانكم، إلى أن تفوزوا بالخلاص النهائي المعد لكم والذي سوف يتجلى في الزمان الأخير."]]}, {"l": "Rev 1:7", "n": "", "vs": [[7, "ها هو آت مع السحاب! ستراه عيون الجميع، حتى أولئك الذين طعنوه، وتنوح بسببه قبائل الأرض كلها! نعم، آمين!"]]}], "kwAr": "عندما يعود يسوع المسيح ظاهرا", "noteAr": ""}], "arS": [["إلا أن غاية هذه التجارب هي ", []], ["اختبار", ["G1383"]], [" حقيقة ", []], ["إيمانكم", ["G4102"]], [". فكما تختبر ", []], ["النار", ["G4442"]], [" ", []], ["الذهب", ["G5553"]], [" وتنقيه، تختبر التجارب حقيقة إيمانكم، وهو ", []], ["أثمن", ["G5093"]], [" جدا من الذهب ", []], ["الفاني", ["G622"]], [". وهكذا، يكون إيمانكم مدعاة ", []], ["مدح", ["G1868"]], [" ", []], ["وإكرام", ["G5092"]], [" ", []], ["وتمجيد", ["G1391"]], [" لكم، عندما يعود ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [" ", []], ["ظاهرا", ["G602"]], [" بمجده.", []]]}, {"c": 1, "v": 8, "text": "أنتم لم تروا المسيح، ولكنكم تحبونه. ومع أنكم لا ترونه الآن، فأنتم تؤمنون به وتبتهجون بفرح مجيد يفوق الوصف.", "groups": [{"kw": "having", "raw": "Joh_20:29; 2Co_4:18, 2Co_5:7; Heb_11:1, Heb_11:27; 1Jo_4:20", "note": "", "refs": [{"l": "Joh 20:29", "n": "", "vs": [[29, "فقال له يسوع: «ألأنك رأيتني آمنت؟ طوبى للذين يؤمنون دون أن يروا»"]]}, {"l": "2Co 4:18", "n": "", "vs": [[18, "إذ نرفع أنظارنا عن الأمور المنظورة ونثبتها على الأمور غير المنظورة. فإن الأمور المنظورة إنما هي إلى حين؛ وأما غير المنظورة فهي أبدية."]]}, {"l": "2Co 5:7", "n": "", "vs": [[7, "لأننا نسلك بالإيمان لا بالعيان."]]}, {"l": "Heb 11:1", "n": "", "vs": [[1, "أما الإيمان، فهو الثقة بأن ما نرجوه لابد أن يتحقق، والاقتناع بأن ما لا نراه موجود حقا."]]}, {"l": "Heb 11:27", "n": "", "vs": [[27, "بالإيمان، ترك أرض مصر وهو غير خائف من غضب الملك. فقد مضى في تنفيذ قراره، كأنه يرى بجانبه الله غير المنظور."]]}, {"l": "1Jo 4:20", "n": "", "vs": [[20, "فإن قال أحد: «أنا أحب الله !» ولكنه يبغض أخا له، فهو كاذب، لأنه إن كان لا يحب أخاه الذي يراه، فكيف يقدر أن يحب الله الذي لم يره قط؟"]]}], "kwAr": "لم تروا المسيح", "noteAr": ""}, {"kw": "ye love", "raw": "1Pe_2:7; Son_1:7, Son_5:9, Son_5:16; Mat_10:37, Mat_25:35-40; Joh_8:42, Joh_14:15, Joh_14:21, Joh_14:24; Joh_21:15-17; 1Co_16:22; 2Co_5:14, 2Co_5:15; Gal_5:6; Eph_6:24; 1Jo_4:19", "note": "", "refs": [{"l": "1Pe 2:7", "n": "", "vs": [[7, "فإن هذا الحجر هو ثمين في نظركم، أنتم المؤمنين به. أما بالنسبة إلى الذين لا يؤمنون، «فالحجر الذي رفضه البناؤون صار هو الحجر الأساسي رأس زاوية البيت»،"]]}, {"l": "Son 1:7", "n": "", "vs": [[7, "قل لي يامن تحبه نفسي، أين ترعى قطعانك وأين تربض بها عند الظهيرة؟ فلماذا أكون كامرأة مقنعة، أتجول بجوار قطعان أصحابك؟"]]}, {"l": "Son 5:9", "n": "", "vs": [[9, "(بنات أورشليم): بم يفوق حبيبك المحبين أيتها الجميلة بين النساء؟ بم يفوق حبيبك المحبين حتى تستحلفينا هكذا؟"]]}, {"l": "Son 5:16", "n": "", "vs": [[16, "فمه عذب، وكله مشتهيات. هذا هو حبيبي وهذا هو خليلي يابنات أورشليم!"]]}, {"l": "Mat 10:37", "n": "", "vs": [[37, "من أحب أباه أو أمه أكثر مني، فلا يستحقني. ومن أحب ابنه أو ابنته أكثر مني، فلا يستحقني."]]}, {"l": "Mat 25:35-40", "n": "", "vs": [[35, "لأني جعت فأطعمتموني، عطشت فسقيتموني، كنت غريبا فآويتموني،"], [36, "عريانا فكسوتموني، مريضا فزرتموني، سجينا فأتيتم إلي!"], [37, "فيرد الأبرار قائلين: يارب، متى رأيناك جائعا فأطعمناك، أو عطشانا فسقيناك؟"], [38, "ومتى رأيناك غريبا فآويناك، أو عريانا فكسوناك؟"], [39, "ومتى رأيناك مريضا أو سجينا فزرناك؟"], [40, "فيجيبهم الملك: الحق أقول لكم: بما أنكم فعلتم ذلك بأحد إخوتي هؤلاء الصغار، فبي فعلتم!"]]}, {"l": "Joh 8:42", "n": "", "vs": [[42, "فقال يسوع: «لو كان الله أباكم لكنتم تحبونني، لأني خرجت من الله وجئت. لم آت من نفسي، بل هو الذي أرسلني."]]}, {"l": "Joh 14:15", "n": "", "vs": [[15, "إن كنتم تحبونني فاعملوا بوصاياي."]]}, {"l": "Joh 14:21", "n": "", "vs": [[21, "من كانت عنده وصاياي، ويعمل بها، فذاك يحبني. والذي يحبني، يحبه أبي، وأنا أحبه وأعلن له ذاتي»."]]}, {"l": "Joh 14:24", "n": "", "vs": [[24, "والذي لا يحبني لا يعمل بكلامي. وليس هذا الكلام الذي تسمعونه من عندي، بل من الآب الذي أرسلني،"]]}, {"l": "Joh 21:15-17", "n": "", "vs": [[15, "وبعدما أكلوا سأل يسوع سمعان بطرس: «ياسمعان بن يونا، أتحبني أكثر مما يحبني هؤلاء؟» فأجابه «نعم يارب، أنت تعلم أني أحبك!» فقال له: «أطعم حملاني!»"], [16, "ثم سأله ثانية: «ياسمعان بن يونا، أتحبني؟» فأجابه: «نعم يارب. أنت تعلم أني أحبك!» قال له: «ارع خرافي»"], [17, "فسأله مرة ثالثة: «ياسمعان بن يونا، أتحبني؟» فحزن بطرس لأن يسوع قال له في المرة الثالثة: «أتحبني». وقال له: «يارب، أنت تعلم كل شيء. أنت تعلم أني أحبك!» فقال له يسوع: «أطعم خرافي!"]]}, {"l": "1Co 16:22", "n": "", "vs": [[22, "إن كان أحد لا يحب الرب فليكن «أناثيما» (أي ملعونا)!"]]}, {"l": "2Co 5:14", "n": "", "vs": [[14, "فإن محبة المسيح تسيطر علينا، وقد حكمنا بهذا: مادام واحد قد مات عوضا عن الجميع، فمعنى ذلك أن الجميع ماتوا؛"]]}, {"l": "2Co 5:15", "n": "", "vs": [[15, "وهو قد مات عوضا عن الجميع حتى لا يعيش الأحياء في ما بعد لأنفسهم بل للذي مات عوضا عنهم ثم قام."]]}, {"l": "Gal 5:6", "n": "", "vs": [[6, "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة."]]}, {"l": "Eph 6:24", "n": "", "vs": [[24, "لتكن النعمة مع جميع الذين يحبون ربنا يسوع المسيح محبة لا يعتريها الفساد!"]]}, {"l": "1Jo 4:19", "n": "", "vs": [[19, "ونحن نحب، لأن الله أحبنا أولا."]]}], "kwAr": "تحبونه", "noteAr": ""}, {"kw": "believing", "raw": "1Pe_1:6; Hab_3:17, Hab_3:18; Act_16:34; Rom_14:17, Rom_15:13; Phi_1:25, Phi_3:3, Phi_4:4", "note": "", "refs": [{"l": "1Pe 1:6", "n": "", "vs": [[6, "وهذا يدعوكم إلى الابتهاج، مع أنه لابد لكم الآن من الحزن فترة قصيرة تحت وطأة التجارب المتنوعة!"]]}, {"l": "Hab 3:17", "n": "", "vs": [[17, "فمع أنه لا يزهر التين ولا يكون حمل في الكروم يكذب عمل الزيتونة والحقول لا تصنع طعاما ينقطع الغنم من الحظيرة ولا بقر في المذاود"]]}, {"l": "Hab 3:18", "n": "", "vs": [[18, "فإني أبتهج بالرب وأفرح بإله خلاصي."]]}, {"l": "Act 16:34", "n": "", "vs": [[34, "ثم ذهب بهما إلى بيته وبسط لهما مائدة. وابتهج مع أهل بيته جميعا، إذ كان قد آمن بالله."]]}, {"l": "Rom 14:17", "n": "", "vs": [[17, "إذ ليس ملكوت الله بأكل وشرب، بل هو بر وسلام وفرح في الروح القدس."]]}, {"l": "Rom 15:13", "n": "", "vs": [[13, "فليملأكم إله الرجاء كل
