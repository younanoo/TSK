1392"]], [" ", []], ["يفوق الوصف", ["G412"]], [".", []]]}, {"c": 1, "v": 9, "text": "إذ بلغتم هدف إيمانكم، وهو خلاص نفوسكم.", "groups": [{"kw": "", "raw": "Rom_6:22; Heb_11:13; Jam_1:21", "note": "", "refs": [{"l": "Rom 6:22", "n": "", "vs": [[22, "أما الآن، وقد حررتم من الخطيئة وصرتم عبيدا لله، فإن لكم ثمركم للقداسة، والعاقبة هي الحياة الأبدية."]]}, {"l": "Heb 11:13", "n": "", "vs": [[13, "هؤلاء جميعا، حافظوا على إيمانهم إلى النهاية. وماتوا قبل أن تتحقق وعود الله لهم في أثناء حياتهم. ولكنهم رأوها من بعيد، وتوقعوا تحقيقها كاملة في المستقبل. وإذ آمنوا بتلك الوعود الإلهية اعترفوا بأنهم ليسوا إلا غرباء على الأرض يزورونها زيارة عابرة."]]}, {"l": "Jam 1:21", "n": "", "vs": [[21, "إذن، تخلصوا من كل ما في حياتكم من نجاسة وشر متزايد. وليكن قبولكم لتلك الكلمة التي غرسها الله في قلوبكم، قبولا وديعا. فهي القادرة أن تخلص نفوسكم."]]}], "kwAr": "", "noteAr": ""}], "arS": [["إذ ", []], ["بلغتم", ["G2865"]], [" ", []], ["هدف", ["G5056"]], [" ", []], ["إيمانكم", ["G4102"]], ["، وهو ", []], ["خلاص", ["G4991"]], [" ", []], ["نفوسكم", ["G5590"]], [".", []]]}, {"c": 1, "v": 10, "text": "وكم فتش الأنبياء قديما وبحثوا عن هذا الخلاص! فهم تنبأوا عن نعمة الله التي كان قد أعدها لكم أنتم،", "groups": [{"kw": "which", "raw": "Gen_49:10; Dan_2:44; Hag_2:7; Zec_6:12; Mat_13:17; Luk_10:24, Luk_24:25-27; Luk_24:44; Act_3:22-24, Act_7:52, Act_10:43, Act_13:27-29, Act_28:23; 2Pe_1:19-21", "note": "", "refs": [{"l": "Gen 49:10", "n": "", "vs": [[10, "لا يزول صولجان الملك من يهوذا ولا مشترع من صلبه حتى يأتي شيلوه (ومعناه: من له الأمر) فتطيعه الشعوب."]]}, {"l": "Dan 2:44", "n": "", "vs": [[44, "وفي عهد هؤلاء الملوك يقيم إله السماوات مملكة لا تنقرض إلى الأبد، ولا يترك ملكها لشعب آخر، وتسحق وتبيد جميع هذه الممالك. أما هي فتخلد إلى الأبد."]]}, {"l": "Hag 2:7", "n": "", "vs": [[7, "وأزعزع أركان جميع الأمم فتجلب نفائسهم إلى هذا المكان وأملأ هذا الهيكل بالمجد."]]}, {"l": "Zec 6:12", "n": "", "vs": [[12, "وقل له: هكذا يقول الرب القدير: ها هو الرجل الذي اسمه الغصن، الذي ينبت من ذاته ويبني هيكل الرب."]]}, {"l": "Mat 13:17", "n": "", "vs": [[17, "فالحق أقول لكم: كم تمنى أنبياء وأبرار كثيرون أن يروا ما تبصرون ولم يروا، وأن يسمعوا ما تسمعون ولم يسمعوا!"]]}, {"l": "Luk 10:24", "n": "", "vs": [[24, "فإني أقول لكم إن كثيرين من الأنبياء والملوك تمنوا أن يروا ما تبصرون ولكنهم لم يروا، وأن يسمعوا ما تسمعون ولكنهم لم يسمعوا»."]]}, {"l": "Luk 24:25-27", "n": "", "vs": [[25, "فقال لهما: «ياقليلي الفهم وبطيئي القلب في الإيمان بجميع ما تكلم به الأنبياء!"], [26, "أما كان لابد أن يعاني المسيح هذه الآلام ثم يدخل إلى مجده؟»"], [27, "ثم أخذ يفسر لهما، منطلقا من موسى ومن الأنبياء جميعا، ما ورد عنه في جميع الكتب."]]}, {"l": "Luk 24:44", "n": "", "vs": [[44, "ثم قال لهم: «هذا هو الكلام الذي كلمتكم به وأنا مازلت بينكم: أنه لابد أن يتم كل ما كتب عني في شريعة موسى وكتب الأنبياء والمزامير»."]]}, {"l": "Act 3:22-24", "n": "", "vs": [[22, "وقد قال موسى: سيبعث الله فيكم من بين إخوتكم نبيا مثلي فاسمعوا له في كل ما يكلمكم به."], [23, "أما من لا يسمع له فيباد من وسط الشعب."], [24, "وكذلك تنبأ بهذه الأزمنة جميع الأنبياء، من صموئيل إلى الذين جاءوا بعده."]]}, {"l": "Act 7:52", "n": "", "vs": [[52, "فأي نبي نجا من اضطهادهم وقد قتلوا الذين أنبأوا بمجيء البار الذي سلمتموه أنتم وقتلتموه!"]]}, {"l": "Act 10:43", "n": "", "vs": [[43, "له يشهد جميع الأنبياء أن كل من يؤمن به ينال باسمه غفران الخطايا»."]]}, {"l": "Act 13:27-29", "n": "", "vs": [[27, "فإن أهل أورشليم ورؤساءهم عملوا على إتمام ما يقرأ عليكم كل يوم سبت من نبوءات، وهم لا يعلمون. إذ حكموا على يسوع بالموت،"], [28, "ومع أنهم لم يثبتوا عليه أي جرم يستحق الموت، طلبوا من بيلاطس أن يقتله."], [29, "وبعدما نفذوا فيه كل ما كتب عنه، أنزلوه عن الصليب، ودفنوه في قبر."]]}, {"l": "Act 28:23", "n": "", "vs": [[23, "فحددوا موعدا للقاء قادم، جاءوا فيه مع كثيرين إلى منزل بولس. فشهد لهم من الصباح إلى المساء شارحا لهم أمور ملكوت الله ومحاولا إقناعهم بالأمور المختصة بيسوع استنادا إلى شريعة موسى وكتب الأنبياء."]]}, {"l": "2Pe 1:19-21", "n": "", "vs": [[19, "وهكذا، صارت الكلمة النبوية أكثر ثباتا عندنا. فحسنا تفعلون إن انتبهتم إلى هذه الكلمة في قلوبكم. إذ إنها أشبه بمصباح يضيء في مكان مظلم، إلى أن يطلع النهار ويظهر كوكب الصبح."], [20, "ولكن، قبل كل شيء، اعلموا أن كل نبوءة واردة في الكتاب لا تفسر باجتهاد خاص."], [21, "إذ لم تأت نبوءة قط بإرادة بشرية، بل تكلم بالنبوآت جميعا رجال الله غالقديسونف مدفوعين بوحي الروح القدس."]]}], "kwAr": "هذا الخلاص", "noteAr": ""}, {"kw": "and", "raw": "1Pe_1:11; Pro_2:4; Dan_9:3; Joh_5:39, Joh_7:52; Act_17:11", "note": "", "refs": [{"l": "1Pe 1:11", "n": "", "vs": [[11, "واجتهدوا لمعرفة الزمان والأحوال التي كان يشير إليها روح المسيح الذي كان عاملا فيهم، عندما شهد لهم مسبقا بما ينتظر المسيح من آلام، وبما يأتي بعدها من أمجاد."]]}, {"l": "Pro 2:4", "n": "", "vs": [[4, "إن التمسته كما تلتمس الفضة، وبحثت عنه كما يبحث عن الكنوز الدفينة،"]]}, {"l": "Dan 9:3", "n": "", "vs": [[3, "فاتجهت بنفسي إلى السيد الرب، أبتهل إليه بالصلاة والتضرعات والصوم وارتداء المسح والتعفر بالرماد."]]}, {"l": "Joh 5:39", "n": "", "vs": [[39, "أنتم تدرسون الكتب لأنكم تعتقدون أنها ستهديكم إلى الحياة الأبدية. هذه الكتب تشهد لي،"]]}, {"l": "Joh 7:52", "n": "", "vs": [[52, "فأجابوه: «ألعلك أنت أيضا من الجليل؟ ادرس الكتاب تعلم أنه لم يطلع قط نبي من الجليل!»"]]}, {"l": "Act 17:11", "n": "", "vs": [[11, "وكان يهود بيرية أشرف من يهود تسالونيكي، فقبلوا كلمة الله برغبة شديدة، وأخذوا يدرسون الكتاب يوميا ليتأكدوا من صحة التعليم."]]}], "kwAr": "وبحثوا", "noteAr": ""}, {"kw": "the grace", "raw": "Heb_11:13, Heb_11:40", "note": "", "refs": [{"l": "Heb 11:13", "n": "", "vs": [[13, "هؤلاء جميعا، حافظوا على إيمانهم إلى النهاية. وماتوا قبل أن تتحقق وعود الله لهم في أثناء حياتهم. ولكنهم رأوها من بعيد، وتوقعوا تحقيقها كاملة في المستقبل. وإذ آمنوا بتلك الوعود الإلهية اعترفوا بأنهم ليسوا إلا غرباء على الأرض يزورونها زيارة عابرة."]]}, {"l": "Heb 11:40", "n": "", "vs": [[40, "ولكن الله سبق فأعد لنا ما هو أفضل، وذلك حتى لا يكملوا بمعزل عنا."]]}], "kwAr": "نعمة الله", "noteAr": ""}], "arS": [["وكم ", []], ["فتش", ["G1567"]], [" ", []], ["الأنبياء", ["G4396"]], [" قديما ", []], ["وبحثوا", ["G1830"]], [" عن هذا ", []], ["الخلاص", ["G4991"]], ["! فهم ", []], ["تنبأوا", ["G4395"]], [" عن ", []], ["نعمة", ["G5485"]], [" الله التي كان قد أعدها لكم أنتم،", []]]}, {"c": 1, "v": 11, "text": "واجتهدوا لمعرفة الزمان والأحوال التي كان يشير إليها روح المسيح الذي كان عاملا فيهم، عندما شهد لهم مسبقا بما ينتظر المسيح من آلام، وبما يأتي بعدها من أمجاد.", "groups": [{"kw": "the Spirit", "raw": "1Pe_3:18, 1Pe_3:19; Rom_8:9; Gal_4:6; 2Pe_1:21; Rev_19:10", "note": "", "refs": [{"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}, {"l": "1Pe 3:19", "n": "", "vs": [[19, "بهذا الروح نفسه، ذهب قديما وبشر الناس الذين أصبحت أرواحهم الآن في السجن."]]}, {"l": "Rom 8:9", "n": "", "vs": [[9, "وأما أنتم، فلستم تحت سلطة الجسد بل تحت سلطة الروح، إذا كان روح الله ساكنا في داخلكم حقا. ولكن، إن كان أحد ليس له روح المسيح، فهو ليس للمسيح."]]}, {"l": "Gal 4:6", "n": "", "vs": [[6, "وبما أنكم أبناء له، أرسل الله إلى قلوبنا روح ابنه، مناديا: «أبا، ياأبانا»."]]}, {"l": "2Pe 1:21", "n": "", "vs": [[21, "إذ لم تأت نبوءة قط بإرادة بشرية، بل تكلم بالنبوآت جميعا رجال الله غالقديسونف مدفوعين بوحي الروح القدس."]]}, {"l": "Rev 19:10", "n": "", "vs": [[10, "فجثوت عند قدميه لأسجد له، فقال لي: «لا تفعل! إني عبد لله، مثلك ومثل إخوتك المؤمنين الذين لديهم الشهادة المختصة بيسوع: لله اسجد! فإن الشهادة المختصة بيسوع هي روح النبوءة»."]]}], "kwAr": "روح المسيح", "noteAr": ""}, {"kw": "the sufferings", "raw": "Psa. 22:1-21, 69:1-21, 88:1-18; Isa_52:13, Isa_52:14, Isa_53:1-10; Dan_9:24-26; Zec_13:7; Luk_24:25-27, Luk_24:44", "note": "", "refs": [{"l": "Psa 22:1-21", "n": "", "vs": [[1, "إلهي، إلهي، لماذا تركتني؟ لماذا تباعدت عن خلاصي وعن سماع صوت تنهداتي؟"], [2, "إلهي، أصرخ إليك مستغيثا في النهار فلا تجيبني، وفي الليل فلا راحة لي،"], [3, "مع أنك أنت القدوس الذي أقمت عرشك في وسط شعبك الذي يسبحك."], [4, "عليك اتكل آباؤنا، وبك وثقوا، وأنت قد نجيتهم."], [5, "إليك صرخوا فنجوا، وعليك اتكلوا فلم يخزوا."], [6, "أما أنا فدودة لا إنسان. عار في نظر البشر، ومنبوذ في عيني شعبي."], [7, "جميع الذين يرونني يستهزئون بي، يفتحون شفاههم علي بالباطل، ويهزون رؤوسهم قائلين:"], [8, "سلم إلى الرب أمره، فلينجده. لينقذه مادام قد سر به»."], [9, "أنت أخرجتني من الرحم. أنت جعلتني أنام مطمئنا وأنا مازلت على صدر أمي."], [10, "أنت متكلي من قبل ميلادي، فأنت إلهي منذ كنت جنينا."], [11, "لا تقف بعيدا عني، لأن الضيق قريب ولا معين لي."], [12, "حاصرني أعداء أقوياء، كأنهم ثيران باشان القوية."], [13, "فغروا علي أشداقهم كأنهم أسود مفترسة مزمجرة."], [14, "صارت قوتي كالماء، وانحلت عظامي. صار قلبي كالشمع، وذاب في داخلي."], [15, "جفت نضارتي كقطعة الفخار، والتصق لساني بحنكي. إلى تراب الأرض تضعني."], [16, "أحاط بي الأدنياء. جماعة من الأشرار طوقتني. ثقبوا يدي ورجلي."], [17, "صرت لهزالي أحصي عظامي، وهم يراقبونني ويحدقون في."], [18, "يتقاسمون ثيابي فيما بينهم، وعلى لباسي يلقون قرعة."], [19, "يارب، لا تتباعد عني. ياقوتي أسرع إلى نجدتي."], [20, "أنقذ من السيف نفسي، ومن مخالب الأدنياء حياتي."], [21, "خلصني من فم الأسد، ومن بين قرون الثيران الوحشية استجب لي."]]}, {"l": "Psa 69:1-21", "n": "", "vs": [[1, "خلصني ياالله ، فإن المياه قد غمرت نفسي."], [2, "غرقت في حمأة ولا مكان فيها أستقر عليه. خضت أعماق المياه. وطما علي السيل."], [3, "تعبت من صراخي. جف حلقي. كلت عيناي وأنا أنتظر إلهي."], [4, "مبغضي من غير علة أكثر عددا من شعر رأسي، وطالبو هلاكي طغاة جائرون. حينئذ رددت مالم أغتصبه."], [5, "ياالله أنت تعرف حماقتي، ومعاصي لم تخف عنك."], [6, "أيها السيد رب الجنود، لا تدعني أكون علة خزي ملتمسيك، ولا مثار خجل طالبيك ياإله إسرائيل."], [7, "لأنني تحملت العار من أجلك، وغطى الخجل وجهي."], [8, "صرت غريبا في عيون إخوتي، وأجنبيا في نظر بني أمي."], [9, "لأن الغيرة على بيتك التهمتني وتعييرات الذين يعيرونك وقعت علي."], [10, "صمت وبكيت فعيروني."], [11, "اتشحت بالمسوح فصرت عندهم مثلا."], [12, "صرت حديث الجالسين في باب المدينة، وأغنية للسكارى."], [13, "أما أنا فإليك صلاتي يارب؛ لأن هذا أوان الرضى، فاستجب لي ياالله برحمتك الغزيرة وبحق خلاصك."], [14, "أنقذني من الوحل فلا أغرق. نجني من مبغضي وانتشلني من أعماق الميا ه."], [15, "لا يطم علي سيل المياه، ولا يبتلعني العمق، ولا تطبق الهوة علي فمها."], [16, "استجب أيها الرب لأن رحمتك صالحة، وبحسب مراحمك الوفيرة التفت إلي."], [17, "لا تحجب وجهك عن عبدك، لأنني في ضيق، فأسرع واستجب لي."], [18, "اقترب إلى نفسي، وفكها. افدني (نكاية) بأعدائي"], [19, "أنت عرفت (ما حل بي من) عار وخزي وهوان. أنت تعرف كل مضايقي."], [20, "كسر العار قلبي فمرضت. التمست عطفا فلم أجد، ومعزين فلم أعثر على أحد."], [21, "وضعوا علقما في طعامي، وفي عطشي يسقونني خلا."]]}, {"l": "Psa 88:1-18", "n": "", "vs": [[1, "يارب إله خلاصي، أمامك أصرخ نهارا وليلا."], [2, "لتأت صلاتي أمامك، أمل أذنك إلى صرختي،"], [3, "فإن نفسي شبعت مصائب، وحياتي تقترب من الموت."], [4, "حسبت في عداد الهابطين إلى قعر هوة الموت، وكرجل لا قوة له."], [5, "تركوني أموت كقتلى الحرب الممددين في القبر، الذين لا تعود تذكرهم وتكف يدك عن إغاثتهم."], [6, "قد طرحتني في الهوة السفلى، في الأماكن المظلمة والعميقة."], [7, "استقر علي غضبك، وبأمواجك الطامية ذللتني."], [8, "أبعدت عني أصحابي، وجعلتني عارا عندهم. قد حبست فلا نجاة لي."], [9, "كلت عيناي من فرط البكاء. إياك يارب دعوت كل يوم باسطا إليك يدي."], [10, "هل تصنع عجائب للأموات، أم تقوم أشباح الموتى فتمجدك؟"], [11, "أفي القبر تعلن رحمتك، وفي الهاوية أمانتك؟"], [12, "هل في الظلام تعرف عجائبك، وفي أرض النسيان يظهر برك؟"], [13, "أما أنا فإليك أصرخ مستغيثا يارب، وفي الصباح تمثل صلاتي أمامك."], [14, "لماذا يارب ترفض نفسي، وتحجب عني وجهك؟"], [15, "إنني مسكين، ومشرف على الموت منذ صباي، وقد قاسيت أهوالك، وذهلت."], [16, "اجتاحني غضبك الشديد وأفنتني أهوالك."], [17, "أحاطت بي طول النهار كالمياه وأطبقت علي كلها."], [18, "فرقت عني الأصدقاء فصار الظلام ملازمي."]]}, {"l": "Isa 52:13", "n": "", "vs": [[13, "ها هو عبدي يفلح، ويتعظم ويتعالى ويتسامى جدا."]]}, {"l": "Isa 52:14", "n": "", "vs": [[14, "وكما دهش منه كثيرون، إذ تشوه منظره أكثر من أي رجل، وصورته أكثر من بني البشر،"]]}, {"l": "Isa 53:1-10", "n": "", "vs": [[1, "من آمن بكلامنا، ولمن ظهرت يد الرب؟"], [2, "نما كبرعم أمامه، وكجذر في أرض يابسة، لا صورة له ولا جمال يسترعيان نظرنا، ولا منظر فنشتهيه."], [3, "محتقر ومنبوذ من الناس، رجل آلام ومختبر الحزن، مخذول كمن حجب الناس عنه وجوههم فلم نأبه له."], [4, "لكنه حمل أحزاننا وتحمل أوجاعنا، ونحن حسبنا أن الرب قد عاقبه وأذله،"], [5, "إلا أنه كان مجروحا من أجل آثامنا ومسحوقا من أجل معاصينا، حل به تأديب سلامنا، وبجراحه برئنا."], [6, "كلنا كغنم شردنا ملنا كل واحد إلى سبيله، فأثقل الرب كاهله بإثم جميعنا."], [7, "ظلم وأذل، ولكنه لم يفتح فاه، بل كشاة سيق إلى الذبح، وكنعجة صامتة أمام جازيها لم يفتح فاه."], [8, "بالضيق والقضاء قبض عليه، وفي جيله من كان يظن أنه استؤصل من أرض الأحياء، وضرب من أجل إثم شعبي؟"], [9, "جعلوا قبره مع الأشرار، ومع ثري عند موته. مع أنه لم يرتكب جورا، ولم يكن في فمه غش."], [10, "ومع ذلك فقد سر الله أن يسحقه بالحزن. وحين يقدم نفسه ذبيحة إثم فإنه يرى نسله وتطول أيامه، وتفلح مسرة الرب على يده."]]}, {"l": "Dan 9:24-26", "n": "", "vs": [[24, "قد صدر القضاء أن يمضي سبعون أسبوعا على شعبك وعلى مدينة قدسك، للانتهاء من المعصية والقضاء على الخطيئة، وللتكفير عن الإثم، ولإشاعة البر الأبدي وختم الرؤيا والنبوءة ولمسح قدوس القدوسين."], [25, "لهذا فاعلم وافهم أن الحقبة الممتدة منذ صدور الأمر بإعادة بناء أورشليم إلى مجيء المسيح، سبعة أسابيع، ثم اثنان وستون أسبوعا يبنى في غضونها سوق وخليج. إنما تكون تلك أزمنة ضيق."], [26, "وبعد اثنين وستين أسبوعا يقتل المسيح، ولكن ليس من أجل نفسه، ويدمر شعب رئيس آت المدينة والقدس، وتقبل آخرتها كطوفان، وتستمر الحرب حتى النهاية، ويعم الخراب المقضي به."]]}, {"l": "Zec 13:7", "n": "", "vs": [[7, "ويقول الرب القدير: «استيقظ أيها السيف وهاجم راعي ورجل رفقتي. اضرب الراعي فتتبدد الخراف. ولكني أرد يدي عن الصغار (أي القلة المؤمنة)."]]}, {"l": "Luk 24:25-27", "n": "", "vs": [[25, "فقال لهما: «ياقليلي الفهم وبطيئي القلب في الإيمان بجميع ما تكلم به الأنبياء!"], [26, "أما كان لابد أن يعاني المسيح هذه الآلام ثم يدخل إلى مجده؟»"], [27, "ثم أخذ يفسر لهما، منطلقا من موسى ومن الأنبياء جميعا، ما ورد عنه في جميع الكتب."]]}, {"l": "Luk 24:44", "n": "", "vs": [[44, "ثم قال لهم: «هذا هو الكلام الذي كلمتكم به وأنا مازلت بينكم: أنه لابد أن يتم كل ما كتب عني في شريعة موسى وكتب الأنبياء والمزامير»."]]}], "kwAr": "آلام", "noteAr": ""}, {"kw": "the glory", "raw": "Gen_3:15, Gen_49:10; Psa_22:22-31, Psa_69:30-36, Psa_110:1-6; Isa_9:6, Isa_9:7, Isa_49:6; Isa_53:11, Isa_53:12; Dan_2:34, Dan_2:35, Dan_2:44, Dan_7:13, Dan_7:14; Zec_8:18-21, Zec_14:9; Joh_12:41; Act_26:22, Act_26:23", "note": "", "refs": [{"l": "Gen 3:15", "n": "", "vs": [[15, "وأثير عداوة دائمة بينك وبين المرأة، وكذلك بين نسليكما. هو يسحق رأسك وأنت تلدغين عقبه»."]]}, {"l": "Gen 49:10", "n": "", "vs": [[10, "لا يزول صولجان الملك من يهوذا ولا مشترع من صلبه حتى يأتي شيلوه (ومعناه: من له الأمر) فتطيعه الشعوب."]]}, {"l": "Psa 22:22-31", "n": "", "vs": [[22, "أعلن اسمك لإخوتي، وأسبحك في وسط الجماعة."], [23, "سبحوا الرب ياخائفيه. مجدوه ياجميع نسل يعقوب، واخشوه ياجميع ذرية إسرائيل."], [24, "فإنه لم يحتقر بؤس المسكين، ولا حجب عنه وجهه، بل استجاب له عندما صرخ إليه."], [25, "أنت تلهمني تسبيحك في وسط الجماعة العظيمة، فأوفي بنذوري أمام جميع خائفيه."], [26, "يأكل الودعاء ويشبعون، وطالبو الرب يسبحونه. تحيا قلوبكم إلى الأبد."], [27, "تتذكر جميع أقاصي الأرض وترجع إلى الرب، وتتعبد أمامك جميع قبائل الأمم."], [28, "لأن الملك للرب، وهو يتسلط على الأمم."], [29, "جميع عظماء الأرض يحتفلون ويسجدون. ينحني أمامه الهابطون إلى التراب والفانون،"], [30, "يتعبد نسلهم لله، ويتحدثون عن الرب للجيل الآتي."], [31, "يأتون ويخبرون ببره وبمعجزاته شعبا لم يولد بعد."]]}, {"l": "Psa 69:30-36", "n": "", "vs": [[30, "أسبح اسم الله بنشيد وأعظمه بحمد."], [31, "فيطيب ذلك لدى الرب أكثر من محرقة: ثور أو عجل."], [32, "يرى الودعاء ذلك فيفرحون. وتحيا نفوسكم ياطالبي الله."], [33, "لأن الرب يستجيب للمحتاجين ولا يحتقر شعبه الأسير."], [34, "تسبحه السماوات والأرض والبحار وكل ما يتحرك فيها."], [35, "لأن الله يخلص صهيون ويبني مدن يهوذا، فيسكن الشعب فيها ويمتلكها."], [36, "ترثها ذرية عبيده، ومحبو اسمه يسكنون فيها."]]}, {"l": "Psa 110:1-6", "n": "", "vs": [[1, "قال الرب لربي: «اجلس عن يميني حتى أضع أعداءك موطئا لقدميك»."], [2, "يجعل الرب صهيون منطلقا لسلطانك، ويقول: «احكم في وسط أعدائك»."], [3, "في يوم محاربة أعدائك يتطوع شعبك. يجيء شبابك إلى التلال المقدسة كالندى في قلب الفجر."], [4, "أقسم الرب ولن يتراجع: «أنت كاهن إلى الأبد على رتبة ملكيصادق»."], [5, "الرب واقف عن يمينك. في يوم غضبه يحطم ملوكا."], [6, "يقضي بين الأمم، فيملأ الأرض الرحبة بجثث رؤسائها."]]}, {"l": "Isa 9:6", "n": "", "vs": [[6, "لأنه يولد لنا ولد ويعطى لنا ابن يحمل الرياسة على كتفه، ويدعى اسمه عجيبا، مشيرا، إلها قديرا، أبا أبديا، رئيس السلام."]]}, {"l": "Isa 9:7", "n": "", "vs": [[7, "ولا تكون نهاية لنمو رياسته وللسلام اللذين يسودان عرش داود ومملكته، ليثبتها ويعضدها بالحق والبر، من الآن وإلى الأبد. إن غيرة الرب القدير تتمم هذا."]]}, {"l": "Isa 49:6", "n": "", "vs": [[6, "لكم هو يسير أن تكون لي عبدا لتستنهض أسباط يعقوب، وترد من نجيت من إسرائيل، لذلك سأجعلك نورا للأمم لتكون خلاصي إلى أقصى الأرض."]]}, {"l": "Isa 53:11", "n": "", "vs": [[11, "ويرى ثمار تعب نفسه ويشبع، وعبدي البار يبرر بمعرفته كثيرين ويحمل آثامهم."]]}, {"l": "Isa 53:12", "n": "", "vs": [[12, "لذلك أهبه نصيبا بين العظماء، فيقسم غنيمة مع الأعزاء، لأنه سكب للموت نفسه، وأحصي مع أثمة. وهو حمل خطيئة كثيرين، وشفع في المذنبين."]]}, {"l": "Dan 2:34", "n": "", "vs": [[34, "وبينما أنت في الرؤيا انقض حجر لم يقطع بيد إنسان، وضرب التمثال على قدميه المصنوعتين من خليط الحديد والخزف فسحقهما،"]]}, {"l": "Dan 2:35", "n": "", "vs": [[35, "فتحطم الحديد والخزف والنحاس والفضة والذهب معا، وانسحقت وصارت كعصافة البيدر في الصيف، فحملتها الريح حتى لم يبق لها أثر. أما الحجر الذي ضرب التمثال فتحول إلى جبل كبير وملأ الأرض كلها."]]}, {"l": "Dan 2:44", "n": "", "vs": [[44, "وفي عهد هؤلاء الملوك يقيم إله السماوات مملكة لا تنقرض إلى الأبد، ولا يترك ملكها لشعب آخر، وتسحق وتبيد جميع هذه الممالك. أما هي فتخلد إلى الأبد."]]}, {"l": "Dan 7:13", "n": "", "vs": [[13, "وشاهدت أيضا في رؤى الليل وإذا بمثل ابن الإنسان مقبلا على سحاب حتى بلغ الأزلي فقربوه منه."]]}, {"l": "Dan 7:14", "n": "", "vs": [[14, "فأنعم عليه بسلطان ومجد وملكوت لتتعبد له كل الشعوب والأمم من كل لسان. سلطانه سلطان أبدي لا يفنى، وملكه لا ينقرض."]]}, {"l": "Zec 8:18-21", "n": "", "vs": [[18, "ثم أوحى الرب إلي بكلمته قائلا:"], [19, "«هذا ما يقوله الرب القدير: إن أصوامكم في الشهور الرابع والخامس والسابع والعاشر ستكون مواسم ابتهاج وفرح وأعياد سعيدة يتمتع بها شعب يهوذا، لهذا أحبوا الحق والسلام."], [20, "وستأتي شعوب أيضا وأفواج من سكان مدن كثيرة إلى أورشليم."], [21, "ويمضي أهل المدينة الواحدة إلى المدينة الأخرى قائلين: هيا نذهب على الفور لنطلب رضى وجه الرب القدير ونلتمس بركته، لأننا على أي حال منطلقون إلى هناك."]]}, {"l": "Zec 14:9", "n": "", "vs": [[9, "ويملك الرب على الأرض كلها، فيكون في ذلك اليوم رب واحد لا يذكر سوى اسمه."]]}, {"l": "Joh 12:41", "n": "", "vs": [[41, "وقد قال إشعياء هذا عندما رأى مجد الرب فتحدث عنه."]]}, {"l": "Act 26:22", "n": "", "vs": [[22, "ولكن الله حفظني حتى هذا اليوم، وبمعونته أقف أمام البسطاء والعظماء شاهدا له ولست أحيد عما تنبأ به موسى والأنبياء،"]]}, {"l": "Act 26:23", "n": "", "vs": [[23, "من أن المسيح سيتألم فيكون أول من يقوم من بين الأموات، ويبشر بالنور شعبنا والشعوب الأخرى»."]]}], "kwAr": "أمجاد", "noteAr": ""}], "arS": [["واجتهدوا", ["G2045"]], [" لمعرفة ", []], ["الزمان", ["G2540"]], [" والأحوال التي كان ", []], ["يشير", ["G1213"]], [" إليها ", []], ["روح", ["G4151"]], [" ", []], ["المسيح", ["G5547"]], [" الذي كان عاملا فيهم، عندما ", []], ["شهد لهم مسبقا", ["G4303"]], [" بما ينتظر ", []], ["المسيح", ["G5547"]], [" من ", []], ["آلام", ["G3804"]], ["، وبما يأتي بعدها من ", []], ["أمجاد", ["G1391"]], [".", []]]}, {"c": 1, "v": 12, "text": "ولكن الله أوحى إليهم أن اجتهادهم لم يكن لمصلحتهم هم، بل لمصلحتكم أنتم. فقد كان ذلك من أجل البشارة التي نقلها إليكم في الزمان الحاضر مبشرون يؤيدهم الروح القدس المرسل من السماء. ويالها من أمور يتمنى حتى الملائكة أن يطلعوا عليها!", "groups": [{"kw": "it", "raw": "Isa_53:1; Dan_2:19, Dan_2:22, Dan_2:28, Dan_2:29, Dan_2:47, Dan_10:1; Amo_3:7; Mat_11:25, Mat_11:27, Mat_16:17; Luk_2:26; Rom_1:17; 1Co_2:10; Gal_1:12, Gal_1:16", "note": "", "refs": [{"l": "Isa 53:1", "n": "", "vs": [[1, "من آمن بكلامنا، ولمن ظهرت يد الرب؟"]]}, {"l": "Dan 2:19", "n": "", "vs": [[19, "عندئذ انكشف السر لدانيآل في رؤيا الليل، فبارك إله السماوات،"]]}, {"l": "Dan 2:22", "n": "", "vs": [[22, "يكشف الأعماق والخفايا ويعلم ما في باطن الظلمة، ولديه يسكن النور."]]}, {"l": "Dan 2:28", "n": "", "vs": [[28, "ولكن هناك إله في السماء يعلن الخفايا. وقد عرف الملك نبوخذناصر عما سيحدث في آخر الأيام. أما حلمك والرؤيا التي شهدتها في منامك فهي هذه:"]]}, {"l": "Dan 2:29", "n": "", "vs": [[29, "أيها الملك، فيما أنت مستلق على مضجعك انتابتك الأفكار عما يحدث في الأيام المقبلة، والذي يكشف الخفايا عرفك بما سيكون."]]}, {"l": "Dan 2:47", "n": "", "vs": [[47, "وقال الملك لدانيآل: «حقا إن إلهكم هو إله الآلهة ورب الملوك وكاشف الأسرار، لأنك استطعت إعلان هذا السر»."]]}, {"l": "Dan 10:1", "n": "", "vs": [[1, "وفي السنة الثالثة لحكم كورش ملك فارس، أعلن وحي لدانيآل المدعو بلطشاصر، والوحي دائما حق. وبعد مكابدة مجهدة، أدرك فحوى الوحي وفهم معنى الرؤيا."]]}, {"l": "Amo 3:7", "n": "", "vs": [[7, "إن السيد الرب لا يجري أمرا من غير أن يعلن سره لعبيده الأنبياء."]]}, {"l": "Mat 11:25", "n": "", "vs": [[25, "وفي ذلك الوقت، تكلم يسوع فقال: «أحمدك أيها الآب، رب السماء والأرض، لأنك حجبت هذه الأمور عن الحكماء والفهماء، وكشفتها للأطفال!"]]}, {"l": "Mat 11:27", "n": "", "vs": [[27, "كل شيء قد سلمه إلي أبي. ولا أحد يعرف الابن إلا الآب، ولا أحد يعرف الآب إلا الابن، ومن أراد الابن أن يعلنه له."]]}, {"l": "Mat 16:17", "n": "", "vs": [[17, "فقال له يسوع: «طوبى لك ياسمعان بن يونا. فما أعلن لك هذا لحم ودم، بل أبي الذي في السماوات."]]}, {"l": "Luk 2:26", "n": "", "vs": [[26, "وكان الروح القدس قد أوحى إليه أنه لا يرى الموت قبل أن يرى مسيح الرب،"]]}, {"l": "Rom 1:17", "n": "", "vs": [[17, "ففيه قد أعلن البر الذي يمنحه الله على أساس الإيمان والذي يؤدي إلى الإيمان، على حد ما قد كتب: «أما من تبرر بالإيمان، فبالإيمان يحيا»."]]}, {"l": "1Co 2:10", "n": "", "vs": [[10, "ولكن الله كشف لنا ذلك بالروح. فإن الروح يتقصى كل شيء، حتى أعماق الله."]]}, {"l": "Gal 1:12", "n": "", "vs": [[12, "فلا أنا تسلمته من إنسان، ولا تلقنته، بل جاءني بإعلان من يسوع المسيح."]]}, {"l": "Gal 1:16", "n": "", "vs": [[16, "أن يعلن ابنه في لأبشر به بين الأمم، في الحال لم أستشر لحما ودما،"]]}], "kwAr": "أوحى إليهم", "noteAr": ""}, {"kw": "that not", "raw": "Dan_9:24, Dan_12:9, Dan_12:13; Heb_11:13, Heb_11:39, Heb_11:40", "note": "", "refs": [{"l": "Dan 9:24", "n": "", "vs": [[24, "قد صدر القضاء أن يمضي سبعون أسبوعا على شعبك وعلى مدينة قدسك، للانتهاء من المعصية والقضاء على الخطيئة، وللتكفير عن الإثم، ولإشاعة البر الأبدي وختم الرؤيا والنبوءة ولمسح قدوس القدوسين."]]}, {"l": "Dan 12:9", "n": "", "vs": [[9, "فأجاب: «اذهب يادانيآل لأن الكلمات مكتومة ومختومة إلى وقت النهاية."]]}, {"l": "Dan 12:13", "n": "", "vs": [[13, "وأما أنت فاذهب إلى آخرتك فتستريح، ثم تقوم في نهاية الأيام لتثاب بما قسم لك»."]]}, {"l": "Heb 11:13", "n": "", "vs": [[13, "هؤلاء جميعا، حافظوا على إيمانهم إلى النهاية. وماتوا قبل أن تتحقق وعود الله لهم في أثناء حياتهم. ولكنهم رأوها من بعيد، وتوقعوا تحقيقها كاملة في المستقبل. وإذ آمنوا بتلك الوعود الإلهية اعترفوا بأنهم ليسوا إلا غرباء على الأرض يزورونها زيارة عابرة."]]}, {"l": "Heb 11:39", "n": "", "vs": [[39, "إن هؤلاء لم يحصلوا جميعا على تحقيق كل ما وعدهم الله به، مع أنهم حاصلون على شهادة حسنة من جهة الإيمان."]]}, {"l": "Heb 11:40", "n": "", "vs": [[40, "ولكن الله سبق فأعد لنا ما هو أفضل، وذلك حتى لا يكملوا بمعزل عنا."]]}], "kwAr": "لم يكن لمصلحتهم هم", "noteAr": ""}, {"kw": "that have", "raw": "Mar_16:15; Luk_9:6; Act_8:25, Act_16:10; Rom_1:15, Rom_10:15, Rom_15:19; 1Th_2:9; Heb_4:2", "note": "", "refs": [{"l": "Mar 16:15", "n": "", "vs": [[15, "وقال لهم: «اذهبوا إلى العالم أجمع، وبشروا الخليقة كلها بالإنجيل:"]]}, {"l": "Luk 9:6", "n": "", "vs": [[6, "فانطلقوا يجتازون في القرى وهم يبشرون ويشفون في كل مكان."]]}, {"l": "Act 8:25", "n": "", "vs": [[25, "وبعدما شهد بطرس ويوحنا بكلمة الرب وأعلناها هناك، رجعا إلى أورشليم وقد بشرا قرى كثيرة في منطقة السامرة."]]}, {"l": "Act 16:10", "n": "", "vs": [[10, "عندئذ تأكدنا أن الرب دعانا للتبشير في مقدونية. فاتجهنا إليها في الحال."]]}, {"l": "Rom 1:15", "n": "", "vs": [[15, "ولذلك، فبكل ما لدي، أنا في غاية الشوق أن أبشر بالإنجيل أيضا بينكم أنتم الذين في روما."]]}, {"l": "Rom 10:15", "n": "", "vs": [[15, "وكيف يبشر أحد إلا إذا كان قد أرسل؟ كما قد كتب: «ما أجمل أقدام المبشرين بالخيرات!»"]]}, {"l": "Rom 15:19", "n": "", "vs": [[19, "وبقوة الآيات والعجائب، وبقوة روح الله. حتى إنني، من أورشليم وما حولها حتى مقاطعة إليريكون، قد أكملت التبشير بإنجيل المسيح."]]}, {"l": "1Th 2:9", "n": "", "vs": [[9, "فأنتم تذكرون، أيها الإخوة، جهدنا وكدنا، إذ بشرناكم بإنجيل الله ونحن نشتغل ليلا ونهارا لكي لا نكون عبئا ثقيلا على أحد منكم."]]}, {"l": "Heb 4:2", "n": "", "vs": [[2, "ذلك أن البشارة بالوعد قد وصلت إلينا، نحن أيضا، كما كانت قد وصلت إلى ذلك الشعب. ولكن البشارة لم تنفع سامعيها شيئا، لأنهم قابلوها بالرفض فلم يؤمنوا بها."]]}], "kwAr": "مبشرون", "noteAr": ""}, {"kw": "with", "raw": "Joh_15:26, Joh_16:7-15; Act_2:4, Act_2:33, Act_4:8, Act_4:31, Act_10:44; 2Co_1:22, 2Co_6:6; 1Th_1:5, 1Th_1:6; Heb_2:4", "note": "", "refs": [{"l": "Joh 15:26", "n": "", "vs": [[26, "وعندما يأتي المعين، الذي سأرسله لكم من عند الآب، روح الحق الذي ينبثق من الآب، فهو يشهد لي،"]]}, {"l": "Joh 16:7-15", "n": "", "vs": [[7, "ولكني أقول لكم الحق: من الأفضل لكم أن أذهب، لأني إن كنت لا أذهب، لا يأتيكم المعين. ولكني إذا ذهبت أرسله إليكم."], [8, "وعندما يجيء يبكت العالم على الخطيئة وعلى البر وعلى الدينونة:"], [9, "أما على الخطيئة، فلأنهم لا يؤمنون بي،"], [10, "وأما على البر، فلأني عائد إلى الآب فلا ترونني بعد؛"], [11, "وأما على الدينونة، فلأن سيد هذا العالم قد صدر عليه حكم الدينونة."], [12, "مازال عندي أمور كثيرة أقولها لكم، ولكنكم الآن تعجزون عن احتمالها."], [13, "ولكن، عندما يأتيكم روح الحق يرشدكم إلى الحق كله، لأنه لا يقول شيئا من عنده، بل يخبركم بما يسمعه، ويطلعكم على ما سوف يحدث."], [14, "وهو سيمجدني لأن كل ما سيحدثكم به صادر عني."], [15, "كل ما هو للآب، فهو لي. ولذلك قلت لكم إن ما سيحدثكم به صادر عني."]]}, {"l": "Act 2:4", "n": "", "vs": [[4, "فامتلأوا جميعا من الروح القدس، وأخذوا يتكلمون بلغات أخرى، مثلما منحهم الروح أن ينطقوا."]]}, {"l": "Act 2:33", "n": "", "vs": [[33, "وإذ رفع إلى يمين الله، وأخذ من الآب الروح القدس الموعود به، أفاضه علينا. وما ترونه الآن وتسمعونه هو نتيجة لذلك."]]}, {"l": "Act 4:8", "n": "", "vs": [[8, "فامتلأ بطرس من الروح القدس وأجابهم: «يارؤساء الشعب وياشيوخه،"]]}, {"l": "Act 4:31", "n": "", "vs": [[31, "وفيما هم يصلون ارتج المكان الذي كانوا مجتمعين فيه، وامتلأوا جميعا بالروح القدس، فأخذوا يعلنون كلمة الله بكل جرأة!"]]}, {"l": "Act 10:44", "n": "", "vs": [[44, "وبينما كان بطرس يتكلم بهذا الكلام، حل الروح القدس على جميع الذين كانوا يسمعون."]]}, {"l": "2Co 1:22", "n": "", "vs": [[22, "وهو أيضا قد وضع ختمه علينا، ووهبنا الروح القدس عربونا في قلوبنا."]]}, {"l": "2Co 6:6", "n": "", "vs": [[6, "في الطهارة والمعرفة وطول البال واللطف؛ في الروح القدس والمحبة الخالصة من الرياء؛"]]}, {"l": "1Th 1:5", "n": "", "vs": [[5, "لأن تبشيرنا لكم بالإنجيل لم يكن مجرد كلام، بل كان مصحوبا أيضا بالقوة وبالروح القدس وبتمام اليقين. كما أنكم تعلمون تماما ماذا كنا بينكم لأجل مصلحتكم،"]]}, {"l": "1Th 1:6", "n": "", "vs": [[6, "وقد صرتم مقتدين بنا وبالرب، إذ تقبلتم كلمة الله في وسط ضيقة شديدة بفرح الروح القدس."]]}, {"l": "Heb 2:4", "n": "", "vs": [[4, "وقد أيد الله شهادتهم بعلامات وعجائب ومعجزات مختلفة، وبالمواهب التي وزعها الروح القدس وفقا لإرادته!"]]}], "kwAr": "يؤيدهم الروح القدس", "noteAr": ""}, {"kw": "sent", "raw": "Pro_1:23; Isa_11:2-6, Isa_32:15, Isa_44:3-5; Joe_2:28; Zec_12:10; Joh_15:26; Act_2:17, Act_2:18", "note": "", "refs": [{"l": "Pro 1:23", "n": "", "vs": [[23, "إن رجعتم عند توبيخي وتبتم، أسكب عليكم روحي وأعلمكم كلماتي."]]}, {"l": "Isa 11:2-6", "n": "", "vs": [[2, "ويستقر عليه روح الرب، روح الحكمة والفطنة، روح المشورة والقوة، روح معرفة الرب ومخافته."], [3, "وتكون مسرته في تقوى الرب، ولا يقضي بحسب ما تشهد عيناه، ولا يحكم بمقتضى ما تسمع أذناه،"], [4, "إنما يقضي بعدل للمساكين، ويحكم بالإنصاف لبائسي الأرض، ويعاقب الأرض بقضيب فمه، ويميت المنافق بنفخة شفتيه،"], [5, "لأنه سيرتدي البر ويتمنطق بالأمانة."], [6, "فيسكن الذئب مع الحمل، ويربض النمر إلى جوار الجدي، ويتآلف العجل والأسد وكل حيوان معلوف معا، ويسوقها جميعا صبي صغير."]]}, {"l": "Isa 32:15", "n": "", "vs": [[15, "حتى تنسكب علينا روح من السماء، فتتحول البرية إلى مرج مخصب، ويحسب المرج غابة."]]}, {"l": "Isa 44:3-5", "n": "", "vs": [[3, "لأني سأسكب ماء على الأرض الظمأى، وأجري السيول على التربة اليابسة، وأفيض بروحي على ذريتك، وبركاتي على نسلك."], [4, "فينبتون بين العشب مزهرين كالصفصاف عند مجاري المياه."], [5, "ويقولون بملء أفواههم: «أنا عبد الرب. أنا ابن يعقوب». ويكتب على يده اسم الله، وباسم إسرائيل يلقب."]]}, {"l": "Joe 2:28", "n": "", "vs": [[28, "ثم أسكب روحي على كل بشر، فيتنبأ أبناؤكم وبناتكم، ويحلم شيوخكم أحلاما ويرى شبابكم رؤى."]]}, {"l": "Zec 12:10", "n": "", "vs": [[10, "وأفيض على ذرية داود وعلى سكان أورشليم روح النعمة والابتهال، حتى إذا نظروا إلي أنا الذي طعنوه ينوحون عليه كما ينوح والد على ولده الوحيد، متفجعين عليه كتفجعهم على موت بكرهم."]]}, {"l": "Joh 15:26", "n": "", "vs": [[26, "وعندما يأتي المعين، الذي سأرسله لكم من عند الآب، روح الحق الذي ينبثق من الآب، فهو يشهد لي،"]]}, {"l": "Act 2:17", "n": "", "vs": [[17, "يقول الله : في الأيام الأخيرة سأسكب روحي على جميع البشر، فيتنبأ بنوكم وبناتكم، ويرى شبابكم رؤى، ويحلم شيوخكم أحلاما."]]}, {"l": "Act 2:18", "n": "", "vs": [[18, "في تلك الأيام أفيض من روحي على عبيدي كلهم، رجالا ونساء، فيتنبأون."]]}], "kwAr": "المرسل من السماء", "noteAr": ""}, {"kw": "which things", "raw": "Exo_25:20; Dan_8:13, Dan_12:5, Dan_12:6; Luk_15:10; Eph_3:10; Rev_5:11", "note": "", "refs": [{"l": "Exo 25:20", "n": "", "vs": [[20, "ويكون الكروبان متواجهين أيضا، باسطين أجنحتهما إلى فوق، يظللان بهما الغطاء، ويتجهان بوجهيهما نحوه."]]}, {"l": "Dan 8:13", "n": "", "vs": [[13, "فسمعت قدوسا يتكلم، فيرد عليه قدوس آخر: «كم يطول زمن الرؤيا بشأن المحرقة الدائمة اليومية، ومعصية الخراب، وتسليم الهيكل والجند ليكونوا مدوسين؟»"]]}, {"l": "Dan 12:5", "n": "", "vs": [[5, "ثم رأيت أنا دانيآل فإذا باثنين آخرين وقف كل منهما على ضفة من ضفتي النهر،"]]}, {"l": "Dan 12:6", "n": "", "vs": [[6, "سأل أحدهما الرجل اللابس الكتان الواقف على مياه النهر: «متى ينقضي زمن هذه الأحداث العجيبة؟»."]]}, {"l": "Luk 15:10", "n": "", "vs": [[10, "أقول لكم: هكذا يكون بين ملائكة الله فرح بخاطيء واحد يتوب»."]]}, {"l": "Eph 3:10", "n": "", "vs": [[10, "والغاية أن يتجلى الآن أمام الرئاسات والسلطات في الأماكن السماوية ما يظهر في الكنيسة من حكمة الله المتعددة الوجوه،"]]}, {"l": "Rev 5:11", "n": "", "vs": [[11, "ثم نظرت، فسمعت ترتيل الملايين من الملائكة وهي تحيط بالعرش وبالكائنات الحية والشيوخ،"]]}], "kwAr": "يتمنى حتى الملائكة أن يطلعوا عليها", "noteAr": ""}], "arS": [["ولكن الله ", []], ["أوحى", ["G601"]], [" إليهم أن اجتهادهم لم يكن ", []], ["لمصلحتهم", ["G1438"]], [" هم، بل ", []], ["لمصلحتكم", ["G5213"]], [" أنتم. فقد كان ذلك من أجل البشارة التي ", []], ["نقلها", ["G312"]], [" إليكم في الزمان ", []], ["الحاضر", ["G3568"]], [" ", []], ["مبشرون", ["G2097"]], [" يؤيدهم ", []], ["الروح", ["G4151"]], [" ", []], ["القدس", ["G40"]], [" ", []], ["المرسل", ["G649"]], [" من ", []], ["السماء", ["G3772"]], [". ويالها من أمور ", []], ["يتمنى", ["G1937"]], [" حتى ", []], ["الملائكة", ["G32"]], [" أن ", []], ["يطلعوا", ["G3879"]], [" عليها!", []]]}, {"c": 1, "v": 13, "text": "لذلك اجعلوا أذهانكم متنبهة دائما، وتيقظوا، وعلقوا رجاءكم كله على النعمة التي ستكون من نصيبكم عندما يعود يسوع المسيح ظاهرا بمجده!", "groups": [{"kw": "gird", "raw": "Exo_12:11; 1Ki_18:46; 2Ki_4:29; Job_38:3, Job_40:7; Isa_11:5; Jer_1:17; Luk_12:35, Luk_17:8; Eph_6:14", "note": "", "refs": [{"l": "Exo 12:11", "n": "", "vs": [[11, "تأكلونه بعجلة وأحقاؤكم مشدودة، وأحذيتكم في أرجلكم، وعصيكم في أيديكم. فيكون هذا فصحا للرب."]]}, {"l": "1Ki 18:46", "n": "", "vs": [[46, "وحلت قوة الرب في إيليا، فلف عباءته حول حقويه وركض ليسبق أخآب إلى مدخل يزرعيل."]]}, {"l": "2Ki 4:29", "n": "", "vs": [[29, "فأمر أليشع جيحزي: «تمنطق بحزامك، وخذ عكازي وانطلق. وإذا صادفت أحدا فلا تحيه، وإن حياك أحد فلا تجبه. وضع عكازي على وجه الصبي»."]]}, {"l": "Job 38:3", "n": "", "vs": [[3, "اشدد حقويك كرجل لأسألك فتجيبني"]]}, {"l": "Job 40:7", "n": "", "vs": [[7, "«اشدد حقويك وكن رجلا، فأسألك وتجيبني."]]}, {"l": "Isa 11:5", "n": "", "vs": [[5, "لأنه سيرتدي البر ويتمنطق بالأمانة."]]}, {"l": "Jer 1:17", "n": "", "vs": [[17, "أما أنت فتأهب، وقم وكلمهم بكل ما آمرك به. لا تخف من حضرتهم لئلا أفزعك أمامهم."]]}, {"l": "Luk 12:35", "n": "", "vs": [[35, "لتكن أوساطكم مشدودة بالأحزمة ومصابيحكم مضاءة،"]]}, {"l": "Luk 17:8", "n": "", "vs": [[8, "ألا يقول له بالأحرى: أحضر لي ما أتعشى به، وشد وسطك بالحزام واخدمني حتى آكل وأشرب وبعد ذلك تأكل وتشرب أنت؟"]]}, {"l": "Eph 6:14", "n": "", "vs": [[14, "فاصمدوا إذن بعد أن تتخذوا الحق حزاما لأوساطكم، والبر درعا لصدوركم،"]]}], "kwAr": "اجعلوا أذهانكم متنبهة", "noteAr": ""}, {"kw": "be sober", "raw": "1Pe_4:7, 1Pe_5:8; Luk_21:34, Luk_21:35; Rom_13:13; 1Th_5:6, 1Th_5:7", "note": "", "refs": [{"l": "1Pe 4:7", "n": "", "vs": [[7, "إن نهاية كل شيء قد صارت قريبة. فتعقلوا إذن، وكونوا متنبهين لرفع الصلاة دائما."]]}, {"l": "1Pe 5:8", "n": "", "vs": [[8, "تعقلوا وتنبهوا. إن خصمكم إبليس كأسد يزأر، يجول باحثا عن فريسة يبتلعها."]]}, {"l": "Luk 21:34", "n": "", "vs": [[34, "ولكن احذروا لأنفسكم لئلا تتثقل قلوبكم بالانغماس في اللذات وبالسكر وهموم الحياة، فيدهمكم ذلك اليوم فجأة؛"]]}, {"l": "Luk 21:35", "n": "", "vs": [[35, "فإنه سوف يطبق كالفخ على جميع الساكنين على وجه الأرض كلها."]]}, {"l": "Rom 13:13", "n": "", "vs": [[13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."]]}, {"l": "1Th 5:6", "n": "", "vs": [[6, "إذن، لا ننم كما ينام الآخرون، بل لنظل ساهرين وصاحين،"]]}, {"l": "1Th 5:7", "n": "", "vs": [[7, "فإنه في الليل ينام الذين ينامون، وفي الليل يسكر الذين يسكرون"]]}], "kwAr": "تيقظوا", "noteAr": ""}, {"kw": "hope", "raw": "1Pe_1:3-5, 1Pe_3:15; Rom_15:4-13; 1Co_13:13; 1Th_5:8; Heb_3:6, Heb_6:19; 1Jo_3:3", "note": "", "refs": [{"l": "1Pe 1:3-5", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"], [4, "وإرثا لا يفنى ولا يفسد ولا يزول،"], [5, "محفوظا لكم في السماوات. فإنكم محفوظون بقدرة الله العاملة من خلال إيمانكم، إلى أن تفوزوا بالخلاص النهائي المعد لكم والذي سوف يتجلى في الزمان الأخير."]]}, {"l": "1Pe 3:15", "n": "", "vs": [[15, "وإنما كرسوا المسيح ربا في قلوبكم. وكونوا دائما مستعدين لأن تقدموا جوابا مقنعا لكل من يسألكم عن سبب الرجاء الذي في داخلكم"]]}, {"l": "Rom 15:4-13", "n": "", "vs": [[4, "فإن كل ما سبق أن كتب فإنما كتب لتعليمنا، حتى يكون لنا رجاء بما في الكتاب من الصبر والعزاء."], [5, "وليعطكم إله الصبر والتعزية أن تكونوا متوافقين بعضكم مع بعض بحسب المسيح يسوع،"], [6, "لكي تمجدوا الله أبا ربنا يسوع المسيح بنفس واحدة وفم واحد."], [7, "لذلك اقبلوا بعضكم بعضا، كما أن المسيح أيضا قبلنا لمجد الله."], [8, "فإني أقول إن المسيح صار خادم أهل الختان إظهارا لصدق الله وتوطيدا لوعوده للآباء،"], [9, "وإن الأمم يمجدون الله على الرحمة، وفقا لما قد كتب: «لهذا أعترف لك بين الأمم وأرتل لاسمك!»"], [10, "وأيضا قيل: «افرحوا، أيها الأمم، مع شعبه»."], [11, "وأيضا: «سبحوا الرب ياجميع الأمم، ولتحمده جميع الشعوب»."], [12, "ويقول إشعياء أيضا: «سيطلع أصل يسى، والقائم، ليسود على الأمم: عليه تعلق الشعوب الرجاء»."], [13, "فليملأكم إله الرجاء كل فرح وسلام في إيمانكم حتى تزدادوا رجاء بقوة الروح القدس."]]}, {"l": "1Co 13:13", "n": "", "vs": [[13, "أما الآن، فهذه الثلاثة باقية: الإيمان، والرجاء، والمحبة. ولكن أعظمها هي المحبة!"]]}, {"l": "1Th 5:8", "n": "", "vs": [[8, "وأما نحن، أهل النهار، فلنظل صاحين، متخذين من الإيمان والمحبة درعا لصدورنا، ومن الرجاء بالخلاص خوذة لرؤوسنا."]]}, {"l": "Heb 3:6", "n": "", "vs": [[6, "أما المسيح، فهو أمين بصفته ابنا يترَأس على البيت. وهذا البيت هو نحن المؤمنين، على أن نتمسك بالثقة والافتخار برجائنا تمسكا ثابتا حتى النهاية."]]}, {"l": "Heb 6:19", "n": "", "vs": [[19, "هذا الرجاء هو لنا بمثابة مرساة أمينة ثابتة تشد نفوسنا إلى ما وراء الحجاب السماوي."]]}, {"l": "1Jo 3:3", "n": "", "vs": [[3, "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر."]]}], "kwAr": "علقوا رجاءكم", "noteAr": ""}, {"kw": "to the end", "raw": "Gr. perfectly", "note": "Gr. perfectly", "refs": [], "kwAr": "كله", "noteAr": "في اليونانية: بالتمام."}, {"kw": "the grace", "raw": "1Pe_1:4-9; Luk_17:30; 1Co_1:7; 2Th_1:7; 2Ti_4:8; Tit_2:11-13; Heb_9:28; Heb_10:35", "note": "", "refs": [{"l": "1Pe 1:4-9", "n": "", "vs": [[4, "وإرثا لا يفنى ولا يفسد ولا يزول،"], [5, "محفوظا لكم في السماوات. فإنكم محفوظون بقدرة الله العاملة من خلال إيمانكم، إلى أن تفوزوا بالخلاص النهائي المعد لكم والذي سوف يتجلى في الزمان الأخير."], [6, "وهذا يدعوكم إلى الابتهاج، مع أنه لابد لكم الآن من الحزن فترة قصيرة تحت وطأة التجارب المتنوعة!"], [7, "إلا أن غاية هذه التجارب هي اختبار حقيقة إيمانكم. فكما تختبر النار الذهب وتنقيه، تختبر التجارب حقيقة إيمانكم، وهو أثمن جدا من الذهب الفاني. وهكذا، يكون إيمانكم مدعاة مدح وإكرام وتمجيد لكم، عندما يعود يسوع المسيح ظاهرا بمجده."], [8, "أنتم لم تروا المسيح، ولكنكم تحبونه. ومع أنكم لا ترونه الآن، فأنتم تؤمنون به وتبتهجون بفرح مجيد يفوق الوصف."], [9, "إذ بلغتم هدف إيمانكم، وهو خلاص نفوسكم."]]}, {"l": "Luk 17:30", "n": "", "vs": [[30, "هكذا سيحدث في يوم ظهور ابن الإنسان."]]}, {"l": "1Co 1:7", "n": "", "vs": [[7, "حتى إنكم لا تحتاجون بعد إلى أية موهبة فيما تتوقعون ظهور ربنا يسوع المسيح علنا."]]}, {"l": "2Th 1:7", "n": "", "vs": [[7, "وأن يكافئكم، أنتم الذين تتضايقون، كما يكافئنا نحن، بالراحة لدى ظهور الرب يسوع علنا من السماء، ومعه ملائكة قدرته،"]]}, {"l": "2Ti 4:8", "n": "", "vs": [[8, "إنما ينتظرني الآن إكليل البر المحفوظ لي، والذي سيهبه لي الرب الديان العادل في ذلك اليوم؛ ولن يوهب لي وحدي، بل أيضا لجميع الذين يحبون ظهوره."]]}, {"l": "Tit 2:11-13", "n": "", "vs": [[11, "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت."], [12, "وهي تعلمنا أن نقطع علاقتنا بالإباحية والشهوات العالمية، وأن نحيا في العصر الحاضر حياة التعقل والبر والتقوى،"], [13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "Heb 9:28", "n": "", "vs": [[28, "كذلك المسيح أيضا: مات مرة واحدة حاملا خطايا كثيرين، مقربا نفسه (لله) عوضا عنهم. ولا بد أن يعود إلى الظهور. لا ليعالج الخطايا، بل ليحقق الخلاص النهائي لجميع منتظريه!"]]}, {"l": "Heb 10:35", "n": "", "vs": [[35, "إذن، لا تتخلوا عن ثقتكم بالرب. فإن لها مكافأة عظيمة."]]}], "kwAr": "النعمة التي ستكون من نصيبكم", "noteAr": ""}], "arS": [["لذلك", ["G1352"]], [" اجعلوا ", []], ["أذهانكم", ["G1271"]], [" متنبهة دائما، ", []], ["وتيقظوا", ["G3525"]], ["، ", []], ["وعلقوا رجاءكم", ["G1679"]], [" ", []], ["كله", ["G5049"]], [" على ", []], ["النعمة", ["G5485"]], [" التي ستكون من نصيبكم عندما يعود ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [" ", []], ["ظاهرا", ["G602"]], [" بمجده!", []]]}, {"c": 1, "v": 14, "text": "وبما أنكم صرتم أولادا لله مطيعين له، فلا تعودوا إلى مجاراة الشهوات التي كانت تسيطر عليكم سابقا في أيام جهلكم.", "groups": [{"kw": "obedient", "raw": "Eph_2:2, Eph_5:6 *Gr.", "note": "", "refs": [{"l": "Eph 2:2", "n": "", "vs": [[2, "التي كنتم تسلكون فيها حسب مسرى هذا العالم، تابعين رئيس قوات الهواء، ذلك الروح العامل الآن في أبناء العصيان،"]]}, {"l": "Eph 5:6", "n": "*Gr.", "vs": [[6, "لا يخدعكم أحد بكلام باطل! فبسبب هذه الأمور يحل غضب الله على أبناء العصيان."]]}], "kwAr": "مطيعين له", "noteAr": ""}, {"kw": "not", "raw": "1Pe_4:2, 1Pe_4:3; Rom_6:4, Rom_12:2; Eph_4:18-22; Col_3:5-7", "note": "", "refs": [{"l": "1Pe 4:2", "n": "", "vs": [[2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."]]}, {"l": "1Pe 4:3", "n": "", "vs": [[3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}, {"l": "Rom 6:4", "n": "", "vs": [[4, "وبسبب ذلك دفنا معه بالمعمودية للموت، حتى كما أقيم المسيح من الأموات بمجد الآب، كذلك نسلك نحن أيضا في حياة جديدة."]]}, {"l": "Rom 12:2", "n": "", "vs": [[2, "ولا تتكيفوا مع هذا العالم، بل تغيروا بتجديد الذهن، لتميزوا ما هي إرادة الله الصالحة المقبولة الكاملة."]]}, {"l": "Eph 4:18-22", "n": "", "vs": [[18, "لكونهم مظلمي البصيرة ومتغربين عن حياة الله بسبب ما فيهم من جهل وقساوة قلب."], [19, "فهؤلاء، إذ طرحوا جانبا كل إحساس، استسلموا للإباحية ليرتكبوا كل نجاسة بشهوة نهمة لا ترتوي."], [20, "أما أنتم، فلم تتعلموا المسيح هكذا،"], [21, "إذا كنتم قد سمعتموه حقا وتلقيتم فيه التعليم الموافق للحق الذي في يسوع!"], [22, "وهو أن تخلعوا ما يتعلق بسيرتكم الماضية: الإنسان العتيق الذي يفسد نفسه بالشهوات الخداعة؛"]]}, {"l": "Col 3:5-7", "n": "", "vs": [[5, "فأميتوا إذن أعضاءكم الأرضية: الزنى، النجاسة، جموح العاطفة، الشهوة الرديئة، والاشتهاء النهم الذي هو عبادة أصنام."], [6, "فبسبب هذه الخطايا ينزل غضب الله،"], [7, "وفيها سلكتم في الماضي، حين كنتم تعيشون فيها."]]}], "kwAr": "فلا تعودوا إلى مجاراة الشهوات", "noteAr": ""}, {"kw": "in", "raw": "Act_17:30; 1Th_4:5; Tit_3:3-5", "note": "", "refs": [{"l": "Act 17:30", "n": "", "vs": [[30, "فالله الآن يدعو جميع الناس في كل مكان أن يرجعوا إليه تائبين، وقد غض النظر عن أزمنة الجهل التي مرت،"]]}, {"l": "1Th 4:5", "n": "", "vs": [[5, "غير منساق للشهوة الجامحة كالوثنيين الذين لا يعرفون الله ،"]]}, {"l": "Tit 3:3-5", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."], [4, "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،"], [5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"]]}], "kwAr": "أيام جهلكم", "noteAr": ""}], "arS": [["وبما أنكم صرتم ", []], ["أولادا", ["G5043"]], [" لله ", []], ["مطيعين", ["G5218"]], [" له، فلا تعودوا إلى ", []], ["مجاراة", ["G4964"]], [" ", []], ["الشهوات", ["G1939"]], [" التي كانت تسيطر عليكم ", []], ["سابقا", ["G4386"]], [" في أيام ", []], ["جهلكم", ["G52"]], [".", []]]}, {"c": 1, "v": 15, "text": "وإنما اسلكوا سلوكا مقدسا في كل أمر، مقتدين بالقدوس الذي دعاكم،", "groups": [{"kw": "as", "raw": "1Pe_2:9, 1Pe_5:10; Rom_8:28-30, Rom_9:24; Phi_3:14; 1Th_2:12, 1Th_4:7; 2Ti_1:9; 2Pe_1:3, 2Pe_1:10", "note": "", "refs": [{"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}, {"l": "Rom 8:28-30", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."], [29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."], [30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."]]}, {"l": "Rom 9:24", "n": "", "vs": [[24, "فينا نحن الذين دعاهم لا من بين اليهود فقط بل من بين الأمم أيضا؟"]]}, {"l": "Phi 3:14", "n": "", "vs": [[14, "إذ أسعى إلى الهدف، لنوال تلك الجائزة التي يدعونا الله إليها دعوة عليا في المسيح يسوع."]]}, {"l": "1Th 2:12", "n": "", "vs": [[12, "ونحرضكم أن تسلكوا سلوكا يليق بالله، ذاك الذي يدعوكم إلى ملكوته ومجده."]]}, {"l": "1Th 4:7", "n": "", "vs": [[7, "فإن الله دعانا لا إلى النجاسة بل (إلى العيش( في القداسة."]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،"]]}, {"l": "2Pe 1:3", "n": "", "vs": [[3, "إن الله، بقدرته الإلهية، قد زودنا بكل ما نحتاج إليه في الحيا ة الروحية المتصفة بالتقوى. ذلك أنه عرفنا بالمسيح الذي دعانا إلى مجده وفضيلته،"]]}, {"l": "2Pe 1:10", "n": "", "vs": [[10, "فأحرى بكم إذن، أيها الإخوة، أن تجتهدوا لتثبتوا عمليا أن الله قد دعاكم واختاركم حقا. فإنكم، إن فعلتم هذا، لن تسقطوا أبدا!"]]}], "kwAr": "القدوس الذي دعاكم", "noteAr": ""}, {"kw": "is", "raw": "Isa_6:3; Rev_3:7, Rev_4:8, Rev_6:10", "note": "", "refs": [{"l": "Isa 6:3", "n": "", "vs": [[3, "ونادى أحدهم الآخر: «قدوس، قدوس، قدوس الرب القدير. مجده ملء كل الأرض»."]]}, {"l": "Rev 3:7", "n": "", "vs": [[7, "واكتب إلى ملاك الكنيسة في فيلادلفيا: إليك ما يقوله القدوس الحق، الذي بيده مفتاح داود، يفتح ولا أحد يغلق، ويغلق ولا أحد يفتح."]]}, {"l": "Rev 4:8", "n": "", "vs": [[8, "وكان لكل كائن منها ستة أجنحة، تكسوها عيون من الداخل ومن الخارج. وهذه الكائنات الحية الأربعة تهتف ليلا ونهارا دون انقطاع قائلة: «قدوس قدوس قدوس، الرب الإله القادر على كل شيء، الذي كان والكائن والذي سيأتي»."]]}, {"l": "Rev 6:10", "n": "", "vs": [[10, "وهم يصرخون للرب بأعلى صوتهم: «حتى متى، أيها السيد القدوس والحق، تؤخر معاقبة أهل الأرض على ما فعلوه بنا؟ متى تنتقم منهم لدمائنا؟»"]]}], "kwAr": "القدوس", "noteAr": ""}, {"kw": "so", "raw": "Mat_5:48; Luk_1:74, Luk_1:75; 2Co_7:1; Eph_5:1, Eph_5:2; Phi_1:27, Phi_2:15, Phi_2:16; 1Th_4:3-7; Tit_2:11-14, Tit_3:8, Tit_3:14; Heb_12:14; 2Pe_1:4-10", "note": "", "refs": [{"l": "Mat 5:48", "n": "", "vs": [[48, "فكونوا أنتم كاملين، كما أن أباكم السماوي هو كامل!"]]}, {"l": "Luk 1:74", "n": "", "vs": [[74, "بعد تخليصنا من أيدي أعدائنا، أن نعبده بلا خوف،"]]}, {"l": "Luk 1:75", "n": "", "vs": [[75, "بقداسة وبر أمامه، طوال حياتنا."]]}, {"l": "2Co 7:1", "n": "", "vs": [[1, "فإذ نلنا هذه الوعود، أيها الأحباء، لنطهر أنفسنا من كل ما يدنس الجسد والروح، ونكمل القداسة في مخافة الله."]]}, {"l": "Eph 5:1", "n": "", "vs": [[1, "فاقتدوا إذن بالله كأولاد أحباء،"]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "Phi 1:27", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"]]}, {"l": "Phi 2:15", "n": "", "vs": [[15, "لتكونوا بلا أذى وبسطاء، أولادا لله لا يعابون بشيء في وسط جيل منحرف فاسد، تضيئون بينهم كأنوار في العالم،"]]}, {"l": "Phi 2:16", "n": "", "vs": [[16, "حاملين كلمة الحياة، لتكونوا في يوم المسيح موضع فخر بأني ما سعيت باطلا ولا اجتهدت عبثا."]]}, {"l": "1Th 4:3-7", "n": "", "vs": [[3, "فإن مشيئة الله هي هذه: قداستكم. وذلك بأن تمتنعوا عن الزنى،"], [4, "وأن يعرف كل واحد منكم كيف يحفظ جسده في الطهارة والكرامة"], [5, "غير منساق للشهوة الجامحة كالوثنيين الذين لا يعرفون الله ،"], [6, "وألا يتعدى حقوق أخيه ويسيء إليه في هذا الأمر، لأن الرب هو المنتقم لجميع هذه الإساءات، كما أنذرناكم قبلا وشهدنا لكم بحق."], [7, "فإن الله دعانا لا إلى النجاسة بل (إلى العيش( في القداسة."]]}, {"l": "Tit 2:11-14", "n": "", "vs": [[11, "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت."], [12, "وهي تعلمنا أن نقطع علاقتنا بالإباحية والشهوات العالمية، وأن نحيا في العصر الحاضر حياة التعقل والبر والتقوى،"], [13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"], [14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Tit 3:8", "n": "", "vs": [[8, "صادق هذا القول! وأريد أن تقرر هذه الأمور قرارا حاسما، حتى يهتم الذين آمنوا بالله بأن يجتهدوا في الأعمال الصالحة. هذه الأمور حسنة ونافعة للناس."]]}, {"l": "Tit 3:14", "n": "", "vs": [[14, "وليتعلم ذوونا أيضا أن يمارسوا أعمالا حسنة، لسد الحاجات الضرورية، لكي لا يكونوا عديمي الثمر."]]}, {"l": "Heb 12:14", "n": "", "vs": [[14, "اجعلوا هدفكم أن تسالموا جميع الناس، وتعيشوا حياة مقدسة. فبغير قداسة، لا يقدر أحد أن يرى الرب."]]}, {"l": "2Pe 1:4-10", "n": "", "vs": [[4, "اللذين بهما أعطانا الله بركاته العظمى الثمينة التي كان قد وعد بها. وبهذا صار بإمكانكم أن تتخلصوا من الفساد الذي تنشره الشهوة في العالم، وتشتركوا في الطبيعة الإلهية."], [5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"], [6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"], [7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."], [8, "فحين تكون هذه الصفات الطيبة في داخلكم، وتزداد بوفرة، تجعلكم مجتهدين ومثمرين في معرفتكم لربنا يسوع المسيح."], [9, "أما الذي لا يملك هذه الصفات، فهو أعمى روحيا. إنه قصير البصر، قد نسي أنه تطهر من خطاياه القديمة!"], [10, "فأحرى بكم إذن، أيها الإخوة، أن تجتهدوا لتثبتوا عمليا أن الله قد دعاكم واختاركم حقا. فإنكم، إن فعلتم هذا، لن تسقطوا أبدا!"]]}], "kwAr": "اسلكوا سلوكا مقدسا", "noteAr": ""}, {"kw": "in", "raw": "1Pe_2:12, 1Pe_3:16; Phi_3:20; 1Ti_4:12; Heb_13:5; Jam_3:13; 2Pe_3:11-14", "note": "", "refs": [{"l": "1Pe 2:12", "n": "", "vs": [[12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالحة يمجدون الله في يوم الافتقاد."]]}, {"l": "1Pe 3:16", "n": "", "vs": [[16, "على أن تفعلوا ذلك بوداعة واحترام، محافظين على طهارة ضمائركم، سالكين في المسيح سلوكا صالحا، وعندئذ يخيب الذين يوجهون إليكم التهم الكاذبة ويشتمونكم كأنكم تفعلون شرا."]]}, {"l": "Phi 3:20", "n": "", "vs": [[20, "أما نحن، فإن وطننا في السماوات التي منها ننتظر عودة مخلصنا الرب يسوع المسيح،"]]}, {"l": "1Ti 4:12", "n": "", "vs": [[12, "لا يستخف أحد بحداثة سنك. وإنما كن قدوة للمؤمنين، في الكلام والسلوك والمحبة والإيمان والطهارة."]]}, {"l": "Heb 13:5", "n": "", "vs": [[5, "اجعلوا سيرتكم مترفعة عن حب المال، واقنعوا بما عندكم، لأن الله يقول: «لا أتركك، ولا أتخلى عنك أبدا!»"]]}, {"l": "Jam 3:13", "n": "", "vs": [[13, "أبينكم بعض الحكماء والفهماء؟ إذن، على هؤلاء أن يسلكوا سلوكا حسنا، مظهرين بأعمالهم تلك الوداعة التي تتصف بها الحكمة (الحقيقية)."]]}, {"l": "2Pe 3:11-14", "n": "", "vs": [[11, "ومادامت هذه الأشياء جميعا ستنحل، فكيف يجب أن تكونوا أنتم أصحاب سلوك مقدس يتصف بالتقوى،"], [12, "منتظرين «يوم الله» الأبدي وطالبين حلوله بسرعة. ففي ذلك اليوم، تنحل السماوات ملتهبة، وتذوب العناصر محترقة."], [13, "إلا أننا، وفقا لوعد الرب، ننتظر سماوات جديدة وأرضا جديدة، حيث يسكن البر."], [14, "فبينما تنتظرون إتمام هذا الوعد، أيها الأحباء، اجتهدوا أن يجدكم الرب في سلام، خالين من الدنس والعيب."]]}], "kwAr": "في كل أمر", "noteAr": ""}], "arS": [["وإنما اسلكوا ", []], ["سلوكا", ["G391"]], [" ", []], ["مقدسا", ["G40"]], [" في ", []], ["كل", ["G3956"]], [" أمر، مقتدين ", []], ["بالقدوس", ["G40"]], [" الذي ", []], ["دعاكم", ["G2564"]], ["،", []]]}, {"c": 1, "v": 16, "text": "لأنه قد كتب: «كونوا قديسين، لأني أنا قدوس!»", "groups": [{"kw": "", "raw": "Lev_11:44, Lev_19:2, Lev_20:7; Amo_3:3", "note": "", "refs": [{"l": "Lev 11:44", "n": "", "vs": [[44, "أنا الرب إلهكم، فكرسوا أنفسكم وتقدسوا، لأني أنا قدوس، ولا تنجسوا أنفسكم بشيء من الدبيب المتحرك على الأرض."]]}, {"l": "Lev 19:2", "n": "", "vs": [[2, "«قل لبني إسرائيل: كونوا قديسين لأني أنا الرب إلهكم قدوس."]]}, {"l": "Lev 20:7", "n": "", "vs": [[7, "فتقدسوا وكونوا قديسين، لأني أنا الرب إلهكم."]]}, {"l": "Amo 3:3", "n": "", "vs": [[3, "هل يترافق اثنان معا ما لم يكونا على موعد؟"]]}], "kwAr": "", "noteAr": ""}], "arS": [["لأنه قد ", []], ["كتب", ["G1125"]], [": «", []], ["كونوا", ["G1096"]], [" ", []], ["قديسين", ["G40"]], ["، لأني ", []], ["أنا", ["G1473"]], [" ", []], ["قدوس", ["G40"]], ["!»", []]]}, {"c": 1, "v": 17, "text": "وما دمتم تعترفون بالله أبا لكم، وهو يحكم على كل إنسان حسب أعماله دون انحياز، فاسلكوا في مخافته مدة إقامتكم المؤقتة على الأرض.", "groups": [{"kw": "call", "raw": "Zep_3:9; Mat_6:9, Mat_7:7-11; 2Co_1:2; Eph_1:17, Eph_3:14", "note": "", "refs": [{"l": "Zep 3:9", "n": "", "vs": [[9, "عندئذ أنقي شفاه الشعب ليدعوا جميعهم باسم الرب ويعبدوه جنبا إلى جنب."]]}, {"l": "Mat 6:9", "n": "", "vs": [[9, "فصلوا أنتم مثل هذه الصلاة: أبانا الذي في السماوات، ليتقدس اسمك!"]]}, {"l": "Mat 7:7-11", "n": "", "vs": [[7, "اسألوا، تعطوا. اطلبوا، تجدوا. اقرعوا، يفتح لكم."], [8, "فكل من يسأل، ينل؛ ومن يطلب، يجد؛ ومن يقرع، يفتح له."], [9, "وإلا، فأي إنسان منكم يطلب منه ابنه خبزا، فيعطيه حجرا،"], [10, "أو سمكة، فيعطيه حية؟"], [11, "فإن كنتم وأنتم أشرار، تعرفون أن تعطوا أولادكم عطايا جيدة، فكم بالأحرى جدا يعطي أبوكم السماوي عطايا جيدة للذين يطلبون منه؟"]]}, {"l": "2Co 1:2", "n": "", "vs": [[2, "لتكن لكم النعمة والسلام من الله أبينا ومن الرب يسوع المسيح!"]]}, {"l": "Eph 1:17", "n": "", "vs": [[17, "حتى يهبكم إله ربنا يسوع المسيح، أبو المجد، روح حكمة وإلهام: لتعرفوه معرفة كاملة"]]}, {"l": "Eph 3:14", "n": "", "vs": [[14, "ولهذا السبب أحني ركبتي للآب"]]}], "kwAr": "تعترفون بالله أبا لكم", "noteAr": ""}, {"kw": "who", "raw": "Deu_10:17; 2Ch_19:7; Job_34:19; Mat_22:16; Act_10:34, Act_10:35; Rom_2:10,Rom_2:11; Gal_2:6; Eph_6:9; Col_3:25", "note": "", "refs": [{"l": "Deu 10:17", "n": "", "vs": [[17, "لأن الرب إلهكم هو إله الآلهة ورب الأرباب، الإله العظيم الجبار المهيب، الذي لا يحابي وجه أحد، ولا يرتشي."]]}, {"l": "2Ch 19:7", "n": "", "vs": [[7, "ولتكن هيبة الرب عليكم. فاحرصوا على إقامة العدل لأنه ليس عند الرب إلهنا ظلم ولا محاباة ولا رشوة»."]]}, {"l": "Job 34:19", "n": "", "vs": [[19, "الذي لا يحابي الأمراء، ولا يؤثر الأغنياء على الفقراء، لأنهم جميعا عمل يديه."]]}, {"l": "Mat 22:16", "n": "", "vs": [[16, "فأرسلوا إليه بعض تلاميذهم مع أعضاء حزب هيرودس، يقولون له: «يامعلم، نعلم أنك صادق وتعلم الناس طريق الله في الحق، ولا تبالي بأحد لأنك لا تراعي مقامات الناس،"]]}, {"l": "Act 10:34", "n": "", "vs": [[34, "فبدأ بطرس كلامه قائلا: «تبين لي فعلا أن الله لا يفضل أحدا على أحد،"]]}, {"l": "Act 10:35", "n": "", "vs": [[35, "بل يقبل من يتقيه ويعمل الصلاح مهما كانت جنسيته."]]}, {"l": "Rom 2:10", "n": "", "vs": [[10, "والمجد والكرامة والسلام لكل من يعمل الصلاح اليهودي أولا، ثم اليوناني ."]]}, {"l": "Rom 2:11", "n": "", "vs": [[11, "فليس عند الله تحيز."]]}, {"l": "Gal 2:6", "n": "", "vs": [[6, "أما الذين كانوا يعتبرون من البارزين، ولا فرق عندي مهما كانت مكانتهم مادام الله لا يراعي وجاهة إنسان، فإنهم لم يزيدوا شيئا على ما أبشر به."]]}, {"l": "Eph 6:9", "n": "", "vs": [[9, "وأنتم، أيها السادة، عاملوهم بمثل هذه المعاملة غير لاجئين إلى التهديد، عالمين أن سيدكم وسيدهم هو في السماء، وهو لا يراعي مقامات الناس."]]}, {"l": "Col 3:25", "n": "", "vs": [[25, "وأما من عمل شرا فسوف ينال جزاء عمله الشرير، وليس محاباة."]]}], "kwAr": "دون انحياز", "noteAr": ""}, {"kw": "pass", "raw": "Gen_47:9; 1Ch_29:15; Psa_39:12; Heb_11:13-16", "note": "", "refs": [{"l": "Gen 47:9", "n": "", "vs": [[9, "فأجاب يعقوب فرعون: «سنوات غربتي مئة وثلاثون سنة، قليلة وشاقة، ولم تبلغ سني غربة آبائي»."]]}, {"l": "1Ch 29:15", "n": "", "vs": [[15, "فنحن مثل آبائنا، غرباء ونزلاء أمامك، وأيامنا كالظل على الأرض، خالية من الرجاء."]]}, {"l": "Psa 39:12", "n": "", "vs": [[12, "يارب اسمع صلاتي. واصغ إلى صراخي، ولا تسكت أمام دموعي، لأني غريب عندك وعابر سبيل كجميع آبائي."]]}, {"l": "Heb 11:13-16", "n": "", "vs": [[13, "هؤلاء جميعا، حافظوا على إيمانهم إلى النهاية. وماتوا قبل أن تتحقق وعود الله لهم في أثناء حياتهم. ولكنهم رأوها من بعيد، وتوقعوا تحقيقها كاملة في المستقبل. وإذ آمنوا بتلك الوعود الإلهية اعترفوا بأنهم ليسوا إلا غرباء على الأرض يزورونها زيارة عابرة."], [14, "والذين يقولون ذلك، يوضحون أن عيونهم على وطنهم الحقيقي."], [15, "ولو كانوا يتذكرون الوطن الأرضي الذي هجروه، لاغتنموا الفرصة وعادوا إليه."], [16, "ولكن، لا ... فهم الآن يتطلعون إلى وطن أفضل، أي الوطن السماوي. بسبب إيمانهم هذا لا يستحي الله أن يدعى إلههم. فهو قد أعد لهم مدينة!"]]}], "kwAr": "مدة إقامتكم المؤقتة", "noteAr": ""}, {"kw": "in fear", "raw": "1Pe_2:11; Pro_14:16, Pro_28:14; Rom_11:20; 2Co_5:6, 2Co_7:1, 2Co_7:11; Phi_2:12; Heb_4:1; Heb_12:28", "note": "", "refs": [{"l": "1Pe 2:11", "n": "", "vs": [[11, "أيها الأحباء، ما أنتم إلا غرباء تزورون الأرض زيارة عابرة. لذلك أطلب إليكم أن تبتعدوا عن الشهوات الجسدية التي تصارع النفس."]]}, {"l": "Pro 14:16", "n": "", "vs": [[16, "الحكيم يخشى الشر ويتفاداه، والجاهل يتصلف ويدعي الثقة بالنفس."]]}, {"l": "Pro 28:14", "n": "", "vs": [[14, "طوبى للإنسان الذي يتقي الرب دائما، أما من يقسي قلبه فيسقط في البلية."]]}, {"l": "Rom 11:20", "n": "", "vs": [[20, "صحيح! فهي قطعت لسبب عدم الإيمان، وأنت إنما تثبت بسبب الإيمان. فلا يأخذك الغرور، بل خف"]]}, {"l": "2Co 5:6", "n": "", "vs": [[6, "لذلك نحن واثقون دائما، وعالمون أننا مادمنا مقيمين في الجسد، نبقى مغتربين عن الرب،"]]}, {"l": "2Co 7:1", "n": "", "vs": [[1, "فإذ نلنا هذه الوعود، أيها الأحباء، لنطهر أنفسنا من كل ما يدنس الجسد والروح، ونكمل القداسة في مخافة الله."]]}, {"l": "2Co 7:11", "n": "", "vs": [[11, "فانظروا، إذن، هذا الحزن عينه الذي يوافق الله ، كم أنتج فيكم من الاجتهاد، بل من الاعتذار، بل من الاستنكار، بل من الخوف، بل من التشوق، بل من الغيرة، بل من الانتقام! وقد بينتم في كل شيء أنكم أبرياء من ذلك الأمر."]]}, {"l": "Phi 2:12", "n": "", "vs": [[12, "إذن، ياأحبائي، كما كنتم تطيعون دائما، لا كما لو أنني حاضر وحسب، بل بالأحرى كثيرا الآن وأنا غائب، كذلك اسعوا لتحقيق خلاصكم عمليا بخوف وارتعاد،"]]}, {"l": "Heb 4:1", "n": "", "vs": [[1, "ومادام الوعد بالدخول إلى الراحة الإلهية قائما حتى الآن، فلنخف: فربما تبين أن بعضا منكم قد فشلوا في الدخول."]]}, {"l": "Heb 12:28", "n": "", "vs": [[28, "فبما أننا قد حصلنا على مملكة ثابتة لا تتزلزل، لنعبد الله ونخدمه شاكرين، بصورة ترضيه، بكل احترام ومخافة،"]]}], "kwAr": "في مخافته", "noteAr": ""}], "arS": [["وما دمتم ", []], ["تعترفون", ["G1941"]], [" بالله ", []], ["أبا", ["G3962"]], [" لكم، وهو ", []], ["يحكم", ["G2919"]], [" على كل ", []], ["إنسان", ["G1538"]], [" حسب ", []], ["أعماله", ["G2041"]], [" ", []], ["دون انحياز", ["G678"]], ["، ", []], ["فاسلكوا", ["G390"]], [" في ", []], ["مخافته", ["G5401"]], [" ", []], ["مدة", ["G5550"]], [" ", []], ["إقامتكم المؤقتة", ["G3940"]], [" على الأرض.", []]]}, {"c": 1, "v": 18, "text": "واعلموا أنه قد دفع الفدية ليحرركم من سيرة حياتكم الباطلة التي أخذتموها بالتقليد عن آبائكم. وهذه الفدية لم تكن شيئا فانيا كالفضة أو الذهب،", "groups": [{"kw": "ye", "raw": "Psa_49:7, Psa_49:8; 1Co_6:20, 1Co_7:23", "note": "", "refs": [{"l": "Psa 49:7", "n": "", "vs": [[7, "لا يقدر أحد أبدا أن يفتدي أخاه أو يقدم لله كفارة عنه."]]}, {"l": "Psa 49:8", "n": "", "vs": [[8, "لأن فدية النفوس باهظة يتعذر دفعها مدى الحياة"]]}, {"l": "1Co 6:20", "n": "", "vs": [[20, "لأنكم قد اشتريتم بفدية. إذن، مجدوا الله في أجسادكم."]]}, {"l": "1Co 7:23", "n": "", "vs": [[23, "قد اشتريتم بفدية، فلا تصيروا عبيدا للبشر."]]}], "kwAr": "دفع الفدية ليحرركم", "noteAr": ""}, {"kw": "corruptible", "raw": "1Pe_1:7", "note": "", "refs": [{"l": "1Pe 1:7", "n": "", "vs": [[7, "إلا أن غاية هذه التجارب هي اختبار حقيقة إيمانكم. فكما تختبر النار الذهب وتنقيه، تختبر التجارب حقيقة إيمانكم، وهو أثمن جدا من الذهب الفاني. وهكذا، يكون إيمانكم مدعاة مدح وإكرام وتمجيد لكم، عندما يعود يسوع المسيح ظاهرا بمجده."]]}], "kwAr": "شيئا فانيا", "noteAr": ""}, {"kw": "vain", "raw": "Psa_39:6, Psa_62:10; Jer_4:11; Rom_1:21; 1Co_3:20", "note": "", "refs": [{"l": "Psa 39:6", "n": "", "vs": [[6, "إنما كخيال يتمشى الإنسان، فعبثا يكافح الناس. يجمع الواحد منهم ثروة ولا يدري من يرثها من بعده."]]}, {"l": "Psa 62:10", "n": "", "vs": [[10, "لا تتكلوا على الظلم ولا تتفاخروا بالسرقة. إن كثر الغنى فلا تعتمدوا عليه،"]]}, {"l": "Jer 4:11", "n": "", "vs": [[11, "ويقال في ذلك الحين لهذا الشعب ولأهل أورشليم: ستهب ريح لافحة من هضاب الصحر اء نحو بنت شعبي، لا تستهدف التذرية ولا التنقية،"]]}, {"l": "Rom 1:21", "n": "", "vs": [[21, "فمع أنهم عرفوا الله ، لم يمجدوه باعتباره الله ، ولا شكروه، بل انحطوا بتفكيرهم إلى الحماقة وصار قلبهم لغباوته مظلما."]]}, {"l": "1Co 3:20", "n": "", "vs": [[20, "وأيضا: «الرب يعلم أفكار الحكماء ويعرف أنها باطلة!»"]]}], "kwAr": "الباطلة", "noteAr": ""}, {"kw": "received", "raw": "1Pe_4:3; Jer_9:14, Jer_16:19, Jer_44:17; Eze_20:18; Amo_2:4; Zec_1:4-6; Mat_15:2, Mat_15:3; Act_7:51, Act_7:52, Act_19:34, Act_19:35; Gal_1:4", "note": "", "refs": [{"l": "1Pe 4:3", "n": "", "vs": [[3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}, {"l": "Jer 9:14", "n": "", "vs": [[14, "بل ضلوا وراء عناد قلوبهم، وانساقوا خلف آلهة البعليم التي لقنهم آباؤهم عبادتها."]]}, {"l": "Jer 16:19", "n": "", "vs": [[19, "يارب أنت عزي وحصني وملاذي في يوم الضيق، إليك تقبل الأمم من أقاصي الأرض قائلة: «لم يرث آباؤنا سوى الباطل والأكاذيب وما لا جدوى منه."]]}, {"l": "Jer 44:17", "n": "", "vs": [[17, "بل نعمل بمقتضى ما تعهدنا به، فنحرق بخورا لملكة السماء ونقرب لها السكائب كما سبق أن فعلنا نحن وآباؤنا وملوكنا ورؤساؤنا في مدن يهوذا وفي شوارع أورشليم، فكانت لنا وفرة من الطعام وتمتعنا بالخير ولم يصبنا شر."]]}, {"l": "Eze 20:18", "n": "", "vs": [[18, "وأوصيت أبناءهم في البرية ألا يسلكوا في طرق آبائهم ولا يمارسوا أعمالهم ولا يتنجسوا بأصنامهم."]]}, {"l": "Amo 2:4", "n": "", "vs": [[4, "هذا ما يقوله الرب: من أجل معاصي يهوذا الثلاث والأربع لن أرد عنهم سخطي، لأنهم رفضوا شريعة الرب ولم يطيعوا فرائضه، فأضلتهم أكاذيبهم التي غوى وراءها آباؤهم."]]}, {"l": "Zec 1:4-6", "n": "", "vs": [[4, "ولا تكونوا كآبائكم الذين ناداهم الأنبياء السالفون قائلين: هكذا يقول الرب القدير، ارجعوا عن طرقكم الباطلة وأعمالكم الشريرة، ولكنهم لم يسمعوا ولم يصغوا إلي، يقول الرب."], [5, "أين هم آباؤكم؟ وهل يحيا الأنبياء إلى الأبد؟"], [6, "ولكن ألم تدرك أقوالي وفرائضي التي أمرت بها عبيدي الأنبياء آباءكم فتابوا قائلين: لقد نفذ الرب القدير ما عزم أن يعاقبنا بمقتضى ما ارتكبناه من أعمال باطلة؟»"]]}, {"l": "Mat 15:2", "n": "", "vs": [[2, "«لماذا يخالف تلاميذك تقاليد الشيوخ، فلا يغسلون أيديهم قبل أن يأكلوا؟»"]]}, {"l": "Mat 15:3", "n": "", "vs": [[3, "فأجابهم «ولماذا تخالفون أنتم وصية الله من أجل المحافظة على تقاليدكم؟"]]}, {"l": "Act 7:51", "n": "", "vs": [[51, "ثم قال استفانوس: «ياأصحاب الرقاب الصلبة والقلوب والآذان غير المختونة! إنكم دائما تقاومون الروح القدس. وكما فعل آباؤكم تفعلون!"]]}, {"l": "Act 7:52", "n": "", "vs": [[52, "فأي نبي نجا من اضطهادهم وقد قتلوا الذين أنبأوا بمجيء البار الذي سلمتموه أنتم وقتلتموه!"]]}, {"l": "Act 19:34", "n": "", "vs": [[34, "لكن المحتشدين عرفوا أنه يهودي، فأخذوا يهتفون معا هتافا واحدا ظلوا يرددونه نحو ساعتين: «عظيمة أرطاميس إلهة أهل أفسس!»"]]}, {"l": "Act 19:35", "n": "", "vs": [[35, "أخيرا تمكن كاتب المدينة من تهدئة الحشود، وقال: «ياأهل أفسس، من ينكر أن أفسس هي المدينة الحارسة لهيكل أرطاميس الإلهة العظيمة، ولصنمها الذي هبط من السماء؟"]]}, {"l": "Gal 1:4", "n": "", "vs": [[4, "الذي بذل نفسه من أجل خطايانا لكي ينقذنا من العالم الحاضر الشرير، وفقا لمشيئة إلهنا وأبينا."]]}], "kwAr": "أخذتموها بالتقليد", "noteAr": ""}], "arS": [["واعلموا", ["G1492"]], [" أنه قد ", []], ["دفع الفدية", ["G3084"]], [" ليحرركم من ", []], ["سيرة", ["G391"]], [" حياتكم ", []], ["الباطلة", ["G3152"]], [" التي أخذتموها ", []], ["بالتقليد عن آبائكم", ["G3970"]], [". وهذه الفدية لم تكن شيئا ", []], ["فانيا", ["G5349"]], [" ", []], ["كالفضة", ["G694"]], [" أو ", []], ["الذهب", ["G5553"]], ["،", []]]}, {"c": 1, "v": 19, "text": "بل كانت دما ثمينا، دم المسيح، ذلك الحمل الطاهر الذي ليس فيه عيب ولا دنس!", "groups": [{"kw": "with", "raw": "1Pe_2:22-24, 1Pe_3:18; Dan_9:24; Zec_13:7; Mat_20:28, Mat_26:28; Act_20:28; Eph_1:7; Col_1:14; Heb_9:12-14; 1Jo_1:7, 1Jo_2:2; Rev_1:5, Rev_5:9", "note": "", "refs": [{"l": "1Pe 2:22-24", "n": "", "vs": [[22, "إنه لم يفعل خطيئة واحدة، ولا كان في فمه مكر."], [23, "ومع أنه أهين، فلم يكن يرد الإهانة. وإذ تحمل الآلام، لم يكن يهدد بالانتقام، بل أسلم أمره لله الذي يحكم بالعدل."], [24, "وهو نفسه حمل خطايانا في جسده (عندما مات مصلوبا) على الخشبة، لكي نموت بالنسبة للخطايا فنحيا حياة البر. وبجراحه هو تم لكم الشفاء،"]]}, {"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}, {"l": "Dan 9:24", "n": "", "vs": [[24, "قد صدر القضاء أن يمضي سبعون أسبوعا على شعبك وعلى مدينة قدسك، للانتهاء من المعصية والقضاء على الخطيئة، وللتكفير عن الإثم، ولإشاعة البر الأبدي وختم الرؤيا والنبوءة ولمسح قدوس القدوسين."]]}, {"l": "Zec 13:7", "n": "", "vs": [[7, "ويقول الرب القدير: «استيقظ أيها السيف وهاجم راعي ورجل رفقتي. اضرب الراعي فتتبدد الخراف. ولكني أرد يدي عن الصغار (أي القلة المؤمنة)."]]}, {"l": "Mat 20:28", "n": "", "vs": [[28, "فهكذا ابن الإنسان: قد جاء لا ليخدم، بل ليخدم ويبذل نفسه فدية عن كثيرين. »"]]}, {"l": "Mat 26:28", "n": "", "vs": [[28, "فإن هذا هو دمي الذي للعهد الجديد والذي يسفك من أجل كثيرين لمغفرة الخطايا."]]}, {"l": "Act 20:28", "n": "", "vs": [[28, "فاسهروا إذن على أنفسكم وعلى جميع القطيع الذي عينكم بينه الروح القدس نظارا، لترعوا كنيسة الله التي اشتراها بدمه."]]}, {"l": "Eph 1:7", "n": "", "vs": [[7, "ففيه لنا بدمه الفداء، أي غفران الخطايا؛ بحسب غنى نعمته"]]}, {"l": "Col 1:14", "n": "", "vs": [[14, "الذي فيه لنا الفداء، أي غفران الخطايا."]]}, {"l": "Heb 9:12-14", "n": "", "vs": [[12, "فإلى «قدس الأقداس» في هذه الخيمة، دخل المسيح مرة واحدة، حاملا دم نفسه، لا دم تيوس وعجول. وذلك بعدما سفك دمه عوضا عنا. فحقق فداء أبديا."], [13, "ولا عجب! فوفقا للنظام السابق، كان دم الثيران والتيوس يرش على المنجسين، مع رماد عجلة محروقة، فيصيرون طاهرين طهارة جسدية."], [14, "فكم بالأحرى دم المسيح الذي قدم نفسه لله بروح أزلي ذبيحة لا عيب فيها، يطهر ضمائرنا من الأعمال الميتة لنعبد الله الحي."]]}, {"l": "1Jo 1:7", "n": "", "vs": [[7, "ولكن، إن كنا فعلا نعيش في النور، كما هو في النور، تكون لنا حقا شركة بعضنا مع بعض، ودم ابنه يسوع يطهرنا من كل خطيئة."]]}, {"l": "1Jo 2:2", "n": "", "vs": [[2, "فهو كفارة لخطايانا، لا لخطايانا فقط، بل لخطايا العالم كله."]]}, {"l": "Rev 1:5", "n": "", "vs": [[5, "ومن يسوع المسيح الشاهد الأمين، بكر القائمين من بين الأموات، ملك ملوك الأرض، ذاك الذي بدافع محبته لنا مات لأجلنا فغسلنا بدمه من خطايانا،"]]}, {"l": "Rev 5:9", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"]]}], "kwAr": "دما ثمينا، دم المسيح", "noteAr": ""}, {"kw": "as", "raw": "Exo_12:5; Isa_53:7; Joh_1:29, Joh_1:36; Act_8:32-35; 1Co_5:7, 1Co_5:8; Rev_5:6, Rev_7:14; Rev_14:1", "note": "", "refs": [{"l": "Exo 12:5", "n": "", "vs": [[5, "ويجب أن يكون الحمل ذكرا ابن سنة، خاليا من كل عيب، تنتقونه من الخرفان أو المعيز."]]}, {"l": "Isa 53:7", "n": "", "vs": [[7, "ظلم وأذل، ولكنه لم يفتح فاه، بل كشاة سيق إلى الذبح، وكنعجة صامتة أمام جازيها لم يفتح فاه."]]}, {"l": "Joh 1:29", "n": "", "vs": [[29, "وفي اليوم التالي رأى يوحنا يسوع آتيا نحوه، فهتف قائلا: «هذا هو حمل الله الذي يزيل خطيئة العالم."]]}, {"l": "Joh 1:36", "n": "", "vs": [[36, "فنظر إلى يسوع وهو سائر فقال: «هذا هو حمل الله»."]]}, {"l": "Act 8:32-35", "n": "", "vs": [[32, "وكان الخصي قد وصل في فصل الكتاب الذي يقرأه إلى القول: «مثل شاة سيق إلى الذبح، ومثل الحمل الصامت بين يدي من يجزه، هكذا لم يفتح فاه!"], [33, "في أثناء تواضعه عومل بغير عدل. من يخبر عن نسله؟ فإن حياته قد انتزعت من الأرض!»"], [34, "وسأل الخصي فيلبس: «قل لي: إلى من يشير النبي بهذا القول؟ إلى نفسه أو إلى شخص آخر؟»"], [35, "فتكلم وأخذ يبشره بيسوع انطلاقا من كتاب النبي هذا."]]}, {"l": "1Co 5:7", "n": "", "vs": [[7, "فاعزلوا الخميرة العتيقة من بينكم لتكونوا عجينا جديدا، لأنكم فطير ! فإن حمل فصحنا، أي المسيح، قد ذبح."]]}, {"l": "1Co 5:8", "n": "", "vs": [[8, "فلنعيد إذن، لا بخميرة عتيقة، ولا بخميرة الخبث والشر، بل بفطير الخلاص والحق."]]}, {"l": "Rev 5:6", "n": "", "vs": [[6, "ونظرت فرأيت في الوسط بين العرش والكائنات الحية الأربعة والشيوخ حملا يظهر كأنه كان قد ذبح. وكانت له سبعة قرون، وسبع أعين تمثل أرواح الله السبعة التي أرسلت إلى الأرض كلها."]]}, {"l": "Rev 7:14", "n": "", "vs": [[14, "فأجبته: «أنت أعلم ياسيدي!» فقال: «هؤلاء هم الذين أتوا من الضيقة العظيمة، وقد غسلوا ثيابهم وبيضوها بدم الحمل."]]}, {"l": "Rev 14:1", "n": "", "vs": [[1, "ثم رأيت حملا واقفا على جبل صهيون ومعه مئة وأربعة وأربعون ألفا كتب على جباههم اسمه واسم أبيه."]]}], "kwAr": "الحمل الطاهر", "noteAr": ""}], "arS": [["بل كانت دما ", []], ["ثمينا", ["G5093"]], ["، ", []], ["دم", ["G129"]], [" ", []], ["المسيح", ["G5547"]], ["، ذلك ", []], ["الحمل", ["G286"]], [" الطاهر الذي ليس فيه ", []], ["عيب", ["G299"]], [" ولا ", []], ["دنس", ["G784"]], ["!", []]]}, {"c": 1, "v": 20, "text": "ومع أن الله كان قد عين المسيح لهذا الغرض قبل تأسيس العالم، فهو لم يعلنه إلا في هذا الزمن الأخير لفائدتكم", "groups": [{"kw": "verily", "raw": "Gen_3:15; Pro_8:23; Mic_5:2; Rom_3:25, Rom_16:25, Rom_16:26; Eph_1:4, Eph_3:9, Eph_3:11; Col_1:26; 2Ti_1:9, 2Ti_1:10; Tit_1:2, Tit_1:3; Rev_13:8", "note": "", "refs": [{"l": "Gen 3:15", "n": "", "vs": [[15, "وأثير عداوة دائمة بينك وبين المرأة، وكذلك بين نسليكما. هو يسحق رأسك وأنت تلدغين عقبه»."]]}, {"l": "Pro 8:23", "n": "", "vs": [[23, "منذ الأزل أنا هو، منذ البدء قبل أن توجد الأرض."]]}, {"l": "Mic 5:2", "n": "", "vs": [[2, "أما أنت يابيت لحم أفراتة، مع أنك قرية صغيرة بين ألوف قرى يهوذا، إلا أن منك يخرج لي من يصبح ملكا في إسرائيل وأصله منذ القديم، منذ الأزل."]]}, {"l": "Rom 3:25", "n": "", "vs": [[25, "الذي قدمه الله كفارة، عن طريق الإيمان، وذلك بدمه."]]}, {"l": "Rom 16:25", "n": "", "vs": [[25, "والمجد للقادر أن يثبتكم، وفقا لإنجيلي وللبشارة بيسوع المسيح، ووفقا لإعلان ما كان سرا ظل مكتوما مدى الأزمنة الأزلية،"]]}, {"l": "Rom 16:26", "n": "", "vs": [[26, "ولكن أذيع الآن، بأمر الله الأزلي في الكتابات النبوية، على جميع الأمم لأجل إطاعة الإيمان؛"]]}, {"l": "Eph 1:4", "n": "", "vs": [[4, "كما كان قد اختارنا فيه قبل تأسيس العالم، لنكون قديسين بلا لوم أمامه."]]}, {"l": "Eph 3:9", "n": "", "vs": [[9, "وأنير الجميع بمعرفة ما هو تدبير السر الذي أبقاه الله ، خالق كل شيء، مكتوما مدى الأجيال."]]}, {"l": "Eph 3:11", "n": "", "vs": [[11, "وفقا للقصد الأزلي الذي قصده الله في المسيح يسوع ربنا،"]]}, {"l": "Col 1:26", "n": "", "vs": [[26, "السر الذي كان مكتوما طوال العصور والأجيال، ولكن كشف الآن لقديسيه،"]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،"]]}, {"l": "2Ti 1:10", "n": "", "vs": [[10, "والتي أعلنت الآن بظهور مخلصنا يسوع المسيح الذي سحق الموت وأنار الحياة والخلود بالإنجيل"]]}, {"l": "Tit 1:2", "n": "", "vs": [[2, "في رجاء الحياة الأبدية، التي وعد بها الله المنزه عن الكذب، من قبل أزمنة الأزل،"]]}, {"l": "Tit 1:3", "n": "", "vs": [[3, "ثم بين كلمته في أوانها المعين: بالبشارة التي وضعت أمانة بين يدي بموجب أمر مخلصنا الله …"]]}, {"l": "Rev 13:8", "n": "", "vs": [[8, "فيسجد للوحش جميع سكان الأرض الذين لم تكتب أسماؤهم منذ تأسيس العالم في سجل الحياة للحمل الذي ذبح."]]}], "kwAr": "قبل تأسيس العالم", "noteAr": ""}, {"kw": "but", "raw": "Act_3:25, Act_3:26; Col_1:26; 1Jo_1:2, 1Jo_3:5, 1Jo_3:8, 1Jo_4:9, 1Jo_4:10", "note": "", "refs": [{"l": "Act 3:25", "n": "", "vs": [[25, "وأنتم أحفاد هؤلاء الأنبياء، وأبناء العهد الذي أبرمه الله لآبائنا عندما قال لإبراهيم: بنسلك تنال البركة شعوب الأرض كلها."]]}, {"l": "Act 3:26", "n": "", "vs": [[26, "فمن أجلكم أولا أقام الله فتاه يسوع وأرسله ليبارككم برد كل واحد منكم عن شروره»."]]}, {"l": "Col 1:26", "n": "", "vs": [[26, "السر الذي كان مكتوما طوال العصور والأجيال، ولكن كشف الآن لقديسيه،"]]}, {"l": "1Jo 1:2", "n": "", "vs": [[2, "فإن «الحياة» تجلت أمامنا. وبعدما رأيناها فعلا، نشهد لها الآن. وها نحن ننقل إليكم خبر هذه الحياة الأبدية التي كانت عند الآب ثم تجلت أمامنا!"]]}, {"l": "1Jo 3:5", "n": "", "vs": [[5, "وأنتم تعرفون أن المسيح جاء إلى هذه الأرض لكي يحمل الخطايا، مع كونه بلا خطيئة."]]}, {"l": "1Jo 3:8", "n": "", "vs": [[8, "ولكن من يمارس الخطيئة، يظهر أنه من أولاد إبليس، لأن إبليس يمارس الخطيئة منذ البداية. وقد جاء ابن الله إلى الأرض لكي يبطل أعمال إبليس."]]}, {"l": "1Jo 4:9", "n": "", "vs": [[9, "وقد أظهر الله محبته لنا إذ أرسل ابنه الأوحد إلى العالم لكي نحيا به."]]}, {"l": "1Jo 4:10", "n": "", "vs": [[10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."]]}], "kwAr": "لم يعلنه", "noteAr": ""}, {"kw": "in", "raw": "Gal_4:4; Eph_1:10; Heb_1:2, Heb_9:26", "note": "", "refs": [{"l": "Gal 4:4", "n": "", "vs": [[4, "ولكن لما جاء تمام الزمان، أرسل ا
