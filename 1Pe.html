له إلى أنبيائه الأتقياء منذ القدم."]]}, {"l": "Heb 6:20", "n": "", "vs": [[20, "فلأجلنا دخل يسوع إلى هناك سابقا لنا. وهو هناك يقوم بمهمته نيابة عنا بعدما صار رئيس كهنة إلى الأبد على رتبة ملكيصادق!"]]}, {"l": "Heb 8:1", "n": "", "vs": [[1, "وخلاصة القول في هذا الموضوع، أن المسيح هو رئيس كهنتنا الذي وصفنا كهنوته هنا. إنه الآن جالس في السماء عن يمين عرش الله العظيم."]]}, {"l": "Heb 9:24", "n": "", "vs": [[24, "فالمسيح، رئيس كهنتنا، لم يدخل إلى «قدس الأقداس» الأرضي، الذي صنعته يد بشرية وما هو إلا ظل للحقيقة، بل دخل إلى السماء عينها، حيث يقوم الآن بتمثيلنا في حضرة الله بالذات."]]}], "kwAr": "انطلق إلى السماء", "noteAr": ""}, {"kw": "is on", "raw": "Psa_110:1; Mat_22:44; Mar_12:36; Luk_20:42; Rom_8:34; Eph_1:20; Col_3:1; Heb_1:3, Heb_1:13, Heb_8:1, Heb_10:12, Heb_12:2", "note": "", "refs": [{"l": "Psa 110:1", "n": "", "vs": [[1, "قال الرب لربي: «اجلس عن يميني حتى أضع أعداءك موطئا لقدميك»."]]}, {"l": "Mat 22:44", "n": "", "vs": [[44, "قال الرب لربي: اجلس عن يميني حتى أضع أعداءك موطئا لقدميك؟"]]}, {"l": "Mar 12:36", "n": "", "vs": [[36, "فإن داود نفسه قال بالروح القدس: قال الرب لربي: اجلس عن يميني حتى أضع أعداءك موطئا لقدميك!"]]}, {"l": "Luk 20:42", "n": "", "vs": [[42, "فيما يقول داود نفسه في كتاب المزامير: قال الرب لربي: اجلس عن يميني"]]}, {"l": "Rom 8:34", "n": "", "vs": [[34, "فمن ذا يدين؟ إنه المسيح يسوع هو الذي مات، بل بالأحرى قام، وهو أيضا عن يمين الله، وهو يشفع فينا أيضا."]]}, {"l": "Eph 1:20", "n": "", "vs": [[20, "الذي عمله في المسيح، بإقامته له من بين الأموات. وقد أجلسه عن يمينه في الأماكن السماوية،"]]}, {"l": "Col 3:1", "n": "", "vs": [[1, "فبما أنكم قد قمتم مع المسيح، فاسعوا إلى الأمور التي في العلى، حيث المسيح جالس عن يمين الله."]]}, {"l": "Heb 1:3", "n": "", "vs": [[3, "إنه ضياء مجد الله وصورة جوهره. حافظ كل ما في الكون بكلمته القديرة. وهو الذي بعدما طهرنا بنفسه من خطايانا،"]]}, {"l": "Heb 1:13", "n": "", "vs": [[13, "فهل قال الله مرة لأي واحد من الملائكة ما قاله للابن: «اجلس عن يميني حتى أجعل أعداءك موطئا لقدميك؟»"]]}, {"l": "Heb 8:1", "n": "", "vs": [[1, "وخلاصة القول في هذا الموضوع، أن المسيح هو رئيس كهنتنا الذي وصفنا كهنوته هنا. إنه الآن جالس في السماء عن يمين عرش الله العظيم."]]}, {"l": "Heb 10:12", "n": "", "vs": [[12, "ولكن المسيح، رئيس كهنتنا، قدم ذبيحة واحدة عن الخطايا، ثم جلس إلى الأبد عن يمين الله،"]]}, {"l": "Heb 12:2", "n": "", "vs": [[2, "متطلعين دائما إلى يسوع: رائد إيماننا ومكمله. فهو قد تحمل الموت صلبا، هازئا بما في ذلك من عار، إذ كان ينظر إلى السرور الذي ينتظره، ثم جلس عن يمين عرش الله."]]}], "kwAr": "عن يمين الله", "noteAr": ""}, {"kw": "angels", "raw": "Rom_8:38; 1Co_15:24; Eph_1:21", "note": "", "refs": [{"l": "Rom 8:38", "n": "", "vs": [[38, "فإني لعلى يقين بأنه لا الموت ولا الحياة، ولا الملائكة ولا الرياسات، ولا الأمور الحاضرة ولا الآتية، ولا القوات،"]]}, {"l": "1Co 15:24", "n": "", "vs": [[24, "وبعد ذلك الآخرة حين يسلم المسيح الملك لله الآب بعد أن يكون قد أباد كل رئاسة وكل سلطة وكل قوة."]]}, {"l": "Eph 1:21", "n": "", "vs": [[21, "أرفع جدا من كل رئاسة وسلطة وقوة وسيا دة، ومن كل اسم يسمى، لا في هذا العالم وحسب، بل في ذلك الآتي أيضا."]]}], "kwAr": "الملائكة والسلطات والقوات", "noteAr": ""}], "arS": [["الذي ", []], ["انطلق", ["G4198"]], [" إلى ", []], ["السماء", ["G3772"]], ["، وهو ", []], ["الآن", ["G2076"]], [" جالس عن ", []], ["يمين", ["G1188"]], [" ", []], ["الله", ["G2316"]], ["؛ وقد جعلت ", []], ["الملائكة", ["G32"]], [" ", []], ["والسلطات", ["G1849"]], [" ", []], ["والقوات", ["G1411"]], [" (الروحية) ", []], ["خاضعة", ["G5293"]], [" له!", []]]}, {"c": 4, "v": 1, "text": "فبما أن المسيح قد تحمل الآلام الجسمية لأجلكم، سلحوا أنفسكم بالاستعداد دائما لتحمل الآلام. فإن من يتحمل الآلام الجسمية، يكون قد قاطع الخطيئة.", "groups": [{"kw": "Christ", "raw": "1Pe_3:18", "note": "", "refs": [{"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}], "kwAr": "المسيح قد تحمل الآلام", "noteAr": ""}, {"kw": "arm", "raw": "Rom_13:12-14; Phi_2:5; Heb_12:3", "note": "", "refs": [{"l": "Rom 13:12-14", "n": "", "vs": [[12, "كاد الليل أن ينتهي والنهار أن يطلع. فلنطرح أعمال الظلام، ونلبس سلاح النور"], [13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."], [14, "وإنما البسوا الرب يسوع المسيح (تمثلوا به)، ولا تنشغلوا بالتدبير للجسد لقضاء شهواته."]]}, {"l": "Phi 2:5", "n": "", "vs": [[5, "فليكن فيكم هذا الفكر الذي هو أيضا في المسيح يسوع."]]}, {"l": "Heb 12:3", "n": "", "vs": [[3, "فتأملوا مليا ما قاساه بتحمله تلك المعاملة العنيفة التي عامله بها الخاطئون، لكي لا تتعبوا وتنهاروا!"]]}], "kwAr": "سلحوا أنفسكم", "noteAr": ""}, {"kw": "for", "raw": "Rom_6:2, Rom_6:7, Rom_6:11; Gal_2:20, Gal_5:24; Col_3:3-5", "note": "", "refs": [{"l": "Rom 6:2", "n": "", "vs": [[2, "حاشا! فنحن الذين متنا بالنسبة للخطيئة، كيف نعيش بعد فيها؟"]]}, {"l": "Rom 6:7", "n": "", "vs": [[7, "فإن من مات، قد تحرر من الخطيئة."]]}, {"l": "Rom 6:11", "n": "", "vs": [[11, "فكذلك أنتم أيضا، احسبوا أنفسكم أمواتا بالنسبة للخطيئة وأحياء لله في المسيح يسوع."]]}, {"l": "Gal 2:20", "n": "", "vs": [[20, "مع المسيح صلبت، وفيما بعد لا أحيا أنا بل المسيح يحيا في. أما الحياة التي أحياها الآن في الجسد، فإنما أحياها بالإيمان في ابن الله، الذي أحبني وبذل نفسه عني."]]}, {"l": "Gal 5:24", "n": "", "vs": [[24, "ولكن الذين صاروا خاصة للمسيح، قد صلبوا الجسد مع الأهواء والشهوات."]]}, {"l": "Col 3:3-5", "n": "", "vs": [[3, "فإنكم قد متم، وحياتكم مستورة مع المسيح في الله."], [4, "فعندما يظهر المسيح، وهو حياتنا، عندئذ تظهرون أنتم أيضا معه في المجد."], [5, "فأميتوا إذن أعضاءكم الأرضية: الزنى، النجاسة، جموح العاطفة، الشهوة الرديئة، والاشتهاء النهم الذي هو عبادة أصنام."]]}], "kwAr": "من يتحمل الآلام", "noteAr": ""}, {"kw": "ceased", "raw": "Isa_1:16; Eze_16:41; Heb_4:10", "note": "", "refs": [{"l": "Isa 1:16", "n": "", "vs": [[16, "اغتسلوا، تطهروا، أزيلوا شر أعمالكم من أمام عيني. كفوا عن اقتراف الإثم،"]]}, {"l": "Eze 16:41", "n": "", "vs": [[41, "ويحرقون بيوتك بالنار، وينفذون فيك أحكاما على مرأى نساء كثيرات. عندئذ أمنعك عن الزنى ولا تبذلين أجرة بعد للزناة معك."]]}, {"l": "Heb 4:10", "n": "", "vs": [[10, "فالذي يدخل تلك الراحة، يستريح هو أيضا من أعماله، كما استراح الله من أعماله."]]}], "kwAr": "قاطع الخطيئة", "noteAr": ""}], "arS": [["فبما أن ", []], ["المسيح", ["G5547"]], [" قد ", []], ["تحمل الآلام", ["G3958"]], [" الجسمية ", []], ["لأجلكم", ["G5228"]], ["، ", []], ["سلحوا", ["G3695"]], [" ", []], ["أنفسكم", ["G5210"]], [" ", []], ["بالاستعداد", ["G1771"]], [" دائما لتحمل الآلام. فإن من ", []], ["يتحمل الآلام", ["G3958"]], [" ", []], ["الجسمية", ["G4561"]], ["، يكون قد ", []], ["قاطع", ["G3973"]], [" ", []], ["الخطيئة", ["G266"]], [".", []]]}, {"c": 4, "v": 2, "text": "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله.", "groups": [{"kw": "no", "raw": "1Pe_2:1, 1Pe_2:14; Rom_7:4, Rom_14:7; Eph_4:17, Eph_4:22-24, Eph_5:7, Eph_5:8; Col_3:7, Col_3:8; Tit_3:3-8", "note": "", "refs": [{"l": "1Pe 2:1", "n": "", "vs": [[1, "لذلك، تخلصوا من كل أثر للشر والخداع والرياء والحسد والذم."]]}, {"l": "1Pe 2:14", "n": "", "vs": [[14, "وللحكام، باعتبارهم ممثلي الملك الذين يعاقبون المذنبين ويمدحون الصالحين."]]}, {"l": "Rom 7:4", "n": "", "vs": [[4, "وهكذا أنتم أيضا ياإخوتي، فإنكم بجسد المسيح الذي مات، قد صرتم أمواتا بالنسبة للشريعة، لكي تصيروا لآخر، إلى المسيح نفسه الذي أقيم من بين الأموات، من أجل أن نثمر لله."]]}, {"l": "Rom 14:7", "n": "", "vs": [[7, "فلا أحد منا يحيا لنفسه، ولا أحد يموت لنفسه."]]}, {"l": "Eph 4:17", "n": "", "vs": [[17, "أقول هذا إذن، وأشهد في الرب، راجيا ألا تسلكوا فيما بعد كما يسلك الأمم في عقم ذهنهم،"]]}, {"l": "Eph 4:22-24", "n": "", "vs": [[22, "وهو أن تخلعوا ما يتعلق بسيرتكم الماضية: الإنسان العتيق الذي يفسد نفسه بالشهوات الخداعة؛"], [23, "وتتجددوا في روح ذهنكم؛"], [24, "وتلبسوا الإنسان الجديد المخلوق على مثال الله في البر والقداسة بالحق."]]}, {"l": "Eph 5:7", "n": "", "vs": [[7, "إذن، لا تكونوا شركاء لهم:"]]}, {"l": "Eph 5:8", "n": "", "vs": [[8, "فقد كنتم في الماضي ظلاما، ولكنكم الآن نور في الرب. فاسلكوا سلوك أولاد النور."]]}, {"l": "Col 3:7", "n": "", "vs": [[7, "وفيها سلكتم في الماضي، حين كنتم تعيشون فيها."]]}, {"l": "Col 3:8", "n": "", "vs": [[8, "وأما الآن، فانزعوا عنكم، أنتم أيضا، هذه الخطايا كلها: الغضب، النقمة، الخبث، التجديف، الكلام القبيح الخارج من أفواهكم."]]}, {"l": "Tit 3:3-8", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."], [4, "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،"], [5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"], [6, "الذي سكبه علينا بغنى بيسوع المسيح مخلصنا."], [7, "حتى إذا تبررنا بنعمته، نصير ورثة، وفقا لرجائنا بالحياة الأبدية."], [8, "صادق هذا القول! وأريد أن تقرر هذه الأمور قرارا حاسما، حتى يهتم الذين آمنوا بالله بأن يجتهدوا في الأعمال الصالحة. هذه الأمور حسنة ونافعة للناس."]]}], "kwAr": "بقية عمره", "noteAr": ""}, {"kw": "the lusts", "raw": "Hos_6:7 *marg. Mar_7:21; Eph_2:3", "note": "", "refs": [{"l": "Hos 6:7", "n": "*marg.", "vs": [[7, "ولكنكم مثل آدم، نقضتم عهدي وغدرتم بي."]]}, {"l": "Mar 7:21", "n": "", "vs": [[21, "فإنه من الداخل، من قلوب الناس، تنبع الأفكار الشريرة، الفسق، السرقة، القتل،"]]}, {"l": "Eph 2:3", "n": "", "vs": [[3, "الذين بينهم نحن أيضا كنا نسلك سابقا في شهوات جسدنا، عاملين ما يريده الجسد والأفكار، وكنا بالطبيعة أولاد الغضب كالآخرين أيضا."]]}], "kwAr": "شهوات الناس", "noteAr": ""}, {"kw": "the will", "raw": "1Pe_2:15; Psa_143:10; Mat_7:21, Mat_12:50, Mat_21:31; Mar_3:35; Joh_1:13, Joh_7:17; Rom_6:11, Rom_12:2; 2Co_5:15; Gal_2:19, Gal_2:20; Eph_5:17, Eph_6:6; Col_1:9, Col_4:12; 1Th_5:18; Heb_13:21; Jam_1:18; 1Jo_2:17", "note": "", "refs": [{"l": "1Pe 2:15", "n": "", "vs": [[15, "فإن هذه هي إرادة الله: أن تفعلوا الخير دائما، فتفحموا جهالة الناس الأغبياء!"]]}, {"l": "Psa 143:10", "n": "", "vs": [[10, "علمني أن أعمل ما يرضيك لأنك أنت إلهي، وليهدني روحك الصالح إلى أرض مستوية."]]}, {"l": "Mat 7:21", "n": "", "vs": [[21, "ليس كل من يقول لي: يارب، يارب! يدخل ملكوت السماوات، بل من يعمل بإرادة أبي الذي في السماوات."]]}, {"l": "Mat 12:50", "n": "", "vs": [[50, "لأن كل من يعمل بإرادة أبي الذي في السماوات هو أخي وأختي وأمي ! »"]]}, {"l": "Mat 21:31", "n": "", "vs": [[31, "فأي الاثنين عمل بإرادة الأب؟» فقالوا: «الأول!» فقال لهم يسوع: «الحق أقول لكم: إن جباة الضرائب والزانيات سيسبقونكم في الدخول إلى ملكوت الله."]]}, {"l": "Mar 3:35", "n": "", "vs": [[35, "لأن من يعمل بإرادة الله هو أخي وأختي وأمي! »"]]}, {"l": "Joh 1:13", "n": "", "vs": [[13, "وهم الذين ولدوا ليس من دم، ولا من رغبة جسد، ولا من رغبة بشر، بل من الله."]]}, {"l": "Joh 7:17", "n": "", "vs": [[17, "ومن أراد أن يعمل مشيئة الله يعرف ما إذا كان تعليمي من عند الله، أو أنني أتكلم من عندي."]]}, {"l": "Rom 6:11", "n": "", "vs": [[11, "فكذلك أنتم أيضا، احسبوا أنفسكم أمواتا بالنسبة للخطيئة وأحياء لله في المسيح يسوع."]]}, {"l": "Rom 12:2", "n": "", "vs": [[2, "ولا تتكيفوا مع هذا العالم، بل تغيروا بتجديد الذهن، لتميزوا ما هي إرادة الله الصالحة المقبولة الكاملة."]]}, {"l": "2Co 5:15", "n": "", "vs": [[15, "وهو قد مات عوضا عن الجميع حتى لا يعيش الأحياء في ما بعد لأنفسهم بل للذي مات عوضا عنهم ثم قام."]]}, {"l": "Gal 2:19", "n": "", "vs": [[19, "فإنني، بالشريعة، قد مت عن الشريعة، لكي أحيا لله."]]}, {"l": "Gal 2:20", "n": "", "vs": [[20, "مع المسيح صلبت، وفيما بعد لا أحيا أنا بل المسيح يحيا في. أما الحياة التي أحياها الآن في الجسد، فإنما أحياها بالإيمان في ابن الله، الذي أحبني وبذل نفسه عني."]]}, {"l": "Eph 5:17", "n": "", "vs": [[17, "لذلك لا تكونوا أغبياء، بل افهموا ما هي مشيئة الرب."]]}, {"l": "Eph 6:6", "n": "", "vs": [[6, "غير عاملين بجد فقط حين تكون عيونهم عليكم كمن يحاول إرضاء الناس، بل انطلاقا من كونكم عبيدا للمسيح،"]]}, {"l": "Col 1:9", "n": "", "vs": [[9, "لذلك نحن أيضا، من اليوم الذي فيه سمعنا بأخباركم، مازلنا نصلي ونتضرع لأجلكم، لأن تمتلئوا من تمام المعرفة لمشيئة الله في كل حكمة وإدراك روحي،"]]}, {"l": "Col 4:12", "n": "", "vs": [[12, "يسلم عليكم أبفراس الذي هو منكم، وهو عبد للمسيح يسوع، يجاهد كل حين لأجلكم في الصلوات لتثبتوا كاملين ولكم تمام اليقين من جهة مشيئة الله كلها."]]}, {"l": "1Th 5:18", "n": "", "vs": [[18, "ارفعوا الشكر في كل حال: فهذه هي مشيئة الله لكم في المسيح يسوع."]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}, {"l": "Jam 1:18", "n": "", "vs": [[18, "وهو قد شاء أن يجعلنا أولادا له، فولدنا بكلمته، كلمة الحق. وغايته أن نكون باكورة خليقته."]]}, {"l": "1Jo 2:17", "n": "", "vs": [[17, "وسوف يزول العالم، وما فيه من شهوات أما الذي يعمل بإرادة الله، فيبقى إلى الأبد!"]]}], "kwAr": "لإرادة الله", "noteAr": ""}], "arS": [["وغايته أن ", []], ["يعيش", ["G980"]], [" ", []], ["بقية", ["G1954"]], [" ", []], ["عمره", ["G5550"]], [" في ", []], ["الجسد", ["G4561"]], ["، منقادا لا ", []], ["لشهوات", ["G1939"]], [" ", []], ["الناس", ["G444"]], ["، بل ", []], ["لإرادة", ["G2307"]], [" ", []], ["الله", ["G2316"]], [".", []]]}, {"c": 4, "v": 3, "text": "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة.", "groups": [{"kw": "the time", "raw": "Eze_44:6, Eze_45:9; Act_17:30; Rom_8:12, Rom_8:13; 1Co_6:11", "note": "", "refs": [{"l": "Eze 44:6", "n": "", "vs": [[6, "وقل للمتمردين، لشعب إسرائيل، هذا ما يعلنه السيد الرب: يكفيكم جميع رجاساتكم يا شعب إسرائيل،"]]}, {"l": "Eze 45:9", "n": "", "vs": [[9, "وهذا ما يعلنه السيد الرب، حسبكم يارؤساء إسرائيل، توقفوا عن الظلم والاغتصاب، واحكموا بالحق والإنصاف، وكفوا عن ظلم شعبي يقول السيد الرب."]]}, {"l": "Act 17:30", "n": "", "vs": [[30, "فالله الآن يدعو جميع الناس في كل مكان أن يرجعوا إليه تائبين، وقد غض النظر عن أزمنة الجهل التي مرت،"]]}, {"l": "Rom 8:12", "n": "", "vs": [[12, "فليس علينا إذن، أيها الإخوة، أي التزام نحو الجسد لنعيش بحسب الجسد."]]}, {"l": "Rom 8:13", "n": "", "vs": [[13, "لأنه إن عشتم بحسب الجسد، فإنكم ستموتون، ولكن إن كنتم بالروح تميتون أعمال الجسد، فستحيون."]]}, {"l": "1Co 6:11", "n": "", "vs": [[11, "وهكذا كان بعضكم، إلا أنكم قد اغتسلتم، بل تقدستم، بل تبررتم، باسم الرب يسوع المسيح وبروح إلهنا."]]}], "kwAr": "الزمان الماضي", "noteAr": ""}, {"kw": "to have", "raw": "1Pe_1:14; Deu_12:30,Deu_12:31; Rom_1:20-32; Eph_2:2, Eph_2:3, Eph_4:17; 1Th_4:5; Tit_3:3", "note": "", "refs": [{"l": "1Pe 1:14", "n": "", "vs": [[14, "وبما أنكم صرتم أولادا لله مطيعين له، فلا تعودوا إلى مجاراة الشهوات التي كانت تسيطر عليكم سابقا في أيام جهلكم."]]}, {"l": "Deu 12:30", "n": "", "vs": [[30, "فاحذروا من الوقوع في الشرك، باتباع عباداتهم من بعد فنائهم من أمامكم، ومن ممارسة مراسيم عبادة آلهتهم قائلين: كما عبد هؤلاء الأمم آلهتهم هكذا نفعل نحن أيضا."]]}, {"l": "Deu 12:31", "n": "", "vs": [[31, "لا تصنع هكذا للرب إلهك، لأنهم قد ارتكبوا في عبادة آلهتهم كل ما يمقته الرب من الأرجاس، إذ أحرقوا بالنار أبناءهم وبناتهم في سبيل آلهتهم،"]]}, {"l": "Rom 1:20-32", "n": "", "vs": [[20, "فإن ما لا يرى من أمور الله، أي قدرته الأزلية وألوهته، ظاهر للعيان منذ خلق العالم، إذ تدركه العقول من خلال المخلوقات. حتى إن الناس باتوا بلا عذر."], [21, "فمع أنهم عرفوا الله ، لم يمجدوه باعتباره الله ، ولا شكروه، بل انحطوا بتفكيرهم إلى الحماقة وصار قلبهم لغباوته مظلما."], [22, "وفيما يدعون أنهم حكماء، صاروا جهالا،"], [23, "واستبدلوا بمجد الله الخالد تماثيل لصور الإنسان الفاني والطيور وذوات الأربع والزواحف."], [24, "لذلك أسلمهم الله ، في شهوات قلوبهم، إلى النجاسة، ليهينوا أجسادهم فيما بينهم."], [25, "إذ قد استبدلوا بحق الله ما هو باطل، فاتقوا المخلوق وعبدوه بدل الخالق، المبارك إلى الأبد. آمين!"], [26, "لهذا السبب أسلمهم الله إلى الشهوات المخزية. فإن إناثهم تحولن عن استعمال أجسادهن بالطريقة الطبيعية إلى استعمالها بطريقة مخالفة للطبيعة."], [27, "وكذلك تحول الذكور أيضا عن استعمال الأنثى بالطريقة الطبيعية، والتهبوا شهوة بعضهم لبعض، مرتكبين الفحشاء ذكورا بذكور، فاستحقوا أن ينالوا في أنفسهم الجزاء العادل على ضلالهم."], [28, "وبما أنهم لم يتخيروا إبقاء الله ضمن معرفتهم، أسلمهم الله إلى ذهن عاطل عن التمييز دفعهم إلى ممارسة الأمور غير اللائقة."], [29, "إذ قد امتلأوا من كل إثم وشر وجشع وخبث، وشحنوا حسدا وقتلا وخصاما ومكرا وسوءا. وهم ثرثارون،"], [30, "مغتابون، كارهون لله، شتامون، متكبرون، متفاخرون، مخترعون للشرور، غير طائعين للوالدين."], [31, "لا فهم عندهم، ولا أمانة، ولا حنان، ولا رحمة."], [32, "إنهم يعلمون حكم الله العادل: أن الذين يفعلون هذه الأمور يستوجبون الموت؛ ومع ذلك، لا يمارسونها وحسب، بل يسرون بفاعليها."]]}, {"l": "Eph 2:2", "n": "", "vs": [[2, "التي كنتم تسلكون فيها حسب مسرى هذا العالم، تابعين رئيس قوات الهواء، ذلك الروح العامل الآن في أبناء العصيان،"]]}, {"l": "Eph 2:3", "n": "", "vs": [[3, "الذين بينهم نحن أيضا كنا نسلك سابقا في شهوات جسدنا، عاملين ما يريده الجسد والأفكار، وكنا بالطبيعة أولاد الغضب كالآخرين أيضا."]]}, {"l": "Eph 4:17", "n": "", "vs": [[17, "أقول هذا إذن، وأشهد في الرب، راجيا ألا تسلكوا فيما بعد كما يسلك الأمم في عقم ذهنهم،"]]}, {"l": "1Th 4:5", "n": "", "vs": [[5, "غير منساق للشهوة الجامحة كالوثنيين الذين لا يعرفون الله ،"]]}, {"l": "Tit 3:3", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."]]}], "kwAr": "سلكتم سلوك الوثنيين", "noteAr": ""}, {"kw": "lasciviousness", "raw": "Mar_7:22; 2Co_12:21; Gal_5:19; Eph_4:19; Jud_1:4", "note": "", "refs": [{"l": "Mar 7:22", "n": "", "vs": [[22, "الزنى، الطمع، الخبث، الخداع، العهارة، العين الشريرة، التجديف، الكبرياء، الحماقة"]]}, {"l": "2Co 12:21", "n": "", "vs": [[21, "وأخشى أن يجعلني إلهي ذليلا بينكم عند مجيئي إليكم مرة أخرى، فيكون حزني شديدا على كثيرين من الذين أخطأوا قبلا ولم يتوبوا عما ارتكبوا من دنس وزنى وفسق!"]]}, {"l": "Gal 5:19", "n": "", "vs": [[19, "أما أعمال الجسد فظاهرة، وهي: الزنى والنجاسة والدعارة،"]]}, {"l": "Eph 4:19", "n": "", "vs": [[19, "فهؤلاء، إذ طرحوا جانبا كل إحساس، استسلموا للإباحية ليرتكبوا كل نجاسة بشهوة نهمة لا ترتوي."]]}, {"l": "Jud 1:4", "n": "", "vs": [[4, "لأنه قد تسلل إلى ما بينكم معلمون لابد أن يلاقوا الحكم بالعقاب الأبدي، كما هو مكتوب لهم منذ القديم. فهم أشرار لا يهابون الله ، يتخذون من نعمة إلهنا فرصة لإباحة الرذائل، وينكرون سيدنا وربنا الوحيد يسوع المسيح."]]}], "kwAr": "الدعارة", "noteAr": ""}, {"kw": "excess", "raw": "2Sa_13:28; Pro_23:29-35; Isa_5:11, Isa_28:7; Eph_5:18", "note": "", "refs": [{"l": "2Sa 13:28", "n": "", "vs": [[28, "وأوصى أبشالوم رجاله: «متى ذهبت الخمر بعقل أمنون وقلت لكم اضربوا أمنون واقتلوه، فلا تخافوا. ألست أنا الذي أمرتكم بذلك؟ تشجعوا وتصرفوا كأبطال»."]]}, {"l": "Pro 23:29-35", "n": "", "vs": [[29, "لمن المعاناة؟ لمن الويل والشقاء والمخاصمات والشكوى؟ لمن الجر اح بلا سبب؟ ولمن احمرار العينين؟"], [30, "إنها للمدمنين الخمر، الساعين وراء المسكر الممزوج."], [31, "لا تنظر إلى الخمر إذا التهبت بالاحمرار، وتألقت في الكأس، وسالت سائغة،"], [32, "فإنها في آخرها تلسع كالحية وتلدغ كالأفعوان."], [33, "فتشاهد عيناك أمورا غريبة، وقلبك يحدثك بأشياء ملتوية،"], [34, "فتكون مترنحا كمن يضطجع في وسط عباب البحر، أو كراقد على قمة سارية!"], [35, "فتقول: «ضر بوني ولكن لم أتوجع. لكموني فلم أشعر، فمتى أستيقظ؟ سأذهب ألتمس شربها مرة أخرى»."]]}, {"l": "Isa 5:11", "n": "", "vs": [[11, "ويل لمن ينهضون في الصباح مبكرين يسعون وراء المسكر حتى ساعة متأخرة من الليل إلى أن تلهبهم الخمر."]]}, {"l": "Isa 28:7", "n": "", "vs": [[7, "ولكن هؤلاء أيضا أضلتهم الخمر وترنحوا بالسكر، فسلب المسكر عقول أنبيائهم وكهنتهم، فأربكهم ورنحهم، فأخطأوا الرؤيا، وتعثروا في الأحكام."]]}, {"l": "Eph 5:18", "n": "", "vs": [[18, "لا تسكروا بالخمر، ففيها الخلاعة، وإنما امتلئوا بالروح،"]]}], "kwAr": "إدمان الخمر", "noteAr": ""}, {"kw": "revellings", "raw": "Gal_5:21", "note": "", "refs": [{"l": "Gal 5:21", "n": "", "vs": [[21, "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!"]]}], "kwAr": "حفلات السكر", "noteAr": ""}, {"kw": "and", "raw": "1Ki_21:26; 2Ch_15:8; Isa_65:4; Jer_16:18; Rev_17:4, Rev_17:5", "note": "", "refs": [{"l": "1Ki 21:26", "n": "", "vs": [[26, "فقد غرق في حمأة الرجاسة بعبادته الأصنام، مثلما فعل الأموريون الذين طردهم الرب من أمام بني إسرائيل."]]}, {"l": "2Ch 15:8", "n": "", "vs": [[8, "فلما سمع آسا كلام نبوءة عوديد النبي تقوى وأزال الرجاسات من كل أرض يهوذا وبنيامين، ومن المدن التي استولى عليها من جبل أفرايم، وجدد مذبح الرب القائم أمام رواق هيكل الرب."]]}, {"l": "Isa 65:4", "n": "", "vs": [[4, "يجلس بين المقابر ويبيت الليل في أماكن سرية، ويأكل لحم الخنزير، وفي أوانيه مرق لحوم نجسة."]]}, {"l": "Jer 16:18", "n": "", "vs": [[18, "فأعاقبهم عقابا مضاعفا على إثمهم، لأنهم دنسوا أرضي بجثث أصنامهم، وملأوا ميراثي بنجاساتهم»."]]}, {"l": "Rev 17:4", "n": "", "vs": [[4, "وكانت المرأة تلبس ملابس من أرجوان وقرمز، وتتحلى بالذهب والحجارة الكريمة واللؤلوء، وقد أمسكت كأس ذهب مملوءة بزناها المكروه النجس،"]]}, {"l": "Rev 17:5", "n": "", "vs": [[5, "وعلى جبينها اسم مكتوب: سر: «بابل العظمى، أم زانيات الأرض وأصنامها المكروهة»."]]}], "kwAr": "عبادة الأصنام المحرمة", "noteAr": ""}], "arS": [["كفاكم", ["G713"]], [" ذلك ", []], ["الزمان", ["G5550"]], [" ", []], ["الماضي", ["G3928"]], [" من ", []], ["حياتكم", ["G979"]], ["، لتكونوا قد ", []], ["سلكتم", ["G2716"]], [" سلوك ", []], ["الوثنيين", ["G1484"]], ["، حين كنتم ", []], ["تعيشون", ["G4198"]], [" في ", []], ["الدعارة", ["G766"]], [" ", []], ["والشهوات", ["G1939"]], [" ", []], ["وإدمان الخمر", ["G3632"]], ["، ", []], ["وحفلات السكر", ["G4224"]], [" ", []], ["والعربدة", ["G2970"]], ["، وعبادة ", []], ["الأصنام", ["G1495"]], [" ", []], ["المحرمة", ["G111"]], [".", []]]}, {"c": 4, "v": 4, "text": "ورفاقكم في تلك العيشة سابقا يستغربون أنكم لا تركضون معهم إلى فيض هذه الخلاعة، ويجرحون سمعتكم.", "groups": [{"kw": "excess", "raw": "Mat_23:25; Luk_15:13; Rom_13:13; 2Pe_2:22", "note": "", "refs": [{"l": "Mat 23:25", "n": "", "vs": [[25, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تنظفون الكأس والصحفة من الخارج، ولكنهما من الداخل ممتلئتان بما كسبتم بالنهب والطمع!"]]}, {"l": "Luk 15:13", "n": "", "vs": [[13, "وبعد بضعة أيام، جمع الابن الأصغر كل ما عنده، ومضى إلى بلد بعيد. وهنالك بذر حصته من المال في عيشة الخلاعة."]]}, {"l": "Rom 13:13", "n": "", "vs": [[13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."]]}, {"l": "2Pe 2:22", "n": "", "vs": [[22, "وينطبق على هؤلاء ما يقوله المثل الصادق: «عاد الكلب إلى تناول ما تقيأه، والخنزيرة المغتسلة إلى التمرغ في الوحل!»"]]}], "kwAr": "فيض هذه الخلاعة", "noteAr": ""}, {"kw": "speaking", "raw": "1Pe_2:12, 1Pe_3:16; Act_13:45, Act_18:6; 2Pe_2:12; Jud_1:10", "note": "", "refs": [{"l": "1Pe 2:12", "n": "", "vs": [[12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالحة يمجدون الله في يوم الافتقاد."]]}, {"l": "1Pe 3:16", "n": "", "vs": [[16, "على أن تفعلوا ذلك بوداعة واحترام، محافظين على طهارة ضمائركم، سالكين في المسيح سلوكا صالحا، وعندئذ يخيب الذين يوجهون إليكم التهم الكاذبة ويشتمونكم كأنكم تفعلون شرا."]]}, {"l": "Act 13:45", "n": "", "vs": [[45, "فلما رأى اليهود الجموع ملأت الغيرة صدورهم، وأخذوا يعارضون كلام بولس مجدفين."]]}, {"l": "Act 18:6", "n": "", "vs": [[6, "ولكنهم عارضوا شهادته وأخذوا يجدفون. فما كان منه إلا أن نفض ثوبه وقال لهم: «دمكم على رؤوسكم. أنا بريء! ومنذ الآن أتوجه لتبشير غير اليهود»."]]}, {"l": "2Pe 2:12", "n": "", "vs": [[12, "حقا إن هؤلاء المعلمين الدجالين الذين يتكلمون كلاما مهينا في أمور يجهلونها، يشبهون الحيوانات المفترسة غير العاقلة، المولودة ليصطادها الناس ويقتلوها. فلابد أن يهلكوا مثلها."]]}, {"l": "Jud 1:10", "n": "", "vs": [[10, "ولكن هؤلاء المعلمين يتكلمون كلاما مهينا على أمور لا يعرفونها. وأما ما يفهمونه بالغريزة، كالحيوانات غير العاقلة، فإنهم به يدمرون أنفسهم."]]}], "kwAr": "يجرحون سمعتكم", "noteAr": ""}], "arS": [["ورفاقكم في تلك العيشة سابقا ", []], ["يستغربون", ["G3579"]], [" أنكم لا ", []], ["تركضون معهم", ["G4936"]], [" إلى ", []], ["فيض", ["G401"]], [" هذه ", []], ["الخلاعة", ["G810"]], ["، ", []], ["ويجرحون سمعتكم", ["G987"]], [".", []]]}, {"c": 4, "v": 5, "text": "لكنهم سوف يؤدون الحساب أمام المسيح، المستعد أن يدين الأحياء والأموات.", "groups": [{"kw": "shall", "raw": "Mal_3:13-15; Mat_12:36; Luk_16:2; Rom_14:12; Jud_1:14, Jud_1:15", "note": "", "refs": [{"l": "Mal 3:13-15", "n": "", "vs": [[13, "لقد قسوتم في كلامكم علي يقول الرب، ومع ذلك تقولون: بماذا تكلمنا ضدك؟"], [14, "لقد قلتم: من العبث عبادة الله، وأي جدوى من حفظنا شعائره، والنواح أمام حضرة الرب القدير؟"], [15, "وها نحن الآن نغبط المستكبرين، ونرى فاعلي الشر يزدهرون، بل إنهم تحدوا الله ونجوا."]]}, {"l": "Mat 12:36", "n": "", "vs": [[36, "على أني أقول لكم: إن كل كلمة باطلة يتكلم بها الناس، سوف يؤدون عنها الحساب في يوم الدينونة."]]}, {"l": "Luk 16:2", "n": "", "vs": [[2, "فاستدعاه وسأله: ما هذا الذي أسمع عنك؟ قدم حساب وكالتك، فإنك لا يمكن أن تكون وكيلا لي بعد!"]]}, {"l": "Rom 14:12", "n": "", "vs": [[12, "إذا، كل واحد منا سيؤدي حسابا عن نفسه لله."]]}, {"l": "Jud 1:14", "n": "", "vs": [[14, "عن هؤلاء وأمثالهم، تنبأ أخنوخ السابع بعد آدم، فقال: «انظروا إن الرب آت بصحبة عشرات الألوف من قديسيه،"]]}, {"l": "Jud 1:15", "n": "", "vs": [[15, "ليدين جميع الناس، ويوبخ جميع الأشرار الذين لا يهابون الله ، بسبب جميع أعمالهم الشريرة التي ارتكبوها وجميع أقوالهم القاسية التي أهانوه بها والتي لا تصدر إلا عن الخاطئين الأشرار غير الأتقياء!»"]]}], "kwAr": "يؤدون الحساب", "noteAr": ""}, {"kw": "that", "raw": "Psa_1:6; Ecc_12:14; Eze_18:30; Matt. 25:31-46; Joh_5:22, Joh_5:23, Joh_5:28, Joh_5:29; Act_10:42, Act_17:31; Rom_14:10-12; 1Co_15:51, 1Co_15:52; 2Ti_4:1; Jam_5:9", "note": "", "refs": [{"l": "Psa 1:6", "n": "", "vs": [[6, "لأن الرب يحفظ طريق الأبرار، أما طريق الأشرار فمصيرها الهلاك."]]}, {"l": "Ecc 12:14", "n": "", "vs": [[14, "لأن الله سيدين كل عمل مهما كان خفيا، سواء كان خيرا أم شرا."]]}, {"l": "Eze 18:30", "n": "", "vs": [[30, "لذلك أدينكم ياشعب إسرائيل، كل واحد بمقتضى طرقه، يقول السيد الرب. توبوا وارجعوا عن ذنوبكم كلها، فلا يكون لكم الإثم معثرة هلاك."]]}, {"l": "Mat 25:31-46", "n": "", "vs": [[31, "وعندما يعود ابن الإنسان في مجده ومعه جميع ملائكته، فإنه يجلس على عرش مجده،"], [32, "وتجتمع أمامه الشعوب كلها، فيفصل بعضهم عن بعض كما يفصل الراعي الغنم عن المعاز،"], [33, "فيوقف الغنم عن يمينه، والمعاز عن يساره؛"], [34, "ثم يقول الملك للذين عن يمينه: تعالوا يامن باركهم أبي، رثوا الملكوت الذي أعد لكم منذ إنشاء العالم:"], [35, "لأني جعت فأطعمتموني، عطشت فسقيتموني، كنت غريبا فآويتموني،"], [36, "عريانا فكسوتموني، مريضا فزرتموني، سجينا فأتيتم إلي!"], [37, "فيرد الأبرار قائلين: يارب، متى رأيناك جائعا فأطعمناك، أو عطشانا فسقيناك؟"], [38, "ومتى رأيناك غريبا فآويناك، أو عريانا فكسوناك؟"], [39, "ومتى رأيناك مريضا أو سجينا فزرناك؟"], [40, "فيجيبهم الملك: الحق أقول لكم: بما أنكم فعلتم ذلك بأحد إخوتي هؤلاء الصغار، فبي فعلتم!"], [41, "ثم يقول للذين عن يساره: ابتعدوا عني ياملاعين إلى النار الأبدية المعدة لإبليس وأعوانه!"], [42, "لأني جعت فلم تطعموني، وعطشت فلم تسقوني،"], [43, "كنت غريبا فلم تأووني، عريانا فلم تكسوني، مريضا وسجينا فلم تزوروني!"], [44, "فيرد هؤلاء أيضا قائلين: يارب، متى رأيناك جائعا أو عطشانا أو غريبا أو عريانا أو مريضا أو سجينا، ولم نخدمك؟"], [45, "فيجيبهم: الحق أقول لكم: بما أنكم لم تفعلوا ذلك بأحد إخوتي هؤلاء الصغار، فبي لم تفعلوا!"], [46, "فيذهب هؤلاء إلى العقاب الأبدي، والأبرار إلى الحياة الأبدية! »"]]}, {"l": "Joh 5:22", "n": "", "vs": [[22, "والآب لا يحاكم أحدا، بل أعطى الابن سلطة القضاء كلها،"]]}, {"l": "Joh 5:23", "n": "", "vs": [[23, "ليكرم الجميع الابن كما يكرمون الآب. ومن لا يكرم الابن لا يكرم الآب الذي أرسله."]]}, {"l": "Joh 5:28", "n": "", "vs": [[28, "لا تتعجبوا من هذا: فسوف تأتي ساعة يسمع فيها جميع من في القبور صوته،"]]}, {"l": "Joh 5:29", "n": "", "vs": [[29, "فيخرجون منها: فالذين عملوا الصالحات يخرجون في القيامة المؤدية إلى الحياة، وأما الذين عملوا السيئات ففي القيامة المؤدية إلى الدينونة."]]}, {"l": "Act 10:42", "n": "", "vs": [[42, "ثم أمرنا أن نبشر شعبنا به، ونشهد أنه هو الذي عينه الله ديانا للأحياء وللأموات."]]}, {"l": "Act 17:31", "n": "", "vs": [[31, "لأنه حدد يوما يدين فيه العالم بالعدل على يد رجل اختاره لذلك. وقد قدم للجميع برهانا، إذ أقامه من بين الأموات»."]]}, {"l": "Rom 14:10-12", "n": "", "vs": [[10, "ولكن، لماذا أنت تدين أخاك؟ وأنت أيضا، لماذا تحتقر أخاك؟ فإننا جميعا سوف نقف أمام عرش الله لنحاسب."], [11, "فإنه قد كتب: «أنا حي، يقول الرب، لي ستنحني كل ركبة، وسيعترف كل لسان لله!»"], [12, "إذا، كل واحد منا سيؤدي حسابا عن نفسه لله."]]}, {"l": "1Co 15:51", "n": "", "vs": [[51, "وها أنا أكشف لكم سرا: إننا لن نرقد جميعا، ولكننا سنتغير جميعا،"]]}, {"l": "1Co 15:52", "n": "", "vs": [[52, "في لحظة، بل في طرفة عين عندما ينفخ في البوق الأخير. فإنه سوف ينفخ في البوق، فيقوم الأموات بلا انحلال. وأما نحن، فسنتغير."]]}, {"l": "2Ti 4:1", "n": "", "vs": [[1, "أطلب منك في حضرة الله والمسيح الذي سيدين الأحياء والأموات، بعودته العلنية وملكوته،"]]}, {"l": "Jam 5:9", "n": "", "vs": [[9, "أيها الإخوة، لا تتذمروا بعضكم على بعض، لكي لا يصدر الحكم ضدكم. تذكروا دائما أن الديان قريب جدا، إنه أمام الباب."]]}], "kwAr": "المستعد أن يدين", "noteAr": ""}], "arS": [["لكنهم سوف ", []], ["يؤدون", ["G591"]], [" ", []], ["الحساب", ["G3056"]], [" أمام المسيح، ", []], ["المستعد", ["G2093"]], [" أن ", []], ["يدين", ["G2919"]], [" ", []], ["الأحياء", ["G2198"]], [" ", []], ["والأموات", ["G3498"]], [".", []]]}, {"c": 4, "v": 6, "text": "ولهذا أبلغت البشارة إلى الأموات أيضا لكي يكونوا دائما أحياء بالروح في نظر الله، مع أن حكم الموت قد نفذ بأجسادهم، فماتوا كغيرهم من الناس.", "groups": [{"kw": "to them", "raw": "1Pe_3:19; Joh_5:25, Joh_5:26", "note": "", "refs": [{"l": "1Pe 3:19", "n": "", "vs": [[19, "بهذا الروح نفسه، ذهب قديما وبشر الناس الذين أصبحت أرواحهم الآن في السجن."]]}, {"l": "Joh 5:25", "n": "", "vs": [[25, "الحق الحق أقول لكم: إن الساعة التي يسمع فيها الأموات صوت ابن الله ستأتي بل هي الآن والذين يسمعونه يحيون."]]}, {"l": "Joh 5:26", "n": "", "vs": [[26, "لأنه كما أن للآب حياة في ذاته، فقد أعطى الابن أيضا أن تكون له حياة في ذاته،"]]}], "kwAr": "أبلغت البشارة إلى الأموات", "noteAr": ""}, {"kw": "that they", "raw": "1Pe_4:1, 1Pe_4:2; Mat_24:9; Rom_8:9-11; 1Co_11:31, 1Co_11:32", "note": "", "refs": [{"l": "1Pe 4:1", "n": "", "vs": [[1, "فبما أن المسيح قد تحمل الآلام الجسمية لأجلكم، سلحوا أنفسكم بالاستعداد دائما لتحمل الآلام. فإن من يتحمل الآلام الجسمية، يكون قد قاطع الخطيئة."]]}, {"l": "1Pe 4:2", "n": "", "vs": [[2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."]]}, {"l": "Mat 24:9", "n": "", "vs": [[9, "عندئذ يسلمكم الناس إلى العذاب، ويقتلونكم، وتكونون مكروهين لدى جميع الأمم من أجل اسمي؛"]]}, {"l": "Rom 8:9-11", "n": "", "vs": [[9, "وأما أنتم، فلستم تحت سلطة الجسد بل تحت سلطة الروح، إذا كان روح الله ساكنا في داخلكم حقا. ولكن، إن كان أحد ليس له روح المسيح، فهو ليس للمسيح."], [10, "وإذا كان المسيح فيكم، فمع أن الجسد مائت بسبب الخطيئة، فإن الروح حياة لكم بسبب البر."], [11, "وإذا كان روح الذي أقام يسوع من بين الأموات يسكن فيكم، فإن الذي أقام المسيح من بين الأموات سوف يحيي أيضا أجسادكم الفانية بسبب روحه الذي يسكن فيكم."]]}, {"l": "1Co 11:31", "n": "", "vs": [[31, "فلو كنا حكمنا على نفوسنا، لما كان حكم علينا."]]}, {"l": "1Co 11:32", "n": "", "vs": [[32, "ولكن، ما دام قد حكم علينا، فإننا نؤدب من قبل الرب حتى لا ندان مع العالم."]]}], "kwAr": "حكم الموت قد نفذ بأجسادهم", "noteAr": ""}, {"kw": "but", "raw": "Rom_8:2; Gal_2:19, Gal_5:25; Eph_2:3-5; Tit_3:3-7; Rev_14:18", "note": "", "refs": [{"l": "Rom 8:2", "n": "", "vs": [[2, "لأن ناموس روح الحياة في المسيح يسوع قد حررني من ناموس الخطيئة ومن الموت."]]}, {"l": "Gal 2:19", "n": "", "vs": [[19, "فإنني، بالشريعة، قد مت عن الشريعة، لكي أحيا لله."]]}, {"l": "Gal 5:25", "n": "", "vs": [[25, "إذا كنا نحيا بالروح، فلنسلك أيضا بالروح."]]}, {"l": "Eph 2:3-5", "n": "", "vs": [[3, "الذين بينهم نحن أيضا كنا نسلك سابقا في شهوات جسدنا، عاملين ما يريده الجسد والأفكار، وكنا بالطبيعة أولاد الغضب كالآخرين أيضا."], [4, "أما الله ، وهو غني في الرحمة، فبسبب محبته العظيمة التي أحبنا بها،"], [5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"]]}, {"l": "Tit 3:3-7", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."], [4, "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،"], [5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"], [6, "الذي سكبه علينا بغنى بيسوع المسيح مخلصنا."], [7, "حتى إذا تبررنا بنعمته، نصير ورثة، وفقا لرجائنا بالحياة الأبدية."]]}, {"l": "Rev 14:18", "n": "", "vs": [[18, "ومن المذبح خرج ملاك آخر له السلطة على النار، ونادى بصوت عظيم الملاك الذي يمسك المنجل الحاد: «أرسل منجلك الحاد واقطف عناقيد كرم الأرض لأن عنبها قد نضج»."]]}], "kwAr": "أحياء بالروح", "noteAr": ""}], "arS": [["ولهذا ", []], ["أبلغت البشارة", ["G2097"]], [" إلى ", []], ["الأموات", ["G3498"]], [" أيضا لكي يكونوا دائما ", []], ["أحياء", ["G2198"]], [" ", []], ["بالروح", ["G4151"]], [" في نظر ", []], ["الله", ["G2316"]], ["، مع أن ", []], ["حكم", ["G2919"]], [" الموت قد نفذ ", []], ["بأجسادهم", ["G4561"]], ["، فماتوا كغيرهم من ", []], ["الناس", ["G444"]], [".", []]]}, {"c": 4, "v": 7, "text": "إن نهاية كل شيء قد صارت قريبة. فتعقلوا إذن، وكونوا متنبهين لرفع الصلاة دائما.", "groups": [{"kw": "the end", "raw": "Ecc_7:2; Jer_5:31; Eze_7:2, Eze_7:3, Eze_7:6; Mat_24:13, Mat_24:14; Rom_13:12; 1Co_7:29; 1Co_15:24; Phi_4:5; Heb_10:25; Jam_5:8, Jam_5:9; 2Pe_3:9-11; 1Jo_2:18, 1Jo_2:19", "note": "", "refs": [{"l": "Ecc 7:2", "n": "", "vs": [[2, "الذهاب إلى بيت النوح خير من الحضور إلى بيت الوليمة، لأن الموت هو مصير كل إنسان. وهذا ما يحتفظ به الحي في قلبه."]]}, {"l": "Jer 5:31", "n": "", "vs": [[31, "فالأنبياء يتنبأون زورا، والكهنة يتصرفون بمقتضى أحكامهم، وشعبي أحب مثل هذا. ولكن ماذا تصنعون في نهاية المطاف؟»"]]}, {"l": "Eze 7:2", "n": "", "vs": [[2, "«ياابن آدم، هذا ما يعلنه الرب لأرض إسرائيل. النهاية قد أزفت على زوايا الأرض الأربع."]]}, {"l": "Eze 7:3", "n": "", "vs": [[3, "قد أقبلت النهاية عليك، فأطلق غضبي عليك وأدينك بمقتضى طرقك، وأجازيك على كل رجاساتك ياأرض إسرائيل،"]]}, {"l": "Eze 7:6", "n": "", "vs": [[6, "قد أزفت النهاية قد أزفت النهاية. انتبهت لك، وها هي مقبلة."]]}, {"l": "Mat 24:13", "n": "", "vs": [[13, "ولكن الذي يثبت حتى النهاية، فهو يخلص."]]}, {"l": "Mat 24:14", "n": "", "vs": [[14, "فسوف ينادى ببشارة الملكوت هذه في العالم كله، شهادة لي لدى الأمم جميعا. وبعد ذلك تأتي النهاية."]]}, {"l": "Rom 13:12", "n": "", "vs": [[12, "كاد الليل أن ينتهي والنهار أن يطلع. فلنطرح أعمال الظلام، ونلبس سلاح النور"]]}, {"l": "1Co 7:29", "n": "", "vs": [[29, "فإني، أيها الإخوة، أقول لكم إن الوقت يتقاصر. ففي ما يخص المسائل الأخرى، ليكن الذين لهم زوجات كأنهم بلا زوجات،"]]}, {"l": "1Co 15:24", "n": "", "vs": [[24, "وبعد ذلك الآخرة حين يسلم المسيح الملك لله الآب بعد أن يكون قد أباد كل رئاسة وكل سلطة وكل قوة."]]}, {"l": "Phi 4:5", "n": "", "vs": [[5, "ليكن طول بالكم معروفا لدى الناس جميعا. إن الرب قريب."]]}, {"l": "Heb 10:25", "n": "", "vs": [[25, "وعلينا ألا ننقطع عن الاجتماع معا، كما تعود بعضكم أن يفعل. إنما، يجدر بكم أن تحثوا وتشجعوا بعضكم بعضا، وتواظبوا على هذا بقدر ما ترون ذلك اليوم يقترب."]]}, {"l": "Jam 5:8", "n": "", "vs": [[8, "فاصبروا أنتم إذن، وشددوا قلوبكم لأن عودة الرب قد صارت قريبة."]]}, {"l": "Jam 5:9", "n": "", "vs": [[9, "أيها الإخوة، لا تتذمروا بعضكم على بعض، لكي لا يصدر الحكم ضدكم. تذكروا دائما أن الديان قريب جدا، إنه أمام الباب."]]}, {"l": "2Pe 3:9-11", "n": "", "vs": [[9, "فالرب، إذن، لا يبطيء في إتمام وعده، كما يظن بعض الناس، ولكنه يتأنى عليكم، فهو لا يريد لأحد من الناس أن يهلك، بل يريد لجميع الناس أن يرجعوا إليه تائبين."], [10, "إلا أن «يوم الرب» سيأتي كما يأتي اللص في الليل. في ذلك اليوم، تزول السماوات محدثة دويا هائلا وتنحل العناصر محترقة بنار شديدة، وتحترق الأرض وما فيها من منجزات."], [11, "ومادامت هذه الأشياء جميعا ستنحل، فكيف يجب أن تكونوا أنتم أصحاب سلوك مقدس يتصف بالتقوى،"]]}, {"l": "1Jo 2:18", "n": "", "vs": [[18, "أيها الأولاد، اعلموا أننا نعيش الآن في الزمن الأخير. وكما سمعتم أنه سوف يأتي أخيرا «مسيح دجال»، فقد ظهر حتى الآن كثيرون من الدجالين المقاومين للمسيح. من هنا نتأكد أننا نعيش في الزمن الأخير."]]}, {"l": "1Jo 2:19", "n": "", "vs": [[19, "هؤلاء الدجالون انفصلوا عنا، لكنهم في الواقع لم يكونوا منا. ولو كانوا منا لظلوا معنا. فانفصالهم عنا إذن برهان على أنهم جميعا ليسوا منا."]]}], "kwAr": "نهاية كل شيء", "noteAr": ""}, {"kw": "ye", "raw": "1Pe_1:13, 1Pe_5:8; 1Th_5:6-8; Tit_2:12", "note": "", "refs": [{"l": "1Pe 1:13", "n": "", "vs": [[13, "لذلك اجعلوا أذهانكم متنبهة دائما، وتيقظوا، وعلقوا رجاءكم كله على النعمة التي ستكون من نصيبكم عندما يعود يسوع المسيح ظاهرا بمجده!"]]}, {"l": "1Pe 5:8", "n": "", "vs": [[8, "تعقلوا وتنبهوا. إن خصمكم إبليس كأسد يزأر، يجول باحثا عن فريسة يبتلعها."]]}, {"l": "1Th 5:6-8", "n": "", "vs": [[6, "إذن، لا ننم كما ينام الآخرون، بل لنظل ساهرين وصاحين،"], [7, "فإنه في الليل ينام الذين ينامون، وفي الليل يسكر الذين يسكرون"], [8, "وأما نحن، أهل النهار، فلنظل صاحين، متخذين من الإيمان والمحبة درعا لصدورنا، ومن الرجاء بالخلاص خوذة لرؤوسنا."]]}, {"l": "Tit 2:12", "n": "", "vs": [[12, "وهي تعلمنا أن نقطع علاقتنا بالإباحية والشهوات العالمية، وأن نحيا في العصر الحاضر حياة التعقل والبر والتقوى،"]]}], "kwAr": "فتعقلوا", "noteAr": ""}, {"kw": "and", "raw": "1Pe_3:7; Mat_24:42, Mat_25:13, Mat_26:38-41; Mar_13:33-37, Mar_14:37, Mar_14:38; Luk_21:34, Luk_21:36; Luk_22:46; Rom_12:12; Eph_6:18; Col_4:2; 2Ti_4:5; Rev_16:15", "note": "", "refs": [{"l": "1Pe 3:7", "n": "", "vs": [[7, "وأنتم، أيها الأزواج، إذ تساكنون زوجاتكم عالمين بأنهن أضعف منكم، أكرموهن باعتبارهن شريكات لكم في وراثة نعمة الحياة، لكي لا يعوق صلواتكم شيء."]]}, {"l": "Mat 24:42", "n": "", "vs": [[42, "فاسهروا إذن، لأنكم لا تعرفون في أية ساعة يرجع ربكم."]]}, {"l": "Mat 25:13", "n": "", "vs": [[13, "فاسهروا إذن، لأنكم لا تعرفون اليوم ولا الساعة!"]]}, {"l": "Mat 26:38-41", "n": "", "vs": [[38, "فقال لهم: «نفسي حزينة جدا حتى الموت! ابقوا هنا واسهروا معي!»"], [39, "وابتعد عنهم قليلا وارتمى على وجهه يصلي، قائلا: «ياأبي، إن كان ممكنا، فلتعبر عني هذه الكأس: ولكن، لا كما أريد أنا، بل كما تريد أنت!»"], [40, "ورجع إلى التلاميذ فوجدهم نائمين، فقال لبطرس: «أهكذا لم تقدروا أن تسهروا معي ساعة واحدة؟"], [41, "اسهروا وصلوا لكي لا تدخلوا في تجربة. إن الروح نشيط؛ أما الجسد فضعيف»."]]}, {"l": "Mar 13:33-37", "n": "", "vs": [[33, "فانتبهوا واسهروا لأنكم لا تعرفون متى يحين الوقت!"], [34, "فالأمر أشبه بإنسان مسافر، ترك بيته، وأعطى عبيده السلطة معينا لكل واحد عمله، وأوصى حارس الباب أن يسهر."], [35, "إذن اسهروا، لأنكم لا تعرفون متى يعود رب البيت: أمساء، أم في منتصف الليل، أم عند صياح الديك، أم صباحا،"], [36, "لئلا يعود فجأة ويجدكم نائمين."], [37, "وما أقوله لكم، أقوله للجميع: اسهروا! »"]]}, {"l": "Mar 14:37", "n": "", "vs": [[37, "ثم رجع فوجد تلاميذه نائمين، فقال لبطرس: «هل أنت نائم ياسمعان؟ ألم تقدر أن تسهر ساعة واحدة؟"]]}, {"l": "Mar 14:38", "n": "", "vs": [[38, "اسهروا وصلوا لئلا تدخلوا في تجربة. إن الروح نشيط، وأما الجسد فضعيف»."]]}, {"l": "Luk 21:34", "n": "", "vs": [[34, "ولكن احذروا لأنفسكم لئلا تتثقل قلوبكم بالانغماس في اللذات وبالسكر وهموم الحياة، فيدهمكم ذلك اليوم فجأة؛"]]}, {"l": "Luk 21:36", "n": "", "vs": [[36, "فاسهروا إذن وتضرعوا في كل حين، لكي تتمكنوا من أن تنجوا من جميع هذه الأمور التي هي على وشك أن تحدث، وتقفوا أمام ابن الإنسان»."]]}, {"l": "Luk 22:46", "n": "", "vs": [[46, "فقال لهم: «ما بالكم نائمين؟ قوموا وصلوا لكي لا تدخلوا في تجربة!»"]]}, {"l": "Rom 12:12", "n": "", "vs": [[12, "فرحين بالرجاء، صابرين في الضيق، مواظبين على الصلاة،"]]}, {"l": "Eph 6:18", "n": "", "vs": [[18, "كونوا مصلين في كل حال، بكل صلاة وطلبة في الروح، وساهرين لهذا الغرض عينه مواظبين تماما على جميع الطلبات لأجل القديسين جميعا،"]]}, {"l": "Col 4:2", "n": "", "vs": [[2, "داوموا على الصلاة، متيقظين فيها بالشكر،"]]}, {"l": "2Ti 4:5", "n": "", "vs": [[5, "أما أنت، فكن بصيرا في كل أمر، وتحمل المشقات، واعمل عمل المبشر، وأكمل خدمتك إلى التمام!"]]}, {"l": "Rev 16:15", "n": "", "vs": [[15, "»ها أنا آت كما يأتي اللص، طوبى لمن يكون بانتظاري، ساهرا وحارسا لثيابه، لئلا يمشي عريانا فيرى الناس عورته!«"]]}], "kwAr": "كونوا متنبهين للصلاة", "noteAr": ""}], "arS": [["إن ", []], ["نهاية", ["G5056"]], [" ", []], ["كل شيء", ["G3956"]], [" قد صارت ", []], ["قريبة", ["G1448"]], [". ", []], ["فتعقلوا", ["G4993"]], [" إذن، وكونوا ", []], ["متنبهين", ["G3525"]], [" لرفع ", []], ["الصلاة", ["G4335"]], [" دائما.", []]]}, {"c": 4, "v": 8, "text": "لكن أهم شيء هو أن تبادلوا بعضكم بعضا المحبة الشديدة. لأن المحبة تستر إساءات كثيرة.", "groups": [{"kw": "above", "raw": "Col_3:14; Jam_5:12; 3Jo_1:2", "note": "", "refs": [{"l": "Col 3:14", "n": "", "vs": [[14, "وفوق هذا كله البسوا المحبة، فهي رابطة الكمال."]]}, {"l": "Jam 5:12", "n": "", "vs": [[12, "ولكن قبل كل شيء، ياإخوتي، لا تحلفوا، لا بالسماء، ولا بالأرض ولا بأي قسم آخر. وإنما ليكن كلامكم «نعم» إن كان نعم، و«لا» إن كان لا. وذلك لكي لا تقعوا تحت الحكم."]]}, {"l": "3Jo 1:2", "n": "", "vs": [[2, "أيها الحبيب، أود أن تكون موفقا في كل أمر، وأن تكون صحتك البدنية قوية ومعافاة كصحتك الروحية."]]}], "kwAr": "أهم شيء", "noteAr": ""}, {"kw": "fervent", "raw": "Αγαπην εκτενη [Strongs G1618], intense love; for love shall cover (or covers, καλυπτει [Strongs G2572], in the present tense, as several copies read) a multitude of sins; which seems a reference to the proverb, love covereth all sins, Pro_10:12. 1Pe_1:22; 1Co_13:1-13, 1Co_14:1; 1Th_3:12, 1Th_4:9, 1Th_4:10; 2Th_1:3; 1Ti_1:5; Heb_13:1; 2Pe_1:6, 2Pe_1:7", "note": "Αγαπην εκτενη [Strongs G1618], intense love; for love shall cover (or covers, καλυπτει [Strongs G2572], in the present tense, as several copies read) a multitude of sins; which seems a reference to the proverb, love covereth all sins, Pro_10:12. 1Pe_1:22; 1Co_13:1-13, 1Co_14:1; 1Th_3:12, 1Th_4:9, 1Th_4:10; 2Th_1:3; 1Ti_1:5; Heb_13:1; 2Pe_1:6, 2Pe_1:7", "refs": [{"l": "Pro 10:12", "n": "", "vs": [[12, "البغضاء تثير الخصومات، والمحبة تستر جميع الذنوب."]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}, {"l": "1Co 13:1-13", "n": "", "vs": [[1, "... لو كنت أتكلم بلغات الناس والملائكة وليس عندي محبة، لما كنت إلا نحاسا يطن وصنجا يرن!"], [2, "ولو كانت لي موهبة النبوءة، وكنت عالما بجميع الأسرار والعلم كله، وكان عندي الإيمان كله حتى أنقل الجبال، وليس عندي محبة، فلست شيئا!"], [3, "ولو قدمت أموالي كلها للإطعام، وسلمت جسدي لأحرق، وليس عندي محبة، لما كنت أنتفع شيئا."], [4, "المحبة تصبر طويلا؛ وهي لطيفة. المحبة لا تحسد. المحبة لا تتفاخر ولا تتكبر."], [5, "لا تتصرف بغير لياقة، ولا تسعى إلى مصلحتها الخاصة. لا تستفز سريعا، ولا تنسب الشر لأحد."], [6, "لا تفرح بالظلم، بل تفرح بالحق."], [7, "إنها تستر كل شيء، وتصدق كل شيء، وترجو كل شيء، وتتحمل كل شيء."], [8, "المحبة لا تزول أبدا. أما مواهب النبوآت فستزال، ومواهب اللغات ستنقطع، والمعرفة ستزال."], [9, "فإن معرفتنا جزئية ونبوءتنا جزئية."], [10, "ولكن، عندما يأتي ما هو كامل، يزال ما هو جزئي."], [11, "فلما كنت طفلا، كنت أتكلم كالطفل، وأشعر كالطفل، وأفكر كالطفل. ولكن، لما صرت رجلا، أبطلت ما يخص الطفل."], [12, "ونحن الآن ننظر إلى الأمور من خلال زجاج قاتم فنراها بغموض. إلا أننا سنراها أخيرا مواجهة. الآن، أعرف معرفة جزئية. ولكني، عندئذ، سأعرف مثلما عرفت."], [13, "أما الآن، فهذه الثلاثة باقية: الإيمان، والرجاء، والمحبة. ولكن أعظمها هي المحبة!"]]}, {"l": "1Co 14:1", "n": "", "vs": [[1, "اسعوا وراء المحبة، وتشوقوا إلى المواهب الروحية، بل بالأحرى موهبة التنبوء."]]}, {"l": "1Th 3:12", "n": "", "vs": [[12, "وليجعلكم الرب تنمون وتفيضون في المحبة لتحبوا بعضكم بعضا وجميع الناس كمحبتنا لكم،"]]}, {"l": "1Th 4:9", "n": "", "vs": [[9, "أما المحبة الأخوية، فلستم في حاجة لأن أكتب إليكم عنها، لأنكم بأنفسكم قد تعلمتم من الله أن تحبوا بعضكم بعضا،"]]}, {"l": "1Th 4:10", "n": "", "vs": [[10, "ولأنكم أيضا هكذا تعاملون جميع الإخوة في مقاطعة مقدونية كلها. وإنما نحرضكم، أيها الإخوة، أن تضاعفوا ذلك أكثر فأكثر،"]]}, {"l": "2Th 1:3", "n": "", "vs": [[3, "من واجبنا أن نشكر الله على الدوام لأجلكم أيها الإخوة. كما أن هذا حق: لأن إيمانكم ينمو نموا فائقا، ومحبة أحدكم للآخر تفيض بينكم جميعا."]]}, {"l": "1Ti 1:5", "n": "", "vs": [[5, "أما الغاية مما أوصيتك به، فهي المحبة النابعة من قلب طاهر وضمير صالح وإيمان خال من الرياء."]]}, {"l": "Heb 13:1", "n": "", "vs": [[1, "اثبتوا على المحبة الأخوية."]]}, {"l": "2Pe 1:6", "n": "", "vs": [[6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"]]}, {"l": "2Pe 1:7", "n": "", "vs": [[7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."]]}], "kwAr": "المحبة الشديدة", "noteAr": "Αγαπην εκτενη [Strongs G1618]: محبة شديدة. لأن المحبة تستر (أو «تستر» بصيغة المضارع καλυπτει [Strongs G2572] كما تقرأ نسخ عديدة) كثرة من الخطايا؛ ويبدو أنها إشارة إلى المثل: «المحبة تستر كل الذنوب»."}, {"kw": "for", "raw": "Pro_10:12, Pro_12:16, Pro_17:9, Pro_18:13; 1Co_13:7; Jam_5:20", "note": "", "refs": [{"l": "Pro 10:12", "n": "", "vs": [[12, "البغضاء تثير الخصومات، والمحبة تستر جميع الذنوب."]]}, {"l": "Pro 12:16", "n": "", "vs": [[16, "يبدي الأحمق غيظه في لحظة، أما العاقل فيتجاهل الإهانة."]]}, {"l": "Pro 17:9", "n": "", "vs": [[9, "من يصفح عن الذنب يلتمس المحبة، والواشي يفرق بين الأصدقاء الحميمين."]]}, {"l": "Pro 18:13", "n": "", "vs": [[13, "من أجاب عن أمر مازال يجهله، فذاك حماقة منه وعار له."]]}, {"l": "1Co 13:7", "n": "", "vs": [[7, "إنها تستر كل شيء، وتصدق كل شيء، وترجو كل شيء، وتتحمل كل شيء."]]}, {"l": "Jam 5:20", "n": "", "vs": [[20, "فليتأكد أن الذي يرد خاطئا عن ضلال مسلكه، فإنما ينقذ نفسا من الموت، ويستر خطايا كثيرة!"]]}], "kwAr": "لأن المحبة تستر", "noteAr": ""}, {"kw": "shall", "raw": "or, will", "note": "or, will", "refs": [], "kwAr": "تستر", "noteAr": "أو: سوف."}], "arS": [["لكن ", []], ["أهم", ["G4253"]], [" شيء هو أن ", []], ["تبادلوا", ["G2192"]], [" ", []], ["بعضكم بعضا", ["G1438"]], [" ", []], ["المحبة", ["G26"]], [" ", []], ["الشديدة", ["G1618"]], [". لأن ", []], ["المحبة", ["G26"]], [" ", []], ["تستر", ["G2572"]], [" ", []], ["إساءات", ["G266"]], [" ", []], ["كثيرة", ["G4128"]], [".", []]]}, {"c": 4, "v": 9, "text": "ومارسوا الضيافة بعضكم نحو بعض بلا تذمر.", "groups": [{"kw": "hospitality", "raw": "Rom_12:13, Rom_16:23; 1Ti_3:2; Tit_1:8; Heb_13:2, Heb_13:16", "note": "", "refs": [{"l": "Rom 12:13", "n": "", "vs": [[13, "متعاونين على سد حاجات القديسين، مداومين على إضافة الغرباء."]]}, {"l": "Rom 16:23", "n": "", "vs": [[23, "يسلم عليكم غايوس، المضيف لي وللكنيسة كلها. يسلم عليكم أراستس، أمين صندوق المدينة، والأخ كوارتس."]]}, {"l": "1Ti 3:2", "n": "", "vs": [[2, "إذن، يجب أن يكون الراعي بلا عيب، زوجا لامرأة واحدة، نبيها عاقلا مهذبا مضيافا، قادرا على التعليم؛"]]}, {"l": "Tit 1:8", "n": "", "vs": [[8, "بل مضيافا، محبا للصلاح، رزينا، بارا، تقيا، مالكا لطبعه،"]]}, {"l": "Heb 13:2", "n": "", "vs": [[2, "ولا تغفلوا عن ضيافة الغرباء، فبها أضاف بعض القدماء ملائكة دون أن يعرفوا."]]}, {"l": "Heb 13:16", "n": "", "vs": [[16, "ولا تغفلوا أيضا عن عمل الخير وإعانة المحتاجين: لأن مثل هذه «الذبائح» تسر الله جدا!"]]}], "kwAr": "الضيافة", "noteAr": ""}, {"kw": "without", "raw": "2Co_9:7; Phi_2:14; Phm_1:14; Jam_5:9", "note": "", "refs": [{"l": "2Co 9:7", "n": "", "vs": [[7, "فليتبرع كل واحد بما نوى في قلبه، لا بأسف ولا عن اضطرار، لأن الله يحب المعطي المتهلل."]]}, {"l": "Phi 2:14", "n": "", "vs": [[14, "فافعلوا كل شيء دون تذمر أو جدال،"]]}, {"l": "Phm 1:14", "n": "", "vs": [[14, "ولكني لم أرد أن أفعل شيئا من دون رأيك، ليكون معروفك لا كأنه عن اضطرار بل عن اختيار."]]}, {"l": "Jam 5:9", "n": "", "vs": [[9, "أيها الإخوة، لا تتذمروا بعضكم على بعض، لكي لا يصدر الحكم ضدكم. تذكروا دائما أن الديان قريب جدا، إنه أمام الباب."]]}], "kwAr": "بلا تذمر", "noteAr": ""}], "arS": [["ومارسوا ", []], ["الضيافة", ["G5382"]], [" ", []], ["بعضكم نحو بعض", ["G240", "G1519"]], [" ", []], ["بلا", ["G427"]], [" ", []], ["تذمر", ["G1112"]], [".", []]]}, {"c": 4, "v": 10, "text": "وعلى كل واحد منكم أن يخدم الآخرين بالموهبة التي أعطاه الله إياها، باعتباركم وكلاء صالحين مؤتمنين على أنواع متعددة من المواهب التي يمنحها الله بالنعمة.", "groups": [{"kw": "every", "raw": "Mat_25:14, Mat_25:15; Luk_19:13; Rom_12:6-8; 1Co_4:7, 1Co_12:4-11", "note": "", "refs": [{"l": "Mat 25:14", "n": "", "vs": [[14, "فذلك أشبه بإنسان مسافر، استدعى عبيده وسلمهم أمواله،"]]}, {"l": "Mat 25:15", "n": "", "vs": [[15, "فأعطى واحدا منهم خمس وزنات (من الفضة)، وأعطى آخر وزنتين، وأعطى الثالث وزنة واحدة، كل واحد على قدر طاقته، ثم سافر."]]}, {"l": "Luk 19:13", "n": "", "vs": [[13, "فاستدعى عبيده العشرة، وأودعهم عشر وزنات، وقال لهم: تاجروا إلى أن أعود."]]}, {"l": "Rom 12:6-8", "n": "", "vs": [[6, "ولكن، بما أن المواهب موزعة بحسب النعمة الموهوبة لنا، (فلنمارسها): فمن وهب النبوءة، فليتنبأ بحسب مقدار الإيمان؛"], [7, "ومن وهب الخدمة، فلينهمك في الخدمة؛ أو التعليم، ففي التعليم؛"], [8, "أو الوعظ، ففي الوعظ؛ أو العطاء، فليعط بسخاء؛ أو القيادة، فليقد باجتهاد؛ أو إظهار الرحمة، فليرحم بسرور."]]}, {"l": "1Co 4:7", "n": "", "vs": [[7, "فمن جعلك متميزا عن غيرك؟ وأي شيء مما لك لم تكن قد أخذته هبة؟ ومادمت قد أخذت، فلماذا تتباهى كأنك لم تأخذ؟"]]}, {"l": "1Co 12:4-11", "n": "", "vs": [[4, "هناك مواهب مختلفة، ولكن الروح واحد."], [5, "وهناك خدمات مختلفة، والرب واحد."], [6, "وهناك أيضا أعمال مختلفة، ولكن الله واحد، وهو يعمل كل شيء في الجميع."], [7, "وإنما كل واحد يوهب موهبة يتجلى الروح فيها لأجل المنفعة."], [8, "فواحد يوهب، عن طريق الروح، كلام الحكمة، وآخر كلام المعرفة وفقا للروح نفسه،"], [9, "وآخر إيمانا بالروح نفسه. ويوهب آخر موهبة شفاء الأمراض بالروح الواحد،"], [10, "وآخر عمل المعجزات، وآخر النبوءة وآخر التمييز بين الأرواح، وآخر التكلم بلغات مختلفة (لم يتعلمها)، وآخر ترجمة اللغات تلك."], [11, "ولكن هذا كله يشغله الروح الواحد نفسه، موزعا المواهب، كما يشاء، على كل واحد."]]}], "kwAr": "كل واحد منكم", "noteAr": ""}, {"kw": "minister", "raw": "Mat_20:28, Mat_25:44; Mar_10:45; Luk_8:3; Rom_15:25, Rom_15:27; 2Co_9:1; 2Ti_1:18; Heb_6:10", "note": "", "refs": [{"l": "Mat 20:28", "n": "", "vs": [[28, "فهكذا ابن الإنسان: قد جاء لا ليخدم، بل ليخدم ويبذل نفسه فدية عن كثيرين. »"]]}, {"l": "Mat 25:44", "n": "", "vs": [[44, "فيرد هؤلاء أيضا قائلين: يارب، متى رأيناك جائعا أو عطشانا أو غريبا أو عريانا أو مريضا أو سجينا، ولم نخدمك؟"]]}, {"l": "Mar 10:45", "n": "", "vs": [[45, "فحتى ابن الإنسان قد جاء لا ليخدم، بل ليخدم ويبذل نفسه فدية عن كثيرين»."]]}, {"l": "Luk 8:3", "n": "", "vs": [[3, "ويونا زوجة خوزي وكيل هيرودس، وسوسنة، وغيرهن كثيرات ممن كن يساعدنه بأموالهن."]]}, {"l": "Rom 15:25", "n": "", "vs": [[25, "على أني الآن ذاهب إلى أورشليم في خدمة القديسين."]]}, {"l": "Rom 15:27", "n": "", "vs": [[27, "حسن لديهم ذلك، وهم في دين لأولئك القديسين: فإذا كان الأمم قد اشتركوا في ما هو روحي عند أولئك، فعليهم أيضا أن يخدموهم في ما هو مادي."]]}, {"l": "2Co 9:1", "n": "", "vs": [[1, "فإنه من غير الضروري أن أكتب إليكم في موضوع إعانة القديسين،"]]}, {"l": "2Ti 1:18", "n": "", "vs": [[18, "لينعم عليه الرب بأن يلقى الرحمة من الرب في ذلك اليوم! أما كل ما خدمني به في مدينة أفسس، فأنت تعرفه جيدا."]]}, {"l": "Heb 6:10", "n": "", "vs": [[10, "وليس الله بظالم حتى ينسى عملكم الجاد في إظهار محبتكم له عن طريق خدمتكم للقديسين إكراما لاسمه، الأمر الذي قمتم به قبلا، وتقومون به الآن!"]]}], "kwAr": "أن يخدم", "noteAr": ""}, {"kw": "good", "raw": "Mat_24:45, Mat_24:14, Mat_24:21; Luk_12:42, Luk_16:1-8; 1Co_4:1, 1Co_4:2; Tit_1:7", "note": "", "refs": [{"l": "Mat 24:45", "n": "", "vs": [[45, "فمن هو إذن ذلك العبد الأمين والحكيم الذي أقامه سيده على أهل بيته ليقدم لهم الطعام في أوانه؟"]]}, {"l": "Mat 24:14", "n": "", "vs": [[14, "فسوف ينادى ببشارة الملكوت هذه في العالم كله، شهادة لي لدى الأمم جميعا. وبعد ذلك تأتي النهاية."]]}, {"l": "Mat 24:21", "n": "", "vs": [[21, "فسوف تحدث عندئذ ضيقة عظيمة لم يحدث مثلها منذ بدء العالم إلى الآن، ولن يحدث."]]}, {"l": "Luk 12:42", "n": "", "vs": [[42, "فقال الرب: «من هو إذن الوكيل الأمين العاقل الذي يقيمه سيده على أهل بيته ليقدم لهم حصتهم من الطعام في حينها؟"]]}, {"l": "Luk 16:1-8", "n": "", "vs": [[1, "وقال أيضا لتلاميذه: «كان لإنسان غني وكيل. فاتهم لديه بأنه يبذر أمواله."], [2, "فاستدعاه وسأله: ما هذا الذي أسمع عنك؟ قدم حساب وكالتك، فإنك لا يمكن أن تكون وكيلا لي بعد!"], [3, "فقال الوكيل في نفسه: ما عسى أن أعمل، مادام سيدي سينزع عني الوكالة؟ لا أقوى على نقب الأرض؛ وأستحي أن أستعطي!"], [4, "قد علمت ماذا أعمل، حتى إذا عزلت عن الوكالة، يستقبلني الأصدقاء في بيوتهم."], [5, "فاستدعى مديوني سيده واحدا فواحدا. وسأل أولهم: كم عليك لسيدي؟"], [6, "فأجاب: مئة بث من الزيت. فقال له: خذ صكك، واجلس سريعا، واكتب خمسين!"], [7, "ثم قال للآخر: وأنت، كم عليك؟ فأجاب: مئة كر من القمح. فقال له: خذ صكك، واكتب ثمانين!"], [8, "فامتدح السيد وكيله الخائن لأنه تصرف بحكمة. فإن أبناء هذا العالم أحكم مع أهل جيلهم من أبناء النور."]]}, {"l": "1Co 4:1", "n": "", "vs": [[1, "فلينظر إلينا الناس باعتبارنا خداما للمسيح ووكلاء على أسرار الله."]]}, {"l": "1Co 4:2", "n": "", "vs": [[2, "والمطلوب من الوكلاء، قبل كل شيء، أن يوجد كل منهم أمينا."]]}, {"l": "Tit 1:7", "n": "", "vs": [[7, "وذلك لأن الناظر يجب أن يكون بريئا من كل تهمة باعتباره وكيلا لله، لا معجبا بنفسه ولا حاد الطبع، ولا مدمن الخمر، ولا عنيفا، ولا ساعيا إلى المكسب الخسيس؛"]]}], "kwAr": "وكلاء صالحين", "noteAr": ""}, {"kw": "the manifold", "raw": "1Co_3:10, 1Co_12:4, 1Co_15:10; 2Co_6:1; Eph_3:8, Eph_4:11", "note": "", "refs": [{"l": "1Co 3:10", "n": "", "vs": [[10, "وبحسب نعمة الله الموهوبة لي، وضعت الأساس كما يفعل البناء الماهر، وغيري يبني عليه. ولكن، لينتبه كل واحد كيف يبني عليه."]]}, {"l": "1Co 12:4", "n": "", "vs": [[4, "هناك مواهب مختلفة، ولكن الروح واحد."]]}, {"l": "1Co 15:10", "n": "", "vs": [[10, "ولكن، بنعمة الله صرت على ما أنا عليه الآن، ونعمته الموهوبة لي لم تكن عبثا، إذ عملت جاهدا أكثر من الرسل الآخرين جميعا. إلا أني لم أكن أنا العامل، بل نعمة الله التي كانت معي."]]}, {"l": "2Co 6:1", "n": "", "vs": [[1, "فبما أننا عاملون معا عند الله، نطلب ألا يكون قبولكم لنعمة الله عبثا."]]}, {"l": "Eph 3:8", "n": "", "vs": [[8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "Eph 4:11", "n": "", "vs": [[11, "وهو قد وهب البعض أن يكونوا رسلا، والبعض أنبياء، والبعض مبشرين والبعض رعاة ومعلمين،"]]}], "kwAr": "أنواع متعددة", "noteAr": ""}], "arS": [["وعلى ", []], ["كل واحد", ["G1538"]], [" منكم أن ", []], ["يخدم", ["G1247"]], [" ", []], ["الآخرين", ["G1438"]], [" ", []], ["بالموهبة", ["G5486"]], [" التي أعطاه الله إياها، باعتباركم ", []], ["وكلاء", ["G3623"]], [" ", []], ["صالحين", ["G2570"]], [" مؤتمنين على أنواع ", []], ["متعددة", ["G4164"]], [" من المواهب التي يمنحها ", []], ["الله", ["G2316"]], [" ", []], ["بالنعمة", ["G5485"]], [".", []]]}, {"c": 4, "v": 11, "text": "فمن يتكلم، عليه أن يتكلم بما يوافق أقوال الله؛ ومن يخدم، عليه أن يخدم بموجب القوة التي يمنحها الله . وذلك لكي يتمجد الله في كل شيء، بيسوع المسيح، له المجد والسلطة إلى أبد الآبدين. آمين!", "groups": [{"kw": "any", "raw": "Isa_8:20; Jer_23:22; Eph_4:29; Col_4:6; Jam_1:19, Jam_1:26, Jam_3:1-6", "note": "", "refs": [{"l": "Isa 8:20", "n": "", "vs": [[20, "فإلى الشريعة وإلى الشهادة: ومن لا ينطق بمثل هذا القول، فلا فجر له."]]}, {"l": "Jer 23:22", "n": "", "vs": [[22, "لو مثلوا حقا في مجلسي لبلغوا كلامي لشعبي، ولكانوا ردوهم عن مساوئهم وعن شر أعمالهم."]]}, {"l": "Eph 4:29", "n": "", "vs": [[29, "لا تخرج من أفواهكم كلمة فاسدة، بل الكلام الصالح للبنيان الذي تدعو إليه الحاجة، كي يعطي السامعين نعمة."]]}, {"l": "Col 4:6", "n": "", "vs": [[6, "ليكن كلامكم دائما مصحوبا بالنعمة، وليكن مصلحا بملح، فتعرفوا كيف يجب أن تجيبوا كل واحد."]]}, {"l": "Jam 1:19", "n": "", "vs": [[19, "لذلك، ياإخوتي الأحباء، على كل واحد منكم أن يكون مسرعا إلى الإصغاء، غير متسرع في الكلام، بطيء الغضب."]]}, {"l": "Jam 1:26", "n": "", "vs": [[26, "وإن ظن أحد أنه متدين، وهو لا يلجم لسانه، فإنه يغش قلبه، وديانته غير نافعة!"]]}, {"l": "Jam 3:1-6", "n": "", "vs": [[1, "ياإخوتي، لا تتسابقوا كي تجعلوا أنفسكم معلمين لغيركم فتزيدوا عدد المعلمين! واذكروا أننا، نحن المعلمين، سوف نحاسب حسابا أقسى من غيرنا."], [2, "فإننا جميعا معرضون للوقوع في أخطاء كثيرة. ولكن من يلجم لسانه ولا يخطيء في كلامه هو ناضج يقدر أن يسيطر على طبيعته سيطرة تامة."], [3, "فحين نضع لجاما في فم حصان، نتمكن من توجيهه واقتياده كما نريد."], [4, "ومهما كانت السفينة كبيرة والرياح التي تدفعها قوية وهوجاء، فبدفة صغيرة جدا يتحكم الربان فيها ويسوقها إلى الجهة التي يريد. كذلك اللسان أيضا: فهو عضو صغير،"], [5, "ولكن ما أشد فعاليته! انظروا: إن شرارة صغيرة تحرق غابة كبيرة!"], [6, "واللسان كالنار خطرا: فهو وحده، بين أعضاء الجسم، جامع للشرور كلها، ويلوث الجسم كله بالفساد. إنه يشعل دائرة الكون، ويستمد ناره من جهنم!"]]}], "kwAr": "من يتكلم", "noteAr": ""}, {"kw": "as the", "raw": "Act_7:38; Rom_3:2; Heb_5:12", "note": "", "refs": [{"l": "Act 7:38", "n": "", "vs": [[38, "وهو الذي كان يقود جماعة الشعب في الصحراء، وقد قام بدور الوسيط بين الملاك الذي كلمه على جبل سيناء وآبائنا، فنقل إليكم وصايا الله الحية."]]}, {"l": "Rom 3:2", "n": "", "vs": [[2, "إنه كثير من جميع الجهات، وأهمها فعلا أن أقوال الله وضعت أمانة بين أيديهم."]]}, {"l": "Heb 5:12", "n": "", "vs": [[12, "كان يجب أن تكونوا الآن قادرين على تعليم الآخرين، بعدما مضى زمان طويل على اهتدائكم. ولكنكم مازلتم بحاجة إلى من يعلمكم حتى المباديء الأساسية لإعلانات الله. ها قد عدتم من جديد تحتاجون إلى اللبن! فأنتم غير قادرين على هضم الطعام القوي."]]}], "kwAr": "أقوال الله", "noteAr": ""}, {"kw": "if", "raw": "1Pe_4:10", "note": "", "refs": [{"l": "1Pe 4:10", "n": "", "vs": [[10, "وعلى كل واحد منكم أن يخدم الآخرين بالموهبة التي أعطاه الله إياها، باعتباركم وكلاء صالحين مؤتمنين على أنواع متعددة من المواهب التي يمنحها الله بالنعمة."]]}], "kwAr": "ومن يخدم", "noteAr": ""}, {"kw": "the ability", "raw": "1Ch_29:11-16; Rom_12:6-8; 1Co_3:10, 1Co_12:4", "note": "", "refs": [{"l": "1Ch 29:11-16", "n": "", "vs": [[11, "لك يارب العظمة والسطوة والجلال والبهاء والمجد، لأن لك كل ما في السماء والأرض. أنت يارب صاحب الملك وقد تعاليت فوق رؤوس الجميع."], [12, "أنت مصدر كل غنى وكرامة، وأنت المتسلط على الجميع، والمالك للقوة والسطوة، وأنت القادر على تعظيم الجميع وتقوية عزيمتهم."], [13, "والآن، نحمدك ياإلهنا ونسبح اسمك الجليل."], [14, "ولكن من أنا، ومن هو شعبي حتى نقدر أن نتبرع بسخاء وعن رضى؟ لأن منك الجميع ومن يدك نقدم لك."], [15, "فنحن مثل آبائنا، غرباء ونزلاء أمامك، وأيامنا كالظل على الأرض، خالية من الرجاء."], [16, "فيا أيها الرب إلهنا، إن كل هذه الثروة التي وفرناها لنشيد لك هيكلا لاسم قدسك إنما هي من نعم يدك وأنت مالك الكل."]]}, {"l": "Rom 12:6-8", "n": "", "vs": [[6, "ولكن، بما أن المواهب موزعة بحسب النعمة الموهوبة لنا، (فلنمارسها): فمن وهب النبوءة، فليتنبأ بحسب مقدار الإيمان؛"], [7, "ومن وهب الخدمة، فلينهمك في الخدمة؛ أو التعليم، ففي التعليم؛"], [8, "أو الوعظ، ففي الوعظ؛ أو العطاء، فليعط بسخاء؛ أو القيادة، فليقد باجتهاد؛ أو إظهار الرحمة، فليرحم بسرور."]]}, {"l": "1Co 3:10", "n": "", "vs": [[10, "وبحسب نعمة الله الموهوبة لي، وضعت الأساس كما يفعل البناء الماهر، وغيري يبني عليه. ولكن، لينتبه كل واحد كيف يبني عليه."]]}, {"l": "1Co 12:4", "n": "", "vs": [[4, "هناك مواهب مختلفة، ولكن الروح واحد."]]}], "kwAr": "القوة التي يمنحها الله", "noteAr": ""}, {"kw": "that", "raw": "1Pe_2:5; 1Co_6:20, 1Co_10:31; 2Co_9:13; Eph_3:20,Eph_3:21, Eph_5:20", "note": "", "refs": [{"l": "1Pe 2:5", "n": "", "vs": [[5, "إذن اتحدوا به كحجارة حية، مبنيين بيتا روحيا، تكونون فيه كهنة مقدسين تقدمون لله ذبائح روحية مقبولة لديه بفضل يسوع المسيح."]]}, {"l": "1Co 6:20", "n": "", "vs": [[20, "لأنكم قد اشتريتم بفدية. إذن، مجدوا الله في أجسادكم."]]}, {"l": "1Co 10:31", "n": "", "vs": [[31, "فإذا أكلتم أو شربتم أو مهما فعلتم، فافعلوا كل شيء لتمجيد الله."]]}, {"l": "2Co 9:13", "n": "", "vs": [[13, "فإن القديسين، إذ يختبرون هذه الخدمة، يمجدون الله على طاعتكم في الشهادة لإنجيل المسيح وعلى السخاء الطوعي في مشاركتكم لهم وللجميع."]]}, {"l": "Eph 3:20", "n": "", "vs": [[20, "والقادر أن يفعل، وفقا للقدرة العاملة فينا، ما يفوق بلا حصر كل ما نطلب أو نتصور،"]]}, {"l": "Eph 3:21", "n": "", "vs": [[21, "له المجد في الكنيسة، في المسيح يسوع، مدى الأجيال والدهور! آمين …"]]}, {"l": "Eph 5:20", "n": "", "vs": [[20, "رافعين الشكر كل حين وعلى كل شيء لله والآب، باسم ربنا يسوع المسيح؛"]]}], "kwAr": "لكي يتمجد الله", "noteAr": ""}, {"kw": "through", "raw": "1Pe_2:5; Phi_1:11, Phi_2:11", "note": "", "refs": [{"l": "1Pe 2:5", "n": "", "vs": [[5, "إذن اتحدوا به كحجارة حية، مبنيين بيتا روحيا، تكونون فيه كهنة مقدسين تقدمون لله ذبائح روحية مقبولة لديه بفضل يسوع المسيح."]]}, {"l": "Phi 1:11", "n": "", "vs": [[11, "كاملين في ثمار البر الآتية بيسوع المسيح، لمجد الله وحمده."]]}, {"l": "Phi 2:11", "n": "", "vs": [[11, "ولكي يعترف كل لسان بأن يسوع المسيح هو الرب، لمجد الله الآب."]]}], "kwAr": "بيسوع المسيح", "noteAr": ""}, {"kw": "to whom", "raw": "1Pe_5:11; Rom_16:27; Eph_3:21; 1Ti_1:17, 1Ti_6:16; Jud_1:25; Rev_1:5, Rev_1:6", "note": "", "refs": [{"l": "1Pe 5:11", "n": "", "vs": [[11, "له المجد والسلطة إلى أبد الآبدين. آمين!"]]}, {"l": "Rom 16:27", "n": "", "vs": [[27, "المجد لله إلى الأبد، الحكيم وحده، بيسوع المسيح. آمين!"]]}, {"l": "Eph 3:21", "n": "", "vs": [[21, "له المجد في الكنيسة، في المسيح يسوع، مدى الأجيال والدهور! آمين …"]]}, {"l": "1Ti 1:17", "n": "", "vs": [[17, "فللملك الأزلي، الله الواحد غير المنظور وغير الفاني، الكرامة والمجد إلى أبد الآبدين. آمين!"]]}, {"l": "1Ti 6:16", "n": "", "vs": [[16, "الذي وحده لا فناء له، الساكن في نور لا يدنى منه، الذي لم يره أي إنسان ولا يقدر أن يراه. له الكرامة والقدرة الأبدية. آمين!"]]}, {"l": "Jud 1:25", "n": "", "vs": [[25, "لله الواحد، مخلصنا بيسوع المسيح ربنا ... المجد والجلال والقدرة والسلطة، من قبل أن كان الزمان، والآن وطوال الأزمان آمين!"]]}, {"l": "Rev 1:5", "n": "", "vs": [[5, "ومن يسوع المسيح الشاهد الأمين، بكر القائمين من بين الأموات، ملك ملوك الأرض، ذاك الذي بدافع محبته لنا مات لأجلنا فغسلنا بدمه من خطايانا،"]]}, {"l": "Rev 1:6", "n": "", "vs": [[6, "وجعل منا مملكة، وكهنة لله أبيه، له المجد والسلطان إلى أبد الآبدين. آمين!"]]}], "kwAr": "له المجد", "noteAr": ""}, {"kw": "dominion", "raw": "Psa_145:13; Dan_4:3, Dan_4:34, Dan_7:14; Mat_6:13; Rev_5:12-14", "note": "", "refs": [{"l": "Psa 145:13", "n": "", "vs": [[13, "ملكك ملك سرمدي، وسلطانك من جيل إلى جيل يدوم."]]}, {"l": "Dan 4:3", "n": "", "vs": [[3, "فما أعظم آياته وما أقوى عجائبه. إن ملكوته أبدي وسلطانه يدوم على مدى الأجيال."]]}, {"l": "Dan 4:34", "n": "", "vs": [[34, "وفي ختام السبعة الأزمنة، أنا نبوخذناصر، التفت نحو السماء، فرجع إلي عقلي، وباركت العلي وسبحت وحمدت الحي الأبدي ذا السلطان السرمدي، والذي ملكه على مدى الأجيال."]]}, {"l": "Dan 7:14", "n": "", "vs": [[14, "فأنعم عليه بسلطان ومجد وملكوت لتتعبد له كل الشعوب والأمم من كل لسان. سلطانه سلطان أبدي لا يفنى، وملكه لا ينقرض."]]}, {"l": "Mat 6:13", "n": "", "vs": [[13, "ولا تدخلنا في تجربة، لكن نجنا من الشرير، لأن لك الملك والقوة والمجد إلى الأبد. آمين."]]}, {"l": "Rev 5:12-14", "n": "", "vs": [[12, "وهم يهتفون بصوت عال: «مستحق هو الحمل المذبوح أن ينال القدرة والغنى والحكمة والقوة والإجلال والمجد والبركة»."], [13, "ثم سمعت كل خليقة في السماء وعلى الأرض، وتحت الأرض، وعلى البحر، هاتفة مع كل ما فيها: «البركة والإجلال والمجد والسلطة للجالس على العرش وللحمل، إلى أبد الآبدين»."], [14, "فردت الكائنات الحية الأربعة: «آمين!» وجثا الشيوخ ساجدين."]]}], "kwAr": "والسلطة", "noteAr": ""}], "arS": [["فمن ", []], ["يتكلم", ["G2980"]], ["، عليه أن يتكلم بما يوافق ", []], ["أقوال", ["G3051"]], [" ", []], ["الله", ["G2316"]], ["؛ ومن ", []], ["يخدم", ["G1247"]], ["، عليه أن يخدم بموجب ", []], ["القوة", ["G2479"]], [" التي ", []], ["يمنحها", ["G5524"]], [" الله . وذلك لكي ", []], ["يتمجد", ["G1392"]], [" ", []], ["الله", ["G2316"]], [" في ", []], ["كل شيء", ["G3956"]], ["، ", []], ["بيسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], ["، له ", []], ["المجد", ["G1391"]], [" ", []], ["والسلطة", ["G2904"]], [" إلى ", []], ["أبد الآبدين", ["G1519", "G165", "G165"]], [". ", []], ["آمين", ["G281"]], ["!", []]]}, {"c": 4, "v": 12, "text": "أيها الأحباء، لا تستغربوا نار الاضطهاد المشتعلة عندكم لاختباركم وكأن أمرا غريبا قد أصابكم!", "groups": [{"kw": "think", "raw": "1Pe_4:4; Isa_28:21", "note": "", "refs": [{"l": "1Pe 4:4", "n": "", "vs": [[4, "ورفاقكم في تلك العيشة سابقا يستغربون أنكم لا تركضون معهم إلى فيض هذه الخلاعة، ويجرحون سمعتكم."]]}, {"l": "Isa 28:21", "n": "", "vs": [[21, "وسيقبل الرب بسخط، كما أقبل في جبل فراصيم وفي وادي جبعون ليجري أفعاله الغريبة ويعاقب أشد عقاب."]]}], "kwAr": "لا تستغربوا", "noteAr": ""}, {"kw": "the fiery", "raw": "1Pe_1:7; Dan_11:35; 1Co_3:13", "note": "", "refs": [{"l": "1Pe 1:7", "n": "", "vs": [[7, "إلا أن غاية هذه التجارب هي اختبار حقيقة إيمانكم. فكما تختبر النار الذهب وتنقيه، تختبر التجارب حقيقة إيمانكم، وهو أثمن جدا من الذهب الفاني. وهكذا، يكون إيمانكم مدعاة مدح وإكرام وتمجيد لكم، عندما يعود يسوع المسيح ظاهرا بمجده."]]}, {"l": "Dan 11:35", "n": "", "vs": [[35, "ويعثر بعض الحكماء تمحيصا لهم وتنقية، حتى يأزف وقت النهاية في ميقات الله المعين."]]}, {"l": "1Co 3:13", "n": "", "vs": [[13, "فعمل كل واحد سينكشف علنا إذ يظهره ذلك اليوم الذي سيعلن في نار، وسوف تمتحن النار قيمة عمل كل واحد."]]}], "kwAr": "نار الاضطهاد", "noteAr": ""}, {"kw": "as", "raw": "1Pe_5:9; 1Co_10:13; 1Th_3:2-4; 2Ti_3:12", "note": "", "refs": [{"l": "1Pe 5:9", "n": "", "vs": [[9, "فقاوموه، ثابتين في الإيمان. واذكروا أن إخوتكم المنتشرين في العالم يجتازون وسط هذه الآلام عينها."]]}, {"l": "1Co 10:13", "n": "", "vs": [[13, "لم يصبكم من التجارب إلا ما هو بشري. ولكن الله أمين وجدير بالثقة، فلا يدعكم تجربون فوق ما تطيقون، بل يدبر لكم مع التجربة سبيل الخروج منها لتطيقوا احتمالها."]]}, {"l": "1Th 3:2-4", "n": "", "vs": [[2, "فبعثنا تيموثاوس، أخانا ومعاوننا في خدمة الله بنشر الإنجيل، لكي يشددكم ويشجعكم في إيمانكم،"], [3, "حتى لا يتزعزع أحد منكم من جراء هذه الضيقات. فإنكم تعلمون أننا معينون لذلك؛"], [4, "وقد سبق لنا، لما كنا عندكم أن أخبرناكم أننا سنقاسي الضيقات، الأمر الذي حدث بعد ذلك كما تعلمون."]]}, {"l": "2Ti 3:12", "n": "", "vs": [[12, "وحقا، إن جميع الذين يعزمون أن يعيشوا عيشة التقوى في المسيح يسوع يضطهدون."]]}], "kwAr": "وكأن أمرا غريبا", "noteAr": ""}], "arS": [["أيها ", []], ["الأحباء", ["G27"]], ["، لا ", []], ["تستغربوا", ["G3579"]], [" ", []], ["نار الاضطهاد المشتعلة", ["G4451"]], [" عندكم ", []], ["لاختباركم", ["G4314", "G3986"]], [" وكأن أمرا ", []], ["غريبا", ["G3581"]], [" قد ", []], ["أصابكم", ["G4819"]], ["!", []]]}, {"c": 4, "v": 13, "text": "وإنما افرحوا: لأنكم كما تشاركون المسيح في الآلام الآن، لابد أن تفرحوا بمشاركته في الابتهاج عند ظهور مجده.", "groups": [{"kw": "rejoice", "raw": "1Pe_1:6; Mat_5:12; Luk_6:22, Luk_6:23; Act_5:41, Act_16:25; Rom_5:3; 2Co_4:17, 2Co_12:9, 2Co_12:10; Jam_1:2, Jam_1:3", "note": "", "refs": [{"l": "1Pe 1:6", "n": "", "vs": [[6, "وهذا يدعوكم إلى الابتهاج، مع أنه لابد لكم الآن من الحزن فترة قصيرة تحت وطأة التجارب المتنوعة!"]]}, {"l": "Mat 5:12", "n": "", "vs": [[12, "افرحوا وتهللوا، فإن مكافأتكم في السماوات عظيمة. فإنهم هكذا اضطهدوا الأنبياء من قبلكم!"]]}, {"l": "Luk 6:22", "n": "", "vs": [[22, "طوبى لكم متى أبغضكم الناس، وعزلوكم، وأهانوا اسمكم ونبذوه كأنه شرير، من أجل ابن الإنسان."]]}, {"l": "Luk 6:23", "n": "", "vs": [[23, "افرحوا في ذلك اليوم وتهللوا، فها إن مكافأتكم في السماء عظيمة: لأنه هكذا عامل آباؤهم الأنبياء."]]}, {"l": "Act 5:41", "n": "", "vs": [[41, "ولكن الرسل خرجوا من المجلس فرحين، لأنهم اعتبروا أهلا لأن يلقوا الإهانة من أجل اسم يسوع."]]}, {"l": "Act 16:25", "n": "", "vs": [[25, "ونحو منتصف الليل كان بولس وسيلا يصليان ويسبحان الله، والمسجونون يسمعونهما،"]]}, {"l": "Rom 5:3", "n": "", "vs": [[3, "ليس هذا فقط، بل نفتخر أيضا في وسط الضيقات، لعلمنا أن الضيق ينتج فينا الصبر،"]]}, {"l": "2Co 4:17", "n": "", "vs": [[17, "ذلك لأن ما يضايقنا الآن من صعوبات بسيطة عابرة، ينتج لنا بمقدار لا يحد وزنة أبدية من المجد،"]]}, {"l": "2Co 12:9", "n": "", "vs": [[9, "فقال لي: «نعمتي تكفيك، لأن قدرتي تكمل في الضعف!» فأنا أرضى بأن أفتخر مسرورا بالضعفات التي في، لكي تخيم علي قدرة المسيح."]]}, {"l": "2Co 12:10", "n": "", "vs": [[10, "فلأجل المسيح، تسرني الضعفات والإهانات والضيقات والاضطهادات والصعوبات، لأني حينما أكون ضعيفا، فحينئذ أكون قويا!"]]}, {"l": "Jam 1:2", "n": "", "vs": [[2, "ياإخوتي، عندما تنزل بكم التجارب والمحن المختلفة، اعتبروها سبيلا إلى الفرح الكلي."]]}, {"l": "Jam 1:3", "n": "", "vs": [[3, "وكونوا على ثقة بأن امتحان إيمانكم هذا ينتج صبرا."]]}], "kwAr": "افرحوا", "noteAr": ""}, {"kw": "ye are", "raw": "1Pe_5:1, 1Pe_5:10; Rom_8:17; 2Co_1:7, 2Co_4:10; Phi_3:10; Col_1:24; 2Ti_2:12; Rev_1:9", "note": "", "refs": [{"l": "1Pe 5:1", "n": "", "vs": [[1, "وهذه وصيتي إلى الشيوخ الذين بينكم، بصفتي شيخا رفيقا لهم، وشاهدا لآلام المسيح، وشريكا في المجد الذي سيتجلى:"]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}, {"l": "Rom 8:17", "n": "", "vs": [[17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}, {"l": "2Co 1:7", "n": "", "vs": [[7, "وإن رجاءنا من أجلكم هو رجاء وطيد، إذ نعلم أنكم كما تشتركون معنا في احتمال الآلام، ستشتركون أيضا في نوال التشجيع."]]}, {"l": "2Co 4:10", "n": "", "vs": [[10, "وحيثما ذهبنا، نحمل موت يسوع دائما في أجسادنا لتظهر فيها أيضا حياة يسوع."]]}, {"l": "Phi 3:10", "n": "", "vs": [[10, "وغايتي أن أعرف المسيح وقوة قيامته والشركة في آلامه؛ والتشبه به في موته،"]]}, {"l": "Col 1:24", "n": "", "vs": [[24, "والآن أنا أفرح في الآلام التي أقاسيها لأجلكم، وأتمم في جسدي ما نقص من ضيقات المسيح لأجل جسده الذي هو الكنيسة،"]]}, {"l": "2Ti 2:12", "n": "", "vs": [[12, "إن تحملنا الآلام، فسوف نملك أيضا معه؛ إن أنكرناه، فسوف ينكرنا أيضا؛"]]}, {"l": "Rev 1:9", "n": "", "vs": [[9, "أنا، يوحنا أخاكم وشريككم في الضيقة والملكوت والصبر في يسوع، كنت منفيا في الجزيرة التي تسمى بطمس، لأجل كلمة الله وشهادة يسوع."]]}], "kwAr": "تشاركون المسيح في الآلام", "noteAr": ""}, {"kw": "when", "raw": "1Pe_1:5, 1Pe_1:6, 1Pe_1:13; Mat_16:27, Mat_25:31; Mar_8:38; Luk_17:30; 2Th_1:7-10; Rev_1:7", "note": "", "refs": [{"l": "1Pe 1:5", "n": "", "vs": [[5, "محفوظا لكم في السماوات. فإنكم محفوظون بقدرة الله العاملة من خلال إيمانكم، إلى أن تفوزوا بالخلاص النهائي المعد لكم والذي سوف يتجلى في الزمان الأخير."]]}, {"l": "1Pe 1:6", "n": "", "vs": [[6, "وهذا يدعوكم إلى الابتهاج، مع أنه لابد لكم الآن من الحزن فترة قصيرة تحت وطأة التجارب المتنوعة!"]]}, {"l": "1Pe 1:13", "n": "", "vs": [[13, "لذلك اجعلوا أذهانكم متنبهة دائما، وتيقظوا، وعلقوا رجاءكم كله على النعمة التي ستكون من نصيبكم عندما يعود يسوع المسيح ظاهرا بمجده!"]]}, {"l": "Mat 16:27", "n": "", "vs": [[27, "فإن ابن الإنسان سوف يعود في مجد أبيه مع ملائكته، فيجازي كل واحد حسب أعماله."]]}, {"l": "Mat 25:31", "n": "", "vs": [[31, "وعندما يعود ابن الإنسان في مجده ومعه جميع ملائكته، فإنه يجلس على عرش مجده،"]]}, {"l": "Mar 8:38", "n": "", "vs": [[38, "فإن أي من يستحي بي وبكلامي في هذا الجيل الفاسق الخاطيء، به يستحي ابن الإنسان عندما يعود في مجد أبيه مع الملائكة المقدسين»."]]}, {"l": "Luk 17:30", "n": "", "vs": [[30, "هكذا سيحدث في يوم ظهور ابن الإنسان."]]}, {"l": "2Th 1:7-10", "n": "", "vs": [[7, "وأن يكافئكم، أنتم الذين تتضايقون، كما يكافئنا نحن، بالراحة لدى ظهور الرب يسوع علنا من السماء، ومعه ملائكة قدرته،"], [8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."], [9, "فهؤلاء سيكابدون عقاب الهلاك الأبدي، بعيدا من حضرة الرب ومن مجد قوته،"], [10, "عندما يعود في ذلك اليوم ليتمجد في قديسيه ويكون موضع العجب عند جميع الذين آمنوا، وأنتم قد آمنتم بشهادتنا لكم!"]]}, {"l": "Rev 1:7", "n": "", "vs": [[7, "ها هو آت مع السحاب! ستراه عيون الجميع، حتى أولئك الذين طعنوه، وتنوح بسببه قبائل الأرض كلها! نعم، آمين!"]]}], "kwAr": "عند ظهور مجده", "noteAr": ""}, {"kw": "ye may", "raw": "1Pe_1:8; Isa_25:9, Isa_35:10, Isa_51:11; Mat_25:21, Mat_25:23, Mat_25:34", "note": "", "refs": [{"l": "1Pe 1:8", "n": "", "vs": [[8, "أنتم لم تروا المسيح، ولكنكم تحبونه. ومع أنكم لا ترونه الآن، فأنتم تؤمنون به وتبتهجون بفرح مجيد يفوق الوصف."]]}, {"l": "Isa 25:9", "n": "", "vs": [[9, "ويقولون في ذلك اليوم: «ها هو إلهنا الذي انتظرناه فخلصنا. هذا هو الرب الذي انتظرناه نبتهج ونفرح بخلاصه»."]]}, {"l": "Isa 35:10", "n": "", "vs": [[10, "ويرجع إليها مفديو الرب ويقبلون إلى صهيون مترنمين يكلل رؤوسهم فرح أبدي، وتغمرهم الغبطة والسرور، ويهرب الحزن والأنين."]]}, {"l": "Isa 51:11", "n": "", "vs": [[11, "سيرجع الذين افتداهم الرب ويأتون إلى صهيون بترنم، يكلل رؤوسهم فرح أبدي، فتطغى عليهم بهجة وغبطة، أما الحزن والتنهد فيهربان بعيدا."]]}, {"l": "Mat 25:21", "n": "", "vs": [[21, "فقال له سيده: حسنا فعلت أيها العبد الصالح والأمين! كنت أمينا على القليل، فسأقيمك على الكثير. ادخل إلى فرح سيدك!"]]}, {"l": "Mat 25:23", "n": "", "vs": [[23, "فقال له سيده: حسنا فعلت أيها العبد الصالح والأمين! كنت أمينا على القليل، فسأقيمك على الكثير. ادخل إلى فرح سيدك!"]]}, {"l": "Mat 25:34", "n": "", "vs": [[34, "ثم يقول الملك للذين عن يمينه: تعالوا يامن باركهم أبي، رثوا الملكوت الذي أعد لكم منذ إنشاء العالم:"]]}], "kwAr": "تفرحوا بمشاركته في الابتهاج", "noteAr": ""}], "arS": [["وإنما ", []], ["افرحوا", ["G5463"]], [": لأنكم كما ", []], ["تشاركون", ["G2841"]], [" ", []], ["المسيح", ["G5547"]], [" في ", []], ["الآلام", ["G3804"]], [" الآن، لابد أن ", []], ["تفرحوا", ["G5463"]], [" بمشاركته في ", []], ["الابتهاج", ["G21"]], [" عند ", []], ["ظهور", ["G602"]], [" ", []], ["مجده", ["G1391"]], [".", []]]}, {"c": 4, "v": 14, "text": "فإذا لحقتكم الإهانة لأنكم تحملون اسم المسيح، فطوبى لكم! لأن روح المجد، أي روح الله، يستقر عليكم.", "groups": [{"kw": "ye be", "raw": "1Pe_2:19, 1Pe_2:20, 1Pe_3:14, 1Pe_3:16", "note": "", "refs": [{"l": "1Pe 2:19", "n": "", "vs": [[19, "فما أجمل أن يتحمل الإنسان الأحزان حين يتألم مظلوما، بدافع من ضميره الخاضع لله!"]]}, {"l": "1Pe 2:20", "n": "", "vs": [[20, "فبالحقيقة، أي مجد لكم إن كنتم تصبرون وأنتم تتحملون قصاص أخطائكم؟ لا فضل لكم عند الله إلا إذا تحملتم الآلام صابرين، وأنتم تفعلون الصواب."]]}, {"l": "1Pe 3:14", "n": "", "vs": [[14, "وإن كان لابد أن تتألموا في سبيل البر، فطوبى لكم! لا تخافوا من تهديد الذين يضطهدونكم، ولا تقلقوا."]]}, {"l": "1Pe 3:16", "n": "", "vs": [[16, "على أن تفعلوا ذلك بوداعة واحترام، محافظين على طهارة ضمائركم، سالكين في المسيح سلوكا صالحا، وعندئذ يخيب الذين يوجهون إليكم التهم الكاذبة ويشتمونكم كأنكم تفعلون شرا."]]}], "kwAr": "إذا لحقتكم", "noteAr": ""}, {"kw": "reproached", "raw": "1Pe_4:4, 1Pe_4:5; Psa_49:9, Psa_89:51; Isa_51:7; Mat_5:11; Luk_6:22; Joh_7:47-52, Joh_8:48; Joh_9:28, Joh_9:34; 2Co_12:10", "note": "", "refs": [{"l": "1Pe 4:4", "n": "", "vs": [[4, "ورفاقكم في تلك العيشة سابقا يستغربون أنكم لا تركضون معهم إلى فيض هذه الخلاعة، ويجرحون سمعتكم."]]}, {"l": "1Pe 4:5", "n": "", "vs": [[5, "لكنهم سوف يؤدون الحساب أمام المسيح، المستعد أن يدين الأحياء والأموات."]]}, {"l": "Psa 49:9", "n": "", "vs": [[9, "طلبا للخلود على الأرض وتفاديا لرؤية القبر."]]}, {"l": "Psa 89:51", "n": "", "vs": [[51, "العار الذي عيرنا به أعداؤك يارب، إذ عيروا خطوات الملك الذي مسحته."]]}, {"l": "Isa 51:7", "n": "", "vs": [[7, "استمعوا إلي ياعارفي البر، أيها الشعب الذي شريعتي في قلوبكم. لا تخشوا تعيير الناس ولا ترتعبوا من شتائمهم،"]]}, {"l": "Mat 5:11", "n": "", "vs": [[11, "طوبى لكم متى أهانكم الناس واضطهدوكم، وقالوا فيكم من أجلي كل سوء كاذبين."]]}, {"l": "Luk 6:22", "n": "", "vs": [[22, "طوبى لكم متى أبغضكم الناس، وعزلوكم، وأهانوا اسمكم ونبذوه كأنه شرير، من أجل ابن الإنسان."]]}, {"l": "Joh 7:47-52", "n": "", "vs": [[47, "فردوا غاضبين: «وهل ضللتم أنتم أيضا؟"], [48, "أرأيتم أحدا من الرؤساء أو من الفريسيين آمن به؟"], [49, "أما عامة الشعب الذين يجهلون الشريعة، فاللعنة عليهم!»"], [50, "ولكن واحدا منهم، وهو نيقوديموس الذي كان قد جاء إلى يسوع ليلا،"], [51, "قال لهم: «أتسمح شريعتنا بأن يحكم على أحد دون سماع دفاعه أولا لمعرفة ذنبه؟»"], [52, "فأجابوه: «ألعلك أنت أيضا من الجليل؟ ادرس الكتاب تعلم أنه لم يطلع قط نبي من الجليل!»"]]}, {"l": "Joh 8:48", "n": "", "vs": [[48, "فقال اليهود: «ألسنا نقول الحق عندما نقول إنك سامري وإن فيك شيطانا؟»"]]}, {"l": "Joh 9:28", "n": "", "vs": [[28, "فشتموه وقالوا له: «بل أنت تلميذه ! أما نحن فتلاميذ موسى."]]}, {"l": "Joh 9:34", "n": "", "vs": [[34, "فصاحوا به: «أنت بكاملك ولد
