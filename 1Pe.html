t raised", "raw": "Act_2:24, Act_2:32, Act_3:15, Act_4:10", "note": "", "refs": [{"l": "Act 2:24", "n": "", "vs": [[24, "ولكن الله أقامه من بين الأموات ناقضا أوجاع الموت، فما كان يمكن للموت أن يبقيه في قبضته!"]]}, {"l": "Act 2:32", "n": "", "vs": [[32, "فيسوع هذا أقامه الله من الموت، ونحن جميعا شهود لذلك."]]}, {"l": "Act 3:15", "n": "", "vs": [[15, "وقتلتم واهب الحياة. ولكن الله أقامه من بين الأموات ونحن شهود لذلك."]]}, {"l": "Act 4:10", "n": "", "vs": [[10, "فاعلموا جميعا، وليعرف شعب إسرائيل كله، أنه باسم يسوع المسيح الناصري الذي صلبتموه أنتم، والذي أقامه الله من بين الأموات، باسمه يقف هذا الكسيح أمامكم في تمام الصحة!"]]}], "kwAr": "الذي أقامه من الموت", "noteAr": ""}, {"kw": "gave", "raw": "1Pe_1:11, 1Pe_3:22; Mat_28:18; Joh_3:34, Joh_5:22, Joh_5:23, Joh_13:31, Joh_13:32, Joh_17:1; Act_2:33, Act_3:13; Eph_1:20-23; Phi_2:9-11; Heb_2:9", "note": "", "refs": [{"l": "1Pe 1:11", "n": "", "vs": [[11, "واجتهدوا لمعرفة الزمان والأحوال التي كان يشير إليها روح المسيح الذي كان عاملا فيهم، عندما شهد لهم مسبقا بما ينتظر المسيح من آلام، وبما يأتي بعدها من أمجاد."]]}, {"l": "1Pe 3:22", "n": "", "vs": [[22, "الذي انطلق إلى السماء، وهو الآن جالس عن يمين الله؛ وقد جعلت الملائكة والسلطات والقوات (الروحية) خاضعة له!"]]}, {"l": "Mat 28:18", "n": "", "vs": [[18, "فتقدم يسوع وكلمهم قائلا: «دفع إلي كل سلطان في السماء وعلى الأرض."]]}, {"l": "Joh 3:34", "n": "", "vs": [[34, "لأن الذي أرسله الله يتكلم بكلام الله فإن الله يعطي الروح ليس بالمكيال."]]}, {"l": "Joh 5:22", "n": "", "vs": [[22, "والآب لا يحاكم أحدا، بل أعطى الابن سلطة القضاء كلها،"]]}, {"l": "Joh 5:23", "n": "", "vs": [[23, "ليكرم الجميع الابن كما يكرمون الآب. ومن لا يكرم الابن لا يكرم الآب الذي أرسله."]]}, {"l": "Joh 13:31", "n": "", "vs": [[31, "ولما خرج يهوذا، قال يسوع: «الآن تمجد ابن الإنسان وتمجد الله فيه."]]}, {"l": "Joh 13:32", "n": "", "vs": [[32, "وما دام الله قد تمجد فيه، فإنه سيمجده في ذاته، وسريعا سيمجده."]]}, {"l": "Joh 17:1", "n": "", "vs": [[1, "ولما أنهى يسوع هذا الحديث رفع عينيه نحو السماء، وقال: «أيها الآب، قد حانت الساعة! مجد ابنك، ليمجدك ابنك أيضا،"]]}, {"l": "Act 2:33", "n": "", "vs": [[33, "وإذ رفع إلى يمين الله، وأخذ من الآب الروح القدس الموعود به، أفاضه علينا. وما ترونه الآن وتسمعونه هو نتيجة لذلك."]]}, {"l": "Act 3:13", "n": "", "vs": [[13, "إن إله إبراهيم وإسحاق ويعقوب، إله آبائنا، قد مجد فتاه يسوع، الذي أسلمتموه أنتم للموت وأنكرتموه أمام بيلاطس، في حين كان يريد أن يطلقه."]]}, {"l": "Eph 1:20-23", "n": "", "vs": [[20, "الذي عمله في المسيح، بإقامته له من بين الأموات. وقد أجلسه عن يمينه في الأماكن السماوية،"], [21, "أرفع جدا من كل رئاسة وسلطة وقوة وسيا دة، ومن كل اسم يسمى، لا في هذا العالم وحسب، بل في ذلك الآتي أيضا."], [22, "وأخضع كل شيء تحت قدميه، وإياه جعل فوق كل شيء رأسا للكنيسة"], [23, "التي هي جسده وكماله، هو الذي يكمل الكل في الكل."]]}, {"l": "Phi 2:9-11", "n": "", "vs": [[9, "لذلك أيضا رفعه الله عاليا، وأعطاه الاسم الذي يفوق كل اسم،"], [10, "لكي تنحني سجودا لاسم يسوع كل ركبة، سواء في السماء أم على الأرض أم تحت الأرض،"], [11, "ولكي يعترف كل لسان بأن يسوع المسيح هو الرب، لمجد الله الآب."]]}, {"l": "Heb 2:9", "n": "", "vs": [[9, "إلا أننا نرى يسوع الآن مكللا بالمجد والكرامة، لأنه قاسى الموت. وذلك بعدما صار أدنى من الملائكة إلى حين، ليذوق بنعمة الله الموت عوضا عن كل واحد."]]}], "kwAr": "وأعطاه المجد", "noteAr": ""}, {"kw": "your", "raw": "Psa_42:5, Psa_146:3-5; Jer_17:7; Joh_14:1; Eph_1:12, Eph_1:13 *marg. Eph_1:15; Col_1:27; 1Ti_1:1", "note": "", "refs": [{"l": "Psa 42:5", "n": "", "vs": [[5, "لماذا أنت مكتئبة يانفسي؟ ولماذا أنت قلقة في داخلي؟ ترجي الله، فإني سأظل أحمده، لأنه عوني وإلهي."]]}, {"l": "Psa 146:3-5", "n": "", "vs": [[3, "لا تتوكلوا على الرؤساء، ولا على ابن آدم الذي لا يستطيع أن يخلصكم."], [4, "تنطلق روحه منه فيعود إلى ترابه، وآنئذ تندثر تدابيره."], [5, "طوبى لمن يكون إله يعقوب معينه، ورجاؤه في الرب إلهه،"]]}, {"l": "Jer 17:7", "n": "", "vs": [[7, "ولكن مبارك الرجل الذي يتكل على الرب، ويتخذه معتمدا له،"]]}, {"l": "Joh 14:1", "n": "", "vs": [[1, "«لا تضطرب قلوبكم. أنتم تؤمنون بالله، فآمنوا بي أيضا."]]}, {"l": "Eph 1:12", "n": "", "vs": [[12, "والغاية أن نكون سببا لمدح مجده بعدما سبق لنا أن وضعنا رجاءنا في المسيح."]]}, {"l": "Eph 1:13", "n": "*marg.", "vs": [[13, "وفيه أنتم أيضا (وضعتم رجاءكم) إذ سمعتم كلمة الحق، أي الإنجيل الذي فيه خلاصكم؛ كذلك فيه أيضا ختمتم، إذ آمنتم، بالروح القدس الموعود،"]]}, {"l": "Eph 1:15", "n": "", "vs": [[15, "لذلك أنا أيضا، وقد سمعت بما فيكم من الإيمان بالرب يسوع والمحبة لجميع القديسين،"]]}, {"l": "Col 1:27", "n": "", "vs": [[27, "الذين أراد الله أن يعلن لهم كم هو غني مجد هذا السر بين الأمم: إنه المسيح فيكم، وهو رجاء المجد؛"]]}, {"l": "1Ti 1:1", "n": "", "vs": [[1, "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"]]}], "kwAr": "غاية إيمانكم ورجائكم", "noteAr": ""}], "arS": [["أنتم الذين ", []], ["تؤمنون", ["G4100"]], [" ", []], ["بالله", ["G2316"]], [" بالمسيح الذي ", []], ["أقامه", ["G1453"]], [" من ", []], ["الموت", ["G3498"]], [" ", []], ["وأعطاه", ["G1325"]], [" ", []], ["المجد", ["G1391"]], ["، حتى يكون ", []], ["الله", ["G2316"]], [" غاية ", []], ["إيمانكم", ["G4102"]], [" ", []], ["ورجائكم", ["G1680"]], [".", []]]}, {"c": 1, "v": 22, "text": "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!", "groups": [{"kw": "ye have", "raw": "Joh_15:3, Joh_17:17, Joh_17:19; Act_15:9; Rom_6:16, Rom_6:17; 2Th_2:13; Jam_4:8", "note": "", "refs": [{"l": "Joh 15:3", "n": "", "vs": [[3, "أنتم الآن أنقياء بسبب الكلمة التي خاطبتكم بها."]]}, {"l": "Joh 17:17", "n": "", "vs": [[17, "قدسهم بالحق؛ إن كلمتك هي الحق."]]}, {"l": "Joh 17:19", "n": "", "vs": [[19, "ومن أجلهم أنا أقدس ذاتي، ليتقدسوا هم أيضا في الحق."]]}, {"l": "Act 15:9", "n": "", "vs": [[9, "فهو لم يفرق بيننا وبينهم في شيء، إذ طهر بالإيمان قلوبهم."]]}, {"l": "Rom 6:16", "n": "", "vs": [[16, "أما تعلمون أنكم عندما تقدمون أنفسكم عبيدا للطاعة، تكونون للذي تطيعونه عبيدا: إما للخطيئة فإلى الموت، وإما للطاعة فإلى البر؟"]]}, {"l": "Rom 6:17", "n": "", "vs": [[17, "إنما الشكر لله، لأنكم كنتم عبيدا للخطيئة ولكن أطعتم من القلب صيغة التعليم الذي وضعتم في عهدته."]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "Jam 4:8", "n": "", "vs": [[8, "اقتربوا إلى الله فيقترب إليكم. أيها الخاطئون نظفوا أيديكم، وياأصحاب الرأيين طهروا قلوبكم."]]}], "kwAr": "فتطهرت نفوسكم", "noteAr": ""}, {"kw": "in", "raw": "1Pe_3:1, 1Pe_4:17; Act_6:7; Rom_1:5, Rom_2:8; Gal_3:1, Gal_5:7; Heb_5:9, Heb_11:8", "note": "", "refs": [{"l": "1Pe 3:1", "n": "", "vs": [[1, "كذلك، أيتها الزوجات، اخضعن لأزواجكن. حتى وإن كان الزوج غير مؤمن بالكلمة، تجذبه زوجته إلى الإيمان، بتصرفها اللائق دون كلام،"]]}, {"l": "1Pe 4:17", "n": "", "vs": [[17, "حقا إن الوقت قد حان ليبتديء القضاء بأهل بيت الله. فإن كان القضاء يبدأ بنا أولا، فما هو مصير الذين لا يؤمنون بإنجيل الله؟"]]}, {"l": "Act 6:7", "n": "", "vs": [[7, "فزادت كلمة الله انتشارا، وتكاثر عدد التلاميذ في أورشليم، وأذعن للإيمان مجموعة كبيرة من الكهنة."]]}, {"l": "Rom 1:5", "n": "", "vs": [[5, "الذي به ولأجل اسمه نلنا نعمة ورسالة لإطاعة الإيمان بين جميع الأمم،"]]}, {"l": "Rom 2:8", "n": "", "vs": [[8, "ويكون الغضب والسخط للمخاصمين الذين يرفضون الطاعة للحق ولكنهم يخضعون للإثم."]]}, {"l": "Gal 3:1", "n": "", "vs": [[1, "ياأهل غلاطية الأغبياء! من سحر عقولكم، أنتم الذين قد رسم أمام أعينكم يسوع المسيح وهو مصلوب؟"]]}, {"l": "Gal 5:7", "n": "", "vs": [[7, "كنتم تجرون جريا جيدا، فمن أعاقكم حتى لا تذعنوا للحق؟"]]}, {"l": "Heb 5:9", "n": "", "vs": [[9, "وبذلك، أصبح مؤهلا لمهمته، فصار لجميع الذين يطيعونه مصدرا للخلاص الأبدي."]]}, {"l": "Heb 11:8", "n": "", "vs": [[8, "وبالإيمان، لبى إبراهيم دعوة الله، فترك وطنه وانطلق إلى أرض أخرى وعده الله بأن يورثه إياها. ولما خرج من بيته، كان لا يعرف أين يتوجه."]]}], "kwAr": "خضعتم للحق", "noteAr": ""}, {"kw": "through", "raw": "Rom_8:13; Gal_5:5; 2Ti_1:14; Heb_9:14", "note": "", "refs": [{"l": "Rom 8:13", "n": "", "vs": [[13, "لأنه إن عشتم بحسب الجسد، فإنكم ستموتون، ولكن إن كنتم بالروح تميتون أعمال الجسد، فستحيون."]]}, {"l": "Gal 5:5", "n": "", "vs": [[5, "فإننا، بالروح وعلى أساس الإيمان، ننتظر الرجاء الذي ينتجه البر."]]}, {"l": "2Ti 1:14", "n": "", "vs": [[14, "وحافظ على الأمانة الكريمة المودعة لديك، بالروح القدس الحال فينا."]]}, {"l": "Heb 9:14", "n": "", "vs": [[14, "فكم بالأحرى دم المسيح الذي قدم نفسه لله بروح أزلي ذبيحة لا عيب فيها، يطهر ضمائرنا من الأعمال الميتة لنعبد الله الحي."]]}], "kwAr": "بالروح", "noteAr": ""}, {"kw": "unto", "raw": "1Pe_2:17, 1Pe_3:8, 1Pe_4:8; Joh_13:34, Joh_13:35, Joh_15:17; Rom_12:9, Rom_12:10; 2Co_6:6; Eph_4:3; 1Th_4:8, 1Th_4:9; 1Ti_1:5; Heb_6:10, Heb_13:1; Jam_2:15, Jam_2:16; 2Pe_1:7; 1Jo_3:11, 1Jo_3:14-19, 1Jo_3:23, 1Jo_4:7, 1Jo_4:12, 1Jo_4:20,1Jo_4:21, 1Jo_5:1, 1Jo_5:2", "note": "", "refs": [{"l": "1Pe 2:17", "n": "", "vs": [[17, "أكرموا جميع الناس. أحبوا الإخوة. خافوا الله . أكرموا الملك."]]}, {"l": "1Pe 3:8", "n": "", "vs": [[8, "والخلاصة، كونوا جميعا متحدين في الرأي، متعاطفين بعضكم مع بعض، مبادلين أحدكم الآخر المحبة الأخوية، شفوقين، متواضعين."]]}, {"l": "1Pe 4:8", "n": "", "vs": [[8, "لكن أهم شيء هو أن تبادلوا بعضكم بعضا المحبة الشديدة. لأن المحبة تستر إساءات كثيرة."]]}, {"l": "Joh 13:34", "n": "", "vs": [[34, "وصية جديدة أنا أعطيكم: أحبوا بعضكم بعضا، كما أحببتكم أنا، تحبون بعضكم."]]}, {"l": "Joh 13:35", "n": "", "vs": [[35, "بهذا يعرف الجميع أنكم تلاميذي: إن كنتم تحبون بعضكم بعضا»."]]}, {"l": "Joh 15:17", "n": "", "vs": [[17, "فبهذا أوصيكم إذن: أن تحبوا بعضكم بعضا."]]}, {"l": "Rom 12:9", "n": "", "vs": [[9, "ولتكن المحبة بلا رياء. انفروا من الشر، والتصقوا بالخير."]]}, {"l": "Rom 12:10", "n": "", "vs": [[10, "أحبوا بعضكم بعضا محبة أخوية، مفضلين بعضكم على بعض في الكرامة."]]}, {"l": "2Co 6:6", "n": "", "vs": [[6, "في الطهارة والمعرفة وطول البال واللطف؛ في الروح القدس والمحبة الخالصة من الرياء؛"]]}, {"l": "Eph 4:3", "n": "", "vs": [[3, "مجتهدين أن تحافظوا على وحدة الروح برابطة الوفاق. فإنما هناك جسد واحد وروح واحد،"]]}, {"l": "1Th 4:8", "n": "", "vs": [[8, "إذن، من استخف بأخيه في هذا الأمر، يستخف لا بإنسان بل بالله، بذاك الذي وهبكم فعلا روحه القدوس."]]}, {"l": "1Th 4:9", "n": "", "vs": [[9, "أما المحبة الأخوية، فلستم في حاجة لأن أكتب إليكم عنها، لأنكم بأنفسكم قد تعلمتم من الله أن تحبوا بعضكم بعضا،"]]}, {"l": "1Ti 1:5", "n": "", "vs": [[5, "أما الغاية مما أوصيتك به، فهي المحبة النابعة من قلب طاهر وضمير صالح وإيمان خال من الرياء."]]}, {"l": "Heb 6:10", "n": "", "vs": [[10, "وليس الله بظالم حتى ينسى عملكم الجاد في إظهار محبتكم له عن طريق خدمتكم للقديسين إكراما لاسمه، الأمر الذي قمتم به قبلا، وتقومون به الآن!"]]}, {"l": "Heb 13:1", "n": "", "vs": [[1, "اثبتوا على المحبة الأخوية."]]}, {"l": "Jam 2:15", "n": "", "vs": [[15, "لنفرض أن أخا أو أختا كانا بحاجة شديدة إلى الثياب والطعام اليومي،"]]}, {"l": "Jam 2:16", "n": "", "vs": [[16, "وقال لهما أحدكم: «أتمنى لكما كل خير. البسا ثيابا دافئة، وكلا طعاما جيدا!» دون أن يقدم لهما ما يحتاجان إليه من ثياب وطعام، فأي نفع في ذلك؟"]]}, {"l": "2Pe 1:7", "n": "", "vs": [[7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."]]}, {"l": "1Jo 3:11", "n": "", "vs": [[11, "فالوصية التي سمعتموها منذ البداية، هي أن يحب بعضنا بعضا،"]]}, {"l": "1Jo 3:14-19", "n": "", "vs": [[14, "إن محبتنا لإخوتنا تبين لنا أننا انتقلنا من الموت إلى الحياة. فالذي لا يحب إخوته، فهو باق في الموت."], [15, "وكل من يبغض أخا له، فهو قاتل. وأنتم تعرفون أن القاتل لا تكون له حياة أبدية ثابتة فيه."], [16, "ومقياس المحبة هو العمل الذي قام به المسيح إذ بذل حياته لأجلنا. فعلينا نحن أيضا أن نبذل حياتنا لأجل إخوتنا."], [17, "وأما الذي يملك مالا يمكنه من العيش في بحبوحة، ويقسي قلبه على أحد الإخوة المحتاجين، فكيف تكون محبة الله متأصلة فيه؟"], [18, "أيها الأولاد الصغار، لا يجب أن تكون محبتنا مجرد ادعاء بالكلام واللسان، بل تكون محبة عملية حقة."], [19, "عندئذ نتأكد أننا نتصرف بحسب الحق، وتطمئن نفوسنا في حضرة الله،"]]}, {"l": "1Jo 3:23", "n": "", "vs": [[23, "وأما وصيته فهي أن نؤمن باسم ابنه يسوع المسيح، وأن يحب بعضنا بعضا كما أوصانا."]]}, {"l": "1Jo 4:7", "n": "", "vs": [[7, "أيها الأحباء، لنحب بعضنا بعضا: لأن المحبة تصدر من الله. إذن، كل من يحب، يكون مولودا من الله ويعرف الله ."]]}, {"l": "1Jo 4:12", "n": "", "vs": [[12, "إن الله لم يره أحد من الناس قط. ولكن، حين نحب بعضنا بعضا، نبين أن الله يحيا في داخلنا، وأن محبته قد اكتملت في داخلنا."]]}, {"l": "1Jo 4:20", "n": "", "vs": [[20, "فإن قال أحد: «أنا أحب الله !» ولكنه يبغض أخا له، فهو كاذب، لأنه إن كان لا يحب أخاه الذي يراه، فكيف يقدر أن يحب الله الذي لم يره قط؟"]]}, {"l": "1Jo 4:21", "n": "", "vs": [[21, "فهذه الوصية جاءتنا من المسيح نفسه: من يحب الله ، يحب أخاه!"]]}, {"l": "1Jo 5:1", "n": "", "vs": [[1, "كل من يؤمن حقا أن يسوع هو المسيح، فهو مولود من الله. ومن يحب الوالد، فلابد أن يحب المولودين منه أيضا."]]}, {"l": "1Jo 5:2", "n": "", "vs": [[2, "وما يثبت لنا محبتنا لأولاد الله هو أن نحب الله ونعمل بوصاياه."]]}], "kwAr": "محبة أخوية لا رياء فيها", "noteAr": ""}, {"kw": "see", "raw": "Phi_1:9; 1Th_3:12; 2Th_1:3; Rev_2:4", "note": "", "refs": [{"l": "Phi 1:9", "n": "", "vs": [[9, "وصلاتي لأجلكم هي هذه: أن تزداد محبتكم أكثر فأكثر في تمام المعرفة والإدراك،"]]}, {"l": "1Th 3:12", "n": "", "vs": [[12, "وليجعلكم الرب تنمون وتفيضون في المحبة لتحبوا بعضكم بعضا وجميع الناس كمحبتنا لكم،"]]}, {"l": "2Th 1:3", "n": "", "vs": [[3, "من واجبنا أن نشكر الله على الدوام لأجلكم أيها الإخوة. كما أن هذا حق: لأن إيمانكم ينمو نموا فائقا، ومحبة أحدكم للآخر تفيض بينكم جميعا."]]}, {"l": "Rev 2:4", "n": "", "vs": [[4, "ولي عليك أنك تركت محبتك الأولى!"]]}], "kwAr": "أحبوا بعضكم بعضا", "noteAr": ""}, {"kw": "a pure", "raw": "1Ti_1:3, 1Ti_4:12, 1Ti_5:2", "note": "", "refs": [{"l": "1Ti 1:3", "n": "", "vs": [[3, "كما أوصيتك لما كنت منطلقا إلى مقاطعة مقدونية، (أطلب إليك) أن تبقى في مدينة أفسس، لكي تمنع بعض المعلمين من نشر التعاليم المخالفة للتعليم الصحيح،"]]}, {"l": "1Ti 4:12", "n": "", "vs": [[12, "لا يستخف أحد بحداثة سنك. وإنما كن قدوة للمؤمنين، في الكلام والسلوك والمحبة والإيمان والطهارة."]]}, {"l": "1Ti 5:2", "n": "", "vs": [[2, "والعجائز كأنهن أمهات؛ والشابات كأنهن أخوات، بكل طهارة."]]}], "kwAr": "من قلب طاهر", "noteAr": ""}], "arS": [["وإذ قد ", []], ["خضعتم", ["G5218"]], [" ", []], ["للحق", ["G225"]], ["، ", []], ["فتطهرت", ["G48"]], [" ", []], ["نفوسكم", ["G5590"]], [" وصرتم قادرين أن ", []], ["تحبوا", ["G25"]], [" الآخرين ", []], ["محبة أخوية", ["G5360"]], [" ", []], ["لا رياء فيها", ["G505"]], ["، ", []], ["أحبوا", ["G25"]], [" ", []], ["بعضكم بعضا", ["G240"]], [" محبة ", []], ["شديدة", ["G1619"]], [" صادرة من ", []], ["قلب", ["G2588"]], [" ", []], ["طاهر", ["G2513"]], ["!", []]]}, {"c": 1, "v": 23, "text": "فأنتم قد ولدتم ولادة ثانية لا من زرع بشري يفنى، بل مما لا يفنى: بكلمة الله الحية الباقية إلى الأبد.", "groups": [{"kw": "born", "raw": "1Pe_1:3; Joh_1:3, Joh_3:5", "note": "", "refs": [{"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}, {"l": "Joh 1:3", "n": "", "vs": [[3, "به تكون كل شيء، وبغيره لم يتكون أي شيء مما تكون."]]}, {"l": "Joh 3:5", "n": "", "vs": [[5, "أجابه يسوع: «الحق الحق أقول لك: لا يمكن أن يدخل أحد ملكوت الله إلا إذا ولد من الماء والروح."]]}], "kwAr": "ولدتم ولادة ثانية", "noteAr": ""}, {"kw": "not", "raw": "Mal_2:3; Rom_1:23; 1Co_15:53, 1Co_15:54", "note": "", "refs": [{"l": "Mal 2:3", "n": "", "vs": [[3, "ها أنا أعاقب أولادكم، وأنثر روث الحيوانات التي تقدمونها لي على وجوهكم، ثم يطرحونكم معها خارجا فوق القمامة الدنسة."]]}, {"l": "Rom 1:23", "n": "", "vs": [[23, "واستبدلوا بمجد الله الخالد تماثيل لصور الإنسان الفاني والطيور وذوات الأربع والزواحف."]]}, {"l": "1Co 15:53", "n": "", "vs": [[53, "فلابد لهذا الجسم القابل للانحلال أن يلبس عدم انحلال، ولهذا الفاني أن يلبس خلودا."]]}, {"l": "1Co 15:54", "n": "", "vs": [[54, "وبعد أن يلبس هذا المنحل عدم انحلال، وهذا الفاني خلودا، تتم الكلمة التي قد كتبت: «ابتلع الموت في النصر!»"]]}], "kwAr": "لا من زرع بشري يفنى", "noteAr": ""}, {"kw": "but", "raw": "1Jo_3:9, 1Jo_5:18", "note": "", "refs": [{"l": "1Jo 3:9", "n": "", "vs": [[9, "فكل مولود من الله، لا يمارس الخطيئة، لأن طبيعة الله صارت ثابتة فيه. بل إنه لا يستطيع أن يمارس الخطيئة، لأنه مولود من الله."]]}, {"l": "1Jo 5:18", "n": "", "vs": [[18, "نحن واثقون بأن كل من ولد , {"l": "Psa 37:2", "n": "", "vs": [[2, "فإنهم مثل الحشيش سريعا يذوون، وكالعشب الأخضر يذبلون."]]}, {"l": "Psa 90:5", "n": "", "vs": [[5, "تجرف البشر كما يجرفهم الطوفان، فيزولون كالحلم عند الصباح مثل العشب الذي ينمو."]]}, {"l": "Psa 92:7", "n": "", "vs": [[7, "إذا زها الأشرار كالعشب، وأزهر جميع فاعلي الإثم فإنهم كالعشب يبادون إلى الأبد."]]}, {"l": "Psa 102:4", "n": "", "vs": [[4, "قلبي منكوب ويابس كالعشب الجاف، حتى غفلت عن أكل طعامي."]]}, {"l": "Psa 103:15", "n": "", "vs": [[15, "أيام الإنسان مثل العشب وزهر الحقل،"]]}, {"l": "Psa 129:6", "n": "", "vs": [[6, "ليكونوا كالعشب النابت على السطوح، الذي يجف قبل أن ينمو،"]]}, {"l": "Isa 40:6-8", "n": "", "vs": [[6, "وعندئذ قال صوت: «ناد برسالة». فأجبت: «أية رسالة؟» فقال: «كل ذي جسد عشب، وكل بهائه كزهر الصحراء."], [7, "يذبل العشب ويذوي الزهر لأن نفخة الرب تهب عليه. حقا إن الشعب عشب."], [8, "يذبل العشب ويذوي الزهر، أما كلمة إلهنا فتثبت إلى الأبد»."]]}, {"l": "Jam 1:10", "n": "", "vs": [[10, "وأما الغني، فعليه أن يسر بأن ما له لا يغنيه عن الله: لأن نهايته ستكون كنهاية الأعشاب المزهرة."]]}, {"l": "Jam 1:11", "n": "", "vs": [[11, "فعندما تشرق الشمس بحرها المحرق، تيبس تلك الأعشاب، فيسقط زهرها، ويتلاشى جمال منظرها. هكذا يذبل الغني في طرقه!"]]}, {"l": "Jam 4:14", "n": "", "vs": [[14, "مهلا! فأنتم لا تعرفون ماذا يحدث غدا! وما هي حياتكم؟ إنها بخار، يظهر فترة قصيرة ثم يتلاشى!"]]}, {"l": "1Jo 2:17", "n": "", "vs": [[17, "وسوف يزول العالم، وما فيه من شهوات أما الذي يعمل بإرادة الله، فيبقى إلى الأبد!"]]}], "kwAr": "الحياة البشرية كالعشب", "noteAr": ""}], "arS": [["فإن ", []], ["الحياة البشرية", ["G4561"]], [" ", []], ["كالعشب", ["G5528"]], ["، ", []], ["ومجدها", ["G1391"]], [" ", []], ["كله", ["G3956"]], [" ", []], ["كزهر", ["G438"]], [" ", []], ["العشب", ["G5528"]], [". ولابد أن ", []], ["تفنى", ["G1601"]], [" كما ", []], ["ييبس", ["G3583"]], [" ", []], ["العشب", ["G5528"]], [" ويسقط ", []], ["زهره", ["G438"]], ["!", []]]}, {"c": 1, "v": 25, "text": "أما كلمة الرب فتبقى ثابتة إلى الأبد، وهي الكلمة التي وصلت بشارتها إليكم!", "groups": [{"kw": "the word", "raw": "1Pe_1:23; Psa_102:12, Psa_102:26, Psa_119:89; Isa_40:8; Mat_5:18; Luk_16:17", "note": "", "refs": [{"l": "1Pe 1:23", "n": "", "vs": [[23, "فأنتم قد ولدتم ولادة ثانية لا من زرع بشري يفنى، بل مما لا يفنى: بكلمة الله الحية الباقية إلى الأبد."]]}, {"l": "Psa 102:12", "n": "", "vs": [[12, "أما أنت يارب فجالس على عرشك إلى الأبد، وذكرك باق مدى الدهر."]]}, {"l": "Psa 102:26", "n": "", "vs": [[26, "هي زائلة أما أنت فباق. تبلى كلها كالثوب. وتستبدلها كما يستبدل الرداء القديم بالجديد."]]}, {"l": "Psa 119:89", "n": "", "vs": [[89, "يارب كلمتك تدوم ثابتة في السماوات إلى الأبد."]]}, {"l": "Isa 40:8", "n": "", "vs": [[8, "يذبل العشب ويذوي الزهر، أما كلمة إلهنا فتثبت إلى الأبد»."]]}, {"l": "Mat 5:18", "n": "", "vs": [[18, "فالحق أقول لكم: إلى أن تزول الأرض والسماء، لن يزول حرف واحد أو نقطة واحدة من الشريعة، حتى يتم كل شيء."]]}, {"l": "Luk 16:17", "n": "", "vs": [[17, "على أن زوال السماء والأرض أسهل من سقوط نقطة واحدة من الشريعة:"]]}], "kwAr": "كلمة الرب", "noteAr": ""}, {"kw": "this", "raw": "1Pe_1:12, 1Pe_2:2; Joh_1:1, Joh_1:14; 1Co_1:21-24, 1Co_2:2, 1Co_15:1-4; Eph_2:17, Eph_3:8; Tit_1:3; 2Pe_1:19; 1Jo_1:1, 1Jo_1:3", "note": "", "refs": [{"l": "1Pe 1:12", "n": "", "vs": [[12, "ولكن الله أوحى إليهم أن اجتهادهم لم يكن لمصلحتهم هم، بل لمصلحتكم أنتم. فقد كان ذلك من أجل البشارة التي نقلها إليكم في الزمان الحاضر مبشرون يؤيدهم الروح القدس المرسل من السماء. ويالها من أمور يتمنى حتى الملائكة أن يطلعوا عليها!"]]}, {"l": "1Pe 2:2", "n": "", "vs": [[2, "وكأطفال مولودين حديثا، تشوقوا إلى اللبن الروحي النقي لكي تنموا به إلى أن تبلغوا الخلاص،"]]}, {"l": "Joh 1:1", "n": "", "vs": [[1, "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."]]}, {"l": "Joh 1:14", "n": "", "vs": [[14, "والكلمة صار بشرا، وخيم بيننا، ونحن رأينا مجده، مجد ابن وحيد عند الآب، وهو ممتلىء بالنعمة والحق."]]}, {"l": "1Co 1:21-24", "n": "", "vs": [[21, "فبما أن العالم، في حكمة الله، لم يعرف الله عن طريق الحكمة، فقد سر الله أن يخلص بجهالة البشارة الذين يؤمنون."], [22, "إذ إن اليهود يطلبون آيات، واليونانيين يبحثون عن الحكمة."], [23, "ولكننا نحن نبشر بالمسيح مصلوبا، مما يشكل عائقا عند اليهود وجهالة عند الأمم؛"], [24, "وأما عند المدعوين، سواء من اليهود أو اليونانيين، فإن المسيح هو قدر ة الله وحكمة الله."]]}, {"l": "1Co 2:2", "n": "", "vs": [[2, "إذ كنت عازما ألا أعرف شيئا بينكم إلا يسوع المسيح، وأن أعرفه مصلوبا."]]}, {"l": "1Co 15:1-4", "n": "", "vs": [[1, "على أني أذكركم، أيها الإخوة بالإنجيل الذي بشرتكم به، وقبلتموه ومازلتم قائمين فيه،"], [2, "وبه أيضا أنتم مخلصون، إن كنتم تتمسكون بالكلمة التي بشرتكم بها، إلا إذا كنتم قد آمنتم عبثا."], [3, "فالواقع أني سلمتكم، في أول الأمر، ما كنت قد تسلمته، وهو أن المسيح مات من أجل خطايانا وفقا لما في الكتاب،"], [4, "وأنه دفن، وأنه قام في اليوم الثالث وفقا لما في الكتاب،"]]}, {"l": "Eph 2:17", "n": "", "vs": [[17, "ثم جاء وبشركم بالسلام أنتم البعيدين، (كما بشر بالسلام) أولئك القريبين."]]}, {"l": "Eph 3:8", "n": "", "vs": [[8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "Tit 1:3", "n": "", "vs": [[3, "ثم بين كلمته في أوانها المعين: بالبشارة التي وضعت أمانة بين يدي بموجب أمر مخلصنا الله …"]]}, {"l": "2Pe 1:19", "n": "", "vs": [[19, "وهكذا، صارت الكلمة النبوية أكثر ثباتا عندنا. فحسنا تفعلون إن انتبهتم إلى هذه الكلمة في قلوبكم. إذ إنها أشبه بمصباح يضيء في مكان مظلم، إلى أن يطلع النهار ويظهر كوكب الصبح."]]}, {"l": "1Jo 1:1", "n": "", "vs": [[1, "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."]]}, {"l": "1Jo 1:3", "n": "", "vs": [[3, "فنحن، إذن، نخبركم بما رأيناه وسمعناه، لكي تكونوا شركاءنا. كما أن شركتنا هي مع الآب ومع ابنه يسوع المسيح."]]}], "kwAr": "وهي الكلمة التي وصلت بشارتها إليكم", "noteAr": ""}], "arS": [["أما ", []], ["كلمة", ["G4487"]], [" ", []], ["الرب", ["G2962"]], [" ", []], ["فتبقى", ["G3306"]], [" ثابتة إلى ", []], ["الأبد", ["G165"]], ["، وهي ", []], ["الكلمة", ["G4487"]], [" التي وصلت ", []], ["بشارتها", ["G2097"]], [" إليكم!", []]]}, {"c": 2, "v": 1, "text": "لذلك، تخلصوا من كل أثر للشر والخداع والرياء والحسد والذم.", "groups": [{"kw": "Wherefore", "raw": "1Pe_1:18-25", "note": "", "refs": [{"l": "1Pe 1:18-25", "n": "", "vs": [[18, "واعلموا أنه قد دفع الفدية ليحرركم من سيرة حياتكم الباطلة التي أخذتموها بالتقليد عن آبائكم. وهذه الفدية لم تكن شيئا فانيا كالفضة أو الذهب،"], [19, "بل كانت دما ثمينا، دم المسيح، ذلك الحمل الطاهر الذي ليس فيه عيب ولا دنس!"], [20, "ومع أن الله كان قد عين المسيح لهذا الغرض قبل تأسيس العالم، فهو لم يعلنه إلا في هذا الزمن الأخير لفائدتكم"], [21, "أنتم الذين تؤمنون بالله بالمسيح الذي أقامه من الموت وأعطاه المجد، حتى يكون الله غاية إيمانكم ورجائكم."], [22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"], [23, "فأنتم قد ولدتم ولادة ثانية لا من زرع بشري يفنى، بل مما لا يفنى: بكلمة الله الحية الباقية إلى الأبد."], [24, "فإن الحياة البشرية كالعشب، ومجدها كله كزهر العشب. ولابد أن تفنى كما ييبس العشب ويسقط زهره!"], [25, "أما كلمة الرب فتبقى ثابتة إلى الأبد، وهي الكلمة التي وصلت بشارتها إليكم!"]]}], "kwAr": "لذلك", "noteAr": ""}, {"kw": "laying", "raw": "1Pe_4:2; Isa_2:20, Isa_30:22; Eze_18:31, Eze_18:32; Rom_13:12; Eph_4:22-25; Col_3:5-8; Heb_12:1; Jam_1:21, Jam_5:9", "note": "", "refs": [{"l": "1Pe 4:2", "n": "", "vs": [[2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."]]}, {"l": "Isa 2:20", "n": "", "vs": [[20, "في ذلك اليوم يطرح الناس للجرذان والخفافيش أوثانهم الفضية وأصنامهم الذهبية التي صنعوها ليعبدوها،"]]}, {"l": "Isa 30:22", "n": "", "vs": [[22, "«هذه هي الطريق لا تحيدوا عنها يمينا أو يسارا اسلكوا فيها» وتدنسون كل أصنامكم الفضية والذهبية، وتلقون بها بعيدا كخرقة ملوثة بدم حائض وتقولون لها: «اذهبي بلا رجعة»."]]}, {"l": "Eze 18:31", "n": "", "vs": [[31, "اطرحوا عنكم كل ذنوبكم التي ارتكبتموها، واحصلوا لأنفسكم على قلب جديد وروح جديدة. فلماذا تنقرضون ياشعب إسرائيل؟"]]}, {"l": "Eze 18:32", "n": "", "vs": [[32, "إذ لا أسر بموت أحد، يقول السيد الرب، فتوبوا واحيوا."]]}, {"l": "Rom 13:12", "n": "", "vs": [[12, "كاد الليل أن ينتهي والنهار أن يطلع. فلنطرح أعمال الظلام، ونلبس سلاح النور"]]}, {"l": "Eph 4:22-25", "n": "", "vs": [[22, "وهو أن تخلعوا ما يتعلق بسيرتكم الماضية: الإنسان العتيق الذي يفسد نفسه بالشهوات الخداعة؛"], [23, "وتتجددوا في روح ذهنكم؛"], [24, "وتلبسوا الإنسان الجديد المخلوق على مثال الله في البر والقداسة بالحق."], [25, "لذلك اخلعوا عنكم الكذب، وتكلموا بالصدق كل واحد مع قريبه، لأننا أعضاء بعضنا لبعض."]]}, {"l": "Col 3:5-8", "n": "", "vs": [[5, "فأميتوا إذن أعضاءكم الأرضية: الزنى، النجاسة، جموح العاطفة، الشهوة الرديئة، والاشتهاء النهم الذي هو عبادة أصنام."], [6, "فبسبب هذه الخطايا ينزل غضب الله،"], [7, "وفيها سلكتم في الماضي، حين كنتم تعيشون فيها."], [8, "وأما الآن، فانزعوا عنكم، أنتم أيضا، هذه الخطايا كلها: الغضب، النقمة، الخبث، التجديف، الكلام القبيح الخارج من أفواهكم."]]}, {"l": "Heb 12:1", "n": "", "vs": [[1, "فبما أن هذا العدد الكبير من الشاهدين للإيمان، يتجمع حولنا كأنه سحابة عظيمة، فلنطرح جانبا كل ثقل يعيقنا عن التقدم، ونتخلص من تلك الخطيئة التي نتعرض للسقوط في فخها بسهولة، لكي نتمكن، نحن أيضا، أن نركض باجتهاد في السباق الممتد أمامنا،"]]}, {"l": "Jam 1:21", "n": "", "vs": [[21, "إذن، تخلصوا من كل ما في حياتكم من نجاسة وشر متزايد. وليكن قبولكم لتلك الكلمة التي غرسها الله في قلوبكم، قبولا وديعا. فهي القادرة أن تخلص نفوسكم."]]}, {"l": "Jam 5:9", "n": "", "vs": [[9, "أيها الإخوة، لا تتذمروا بعضكم على بعض، لكي لا يصدر الحكم ضدكم. تذكروا دائما أن الديان قريب جدا، إنه أمام الباب."]]}], "kwAr": "تخلصوا", "noteAr": ""}, {"kw": "malice", "raw": "1Pe_2:16; 1Co_5:8, 1Co_14:20; Eph_4:31; Tit_3:3-5", "note": "", "refs": [{"l": "1Pe 2:16", "n": "", "vs": [[16, "تصرفوا كأحرار حقا، لا كالذين يتخذون من الحرية ستارا لارتكاب الشر بل باعتبار أنكم عبيد لله."]]}, {"l": "1Co 5:8", "n": "", "vs": [[8, "فلنعيد إذن، لا بخميرة عتيقة، ولا بخميرة الخبث والشر، بل بفطير الخلاص والحق."]]}, {"l": "1Co 14:20", "n": "", "vs": [[20, "أيها الإخوة، لا تكونوا أولادا في التفكير، بل كونوا أطفالا في الشر. وأما في التفكير، فكونوا راشدين."]]}, {"l": "Eph 4:31", "n": "", "vs": [[31, "انزعوا عنكم كل حقد ونقمة وغضب وصخب وسباب وكل شر."]]}, {"l": "Tit 3:3-5", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."], [4, "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،"], [5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"]]}], "kwAr": "الشر", "noteAr": ""}, {"kw": "guile", "raw": "1Pe_2:22, 1Pe_3:10; Psa_32:2, Psa_34:13; Joh_1:47; 1Th_2:3; Rev_14:5", "note": "", "refs": [{"l": "1Pe 2:22", "n": "", "vs": [[22, "إنه لم يفعل خطيئة واحدة، ولا كان في فمه مكر."]]}, {"l": "1Pe 3:10", "n": "", "vs": [[10, "فمن أراد أن يتمتع بحياة سعيدة وأيام طيبة، فليمنع لسانه عن الشر وشفتيه عن كلام الغش."]]}, {"l": "Psa 32:2", "n": "", "vs": [[2, "طوبى للرجل الذي لا يحسب له الرب خطيئة، وليس في روحه غش."]]}, {"l": "Psa 34:13", "n": "", "vs": [[13, "فليمنع لسانه عن الشر وشفتيه عن كلام الغش"]]}, {"l": "Joh 1:47", "n": "", "vs": [[47, "ورأى يسوع نثنائيل قادما نحوه فقال عنه: «هذا إسرائيلي أصيل لا شك فيه!»"]]}, {"l": "1Th 2:3", "n": "", "vs": [[3, "فما كان وعظنا صادرا عن ضلال ولا عن نجاسة، ولا خالطه مكر،"]]}, {"l": "Rev 14:5", "n": "", "vs": [[5, "لم تنطق أفواههم بالكذب، ولا عيب فيهم."]]}], "kwAr": "الخداع", "noteAr": ""}, {"kw": "hypocrisies", "raw": "Job_36:13; Mat_7:5, Mat_15:7, Mat_23:28, Mat_24:51; Mar_12:15; Luk_6:42, Luk_11:44, Luk_12:1; Jam_3:17", "note": "", "refs": [{"l": "Job 36:13", "n": "", "vs": [[13, "أما فجار القلوب فيذخرون لأنفسهم غضبا، ولا يستغيثون بالله حين يعاقبهم."]]}, {"l": "Mat 7:5", "n": "", "vs": [[5, "يامرائي! أخرج أولا الخشبة من عينك، وعندئذ تبصر جيدا لتخرج القشة من عين أخيك."]]}, {"l": "Mat 15:7", "n": "", "vs": [[7, "أيها المراؤون! أحسن إشعياء إذ تنبأ عنكم فقال:"]]}, {"l": "Mat 23:28", "n": "", "vs": [[28, "كذلك أنتم أيضا، تبدون للناس أبرارا، ولكنكم من الداخل ممتلئون بالرياء والفسق!"]]}, {"l": "Mat 24:51", "n": "", "vs": [[51, "فيفصله ويجعل نصيبه مع المرائين، هناك يكون البكاء وصرير الأسنان!"]]}, {"l": "Mar 12:15", "n": "", "vs": [[15, "ولكنه إذ علم رياءهم قال لهم: «لماذا تجربونني؟ أحضروا إلي دينارا لأراه!»"]]}, {"l": "Luk 6:42", "n": "", "vs": [[42, "أو كيف تقدر أن تقول لأخيك: ياأخي، دعني أخرج القشة التي في عينك! وأنت لا تلاحظ الخشبة التي في عينك أنت. يامرائي، أخرج أولا الخشبة من عينك، وعندئذ تبصر جيدا لتخرج القشة التي في عين أخيك."]]}, {"l": "Luk 11:44", "n": "", "vs": [[44, "الويل لكم، فإنكم تشبهون القبور المخفية، يمشي الناس عليها وهم لا يعلمون!»"]]}, {"l": "Luk 12:1", "n": "", "vs": [[1, "وفي تلك الأثناء، إذ احتشد عشرات الألوف من الشعب حتى داس بعضهم بعضا، أخذ يقول لتلاميذه أولا: «احذروا لأنفسكم من خمير الفريسيين الذي هو الريا ء!"]]}, {"l": "Jam 3:17", "n": "", "vs": [[17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}], "kwAr": "الرياء", "noteAr": ""}, {"kw": "envies", "raw": "1Sa_18:8, 1Sa_18:9; Psa_37:1, Psa_73:3; Pro_3:31, Pro_14:30, Pro_24:1, Pro_24:19; Rom_1:29, Rom_13:13; 1Co_3:2, 1Co_3:3; 2Co_12:20; Gal_5:21-26; Jam_3:14, Jam_3:16, Jam_4:5", "note": "", "refs": [{"l": "1Sa 18:8", "n": "", "vs": [[8, "فأثار هذا غضب شاول، وساء هذا الغناء في نفسه وقال: «نسبن لداود قتل عشرات الألوف، أما أنا فنسبن لي قتل الألوف فقط! لم يبق سوى أن ينعمن عليه بالمملكة»."]]}, {"l": "1Sa 18:9", "n": "", "vs": [[9, "وشرع شاول منذ ذلك اليوم فصاعدا يراقب داود بعين ممتلئة بالغيرة."]]}, {"l": "Psa 37:1", "n": "", "vs": [[1, "لا يقلقك أمر الأشرار، ولا تحسد فاعلي الإثم،"]]}, {"l": "Psa 73:3", "n": "", "vs": [[3, "لأني حسدت المتكبرين، إذ شاهدت نجاح الأشرار."]]}, {"l": "Pro 3:31", "n": "", "vs": [[31, "لا تغر من الظالم ولا تختر طرقه."]]}, {"l": "Pro 14:30", "n": "", "vs": [[30, "القلب المطمئن يهب أعضاء الجسد حياة، والحسد ينخر في العظام."]]}, {"l": "Pro 24:1", "n": "", "vs": [[1, "لا تحسد أهل الشر، ولا تشته معاشرتهم،"]]}, {"l": "Pro 24:19", "n": "", "vs": [[19, "لا يتآكل قلبك غيظا من فاعلي الإثم، ولا تحسد الأشرار،"]]}, {"l": "Rom 1:29", "n": "", "vs": [[29, "إذ قد امتلأوا من كل إثم وشر وجشع وخبث، وشحنوا حسدا وقتلا وخصاما ومكرا وسوءا. وهم ثرثارون،"]]}, {"l": "Rom 13:13", "n": "", "vs": [[13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."]]}, {"l": "1Co 3:2", "n": "", "vs": [[2, "قد أطعمتكم لبنا لا الطعام القوي، لأنكم لم تكونوا قادرين عليه، بل إنكم حتى الآن غير قادرين."]]}, {"l": "1Co 3:3", "n": "", "vs": [[3, "فإنكم مازلتم جسديين. فمادام بينكم حسد وخصام (وانقسام)، أفلا تكونون جسديين وتسلكون وفقا للبشر؟"]]}, {"l": "2Co 12:20", "n": "", "vs": [[20, "فإني أخشى أن آتي إليكم فأجدكم في حالة لا أريدها وتجدوني في حالة لا تريدونها! أي أن يكون بينكم كثير من النزاع والحسد والحقد والتحزب والتجريح والنميمة والتكبر والبلبلة."]]}, {"l": "Gal 5:21-26", "n": "", "vs": [[21, "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!"], [22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"], [23, "والوداعة وضبط النفس. وليس من قانون يمنع مثل هذه الفضائل."], [24, "ولكن الذين صاروا خاصة للمسيح، قد صلبوا الجسد مع الأهواء والشهوات."], [25, "إذا كنا نحيا بالروح، فلنسلك أيضا بالروح."], [26, "لا نكن طامحين إلى المجد الباطل، يستفز بعضنا بعضا، ويحسد أحدنا الآخر!"]]}, {"l": "Jam 3:14", "n": "", "vs": [[14, "أما إن كانت قلوبكم مملوءة بمرارة الحسد وبالتحزب، فلا تفتخروا بحكمتكم، ولا تنكروا الحق."]]}, {"l": "Jam 3:16", "n": "", "vs": [[16, "فحيث تكون مرارة الحسد والتحزب، ينتشر الخلاف والفوضى وجميع الشرور."]]}, {"l": "Jam 4:5", "n": "", "vs": [[5, "أتظنون أن الكتاب يتكلم عبثا! هل الروح الذي حل في داخلنا يغار عن حسد؟"]]}], "kwAr": "الحسد", "noteAr": ""}, {"kw": "all evil", "raw": "1Pe_4:4; Eph_4:31; Col_3:8; 1Ti_3:11; Tit_2:3; Jam_4:11", "note": "", "refs": [{"l": "1Pe 4:4", "n": "", "vs": [[4, "ورفاقكم في تلك العيشة سابقا يستغربون أنكم لا تركضون معهم إلى فيض هذه الخلاعة، ويجرحون سمعتكم."]]}, {"l": "Eph 4:31", "n": "", "vs": [[31, "انزعوا عنكم كل حقد ونقمة وغضب وصخب وسباب وكل شر."]]}, {"l": "Col 3:8", "n": "", "vs": [[8, "وأما الآن، فانزعوا عنكم، أنتم أيضا، هذه الخطايا كلها: الغضب، النقمة، الخبث، التجديف، الكلام القبيح الخارج من أفواهكم."]]}, {"l": "1Ti 3:11", "n": "", "vs": [[11, "كذلك يجب أن تكون النساء أيضا رزينات، غير نمامات، نبيهات، أمينات في كل شيء."]]}, {"l": "Tit 2:3", "n": "", "vs": [[3, "وكذلك أن تكون العجائز ذوات سيرة موافقة للقداسة، غير نمامات ولا مدمنات للخمر، بل معلمات لما هو صالح،"]]}, {"l": "Jam 4:11", "n": "", "vs": [[11, "وياإخوتي، لا تذموا بعضكم بعضا. فمن يفعل هذا ويحكم على أخيه، يطعن في شريعة الله ويحكم عليها. فإن كنت تحكم على الشريعة، لا تكون عاملا بها بل تجعل نفسك قاضيا لها."]]}], "kwAr": "الذم", "noteAr": ""}], "arS": [["لذلك", ["G3767"]], ["، ", []], ["تخلصوا", ["G659"]], [" من ", []], ["كل", ["G3956"]], [" أثر ", []], ["للشر", ["G2549"]], [" ", []], ["والخداع", ["G1388"]], [" ", []], ["والرياء", ["G5272"]], [" ", []], ["والحسد", ["G5355"]], [" ", []], ["والذم", ["G2636"]], [".", []]]}, {"c": 2, "v": 2, "text": "وكأطفال مولودين حديثا، تشوقوا إلى اللبن الروحي النقي لكي تنموا به إلى أن تبلغوا الخلاص،", "groups": [{"kw": "newborn", "raw": "1Pe_1:23; Mat_18:3; Mar_10:15; Rom_6:4; 1Co_3:1, 1Co_14:20", "note": "", "refs": [{"l": "1Pe 1:23", "n": "", "vs": [[23, "فأنتم قد ولدتم ولادة ثانية لا من زرع بشري يفنى، بل مما لا يفنى: بكلمة الله الحية الباقية إلى الأبد."]]}, {"l": "Mat 18:3", "n": "", "vs": [[3, "وقال: «الحق أقول لكم إن كنتم لا تتحولون وتصيرون مثل الأولاد الصغار، فلن تدخلوا ملكوت السماوات أبدا."]]}, {"l": "Mar 10:15", "n": "", "vs": [[15, "الحق أقول لكم: من لا يقبل ملكوت الله كأنه ولد صغير، لن يدخله أبدا!»"]]}, {"l": "Rom 6:4", "n": "", "vs": [[4, "وبسبب ذلك دفنا معه بالمعمودية للموت، حتى كما أقيم المسيح من الأموات بمجد الآب، كذلك نسلك نحن أيضا في حياة جديدة."]]}, {"l": "1Co 3:1", "n": "", "vs": [[1, "على أني، أيها الإخوة، لم أستطع أن أكلمكم باعتباركم روحيين، بل باعتباركم جسديين وأطفالا في المسيح."]]}, {"l": "1Co 14:20", "n": "", "vs": [[20, "أيها الإخوة، لا تكونوا أولادا في التفكير، بل كونوا أطفالا في الشر. وأما في التفكير، فكونوا راشدين."]]}], "kwAr": "كأطفال مولودين حديثا", "noteAr": ""}, {"kw": "the sincere", "raw": "Psa_19:7-10; 1Co_3:2; Heb_5:12, Heb_5:13", "note": "", "refs": [{"l": "Psa 19:7-10", "n": "", "vs": [[7, "شريعة الرب كاملة تنعش النفس. شهادة الرب صادقة تجعل الجاهل حكيما."], [8, "وصايا الرب مستقيمة تفرح القلب. أمر الرب نقي ينير العينين."], [9, "مخافة الرب طاهرة ثابتة إلى الأبد، وأحكام الرب حق وعادلة كلها."], [10, "إنها أشهى من الذهب النقي، وهي أحلى من العسل بل القطر السائل من أقراص الشهد."]]}, {"l": "1Co 3:2", "n": "", "vs": [[2, "قد أطعمتكم لبنا لا الطعام القوي، لأنكم لم تكونوا قادرين عليه، بل إنكم حتى الآن غير قادرين."]]}, {"l": "Heb 5:12", "n": "", "vs": [[12, "كان يجب أن تكونوا الآن قادرين على تعليم الآخرين، بعدما مضى زمان طويل على اهتدائكم. ولكنكم مازلتم بحاجة إلى من يعلمكم حتى المباديء الأساسية لإعلانات الله. ها قد عدتم من جديد تحتاجون إلى اللبن! فأنتم غير قادرين على هضم الطعام القوي."]]}, {"l": "Heb 5:13", "n": "", "vs": [[13, "وكل من يتناول اللبن، يكون عديم الخبرة في التعليم القويم، لأنه مازال طفلا غير ناضج."]]}], "kwAr": "اللبن الروحي النقي", "noteAr": ""}, {"kw": "grow", "raw": "2Sa_23:5; Job_17:9; Pro_4:18; Hos_6:3, Hos_14:5, Hos_14:7; Mal_4:2; Eph_2:21, Eph_4:15; 2Th_1:3; 2Pe_3:18", "note": "", "refs": [{"l": "2Sa 23:5", "n": "", "vs": [[5, "أليست هكذا علاقة بيتي بالله؟ ألم يبرم معي عهدا أبديا كاملا ومؤمنا؟ ألا يكلل خلاصي بالفلاح ويضمن تحقيق رغائبي؟"]]}, {"l": "Job 17:9", "n": "", "vs": [[9, "أما الصديق فيتمسك بطريقه، ويزداد الطاهر اليدين قوة."]]}, {"l": "Pro 4:18", "n": "", "vs": [[18, "أما سبيل الأبرار فكنور متلأليء يتزايد إشراقه إلى أن يكتمل النهار،"]]}, {"l": "Hos 6:3", "n": "", "vs": [[3, "لنعرف، بل لنجد حتى نعرف الرب، فمجيئه يقين كالفجر، يقبل إلينا كإقبال المطر وكغيوث الربيع التي تروي الأرض»."]]}, {"l": "Hos 14:5", "n": "", "vs": [[5, "وأكون كالطل لإسرائيل، فيزهر كالسوسن، وتتأصل جذوره كأرز لبنان."]]}, {"l": "Hos 14:7", "n": "", "vs": [[7, "ويعودون ويقيمون في ظله ويزدهرون كالحنطة، ويزهرون كالكرمة، ويذيع ذكرهم كخمر لبنان."]]}, {"l": "Mal 4:2", "n": "", "vs": [[2, "أما أنتم أيها المتقون اسمي فتشرق عليكم شمس البر حاملة في أجنحتها الشفاء فتنطلقون متواثبين كعجول المعلف،"]]}, {"l": "Eph 2:21", "n": "", "vs": [[21, "الذي فيه يتناسق البناء كله فيرتفع ليصير هيكلا مقدسا في الرب."]]}, {"l": "Eph 4:15", "n": "", "vs": [[15, "بل نتمسك بالحق في المحبة، فننمو في كل شيء نحو من هو الرأس، أي المسيح."]]}, {"l": "2Th 1:3", "n": "", "vs": [[3, "من واجبنا أن نشكر الله على الدوام لأجلكم أيها الإخوة. كما أن هذا حق: لأن إيمانكم ينمو نموا فائقا، ومحبة أحدكم للآخر تفيض بينكم جميعا."]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}], "kwAr": "لكي تنموا به", "noteAr": ""}], "arS": [["وكأطفال", ["G1025"]], [" ", []], ["مولودين حديثا", ["G738"]], ["، ", []], ["تشوقوا", ["G1971"]], [" إلى ", []], ["اللبن", ["G1051"]], [" ", []], ["الروحي", ["G3050"]], [" ", []], ["النقي", ["G97"]], [" لكي ", []], ["تنموا", ["G837"]], [" به إلى أن تبلغوا الخلاص،", []]]}, {"c": 2, "v": 3, "text": "إن كنتم حقا قد تذوقتم أن الرب طيب!", "groups": [{"kw": "", "raw": "Psa_9:10, Psa_24:8, Psa_63:5; Son_2:3; Zec_9:17; Heb_6:5, Heb_6:6", "note": "", "refs": [{"l": "Psa 9:10", "n": "", "vs": [[10, "ويتكل عليك الذين يعرفون اسمك، لأنك يارب لم تخذل طالبيك."]]}, {"l": "Psa 24:8", "n": "", "vs": [[8, "من هو ملك المجد هذا؟ إنه الرب القدير الجبار، الرب الجبار في القتال."]]}, {"l": "Psa 63:5", "n": "", "vs": [[5, "تشبع نفسي كأنها أكلت من الشحم والدسم، ويسبحك فمي بشفتين مبتهجتين"]]}, {"l": "Son 2:3", "n": "", "vs": [[3, "(المحبوبة): حبيبي بين الفتيان كشجرة تفاح بين أشجار الوعر، تحت ظله اشتهيت أن أجلس، وثمره حلو لحلقي."]]}, {"l": "Zec 9:17", "n": "", "vs": [[17, "فما أجملهم وما أبهاهم! الحنطة تجعل الفتيان أكثر ازدهارا، والخمرة تجعل الفتيات أكثر نضرة»."]]}, {"l": "Heb 6:5", "n": "", "vs": [[5, "وذاقوا كلمة الله الطيبة، وشاهدوا المعجزات التي تظهر عظمة «العالم الآتي»،"]]}, {"l": "Heb 6:6", "n": "", "vs": [[6, "ثم ارتدوا إلى تلك الأسس 10", "n": "", "vs": [[10, "فإن كنا، ونحن أعداء، قد تصالحنا مع الله بموت ابنه، فكم بالأحرى نخلص بحياته ونحن مصالحون!"]]}, {"l": "Col 3:4", "n": "", "vs": [[4, "فعندما يظهر المسيح، وهو حياتنا، عندئذ تظهرون أنتم أيضا معه في المجد."]]}], "kwAr": "الحي", "noteAr": ""}, {"kw": "stone", "raw": "Isa_28:16; Dan_2:34, Dan_2:45; Zec_3:9, Zec_4:7", "note": "", "refs": [{"l": "Isa 28:16", "n": "", "vs": [[16, "لهذا يقول الرب: «ها أنا أضع حجر أساس في صهيون، حجر زاوية ثمينا ليكون أساسا راسخا وكل من يؤمن به لا يهرب."]]}, {"l": "Dan 2:34", "n": "", "vs": [[34, "وبينما أنت في الرؤيا انقض حجر لم يقطع بيد إنسان، وضرب التمثال على قدميه المصنوعتين من خليط الحديد والخزف فسحقهما،"]]}, {"l": "Dan 2:45", "n": "", "vs": [[45, "لأنك رأيت أن الحجر المنقض الذي لم يقطع من الجبل بيدين، قد سحق الحديد والنحاس والخزف والفضة والذهب. إن الله العظيم قد أطلع الملك عما سيحدث في الأيام الآتية؛ فالحلم حقيقة وتفسيره صدق»."]]}, {"l": "Zec 3:9", "n": "", "vs": [[9, "ها هو الحجر الذي وضعته أمام يهوشع، تحرسه سبع أعين، قد شذبته تشذيبا وكتبت عليه، يقول الرب القدير: وأزيل إثم هذه الأرض في يوم واحد."]]}, {"l": "Zec 4:7", "n": "", "vs": [[7, "أي شيء أنت أيها الجبل العظيم؟ أنت سهل أمام زربابل، وسيضع زربابل حجر الزاوية في خضم هتاف القائلين: ليباركه، ليباركه الرب»."]]}], "kwAr": "الحجر", "noteAr": ""}, {"kw": "disallowed", "raw": "Psa_118:22, Psa_118:23; Isa_8:14, Isa_8:15; Mat_21:42; Mar_12:10,Mar_12:11; Luk_20:17, Luk_20:18; Act_4:11, Act_4:12", "note": "", "refs": [{"l": "Psa 118:22", "n": "", "vs": [[22, "الحجر الذي رفضه البناؤون قد صار رأس الزاوية."]]}, {"l": "Psa 118:23", "n": "", "vs": [[23, "من لدى الرب كان هذا، وهو مدهش في أعيننا."]]}, {"l": "Isa 8:14", "n": "", "vs": [[14, "فيكون لكم مقدسا. أما لبيتي إسرائيل، فيكون حجر صدمة وصخرة عثرة، وفخا وشركا لساكني أورشليم،"]]}, {"l": "Isa 8:15", "n": "", "vs": [[15, "فيعثر بها كثيرون ويسقطون ويتحطمون ويقعون في الفخ ويقتنصون»."]]}, {"l": "Mat 21:42", "n": "", "vs": [[42, "فقال لهم يسوع: «ألم تقرأوا في الكتاب: الحجر الذي رفضه البناة، هو نفسه صار حجر الزاوية الأساسي. من الرب كان هذا، وهو عجيب في أنظارنا!"]]}, {"l": "Mar 12:10", "n": "", "vs": [[10, "أفما قرأ تم هذه الآية المكتوبة: الحجر الذي رفضه البناة، هو نفسه صار حجر الزاوية."]]}, {"l": "Mar 12:11", "n": "", "vs": [[11, "من الرب كان هذا، وهو عجيب في أنظارنا!»"]]}, {"l": "Luk 20:17", "n": "", "vs": [[17, "ولكنه نظر إليهم وقال: «إذن ما معنى هذه الآية المكتوبة: الحجر الذي رفضه البناة، هو نفسه صار حجر الزاوية؟"]]}, {"l": "Luk 20:18", "n": "", "vs": [[18, "من يقع على هذا الحجر يتكسر، ومن يقع الحجر عليه يسحقه سحقا؟»"]]}, {"l": "Act 4:11", "n": "", "vs": [[11, "يسوع هذا هو الحجر الذي رفضتموه أيها البناة، وهو نفسه صار حجر الزاوية الأساسي،"]]}, {"l": "Act 4:12", "n": "", "vs": [[12, "وليس بأحد غيره الخلاص، إذ ليس تحت السماء اسم آخر قدمه الله للبشر به يجب أن نخلص!»"]]}], "kwAr": "رفضه الناس", "noteAr": ""}, {"kw": "chosen", "raw": "Isa_42:1; Mat_12:18", "note": "", "refs": [{"l": "Isa 42:1", "n": "", "vs": [[1, "هوذا عبدي الذي أعضده، مختاري الذي ابتهجت به نفسي. وضعت روحي عليه ليسوس الأمم بالعدل."]]}, {"l": "Mat 12:18", "n": "", "vs": [[18, "«ها هو فتاي الذي اخترته، حبيبي الذي سرت به نفسي! سأضع روحي عليه، فيعلن العدل للأمم."]]}], "kwAr": "اختاره الله", "noteAr": ""}, {"kw": "precious", "raw": "1Pe_2:7, 1Pe_1:7, 1Pe_1:19; 2Pe_1:1, 2Pe_1:4", "note": "", "refs": [{"l": "1Pe 2:7", "n": "", "vs": [[7, "فإن هذا الحجر هو ثمين في نظركم، أنتم المؤمنين به. أما بالنسبة إلى الذين لا يؤمنون، «فالحجر الذي رفضه البناؤون صار هو الحجر الأساسي رأس زاوية البيت»،"]]}, {"l": "1Pe 1:7", "n": "", "vs": [[7, "إلا أن غاية هذه التجارب هي اختبار حقيقة إيمانكم. فكما تختبر النار الذهب وتنقيه، تختبر التجارب حقيقة إيمانكم، وهو أثمن جدا من الذهب الفاني. وهكذا، يكون إيمانكم مدعاة مدح وإكرام وتمجيد لكم، عندما يعود يسوع المسيح ظاهرا بمجده."]]}, {"l": "1Pe 1:19", "n": "", "vs": [[19, "بل كانت دما ثمينا، دم المسيح، ذلك الحمل الطاهر الذي ليس فيه عيب ولا دنس!"]]}, {"l": "2Pe 1:1", "n": "", "vs": [[1, "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"]]}, {"l": "2Pe 1:4", "n": "", "vs": [[4, "اللذين بهما أعطانا الله بركاته العظمى الثمينة التي كان قد وعد بها. وبهذا صار بإمكانكم أن تتخلصوا من الفساد الذي تنشره الشهوة في العالم، وتشتركوا في الطبيعة الإلهية."]]}], "kwAr": "ثمين", "noteAr": ""}], "arS": [["فأنتم قد ", []], ["أتيتم", ["G4334"]], [" إليه، باعتباره ", []], ["الحجر", ["G3037"]], [" ", []], ["الحي", ["G2198"]], [" الذي ", []], ["رفضه", ["G593"]], [" ", []], ["الناس", ["G444"]], ["، ", []], ["واختاره", ["G1588"]], [" ", []], ["الله", ["G2316"]], [" ، وهو ", []], ["ثمين", ["G1784"]], [" في نظره.", []]]}, {"c": 2, "v": 5, "text": "إذن اتحدوا به كحجارة حية، مبنيين بيتا روحيا، تكونون فيه كهنة مقدسين تقدمون لله ذبائح روحية مقبولة لديه بفضل يسوع المسيح.", "groups": [{"kw": "also", "raw": "1Co_3:16, 1Co_6:19; 2Co_6:16; Eph_2:20-22; Heb_3:6; Rev_3:12", "note": "", "refs": [{"l": "1Co 3:16", "n": "", "vs": [[16, "ألا تعرفون أنكم هيكل الله وأن روح الله ساكن فيكم؟"]]}, {"l": "1Co 6:19", "n": "", "vs": [[19, "أما تعلمون أن جسدكم هو هيكل للروح القدس الساكن فيكم والذي هو لكم من الله، وأنكم أنتم لستم ملكا لأنفسكم؟"]]}, {"l": "2Co 6:16", "n": "", "vs": [[16, "وأي وفاق لهيكل الله مع الأصنام؟ فإننا نحن هيكل الله الحي، وفقا لما قاله الله : «سأسكن في وسطهم، وأسير بينهم، وأكون إلههم وهم يكونون شعبا لي…"]]}, {"l": "Eph 2:20-22", "n": "", "vs": [[20, "وقد بنيتم على أساس الرسل والأنبياء، والمسيح يسوع نفسه هو حجر الزاوية الأساس،"], [21, "الذي فيه يتناسق البناء كله فيرتفع ليصير هيكلا مقدسا في الرب."], [22, "وفيه أنتم أيضا قد بنيتم معا فصرتم مسكنا لله بوجود الروح."]]}, {"l": "Heb 3:6", "n": "", "vs": [[6, "أما المسيح، فهو أمين بصفته ابنا يترَأس على البيت. وهذا البيت هو نحن المؤمنين، على أن نتمسك بالثقة والافتخار برجائنا تمسكا ثابتا حتى النهاية."]]}, {"l": "Rev 3:12", "n": "", "vs": [[12, "كل من ينتصر سأجعله عمودا في هيكل إلهي، فلا يخرج منه أبدا، وسأكتب عليه اسم إلهي واسم مدينة إلهي أورشليم الجديدة، التي تنزل من السماء من عند إلهي، وأكتب عليه اسمي الجديد."]]}], "kwAr": "كحجارة حية", "noteAr": ""}, {"kw": "are built", "raw": "or, be ye built", "note": "or, be ye built", "refs": [], "kwAr": "مبنيين بيتا روحيا", "noteAr": "أو: كونوا مبنيين."}, {"kw": "an holy", "raw": "1Pe_2:9; Isa_61:6, Isa_66:21; Rev_1:6, Rev_5:10, Rev_20:6", "note": "", "refs": [{"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}, {"l": "Isa 61:6", "n": "", "vs": [[6, "أما أنتم فتدعون كهنة الرب، ويسميكم الناس خدام إلهنا، فتأكلون ثروة الأمم وتتعظمون بغناهم."]]}, {"l": "Isa 66:21", "n": "", "vs": [[21, "ومنهم أصطفي كهنة ولاويين يقول الرب."]]}, {"l": "Rev 1:6", "n": "", "vs": [[6, "وجعل منا مملكة، وكهنة لله أبيه، له المجد والسلطان إلى أبد الآبدين. آمين!"]]}, {"l": "Rev 5:10", "n": "", "vs": [[10, "وجعلتهم مملكة لإلهنا وكهنة له، وسيملكون على الأرض»."]]}, {"l": "Rev 20:6", "n": "", "vs": [[6, "ما أسعد وأقدس من كان لهم نصيب في القيامة الأولى! لن يكون للموت الثاني سلطة عليهم، بل يكونون كهنة لله والمسيح، ويملكون معه ألف سنة."]]}], "kwAr": "كهنة مقدسين", "noteAr": ""}, {"kw": "spiritual", "raw": "Psa_50:14, Psa_50:23, Psa_141:2; Hos_14:2; Mal_1:11; Joh_4:22-24; Rom_12:1; Phi_2:17, Phi_4:18; Heb_13:15, Heb_13:16", "note": "", "refs": [{"l": "Psa 50:14", "n": "", "vs": [[14, "قدم لله ذبائح الحمد وأوف العلي عهودك."]]}, {"l": "Psa 50:23", "n": "", "vs": [[23, "أما من يقدم لي ذبيحة حمد فهو يمجدني، ومن يقوم طريقه أريه خلاص الله»."]]}, {"l": "Psa 141:2", "n": "", "vs": [[2, "لتكن صلاتي أمامك كالبخور، ورفع يدي مثل تقدمة المساء."]]}, {"l": "Hos 14:2", "n": "", "vs": [[2, "احملوا معكم كلام ابتهال وارجعوا إلى الرب قائلين له: «انزع إثمنا، وتقبلنا بفائق رحمتك، فنزجي إليك حمد شفاهنا كالقرابين."]]}, {"l": "Mal 1:11", "n": "", "vs": [[11, "لأنه من مشرق الشمس إلى مغربها اسمي عظيم بين الأمم، وفي كل مكان يحرق لاسمي بخور وذبائح طاهرة، لأن اسمي عظيم بين الأمم، يقول الرب القدير."]]}, {"l": "Joh 4:22-24", "n": "", "vs": [[22, "أنتم تعبدون ما تجهلون، ونحن نعبد ما نعلم، لأن الخلاص هو من عند اليهود."], [23, "فستأتي ساعة، لا بل هي الآن، حين يعبد العابدون الصادقون الآب بالروح وبالحق. لأن الآب يبتغي مثل هؤلاء العابدين."], [24, "الله روح، فلذلك لابد لعابديه من أن يعبدوه بالروح وبالحق»."]]}, {"l": "Rom 12:1", "n": "", "vs": [[1, "لذلك أتوسل إليكم أيها الإخوة، نظرا لمراحم الله، أن تقدموا له أجسادكم ذبيحة مقدسة مقبولة عنده، وهي عبادتكم بعقل."]]}, {"l": "Phi 2:17", "n": "", "vs": [[17, "حتى لو سفك دمي سكيبا فوق ذبيحة إيمانكم وخدمته، فإني أفرح وأبتهج معكم جميعا."]]}, {"l": "Phi 4:18", "n": "", "vs": [[18, "فالآن عندي كل ما يسد حاجتي ويزيد عنها. أنا في بحبوحة إذ تسلمت من أبفروديتس ما بعثتم به إلي، عطرا طيب الرائحة، ذبيحة يقبلها الله ويسر بها."]]}, {"l": "Heb 13:15", "n": "", "vs": [[15, "فبالمسيح، رئيس كهنتنا، لنقرب لله دائما ذبيحة الحمد والتسبيح، أي الثمار التي تنتجها أفواهنا المعترفة باسمه."]]}, {"l": "Heb 13:16", "n": "", "vs": [[16, "ولا تغفلوا أيضا عن عمل الخير وإعانة المحتاجين: لأن مثل هذه «الذبائح» تسر الله جدا!"]]}], "kwAr": "ذبائح روحية", "noteAr": ""}, {"kw": "acceptable", "raw": "1Pe_4:11; Phi_1:11, Phi_4:18; Col_3:17", "note": "", "refs": [{"l": "1Pe 4:11", "n": "", "vs": [[11, "فمن يتكلم، عليه أن يتكلم بما يوافق أقوال الله؛ ومن يخدم، عليه أن يخدم بموجب القوة التي يمنحها الله . وذلك لكي يتمجد الله في كل شيء، بيسوع المسيح، له المجد والسلطة إلى أبد الآبدين. آمين!"]]}, {"l": "Phi 1:11", "n": "", "vs": [[11, "كاملين في ثمار البر الآتية بيسوع المسيح، لمجد الله وحمده."]]}, {"l": "Phi 4:18", "n": "", "vs": [[18, "فالآن عندي كل ما يسد حاجتي ويزيد عنها. أنا في بحبوحة إذ تسلمت من أبفروديتس ما بعثتم به إلي، عطرا طيب الرائحة، ذبيحة يقبلها الله ويسر بها."]]}, {"l": "Col 3:17", "n": "", "vs": [[17, "ومهما كان ما تعملونه، بالقول أو بالفعل، فليجر كل شيء باسم الرب يسوع، رافعين به الشكر لله الآب."]]}], "kwAr": "مقبولة لديه", "noteAr": ""}], "arS": [["إذن اتحدوا به ", []], ["كحجارة", ["G3037"]], [" ", []], ["حية", ["G2198"]], ["، ", []], ["مبنيين", ["G3618"]], [" ", []], ["بيتا", ["G3624"]], [" ", []], ["روحيا", ["G4152"]], ["، تكونون فيه ", []], ["كه مي استضيئي، فإن نورك قد جاء، ومجد الرب أشرق عليك."], [2, "ها إن الظلمة تغمر الأرض، والليل الدامس يكتنف الشعوب، ولكن الرب يشرق عليك، ويتجلى مجده حولك،"], [3, "فتقبل الأمم إلى نورك، وتتوافد الملوك إلى إشراق ضيائك."]]}, {"l": "Mat 5:16", "n": "", "vs": [[16, "هكذا، فليضيء نوركم أمام الناس، ليروا أعمالكم الحسنة ويمجدوا أباكم الذي في السماوات."]]}, {"l": "Eph 1:6", "n": "", "vs": [[6, "بغرض مدح مجد نعمته التي بها أعطانا حظوة لديه في المحبوب:"]]}, {"l": "Eph 3:21", "n": "", "vs": [[21, "له المجد في الكنيسة، في المسيح يسوع، مدى الأجيال والدهور! آمين …"]]}, {"l": "Phi 2:15", "n": "", "vs": [[15, "لتكونوا بلا أذى وبسطاء، أولادا لله لا يعابون بشيء في وسط جيل منحرف فاسد، تضيئون بينهم كأنوار في العالم،"]]}, {"l": "Phi 2:16", "n": "", "vs": [[16, "حاملين كلمة الحياة، لتكونوا في يوم المسيح موضع فخر بأني ما سعيت باطلا ولا اجتهدت عبثا."]]}], "kwAr": "لكي تخبروا", "noteAr": ""}, {"kw": "praises", "raw": "or, virtues", "note": "or, virtues", "refs": [], "kwAr": "بفضائل", "noteAr": "أو: فضائل."}, {"kw": "who", "raw": "Isa_9:2, Isa_60:1, Isa_60:2; Mat_4:16; Luk_1:79; Act_26:28; Rom_9:24; Eph_5:8-11; Phi_3:14; Col_1:13; 1Th_5:4-8", "note": "", "refs": [{"l": "Isa 9:2", "n": "", "vs": [[2, "الشعب السالك في الظلمة أبصر نورا عظيما، والمقيمون في أرض ظلال الموت أضاء عليهم نور."]]}, {"l": "Isa 60:1", "n": "", "vs": [[1, "قومي استضيئي، فإن نورك قد جاء، ومجد الرب أشرق عليك."]]}, {"l": "Isa 60:2", "n": "", "vs": [[2, "ها إن الظلمة تغمر الأرض، والليل الدامس يكتنف الشعوب، ولكن الرب يشرق عليك، ويتجلى مجده حولك،"]]}, {"l": "Mat 4:16", "n": "", "vs": [[16, "الشعب الجالس في الظلمة، أبصر نورا عظيما، والجالسون في أرض الموت وظلاله، أشرق عليهم نور ! »"]]}, {"l": "Luk 1:79", "n": "", "vs": [[79, "ليضيء على القابعين في الظلام وظل الموت، ويهدي خطانا في طريق السلام»."]]}, {"l": "Act 26:28", "n": "", "vs": [[28, "فأجاب أغريباس: «قليلا بعد، وتقنعني بأن أصير مسيحيا!»"]]}, {"l": "Rom 9:24", "n": "", "vs": [[24, "فينا نحن الذين دعاهم لا من بين اليهود فقط بل من بين الأمم أيضا؟"]]}, {"l": "Eph 5:8-11", "n": "", "vs": [[8, "فقد كنتم في الماضي ظلاما، ولكنكم الآن نور في الرب. فاسلكوا سلوك أولاد النور."], [9, "فإن ثمر النور يكون في كل صلاح واستقامة وحق."], [10, "هكذا تختبرون الأمور التي ترضي الرب."], [11, "وعليكم ألا تكتفوا بعدم الاشتراك في أعمال الظلام العقيمة، بل بالأحرى أن تفضحوها أيضا."]]}, {"l": "Phi 3:14", "n": "", "vs": [[14, "إذ أسعى إلى الهدف، لنوال تلك الجائزة التي يدعونا الله إليها دعوة عليا في المسيح يسوع."]]}, {"l": "Col 1:13", "n": "", "vs": [[13, "هو الذي أنقذنا من سلطة الظلام ونقلنا إلى ملكوت ابن محبته"]]}, {"l": "1Th 5:4-8", "n": "", "vs": [[4, "غير أنكم أنتم، أيها الإخوة، لستم في الظلام حتى يفاجئكم ذلك اليوم كأنه لص."], [5, "فأنتم جميعا أبناء النور وأبناء النهار. إننا لسنا أهل الليل ولا أهل الظلام."], [6, "إذن، لا ننم كما ينام الآخرون، بل لنظل ساهرين وصاحين،"], [7, "فإنه في الليل ينام الذين ينامون، وفي الليل يسكر الذين يسكرون"], [8, "وأما نحن، أهل النهار، فلنظل صاحين، متخذين من الإيمان والمحبة درعا لصدورنا، ومن الرجاء بالخلاص خوذة لرؤوسنا."]]}], "kwAr": "الذي دعاكم من الظلام", "noteAr": ""}], "arS": [["فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة ", []], ["كهنة", ["G2406"]], [" ", []], ["ملوكية", ["G934"]], ["، ", []], ["وسلالة", ["G1085"]], [" ", []], ["اختارها", ["G1588"]], [" الله ، ", []], ["وأمة", ["G1484"]], [" ", []], ["كرسها", ["G40"]], [" لنفسه، ", []], ["وشعبا", ["G2992"]], [" ", []], ["امتلكه", ["G4047"]], [". وذلك لكي ", []], ["تخبروا", ["G1804"]], [" ", []], ["بفضائل", ["G703"]], [" الرب، الذي ", []], ["دعاكم", ["G2564"]], [" من ", []], ["الظلام", ["G4655"]], [" إلى ", []], ["نوره", ["G5457"]], [" ", []], ["العجيب", ["G2298"]], ["!", []]]}, {"c": 2, "v": 10, "text": "فإنكم في الماضي لم تكونوا شعبا؛ أما الآن، فأنتم «شعب الله وقد كنتم سابقا لا تتمتعون برحمة الله، أما الآن، فإنكم تتمتعون بها!»", "groups": [{"kw": "were", "raw": "Hos_1:9, Hos_1:10; Rom_9:25, Rom_9:26", "note": "", "refs": [{"l": "Hos 1:9", "n": "", "vs": [[9, "وقال الرب: «سمه لوعمي (ومعناه: ليس شعبي) لأنكم لستم شعبي وأنا لست إلهكم."]]}, {"l": "Hos 1:10", "n": "", "vs": [[10, "ومع ذلك فإن عدد بني إسرائيل يكون كرمل البحر الذي لا يكال ولا يحصى. وفي الموضع الذي قيل لهم فيه: أنتم لستم شعبي، يقال لهم: أنتم أبناء الله الحي."]]}, {"l": "Rom 9:25", "n": "", "vs": [[25, "وذلك على حد ما يقول أيضا في نبوءة هوشع: «من لم يكونوا شعبي سأدعوهم شعبي، ومن لم تكن محبوبة سأدعوها محبوبة."]]}, {"l": "Rom 9:26", "n": "", "vs": [[26, "ويكون أنه حيث قيل لهم: لستم شعبي، فهناك يدعون أبناء الله الحي»."]]}], "kwAr": "لم تكونوا شعبا", "noteAr": ""}, {"kw": "obtained", "raw": "Hos_2:23; Rom_11:6, Rom_11:7, Rom_11:30; 1Co_7:25; 1Ti_1:13; Heb_4:16", "note": "", "refs": [{"l": "Hos 2:23", "n": "", "vs": [[23, "وأزرع شعبي في الأرض لنفسي، وأرحم لورحامة (أي: لا رحمة)، وأقول: للوعمي (أي: ليس شعبي) أنت شعبي، فيقول: أنت إلهي»."]]}, {"l": "Rom 11:6", "n": "", "vs": [[6, "ولكن، بما أن ذلك قد تم بالنعمة، فليس بعد على أساس الأعمال، وإلا فليست النعمة نعمة بعد."]]}, {"l": "Rom 11:7", "n": "", "vs": [[7, "فما الخلاصة إذا؟ إن ما يسعى إليه إسرائيل لم ينالوه، بل ناله المختارون منهم، والباقون عميت بصائرهم،"]]}, {"l": "Rom 11:30", "n": "", "vs": [[30, "والواقع أنه كما كنتم أنتم في الماضي غير مطيعين لله، ولكنكم الآن نلتم الرحمة من جراء عدم طاعتهم هم،"]]}, {"l": "1Co 7:25", "n": "", "vs": [[25, "وأما العزاب، فليس عندي لهم وصية خاصة من الرب، ولكني أعطي رأيا باعتباري نلت رحمة من الرب لأكون جديرا بالثقة."]]}, {"l": "1Ti 1:13", "n": "", "vs": [[13, "مع أني كنت في الماضي مجدفا عليه، ومضطهدا ومهينا له! ولكني عوملت بالرحمة، لأني عملت ما عملته عن جهل وفي عدم إيمان."]]}, {"l": "Heb 4:16", "n": "", "vs": [[16, "فلنتقدم بثقة إلى عرش النعمة، لننال الرحمة ونجد نعمة تعيننا عند الحاجة."]]}], "kwAr": "تتمتعون برحمة الله", "noteAr": ""}], "arS": [["فإنكم في ", []], ["الماضي", ["G4218"]], [" لم تكونوا ", []], ["شعبا", ["G2992"]], ["؛ أما ", []], ["الآن", ["G3568"]], ["، فأنتم «", []], ["شعب", ["G2992"]], [" ", []], ["الله", ["G2316"]], [" وقد كنتم سابقا لا تتمتعون ", []], ["برحمة", ["G1653"]], [" الله، أما ", []], ["الآن", ["G3568"]], ["، فإنكم تتمتعون بها!»", []]]}, {"c": 2, "v": 11, "text": "أيها الأحباء، ما أنتم إلا غرباء تزورون الأرض زيارة عابرة. لذلك أطلب إليكم أن تبتعدوا عن الشهوات الجسدية التي تصارع النفس.", "groups": [{"kw": "I beseech", "raw": "Rom_12:1; 2Co_5:20, 2Co_6:1; Eph_4:1; Phm_1:9, Phm_1:10", "note": "", "refs": [{"l": "Rom 12:1", "n": "", "vs": [[1, "لذلك أتوسل إليكم أيها الإخوة، نظرا لمراحم الله، أن تقدموا له أجسادكم ذبيحة مقدسة مقبولة عنده، وهي عبادتكم بعقل."]]}, {"l": "2Co 5:20", "n": "", "vs": [[20, "فنحن إذن سفراء المسيح، وكأن الله يعظ بنا نتوسل بالنيابة عن المسيح منادين: «تصالحوا مع الله!»"]]}, {"l": "2Co 6:1", "n": "", "vs": [[1, "فبما أننا عاملون معا عند الله، نطلب ألا يكون قبولكم لنعمة الله عبثا."]]}, {"l": "Eph 4:1", "n": "", "vs": [[1, "... إذن، أنا السجين في الرب، أناشدكم أن تسلكوا سلوكا يليق بالدعوة التي إليها دعيتم،"]]}, {"l": "Phm 1:9", "n": "", "vs": [[9, "إلا أني، إكراما للمحبة، اخترت أن أقدم إليك التماسا، بصفتي بولس العجوز والسجين حاليا لأجل المسيح يسوع."]]}, {"l": "Phm 1:10", "n": "", "vs": [[10, "فألتمس منك لأجل ولدي الذي ولدته وأنا مكبل بالقيود، أونسيموس،"]]}], "kwAr": "أطلب إليكم", "noteAr": ""}, {"kw": "as", "raw": "1Pe_1:1, 1Pe_1:17; Gen_23:4, Gen_47:9; Lev_25:23; 1Ch_29:15; Psa_39:12, Psa_119:19, Psa_119:54; Heb_11:13", "note": "", "refs": [{"l": "1Pe 1:1", "n": "", "vs": [[1, "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"]]}, {"l": "1Pe 1:17", "n": "", "vs": [[17, "وما دمتم تعترفون بالله أبا لكم، وهو يحكم على كل إنسان حسب أعماله دون انحياز، فاسلكوا في مخافته مدة إقامتكم المؤقتة على الأرض."]]}, {"l": "Gen 23:4", "n": "", "vs": [[4, "«أنا غريب ونزيل بينكم، فملكوني معكم مدفنا أواري فيه ميتي من أمامي»."]]}, {"l": "Gen 47:9", "n": "", "vs": [[9, "فأجاب يعقوب فرعون: «سنوات غربتي مئة وثلاثون سنة، قليلة وشاقة، ولم تبلغ سني غربة آبائي»."]]}, {"l": "Lev 25:23", "n": "", "vs": [[23, "أما الأرض فلا تباع مطلقا لأن لي الأرض، وأنتم غرباء ونزلاء عندي."]]}, {"l": "1Ch 29:15", "n": "", "vs": [[15, "فنحن مثل آبائنا، غرباء ونزلاء أمامك، وأيامنا كالظل على الأرض، خالية من الرجاء."]]}, {"l": "Psa 39:12", "n": "", "vs": [[12, "يارب اسمع صلاتي. واصغ إلى صراخي، ولا تسكت أمام دموعي، لأني غريب عندك وعابر سبيل كجميع آبائي."]]}, {"l": "Psa 119:19", "n": "", "vs": [[19, "غريب أنا في الأرض فلا تحجب عني وصاياك."]]}, {"l": "Psa 119:54", "n": "", "vs": [[54, "صارت فرائضك ترنيمات لي في أرض غربتي."]]}, {"l": "Heb 11:13", "n": "", "vs": [[13, "هؤلاء جميعا، حافظوا على إيمانهم إلى النهاية. وماتوا قبل أن تتحقق وعود الله لهم في أثناء حياتهم. ولكنهم رأوها من بعيد، وتوقعوا تحقيقها كاملة في المستقبل. وإذ آمنوا بتلك الوعود الإلهية اعترفوا بأنهم ليسوا إلا غرباء على الأرض يزورونها زيارة عابرة."]]}], "kwAr": "غرباء", "noteAr": ""}, {"kw": "abstain", "raw": "1Pe_4:2; Luk_21:34; Act_15:20,Act_15:29; Rom_8:13, Rom_13:13, Rom_13:14; 2Co_7:1; Gal_5:16-21; 2Ti_2:22; 1Jo_2:15-17", "note": "", "refs": [{"l": "1Pe 4:2", "n": "", "vs": [[2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."]]}, {"l": "Luk 21:34", "n": "", "vs": [[34, "ولكن احذروا لأنفسكم لئلا تتثقل قلوبكم بالانغماس في اللذات وبالسكر وهموم الحياة، فيدهمكم ذلك اليوم فجأة؛"]]}, {"l": "Act 15:20", "n": "", "vs": [[20, "بل نكتب إليهم رسالة نوصيهم فيها بأن يمتنعوا عن الأكل من الذبائح النجسة المقربة للأصنام، وعن ارتكاب الزنى، وعن تناول لحوم الحيوانات المخنوقة، وعن الدم."]]}, {"l": "Act 15:29", "n": "", "vs": [[29, "إنما عليكم أن تمتنعوا عن الأكل من الذبائح المقربة للأصنام، وعن تناول الدم ولحوم الحيوانات المخنوقة، وعن ارتكاب الزنى. وتحسنون عملا إن حفظتم أنفسكم من هذه الأمور. عافاكم الله !»"]]}, {"l": "Rom 8:13", "n": "", "vs": [[13, "لأنه إن عشتم بحسب الجسد، فإنكم ستموتون، ولكن إن كنتم بالروح تميتون أعمال الجسد، فستحيون."]]}, {"l": "Rom 13:13", "n": "", "vs": [[13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."]]}, {"l": "Rom 13:14", "n": "", "vs": [[14, "وإنما البسوا الرب يسوع المسيح (تمثلوا به)، ولا تنشغلوا بالتدبير للجسد لقضاء شهواته."]]}, {"l": "2Co 7:1", "n": "", "vs": [[1, "فإذ نلنا هذه الوعود، أيها الأحباء، لنطهر أنفسنا من كل ما يدنس الجسد والروح، ونكمل القداسة في مخافة الله."]]}, {"l": "Gal 5:16-21", "n": "", "vs": [[16, "إنما أقول: اسلكوا في الروح. وعندئذ لا تتممون شهوة الجسد أبدا."], [17, "فإن الجسد يشتهي بعكس الروح، والروح بعكس الجسد؛ وهذان يقاوم أحدهما الآخر حتى إنكم لا تفعلون ما ترغبون فيه."], [18, "ولكن إذا كنتم خاضعين لقيادة الروح، فلستم في حال العبودية للشريعة."], [19, "أما أعمال الجسد فظاهرة، وهي: الزنى والنجاسة والدعارة،"], [20, "وعبادة الأصنام والسحر، والعداوة والنزاع والغيرة والغضب، والتحزب والانقسام والتعصب،"], [21, "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!"]]}, {"l": "2Ti 2:22", "n": "", "vs": [[22, "إنما اهرب من الشهوات الشبابية، واسع وراء البر والإيمان والمحبة والسلام، مشاركا الذين يدعون الرب من قلب نقي."]]}, {"l": "1Jo 2:15-17", "n": "", "vs": [[15, "لا تحبوا العالم، ولا الأشياء التي في العالم. فالذي يحب العالم، لا تكون محبة الآب في قلبه."], [16, "لأن كل ما في العالم، من شهوات الجسد وشهوات العين وترف المعيشة، ليس من الآب، بل من العالم."], [17, "وسوف يزول العالم، وما فيه من شهوات أما الذي يعمل بإرادة الله، فيبقى إلى الأبد!"]]}], "kwAr": "تبتعدوا عن الشهوات", "noteAr": ""}, {"kw": "war", "raw": "Rom_7:23, Rom_8:13; Gal_5:17, Gal_5:24; 1Ti_6:9, 1Ti_6:10; Jam_4:1", "note": "", "refs": [{"l": "Rom 7:23", "n": "", "vs": [[23, "ولكنني أرى في أعضائي ناموسا آخر يحارب الشريعة التي يريدها عقلي، ويجعلني أسيرا لناموس الخطيئة الكائن في أعضائي."]]}, {"l": "Rom 8:13", "n": "", "vs": [[13, "لأنه إن عشتم بحسب الجسد، فإنكم ستموتون، ولكن إن كنتم بالروح تميتون أعمال الجسد، فستحيون."]]}, {"l": "Gal 5:17", "n": "", "vs": [[17, "فإن الجسد يشتهي بعكس الروح، والروح بعكس الجسد؛ وهذان يقاوم أحدهما الآخر حتى إنكم لا تفعلون ما ترغبون فيه."]]}, {"l": "Gal 5:24", "n": "", "vs": [[24, "ولكن الذين صاروا خاصة للمسيح، قد صلبوا الجسد مع الأهواء والشهوات."]]}, {"l": "1Ti 6:9", "n": "", "vs": [[9, "أما الذين يرغبون في أن يصيروا أغنياء، فيسقطون في التجربة والفخ ويتورطون في كثير من الشهوات السفيهة المضرة التي تغرق الناس في الدمار والهلاك."]]}, {"l": "1Ti 6:10", "n": "", "vs": [[10, "فإن حب المال أصل لكل شر؛ وإذ سعى بعضهم إليه، ضلوا عن الإيمان، وطعنوا أنفسهم بأوجاع كثيرة."]]}, {"l": "Jam 4:1", "n": "", "vs": [[1, "من أين النزاع والخصام بينكم؟ أليس من لذاتكم تلك المتصارعة في أعضائكم؟"]]}], "kwAr": "تصارع النفس", "noteAr": ""}], "arS": [["أيها ", []], ["الأحباء", ["G27"]], ["، ما أنتم إلا ", []], ["غرباء", ["G3941"]], [" ", []], ["تزورون الأرض زيارة عابرة", ["G3927"]], [". لذلك ", []], ["أطلب", ["G3870"]], [" إليكم أن ", []], ["تبتعدوا", ["G567"]], [" عن ", []], ["الشهوات", ["G1939"]], [" ", []], ["الجسدية", ["G4559"]], [" التي ", []], ["تصارع", ["G4754"]], [" ", []], ["النفس", ["G5590"]], [".", []]]}, {"c": 2, "v": 12, "text": "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالحة يمجدون الله في يوم الافتقاد.", "groups": [{"kw": "your conversation", "raw": "1Pe_3:2; Psa_37:14, Psa_50:23; 2Co_1:12; Eph_2:3, Eph_4:22; Phi_1:27; 1Ti_4:12; Heb_13:5; Jam_3:13; 2Pe_3:11", "note": "", "refs": [{"l": "1Pe 3:2", "n": "", "vs": [[2, "وذلك حين يلاحظ سلوكها الطاهر ووقارها."]]}, {"l": "Psa 37:14", "n": "", "vs": [[14, "قد سل الأشرار سيوفهم ووتروا أقواسهم ليصرعوا المسكين والفقير، ليقتلوا السالكين طريقا مستقيمة."]]}, {"l": "Psa 50:23", "n": "", "vs": [[23, "أما من يقدم لي ذبيحة حمد فهو يمجدني، ومن يقوم طريقه أريه خلاص الله»."]]}, {"l": "2Co 1:12", "n": "", "vs": [[12, "فإن فخرنا هو هذا: شهادة ضميرنا بأننا، في قداسة الله وإخلاصه، قد سلكنا في العالم، وبخاصة تجاهكم؛ ولم يكن ذلك بحكمة بشرية بل بنعمة الله."]]}, {"l": "Eph 2:3", "n": "", "vs": [[3, "الذين بينهم نحن أيضا كنا نسلك سابقا في شهوات جسدنا، عاملين ما يريده الجسد والأفكار، وكنا بالطبيعة أولاد الغضب كالآخرين أيضا."]]}, {"l": "Eph 4:22", "n": "", "vs": [[22, "وهو أن تخلعوا ما يتعلق بسيرتكم الماضية: الإنسان العتيق الذي يفسد نفسه بالشهوات الخداعة؛"]]}, {"l": "Phi 1:27", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"]]}, {"l": "1Ti 4:12", "n": "", "vs": [[12, "لا يستخف أحد بحداثة سنك. وإنما كن قدوة للمؤمنين، في الكلام والسلوك والمحبة والإيمان والطهارة."]]}, {"l": "Heb 13:5", "n": "", "vs": [[5, "اجعلوا سيرتكم مترفعة عن حب المال، واقنعوا بما عندكم، لأن الله يقول: «لا أتركك، ولا أتخلى عنك أبدا!»"]]}, {"l": "Jam 3:13", "n": "", "vs": [[13, "أبينكم بعض الحكماء والفهماء؟ إذن، على هؤلاء أن يسلكوا سلوكا حسنا، مظهرين بأعمالهم تلك الوداعة التي تتصف بها الحكمة (الحقيقية)."]]}, {"l": "2Pe 3:11", "n": "", "vs": [[11, "ومادامت هذه الأشياء جميعا ستنحل، فكيف يجب أن تكونوا أنتم أصحاب سلوك مقدس يتصف بالتقوى،"]]}], "kwAr": "سلوككم", "noteAr": ""}, {"kw": "honest", "raw": "Rom_12:17, Rom_13:13; 2Co_8:21, 2Co_13:7; Phi_4:8; 1Th_4:12; 1Ti_2:2; Heb_13:18", "note": "", "refs": [{"l": "Rom 12:17", "n": "", "vs": [[17, "لا تردوا لأحد شرا مقابل شر، بل اجتهدوا في تقديم ما هو حسن أمام جميع الناس."]]}, {"l": "Rom 13:13", "n": "", "vs": [[13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."]]}, {"l": "2Co 8:21", "n": "", "vs": [[21, "فإننا نحرص على النزاهة لا أمام الرب فقط، بل أمام الناس أيضا."]]}, {"l": "2Co 13:7", "n": "", "vs": [[7, "ونصلي إلى الله ألا تفعلوا أي شر، لا لكي يتبين أننا نحن فاضلون، بل لكي تفعلوا أنتم ما هو حق، وإن كنا نحن كأننا فاشلون."]]}, {"l": "Phi 4:8", "n": "", "vs": [[8, "وختاما، أيها الإخوة: كل ما كان حقا، وكل ما كان شريفا، وكل ما كان عادلا، وكل ما كان طاهرا وكل ما كان مستحبا، وكل ما كان حسن السمعة، وكل ما كان فيه فضيلة وخصلة حميدة، فاشغلوا أفكاركم به."]]}, {"l": "1Th 4:12", "n": "", "vs": [[12, "عندئذ تكون سيرتكم حسنة السمعة تجاه الذين من خارج الكنيسة، ولا تكونون في حاجة إلى شيء."]]}, {"l": "1Ti 2:2", "n": "", "vs": [[2, "ولأجل الملوك وأصحاب السلطة، لكي نعيش حياة مطمئنة هادئة كلية التقوى والرصانة."]]}, {"l": "Heb 13:18", "n": "", "vs": [[18, "صلوا لأجلنا، فنحن مقتنعون بأن لنا ضميرا صالحا وراغبون في أن نحسن التصرف في كل شيء."]]}], "kwAr": "سلوكا حسنا", "noteAr": ""}, {"kw": "among", "raw": "Gen_13:7, Gen_13:8; Phi_2:15, Phi_2:16", "note": "", "refs": [{"l": "Gen 13:7", "n": "", "vs": [[7, "ونشب نزاع بين رعاة مواشي أبرام ورعاة مواشي لوط، في الوقت الذي كان فيه الكنعانيون والفرزيون يقيمون في الأرض."]]}, {"l": "Gen 13:8", "n": "", "vs": [[8, "فقال أبرام للوط: «لا يكن نزاع بيني وبينك، ولا بين رعاتي ورعاتك لأننا نحن أخوان."]]}, {"l": "Phi 2:15", "n": "", "vs": [[15, "لتكونوا بلا أذى وبسطاء، أولادا لله لا يعابون بشيء في وسط جيل منحرف فاسد، تضيئون بينهم كأنوار في العالم،"]]}, {"l": "Phi 2:16", "n": "", "vs": [[16, "حاملين كلمة الحياة، لتكونوا في يوم المسيح موضع فخر بأني ما سعيت باطلا ولا اجتهدت عبثا."]]}], "kwAr": "بين الأمم", "noteAr": ""}, {"kw": "that", "raw": "1Pe_3:1, 1Pe_3:16, 1Pe_4:14-16; Mat_5:11, Mat_10:25; Luk_6:22; Act_24:5, Act_24:6, Act_24:13, Act_25:7", "note": "", "refs": [{"l": "1Pe 3:1", "n": "", "vs": [[1, "كذلك، أيتها الزوجات، اخضعن لأزواجكن. حتى وإن كان الزوج غير مؤمن بالكلمة، تجذبه زوجته إلى الإيمان، بتصرفها اللائق دون كلام،"]]}, {"l": "1Pe 3:16", "n": "", "vs": [[16, "على أن تفعلوا ذلك بوداعة واحترام، محافظين على طهارة ضمائركم، سالكين في المسيح سلوكا صالحا، وعندئذ يخيب الذين يوجهون إليكم التهم الكاذبة ويشتمونكم كأنكم تفعلون شرا."]]}, {"l": "1Pe 4:14-16", "n": "", "vs": [[14, "فإذا لحقتكم الإهانة لأنكم تحملون اسم المسيح، فطوبى لكم! لأن روح المجد، أي روح الله، يستقر عليكم."], [15, "لا يكن بينكم من يتأ لم عقابا على شر ارتكبه: كالقتل أو السرقة، أو غيرهما من الجرائم، أو التدخل في شؤون الآخرين."], [16, "ولكن إن تألم أحدكم لأنه «مسيحي»، فعليه ألا يخجل، بل أن يمجد الله لأجل هذا الاسم!"]]}, {"l": "Mat 5:11", "n": "", "vs": [[11, "طوبى لكم متى أهانكم الناس واضطهدوكم، وقالوا فيكم من أجلي كل سوء كاذبين."]]}, {"l": "Mat 10:25", "n": "", "vs": [[25, "يكفي التلميذ أن يصير مثل معلمه، والعبد مثل سيده! إن كانوا قد لقبوا رب البيت ببعلزبول، فكم بالأحرى يلقبون أهل بيته؟"]]}, {"l": "Luk 6:22", "n": "", "vs": [[22, "طوبى لكم متى أبغضكم الناس، وعزلوكم، وأهانوا اسمكم ونبذوه كأنه شرير، من أجل ابن الإنسان."]]}, {"l": "Act 24:5", "n": "", "vs": [[5, "وجدنا هذا المتهم مخربا، يثير الفتنة بين جميع اليهود في البلاد كلها، وهو يتزعم مذهب النصارى."]]}, {"l": "Act 24:6", "n": "", "vs": [[6, "فلما حاول تدنيس هيكلنا أيضا، قبضنا عليه وأردنا أن نحاكمه بحسب شريعتنا."]]}, {"l": "Act 24:13", "n": "", "vs": [[13, "وهم لا يقدرون أن يثبتوا اتهامهم لي أمامك الآن."]]}, {"l": "Act 25:7", "n": "", "vs": [[7, "فلما حضر اجتمع حوله اليهود الذين جاءوا من أورشليم، ووجهوا إليه تهما كثيرة وخطيرة عجزوا عن إثبات صحتها."]]}], "kwAr": "فمع أنهم", "noteAr": ""}, {"kw": "whereas", "raw": "or, wherein", "note": "or, wherein", "refs": [], "kwAr": "يتهمونكم زورا بأنكم تفعلون الشر", "noteAr": "أو: فيما."}, {"kw": "they may", "raw": "Mat_5:16; Tit_2:7, Tit_2:8", "note": "", "refs": [{"l": "Mat 5:16", "n": "", "vs": [[16, "هكذا، فليضيء نوركم أمام الناس، ليروا أعمالكم الحسنة ويمجدوا أباكم الذي في السماوات."]]}, {"l": "Tit 2:7", "n": "", "vs": [[7, "جاعلا من نفسك في كل شيء قدوة للأعمال الصالحة، مظهرا في تعليمك النقاوة والوقار"]]}, {"l": "Tit 2:8", "n": "", "vs": [[8, "والكلمة الصحيحة التي لا تلام، لكي يخجل المقاوم حين لا يجد أمرا سيئا يقوله فينا."]]}], "kwAr": "حين يلاحظون أعمالكم الصالحة", "noteAr": ""}, {"kw": "glorify", "raw": "1Pe_4:11; Psa_50:23; Rom_15:9; 1Co_14:25", "note": "", "refs": [{"l": "1Pe 4:11", "n": "", "vs": [[11, "فمن يتكلم، عليه أن يتكلم بما يوافق أقوال الله؛ ومن يخدم، عليه أن يخدم بموجب القوة التي يمنحها الله . وذلك لكي يتمجد الله في كل شيء، بيسوع المسيح، له المجد والسلطة إلى أبد الآبدين. آمين!"]]}, {"l": "Psa 50:23", "n": "", "vs": [[23, "أما من يقدم لي ذبيحة حمد فهو يمجدني، ومن يقوم طريقه أريه خلاص الله»."]]}, {"l": "Rom 15:9", "n": "", "vs": [[9, "وإن الأمم يمجدون الله على الرحمة، وفقا لما قد كتب: «لهذا أعترف لك بين الأمم وأرتل لاسمك!»"]]}, {"l": "1Co 14:25", "n": "", "vs": [[25, "وإذ تنكشف خبايا قلبه، يخر على وجهه ساجدا لله، معترفا بأن الله فيكم حقا."]]}], "kwAr": "يمجدون الله", "noteAr": ""}, {"kw": "the day", "raw": "Luk_1:68, Luk_19:44; Act_15:14", "note": "", "refs": [{"l": "Luk 1:68", "n": "", "vs": [[68, "«تبارك الرب إله إسرائيل، لأنه تفقد شعبه وعمل له فداء،"]]}, {"l": "Luk 19:44", "n": "", "vs": [[44, "ويهدمونك على أبنائك الذين فيك، فلا يتركون فيك حجرا فوق حجر: لأنك لم تعرفي وقت افتقاد الله لك»."]]}, {"l": "Act 15:14", "n": "", "vs": [[14, "»استمعوا لي أيها الإخوة: أخبر كم سمعان كيف تفقد الله منذ البداية غير اليهود ليتخذ من بينهم شعبا يحمل اسمه؛"]]}], "kwAr": "يوم الافتقاد", "noteAr": ""}], "arS": [["وليكن ", []], ["سلوككم", ["G391"]], [" بين ", []], ["الأمم", ["G1484"]], [" سلوكا ", []], ["حسنا", ["G2570"]], [". فمع أنهم ", []], ["يتهمونكم", ["G2635"]], [" زورا بأنكم تفعلون ", []], ["الشر", ["G2555"]], ["، فحين ", []], ["يلاحظون", ["G2029"]], [" ", []], ["أعمالكم", ["G2041"]], [" ", []], ["الصالحة", ["G2570"]], [" ", []], ["يمجدون", ["G1392"]], [" ", []], ["الله", ["G2316"]], [" في ", []], ["يوم", ["G2250"]], [" ", []], ["الافتقاد", ["G1984"]], [".", []]]}, {"c": 2, "v": 13, "text": "فإكراما للرب، اخضعوا لكل نظام يدير شؤون الناس: للملك، باعتباره صاحب السلطة العليا،", "groups": [{"kw": "", "raw": "Pro_17:11, Pro_24:21; Jer_29:7; Mat_22:21; Mar_12:17; Luk_20:25; Rom_13:1-7; Eph_5:21; 1Ti_2:1, 1Ti_2:2; Tit_3:1; 2Pe_2:10; Jud_1:8-10", "note": "", "refs": [{"l": "Pro 17:11", "n": "", "vs": [[11, "الشر ير يسعى فقط للتمرد، فينقض عليه رسول قاس."]]}, {"l": "Pro 24:21", "n": "", "vs": [[21, "ياابني اتق الرب والملك، ولا تعاشر المتقلبين،"]]}, {"l": "Jer 29:7", "n": "", "vs": [[7, "والتمسوا سلام المدينة التي سبيتكم إليها، وصلوا من أجلها إلى الرب لأن سلامكم يتوقف على سلامها."]]}, {"l": "Mat 22:21", "n": "", "vs": [[21, "أجابوه: «للقيصر!» فقال لهم: «إذن، أعطوا ما للقيصر للقيصر، وما لله لله»"]]}, {"l": "Mar 12:17", "n": "", "vs": [[17, "فرد عليهم قائلا: «أعطوا ما للقيصر للقيصر، وما لله لله!» فذهلوا منه."]]}, {"l": "Luk 20:25", "n": "", "vs": [[25, "فقال لهم: «إذن، أعطوا ما للقيصر للقيصر، وما لله لله»."]]}, {"l": "Rom 13:1-7", "n": "", "vs": [[1, "على كل نفس أن تخضع للسلطات الحاكمة. فلا سلطة إلا من عند الله، والسلطات القائمة مرتبة من قبل الله."], [2, "حتى إن من يقاوم السلطة، يقاوم ترتيب الله، والمقاومون سيجلبون العقاب على أنفسهم."], [3, "فإن الحكام لا يخافهم من يفعل الصلاح بل من يفعل الشر. أفترغب إذن في أن تكون غير خائف من السلطة؟ اعمل ما هو صالح، فتكون ممدوحا عندها،"], [4, "لأنها خادمة الله لك لأجل الخير. أما إن كنت تعمل الشر فخف، لأن السلطة لا تحمل السيف عبثا، إذ إنها خادمة الله، وهي التي تنتقم لغضبه ممن يفعل الشر."], [5, "ولذلك، فمن الضروري أن تخضعوا، لا اتقاء للغضب فقط، بل مراعاة للضمير أيضا."], [6, "فلهذا السبب تدفعون الضرائب أيضا، لأن رجال السلطة هم خدام لله يواظبون على هذا العمل بعينه."], [7, "فأدوا لكل واحد حقه: الضريبة لصاحب الضريبة والجزية لصاحب الجزية، والاحترام لصاحب الاحترام، والإكرام لصاحب الإكرام."]]}, {"l": "Eph 5:21", "n": "", "vs": [[21, "خاضعين بعضكم لبعض في مخافة المسيح."]]}, {"l": "1Ti 2:1", "n": "", "vs": [[1, "فأطلب، قبل كل شيء، أن تقيموا الطلبات الحارة والصلوات والتضرعات والتشكرات لأجل جميع الناس،"]]}, {"l": "1Ti 2:2", "n": "", "vs": [[2, "ولأجل الملوك وأصحاب السلطة، لكي نعيش حياة مطمئنة هادئة كلية التقوى والرصانة."]]}, {"l": "Tit 3:1", "n": "", "vs": [[1, "ذكر المؤمنين أن يخضعوا للحكام والسلطات، ويطيعوا القانون، ويكونوا مستعدين لكل عمل صالح،"]]}, {"l": "2Pe 2:10", "n": "", "vs": [[10, "وما أشد العقاب، وبخاصة على الذين ينجرفون وراء الميول الجسدية، مستجيبين لشهوة النجاسة، ومحتقرين سيادة الله! ثم إنهم وقحون، معجبون بأنفسهم، لا يخافون أن يتكلموا بالشتم والإهانة على أصحاب الأمجاد."]]}, {"l": "Jud 1:8-10", "n": "", "vs": [[8, "ومع ذلك، فإن أولئك المعلمين المتوهمين يسيرون في الطريق التي سار فيها أهل تلك المدن. إذ يلوثون أجسادهم بالنجاسة، ويحتقرون السيادة الإلهية، ويتكلمون بالإهانة على الكائنات المجيدة!"], [9, "فحتى ميخائيل، وهو رئيس ملائكة، لم يجرؤ أن يحكم على إبليس بكلام مهين عندما خاصمه وتجادل معه بخصوص جثمان موسى، وإنما اكتفى بالقول له: «ليزجرك الرب!»"], [10, "ولكن هؤلاء المعلمين يتكلمون كلاما مهينا على أمور لا يعرفونها. وأما ما يفهمونه بالغريزة، كالحيوانات غير العاقلة، فإنهم به يدمرون أنفسهم."]]}], "kwAr": "", "noteAr": ""}], "arS": [["فإكراما ", []], ["للرب", ["G2962"]], ["، ", []], ["اخضعوا", ["G5293"]], [" 12", "n": "", "vs": [[12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالحة يمجدون الله في يوم الافتقاد."]]}, {"l": "Job 5:16", "n": "", "vs": [[16, "فيصبح للمسكين رجاء، والظلم يسد فمه."]]}, {"l": "Psa 107:42", "n": "", "vs": [[42, "يرى المستقيمون هذا ويفرحون، أما الأثمة فيخرسون."]]}, {"l": "Tit 2:8", "n": "", "vs": [[8, "والكلمة الصحيحة التي لا تلام، لكي يخجل المقاوم حين لا يجد أمرا سيئا يقوله فينا."]]}], "kwAr": "أن تفعلوا الخير", "noteAr": ""}, {"kw": "the ignorance", "raw": "1Ti_1:13; 2Pe_2:12; Jud_1:10", "note": "", "refs": [{"l": "1Ti 1:13", "n": "", "vs": [[13, "مع أني كنت في الماضي مجدفا عليه، ومضطهدا ومهينا له! ولكني عوملت بالرحمة، لأني عملت ما عملته عن جهل وفي عدم إيمان."]]}, {"l": "2Pe 2:12", "n": "", "vs": [[12, "حقا إن هؤلاء المعلمين الدجالين الذين يتكلمون كلاما مهينا في أمور يجهلونها، يشبهون الحيوانات المفترسة غير العاقلة، المولودة ليصطادها الناس ويقتلوها. فلابد أن يهلكوا مثلها."]]}, {"l": "Jud 1:10", "n": "", "vs": [[10, "ولكن هؤلاء المعلمين يتكلمون كلاما مهينا على أمور لا يعرفونها. وأما ما يفهمونه بالغريزة، كالحيوانات غير العاقلة، فإنهم به يدمرون أنفسهم."]]}], "kwAr": "جهالة", "noteAr": ""}, {"kw": "foolish", "raw": "Deu_32:6; Job_2:10; Psa_5:5; Pro_9:6; Jer_4:22; Mat_7:26, Mat_25:2; Rom_1:21; Gal_3:1; Tit_3:3", "note": "", "refs": [{"l": "Deu 32:6", "n": "", "vs": [[6, "أبهذا تكافئون الرب أيها الشعب الأحمق الغبي؟ أليس هو أباكم وخالقكم الذي عملكم وكونكم؟"]]}, {"l": "Job 2:10", "n": "", "vs": [[10, "فأجابها: «أنت تتكلمين كالجاهلات! أنقبل الخير من عند الله والشر لا نقبل؟». في هذا كله لم ترتكب شفتا أيوب خطأ في حق الله."]]}, {"l": "Psa 5:5", "n": "", "vs": [[5, "لا يمثل المتغطرسون أمامك، فإنك تبغض جميع فاعلي الإثم،"]]}, {"l": "Pro 9:6", "n": "", "vs": [[6, "انبذوا الجهالة فتحيوا، واسلكوا سبيل الفهم»."]]}, {"l": "Jer 4:22", "n": "", "vs": [[22, "إن قومي حمقى لا يعرفونني. هم أبناء أغبياء مجردون من الفهم، حاذقون في ارتكاب الشر، وجهلاء في صنع الخير»."]]}, {"l": "Mat 7:26", "n": "", "vs": [[26, "وأي من
