6:24", "n": "", "vs": [[24, "ثم قال يسوع لتلاميذه: «إن أراد أحد أن يسير ورائي، فلينكر نفسه ويحمل صليبه ويتبعني."]]}, {"l": "Mar 8:34", "n": "", "vs": [[34, "ثم دعا الجمع مع تلاميذه، وقال لهم: «إن أراد أحد أن يسير ورائي، فلينكر نفسه، ويحمل صليبه، ويتبعني."]]}, {"l": "Mar 8:35", "n": "", "vs": [[35, "فأي من أراد أن يخلص نفسه، يخسرها. ولكن من يخسر نفسه من أجلي ومن أجل الإنجيل، فهو يخلصها."]]}, {"l": "Luk 9:23-25", "n": "", "vs": [[23, "ثم قال للجميع: «إن أراد أحد أن يسير ورائي، فلينكر نفسه ويحمل صليبه كل يوم ويتبعني."], [24, "فأي من أراد أن يخلص نفسه، يخسرها؛ ولكن من يخسر نفسه من أجلي، فهو يخلصها."], [25, "فماذا ينتفع الإنسان لو ربح العالم كله وخسر نفسه أو أهلكها؟"]]}, {"l": "Luk 14:26", "n": "", "vs": [[26, "«إن جاء إلي أحد، ولم يبغض أباه وأمه وزوجته وأولاده وإخوته وأخواته، بل نفسه أيضا، فلا يمكنه أن يكون تلميذا لي."]]}, {"l": "Luk 14:27", "n": "", "vs": [[27, "ومن لا يحمل صليبه ويتبعني، فلا يمكنه أن يكون تلميذا لي."]]}, {"l": "Joh 16:33", "n": "", "vs": [[33, "أخبرتكم بهذا كله ليكون لكم في سلام. فإنكم في العالم ستقاسون الضيق. ولكن تشجعوا، فأنا قد انتصرت على العالم!»"]]}, {"l": "Act 9:16", "n": "", "vs": [[16, "وسأريه كم ينبغي أن يتألم من أجل اسمي!»"]]}, {"l": "Act 14:22", "n": "", "vs": [[22, "وفي هذه الأماكن كلها كانا يشددان عزيمة التلاميذ، ويحثانهم على الثبات في الإيمان، مؤكدين لهم أن دخول ملكوت الله يقتضي أن نقاسي صعوبات كثيرة."]]}, {"l": "1Th 3:3", "n": "", "vs": [[3, "حتى لا يتزعزع أحد منكم من جراء هذه الضيقات. فإنكم تعلمون أننا معينون لذلك؛"]]}, {"l": "1Th 4:2", "n": "", "vs": [[2, "فإنكم تعرفون الوصايا التي لقناكم إياها من قبل الرب يسوع."]]}, {"l": "2Ti 3:12", "n": "", "vs": [[12, "وحقا، إن جميع الذين يعزمون أن يعيشوا عيشة التقوى في المسيح يسوع يضطهدون."]]}], "kwAr": "دعاكم", "noteAr": ""}, {"kw": "because", "raw": "1Pe_2:24, 1Pe_3:18, 1Pe_4:1; Luk_24:26; Act_17:3; Heb_2:10", "note": "", "refs": [{"l": "1Pe 2:24", "n": "", "vs": [[24, "وهو نفسه حمل خطايانا في جسده (عندما مات مصلوبا) على الخشبة، لكي نموت بالنسبة للخطايا فنحيا حياة البر. وبجراحه هو تم لكم الشفاء،"]]}, {"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}, {"l": "1Pe 4:1", "n": "", "vs": [[1, "فبما أن المسيح قد تحمل الآلام الجسمية لأجلكم، سلحوا أنفسكم بالاستعداد دائما لتحمل الآلام. فإن من يتحمل الآلام الجسمية، يكون قد قاطع الخطيئة."]]}, {"l": "Luk 24:26", "n": "", "vs": [[26, "أما كان لابد أن يعاني المسيح هذه الآلام ثم يدخل إلى مجده؟»"]]}, {"l": "Act 17:3", "n": "", "vs": [[3, "وشرح لهم مبينا أن المسيح كان لابد أن يتألم ويقوم من بين الأموات، وأن «المسيح الذي تنتظرونه هو يسوع الذي أبشركم به الآن!»"]]}, {"l": "Heb 2:10", "n": "", "vs": [[10, "فلما قصد الله ، الذي من أجله كل شيء وبه كل شيء، أن يحضر إلى المجد أبناء كثيرين، كان من اللائق أن يجعل قائدهم إلى الخلاص مؤهلا لإكمال مهمته عن طريق الآلام."]]}], "kwAr": "فالمسيح الذي تألم", "noteAr": ""}, {"kw": "for us", "raw": "Some read, for you. 1Pe_1:20", "note": "Some read, for you. 1Pe_1:20", "refs": [{"l": "1Pe 1:20", "n": "", "vs": [[20, "ومع أن الله كان قد عين المسيح لهذا الغرض قبل تأسيس العالم، فهو لم يعلنه إلا في هذا الزمن الأخير لفائدتكم"]]}], "kwAr": "لأجلكم", "noteAr": "بعض النسخ تقرأ: لأجلكم."}, {"kw": "leaving", "raw": "Psa_85:13; Joh_13:15; Rom_8:29; 1Co_11:1; Eph_5:2; Phi_2:5; 1Jo_2:6; 1Jo_3:16; Rev_12:11", "note": "", "refs": [{"l": "Psa 85:13", "n": "", "vs": [[13, "يتقدمه البر، ويمهد الطريق لخطواته."]]}, {"l": "Joh 13:15", "n": "", "vs": [[15, "فقد قدمت لكم مثالا لكي تعملوا مثل ما عملت أنا لكم."]]}, {"l": "Rom 8:29", "n": "", "vs": [[29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."]]}, {"l": "1Co 11:1", "n": "", "vs": [[1, "فاقتدوا بي كما أقتدي أنا بالمسيح!"]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "Phi 2:5", "n": "", "vs": [[5, "فليكن فيكم هذا الفكر الذي هو أيضا في المسيح يسوع."]]}, {"l": "1Jo 2:6", "n": "", "vs": [[6, "كل من يعترف أنه ثابت في المسيح، يلتزم أن يسلك كما سلك المسيح!"]]}, {"l": "1Jo 3:16", "n": "", "vs": [[16, "ومقياس المحبة هو العمل الذي قام به المسيح إذ بذل حياته لأجلنا. فعلينا نحن أيضا أن نبذل حياتنا لأجل إخوتنا."]]}, {"l": "Rev 12:11", "n": "", "vs": [[11, "وهم قد انتصروا عليه بدم الحمل وبالكلمة التي شهدوا لها، فلم تكن حياتهم عزيزة لديهم، حتى إنهم ماتوا."]]}], "kwAr": "القدوة", "noteAr": ""}], "arS": [["لأن الله ", []], ["دعاكم", ["G2564"]], [" إلى الاشتراك في هذا النوع من الآلام. ", []], ["فالمسيح", ["G5547"]], ["، الذي ", []], ["تألم", ["G3958"]], [" ", []], ["لأجلكم", ["G5228"]], ["، هو ", []], ["القدوة", ["G5261"]], [" التي تقتدون بها. ", []], ["فسيروا", ["G1872"]], [" على ", []], ["آثار خطواته", ["G2487"]], [":", []]]}, {"c": 2, "v": 22, "text": "إنه لم يفعل خطيئة واحدة، ولا كان في فمه مكر.", "groups": [{"kw": "did", "raw": "Isa_53:9; Mat_27:4, Mat_27:19, Mat_27:23, Mat_27:24; Luk_23:41, Luk_23:47; Joh_8:46; 2Co_5:21; Heb_4:15, Heb_7:26, Heb_7:27, Heb_9:28; 1Jo_2:1, 1Jo_3:5", "note": "", "refs": [{"l": "Isa 53:9", "n": "", "vs": [[9, "جعلوا قبره مع الأشرار، ومع ثري عند موته. مع أنه لم يرتكب جورا، ولم يكن في فمه غش."]]}, {"l": "Mat 27:4", "n": "", "vs": [[4, "وقال: «قد أخطأت إذ سلمتكم دما بريئا». فأجابوه: «ليس هذا شأننا نحن، بل هو شأنك أنت!»"]]}, {"l": "Mat 27:19", "n": "", "vs": [[19, "وفيما هو جالس على منصة القضاء، أرسلت إليه زوجته تقول: «إياك وذلك البار! فقد تضايقت اليوم كثيرا في حلم بسببه»."]]}, {"l": "Mat 27:23", "n": "", "vs": [[23, "فسأل الحاكم: «وأي شر فعل؟» فازدادوا صراخا: «ليصلب!»"]]}, {"l": "Mat 27:24", "n": "", "vs": [[24, "فلما رأى بيلاطس أنه لا فائدة، وأن فتنة تكاد تنشب بالأحرى، أخذ ماء وغسل يديه أمام الجمع، وقال: «أنا بريء من دم هذا البار. فانظروا أنتم في الأمر!»"]]}, {"l": "Luk 23:41", "n": "", "vs": [[41, "أما نحن فعقوبتنا عادلة لأننا ننال الجزاء العادل لقاء ما فعلنا. وأما هذا الإنسان، فلم يفعل شيئا في غير محله!»"]]}, {"l": "Luk 23:47", "n": "", "vs": [[47, "فلما رأى قائد المئة ما حدث، مجد الله قائلا: «بالحقيقة كان هذا الإنسان بارا»."]]}, {"l": "Joh 8:46", "n": "", "vs": [[46, "من منكم يثبت علي خطيئة؟ فما دمت أقول الحق، فلماذا لا تصدقونني؟"]]}, {"l": "2Co 5:21", "n": "", "vs": [[21, "فإن الذي لم يعرف خطيئة، جعله الله خطيئة لأجلنا، لنصير نحن بر الله فيه."]]}, {"l": "Heb 4:15", "n": "", "vs": [[15, "ذلك لأن رئيس الكهنة الذي لنا، ليس عاجزا عن تفهم ضعفاتنا، بل إنه قد تعرض للتجارب التي نتعرض نحن لها، إلا أنه بلا خطية."]]}, {"l": "Heb 7:26", "n": "", "vs": [[26, "نعم، هذا هو رئيس الكهنة الذي كنا محتاجين إليه. إنه قدوس، لا عيبة فيه، ولا نجاسة، قد انفصل عن الخاطئين، وارتفع حتى صار أسمى من السماوات."]]}, {"l": "Heb 7:27", "n": "", "vs": [[27, "وهو لا يحتاج إلى ما كان يحتاج إليه قديما كل رئيس كهنة: أن يقدم الذبائح يوميا للتكفير عن خطاياه الخاصة أولا، ثم عن خطايا الشعب، وذلك لأنه كفر عن خطاياهم مرة واحدة، حين قدم نفسه عنهم."]]}, {"l": "Heb 9:28", "n": "", "vs": [[28, "كذلك المسيح أيضا: مات مرة واحدة حاملا خطايا كثيرين، مقربا نفسه (لله) عوضا عنهم. ولا بد أن يعود إلى الظهور. لا ليعالج الخطايا، بل ليحقق الخلاص النهائي لجميع منتظريه!"]]}, {"l": "1Jo 2:1", "n": "", "vs": [[1, "ياأولادي الصغار، أكتب إليكم هذه الأمور لكي لا تخطئوا. ولكن، إن أخطأ أحدكم، فلنا عند الآب شفيع هو يسوع المسيح البار."]]}, {"l": "1Jo 3:5", "n": "", "vs": [[5, "وأنتم تعرفون أن المسيح جاء إلى هذه الأرض لكي يحمل الخطايا، مع كونه بلا خطيئة."]]}], "kwAr": "لم يفعل خطيئة", "noteAr": ""}, {"kw": "guile", "raw": "Joh_1:47; Rev_14:5", "note": "", "refs": [{"l": "Joh 1:47", "n": "", "vs": [[47, "ورأى يسوع نثنائيل قادما نحوه فقال عنه: «هذا إسرائيلي أصيل لا شك فيه!»"]]}, {"l": "Rev 14:5", "n": "", "vs": [[5, "لم تنطق أفواههم بالكذب، ولا عيب فيهم."]]}], "kwAr": "مكر", "noteAr": ""}], "arS": [["إنه لم ", []], ["يفعل", ["G4160"]], [" ", []], ["خطيئة", ["G266"]], [" واحدة، ولا كان في ", []], ["فمه", ["G4750"]], [" ", []], ["مكر", ["G1388"]], [".", []]]}, {"c": 2, "v": 23, "text": "ومع أنه أهين، فلم يكن يرد الإهانة. وإذ تحمل الآلام، لم يكن يهدد بالانتقام، بل أسلم أمره لله الذي يحكم بالعدل.", "groups": [{"kw": "when he was", "raw": "Psa_38:12-14; Isa_53:7; Mat_27:39-44; Mar_14:60,Mar_14:61, Mar_15:29-32; Luk_22:64, Luk_22:65, Luk_23:9, Luk_23:34-39; Joh_8:48, Joh_8:49, Joh_19:9-11; Act_8:32-35; Heb_12:3", "note": "", "refs": [{"l": "Psa 38:12-14", "n": "", "vs": [[12, "نصب الساعون لقتلي الفخاخ، وطالبو أذيتي توعدوا بدماري، وتآمروا طول النهار للإيقاع بي."], [13, "أما أنا فقد كنت كأصم، لا يسمع، وكأخرس لا يفتح فاه."], [14, "كنت كمن لا يسمع، وكمن ليس في فمه حجة."]]}, {"l": "Isa 53:7", "n": "", "vs": [[7, "ظلم وأذل، ولكنه لم يفتح فاه، بل كشاة سيق إلى الذبح، وكنعجة صامتة أمام جازيها لم يفتح فاه."]]}, {"l": "Mat 27:39-44", "n": "", "vs": [[39, "وكان المارة يشتمونه، وهم يهزون رؤوسهم"], [40, "ويقولون: «ياهادم الهيكل وبانيه في ثلاثة أيام، خلص نفسك! إن كنت ابن الله فانزل عن الصليب!»"], [41, "وسخر منه أيضا رؤساء الكهنة والكتبة والشيوخ، قائلين:"], [42, "«خلص غيره؛ أما نفسه فلا يقدر أن يخلص! أهو ملك إسرائيل؟ فلينزل الآن عن الصليب فنؤمن به!"], [43, "توكل على الله، فليخلصه الآن إن كان يريده! فهو قد قال: أنا ابن الله!»"], [44, "وكان اللصان المصلوبان معه يسخران منه بمثل هذا الكلام!"]]}, {"l": "Mar 14:60", "n": "", "vs": [[60, "فوقف رئيس الكهنة في وسط المجلس وسأل يسوع: «أما ترد شيئا؟ بماذا يشهد هؤلاء عليك؟»"]]}, {"l": "Mar 14:61", "n": "", "vs": [[61, "ولكنه ظل صامتا ولم يرد شيئا. فعاد رئيس الكهنة يسأله، فقال: «أأنت المسيح، ابن المبارك؟»"]]}, {"l": "Mar 15:29-32", "n": "", "vs": [[29, "وكان المارة يشتمونه، وهم يهزون رؤوسهم قائلين: «هه! ياهادم الهيكل وبانيه في ثلاثة أيام،"], [30, "خلص نفسك، وانزل عن الصليب!»"], [31, "كذلك كان رؤساء الكهنة أيضا يسخرون منه مع الكتبة قائلين بعضهم لبعض: «خلص غيره، وأما نفسه فلا يقدر أن يخلص."], [32, "لينزل الآن المسيح ملك إسرائيل من على الصليب، لنرى ونؤمن!» وعيره أيضا اللصان المصلوبان معه."]]}, {"l": "Luk 22:64", "n": "", "vs": [[64, "ويغطون وجهه ويسألونه: «تنبأ! من الذي ضربك؟»"]]}, {"l": "Luk 22:65", "n": "", "vs": [[65, "ووجهوا إليه شتائم أخرى كثيرة."]]}, {"l": "Luk 23:9", "n": "", "vs": [[9, "فسأله في قضايا كثيرة، أما هو فلم يجبه عن شيء."]]}, {"l": "Luk 23:34-39", "n": "", "vs": [[34, "وقال يسوع: «ياأبي، اغفر لهم، لأنهم لا يدرون ما يفعلون!» واقتسموا ثيابه مقترعين عليها."], [35, "ووقف الشعب هناك يراقبونه، وكذلك الرؤساء يتهكمون قائلين: «خلص آخرين! فليخلص نفسه إن كان هو المسيح المختار عند الله!»"], [36, "وسخر منه الجنود أيضا، فكانوا يتقدمون إليه ويقدمون له خلا،"], [37, "قائلين: «إن كنت أنت ملك اليهود، فخلص نفسك»"], [38, "وكان معلقا فوقه لافتة كتب فيها: «هذا هو ملك اليهود»."], [39, "وأخذ واحد من المجرمين المصلوبين يجدف عليه فيقول: «ألست أنت المسيح؟ إذن خلص نفسك وخلصنا!»"]]}, {"l": "Joh 8:48", "n": "", "vs": [[48, "فقال اليهود: «ألسنا نقول الحق عندما نقول إنك سامري وإن فيك شيطانا؟»"]]}, {"l": "Joh 8:49", "n": "", "vs": [[49, "أجابهم: «لا شيطان في، لكني أكرم أبي وأنتم تهينونني."]]}, {"l": "Joh 19:9-11", "n": "", "vs": [[9, "ودخل إلى قصره وسأل يسوع: «من أين أنت؟» فلم يجبه يسوع بشيء."], [10, "فقال له بيلاطس: «أما تكلمني؟ ألا تعلم أن لي سلطة أن أطلقك، وسلطة أن أصلبك؟»"], [11, "فأجابه يسوع «ما كان لك علي سلطة قط، لو لم تكن قد أعطيت لك من فوق. لذلك فالذي سلمني إليك له خطيئة أعظم...»"]]}, {"l": "Act 8:32-35", "n": "", "vs": [[32, "وكان الخصي قد وصل في فصل الكتاب الذي يقرأه إلى القول: «مثل شاة سيق إلى الذبح، ومثل الحمل الصامت بين يدي من يجزه، هكذا لم يفتح فاه!"], [33, "في أثناء تواضعه عومل بغير عدل. من يخبر عن نسله؟ فإن حياته قد انتزعت من الأرض!»"], [34, "وسأل الخصي فيلبس: «قل لي: إلى من يشير النبي بهذا القول؟ إلى نفسه أو إلى شخص آخر؟»"], [35, "فتكلم وأخذ يبشره بيسوع انطلاقا من كتاب النبي هذا."]]}, {"l": "Heb 12:3", "n": "", "vs": [[3, "فتأملوا مليا ما قاساه بتحمله تلك المعاملة العنيفة التي عامله بها الخاطئون، لكي لا تتعبوا وتنهاروا!"]]}], "kwAr": "أهين", "noteAr": ""}, {"kw": "threatened", "raw": "Act_4:29, Act_9:1; Eph_6:9", "note": "", "refs": [{"l": "Act 4:29", "n": "", "vs": [[29, "والآن انظر، يارب، إلى تهديدهم، وهبنا نحن عبيدك أن نعلن كلامك بكل جرأة،"]]}, {"l": "Act 9:1", "n": "", "vs": [[1, "أما شاول فكان لايزال يفور بالتهديد والقتل على تلاميذ الرب. فذهب إلى رئيس الكهنة،"]]}, {"l": "Eph 6:9", "n": "", "vs": [[9, "وأنتم، أيها السادة، عاملوهم بمثل هذه المعاملة غير لاجئين إلى التهديد، عالمين أن سيدكم وسيدهم هو في السماء، وهو لا يراعي مقامات الناس."]]}], "kwAr": "لم يكن يهدد", "noteAr": ""}, {"kw": "but", "raw": "1Pe_4:19; Psa_10:14, Psa_31:5, Psa_37:5; Luk_23:46; Act_7:59; 2Ti_1:12", "note": "", "refs": [{"l": "1Pe 4:19", "n": "", "vs": [[19, "إذن، على الذين يتألمون وفقا لإرادة الله، أن يسلموا أنفسهم للخالق الأمين، ويواظبوا على عمل الصلاح!"]]}, {"l": "Psa 10:14", "n": "", "vs": [[14, "ولكنك قد رأيت. عاينت ما أصاب المساكين من المشقة والغم، فتجازي الشرير بيدك. يسلم إليك المسكين أمره، فأنت دائما معين اليتيم."]]}, {"l": "Psa 31:5", "n": "", "vs": [[5, "في يدك أستودع روحي. فديتني أيها الرب إله الحق."]]}, {"l": "Psa 37:5", "n": "", "vs": [[5, "سلم للرب طريقك وتوكل عليه فيتولى أمرك."]]}, {"l": "Luk 23:46", "n": "", "vs": [[46, "وقال يسوع صارخا بصوت عظيم: «ياأبي، في يديك أستودع روحي!» وإذ قال هذا، أسلم الروح."]]}, {"l": "Act 7:59", "n": "", "vs": [[59, "وبينما كانوا يرجمون استفانوس، كان يدعو: «أيها الرب يسوع، اقبل روحي!»"]]}, {"l": "2Ti 1:12", "n": "", "vs": [[12, "من أجل ذلك أيضا أقاسي الآن هذه الآلام، ولكني لست أخجل، لأنني أعرف من أنا مؤمن به، ولي تمام الثقة بأنه قادر أن يحفظ لي الأمانة التي أودعتها عنده سالمة إلى ذلك اليوم."]]}], "kwAr": "أسلم أمره", "noteAr": ""}, {"kw": "himself", "raw": "or, his cause", "note": "or, his cause", "refs": [], "kwAr": "أمره", "noteAr": "أو: قضيته."}, {"kw": "judgeth", "raw": "Gen_18:25; Psa_7:11, Psa_96:13; Act_17:31; Rom_2:5; 2Th_1:5; 2Ti_4:8; Rev_19:11", "note": "", "refs": [{"l": "Gen 18:25", "n": "", "vs": [[25, "تنزهت عن أن تهلك البار مع الأثيم، فيكون البار كالأثيم؛ حاشا لك. أديان الأرض كلها لا يجري عدلا؟»"]]}, {"l": "Psa 7:11", "n": "", "vs": [[11, "الله قاض عادل، وهو إله يسخط على الأشرار في كل يوم."]]}, {"l": "Psa 96:13", "n": "", "vs": [[13, "في حضرة الرب لأنه آت ليدين العالم بالعدل والشعوب بالحق."]]}, {"l": "Act 17:31", "n": "", "vs": [[31, "لأنه حدد يوما يدين فيه العالم بالعدل على يد رجل اختاره لذلك. وقد قدم للجميع برهانا، إذ أقامه من بين الأموات»."]]}, {"l": "Rom 2:5", "n": "", "vs": [[5, "ولكنك بسبب قساوتك وقلبك غير التائب، تخزن لنفسك غضبا ليوم الغضب، يوم تعلن دينونة الله العادلة."]]}, {"l": "2Th 1:5", "n": "", "vs": [[5, "وفي هذا دليل على حكم الله العادل، بقصد أن تعتبروا مؤهلين لملكوت الله الذي من أجله تلاقون الآلام."]]}, {"l": "2Ti 4:8", "n": "", "vs": [[8, "إنما ينتظرني الآن إكليل البر المحفوظ لي، والذي سيهبه لي الرب الديان العادل في ذلك اليوم؛ ولن يوهب لي وحدي، بل أيضا لجميع الذين يحبون ظهوره."]]}, {"l": "Rev 19:11", "n": "", "vs": [[11, "ثم رأيت السماء مفتوحة، وإذا حصان أبيض يسمى راكبه «الأمين الصادق» الذي يقضي ويحارب بالعدل."]]}], "kwAr": "يحكم بالعدل", "noteAr": ""}], "arS": [["ومع أنه ", []], ["أهين", ["G3058"]], ["، فلم يكن ", []], ["يرد الإهانة", ["G486"]], [". وإذ تحمل ", []], ["الآلام", ["G3958"]], ["، لم يكن ", []], ["يهدد", ["G546"]], [" بالانتقام، بل ", []], ["أسلم", ["G3860"]], [" أمره لله الذي ", []], ["يحكم", ["G2919"]], [" ", []], ["بالعدل", ["G1346"]], [".", []]]}, {"c": 2, "v": 24, "text": "وهو نفسه حمل خطايانا في جسده (عندما مات مصلوبا) على الخشبة، لكي نموت بالنسبة للخطايا فنحيا حياة البر. وبجراحه هو تم لكم الشفاء،", "groups": [{"kw": "his own self", "raw": "Exo_28:38; Lev_16:22, Lev_22:9; Num_18:22; Psa_38:4; Isa_53:4-6, Isa_53:11; Mat_8:17; Joh_1:29; Heb_9:28", "note": "", "refs": [{"l": "Exo 28:38", "n": "", "vs": [[38, "فتكون دائما على جبهة هرون، فيحمل بذلك عن بني إسرائيل وزر أخطائهم في تقدماتهم التي يخصصونها للرب. وعلى هرون أن يتعمم بها دائما عندما يمثل أمام الرب، لكي يرضى الرب عنهم."]]}, {"l": "Lev 16:22", "n": "", "vs": [[22, "فيحمل التيس ذنوب الشعب كلها إلى أرض مقفرة، وهناك يطلقه في الصحراء."]]}, {"l": "Lev 22:9", "n": "", "vs": [[9, "أطيعوا شعائري لئلا تحملوا خطيئتها وتموتوا بسببها لأنكم دنستموها، فأنا الرب الذي أقدسكم."]]}, {"l": "Num 18:22", "n": "", "vs": [[22, "وعلى الإسرائيليين، منذ الآن، أن لا يقتربوا إلى خيمة الاجتماع، وإلا تحملوا نتائج خطيئتهم فيموتون."]]}, {"l": "Psa 38:4", "n": "", "vs": [[4, "طمت آثامي فوق رأسي. وصارت كعبء ثقيل لا طاقة لي على حمله."]]}, {"l": "Isa 53:4-6", "n": "", "vs": [[4, "لكنه حمل أحزاننا وتحمل أوجاعنا، ونحن حسبنا أن الرب قد عاقبه وأذله،"], [5, "إلا أنه كان مجروحا من أجل آثامنا ومسحوقا من أجل معاصينا، حل به تأديب سلامنا، وبجراحه برئنا."], [6, "كلنا كغنم شردنا ملنا كل واحد إلى سبيله، فأثقل الرب كاهله بإثم جميعنا."]]}, {"l": "Isa 53:11", "n": "", "vs": [[11, "ويرى ثمار تعب نفسه ويشبع، وعبدي البار يبرر بمعرفته كثيرين ويحمل آثامهم."]]}, {"l": "Mat 8:17", "n": "", "vs": [[17, "لكي يتم ما قيل بلسان النبي إشعياء القائل: «هو أخذ أسقامنا، وحمل أمراضنا»."]]}, {"l": "Joh 1:29", "n": "", "vs": [[29, "وفي اليوم التالي رأى يوحنا يسوع آتيا نحوه، فهتف قائلا: «هذا هو حمل الله الذي يزيل خطيئة العالم."]]}, {"l": "Heb 9:28", "n": "", "vs": [[28, "كذلك المسيح أيضا: مات مرة واحدة حاملا خطايا كثيرين، مقربا نفسه (لله) عوضا عنهم. ولا بد أن يعود إلى الظهور. لا ليعالج الخطايا، بل ليحقق الخلاص النهائي لجميع منتظريه!"]]}], "kwAr": "وهو نفسه حمل خطايانا", "noteAr": ""}, {"kw": "on", "raw": "or, to", "note": "or, to", "refs": [], "kwAr": "على", "noteAr": "أو: إلى."}, {"kw": "the tree", "raw": "Deu_21:22, Deu_21:23; Act_5:30, Act_10:39, Act_13:29; Gal_3:13", "note": "", "refs": [{"l": "Deu 21:22", "n": "", "vs": [[22, "إن ارتكب إنسان جريمة عقابها الإعدام، ونفذ فيه القضاء وعلقتموه على خشبة،"]]}, {"l": "Deu 21:23", "n": "", "vs": [[23, "فلا تبت جثته على الخشبة، بل ادفنوه في نفس ذلك اليوم، لأن المعلق ملعون من الله. فلا تنجسوا أرضكم التي يهبها لكم الرب ميراثا."]]}, {"l": "Act 5:30", "n": "", "vs": [[30, "إن إله آبائنا أقام يسوع، الذي قتلتموه أنتم معلقين إياه على الخشبة!"]]}, {"l": "Act 10:39", "n": "", "vs": [[39, "ونحن شهود على كل ما قام به في بلاد اليهود وفي أورشليم، وقد قتلوه حقا، معلقا على خشبة."]]}, {"l": "Act 13:29", "n": "", "vs": [[29, "وبعدما نفذوا فيه كل ما كتب عنه، أنزلوه عن الصليب، ودفنوه في قبر."]]}, {"l": "Gal 3:13", "n": "", "vs": [[13, "إن المسيح حررنا بالفداء من لعنة الشريعة، إذ صار لعنة عوضا عنا، لأنه قد كتب: «ملعون كل من علق على خشبة»،"]]}], "kwAr": "الخشبة", "noteAr": ""}, {"kw": "being", "raw": "1Pe_4:1, 1Pe_4:2; Rom_6:2, Rom_6:7, Rom_6:11, Rom_7:6 *marg. Col_2:20, Col_3:3 *Gr: 2Co_6:17; Heb_7:26", "note": "", "refs": [{"l": "1Pe 4:1", "n": "", "vs": [[1, "فبما أن المسيح قد تحمل الآلام الجسمية لأجلكم، سلحوا أنفسكم بالاستعداد دائما لتحمل الآلام. فإن من يتحمل الآلام الجسمية، يكون قد قاطع الخطيئة."]]}, {"l": "1Pe 4:2", "n": "", "vs": [[2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."]]}, {"l": "Rom 6:2", "n": "", "vs": [[2, "حاشا! فنحن الذين متنا بالنسبة للخطيئة، كيف نعيش بعد فيها؟"]]}, {"l": "Rom 6:7", "n": "", "vs": [[7, "فإن من مات، قد تحرر من الخطيئة."]]}, {"l": "Rom 6:11", "n": "", "vs": [[11, "فكذلك أنتم أيضا، احسبوا أنفسكم أمواتا بالنسبة للخطيئة وأحياء لله في المسيح يسوع."]]}, {"l": "Rom 7:6", "n": "*marg.", "vs": [[6, "أما الآن، فنحن قد تحررنا من الشريعة، إذ متنا بالنِّسبة لما كان يقيدنا، حتى نكون عبيدا يخدمون وفقا للنظام الروحي الجديد، لا للنظام الحرفي العتيق."]]}, {"l": "Col 2:20", "n": "", "vs": [[20, "فمادمتم قد متم مع المسيح بالنسبة لمباديء العالم، فلماذا، كما لو كنتم عائشين في العالم، تخضعون أنفسكم لفرائض مثل هذه:"]]}, {"l": "Col 3:3", "n": "*Gr:", "vs": [[3, "فإنكم قد متم، وحياتكم مستورة مع المسيح في الله."]]}, {"l": "2Co 6:17", "n": "", "vs": [[17, "لذلك اخرجوا من وسطهم، وكونوا منفصلين، يقول الرب، ولا تلمسوا ما هو نجس،"]]}, {"l": "Heb 7:26", "n": "", "vs": [[26, "نعم، هذا هو رئيس الكهنة الذي كنا محتاجين إليه. إنه قدوس، لا عيبة فيه، ولا نجاسة، قد انفصل عن الخاطئين، وارتفع حتى صار أسمى من السماوات."]]}], "kwAr": "نموت بالنسبة للخطايا", "noteAr": ""}, {"kw": "live", "raw": "Mat_5:20; Luk_1:74, Luk_1:75; Act_10:35; Rom_6:11, Rom_6:16, Rom_6:22; Eph_5:9; Phi_1:11; 1Jo_2:29, 1Jo_3:7", "note": "", "refs": [{"l": "Mat 5:20", "n": "", "vs": [[20, "فإني أقول لكم: إن لم يزد بركم على بر الكتبة والفريسيين، لن تدخلوا ملكوت السماوات أبدا."]]}, {"l": "Luk 1:74", "n": "", "vs": [[74, "بعد تخليصنا من أيدي أعدائنا، أن نعبده بلا خوف،"]]}, {"l": "Luk 1:75", "n": "", "vs": [[75, "بقداسة وبر أمامه، طوال حياتنا."]]}, {"l": "Act 10:35", "n": "", "vs": [[35, "بل يقبل من يتقيه ويعمل الصلاح مهما كانت جنسيته."]]}, {"l": "Rom 6:11", "n": "", "vs": [[11, "فكذلك أنتم أيضا، احسبوا أنفسكم أمواتا بالنسبة للخطيئة وأحياء لله في المسيح يسوع."]]}, {"l": "Rom 6:16", "n": "", "vs": [[16, "أما تعلمون أنكم عندما تقدمون أنفسكم عبيدا للطاعة، تكونون للذي تطيعونه عبيدا: إما للخطيئة فإلى الموت، وإما للطاعة فإلى البر؟"]]}, {"l": "Rom 6:22", "n": "", "vs": [[22, "أما الآن، وقد حررتم من الخطيئة وصرتم عبيدا لله، فإن لكم ثمركم للقداسة، والعاقبة هي الحياة الأبدية."]]}, {"l": "Eph 5:9", "n": "", "vs": [[9, "فإن ثمر النور يكون في كل صلاح واستقامة وحق."]]}, {"l": "Phi 1:11", "n": "", "vs": [[11, "كاملين في ثمار البر الآتية بيسوع المسيح، لمجد الله وحمده."]]}, {"l": "1Jo 2:29", "n": "", "vs": [[29, "وما دمتم تعلمون أن الله بار، فاعلموا أن كل من يفعل الصلاح، يظهر أنه مولود من الله حقا."]]}, {"l": "1Jo 3:7", "n": "", "vs": [[7, "أيها الأولاد الصغار، لا تدعوا أحدا يضللكم. تأكدوا أن من يمارس الصلاح، يظهر أنه بار كما أن المسيح بار."]]}], "kwAr": "فنحيا حياة البر", "noteAr": ""}, {"kw": "by", "raw": "Isa_53:5, Isa_53:6; Mat_27:26; Mar_15:15; Joh_19:1", "note": "", "refs": [{"l": "Isa 53:5", "n": "", "vs": [[5, "إلا أنه كان مجروحا من أجل آثامنا ومسحوقا من أجل معاصينا، حل به تأديب سلامنا، وبجراحه برئنا."]]}, {"l": "Isa 53:6", "n": "", "vs": [[6, "كلنا كغنم شردنا ملنا كل واحد إلى سبيله، فأثقل الرب كاهله بإثم جميعنا."]]}, {"l": "Mat 27:26", "n": "", "vs": [[26, "فأطلق لهم باراباس؛ وأما يسوع فجلده، ثم سلمه إلى الصلب."]]}, {"l": "Mar 15:15", "n": "", "vs": [[15, "وإذ كان بيلاطس يريد أن يرضي الجمع، أطلق لهم باراباس، وبعد ما جلد يسوع، سلمه ليصلب."]]}, {"l": "Joh 19:1", "n": "", "vs": [[1, "عندئذ أمر بيلاطس بأن يؤخذ يسوع ويجلد."]]}], "kwAr": "بجراحه", "noteAr": ""}, {"kw": "healed", "raw": "Psa_147:3; Mal_4:2; Luk_4:18; Rev_22:2", "note": "", "refs": [{"l": "Psa 147:3", "n": "", "vs": [[3, "إنه يشفي منكسري القلب ويضمد جراحهم."]]}, {"l": "Mal 4:2", "n": "", "vs": [[2, "أما أنتم أيها المتقون اسمي فتشرق عليكم شمس البر حاملة في أجنحتها الشفاء فتنطلقون متواثبين كعجول المعلف،"]]}, {"l": "Luk 4:18", "n": "", "vs": [[18, "«روح الرب علي، لأنه مسحني لأبشر الفقراء؛ أرسلني لأنادي للمأسورين بالإطلاق وللعميان بالبصر، لأطلق المسحوقين أحرارا،"]]}, {"l": "Rev 22:2", "n": "", "vs": [[2, "ويخترق ساحة المدينة، وعلى ضفتيه شجرة الحياة تثمر اثنتي عشرة مرة، كل شهر مرة. وأوراقها دواء يشفي الأمم."]]}], "kwAr": "الشفاء", "noteAr": ""}], "arS": [["وهو ", []], ["نفسه", ["G848"]], [" ", []], ["حمل", ["G399"]], [" ", []], ["خطايانا", ["G266", "G2257"]], [" في ", []], ["جسده", ["G4983"]], [" (عندما مات مصلوبا) على ", []], ["الخشبة", ["G3586"]], ["، لكي ", []], ["نموت", ["G581"]], [" بالنسبة ", []], ["للخطايا", ["G266"]], [" ", []], ["فنحيا", ["G2198"]], [" حياة ", []], ["البر", ["G1343"]], [". ", []], ["وبجراحه", ["G3468"]], [" هو تم لكم ", []], ["الشفاء", ["G2390"]], ["،", []]]}, {"c": 2, "v": 25, "text": "فقد كنتم ضالين كخراف ضائعة، ولكنكم قد رجعتم الآن إلى راعي نفوسكم وحارسها!", "groups": [{"kw": "ye", "raw": "Psa_119:176; Isa_53:6; Jer_23:2; Eze_34:6; Mat_9:36, Mat_18:12; Luk_15:4-6", "note": "", "refs": [{"l": "Psa 119:176", "n": "", "vs": [[176, "تهت كخروف ضال. فابحث عن عبدك، فإني لم أنس وصاياك."]]}, {"l": "Isa 53:6", "n": "", "vs": [[6, "كلنا كغنم شردنا ملنا كل واحد إلى سبيله، فأثقل الرب كاهله بإثم جميعنا."]]}, {"l": "Jer 23:2", "n": "", "vs": [[2, "لذلك هذا ما يقوله الرب إله إسرائيل عن الرعاة الذين يرعون شعبي: «لقد بددتم غنمي (أي شعبي) وطردتموها، ولم تتعهدوها. فها أنا أعاقبكم على شر أعمالكم."]]}, {"l": "Eze 34:6", "n": "", "vs": [[6, "ضلت غنمي بين الجبال وفوق كل أكمة مرتفعة. تبددت غنمي في العراء ولم يوجد من ينشدها أو يلتمسها."]]}, {"l": "Mat 9:36", "n": "", "vs": [[36, "وعندما رأى الجموع، أخذته الشفقة عليهم، إذ كانوا معذبين ومشردين كغنم لا راعي لها."]]}, {"l": "Mat 18:12", "n": "", "vs": [[12, "ما رأيكم في إنسان كان عنده مئة خروف، فضل واحد منها: أفلا يترك التسعة والتسعين في الجبال، ويذهب يبحث عن الضال؟"]]}, {"l": "Luk 15:4-6", "n": "", "vs": [[4, "«أي إنسان منكم عنده مئة خروف وأضاع واحدا منها، ألا يترك التسعة والتسعين في البرية ويذهب يبحث عن الخروف الضائع حتى يجده؟"], [5, "وبعد أن يجده، يحمله على كتفيه فرحا،"], [6, "ثم يعود إلى البيت، ويدعو الأصدقاء والجيران، قائلا لهم: افرحوا معي، لأني وجدت خروفي الضائع !"]]}], "kwAr": "كخراف ضائعة", "noteAr": ""}, {"kw": "the Shepherd", "raw": "1Pe_5:4; Psa_23:1-3, Psa_80:1; Son_1:7, Son_1:8; Isa_40:11; Eze_34:11-16, Eze_34:23, Eze_34:24, Eze_37:24; Zec_13:7; Joh_10:11-16; Heb_13:20", "note": "", "refs": [{"l": "1Pe 5:4", "n": "", "vs": [[4, "وعندما يظهر رئيس الرعاة، تنالون إكليل المجد الذي لا يفنى."]]}, {"l": "Psa 23:1-3", "n": "", "vs": [[1, "الرب راعي فلست أحتاج إلى شيء."], [2, "في مراع خضراء يربضني، وإلى مياه هادئة يقودني."], [3, "ينعش نفسي ويرشدني إلى طرق البر إكراما لاَسمه."]]}, {"l": "Psa 80:1", "n": "", "vs": [[1, "اصغ ياراعي إسرائيل، يامن قدت (قوم) يوسف كالقطيع. تجل يامن بنعمتك تجلس على عرشك فوق الكروبيم"]]}, {"l": "Son 1:7", "n": "", "vs": [[7, "قل لي يامن تحبه نفسي، أين ترعى قطعانك وأين تربض بها عند الظهيرة؟ فلماذا أكون كامرأة مقنعة، أتجول بجوار قطعان أصحابك؟"]]}, {"l": "Son 1:8", "n": "", "vs": [[8, "(المحب): إن كنت لا تعلمين ياأجمل النساء، فاقتفي أثر الغنم، وارعي جداءك عند مساكن الرعاة."]]}, {"l": "Isa 40:11", "n": "", "vs": [[11, "يرعى قطيعه كراع، ويجمع الحملان بذراعه، وفي أحضانه يحملها ويقود المرضعات برفق."]]}, {"l": "Eze 34:11-16", "n": "", "vs": [[11, "لأن هذا ما يعلنه السيد الرب: ها أنا أبحث عن غنمي وأفتقدها."], [12, "وكما يتفقد الراعي قطيعه في اليوم الذي يكون فيه بين غنمه المشتتة، هكذا أتفقد قطيعي وأخلصه من كل الأماكن التي تفرق إليها في يوم غائم كئيب."], [13, "وأخرجه من بين الشعوب وأجمعه من البلدان، وأرده إلى أرضه، حيث أرعاه على جبال إسرائيل وفي الأودية وفي جميع أماكن الأرض الآهلة."], [14, "وأرعاه في مروج خصيبة، وتكون جبال إسرائيل الشاهقة مراعي رائعة يربضون في مراحها الطيب، ويرعون في مراع خصيبة على جبال إسرائيل."], [15, "أنا أرعى غنمي وأربضها يقول السيد الرب،"], [16, "وأطلب الضال وأسترجع المطرود وأجبر الكسير وأعصب الجريح وأستأصل السمين والقوي، وأرعاها بعدل."]]}, {"l": "Eze 34:23", "n": "", "vs": [[23, "وأنصب عليها راعيا واحدا عبدي داود (أي المسيح) يرعاها بنفسه ويكون لها راعيا أمينا."]]}, {"l": "Eze 34:24", "n": "", "vs": [[24, "وأنا الرب أكون لهم إلها، وعبدي داود يكون لهم رئيسا. أنا الرب تكلمت."]]}, {"l": "Eze 37:24", "n": "", "vs": [[24, "ويصبح داود عبدي (أي المسيح) ملكا عليهم، فيكون لهم جميعا راع واحد فيمارسون أحكامي ويطيعون فرائضي عاملين بها."]]}, {"l": "Zec 13:7", "n": "", "vs": [[7, "ويقول الرب القدير: «استيقظ أيها السيف وهاجم راعي ورجل رفقتي. اضرب الراعي فتتبدد الخراف. ولكني أرد يدي عن الصغار (أي القلة المؤمنة)."]]}, {"l": "Joh 10:11-16", "n": "", "vs": [[11, "أنا الراعي الصالح، والراعي الصالح يبذل حياته فدى خرافه."], [12, "وليس الأجير كالراعي، لأن الخراف ليست ملكه. فعندما يرى الذئب قادما، يترك الخراف لينجو بنفسه، فيخطف الذئب الخراف ويبددها."], [13, "إنه يهرب لأنه أجير ولا يبالي بالخراف!"], [14, "أما أنا فإني الراعي الصالح، وأعرف خرافي، وخر افي تعرفني،"], [15, "مثلما يعرفني الآب وأنا أعرفه. وأنا أبذل حياتي فدى خرافي."], [16, "ولي خراف أخرى لا تنتمي إلى هذه الحظيرة، لا بد أن أجمعها إلي أيضا، فتصغي لصوتي؛ فيكون هناك قطيع واحد وراع واحد."]]}, {"l": "Heb 13:20", "n": "", "vs": [[20, "وأسأل الله ، إله السلام الذي أقام من بين الأموات ربنا يسوع راعي الخراف العظيم بفضل دمه الذي ختم به العهد الأبدي"]]}], "kwAr": "راعي نفوسكم", "noteAr": ""}, {"kw": "Bishop", "raw": "Heb_3:1; Act_20:28 *Gr.", "note": "", "refs": [{"l": "Heb 3:1", "n": "", "vs": [[1, "إذن، أيها الإخوة القديسون الذين اشتركتم في الدعوة السماوية، تأملوا يسوع: الرسول ورئيس الكهنة في الإيمان الذي نتمسك به."]]}, {"l": "Act 20:28", "n": "*Gr.", "vs": [[28, "فاسهروا إذن على أنفسكم وعلى جميع القطيع الذي عينكم بينه الروح القدس نظارا، لترعوا كنيسة الله التي اشتراها بدمه."]]}], "kwAr": "وحارسها", "noteAr": ""}], "arS": [["فقد كنتم ", []], ["ضالين", ["G4105"]], [" ", []], ["كخراف", ["G4263"]], [" ضائعة، ولكنكم قد ", []], ["رجعتم", ["G1994"]], [" ", []], ["الآن", ["G3568"]], [" إلى ", []], ["راعي", ["G4166"]], [" ", []], ["نفوسكم", ["G5590"]], [" ", []], ["وحارسها", ["G1985"]], ["!", []]]}, {"c": 3, "v": 1, "text": "كذلك، أيتها الزوجات، اخضعن لأزواجكن. حتى وإن كان الزوج غير مؤمن بالكلمة، تجذبه زوجته إلى الإيمان، بتصرفها اللائق دون كلام،", "groups": [{"kw": "ye", "raw": "Gen_3:16; Est_1:16-20; Rom_7:2 *Gr: 1Co_11:3, 1Co_14:34; Eph_5:22-24, Eph_5:33; Col_3:18; 1Ti_2:11, 1Ti_2:12; Tit_2:3-6", "note": "", "refs": [{"l": "Gen 3:16", "n": "", "vs": [[16, "ثم قال للمرأة: «أكثر تكثيرا أوجاع مخاضك فتنجبين بالآلام أولادا، وإلى زوجك يكون اشتياقك وهو يتسلط عليك»."]]}, {"l": "Est 1:16-20", "n": "", "vs": [[16, "فأجابه مموكان في حضرة العظماء: «إن الملكة وشتي لم تذنب في حق الملك وحده، بل أساءت إلى جميع الرؤساء والأمم المقيمين في تخوم الملك أحشويروش،"], [17, "فما إن يذيع خبر تصرف الملكة بين جميع النساء، حتى يحتقرن أزواجهن، إذ يقلن: إن الملك أحشويروش أمر أن تمثل الملكة وشتي أمامه ولكنها لم تصدع بأمره."], [18, "فتحذو في هذا اليوم سيدات فارس ومادي، اللواتي بلغهن خبر الملكة، حذوها، مع جميع رؤساء الملك. ومثل هذا يثير كثرة من الاحتقار والغضب."], [19, "فإذا راق للملك فليصدر أمرا ملكيا، يسجل ضمن مراسيم مادي وفارس التي لا تتغير، يحظر فيه على وشتي المثول في حضرة الملك أحشويروش. ولينعم الملك بملكها على من هي خير منها."], [20, "وهكذا يذيع أمر الملك الصادر عنه في كل أرجاء مملكته الشاسعة، فتعامل جميع النساء أزواجهن صغارا وكبارا باحترام»."]]}, {"l": "Rom 7:2", "n": "*Gr:", "vs": [[2, "فالمرأة المتزوجة تربطها الشريعة بزوجها مادام حيا. ولكن، إن مات الزوج، فالشريعة تحلها من الارتباط به."]]}, {"l": "1Co 11:3", "n": "", "vs": [[3, "ولكني أريد أن تعلموا أن المسيح هو الرأس لكل رجل؛ أما رأس المرأة فهو الرجل، ورأس المسيح هو الله ."]]}, {"l": "1Co 14:34", "n": "", "vs": [[34, "لتصمت النساء في الكنائس، فليس مسموحا لهن أن يتكلمن، بل عليهن أن يكن خاضعات، على حد ما توصي به الشريعة أيضا."]]}, {"l": "Eph 5:22-24", "n": "", "vs": [[22, "أيتها الزوجات، اخضعن لأزواجكن، كما للرب."], [23, "فإن الزوج هو رأس الزوجة كما أن المسيح أيضا هو رأس الكنيسة (جسده)، وهو نفسه مخلص الجسد."], [24, "فكما أن الكنيسة قد أخضعت للمسيح، فكذلك الزوجات أيضا لأزواجهن، في كل شيء."]]}, {"l": "Eph 5:33", "n": "", "vs": [[33, "إنما أنتم أيضا، كل بمفرده، ليحب كل واحد منكم زوجته كنفسه. وأما الزوجة، فعليها أن تهاب زوجها."]]}, {"l": "Col 3:18", "n": "", "vs": [[18, "أيتها الزوجات اخضعن لأزواجكن كما يليق (بالعيشة) في الرب."]]}, {"l": "1Ti 2:11", "n": "", "vs": [[11, "على المرأة أن تتلقى التعليم بسكوت وبكل خضوع."]]}, {"l": "1Ti 2:12", "n": "", "vs": [[12, "ولست أسمح للمرأة أن تعلم ولا تتسلط على الرجل. بل عليها أن تلزم السكوت."]]}, {"l": "Tit 2:3-6", "n": "", "vs": [[3, "وكذلك أن تكون العجائز ذوات سيرة موافقة للقداسة، غير نمامات ولا مدمنات للخمر، بل معلمات لما هو صالح،"], [4, "لكي يدربن الشابات على أن يكن محبات لأزواجهن ولأولادهن،"], [5, "متعقلات، عفيفات، مهتمات بشؤون بيوتهن صالحات، خاضعات لأزواجهن، حتى لا يتكلم أحد بالسوء على كلمة الله."], [6, "كذلك عظ الشبان أن يكونوا متعقلين،"]]}], "kwAr": "أيتها الزوجات", "noteAr": ""}, {"kw": "obey", "raw": "1Pe_1:22, 1Pe_4:17; Rom_6:17, Rom_10:16; 2Th_1:8; Heb_5:9, Heb_11:8", "note": "", "refs": [{"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}, {"l": "1Pe 4:17", "n": "", "vs": [[17, "حقا إن الوقت قد حان ليبتديء القضاء بأهل بيت الله. فإن كان القضاء يبدأ بنا أولا، فما هو مصير الذين لا يؤمنون بإنجيل الله؟"]]}, {"l": "Rom 6:17", "n": "", "vs": [[17, "إنما الشكر لله، لأنكم كنتم عبيدا للخطيئة ولكن أطعتم من القلب صيغة التعليم الذي وضعتم في عهدته."]]}, {"l": "Rom 10:16", "n": "", "vs": [[16, "ولكن، ليس كلهم أطاعوا الإنجيل. فإن إشعياء يقول: «يارب! من صدق ما أسمعناه إياه؟»"]]}, {"l": "2Th 1:8", "n": "", "vs": [[8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."]]}, {"l": "Heb 5:9", "n": "", "vs": [[9, "وبذلك، أصبح مؤهلا لمهمته، فصار لجميع الذين يطيعونه مصدرا للخلاص الأبدي."]]}, {"l": "Heb 11:8", "n": "", "vs": [[8, "وبالإيمان، لبى إبراهيم دعوة الله، فترك وطنه وانطلق إلى أرض أخرى وعده الله بأن يورثه إياها. ولما خرج من بيته، كان لا يعرف أين يتوجه."]]}], "kwAr": "غير مؤمن بالكلمة", "noteAr": ""}, {"kw": "they", "raw": "1Co_7:16; Col_4:5", "note": "", "refs": [{"l": "1Co 7:16", "n": "", "vs": [[16, "فكيف تعلمين، أيتها الزوجة، ما إذا كان زوجك سيخلص على يدك؟ أو كيف تعلم، أيها الزوج، ما إذا كانت زوجتك ستخلص على يدك؟"]]}, {"l": "Col 4:5", "n": "", "vs": [[5, "تصرفوا بحكمة مع الذين هم من خارج الكنيسة، مستغلين الوقت أحسن استغلال."]]}], "kwAr": "دون كلام", "noteAr": ""}, {"kw": "won", "raw": "Pro_11:30, Pro_18:19; Mat_18:15; 1Co_9:19-22; Jam_5:19, Jam_5:20", "note": "", "refs": [{"l": "Pro 11:30", "n": "", "vs": [[30, "ثمر الصديق شجرة حياة، ورابح النفوس حكيم."]]}, {"l": "Pro 18:19", "n": "", "vs": [[19, "إرضاء الأخ المتأذي أصعب من قهر مدينة حصينة، والمخاصمات كعارضة قلعة."]]}, {"l": "Mat 18:15", "n": "", "vs": [[15, "إن أخطأ إليك أخوك، فاذهب إليه وعاتبه بينك وبينه على انفراد. فإذا سمع لك، تكون قد ربحت أخاك."]]}, {"l": "1Co 9:19-22", "n": "", "vs": [[19, "فمع أني حر من الجميع، جعلت نفسي عبدا للجميع، لأكسب أكبر عدد ممكن منهم."], [20, "فصرت لليهود كأني يهودي، حتى أكسب اليهود؛ وللخاضعين للشريعة كأني خاضع لها مع أني لست خاضعا لها حتى أكسب الخاضعين لها؛"], [21, "وللذين بلا شريعة كأني بلا شريعة مع أني لست بلا ناموس عند الله بل أنا خاضع لناموس من نحو المسيح حتى أكسب الذين هم بلا شريعة."], [22, "وصرت للضعفاء ضعيفا، حتى أكسب الضعفاء. صرت للجميع كل شيء، لأنقذ بعضا منهم مهما كلف الأمر."]]}, {"l": "Jam 5:19", "n": "", "vs": [[19, "أيها الإخوة، إن ضل أحد بينكم عن الحق، ورده آخر،"]]}, {"l": "Jam 5:20", "n": "", "vs": [[20, "فليتأكد أن الذي يرد خاطئا عن ضلال مسلكه، فإنما ينقذ نفسا من الموت، ويستر خطايا كثيرة!"]]}], "kwAr": "تجذبه إلى الإيمان", "noteAr": ""}], "arS": [["كذلك، أيتها ", []], ["الزوجات", ["G1135"]], ["، ", []], ["اخضعن", ["G5293"]], [" ", []], ["لأزواجكن", ["G2398", "G435"]], [". حتى وإن كان ", []], ["الزوج", ["G435"]], [" ", []], ["غير مؤمن", ["G544"]], [" ", []], ["بالكلمة", ["G3056"]], ["، ", []], ["تجذبه", ["G2770"]], [" ", []], ["زوجته", ["G1135"]], [" إلى الإيمان، ", []], ["بتصرفها", ["G391"]], [" اللائق ", []], ["دون كلام", ["G427", "G3056"]], ["،", []]]}, {"c": 3, "v": 2, "text": "وذلك حين يلاحظ سلوكها الطاهر ووقارها.", "groups": [{"kw": "behold", "raw": "1Pe_3:16, 1Pe_1:15, 1Pe_2:12; Phi_1:27, Phi_3:20; 1Ti_4:12; 2Pe_3:11", "note": "", "refs": [{"l": "1Pe 3:16", "n": "", "vs": [[16, "على أن تفعلوا ذلك بوداعة واحترام، محافظين على طهارة ضمائركم، سالكين في المسيح سلوكا صالحا، وعندئذ يخيب الذين يوجهون إليكم التهم الكاذبة ويشتمونكم كأنكم تفعلون شرا."]]}, {"l": "1Pe 1:15", "n": "", "vs": [[15, "وإنما اسلكوا سلوكا مقدسا في كل أمر، مقتدين بالقدوس الذي دعاكم،"]]}, {"l": "1Pe 2:12", "n": "", "vs": [[12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالحة يمجدون الله في يوم الافتقاد."]]}, {"l": "Phi 1:27", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"]]}, {"l": "Phi 3:20", "n": "", "vs": [[20, "أما نحن، فإن وطننا في السماوات التي منها ننتظر عودة مخلصنا الرب يسوع المسيح،"]]}, {"l": "1Ti 4:12", "n": "", "vs": [[12, "لا يستخف أحد بحداثة سنك. وإنما كن قدوة للمؤمنين، في الكلام والسلوك والمحبة والإيمان والطهارة."]]}, {"l": "2Pe 3:11", "n": "", "vs": [[11, "ومادامت هذه الأشياء جميعا ستنحل، فكيف يجب أن تكونوا أنتم أصحاب سلوك مقدس يتصف بالتقوى،"]]}], "kwAr": "يلاحظ", "noteAr": ""}, {"kw": "with", "raw": "1Pe_3:5, 1Pe_3:6, 1Pe_3:15; Eph_5:33, Eph_6:5; Col_3:22", "note": "", "refs": [{"l": "1Pe 3:5", "n": "", "vs": [[5, "وبها كانت تتزين النساء التقيات قديما، فكانت الواحدة منهن تتكل على الله وتخضع لزوجها."]]}, {"l": "1Pe 3:6", "n": "", "vs": [[6, "فسارة، مثلا، كانت تطيع زوجها إبراهيم وتدعوه «سيدي». والمؤمنات اللواتي يقتدين بها، يثبتن أنهن بنات لها، إذ يتصرفن تصرفا صالحا، فلا يخفن أي تهديد."]]}, {"l": "1Pe 3:15", "n": "", "vs": [[15, "وإنما كرسوا المسيح ربا في قلوبكم. وكونوا دائما مستعدين لأن تقدموا جوابا مقنعا لكل من يسألكم عن سبب الرجاء الذي في داخلكم"]]}, {"l": "Eph 5:33", "n": "", "vs": [[33, "إنما أنتم أيضا، كل بمفرده، ليحب كل واحد منكم زوجته كنفسه. وأما الزوجة، فعليها أن تهاب زوجها."]]}, {"l": "Eph 6:5", "n": "", "vs": [[5, "أيها العبيد، أطيعوا سادتكم البشريين بخوف وارتعاد، من قلب صادق، كمن يطيع المسيح،"]]}, {"l": "Col 3:22", "n": "", "vs": [[22, "أيها العبيد، أطيعوا في كل أمر سادتكم البشريين، فلا تعملوا بجد فقط حين تكون عيونهم عليكم، كمن يحاول إرضاء الناس، بل بقلب صادق خائفين الرب."]]}], "kwAr": "ووقارها", "noteAr": ""}], "arS": [["وذلك حين ", []], ["يلاحظ", ["G2029"]], [" ", []], ["سلوكها", ["G391"]], [" ", []], ["الطاهر", ["G53"]], [" ", []], ["ووقارها", ["G5401"]], [".", []]]}, {"c": 3, "v": 3, "text": "وعلى المرأة ألا تعتمد الزينة الخارجية لإظهار جمالها، بضفر الشعر والتحلي بالذهب ولبس الثياب الفاخرة.", "groups": [{"kw": "adorning let", "raw": "1Ti_2:9, 1Ti_2:10; Tit_2:3-15; Rom_12:2", "note": "", "refs": [{"l": "1Ti 2:9", "n": "", "vs": [[9, "كما أريد أيضا، أن تظهر النساء بمظهر لائق محشوم اللباس، متزينات بالحياء والرزانة، غير متحليات بالجدائل والذهب واللاليء والحلل الغالية الثمن،"]]}, {"l": "1Ti 2:10", "n": "", "vs": [[10, "بل بما يليق بنساء يعترفن علنا بأنهن يعشن في تقوى الله، بالأعمال الصالحة!"]]}, {"l": "Tit 2:3-15", "n": "", "vs": [[3, "وكذلك أن تكون العجائز ذوات سيرة موافقة للقداسة، غير نمامات ولا مدمنات للخمر، بل معلمات لما هو صالح،"], [4, "لكي يدربن الشابات على أن يكن محبات لأزواجهن ولأولادهن،"], [5, "متعقلات، عفيفات، مهتمات بشؤون بيوتهن صالحات، خاضعات لأزواجهن، حتى لا يتكلم أحد بالسوء على كلمة الله."], [6, "كذلك عظ الشبان أن يكونوا متعقلين،"], [7, "جاعلا من نفسك في كل شيء قدوة للأعمال الصالحة، مظهرا في تعليمك النقاوة والوقار"], [8, "والكلمة الصحيحة التي لا تلام، لكي يخجل المقاوم حين لا يجد أمرا سيئا يقوله فينا."], [9, "وعلم العبيد أن يكونوا خاضعين لسادتهم، مرضين لهم في كل شيء؛ غير معاندين؛"], [10, "ولا سارقين، بل مظهرين أمانة كلية صالحة، لكي يزينوا في كل شيء تعليم مخلصنا الله."], [11, "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت."], [12, "وهي تعلمنا أن نقطع علاقتنا بالإباحية والشهوات العالمية، وأن نحيا في العصر الحاضر حياة التعقل والبر والتقوى،"], [13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"], [14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."], [15, "بهذه الأمور تكلم، وعظ، ووبخ بكل سلطان، ولا تدع أحدا يستخف بك!"]]}, {"l": "Rom 12:2", "n": "", "vs": [[2, "ولا تتكيفوا مع هذا العالم، بل تغيروا بتجديد الذهن، لتميزوا ما هي إرادة الله الصالحة المقبولة الكاملة."]]}], "kwAr": "الزينة الخارجية", "noteAr": ""}, {"kw": "that", "raw": "Gen_24:22, Gen_24:47, Gen_24:53; Exo_3:22, Exo_32:2, Exo_33:4, Exo_35:22, Exo_38:8; 2Ki_9:30; Est_5:1; Psa_45:9; Isa_3:18-24, Isa_52:1, Isa_61:10; Jer_2:32, Jer_4:30; Eze_16:7-13, Eze_23:40", "note": "", "refs": [{"l": "Gen 24:22", "n": "", "vs": [[22, "وعندما ارتوت الجمال تناول الرجل خزامة ذهبية وزنها نصف شاقل (نحو ستة جرامات) وسوارين ذهبيين وزنهما عشرة شواقل (نحو مئة وعشرين جراما)،"]]}, {"l": "Gen 24:47", "n": "", "vs": [[47, "ثم سألتها: ابنة من أنت؟ فأجابت: ابنة بتوئيل بن ناحور الذي أنجبته ملكة له. فوضعت الخزامة في أنفها والسوارين على يديها."]]}, {"l": "Gen 24:53", "n": "", "vs": [[53, "ثم أخرج جواهر من فضة ومن ذهب وثيابا وأعطاها لرفقة، وأهدى أيضا أخاها وأمها تحفا"]]}, {"l": "Exo 3:22", "n": "", "vs": [[22, "بل تطلب كل امرأة من جارتها أو نزيلة بيتها جواهر فضة وذهب وثيابا تلبسونها بنيكم وبناتكم فتغنمون ذلك من المصريين»."]]}, {"l": "Exo 32:2", "n": "", "vs": [[2, "فأجابهم هرون: «انزعوا أقراط الذهب التي في آذان نسائكم وبناتكم وبنيكم، وأعطوني إياها»."]]}, {"l": "Exo 33:4", "n": "", "vs": [[4, "فلما سمع الشعب هذا الكلام القاسي، شرعوا في النوح، ولم يتزين أحد منهم."]]}, {"l": "Exo 35:22", "n": "", "vs": [[22, "وتوافد الرجال مع النساء من ذوي النفوس السخية، متبرعين بأساور وأقراط وخواتم وقلائد وغير ذلك من الأمتعة الذهبية فكانت كل تقدمات المتبرعين من الذهب للرب."]]}, {"l": "Exo 38:8", "n": "", "vs": [[8, "وصنع حوض الاغتسال وقاعدته من نحاس. صهرها من المرايا النحاسية التي تبرعت بها النساء اللواتي احتشدن عند مدخل خيمة الاجتماع."]]}, {"l": "2Ki 9:30", "n": "", "vs": [[30, "وتوجه ياهو إلى يزرعيل. فلما علمت إيزابل بذلك كحلت عينيها وزينت شعرها وأطلت من الكوة."]]}, {"l": "Est 5:1", "n": "", "vs": [[1, "وفي اليوم الثالث ارتدت أستير ثيابا ملكية، ووقفت في القاعة الداخلية أمام البهو الملكي، الذي يجلس فيه الملك على عرشه."]]}, {"l": "Psa 45:9", "n": "", "vs": [[9, "أميرات بين حظياتك. جلست الملكة عن يمينك مزينة بذهب أوفير ."]]}, {"l": "Isa 3:18-24", "n": "", "vs": [[18, "في ذلك اليوم ينزع الرب زينة الخلاخيل، وعصابات رؤوسهن والأهلة،"], [19, "والأقراط والأساور والبراقع،"], [20, "والعصائب والسلاسل والأحزمة، وآنية الطيب والتعاويذ"], [21, "والخواتم وخزائم الأنف،"], [22, "والثيا ب المزخرفة والعباءات والمعاطف والأكياس"], [23, "والمرايا والأردية الكتانية، والعصائب المزينة وأغطية الرؤوس"], [24, "فتحل العفونة محل الطيب، والحبل عوض الحزام، والصلع بدل الشعر المنسق، وحزام المسح في موضع الثوب الفاخر، والعار عوض الجمال،"]]}, {"l": "Isa 52:1", "n": "", "vs": [[1, "استيقظي، استيقظي تسربلي بقوتك ياصهيون، ارتدي ثياب بهائك ياأورشليم، المدينة المقدسة، إذ لن يدخلك بعد اليوم أغلف ولا نجس."]]}, {"l": "Isa 61:10", "n": "", "vs": [[10, "إنني أبتهج حقا بالرب وتفرح نفسي بإلهي، لأنه كساني ثياب الخلاص وسربلني برداء البر، مثل عريس يزين رأسه بتاج، وكعروس تتجمل بحليها."]]}, {"l": "Jer 2:32", "n": "", "vs": [[32, "هل تنسى عذراء زينتها؟ أو عروس حلي زفافها؟ لكن شعبي نسيني أياما لا تحصى."]]}, {"l": "Jer 4:30", "n": "", "vs": [[30, "وأنت أيتها المدينة الموحشة، ماذا تصنعين؟ مهما لبست الثيا ب القرمزية، وتحليت بزينة من ذهب، مهما كحلت عينيك بالأثمد، فباطلا تجملين ذاتك، فقد نبذك عشاقك وسعوا للقضاء عليك."]]}, {"l": "Eze 16:7-13", "n": "", "vs": [[7, "وكثرتك كنبت الحقل، فنميت وكبرت وبلغت عمرا صرت فيه أجمل الجميلات، فنهد ثدياك ونما شعرك، ولكنك كنت عارية متجردة."], [8, "فمررت بك ورأيتك وإذا بك قد بلغت سن الحب، فبسطت عليك أطراف ثوبي، وسترت عورتك وحلفت لك وأبرمت معك عهدا، فصرت لي، يقول السيد الرب."], [9, "ثم غسلتك بماء، ونظفتك من الدم وطيبتك بالدهن."], [10, "وكسوتك بثياب موشاة وحذوتك بنعلين من جلد الدلفين، ولفعتك بالكتان الفاخر، ودثرتك بالحرير،"], [11, "وزينتك بالحلي، إذ وضعت أساور في يديك وعقدا في عنقك."], [12, "وجعلت خزامة في أنفك وقرطين في أذنيك وإكليل جمال على رأسك"], [13, "فتزينت بالذهب والفضة، وكانت ثيابك من الكتان الفاخر والحرير وكل ما هو موشى. وأكلت السميذ والعسل والزيت، فتمتعت بأروع الجمال حتى صرت صالحة لتكوني زوجة ملك."]]}, {"l": "Eze 23:40", "n": "", "vs": [[40, "بل استدعيتما رجالا قادمين من بعيد، بعد أن أرسلتما إليهم رسولا، وها هم قد أقبلوا، ومن أجلهم استحممت وكحلت عينيك وتز ينت بالحلي."]]}], "kwAr": "بضفر الشعر", "noteAr": ""}], "arS": [["وعلى المرأة ألا تعتمد ", []], ["الزينة", ["G2889"]], [" ", []], ["الخارجية", ["G1855"]], [" لإظهار جمالها، ", []], ["بضفر", ["G1708"]], [" ", []], ["الشعر", ["G2359"]], [" ", []], ["والتحلي", ["G4025"]], [" ", []], ["بالذهب", ["G5553"]], [" ", []], ["ولبس", ["G1745"]], [" ", []], ["الثياب", ["G2440"]], [" الفاخرة.", []]]}, {"c": 3, "v": 4, "text": "وإنما لتعتمد الزينة الداخلية، ليكون قلبها متزينا بروح الوداعة والهدوء. هذه هي الزينة التي لا تفنى، وهي غالية الثمن في نظر الله!", "groups": [{"kw": "the hidden", "raw": "Psa_45:13, Psa_51:6; Mat_23:26; Luk_11:40; Rom_2:29, Rom_6:6, Rom_7:22; 2Co_4:16; Eph_4:22-24; Col_3:3, Col_3:9, Col_3:10", "note": "", "refs": [{"l": "Psa 45:13", "n": "", "vs": [[13, "كلها مجد ابنة الملك في قصرها. ثيابها منسوجة بذهب."]]}, {"l": "Psa 51:6", "n": "", "vs": [[6, "ها أنت ترغب أن ترى الحق في دخيلة الإنسان، فتعرفني الحكمة في قرارة نفسي."]]}, {"l": "Mat 23:26", "n": "", "vs": [[26, "أيها الفريسي الأعمى، نظف أولا داخل الكأس ليصير خارجها أيضا نظيفا!"]]}, {"l": "Luk 11:40", "n": "", "vs": [[40, "أيها الأغبياء، أليس الذي صنع الخارج قد صنع الداخل أيضا؟"]]}, {"l": "Rom 2:29", "n": "", "vs": [[29, "وإنما اليهودي هو من كان يهوديا في الباطن، والختان هو ما كان ختانا للقلب بالروح لا بالحرف. وهذا يأتيه المدح لا من الناس بل من الله!"]]}, {"l": "Rom 6:6", "n": "", "vs": [[6, "فنحن نعلم هذا: أن الإنسان العتيق فينا قد صلب معه لكي يبطل جسد الخطيئة فلا نبقى عبيدا للخطيئة فيما بعد."]]}, {"l": "Rom 7:22", "n": "", "vs": [[22, "أن لدي الشر. فإنني، وفقا للإنسان الباطن في، أبتهج بشريعة الله."]]}, {"l": "2Co 4:16", "n": "", "vs": [[16, "لهذا، لا تخور عزيمتنا! ولكن، مادام الإنسان الظاهر فينا يفنى، فإن الإنسان الباطن فينا يتجدد يوما فيوما."]]}, {"l": "Eph 4:22-24", "n": "", "vs": [[22, "وهو أن تخلعوا ما يتعلق بسيرتكم الماضية: الإنسان العتيق الذي يفسد نفسه بالشهوات الخداعة؛"], [23, "وتتجددوا في روح ذهنكم؛"], [24, "وتلبسوا الإنسان الجديد المخلوق على مثال الله في البر والقداسة بالحق."]]}, {"l": "Col 3:3", "n": "", "vs": [[3, "فإنكم قد متم، وحياتكم مستورة مع المسيح في الله."]]}, {"l": "Col 3:9", "n": "", "vs": [[9, "لا يكذب أحدكم على الآخر، إذ قد نزعتم الإنسان العتيق وأعماله"]]}, {"l": "Col 3:10", "n": "", "vs": [[10, "ولبستم الجديد الذي يتجدد لبلوغ تمام المعرفة وفقا لصورة خالقه،"]]}], "kwAr": "الزينة الداخلية", "noteAr": ""}, {"kw": "which is not", "raw": "1Pe_1:23", "note": "", "refs": [{"l": "1Pe 1:23", "n": "", "vs": [[23, "فأنتم قد ولدتم ولادة ثانية لا من زرع بشري يفنى، بل مما لا يفنى: بكلمة الله الحية الباقية إلى الأبد."]]}], "kwAr": "لا تفنى", "noteAr": ""}, {"kw": "a meek", "raw": "1Pe_3:15; Psa_25:9, Psa_147:6, Psa_149:4; Isa_11:4, Isa_29:19, Isa_57:15, Isa_61:1; Mat_5:5, Mat_11:29; Mat_21:5; 2Co_10:1; Gal_5:23; Eph_4:2; Col_3:12; 2Ti_2:25; Tit_3:2; Jam_1:21, Jam_3:13-17", "note": "", "refs": [{"l": "1Pe 3:15", "n": "", "vs": [[15, "وإنما كرسوا المسيح ربا في قلوبكم. وكونوا دائما مستعدين لأن تقدموا جوابا مقنعا لكل من يسألكم عن سبب الرجاء الذي في داخلكم"]]}, {"l": "Psa 25:9", "n": "", "vs": [[9, "يدرب الودعاء في سبل الحق ويعلمهم طريقه."]]}, {"l": "Psa 147:6", "n": "", "vs": [[6, "يرفع الرب الودعاء، ويطرح الأشرار إلى الأرض."]]}, {"l": "Psa 149:4", "n": "", "vs": [[4, "لأن الرب يسر بشعبه، يجمل الودعاء بالخلاص."]]}, {"l": "Isa 11:4", "n": "", "vs": [[4, "إنما يقضي بعدل للمساكين، ويحكم بالإنصاف لبائسي الأرض، ويعاقب الأرض بقضيب فمه، ويميت المنافق بنفخة شفتيه،"]]}, {"l": "Isa 29:19", "n": "", "vs": [[19, "أما الوداعاء فيتجدد فرحهم بالرب، ويبتهج البائسون بقدوس إسرائيل،"]]}, {"l": "Isa 57:15", "n": "", "vs": [[15, "لأنه هكذا يقول العلي السامي، المقيم في الأبد، الذي يدعى اسمه القدوس: إنني أسكن في العلى وفي الموضع المقدس، وأقيم مع المنسحق، وذوي الروح المتواضعة، لأحيي أرواح المتواضعين، وأنعش قلوب المنسحقين."]]}, {"l": "Isa 61:1", "n": "", "vs": [[1, "روح السيد الرب علي، لأن الرب مسحني لأبشر المساكين، أرسلني لأضمد جراح المنكسري القلوب، لأنادي للمسبيين بالعتق وللمأسورين بالحرية،"]]}, {"l": "Mat 5:5", "n": "", "vs": [[5, "طوبى للودعاء، فإنهم سيرثون الأرض."]]}, {"l": "Mat 11:29", "n": "", "vs": [[29, "احملوا نيري عليكم، وتتلمذوا على يدي، لأني وديع ومتواضع القلب، فتجدوا الراحة لنفوسكم."]]}, {"l": "Mat 21:5", "n": "", "vs": [[5, "«بشروا ابنة صهيون: ها هو ملكك قادم إليك وديعا يركب على أتان وجحش ابن أتان !»"]]}, {"l": "2Co 10:1", "n": "", "vs": [[1, "ولكني أتوسل إليكم بوداعة المسيح وحلمه، أنا بولس «المتواضع وأنا حاضر بينكم، والجريء عليكم وأنا غائب عنكم»،"]]}, {"l": "Gal 5:23", "n": "", "vs": [[23, "والوداعة وضبط النفس. وليس من قانون يمنع مثل هذه الفضائل."]]}, {"l": "Eph 4:2", "n": "", "vs": [[2, "بكل تواضع ووداعة وطول بال، محتملين بعضكم بعضا في المحبة،"]]}, {"l": "Col 3:12", "n": "", "vs": [[12, "فباعتباركم جماعة مختارة من الله، قديسين محبوبين، البسوا دائما عواطف الحنان واللطف والتواضع والوداعة وطول البال،"]]}, {"l": "2Ti 2:25", "n": "", "vs": [[25, "ويؤدب بالوداعة مقاومي الإيمان، عسى أن يمنحهم الله التوبة، فيعرفوا الحق بالتمام،"]]}, {"l": "Tit 3:2", "n": "", "vs": [[2, "ولا يقولوا سوءا في أحد، ولا يكونوا مخاصمين، بل لطفاء يعاملون الجميع بوداعة تامة."]]}, {"l": "Jam 1:21", "n": "", "vs": [[21, "إذن، تخلصوا من كل ما في حياتكم من نجاسة وشر متزايد. وليكن قبولكم لتلك الكلمة التي غرسها الله في قلوبكم، قبولا وديعا. فهي القادرة أن تخلص نفوسكم."]]}, {"l": "Jam 3:13-17", "n": "", "vs": [[13, "أبينكم بعض الحكماء والفهماء؟ إذن، على هؤلاء أن يسلكوا سلوكا حسنا، مظهرين بأعمالهم تلك الوداعة التي تتصف بها الحكمة (الحقيقية)."], [14, "أما إن كانت قلوبكم مملوءة بمرارة الحسد وبالتحزب، فلا تفتخروا بحكمتكم، ولا تنكروا الحق."], [15, "إن هذه الحكمة التي تدعونها ليست نازلة من عند الله، بل هي «حكمة» أرضية بشرية شيطانية."], [16, "فحيث تكون مرارة الحسد والتحزب، ينتشر الخلاف والفوضى وجميع الشرور."], [17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}], "kwAr": "الوداعة", "noteAr": ""}, {"kw": "quiet", "raw": "Psa_131:2; Jer_51:59; 1Th_4:11; 2Th_3:12; 1Ti_2:2", "note": "", "refs": [{"l": "Psa 131:2", "n": "", "vs": [[2, "ولكني سكنت نفسي وهدأتها، فصار قلبي مطمئنا كطفل مفطوم مستسلم بين ذراعي أمه"]]}, {"l": "Jer 51:59", "n": "", "vs": [[59, "هذه هي النبوءة التي أودعها إرميا النبي سرايا بن نيريا بن محسيا، عندما رافق صدقيا ملك يهوذا إلى بابل في السنة الرابعة لحكمه. وكان سرايا آنئذ رئيس المعسكر."]]}, {"l": "1Th 4:11", "n": "", "vs": [[11, "وأن تسعوا بجد إلى العيش بهدوء، مهتمين بممارسة شؤونكم الخاصة، ومحصلين معيشتكم بعمل أيديكم، كما أوصيناكم."]]}, {"l": "2Th 3:12", "n": "", "vs": [[12, "فمثل هؤلاء نوصيهم ونناشدهم، في الرب يسوع المسيح، أن يكسبوا معيشتهم بأنفسهم، مشتغلين بهدوء."]]}, {"l": "1Ti 2:2", "n": "", "vs": [[2, "ولأجل الملوك وأصحاب السلطة، لكي نعيش حياة مطمئنة هادئة كلية التقوى والرصانة."]]}], "kwAr": "والهدوء", "noteAr": ""}, {"kw": "which is in", "raw": "1Sa_16:7; Psa_147:10,Psa_147:11, Psa_149:4; Luk_16:15", "note": "", "refs": [{"l": "1Sa 16:7", "n": "", "vs": [[7, "فقال الرب لصموئيل: «لا تلق بالا إلى وسامته وطول قامته إذ ليس هذا من اخترته، فنظرة الرب تختلف عن نظرة الإنسان، لأن الإنسان ينظر إلى المظهر الخارجي وأما الرب فإنه ينظر إلى القلب»."]]}, {"l": "Psa 147:10", "n": "", "vs": [[10, "لا تستهويه قوة الخيل، ولا تسره ساقا العداء."]]}, {"l": "Psa 147:11", "n": "", "vs": [[11, "إنما يرضى الرب بخائفيه، الراجين رحمته."]]}, {"l": "Psa 149:4", "n": "", "vs": [[4, "لأن الرب يسر بشعبه، يجمل الودعاء بالخلاص."]]}, {"l": "Luk 16:15", "n": "", "vs": [[15, "فقال لهم: «إنكم تبررون أنفسكم أمام الناس، ولكن الله يعرف قلوبكم. فما يعتبره الناس رفيع القدر، هو رجس عند الله."]]}], "kwAr": "غالية الثمن في نظر الله", "noteAr": ""}], "arS": [["وإنما لتعتمد الزينة ", []], ["الداخلية", ["G2927"]], ["، ليكون ", []], ["قلبها", ["G2588"]], [" متزينا ", []], ["بروح", ["G4151"]], [" ", []], ["الوداعة", ["G4239"]], [" ", []], ["والهدوء", ["G2272"]], [". هذه هي الزينة التي ", []], ["لا تفنى", ["G862"]], ["، وهي ", []], ["غالية الثمن", ["G4185"]], [" في ", []], ["نظر", ["G1799"]], [" ", []], ["الله", ["G2316"]], ["!", []]]}, {"c": 3, "v": 5, "text": "وبها كانت تتزين النساء التقيات قديما، فكانت الواحدة منهن تتكل على الله وتخضع لزوجها.", "groups": [{"kw": "the holy", "raw": "Pro_31:10,Pro_31:30; Luk_8:2, Luk_8:3; Act_1:14, Act_9:36; 1Ti_2:10, 1Ti_5:10; Tit_2:3, Tit_2:4", "note": "", "refs": [{"l": "Pro 31:10", "n": "", "vs": [[10, "من يعثر على المرأة الفاضلة؟ إن قيمتها تفوق اللآليء."]]}, {"l": "Pro 31:30", "n": "", "vs": [[30, "الحسن غش والجمال باطل، أما المرأة المتقية الرب فهي التي تمدح."]]}, {"l": "Luk 8:2", "n": "", "vs": [[2, "وبعض النساء اللواتي كن قد شفين من أرواح شريرة وأمراض، وهن: مريم المعروفة بالمجدلية التي طرد منها سبعة شياطين،"]]}, {"l": "Luk 8:3", "n": "", "vs": [[3, "ويونا زوجة خوزي وكيل هيرودس، وسوسنة، وغيرهن كثيرات ممن كن يساعدنه بأموالهن."]]}, {"l": "Act 1:14", "n": "", "vs": [[14, "وكانوا جميعا يداومون على الصلاة بقلب واحد، ومعهم بعض النساء، ومريم أم يسوع، وإخوته."]]}, {"l": "Act 9:36", "n": "", "vs": [[36, "وكان في مدينة يافا تلميذة اسمها طابيثا، ومعنى اسمها: غزالة، كان يشغلها دائما فعل الخير ومساعدة الفقراء."]]}, {"l": "1Ti 2:10", "n": "", "vs": [[10, "بل بما يليق بنساء يعترفن علنا بأنهن يعشن في تقوى الله، بالأعمال الصالحة!"]]}, {"l": "1Ti 5:10", "n": "", "vs": [[10, "ويكون مشهودا لها بالأعمال الصالحة، كأن تكون قد ربت الأولاد، وأضافت الغرباء، وغسلت أقدام القديسين، وأسعفت المتضايقين، ومارست كل عمل صالح!"]]}, {"l": "Tit 2:3", "n": "", "vs": [[3, "وكذلك أن تكون العجائز ذوات سيرة موافقة للقداسة، غير نمامات ولا مدمنات للخمر، بل معلمات لما هو صالح،"]]}, {"l": "Tit 2:4", "n": "", "vs": [[4, "لكي يدربن الشابات على أن يكن محبات لأزواجهن ولأولادهن،"]]}], "kwAr": "النساء التقيات", "noteAr": ""}, {"kw": "who", "raw": "1Sa_2:1; Jer_49:11; Luk_2:37; 1Ti_2:15, 1Ti_5:5; Heb_11:11", "note": "", "refs": [{"l": "1Sa 2:1", "n": "", "vs": [[1, "وصلت حنة قائلة: «ابتهج قلبي بالرب وسمت عزتي به. أفتخر على أعدائي لأني فرحت بخلاصك."]]}, {"l": "Jer 49:11", "n": "", "vs": [[11, "اترك أيتامك فإني أحييهم، ولتتكل أراملك علي."]]}, {"l": "Luk 2:37", "n": "", "vs": [[37, "وهي أرملة نحو أربع وثمانين سنة. لم تكن تفارق الهيكل وكانت تتعبد ليلا ونهارا بالصوم والدعاء."]]}, {"l": "1Ti 2:15", "n": "", "vs": [[15, "إلا أنها ستحفظ سالمة في ولادة الأولاد، على أن يثبتن في الإيمان والمحبة والقداسة مع الرزانة!"]]}, {"l": "1Ti 5:5", "n": "", "vs": [[5, "ولكن الأرملة التي تعيش وحيدة ولا معيل لها، فقد وضعت رجاءها في الله وهي تداوم على الأدعية والصلوات ليلا ونهارا."]]}, {"l": "Heb 11:11", "n": "", "vs": [[11, "وبالإيمان أيضا، نالت سارة زوجة إبراهيم قدرة على الإنجاب، فولدت ابنا مع أنها كانت قد جاوزت سن الحمل. وذلك لأنها آمنت بأن الله ، الذي وعدها بذلك، لابد أن يحقق وعده."]]}], "kwAr": "تتكل على الله", "noteAr": ""}, {"kw": "adorned", "raw": "1Pe_3:2-4", "note": "", "refs": [{"l": "1Pe 3:2-4", "n": "", "vs": [[2, "وذلك حين يلاحظ سلوكها الطاهر ووقارها."], [3, "وعلى المرأة ألا تعتمد الزينة الخارجية لإظهار جمالها، بضفر الشعر والتحلي بالذهب ولبس الثياب الفاخرة."], [4, "وإنما لتعتمد الزينة الداخلية، ليكون قلبها متزينا بروح الوداعة والهدوء. هذه هي الزينة التي لا تفنى، وهي غالية الثمن في نظر الله!"]]}], "kwAr": "تتزين", "noteAr": ""}], "arS": [["وبها كانت تتزين ", []], ["النساء", ["G1135"]], [" ", []], ["التقيات", ["G40"]], [" ", []], ["قديما", ["G4218"]], ["، فكانت الواحدة منهن ", []], ["تتكل", ["G1679"]], [" على ", []], ["الله", ["G2316"]], [" ", []], ["وتخضع", ["G5293"]], [" ", []], ["لزوجها", ["G435"]], [".", []]]}, {"c": 3, "v": 6, "text": "فسارة، مثلا، كانت تطيع زوجها إبراهيم وتدعوه «سيدي». والمؤمنات اللواتي يقتدين بها، يثبتن أنهن بنات لها، إذ يتصرفن تصرفا صالحا، فلا يخفن أي تهديد.", "groups": [{"kw": "as Sara", "raw": "Gen_18:12", "note": "", "refs": [{"l": "Gen 18:12", "n": "", "vs": [[12, "فضحكت سارة في نفسها قائلة: «أبعد أن فني عمري وأصبح زوجي شيخا يكون لي هذا التنعم؟»"]]}], "kwAr": "سارة", "noteAr": ""}, {"kw": "daughters", "raw": "Gr. children, Rom_9:7-9; Gal_4:22-26", "note": "Gr. children, Rom_9:7-9; Gal_4:22-26", "refs": [{"l": "Rom 9:7-9", "n": "", "vs": [[7, "وليسوا، لأنهم نسل إبراهيم، كلهم أولادا لله، بل (كما قد كتب): «بإسحاق سيكون لك نسل يحمل اسمك»."], [8, "أي أن أولاد الجسد ليسوا هم أولاد الله، بل أولاد الوعد يحسبون نسلا."], [9, "فهذه هي كلمة الوعد: «في مثل هذا الوقت أعود، ويكون لسارة ابن»."]]}, {"l": "Gal 4:22-26", "n": "", "vs": [[22, "فإنه قد كتب أن إبراهيم كان له ابنان: أحدهما من الجارية، والآخر من المرأة الحرة."], [23, "أما ابن الجارية، فقد ولد حسب الجسد. وأما ابن الحرة، فإتماما للوعد."], [24, "وهذه الحقيقة لها معنى رمزي. فهاتان المرأتان ترمزان إلى عهدين: الأول مصدره جبل سيناء، يجعل المولودين تحته في حال العبودية، ورمزه هاجر."], [25, "ولفظة هاجر تطلق على جبل سيناء، في بلاد العرب، وتمثل أورشليم الحالية، فإنها مع بنيها في العبودية."], [26, "أما الثاني، فرمزه الحرة التي تمثل أورشليم السماوية التي هي أمنا."]]}], "kwAr": "بنات لها", "noteAr": "في اليونانية: أولاد."}, {"kw": "and", "raw": "1Pe_3:14, 1Pe_3:15; Gen_18:15; Isa_57:11; Dan_3:16-18; Mat_26:69-75; Act_4:8-13, Act_4:19", "note": "", "refs": [{"l": "1Pe 3:14", "n": "", "vs": [[14, "وإن كان لابد أن تتألموا في سبيل البر، فطوبى لكم! لا تخافوا من تهديد الذين يضطهدونكم، ولا تقلقوا."]]}, {"l": "1Pe 3:15", "n": "", "vs": [[15, "وإنما كرسوا المسيح ربا في قلوبكم. وكونوا دائما مستعدين لأن تقدموا جوابا مقنعا لكل من يسألكم عن سبب الرجاء الذي في داخلكم"]]}, {"l": "Gen 18:15", "n": "", "vs": [[15, "فخافت سارة وأنكرت قائلة: «لم أضحك». فقال: «لا، بل ضحكت»."]]}, {"l": "Isa 57:11", "n": "", "vs": [[11, "ممن خفتم وارتعبتم حتى كذبتم ولم تذكروني أو تفكروا في؟ هل اعتصمت بالسكينة زمنا طويلا حتى لم تعودوا تخافونني؟"]]}, {"l": "Dan 3:16-18", "n": "", "vs": [[16, "فأجابه شدرخ وميشخ وعبدنغو: «لا داعي لأن نجيبك عن هذا الشأن"], [17, "لأن إلهنا الذي نعبده قادر أن ينجينا من أتون النار المتقدة، وأن ينقذنا من يدك أيها الملك."], [18, "وحتى إن لم ينقذنا، فاعلم يقينا أيها الملك أننا لا نعبد آلهتك، ولا نسجد لتمثال الذهب الذي نصبته»."]]}, {"l": "Mat 26:69-75", "n": "", "vs": [[69, "في تلك الأثناء كان بطرس جالسا في الدار الخارجية، فتقدمت إليه خادمة وقالت: «وأنت كنت مع يسوع الجليلي»."], [70, "فأنكر بطرس أمام الجميع وقال: «لا أدري ما تقولين!»"], [71, "ثم خرج إلى مدخل الدار، فعرفته خادمة أخرى، فقالت للحاضرين هناك: «وهذا كان مع يسوع الناصري!»"], [72, "فأنكر بطرس مرة ثانية وأقسم: «إني لا أعرف ذلك الرجل!»"], [73, "وبعد قليل تقدم الواقفون هناك إلى بطرس وقالوا له: «بالحق إنك واحد منهم، فإن لهجتك تدل عليك!»"], [74, "فابتدأ بطرس يلعن ويحلف، قائلا: «إني لا أعرف ذلك الرجل!» وفي الحال صاح الديك،"], [75, "فتذكر بطرس كلمة يسوع إذ قال له: «قبل أن يصيح الديك تكون قد أنكرتني ثلاث مرات». فخرج إلى الخارج، وبكى بكاء مرا."]]}, {"l": "Act 4:8-13", "n": "", "vs": [[8, "فامتلأ بطرس من الروح القدس وأجابهم: «يارؤساء الشعب وياشيوخه،"], [9, "إن كنتم تستجوبوننا اليوم بسبب الإحسان إلى إنسان مريض لتعرفوا كيف شفي،"], [10, "فاعلموا جميعا، وليعرف شعب إسرائيل كله، أنه باسم يسوع المسيح الناصري الذي صلبتموه أنتم، والذي أقامه الله من بين الأموات، باسمه يقف هذا الكسيح أمامكم في تمام الصحة!"], [11, "يسوع هذا هو الحجر الذي رفضتموه أيها البناة، وهو نفسه صار حجر الزاوية الأساسي،"], [12, "وليس بأحد غيره الخلاص، إذ ليس تحت السماء اسم آخر قدمه الله للبشر به يجب أن نخلص!»"], [13, "فتعجب المجتمعون من جرأة بطرس ويوحنا، لما عرفوا أنهما غير متعلمين وأنهما من عامة الشعب، فأدركوا أنهما كانا مع يسوع."]]}, {"l": "Act 4:19", "n": "", "vs": [[19, "ولكن بطرس ويوحنا قالا: «احكموا أنتم: أمن الحق أمام الله أن نطيع أمركم لا أمر الله؟"]]}], "kwAr": "فلا يخفن", "noteAr": ""}], "arS": [["فسارة", ["G4564"]], ["، مثلا، كانت ", []], ["تطيع", ["G5219"]], [" زوجها ", []], ["إبراهيم", ["G11"]], [" ", []], ["وتدعوه", ["G2564"]], [" «", []], ["سيدي", ["G2962"]], ["». والمؤمنات اللواتي يقتدين بها، يثبتن أنهن ", []], ["بنات", ["G5043"]], [" لها، إذ يتصرفن ", []], ["تصرفا صالحا", ["G15"]], ["، فلا ", []], ["يخفن", ["G5399"]], [" ", []], ["أي", ["G3367"]], [" ", []], ["تهديد", ["G4423"]], [".", []]]}, {"c": 3, "v": 7, "text": "وأنتم، أيها الأزواج، إذ تساكنون زوجاتكم عالمين بأنهن أضعف منكم، أكرموهن باعتبارهن شريكات لكم في وراثة نعمة الحياة، لكي لا يعوق صلواتكم شيء.", "groups": [{"kw": "ye", "raw": "Gen_2:23, Gen_2:24; Pro_5:15-19; Mal_2:14-16; Mat_19:3-9; 1Co_7:3; Col_3:19; Eph_5:25-28, Eph_5:33", "note": "", "refs": [{"l": "Gen 2:23", "n": "", "vs": [[23, "فقال آدم: «هذه الآن عظم من عظامي ولحم من لحمي. فهي تدعى امرأة لأنها من امريء أخذت»."]]}, {"l": "Gen 2:24", "n": "", "vs": [[24, "لهذا، فإن الرجل يترك أباه وأمه ويلتصق بامرأته، ويصيران جسدا واحدا."]]}, {"l": "Pro 5:15-19", "n": "", "vs": [[15, "اشرب ماء من جبك، ومياها جارية من بئرك."], [16, "أينبغي على ينابيعك أن تفيض إلى الخارج كأنهار مياه في الشوارع؟"], [17, "ليكن أولادك لك وحدك، لا نصيب للغرباء معك فيهم."], [18, "ليكن ينبوع عفتك مباركا، واغتبط بامرأة شبابك،"], [19, "فتكون كالظبية المحبوبة والوعلة البهية، فترتوي من فيض فتنتها، وتظل دائما أسير حبها."]]}, {"l": "Mal 2:14-16", "n": "", "vs": [[14, "وتتساءلون: لماذا؟ لأن الرب كان شاهدا على العهد المقطوع بينك وبين زوجة صباك التي غدرت بها، مع أنها شريكتك وامرأة عهدك."], [15, "ولكن لم يقدم على ذلك أي واحد مازالت فيه بقية من الروح. وماذا طلب هذا الواحد (أي إبراهيم)؟ ذرية الله. لهذا حافظوا على أرواحكم، ولا يغدر أحد بزوجة صباه."], [16, "ويقول الرب إله إسرائيل: إني أمقت الطلاق وأمقت أن يغطي الرجل زوجته بجوره، كما يتغطى هو بثوبه. لذلك احترسوا على أنفسكم ولا تنكثوا عهدا."]]}, {"l": "Mat 19:3-9", "n": "", "vs": [[3, "وتقدم إليه بعض الفريسيين يجربونه، فسألوه: «هل يحل للرجل أن يطلق زوجته لأي سبب؟»"], [4, "فأجابهم قائلا: «ألم تقرأوا أن الخالق جعل الإنسان منذ البدء ذكرا وأنثى،"], [5, "وقال: لذلك يترك الرجل أباه وأمه ويتحد بزوجته، فيصير الاثنان جسدا واحدا؟"], [6, "فليسا في ما بعد اثنين، بل جسد واحد. فلا يفرقن الإنسان ما قد قرنه الله !»"], [7, "فسألوه: «فلماذا أوصى موسى بأن تعطى الزوجة وثيقة طلاق فتطلق؟»"], [8, "أجاب: «بسبب قساوة قلوبكم، سمح لكم موسى بتطليق زوجاتكم. ولكن الأمر لم يكن هكذا منذ البدء."], [9, "ولكني أقول لكم: إن الذي يطلق زوجته لغير علة الزنى، ويتزوج بغيرها، فإنه يرتكب الزنى. والذي يتزوج بمطلقة، يرتكب الزنى»."]]}, {"l": "1Co 7:3", "n": "", "vs": [[3, "وليوف الزوج زوجته حقها الواجب، وكذلك الزوجة حق زوجها."]]}, {"l": "Col 3:19", "n": "", "vs": [[19, "أيها الأزواج، أحبوا زوجاتكم، ولا تعاملوهن بقسوة."]]}, {"l": "Eph 5:25-28", "n": "", "vs": [[25, "أيها الأزواج، أحبوا زوجاتكم مثلما أحب المسيح الكنيسة وبذل نفسه لأجلها،"], [26, "لكي يقدسها مطهرا إياها بغسل الماء، بالكلمة،"], [27, "حتى يزفها إلى نفسه كنيسة بهية لا يشوبها عيب أو تجعد أو أية نقيصة مشابهة بل تكون مقدسة خالية من العيوب."], [28, "على هذا المثال يجب على الأزواج أن يحبوا زوجاتهم كأجسادهم. إن من يحب زوجته، يحب نفسه."]]}, {"l": "Eph 5:33", "n": "", "vs": [[33, "إنما أنتم أيضا، كل بمفرده، ليحب كل واحد منكم زوجته كنفسه. وأما الزوجة، فعليها أن تهاب زوجها."]]}], "kwAr": "أيها الأزواج", "noteAr": ""}, {"kw": "giving", "raw": "1Co_12:22-24; 1Th_4:4", "note": "", "refs": [{"l": "1Co 12:22-24", "n": "", "vs": [[22, "بل بالأحرى جدا، أعضاء الجسد التي تبدو أضعف الأعضاء هي ضرورية،"], [23, "وتلك التي نعتبرها أقل ما في الجسد كرامة، نكسوها بإكرام أوفر. والأعضاء غير اللائقة يكون لها لياقة أوفر؛"], [24, "أما اللائقة، فلا تحتاج إلى ذلك. ولكن الله أحكم صنع الجسد بجملته، معطيا كرامة أوفر لما تنقصه الكرامة،"]]}, {"l": "1Th 4:4", "n": "", "vs": [[4, "وأن يعرف كل واحد منكم كيف يحفظ جسده في الطهارة والكرامة"]]}], "kwAr": "أكرموهن", "noteAr": ""}, {"kw": "heirs", "raw": "Eph_3:6; Tit_3:7; Heb_1:14", "note": "", "refs": [{"l": "Eph 3:6", "n": "", "vs": [[6, "وهو أن الأمم هم شركاء اليهود في الميراث، وأعضاء في الجسد معهم، ولهم أيضا حق الاستفادة من الوعد. وذلك في المسيح يسوع وبفضل الإنجيل"]]}, {"l": "Tit 3:7", "n": "", "vs": [[7, "حتى إذا تبررنا بنعمته، نصير ورثة، وفقا لرجائنا بالحياة الأبدية."]]}, {"l": "Heb 1:14", "n": "", "vs": [[14, "لا! فليس الملائكة إلا أرواحا خادمة ترسل لخدمة الذين سيرثون الخلاص."]]}], "kwAr": "شريكات لكم في وراثة", "noteAr": ""}, {"kw": "that", "raw": "Job_42:8; Mat_5:23, Mat_5:24, Mat_18:19; Rom_8:26, Rom_8:27; Eph_4:30, Eph_6:18", "note": "", "refs": [{"l": "Job 42:8", "n": "", "vs": [[8, "فخذوا الآن لكم سبعة ثيران وسبعة كباش، وامضوا إلى عبدي أيوب وقربوها ذبيحة محرقة عن أنفسكم، فيصلي من أجلكم، فأعفو عنكم إكراما له، لئلا أعاقبكم بمقتضى حماقتكم، لأنكم لم تنطقوا بالحق عني كعبدي أيوب»."]]}, {"l": "Mat 5:23", "n": "", "vs": [[23, "فإذا جئت بتقدمتك إلى المذبح، وهناك تذكرت أن لأخيك شيئا عليك،"]]}, {"l": "Mat 5:24", "n": "", "vs": [[24, "فاترك تقدمتك أمام المذبح، واذهب أولا وصالح أخاك، ثم ارجع وقدم تقدمتك."]]}, {"l": "Mat 18:19", "n": "", "vs": [[19, "وأيضا أقول لكم: إذا اتفق اثنان منكم على الأرض في أي أمر، مهما كان ما يطلبانه، فإن ذلك يكون لهما من قبل أبي الذي في السماوات."]]}, {"l": "Rom 8:26", "n": "", "vs": [[26, "وكذلك الروح أيضا يمدنا بالعون لنقهر ضعفنا. فإننا لا نعلم ما يجب أن نصلي لأجله كما يليق، ولكن الروح نفسه يؤدي الشفاعة عنا بأنات تفوق التعبير."]]}, {"l": "Rom 8:27", "n": "", "vs": [[27, "على أن فاحص القلوب يعلم قصد الروح، لأن الروح يشفع في القديسين بما يوافق الله ."]]}, {"l": "Eph 4:30", "n": "", "vs": [[30, "ولا تحزنوا روح الله، الروح القدس الذي به ختمتم ليوم الفداء."]]}, {"l": "Eph 6:18", "n": "", "vs": [[18, "كونوا مصلين في كل حال، بكل صلاة وطلبة في الروح، وساهرين لهذا الغرض عينه مواظبين تماما على جميع الطلبات لأجل القديسين جميعا،"]]}], "kwAr": "لكي لا يعوق صلواتكم شيء", "noteAr": ""}], "arS": [["وأنتم، أيها ", []], ["الأزواج", ["G435"]], ["، إذ ", []], ["تساكنون", ["G4924"]], [" زوجاتكم ", []], ["عالمين", ["G1108"]], [" بأنهن ", []], ["أضعف", ["G772"]], [" منكم، ", []], ["أكرموهن", ["G632", "G5092"]], [" باعتبارهن ", []], ["شريكات لكم في وراثة", ["G4789"]], [" ", []], ["نعمة", ["G5485"]], [" ", []], ["الحياة", ["G2222"]], ["، لكي لا ", []], ["يعوق", ["G1581"]], [" ", []], ["صلواتكم", ["G4335"]], [" شيء.", []]]}, {"c": 3, "v": 8, "text": "والخلاصة، كونوا جميعا متحدين في الرأي، متعاطفين بعضكم مع بعض، مبادلين أحدكم الآخر المحبة الأخوية، شفوقين، متواضعين.", "groups": [{"kw": "be", "raw": "Act_2:1, Act_4:32; Rom_12:16, Rom_15:5; 1Co_1:10; Phi_3:16", "note": "", "refs": [{"l": "Act 2:1", "n": "", "vs": [[1, "ولما جاء اليوم الخمسون، كان الإخوة مجتمعين معا في مكان واحد،"]]}, {"l": "Act 4:32", "n": "", "vs": [[32, "وكانت جماعة المؤمنين قلبا واحدا ونفسا واحدة، ولم يكن أحد يقول إن شيئا مما عنده هو له وحده، بل كان كل شيء عندهم مشتركا."]]}, {"l": "Rom يلوث الجسم كله بالفساد. إنه يشعل دائرة الكون، ويستمد ناره من جهنم!"], [7, "من السهل على الإنسان أن يروض الوحوش والطيور والزواحف والحيوانات البحرية، بجميع أجناسها. فهذا ما نراه يحدث."], [8, "ولكن أحدا من الناس لا يقدر أن يروض اللسان. فهو شر لا ينضبط، ممتليء بالسم القتال!"], [9, "به نرفع الحمد والشكر للرب والآب، وبه نوجه الشتائم إلى الناس الذين خلقهم الله على مثاله."], [10, "وهكذا، تخرج البركات واللعنات من الفم الواحد. وهذا، ياإخوتي، يجب ألا يحدث أبدا!"]]}], "kwAr": "فليمنع لسانه", "noteAr": ""}, {"kw": "speak", "raw": "1Pe_2:1, 1Pe_2:22; Joh_1:47; Rev_14:5", "note": "", "refs": [{"l": "1Pe 2:1", "n": "", "vs": [[1, "لذلك، تخلصوا من كل أثر للشر والخداع والرياء والحسد والذم."]]}, {"l": "1Pe 2:22", "n": "", "vs": [[22, "إنه لم يفعل خطيئة واحدة، ولا كان في فمه مكر."]]}, {"l": "Joh 1:47", "n": "", "vs": [[47, "ورأى يسوع نثنائيل قادما نحوه فقال عنه: «هذا إسرائيلي أصيل لا شك فيه!»"]]}, {"l": "Rev 14:5", "n": "", "vs": [[5, "لم تنطق أفواههم بالكذب، ولا عيب فيهم."]]}], "kwAr": "كلام الغش", "noteAr": ""}], "arS": [["فمن ", []], ["أراد", ["G2309"]], [" أن ", []], ["يتمتع", ["G25"]], [" ", []], ["بحياة", ["G2222"]], [" سعيدة ", []], ["وأيام", ["G2250"]], [" ", []], ["طيبة", ["G18"]], ["، ", []], ["فليمنع", ["G3973"]], [" ", []], ["لسانه", ["G1100"]], [" عن ", []], ["الشر", ["G2556"]], [" ", []], ["وشفتيه", ["G5491"]], [" عن ", []], ["كلام", ["G2980"]], [" ", []], ["الغش", ["G1388"]], [".", []]]}, {"c": 3, "v": 11, "text": "ليتحول عن الشر ويفعل الخير. ليطلب السلام ويسع للوصول إليه.", "groups": [{"kw": "eschew", "raw": "Job_1:1, Job_2:3, Job_28:28; Psa_34:14, Psa_37:27; Pro_3:7, Pro_16:6, Pro_16:17; Isa_1:16, Isa_1:17; Mat_6:13; Joh_17:15", "note": "", "refs": [{"l": "Job 1:1", "n": "", "vs": [[1, "عاش في أرض عوص رجل اسمه أيوب، كان صالحا كاملا يتقي الله ويحيد عن الشر."]]}, {"l": "Job 2:3", "n": "", "vs": [[3, "فقال الرب للشيطان: «هل راقبت عبدي أيوب فإنه لا نظير له في الأرض، فهو رجل كامل صالح، يتقي الله ويحيد عن الشر، وحتى الآن لا يزال معتصما بكماله، مع أنك أثرتني عليه لأهلكه من غي Rom 14:19", "n": "", "vs": [[19, "فلنسع إذن وراء ما يؤدي إلى السلام وما يؤدي إلى بنيان بعضنا بعضا."]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Col 3:15", "n": "", "vs": [[15, "وليملك في قلوبكم سلام المسيح، فإليه قد دعيتم في الجسد الواحد؛ وكونوا شاكرين!"]]}, {"l": "Heb 12:14", "n": "", "vs": [[14, "اجعلوا هدفكم أن تسالموا جميع الناس، وتعيشوا حياة مقدسة. فبغير قداسة، لا يقدر أحد أن يرى الرب."]]}, {"l": "Jam 3:17", "n": "", "vs": [[17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}, {"l": "Jam 3:18", "n": "", "vs": [[18, "والبر هو ثمر ة ما يزرعه في سلام صانعو السلام."]]}], "kwAr": "ليطلب السلام", "noteAr": ""}], "arS": [["ليتحول", ["G1578"]], [" عن ", []], ["الشر", ["G2556"]], [" ", []], ["ويفعل", ["G4160"]], [" ", []], ["الخير", ["G18"]], [". ", []], ["ليطلب", ["G2212"]], [" ", []], ["السلام", ["G1515"]], [" ", []], ["ويسع للوصول إليه", ["G1377"]], [".", []]]}, {"c": 3, "v": 12, "text": "لأن الرب يرعى الأبرار بعنايته، ويستجيب إلى دعائهم. ولكنه يقف ضد الذين يعملون الشر…", "groups": [{"kw": "the eyes", "raw": "Deu_11:12; 2Ch_16:9; Psa_11:4; Pro_15:3; Zec_4:10", "note": "", "refs": [{"l": "Deu 11:12", "n": "", "vs": [[12, "أرض يعتني بها الرب إلهكم، إذ ترعاها عيناه دائما من أول السنة حتى آخرها."]]}, {"l": "2Ch 16:9", "n": "", "vs": [[9, "إن عيني الرب تجولان في الأرض قاطبة ليقوي ذوي القلوب الخالصة له، أما أنت فقد تصرفت بحماقة في هذا الأمر لهذا تثور ضدك حروب»."]]}, {"l": "Psa 11:4", "n": "", "vs": [[4, "مازال الرب في هيكله المقدس. الرب في السماء عرشه. تبصر عيناه بني آدم، وتتقصاهم أجفانه."]]}, {"l": "Pro 15:3", "n": "", "vs": [[3, "عينا الرب في كل مكان تراقبان الأشرار والأخيار."]]}, {"l": "Zec 4:10", "n": "", "vs": [[10, "من يزدري بيوم الإنجازات الصغيرة؟ يفرح الرجال حين يشاهدون ميزان البناء في يد زربابل، وهذه السبعة هي أعين الرب الجائلة ف
