": "", "vs": [[19, "إذن، على الذين يتألمون وفقا لإرادة الله، أن يسلموا أنفسهم للخالق الأمين، ويواظبوا على عمل الصلاح!"]]}, {"l": "1Pe 3:17", "n": "", "vs": [[17, "فإن كان الله يريد لكم أن تتألموا، فمن الأفضل أن تتألموا وأنتم تفعلون الخير لا الشر."]]}, {"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}, {"l": "Act 11:26", "n": "", "vs": [[26, "ولما وجده جاء به إلى أنطاكية، فكانا يجتمعان مع الكنيسة هناك سنة كاملة، ويعلمان جمعا كبيرا. وفي أنطاكية أطلق على تلاميذ الرب أول مرة اسم المسيحيين."]]}, {"l": "Act 26:28", "n": "", "vs": [[28, "فأجاب أغريباس: «قليلا بعد، وتقنعني بأن أصير مسيحيا!»"]]}, {"l": "Eph 3:13-15", "n": "", "vs": [[13, "فلذلك أطلب إليكم ألا يفتر عزمكم بسبب الضيقات التي أقاسيها لأجلكم، فهي مفخرة لكم."], [14, "ولهذا السبب أحني ركبتي للآب"], [15, "الذي هو أصل كل أبوة في السماوات وعلى الأرض،"]]}], "kwAr": "مسيحي", "noteAr": ""}, {"kw": "let him not", "raw": "Isa_50:7, Isa_54:4; Phi_1:20; 2Ti_1:12; Heb_12:2, Heb_12:3", "note": "", "refs": [{"l": "Isa 50:7", "n": "", "vs": [[7, "لأن السيد الرب يغيثني فلا أخزى، لذلك جعلت وجهي كالصوان، لأني عالم أنني لن أخزى."]]}, {"l": "Isa 54:4", "n": "", "vs": [[4, "لا تجزعي لأنك لن تخزي، ولا تخجلي لأنه لن يلحق بك عار، فأنت ستنسين خزي صباك، ولن تذكري من بعد عار ترملك."]]}, {"l": "Phi 1:20", "n": "", "vs": [[20, "وفقا لما أتوقعه وأرجوه: أني لن أفشل في شيء، بل في كل جرأة وكما في كل حين فكذلك الآن أيضا، يتعظم المسيح في جسدي، سواء أكان بالحياة أم بالموت."]]}, {"l": "2Ti 1:12", "n": "", "vs": [[12, "من أجل ذلك أيضا أقاسي الآن هذه الآلام، ولكني لست أخجل، لأنني أعرف من أنا مؤمن به، ولي تمام الثقة بأنه قادر أن يحفظ لي الأمانة التي أودعتها عنده سالمة إلى ذلك اليوم."]]}, {"l": "Heb 12:2", "n": "", "vs": [[2, "متطلعين دائما إلى يسوع: رائد إيماننا ومكمله. فهو قد تحمل الموت صلبا، هازئا بما في ذلك من عار، إذ كان ينظر إلى السرور الذي ينتظره، ثم جلس عن يمين عرش الله."]]}, {"l": "Heb 12:3", "n": "", "vs": [[3, "فتأملوا مليا ما قاساه بتحمله تلك المعاملة العنيفة التي عامله بها الخاطئون، لكي لا تتعبوا وتنهاروا!"]]}], "kwAr": "ألا يخجل", "noteAr": ""}, {"kw": "but", "raw": "Isa_24:15; Act_5:41; Rom_5:2-5; Phi_1:29; Jam_1:2-4", "note": "", "refs": [{"l": "Isa 24:15", "n": "", "vs": [[15, "لذلك مجدوا الرب في المشرق، مجدوا اسم الرب إله إسرائيل في جزائر البحر."]]}, {"l": "Act 5:41", "n": "", "vs": [[41, "ولكن الرسل خرجوا من المجلس فرحين، لأنهم اعتبروا أهلا لأن يلقوا الإهانة من أجل اسم يسوع."]]}, {"l": "Rom 5:2-5", "n": "", "vs": [[2, "وبه أيضا تم لنا الدخول بالإيمان إلى هذه النعمة التي نقيم فيها الآن؛ ونحن نفتخر برجائنا في التمتع بمجد الله."], [3, "ليس هذا فقط، بل نفتخر أيضا في وسط الضيقات، لعلمنا أن الضيق ينتج فينا الصبر،"], [4, "والصبر يؤهلنا للفوز في الامتحان، والفوز يبعث فينا الرجاء،"], [5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."]]}, {"l": "Phi 1:29", "n": "", "vs": [[29, "فقد وهب لكم، لأجل المسيح، لا أن تؤمنوا به وحسب، بل أيضا أن تتألموا لأجله،"]]}, {"l": "Jam 1:2-4", "n": "", "vs": [[2, "ياإخوتي، عندما تنزل بكم التجارب والمحن المختلفة، اعتبروها سبيلا إلى الفرح الكلي."], [3, "وكونوا على ثقة بأن امتحان إيمانكم هذا ينتج صبرا."], [4, "ودعوا الصبر يعمل عمله الكامل فيكم، لكي يكتمل نضوجكم وتصيروا أقوياء قادرين على مواجهة جميع الأحوال."]]}], "kwAr": "أن يمجد الله", "noteAr": ""}], "arS": [["ولكن إن تألم أحدكم لأنه «", []], ["مسيحي", ["G5546"]], ["»، فعليه ألا ", []], ["يخجل", ["G153"]], ["، بل أن ", []], ["يمجد", ["G1392"]], [" ", []], ["الله", ["G2316"]], [" لأجل هذا ", []], ["الاسم", ["G3313"]], ["!", []]]}, {"c": 4, "v": 17, "text": "حقا إن الوقت قد حان ليبتديء القضاء بأهل بيت الله. فإن كان القضاء يبدأ بنا أولا، فما هو مصير الذين لا يؤمنون بإنجيل الله؟", "groups": [{"kw": "judgment", "raw": "Isa_10:12; Jer_25:29, Jer_49:12; Eze_9:6; Mal_3:5; Mat_3:9, Mat_3:10; Luk_12:47, Luk_12:48", "note": "", "refs": [{"l": "Isa 10:12", "n": "", "vs": [[12, "ولكن حالما ينتهي الرب من عمله بجبل صهيون، فإنه سيعاقب ملك أشور على غرور قلبه وتشامخ عينيه،"]]}, {"l": "Jer 25:29", "n": "", "vs": [[29, "لأني شرعت أعاقب المدينة التي دعي اسمي عليها، فهل تفلتون أنتم من العقاب؟ فها أنا قد سلطت السيف على جميع سكان الأرض، يقول الرب القدير."]]}, {"l": "Jer 49:12", "n": "", "vs": [[12, "لأن هذا ما يعلنه الرب: إن كان الذين لا يستحقون تجرع كأس العقاب قد تجرعوه، أتفلت أنت من العقاب؟ إنك لن تفلت من العقاب، بل عليك أن تجرعه حتما."]]}, {"l": "Eze 9:6", "n": "", "vs": [[6, "أهلكوا الشيخ والشاب والعذراء والطفل والنساء. ولكن لا تقربوا من أي إنسان عليه السمة، وابتدئوا من مقدسي». فابتدأوا يهلكون الرجال والشيوخ الموجودين أمام الهيكل."]]}, {"l": "Mal 3:5", "n": "", "vs": [[5, "وأقترب منكم لأكون شاهدا سريعا ضد السحرة والزناة والحالفين بالزور والمستغلين لأجرة العامل ومضطهدي الأرامل والأيتام، والذين يظلمون الغرباء ولا يخافونني"]]}, {"l": "Mat 3:9", "n": "", "vs": [[9, "ولا تعللوا أنفسكم قائلين: لنا إبراهيم أبا! فإني أقول لكم: إن الله قادر أن يطلع من هذه الحجارة أولادا لإبراهيم."]]}, {"l": "Mat 3:10", "n": "", "vs": [[10, "وها إن الفأس قد ألقيت على أصل الشجر، فكل شجرة لا تثمر ثمرا جيدا تقطع وتطرح في النار."]]}, {"l": "Luk 12:47", "n": "", "vs": [[47, "وأما ذلك العبد الذي يعمل بإرادة سيده، فإنه سيضرب كثيرا."]]}, {"l": "Luk 12:48", "n": "", "vs": [[48, "ولكن الذي لا يعلمها ويعمل ما يستوجب الضرب، فإنه سيضرب قليلا. فكل من أعطي كثيرا، يطلب منه كثير؛ ومن أودع كثيرا، يطالب بأكثر."]]}], "kwAr": "القضاء", "noteAr": ""}, {"kw": "and if", "raw": "Luk_23:31", "note": "", "refs": [{"l": "Luk 23:31", "n": "", "vs": [[31, "فإن كانوا قد فعلوا هذا بالغصن الأخضر، فماذا يجري لليابس؟»"]]}], "kwAr": "فإن كان القضاء يبدأ بنا", "noteAr": ""}, {"kw": "what", "raw": "Mat_11:20-24; Luk_10:12-14; Heb_2:2, Heb_2:4, Heb_12:24, Heb_12:25", "note": "", "refs": [{"l": "Mat 11:20-24", "n": "", "vs": [[20, "ثم بدأ يسوع يوبخ المدن التي جرت فيها أكثر معجزاته، لكون أهلها لم يتوبوا."], [21, "فقال: «الويل لك ياكورزين! الويل لك يابيت صيدا! فلو أجري في صور وصيدا ما أجري فيكما من المعجزات، لتاب أهلهما منذ القديم متشحين بالمسوح في وسط الرماد."], [22, "ولكني أقول لكم: إن حالة صور وصيدا في الدينونة، ستكون أخف وطأة من حالتكما!"], [23, "وأنت ياكفر ناحوم: هل ارتفعت حتى السماء؟ إنك إلى قعر الهاوية ستهبطين. فلو جرى في سدوم ما جرى فيك من المعجزات، لبقيت حتى اليوم."], [24, "ولكني أقول لكم إن حالة بلاد سدوم في يوم الدينونة، ستكون أخف وطأة من حالتك! »"]]}, {"l": "Luk 10:12-14", "n": "", "vs": [[12, "أقول لكم: إن سدوم ستكون حالتها في ذلك اليوم أخف وطأة من حالة تلك المدينة…"], [13, "الويل لك ياكورزين! الويل لك يابيت صيدا! فلو أجري في صور وصيدا ما أجري فيكما من المعجزات، لتاب أهلهما منذ القديم متشحين بالمسوح قاعدين في الرماد."], [14, "ولكن صور وصيدا ستكون حالتهما في الدينونة أخف وطأة من حالتكما."]]}, {"l": "Heb 2:2", "n": "", "vs": [[2, "فإننا نعلم أن كل كلمة نقلتها الملائكة، قد تبين أنها ثابتة، وقد نال كل متعد أو مخالف لها عقابا عادلا."]]}, {"l": "Heb 2:4", "n": "", "vs": [[4, "وقد أيد الله شهادتهم بعلامات وعجائب ومعجزات مختلفة، وبالمواهب التي وزعها الروح القدس وفقا لإرادته!"]]}, {"l": "Heb 12:24", "n": "", "vs": [[24, "كذلك، تقدمتم إلى يسوع، وسيط العهد الجديد، وإلى دمه المرشوش الذي يتكلم مطالبا بأفضل مما طالب به دم هابيل."]]}, {"l": "Heb 12:25", "n": "", "vs": [[25, "إذن حذار أن ترفضوا الذي يتكلم! فمادام أولئك الذين رفضوا الاستماع لمن كلمهم على هذه الأرض، لم يفلتوا (من العقاب) قط، فكم بالأحرى لا نفلت نحن أبدا إن تحولنا عن الذي يتكلم إلينا من السماء عينها!"]]}], "kwAr": "فما هو مصير", "noteAr": ""}, {"kw": "obey", "raw": "1Pe_2:8; Gal_3:1, Gal_5:7; 2Th_1:8; Heb_5:9, Heb_11:8", "note": "", "refs": [{"l": "1Pe 2:8", "n": "", "vs": [[8, "كما أنه هو «الحجر الذي يصطدمون به، والصخرة التي يسقطون عليها»! وهم يسقطون لأنهم يرفضون أن يؤمنوا بالكلمة."]]}, {"l": "Gal 3:1", "n": "", "vs": [[1, "ياأهل غلاطية الأغبياء! من سحر عقولكم، أنتم الذين قد رسم أمام أعينكم يسوع المسيح وهو مصلوب؟"]]}, {"l": "Gal 5:7", "n": "", "vs": [[7, "كنتم تجرون جريا جيدا، فمن أعاقكم حتى لا تذعنوا للحق؟"]]}, {"l": "2Th 1:8", "n": "", "vs": [[8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."]]}, {"l": "Heb 5:9", "n": "", "vs": [[9, "وبذلك، أصبح مؤهلا لمهمته، فصار لجميع الذين يطيعونه مصدرا للخلاص الأبدي."]]}, {"l": "Heb 11:8", "n": "", "vs": [[8, "وبالإيمان، لبى إبراهيم دعوة الله، فترك وطنه وانطلق إلى أرض أخرى وعده الله بأن يورثه إياها. ولما خرج من بيته، كان لا يعرف أين يتوجه."]]}], "kwAr": "لا يؤمنون بإنجيل الله", "noteAr": ""}], "arS": [["حقا إن ", []], ["الوقت", ["G2540"]], [" قد حان ", []], ["ليبتديء", ["G756"]], [" ", []], ["القضاء", ["G2917"]], [" ", []], ["بأهل بيت", ["G3624"]], [" ", []], ["الله", ["G2316"]], [". فإن كان القضاء يبدأ بنا ", []], ["أولا", ["G4412"]], ["، فما هو ", []], ["مصير", ["G5056"]], [" الذين ", []], ["لا يؤمنون", ["G544"]], [" ", []], ["بإنجيل", ["G2098"]], [" ", []], ["الله", ["G2316"]], ["؟", []]]}, {"c": 4, "v": 18, "text": "وإن كان البار يخلص بجهد، فماذا يحدث للشرير والخاطيء؟", "groups": [{"kw": "if", "raw": "1Pe_5:8; Pro_11:31; Jer_25:29; Eze_18:24; Zec_13:9; Mat_24:22-24; Mar_13:20-22; Luk_23:31; Act_14:22, Act_27:24, Act_27:31, Act_27:42-44; 1Co_10:12; Heb_4:1, Heb_10:38, Heb_10:39", "note": "", "refs": [{"l": "1Pe 5:8", "n": "", "vs": [[8, "تعقلوا وتنبهوا. إن خصمكم إبليس كأسد يزأر، يجول باحثا عن فريسة يبتلعها."]]}, {"l": "Pro 11:31", "n": "", "vs": [[31, "إن كان الصديق يجازى على الأرض، فكم بالحري يكون جزاء الشرير والخاطيء."]]}, {"l": "Jer 25:29", "n": "", "vs": [[29, "لأني شرعت أعاقب المدينة التي دعي اسمي عليها، فهل تفلتون أنتم من العقاب؟ فها أنا قد سلطت السيف على جميع سكان الأرض، يقول الرب القدير."]]}, {"l": "Eze 18:24", "n": "", "vs": [[24, "وإذا تحول الصديق عن بره وارتكب إثما على غرار كل الرجاسات التي يرتكبها الشرير، أفيحيا؟ إن كل ما صنعه من بر لا يذكر له. إنما يموت بخيانته التي خانها، وما اقترفه من خطايا."]]}, {"l": "Zec 13:9", "n": "", "vs": [[9, "فأجيز هذا الثلث في النار لأنقيه تنقية الفضة، وأمحصه كما يمحص الذهب. هو يدعو باسمي وأنا أستجيبه. أنا أقول: هو شعبي، وهو يقول: الرب هو إلهي»."]]}, {"l": "Mat 24:22-24", "n": "", "vs": [[22, "ولولا أن تلك الأيام ستختصر، لما كان أحد من البشر ينجو. ولكن من أجل المختارين ستختصر تلك الأيام."], [23, "فإن قال لكم أحد عندئذ: ها إن المسيح هنا، أو هناك، فلا تصدقوا!"], [24, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات عظيمة وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Mar 13:20-22", "n": "", "vs": [[20, "ولولا أن الرب قد اختصر تلك الأيام، لما كان أحد من البشر ينجو. ولكنه لأجل المختارين الذين اختارهم، قد اختصر تلك الأيام."], [21, "فإن قال لكم أحد عندئذ: ها إن المسيح هنا! أو: ها هو هناك! فلا تصدقوا."], [22, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Luk 23:31", "n": "", "vs": [[31, "فإن كانوا قد فعلوا هذا بالغصن الأخضر، فماذا يجري لليابس؟»"]]}, {"l": "Act 14:22", "n": "", "vs": [[22, "وفي هذه الأماكن كلها كانا يشددان عزيمة التلاميذ، ويحثانهم على الثبات في الإيمان، مؤكدين لهم أن دخول ملكوت الله يقتضي أن نقاسي صعوبات كثيرة."]]}, {"l": "Act 27:24", "n": "", "vs": [[24, "وقال لي: لا تخف يابولس! فلابد أن تمثل أمام القيصر. وقد وهبك الله حياة جميع المسافرين معك!"]]}, {"l": "Act 27:31", "n": "", "vs": [[31, "فقال بولس لقائد المئة والجنود: «إذا لم يبق هؤلاء البحارة في السفينة فلن تنجوا»."]]}, {"l": "Act 27:42-44", "n": "", "vs": [[42, "وارتأى الجنود أن يقتلوا السجناء حتى لا يسبح أحد منهم إلى الشاطيء ويهرب،"], [43, "ولكن قائد المئة كان يرغب في إنقاذ بولس، فمنع جنوده من تنفيذ رأيهم، وأمر القادرين على السباحة أن يسبحوا إلى الشاطيء قبل غيرهم،"], [44, "والباقين أن يحاولوا الوصول إليه على ألواح السفينة، أو على قطع من حطامها. وهكذا وصل الجميع إلى البر سالمين."]]}, {"l": "1Co 10:12", "n": "", "vs": [[12, "فمن توهم أنه صامد، فليحذر أن يسقط."]]}, {"l": "Heb 4:1", "n": "", "vs": [[1, "ومادام الوعد بالدخول إلى الراحة الإلهية قائما حتى الآن، فلنخف: فربما تبين أن بعضا منكم قد فشلوا في الدخول."]]}, {"l": "Heb 10:38", "n": "", "vs": [[38, "وأما من تبرر بالإيمان، فبالإيمان يحيا. ومن ارتد لا تسر به نفسي!"]]}, {"l": "Heb 10:39", "n": "", "vs": [[39, "ولكننا نحن لسنا من أهل الارتداد المؤدي إلى الهلاك، بل من أهل الإيمان المؤدي إلى خلاص نفوسنا!"]]}], "kwAr": "وإن كان البار يخلص بجهد", "noteAr": ""}, {"kw": "where", "raw": "Psa_1:4, Psa_1:5; Rom_1:18, Rom_5:6; 2Pe_2:5, 2Pe_2:6, 2Pe_3:7; Jud_1:15", "note": "", "refs": [{"l": "Psa 1:4", "n": "", "vs": [[4, "ليس كذلك حال الأشرار، بل إنهم مثل ذرات التبن التي تبددها الريح."]]}, {"l": "Psa 1:5", "n": "", "vs": [[5, "لذلك لا تقوم لهم قائمة في يوم القضاء، ولا يكون للخطاة مكان بين جماعة الأبرار،"]]}, {"l": "Rom 1:18", "n": "", "vs": [[18, "فإنه قد أعلن غضب الله من السماء على جميع ما يفعله الناس من عصيان وإثم فيحجبون الحق بالإثم."]]}, {"l": "Rom 5:6", "n": "", "vs": [[6, "فإنه ونحن بعد عاجزون، مات المسيح عن العصاة في الوقت المعين."]]}, {"l": "2Pe 2:5", "n": "", "vs": [[5, "كذلك لم يشفق على العالم القديم عندما أحدث الطوفان على عالم الفاجرين، إلا أنه حفظ نوحا المنادي ببر الله وعدله. وكان نوح واحدا من ثمانية أشخاص نجوا من الطوفان."]]}, {"l": "2Pe 2:6", "n": "", "vs": [[6, "وإذ حكم الله على مدينتي سدوم وعمورة بالخراب، حولهما إلى رماد، جاعلا منهما عبرة للذين يعيشون حياة فاجرة."]]}, {"l": "2Pe 3:7", "n": "", "vs": [[7, "أما السماوات والأرض الحالية، فستبقى مخزونة ومحفوظة للنار بتلك الكلمة عينها إلى يوم الدينونة وهلاك الفاجرين!"]]}, {"l": "Jud 1:15", "n": "", "vs": [[15, "ليدين جميع الناس، ويوبخ جميع الأشرار الذين لا يهابون الله ، بسبب جميع أعمالهم الشريرة التي ارتكبوها وجميع أقوالهم القاسية التي أهانوه بها والتي لا تصدر إلا عن الخاطئين الأشرار غير الأتقياء!»"]]}], "kwAr": "فماذا يحدث", "noteAr": ""}, {"kw": "the sinner", "raw": "Gen_13:13; 1Sa_15:18; Luk_15:1; Rom_5:8", "note": "", "refs": [{"l": "Gen 13:13", "n": "", "vs": [[13, "وكان أهل سدوم متورطين في الشر وخاطئين جدا لدى الرب."]]}, {"l": "1Sa 15:18", "n": "", "vs": [[18, "وكلفك بمحاربة عماليق والقضاء عليه قضاء مبرما؟"]]}, {"l": "Luk 15:1", "n": "", "vs": [[1, "وكان جميع جباة الضرائب والخاطئين يتقدمون إليه ليسمعوه."]]}, {"l": "Rom 5:8", "n": "", "vs": [[8, "ولكن الله أثبت لنا محبته، إذ ونحن مازلنا خاطئين مات المسيح عوضا عنا."]]}], "kwAr": "للشرير والخاطئ", "noteAr": ""}], "arS": [["وإن كان ", []], ["البار", ["G1342"]], [" ", []], ["يخلص", ["G4982"]], [" ", []], ["بجهد", ["G3433"]], ["، ", []], ["فماذا", ["G4226"]], [" يحدث ", []], ["للشرير", ["G765"]], [" ", []], ["والخاطيء", ["G268"]], ["؟", []]]}, {"c": 4, "v": 19, "text": "إذن، على الذين يتألمون وفقا لإرادة الله، أن يسلموا أنفسهم للخالق الأمين، ويواظبوا على عمل الصلاح!", "groups": [{"kw": "let", "raw": "1Pe_4:12-16, 1Pe_3:17; Act_21:11-14", "note": "", "refs": [{"l": "1Pe 4:12-16", "n": "", "vs": [[12, "أيها الأحباء، لا تستغربوا نار الاضطهاد المشتعلة عندكم لاختباركم وكأن أمرا غريبا قد أصابكم!"], [13, "وإنما افرحوا: لأنكم كما تشاركون المسيح في الآلام الآن، لابد أن تفرحوا بمشاركته في الابتهاج عند ظهور مجده."], [14, "فإذا لحقتكم الإهانة لأنكم تحملون اسم المسيح، فطوبى لكم! لأن روح المجد، أي روح الله، يستقر عليكم."], [15, "لا يكن بينكم من يتأ لم عقابا على شر ارتكبه: كالقتل أو السرقة، أو غيرهما من الجرائم، أو التدخل في شؤون الآخرين."], [16, "ولكن إن تألم أحدكم لأنه «مسيحي»، فعليه ألا يخجل، بل أن يمجد الله لأجل هذا الاسم!"]]}, {"l": "1Pe 3:17", "n": "", "vs": [[17, "فإن كان الله يريد لكم أن تتألموا، فمن الأفضل أن تتألموا وأنتم تفعلون الخير لا الشر."]]}, {"l": "Act 21:11-14", "n": "", "vs": [[11, "فأخذ حزام بولس، وقيد نفسه رابطا يديه ورجليه وقال: «يقول الروح القدس إن صاحب هذا الحزام سيقيده اليهود هكذا في أورشليم، ويسلمونه إلى أيدي الأجانب»."], [12, "فلما سمعنا هذا بدأنا جميعا، نحن مرافقي بولس والمؤمنين من أهل البلدة، نرجو من بولس ألا يذهب إلى أورشليم،"], [13, "ولكنه قال لنا: «ما لكم تبكون وتحطمون قلبي؟ إني مستعد ليس فقط لأن أقيد في أورشليم، بل أيضا لأن أموت من أجل اسم الرب يسوع!»"], [14, "ولما لم نتمكن من إقناعه سكتنا، وقلنا: «فلتكن مشيئة الرب!»"]]}], "kwAr": "الذين يتألمون", "noteAr": ""}, {"kw": "commit", "raw": "Psa_31:5, Psa_37:5; Luk_23:46; Act_7:59; 2Ti_1:12", "note": "", "refs": [{"l": "Psa 31:5", "n": "", "vs": [[5, "في يدك أستودع روحي. فديتني أيها الرب إله الحق."]]}, {"l": "Psa 37:5", "n": "", "vs": [[5, "سلم للرب طريقك وتوكل عليه فيتولى أمرك."]]}, {"l": "Luk 23:46", "n": "", "vs": [[46, "وقال يسوع صارخا بصوت عظيم: «ياأبي، في يديك أستودع روحي!» وإذ قال هذا، أسلم الروح."]]}, {"l": "Act 7:59", "n": "", "vs": [[59, "وبينما كانوا يرجمون استفانوس، كان يدعو: «أيها الرب يسوع، اقبل روحي!»"]]}, {"l": "2Ti 1:12", "n": "", "vs": [[12, "من أجل ذلك أيضا أقاسي الآن هذه الآلام، ولكني لست أخجل، لأنني أعرف من أنا مؤمن به، ولي تمام الثقة بأنه قادر أن يحفظ لي الأمانة التي أودعتها عنده سالمة إلى ذلك اليوم."]]}], "kwAr": "أن يسلموا أنفسهم", "noteAr": ""}, {"kw": "in", "raw": "1Pe_2:15; Est_4:16; Jer_26:11-15; Dan_3:16-18, Dan_6:10,Dan_6:11, Dan_6:22; Rom_2:7", "note": "", "refs": [{"l": "1Pe 2:15", "n": "", "vs": [[15, "فإن هذه هي إرادة الله: أن تفعلوا الخير دائما، فتفحموا جهالة الناس الأغبياء!"]]}, {"l": "Est 4:16", "n": "", "vs": [[16, "«امض اجمع كل اليهود المقيمين في شوشن، وصوموا من أجلي ولا تأكلوا ولا تشربوا ثلاثة أيام ليلا ونهارا، وسأصوم أنا ووصيفاتي أيضا مثلكم. ثم أدخل إلى الملك مخالفة العرف المتبع، فإذا هلكت، هلكت»."]]}, {"l": "Jer 26:11-15", "n": "", "vs": [[11, "ثم خاطب الكهنة والأنبياء رؤساء يهوذا وسائر الشعب: «هذا الرجل يستحق حكم الموت. لأنه تنبأ على هذه المدينة بالدمار كما سمعتم بآذانكم»."], [12, "فقال إرميا لجميع الرؤساء وكل الشعب: «الرب قد بعثني لأتنبأ على هذا الهيكل وعلى هذه المدينة بكل القضاء الذي سمعتموه."], [13, "فالآن قوموا طرقكم وأعمالكم، وأطيعوا صوت الرب إلهكم، فيمتنع عن الشر الذي قضى به عليكم."], [14, "أما أنا فإني في أيديكم. اصنعوا بي ما يحلو لكم."], [15, "ولكن تيقنوا أنكم إن قتلتموني فإنكم تجلبون دما بريئا على أنفسكم وعلى هذه المدينة وعلى أهلها، لأن الرب قد بعثني حقا لأعلن قضاءه في مسامعكم»."]]}, {"l": "Dan 3:16-18", "n": "", "vs": [[16, "فأجابه شدرخ وميشخ وعبدنغو: «لا داعي لأن نجيبك عن هذا الشأن"], [17, "لأن إلهنا الذي نعبده قادر أن ينجينا من أتون النار المتقدة، وأن ينقذنا من يدك أيها الملك."], [18, "وحتى إن لم ينقذنا، فاعلم يقينا أيها الملك أننا لا نعبد آلهتك، ولا نسجد لتمثال الذهب الذي نصبته»."]]}, {"l": "Dan 6:10", "n": "", "vs": [[10, "فلما بلغ دانيآل أمر توقيع الوثيقة مضى إلى بيته وصعد إلى عليته ذات الكوى المفتوحة باتجاه أورشليم، وجثا على ركبتيه ثلاث مرات في اليوم وصلى، وحمد إلهه كمألوف عادته من قبل."]]}, {"l": "Dan 6:11", "n": "", "vs": [[11, "فتجمع المتآمرون، ووجدوا دانيآل يبتهل ويتضرع إلى إلهه."]]}, {"l": "Dan 6:22", "n": "", "vs": [[22, "قد أرسل إلهي ملاكه فسد أفواه الأسود فلم تؤذني، لأني وجدت بريئا أمامه، ولم أرتكب سوءا أمامك أيضا أيها الملك»."]]}, {"l": "Rom 2:7", "n": "", "vs": [[7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"]]}], "kwAr": "عمل الصلاح", "noteAr": ""}, {"kw": "a faithful", "raw": "Psa_138:8, Psa_146:5, Psa_146:6; Isa_40:27, Isa_40:28, Isa_43:7, Isa_43:21, Isa_51:12, Isa_51:13, Isa_54:16, Isa_54:17; Col_1:16-20; Heb_1:2, Heb_1:3; Rev_4:10,Rev_4:11, Rev_5:9-14", "note": "", "refs": [{"l": "Psa 138:8", "n": "", "vs": [[8, "الرب ينجز مقاصده لي. رحمتك يارب إلى الأبد تدوم، فلا تتخل عني لأني صنع يديك."]]}, {"l": "Psa 146:5", "n": "", "vs": [[5, "طوبى لمن يكون إله يعقوب معينه، ورجاؤه في الرب إلهه،"]]}, {"l": "Psa 146:6", "n": "", "vs": [[6, "خالق السماوات والأرض والبحر وكل ما فيها، الأمين إلى الأبد."]]}, {"l": "Isa 40:27", "n": "", "vs": [[27, "فكيف تجرؤ ياإسرائيل أن تقول إن الرب لا يرى محنتي وطريقي خافية عليه؟"]]}, {"l": "Isa 40:28", "n": "", "vs": [[28, "ألم تعلموا؟ ألم تسمعوا؟ إن الرب هو إله سرمدي وخالق أقاصي الأرض. لا يهن ولا يخور، وفهمه لا يستقصى."]]}, {"l": "Isa 43:7", "n": "", "vs": [[7, "كل من يدعى باسمي ممن خلقته لمجدي وجبلته وصنعته»."]]}, {"l": "Isa 43:21", "n": "", "vs": [[21, "وجبلته لنفسي ليذيع حمدي."]]}, {"l": "Isa 51:12", "n": "", "vs": [[12, "أنا، أنا هو معزيكم، فمن أنت حتى تخشي إنسانا فانيا أو بشرا يبيدون كالعشب؟"]]}, {"l": "Isa 51:13", "n": "", "vs": [[13, "ونسيت الرب صانعك، باسط السماوات ومرسي قواعد الأرض فتظل في رعب دائم من غضب المضايق حين يوطد العزم على التدمير؟ أين هو غضب المضايق؟"]]}, {"l": "Isa 54:16", "n": "", "vs": [[16, "ها أنا قد خلقت الحداد الذي ينفخ الفحم في النار، ويخرج أداة يعمل بها، وأنا الذي خلقت المهلك المدمر."]]}, {"l": "Isa 54:17", "n": "", "vs": [[17, "لا يحالف التوفيق أي سلاح صنع لمهاجمتك، وكل لسان يتهمك أمام القضاء تفحمينه، لأن هذا هو ميراث عبيد الرب، وبرهم الذي أنعمت به عليهم»، يقول الرب."]]}, {"l": "Col 1:16-20", "n": "", "vs": [[16, "إذ به خلقت جميع الأشياء: ما في السماوات وما على الأرض، ما يرى وما لا يرى، أعروشا كانت أم سيادات أم رئاسات أم سلطات. كل ما في الكون قد خلق به ولأجله."], [17, "هو كائن قبل كل شيء، وبه يدوم كل شيء."], [18, "وهو رأس الجسد، أي الكنيسة؛ هو البداءة وبكر القائمين من بين الأموات، ليكون له المقام الأول في كل شيء."], [19, "فإنه فيه سر الله أن يحل بكل ملئه،"], [20, "وأن يصالح به كل شيء مع نفسه، إذ أحل السلام بدمه على الصليب، فبه يصالح كل شيء، سواء كان ما على الأرض أو ما في السماوات."]]}, {"l": "Heb 1:2", "n": "", "vs": [[2, "أما الآن، في هذا الزمن الأخير، فقد كلمنا بالابن، الذي جعله وارثا لكل شيء، وبه قد خلق الكون كله!"]]}, {"l": "Heb 1:3", "n": "", "vs": [[3, "إنه ضياء مجد الله وصورة جوهره. حافظ كل ما في الكون بكلمته القديرة. وهو الذي بعدما طهرنا بنفسه من خطايانا،"]]}, {"l": "Rev 4:10", "n": "", "vs": [[10, "يجثو الشيوخ الأربعة والعشرون أمام الجالس على العرش ساجدين للحي إلى أبد الآبدين، ويلقون أكاليلهم أمام عرشه وهم يهتفون:"]]}, {"l": "Rev 4:11", "n": "", "vs": [[11, "«مستحق أنت ياربنا وإلهنا المجد والإجلال والقدرة، لأنك خلقت الأشياء كلها، وهي بإرادتك كائنة وقد خلقت!»"]]}, {"l": "Rev 5:9-14", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"], [10, "وجعلتهم مملكة لإلهنا وكهنة له، وسيملكون على الأرض»."], [11, "ثم نظرت، فسمعت ترتيل الملايين من الملائكة وهي تحيط بالعرش وبالكائنات الحية والشيوخ،"], [12, "وهم يهتفون بصوت عال: «مستحق هو الحمل المذبوح أن ينال القدرة والغنى والحكمة والقوة والإجلال والمجد والبركة»."], [13, "ثم سمعت كل خليقة في السماء وعلى الأرض، وتحت الأرض، وعلى البحر، هاتفة مع كل ما فيها: «البركة والإجلال والمجد والسلطة للجالس على العرش وللحمل، إلى أبد الآبدين»."], [14, "فردت الكائنات الحية الأربعة: «آمين!» وجثا الشيوخ ساجدين."]]}], "kwAr": "للخالق الأمين", "noteAr": ""}], "arS": [["إذن", ["G5620"]], ["، على الذين ", []], ["يتألمون", ["G3958"]], [" وفقا ", []], ["لإرادة", ["G2307"]], [" ", []], ["الله", ["G2316"]], ["، أن ", []], ["يسلموا", ["G3908"]], [" ", []], ["أنفسهم", ["G5590"]], [" ", []], ["للخالق", ["G2939"]], [" ", []], ["الأمين", ["G4103"]], ["، ويواظبوا على عمل ", []], ["الصلاح", ["G16"]], ["!", []]]}, {"c": 5, "v": 1, "text": "وهذه وصيتي إلى الشيوخ الذين بينكم، بصفتي شيخا رفيقا لهم، وشاهدا لآلام المسيح، وشريكا في المجد الذي سيتجلى:", "groups": [{"kw": "elders", "raw": "Act_11:30, Act_14:23, Act_15:4, Act_15:6, Act_15:22, Act_15:23, Act_20:17, Act_20:28 *Gr: Act_21:18; 1Ti_5:1, 1Ti_5:19; Tit_1:5", "note": "", "refs": [{"l": "Act 11:30", "n": "", "vs": [[30, "ففعلوا ذلك، وأرسلوا الإعانة إلى الشيوخ بيد برنابا وشاول."]]}, {"l": "Act 14:23", "n": "", "vs": [[23, "وعينا للتلاميذ شيوخا في كل كنيسة. ثم صليا بأصوام وأسلما الجميع وديعة بين يدي الرب الذي آمنوا به."]]}, {"l": "Act 15:4", "n": "", "vs": [[4, "ولما وصلوا إلى أورشليم، رحبت بهم الكنيسة بمن فيها من رسل وشيوخ، فأخبروهم بكل ما فعل الله بواسطتهم."]]}, {"l": "Act 15:6", "n": "", "vs": [[6, "فعقد الرسل والشيوخ اجتماعا لدراسة هذه القضية."]]}, {"l": "Act 15:22", "n": "", "vs": [[22, "عند ذلك أجمع الرسل والشيوخ والجماعة كلها على اختيار رجلين من الإخوة يرسلونهما إلى أنطاكية مع بولس وبرنابا. فاختاروا يهوذا، الملقب برسابا، وسيلا، وكان لهما مكانة رفيعة بين الإخوة."]]}, {"l": "Act 15:23", "n": "", "vs": [[23, "وسلموهم هذه الرسالة:"]]}, {"l": "Act 20:17", "n": "", "vs": [[17, "ومن ميليتس أرسل بولس إلى أفسس يستدعي شيوخ الكنيسة."]]}, {"l": "Act 20:28", "n": "*Gr:", "vs": [[28, "فاسهروا إذن على أنفسكم وعلى جميع القطيع الذي عينكم بينه الروح القدس نظارا، لترعوا كنيسة الله التي اشتراها بدمه."]]}, {"l": "Act 21:18", "n": "", "vs": [[18, "وفي اليوم التالي لوصولنا رافقنا بولس للاجتماع بيعقوب، وكان الشيوخ كلهم مجتمعين عنده."]]}, {"l": "1Ti 5:1", "n": "", "vs": [[1, "لا توبخ شيخا توبيخا قاسيا، بل عظه كأنه أب لك. وعامل الشبان كأنهم إخوة لك؛"]]}, {"l": "1Ti 5:19", "n": "", "vs": [[19, "ولا تقبل تهمة موجهة إلى أحد الشيوخ، إلا إذا أيدها شاهدان أو ثلاثة."]]}, {"l": "Tit 1:5", "n": "", "vs": [[5, "تركتك في جزيرة كريت لكي تكمل ترتيب الأمور الباقية، وتقيم شيوخا في كل مدينة، مثلما أمرتك؛"]]}], "kwAr": "الشيوخ", "noteAr": ""}, {"kw": "who", "raw": "Phm_1:9; 2Jo_1:1; 3Jo_1:1", "note": "", "refs": [{"l": "Phm 1:9", "n": "", "vs": [[9, "إلا أني، إكراما للمحبة، اخترت أن أقدم إليك التماسا، بصفتي بولس العجوز والسجين حاليا لأجل المسيح يسوع."]]}, {"l": "2Jo 1:1", "n": "", "vs": [[1, "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."]]}, {"l": "3Jo 1:1", "n": "", "vs": [[1, "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."]]}], "kwAr": "بصفتي شيخا", "noteAr": ""}, {"kw": "also", "raw": "Συμπρεσβυτερος [Strongs G4850], a fellow-elder, one on a level with yourselves.", "note": "Συμπρεσβυτερος [Strongs G4850], a fellow-elder, one on a level with yourselves.", "refs": [], "kwAr": "رفيقا لهم", "noteAr": "Συμπρεσβυτερος [Strongs G4850]: شيخ رفيق، أي على قدم المساواة معكم."}, {"kw": "and a", "raw": "1Pe_1:12; Luk_24:48; Joh_15:26, Joh_15:27; Act_1:8, Act_1:22, Act_2:32, Act_3:15, Act_5:30-32; Act_10:39-41", "note": "", "refs": [{"l": "1Pe 1:12", "n": "", "vs": [[12, "ولكن الله أوحى إليهم أن اجتهادهم لم يكن لمصلحتهم هم، بل لمصلحتكم أنتم. فقد كان ذلك من أجل البشارة التي نقلها إليكم في الزمان الحاضر مبشرون يؤيدهم الروح القدس المرسل من السماء. ويالها من أمور يتمنى حتى الملائكة أن يطلعوا عليها!"]]}, {"l": "Luk 24:48", "n": "", "vs": [[48, "وأنتم شهود على هذه الأمور."]]}, {"l": "Joh 15:26", "n": "", "vs": [[26, "وعندما يأتي المعين، الذي سأرسله لكم من عند الآب، روح الحق الذي ينبثق من الآب، فهو يشهد لي،"]]}, {"l": "Joh 15:27", "n": "", "vs": [[27, "وتشهدون لي أنتم أيضا، لأنكم معي من البداية."]]}, {"l": "Act 1:8", "n": "", "vs": [[8, "ولكن حينما يحل الروح القدس عليكم تنالون القوة، وتكونون لي شهودا في أورشليم واليهودية كلها، وفي السامرة، وإلى أقاصي الأرض»."]]}, {"l": "Act 1:22", "n": "", "vs": [[22, "منذ أن عمده يوحنا إلى يوم ارتفاعه عنا إلى السماء، ليكون معنا شاهدا بقيامة يسوع»."]]}, {"l": "Act 2:32", "n": "", "vs": [[32, "فيسوع هذا أقامه الله من الموت، ونحن جميعا شهود لذلك."]]}, {"l": "Act 3:15", "n": "", "vs": [[15, "وقتلتم واهب الحياة. ولكن الله أقامه من بين الأموات ونحن شهود لذلك."]]}, {"l": "Act 5:30-32", "n": "", "vs": [[30, "إن إله آبائنا أقام يسوع، الذي قتلتموه أنتم معلقين إياه على الخشبة!"], [31, "ولكن الله رفعه إلى يمينه وجعله رئيسا ومخلصا ليمنح إسرائيل التوبة وغفران الخطايا؛"], [32, "ونحن نشهد على هذا، وكذلك يشهد الروح القدس الذي وهبه الله للذين يطيعونه»."]]}, {"l": "Act 10:39-41", "n": "", "vs": [[39, "ونحن شهود على كل ما قام به في بلاد اليهود وفي أورشليم، وقد قتلوه حقا، معلقا على خشبة."], [40, "ولكن الله أقامه من الموت في اليوم الثالث، وجعله يظهر،"], [41, "لا للشعب كله، بل للشهود الذين اختارهم الله من قبل، لنا نحن الذين أكلنا وشربنا معه بعد قيامته من بين الأموات."]]}], "kwAr": "وشاهدا لآلام المسيح", "noteAr": ""}, {"kw": "a partaker", "raw": "1Pe_5:4, 1Pe_1:3-5; Psa_73:24, Psa_73:25; Rom_8:17, Rom_8:18; 2Co_5:1, 2Co_5:8; Phi_1:19, Phi_1:21-23; Col_3:3, Col_3:4; 2Ti_4:8; 1Jo_3:2; Rev_1:9", "note": "", "refs": [{"l": "1Pe 5:4", "n": "", "vs": [[4, "وعندما يظهر رئيس الرعاة، تنالون إكليل المجد الذي لا يفنى."]]}, {"l": "1Pe 1:3-5", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"], [4, "وإرثا لا يفنى ولا يفسد ولا يزول،"], [5, "محفوظا لكم في السماوات. فإنكم محفوظون بقدرة الله العاملة من خلال إيمانكم، إلى أن تفوزوا بالخلاص النهائي المعد لكم والذي سوف يتجلى في الزمان الأخير."]]}, {"l": "Psa 73:24", "n": "", "vs": [[24, "تهديني بمشورتك، وبعد ذلك تأخذني إلى المجد."]]}, {"l": "Psa 73:25", "n": "", "vs": [[25, "من لي في السماء غيرك؟ ولست أبغي في الأرض أحدا معك."]]}, {"l": "Rom 8:17", "n": "", "vs": [[17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}, {"l": "Rom 8:18", "n": "", "vs": [[18, "فإني مقتنع بأن آلام الزمان الحاضر ليست شيئا إذا قيست بالمجد الآتي الذي سيعلن فينا."]]}, {"l": "2Co 5:1", "n": "", "vs": [[1, "فإننا نعلم أنه متى تهدمت خيمتنا الأرضية التي نسكنها الآن، يكون لنا بناء من الله: بيت لم تصنعه أيدي البشر، أبدي في السماوات."]]}, {"l": "2Co 5:8", "n": "", "vs": [[8, "فنحن واثقون إذن، وراضون بالأحرى أن نكون مغتربين عن الجسد ومقيمين عند الرب."]]}, {"l": "Phi 1:19", "n": "", "vs": [[19, "فإنني أعلم أن هذا الأمر سيؤدي إلى الإفراج عني، بفضل صلاتكم وبمعونة روح يسوع المسيح؛"]]}, {"l": "Phi 1:21-23", "n": "", "vs": [[21, "فالحياة عندي هي المسيح، والموت ربح لي."], [22, "ولكن، إن كان لي أن أحيا في الجسد، فحياتي تهييء لي عملا مثمرا. ولست أدري أي الاثنين أختار!"], [23, "فأنا تحت ضغط من كليهما: إذ إني راغب في أن أرحل وأقيم مع المسيح، وهذا أفضل بكثير جدا؛"]]}, {"l": "Col 3:3", "n": "", "vs": [[3, "فإنكم قد متم، وحياتكم مستورة مع المسيح في الله."]]}, {"l": "Col 3:4", "n": "", "vs": [[4, "فعندما يظهر المسيح، وهو حياتنا، عندئذ تظهرون أنتم أيضا معه في المجد."]]}, {"l": "2Ti 4:8", "n": "", "vs": [[8, "إنما ينتظرني الآن إكليل البر المحفوظ لي، والذي سيهبه لي الرب الديان العادل في ذلك اليوم؛ ولن يوهب لي وحدي، بل أيضا لجميع الذين يحبون ظهوره."]]}, {"l": "1Jo 3:2", "n": "", "vs": [[2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"]]}, {"l": "Rev 1:9", "n": "", "vs": [[9, "أنا، يوحنا أخاكم وشريككم في الضيقة والملكوت والصبر في يسوع، كنت منفيا في الجزيرة التي تسمى بطمس، لأجل كلمة الله وشهادة يسوع."]]}], "kwAr": "وشريكا في المجد", "noteAr": ""}], "arS": [["وهذه ", []], ["وصيتي", ["G3870"]], [" إلى ", []], ["الشيوخ", ["G4245"]], [" الذين بينكم، بصفتي ", []], ["شيخا رفيقا", ["G4850"]], [" لهم، ", []], ["وشاهدا", ["G3144"]], [" ", []], ["لآلام", ["G3804"]], [" ", []], ["المسيح", ["G5547"]], ["، ", []], ["وشريكا", ["G2844"]], [" في ", []], ["المجد", ["G1391"]], [" الذي ", []], ["سيتجلى", ["G601"]], [":", []]]}, {"c": 5, "v": 2, "text": "ارعوا قطيع الله الذي بينكم، كحراس له، لا بدافع الواجب، بل بدافع التطوع، كما يريد الله ، ولا رغبة في الربح الدنيء، بل رغبة في الخدمة بنشاط.", "groups": [{"kw": "Feed", "raw": "Son_1:8; Isa_40:11; Eze_34:2, Eze_34:3, Eze_34:23; Mic_5:4, Mic_7:14; Joh_21:15-17; Act_20:28", "note": "", "refs": [{"l": "Son 1:8", "n": "", "vs": [[8, "(المحب): إن كنت لا تعلمين ياأجمل النساء، فاقتفي أثر الغنم، وارعي جداءك عند مساكن الرعاة."]]}, {"l": "Isa 40:11", "n": "", "vs": [[11, "يرعى قطيعه كراع، ويجمع الحملان بذراعه، وفي أحضانه يحملها ويقود المرضعات برفق."]]}, {"l": "Eze 34:2", "n": "", "vs": [[2, "«ياابن آدم، تنبأ على رعاة إسرائيل وقل لهم: هذا ما يعلنه لهم السيد الرب: ويل لرعاة إسرائيل الذين كانوا منهمكين في رعاية أنفسهم. أليس من شأن الرعاة رعاية الغنم؟"]]}, {"l": "Eze 34:3", "n": "", "vs": [[3, "إنما أنتم تأكلون الشحم، وترتدون الصوف، وتذبحون الخروف السمين، ولا ترعون الغنم."]]}, {"l": "Eze 34:23", "n": "", "vs": [[23, "وأنصب عليها راعيا واحدا عبدي داود (أي المسيح) يرعاها بنفسه ويكون لها راعيا أمينا."]]}, {"l": "Mic 5:4", "n": "", "vs": [[4, "فيقوم ويرعى شعبه بقوة الرب وبجلال اسم الرب إلهه، فيعيشون بأمن، لأن عظمته تمتد إلى أقاصي الأرض."]]}, {"l": "Mic 7:14", "n": "", "vs": [[14, "ارع يارب شعبك بعصاك، فهم قطيع ميراثك الرابضون وحدهم في الغابة في وسط الكرمل. قدهم إلى باشان وجلعاد ليتمتعوا بخصب أرضهما كالعهد بهم في أيام القدم."]]}, {"l": "Joh 21:15-17", "n": "", "vs": [[15, "وبعدما أكلوا سأل يسوع سمعان بطرس: «ياسمعان بن يونا، أتحبني أكثر مما يحبني هؤلاء؟» فأجابه «نعم يارب، أنت تعلم أني أحبك!» فقال له: «أطعم حملاني!»"], [16, "ثم سأله ثانية: «ياسمعان بن يونا، أتحبني؟» فأجابه: «نعم يارب. أنت تعلم أني أحبك!» قال له: «ارع خرافي»"], [17, "فسأله مرة ثالثة: «ياسمعان بن يونا، أتحبني؟» فحزن بطرس لأن يسوع قال له في المرة الثالثة: «أتحبني». وقال له: «يارب، أنت تعلم كل شيء. أنت تعلم أني أحبك!» فقال له يسوع: «أطعم خرافي!"]]}, {"l": "Act 20:28", "n": "", "vs": [[28, "فاسهروا إذن على أنفسكم وعلى جميع القطيع الذي عينكم بينه الروح القدس نظارا، لترعوا كنيسة الله التي اشتراها بدمه."]]}], "kwAr": "ارعوا", "noteAr": ""}, {"kw": "the flock", "raw": "Isa_63:11; Jer_13:17, Jer_13:20; Eze_34:31; Zec_11:17; Luk_12:32; 1Co_9:7", "note": "", "refs": [{"l": "Isa 63:11", "n": "", "vs": [[11, "ثم "vs": [[8, "وسمعت صوت الرب يقول: «من أرسل، ومن يذهب من أجلنا؟» عندئذ قلت: «ها أنا أرسلني»."]]}, {"l": "1Co 9:16", "n": "", "vs": [[16, "فمادمت أبشر بالإنجيل، فليس في ذلك فخر لي، لأنه واجب مفروض علي فالويل لي إن كنت لا أبشر!"]]}, {"l": "1Co 9:17", "n": "", "vs": [[17, "فإن قمت بذلك متطوعا، كانت لي مكافأة. ولكن، إن كنت مرغما، فأنا مؤتمن على مسئولية،"]]}], "kwAr": "لا بدافع الواجب", "noteAr": ""}, {"kw": "not for", "raw": "Isa_56:11; Jer_6:13, Jer_8:10; Mic_3:11; Mal_1:10; Act_20:33, Act_20:34; 2Co_12:14, 2Co_12:15; 1Ti_3:3, 1Ti_3:8; Tit_1:7, Tit_1:11; 2Pe_2:3; Rev_18:12, Rev_18:13", "note": "", "refs": [{"l": "Isa 56:11", "n": "", "vs": [[11, "هم كلاب نهمة لا تعرف الشبع، ورعاة أيضا مجردون من الفهم، كل مال إلى طريقه طمعا في الربح،"]]}, {"l": "Jer 6:13", "n": "", "vs": [[13, "لأنهم جميعا، صغارهم وكبارهم، مولعون بالربح الحرام. حتى النبي والكاهن يرتكبان الزور في أعمالهما."]]}, {"l": "Jer 8:10", "n": "", "vs": [[10, "لذلك أعطي نساءهم لآخرين وحقولهم للوارثين القاهرين، لأنهم جميعا من صغيرهم إلى كبيرهم مولعون بالربح. حتى النبي والكاهن يرتكبان الزور في أعمالهما،"]]}, {"l": "Mic 3:11", "n": "", "vs": [[11, "إذ يحكم رؤساؤها بالرشوة، وكهنتها يعلمون بالأجرة ويتعاطى أنبياؤها العرافة لقاء المال، ومع ذلك يدعون الاتكال على الله قائلين: «أليس الرب في وسطنا؟ لذلك لن يصيبنا مكروه»."]]}, {"l": "Mal 1:10", "n": "", "vs": [[10, "آه، ياليت بينكم من يغلق أبواب الهيكل لئلا توقدوا نارا باطلة على مذبحي، يقول الرب القدير: إذ لا مسرة لي بكم ولا أرضى بتقدمة من أيديكم."]]}, {"l": "Act 20:33", "n": "", "vs": [[33, "ما اشتهيت يوما فضة ولا ذهبا ولا ثوبا من عند أحد."]]}, {"l": "Act 20:34", "n": "", "vs": [[34, "وأنتم تعلمون أني اشتغلت بيدي هاتين لأسد حاجاتي وحاجات مرافقي."]]}, {"l": "2Co 12:14", "n": "", "vs": [[14, "أنا مستعد الآن أن آتي إليكم مرة ثالثة، ولن أكون عبئا ثقيلا عليكم. فما أسعى إليه ليس هو ما عندكم بل هو أنتم: لأنه ليس على الأولاد أن يوفروا لوالديهم، بل على الوالدين أن يوفروا لأولادهم."]]}, {"l": "2Co 12:15", "n": "", "vs": [[15, "وأنا، بكل سرور، أنفق ما عندي، بل أنفق نفسي لأجل أنفسكم، وإن كنت كلما زادت محبتي ألقى حبا أقل."]]}, {"l": "1Ti 3:3", "n": "", "vs": [[3, "لا مدمنا للخمر ولا عنيفا؛ بل لطيفا، غير متعود الخصام، غير مولع بالمال،"]]}, {"l": "1Ti 3:8", "n": "", "vs": [[8, "أما المدبرون، فيجب أن يكونوا أيضا ذوي رصانة، لا ذوي لسانين، ولا مدمنين للخمر، لا ساعين إلى المكسب الخسيس."]]}, {"l": "Tit 1:7", "n": "", "vs": [[7, "وذلك لأن الناظر يجب أن يكون بريئا من كل تهمة باعتباره وكيلا لله، لا معجبا بنفسه ولا حاد الطبع، ولا مدمن الخمر، ولا عنيفا، ولا ساعيا إلى المكسب الخسيس؛"]]}, {"l": "Tit 1:11", "n": "", "vs": [[11, "هؤلاء يجب أن تسد أفواههم: فهم يخربون بيوتا بجملتها، إذ يعلمون تعاليم يجب ألا تعلم، في سبيل مكسب خسيس."]]}, {"l": "2Pe 2:3", "n": "", "vs": [[3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "Rev 18:12", "n": "", "vs": [[12, "فقد كانت هي تشتري منهم الذهب والفضة والحجارة الكريمة واللؤلؤ، والكتان والأرجوان والحرير والقرمز، وجميع الأخشاب العطرة وأدوات العاج والمصنوعات الخشبية الثمينة، والنحاس والحديد والرخام،"]]}, {"l": "Rev 18:13", "n": "", "vs": [[13, "والقرفة والبهار، والعطور والطيب والبخور، والخمر والزيت والدقيق والحبوب، والبهائم والغنم، والخيل والمركبات، والأجساد والنفوس البشرية"]]}], "kwAr": "ولا رغبة في الربح الدنيء", "noteAr": ""}, {"kw": "of", "raw": "Act_21:13; Rom_1:15; Tit_2:14, Tit_3:1", "note": "", "refs": [{"l": "Act 21:13", "n": "", "vs": [[13, "ولكنه قال لنا: «ما لكم تبكون وتحطمون قلبي؟ إني مستعد ليس فقط لأن أقيد في أورشليم، بل أيضا لأن أموت من أجل اسم الرب يسوع!»"]]}, {"l": "Rom 1:15", "n": "", "vs": [[15, "ولذلك، فبكل ما لدي، أنا في غاية الشوق أن أبشر بالإنجيل أيضا بينكم أنتم الذين في روما."]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Tit 3:1", "n": "", "vs": [[1, "ذكر المؤمنين أن يخضعوا للحكام والسلطات، ويطيعوا القانون، ويكونوا مستعدين لكل عمل صالح،"]]}], "kwAr": "بنشاط", "noteAr": ""}], "arS": [["ارعوا", ["G4165"]], [" ", []], ["قطيع", ["G4168"]], [" ", []], ["الله", ["G2316"]], [" الذي بينكم، ", []], ["كحراس", ["G1983"]], [" له، لا ", []], ["بدافع الواجب", ["G317"]], ["، بل ", []], ["بدافع التطوع", ["G1596"]], ["، كما يريد الله ، ولا رغبة في ", []], ["الربح الدنيء", ["G147"]], ["، بل رغبة في الخدمة ", []], ["بنشاط", ["G4290"]], [".", []]]}, {"c": 5, "v": 3, "text": "لا تتسلطوا على القطيع الذي وضعه الله أمانة بين أيديكم، بل كونوا قدوة له.", "groups": [{"kw": "as", "raw": "Eze_34:4; Mat_20:25, Mat_20:26, Mat_23:8-10; Mar_10:42-45; Luk_22:24-27; 1Co_3:5, 1Co_3:9; 2Co_1:24, 2Co_4:5; 3Jo_1:9, 3Jo_1:10", "note": "", "refs": [{"l": "Eze 34:4", "n": "", "vs": [[4, "فالمريض لم تقووه، والمجروح لم تعصبوه، والمكسور لم تجبروه، والمطرود لم تسترجعوه، والضال لم تبحثوا عنه، بل تسلطتم عليهم بقسوة وعنف."]]}, {"l": "Mat 20:25", "n": "", "vs": [[25, "فاستدعاهم يسوع جميعا وقال: «تعلمون أن حكام الأمم يسودونهم، وعظماءهم يتسلطون عليهم."]]}, {"l": "Mat 20:26", "n": "", "vs": [[26, "وأما أنتم، فلا يكن ذلك بينكم، وإنما أي من أراد أن يصير عظيما بينكم، فليكن لكم خادما،"]]}, {"l": "Mat 23:8-10", "n": "", "vs": [[8, "أما أنتم، فلا تقبلوا أن يدعوكم أحد: يامعلم! لأن معلمكم واحد، وأنتم جميعا إخوة."], [9, "ولا تدعوا أحدا على الأرض أبا لكم: لأن أباكم واحد، وهو الآب الذي في السماوات."], [10, "ولا تقبلوا أن يدعوكم أحد رؤساء، لأن رئيسكم واحد، وهو المسيح."]]}, {"l": "Mar 10:42-45", "n": "", "vs": [[42, "ولكن يسوع دعاهم إليه وقال لهم: «تعرفون أن المعتبرين حكاما على الأمم يسودونهم، وأن عظماءهم يتسلطون عليهم."], [43, "وأما أنتم فلا يكن ذلك بينكم، وإنما أي من أراد أن يصير عظيما بينكم، فليكن لكم خادما،"], [44, "وأي من أراد أن يصير أولا فيكم، فليكن للجميع عبدا."], [45, "فحتى ابن الإنسان قد جاء لا ليخدم، بل ليخدم ويبذل نفسه فدية عن كثيرين»."]]}, {"l": "Luk 22:24-27", "n": "", "vs": [[24, "وقام بينهم أيضا جدال في أيهم يحسب الأعظم."], [25, "فقال لهم: «إن ملوك الأمم يسودونهم، وأصحاب السلطة عندهم يدعون محسنين."], [26, "وأما أنتم، فلا يكن ذلك بينكم، بل ليكن الأعظم بينكم كالأصغر، والقائد كالخادم."], [27, "فمن هو أعظم: الذي يتكيء أم الذي يخدم؟ أليس الذي يتكيء؟ ولكني أنا في وسطكم كالذي يخدم."]]}, {"l": "1Co 3:5", "n": "", "vs": [[5, "فمن هو بولس؟ ومن هو أبلوس؟ إنهما فقط خادمان آمنتم على أيديهما، وكما أنعم الرب على كل منهما."]]}, {"l": "1Co 3:9", "n": "", "vs": [[9, "فإننا نحن جميعا عاملون معا عند الله، وأنتم حقل الله وبناء الله."]]}, {"l": "2Co 1:24", "n": "", "vs": [[24, "وهذا لا يعني أننا نتسلط على إيمانكم، بل إننا معاونون لكم نعمل لأجل فرحكم. فبالإيمان أنتم ثابتون."]]}, {"l": "2Co 4:5", "n": "", "vs": [[5, "فإننا لا نبشر بأنفسنا، بل بالمسيح يسوع ربا، وما نحن إلا عبيد لكم من أجل يسوع."]]}, {"l": "3Jo 1:9", "n": "", "vs": [[9, "كتبت كلمة إلى الكنيسة بشأن هذا الأمر. ولكن ديوتريفوس، الذي يحب أن يفرض نفسه عليهم قائدا لا يقبلنا."]]}, {"l": "3Jo 1:10", "n": "", "vs": [[10, "لهذا، سألفت الانتباه إلى الأعمال التي يقوم بها، حين أجيء. إنه يثير ضدنا تهما كاذبة، متكلما بأسلوب خبيث. وهو لا يكتفي بهذا، بل يرفض استقبال الإخوة المسافرين، ويمنع الذين يريدون استقبالهم، ويطردهم من الكنيسة أيضا."]]}], "kwAr": "لا تتسلطوا على القطيع", "noteAr": ""}, {"kw": "being lords over", "raw": "or, over-ruling", "note": "or, over-ruling", "refs": [], "kwAr": "تتسلطوا", "noteAr": "أو: متسلطين."}, {"kw": "heritage", "raw": "1Pe_2:9; Deu_32:9; Psa_33:12, Psa_74:2; Mic_7:14; Act_20:28", "note": "", "refs": [{"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}, {"l": "Deu 32:9", "n": "", "vs": [[9, "لأن نصيب الرب هو شعبه، وأبناء يعقوب قرعة ميراثه."]]}, {"l": "Psa 33:12", "n": "", "vs": [[12, "طوبى للأمة التي الرب إلهها، وللشعب الذي اختاره ميراثا له:"]]}, {"l": "Psa 74:2", "n": "", "vs": [[2, "اذكر جماعتك التي اقتنيتها منذ القدم، والتي افتديتها لتجعلها سبط ميراثك. اذكر جبل صهيون الذي أقمت فيه."]]}, {"l": "Mic 7:14", "n": "", "vs": [[14, "ارع يارب شعبك بعصاك، فهم قطيع ميراثك الرابضون وحدهم في الغابة في وسط الكرمل. قدهم إلى باشان وجلعاد ليتمتعوا بخصب أرضهما كالعهد بهم في أيام القدم."]]}, {"l": "Act 20:28", "n": "", "vs": [[28, "فاسهروا إذن على أنفسكم وعلى جميع القطيع الذي عينكم بينه الروح القدس نظارا، لترعوا كنيسة الله التي اشتراها بدمه."]]}], "kwAr": "القطيع الذي وضعه الله أمانة", "noteAr": ""}, {"kw": "but", "raw": "1Co_11:11; Phi_3:17, Phi_4:9; 1Th_1:5, 1Th_1:6; 2Th_3:9; 1Ti_4:12; Tit_2:7", "note": "", "refs": [{"l": "1Co 11:11", "n": "", "vs": [[11, "غير أنه في الرب ليست المرأة من دون الرجل، ولا الرجل من دون المرأة."]]}, {"l": "Phi 3:17", "n": "", "vs": [[17, "كونوا جميعا، أيها الإخوة، مقتدين بي؛ ولاحظوا الذين يسلكون بحسب القدوة التي ترونها فينا."]]}, {"l": "Phi 4:9", "n": "", "vs": [[9, "واعملوا بها ما تعلمتم وتلقيتم وسمعتم مني وما رأيتم في. وإله السلام يكون معكم."]]}, {"l": "1Th 1:5", "n": "", "vs": [[5, "لأن تبشيرنا لكم بالإنجيل لم يكن مجرد كلام، بل كان مصحوبا أيضا بالقوة وبالروح القدس وبتمام اليقين. كما أنكم تعلمون تماما ماذا كنا بينكم لأجل مصلحتكم،"]]}, {"l": "1Th 1:6", "n": "", "vs": [[6, "وقد صرتم مقتدين بنا وبالرب، إذ تقبلتم كلمة الله في وسط ضيقة شديدة بفرح الروح القدس."]]}, {"l": "2Th 3:9", "n": "", "vs": [[9, "وذلك لا يعني أنه ليس لنا حق، بل لنجعل أنفسنا مثالا لكم لتقتدوا بنا."]]}, {"l": "1Ti 4:12", "n": "", "vs": [[12, "لا يستخف أحد بحداثة سنك. وإنما كن قدوة للمؤمنين، في الكلام والسلوك والمحبة والإيمان والطهارة."]]}, {"l": "Tit 2:7", "n": "", "vs": [[7, "جاعلا من نفسك في كل شيء قدوة للأعمال الصالحة، مظهرا في تعليمك النقاوة والوقار"]]}], "kwAr": "بل كونوا قدوة له", "noteAr": ""}], "arS": [["لا ", []], ["تتسلطوا", ["G2634"]], [" على ", []], ["القطيع", ["G4168"]], [" الذي وضعه الله ", []], ["أمانة", ["G2819"]], [" بين أيديكم، بل كونوا ", []], ["قدوة", ["G5179"]], [" له.", []]]}, {"c": 5, "v": 4, "text": "وعندما يظهر رئيس الرعاة، تنالون إكليل المجد الذي لا يفنى.", "groups": [{"kw": "the", "raw": "1Pe_5:2, 1Pe_2:25; Psa_23:1; Isa_40:11; Eze_34:23, Eze_37:24; Zec_13:7; Joh_10:11; Heb_13:20", "note": "", "refs": [{"l": "1Pe 5:2", "n": "", "vs": [[2, "ارعوا قطيع الله الذي بينكم، كحراس له، لا بدافع الواجب، بل بدافع التطوع، كما يريد الله ، ولا رغبة في الربح الدنيء، بل رغبة في الخدمة بنشاط."]]}, {"l": "1Pe 2:25", "n": "", "vs": [[25, "فقد كنتم ضالين كخراف ضائعة، ولكنكم قد رجعتم الآن إلى راعي نفوسكم وحارسها!"]]}, {"l": "Psa 23:1", "n": "", "vs": [[1, "الرب راعي فلست أحتاج إلى شيء."]]}, {"l": "Isa 40:11", "n": "", "vs": [[11, "يرعى قطيعه كراع، ويجمع الحملان بذراعه، وفي أحضانه يحملها ويقود المرضعات برفق."]]}, {"l": "Eze 34:23", "n": "", "vs": [[23, "وأنصب عليها راعيا واحدا عبدي داود (أي المسيح) يرعاها بنفسه ويكون لها راعيا أمينا."]]}, {"l": "Eze 37:24", "n": "", "vs": [[24, "ويصبح داود عبدي (أي المسيح) ملكا عليهم، فيكون لهم جميعا راع واحد فيمارسون أحكامي ويطيعون فرائضي عاملين بها."]]}, {"l": "Zec 13:7", "n": "", "vs": [[7, "ويقول الرب القدير: «استيقظ أيها السيف وهاجم راعي ورجل رفقتي. اضرب الراعي فتتبدد الخراف. ولكني أرد يدي عن الصغار (أي القلة المؤمنة)."]]}, {"l": "Joh 10:11", "n": "", "vs": [[11, "أنا الراعي الصالح، والراعي الصالح يبذل حياته فدى خرافه."]]}, {"l": "Heb 13:20", "n": "", "vs": [[20, "وأسأل الله ، إله السلام الذي أقام من بين الأموات ربنا يسوع راعي الخراف العظيم بفضل دمه الذي ختم به العهد الأبدي"]]}], "kwAr": "رئيس الرعاة", "noteAr": ""}, {"kw": "appear", "raw": "Matt. 25:31-46; Col_3:3, Col_3:4; 2Th_1:7-10; 1Jo_3:2; Rev_1:7, Rev_20:11, Rev_20:12", "note": "", "refs": [{"l": "Mat 25:31-46", "n": "", "vs": [[31, "وعندما يعود ابن الإنسان في مجده ومعه جميع ملائكته، فإنه يجلس على عرش مجده،"], [32, "وتجتمع أمامه الشعوب كلها، فيفصل بعضهم عن بعض كما يفصل الراعي الغنم عن المعاز،"], [33, "فيوقف الغنم عن يمينه، والمعاز عن يساره؛"], [34, "ثم يقول الملك للذين عن يمينه: تعالوا يامن باركهم أبي، رثوا الملكوت الذي أعد لكم منذ إنشاء العالم:"], [35, "لأني جعت فأطعمتموني، عطشت فسقيتموني، كنت غريبا فآويتموني،"], [36, "عريانا فكسوتموني، مريضا فزرتموني، سجينا فأتيتم إلي!"], [37, "فيرد الأبرار قائلين: يارب، متى رأيناك جائعا فأطعمناك، أو عطشانا فسقيناك؟"], [38, "ومتى رأيناك غريبا فآويناك، أو عريانا فكسوناك؟"], [39, "ومتى رأيناك مريضا أو سجينا فزرناك؟"], [40, "فيجيبهم الملك: الحق أقول لكم: بما أنكم فعلتم ذلك بأحد إخوتي هؤلاء الصغار، فبي فعلتم!"], [41, "ثم يقول للذين عن يساره: ابتعدوا عني ياملاعين إلى النار الأبدية المعدة لإبليس وأعوانه!"], [42, "لأني جعت فلم تطعموني، وعطشت فلم تسقوني،"], [43, "كنت غريبا فلم تأووني، عريانا فلم تكسوني، مريضا وسجينا فلم تزوروني!"], [44, "فيرد هؤلاء أيضا قائلين: يارب، متى رأيناك جائعا أو عطشانا أو غريبا أو عريانا أو مريضا أو سجينا، ولم نخدمك؟"], [45, "فيجيبهم: الحق أقول لكم: بما أنكم لم تفعلوا ذلك بأحد إخوتي هؤلاء الصغار، فبي لم تفعلوا!"], [46, "فيذهب هؤلاء إلى العقاب الأبدي، والأبرار إلى الحياة الأبدية! »"]]}, {"l": "Col 3:3", "n": "", "vs": [[3, "فإنكم قد متم، وحياتكم مستورة مع المسيح في الله."]]}, {"l": "Col 3:4", "n": "", "vs": [[4, "فعندما يظهر المسيح، وهو حياتنا، عندئذ تظهرون أنتم أيضا معه في المجد."]]}, {"l": "2Th 1:7-10", "n": "", "vs": [[7, "وأن يكافئكم، أنتم الذين تتضايقون، كما يكافئنا نحن، بالراحة لدى ظهور الرب يسوع علنا من السماء، ومعه ملائكة قدرته،"], [8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."], [9, "فهؤلاء سيكابدون عقاب الهلاك الأبدي، بعيدا من حضرة الرب ومن مجد قوته،"], [10, "عندما يعود في ذلك اليوم ليتمجد في قديسيه ويكون موضع العجب عند جميع الذين آمنوا، وأنتم قد آمنتم بشهادتنا لكم!"]]}, {"l": "1Jo 3:2", "n": "", "vs": [[2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"]]}, {"l": "Rev 1:7", "n": "", "vs": [[7, "ها هو آت مع السحاب! ستراه عيون الجميع، حتى أولئك الذين طعنوه، وتنوح بسببه قبائل الأرض كلها! نعم، آمين!"]]}, {"l": "Rev 20:11", "n": "", "vs": [[11, "ثم رأيت عرشا عظيما أبيض هربت السماء والأرض من أمام الجالس عليه، فلم يبق لهما مكان."]]}, {"l": "Rev 20:12", "n": "", "vs": [[12, "ورأيت الأموات، كبارا وصغارا، واقفين قدام العرش. وفتحت الكتب، ثم فتح كتاب آخر هو سجل الحياة، ودين الأموات بحسب ما هو مدون في تلك الكتب، كل واحد حسب أعماله."]]}], "kwAr": "يظهر", "noteAr": ""}, {"kw": "a crown", "raw": "1Pe_1:4; Dan_12:3; 1Co_9:25; 2Ti_4:8; Jam_1:12; Rev_2:10, Rev_3:11", "note": "", "refs": [{"l": "1Pe 1:4", "n": "", "vs": [[4, "وإرثا لا يفنى ولا يفسد ولا ي ting", "raw": "1Sa_1:10-18, 1Sa_30:6; Psa_27:13, Psa_27:14, Psa_37:5, Psa_55:22, Psa_56:3, Psa_56:4; Mat_6:25, Mat_6:34; Luk_12:11, Luk_12:12, Luk_12:22; Phi_4:6; Heb_13:5, Heb_13:6", "note": "", "refs": [{"l": "1Sa 1:10-18", "n": "", "vs": [[10, "بنفس مرة وصلت إلى الرب وبكت بحرقة،"], [11, "ونذرت نذرا للرب قائلة: «يارب الجنود، إن عطفت على مذلة أمتك، وذكرتني ولم تنسني، بل وهبت أمتك ذرية، فإنني أعطيه للرب كل أيام حياته، ولن أحلق رأسه»."], [12, "وأطالت حنة صلاتها أمام الرب بينما كان عالي يراقب حركة شفتيها."], [13, "فإن حنة كانت تصلي في قلبها ولا يتحرك منها سوى شفتيها، من غير أن يصدر عنهما صوت، فظن عالي أنها سكرى."], [14, "فقال لها عالي: «إلى متى تظلين سكرى؟ كفي عن شرب الخمر»"], [15, "فأجابته: «لا يا سيِّدي: إنني امرأة حزينة الروح، لم أشرب خمرا ولا مسكرا، بل أسكب نفسي أمام الرب."], [16, "لا تظن أمتك ابنة بليعال، فإنني من فرط كربتي وغيظي قد أطلت صلاتي إلى الآن»."], [17, "فقال لها عالي: «اذهبي بسلام، وليعطك إله إسرائيل ما طلبته من لدنه»."], [18, "فقالت: «ليت أمتك تحظى برضاك». ثم انصرفت في سبيلها وأكلت، ولم تعد أمارات الحزن تكسو وجهها."]]}, {"l": "1Sa 30:6", "n": "", "vs": [[6, "وتفاقم ضيق داود لأن الرجال، من فرط ما حل بهم من مرارة وأسى على أبنائهم وبناتهم، طالبوا برجمه، غير أن داود تشبث وتقوى بالرب إلهه."]]}, {"l": "Psa 27:13", "n": "", "vs": [[13, "غير أني قد آمنت بأن أرى جود الرب في أرض الأحياء."]]}, {"l": "Psa 27:14", "n": "", "vs": [[14, "انتظر الرب. تقو وليتشجع قلبك. وانتظر الرب دائما."]]}, {"l": "Psa 37:5", "n": "", "vs": [[5, "سلم للرب طريقك وتوكل عليه فيتولى أمرك."]]}, {"l": "Psa 55:22", "n": "", "vs": [[22, "ألق على الرب همك وهو يعتني بك: إنه لا يدع الصديق يتزعزع إلى الأبد."]]}, {"l": "Psa 56:3", "n": "", "vs": [[3, "في يوم خوفي أتكل عليك."]]}, {"l": "Psa 56:4", "n": "", "vs": [[4, "توكلت على الله الذي أحمده على كلامه، فلا أخاف. ماذا يستطيع أن يصنع بي البشر؟"]]}, {"l": "Mat 6:25", "n": "", "vs": [[25, "لذلك أقول لكم: لا تهتموا لمعيشتكم بشأن ما تأكلون وما تشربون، ولا لأجسادكم بشأن ما تكتسون. أليست الحياة أكثر من مجرد طعام، والجسد أكثر من مجرد كساء؟"]]}, {"l": "Mat 6:34", "n": "", "vs": [[34, "لا تهتموا بأمر الغد، فإن الغد يهتم بأمر نفسه. يكفي كل يوم ما فيه من سوء!"]]}, {"l": "Luk 12:11", "n": "", "vs": [[11, "وعندما يؤتى بكم للمثول أمام المجامع والحكام والسلطات، فلا تهتموا كيف أو بماذا تردون، ولا بما تقولون!"]]}, {"l": "Luk 12:12", "n": "", "vs": [[12, "فإن الروح القدس سيلقنكم في تلك الساعة عينها ما يجب أن تقولوا»."]]}, {"l": "Luk 12:22", "n": "", "vs": [[22, "ثم قال لتلاميذه: «لهذا السبب أقول لكم: لا تهتموا لحياتكم بما تأكلون، ولا لأجسادكم بما تكتسون."]]}, {"l": "Phi 4:6", "n": "", "vs": [[6, "لا تقلقوا من جهة أي شيء، بل في كل أمر لتكن طلباتكم معروفة لدى الله، بالصلاة والدعاء، مع الشكر."]]}, {"l": "Heb 13:5", "n": "", "vs": [[5, "اجعلوا سيرتكم مترفعة عن حب المال، واقنعوا بما عندكم، لأن الله يقول: «لا أتركك، ولا أتخلى عنك أبدا!»"]]}, {"l": "Heb 13:6", "n": "", "vs": [[6, "فنستطيع إذن، أن نقول بكل ثقة وجرأة: «الرب معيني، فلن أخاف! ماذا يصنع بي الإنسان؟»"]]}], "kwAr": "اطرحوا عليه", "noteAr": ""}, {"kw": "for", "raw": "Psa_34:15, Psa_142:4, Psa_142:5; Mat_6:26, Mat_6:33; Mar_4:38; Luk_12:30-32; Joh_10:13", "note": "", "refs": [{"l": "Psa 34:15", "n": "", "vs": [[15, "لأن الرب يرعى الأبرار بعنايته ويستجيب إلى دعائهم."]]}, {"l": "Psa 142:4", "n": "", "vs": [[4, "التفت نحو يميني فلا تجد من يحفل بي، لم يبق لي ملاذ أو من يسأل عني."]]}, {"l": "Psa 142:5", "n": "", "vs": [[5, "إياك دعوت يارب قائلا: أنت ملجإي، أنت نصيبي في أرض الأحياء."]]}, {"l": "Mat 6:26", "n": "", "vs": [[26, "تأملوا طيور السماء: إنها لا تزرع ولا تحصد ولا تجمع في مخازن، وأبوكم السماوي يعولها. أفلستم أنتم أفضل منها كثيرا؟"]]}, {"l": "Mat 6:33", "n": "", "vs": [[33, "أما أنتم، فاطلبوا أولا ملكوت الله وبره، وهذه كلها تزاد لكم."]]}, {"l": "Mar 4:38", "n": "", "vs": [[38, "وكان هو في مؤخر القارب نائما على وسادة. فأيقظوه وقالوا له: «يامعلم، أما يهمك أننا نهلك؟»"]]}, {"l": "Luk 12:30-32", "n": "", "vs": [[30, "فهذه الحاجات كلها تسعى إليها أمم العالم، وأبوكم يعلم أنكم تحتاجون إليها."], [31, "إنما اسعوا إلى ملكوته، فتزاد لكم هذه كلها."], [32, "لا تخافوا، أيها القطيع الصغير، لأن أباكم قد سر أن يعطيكم الملكوت."]]}, {"l": "Joh 10:13", "n": "", "vs": [[13, "إنه يهرب لأنه أجير ولا يبالي بالخراف!"]]}], "kwAr": "هو يعتني بكم", "noteAr": ""}], "arS": [["واطرحوا", ["G1977"]], [" عليه ثقل ", []], ["همومكم", ["G3308"]], [" ", []], ["كلها", ["G3956"]], ["، لأنه هو ", []], ["يعتني", ["G3199"]], [" بكم.", []]]}, {"c": 5, "v": 8, "text": "تعقلوا وتنبهوا. إن خصمكم إبليس كأسد يزأر، يجول باحثا عن فريسة يبتلعها.", "groups": [{"kw": "sober", "raw": "1Pe_1:13, 1Pe_4:7; Mat_24:48-50; Luk_12:45, Luk_12:46, Luk_21:34, Luk_21:36; Rom_13:11-13; 1Th_5:6-8; 1Ti_2:9, 1Ti_2:15, 1Ti_3:2, 1Ti_3:11; Tit_1:8, Tit_2:2, Tit_2:4, Tit_2:6, Tit_2:12", "note": "", "refs": [{"l": "1Pe 1:13", "n": "", "vs": [[13, "لذلك اجعلوا أذهانكم متنبهة دائما، وتيقظوا، وعلقوا رجاءكم كله على النعمة التي ستكون من نصيبكم عندما يعود يسوع المسيح ظاهرا بمجده!"]]}, {"l": "1Pe 4:7", "n": "", "vs": [[7, "إن نهاية كل شيء قد صارت قريبة. فتعقلوا إذن، وكونوا متنبهين لرفع الصلاة دائما."]]}, {"l": "Mat 24:48-50", "n": "", "vs": [[48, "ولكن إذا قال ذلك العبد الشرير في قلبه: سيتأخر سيدي في رجوعه!"], [49, "وبدأ يضرب زملاءه العبيد ويأكل ويشرب مع السكيرين،"], [50, "فإن سيد ذلك العبد لابد أن يرجع في يوم لا يتوقعه، وساعة لا يعرفها،"]]}, {"l": "Luk 12:45", "n": "", "vs": [[45, "ولكن إذا قال ذلك العبد في نفسه: سيدي سيتأخر في رجوعه؛ وأخذ يضرب الخادمين والخادمات ويأكل ويشرب ويسكر،"]]}, {"l": "Luk 12:46", "n": "", "vs": [[46, "فإن سيد ذلك العبد يرجع في يوم لا يتوقعه وساعة لا يعرفها، فيمزقه ويجعل مصيره مع الخائنين."]]}, {"l": "Luk 21:34", "n": "", "vs": [[34, "ولكن احذروا لأنفسكم لئلا تتثقل قلوبكم بالانغماس في اللذات وبالسكر وهموم الحياة، فيدهمكم ذلك اليوم فجأة؛"]]}, {"l": "Luk 21:36", "n": "", "vs": [[36, "فاسهروا إذن وتضرعوا في كل حين، لكي تتمكنوا من أن تنجوا من جميع هذه الأمور التي هي على وشك أن تحدث، وتقفوا أمام ابن الإنسان»."]]}, {"l": "Rom 13:11-13", "n": "", "vs": [[11, "وفوق هذا، فأنتم تعرفون الوقت، وأنها الآن الساعة التي يجب أن نستيقظ فيها من النوم. فخلاصنا الآن، أقرب إلينا مما كان يوم آمنا:"], [12, "كاد الليل أن ينتهي والنهار أن يطلع. فلنطرح أعمال الظلام، ونلبس سلاح النور"], [13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."]]}, {"l": "1Th 5:6-8", "n": "", "vs": [[6, "إذن، لا ننم كما ينام الآخرون، بل لنظل ساهرين وصاحين،"], [7, "فإنه في الليل ينام الذين ينامون، وفي الليل يسكر الذين يسكرون"], [8, "وأما نحن، أهل النهار، فلنظل صاحين، متخذين من الإيمان والمحبة درعا لصدورنا، ومن الرجاء بالخلاص خوذة لرؤوسنا."]]}, {"l": "1Ti 2:9", "n": "", "vs": [[9, "كما أريد أيضا، أن تظهر النساء بمظهر لائق محشوم اللباس، متزينات بالحياء والرزانة، غير متحليات بالجدائل والذهب واللاليء والحلل الغالية الثمن،"]]}, {"l": "1Ti 2:15", "n": "", "vs": [[15, "إلا أنها ستحفظ سالمة في ولادة الأولاد، على أن يثبتن في الإيمان والمحبة والقداسة مع الرزانة!"]]}, {"l": "1Ti 3:2", "n": "", "vs": [[2, "إذن، يجب أن يكون الراعي بلا عيب، زوجا لامرأة واحدة، نبيها عاقلا مهذبا مضيافا، قادرا على التعليم؛"]]}, {"l": "1Ti 3:11", "n": "", "vs": [[11, "كذلك يجب أن تكون النساء أيضا رزينات، غير نمامات، نبيهات، أمينات في كل شيء."]]}, {"l": "Tit 1:8", "n": "", "vs": [[8, "بل مضيافا، محبا للصلاح، رزينا، بارا، تقيا، مالكا لطبعه،"]]}, {"l": "Tit 2:2", "n": "", "vs": [[2, "أن يكون الشيوخ ذوي رزانة ووقار، متعقلين، صحيحي الإيمان والمحبة والصبر."]]}, {"l": "Tit 2:4", "n": "", "vs": [[4, "لكي يدربن الشابات على أن يكن محبات لأزواجهن ولأولادهن،"]]}, {"l": "Tit 2:6", "n": "", "vs": [[6, "كذلك عظ الشبان أن يكونوا متعقلين،"]]}, {"l": "Tit 2:12", "n": "", "vs": [[12, "وهي تعلمنا أن نقطع علاقتنا بالإباحية والشهوات العالمية، وأن نحيا في العصر الحاضر حياة التعقل والبر والتقوى،"]]}], "kwAr": "تعقلوا", "noteAr": ""}, {"kw": "your", "raw": "Est_7:6; Job_1:6, Job_2:2; Psa_109:6 *marg. Isa_50:8; Zec_3:1; Luk_22:31", "note": "", "refs": [{"l": "Est 7:6", "n": "", "vs": [[6, "فأجابت: «إن هذا الخصم والعدو هو هامان الشرير»."]]}, {"l": "Job 1:6", "n": "", "vs": [[6, "وحدث ذات يوم أن مثل بنو الله أمام الرب، فاندس الشيطان في وسطهم."]]}, {"l": "Job 2:2", "n": "", "vs": [[2, "فسأل الرب الشيطان: «من أين جئت؟» فأجاب الشيطان: «من الطواف في الأرض والتجول فيها»."]]}, {"l": "Psa 109:6", "n": "*marg.", "vs": [[6, "ول على عدوي قاضيا ظالما، وليقف خصمه عن يمينه يتهمه جورا."]]}, {"l": "Isa 50:8", "n": "", "vs": [[8, "إن منصفي قريب، فمن إذا يخاصمني؟ فلنمثل معا. من هو خصمي؟ فليتقدم مني."]]}, {"l": "Zec 3:1", "n": "", "vs": [[1, "ثم أراني الرب يهوشع رئيس الكهنة واقفا في حضرة ملاك الرب، وعن يمينه ينتصب الشيطان ليقاومه."]]}, {"l": "Luk 22:31", "n": "", "vs": [[31, "وقال الرب «سمعان، سمعان! ها إن الشيطان قد طلبكم لكي يغربلكم كما يغربل القمح،"]]}], "kwAr": "خصمكم", "noteAr": ""}, {"kw": "the devil", "raw": "Mat_4:1, Mat_4:11, Mat_13:39, Mat_25:41; Joh_8:44; Eph_4:27, Eph_6:11; Jam_4:7; 1Jo_3:8-10; Rev_12:9, Rev_20:2, Rev_20:10", "note": "", "refs": [{"l": "Mat 4:1", "n": "", "vs": [[1, "ثم صعد الروح بيسوع إلى البرية، ليجرب من قبل إبليس."]]}, {"l": "Mat 4:11", "n": "", "vs": [[11, "فتركه إبليس، وإذا بعض الملائكة جاءوا إليه وأخذوا يخدمونه."]]}, {"l": "Mat 13:39", "n": "", "vs": [[39, "أما العدو الذي زرع الزوان فهو إبليس. والحصاد هو نهاية الزمان. والحصادون هم الملائكة."]]}, {"l": "Mat 25:41", "n": "", "vs": [[41, "ثم يقول للذين عن يساره: ابتعدوا عني ياملاعين إلى النار الأبدية المعدة لإبليس وأعوانه!"]]}, {"l": "Joh 8:44", "n": "", "vs": [[44, "إنكم أولاد أبيكم إبليس، وترغبون أن تعملوا شهوات أبيكم. فهو من البدء كان قاتلا للناس، ولم يثبت في الحق لأنه خال من الحق! وعندما ينطق بالكذب فهو ينضح بما فيه، لأنه كذاب وأبو الكذب!"]]}, {"l": "Eph 4:27", "n": "", "vs": [[27, "ولا تتيحوا فرصة لإبليس!"]]}, {"l": "Eph 6:11", "n": "", "vs": [[11, "البسوا سلاح الله الكامل، لتتمكنوا من الصمود في وجه مكايد إبليس."]]}, {"l": "Jam 4:7", "n": "", "vs": [[7, "إذن، كونوا خاضعين لله. وقاوموا إبليس فيهرب منكم."]]}, {"l": "1Jo 3:8-10", "n": "", "vs": [[8, "ولكن من يمارس الخطيئة، يظهر أنه من أولاد إبليس، لأن إبليس يمارس الخطيئة منذ البداية. وقد جاء ابن الله إلى الأرض لكي يبطل أعمال إبليس."], [9, "فكل مولود من الله، لا يمارس الخطيئة، لأن طبيعة الله صارت ثابتة فيه. بل إنه لا يستطيع أن يمارس الخطيئة، لأنه مولود من الله."], [10, "إذن، هذا هو المقياس الذي نميز به بين أولاد الله وأولاد إبليس. من لا يمارس الصلاح، فهو ليس من الله. وكذلك من لا يحب أخاه!"]]}, {"l": "Rev 12:9", "n": "", "vs": [[9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."]]}, {"l": "Rev 20:2", "n": "", "vs": [[2, "قيد بها التنين، أي الحية القديمة، وهو إبليس أو الشيطان، وسجنه مدة ألف سنة،"]]}, {"l": "Rev 20:10", "n": "", "vs": [[10, "ثم يطرح إبليس الذي كان يضللهم، في بحيرة النار والكبريت، حيث الوحش والنبي الدجال. هناك سوف يعذبون نهارا وليلا، إلى أبد الآبدين."]]}], "kwAr": "إبليس", "noteAr": ""}, {"kw": "as", "raw": "Jdg_14:5; Psa_104:21; Pro_19:12, Pro_20:2; Isa_5:29, Isa_5:30, Isa_14:12, Isa_14:13; Jer_2:15; Jer_51:38; Eze_19:7; Hos_11:10; Joe_3:16; Amo_1:2, Amo_3:4, Amo_3:8; Zec_11:3; 2Ti_4:17; Rev_12:12", "note": "", "refs": [{"l": "Jdg 14:5", "n": "", "vs": [[5, "فانحدر شمشون ووالداه إلى تمنة حتى بلغوا كرومها، وإذا بشبل أسد يتحفز مزمجرا للانقضاض عليه،"]]}, {"l": "Psa 104:21", "n": "", "vs": [[21, "تزمجر الأشبال طلبا لفريستها ملتمسة طعامها من عند الله."]]}, {"l": "Pro 19:12", "n": "", "vs": [[12, "حنق الملك كزمجرة الأسد، ورضاه كالطل على العشب."]]}, {"l": "Pro 20:2", "n": "", "vs": [[2, "سخط الملك مثل زمجرة الأسد، ومن يثير غيظه يسيء إلى نفسه."]]}, {"l": "Isa 5:29", "n": "", "vs": [[29, "زئيرهم كأنه زئير أسد يزمجر وينقض على فريسته ويحملها وليس من منقذ."]]}, {"l": "Isa 5:30", "n": "", "vs": [[30, "يزمجرون عليها في ذلك اليوم كهدير البحر. وإن جاس أحد في البلاد متفرسا لا يرى سوى الظلمة والضيق، حتى (انفراجات) الضوء (أي ومضات الرجاء) قد احتجبت وراء سحبه."]]}, {"l": "Isa 14:12", "n": "", "vs": [[12, "كيف هويت من السماء يازهرة بنت الصبح؟ كيف قطعت وطرحت إلى الأرض ياقاهر الأمم؟"]]}, {"l": "Isa 14:13", "n": "", "vs": [[13, "قد قلت في قلبك: إني أرتقي إلى السماء وأرفع عرشي فوق كواكب الله، وأجلس على جبل الاجتماع في أقصى الشمال"]]}, {"l": "Jer 2:15", "n": "", "vs": [[15, "قد زأرت الأسود عليه زئيرا مدويا، وجعلت أرضه خربة. أحرقت مدنه فأصبحت مهجورة."]]}, {"l": "Jer 51:38", "n": "", "vs": [[38, "إنهم يزأرون كالأسود ويزمجرون كالأشبال."]]}, {"l": "Eze 19:7", "n": "", "vs": [[7, "وهدم قصور هم وخرب مدنهم، فارتعبت الأرض ومن فيها من زمجرة زئيره،"]]}, {"l": "Hos 11:10", "n": "", "vs": [[10, "يسيرون ورائي أنا الرب، فأزأر كالأسد، وعندئذ يسرع أبنائي قادمين من الغرب."]]}, {"l": "Joe 3:16", "n": "", "vs": [[16, "يزأر الرب في صهيون، ويجلجل بصوته من أورشليم فترجف السماوات والأرض؛ لكن الرب يكون ملجأ لشعبه، وحصنا لبني إسرائيل."]]}, {"l": "Amo 1:2", "n": "", "vs": [[2, "قال: «يزأر الرب من صهيون ويدوي بصوته من أورشليم، فتنتحب مراعي الرعاة، وتذوي قمة الكرمل."]]}, {"l": "Amo 3:4", "n": "", "vs": [[4, "أيزأر أسد في الغابة من غير أن يقع على فريسة؟ أيزمجر الشبل بصوته من عرينه ما لم يكن قد اقتنص شيئا؟"]]}, {"l": "Amo 3:8", "n": "", "vs": [[8, "قد زأر الأسد فمن لا يخاف، وتكلم الرب فمن لا يتنبأ؟"]]}, {"l": "Zec 11:3", "n": "", "vs": [[3, "استمعوا إلى نواح الرعاة (أي الحكام) لأن مرابعهم الثرية قد تلفت. أنصتوا إلى زمجرة الأسود لأن أجمات وادي الأردن قد صارت خرابا."]]}, {"l": "2Ti 4:17", "n": "", "vs": [[17, "إلا أن الرب وقف بجانبي وأمدني بالقوة، لكي تتم بي المناداة بالبشارة، فيسمعها جميع من هم من الأمم؛ وقد نجوت من فم الأسد."]]}, {"l": "Rev 12:12", "n": "", "vs": [[12, "افرحي أيتها السماوات، وافرحوا ياأهلها، الويل لكم ياأهل الأرض والبحر، لأن إبليس هبط عليكم وهو في شدة الغضب، عالما أن أيامه صارت معدودة»."]]}], "kwAr": "كأسد يزأر", "noteAr": ""}, {"kw": "walketh", "raw": "Job_1:7, Job_2:2", "note": "", "refs": [{"l": "Job 1:7", "n": "", "vs": [[7, "فسأل الرب الشيطان: «من أين جئت؟» فأجاب الشيطان: «من الطواف في الأرض والتجول فيها»."]]}, {"l": "Job 2:2", "n": "", "vs": [[2, "فسأل الرب الشيطان: «من أين جئت؟» فأجاب الشيطان: «من الطواف في الأرض والتجول فيها»."]]}], "kwAr": "يجول", "noteAr": ""}, {"kw": "devour", "raw": "Eze_22:25; Dan_6:24; Hos_13:8", "note": "", "refs": [{"l": "Eze 22:25", "n": "", "vs": [[25, "تواطأ أنبياؤها الكذبة فيها مثل أسد مزمجر يمزق الفريسة. التهموا نفوسا، واستولوا على نفائس الناس وكنوزهم، وكثروا أراملها فيها."]]}, {"l": "Dan 6:24", "n": "", "vs": [[24, "ثم أصدر الملك أمره فأحضروا المتآمرين الذين اتهموا دانيآل وطرحوهم في جب الأسود، مع أولادهم ونسائهم. وما كادوا يصلون إلى أسفل الجب حتى بطشت بهم الأسود وهشمت عظامهم."]]}, {"l": "Hos 13:8", "n": "", "vs": [[8, "وأنقض عليهم كدبة ثاكل، وأمزق قلوبهم أشلاء وأفترسهم هناك كلبوءة، ووحش البر يقطعهم إربا إربا."]]}], "kwAr": "يبتلعها", "noteAr": ""}], "arS": [["تعقلوا", ["G3525"]], [" ", []], ["وتنبهوا", ["G1127"]], [". إن ", []], ["خصمكم", ["G476"]], [" ", []], ["إبليس", ["G1228"]], [" ", []], ["كأسد", ["G3023"]], [" ", []], ["يزأر", ["G5612"]], ["، ", []], ["يجول", ["G4043"]], [" ", []], ["باحثا", ["G2212"]], [" عن فريسة ", []], ["يبتلعها", ["G2666"]], [".", []]]}, {"c": 5, "v": 9, "text": "فقاوموه، ثابتين في الإيمان. واذكروا أن إخوتكم المنتشرين في العالم يجتازون وسط هذه الآلام عينها.", "groups": [{"kw": "resist", "raw": "Luk_4:3-12; Eph_4:27, Eph_6:11-13; Jam_4:7", "note": "", "refs": [{"l": "Luk 4:3-12", "n": "", "vs": [[3, "فقال له إبليس: «إن كنت ابن الله، فقل لهذا الحجر أن يتحول إلى خبز»."], [4, "فرد عليه يسوع قائلا: «قد كتب: ليس بالخبز وحده يحيا الإنسان، بل بكل كلمة من الله!»"], [5, "ثم أصعده إبليس إلى جبل عال، وأراه ممالك العالم كلها في لحظة من الزمن،"], [6, "وقال له: «أعطيك السلطة على هذه الممالك كلها وما فيها من عظمة، فإنها قد سلمت إلى وأنا أعطيها لمن أشاء."], [7, "فإن سجدت أمامي، تصير كلها لك!»"], [8, "فر د عليه يسوع قائلا: «قد كتب: للرب إلهك تسجد، وإياه وحده تعبد!»"], [9, "ثم اقتاده إبليس إلى أورشليم، وأوقفه على حافة سطح الهيكل، وقال له: «إن كنت ابن الله، فاطرح نفسك من هنا إلى الأسفل"], [10, "فإنه قد كتب: يوصي ملائكته بك لكي يحفظوك،"], [11, "فعلى أيديهم يحملونك، لئلا تصدم قدمك بحجر»."], [12, "فرد عليه يسوع قائلا: «قد قيل: لا تجرب الرب إلهك!»"]]}, {"l": "Eph 4:27", "n": "", "vs": [[27, "ولا تتيحوا فرصة لإبليس!"]]}, {"l": "Eph 6:11-13", "n": "", "vs": [[11, "البسوا سلاح الله الكامل، لتتمكنوا من الصمود في وجه مكايد إبليس."], [12, "فإن حربنا ليست ضد ذوي اللحم والدم، بل ضد الرئاسات، ضد السلطات، ضد أسياد العالم حكام هذا الظلام، ضد قوى الشر الروحية في الأماكن السماوية."], [13, "لذلك اتخذوا سلاح الله الكامل، لتتمكنوا من المقاومة في يوم الشر، ومن الصمود أيضا بعد تحقيق كل هدف."]]}, {"l": "Jam 4:7", "n": "", "vs": [[7, "إذن، كونوا خاضعين لله. وقاوموا إبليس فيهرب منكم."]]}], "kwAr": "فقاوموه", "noteAr": ""}, {"kw": "stedfast", "raw": "Luk_22:32; Eph_6:16; 1Ti_6:12; 2Ti_4:7; Heb_11:33", "note": "", "refs": [{"l": "Luk 22:32", "n": "", "vs": [[32, "ولكني تضرعت لأجلك لكي لا يخيب إيمانك. وأنت، بعد أن تسترد، ثبت إخوتك»."]]}, {"l": "Eph 6:16", "n": "", "vs": [[16, "وفوق هذا كله، احملوا الإيمان ترسا به تقدرون أن تطفئوا جميع سهام الشرير المشتعلة."]]}, {"l": "1Ti 6:12", "n": "", "vs": [[12, "أحسن الجهاد في معركة الإيمان الجميلة. تمسك بالحياة الأبدية، التي إليها قد دعيت، وقد اعترفت الاعتراف الحسن (بالإيمان) أمام شهود كثيرين."]]}, {"l": "2Ti 4:7", "n": "", "vs": [[7, "قد جاهدت الجهاد الحسن، قد بلغت نهاية الشوط، قد حافظت على الإيمان."]]}, {"l": "Heb 11:33", "n": "", "vs": [[33, "فبالإيمان، تغلب هؤلاء على ممالك الأعداء، وحكموا حكما عادلا ونالوا ما وعدهم به الله . وبه، أطبقوا أفواه الأسود،"]]}], "kwAr": "ثابتين في الإيمان", "noteAr": ""}, {"kw": "the same", "raw": "1Pe_1:6, 1Pe_2:21, 1Pe_3:14, 1Pe_4:13; Joh_16:33; Act_14:22; 1Co_10:13; 1Th_2:15, 1Th_2:16; 1Th_3:3; 2Ti_3:12; Rev_1:9, Rev_6:11, Rev_7:14", "note": "", "refs": [{"l": "1Pe 1:6", "n": "", "vs": [[6, "وهذا يدعوكم إلى الابتهاج، مع أنه لابد لكم الآن من الحزن فترة قصيرة تحت وطأة التجارب المتنوعة!"]]}, {"l": "1Pe 2:21", "n": "", "vs": [[21, "لأن الله دعاكم إلى الاشتراك في هذا النوع من الآلام. فالمسيح، الذي تألم لأجلكم، هو القدوة التي تقتدون بها. فسيروا على آثار خطواته:"]]}, {"l": "1Pe 3:14", "n": "", "vs": [[14, "وإن كان لابد أن تتألموا في سبيل البر، فطوبى لكم! لا تخافوا من تهديد الذين يضطهدونكم، ولا تقلقوا."]]}, {"l": "1Pe 4:13", "n": "", "vs": [[13, "وإنما افرحوا: لأنكم كما تشاركون المسيح في الآلام الآن، لابد أن تفرحوا بمشاركته في الابتهاج عند ظهور مجده."]]}, {"l": "Joh 16:33", "n": "", "vs": [[33, "أخبرتكم بهذا كله ليكون لكم في سلام. فإنكم في العالم ستقاسون الضيق. ولكن تشجعوا، فأنا قد انتصرت على العالم!»"]]}, {"l": "Act 14:22", "n": "", "vs": [[22, "وفي هذه الأماكن كلها كانا يشددان عزيمة التلاميذ، ويحثانهم على الثبات في الإيمان، مؤكدين لهم أن دخول ملكوت الله يقتضي أن نقاسي صعوبات كثيرة."]]}, {"l": "1Co 10:13", "n": "", "vs": [[13, "لم يصبكم من التجارب إلا ما هو بشري. ولكن الله أمين وجدير بالثقة، فلا يدعكم تجربون فوق ما تطيقون، بل يدبر لكم مع التجربة سبيل الخروج منها لتطيقوا احتمالها."]]}, {"l": "1Th 2:15", "n": "", "vs": [[15, "الذين قتلوا الرب يسوع والأنبياء واضطهدونا نحن أيضا، وهم لا يرضون الله ويعادون الناس جميعا،"]]}, {"l": "1Th 2:16", "n": "", "vs": [[16, "إذ يمنعوننا من تبشير الأمم ليخلصوا، وبذلك يستكملون خطاياهم كل حين، ولكن الغضب قد حل عليهم إلى الغاية."]]}, {"l": "1Th 3:3", "n": "", "vs": [[3, "حتى لا يتزعزع أحد منكم من جراء هذه الضيقات. فإنكم تعلمون أننا معينون لذلك؛"]]}, {"l": "2Ti 3:12", "n": "", "vs": [[12, "وحقا، إن جميع الذين يعزمون أن يعيشوا عيشة التقوى في المسيح يسوع يضطهدون."]]}, {"l": "Rev 1:9", "n": "", "vs": [[9, "أنا، يوحنا أخاكم وشريككم في الضيقة والملكوت والصبر في يسوع، كنت منفيا في الجزيرة التي تسمى بطمس، لأجل كلمة الله وشهادة يسوع."]]}, {"l": "Rev 6:11", "n": "", "vs": [[11, "فأعطي كل منهم ثوبا أبيض، وقيل لهم أن يصبروا قليلا إلى أن يكمل عدد شركائهم العبيد وإخوتهم الذين سيقتلون مثلهم."]]}, {"l": "Rev 7:14", "n": "", "vs": [[14, "فأجبته: «أنت أعلم ياسيدي!» فقال: «هؤلاء هم الذين أتوا من الضيقة العظيمة، وقد غسلوا ثيابهم وبيضوها بدم الحمل."]]}], "kwAr": "الآلام عينها", "noteAr": ""}], "arS": [["فقاوموه", ["G436"]], ["، ", []], ["ثابتين", ["G4731"]], [" في ", []], ["الإيمان", ["G4102"]], [". ", []], ["واذكروا", ["G1492"]], [" أن ", []], ["إخوتكم", ["G81"]], [" المنتشرين في ", []], ["العالم", ["G2889"]], [" ", []], ["يجتازون", ["G2005"]], [" وسط هذه ", []], ["الآلام", ["G3804"]], [" ", []], ["عينها", ["G846"]], [".", []]]}, {"c": 5, "v": 10, "text": "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين.", "groups": [{"kw": "the God", "raw": "Exo_34:6, Exo_34:7; Psa_86:5, Psa_86:15; Mic_7:18, Mic_7:19; Rom_5:20,Rom_5:21, Rom_15:5, Rom_15:13; 2Co_13:11; Heb_13:20", "note": "", "refs": [{"l": "Exo 34:6", "n": "", "vs": [[6, "وعبر من أمام موسى مناديا: «أنا الرب. الرب إله رؤوف رحيم، بطيء الغضب وكثير الإحسان والوفاء."]]}, {"l": "Exo 34:7", "n": "", "vs": [[7, "أدخر الإحسان وأغفر الإثم والمعصية والخطيئة. ولكني لا أعفي المذنب من العقاب، بل أفتقد إثم الآباء في الأبناء والأحفاد حتى الجيل الرابع»."]]}, {"l": "Psa 86:5", "n": "", "vs": [[5, "لأنك أنت يارب طيب وغفور، وكثير الرحمة لجميع الذين يدعونك."]]}, {"l": "Psa 86:15", "n": "", "vs": [[15, "إنما أنت يارب إله رحيم ورؤوف وبطيء الغضب ووافر الرحمة والحق."]]}, {"l": "Mic 7:18", "n": "", "vs": [[18, "إي إله مثلك يصفح عن الإثم ويعفو عن معصية بقية ميراثه؟ لا يحتفظ إلى الأبد بغضبه لأنه يسر بالرحمة."]]}, {"l": "Mic 7:19", "n": "", "vs": [[19, "يعود يرحمنا ويطأ ذنوبنا بقدميه، ويطرح معاصينا إلى أعماق البحر."]]}, {"l": "Rom 5:20", "n": "", "vs": [[20, "وأما الشريعة فقد أدخلت لتظهر كثرة المعصية. ولكن، حيث كثرت الخطيئة، تتوافر النعمة أكثر جدا،"]]}, {"l": "Rom 5:21", "n": "", "vs": [[21, "حتى إنه كما ملكت الخطيئة بالموت، فكذلك أيضا تملك النعمة على أساس البر مؤدية إلى الحياة الأبدية بيسوع المسيح ربنا."]]}, {"l": "Rom 15:5", "n": "", "vs": [[5, "وليعطكم إله الصبر والتعزية أن تكونوا متوافقين بعضكم مع بعض بحسب المسيح يسوع،"]]}, {"l": "Rom 15:13", "n": "", "vs": [[13, "فليملأكم إله الرجاء كل فرح وسلام في إيمانكم حتى تزدادوا رجاء بقوة الروح القدس."]]}, {"l": "2Co 13:11", "n": "", "vs": [[11, "وأخيرا، أيها الإخوة: افرحوا؛ تكملوا؛ تشجعوا؛ اتفقوا في الرأي؛ عيشوا بسلام. وإله المحبة والسلام سيكون معكم!"]]}, {"l": "Heb 13:20", "n": "", "vs": [[20, "وأسأل الله ، إله السلام الذي أقام من بين الأموات ربنا يسوع راعي الخراف العظيم بفضل دمه الذي ختم به العهد الأبدي"]]}], "kwAr": "إله كل نعمة", "noteAr": ""}, {"kw": "who", "raw": "1Pe_1:15; Rom_8:28-30, Rom_9:11, Rom_9:24; 1Co_1:9; 1Th_2:12; 2Th_2:14; 1Ti_6:12; 2Ti_1:9; 2Pe_1:3", "note": "", "refs": [{"l": "1Pe 1:15", "n": "", "vs": [[15, "وإنما اسلكوا سلوكا مقدسا في كل أمر، مقتدين بالقدوس الذي دعاكم،"]]}, {"l": "Rom 8:28-30", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."], [29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."], [30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."]]}, {"l": "Rom 9:11", "n": "", "vs": [[11, "ولم يكن الولدان قد ولدا بعد ولا فعلا خيرا أو شرا، وذلك كي يبقى قصد الله من جهة الاختيار"]]}, {"l": "Rom 9:24", "n": "", "vs": [[24, "فينا نحن الذين دعاهم لا من بين اليهود فقط بل من بين الأمم أيضا؟"]]}, {"l": "1Co 1:9", "n": "", "vs": [[9, "فإن الله أمين، وقد دعاكم إلى الشركة مع ابنه يسوع ربنا."]]}, {"l": "1Th 2:12", "n": "", "vs": [[12, "ونحرضكم أن تسلكوا سلوكا يليق بالله، ذاك الذي يدعوكم إلى ملكوته ومجده."]]}, {"l": "2Th 2:14", "n": "", "vs": [[14, "فإلى هذا الأمر قد دعاكم ببشارتنا لكم، لنوال مجد ربنا يسوع المسيح."]]}, {"l": "1Ti 6:12", "n": "", "vs": [[12, "أحسن الجهاد في معركة الإيمان الجميلة. تمسك بالحياة الأبدية، التي إليها قد دعيت، وقد اعترفت الاعتراف الحسن (بالإيمان) أمام شهود كثيرين."]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،"]]}, {"l": "2Pe 1:3", "n": "", "vs": [[3, "إن الله، بقدرته الإلهية، قد زودنا بكل ما نحتاج إليه في الحيا ة الروحية المتصفة بالتقوى. ذلك أنه عرفنا بالمسيح الذي دعانا إلى مجده وفضيلته،"]]}], "kwAr": "الذي دعاكم", "noteAr": ""}, {"kw": "eternal", "raw": "2Co_4:17; 2Ti_2:10; Heb_9:15; 1Jo_2:25", "note": "", "refs": [{"l": "2Co 4:17", "n": "", "vs": [[17, "ذلك لأن ما يضايقنا الآن من صعوبات بسيطة عابرة، ينتج لنا بمقدار لا يحد وزنة أبدية من المجد،"]]}, {"l": "2Ti 2:10", "n": "", "vs": [[10, "لهذا السبب أحتمل كل شيء بصبر لأجل الذين اختارهم الله ، لكي يحصلوا، هم أيضا، على الخلاص الذي في المسيح يسوع مع المجد الأبدي."]]}, {"l": "Heb 9:15", "n": "", "vs": [[15, "ولذلك، ups": [{"kw": "", "raw": "1Pe_4:11; Rev_1:6, Rev_5:13", "note": "", "refs": [{"l": "1Pe 4:11", "n": "", "vs": [[11, "فمن يتكلم، عليه أن يتكلم بما يوافق أقوال الله؛ ومن يخدم، عليه أن يخدم بموجب القوة التي يمنحها الله . وذلك لكي يتمجد الله في كل شيء، بيسوع المسيح، له المجد والسلطة إلى أبد الآبدين. آمين!"]]}, {"l": "Rev 1:6", "n": "", "vs": [[6, "وجعل منا مملكة، وكهنة لله أبيه، له المجد والسلطان إلى أبد الآبدين. آمين!"]]}, {"l": "Rev 5:13", "n": "", "vs": [[13, "ثم سمعت كل خليقة في السماء وعلى الأرض، وتحت الأرض، وعلى البحر، هاتفة مع كل ما فيها: «البركة والإجلال والمجد والسلطة للجالس على العرش وللحمل، إلى أبد الآبدين»."]]}], "kwAr": "", "noteAr": ""}], "arS": [["له ", []], ["المجد", ["G1391"]], [" ", []], ["والسلطة", ["G2904"]], [" إلى ", []], ["أبد الآبدين", ["G1519", "G165", "G165"]], [". ", []], ["آمين", ["G281"]], ["!", []]]}, {"c": 5, "v": 12, "text": "إني مرسل إليكم هذه الرسالة القصيرة بيد سلوانس الأخ الأمين. وغايتي أن أحرضكم وأشهد لكم أن النعمة التي تتمتعون بها هي نعمة الله الحقيقية التي أنتم فيها ثابتون.", "groups": [{"kw": "Silvanus", "raw": "2Co_1:19; 1Th_1:1; 2Th_1:1", "note": "", "refs": [{"l": "2Co 1:19", "n": "", "vs": [[19, "فإن ابن الله، المسيح يسوع، الذي بشرنا به فيما بينكم، أنا وسلوانس وتيموثاوس، لم يكن نعم ولا معا، وإنما فيه نعم."]]}, {"l": "1Th 1:1", "n": "", "vs": [[1, "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."]]}, {"l": "2Th 1:1", "n": "", "vs": [[1, "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."]]}], "kwAr": "سلوانس", "noteAr": ""}, {"kw": "a faithful", "raw": "Eph_6:21; Col_1:7, Col_4:7, Col_4:9", "note": "", "refs": [{"l": "Eph 6:21", "n": "", "vs": [[21, "ولكي تعرفوا أحوالي وأخبار عملي، فإن تيخيكس، الأخ الحبيب والخادم الأمين في الرب، يخبركم بها جميعا."]]}, {"l": "Col 1:7", "n": "", "vs": [[7, "على حسب ما تعلمتم من أبفراس شريكنا العبد الحبيب، والخادم الأمين للمسيح عندكم"]]}, {"l": "Col 4:7", "n": "", "vs": [[7, "أما أحوالي كلها، فسيخبركم بها تيخيكس، الأخ الحبيب والخادم الأمين ورفيقنا العبد في الرب،"]]}, {"l": "Col 4:9", "n": "", "vs": [[9, "يرافقه أونسيموس، الأخ الأمين الحبيب الذي هو من عندكم. فهما يطلعانكم على أحوالنا هنا."]]}], "kwAr": "الأخ الأمين", "noteAr": ""}, {"kw": "I have", "raw": "Eph_3:3; Heb_13:22", "note": "", "refs": [{"l": "Eph 3:3", "n": "", "vs": [[3, "كيف كشف لي السر عن طريق الوحي، كما كتبت قبلا بإيجاز،"]]}, {"l": "Heb 13:22", "n": "", "vs": [[22, "إنما أسألكم، أيها الإخوة، أن تحتملوا ما وجهته إليكم من كلام الوعظ في هذه الرسالة، وهو قليل!"]]}], "kwAr": "مرسل إليكم هذه الرسالة", "noteAr": ""}, {"kw": "exhorting", "raw": "Heb_13:22; Jud_1:3", "note": "", "refs": [{"l": "Heb 13:22", "n": "", "vs": [[22, "إنما أسألكم، أيها الإخوة، أن تحتملوا ما وجهته إليكم من كلام الوعظ في هذه الرسالة، وهو قليل!"]]}, {"l": "Jud 1:3", "n": "", "vs": [[3, "أيها الأحباء، كنت قد نويت أن أكتب إليكم في موضوع الخلاص الذي نشترك فيه جميعا. ولكن، أراني الآن مضطرا لأن أكتب لأشجعكم على الجهاد في سبيل الإيمان الذي سلم مرة واحدة للقديسين."]]}], "kwAr": "أحرضكم", "noteAr": ""}, {"kw": "testifying", "raw": "Joh_21:21; Act_20:24; 1Jo_5:9, 1Jo_5:10; 3Jo_1:12", "note": "", "refs": [{"l": "Joh 21:21", "n": "", "vs": [[21, "فلما رآه بطرس سأل يسوع: «يارب وهذا، ماذا يكون له؟»"]]}, {"l": "Act 20:24", "n": "", "vs": [[24, "ولكني لا أحسب لحياتي أية قيمة، ما دمت أسعى إلى بلوغ غايتي وإتمام الخدمة التي كلفني إياها الرب يسوع: أن أشهد ببشارة نعمة الله."]]}, {"l": "1Jo 5:9", "n": "", "vs": [[9, "إن كنا نصدق الشهادة التي يقدمها الناس، فالشهادة التي يقدمها الله أعظم، لأنها شهادة إلهية شهد الله بها لابنه."]]}, {"l": "1Jo 5:10", "n": "", "vs": [[10, "فمن يؤمن بابن الله، يثق في قلبه بصحة هذه الشهادة. أما من لا يصدق الله ، إذ يرفض تصديق الشهادة التي شهد بها لابنه، فهو يتهم الله بالكذب."]]}, {"l": "3Jo 1:12", "n": "", "vs": [[12, "أما ديمتريوس، فالجميع يشهدون له شهادة طيبة. حتى الحق نفسه يشهد له. ونحن أيضا نشهد له. وأنتم تثقون بصدق ما نشهد به."]]}], "kwAr": "أشهد لكم", "noteAr": ""}, {"kw"
