kw": "against", "raw": "Gr. upon", "note": "Gr. upon", "refs": [], "kwAr": "ضد الذين يعملون الشر", "noteAr": "في اليونانية: على."}], "arS": [["لأن ", []], ["الرب", ["G2962"]], [" يرعى ", []], ["الأبرار", ["G1342"]], [" بعنايته، ويستجيب إلى ", []], ["دعائهم", ["G1162"]], [". ولكنه يقف ضد الذين ", []], ["يعملون", ["G4160"]], [" ", []], ["الشر", ["G2556"]], ["…", []]]}, {"c": 3, "v": 13, "text": "من يؤذيكم إن كنتم متحمسين للخير؟", "groups": [{"kw": "who", "raw": "Pro_16:7; Rom_8:28, Rom_13:3", "note": "", "refs": [{"l": "Pro 16:7", "n": "", "vs": [[7, "إذا رضي الرب عن تصرفات الإنسان، جعل أعداءه أيضا يسالمونه."]]}, {"l": "Rom 8:28", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."]]}, {"l": "Rom 13:3", "n": "", "vs": [[3, "فإن الحكام لا يخافهم من يفعل الصلاح بل من يفعل الشر. أفترغب إذن في أن تكون غير خائف من السلطة؟ اعمل ما هو صالح، فتكون ممدوحا عندها،"]]}], "kwAr": "من يؤذيكم", "noteAr": ""}, {"kw": "followers", "raw": "Psa_38:20; Pro_15:9; 1Co_14:1; Eph_5:1; 1Th_5:15; 1Ti_5:10; 3Jo_1:11", "note": "", "refs": [{"l": "Psa 38:20", "n": "", "vs": [[20, "والذين يجازون الخير بالشر يقاومونني لأني أتبع الصلاح."]]}, {"l": "Pro 15:9", "n": "", "vs": [[9, "سلوك الشرير رجس لدى الرب، ومحبته لمن يتبع البر."]]}, {"l": "1Co 14:1", "n": "", "vs": [[1, "اسعوا وراء المحبة، وتشوقوا إلى المواهب الروحية، بل بالأحرى موهبة التنبوء."]]}, {"l": "Eph 5:1", "n": "", "vs": [[1, "فاقتدوا إذن بالله كأولاد أحباء،"]]}, {"l": "1Th 5:15", "n": "", "vs": [[15, "حذار أن يبادل أحدكم شر غيره بشر مثله بل اسعوا دائما إلى الخير في معاملتكم بعضكم لبعض وللآخرين جميعا."]]}, {"l": "1Ti 5:10", "n": "", "vs": [[10, "ويكون مشهودا لها بالأعمال الصالحة، كأن تكون قد ربت الأولاد، وأضافت الغرباء، وغسلت أقدام القديسين، وأسعفت المتضايقين، ومارست كل عمل صالح!"]]}, {"l": "3Jo 1:11", "n": "", "vs": [[11, "أيها الحبيب، لا تقتد بما هو شر، بل بما هو خير. فإن من يفعل الخير، يكون من الله. ومن يفعل الشر، يبين أنه لم يتعرف بالله قط."]]}], "kwAr": "متحمسين للخير", "noteAr": ""}], "arS": [["من ", []], ["يؤذيكم", ["G2559"]], [" إن كنتم ", []], ["متحمسين", ["G3402"]], [" ", []], ["للخير", ["G18"]], ["؟", []]]}, {"c": 3, "v": 14, "text": "وإن كان لابد أن تتألموا في سبيل البر، فطوبى لكم! لا تخافوا من تهديد الذين يضطهدونكم، ولا تقلقوا.", "groups": [{"kw": "if", "raw": "1Pe_2:19, 1Pe_2:20, 1Pe_4:13-16; Jer_15:15; Mat_5:10-12, Mat_10:18-22, Mat_10:39, Mat_16:25, Mat_19:29; Mar_8:35, Mar_10:29; Luk_6:22, Luk_6:23; Act_9:16; 2Co_12:10; Phi_1:29; Jam_1:12", "note": "", "refs": [{"l": "1Pe 2:19", "n": "", "vs": [[19, "فما أجمل أن يتحمل الإنسان الأحزان حين يتألم مظلوما، بدافع من ضميره الخاضع لله!"]]}, {"l": "1Pe 2:20", "n": "", "vs": [[20, "فبالحقيقة، أي مجد لكم إن كنتم تصبرون وأنتم تتحملون قصاص أخطائكم؟ لا فضل لكم عند الله إلا إذا تحملتم الآلام صابرين، وأنتم تفعلون الصواب."]]}, {"l": "1Pe 4:13-16", "n": "", "vs": [[13, "وإنما افرحوا: لأنكم كما تشاركون المسيح في الآلام الآن، لابد أن تفرحوا بمشاركته في الابتهاج عند ظهور مجده."], [14, "فإذا لحقتكم الإهانة لأنكم تحملون اسم المسيح، فطوبى لكم! لأن روح المجد، أي روح الله، يستقر عليكم."], [15, "لا يكن بينكم من يتأ لم عقابا على شر ارتكبه: كالقتل أو السرقة، أو غيرهما من الجرائم، أو التدخل في شؤون الآخرين."], [16, "ولكن إن تألم أحدكم لأنه «مسيحي»، فعليه ألا يخجل، بل أن يمجد الله لأجل هذا الاسم!"]]}, {"l": "Jer 15:15", "n": "", "vs": [[15, "يارب، أنت عرفت. اذكرني وارعني وانتقم لي من مضطهدي. لا تتمهل طويلا في الانتقام لي، فأنت تعلم أني من أجلك احتملت التعيير."]]}, {"l": "Mat 5:10-12", "n": "", "vs": [[10, "طوبى للمضطهدين من أجل البر، فإن لهم ملكوت السماوات."], [11, "طوبى لكم متى أهانكم الناس واضطهدوكم، وقالوا فيكم من أجلي كل سوء كاذبين."], [12, "افرحوا وتهللوا، فإن مكافأتكم في السماوات عظيمة. فإنهم هكذا اضطهدوا الأنبياء من قبلكم!"]]}, {"l": "Mat 10:18-22", "n": "", "vs": [[18, "وتساقون للمثول أمام الحكام والملوك من أجلي: فيكون ذلك شهادة لي لدى اليهود والأمم على السواء."], [19, "فحين يسلمونكم، لا تهتموا كيف تتكلمون أو ماذا تقولون. فإنكم في تلك الساعة تلهمون ما تقولون."], [20, "فلستم أنتم المتكلمين، بل روح أبيكم هو الذي يتكلم فيكم."], [21, "وسوف يسلم الأخ أخاه إلى الموت، والأب ولده. ويتمرد الأولاد على والديهم، ويقتلونهم!"], [22, "وتكونون مكروهين لدى الجميع من أجل اسمي. ولكن من يثبت إلى النهاية، هو الذي يخلص."]]}, {"l": "Mat 10:39", "n": "", "vs": [[39, "من يتمسك بحياته، يخسرها؛ ومن يخسر حياته من أجلي، فإنه يربحها."]]}, {"l": "Mat 16:25", "n": "", "vs": [[25, "فأي من أراد أن يخلص نفسه، يخسرها؛ ولكن من يخسر نفسه لأجلي، فإنه يجدها."]]}, {"l": "Mat 19:29", "n": "", "vs": [[29, "فأي من ترك بيوتا أو إخوة أو أخوات أو أبا أو أما أو أولادا أو أراضي من أجل اسمي، ينال مئة ضعف ويرث الحياة الأبدية."]]}, {"l": "Mar 8:35", "n": "", "vs": [[35, "فأي من أراد أن يخلص نفسه، يخسرها. ولكن من يخسر نفسه من أجلي ومن أجل الإنجيل، فهو يخلصها."]]}, {"l": "Mar 10:29", "n": "", "vs": [[29, "فأجاب يسوع: «الحق أقول لكم: ما من أحد ترك لأجلي ولأجل الإنجيل بيتا أو إخوة أو أخوات أو أما أو أبا أو أولادا أو حقولا،"]]}, {"l": "Luk 6:22", "n": "", "vs": [[22, "طوبى لكم متى أبغضكم الناس، وعزلوكم، وأهانوا اسمكم ونبذوه كأنه شرير، من أجل ابن الإنسان."]]}, {"l": "Luk 6:23", "n": "", "vs": [[23, "افرحوا في ذلك اليوم وتهللوا، فها إن مكافأتكم في السماء عظيمة: لأنه هكذا عامل آباؤهم الأنبياء."]]}, {"l": "Act 9:16", "n": "", "vs": [[16, "وسأريه كم ينبغي أن يتألم من أجل اسمي!»"]]}, {"l": "2Co 12:10", "n": "", "vs": [[10, "فلأجل المسيح، تسرني الضعفات والإهانات والضيقات والاضطهادات والصعوبات، لأني حينما أكون ضعيفا، فحينئذ أكون قويا!"]]}, {"l": "Phi 1:29", "n": "", "vs": [[29, "فقد وهب لكم، لأجل المسيح، لا أن تؤمنوا به وحسب، بل أيضا أن تتألموا لأجله،"]]}, {"l": "Jam 1:12", "n": "", "vs": [[12, "طوبى لمن يتحمل المحنة بصبر. فإنه، بعد أن يجتاز الامتحان بنجاح، سينال «إكليل الحياة» الذي وعد به الرب محبيه!"]]}], "kwAr": "إن كان لابد أن تتألموا", "noteAr": ""}, {"kw": "and be", "raw": "Isa_8:12, Isa_8:13, Isa_41:10-14, Isa_51:12; Jer_1:8; Eze_3:9; Mat_10:28, Mat_10:31; Luk_12:4, Luk_12:5; Joh_14:1, Joh_14:27; Act_18:9, Act_18:10", "note": "", "refs": [{"l": "Isa 8:12", "n": "", "vs": [[12, "«لا تقل إنها مؤامرة لكل ما يدعي هذا الشعب أنه مؤامرة. لا تخش ما يخشون ولا تخف."]]}, {"l": "Isa 8:13", "n": "", "vs": [[13, "قدسوا الرب القدير لأنه هو خوفكم ورهبتكم،"]]}, {"l": "Isa 41:10-14", "n": "", "vs": [[10, "لا تخف لأني معك. لا تتلفت حولك جزعا، لأني إلهك، أشددك وأعينك وأعضدك بيمين بري"], [11, "يعتري الخزي والعار كل من يغتاظ منك، ويتلاشى مقاوموك كالعدم."], [12, "تبحث عن خصومك فلا تجد أحدا منهم، ويصبح محاربوك كلا شيء،"], [13, "لأني أنا الرب إلهك الذي يمسك بيمينك قائلا لك: لا تخف. سأعينك."], [14, "لا تخف يايعقوب الضعيف كالحشرة، وياإسرائيل العليل كالشرذمة، لأني سأعينك، يقول الرب فاديك قدوس إسرائيل."]]}, {"l": "Isa 51:12", "n": "", "vs": [[12, "أنا، أنا هو معزيكم، فمن أنت حتى تخشي إنسانا فانيا أو بشرا يبيدون كالعشب؟"]]}, {"l": "Jer 1:8", "n": "", "vs": [[8, "لا تخف من حضرتهم لأني أنا معك لأنقذك»."]]}, {"l": "Eze 3:9", "n": "", "vs": [[9, "قد جعلت جبهتك في صلابة الماس، أقسى من الصوان، فلا تخف منهم ولا ترتعب من مرآهم لأنهم شعب متمرد»."]]}, {"l": "Mat 10:28", "n": "", "vs": [[28, "لا تخافوا الذين يقتلون الجسد، ولكنهم يعجزون عن قتل النفس، بل بالأحرى خافوا القادر أن يهلك النفس والجسد جميعا في جهنم."]]}, {"l": "Mat 10:31", "n": "", "vs": [[31, "فلا تخافوا إذن! أنتم أعز من عصافير كثيرة."]]}, {"l": "Luk 12:4", "n": "", "vs": [[4, "على أني أقول لكم ياأحبائي: لا تخافوا من الذين يقتلون الجسد ثم لا يستطيعون أن يفعلوا أكثر من ذلك."]]}, {"l": "Luk 12:5", "n": "", "vs": [[5, "ولكني أريكم ممن تخافون: خافوا من القادر أن يلقي في جهنم بعد القتل. نعم، أقول لكم، من هذا خافوا!"]]}, {"l": "Joh 14:1", "n": "", "vs": [[1, "«لا تضطرب قلوبكم. أنتم تؤمنون بالله، فآمنوا بي أيضا."]]}, {"l": "Joh 14:27", "n": "", "vs": [[27, "سلاما أترك لكم. سلامي أعطيكم. ليس كما يعطي العالم أعطيكم أنا. فلا تضطرب قلوبكم، ولا ترتعب."]]}, {"l": "Act 18:9", "n": "", "vs": [[9, "وذات ليلة رأى بولس الرب في رؤيا يقول له: «لا تخف، بل تكلم ولا تسكت،"]]}, {"l": "Act 18:10", "n": "", "vs": [[10, "فأنا معك، ولن يقدر أحد أن يؤذيك، لأن لي شعبا كثيرا في هذه المدينة»."]]}], "kwAr": "لا تخافوا", "noteAr": ""}], "arS": [["وإن كان لابد أن ", []], ["تتألموا", ["G3958"]], [" في سبيل ", []], ["البر", ["G1343"]], ["، ", []], ["فطوبى", ["G3107"]], [" لكم! لا ", []], ["تخافوا", ["G5399"]], [" من ", []], ["تهديد", ["G5401"]], [" الذين يضطهدونكم، ولا ", []], ["تقلقوا", ["G5015"]], [".", []]]}, {"c": 3, "v": 15, "text": "وإنما كرسوا المسيح ربا في قلوبكم. وكونوا دائما مستعدين لأن تقدموا جوابا مقنعا لكل من يسألكم عن سبب الرجاء الذي في داخلكم", "groups": [{"kw": "sanctify", "raw": "Num_20:12, Num_27:14; Isa_5:16, Isa_29:23", "note": "", "refs": [{"l": "Num 20:12", "n": "", "vs": [[12, "فقال الرب لموسى وهرون: «من حيث أنكما لم تؤمنا بي حتى تقدساني على مرأى من بني إسرائيل فإنكما لن تدخلا هذا الشعب الأرض التي وهبتها لهم»."]]}, {"l": "Num 27:14", "n": "", "vs": [[14, "لأنكما في صحراء صين عصيتما قولي، حين تمرد الشعب، ولم تقدساني أمام أعينهم، إذ لم تأمرا الماء بالتفجر من الصخرة». ذلك ماء مريبة عند قادش في صحراء صين"]]}, {"l": "Isa 5:16", "n": "", "vs": [[16, "ولكن الرب القدير يمجد بالعدل، ويبدي الرب القدوس قداسته بالبر."]]}, {"l": "Isa 29:23", "n": "", "vs": [[23, "لأنهم عندما يرون أبناءهم يتزايدون بفضلي، فإنهم يقدسون اسمي، ويقدسون قدوس يعقوب، ويرهبون إله إسرائيل،"]]}], "kwAr": "كرسوا المسيح ربا", "noteAr": ""}, {"kw": "and be", "raw": "Psa_119:46; Jer_26:12-16; Dan_3:16-18; Amo_7:14-17; Mat_10:18-20; Luk_21:14, Luk_21:15; Act_4:8-12, Act_5:29-31, Act_21:39, Act_21:40, Act_22:1, Act_22:2-5; Col_4:6; 2Ti_2:25", "note": "", "refs": [{"l": "Psa 119:46", "n": "", "vs": [[46, "سأتحدث بشهاداتك أمام الملوك ولا يعتريني الخزي،"]]}, {"l": "Jer 26:12-16", "n": "", "vs": [[12, "فقال إرميا لجميع الرؤساء وكل الشعب: «الرب قد بعثني لأتنبأ على هذا الهيكل وعلى هذه المدينة بكل القضاء الذي سمعتموه."], [13, "فالآن قوموا طرقكم وأعمالكم، وأطيعوا صوت الرب إلهكم، فيمتنع عن الشر الذي قضى به عليكم."], [14, "أما أنا فإني في أيديكم. اصنعوا بي ما يحلو لكم."], [15, "ولكن تيقنوا أنكم إن قتلتموني فإنكم تجلبون دما بريئا على أنفسكم وعلى هذه المدينة وعلى أهلها، لأن الرب قد بعثني حقا لأعلن قضاءه في مسامعكم»."], [16, "عندئذ قال الرؤساء وكل الشعب للكهنة والأنبياء: «هذا الرجل لا يستحق حكم الموت لأنه خاطبنا باسم الرب إلهنا»."]]}, {"l": "Dan 3:16-18", "n": "", "vs": [[16, "فأجابه شدرخ وميشخ وعبدنغو: «لا داعي لأن نجيبك عن هذا الشأن"], [17, "لأن إلهنا الذي نعبده قادر أن ينجينا من أتون النار المتقدة، وأن ينقذنا من يدك أيها الملك."], [18, "وحتى إن لم ينقذنا، فاعلم يقينا أيها الملك أننا لا نعبد آلهتك، ولا نسجد لتمثال الذهب الذي نصبته»."]]}, {"l": "Amo 7:14-17", "n": "", "vs": [[14, "فأجاب عاموس: «أنا لم أكن نبيا ولا ابن نبي، إنما أنا راعي غنم وجاني جميز،"], [15, "فاصطفاني الرب من وراء الغنم وأمرني قائلا: اذهب تنبأ لشعبي إسرائيل."], [16, "لذلك اسمع الآن كلمة الرب: أنت تقول لا تتنبأ ضد إسرائيل ولا تهاجم بيت إسحاق."], [17, "لهذا يقول الرب: ستصبح امرأتك عاهرة في المدينة، ويقتل أبناؤك وبناتك بالسيف، وتقسم أرضك بالحبل. أما أنت فتموت في أرض الأمم الوثنية، ويسبى إسرائيل إلى أرض بعيدة عن دياره»."]]}, {"l": "Mat 10:18-20", "n": "", "vs": [[18, "وتساقون للمثول أمام الحكام والملوك من أجلي: فيكون ذلك شهادة لي لدى اليهود والأمم على السواء."], [19, "فحين يسلمونكم، لا تهتموا كيف تتكلمون أو ماذا تقولون. فإنكم في تلك الساعة تلهمون ما تقولون."], [20, "فلستم أنتم المتكلمين، بل روح أبيكم هو الذي يتكلم فيكم."]]}, {"l": "Luk 21:14", "n": "", "vs": [[14, "فضعوا في قلوبكم ألا تعدوا دفاعكم مسبقا،"]]}, {"l": "Luk 21:15", "n": "", "vs": [[15, "لأني سوف أعطيكم كلاما وحكمة لا يقدر جميع مقاوميكم أن يردوها أو يناقضوها."]]}, {"l": "Act 4:8-12", "n": "", "vs": [[8, "فامتلأ بطرس من الروح القدس وأجابهم: «يارؤساء الشعب وياشيوخه،"], [9, "إن كنتم تستجوبوننا اليوم بسبب الإحسان إلى إنسان مريض لتعرفوا كيف شفي،"], [10, "فاعلموا جميعا، وليعرف شعب إسرائيل كله، أنه باسم يسوع المسيح الناصري الذي صلبتموه أنتم، والذي أقامه الله من بين الأموات، باسمه يقف هذا الكسيح أمامكم في تمام الصحة!"], [11, "يسوع هذا هو الحجر الذي رفضتموه أيها البناة، وهو نفسه صار حجر الزاوية الأساسي،"], [12, "وليس بأحد غيره الخلاص، إذ ليس تحت السماء اسم آخر قدمه الله للبشر به يجب أن نخلص!»"]]}, {"l": "Act 5:29-31", "n": "", "vs": [[29, "فأجاب بطرس والرسل: «ينبغي أن يطاع الله لا الناس!"], [30, "إن إله آبائنا أقام يسوع، الذي قتلتموه أنتم معلقين إياه على الخشبة!"], [31, "ولكن الله رفعه إلى يمينه وجعله رئيسا ومخلصا ليمنح إسرائيل التوبة وغفران الخطايا؛"]]}, {"l": "Act 21:39", "n": "", "vs": [[39, "فقال بولس: «إنما أنا يهودي من طرسوس، وهي مدينة مشهورة في مقاطعة كيليكية. فأرجو منك أن تسمح لي بأن أكلم الشعب»."]]}, {"l": "Act 21:40", "n": "", "vs": [[40, "فأذن له القائد. ووقف بولس على الدرج، وأشار بيده إلى الشعب. فلما ساد السكوت، أخذ يخاطبهم باللغة العبرية، قائلا:"]]}, {"l": "Act 22:1", "n": "", "vs": [[1, "»أيها الإخوة والآباء، اسمعوا الآن دفاعي عن نفسي»."]]}, {"l": "Act 22:2-5", "n": "", "vs": [[2, "فلما سمعوه يخاطبهم باللغة العبرية ازدادوا هدوءا فقال:"], [3, "»أنا رجل يهودي، ولدت في طرسوس الواقعة في مقاطعة كيليكية، ولكني نشأت في هذه المدينة وتعلمت عند قدمي غمالائيل التربية الموافقة تماما لشريعة آبائنا. وكنت غيورا في أمور الله، مثلكم جميعا اليوم."], [4, "فاضطهدت هذا الطريق حتى الموت، فكنت أعتقل أتباعه من الرجال والنساء، وأزج بهم في السجون."], [5, "ويشهد رئيس الكهنة ومجلس الشيوخ على صدق كلامي هذا. فقد أخذت منهم رسائل إلى إخوانهم في دمشق ليعاونوني في القبض على الذين هناك، لأسوقهم إلى أورشليم فينالوا عقابهم."]]}, {"l": "Col 4:6", "n": "", "vs": [[6, "ليكن كلامكم دائما مصحوبا بالنعمة، وليكن مصلحا بملح، فتعرفوا كيف يجب أن تجيبوا كل واحد."]]}, {"l": "2Ti 2:25", "n": "", "vs": [[25, "ويؤدب بالوداعة مقاومي الإيمان، عسى أن يمنحهم الله التوبة، فيعرفوا الحق بالتمام،"]]}], "kwAr": "مستعدين", "noteAr": ""}, {"kw": "a reason", "raw": "1Sa_12:7; Isa_1:18, Isa_41:21; Act_24:25", "note": "", "refs": [{"l": "1Sa 12:7", "n": "", "vs": [[7, "والآن امثلوا أمام الرب لأذكركم بجميع معاملاته التي أجراها معكم ومع آبائكم:"]]}, {"l": "Isa 1:18", "n": "", "vs": [[18, "تعالوا نتحاجج يقول الرب، إن كانت خطاياكم كلطخات قرمزية فإنها تبيض كالثلج، وإن كانت حمراء كصبغ الدودي تصبح في نقاء الصوف!"]]}, {"l": "Isa 41:21", "n": "", "vs": [[21, "اعرضوا دعواكم يقول الرب، وقدموا حججكم يقول ملك إسرائيل."]]}, {"l": "Act 24:25", "n": "", "vs": [[25, "ولما تحدث بولس عن البر وضبط النفس والدينونة الآتية ارتعب فيلكس، وقال لبولس: «اذهب الآن، ومتى توفر لي الوقت أستدعيك ثانية»."]]}], "kwAr": "سبب", "noteAr": ""}, {"kw": "the hope", "raw": "1Pe_1:3, 1Pe_1:4; Col_1:5, Col_1:23, Col_1:27; Tit_1:2; Heb_3:6, Heb_6:1, Heb_6:18, Heb_6:19", "note": "", "refs": [{"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}, {"l": "1Pe 1:4", "n": "", "vs": [[4, "وإرثا لا يفنى ولا يفسد ولا يزول،"]]}, {"l": "Col 1:5", "n": "", "vs": [[5, "بسبب الرجاء المحفوظ لكم في السماوات، الرجاء الذي سمعتم به سابقا في كلمة الحق التي في الإنجيل"]]}, {"l": "Col 1:23", "n": "", "vs": [[23, "على أن تثبتوا فعلا في الإيمان، مؤسسين وراسخين وغير متحولين عن رجاء الإنجيل الذي سمعتموه والذي بشر به للخليقة كلها تحت السماء، وله صرت أنا بولس خادما."]]}, {"l": "Col 1:27", "n": "", "vs": [[27, "الذين أراد الله أن يعلن لهم كم هو غني مجد هذا السر بين الأمم: إنه المسيح فيكم، وهو رجاء المجد؛"]]}, {"l": "Tit 1:2", "n": "", "vs": [[2, "في رجاء الحياة الأبدية، التي وعد بها الله المنزه عن الكذب، من قبل أزمنة الأزل،"]]}, {"l": "Heb 3:6", "n": "", "vs": [[6, "أما المسيح، فهو أمين بصفته ابنا يترَأس على البيت. وهذا البيت هو نحن المؤمنين، على أن نتمسك بالثقة والافتخار برجائنا تمسكا ثابتا حتى النهاية."]]}, {"l": "Heb 6:1", "n": "", "vs": [[1, "لذلك، فلنترك تلك المباديء الأولية عن المسيح، ونتقدم إلى النضوج الكامل. ولا نضع من جديد تلك الأسس التي تعلمناها سابقا، وهي: التوبة من الأعمال المميتة، والإيمان بالله،"]]}, {"l": "Heb 6:18", "n": "", "vs": [[18, "فاستنادا إلى وعد الله وقسمه، وهما أمران ثابتان لا يتغيران ويستحيل أن يكذب الله فيهما، نحصل على تشجيع قوي، بعدما التجأنا إلى التمسك بالرجاء الموضوع أمامنا."]]}, {"l": "Heb 6:19", "n": "", "vs": [[19, "هذا الرجاء هو لنا بمثابة مرساة أمينة ثابتة تشد نفوسنا إلى ما وراء الحجاب السماوي."]]}], "kwAr": "الرجاء الذي في داخلكم", "noteAr": ""}, {"kw": "with", "raw": "1Pe_3:2, 1Pe_3:4; 2Ti_2:25, 2Ti_2:26", "note": "", "refs": [{"l": "1Pe 3:2", "n": "", "vs": [[2, "وذلك حين يلاحظ سلوكها الطاهر ووقارها."]]}, {"l": "1Pe 3:4", "n": "", "vs": [[4, "وإنما لتعتمد الزينة الداخلية، ليكون قلبها متزينا بروح الوداعة والهدوء. هذه هي الزينة التي لا تفنى، وهي غالية الثمن في نظر الله!"]]}, {"l": "2Ti 2:25", "n": "", "vs": [[25, "ويؤدب بالوداعة مقاومي الإيمان، عسى أن يمنحهم الله التوبة، فيعرفوا الحق بالتمام،"]]}, {"l": "2Ti 2:26", "n": "", "vs": [[26, "فيعودوا إلى الصواب ناجين من فخ إبليس الذي أطبق عليهم، ليعملوا إرادته."]]}], "kwAr": "بوداعة", "noteAr": ""}, {"kw": "fear", "raw": "or, reverence", "note": "or, reverence", "refs": [], "kwAr": "واحترام", "noteAr": "أو: وقار."}], "arS": [["وإنما ", []], ["كرسوا", ["G37"]], [" ", []], ["المسيح", ["G2962"]], [" ربا في ", []], ["قلوبكم", ["G2588"]], [". وكونوا ", []], ["دائما", ["G104"]], [" ", []], ["مستعدين", ["G2092"]], [" لأن تقدموا ", []], ["جوابا", ["G627"]], [" مقنعا ", []], ["لكل", ["G3956"]], [" من ", []], ["يسألكم", ["G154"]], [" عن ", []], ["سبب", ["G3056"]], [" ", []], ["الرجاء", ["G1680"]], [" الذي في داخلكم", []]]}, {"c": 3, "v": 16, "text": "على أن تفعلوا ذلك بوداعة واحترام، محافظين على طهارة ضمائركم، سالكين في المسيح سلوكا صالحا، وعندئذ يخيب الذين يوجهون إليكم التهم الكاذبة ويشتمونكم كأنكم تفعلون شرا.", "groups": [{"kw": "a good", "raw": "1Pe_3:21, 1Pe_2:19; Act_24:16; Rom_9:1; 2Co_1:12, 2Co_4:2; 1Ti_1:5, 1Ti_1:19; 2Ti_1:3; Heb_9:14, Heb_13:18", "note": "", "refs": [{"l": "1Pe 3:21", "n": "", "vs": [[21, "وعملية النجاة هذه مصورة في المعمودية التي لا نقصد بها أن نغتسل من أوساخ أجسامنا، بل هي تعهد ضمير صالح أمام الله بفضل قيامة يسوع المسيح،"]]}, {"l": "1Pe 2:19", "n": "", "vs": [[19, "فما أجمل أن يتحمل الإنسان الأحزان حين يتألم مظلوما، بدافع من ضميره الخاضع لله!"]]}, {"l": "Act 24:16", "n": "", "vs": [[16, "لذلك أنا أيضا أدرب نفسي لكي أحيا دائما بضمير نقي أمام الله والناس."]]}, {"l": "Rom 9:1", "n": "", "vs": [[1, "أقول الحق في المسيح، لست أكذب، وضميري شاهد لي في الروح القدس،"]]}, {"l": "2Co 1:12", "n": "", "vs": [[12, "فإن فخرنا هو هذا: شهادة ضميرنا بأننا، في قداسة الله وإخلاصه، قد سلكنا في العالم، وبخاصة تجاهكم؛ ولم يكن ذلك Rom_8:3; 2Co_5:21; Gal_1:4, Gal_3:13; Tit_2:14; Heb_9:26, Heb_9:28", "note": "", "refs": [{"l": "1Pe 2:21-24", "n": "", "vs": [[21, "لأن الله دعاكم إلى الاشتراك في هذا النوع من الآلام. فالمسيح، الذي تألم لأجلكم، هو القدوة التي تقتدون بها. فسيروا على آثار خطواته:"], [22, "إنه لم يفعل خطيئة واحدة، ولا كان في فمه مكر."], [23, "ومع أنه أهين، فلم يكن يرد الإهانة. وإذ تحمل الآلام، لم يكن يهدد بالانتقام، بل أسلم أمره لله الذي يحكم بالعدل."], [24, "وهو نفسه حمل خطايانا في جسده (عندما مات مصلوبا) على الخشبة، لكي نموت بالنسبة للخطايا فنحيا حياة البر. وبجراحه هو تم لكم الشفاء،"]]}, {"l": "1Pe 4:1", "n": "", "vs": [[1, "فبما أن المسيح قد تحمل الآلام الجسمية لأجلكم، سلحوا أنفسكم بالاستعداد دائما لتحمل الآلام. فإن من يتحمل الآلام الجسمية، يكون قد قاطع الخطيئة."]]}, {"l": "Isa 53:4-6", "n": "", "vs": [[4, "لكنه حمل أحزاننا وتحمل أوجاعنا، ونحن حسبنا أن الرب قد عاقبه وأذله،"], [5, "إلا أنه كان مجروحا من أجل آثامنا ومسحوقا من أجل معاصينا، حل به تأديب سلامنا، وبجراحه برئنا."], [6, "كلنا كغنم شردنا ملنا كل واحد إلى سبيله، فأثقل الرب كاهله بإثم جميعنا."]]}, {"l": "Rom 5:6-8", "n": "", "vs": [[6, "فإنه ونحن بعد عاجزون، مات المسيح عن العصاة في الوقت المعين."], [7, "إذ قلما يموت أحد فدى إنسان بار، بل قد يتجرأ أحد أن يموت فدى إنسان صالح."], [8, "ولكن الله أثبت لنا محبته، إذ ونحن مازلنا خاطئين مات المسيح عوضا عنا."]]}, {"l": "Rom 8:3", "n": "", "vs": [[3, "فإن ما عجزت الشريعة عنه، لكون الجسد قد جعلها قاصرة عن تحقيقه، أتمه الله إذ أرسل ابنه، متخذا ما يشبه جسد الخطيئة ومكفرا عن الخطيئة فدان الخطيئة في الجسد"]]}, {"l": "2Co 5:21", "n": "", "vs": [[21, "فإن الذي لم يعرف خطيئة، جعله الله خطيئة لأجلنا، لنصير نحن بر الله فيه."]]}, {"l": "Gal 1:4", "n": "", "vs": [[4, "الذي بذل نفسه من أجل خطايانا لكي ينقذنا من العالم الحاضر الشرير، وفقا لمشيئة إلهنا وأبينا."]]}, {"l": "Gal 3:13", "n": "", "vs": [[13, "إن المسيح حررنا بالفداء من لعنة الشريعة، إذ صار لعنة عوضا عنا، لأنه قد كتب: «ملعون كل من علق على خشبة»،"]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Heb 9:26", "n": "", "vs": [[26, "وإلا لكان يجب أن يموت المسيح متألما مرات كثيرة منذ تأسيس العالم! ولكنه الآن، عند انتهاء الأزمنة، ظهر مرة واحدة ليبطل قوة الخطيئة بتقديم نفسه ذبيحة لله."]]}, {"l": "Heb 9:28", "n": "", "vs": [[28, "كذلك المسيح أيضا: مات مرة واحدة حاملا خطايا كثيرين، مقربا نفسه (لله) عوضا عنهم. ولا بد أن يعود إلى الظهور. لا ليعالج الخطايا، بل ليحقق الخلاص النهائي لجميع منتظريه!"]]}], "kwAr": "المسيح نفسه", "noteAr": ""}, {"kw": "the just", "raw": "Zec_9:9; Mat_27:19, Mat_27:24; Act_3:14, Act_22:14; Jam_5:6; 1Jo_1:9", "note": "", "refs": [{"l": "Zec 9:9", "n": "", "vs": [[9, "»ابتهجي جدا ياابنة صهيون واهتفي ياابنة أورشليم، لأن هوذا ملكك مقبل إليك. هو عادل ظافر، ولكنه وديع راكب على أتان، على جحش ابن أتان."]]}, {"l": "Mat 27:19", "n": "", "vs": [[19, "وفيما هو جالس على منصة القضاء، أرسلت إليه زوجته تقول: «إياك وذلك البار! فقد تضايقت اليوم كثيرا في حلم بسببه»."]]}, {"l": "Mat 27:24", "n": "", "vs": [[24, "فلما رأى بيلاطس أنه لا فائدة، وأن فتنة تكاد تنشب بالأحرى، أخذ ماء وغسل يديه أمام الجمع، وقال: «أنا بريء من دم هذا البار. فانظروا أنتم في الأمر!»"]]}, {"l": "Act 3:14", "n": "", "vs": [[14, "أنتم أنكرتم القدوس البار وطلبتم العفو عن رجل قاتل،"]]}, {"l": "Act 22:14", "n": "", "vs": [[14, "فقال: إله آبائنا اختارك مسبقا لتعرف إرادته، وترى البار وتسمع صوتا من فمه."]]}, {"l": "Jam 5:6", "n": "", "vs": [[6, "والبريء حكمتم عليه وقتلتموه، وهو لا يقاومكم!"]]}, {"l": "1Jo 1:9", "n": "", "vs": [[9, "ولكن، إن اعترفنا لله بخطايانا، فهو جدير بالثقة وعادل، يغفر لنا خطايانا ويطهرنا من كل إثم."]]}], "kwAr": "البار", "noteAr": ""}, {"kw": "that", "raw": "Eph_2:16-18", "note": "", "refs": [{"l": "Eph 2:16-18", "n": "", "vs": [[16, "ولكي يصالحهما معا في جسد واحد مع الله بالصليب الذي به قتل العداء."], [17, "ثم جاء وبشركم بالسلام أنتم البعيدين، (كما بشر بالسلام) أولئك القريبين."], [18, "فبه لنا كلينا اقتراب إلى الآب بروح واحد."]]}], "kwAr": "لكي يقربنا إلى الله", "noteAr": ""}, {"kw": "being", "raw": "1Pe_4:1; Dan_9:26; Rom_4:25; 2Co_1:24, 2Co_13:4; Col_1:21, Col_1:22", "note": "", "refs": [{"l": "1Pe 4:1", "n": "", "vs": [[1, "فبما أن المسيح قد تحمل الآلام الجسمية لأجلكم، سلحوا أنفسكم بالاستعداد دائما لتحمل الآلام. فإن من يتحمل الآلام الجسمية، يكون قد قاطع الخطيئة."]]}, {"l": "Dan 9:26", "n": "", "vs": [[26, "وبعد اثنين وستين أسبوعا يقتل المسيح، ولكن ليس من أجل نفسه، ويدمر شعب رئيس آت المدينة والقدس، وتقبل آخرتها كطوفان، وتستمر الحرب حتى النهاية، ويعم الخراب المقضي به."]]}, {"l": "Rom 4:25", "n": "", "vs": [[25, "الذي أسلم للموت من أجل معاصينا ثم أقيم من أجل تبريرنا."]]}, {"l": "2Co 1:24", "n": "", "vs": [[24, "وهذا لا يعني أننا نتسلط على إيمانكم، بل إننا معاونون لكم نعمل لأجل فرحكم. فبالإيمان أنتم ثابتون."]]}, {"l": "2Co 13:4", "n": "", "vs": [[4, "فمع أنه قد صلب في ضعف، فهو الآن حي بقدرة الله. ونحن أيضا ضعفاء فيه، ولكننا، بتصرفنا معكم، سنكون أحياء معه بقدرة الله."]]}, {"l": "Col 1:21", "n": "", "vs": [[21, "وأنتم، يامن كنتم في الماضي أجانب وأعداء في الفكر، بأعمالكم الشريرة،"]]}, {"l": "Col 1:22", "n": "", "vs": [[22, "قد صالحكم الآن في جسد بشرية (ابنه) بالموت. وذلك لكي يحضركم فتمثلوا أمامه وأنتم قديسون بلا ذنب ولا لوم."]]}], "kwAr": "فمات بجسمه", "noteAr": ""}, {"kw": "but", "raw": "Rom_1:4, Rom_8:11", "note": "", "refs": [{"l": "Rom 1:4", "n": "", "vs": [[4, "ومن ناحية روح القداسة، تبين بقوة أنه ابن الله بالقيامة من بين الأموات. إنه يسوع المسيح ربنا"]]}, {"l": "Rom 8:11", "n": "", "vs": [[11, "وإذا كان روح الذي أقام يسوع من بين الأموات يسكن فيكم، فإن الذي أقام المسيح من بين الأموات سوف يحيي أيضا أجسادكم الفانية بسبب روحه الذي يسكن فيكم."]]}], "kwAr": "عاد حيا بالروح", "noteAr": ""}], "arS": [["فإن ", []], ["المسيح", ["G5547"]], [" نفسه مات ", []], ["مرة واحدة", ["G530"]], [" لكي يحل مشكلة ", []], ["الخطايا", ["G266"]], [". فمع أنه هو ", []], ["البار", ["G1342"]], ["، فقد ", []], ["تألم", ["G3958"]], [" من ", []], ["أجلنا", ["G5228"]], [" نحن ", []], ["المذنبين", ["G94"]], ["، لكي ", []], ["يقربنا", ["G4317"]], [" إلى ", []], ["الله", ["G2316"]], ["، ", []], ["فمات", ["G2289"]], [" ", []], ["بجسمه", ["G4561"]], [" البشري، ثم ", []], ["عاد حيا", ["G2227"]], [" ", []], ["بالروح", ["G4151"]], [".", []]]}, {"c": 3, "v": 19, "text": "بهذا الروح نفسه، ذهب قديما وبشر الناس الذين أصبحت أرواحهم الآن في السجن.", "groups": [{"kw": "By which", "raw": "1Pe_1:11, 1Pe_1:12, 1Pe_4:6; Neh_9:30; Rev_19:10", "note": "", "refs": [{"l": "1Pe 1:11", "n": "", "vs": [[11, "واجتهدوا لمعرفة الزمان والأحوال التي كان يشير إليها روح المسيح الذي كان عاملا فيهم، عندما شهد لهم مسبقا بما ينتظر المسيح من آلام، وبما يأتي بعدها من أمجاد."]]}, {"l": "1Pe 1:12", "n": "", "vs": [[12, "ولكن الله أوحى إليهم أن اجتهادهم لم يكن لمصلحتهم هم، بل لمصلحتكم أنتم. فقد كان ذلك من أجل البشارة التي نقلها إليكم في الزمان الحاضر مبشرون يؤيدهم الروح القدس المرسل من السماء. ويالها من أمور يتمنى حتى الملائكة أن يطلعوا عليها!"]]}, {"l": "1Pe 4:6", "n": "", "vs": [[6, "ولهذا أبلغت البشارة إلى الأموات أيضا لكي يكونوا دائما أحياء بالروح في نظر الله، مع أن حكم الموت قد نفذ بأجسادهم، فماتوا كغيرهم من الناس."]]}, {"l": "Neh 9:30", "n": "", "vs": [[30, "لقد تحملتهم سنين كثيرة، وحذرتهم بروحك على لسان أنبيائك فلم يصغوا، فأسلمتهم لعبودية أمم البلاد."]]}, {"l": "Rev 19:10", "n": "", "vs": [[10, "فجثوت عند قدميه لأسجد له، فقال لي: «لا تفعل! إني عبد لله، مثلك ومثل إخوتك المؤمنين الذين لديهم الشهادة المختصة بيسوع: لله اسجد! فإن الشهادة المختصة بيسوع هي روح النبوءة»."]]}], "kwAr": "بهذا الروح", "noteAr": ""}, {"kw": "in", "raw": "Isa_42:7, Isa_49:9, Isa_61:1; Rev_20:7", "note": "", "refs": [{"l": "Isa 42:7", "n": "", "vs": [[7, "لتفتح عيون العمي، وتطلق سراح المأسورين في السجن، وتحرر الجالسين في ظلمة الحبس."]]}, {"l": "Isa 49:9", "n": "", "vs": [[9, "لتقول للأسرى: اخرجوا، وللذين في الظلمة اظهروا، فيرعون في الطرقات وتصبح الروابي الجرداء مراعي لهم."]]}, {"l": "Isa 61:1", "n": "", "vs": [[1, "روح السيد الرب علي، لأن الرب مسحني لأبشر المساكين، أرسلني لأضمد جراح المنكسري القلوب، لأنادي للمسبيين بالعتق وللمأسورين بالحرية،"]]}, {"l": "Rev 20:7", "n": "", "vs": [[7, "فحين تنقضي الألف سنة، يطلق الشيطان من سجنه،"]]}], "kwAr": "في السجن", "noteAr": ""}], "arS": [["بهذا الروح نفسه، ", []], ["ذهب", ["G4198"]], [" قديما ", []], ["وبشر", ["G2784"]], [" الناس الذين أصبحت ", []], ["أرواحهم", ["G4151"]], [" الآن في ", []], ["السجن", ["G5438"]], [".", []]]}, {"c": 3, "v": 20, "text": "وذلك بعدما رفضوا البشارة في أيام نوح، عندما كان الله يتأنى صابرا طوال المدة التي كان نوح يبني فيها السفينة، التي نجا بها عدد قليل من الناس عبر الماء، ثمانية أشخاص فقط!", "groups": [{"kw": "sometime", "raw": "Gen_6:3, Gen_6:5, Gen_6:13", "note": "", "refs": [{"l": "Gen 6:3", "n": "", "vs": [[3, "فقال الرب: «لن يمكث روحي مجاهدا في الإنسان إلى الأبد. هو بشري زائغ، لذلك لن تطول أيامه أكثر من مئة وعشرين سنة فقط»."]]}, {"l": "Gen 6:5", "n": "", "vs": [[5, "ورأى الرب أن شر الإنسان قد كثر في الأرض، وأن كل تصور فكر قلبه يتسم دائما بالإثم،"]]}, {"l": "Gen 6:13", "n": "", "vs": [[13, "فقال الله لنوح: «قد أزفت نهاية البشر جميعا أمامي، لأنهم ملأوا الأرض ظلما. لذلك سأبيدهم مع الأرض."]]}], "kwAr": "رفضوا", "noteAr": ""}, {"kw": "the longsuffering", "raw": "Isa_30:18; Rom_2:4, Rom_2:5, Rom_9:22; 2Pe_3:15", "note": "", "refs": [{"l": "Isa 30:18", "n": "", "vs": [[18, "ومع ذلك فإن الرب ينتطر حتى يبدي نحوكم عطفه، لهذا يقوم ليرحمكم، لأن الرب هو إله عدل، فطوبى لجميع الذين ينتظرونه."]]}, {"l": "Rom 2:4", "n": "", "vs": [[4, "أم أنك تحتقر غنى لطفه وصبره وطول أناته وأنت لا تعرف أن لطف الله يدفعك إلى التوبة؟"]]}, {"l": "Rom 2:5", "n": "", "vs": [[5, "ولكنك بسبب قساوتك وقلبك غير التائب، تخزن لنفسك غضبا ليوم الغضب، يوم تعلن دينونة الله العادلة."]]}, {"l": "Rom 9:22", "n": "", "vs": [[22, "فماذا إذا إن كان الله ، وقد شاء أن يظهر غضبه ويعلن قدرته، احتمل بكل صبر أوعية غضب جاهزة للهلاك،"]]}, {"l": "2Pe 3:15", "n": "", "vs": [[15, "وتأكدوا أن تأني ربنا في رجوعه، هو فرصة للخلاص."]]}], "kwAr": "يتأنى صابرا", "noteAr": ""}, {"kw": "the days", "raw": "Mat_24:37-39; Luk_17:26-30", "note": "", "refs": [{"l": "Mat 24:37-39", "n": "", "vs": [[37, "وكما كانت الحال في زمن نوح، كذلك ستكون عند رجوع ابن الإنسان:"], [38, "فقد كان الناس في الأيام السابقة للطوفان يأكلون ويشربون ويتزوجون ويزوجون، حتى فاجأهم اليوم الذي دخل فيه نوح السفينة،"], [39, "ونزل الطوفان وهم لاهون فأخذ الجميع. هكذا ستكون الحال عند رجوع ابن الإنسان:"]]}, {"l": "Luk 17:26-30", "n": "", "vs": [[26, "وكما حدث في زمان نوح، هكذا أيضا سوف يحدث في زمان ابن الإنسان:"], [27, "كان الناس يأكلون ويشربون ويتزوجون ويزوجون، إلى اليوم الذي فيه دخل نوح السفينة وجاء الطوفان فأهلك الجميع."], [28, "وكذلك، كما حدث في زمان لوط: كانوا يأكلون ويشربون ويشترون ويبيعون ويغرسون ويبنون،"], [29, "ولكن في اليوم الذي فيه خرج لوط من سدوم، أمطر (الله ) من السماء نارا وكبريتا، فأهلك الجميع"], [30, "هكذا سيحدث في يوم ظهور ابن الإنسان."]]}], "kwAr": "أيام نوح", "noteAr": ""}, {"kw": "while", "raw": "Gen_6:14-22; Heb_11:7", "note": "", "refs": [{"l": "Gen 6:14-22", "n": "", "vs": [[14, "ابن لك فلكا من خشب السرو، واجعل فيه غرفا تطليها بالزفت من الداخل والخارج."], [15, "اصنعه على هذا المثال: ليكن طوله ثلاث مئة ذراع (نحو مئة وخمسة وثلاثين مترا)، وعرضه خمسين ذراعا (نحو اثنين وعشرين مترا ونصف المتر) وارتفاعه ثلاثين ذراعا (نحو ثلاثة عشر مترا ونصف المتر)."], [16, "واجعل له نافذة على انخفاض ذراع (نحو خمسة وأربعين سنتمترا) من السقف، وبابا تقيمه في جانبه. وليكن للفلك طوابق سفلية ومتوسطة وعلوية."], [17, "فها أنا أغرق الأرض بطوفان من المياه لأبيد كل كائن حي فيها ممن تحت السماء. كل ما على الأرض لابد أن يموت."], [18, "ولكني سأقيم معك عهدا، فتدخل أنت مع بنيك وامرأتك ونساء بنيك إلى الفلك."], [19, "وتأخذ معك في الفلك زوجين، ذكرا وأنثى، من كل كائن حي ذي جسد، لاستبقائها معك."], [20, "تدخل معك اثنين من كل صنف من أصناف الطيور والبهائم والزواحف على الأرض، حفاظا على استمرار بقائها."], [21, "وتدخر لنفسك من كل طعام يؤكل وتخزنه عندك ليكون لك ولها غذاء»."], [22, "وفعل نوح تماما بمقتضى كل ما أمر الرب به."]]}, {"l": "Heb 11:7", "n": "", "vs": [[7, "وبالإيمان نوح، لما أنذره الله عن طريق الوحي بالطوفان الآتي، دفعه خوف الله إلى بناء سفينة ضخمة كانت وسيلة النجاة له ولعائلته، مع أنه لم يكن قد رأى طوفانا من قبل. وبعمله هذا، حكم على العالم وأصبح وارثا للبر القائم على أساس الإيمان."]]}], "kwAr": "يبني فيها السفينة", "noteAr": ""}, {"kw": "wherein", "raw": "Gen_7:1-7, Gen_7:13, Gen_7:23, Gen_8:1, Gen_8:18; Mat_7:14; Luk_12:32, Luk_13:24, Luk_13:25; 2Pe_2:5", "note": "", "refs": [{"l": "Gen 7:1-7", "n": "", "vs": [[1, "وقال الرب لنوح: «هيا ادخل أنت وأهل بيتك جميعا إلى الفلك لأني وجدتك وحدك صالحا أمامي في هذا الجيل."], [2, "خذ معك من كل نوع من الحيوانات الطاهرة سبعة ذكور وسبع إناث، وزوجين ذكرا وأنثى من كل نوع من الحيوانات الأخرى غير الطاهرة."], [3, "وخذ معك أيضا من كل نوع من الطيور سبعة ذكور وسبع إناث لاستبقاء نسلها على وجه كل الأرض."], [4, "فإني بعد سبعة أيام أمطر على الأرض أربعين يوما، ليلا ونهارا، فأمحو عن وجه الأرض كل مخلوق حي»."], [5, "وفعل نوح بموجب كل ما أمره الرب به."], [6, "وكان عمر نوح ست مئة سنة عندما حدث طوفان الماء على الأرض."], [7, "فدخل نوح إلى الفلك مع زوجته وأبنائه وزوجاتهم (لينجوا) من مياه الطوفان."]]}, {"l": "Gen 7:13", "n": "", "vs": [[13, "في ذلك اليوم الذي بدأ فيه الطوفان دخل نوح وزوجته وأبناؤه سام وحام ويافث وزوجاتهم الثلاث إلى الفلك."]]}, {"l": "Gen 7:23", "n": "", "vs": [[23, "وباد من على سطح الأرض كل كائن حي سواء من الناس أم البهائم أم الزواحف أم الطيور، كلها أبيدت من الأرض، ولم يبق سوى نوح ومن معه في الفلك."]]}, {"l": "Gen 8:1", "n": "", "vs": [[1, "ثم افتقد الله نوحا وما معه في الفلك من وحوش وبهائم، فأرسل ريحا على الأرض فتقلصت المياه"]]}, {"l": "Gen 8:18", "n": "", "vs": [[18, "وخرج نوح وبنوه وامرأته وزوجات بنيه معه."]]}, {"l": "Mat 7:14", "n": "", "vs": [[14, "ما أضيق الباب وأعسر الطريق المؤدي إلى الحياة! وقليلون هم الذين يهتدون إليه."]]}, {"l": "Luk 12:32", "n": "", "vs": [[32, "لا تخافوا، أيها القطيع الصغير، لأن أباكم قد سر أن يعطيكم الملكوت."]]}, {"l": "Luk 13:24", "n": "", "vs": [[24, "«ابذلوا الجهد للدخول من الباب الضيق، فإني أقول لكم إن كثيرين سيسعون إلى الدخول، فلا يتمكنون."]]}, {"l": "Luk 13:25", "n": "", "vs": [[25, "فمن بعد ما يكون رب البيت قد قام وأغلق الباب، وتبدأون بالوقوف خارجا تقرعون الباب قائلين: يارب افتح لنا! فيجيبكم قائلا: لا أعرف من أين أنتم!"]]}, {"l": "2Pe 2:5", "n": "", "vs": [[5, "كذلك لم يشفق على العالم القديم عندما أحدث الطوفان على عالم الفاجرين، إلا أنه حفظ نوحا المنادي ببر الله وعدله. وكان نوح واحدا من ثمانية أشخاص نجوا من الطوفان."]]}], "kwAr": "عدد قليل", "noteAr": ""}, {"kw": "by", "raw": "Gen_7:17-23; 2Co_2:15, 2Co_2:16; Eph_5:26", "note": "", "refs": [{"l": "Gen 7:17-23", "n": "", "vs": [[17, "ودام الطوفان أربعين يوما على الأرض، وطغت المياه ورفعت الفلك فوق الأرض،"], [18, "وتكاثرت المياه على الأرض وطغت جدا، فكان الفلك يطفو فوق المياه."], [19, "وتعاظمت المياه جدا فوق الأرض حتى أغرقت جميع الجبال العالية التي تحت السماء كلها."], [20, "وبلغ ارتفاعها خمس عشرة ذراعا (نحو سبعة أمتار) عن أعلى الجبال،"], [21, "فمات كل كائن حي يتحرك على الأرض من طيور وبهائم ووحوش وزواحف وكل بشر"], [22, "مات كل ما يحيا ويتنفس على اليابسة."], [23, "وباد من على سطح الأرض كل كائن حي سواء من الناس أم البهائم أم الزواحف أم الطيور، كلها أبيدت من الأرض، ولم يبق سوى نوح ومن معه في الفلك."]]}, {"l": "2Co 2:15", "n": "", "vs": [[15, "فإننا رائحة المسيح الطيبة المرتفعة إلى الله، المنتشرة على السواء عند الذين يخلصون وعند الذين يهلكون:"]]}, {"l": "2Co 2:16", "n": "", "vs": [[16, "هؤلاء يشمون فيها رائحة من الموت وإلى الموت، وأولئك رائحة من الحياة وإلى الحياة. ومن هو صاحب الكفاءة لتأدية هذه الأمور؟"]]}, {"l": "Eph 5:26", "n": "", "vs": [[26, "لكي يقدسها مطهرا إياها بغسل الماء، بالكلمة،"]]}], "kwAr": "عبر الماء", "noteAr": ""}], "arS": [["وذلك بعدما ", []], ["رفضوا", ["G544"]], [" البشارة في ", []], ["أيام", ["G2250"]], [" ", []], ["نوح", ["G3575"]], ["، عندما كان ", []], ["الله", ["G2316"]], [" ", []], ["يتأنى صابرا", ["G3115"]], [" طوال المدة التي كان نوح ", []], ["يبني", ["G2680"]], [" فيها ", []], ["السفينة", ["G2787"]], ["، التي ", []], ["نجا", ["G1295"]], [" بها عدد ", []], ["قليل", ["G3641"]], [" من الناس عبر ", []], ["الماء", ["G5204"]], ["، ", []], ["ثمانية", ["G3638"]], [" ", []], ["أشخاص", ["G5590"]], [" فقط!", []]]}, {"c": 3, "v": 21, "text": "وعملية النجاة هذه مصورة في المعمودية التي لا نقصد بها أن نغتسل من أوساخ أجسامنا، بل هي تعهد ضمير صالح أمام الله بفضل قيامة يسوع المسيح،", "groups": [{"kw": "like", "raw": "Rom_5:14; 1Co_4:6; Heb_9:24 *Gr: Heb_11:19", "note": "", "refs": [{"l": "Rom 5:14", "n": "", "vs": [[14, "أما الموت، فقد ملك منذ آدم إلى موسى، حتى على الذين لم يرتكبوا خطيئة شبيهة بمخالفة آدم، الذي هو رمز للآتي بعده."]]}, {"l": "1Co 4:6", "n": "", "vs": [[6, "فيما سبق، أيها الإخوة، قدمت نفسي وأبلوس إيضاحا لكم، لتتعلموا بنا أن لا تحلقوا بأفكاركم فوق ما قد كتب، فلا يفاخر أحدكم الآخر تحزبا لأحد."]]}, {"l": "Heb 9:24", "n": "*Gr:", "vs": [[24, "فالمسيح، رئيس كهنتنا، لم يدخل إلى «قدس الأقداس» الأرضي، الذي صنعته يد بشرية وما هو إلا ظل للحقيقة، بل دخل إلى السماء عينها، حيث يقوم الآن بتمثيلنا في حضرة الله بالذات."]]}, {"l": "Heb 11:19", "n": "", "vs": [[19, "فقد آمن إبراهيم بأن الله قادر على إقامة إسحاق من الموت. والواقع أن إبراهيم استعاد ابنه من الموت، على سبيل المثال أو الرمز."]]}], "kwAr": "مصورة", "noteAr": ""}, {"kw": "baptism", "raw": "Mat_28:19; Mar_16:16; Act_2:38, Act_22:16; Rom_6:3-6; 1Co_12:13; Gal_3:27; Eph_5:26; Col_2:12; Tit_3:5-7", "note": "", "refs": [{"l": "Mat 28:19", "n": "", "vs": [[19, "فاذهبوا إذن، وتلمذوا جميع الأمم، وعمدوهم باسم الآب والابن والروح القدس؛"]]}, {"l": "Mar 16:16", "n": "", "vs": [[16, "من آمن وتعمد، خلص، ومن لم يؤمن فسوف يدان."]]}, {"l": "Act 2:38", "n": "", "vs": [[38, "أجابهم بطرس: «توبوا، وليتعمد كل واحد منكم باسم يسوع المسيح، فيغفر الله خطاياكم وتنالوا هبة الروح القدس،"]]}, {"l": "Act 22:16", "n": "", "vs": [[16, "والآن لماذا تبطيء؟ قم تعمد واغتسل من خطايا ك، داعيا باسم الرب."]]}, {"l": "Rom 6:3-6", "n": "", "vs": [[3, "أم يخفى عليكم أننا جميعا، نحن الذين تعمدنا اتحادا بالمسيح يسوع، قد تعمدنا اتحادا بموته؟"], [4, "وبسبب ذلك دفنا معه بالمعمودية للموت، حتى كما أقيم المسيح من الأموات بمجد الآب، كذلك نسلك نحن أيضا في حياة جديدة."], [5, "فما دمنا قد اتحدنا به في ما يشبه موته، فإننا سنتحد به أيضا في قيامته."], [6, "فنحن نعلم هذا: أن الإنسان العتيق فينا قد صلب معه لكي يبطل جسد الخطيئة فلا نبقى عبيدا للخطيئة فيما بعد."]]}, {"l": "1Co 12:13", "n": "", "vs": [[13, "فإننا، بالروح الواحد، قد تعمدنا جميعا لنصير جسدا واحدا، سواء كنا يهودا أم يونانيين، عبيدا أم أحرارا، وقد سقينا جميعا الروح الواحد."]]}, {"l": "Gal 3:27", "n": "", "vs": [[27, "لأنكم، جميع الذين تعمدتم في المسيح، قد لبستم المسيح."]]}, {"l": "Eph 5:26", "n": "", "vs": [[26, "لكي يقدسها مطهرا إياها بغسل الماء، بالكلمة،"]]}, {"l": "Col 2:12", "n": "", "vs": [[12, "فقد دفنتم معه في المعمودية، وفيها أيضا أقمتم معه، عن طريق إيمانكم بقدرة الله الذي أقامه من بين الأموات."]]}, {"l": "Tit 3:5-7", "n": "", "vs": [[5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"], [6, "الذي سكبه علينا بغنى بيسوع المسيح مخلصنا."], [7, "حتى إذا تبررنا بنعمته، نصير ورثة، وفقا لرجائنا بالحياة الأبدية."]]}], "kwAr": "المعمودية", "noteAr": ""}, {"kw": "the putting", "raw": "Eze_36:25, Eze_36:26; Zec_13:1; 2Co_7:1", "note": "", "refs": [{"l": "Eze 36:25", "n": "", "vs": [[25, "وأرش عليكم ماء نقيا فتطهرون من كل نجاستكم ومن كل أصنامكم،"]]}, {"l": "Eze 36:26", "n": "", "vs": [[26, "وأهبكم قلبا جديدا، وأضع في داخلكم روحا جديدة، وأنتزع من لحمكم قلب الحجر وأعطيكم عوضا عنه قلب لحم."]]}, {"l": "Zec 13:1", "n": "", "vs": [[1, "»في ذلك اليوم يتفجر ينبوع ليطهر ذرية داود وسكان أورشليم من إثمهم ونجاستهم."]]}, {"l": "2Co 7:1", "n": "", "vs": [[1, "فإذ نلنا هذه الوعود، أيها الأحباء، لنطهر أنفسنا من كل ما يدنس الجسد والروح، ونكمل القداسة في مخافة الله."]]}], "kwAr": "أوساخ أجسامنا", "noteAr": ""}, {"kw": "the answer", "raw": "Act_8:37; Rom_10:9, Rom_10:10; 2Co_1:12; 1Ti_6:12", "note": "", "refs": [{"l": "Act 8:37", "n": "", "vs": [[37, "فأجابه فيلبس: «هذا جائز إن كنت تؤمن من كل قلبك». فقال الخصي: «إني أومن بأن يسوع المسيح هو ابن الله»."]]}, {"l": "Rom 10:9", "n": "", "vs": [[9, "أنك إن اعترفت بفمك بيسوع ربا، وآمنت في قلبك بأن الله أقامه من الأموات، نلت الخلاص."]]}, {"l": "Rom 10:10", "n": "", "vs": [[10, "فإن الإيمان في القلب يؤدي إلى البر، والاعتراف بالفم يؤيد الخلاص،"]]}, {"l": "2Co 1:12", "n": "", "vs": [[12, "فإن فخرنا هو هذا: شهادة ضميرنا بأننا، في قداسة الله وإخلاصه، قد سلكنا في العالم، وبخاصة تجاهكم؛ و
