<script>window.CATALOG=[{"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 5, "nv": 99, "refs": 1290, "last": "5:17", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>

بالحق", ["G225"]], [".", []]]}, {"c": 1, "v": 2, "text": "أيها الحبيب، أود أن تكون موفقا في كل أمر، وأن تكون صحتك البدنية قوية ومعافاة كصحتك الروحية.", "groups": [{"kw": "wish", "raw": "or, pray", "note": "or, pray", "refs": [], "kwAr": "أود", "noteAr": "أو: أصلّي."}, {"kw": "above", "raw": "Jam_5:12; 1Pe_4:8", "note": "", "refs": [{"l": "Jam 5:12", "n": "", "vs": [[12, "ولكن قبل كل شيء، ياإخوتي، لا تحلفوا، لا بالسماء، ولا بالأرض ولا بأي قسم آخر. وإنما ليكن كلامكم «نعم» إن كان نعم، و«لا» إن كان لا. وذلك لكي لا تقعوا تحت الحكم."]]}, {"l": "1Pe 4:8", "n": "", "vs": [[8, "لكن أهم شيء هو أن تبادلوا بعضكم بعضا المحبة الشديدة. لأن المحبة تستر إساءات كثيرة."]]}], "kwAr": "في كل أمر", "noteAr": ""}, {"kw": "that", "raw": "Psa_20:1-5; Phi_2:4, Phi_2:27", "note": "", "refs": [{"l": "Psa 20:1-5", "n": "", "vs": [[1, "ليستجب لك الرب في يوم ضيقك. ليحرسك اسم إله يعقوب."], [2, "ليرسل لك عونا من مقدسه، وأزرا من صهيون."], [3, "ليتذكر جميع تقدماتك، ويتقبل محرقاتك."], [4, "ليعطك بغية قلبك، ويتمم لك كل مقاصدك."], [5, "نهتف مبتهجين بخلاصك، وباسم إلهنا نرفع رايتنا، ليحقق لك الرب كل ملتمسك."]]}, {"l": "Phi 2:4", "n": "", "vs": [[4, "مهتما لا بمصلحته الخاصة بل بمصالح الآخرين أيضا."]]}, {"l": "Phi 2:27", "n": "", "vs": [[27, "فقد مرض حتى أشرف على الموت، ولكن الله أشفق عليه، وليس عليه وحده، بل علي أنا أيضا، لئلا يصيبني حزن على حزن."]]}], "kwAr": "تكون موفقا", "noteAr": ""}, {"kw": "even", "raw": "3Jo_1:3-6; Col_1:4-6; 1Th_1:3-10, 1Th_2:13, 1Th_2:14, 1Th_2:19, 1Th_2:20, 1Th_3:6-9; 2Th_1:3, 2Th_2:13; Phm_1:5-7; 2Pe_1:3-9, 2Pe_3:18; Rev_2:9", "note": "", "refs": [{"l": "3Jo 1:3-6", "n": "", "vs": [[3, "فكم كان فرحي عظيما عندما مر بي بعض الإخوة المسافرين وأخبروني أنك تسلك بحسب الحق، وشهدوا للحق الثابت فيك!"], [4, "وما أعظم الفرح الذي يغمر قلبي حين أسمع الأخبار الطيبة التي تؤكد أن أولادي يسلكون بحسب الحق!"], [5, "أيها الحبيب، إن معاملتك الحسنة للإخوة وللغرباء تدل على أنك تتصرف بأمانة نحو الله."], [6, "وقد شهد هؤلاء الإخوة، أمام الكنيسة، شهادة جميلة لمحبتك. فإنك تفعل حسنا إذا زودتهم بما يحتاجون إليه في السفر. فأنت تعرف أن هذا يرضي الله ،"]]}, {"l": "Col 1:4-6", "n": "", "vs": [[4, "إذ بلغنا خبر إيمانكم بالمسيح يسوع والمحبة التي لكم نحو جميع القديسين،"], [5, "بسبب الرجاء المحفوظ لكم في السماوات، الرجاء الذي سمعتم به سابقا في كلمة الحق التي في الإنجيل"], [6, "والتي وصلت إليكم كما تنتشر الآن في العالم أجمع، منتجة الثمر ونامية، مثلما يحدث بينكم أنتم منذ أن سمعتم بنعمة الله واختبرتموها بالحق،"]]}, {"l": "1Th 1:3-10", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"], [4, "ونحن عالمون، أيها الإخوة أحباء الله، حقيقة اختياركم من قبل الله:"], [5, "لأن تبشيرنا لكم بالإنجيل لم يكن مجرد كلام، بل كان مصحوبا أيضا بالقوة وبالروح القدس وبتمام اليقين. كما أنكم تعلمون تماما ماذا كنا بينكم لأجل مصلحتكم،"], [6, "وقد صرتم مقتدين بنا وبالرب، إذ تقبلتم كلمة الله في وسط ضيقة شديدة بفرح الروح القدس."], [7, "حتى إنكم صرتم مثالا لجميع المؤمنين المقيمين في مقاطعتي مقدونية وأخائية."], [8, "فمن عندكم دوت كلمة الرب، منتشرة لا في مقدونية وأخائية فقط، بل إن إيمانكم بالله ذاع في كل مكان، حتى ليس لنا حاجة لأن نقول شيئا بعد."], [9, "فإن أولئك المؤمنين أنفسهم يخبرون عنا كيف كان قدومنا إليكم أول مرة، وكيف تحولتم إلى الله عن الأصنام، لتصيروا عبيدا يخدمون الله الحي الحق،"], [10, "وتنتظروا من السماوات ابنه الذي أقامه من بين الأموات، يسوع مخلصنا من الغضب الآتي."]]}, {"l": "1Th 2:13", "n": "", "vs": [[13, "ولذلك نحن أيضا نرفع الشكر لله بلا توقف، لأنكم لما تلقيتم منا كلمة البشارة من الله، قبلتموها لا كأنها كلمة بشر، بل كما هي في الحقيقة: باعتبارها كلمة الله العاملة أيضا فيكم أنتم المؤمنين."]]}, {"l": "1Th 2:14", "n": "", "vs": [[14, "فإنكم، أيها الإخوة، قد صرتم على مثال كنائس الله التي في منطقة اليهودية والتي هي في المسيح يسوع. فأنتم أيضا قاسيتم على أيدي بني جنسكم ما قاسوه هم على أيدي اليهود"]]}, {"l": "1Th 2:19", "n": "", "vs": [[19, "فما هو رجاؤنا أو فرحنا أو إكليل افتخارنا أمام ربنا يسوع عند عودته؟ أليس أنتم؟ بلى،"]]}, {"l": "1Th 2:20", "n": "", "vs": [[20, "لأنكم فخرنا وفرحنا."]]}, {"l": "1Th 3:6-9", "n": "", "vs": [[6, "أما  "vs": [[15, "لذلك أنا أيضا، وقد سمعت بما فيكم من الإيمان بالرب يسوع والمحبة لجميع القديسين،"]]}, {"l": "Eph 1:16", "n": "", "vs": [[16, "لا أنقطع عن شكر الله لأجلكم وعن ذكركم في صلواتي،"]]}, {"l": "Col 1:7", "n": "", "vs": [[7, "على حسب ما تعلمتم من أبفراس شريكنا العبد الحبيب، والخادم الأمين للمسيح عندكم"]]}, {"l": "Col 1:8", "n": "", "vs": [[8, "وهو نفسه أخبرنا بما لكم من المحبة في الروح."]]}, {"l": "1Th 3:6-9", "n": "", "vs": [[6, "أما الآن، وقد عاد تيموثاوس إلينا من عندكم وبشرنا بما لكم من إيمان ومحبة، وبأنكم تذكروننا ذكرا حسنا في كل حين، وتشتاقون كثيرا لرؤيتنا كما نشتاق نحن لرؤيتكم،"], [7, "فقد وجدنا بكم أيها الإخوة عزاء في وسط ضيقتنا وشدتنا من جهة إيمانكم."], [8, "فقد طابت لنا الحياة مادمتم ثابتين في الرب!"], [9, "فأي شكر نستطيع أن نؤديه إلى الله عوضا عنكم من أجل كل ما نبتهج به من الفرح بسببكم أمام إلهنا،"]]}], "kwAr": "عندما مر بي بعض الإخوة", "noteAr": ""}, {"kw": "the truth", "raw": "2Jo_1:2, 2Jo_1:4; Psa_119:11", "note": "", "refs": [{"l": "2Jo 1:2", "n": "", "vs": [[2, "بما أن الحق ثابت في قلوبنا، ولابد أن يرافقنا إلى الأبد،"]]}, {"l": "2Jo 1:4", "n": "", "vs": [[4, "فرحت جدا حين وجدت بعض أولادك يسلكون بحسب الحق، وفقا لما أوصانا به الآب."]]}, {"l": "Psa 119:11", "n": "", "vs": [[11, "خبأت كلامك في قلبي، لئلا أخطيء إليك."]]}], "kwAr": "تسلك بحسب الحق", "noteAr": ""}], "arS": [["فكم كان ", []], ["فرحي", ["G5463"]], [" ", []], ["عظيما", ["G3029"]], [" عندما ", []], ["مر", ["G2064"]], [" بي بعض ", []], ["الإخوة", ["G80"]], [" المسافرين وأخبروني أنك ", []], ["تسلك", ["G4043"]], [" بحسب ", []], ["الحق", ["G225"]], ["، ", []], ["وشهدوا", ["G3140"]], [" ", []], ["للحق", ["G225"]], [" الثابت فيك!", []]]}, {"c": 1, "v": 4, "text": "وما أعظم الفرح الذي يغمر قلبي حين أسمع الأخبار الطيبة التي تؤكد أن أولادي يسلكون بحسب الحق!", "groups": [{"kw": "have", "raw": "Pro_23:24", "note": "", "refs": [{"l": "Pro 23:24", "n": "", "vs": [[24, "أبو الصديق يغتبط أشد الاغتباط، ومن أنجب حكيما يسر به."]]}], "kwAr": "ما أعظم الفرح", "noteAr": ""}, {"kw": "that", "raw": "Isa_8:18; 1Co_4:15; Gal_4:19; Phm_1:10", "note": "", "refs": [{"l": "Isa 8:18", "n": "", "vs": [[18, "انظروا ها أنا والأبناء الذين رزقني إياهم الرب، آيات ومعجزات في إسرائيل من عند الرب القدير الساكن في جبل صهيون."]]}, {"l": "1Co 4:15", "n": "", "vs": [[15, "فقد يكون لكم عشر ة آلاف من المرشدين في المسيح، ولكن ليس لكم آباء كثيرون! لأني أنا ولدتكم في المسيح يسوع بالإنجيل."]]}, {"l": "Gal 4:19", "n": "", "vs": [[19, "ياأطفالي الذين أتمخض بكم مرة أخرى إلى أن تتشكل فيكم صورة المسيح."]]}, {"l": "Phm 1:10", "n": "", "vs": [[10, "فألتمس منك لأجل ولدي الذي ولدته وأنا مكبل بالقيود، أونسيموس،"]]}], "kwAr": "أن أولادي", "noteAr": ""}, {"kw": "walk", "raw": "1Ki_2:4, 1Ki_3:6; 2Ki_20:3; Psa_26:1-3; Isa_38:3; Joh_12:35, Joh_12:36; Gal_2:14", "note": "", "refs": [{"l": "1Ki 2:4", "n": "", "vs": [[4, "فيحقق الرب وعوده التي وعدني بها قائلا: إذا حفظ بنوك طريقهم وسلكوا أمامي بإخلاص من كل قلوبهم وأنفسهم، فإنه لن ينقطع لك رجل عن اعتلاء عرش إسرائيل."]]}, {"l": "1Ki 3:6", "n": "", "vs": [[6, "فأجاب: «لقد صنعت إلى عبدك داود أبي رحمة واسعة لأنه سلك أمامك بأمانة وصلاح واستقامة قلب، فلم تحرمه من الرحمة العظيمة، ورزقته ابنا يخلفه على عرشه في هذا اليوم."]]}, {"l": "2Ki 20:3", "n": "", "vs": [[3, "«آه يارب، اذكر كيف سلكت أمامك بأمانة وإخلاص قلب، وصنعت ما يرضيك». وبكى حزقيا بكاء مرا."]]}, {"l": "Psa 26:1-3", "n": "", "vs": [[1, "رب أظهر براءتي لأني قد سلكت بكمالي، وعليك توكلت فلا أتزعزع"], [2, "افحصني أيها الرب واختبرني. امتحن دخائلي وقلبي،"], [3, "لأن رحمتك نصب عيني، وقد سلكت في حقك."]]}, {"l": "Isa 38:3", "n": "", "vs": [[3, "قائلا: «آه يارب، اذكر كيف سلكت أمامك بالأمانة وبقلب خالص، وصنعت ما يرضيك». وبكى حزقيا بكاء مرا."]]}, {"l": "Joh 12:35", "n": "", "vs": [[35, "فقال لهم يسوع: «النور باق معكم وقتا قصيرا. فواصلوا سيركم مادام النور يشرق عليكم، لئلا يطبق عليكم الظلام، فإن الذي يمشي في الظلام لا يعلم أين يذهب."]]}, {"l": "Joh 12:36", "n": "", "vs": [[36, "آمنوا بالنور مادام النور معكم، فتصيروا أبناء النور»."]]}, {"l": "Gal 2:14", "n": "", "vs": [[14, "فلما رأيت أنهم لا يسلكون باستقامة توافق حق الإنجيل، قلت لبطر ه أن يخدم بموجب القوة التي يمنحها الله . وذلك لكي يتمجد الله في كل شيء، بيسوع المسيح، له المجد والسلطة إلى أبد الآبدين. آمين!"]]}], "kwAr": "", "noteAr": ""}], "arS": [["أيها ", []], ["الحبيب", ["G27"]], ["، إن ", []], ["معاملتك", ["G2038"]], [" الحسنة ", []], ["للإخوة", ["G80"]], [" ", []], ["وللغرباء", ["G3581"]], [" تدل على أنك ", []], ["تتصرف", ["G4160"]], [" ", []], ["بأمانة", ["G4103"]], [" نحو الله.", []]]}, {"c": 1, "v": 6, "text": "وقد شهد هؤلاء الإخوة، أمام الكنيسة، شهادة جميلة لمحبتك. فإنك تفعل حسنا إذا زودتهم بما يحتاجون إليه في السفر. فأنت تعرف أن هذا يرضي الله ،", "groups": [{"kw": "have borne witness of thy charity", "raw": "3Jo_1:12; Phm_1:5-7", "note": "", "refs": [{"l": "3Jo 1:12", "n": "", "vs": [[12, "أما ديمتريوس، فالجميع يشهدون له شهادة طيبة. حتى الحق نفسه يشهد له. ونحن أيضا نشهد له. وأنتم تثقون بصدق ما نشهد به."]]}, {"l": "Phm 1:5-7", "n": "", "vs": [[5, "وقد سمعت بما لك من محبة وأمانة من نحو الرب يسوع، ومن نحو جميع القديسين،"], [6, "طالبا أن يكون اشتراكك معنا في الإيمان فعالا، فتدرك إلى التمام ما فينا من كل صلاح لأجل المسيح."], [7, "فقد كان لي أيها الأخ، سرور عظيم وتشجيع، بفضل محبتك، لأن عواطف القديسين قد انتعشت بفضلك!"]]}], "kwAr": "شهدوا لمحبتك", "noteAr": ""}, {"kw": "whom", "raw": "Act_15:3, Act_21:5; Rom_15:24; 2Co_1:16; Tit_3:13", "note": "", "refs": [{"l": "Act 15:3", "n": "", "vs": [[3, "وبعدما ودعتهم الكنيسة، سافروا إلى أورشليم مرورا بمدن فينيقية والسامرة، مخبرين الإخوة فيها بأن غير اليهود أيضا قد اهتدوا إلى المسيح، فأشاعوا بذلك فرحا كبيرا بين الإخوة جميعا."]]}, {"l": "Act 21:5", "n": "", "vs": [[5, "وعندما انتهت مدة إقامتنا عندهم خرجنا لنكمل سفرنا، فرافقونا مع نسائهم وأولادهم إلى خارج المدينة مودعين. فركعنا على الشاطيء وصلينا،"]]}, {"l": "Rom 15:24", "n": "", "vs": [[24, "فعندما أذهب إلى أسبانيا أرجو أن أمر بكم، فأراكم وتسهلون لي متابعة السفر بعد أن أتمتع بلقائكم ولو لفترة قصيرة."]]}, {"l": "2Co 1:16", "n": "", "vs": [[16, "وأن أمر بكم في طريقي إلى مقاطعة مقدونية وأيضا في عودتي منها، وبعدئذ تسهلون لي سبيل السفر إلى منطقة اليهودية."]]}, {"l": "Tit 3:13", "n": "", "vs": [[13, "اجتهد في إطلاق زيناس المحامي وأبلوس بعد تزويدهما للسفر، حتى لا يحتاجا إلى شيء."]]}], "kwAr": "زودتهم", "noteAr": ""}, {"kw": "after a godly sort", "raw": "or, worthy of God, This is a literal and proper rendering of the original αξιως [Strongs G516], του [Strongs G5120], Θεου [Strongs G2316], by which the antecedent to the possessive pronoun his, in the next verse, becomes immediately apparent. In a manner worthy of God, and of your relations and obligations to Him, and such as He can approve. 1Th_2:12", "note": "or, worthy of God, This is a literal and proper rendering of the original αξιως [Strongs G516], του [Strongs G5120], Θεου [Strongs G2316], by which the antecedent to the possessive pronoun his, in the next verse, becomes immediately apparent. In a manner worthy of God, and of your relations and obligations to Him, and such as He can approve. 1Th_2:12", "refs": [{"l": "1Th 2:12", "n": "", "vs": [[12, "ونحرضكم أن تسلكوا سلوكا يليق بالله، ذاك الذي يدعوكم إلى ملكوته ومجده."]]}], "kwAr": "يرضي الله", "noteAr": "أو: كما يليق بالله. هذه ترجمة حرفية ودقيقة للأصل αξιως [Strongs G516] του [Strongs G5120] Θεου [Strongs G2316]، وبها يتضح فورًا على من يعود الضمير «اسمه» في العدد التالي. أي بطريقة تليق بالله وبعلاقتكم به والتزاماتكم نحوه، وبما يرضاه."}, {"kw": "do well", "raw": "Gen_4:7; Jon_4:4; Mat_25:21-23; Act_15:29; Phi_4:14; 1Pe_2:20", "note": "", "refs": [{"l": "Gen 4:7", "n": "", "vs": [[7, "لو أحسنت في تصرفك ألا يشرق وجهك فرحا؟ وإن لم تحسن التصرف، فعند الباب خطيئة تنتظرك، تتشوق أن تتسلط عليك، لكن يجب أن تتحكم فيها»"]]}, {"l": "Jon 4:4", "n": "", "vs": [[4, "فقال الرب: «أأنت محق في غضبك؟»"]]}, {"l": "Mat 25:21-23", "n": "", "vs": [[21, "فقال له سيده: حسنا فعلت أيها العبد الصالح والأمين! كنت أمينا على القليل، فسأقيمك على الكثير. ادخل إلى فرح سيدك!"], [22, "ثم جاءه أيضا الذي أخذ الوزنتين وقال: ياسيد أنت سلمتني وزنتين، فهاتان وزنتان غيرهما ربحتهما!"], [23, "فقال له سيده: حسنا فعلت أيها العبد الصالح والأمين! كنت أمينا على القليل، فسأقيمك على الكثير. ادخل إلى فرح سيدك!"]]}, {"l": "Act 15:29", "n": "", "vs": [[29, "إنما عليكم أن تمتنعوا عن الأكل من الذبائح المقربة للأصنام، وعن تناول الدم ولحوم الحيوانات المخنوقة، وعن ارتكاب الزنى. وتحسنون عملا إن حفظتم أنفسكم من هذه الأمور. عافاكم الله !»"]]}, {"l": "Phi 4:14", "n": "", "vs": [[14, "إلا أنكم حسنا فعلتم إذ ساهمتم في تبديد ضيقتي."]]}, {"l": "1Pe 2:20", "n": "", "vs": [[20, "فبالحقيقة، أي مجد لكم إن كنتم تصبرون وأنتم تتحملون قصاص أخطائكم؟ لا فضل لكم عند الله إلا إذا تحملتم الآلام صابرين، وأنتم تفعلون الصواب."]]}], "kwAr": "تفعل حسنا", "noteAr": ""}], "arS": [["وقد ", []], ["شهد", ["G3140"]], [" هؤلاء الإخوة، أمام ", []], ["الكنيسة", ["G1577"]], ["، شهادة جميلة ", []], ["لمحبتك", ["G26"]], [". فإنك ", []], ["تفعل", ["G4160"]], [" ", []], ["حسنا", ["G2573"]], [" إذا ", []], ["زودتهم", ["G4311"]], [" بما يحتاجون إليه في السفر. فأنت تعرف أن هذا ", []], ["يرضي الله", ["G516", "G2316"]], [" ،", []]]}, {"c": 1, "v": 7, "text": "لأن هؤلاء الإخوة قد انطلقوا في سبيل خدمة المسيح، وهم لا يتلقون أي عون من غير المؤمنين.", "groups": [{"kw": "that", "raw": "Act_8:4, Act_9:16; 2Co_4:5; Col_1:24; Rev_2:3", "note": "", "refs": [{"l": "Act 8:4", "n": "", "vs": [[4, "والذين تشتتوا كانوا ينتقلون من مكان إلى مكان مبشرين بالكلمة."]]}, {"l": "Act 9:16", "n": "", "vs": [[16, "وسأريه كم ينبغي أن يتألم من أجل اسمي!»"]]}, {"l": "2Co 4:5", "n": "", "vs": [[5, "فإننا لا نبشر بأنفسنا، بل بالمسيح يسوع ربا، وما نحن إلا عبيد لكم من أجل يسوع."]]}, {"l": "Col 1:24", "n": "", "vs": [[24, "والآن أنا أفرح في الآلام التي أقاسيها لأجلكم، وأتمم في جسدي ما نقص من ضيقات المسيح لأجل جسده الذي هو الكنيسة،"]]}, {"l": "Rev 2:3", "n": "", "vs": [[3, "وقد تألمت من أجل اسمي بصبر وبغير كلل."]]}], "kwAr": "في سبيل خدمة المسيح", "noteAr": ""}, {"kw": "taking", "raw": "2Ki_5:15, 2Ki_5:16, 2Ki_5:20-27; 1Co_9:12-15, 1Co_9:18; 2Co_11:7-9, 2Co_12:13", "note": "", "refs": [{"l": "2Ki 5:15", "n": "", "vs": [[15, "فرجع إلى رجل الله مع سائر جيشه ودخل ووقف أمامه قائلا: «لقد أدركت أنه لا يوجد إله في كل الأرض إلا في إسرائيل، فأرجوك أن تقبل الآن هدية من عبدك»."]]}, {"l": "2Ki 5:16", "n": "", "vs": [[16, "فأجاب أليشع: «حي هو الرب الذي أنا واقف في حضرته، إني لا أقبل منك هدية». فألح عليه أن يقبل منه الهدية، فأبى أليشع."]]}, {"l": "2Ki 5:20-27", "n": "", "vs": [[20, "حتى حدث جيحزي خادم أليشع نفسه: «سيدي امتنع عن قبول ما أحضره نعمان من هدايا. حي هو الرب لأسرعن وراءه وآخذ منه شيئا»."], [21, "فلحق جيحزي بنعمان. ولما أبصره نعمان راكضا نحوه، ترجل عن المركبة للقائه سائلا: «أللخير جئت؟»"], [22, "فأجاب: «للخير. إن سيدي قد أرسلني قائلا: إن رجلين من جبل أفرايم من بني الأنبياء جاءاه، فأرجوك أن تعطيهما وزنة من الفضة وحلتي ثياب»."], [23, "فقال نعمان: «أرجوك أن تأخذ وزنتين» وألح عليه، وصرهما في كيسين وحلتي ثياب، وأعطاهما لرجلين من رجاله، فحملاهما وانطلقا أمام جيحزي."], [24, "وعندما وصل إلى الأكمة حيث يقيم أليشع أخذها منهما وأخفاها في البيت، وصرف الرجلين."], [25, "ثم دخل إلى أليشع، فسأله: «من أين جئت ياجيحزي؟» فأجاب: «لم يذهب عبدك إلى أي مكان»."], [26, "فقال له: «ألا تعرف أن قلبي كان حاضرا هناك حين ترجل الرجل من مركبته للقائك؟ أهذا وقت الحصول على فضة أو أخذ ثياب وزيتون وكروم وغنم وبقر وعبيد وجوار؟"], [27, "فليحل برص نعمان بك وبنسلك إلى الأبد». فخرج من أمامه وجلده أبرص في لون الثلج."]]}, {"l": "1Co 9:12-15", "n": "", "vs": [[12, "إن كان لغيرنا هذا الحق عليكم، أفلا نكون نحن أحق؟ ولكننا لم نستعمل هذا الحق؟ بل نتحمل كل شيء، مخافة أن نضع أي عائق أمام إنجيل المسيح !"], [13, "أما تعلمون أن الذين يشتغلون بالمقدسات كانوا يأكلون مما يقدم إلى الهيكل، وأن الذين يقومون بخدمة المذبح، كانوا يشتركون في خيرات المذبح؟"], [14, "هكذا أيضا رسم الرب للذين يبشرون بالإنجيل أن يعيشوا من الإنجيل."], [15, "على أني لم أستعمل أيا من هذه الحقوق. وما كتبت هذا الآن لأحظى بشيء. فإني أفضل الموت على أن يعطل أحد فخري."]]}, {"l": "1Co 9:18", "n": "", "vs": [[18, "فما هي مكافأتي إذن؟ هي أني في تبشيري أجعل الإنجيل بلا كلفة، غير مستغل كامل حقي لقاء التبشير بالإنجيل."]]}, {"l": "2Co 11:7-9", "n": "", "vs": [[7, "أيكون ذنبي إذن، أني بشرتكم بالإنجيل دون أجرة منكم، فأنقصت قدري ليزداد قدركم؟"], [8, "ظلمت كنائس أخرى بتحميلها نفقة خدمتكم."], [9, "وحين كنت عندكم واحتجت، لم أثقل على أحد منكم. إذ سد حاجتي الإخوة الذين جاءوا من مقاطعة مقدونية. وقد حفظت نفسي، وسأحفظها أيضا، من أن أكون ثقيلا عليكم في أي شيء."]]}, {"l": "2Co 12:13", "n": "", "vs": [[13, "ففي أي مجال كنتم أصغر قدرا من الكنائس الأخرى إلا في أني لم أكن عبئا ثقيلا عليكم؟ اغفروا لي هذه الإساءة!"]]}], "kwAr": "لا يتلقون أي عون", "noteAr": ""}], "arS": [["لأن هؤلاء الإخوة قد ", []], ["انطلقوا", ["G1831"]], [" في سبيل خدمة المسيح، وهم لا ", []], ["يتلقون", ["G2983"]], [" ", []], ["أي", ["G3367"]], [" عون من ", []], ["غير المؤمنين", ["G1484"]], [".", []]]}, {"c": 1, "v": 8, "text": "فعلينا نحن أن نرحب بأمثال هؤلاء لكي نكون حقا شركاء لهم في خدمة الحق.", "groups": [{"kw": "to receive", "raw": "3Jo_1:10; Mat_10:14, Mat_10:40; Luk_11:7; 2Co_7:2, 2Co_7:3", "note": "", "refs": [{"l": "3Jo 1:10", "n": "", "vs": [[10, "لهذا، سألفت الانتباه إلى الأعمال التي يقوم بها، حين أجيء. إنه يثير ضدنا تهما كاذبة، متكلما بأسلوب خبيث. وهو لا يكتفي بهذا، بل يرفض استقبال الإخوة المسافرين، ويمنع الذين يريدون استقبالهم، ويطردهم من الكنيسة أيضا."]]}, {"l": "Mat 10:14", "n": "", "vs": [[14, "وإن كان أحد لا يقبلكم ولا يسمع كلامكم في بيت أو مدينة، فاخرجوا من هناك، وانفضوا الغبار عن أقدامكم."]]}, {"l": "Mat 10:40", "n": "", "vs": [[40, "من يقبلكم، يقبلني؛ ومن يقبلني، يقبل الذي أرسلني."]]}, {"l": "Luk 11:7", "n": "", "vs": [[7, "لكن صديقه يجيبه من الداخل: لا تزعجني! فقد أقفلت الباب، وها أنا وأولادي في الفراش. لا أقدر أن أقوم وأعطيك!"]]}, {"l": "2Co 7:2", "n": "", "vs": [[2, "أفسحوا لنا مكانا في قلوبكم: فنحن لم نعامل أحدا معاملة ظالمة، ولم نؤذ أحدا، ولم نستغل أحدا."]]}, {"l": "2Co 7:3", "n": "", "vs": [[3, "لا أقول هذا لأدينكم. فإنكم، كما قلت سابقا، في قلوبنا، حتى إننا نموت معكم أو نحيا معكم!"]]}], "kwAr": "نرحب بأمثال هؤلاء", "noteAr": ""}, {"kw": "fellowhelpers", "raw": "1Co_3:5-9, 1Co_16:10,1Co_16:11; 2Co_6:1, 2Co_8:23; Phi_4:3; Col_4:11; 1Th_3:2; Phm_1:2, Phm_1:24", "note": "", "refs": [{"l": "1Co 3:5-9", "n": "", "vs": [[5, "فمن هو بولس؟ ومن هو أبلوس؟ إنهما فقط خادمان آمنتم على أيديهما، وكما أنعم الرب على كل منهما."], [6, "أنا غرست وأبلوس سقى؛ ولكن الله أنمى."], [7, "فليس الغارس شيئا ولا الساقي، بل الله الذي يعطي النمو."], [8, "فالغارس والساقي سواء. إلا أن كلا منهما سينال أجرته بالنسبة إلى تعبه."], [9, "فإننا نحن جميعا عاملون معا عند الله، وأنتم حقل الله وبناء الله."]]}, {"l": "1Co 16:10", "n": "", "vs": [[10, "وإذا وصل تيموثاوس إليكم، فاهتموا بأن يكون مطمئنا عندكم، لأنه يقوم بعمل الرب مثلي."]]}, {"l": "1Co 16:11", "n": "", "vs": [[11, "فلا يستخف به أحد، بل سهلوا له السبيل ليعود إلي بسلام، فأنا أنتظر وصوله، مع الإخوة."]]}, {"l": "2Co 6:1", "n": "", "vs": [[1, "فبما أننا عاملون معا عند الله، نطلب ألا يكون قبولكم لنعمة الله عبثا."]]}, {"l": "2Co 8:23", "n": "", "vs": [[23, "أما تيطس، فهو زميلي ومعاوني من أجل مصلحتكم. وأما أخوانا الآخران، فهما رسولا الكنائس ومجد المسيح."]]}, {"l": "Phi 4:3", "n": "", "vs": [[3, "أجل، أطلب إليك أنت أيضا، أيها الزميل المخلص، أن تساعدهما، لأنهما جاهدتا معي في خدمة الإنجيل، هما وأكليمندس ومعاوني الآخرون، المكتوبة أسماؤهم في سجل الحياة."]]}, {"l": "Col 4:11", "n": "", "vs": [[11, "ويسوع المعروف باسم يسطس. هؤلاء جميعا من أهل الختان، وهم وحدهم معاوني لأجل ملكوت الله، وقد كانوا لي عزاء."]]}, {"l": "1Th 3:2", "n": "", "vs": [[2, "فبعثنا تيموثاوس، أخانا ومعاوننا في خدمة الله بنشر الإنجيل، لكي يشددكم ويشجعكم في إيمانكم،"]]}, {"l": "Phm 1:2", "n": "", "vs": [[2, "وإلى أبفية الأخت، وأرخيبوس رفيقنا في التجند، وإلى الكنيسة التي في بيتك."]]}, {"l": "Phm 1:24", "n": "", "vs": [[24, "وكذلك مرقس، وأرسترخس، وديماس، ولوقا زملائي في العمل."]]}], "kwAr": "شركاء لهم", "noteAr": ""}], "arS": [["فعلينا", ["G3784"]], [" نحن أن ", []], ["نرحب", ["G618"]], [" ", []], ["بأمثال", ["G5108"]], [" هؤلاء لكي نكون حقا ", []], ["شركاء", ["G4904"]], [" لهم في خدمة ", []], ["الحق", ["G225"]], [".", []]]}, {"c": 1, "v": 9, "text": "كتبت كلمة إلى الكنيسة بشأن هذا الأمر. ولكن ديوتريفوس، الذي يحب أن يفرض نفسه عليهم قائدا لا يقبلنا.", "groups": [{"kw": "who loveth", "raw": "Ο φιλοπρωτευων who loveth the presidency, or chief place, doubtless in the church, of which Diotrephes was most probably an officer; and being one, magnified himself in his office: he loved such pre-eminence, and behaved haughtily in it. Mat_20:20-28, Mat_23:4-8; Mar_9:34, Mar_10:35-45; Luk_22:24-27; Rom_12:10; Phi_2:3-5; Tit_1:7-16", "note": "Ο φιλοπρωτευων who loveth the presidency, or chief place, doubtless in the church, of which Diotrephes was most probably an officer; and being one, magnified himself in his office: he loved such pre-eminence, and behaved haughtily in it. Mat_20:20-28, Mat_23:4-8; Mar_9:34, Mar_10:35-45; Luk_22:24-27; Rom_12:10; Phi_2:3-5; Tit_1:7-16", "refs": [{"l": "Mat 20:20-28", "n": "", "vs": [[20, "فتقدمت إليه أم ابني زبدي وهما معها، وسجدت له تطلب منه معروفا."], [21, "فقال لها: «ماذا تريدين؟» أجابت: «قل أن يجلس ابناي هذان: أحدهما عن يمينك، والآخر عن يسارك، في مملكتك!»"], [22, "فأجاب يسوع قائلا ليعقوب ويوحنا: «أنتما لا تدريان ما تطلبان! أتقدران أن تشربا الكأس التي سأشربها؟» أجاباه: «نعم، نقدر!»"], [23, "فقال لهما: «كأسي سوف تشربان. أما الجلوس عن يميني وعن يساري، فليس لي أن أمنحه إلا للذين أعده أبي لهم! »"], [24, "وعندما سمع التلاميذ العشرة بذلك، استاؤوا من الأخوين"], [25, "فاستدعاهم يسوع جميعا وقال: «تعلمون أن حكام الأمم يسودونهم، وعظماءهم يتسلطون عليهم."], [26, "وأما أنتم، فلا يكن ذلك بينكم، وإنما أي من أراد أن يصير عظيما بينكم، فليكن لكم خادما،"], [27, "وأي من أراد أن يصير أولا فيكم، فليكن لكم عبدا،"], [28, "فهكذا ابن الإنسان: قد جاء لا ليخدم، بل ليخدم ويبذل نفسه فدية عن كثيرين. »"]]}, {"l": "Mat 23:4-8", "n": "", "vs": [[4, "بل يحزمون أحمالا ثقيلة لا تطاق ويضعونها على أكتاف الناس، ولكنهم هم لا يريدون أن يحركوها بطرف الإصبع."], [5, "وكل ما يعملونه، فإنما يعملونه لكي يلفتوا نظر الناس إليهم. فهم يعرضون عصائبهم ويطيلون أطراف أثوابهم؛"], [6, "ويحبون أماكن الصدارة في الولائم، وصدور المجالس في المجامع،"], [7, "وأن تلقى عليهم التحيات في الساحات، وأن يدعوهم الناس: يامعلم، يامعلم."], [8, "أما أنتم، فلا تقبلوا أن يدعوكم أحد: يامعلم! لأن معلمكم واحد، وأنتم جميعا إخوة."]]}, {"l": "Mar 9:34", "n": "", "vs": [[34, "فسكتوا، إذ كانوا في الطريق قد تجادلوا في من هو الأعظم بينهم."]]}, {"l": "Mar 10:35-45", "n": "", "vs": [[35, "عندئذ تقدم إليه يعقوب ويوحنا ابنا زبدي، وقالا له: «يامعلم، نرغب في أن تفعل لنا كل ما نطلب منك»."], [36, "فسألهما: «ماذا ترغبان في أن أفعل لكما؟»"], [37, "قالا له: «هبنا أن نجلس في مجدك: واحد عن يمينك، وواحد عن يسارك!»"], [38, "فقال لهما يسوع: «أنتما لا تدريان ما تطلبان: أتقدران أن تشربا الكأس التي سأشربها أنا، أو تتعمدا بالمعمودية التي سأتعمد بها أنا؟»"], [39, "فقالا له: «إننا نقدر!» فأجابهما يسوع: «الكأس التي سأشربها سوف تشربان، وبالمعمودية التي سأتعمد بها سوف تتعمدان."], [40, "أما الجلوس عن يميني وعن يساري، فليس لي أن أمنحه إلا للذين أعد لهم»."], [41, "ولما سمع التلاميذ العشرة بذلك، أخذوا يستاءون من يعقوب ويوحنا."], [42, "ولكن يسوع دعاهم إليه وقال لهم: «تعرفون أن المعتبرين حكاما على الأمم يسودونهم، وأن عظماءهم يتسلطون عليهم."], [43, "وأما أنتم فلا يكن ذلك بينكم، وإنما أي من أراد أن يصير عظيما بينكم، فليكن لكم خادما،"], [44, "وأي من أراد أن يصير أولا فيكم، فليكن للجميع عبدا."], [45, "فحتى ابن الإنسان قد جاء لا ليخدم، بل ليخدم ويبذل نفسه فدية عن كثيرين»."]]}, {"l": "Luk 22:24-27", "n": "", "vs": [[24, "وقام بينهم أيضا جدال في أيهم يحسب الأعظم."], [25, "فقال لهم: «إن ملوك الأمم يسودونهم، وأصحاب السلطة عندهم يدعون محسنين."], [26, "وأما أنتم، فلا يكن ذلك بينكم، بل ليكن الأعظم بينكم كالأصغر، والقائد كالخادم."], [27, "فمن هو أعظم: الذي يتكيء أم الذي يخدم؟ أليس الذي يتكيء؟ ولكني أنا في وسطكم كالذي يخدم."]]}, {"l": "Rom 12:10", "n": "", "vs": [[10, "أحبوا بعضكم بعضا محبة أخوية، مفضلين بعضكم على بعض في الكرامة."]]}, {"l": "Phi 2:3-5", "n": "", "vs": [[3, "لا يكن بينكم شيء بروح التحزب والافتخار الباطل، بل بالتواضع ليعتبر كل واحد منكم غيره أفضل كثيرا من نفسه،"], [4, "مهتما لا بمصلحته الخاصة بل بمصالح الآخرين أيضا."], [5, "فليكن فيكم هذا الفكر الذي هو أيضا في المسيح يسوع."]]}, {"l": "Tit 1:7-16", "n": "", "vs": [[7, "وذلك لأن الناظر يجب أن يكون بريئا من كل تهمة باعتباره وكيلا لله، لا معجبا بنفسه ولا حاد الطبع، ولا مدمن الخمر، ولا عنيفا، ولا ساعيا إلى المكسب الخسيس؛"], [8, "بل مضيافا، محبا للصلاح، رزينا، بارا، تقيا، مالكا لطبعه،"], [9, "ملتصقا بالكلمة الصادقة الموافقة للتعليم، ليكون قادرا على تشجيع المؤمنين بالتعليم الصحيح وعلى إفحام المعارضين."], [10, "فإن هنالك كثيرين من معلمي الباطل المتمردين وخادعي عقول الناس، وبخاصة الذين من أهل الختان."], [11, "هؤلاء يجب أن تسد أفواههم: فهم يخربون بيوتا بجملتها، إذ يعلمون تعاليم يجب ألا تعلم، في سبيل مكسب خسيس."], [12, "وقد قال واحد منهم، وهو عندهم نبي خاص بهم: «أهل كريت دائما كذابون، وحوش شرسة، نهمون كسالى»."], [13, "وهذه شهادة صدق. لذلك كن متشددا في توبيخهم، ليكونوا أصحاء في الإيمان،"], [14, "لا يديرون عقولهم إلى خرافات يهودية ووصايا أناس تحولوا عن الحق بعيدا."], [15, "عند الطاهرين، كل شيء طاهر. أما عند النجسين وغير المؤمنين، فما من شيء طاهر، بل إن عقولهم وضمائرهم أيضا قد صارت نجسة."], [16, "يشهدون معترفين بأنهم يعرفون الله ، ولكنهم بأعمالهم ينكرونه، لأنهم مكروهون وغير طائعين، وقد تبين أنهم غير أهل لكل عمل صالح."]]}], "kwAr": "يحب أن يفرض نفسه عليهم قائدا", "noteAr": "Ο φιλοπρωτευων: الذي يحب الرئاسة أو المكان الأول، في الكنيسة بلا شك، وكان ديوتريفوس على الأرجح أحد مسؤوليها؛ فتعاظم في منصبه وأحب هذه الصدارة وتصرّف فيها بتكبّر."}, {"kw": "receiveth", "raw": "3Jo_1:8; Mat_10:40-42; Mar_9:37; Luk_9:48", "note": "", "refs": [{"l": "3Jo 1:8", "n": "", "vs": [[8, "فعلينا نحن أن نرحب بأمثال هؤلاء لكي نكون حقا شركاء لهم في خدمة الحق."]]}, {"l": "Mat 10:40-42", "n": "", "vs": [[40, "من يقبلكم، يقبلني؛ ومن يقبلني، يقبل الذي أرسلني."], [41, "من يرحب بنبي لكونه نبيا، فإنه ينال مكافأة نبي؛ ومن يرحب برجل بار لكونه بارا، فإنه ينال مكافأة بار."], [42, "وأي من سقى واحدا من هؤلاء الصغار ولو كأس ماء بارد، فقط لأنه تلميذ لي، فالحق أقول لكم: إن مكافأته لن تضيع أبدا»."]]}, {"l": "Mar 9:37", "n": "", "vs": [[37, "«أي من قبل باسمي واحدا مثل هذا من الأولاد الصغار، فقد قبلني. ومن قبلني، فلا يقبلني أنا، بل ذاك الذي أرسلني»."]]}, {"l": "Luk 9:48", "n": "", "vs": [[48, "وقال لهم: «أي من قبل باسمي هذا الولد الصغير، فقد قبلني؛ ومن قبلني، يقبل الذي أرسلني. فإن من كان الأصغر بينكم جميعا، فهو العظيم»."]]}], "kwAr": "لا يقبلنا", "noteAr": ""}], "arS": [["كتبت", ["G1125"]], [" كلمة إلى ", []], ["الكنيسة", ["G1577"]], [" بشأن هذا الأمر. ولكن ", []], ["ديوتريفوس", ["G1361"]], ["، الذي يحب أن ", []], ["يفرض نفسه عليهم قائدا", ["G5383"]], [" لا ", []], ["يقبلنا", ["G1926"]], [".", []]]}, {"c": 1, "v": 10, "text": "لهذا، سألفت الانتباه إلى الأعمال التي يقوم بها، حين أجيء. إنه يثير ضدنا تهما كاذبة، متكلما بأسلوب خبيث. وهو لا يكتفي بهذا، بل يرفض استقبال الإخوة المسافرين، ويمنع الذين يريدون استقبالهم، ويطردهم من الكنيسة أيضا.", "groups": [{"kw": "I will", "raw": "1Co_5:1-5; 2Co_10:1-11, 2Co_13:2", "note": "", "refs": [{"l": "1Co 5:1-5", "n": "", "vs": [[1, "قد شاع فعلا أن بينكم زنى. ومثل هذا الزنى لا يوجد حتى بين الأمم. ذلك بأن رجلا منكم يعاشر زوجة أبيه."], [2, "ومع ذلك، فأنتم منتفخون تكبرا، بدلا من أن تنوحوا حتى يستأصل من بينكم مرتكب هذا الفعل!"], [3, "فإني، وأنا غائب عنكم بالجسد ولكن حاضر بينكم بالروح، قد حكمت على الفاعل كأني حاضر:"], [4, "باسم ربنا يسوع المسيح، إذ تجتمعون معا، وروحي معكم، فبسلطة ربنا يسوع المسيح،"], [5, "تقررون تسليم مرتكب هذا الفعل إلى الشيطان، ليهلك جسده؛ أما روحه فتخلص في يوم الرب يسوع."]]}, {"l": "2Co 10:1-11", "n": "", "vs": [[1, "ولكني أتوسل إليكم بوداعة المسيح وحلمه، أنا بولس «المتواضع وأنا حاضر بينكم، والجريء عليكم وأنا غائب عنكم»،"], [2, "راجيا ألا تضطروني لأن أكون جريئا عند حضوري، فألجأ إلى الحزم الذي أظن أني سأتجرأ عليه في معاملة من يظنون منكم أننا نسلك وفقا للجسد."], [3, "فمع أننا نعيش في الجسد، فإننا لا نحارب وفقا للجسد."], [4, "فإن الأسلحة التي نحارب بها ليست جسدية، بل قادرة بالله على هدم الحصون: بها نهدم النظريات"], [5, "وكل ما يعلو مرتفعا لمقاومة معرفة الله، ونأسر كل فكر إلى طاعة المسيح."], [6, "ونحن على استعداد لمعاقبة كل عصيان، بعد أن تكون طاعتكم قد اكتملت."], [7, "أتحكمون على الأمور بحسب ظواهرها؟ إن كانت لأحد ثقة في نفسه بأنه يخص المسيح، فليفكر أيضا في نفسه بأنه كما يخص هو المسيح، كذلك نخصه نحن أيضا."], [8, "فإني، وإن كنت أفتخر ولو قليلا أكثر مما يجب، بسلطتنا التي أعطانا إياها الرب لبنيانكم لا لهدمكم، لن أضطر إلى الخجل،"], [9, "حتى لا أظهر كأني أخوفكم بالرسائل."], [10, "فمنكم من يقول: «رسائله شديدة اللهجة وقوية؛ أما حضوره الشخصي فضعيف، وكلامه حقير»."], [11, "فليتنبه مثل هذا إلى أننا كما نكون بالقول في الرسائل ونحن غائبون، كذلك نحن أيضا بالفعل ونحن حاضرون."]]}, {"l": "2Co 13:2", "n": "", "vs": [[2, "سبق لي أن أعلنت، وها أنا أقول مقدما وأنا غائب، كما قلت وأنا حاضر عندكم في المرة الثانية، للذين أخطأوا في الماضي وللباقين جميعا: إني إذا عدت إليكم فلا أشفق،"]]}], "kwAr": "سألفت الانتباه", "noteAr": ""}, {"kw": "prating", "raw": "Pro_10:8, Pro_10:10", "note": "", "refs": [{"l": "Pro 10:8", "n": "", "vs": [[8, "الحكيم القلب يتقبل الوصايا، والمتبجح الشفتين مصيره الخراب."]]}, {"l": "Pro 10:10", "n": "", "vs": [[10, "من يغمز بعينه مكرا يولد غما. والموبخ بجرأة يصنع سلاما."]]}], "kwAr": "يثير ضدنا تهما كاذبة", "noteAr": ""}, {"kw": "and casteth", "raw": "Isa_66:5; Luk_6:22; Joh_9:22, Joh_9:34, Joh_9:35", "note": "", "refs": [{"l": "Isa 66:5", "n": "", "vs": [[5, "اسمعوا قول الرب أيها المرتعدون من كلامه: يسخر منكم إخوتكم الذين يكرهونكم وينبذونكم لأنكم تخافون اسمي قائلين: ليتمجد الرب حتى نشهد فرحكم. ولكنهم لا يعرفون أنهم هم الذين يخزون."]]}, {"l": "Luk 6:22", "n": "", "vs": [[22, "طوبى لكم متى أبغضكم الناس، وعزلوكم، وأهانوا اسمكم ونبذوه كأنه شرير، من أجل ابن الإنسان."]]}, {"l": "Joh 9:22", "n": "", "vs": [[22, "وقد قال والداه هذا لخوفهما من اليهود، لأن اليهود كانوا قد اتفقوا أن يطردوا من المجمع كل من يعترف أن يسوع هو المسيح."]]}, {"l": "Joh 9:34", "n": "", "vs": [[34, "فصاحوا به: «أنت بكاملك ولدت في الخطيئة وتعلمنا؟!» ثم طردوه خارج المجمع."]]}, {"l": "Joh 9:35", "n": "", "vs": [[35, "وعرف يسوع بطرده خارجا، فقصد إليه وسأله: «أتؤمن بابن الله؟»"]]}], "kwAr": "يطردهم من الكنيسة", "noteAr": ""}], "arS": [["لهذا، ", []], ["سألفت الانتباه", ["G5279"]], [" إلى ", []], ["الأعمال", ["G2041"]], [" التي ", []], ["يقوم", ["G4160"]], [" بها، حين ", []], ["أجيء", ["G2064"]], [". إنه ", []], ["يثير ضدنا تهما كاذبة", ["G5396"]], ["، متكلما بأسلوب ", []], ["خبيث", ["G4190"]], [". وهو لا ", []], ["يكتفي", ["G714"]], [" بهذا، بل يرفض ", []], ["استقبال", ["G1926"]], [" ", []], ["الإخوة", ["G80"]], [" المسافرين، ", []], ["ويمنع", ["G2967"]], [" الذين ", []], ["يريدون", ["G1014"]], [" استقبالهم، ", []], ["ويطردهم", ["G1544"]], [" من ", []], ["الكنيسة", ["G1577"]], [" أيضا.", []]]}, {"c": 1, "v": 11, "text": "أيها الحبيب، لا تقتد بما هو شر، بل بما هو خير. فإن من يفعل الخير، يكون من الله. ومن يفعل الشر، يبين أنه لم يتعرف بالله قط.", "groups": [{"kw": "Beloved", "raw": "Beloved, αγαπητε [Strongs G27], is in the vocative singular, and therefore refers to Gaius.", "note": "Beloved, αγαπητε [Strongs G27], is in the vocative singular, and therefore refers to Gaius.", "refs": [], "kwAr": "أيها الحبيب", "noteAr": "«أيها الحبيب» αγαπητε [Strongs G27] بصيغة النداء المفرد، فهي موجهة إلى غايوس."}, {"kw": "follow", "raw": "Rather, imitate μιμου. Exo_23:2; Psa_37:27; Pro_12:11; Isa_1:16, Isa_1:17; Joh_10:27, Joh_12:26; 1Co_4:16, 1Co_11:1; Eph_5:1; Phi_3:17; 1Th_1:6, 1Th_2:14; 2Ti_3:10 *marg. Heb_6:12; 1Pe_3:13", "note": "Rather, imitate μιμου. Exo_23:2; Psa_37:27; Pro_12:11; Isa_1:16, Isa_1:17; Joh_10:27, Joh_12:26; 1Co_4:16, 1Co_11:1; Eph_5:1; Phi_3:17; 1Th_1:6, 1Th_2:14; 2Ti_3:10 *marg. Heb_6:12; 1Pe_3:13", "refs": [{"l": "Exo 23:2", "n": "", "vs": [[2, "لا تنسق وراء الأغلبية لارتكاب الشر، ولا تحرف شهادتك في دعوى انجرافا مع الأكثرية،"]]}, {"l": "Psa 37:27", "n": "", "vs": [[27, "حد عن الشر واصنع الخير، فتسكن مطمئنا إلى الأبد."]]}, {"l": "Pro 12:11", "n": "", "vs": [[11, "من يفلح أرضه، تكثر غلة خبزه، ومن يلاحق الأوهام فهو أحمق."]]}, {"l": "Isa 1:16", "n": "", "vs": [[16, "اغتسلوا، تطهروا، أزيلوا شر أعمالكم من أمام عيني. كفوا عن اقتراف الإثم،"]]}, {"l": "Isa 1:17", "n": "", "vs": [[17, "وتعلموا الإحسان، انشدوا الحق، انصفوا المظلوم، اقضوا لليتيم، ودافعوا عن الأرملة."]]}, {"l": "Joh 10:27", "n": "", "vs": [[27, "فخرافي تصغي لصوتي، وأنا أعرفها وهي تتبعني،"]]}, {"l": "Joh 12:26", "n": "", "vs": [[26, "من أراد أن يخدمني فليتبعني. وحيث أكون أنا يكون خادمي أيضا. وكل من يخدمني يكرمه أبي."]]}, {"l": "1Co 4:16", "n": "", "vs": [[16, "فأدعوكم _3:20", "note": "", "refs": [{"l": "Joh 3:20", "n": "", "vs": [[20, "فكل من يعمل الشر يبغض النور، ولا يأتي إليه مخافة أن تفضح أعماله."]]}], "kwAr": "من يفعل الشر", "noteAr": ""}], "arS": [["أيها ", []], ["الحبيب", ["G27"]], ["، لا ", []], ["تقتد", ["G3401"]], [" بما هو ", []], ["شر", ["G2556"]], ["، بل بما هو ", []], ["خير", ["G18"]], [". فإن من ", []], ["يفعل الخير", ["G15"]], ["، يكون من ", []], ["الله", ["G2316"]], [". ومن ", []], ["يفعل الشر", ["G2554"]], ["، يبين أنه لم ", []], ["يتعرف", ["G3708"]], [" ", []], ["بالله", ["G2316"]], [" قط.", []]]}, {"c": 1, "v": 12, "text": "أما ديمتريوس، فالجميع يشهدون له شهادة طيبة. حتى الحق نفسه يشهد له. ونحن أيضا نشهد له. وأنتم تثقون بصدق ما نشهد به.", "groups": [{"kw": "good", "raw": "Act_10:22, Act_22:12; 1Th_4:12; 1Ti_3:7", "note": "", "refs": [{"l": "Act 10:22", "n": "", "vs": [[22, "فأجابوه: «قائد المئة كرنيليوس رجل صالح يتقي الله ، ويشهد له بذلك شعب اليهود جميعا. وقد أوحى الله إليه بواسطة ملاك طاهر أن يستدعيك إلى بيته ليسمع ما عندك من كلام»."]]}, {"l": "Act 22:12", "n": "", "vs": [[12, "وكان في دمشق رجل اسمه حنانيا، تقي كما تقضي الشريعة، يشهد له يهود دمشق جميعا شهادة حسنة."]]}, {"l": "1Th 4:12", "n": "", "vs": [[12, "عندئذ تكون سيرتكم حسنة السمعة تجاه الذين من خارج الكنيسة، ولا تكونون في حاجة إلى شيء."]]}, {"l": "1Ti 3:7", "n": "", "vs": [[7, "ومن الضروري أن تكون له شهادة حسنة من الذين في خارج الكنيسة، لكي لا يقع في العار وفي فخ إبليس."]]}], "kwAr": "يشهدون له شهادة طيبة", "noteAr": ""}, {"kw": "and we", "raw": "Joh_19:35, Joh_21:24", "note": "", "refs": [{"l": "Joh 19:35", "n": "", "vs": [[35, "والذي رأى هذا هو يشهد، وشهادته حق وهو يعلم تماما أنه يقول الحق، لكي تؤمنوا أنتم أيضا."]]}, {"l": "Joh 21:24", "n": "", "vs": [[24, "هذا التلميذ هو الذي يشهد بهذه الأمور، وقد دونها هنا. ونحن نعلم أن شهادته حق."]]}], "kwAr": "ونحن أيضا نشهد له", "noteAr": ""}], "arS": [["أما ", []], ["ديمتريوس", ["G1216"]], ["، ", []], ["فالجميع", ["G3956"]], [" ", []], ["يشهدون", ["G3140"]], [" له شهادة طيبة. حتى ", []], ["الحق", ["G225"]], [" ن
