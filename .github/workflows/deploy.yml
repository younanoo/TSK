name: Deploy godod.app

# Runs only when changes are pushed to main
on:
  push:
    branches:
      - main

concurrency:
  group: deploy-godod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SERVER_HOST: ${{ vars.SERVER_HOST }}   # 162.35.41.191
      SERVER_USER: ${{ vars.SERVER_USER }}   # deploy
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      SITE_DIR: /var/www/godod

    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for v in SERVER_HOST SERVER_USER SSH_KEY KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then echo "::error::Missing GitHub variable/secret: $v"; exit 1; fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: git pull main on server
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o BatchMode=yes -o ConnectTimeout=20 \
            "$SERVER_USER@$SERVER_HOST" "SITE_DIR='$SITE_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$SITE_DIR"
          echo "Server: $(hostname) | User: $(whoami) | Dir: $SITE_DIR"

          branch=$(git branch --show-current)
          if [ "$branch" != "main" ]; then
            echo "::error::Server is on branch '$branch', not main. Deploy stopped."
            exit 1
          fi

          before=$(git rev-parse --short HEAD)
          GIT_TERMINAL_PROMPT=0 git pull --ff-only origin main
          after=$(git rev-parse --short HEAD)

          if [ "$before" = "$after" ]; then
            echo "Already up to date: $after"
          else
            echo "Updated: $before -> $after"
            git diff --stat "$before" "$after" | tail -n 25
          fi
          git log -1 --format='Deployed commit: %h %s (%an, %ad)'
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
