 same final desolation of the land. Some think that the period of 390 days also predicts the duration of the siege of the Babylonians (Eze_4:9), deducting from it five months and twenty-nine days, when the besiegers went to meet the Egyptians (2Ki_25:1-4; Jer_37:5); and that forty days may have been employed in desolating the temple and city. Beginning from 2Ki_23:3, 2Ki_23:23. Ending Jer_52:30.", "refs": [{"l": "Eze 4:9", "n": "", "vs": [[9, "أما أنت فخذ لنفسك قمحا وشعيرا وفولا وعدسا ودخنا وكرسنة، واعجنها في وعاء واحد، واصنع لنفسك خبزا تأكل منه ثلاث مئة وتسعين يوما كعدد الأيام التي تتكيء فيها على جنبك."]]}, {"l": "2Ki 25:1-4", "n": "", "vs": [[1, "وفي السنة التاسعة لملك صدقيا، في اليوم العاشر من الشهر العاشر، زحف نبوخذناصر ملك بابل بكامل جيشه على أورشليم وحاصرها، وأقام حولها أبراجا."], [2, "واستمر حصار أورشليم حتى العام الحادي عشر من ملك صدقيا"], [3, "وفي اليوم التاسع من الشهر الرابع من تلك السنة، تفاقمت المجاعة في المدينة، حتى لم يجد أهلها خبزا يأكلونه."], [4, "وفي تلك الليلة فتح صدقيا ورجاله ثغرة في سور المدينة، وتسلل مع رجاله المحاربين من خلال البوابة القائمة بين السورين نحو حديقة الملك. وكان الكلدانيون محيطين بالمدينة. فتوجه صدقيا ومقاتلوه إلى طريق الصحراء."]]}, {"l": "Jer 37:5", "n": "", "vs": [[5, "وزحف جيش فرعون من مصر، فبلغ خبرهم الكلدانيين الذين يحاصرون أورشليم، ففكوا عنها الحصار."]]}, {"l": "2Ki 23:3", "n": "", "vs": [[3, "ووقف الملك على المنبر وقطع عهدا أمام الرب أن يتبع الرب، حافظا وصاياه وشهاداته وفرائضه من كل القلب والنفس، لتطبيق كلام هذا العهد المدون في هذا السفر. فوعد الشعب بالوفاء بهذا العهد."]]}, {"l": "2Ki 23:23", "n": "", "vs": [[23, "ولكن في السنة الثامنة عشرة لحكم الملك يوشيا احتفل بهذا الفصح للرب في أورشليم"]]}, {"l": "Jer 52:30", "n": "", "vs": [[30, "وفي السنة الثالثة والعشرين لحكم نبوخذناصر سبى نبوزرادان رئيس الشرطة من اليهود سبع مئة وخمسة وأربعين شخصا، فكانت جملة المسبيين أربعة آلاف وست مئة شخص."]]}], "kwAr": "أربعين يوما", "noteAr": "هذا يمثل الأربعين سنة التي سادت فيها الوثنية الفاحشة في يهوذا، منذ إصلاح يوشيا، 624 ق.م.، إلى الخراب النهائي نفسه للبلاد. ويرى بعضهم أن مدة الـ390 يوما تتنبأ أيضا بمدة حصار البابليين (حز 4: 9)، بعد حذف خمسة أشهر وتسعة وعشرين يوما حين مضى المحاصرون للقاء المصريين (2مل 25: 1-4؛ إر 37: 5)؛ وأن الأربعين يوما ربما استُغرقت في تخريب الهيكل والمدينة. البداية: انظر 2مل 23: 3، 23 والنهاية: انظر إر 52: 30"}, {"kw": "each day for a year", "raw": "Heb. a day for a year, a day for a year, Num_14:34; Dan_9:24-26, Dan_12:11, Dan_12:12; Rev_9:15, Rev_11:2, Rev_11:3, Rev_12:14, Rev_13:5", "note": "Heb. a day for a year, a day for a year, Num_14:34; Dan_9:24-26, Dan_12:11, Dan_12:12; Rev_9:15, Rev_11:2, Rev_11:3, Rev_12:14, Rev_13:5", "refs": [{"l": "Num 14:34", "n": "", "vs": [[34, "وتحملون أوزاركم أربعين سنة. كل يوم بسنة، على عدد الأيام الأربعين التي تجسستم فيها الأرض، فتدركون عاقبة ابتعادي عنكم."]]}, {"l": "Dan 9:24-26", "n": "", "vs": [[24, "قد صدر القضاء أن يمضي سبعون أسبوعا على شعبك وعلى مدينة قدسك، للانتهاء من المعصية والقضاء على الخطيئة، وللتكفير عن الإثم، ولإشاعة البر الأبدي وختم الرؤيا والنبوءة ولمسح قدوس القدوسين."], [25, "لهذا فاعلم وافهم أن الحقبة الممتدة منذ صدور الأمر بإعادة بناء أورشليم إلى مجيء المسيح، سبعة أسابيع، ثم اثنان وستون أسبوعا يبنى في غضونها سوق وخليج. إنما تكون تلك أزمنة ضيق."], [26, "وبعد اثنين وستين أسبوعا يقتل المسيح، ولكن ليس من أجل نفسه، ويدمر شعب رئيس آت المدينة والقدس، وتقبل آخرتها كطوفان، وتستمر الحرب حتى النهاية، ويعم الخراب المقضي به."]]}, {"l": "Dan 12:11", "n": "", "vs": [[11, "أما الفترة ما بين إزالة المحرقة الدائمة وإقامة رجس المخرب، فهي ألف ومئتان وتسعون يوما."]]}, {"l": "Dan 12:12", "n": "", "vs": [[12, "فطوبى لمن ينتظر حتى يبلغ إلى الألف والثلاث مئة والخمسة والثلاثين يوما."]]}, {"l": "Rev 9:15", "n": "", "vs": [[15, "وكان هؤلاء الملائكة الأربعة مجهزين استعدادا لهذه الساعة واليوم والشهر والسنة، فأطلقوا ليقتلوا ثلث البشر."]]}, {"l": "Rev 11:2", "n": "", "vs": [[2, "وقيل لي: «لا تقس الساحة الخارجية لأنها خصصت للأمم، وسيدوسون المدينة المقدسة مدة اثنين وأربعين شهرا،"]]}, {"l": "Rev 11:3", "n": "", "vs": [[3, "ولكني سأمنح شاهدي أن يتنبآ مدة ألف ومئتين وستين يوما، وهما يلبسان ثوبين من الوبر»."]]}, {"l": "Rev 12:14", "n": "", "vs": [[14, "فأعطيت المرأة جناحي النسر العظيم، لتطير بهما إلى البر ية، إلى المكان المجهز لها، حيث تعال بمأمن من الحية، مدة ثلاث سنوات ونصف سنة."]]}, {"l": "Rev 13:5", "n": "", "vs": [[5, "وأعطى التنين الوحش فما ينطق بكلام الكبرياء والتجديف، وأعطاه سلطة العمل مدة اثنين وأربعين شهرا."]]}], "kwAr": "كل يوم مقابل سنة", "noteAr": "بالعبرية: يوم لسنة، يوم لسنة. انظر عد 14: 34؛ دا 9: 24-26؛ 12: 11، 12؛ رؤ 9: 15؛ 11: 2، 3؛ 12: 14؛ 13: 5"}], "arS": [["وحالما ", []], ["تكملها", ["H3615", "H428"]], [" ", []], ["عد", ["H8145"]], [" ", []], ["فاتكيء", ["H7901"]], [" على ", []], ["جانبك", ["H6654"]], [" ", []], ["الأيمن", ["H3233"]], ["، ", []], ["واحمل", ["H5375"]], [" ", []], ["إثم", ["H5771"]], [" ", []], ["شعب", ["H1004"]], [" ", []], ["يهوذا", ["H3063"]], [" ", []], ["أربعين", ["H705"]], [" ", []], ["يوما", ["H3117"]], [". إذ ", []], ["جعلت", ["H5414"]], [" كل ", []], ["يوم", ["H3117"]], [" مقابل ", []], ["سنة", ["H8141"]], [".", []]]}, {"c": 4, "v": 7, "text": "ثم ثبت وجهك نحو حصار أورشليم بذراع مكشوفة، وتنبأ عليها،", "groups": [{"kw": "set", "raw": "Eze_4:3, Eze_6:2", "note": "", "refs": [{"l": "Eze 4:3", "n": "", "vs": [[3, "ثم خذ لنفسك صاجا من حديد واجعله سورا من حديد بينك وبين المدينة، وثبت وجهك عليها فتصبح محاصرة وأنت تحاصرها، فتكون هذه علامة لشعب إسرائيل."]]}, {"l": "Eze 6:2", "n": "", "vs": [[2, "«ياابن آدم، التفت بوجهك نحو جبال إسرائيل وتنبأ عليها،"]]}], "kwAr": "ثبت وجهك", "noteAr": ""}, {"kw": "and thine", "raw": "Isa_52:10", "note": "", "refs": [{"l": "Isa 52:10", "n": "", "vs": [[10, "شمر الرب عن ذراع قدسه أمام عيون كل الأمم، فترى أقاصي الأرض خلاص إلهنا."]]}], "kwAr": "بذراع مكشوفة", "noteAr": ""}], "arS": [["ثم ", []], ["ثبت", ["H3559"]], [" ", []], ["وجهك", ["H6440"]], [" نحو ", []], ["حصار", ["H4692"]], [" ", []], ["أورشليم", ["H3389"]], [" ", []], ["بذراع", ["H2220"]], [" ", []], ["مكشوفة", ["H2834"]], ["، ", []], ["وتنبأ", ["H5012"]], [" ", []], ["عليها", ["H5921"]], ["،", []]]}, {"c": 4, "v": 8, "text": "وها أنا أوثقك بحبال لئلا تتقلب من جنب إلى جنب حتى تكتمل أيام حصارك.", "groups": [{"kw": "I will", "raw": "Eze_3:25", "note": "", "refs": [{"l": "Eze 3:25", "n": "", "vs": [[25, "وأنت ياابن آدم، ها هم يربطونك بالحبال ويقيدونك فلا تخرج في ما بينهم."]]}], "kwAr": "أوثقك بحبال", "noteAr": ""}, {"kw": "from one side to another", "raw": "Heb. from thy side to thy side", "note": "Heb. from thy side to thy side", "refs": [], "kwAr": "من جنب إلى جنب", "noteAr": "بالعبرية: من جنبك إلى جنبك."}], "arS": [["وها أنا ", []], ["أوثقك", ["H5414"]], [" ", []], ["بحبال", ["H5688"]], [" لئلا ", []], ["تتقلب", ["H2015"]], [" من ", []], ["جنب", ["H4480", "H6654"]], [" إلى ", []], ["جنب", ["H6654"]], [" ", []], ["حتى", ["H5704"]], [" ", []], ["تكتمل", ["H3615"]], [" ", []], ["أيام", ["H3117"]], [" ", []], ["حصارك", ["H4692"]], [".", []]]}, {"c": 4, "v": 9, "text": "أما أنت فخذ لنفسك قمحا وشعيرا وفولا وعدسا ودخنا وكرسنة، واعجنها في وعاء واحد، واصنع لنفسك خبزا تأكل منه ثلاث مئة وتسعين يوما كعدد الأيام التي تتكيء فيها على جنبك.", "groups": [{"kw": "wheat", "raw": "Eze_4:13, Eze_4:16", "note": "", "refs": [{"l": "Eze 4:13", "n": "", "vs": [[13, "لأنه هكذا سيأكل أبناء إسرائيل خبزهم النجس بين الأمم الذين أجليهم إليهم»."]]}, {"l": "Eze 4:16", "n": "", "vs": [[16, "ياابن آدم، ها أنا أبيد مؤونة الخبز في أورشليم، فيأكلون الخبز بالوزن معجونا بالغم، ويشربون الماء بالكيل ممزوجا بالحيرة."]]}], "kwAr": "قمحا", "noteAr": ""}, {"kw": "millet", "raw": "Dochan in Arabic, dokhn the holcus dochna of Forskal, is a kind of millet, of considerable use as a food; the cultivation of which is described by Browne.", "note": "Dochan in Arabic, dokhn the holcus dochna of Forskal, is a kind of millet, of considerable use as a food; the cultivation of which is described by Browne.", "refs": [], "kwAr": "دخنا", "noteAr": "«دُخن» بالعربية، وهو holcus dochna عند فورسكال، نوع من الذرة الرفيعة ذو فائدة كبيرة كغذاء، وقد وصف براون زراعته."}, {"kw": "fitches", "raw": "or, spelt, Kussemim is doubtless ζεα, or spelt, as Aquila and Symmachus render here; and so LXX and Theodotion, ολυρα. In times of scarcity it is customary to mix several kinds of coarser grains with the finer, to make it last the longer.", "note": "or, spelt, Kussemim is doubtless ζεα, or spelt, as Aquila and Symmachus render here; and so LXX and Theodotion, ολυρα. In times of scarcity it is customary to mix several kinds of coarser grains with the finer, to make it last the longer.", "refs": [], "kwAr": "كرسنة", "noteAr": "أو: الحنطة البيضاء (spelt). «كوسيميم» هي بلا شك ζεα أي spelt، كما ترجمها أكيلا وسيماخوس، وكذلك السبعينية وثيودوتيون ὀλύρα. وفي أوقات القحط جرت العادة أن تُخلط أصناف الحبوب الأخشن بالأنعم لتدوم مدة أطول."}, {"kw": "three", "raw": "Eze_4:5", "note": "", "refs": [{"l": "Eze 4:5", "n": "", "vs": [[5, "فإني قد جعلت لك عدد أيام كعدد سنوات إثمهم: ثلاث مئة وتسعين يوما. فتحمل عبء إثم شعب إسرائيل."]]}], "kwAr": "ثلاث مئة وتسعين يوما", "noteAr": ""}], "arS": [["أما أنت فخذ لنفسك ", []], ["قمحا", ["H2406"]], [" ", []], ["وشعيرا", ["H8184"]], [" ", []], ["وفولا", ["H6321"]], [" ", []], ["وعدسا", ["H5742"]], [" ", []], ["ودخنا", ["H1764"]], [" ", []], ["وكرسنة", ["H3698"]], ["، ", []], ["واعجنها", ["H5414"]], [" في ", []], ["وعاء", ["H3627"]], [" ", []], ["واحد", ["H259"]], ["، ", []], ["واصنع", ["H6213"]], [" لنفسك ", []], ["خبزا", ["H3899"]], [" ", []], ["تأكل", ["H398"]], [" منه ", []], ["ثلاث", ["H7969"]], [" ", []], ["مئة", ["H3967"]], [" ", []], ["وتسعين", ["H8673"]], [" ", []], ["يوما", ["H3117"]], [" ", []], ["كعدد", ["H4557"]], [" ", []], ["الأيام", ["H3117"]], [" التي ", []], ["تتكيء", ["H7901"]], [" فيها على ", []], ["جنبك", ["H6654"]], [".", []]]}, {"c": 4, "v": 10, "text": "ويكون وزن كمية الطعام التي تأكلها في كل يوم تعادل عشرين شاقلا (نحو مئتين وأربعين جراما). تأكل وجبة واحدة في اليوم.", "groups": [{"kw": "", "raw": "Eze_4:16, Eze_14:13; Lev_26:26; Deut. 28:51-68; Isa_3:1", "note": "", "refs": [{"l": "Eze 4:16", "n": "", "vs": [[16, "ياابن آدم، ها أنا أبيد مؤونة الخبز في أورشليم، فيأكلون الخبز بالوزن معجونا بالغم، ويشربون الماء بالكيل ممزوجا بالحيرة."]]}, {"l": "Eze 14:13", "n": "", "vs": [[13, "«ياابن آدم، إذا أخطأت إلي أرض وخانت عهدي، أعاقبها وأعوزها مؤونة الخبز وأشيع فيها الجوع، وأفني منها الناس والبهائم،"]]}, {"l": "Lev 26:26", "n": "", "vs": [[26, "وحين أقطع عنكم مؤونة الدقيق، تخبز عشر نساء خبزكم في فرن واحد لقلة الدقيق، وتقسمون الخبز بالميزان فتأكلون ولا تشبعون."]]}, {"l": "Deu 28:51-68", "n": "", "vs": [[51, "فتستولي على نتاج بهائمكم، وتلتهم غلات أرضكم حتى تفنوا، ولا تبقي لكم قمحا ولا خمرا ولا زيتا ولا نتاج بقركم ونعاجكم حتى تهلككم."], [52, "وتحاصركم في جميع مدنكم حتى تتهدم أسواركم الشامخة الحصينة التي وثقتم بمناعتها في كل مدنكم. فتحاصركم في جميع مدنكم في كل أرضكم التي يهبها الرب إلهكم لكم."], [53, "فتأكلون في أثناء الحصار والضيقة التي يضايقكم بها عدوكم ثمار بطونكم، لحم أبنائكم وبناتكم الذين رزقكم بهم الرب إلهكم."], [54, "فيقسو قلب أكثركم رقة ورأفة على أخيه وامرأته التي في حضنه وسائر أبنائه الأحياء."], [55, "فلا يعطي أحدهم من لحم أبنائه، الذي يأكله، لأنه لم يبق لديه شيء سواه في الحصار والضيقة التي يضايقكم بها عدوكم في جميع مدنكم."], [56, "وكذلك فإن أكثر النساء رقة ورأفة، والتي لنعومتها وترفهها لا تجرؤ على لمس الأرض بباطن قدمها، تبخل على زوجها رجل حضنها وعلى ابنها وابنتها"], [57, "بمشيمتها الساقطة منها، وبأولادها الذين تلدهم، لأنها تنوي أن تأكلهم سرا في أثناء الحصار، في الضيقة التي يضايقكم بها عدوكم في كل مدنكم."], [58, "فإن لم تحرصوا على العمل بجميع كلمات هذه الشريعة المكتوبة في هذا الكتاب، لتهابوا اسم الرب إلهكم الجليل المرهوب،"], [59, "فإن الرب يجعل الضربات النازلة بكم وبذريتكم ضربات مخيفة وكوارث رهيبة دائمة وأمراضا خبيثة مزمنة،"], [60, "ويرسل عليكم كل أمراض مصر التي فزعتم منها فتلازمكم،"], [61, "ويسلط الرب عليكم أيضا كل داء وكل بلية لم ترد في كتاب الشريعة هذا، حتى تهلكوا."], [62, "فتصيرون قلة بعد أن كنتم في كثرة نجوم السماء، لأنكم لم تسمعوا صوت الرب إلهكم."], [63, "وكما سر الرب بكم فأحسن إليكم وكثركم، فإنه سيسر بأن يفنيكم ويهلككم فتنقرضون من الأرض التي أنتم ماضون إليها لامتلاكها."], [64, "ويشتتكم الرب بين جميع الأمم من أقصى الأرض كشوفة، وتنبأ عليها،"], [8, "وها أنا أوثقك بحبال لئلا تتقلب من جنب إلى جنب حتى تكتمل أيام حصارك."]]}], "kwAr": "وسط المدينة", "noteAr": ""}, {"kw": "I will draw", "raw": "Eze_5:12, Eze_12:14; Lev_26:33; Jer_9:16; Amo_9:2, Amo_9:3", "note": "", "refs": [{"l": "Eze 5:12", "n": "", "vs": [[12, "ثلث سكانك يموتون بالوباء والجوع في وسطك، وثلث ثان يقتل حولك بالسيف، وثلث أخير أشتته بين الأمم وأتعقبه بسيف مسلول."]]}, {"l": "Eze 12:14", "n": "", "vs": [[14, "وأبدد حاشيته وأعوانه وكل جيوشه في كل مكان وأتعقبهم بسيف مسلول."]]}, {"l": "Lev 26:33", "n": "", "vs": [[33, "وأشتتكم بين الشعوب، وأجرد عليكم سيفي، وألاحقكم، وأحول أرضكم إلى قفر ومدنكم إلى خرائب."]]}, {"l": "Jer 9:16", "n": "", "vs": [[16, "وأشتتهم بين الأمم التي لم يعرفوها هم ولا آباؤهم، وأجعل سيف الدمار يتعقبهم حتى أفنيهم»."]]}, {"l": "Amo 9:2", "n": "", "vs": [[2, "وإن نقبوا لأنفسهم ملجأ في أعماق الهاوية، فإن يدي تطولهم هناك، وإن ارتقوا إلى السماوات فمن هناك أنزلهم."]]}, {"l": "Amo 9:3", "n": "", "vs": [[3, "وإن اختبأوا في أعالي الكرمل فهناك أبحث عنهم وأعتقلهم. وإن تواروا عني في أعماق البحر فإني آمر هناك الحية فتلدغهم."]]}], "kwAr": "أستل سيفا", "noteAr": ""}], "arS": [["واحرق", ["H1197"]], [" ", []], ["بالنار", ["H217"]], [" ", []], ["ثلثا", ["H7992"]], [" في ", []], ["وسط", ["H8432"]], [" ", []], ["المدينة", ["H5892"]], [" إذا ", []], ["اكتملت", ["H4390"]], [" ", []], ["أيام", ["H3117"]], [" ", []], ["الحصار", ["H4692"]], ["، ثم ", []], ["تناول", ["H3947"]], [" ", []], ["ثلثا", ["H7992"]], [" آخر ", []], ["واضربه", ["H5221"]], [" ", []], ["بالسيف", ["H2719"]], [" ", []], ["حول", ["H5439"]], [" خريطة المدينة المرسومة. أما ", []], ["الثلث", ["H7992"]], [" الأخير ", []], ["فذره", ["H2219"]], [" مع ", []], ["الريح", ["H7307"]], ["، وأنا ", []], ["أستل", ["H7324"]], [" ", []], ["سيفا", ["H2719"]], [" ", []], ["خلفه", ["H310"]], [".", []]]}, {"c": 5, "v": 3, "text": "ولكن احتفظ بكمية قليلة منه وصرها في أطراف ثوبك.", "groups": [{"kw": "a few", "raw": "2Ki_25:12; Jer_39:10, Jer_40:6, Jer_52:16; Mat_7:14; Luk_13:23, Luk_13:24; 1Pe_4:18", "note": "", "refs": [{"l": "2Ki 25:12", "n": "", "vs": [[12, "ولكنه ترك فيها فقراء الأرض المساكين ليزرعوها ويفلحوها."]]}, {"l": "Jer 39:10", "n": "", "vs": [[10, "أما الفقراء ممن لم يكن لديهم شيء فتركهم نبوزرادان رئيس الشرطة في أرض يهوذا، ووزع عليهم كروما وحقولا في ذلك اليوم."]]}, {"l": "Jer 40:6", "n": "", "vs": [[6, "فذهب إرميا إلى جدليا بن أخيقام وأقام عنده في وسط الشعب الباقي في الأرض."]]}, {"l": "Jer 52:16", "n": "", "vs": [[16, "ولكنه أبقى على بعض المساكين ليكونوا كرامين وفلاحين."]]}, {"l": "Mat 7:14", "n": "", "vs": [[14, "ما أضيق الباب وأعسر الطريق المؤدي إلى الحياة! وقليلون هم الذين يهتدون إليه."]]}, {"l": "Luk 13:23", "n": "", "vs": [[23, "وسأله أحدهم: «ياسيد، أقليل عدد الذين سيخلصون؟» ولكنه قال للجميع:"]]}, {"l": "Luk 13:24", "n": "", "vs": [[24, "«ابذلوا الجهد للدخول من الباب الضيق، فإني أقول لكم إن كثيرين سيسعون إلى الدخول، فلا يتمكنون."]]}, {"l": "1Pe 4:18", "n": "", "vs": [[18, "وإن كان البار يخلص بجهد، فماذا يحدث للشرير والخاطيء؟"]]}], "kwAr": "كمية قليلة", "noteAr": ""}, {"kw": "skirts", "raw": "Heb. wings", "note": "Heb. wings", "refs": [], "kwAr": "أطراف ثوبك", "noteAr": "بالعبرية: أجنحة."}], "arS": [["ولكن ", []], ["احتفظ", ["H3947"]], [" ", []], ["بكمية", ["H4592"]], [" ", []], ["قليلة", ["H4592"]], [" منه ", []], ["وصرها", ["H6696"]], [" في ", []], ["أطراف", ["H3671"]], [" ثوبك.", []]]}, {"c": 5, "v": 4, "text": "كذلك خذ بعضا من الشعر واطرحه في النار ليحترق، فتندلع منه نار على كل شعب إسرائيل».", "groups": [{"kw": "take", "raw": "2Ki_25:25; Jer. 41:1-44:30, Jer_52:30", "note": "", "refs": [{"l": "2Ki 25:25", "n": "", "vs": [[25, "ولكن في الشهر السابع جاء إسمعيل بن نثنيا بن أليشمع من النسل الملكي، وعشرة رجال معه واغتالوا جدليا، وقتلوا أيضا اليهود والكلدانيين المقيمين معه في المصفاة."]]}, {"l": "Jer 41:1-44:30", "n": "", "vs": [[1, "وفي الشهر السابع أقبل إسمعيل بن نثنيا بن أليشاماع، من النسل الملكي، وأحد قواد الملك، إلى جدليا بن أخيقام إلى المصفاة، برفقة عشرة رجال. وبعد أن تناولوا الطعام معا في المصفاة،"], [2, "اغتال إسمعيل بن نثنيا والعشرة الرجال المرافقون له بسيوفهم جدليا بن أخيقام الذي ولاه ملك بابل حاكما على البلاد."], [3, "كما قتل إسمعيل كل اليهود الحاضرين مع جدليا في المصفاة والكلدانيين المحاربين الموجودين هناك."], [4, "وفي اليوم التالي من اغتيال جدليا، ولم يكن أحد قد علم بالأمر بعد،"], [5, "أقبل ثمانون رجلا من شكيم ومن شيلو ومن السامرة بلحى محلوقة وثياب ممزقة وأجساد مجرحة، حاملين معهم تقدمة من الدقيق ولبانا ليحضروها إلى بيت الرب."], [6, "فخرج إسمعيل بن نثنيا من المصفاة، وكان يسير باكيا، وعندما التقاهم قال لهم: «تعالوا إلى جدليا بن أخيقام»."], [7, "فلما بلغوا وسط المدينة ذبحهم إسمعيل بن نثنيا وطرح جثثهم بمعونة رجاله إلى أعماق الجب."], [8, "إلا أن عشرة رجال كانوا بينهم قالوا لإسمعيل: «لا تقتلنا لأن لدينا مؤنا من حنطة وشعير وزيت وعسل خبأناها في الصحراء» فلم يقتلهم."], [9, "وكان الجب الذي طرح فيه إسمعيل جثث قتلاه وجثة جدليا هو الجب الكبير الذي حفره الملك آسا للدفاع ضد بعشا ملك إسرائيل، فملأه إسمعيل بالقتلى."], [10, "ثم سبى إسمعيل بقية الشعب الذي كان في المصفاة، وبنات الملك، وكل من تخلف في المصفاة، ممن عهد بهم نبوزرادان رئيس الشرطة إلى جدليا بن أخيقام، وانطلق بهم إسمعيل إلى بني عمون."], [11, "ولكن لما سمع يوحانان بن قاريح وجميع قادة القوات الذين معه ما ارتكبه إسمعيل بن نثنيا من شر،"], [12, "أخذوا جميع رجالهم وتعقبوا إسمعيل بن نثنيا ليقاتلوه، فصادفوه عند البركة الكبيرة التي في جبعون."], [13, "فلما شاهد جميع أسرى إسمعيل يوحانان بن قاريح وكل قادة القوات المرافقين له فرحوا،"], [14, "فانثنى الأسرى الذين سباهم إسمعيل في المصفاة وقفلوا راجعين إلى يوحانان بن قاريح."], [15, "أما إسمعيل بن نثنيا فهرب من يوحانان مع ثمانية من رجاله وانطلق إلى العمونيين."], [16, "فاقتاد يوحانان بن قاريح وسائر قواد القوات الذين معه بقية شعب المصفاة، الذين استردهم من إسمعيل بن نثنيا، الذي كان قد سباهم بعد اغتيال جدليا بن أخيقام، وهم محاربون أشداء ونساء وأطفال وخصيان، وأعادهم من جبعون."], [17, "فأقاموا في جيروت كمهام المجاورة لبيت لحم، لينطلقوا منها إلى مصر."], [18, "هاربين من وجه الكلدانيين خوفا منهم، بسبب اغتيال إسمعيل بن نثنيا لجدليا بن أخيقام الذي ولاه ملك بابل على البلاد."], [1, "ثم اجتمع كل قواد القوات ويوحانان بن قاريح ويزنيا بن هوشعيا وجميع الشعب صغيرهم وكبيرهم،"], [2, "إلى إرميا قائلين: «ليت توسلنا يكون مقبولا لديك، فتصلي إلى الرب إلهك من أجل هذه البقية كلها، فقد كنا كثيرين ولكن صرنا الآن قليلين كما ترى،"], [3, "فينبئنا الرب إلهك بالطريق الذي يتحتم علينا سلوكه وبما يجب علينا عمله»."], [4, "فأجابهم إرميا النبي: «قد استجبت لكم، وها أنا أصلي إلى الرب إلهكم بحسب كلامكم، وكل ما يجيب به الرب أخبركم به. لا أكتم عنكم شيئا»."], [5, "ثم قالوا لإرميا: «ليكن الرب بيننا شاهدا أمينا صادقا، أننا ننفذ كل كلمة يوحي بها الرب إلينا على لسانك،"], [6, "سواء كانت خيرا أو شرا، فنطيع صوت الرب إلهنا الذي نرسلك إليه، فننال خيرا إن أطعناه»."], [7, "وبعد عشرة أيام أوحى الرب إلى إرميا برسالة،"], [8, "فاستدعى إرميا يوحانان بن قاريح وقواد القوات الذين معه وسائر الشعب من صغيرهم إلى كبيرهم،"], [9, "وقال لهم: «هذا ما يعلنه الرب إله إسرائيل الذي أرسلتموني لأرفع توسلكم إليه:"], [10, "إن أقمتم في هذه الأرض فإني أبنيكم ولا أهدمكم، وأغرسكم ولا أستأصلكم، لأني أسفت على الشر الذي ألحقته بكم."], [11, "لا تخشوا ملك بابل الذي أنتم منه خائفون فإني معكم لأخلصكم وأنجيكم من يده."], [12, "وأنعم عليكم فيرحمكم ويردكم إلى أرضكم."], [13, "ولكن إن قلتم: لن نقيم في هذه الأرض، ولم تطيعوا صوت الرب إلهكم."], [14, "قائلين: لا بل ننطلق إلى ديار مصر حيث لا نشهد قتالا، ولا نسمع نفير بوق، ولا يعوزنا خبز، فنمكث هناك،"], [15, "إذا اسمعوا قضاء الرب يابقية يهوذا: إن وطدتم العزم على الذهاب إلى مصر وارتحلتم لتتغربوا هناك،"], [16, "فالسيف الكلداني الذي تخشونه يدرككم هناك في ديار مصر، والجوع الذي تفزعون منه يلاحقكم إلى مصر فتموتون هناك."], [17, "وكل من استقر عزمه من الشعب على الانطلاق إلى مصر والتغرب هناك يموت بالسيف والجوع والوباء، ولا يفلت ناج من الشر الذي أجلبه عليهم."], [18, "لأن هذا ما يعلنه الرب القدير إله إسرائيل. كما انسكب غضبي وسخطي على أهل أورشليم، كذلك ينسكب سخطي عليكم إذا ذهبتم إلى مصر، فتصبحون مثار سبة ودهشة ولعنة وعار، ولا تعودون ترون هذا الموضع»."], [19, "«فيابقية إسرائيل لا تهاجروا إلى مصر. تيقنوا أني قد حذرتكم اليوم."], [20, "لأنكم قد خدعتم أنفسكم حين بعثتم بي إلى الرب إلهكم قائلين: صل لأجلنا إلى الرب إلهنا وأنبئنا بكل ما يقول فنفعل بمقتضاه."], [21, "وها أنا قد أنبأتكم اليوم بكلامه فلم تطيعوا صوت الرب إلهكم في أي شيء أرسلني به إليكم."], [22, "فثقوا الآن أنكم تموتون بالسيف والجوع والوباء في ذات الموضع الذي نويتم الارتحال إليه والتغرب فيه»."], [1, "عندما فرغ إرميا من الإدلاء بكل رسالة الرب إلههم التي أوحى بها إليه ليبلغها للشعب جميعه،"], [2, "قال عزريا بن هوشعيا ويوحانان بن قاريح، وسائر الرجال المتعجرفين لإرميا: «أنت تنطق بالكذب، فالرب إلهنا لم يرسلك لتقول لنا: لا ترحلوا إلى مصر لتتغربوا فيها."], [3, "إنما يثيرك باروخ بن نيريا علينا لتسلمنا إلى الكلدانيين حتى يقتلونا ويسبونا إلى بابل»."], [4, "وأبى يوحانان بن قاريح وسائر قواد القوات وكل الشعب طاعة صوت الرب للإقامة في أرض يهوذا."], [5, "بل أخذوا كل بقية يهوذا الذين رجعوا من بين جميع الأمم التي تشتتوا فيها ليقيموا في أرض يهوذا،"], [6, "الرجال والنساء والأطفال وبنات الملك، وكل إنسان تركه نبوزرادان رئيس الشرطة في عهدة جدليا بن أخيقام بن شافان، وإرميا النبي، وباروخ بن نيريا."], [7, "فأقبلوا إلى مصر إذ لم يطيعوا صوت الرب. ونزلوا في تحفنحيس."], [8, "ثم أوحى الرب إلى إرميا بهذه النبوءة في تحفنحيس قائلا:"], [9, "«خذ حجارة كبيرة بيدك واطمرها في الملاط المرصوف عند مدخل قصر فرعون في تحفنحيس على مرأى رجال يهوذا."], [10, "وقل لهم، هذا ما يعلنه الرب القدير إله إسرائيل: ها أنا آتي بعبدي نبوخذناصر وأنصب عرشه فوق هذه الحجارة التي طمرتها، فيبسط أريكته الملكية عليها."], [11, "سيقبل ويدمر ديار مصر، فيموت من قضي عليه بالموت، ويسبى من قضي عليه بالسبي، ويقتل بالسيف من قضي عليه بالقتل بالسيف."], [12, "ويضرم معابد آلهة المصريين بالنار ويحرقها ويسبيها، ويلف مصر حول نفسه كما يلف الراعي عباءته، ويخرج من هناك سليما"], [13, "بعد أن يهدم أنصاب معبد الشمس التي في مصر، ويحرق معابد آلهة المصريين بالنار»."], [1, "هذه هي النبوءة التي أوحي بها إلى إرميا عن اليهود المقيمين في مصر، النازلين في مجدل وفي تحفنحيس وممفيس وفي منطقة جنوب مصر."], [2, "«هذا ما يعلنه الرب القدير إله إسرائيل: قد شهدتم كل ما أوقعته من شر بأورشليم وبكافة مدن يهوذا. ها هي اليوم خربة مهجورة"], [3, "لشر أهلها الذي ارتكبوه ليثيروا سخطي، إذ ذهبوا ليحرقوا بخورا ويعبدوا آلهة أخرى من الأصنام لم يعرفوها هم ولا أنتم ولا اباؤكم."], [4, "وقد أرسلت إليكم منذرا منذ البدء جميع عبيدي الأنبياء قائلا: لا تقترفوا رجسا مثل هذا لأني أمقته،"], [5, "فلم يرتدعوا ولا سمعوا ليتوبوا ويكفوا عن إحراق البخور لتلك الأصنام،"], [6, "فانصب غيظي وحنقي، وأشعلا مدن يهوذا وشوارع أورشليم حتى أصبحت جميعا أطلالا وخرابا كما هي في هذا اليوم."], [7, "والآن هذا ما يعلنه الرب القدير إله إسرائيل: لماذا ترتكبون هذا الشر العظيم في حق أنفسكم، لينقرض منكم الرجل والمرأة والطفل والرضيع من بين شعب يهوذا ولا تبقى منكم بقية؟"], [8, "لماذا تغيظونني باقتراف الإثم إذ تحرقون بخورا لآلهة أصنام مصر التي هاجرتم إليها لتتغربوا فيها، فتنقرضون وتصبحون لعنة وعارا بين كل أمم الأرض؟"], [9, "هل نسيتم شرور آبائكم وشرور ملوك يهوذا وشرور نسائهم، وشروركم وشرور نسائكم التي ارتكبت في أرض يهوذا وفي شوارع أورشليم؟"], [10, "إنهم لم يتذللوا إلى هذا اليوم ولا اتقوا ولا سلكوا في شريعتي وفرائضي التي سننتها لكم ولآبائكم."], [11, "لذلك هذا ما يعلنه الرب القدير إله إسرائيل: ها أنا أترصدكم لأجازيكم شرا لا خيرا، لأستأصلكم من يهوذا."], [12, "وآخذ بقية يهوذا الذين وطدوا العزم على الرحيل إلى مصر ليتغربوا فيها، وأفنيهم كلهم هناك، فيهلكون بالسيف والجوع من صغيرهم إلى كبيرهم، فيموتون ويصبحون سبة ودهشة ولعنة وعارا."], [13, "وأعاقب المقيمين في مصر كما عاقبت أهل أورشليم بالسيف والجوع والوباء،"], [14, "فلا يفلت منهم ناج، ولا يسلم أحد من بقية يهوذا المرتحلين ليتغربوا هناك في مصر، ليرجع إلى أرض يهوذا التي يتوق للعودة إليها والإقامة فيها، لأنه لن يرجع إليها إلا قلة من الطريدين»."], [15, "غير أن جميع الرجال الذين يعرفون أن نساءهم يحرقن بخورا لآلهة الأصنام، وكذلك النساء الحاضرات، وسائر المقيمين في المنطقة الجنوبية في مصر، وهم عدد كبير قالوا لإرميا:"], [16, "«لن نطيعك في ما خاطبتنا به من كلام باسم الرب،"], [17, "بل نعمل بمقتضى ما تعهدنا به، فنحرق بخورا لملكة السماء ونقرب لها السكائب كما سبق أن فعلنا نحن وآباؤنا وملوكنا ورؤساؤنا في مدن يهوذا وفي شوارع أورشليم، فكانت لنا وفرة من الطعام وتمتعنا بالخير ولم يصبنا شر."], [18, "ولكن منذ أن أهملنا إحراق البخور لملكة السماء وتقريب السكائب لها، افتقرنا إلى كل شيء، وفنينا بالسيف والجوع»."], [19, "وقالت النساء: «عندما أحرقنا البخور لملكة السماء وقربنا لها السكائب وعملنا أقراصا مماثلة لصورتها، وقربنا السكائب لها هل فعلنا ذلك بغير علم أزواجنا؟»"], [20, "فقال إرميا للقوم من رجال ونساء وسائر الشعب الذين أجابوه بهذا الكلام:"], [21, "«أليس ما أحرقتموه من بخور في مدن يهوذا وفي شوارع أورشليم أنتم وآباؤكم وملوككم ورؤساؤكم وسكان الأرض، هو الذي ذكره الرب وخطر على باله؟"], [22, "فلم يطق الرب بعد تحمل ما ارتكبتم من شر وما اقترفتم من أرجاس، فصارت أرضكم أطلالا ومثار دهشة ولعنة ومهجورة كالعهد بها في هذا اليوم."], [23, "إن البلاء الذي حل بكم كما في هذا اليوم هو عقاب لكم على إحراقكم البخور وتعديكم على الرب وعصيانكم لصوته، وعدم سلوككم في شريعته وفرائضه وشهاداته."], [24, "والآن اسمعوا قضاء الرب ياجميع أهل يهوذا المقيمين في مصر:"], [25, "هذا ما يعلنه الرب القدير إله إسرائيل: قد نطقتم بأفواهكم أنتم ونساؤكم، ونفذتم بأيديكم ما نطقتم به قائلين: إننا نفي بنذورنا التي نذرناها بأن نحرق البخور لملكة السماء، ونقرب لها السكائب، فهيا إذا أوفوا نذوركم وأنجزوها."], [26, "لذلك اسمعوا كلمة الرب ياجميع شعب يهوذا المقيمين في مصر: ها أنا قد أقسمت باسمي العظيم يقول الرب، أن لا يتردد اسمي من بعد على فم أحد من شعب يهوذا في كافة ديار مصر قائلا: «حي هو السيد الرب»."], [27, "ها أنا أترصدهم لأوقع بهم شرا لا خيرا، فيهلك كل رجال يهوذا الذين في أرض مصر بالسيف والجوع حتى يتم استئصالهم."], [28, "وترجع القلة الناجية من السيف من مصر إلى أرض يهوذا، فتعلم كل بقية يهوذا الذين هاجروا إلى مصر ليتغربوا فيها أي كلام يتحقق: كلامي أم كلامهم؟»"], [29, "ويقول الرب: «وهذه لكم علامة أنني أعاقبكم في هذا الموضع بالذات، لتدركوا أن قضائي عليكم بالشر حتما يتم."], [30, "ها أنا أسلم فرعون حفرع ملك مصر إلى يد أعدائه وطالبي نفسه كما أسلمت صدقيا ملك يهوذا إلى يد نبوخذناصر ملك بابل عدوه وطالب نفسه»."]]}, {"l": "Jer 52:30", "n": "", "vs": [[30, "وفي السنة الثالثة والعشرين لحكم نبوخذناصر سبى نبوزرادان رئيس الشرطة من اليهود سبع مئة وخمسة وأربعين شخصا، فكانت جملة المسبيين أربعة آلاف وست مئة شخص."]]}], "kwAr": "خذ بعضا من الشعر", "noteAr": ""}, {"kw": "shall a fire", "raw": "Jer_4:4, Jer_48:45", "note": "", "refs": [{"l": "Jer 4:4", "n": "", "vs": [[4, "اختتنوا للرب، وأزيلوا قلف قلوبكم (أي طهروا عقولكم وقلوبكم وليس أجسادكم فقط) لئلا يتفجر غضبي كنار فتحرق وليس من يخمدها، من جراء أعمالكم الشريرة."]]}, {"l": "Jer 48:45", "n": "", "vs": [[45, "في ظل حشبون وقف الهاربون خائري القوى، لأن نارا اندلعت من حشبون، وشعلة من سيحون، فالتهمت ركن موآب وهامة المتبجحين الغوغائيين."]]}], "kwAr": "فتندلع منه نار", "noteAr": ""}], "arS": [["كذلك ", []], ["خذ", ["H3947"]], [" ", []], ["بعضا", ["H4480"]], [" من الشعر ", []], ["واطرحه", ["H7993"]], [" في ", []], ["النار", ["H784"]], [" ", []], ["ليحترق", ["H8313"]], ["، ", []], ["فتندلع", ["H3318"]], [" منه ", []], ["نار", ["H784"]], [" على ", []], ["كل", ["H3605"]], [" ", []], ["شعب", ["H1004"]], [" ", []], ["إسرائيل", ["H3478"]], ["».", []]]}, {"c": 5, "v": 5, "text": "وهذا ما يعلنه السيد الرب: «هذه هي أورشليم التي أقمتها في وسط الشعوب تحيط بها الأراضي،", "groups": [{"kw": "This", "raw": "Eze_4:1; Jer_6:6; Luk_22:19, Luk_22:20; 1Co_10:4", "note": "", "refs": [{"l": "Eze 4:1", "n": "", "vs": [[1, "أما أنت ياابن آدم فخذ لنفسك لبنة وابسطها أمامك وارسم عليها مدينة أورشليم،"]]}, {"l": "Jer 6:6", "n": "", "vs": [[6, "لأن هذا ما يعلنه الرب القدير: «اقطعوا الشجر، وأقيموا مترسة حول أورشليم، إذ يجب أن تعاقب هذه المدينة، لأن داخلها مفعم بالظلم."]]}, {"l": "Luk 22:19", "n": "", "vs": [[19, "وإذ أخذ رغيفا، شكر، وكسر، وأعطاهم قائلا: «هذا جسدي الذي يبذل لأجلكم. هذا افعلوه لذكري!»"]]}, {"l": "Luk 22:20", "n": "", "vs": [[20, "وكذلك أخذ الكأس أيضا بعد العشاء، وقال: «هذه الكأس هي العهد الجديد بدمي الذي يسفك لأجلكم."]]}, {"l": "1Co 10:4", "n": "", "vs": [[4, "وشربوا كلهم شرابا واحدا له رمز روحي، إذ شربوا من صخرة روحية تبعتهم، وقد كانت هذه الصخرة هي المسيح."]]}], "kwAr": "هذه هي أورشليم", "noteAr": ""}, {"kw": "I have", "raw": "Eze_16:14; Deu_4:6; Mic_5:7; Mat_5:14", "note": "", "refs": [{"l": "Eze 16:14", "n": "", "vs": [[14, "فذاع اسمك بين الأمم لفرط جمالك لأنه اكتمل بفضل بهائي الذي أضفيته عليك، يقول السيد الرب."]]}, {"l": "Deu 4:6", "n": "", "vs": [[6, "فاحفظوها وطبقوها، لأنها هي حكمتكم وفطنتكم لدى الشعوب الذين يسمعون عن هذه الشرائع، فيقولون: إن هذا الشعب العظيم هو حقا شعب حكيم فطن."]]}, {"l": "Mic 5:7", "n": "", "vs": [[7, "عندئذ تغدو بقية ذرية يعقوب بين الأمم الكثيرة كندى من لدن الرب، كالمطر الوابل على العشب الذي لا يتوانى من أجل الناس أو يرجو أبناء البشر."]]}, {"l": "Mat 5:14", "n": "", "vs": [[14, "أنتم نور العالم. لا يمكن أن تخفى مدينة مبنية على جبل؛"]]}], "kwAr": "التي أقمتها", "noteAr": ""}], "arS": [["وهذا", ["H3541"]], [" ما ", []], ["يعلنه", ["H559"]], [" ", []], ["السيد", ["H136"]], [" ", []], ["الرب", ["H3069"]], [": «", []], ["هذه", ["H2063"]], [" هي ", []], ["أورشليم", ["H3389"]], [" التي ", []], ["أقمتها", ["H7760"]], [" في ", []], ["وسط", ["H8432"]], [" ", []], ["الشعوب", ["H1471"]], [" ", []], ["تحيط", ["H5439"]], [" بها ", []], ["الأراضي", ["H776"]], ["،", []]]}, {"c": 5, "v": 6, "text": "فخالفت أحكامي بأشر مما خالفتها الأمم وسكان الأراضي المحيطة بها، إذ تنكروا لأحكامي، وفرائضي لم يمارسوها.", "groups": [{"kw": "she hath", "raw": "Eze_16:47; Deu_32:15-21; 2Ki_17:8-20; Psa_106:20; Rom_1:23-25; 1Co_5:1; Jud_1:4", "note": "", "refs": [{"l": "Eze 16:47", "n": "", "vs": [[47, "ولم تكتفي بالسلوك في طرق فجورهن وارتكاب مثل أرجاسهن وكأن ذلك قليل عليك بل تفوقت عليهن فسادا في جميع طرقك."]]}, {"l": "Deu 32:15-21", "n": "", "vs": [[15, "فسمن بنو إسرائيل ورفسوا، سمنوا وغلظوا واكتسوا شحما، فرفضوا الإله صانعهم وتنكروا لصخرة خلاصهم."], [16, "أثاروا غيرته بآلهتهم الغريبة، وأغاظوه بأصنامهم الرجسة."], [17, "قدموا محرقات لأوثان ليست هي الله، لآلهة غريبة لم يعرفوها بل ظهرت حديثا، آلهة لم يرهبها آباؤهم من قبل."], [18, "لقد نبذتم الصخر الذي أنجبكم، ونسيتم الله الذي أنشأكم."], [19, "فرأى الرب ذلك ورذلهم، إذ أثار أبناؤه وبناته غيظه."], [20, "وقال: سأحجب وجهي عنهم، فأرى ماذا يكون مصيرهم؟ إنهم جيل متقلب وأولاد خونة،"], [21, "هيجوا غيرتي بعبادة أوثانهم، وأسخطوني بأصنامهم الباطلة. لذلك سأثير غيرتهم بشعب متوحش، وأغيظهم بأمة حمقاء."]]}, {"l": "2Ki 17:8-20", "n": "", "vs": [[8, "سالكين حسب فرائض الأمم الذين طردهم الرب من أمامهم، ومن أمام ملوكهم الذين نصبوهم عليهم."], [9, "وارتكب بنو إسرائيل في الخفاء معاصي في حق الرب إلههم، وشيدوا لأنفسهم مرتفعات في جميع مدنهم من برج النواطير إلى المدينة المحصنة،"], [10, "وأقاموا لأنفسهم أنصابا وتماثيل لعشتاروث على كل تل مرتفع، وتحت كل شجرة خضراء،"], [11, "وقربوا محرقات على جميع المرتفعات كسائر الأمم الذين نفاهم الرب من أمامهم، واقترفوا الموبقات لإغاظة الرب،"], [12, "عابدين الأصنام التي حذرهم ونهاهم الرب عنها."], [13, "وقد أنذر الرب إسرائيل ويهوذا عن طريق أنبيائه ورائيه قائلا: «ارجعوا عن طرقكم الأثيمة، وأطيعوا وصاياي وفرائضي بمقتضى كل الشريعة التي أوصيت آباءكم بتطبيقها، والتي أعلنتها لكم على لسان عبيدي الأنبياء."], [14, "لكنهم أصموا أذانهم وأغلظوا قلوبهم كآبائهم الذين لم يثقوا بالرب إلههم،"], [15, "وتنكروا لفرائضه وعهده الذي أبرمه مع آبائهم، وتجاهلوا تحذيراته ونواهيه لهم، وضلوا وراء أصنام باطلة، فأصبحوا هم أنفسهم باطلين، وتمثلوا بالأمم الذين حولهم، مع أن الرب أمرهم ألا يفعلوا مثلهم، وارتكبوا أمورا نهاهم الرب عنها،"], [16, "ونبذوا جميع وصايا الرب إلههم، وصنعوا لأنفسهم عجلين مسبوكين، وأقاموا تماثيل لعشتاروث وسجدوا لجميع كواكب السماء وعبدوا البعل."], [17, "وأجازوا أبناءهم وبناتهم في النار، وتعاطوا العرافة والفأل وباعوا أنفسهم لارتكاب الشر في عيني الرب لإثارة غيظه."], [18, "فاحتدم غضب الرب على إسرائيل، وطردهم من حضرته، ولم يبق سوى سبط يهوذا."], [19, "ولكن حتى سبط يهوذا لم يحفظ وصايا الرب إلهه بل نهج في طرق إسرائيل التي سلكتها."], [20, "فنبذ الرب كل ذرية إسرائيل وأذلهم وأسلمهم ليد آسريهم، وطردهم من حضرته."]]}, {"l": "Psa 106:20", "n": "", "vs": [[20, "استبدلوا إلههم المجيد بصورة ثور آكل عشب."]]}, {"l": "Rom 1:23-25", "n": "", "vs": [[23, "واستبدلوا بمجد الله الخالد تماثيل لصور الإنسان الفاني والطيور وذوات الأربع والزواحف."], [24, "لذلك أسلمهم الله ، في شهوات قلوبهم، إلى النجاسة، ليهينوا أجسادهم فيما بينهم."], [25, "إذ قد استبدلوا بحق الله ما هو باطل، فاتقوا المخلوق وعبدوه بدل الخالق، المبارك إلى الأبد. آمين!"]]}, {"l": "1Co 5:1", "n": "", "vs": [[1, "قد شاع فعلا أن بينكم زنى. ومثل هذا الزنى لا يوجد حتى بين الأمم. ذلك بأن رجلا منكم يعاشر زوجة أبيه."]]}, {"l": "Jud 1:4", "n": "", "vs": [[4, "لأنه قد تسلل إلى ما بينكم معلمون لابد أن يلاقوا الحكم بالعقاب الأبدي، كما هو مكتوب لهم منذ القديم. فهم أشرار لا يهابون الله ، يتخذون من نعمة إلهنا فرصة لإباحة الرذائل، وينكرون سيدنا وربنا الوحيد يسوع المسيح."]]}], "kwAr": "فخالفت أحكامي", "noteAr": ""}, {"kw": "for they", "raw": "Neh_9:16, Neh_9:17; Psa_78:10; Jer_5:3, Jer_8:5, Jer_9:6, Jer_11:10; Zec_7:11", "note": "", "refs": [{"l": "Neh 9:16", "n": "", "vs": [[16, "ولكن أسلافنا وآباءنا طغوا وقسوا قلوبهم ولم يطيعوا وصاياك،"]]}, {"l": "Neh 9:17", "n": "", "vs": [[17, "وأبوا أن يسمعوا، وتجاهلوا عجائبك التي أجريتها لهم، وأغلظوا قلوبهم، ثم تمردوا ونصبوا عليهم قائدا ليرجعوا إلى عبوديتهم، ولكنك إله غفور وحنان ورحيم وحكيم وكثير الإحسان، فلم تتخل عنهم،"]]}, {"l": "Psa 78:10", "n": "", "vs": [[10, "لأنهم لم يراعوا عهد الله، ورفضوا السلوك في شريعته."]]}, {"l": "Jer 5:3", "n": "", "vs": [[3, "أيها الرب، أليست عيناك تطلبان الحق؟ لقد عاقبتهم ولكنهم لم يتوجعوا. أهلكتهم ولكنهم أبوا التقويم. صلبوا وجوههم أكثر من الصخر، ورفضوا التوبة."]]}, {"l": "Jer 8:5", "n": "", "vs": [[5, "فما بال شعب أورشليم قد ارتدوا ارتدادا دائما متشبثين بالخديعة ورافضين الرجوع؟"]]}, {"l": "Jer 9:6", "n": "", "vs": [[6, "يجمعون ظلما فوق ظلم، وخداعا على خداع، وأبوا أن يعرفوني»."]]}, {"l": "Jer 11:10", "n": "", "vs": [[10, "فقد ارتدوا إلى آثام أسلافهم الذين أبوا الاستماع إلى كلماتي، ضلوا وراء الأصنام ليعبدوها، وقد نكث شعب إسرائيل وشعب يهوذا عهدي الذي أبرمته مع آبائهم."]]}, {"l": "Zec 7:11", "n": "", "vs": [[11, "ولكنهم أبوا أن يصغوا، واعتصموا بعنادهم غير عابئين، وأصموا آذانهم لئلا يسمعوا."]]}], "kwAr": "إذ تنكروا لأحكامي", "noteAr": ""}], "arS": [["فخالفت", ["H4784"]], [" ", []], ["أحكامي", ["H4941"]], [" ", []], ["بأشر", ["H7564"]], [" مما خالفتها ", []], ["الأمم", ["H1471"]], [" وسكان ", []], ["الأراضي", ["H776"]], [" ", []], ["المحيطة", ["H5439"]], [" بها، إذ ", []], ["تنكروا", ["H3988"]], [" لأحكامي، ", []], ["وفرائضي", ["H2708"]], [" لم ", []], ["يمارسوها", ["H1980"]], [".", []]]}, {"c": 5, "v": 7, "text": "لذلك من حيث أنكم تمردتم أكثر من الأمم المحيطة بكم، ولم تمارسوا فرائضي ولم تعملوا بمقتضى أحكامي، ولا بمقتضى أحكام الأمم التي حولكم.", "groups": [{"kw": "neither have done", "raw": "Eze_5:11, Eze_16:47, Eze_16:48, Eze_16:54; 2Ki_21:9-11; 2Ch_33:9; Jer_2:10,Jer_2:11", "note": "", "refs": [{"l": "Eze 5:11", "n": "", "vs": [[11, "لهذا حي أنا يقول السيد الرب، لأنك قد دنست مقدسي بكل أصنامك المكروهة، وبجميع رجاساتك، فأنا أيضا أستأصل، ولا تترَأف عليك عيني ولا أعفو."]]}, {"l": "Eze 16:47", "n": "", "vs": [[47, "ولم تكتفي بالسلوك في طرق فجورهن وارتكاب مثل أرجاسهن وكأن ذلك قليل عليك بل تفوقت عليهن فسادا في جميع طرقك."]]}, {"l": "Eze 16:48", "n": "", "vs": [[48, "لذلك يقول السيد الرب حي أنا، إن سدوم أختك وبناتها لم يقترفن المفاسد التي اقترفتها أنت وبناتك."]]}, {"l": "Eze 16:54", "n": "", "vs": [[54, "لكي تحملي عارك وتخجلي مما ارتكبت عندما أصبحت تعزية لهن."]]}, {"l": "2Ki 21:9-11", "n": "", "vs": [[9, "لكنهم عصوا، بل أضلهم منسى فارتكبوا ما هو أقبح مما ترتكبه الأمم التي طردها الرب من أمام بني إسرائيل."], [10, "ثم قال الرب على لسان عبيده الأنبياء:"], [11, "«لأن منسى ملك يهوذا اقترف جميع هذه الموبقات، وارتكب شرورا أشد فظاعة من شرور الأموريين الذين كانوا قبله، وأضل يهوذا فجعله يأثم بعبادة أصنامه،"]]}, {"l": "2Ch 33:9", "n": "", "vs": [[9, "غير أن منسى أضل شعب يهوذا وأهل أورشليم وأغواهم لارتكاب شرور أشد هولا من شرور الأمم الذين طردهم الرب من أمام بني إسرائيل."]]}, {"l": "Jer 2:10", "n": "", "vs": [[10, "فاعبروا إلى جزيرة قبرص والسواحل الغربية، وأرسلوا إلى قيدار، وتفحصوا جيدا، وانظروا: هل جرى مثل هذا؟"]]}, {"l": "Jer 2:11", "n": "", "vs": [[11, "هل استبدلت أمة آلهتها مع أنها ليست حقا آلهة؟ أما شعبي فاستبدل مجده بما لا جدوى منه."]]}], "kwAr": "ولم تعملوا بمقتضى أحكامي", "noteAr": ""}], "arS": [["لذلك", ["H3651"]], [" من ", []], ["حيث", ["H3282"]], [" أنكم ", []], ["تمردتم", ["H1995"]], [" أكثر من ", []], ["الأمم", ["H1471"]], [" ", []], ["المحيطة", ["H5439"]], [" بكم، ولم ", []], ["تمارسوا", ["H1980"]], [" ", []], ["فرائضي", ["H2708"]], [" ولم ", []], ["تعملوا", ["H6213"]], [" بمقتضى ", []], ["أحكامي", ["H4941"]], ["، ولا بمقتضى ", []], ["أحكام", ["H4941"]], [" ", []], ["الأمم", ["H1471"]], [" التي ", []], ["حولكم", ["H5439"]], [".", []]]}, {"c": 5, "v": 8, "text": "ها أنا أيضا أنقلب عليك ياأورشليم، وأجري عليك قضاء على مشهد من الأمم،", "groups": [{"kw": "even I", "raw": "Eze_15:7, Eze_21:3, Eze_26:3, Eze_28:22, Eze_35:3, Eze_39:1; Lev. 26:17-46; Deu_29:20; Jer_21:5, Jer_21:13; Lam_2:5, Lam_3:3; Zec_14:2, Zec_14:3; Mat_22:7", "note": "", "refs": [{"l": "Eze 15:7", "n": "", "vs": [[7, "وأنقلب عليهم حتى إذا خرجوا من نار تلتهمهم نار أخرى، فتدركون أني أنا الرب حين أنقلب عليكم."]]}, {"l": "Eze 21:3", "n": "", "vs": [[3, "وقل لأرض إسرائيل: هذا ما يعلنه الرب، ها أنا أنقلب عليك وأستل سيفي من غمده فأستأصل منك الصالح والطالح."]]}, {"l": "Eze 26:3", "n": "", "vs": [[3, "لذلك يعلن السيد الرب: ها أنا أعاقبك ياصور، فأجعل أمما كثيرة تهاجمك كما يهجم البحر بأمواجه."]]}, {"l": "Eze 28:22", "n": "", "vs": [[22, "وقل هذا ما يعلنه السيد الرب: ها أنا أنقلب عليك ياصيدون وأتجلى بمجدي فيك فيدرك سكانك أني أنا الرب حين أنفذ فيك أحكاما وأتقدس في وسطك."]]}, {"l": "Eze 35:3", "n": "", "vs": [[3, "وقل لأهله: ها أنا أنقلب عليك ياجبل سعير وأعاقبك لأجعلك خرابا مقفرا."]]}, {"l": "Eze 39:1", "n": "", "vs": [[1, "»وتنبأ أنت ياابن آدم على جوج وقل: هذا ما يعلنه السيد الرب:"]]}, {"l": "Lev 26:17-46", "n": "", "vs": [[17, "وأنقلب عليكم فتنهزمون أمام أعدائكم، ويتحكم بكم مبغضوكم وتهربون من غير طارد لكم."], [18, "وإن أمعنتم في عصيانكم أزيد من عقابكم سبع مرات وفقا لخطاياكم."], [19, "أذل غطرستكم، وأجعل سماءكم كالحديد لا تمطر وأرضكم كالنحاس لا تغل"], [20, "فيذهب جهدكم باطلا لأن أرضكم لن تعطي غلتها، وأشجار الأرض لن تعطي أثمارها."], [21, "وإن واظبتم على عصيانكم وأبيتم طاعتي، أضاعف عقابي لكم سبع مرات وفقا لخطاياكم."], [22, "وأطلق عليكم وحوش الصحراء فتفترس أولادكم وتهلك بهائمكم، وتنقص من عددكم، فتقفر طرقاتكم."], [23, "وإن لم تتعظوا، وتماديتم في عصيانكم،"], [24, "أنقلب عليكم وأزيد في بلائكم سبع مرات وفقا لخطاياكم."], [25, "أسلط عليكم سيف العدو. فينتقم منكم لنقضكم ميثاقي، فتلوذون بمدنكم حيث أرسل عليكم الوباء وتسلمون إلى يد العدو"], [26, "وحين أقطع عنكم مؤونة الدقيق، تخبز عشر نساء خبزكم في فرن واحد لقلة الدقيق، وتقسمون الخبز بالميزان فتأكلون ولا تشبعون."], [27, "وإن لم يجد هذا العقاب في تأديبكم، فتماديتم في عصيانكم،"], [28, "فإني أزيد في احتدام غضبي، من عدائي لكم وأضاعف عقابي سبع مرات أخرى وفقا لخطاياكم،"], [29, "فتأكلون لحم أبنائكم وبناتكم."], [30, "وأدك مذابح مرتفعاتكم، وأحطم أنصاب شموسكم وأكوم جثثكم فوق بقايا أصنامكم، وتنبذكم نفسي."], [31, "وأحول مدنكم إلى خرائب، وأجعل مقادسكم موحشة، ولا أبتهج برائحة تقدمات سروركم،"], [32, "وأجعل الأرض قفرا فيرتاع من وحشتها أعداؤكم الساكنون فيها"], [33, "وأشتتكم بين الشعوب، وأجرد عليكم سيفي، وألاحقكم، وأحول أرضكم إلى قفر ومدنكم إلى خرائب."], [34, "عندئذ تستوفي الأرض راحة سبوتها طوال سني وحشتها وأنتم مشتتون في ديار أعدائكم. حينئذ ترتاح الأرض وتستوفي سني سبوتها."], [35, "فتعوض في أيام وحشتها عن راحتها التي لم تنعم بها في سنوات سبوتكم عندما كنتم تقيمون عليها."], [36, "أما الباقون منكم في أرض أعدائكم، فإني ألقي الرعب في قلوبهم فيهربون من حفيف ورقة تسوقها الريح، وكأنهم يهربون من السيف، ويسقطون وليس ثمة من طارد لهم."], [37, "ويعثر بعضهم ببعض كمن يفر من أمام سيف من غير طارد لهم، ولا تثبتون أمام أعدائكم"], [38, "فتهلكون بين الشعوب، وتبتلعكم أرض أعدائكم."], [39, "أما بقيتكم فتفنى بذنوبها وذنوب آبائها في أرض أعدائكم كما فني آباؤهم من قبلهم."], [40, "ولكن إن اعترفوا بخطاياهم وخطايا آبائهم وبخيانتهم لي وعداوتهم،"], [41, "التي جعلتني أنقلب عليهم وأنفيهم إلى أرض أعدائهم، وإن خضعت قلوبهم النجسة بعد أن استوفوا عقاب خطاياهم،"], [42, "فإني أذكر ميثاقي مع يعقوب، وميثاقي مع إسحق، وميثاقي مع إبراهيم، وأذكر الأرض،"], [43, "التي أقفرت منهم، فاستوفت راحة سبوتها في أثناء نفيهم عنها، ويكونون آنئذ قد استوفوا عقاب خطاياهم لأنهم تنكروا لشرائعي وكرهوا فرائضي."], [44, "ولكن على الرغم من ذلك فإنني لم أنبذهم وهم في أرض أعدائهم، ولا كرهتهم حتى أبيدهم وأنقض ميثاقي معهم، لأني أنا الرب إلههم،"], [45, "بل أذكر ميثاقي مع آبائهم الأولين الذين أخرجتهم من ديار مصر على مشهد من الشعوب لأكون لهم إلها. أنا الرب»."], [46, "هذه هي الفرائض والأحكام والشرائع التي أقامها الرب بينه وبين بني إسرائيل في جبل سيناء على لسان موسى."]]}, {"l": "Deu 29:20", "n": "", "vs": [[20, "إن الرب لا يشاء الرفق بمثل هذا الإنسان، بل يحتدم غضبه وغيرته عليه، فتنزل به كل اللعنات المدونة في هذا الكتاب، ويمحو اسمه من تحت السماء."]]}, {"l": "Jer 21:5", "n": "", "vs": [[5, "وأحاربكم بنفسي بيد ممدودة وذراع شديدة، بغضب وحنق وسخط عظيم."]]}, {"l": "Jer 21:13", "n": "", "vs": [[13, "ياأورشليم ياساكنة الوادي، ياصخرة السهل، ها أنا أقف ضدك يقول الرب، وأنتم يامن تقولون: «من يهاجمنا؟ ومن يقتحم منازلنا؟»"]]}, {"l": "Lam 2:5", "n": "", "vs": [[5, "وأصبح الرب كعدو، فقوض إسرائيل، وهدم جميع قصورها، ودمر حصونها، وأكثر النوح والعويل في ابنة صهيون."]]}, {"l": "Lam 3:3", "n": "", "vs": [[3, "حقا إنه يمد يده علي مرة تلو المرة طول النهار."]]}, {"l": "Zec 14:2", "n": "", "vs": [[2, "لأني أجمع جميع الأمم على أورشليم لتحاربها، فتؤخذ المدينة وتنهب البيوت وتغتصب النساء ويسبى نصف أهلها إلى المنفى. إنما لا ينقرض بقية الشعب من المدينة."]]}, {"l": "Zec 14:3", "n": "", "vs": [[3, "ولا يلبث أن يهب الرب ليحارب تلك الأمم، كما كان يحارب في يوم القتال."]]}, {"l": "Mat 22:7", "n": "", "vs": [[7, "فغضب الملك وأرسل جيوشه، فأهلك أولئك القتلة وأحرق مدينتهم."]]}], "kwAr": "ها أنا أيضا أنقلب عليك", "noteAr": ""}, {"kw": "in the", "raw": "Eze_25:2-6, Eze_26:2, Eze_29:6, Eze_29:7, Eze_35:10-15; Deu_29:23-28; 1Ki_9:8, 1Ki_9:9; Jer_22:8, Jer_22:9; Jer_24:9, Jer_50:7; Lam_2:15-17", "note": "", "refs": [{"l": "Eze 25:2-6", "n": "", "vs": [[2, "«ياابن آدم، التفت بوجهك نحو بني عمون وتنبأ عليهم."], [3, "وقل لهم اسمعوا ما يعلنه السيد الرب من قضاء: لأنك شمت بمقدسي لأنه تدنس، وبأرض إسرائيل لأنها خربت وبشعب يهوذا لأنهم سيقوا إلى السبي،"], [4, "أسلمك للبدو وأبناء المشرق، فتصيرين ملكا لهم فينصبون مضاربهم فيك، ويقيمون مساكنهم فوق أرضك. هم يلتهمون غلتك، ويشربون لبنك."], [5, "وأجعل مدينة ربة مناخا للإبل، وسائر مدن بني عمون مرابض للغنم، فتدركون أني أنا الرب."], [6, "لأنك صفقت بكفيك طربا، وخبطت برجليك، وفرحت بكل ما فيك من لؤم لما حل بأرض إسرائيل."]]}, {"l": "Eze 26:2", "n": "", "vs": [[2, "«ياابن آدم، لأن صور قد شمتت بأورشليم، وقالت: ها بوابة الشعوب قد انهارت، وتحولت القوافل إلي. ها أنا أزدهر إذ حل بها الدمار."]]}, {"l": "Eze 29:6", "n": "", "vs": [[6, "فيدرك كل أهل مصر أني أنا الرب، لأنهم كانوا عكاز قصب هشة لشعب إسرائيل،"]]}, {"l": "Eze 29:7", "n": "", "vs": [[7, "ما إن اعتمدوا عليك بأكفهم حتى انكسرت ومزقت أكتافهم، وعندما توكأوا عليك تحطمت وقصفت كل متونهم."]]}, {"l": "Eze 35:10-15", "n": "", "vs": [[10, "لأنك قلت: إن هاتين الأمتين، وهاتين الأرضين تصبحان لي فأمتلكهما، ولو كان الرب هناك."], [11, "لذلك حي أنا يقول السيد الرب: لأعاملنك بمقتضى غضبك وحسدك اللذين أبديتهما في بغضائك لهم، فأعلن ذاتي عندما أدينك."], [12, "فتدرك أني أنا الرب قد سمعت كل إهانتك التي عيرت بها جبال إسرائيل قائلا: قد أصبحت خرابا وصارت لنا مغنما."], [13, "قد تباهيتم علي بأفواهكم، وأكثرتم من لغوكم علي وأنا سمعت."], [14, "ففي موسم الربيع أجعلك مقفرا"], [15, "وكما فرحت لخراب ميراث شعب إسرائيل، كذلك أفعل بك، فتصير ياجبل سعير خرابا أنت وكل بلاد أدوم فتدركون أني أنا الرب»."]]}, {"l": "Deu 29:23-28", "n": "", "vs": [[23, "إذ تصبح جميع الأرض كبريتا، محترقة لا زرع فيها ولا نبات ولا عشب، وكأنها انقلبت كما جرى لسدوم وعمورة وأدمة وصبوييم، التي قلبها الرب من جراء غضبه وسخطه."], [24, "فتقول جميع الأمم: لماذا فعل الرب هذا كله بهذه الأرض؟ ولماذا احتدام هذا الغضب العظيم؟"], [25, "فيكون الجواب: لأن هذا الشعب نقض عهد الرب إله آبائهم الذي قطعه معهم حين أخرجهم من ديار مصر،"], [26, "وغووا وعبدوا آلهة أخرى وسجدوا لها، آلهة غريبة لم يعرفوها ولم يعطها الرب لهم،"], [27, "فالتهب غضب الرب على تلك الأرض، فصب عليها كل اللعنات المدونة فى هذا الكتاب"], [28, "واجتثهم من أرضهم بغضب وسخط وغيظ عظيم، وطوح بهم إلى أرض أخرى كما هو حادث اليوم."]]}, {"l": "1Ki 9:8", "n": "", "vs": [[8, "ويصبح هذا الهيكل عبرة يثير عجب كل من يمر به، فيصفر ويتساءل: لماذا صنع الرب هكذا بهذه الأرض وبهذا الهيكل؟"]]}, {"l": "1Ki 9:9", "n": "", "vs": [[9, "فيأتيهم الجواب: لأنهم تركوا الرب إلههم الذي أخرج آباءهم من ديار مصر، وتشبثوا بآلهة أخرى وسجدوا لها وعبدوها، لذلك جلب الرب عليهم كل هذا البلاء»."]]}, {"l": "Jer 22:8", "n": "", "vs": [[8, "وتعبر في هذه المدينة أمم كثيرة، فيقول كل واحد لرفيقه: لماذا صنع الرب هكذا بهذه المدينة العظيمة؟"]]}, {"l": "Jer 22:9", "n": "", "vs": [[9, "فيجيبون: لأنهم نبذوا عهد الرب إلههم وسجدوا للأوثان وعبدوها»."]]}, {"l": "Jer 24:9", "n": "", "vs": [[9, "وأوقعهم في الضيق والشر في جميع ممالك الأرض، وأجعلهم عارا وعبرة وأحدوثة ولعنة في جميع الأماكن التي أجليهم إليها."]]}, {"l": "Jer 50:7", "n": "", "vs": [[7, "كل من وجدهم افترسهم، وقال أعداؤهم: لا ذنب علينا لأنهم هم الذين أخطأوا في حق الرب الذي هو ملاذهم الحق، ورجاء آبائهم."]]}, {"l": "Lam 2:15-17", "n": "", "vs": [[15, "كل عابري السبيل صفقوا عليك بالأيادي فرحا. صفروا وهزوا رؤوسهم على ابنة أورشليم وتساءلوا: أهذه هي المدينة التي تدعى كاملة الجمال وبهجة الأرض بأسرها؟"], [16, "قد فغر جميع أعدائك أشداقهم. يصفرون ويحرقون الأسنان. يهتفون: قد ابتلعناها. هذا هو اليوم الذي طال انتظارنا له. قد عشنا وشهدناه!"], [17, "نفذ الرب قضاءه، وحقق وعيده الذي حكم به منذ الحقب السالفة. هدم ولم يرأف، فأشمت بك الخصم، وعظم قوة عدوك."]]}], "kwAr": "على مشهد من الأمم", "noteAr": ""}], "arS": [["ها", ["H2009"]], [" ", []], ["أنا", ["H589"]], [" ", []], ["أيضا", ["H1571"]], [" ", []], ["أنقلب", ["H5921"]], [" عليك ياأورشليم، ", []], ["وأجري", ["H6213"]], [" عليك ", []], ["قضاء", ["H4941"]], [" على ", []], ["مشهد", ["H5869"]], [" من ", []], ["الأمم", ["H1471"]], ["،", []]]}, {"c": 5, "v": 9, "text": "فأصنع بك ما لم أصنعه من قبل، وما لن أصنع مثله من بعد، عقابا لك على جميع أرجاسك.", "groups": [{"kw": "that which", "raw": "Lam_4:6, Lam_4:9; Dan_9:12; Amo_3:2; Mat_24:21; The sentence here passed upon Jerusalem is very dreadful, and the manner of expression makes it yet more so. the judgments are various, the threatenings of them varied, reiterated; so that one may well say, Who is able to stand in Gods sight when he is angry?", "note": "Lam_4:6, Lam_4:9; Dan_9:12; Amo_3:2; Mat_24:21; The sentence here passed upon Jerusalem is very dreadful, and the manner of expression makes it yet more so. the judgments are various, the threatenings of them varied, reiterated; so that one may well say, Who is able to stand in Gods sight when he is angry?", "refs": [{"l": "Lam 4:6", "n": "", "vs": [[6, "لأن عقاب إثم ابنة شعبي أعظم من عقاب خطيئة سدوم التي انقلبت في لحظة، من غير أن تمتد إليها يد إنسان."]]}, {"l": "Lam 4:9", "n": "", "vs": [[9, "كان مصير ضحايا السيف أفضل من مصير ضحايا الجوع، الذين اضمحلوا من طعنة عقم الحقل."]]}, {"l": "Dan 9:12", "n": "", "vs": [[12, "وقد نفذت قضاءك الذي قضيت به علينا وعلى قضاتنا الذين تولوا أمرنا، جالبا علينا وعلى أورشليم شرا عظيما لم يحدث له مثيل تحت السماء."]]}, {"l": "Amo 3:2", "n": "", "vs": [[2, "إياكم وحدكم اخترت من بين جميع قبائل الأرض، لهذا أعاقبكم على جميع آثامكم."]]}, {"l": "Mat 24:21", "n": "", "vs": [[21, "فسوف تحدث عندئذ ضيقة عظيمة لم يحدث مثلها منذ بدء العالم إلى الآن، ولن يحدث."]]}], "kwAr": "ما لم أصنعه من قبل", "noteAr": "انظر مرا 4: 6، 9؛ دا 9: 12؛ عا 3: 2؛ مت 24: 21. الحكم الصادر هنا على أورشليم رهيب جدا، وطريقة التعبير تزيده رهبة؛ فالأحكام متنوعة، وإنذاراتها متنوعة ومكررة، حتى ليحق للمرء أن يقول: من يستطيع أن يقف أمام الله إذا غضب؟"}], "arS": [["فأصنع", ["H6213"]], [" بك ما لم ", []], ["أصنعه", ["H6213"]], [" من قبل، وما لن ", []], ["أصنع", ["H6213"]], [" ", []], ["مثله", ["H3644"]], [" من ", []], ["بعد", ["H5750"]], ["، ", []], ["عقابا", ["H3282"]], [" لك على ", []], ["جميع", ["H3605"]], [" ", []], ["أرجاسك", ["H8441"]], [".", []]]}, {"c": 5, "v": 10, "text": "إذ يأكل الآباء أبناءهم، والأبناء آباءهم، لأنني أجري فيك قضاء وأذري بقيتك كلها مع كل ريح.", "groups": [{"kw": "the fathers", "raw": "Lev_26:29; Deu_28:53-57, Deu_28:64; 2Ki_6:29; Isa_9:20, Isa_49:26; Jer_19:9; Lam_2:20, Lam_4:10", "note": "", "refs": [{"l": "Lev 26:29", "n": "", "vs": [[29, "فتأكلون لحم أبنائكم وبناتكم."]]}, {"l": "Deu 28:53-57", "n": "", "vs": [[53, "فتأكلون في أثناء الحصار والضيقة التي يضايقكم بها عدوكم ثمار بطونكم، لحم أبنائكم وبناتكم الذين رزقكم بهم الرب إلهكم."], [54, "فيقسو قلب أكثركم رقة ورأفة على أخيه وامرأته التي في حضنه وسائر أبنائه الأحياء."], [55, "فلا يعطي أحدهم من لحم أبنائه، الذي يأكله، لأنه لم يبق لديه شيء سواه في الحصار والضيقة التي يضايقكم بها عدوكم في جميع مدنكم."], [56, "وكذلك فإن أكثر النساء رقة ورأفة، والتي لنعومتها وترفهها لا تجرؤ على لمس الأرض بباطن قدمها، تبخل على زوجها رجل حضنها وعلى ابنها وابنتها"], [57, "بمشيمتها الساقطة منها، وبأولادها الذين تلدهم، لأنها تنوي أن تأكلهم سرا في أثناء الحصار، في الضيقة التي يضايقكم بها عدوكم في كل مدنكم."]]}, {"l": "Deu 28:64", "n": "", "vs": [[64, "ويشتتكم الرب بين جميع الأمم من أقصى الأرض إلى أقصاها، فتعبدون هناك آلهة أخرى من خشب أو حجر لم تعرفوها أنتم ولا آباؤكم،"]]}, {"l": "2Ki 6:29", "n": "", "vs": [[29, "فسلقنا ابني وأكلناه. وعندما قلت لها في اليوم التالي: هاتي ابنك لنأكله، خبأت ابنها»."]]}, {"l": "Isa 9:20", "n": "", "vs": [[20, "يلتهمون ذات اليمين ولكن يظلون جياعا، ويفترسون ذات الشمال ولا يشبعون. كل واحد منهم يأكل لحم أخيه."]]}, {"l": "Isa 49:26", "n": "", "vs": [[26, "وأجعل مضطهديك يلتهمون لحوم أجسادهم، ويسكرون بدمهم كمن يشرب خمرا. عندئذ يدرك كل ذي جسد أنني أنا الرب مخلصك وفاديك إله يعقوب القدير."]]}, {"l": "Jer 19:9", "n": "", "vs": [[9, "وأطعمهم لحوم أبنائهم وبناتهم، ويأكل كل واحد لحم جاره في أثناء الحصار والضيقة التي يضايقهم بها أعداؤهم وطالبو نفوسهم."]]}, {"l": "Lam 2:20", "n": "", "vs": [[20, "انظر يارب وتأمل! بمن صنعت هذا؟ أعلى النساء أن يأكلن ثمرة بطونهن، وأطفال حضانتهن؟ أيتحتم على الكاهن والنبي أن يقتلا في مقدس الرب؟"]]}, {"l": "Lam 4:10", "n": "", "vs": [[10, "طهت أيدي الأمهات الحانيات أولادهن ليكونوا طعاما لهن في أثناء دمار ابنة شعبي."]]}], "kwAr": "يأكل الآباء أبناءهم", "noteAr": ""}, {"kw": "the whole", "raw": "Eze_5:2, Eze_5:12, Eze_6:8, Eze_12:14, Eze_20:23, Eze_22:15, Eze_36:19; Lev_26:33; Deu_4:27, Deu_28:64; Deu_32:26; Neh_1:8; Psa_44:11; Jer_9:16, Jer_44:12, Jer_50:17; Amo_9:9; Zec_2:6; Zec_7:14; Luk_21:24", "note": "", "refs": [{"l": "Eze 5:2", "n": "", "vs": [[2, "واحرق بالنار ثلثا في وسط المدينة إذا اكتملت أيام الحصار، ثم تناول ثلثا آخر واضربه بالسيف حول خريطة المدينة المرسومة. أما الثلث الأخير فذره مع الريح، وأنا أستل سيفا خلفه."]]}, {"l": "Eze 5:12", "n": "", "vs": [[12, "ثلث سكانك يموتون بالوباء والجوع في وسطك، وثلث ثان يقتل حولك بالسيف، وثلث أخير أشتته بين الأمم وأتعقبه بسيف مسلول."]]}, {"l": "Eze 6:8", "n": "", "vs": [[8, "وأعفو عن بقية منكم ليكون لكم ناجون من السيف يتشتتون بين الأمم، إذ تتبددون في كل الأرض."]]}, {"l": "Eze 12:14", "n": "", "vs": [[14, "وأبدد حاشيته وأعوانه وكل جيوشه في كل مكان وأتعقبهم بسيف مسلول."]]}, {"l": "Eze 20:23", "n": "", "vs": [[23, "وحلفت لهم في البرية أن أفرقهم بين الأمم وأشتتهم عبر البلدان."]]}, {"l": "Eze 22:15", "n": "", "vs": [[15, "سأشتتك بين الأمم، وأبعثرك في البلدان، وأزيل نجاستك منك."]]}, {"l": "Eze 36:19", "n": "", "vs": [[19, "ففرقتهم بين الأمم وشتتهم في البلدان، ودنتهم بمقتضى طريقهم وتصرفاتهم."]]}, {"l": "Lev 26:33", "n": "", "vs": [[33, "وأشتتكم بين الشعوب، وأجرد عليكم سيفي، وألاحقكم، وأحول أرضكم إلى قفر ومدنكم إلى خرائب."]]}, {"l": "Deu 4:27", "n": "", "vs": [[27, "ويشتتكم الرب بين الأمم فتصبحون أقلية بين الشعوب التي يسوقكم إليها."]]}, {"l": "Deu 28:64", "n": "", "vs": [[64, "ويشتتكم الرب بين جميع الأمم من أقصى الأرض إلى أقصاها، فتعبدون هناك آلهة أخرى من خشب أو حجر لم تعرفوها أنتم ولا آباؤكم،"]]}, {"l": "Deu 32:26", "n": "", "vs": [[26, "قلت: أشتتهم في زوايا الأرض، وأمحو من بين الناس ذكرهم."]]}, {"l": "Neh 1:8", "n": "", "vs": [[8, "اذكر تحذيرك الذي أنذرت به عبدك موسى قائلا: إن خنتم عهدي فإني أشتت شملكم بين الشعوب."]]}, {"l": "Psa 44:11", "n": "", "vs": [[11, "أسلمتنا كغنم معدة للذبح، وبددتنا بين الأمم."]]}, {"l": "Jer 9:16", "n": "", "vs": [[16, "وأشتتهم بين الأمم التي لم يعرفوها هم ولا آباؤهم، وأجعل سيف الدمار يتعقبهم حتى أفنيهم»."]]}, {"l": "Jer 44:12", "n": "", "vs": [[12, "وآخذ بقية يهوذا الذين وطدوا العزم على الرحيل إلى مصر ليتغربوا فيها، وأفنيهم كلهم هناك، فيهلكون بالسيف والجوع من صغيرهم إلى كبيرهم، فيموتون ويصبحون سبة ودهشة ولعنة وعارا."]]}, {"l": "Jer 50:17", "n": "", "vs": [[17, "إسرائيل قطيع غنم متشتت، طردته الأسود. كان ملك أشور أول من افترسه، ونبوخذناصر آخر من هشم عظامه."]]}, {"l": "Amo 9:9", "n": "", "vs": [[9, "أغربل بيت إسرائيل بين جميع الأمم كما تغربل الحنطة في غربال، فلا تسقط حبة على الأرض."]]}, {"l": "Zec 2:6", "n": "", "vs": [[6, "هيا أسرعوا، اهربوا من أرض الشمال، فقد شتتكم في أربعة أرجاء الأرض، يقول الرب."]]}, {"l": "Zec 7:14", "n": "", "vs": [[14, "فبددتهم بالزوبعة بين الأمم التي لم يعرفوها من قبل، فصارت الأرض التي نفوا منها خرابا لا يجتازها ذاهب أو راجع، وأضحت الأرض المبهجة قفرا»."]]}, {"l": "Luk 21:24", "n": "", "vs": [[24, "فيسقطون بحد السيف ويساقون أسرى إلى جميع الأمم، وتبقى أورشليم تدوسها الأمم إلى أن تكتمل أزمنة الأمم."]]}], "kwAr": "بقيتك كلها", "noteAr": ""}], "arS": [["إذ ", []], ["يأكل", ["H398"]], [" ", []], ["الآباء", ["H1"]], [" ", []], ["أبناءهم", ["H1121"]], ["، ", []], ["والأبناء", ["H1121"]], [" ", []], ["آباءهم", ["H1"]], ["، لأنني ", []], ["أجري", ["H6213"]], [" فيك ", []], ["قضاء", ["H8201"]], [" ", []], ["وأذري", ["H2219"]], [" ", []], ["بقيتك", ["H7611"]], [" ", []], ["كلها", ["H3605"]], [" مع ", []], ["كل", ["H3605"]], [" ", []], ["ريح", ["H7307"]], [".", []]]}, {"c": 5, "v": 11, "text": "لهذا حي أنا يقول السيد الرب، لأنك قد دنست مقدسي بكل أصنامك المكروهة، وبجميع رجاساتك، فأنا أيضا أستأصل، ولا تترَأف عليك عيني ولا أعفو.", "groups": [{"kw": "as I live", "raw": "Num_14:28-35; Psa_95:11; Amo_8:7; Heb_6:13", "note": "", "refs": [{"l": "Num 14:28-35", "n": "", "vs": [[28, "فقل لهم: حي أنا يقول الرب، لأنزلن بكم كل ما تكلمتم به في مسمعي."], [29, "إذ تتساقط جثثكم في هذه الصحراء، من ابن عشرين سنة فما فوق ممن تم إحصاؤهم وتذمروا علي."], [30, "لن تدخلوا الأرض التي وعدت رافعا يدي بقسم أن أسكنكم فيها، ما عدا كالب بن يفنة ويشوع بن نون."], [31, "غير أني سأدخل إليها أولادكم الذين ادعيتم أنهم يصبحون أسرى، فيتمتعون بالأرض التي احتقرتموها."], [32, "أما أنتم فإن جثثكم تتساقط في هذا القفر،"], [33, "ويبقى بنوكم في الصحراء أربعين سنة، تعانون من فجوركم، حتى تبلى جثثكم فيها."], [34, "وتحملون أوزاركم أربعين سنة. كل يوم بسنة، على عدد الأيام الأربعين التي تجسستم فيها الأرض، فتدركون عاقبة ابتعادي عنكم."], [35, "أنا الرب قد تكلمت، وهذا ما سأعاقب به هذه الجماعة الشريرة المتآمرة علي: في هذه الصحراء يفنون ويموتون»."]]}, {"l": "Psa 95:11", "n": "", "vs": [[11, "فأقسمت في غضبي قائلا: «إنهم لن يدخلوا مكان راحتي»."]]}, {"l": "Amo 8:7", "n": "", "vs": [[7, "قد أقسم الرب بعزة يعقوب قائلا: «لن أنسى شيئا من مساوئهم."]]}, {"l": "Heb 6:13", "n": "", "vs": [[13, "لنأخذ وعد الله لإبراهيم مثلا. فلما قطع له ذلك الوعد، أقسم بنفسه، إذ ليس هنالك من هو أعظم منه حتى يقسم به."]]}], "kwAr": "حي أنا", "noteAr": ""}, {"kw": "thou hast", "raw": "Eze_8:5, Eze_8:6, Eze_8:16, Eze_23:28, Eze_44:7; 2Ki_21:4, 2Ki_21:7, 2Ki_23:12; 2Ch_33:4, 2Ch_33:7, 2Ch_36:14; Jer_7:9-11, Jer_32:34", "note": "", "refs": [{"l": "Eze 8:5", "n": "", "vs": [[5, "ثم خاطبني: «ياابن آدم، التفت الآن نحو الشمال». فالتفت وإذا بي أرى من شمالي باب المذبح تمثال الغيرة هذا منتصبا في المدخل."]]}, {"l": "Eze 8:6", "n": "", "vs": [[6, "وقال لي: «ياابن آدم، هل شاهدت ما يرتكبون: هذه الرجاسات الفظيعة التي يقترفها شعب إسرائيل ليبعدوني عن مقدسي؟ ولكن انتظر، فلا تلبث أن تشهد أرجاسا أفظع»."]]}, {"l": "Eze 8:16", "n": "", "vs": [[16, "ثم أحضرني إلى الفناء الداخلي لبيت الرب، فإذا عند مدخل هيكل الرب بين الرواق والمذبح نحو خمسة وعشرين رجلا أداروا ظهورهم لهيكل الرب، واتجهوا بوجوههم نحو الشرق ساجدين للشمس."]]}, {"l": "Eze 23:28", "n": "", "vs": [[28, "ها أنا أسلمك إلى يد الذين كرهتهم وإلى أيدي الذين جفتهم نفسك."]]}, {"l": "Eze 44:7", "n": "", "vs": [[7, "إذ أدخلتم الغرباء غير المختوني القلوب واللحم إلى مقدسي، فدنستموه حين قربتم طعامي من شحم ودم، فنقضتم عهدي، فضلا عن كل رجاساتكم."]]}, {"l": "2Ki 21:4", "n": "", "vs": [[4, "وبنى مذابح في هيكل الرب في أورشليم الذي قال عنه الرب: «في أورشليم أجعل اسمي»."]]}, {"l": "2Ki 21:7", "n": "", "vs": [[7, "ونصب تمثال عشتاروث الذي صنعه، في الهيكل الذي قال الرب عنه لداود وسليمان: «في هذا الهيكل، وفي أورشليم التي اخترتها من الأرض، التي وهبتها لآبائهم، أجعل اسمي إلى الأبد."]]}, {"l": "2Ki 23:12", "n": "", "vs": [[12, "وهدم الملك المذابح التي على سطح علية آحاز التي أقامها ملوك يهوذا، وأيضا المذابح التي بناها منسى في ساحتي الهيكل، وسحق حجارتها هناك ثم ذراها في وادي قدرون"]]}, {"l": "2Ch 33:4", "n": "", "vs": [[4, "وبنى مذابح في هيكل الرب الذي قال عنه الرب في أورشليم أجعل اسمي إلى الأبد."]]}, {"l": "2Ch 33:7", "n": "", "vs": [[7, "وعمل تمثالا نصبه في هيكل الله، الذي قال الله عنه لداود ولسليمان ابنه: rified in the many persecutions and miseries which the Jews have suffered at different times, in the various countries into which they are dispersed. Eze_5:2, Eze_12:14; Lev_26:33; Deu_28:65; Jer_42:16, Jer_42:17, Jer_42:22, Jer_43:10,Jer_43:11, Jer_44:27; Amo_9:4", "note": "This was particularly fulfilled in the destruction of those who retired to Egypt; and has been remarkably verified in the many persecutions and miseries which the Jews have suffered at different times, in the various countries into which they are dispersed. Eze_5:2, Eze_12:14; Lev_26:33; Deu_28:65; Jer_42:16, Jer_42:17, Jer_42:22, Jer_43:10,Jer_43:11, Jer_44:27; Amo_9:4", "refs": [{"l": "Eze 5:2", "n": "", "vs": [[2, "واحرق بالنار ثلثا في وسط المدينة إذا اكتملت أيام الحصار، ثم تناول ثلثا آخر واضربه بالسيف حول خريطة المدينة المرسومة. أما الثلث الأخير فذره مع الريح، وأنا أستل سيفا خلفه."]]}, {"l": "Eze 12:14", "n": "", "vs": [[14, "وأبدد حاشيته وأعوانه وكل جيوشه في كل مكان وأتعقبهم بسيف مسلول."]]}, {"l": "Lev 26:33", "n": "", "vs": [[33, "وأشتتكم بين الشعوب، وأجرد عليكم سيفي، وألاحقكم، وأحول أرضكم إلى قفر ومدنكم إلى خرائب."]]}, {"l": "Deu 28:65", "n": "", "vs": [[65, "ولا تجدون بين تلك الأمم اطمئنانا ولا مقرا لقدم، بل يعطيكم الرب قلبا هلعا، وعيونا أوهنها الترقب، ونفوسا يائسة."]]}, {"l": "Jer 42:16", "n": "", "vs": [[16, "فالسيف الكلداني الذي تخشونه يدرككم هناك في ديار مصر، والجوع الذي تفزعون منه يلاحقكم إلى مصر فتموتون هناك."]]}, {"l": "Jer 42:17", "n": "", "vs": [[17, "وكل من استقر عزمه من الشعب على الانطلاق إلى مصر والتغرب هناك يموت بالسيف والجوع والوباء، ولا يفلت ناج من الشر الذي أجلبه عليهم."]]}, {"l": "Jer 42:22", "n": "", "vs": [[22, "فثقوا الآن أنكم تموتون بالسيف والجوع والوباء في ذات الموضع الذي نويتم الارتحال إليه والتغرب فيه»."]]}, {"l": "Jer 43:10", "n": "", "vs": [[10, "وقل لهم، هذا ما يعلنه الرب القدير إله إسرائيل: ها أنا آتي بعبدي نبوخذناصر وأنصب عرشه فوق هذه الحجارة التي طمرتها، فيبسط أريكته الملكية عليها."]]}, {"l": "Jer 43:11", "n": "", "vs": [[11, "سيقبل ويدمر ديار مصر، فيموت من ي تنجس عيونهم، ولم يهجروا أصنام مصر. فقلت: سأسكب عليهم غضبي وأنفث فيهم كامل سخطي في وسط ديار مصر."]]}, {"l": "Eze 20:21", "n": "", "vs": [[21, "فتمرد الأبناء علي. لم يسلكوا في فرائضي ولم يحفظوا أحكامي ليعملوها التي إن عملها إنسان يحيا بها، ونجسوا سبوتي. فقلت إني أسكب غضبي عليهم لأتم سخطي عليهم في البرية."]]}, {"l": "Jer 25:12", "n": "", "vs": [[12, "وفي ختام السبعين سنة أعاقب ملك بابل وأمته، وأرض الكلدانيين على إثمهم، وأحولها إلى خراب أبدي»، يقول الرب."]]}, {"l": "Lam 4:11", "n": "", "vs": [[11, "نفث الرب كامل سخطه وصب حمو غضبه، وأضرم نارا في صهيون فالتهمت أسسها."]]}, {"l": "Lam 4:22", "n": "", "vs": [[22, "قد تم إثمك ياابنة صهيون، ولن يطيل (الله ) من حقبة سبيك. أما أنت ياابنة أدوم فإنه يعاقبك ويفضح خطاياك."]]}, {"l": "Dan 9:2", "n": "", "vs": [[2, "في السنة الأولى من ملكه، أدركت أنا دانيآل، من دراسة الأسفار التي دون فيها وحي الرب إلى إرميا، أن عدد السنوات التي قضي بها على خراب أورشليم هو سبعون سنة."]]}, {"l": "Dan 11:36", "n": "", "vs": [[36, "ويصنع الملك ما يطيب له، ويتعظم على كل إله، ويجدف بالعظائم على إله الآلهة، ويفلح، إلى أن يحين اكتمال الغضب إذ لابد أن يتم ما قضى الله به."]]}], "kwAr": "أنفس عن غضبي", "noteAr": ""}, {"kw": "I will cause", "raw": "Eze_16:42, Eze_16:63, Eze_21:17, Eze_23:25, Eze_24:13; Isa_1:21", "note": "", "refs": [{"l": "Eze 16:42", "n": "", "vs": [[42, "حينئذ أسكن شدة غضبي عليك وأصرف عنك غيرتي فأهدأ ولا أسخط بعد."]]}, {"l": "Eze 16:63", "n": "", "vs": [[63, "لكي تتذكري فتخجلي ولا تفتحي فمك من بعد بسبب خزيك، حين أغفر لك كل ما ارتكبت من شر يقول السيد الرب»."]]}, {"l": "Eze 21:17", "n": "", "vs": [[17, "وأنا أيضا أصفق بكفي وأهديء سورة غضبي، أنا الرب تكلمت»."]]}, {"l": "Eze 23:25", "n": "", "vs": [[25, "وأصب سخطي عليك فيعاملونك بغيظ. يجدعون أنفك وأذنيك، وتقتل بقيتك بالسيف. يأسرون أبناءك وبناتك، وتلتهم النار بقيتك،"]]}, {"l": "Eze 24:13", "n": "", "vs": [[13, "في قذارتك رذيلة لأني سعيت لتطهيرك، فلم تطهري ولن تطهري من نجاستك حتى أصب عليك غضبي."]]}, {"l": "Isa 1:21", "n": "", "vs": [[21, "كيف صارت المدينة الأمينة عاهرة؟ كانت تفيض حقا، ويأوي إليها العدل، فأصبحت وكرا للمجرمين."]]}], "kwAr": "يخمد سخطي", "noteAr": ""}, {"kw": "I will be", "raw": "Deu_32:36; Isa_1:24; Zec_6:8", "note": "", "refs": [{"l": "Deu 32:36", "n": "", "vs": [[36, "لأن الرب يدين شعبه ويرأف بعبيده. عندما يرى أن قوتهم قد اضمحلت ولم يبق عبد ولا حر،"]]}, {"l": "Isa 1:24", "n": "", "vs": [[24, "لذلك يقول السيد رب الجنود، عزيز إسرائيل: «لأستريحن من مقاومي ولأنتقمن من أعدائي."]]}, {"l": "Zec 6:8", "n": "", "vs": [[8, "ثم هتف بي: «انظر! إن التي قصدت أرض الشمال قد نفذت قضائي، فأخمدت سورة غضبي هناك»."]]}], "kwAr": "إذ أكون قد انتقمت", "noteAr": ""}, {"kw": "spoken", "raw": "Eze_6:10, Eze_36:5, Eze_36:6, Eze_38:18, Eze_38:19; Isa_9:7, Isa_59:17", "note": "", "refs": [{"l": "Eze 6:10", "n": "", "vs": [[10, "فيدركون أني أنا الرب، لم أتكلم عبثا حين توعدتهم بهذا الشر»."]]}, {"l": "Eze 36:5", "n": "", "vs": [[5, "ها أنا في أثناء احتدام نار غيرتي أصدرت قضائي على بقية الأمم وعلى أدوم قاطبة، الذين اغتصبوا أرضي ميراثا لهم، بقلوب مغتبطة ونفوس حاقدة لتكون لهم نهبا وغنيمة."]]}, {"l": "Eze 36:6", "n": "", "vs": [[6, "لذلك تنبأ عن أرض إسرائيل وقل للجبال والتلال والأودية: هذا ما يعلنه السيد الرب: ها أنا في غيرتي وسخطي قد أصدرت قضائي لأنكم قد تحملتم تعيير الأمم،"]]}, {"l": "Eze 38:18", "n": "", "vs": [[18, "ويقول السيد الرب: في ذلك اليوم عندما يزحف جوج على أرض إسرائيل يحتدم غضبي في وجهي."]]}, {"l": "Eze 38:19", "n": "", "vs": [[19, "وفي خضم غيرتي واتقاد سخطي أقول إنه في ذلك اليوم تحدث هزة عظيمة في أرض إسرائيل،"]]}, {"l": "Isa 9:7", "n": "", "vs": [[7, "ولا تكون نهاية لنمو رياسته وللسلام اللذين يسودان عرش داود ومملكته، ليثبتها ويعضدها بالحق والبر، من الآن وإلى الأبد. إن غيرة الرب القدير تتمم هذا."]]}, {"l": "Isa 59:17", "n": "", "vs": [[17, "فتدرع بالبر وارتدى على رأسه خوذة الخلاص، واكتسى بثياب الانتقام، والتف بعباءة الغضب."]]}], "kwAr": "أصدرت قضائي", "noteAr": ""}], "arS": [["وهكذا ", []], ["أنفس", ["H639"]], [" عن ", []], ["غضبي", ["H2534"]], [" ", []], ["ويخمد", ["H5117"]], [" ", []], ["سخطي", ["H2534"]], [" إذ أكون قد ", []], ["انتقمت", ["H3615"]], [". وحين يست  محافل الله في البلاد."], [9, "لم نعد نشهد رموز عبادتنا، ولم يبق نبي بعد، وليس بيننا من يعرف متى تكون خاتمة الأمر."], [10, "ياالله : إلى متى يعيرنا الخصم؟ أيظل العدو يستهين باسمك إلى الأبد؟"]]}, {"l": "Psa 79:1-4", "n": "", "vs": [[1, "ياالله ، إن الأمم قد دخلت ميراثك ونجست هيكلك المقدس وجعلت أورشليم أكواما."], [2, "جعلوا جثث عبيدك مأكلا لطيور السماء، ولحوم قديسيك لوحوش الأرض."], [3, "سفكوا دماءهم كالماء حول أورشليم، وليس هناك من يدفنهم."], [4, "قد صرنا عارا عند جيراننا، ومثار هزء وأضحوكة لمن حولنا."]]}, {"l": "Isa 64:10", "n": "", "vs": [[10, "قد استحالت مدينتك المقدسة إلى قفر، وأصبحت صهيون برية وأورشليم موحشة،"]]}, {"l": "Isa 64:11", "n": "", "vs": [[11, "واحترق بالنار هيكلنا المقدس البهي، الذي شدا آباؤنا فيه بتسبيحك، وصار كل ما هو أثير لدينا خرابا."]]}, {"l": "Jer 19:8", "n": "", "vs": [[8, "وأدمر هذه المدينة وأجعلها مثار صفير. كل من يمر بها تعتريه الدهشة ويصفر لما حل بها من نكبات."]]}, {"l": "Jer 24:9", "n": "", "vs": [[9, "وأوقعهم في الضيق والشر في جميع ممالك الأرض، وأجعلهم عارا وعبرة وأحدوثة ولعنة في جميع الأماكن التي أجليهم إليها."]]}, {"l": "Jer 24:10", "n": "", "vs": [[10, "وأعرضهم للسيف والجوع والوباء حتى يفنوا في الأرض التي وهبتها لهم ولآبائهم»."]]}, {"l": "Jer 42:18", "n": "", "vs": [[18, "لأن هذا ما يعلنه الرب القدير إله إسرائيل. كما انسكب غضبي وسخطي على أهل أورشليم، كذلك ينسكب سخطي عليكم إذا ذهبتم إلى مصر، فتصبحون مثار سبة ودهشة ولعنة وعار، ولا تعودون ترون هذا الموضع»."]]}, {"l": "Lam 1:4", "n": "", "vs": [[4, "تنوح الطرق المفضية إلى صهيون، لأنها أقفرت من القادمين إلى الأعيا د! تهدمت بواباتها جميعا. كهنتها يتنهدون؛ عذاراها متحسرات وهي تقاسي مر العذاب."]]}, {"l": "Lam 1:8", "n": "", "vs": [[8, "ارتكبت أورشليم خطيئة نكراء فأصبحت رجسة. جميع مكرميها يحتقرونها لأنهم شهدوا عريها، أما هي فتنهدت وتراجعت القهقرى."]]}, {"l": "Lam 2:15-17", "n": "", "vs": [[15, "كل عابري السبيل صفقوا عليك بالأيادي فرحا. صفروا وهزوا رؤوسهم على ابنة أورشليم وتساءلوا: أهذه هي المدينة التي تدعى كاملة الجمال وبهجة الأرض بأسرها؟"], [16, "قد فغر جميع أعدائك أشداقهم. يصفرون ويحرقون الأسنان. يهتفون: قد ابتلعناها. هذا هو اليوم الذي طال انتظارنا له. قد عشنا وشهدناه!"], [17, "نفذ الرب قضاءه، وحقق وعيده الذي حكم به منذ الحقب السالفة. هدم ولم يرأف، فأشمت بك الخصم، وعظم قوة عدوك."]]}, {"l": "Lam 5:18", "n": "", "vs": [[18, "لأن جبل صهيون أضحى أطلالا ترتع فيه الثعالب."]]}, {"l": "Mic 3:12", "n": "", "vs": [[12, "لهذا من جراء أعمالكم ستحرث صهيون كالحقل وتصبح أورشليم كومة من الخرائب، وجبل الهيكل مرتفعا تنمو عليه أشجار الغاب."]]}], "kwAr": "وأجعلك خرابا", "noteAr": ""}, {"kw": "the nations", "raw": "Eze_5:8", "note": "", "refs": [{"l": "Eze 5:8", "n": "", "vs": [[8, "ها أنا أيضا أنقلب عليك ياأورشليم، وأجري عليك قضاء على مشهد من الأمم،"]]}], "kwAr": "بين الأمم المحيطة بك", "noteAr": ""}], "arS": [["وأجعلك", ["H5414"]], [" ", []], ["خرابا", ["H2723"]], [" ", []], ["وعارا", ["H2781"]], [" بين ", []], ["الأمم", ["H1471"]], [" ", []], ["المحيطة", ["H5439"]], [" بك ", []], ["وأمام", ["H5869"]], [" ", []], ["كل", ["H3605"]], [" من ", []], ["يجتاز", ["H5674"]], [" بك،", []]]}, {"c": 5, "v": 15, "text": "فتكونين عارا ولعنة وعبرة ومثار دهشة للأمم المحيطة بك حين أنفذ فيك قضائي بغضب وغيظ وتقريعات حانقة. أنا الرب قد تكلمت.", "groups": [{"kw": "an instruction", "raw": "Deu_29:24-28; 1Ki_9:7; Psa_79:4; Isa_26:9; Jer_22:8, Jer_22:9; 1Co_10:11", "note": "", "refs": [{"l": "Deu 29:24-28", "n": "", "vs": [[24, "فتقول جميع الأمم: لماذا فعل الرب هذا كله بهذه الأرض؟ ولماذا احتدام هذا الغضب العظيم؟"], [25, "فيكون الجواب: لأن هذا الشعب نقض عهد الرب إله آبائهم الذي قطعه معهم حين أخرجهم من ديار مصر،"], [26, "وغووا وعبدوا آلهة أخرى وسجدوا لها، آلهة غريبة لم يعرفوها ولم يعطها الرب لهم،"], [27, "فالتهب غضب الرب على تلك الأرض، فصب عليها كل اللعنات المدونة فى هذا الكتاب"], [28, "واجتثهم من أرضهم بغضب وسخط وغيظ عظيم، وطوح بهم إلى أرض أخرى كما هو حادث اليوم."]]}, {"l": "1Ki 9:7", "n": "", "vs": [[7, "فإني أبيد إسرائيل عن وجه الأرض التي وهبتها لهم، وأنبذ الهيكل الذي قدسته لاسمي، فيصبح إسرائيل مثلا ومثار هزء لجميع الأمم."]]}, {"l": "Psa 79:4", "n": "", "vs": [[4, "قد صرنا عارا عند جيراننا، ومث :5-7; Lam_3:12", "note": "", "refs": [{"l": "Deu 32:23", "n": "", "vs": [[23, "أكوم عليهم شرورا وأنفذ سهامي فيهم."]]}, {"l": "Deu 32:24", "n": "", "vs": [[24, "وحين يكونون خائرين من الجوع، منهوكين من الحمى والداء السام، أجعل أنياب الوحوش مع سم زواحف الأرض تنشب فيهم."]]}, {"l": "Psa 7:13", "n": "", "vs": [[13, "أعد له الأسلحة القتالة، وجعل سهامه محرقة."]]}, {"l": "Psa 91:5-7", "n": "", "vs": [[5, "فلا تخاف من هول الليل ولا من سهم يطير في النهار."], [6, "ولا من وباء يسري في الظلام، ولا من هلاك يفسد في الظهيرة."], [7, "يتساقط عن جانبك ألف إنسان، وعن يمينك عشرة آلاف، وأنت لا يمسك سوء."]]}, {"l": "Lam 3:12", "n": "", "vs": [[12, "وتر قوسه ونصبني هدفا لسهمه."]]}], "kwAr": "سهام الجوع المميتة", "noteAr": ""}, {"kw": "and will", "raw": "Eze_4:16, Eze_14:13; Lev_26:26; 2Ki_6:25; Isa_3:1", "note": "", "refs": [{"l": "Eze 4:16", "n": "", "vs": [[16, "ياابن آدم، ها أنا أبيد مؤونة الخبز في أورشليم، فيأكلون الخبز بالوزن معجونا بالغم، ويشربون الماء بالكيل ممزوجا بالحيرة."]]}, {"l": "Eze 14:13", "n": "", "vs": [[13, "«ياابن آدم، إذا أخطأت إلي أرض وخانت عهدي، أعاقبها وأعوزها مؤونة الخبز وأشيع فيها الجوع، وأفني منها الناس والبهائم،"]]}, {"l": "Lev 26:26", "n": "", "vs": [[26, "وحين أقطع عنكم مؤونة الدقيق، تخبز عشر نساء خبزكم في فرن واحد لقلة الدقيق، وتقسمون الخبز بالميزان فتأكلون ولا تشبعون."]]}, {"l": "2Ki 6:25", "n": "", "vs": [[25, "وإذ طال الحصار، عمت المجاعة السامرة حتى صار رأس الحمار يباع بثمانين قطعة من الفضة، وأوقية زبل الحمام بخمس قطع من الفضة."]]}, {"l": "Isa 3:1", "n": "", "vs": [[1, "ها هو الرب القدير مزمع أن يقطع عن أورشليم ويهوذا الطعام والماء."]]}], "kwAr": "وأبيد مؤونة خبزكم", "noteAr": ""}], "arS": [["وعندما ", []], ["أرسل", ["H7971"]], [" عليهم ", []], ["سهام", ["H2671"]], [" ", []], ["الجوع", ["H7458"]], [" ", []], ["المميتة", ["H7451"]], [" التي أعدت ", []], ["للتدمير", ["H4889"]], ["، السهام التي ", []], ["أرسلتها", ["H7971"]], [" ", []], ["لخرابكم", ["H7843"]], ["، عندئذ ", []], ["أزيد", ["H3254"]], [" من ", []], ["الجوع", ["H7458"]], [" عليكم ", []], ["وأبيد", ["H7665"]], [" ", []], ["مؤونة", ["H4294"]], [" ", []], ["خبزكم", ["H3899"]], ["،", []]]}, {"c": 5, "v": 17, "text": "وأرسل عليكم المجاعة والوحوش الضارية، فتثكلكم ويعمكم الوباء وسفك الدماء، وأجلب عليكم السيف. أنا الرب قد قضيت».", "groups": [{"kw": "and evil", "raw": "Eze_14:15, Eze_14:21, Eze_33:27, Eze_34:25-28; Exo_23:29; Lev_26:22; Deu_32:24; 2Ki_17:25; Jer_15:3", "note": "", "refs": [{"l": "Eze 14:15", "n": "", "vs": [[15, "وإن أطلقت في تلك الأرض وحوشا ضارية فأقفرتها، وأصبحت أطلالا لا يجتاز فيها عابر خوفا من الوحوش،"]]}, {"l": "Eze 14:21", "n": "", "vs": [[21, "فكم بالأحرى يحدث إذا أرسلت أحكامي الأربعة الشديدة: الحرب والمجاعة والوحوش الضارية والوباء على أورشليم لأبيد منها الناس والبهائم."]]}, {"l": "Eze 33:27", "n": "", "vs": [[27, "قل لهم، هذا ما يعلنه السيد الرب: حي أنا، إن الذين يقيمون في الخرائب يقتلون بالسيف، والذين يسكنون في العراء أبذلهم قوتا للوحوش، والمتمنعون في الحصون والمغاور يموتون بالوباء."]]}, {"l": "Eze 34:25-28", "n": "", "vs": [[25, "وأبرم معهم ميثاق سلام، وأقضي على الوحوش الضارية في الأرض فيقيمون في الصحراء آمنين، وينامون في الغابات مطمئنين."], [26, "وأجعلهم مع ما يحيط بأكمتي بركة، وأسكب عليهم المطر في أوانه، فتكون أمطار بركة."], [27, "وتثمر شجرة الحقل، وتنتج الأرض غلتها، ويكونون آمنين في ديا رهم، ويدركون عندما أحطم نيرهم وأنقذهم من قبضة مستعبديهم أني أنا الرب."], [28, "فلا يكونون بعد غنيمة للأمم، ولا يفترسهم وحش الأرض، بل يسكنون آمنين لا يفزعهم أحد."]]}, {"l": "Exo 23:29", "n": "", "vs": [[29, "إنما لن أطردهم في سنة واحدة لئلا تقفر الأرض فتتكاثر عليك وحوش البرية،"]]}, {"l": "Lev 26:22", "n": "", "vs": [[22, "وأطلق عليكم وحوش الصحراء فتفترس أولادكم وتهلك بهائمكم، وتنقص من عددكم، فتقفر طرقاتكم."]]}, {"l": "Deu 32:24", "n": "", "vs": [[24, "وحين يكونون خائرين من الجوع، منهوكين من الحمى والداء السام، أجعل أنياب الوحوش مع سم زواحف الأرض تنشب فيهم."]]}, {"l": "2Ki 17:25", "n": "", "vs": [[25, "وإذ لم يعبد المستوطنون الجدد الرب في باديء الأمر، فقد أطلق الرب عليهم السباع المتوحشة فافترست بعضهم."]]}, {"l": "Jer 15:3", "n": "", "vs": [[3, "وأعهد بهم إلى لأشجار المتعالية، وعظمت الأشجار الدنية. يبست الشجر النضر، وأنضرت الشجر المتيبس، أنا الرب قلت وأنجزت»."]]}, {"l": "Eze 21:32", "n": "", "vs": [[32, "فتكونين وقودا للنار، ويهطل دمك في وسط الأرض، ولا تذكرين فيما بعد لأني أنا الرب تكلمت»."]]}, {"l": "Eze 22:14", "n": "", "vs": [[14, "فهل يصمد قلبك أو تحتفظ يداك بقوتهما في الأيام التي فيها أتعامل معك؟ أنا الرب قد تكلمت وأتمم ما أنطق به."]]}, {"l": "Eze 26:14", "n": "", "vs": [[14, "وأجعلك كصخرة جرداء، فتكونين منشرا للشباك، ولا تعمرين في ما بعد. لأني أنا الرب قضيت يقول السيد الرب."]]}, {"l": "Eze 30:12", "n": "", "vs": [[12, "وأجفف مجاري نهر النيل، وأبيع الأرض لقوم أشرار، وأخرب البلاد فيها بيد غرباء. أنا الرب قضيت."]]}, {"l": "Eze 37:14", "n": "", "vs": [[14, "وأضع روحي فيكم فتحيون، وأردكم إلى أرضكم فتدركون أني أنا الرب قد تكلمت وأنجزت ما وعدت به، يقول الرب»."]]}, {"l": "Mat 24:35", "n": "", "vs": [[35, "إن السماء والأرض تزولان؛ ولكن كلامي لا يزول أبدا."]]}], "kwAr": "أنا الرب قد قضيت", "noteAr": ""}], "arS": [["وأرسل", ["H7971"]], [" ", []], ["عليكم", ["H5921"]], [" ", []], ["المجاعة", ["H7458"]], [" ", []], ["والوحوش", ["H2416"]], [" ", []], ["الضارية", ["H7451"]], ["، ", []], ["فتثكلكم", ["H7921"]], [" ويعمكم ", []], ["الوباء", ["H1698"]], [" وسفك ", []], ["الدماء", ["H1818"]], ["، ", []], ["وأجلب", ["H935"]], [" عليكم ", []], ["السيف", ["H2719"]], [". ", []], ["أنا", ["H589"]], [" ", []], ["الرب", ["H3068"]], [" قد ", []], ["قضيت", ["H1696"]], ["».", []]]}], "strong": true}];</script>
