صاغوا لأنفسهم تمثالا مسبوكا."]]}, {"l": "Dan 12:1", "n": "", "vs": [[1, "«وفي ذلك الوقت يقوم الرئيس العظيم الملاك ميخائيل حارس شعبك، وذلك في أثناء ضيق لم يكن له مثيل منذ أن وجدت أمة حتى ذلك الزمان. غير أن كل من كان اسمه مدونا في الكتاب من شعبك ينجو في ذلك الزمان."]]}], "kwAr": "أبناء شعبك", "noteAr": ""}, {"kw": "speak", "raw": "Eze_3:27, Eze_2:5, Eze_2:7; Act_20:26, Act_20:27", "note": "", "refs": [{"l": "Eze 3:27", "n": "", "vs": [[27, "ولكن عندما أخاطبك، أفتح فمك فتقول لهم: هذا ما يعلنه الرب، من يسمع فليسمع، ومن يأب فليمتنع، لأنهم شعب متمرد»."]]}, {"l": "Eze 2:5", "n": "", "vs": [[5, "فإن سمعوا، أو أبوا لأنهم شعب عاص فإنهم يعلمون على الأقل أن نبيا بينهم."]]}, {"l": "Eze 2:7", "n": "", "vs": [[7, "إنما عليك أن تبلغهم كلامي سواء سمعوا أو أبوا، لأنهم شعب متمرد."]]}, {"l": "Act 20:26", "n": "", "vs": [[26, "لذلك أشهد لكم اليوم أني بريء من دمكم جميعا،"]]}, {"l": "Act 20:27", "n": "", "vs": [[27, "لأني لم أمتنع عن إبلاغكم جميع مقاصد الله."]]}], "kwAr": "وقل لهم", "noteAr": ""}], "arS": [["وامض", ["H1980", "H935"]], [" إلى ", []], ["المسبيين", ["H1473"]], [" من ", []], ["أبناء", ["H1121"]], [" ", []], ["شعبك", ["H5971"]], [" ", []], ["وقل", ["H559", "H1696"]], [" لهم: ", []], ["هذا", ["H3541"]], [" ما ", []], ["يعلنه", ["H559"]], [" السيد ", []], ["الرب", ["H3069"]], [". سواء ", []], ["سمعوا", ["H8085"]], [" لك أو ", []], ["أبوا", ["H2308"]], ["».", []]]}, {"c": 3, "v": 12, "text": "ثم حملني الروح، فسمعت خلفي صوت زلزلة عنيفة قائلا: «مبارك مجد الرب من مكانه».", "groups": [{"kw": "spirit", "raw": "Eze_3:14, Eze_2:2, Eze_8:3, Eze_11:1, Eze_11:24, Eze_40:1, Eze_40:2; 1Ki_18:12; 2Ki_2:16; Act_8:39", "note": "", "refs": [{"l": "Eze 3:14", "n": "", "vs": [[14, "وهكذا حلق بي روح الرب وحملني بعيدا، وقد جاشت حرارة روحي بمرارة نفسي، ولكن كانت يد الرب علي شديدة."]]}, {"l": "Eze 2:2", "n": "", "vs": [[2, "وحالما تكلم دخل في الروح وأنهضني على قدمي وسمعته يخاطبني:"]]}, {"l": "Eze 8:3", "n": "", "vs": [[3, "ثم مد شبه يد وقبض علي بناصية رأسي، وحلق بي روح بين الأرض والسماء وأحضرني في رؤى الله إلى أورشليم، إلى مدخل البوابة الشمالية للساحة الداخلية، حيث ينتصب التمثال المثير للغيرة."]]}, {"l": "Eze 11:1", "n": "", "vs": [[1, "ثم حلق بي الروح وأحضرني إلى بوابة بيت الرب الشرقية، فإذا عند مدخلها خمسة وعشرون رجلا، شاهدت في وسطهم يازنيا بن عزور وفلطيا بن بنايا رئيسي الشعب."]]}, {"l": "Eze 11:24", "n": "", "vs": [[24, "وحل الروح وأحضرني، في الرؤيا التي أعلنها لي روح الله، إلى أرض الجلاء في بلاد الكلدانيين، ثم ارتفعت عني الرؤيا التي شاهدتها،"]]}, {"l": "Eze 40:1", "n": "", "vs": [[1, "وفي اليوم العاشر من مطلع السنة الخامسة والعشرين من سبينا الموافقة للسنة الرابعة عشرة من سقوط أورشليم، كانت علي يد الرب فأحضرني إلى هناك،"]]}, {"l": "Eze 40:2", "n": "", "vs": [[2, "وأتى بي في رؤى الله إلى أرض إسرائيل، ووضعني على جبل شاهق حيث كان عليه من جهة الجنوب ما يشبه بناء المدينة."]]}, {"l": "1Ki 18:12", "n": "", "vs": [[12, "وما إن أنطلق من عندك لأخبره حتى يحملك روح الرب إلى حيث لا أدري، فيأتي أخآب ولا يجدك فيقتلني، وأنا عبدك أتقي الرب منذ صباي."]]}, {"l": "2Ki 2:16", "n": "", "vs": [[16, "وقالوا له: «إن بين عبيدك خمسين رجلا من ذوي البأس، فدعهم يذهبون للبحث عن سيدك. لعل روح الرب حمله وطرحه على أحد الجبال أو في أحد الأودية». فأجاب: «لا ترسلوا أحدا»."]]}, {"l": "Act 8:39", "n": "", "vs": [[39, "وما إن طلعا من الماء حتى خطف روح الرب فيلبس، فلم يعد الخصي يراه. فتابع سفره بفرح."]]}], "kwAr": "الروح", "noteAr": ""}, {"kw": "a voice", "raw": "Act_2:2; Rev_1:10,Rev_1:15", "note": "", "refs": [{"l": "Act 2:2", "n": "", "vs": [[2, "وفجأة حدث صوت من السماء كأنه دوي ريح عاصفة، فملأ البيت الذي كانوا جالسين فيه."]]}, {"l": "Rev 1:10", "n": "", "vs": [[10, "وفي يوم الرب، صرت في الروح، فسمعت من ورائي صوتا عاليا كصوت البوق"]]}, {"l": "Rev 1:15", "n": "", "vs": [[15, "رجلاه تلمعان كأنهما نحاس نقي مصقول بالنار، وصوته يدوي كصوت شلال غزير،"]]}], "kwAr": "صوت زلزلة عنيفة", "noteAr": ""}, {"kw": "Blessed", "raw": "Psa_72:18, Psa_72:19, Psa_103:20,Psa_103:21, Psa_148:2; Isa_6:3; Rev_5:11-14, Rev_19:6", "note": "", "refs": [{"l": "Psa 72:18", "n": "", "vs": [[18, "تبارك الرب إله إسرائيل، فهو وحده صانع العجائب."]]}, {"l": "Psa 72:19", "n": "", "vs": [[19, "تبارك اسمه المجيد إلى الأبد، ولتمتليء الأرض كلها من مجده. آمين ثم آمين."]]}, {"l": "Psa 103:20", "n": "", "vs": [[20, "باركوا الرب ياملائكته المقتدرين قوة، الفاعلين أمره فور صدور كلمته."]]}, {"l": "Psa 103:21", "n": "", "vs": [[21, "باركوا الرب ياجميع جنوده، ياخدامه العاملين رضاه."]]}, {"l": "Psa 148:2", "n": "", "vs": [[2, "سبحوه ياجميع ملائكته. سبحوه ياجميع أجناده."]]}, {"l": "Isa 6:3", "n": "", "vs": [[3, "ونادى أحدهم الآخر: «قدوس، قدوس، قدوس الرب القدير. مجده ملء كل الأرض»."]]}, {"l": "Rev 5:11-14", "n": "", "vs": [[11, "ثم نظرت، فسمعت ترتيل الملايين من الملائكة وهي تحيط بالعرش وبالكائنات الحية والشيوخ،"], [12, "وهم يهتفون بصوت عال: «مستحق هو الحمل المذبوح أن ينال القدرة والغنى والحكمة والقوة والإجلال والمجد والبركة»."], [13, "ثم سمعت كل خليقة في السماء وعلى الأرض، وتحت الأرض، وعلى البحر، هاتفة مع كل ما فيها: «البركة والإجلال والمجد والسلطة للجالس على العرش وللحمل، إلى أبد الآبدين»."], [14, "فردت الكائنات الحية الأربعة: «آمين!» وجثا الشيوخ ساجدين."]]}, {"l": "Rev 19:6", "n": "", "vs": [[6, "ثم سمعت صوتا كأنه صوت جمع كبير أو شلال غزير أو رعد شديد، يقول: «هللويا! فإن الرب الإله القادر على كل شيء قد ملك،"]]}], "kwAr": "مبارك", "noteAr": ""}, {"kw": "glory", "raw": "Eze_9:3, Eze_10:4, Eze_10:18, Eze_10:19, Eze_11:22, Eze_11:23; Exo_40:34, Exo_40:35; 1Sa_4:21, 1Sa_4:22", "note": "", "refs": [{"l": "Eze 9:3", "n": "", "vs": [[3, "فارتفع مجد الرب من حيث كان حالا فوق الكروبيم، واتجه نحو عتبة الباب. ونادى الرجل المرتدي ثوب الكتان، الحامل على خاصرته دواة الكاتب"]]}, {"l": "Eze 10:4", "n": "", "vs": [[4, "ثم ارتفع مجد الرب عن الكروب واستقر على عتبة الهيكل، فامتلأ الهيكل من السحابة، وغمر الفناء لمعان من مجد الرب."]]}, {"l": "Eze 10:18", "n": "", "vs": [[18, "وفارق مجد الرب عتبة الهيكل وخيم فوق الكروبيم."]]}, {"l": "Eze 10:19", "n": "", "vs": [[19, "وعندما ارتفع الكروبيم فردوا أجنحتهم وحلقوا فوق الأرض على مرأى مني، وحلقت العجلات معهم، ثم توقفوا عند مدخل بوابة بيت الرب الشرقي، ومجد الرب ما برح مخيما عليهم."]]}, {"l": "Eze 11:22", "n": "", "vs": [[22, "ثم فرد الكروبيم أجنحتهم وحلقوا مع العجلات ومع مجد الرب الذي ما برح مخيما عليهم من فوق."]]}, {"l": "Eze 11:23", "n": "", "vs": [[23, "وارتفع مجد الرب عن وسط المدينة ووقف على الجبل شرقي المدينة."]]}, {"l": "Exo 40:34", "n": "", "vs": [[34, "وما لبثت السحابة أن غطت خيمة الاجتماع وملأ جلال الرب المسكن،"]]}, {"l": "Exo 40:35", "n": "", "vs": [[35, "فلم يستطع موسى دخول خيمة الاجتماع، لأن السحابة حلت عليها، ومجد الرب ملأ المسكن."]]}, {"l": "1Sa 4:21", "n": "", "vs": [[21, "ودعت الصبي إيخابود قائلة: «قد زال المجد من إسرائيل»؛ لأن تابوت الله قد أخذ ومات حموها وزوجها"]]}, {"l": "1Sa 4:22", "n": "", "vs": [[22, "وهذا ما دعاها للقول: «قد زال المجد من إسرائيل لأن تابوت الله قد أخذ»."]]}], "kwAr": "مجد الرب", "noteAr": ""}], "arS": [["ثم ", []], ["حملني", ["H5375"]], [" ", []], ["الروح", ["H7307"]], ["، ", []], ["فسمعت", ["H8085"]], [" ", []], ["خلفي", ["H310"]], [" ", []], ["صوت", ["H6963"]], [" ", []], ["زلزلة", ["H7494"]], [" ", []], ["عنيفة", ["H1419"]], [" قائلا: «", []], ["مبارك", ["H1288"]], [" ", []], ["مجد", ["H3519"]], [" ", []], ["الرب", ["H3068"]], [" من ", []], ["مكانه", ["H4480", "H4725"]], ["».", []]]}, {"c": 3, "v": 13, "text": "فكان ذلك صوت أجنحة حين تلامست، وصوت العجلات المجاورة لها، فبدا كجلبة زلزال عنيف.", "groups": [{"kw": "the noise", "raw": "Eze_1:24, Eze_10:5; 2Sa_5:24", "note": "", "refs": [{"l": "Eze 1:24", "n": "", "vs": [[24, "وعندما سارت سمعت رفرفة أجنحتها كهدير مياه غزيرة، كصوت القدير، كصوت جلبة جيش، وعند توقفها كانت ترخي أجنحتها."]]}, {"l": "Eze 10:5", "n": "", "vs": [[5, "وبلغ صوت أجنحة الكروبيم الفناء الخارجي كصوت الله القدير إذا تكلم."]]}, {"l": "2Sa 5:24", "n": "", "vs": [[24, "وعندما تسمع صوت خطوات تنتقل فوق قمم أشجار البلسم فأسرع بالهجوم لأن الرب آنئذ يكون قد تقدمك للقضاء على معسكرهم»."]]}], "kwAr": "صوت أجنحة", "noteAr": ""}, {"kw": "touched", "raw": "Heb. kissed", "note": "Heb. kissed", "refs": [], "kwAr": "تلامست", "noteAr": "بالعبرية: قبّلت."}, {"kw": "and the noise", "raw": "Eze_10:16, Eze_10:17", "note": "", "refs": [{"l": "Eze 10:16", "n": "", "vs": [[16, "وعندما تحرك الكروبيم تحركت العجلات بجوارهم، وعندما فرد الكروبيم أجنحتهم ليحلقوا فوق الأرض، حلقت العجلات إلى جوارهم بنفس الاتجاه، ولم تحد عنهم."]]}, {"l": "Eze 10:17", "n": "", "vs": [[17, "فإن توقفوا توقفت، وإن حلقوا تحلق معهم، لأن روح الكائنات الحية كان فيها أيضا."]]}], "kwAr": "وصوت العجلات", "noteAr": ""}], "arS": [["فكان ذلك ", []], ["صوت", ["H6963"]], [" ", []], ["أجنحة", ["H3671"]], [" حين ", []], ["تلامست", ["H5401", "H802", "H269"]], ["، ", []], ["وصوت", ["H6963"]], [" ", []], ["العجلات", ["H212"]], [" ", []], ["المجاورة", ["H5980"]], [" لها، فبدا ", []], ["كجلبة", ["H6963"]], [" ", []], ["زلزال", ["H7494"]], [" ", []], ["عنيف", ["H1419"]], [".", []]]}, {"c": 3, "v": 14, "text": "وهكذا حلق بي روح الرب وحملني بعيدا، وقد جاشت حرارة روحي بمرارة نفسي، ولكن كانت يد الرب علي شديدة.", "groups": [{"kw": "the spirit", "raw": "Eze_3:12, Eze_8:3, Eze_37:1", "note": "", "refs": [{"l": "Eze 3:12", "n": "", "vs": [[12, "ثم حملني الروح، فسمعت خلفي صوت زلزلة عنيفة قائلا: «مبارك مجد الرب من مكانه»."]]}, {"l": "Eze 8:3", "n": "", "vs": [[3, "ثم مد شبه يد وقبض علي بناصية رأسي، وحلق بي روح بين الأرض والسماء وأحضرني في رؤى الله إلى أورشليم، إلى مدخل البوابة الشمالية للساحة الداخلية، حيث ينتصب التمثال المثير للغيرة."]]}, {"l": "Eze 37:1", "n": "", "vs": [[1, "وكانت يد الرب علي فأحضرني بالروح إلى وسط واد مليء بعظام،"]]}], "kwAr": "روح الرب", "noteAr": ""}, {"kw": "in bitterness, in the heat of my spirit", "raw": "Heb. bitter in hot anger, Num_11:11-19; Jer_6:11, Jer_20:14-18; Joh_4:1, Joh_4:3, Joh_4:9", "note": "Heb. bitter in hot anger, Num_11:11-19; Jer_6:11, Jer_20:14-18; Joh_4:1, Joh_4:3, Joh_4:9", "refs": [{"l": "Num 11:11-19", "n": "", "vs": [[11, "فقال موسى للرب: «لماذا أسأت إلى عبدك ولم ترض عنه حتى إنك حملته مسئولية هذا الشعب؟"], [12, "ألعلي حبلت به أو ولدته، حتى تقول لي احمله في حضنك كما يحمل المربي الرضيع، وقده إلى الأرض التي وعدت بها آباءه."], [13, "من أين أجيء بلحم يكفي جميع هذا الشعب؟ فإنهم يبكون إلي قائلين: أعطنا لحما لنأكل."], [14, "إنني عاجز عن حمل عبء هذا الشعب وحدي لأنه ثقيل علي."], [15, "إن كنت ستعاملني هكذا، فاقتلني، إن حظيت برضاك، فلا أشهد بليتي»."], [16, "فقال الرب لموسى: «اجمع إلي سبعين رجلا من رؤساء إسرائيل ممن تعلم أنهم حقا شيوخ الشعب وعرفاؤه، وأقبل بهم إلى خيمة الاجتماع ليمثلوا معك هناك."], [17, "فأنزل وأخاطبك هناك، وآخذ من الروح الذي عليك وأضع عليهم، فيعينونك في حمل مسئولية الشعب، فلا تحملها أنت وحدك."], [18, "وقل للشعب، أن يتقدسوا للغد، فيأكلوا لحما، لأنكم قد بكيتم في أذني الرب متسائلين: من يطعمنا لحما؟ لقد كان لنا خير في مصر. إن الرب سيعطيكم لحما فتأكلون."], [19, "وستأكلونه لا ليوم واحد، ولا ليومين، ولا لخمسة أيام أو لعشرة أيام ولا لعشرين يوما،"]]}, {"l": "Jer 6:11", "n": "", "vs": [[11, "لذلك امتلأت من سخط الرب وأعياني كظمه. أسكبه على الأولاد في الطريق وعلى الشبان المجتمعين في مجالسهم، فيصيب الرجل وزوجته والشيخ والطاعن في السن."]]}, {"l": "Jer 20:14-18", "n": "", "vs": [[14, "ليكن ملعونا ذلك اليوم الذي ولدت فيه، وليخل اليوم الذي أنجبتني فيه أمي من كل بركة."], [15, "ليكن ملعونا ذلك الرجل الذي بشر أبي قائلا: قد ولد لك ابن فجعل قلبه يفيض بالفرح."], [16, "ليصبح ذلك الرجل كالمدن التي قلبها الرب من غير رفق، وليسمع صراخ المعارك في الصباح، وضجيج جلبتها عند الظهيرة."], [17, "ليكن ذلك الرجل ملعونا لأنه لم يقتلني من الرحم، فتضحى أمي قبرا لي، وتظل حبلى بي إلى الأبد."], [18, "لماذا خرجت من الرحم لأقاسي التعب والأوجاع، وأفني أيامي بالخزي؟"]]}, {"l": "Joh 4:1", "n": "", "vs": [[1, "ولما عرف الرب أن الفريسيين سمعوا أنه يتخذ تلاميذ ويعمد أكثر من يوحنا،"]]}, {"l": "Joh 4:3", "n": "", "vs": [[3, "ترك منطقة اليهودية ورجع إلى منطقة الجليل."]]}, {"l": "Joh 4:9", "n": "", "vs": [[9, "فقالت له المرأة السامرية: «أنت يهودي وأنا سامرية، فكيف تطلب مني أن أسقيك؟» فإن اليهود كانوا لا يتعاملون مع أهل السامرة."]]}], "kwAr": "جاشت حرارة روحي بمرارة نفسي", "noteAr": "بالعبرية: مرا في حنق شديد. انظر عد 11: 11-19؛ إر 6: 11؛ 20: 14-18؛ يون 4: 1، 3، 9"}, {"kw": "but", "raw": "Eze_1:3, Eze_8:1, Eze_37:1; 1Ki_18:46; 2Ki_2:16, 2Ki_3:15; Jer_20:7-9", "note": "", "refs": [{"l": "Eze 1:3", "n": "", "vs": [[3, "أوحى الرب إلى حزقيال الكاهن ابن بوزي عند جوار نهر خابور، في ديار الكلدانيين، إذ كانت علي يد الرب،"]]}, {"l": "Eze 8:1", "n": "", "vs": [[1, "وفي اليوم الخامس من الشهر السادس العبري (أي آب ; أغسطس) من السنة السادسة، بينما كنت جالسا في بيتي، وشيوخ يهوذا ماثلون أمامي، حلت علي قوة السيد الرب هناك،"]]}, {"l": "Eze 37:1", "n": "", "vs": [[1, "وكانت يد الرب علي فأحضرني بالروح إلى وسط واد مليء بعظام،"]]}, {"l": "1Ki 18:46", "n": "", "vs": [[46, "وحلت قوة الرب في إيليا، فلف عباءته حول حقويه وركض ليسبق أخآب إلى مدخل يزرعيل."]]}, {"l": "2Ki 2:16", "n": "", "vs": [[16, "وقالوا له: «إن بين عبيدك خمسين رجلا من ذوي البأس، فدعهم يذهبون للبحث عن سيدك. لعل روح الرب حمله وطرحه على أحد الجبال أو في أحد الأودية». فأجاب: «لا ترسلوا أحدا»."]]}, {"l": "2Ki 3:15", "n": "", "vs": [[15, "والآن ادعوا عازف عود». وعندما عزف الموسيقى على عوده حل روح الرب على أليشع،"]]}, {"l": "Jer 20:7-9", "n": "", "vs": [[7, "يارب قد أقنعتني فاقتنعت، أنت أقوى مني فغلبت، فأصبحت مثار سخرية طوال النهار. كل واحد يستهزيء بي."], [8, "لأني كلما تكلمت أصرخ منددا، وأنادي: «ظلم واغتصاب» فجلبت علي كلمة الرب الاحتقار والعار طوال النهار."], [9, "إن قلت: «سأكف عن ذكره ولا أتكلم باسمه بعد» صار كلامه في قلبي كنار محرقة محصورة في عظامي، فأعياني كتمانه وعجزت عن كبته."]]}], "kwAr": "ولكن", "noteAr": ""}], "arS": [["وهكذا ", []], ["حلق", ["H5375"]], [" بي ", []], ["روح", ["H7307"]], [" الرب ", []], ["وحملني", ["H3947"]], [" بعيدا، وقد ", []], ["جاشت", ["H1980"]], [" ", []], ["حرارة", ["H2534"]], [" ", []], ["روحي", ["H7307"]], [" ", []], ["بمرارة", ["H4751"]], [" نفسي، ولكن كانت ", []], ["يد", ["H3027"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["علي", ["H5921"]], [" ", []], ["شديدة", ["H2389"]], [".", []]]}, {"c": 3, "v": 15, "text": "ثم أقبلت على المسبيين القاطنين إلى جوار نهر خابور عند تل أبيب، فأقمت هناك حيث يسكنون متحيرا سبعة أيام.", "groups": [{"kw": "that dwelt", "raw": "Eze_3:23, Eze_1:1, Eze_10:15, Eze_43:3", "note": "", "refs": [{"l": "Eze 3:23", "n": "", "vs": [[23, "فنهضت ومضيت إلى السهل، وهناك رأيت مجد ]]]}, {"c": 3, "v": 16, "text": "وفي ختام السبعة الأيام، أوحى إلي الرب بكلمته قائلا:", "groups": [], "arS": [["وفي", ["H1961"]], [" ", []], ["ختام", ["H4480", "H7097"]], [" ", []], ["السبعة", ["H7651"]], [" ", []], ["الأيام", ["H3117"]], ["، ", []], ["أوحى", ["H1961"]], [" إلي ", []], ["الرب", ["H3068"]], [" ", []], ["بكلمته", ["H1697"]], [" ", []], ["قائلا", ["H559"]], [":", []]]}, {"c": 3, "v": 17, "text": "«ياابن آدم، قد جعلتك رقيبا لشعب إسرائيل، فأصغ إلى كلمتي وأنذرهم بها على لساني.", "groups": [{"kw": "I have", "raw": "Eze_33:2-9; 1Co_12:28", "note": "", "refs": [{"l": "Eze 33:2-9", "n": "", "vs": [[2, "«ياابن آدم، خاطب أبناء إسرائيل وقل لهم: إذا جلبت سيفا على أرض كان أهلها قد أقاموا لهم رقيبا من بينهم."], [3, "فإذا رأى الأعداء مقبلين لمهاجمة الأرض، فنفخ بالبوق تحذيرا للشعب،"], [4, "فمن يسمع دوي البوق ولا يحترس، ثم أتى السيف وقتله، فدمه يقع على رأسه."], [5, "لأنه سمع دوي البوق ولم يحترس. لهذا يكون دمه على نفسه، إذ لو احترس لأنقذ نفسه."], [6, "ولكن إن رأى الرقيب العدو مقبلا ولم ينفخ بالبوق، فلم يحترس الشعب، فأقدم العدو وقتل نفسا منهم، فالقتيل قد لاقى حتفه جزاء ذنبه، أما دمه فمن يد الرقيب أطلبه."], [7, "وأنت ياابن آدم، قد أقمتك رقيبا لشعب إسرائيل، فتسمع قضائي، وتحذرهم من قبلي."], [8, "إن قلت للشرير: ياشر ير إنك حتما تموت من أجل شرك، ولم تعمد إلى تحذيره من طريقه، فإن ذلك الشرير يموت بذنبه، أما دمه فمن يدك أطلبه."], [9, "ولكن إن حذرت الشرير ليرتدع عن طريقه فأبى فهو يموت بذنبه، أما أنت فتكون قد خلصت نفسك."]]}, {"l": "1Co 12:28", "n": "", "vs": [[28, "وقد رتب الله في الكنيسة أشخاصا مخصوصين: أولا الرسل، ثانيا الأنبياء، ثالثا المعلمين، وبعد ذلك أصحاب المواهب المعجزية أو مواهب الشفاء أو إعانة الآخرين أو تدبير الشؤون أو التكلم باللغات المختلفة."]]}], "kwAr": "قد جعلتك", "noteAr": ""}, {"kw": "a watchman", "raw": "Son_3:3, Son_5:7; Isa_21:6, Isa_21:8, Isa_21:11, Isa_21:12, Isa_52:8, Isa_56:10, Isa_62:6; Jer_6:17, Jer_31:6; Act_20:28-31; Heb_13:17", "note": "", "refs": [{"l": "Son 3:3", "n": "", "vs": [[3, "وعثر علي الحراس المتجولون في المدينة، فسألت: أشاهدتم من تحبه نفسي؟"]]}, {"l": "Son 5:7", "n": "", "vs": [[7, "وجدني الحراس المتجولون في المدينة، فانهالوا علي ضربا فجرحوني. نزع حراس الأسوار إزاري عني."]]}, {"l": "Isa 21:6", "n": "", "vs": [[6, "لأنه هكذا قال الرب لي: اذهب وأقم رقيبا ليعلن ما يراه."]]}, {"l": "Isa 21:8", "n": "", "vs": [[8, "ثم هتف الرقيب: ها أنا أقف على برج المراقبة يوما بعد يوم أيها الرب، وأقوم على المحرس طوال الليل."]]}, {"l": "Isa 21:11", "n": "", "vs": [[11, "نبوءة بشأن أدوم: هتف صارخ من سعير: «يا رقيب، ماذا بقي من الليل؟ أما آن له أن ينتهي؟»"]]}, {"l": "Isa 21:12", "n": "", "vs": [[12, "فأجاب الرقيب: «أشرق الصبح ولكن الليل أقبل معه، فإن رغبتم في السؤال فاسألوا، ثم تعالوا وارجعوا إلى الله»."]]}, {"l": "Isa 52:8", "n": "", "vs": [[8, "ها رقباؤك قد رفعوا صوتهم معا وشدوا بفرح، لأنهم يشهدون عيانا رجوع الرب إلى صهيون."]]}, {"l": "Isa 56:10", "n": "", "vs": [[10, "فإن رقباءهم عمي، وكلهم جهال، وكلاب بكم عاجزون عن النباح، حالمون راقدون مولعون بالنوم."]]}, {"l": "Isa 62:6", "n": "", "vs": [[6, "على أسوارك ياأورشليم أقمت حراسا يبتهلون نهارا وليلا. ياذاكري الرب لا تكفوا."]]}, {"l": "Jer 6:17", "n": "", "vs": [[17, "فأقمت عليكم رقباء قائلا: اسمعوا دوي البوق. ولكنكم قلتم: «لن نسمع!»"]]}, {"l": "Jer 31:6", "n": "", "vs": [[6, "لأنه سيأتي يوم ينادي فيه المراقبون في جبل أفرايم قائلين: هلموا فنصعد إلى صهيون إلى الرب إلهنا»."]]}, {"l": "Act 20:28-31", "n": "", "vs": [[28, "فاسهروا إذن على أنفسكم وعلى جميع القطيع الذي عينكم بينه الروح القدس نظارا، لترعوا كنيسة الله التي اشتراها بدمه."], [29, "فإني أعلم أنه بعد رحيلي سيندس بينكم ذئاب خاطفة، لا تشفق على القطيع."], [30, "بل إن قوما منكم أنتم سيقومون ويعلمون تعاليم منحرفة، ليجروا التلاميذ وراءهم."], [31, "لذلك كونوا متيقظين، وتذكروا أني، مدة ثلاث سنين، لم أتوقف ليلا ونهارا عن نصح كل واحد منكم وأنا أذرف الدموع."]]}, {"l": "Heb 13:17", "n": "", "vs": [[17, "أطيعوا مرشديكم، واخضعوا لهم، لأنهم يسهرون على مصلحتكم الروحية، كما يسهر الذي يحمل مسئولية سوف يقدم حسابا عن قيامه بها. وعندئذ، يؤدون مهمتهم بفرح دون تذمر. فلن يكون في تذمرهم نفع لكم!"]]}], "kwAr": "رقيبا", "noteAr": ""}, {"kw": "hear", "raw": "Eze_33:6-8; 2Ch_19:10; Isa_58:1; Jer_6:10; Hab_2:1; Mat_3:7; 1Co_4:14; 2Co_5:11, 2Co_5:20; Col_1:28; 1Th_5:14", "note": "", "refs": [{"l": "Eze 33:6-8", "n": "", "vs": [[6, "ولكن إن رأى الرقيب العدو مقبلا ولم ينفخ بالبوق، فلم يحترس الشعب، فأقدم العدو وقتل نفسا منهم، فالقتيل قد لاقى حتفه جزاء ذنبه، أما دمه فمن يد الرقيب أطلبه."], [7, "وأنت ياابن آدم، قد أقمتك رقيبا لشعب إسرائيل، فتسمع قضائي، وتحذرهم من قبلي."], [8, "إن قلت للشرير: ياشر ير إنك حتما تموت من أجل شرك، ولم تعمد إلى تحذيره من طريقه، فإن ذلك الشرير يموت بذنبه، أما دمه فمن يدك أطلبه."]]}, {"l": "2Ch 19:10", "n": "", "vs": [[10, "وعليكم في كل دعوى يرفعها إليكم إخوتكم المقيمون في مدنهم، تتعلق بقضية قتل، أو بين شريعة ووصية لها مساس بالفرائض والأحكام، أن تحذروهم لئلا يأثموا إلى الرب فيحل عليكم وعلى إخوتكم غضبه. افعلوا هذا وتفادوا الإثم."]]}, {"l": "Isa 58:1", "n": "", "vs": [[1, "ناد بأعلى صوتك، لا تصمت. اهتف بصوتك كنفير بوق، وأخبر شعبي بإثمهم، وذرية يعقوب بخطاياهم."]]}, {"l": "Jer 6:10", "n": "", "vs": [[10, "لمن أتحدث وأنذر حتى يسمعوا؟ انظر! إن آذانهم صماء فلا يسمعون، وكلمة الرب مثار خزي لهم فلا يسرون بها»."]]}, {"l": "Hab 2:1", "n": "", "vs": [[1, "سأقف على مرصدي وأنتصب على الحصن، وأترقب لأرى ماذا يقول لي الرب، وبما أجيب عن شكواي."]]}, {"l": "Mat 3:7", "n": "", "vs": [[7, "ولما رأى يوحنا كثيرين من الفر يسيين والصدوقيين يأتون إليه ليتعمدوا، قال لهم: «ياأولاد الأفاعي، من أنذركم لتهربوا من الغضب الآتي؟"]]}, {"l": "1Co 4:14", "n": "", "vs": [[14, "لا أكتب هذا تخجيلا لكم، بل أنبهكم باعتباركم أولادي الأحباء."]]}, {"l": "2Co 5:11", "n": "", "vs": [[11, "فبدافع وعينا لرهبة الرب، نحاول إقناع الناس. ولكننا ظاهرون أمام الله، وأرجو أن نكون ظاهرين أيضا في ضمائركم."]]}, {"l": "2Co 5:20", "n": "", "vs": [[20, "فنحن إذن سفراء المسيح، وكأن الله يعظ بنا نتوسل بالنيابة عن المسيح منادين: «تصالحوا مع الله!»"]]}, {"l": "Col 1:28", "n": "", "vs": [[28, "هذا السر نعلنه نحن، واعظين كل إنسان، ومعلمين كل إنسان، في كل حكمة، لكي نحضر كل إنسان كاملا في المسيح."]]}, {"l": "1Th 5:14", "n": "", "vs": [[14, "إلا أننا نناشدكم، أيها الإخوة، أن تعظوا الفوضويين، وتشددوا فاقدي العزم، وتساندوا الضعفاء، وتعاملوا الجميع بطول البال."]]}], "kwAr": "فأصغ", "noteAr": ""}], "arS": [["«", []], ["ياابن", ["H1121"]], [" ", []], ["آدم", ["H120"]], ["، قد ", []], ["جعلتك", ["H5414"]], [" ", []], ["رقيبا", ["H6822"]], [" ", []], ["لشعب", ["H1004"]], [" ", []], ["إسرائيل", ["H3478"]], ["، ", []], ["فأصغ", ["H8085"]], [" إلى ", []], ["كلمتي", ["H1697"]], [" ", []], ["وأنذرهم", ["H2094"]], [" بها على ", []], ["لساني", ["H4480", "H6310"]], [".", []]]}, {"c": 3, "v": 18, "text": "فإذا قلت للشرير: أنت لابد مائت، وأنت لم تنذره ولم تحذره ليرجع عن طرقه الأثيمة فيحيا، فإن ذلك الشرير يموت بذنبه، أما دمه فمن يدك أطلبه.", "groups": [{"kw": "I say", "raw": "Eze_18:4, Eze_18:13, Eze_18:20, Eze_33:6, Eze_33:8; Gen_2:17, Gen_3:3, Gen_3:4; Num_26:65; 2Ki_1:4; Isa_3:11; Luk_13:3, Luk_13:5; Eph_5:5, Eph_5:6", "note": "", "refs": [{"l": "Eze 18:4", "n": "", "vs": [[4, "ها جميع النفوس هي لي. نفس الأب كنفس الابن كلتاهما لي. والنفس التي تخطيء هي تموت."]]}, {"l": "Eze 18:13", "n": "", "vs": [[13, "وأقرض بالربا وأخذ ربحا حراما، أفيحيا؟ إنه لا يحيا! لأنه اقترف جميع هذه الموبقات فإنه حتما يموت، ويكون دمه على رأسه."]]}, {"l": "Eze 18:20", "n": "", "vs": [[20, "أما النفس التي تخطيء فهي تموت. لا يعاقب الابن بإثم أبيه ولا الأب بإثم ابنه. يكافأ البار ببره ويجازى الشرير بشره."]]}, {"l": "Eze 33:6", "n": "", "vs": [[6, "ولكن إن رأى الرقيب العدو مقبلا ولم ينفخ بالبوق، فلم يحترس الشعب، فأقدم العدو وقتل نفسا منهم، فالقتيل قد لاقى حتفه جزاء ذنبه، أما دمه فمن يد الرقيب أطلبه."]]}, {"l": "Eze 33:8", "n": "", "vs": [[8, "إن قلت للشرير: ياشر ير إنك حتما تموت من أجل شرك، ولم تعمد إلى تحذيره من طريقه، فإن ذلك الشرير يموت بذنبه، أما دمه فمن يدك أطلبه."]]}, {"l": "Gen 2:17", "n": "", "vs": [[17, "ولكن إياك أن تأكل من شجرة معرفة الخير والشر لأنك حين تأكل منها حتما تموت»."]]}, {"l": "Gen 3:3", "n": "", "vs": [[3, "ماعدا ثمر الشجرة التي في وسطها، فقد قال الله : لا تأكلا منه ولا تلمساه لكي لا تموتا»."]]}, {"l": "Gen 3:4", "n": "", "vs": [[4, "فقالت الحية للمرأة: «لن تموتا،"]]}, {"l": "Num 26:65", "n": "", "vs": [[65, "لأن الرب كان قد قال لهم، إنهم جميعا سيموتون في الصحراء، فلم يبق منهم إنسان سوى كالب بن يفنة ويشوع بن نون."]]}, {"l": "2Ki 1:4", "n": "", "vs": [[4, "لذلك هذا ما يقوله الرب: إن السرير الذي رقدت عليه لن تنهض عنه، بل حتما تموت». وانصرف إيليا."]]}, {"l": "Isa 3:11", "n": "", "vs": [[11, "أما الشرير فويل له وبئس المصير لأنه يجازى على ما جنته يداه"]]}, {"l": "Luk 13:3", "n": "", "vs": [[3, "أقول لكم: لا، ولكن إن لم تتوبوا أنتم فجميعكم كذلك تهلكون!"]]}, {"l": "Luk 13:5", "n": "", "vs": [[5, "أقول لكم: لا، ولكن إن لم تتوبوا أنتم فجميعكم كذلك تهلكون!»"]]}, {"l": "Eph 5:5", "n": "", "vs": [[5, "فإنكم تعلمون هذا جيدا: أن كل زان أو نجس أو صاحب شهوة نهمة، ما هو إلا عابد أصنام، ليس له ميراث في ملكوت المسيح والله."]]}, {"l": "Eph 5:6", "n": "", "vs": [[6, "لا يخدعكم أحد بكلام باطل! فبسبب هذه الأمور يحل غضب الله على أبناء العصيان."]]}], "kwAr": "إذا قلت للشرير", "noteAr": ""}, {"kw": "to save", "raw": "Eze_18:30-32; Act_2:40, Act_3:19; 1Ti_4:16; Jam_5:19, Jam_5:20", "note": "", "refs": [{"l": "Eze 18:30-32", "n": "", "vs": [[30, "لذلك أدينكم ياشعب إسرائيل، كل واحد بمقتضى طرقه، يقول السيد الرب. توبوا وارجعوا عن ذنوبكم كلها، فلا يكون لكم الإثم معثرة هلاك."], [31, "اطرحوا عنكم كل ذنوبكم التي ارتكبتموها، واحصلوا لأنفسكم على قلب جديد وروح جديدة. فلماذا تنقرضون ياشعب إسرائيل؟"], [32, "إذ لا أسر بموت أحد، يقول السيد الرب، فتوبوا واحيوا."]]}, {"l": "Act 2:40", "n": "", "vs": [[40, "ثم شهد بطرس للحاضرين ووعظهم بكلام كثير آخر، قائلا: «اخلصوا من هذا الجيل المنحرف!»"]]}, {"l": "Act 3:19", "n": "", "vs": [[19, "فتوبوا وارجعوا ليمحو الله خطاياكم،"]]}, {"l": "1Ti 4:16", "n": "", "vs": [[16, "انتبه جيدا لنفسك وللتعليم. فإنك إذ تواظب على ذلك، تنقذ نفسك وسامعيك أيضا."]]}, {"l": "Jam 5:19", "n": "", "vs": [[19, "أيها الإخوة، إن ضل أحد بينكم عن الحق، ورده آخر،"]]}, {"l": "Jam 5:20", "n": "", "vs": [[20, "فليتأكد أن الذي يرد خاطئا عن ضلال مسلكه، فإنما ينقذ نفسا من الموت، ويستر خطايا كثيرة!"]]}], "kwAr": "فيحيا", "noteAr": ""}, {"kw": "the same", "raw": "Eze_33:6, Eze_33:9, Eze_33:10; Pro_14:32; Joh_8:21, Joh_8:24", "note": "", "refs": [{"l": "Eze 33:6", "n": "", "vs": [[6, "ولكن إن رأى الرقيب العدو مقبلا ولم ينفخ بالبوق، فلم يحترس الشعب، فأقدم العدو وقتل نفسا منهم، فالقتيل قد لاقى حتفه جزاء ذنبه، أما دمه فمن يد الرقيب أطلبه."]]}, {"l": "Eze 33:9", "n": "", "vs": [[9, "ولكن إن حذرت الشرير ليرتدع عن طريقه فأبى فهو يموت بذنبه، أما أنت فتكون قد خلصت نفسك."]]}, {"l": "Eze 33:10", "n": "", "vs": [[10, "وأنت ياابن آدم، قل لشعب إسرائيل: أنتم تقولون: حقا إن معاصينا وخطايانا واقعة علينا، وبها نحن هالكون، فكيف إذا نحيا؟"]]}, {"l": "Pro 14:32", "n": "", "vs": [[32, "يعاقب الشرير بمقتضى سوء تصرفاته، أما الصديق فله معتصم عند موته."]]}, {"l": "Joh 8:21", "n": "", "vs": [[21, "ثم قال لهم يسوع: «سوف أذهب فتسعون في طلبي، ولكنكم لا تقدرون أن تأتوا إلى حيث أكون، بل تموتون في خطيئتكم»."]]}, {"l": "Joh 8:24", "n": "", "vs": [[24, "لذلك قلت لكم: ستموتون في خطاياكم، لأنكم إذا لم تؤمنوا بأني أنا هو، تموتون في خطاياكم»."]]}], "kwAr": "فإن ذلك الشرير", "noteAr": ""}, {"kw": "but", "raw": "Eze_34:10; Gen_9:5, Gen_9:6, Gen_42:22; 2Sa_4:11; Luk_11:50,Luk_11:51; Act_20:26, Act_20:27; 1Ti_5:22", "note": "", "refs": [{"l": "Eze 34:10", "n": "", "vs": [[10, "ها أنا أنقلب على الرعاة وأطالبهم بغنمي، وأعزلهم عن رعايتها، فلا يرعون حتى أنفسهم بعد. وأنقذ غنمي من أشداقهم فلا تكون لهم مأكلا."]]}, {"l": "Gen 9:5", "n": "", "vs": [[5, "وأطالب أنا بدمكم لأنفسكم. من يد كل حيوان أطالب به، ومن يد الإنسان أيضا أطالب الأخ بنفس أخيه الإنسان."]]}, {"l": "Gen 9:6", "n": "", "vs": [[6, "فسافك دم الإنسان يحكم عليه بسفك دمه لأن الله خلق الإنسان على صورته."]]}, {"l": "Gen 42:22", "n": "", "vs": [[22, "فقال رأوبين: «ألم أقل لكم لا تجنوا عليه فلم تسمعوا؟ والآن ها نحن مطالبون بدمه»."]]}, {"l": "2Sa 4:11", "n": "", "vs": [[11, "فماذا أفعل بالأحرى برجلين باغيين يقتلان رجلا بريئا في بيته وعلى سريره؟ ألا أطالب الآن بدمه من أيديكما وأستأصلكما من الأرض؟»"]]}, {"l": "Luk 11:50", "n": "", "vs": [[50, "حتى إن دماء جميع الأنبياء المسفوكة منذ تأسيس العالم، يطالب بها هذا الجيل،"]]}, {"l": "Luk 11:51", "n": "", "vs": [[51, "من دم هابيل إلى دم زكريا الذي قتل بين المذبح والقدس! أقول لكم: نعم، إن تلك الدماء يطالب بها هذا الجيل."]]}, {"l": "Act 20:26", "n": "", "vs": [[26, "لذلك أشهد لكم اليوم أني بريء من دمكم جميعا،"]]}, {"l": "Act 20:27", "n": "", "vs": [[27, "لأني لم أمتنع عن إبلاغكم جميع مقاصد الله."]]}, {"l": "1Ti 5:22", "n": "", "vs": [[22, "لا تتسرع في وضع يدك على أحد. ولا تشترك في خطايا الآخرين. واحفظ نفسك طاهرا."]]}], "kwAr": "أما دمه", "noteAr": ""}], "arS": [["فإذا ", []], ["قلت", ["H559"]], [" ", []], ["للشرير", ["H7563"]], [": أنت لابد ", []], ["مائت", ["H4191", "H4191"]], ["، وأنت لم ", []], ["تنذره", ["H2094", "H3808"]], [" ولم ", []], ["تحذره", ["H2094"]], [" ", []], ["ليرجع", ["H4480"]], [" عن ", []], ["طرقه", ["H1870"]], [" الأثيمة ", []], ["فيحيا", ["H2421"]], ["، فإن ذلك ", []], ["الشرير", ["H7563"]], [" ", []], ["يموت", ["H4191"]], [" ", []], ["بذنبه", ["H5771"]], ["، أما ", []], ["دمه", ["H1818"]], [" فمن ", []], ["يدك", ["H4480", "H3027"]], [" ", []], ["أطلبه", ["H1245"]], [".", []]]}, {"c": 3, "v": 19, "text": "لكن إن أنذرت الشرير ولم يرجع عن شره وعن طرقه الأثيمة، فإنه يموت بذنبه، وتنجو أنت بنفسك.", "groups": [{"kw": "if thou", "raw": "2Ki_17:13-23; 2Ch_36:15, 2Ch_36:16; Pro_29:1; Jer_42:19-22, Jer_44:4, Jer_44:5; Luk_10:10,Luk_10:11; Act_18:5, Act_18:6; 1Th_4:6; Heb_2:1-3, Heb_12:25", "note": "", "refs": [{"l": "2Ki 17:13-23", "n": "", "vs": [[13, "وقد أنذر الرب إسرائيل ويهوذا عن طريق أنبيائه ورائيه قائلا: «ارجعوا عن طرقكم الأثيمة، وأطيعوا وصاياي وفرائضي بمقتضى كل الشريعة التي أوصيت آباءكم بتطبيقها، والتي أعلنتها لكم على لسان عبيدي الأنبياء."], [14, "لكنهم أصموا أذانهم وأغلظوا قلوبهم كآبائهم الذين لم يثقوا بالرب إلههم،"], [15, "وتنكروا لفرائضه وعهده الذي أبرمه مع آبائهم، وتجاهلوا تحذيراته ونواهيه لهم، وضلوا وراء أصنام باطلة، فأصبحوا هم أنفسهم باطلين، وتمثلوا بالأمم الذين حولهم، مع أن الرب أمرهم ألا يفعلوا مثلهم، وارتكبوا أمورا نهاهم الرب عنها،"], [16, "ونبذوا جميع وصايا الرب إلههم، وصنعوا لأنفسهم عجلين مسبوكين، وأقاموا تماثيل لعشتاروث وسجدوا لجميع كواكب السماء وعبدوا البعل."], [17, "وأجازوا أبناءهم وبناتهم في النار، وتعاطوا العرافة والفأل وباعوا أنفسهم لارتكاب الشر في عيني الرب لإثارة غيظه."], [18, "فاحتدم غضب الرب على إسرائيل، وطردهم من حضرته، ولم يبق سوى سبط يهوذا."], [19, "ولكن حتى سبط يهوذا لم يحفظ وصايا الرب إلهه بل نهج في طرق إسرائيل التي سلكتها."], [20, "فنبذ الرب كل ذرية إسرائيل وأذلهم وأسلمهم ليد آسريهم، وطردهم من حضرته."], [21, "لأنه شق إسرائيل عن بيت داود، فتوجوا يربعام بن نباط ملكا عليهم، فأضل يربعام بني إسرائيل عن طريق الرب واستغواهم فأخطأوا بحق الرب خطيئة عظيمة."], [22, "ولم يعدل الإسرائيليون عن ارتكاب جميع خطايا يربعام بل أمعنوا في اقترافها"], [23, "فنفى الرب إسرائيل من حضرته كما نطق على لسان جميع عبيده الأنبياء، فسبي الإسرائيليون من أرضهم إلى أشور إلى هذا اليوم."]]}, {"l": "2Ch 36:15", "n": "", "vs": [[15, "وأرسل الرب إله آبائهم إليهم رسلا بصورة متوالية محذرا إياهم لأنه أشفق على شعبه وعلى مسكنه."]]}, {"l": "2Ch 36:16", "n": "", "vs": [[16, "فكانوا يهزأون برسل الله، ورفضوا كلامه، واستهانوا بأنبيائه، حتى ثار غضب الرب على شعبه وامتنع كل شفاء!"]]}, {"l": "Pro 29:1", "n": "", "vs": [[1, "من كثر توبيخه وظل معتصما بعناده، يتحطم فجأة ولا شفاء له."]]}, {"l": "Jer 42:19-22", "n": "", "vs": [[19, "«فيابقية إسرائيل لا تهاجروا إلى مصر. تيقنوا أني قد حذرتكم اليوم."], [20, "لأنكم قد خدعتم أنفسكم حين بعثتم بي إلى الرب إلهكم قائلين: صل لأجلنا إلى الرب إلهنا وأنبئنا بكل ما يقول فنفعل بمقتضاه."], [21, "وها أنا قد أنبأتكم اليوم بكلامه فلم تطيعوا صوت الرب إلهكم في أي شيء أرسلني به إليكم."], [22, "فثقوا الآن أنكم تموتون بالسيف والجوع والوباء في ذات الموضع الذي نويتم الارتحال إليه والتغرب فيه»."]]}, {"l": "Jer 44:4", "n": "", "vs": [[4, "وقد أرسلت إليكم منذرا منذ البدء جميع عبيدي الأنبياء قائلا: لا تقترفوا رجسا مثل هذا لأني أمقته،"]]}, {"l": "Jer 44:5", "n": "", "vs": [[5, "فلم يرتدعوا ولا سمعوا ليتوبوا ويكفوا عن إحراق البخور لتلك الأصنام،"]]}, {"l": "Luk 10:10", "n": "", "vs": [[10, "وأية مدينة دخلتم ولم يقبلكم أهلها، فاخرجوا إلى شوارعها، وقولوا:"]]}, {"l": "Luk 10:11", "n": "", "vs": [[11, "حتى غبار مدينتكم العالق بأقدامنا ننفضه عليكم، ولكن اعلموا هذا: أن ملكوت الله قد اقترب!"]]}, {"l": "Act 18:5", "n": "", "vs": [[5, "ولما وصل سيلا وتيموثاوس من مقاطعة مقدونية، تفرغ بولس تماما للتبشير، شاهدا لليهود أن يسوع هو المسيح."]]}, {"l": "Act 18:6", "n": "", "vs": [[6, "ولكنهم عارضوا شهادته وأخذوا يجدفون. فما كان منه إلا أن نفض ثوبه وقال لهم: «دمكم على رؤوسكم. أنا بريء! ومنذ الآن أتوجه لتبشير غير اليهود»."]]}, {"l": "1Th 4:6", "n": "", "vs": [[6, "وألا يتعدى حقوق أخيه ويسيء إليه في هذا الأمر، لأن الرب هو المنتقم لجميع هذه الإساءات، كما أنذرناكم قبلا وشهدنا لكم بحق."]]}, {"l": "Heb 2:1-3", "n": "", "vs": [[1, "لذلك، يجب علينا أن نهتم أشد الاهتمام بالكلام الذي سمعناه، متنبهين ألا ننحرف عنه."], [2, "فإننا نعلم أن كل كلمة نقلتها الملائكة، قد تبين أنها ثابتة، وقد نال كل متعد أو مخالف لها عقابا عادلا."], [3, "فكيف نفلت نحن إن أهملنا هذا الخلاص العظيم جدا؟ فإن الرب يسوع نفسه قد أعلنه أولا، ثم تثبت لنا من الذين سمعوه مباشرة."]]}, {"l": "Heb 12:25", "n": "", "vs": [[25, "إذن حذار أن ترفضوا الذي يتكلم! فمادام أولئك الذين رفضوا الاستماع لمن كلمهم على هذه الأرض، لم يفلتوا (من العقاب) قط، فكم بالأحرى لا نفلت نحن أبدا إن تحولنا عن الذي يتكلم إلينا من السماء عينها!"]]}], "kwAr": "إن أنذرت", "noteAr": ""}, {"kw": "he shall", "raw": "Eze_3:18; 2Th_1:8, 2Th_1:9; Heb_10:26, Heb_10:27", "note": "", "refs": [{"l": "Eze 3:18", "n": "", "vs": [[18, "فإذا قلت للشرير: أنت لابد مائت، وأنت لم تنذره ولم تحذره ليرجع عن طرقه الأثيمة فيحيا، فإن ذلك الشرير يموت بذنبه، أما دمه فمن يدك أطلبه."]]}, {"l": "2Th 1:8", "n": "", "vs": [[8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."]]}, {"l": "2Th 1:9", "n": "", "vs": [[9, "فهؤلاء سيكابدون عقاب الهلاك الأبدي، بعيدا من حضرة الرب ومن مجد قوته،"]]}, {"l": "Heb 10:26", "n": "", "vs": [[26, "فإن أخطأنا عمدا برفضنا للمسيح بعد حصولنا على معرفة الحق، لا تبقى هناك ذبيحة لغفران الخطايا،"]]}, {"l": "Heb 10:27", "n": "", "vs": [[27, "بل انتظار العقاب الأكيد في لهيب النار التي ستلتهم المتمردين. ويا له من انتظار مخيف!"]]}], "kwAr": "فإنه يموت بذنبه", "noteAr": ""}, {"kw": "but thou", "raw": "Eze_3:21, Eze_14:14, Eze_14:20, Eze_33:5, Eze_33:9; Isa_49:4, Isa_49:5; Act_13:45, Act_13:46, Act_20:26; 2Co_2:15-17", "note": "", "refs": [{"l": "Eze 3:21", "n": "", "vs": [[21, "أما إن كنت قد أنذرت البار حتى لا يخطيء، ولم يخطيء، فإنه حتما يحيا لأنه قبل الإنذار، وتنجو أنت بنفسك»."]]}, {"l": "Eze 14:14", "n": "", "vs": [[14, "وحتى لو كان فيها هؤلاء الرجال الثلاثة: نوح ودانيآل وأيوب، فإنهم يخلصون وحدهم فقط ببرهم."]]}, {"l": "Eze 14:20", "n": "", "vs": [[20, "وكان يقيم فيها هؤلاء الثلاثة الرجال، فحي أنا يقول الرب إنهم لا يقدرون على إنقاذ ابن لها أو ابنة، إنما يخلصون وحدهم فقط ببرهم."]]}, {"l": "Eze 33:5", "n": "", "vs": [[5, "لأنه سمع دوي البوق ولم يحترس. لهذا يكون دمه على نفسه، إذ لو احترس لأنقذ نفسه."]]}, {"l": "Eze 33:9", "n": "", "vs": [[9, "ولكن إن حذرت الشرير ليرتدع عن طريقه فأبى فهو يموت بذنبه، أما أنت فتكون قد خلصت نفسك."]]}, {"l": "Isa 49:4", "n": "", "vs": [[4, "ولكنني أجبت: لقد تعبت باطلا. وأفنيت قوتي سدى وعبثا. غير أن حقي محفوظ عند الرب، ومكافأتي عند إلهي."]]}, {"l": "Isa 49:5", "n": "", "vs": [[5, "والآن قال لي الرب الذي كونني في رحم أمي لأكون له خادما، حتى أرد ذرية يعقوب إليه، فيجتمع بنو إسرائيل حوله، فأتمجد في عيني الرب ويكون إلهي قوتي:"]]}, {"l": "Act 13:45", "n": "", "vs": [[45, "فلما رأى اليهود الجموع ملأت الغيرة صدورهم، وأخذوا يعارضون كلام بولس مجدفين."]]}, {"l": "Act 13:46", "n": "", "vs": [[46, "فخاطبهم بولس وبرنابا بجرأة قائلين: «كان يجب أن نبلغكم أنتم أولا كلمة الله، ولكنكم رفضتموها فأظهرتم أنكم لا تستحقون الحياة الأبدية. وها نحن نتوجه إلى غير اليهود!"]]}, {"l": "Act 20:26", "n": "", "vs": [[26, "لذلك أشهد لكم اليوم أني بريء من دمكم جميعا،"]]}, {"l": "2Co 2:15-17", "n": "", "vs": [[15, "فإننا رائحة المسيح الطيبة المرتفعة إلى الله، المنتشرة على السواء عند الذين يخلصون وعند الذين يهلكون:"], [16, "هؤلاء يشمون فيها رائحة من الموت وإلى الموت، وأولئك رائحة من الحياة وإلى الحياة. ومن هو صاحب الكفاءة لتأدية هذه الأمور؟"], [17, "فإننا لا نتاجر بكلمة الله كما يفعل الكثيرون، وإنما بإخلاص ومن قبل الله، وأمام الله، نتكلم في المسيح."]]}], "kwAr": "وتنجو أنت بنفسك", "noteAr": ""}], "arS": [["لكن إن ", []], ["أنذرت", ["H2094"]], [" ", []], ["الشرير", ["H7563"]], [" ", []], ["ولم", ["H3808"]], [" ", []], ["يرجع", ["H7725"]], [" عن ", []], ["شره", ["H4480", "H7562"]], [" وعن ", []], ["طرقه", ["H1870"]], [" الأثيمة، فإنه ", []], ["يموت", ["H4191"]], [" ", []], ["بذنبه", ["H5771"]], ["، ", []], ["وتنجو", ["H5337"]], [" ", []], ["أنت", ["H859"]], [" ", []], ["بنفسك", ["H5315"]], [".", []]]}, {"c": 3, "v": 20, "text": "وكذلك إن حاد البار عن بره وارتكب الإثم، ونصبت أمامه معثرة، فإنه يموت. ولأنك لم تنذره فإنه يموت بذنبه ولا تذكر بعد أعماله الصالحة التي قام بها، أما دمه فمن يدك أطلبه.", "groups": [{"kw": "When", "raw": "Eze_18:24, Eze_18:26, Eze_33:12, Eze_33:13; 2Ch_24:2, 2Ch_24:17-22; Psa_36:3, Psa_125:5; Zep_1:6; Mat_13:20,Mat_13:21; Heb_10:38; 2Pe_2:18-22; 1Jo_2:19", "note": "", "refs": [{"l": "Eze 18:24", "n": "", "vs": [[24, "وإذا تحول الصديق عن بره وارتكب إثما على غرار كل الرجاسات التي يرتكبها الشرير، أفيحيا؟ إن كل ما صنعه من بر لا يذكر له. إنما يموت بخيانته التي خانها، وما اقترفه من خطايا."]]}, {"l": "Eze 18:26", "n": "", "vs": [[26, "إذا تحول البار عن بره وارتكب إثما ومات بسببه، فهو بإثمه الذي جناه يموت."]]}, {"l": "Eze 33:12", "n": "", "vs": [[12, "وأنت ياابن آدم، قل لأبناء شعبك: لا ينجو البار ببره في يوم معصيته، ولا يعثر الشرير بشره في يوم توبته. كذلك لا يستطيع البار أن يحيا ببره في يوم اقترافه لخطيئته."]]}, {"l": "Eze 33:13", "n": "", "vs": [[13, "وإن قلت للبار إنك لا محالة تحيا، فاعتمد على بره وأثم، فإن بره كله لا يذكر له، بل يموت بما ارتكب من إثم."]]}, {"l": "2Ch 24:2", "n": "", "vs": [[2, "وصنع يوآش ما هو صالح في عيني الرب كل أيام يهوياداع الكاهن."]]}, {"l": "2Ch 24:17-22", "n": "", "vs": [[17, "وبعد وفاة يهوياداع جاء قادة يهوذا وأظهروا ولاءهم للملك وأمالوا قلبه،"], [18, "فهجروا هيكل الرب إله آبائهم، وعبدوا تماثيل عشتاروث والأصنام، فانصب غضب الله على يهوذا وأورشليم من جراء إثمهم هذا."], [19, "وأرسل الله أنبياء ينذرونهم ويدعونهم للتوبة، ولكنهم لم يرتدعوا"], [20, "فحل روح الله على زكريا بن يهوياداع الكاهن، فوقف أمام الشعب وقال لهم: «هذا ما يقوله الله : لماذا تتعدون أوامر الرب فلا تفلحون؟ لقد نبذتم الرب فنبذكم الرب»."], [21, "فكادوا له حتى أمر الملك برجمه بالحجارة في ساحة الهيكل."], [22, "ولم يذكر الملك الفضل الذي أسداه إليه يهوياداع، بل قتل ابنه، وفيما هو يلفظ أنفاسه قال: «لينظر الرب ويجر قضاءه»."]]}, {"l": "Psa 36:3", "n": "", "vs": [[3, "كلام فمه إثم ونفاق، وقد كف عن التعقل لأجل عمل الخير."]]}, {"l": "Psa 125:5", "n": "", "vs": [[5, "أما الذين يحيدون إلى طرق ملتوية، فإن الرب يسوقهم إلى الهلاك مع فاعلي الإثم. ليكن السلام لشعب إسرائيل."]]}, {"l": "Zep 1:6", "n": "", "vs": [[6, "والذين ارتدوا عن اتباع الرب، والذين كفوا عن طلبه والتماسه."]]}, {"l": "Mat 13:20", "n": "", "vs": [[20, "أما المزروع على أرض صخرية، فهو الذي يسمع الكلمة ويقبلها بفرح في الحال،"]]}, {"l": "Mat 13:21", "n": "", "vs": [[21, "ولكنه لا أصل له في ذاته، وإنما يبقى إلى حين: فحالما يحدث ضيق أو اضطهاد من أجل الكلمة، يتعثر."]]}, {"l": "Heb 10:38", "n": "", "vs": [[38, "وأما من تبرر بالإيمان، فبالإيمان يحيا. ومن ارتد لا تسر به نفسي!"]]}, {"l": "2Pe 2:18-22", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."], [19, "يعدون هؤلاء بالحرية، وهم أنفسهم عبيد للفساد! لأن الإنسان يصير عبدا لكل ما يتسلط عليه ويغلبه."], [20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."], [21, "وبالحقيقة، كان أفضل لهم لو أنهم لم يتعرفوا بطريق البر، من أن يتعرفوا به ثم يرتدوا عن الوصية المقدسة التي تسلموها."], [22, "وينطبق على هؤلاء ما يقوله المثل الصادق: «عاد الكلب إلى تناول ما تقيأه، والخنزيرة المغتسلة إلى التمرغ في الوحل!»"]]}, {"l": "1Jo 2:19", "n": "", "vs": [[19, "هؤلاء الدجالون انفصلوا عنا، لكنهم في الواقع لم يكونوا منا. ولو كانوا منا لظلوا معنا. فانفصالهم عنا إذن برهان على أنهم جميعا ليسوا منا."]]}], "kwAr": "إن حاد", "noteAr": ""}, {"kw": "righteousness", "raw": "Heb. righteousnesses, Isa_64:6; Dan_9:18", "note": "Heb. righteousnesses, Isa_64:6; Dan_9:18", "refs": [{"l": "Isa 64:6", "n": "", "vs": [[6, "كلنا أصبحنا كنجس، وأضحت جميع أعمال برنا كثوب قذر، فذبلنا كأوراق الشجر وعبثت بنا آثامنا كالريح."]]}, {"l": "Dan 9:18", "n": "", "vs": [[18, "أرهف أذنك ياإلهي واستمع، وافتح عينيك وشاهد خرائبنا والمدينة التي دعي اسمك عليها، فإننا لا من أجل بر فينا نرفع تضرعاتنا إليك، بل بفضل مراحمك العظيمة."]]}], "kwAr": "بره", "noteAr": "بالعبرية: أعمال البر (بصيغة الجمع). انظر إش 64: 6؛ دا 9: 18"}, {"kw": "and I lay", "raw": "Eze_7:19, Eze_14:3, Eze_14:7-9; Deu_13:3; Psa_119:165 *marg. Isa_8:14; Jer_6:21; Luk_2:34; Rom_9:32, Rom_9:33, Rom_11:9; 1Co_1:23; 2Th_2:9-12; 1Pe_2:8", "note": "", "refs": [{"l": "Eze 7:19", "n": "", "vs": [[19, "يطرحون فضتهم في الشوارع، ويضحى ذهبهم نجاسة، وتعجز فضتهم وذهبهم عن إنقاذهم في يوم غضب الرب. لا يشبعون منهما جوعهم، ولا يملأون منهما أجوافهم لأنهما كانا معثرة إثم لهم."]]}, {"l": "Eze 14:3", "n": "", "vs": [[3, "ياابن آدم، إن هؤلاء الرجال قد نصبوا أصنامهم في قلوبهم، وأقاموا معثرة إثمهم تلقاء وجوههم، أفأجيب عن سؤالهم؟"]]}, {"l": "Eze 14:7-9", "n": "", "vs": [[7, "لأن كل رجل من شعب إسرائيل ومن الغرباء الدخلاء القاطنين في إسرائيل، إذا ارتد عني ونصب أصنامه في قلبه وأقام معثرة إثمه تلقاء وجهه، ثم حضر إلى النبي ليسأله عني، فإني أنا الرب أجيبه بذاتي."], [8, "وأنقلب على ذلك الإنسان وأجعله عبرة ومثلا، وأستأصله من بين شعبي، فتدركون أني أنا الرب."], [9, "فإذا ضل النبي ونطق بنبوءة باطلة، فإني أنا الرب قد أغويت ذلك النبي، لأنه تصرف من نفسه. فأعاقبه وأبيده من بين شعبي إسرائيل."]]}, {"l": "Deu 13:3", "n": "", "vs": [[3, "فلا تصغوا إلى كلام ذلك النبي أو صاحب الأحلام، لأن الرب إلهكم يجربكم ليرى إن كنتم تحبونه من كل قلوبكم ومن كل أنفسكم،"]]}, {"l": "Psa 119:165", "n": "*marg.", "vs": [[165, "سلام جزيل لمحبي شريعتك، ولن يعثرهم بفضلها شيء"]]}, {"l": "Isa 8:14", "n": "", "vs": [[14, "فيكون لكم مقدسا. أما لبيتي إسرائيل، فيكون حجر صدمة وصخرة عثرة، وفخا وشركا لساكني أورشليم،"]]}, {"l": "Jer 6:21", "n": "", "vs": [[21, "لذلك يعلن الرب: «ها أنا أقيم لهذا الشعب معاثر يتعثر بها الآباء والأبناء معا، ويهلك بها الجار وصديقه»."]]}, {"l": "Luk 2:34", "n": "", "vs": [[34, "فباركهما سمعان، وقال لمريم أم الطفل: «ها إن هذا الطفل قد جعل لسقوط كثيرين وقيام كثيرين في إسرائيل، وآية تقاوم"]]}, {"l": "Rom 9:32", "n": "", "vs": [[32, "ولأي سبب؟ لأن سعيهم لم يكن على أساس الإيمان، بل كان وكأن الأمر قائم على الأعمال. فقد تعثروا بحجر العثرة،"]]}, {"l": "Rom 9:33", "n": "", "vs": [[33, "كما كتب: «ها أنا واضع في صهيون حجر عثرة وصخرة سقوط. ومن يؤمن به لا يخيب»."]]}, {"l": "Rom 11:9", "n": "", "vs": [[9, "كذلك يقول داود: «لتصر لهم مائدتهم فخا وشركا وعقبة وعقابا."]]}, {"l": "1Co 1:23", "n": "", "vs": [[23, "ولكننا نحن نبشر بالمسيح مصلوبا، مما يشكل عائقا عند اليهود وجهالة عند الأمم؛"]]}, {"l": "2Th 2:9-12", "n": "", "vs": [[9, "أما بروز المتمرد، فسوف يكون بقدر طاقة الشيطان على المعجزات والعلامات والعجائب المزيفة كلها،"], [10, "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا."], [11, "ولهذا السبب، سيرسل الله إليهم طاقة الضلال حتى يصدقوا ما هو دجل،"], [12, "فتقع الدينونة على جميع الذين لم يؤمنوا بالحق بل سرهم الإثم."]]}, {"l": "1Pe 2:8", "n": "", "vs": [[8, "كما أنه هو «الحجر الذي يصطدمون به، والصخرة التي يسقطون عليها»! وهم يسقطون لأنهم يرفضون أن يؤمنوا بالكلمة."]]}], "kwAr": "ونصبت أمامه معثرة", "noteAr": ""}, {"kw": "because", "raw": "Eze_3:18; Lev_19:17; 2Sa_12:7-13; 2Ch_19:2-4, 2Ch_25:15; Pro_25:12; Mat_18:15", "note": "", "refs": [{"l": "Eze 3:18", "n": "", "vs": [[18, "فإذا قلت للشرير: أنت لابد مائت، وأنت لم تنذره ولم تحذره ليرجع عن طرقه الأثيمة فيحيا، فإن ذلك الشرير يموت بذنبه، أما دمه فمن يدك أطلبه."]]}, {"l": "Lev 19:17", "n": "", "vs": [[17, "لا تبغض أخاك في قلبك، بل إنذارا تنذره لئلا تكون شريكا في ذنبه."]]}, {"l": "2Sa 12:7-13", "n": "", "vs": [[7, "فقال ناثان لداود: «أنت هو الرجل! وهذا ما يقوله الرب إله إسرائيل: لقد اخترتك لتكون ملكا على إسرائيل وأنقذتك من قبضة شاول،"], [8, "ووهبتك بيت سيدك وزوجاته، ووليتك على بني إسرائيل ويهوذا. ولو كان ذلك قليلا لوهبتك المزيد."], [9, "فلماذا احتقرت كلام الرب لتقترف الشر أمامه؟ قتلت أوريا الحثي بسيف العمونيين وتزوجت امرأته."], [10, "لذلك لن يفارق السيف بيتك إلى الأبد، لأنك احتقرتني واغتصبت امرأة أوريا الحثي»."], [11, "واستطرد: «هذا ما يقوله الرب: سأثير عليك من أهل بيتك من ينزل بك البلايا، وآخذ نساءك أمام عينيك وأعطيهن لقريبك، فيضاجعهن في وضح النهار."], [12, "أنت ارتكبت خطيئتك في السر، وأنا أفعل هذا الأمر على مرأى جميع بني إسرائيل وفي وضح النهار»."], [13, "فقال داود لناثان: «قد أخطأت إلى الرب». فقال ناثان: «والرب قد نقل عنك خطيئتك، فلن تموت."]]}, {"l": "2Ch 19:2-4", "n": "", "vs": [[2, "فخرج النبي ياهو بن حناني للقائه وقال للملك يهوشافاط: «أتعين الشرير وتحب مبغضي الرب؟ لذلك يحل عليك غضب الرب."], [3, "ولكن فيك أمورا صالحة، فقد استأصلت تماثيل عشتاروث من الأرض، وأعددت قلبك لطلب الله»."], [4, "ومكث يهوشافاط في أورشليم، ثم شرع يتجول بين الشعب من بئر سبع إلى جبل أفرايم، وردهم إلى عبادة الرب إله آبائهم."]]}, {"l": "2Ch 25:15", "n": "", "vs": [[15, "فاحتدم غضب الرب عليه وأرسل إليه نبيا يقول: «لماذا ضللت وراء آلهة قوم عجزوا عن إنقاذ شعبهم من يدك؟»"]]}, {"l": "Pro 25:12", "n": "", "vs": [[12, "الموبخ الحكيم لأذن صاغية مثل قرط من ذهب وحلي من إبريز."]]}, {"l": "Mat 18:15", "n": "", "vs": [[15, "إن أخطأ إليك أخوك، فاذهب إليه وعاتبه بينك وبينه على انفراد. فإذا سمع لك، تكون قد ربحت أخاك."]]}], "kwAr": "ولأنك لم تنذره", "noteAr": ""}, {"kw": "and his", "raw": "Eze_18:24, Eze_18:26, Eze_33:12, Eze_33:13; Mat_12:43-45; Luk_8:15; Rom_2:7, Rom_2:8; Heb_10:38; 2Pe_2:21", "note": "", "refs": [{"l": "Eze 18:24", "n": "", "vs": [[24, "وإذا تحول الصديق عن بره وارتكب إثما على غرار كل الرجاسات التي يرتكبها الشرير، أفيحيا؟ إن كل ما صنعه من بر لا يذكر له. إنما يموت بخيانته التي خانها، وما اقترفه من خطايا."]]}, {"l": "Eze 18:26", "n": "", "vs": [[26, "إذا تحول البار عن بره وارتكب إثما ومات بسببه، فهو بإثمه الذي جناه يموت."]]}, {"l": "Eze 33:12", "n": "", "vs": [[12, "وأنت ياابن آدم، قل لأبناء شعبك: لا ينجو البار ببره في يوم معصيته، ولا يعثر الشرير بشره في يوم توبته. كذلك لا يستطيع البار أن يحيا ببره في يوم اقترافه لخطيئته."]]}, {"l": "Eze 33:13", "n": "", "vs": [[13, "وإن قلت للبار إنك لا محالة تحيا، فاعتمد على بره وأثم، فإن بره كله لا يذكر له، بل يموت بما ارتكب من إثم."]]}, {"l": "Mat 12:43-45", "n": "", "vs": [[43, "ولكن متى خرج الروح النجس من إنسان يسكنه، يهيم في الأماكن القاحلة طالبا الراحة، فلا يجد."], [44, "فيقول: أرجع إلى مسكني الذي فارقته! ويرجع، فيجده فارغا مكنوسا مزينا."], [45, "فيذهب، ويحضر معه سبعة أرواح أخرى أكثر منه شرا، فتدخل جميعا وتسكن ذلك الإنسان، فتكون آخرته أسوأ من حالته الأولى. هكذا تكون حال هذا الجيل الشرير! »"]]}, {"l": "Luk 8:15", "n": "", "vs": [[15, "وأما الذي وقع في الأرض الجيدة، فهم الذين يسمعون الكلمة ويحفظونها في قلب جيد مستقيم، وينتجون ثمرا بالصبر."]]}, {"l": "Rom 2:7", "n": "", "vs": [[7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"]]}, {"l": "Rom 2:8", "n": "", "vs": [[8, "ويكون الغضب والسخط للمخاصمين الذين يرفضون الطاعة للحق ولكنهم يخضعون للإثم."]]}, {"l": "Heb 10:38", "n": "", "vs": [[38, "وأما من تبرر بالإيمان، فبالإيمان يحيا. ومن ارتد لا تسر به نفسي!"]]}, {"l": "2Pe 2:21", "n": "", "vs": [[21, "وبالحقيقة، كان أفضل لهم لو أنهم لم يتعرفوا بطريق البر، من أن يتعرفوا به ثم يرتدوا عن الوصية المقدسة التي تسلموها."]]}], "kwAr": "ولا تذكر بعد أعماله الصالحة", "noteAr": ""}, {"kw": "but his", "raw": "Eze_3:18, Eze_33:6; Heb_13:17", "note": "", "refs": [{"l": "Eze 3:18", "n": "", "vs": [[18, "فإذا قلت للشرير: أنت لابد مائت، وأنت لم تنذره ولم تحذره ليرجع عن طرقه الأثيمة فيحيا، فإن ذلك الشرير يموت بذنبه، أما دمه فمن يدك أطلبه."]]}, {"l": "Eze 33:6", "n": "", "vs": [[6, "ولكن إن رأى الرقيب العدو مقبلا ولم ينفخ بالبوق، فلم يحترس الشعب، فأقدم العدو وقتل نفسا منهم، فالقتيل قد لاقى حتفه جزاء ذنبه، أما دمه فمن يد الرقيب أطلبه."]]}, {"l": "Heb 13:17", "n": "", "vs": [[17, "أطيعوا مرشديكم، واخضعوا لهم، لأنهم يسهرون على مصلحتكم الروحية، كما يسهر الذي يحمل مسئولية سوف يقدم حسابا عن قيامه بها. وعندئذ، يؤدون مهمتهم بفرح دون تذمر. فلن يكون في تذمرهم نفع لكم!"]]}], "kwAr": "أما دمه", "noteAr": ""}], "arS": [["وكذلك إن ", []], ["حاد", ["H7725"]], [" ", []], ["البار", ["H6662"]], [" ", []], ["عن", ["H4480"]], [" ", []], ["بره", ["H6664"]], [" ", []], ["وارتكب", ["H6213"]], [" ", []], ["الإثم", ["H5766"]], ["، ", []], ["ونصبت", ["H5414"]], [" ", []], ["أمامه", ["H6440"]], [" ", []], ["معثرة", ["H4383"]], ["، فإنه ", []], ["يموت", ["H4191"]], [". ", []], ["ولأنك", ["H3588"]], [" لم ", []], ["تنذره", ["H2094"]], [" فإنه ", []], ["يموت", ["H4191"]], [" ", []], ["بذنبه", ["H2403"]], [" ولا ", []], ["تذكر", ["H2142"]], [" بعد ", []], ["أعماله", ["H6666"]], [" ", []], ["الصالحة", ["H6666"]], [" التي ", []], ["قام", ["H6213"]], [" بها، أما ", []], ["دمه", ["H1818"]], [" فمن ", []], ["يدك", ["H4480", "H3027"]], [" ", []], ["أطلبه", ["H1245"]], [".", []]]}, {"c": 3, "v": 21, "text": "أما إن كنت قد أنذرت البار حتى لا يخطيء، ولم يخطيء، فإنه حتما يحيا لأنه قبل الإنذار، وتنجو أنت بنفسك».", "groups": [{"kw": "if thou", "raw": "Mat_24:24, Mat_24:25; Act_20:31; 1Co_4:14, 1Co_10:12; Gal_1:6-10, Gal_5:2-7; Eph_4:17-21, Eph_5:5, Eph_5:6; Col_1:28, Col_3:5-8; 1Th_4:6-8, 1Th_5:14; Tit_2:15; 1Jo_3:6-9; Rev_3:19", "note": "", "refs": [{"l": "Mat 24:24", "n": "", "vs": [[24, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات عظيمة وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Mat 24:25", "n": "", "vs": [[25, "ها أنا قد أخبرتكم بالأمر قبل حدوثه."]]}, {"l": "Act 20:31", "n": "", "vs": [[31, "لذلك كونوا متيقظين، وتذكروا أني، مدة ثلاث سنين، لم أتوقف ليلا ونهارا عن نصح كل واحد منكم وأنا أذرف الدموع."]]}, {"l": "1Co 4:14", "n": "", "vs": [[14, "لا أكتب هذا تخجيلا لكم، بل أنبهكم باعتباركم أولادي الأحباء."]]}, {"l": "1Co 10:12", "n": "", "vs": [[12, "فمن توهم أنه صامد، فليحذر أن يسقط."]]}, {"l": "Gal 1:6-10", "n": "", "vs": [[6, "عجبا! كيف تتحولون بمثل هذه السرعة عن الذي دعاكم بنعمة المسيح، وتنصرفون إلى إنجيل غريب؟"], [7, "لا أعني أن هنالك إنجيلا آخر، بل إنما هنالك بعض (المعلمين) الذين يثيرون البلبلة بينكم، راغبين في تحوير إنجيل المسيح."], [8, "ولكن، حتى لو بشرناكم نحن، أو بشركم ملاك من السماء، بغير الإنجيل الذي بشرناكم به، فليكن ملعونا!"], [9, "وكما سبق أن قلنا، أكر ر القول الآن أيضا: إن كان أحد يبشركم بإنجيل غير الذي قبلتموه، فليكن ملعونا!"], [10, "فهل أسعى الآن إلى كسب تأييد الناس أو الله؟ أم تراني أطلب أن أرضي الناس؟ لو كنت حتى الآن أرضي الناس، لما كنت عبدا للمسيح!"]]}, {"l": "Gal 5:2-7", "n": "", "vs": [[2, "ها أنا بولس أقول لكم: إن ختنتم، لا ينفعكم المسيح شيئا."], [3, "وأشهد مرة أخرى لكل مختون بأنه ملتزم أن يعمل بالشريعة كلها."], [4, "يامن تريدون التبرير عن طريق الشريعة، قد حرمتم المسيح وسقطتم من النعمة!"], [5, "فإننا، بالروح وعلى أساس الإيمان، ننتظر الرجاء الذي ينتجه البر."], [6, "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة."], [7, "كنتم تجرون جريا جيدا، فمن أعاقكم حتى لا تذعنوا للحق؟"]]}, {"l": "Eph 4:17-21", "n": "", "vs": [[17, "أقول هذا إذن، وأشهد في الرب، راجيا ألا تسلكوا فيما بعد كما يسلك الأمم في عقم ذهنهم،"], [18, "لكونهم مظلمي البصيرة ومتغربين عن حياة الله بسبب ما فيهم من جهل وقساوة قلب."], [19, "فهؤلاء، إذ طرحوا جانبا كل إحساس، استسلموا للإباحية ليرتكبوا كل نجاسة بشهوة نهمة لا ترتوي."], [20, "أما أنتم، فلم تتعلموا المسيح هكذا،"], [21, "إذا كنتم قد سمعتموه حقا وتلقيتم فيه التعليم الموافق للحق الذي في يسوع!"]]}, {"l": "Eph 5:5", "n": "", "vs": [[5, "فإنكم تعلمون هذا جيدا: أن كل زان أو نجس أو صاحب شهوة نهمة، ما هو إلا عابد أصنام، ليس له ميراث في ملكوت المسيح والله."]]}, {"l": "Eph 5:6", "n": "", "vs": [[6, "لا يخدعكم أحد بكلام باطل! فبسبب هذه الأمور يحل غضب الله على أبناء العصيان."]]}, {"l": "Col 1:28", "n": "", "vs": [[28, "هذا السر نعلنه نحن، واعظين كل إنسان، ومعلمين كل إنسان، في كل حكمة، لكي نحضر كل إنسان كاملا في المسيح."]]}, {"l": "Col 3:5-8", "n": "", "vs": [[5, "فأميتوا إذن أعضاءكم الأرضية: الزنى، النجاسة، جموح العاطفة، الشهوة الرديئة، والاشتهاء النهم الذي هو عبادة أصنام."], [6, "فبسبب هذه الخطايا ينزل غضب الله،"], [7, "وفيها سلكتم في الماضي، حين كنتم تعيشون فيها."], [8, "وأما الآن، فانزعوا عنكم، أنتم أيضا، هذه الخطايا كلها: الغضب، النقمة، الخبث، التجديف، الكلام القبيح الخارج من أفواهكم."]]}, {"l": "1Th 4:6-8", "n": "", "vs": [[6, "وألا يتعدى حقوق أخيه ويسيء إليه في هذا الأمر، لأن الرب هو المنتقم لجميع هذه الإساءات، كما أنذرناكم قبلا وشهدنا لكم بحق."], [7, "فإن الله دعانا لا إلى النجاسة بل (إلى العيش( في القداسة."], [8, "إذن، من استخف بأخيه في هذا الأمر، يستخف لا بإنسان بل بالله، بذاك الذي وهبكم فعلا روحه القدوس."]]}, {"l": "1Th 5:14", "n": "", "vs": [[14, "إلا أننا نناشدكم، أيها الإخوة، أن تعظوا الفوضويين، وتشددوا فاقدي العزم، وتساندوا الضعفاء، وتعاملوا الجميع بطول البال."]]}, {"l": "Tit 2:15", "n": "", "vs": [[15, "بهذه الأمور تكلم، وعظ، ووبخ بكل سلطان، ولا تدع أحدا يستخف بك!"]]}, {"l": "1Jo 3:6-9", "n": "", "vs": [[6, "فكل من يثبت فيه، لا يمارس الخطيئة. أما الذين يمارسون الخطيئة، فهم لم يروه ولم يتعرفوا به قط."], [7, "أيها الأولاد الصغار، لا تدعوا أحدا يضللكم. تأكدوا أن من يمارس الصلاح، يظهر أنه بار كما أن المسيح بار."], [8, "ولكن من يمارس الخطيئة، يظهر أنه من أولاد إبليس، لأن إبليس يمارس الخطيئة منذ البداية. وقد جاء ابن الله إلى الأرض لكي يبطل أعمال إبليس."], [9, "فكل مولود من الله، لا يمارس الخطيئة، لأن طبيعة الله صارت ثابتة فيه. بل إنه لا يستطيع أن يمارس الخطيئة، لأنه مولود من الله."]]}, {"l": "Rev 3:19", "n": "", "vs": [[19, "إني أوبخ وأؤدب من أحبه، لذا كن حارا وتب!"]]}], "kwAr": "إن كنت قد أنذرت", "noteAr": ""}, {"kw": "he shall", "raw": "Eze_3:20; Psa_19:11; Pro_9:9, Pro_17:10; Gal_2:11-13; Jam_5:20", "note": "", "refs": [{"l": "Eze 3:20", "n": "", "vs": [[20, "وكذلك إن حاد البار عن بره وارتكب الإثم، ونصبت أمامه معثرة، فإنه يموت. ولأنك لم تنذره فإنه يموت بذنبه ولا تذكر بعد أعماله الصالحة التي قام بها، أما دمه فمن يدك أطلبه."]]}, {"l": "Psa 19:11", "n": "", "vs": [[11, "عبدك يهتدي بها، وفي صونها ثواب عظيم."]]}, {"l": "Pro 9:9", "n": "", "vs": [[9, "اسد الإرشاد إلى الحكيم فيضحى أوفر حكمة، علم الصديق فيزداد معرفة."]]}, {"l": "Pro 17:10", "n": "", "vs": [[10, "يؤثر التأنيب في الحكيم أكثر من تأثير مئة جلدة في الجاهل."]]}, {"l": "Gal 2:11-13", "n": "", "vs": [[11, "ولكن لما جاء بطرس إلى مدينة أنطاكية، قاومته وجها لوجه لأنه كان يستحق أن يلام."], ني أنا الرب»."]]}, {"l": "Psa 51:15", "n": "", "vs": [[15, "يارب افتح شفتي فيذيع فمي تسبيحك."]]}, {"l": "Psa 137:6", "n": "", "vs": [[6, "ليلتصق لساني بحنكي إن لم أذكرك ولم أفضلك على ذروة أفراحي."]]}, {"l": "Jer 1:17", "n": "", "vs": [[17, "أما أنت فتأهب، وقم وكلمهم بكل ما آمرك به. لا تخف من حضرتهم لئلا أفزعك أمامهم."]]}, {"l": "Luk 1:20-22", "n": "", "vs": [[20, "وها أنت ستبقى صامتا لا تستطيع الكلام، إلى اليوم الذي يحدث فيه هذا، لأنك لم تصدق كلامي، وهو سيتم في حينه»."], [21, "وكان الشعب منتظرين زكريا، وهم متعجبون من تأخره داخل الهيكل."], [22, "ولكنه لما خرج لم يقدر أن يكلمهم، فأدركوا أنه رأى رؤيا داخل الهيكل. فأخذ يشير لهم وظل أخرس."]]}], "kwAr": "وألصق لسانك", "noteAr": ""}, {"kw": "and shalt", "raw": "Psa_36:11, Psa_36:12; Lam_2:9; Hos_4:17; Amo_5:10, Amo_8:11, Amo_8:12; Mic_3:6, Mic_3:7", "note": "", "refs": [{"l": "Psa 36:11", "n": "", "vs": [[11, "لا تدع قدم المتكبر تبلغني، ويد الأشرار تزحزحني."]]}, {"l": "Psa 36:12", "n": "", "vs": [[12, "هناك سقط فاعلو الإثم، طرحوا، عجزوا عن النهوض."]]}, {"l": "Lam 2:9", "n": "", "vs": [[9, "غاصت في الأرض بواباتها، دمر وحطم مزاليجها. نفى ملكها ورؤساءها بين الأمم. زالت الشريعة، ولم يعد أنبياؤها يحصلون على رؤيا من عند الرب."]]}, {"l": "Hos 4:17", "n": "", "vs": [[17, "إن أفرايم مكبل بعبادة الأصنام، فاتركوه وحيدا."]]}, {"l": "Amo 5:10", "n": "", "vs": [[10, "قد أبغضوا من يندد بالجور في ساحة القضاء، ويكرهون من ينطق بالحق."]]}, {"l": "Amo 8:11", "n": "", "vs": [[11, "ستأتي أيام أجعل فيها المجاعة تنتشر في الأرض، لا مجاعة إلى الخبز، ولا ظمأ إلى الماء إنما لسماع كلام الرب، يقول السيد الرب."]]}, {"l": "Amo 8:12", "n": "", "vs": [[12, "فيهيمون من بحر إلى بحر، ومن الشمال إلى الشرق. يذهبون ويجيئون بحثا عن كلمة الرب ولا يحظون بها."]]}, {"l": "Mic 3:6", "n": "", "vs": [[6, "لذلك يطغى عليكم ليل خال من الرؤيا، وظلام من غير عرافة، وتغرب الشمس عن الأنبياء ويظلم عليهم النهار."]]}, {"l": "Mic 3:7", "n": "", "vs": [[7, "يعتري الرائين الخزي وينتاب العرافين الخجل، ويغطون جميعهم شفاههم لأنهم لا ينالون جوابا من الرب."]]}], "kwAr": "فتبكم", "noteAr": ""}, {"kw": "a reprover", "raw": "Heb. a man reproving", "note": "Heb. a man reproving", "refs": [], "kwAr": "تقريعهم", "noteAr": "بالعبرية: رجلا موبخا."}, {"kw": "for", "raw": "Eze_2:3-8; Isa_1:2", "note": "", "refs": [{"l": "Eze 2:3-8", "n": "", "vs": [[3, "«ياابن آدم، ها أنا باعثك إلى بني إسرائيل، إلى أمة متمردة عصتني، إذ تعدوا هم وآباؤهم علي إلى هذا اليوم."], [4, "أنا باعثك إلى الأبناء المتصلبين القساة، فتقول لهم: هذا ما يعلنه الرب."], [5, "فإن سمعوا، أو أبوا لأنهم شعب عاص فإنهم يعلمون على الأقل أن نبيا بينهم."], [6, "أما أنت، ياابن آدم، فلا ترهبهم ولا تخش كلامهم، وإن كانوا لك قريسا وشوكا. وأنت ساكن بين عقارب، فلا ترهب كلامهم، ولا تفزع من محضرهم لأنهم شعب متمرد."], [7, "إنما عليك أن تبلغهم كلامي سواء سمعوا أو أبوا، لأنهم شعب متمرد."], [8, "والآن ياابن آدم، أصغ لما أخاطبك به. لا تكن متمردا مثل ذلك الشعب المتمرد. افتح فمك وكل ما أطعمك»."]]}, {"l": "Isa 1:2", "n": "", "vs": [[2, "اسمعي أيتها السماوات وأصغي أيتها الأرض لأن الرب يتكلم: «ربيت أبناء وأنشأتهم ولكنهم تمردوا علي."]]}], "kwAr": "لأنهم شعب متمرد", "noteAr": ""}], "arS": [["وألصق", ["H1692"]], [" ", []], ["لسانك", ["H3956"]], [" ", []], ["بحنكك", ["H2441"]], [" ", []], ["فتبكم", ["H481"]], [" ", []], ["وتكف", ["H1961"]], [" عن ", []], ["تقريعهم", ["H376", "H3198"]], [" ", []], ["لأنهم", ["H3588", "H1992"]], [" ", []], ["شعب", ["H1004"]], [" ", []], ["متمرد", ["H4805"]], [".", []]]}, {"c": 3, "v": 27, "text": "ولكن عندما أخاطبك، أفتح فمك فتقول لهم: هذا ما يعلنه الرب، من يسمع فليسمع، ومن يأب فليمتنع، لأنهم شعب متمرد».", "groups": [{"kw": "I will", "raw": "Eze_11:25, Eze_24:27, Eze_29:21, Eze_33:32; Exo_4:11, Exo_4:12; Luk_21:15; Eph_6:19", "note": "", "refs": [{"l": "Eze 11:25", "n": "", "vs": [[25, "فأبلغت أهل السبي بجميع الوحي الذي أعلنه لي الرب."]]}, {"l": "Eze 24:27", "n": "", "vs": [[27, "في ذلك اليوم ينفتح فمك فتخاطب الناجي المنفلت ولا تكون بعد أبكم، وتكون لهم آية، فيدركون أني أنا الرب»."]]}, {"l": "Eze 29:21", "n": "", "vs": [[21, "في ذلك اليوم، أنمي قوة شعب إسرائيل وأفتح فمك بينهم، فيدركون أني أنا الرب»."]]}, {"l": "Eze 33:32", "n": "", "vs": [[32, "وها أنت لهم كقصيدة حب يتغنى بها ذو صوت عذب، يحسن العزف، فيصغون إلى كلامك ولا يعملون به."]]}, {"l": "Exo 4:11", "n": "", "vs": [[11, "فقال الرب له: «من هو باريء فم الإنسان؟ أو من يجعله أخرس أو أصم أو بصيرا أو كفيفا؟ ألست أنا الرب؟"]]}, {"l": "Exo 4:12", "n": "", "vs": [[12, "فالآن انطلق فألقن فمك النطق، وأعلمك ماذا تقول»."]]}, {"l": "Luk 21:15", "n": "", "vs": [[15, "لأني سوف أعطيكم كلاما وحكمة لا يقدر جميع مقاوميكم أن يردوها أو يناقضوها."]]}, {"l": "Eph 6:19", "n": "", "vs": [[19, "ولأجلي كي ألهم ما أنطق به كلما فتحت فمي لأعلن بجرأة سر الإنجيل"]]}], "kwAr": "أفتح فمك", "noteAr": ""}, {"kw": "Thus", "raw": "Eze_3:11, Eze_2:5; Mat_11:15, Mat_13:9; Rev_22:10,Rev_22:11", "note": "", "refs": [{"l": "Eze 3:11", "n": "", "vs": [[11, "وامض إلى المسبيين من أبناء شعبك وقل لهم: هذا ما يعلنه السيد الرب. سواء سمعوا لك أو أبوا»."]]}, {"l": "Eze 2:5", "n": "", "vs": [[5, "فإن سمعوا، أو أبوا لأنهم شعب عاص فإنهم يعلمون على الأقل أن نبيا بينهم."]]}, {"l": "Mat 11:15", "n": "", "vs": [[15, "ومن له أذنان، فليسمع!"]]}, {"l": "Mat 13:9", "n": "", "vs": [[9, "من له أذنان فليسمع! »"]]}, {"l": "Rev 22:10", "n": "", "vs": [[10, "ثم قال لي: «لا تختم على ما جاء في كتاب النبوءة هذا، لأن موعد إتمامه قد اقترب."]]}, {"l": "Rev 22:11", "n": "", "vs": [[11, "فمن كان ظالما، فليمعن في الظلم؛ ومن كان نجسا، فليمعن في النجاسة؛ ومن كان صالحا، فليمعن في الصلاح؛ ومن كان مقدسا، فليمعن في القداسة!»"]]}], "kwAr": "هذا ما يعلنه", "noteAr": ""}, {"kw": "for they", "raw": "Eze_3:9, Eze_3:26, Eze_12:2, Eze_12:3", "note": "", "refs": [{"l": "Eze 3:9", "n": "", "vs": [[9, "قد جعلت جبهتك في صلابة الماس، أقسى من الصوان، فلا تخف منهم ولا ترتعب من مرآهم لأنهم شعب متمرد»."]]}, {"l": "Eze 3:26", "n": "", "vs": [[26, "وألصق لسانك بحنكك فتبكم وتكف عن تقريعهم لأنهم شعب متمرد."]]}, {"l": "Eze 12:2", "n": "", "vs": [[2, "«ياابن آدم، أنت مقيم في وسط شعب متمرد، لهم عيون ليروا ولكن لا يبصرون، ولهم آذان ليسمعوا ولكن لا يصغون، لأنهم شعب متمرد."]]}, {"l": "Eze 12:3", "n": "", "vs": [[3, "أما أنت ياابن آدم فتأهب للسبي واخرج نهارا على مرأى منهم وامض من موضعك إلى موضع آخر لعلهم يفهمون، فإنهم شعب متمرد."]]}], "kwAr": "لأنهم شعب متمرد", "noteAr": ""}], "arS": [["ولكن عندما ", []], ["أخاطبك", ["H1696"]], ["، ", []], ["أفتح", ["H6605"]], [" ", []], ["فمك", ["H6310"]], [" ", []], ["فتقول", ["H559"]], [" لهم: ", []], ["هذا", ["H3541"]], [" ما ", []], ["يعلنه", ["H559"]], [" ", []], ["الرب", ["H3069"]], ["، من ", []], ["يسمع", ["H8085"]], [" ", []], ["فليسمع", ["H8085"]], ["، ومن ", []], ["يأب", ["H2310"]], [" ", []], ["فليمتنع", ["H2308"]], ["، ", []], ["لأنهم", ["H3588", "H1992"]], [" ", []], ["شعب", ["H1004"]], [" ", []], ["متمرد", ["H4805"]], ["».", []]]}, {"c": 4, "v": 1, "text": "أما أنت ياابن آدم فخذ لنفسك لبنة وابسطها أمامك وارسم عليها مدينة أورشليم،", "groups": [{"kw": "take", "raw": "Ezek. 5:1-17, Eze_12:3-16; 1Sa_15:27, 1Sa_15:28; 1Ki_11:30,1Ki_11:31; Isa_20:2-4; Jer_13:1-14, Jer_18:2-12, Jer_19:1-15, 25:15-38, 27:2-22; Hos_1:2-9, Hos_3:1-5; Hos_12:10", "note": "", "refs": [{"l": "Eze 5:1-17", "n": "", "vs": [[1, "أما أنت ياابن آدم فخذ لنفسك سيفا حادا استخدمه كموسى الحلاق لتحلق رأسك ولحيتك، ثم خذ لنفسك ميزانا واقسم الشعر إلى ثلاثة أثلاث،"], [2, "واحرق بالنار ثلثا في وسط المدينة إذا اكتملت أيام الحصار، ثم تناول ثلثا آخر واضربه بالسيف حول خريطة المدينة المرسومة. أما الثلث الأخير فذره مع الريح، وأنا أستل سيفا خلفه."], [3, "ولكن احتفظ بكمية قليلة منه وصرها في أطراف ثوبك."], [4, "كذلك خذ بعضا من الشعر واطرحه في النار ليحترق، فتندلع منه نار على كل شعب إسرائيل»."], [5, "وهذا ما يعلنه السيد الرب: «هذه هي أورشليم التي أقمتها في وسط الشعوب تحيط بها الأراضي،"], [6, "فخالفت أحكامي بأشر مما خالفتها الأمم وسكان الأراضي المحيطة بها، إذ تنكروا لأحكامي، وفرائضي لم يمارسوها."], [7, "لذلك من حيث أنكم تمردتم أكثر من الأمم المحيطة بكم، ولم تمارسوا فرائضي ولم تعملوا بمقتضى أحكامي، ولا بمقتضى أحكام الأمم التي حولكم."], [8, "ها أنا أيضا أنقلب عليك ياأورشليم، وأجري عليك قضاء على مشهد من الأمم،"], [9, "فأصنع بك ما لم أصنعه من قبل، وما لن أصنع مثله من بعد، عقابا لك على جميع أرجاسك."], [10, "إذ يأكل الآباء أبناءهم، والأبناء آباءهم، لأنني أجري فيك قضاء وأذري بقيتك كلها مع كل ريح."], [11, "لهذا حي أنا يقول السيد الرب، لأنك قد دنست مقدسي بكل أصنامك المكروهة، وبجميع رجاساتك، فأنا أيضا أستأصل، ولا تترَأف عليك عيني ولا أعفو."], [12, "ثلث سكانك يموتون بالوباء والجوع في وسطك، وثلث ثان يقتل حولك بالسيف، وثلث أخير أشتته بين الأمم وأتعقبه بسيف مسلول."], [13, "وهكذا أنفس عن غضبي ويخمد سخطي إذ أكون قد انتقمت. وحين يستكين حنقي عليهم يدركون أني أنا الرب الذي أصدرت قضائي في احتدام غيرتي."], [14, "وأجعلك خرابا وعارا بين الأمم المحيطة بك وأمام كل من يجتاز بك،"], [15, "فتكونين عارا ولعنة وعبرة ومثار دهشة للأمم المحيطة بك حين أنفذ فيك قضائي بغضب وغيظ وتقريعات حانقة. أنا الرب قد تكلمت."], [16, "وعندما أرسل عليهم سهام الجوع المميتة التي أعدت للتدمير، السهام التي أرسلتها لخرابكم، عندئذ أزيد من الجوع عليكم وأبيد مؤونة خبزكم،"], [17, "وأرسل عليكم المجاعة والوحوش الضارية، فتثكلكم ويعمكم الوباء وسفك الدماء، وأجلب عليكم السيف. أنا الرب قد قضيت»."]]}, {"l": "Eze 12:3-16", "n": "", "vs": [[3, "أما أنت ياابن آدم فتأهب للسبي واخرج نهارا على مرأى منهم وامض من موضعك إلى موضع آخر لعلهم يفهمون، فإنهم شعب متمرد."], [4, "فتخرج متاعك، متاع السفر نهارا على مشهد منهم، ثم تغادر أنت مساء أمامهم كالذاهبين إلى السبي."], [5, "انقب لك حائطا أمام عيونهم واخرج منه."], [6, "وعلى مشهد منهم احمل متاعك على كتفك وانقله عند العتمة. غط وجهك لكي لا ترى الأرض لأني جعلتك آية لشعب إسرائيل»."], [7, "ففعلت كما أمرت، فأخرجت نهارا متاعي. وعند المساء نقبت الحائط بيدي ونقلت أحمالي على كتفي عند العتمة أمامهم."], [8, "ثم في الصباح أعلنت لي كلمة الرب قائلة:"], [9, "«ياابن آدم، ألم يسألك شعب إسرائيل المتمرد ماذا تصنع؟"], [10, "أبلغهم ما يعلنه الرب: هذه نبوءة بشأن رئيس أورشليم وكافة شعب إسرائيل الساكنين فيها."], [11, "قل لهم: أنا آية لكم. فكما صنعت يصنع بهم، فيذهبون كلهم إلى الجلاء وإلى السبي."], [12, "ويحمل الرئيس المتولي شؤونهم أحماله على كتفه في العتمة ويخرج. وتنقب له ثغرة في الحائط ليخرج منها وهو يغطي وجهه لئلا يرى الأرض بعينيه."], [13, "وأبسط شبكتي عليه فيقع في شركي، وأحضره إلى بابل إلى أرض الكلدانيين، ولكن لن يراها، هناك يموت."], [14, "وأبدد حاشيته وأعوانه وكل جيوشه في كل مكان وأتعقبهم بسيف مسلول."], [15, "فيدركون أني أنا الرب حين أشتتهم بين الأمم وأبددهم في البلاد."], [16, "وأبقي على فئة قليلة منهم أنجيها من السيف والجوع والوباء، لكي يحدثوا بكل رجاساتهم بين الأمم التي فرقتهم فيها فيدركون أني أنا الرب»."]]}, {"l": "1Sa 15:27", "n": "", "vs": [[27, "واستدار صموئيل ليمضي، فتشبث شاول بهدب جبته، فتمزق هدب الجبة."]]}, {"l": "1Sa 15:28", "n": "", "vs": [[28, "فقال له صموئيل: «يمزق الرب مملكة إسرائيل عنك ويهبها لمن هو خير منك."]]}, {"l": "1Ki 11:30", "n": "", "vs": [[30, "فتناول أخيا الر داء الجديد الذي عليه ومزقه اثنتي عشرة قطعة،"]]}, {"l": "1Ki 11:31", "n": "", "vs": [[31, "وقال ليربعام: «خذ لنفسك عشر قطع، لأنه هكذا يقول الرب إله إسرائيل: ها أنا أمزق المملكة من يد سليمان وأعطيك عشرة أسباط،"]]}, {"l": "Isa 20:2-4", "n": "", "vs": [[2, "تكلم الرب على لسان إشعياء بن آموص قائلا: «اذهب واخلع المسوح عن حقويك، وانزع حذاءك من قدميك». ففعل كذلك ومشى عاريا حافيا."], [3, "وقال الرب: «كما مشى عبدي إشعياء عاريا حافيا لمدة ثلاث سنوات علامة وآية على المصائب التي سأنزلها بمصر وكوش،"], [4, "هكذا يقود ملك أشور أسرى مصر وكوش صغارا وكبارا، عراة حفاة بأقفية مكشوفة، عارا لمصر."]]}, {"l": "Jer 13:1-14", "n": "", "vs": [[1, "ثم قال الرب لي: «امض واشتر لنفسك منطقة من كتان ولفها حول حقويك، ولا تضعها في الماء»."], [2, "فاشتريت منطقة كأمر الرب ولففتها حول حقوي،"], [3, "ثم كلمني الرب ثانية"], [4, "«خذ المنطقة التي اشتريتها، الملفوفة حول حقويك، واذهب إلى نهر الفرات، واطمرها في شق صخر»."], [5, "فانطلقت وطمرتها عند الفرات كأمر الرب."], [6, "وبعد عدة أيام قال لي الرب: «اذهب إلى الفرات وخذ المنطقة التي أمرتك أن تطمرها هناك»."], [7, "فقصدت إلى الفرات وحفرت الموضع وأخذت المنطقة من حيث طمرتها، وإذا بها قد تلفت ولم تعد تصلح لشيء."], [8, "فأوحى إلي الرب بكلمته."], [9, "«هكذا سأحطم كبرياء يهوذا وكبرياء أورشليم العظيمة."], [10, "إن هذا الشعب الشرير الذي أبى أن يستمع إلى كلمتي، وانساق بعناد خلف أهواء قلبه، وضل وراء الأصنام ليسجد لها ويعبدها، سيصبح مثل هذه المنطقة."], [11, "وكما أن المنطقة تلتف حول حقوي الإنسان، هكذا جعلت كل ذرية يهوذا تلتف حولي، ليكونوا لي شعبا ومثار شهرة وفخر ومجد. ولكنهم لم يسمعوا»."], [12, "لذلك قل لهم: «هذا ما يعلنه الرب إله إسرائيل: كل زق يمتليء خمرا، فيجيبونك: ألسنا نعرف أن كل زق يمتليء خمرا؟»"], [13, "فتقول لهم، «هذا ما يعلنه الرب: ها أنا أملأ بالسكر جميع سكان هذه الأرض والملوك من ذرية داود الجالسين على عرشه، والكهنة، والأنبياء وكل أهل أورشليم."], [14, "وأهشمهم الواحد فوق الآخر، الآباء والأبناء معا، يقول الرب. لا أشفق ولا أترَأف ولا أرحم، بل أهلكهم»."]]}, {"l": "Jer 18:2-12", "n": "", "vs": [[2, "«قم وامض إلى بيت الفخاري، وهناك أسمعك كلامي»."], [3, "فانطلقت إلى بيت الفخاري، فإذا به يعمل على دولابه."], [4, "غير أن الإناء الذي كان يصنعه فسد بين يديه، فعاد يشكله إناء آخر كما طاب للفخاري أن يصوغه."], [5, "عندئذ قال لي الرب:"], [6, "«ياذرية إسرائيل: ألا أستطيع أن أصنع بكم كما صنع الفخاري؟ إنكم في يدي كالطين في يد الفخاري."], [7, "تارة أقضي على أمة وعلى مملكة بالاستئصال والهدم والدمار،"], [8, "فترتد تلك الأمة التي قضيت عليها بالعقاب عن شرها، فأكف عن الشر الذي نويت معاقبتها به."], [9, "وتارة أقضي بمكافأة أمة أو مملكة ببناء قوتها وإنمائها."], [10, "ثم لا تلبث أن ترتكب الشر أمامي ولا تسمع لصوتي، فأكف عن الخير الذي نويت أن أنعم به عليها."], [11, "لذلك قل لرجال يهوذا وأهل أورشليم، هذا ما يعلنه الرب: ها أنا أدبر لكم شرا، وأعد لكم مؤامرة، فليرجع كل واحد منكم عن طريقه الشرير وقوموا سبلكم وأعمالكم."], [12, "ولكنهم يجيبون: لا جدوى من هذا، بل نسعى وراء أهواء أفكارنا، وكل واحد منا يفعل ما يروق لعناد قلبه الأثيم»."]]}, {"l": "Jer 19:1-15", "n": "", "vs": [[1, "وقال لي الرب: «امض واشتر جرة خزف، واصطحب معك بعض شيوخ الشعب وشيوخ الكهنة،"], [2, "وانطلق إلى وادي ابن هنوم القائم عند مدخل باب الفخار، وناد هناك بالكلمات التي أمليها عليك،"], [3, "وقل: اسمعوا ياملوك يهوذا، وياأهل أورشليم كلمة الرب. هذا ما يعلنه الرب القدير إله إسرائيل: انظروا، ها أنا أجلب على هذا الموضع شرا تطن له أذنا كل من يسمع به،"], [4, "لأنهم تركوني، وتنكروا لهذا الموضع ودنسوه بإحراق بخور لآلهة أوثان لم يعرفوها لا هم ولا آباؤهم ولا ملوك يهوذا أيضا، ولأنهم ملأوا هذا الموضع من دم الأبرياء."], [5, "وبنوا مرتفعات لعبادة البعل ليحرقوا بنيهم بالنار كقرابين محرقات للبعل مما لم أوص به ولم أتحدث عنه ولم يخطر ببالي."], [6, "لذلك، ها أيام مقبلة، يقول الرب، لا يدعى فيها هذا المكان توفة من بعد أو وادي ابن هنوم، بل وادي القتل."], [7, "وأبطل في هذا الموضع مشورات أهل يهوذا وأورشليم، فيتساقطون بحد السيف أمام أعدائهم وبأيدي طالبي نفوسهم، وأجعل جثثهم طعاما لجوارح السماء ووحوش الأرض."], [8, "وأدمر هذه المدينة وأجعلها مثار صفير. كل من يمر بها تعتريه الدهشة ويصفر لما حل بها من نكبات."], [9, "وأطعمهم لحوم أبنائهم وبناتهم، ويأكل كل واحد لحم جاره في أثناء الحصار والضيقة التي يضايقهم بها أعداؤهم وطالبو نفوسهم."], [10, "ثم حطم الجرة على مرأى الرجال الذاهبين معك،"], [11, "وقل لهم: هذا ما يعلنه الرب القدير: سأحطم هذا الشعب وأدمر هذه المدينة كما يحطم المرء إناء الخزاف، بحيث لا يمكن إصلاحه، ويدفن الرجال في توفة إذ لن يتوافر موضع آخر للدفن."], [12, "هذا ما سأجريه على هذا المكان وعلى سكانه، يقول الرب، سأجعل هذه المدينة مثل توفة،"], [13, "وأحيل بيوت أورشليم وبيوت ملوك يهوذا إلى موضع نجاسة، وكذلك كل البيوت التي أحرقوا على سطوحها بخورا لكواكب السماء، وسكبوا سكائب خمر لآلهة أخرى»."], [14, "وجاء إرميا من توفة، التي كان الرب قد أرسله إليها ليتنبأ، ووقف في ساحة هيكل الرب، وخاطب جميع الشعب:"], [15, "هذا ما يقوله الرب القدير إله إسرائيل: «ها أنا جالب على هذه المدينة وعلى جميع قراها كل الشر الذي قضيت به عليها، لأنهم قسوا قلوبهم فلم يسمعوا كلامي»."]]}, {"l": "Jer 25:15-38", "n": "", "vs": [[15, "وهذا ما أعلنه لي الرب إله إسرائيل: «خذ كأس خمر غضبي من يدي، واسق منها جميع الأمم التي أرسلك إليها،"], [16, "فتشرب وتترنح، وتجن بفعل السيف الذي أرسله بينها»."], [17, "فتناولت الكأس من يد الرب وسقيت منها جميع الأمم التي بعثني إليها الرب:"], [18, "أورشليم ومدن يهوذا وملوكها وعظماءها، لأجعلها قفرا خرابا ومثار صفير ولعنة إلى هذا اليوم."], [19, "وسقيت منها كذلك فرعون ملك مصر وخدامه وعظماءه وكل شعبه،"], [20, "وكل الغرباء المقيمين في وسطهم، وجميع ملوك أرض عوص، وسائر ملوك الفلسطينيين: ملوك أشقلون، وغزة، وعقرون وبقية أشدود،"], [21, "وآدوم، وموآب، وبني عمون،"], [22, "وكل ملوك صور وصيدون وملوك الجزائر عبر البحر،"], [23, "وددان وتيماء وبوز، وكل ذوي الشعر المقصوص الزوايا،"], [24, "وكل ملوك العرب، وسائر ملوك القبائل المنضمة إليهم المقيمين في الصحراء،"], [25, "وكل ملوك زمري، وعيلام، وجميع ملوك مادي."], [26, "وكل ملوك الشمال، القريبين والبعيدين، الواحد تلو الآخر، وكل الممالك المنتشرة على وجه الأرض. ثم بعد ذلك يشرب منها ملك بابل."], [27, "ثم قل لهم، هذا ما يعلنه الرب القدير إله إسر ائيل: اشربوا واثملوا وتقيأوا واسقطوا صرعى، ولا تقوموا من جراء السيف الذي أرسله في وسطكم."], [28, "وإن أبوا أن يتناولوا الكأس من يدك ليشربوا منها، فقل لهم: هذا ما يعلنه الرب القدير: لابد لكم من شربها،"], [29, "لأني شرعت أعاقب المدينة التي دعي اسمي عليها، فهل تفلتون أنتم من العقاب؟ فها أنا قد سلطت السيف على جميع سكان الأرض، يقول الرب القدير."], [30, "أما أنت فتنبأ عليهم بكل هذا القضاء، وقل لهم: «الرب يزأر من العلاء، ومن مسكن قدسه يدوي صوته. يزأر زئيرا على مسكنه، ويجهر هاتفا على جميع سكان الأرض كما يجهر الدائسون على العنب»."], [31, "قد بلغت الجلبة جميع أقاصي الأرض، لأن للرب دعوى على الأمم، فيدخل في محاكمة مع البشر، ويلقي بالأشرار إلى السيف."], [32, "ها الشر يندفع من أمة إلى أمة، وها زوبعة رهيبة تثور من أقصى أطراف الأرض."], [33, "وينتشر قتلى غضب الرب في ذلك اليوم من أقصى الأرض إلى أقصاها. لا ينوح عليهم أحد، ولا يجمعون ولا يدفنون، بل يصيرون نفاية فوق سطح الأرض."], [34, "أعولوا أيها الرعاة وابكوا، تمرغوا في الرماد ياقادة الشعب، لأن أوان ذبحكم قد حان، فأشتتكم فتسقطون (وتتناثرون) كإناء فاخر."], [35, "لن يبقى للرعاة ملجأ يلوذون به، ولا مهرب لقادة الشعب."], [36, "اسمعوا صوت الرعاة وولولة قادة الشعب، لأن الرب يتلف مراعيهم."], [37, "عم الخراب المواقع التي يسودها السلام من فرط غضب الله العنيف."], [38, "قد هجر كالشبل عرينه، لأن الأرض قد صارت خرابا من سيف العاتي، من شدة احتدام غضبه."]]}, {"l": "Jer 27:2-22", "n": "", "vs": [[2, "«هذا ما أعلنه الرب: اصنع لنفسك ربطا وأنيارا وضعها على عنقك،"], [3, "وابعث برسالة إلى ملوك أدوم وموآب وبني عمون وصور وصيدون مع الرسل الموفدين إلى أورشليم إلى صدقيا ملك يهوذا،"], [4, "وأوصهم أن ينقلوا هذه الرسالة إلى سادتهم قائلا: هذا ما يعلنه الرب القدير إله إسرائيل:"], [5, "أنا بقوتي العظيمة وبذراعي الممدودة صنعت الأرض بما عليها من بشر وبهائم، ووهبتها لمن طاب لي أن أهبها له."], [6, "والآن قد عهدت بجميع هذه الأراضي إلى نبوخذناصر ملك بابل عبدي، وأعطيته أيضا حيوان الحقل ليكون في خدمته."], [7, "فتستعبد له وَلابنه ولحفيده جميع أمم الأرض، إلى أن يحين موعد استعباد أرضه، عندئذ تستعبده أمم كثيرة وملوك عظماء."], [8, "ولكن إن أبت أية أمة أو مملكة الاستعباد لنبوخذناصر ملك بابل، ورفضت أن تضع عنقها تحت نيره، فإني أعاقبها بالسيف والجوع والوباء إلى أن أبيدهم بيده، يقول الرب."], [9, "فلا تصغوا إلى أنبيائكم الكذبة وعرافيكم وحالميكم وعائفيكم وسحرتكم القائلين لكم: لن تستعبدوا لملك بابل،"], [10, "لأنهم إنما يتنبأون لكم بالباطل ليبعدوكم عن أرضكم ولأجليكم عنها فتهلكوا"], [11, "ولكن كل أمة تستسلم لملك بابل وتستعبد له أبقيها في أرضها، يقول الرب، فتحرثها وتقيم فيها»."], [12, "فبلغت صدقيا ملك يهوذا جميع هذا الكلام وقلت: «اخضعوا لملك بابل واخدموه وشعبه فتحيوا."], [13, "فلماذا تموت أنت وشعبك بحد السيف والجوع والوباء كما قضى الرب على الأمة التي لا تستعبد لملك بابل؟"], [14, "لا تستمعوا لكلام الأنبياء الكذبة الذين يقولون لكم: لا تستعبدوا لملك بابل لأنهم يتنبأون لكم كذبا،"], [15, "فأنا لم أرسلهم، يقول الرب، إنما هم يتنبأون باسمي كذبا لأجلكم فتطردون أنتم وأنبياؤكم المتنبئون لكم»."], [16, "وقلت للكهنة وكل الشعب: «هذا ما يعلنه الرب: لا تسمعوا لكلام أنبيائكم الكذبة الذين يتنبأون لكم قائلين إن آنية هيكل الرب سترد سريعا من بابل، فإنهم يتنبأون لكم كذبا."], [17, "لا تصغوا لهم، بل اخدموا ملك بابل واحيوا، فلماذا تتحول هذه المدينة إلى أطلال؟"], [18, "وإن كانوا حقا أنبياء، وإن كان حقا وحي الرب لديهم فليبتهلوا إلى الرب القدير لكي لا يحمل ما تبقى من آنية هيكل الرب، وقصر ملك يهوذا، وأورشليم إلى بابل."], [19, "فإن الرب القدير يقول عن الأعمدة، وبركة الماء والقواعد وسائر الآنية المتبقية في هذه المدينة"], [20, "مما لم يستول عليها نبوخذناصر ملك بابل عندما سبى يكنيا بن يهوياقيم ملك يهوذا من أورشليم مع جميع أشراف يهوذا وأورشليم،"], [21, "فبقيت في هيكل الرب وفي قصر الملك وفي أورشليم:"], [22, "إنها ستحمل إلى بابل وتبقى هناك إلى يوم افتقادي، يقول الرب، فأسترجعها وأردها إلى هذا الموضع»."]]}, {"l": "Hos 1:2-9", "n": "", "vs": [[2, "وأول ما خاطب الرب به هوشع أنه قال له: «اذهب وتزوج من عاهرة، تنجب لك أبناء زنى، لأن الأرض قد زنت إذ تركت الرب»."], [3, "فمضى هوشع وتزوج جومر بنت دبلايم، فحملت وأنجبت له ابنا."], [4, "فقال الرب له: «ادع اسمه يزرعيل، لأني موشك أن أقضي على بيت ياهو انتقاما لدم يزرعيل، وأبيد مملكة بيت إسرائيل."], [5, "في ذلك اليوم أحطم قوس إسرائيل في وادي يزرعيل»."], [6, "ثم حملت ثانية فأنجبت ابنة، فقال له الرب: «سمها لورحامة (ومعناه: لا رحمة) لأني لا أعود أرحم بيت إسرائيل ولن أصفح عنهم."], [7, "ولكني أرحم بيت يهوذا وأخلصهم بقوتي أنا الرب إلههم. لن أنقذهم بقوس أو بسيف، ولا بحرب ولا بخيل أو فرسان»."], [8, "وبعد أن فطمت «لورحامة» حملت وأنجبت ابنا."], [9, "وقال الرب: «سمه لوعمي (ومعناه: ليس شعبي) لأنكم لستم شعبي وأنا لست إلهكم."]]}, {"l": "Hos 3:1-5", "n": "", "vs": [[1, "ثم قال لي الرب: «اذهب ثانية وأحبب امرأة عشيقة آخر، زانية، أحببها كمحبة الرب لشعبه إسرائيل، على الرغم من ضلالهم وراء آلهة أخرى، وولعهم بتقديم قرابين الزبيب لهم."], [2, "فاشتريتها بخمسة عشر شاقلا من الفضة (نحو مئة وثمانين جراما)، وبحومر ونصف حومر من الشعير (نحو ثلاث مئة وستين لترا)،"], [3, "وقلت لها: تمكثين ملكا خالصا لي أياما كثيرة لا تزنين ولا تكونين لرجل آخر وأكون أنا كذلك لك."], [4, "لأن أبناء إسرائيل يمكثون أمدا طويلا من غير ملك أو أمير، ومن غير ذبيحة ولا تماثيل ولا أفود ولا ترافيم."], [5, "ثم يرجع أبناء إسرائيل ويطلبون الرب إلههم، وداود ملكهم (أي المسيح)، ويلتمسون برهبة الرب وجوده في آخر الأيام»."]]}, {"l": "Hos 12:10", "n": "", "vs": [[10, "قد خاطبت الأنبياء، وأكثرت لهم الرؤى، ونطقت على ألسنتهم بأمثال."]]}], "kwAr": "فخذ لنفسك", "noteAr": ""}, {"kw": "a tile", "raw": "μαπδ [Strongs H3843], levainah generally denotes a brick, and Palladius informs us that the bricks in common use among the ancients were two feet long, one foot broad, and four inches thick; and on such a surface the whole siege might be easily pourtrayed. Perhaps, however, it may here denote a flat tile, like a Roman brick, which were commonly used for tablets, as we learn from Pliny, Hist. Nat. 1. vii. c. 57.", "note": "μαπδ [Strongs H3843]
