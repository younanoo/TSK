<script>window.CATALOG=[{"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 5, "nv": 99, "refs": 1290, "last": "5:17", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 26, "abbr": "Eze", "en": "Ezekiel", "verses": [{"c": 1, "v": 1, "text": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله.", "groups": [{"kw": "in the thirtieth", "raw": "Num_4:3; Luk_3:23", "note": "", "refs": [{"l": "Num 4:3", "n": "", "vs": [[3, "من ابن ثلاثين سنة حتى ابن خمسين، من المتجندين لخدمة خيمة الاجتماع."]]}, {"l": "Luk 3:23", "n": "", "vs": [[23, "ولما بدأ يسوع (خدمته)، كان في الثلاثين من العمر تقريبا، وكان معروفا أنه ابن يوسف بن هالي،"]]}], "kwAr": "في السنة الثلاثين", "noteAr": ""}, {"kw": "as I", "raw": "Ecc_9:1, Ecc_9:2; Jer_24:5-7", "note": "", "refs": [{"l": "Ecc 9:1", "n": "", "vs": [[1, "هذا كله ادخرته في قلبي واختبرته: أن الأبرار والحكماء، وما يصدر عنهم من أعمال، في يد الله، ولا أحد يدري ما ينتظره، حبا كان أم بغضا،"]]}, {"l": "Ecc 9:2", "n": "", "vs": [[2, "إذ الجميع معرضون لنفس المصير، الصالحون والطالحون، الأخيار والأشرار، الطاهر والنجس، المقرب للذبائح وغير المقرب. فالصالح كالطالح سيان، والحالف كمن يخشى الحلف."]]}, {"l": "Jer 24:5-7", "n": "", "vs": [[5, "هذا ما يعلنه الرب إله إسرائيل: سأعتني بالمسبيين من يهوذا الذين أجليتهم لخيرهم عن هذا الموضع إلى أرض الكلدانيين، كمثل هذا التين الجيد."], [6, "وسأرعاهم بعيني لخيرهم، وأردهم إلى هذه الأرض، وأبنيهم ولا أهدمهم، وأغرسهم ولا أستأصلهم."], [7, "وأهبهم قلبا ليعرفوا أني أنا الرب، فيكونوا لي شعبا وأكون لهم إلها، لأنهم يرجعون إلي من كل قلوبهم."]]}], "kwAr": "فيما كنت", "noteAr": ""}, {"kw": "captives", "raw": "Heb. captivity", "note": "Heb. captivity", "refs": [], "kwAr": "المسبيين", "noteAr": "بالعبرية: سبي."}, {"kw": "by the river", "raw": "Eze_1:3, Eze_3:15, Eze_3:23, Eze_10:15, Eze_10:20,Eze_10:22, Eze_43:3", "note": "", "refs": [{"l": "Eze 1:3", "n": "", "vs": [[3, "أوحى الرب إلى حزقيال الكاهن ابن بوزي عند جوار نهر خابور، في ديار الكلدانيين، إذ كانت علي يد الرب،"]]}, {"l": "Eze 3:15", "n": "", "vs": [[15, "ثم أقبلت على المسبيين القاطنين إلى جوار نهر خابور عند تل أبيب، فأقمت هناك حيث يسكنون متحيرا سبعة أيام."]]}, {"l": "Eze 3:23", "n": "", "vs": [[23, "فنهضت ومضيت إلى السهل، وهناك رأيت مجد الرب واقفا، مماثلا لمجد الرب الذي رأيته عند نهر خابور، فانطرحت على وجهي."]]}, {"l": "Eze 10:15", "n": "", "vs": [[15, "ثم ارتفع الكروبيم، فكانت هذه هي الكائنات التي شاهدتها بجوار نهر خابور."]]}, {"l": "Eze 10:20", "n": "", "vs": [[20, "هذه هي الكائنات الحية التي شاهدتها تحت إله إسرائيل عند نهر خابور. فعرفت أنهم الكروبيم."]]}, {"l": "Eze 10:22", "n": "", "vs": [[22, "أما أشكال وجوههم فكانت نفس الوجوه التي رأيتها عند نهر خابور، لا تختلف عنها في صورها ومعالمها، وكل واحد يتحرك إلى الأمام حسب اتجاهه."]]}, {"l": "Eze 43:3", "n": "", "vs": [[3, "وكانت الرؤيا التي شاهدتها مماثلة للرؤيا التي تجلت لي عندما جاء الرب لتدمير المدينة، وكالرؤى التي شاهدتها عند نهر خابور. فانطرحت على وجهي،"]]}], "kwAr": "بجوار نهر", "noteAr": ""}, {"kw": "Chebar", "raw": "Chebar, called now Khabour, is a river of Mesopotamia, which taking its rise in the Mysian mountains, falls into the Euphrates near Carchemish, or Circesioum, now Karkisia, about 35 degrees 20 minutes n lat. and 40 degrees 25 minutes e long.", "note": "Chebar, called now Khabour, is a river of Mesopotamia, which taking its rise in the Mysian mountains, falls into the Euphrates near Carchemish, or Circesioum, now Karkisia, about 35 degrees 20 minutes n lat. and 40 degrees 25 minutes e long.", "refs": [], "kwAr": "خابور", "noteAr": "خابور، ويُسمى اليوم الخابور، نهر في ما بين النهرين ينبع من جبال ميسيا ويصب في الفرات قرب كركميش أو قرقيسيا، التي تُسمى اليوم كركيسيا، على خط عرض نحو 35 درجة و20 دقيقة شمالا وخط طول 40 درجة و25 دقيقة شرقا."}, {"kw": "the heavens", "raw": "Mat_3:16; Luk_3:21; Joh_1:51; Act_7:56, Act_10:11; Rev_4:1, Rev_19:11", "note": "", "refs": [{"l": "Mat 3:16", "n": "", "vs": [[16, "فلما تعمد يسوع، صعد من الماء في الحال، وإذا السماوات قد انفتحت له ورأى روح الله هابطا ونازلا عليه كأنه حمامة."]]}, {"l": "Luk 3:21", "n": "", "vs": [[21, "ولما تعمد الشعب جميعا، تعمد يسوع، وإذ كان يصلي، انفتحت السماء،"]]}, {"l": "Joh 1:51", "n": "", "vs": [[51, "ثم قال له: «الحق الحق أقول لكم: إنكم سترون السماء مفتوحة، وملائكة الله يصعدون وينزلون على ابن الإنسان!»"]]}, {"l": "Act 7:56", "n": "", "vs": [[56, "فقال: «إني أرى السماء مفتوحة وابن الإنسان واقفا عن يمين الله!»"]]}, {"l": "Act 10:11", "n": "", "vs": [[11, "فرأى رؤيا: السماء مفتوحة، ووعاء يشبه قطعة كبيرة من القماش مربوطة بأطرافها الأربعة يتدلى إلى الأرض،"]]}, {"l": "Rev 4:1", "n": "", "vs": [[1, "بعد ذلك رأيت بابا مفتوحا في السماء، وإذا الصوت الذي سمعته من قبل يخاطبني كأنه بوق، ويقول: «اصعد إلى هنا فأريك ما لابد أن يحدث بعد هذا»."]]}, {"l": "Rev 19:11", "n": "", "vs": [[11, "ثم رأيت السماء مفتوحة، وإذا حصان أبيض يسمى راكبه «الأمين الصادق» الذي يقضي ويحارب بالعدل."]]}], "kwAr": "السماوات", "noteAr": ""}, {"kw": "I saw", "raw": "Eze_8:3, Eze_11:24; Gen_15:1, Gen_46:2; Num_12:6; Isa_1:1; Dan_8:1, Dan_8:2; Hos_12:10; Joe_2:28; Mat_17:9; Act_9:10-12, Act_10:3; 2Co_12:1", "note": "", "refs": [{"l": "Eze 8:3", "n": "", "vs": [[3, "ثم مد شبه يد وقبض علي بناصية رأسي، وحلق بي روح بين الأرض والسماء وأحضرني في رؤى الله إلى أورشليم، إلى مدخل البوابة الشمالية للساحة الداخلية، حيث ينتصب التمثال المثير للغيرة."]]}, {"l": "Eze 11:24", "n": "", "vs": [[24, "وحل الروح وأحضرني، في الرؤيا التي أعلنها لي روح الله، إلى أرض الجلاء في بلاد الكلدانيين، ثم ارتفعت عني الرؤيا التي شاهدتها،"]]}, {"l": "Gen 15:1", "n": "", "vs": [[1, "وبعد هذه الأمور قال الرب لأبرام في الرؤيا: «لا تخف ياأبرام. أنا ترس لك. وأجرك عظيم جدا»."]]}, {"l": "Gen 46:2", "n": "", "vs": [[2, "وقال الله لإسرائيل في رؤى الليل: «يعقوب، يعقوب». فأجاب: «ها أنا»"]]}, {"l": "Num 12:6", "n": "", "vs": [[6, "فقال: «اسمعا كلامي: إن كان بينكم نبي للرب فإني أستعلن له بالرؤيا، وأكلمه بالحلم،"]]}, {"l": "Isa 1:1", "n": "", "vs": [[1, "هذه هي رؤيا إشعياء بن آموص، التي أعلنت له بشأن يهوذا وأورشليم في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا."]]}, {"l": "Dan 8:1", "n": "", "vs": [[1, "وفي السنة الثالثة من مدة حكم بيلشاصر الملك، ظهرت لي أنا دانيآل رؤيا أخرى بعد الرؤيا الأولى،"]]}, {"l": "Dan 8:2", "n": "", "vs": [[2, "وكنت آنئذ في شوشان عاصمة ولاية عيلام بجوار نهر أولاي،"]]}, {"l": "Hos 12:10", "n": "", "vs": [[10, "قد خاطبت الأنبياء، وأكثرت لهم الرؤى، ونطقت على ألسنتهم بأمثال."]]}, {"l": "Joe 2:28", "n": "", "vs": [[28, "ثم أسكب روحي على كل بشر، فيتنبأ أبناؤكم وبناتكم، ويحلم شيوخكم أحلاما ويرى شبابكم رؤى."]]}, {"l": "Mat 17:9", "n": "", "vs": [[9, "وفيما هم نازلون من الجبل، أوصاهم يسوع قائلا: «لا تخبروا أحدا بما رأيتم حتى يقوم ابن الإنسان من بين الأموات»."]]}, {"l": "Act 9:10-12", "n": "", "vs": [[10, "وكان في دمشق تلميذ للرب اسمه حنانيا، ناداه الرب في رؤيا: «يا حنانيا!» فقال: «لبيك يارب!»"], [11, "فقال له الرب: «اذهب إلى الشارع المعروف بالمستقيم واسأل في بيت يهوذا، عن رجل من طرسوس اسمه شاول. إنه يصلي هناك الآن."], [12, "وقد رأى في رؤيا رجلا اسمه حنانيا يدخل إليه ويضع يده عليه، فيبصر»."]]}, {"l": "Act 10:3", "n": "", "vs": [[3, "وذات نهار نحو الساعة الثالثة بعد الظهر، رأى كرنيليوس في رؤيا واضحة ملاكا من عند الله يدخل إليه ويقول: «ياكرنيليوس!»"]]}, {"l": "2Co 12:1", "n": "", "vs": [[1, "أجل، إن الافتخار لا ينفعني شيئا؛ ولكن سأنتقل إلى ما كشفه لي الرب من رؤى وإعلانات."]]}], "kwAr": "فشاهدت", "noteAr": ""}], "arS": [["وحدث", ["H1961"]], [" في اليوم ", []], ["الخامس", ["H2568"]], [" من ", []], ["الشهر", ["H2320"]], [" ", []], ["الرابع", ["H7243"]], [" العبري، في ", []], ["السنة", ["H8141"]], [" ", []], ["الثلاثين", ["H7970"]], ["، فيما ", []], ["كنت", ["H589"]], [" ", []], ["بين", ["H8432"]], [" ", []], ["المسبيين", ["H1473"]], [" ", []], ["بجوار", ["H5921"]], [" ", []], ["نهر", ["H5104"]], [" ", []], ["خابور", ["H3529"]], ["، أن ", []], ["انفتحت", ["H6605"]], [" ", []], ["السماوات", ["H8064"]], [" ", []], ["فشاهدت", ["H7200"]], [" ", []], ["رؤى", ["H4759"]], [" من عند ", []], ["الله", ["H430"]], [".", []]]}, {"c": 1, "v": 2, "text": "في اليوم الخامس من الشهر، في السنة الخامسة لسبي الملك يوياكين،", "groups": [{"kw": "", "raw": "Eze_8:1, Eze_20:1, Eze_29:1, Eze_29:17, Eze_31:1, Eze_40:1; 2Ki_24:12-15", "note": "", "refs": [{"l": "Eze 8:1", "n": "", "vs": [[1, "وف لدانيين، إذ كانت علي يد الرب،", "groups": [{"kw": "word", "raw": "Jer_1:2, Jer_1:4; Hos_1:1; Joe_1:1; 1Ti_4:1", "note": "", "refs": [{"l": "Jer 1:2", "n": "", "vs": [[2, "وقد أعلن الرب له هذه النبوءة في عهد يوشيا بن آمون ملك يهوذا، في السنة الثالثة عشرة من ملكه."]]}, {"l": "Jer 1:4", "n": "", "vs": [[4, "فأوحى الرب إلي قائلا:"]]}, {"l": "Hos 1:1", "n": "", "vs": [[1, "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."]]}, {"l": "Joe 1:1", "n": "", "vs": [[1, "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"]]}, {"l": "1Ti 4:1", "n": "", "vs": [[1, "إلا أن الروح يعلن صراحة أن قوما في الأزمنة الأخيرة سوف يرتدون عن الإيمان، منساقين وراء أرواح مضللة وتعاليم شيطانية،"]]}], "kwAr": "أوحى الرب", "noteAr": ""}, {"kw": "Ezekiel", "raw": "Heb. Jehezkel", "note": "Heb. Jehezkel", "refs": [], "kwAr": "حزقيال", "noteAr": "بالعبرية: يحزقيل."}, {"kw": "and the", "raw": "Eze_3:14, Eze_3:22, Eze_8:1, Eze_33:22, Eze_37:1, Eze_40:1; 1Ki_18:46; 2Ki_3:15", "note": "", "refs": [{"l": "Eze 3:14", "n": "", "vs": [[14, "وهكذا حلق بي روح الرب وحملني بعيدا، وقد جاشت حرارة روحي بمرارة نفسي، ولكن كانت يد الرب علي شديدة."]]}, {"l": "Eze 3:22", "n": "", "vs": [[22, "ثم كانت هناك علي يد الرب فقال لي: «قم اخرج إلى السهل فأخاطبك»."]]}, {"l": "Eze 8:1", "n": "", "vs": [[1, "وفي اليوم الخامس من الشهر السادس العبري (أي آب ; أغسطس) من السنة السادسة، بينما كنت جالسا في بيتي، وشيوخ يهوذا ماثلون أمامي، حلت علي قوة السيد الرب هناك،"]]}, {"l": "Eze 33:22", "n": "", "vs": [[22, "وكانت يد الرب علي في المساء قبيل مجيء الناجي، وفتح الرب فمي في الصباح عند وصوله، فانفكت عقدة لساني ولم أعد أبكم."]]}, {"l": "Eze 37:1", "n": "", "vs": [[1, "وكانت يد الرب علي فأحضرني بالروح إلى وسط واد مليء بعظام،"]]}, {"l": "Eze 40:1", "n": "", "vs": [[1, "وفي اليوم العاشر من مطلع السنة الخامسة والعشرين من سبينا الموافقة للسنة الرابعة عشرة من سقوط أورشليم، كانت علي يد الرب فأحضرني إلى هناك،"]]}, {"l": "1Ki 18:46", "n": "", "vs": [[46, "وحلت قوة الرب إلى كبد السماء، وتلفعت بسحب داكنة وضباب."]]}, {"l": "Deu 4:12", "n": "", "vs": [[12, "فخاطبكم الرب من وسط النار، فسمعتم صوت كلماته من غير أن تبصروا له صورة."]]}, {"l": "2Ch 5:13", "n": "", "vs": [[13, "وعندما تناغمت أصوات الأبواق والمغنين وكأنها صوت واحد يتغنى بحمد الرب وتسبيحه، ارتفعت أصواتهم بالغناء، مصحوبة بنغمات الأبواق وعزف الصنوج مرنمين للرب قائلين: «الرب صالح ورحمته إلى الأبد تدوم». فامتلأ الهيكل سحابا."]]}, {"l": "2Ch 5:14", "n": "", "vs": [[14, "ولم يستطع الكهنة القيام بالخدمة بسبب السحاب لأن مجد الرب ملأ الهيكل."]]}, {"l": "2Ch 6:1", "n": "", "vs": [[1, "عندئذ قال سليمان: «قال الرب إنه يسكن في الضباب."]]}, {"l": "2Ch 7:1-3", "n": "", "vs": [[1, "وما إن أتم سليمان صلاته حتى نزلت نار من السماء التهمت المحرقة والذبائح، وملأ مجد الرب الهيكل،"], [2, "ولم يتمكن الكهنة من الدخول إلى بيت الرب، لأن مجد الرب ملأه."], [3, "وشهد جميع بني إسرائيل نزول النار ومجد الرب على الهيكل، فخروا على وجوههم ساجدين على بلاط الأرض المجزع، وحمدوا الرب لأنه صالح، ولأن رحمته إلى الأبد تدوم."]]}, {"l": "Psa 18:11-13", "n": "", "vs": [[11, "جعل الظلمة ستارا له، وصار ضباب المياه وسحب السماء الداكنة مظلته المحيطة به."], [12, "من بهاء طلعته عبرت السحب أمامه. حدثت عاصفة برد وبرق كالجمر الملتهب."], [13, "أرعد الرب في السماوات، أطلق العلي صوته فانهمر برد، واندلعت نار!"]]}, {"l": "Psa 50:3", "n": "", "vs": [[3, "يأتي إلهنا ولا يصمت، تحيط به النار الآكلة والعواصف الثائرة."]]}, {"l": "Psa 97:2", "n": "", "vs": [[2, "حوله الغيوم والضباب، والعدل والحق قاعدة عرشه."]]}, {"l": "Psa 97:3", "n": "", "vs": [[3, "تخرج منه نار وتحرق خصومه المحيطين به."]]}, {"l": "Psa 104:3", "n": "", "vs": [[3, "المقيم بيتك فوق المياه العليا، الجاعل من السحب مركبتك، السائر على أجنحة الريح،"]]}, {"l": "Psa 104:4", "n": "", "vs": [[4, "الصانع ملائكتك رياحا وخدامك لهيب نار."]]}, {"l": "Isa 19:1", "n": "", "vs": [[1, "نبوءة بشأن مصر: ها هو الرب قادم إلى مصر يركب سحابة سريعة، فترتجف أوثان مصر في حضرته، وتذوب قلوب المصريين في داخلهم."]]}, {"l": "Nah 1:3-6", "n": "", "vs": [[3, "الرب بطيء في غضبه وعظيم العزة، إنما لا يبريء الخاطي yed in the four corners of the world; and they had the likeness of a man, to signify that they were intelligent and rational creatures. Eze_1:10,Eze_1:15, Eze_10:10,Eze_10:14, Eze_10:21, Eze_10:22; Rev_4:7, Rev_4:8", "refs": [{"l": "Eze 1:10", "n": "", "vs": [[10, "أما أشكال أوجهها، فكان لكل واحد منها وجه إنسان، يحاذيه إلى اليمين وجه أسد، وإلى الشمال وجه ثور، ثم إلى جواره وجه نسر."]]}, {"l": "Eze 1:15", "n": "", "vs": [[15, "وفيما كنت أتأمل في الكائنات الحية، إذا بي أشاهد أربع عجلات، عجلة لكل واحد من الكائنات الحية."]]}, {"l": "Eze 10:10", "n": "", "vs": [[10, "وكانت الأربع متماثلة الشكل وكأنما كل عجلة في وسط عجلة."]]}, {"l": "Eze 10:14", "n": "", "vs": [[14, "وكان لكل واحد أربعة أوجه: الوجه الأول وجه كروب، والوجه الثاني وجه إنسان والوجه الثالث وجه أسد، والوجه الرابع وجه نسر."]]}, {"l": "Eze 10:21", "n": "", "vs": [[21, "وكان لكل واحد أربعة أوجه وأربعة أجنحة، وتحت أجنحتهم أيد مماثلة لأيدي البشر."]]}, {"l": "Eze 10:22", "n": "", "vs": [[22, "أما أشكال وجوههم فكانت نفس الوجوه التي رأيتها عند نهر خابور، لا تختلف عنها في صورها ومعالمها، وكل واحد يتحرك إلى الأمام حسب اتجاهه."]]}, {"l": "Rev 4:7", "n": "", "vs": [[7, "الكائن الأول يشبه الأسد، والثاني يشبه العجل، والثالث له وجه مثل وجه إنسان. أما الكائن الرابع فيشبه النسر الطائر."]]}, {"l": "Rev 4:8", "n": "", "vs": [[8, "وكان لكل كائن منها ستة أجنحة، تكسوها عيون من الداخل ومن الخارج. وهذه الكائنات الحية الأربعة تهتف ليلا ونهارا دون انقطاع قائلة: «قدوس قدوس قدوس، الرب الإله القادر على كل شيء، الذي كان والكائن والذي سيأتي»."]]}], "kwAr": "وكان لكل واحد منها أربعة أوجه", "noteAr": "ربما كانت هذه الكائنات الحية تمثيلات رمزية للملائكة القديسين، خدام ملك المجد ووزراء عنايته. وكانت أربعة، على ما يبدو للدلالة على أنها مرسلة في أركان العالم الأربعة؛ ولها شبه إنسان للدلالة على أنها مخلوقات عاقلة ناطقة. انظر حز 1: 10، 15؛ 10: 10، 14، 21، 22؛ رؤ 4: 7، 8"}, {"kw": "every one had four wings", "raw": "Eze_1:8-11; Exo_25:20; 1Ki_6:24-27; Isa_6:2", "note": "", "refs": [{"l": "Eze 1:8-11", "n": "", "vs": [[8, "وتحت أجنحتها القائمة على جوان kwAr": "أربع عجلات", "noteAr": ""}], "arS": [["وفيما كنت ", []], ["أتأمل", ["H7200"]], [" في ", []], ["الكائنات", ["H2416"]], [" الحية، إذا بي ", []], ["أشاهد", ["H2009"]], [" ", []], ["أربع", ["H702"]], [" ", []], ["عجلات", ["H212"]], ["، ", []], ["عجلة", ["H259", "H212"]], [" ", []], ["لكل", ["H259"]], [" واحد من ", []], ["الكائنات", ["H2416"]], [" الحية.", []]]}, {"c": 1, "v": 16, "text": "أما شكل العجلات وصنعتها فكان كمثل الزبرجد، وهي متشابهة الصورة. وكان منظرها وصنعتها كأنها عجلة داخل عجلة.", "groups": [{"kw": "the colour", "raw": "Eze_10:9; Exo_39:13; Dan_10:6", "note": "", "refs": [{"l": "Eze 10:9", "n": "", "vs": [[9, "ونظرت وإذا بأربع عجلات إزاء الكروبيم؛ كل عجلة بجوار كروب. وكان منظر العجلات كمنظر حجر الزبرجد."]]}, {"l": "Exo 39:13", "n": "", "vs": [[13, "والصف الرابع زبرجد وجزع ويشب. وكانت كلها محاطة بأطواق من ذهب في ترصيعها."]]}, {"l": "Dan 10:6", "n": "", "vs": [[6, "وجسمه كالزبرجد، ووجهه يتألق كالبرق وعيناه تتوهجان كمصباحي نار، وذراعاه ورجلاه لامعة كالنحاس المصقول، وأصداء كلماته كجلبة جمهور."]]}], "kwAr": "كمثل الزبرجد", "noteAr": ""}, {"kw": "a wheel", "raw": "Eze_10:10; Job_9:10; Psa_36:6, Psa_40:5; Rom_11:33; Eph_3:10", "note": "", "refs": [{"l": "Eze 10:10", "n": "", "vs": [[10, "وكانت الأربع متماثلة الشكل وكأنما كل عجلة في وسط عجلة."]]}, {"l": "Job 9:10", "n": "", "vs": [[10, "صانع عظائم لا تستقصى وعجائب لا تحصى."]]}, {"l": "Psa 36:6", "n": "", "vs": [[6, "عدلك ثابت مثل الجبال الشامخة، وأحكامك كالغور السحيق. وأنت يارب تحفظ الناس والبهائم جميعا."]]}, {"l": "Psa 40:5", "n": "", "vs": [[5, "أيها الرب إلهي، ما أكثر أعمالك العجيبة. إن تحدثت عن خططك الرائعة لنا فلن أقدر أن أحصيها. زادت عن أن تعد."]]}, {"l": "Rom 11:33", "n": "", "vs": [[33, "فما أعمق غنى الله وحكمته وعلمه! ما أبعد أحكامه عن الفحص وطرقه عن التتبع !"]]}, {"l": "Eph 3:10", "n": "", "vs": [[10, "والغاية أن يتجلى الآن أمام الرئاسات والسلطات في الأماكن السماوية ما يظهر في الكنيسة من حكمة الله المتعددة الوجوه،"]]}], "kwAr": "عجلة داخل عجلة", "noteAr": ""}], "arS": [["أما ", []], ["شكل", ["H4758"]], [" ", []], ["العجلات", ["H212"]], [" ", []], ["وصنعتها", ["H4639"]], [" فكان ", []], ["كمثل", ["H5869"]], [" ", []], ["الزبرجد", ["H8658"]], ["، وهي ", []], ["متشابهة", ["H259"]], [" ", []], ["الصورة", ["H1823"]], [". وكان ", []], ["منظرها", ["H4758"]], [" ", []], ["وصنعتها", ["H4639"]], [" كأنها ", []], ["عجلة", ["H212"]], [" ", []], ["داخل", ["H8432"]], [" ", []], ["عجلة", ["H212"]], [".", []]]}, {"c": 1, "v": 17, "text": "وإذا سارت فإنها تسير في أي من الاتجاهات الأربعة إلى الأمام، من غير أن تتحول عن اتجاهها.", "groups": [{"kw": "and", "raw": "Eze_1:9, Eze_1:12, 10:1-11:25; Isa_55:11", "note": "", "refs": [{"l": "Eze 1:9", "n": "", "vs": [[9, "وكانت أجنحتها تتلامس، وأوجهها لا تدور عند سيرها، بل يسير كل منها ووجهه متجه إلى الأمام."]]}, {"l": "Eze 1:12", "n": "", "vs": [[12, "وكان كل واحد منها يتجه إلى الأمام من غير أن يدور، فحيثما يتوجه الروح يتوجهون هم أيضا."]]}, {"l": "Eze 10:1-11:25", "n": "", "vs": [[1, "ثم نظرت وإذا على أديم المقبب الذي فوق رأس الكروبيم ما يشبه العرش، وكأنه من حجر العقيق الأزرق."], [2, "وقال للرجل المرتدي الكتان: «ادخل بين العجلات تحت الكروب واملأ كفيك جمر نار من بين الكروبيم، وذر على المدينة». فدخل على مرأى مني."], [3, "وكان الكروبيم واقفين عن يمين البيت حين دخل بين العجلات، فملأت السحابة الفناء الداخلي."], [4, "ثم ارتفع مجد الرب عن الكروب واستقر على عتبة الهيكل، فامتلأ الهيكل من السحابة، وغمر الفناء لمعان من مجد الرب."], [5, "وبلغ صوت أجنحة الكروبيم الفناء الخارجي كصوت الله القدير إذا تكلم."], [6, "فلما أمر الرجل المرتدي الكتان أن يأخذ نارا من بين العجلات من بين الكروبيم دخل الرجل ووقف إزاء العجلة."], [7, "فمد كروب من بين الكروبيم يده إلى النار التي كانت بين الكروبيم، وتناول منها جمرا، ووضعه في كفي المرتدي الكتان، فأخذها هذا وخرج."], [8, "وبدا أن للكروبيم تحت أجنحتهم يدا تشبه يد البشر."], [9, "ونظرت وإذا بأربع عجلات إزاء الكروبيم؛ كل عجلة بجوار كروب. وكان منظر العجلات كمنظر حجر الزبرجد."], [10, "وكانت الأربع متماثلة الشكل وكأنما كل عجلة في وسط عجلة."], [11, "وإذا تحركت لتسير فإنها كانت تتجه في سيرها في أي اتجاه من الاتجاهات الأربعة، وفقا لاتجاه الرأس، فتسير خلفه ولا تحيد عن طريقها."], [12, "وكانت جوانب أجسام الكائنات وظهورها وأيديها وأجنحتها والعجلات التي تخصها ملأى بالعيون."], [13, "ودعيت العجلات على مسمعي بالعجلات."], [14, "وكان لكل واحد أربعة أوجه: الوجه الأول وجه كروب، والوجه الثاني وجه إنسان والوجه الثالث وجه أسد، والوجه الرابع وجه نسر."], [15, "ثم ارتفع الكروبيم، فكانت هذه هي الكائنات التي شاهدتها بجوار نهر خابور."], [16, "وعندما تحرك الكروبيم تحركت العجلات بجوارهم، وعندما فرد الكروبيم أجنحتهم ليحلقوا فوق الأرض، حلقت العجلات إلى جوارهم بنفس الاتجاه، ولم تحد عنهم."], [17, "فإن توقفوا توقفت، وإن حلقوا تحلق معهم، لأن روح الكائنات الحية كان فيها أيضا."], [18, "وفارق مجد الرب عتبة الهيكل وخيم فوق الكروبيم."], [19, "وعندما ارتفع الكروبيم فردوا أجنحتهم وحلقوا فوق الأرض على مرأى مني، وحلقت العجلات معهم، ثم توقفوا عند مدخل بوابة بيت الرب الشرقي، ومجد الرب ما برح مخيما عليهم."], [20, "هذه هي الكائنات الحية التي شاهدتها تحت إله إسرائيل عند نهر خابور. فعرفت أنهم الكروبيم."], [21, "وكان لكل واحد أربعة أوجه وأربعة أجنحة، وتحت أجنحتهم أيد مماثلة لأيدي البشر."], [22, "أما أشكال وجوههم فكانت نفس الوجوه التي رأيتها عند نهر خابور، لا تختلف عنها في صورها ومعالمها، وكل واحد يتحرك إلى الأمام حسب اتجاهه."], [1, "ثم حلق بي الروح وأحضرني إلى بوابة بيت الرب الشرقية، فإذا عند مدخلها خمسة وعشرون رجلا، شاهدت في وسطهم يازنيا بن عزور وفلطيا بن بنايا رئيسي الشعب."], [2, "فقال لي: «ياابن آدم، هؤلاء هم الرجال المتواطئون على الشر، المتآمرون بمشورة السوء في هذه المدينة،"], [3, "القائلون: ألم يحن الوقت لنبني حصونا؟ فهذه المدينة هي كالقدر (أي كسور حولنا) ونحن كاللحم. (أي كالمحتمين بالسور)."], [4, "لذلك تنبأ عليهم ياابن آدم، تنبأ!"], [5, "«واستقر علي روح الرب وقال: «هذا ما يعلنه الرب. هذا ما تحدثتم به ياشعب إسرائيل، ولكنني عالم بما يدور في خلدكم."], [6, "لقد أكثرتم قتلاكم في هذه المدينة وملأتم منهم شوارعها."], [7, "لذلك فإن قتلاكم الذين طرحتموهم في وسطها هم اللحم وهي القدر، وسأخرجكم منها."], [8, "قد فزعتم من السيف، لذلك أجلب السيف عليكم، يقول الرب."], [9, "وأخرجكم من وسط المدينة وأسلمكم إلى قبضة أعدائكم، وأنفذ فيكم أحكاما،"], [10, "فتقتلون بالسيف. وأنفذ قضاء فيكم في تخوم إسرائيل، فتدركون حينئذ أني أنا الرب."], [11, "لن تكون هذه المدينة لكم قدرا، وأنتم لن تكونوا اللحم في وسطها. بل أنفذ قضائي في تخوم إسرائيل،"], [12, "فتدركون أني أنا الرب الذي لم تسلكوا في فرائضه، ولم تمارسوا أحكامه بل عملتم بمقتضى ممارسات الأمم المحيطة بكم»."], [13, "وحدث فيما كنت أتنبأ أن فلطيا بن بنايا مات، فانطرحت على وجهي وصرخت بصوت عظيم: «آه أيها السيد الرب أتبيد بقية إسرائيل؟»"], [14, "ثم أوحى الرب إلي بكلمته قائلا:"], [15, "«ياابن آدم، قل لإخوتك، وأقربائك وسائر شعب إسرائيل في الشتات معك، الذين قال لهم أهل أورشليم: ابتعدوا عن الرب إذ لنا قد وهبت هذه الأرض ميراثا."], [16, "ولكن إن كنت قد فرقتهم بين الأمم وشتتهم بين البلاد، فإني أكون لهم مقدسا صغيرا في الأرض التي تبددوا فيها."], [17, "لذلك قل لهم: سأجمعكم من بين الشعوب وأحشدكم من الأراضي التي شتتكم فيها وأهبكم أرض إسرائيل."], [18, "وعندما يقبلون إليها ينتزعون منها جميع أوثانها الممقوتة ورجاساتها،"], [19, "وأعطيهم جميعا قلبا واحدا، وأجعل في داخلهم روحا جديدا، وأزيل قلب الحجر من لحمهم. وأستبدله بقلب من لحم،"], [20, "لكي يسلكوا في فرائضي ويطيعوا أحكامي ويمارسوها، ويكونوا لي شعبا وأنا أكون لهم إلها."], [21, "أما الذين ضلت قلوبهم وراء أوثانهم ورجاستهم، فإني أجعلهم يلقون عقاب طرقهم، يقول السيد الرب»."], [22, "ثم فرد الكروبيم أجنحتهم وحلقوا مع العجلات ومع مجد الرب الذي ما برح مخيما عليهم من فوق."], [23, "وارتفع مجد الرب عن وسط المدينة ووقف على الجبل شرقي المدينة."], [24, "وحل الروح وأحضرني، في الرؤيا التي أعلنها لي روح الله، إلى أرض الجلاء في بلاد الكلدانيين، ثم ارتفعت عني الرؤيا التي شاهدتها،"], [25, "فأبلغت أهل السبي بجميع الوحي الذي أعلنه لي الرب."]]}, {"l": "Isa 55:11", "n": "", "vs": [[11, "هكذا تكون كلمتي التي تصدر عني مثمرة دائما، وتحقق ما أرغب فيه وتفلح بما أعهد به إليها."]]}], "kwAr": "وإذا سارت", "noteAr": ""}], "arS": [["وإذا ", []], ["سارت", ["H1980"]], [" فإنها ", []], ["تسير", ["H1980"]], [" في أي من ", []], ["الاتجاهات", ["H5921"]], [" ", []], ["الأربعة", ["H702"]], [" إلى الأمام، من غير أن ", []], ["تتحول", ["H5437"]], [" عن اتجاهها.", []]]}, {"c": 1, "v": 18, X and Vulgate. It is a very large class of silicious minerals, hard, pellucid, naturally colourless, of regularly angular figures, and of simple plates; not flexible, nor elastic, but giving fire with steel; not fermenting by acid menstrua, but calcinable in a strong fire. There are three orders of pure crystal. The first is perfect columnar crystals, with double pyramids, of eighteen planes, in an hexangular pyramid at each end; the second is that of perfect crystals, without a column, of twelve or sixteen planes, in two hexangular pyramids; and the third is that of imperfect crystals, with single pyramids, of ten or twelve planes, in an hexangular or pentangular column. Terrible crystal seems to denote that which was well cut and polished, vividly refracting the rays of light.", "note": "The Hebrew kerach which generally denotes ice, doubtless here signifies crystal (κρυσταλλος, from κρυος, cold, ice, and στελλομαι, to concrete), as it is rendered by the LXX and Vulgate. It is a very large class of silicious minerals, hard, pellucid, naturally colourless, of regularly angular figures, and of simple plates; not flexible, nor elastic, but giving fire with steel; not fermenting by acid menstrua, but calcinable in a strong fire. There are three orders of pure crystal. The first is perfect columnar crystals, with double pyramids, of eighteen planes, in an hexangular pyramid at each end; the second is that of perfect crystals, without a column, of twelve or sixteen planes, in two hexangular pyramids; and the third is that of imperfect crystals, with single pyramids, of ten or twelve planes, in an hexangular or pentangular column. Terrible crystal seems to denote that which was well cut and polished, vividly refracting the rays of light.", "refs": [], "kwAr": "البلور المتلأليء الهائل", "noteAr": "الكلمة العبرية «قرح» تدل عادة على الجليد، وهي هنا بلا شك تعني البلور (κρυσταλλος، من κρυος أي بارد أو جليد)، كما ترجمتها السبعينية والفولغاتا. وهو صنف كبير من المعادن السيليسية، صلبة وشفافة وعديمة اللون بطبيعتها، منتظمة الزوايا، لا تلين ولا تتمطط، وتقدح النار مع الفولاذ. وللبلور النقي ثلاث مراتب: الأولى البلورات العمودية الكاملة ذات الهرمين المزدوجين، والثانية البلورات الكاملة بلا عمود ذات هرمين سداسيين، والثالثة البلورات الناقصة ذات الهرم الواحد. وتعبير «الهائل» يدل على ما قُطع وصُقل جيدا فصار يكسر أشعة النور بقوة."}], "arS": [["وانبسط", ["H5186"]], [" ", []], ["فوق", ["H5921"]], [" ", []], ["رؤوس", ["H7218"]], [" ", []], ["الكائنات", ["H2416"]], [" الحية ", []], ["جلد", ["H7549"]], [" ", []], ["يشبه", ["H1823"]], [" ", []], ["البلور", ["H7140"]], [" ", []], ["المتلأليء", ["H5869"]], [" ", []], ["الهائل", ["H3372"]], [".", []]]}, {"c": 1, "v": 23, "text": "وامتدت أجنحتها تحت الجلد باستقامة، الواحد نحو الآخر. لكل واحد منها جناحان يستران جسمه من الجانبين.", "groups": [{"kw": "their wings", "raw": "Eze_1:12, Eze_1:24", "note": "", "refs": [{"l": "Eze 1:12", "n": "", "vs": [[12, "وكان كل واحد منها يتجه إلى الأمام من غير أن يدور، فحيثما يتوجه الروح يتوجهون هم أيضا."]]}, {"l": "Eze 1:24", "n": "", "vs": [[24, "وعندما سارت سمعت رفرفة أجنحتها كهدير مياه غزيرة، كصوت القدير، كصوت جلبة جيش، وعند توقفها كانت ترخي أجنحتها."]]}], "kwAr": "أجنحتها", "noteAr": ""}, {"kw": "which", "raw": "Eze_1:11; Job_4:18; Psa_89:7; Luk_17:10", "note": "", "refs": [{"l": "Eze 1:11", "n": "", "vs": [[11, "كانت هذه أشكال أوجهها. وكان لكل منها أربعة أجنحة تمتد من وسط الظهر: اثنان يتصل طرف كل منهما بطرف جناح الكائن الآخر، واثنان يستران أجسامهما."]]}, {"l": "Job 4:18", "n": "", "vs": [[18, "ها إنه لا يأتمن عبيده، وإلى ملائكته ينسب حماقة،"]]}, {"l": "Psa 89:7", "n": "", "vs": [[7, "إنه إله مهوب جدا في محفل الملائكة القديسين، ومخوف كثيرا عند جميع المحيطين به."]]}, {"l": "Luk 17:10", "n": "", "vs": [[10, "هكذا أنتم أيضا، عندما تعملون كل ما تؤمرون به، قولوا: إنما نحن عبيد غير نافعين، قد عملنا ما كان واجبا علينا!»"]]}], "kwAr": "يستران", "noteAr": ""}], "arS": [["وامتدت", ["H3477"]], [" ", []], ["أجنحتها", ["H3671"]], [" ", []], ["تحت", ["H8478"]], [" ", []], ["الجلد", ["H7549"]
