[22, "الذي انطلق إلى السماء، وهو الآن جالس عن يمين الله؛ وقد جعلت الملائكة والسلطات والقوات (الروحية) خاضعة له!"]]}], "kwAr": "على رؤوسها", "noteAr": ""}, {"kw": "the likeness of a", "raw": "Psa_45:6; Isa_6:1; Dan_7:9, Dan_7:10,Dan_7:14; Zec_6:13; Mat_25:13; Heb_1:8, Heb_8:1; Heb_12:2; Rev_4:2, Rev_4:3, Rev_5:13, Rev_20:11", "note": "", "refs": [{"l": "Psa 45:6", "n": "", "vs": [[6, "عرشك ياالله إلى دهر الدهور، وصولجان ملكك عادل ومستقيم."]]}, {"l": "Isa 6:1", "n": "", "vs": [[1, "وفي سنة وفاة الملك عزيا، شاهدت السيد جالسا على عرش مرتفع سام، وقد امتلأ الهيكل من أهدابه،"]]}, {"l": "Dan 7:9", "n": "", "vs": [[9, "وفيما كنت أنظر، نصبت عروش واعتلى الأزلي كرسيه وكانت ثيابه بيضاء كالثلج، وشعر رأسه كالصوف النقي، وعرشه لهيبا متوهجا وعجلاته نارا متقدة."]]}, {"l": "Dan 7:10", "n": "", "vs": [[10, "ومن أمامه يتدفق ويجري نهر من نار، وتخدمه ألوف ألوف الملائكة، ويمثل في حضرته عشرات الألوف. فانعقد مجلس القضاء وفتحت الأسفار."]]}, {"l": "Dan 7:14", "n": "", "vs": [[14, "فأنعم عليه بسلطان ومجد وملكوت لتتعبد له كل الشعوب والأمم من كل لسان. سلطانه سلطان أبدي لا يفنى، وملكه لا ينقرض."]]}, {"l": "Zec 6:13", "n": "", "vs": [[13, "هو الذي يبني هيكل الرب ويتجلل بالمجد ويكون نفسه ملكا وكاهنا في آن واحد فيجلس ويحكم على عرشه ويعمل بفضل مشورة رتبتيه على إشاعة السلام بين قومه."]]}, {"l": "Mat 25:13", "n": "", "vs": [[13, "فاسهروا إذن، لأنكم لا تعرفون اليوم ولا الساعة!"]]}, {"l": "Heb 1:8", "n": "", "vs": [[8, "ولكنه يخاطب الابن قائلا: «إن عرشك، ياالله، ثابت إلى أبد الآبدين، وصولجان حكمك عادل ومستقيم."]]}, {"l": "Heb 8:1", "n": "", "vs": [[1, "وخلاصة القول في هذا الموضوع، أن المسيح هو رئيس كهنتنا الذي وصفنا كهنوته هنا. إنه الآن جالس في السماء عن يمين عرش الله العظيم."]]}, {"l": "Heb 12:2", "n": "", "vs": [[2, "متطلعين دائما إلى يسوع: رائد إيماننا ومكمله. فهو قد تحمل الموت صلبا، هازئا بما في ذلك من عار، إذ كان ينظر إلى السرور الذي ينتظره، ثم جلس عن يمين عرش الله."]]}, {"l": "Rev 4:2", "n": "", "vs": [[2, "وفي الحال صرت في الروح، فرأيت في السماء عرشا يجلس عليه واحد"]]}, {"l": "Rev 4:3", "n": "", "vs": [[3, "تنبعث منه أنوار كأنها صادرة من لمعان اليشب والعقيق الأحمر. وحول العرش قوس قزح يلمع كأنه الزمرد."]]}, {"l": "Rev 5:13", "n": "", "vs": [[13, "ثم سمعت كل خليقة في السماء وعلى الأرض، وتحت الأرض، وعلى البحر، هاتفة مع كل ما فيها: «البركة والإجلال والمجد والسلطة للجالس على العرش وللحمل، إلى أبد الآبدين»."]]}, {"l": "Rev 20:11", "n": "", "vs": [[11, "ثم رأيت عرشا عظيما أبيض هربت السماء والأرض من أمام الجالس عليه، فلم يبق لهما مكان."]]}], "kwAr": "شبه عرش", "noteAr": ""}, {"kw": "as the", "raw": "Exo_24:10; Isa_54:11", "note": "", "refs": [{"l": "Exo 24:10", "n": "", "vs": [[10, "ورأوا إله إسرائيل، وتحت قدميه أرضية كأنها مصنوعة من الياقوت الأزرق الشفاف تماثل السماء في النقاء،"]]}, {"l": "Isa 54:11", "n": "", "vs": [[11, "أيتها المنكوبة وغير المتعزية، التي اقتلعتها العاصفة، ها أنا أبني بالأثمد حجارتك، وأرسي أساساتك بالياقوت الأزرق،"]]}], "kwAr": "منظره كحجر اللازورد", "noteAr": ""}, {"kw": "the appearance of a man", "raw": "Gen_32:24-30; Jos_5:13-15, Jos_6:1, Jos_6:2; Isa_9:6, Isa_9:7; Jer_23:5, Jer_23:6; Dan_10:18; Rev_1:13, Rev_3:21, Rev_14:14", "note": "", "refs": [{"l": "Gen 32:24-30", "n": "", "vs": [[24, "وبقي وحده، صارعه إنسان حتى مطلع الفجر."], [25, "وعندما رأى أنه لم يتغلب على يعقوب، ضربه على حق فخذه، فانخلع مفصل فخذ يعقوب في مصارعته معه."], [26, "وقال له: «أطلقني، فقد طلع الفجر». فأجابه يعقوب: «لا أطلقك حتى تباركني»."], [27, "فسأله: «ما اسمك؟» فأجاب: «يعقوب»."], [28, "فقال: «لا يدعى اسمك في ما بعد يعقوب، بل إسرائيل (ومعناه: يجاهد مع الله)، لأنك جاهدت مع الله والناس وقدرت»."], [29, "فسأله يعقوب: «أخبرني ما اسمك؟» فقال: «لماذا تسأل عن اسمي؟» وباركه هناك."], [30, "ودعا يعقوب اسم المكان فنيئيل (ومعناه: وجه الله) إذ قال: «لأني شاهدت الله وجها لوجه وبقيت حيا»."]]}, {"l": "Jos 5:13-15", "n": "", "vs": [[13, "وفيما كان يشوع قريبا من أريحا تطلع أمامه وإذا به يشاهد رجلا ينتصب في مواجهته، شاهرا سيفه بيده، فاتجه إليه يشوع وسأله: «هل أنت منا أو من أعدائنا؟»"], [14, "فأجابه: «لا، إنما أنا رئيس جند الرب، وقد أقبلت الآن». فأكب يشوع على وجهه إلى الأرض ساجدا وقال: «أي رسالة يحملها سيدي إلى عبده؟»"], [15, "فقال رئيس جند الرب ليشوع: «اخلع نعليك، لأن الموضع الذي أنت واقف عليه مقدس». فنفذ يشوع الأمر."]]}, {"l": "Jos 6:1", "n": "", "vs": [[1, "وكانت أريحا قد أحكمت إغلاق بواباتها خوفا من الإسرائيليين، فلم يكن يخرج منها أو يدخل إليها أحد."]]}, {"l": "Jos 6:2", "n": "", "vs": [[2, "فقال الرب ليشوع: «ها أنا قد أخضعت لك أريحا وملكها ومحاربيها الأشداء."]]}, {"l": "Isa 9:6", "n": "", "vs": [[6, "لأنه يولد لنا ولد ويعطى لنا ابن يحمل الرياسة على كتفه، ويدعى اسمه عجيبا، مشيرا، إلها قديرا، أبا أبديا، رئيس السلام."]]}, {"l": "Isa 9:7", "n": "", "vs": [[7, "ولا تكون نهاية لنمو رياسته وللسلام اللذين يسودان عرش داود ومملكته، ليثبتها ويعضدها بالحق والبر، من الآن وإلى الأبد. إن غيرة الرب القدير تتمم هذا."]]}, {"l": "Jer 23:5", "n": "", "vs": [[5, "ها أيام مقبلة أقيم فيها لداود ذرية بر، ملكا يسود بحكمة، ويجري في الأرض عدلا وحقا."]]}, {"l": "Jer 23:6", "n": "", "vs": [[6, "في عهده يتم خلاص شعب يهوذا، ويسكن شعب إسرائيل آمنا. أما الاسم الذي سيدعى به فهو: الرب برنا."]]}, {"l": "Dan 10:18", "n": "", "vs": [[18, "فعاد من هو في شبه إنسان ولمسني وشددني،"]]}, {"l": "Rev 1:13", "n": "", "vs": [[13, "وعندما التفت نحو الصوت، رأيت كائنا يشبه ابن الإنسان، يقف وسط سبع منائر من ذهب، ويرتدي ثوبا طويلا إلى الرجلين، يلف صدره حزام من ذهب."]]}, {"l": "Rev 3:21", "n": "", "vs": [[21, "وكل من ينتصر سأجلسه معي على عرشي، كما انتصرت أنا أيضا فجلست مع أبي على عرشه؛"]]}, {"l": "Rev 14:14", "n": "", "vs": [[14, "ثم نظرت، فرأيت سحابة بيضاء، يجلس عليها كائن يشبه ابن الإنسان، على رأسه إكليل من ذهب، وفي يده منجل حاد."]]}], "kwAr": "كشبه إنسان", "noteAr": ""}], "arS": [["وانتصب ", []], ["فوق", ["H4480", "H4605"]], [" ", []], ["الجلد", ["H7549"]], [" المنبسط على ", []], ["رؤوسها", ["H5921", "H7218"]], [" ", []], ["شبه", ["H1823"]], [" ", []], ["عرش", ["H3678"]], ["، ", []], ["منظره", ["H4758"]], [" ", []], ["كحجر", ["H68"]], [" ", []], ["اللازورد", ["H5601"]], [". ويجلس على ", []], ["شبه", ["H1823"]], [" ", []], ["العرش", ["H3678"]], [" ", []], ["من", ["H4480"]], [" ", []], ["فوق", ["H4605"]], [" من هو ", []], ["كشبه", ["H4758"]], [" ", []], ["إنسان", ["H120"]], [".", []]]}, {"c": 1, "v": 27, "text": "ورأيت ما يبدو من حقويه فما فوق وكأنه نحاس لامع يتوهج في داخله وحواليه. أما ما يبدو من حقويه وما تحت، فكأنه نار، وحواليها يشع بالضياء.", "groups": [{"kw": "as the colour", "raw": "Eze_1:4, Eze_8:2", "note": "", "refs": [{"l": "Eze 1:4", "n": "", "vs": [[4, "فأبصرت ريحا عاصفة تهب من الشمال مصحوبة بسحابة هائلة، ونار متواصلة متوهجة بهالة محيطة من الضياء؛ ومن وسطها يتألق مثل النحاس اللامع البارق من وسط النار."]]}, {"l": "Eze 8:2", "n": "", "vs": [[2, "فنظرت وإذا بشبه إنسان وكأنه من نار، وبدا وكأن نارا تتأجج من حقويه إلى أسفل. أما من حقويه فما فوق فبدا لمعان كلمعان النحاس المتألق."]]}], "kwAr": "كأنه نحاس لامع", "noteAr": ""}, {"kw": "the appearance of fire", "raw": "Deu_4:24; Psa_50:3, Psa_97:2; 2Th_1:8; Heb_12:29; Rev_1:14-16", "note": "", "refs": [{"l": "Deu 4:24", "n": "", "vs": [[24, "لأن الرب إلهكم هو نار آكلة وإله غيور."]]}, {"l": "Psa 50:3", "n": "", "vs": [[3, "يأتي إلهنا ولا يصمت، تحيط به النار الآكلة والعواصف الثائرة."]]}, {"l": "Psa 97:2", "n": "", "vs": [[2, "حوله الغيوم والضباب، والعدل والحق قاعدة عرشه."]]}, {"l": "2Th 1:8", "n": "", "vs": [[8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."]]}, {"l": "Heb 12:29", "n": "", "vs": [[29, "متذكرين أن «إلهنا نار آكلة!»"]]}, {"l": "Rev 1:14-16", "n": "", "vs": [[14, "شعر رأسه ناصع البياض كالصوف أو الثلج، وعيناه كشعلة ملتهبة."], [15, "رجلاه تلمعان كأنهما نحاس نقي مصقول بالنار، وصوته يدوي كصوت شلال غزير،"], [16, "ووجهه يتوهج بالنور كشمس الظهيرة. وكان في يده اليمنى سبعة نجوم، ومن فمه يخرج سيف قاطع ذو حدين."]]}], "kwAr": "فكأنه نار", "noteAr": ""}], "arS": [["ورأيت", ["H7200"]], [" ما يبدو من ", []], ["حقويه", ["H4975"]], [" فما ", []], ["فوق", ["H4605"]], [" ", []], ["وكأنه", ["H5869"]], [" ", []], ["نحاس", ["H2830"]], [" لامع ", []], ["يتوهج", ["H4758"]], [" في ", []], ["داخله", ["H1004"]], [" ", []], ["وحواليه", ["H5439"]], [". أما ما يبدو من ", []], ["حقويه", ["H4975"]], [" وما ", []], ["تحت", ["H4295"]], ["، ", []], ["فكأنه", ["H7200"]], [" ", []], ["نار", ["H784"]], ["، ", []], ["وحواليها", ["H5439"]], [" يشع ", []], ["بالضياء", ["H5051"]], [".", []]]}, {"c": 1, "v": 28, "text": "وكان منظر اللمعان المحيط به كمنظر قوس قزح في يوم مطير؛ هكذا كان منظر شبه مجد الرب. وعندما أبصرت خررت على وجهي وسمعت صوتا يتكلم.", "groups": [{"kw": "at the appearance of the bow", "raw": "Gen_9:13-16; Isa_54:8-10; Rev_4:3, Rev_10:1", "note": "", "refs": [{"l": "Gen 9:13-16", "n": "", "vs": [[13, "أضع قوسي في السحاب فتكون علامة ميثاق بيني وبين الأرض."], [14, "فيكون عندما أخيم بالسحاب فوق الأرض، وتظهر القوس،"], [15, "أني أذكر ميثاقي الذي بيني وبينكم وبين كل المخلوقات الحية من ذوات الجسد، فلا تتحول المياه إلى طوفان يبيد كل حياة."], [16, "وتكون القوس في السحاب، فأبصرها، وأذكر الميثاق الأبدي المبرم بيني وبين جميع المخلوقات الحية على الأرض»."]]}, {"l": "Isa 54:8-10", "n": "", "vs": [[8, "في لحظة غضب جامح حجبت وجهي عنك، ولكني بحب أبدي أرحمك، يقول الرب فاديك."], [9, "لأن هذا الأمر نظير أيام نوح، حين أقسمت أن لا تعود مياه طوفان تفيض على الأرض، كذلك أقسمت أن لا أغضب عليك أو أزجرك."], [10, "إن الجبال تزول والتلال تتزحزح، أما رحمتي الثابتة فلا تفارقك، وعهد سلامي لا يتزعزع، يقول الرب راحمك."]]}, {"l": "Rev 4:3", "n": "", "vs": [[3, "تنبعث منه أنوار كأنها صادرة من لمعان اليشب والعقيق الأحمر. وحول العرش قوس قزح يلمع كأنه الزمرد."]]}, {"l": "Rev 10:1", "n": "", "vs": [[1, "ثم رأيت ملاكا آخر قويا نازلا من السماء، لابسا سحابة، وعلى رأسه قوس قزح؛ وجهه كالشمس، ورجلاه كعمودين من نار،"]]}], "kwAr": "كمنظر قوس قزح", "noteAr": ""}, {"kw": "This", "raw": "Eze_8:4, Eze_10:19, Eze_10:20, Eze_43:3; Exo_16:7, Exo_16:10, Exo_24:16, Exo_33:18-23; Num_12:6-8; 1Ki_8:10,1Ki_8:11; 1Co_13:12", "note": "", "refs": [{"l": "Eze 8:4", "n": "", "vs": [[4, "فإذا بمجد إله إسرائيل حال هناك كما كان حالا في الرؤيا التي شاهدتها في السهل."]]}, {"l": "Eze 10:19", "n": "", "vs": [[19, "وعندما ارتفع الكروبيم فردوا أجنحتهم وحلقوا فوق الأرض على مرأى مني، وحلقت العجلات معهم، ثم توقفوا عند مدخل بوابة بيت الرب الشرقي، ومجد الرب ما برح مخيما عليهم."]]}, {"l": "Eze 10:20", "n": "", "vs": [[20, "هذه هي الكائنات الحية التي شاهدتها تحت إله إسرائيل عند نهر خابور. فعرفت أنهم الكروبيم."]]}, {"l": "Eze 43:3", "n": "", "vs": [[3, "وكانت الرؤيا التي شاهدتها مماثلة للرؤيا التي تجلت لي عندما جاء الرب لتدمير المدينة، وكالرؤى التي شاهدتها عند نهر خابور. فانطرحت على وجهي،"]]}, {"l": "Exo 16:7", "n": "", "vs": [[7, "وفي الصباح تعاينون مجد الرب، لأنه قد سمع تذمركم عليه، ولكن من نحن حتى تتذمروا علينا؟»"]]}, {"l": "Exo 16:10", "n": "", "vs": [[10, "وفيما كان هرون يخاطب كل جماعة بني إسرائيل، التفتوا نحو الصحراء وإذا بمجد الرب قد تجلى في السحاب."]]}, {"l": "Exo 24:16", "n": "", "vs": [[16, "وحل مجد الرب على جبل سيناء، وغطاه السحاب ستة أيام. وفي اليوم السابع دعا الرب موسى من وسط السحاب."]]}, {"l": "Exo 33:18-23", "n": "", "vs": [[18, "وقال موسى: «أرني مجدك»."], [19, "فقال الرب: «أجيز إحساناتي أمامك، وأذيع اسمي (الرب) أمامك. أغدق رأفتي على من أشاء ورحمتي على من أريد»،"], [20, "وأضاف:«ولكنك لن ترى وجهي، لأن الإنسان الذي يراني لا يعيش»."], [21, "ثم قال الرب: «لدي مكان قريب مني. فقف على الصخرة،"], [22, "وعندما يعبر مجدي، أضعك في نقرة من الصخر، وأحجبك بيدي حتى أعبر،"], [23, "ثم أرفع يدي فتنظر ورائي، أما وجهي فيظل محجوبا عن العيان»."]]}, {"l": "Num 12:6-8", "n": "", "vs": [[6, "فقال: «اسمعا كلامي: إن كان بينكم نبي للرب فإني أستعلن له بالرؤيا، وأكلمه بالحلم،"], [7, "أما عبدي موسى فلست أعامله هكذا، بل هو أمين في بيتي،"], [8, "لذلك أكلمه وجها لوجه، وبوضوح من غير ألغاز، ويعاين صورة الرب. فلماذا جرؤتما على انتقاد عبدي موسى؟»"]]}, {"l": "1Ki 8:10", "n": "", "vs": [[10, "وما إن خرج الكهنة من قدس الأقداس حتى ملأ السحاب هيكل الرب،"]]}, {"l": "1Ki 8:11", "n": "", "vs": [[11, "فلم يستطع الكهنة القيام بالخدمة من جراء السحاب، لأن مجد الرب ملأ الهيكل."]]}, {"l": "1Co 13:12", "n": "", "vs": [[12, "ونحن الآن ننظر إلى الأمور من خلال زجاج قاتم فنراها بغموض. إلا أننا سنراها أخيرا مواجهة. الآن، أعرف معرفة جزئية. ولكني، عندئذ، سأعرف مثلما عرفت."]]}], "kwAr": "هكذا كان منظر", "noteAr": ""}, {"kw": "I fell", "raw": "Eze_3:23; Gen_17:3; Lev_9:24; Dan_8:17, Dan_10:7-9, Dan_10:16, Dan_10:17; Mat_17:5, Mat_17:6; Act_9:4; Rev_1:17, Rev_1:18", "note": "", "refs": [{"l": "Eze 3:23", "n": "", "vs": [[23, "فنهضت ومضيت إلى السهل، وهناك رأيت مجد الرب واقفا، مماثلا لمجد الرب الذي رأيته عند نهر خابور، فانطرحت على وجهي."]]}, {"l": "Gen 17:3", "n": "", "vs": [[3, "فسقط أبرام على وجهه، فخاطبه الله قائلا:"]]}, {"l": "Lev 9:24", "n": "", "vs": [[24, "وخرجت نار من عند الرب أحرقت ذبيحة المحرقة والشحم الذي على المذبح. وعندما شهد الشعب هذا، هتفوا ساجدين بوجوه منحنية نحو الأرض."]]}, {"l": "Dan 8:17", "n": "", "vs": [[17, "فجاء إلي حيث وقفت، فتولاني الخوف وانطرحت على وجهي، فقال لي: «افهم ياابن آدم. إن الرؤيا تختص بوقت المنتهى»."]]}, {"l": "Dan 10:7-9", "n": "", "vs": [[7, "كنت وحدي أنا دانيآل الذي شاهدت الرؤيا، أما الرجال الذين كانوا معي فلم يروا شيئا. إنما هيمنت عليهم رعدة عظيمة، فهربوا مختبئين."], [8, "وبقيت أنا وحدي أشهد الرويا العظيمة، وقد تلاشت مني القوة، وتحولت نضارتي إلى ذبول، وفقدت قدرتي."], [9, "وما إن سمعت أصداء كلماته حتى سقطت على وجهي إلى الأرض يغشاني سبات عميق."]]}, {"l": "Dan 10:16", "n": "", "vs": [[16, "وإذا بشبه بني البشر لمس شفتي، ففتحت فمي وقلت للماثل أمامي: «ياسيدي، قد غلبني الأ لم بسبب الرؤيا، فما امتلكت قوة،"]]}, {"l": "Dan 10:17", "n": "", "vs": [[17, "فكيف يستطيع عبد سيدي هذا أن يتحدث مع سيدي، وقد نضبت مني القوة، ولم تبق في نسمة؟»"]]}, {"l": "Mat 17:5", "n": "", "vs": [[5, "وبينما كان يتكلم، إذا سحابة منيرة قد خيمت عليهم، وصوت من السحابة يهتف: «هذا هو ابني الحبيب الذي سررت به كل سرور. له اسمعوا!»"]]}, {"l": "Mat 17:6", "n": "", "vs": [[6, "فلما سمع التلاميذ الصوت، وقعوا على وجوههم مرتعبين جدا."]]}, {"l": "Act 9:4", "n": "", "vs": [[4, "فوقع إلى الأرض وسمع صوتا يقول له: «شاول! شاول! لماذا تضطهدني؟»"]]}, {"l": "Rev 1:17", "n": "", "vs": [[17, "فلما رأيته ارتميت عند قدميه كالميت، فلمسني بيده اليمنى وقال: «لا تخف! أنا الأول والآخر،"]]}, {"l": "Rev 1:18", "n": "", "vs": [[18, "أنا الحي. كنت ميتا، ولكن ها أنا حي إلى أبد الآبدين. ولي مفاتيح الموت والهاوية."]]}], "kwAr": "خررت على وجهي", "noteAr": ""}], "arS": [["وكان ", []], ["منظر", ["H4758"]], [" ", []], ["اللمعان", ["H5051"]], [" المحيط به ", []], ["كمنظر", ["H4758"]], [" ", []], ["قوس", ["H7198"]], [" ", []], ["قزح", ["H6051"]], [" في ", []], ["يوم", ["H3117"]], [" ", []], ["مطير", ["H1653"]], ["؛ ", []], ["هكذا", ["H3651"]], [" كان ", []], ["منظر", ["H4758"]], [" ", []], ["شبه", ["H1823"]], [" ", []], ["مجد", ["H3519"]], [" ", []], ["الرب", ["H3068"]], [". وعندما ", []], ["أبصرت", ["H7200"]], [" ", []], ["خررت", ["H5307"]], [" على ", []], ["وجهي", ["H6440"]], [" ", []], ["وسمعت", ["H8085"]], [" ", []], ["صوتا", ["H6963"]], [" ", []], ["يتكلم", ["H1696"]], [".", []]]}, {"c": 2, "v": 1, "text": "ثم قال لي: «ياابن آدم، قف على قدميك فأخاطبك».", "groups": [{"kw": "Son", "raw": "Eze_2:3, Eze_2:6, Eze_2:8, Eze_3:1, Eze_3:4, Eze_3:10,Eze_3:17, Eze_4:1, Eze_5:1, Eze_7:2, Eze_12:3, Eze_13:2, Eze_14:3, Eze_14:13, Eze_15:2, Eze_16:2; Eze_17:2, Eze_20:3, Eze_37:3; Psa_8:4; Dan_8:17; Mat_16:13-16; Joh_3:13, Joh_3:16", "note": "", "refs": [{"l": "Eze 2:3", "n": "", "vs": [[3, "«ياابن آدم، ها أنا باعثك إلى بني إسرائيل، إلى أمة متمردة عصتني، إذ تعدوا هم وآباؤهم علي إلى هذا اليوم."]]}, {"l": "Eze 2:6", "n": "", "vs": [[6, "أما أنت، ياابن آدم، فلا ترهبهم ولا تخش كلامهم، وإن كانوا لك قريسا وشوكا. وأنت ساكن بين عقارب، فلا ترهب كلامهم، ولا تفزع من محضرهم لأنهم شعب متمرد."]]}, {"l": "Eze 2:8", "n": "", "vs": [[8, "والآن ياابن آدم، أصغ لما أخاطبك به. لا تكن متمردا مثل ذلك الشعب المتمرد. افتح فمك وكل ما أطعمك»."]]}, {"l": "Eze 3:1", "n": "", "vs": [[1, "ثم قال لي: «ياابن آدم، كل ما تجده. كل هذا الدرج وامض وخاطب شعب إسرائيل»."]]}, {"l": "Eze 3:4", "n": "", "vs": [[4, "ثم قال لي: «ياابن آدم، انطلق إلى شعب إسرائيل وخاطبهم بكلماتي."]]}, {"l": "Eze 3:10", "n": "", "vs": [[10, "ثم أردف قائلا: «ياابن آدم، استوعب في قلبك كل ما أحدثك به من كلام، واستمع إليه بأذنين مرهفتين."]]}, {"l": "Eze 3:17", "n": "", "vs": [[17, "«ياابن آدم، قد جعلتك رقيبا لشعب إسرائيل، فأصغ إلى كلمتي وأنذرهم بها على لساني."]]}, {"l": "Eze 4:1", "n": "", "vs": [[1, "أما أنت ياابن آدم فخذ لنفسك لبنة وابسطها أمامك وارسم عليها مدينة أورشليم،"]]}, {"l": "Eze 5:1", "n": "", "vs": [[1, "أما أنت ياابن آدم فخذ لنفسك سيفا حادا استخدمه كموسى الحلاق لتحلق رأسك ولحيتك، ثم خذ لنفسك ميزانا واقسم الشعر إلى ثلاثة أثلاث،"]]}, {"l": "Eze 7:2", "n": "", "vs": [[2, "«ياابن آدم، هذا ما يعلنه الرب لأرض إسرائيل. النهاية قد أزفت على زوايا الأرض الأربع."]]}, {"l": "Eze 12:3", "n": "", "vs": [[3, "أما أنت ياابن آدم فتأهب للسبي واخرج نهارا على مرأى منهم وامض من موضعك إلى موضع آخر لعلهم يفهمون، فإنهم شعب متمرد."]]}, {"l": "Eze 13:2", "n": "", "vs": [[2, "«ياابن آدم، تنبأ على أنبياء إسرائيل الكذبة المتنبئين من عند أنفسهم وقل لهم: اسمعوا كلمة الرب."]]}, {"l": "Eze 14:3", "n": "", "vs": [[3, "ياابن آدم، إن هؤلاء الرجال قد نصبوا أصنامهم في قلوبهم، وأقاموا معثرة إثمهم تلقاء وجوههم، أفأجيب عن سؤالهم؟"]]}, {"l": "Eze 14:13", "n": "", "vs": [[13, "«ياابن آدم، إذا أخطأت إلي أرض وخانت عهدي، أعاقبها وأعوزها مؤونة الخبز وأشيع فيها الجوع، وأفني منها الناس والبهائم،"]]}, {"l": "Eze 15:2", "n": "", "vs": [[2, "«ياابن آدم، بماذا يفضل عود الكرم على كل عود آخر أو على غصن من أغصان شجر الغابة؟"]]}, {"l": "Eze 16:2", "n": "", "vs": [[2, "«ياابن آدم، أطلع أهل أورشليم على أرجاسهم."]]}, {"l": "Eze 17:2", "n": "", "vs": [[2, "«ياابن آدم، اطرح أحجية، واضرب مثلا لشعب إسرائيل،"]]}, {"l": "Eze 20:3", "n": "", "vs": [[3, "«ياابن آدم، قل لشيوخ إسرائيل: هذا ما يعلنه السيد الرب: هل جئتم لتستشيروني؟ حي أنا، لن أتيح لكم طلب المشورة مني."]]}, {"l": "Eze 37:3", "n": "", "vs": [[3, "فقال لي «ياابن آدم، أيمكن أن تحيا هذه العظام؟» فأجبت: «ياسيد الرب، أنت أعلم»."]]}, {"l": "Psa 8:4", "n": "", "vs": [[4, "أسائل نفسي: من هو الإنسان حتى تهتم به؟ أو «ابن الإنسان» حتى تعتبره؟"]]}, {"l": "Dan 8:17", "n": "", "vs": [[17, "فجاء إلي حيث وقفت، فتولاني الخوف وانطرحت على وجهي، فقال لي: «افهم ياابن آدم. إن الرؤيا تختص بوقت المنتهى»."]]}, {"l": "Mat 16:13-16", "n": "", "vs": [[13, "ولما وصل يسوع إلى نواحي قيصرية فيلبس، سأل تلاميذه: «من يقول الناس إني أنا، ابن الإنسان؟»"], [14, "فأجابوه: «يقول بعضهم إنك يوحنا المعمدان، وغيرهم إنك النبي إيليا، وآخرون إنك إرميا، أو واحد من الأنبياء»."], [15, "فسألهم: «وأنتم، من تقولون إني أنا؟»"], [16, "فأجاب سمعان بطرس قائلا: «أنت هو المسيح ابن الله الحي!»"]]}, {"l": "Joh 3:13", "n": "", "vs": [[13, "وما صعد أحد إلى السماء إلا الذي نزل من السماء، وهو ابن الإنسان الذي هو في السماء."]]}, {"l": "Joh 3:16", "n": "", "vs": [[16, "لأنه هكذا أحب الله العالم حتى بذل ابنه الوحيد، لكي لا يهلك كل من يؤمن به، بل تكون له الحياة الأبدية."]]}], "kwAr": "ياابن آدم", "noteAr": ""}, {"kw": "stand", "raw": "Eze_1:28; Dan_10:11, Dan_10:19; Mat_17:7; Act_9:6, Act_26:16", "note": "", "refs": [{"l": "Eze 1:28", "n": "", "vs": [[28, "وكان منظر اللمعان المحيط به كمنظر قوس قزح في يوم مطير؛ هكذا كان منظر شبه مجد الرب. وعندما أبصرت خررت على وجهي وسمعت صوتا يتكلم."]]}, {"l": "Dan 10:11", "n": "", "vs": [[11, "وقال لي: «يادانيآل، أيها الرجل المحبوب، افهم الكلام الذي أخاطبك به، وقف على رجليك لأنني قد أرسلت إليك». وعندما قال لي هذا الكلام نهضت مرتعدا."]]}, {"l": "Dan 10:19", "n": "", "vs": [[19, "وقال: «لا تخف أيها الرجل المحبوب؛ سلام لك. تقو وتشجع». وحالما كلمني دبت في القوة وقلت: «ليتكلم سيدي لأنك شددتني»."]]}, {"l": "Mat 17:7", "n": "", "vs": [[7, "فاقترب منهم يسوع ولمسهم وقال: «انهضوا ولا ترتعبوا!»"]]}, {"l": "Act 9:6", "n": "", "vs": [[6, "فقال وهو مرتعد ومتحير؛ «يارب ماذا تريد أن أفعل؟» فقال له الرب: «قم، وادخل المدينة فيقال لك ما يجب أن تفعله»."]]}, {"l": "Act 26:16", "n": "", "vs": [[16, "انهض وقف على قدميك، فقد ظهرت لك لأعينك خادما لي وشاهدا بهذه الرؤيا التي تراني فيها الآن، وبالرؤى التي ستراني فيها بعد اليوم."]]}], "kwAr": "قف على قدميك", "noteAr": ""}], "arS": [["ثم ", []], ["قال", ["H559"]], [" لي: «", []], ["ياابن", ["H1121"]], [" ", []], ["آدم", ["H120"]], ["، ", []], ["قف", ["H5975"]], [" على ", []], ["قدميك", ["H7272"]], [" ", []], ["فأخاطبك", ["H1696"]], ["».", []]]}, {"c": 2, "v": 2, "text": "وحالما تكلم دخل في الروح وأنهضني على قدمي وسمعته يخاطبني:", "groups": [{"kw": "", "raw": "Eze_3:12, Eze_3:14, Eze_3:24, Eze_36:27; Num_11:25, Num_11:26; Jdg_13:25; 1Sa_16:13; Neh_9:30; Joe_2:28, Joe_2:29; Rev_11:11", "note": "", "refs": [{"l": "Eze 3:12", "n": "", "vs": [[12, "ثم حملني الروح، فسمعت خلفي صوت زلزلة عنيفة قائلا: «مبارك مجد الرب من مكانه»."]]}, {"l": "Eze 3:14", "n": "", "vs": [[14, "وهكذا حلق بي روح الرب وحملني بعيدا، وقد جاشت حرارة روحي بمرارة نفسي، ولكن كانت يد الرب علي شديدة."]]}, {"l": "Eze 3:24", "n": "", "vs": [[24, "فدخل في الروح وأقامني على قدمي، ثم قال لي: «اذهب واعتزل في بيتك."]]}, {"l": "Eze 36:27", "n": "", "vs": [[27, "وأضع روحي في داخلكم فأجعلكم تمارسون فرائضي وتطيعون أحكامي عاملين بها،"]]}, {"l": "Num 11:25", "n": "", "vs": [[25, "فنزل الرب في سحابة وخاطبه، وأخذ من الروح الحال عليه ووضعه على السبعين رئيسا. فلما حل عليهم الروح تنبأوا لفترة وتوقفوا."]]}, {"l": "Num 11:26", "n": "", "vs": [[26, "وكان قد بقي اثنان من الشيوخ المسجلين بين السبعين في المخيم لم يأتيا إلى الخيمة، اسم أحدهما ألداد، واسم الآخر ميداد. فحل عليهما الروح فتنبآ في المخيم."]]}, {"l": "Jdg 13:25", "n": "", "vs": [[25, "وابتدأ روح الرب يحركه في أرض سبط دان بين صرعة وأشتأول."]]}, {"l": "1Sa 16:13", "n": "", "vs": [[13, "فتناول صموئيل قرن الز يت ومسحه أمام إخوته. ومنذ ذلك اليوم فصاعدا حل روح الرب على داود. ثم رجع صموئيل إلى الرامة."]]}, {"l": "Neh 9:30", "n": "", "vs": [[30, "لقد تحملتهم سنين كثيرة، وحذرتهم بروحك على لسان أنبيائك فلم يصغوا، فأسلمتهم لعبودية أمم البلاد."]]}, {"l": "Joe 2:28", "n": "", "vs": [[28, "ثم أسكب روحي على كل بشر، فيتنبأ أبناؤكم وبناتكم، ويحلم شيوخكم أحلاما ويرى شبابكم رؤى."]]}, {"l": "Joe 2:29", "n": "", "vs": [[29, "وأسكب في تلك الأيام أيضا روحي على العبيد والإماء."]]}, {"l": "Rev 11:11", "n": "", "vs": [[11, "وبعد أن تمر الأيام الثلاثة ونصف اليوم يبعث الله في النبيين روح الحياة، فينهضان واقفين، ويستولي على الناظرين إليهما خوف شديد."]]}], "kwAr": "", "noteAr": ""}], "arS": [["وحالما ", []], ["تكلم", ["H1696"]], [" ", []], ["دخل", ["H935"]], [" في ", []], ["الروح", ["H7307"]], [" ", []], ["وأنهضني", ["H5975"]], [" على ", []], ["قدمي", ["H7272"]], [" ", []], ["وسمعته", ["H8085"]], [" ", []], ["يخاطبني", ["H1696"]], [":", []]]}, {"c": 2, "v": 3, "text": "«ياابن آدم، ها أنا باعثك إلى بني إسرائيل، إلى أمة متمردة عصتني، إذ تعدوا هم وآباؤهم علي إلى هذا اليوم.", "groups": [{"kw": "I send", "raw": "Eze_3:4-8; 2Ch_36:15, 2Ch_36:16; Isa_6:8-10; Jer_1:7, Jer_7:2, Jer_25:3-7, Jer_26:2-6, Jer_36:2; Mar_12:2-5; Luk_24:47, Luk_24:48; Joh_20:21, Joh_20:22; Rom_10:15", "note": "", "refs": [{"l": "Eze 3:4-8", "n": "", "vs": [[4, "ثم قال لي: «ياابن آدم، انطلق إلى شعب إسرائيل وخاطبهم بكلماتي."], [5, "فإنك لست مرسلا إلى أمة ذات لهجة غريبة ولغة مبهمة، بل إلى شعب إسرائيل،"], [6, "ولا إلى شعوب كثيرة غريبة اللهجات ومبهمة اللغات لا تفهم كلامهم. حقا لو أرسلتك إلى هؤلاء لسمعوا لك!"], [7, "لكن شعب إسرائيل لا يودون الاستماع لك، لأنهم لا يودون الاستماع لي، لأنهم جميعا معاندون قساة القلوب."], [8, "ها أنا قد جعلت وجهك صلبا مثل وجوههم، وجبهتك قاسية مثل جباههم."]]}, {"l": "2Ch 36:15", "n": "", "vs": [[15, "وأرسل الرب إله آبائهم إليهم رسلا بصورة متوالية محذرا إياهم لأنه أشفق على شعبه وعلى مسكنه."]]}, {"l": "2Ch 36:16", "n": "", "vs": [[16, "فكانوا يهزأون برسل الله، ورفضوا كلامه، واستهانوا بأنبيائه، حتى ثار غضب الرب على شعبه وامتنع كل شفاء!"]]}, {"l": "Isa 6:8-10", "n": "", "vs": [[8, "وسمعت صوت الرب يقول: «من أرسل، ومن يذهب من أجلنا؟» عندئذ قلت: «ها أنا أرسلني»."], [9, "فقال: «امض وقل لهذا الشعب: اسمعوا سمعا ولكن لا تفهموا. انظروا نظرا و لكن لا تدركوا."], [10, "قس قلب هذا الشعب، وثقل أذنيه وأغمض عينيه لئلا يرى بعينيه ويسمع بأذنيه ويفهم بقلبه، فيرجع عن غيه ويبرأ»."]]}, {"l": "Jer 1:7", "n": "", "vs": [[7, "ولكن الرب أجابني: «لا تقل إني لست سوى ولد، لأنك ستذهب إلى كل من أبعث بك إليه، وتنطق بكل ما آمرك به."]]}, {"l": "Jer 7:2", "n": "", "vs": [[2, "«قف في باب هيكل الرب وأعلن هناك هذا الكلام: اسمعوا كلام الرب ياجميع رجال يهوذا المجتازين هذه الأبواب ليسجدوا للرب:"]]}, {"l": "Jer 25:3-7", "n": "", "vs": [[3, "«على مدى ثلاث وعشرين سنة، أي مند السنة الثالثة عشرة من حكم يوشيا بن آمون ملك يهوذا، وحتى هذا اليوم، والرب يوحي إلي بكلمته، فخاطبتكم بها تكرارا منذ البدء ولكنكم لم تسمعوا."], [4, "ومع أن الرب قد واظب على إرسال عبيده الأنبياء إليكم، فإنكم لم تصغوا ولم تستمعوا لإنذاراته."], [5, "وقد قالوا لكم: توبوا الآن. ليرجع كل واحد منكم عن طرقه الشريرة وممارساته الأثيمة فتقيموا في الأرض التي وهبها لكم الرب على مدى الدهور،"], [6, "ولا تضلوا وراء آلهة أخرى لتعبدوها وتسجدوا لها، ولا تثيروا غيظي بما تصنعه أيديكم من أوثان. عندئذ لا أنزل بكم أذى."], [7, "غير أنكم لم تسمعوا لي، بل أثرتم غيظي بما جنته أيديكم، فاستجلبتم على أنفسكم الشر»."]]}, {"l": "Jer 26:2-6", "n": "", "vs": [[2, "هذا ما يعلنه الرب: «قف في ساحة هيكل الرب، وبلغ كل أهل مدن يهوذا القادمين للعبادة في هيكل الرب بجميع الكلام الذي أمرتك أن تخاطبهم به. وإياك أن تحذف كلمة."], [3, "لعلهم يسمعون ويرجع كل واحد منهم عن طريقه الأثيم، فأمتنع عن الشر الذي نويت أن أوقعه بهم لسوء أعمالهم»."], [4, "خاطبهم قائلا: «هذا ما يعلنه الرهب: إن لم تطيعوني فتسلكوا في شريعتي التي جعلتها أمامكم،"], [5, "وإن لم تسمعوا لتحذيرات عبيدي الأنبياء الذين أرسلتهم منذ البداية إليكم، ولم تصغوا إليهم،"], [6, "فإني أجعل هذا الهيكل نظير شيلوه، وهذه المدينة لعنة لجميع أمم الأرض»."]]}, {"l": "Jer 36:2", "n": "", "vs": [[2, "«خذ لك درج كتاب ودون فيه كل الكلام الذي أمليته عليك عن إسرائيل، ويهوذا وعن جميع الأمم، منذ اليوم الذي أوحيت فيه إليك في عهد يوشيا إلى الآن."]]}, {"l": "Mar 12:2-5", "n": "", "vs": [[2, "وفي الأوان، أرسل إلى المزارعين عبدا ليتسلم منهم حصته من ثمر الكرم."], [3, "إلا أنهم أمسكوه وضربوه وردوه فارغ اليدين."], [4, "فعاد وأرسل إليهم عبدا آخر، فشجوا رأسه وردوه مهانا."], [5, "ثم أرسل آخر أيضا فقتلوه. ثم أرسل آخرين كثيرين، فضربوا بعضا وقتلوا بعضا."]]}, {"l": "Luk 24:47", "n": "", "vs": [[47, "وأن يبشر باسمه بالتوبة وغفران الخطايا في جميع الأمم انطلاقا من أورشليم."]]}, {"l": "Luk 24:48", "n": "", "vs": [[48, "وأنتم شهود على هذه الأمور."]]}, {"l": "Joh 20:21", "n": "", "vs": [[21, "فقال لهم يسوع: «سلام لكم. كما أن الآب أرسلني، أرسلكم أنا»."]]}, {"l": "Joh 20:22", "n": "", "vs": [[22, "قال هذا ونفخ فيهم وقال لهم: «اقبلوا الروح القدس."]]}, {"l": "Rom 10:15", "n": "", "vs": [[15, "وكيف يبشر أحد إلا إذا كان قد أرسل؟ كما قد كتب: «ما أجمل أقدام المبشرين بالخيرات!»"]]}], "kwAr": "باعثك", "noteAr": ""}, {"kw": "a rebellious nation", "raw": "Heb. rebellious nations, Ezek. 16:1-63, 20:1-49, 23:1-49", "note": "Heb. rebellious nations, Ezek. 16:1-63, 20:1-49, 23:1-49", "refs": [{"l": "Eze 16:1-63", "n": "", "vs": [[1, "وأوحى إلي الرب بكلمته قائلا:"], [2, "«ياابن آدم، أطلع أهل أورشليم على أرجاسهم."], [3, "وقل هذا ما يعلنه السيد الرب لأورشليم: أصلك ومولدك من أرض الكنعانيين. أبوك أموري وأمك حثية."], [4, "في يوم مولدك لم يقطع حبل سرتك ولم تنظفي بماء ولم تدلكي بملح، ولم تقمطي. (إشارة إلى أن أحدا لم يكترث لها)."], [5, "لم ترأف بك عين أو تعطف عليك لتصنع لك شيئا من هذا. بل نبذت في الصحراء احتقارا لك يوم مولدك."], [6, "وحين مررت بك وشهدتك مازلت ملطخة بدمائك قلت لك: عيشي بدمك. نعم عيشي بدمك."], [7, "وكثرتك كنبت الحقل، فنميت وكبرت وبلغت عمرا صرت فيه أجمل الجميلات، فنهد ثدياك ونما شعرك، ولكنك كنت عارية متجردة."], [8, "فمررت بك ورأيتك وإذا بك قد بلغت سن الحب، فبسطت عليك أطراف ثوبي، وسترت عورتك وحلفت لك وأبرمت معك عهدا، فصرت لي، يقول السيد الرب."], [9, "ثم غسلتك بماء، ونظفتك من الدم وطيبتك بالدهن."], [10, "وكسوتك بثياب موشاة وحذوتك بنعلين من جلد الدلفين، ولفعتك بالكتان الفاخر، ودثرتك بالحرير،"], [11, "وزينتك بالحلي، إذ وضعت أساور في يديك وعقدا في عنقك."], [12, "وجعلت خزامة في أنفك وقرطين في أذنيك وإكليل جمال على رأسك"], [13, "فتزينت بالذهب والفضة، وكانت ثيابك من الكتان الفاخر والحرير وكل ما هو موشى. وأكلت السميذ والعسل والزيت، فتمتعت بأروع الجمال حتى صرت صالحة لتكوني زوجة ملك."], [14, "فذاع اسمك بين الأمم لفرط جمالك لأنه اكتمل بفضل بهائي الذي أضفيته عليك، يقول السيد الرب."], [15, "ولكنك اعتمدت على جمالك وزنيت اتكالا على شهرتك. أغدقت عهارتك على كل عابر سبيل راغب فيك"], [16, "وأخذت بعض ثيابك فصنعت لنفسك مشارف للأصنام ملونة زنيت عليها زنى لم يكن له مثيل ولن يكون."], [17, "وأحضرت ما وهبتك من حلي الجواهر، من ذهبي وفضتي، فصنعت منها تماثيل ذكور وزنيت بها (أي عبدتها)."], [18, "وأخذت ثيابك الموشاة فكسوتها بها، ووضعت أمامها دهني وبخوري،"], [19, "وخبزي الذي قدمته لك والسميذ والزيت والعسل الذي أطعمتك، وقربتها أمامها كتقدمة سرور، هكذا فعلت يقول السيد الرب."], [20, "ثم أخذت أبناءك وبناتك الذين أنجبتهم لي، فذبحتهم قرابين لها. فهل كان زناك أمرا يسيرا؟"], [21, "قد ذبحت أبنائي وسلمتهم للأوثان ليجوزوا في النار قربانا لها."], [22, "وفي جميع رجاساتك وزناك لم تذكري أيام حداثتك حين كنت عارية متجردة ملطخة بدمك."], [23, "ثم من بعد كل شرك ويل، ويل لك يقول السيد الرب"], [24, "شيدت لنفسك ماخورا وصنعت لك أنصابا في كل ساحة."], [25, "بنيت مرتفعتك عند ناصية كل طريق، ودنست جمالك ووهبت جسدك لكل عابر سبيل لتكثري من عهارتك."], [26, "وزنيت مع أبناء مصر، جيرانك الشهوانيين، وأكثرت فواحشك لإسخاطي."], [27, "ها أنا أعاقبك وأنقص من نصيبك وأسلمك لأهواء عدواتك بنات الفلسطينيين اللواتي يخجلن من تصرفك الفاجر."], [28, "وإذ لم تشبعي زنى ارتكبت الفواحش مع أبناء أشور من غير أن تكتفي."], [29, "ثم أكثرت من ارتكاب الفجور في أرض الكنعانيين حتى ديا ر الكلدانيين، ومع ذلك لم تكتفي."], [30, "ما أشر قلبك يقول السيد الرب إذ اقترفت هذه الموبقات كلها، فعل امرأة زانية صفيقة."], [31, "فشيدت ماخورك عند ناصية كل طريق، وأقمت مرتفعة صنمك في كل ساحة ولم تكوني كالزانية التي تقبض أجرة زناها، لأنك وهبت نفسك مجانا احتقارا لكل أجرة."], [32, "إذ كنت زوجة فاسقة أحلت الغرباء موضع زوجها."], [33, "كل الزانيات ينلن هدايا من الرجال، أما أنت فأعطيت هداياك لمحبيك، ورشوتهم كي يقبلوا إليك من كل صوب ليزنوا معك."], [34, "فأنت في زناك تختلفين عن بقية النساء الزانيات، إذ لا يسعى أحد وراءك ليزني معك بل على النقيض، أنت تعطينهم أجرة ليفسقوا معك ولا تقبضين منهم أجرة."], [35, "لذلك اسمعي أيتها الزانية قضاء الرب:"], [36, "من حيث أنك أنفقت مالك وكشفت عن عريك في فواحشك لعشاقك ولسائر أصنامك الممقوتة، ومن أجل دماء أبنائك الذين قربتهم لها،"], [37, "ها أنا أحشد جميع عشاقك الذين تلذذت بهم، وجميع من تدلهت بهم مع كل الذين أبغضتهم فأجمعهم عليك من كل ناحية، وأكشف عن عريك فيشاهدون عورتك كلها،"], [38, "وأدينك كما تدان الزانيات وسافكات الدماء، وأوقع بك عقاب دم سخطي وغيرتي،"], [39, "وأسلمك لأيديهم فيهدمون ماخورك ومرتفعة نصبك، ويسلبونك ثيابك ويستولون على جواهر زينتك ويتركونك عارية متجردة،"], [40, "ويثيرون عليك الجموع ويرجمونك بالحجارة ويمزقونك بسيوفهم."], [41, "ويحرقون بيوتك بالنار، وينفذون فيك أحكاما على مرأى نساء كثيرات. عندئذ أمنعك عن الزنى ولا تبذلين أجرة بعد للزناة معك."], [42, "حينئذ أسكن شدة غضبي عليك وأصرف عنك غيرتي فأهدأ ولا أسخط بعد."], [43, "ولأنك لم تذكري أيام حداثتك، وإنما أثرت حنقي بارتكاب جميع هذه الموبقات، ها أنا بدوري أعاقبك أشد العقاب، يقول السيد الرب، فلا تقترفين هذه الرذيلة فوق رجاساتك كلها."], [44, "ها إن كل متمثل يقتبس هذ المثل عليك قائلا: كما تكون الأم تكون ابنتها"], [45, "فأنت ابنة أمك التي كرهت زوجها وأبناءها، وأنت شقيقة أخواتك اللواتي عفن رجالهن وأبناءهن. فأمكن حثية وأبوكن أموري."], [46, "وأختك الكبرى هي السامرة المقيمة مع بناتها إلى الشمال منك، وأختك الصغرى هي سدوم المقيمة مع بناتها إلى الجنوب منك."], [47, "ولم تكتفي بالسلوك في طرق فجورهن وارتكاب مثل أرجاسهن وكأن ذلك قليل عليك بل تفوقت عليهن فسادا في جميع طرقك."], [48, "لذلك يقول السيد الرب حي أنا، إن سدوم أختك وبناتها لم يقترفن المفاسد التي اقترفتها أنت وبناتك."], [49, "أما إثم أختك سدوم، فإنها مع بناتها طغت عليها الغطرسة والتخمة وسلام الاطمئنان، ولم تغث الفقير والمسكين."], [50, "وتشامخن وارتكبن الرجس أمامي، فمحوتهن عندما شاهدت ذلك."], [51, "ولم تخطيء السامرة نصف خطاياك، بل كنت أكثر رجاسات منهن، فجعلت أختيك تبدوان أكثر صلاحا منك، من جراء جميع رجاساتك التي اقترفتها"], [52, "فاحملي أنت أيضا عارك، إذ جعلت القضاء في صالح أختيك لفرط معاصيك التي تفوقت بها على رجاستهن. قد أصبحن أكثر برا منك، فاخزي واحملي عارك إذ قد بررت أخواتك."], [53, "ولكني سأرد سبيهن: سبي سدوم وبناتها، وسبي السامرة وبناتها، وسبي مسبييك في جملتهم."], [54, "لكي تحملي عارك وتخجلي مما ارتكبت عندما أصبحت تعزية لهن."], [55, "فأخواتك: سدوم وبناتها، والسامرة وبناتها يعدن إلى سابق عهدهن، وكذلك أنت وبناتك أيضا."], [56, "إن اسم أختك سدوم لم يرد ذكره على فمك في يوم غطرستك،"], [57, "قبل انكشاف شرك. وها أنت قد صرت مثار تعيير بنات أرام وجميع المحيطين بها من بنات فلسطين وكل اللواتي حولك ممن احتقرنك."], [58, "لقد حملت عقاب فجورك ورجاساتك، يقول الرب."], [59, "لهذا سأصنع بك كما صنعت، إذ ازدريت بالقسم عندما نكثت العهد."], [60, "أما أنا فأذكر عهدي معك في أيام حداثتك، وأعقد معك عهدا أبديا،"], [61, "فتذكرين عندئذ طرقك حين تستقبلين أختيك: الكبرى والصغرى كلتيهما، وأجعلهما كبنتين لك، إنما ليس ذلك بفضل عهدك."], [62, "فأقيم عهدي معك فتدركين أني أنا الرب،"], [63, "لكي تتذكري فتخجلي ولا تفتحي فمك من بعد بسبب خزيك، حين أغفر لك كل ما ارتكبت من شر يقول السيد الرب»."]]}, {"l": "Eze 20:1-49", "n": "", "vs": [[1, "وفي اليوم العاشر من الشهر الخامس (أي تموز ; يوليو) من السنة السابعة أقبل إلي بعض شيوخ إسرائيل ليستشيروا الرب، فجلسوا أمامي."], [2, "فأوحى إلي الرب بكلمته قائلا:"], [3, "«ياابن آدم، قل لشيوخ إسرائيل: هذا ما يعلنه السيد الرب: هل جئتم لتستشيروني؟ حي أنا، لن أتيح لكم طلب المشورة مني."], [4, "أتدينهم ياابن آدم؟ أتحاكمهم؟ أطلعهم على رجاسات آبائهم،"], [5, "وقل لهم: هذا ما يعلنه السيد الرب: في اليوم الذي اصطفيت فيه إسرائيل، وحلفت لذرية بيت يعقوب وأعلنت لهم عن نفسي في ديار مصر، حلفت لهم قائلا: أنا الرب إلهكم."], [6, "في ذلك اليوم أقسمت لهم أن أخرجهم من ديار مصر إلى الأرض التي استكشفتها لهم والتي تفيض لبنا وعسلا، فخر كل الأراضي،"], [7, "وقلت لهم: لينبذ كل منكم الأرجاس التي تنجس عينيه، ولا تتدنسوا بأصنام مصر؛ أنا الرب إلهكم."], [8, "ولكنهم تمردوا علي ولم يسمعوا لي، ولم يتركوا الأرجاس التي تنجس عيونهم، ولم يهجروا أصنام مصر. فقلت: سأسكب عليهم غضبي وأنفث فيهم كامل سخطي في وسط ديار مصر."], [9, "غير أني تصرفت على غير ذلك إكراما لاسمي، لئلا يتنجس أمام عيون الأمم التي يسكن شعب إسرائيل بينها. إذ أعلنت نفسي أمام عيون الأمم حين أخرجت شعب إسرائيل من ديار مصر."], [10, "وهكذا أخرجتهم من ديار مصر، وأتيت إلى البرية،"], [11, "وأعطيتهم فرائضي، وأعلنت لهم أحكامي التي إن مارسها إنسان يحيا بها،"], [12, "وأعطيتهم كذلك سبوتي لتكون علامة بيني وبينهم ليدركوا أني أنا الرب الذي أقدسهم."], [13, "لكن شعب إسرائيل تمردوا علي في البرية ولم يمارسوا فرائضي، وتنكروا لأحكامي التي إن عمل بها إنسان يحيا، ونجسوا أيام سبوتي كثيرا. فقلت: سأسكب غضبي عليهم في البرية لأميتهم."], [14, "لكنني تصرفت على غير ذلك إكراما لاسمي، لئلا يتنجس أمام عيون الأمم التي أخرجت شعب إسرائيل على مشهد منها."], [15, "وحلفت لهم في البرية بأني لن أقودهم إلى الأرض التي وهبتها لهم، التي تفيض لبنا وعسلا، فخر الأراضي كلها،"], [16, "لأنهم تنكروا لأحكامي ولم يمارسوا فرائضي، بل دنسوا أيام سبوتي وضل قلبهم وراء أصنامهم."], [17, "ولكن عيني ترَأفت عليهم فلم أهلكهم ولم أفنهم في البرية."], [18, "وأوصيت أبناءهم في البرية ألا يسلكوا في طرق آبائهم ولا يمارسوا أعمالهم ولا يتنجسوا بأصنامهم."], [19, "أنا الرب إلهكم فاسلكوا في فرائضي واحفظوا أحكامي واعملوا بها."], [20, "وقدسوا سبوتي فتكون علامة بيني وبينكم لتعلموا أني أنا الرب إلهكم"], [21, "فتمرد الأبناء علي. لم يسلكوا في فرائضي ولم يحفظوا أحكامي ليعملوها التي إن عملها إنسان يحيا بها، ونجسوا سبوتي. فقلت إني أسكب غضبي عليهم لأتم سخطي عليهم في البرية."], [22, "ولكني كففت يدي عنهم وتصرفت على غير ذلك إكراما لاسمي، لئلا يتنجس أمام عيون الأمم التي أخرجت شعب إسرائيل على مشهد منها."], [23, "وحلفت لهم في البرية أن أفرقهم بين الأمم وأشتتهم عبر البلدان."], [24, "لأنهم لم يطبقوا أحكامي بل تنكروا لفرائضي ودنسوا أيام سبوتي وتعلقت عيونهم بأصنام آبائهم."], [25, "لذلك أعطيتهم فرائض غير صالحة وأحكاما لا يحيون بها."], [26, "وجعلتهم يتنجسون بعطاياهم إذ أجازوا في النار كل بكر لأبيدهم، حتى يدركوا أني أنا الرب."], [27, "لهذا، ياابن آدم، قل لشعب إسرائيل: بهذه الأمور جدف على آباؤكم إذ خانوناي أشد خيانة."], [28, "عندما جئت بهم إلى الأرض التي أقسمت أن أهبها لهم، ورأوا كل أكمة مرتفعة وكل شجرة وارفة، فذبحوا قرابينهم هناك وقربوا ذبائحهم المغيظة، وأصعدوا تقدمات، روائح الرضى وسكبوا سكائب خمرهم،"], [29, "فسأ لتهم: ما هذه المرتفعةُ التي تأتون إليها؟ فدعيت مرتفعة إلى هذا اليوم."], [30, "لذلك قل لشعب إسرائيل هذا ما يعلنه السيد الرب: هل دنستم أنفسكم كما فعل آباؤكم وغويتم وراء أصنامكم الرجسة؟"], [31, "إنكم تتنجسون مع كل أصنامكم إلى هذا اليوم، حين تقدمون عطاياكم للأوثان وتجيزون أبناءكم في النار . فهل بعد هذا تأتون إلي لطلب مشورتي ياشعب إسرائيل؟ حي أنا يقول السيد الرب، لن أتيح لكم طلب مشورتي."], [32, "إذ لن يتحقق ما يخطر ببالكم إذ تقولون، لنكن كسائر قبائل الأرض فنعبد الخشب والحجر."], [33, "حي أنا، يقول السيد الرب، إني بيد قوية وذراع قديرة وغضب مصبوب أملك عليكم،"], [34, "وأخرجكم من بين الشعوب وأجمعكم من البلدان التي تشتتم فيها، بيد قوية وذراع قديرة وغضب مصبوب،"], [35, "وآتي بكم إلى برية الأمم فأحاكمكم هناك مواجهة،"], [36, "وكما حاكمت أسلافكم في برية ديار مصر، أحاكمكم أنتم أيضا."], [37, "وأحصيكم، وأدخلكم في ميثاق العهد،"], [38, "وأعزل من بينكم المتمردين والعصاة علي، وأخرجهم من أرض غربتهم، ولكنهم لن يدخلوا أرض إسرائيل، فتدركون آنئذ أني أنا الرب."], [39, "أما أنتم ياشعب إسرائيل فامضوا وليعبد كل إنسان أصنامه، ولكن فيما بعد، ستستمعون حتما لي، ولن تدنسوا اسمي القدوس بعد بعطاياكم وأوثانكم."], [40, "لأنه في جبل قدسي، جبل إسرائيل الشامخ، هناك يعبدوني في الأرض شعب إسرائيل كلهم. هناك أرضى عنهم وألتمس تقدماتكم وباكورة غلاتكم مع جميع مقدساتكم."], [41, "وأرضى عنكم كرائحة سرور حين أخرجكم من بين الشعوب، وأجمعكم من البلدان التي تشتتم إليها، وأتجلى بقداستي بينكم على مشهد من الأمم."], [42, "فتدركون أني أنا الرب حين أردكم إلى أرض إسرائيل، إلى الأرض التي أقسمت لآبائكم أن أهبها لهم."], [43, "هناك تذكرون طرق شركم وأعمالكم التي تدنستم بها، وتمقتون أنفسكم من أجل ما ارتكبتموه من شرور."], [44, "فتدركون أني أنا الرب حين أعاملكم، إكراما لاسمي، لا بمقتضى طرقكم الشريرة ولا بموجب أعمالكم السيئة ياشعب إسرائيل، يقول السيد الرب»."], [45, "وأوحى إلي الرب بكلمته قائلا:"], [46, "«ياابن آدم، التفت نحو الجنوب وأنذره، وتنبأ على أرض الغابات في النقب"], [47, "وقل لغابات النقب: اسمعوا قضاء الرب، فهذا ما يعلنه السيد الرب: ها أنا أضرم نارا فيك فتلتهم كل شجرة خضراء ويابسة، ولا ينطفيء لهيبها المتأجج، فتحترق بها كل الوجوه من الجنوب إلى الشمال."], [48, "فيرى كل بشر أني أنا الرب الذي أضرمتها، ولا يمكن أن تنطفيء»."], [49, "عندئذ قلت: «آه ياسيد الرب: هم يقولون عني: أما يضرب هو أمثالا فقط؟»"]]}, {"l": "Eze 23:1-49", "n": "", "vs": [[1, "وأوحى إلي الرب بكلمته قائلا:"], [2, "«ياابن آدم، كانت هناك امرأتان، ابنتا أم واحدة،"], [3, "زنتا في صباهما في مصر حيث دوعبت ثديهما، وعبث بترائب عذرتهما."], [4, "اسم الكبرى أهولة واسم أختها أهوليبة، وكانتا لي وأنجبتا أبناء وبنات، أما السامرة فهي أهولة، وأورشليم هي أهوليبة."], [5, "وزنت أهولة مع أنها كانت لي، وعشقت محبيها الأشوريين الأبطال."], [6, "اللابسين في الأردية الأرجوانية من ولاة وقادة. وكلهم شبان شهوة، وفرسان خيل."], [7, "فأغدقت على نخبة أبناء أشور زناها، وتنجست بكل من عشقتهم وبكل أصنامهم."], [8, "ولم تتخل عن زناها منذ أيام مصر لأنهم ضاجعوها منذ حداثتها، وعبثوا بترائب عذرتها وسكبوا عليها شهواتهم،"], [9, "لذلك سلمتها ليد عشاقها أبناء أشور الذين أولعت بهم."], [10, "ففضحوا عورتها، وأسروا أبناءها وبناتها، وذبحوها بالسيف، فصارت عبرة للنساء ونفذوا فيها قضاء."], [11, "ومع أن أختها أهوليبة شهدت هذا، فإنها أوغلت أكثر منها في عشقها وزناها،"], [12, "إذ عشقت أبناء أشور من ولاة وقادة المرتدين أفخر اللباس، فرسان خيل وجميعهم شبان شهوة."], [13, "فرأيت أنها قد تنجست، وسلكتا كلتاهما في ذات الطريق."], [14, "غير أن أهوليبة تفوقت في زناها، إذ حين نظرت إلى صور رجال الكلدانيين المرسومة على الحائط بالمغرة،"], [15, "متحزمين بمناطق على خصورهم، وعمائمهم مسدولة على رؤوسهم، وكلهم بدوا كرؤساء مركبات مماثلين تماما لأبناء الكلدانيين في بابل أرض ميلادهم،"], [16, "عشقتهم وبعثت إليهم رسلا إلى أرض الكلدانيين."], [17, "فأقبل إليها أبناء بابل وعاشروها في مضجع الحب ونجسوها بزناهم. وبعد أن تنجست بهم كرهتهم."], [18, "وإذ واظبت على زناها علانية، وتباهت بعرض عريها، كرهتها كما كرهت أختها."], [19, "ومع ذلك أكثرت من فحشها، ذاكرة أيام حداثتها حيث زنت في ديار مصر."], [20, "فأولعت بعشاقها هناك، الذين عورتهم كعور ة الحمير ومنيهم كمني الخيل."], [21, "وتقت إلى فجور حداثتك حين كان المصريون يداعبون ترائب عذرتك طمعا في نهد حداثتك."], [22, "لذلك ياأهوليبة، هذا ما يعلنه السيد الرب: ها أنا أثير عليك عشاقك الذين جفتهم نفسك، وآتي بهم عليك من كل ناحية."], [23, "أبناء البابليين، وسائر الكلدانيين من أقوام فقود وشوع وقوع ومعهم جميع أبناء أشور، شبان شهوة، من ولاة وقادة ورؤساء مركبات وذوي الشهرة، وكلهم فرسان خيل."], [24, "فيهاجمونك بأسلحة ومركبات وعربات وأقوام شعوب ويحاصرونك بترس ومجن وخوذة. وأعهد إليهم بمقاضاتك فيحكمون عليك بمقتضى أحكامهم."], [25, "وأصب سخطي عليك فيعاملونك بغيظ. يجدعون أنفك وأذنيك، وتقتل بقيتك بالسيف. يأسرون أبناءك وبناتك، وتلتهم النار بقيتك،"], [26, "ويجردونك من ثيابك ويستولون على حليك."], [27, "وهكذا أضع حدا لعهرك وزناك اللذين شرعت فيهما في أرض مصر، فلا تعودين تتعلقين بهم، أو تذكرين مصر بعد."], [28, "ها أنا أسلمك إلى يد الذين كرهتهم وإلى أيدي الذين جفتهم نفسك."], [29, "فيعاملونك ببغض ويستولون على كل ثمار تعبك، ويتركونك متجردة عارية، فتنفضح عورة زناك وعهرك."], [30, "وأوقع بك هذه الأمور لأنك ضللت وراء الأمم، وتنجست بعبادة أصنامهم،"], [31, "وسلكت في أثر أختك، لهذا أجرعك كأسها"], [32, "وهذا ما يعلنه السيد الرب: ستشربين كأس عقاب أختك العميقة، وتكونين مثار ضحك واستهزاء. لأن الكأس تسع كثيرا."], [33, "تمتلئين سكرا وحزنا، فكأس أختك السامرة، كأس الرعب والخراب،"], [34, "تشربينها وتمتصينها، ثم تقضمين قطعها، وتجتثين نهديك لأني تكلمت، يقول السيد الرب."], [35, "لأنك نسيتني ونبذتني وراء ظهرك، تحملي عواقب عهرك وزناك»."], [36, "وقال الرب لي: «ياابن آدم، أتدين أهولة وأهوليبة؟ إذن أطلعهما على ما ارتكبتاه من رجس،"], [37, "لأنهما قد زنتا وسفكتا دماء، فقد زنتا بعبادة أصنامهما وأجازتا أبناءهما الذين أنجبتاهم في النار، ليكونوا وقودا لها."], [38, "وأثمتا في حقي إذ أنهما في ذلك اليوم نجستا مقدساتي ودنستا أيام سبوتي."], [39, "وبعد أن ذبحتا أبناءهما قرابين لأصنامهما قدمتا في ذلك اليوم إلى مقدسي لتنجساه. فانظر! هذا ما ارتكبتاه في هيكلي."], [40, "بل استدعيتما رجالا قادمين من بعيد، بعد أن أرسلتما إليهم رسولا، وها هم قد أقبلوا، ومن أجلهم استحممت وكحلت عينيك وتز ينت بالحلي."], [41, "وتربعت على سرير فاخر، بسطت أمامه مائدة منضضة وضعت عليها بخوري وزيتي."], [42, "وأحاطت بها جلبة قوم لاهين، واستجلب من البرية سكارى مع أناس من رعاع الخلق، زينوا أيدي المذنبتين بأسورة، ووضعوا على رأسيهما تاج جمال."], [43, "فقلت عن العريقة في الزنا: الآن يزنون معها وهي معهم،"], [44, "لأنهم تهافتوا عليها كما يتهافت على امرأة زانية. هكذا تهافتوا على أهولة وأهوليبة المرأتين العاهرتين."], [45, "ولكن سيدينهما الرجال الصديقون، فيصدرون عليهما حكم الزانية وحكم سافكة الدم، لأنهما عاهرتان تلطخت أيديهما بالدم."], [46, "لأن هذا ما يعلنه السيد الرب: ها أنا أجلب عليهما قوما من الأعداء، وأوقع بهما الرعب والنهب،"], [47, "فيرجمهما القوم بالحجارة، ويمزقونهما بالسيوف ويذبحون أبناءهما وبناتهما، ويحرقون بيوتهما بالنار."], [48, "فأضع حدا للرذيلة في الأرض، فتعتبر جميع النساء ولا يرتكبن الفحشاء كما فعلتما."], [49, "وتلقيان جزاء زناكما وتحملان خطايا عبادة أصنامكما، وتدركان أني أنا السيد الرب»."]]}], "kwAr": "أمة متمردة", "noteAr": "بالعبرية: أمم متمردة. انظر حز 16: 1-63؛ 20: 1-49؛ 23: 1-49"}, {"kw": "rebelled", "raw": "Eze_20:18-30; Num_20:10, Num_32:13, Num_32:14; Deu_9:24, Deu_9:27; 1Sa_8:7, 1Sa_8:8; 2Ki_17:17-20; Ezr_9:7; Neh_9:16-18, Neh_9:26, Neh_9:33-35; Psa_106:16-21, Psa_106:28, Psa_106:32-40; Jer_3:25; Jer_16:11, Jer_16:12, Jer_44:21; Dan_9:5-13; Act_7:51", "note": "", "refs": [{"l": "Eze 20:18-30", "n": "", "vs": [[18, "وأوصيت أبناءهم في البرية ألا يسلكوا في طرق آبائهم ولا يمارسوا أعمالهم ولا يتنجسوا بأصنامهم."], [19, "أنا الرب إلهكم فاسلكوا في فرائضي واحفظوا أحكامي واعملوا بها."], [20, "وقدسوا سبوتي فتكون علامة بيني وبينكم لتعلموا أني أنا الرب إلهكم"], [21, "فتمرد الأبناء علي. لم يسلكوا في فرائضي ولم يحفظوا أحكامي ليعملوها التي إن عملها إنسان يحيا بها، ونجسوا سبوتي. فقلت إني أسكب غضبي عليهم لأتم سخطي عليهم في البرية."], [22, "ولكني كففت يدي عنهم وتصرفت على غير ذلك إكراما لاسمي، لئلا يتنجس أمام عيون الأمم التي أخرجت شعب إسرائيل على مشهد منها."], [23, "وحلفت لهم في البرية أن أفرقهم بين الأمم وأشتتهم عبر البلدان."], [24, "لأنهم لم يطبقوا أحكامي بل تنكروا لفرائضي ودنسوا أيام سبوتي وتعلقت عيونهم بأصنام آبائهم."], [25, "لذلك أعطيتهم فرائض غير صالحة وأحكاما لا يحيون بها."], [26, "وجعلتهم يتنجسون بعطاياهم إذ أجازوا في النار كل بكر لأبيدهم، حتى يدركوا أني أنا الرب."], [27, "لهذا، ياابن آدم، قل لشعب إسرائيل: بهذه الأمور جدف على آباؤكم إذ خانوناي أشد خيانة."], [28, "عندما جئت بهم إلى الأرض التي أقسمت أن أهبها لهم، ورأوا كل أكمة مرتفعة وكل شجرة وارفة، فذبحوا قرابينهم هناك وقربوا ذبائحهم المغيظة، وأصعدوا تقدمات، روائح الرضى وسكبوا سكائب خمرهم،"], [29, "فسأ لتهم: ما هذه المرتفعةُ التي تأتون إليها؟ فدعيت مرتفعة إلى هذا اليوم."], [30, "لذلك قل لشعب إسرائيل هذا ما يعلنه السيد الرب: هل دنستم أنفسكم كما فعل آباؤكم وغويتم وراء أصنامكم الرجسة؟"]]}, {"l": "Num 20:10", "n": "", "vs": [[10, "وجمع موسى وهرون الشعب عند الصخرة وقالا لهم: «اسمعوا أيها المتمردون، أعلينا أن نخرج لكم من هذه الصخرة ماء؟»"]]}, {"l": "Num 32:13", "n": "", "vs": [[13, "وإذ اشتد غضب الرب على بني إسرائيل أتاههم في الصحراء أربعين سنة، حتى تم فناء كل الجيل الذي ارتكب الشر في عيني الرب."]]}, {"l": "Num 32:14", "n": "", "vs": [[14, "وها أنتم نتاج تربية قوم خطاة، ترتكبون وزر آبائكم، لتزيدوا من شدة غضبه على إسرائيل."]]}, {"l": "Deu 9:24", "n": "", "vs": [[24, "فأنتم حقا متمردون على الرب منذ أن عرفتكم."]]}, {"l": "Deu 9:27", "n": "", "vs": [[27, "اذكر عبيدك إبراهيم وإسحق ويعقوب، وتغاض عن عناد هذا الشعب وإثمه وخطيئته،"]]}, {"l": "1Sa 8:7", "n": "", "vs": [[7, "فقال الرب له: «لب للشعب طلبه وانزل عند رغبتهم، لأنهم لم يرفضوك أنت بل إياي رفضوا، لكي لا أملك عليهم."]]}, {"l": "1Sa 8:8", "n": "", "vs": [[8, "وهم يعاملونك الآن كما عاملوني منذ أن أصعدتهم من ديار مصر إلى هذا اليوم، إذ تركوني وعبدوا آلهة أخرى."]]}, {"l": "2Ki 17:17-20", "n": "", "vs": [[17, "وأجازوا أبناءهم وبناتهم في النار، وتعاطوا العرافة والفأل وباعوا أنفسهم لارتكاب الشر في عيني الرب لإثارة غيظه."], [18, "فاحتدم غضب الرب على إسرائيل، وطردهم من حضرته، ولم يبق سوى سبط يهوذا."], [19, "ولكن حتى سبط يهوذا لم يحفظ وصايا الرب إلهه بل نهج في طرق إسرائيل التي سلكتها."], [20, "فنبذ الرب كل ذرية إسرائيل وأذلهم وأسلمهم ليد آسريهم، وطردهم من حضرته."]]}, {"l": "Ezr 9:7", "n": "", "vs": [[7, "فإننا منذ عهد آبائنا وإلى هذا اليوم غارقون في إثم عظيم. ومن جراء معاصينا سطا علينا وعلى ملوكنا وكهنتنا سيف الأمم المحيطة بنا، وتعرضنا للسبي والنهب والعار إلى هذا اليوم."]]}, {"l": "Neh 9:16-18", "n": "", "vs": [[16, "ولكن أسلافنا وآباءنا طغوا وقسوا قلوبهم ولم يطيعوا وصاياك،"], [17, "وأبوا أن يسمعوا، وتجاهلوا عجائبك التي أجريتها لهم، وأغلظوا قلوبهم، ثم تمردوا ونصبوا عليهم قائدا ليرجعوا إلى عبوديتهم، ولكنك إله غفور وحنان ورحيم وحكيم وكثير الإحسان، فلم تتخل عنهم،"], [18, "مع أنهم سبكوا لأنفسهم عجلا وقالوا: «هذا هو إلهكم الذي أخرجكم من مصر!» فاقترفوا بذلك إثما عظيما."]]}, {"l": "Neh 9:26", "n": "", "vs": [[26, "ومع ذلك ثاروا عليك وتمردوا وطرحوا شريعتك خلف ظهورهم، وقتلوا أنبياءك الذين حذروهم وأنذروهم ليرتدوا إليك، وارتكبوا الشرور الفواحش."]]}, {"l": "Neh 9:33-35", "n": "", "vs": [[33, "فقد كنت عادلا في كل ما حل بنا، لأنك عاقبتنا بالحق، ونحن الذين أذنبنا."], [34, "ولم يطع ملوكنا ورؤساؤنا وكهنتنا وآباؤنا شريعتك، ولا استمعوا إلى وصاياك وتحذيراتك التي أنذرتهم بها."], [35, "ولم يعبدوك في ملكهم، ولا حين كانوا يتمتعون بخيرك العميم الذي أنعمت به عليهم، ولا في أرضهم الشاسعة الخصيبة التي بسطتها أمامهم، ولم يرتدوا عن سيئات أعمالهم."]]}, {"l": "Psa 106:16-21", "n": "", "vs": [[16, "ثم حسدوا موسى في المخيم، وأيضا هارون المقدس للرب."], [17, "انفتحت الأرض وابتلعت داثان، وأطبقت على قوم أبيرام."], [18, "واشتعلت نار وسط جماعة قورح، أحرق لهيبها الأشرار."], [19, "صاغوا عجلا في حوريب، وسجدوا لتمثال مسبوك."], [20, "استبدلوا إلههم المجيد بصورة ثور آكل عشب."], [21, "نسوا الله مخلصهم الذي صنع العظائم في مصر،"]]}, {"l": "Psa 106:28", "n": "", "vs": [[28, "وتعلقوا ببعل فغور وأكلوا ذبائح الموتى."]]}, {"l": "Psa 106:32-40", "n": "", "vs": [[32, "ثم أسخطوا الرب عند مياه مريبة (أي الخصومة) حتى تأذى موسى بسببهم،"], [33, "إذ استفزوا روحه فأفرطت شفتاه بالكلام."], [34, "لم يستأصلوا الشعوب مثلما أمرهم الرب."], [35, "بل خالطوا الأمم الوثنية وتعلموا أعمالهم."], [36, "تعبدوا لأوثانهم فصارت لهم فخا."], [37, "ضحوا بأبنائهم وبناتهم للشياطين."], [38, "سفكوا دما بريئا، دم بنيهم وبناتهم الذين ذبحوهم لأصنام الكنعانيين، فتدنست الأرض بالدماء."], [39, "لذلك تنجسوا بأعمالهم، وخانوا الرب بأفعالهم"], [40, "فالتهب غضب الرب على شعبه، ومقت ميراثه."]]}, {"l": "Jer 3:25", "n": "", "vs": [[25, "فلننطرح في خزينا، وليغمرنا عارنا لأننا أخطأنا في حق الرب إلهنا، نحن وآباؤنا منذ صبانا حتى هذا اليوم، ولم نطع صوت الرب إلهنا»."]]}, {"l": "Jer 16:11", "n": "", "vs": [[11, "عندئذ تجيبهم: يقول الرب: لأن أباءكم نبذوني وضلوا وراء الأوثان وعبدوها وسجدوا لها، وتركوني ولم يطبقوا شريعتي."]]}, {"l": "Jer 16:12", "n": "", "vs": [[12, "ولأنكم أنتم أيضا قد أسأتم أكثر من آبائكم، وغوى كل واحد منكم وراء قلبه الشرير العنيد ورفض طاعتي."]]}, {"l": "Jer 44:21", "n": "", "vs": [[21, "«أليس ما أحرقتموه من بخور في مدن يهوذا وفي شوارع أورشليم أنتم وآباؤكم وملوككم ورؤساؤكم وسكان الأرض، هو الذي ذكره الرب وخطر على باله؟"]]}, {"l": "Dan 9:5-13", "n": "", "vs": [[5, "إننا أخطأنا وأثمنا وارتكبنا الشر، وتمردنا وانحرفنا عن وصاياك وأحكامك."], [6, "ولم نسمع لعبيدك الأنبياء الذين باسمك أنذروا ملوكنا ورؤساءنا وآباءنا وجميع شعب الأرض."], [7, "لك أيها السيد البر، ولنا الخزي، كما هو حادث اليوم لرجال يهوذا ولأهل أورشليم، ولسائر بني إسرائيل القريبين والبعيدين، المشتتين في كل البلدان التي أجليتهم إليها عقابا لهم على ما اقترفوه من خيانة في حقك."], [8, "فلنا أيها السيد الخزي، نحن وملوكنا ورؤسائنا وآبائنا، لأننا أخطأنا إليك."], [9, "إنما للرب إلهنا الرحمة والمغفرة لأننا عصيناك."], [10, "ولم نطع صوت الرب إلهنا لنسلك في شرائعه التي أعلنها لنا على لسان عبيده الأنبياء."], [11, "قد تعدى كل شعب إسرائيل على شريعتك، وانحرفوا فلم يسمعوا صوتك، فسكبت علينا اللعنة وما أقسمت أن توقعه بنا، كما نصت عليه شريعة موسى عبد الله، لأننا أخطأنا إليك."], [12, "وقد نفذت قضاءك الذي قضيت به علينا وعلى قضاتنا الذين تولوا أمرنا، جالبا علينا وعلى أورشليم شرا عظيما لم يحدث له مثيل تحت السماء."], [13, "وكما ورد في شريعة موسى، أصابنا جميع هذا البلاء، ولم نستعطف وجهك أيها الرب إلهنا تائبين عن آثامنا ومتنبهين لحقك."]]}, {"l": "Act 7:51", "n": "", "vs": [[51, "ثم قال استفانوس: «ياأصحاب الرقاب الصلبة والقلوب والآذان غير المختونة! إنكم دائما تقاومون الروح القدس. وكما فعل آباؤكم تفعلون!"]]}], "kwAr": "عصتني", "noteAr": ""}], "arS": [["«", []], ["ياابن", ["H1121"]], [" ", []], ["آدم", ["H120"]], ["، ها أنا ", []], ["باعثك", ["H7971"]], [" إلى ", []], ["بني", ["H1121"]], [" ", []], ["إسرائيل", ["H3478"]], ["، إلى ", []], ["أمة", ["H1471"]], [" ", []], ["متمردة", ["H4775"]], [" ", []], ["عصتني", ["H4775"]], ["، إذ ", []], ["تعدوا", ["H6586"]], [" ", []], ["هم", ["H1992"]], [" ", []], ["وآباؤهم", ["H1"]], [" علي إلى ", []], ["هذا", ["H2088"]], [" ", []], ["اليوم", ["H3117"]], [".", []]]}, {"c": 2, "v": 4, "text": "أنا باعثك إلى الأبناء المتصلبين القساة، فتقول لهم: هذا ما يعلنه الرب.", "groups": [{"kw": "they", "raw": "Eze_3:7; Deu_10:16, Deu_31:27; 2Ch_30:8, 2Ch_36:13; Psa_95:8; Isa_48:4; Jer_3:3; Jer_5:3, Jer_6:15, Jer_8:12; Mat_10:16", "note": "", "refs": [{"l": "Eze 3:7", "n": "", "vs": [[7, "لكن شعب إسرائيل لا يودون الاستماع لك، لأنهم لا يودون الاستماع لي، لأنهم جميعا معاندون قساة القلوب."]]}, {"l": "Deu 10:16", "n": "", "vs": [[16, "فطهروا قلوبكم الأثيمة، وأقلعوا عن عنادكم،"]]}, {"l": "Deu 31:27", "n": "", "vs": [[27, "لأني أعرف تمردكم وقساوة قلوبكم. إذ وأنا مازلت حيا معكم اليوم أخذتم في مقاومة الرب. فكم بالأحرى تتمردون بعد موتي؟"]]}, {"l": "2Ch 30:8", "n": "", "vs": [[8, "ولا تعاندوا الآن كآبائكم، بل أذعنوا للرب وادخلوا إلى مقدسه الذي قدسه إلى الأبد، واعبدوا الرب إلهكم فيتحول عنكم غضبه اللاهب."]]}, {"l": "2Ch 36:13", "n": "", "vs": [[13, "وثار أيضا على الملك نبوخذناصر، الذي جعله يحلف له يمين الولاء، وأصر على عناده، وأغلظ قلبه فلم يرجع إلى الرب إله إسرائيل."]]}, {"l": "Psa 95:8", "n": "", "vs": [[8, "فلا تقسوا قلوبكم، كما حدث في يوم مسة (أي الامتحان) في الصحراء،"]]}, {"l": "Isa 48:4", "n": "", "vs": [[4, "لأني عالم بعنادك، وأن رقبتك ذات عضل من حديد وجبهتك من نحاس."]]}, {"l": "Jer 3:3", "n": "", "vs": [[3, "لذلك امتنع عنك الغيث، ولم تهطل أمطار الربيع، ومع ذلك صارت لك جبهة زانية تأبى أن تخجل."]]}, {"l": "Jer 5:3", "n": "", "vs": [[3, "أيها الرب، أليست عيناك تطلبان الحق؟ لقد عاقبتهم ولكنهم لم يتوجعوا. أهلكتهم ولكنهم أبوا التقويم. صلبوا وجوههم أكثر من الصخر، ورفضوا التوبة."]]}, {"l": "Jer 6:15", "n": "", "vs": [[15, "هل خجلوا لأنهم اقترفوا الرجس؟ كلا! لم يخزوا قط ولم يعرفوا الخجل، لذلك سيسقطون بين الساقطين، وحين أعاقبهم يطوح بهم»."]]}, {"l": "Jer 8:12", "n": "", "vs": [[12, "هل خجلوا عندما اقترفوا الرجس؟ كلا! لم يخزوا قط ولم يعرفوا الخجل. لذلك سيسقطون بين الساقطين، وحين أعاقبهم يطوح بهم»، يقول الرب."]]}, {"l": "Mat 10:16", "n": "", "vs": [[16, "ها أنا أرسلكم مثل الخراف بين الذئاب، فكونوا متنبهين كالحيات ومسالمين كالحمام."]]}], "kwAr": "الأبناء", "noteAr": ""}, {"kw": "impudent", "raw": "Heb. hard of face, Pro_21:29", "note": "Heb. hard of face, Pro_21:29", "refs": [{"l": "Pro 21:29", "n": "", "vs": [[29, "الرجل الشرير يغلظ وجهه، أما المستقيم فيعمل على تقويم طرقه."]]}], "kwAr": "المتصلبين القساة", "noteAr": "بالعبرية: قساة الوجه. انظر أم 21: 29"}, {"kw": "Thus", "raw": "1Ki_22:14; Jer_26:2, Jer_26:3; Act_20:26, Act_20:27", "note": "", "refs": [{"l": "1Ki 22:14", "n": "", "vs": [[14, "فأجاب ميخا: «حي هو الرب إنني لن أنطق إلا بما يقوله الرب»."]]}, {"l": "Jer 26:2", "n": "", "vs": [[2, "هذا ما يعلنه الرب: «قف في ساحة هيكل الرب، وبلغ كل أهل مدن يهوذا القادمين للعبادة في هيكل الرب بجميع الكلام الذي أمرتك أن تخاطبهم به. وإياك أن تحذف كلمة."]]}, {"l": "Jer 26:3", "n": "", "vs": [[3, "لعلهم يسمعون ويرجع كل واحد منهم عن طريقه الأثيم، فأمتنع عن الشر الذي نويت أن أوقعه بهم لسوء أعمالهم»."]]}, {"l": "Act 20:26", "n": "", "vs": [[26, "لذلك أشهد لكم اليوم أني بريء من دمكم جميعا،"]]}, {"l": "Act 20:27", "n": "", "vs": [[27, "لأني لم أمتنع عن إبلاغكم جميع مقاصد الله."]]}], "kwAr": "هذا ما يعلنه", "noteAr": ""}], "arS": [["أنا", ["H589"]], [" ", []], ["باعثك", ["H7971"]], [" إلى ", []], ["الأبناء", ["H1121"]], [" ", []], ["المتصلبين", ["H2389"]], [" ", []], ["القساة", ["H7186", "H3820"]], ["، ", []], ["فتقول", ["H559"]], [" لهم: ", []], ["هذا", ["H3541"]], [" ما ", []], ["يعلنه", ["H559"]], [" ", []], ["الرب", ["H3069"]], [".", []]]}, {"c": 2, "v": 5, "text": "فإن سمعوا، أو أبوا لأنهم شعب عاص فإنهم يعلمون على الأقل أن نبيا بينهم.", "groups": [{"kw": "whether", "raw": "Eze_2:7, Eze_3:10,Eze_3:11, Eze_3:27; Mat_10:12-15; Act_13:46; Rom_3:3; 2Co_2:15-17", "note": "", "refs": [{"l": "Eze 2:7", "n": "", "vs": [[7, "إنما عليك أن تبلغهم كلامي سواء سمعوا أو أبوا، لأنهم شعب متمرد."]]}, {"l": "Eze 3:10", "n": "", "vs": [[10, "ثم أردف قائلا: «ياابن آدم، استوعب في قلبك كل ما أحدثك به من كلام، واستمع إليه بأذنين مرهفتين."]]}, {"l": "Eze 3:11", "n": "", "vs": [[11, "وامض إلى المسبيين من أبناء شعبك وقل لهم: هذا ما يعلنه السيد الرب. سواء سمعوا لك أو أبوا»."]]}, {"l": "Eze 3:27", "n": "", "vs": [[27, "ولكن عندما أخاطبك، أفتح فمك فتقول لهم: هذا ما يعلنه الرب، من يسمع فليسمع، ومن يأب فليمتنع، لأنهم شعب متمرد»."]]}, {"l": "Mat 10:12-15", "n": "", "vs": [[12, "وعندما تدخلون بيتا، ألقوا السلام عليه."], [13, "فإذا كان ذلك البيت مستحقا فعلا، فليحل سلامكم عليه. وإن لم يكن مستحقا، فليرجع سلامكم لكم"], [14, "وإن كان أحد لا يقبلكم ولا يسمع كلامكم في بيت أو مدينة، فاخرجوا من هناك، وانفضوا الغبار عن أقدامكم."], [15, "الحق أقول لكم: إن حالة مدينتي سدوم وعمورة سوف تكون في يوم الدينونة أخف وطأة من حالة تلك المدينة."]]}, {"l": "Act 13:46", "n": "", "vs": [[46, "فخاطبهم بولس وبرنابا بجرأة قائلين: «كان يجب أن نبلغكم أنتم أولا كلمة الله، ولكنكم رفضتموها فأظهرتم أنكم لا تستحقون الحياة الأبدية. وها نحن نتوجه إلى غير اليهود!"]]}, {"l": "Rom 3:3", "n": "", "vs": [[3, "فماذا يحدث؟ إن كان بعضهم قد أساءوا الأمانة، فهل يعطل عدم أمانتهم أمانة الله؟"]]}, {"l": "2Co 2:15-17", "n": "", "vs": [[15, "فإننا رائحة المسيح الطيبة المرتفعة إلى الله، المنتشرة على السواء عند الذين يخلصون وعند الذين يهلكون:"], [16, "هؤلاء يشمون فيها رائحة من الموت وإلى الموت، وأولئك رائحة من الحياة وإلى الحياة. ومن هو صاحب الكفاءة لتأدية هذه الأمور؟"], [17, "فإننا لا نتاجر بكلمة الله كما يفعل الكثيرون، وإنما بإخلاص ومن قبل الله، وأمام الله، نتكلم في المسيح."]]}], "kwAr": "فإن سمعوا", "noteAr": ""}, {"kw": "yet", "raw": "Eze_3:19, Eze_33:9, Eze_33:33; Luk_10:10-12; Joh_15:22", "note": "", "refs": [{"l": "Eze 3:19", "n": "", "vs": [[19, "لكن إن أنذرت الشرير ولم يرجع عن شره وعن طرقه الأثيمة، فإنه يموت بذنبه، وتنجو أنت بنفسك."]]}, {"l": "Eze 33:9", "n": "", "vs": [[9, "ولكن إن حذرت الشرير ليرتدع عن طريقه فأبى فهو يموت بذنبه، أما أنت فتكون قد خلصت نفسك."]]}, {"l": "Eze 33:33", "n": "", "vs": [[33, "وإذا تحقق هذا، وهو لابد أن يتم، يدركون أن نبيا كان بينهم»."]]}, {"l": "Luk 10:10-12", "n": "", "vs": [[10, "وأية مدينة دخلتم ولم يقبلكم أهلها، فاخرجوا إلى شوارعها، وقولوا:"], [11, "حتى غبار مدينتكم العالق بأقدامنا ننفضه عليكم، ولكن اعلموا هذا: أن ملكوت الله قد اقترب!"], [12, "أقول لكم: إن سدوم ستكون حالتها في ذلك اليوم أخف وطأة من حالة تلك المدينة…"]]}, {"l": "Joh 15:22", "n": "", "vs": [[22, "لو لم آت وأكلمهم، لما كانت لهم خطيئة؛ ولكن لا عذر لهم الآن في خطيئتهم."]]}], "kwAr": "فإنهم يعلمون", "noteAr": ""}], "arS": [["فإن ", []], ["سمعوا", ["H8085"]], ["، أو ", []], ["أبوا", ["H2308"]], [" ", []], ["لأنهم", ["H3588", "H1992"]], [" ", []], ["شعب", ["H1004"]], [" ", []], ["عاص", ["H4805"]], [" فإنهم ", []], ["يعلمون", ["H3045"]], [" على الأقل أن ", []], ["نبيا", ["H5030"]], [" ", []], ["بينهم", ["H8432"]], [".", []]]}, {"c": 2, "v": 6, "text": "أما أنت، ياابن آدم، فلا ترهبهم ولا تخش كلامهم، وإن كانوا لك قريسا وشوكا. وأنت ساكن بين عقارب، فلا ترهب كلامهم، ولا تفزع من محضرهم لأنهم شعب متمرد.", "groups": [{"kw": "be not", "raw": "Eze_3:8, Eze_3:9; 2Ki_1:15; Isa_51:12; Jer_1:8, Jer_1:17; Mic_3:8; Mat_10:28; Luk_12:4; Act_4:13, Act_4:19, Act_4:29; Eph_6:19; Phi_1:28; 2Ti_1:7", "note": "", "refs": [{"l": "Eze 3:8", "n": "", "vs": [[8, "ها أنا قد جعلت وجهك صلبا مثل وجوههم، وجبهتك قاسية مثل جباههم."]]}, {"l": "Eze 3:9", "n": "", "vs": [[9, "قد جعلت جبهتك في صلابة الماس، أقسى من الصوان، فلا تخف منهم ولا ترتعب من مرآهم لأنهم شعب متمرد»."]]}, {"l": "2Ki 1:15", "n": "", "vs": [[15, "فقال ملاك الرب لإيليا: «امض معه ولا تخف منه». فقام وانطلق معه لمقابلة الملك."]]}, {"l": "Isa 51:12", "n": "", "vs": [[12, "أنا، أنا هو معزيكم، فمن أنت حتى تخشي إنسانا فانيا أو بشرا يبيدون كالعشب؟"]]}, {"l": "Jer 1:8", "n": "", "vs": [[8, "لا تخف من حضرتهم لأني أنا معك لأنقذك»."]]}, {"l": "Jer 1:17", "n": "", "vs": [[17, "أما أنت فتأهب، وقم وكلمهم بكل ما آمرك به. لا تخف من حضرتهم لئلا أفزعك أمامهم."]]}, {"l": "Mic 3:8", "n": "", "vs": [[8, "أما أنا، فإني ممتليء بقوة روح الرب وبالحق والعزة، لأعلن لنسل يعقوب معاصيه ولإسرائيل خطيئته."]]}, {"l": "Mat 10:28", "n": "", "vs": [[28, "لا تخافوا الذين يقتلون الجسد، ولكنهم يعجزون عن قتل النفس، بل بالأحرى خافوا القادر أن يهلك النفس والجسد جميعا في جهنم."]]}, {"l": "Luk 12:4", "n": "", "vs": [[4, "على أني أقول لكم ياأحبائي: لا تخافوا من الذين يقتلون الجسد ثم لا يستطيعون أن يفعلوا أكثر من ذلك."]]}, {"l": "Act 4:13", "n": "", "vs": [[13, "فتعجب المجتمعون من جرأة بطرس ويوحنا، لما عرفوا أنهما غير متعلمين وأنهما من عامة الشعب، فأدركوا أنهما كانا مع يسوع."]]}, {"l": "Act 4:19", "n": "", "vs": [[19, "ولكن بطرس ويوحنا قالا: «احكموا أنتم: أمن الحق أمام الله أن نطيع أمركم لا أمر الله؟"]]}, {"l": "Act 4:29", "n": "", "vs": [[29, "والآن انظر، يارب، إلى تهديدهم، وهبنا نحن عبيدك أن نعلن كلامك بكل جرأة،"]]}, {"l": "Eph 6:19", "n": "", "vs": [[19, "ولأجلي كي ألهم ما أنطق به كلما فتحت فمي لأعلن بجرأة سر الإنجيل"]]}, {"l": "Phi 1:28", "n": "", "vs": [[28, "غير مرتعبين في شيء من الذين يقاومونكم، فإن في مقاومتهم دليلا على هلاكهم هم وعلى خلاصكم أنتم، وذلك من عند الله."]]}, {"l": "2Ti 1:7", "n": "", "vs": [[7, "فإن الله قد أعطانا لا روح الجبن بل روح القوة والمحبة والبصيرة."]]}], "kwAr": "فلا ترهبهم", "noteAr": ""}, {"kw": "briers", "raw": "or, rebels, 2Sa_23:6, 2Sa_23:7; Isa_9:18; Jer_6:28; Mic_7:4", "note": "or, rebels, 2Sa_23:6, 2Sa_23:7; Isa_9:18; Jer_6:28; Mic_7:4", "refs": [{"l": "2Sa 23:6", "n": "", "vs": [[6, "أما الأشرار فيطرحون جميعا كالشوك، لأنهم (يجرحون) اليد التي تلمسهم."]]}, {"l": "2Sa 23:7", "n": "", "vs": [[7, "وكل من يمسهم يتسلح بحديد وقناة رمح، وتلتهمهم النار جميعا في مكانهم»."]]}, {"l": "Isa 9:18", "n": "", "vs": [[18, "لأن الفجور يحرق كالنار فتلتهم الشوك والحسك بل تشعل أجمات الغابة فتتصاعد منها سحب الدخان."]]}, {"l": "Jer 6:28", "n": "", "vs": [[28, "فكلهم عصاة متمردون ساعون في النميمة. هم نحاس وحديد وكلهم فاسدون."]]}, {"l": "Mic 7:4", "n": "", "vs": [[4, "أفضلهم مثل العوسج، وأكثرهم استقامة أسوأ من سياج الشوك. وها يوم عقابكم الذي أنذر به أنبياؤكم قد وافى. عندئذ يعتريكم الارتباك."]]}], "kwAr": "قريسا وشوكا", "noteAr": "أو: متمردون. انظر 2صم 23: 6، 7؛ إش 9: 18؛ إر 6: 28؛ مي 7: 4"}, {"kw": "scorpions", "raw": "Luk_10:19; Rev_9:3-6", "note": "", "refs": [{"l": "Luk 10:19", "n": "", "vs": [[19, "وها أنا قد أعطيتكم سلطة لتدوسوا الحيات والعقارب وقدرة العدو كلها، ولن يؤذيكم شيء أبدا."]]}, {"l": "Rev 9:3-6", "n": "", "vs": [[3, "وطلع من الدخان جراد على الأرض، وأعطي سلطة أن يلسع كالعقارب،"], [4, "وأمر ألا يضر عشب الأرض ولا مزروعاتها ولا أشجارها بل فقط جميع من ليس على جباههم ختم الله،"], [5, "فيعذبهم دون أن يقتلهم، مدة خمسة أشهر. والألم الذي يسببه يشبه ألم لدغة العقرب."], [6, "وفي أثناء تلك الشهور يحاول الناس أن يتخلصوا من حياتهم فلا يقدرون! ويتمنون أن يموتوا، لكن الموت يهرب منهم."]]}], "kwAr": "عقارب", "noteAr": ""}, {"kw": "though they", "raw": "Eze_3:9, Eze_3:26, Eze_3:27; Pro_30:13, Pro_30:14; Isa_51:7; Jer_18:18; Amo_7:10-17; Heb_11:27; 1Pe_3:14", "note": "", "refs": [{"l": "Eze 3:9", "n": "", "vs": [[9, "قد جعلت جبهتك في صلابة الماس، أقسى من الصوان، فلا تخف منهم ولا ترتعب من مرآهم لأنهم شعب متمرد»."]]}, {"l": "Eze 3:26", "n": "", "vs": [[26, "وألصق لسانك بحنكك فتبكم وتكف عن تقريعهم لأنهم شعب متمرد."]]}, {"l": "Eze 3:27", "n": "", "vs": [[27, "ولكن عندما أخاطبك، أفتح فمك فتقول لهم: هذا ما يعلنه الرب، من يسمع فليسمع، ومن يأب فليمتنع، لأنهم شعب متمرد»."]]}, {"l": "Pro 30:13", "n": "", "vs": [[13, "رب جيل: لشد ما هو متشامخ العيون ومتعالي النظرات."]]}, {"l": "Pro 30:14", "n": "", "vs": [[14, "رب جيل أسنانه مرهفة كالسيوف، وأنيابه حادة كالسكاكين، ليفترس المساكين في الأرض والبائسين من بين أبناء البشر."]]}, {"l": "Isa 51:7", "n": "", "vs": [[7, "استمعوا إلي ياعارفي البر، أيها الشعب الذي شريعتي في قلوبكم. لا تخشوا تعيير الناس ولا ترتعبوا من شتائمهم،"]]}, {"l": "Jer 18:18", "n": "", "vs": [[18, "ثم قالوا: «تعالوا نتآمر على إرميا، لأن الشريعة لا تبيد عن الكاهن، ولا المشورة عن الحكيم، ولا الوحي عن النبي. تعالوا نلذعه بوخزات اللسان ونصم آذاننا عن كلامه»."]]}, {"l": "Amo 7:10-17", "n": "", "vs": [[10, "فأرسل أمصيا كاهن بيت إيل إلى يربعام ملك إسرائيل قائلا: «قد تآمر عليك عاموس في وسط بيت إسرائيل، ولا تطيق الأرض تحمل كل تنبؤاته"], [11, "لأن هذا ما يقوله عاموس: إن يربعام يموت بحد السيف، ويسبى إسرائيل بعيدا عن دياره»."], [12, "ثم قال أمصيا لعاموس: «اهرب أيها الرائي إلى أرض يهوذا، وكل خبزا هناك وتنبأ فيها."], [13, "أما بيت إيل فلا تعد للتنبوء فيها، لأنها مقدس الملك ومقر المملكة»."], [14, "فأجاب عاموس: «أنا لم أكن نبيا ولا ابن نبي، إنما أنا راعي غنم وجاني جميز،"], [15, "فاصطفاني الرب من وراء الغنم وأمرني قائلا: اذهب تنبأ لشعبي إسرائيل."], [16, "لذلك اسمع الآن كلمة الرب: أنت تقول لا تتنبأ ضد إسرائيل ولا تهاجم بيت إسحاق."], [17, "لهذا يقول الرب: ستصبح امرأتك عاهرة في المدينة، ويقتل أبناؤك وبناتك بالسيف، وتقسم أرضك بالحبل. أما أنت فتموت في أرض الأمم الوثنية، ويسبى إسرائيل إلى أرض بعيدة عن دياره»."]]}, {"l": "Heb 11:27", "n": "", "vs": [[27, "بالإيمان، ترك أرض مصر وهو غير خائف من غضب الملك. فقد مضى في تنفيذ قراره، كأنه يرى بجانبه الله غير المنظور."]]}, {"l": "1Pe 3:14", "n": "", "vs": [[14, "وإن كان لابد أن تتألموا في سبيل البر، فطوبى لكم! لا تخافوا من تهديد الذين يضطهدونكم، ولا تقلقوا."]]}], "kwAr": "لأنهم شعب متمرد", "noteAr": ""}], "arS": [["أما أنت، ", []], ["ياابن", ["H1121"]], [" ", []], ["آدم", ["H120"]], ["، فلا ", []], ["ترهبهم", ["H3372", "H408"]], [" ولا ", []], ["تخش", ["H3372"]], [" ", []], ["كلامهم", ["H1697"]], ["، وإن كانوا لك ", []], ["قريسا", ["H5621"]], [" ", []], ["وشوكا", ["H5544"]], [". وأنت ", []], ["ساكن", ["H3427"]], [" بين ", []], ["عقارب", ["H6137"]], ["، فلا ", []], ["ترهب", ["H3372", "H408"]], [" ", []], ["كلامهم", ["H1697"]], ["، ولا ", []], ["تفزع", ["H2865"]], [" من ", []], ["محضرهم", ["H6440"]], [" ", []], ["لأنهم", ["H3588", "H1992"]], [" ", []], ["شعب", ["H1004"]], [" ", []], ["متمرد", ["H4805"]], [".", []]]}, {"c": 2, "v": 7, "text": "إنما عليك أن تبلغهم كلامي سواء سمعوا أو أبوا، لأنهم شعب متمرد.", "groups": [{"kw": "thou", "raw": "Eze_3:10,Eze_3:17; Jer_1:7, Jer_1:17, Jer_23:28, Jer_26:2; Jon_3:2; Mat_28:20", "note": "", "refs": [{"l": "Eze 3:10", "n": "", "vs": [[10, "ثم أردف قائلا: «ياابن آدم، استوعب في قلبك كل ما أحدثك به من كلام، واستمع إليه بأذنين مرهفتين."]]}, {"l": "Eze 3:17", "n": "", "vs": [[17, "«ياابن آدم، قد جعلتك رقيبا لشعب إسرائيل، فأصغ إلى كلمتي وأنذرهم بها على لساني."]]}, {"l": "Jer 1:7", "n": "", "vs": [[7, "ولكن الرب أجابني: «لا تقل إني لست سوى ولد، لأنك ستذهب إلى كل من أبعث بك إليه، وتنطق بكل ما آمرك به."]]}, {"l": "Jer 1:17", "n": "", "vs": [[17, "أما أنت فتأهب، وقم وكلمهم بكل ما آمرك به. لا تخف من حضرتهم لئلا أفزعك أمامهم."]]}, {"l": "Jer 23:28", "n": "", "vs": [[28, "فليقص النبي الحالم حلمه. ولكن من لديه كلمتي فليعلنها بالحق، إذ ماذا يجمع بين التبن والحنطة؟"]]}, {"l": "Jer 26:2", "n": "", "vs": [[2, "هذا ما يعلنه الرب: «قف في ساحة هيكل الرب، وبلغ كل أهل مدن يهوذا القادمين للعبادة في هيكل الرب بجميع ال ماتك أكلتها فأصبحت لي بهجة ومسرة لقلبي، لأني دعيت باسمك أيها الرب الإله القدير."]]}, {"l": "Joh 6:53-63", "n": "", "vs": [[53, "فأجابهم يسوع: «الحق الحق أقول لكم: إذا لم تأكلوا جسد ابن الإنسان وتشربوا دمه فلا حياة لكم في داخلكم."], [54, "من يأكل جسدي ويشر ب دمي، فله حياة أبدية، وأنا أقيمه في اليوم الأخير،"], [55, "لأن جسدي هو الطعام الحقيقي، ودمي هو الشراب الحقيقي."], [56, "وكل من يأكل جسدي ويشرب دمي، يثبت في وأنا فيه."], [57, "وكما أني أحيا بالآب الحي الذي أرسلني، فكذلك يحيا بي من يأكلني."], [58, "هذا هو الخبز الذي نزل من السماء، وهو ليس كالمن الذي أكله أباؤكم ثم ماتوا. فالذي يأكل هذا الخبز يحيا إلى الأبد»."], [59, "هذا كله قاله يسوع في المجمع وهو يعلم في كفرناحوم."], [60, "فلما سمعه كثيرون من تلاميذه قالوا: «ما أصعب هذا الكلام! من يطيق سماعه؟»"], [61, "فعلم يسوع في نفسه أن تلاميذه يتذمرون، فسألهم: «أهذا يبعث الشكوك في نفوسكم؟"], [62, "فماذا لو رأيتم ابن الإنسان صاعدا إلى حيث كان قبلا؟"], [63, "الروح هو الذي يعطي الحياة، أما الجسد فلا يفيد شيئا. الكلام الذي كلمتكم به هو روح وحيا ة."]]}], "kwAr": "فالتهمته", "noteAr": ""}, {"kw": "it was", "raw": "Job_23:12; Psa_19:10, Psa_119:97, Psa_119:103; Pro_2:10,Pro_2:11; Rev_10:9, Rev_10:10", "note": "", "refs": [{"l": "Job 23:12", "n": "", "vs": [[12, "لم أتعد على وصاياه، وذخرت في قلبي كلماته."]]}, {"l": "Psa 19:10", "n": "", "vs": [[10, "إنها أشهى من الذهب النقي، وهي أحلى من العسل بل القطر السائل من أقراص الشهد."]]}, {"l": "Psa 119:97", "n": "", "vs": [[97, "كم أحببت شريعتك، إنها موضوع تأملي طول النهار."]]}, {"l": "Psa 119:103", "n": "", "vs": [[103, "ما أحلى أقوالك لمذاقي. إنها أحلى من العسل في فمي."]]}, {"l": "Pro 2:10", "n": "", "vs": [[10, "إن استقرت الحكمة في قلبك واستلذت نفسك المعرفة،"]]}, {"l": "Pro 2:11", "n": "", "vs": [[11, "يرعاك التعقل، ويحرسك الفهم."]]}, {"l": "Rev 10:9", "n": "", "vs": [[9, "فذهبت إليه وطلبت الكتاب منه، فأجابني: «خذه والتهمه. ستجد طعمه في فمك حلوا كالعسل، ولكنه سيجعل بطنك مرا!»"]]}, {"l": "Rev 10:10", "n": "", "vs": [[10, "ولما أخذته من يده والتهمته، كان حلوا كالعسل في فمي، ولكن ما إن ابتلعته "groups": [{"kw": "thou", "raw": "Jon_1:2, Jon_3:2-4; Act_26:17, Act_26:18", "note": "", "refs": [{"l": "Jon 1:2", "n": "", "vs": [[2, "«هيا امض إلى نينوى المدينة العظيمة وبلغ أهلها قضائي، لأن إثمهم قد صعد إلي»."]]}, {"l": "Jon 3:2-4", "n": "", "vs": [[2, "«قم امض إلى نينوى المدينة العظيمة، وأعلن لهم الرسالة التي أبلغك إياها»."], [3, "فهب يونان وتوجه إلى نينوى بموجب أمر الرب. وكانت نينوى مدينة بالغة العظمة يستغرق اجتيازها ثلاثة أيام."], [4, "فدخل يونان المدينة واجتاز فيها مسيرة يوم واحد، وابتدأ ينادي قائلا: «بعد أربعين يوما تتدمر المدينة»."]]}, {"l": "Act 26:17", "n": "", "vs": [[17, "وسأنقذك من شعبك ومن الأمم التي أرسلك إليها الآن،"]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}], "kwAr": "إنك لست مرسلا", "noteAr": ""}, {"kw": "of a strange speech and of an hard language", "raw": "Heb. deep of lip and heavy of tongue, and so, Eze_3:6; Psa_81:5; Isa_33:19", "note": "Heb. deep of lip and heavy of tongue, and so, Eze_3:6; Psa_81:5; Isa_33:19", "refs": [{"l": "Eze 3:6", "n": "", "vs": [[6, "ولا إلى شعوب كثيرة غريبة اللهجات ومبهمة اللغات لا تفهم كلامهم. حقا لو أرسلتك إلى هؤلاء لسمعوا لك!"]]}, {"l": "Psa 81:5", "n": "", "vs": [[5, "جعله شهادة له بين (قوم) يوسف، عندما ضرب مصر، حيث سمعنا لغة لم نعرفها تقول:"]]}, {"l": "Isa 33:19", "n": "", "vs": [[19, "لن ترى الشعب الشرس فيما بعد، الذي يتكلم لغة أجنبية لا تفهمها."]]}], "kwAr": "أمة ذات لهجة غريبة ولغة مبهمة", "noteAr": "بالعبرية: عميقة الشفة وثقيلة اللسان. وكذلك في الآية التالية. انظر مز 81: 5؛ إش 33: 19"}], "arS": [["فإنك لست ", []], ["مرسلا", ["H7971"]], [" إلى ", []], ["أمة", ["H5971"]], [" ذات ", []], ["لهجة", ["H8193"]], [" ", []], ["غريبة", ["H6012"]], [" ", []], ["ولغة", ["H3956"]], [" ", []], ["مبهمة", ["H3515"]], ["، بل إلى ", []], ["شعب", ["H1004"]], [" ", []], ["إسرائيل", ["H3478"]], ["،", []]]}, {"c": 3, "v": 6, "text": "ولا إلى شعوب كثيرة غريبة اللهجات ومبهمة اللغات لا تفهم كلامهم. حقا لو أرسلتك إلى هؤلاء لسمعوا لك!", "groups": [{"kw": "of a strange speech and of an hard language", "raw": "Heb. deep of lip and heavy of language. Surely, etc. or, If I had sent thee to them, would they not have hearkened? etc. Jon_3:5-10; Mat_11:20-24, Mat_12:41, Mat_12:42; Luk_11:30-32; Act_27:28; Rom_9:30-33", "note": "Heb. deep of lip and heavy of language. Surely, etc. or, If I had sent thee to them, would they not have hearkened? etc. Jon_3:5-10; Mat_11:20-24, Mat_12:41, Mat_12:42; Luk_11:30-32; Act_27:28; Rom_9:30-33", "refs": [{"l": "Jon 3:5-10", "n": "", "vs": [[5, "فآمن شعب نينوى بالرب، وأعلنوا الصيام وارتدوا المسوح من كبيرهم إلى صغيرهم ."], [6, "ثم بلغ إنذار النبي ملك نينوى، فقام عن عرشه وخلع عنه حلته، وارتدى المسح وجلس على الرماد."], [7, "وأذاع في كل نينوى مرسوما ورد فيه: «بأمر من الملك ونبلائه، يمتنع الناس عن الأكل والشرب، وكذلك البهائم والغنم والبقر، لا ترع ولا تشرب ماء."], [8, "وعلى جميع الناس والبهائم أن يرتدوا المسوح، متضرعين إلى الله تائبين عن طرقهم الشريرة وعما ارتكبوه من ظلم."], [9, "لعل الرب يرجع فيعدل عن احتدام سخطه فلا نهلك»."], [10, "فلما رأى الله أعمالهم وتوبتهم عن طرقهم الآثمة عدل عن العقاب الذي كان مزمعا أن يوقعه بهم وعفا عنهم."]]}, {"l": "Mat 11:20-24", "n": "", "vs": [[20, "ثم بدأ يسوع يوبخ المدن التي جرت فيها أكثر معجزاته، لكون أهلها لم يتوبوا."], [21, "فقال: «الويل لك ياكورزين! الويل لك يابيت صيدا! فلو أجري في صور وصيدا ما أجري فيكما من المعجزات، لتاب أهلهما منذ القديم متشحين بالمسوح في وسط الرماد."], [22, "ولكني أقول لكم: إن حالة صور وصيدا في الدينونة، ستكون أخف وطأة من حالتكما!"], [23, "وأنت ياكفر ناحوم: هل ارتفعت حتى السماء؟ إنك إلى قعر الهاوية ستهبطين. فلو جرى في سدوم ما جرى فيك من المعجزات، لبقيت حتى اليوم."], [24, "ولكني أقول لكم إن حالة بلاد سدوم في يوم الدينونة، ستكون أخف وطأة من حالتك! »"]]}, {"l": "Mat 12:41", "n": "", "vs": [[41, "سيقف أهل نينوى يوم الدينونة مع هذا الجيل ويدينونه؛ لأنهم تابوا لما أنذرهم يونان. وها هنا أعظم من يونان!"]]}, {"l": "Mat 12:42", "n": "", "vs": [[42, "وستقوم ملكة الجنوب يوم الدينونة مع هذا الجيل وتدينه، لأنها جاءت من أقصى الأرض لتسمع حكمة سليمان. وها هنا أعظم من سليمان!"]]}, {"l": "Luk 11:30-32", "n": "", "vs": [[30, "فإنه كما كان يونان آية لأهل نينوى، فهكذا أيضا يكون ابن الإنسان لهذا الجيل."], [31, "إن ملكة الجنوب ستقوم في الدينونة مع هذا الجيل وتدينه لأنها جاءت من أقاصي الأرض لتسمع حكمة سليمان. وها هنا أعظم من سليمان!"], [32, "وأهل نينوى سيقفون في الدينونة مع هذا الجيل ويدينونه: لأنهم تابوا لدى وعظ يونان لهم. وها هنا أعظم من يونان."]]}, {"l": "Act 27:28", "n": "", "vs": [[28, "فقاسوا عمق المياه فوجدوه عشرين قامة. وبعد قليل قاسوا العمق فوجدوه خمس عشرة قامة."]]}, {"l": "Rom 9:30-33", "n": "", "vs": [[30, "فما هي خلاصة القول؟ إن الأمم الذين لم يكونوا يسعون وراء البر، قد بلغوا البر، ولكنه البر القائم على أساس الإيمان."], [31, "أما إسرائيل، وقد كانوا يسعون وراء شريعة تهدف إلى البر، فقد فشلوا حتى في بلوغ الشريعة."], [32, "ولأي سبب؟ لأن سعيهم لم يكن على أساس الإيمان، بل كان وكأن الأمر قائم على الأعمال. فقد تعثروا بحجر العثرة،"], [33, "كما كتب: «ها أنا واضع في صهيون حجر عثرة وصخرة سقوط. ومن يؤمن به لا يخيب»."]]}], "kwAr": "شعوب كثيرة غريبة اللهجات ومبهمة اللغات", "noteAr": "بالعبرية: عميقة الشفة وثقيلة اللغة. حقا، إلخ، أو: لو أرسلتك إليهم ألم يكونوا يسمعون لك؟ إلخ. انظر يون 3: 5-10؛ مت 11: 20-24؛ 12: 41، 42؛ لو 11: 30-32؛ أع 27: 28؛ رو 9: 30-33"}], "arS": [["ولا إلى ", []], ["شعوب", ["H5971"]], [" ", []], ["كثيرة", ["H7227"]], [" ", []], ["غريبة", ["H6012"]], [" ", []], ["اللهجات", ["H8193"]], [" ", []], ["ومبهمة", ["H3515"]], [" ", []], ["اللغات", ["H3956"]], [" لا ", []], ["تفهم", ["H8085"]], [" ", []], ["كلامهم", ["H1697"]], [". ", []], ["حقا", ["H518", "H3808"]], [" لو ", []], ["أرسلتك", ["H7971"]], [" إلى هؤلاء ", []], ["لسمعوا", ["H8085"]], [" لك!", []]]}, {"c": 3, "v": 7, "text": "لكن شعب إسرائيل لا يودون الاستماع لك، لأنهم لا يودون الاستماع لي، لأنهم جميعا معاندون قساة القلوب.", "groups": [{"kw": "Israel will", "raw": "1Sa_8:7; Jer_25:3, Jer_25:4, Jer_44:4, Jer_44:5, Jer_44:16; Luk_10:16, Luk_13:34, Luk_19:14; Joh_5:40-47; Joh_15:20-24", "note": "", "refs": [{"l": "1Sa 8:7", "n": "", "vs": [[7, "فقال الرب له: «لب للشعب طلبه وانزل عند رغبتهم، لأنهم لم يرفضوك أنت بل إياي رفضوا، لكي لا أملك عليهم."]]}, {"l": "Jer 25:3", "n": "", "vs": [[3, "«على مدى ثلاث وعشرين سنة، أي مند السنة الثالثة عشرة من حكم يوشيا بن آمون ملك يهوذا، وحتى هذا اليوم، والرب يوحي إلي بكلمته، فخاطبتكم بها تكرارا منذ البدء ولكنكم لم تسمعوا."]]}, {"l": "Jer 25:4", "n": "", "vs": [[4, "ومع أن الرب قد واظب على إرسال عبيده الأنبياء إليكم، فإنكم لم تصغوا ولم تستمعوا لإنذاراته."]]}, {"l": "Jer 44:4", "n": "", "vs": [[4, "وقد أرسلت إليكم منذرا منذ البدء جميع عبيدي الأنبياء قائلا: لا تقترفوا رجسا مثل هذا لأني أمقته،"]]}, {"l": "Jer 44:5", "n": "", "vs": [[5, "فلم يرتدعوا ولا سمعوا ليتوبوا ويكفوا عن إحراق البخور لتلك الأصنام،"]]}, {"l": "Jer 44:16", "n": "", "vs": [[16, "«لن نطيعك في ما خاطبتنا به من كلام باسم الرب،"]]}, {"l": "Luk 10:16", "n": "", "vs": [[16, "من يسمع لكم يسمع لي، ومن يرفضكم يرفضني؛ ومن يرفضني يرفض الذي أرسلني! »"]]}, {"l": "Luk 13:34", "n": "", "vs": [[34, "ياأورشليم، ياأورشليم، ياقاتلة الأنبياء وراجمة المرسلين إليها؛ كم مرة أردت أن أجمع أولادك معا كما تجمع الدجاجة فراخها تحت جناحيها، ولكنكم لم تريدوا!"]]}, {"l": "Luk 19:14", "n": "", "vs": [[14, "ولكن أهل بلده كانوا يبغضونه، فأرسلوا في إثره وفدا، قائلين: لا نريد أن يملك هذا علينا!"]]}, {"l": "Joh 5:40-47", "n": "", "vs": [[40, "ولكنكم ترفضون أن تأتوا إلي لتكون لكم الحياة."], [41, "لست أقبل مجدا من عند الناس."], [42, "ولكني أعرفكم، وأعرف أن محبة الله ليست في نفوسكم."], [43, "فقد جئت باسم أبي ولم تقبلوني، ولكنكم ترحبون بمن يجيء باسم نفسه."], [44, "من أين لكم أن تؤمنوا بي وأنتم تقبلون المجد بعضكم من بعض، دون أن تسعوا في طلب المجد الذي لا يمنحه إلا الله !"], [45, "لا تظنوا أني أشكوكم إلى الآب، فإن هنالك من يشكوكم، وهو موسى الذي علقتم عليه رجاءكم."], [46, "فلو كنتم صدقتم موسى، لكنتم صدقتموني، لأنه هو كتب عني."], [47, "وإذا كنتم لا تصدقون ما كتبه موسى، فكيف تصدقون كلامي؟»"]]}, {"l": "Joh 15:20-24", "n": "", "vs": [[20, "اذكروا الكلمة التي قلتها لكم: ليس عبد أعظم من سيده. فإن كان أهل العالم قد اضطهدوني، فسوف يضطهدونكم؛ وإن كانوا قد عملوا بكلمتي، فسوف يعملون بكلمتكم."], [21, "ولكنهم سيفعلون هذا كله بكم من أجل اسمي، لأنهم لا يعرفون الذي أرسلني."], [22, "لو لم آت وأكلمهم، لما كانت لهم خطيئة؛ ولكن لا عذر لهم الآن في خطيئتهم."], [23, "الذي يبغضني، يبغض أبي أيضا."], [24, "ولو لم أعمل بينهم أعمالا لم يعملها أحد غيري، لما كانت لهم خطيئة. ولكنهم أبغضوني وأبغضوا أبي، مع أنهم رأوا تلك الأعمال."]]}], "kwAr": "لا يودون الاستماع لك", "noteAr": ""}, {"kw": "all the", "raw": "Eze_2:4, Eze_24:7; Isa_3:9; Jer_3:3, Jer_5:3", "note": "", "refs": [{"l": "Eze 2:4", "n": "", "vs": [[4, "أنا باعثك إلى الأبناء المتصلبين القساة، فتقول لهم: هذا ما يعلنه الرب."]]}, {"l": "Eze 24:7", "n": "", "vs": [[7, "لأن دمها ما برح فيها، قد وضعته على صخرة جرداء، لم ترقه على الأرض لتواريه بالتراب"]]}, {"l": "Isa 3:9", "n": "", "vs": [[9, "ملامح وجوههم تشهد عليهم، إذ يجاهرون بخطيئتهم كسدوم ولا يسترونها، فويل لهم لأنهم جلبوا على أنفسهم شرا."]]}, {"l": "Jer 3:3", "n": "", "vs": [[3, "لذلك امتنع عنك الغيث، ولم تهطل أمطار الربيع، ومع ذلك صارت لك جبهة زانية تأبى أن تخجل."]]}, {"l": "Jer 5:3", "n": "", "vs": [[3, "أيها الرب، أليست عيناك تطلبان الحق؟ لقد عاقبتهم ولكنهم لم يتوجعوا. أهلكتهم ولكنهم أبوا التقويم. صلبوا وجوههم أكثر من الصخر، ورفضوا التوبة."]]}], "kwAr": "جميعا", "noteAr": ""}, {"kw": "impudent and hardhearted", "raw": "Heb. stiff of forehead and hard of heart", "note": "Heb. stiff of forehead and hard of heart", "refs": [], "kwAr": "معاندون قساة القلوب", "noteAr": "بالعبرية: غلاظ الجباه قساة القلوب."}], "arS": [["لكن ", []], ["شعب", ["H1004"]], [" ", []], ["إسرائيل", ["H3478"]], [" لا ", []], ["يودون", ["H14"]], [" ", []], ["الاستماع", ["H8085"]], [" لك، لأنهم لا ", []], ["يودون", ["H14"]], [" ", []], ["الاستماع", ["H8085"]], [" لي، ", []], ["لأنهم", ["H3588"]], [" ", []], ["جميعا", ["H3605"]], [" ", []], ["معاندون", ["H2389", "H4696"]], [" ", []], ["قساة", ["H7186", "H3820"]], [" القلوب.", []]]}, {"c": 3, "v": 8, "text": "ها أنا قد جعلت وجهك صلبا مثل وجوههم، وجبهتك قاسية مثل جباههم.", "groups": [{"kw": "", "raw": "Exo_4:15, Exo_4:16, Exo_11:4-8; 1Ki_21:20; Isa_50:7; Jer_1:18, Jer_15:20; Mic_3:8; Act_7:51-56; Heb_11:27, Heb_11:32-37", "note": "", "refs": [{"l": "Exo 4:15", "n": "", "vs": [[15, "فتحدثه وتلقن فمه الكلام، فأعينكما على القول، وأعلمكما ماذا تفعلان،"]]}, {"l": "Exo 4:16", "n": "", "vs": [[16, "فيخاطب هو الشعب عنك ويكون لك بمثابة فم وأنت تكون له بمثابة إله."]]}, {"l": "Exo 11:4-8", "n": "", "vs": [[4, "وقال موسى هذا ما يعلنه الرب: «سأجتاز حوالي نصف الليل في وسط مصر،"], [5, "فيموت كل بكر فيها: من بكر فرعون المتربع على العرش إلى بكر الأمة التي وراء الرحى، وكذلك بكر كل بهيمة،"], [6, "فيعلو صراخ عظيم في كل أرض مصر، لم يشهد مثله من قبل ولا يكون مثله أيضا."], [7, "أما بين الإسرائيليين فلن ينبح كلب على أي إنسان أو حيوان. وعندئذ تعلمون أن الرب يميز بين المصريين وإسرائيل."], [8, "فيأتي إلي، من ثم، جميع عبيدك هؤلاء وينحنون أمامي قائلين: انطلق أنت وكل من يتبعك من الشعب. وآنئذ فقط أمضي» ثم انصرف من لدن فرعون بغضب محتدم."]]}, {"l": "1Ki 21:20", "n": "", "vs": [[20, "وما إن رأى أخآب إيليا حتى قال: «هل وجدتني ياعدوي؟» فأجابه: «قد وجدتك لأنك بعت نفسك لارتكاب الشر في عيني الرب."]]}, {"l": "Isa 50:7", "n": "", "vs": [[7, "لأن السيد الرب يغيثني فلا أخزى، لذلك جعلت وجهي كالصوان، لأني عالم أنني لن أخزى."]]}, {"l": "Jer 1:18", "n": "", "vs": [[18, "انظر ها أنا قد جعلتك اليوم قويا كمدينة حصينة، وكعمود من حديد، وكأسوار من نحاس، لتجابه كل أهل الأرض، وملوك يهوذا وأمراءها وكهنتها وشعب البلاد،"]]}, {"l": "Jer 15:20", "n": "", "vs": [[20, "وأجعلك سورا نحاسيا منيعا لهذا الشعب، فيحاربونك ولكنهم يخفقون، لأني أنا معك لأنقذك وأخلصك."]]}, {"l": "Mic 3:8", "n": "", "vs": [[8, "أما أنا، فإني ممتليء بقوة روح الرب وبالحق والعزة، لأعلن لنسل يعقوب معاصيه ولإسرائيل خطيئته."]]}, {"l": "Act 7:51-56", "n": "", "vs": [[51, "ثم قال استفانوس: «ياأصحاب الرقاب الصلبة والقلوب والآذان غير المختونة! إنكم دائما تقاومون الروح القدس. وكما فعل آباؤكم تفعلون!"], [52, "فأي نبي نجا من اضطهادهم وقد قتلوا الذين أنبأوا بمجيء البار الذي سلمتموه أنتم وقتلتموه!"], [53, "فأنتم أخذتم الشريعة من أيدي الملائكة، ولكنكم لم تطيعوها!»"], [54, "فلما سمع المجتمعون كلام استفانوس، ملأ الغيظ قلوبهم، وأخذوا يصرون بأسنانهم توعدا."], [55, "فرفع استفانوس نظره إلى السماء، وهو ممتليء من الروح القدس، فرأى مجد الله ويسوع واقفا عن يمين الله،"], [56, "فقال: «إني أرى السماء مفتوحة وابن الإنسان واقفا عن يمين الله!»"]]}, {"l": "Heb 11:27", "n": "", "vs": [[27, "بالإيمان، ترك أرض مصر وهو غير خائف من غضب الملك. فقد مضى في تنفيذ قراره، كأنه يرى بجانبه الله غير المنظور."]]}, {"l": "Heb 11:32-37", "n": "", "vs": [[32, "وهل من حاجة بعد لمزيد من الأمثلة؟ إن الوقت لا يتسع لي حتى أسرد أخبار الإيمان عن: جدعون وباراق وشمشون ويفتاح وداود وصموئيل والأنبياء."], [33, "فبالإيمان، تغلب هؤلاء على ممالك الأعداء، وحكموا حكما عادلا ونالوا ما وعدهم به الله . وبه، أطبقوا أفواه الأسود،"], [34, "وأبطلوا قوة النار، ونجوا من الموت قتلا بالسيف. وبه أيضا نالوا القوة بعد ضعف، فصاروا أشداء في المعارك، وردوا جيوشا غريبة على أعقابها."], [35, "وبالإيمان، استرجعت بعض النساء أمواتهن بعدما أعيدوا إلى الحياة. وبه، تحمل كثيرون العذاب والضرب، وماتوا رافضين النجاة لعلمهم أنهم سوف يقومون إلى حياة أفضل."], [36, "وكثيرون غيرهم تحملوا المحاكمات الظالمة تحت الإهانة والجلد، والإلقاء في السجون مقيدين بالسلاسل."], [37, "ومنهم من حوكموا فماتوا رجما بالحجارة، أو نشرا بالمنشار، أو ذبحا بالسيف. وبعضهم، تشردوا متسترين بجلود الغنم والمعزى، يعانون من الحاجة والضيق والظلم،"]]}], "kwAr": "", "noteAr": ""}], "arS": [["ها أنا قد ", []], ["جعلت", ["H5414"]], [" ", []], ["وجهك", ["H6440"]], [" ", []], ["صلبا", ["H2389"]], [" مثل ", []], ["وجوههم", ["H6440"]], ["، ", []], ["وجبهتك", ["H4696"]], [" ", []], ["قاسية", ["H2389"]], [" مثل ", []], ["جباههم", ["H4696"]], [".", []]]}, {"c": 3, "v": 9, "text": "قد جعلت جبهتك في صلابة الماس، أقسى من الصوان، فلا تخف منهم ولا ترتعب من مرآهم لأنهم شعب متمرد».", "groups": [{"kw": "adamant", "raw": "Zec_7:12", "note": "", "refs": [{"l": "Zec 7:12", "n": "", "vs": [[12, "وقسوا قلوبهم كالصوان لئلا يسمعوا الشريعة التي أرسلها الرب القدير بروحه على لسان أنبيائه السابقين. فانصب غضب عظيم من لدن الرب القدير."]]}], "kwAr": "الما
