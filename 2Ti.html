لك الممسوح، فإنني أضعف من أبناء صروية؟ إنهم أقوى مني. ليجاز الرب مرتكب الشر بموجب شره»."]]}, {"l": "Psa 28:4", "n": "", "vs": [[4, "جازهم وفقا لفعلهم وشر أعمالهم. أعطهم ما يستحق صنيع أيديهم، ورد عليهم جزاءهم."]]}, {"l": "Psa 109:5-20", "n": "", "vs": [[5, "يجازونني شرا مقابل خيري، وبغضا بدل حبي."], [6, "ول على عدوي قاضيا ظالما، وليقف خصمه عن يمينه يتهمه جورا."], [7, "عند محاكمته ليثبت عليه ذنبه، ولتحسب له صلاته خطيئة."], [8, "لتقصر أيامه وليتول وظيفته آخر."], [9, "ليتيتم بنوه وتترمل زوجته."], [10, "ليتشرد بنوه ويستعطوا، وليلتمسوا قوتهم بعيدا عن خرائب سكناهم."], [11, "ليسترهن المداين كل ممتلكاته، ولينهب الغرباء ثمار تعبه."], [12, "لينقرض من يتراءف عليه، ولينقطع من يتحنن على أيتامه."], [13, "لينقرض نسله وليمح اسمهم من الجيل القادم."], [14, "ليذكر الرب إثم آبائه، ولا يغفر خطيئة أمه."], [15, "لتمثل خطاياهم أمام الرب دائما كي يستأصل من الأرض ذكرهم."], [16, "لأنه تغافل عن إبداء الرحمة، بل تعقب الفقير المنسحق القلب، ليميته."], [17, "أحب اللعنة فلحقت به، ولم يسر بالبركة فابتعدت عنه."], [18, "اكتسى اللعنة كرداء، فتسربت إلى باطنه كالمياه وإلى عظامه كالزيت."], [19, "فلتكن له كرداء يتلفع به، وكحزام يتنطق به دائما."], [20, "هذه أجرة مبغضي من عند الرب، الناطقين شرا على نفسي."]]}, {"l": "Jer 15:15", "n": "", "vs": [[15, "يارب، أنت عرفت. اذكرني وارعني وانتقم لي من مضطهدي. لا تتمهل طويلا في الانتقام لي، فأنت تعلم أني من أجلك احتملت التعيير."]]}, {"l": "Jer 18:19-23", "n": "", "vs": [[19, "أصغ لي يارب، واستمع إلى اتهامات خصومي."], [20, "هل يجازى عن خير بشر؟ قد نقروا حفرة لنفسي. اذكر كيف وقفت أمامك أثني عليهم خيرا لأصرف غضبك عنهم."], [21, "لذلك أسلم بنيهم لأنياب الجوع، واعهد بهم إلى قبضة السيف فتصبح نساؤهم ثكالى وأرامل، وليمت رجالهم، وليلق شبانهم حتفهم في المعارك بحد السيف."], [22, "ليتردد صراخ في بيوتهم عندما ترسل عليهم جيش الغزاة بغتة، لأنهم حفروا هوة ليقتنصوني، ونصبوا فخاخا لرجلي."], [23, "أما أنت يارب فقد عرفت جميع ما تآمروا به علي، فلا تصفح عن إثمهم، ولا تمح خطيئتهم من أمامك، بل ليعثروا منطرحين في حضرتك، وعاقبهم في أوان غضبك."]]}, {"l": "2Th 1:6", "n": "", "vs": [[6, "فمن العدل عند الله حقا أن يجازي بالضيقة أولئك الذين يضايقونكم،"]]}, {"l": "1Jo 5:16", "n": "", "vs": [[16, "إن رأى أحد منكم واحدا من إخوته يمارس خطيئة لا تنتهي به إلى الموت، فمن واجبه أن يصلي إلى الله من أجله، فيبقيه على قيد الحياة. هذا إذا كانت الخطيئة التي يمارسها لا تنتهي به إلى الموت. فهنالك خطيئة لابد أن تنتهي إلى الموت. وطبعا، أنا لا أقصد هذه الخطيئة هنا."]]}, {"l": "Rev 6:10", "n": "", "vs": [[10, "وهم يصرخون للرب بأعلى صوتهم: «حتى متى، أيها السيد القدوس والحق، تؤخر معاقبة أهل الأرض على ما فعلوه بنا؟ متى تنتقم منهم لدمائنا؟»"]]}, {"l": "Rev 18:6", "n": "", "vs": [[6, "افعلوا بها كما فعلت بكم، وضاعفوا لها جزاء ما اقترفت. في الكأس التي مزجت فيها للآخرين، امزجوا لها ضعفا."]]}, {"l": "Rev 18:20", "n": "", "vs": [[20, "اشمتي بها أيتها السماء! واشمتوا بها أيها القديسون والرسل والأنبياء، فقد أصدر الله حكمه عليها بعدما أصدرت أحكامها عليكم»."]]}], "kwAr": "سيجازيه الرب", "noteAr": ""}], "arS": [["إن ", []], ["إسكندر", ["G223"]], [" ", []], ["النحاس", ["G5471"]], [" قد ", []], ["أساء", ["G1731"]], [" إلي إساءات ", []], ["كثيرة", ["G4183"]], ["، ", []], ["سيجازيه", ["G591"]], [" ", []], ["الرب", ["G2962"]], [" حسب ", []], ["أعماله", ["G2041"]], [".", []]]}, {"c": 4, "v": 15, "text": "فاحترس منه أنت أيضا، لأنه قاوم كلامنا مقاومة شديدة.", "groups": [{"kw": "be", "raw": "Mat_10:16, Mat_10:17; Phi_3:2", "note": "", "refs": [{"l": "Mat 10:16", "n": "", "vs": [[16, "ها أنا أرسلكم مثل الخراف بين الذئاب، فكونوا متنبهين كالحيات ومسالمين كالحمام."]]}, {"l": "Mat 10:17", "n": "", "vs": [[17, "احذروا من الناس! فإنهم سيسلمونكم إلى المحاكم، ويجلدونكم في مجامعهم؛"]]}, {"l": "Phi 3:2", "n": "", "vs": [[2, "خذوا حذركم من «الكلاب»، من العمال الأشرار، من الذين يبترون الجسد."]]}], "kwAr": "فاحترس منه", "noteAr": ""}, {"kw": "withstood", "raw": "2Ti_3:8", "note": "", "refs": [{"l": "2Ti 3:8", "n": "", "vs": [[8, "ومثلما قاوم (الساحران) ينيس ويمبريس موسى، كذلك أيضا يقاوم هؤلاء الحق؛ أناس عقولهم فاسدة، وقد تبين أنهم غير أهل للإيمان."]]}], "kwAr": "قاوم", "noteAr": ""}, {"kw": "words", "raw": "or, preachings", "note": "or, preachings", "refs": [], "kwAr": "كلامنا", "noteAr": "أو: كرازتنا (مناداتنا)."}], "arS": [["فاحترس", ["G5442"]], [" منه أنت أيضا، لأنه ", []], ["قاوم", ["G436"]], [" ", []], ["كلامنا", ["G3056", "G2251"]], [" مقاومة ", []], ["شديدة", ["G3029"]], [".", []]]}, {"c": 4, "v": 16, "text": "عندما دافعت عن نفسي في محاكمتي أول مرة، لم يقف أحد بجانبي، بل تركني الجميع، لا حاسبهم الله على ذلك!", "groups": [{"kw": "answer", "raw": "Act_22:1, Act_25:16; 1Co_9:3; 2Co_7:11; Phi_1:7, Phi_1:17; 1Pe_3:15 *Gr.", "note": "", "refs": [{"l": "Act 22:1", "n": "", "vs": [[1, "»أيها الإخوة والآباء، اسمعوا الآن دفاعي عن نفسي»."]]}, {"l": "Act 25:16", "n": "", "vs": [[16, "فقلت لهم إنه ليس من عادة الرومان أن يصدروا حكما على أحد قبل أن يواجه الذين يتهمونه، لتتاح له فرصة الدفاع عن نفسه."]]}, {"l": "1Co 9:3", "n": "", "vs": [[3, "وهذا هو دفاعي لدى الذين يستجوبونني:"]]}, {"l": "2Co 7:11", "n": "", "vs": [[11, "فانظروا، إذن، هذا الحزن عينه الذي يوافق الله ، كم أنتج فيكم من الاجتهاد، بل من الاعتذار، بل من الاستنكار، بل من الخوف، بل من التشوق، بل من الغيرة، بل من الانتقام! وقد بينتم في كل شيء أنكم أبرياء من ذلك الأمر."]]}, {"l": "Phi 1:7", "n": "", "vs": [[7, "كما أن من الحق أن يكون لي هذا الشعور تجاهكم جميعا، لأني أحتفظ بكم في قلبي، لكونكم جميعا شركاء لي في النعمة، سواء أكان في قيودي أم في الدفاع عن الإنجيل وتثبيته."]]}, {"l": "Phi 1:17", "n": "", "vs": [[17, "وأولئك يدفعهم التحزب، فينادون بالمسيح بغير إخلاص، ظنا منهم أنهم يثيرون علي الضيق إضافة إلى القيود."]]}, {"l": "1Pe 3:15", "n": "*Gr.", "vs": [[15, "وإنما كرسوا المسيح ربا في قلوبكم. وكونوا دائما مستعدين لأن تقدموا جوابا مقنعا لكل من يسألكم عن سبب الرجاء الذي في داخلكم"]]}], "kwAr": "دافعت عن نفسي", "noteAr": ""}, {"kw": "no", "raw": "2Ti_4:10, 2Ti_1:15; Psa_31:11-13; Mar_14:50; Joh_16:32", "note": "", "refs": [{"l": "2Ti 4:10", "n": "", "vs": [[10, "لأن ديماس، إذ أحب الحياة الحاضرة، تركني وذهب إلى مدينة تسالونيكي. أما كريسكيس، فقد ذهب إلى مقاطعة غلاطية، وتيطس إلى دلماطية"]]}, {"l": "2Ti 1:15", "n": "", "vs": [[15, "أنت على علم بأن معاوني الذين في مقاطعة أسيا، ومنهم فيجلس وهرموجينس، قد تخلوا عني."]]}, {"l": "Psa 31:11-13", "n": "", "vs": [[11, "صرت محتقرا من كل أعدائي ومصدر رعب لجيراني. الذين يرونني في الشارع يتهربون مني."], [12, "صرت منسيا كما لو كنت ميتا، وأصبحت كإناء محطم،"], [13, "لأني سمعت المذمة من كثيرين، حتى بات الخوف يطوقني، إذ يتآمرون جميعا علي، عازمين على قتلي."]]}, {"l": "Mar 14:50", "n": "", "vs": [[50, "عندئذ تركه الجميع وهربوا."]]}, {"l": "Joh 16:32", "n": "", "vs": [[32, "ستأتي ساعة وها قد حانت الآن فيها تتفرقون كل واحد إلى بيته، وتتركونني وحدي. ولكني لست وحدي، لأن الآب معي."]]}], "kwAr": "لم يقف أحد بجانبي", "noteAr": ""}, {"kw": "I pray", "raw": "Act_7:60", "note": "", "refs": [{"l": "Act 7:60", "n": "", "vs": [[60, "ثم ركع وصرخ بصوت عال: «يارب، لا تحسب عليهم هذه الخطيئة!» وإذ قال هذا رقد."]]}], "kwAr": "لا حاسبهم الله", "noteAr": ""}], "arS": [["عندما ", []], ["دافعت عن نفسي", ["G627"]], [" في محاكمتي ", []], ["أول", ["G4413"]], [" مرة، لم ", []], ["يقف أحد بجانبي", ["G3762", "G4836"]], ["، بل ", []], ["تركني", ["G1459"]], [" ", []], ["الجميع", ["G3956"]], ["، لا ", []], ["حاسبهم", ["G3049"]], [" الله على ذلك!", []]]}, {"c": 4, "v": 17, "text": "إلا أن الرب وقف بجانبي وأمدني بالقوة، لكي تتم بي المناداة بالبشارة، فيسمعها جميع من هم من الأمم؛ وقد نجوت من فم الأسد.", "groups": [{"kw": "the Lord", "raw": "Psa_37:39, Psa_37:40, Psa_109:31; Jer_15:20,Jer_15:21, Jer_20:10,Jer_20:11; Mat_10:19; Act_18:9, Act_18:10; Act_23:11, Act_27:23, Act_27:24", "note": "", "refs": [{"l": "Psa 37:39", "n": "", "vs": [[39, "لكن خلاص الأبرار من عند الرب، فهو حصنهم في زمان الضيق."]]}, {"l": "Psa 37:40", "n": "", "vs": [[40, "يعينهم الرب حقا، وينقذهم من الأشرار، ويخلصهم لأنهم احتموا به."]]}, {"l": "Psa 109:31", "n": "", "vs": [[31, "لأنه يقف عن يمين المظلوم ليخلصه من الحاكمين عليه بالموت."]]}, {"l": "Jer 15:20", "n": "", "vs": [[20, "وأجعلك سورا نحاسيا منيعا لهذا الشعب، فيحاربونك ولكنهم يخفقون، لأني أنا معك لأنقذك وأخلصك."]]}, {"l": "Jer 15:21", "n": "", "vs": [[21, "أنقذك من قبضة الأشرار، وأفديك من أكف العتاة»."]]}, {"l": "Jer 20:10", "n": "", "vs": [[10, "لأني سمعت نفثات تهديد من كثيرين، وأحاط بي رعب من كل جانب. يقولون: «اشتكوا عليه فنشتكي عليه»، حتى جميع أصدقائي الحميمين يرقبون كبوتي قائلين: «لعله يتعثر فنتغلب عليه وننتقم منه»."]]}, {"l": "Jer 20:11", "n": "", "vs": [[11, "لكن الرب معي كمحارب جبار، لهذا يعثر كل مضطهدي ولا يظفرون بي. يلحق بهم عار عظيم لأنهم لا يفلحون، ويظل خزيهم مذكورا إلى الأبد."]]}, {"l": "Mat 10:19", "n": "", "vs": [[19, "فحين يسلمونكم، لا تهتموا كيف تتكلمون أو ماذا تقولون. فإنكم في تلك الساعة تلهمون ما تقولون."]]}, {"l": "Act 18:9", "n": "", "vs": [[9, "وذات ليلة رأى بولس الرب في رؤيا يقول له: «لا تخف، بل تكلم ولا تسكت،"]]}, {"l": "Act 18:10", "n": "", "vs": [[10, "فأنا معك، ولن يقدر أحد أن يؤذيك، لأن لي شعبا كثيرا في هذه المدينة»."]]}, {"l": "Act 23:11", "n": "", "vs": [[11, "وفي الليلة التالية ظهر الرب لبولس وقال له: «تشجع، فكما أديت لي الشهادة في أورشليم، لابد أن تؤديها لي في روما أيضا»."]]}, {"l": "Act 27:23", "n": "", "vs": [[23, "فقد ظهر لي هذه الليلة ملاك من عند الله الذي أنا له وإياه أخدم،"]]}, {"l": "Act 27:24", "n": "", "vs": [[24, "وقال لي: لا تخف يابولس! فلابد أن تمثل أمام القيصر. وقد وهبك الله حياة جميع المسافرين معك!"]]}], "kwAr": "إلا أن الرب وقف بجانبي", "noteAr": ""}, {"kw": "strengthened", "raw": "Isa_41:10,Isa_41:14; 2Co_12:9", "note": "", "refs": [{"l": "Isa 41:10", "n": "", "vs": [[10, "لا تخف لأني معك. لا تتلفت حولك جزعا، لأني إلهك، أشددك وأعينك وأعضدك بيمين بري"]]}, {"l": "Isa 41:14", "n": "", "vs": [[14, "لا تخف يايعقوب الضعيف كالحشرة، وياإسرائيل العليل كالشرذمة، لأني سأعينك، يقول الرب فاديك قدوس إسرائيل."]]}, {"l": "2Co 12:9", "n": "", "vs": [[9, "فقال لي: «نعمتي تكفيك، لأن قدرتي تكمل في الضعف!» فأنا أرضى بأن أفتخر مسرورا بالضعفات التي في، لكي تخيم علي قدرة المسيح."]]}], "kwAr": "وأمدني بالقوة", "noteAr": ""}, {"kw": "by", "raw": "Luk_21:15; Act_9:15, Act_26:17, Act_26:18; Rom_16:25, Rom_16:26; Eph_3:8; Phi_1:12-14", "note": "", "refs": [{"l": "Luk 21:15", "n": "", "vs": [[15, "لأني سوف أعطيكم كلاما وحكمة لا يقدر جميع مقاوميكم أن يردوها أو يناقضوها."]]}, {"l": "Act 9:15", "n": "", "vs": [[15, "فأمره الرب: «اذهب! فقد اخترت هذا الرجل ليكون إناء يحمل اسمي إلى الأمم والملوك وبني إسرائيل."]]}, {"l": "Act 26:17", "n": "", "vs": [[17, "وسأنقذك من شعبك ومن الأمم التي أرسلك إليها الآن،"]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "Rom 16:25", "n": "", "vs": [[25, "والمجد للقادر أن يثبتكم، وفقا لإنجيلي وللبشارة بيسوع المسيح، ووفقا لإعلان ما كان سرا ظل مكتوما مدى الأزمنة الأزلية،"]]}, {"l": "Rom 16:26", "n": "", "vs": [[26, "ولكن أذيع الآن، بأمر الله الأزلي في الكتابات النبوية، على جميع الأمم لأجل إطاعة الإيمان؛"]]}, {"l": "Eph 3:8", "n": "", "vs": [[8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "Phi 1:12-14", "n": "", "vs": [[12, "على أني أريد أن تعلموا، أيها الإخوة، أن أحوالي قد أدت في الواقع إلى انتشار الإنجيل بنجاح،"], [13, "حتى إنه قد صار معروفا لدى الحرس الإمبراطوري كله ولدى الباقين جميعا أن قيودي إنما هي لأجل المسيح؛"], [14, "كما أن أكثر الإخوة، وقد صاروا واثقين بالرب بسبب قيودي، يجرؤون على التبشير بكلمة الله دون خوف."]]}], "kwAr": "لكي تتم بي المناداة", "noteAr": ""}, {"kw": "and I", "raw": "Psa_22:21; Pro_20:2, Pro_28:15; Jer_2:30; Dan_6:22, Dan_6:27; Heb_11:33; 1Pe_5:8; 2Pe_2:9", "note": "", "refs": [{"l": "Psa 22:21", "n": "", "vs": [[21, "خلصني من فم الأسد، ومن بين قرون الثيران الوحشية استجب لي."]]}, {"l": "Pro 20:2", "n": "", "vs": [[2, "سخط الملك مثل زمجرة الأسد، ومن يثير غيظه يسيء إلى نفسه."]]}, {"l": "Pro 28:15", "n": "", "vs": [[15, "الحاكم العاتي المتسلط على الضعفاء، مثل أسد زائر أو دب ثائر."]]}, {"l": "Jer 2:30", "n": "", "vs": [[30, "عبثا عاقبت بنيكم، فهم أبوا التقويم وافترست سيوفكم أنبياءكم كأسد كاسر."]]}, {"l": "Dan 6:22", "n": "", "vs": [[22, "قد أرسل إلهي ملاكه فسد أفواه الأسود فلم تؤذني، لأني وجدت بريئا أمامه، ولم أرتكب سوءا أمامك أيضا أيها الملك»."]]}, {"l": "Dan 6:27", "n": "", "vs": [[27, "هو ينجي وينقذ ويجري الآيات والعجائب في السماوات والأرض، وهو الذي خلص دانيآل من أنياب الأسود»."]]}, {"l": "Heb 11:33", "n": "", "vs": [[33, "فبالإيمان، تغلب هؤلاء على ممالك الأعداء، وحكموا حكما عادلا ونالوا ما وعدهم به الله . وبه، أطبقوا أفواه الأسود،"]]}, {"l": "1Pe 5:8", "n": "", "vs": [[8, "تعقلوا وتنبهوا. إن خصمكم إبليس كأسد يزأر، يجول باحثا عن فريسة يبتلعها."]]}, {"l": "2Pe 2:9", "n": "", "vs": [[9, "وهكذا نرى أن الرب يعرف أن ينقذ الأتقياء من المحنة، ويحفظ الأشرار محبوسين ليحكم عليهم بالعقاب في يوم الدينونة."]]}], "kwAr": "وقد نجوت من فم الأسد", "noteAr": ""}], "arS": [["إلا أن ", []], ["الرب", ["G2962"]], [" ", []], ["وقف بجانبي", ["G3936"]], [" ", []], ["وأمدني بالقوة", ["G1743"]], ["، لكي ", []], ["تتم", ["G4135"]], [" بي ", []], ["المناداة", ["G2782"]], [" بالبشارة، ", []], ["فيسمعها", ["G191"]], [" ", []], ["جميع", ["G3956"]], [" من هم من ", []], ["الأمم", ["G1484"]], ["؛ وقد ", []], ["نجوت", ["G4506"]], [" من ", []], ["فم", ["G4750"]], [" ", []], ["الأسد", ["G3023"]], [".", []]]}, {"c": 4, "v": 18, "text": "وسينجيني الرب من كل عمل شرير ويحفظني سالما لملكوته السماوي. فله المجد إلى أبد الآبدين آمين!", "groups": [{"kw": "deliver", "raw": "Gen_48:16; 1Sa_25:39; 1Ch_4:10; Psa_121:7; Mat_6:13; Luk_11:4; Joh_17:15; 1Co_10:13; 2Co_1:10; 2Th_3:3", "note": "", "refs": [{"l": "Gen 48:16", "n": "", "vs": [[16, "الملاك الذي أنقذني من كل شر، يبارك الغلامين، وليدع عليهما اسمي واسما أبوي إبراهيم وإسحق، وليكثرا كثيرا في الأرض»."]]}, {"l": "1Sa 25:39", "n": "", "vs": [[39, "فلما سمع داود بموت نابال قال: «مبارك الرب الذي انتقم لي بذاته من إهانة نابال، وجنبني ارتكاب الشر وعاقب نابال على إثمه». وأرسل داود إلى أبيجايل يسألها الزواج منه."]]}, {"l": "1Ch 4:10", "n": "", "vs": [[10, "وتضرع يعبيص لإله إسرائيل قائلا: «ليتك تباركني وتوسع من حدود أرضي، وتعضدني، وتقيني من الشر فلا يشقيني». فاستجاب الله دعاءه."]]}, {"l": "Psa 121:7", "n": "", "vs": [[7, "يقيك الرب من كل شر. يقي نفسك."]]}, {"l": "Mat 6:13", "n": "", "vs": [[13, "ولا تدخلنا في تجربة، لكن نجنا من الشرير، لأن لك الملك والقوة والمجد إلى الأبد. آمين."]]}, {"l": "Luk 11:4", "n": "", "vs": [[4, "واغفر لنا خطايانا، لأننا نحن أيضا نغفر لكل من يذنب إلينا؛ ولا تدخلنا في تجربة لكن نجنا من الشرير! »"]]}, {"l": "Joh 17:15", "n": "", "vs": [[15, "وأنا لا أطلب أن تأخذهم من العالم، بل أن تحفظهم من الشرير."]]}, {"l": "1Co 10:13", "n": "", "vs": [[13, "لم يصبكم من التجارب إلا ما هو بشري. ولكن الله أمين وجدير بالثقة، فلا يدعكم تجربون فوق ما تطيقون، بل يدبر لكم مع التجربة سبيل الخروج منها لتطيقوا احتمالها."]]}, {"l": "2Co 1:10", "n": "", "vs": [[10, "وقد أنقذنا من هذا الموت الشنيع، ومازال ينقذنا حتى الآن، ولنا ملء الثقة بأنه حقا سينقذنا فيما بعد؛"]]}, {"l": "2Th 3:3", "n": "", "vs": [[3, "إلا أن الرب جدير بالثقة؛ فهو سيثبتكم ويحميكم من الشر."]]}], "kwAr": "وسينجيني الرب", "noteAr": ""}, {"kw": "and will", "raw": "2Ti_1:12; Psa_37:28, Psa_73:24, Psa_92:10; Mat_13:43, Mat_25:34; Luk_12:32, Luk_22:29; Joh_10:28-30; 1Th_5:23; Jam_2:5; 1Pe_1:5; Jud_1:1, Jud_1:24", "note": "", "refs": [{"l": "2Ti 1:12", "n": "", "vs": [[12, "من أجل ذلك أيضا أقاسي الآن هذه الآلام، ولكني لست أخجل، لأنني أعرف من أنا مؤمن به، ولي تمام الثقة بأنه قادر أن يحفظ لي الأمانة التي أودعتها عنده سالمة إلى ذلك اليوم."]]}, {"l": "Psa 37:28", "n": "", "vs": [[28, "لأن الرب يحب العدل، ولا يتخلى عن أتقيائه، بل يحفظهم إلى الأبد. أما ذرية الأشرار فتفنى."]]}, {"l": "Psa 73:24", "n": "", "vs": [[24, "تهديني بمشورتك، وبعد ذلك تأخذني إلى المجد."]]}, {"l": "Psa 92:10", "n": "", "vs": [[10, "أما أنا فترفع شأني كما يرتفع قرن الثور الوحشي، وأنتعش كمن تدهن بزيت جديد"]]}, {"l": "Mat 13:43", "n": "", "vs": [[43, "عندئذ يضيء الأبرار كالشمس في ملكوت أبيهم. من له أذنان، فليسمع!"]]}, {"l": "Mat 25:34", "n": "", "vs": [[34, "ثم يقول الملك للذين عن يمينه: تعالوا يامن باركهم أبي، رثوا الملكوت الذي أعد لكم منذ إنشاء العالم:"]]}, {"l": "Luk 12:32", "n": "", "vs": [[32, "لا تخافوا، أيها القطيع الصغير، لأن أباكم قد سر أن يعطيكم الملكوت."]]}, {"l": "Luk 22:29", "n": "", "vs": [[29, "وأنا أعين لكم، كما عين لي أبي، "اجتهد", ["G4704"]], [" أن ", []], ["تجيء", ["G2064"]], [" إلي ", []], ["قبل", ["G4253"]], [" حلول ", []], ["الشتاء", ["G5494"]], [".", []]]}, {"c": 4, "v": 22, "text": "ليكن الرب مع روحك، ولتكن النعمة معكم!", "groups": [{"kw": "The Lord", "raw": "Mat_28:20; Rom_16:20; 2Co_13:14; Gal_6:18; Phm_1:25", "note": "", "refs": [{"l": "Mat 28:20", "n": "", "vs": [[20, "وعلموهم أن يعملوا بكل ما أوصيتكم به. وها أنا معكم كل الأيام إلى انتهاء الزمان! »."]]}, {"l": "Rom 16:20", "n": "", "vs": [[20, "وإله السلام سيسحق الشيطان تحت أقدامكم سريعا. لتكن نعمة ربنا يسوع المسيح معكم."]]}, {"l": "2Co 13:14", "n": "", "vs": [[14, "ولتكن معكم جميعا نعمة ربنا يسوع المسيح، ومحبة الله، وشركة الروح القدس. آمين!"]]}, {"l": "Gal 6:18", "n": "", "vs": [[18, "لتكن مع روحكم، أيها الإخوة، نعمة ربنا يسوع المسيح. آمين!"]]}, {"l": "Phm 1:25", "n": "", "vs": [[25, "ولتكن نعمة ربنا يسوع المسيح مع روحكم!"]]}], "kwAr": "ليكن الرب مع روحك", "noteAr": ""}, {"kw": "Grace", "raw": "Rom_1:7; 1Co_16:23; Eph_6:24; Col_4:18; 1Ti_6:21; 1Pe_5:14; Rev_22:21", "note": "", "refs": [{"l": "Rom 1:7", "n": "", "vs": [[7, "إلى جميع من هم في روما من أحباء الله القديسين المدعوين. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}, {"l": "1Co 16:23", "n": "", "vs": [[23, "لتكن معكم نعمة الرب يسوع المسيح!"]]}, {"l": "Eph 6:24", "n": "", "vs": [[24, "لتكن النعمة مع جميع الذين يحبون ربنا يسوع المسيح محبة لا يعتريها الفساد!"]]}, {"l": "Col 4:18", "n": "", "vs": [[18, "هذا السلام بخط يدي، أنا بولس. تذكروا قيودي. لتكن النعمة معكم."]]}, {"l": "1Ti 6:21", "n": "", "vs": [[21, "وإذ ادعى بعضهم هذه المعرفة المزعومة، زاغوا عن الإيمان. لتكن النعمة معك!"]]}, {"l": "1Pe 5:14", "n": "", "vs": [[14, "سلموا بعضكم على بعض بقبلة المحبة."]]}, {"l": "Rev 22:21", "n": "", "vs": [[21, "ولتكن نعمة ربنا يسوع المسيح معكم جميعا."]]}], "kwAr": "ولتكن النعمة معكم", "noteAr": ""}], "arS": [["ليكن ", []], ["الرب", ["G2962"]], [" مع ", []], ["روحك", ["G4151", "G4675"]], ["، ولتكن ", []], ["النعمة", ["G5485"]], [" معكم!", []]]}], "strong": true}];</
