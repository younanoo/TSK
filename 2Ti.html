 عيب، زوجا لامرأة واحدة، نبيها عاقلا مهذبا مضيافا، قادرا على التعليم؛"]]}, {"l": "1Ti 3:3", "n": "", "vs": [[3, "لا مدمنا للخمر ولا عنيفا؛ بل لطيفا، غير متعود الخصام، غير مولع بالمال،"]]}, {"l": "Tit 1:9", "n": "", "vs": [[9, "ملتصقا بالكلمة الصادقة الموافقة للتعليم، ليكون قادرا على تشجيع المؤمنين بالتعليم الصحيح وعلى إفحام المعارضين."]]}], "kwAr": "قادرا على التعليم", "noteAr": ""}, {"kw": "patient", "raw": "or, forbearing, Eph_4:2; Col_3:13", "note": "or, forbearing, Eph_4:2; Col_3:13", "refs": [{"l": "Eph 4:2", "n": "", "vs": [[2, "بكل تواضع ووداعة وطول بال، محتملين بعضكم بعضا في المحبة،"]]}, {"l": "Col 3:13", "n": "", "vs": [[13, "محتملين بعضكم بعضا، ومسامحين بعضكم بعضا. إن كان لأحدكم شكوى على آخر، كما سامحكم الرب، هكذا افعلوا أنتم أيضا."]]}], "kwAr": "يتحمل المشقات بصبر", "noteAr": "أو: صبورًا على الإساءة (حليمًا)."}], "arS": [["وعبد", ["G1401"]], [" ", []], ["الرب", ["G2962"]], [" ", []], ["يجب", ["G1163"]], [" ألا ", []], ["يتشاجر", ["G3164"]], ["، بل أن يكون ", []], ["مترفقا", ["G2261"]], [" تجاه ", []], ["الجميع", ["G3956"]], ["، ", []], ["قادرا على التعليم", ["G1317"]], ["، ", []], ["يتحمل المشقات بصبر", ["G420"]], ["،", []]]}, {"c": 2, "v": 25, "text": "ويؤدب بالوداعة مقاومي الإيمان، عسى أن يمنحهم الله التوبة، فيعرفوا الحق بالتمام،", "groups": [{"kw": "In", "raw": "Mat_11:29; Gal_6:1; 1Ti_6:11; 1Pe_3:15", "note": "", "refs": [{"l": "Mat 11:29", "n": "", "vs": [[29, "احملوا نيري عليكم، وتتلمذوا على يدي، لأني وديع ومتواضع القلب، فتجدوا الراحة لنفوسكم."]]}, {"l": "Gal 6:1", "n": "", "vs": [[1, "أيها الإخوة، إن سقط أحدكم في خطأ ما فمثل هذا أصلحوه أنتم الروحيين بروح وداعة. واحذر أنت لنفسك لئلا تجرب أيضا."]]}, {"l": "1Ti 6:11", "n": "", "vs": [[11, "وأما أنت، ياإنسان الله، فاهرب من هذه الأمور، واسع في إثر البر والتقوى والإيمان والمحبة والصبر والوداعة."]]}, {"l": "1Pe 3:15", "n": "", "vs": [[15, "وإنما كرسوا المسيح ربا في قلوبكم. وكونوا دائما مستعدين لأن تقدموا جوابا مقنعا لكل من يسألكم عن سبب الرجاء الذي في داخلكم"]]}], "kwAr": "بالوداعة", "noteAr": ""}, {"kw": "instructing", "raw": "Jer_13:15-17, Jer_26:12-15; Joh_5:34; Acts 22:1-23:11", "note": "", "refs": [{"l": "Jer 13:15-17", "n": "", "vs": [[15, "فاسمعوا واصغوا ولا تستكبروا، لأن الرب قد تكلم."], [16, "مجدوا الرب إلهكم قبل أن يجعل الظلام يخيم عليكم، وقبل أن تتعثر أقدامكم على الجبال المعتمة. أنتم ترتقبون النور ولكنه يحوله إلى ظلام الموت ويجعله ليلا دامسا."], [17, "وإن لم تنصتوا فإن نفسي تبكي في الخفاء من أجل كبريائكم، وتذرف عيناي الدموع المريرة، فتسيل العبرات لأن الرب قد سبى شعبه."]]}, {"l": "Jer 26:12-15", "n": "", "vs": [[12, "فقال إرميا لجميع الرؤساء وكل الشعب: «الرب قد بعثني لأتنبأ على هذا الهيكل وعلى هذه المدينة بكل القضاء الذي سمعتموه."], [13, "فالآن قوموا طرقكم وأعمالكم، وأطيعوا صوت الرب إلهكم، فيمتنع عن الشر الذي قضى به عليكم."], [14, "أما أنا فإني في أيديكم. اصنعوا بي ما يحلو لكم."], [15, "ولكن تيقنوا أنكم إن قتلتموني فإنكم تجلبون دما بريئا على أنفسكم وعلى هذه المدينة وعلى أهلها، لأن الرب قد بعثني حقا لأعلن قضاءه في مسامعكم»."]]}, {"l": "Joh 5:34", "n": "", "vs": [[34, "وأنا أقول هذا لا لأني أعتمد على شهادة إنسان، بل من أجل خلاصكم،"]]}, {"l": "Act 22:1-23:11", "n": "", "vs": [[1, "»أيها الإخوة والآباء، اسمعوا الآن دفاعي عن نفسي»."], [2, "فلما سمعوه يخاطبهم باللغة العبرية ازدادوا هدوءا فقال:"], [3, "»أنا رجل يهودي، ولدت في طرسوس الواقعة في مقاطعة كيليكية، ولكني نشأت في هذه المدينة وتعلمت عند قدمي غمالائيل التربية الموافقة تماما لشريعة آبائنا. وكنت غيورا في أمور الله، مثلكم جميعا اليوم."], [4, "فاضطهدت هذا الطريق حتى الموت، فكنت أعتقل أتباعه من الرجال والنساء، وأزج بهم في السجون."], [5, "ويشهد رئيس الكهنة ومجلس الشيوخ على صدق كلامي هذا. فقد أخذت منهم رسائل إلى إخوانهم في دمشق ليعاونوني في القبض على الذين هناك، لأسوقهم إلى أورشليم فينالوا عقابهم."], [6, "ولما وصلت إلى مقربة من دمشق، وكان الوقت نحو الظهر، أضاء حولي فجأة نور باهر،"], [7, "فوقعت على الأرض، وسمعت صوتا يقول لي: شاول، شاول، لماذا تضطهدني؟"], [8, "فأجبت: من أنت ياسيد؟ فقال: أنا يسوع الناصري الذي أنت تضطهده."], [9, "وقد رأى مرافقي النور، ولكنهم لم يسمعوا صوت مخاطبي."], [10, "فسألت: ماذا أفعل يارب؟ فأجابني الرب: قم وادخل دمشق، وهناك يقال لك ما يجب عليك أن تفعله."], [11, "واقتادني مرافقي بيدي حتى أوصلوني إلى دمشق، لأني لم أكن أبصر بسبب شدة ذلك النور الباهر."], [12, "وكان في دمشق رجل اسمه حنانيا، تقي كما تقضي الشريعة، يشهد له يهود دمشق جميعا شهادة حسنة."], [13, "جاء إلي ووقف وقال: أيها الأخ شاول، أبصر. فعاد إلي بصري حالا، ورأيته أمامي،"], [14, "فقال: إله آبائنا اختارك مسبقا لتعرف إرادته، وترى البار وتسمع صوتا من فمه."], [15, "فإنك ستكون شاهدا له، أمام جميع الناس، بما رأيت وسمعت."], [16, "والآن لماذا تبطيء؟ قم تعمد واغتسل من خطايا ك، داعيا باسم الرب."], [17, "بعد ذلك رجعت إلى أورشليم. وبينما كنت أصلي في الهيكل غبت عن الوعي،"], [18, "فرأيت الرب يقول لي: عجل واترك أورشليم بسرعة، لأن أهلها يرفضون أن تشهد لي فيها."], [19, "فقلت: يارب، إنهم يعرفون أني كنت أبحث في المجامع عن المؤمنين بك، لأسجنهم وأجلدهم."], [20, "وكنت حاضرا عندما قتل شهيدك استفانوس، وكنت راضيا بقتله، وحارسا لثياب قاتليه."], [21, "ولكنه قال لي: اذهب ... سأرسلك بعيدا: إلى الأمم!»"], [22, "ظل المجتمعون يصغون حتى وصل بولس إلى ذكر الأمم، فصرخوا بقائد الكتيبة: «انزع هذا الرجل من الأرض! إنه لا يستحق الحياة!»"], [23, "ثم أخذوا يصيحون ويلوحون بثيابهم، ويذرون الغبار في الهواء."], [24, "فأمر القائد جنوده أن يدخلوا بولس إلى الثكنة وأن يستجوبوه تحت جلد السياط ليعرف سبب الهتافات الصاخبة ضده."], [25, "فلما ربطه الجنود ليجلدوه قال لقائد المئة الذي كان واقفا بقربه: «أيسمح لكم القانون بجلد مواطن روماني قبل محاكمته؟»"], [26, "فما إن سمع الضابط ذلك حتى ذهب إلى القائد وأخبره بالأمر، وقال: «أتعلم أية مخالفة كنا سنرتكب لو جلدنا هذا الرجل؟ إنه روماني الجنسية !»"], [27, "فذهب القائد بنفسه إلى بولس وسأله: «أأنت حقا روماني؟» فأجاب: «نعم!»"], [28, "فقال القائد: «أنا دفعت مبلغا كبيرا من المال لأحصل على الجنسية الرومانية». فقال بولس: «وأنا حاصل عليها بالولادة!»"], [29, "وفي الحال ابتعد عنه الجنود المكلفون باستجوابه تحت جلد السياط، ووقع الخوف في نفس القائد من عاقبة تقييده بالسلاسل، بعدما تحقق أنه روماني."], [30, "وفي اليوم التالي أراد القائد أن ينظر في حقيقة التهمة التي وجهها اليهود إلى بولس، ففك قيوده، وأمر بإحضار رؤساء الكهنة وأعضاء المجلس اليهودي جميعا، واستدعى بولس وأوقفه أمامهم."], [1, "فحدق بولس إلى المجلس، وقال: «أيها الإخوة، إني عشت لله بضمير صالح حتى هذا اليوم»."], [2, "فأمر حنانيا، رئيس الكهنة، واحدا من الواقفين لديه أن يضرب بولس على فمه،"], [3, "فقال له بولس: «ضربك الله ، ياحائط المقبرة المطلي بالكلس! كيف تجلس لتحاكمني وفقا للشريعة، ثم تخالف الشريعة فتأمر بضربي؟»"], [4, "فقال له الواقفون هناك: «أتشتم رئيس كهنة الله؟»"], [5, "فأجاب بولس: «لم أكن أعرف أيها الإخوة أنه رئيس كهنة فقد جاء في الكتاب: لا تشتم رئيس شعبك!»"], [6, "وإذ كان بولس يعلم أن بعض أعضاء المجلس من مذهب الصدوقيين، وبعضهم من مذهب الفريسيين، نادى في المجلس: «أيها الإخوة، أنا فريسي ابن فريسي، وإني أحاكم الآن لأنني أعتقد أن للموتى رجاء بالقيامة!»"], [7, "وهنا دب الخلاف بين الفريسيين والصدوقيين من أعضاء المجلس، فانقسم الحاضرون."], [8, "فإن الصدوقيين ينكرون القيامة والملائكة والأرواح، أما الفريسيون فيقرون بها كلها."], [9, "وعلا الصياح، فوقف بعض علماء الشريعة الموالين للفريسيين، يحتجون بحماسة، فقالوا: «لا نجد على هذا الرجل ذنبا، فلربما كلمه روح أو ملاك!»"], [10, "وتفاقم الخلاف حتى خاف القائد أن يشقوا بولس شقين، فأمر الجنود أن ينزلوا ويخطفوه من بينهم ويعيدوه إلى الثكنة."], [11, "وفي الليلة التالية ظهر الرب لبولس وقال له: «تشجع، فكما أديت لي الشهادة في أورشليم، لابد أن تؤديها لي في روما أيضا»."]]}], "kwAr": "ويؤدب", "noteAr": ""}, {"kw": "if", "raw": "Jer_31:18, Jer_31:19, Jer_31:33; Eze_11:19, Eze_36:26, Eze_36:31; Zec_12:10; Act_5:21, Act_11:18; Jam_1:17; 1Jo_5:16", "note": "", "refs": [{"l": "Jer 31:18", "n": "", "vs": [[18, "قد سمعت أفرايم ينتحب قائلا: أدبتني فتأدبت كعجل غير مروض. أرجعني فأرجع لأنك أنت الرب إلهي."]]}, {"l": "Jer 31:19", "n": "", "vs": [[19, "فقد تبت بعد أن غويت، وبعد أن تعلمت صفقت على فخذي ندما. خجلت وخزيت لأني حملت عار حداثتي."]]}, {"l": "Jer 31:33", "n": "", "vs": [[33, "ولكن هذا هو العهد الذي أبرمه مع ذرية إسرائيل بعد تلك الأيام»، يقول الرب: «سأجعل شريعتي في دواخلهم، وأدونها على قلوبهم وأكون لهم إلها وهم يكونون لي شعبا."]]}, {"l": "Eze 11:19", "n": "", "vs": [[19, "وأعطيهم جميعا قلبا واحدا، وأجعل في داخلهم روحا جديدا، وأزيل قلب الحجر من لحمهم. وأستبدله بقلب من لحم،"]]}, {"l": "Eze 36:26", "n": "", "vs": [[26, "وأهبكم قلبا جديدا، وأضع في داخلكم روحا جديدة، وأنتزع من لحمكم قلب الحجر وأعطيكم عوضا عنه قلب لحم."]]}, {"l": "Eze 36:31", "n": "", "vs": [[31, "فتذكرون طرقكم الأثيمة وتصرفاتكم الطالحة، وتمقتون أنفسكم في أعينكم لما ارتكبتم من آثام ورجاسات."]]}, {"l": "Zec 12:10", "n": "", "vs": [[10, "وأفيض على ذرية داود وعلى سكان أورشليم روح النعمة والابتهال، حتى إذا نظروا إلي أنا الذي طعنوه ينوحون عليه كما ينوح والد على ولده الوحيد، متفجعين عليه كتفجعهم على موت بكرهم."]]}, {"l": "Act 5:21", "n": "", "vs": [[21, "فأطاعوا وذهبوا إلى الهيكل باكرا عند الفجر وبدأوا يعلمون. بينما عقد المجلس اجتماعا، بدعوة من رئيس الكهنة وجماعته، حضره شيوخ إسرائيل جميعا، وأمروا بإحضار الرسل من السجن،"]]}, {"l": "Act 11:18", "n": "", "vs": [[18, "فلما سمع المعارضون هذا، سكتوا، ومجدوا الله قائلين: «إذن، قد أنعم الله أيضا على غير اليهود بالتوبة لنوال الحياة»."]]}, {"l": "Jam 1:17", "n": "", "vs": [[17, "إن كل عطية صالحة وهبة كاملة إنما تنزل من فوق، من لدن أبي الأنوار الذي ليس فيه تحول، ولا ظل لأنه لا يدور."]]}, {"l": "1Jo 5:16", "n": "", "vs": [[16, "إن رأى أحد منكم واحدا من إخوته يمارس خطيئة لا تنتهي به إلى الموت، فمن واجبه أن يصلي إلى الله من أجله، فيبقيه على قيد الحياة. هذا إذا كانت الخطيئة التي يمارسها لا تنتهي به إلى الموت. فهنالك خطيئة لابد أن تنتهي إلى الموت. وطبعا، أنا لا أقصد هذه الخطيئة هنا."]]}], "kwAr": "عسى", "noteAr": ""}, {"kw": "peradventure", "raw": "Act_8:22; 1Ti_2:4", "note": "", "refs": [{"l": "Act 8:22", "n": "", "vs": [[22, "فتب عن شرك هذا واطلب إلى الله، عسى أن يغفر لك نية قلبك،"]]}, {"l": "1Ti 2:4", "n": "", "vs": [[4, "فهو يريد لجميع الناس أن يخلصوا، ويقبلوا إلى معرفة الحق بالتمام:"]]}], "kwAr": "أن يمنحهم الله", "noteAr": ""}, {"kw": "repentance", "raw": "2Ti_3:7; Mat_21:32; Mar_1:3, Mar_1:4, Mar_1:15; Act_2:38, Act_20:21; Tit_1:1", "note": "", "refs": [{"l": "2Ti 3:7", "n": "", "vs": [[7, "يصغين للتعليم دائما، ولا يستطعن أبدا أن يبلغن معرفة الحق بالتمام!"]]}, {"l": "Mat 21:32", "n": "", "vs": [[32, "فقد جاء يوحنا إليكم سالكا طريق الحق، فلم تصدقوه. أما جباة الضرائب والزانيات فصدقوه. ولما رأيتم أنتم هذا، لم تندموا بعد ذلك لتصدقوه!"]]}, {"l": "Mar 1:3", "n": "", "vs": [[3, "صوت مناد في البرية: أعدوا طريق الرب، واجعلوا سبله مستقيمة!»"]]}, {"l": "Mar 1:4", "n": "", "vs": [[4, "فقد ظهر يوحنا المعمدان في البرية ينادي بمعمودية التوبة لمغفرة الخطايا."]]}, {"l": "Mar 1:15", "n": "", "vs": [[15, "«قد اكتمل الزمان واقترب ملكوت الله. فتوبوا وآمنوا بالإنجيل! »"]]}, {"l": "Act 2:38", "n": "", "vs": [[38, "أجابهم بطرس: «توبوا، وليتعمد كل واحد منكم باسم يسوع المسيح، فيغفر الله خطاياكم وتنالوا هبة الروح القدس،"]]}, {"l": "Act 20:21", "n": "", "vs": [[21, "فكنت أحث اليهود واليونانيين على أن يتوبوا إلى الله ويؤمنوا بربنا يسوع."]]}, {"l": "Tit 1:1", "n": "", "vs": [[1, "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"]]}], "kwAr": "التوبة", "noteAr": ""}], "arS": [["ويؤدب", ["G3811"]], [" ", []], ["بالوداعة", ["G4236"]], [" ", []], ["مقاومي", ["G475"]], [" الإيمان، عسى أن ", []], ["يمنحهم", ["G1325"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["التوبة", ["G3341"]], ["، ", []], ["فيعرفوا", ["G1922"]], [" ", []], ["الحق", ["G225"]], [" بالتمام،", []]]}, {"c": 2, "v": 26, "text": "فيعودوا إلى الصواب ناجين من فخ إبليس الذي أطبق عليهم، ليعملوا إرادته.", "groups": [{"kw": "recover", "raw": "Gr. awake, Luk_15:17; 1Co_15:34; Eph_5:14", "note": "Gr. awake, Luk_15:17; 1Co_15:34; Eph_5:14", "refs": [{"l": "Luk 15:17", "n": "", "vs": [[17, "ثم رجع إلى نفسه، وقال: ما أكثر خدام أبي المأجورين الذين يفضل عنهم الخبز، وأنا هنا أكاد أهلك جوعا!"]]}, {"l": "1Co 15:34", "n": "", "vs": [[34, "عودوا إلى الصواب كما يجب ولا تخطئوا، فإن بعضا منكم يجهلون الله تماما أقول هذا لكي تخجلوا!"]]}, {"l": "Eph 5:14", "n": "", "vs": [[14, "لأن الذي يكشف كل شيء هو النور. لذلك يقال: «استيقظ أيها النائم، وقم من بين الأموات، فيشرق عليك نور المسيح!»"]]}], "kwAr": "فيعودوا إلى الصواب", "noteAr": "في اليونانية: يستفيقون (يصحون من سكرهم)."}, {"kw": "out", "raw": "Psa_124:7; Isa_8:15, Isa_28:13; Act_26:18; 2Co_2:11; Col_1:13; 2Th_2:9-12; 1Ti_3:7, 1Ti_6:9, 1Ti_6:10; Rev_12:9, Rev_20:2, Rev_20:3", "note": "", "refs": [{"l": "Psa 124:7", "n": "", "vs": [[7, "نجت نفوسنا كالعصفور من فخ الصيادين: انكسر الفخ ونجونا."]]}, {"l": "Isa 8:15", "n": "", "vs": [[15, "فيعثر بها كثيرون ويسقطون ويتحطمون ويقعون في الفخ ويقتنصون»."]]}, {"l": "Isa 28:13", "n": "", "vs": [[13, "لذلك سيكرر الرب عليهم أوامره كلمة فكلمة ووصية فوصية؛ شيئا من هنا وشيئا من هناك، ولكنهم (لحمقهم) يتعثرون ويسقطون فيتحطمون ويؤسرون ويستعبدون."]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "2Co 2:11", "n": "", "vs": [[11, "مخافة أن يستغلنا الشيطان مادمنا لا نجهل نياته."]]}, {"l": "Col 1:13", "n": "", "vs": [[13, "هو الذي أنقذنا من سلطة الظلام ونقلنا إلى ملكوت ابن محبته"]]}, {"l": "2Th 2:9-12", "n": "", "vs": [[9, "أما بروز المتمرد، فسوف يكون بقدر طاقة الشيطان على المعجزات والعلامات والعجائب المزيفة كلها،"], [10, "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا."], [11, "ولهذا السبب، سيرسل الله إليهم طاقة الضلال حتى يصدقوا ما هو دجل،"], [12, "فتقع الدينونة على جميع الذين لم يؤمنوا بالحق بل سرهم الإثم."]]}, {"l": "1Ti 3:7", "n": "", "vs": [[7, "ومن الضروري أن تكون له شهادة حسنة من الذين في خارج الكنيسة، لكي لا يقع في العار وفي فخ إبليس."]]}, {"l": "1Ti 6:9", "n": "", "vs": [[9, "أما الذين يرغبون في أن يصيروا أغنياء، فيسقطون في التجربة والفخ ويتورطون في كثير من الشهوات السفيهة المضرة التي تغرق الناس في الدمار والهلاك."]]}, {"l": "1Ti 6:10", "n": "", "vs": [[10, "فإن حب المال أصل لكل شر؛ وإذ سعى بعضهم إليه، ضلوا عن الإيمان، وطعنوا أنفسهم بأوجاع كثيرة."]]}, {"l": "Rev 12:9", "n": "", "vs": [[9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."]]}, {"l": "Rev 20:2", "n": "", "vs": [[2, "قيد بها التنين، أي الحية القديمة، وهو إبليس أو الشيطان، وسجنه مدة ألف سنة،"]]}, {"l": "Rev 20:3", "n": "", "vs": [[3, "وطرحه في الهاوية وأغلقها عليه، وختمها، حتى يكف عن تضليل الأمم، إلى أن تنقضي الألف سنة. ولكن لابد من إطلاقه بعد ذلك لمدة قصيرة."]]}], "kwAr": "ناجين من فخ إبليس", "noteAr": ""}, {"kw": "who are", "raw": "Isa_42:6, Isa_42:7, Isa_49:25, Isa_49:26, Isa_53:12; Mat_12:28, Mat_12:29; Luk_11:21; 2Pe_2:18-20", "note": "", "refs": [{"l": "Isa 42:6", "n": "", "vs": [[6, "«أنا هو الرب قد دعوتك بالبر. أمسكت بيدك وحافظت عليك وجعلتك عهدا للشعب ونورا للأمم"]]}, {"l": "Isa 42:7", "n": "", "vs": [[7, "لتفتح عيون العمي، وتطلق سراح المأسورين في السجن، وتحرر الجالسين في ظلمة الحبس."]]}, {"l": "Isa 49:25", "n": "", "vs": [[25, "نعم سبي الجبار يسلب منه، وتسترد الغنيمة من الغالب، لأنني أخاصم مخاصميك وأنقذ أبناءك،"]]}, {"l": "Isa 49:26", "n": "", "vs": [[26, "وأجعل مضطهديك يلتهمون لحوم أجسادهم، ويسكرون بدمهم كمن يشرب خمرا. عندئذ يدرك كل ذي جسد أنني أنا الرب مخلصك وفاديك إله يعقوب القدير."]]}, {"l": "Isa 53:12", "n": "", "vs": [[12, "لذلك أهبه نصيبا بين العظماء، فيقسم غنيمة مع الأعزاء، لأنه سكب للموت نفسه، وأحصي مع أثمة. وهو حمل خطيئة كثيرين، وشفع في المذنبين."]]}, {"l": "Mat 12:28", "n": "", "vs": [[28, "ولكن إن كنت بروح الله أطرد الشياطين، فقد أقبل عليكم ملكوت الله!"]]}, {"l": "Mat 12:29", "n": "", "vs": [[29, "وإلا، فكيف يقدر أحد أن يدخل بيت القوي وينهب أمتعته إذا لم يربط القوي أولا؛ وبعدئذ ينهب بيته؟"]]}, {"l": "Luk 11:21", "n": "", "vs": [[21, "عندما يحرس القوي بيته وهو بكامل سلاحه، تكون أمتعته في مأمن."]]}, {"l": "2Pe 2:18-20", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."], [19, "يعدون هؤلاء بالحرية، وهم أنفسهم عبيد للفساد! لأن الإنسان يصير عبدا لكل ما يتسلط عليه ويغلبه."], [20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."]]}], "kwAr": "الذي أطبق عليهم", "noteAr": ""}, {"kw": "taken captive", "raw": "Gr. Taken alive", "note": "Gr. Taken alive", "refs": [], "kwAr": "أطبق عليهم", "noteAr": "في اليونانية: اقتُنصوا أحياء."}, {"kw": "at", "raw": "Job_1:12, Job_2:6; Luk_22:31, Luk_22:32; Joh_13:2, Joh_13:27; Act_5:3; 1Ti_1:20", "note": "", "refs": [{"l": "Job 1:12", "n": "", "vs": [[12, "فقال الرب للشيطان: «ها أنا أسلمك كل ما يملك. إنما لا تمد يدك إليه لتؤذيه». ثم انصرف الشيطان من حضرة الرب."]]}, {"l": "Job 2:6", "n": "", "vs": [[6, "فقال الرب للشيطان: «ها أنا أسلمه إليك، ولكن احفظ نفسه»."]]}, {"l": "Luk 22:31", "n": "", "vs": [[31, "وقال الرب «سمعان، سمعان! ها إن الشيطان قد طلبكم لكي يغربلكم كما يغربل القمح،"]]}, {"l": "Luk 22:32", "n": "", "vs": [[32, "ولكني تضرعت لأجلك لكي لا يخيب إيمانك. وأنت، بعد أن تسترد، ثبت إخوتك»."]]}, {"l": "Joh 13:2", "n": "", "vs": [[2, "ففي أثناء العشاء، وكان الشيطان قد وضع في قلب يهوذا بن سمعان الإسخريوطي أن يخون يسوع،"]]}, {"l": "Joh 13:27", "n": "", "vs": [[27, "وبعد اللقمة، دخله الشيطان. فقال له يسوع: «أسرع في ما نويت أن تعمله!»"]]}, {"l": "Act 5:3", "n": "", "vs": [[3, "فقال له بطرس: «ياحنانيا، لماذا سمحت للشيطان أن يملأ قلبك، فكذبت على الروح القدس، واحتفظت لنفسك بجزء من ثمن الحقل؟"]]}, {"l": "1Ti 1:20", "n": "", "vs": [[20, "ومن هؤلاء همنايوس وإسكندر، وقد سلمتهما إلى الشيطان ليتعلما بالتأديب ألا يجدفا."]]}], "kwAr": "ليعملوا إرادته", "noteAr": ""}], "arS": [["فيعودوا إلى الصواب", ["G366"]], [" ناجين من ", []], ["فخ", ["G3803"]], [" ", []], ["إبليس", ["G1228"]], [" الذي ", []], ["أطبق عليهم", ["G2221"]], ["، ليعملوا ", []], ["إرادته", ["G2307"]], [".", []]]}, {"c": 3, "v": 1, "text": "واعلم هذا الأمر: أن أزمنة صعبة ستعم في الأيام الأخيرة؛", "groups": [{"kw": "in", "raw": "2Ti_4:3; Gen_49:1; Isa_2:2; Jer_48:47, Jer_49:39; Eze_38:16; Dan_10:14; Hos_3:5; Mic_4:1; 1Ti_4:1; 2Pe_3:3; 1Jo_2:18; Jud_1:17", "note": "", "refs": [{"l": "2Ti 4:3", "n": "", "vs": [[3, "فإنه سيأتي زمان لا يطيق الناس فيه التعليم الصحيح، بل تبعا لشهواتهم الخاصة يكدسون لأنفسهم معلمين (يقولون لهم كلاما) يداعب الآذان."]]}, {"l": "Gen 49:1", "n": "", "vs": [[1, "ثم استدعى يعقوب أبناءه وقال: «التفوا حولي لأنبئكم بما سيحدث لكم في الأيام المقبلة."]]}, {"l": "Isa 2:2", "n": "", "vs": [[2, "ويحدث في آخر الأيام، أن جبل هيكل الرب يصبح أسمى من كل الجبال، ويعلو فوق كل التلال، فتتوافد إليه جميع الأمم."]]}, {"l": "Jer 48:47", "n": "", "vs": [[47, "ولكني أرد سبي موآب في الأيام الآتية»، يقول الرب. إلى هنا ختام القضاء على موآب."]]}, {"l": "Jer 49:39", "n": "", "vs": [[39, "ولكن أرد سبي عيلام في الأيام الآتية يقول الرب»."]]}, {"l": "Eze 38:16", "n": "", "vs": [[16, "وتزحف على شعبي إسرائيل كسحابة تغطي الأرض، أني في الأيام الأخيرة آتي بك إلى أرضي لكي تعرفني الشعوب عندما تتجلى قداستي حين أدمرك ياجوج أمام عيونهم.هذا ما يقوله السيد الرب:"]]}, {"l": "Dan 10:14", "n": "", "vs": [[14, "وقد جئت الآن لأطلعك على ما يصيب شعبك في الأيام الأخيرة، لأن الرويا تختص بالأيام المقبلة»."]]}, {"l": "Hos 3:5", "n": "", "vs": [[5, "ثم يرجع أبناء إسرائيل ويطلبون الرب إلههم، وداود ملكهم (أي المسيح)، ويلتمسون برهبة الرب وجوده في آخر الأيام»."]]}, {"l": "Mic 4:1", "n": "", "vs": [[1, "ويكون في آخر الأيام أن جبل هيكل الرب يصبح أشهر الجبال، ويعلو فوق كل التلال، فتتقاطر إليه شعوب عديدة،"]]}, {"l": "1Ti 4:1", "n": "", "vs": [[1, "إلا أن الروح يعلن صراحة أن قوما في الأزمنة الأخيرة سوف يرتدون عن الإيمان، منساقين وراء أرواح مضللة وتعاليم شيطانية،"]]}, {"l": "2Pe 3:3", "n": "", "vs": [[3, "فاعلموا، قبل كل شيء أنه سيأتي في آخر الأيام أناس مستهزئون يسخرون بالحق، ويسلكون منجرفين وراء شهواتهم الخاصة."]]}, {"l": "1Jo 2:18", "n": "", "vs": [[18, "أيها الأولاد، اعلموا أننا نعيش الآن في الزمن الأخير. وكما سمعتم أنه سوف يأتي أخيرا «مسيح دجال»، فقد ظهر حتى الآن كثيرون من الدجالين المقاومين للمسيح. من هنا نتأكد أننا نعيش في الزمن الأخير."]]}, {"l": "Jud 1:17", "n": "", "vs": [[17, "أما أنتم أيها الأحباء، فاذكروا دائما ما قاله رسل ربنا يسوع المسيح."]]}], "kwAr": "في الأيام الأخيرة", "noteAr": ""}, {"kw": "perilous", "raw": "Dan_7:8, Dan_7:20-25, Dan_8:8-14, Dan_11:36-45, Dan_12:1, Dan_12:7, Dan_12:11; 2Th_2:3-12; 1Ti_4:1-3; Rev. 8:1-17:18", "note": "", "refs": [{"l": "Dan 7:8", "n": "", "vs": [[8, "وفيما كنت أتأمل القرون إذا بقرن آخر صغير نبت بينها، واقتلعت ثلاثة قرون من أمامه، وكان في هذا القرن عيون كعيون الإنسان وفم ينطق بعظائم."]]}, {"l": "Dan 7:20-25", "n": "", "vs": [[20, "وعن القرون العشرة النامية في رأسه، وعن القرن الآخر الصغير الذي نبت، فاقتلعت أمامه ثلاثة قرون. هذا القرن ذو العيون الناطق بالعظائم ومنظره أشد هولا من رفاقه."], [21, "وقد شهدت هذا القرن يحارب القديسين ويغلبهم."], [22, "إلى أن جاء الأزلي وانعقد مجلس القضاء الذي فيه تبرأت ساحة قديسي العلي، وأزف الوقت الذي فيه امتلكوا المملكة."], [23, "فأجاب: إن الحيوان الرابع هو رمز للمملكة الرابعة على الأرض، وهي تختلف عن سائر الممالك لأنها تستولي على كل الأرض وتخضعها وتسحقها."], [24, "أما القرون العشرة من هذه المملكة فهي عشرة ملوك يتولونها، ثم يقوم بعدهم ملك آخر يختلف عن الملوك السالفين، ويخضع ثلاثة ملوك،"], [25, "ويعير العلي وينكل بقديسيه، ويحاول أن يغير الأوقات والقوانين، فيذل القديسين ثلاث سنوات ونصف السنة."]]}, {"l": "Dan 8:8-14", "n": "", "vs": [[8, "فعظم شأن التيس. وعندما اعتز انكسر القرن العظيم ونبت عوضا عنه أربعة قرون بارزة نحو جهات الأرض الأربع."], [9, "ونما من واحد منها قرن صغير عظم أمره، وامتد جنوبا وشرقا ونحو أرض إسرائيل،"], [10, "وبلغ من عظمته أنه تطاول على ملوك الأرض وقضى على بعضهم وداس عليهم،"], [11, "وتحدى حتى رئيس الجند (أي الله)، وتكبر عليه، وألغى المحرقة الدائمة وهدم الهيكل."], [12, "وبسبب المعصية سلط على جند القديسين وعلى المحرقة اليومية. وحالفه التوفيق في كل ما صنع فطرح الحق على الأرض."], [13, "فسمعت قدوسا يتكلم، فيرد عليه قدوس آخر: «كم يطول زمن الرؤيا بشأن المحرقة الدائمة اليومية، ومعصية الخراب، وتسليم الهيكل والجند ليكونوا مدوسين؟»"], [14, "فأجابه: «إلى ألفين وثلاث مئة يوم ثم يتطهر الهيكل»."]]}, {"l": "Dan 11:36-45", "n": "", "vs": [[36, "ويصنع الملك ما يطيب له، ويتعظم على كل إله، ويجدف بالعظائم على إله الآلهة، ويفلح، إلى أن يحين اكتمال الغضب إذ لابد أن يتم ما قضى الله به."], [37, "ولن يبالي هذا الملك بآلهة آبائه ولا بمعبود النساء، ولا بأي وثن آخر إذ يتعظم على الكل."], [38, "إنما يكرم إله الحصون بدلا منهم، وهو إله لم يعرفه آباؤه، ويكرمه بالذهب والفضة والحجارة الكريمة والنفائس."], [39, "ويقتحم القلاع المحصنة باسم إله غريب. وكل من يعترف به يغدق عليه الإكرام، ويوليه على كثيرين، ويقسم الأرض بينهم، أجرة لهم."], [40, "وعندما تأزف النهاية يحاربه ملك الجنوب، فينقض عليه ملك الشمال كالزوبعة بمركبات وفرسان وسفن كثيرة، ويقتحم دياره كالطوفان الجارف."], [41, "ويغزو أرض إسرائيل فيسقط عشرات الألوف صرعى، ولا ينجو منه سوى أرض أدوم وأرض موآب والجزء الأكبر من أرض عمون."], [42, "يبسط يده على الأراضي فلا تفلت منه حتى أرض مصر."], [43, "ويستولي على كنوز الذهب والفضة وعلى كل ذخائر مصر. ويسير الليبيون والإثيوبيون في ركابه."], [44, "وتبلغه أخبار من الشرق ومن الشمال، فيرجع بغضب شديد ليدمر ويقضي على كثيرين،"], [45, "وينصب خيمته الملكية بين البحر وأورشليم، ويبلغ نهاية مصيره وليس له من نصير»."]]}, {"l": "Dan 12:1", "n": "", "vs": [[1, "«وفي ذلك الوقت يقوم الرئيس العظيم الملاك ميخائيل حارس شعبك، وذلك في أثناء ضيق لم يكن له مثيل منذ أن وجدت أمة حتى ذلك الزمان. غير أن كل من كان اسمه مدونا في الكتاب من شعبك ينجو في ذلك الزمان."]]}, {"l": "Dan 12:7", "n": "", "vs": [[7, "فسمعت الرجل اللابس الكتان الواقف فوق مياه النهر يقول، بعد أن رفع يديه نحو السماوات مقسما بالحي إلى الأبد: «تنقضي هذه العجائب بعد ثلاث سنوات ونصف، حين يتم تشتيت قوة الشعب المقدس»."]]}, {"l": "Dan 12:11", "n": "", "vs": [[11, "أما الفترة ما بين إزالة المحرقة الدائمة وإقامة رجس المخرب، فهي ألف ومئتان وتسعون يوما."]]}, {"l": "2Th 2:3-12", "n": "", "vs": [[3, "لا تدعوا أحدا يخدعكم بأية وسيلة! فإن ذلك اليوم لا يأتي دون أن يسبقه انتشار العصيان وظهور الإنسان المتمرد، ابن الهلاك،"], [4, "الذي يتحدى كل ما يدعى إلها أو معبودا، ويعاديه مترفعا عليه. بل إنه أيضا يتخذ من هيكل الله مقرا له، محاولا أن يبرهن أنه إله."], [5, "ألا تذكرون أني كثيرا ما قلت لكم هذا عندما كنت عندكم؟"], [6, "وأنتم الآن تعرفون ما الذي يحتجزه حتى لا يظهر إلا في الوقت المعين له."], [7, "فإن التمرد الآن يعمل خفية كأنه سر. ولكن فقط إلى أن يرفع من الوسط ذاك الذي يحتجز المتمرد."], [8, "عندئذ سيظهر الإنسان المتمرد ظهورا جليا فيبيده الرب يسوع بنفخة فمه ويلاشيه ببهاء ظهوره عند عودته."], [9, "أما بروز المتمرد، فسوف يكون بقدر طاقة الشيطان على المعجزات والعلامات والعجائب المزيفة كلها،"], [10, "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا."], [11, "ولهذا السبب، سيرسل الله إليهم طاقة الضلال حتى يصدقوا ما هو دجل،"], [12, "فتقع الدينونة على جميع الذين لم يؤمنوا بالحق بل سرهم الإثم."]]}, {"l": "1Ti 4:1-3", "n": "", "vs": [[1, "إلا أن الروح يعلن صراحة أن قوما في الأزمنة الأخيرة سوف يرتدون عن الإيمان، منساقين وراء أرواح مضللة وتعاليم شيطانية،"], [2, "في موجة رياء ينشرها معلمون دجالون لهم ضمائر كويت بالنار."], [3, "يحرمون الزواج، ويأمرون بالامتناع عن أطعمة خلقها الله ليتناولها المؤمنون وعارفو الحق شاكرين."]]}, {"l": "Rev 8:1-17:18", "n": "", "vs": [[1, "ولما فك الحمل الختم السابع ساد السماء سكوت نحو نصف ساعة،"], [2, "ورأيت الملائكة السبعة الواقفين أمام الله، وقد أعطوا سبعة أبواق."], [3, "ثم جاء ملاك آخر ومعه مبخرة من ذهب ووقف عند المذبح، وأعطي بخورا كثيرا ليقدمه مع صلوات القديسين على مذبح الذهب أمام العرش،"], [4, "فارتفع دخان البخور من يد الملاك مصحوبا بصلوات القديسين إلى حضرة الله."], [5, "ثم ملأ الملاك المبخرة من النار التي على المذبح وألقاها إلى الأرض، فحدثت رعود وأصوات وبروق وزلزلة."], [6, "واستعد الملائكة السبعة، أصحاب الأبواق السبعة، لينفخوا فيها."], [7, "ولما نفخ الملاك الأول في بوقه، إذا برد ونار يخالطهما الدم يسقطان إلى الأرض، فاحترق ثلث الأرض وثلث الأشجار مع كل عشب أخضر."], [8, "ولما نفخ الملاك الثاني في بوقه، ألقي في البحر ما يشبه جبلا عظيما مشتعلا، فصار ثلث البحر دما،"], [9, "فمات ثلث المخلوقات الحية التي فيه، وتحطم ثلث السفن."], [10, "ثم نفخ الملاك الثالث في بوقه، فهوى من السماء نجم عظيم كأنه شعلة من نار، وسقط على ثلث الأنهار وينابيع المياه."], [11, "واسم هذا النجم «العلقم». فصار ثلث المياه مرا كالعلقم، ومات كثيرون من الناس بسبب مرارة المياه."], [12, "ولما نفخ الملاك الرابع في بوقه، حدثت ضربة لثلث الشمس وثلث القمر وثلث النجوم، فأظلم ثلثها وفقد النهار ثلث ضيائه، وكذلك الليل."], [13, "ثم نظرت فرأيت نسرا يطير في وسط السماء وسمعته يصيح بصوت عال: «الويل الويل الويل لسكان الأرض مما سيحدث لهم عندما ينفخ الملائكة الثلاثة الباقون في أبواقهم!»"], [1, "ولما نفخ الملاك الخامس في بوقه، رأيت نجما قد هوى من السماء إلى الأرض، وأعطي مفتاح الهاوية السحيقة."], [2, "فلما فتحها اندفع الدخان كأنه من أتون عظيم، فأظلمت الشمس والجو من هذا الدخان."], [3, "وطلع من الدخان جراد على الأرض، وأعطي سلطة أن يلسع كالعقارب،"], [4, "وأمر ألا يضر عشب الأرض ولا مزروعاتها ولا أشجارها بل فقط جميع من ليس على جباههم ختم الله،"], [5, "فيعذبهم دون أن يقتلهم، مدة خمسة أشهر. والألم الذي يسببه يشبه ألم لدغة العقرب."], [6, "وفي أثناء تلك الشهور يحاول الناس أن يتخلصوا من حياتهم فلا يقدرون! ويتمنون أن يموتوا، لكن الموت يهرب منهم."], [7, "ويبدو هذا الجراد كأنه خيل مجهزة للقتال، على رؤوسه ما يشبه أكاليل الذهب، ووجوهه كوجوه البشر،"], [8, "وله شعر طويل كشعر النساء، وأسنانه كأسنان الأسود،"], [9, "وصدوره كدروع حديدية، وحفيف أجنحته كضجيج مركبات خيل تجري إلى القتال،"], [10, "وأذنابه ذات إبر كالعقارب. وله سلطة أن يؤذي البشر بأذنابه مدة خمسة أشهر."], [11, "أما ملكه فهو «ملاك الهاوية»، واسمه بالعبرية «أبدون»، وباليونانية «أبوليون»."], [12, "انقضى الويل الأول، وهناك ويلان آخران قادمان!"], [13, "وعندما نفخ الملاك السادس في بوقه، سمعت صوتا آتيا من القرون الأربعة لمذبح الذهب الموجود أمام الله،"], [14, "يقول للملاك السادس الذي يحمل البوق: «أطلق الملائكة الأربعة المقيدين عند نهر الفرات الكبير»."], [15, "وكان هؤلاء الملائكة الأربعة مجهزين استعدادا لهذه الساعة واليوم والشهر والسنة، فأطلقوا ليقتلوا ثلث البشر."], [16, "وسمعت أن جيشهم يبلغ مئتي مليون محارب!"], [17, "ور أيت في الرؤيا الخيول وعليها فرسان يلبسون دروعا بعضها أحمر ناري، وبعضها بنفسجي، وبعضها أصفر كبريتي. وكانت رؤوس الخيل مثل رؤوس الأسود، تلفظ من أفواهها نارا ودخانا وكبريتا."], [18, "فقتل ثلث الناس بهذه البلايا الثلاث، أي بالنار والدخان والكبريت الخارجة من أفواه الخيل."], [19, "وكانت قوة الخيل القاتلة تكمن في أفواهها وفي أذنابها أيضا، لأن أذنابها تشبه الحيات ذات الرؤوس المؤذية!"], [20, "ولكن الناس الذين نجوا من هذه البلايا، لم يتوبوا عن أعمالهم، وظلوا يسجدون للشياطين وللأصنام التي صنعوها من الذهب والفضة والنحاس والحجر والخشب، مع أنها لا ترى ولا تسمع ولا تتحرك!"], [21, "ولم يتوبوا عن القتل والسحر والزنى والسرقة!"], [1, "ثم رأيت ملاكا آخر قويا نازلا من السماء، لابسا سحابة، وعلى رأسه قوس قزح؛ وجهه كالشمس، ورجلاه كعمودين من نار،"], [2, "وبيده درج كتاب صغير مفتوح. فوضع رجله اليمنى على البحر واليسرى على الأرض،"], [3, "وصرخ صرخة عظيمة كزئير الأسد، دوت بعدها أصوات الرعود السبعة."], [4, "ولما تأهبت لكتابة ما تقوله الرعود، سمعت صوتا من السماء يقول لي: «لا تكتب، فما نطقت به الرعود يجب أن تبقيه مكتوما»."], [5, "ثم إن الملاك الذي رأيته واقفا على البحر والأرض رفع يده اليمنى نحو السماء،"], [6, "وأقسم بالحي إلى أبد الآبدين الذي خلق السماء وما فيها والأرض وما فيها والبحر وما فيه، إنه لن تكون مهلة بعد،"], [7, "فحالما ينفخ الملاك السابع في بوقه، تتم خطة الله الخفية، وفقا لما أعلنه لعبيده الأنبياء!"], [8, "ثم كلمني الصوت السماوي ثانية وقال لي: «اذهب، خذ الكتاب الصغير المفتوح في يد الملاك القوي الواقف على البحر والأرض»."], [9, "فذهبت إليه وطلبت الكتاب منه، فأجابني: «خذه والتهمه. ستجد طعمه في فمك حلوا كالعسل، ولكنه سيجعل بطنك مرا!»"], [10, "ولما أخذته من يده والتهمته، كان حلوا كالعسل في فمي، ولكن ما إن ابتلعته حتى ملأ بطني مرارة!"], [11, "وقيل لي: «عليك أن تتنبأ أيضا بشأن كثير من الشعوب والأمم واللغات والملوك»."], [1, "وأعطيت عصا قياس، وأمرت أن أقيس هيكل الله والمذبح، وأن أحصي عدد المتعبدين فيه."], [2, "وقيل لي: «لا تقس الساحة الخارجية لأنها خصصت للأمم، وسيدوسون المدينة المقدسة مدة اثنين وأربعين شهرا،"], [3, "ولكني سأمنح شاهدي أن يتنبآ مدة ألف ومئتين وستين يوما، وهما يلبسان ثوبين من الوبر»."], [4, "هذان الشاهدان هما شجرتا الزيتون والمنارتان القائمتان أمام رب الأرض."], [5, "فإذا حاول أحد أن يمسهما بسوء تخرج نار من فمهما وتلتهم أعداءهما. ذلك يجب أن يكون مصير من يحاول أن يؤذيهما."], [6, "وللشاهدين السلطة أن يغلقا السماء فلا تمطر طيلة مدة نبوءتهما، وأن يحولا مياه الأنهار والبحار دما، وأن ينزلا البلايا بالأرض، كلما أرادا."], [7, "وعندما يكملان شهادتهما يعلن الوحش الصاعد من الهاوية الحرب عليهما، ويهزمهما ويقتلهما"], [8, "وتبقى جثتاهما مطروحتين في ساحة المدينة العظمى التي ترمز إليها «سدوم» أو «مصر»، حيث صلب ربهما."], [9, "فيراهما أناس من مختلف الشعوب والقبائل واللغات والأمم، مدة ثلاثة أيام ونصف يوم، ولا يؤذن لأحد بدفنهما."], [10, "ويشمت بهما أهل الأرض، فيفرحون كأنهم في عيد، ويتبادلون الهدايا، لأن هذين النبيين كانا قد عذباهم كثيرا."], [11, "وبعد أن تمر الأيام الثلاثة ونصف اليوم يبعث الله في النبيين روح الحياة، فينهضان واقفين، ويستولي على الناظرين إليهما خوف شديد."], [12, "ويدعوهما صوت عال من السماء: «اصعدا إلى هنا»، فيصعدان إلى السماء في سحابة بمشهد من أعدائهما."], [13, "وفي الوقت ذاته يحدث زلزال عنيف يدمر عشر المدينة، ويهلك سبعة آلاف من ساكنيها. فيرتعب الناجون ويمجدون إله السماء."], [14, "انقضى الويل الثاني، وها هو الثالث يأتي سريعا!"], [15, "ونفخ الملاك السابع في بوقه فسمعت أصوات عالية في السماء تقول: «قد صار ملك العالم لربنا ومسيحه. إنه يملك إلى أبد الآبدين»."], [16, "فجثا الشيوخ الأربعة والعشرون الجالسون على عروشهم في حضر ة الله وخروا على وجوههم ساجدين لله."], [17, "وقالوا: «نحمدك أيها الإله القدير على كل شيء، الكائن والذي كان، لأنك الآن قد تقلدت قوتك العظمى وباشرت ملكك."], [18, "غضبت الشعوب عليك، فجاء دور غضبك عليهم. جاءت الساعة ليدان الأموات، وتكافيء عبيدك الأنبياء والقديسين والمتقين اسمك، صغارا وكبارا، وتهلك الذين كانوا يدمرون الأرض!»"], [19, "وانفتح هيكل الله في السماء، وظهر تابوت العهد في داخله. وحدثت بروق وأصوات ورعود وزلزلة، وسقط برد كبير."], [1, "وظهرت في السماء آية عظيمة: امرأة لابسة الشمس، والقمر تحت قدميها، وعلى رأسها تاج من اثني عشر نجما."], [2, "وكانت حبلى تصرخ من ألم الولادة وتتوجع وهي تلد."], [3, "وظهرت في السماء آية أخرى: تنين عظيم أحمر له سبعة رؤوس، على كل منها تاج، وله عشرة قرون،"], [4, "فسحب بذيله ثلث نجوم السماء وألقاها إلى الأرض. ثم وقف التنين أمام المرأة وهي تلد، ليبتلع طفلها بعد أن تلده!"], [5, "وولدت المرأة ابنا ذكرا، وهو الذي سيحكم الأمم كلها بعصا من حديد. ورفع الطفل إلى حضرة الله وإلى عرشه."], [6, "أما المرأة فهربت إلى البرية، حيث أعد الله لها مكانا تعال فيه مدة ألف ومئتين وستين يوما."], [7, "ونشبت حرب في السماء، إذ هاجم ميخائيل وملائكته التنين وملائكته،"], [8, "وحارب التنين وملائكته، لكنهم انهزموا ولم يبق لهم مكان في السماء،"], [9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."], [10, "ثم سمعت صوتا عاليا في السماء يقول: «الآن تم خلاص إلهنا، وآلت القدرة والملك إليه والسلطان إلى مسيحه! فإنه قد طرح من السماء إلى الأرض المشتكي الذي يتهم إخوتنا أمام إلهنا ليلا ونهارا."], [11, "وهم قد انتصروا عليه بدم الحمل وبالكلمة التي شهدوا لها، فلم تكن حياتهم عزيزة لديهم، حتى إنهم ماتوا."], [12, "افرحي أيتها السماوات، وافرحوا ياأهلها، الويل لكم ياأهل الأرض والبحر، لأن إبليس هبط عليكم وهو في شدة الغضب، عالما أن أيامه صارت معدودة»."], [13, "وعندما وجد التنين أنه طرح إلى الأرض، أخذ يطارد المرأة التي ولدت الطفل الذكر،"], [14, "فأعطيت المرأة جناحي النسر العظيم، لتطير بهما إلى البر ية، إلى المكان المجهز لها، حيث تعال بمأمن من الحية، مدة ثلاث سنوات ونصف سنة."], [15, "وأخرجت الحية من جوفها خلف المرأة ما يشبه النهر لتغرقها فيه،"], [16, "ولكن الأرض أعانت المرأة، ففتحت فمها وابتلعت النهر الذي أخرجه التنين من فمه!"], [17, "فاغتاظ التنين من المرأة وشن حربا على باقي أولادها الذين يعملون بوصايا الله وعندهم الشهادة ليسوع."], [1, "ثم رأيت نفسي واقفا على رمل البحر، وإذا وحش خارج من البحر، له سبعة رؤوس وعشرة قرون، على كل قرن منها تاج، وقد كتب على كل رأس اسم تجديف."], [2, "وبدا هذا الوحش مثل النمر وله قوائم كقوائم دب وفم كفم أسد! وأعطاه التنين قدرته وعرشه وسلطة عظيمة."], [3, "وبدا واحد من رؤوسه كأنه ذبح ذبحا مميتا، ولكن الجرح المميت شفي، فتعجب سكان الأرض لذلك، وتبعوا الوحش."], [4, "وسجد الناس للتنين لأنه وهب الوحش سلطته، وعبدوا الوحش وهم يقولون: «من مثل هذا الوحش؟ ومن يجرؤ على محاربته؟»"], [5, "وأعطى التنين الوحش فما ينطق بكلام الكبرياء والتجديف، وأعطاه سلطة العمل مدة اثنين وأربعين شهرا."], [6, "فأخذ الوحش يشتم اسم الله، ويشتم بيته وسكان السماء."], [7, "وأعطي الوحش قدرة على أن يحارب القديسين ويهزمهم وسلطة على كل قبيلة وشعب ولغة وأمة."], [8, "فيسجد للوحش جميع سكان الأرض الذين لم تكتب أسماؤهم منذ تأسيس العالم في سجل الحياة للحمل الذي ذبح."], [9, "من له أذن فليسمع:"], [10, "من ساق غيره إلى السبي، فإلى السبي سيساق؛ ومن قتل بالسيف، فبالسيف سيقتل! هنا يظهر صبر القديسين وإيمانهم."], [11, "ثم رأيت وحشا آخر خارجا من الأرض، له قرنان صغيران كقرني خروف، ولكن صوته كصوت تنين،"], [12, "وقد استمد سلطته من الوحش الأول الذي خرج من البحر ليعمل بها في حضوره، فجعل سكان الأرض يسجدون للوحش الأول الذي شفي من جرحه المميت."], [13, "وقام الوحش الثاني بآيات خارقة، حتى إنه أنزل من السماء نارا على الأرض بمشهد من الناس جميعا،"], [14, "فخدع سكان الأرض بالآيات التي كان يقوم بها في حضور الوحش الأول. وأمر سكان الأرض أن يقيموا تمثالا للوحش الأول الذي كان قد جرح جرحا مميتا ولكنه عاش!"], [15, "وأعطي سلطة على أن يبعث الروح في التمثال لينطق، وأن يمد يده فيقتل كل من يرفض السجود لتمثال الوحش،"], [16, "وأن يأمر الجميع، كبارا وصغارا، أغنياء وفقراء، أحرارا وعبيدا، أن يحملوا علامة على أيديهم اليمنى أو على جباههم،"], [17, "فلا يستطيع أحد أن يبيع أو يشتري إلا إذا كانت عليه علامة الوحش، أو الرقم الذي يرمز لاسمه!"], [18, "ولابد هنا من الفطنة: فعلى أهل المعرفة أن يحسبوا عدد اسم الوحش. إنه عدد لإنسان، وهو الرقم «ست مئة وستة وستون»."], [1, "ثم رأيت حملا واقفا على جبل صهيون ومعه مئة وأربعة وأربعون ألفا كتب على جباههم اسمه واسم أبيه."], [2, "وسمعت من السماء صوتا أشبه بصوت الشلال الغزير أو دوي الرعد الشديد. وكان الصوت الذي سمعته كأنه صوت منشدين على القيثارات يضربون بقيثاراتهم"], [3, "وكانوا ينشدون ترتيلة جديدة أمام عرش الله، وأمام الكائنات الحية الأربعة والشيوخ. ولم يستطع أحد أن يتعلم هذه الترتيلة إلا المئة والأربعة والأربعون ألفا المشترون من الأرض،"], [4, "فهؤلاء لم ينجسوا أنفسهم مع النساء لأنهم أطهار، وهم يتبعون الحمل حيثما ذهب، وقد تم شراؤهم من بين الناس باكورة لله، وللحمل،"], [5, "لم تنطق أفواههم بالكذب، ولا عيب فيهم."], [6, "ثم رأيت ملاكا آخر يطير في وسط السماء، معه بشارة أبدية يبشر بها أهل الأرض وكل أمة وقبيلة ولغة وشعب،"], [7, "وهو ينادي عاليا: «اتقوا الله ومجدوه، فقد حانت ساعة دينونته. اسجدوا لمن خلق السماء والأرض والبحر والينابيع»."], [8, "وتبعه ملاك ثان يقول: «سقطت، سقطت بابل العظمى التي سقت أمم العالم من خمر زناها الجالبة للغضب!»"], [9, "ثم تبعهما ملاك ثالث ينادي بصوت عال: «جميع الذين سجدوا للوحش ولتمثاله، وقبلوا علامته على أيديهم أو على جباههم،"], [10, "فلابد لهم، في حضرة الملائكة القديسين وفي حضرة الحمل، من أن يشربوا من خمر الغضب غير المخففة، المسكوبة في كأس غضب الله، فيكابدوا عذاب النار والكبريت المتقد،"], [11, "ويتصاعد دخان عذابهم إلى أبد الآبدين. لا راحة في النهار ولا في الليل للذين عبدوا الوحش وسجدوا لتمثاله وقبلوا علامة اسمه."], [12, "وهنا يظهر صبر القديسين الذين يحافظون على وصايا الله والإيمان بيسوع!»"], [13, "وسمعت صوتا من السماء يقول: «اكتب: طوبى للأموات الذين يموتون منذ الآن وهم في الرب! يقول الروح: نعم! فليستريحوا من متاعبهم، لأن أعمالهم ترافقهم»."], [14, "ثم نظرت، فرأيت سحابة بيضاء، يجلس عليها كائن يشبه ابن الإنسان، على رأسه إكليل من ذهب، وفي يده منجل حاد."], [15, "وخرج ملاك آخر من الهيكل يناديه بصوت عال: «أرسل منجلك ليحصد، فقد حلت ساعة الحصاد ونضج حصاد الأرض»."], [16, "فألقى الجالس على السحابة منجله على الأرض فحصدت الأرض."], [17, "ثم خرج ملاك آخر من الهيكل الذي في السماء، ومعه أيضا منجل حاد."], [18, "ومن المذبح خرج ملاك آخر له السلطة على النار، ونادى بصوت عظيم الملاك الذي يمسك المنجل الحاد: «أرسل منجلك الحاد واقطف عناقيد كرم الأرض لأن عنبها قد نضج»."], [19, "فألقى الملاك منجله إلى الأرض وقطف العناقيد وألقاها في معصرة غضب الله العظمى،"], [20, "فديست المعصرة بالأرجل خارج المدينة، فانبثق منها الدم وجرى أنهارا حتى إلى لجم الخيل، مسافة ثلثمائة وعشرين كيلومترا."], [1, "ثم رأيت في السماء آية أخرى عظيمة وعجيبة: سبعة ملائكة مكلفين أن ينزلوا بالأرض البلايا السبع الأخيرة التي بها يكتمل غضب الله."], [2, "ورأيت أيضا ما يشبه بحرا من زجاج تختلط به النار، وقد وقف عليه جميع الذين انتصروا على الوحش وتمثاله ورقم اسمه، وهم يحملون قيثارات الله،"], [3, "وينشدون ترتيلة موسى، عبد الله وترتيلة الحمل قائلين: «عظيمة وعجيبة أعمالك أيها الرب الإله القادر على كل شيء، عادلة ومستقيمة طرقك ياملك الدهور."], [4, "من لا يخافك يارب ولا يمجد اسمك؟ فأنت وحدك قدوس! والأمم جميعا سيأتون ويسجدون لك، لأن أحكامك قد ظهرت جلية»."], [5, "وبعد ذلك نظرت، فرأيت هيكل خيمة الشهادة في السماء وقد انفتح،"], [6, "وخرج منه الملائكة السبعة المكلفون بإنزال البلايا السبع الأخيرة بالأرض، وهم يرتدون ثيابا من كتان خالص براق، ويشدون صدورهم بأحزمة من ذهب."], [7, "وسلم واحد من الكائنات الحية الأربعة هؤلاء الملائكة السبعة سبع كؤوس من ذهب مملوءة بغضب الله الحي إلى أبد الآبدين."], [8, "وامتلأ الهيكل دخانا من مجد الله وقدرته، فلم يستطع أحد أن يدخل الهيكل، حتى ينتهي الملائكة السبعة من إنزال البلايا السبع بالأرض."], [1, "وسمعت صوتا عاليا صادرا من الهيكل يأمر الملائكة السبعة: «اذهبوا الآن واسكبوا على الأرض كؤوس غضب الله السبع»."], [2, "فذهب الملاك الأول وسكب كأسه على الأرض، فخرجت منها قروح خبيثة أصابت جميع الناس الذين عليهم علامة الوحش والذين يسجدون لتمثاله."], [3, "ثم سكب الملاك الثاني كأسه على البحر، فصار دما كدم الميت، وماتت جميع المخلوقات الحية التي فيه."], [4, "وسكب الملاك الثالث كأسه على الأنهار وينابيع المياه، فصار ت كلها دما."], [5, "وسمعت ملاك المياه يقول: «عادل أنت في أحكامك، أيها الإله القدوس، الكائن والذي كان،"], [6, "فقد سفك الناس دم قديسين وأنبياء، وها أنت تسقي قاتليهم دما! إنهم ينالون ما يستحقون!»"], [7, "وسمعت ملاك المذبح يقول: «إن أحكامك حق وعدل أيها الرب الإله القادر على كل شيء»."], [8, "وسكب الملاك الرابع كأسه على الشمس، فأعطيت الشمس أن تحرق الناس بنار،"], [9, "فاحترق الناس من الحر الشديد. ولكنهم لم يتوبوا ليمجدوا الله ، بل جدفوا على اسم الله صاحب السلطة على هذه البلايا."], [10, "ثم سكب الملاك الخامس كأسه على عرش الوحش، فحل بمملكته ظلام دامس، جعل أتباعه يعضون ألسنتهم من الألم."], [11, "غير أنهم لم يتوبوا عن أعمالهم الشريرة، بل جدفوا على إله السماء لما يعانون من آلام وقروح!"], [12, "وسكب الملاك السادس كأسه على نهر «الفرات» الكبير فجف ماؤه، ليصير ممرا للملوك القادمين من الشرق."], [13, "وعند هذا رأيت ثلاثة أرواح نجسة تشبه الضفادع تخرج من فم التنين، ومن فم الوحش، ومن فم النبي الدجال،"], [14, "وهي أرواح شيطانية قادرة على صنع المعجزات، تذهب إلى ملوك الأرض جميعا وتجمعهم للحرب في ذلك اليوم العظيم، يوم الله القادر على كل شيء."], [15, "»ها أنا آت كما يأتي اللص، طوبى لمن يكون بانتظاري، ساهرا وحارسا لثيابه، لئلا يمشي عريانا فيرى الناس عورته!«"], [16, "وجمعت الأرواح الشيطانية جيوش العالم كلها في مكان يسمى بالعبرية «هرمجدون»."], [17, "ثم سكب الملاك السابع كأسه على الهواء، فدوى صوت من العرش في الهيكل السماوي يقول: «قد تم!»"], [18, "فحدثت بروق وأصوات ورعود وزلزال عنيف لم تشهد الأرض له مثيلا منذ وجد الإنسان على الأرض، لأنه كان زلزالا عنيفا جدا!"], [19, "فانقسمت المدينة العظمى إلى ثلاثة أقسام، وحل الدمار بمدن الأمم. فقد ذكر الله بابل العظمى ليسقيها كأسا تفور بخمر غضبه."], [20, "وهربت الجزر كلها، واختفت الجبال."], [21, "وتساقط من السماء على الناس برد كبير، كل حبة منه بمقدار وزنة واحدة، فجدف الناس على الله بسبب هذه البلية الشديدة جدا."], [1, "وجاء واحد من الملائكة السبعة حاملي الكؤوس السبع وقال لي: «تعال فأريك عقاب الزانية الكبرى الجالسة على المياه الكثيرة،"], [2, "والتي زنى معها ملوك الأرض، وسكر أهل الأرض من خمر زناها»."], [3, "وحملني الملاك بالروح إلى البرية، فرأيت امرأة راكبة على وحش قرمزي له سبعة رؤوس وعشرة قرون، وقد كتبت على جسمه كله أسماء تجديف."], [4, "وكانت المرأة تلبس ملابس من أرجوان وقرمز، وتتحلى بالذهب والحجارة الكريمة واللؤلوء، وقد أمسكت كأس ذهب مملوءة بزناها المكروه النجس،"], [5, "وعلى جبينها اسم مكتوب: سر: «بابل العظمى، أم زانيات الأرض وأصنامها المكروهة»."], [6, "ورأيت المرأة سكرى لكثرة ما شربت من دم القديسين، ودم شهداء يسوع الذين قتلتهم. فتملكتني الدهشة لمنظرها،"], [7, "فسألني الملاك: «لماذا دهشت؟ سأطلعك على ما ترمز إليه المرأة والوحش الذي يحملها، صاحب الرؤوس السبعة والقرون العشرة:"], [8, "هذا الوحش كان موجودا، وهو غير موجود الآن، ولكنه على وشك أن يطلع من الهاوية ويمضي إلى الهلاك. وسيدهش سكان الأرض الذين لم تكتب أسماؤهم منذ تأسيس العالم في سجل الحياة، عندما يرون الوحش، لأنه كان موجودا، ثم أصبح غير موجود، وسيعود!"], [9, "«ولابد هنا من فطنة العقل: الرؤوس السبعة ترمز إلى التلال السبعة التي تجلس المرأة عليها وترمز أيضا إلى سبعة ملوك،"], [10, "خمسة منهم مضوا، والسادس يحكم الآن، والسابع سيأتي، ولكن مدة حكمه ستكون قصيرة."], [11, "أما الوحش الذي كان موجودا ثم أصبح غير موجود، فهو ملك ثامن سبق أن ملك كواحد من السبعة، سيمضي إلى الهلاك."], [12, "وأما القرون العشرة التي رأيت هي عشرة ملوك لم يتولوا الملك بعد، وسيتولون سلطة الملك مع الوحش لمدة ساعة واحدة،"], [13, "يتفقون فيها برأي واحد أن يعطوا الوحش قوتهم وسلطتهم."], [14, "ثم يحاربون الحمل، ولكن الحمل يهزمهم، لأنه رب الأرباب وملك الملوك، والذين معه هم المدعوون، المختارون، المؤمنون»."], [15, "ثم قال لي الملاك: «أما الميا ه التي رأيت حيث تجلس الزانية، فترمز إلى شعوب وجماهير وأمم ولغات."], [16, "وأما القرون العشرة التي رأيتها، والوحش، فسيبغضون الزانية ويجعلونها معزولة وعارية، ويأكلون لحمها ويحرقونها بالنار،"], [17, "لأن الله جعل في قلوبهم أن يعملوا وفق قصده، فيتفقوا على أن يعطوا الوحش ملكهم، حتى تتم كلمات الله."], [18, "أما هذه المرأة التي رأيتها، فإنها ترمز إلى المدينة العظمى التي تحكم ملوك الأرض»."]]}], "kwAr": "أزمنة صعبة", "noteAr": ""}], "arS": [["واعلم", ["G1097"]], [" هذا الأمر: أن ", []], ["أزمنة", ["G2540"]], [" ", []], ["صعبة", ["G5467"]], [" ", []], ["ستعم", ["G1764"]], [" في ", []], ["الأيام", ["G2250"]], [" ", []], ["الأخيرة", ["G2078"]], ["؛", []]]}, {"c": 3, "v": 2, "text": "إذ يكون الناس محبين لأنفسهم، محبين للمال، متكبرين، مباهين بأنفسهم، شتامين، غير مطيعين لوالديهم، ناكرين للجميل، دنسين،", "groups": [{"kw": "lovers", "raw": "2Ti_3:4; Rom_15:1-3; 2Co_5:15; Phi_2:21; Jam_2:8", "note": "", "refs": [{"l": "2Ti 3:4", "n": "", "vs": [[4, "خائنين، وقحين، مدعين، محبين للذات أكثر من محبتهم لله،"]]}, {"l": "Rom 15:1-3", "n": "", "vs": [[1, "ولكن علينا نحن الأقوياء (في الإيمان)، أن نحتمل ضعف الضعفاء (فيه)، وأن لا نرضي أنفسنا."], [2, "فليسع كل واحد منا لإرضاء قريبه من جهة ما هو صالح، في سبيل البنيان."], [3, "فحتى المسيح لم يسع لإرضاء نفسه، بل وفقا لما قد كتب: «تعييرات الذين يعيرونك وقعت علي»."]]}, {"l": "2Co 5:15", "n": "", "vs": [[15, "وهو قد مات عوضا عن الجميع حتى لا يعيش الأحياء في ما بعد لأنفسهم بل للذي مات عوضا عنهم ثم قام."]]}, {"l": "Phi 2:21", "n": "", "vs": [[21, "فإن الجميع يسعون وراء مصالحهم الخاصة، لا لأجل المسيح يسوع."]]}, {"l": "Jam 2:8", "n": "", "vs": [[8, "ما أحسن عملكم حين تطبقون تلك القاعدة الملوكية الواردة في الكتاب: «تحب قريبك كما تحب نفسك!»"]]}], "kwAr": "محبين لأنفسهم", "noteAr": ""}, {"kw": "covetous", "raw": "Luk_12:15; Rom_1:29; Col_3:5; 2Pe_2:3, 2Pe_2:14, 2Pe_2:15; Jud_1:11, Jud_1:16; Rev_18:12, Rev_18:13", "note": "", "refs": [{"l": "Luk 12:15", "n": "", "vs": [[15, "وقال للجمع: «احذروا وتحفظوا من الطمع. فمتى كان الإنسان في سعة، لا تكون حياته في أمواله»."]]}, {"l": "Rom 1:29", "n": "", "vs": [[29, "إذ قد امتلأوا من كل إثم وشر وجشع وخبث، وشحنوا حسدا وقتلا وخصاما ومكرا وسوءا. وهم ثرثارون،"]]}, {"l": "Col 3:5", "n": "", "vs": [[5, "فأميتوا إذن أعضاءكم الأرضية: الزنى، النجاسة، جموح العاطفة، الشهوة الرديئة، والاشتهاء النهم الذي هو عبادة أصنام."]]}, {"l": "2Pe 2:3", "n": "", "vs": [[3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "2Pe 2:14", "n": "", "vs": [[14, "عيونهم لا تنظر إلا نظرات الزنى، ولا تشبع من الخطيئة. وكم من نفوس ضعيفة تقع في فخاخهم! أما قلوبهم، فقد تدربت على الشهوة والطمع. إنهم حقا أبناء اللعنة!"]]}, {"l": "2Pe 2:15", "n": "", "vs": [[15, "وإذ خرجوا عن الطريق المستقيم، ضلوا. فهم سائرون في طريق بلعام بن بعور، الذي أحب الحصول على المال أجرة لإثمه."]]}, {"l": "Jud 1:11", "n": "", "vs": [[11, "الويل لهم! لأنهم سلكوا طريق قايين، واندفعوا إلى ارتكاب خطيئة بلعام طلبا للمال، وتمردوا كما تمرد قورح، فدمروا أنفسهم."]]}, {"l": "Jud 1:16", "n": "", "vs": [[16, "وهؤلاء المعلمون يتذمرون ويشكون دائما وفيما هم يندفعون وراء شهواتهم، يطلقون ألسنتهم متحدثين بأمور طنانة، ويمدحون من يعجبهم طلبا للمنفعة!"]]}, {"l": "Rev 18:12", "n": "", "vs": [[12, "فقد كانت هي تشتري منهم الذهب والفضة والحجارة الكريمة واللؤلؤ، والكتان والأرجوان والحرير والقرمز، وجميع الأخشاب العطرة وأدوات العاج والمصنوعات الخشبية الثمينة، والنحاس والحديد والرخام،"]]}, {"l": "Rev 18:13", "n": "", "vs": [[13, "والقرفة والبهار، والعطور والطيب والبخور، والخمر والزيت والدقيق والحبوب، والبهائم والغنم، والخيل والمركبات، والأجساد والنفوس البشرية"]]}], "kwAr": "محبين للمال", "noteAr": ""}, {"kw": "boasters", "raw": "Psa_10:3, Psa_49:6, Psa_52:1; Isa_10:15; Act_5:36; Rom_1:29-31, Rom_11:18; 2Th_2:4; Jam_4:16; 2Pe_2:18; Jud_1:16", "note": "", "refs": [{"l": "Psa 10:3", "n": "", "vs": [[3, "الشرير يفتخر بشهوات نفسه، والرجل الطماع يلعن ويجدف على الله."]]}, {"l": "Psa 49:6", "n": "", "vs": [[6, "أولئك المتكلون على ثروتهم، وبوفرة غناهم يفتخرون."]]}, {"l": "Psa 52:1", "n": "", "vs": [[1, "لماذا تتفاخر بالشر أيها الجبار؟ إن رحمة الله تدوم اليوم كله"]]}, {"l": "Isa 10:15", "n": "", "vs": [[15, "أتزهو الفأس على من يقطع بها، أم يتعظم المنشار على من ينشر به، وكأن القضيب يحرك رافعه، أو كأن العصا ترفع ما ليس خشبا؟!"]]}, {"l": "Act 5:36", "n": "", "vs": [[36, "فمنذ مدة قصيرة قام ثوداس وادعى أنه شخص عظيم، فتبعه نحو أربع مئة رجل، ولكنه قتل وتفرق أتباعه، وانتهى أمره."]]}, {"l": "Rom 1:29-31", "n": "", "vs": [[29, "إذ قد امتلأوا من كل إثم وشر وجشع وخبث، وشحنوا حسدا وقتلا وخصاما ومكرا وسوءا. وهم ثرثارون،"], [30, "مغتابون، كارهون لله، شتامون، متكبرون، متفاخرون، مخترعون للشرور، غير طائعين للوالدين."], [31, "لا فهم عندهم، ولا أمانة، ولا حنان، ولا رحمة."]]}, {"l": "Rom 11:18", "n": "", "vs": [[18, "فلا تفتخر على باقي الأغصان. وإن كنت تفتخر، فلست أنت تحمل الأصل، بل هو يحملك."]]}, {"l": "2Th 2:4", "n": "", "vs": [[4, "الذي يتحدى كل ما يدعى إلها أو معبودا، ويعاديه مترفعا عليه. بل إنه أيضا يتخذ من هيكل الله مقرا له، محاولا أن يبرهن أنه إله."]]}, {"l": "Jam 4:16", "n": "", "vs": [[16, "وإلا، فإنكم تفتخرون متكبرين. وكل افتخار كهذا، هو افتخار رديء."]]}, {"l": "2Pe 2:18", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."]]}, {"l": "Jud 1:16", "n": "", "vs": [[16, "وهؤلاء المعلمون يتذمرون ويشكون دائما وفيما هم يندفعون وراء شهواتهم، يطلقون ألسنتهم متحدثين بأمور طنانة، ويمدحون من يعجبهم طلبا للمنفعة!"]]}], "kwAr": "متكبرين", "noteAr": ""}, {"kw": "proud", "raw": "Pro_6:17; 1Ti_6:4; Jam_4:6; 1Pe_5:5", "note": "", "refs": [{"l": "Pro 6:17", "n": "", "vs": [[17, "عينان متعجرفتان، ولسان كاذب، ويدان تسفكان دما بريئا."]]}, {"l": "1Ti 6:4", "n": "", "vs": [[4, "فهو قد انتفخ تكبرا، ولا يعرف شيئا، وإنما هو مهووس بالمجادلات والمنازعات الكلامية، ومنها ينشأ الحسد والخصام والتجريح والنيات السيئة،"]]}, {"l": "Jam 4:6", "n": "", "vs": [[6, "لا، بل إنه يجود علينا بنعمة أعظم. لذلك يقول الكتاب: «إن الله يقاوم المتكبرين، ولكنه يعطي المتواضعين نعمة»."]]}, {"l": "1Pe 5:5", "n": "", "vs": [[5, "كذلك، أيها الشباب، اخضعوا للشيوخ. البسوا جميعا ثوب التواضع في معاملتكم بعضكم لبعض. لأن الله يقاوم المتكبرين، ولكنه يعطي المتواضعين نعمة."]]}], "kwAr": "مباهين بأنفسهم", "noteAr": ""}, {"kw": "blasphemers", "raw": "Dan_7:25, Dan_11:36; 1Ti_1:20; 2Pe_2:12; Jud_1:10; Rev_13:1, Rev_13:5, Rev_13:6, Rev_16:9, Rev_16:11, Rev_16:21", "note": "", "refs": [{"l": "Dan 7:25", "n": "", "vs": [[25, "ويعير العلي وينكل بقديسيه، ويحاول أن يغير الأوقات والقوانين، فيذل القديسين ثلاث سنوات ونصف السنة."]]}, {"l": "Dan 11:36", "n": "", "vs": [[36, "ويصنع الملك ما يطيب له، ويتعظم على كل إله، ويجدف بالعظائم على إله الآلهة، ويفلح، إلى أن يحين اكتمال الغضب إذ لابد أن يتم ما قضى الله به."]]}, {"l": "1Ti 1:20", "n": "", "vs": [[20, "ومن هؤلاء همنايوس وإسكندر، وقد سلمتهما إلى الشيطان ليتعلما بالتأديب ألا يجدفا."]]}, {"l": "2Pe 2:12", "n": "", "vs": [[12, "حقا إن هؤلاء المعلمين الدجالين الذين يتكلمون كلاما مهينا في أمور يجهلونها، يشبهون الحيوانات المفترسة غير العاقلة، المولودة ليصطادها الناس ويقتلوها. فلابد أن يهلكوا مثلها."]]}, {"l": "Jud 1:10", "n": "", "vs": [[10, "ولكن هؤلاء المعلمين يتكلمون كلاما مهينا على أمور لا يعرفونها. وأما ما يفهمونه بالغريزة، كالحيوانات غير العاقلة، فإنهم به يدمرون أنفسهم."]]}, {"l": "Rev 13:1", "n": "", "vs": [[1, "ثم رأيت نفسي واقفا على رمل البحر، وإذا وحش خارج من البحر، له سبعة رؤوس وعشرة قرون، على كل قرن منها تاج، وقد كتب على كل رأس اسم تجديف."]]}, {"l": "Rev 13:5", "n": "", "vs": [[5, "وأعطى التنين الوحش فما ينطق بكلام الكبرياء والتجديف، وأعطاه سلطة العمل مدة اثنين وأربعين شهرا."]]}, {"l": "Rev 13:6", "n": "", "vs": [[6, "فأخذ الوحش يشتم اسم الله، ويشتم بيته وسكان السماء."]]}, {"l": "Rev 16:9", "n": "", "vs": [[9, "فاحترق الناس من الحر الشديد. ولكنهم لم يتوبوا ليمجدوا الله ، بل جدفوا على اسم الله صاحب السلطة على هذه البلايا."]]}, {"l": "Rev 16:11", "n": "", "vs": [[11, "غير أنهم لم يتوبوا عن أعمالهم الشريرة، بل جدفوا على إله السماء لما يعانون من آلام وقروح!"]]}, {"l": "Rev 16:21", "n": "", "vs": [[21, "وتساقط من السماء على الناس برد كبير، كل حبة منه بمقدار وزنة واحدة، فجدف الناس على الله بسبب هذه البلية الشديدة جدا."]]}], "kwAr": "شتامين", "noteAr": ""}, {"kw": "disobedient", "raw": "Mat_15:6; Mar_7:11, Mar_7:12; Rom_1:30", "note": "", "refs": [{"l": "Mat 15:6", "n": "", "vs": [[6, "فهو في حل من إكرام أبيه وأمه. وأنتم، بهذا، تلغون ما أوصى به الله ، محافظة على تقاليدكم."]]}, {"l": "Mar 7:11", "n": "", "vs": [[11, "ولكنكم أنتم تقولون: إذا قال أحد لأبيه أو أمه: إن ما كنت أعولك به قد جعلته قربانا، أي تقدمة (للهيكل)،"]]}, {"l": "Mar 7:12", "n": "", "vs": [[12, "فهو في حل من إعانة أبيه أو أمه!"]]}, {"l": "Rom 1:30", "n": "", "vs": [[30, "مغتابون، كارهون لله، شتامون، متكبرون، متفاخرون، مخترعون للشرور، غير طائعين للوالدين."]]}], "kwAr": "غير مطيعين لوالديهم", "noteAr": ""}], "arS": [["إذ يكون ", []], ["الناس", ["G444"]], [" ", []], ["محبين لأنفسهم", ["G5367"]], ["، ", []], ["محبين للمال", ["G5366"]], ["، ", []], ["متكبرين", ["G5244"]], ["، ", []], ["مباهين بأنفسهم", ["G213"]], ["، ", []], ["شتامين", ["G989"]], ["، ", []], ["غير مطيعين", ["G545"]], [" ", []], ["لوالديهم", ["G1118"]], ["، ", []], ["ناكرين للجميل", ["G884"]], ["، ", []], ["دنسين", ["G462"]], ["،", []]]}, {"c": 3, "v": 3, "text": "متحجري العواطف، غير صفوحين، نمامين، جامحي الأهواء، شرسين غير محبين للصلاح،", "groups": [{"kw": "natural", "raw": "Mat_10:21; Rom_1:31", "note": "", "refs": [{"l": "Mat 10:21", "n": "", "vs": [[21, "وسوف يسلم الأخ أخاه إلى الموت، والأب ولده. ويتمرد الأولاد على والديهم، ويقتلونهم!"]]}, {"l": "Rom 1:31", "n": "", "vs": [[31, "لا فهم عندهم، ولا أمانة، ولا حنان، ولا رحمة."]]}], "kwAr": "متحجري العواطف", "noteAr": ""}, {"kw": "trucebreakers", "raw": "2Sa_21:1-3; Psa_15:4; Eze_17:15-19; Rom_1:31 *Gr.", "note": "", "refs": [{"l": "2Sa 21:1-3", "n": "", "vs": [[1, "وحدثت مجاعة في أثناء حكم داود استمرت ثلاث سنوات متتالية، فالتمس داود وجه الرب. فأجابه الرب: «هذا من أجل ما ارتكبه شاول وأهل بيته الملطخة أيديهم بدماء الجبعونيين الذين قتلوهم."], [2, "فاستدعى الملك الجبعونيين، وهم من بقايا شعب الأموريين الذين وقع معهم الإسرائيليون معاهدة صلح، ولكن شاول سعى للقضاء عليهم من فرط غيرته على بني يهوذا وإسرائيل."], [3, "وقال داود لهم: «ماذا أصنع لكم؟» كيف يمكن أن أعوض عما نالكم من ضرر، فتدعون بالبركة لميراث الرب؟»"]]}, {"l": "Psa 15:4", "n": "", "vs": [[4, "يحتقر الأراذل ويكرم خائفي الرب. لا ينقض حلفه ولو فيه أذى له."]]}, {"l": "Eze 17:15-19", "n": "", "vs": [[15, "لكن الملك تمرد عليه وأوفد رسلا إلى مصر يطلب خيلا وجيوشا غفيرة. أيفلح في ذلك؟ أيفلت مرتكب هذا الفعل؟ لقد نقض عهدا، أفيفلت من العواقب؟"], [16, "حي أنا يقول السيد الرب، إنه يموت عنده في بابل، مدينة الملك الذي نصبه ملكا، فازدرى هو حلفه، ونكث عهده."], [17, "ولن يغيثه فرعون بجيوشه العظيمة وجموعه الغفيرة في القتال، حين تقام المتاريس وتبنى بروج الحصار للقضاء على نفوس كثيرة."], [18, "لقد ازدرى الحلف حين نكث العهد، وها هو قد مد يد الولاء إلى مصر. ولكنه وإن فعل هذا كله لن يفلت."], [19, "لذلك، هذا ما يقوله السيد الرب: حي أنا؛ إن حلفي الذي ازدراه، وعهدي الذي نكثه لابد أن يقعا على رأسه."]]}, {"l": "Rom 1:31", "n": "*Gr.", "vs": [[31, "لا فهم عندهم، ولا أمانة، ولا حنان، ولا رحمة."]]}], "kwAr": "غير صفوحين", "noteAr": ""}, {"kw": "false accusers", "raw": "or, make-bates, Mat_4:1; Joh_6:70; 1Ti_3:11; Tit_2:3, All in Gr", "note": "or, make-bates, Mat_4:1; Joh_6:70; 1Ti_3:11; Tit_2:3, All in Gr", "refs": [{"l": "Mat 4:1", "n": "", "vs": [[1, "ثم صعد الروح بيسوع إلى البرية، ليجرب من قبل إبليس."]]}, {"l": "Joh 6:70", "n": "", "vs": [[70, "فقال يسوع: «أليس أنا اخترتكم أنتم الاثني عشر، ومع ذلك فواحد منكم شيطان؟»"]]}, {"l": "1Ti 3:11", "n": "", "vs": [[11, "كذلك يجب أن تكون النساء أيضا رزينات، غير نمامات، نبيهات، أمينات في كل شيء."]]}, {"l": "Tit 2:3", "n": "", "vs": [[3, "وكذلك أن تكون العجائز ذوات سيرة موافقة للقداسة، غير نمامات ولا مدمنات للخمر، بل معلمات لما هو صالح،"]]}], "kwAr": "نمامين", "noteAr": "أو: مثيرو فتن؛ والكلمة في اليونانية «ديابولوس» أي المشتكي (إبليس)."}, {"kw": "incontinent", "raw": "1Co_7:5, 1Co_7:9; 2Pe_2:14, 2Pe_2:19, 2Pe_3:3; Jud_1:16, Jud_1:18", "note": "", "refs": [{"l": "1Co 7:5", "n": "", "vs": [[5, "فلا يمنع أحدكما الآخر عن نفسه إلا حين تتفقان معا على ذلك، ولفترة معينة، بقصد التفرغ للصلاة. وبعد ذلك عودا إلى علاقتكما السابقة، لكي لا يجربكما الشيطان لعدم ضبط النفس."]]}, {"l": "1Co 7:9", "n": "", "vs": [[9, "ولكن إذا لم يمكنهم ضبط أنفسهم، فليتزوجوا. لأن الزواج أفضل من التحرق."]]}, {"l": "2Pe 2:14", "n": "", "vs": [[14, "عيونهم لا تنظر إلا نظرات الزنى، ولا تشبع من الخطيئة. وكم من نفوس ضعيفة تقع في فخاخهم! أما قلوبهم، فقد تدربت على الشهوة والطمع. إنهم حقا أبناء اللعنة!"]]}, {"l": "2Pe 2:19", "n": "", "vs": [[19, "يعدون هؤلاء بالحرية، وهم أنفسهم عبيد للفساد! لأن الإنسان يصير عبدا لكل ما يتسلط عليه ويغلبه."]]}, {"l": "2Pe 3:3", "n": "", "vs": [[3, "فاعلموا، قبل كل شيء أنه سيأتي في آخر الأيام أناس مستهزئون يسخرون بالحق، ويسلكون منجرفين وراء شهواتهم الخاصة."]]}, {"l": "Jud 1:16", "n": "", "vs": [[16, "وهؤلاء المعلمون يتذمرون ويشكون دائما وفيما هم يندفعون وراء شهواتهم، يطلقون ألسنتهم متحدثين بأمور طنانة، ويمدحون من يعجبهم طلبا للمنفعة!"]]}, {"l": "Jud 1:18", "n": "", "vs": [[18, "فقد سبق أن نبهوكم إلى أنه، في نهاية الزمان، سيطلع مستهزئون يعيشون منغمسين في شهواتهم الفاسقة."]]}], "kwAr": "جامحي الأهواء", "noteAr": ""}, {"kw": "fierce", "raw": "Gen_49:7; Dan_8:23; Rev_13:15, Rev_13:17, Rev_16:6, Rev_17:6", "note": "", "refs": [{"l": "Gen 49:7", "n": "", "vs": [[7, "لأنهما في غضبهما اغتالا إنسانا، وفي عبثهما عرقبا ثورا. ملعون سخطهما لأنه عنيف وغضبهما لأنه ضار. أفرقهما في يعقوب وأشتتهما في إسرائيل."]]}, {"l": "Dan 8:23", "n": "", "vs": [[23, "وفي أواخر ملكهم عندما تبلغ المعاصي أقصى مداها، يقوم ملك فظ حاذق داهية،"]]}, {"l": "Rev 13:15", "n": "", "vs": [[15, "وأعطي سلطة على أن يبعث الروح في التمثال لينطق، وأن يمد يده فيقتل كل من يرفض السجود لتمثال الوحش،"]]}, {"l": "Rev 13:17", "n": "", "vs": [[17, "فلا يستطيع أحد أن يبيع أو يشتري إلا إذا كانت عليه علامة الوحش، أو الرقم الذي يرمز لاسمه!"]]}, {"l": "Rev 16:6", "n": "", "vs": [[6, "فقد سفك الناس دم قديسين وأنبياء، وها أنت تسقي قاتليهم دما! إنهم ينالون ما يستحقون!»"]]}, {"l": "Rev 17:6", "n": "", "vs": [[6, "ورأيت المرأة سكرى لكثرة ما شربت من دم القديسين، ودم شهداء يسوع الذين قتلتهم. فتملكتني الدهشة لمنظرها،"]]}], "kwAr": "شرسين", "noteAr": ""}, {"kw": "despisers", "raw": "Psa_22:6; Isa_53:3, Isa_60:14; Luk_10:16, Luk_16:14; 1Th_4:8; Jam_2:6", "note": "", "refs": [{"l": "Psa 22:6", "n": "", "vs": [[6, "أما أنا فدودة لا إنسان. عار في نظر البشر، ومنبوذ في عيني شعبي."]]}, {"l": "Isa 53:3", "n": "", "vs": [[3, "محتقر ومنبوذ من الناس، رجل آلام ومختبر الحزن، مخذول كمن حجب الناس عنه وجوههم فلم نأبه له."]]}, {"l": "Isa 60:14", "n": "", "vs": [[14, "ويقبل إليك أبناء مضايقيك خاضعين، وكل الذين احتقروك ينحنون عند قدميك، ويدعونك مدينة الرب، صهيون قدوس إسرائيل."]]}, {"l": "Luk 10:16", "n": "", "vs": [[16, "من يسمع لكم يسمع لي، ومن يرفضكم يرفضني؛ ومن يرفضني يرفض الذي أرسلني! »"]]}, {"l": "Luk 16:14", "n": "", "vs": [[14, "وكان الفريسيون أيضا، وهم محبون للمال، يسمعون ذلك كله، فاستهزأوا به."]]}, {"l": "1Th 4:8", "n": "", "vs": [[8, "إذن، من استخف بأخيه في هذا الأمر، يستخف لا بإنسان بل بالله، بذاك الذي وهبكم فعلا روحه القدوس."]]}, {"l": "Jam 2:6", "n": "", "vs": [[6, "ولكنكم أنتم عاملتم الفقير معاملة مهينة. ألا تعرفون أن الأغنياء هم الذين يتسلطون عليكم ويجرونكم إلى المحاكم،"]]}], "kwAr": "غير محبين للصلاح", "noteAr": ""}], "arS": [["متحجري العواطف", ["G794"]], ["، ", []], ["غير صفوحين", ["G786"]], ["، ", []], ["نمامين", ["G1228"]], ["، ", []], ["جامحي الأهواء", ["G193"]], ["، ", []], ["شرسين", ["G434"]], [" ", []], ["غير محبين للصلاح", ["G865"]], ["،", []]]}, {"c": 3, "v": 4, "text": "خائنين، وقحين، مدعين، محبين للذات أكثر من محبتهم لله،", "groups": [{"kw": "Traitors", "raw": "2Pe_2:10-22; Jud_1:8, Jud_1:9", "note": "", "refs": [{"l": "2Pe 2:10-22", "n": "", "vs": [[10, "وما أشد العقاب، وبخاصة على الذين ينجرفون وراء الميول الجسدية، مستجيبين لشهوة النجاسة، ومحتقرين سيادة الله! ثم إنهم وقحون، معجبون بأنفسهم، لا يخافون أن يتكلموا بالشتم والإهانة على أصحاب الأمجاد."], [11, "ومع ذلك، فحتى الملائكة، وهم يتفوقون عليهم في القوة والقدرة، لا يقدمون عليهم أمام الرب أية تهمة مهينة.."], [12, "حقا إن هؤلاء المعلمين الدجالين الذين يتكلمون كلاما مهينا في أمور يجهلونها، يشبهون الحيوانات المفترسة غير العاقلة، المولودة ليصطادها الناس ويقتلوها. فلابد أن يهلكوا مثلها."], [13, "وبذلك ينالون أجرة إثمهم! إنهم يحسبون الانغماس في اللذات طول النهار بهجة عظيمة. فهم أوساخ وعيوب: يتلذذون بالنجاسة ويحاولون خداعكم، فيشتركون معكم في الولائم."], [14, "عيونهم لا تنظر إلا نظرات الزنى، ولا تشبع من الخطيئة. وكم من نفوس ضعيفة تقع في فخاخهم! أما قلوبهم، فقد تدربت على الشهوة والطمع. إنهم حقا أبناء اللعنة!"], [15, "وإذ خرجوا عن الطريق المستقيم، ضلوا. فهم سائرون في طريق بلعام بن بعور، الذي أحب الحصول على المال أجرة لإثمه."], [16, "ولكنه توبخ على هذه المخالفة التي ارتكبها. إذ إن الحمار الأبكم نطق بصوت بشري، فوضع حدا لحماقة ذلك النبي!"], [17, "فليس هؤلاء إلا آبارا لا ماء فيها، وغيوما تسوقها الريح العاصفة. ويا له من مصير مرعب محجوز لهم في الظلام الأبدي القاتم!"], [18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."], [19, "يعدون هؤلاء بالحرية، وهم أنفسهم عبيد للفساد! لأن الإنسان يصير عبدا لكل ما يتسلط عليه ويغلبه."], [20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."], [21, "وبالحقيقة، كان أفضل لهم لو أنهم لم يتعرفوا بطريق البر، من أن يتعرفوا به ثم يرتدوا عن الوصية المقدسة التي تسلموها."], [22, "وينطبق على هؤلاء ما يقوله المثل الصادق: «عاد الكلب إلى تناول ما تقيأه، والخنزيرة المغتسلة إلى التمرغ في الوحل!»"]]}, {"l": "Jud 1:8", "n": "", "vs": [[8, "ومع ذلك، فإن أولئك المعلمين المتوهمين يسيرون في الطريق التي سار فيها أهل تلك المدن. إذ يلوثون أجسادهم بالنجاسة، ويحتقرون السيادة الإلهية، ويتكلمون بالإهانة على الكائنات المجيدة!"]]}, {"l": "Jud 1:9", "n": "", "vs": [[9, "فحتى ميخائيل، وهو رئيس ملائكة، لم يجرؤ أن يحكم على إبليس بكلام مهين عندما خاصمه وتجادل معه بخصوص جثمان موسى، وإنما اكتفى بالقول له: «ليزجرك الرب!»"]]}], "kwAr": "خائنين", "noteAr": ""}, {"kw": "highminded", "raw": "Rom_11:20; 1Ti_6:17", "note": "", "refs": [{"l": "Rom 11:20", "n": "", "vs": [[20, "صحيح! فهي قطعت لسبب عدم الإيمان، وأنت إنما تثبت بسبب الإيمان. فلا يأخذك الغرور، بل خف"]]}, {"l": "1Ti 6:17", "n": "", "vs": [[17, "أوص أغنياء هذا الزمان بأن لا يتكبروا، ولا يتكلوا على الغنى غير الثابت، بل على الله الذي يمنحنا كل شيء بوفرة لنتمتع به،"]]}], "kwAr": "مدعين", "noteAr": ""}, {"kw": "lovers of God", "raw": "Rom_16:18; Phi_3:18, Phi_3:19; 1Ti_5:6; 2Pe_2:13, 2Pe_2:15; Jud_1:4, Jud_1:19", "note": "", "refs": [{"l": "Rom 16:18", "n": "", "vs": [[18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."]]}, {"l": "Phi 3:18", "n": "", "vs": [[18, "فإن كثيرين ممن يسلكون بينكم، وقد ذكرتهم لكم مرارا وأذكرهم الآن أيضا باكيا، إنما هم أعداء لصليب المسيح."]]}, {"l": "Phi 3:19", "n": "", "vs": [[19, "الذين مصيرهم الهلاك، وإلههم بطونهم، ومفخرتهم في عيبتهم، وفكرهم منصرف إلى الأمور الأرضية."]]}, {"l": "1Ti 5:6", "n": "", "vs": [[6, "أما تلك التي تعيش منغمسة في اللذات، فقد ماتت، وإن كانت حية."]]}, {"l": "2Pe 2:13", "n": "", "vs": [[13, "وبذلك ينالون أجرة إثمهم! إنهم يحسبون الانغماس في اللذات طول النهار بهجة عظيمة. فهم أوساخ وعيوب: يتلذذون بالنجاسة ويحاولون خداعكم، فيشتركون معكم في الولائم."]]}, {"l": "2Pe 2:15", "n": "", "vs": [[15, "وإذ خرجوا عن الطريق المستقيم، ضلوا. فهم سائرون في طريق بلعام بن بعور، الذي أحب الحصول على المال أجرة لإثمه."]]}, {"l": "Jud 1:4", "n": "", "vs": [[4, "لأنه قد تسلل إلى ما بينكم معلمون لابد أن يلاقوا الحكم بالعقاب الأبدي، كما هو مكتوب لهم منذ القديم. فهم أشرار لا يهابون الله ، يتخذون من نعمة إلهنا فرصة لإباحة الرذائل، وينكرون سيدنا وربنا الوحيد يسوع المسيح."]]}, {"l": "Jud 1:19", "n": "", "vs": [[19, "هؤلاء هم الذين يسببون الانشقاق، وينساقون وراء غرائزهم الحيوانية، وليس الروح القدس فيهم!"]]}], "kwAr": "محبين للذات أكثر من محبتهم لله", "noteAr": ""}], "arS": [["خائنين", ["G4273"]], ["، ", []], ["وقحين", ["G4312"]], ["، ", []], ["مدعين", ["G5187"]], ["، ", []], ["محبين للذات", ["G5369"]], [" ", []], ["أكثر", ["G3123"]], [" من ", []], ["محبتهم لله", ["G5377"]], ["،", []]]}, {"c": 3, "v": 5, "text": "لهم من التقوى مظهرها ولكنهم لقوتها منكرون، فعن هؤلاء الناس ابتعد!", "groups": [{"kw": "a form", "raw": "Isa_29:13, Isa_48:1, Isa_48:2, Isa_58:1-3; Eze_33:30-32; Mat_7:15, Mat_23:27, Mat_23:28; Rom_2:20-24; 1Ti_5:8; Tit_1:16", "note": "", "refs": [{"l": "Isa 29:13", "n": "", "vs": [[13, "لذلك يقول الرب: لأن هذا الشعب يقترب مني بفمه ويكرمني بشفتيه، بينما قلبه بعيد عنى. وما مخافتهم مني سوى تقليد تلقنوه من الناس."]]}, {"l": "Isa 48:1", "n": "", "vs": [[1, "اسمعوا هذا يابيت يعقوب المدعوين باسم إسرائيل الخارجين من صلب يهوذا، الحالفين باسم الرب، المستشهدين بإله إسرائيل باطلا وكذبا"]]}, {"l": "Isa 48:2", "n": "", "vs": [[2, "الذين يدعون أنفسهم أهل المدينة المقدسة، ويعتمدون على إله إسرائيل، الرب القدير:"]]}, {"l": "Isa 58:1-3", "n": "", "vs": [[1, "ناد بأعلى صوتك، لا تصمت. اهتف بصوتك كنفير بوق، وأخبر شعبي بإثمهم، وذرية يعقوب بخطاياهم."], [2, "ومع ذلك، فإنهم يلتمسونني يوميا، ويسرون بمعرفة طرقي وكأنهم أمة تصنع برا، وكأنهم لم يهملوا أحكام إلههم، يطلبون مني أحكام بر، ويغتبطون بالتقرب من الله."], [3, "ويسألون: ما بالنا صمنا وأنت لم تلاحظ، وتذللنا ولم تحفل بذلك؟. إنكم في يوم صومكم تلتمسون مسرة أنفسكم وتسخرون جميع عمالكم."]]}, {"l": "Eze 33:30-32", "n": "", "vs": [[30, "أما أنت ياابن آدم فإن أبناء شعبك يتحدثون عنك بجوار الجدران وفي مداخل أبواب البيوت، ويخاطب أحدهم الآخر، والرجل أخاه قائلين: هيا تعالوا اسمعوا كلام الوحي الصادر من عند الرب."], [31, "ويقبلون إليك مثل سائر الشعب ويجلسون في حضرتك نظير شعبي، ويصغون إلى كلامك ولا يعملون به. إنهم يعربون عن أشواقهم بكلامهم، أما قلبهم فقد غوى وراء مكسبهم."], [32, "وها أنت لهم كقصيدة حب يتغنى بها ذو صوت عذب، يحسن العزف، فيصغون إلى كلامك ولا يعملون به."]]}, {"l": "Mat 7:15", "n": "", "vs": [[15, "احذروا الأنبياء الدجالين الذين يأتون إليكم لابسين ثياب الحملان، ولكنهم من الداخل ذئاب خاطفة!"]]}, {"l": "Mat 23:27", "n": "", "vs": [[27, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم كالقبور المطلية بالكلس: تبدو جميلة من الخارج، ولكنها من الداخل ممتلئة بعظام الموتى وكل نجاسة!"]]}, {"l": "Mat 23:28", "n": "", "vs": [[28, "كذلك أنتم أيضا، تبدون للناس أبرارا، ولكنكم من الداخل ممتلئون بالرياء والفسق!"]]}, {"l": "Rom 2:20-24", "n": "", "vs": [[20, "ومؤدب للجهال، ومعلم للأطفال؛ ولك في الشريعة صورة المعرفة والحق؛"], [21, "فأنت إذن، يامن تعلم غيرك، أما تعلم نفسك؟ أنت يامن تعظ أن لا يسرق، أتسرق؟"], [22, "أنت يامن تنهى عن الزنى، أتزني؟ أنت يامن تستنكر الأصنام، أتسرق الهياكل"], [23, "الذي تفتخر بالشريعة، أتهين الله بمخالفة الشريعة؟"], [24, "فإن «اسم الله يجدف عليه بين الأمم بسببكم»، كما هو مكتوب."]]}, {"l": "1Ti 5:8", "n": "", "vs": [[8, "فإذا كان أحد لا يهتم بذويه، وبخاصة بأهل بيته، فقد أنكر الإيمان، وهو أسوأ من غير المؤمن."]]}, {"l": "Tit 1:16", "n": "", "vs": [[16, "يشهدون معترفين بأنهم يعرفون الله ، ولكنهم بأعمالهم ينكرونه، لأنهم مكروهون وغير طائعين، وقد تبين أنهم غير أهل لكل عمل صالح."]]}], "kwAr": "من التقوى مظهرها", "noteAr": ""}, {"kw": "from", "raw": "2Ti_2:16, 2Ti_2:23; Rom_16:17, Rom_16:18; Eph_4:14; 2Th_3:6, 2Th_3:14; 1Ti_6:5; Tit_3:10; 2Jo_1:10-12", "note": "", "refs": [{"l": "2Ti 2:16", "n": "", "vs": [[16, "أما الأحاديث الباطلة الدنسة، فتجنبها؛ فإن المنصرفين إليها يتقدمون إلى فجور أفظع،"]]}, {"l": "2Ti 2:23", "n": "", "vs": [[23, "أما المجادلات الغبية الحمقاء، فتجنبها، عالما أنها تولد المشاجرات."]]}, {"l": "Rom 16:17", "n": "", "vs": [[17, "ولكن، أتوسل إليكم، أيها الإخوة، أن تنتبهوا إلى مثيري الانقسامات والعثرات، خلافا للتعليم الذي تعلمتم، وأن تبتعدوا عنهم."]]}, {"l": "Rom 16:18", "n": "", "vs": [[18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."]]}, {"l": "Eph 4:14", "n": "", "vs": [[14, "وذلك حتى لا نكون فيما بعد أطفالا تتقاذفنا وتحملنا كل ريح تعليم يقوم على خداع الناس والمكر بهم لجرهم إلى الضلال الملفق،"]]}, {"l": "2Th 3:6", "n": "", "vs": [[6, "ثم نوصيكم، أيها الإخوة، باسم ربنا يسوع المسيح، أن تعتزلوا عن كل أخ يسلك سلوكا فوضويا، لا يوافق التعليم الذي تلقيتم منا."]]}, {"l": "2Th 3:14", "n": "", "vs": [[14, "وإن كان أحد لا يطيع كلمتنا في هذه الرسالة، فميزوه ولا تتعاملوا معه، لتدفعوه إلى الخجل."]]}, {"l": "1Ti 6:5", "n": "", "vs": [[5, "وشتى أنواع النزاع بين أناس فاسدي العقول مجردين من الحق، يعتبرون التقوى تجارة."]]}, {"l": "Tit 3:10", "n": "", "vs": [[10, "وصاحب الهرطقة اقطع العلاقة به بعد إنذاره أولا وثانيا،"]]}, {"l": "2Jo 1:10-12", "n": "", "vs": [[10, "إن جاءكم أحد بغير هذا التعليم، فلا تستقبلوه في بيتكم، ولا تبادلوه التحية."], [11, "لأن من يسلم عليه، يشاركه في أعماله الشريرة."], [12, "كان عندي أمور كثيرة أكتبها إليكم إلا أني ما أردت أن أكتبها هنا بالحبر والورق. فأنا آمل أن أزوركم شخصيا فنتكلم مواجهة. وعندئذ يكتمل فرحنا."]]}], "kwAr": "فعن هؤلاء الناس ابتعد", "noteAr": ""}], "arS": [["لهم من ", []], ["التقوى", ["G2150"]], [" ", []], ["مظهرها", ["G3446"]], [" ولكنهم ", []], ["لقوتها", ["G1411"]], [" ", []], ["منكرون", ["G720"]], ["، فعن هؤلاء الناس ", []], ["ابتعد", ["G665"]], ["!", []]]}, {"c": 3, "v": 6, "text": "فمن هؤلاء من يدخلون البيوت خلسة، ويوقعون في حبائلهم بعض النساء السخيفات المثقلات بالخطايا، اللواتي تجرفهن شهوات مختلفة،", "groups": [{"kw": "of this", "raw": "Mat_23:14; Tit_1:11; Jud_1:4", "note": "", "refs": [{"l": "Mat 23:14", "n": "", "vs": [[14, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تلتهمون بيوت الأرامل وتتذرعون بإطالة صلواتكم. لذلك ستنزل بكم دينونة أقسى!"]]}, {"l": "Tit 1:11", "n": "", "vs": [[11, "هؤلاء يجب أن تسد أفواههم: فهم يخربون بيوتا بجملتها، إذ يعلمون تعاليم يجب ألا تعلم، في سبيل مكسب خسيس."]]}, {"l": "Jud 1:4", "n": "", "vs": [[4, "لأنه قد تسلل إلى ما بينكم معلمون لابد أن يلاقوا الحكم بالعقاب الأبدي، كما هو مكتوب لهم منذ القديم. فهم أشرار لا يهابون الله ، يتخذون من نعمة إلهنا فرصة لإباحة الرذائل، وينكرون سيدنا وربنا الوحيد يسوع المسيح."]]}], "kwAr": "فمن هؤلاء", "noteAr": ""}, {"kw": "laden", "raw": "Psa_38:4; Isa_1:4; Mat_11:28", "note": "", "refs": [{"l": "Psa 38:4", "n": "", "vs": [[4, "طمت آثامي فوق رأسي. وصارت كعبء ثقيل لا طاقة لي على حمله."]]}, {"l": "Isa 1:4", "n": "", "vs": [[4, "ويل للأمة الخاطئة، الشعب المثقل بالإثم، ذرية مرتكبي الشر، أبناء الفساد. لقد تركوا الرب واستهانوا بقدوس إسرائيل وداروا على أعقابهم."]]}, {"l": "Mat 11:28", "n": "", "vs": [[28, "تعالوا إلي ياجميع المتعبين والرازحين تحت الأحمال الثقيلة، وأنا أريحكم."]]}], "kwAr": "المثقلات بالخطايا", "noteAr": ""}, {"kw": "led", "raw": "1Co_12:2; 2Pe_3:17", "note": "", "refs": [{"l": "1Co 12:2", "n": "", "vs": [[2, "تعلمون أنكم، عندما كنتم من الأمم، كنتم تنجرفون إلى الأصنام الخرساء أيما انجراف."]]}, {"l": "2Pe 3:17", "n": "", "vs": [[17, "أما أنتم أيها الأحباء، فإذ قد تنبهتم إلى الخطر قبل حدوثه، احذروا أن تسقطوا عن ثباتكم بالانجراف وراء ضلال الأشرار."]]}], "kwAr": "تجرفهن", "noteAr": ""}, {"kw": "divers", "raw": "Mar_4:19; 1Ti_6:9; Tit_3:3; 2Pe_2:18; Jud_1:16, Jud_1:18", "note": "", "refs": [{"l": "Mar 4:19", "n": "", "vs": [[19, "ولكن هموم الزمان الحاضر وخداع الغنى واشتهاء الأمور الأخرى، تدخل إليهم وتخنق الكلمة، فتصير بلا ثمر."]]}, {"l": "1Ti 6:9", "n": "", "vs": [[9, "أما الذين يرغبون في أن يصيروا أغنياء، فيسقطون في التجربة والفخ ويتورطون في كثير من الشهوات السفيهة المضرة التي تغرق الناس في الدمار والهلاك."]]}, {"l": "Tit 3:3", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."]]}, {"l": "2Pe 2:18", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."]]}, {"l": "Jud 1:16", "n": "", "vs": [[16, "وهؤلاء المعلمون يتذمرون ويشكون دائما وفيما هم يندفعون وراء شهواتهم، يطلقون ألسنتهم متحدثين بأمور طنانة، ويمدحون من يعجبهم طلبا للمنفعة!"]]}, {"l": "Jud 1:18", "n": "", "vs": [[18, "فقد سبق أن نبهوكم إلى أنه، في نهاية الزمان، سيطلع مستهزئون يعيشون منغمسين في شهواتهم الفاسقة."]]}], "kwAr": "شهوات مختلفة", "noteAr": ""}], "arS": [["فمن هؤلاء من ", []], ["يدخلون", ["G1744"]], [" ", []], ["البيوت", ["G3614"]], [" خلسة، ", []], ["ويوقعون في حبائلهم", ["G162"]], [" بعض ", []], ["النساء السخيفات", ["G1133"]], [" ", []], ["المثقلات", ["G4987"]], [" ", []], ["بالخطايا", ["G266"]], ["، اللواتي ", []], ["تجرفهن", ["G71"]], [" ", []], ["شهوات", ["G1939"]], [" ", []], ["مختلفة", ["G4164"]], ["،", []]]}, {"c": 3, "v": 7, "text": "يصغين للتعليم دائما، ولا يستطعن أبدا أن يبلغن معرفة الحق بالتمام!", "groups": [{"kw": "learning", "raw": "2Ti_4:3, 2Ti_4:4; Deu_29:4; Pro_14:6; Isa_30:10,Isa_30:11; Eze_14:4-10; Mat_13:11; Joh_3:20,Joh_3:21, Joh_5:44, Joh_12:42, Joh_12:43; 1Co_3:1-4; Eph_4:14; Heb_5:11", "note": "", "refs": [{"l": "2Ti 4:3", "n": "", "vs": [[3, "فإنه سيأتي زمان لا يطيق الناس فيه التعليم الصحيح، بل تبعا لشهواتهم الخاصة يكدسون لأنفسهم معلمين (يقولون لهم كلاما) يداعب الآذان."]]}, {"l": "2Ti 4:4", "n": "", "vs": [[4, "فيحولون آذانهم بعيدا عن الحق، منحرفين إلى الخرافات."]]}, {"l": "Deu 29:4", "n": "", "vs": [[4, "ولكن الرب لم يعطكم حتى الآن قلوبا لتعوا وعيونا لتبصروا وآذانا لتسمعوا."]]}, {"l": "Pro 14:6", "n": "", "vs": [[6, "عبثا يلتمس الأحمق حكمة، أما العلم فمتيسر للفطن."]]}, {"l": "Isa 30:10", "n": "", "vs": [[10, "ويقولون للأنبياء: «لا تتنبأوا لنا بما هو حق، بل كلمونا بالكلام المداهن وتنبأوا بالمخادعات."]]}, {"l": "Isa 30:11", "n": "", "vs": [[11, "اعدلوا عن الطريق، حيدوا عن السبيل، وكفوا عن مجابهتنا بكلام قدوس إسرائيل»."]]}, {"l": "Eze 14:4-10", "n": "", "vs": [[4, "لذلك قل لهم: هذا ما يعلنه السيد الرب: كل رجل من شعب إسرائيل نصب أصنامه في قلبه وأقام معثرة إثمه تلقاء وجهه، ثم أقبل إلى النبي، فإني أنا الرب أجيب ذلك الوافد على كثرة أصنامه،"], [5, "لكي أستأسر قلوب شعب إسرائيل ثانية، لأنهم ارتدوا عني بالغواية وراء أصنامهم."], [6, "لذلك قل لشعب إسرائيل، هذا ما يعلنه السيد الرب: توبوا وارجعوا عن أصنامكم واصرفوا وجوهكم عن كل رجاستكم."], [7, "لأن كل رجل من شعب إسرائيل ومن الغرباء الدخلاء القاطنين في إسرائيل، إذا ارتد عني ونصب أصنامه في قلبه وأقام معثرة إثمه تلقاء وجهه، ثم حضر إلى النبي ليسأله عني، فإني أنا الرب أجيبه بذاتي."], [8, "وأنقلب على ذلك الإنسان وأجعله عبرة ومثلا، وأستأصله من بين شعبي، فتدركون أني أنا الرب."], [9, "فإذا ضل النبي ونطق بنبوءة باطلة، فإني أنا الرب قد أغويت ذلك النبي، لأنه تصرف من نفسه. فأعاقبه وأبيده من بين شعبي إسرائيل."], [10, "وينالون عقاب إثمهم، ويكون ذنب النبي مماثلا لذنب السائل."]]}, {"l": "Mat 13:11", "n": "", "vs": [[11, "فأجاب: «لأنه قد أعطي لكم أن تعرفوا أسرار ملكوت السماوات؛ أما أولئك، فلم يعط لهم ذلك."]]}, {"l": "Joh 3:20", "n": "", "vs": [[20, "فكل من يعمل الشر يبغض النور، ولا يأتي إليه مخافة أن تفضح أعماله."]]}, {"l": "Joh 3:21", "n": "", "vs": [[21, "وأما الذي يسلك في الحق فيأتي إلى النور لتظهر أعماله ويتبين أنها عملت بقوة الله»."]]}, {"l": "Joh 5:44", "n": "", "vs": [[44, "من أين لكم أن تؤمنوا بي وأنتم تقبلون المجد بعضكم من بعض، دون أن تسعوا في طلب المجد الذي لا يمنحه إلا الله !"]]}, {"l": "Joh 12:42", "n": "", "vs": [[42, "ومع ذلك فإن كثيرين من الرؤساء آمنوا بيسوع، دون أن يجاهروا بإيمانهم، مخافة أن يحكم عليهم بالطرد من المجمع،"]]}, {"l": "Joh 12:43", "n": "", "vs": [[43, "مفضلين المجد الآتي من الناس على المجد الآتي من الله."]]}, {"l": "1Co 3:1-4", "n": "", "vs": [[1, "على أني، أيها الإخوة، لم أستطع أن أكلمكم باعتباركم روحيين، بل باعتباركم جسديين وأطفالا في المسيح."], [2, "قد أطعمتكم لبنا لا الطعام القوي، لأنكم لم تكونوا قادرين عليه، بل إنكم حتى الآن غير قادرين."], [3, "فإنكم مازلتم جسديين. فمادام بينكم حسد وخصام (وانقسام)، أفلا تكونون جسديين وتسلكون وفقا للبشر؟"], [4, "ومادام أحدكم يقول: «أنا مع بولس»، وآخر: «أنا مع أبلوس»، أفلا تكونون جسديين؟"]]}, {"l": "Eph 4:14", "n": "", "vs": [[14, "وذلك حتى لا نكون فيما بعد أطفالا تتقاذفنا وتحملنا كل ريح تعليم يقوم على خداع الناس والمكر بهم لجرهم إلى الضلال الملفق،"]]}, {"l": "Heb 5:11", "n": "", "vs": [[11, "بخصوص رئيس الكهنة هذا، عندي كلام كثير، ولكنه صعب التفسير! إذ يبدو أنكم تعانون بلادة في الفهم."]]}], "kwAr": "يصغين للتعليم دائما", "noteAr": ""}, {"kw": "never", "raw": "1Ti_2:4", "note": "", "refs": [{"l": "1Ti 2:4", "n": "", "vs": [[4, "فهو يريد لجميع الناس أن يخلصوا، ويقبلوا إلى معرفة الحق بالتمام:"]]}], "kwAr": "ولا يستطعن أبدا", "noteAr": ""}, {"kw": "the knowledge", "raw": "2Ti_2:25", "note": "", "refs": [{"l": "2Ti 2:25", "n": "", "vs": [[25, "ويؤدب بالوداعة مقاومي الإيمان، عسى أن يمنحهم الله التوبة، فيعرفوا الحق بالتمام،"]]}], "kwAr": "معرفة الحق", "noteAr": ""}], "arS": [["يصغين للتعليم", ["G3129"]], [" ", []], ["دائما", ["G3842"]], ["، ولا ", []], ["يستطعن", ["G1410"]], [" ", []], ["أبدا", ["G3368"]], [" أن ", []], ["يبلغن", ["G2064"]], [" ", []], ["معرفة", ["G1922"]], [" ", []], ["الحق", ["G225"]], [" بالتمام!", []]]}, {"c": 3, "v": 8, "text": "ومثلما قاوم (الساحران) ينيس ويمبريس موسى، كذلك أيضا يقاوم هؤلاء الحق؛ أناس عقولهم فاسدة، وقد تبين أنهم غير أهل للإيمان.", "groups": [{"kw": "as", "raw": "Exo_7:11, Exo_7:22, Exo_8:7, Exo_8:18", "note": "", "refs": [{"l": "Exo 7:11", "n": "", "vs": [[11, "فاستدعى فرعون حكماءه وسحرته فصنع سحرة مصر على غرار ذلك بسحرهم."]]}, {"l": "Exo 7:22", "n": "", "vs": [[22, "وكذلك فعل سحرة مصر بسحرهم، فتصلب قلب فرعون فلم يستمع إليهما، تماما حسب قول الرب."]]}, {"l": "Exo 8:7", "n": "", "vs": [[7, "وكذلك فعل السحرة بسحرهم فأصعدوا ضفادع على أرض مصر."]]}, {"l": "Exo 8:18", "n": "", "vs": [[18, "وكذلك حاول السحرة بسحرهم ليخرجوا البعوض فأخفقوا. وكان البعوض منتشرا على الناس والبهائم."]]}], "kwAr": "ومثلما قاوم", "noteAr": ""}, {"kw": "resist", "raw": "2Ti_4:15; 1Ki_22:22-24; Jer. 28:1-17; Act_13:8-11, Act_15:24; Gal_1:7-9, Gal_2:4, Gal_2:5; Eph_4:14; 2Th_2:9-11; Tit_1:10; 2Pe_2:1-3; 1Jo_2:18, 1Jo_4:1; Rev_2:6, Rev_2:14, Rev_2:15, Rev_2:20", "note": "", "refs": [{"l": "2Ti 4:15", "n": "", "vs": [[15, "فاحترس منه أنت أيضا، لأنه قاوم كلامنا مقاومة شديدة."]]}, {"l": "1Ki 22:22-24", "n": "", "vs": [[22, "فأجاب: أخرج، وأصبح روح ضلال في أفواه جميع أنبيائه. فقال الرب: إنك قادر على إغوائه وتفلح في ذلك، فامض ونفذ هذا الأمر."], [23, "وها الرب قد جعل الآن روح ضلال في أفواه جميع أنبيائك هؤلاء، وقد قضى عليك بالشر»."], [24, "فاقترب صدقيا بن كنعنة من ميخا وضربه على الفك قائلا: «من أين عبر روح الرب مني ليكلمك؟»"]]}, {"l": "Jer 28:1-17", "n": "", "vs": [[1, "وفي الشهر الخامس من السنة الرابعة في مستهل حكم صدقيا ملك يهوذا، قال لي حننيا بن عزور النبي الكاذب، الذي من جبعون، في حضور الكهنة وكل الشعب المجتمعين في هيكل الرب:"], [2, "«هذا ما يعلنه الرب القدير إله إسرائيل: إني قد حطمت نير ملك بابل."], [3, "وبعد عامين أرد إلى هذا الموضع كل آنية هيكل الرب التي استولى عليها نبوخذناصر ملك بابل من هذا المكان وحملها إلى بابل."], [4, "وأرد إلى هذا الموضع يكنيا بن يهوياقيم ملك يهوذا، وكل سبي يهوذا الذين نفوا إلى بابل، لأني سأحطم نير ملك بابل»."], [5, "عندئذ قال إرميا النبي لحننيا المتنبيء أمام الكهنة وسائر الشعب الماثل في هيكل الرب:"], [6, "«آمين. ليحقق الرب هذا، وليتمم الرب كلامك الذي تنبأت به، ويرد آنية هيكله وكل المسبيين من بابل إلى هذا الموضع."], [7, "لكن أصغ إلى هذه الكلمة التي أنطق بها على مسمعك وعلى مسامع الشعب كله:"], [8, "إن الأنبياء الذين كانوا قبلي وقبلك في الأزمان السالفة، تنبأوا على بلدان كثيرة وممالك عظيمة بالحروب والجوع والوباء،"], [9, "أما النبي الذي تنبأ بالسلام، فعند تحقق نبوءته يعرف أن الرب قد أرسله حقا»."], [10, "فأخذ حننيا المتنبيء الكاذب النير عن عنق إرميا النبي وحطمه،"], [11, "وقال أمام كل الشعب: «هذا ما يعلنه الرب: هكذا أحطم نير نبوخذناصر ملك بابل بعد عامين عن أعناق جميع الأمم». ثم مضى إرميا النبي في سبيله."], [12, "وبعد أن حطم حننيا المتنبيء الكاذب النير عن عنق إرميا قال الرب لإرميا النبي:"], [13, "«اذهب وقل لحننيا: هذا ما يعلنه الرب: أنت حطمت أنيار خشب، ولكني أعددت مكانها أنيارا من حديد."], [14, "لأن هذا ما يعلنه الرب القدير إله إسرائيل: إني قد وضعت نيرا من حديد على أعناق جميع الأمم لتستعبد لنبوخذناصر ملك بابل، فيكونون له عبيدا وقد عهدت إليه أيضا بحيوان الحقل»."], [15, "وأضاف إرميا النبي مخاطبا حننيا المتنبيء: «اسمع ياحننيا، هذا ما يعلنه الرب: إن الرب لم يبعثك، وأنت جعلت هذا الشعب يصدق كذبك."], [16, "لذلك هكذا يعلن الرب: ها أنا أبيدك عن وجه الأرض فتموت في هذه السنة لأنك نطقت بالتمرد على الرب»."], [17, "وفي الشهر السابع من تلك السنة عينها مات حننيا."]]}, {"l": "Act 13:8-11", "n": "", "vs": [[8, "فعارضهما الساحر عليم، وهذا معنى اسمه، ساعيا أن يحول الحاكم عن الإيمان."], [9, "أما شاول، وقد صار اسمه بولس، فامتلأ من الروح القدس، ونظر إلى الساحر وقال:"], [10, "«أيها الممتليء غشا وخبثا! ياابن إبليس! ياعدو كل بر! أما تكف عن تعويج طرق الرب المستقيمة؟"], [11, "الآن ستمتد يد الرب عليك، فتصير أعمى لا تبصر النور إلى حين». وفي الحال سقطت على عينيه غمامة مظلمة، فأخذ يدور طالبا من يقوده بيده!"]]}, {"l": "Act 15:24", "n": "", "vs": [[24, "علمنا أن بعض الأشخاص ذهبوا من عندنا إليكم، دون تفويض منا فأثاروا بكلامهم الاضطراب بينكم وأقلقوا أفكاركم."]]}, {"l": "Gal 1:7-9", "n": "", "vs": [[7, "لا أعني أن هنالك إنجيلا آخر، بل إنما هنالك بعض (المعلمين) الذين يثيرون البلبلة بينكم، راغبين في تحوير إنجيل المسيح."], [8, "ولكن، حتى لو بشرناكم نحن، أو بشركم ملاك من السماء، بغير الإنجيل الذي بشرناكم به، فليكن ملعونا!"], [9, "وكما سبق أن قلنا، أكر ر القول الآن أيضا: إن كان أحد يبشركم بإنجيل غير الذي قبلتموه، فليكن ملعونا!"]]}, {"l": "Gal 2:4", "n": "", "vs": [[4, "إنما أثير الأمر بسبب الإخوة الدجالين الذين أدخلوا بيننا خلسة، فاندسوا ليتجسسوا حريتنا التي لنا في المسيح يسوع، لعلهم يعيدوننا إلى العبودية؛"]]}, {"l": "Gal 2:5", "n": "", "vs": [[5, "فلم نخضع لهم مستسلمين ولو لساعة واحدة، ليبقى حق الإنجيل ثابتا عندكم."]]}, {"l": "Eph 4:14", "n": "", "vs": [[14, "وذلك حتى لا نكون فيما بعد أطفالا تتقاذفنا وتحملنا كل ريح تعليم يقوم على خداع الناس والمكر بهم لجرهم إلى الضلال الملفق،"]]}, {"l": "2Th 2:9-11", "n": "", "vs": [[9, "أما بروز المتمرد، فسوف يكون بقدر طاقة الشيطان على المعجزات والعلامات والعجائب المزيفة كلها،"], [10, "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا."], [11, "ولهذا السبب، سيرسل الله إليهم طاقة الضلال حتى يصدقوا ما هو دجل،"]]}, {"l": "Tit 1:10", "n": "", "vs": [[10, "فإن هنالك كثيرين من معلمي الباطل المتمردين وخادعي عقول الناس، وبخاصة الذين من أهل الختان."]]}, {"l": "2Pe 2:1-3", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."], [2, "وكثيرون سيسيرون وراءهم في طرق الإباحية. وبسببهم توجه الإهانة إلى طريق الحق."], [3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "1Jo 2:18", "n": "", "vs": [[18, "أيها الأولاد، اعلموا أننا نعيش الآن في الزمن الأخير. وكما سمعتم أنه سوف يأتي أخيرا «مسيح دجال»، فقد ظهر حتى الآن كثيرون من الدجالين المقاومين للمسيح. من هنا نتأكد أننا نعيش في الزمن الأخير."]]}, {"l": "1Jo 4:1", "n": "
