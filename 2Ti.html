<script>window.CATALOG=[{"id": 17, "abbr": "Est", "en": "Esther", "nc": 10, "nv": 167, "refs": 1266, "last": "10:3", "first": "وحدث في أيام أحشويروش، الذي امتد حكمه من الهند إلى كوش، فملك على مئة وسبعة وعشرين إقليما،"}, {"id": 18, "abbr": "Job", "en": "Job", "nc": 42, "nv": 1070, "refs": 10209, "last": "42:17", "first": "عاش في أرض عوص رجل اسمه أيوب، كان صالحا كاملا يتقي الله ويحيد عن الشر."}, {"id": 19, "abbr": "Psa", "en": "Psalms", "nc": 150, "nv": 2461, "refs": 33395, "last": "150:6", "first": "طوبى للإنسان الذي لا يتبع مشورة الأشرار، ولا يقف في طريق الخاطئين، ولا يجالس المستهزئين."}, {"id": 20, "abbr": "Pro", "en": "Proverbs", "nc": 31, "nv": 915, "refs": 10457, "last": "31:31", "first": "هذه هي أمثال سليمان بن داود ملك إسرائيل،"}, {"id": 21, "abbr": "Ecc", "en": "Ecclesiastes", "nc": 12, "nv": 222, "refs": 3186, "last": "12:14", "first": "هذه أقوال الجامعة ابن داود ملك أورشليم."}, {"id": 22, "abbr": "Son", "en": "Song of Solomon", "nc": 8, "nv": 117, "refs": 1802, "last": "8:14", "first": "هذا نشيد الأناشيد لسليمان."}, {"id": 23, "abbr": "Isa", "en": "Isaiah", "nc": 66, "nv": 1292, "refs": 21959, "last": "66:24", "first": "هذه هي رؤيا إشعياء بن آموص، التي أعلنت له بشأن يهوذا وأورشليم في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا."}, {"id": 24, "abbr": "Jer", "en": "Jeremiah", "nc": 52, "nv": 1364, "refs": 20659, "last": "52:34", "first": "هذه نبوءة إرميا بن حلقيا أحد الكهنة المقيمين في عناثوث بأرض سبط بنيامين."}, {"id": 25, "abbr": "Lam", "en": "Lamentations", "nc": 5, "nv": 154, "refs": 2238, "last": "5:22", "first": "كيف أصبحت المدينة الآهلة بالسكان مهجورة وحيدة؟ صارت كأرملة! هذه التي كانت عظيمة بين الأمم. السيدة بين المدن صارت تحت الجزية!"}, {"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 48, "nv": 1273, "refs": 15264, "last": "48:35", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 55, "abbr": "2Ti", "en": "2 Timothy", "verses": [{"c": 1, "v": 1, "text": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،", "groups": [{"kw": "an", "raw": "Rom_1:1; 2Co_1:1", "note": "", "refs": [{"l": "Rom 1:1", "n": "", "vs": [[1, "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"]]}, {"l": "2Co 1:1", "n": "", "vs": [[1, "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."]]}], "kwAr": "رسول", "noteAr": ""}, {"kw": "the promise", "raw": "Joh_5:24, Joh_5:39, Joh_5:40, Joh_6:40,Joh_6:54, Joh_10:28, Joh_17:3; Rom_5:21, Rom_6:23; 2Co_1:20; Eph_3:6; Tit_1:2; Heb_9:15; 2Pe_1:3, 2Pe_1:4; 1Jo_2:25, 1Jo_5:11-13", "note": "", "refs": [{"l": "Joh 5:24", "n": "", "vs": [[24, "الحق الحق أقول لكم إن من يسمع كلامي ويؤمن بالذي أرسلني تكون له الحياة الأبدية، ولا يحاكم في اليوم الأخير، لأنه قد انتقل من الموت إلى الحياة."]]}, {"l": "Joh 5:39", "n": "", "vs": [[39, "أنتم تدرسون الكتب لأنكم تعتقدون أنها ستهديكم إلى الحياة الأبدية. هذه الكتب تشهد لي،"]]}, {"l": "Joh 5:40", "n": "", "vs": [[40, "ولكنكم ترفضون أن تأتوا إلي لتكون لكم الحياة."]]}, {"l": "Joh 6:40", "n": "", "vs": [[40, "نعم! إن مشيئة أبي هي أن كل من يرى الابن ويؤمن به تكون له الحياة الأبدية، وسأقيمه أنا في اليوم الأخير»."]]}, {"l": "Joh 6:54", "n": "", "vs": [[54, "من يأكل جسدي ويشر ب دمي، فله حياة أبدية، وأنا أقيمه في اليوم الأخير،"]]}, {"l": "Joh 10:28", "n": "", "vs": [[28, "وأعطيها حياة أبدية، فلا تهلك إلى الأبد، ولا ينتزعها أحد من يدي."]]}, {"l": "Joh 17:3", "n": "", "vs": [[3, "والحياة الأبدية هي أن يعرفوك أنت الإله الحق وحدك، والذي أرسلته: يسوع المسيح."]]}, {"l": "Rom 5:21", "n": "", "vs": [[21, "حتى إنه كما ملكت الخطيئة بالموت، فكذلك أيضا تملك النعمة على أساس البر مؤدية إلى الحياة الأبدية بيسوع المسيح ربنا."]]}, {"l": "Rom 6:23", "n": "", "vs": [[23, "لأن أجرة الخطيئة هي الموت، وأما هبة الله فهي الحياة الأبدية في المسيح يسوع ربنا."]]}, {"l": "2Co 1:20", "n": "", "vs": [[20, "فمهما كانت وعود الله، فإن فيه النعم لها كلها، وفيه الآمين بنا لأجل مجد الله."]]}, {"l": "Eph 3:6", "n": "", "vs": [[6, "وهو أن الأمم هم شركاء اليهود في الميراث، وأعضاء في الجسد معهم، ولهم أيضا حق الاستفادة من الوعد. وذلك في المسيح يسوع وبفضل الإنجيل"]]}, {"l": "Tit 1:2", "n": "", "vs": [[2, "في رجاء الحياة الأبدية، التي وعد بها الله المنزه عن الكذب، من قبل أزمنة الأزل،"]]}, {"l": "Heb 9:15", "n": "", "vs": [[15, "ولذلك، فالمسيح هو الوسيط لهذا العهد الجديد. فبما أنه قد تم الموت فداء للمخالفات الحاصلة تحت العهد الأول، ينال المدعوون الوعد بالإرث الأبدي."]]}, {"l": "2Pe 1:3", "n": "", "vs": [[3, "إن الله، بقدرته الإلهية، قد زودنا بكل ما نحتاج إليه في الحيا ة الروحية المتصفة بالتقوى. ذلك أنه عرفنا بالمسيح الذي دعانا إلى مجده وفضيلته،"]]}, {"l": "2Pe 1:4", "n": "", "vs": [[4, "اللذين بهما أعطانا الله بركاته العظمى الثمينة التي كان قد وعد بها. وبهذا صار بإمكانكم أن تتخلصوا من الفساد الذي تنشره الشهوة في العالم، وتشتركوا في الطبيعة الإلهية."]]}, {"l": "1Jo 2:25", "n": "", "vs": [[25, "فإن الله نفسه قد وعدنا بالحياة الأبدية."]]}, {"l": "1Jo 5:11-13", "n": "", "vs": [[11, "وهذه الشهادة هي أن الله أعطانا حياة أبدية، وأن هذه الحياة هي في ابنه."], [12, "فمن كان له ابن الله كانت له الحياة. ومن لم يكن له ابن الله، لم تكن له الحياة!"], [13, "يامن آمنتم باسم ابن الله، إني كتبت هذا إليكم لكي تعرفوا أن الحياة الأبدية ملك لكم منذ الآن."]]}], "kwAr": "الوعد بالحياة", "noteAr": ""}], "arS": [["من ", []], ["بولس", ["G3972"]], ["، وهو ", []], ["بمشيئة", ["G2307"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["رسول", ["G652"]], [" ", []], ["للمسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["في سبيل", ["G2596"]], [" ", []], ["الوعد", ["G1860"]], [" ", []], ["بالحياة", ["G2222"]], [" التي هي في ", []], ["المسيح", ["G5547"]], ["،", []]]}, {"c": 1, "v": 2, "text": "إلى تيموثاوس، ولدي الحبيب لتكن لك النعمة والرحمة والسلام من الله الآب والمسيح يسوع ربنا.", "groups": [{"kw": "Timothy", "raw": "1Ti_1:2; Rom_12:19; Phi_4:1", "note": "", "refs": [{"l": "1Ti 1:2", "n": "", "vs": [[2, "إلى تيموثاوس ولدي الحقيقي في الإيمان. لتكن لك النعمة والرحمة والسلام من الله أبينا والمسيح يسوع ربنا!"]]}, {"l": "Rom 12:19", "n": "", "vs": [[19, "لا تنتقموا لأنفسكم، أيها الأحباء، بل دعوا الغضب لله، لأنه قد كتب: «لي الانتقام، أنا أجازي، يقول الرب»."]]}, {"l": "Phi 4:1", "n": "", "vs": [[1, "إذن، ياإخوتي الأحباء والمشتاق إليهم، يافرحي وإكليلي، هكذا اثبتوا في الرب أيها الأحباء."]]}], "kwAr": "تيموثاوس", "noteAr": ""}, {"kw": "Grace", "raw": "Rom_1:7", "note": "", "refs": [{"l": "Rom 1:7", "n": "", "vs": [[7, "إلى جميع من هم في روما من أحباء الله القديسين المدعوين. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}], "kwAr": "النعمة", "noteAr": ""}], "arS": [["إلى ", []], ["تيموثاوس", ["G5095"]], ["، ", []], ["ولدي", ["G5043"]], [" ", []], ["الحبيب", ["G27"]], [" لتكن لك ", []], ["النعمة", ["G5485"]], [" ", []], ["والرحمة", ["G1656"]], [" ", []], ["والسلام", ["G1515"]], [" ", []], ["من", ["G575"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["الآب", ["G3962"]], [" ", []], ["والمسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["ربنا", ["G2962", "G2257"]], [".", []]]}, {"c": 1, "v": 3, "text": "كم أشكر الله ، الذي أعبده بضمير طاهر كما أخذت عن أجدادي، إذ مازلت أذكرك دائما في تضرعاتي ليلا ونهارا؛", "groups": [{"kw": "I thank", "raw": "Rom_1:8; Eph_1:16", "note": "", "refs": [{"l": "Rom 1:8", "n": "", "vs": [[8, "بادىء بدء، أشكر إلهي بيسوع المسيح من أجلكم جميعا، لأن إيمانكم يذاع خبره في العالم كله."]]}, {"l": "Eph 1:16", "n": "", "vs": [[16, "لا أنقطع عن شكر الله لأجلكم وعن ذكركم في صلواتي،"]]}], "kwAr": "أشكر الله", "noteAr": ""}, {"kw": "whom", "raw": "2Ti_1:5, 2Ti_3:15; Act_22:3, Act_24:14, Act_26:4, Act_27:23; Gal_1:14", "note": "", "refs": [{"l": "2Ti 1:5", "n": "", "vs": [[5, "كما أستذكر إيمانك الخالي من الرياء، هذا الإيمان الذي فيك والذي حل أولا في جدتك لوئيس ثم في أمك أفنيكي، وأنا متأكد أنه حال فيك أيضا."]]}, {"l": "2Ti 3:15", "n": "", "vs": [[15, "وتعلم أنك منذ حداثة سنك تعرف الكتب المقدسة، وهي القادرة أن تجعلك حكيما لبلوغ الخلاص عن طريق الإيمان في المسيح يسوع."]]}, {"l": "Act 22:3", "n": "", "vs": [[3, "»أنا رجل يهودي، ولدت في طرسوس الواقعة في مقاطعة كيليكية، ولكني نشأت في هذه المدينة وتعلمت عند قدمي غمالائيل التربية الموافقة تماما لشريعة آبائنا. وكنت غيورا في أمور الله، مثلكم جميعا اليوم."]]}, {"l": "Act 24:14", "n": "", "vs": [[14, "ولكني أعترف أمامك بأني أعبد إله آبائي بحسب المذهب الذي يصفونه بأنه بدعة، وأومن بكل ما كتب في الشريعة وكتب الأنبياء،"]]}, {"l": "Act 26:4", "n": "", "vs": [[4, "إن اليهود جميعا يعرفون نشأتي من البداية. فقد عشت بين شعبي في أورشليم منذ صغري."]]}, {"l": "Act 27:23", "n": "", "vs": [[23, "فقد ظهر لي هذه الليلة ملاك من عند الله الذي أنا له وإياه أخدم،"]]}, {"l": "Gal 1:14", "n": "", "vs": [[14, "وكيف كنت متفوقا في الديانة اليهودية على كثيرين من أبناء جيلي في أمتي لكوني غيورا أكثر منهم جدا على تقاليد آبائي."]]}], "kwAr": "الذي أعبده", "noteAr": ""}, {"kw": "with", "raw": "Act_23:1, Act_24:16; Rom_1:9, Rom_9:1; 2Co_1:12; 1Ti_1:5, 1Ti_1:19; Heb_13:8", "note": "", "refs": [{"l": "Act 23:1", "n": "", "vs": [[1, "فحدق بولس إلى المجلس، وقال: «أيها الإخوة، إني عشت لله بضمير صالح حتى هذا اليوم»."]]}, {"l": "Act 24:16", "n": "", "vs": [[16, "لذلك أنا أيضا أدرب نفسي لكي أحيا دائما بضمير نقي أمام الله والناس."]]}, {"l": "Rom 1:9", "n": "", "vs": [[9, "فإن الله الذي أخدمه بروحي في التبشير بإنجيل ابنه، هو شاهد لي كيف لا أتوقف عن ذكركم"]]}, {"l": "Rom 9:1", "n": "", "vs": [[1, "أقول الحق في المسيح، لست أكذب، وضميري شاهد لي في الروح القدس،"]]}, {"l": "2Co 1:12", "n": "", "vs": [[12, "فإن فخرنا هو هذا: شهادة ضميرنا بأننا، في قداسة الله وإخلاصه، قد سلكنا في العالم، وبخاصة تجاهكم؛ ولم يكن ذلك بحكمة بشرية بل بنعمة الله."]]}, {"l": "1Ti 1:5", "n": "", "vs": [[5, "أما الغاية مما أوصيتك به، فهي المحبة النابعة من قلب طاهر وضمير صالح وإيمان خال من الرياء."]]}, {"l": "1Ti 1:19", "n": "", "vs": [[19, "متمسكا بالإيمان، وبالضمير الصالح، هذا الضمير الذي تخلى عنه بعضهم، فانكسرت بهم سفينة الإيمان."]]}, {"l": "Heb 13:8", "n": "", "vs": [[8, "يسوع المسيح هو هو أمسا واليوم وإلى الأبد."]]}], "kwAr": "بضمير طاهر", "noteAr": ""}, {"kw": "that", "raw": "Rom_1:9; 1Th_1:2, 1Th_1:3, 1Th_3:10", "note": "", "refs": [{"l": "Rom 1:9", "n": "", "vs": [[9, "فإن الله الذي أخدمه بروحي في التبشير بإنجيل ابنه، هو شاهد لي كيف لا أتوقف عن ذكركم"]]}, {"l": "1Th 1:2", "n": "", "vs": [[2, "إننا نشكر الله دائما من أجلكم جميعا، إذ نذكركم في صلواتنا دون توقف؛"]]}, {"l": "1Th 1:3", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"]]}, {"l": "1Th 3:10", "n": "", "vs": [[10, "ونحن نتضرع ليل نهار متوسلين أن نرى وجوهكم ونكمل ما كان ناقصا في إيمانكم؟"]]}], "kwAr": "أذكرك دائما", "noteAr": ""}, {"kw": "night", "raw": "Luk_2:37", "note": "", "refs": [{"l": "Luk 2:37", "n": "", "vs": [[37, "وهي أرملة نحو أربع وثمانين سنة. لم تكن تفارق الهيكل وكانت تتعبد ليلا ونهارا بالصوم والدعاء."]]}], "kwAr": "ليلا ونهارا", "noteAr": ""}], "arS": [["كم ", []], ["أشكر", ["G2192", "G5485"]], [" ", []], ["الله", ["G2316"]], [" ، ", []], ["الذي", ["G3739"]], [" ", []], ["أعبده", ["G3000"]], [" ", []], ["بضمير", ["G4893"]], [" ", []], ["طاهر", ["G2513"]], [" كما أخذت عن ", []], ["أجدادي", ["G4269"]], ["، إذ مازلت ", []], ["أذكرك", ["G3417", "G4675"]], [" ", []], ["دائما", ["G88"]], [" في ", []], ["تضرعاتي", ["G1162", "G3450"]], [" ", []], ["ليلا", ["G3571"]], [" ", []], ["ونهارا", ["G2250"]], ["؛", []]]}, {"c": 1, "v": 4, "text": "وإذ أتذكر دموعك (ساعة افتراقنا) أجدني في غاية الشوق لأن أراك لأمتليء فرحا.", "groups": [{"kw": "desiring", "raw": "2Ti_4:9, 2Ti_4:21; Rom_1:11, Rom_15:30-32; Phi_1:8, Phi_2:26; 1Th_2:17-20, 1Th_3:1", "note": "", "refs": [{"l": "2Ti 4:9", "n": "", "vs": [[9, "اجتهد أن تأتي إلي سريعا،"]]}, {"l": "2Ti 4:21", "n": "", "vs": [[21, "اجتهد أن تجيء إلي قبل حلول الشتاء."]]}, {"l": "Rom 1:11", "n": "", "vs": [[11, "فإني أشتاق أن أراكم لأحمل إليكم موهبة روحية لتثبيتكم،"]]}, {"l": "Rom 15:30-32", "n": "", "vs": [[30, "فأتوسل إليكم، أيها الإخوة، بربنا يسوع المسيح وبمحبة الروح، أن تجاهدوا معي في الصلوات إلى الله من أجلي،"], [31, "لكي أنجو من غير المؤمنين الذين في اليهودية، ولكي تكون خدمتي هذه للقديسين في أورشليم مقبولة عندهم،"], [32, "حتى أجيء إليكم في فرح بمشيئة الله فأنتعش عندكم وأستريح."]]}, {"l": "Phi 1:8", "n": "", "vs": [[8, "فإن الله شاهد لي كيف أحن إليكم جميعا في عواطف المسيح يسوع."]]}, {"l": "Phi 2:26", "n": "", "vs": [[26, "إذ كان مشتاقا إليكم جميعا، ومكتئبا لسماعكم بمرضه."]]}, {"l": "1Th 2:17-20", "n": "", "vs": [[17, "أما نحن، أيها الإخوة، فإذ قد سلخنا عنكم لمدة قصيرة، بالوجه لا بالقلب، بذلنا جهدا أوفر جدا لرؤية وجوهكم ونحن في غاية الشوق إليكم."], [18, "ولهذا عزمنا أن نأتي إليكم على الأخص أنا بولس مرة بعد مرة، فعاقنا الشيطان."], [19, "فما هو رجاؤنا أو فرحنا أو إكليل افتخارنا أمام ربنا يسوع عند عودته؟ أليس أنتم؟ بلى،"], [20, "لأنكم فخرنا وفرحنا."]]}, {"l": "1Th 3:1", "n": "", "vs": [[1, "لذلك لما صار افتراقنا عنكم لا يحتمل، حسن لدينا أن نبقى وحدنا في مدينة أثينا،"]]}], "kwAr": "الشوق لأن أراك", "noteAr": ""}, {"kw": "being", "raw": "Act_20:19, Act_20:31, Act_20:37, Act_20:38; Rev_7:17, Rev_21:4", "note": "", "refs": [{"l": "Act 20:19", "n": "", "vs": [[19, "فقد كنت أخدم الرب بكل تواضع، وبكثير من الدموع، وأنا أعاني المحن التي أصابتني بها مؤامرات اليهود."]]}, {"l": "Act 20:31", "n": "", "vs": [[31, "لذلك كونوا متيقظين، وتذكروا أني، مدة ثلاث سنين، لم أتوقف ليلا ونهارا عن نصح كل واحد منكم وأنا أذرف الدموع."]]}, {"l": "Act 20:37", "n": "", "vs": [[37, "وبكى الجميع كثيرا، وعانقوا بولس وقبلوه بحرارة."]]}, {"l": "Act 20:38", "n": "", "vs": [[38, "وقد حزنوا كثيرا، خاصة لأنه قال لهم إنهم لن يروا وجهه مرة أخرى. ثم رافقوه إلى السفينة مودعين."]]}, {"l": "Rev 7:17", "n": "", "vs": [[17, "لأن الحمل الذي في وسط العرش يرعاهم ويقودهم إلى ينابيع ماء الحياة، ويمسح الله كل دمعة من عيونهم»."]]}, {"l": "Rev 21:4", "n": "", "vs": [[4, "وسيمسح كل دمعة من عيونهم. إذ يزول الموت والحزن والصراخ والألم، لأن الأمور القديمة كلها قد زالت!»"]]}], "kwAr": "أتذكر دموعك", "noteAr": ""}, {"kw": "filled", "raw": "Psa_126:5; Isa_61:3; Jer_31:13; Joh_16:22, Joh_16:24; 1Jo_1:4", "note": "", "refs": [{"l": "Psa 126:5", "n": "", "vs": [[5, "فمن يزرع بالدموع يحصد غلاته بالابتهاج."]]}, {"l": "Isa 61:3", "n": "", "vs": [[3, "لأمنح نائحي صهيون تاج جمال بدل الرماد، ودهن السرور بدل النوح، ورداء تسبيح بدل الروح اليائسة، فيدعون أشجار البر وغرس الرب لكي يتمجد."]]}, {"l": "Jer 31:13", "n": "", "vs": [[13, "حينئذ تبتهج العذارى بالرقص، ويطر ب الشيوخ والشبان على حد سواء. أحول نوحهم إلى سرور وأستبدل حزنهم بالفرح والطمأنينة."]]}, {"l": "Joh 16:22", "n": "", "vs": [[22, "فكذلك أنتم، تحزنون الآن؛ ولكن عندما أعود للقائكم، تبتهج قلوبكم، ولا أحد يسلبكم فرحكم."]]}, {"l": "Joh 16:24", "n": "", "vs": [[24, "حتى الآن لم تطلبوا باسمي شيئا. اطلبوا تنالوا، فيكون فرحكم كاملا."]]}, {"l": "1Jo 1:4", "n": "", "vs": [[4, "ونكتب إليكم هذه الأمور لكي يكتمل فرحكم!"]]}], "kwAr": "لأمتليء فرحا", "noteAr": ""}], "arS": [["وإذ ", []], ["أتذكر", ["G3415"]], [" ", []], ["دموعك", ["G1144", "G4675"]], [" (ساعة افتراقنا) أجدني في غاية ", []], ["الشوق", ["G1971"]], [" لأن ", []], ["أراك", ["G1492", "G4571"]], [" ", []], ["لأمتليء", ["G4137"]], [" ", []], ["فرحا", ["G5479"]], [".", []]]}, {"c": 1, "v": 5, "text": "كما أستذكر إيمانك الخالي من الرياء، هذا الإيمان الذي فيك والذي حل أولا في جدتك لوئيس ثم في أمك أفنيكي، وأنا متأكد أنه حال فيك أيضا.", "groups": [{"kw": "I call", "raw": "Psa_77:6", "note": "", "refs": [{"l": "Psa 77:6", "n": "", "vs": [[6, "في الليل أتذكر ترنيمي، وأناجي قلبي، وتجد في البحث نفسي."]]}], "kwAr": "أستذكر", "noteAr": ""}, {"kw": "unfeigned", "raw": "Psa_17:1, Psa_18:44, Psa_66:3, Psa_81:15 *marg. Jer_3:10; Joh_1:47; 2Co_6:6; 1Ti_1:5, 1Ti_4:6; 1Pe_1:22", "note": "", "refs": [{"l": "Psa 17:1", "n": "", "vs": [[1, "اسمع يارب دعوى الحق. أنصت إلى صراخي، وأصغ إلى صلاتي الصاعدة من شفتين صادقتين."]]}, {"l": "Psa 18:44", "n": "", "vs": [[44, "فما إن يسمعوا أمري حتى يلبوه. الغرباء يتذللون لي"]]}, {"l": "Psa 66:3", "n": "", "vs": [[3, "قولوا لله: «ما أروع أعمالك». يتملقك أعداؤك لأن قوتك عظيمة."]]}, {"l": "Psa 81:15", "n": "*marg.", "vs": [[15, "ولكان مبغضي يتملقونني، ولطالت حقبة عقابهم إلى الأبد."]]}, {"l":  {"l": "Rom 4:21", "n": "", "vs": [[21, "وإذ اقتنع تماما بأن ما وعده الله به هو قادر أن يفعله؛"]]}, {"l": "Rom 8:38", "n": "", "vs": [[38, "فإني لعلى يقين بأنه لا الموت ولا الحياة، ولا الملائكة ولا الرياسات، ولا الأمور الحاضرة ولا الآتية، ولا القوات،"]]}, {"l": "Rom 14:5", "n": "", "vs": [[5, "ومن الناس من يراعي يوما دون غيره، ومنهم من يعتبر الأيام كلها متساوية. فليكن كل واحد مقتنعا برأيه في عقله."]]}, {"l": "Rom 14:14", "n": "", "vs": [[14, "فأنا عالم، بل مقتنع من الرب يسوع، أنه لا شيء نجس في ذاته. أما إن اعتبر أحد شيئا ما نجسا، فهو نجس في نظره."]]}, {"l": "Rom 15:14", "n": "", "vs": [[14, "وأنا نفسي أيضا على يقين من جهتكم أيها الإخوة بأنكم مشحونون صلاحا، وممتلئون بكل معرفة، وقادرون أيضا على نصح بعضكم بعضا."]]}, {"l": "Heb 6:9", "n": "", "vs": [[9, "أيها الأحباء، مع أني قصدت تحذيركم بما قلته هنا، فأنا مقتنع بأن خلاصكم أمر لا شك فيه. إذ قد عملتم أعمالا فضلى، ترافق هذا الخلاص."]]}, {"l": "Heb 11:13", "n": "", "vs": [[13, "هؤلاء جميعا، حافظوا على إيمانهم إلى النهاية. وماتوا قبل أن تتحقق وعود الله لهم في أثناء حياتهم. ولكنهم رأوها من بعيد، وتوقعوا تحقيقها كاملة في المستقبل. وإذ آمنوا بتلك الوعود الإلهية اعترفوا بأنهم ليسوا إلا غرباء على الأرض يزورونها زيارة عابرة."]]}], "kwAr": "وأنا متأكد", "noteAr": ""}], "arS": [["كما ", []], ["أستذكر", ["G5280", "G2983"]], [" ", []], ["إيمانك", ["G4102"]], [" ", []], ["الخالي من الرياء", ["G505"]], ["، هذا الإيمان الذي فيك والذي ", []], ["حل", ["G1774"]], [" ", []], ["أولا", ["G4412"]], [" في ", []], ["جدتك", ["G3125"]], [" ", []], ["لوئيس", ["G3090"]], [" ثم في ", []], ["أمك", ["G3384"]], [" ", []], ["أفنيكي", ["G2131"]], ["، وأنا ", []], ["متأكد", ["G3982"]], [" أنه حال فيك أيضا.", []]]}, {"c": 1, "v": 6, "text": "لهذا السبب أنبهك أن تلهب نار موهبة الله التي فيك بوضع يدي عليك.", "groups": [{"kw": "I put", "raw": "2Ti_2:14; Isa_43:26; 1Ti_4:6; 2Pe_1:12, 2Pe_3:1; Jud_1:5", "note": "", "refs": [{"l": "2Ti 2:14", "n": "", "vs": [[14, "بهذه الأمور ذكر، شاهدا في حضرة الله أن لا تنشأ المجادلات الكلامية، وهي لا تنفع شيئا، غير تخريب سامعيها."]]}, {"l": "Isa 43:26", "n": "", "vs": [[26, "هيا إلى المحاكمة، واعرض علي دعواك، لتتبرر"]]}, {"l": "1Ti 4:6", "n": "", "vs": [[6, "إن بسطت هذه الأمور أمام الإخوة، كنت خادما صالحا للمسيح يسوع، متغذيا بكلام الإيمان والتعليم الصالح الذي اتبعته تماما."]]}, {"l": "2Pe 1:12", "n": "", "vs": [[12, "لذلك أنوي أن أذكركم دائما بهذه الأمور، وإن كنتم عالمين بها، وراسخين في الحق الذي عندكم."]]}, {"l": "2Pe 3:1", "n": "", "vs": [[1, "أيها الأحباء، أنا الآن أكتب إليكم رسالتي الثانية. وفي كلتا الرسالتين، أقصد أن أنبه أذهانكم الصافية، مذكرا إياكم بحقائق تعرفونها."]]}, {"l": "Jud 1:5", "n": "", "vs": [[5, "فالآن، أريد أن أذكركم بأمور تعرفونها. فأنتم تعرفون أن الرب، بعدما أنقذ الشعب من مصر، عاد فأهلك الذين لم يؤمنوا من ذلك الشعب."]]}], "kwAr": "أنبهك", "noteAr": ""}, {"kw": "that", "raw": "2Ti_4:2; Exo_35:26, Exo_36:2; Matt. 25:15-30; Luk_19:13; Rom_12:6-8; 1Th_5:19; 1Pe_4:10,1Pe_4:11", "note": "", "refs": [{"l": "2Ti 4:2", "n": "", "vs": [[2, "أن تنادي بالكلمة منشغلا بها كليا، في الفرص المناسبة وغير المناسبة على السواء، وأن توبخ وتنذر وتشجع بكل صبر في التعليم."]]}, {"l": "Exo 35:26", "n": "", "vs": [[26, "كما غزلت النساء اللواتي حثتهن قلوبهن، منسوجات من شعر المعزى."]]}, {"l": "Exo 36:2", "n": "", "vs": [[2, "ثم استدعى موسى بصلئيل وأهوليآب وكل صانع ماهر وهبه الرب حذاقة، وكل من حثه قلبه على المساهمة في إنجاز عمل ما."]]}, {"l": "Mat 25:15-30", "n": "", "vs": [[15, "فأعطى واحدا منهم خمس وزنات (من الفضة)، وأعطى آخر وزنتين، وأعطى الثالث وزنة واحدة، كل واحد على قدر طاقته، ثم سافر."], [16, "وفي الحال مضى الذي أخذ الوزنات الخمس وتاجر بها، فربح خمس وزنات أخرى."], [17, "وعمل مثله الذي أخذ الوزنتين، فربح وزنتين أخريين."], [18, "ولكن الذي أخذ الوزنة الواحدة، مضى وحفر حفرة في الأرض وطمر مال سيده."], [19, "وبعد مدة طويلة، رجع سيد أولئك العبيد واستدعاهم ليحاسبهم."], [20, "فجاءه الذي أخذ الوزنات الخمس، وقدم الوزنات الخمس الأخرى، وقال: ياسيد، أنت سلمتني خمس وزنات، فهذه خمس وزنات غيرها ربحتها !"], [21, "فقال له سيده: حسنا فعلت أيها العبد الصالح والأمين! كنت أمينا على القليل، فسأقيمك على الكثير. ادخل إلى فرح سيدك!"], [22, "ثم جاءه أيضا الذي أخذ الوزنتين وقال: ياسيد أنت سلمتني وزنتين، فهاتان وزنتان غيرهما ربحتهما!"], [23, "فقال له سيده: حسنا فعلت أيها العبد الصالح والأمين! كنت أمينا على القليل، فسأقيمك على الكثير. ادخل إلى فرح سيدك!"], [24, "ثم جاءه أيضا الذي أخذ الوزنة الواحدة، وقال: ياسيد، عرفتك رجلا قاسيا، تحصد من حيث لم تزرع، وتجمع من حيث لم تبذر،"], [25, "فخفت، فذهبت وطمرت وزنتك في الأرض. فهذا هو مالك!"], [26, "فأجابه سيده: أيها العبد الشرير الكسول! عرفت أني أحصد من حيث لم أزرع، وأجمع من حيث لم أبذر،"], [27, "فكان يحسن بك أن تودع مالي عند الصيارفة لكي أسترده لدى عودتي مع فائدته!»"], [28, "ثم قال لعبيده: «خذوا منه الوزنة، وأعطوها لصاحب الوزنات العشر:"], [29, "فإن كل من عنده، يعطى المزيد فيفيض؛ ومن ليس عنده، فحتى الذي عنده ينتزع منه."], [30, "أما هذا العبد الذي لا نفع منه، فاطرحوه في الظلمة الخارجية، هناك يكون البكاء وصرير الأسنان!"]]}, {"l": "Luk 19:13", "n": "", "vs": [[13, "فاستدعى عبيده العشرة، وأودعهم عشر وزنات، وقال لهم: تاجروا إلى أن أعود."]]}, {"l": "Rom 12:6-8", "n": "", "vs": [[6, "ولكن، بما أن المواهب موزعة بحسب النعمة الموهوبة لنا، (فلنمارسها): فمن وهب النبوءة، فليتنبأ بحسب مقدار الإيمان؛"], [7, "ومن وهب الخدمة، فلينهمك في الخدمة؛ أو التعليم، ففي التعليم؛"], [8, "أو الوعظ، ففي الوعظ؛ أو العطاء، فليعط بسخاء؛ أو القيادة، فليقد باجتهاد؛ أو إظهار الرحمة، فليرحم بسرور."]]}, {"l": "1Th 5:19", "n": "", "vs": [[19, "لا تخمدوا الروح،"]]}, {"l": "1Pe 4:10", "n": "", "vs": [[10, "وعلى كل واحد منكم أن يخدم الآخرين بالموهبة التي أعطاه الله إياها، باعتباركم وكلاء صالحين مؤتمنين على أنواع متعددة من المواهب التي يمنحها الله بالنعمة."]]}, {"l": "1Pe 4:11", "n": "", "vs": [[11, "فمن يتكلم، عليه أن يتكلم بما يوافق أقوال الله؛ ومن يخدم، عليه أن يخدم بموجب القوة التي يمنحها الله . وذلك لكي يتمجد الله في كل شيء، بيسوع المسيح، له المجد والسلطة إلى أبد الآبدين. آمين!"]]}], "kwAr": "تلهب نار موهبة الله", "noteAr": ""}, {"kw": "by the", "raw": "Act_8:17, Act_8:18, Act_19:6; 1Ti_4:14; Heb_6:2", "note": "", "refs": [{"l": "Act 8:17", "n": "", "vs": [[17, "ثم وضعا أيديهما عليهم، فنالوا الروح القدس."]]}, {"l": "Act 8:18", "n": "", "vs": [[18, "ولما رأى سيمون أن الروح القدس قد حل على المؤمنين لما وضع الرسولان أيديهما عليهم، عرض على بطرس ويوحنا بعض المال، وقال لهما:"]]}, {"l": "Act 19:6", "n": "", "vs": [[6, "وما إن وضع بولس يديه عليهم حتى حل عليهم الروح القدس، وأخذوا يتكلمون بلغات أخرى ويتنبأون."]]}, {"l": "1Ti 4:14", "n": "", "vs": [[14, "لا تهمل الموهبة الخاصة التي فيك والتي أعطيت لك بالتنبوء ووضع الشيوخ أيديهم عليك."]]}, {"l": "Heb 6:2", "n": "", "vs": [[2, "والنظم المختصة بطقوس الاغتسال، ووضع الأيدي، وقيامة الأموات، والدينونة الأبدية."]]}], "kwAr": "بوضع يدي", "noteAr": ""}], "arS": [["لهذا السبب", ["G1223", "G3739", "G156"]], [" ", []], ["أنبهك", ["G363", "G4671"]], [" أن ", []], ["تلهب نار", ["G329"]], [" ", []], ["موهبة", ["G5486"]], [" ", []], ["الله", ["G2316"]], [" التي فيك ", []], ["بوضع", ["G1936"]], [" ", []], ["يدي", ["G5495", "G3450"]], [" عليك.", []]]}, {"c": 1, "v": 7, "text": "فإن الله قد أعطانا لا روح الجبن بل روح القوة والمحبة والبصيرة.", "groups": [{"kw": "the spirit", "raw": "Act_20:24, Act_21:13; Rom_8:15; Heb_2:15; 1Jo_4:18", "note": "", "refs": [{"l": "Act 20:24", "n": "", "vs": [[24, "ولكني لا أحسب لحياتي أية قيمة، ما دمت أسعى إلى بلوغ غايتي وإتمام الخدمة التي كلفني إياها الرب يسوع: أن أشهد ببشارة نعمة الله."]]}, {"l": "Act 21:13", "n": "", "vs": [[13, "ولكنه قال لنا: «ما لكم تبكون وتحطمون قلبي؟ إني مستعد ليس فقط لأن أقيد في أورشليم، بل أيضا لأن أموت من أجل اسم الرب يسوع!»"]]}, {"l": "Rom 8:15", "n": "", "vs": [[15, "إذ إنكم لم تنالوا روح عبودية يعيدكم إلى الخوف، بل نلتم روح بنوة به نصرخ: «أبا! أبانا!»"]]}, {"l": "Heb 2:15", "n": "", "vs": [[15, "ويحرر من كان الخوف من الموت يستعبدهم طوال حياتهم."]]}, {"l": "1Jo 4:18", "n": "", "vs": [[18, "ليس في المحبة أي خوف. بل المحبة الكاملة تطرد الخوف خارجا. فإن الخوف يأتي من العقاب. والخائف لا تكون محبة الله قد اكتملت فيه."]]}], "kwAr": "روح الجبن", "noteAr": ""}, {"kw": "but", "raw": "Mic_3:8; Zec_4:6; Luk_10:19, Luk_24:49; Act_1:8, Act_6:8, Act_9:22, Act_10:38; 1Co_2:4", "note": "", "refs": [{"l": "Mic 3:8", "n": "", "vs": [[8, "أما أنا، فإني ممتليء بقوة روح الرب وبالحق والعزة، لأعلن لنسل يعقوب معاصيه ولإسرائيل خطيئته."]]}, {"l": "Zec 4:6", "n": "", "vs": [[6, "فقال: «هذه رسالة الرب إلى زربابل: لا بالقدرة ولا بالقوة، ولكن بروحي تفلحون يقول الرب القدير."]]}, {"l": "Luk 10:19", "n": "", "vs": [[19, "وها أنا قد أعطيتكم سلطة لتدوسوا الحيات والعقارب وقدرة العدو كلها، ولن يؤذيكم شيء أبدا."]]}, {"l": "Luk 24:49", "n": "", "vs": [[49, "وها أنا سأرسل إليكم ما وعد به أبي. ولكن أقيموا في المدينة حتى تلبسوا القوة من الأعالي!»"]]}, {"l": "Act 1:8", "n": "", "vs": [[8, "ولكن حينما يحل الروح القدس عليكم تنالون القوة، وتكونون لي شهودا في أورشليم واليهودية كلها، وفي السامرة، وإلى أقاصي الأرض»."]]}, {"l": "Act 6:8", "n": "", "vs": [[8, "وإذ كان استفانوس مملوءا بالإيمان والقوة، كان يعمل عجائب ومعجزات عظيمة بين الشعب."]]}, {"l": "Act 9:22", "n": "", "vs": [[22, "وأما شاول فقد صار أكثر حماسة في وعظه، فكان يفحم اليهود الساكنين في دمشق ببراهينه التي كان يبين بها أن يسوع هو المسيح."]]}, {"l": "Act 10:38", "n": "", "vs": [[38, "فقد مسح الله يسوع الناصري بالروح القدس وبالقدرة، فكان ينتقل من مكان إلى مكان يعمل الخير، ويشفي جميع الذين تسلط عليهم إبليس، لأن الله كان معه."]]}, {"l": "1Co 2:4", "n": "", "vs": [[4, "ولم يقم كلامي وتبشيري على الإقناع بكلام الحكمة، بل على ما يعلنه الروح والقدرة."]]}], "kwAr": "بل روح القوة", "noteAr": ""}, {"kw": "of love", "raw": "Rom_5:5; Gal_5:22; Col_1:8; 1Pe_1:22", "note": "", "refs": [{"l": "Rom 5:5", "n": "", "vs": [[5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Col 1:8", "n": "", "vs": [[8, "وهو نفسه أخبرنا بما لكم من المحبة في الروح."]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}], "kwAr": "والمحبة", "noteAr": ""}, {"kw": "a sound", "raw": "Psa_119:80; Pro_2:7, Pro_8:14; Luk_8:35, Luk_15:17; Act_26:11, Act_26:25; 2Co_5:13, 2Co_5:14", "note": "", "refs": [{"l": "Psa 119:80", "n": "", "vs": [[80, "ليكن قلبي متعلقا بكامل فرائضك، فلا أخزى."]]}, {"l": "Pro 2:7", "n": "", "vs": [[7, "يذخر للمستقيمين فطنة، وهو ترس للسالكين بالكمال."]]}, {"l": "Pro 8:14", "n": "", "vs": [[14, "لي المشورة والرأي الصائب، لي الفطنة والقوة."]]}, {"l": "Luk 8:35", "n": "", "vs": [[35, "فخرج الناس ليروا ما حدث، وجاءوا إلى يسوع، فوجدوا الرجل الذي خرجت منه الشياطين جالسا عند قدمي يسوع وهو لابس وسليم العقل. فخافوا."]]}, {"l": "Luk 15:17", "n": "", "vs": [[17, "ثم رجع إلى نفسه، وقال: ما أكثر خدام أبي المأجورين الذين يفضل عنهم الخبز، وأنا هنا أكاد أهلك جوعا!"]]}, {"l": "Act 26:11", "n": "", "vs": [[11, "وكم عذبتهم في المجامع كلها لأجبرهم على التجديف. وقد بلغ حقدي عليهم درجة جعلتني أطاردهم في المدن التي في خارج البلاد."]]}, {"l": "Act 26:25", "n": "", "vs": [[25, "فقال بولس: «لست مجنونا ياسمو الحاكم فستوس، فأنا أنطق بكلام الحق والصواب."]]}, {"l": "2Co 5:13", "n": "", "vs": [[13, "أترانا فقدنا صوابنا؟ إن ذلك لأجل الله. أم ترانا متعقلين؟ إن ذلك لأجلكم."]]}, {"l": "2Co 5:14", "n": "", "vs": [[14, "فإن محبة المسيح تسيطر علينا، وقد حكمنا بهذا: مادام واحد قد مات عوضا عن الجميع، فمعنى ذلك أن الجميع ماتوا؛"]]}], "kwAr": "والبصيرة", "noteAr": ""}], "arS": [["فإن ", []], ["الله", ["G2316"]], [" قد ", []], ["أعطانا", ["G1325", "G2254"]], [" لا ", []], ["روح", ["G4151"]], [" ", []], ["الجبن", ["G1167"]], [" بل ", []], ["روح القوة", ["G1411"]], [" ", []], ["والمحبة", ["G26"]], [" ", []], ["والبصيرة", ["G4995"]], [".", []]]}, {"c": 1, "v": 8, "text": "فلا تخجل إذن بالشهادة لربنا، ولا تخجل بي أنا السجين لأجله، بل شاركني في المشقات لأجل الإنجيل، متوكلا على قدرة الله.", "groups": [{"kw": "ashamed", "raw": "2Ti_1:12; Psa_119:46; Isa_51:7; Mar_8:38; Luk_9:26; Act_5:41; Rom_1:16, Rom_9:33; Eph_3:13; 1Pe_4:14", "note": "", "refs": [{"l": "2Ti 1:12", "n": "", "vs": [[12, "من أجل ذلك أيضا أقاسي الآن هذه الآلام، ولكني لست أخجل، لأنني أعرف من أنا مؤمن به، ولي تمام الثقة بأنه قادر أن يحفظ لي الأمانة التي أودعتها عنده سالمة إلى ذلك اليوم."]]}, {"l": "Psa 119:46", "n": "", "vs": [[46, "سأتحدث بشهاداتك أمام الملوك ولا يعتريني الخزي،"]]}, {"l": "Isa 51:7", "n": "", "vs": [[7, "استمعوا إلي ياعارفي البر، أيها الشعب الذي شريعتي في قلوبكم. لا تخشوا تعيير الناس ولا ترتعبوا من شتائمهم،"]]}, {"l": "Mar 8:38", "n": "", "vs": [[38, "فإن أي من يستحي بي وبكلامي في هذا الجيل الفاسق الخاطيء، به يستحي ابن الإنسان عندما يعود في مجد أبيه مع الملائكة المقدسين»."]]}, {"l": "Luk 9:26", "n": "", "vs": [[26, "فإن من يستحي بي وبكلامي، فبه يستحي ابن الإنسان لدى عودته في مجده ومجد الآب والملائكة المقدسين."]]}, {"l": "Act 5:41", "n": "", "vs": [[41, "ولكن الرسل خرجوا من المجلس فرحين، لأنهم اعتبروا أهلا لأن يلقوا الإهانة من أجل اسم يسوع."]]}, {"l": "Rom 1:16", "n": "", "vs": [[16, "فأنا لا أستحي بالإنجيل، لأنه قدرة الله للخلاص، لكل من يؤمن، لليهودي أولا ثم لليوناني على السواء."]]}, {"l": "Rom 9:33", "n": "", "vs": [[33, "كما كتب: «ها أنا واضع في صهيون حجر عثرة وصخرة سقوط. ومن يؤمن به لا يخيب»."]]}, {"l": "Eph 3:13", "n": "", "vs": [[13, "فلذلك أطلب إليكم ألا يفتر عزمكم بسبب الضيقات التي أقاسيها لأجلكم، فهي مفخرة لكم."]]}, {"l": "1Pe 4:14", "n": "", "vs": [[14, "فإذا لحقتكم الإهانة لأنكم تحملون اسم المسيح، فطوبى لكم! لأن روح المجد، أي روح الله، يستقر عليكم."]]}], "kwAr": "فلا تخجل", "noteAr": ""}, {"kw": "the testimony", "raw": "Psa_19:7; Isa_8:20; Joh_15:27, Joh_19:35; Eph_4:17; 1Ti_2:6; 1Jo_4:14; 1Jo_5:11, 1Jo_5:12; Rev_1:2, Rev_12:11, Rev_19:10", "note": "", "refs": [{"l": "Psa 19:7", "n": "", "vs": [[7, "شريعة الرب كاملة تنعش النفس. شهادة الرب صادقة تجعل الجاهل حكيما."]]}, {"l": "Isa 8:20", "n": "", "vs": [[20, "فإلى الشريعة وإلى الشهادة: ومن لا ينطق بمثل هذا القول، فلا فجر له."]]}, {"l": "Joh 15:27", "n": "", "vs": [[27, "وتشهدون لي أنتم أيضا، لأنكم معي من البداية."]]}, {"l": "Joh 19:35", "n": "", "vs": [[35, "والذي رأى هذا هو يشهد، وشهادته حق وهو يعلم تماما أنه يقول الحق، لكي تؤمنوا أنتم أيضا."]]}, {"l": "Eph 4:17", "n": "", "vs": [[17, "أقول هذا إذن، وأشهد في الرب، راجيا ألا تسلكوا فيما بعد كما يسلك الأمم في عقم ذهنهم،"]]}, {"l": "1Ti 2:6", "n": "", "vs": [[6, "الذي بذل نفسه فدية عوضا عن الجميع. هذه شهادة تؤدى في أوقاتها الخاصة،"]]}, {"l": "1Jo 4:14", "n": "", "vs": [[14, "ونحن أنفسنا نشهد أن الآب قد أرسل الابن مخلصا للعالم، لأننا رأيناه بعيوننا."]]}, {"l": "1Jo 5:11", "n": "", "vs": [[11, "وهذه الشهادة هي أن الله أعطانا حياة أبدية، وأن هذه الحياة هي في ابنه."]]}, {"l": "1Jo 5:12", "n": "", "vs": [[12, "فمن كان له ابن الله كانت له الحياة. ومن لم يكن له ابن الله، لم تكن له الحياة!"]]}, {"l": "Rev 1:2", "n": "", "vs": [[2, "وقد شهد يوحنا بكلمة الله وبشهادة يسوع المسيح، بجميع الأمور التي رآها."]]}, {"l": "Rev 12:11", "n": "", "vs": [[11, "وهم قد انتصروا عليه بدم الحمل وبالكلمة التي شهدوا لها، فلم تكن حياتهم عزيزة لديهم، حتى إنهم ماتوا."]]}, {"l": "Rev 19:10", "n": "", "vs": [[10, "فجثوت عند قدميه لأسجد له، فقال لي: «لا تفعل! إني عبد لله، مثلك ومثل إخوتك المؤمنين الذين لديهم الشهادة المختصة بيسوع: لله اسجد! فإن الشهادة المختصة بيسوع هي روح النبوءة»."]]}], "kwAr": "بالشهادة لربنا", "noteAr": ""}, {"kw": "his prisoner", "raw": "2Ti_1:16, 2Ti_2:9; Eph_3:1, Eph_4:1; Phi_1:7", "note": "", "refs": [{"l": "2Ti 1:16", "n": "", "vs": [[16, "ليرحم الرب عائلة أونيسيفورس، لأنه كثيرا ما أنعشني، ولم يخجل بقيودي،"]]}, {"l": "2Ti 2:9", "n": "", "vs": [[9, "الذي لأجل التبشير به أقاسي حتى القيود كأني فاعل شر. إلا أن كلمة الله لا تكبلها القيود."]]}, {"l": "Eph 3:1", "n": "", "vs": [[1, "لهذا السبب، أنا بولس سجين المسيح يسوع لأجلكم أنتم الأمم …"]]}, {"l": "Eph 4:1", "n": "", "vs": [[1, "... إذن، أنا السجين في الرب، أناشدكم أن تسلكوا سلوكا يليق بالدعوة التي إليها دعيتم،"]]}, {"l": "Phi 1:7", "n": "", "vs": [[7, "كما أن من الحق أن يكون لي هذا الشعور تجاهكم جميعا، لأني أحتفظ بكم في قلبي، لكونكم جميعا شركاء لي في النعمة، سواء أكان في قيودي أم في الدفاع عن الإنجيل وتثبيته."]]}], "kwAr": "السجين لأجله", "noteAr": ""}, {"kw": "be thou", "raw": "2Ti_2:3, 2Ti_2:11, 2Ti_2:12, 2Ti_4:5; Rom_8:17, Rom_8:18, Rom_8:36; 1Co_4:9-13; 2Co_11:23-27; Phi_3:10; Col_1:24; 1Th_3:4; 1Pe_4:13-15; Rev_1:9, Rev_12:11", "note": "", "refs": [{"l": "2Ti 2:3", "n": "", "vs": [[3, "شارك في احتمال الآلام كجندي صالح للمسيح يسوع."]]}, {"l": "2Ti 2:11", "n": "", "vs": [[11, "وما أصدق القول: «إن كنا قد متنا معه، فسوف نحيا أيضا معه؛"]]}, {"l": "2Ti 2:12", "n": "", "vs": [[12, "إن تحملنا الآلام، فسوف نملك أيضا معه؛ إن أنكرناه، فسوف ينكرنا أيضا؛"]]}, {"l": "2Ti 4:5", "n": "", "vs": [[5, "أما أنت، فكن بصيرا في كل أمر، وتحمل المشقات، واعمل عمل المبشر، وأكمل خدمتك إلى التمام!"]]}, {"l": "Rom 8:17", "n": "", "vs": [[17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}, {"l": "Rom 8:18", "n": "", "vs": [[18, "فإني مقتنع بأن آلام الزمان الحاضر ليست شيئا إذا قيست بالمجد الآتي الذي سيعلن فينا."]]}, {"l": "Rom 8:36", "n": "", "vs": [[36, "بل كما قد كتب: «إننا من أجلك نعاني الموت طول النهار. قد حسبنا كأننا غنم للذبح!»"]]}, {"l": "1Co 4:9-13", "n": "", "vs": [[9, "فإني أرى أن الله عرضنا، نحن الرسل، في آخر الموكب كأنه محكوم علينا بالموت، لأننا صرنا معرضا للعالم، للملائكة والبشر معا."], [10, "نحن جهلاء من أجل المسيح، وأنتم حكماء في المسيح. نحن ضعفاء وأنتم أقوياء. أنتم مكرمون ونحن مهانون."], [11, "فما زلنا حتى هذه الساعة نجوع ونعطش، ونعرى ونلطم ونحرم محلا للإقامة"], [12, "ونجهد أنفسنا في الشغل بأيدينا. نتعرض للإهانة فنبارك، وللاضطهاد فنحتمل"], [13, "وللتجريح فنسالم. صرنا كأقذار العالم ونفاية الجميع، ومازلنا!"]]}, {"l": "2Co 11:23-27", "n": "", "vs": [[23, "وإن كانوا خدام المسيح، أتكلم كأني فقدت صوابي، فأنا متفوق عليهم: في الأتعاب أوفر منهم جدا، في الجلدات فوق الحد، في السجون أوفر جدا، في التعرض للموت أكثر مرارا."], [24, "من اليهود تلقيت الجلد خمس مرات، كل مرة أربعين جلدة إلا واحدة."], [25, "ضربت بالعصي ثلاث مرات. رجمت بالحجارة مرة. تحطمت بي السفينة ثلاث مرات. قضيت في عرض البحر يوما بنهاره وليله."], [26, "سافرت أسفارا عديدة؛ وواجهتني أخطار السيول الجارفة، وأخطار قطاع الطرق، وأخطار من بني جنسي، وأخطار من الأمم، وأخطار في المدن، وأخطار في البراري، وأخطار في البحر، وأخطار بين إخوة دجالين."], [27, "وكم عانيت من التعب والكد والسهر الطويل، والجوع والعطش والصوم الكثير، والبرد والعري."]]}, {"l": "Phi 3:10", "n": "", "vs": [[10, "وغايتي أن أعرف المسيح وقوة قيامته والشركة في آلامه؛ والتشبه به في موته،"]]}, {"l": "Col 1:24", "n": "", "vs": [[24, "والآن أنا أفرح في الآلام التي أقاسيها لأجلكم، وأتمم في جسدي ما نقص من ضيقات المسيح لأجل جسده الذي هو الكنيسة،"]]}, {"l": "1Th 3:4", "n": "", "vs": [[4, "وقد سبق لنا، لما كنا عندكم أن أخبرناكم أننا سنقاسي الضيقات، الأمر الذي حدث بعد ذلك كما تعلمون."]]}, {"l": "1Pe 4:13-15", "n": "", "vs": [[13, "وإنما افرحوا: لأنكم كما تشاركون المسيح في الآلام الآن، لابد أن تفرحوا بمشاركته في الابتهاج عند ظهور مجده."], [14, "فإذا لحقتكم الإهانة لأنكم تحملون اسم المسيح، فطوبى لكم! لأن روح المجد، أي روح الله، يستقر عليكم."], [15, "لا يكن بينكم من يتأ لم عقابا على شر ارتكبه: كالقتل أو السرقة، أو غيرهما من الجرائم، أو التدخل في شؤون الآخرين."]]}, {"l": "Rev 1:9", "n": "", "vs": [[9, "أنا، يوحنا أخاكم وشريككم في الضيقة والملكوت والصبر في يسوع، كنت منفيا في الجزيرة التي تسمى بطمس، لأجل كلمة الله وشهادة يسوع."]]}, {"l": "Rev 12:11", "n": "", "vs": [[11, "وهم قد انتصروا عليه بدم الحمل وبالكلمة التي شهدوا لها، فلم تكن حياتهم عزيزة لديهم، حتى إنهم ماتوا."]]}], "kwAr": "شاركني في المشقات", "noteAr": ""}, {"kw": "according", "raw": "2Ti_4:17; Rom_16:25; 2Co_6:7, 2Co_12:9, 2Co_12:10; Phi_4:13; Col_1:11; 1Pe_1:5; Jud_1:24", "note": "", "refs": [{"l": "2Ti 4:17", "n": "", "vs": [[17, "إلا أن الرب وقف بجانبي وأمدني بالقوة، لكي تتم بي المناداة بالبشارة، فيسمعها جميع من هم من الأمم؛ وقد نجوت من فم الأسد."]]}, {"l": "Rom 16:25", "n": "", "vs": [[25, "والمجد للقادر أن يثبتكم، وفقا لإنجيلي وللبشارة بيسوع المسيح، ووفقا لإعلان ما كان سرا ظل مكتوما مدى الأزمنة الأزلية،"]]}, {"l": "2Co 6:7", "n": "", "vs": [[7, "في كلمة الحق وقدرة الله؛ بأسلحة البر في الهجوم والدفاع؛"]]}, {"l": "2Co 12:9", "n": "", "vs": [[9, "فقال لي: «نعمتي تكفيك، لأن قدرتي تكمل في الضعف!» فأنا أرضى بأن أفتخر مسرورا بالضعفات التي في، لكي تخيم علي قدرة المسيح."]]}, {"l": "2Co 12:10", "n": "", "vs": [[10, "فلأجل المسيح، تسرني الضعفات والإهانات والضيقات والاضطهادات والصعوبات، لأني حينما أكون ضعيفا، فحينئذ أكون قويا!"]]}, {"l": "Phi 4:13", "n": "", "vs": [[13, "إني أستطيع كل شيء، في المسيح الذي يقويني."]]}, {"l": "Col 1:11", "n": "", "vs": [[11, "متشددين بكل قوة موافقة لقدرة مجده، لتتمكنوا تماما من الاحتمال وطول البال،"]]}, {"l": "1Pe 1:5", "n": "", "vs": [[5, "محفوظا لكم في السماوات. فإنكم محفوظون بقدرة الله العاملة من خلال إيمانكم، إلى أن تفوزوا بالخلاص النهائي المعد لكم والذي سوف يتجلى في الزمان الأخير."]]}, {"l": "Jud 1:24", "n": "", "vs": [[24, "وللقادر أن يحرسكم من السقوط حتى يوصلكم إلى المثول أمامه في المجد مبتهجين ولا عيب فيكم …"]]}], "kwAr": "متوكلا على قدرة الله", "noteAr": ""}], "arS": [["فلا ", []], ["تخجل", ["G1870"]], [" إذن ", []], ["بالشهادة", ["G3142"]], [" ", []], ["لربنا", ["G2962", "G2257"]], ["، ولا تخجل بي أنا ", []], ["السجين", ["G1198"]], [" لأجله، بل ", []], ["شاركني في المشقات", ["G4777"]], [" لأجل ", []], ["الإنجيل", ["G2098"]], ["، متوكلا على ", []], ["قدرة", ["G1411"]], [" ", []], ["الله", ["G2316"]], [".", []]]}, {"c": 1, "v": 9, "text": "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،", "groups": [{"kw": "hath", "raw": "Mat_1:21; Act_2:47; 1Co_1:18; Eph_2:5, Eph_2:8; 1Ti_1:1; Tit_3:4, Tit_3:5", "note": "", "refs": [{"l": "Mat 1:21", "n": "", "vs": [[21, "فستلد ابنا، وأنت تسميه يسوع، لأنه هو الذي يخلص شعبه من خطاياهم»."]]}, {"l": "Act 2:47", "n": "", "vs": [[47, "مسبحين الله ، وكانوا يلاقون استحسانا لدى الشعب كله. وكان الرب، كل يوم، يضم إلى الكنيسة الذين يخلصون."]]}, {"l": "1Co 1:18", "n": "", "vs": [[18, "لأن البشارة بالصليب جهالة عند الهالكين؛ وأما عندنا، نحن المخلصين، فهي قدرة الله."]]}, {"l": "Eph 2:5", "n": "", "vs": [[5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"]]}, {"l": "Eph 2:8", "n": "", "vs": [[8, "فإنكم بالنعمة مخلصون، بالإيمان، وهذا ليس منكم. إنه هبة من الله،"]]}, {"l": "1Ti 1:1", "n": "", "vs": [[1, "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"]]}, {"l": "Tit 3:4", "n": "", "vs": [[4, "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،"]]}, {"l": "Tit 3:5", "n": "", "vs": [[5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"]]}], "kwAr": "خلصنا", "noteAr": ""}, {"kw": "called", "raw": "Rom_8:28, Rom_8:30, Rom_9:24; 1Th_4:7; 2Th_2:13, 2Th_2:14; Heb_3:1; 1Pe_1:15, 1Pe_1:16, 1Pe_2:9; 1Pe_2:20,1Pe_2:21", "note": "", "refs": [{"l": "Rom 8:28", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."]]}, {"l": "Rom 8:30", "n": "", "vs": [[30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."]]}, {"l": "Rom 9:24", "n": "", "vs": [[24, "فينا نحن الذين دعاهم لا من بين اليهود فقط بل من بين الأمم أيضا؟"]]}, {"l": "1Th 4:7", "n": "", "vs": [[7, "فإن الله دعانا لا إلى النجاسة بل (إلى العيش( في القداسة."]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "2Th 2:14", "n": "", "vs": [[14, "فإلى هذا الأمر قد دعاكم ببشارتنا لكم، لنوال مجد ربنا يسوع المسيح."]]}, {"l": "Heb 3:1", "n": "", "vs": [[1, "إذن، أيها الإخوة القديسون الذين اشتركتم في الدعوة السماوية، تأملوا يسوع: الرسول ورئيس الكهنة في الإيمان الذي نتمسك به."]]}, {"l": "1Pe 1:15", "n": "", "vs": [[15, "وإنما اسلكوا سلوكا مقدسا في كل أمر، مقتدين بالقدوس الذي دعاكم،"]]}, {"l": "1Pe 1:16", "n": "", "vs": [[16, "لأنه قد كتب: «كونوا قديسين، لأني أنا قدوس!»"]]}, {"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}, {"l": "1Pe 2:20", "n": "", "vs": [[20, "فبالحقيقة، أي مجد لكم إن كنتم تصبرون وأنتم تتحملون قصاص أخطائكم؟ لا فضل لكم عند الله إلا إذا تحملتم الآلام صابرين، وأنتم تفعلون الصواب."]]}, {"l": "1Pe 2:21", "n": "", "vs": [[21, "لأن الله دعاكم إلى الاشتراك في هذا النوع من الآلام. فالمسيح، الذي تألم لأجلكم، هو القدوة التي تقتدون بها. فسيروا على آثار خطواته:"]]}], "kwAr": "ودعانا", "noteAr": ""}, {"kw": "not", "raw": "Rom_3:20, Rom_9:11, Rom_11:5, Rom_11:6; Eph_2:9; Tit_3:5", "note": "", "refs": [{"l": "Rom 3:20", "n": "", "vs": [[20, "فإن أحدا من البشر لا يتبرر أمامه بالأعمال المطلوبة في الشريعة. إذ إن الشريعة هي لإظهار الخطيئة."]]}, {"l": "Rom 9:11", "n": "", "vs": [[11, "ولم يكن الولدان قد ولدا بعد ولا فعلا خيرا أو شرا، وذلك كي يبقى قصد الله من جهة الاختيار"]]}, {"l": "Rom 11:5", "n": "", "vs": [[5, "فكذلك، في الزمان الحاضر، ماتزال بقية اختارها الله بالنعمة."]]}, {"l": "Rom 11:6", "n": "", "vs": [[6, "ولكن، بما أن ذلك قد تم بالنعمة، فليس بعد على أساس الأعمال، وإلا فليست النعمة نعمة بعد."]]}, {"l": "Eph 2:9", "n": "", "vs": [[9, "لا على أساس الأعمال، حتى لا يفتخر أحد."]]}, {"l": "Tit 3:5", "n": "", "vs": [[5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"]]}], "kwAr": "لا على أساس أعمالنا", "noteAr": ""}, {"kw": "according to his", "raw": "Deu_7:7, Deu_7:8; Isa_14:26, Isa_14:27; Mat_11:25, Mat_11:26; Luk_10:21; Rom_8:28; Eph_1:9, Eph_1:11", "note": "", "refs": [{"l": "Deu 7:7", "n": "", "vs": [[7, "ولم يفضلكم الرب ويتخيركم لأنكم أكثر عددا من سائر الشعوب، فأنتم أقل الأمم عددا."]]}, {"l": "Deu 7:8", "n": "", "vs": [[8, "بل من محبته، وحفاظا على القسم الذي أقسم به لآبائكم، أخرجكم بقوة فائقة، وفداكم من نير عبودية فرعون ملك مصر."]]}, {"l": "Isa 14:26", "n": "", "vs": [[26, "هذا هو القضاء الذي حكمت به على الأرض كلها، وهذه هي اليد التي امتدت على كل الأمم."]]}, {"l": "Isa 14:27", "n": "", "vs": [[27, "لأن الرب القدير قد قضى، فمن يبطل قضاءه؟ ويده قد امتدت فمن يردها؟»"]]}, {"l": "Mat 11:25", "n": "", "vs": [[25, "وفي ذلك الوقت، تكلم يسوع فقال: «أحمدك أيها الآب، رب السماء والأرض، لأنك حجبت هذه الأمور عن الحكماء والفهماء، وكشفتها للأطفال!"]]}, {"l": "Mat 11:26", "n": "", "vs": [[26, "نعم أيها الآب، لأنه هكذا حسن في نظرك."]]}, {"l": "Luk 10:21", "n": "", "vs": [[21, "في تلك الساعة ابتهج يسوع بالروح وقال: «أحمدك أيها الآب، رب السماء والأرض، لأنك حجبت هذه الأمور عن الحكماء والفهماء، وكشفتها للأطفال. نعم، أيها الآب، لأنه هكذا حسن في نظرك!"]]}, {"l": "Rom 8:28", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."]]}, {"l": "Eph 1:9", "n": "", "vs": [[9, "إذ كشف لنا سر مشيئته بحسب مرضاته التي قصدها في نفسه،"]]}, {"l": "Eph 1:11", "n": "", "vs": [[11, "وفي المسيح أيضا قد حصلنا على الميراث الذي سبق أن عينا له، وفقا لقصده، هو الذي يعمل كل شيء كما تقضي مشيئته."]]}], "kwAr": "بموجب قصده", "noteAr": ""}, {"kw": "which", "raw": "Joh_6:37, Joh_10:28, Joh_10:29, Joh_17:9; 1Co_3:21, 1Co_3:22; Eph_1:3", "note": "", "refs": [{"l": "Joh 6:37", "n": "", "vs": [[37, "ولكن كل ما يهبه الآب لي سيأتي إلي، ومن يأت إلي لا أطرحه إلى الخارج أبدا،"]]}, {"l": "Joh 10:28", "n": "", "vs": [[28, "وأعطيها حياة أبدية، فلا تهلك إلى الأبد، ولا ينتزعها أحد من يدي."]]}, {"l": "Joh 10:29", "n": "", "vs": [[29, "إن الآب الذي أعطاني إياها هو أعظم من الجميع، ولا يقدر أحد أن ينتزع من يد الآب شيئا."]]}, {"l": "Joh 17:9", "n": "", "vs": [[9, "من أجل هؤلاء أصلي إليك. لست أصلي الآن من أجل العالم، بل من أجل الذين وهبتهم لي، لأنهم لك."]]}, {"l": "1Co 3:21", "n": "", "vs": [[21, "إذن، لا يفتخر أحد بالبشر، لأن كل شيء هو لكم،"]]}, {"l": "1Co 3:22", "n": "", "vs": [[22, "أبولس أم أبلوس أم بطرس أم العالم أم الحيا ة أم الموت أم الحاضر أم المستقبل: هذه الأمور كلها لكم،"]]}, {"l": "Eph 1:3", "n": "", "vs": [[3, "تبارك الله ، أبو ربنا يسوع المسيح الذي باركنا بكل بركة روحية في الأماكن السماوية."]]}], "kwAr": "التي وهبت لنا", "noteAr": ""}, {"kw": "before", "raw": "Joh_17:24; Act_15:18; Rom_16:25; Eph_1:4, Eph_3:11; Tit_1:2; 1Pe_1:20; Rev_13:8, Rev_17:8", "note": "", "refs": [{"l": "Joh : "Isa_25:7, Isa_60:2, Isa_60:3; Luk_2:31, Luk_2:32; Rom_16:26; Eph_1:9; Col_1:26, Col_1:27; Tit_1:3, Tit_2:11; 1Pe_1:20,1Pe_1:21; 1Jo_1:2", "note": "", "refs": [{"l": "Isa 25:7", "n": "", "vs": [[7, "ويمزق في هذا الجبل النقاب المسدول على كل الشعوب، والحجاب الذي يغطي جميع الأمم،"]]}, {"l": "Isa 60:2", "n": "", "vs": [[2, "ها إن الظلمة تغمر الأرض، والليل الدامس يكتنف الشعوب، ولكن الرب يشرق عليك، ويتجلى مجده حولك،"]]}, {"l": "Isa 60:3", "n": "", "vs": [[3, "فتقبل الأمم إلى نورك، وتتوافد الملوك إلى إشراق ضيائك."]]}, {"l": "Luk 2:31", "n": "", "vs": [[31, "الذي هيأته لتقدمه إلى الشعوب كلها،"]]}, {"l": "Luk 2:32", "n": "", "vs": [[32, "نور هداية للأمم ومجدا لشعبك إسر ائيل»."]]}, {"l": "Rom 16:26", "n": "", "vs": [[26, "ولكن أذيع الآن، بأمر الله الأزلي في الكتابات النبوية، على جميع الأمم لأجل إطاعة الإيمان؛"]]}, {"l": "Eph 1:9", "n": "", "vs": [[9, "إذ كشف لنا سر مشيئته بحسب مرضاته التي قصدها في نفسه،"]]}, {"l": "Col 1:26", "n": "", "vs": [[26, "السر الذي كان مكتوما طوال العصور والأجيال، ولكن كشف الآن لقديسيه،"]]}, {"l": "Col 1:27", "n": "", "vs": [[27, "الذين أراد الله أن يعلن لهم كم هو غني مجد هذا السر بين الأمم: إنه المسيح فيكم، وهو رجاء المجد؛"]]}, {"l": "Tit 1:3", "n": "", "vs": [[3, "ثم بين كلمته في أوانها المعين: بالبشارة التي وضعت أمانة بين يدي بموجب أمر مخلصنا الله …"]]}, {"l": "Tit 2:11", "n": "", "vs": [[11, "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت."]]}, {"l": "1Pe 1:20", "n": "", "vs": [[20, "ومع أن الله كان قد عين المسيح لهذا الغرض قبل تأسيس العالم، فهو لم يعلنه إلا في هذا الزمن الأخير لفائدتكم"]]}, {"l": "1Pe 1:21", "n": "", "vs": [[21, "أنتم الذين تؤمنون بالله بالمسيح الذي أقامه من الموت وأعطاه المجد، حتى يكون الله غاية إيمانكم ورجائكم."]]}, {"l": "1Jo 1:2", "n": "", "vs": [[2, "فإن «الحياة» تجلت أمامنا. وبعدما رأيناها فعلا، نشهد لها الآن. وها نحن ننقل إليكم خبر هذه الحياة الأبدية التي كانت عند الآب ثم تجلت أمامنا!"]]}], "kwAr": "أعلنت الآن", "noteAr": ""}, {"kw": "our", "raw": "Isa_43:3, Isa_45:15, Isa_45:21; Luk_2:11; Joh_4:42; Act_5:31, Act_13:23; Tit_1:4, Tit_2:13; Tit_3:4; 2Pe_1:1, 2Pe_1:11, 2Pe_2:20, 2Pe_3:2, 2Pe_3:18; 1Jo_4:14", "note": "", "refs": [{"l": "Isa 43:3", "n": "", "vs": [[3, "لأني أنا هو الرب إلهك، قدوس إسرائيل مخلصك، قد جعلت مصر فدية عنك وكوش وسبا عوضا عنك."]]}, {"l": "Isa 45:15", "n": "", "vs": [[15, "حقا أنت هو إله يحجب نفسه، إله إسرائيل المخلص."]]}, {"l": "Isa 45:21", "n": "", "vs": [[21, "أعلنوا، واعرضوا دعواكم. ليتشاوروا معا. من أنبأ بهذا منذ القدم، ومن أخبر به من زمن بعيد؟ ألست أنا الرب ولا إله غيري؟ بار ومخلص، وليس هناك آخر."]]}, {"l": "Luk 2:11", "n": "", "vs": [[11, "فقد ولد لكم اليوم في مدينة داود مخلص هو المسيح الرب."]]}, {"l": "Joh 4:42", "n": "", "vs": [[42, "وقالوا للمرأة: «إننا لا نؤمن بعد الآن بسبب كلامك، بل نؤمن لأننا سمعناه بأنفسنا، وعرفنا أنه مخلص العالم حقا!»"]]}, {"l": "Act 5:31", "n": "", "vs": [[31, "ولكن الله رفعه إلى يمينه وجعله رئيسا ومخلصا ليمنح إسرائيل التوبة وغفران الخطايا؛"]]}, {"l": "Act 13:23", "n": "", "vs": [[23, "وقد بعث الله إلى إسرائيل من نسل داود مخلصا هو يسوع، إتماما لوعده."]]}, {"l": "Tit 1:4", "n": "", "vs": [[4, "إلى تيطس، ولدي الحقيقي بالنسبة إلى الإيمان المشترك بيننا."]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "Tit 3:4", "n": "", "vs": [[4, "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،"]]}, {"l": "2Pe 1:1", "n": "", "vs": [[1, "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"]]}, {"l": "2Pe 1:11", "n": "", "vs": [[11, "وهكذا يفتح الله لكم الباب واسعا للدخول إلى الملكوت الأبدي، ملكوت ربنا ومخلصنا يسوع المسيح."]]}, {"l": "2Pe 2:20", "n": "", "vs": [[20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."]]}, {"l": "2Pe 3:2", "n": "", "vs": [[2, "وغايتي أن تتذكروا الأقوال التي أعلنها الأنبيا ء القديسون قديما، وكذلك وصية الرب والمخلص، تلك الوصية التي نقلها إليكم الرسل."]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}, {"l": "1Jo 4:14", "n": "", "vs": [[14, "ونحن أنفسنا نشهد أن الآب قد أرسل الابن مخلصا للعالم، لأننا رأيناه بعيوننا."]]}], "kwAr": "مخلصنا", "noteAr": ""}, {"kw": "who", "raw": "Isa_25:8; Hos_13:14; Joh_11:25, Joh_11:26; 1Co_15:54, 1Co_15:55; Heb_2:14, Heb_2:15; Rev_20:14", "note": "", "refs": [{"l": "Isa 25:8", "n": "", "vs": [[8, "ويبتلع الموت إلى الأبد، ويمسح السيد الرب الدموع المنهمرة على الوجوه، ويزيل عار شعبه من كل الأرض. هذا ما تكلم به الرب."]]}, {"l": "Hos 13:14", "n": "", "vs": [[14, "هل أفتديهم من قوة الهاوية؟ هل أنجيهم من الموت؟ أين أوبئتك ياموت؟ أين هلاكك ياهاوية؟ قد احتجبت الرحمة عن عيني."]]}, {"l": "Joh 11:25", "n": "", "vs": [[25, "فرد يسوع: «أنا هو القيامة والحياة. من آمن بي، وإن مات فسيحيا."]]}, {"l": "Joh 11:26", "n": "", "vs": [[26, "ومن كان حيا وآمن بي فلن يموت إلى الأبد. أتؤمنين بهذا؟»"]]}, {"l": "1Co 15:54", "n": "", "vs": [[54, "وبعد أن يلبس هذا المنحل عدم انحلال، وهذا الفاني خلودا، تتم الكلمة التي قد كتبت: «ابتلع الموت في النصر!»"]]}, {"l": "1Co 15:55", "n": "", "vs": [[55, "فأين، ياموت، شوكتك؟ وأين، ياموت نصرك؟"]]}, {"l": "Heb 2:14", "n": "", "vs": [[14, "إذن، بما أن هؤلاء الأولاد متشاركون في أجسام بشرية من لحم ودم، اشترك المسيح أيضا في اللحم والدم باتخاذه جسما بشريا. وهكذا تمكن أن يموت، ليقضي على من له سلطة الموت، أي إبليس،"]]}, {"l": "Heb 2:15", "n": "", "vs": [[15, "ويحرر من كان الخوف من الموت يستعبدهم طوال حياتهم."]]}, {"l": "Rev 20:14", "n": "", "vs": [[14, "وطرح الموت وهاوية الموتى في بحيرة النار، الذي هو الموت الثاني."]]}], "kwAr": "الذي سحق الموت", "noteAr": ""}, {"kw": "abolished", "raw": "Luk_13:7; Rom_3:31, Rom_6:6; Gal_5:4 *Gr.", "note": "", "refs": [{"l": "Luk 13:7", "n": "", "vs": [[7, "فقال للمزارع: هذه ثلاث سنين وأنا أقصد هذه التينة طلبا للثمر فلا أجد شيئا: اقطعها، لماذا نتركها تعطل الأرض؟"]]}, {"l": "Rom 3:31", "n": "", "vs": [[31, "إذن، هل نحن نبطل الشريعة بالإيمان؟ حاشا، بل إننا به نثبت الشريعة."]]}, {"l": "Rom 6:6", "n": "", "vs": [[6, "فنحن نعلم هذا: أن الإنسان العتيق فينا قد صلب معه لكي يبطل جسد الخطيئة فلا نبقى عبيدا للخطيئة فيما بعد."]]}, {"l": "Gal 5:4", "n": "*Gr.", "vs": [[4, "يامن تريدون التبرير عن طريق الشريعة، قد حرمتم المسيح وسقطتم من النعمة!"]]}], "kwAr": "سحق", "noteAr": ""}, {"kw": "and hath", "raw": "2Ti_1:1; Joh_5:24-29, Joh_5:40, Joh_14:6, Joh_20:31; Rom_2:7, Rom_5:17, Rom_5:18; 1Co_15:53; 2Co_5:4; 2Pe_1:3; 1Jo_1:2; Rev_2:7, Rev_22:1, Rev_22:2, Rev_22:14, Rev_22:17; Luk_11:36; Joh_1:9; 1Co_4:5; Eph_1:18; Heb_10:32; Rev_18:1 *Gr.", "note": "", "refs": [{"l": "2Ti 1:1", "n": "", "vs": [[1, "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"]]}, {"l": "Joh 5:24-29", "n": "", "vs": [[24, "الحق الحق أقول لكم إن من يسمع كلامي ويؤمن بالذي أرسلني تكون له الحياة الأبدية، ولا يحاكم في اليوم الأخير، لأنه قد انتقل من الموت إلى الحياة."], [25, "الحق الحق أقول لكم: إن الساعة التي يسمع فيها الأموات صوت ابن الله ستأتي بل هي الآن والذين يسمعونه يحيون."], [26, "لأنه كما أن للآب حياة في ذاته، فقد أعطى الابن أيضا أن تكون له حياة في ذاته،"], [27, "وأعطاه سلطة أن يدين، لأنه ابن الإنسان."], [28, "لا تتعجبوا من هذا: فسوف تأتي ساعة يسمع فيها جميع من في القبور صوته،"], [29, "فيخرجون منها: فالذين عملوا الصالحات يخرجون في القيامة المؤدية إلى الحياة، وأما الذين عملوا السيئات ففي القيامة المؤدية إلى الدينونة."]]}, {"l": "Joh 5:40", "n": "", "vs": [[40, "ولكنكم ترفضون أن تأتوا إلي لتكون لكم الحياة."]]}, {"l": "Joh 14:6", "n": "", "vs": [[6, "فأجابه يسوع: «أنا هو الطريق والحق والحياة. لا يأتي أحد إلى الآب إلا بي."]]}, {"l": "Joh 20:31", "n": "", "vs": [[31, "وأما هذه الآيات فقد دونت لتؤمنوا بأن يسوع هو المسيح ابن الله، ولكي تكون لكم حياة باسمه إذ تؤمنون."]]}, {"l": "Rom 2:7", "n": "", "vs": [[7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"]]}, {"l": "Rom 5:17", "n": "", "vs": [[17, "فما دام الموت بمعصية الإنسان الواحد، قد ملك بذلك الواحد، فكم بالأحرى يملك في الحياة بيسوع المسيح الواحد أولئك الذين ينالون فيض النعمة وعطية البر المجانية."]]}, {"l": "Rom 5:18", "n": "", "vs": [[18, "فإذن، كما أن معصية واحدة جلبت الدينونة على جميع البشر، كذلك فإن برا واحدا يجلب التبرير المؤدي إلى الحياة لجميع البشر."]]}, {"l": "1Co 15:53", "n": "", "vs": [[53, "فلابد لهذا الجسم القابل للانحلال أن يلبس عدم انحلال، ولهذا الفاني أن يلبس خلودا."]]}, {"l": "2Co 5:4", "n": "", "vs": [[4, "ذلك أننا، نحن الساكنين في هذه الخيمة، نئن كمن يحمل ثقلا، فنحن لا نريد أن نخلعها، بل أن نلبس فوقها مسكننا السماوي، فتبتلع الحياة ما هو مائت فينا."]]}, {"l": "2Pe 1:3", "n": "", "vs": [[3, "إن الله، بقدرته الإلهية، قد زودنا بكل ما نحتاج إليه في الحيا ة الروحية المتصفة بالتقوى. ذلك أنه عرفنا بالمسيح الذي دعانا إلى مجده وفضيلته،"]]}, {"l": "1Jo 1:2", "n": "", "vs": [[2, "فإن «الحياة» تجلت أمامنا. وبعدما رأيناها فعلا، نشهد لها الآن. وها نحن ننقل إليكم خبر هذه الحياة الأبدية التي كانت عند الآب ثم تجلت أمامنا!"]]}, {"l": "Rev 2:7", "n": "", "vs": [[7, "من له أذنان فليسمع ما يقوله الروح للكنائس! كل من ينتصر سأطعمه من ثمر شجرة الحياة في فردوس الله."]]}, {"l": "Rev 22:1", "n": "", "vs": [[1, "ثم أراني الملاك نهر ماء الحياة صافيا كالبلور، ينبع من عرش الله والحمل"]]}, {"l": "Rev 22:2", "n": "", "vs": [[2, "ويخترق ساحة المدينة، وعلى ضفتيه شجرة الحياة تثمر اثنتي عشرة مرة، كل شهر مرة. وأوراقها دواء يشفي الأمم."]]}, {"l": "Rev 22:14", "n": "", "vs": [[14, "طوبى للذين يغسلون ثيابهم، فلهم السلطة على شجرة الحياة، والحق في دخول المدينة من الأبواب!"]]}, {"l": "Rev 22:17", "n": "", "vs": [[17, "الروح والعروس يقولان: «تعال!» ومن يسمع فليردد النداء: «تعال!»"]]}, {"l": "Luk 11:36", "n": "", "vs": [[36, "إذن، إن كان جسدك كله منورا وليس فيه جانب مظلم، فإنه يكون منورا بكامله، كأنما أنار لك المصباح بإشعاعه! »"]]}, {"l": "Joh 1:9", "n": "", "vs": [[9, "فالنور الحق الذي ينير كل إنسان كان آتيا إلى العالم."]]}, {"l": "1Co 4:5", "n": "", "vs": [[5, "إذن، لا تحكموا في شيء قبل الأوان، ريثما يرجع الرب الذي سيسلط النور على الأشياء التي يحجبها الظلام الآن، ويكشف نيات القلوب، عندئذ ينال كل واحد حقه من المدح من عند الله!"]]}, {"l": "Eph 1:18", "n": "", "vs": [[18, "إذ تستنير بصائر قلوبكم، فتعلموا ما في دعوته لكم من رجاء، وما هو غنى مجد ميراثه في القديسين،"]]}, {"l": "Heb 10:32", "n": "", "vs": [[32, "لا تنسوا أبدا تلك الأيام الماضية التي فيها، بعدما أشرق عليكم نور الإيمان بالمسيح، صبرتم على جهاد مرير طويل، إذ قاسيتم كثيرا من الآلام."]]}, {"l": "Rev 18:1", "n": "*Gr.", "vs": [[1, "بعد هذا رأيت ملاكا آخر نازلا من السماء، له سلطان عظيم، أضاء بهاؤه الأرض."]]}], "kwAr": "وأنار الحياة والخلود", "noteAr": ""}], "arS": [["والتي ", []], ["أعلنت", ["G5319"]], [" ", []], ["الآن", ["G3568"]], [" ", []], ["بظهور", ["G2015"]], [" ", []], ["مخلصنا", ["G4990", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [" الذي ", []], ["سحق", ["G2673"]], [" ", []], ["الموت", ["G2288"]], [" ", []], ["وأنار الحياة والخلود", ["G5461", "G2222", "G861"]], [" ", []], ["بالإنجيل", ["G2098"]]]}, {"c": 1, "v": 11, "text": "الذي له عينت أنا مبشرا ورسولا ومعلما.", "groups": [{"kw": "", "raw": "Act_9:15; Eph_3:7, Eph_3:8; 1Ti_1:7, 1Ti_2:7", "note": "", "refs": [{"l": "Act 9:15", "n": "", "vs": [[15, "فأمره الرب: «اذهب! فقد اخترت هذا الرجل ليكون إناء يحمل اسمي إلى الأمم والملوك وبني إسرائيل."]]}, {"l": "Eph 3:7", "n": "", "vs": [[7, "الذي صرت أنا خادما له بحسب نعمة الله الموهوبة لي وفقا لعمل قدرته."]]}, {"l": "Eph 3:8", "n": "", "vs": [[8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "1Ti 1:7", "n": "", "vs": [[7, "راغبين في أن يكونوا أساتذة في الشريعة، وهم لا يفهمون ما يقولون ولا ما يقررون!"]]}, {"l": "1Ti 2:7", "n": "", "vs": [[7, "ولها قد عينت أنا مبشرا ورسولا، الحق أقول ولست أكذب، معلما للأمم في الإيمان والحق."]]}], "kwAr": "", "noteAr": ""}], "arS": [["الذي له ", []], ["عينت", ["G5087"]], [" ", []], ["أنا", ["G1473"]], [" ", []], ["مبشرا", ["G2783"]], [" ", []], ["ورسولا", ["G652"]], [" ", []], ["ومعلما", ["G1320"]], [".", []]]}, {"c": 1, "v": 12, "text": "من أجل ذلك أيضا أقاسي الآن هذه الآلام، ولكني لست أخجل، لأنني أعرف من أنا مؤمن به، ولي تمام الثقة بأنه قادر أن يحفظ لي الأمانة التي أودعتها عنده سالمة إلى ذلك اليوم.", "groups": [{"kw": "the which", "raw": "2Ti_1:8, 2Ti_2:9, 2Ti_3:10-12, 2Ti_4:16, 2Ti_4:17; Act_9:16, Act_13:46, Act_13:50, Act_14:5, Act_14:6, Act_21:27-31; Act_22:21-24; Eph_3:1-8; 1Th_2:16", "note": "", "refs": [{"l": "2Ti 1:8", "n": "", "vs": [[8, "فلا تخجل إذن بالشهادة لربنا، ولا تخجل بي أنا السجين لأجله، بل شاركني في المشقات لأجل الإنجيل، متوكلا على قدرة الله."]]}, {"l": "2Ti 2:9", "n": "", "vs": [[9, "الذي لأجل التبشير به أقاسي حتى القيود كأني فاعل شر. إلا أن كلمة الله لا تكبلها القيود."]]}, {"l": "2Ti 3:10-12", "n": "", "vs": [[10, "وأما أنت، فقد عرفت جيدا تعليمي، وسيرتي، وهدفي، وإيماني، وتحملي للمشقات، ومحبتي، وثباتي،"], [11, "واضطهاداتي، وآلامي تلك التي حدثت لي في مدن أنطاكية وإيقونية ولسترة وغيرها؛ وكم احتملت من اضطهادات، والرب أنقذني منها جميعا!"], [12, "وحقا، إن جميع الذين يعزمون أن يعيشوا عيشة التقوى في المسيح يسوع يضطهدون."]]}, {"l": "2Ti 4:16", "n": "", "vs": [[16, "عندما دافعت عن نفسي في محاكمتي أول مرة، لم يقف أحد بجانبي، بل تركني الجميع، لا حاسبهم الله على ذلك!"]]}, {"l": "2Ti 4:17", "n": "", "vs": [[17, "إلا أن الرب وقف بجانبي وأمدني بالقوة، لكي تتم بي المناداة بالبشارة، فيسمعها جميع من هم من الأمم؛ وقد نجوت من فم الأسد."]]}, {"l": "Act 9:16", "n": "", "vs": [[16, "وسأريه كم ينبغي أن يتألم من أجل اسمي!»"]]}, {"l": "Act 13:46", "n": "", "vs": [[46, "فخاطبهم بولس وبرنابا بجرأة قائلين: «كان يجب أن نبلغكم أنتم أولا كلمة الله، ولكنكم رفضتموها فأظهرتم أنكم لا تستحقون الحياة الأبدية. وها نحن نتوجه إلى غير اليهود!"]]}, {"l": "Act 13:50", "n": "", "vs": [[50, "ولكن اليهود حرضوا النساء النبيلات والمتعبدات ووجهاء المدينة، وأثاروا الاضطهاد على بولس وبرنابا، حتى طردوهما من بلدهم،"]]}, {"l": "Act 14:5", "n": "", "vs": [[5, "ولما أوشك غير اليهود واليهود ورؤساؤهم أن يهينوا الرسولين ويرجموهما بالحجارة،"]]}, {"l": "Act 14:6", "n": "", "vs": [[6, "علما بذلك فهربا إلى مدينتي لسترة ودربة الواقعتين في مقاطعة ليكأونية، وإلى المنطقة المحيطة بهما،"]]}, {"l": "Act 21:27-31", "n": "", "vs": [[27, "ولما كادت الأيام السبعة أن تنقضي، رأى بعض اليهود من مقاطعة أسيا بولس في الهيكل، فحرضوا الجمع كله، وقبضوا عليه،"], [28, "وهم يصرخون: «النجدة يابني إسرائيل! هذا هو الرجل الذي يدعو الناس في كل مكان إلى عقيدة تشكل خطرا على شعبنا وشريعتنا وعلى هذا المكان، حتى إنه أدخل اليونانيين إلى الهيكل ودنس هذا المكان المقدس!»"], [29, "فإنهم كانوا قد رأوا تروفيمس الأفسسي مع بولس في المدينة، فظنوا أنه أدخله معه إلى الهيكل."], [30, "عندئذ هاج أهل المدينة جميعا، وهجم الناس على بولس وجروه إلى خارج الهيكل، ثم أغلقت الأبواب حالا."], [31, "وبينما هم يحاولون أن يقتلوه سمع قائد الكتيبة الرومانية أن الاضطراب عم أورشليم كلها."]]}, {"l": "Act 22:21-24", "n": "", "vs": [[21, "ولكنه قال لي: اذهب ... سأرسلك بعيدا: إلى الأمم!»"], [22, "ظل المجتمعون يصغون حتى وصل بولس إلى ذكر الأمم، فصرخوا بقائد الكتيبة: «انزع هذا الرجل من الأرض! إنه لا يستحق الحياة!»"], [23, "ثم أخذوا يصيحون ويلوحون بثيابهم، ويذرون الغبار في الهواء."], [24, "فأمر القائد جنوده أن يدخلوا بولس إلى الثكنة وأن يستجوبوه تحت جلد السياط ليعرف سبب الهتافات الصاخبة ضده."]]}, {"l": "Eph 3:1-8", "n": "", "vs": [[1, "لهذا السبب، أنا بولس سجين المسيح يسوع لأجلكم أنتم الأمم …"], [2, "على اعتبار أنكم قد سمعتم بتدبير نعمة الله الموهوبة لي لأجلكم:"], [3, "كيف كشف لي السر عن طريق الوحي، كما كتبت قبلا بإيجاز،"], [4, "ويمكنكم، حينما تقرأون ما كتبته، أن تدركوا اطلاعي العميق على سر المسيح،"], [5, "ذلك السر الذي لم يطلع عليه بنو البشر في الأجيال الماضية مثلما أعلن الآن بوحي الروح لرسله القديسين وأنبيائه:"], [6, "وهو أن الأمم هم شركاء اليهود في الميراث، وأعضاء في الجسد معهم، ولهم أيضا حق الاستفادة من الوعد. وذلك في المسيح يسوع وبفضل الإنجيل"], [7, "الذي صرت أنا خادما له بحسب نعمة الله الموهوبة لي وفقا لعمل قدرته."], [8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "1Th 2:16", "n": "", "vs": [[16, "إذ يمنعوننا من تبشير الأمم ليخلصوا، وبذلك يستكملون خطاياهم كل حين، ولكن الغضب قد حل عليهم إلى الغاية."]]}], "kwAr": "من أجل ذلك", "noteAr": ""}, {"kw": "I am", "raw": "2Ti_1:8; Psa_25:2; Isa_50:7, Isa_54:4; Act_21:13; Rom_1:16, Rom_5:4, Rom_5:5, Rom_9:33; Phi_1:20; Heb_12:2; 1Pe_4:16", "note": "", "refs": [{"l": "2Ti 1:8", "n": "", "vs": [[8, "فلا تخجل إذن بالشهادة لربنا، ولا تخجل بي أنا السجين لأجله، بل شاركني في المشقات لأجل الإنجيل، متوكلا على قدرة الله."]]}, {"l": "Psa 25:2", "n": "", "vs": [[2, "عليك ياإلهي توكلت فلا تخزني، ولا تدع أعدائي يشمتون بي."]]}, {"l": "Isa 50:7", "n": "", "vs": [[7, "لأن السيد الرب يغيثني فلا أخزى، لذلك جعلت وجهي كالصوان، لأني عالم أنني لن أخزى."]]}, {"l": "Isa 54:4", "n": "", "vs": [[4, "لا تجزعي لأنك لن تخزي، ولا تخجلي لأنه لن يلحق بك عار، فأنت ستنسين خزي صباك، ولن تذكري من بعد عار ترملك."]]}, {"l": "Act 21:13", "n": "", "vs": [[13, "ولكنه قال لنا: «ما لكم تبكون وتحطمون قلبي؟ إني مستعد ليس فقط لأن أقيد في أورشليم، بل أيضا لأن أموت من أجل اسم الرب يسوع!»"]]}, {"l": "Rom 1:16", "n": "", "vs": [[16, "فأنا لا أستحي بالإنجيل، لأنه قدرة الله للخلاص، لكل من يؤمن، لليهودي أولا ثم لليوناني على السواء."]]}, {"l": "Rom 5:4", "n": "", "vs": [[4, "والصبر يؤهلنا للفوز في الامتحان، والفوز يبعث فينا الرجاء،"]]}, {"l": "Rom 5:5", "n": "", "vs": [[5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."]]}, {"l": "Rom 9:33", "n": "", "vs": [[33, "كما كتب: «ها أنا واضع في صهيون حجر عثرة وصخرة سقوط. ومن يؤمن به لا يخيب»."]]}, {"l": "Phi 1:20", "n": "", "vs": [[20, "وفقا لما أتوقعه وأرجوه: أني لن أفشل في شيء، بل في كل جرأة وكما في كل حين فكذلك الآن أيضا، يتعظم المسيح في جسدي، سواء أكان بالحياة أم بالموت."]]}, {"l": "Heb 12:2", "n": "", "vs": [[2, "متطلعين دائما إلى يسوع: رائد إيماننا ومكمله. فهو قد تحمل الموت صلبا، هازئا بما في ذلك من عار، إذ كان ينظر إلى السرور الذي ينتظره، ثم جلس عن يمين عرش الله."]]}, {"l": "1Pe 4:16", "n": "", "vs": [[16, "ولكن إن تألم أحدكم لأنه «مسيحي»، فعليه ألا يخجل، بل أن يمجد الله لأجل هذا الاسم!"]]}], "kwAr": "لست أخجل", "noteAr": ""}, {"kw": "for I", "raw": "Psa_9:10, Psa_56:9; Phi_3:8, Phi_3:10; 1Pe_4:19", "note": "", "refs": [{"l": "Psa 9:10", "n": "", "vs": [[10, "ويتكل عليك الذين يعرفون اسمك، لأنك يارب لم تخذل طالبيك."]]}, {"l": "Psa 56:9", "n": "", "vs": [[9, "عندما أدعوك يتقهقر أعدائي إلى الوراء. وهذا ما تيقنت منه: أن الله معي."]]}, {"l": "Phi 3:8", "n": "", "vs": [[8, "بل إني أعتبر كل شيء خسارة، من أجل امتياز معرفة المسيح يسوع ربي؛ فمن أجله تحملت خسارة كل شيء، وأعتبر كل شيء نفاية، لكي أربح المسيح"]]}, {"l": "Phi 3:10", "n": "", "vs": [[10, "وغايتي أن أعرف المسيح وقوة قيامته والشركة في آلامه؛ والتشبه به في موته،"]]}, {"l": "1Pe 4:19", "n": "", "vs": [[19, "إذن، على الذين يتألمون وفقا لإرادة الله، أن يسلموا أنفسهم للخالق الأمين، ويواظبوا على عمل الصلاح!"]]}], "kwAr": "لأنني أعرف", "noteAr": ""}, {"kw": "believed", "raw": "or, trusted, Isa_12:2; Nah_1:7; Mat_12:21; Rom_15:12, Rom_15:13; Eph_1:12, Eph_1:13; 1Pe_1:20,1Pe_1:21", "note": "or, trusted, Isa_12:2; Nah_1:7; Mat_12:21; Rom_15:12, Rom_15:13; Eph_1:12, Eph_1:13; 1Pe_1:20,1Pe_1:21", "refs": [{"l": "Isa 12:2", "n": "", "vs": [[2, "ها إن الله خلاصي فأطمئن ولا أرتعد، لأن الرب الله هو قوتي وترنيمتي وقد أصبح لي خلاصا»."]]}, {"l": "Nah 1:7", "n": "", "vs": [[7, "الرب صالح، حصن في يوم الضيق، ويعرف المعتصمين به."]]}, {"l": "Mat 12:21", "n": "", "vs": [[21, "وعلى اسمه تعلق الأمم رجاءها! »"]]}, {"l": "Rom 15:12", "n": "", "vs": [[12, "ويقول إشعياء أيضا: «سيطلع أصل يسى، والقائم، ليسود على الأمم: عليه تعلق الشعوب الرجاء»."]]}, {"l": "Rom 15:13", "n": "", "vs": [[13, "فليملأكم إله الرجاء كل فرح وسلام في إيمانكم حتى تزدادوا رجاء بقوة الروح القدس."]]}, {"l": "Eph 1:12", "n": "", "vs": [[12, "والغاية أن نكون سببا لمدح مجده بعدما سبق لنا أن وضعنا رجاءنا في المسيح."]]}, {"l": "Eph 1:13", "n": "", "vs": [[13, "وفيه أنتم أيضا (وضعتم رجاءكم) إذ سمعتم كلمة الحق، أي الإنجيل الذي فيه خلاصكم؛ كذلك فيه أيضا ختمتم، إذ آمنتم، بالروح القدس الموعود،"]]}, {"l": "1Pe 1:20", "n": "", "vs": [[20, "ومع أن الله كان قد عين المسيح لهذا الغرض قبل تأسيس العالم، فهو لم يعلنه إلا في هذا الزمن الأخير لفائدتكم"]]}, {"l": "1Pe 1:21", "n": "", "vs": [[21, "أنتم الذين تؤمنون بالله  "", "vs": [[23, "اقتن الحق ولا تبعه، وكذا الحكمة والتأديب والفطنة."]]}, {"l": "Phi 1:27", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"]]}, {"l": "1Th 5:21", "n": "", "vs": [[21, "امتحنوا كل شيء وتمسكوا بالحسن."]]}, {"l": "Tit 1:9", "n": "", "vs": [[9, "ملتصقا بالكلمة الصادقة الموافقة للتعليم، ليكون قادرا على تشجيع المؤمنين بالتعليم الصحيح وعلى إفحام المعارضين."]]}, {"l": "Heb 3:6", "n": "", "vs": [[6, "أما المسيح، فهو أمين بصفته ابنا يترَأس على البيت. وهذا البيت هو نحن المؤمنين، على أن نتمسك بالثقة والافتخار برجائنا تمسكا ثابتا حتى النهاية."]]}, {"l": "Heb 4:14", "n": "", "vs": [[14, "فمادام لنا رئيس كهنتنا العظيم الذي ارتفع مجتازا السماوات، وهو يسوع ابن الله، فلنتمسك دائما بالاعتراف به."]]}, {"l": "Heb 10:23", "n": "", "vs": [[23, "ولنتمسك دائما بالرجاء الذي نعترف به، دون أن نشك في أنه سيتحقق، لأن الذي وعدنا بتحقيقه، هو أمين وصادق."]]}, {"l": "Jud 1:3", "n": "", "vs": [[3, "أيها الأحباء، كنت قد نويت أن أكتب إليكم في موضوع الخلاص الذي نشترك فيه جميعا. ولكن، أراني الآن مضطرا لأن أكتب لأشجعكم على الجهاد في سبيل الإيمان الذي سلم مرة واحدة للقديسين."]]}, {"l": "Rev 2:25", "n": "", "vs": [[25, "فقط تمسكوا بما لديكم إلى أن أجيء."]]}, {"l": "Rev 3:3", "n": "", "vs": [[3, "تذكر ما سبق أن تقبلته وسمعته، وتمسك بما آمنت به، وتب! فإن كنت لا تتنبه، آتيك كما يأتي اللص، ولا تدري في أية ساعة أفاجئك!"]]}, {"l": "Rev 3:11", "n": "", "vs": [[11, "إني آت سريعا، فتمسك بما عندك، لئلا يسلب أحد إكليلك."]]}], "kwAr": "اتخذ", "noteAr": ""}, {"kw": "the form", "raw": "Pro_8:14; Rom_2:20, Rom_6:17; 1Ti_1:10, 1Ti_6:3; Tit_2:1, Tit_2:8", "note": "", "refs": [{"l": "Pro 8:14", "n": "", "vs": [[14, "لي المشورة والرأي الصائب، لي الفطنة والقوة."]]}, {"l": "Rom 2:20", "n": "", "vs": [[20, "ومؤدب للجهال، ومعلم للأطفال؛ ولك في الشريعة صورة المعرفة والحق؛"]]}, {"l": "Rom 6:17", "n": "", "vs": [[17, "إنما الشكر لله، لأنكم كنتم عبيدا للخطيئة ولكن أ أمانة بين أيدي أناس جديرين بالثقة، يكونون قادرين على تعليم الآخرين."]]}, {"l": "Luk 16:11", "n": "", "vs": [[11, "فإن لم تكونوا أمناء في مال الظلم، فمن يأتمنكم على مال الحق؟"]]}, {"l": "Rom 3:2", "n": "", "vs": [[2, "إنه كثير من جميع الجهات، وأهمها فعلا أن أقوال الله وضعت أمانة بين أيديهم."]]}, {"l": "1Co 9:17", "n": "", "vs": [[17, "فإن قمت بذلك متطوعا، كانت لي مكافأة. ولكن، إن كنت مرغما، فأنا مؤتمن على مسئولية،"]]}, {"l": "2Co 5:19", "n": "", "vs": [[19, "ذلك أن الله كان في المسيح مصالحا العالم مع نفسه، غير حاسب عليهم خطاياهم، وقد وضع بين أيدينا رسالة هذه المصالحة."]]}, {"l": "2Co 5:20", "n": "", "vs": [[20, "فنحن إذن سفراء المسيح، وكأن الله يعظ بنا نتوسل بالنيابة عن المسيح منادين: «تصالحوا مع الله!»"]]}, {"l": "Gal 2:7", "n": "", "vs": [[7, "بل بالعكس، رأوا أنه عهد إلي بالإنجيل لأهل عدم الختان، كما عهد به إلى بطرس لأهل الختان."]]}, {"l": "Col 4:11", "n": "", "vs": [[11, "ويسوع المعروف باسم يسطس. هؤلاء جميعا من أهل الختان، وهم وحدهم معاوني لأجل ملكوت الله، وقد كانوا لي عزاء."]]}, {"l": "1Ti 1:11", "n": "", "vs": [[11, "الموافق لإنجيل مجد الله المبارك، ذلك الإنجيل الذي وضع أمانة بين يدي."]]}, {"l": "1Ti 6:20", "n": "", "vs": [[20, "ياتيموثاوس، حافظ على الأمانة المودعة لديك. تجنب الكلام الدنس الباطل، ومناقضات ما يسمى زورا «معرفة»."]]}], "kwAr": "الأمانة الكريمة", "noteAr": ""}, {"kw": "by the", "raw": "Rom_8:13; Eph_5:18; 1Th_5:19; 1Pe_1:22", "note": "", "refs": [{"l": "Rom 8:13", "n": "", "vs": [[13, "لأنه إن عشتم بحسب الجسد، فإنكم ستموتون، ولكن إن كنتم بالروح تميتون أعمال الجسد، فستحيون."]]}, {"l": "Eph 5:18", "n": "", "vs": [[18, "لا تسكروا بالخمر، ففيها الخلاعة، وإنما امتلئوا بالروح،"]]}, {"l": "1Th 5:19", "n": "", "vs": [[19, "لا تخمدوا الروح،"]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}], "kwAr": "بالروح القدس", "noteAr": ""}, {"kw": "which dwelleth", "raw": "Joh_14:17; Rom_8:11; 1Co_3:16, 1Co_6:19; 2Co_5:16; Eph_2:22", "note": "", "refs": [{"l": "Joh 14:17", "n": "", "vs": [[17, "وهو روح الحق، الذي لا يقدر العالم أن يتقبله لأنه لا يراه ولا يعرفه، وأما أنتم فتعرفونه لأنه في وسطكم، وسيكون في داخلكم."]]}, {"l": "Rom 8:11", "n": "", "vs": [[11, "وإذا كان روح الذي أقام يسوع من بين الأموات يسكن فيكم، فإن الذي أقام المسيح من بين الأموات سوف يحيي أيضا أجسادكم الفانية بسبب روحه الذي يسكن فيكم."]]}, {"l": "1Co 3:16", "n": "", "vs": [[16, "ألا تعرفون أنكم هيكل الله وأن روح الله ساكن فيكم؟"]]}, {"l": "1Co 6:19", "n": "", "vs": [[19, "أما تعلمون أن جسدكم هو هيكل للروح القدس الساكن فيكم والذي هو لكم من الله، وأنكم أنتم لستم ملكا لأنفسكم؟"]]}, {"l": "2Co 5:16", "n": "", "vs": [[16, "إذن، نحن منذ الآن لا نعرف أحدا معرفة بشرية. ولكن إن كنا قد عرفنا المسيح معرفة بشرية، فنحن الآن لا نعرفه هكذا بعد."]]}, {"l": "Eph 2:22", "n": "", "vs": [[22, "وفيه أنتم أيضا قد بنيتم معا فصرتم مسكنا لله بوجود الروح."]]}], "kwAr": "الحال فينا", "noteAr": ""}], "arS": [["وحافظ", ["G5442"]], [" على ", []], ["الأمانة", ["G2570"]], [" الكريمة ", []], ["المودعة لديك", ["G3872"]], ["، ", []], ["بالروح", ["G4151"]], [" ", []], ["القدس", ["G40"]], [" ", []], ["الحال", ["G1774"]], [" فينا.", []]]}, {"c": 1, "v": 15, "text": "أنت على علم بأن معاوني الذين في مقاطعة أسيا، ومنهم فيجلس وهرموجينس، قد تخلوا عني.", "groups": [{"kw": "that", "raw": "Act_16:6, Act_19:10,Act_19:27, Act_19:31, Act_20:16; 1Co_16:19", "note": "", "refs": [{"l": "Act 16:6", "n": "", "vs": [[6, "ومنعهم الروح القدس من التبشير في مقاطعة أسيا، فسافروا في مقاطعتي فريجية وغلاطية."]]}, {"l": "Act 19:10", "n": "", "vs": [[10, "وداوم على ذلك مدة سنتين. وهكذا وصلت كلمة الرب إلى جميع سكان مقاطعة أسيا من اليهود واليونانيين."]]}, {"l": "Act 19:27", "n": "", "vs": [[27, "وهذا لا يهدد صناعتنا بالكساد وحسب، بل يعرض معبد أرطاميس إلهتنا العظمى لفقدان هيبته. فنخشى أن تتلاشى كرامتها وتنهار عظمتها، وهي التي يتعبد لها سكان أسيا جميعا، بل العالم كله!»"]]}, {"l": "Act 19:31", "n": "", "vs": [[31, "كما أرسل إليه أصدقاؤه من وجهاء أسيا يرجون منه ألا يعرض نفسه لخطر الذهاب إلى الملعب،"]]},
