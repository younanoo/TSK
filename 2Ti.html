6, "إذا، لا يتعلق الأمر برغبة الإنسان ولا بسعيه، وإنما برحمة الله فقط."], [17, "فإن الله يقول لفرعون في الكتاب: «لهذا الأمر بعينه أقمتك: لأظهر فيك قدرتي ويعلن اسمي في الأرض كلها»."], [18, "فالله إذا يرحم من يشاء، ويقسي من يشاء."], [19, "هنا ستقول لي: «لماذ يلوم بعد؟ من يقاوم قصده؟»"], [20, "فأقول: من أنت أيها الإنسان حتى ترد جوابا على الله؟ أيقول الشيء المصنوع لصانعه: لماذا صنعتني هكذا؟"], [21, "أوليس لصانع الفخار سلطة على الطين ليصنع من كتلة واحدة وعاء للاستعمال الرفيع وآخر للاستعمال الوضيع؟"], [22, "فماذا إذا إن كان الله ، وقد شاء أن يظهر غضبه ويعلن قدرته، احتمل بكل صبر أوعية غضب جاهزة للهلاك،"], [23, "وذلك بقصد أن يعلن غنى مجده في أوعية الرحمة التي سبق فأعدها للمجد،"]]}, {"l": "Eph 2:4", "n": "", "vs": [[4, "أما الله ، وهو غني في الرحمة، فبسبب محبته العظيمة التي أحبنا بها،"]]}, {"l": "1Pe 1:10", "n": "", "vs": [[10, "وكم فتش الأنبياء قديما وبحثوا عن هذا الخلاص! فهم تنبأوا عن نعمة الله التي كان قد أعدها لكم أنتم،"]]}], "kwAr": "الرحمة من الرب", "noteAr": ""}, {"kw": "in that", "raw": "2Ti_1:12; 1Th_2:19", "note": "", "refs": [{"l": "2Ti 1:12", "n": "", "vs": [[12, "من أجل ذلك أيضا أقاسي الآن هذه الآلام، ولكني لست أخجل، لأنني أعرف من أنا مؤمن به، ولي تمام الثقة بأنه قادر أن يحفظ لي الأمانة التي أودعتها عنده سالمة إلى ذلك اليوم."]]}, {"l": "1Th 2:19", "n": "", "vs": [[19, "فما هو رجاؤنا أو فرحنا أو إكليل افتخارنا أمام ربنا يسوع عند عودته؟ أليس أنتم؟ بلى،"]]}], "kwAr": "في ذلك اليوم", "noteAr": ""}, {"kw": "ministered", "raw": "Luk_8:3; 2Co_9:1; Heb_6:10", "note": "", "refs": [{"l": "Luk 8:3", "n": "", "vs": [[3, "ويونا زوجة خوزي وكيل هيرودس، وسوسنة، وغيرهن كثيرات ممن كن يساعدنه بأموالهن."]]}, {"l": "2Co 9:1", "n": "", "vs": [[1, "فإنه من غير الضروري أن أكتب إليكم في موضوع إعانة القديسين،"]]}, {"l": "Heb 6:10", "n": "", "vs": [[10, "وليس الله بظالم حتى ينسى عملكم الجاد في إظهار محبتكم له عن طريق خدمتكم للقديسين إكراما لاسمه، الأمر الذي قمتم به قبلا، وتقومون به الآن!"]]}], "kwAr": "ما خدمني به", "noteAr": ""}, {"kw": "Ephesus", "raw": "2Ti_4:12; Act_19:1; 1Co_16:8; 1T بن بل روح القوة والمحبة والبصيرة."]]}, {"l": "Jos 1:7", "n": "", "vs": [[7, "كن شديد البأس ثابت القلب، ولتطع كل حرف من حروف الشريعة التي أمرك بها موسى عبدي. لا تحد عنها يمينا أو شمالا، لكي تفلح حيثما تتوجه."]]}, {"l": "Hag 2:4", "n": "", "vs": [[4, "والآن تشجع يازربابل، يقول الرب، وتشدد يايهوشع بن يهوصادق رئيس الكهنة، وأنتم كذلك ياجميع سكان الأرض. تشجعوا واعملوا بجد لأني معكم، يقول الرب القدير."]]}, {"l": "1Co 16:13", "n": "", "vs": [[13, "كونوا متيقظين حذرين. اثبتوا في الإيمان. كونوا رجالا. كونوا أقوياء."]]}, {"l": "2Co 12:9", "n": "", "vs": [[9, "فقال لي: «نعمتي تكفيك، لأن قدرتي تكمل في الضعف!» فأنا أرضى بأن أفتخر مسرورا بالضعفات التي في، لكي تخيم علي قدرة المسيح."]]}, {"l": "2Co 12:10", "n": "", "vs": [[10, "فلأجل المسيح، تسرني الضعفات والإهانات والضيقات والاضطهادات والصعوبات، لأني حينما أكون ضعيفا، فحينئذ أكون قويا!"]]}, {"l": "Eph 6:10", "n": "", "vs": [[10, "وختاما، تشددوا في الرب وفي قدرة قوته."]]}, {"l": "Phi 4:13", "n": "", "vs": [[13, "إني أستطيع كل شيء، في المسيح الذي يقويني."]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}], "kwAr": "فكن قويا", "noteAr": ""}], "arS": [["وأنت ", []], ["ياولدي", ["G5043", "G3450"]], ["، ", []], ["فكن قويا", ["G1743"]], [" في ", []], ["النعمة", ["G5485"]], [" التي في ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [".", []]]}, {"c": 2, "v": 2, "text": "والتعاليم التي سمعتها مني بحضور شهود عديدين، أودعها أمانة بين أيدي أناس جديرين بالثقة، يكونون قادرين على تعليم الآخرين.", "groups": [{"kw": "the things", "raw": "2Ti_1:13, 2Ti_3:10,2Ti_3:14", "note": "", "refs": [{"l": "2Ti 1:13", "n": "", "vs": [[13, "اتخذ من الكلام الصحيح الذي سمعته مني مثالا في الإيمان والمحبة اللذين في المسيح يسوع."]]}, {"l": "2Ti 3:10", "n": "", "vs": [[10, "وأما أنت، فقد عرفت جيدا تعليمي، وسيرتي، وهدفي، وإيماني، وتحملي للمشقات، ومحبتي، وثباتي،"]]}, {"l": "2Ti 3:14", "n": "", "vs": [[14, "إنما أنت فاثبت على ما تعلمته وتيقنته بالتمام، إذ تعرف على يد من تعلمت ذلك."]]}], "kwAr": "التعاليم التي سمعتها مني", "noteAr": ""}, {"kw": "among", "raw": "or, by", "note": "or, by", "refs": [], "kwAr": "بحضور", "noteAr": "أو: بواسطة (شهود كثيرين)."}, {"kw": "many", "raw": "1Ti_4:14, 1Ti_6:12", "note": "", "refs": [{"l": "1Ti 4:14", "n": "", "vs": [[14, "لا تهمل الموهبة الخاصة التي فيك والتي أعطيت لك بالتنبوء ووضع الشيوخ أيديهم عليك."]]}, {"l": "1Ti 6:12", "n": "", "vs": [[12, "أحسن الجهاد في معركة الإيمان الجميلة. تمسك بالحياة الأبدية، التي إليها قد دعيت، وقد اعترفت الاعتراف الحسن (بالإيمان) أمام شهود كثيرين."]]}], "kwAr": "شهود عديدين", "noteAr": ""}, {"kw": "the same", "raw": "2Ti_1:14; 1Ti_1:18, 1Ti_5:22", "note": "", "refs": [{"l": "2Ti 1:14", "n": "", "vs": [[14, "وحافظ على الأمانة الكريمة المودعة لديك، بالروح القدس الحال فينا."]]}, {"l": "1Ti 1:18", "n": "", "vs": [[18, "هذه التوصيات، ياتيموثاوس ولدي، أسلمها لك، بمقتضى النبوآت السابقة المختصة بك، وغايتي أن تحسن الجهاد في حربك الروحية،"]]}, {"l": "1Ti 5:22", "n": "", "vs": [[22, "لا تتسرع في وضع يدك على أحد. ولا تشترك في خطايا الآخرين. واحفظ نفسك طاهرا."]]}], "kwAr": "أودعها أمانة", "noteAr": ""}, {"kw": "faithful", "raw": "Num_12:7; 1Sa_2:35; Neh_7:2; Psa_101:6; Pro_13:17; Jer_23:28; Mat_24:25; Luk_12:42, Luk_16:10-12; 1Co_4:2; Col_1:7; 1Ti_1:12; Heb_2:17, Heb_3:2, Heb_3:3; Rev_2:10-13", "note": "", "refs": [{"l": "Num 12:7", "n": "", "vs": [[7, "أما عبدي موسى فلست أعامله هكذا، بل هو أمين في بيتي،"]]}, {"l": "1Sa 2:35", "n": "", "vs": [[35, "فأختار لنفسي كاهنا مخلصا يعمل بمقتضى ما بقلبي ونفسي فأقيم له بيتا أمينا، ويصير كاهنا للملك الذي أختاره."]]}, {"l": "Neh 7:2", "n": "", "vs": [[2, "عهدت بتدبير شؤون أورشليم إلى أخي حناني، وإلى حننيا رئيس القصر، لأنه كان رجلا أمينا يتقي الله أكثر من سواه."]]}, {"l": "Psa 101:6", "n": "", "vs": [[6, "ترعى عيناي الأمناء في الأرض ليسكنوا معي. وخدامي هم السالكون في طريق الكمال."]]}, {"l": "Pro 13:17", "n": "", "vs": [[17, "الرسول الشرير يوقع الناس في الأزمات، أما السفير الأمين فيصلح بين المتخاصمين."]]}, {"l": "Jer 23:28", "n": "", "vs": [[28, "فليقص النبي الحالم حلمه. ولكن من لديه كلمتي فليعلنها بالحق، إذ ماذا يجمع بين التبن والحنطة؟"]]}, {"l": "Mat 24:25", "n": "", "vs": [[25, "ها أنا قد أخبرتكم بالأمر قبل حدوثه."]]}, {"l": "Luk 12:42", "n": "", "vs": [[42, "فقال الرب: «من هو إذن الوكيل الأمين العاقل الذي يقيمه سيده على أهل بيته ليقدم لهم حصتهم من الطعام في حينها؟"]]}, {"l": "Luk 16:10-12", "n": "", "vs": [[10, "إن الأمين في القليل أمين أيضا في الكثير، والخائن في القليل خائن أيضا في الكثير."], [11, "فإن لم تكونوا أمناء في مال الظلم، فمن يأتمنكم على مال الحق؟"], [12, "وإن لم تكونوا أمناء في ما يخص غيركم، فمن يعطيكم ما يخصكم؟"]]}, {"l": "1Co 4:2", "n": "", "vs": [[2, "والمطلوب من الوكلاء، قبل كل شيء، أن يوجد كل منهم أمينا."]]}, {"l": "Col 1:7", "n": "", "vs": [[7, "على حسب ما تعلمتم من أبفراس شريكنا العبد الحبيب، والخادم الأمين للمسيح عندكم"]]}, {"l": "1Ti 1:12", "n": "", "vs": [[12, "وكم أشكر المسيح يسوع ربنا الذي أعطاني القدرة وعينني خادما له، إذ اعتبرني جديرا بثقته،"]]}, {"l": "Heb 2:17", "n": "", "vs": [[17, "ولذلك كان لابد أن يشبه إخوته من جميع النواحي، ليكون هو رئيس الكهنة، الرحيم والأمين، الذي يقوم بعمله أمام الله نيابة عن الشعب، فيكفر عن خطاياهم."]]}, {"l": "Heb 3:2", "n": "", "vs": [[2, "فهو أمين لله في المهمة التي عينه لها، كما كان موسى أمينا في القيام بخدمته في بيت الله كله."]]}, {"l": "Heb 3:3", "n": "", "vs": [[3, "إلا أنه يستحق مجدا أعظم من مجد موسى، كما أن الذي يبني بيتا ينال إكراما ومدحا أكثر مما ينال البيت الذي بناه!"]]}, {"l": "Rev 2:10-13", "n": "", "vs": [[10, "دع عنك الخوف مما ينتظرك من آلام، فإن إبليس سيزج ببعضكم في السجن لكي تمتحنوا، فتقاسون الاضطهاد عشرة أيام. فابق أمينا حتى الموت، فأمنحك إكليل الحياة."], [11, "من له أذن فليسمع ما يقوله الروح للكنائس! كل من ينتصر لن يلحق به أذى الموت الثاني!"], [12, "واكتب إلى ملاك الكنيسة في برغامس: إليك ما يقوله صاحب السيف القاطع ذي الحدين."], [13, "إني أعلم أين تسكن، حيث عرش الشيطان! ورغم ذلك تمسكت باسمي، ورفضت أن تنكر الإيمان بي، حتى في أيام أنتيباس شهيدي الأمين، الذي قتل عندكم حيث يسكن الشيطان!"]]}], "kwAr": "جديرين بالثقة", "noteAr": ""}, {"kw": "who", "raw": "2Ti_2:24, 2Ti_2:25; Ezr_7:10,Ezr_7:25; Mal_2:7; Mat_13:52; 1Ti_3:2-9, 1Ti_4:6; Tit_1:5-9", "note": "", "refs": [{"l": "2Ti 2:24", "n": "", "vs": [[24, "وعبد الرب يجب ألا يتشاجر، بل أن يكون مترفقا تجاه الجميع، قادرا على التعليم، يتحمل المشقات بصبر،"]]}, {"l": "2Ti 2:25", "n": "", "vs": [[25, "ويؤدب بالوداعة مقاومي الإيمان، عسى أن يمنحهم الله التوبة، فيعرفوا الحق بالتمام،"]]}, {"l": "Ezr 7:10", "n": "", "vs": [[10, "لأن عزرا أخلص نيته لطلب شريعة الرب وممارستها، وتعليم الشعب فرائضها وأحكامها."]]}, {"l": "Ezr 7:25", "n": "", "vs": [[25, "أما أنت ياعزرا فبمقتضى ما تتمتع به من حكمة إلهك، عين حكاما وقضاة من العارفين بشرائع إلهك، يقضون بين الشعب المقيم في عبر نهر الفرات، وليعلموا الجاهلين بها."]]}, {"l": "Mal 2:7", "n": "", "vs": [[7, "لأن شفتي الكاهن تحفظان العلم، ومن فمه يطلب الناس الشريعة، لأنه رسول الرب القدير."]]}, {"l": "Mat 13:52", "n": "", "vs": [[52, "فقال: «ولهذا السبب، فأي واحد من الكتبة يصير تلميذا لملكوت السماوات، يشبه بإنسان رب بيت يطلع من كنزه ما هو جديد وما هو عتيق! »"]]}, {"l": "1Ti 3:2-9", "n": "", "vs": [[2, "إذن، يجب أن يكون الراعي بلا عيب، زوجا لامرأة واحدة، نبيها عاقلا مهذبا مضيافا، قادرا على التعليم؛"], [3, "لا مدمنا للخمر ولا عنيفا؛ بل لطيفا، غير متعود الخصام، غير مولع بالمال،"], [4, "يحسن تدبير بيته، ويربي أولاده في الخضوع بكل احترام."], [5, "فإن كان أحد لا يحسن تدبير بيته، فكيف يعتني بكنيسة الله؟"], [6, "ويجب أيضا أن لا يكون مبتدئا في الإيمان، لئلا ينتفخ تكبرا، فيقع في جريمة إبليس!"], [7, "ومن الضروري أن تكون له شهادة حسنة من الذين في خارج الكنيسة، لكي لا يقع في العار وفي فخ إبليس."], [8, "أما المدبرون، فيجب أن يكونوا أيضا ذوي رصانة، لا ذوي لسانين، ولا مدمنين للخمر، لا ساعين إلى المكسب الخسيس."], [9, "يتمسكون بحقائق الإيمان الخفية بضمير نقي."]]}, {"l": "1Ti 4:6", "n": "", "vs": [[6, "إن بسطت هذه الأمور أمام الإخوة، كنت خادما صالحا للمسيح يسوع، متغذيا بكلام الإيمان والتعليم الصالح الذي اتبعته تماما."]]}, {"l": "Tit 1:5-9", "n": "", "vs": [[5, "تركتك في جزيرة كريت لكي تكمل ترتيب الأمور الباقية، وتقيم شيوخا في كل مدينة، مثلما أمرتك؛"], [6, "على أن يكون الواحد منهم بريئا من كل تهمة، زوجا لامرأة واحدة، أبا لأولاد مؤمنين لا يتهمون بالخلاعة والتمرد."], [7, "وذلك لأن الناظر يجب أن يكون بريئا من كل تهمة باعتباره وكيلا لله، لا معجبا بنفسه ولا حاد الطبع، ولا مدمن الخمر، ولا عنيفا، ولا ساعيا إلى المكسب الخسيس؛"], [8, "بل مضيافا، محبا للصلاح، رزينا، بارا، تقيا، مالكا لطبعه،"], [9, "ملتصقا بالكلمة الصادقة الموافقة للتعليم، ليكون قادرا على تشجيع المؤمنين بالتعليم الصحيح وعلى إفحام المعارضين."]]}], "kwAr": "قادرين على تعليم الآخرين", "noteAr": ""}], "arS": [["والتعاليم التي ", []], ["سمعتها", ["G191"]], [" مني بحضور ", []], ["شهود", ["G3144"]], [" ", []], ["عديدين", ["G4183"]], ["، ", []], ["أودعها", ["G3908"]], [" أمانة بين أيدي ", []], ["أناس", ["G444"]], [" ", []], ["جديرين بالثقة", ["G4103"]], ["، يكونون ", []], ["قادرين", ["G2425"]], [" على ", []], ["تعليم", ["G1321"]], [" ", []], ["الآخرين", ["G2087"]], [".", []]]}, {"c": 2, "v": 3, "text": "شارك في احتمال الآلام كجندي صالح للمسيح يسوع.", "groups": [{"kw": "endure", "raw": "2Ti_2:10, 2Ti_1:8, 2Ti_3:11, 2Ti_4:5; 1Co_13:7; 2Co_1:6; Heb_6:15, Heb_10:32, Heb_11:27, Heb_12:2, Heb_12:3; Jam_1:12", "note": "", "refs": [{"l": "2Ti 2:10", "n": "", "vs": [[10, "لهذا السبب أحتمل كل شيء بصبر لأجل الذين اختارهم الله ، لكي يحصلوا، هم أيضا، على الخلاص الذي في المسيح يسوع مع المجد الأبدي."]]}, {"l": "2Ti 1:8", "n": "", "vs": [[8, "فلا تخجل إذن بالشهادة لربنا، ولا تخجل بي أنا السجين لأجله، بل شاركني في المشقات لأجل الإنجيل، متوكلا على قدرة الله."]]}, {"l": "2Ti 3:11", "n": "", "vs": [[11, "واضطهاداتي، وآلامي تلك التي حدثت لي في مدن أنطاكية وإيقونية ولسترة وغيرها؛ وكم احتملت من اضطهادات، والرب أنقذني منها جميعا!"]]}, {"l": "2Ti 4:5", "n": "", "vs": [[5, "أما أنت، فكن بصيرا في كل أمر، وتحمل المشقات، واعمل عمل المبشر، وأكمل خدمتك إلى التمام!"]]}, {"l": "1Co 13:7", "n": "", "vs": [[7, "إنها تستر كل شيء، وتصدق كل شيء، وترجو كل شيء، وتتحمل كل شيء."]]}, {"l": "2Co 1:6", "n": "", "vs": [[6, "فإن كنا في ضيقة، فذلك لأجل تشجيعكم وخلاصكم؛ وإن كنا متشجعين، فذلك لأجل تشجيعكم، مما يعمل فيكم على احتمال نفس الآلام التي نتألم بها نحن أيضا."]]}, {"l": "Heb 6:15", "n": "", "vs": [[15, "وهكذا، انتظر إبراهيم بصبر فنال ما وعد به."]]}, {"l": "Heb 10:32", "n": "", "vs": [[32, "لا تنسوا أبدا تلك الأيام الماضية التي فيها، بعدما أشرق عليكم نور الإيمان بالمسيح، صبرتم على جهاد مرير طويل، إذ قاسيتم كثيرا من الآلام."]]}, {"l": "Heb 11:27", "n": "", "vs": [[27, "بالإيمان، ترك أرض مصر وهو غير خائف من غضب الملك. فقد مضى في تنفيذ قراره، كأنه يرى بجانبه الله غير المنظور."]]}, {"l": "Heb 12:2", "n": "", "vs": [[2, "متطلعين دائما إلى يسوع: رائد إيماننا ومكمله. فهو قد تحمل الموت صلبا، هازئا بما في ذلك من عار، إذ كان ينظر إلى السرور الذي ينتظره، ثم جلس عن يمين عرش الله."]]}, {"l": "Heb 12:3", "n": "", "vs": [[3, "فتأملوا مليا ما قاساه بتحمله تلك المعاملة العنيفة التي عامله بها الخاطئون، لكي لا تتعبوا وتنهاروا!"]]}, {"l": "Jam 1:12", "n": "", "vs": [[12, "طوبى لمن يتحمل المحنة بصبر. فإنه، بعد أن يجتاز الامتحان بنجاح، سينال «إكليل الحياة» الذي وعد به الرب محبيه!"]]}], "kwAr": "شارك في احتمال الآلام", "noteAr": ""}, {"kw": "a good", "raw": "2Co_10:3-5; Eph_6:11-18; 1Ti_1:18", "note": "", "refs": [{"l": "2Co 10:3-5", "n": "", "vs": [[3, "فمع أننا نعيش في الجسد، فإننا لا نحارب وفقا للجسد."], [4, "فإن الأسلحة التي نحارب بها ليست جسدية، بل قادرة بالله على هدم الحصون: بها نهدم النظريات"], [5, "وكل ما يعلو مرتفعا لمقاومة معرفة الله، ونأسر كل فكر إلى طاعة المسيح."]]}, {"l": "Eph 6:11-18", "n": "", "vs": [[11, "البسوا سلاح الله الكامل، لتتمكنوا من الصمود في وجه مكايد إبليس."], [12, "فإن حربنا ليست ضد ذوي اللحم والدم، بل ضد الرئاسات، ضد السلطات، ضد أسياد العالم حكام هذا الظلام، ضد قوى الشر الروحية في الأماكن السماوية."], [13, "لذلك اتخذوا سلاح الله الكامل، لتتمكنوا من المقاومة في يوم الشر، ومن الصمود أيضا بعد تحقيق كل هدف."], [14, "فاصمدوا إذن بعد أن تتخذوا الحق حزاما لأوساطكم، والبر درعا لصدوركم،"], [15, "والاستعداد لنشر بشارة السلام حذاء لأقدامكم."], [16, "وفوق هذا كله، احملوا الإيمان ترسا به تقدرون أن تطفئوا جميع سهام الشرير المشتعلة."], [17, "واتخذوا الخلاص خوذة للرأس، وكلمة الله سيف الروح."], [18, "كونوا مصلين في كل حال، بكل صلاة وطلبة في الروح، وساهرين لهذا الغرض عينه مواظبين تماما على جميع الطلبات لأجل القديسين جميعا،"]]}, {"l": "1Ti 1:18", "n": "", "vs": [[18, "هذه التوصيات، ياتيموثاوس ولدي، أسلمها لك، بمقتضى النبوآت السابقة المختصة بك، وغايتي أن تحسن الجهاد في حربك الروحية،"]]}], "kwAr": "كجندي صالح", "noteAr": ""}], "arS": [["شارك في احتمال الآلام", ["G2553"]], [" ", []], ["كجندي", ["G4757"]], [" ", []], ["صالح", ["G2570"]], [" ", []], ["للمسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [".", []]]}, {"c": 2, "v": 4, "text": "وما من مجند يربك نفسه بشؤون الحياة إذا رغب في إرضاء من جنده.", "groups": [{"kw": "that warreth", "raw": "Deu_20:5-7; Luk_9:59-62", "note": "", "refs": [{"l": "Deu 20:5-7", "n": "", "vs": [[5, "ثم يقول القادة للجيش: هل بينكم من بنى بيتا جديدا ولم يدشنه بعد؟ فليرجع إلى بيته، لئلا يقتل في المعركة فيدشنه رجل آخر."], [6, "هل بينكم من غرس كرما ولم يجن أول ثماره بعد؟ فليرجع إلى بيته لئلا يقتل في المعركة فيجني أول ثمار كرمه رجل آخر."], [7, "هل بينكم رجل خطب امرأة ولم يتزوجها بعد؟ ليرجع إلى بيته لئلا يقتل في المعركة فيتزوجها رجل آخر."]]}, {"l": "Luk 9:59-62", "n": "", "vs": [[59, "وقال لغيره: «اتبعني!» ولكن هذا قال: «ياسيد، اسمح لي أن أذهب أولا وأدفن أبي!»"], [60, "فقال له يسوع: «دع الموتى يدفنون موتاهم، وأما أنت فاذهب وبشر بملكوت الله»."], [61, "وقال له آخر: «ياسيد، سأتبعك، ولكن اسمح لي أولا أن أودع أهل بيتي!»"], [62, "فقال له يسوع: «ما من أحد يضع يده على المحراث ويلتفت إلى الوراء، يصلح لملكوت الله»."]]}], "kwAr": "مجند", "noteAr": ""}, {"kw": "entangleth", "raw": "2Ti_4:10; Luk_8:14; 1Co_9:25, 1Co_9:26; 1Ti_6:9-12; 2Pe_2:20", "note": "", "refs": [{"l": "2Ti 4:10", "n": "", "vs": [[10, "لأن ديماس، إذ أحب الحياة الحاضرة، تركني وذهب إلى مدينة تسالونيكي. أما كريسكيس، فقد ذهب إلى مقاطعة غلاطية، وتيطس إلى دلماطية"]]}, {"l": "Luk 8:14", "n": "", "vs": [[14, "وما وقع حيث الأشواك هم الذين يسمعون ثم يمضون فتخنقهم هموم الحياة وغناها ولذاتها، فلا ينتجون ثمرا ناضجا."]]}, {"l": "1Co 9:25", "n": "", "vs": [[25, "وكل متبار يفرض على نفسه تدريبا صارما في شتى المجالات. فهؤلاء المتبارون يفعلون ذلك ليفوزوا بإكليل فان، وأما نحن فلنفوز بإكليل غير فان."]]}, {"l": "1Co 9:26", "n": "", "vs": [[26, "إذن، أنا أركض هكذا، لا كمن لا هدف له، وهكذا ألاكم أيضا، لا كمن يلطم الهواء،"]]}, {"l": "1Ti 6:9-12", "n": "", "vs": [[9, "أما الذين يرغبون في أن يصيروا أغنياء، فيسقطون في التجربة والفخ ويتورطون في كثير من الشهوات السفيهة المضرة التي تغرق الناس في الدمار والهلاك."], [10, "فإن حب المال أصل لكل شر؛ وإذ سعى بعضهم إليه، ضلوا عن الإيمان، وطعنوا أنفسهم بأوجاع كثيرة."], [11, "وأما أنت، ياإنسان الله، فاهرب من هذه الأمور، واسع في إثر البر والتقوى والإيمان والمحبة والصبر والوداعة."], [12, "أحسن الجهاد في معركة الإيمان الجميلة. تمسك بالحياة الأبدية، التي إليها قد دعيت، وقد اعترفت الاعتراف الحسن (بالإيمان) أمام شهود كثيرين."]]}, {"l": "2Pe 2:20", "n": "", "vs": [[20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."]]}], "kwAr": "يربك نفسه", "noteAr": ""}, {"kw": "that he", "raw": "1Co_7:22, 1Co_7:23; 2Co_5:9; 1Th_2:4", "note": "", "refs": [{"l": "1Co 7:22", "n": "", "vs": [[22, "فإن من دعي في الرب وهو عبد، صار معتقا للرب. وكذلك أيضا من دعي وهو حر، صار عبدا للمسيح."]]}, {"l": "1Co 7:23", "n": "", "vs": [[23, "قد اشتريتم بفدية، فلا تصيروا عبيدا للبشر."]]}, {"l": "2Co 5:9", "n": "", "vs": [[9, "ولذلك أيضا نحرص أن نرضيه، سواء أكنا مقيمين أم مغتربين."]]}, {"l": "1Th 2:4", "n": "", "vs": [[4, "بل إننا نتكلم كمن تبين من اختبار الله لهم أنهم أهل لأن يؤتمنوا على الإنجيل، لنرضي لا الناس بل الله الذي يختبر قلوبنا."]]}], "kwAr": "إرضاء من جنده", "noteAr": ""}], "arS": [["وما من ", []], ["مجند", ["G4754"]], [" ", []], ["يربك نفسه", ["G1707"]], [" ", []], ["بشؤون", ["G4230"]], [" ", []], ["الحياة", ["G979"]], [" إذا رغب في ", []], ["إرضاء", ["G700"]], [" من ", []], ["جنده", ["G4758"]], [".", []]]}, {"c": 2, "v": 5, "text": "كما أن المصارع لا يفوز بالإكليل إلا إذا صارع بحسب القوانين.", "groups": [{"kw": "strive", "raw": "Luk_13:24; 1Co_9:24-27; Phi_1:15; Col_1:29; Heb_12:4", "note": "", "refs": [{"l": "Luk 13:24", "n": "", "vs": [[24, "«ابذلوا الجهد للدخول من الباب الضيق، فإني أقول لكم إن كثيرين سيسعون إلى الدخول، فلا يتمكنون."]]}, {"l": "1Co 9:24-27", "n": "", "vs": [[24, "أما تعلمون أن المتبارين يركضون جميعا في الميدان ولكن واحدا منهم فقط يفوز بالجائزة؟ هكذا اركضوا أنتم حتى تفوزوا!"], [25, "وكل متبار يفرض على نفسه تدريبا صارما في شتى المجالات. فهؤلاء المتبارون يفعلون ذلك ليفوزوا بإكليل فان، وأما نحن فلنفوز بإكليل غير فان."], [26, "إذن، أنا أركض هكذا، لا كمن لا هدف له، وهكذا ألاكم أيضا، لا كمن يلطم الهواء،"], [27, "بل أسدد اللكمات إلى جسدي وأسوقه أسيرا، مخافة أن يتبين أني غير مؤهل (للمجازاة) بعدما دعوت الآخرين إليها!"]]}, {"l": "Phi 1:15", "n": "", "vs": [[15, "حقا أن بعضهم يبشرون بالمسيح عن حسد ونزاع؛ وأما الآخرون فعن حسن نية."]]}, {"l": "Col 1:29", "n": "", "vs": [[29, "ولأجل هذا أتعب أنا أيضا وأجاهد، بفضل قدرته العاملة في بقوة."]]}, {"l": "Heb 12:4", "n": "", "vs": [[4, "لم تقاوموا بعد حتى بذل الدم في مجاهدتكم ضد الخطيئة."]]}], "kwAr": "المصارع", "noteAr": ""}, {"kw": "is he", "raw": "2Ti_4:7, 2Ti_4:8; Heb_2:7, Heb_2:9; Jam_1:12; 1Pe_5:4; Rev_2:10, Rev_3:11, Rev_4:4, Rev_4:10", "note": "", "refs": [{"l": "2Ti 4:7", "n": "", "vs": [[7, "قد جاهدت الجهاد الحسن، قد بلغت نهاية الشوط، قد حافظت على الإيمان."]]}, {"l": "2Ti 4:8", "n": "", "vs": [[8, "إنما ينتظرني الآن إكليل البر المحفوظ لي، والذي سيهبه لي الرب الديان العادل في ذلك اليوم؛ ولن يوهب لي وحدي، بل أيضا لجميع الذين يحبون ظهوره."]]}, {"l": "Heb 2:7", "n": "", "vs": [[7, "جعلته أدنى من الملائكة إلى حين، ثم كللته بالمجد والكرامة، وأعطيته السلطة على كل ما صنعته يداك."]]}, {"l": "Heb 2:9", "n": "", "vs": [[9, "إلا أننا نرى يسوع الآن مكللا بالمجد والكرامة، لأنه قاسى الموت. وذلك بعدما صار أدنى من الملائكة إلى حين، ليذوق بنعمة الله الموت عوضا عن كل واحد."]]}, {"l": "Jam 1:12", "n": "", "vs": [[12, "طوبى لمن يتحمل المحنة بصبر. فإنه، بعد أن يجتاز الامتحان بنجاح، سينال «إكليل الحياة» الذي وعد به الرب محبيه!"]]}, {"l": "1Pe 5:4", "n": "", "vs": [[4, "وعندما يظهر رئيس الرعاة، تنالون إكليل المجد الذي لا يفنى."]]}, {"l": "Rev 2:10", "n": "", "vs": [[10, "دع عنك الخوف مما ينتظرك من آلام، فإن إبليس سيزج ببعضكم في السجن لكي تمتحنوا، فتقاسون الاضطهاد عشرة أيام. فابق أمينا حتى الموت، فأمنحك إكليل الحياة."]]}, {"l": "Rev 3:11", "n": "", "vs": [[11, "إني آت سريعا، فتمسك بما عندك، لئلا يسلب أحد إكليلك."]]}, {"l": "Rev 4:4", "n": "", "vs": [[4, "وقد أحاط بالعرش أربعة وعشرون عرشا يجلس عليها أربعة وعشرون شيخا يلبسون ثيابا بيضاء، وعلى رؤوسهم أكاليل من ذهب."]]}, {"l": "Rev 4:10", "n": "", "vs": [[10, "يجثو الشيوخ الأربعة والعشرون أمام الجالس على العرش ساجدين للحي إلى أبد الآبدين، ويلقون أكاليلهم أمام عرشه وهم يهتفون:"]]}], "kwAr": "لا يفوز بالإكليل", "noteAr": ""}], "arS": [["كما أن ", []], ["المصارع", ["G118"]], [" لا ", []], ["يفوز بالإكليل", ["G4737"]], [" إلا إذا ", []], ["صارع", ["G118"]], [" بحسب ", []], ["القوانين", ["G3545"]], [".", []]]}, {"c": 2, "v": 6, "text": "كذلك الفلاح الذي يشتغل بجد يجب أن يكون أول من ينال حصته من الغلة.", "groups": [{"kw": "husbandman", "raw": "Isa_28:24-26; Mat_9:37, Mat_9:38, Mat_20:1, Mat_21:33-41; Luk_10:2; Joh_4:35-38; 1Co_3:6-9, 1Co_9:7-11", "note": "", "refs": [{"l": "Isa 28:24-26", "n": "", "vs": [[24, "أيواظب الحارث على حرث أرضه وتتليمها وتمهيدها كل يوم؟"], [25, "أليس إذا سوى أرضها يبذر الشونيز ويذري الكمون وينثر الحنطة في أتلامها والشعير في مواضعه، والقطاني في أطرافها المحروثة؟"], [26, "لأنه قد تلقى المعرفة الصحيحة من إلهه."]]}, {"l": "Mat 9:37", "n": "", "vs": [[37, "عندئذ قال لتلاميذه: «الحصاد كثير، والعمال قليلون."]]}, {"l": "Mat 9:38", "n": "", "vs": [[38, "فاطلبوا من رب الحصاد أن يرسل عمالا إلى حصاده! »"]]}, {"l": "Mat 20:1", "n": "", "vs": [[1, "فإن ملكوت السماوات يشبه بإنسان رب بيت خرج في الصباح الباكر ليستأجر عمالا لكرمه،"]]}, {"l": "Mat 21:33-41", "n": "", "vs": [[33, "اسمعوا مثلا آخر: غرس إنسان رب بيت كرما، وأقام حوله سياجا، وحفر فيه معصرة، وبنى فيه برج حراسة. ثم سلم الكرم إلى مزارعين وسافر."], [34, "ولما حان أوان القطاف، أرسل عبيده إلى المزارعين ليتسلم ثمر الكرم."], [35, "فقبض المزارعون على العبيد، فضربوا أحدهم، وقتلوا غيره، ورجموا الآخر بالحجارة."], [36, "ثم أرسل رب البيت ثانية عبيدا آخرين أكثر عددا من الأولين. ففعل المزارعون بهؤلاء ما فعلوه بأولئك."], [37, "وأخيرا أرسل إليهم ابنه، قائلا: سيهابون ابني!"], [38, "فما إن رأى المزارعون الابن حتى قال بعضهم لبعض: هذا هو الوريث! تعالوا نقتله فنستولي على ميراثه."], [39, "ثم قبضوا عليه، وطرحوه خارج الكرم، وقتلوه!"], [40, "فعندما يعود رب الكرم، ماذا يفعل بأولئك المزارعين؟»"], [41, "أجابوه: «أولئك الأشرار، يهلكهم شر هلاك. ثم يسلم الكرم إلى مزارعين آخرين يؤدون له الثمر في أوانه»."]]}, {"l": "Luk 10:2", "n": "", "vs": [[2, "وقال لهم: «إن الحصاد كثير، ولكن العمال قليلون، فتضرعوا إلى رب الحصاد أن يبعث عمالا إلى حصاده."]]}, {"l": "Joh 4:35-38", "n": "", "vs": [[35, "أما تقولون: بعد أربعة أشهر يأتي الحصاد! ولكني أقول لكم: انظروا مليا إلى الحقول، فهي قد نضجت وحان حصادها."], [36, "والحاصد يأخذ أجرته، ويجمع الثمر للحياة الأبدية، فيفرح الزارع والحاصد معا،"], [37, "حتى يصدق القول: واحد يزرع، وآخر يحصد."], [38, "إني أرسلتكم لتحصدوا ما لم تتعبوا فيه، فغيركم تعبوا، وأنتم تجنون ثمر أتعابهم»."]]}, {"l": "1Co 3:6-9", "n": "", "vs": [[6, "أنا غرست وأبلوس سقى؛ ولكن الله أنمى."], [7, "فليس الغارس شيئا ولا الساقي، بل الله الذي يعطي النمو."], [8, "فالغارس والساقي سواء. إلا أن كلا منهما سينال أجرته بالنسبة إلى تعبه."], [9, "فإننا نحن جميعا عاملون معا عند الله، وأنتم حقل الله وبناء الله."]]}, {"l": "1Co 9:7-11", "n": "", "vs": [[7, "أي جندي يذهب إلى الحرب على نفقته الخاصة؟ وأي مزارع يغرس كرما ولا يأكل من ثماره؟ أم أي راع يرعى قطيعا ولا يأكل من لبن القطيع؟"], [8, "أتظنون أني أتكلم بهذا بمنطق البشر؟ أو ما توصي الشريعة به؟"], [9, "فإنه مكتوب في شريعة موسى: «لا تضع كمامة على فم الثور وهو يدرس الحنطة». ترى، هل تهم الله الثيران،"], [10, "أم يقول ذلك كله من أجلنا؟ نعم، فمن أجلنا قد كتب ذلك، لأنه من حق الفلاح أن يفلح برجاء، والدراس أن يدرس برجاء، على أمل الاشتراك في الغلة."], [11, "وما دمنا نحن قد زرعنا لكم الأمور الروحية، فهل يكون كثيرا علينا أن نحصد منكم الأمور المادية؟"]]}], "kwAr": "الفلاح", "noteAr": ""}, {"kw": "that laboureth must be first partaker of the fruits", "raw": "or, labouring first, must be partaker of the fruits, 1Co_9:23; Heb_10:36", "note": "or, labouring first, must be partaker of the fruits, 1Co_9:23; Heb_10:36", "refs": [{"l": "1Co 9:23", "n": "", "vs": [[23, "وإني أفعل الأمور كلها من أجل الإنجيل، لأكون شريكا فيه مع الآخرين."]]}, {"l": "Heb 10:36", "n": "", "vs": [[36, "إنكم تحتاجون إلى الصبر لتعملوا إرادة الله، فتنالوا البركة التي وعدتم بها."]]}], "kwAr": "الذي يشتغل بجد", "noteAr": "أو: الفلاح الذي يتعب يجب أن يكون أول من يشترك في الثمار."}], "arS": [["كذلك ", []], ["الفلاح", ["G1092"]], [" الذي ", []], ["يشتغل بجد", ["G2872"]], [" ", []], ["يجب", ["G1163"]], [" أن يكون ", []], ["أول", ["G4413"]], [" من ", []], ["ينال", ["G3335"]], [" حصته من ", []], ["الغلة", ["G2590"]], [".", []]]}, {"c": 2, "v": 7, "text": "فكر في ما أقوله، فإن الرب سيهبك فهما في كل شيء.", "groups": [{"kw": "Consider", "raw": "Deu_4:39, Deu_32:29; Psa_64:9; Pro_24:32; Isa_1:3, Isa_5:12; Luk_9:44; Phi_4:8; 1Ti_4:15; Heb_3:1, Heb_7:4, Heb_12:3, Heb_13:7", "note": "", "refs": [{"l": "Deu 4:39", "n": "", "vs": [[39, "فاعترفوا اليوم ورددوا في قلوبكم قائلين: إن الرب هو الإله في السماء من فوق، وعلى الأرض من تحت وليس إله سواه."]]}, {"l": "Deu 32:29", "n": "", "vs": [[29, "لو عقلوا لفطنوا لمآلهم وتأملوا في مصيرهم،"]]}, {"l": "Psa 64:9", "n": "", "vs": [[9, "فيخاف جميع البشر ويذيعون ما فعله الله ، معتبرين بصنائعه."]]}, {"l": "Pro 24:32", "n": "", "vs": [[32, "فاعتبر قلبي بما شاهدت، وتلقنت درسا مما رأيت."]]}, {"l": "Isa 1:3", "n": "", "vs": [[3, "الثور يعرف قانيه، والحمار معلف صاحبه، أما إسرائيل فلا يعرف، وشعبي لا يدرك."]]}, {"l": "Isa 5:12", "n": "", "vs": [[12, "يتلهون في مآدبهم بالعود والرباب والدف والناي والخمر، غير مكترثين لأعمال الرب ولا ناظرين إلى صنع يديه،"]]}, {"l": "Luk 9:44", "n": "", "vs": [[44, "«لتدخل هذه الكلمات آذانكم: إن ابن الإنسان على وشك أن يسلم إلى أيدي الناس!»"]]}, {"l": "Phi 4:8", "n": "", "vs": [[8, "وختاما، أيها الإخوة: كل ما كان حقا، وكل ما كان شريفا، وكل ما كان عادلا، وكل ما كان طاهرا وكل ما كان مستحبا، وكل ما كان حسن السمعة، وكل ما كان فيه فضيلة وخصلة حميدة، فاشغلوا أفكاركم به."]]}, {"l": "1Ti 4:15", "n": "", "vs": [[15, "انصرف إلى هذه الأمور، وانشغل بها كليا، ليكون تقدمك واضحا للجميع."]]}, {"l": "Heb 3:1", "n": "", "vs": [[1, "إذن، أيها الإخوة القديسون الذين اشتركتم في الدعوة السماوية، تأملوا يسوع: الرسول ورئيس الكهنة في الإيمان الذي نتمسك به."]]}, {"l": "Heb 7:4", "n": "", "vs": [[4, "لنتأمل الآن كم كان هذا الشخص عظيما. فحتى إبراهيم، جدنا الأكبر، أدى له عشرا من غنائمه."]]}, {"l": "Heb 12:3", "n": "", "vs": [[3, "فتأملوا مليا ما قاساه بتحمله تلك المعاملة العنيفة التي عامله بها الخاطئون، لكي لا تتعبوا وتنهاروا!"]]}, {"l": "Heb 13:7", "n": "", "vs": [[7, "اذكروا دائما مرشديكم الذين علموكم كلام الله. تأملوا سيرتهم حتى النهاية، واقتدوا بإيمانهم."]]}], "kwAr": "فكر في ما أقوله", "noteAr": ""}, {"kw": "and", "raw": "Gen_41:38, Gen_41:39; Exo_36:1, Exo_36:2; Num_27:16, Num_27:17; 1Ch_22:12, 1Ch_29:19; 2Ch_1:8-12; Psa_119:73, Psa_119:125, Psa_119:144, Psa_143:8, Psa_143:9; Pro_2:3-6; Isa_28:26; Dan_1:17; Luk_21:15; Luk_24:45; Joh_14:26, Joh_16:13; Act_7:10; 1Co_12:8; Eph_1:17, Eph_1:18; Col_1:9; Jam_1:5, Jam_3:15, Jam_3:17; 1Jo_5:20", "note": "", "refs": [{"l": "Gen 41:38", "n": "", "vs": [[38, "وقال فرعون لعبيده: «هل نجد نظير هذا رجلا فيه روح الله؟»"]]}, {"l": "Gen 41:39", "n": "", "vs": [[39, "ثم قال فرعون ليوسف: «من حيث أن الله قد أطلعك على كل هذا، فليس هناك بصير وحكيم نظيرك."]]}, {"l": "Exo 36:1", "n": "", "vs": [[1, "وهكذا يقوم بصلئيل وأهوليآب وكل صانع حاذق وهبه الرب مقدرة في تنفيذ بناء خيمة الاجتماع، بإنجاز العمل، بحسب كل ما أمر به الرب."]]}, {"l": "Exo 36:2", "n": "", "vs": [[2, "ثم استدعى موسى بصلئيل وأهوليآب وكل صانع ماهر وهبه الرب حذاقة، وكل من حثه قلبه على المساهمة في إنجاز عمل ما."]]}, {"l": "Num 27:16", "n": "", "vs": [[16, "«ليقم الرب، إله أرواح جميع الناس، قائدا للشعب،"]]}, {"l": "Num 27:17", "n": "", "vs": [[17, "يخرج ويدخل أمامهم، يقودهم ويرجعهم لئلا تصبح جماعة الرب كغنم لا راعي لها»."]]}, {"l": "1Ch 22:12", "n": "", "vs": [[12, "وليمنحك الرب فطنة ومعرفة عندما يوليك على إسرائيل لتطيع شريعة الرب إلهك،"]]}, {"l": "1Ch 29:19", "n": "", "vs": [[19, "أما سليمان ابني، فهبه قلبا كاملا ليطيع وصاياك وشهاداتك وفرائضك، ويعمل بها كلها وليبني الهيكل الذي أعددت له»."]]}, {"l": "2Ch 1:8-12", "n": "", "vs": [[8, "فأجاب سليمان: «لقد أسديت إلى أبي إحسانا عظيما وجعلتني ملكا خلفا له."], [9, "فالآن أيها الرب الإله ليتم وعدك الذي وعدت به أبي داود، لأنك وليتني حكم شعب كثير كتراب الأرض."], [10, "فهبني حكمة ومعرفة لأقود هذا الشعب، لأنه من يستطيع أن يحكم شعبك العظيم هذا؟»"], [11, "فقال الله لسليمان: «من أجل أنك قد عزمت في قلبك على طلب هذا الأمر، ولم تنشد غنى، ولا أموالا، ولا عظمة، ولا الانتقام من أعدائك، ولم تطلب حياة طويلة، بل سألت لنفسك حكمة ومعرفة لتحكم بهما شعبي الذي ملكتك عليه،"], [12, "فإنني أهبك حكمة ومعرفة، وأنعم عليك بالغنى والمال والعظمة، بحيث لا يضاهيك فيها أحد من الملوك السابقين ولا اللاحقين»."]]}, {"l": "Psa 119:73", "n": "", "vs": [[73, "يداك صنعتاني وكونتاني، فهبني فهما لأتعلم وصاياك."]]}, {"l": "Psa 119:125", "n": "", "vs": [[125, "عبدك أنا، فهبني فهما لأعرف شهاداتك."]]}, {"l": "Psa 119:144", "n": "", "vs": [[144, "شهاداتك عدل إلى الأبد. فهمني إياها فأحيا."]]}, {"l": "Psa 143:8", "n": "", "vs": [[8, "أسمعني في الصباح رحمتك، فإني عليك توكلت. عرفني الطريق التي أسلكها، لأني إليك رفعت نفسي."]]}, {"l": "Psa 143:9", "n": "", "vs": [[9, "أنقذني من أعدائي يارب، لأنني بك استعذت."]]}, {"l": "Pro 2:3-6", "n": "", "vs": [[3, "وإن نشدت الفطنة، وهتفت داعيا الفهم."], [4, "إن التمسته كما تلتمس الفضة، وبحثت عنه كما يبحث عن الكنوز الدفينة،"], [5, "عندئذ تدرك مخافة الرب وتعثر على معرفة الله،"], [6, "لأن الرب يهب الحكمة، ومن فمه تتدفق المعرفة والفهم."]]}, {"l": "Isa 28:26", "n": "", "vs": [[26, "لأنه قد تلقى المعرفة الصحيحة من إلهه."]]}, {"l": "Dan 1:17", "n": "", "vs": [[17, "ووهب الله أولئك الفتيان الأربعة معرفة وعقلا في كل ضروب الكتابة والعلم. وكان دانيآل فطنا في تفسير جميع الرؤى والأحلام."]]}, {"l": "Luk 21:15", "n": "", "vs": [[15, "لأني سوف أعطيكم كلاما وحكمة لا يقدر جميع مقاوميكم أن يردو ], [" ", []], ["فهما", ["G4907"]], [" في ", []], ["كل", ["G3956"]], [" شيء.", []]]}, {"c": 2, "v": 8, "text": "اذكر يسوع المسيح الذي أقيم من الموت، وهو من نسل داود، كما أعلنه في إنجيلي", "groups": [{"kw": "Remember", "raw": "Heb_12:2, Heb_12:3", "note": "", "refs": [{"l": "Heb 12:2", "n": "", "vs": [[2, "متطلعين دائما إلى يسوع: رائد إيماننا ومكمله. فهو قد تحمل الموت صلبا، هازئا بما في ذلك من عار، إذ كان ينظر إلى السرور الذي ينتظره، ثم جلس عن يمين عرش الله."]]}, {"l": "Heb 12:3", "n": "", "vs": [[3, "فتأملوا مليا ما قاساه بتحمله تلك المعاملة العنيفة التي عامله بها الخاطئون، لكي لا تتعبوا وتنهاروا!"]]}], "kwAr": "اذكر", "noteAr": ""}, {"kw": "Jesus", "raw": "Mat_1:1; Act_2:30, Act_13:23; Rom_1:3, Rom_1:4; Rev_5:5", "note": "", "refs": [{"l": "Mat 1:1", "n": "", "vs": [[1, "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"]]}, {"l": "Act 2:30", "n": "", "vs": [[30, "لأن داود كان نبيا، وعارفا أن الله أقسم له يمينا بأن يجيء المسيح من نسله ويجلس على عرشه،"]]}, {"l": "Act 13:23", "n": "", "vs": [[23, "وقد بعث الله إلى إسرائيل من نسل داود مخلصا هو يسوع، إتماما لوعده."]]}, {"l": "Rom 1:3", "n": "", "vs": [[3, "وهو يختص بابنه الذي جاء من نسل داود من الناحية البشرية؛"]]}, {"l": "Rom 1:4", "n": "", "vs": [[4, "ومن ناحية روح القداسة، تبين بقوة أنه ابن الله بالقيامة من بين الأموات. إنه يسوع المسيح ربنا"]]}, {"l": "Rev 5:5", "n": "", "vs": [[5, "ولكن شيخا من الشيوخ قال لي: «لا تبك! قد انتصر الأسد الذي من سبط يهوذا، الذي هو أصل داود، وهو المستحق أن يفتح الكتاب ويفك ختومه السبعة»."]]}], "kwAr": "يسوع المسيح", "noteAr": ""}, {"kw": "raised", "raw": "Luk_24:46; Act_2:24; 1Co_15:1, 1Co_15:4, 1Co_15:11-20", "note": "", "refs": [{"l": "Luk 24:46", "n": "", "vs": [[46, "وقال لهم: «هكذا قد كتب، وهكذا كان لابد أن يتألم المسيح ويقوم من بين الأموات في اليوم الثالث،"]]}, {"l": "Act 2:24", "n": "", "vs": [[24, "ولكن الله أقامه من بين الأموات ناقضا أوجاع الموت، فما كان يمكن للموت أن يبقيه في قبضته!"]]}, {"l": "1Co 15:1", "n": "", "vs": [[1, "على أني أذكركم، أيها الإخوة بالإنجيل الذي بشرتكم به، وقبل وز على مرضاة الرب."]]}, {"l": "Joh 17:24", "n": "", "vs": [[24, "أيها الآب، أريد لهؤلاء الذين وهبتهم لي أن يكونوا معي حيث أكون أنا، فيشاهدوا مجدي الذي أعطيتني، لأنك أحببتني قبل إنشاء العالم."]]}, {"l": "1Th 5:9", "n": "", "vs": [[9, "فإن الله عيننا لا لينزل علينا الغضب بل لننال الخلاص بربنا يسوع المسيح،"]]}, {"l": "1Ti 1:13", "n": "", "vs": [[13, "مع أني كنت في الماضي مجدفا عليه، ومضطهدا ومهينا له! ولكني عوملت بالرحمة، لأني عملت ما عملته عن جهل وفي عدم إيمان."]]}, {"l": "1Ti 1:14", "n": "", "vs": [[14, "إلا أن نعمة ربنا قد فاضت علي فوق كل حد، ومعها الإيمان والمحبة، وذلك في المسيح يسوع."]]}, {"l": "1Pe 2:10", "n": "", "vs": [[10, "فإنكم في الماضي لم تكونوا شعبا؛ أما الآن، فأنتم «شعب الله وقد كنتم سابقا لا تتمتعون برحمة الله، أما الآن، فإنكم تتمتعون بها!»"]]}], "kwAr": "يحصلوا على الخلاص", "noteAr": ""}, {"kw": "with", "raw": "Rom_2:7, Rom_9:23; 2Co_4:17; Col_1:27; 2Th_2:14; 1Pe_5:10", "note": "", "refs": [{"l": "Rom 2:7", "n": "", "vs": [[7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"]]}, {"l": "Rom 9:23", "n": "", "vs": [[23, "وذلك بقصد أن يعلن غنى مجده في أوعية الرحمة التي سبق فأعدها للمجد،"]]}, {"l": "2Co 4:17", "n": "", "vs": [[17, "ذلك لأن ما يضايقنا الآن من صعوبات بسيطة عابرة، ينتج لنا بمقدار لا يحد وزنة أبدية من المجد،"]]}, {"l": "Col 1:27", "n": "", "vs": [[27, "الذين أراد الله أن يعلن لهم كم هو غني مجد هذا السر بين الأمم: إنه المسيح فيكم، وهو رجاء المجد؛"]]}, {"l": "2Th 2:14", "n": "", "vs": [[14, "فإلى هذا الأمر قد دعاكم ببشارتنا لكم، لنوال مجد ربنا يسوع المسيح."]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}], "kwAr": "مع المجد الأبدي", "noteAr": ""}], "arS": [["لهذا السبب", ["G1223", "G5124"]], [" ", []], ["أحتمل", ["G5278"]], [" ", []], ["كل شيء", ["G3956"]], [" بصبر لأجل الذين ", []], ["اختارهم", ["G1588"]], [" الله ، لكي ", []], ["يحصلوا", ["G5177"]], ["، هم أيضا، على ", []], ["الخلاص", ["G4991"]], [" الذي في ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [" مع ", []], ["المجد", ["G1391"]], [" ", []], ["الأبدي", ["G166"]], [".", []]]}, {"c": 2, "v": 11, "text": "وما أصدق القول: «إن كنا قد متنا معه، فسوف نحيا أيضا معه؛", "groups": [{"kw": "faithful", "raw": "1Ti_1:15, 1Ti_3:1; Tit_3:8", "note": "", "refs": [{"l": "1Ti 1:15", "n": "", "vs": [[15, "ما أصدق هذا القول، وما أجدره بالتصديق الكلي: إن المسيح يسوع قد جاء إلى العالم ليخلص الخاطئين، وأنا أولهم!"]]}, {"l": "1Ti 3:1", "n": "", "vs": [[1, "ما أصدق القول إن من يرغب في الرعاية فإنما يتوق إلى عمل صالح."]]}, {"l": "Tit 3:8", "n": "", "vs": [[8, "صادق هذا القول! وأريد أن تقرر هذه الأمور قرارا حاسما، حتى يهتم الذين آمنوا بالله بأن يجتهدوا في الأعمال الصالحة. هذه الأمور حسنة ونافعة للناس."]]}], "kwAr": "وما أصدق القول", "noteAr": ""}, {"kw": "For", "raw": "Rom_6:5, Rom_6:8; 2Co_4:10; Gal_2:19, Gal_2:20; Col_3:3, Col_3:4", "note": "", "refs": [{"l": "Rom 6:5", "n": "", "vs": [[5, "فما دمنا قد اتحدنا به في ما يشبه موته، فإننا سنتحد به أيضا في قيامته."]]}, {"l": "Rom 6:8", "n": "", "vs": [[8, "ومادمنا متنا مع المسيح، فنحن نؤمن أننا سنحيا أيضا معه،"]]}, {"l": "2Co 4:10", "n": "", "vs": [[10, "وحيثما ذهبنا، نحمل موت يسوع دائما في أجسادنا لتظهر فيها أيضا حياة يسوع."]]}, {"l": "Gal 2:19", "n": "", "vs": [[19, "فإنني، بالشريعة، قد مت عن الشريعة، لكي أحيا لله."]]}, {"l": "Gal 2:20", "n": "", "vs": [[20, "مع المسيح صلبت، وفيما بعد لا أحيا أنا بل المسيح يحيا في. أما الحياة التي أحياها الآن في الجسد، فإنما أحياها بالإيمان في ابن الله، الذي أحبني وبذل نفسه عني."]]}, {"l": "Col 3:3", "n": "", "vs": [[3, "فإنكم قد متم، وحياتكم مستورة مع المسيح في الله."]]}, {"l": "Col 3:4", "n": "", "vs": [[4, "فعندما يظهر المسيح، وهو حياتنا، عندئذ تظهرون أنتم أيضا معه في المجد."]]}], "kwAr": "إن كنا قد متنا معه", "noteAr": ""}, {"kw": "we shall", "raw": "Joh_14:19; 2Co_13:4; 1Th_4:17, 1Th_5:10", "note": "", "refs": [{"l": "Joh 14:19", "n": "", "vs": [[19, "بعد قليل لا يراني العالم. أما أنتم فسوف ترونني. ولأني أنا حي، فأنتم أيضا ستحيون."]]}, {"l": "2Co 13:4", "n": "", "vs": [[4, "فمع أنه قد صلب في ضعف، فهو الآن حي بقدرة الله. ونحن أيضا ضعفاء فيه، ولكننا، بتصرفنا معكم، سنكون أحياء معه بقدرة الله."]]}, {"l": "1Th 4:17", "n": "", "vs": [[17, "ثم إننا، نحن الباقين أحياء، نختطف جميعا في السحب للاجتماع بالرب في الهواء. وهكذا نبقى مع الرب على الدوام."]]}, {"l": "1Th 5:10", "n": "", "vs": [[10, "الذي مات عنا لكي نحيا جميعا معه، سواء كنا في سهر الحياة أم في رقاد الموت!"]]}], "kwAr": "فسوف نحيا", "noteAr": ""}], "arS": [["وما ", []], ["أصدق", ["G4103"]], [" ", []], ["القول", ["G3056"]], [": «إن كنا قد ", []], ["متنا معه", ["G4880"]], ["، فسوف ", []], ["نحيا", ["G4800"]], [" أيضا معه؛", []]]}, {"c": 2, "v": 12, "text": "إن تحملنا الآلام، فسوف نملك أيضا معه؛ إن أنكرناه، فسوف ينكرنا أيضا؛", "groups": [{"kw": "we suffer", "raw": "Mat_19:28, Mat_19:29; Act_14:22; Rom_8:17; Phi_1:28; 2Th_1:4-8; 1Pe_4:13-16; Rev_1:6, Rev_1:9, Rev_5:10, Rev_20:4, Rev_20:6", "note": "", "refs": [{"l": "Mat 19:28", "n": "", "vs": [[28, "فأجابهم يسوع: «الحق أقول لكم: إنه عندما يجلس ابن الإنسان على عرش مجده في زمن التجديد، تجلسون أنتم الذين تبعتموني على اثني عشر عرشا لتدينوا أسباط إسرائيل الاثني عشر."]]}, {"l": "Mat 19:29", "n": "", "vs": [[29, "فأي من ترك بيوتا أو إخوة أو أخوات أو أبا أو أما أو أولادا أو أراضي من أجل اسمي، ينال مئة ضعف ويرث الحياة الأبدية."]]}, {"l": "Act 14:22", "n": "", "vs": [[22, "وفي هذه الأماكن كلها كانا يشددان عزيمة التلاميذ، ويحثانهم على الثبات في الإيمان، مؤكدين لهم أن دخول ملكوت الله يقتضي أن نقاسي صعوبات كثيرة."]]}, {"l": "Rom 8:17", "n": "", "vs": [[17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}, {"l": "Phi 1:28", "n": "", "vs": [[28, "غير مرتعبين في شيء من الذين يقاومونكم، فإن في مقاومتهم دليلا على هلاكهم هم وعلى خلاصكم أنتم، وذلك من عند الله."]]}, {"l": "2Th 1:4-8", "n": "", "vs": [[4, "حتى إننا، نحن أنفسنا، نفتخر بكم في كنائس الله بسبب ثباتكم وإيمانكم في وسط كل ما تحتملونه من اضطهادات وضيقات."], [5, "وفي هذا دليل على حكم الله العادل، بقصد أن تعتبروا مؤهلين لملكوت الله الذي من أجله تلاقون الآلام."], [6, "فمن العدل عند الله حقا أن يجازي بالضيقة أولئك الذين يضايقونكم،"], [7, "وأن يكافئكم، أنتم الذين تتضايقون، كما يكافئنا نحن، بالراحة لدى ظهور الرب يسوع علنا من السماء، ومعه ملائكة قدرته،"], [8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."]]}, {"l": "1Pe 4:13-16", "n": "", "vs": [[13, "وإنما افرحوا: لأنكم كما تشاركون المسيح في الآلام الآن، لابد أن تفرحوا بمشاركته في الابتهاج عند ظهور مجده."], [14, "فإذا لحقتكم الإهانة لأنكم تحملون اسم المسيح، فطوبى لكم! لأن روح المجد، أي روح الله، يستقر عليكم."], [15, "لا يكن بينكم من يتأ لم عقابا على شر ارتكبه: كالقتل أو السرقة، أو غيرهما من الجرائم، أو التدخل في شؤون الآخرين."], [16, "ولكن إن تألم أحدكم لأنه «مسيحي»، فعليه ألا يخجل، بل أن يمجد الله لأجل هذا الاسم!"]]}, {"l": "Rev 1:6", "n": "", "vs": [[6, "وجعل منا مملكة، وكهنة لله أبيه، له المجد والسلطان إلى أبد الآبدين. آمين!"]]}, {"l": "Rev 1:9", "n": "", "vs": [[9, "أنا، يوحنا أخاكم وشريككم في الضيقة والملكوت والصبر في يسوع، كنت منفيا في الجزيرة التي تسمى بطمس، لأجل كلمة الله وشهادة يسوع."]]}, {"l": "Rev 5:10", "n": "", "vs": [[10, "وجعلتهم مملكة لإلهنا وكهنة له، وسيملكون على الأرض»."]]}, {"l": "Rev 20:4", "n": "", "vs": [[4, "ثم رأيت عروشا منح الجالسون عليها حق القضاء. ورأيت نفوس الذين قتلوا في سبيل الشهادة ليسوع وفي سبيل كلمة الله، والذين رفضوا أن يسجدوا للوحش ولتمثاله، والذين رفضوا علامته على أيديهم وجباههم، وقد عادوا إلى الحياة، وملكوا مع المسيح ألف سنة."]]}, {"l": "Rev 20:6", "n": "", "vs": [[6, "ما أسعد وأقدس من كان لهم نصيب في القيامة الأولى! لن يكون للموت الثاني سلطة عليهم، بل يكونون كهنة لله والمسيح، ويملكون معه ألف سنة."]]}], "kwAr": "إن تحملنا الآلام", "noteAr": ""}, {"kw": "if we deny", "raw": "Pro_30:9; Mat_10:33, Mat_26:35, Mat_26:75; Mar_8:38, Mar_10:33; Luk_9:26, Luk_12:9; 1Jo_2:22; 1Jo_2:23; Jud_1:4; Rev_2:13, Rev_3:8", "note": "", "refs": [{"l": "Pro 30:9", "n": "", "vs": [[9, "لئلا أشبع فأجحدك قائلا: من هو الرب؟ أو أفتقر فأسرق وألطخ اسم إلهي بالعار."]]}, {"l": "Mat 10:33", "n": "", "vs": [[33, "وكل من ينكرني أمام الناس، أنكره أنا أيضا أمام أبي الذي في السماوات."]]}, {"l": "Mat 26:35", "n": "", "vs": [[35, "فقال بطرس: «ولو كان علي أن أموت معك، لا أنكرك أبدا!» وقال التلاميذ كلهم مثل هذا القول."]]}, {"l": "Mat 26:75", "n": "", "vs": [[75, "فتذكر بطرس كلمة يسوع إذ قال له: «قبل أن يصيح الديك تكون قد أنكرتني ثلاث مرات». فخرج إلى الخارج، وبكى بكاء مرا."]]}, {"l": "Mar 8:38", "n": "", "vs": [[38, "فإن أي من يستحي بي وبكلامي في هذا الجيل الفاسق الخاطيء، به يستحي ابن الإنسان عندما يعود في مجد أبيه مع الملائكة المقدسين»."]]}, {"l": "Mar 10:33", "n": "", "vs": [[33, "«ها نحن صاعدون إلى أورشليم، وسوف يسلم ابن الإنسان إلى رؤساء الكهنة وإلى الكتبة، فيحكمون عليه بالموت، ويسلمونه إلى أيدي الأمم،"]]}, {"l": "Luk 9:26", "n": "", "vs": [[26, "فإن من يستحي بي وبكلامي، فبه يستحي ابن الإنسان لدى عودته في مجده ومجد الآب والملائكة المقدسين."]]}, {"l": "Luk 12:9", "n": "", "vs": [[9, "ومن أنكرني أمام الناس، ينكر أمام ملائكة الله."]]}, {"l": "1Jo 2:22", "n": "", "vs": [[22, "ومن هو الكذاب؟ إنه الذي ينكر أن يسوع هو المسيح حقا. إنه ضد للمسيح ينكر الآب والابن معا."]]}, {"l": "1Jo 2:23", "n": "", "vs": [[23, "وكل من ينكر الابن، لا يكون الآب أيضا من نصيبه. ومن يعترف بالابن، فله الآب أيضا."]]}, {"l": "Jud 1:4", "n": "", "vs": [[4, "لأنه قد تسلل إلى ما بينكم معلمون لابد أن يلاقوا الحكم بالعقاب الأبدي، كما هو مكتوب لهم منذ القديم. فهم أشرار لا يهابون الله ، يتخذون من نعمة إلهنا فرصة لإباحة الرذائل، وينكرون سيدنا وربنا الوحيد يسوع المسيح."]]}, {"l": "Rev 2:13", "n": "", "vs": [[13, "إني أعلم أين تسكن، حيث عرش الشيطان! ورغم ذلك تمسكت باسمي، ورفضت أن تنكر الإيمان بي، حتى في أيام أنتيباس شهيدي الأمين، الذي قتل عندكم حيث يسكن الشيطان!"]]}, {"l": "Rev 3:8", "n": "", "vs": [[8, "إني عالم بأعمالك. فمع أن لك قوة ضئيلة، فقد أطعت كلمتي ولم تنكر اسمي، ولذلك فتحت لك بابا لا يقدر أحد أن يغلقه."]]}], "kwAr": "إن أنكرناه", "noteAr": ""}], "arS": [["إن ", []], ["تحملنا", ["G5278"]], [" الآلام، فسوف ", []], ["نملك", ["G4821"]], [" أيضا معه؛ إن ", []], ["أنكرناه", ["G720"]], ["، فسوف ", []], ["ينكرنا", ["G720"]], [" أيضا؛", []]]}, {"c": 2, "v": 13, "text": "إن تخلينا عن أمانتنا، فهو يبقى على أمانته، إذ لا يمكن أن يتنكر لذاته!»", "groups": [{"kw": "yet", "raw": "Isa_25:1; Mat_24:35; Rom_3:3, Rom_9:6; 1Th_5:24; 2Th_3:3", "note": "", "refs": [{"l": "Isa 25:1", "n": "", "vs": [[1, "يارب أنت إلهي، أعظمك وأحمد اسمك لأنك صنعت عجائب كنت قد قضيت بها منذ القدم، وهي حق وصدق."]]}, {"l": "Mat 24:35", "n": "", "vs": [[35, "إن السماء والأرض تزولان؛ ولكن كلامي لا يزول أبدا."]]}, {"l": "Rom 3:3", "n": "", "vs": [[3, "فماذا يحدث؟ إن كان بعضهم قد أساءوا الأمانة، فهل يعطل عدم أمانتهم أمانة الله؟"]]}, {"l": "Rom 9:6", "n": "", "vs": [[6, "لست أعني أن كلمة الله قد خابت. إذ ليس جميع بني إسرائيل هم إسرائيل؛"]]}, {"l": "1Th 5:24", "n": "", "vs": [[24, "فإن الله الذي يدعوكم صادق، وسوف يتم ذلك."]]}, {"l": "2Th 3:3", "n": "", "vs": [[3, "إلا أن الرب جدير بالثقة؛ فهو سيثبتكم ويحميكم من الشر."]]}], "kwAr": "فهو يبقى على أمانته", "noteAr": ""}, {"kw": "he cannot", "raw": "Num_23:19; Tit_1:2; Heb_6:18", "note": "", "refs": [{"l": "Num 23:19", "n": "", "vs": [[19, "ليس الله إنسانا فيكذب. ولا هو ابن آدم فيندم. هل يقول ولا يفعل أو يعد ولا يفي؟"]]}, {"l": "Tit 1:2", "n": "", "vs": [[2, "في رجاء الحياة الأبدية، التي وعد بها الله المنزه عن الكذب، من قبل أزمنة الأزل،"]]}, {"l": "Heb 6:18", "n": "", "vs": [[18, "فاستنادا إلى وعد الله وقسمه، وهما أمران ثابتان لا يتغيران ويستحيل أن يكذب الله فيهما، نحصل على تشجيع قوي، بعدما التجأنا إلى التمسك بالرجاء الموضوع أمامنا."]]}], "kwAr": "لا يمكن أن يتنكر لذاته", "noteAr": ""}], "arS": [["إن ", []], ["تخلينا عن أمانتنا", ["G569"]], ["، فهو ", []], ["يبقى", ["G3306"]], [" على ", []], ["أمانته", ["G4103"]], ["، إذ لا ", []], ["يمكن", ["G1410"]], [" أن ", []], ["يتنكر", ["G720"]], [" ", []], ["لذاته", ["G1438"]], ["!»", []]]}, {"c": 2, "v": 14, "text": "بهذه الأمور ذكر، شاهدا في حضرة الله أن لا تنشأ المجادلات الكلامية، وهي لا تنفع شيئا، غير تخريب سامعيها.", "groups": [{"kw": "put", "raw": "2Ti_1:6; 2Pe_1:13", "note": "", "refs": [{"l": "2Ti 1:6", "n": "", "vs": [[6, "لهذا السبب أنبهك أن تلهب نار موهبة الله التي فيك بوضع يدي عليك."]]}, {"l": "2Pe 1:13", "n": "", "vs": [[13, "فمادمت في خيمة جسمي هذه، أرى من واجبي أن أنبهكم مذكرا."]]}], "kwAr": "ذكر", "noteAr": ""}, {"kw": "charging", "raw": "2Ti_4:1; Eph_4:17; 1Th_4:1; 2Th_3:6; 1Ti_5:21, 1Ti_6:13", "note": "", "refs": [{"l": "2Ti 4:1", "n": "", "vs": [[1, "أطلب منك في حضرة الله والمسيح الذي سيدين الأحياء والأموات، بعودته العلنية وملكوته،"]]}, {"l": "Eph 4:17", "n": "", "vs": [[17, "أقول هذا إذن، وأشهد في الرب، راجيا ألا تسلكوا فيما بعد كما يسلك الأمم في عقم ذهنهم،"]]}, {"l": "1Th 4:1", "n": "", "vs": [[1, "وبعد، أيها الإخوة، فمثلما تلقيتم منا كيف يجب أن تسلكوا سلوكا يرضي الله ، وكما أنتم فاعلون، نرجو منكم ونحرضكم في الرب يسوع أن تضاعفوا تقدمكم في ذلك أكثر فأكثر."]]}, {"l": "2Th 3:6", "n": "", "vs": [[6, "ثم نوصيكم، أيها الإخوة، باسم ربنا يسوع المسيح، أن تعتزلوا عن كل أخ يسلك سلوكا فوضويا، لا يوافق التعليم الذي تلقيتم منا."]]}, {"l": "1Ti 5:21", "n": "", "vs": [[21, "أطلب منك أمام الله والمسيح والملائكة المختارين أن تعمل بهذه التوصيات دون مراعاة أشخاص، فلا تعمل شيئا بتحيز."]]}, {"l": "1Ti 6:13", "n": "", "vs": [[13, "وأوصيك، أمام الله الذي يحيي كل شيء، والمسيح يسوع الذي شهد أمام بيلاطس البنطي بالاعتراف الحسن،"]]}], "kwAr": "شاهدا في حضرة الله", "noteAr": ""}, {"kw": "that", "raw": "2Ti_2:16, 2Ti_2:23; Rom_14:1; 1Ti_1:4, 1Ti_1:6, 1Ti_6:4, 1Ti_6:5; Tit_3:9-11", "note": "", "refs": [{"l": "2Ti 2:16", "n": "", "vs": [[16, "أما الأحاديث الباطلة الدنسة، فتجنبها؛ فإن المنصرفين إليها يتقدمون إلى فجور أفظع،"]]}, {"l": "2Ti 2:23", "n": "", "vs": [[23, "أما المجادلات الغبية الحمقاء، فتجنبها، عالما أنها تولد المشاجرات."]]}, {"l": "Rom 14:1", "n": "", "vs": [[1, "ومن كان ضعيفا في الإيمان، فاقبلوه بينكم دون أن تحاكموه على أرائه."]]}, {"l": "1Ti 1:4", "n": "", "vs": [[4, "وتوصي المؤمنين ألا ينشغلوا بالأساطير وسلاسل النسب المتشابكة. فتلك الأمور تثير المجادلات ولا تعمل على تقدم تدبير الله القائم على الإيمان."]]}, {"l": "1Ti 1:6", "n": "", "vs": [[6, "هذه الفضائل قد زاغ عنها بعضهم، فانحرفوا إلى المجادلات الباطلة،"]]}, {"l": "1Ti 6:4", "n": "", "vs": [[4, "فهو قد انتفخ تكبرا، ولا يعرف شيئا، وإنما هو مهووس بالمجادلات والمنازعات الكلامية، ومنها ينشأ الحسد والخصام والتجريح والنيات السيئة،"]]}, {"l": "1Ti 6:5", "n": "", "vs": [[5, "وشتى أنواع النزاع بين أناس فاسدي العقول مجردين من الحق، يعتبرون التقوى تجارة."]]}, {"l": "Tit 3:9-11", "n": "", "vs": [[9, "أما المسائل السخيفة، وسلاسل النسب، والمخاصمات، والمنازعات حول الشريعة، فتجنبها، لأنها غير نافعة، وباطلة."], [10, "وصاحب الهرطقة اقطع العلاقة به بعد إنذاره أولا وثانيا،"], [11, "عالما أن مثل هذا هو منحرف يمضي في الخطيئة وقد حكم على نفسه بنفسه!"]]}], "kwAr": "أن لا تنشأ المجادلات", "noteAr": ""}, {"kw": "to no", "raw": "1Sa_12:21; Jer_2:8, Jer_2:11, Jer_7:8, Jer_16:19, Jer_23:32; Hab_2:18; Mat_16:26; 1Ti_4:8; Heb_13:9", "note": "", "refs": [{"l": "1Sa 12:21", "n": "", "vs": [[21, "ولا تضلوا وراء الأصنام الباطلة التي لا تفيد ولا تنقذ، لأنه لا طائل منها."]]}, {"l": "Jer 2:8", "n": "", "vs": [[8, "إن الكهنة لم يسألوا: أين الرب؟ وأهل الشريعة لم يعرفوني، وحكام الشعب تمردوا علي، والأنبياء تنبأوا بتأثير بعل وضلوا وراء ما لا جدوى منه."]]}, {"l": "Jer 2:11", "n": "", "vs": [[11, "هل استبدلت أمة آلهتها مع أنها ليست حقا آلهة؟ أما شعبي فاستبدل مجده بما لا جدوى منه."]]}, {"l": "Jer 7:8", "n": "", "vs": [[8, "ها أنتم قد اتكلتم على أقوال الكذب، ولكن من غير جدوى."]]}, {"l": "Jer 16:19", "n": "", "vs": [[19, "يارب أنت عزي وحصني وملاذي في يوم الضيق، إليك تقبل الأمم من أقاصي الأرض قائلة: «لم يرث آباؤنا سوى الباطل والأكاذيب وما لا جدوى منه."]]}, {"l": "Jer 23:32", "n": "", "vs": [[32, "ها أنا أقاوم المتنبئين بأحلام كاذبة ويقصونها مضلين شعبي بأكاذيبهم واستخفافهم، مع أني لم أرسلهم ولم أكلفهم بشيء. ولا جدوى منهم لهذا الشعب."]]}, {"l": "Hab 2:18", "n": "", "vs": [[18, "أي جدوى من تمثال حتى يصوغه صانع، أو صنم يعلم الكذب لأن من يصنعه يتكل على ما صنعه، وهو لم يصنع سوى أصنام بكماء."]]}, {"l": "Mat 16:26", "n": "", "vs": [[26, "فماذا ينتفع الإنسان لو ربح العالم كله وخسر نفسه؟ أو ماذا يقدم الإنسان فداء عن نفسه؟"]]}, {"l": "1Ti 4:8", "n": "", "vs": [[8, "فالرياضة البدنية نافعة بعض الشيء. أما التقوى فنافعة لكل شيء، لأن فيها وعدا بالحياة الحاضرة والآتية."]]}, {"l": "Heb 13:9", "n": "", "vs": [[9, "فلا تنخدعوا وتتبعوا تلك التعاليم الغريبة المتنوعة ... فمن الأفضل أن يثبت القلب بالنعمة لا بنظم الأطعمة التي لم تنفع المتقيدين بها."]]}], "kwAr": "لا تنفع شيئا", "noteAr": ""}, {"kw": "the subverting", "raw": "Jer_23:36; Act_13:10, Act_15:24; Gal_1:7; Tit_3:11", "note": "", "refs": [{"l": "Jer 23:36", "n": "", "vs": [[36, "أما ادعاء وحي الرب فلا تذكروه من بعد، فإن كلمة المرء تغدو وحي قضائه، إذ قد حرفتم كلام الإله الحي، الرب القدير، إلهنا."]]}, {"l": "Act 13:10", "n": "", "vs": [[10, "«أيها الممتليء غشا وخبثا! ياابن إبليس! ياعدو كل بر! أما تكف عن تعويج طرق الرب المستقيمة؟"]]}, {"l": "Act 15:24", "n": "", "vs": [[24, "علمنا أن بعض الأشخاص ذهبوا من عندنا إليكم، دون تفويض منا فأثاروا بكلامهم الاضطراب بينكم وأقلقوا أفكاركم."]]}, {"l": "Gal 1:7", "n": "", "vs": [[7, "لا أعني أن هنالك إنجيلا آخر، بل إنما هنالك بعض (المعلمين) الذين يثيرون البلبلة بينكم، راغبين في تحوير إنجيل المسيح."]]}, {"l": "Tit 3:11", "n": "", "vs": [[11, "عالما أن مثل هذا هو منحرف يمضي في الخطيئة وقد حكم على نفسه بنفسه!"]]}], "kwAr": "تخريب سامعيها", "noteAr": ""}], "arS": [["بهذه ", []], ["الأمور", ["G5023"]], [" ", []], ["ذكر", ["G5279"]], ["، ", []], ["شاهدا", ["G1263"]], [" في ", []], ["حضرة", ["G1799"]], [" الله أن لا تنشأ ", []], ["المجادلات الكلامية", ["G3054"]], ["، وهي لا ", []], ["تنفع", ["G5539"]], [" شيئا، غير ", []], ["تخريب", ["G2692"]], [" ", []], ["سامعيها", ["G191"]], [".", []]]}, {"c": 2, "v": 15, "text": "اجتهد أن تقدم نفسك لله فائزا في الامتحان، عاملا ليس عليه ما يدعو للخجل، مفصلا كلمة الحق باستقامة.", "groups": [{"kw": "Study", "raw": "Heb_4:11; 2Pe_1:10,2Pe_1:15, 2Pe_3:14 *Gr.", "note": "", "refs": [{"l": "Heb 4:11", "n": "", "vs": [[11, "لذلك، لنجتهد جميعا للدخول إلى تلك الراحة، لكي لا يسقط أحد منا كما سقط أولئك الذين عصوا أمر الله."]]}, {"l": "2Pe 1:10", "n": "", "vs": [[10, "فأحرى بكم إذن، أيها الإخوة، أن تجتهدوا لتثبتوا عمليا أن الله قد دعاكم واختاركم حقا. فإنكم، إن فعلتم هذا، لن تسقطوا أبدا!"]]}, {"l": "2Pe 1:15", "n": "", "vs": [[15, "ولهذا، أجتهد الآن في تذكيركم بهذه الأمور، حتى تستطيعوا أن تتذكروها دائما بعد رحيلي."]]}, {"l": "2Pe 3:14", "n": "*Gr.", "vs": [[14, "فبينما تنتظرون إتمام هذا الوعد، أيها الأحباء، اجتهدوا أن يجدكم الرب في سلام، خالين من الدنس والعيب."]]}], "kwAr": "اجتهد", "noteAr": ""}, {"kw": "approved", "raw": "Act_2:22; Rom_14:18, Rom_16:10; 2Co_5:9, 2Co_10:18; Gal_1:10; 1Th_2:4", "note": "", "refs": [{"l": "Act 2:22", "n": "", "vs": [[22, "فيا بني إسرائيل، اسمعوا هذا الكلام: إن يسوع الناصري رجل أيده الله بمعجزات وعجائب وعلامات أجراها على يده بينكم، كما تعلمون."]]}, {"l": "Rom 14:18", "n": "", "vs": [[18, "فمن خدم المسيح هكذا، كان مقبولا عند الله وممدوحا عند الناس."]]}, {"l": "Rom 16:10", "n": "", "vs": [[10, "سلموا على أبلس، الذي برهن عن ثباته في المسيح. سلموا على ذوي أرستوبولوس."]]}, {"l": "2Co 5:9", "n": "", "vs": [[9, "ولذلك أيضا نحرص أن نرضيه، سواء أكنا مقيمين أم مغتربين."]]}, {"l": "2Co 10:18", "n": "", "vs": [[18, "فليس الفاضل هو من يمدح نفسه، بل من يمدحه الرب."]]}, {"l": "Gal 1:10", "n": "", "vs": [[10, "فهل أسعى الآن إلى كسب تأييد الناس أو الله؟ أم تراني أطلب أن أرضي الناس؟ لو كنت حتى الآن أرضي الناس، لما كنت عبدا للمسيح!"]]}, {"l": "1Th 2:4", "n": "", "vs": [[4, "بل إننا نتكلم كمن تبين من اختبار الله لهم أنهم أهل لأن يؤتمنوا على الإنجيل، لنرضي لا الناس بل الله الذي يختبر قلوبنا."]]}], "kwAr": "فائزا في الامتحان", "noteAr": ""}, {"kw": "a workman", "raw": "Mat_13:52; 2Co_3:6, 2Co_6:3, 2Co_6:4; 1Ti_4:6, 1Ti_4:12-16", "note": "", "refs": [{"l": "Mat 13:52", "n": "", "vs": [[52, "فقال: «ولهذا السبب، فأي واحد من الكتبة يصير تلميذا لملكوت السماوات، يشبه بإنسان رب بيت يطلع من كنزه ما هو جديد وما هو عتيق! »"]]}, {"l": "2Co 3:6", "n": "", "vs": [[6, "الذي جعلنا أصحاب كفاءة لنكون خداما لعهد جديد قائم لا على الحرف بل على الروح. فالحرف يؤدي إلى الموت؛ أما الروح فيعطي الحياة."]]}, {"l": "2Co 6:3", "n": "", "vs": [[3, "ولسنا نتصرف أي تصرف يكون عثرة لأحد، حتى لا يلحق الخدمة أي لوم."]]}, {"l": "2Co 6:4", "n": "", "vs": [[4, "وإنما نتصرف في كل شيء بما يبين أننا فعلا خدام الله: في تحمل الكثير؛ في الشدائد والحاجات والضيقات والجلدات"]]}, {"l": "1Ti 4:6", "n": "", "vs": [[6, "إن بسطت هذه الأمور أمام الإخوة، كنت خادما صالحا للمسيح يسوع، متغذيا بكلام الإيمان والتعليم الصالح الذي اتبعته تماما."]]}, {"l": "1Ti 4:12-16", "n": "", "vs": [[12, "لا يستخف أحد بحداثة سنك. وإنما كن قدوة للمؤمنين، في الكلام والسلوك والمحبة والإيمان والطهارة."], [13, "إلى حين وصولي، انصرف إلى تلاوة الكتاب، وإلى الوعظ، وإلى التعليم."], [14, "لا تهمل الموهبة الخاصة التي فيك والتي أعطيت لك بالتنبوء ووضع الشيوخ أيديهم عليك."], [15, "انصرف إلى هذه الأمور، وانشغل بها كليا، ليكون تقدمك واضحا للجميع."], [16, "انتبه جيدا لنفسك وللتعليم. فإنك إذ تواظب على ذلك، تنقذ نفسك وسامعيك أيضا."]]}], "kwAr": "عاملا", "noteAr": ""}, {"kw": "rightly", "raw": "Mat_13:52; Mar_4:33; Luk_12:42; Joh_21:15-17; Act_20:27; 1Co_2:6, 1Co_3:1, 1Co_3:2; 2Co_4:2; 1Th_5:14; Heb_5:11-14", "note": "", "refs": [{"l": "Mat 13:52", "n": "", "vs": [[52, "فقال: «ولهذا السبب، فأي واحد من الكتبة يصير تلميذا لملكوت السماوات، يشبه بإنسان رب بيت يطلع من كنزه ما هو جديد وما هو عتيق! »"]]}, {"l": "Mar 4:33", "n": "", "vs": [[33, "بكثير من مثل هذه الأمثال كان يسوع يكلم الجمع بالكلمة، على قدر ما كانوا يطيقون أن يسمعوا."]]}, {"l": "Luk 12:42", "n": "", "vs": [[42, "فقال الرب: «من هو إذن الوكيل الأمين العاقل الذي يقيمه سيده على أهل بيته ليقدم لهم حصتهم من الطعام في حينها؟"]]}, {"l": "Joh 21:15-17", "n": "", "vs": [[15, "وبعدما أكلوا سأل يسوع سمعان بطرس: «ياسمعان بن يونا، أتحبني أكثر مما يحبني هؤلاء؟» فأجابه «نعم يارب، أنت تعلم أني أحبك!» فقال له: «أطعم حملاني!»"], [16, "ثم سأله ثانية: «ياسمعان بن يونا، أتحبني؟» فأجابه: «نعم يارب. أنت تعلم أني أحبك!» قال له: «ارع خرافي»"], [17, "فسأله مرة ثالثة: «ياسمعان بن يونا، أتحبني؟» فحزن بطرس لأن يسوع قال له في المرة الثالثة: «أتحبني». وقال له: «يارب، أنت تعلم كل شيء. أنت تعلم أني أحبك!» فقال له يسوع: «أطعم خرافي!"]]}, {"l": "Act 20:27", "n": "", "vs": [[27, "لأني لم أمتنع عن إبلاغكم جميع مقاصد الله."]]}, {"l": "1Co 2:6", "n": "", "vs": [[6, "على أن لنا حكمة نتكلم بها بين البالغين. ولكنها حكمة ليست من هذا العالم ولا من رؤساء هذا العالم الزائلين."]]}, {"l": "1Co 3:1", "n": "", "vs": [[1, "على أني، أيها الإخوة، لم أستطع أن أكلمكم باعتباركم روحيين، بل باعتباركم جسديين وأطفالا في المسيح."]]}, {"l": "1Co 3:2", "n": "", "vs": [[2, "قد أطعمتكم لبنا لا الطعام القوي، لأنكم لم تكونوا قادرين عليه، بل إنكم حتى الآن غير قادرين."]]}, {"l": "2Co 4:2", "n": "", "vs": [[2, "ولكننا قد رفضنا الأساليب الخفية المخجلة، إذ لا نسلك في المكر، ولا نزور كلمة الله، بل بإعلاننا للحق نمدح أنفسنا لدى ضمير كل إنسان، أمام الله."]]}, {"l": "1Th 5:14", "n": "", "vs": [[14, "إلا أننا نناشدكم، أيها الإخوة، أن تعظوا الفوضويين، وتشددوا فاقدي العزم، وتساندوا الضعفاء، وتعاملوا الجميع بطول البال."]]}, {"l": "Heb 5:11-14", "n": "", "vs": [[11, "بخصوص رئيس الكهنة هذا، عندي كلام كثير، ولكنه صعب التفسير! إذ يبدو أنكم تعانون بلادة في الفهم."], [12, "كان يجب أن تكونوا الآن قادرين على تعليم الآخرين، بعدما مضى زمان طويل على اهتدائكم. ولكنكم مازلتم بحاجة إلى من يعلمكم حتى المباديء الأساسية لإعلانات الله. ها قد عدتم من جديد تحتاجون إلى اللبن! فأنتم غير قادرين على هضم الطعام القوي."], [13, "وكل من يتناول اللبن، يكون عديم الخبرة في التعليم القويم، لأنه مازال طفلا غير ناضج."], [14, "أما الناضجون روحيا، فهم قادرون على تناول الطعام القوي: لأن حواسهم قد تدربت، بالممارسة الصحيحة، على التمييز بين الخير والشر."]]}], "kwAr": "مفصلا كلمة الحق باستقامة", "noteAr": ""}], "arS": [["اجتهد", ["G4704"]], [" أن ", []], ["تقدم", ["G3936"]], [" ", []], ["نفسك", ["G4572"]], [" ", []], ["لله", ["G2316"]], [" ", []], ["فائزا في الامتحان", ["G1384"]], ["، ", []], ["عاملا", ["G2040"]], [" ليس عليه ما ", []], ["يدعو للخجل", ["G422"]], ["، ", []], ["مفصلا", ["G3718"]], [" ", []], ["كلمة", ["G3056"]], [" ", []], ["الحق", ["G225"]], [" باستقامة.", []]]}, {"c": 2, "v": 16, "text": "أما الأحاديث البا  {"kw": "The Lord", "raw": "Num_16:5; Psa_1:6, Psa_37:18, Psa_37:28; Nah_1:7; Mat_7:23; Luk_13:27; Joh_10:14; Joh_10:27-30, Joh_13:18; Rom_8:28, Rom_11:2; 1Co_8:3; Gal_4:9; Rev_17:8", "note": "", "refs": [{"l": "Num 16:5", "n": "", "vs": [[5, "ثم قال لقورح وسائر جماعته: «غدا يعلن الرب من هو له، ومن هو المقدس فيقربه منه."]]}, {"l": "Psa 1:6", "n": "", "vs": [[6, "لأن الرب يحفظ طريق الأبرار، أما طريق الأشرار فمصيرها الهلاك."]]}, {"l": "Psa 37:18", "n": "", "vs": [[18, "الرب عليم بأيام الكاملين، وميراثهم يدوم إلى الأبد."]]}, {"l": "Psa 37:28", "n": "", "vs": [[28, "لأن الرب يحب العدل، ولا يتخلى عن أتقيائه، بل يحفظهم إلى الأبد. أما ذرية الأشرار فتفنى."]]}, {"l": "Nah 1:7", "n": "", "vs": [[7, "الرب صالح، حصن في يوم الضيق، ويعرف المعتصمين به."]]}, {"l": "Mat 7:23", "n": "", "vs": [[23, "ولكني عندئذ أصرح لهم: إني لم أعرفكم قط! ابتعدوا عني يافاعلي الإثم!"]]}, {"l": "Luk 13:27", "n": "", "vs": [[27, "وسوف يقول: أقول لكم، لا أعرف من أين أنتم؛ اغربوا من أمامي ياجميع فاعلي الإثم!"]]}, {"l": "Joh 10:14", "n": "", "vs": [[14, "أما أنا فإني الراعي الصالح، وأعرف خرافي، وخر افي تعرفني،"]]}, {"l": "Joh 10:27-30", "n": "", "vs": [[27, "فخرافي تصغي لصوتي، وأنا أعرفها وهي تتبعني،"], [28, "وأعطيها حياة أبدية، فلا تهلك إلى الأبد، ولا ينتزعها أحد من يدي."], [29, "إن الآب الذي أعطاني إياها هو أعظم من الجميع، ولا يقدر أحد أن ينتزع من يد الآب شيئا."], [30, "أنا والآب واحد!»"]]}, {"l": "Joh 13:18", "n": "", "vs": [[18, "وأنا لا أقول هذا عن جميعكم، فأنا أعرف الذين اخترتهم. ولكن لابد أن يتم الكتاب حيث يقول: الآكل من خبزي، رفع علي عقبه!"]]}, {"l": "Rom 8:28", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."]]}, {"l": "Rom 11:2", "n": "", "vs": [[2, "إن الله لم يرفض شعبه الذي كان قد اختاره. أما تعلمون ما يقوله الكتاب في أمر إيليا لما رفع إلى الله شكوى على إسرائيل قائلا:"]]}, {"l": "1Co 8:3", "n": "", "vs": [[3, "أما الذي يحب الله ، فإن الله يعرفه."]]}, {"l": "Gal 4:9", "n": "", "vs": [[9, "أما الآن وقد عرفتم الله ، بل بالأحرى عرفكم الله ، فكيف ترتدون أيضا إلى تلك المباديء العاجزة الفقيرة التي ترغبون في الرجوع إلى العبودية لها من جديد؟"]]}, {"l": "Rev 17:8", "n": "", "vs": [[8, "هذا الوحش كان موجودا، وهو غير موجود الآن، ولكنه على وشك أن يطلع من الهاوية ويمضي إلى الهلاك. وسيدهش سكان الأرض الذين لم تكتب أسماؤهم منذ تأسيس العالم في سجل الحياة، عندما يرون الوحش، لأنه كان موجودا، ثم أصبح غير موجود، وسيعود!"]]}], "kwAr": "الرب يعرف خاصته", "noteAr": ""}, {"kw": "Let", "raw": "Num_6:27; Psa_97:10; Isa_63:19, Isa_65:15; Mat_28:19; Act_9:14, Act_11:26, Act_15:17; Rom_15:9, Rom_15:20; 1Co_1:2; Eph_3:15; Rev_2:13, Rev_3:8, Rev_22:4", "note": "", "refs": [{"l": "Num 6:27", "n": "", "vs": [[27, "وهكذا يجعلون اسمي على بني إسرائيل وأنا أباركهم»."]]}, {"l": "Psa 97:10", "n": "", "vs": [[10, "يامحبي الرب، أبغضوا الشر. الرب حارس نفوس أتقيائه، وهو ينقذهم من أيدي الأشرار."]]}, {"l": "Isa 63:19", "n": "", "vs": [[19, "وأصبحنا نظير الذين لم تتسلط عليهم قط ولم يدع عليهم باسمك."]]}, {"l": "Isa 65:15", "n": "", "vs": [[15, "وتخلفون اسمكم لعنة على شفاه مختاري، ويميتكم الرب ويطلق على عبيده اسما آخر."]]}, {"l": "Mat 28:19", "n": "", "vs": [[19, "فاذهبوا إذن، وتلمذوا جميع الأمم، وعمدوهم باسم الآب والابن والروح القدس؛"]]}, {"l": "Act 9:14", "n": "", "vs": [[14, "وقد خوله رؤساء الكهنة السلطة ليلقي القبض على كل من يدعو باسمك»."]]}, {"l": "Act 11:26", "n": "", "vs": [[26, "ولما وجده جاء به إلى أنطاكية، فكانا يجتمعان مع الكنيسة هناك سنة كاملة، ويعلمان جمعا كبيرا. وفي أنطاكية أطلق على تلاميذ الرب أول مرة اسم المسيحيين."]]}, {"l": "Act 15:17", "n": "", "vs": [[17, "لكي يسعى إلى الرب باقي الناس وجميع الشعوب التي تحمل اسمي، يقول الرب، فاعل هذه الأمور"]]}, {"l": "Rom 15:9", "n": "", "vs": [[9, "وإن الأمم يمجدون الله على الرحمة، وفقا لما قد كتب: «لهذا أعترف لك بين الأمم وأرتل لاسمك!»"]]}, {"l": "Rom 15:20", "n": "", "vs": [[20, "وكنت حريصا على التبشير حيث لم يكن قد عرف اسم المسيح، لكي لا أبني على أساس وضعه غيري،"]]}, {"l": "1Co 1:2", "n": "", "vs": [[2, "إلى كنيسة الله في مدينة كورنثوس، إلى الذين تقدسوا في المسيح يسوع، المدعوين، القديسين؛ وإلى جميع الذين يدعون باسم ربنا يسوع المسيح في كل مكان ربا لهم ولنا."]]}, {"l": "Eph 3:15", "n": "", "vs": [[15, "الذي هو أصل كل أبوة في السماوات وعلى الأرض،"]]}, {"l": "Rev 2:13", "n": "", "vs": [[13, "إني أعلم أين تسكن، حيث عرش الشيطان! ورغم ذلك تمسكت باسمي، ورفضت أن تنكر الإيمان بي، حتى في أيام أنتيباس شهيدي الأمين، الذي قتل عندكم حيث يسكن الشيطان!"]]}, {"l": "Rev 3:8", "n": "", "vs": [[8, "إني عالم بأعمالك. فمع أن لك قوة ضئيلة، فقد أطعت كلمتي ولم تنكر اسمي، ولذلك فتحت لك بابا لا يقدر أحد أن يغلقه."]]}, {"l": "Rev 22:4", "n": "", "vs": [[4, "ويرون وجهه، وقد كتب اسمه على جباههم."]]}], "kwAr": "لينفصل", "noteAr": ""}, {"kw": "depart", "raw": "Job_28:28; Psa_34:14, Psa_37:27; Pro_3:7; Rom_12:9; 2Co_7:1; Eph_4:17-22; Eph_5:1-11; Col_3:5-8; Tit_2:11-14; 1Pe_1:13-19; 2Pe_1:4-10, 2Pe_3:14; 1Jo_3:7-10", "note": "", "refs": [{"l": "Job 28:28", "n": "", "vs": [[28, "ثم قال للإنسان: انظر، إن مخافة الرب هي الحكمة، وتفادي الشر هو الفطنة»."]]}, {"l": "Psa 34:14", "n": "", "vs": [[14, "ليتحول عن الشر ويفعل الخير. ليطلب السلام ويسع للوصول إليه"]]}, {"l": "Psa 37:27", "n": "", "vs": [[27, "حد عن الشر واصنع الخير، فتسكن مطمئنا إلى الأبد."]]}, {"l": "Pro 3:7", "n": "", "vs": [[7, "لا تكن حكيما في عيني نفسك بل اتق الرب وحد عن الشر،"]]}, {"l": "Rom 12:9", "n": "", "vs": [[9, "ولتكن المحبة بلا رياء. انفروا من الشر، والتصقوا بالخير."]]}, {"l": "2Co 7:1", "n": "", "vs": [[1, "فإذ نلنا هذه الوعود، أيها الأحباء، لنطهر أنفسنا من كل ما يدنس الجسد والروح، ونكمل القداسة في مخافة الله."]]}, {"l": "Eph 4:17-22", "n": "", "vs": [[17, "أقول هذا إذن، وأشهد في الرب، راجيا ألا تسلكوا فيما بعد كما يسلك الأمم في عقم ذهنهم،"], [18, "لكونهم مظلمي البصيرة ومتغربين عن حياة الله بسبب ما فيهم من جهل وقساوة قلب."], [19, "فهؤلاء، إذ طرحوا جانبا كل إحساس، استسلموا للإباحية ليرتكبوا كل نجاسة بشهوة نهمة لا ترتوي."], [20, "أما أنتم، فلم تتعلموا المسيح هكذا،"], [21, "إذا كنتم قد سمعتموه حقا وتلقيتم فيه التعليم الموافق للحق الذي في يسوع!"], [22, "وهو أن تخلعوا ما يتعلق بسيرتكم الماضية: الإنسان العتيق الذي يفسد نفسه بالشهوات الخداعة؛"]]}, {"l": "Eph 5:1-11", "n": "", "vs": [[1, "فاقتدوا إذن بالله كأولاد أحباء،"], [2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."], [3, "أما الزنى، وكل نجاسة أو شهوة نهمة، فلا يذكر بينكم حتى اسمها، كما يليق بالقديسين."], [4, "وكذلك البذاءة والكلام السفيه والهزل، فهي غير لائقة. وإنما أحرى بكم أن تلهجوا بالشكر لله!"], [5, "فإنكم تعلمون هذا جيدا: أن كل زان أو نجس أو صاحب شهوة نهمة، ما هو إلا عابد أصنام، ليس له ميراث في ملكوت المسيح والله."], [6, "لا يخدعكم أحد بكلام باطل! فبسبب هذه الأمور يحل غضب الله على أبناء العصيان."], [7, "إذن، لا تكونوا شركاء لهم:"], [8, "فقد كنتم في الماضي ظلاما، ولكنكم الآن نور في الرب. فاسلكوا سلوك أولاد النور."], [9, "فإن ثمر النور يكون في كل صلاح واستقامة وحق."], [10, "هكذا تختبرون الأمور التي ترضي الرب."], [11, "وعليكم ألا تكتفوا بعدم الاشتراك في أعمال الظلام العقيمة، بل بالأحرى أن تفضحوها أيضا."]]}, {"l": "Col 3:5-8", "n": "", "vs": [[5, "فأميتوا إذن أعضاءكم الأرضية: الزنى، النجاسة، جموح العاطفة، الشهوة الرديئة، والاشتهاء النهم الذي هو عبادة أصنام."], [6, "فبسبب هذه الخطايا ينزل غضب الله،"], [7, "وفيها سلكتم في الماضي، حين كنتم تعيشون فيها."], [8, "وأما الآن، فانزعوا عنكم، أنتم أيضا، هذه الخطايا كلها: الغضب، النقمة، الخبث، التجديف، الكلام القبيح الخارج من أفواهكم."]]}, {"l": "Tit 2:11-14", "n": "", "vs": [[11, "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت."], [12, "وهي تعلمنا أن نقطع علاقتنا بالإباحية والشهوات العالمية، وأن نحيا في العصر الحاضر حياة التعقل والبر والتقوى،"], [13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"], [14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "1Pe 1:13-19", "n": "", "vs": [[13, "لذلك اجعلوا أذهانكم متنبهة دائما، وتيقظوا، وعلقوا رجاءكم كله على النعمة التي ستكون من نصيبكم عندما يعود يسوع المسيح ظاهرا بمجده!"], [14, "وبما أنكم صرتم أولادا لله مطيعين له، فلا تعودوا إلى مجاراة الشهوات التي كانت تسيطر عليكم سابقا في أيام جهلكم."], [15, "وإنما اسلكوا سلوكا مقدسا في كل أمر، مقتدين بالقدوس الذي دعاكم،"], [16, "لأنه قد كتب: «كونوا قديسين، لأني أنا قدوس!»"], [17, "وما دمتم تعترفون بالله أبا لكم، وهو يحكم على كل إنسان حسب أعماله دون انحياز، فاسلكوا في مخافته مدة إقامتكم المؤقتة على الأرض."], [18, "واعلموا أنه قد دفع الفدية ليحرركم من سيرة حياتكم الباطلة التي أخذتموها بالتقليد عن آبائكم. وهذه الفدية لم تكن شيئا فانيا كالفضة أو الذهب،"], [19, "بل كانت دما ثمينا، دم المسيح، ذلك الحمل الطاهر الذي ليس فيه عيب ولا دنس!"]]}, {"l": "2Pe 1:4-10", "n": "", "vs": [[4, "اللذين بهما أعطانا الله بركاته العظمى الثمينة التي كان قد وعد بها. وبهذا صار بإمكانكم أن تتخلصوا من الفساد الذي تنشره الشهوة في العالم، وتشتركوا في الطبيعة الإلهية."], [5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"], [6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"], [7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."], [8, "فحين تكون هذه الصفات الطيبة في داخلكم، وتزداد بوفرة، تجعلكم مجتهدين ومثمرين في معرفتكم لربنا يسوع المسيح."], [9, "أما الذي لا يملك هذه الصفات، فهو أعمى روحيا. إنه قصير البصر، قد نسي أنه تطهر من خطاياه القديمة!"], [10, "فأحرى بكم إذن، أيها الإخوة، أن تجتهدوا لتثبتوا عمليا أن الله قد دعاكم واختاركم حقا. فإنكم، إن فعلتم هذا، لن تسقطوا أبدا!"]]}, {"l": "2Pe 3:14", "n": "", "vs": [[14, "فبينما تنتظرون إتمام هذا الوعد، أيها الأحباء، اجتهدوا أن يجدكم الرب في سلام، خالين من الدنس والعيب."]]}, {"l": "1Jo 3:7-10", "n": "", "vs": [[7, "أيها الأولاد الصغار، لا تدعوا أحدا يضللكم. تأكدوا أن من يمارس الصلاح، يظهر أنه بار كما أن المسيح بار."], [8, "ولكن من يمارس الخطيئة، يظهر أنه من أولاد إبليس، لأن إبليس يمارس الخطيئة منذ البداية. وقد جاء ابن الله إلى الأرض لكي يبطل أعمال إبليس."], [9, "فكل مولود من الله، لا يمارس الخطيئة، لأن طبيعة الله صارت ثابتة فيه. بل إنه لا يستطيع أن يمارس الخطيئة، لأنه مولود من الله."], [10, "إذن، هذا هو المقياس الذي نميز به بين أولاد الله وأولاد إبليس. من لا يمارس الصلاح، فهو ليس من الله. وكذلك من لا يحب أخاه!"]]}], "kwAr": "عن الإثم", "noteAr": ""}], "arS": [["إلا أن ", []], ["الأساس", ["G2310"]], [" الراسخ الذي وضعه ", []], ["الله", ["G2316"]], [" يظل ", []], ["ثابتا", ["G4731"]], ["، وعليه هذا ", []], ["الختم", ["G4973"]], [": «", []], ["الرب", ["G2962"]], [" ", []], ["يعرف", ["G1097"]], [" خاصته»، وأيضا: «", []], ["لينفصل", ["G868"]], [" عن ", []], ["الإثم", ["G93"]], [" كل من ", []], ["يسمي", ["G3687"]], [" ", []], ["اسم", ["G3686"]], [" الرب!»", []]]}, {"c": 2, "v": 20, "text": "وإنما، في بيت كبير، لا تكون الأواني كلها من الذهب والفضة وحسب، بل يكون بعضها من الخشب والفخار أيضا. كما يكون بعضها للاستعمال الرفيع، وبعضها للاستعمال الوضيع.", "groups": [{"kw": "in a", "raw": "1Co_3:9, 1Co_3:16, 1Co_3:17; Eph_2:22; 1Ti_3:15; Heb_3:2-6; 1Pe_2:5", "note": "", "refs": [{"l": "1Co 3:9", "n": "", "vs": [[9, "فإننا نحن جميعا عاملون معا عند الله، وأنتم حقل الله وبناء الله."]]}, {"l": "1Co 3:16", "n": "", "vs": [[16, "ألا تعرفون أنكم هيكل الله وأن روح الله ساكن فيكم؟"]]}, {"l": "1Co 3:17", "n": "", "vs": [[17, "فإن دمر أحد هيكل الله، يدمره الله ، لأن هيكل الله مقدس، وهو أنتم"]]}, {"l": "Eph 2:22", "n": "", "vs": [[22, "وفيه أنتم أيضا قد بنيتم معا فصرتم مسكنا لله بوجود الروح."]]}, {"l": "1Ti 3:15", "n": "", "vs": [[15, "حتى إذا تأخرت تعلم كيف يجب التصرف في بيت الله، أي كنيسة الله الحي، ركن الحق ودعامته."]]}, {"l": "Heb 3:2-6", "n": "", "vs": [[2, "فهو أمين لله في المهمة التي عينه لها، كما كان موسى أمينا في القيام بخدمته في بيت الله كله."], [3, "إلا أنه يستحق مجدا أعظم من مجد موسى، كما أن الذي يبني بيتا ينال إكراما ومدحا أكثر مما ينال البيت الذي بناه!"], [4, "طبعا، كل بيت لابد أن يكون له بان، والله نفسه هو باني كل شيء."], [5, "إن موسى كان أمينا في كل بيت الله، ولكن بصفته خادما. وكان ذلك شهادة لما أعلنه الله في ما بعد."], [6, "أما المسيح، فهو أمين بصفته ابنا يترَأس على البيت. وهذا البيت هو نحن المؤمنين، على أن نتمسك بالثقة والافتخار برجائنا تمسكا ثابتا حتى النهاية."]]}, {"l": "1Pe 2:5", "n": "", "vs": [[5, "إذن اتحدوا به كحجارة حية، مبنيين بيتا روحيا، تكونون فيه كهنة مقدسين تقدمون لله ذبائح روحية مقبولة لديه بفضل يسوع المسيح."]]}], "kwAr": "في بيت كبير", "noteAr": ""}, {"kw": "vessels", "raw": "Exo_27:3; Ezr_1:6, Ezr_6:5; Lam_4:2; Dan_5:2; 2Co_4:7", "note": "", "refs": [{"l": "Exo 27:3", "n": "", "vs": [[3, "وتصنع من نحاس جميع آنيته: قدوره لرفع رماده، ومجارفه وأحواضه ومناشله ومجامره."]]}, {"l": "Ezr 1:6", "n": "", "vs": [[6, "وأمدهم جيرانهم بآنية فضة وذهب وبأمتعة ودواب وتحف، فضلا عما تبرعوا به."]]}, {"l": "Ezr 6:5", "n": "", "vs": [[5, "كما يتحتم رد آنية هيكل الله الذهبية والفضية التي غنمها نبوخذناصر من هيكل أورشليم ونقلها إلى بابل، إلى موضعها في هيكل الله في أورشليم."]]}, {"l": "Lam 4:2", "n": "", "vs": [[2, "كيف حسب أبناء صهيون الكرام الموزونون بالذهب النقي، كآنية خزفية من عمل يد الفخاري؟"]]}, {"l": "Dan 5:2", "n": "", "vs": [[2, "وفيما كان يحتسي الخمر أمر بإحضار آنية الذهب والفضة التي استولى عليها أبوه نبوخذناصر من هيكل أورشليم، ليشرب بها مع نبلاء مملكته وزوجاته ومحظياته."]]}, {"l": "2Co 4:7", "n": "", "vs": [[7, "ولكن هذا الكنز نحمله نحن في أوعية من فخار، ليتبين أن القدرة الفائقة آتية من الله لا صادرة منا."]]}], "kwAr": "الأواني", "noteAr": ""}, {"kw": "and some to honour", "raw": "Rom_9:21-23", "note": "", "refs": [{"l": "Rom 9:21-23", "n": "", "vs": [[21, "أوليس لصانع الفخار سلطة على الطين ليصنع من كتلة واحدة وعاء للاستعمال الرفيع وآخر للاستعمال الوضيع؟"], [22, "فماذا إذا إن كان الله ، وقد شاء أن يظهر غضبه ويعلن قدرته، احتمل بكل صبر أوعية غضب جاهزة للهلاك،"], [23, "وذلك بقصد أن يعلن غنى مجده في أوعية الرحمة التي سبق فأعدها للمجد،"]]}], "kwAr": "للاستعمال الرفيع", "noteAr": ""}], "arS": [["وإنما، في ", []], ["بيت", ["G3614"]], [" ", []], ["كبير", ["G3173"]], ["، لا تكون ", []], ["الأواني", ["G4632"]], [" كلها من ", []], ["الذهب", ["G5552"]], [" ", []], ["والفضة", ["G693"]], [" وحسب، بل يكون بعضها من ", []], ["الخشب", ["G3585"]], [" ", []], ["والفخار", ["G3749"]], [" أيضا. كما يكون بعضها ", []], ["للاستعمال الرفيع", ["G5092"]], ["، وبعضها ", []], ["للاستعمال الوضيع", ["G819"]], [".", []]]}, {"c": 2, "v": 21, "text": "إذن الذي ينفصل عن هذه الأخيرة، مطهرا نفسه، يكون إناء للاستعمال الرفيع، مقدسا، نافعا لرب البيت، متأهبا لكل عمل صالح.", "groups": [{"kw": "purge", "raw": "Psa_119:9; Isa_1:25, Isa_52:11; Jer_15:19; Mal_3:3; 1Co_5:7; 2Co_7:1; 1Pe_1:22; 1Jo_3:3", "note": "", "refs": [{"l": "Psa 119:9", "n": "", "vs": [[9, "بماذا يزكي الشاب مسلكه؟ بطاعته لكلمتك."]]}, {"l": "Isa 1:25", "n": "", "vs": [[25, "لأعاقبنك وأنقينك من غشك كما تنقى المعادن بالبورق، وأصفينك من قصديرك،"]]}, {"l": "Isa 52:11", "n": "", "vs": [[11, "انصرفوا، انصرفوا واخرجوا من هناك ولا تمسوا نجسا. اخرجوا من وسط بابل، وطهروا أنفسكم ياحاملي آنية الرب."]]}, {"l": "Jer 15:19", "n": "", "vs": [[19, "لذلك، هكذا قال الرب: «إن رجعت أستردك فتمثل أمامي. إن نطقت بالقول السديد ونبذت الكلام الغث، أجعلك المتحدث بفمي، فيقبلون إليك مسترشدين، وأنت لا تلجأ إليهم طالبا نصيحة."]]}, {"l": "Mal 3:3", "n": "", "vs": [[3, "فيجلس ممحصا ومنقيا للفضة ليطهر أبناء لاوي ويمحصهم كالفضة والذهب، حتى يقربوا للرب تقدمات بقلوب طاهرة."]]}, {"l": "1Co 5:7", "n": "", "vs": [[7, "فاعزلوا الخميرة العتيقة من بينكم لتكونوا عجينا جديدا، لأنكم فطير ! فإن حمل فصحنا، أي المسيح، قد ذبح."]]}, {"l": "2Co 7:1", "n": "", "vs": [[1, "فإذ نلنا هذه الوعود، أيها الأحباء، لنطهر أنفسنا من كل ما يدنس الجسد والروح، ونكمل القداسة في مخافة الله."]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}, {"l": "1Jo 3:3", "n": "", "vs": [[3, "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر."]]}], "kwAr": "مطهرا نفسه", "noteAr": ""}, {"kw": "a vessel", "raw": "2Ti_2:20; 1Pe_1:7", "note": "", "refs": [{"l": "2Ti 2:20", "n": "", "vs": [[20, "وإنما، في بيت كبير، لا تكون الأواني كلها من الذهب والفضة وحسب، بل يكون بعضها من الخشب والفخار أيضا. كما يكون بعضها للاستعمال الرفيع، وبعضها للاستعمال الوضيع."]]}, {"l": "1Pe 1:7", "n": "", "vs": [[7, "إلا أن غاية هذه التجارب هي اختبار حقيقة إيمانكم. فكما تختبر النار الذهب وتنقيه، تختبر التجارب حقيقة إيمانكم، وهو أثمن جدا من الذهب ا vs": [[18, "اهربوا من الزنا! فكل خطيئة يرتكبها الإنسان هي خارجة عن جسده، وأما من يرتكب الزنا، فهو يسيء إلى جسده الخاص."]]}, {"l": "1Co 10:14", "n": "", "vs": [[14, "لذلك، ياأحبائي، اهربوا من عبادة الأصنام."]]}, {"l": "1Ti 6:11", "n": "", "vs": [[11, "وأما أنت، ياإنسان الله، فاهرب من هذه الأمور، واسع في إثر البر والتقوى والإيمان والمحبة والصبر والوداعة."]]}], "kwAr": "اهرب", "noteAr": ""}, {"kw": "youthful", "raw": "Psa_119:9; Ecc_11:9, Ecc_11:10; 1Pe_2:11", "note": "", "refs": [{"l": "Psa 119:9", "n": "", "vs": [[9, "بماذا يزكي الشاب مسلكه؟ بطاعته لكلمتك."]]}, {"l": "Ecc 11:9", "n": "", "vs": [[9, "افرح أيها الشاب في حداثتك، وليمتعك قلبك في أيام شبابك، واتبع أهواء قلبك، وكل ما تشهده عيناك. ولكن اعلم أنه بسبب هذه الأمور كلها يأتي الله بك إلى كرسي القضاء."]]}, {"l": "Ecc 11:10", "n": "", "vs": [[10, "فأزل الغم من صدرك، واقص الشر عن جسدك، لأن الحداثة والشباب باطلان."]]}, {"l": "1Pe 2:11", "n": "", "vs": [[11, "أيها الأحباء، ما أنتم إلا غرباء تزورون الأرض زيارة عابرة. لذلك أطلب إليكم أن تبتعدوا عن الشهوات الجسدية التي تصارع النفس."]]}], "kwAr": "الشهوات الشبابية", "noteAr": ""}, {"kw": "follow", "raw": "1Ti_4:12, 1Ti_6:11; Heb_12:14; 3Jo_1:11", "note": "", "refs": [{"l": "1Ti 4:12", "n": "", "vs": [[12, "لا يستخف أحد بحداثة سنك. وإنما كن قدوة للمؤمنين، في الكلام والسلوك والمحبة والإيمان والطهارة."]]}, {"l": "1Ti 6:11", "n": "", "vs": [[11, "وأما أنت، ياإنسان الله، فاهرب من هذه الأمور، واسع في إثر البر والتقوى والإيمان والمحبة والصبر والوداعة."]]}, {"l": "Heb 12:14", "n": "", "vs": [[14, "اجعلوا هدفكم أن تسالموا جميع الناس، وتعيشوا حياة مقدسة. فبغير قداسة، لا يقدر أحد أن يرى الرب."]]}, {"l": "3Jo 1:11", "n": "", "vs": [[11, "أيها الحبيب، لا تقتد بما هو شر، بل بما هو خير. فإن من يفعل الخير، يكون من الله. ومن يفعل الشر، يبين أنه لم يتعرف بالله قط."]]}], "kwAr": "واسع وراء البر", "noteAr": ""}, {"kw": "charity", "raw": "1Co_14:1", "note": "", "refs": [{"l": "1Co 14:1", "n": "", "vs": [[1, "اسعوا وراء المحبة، وتشوقوا إلى المواهب الروحية، بل بالأحرى موهبة التنبوء."]]}], "kwAr فسك في طريق التقوى."]]}, {"l": "1Ti 6:4", "n": "", "vs": [[4, "فهو قد انتفخ تكبرا، ولا يعرف شيئا، وإنما هو مهووس بالمجادلات والمنازعات الكلامية، ومنها ينشأ الحسد والخصام والتجريح والنيات السيئة،"]]}, {"l": "1Ti 6:5", "n": "", "vs": [[5, "وشتى أنواع النزاع بين أناس فاسدي العقول مجردين من الحق، يعتبرون التقوى تجارة."]]}, {"l": "Tit 3:9", "n": "", "vs": [[9, "أما المسائل السخيفة، وسلاسل النسب، والمخاصمات، والمنازعات حول الشريعة، فتجنبها، لأنها غير نافعة، وباطلة."]]}], "kwAr": "", "noteAr": ""}], "arS": [["أما ", []], ["المجادلات", ["G2214"]], [" ", []], ["الغبية", ["G3474"]], [" ", []], ["الحمقاء", ["G521"]], ["، ", []], ["فتجنبها", ["G3868"]], ["، ", []], ["عالما", ["G1492"]], [" أنها ", []], ["تولد", ["G1080"]], [" ", []], ["المشاجرات", ["G3163"]], [".", []]]}, {"c": 2, "v": 24, "text": "وعبد الرب يجب ألا يتشاجر، بل أن يكون مترفقا تجاه الجميع، قادرا على التعليم، يتحمل المشقات بصبر،", "groups": [{"kw": "the servant", "raw": "Deu_34:5; Jos_1:1; 2Ch_24:6; Dan_6:20; 1Ti_6:11; Tit_1:1, Tit_3:2; Jam_1:1", "note": "", "refs": [{"l": "Deu 34:5", "n": "", "vs": [[5, "فمات موسى عبد الرب في أرض موآب بموجب قول الرب."]]}, {"l": "Jos 1:1", "n": "", "vs": [[1, "بعد موت موسى عبد الرب، قال الرب ليشوع بن نون، خادم موسى:"]]}, {"l": "2Ch 24:6", "n": "", "vs": [[6, "فاستدعى الملك يهوياداع رئيس الكهنة وسأله: «لماذا لم تطلب من اللاويين أن يجمعوا من بني يهوذا وأورشليم الضريبة التي فرضها موسى عبد الرب وجماعة إسرائيل لصيانة خيمة الشهادة؟»."]]}, {"l": "Dan 6:20", "n": "", "vs": [[20, "فلما دنا منه نادى دانيآل بصوت حزين قائلا: «يادانيآل، عبد الله الحي، هل إلهك الذي تعبده دائما استطاع أن ينجيك من الأسود؟»"]]}, {"l": "1Ti 6:11", "n": "", "vs": [[11, "وأما أنت، ياإنسان الله، فاهرب من هذه الأمور، واسع في إثر البر والتقوى والإيمان والمحبة والصبر والوداعة."]]}, {"l": "Tit 1:1", "n": "", "vs": [[1, "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"]]}, {"l": "Tit 3:2", "n": "", "vs": [[2, "ولا يقولوا سوءا في أحد، ولا يكونوا مخاصمين، بل لطفاء يعاملون الجميع بوداعة تامة."]]}, {"l": "Jam 1:1", "n": "", "vs": [[1, "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"]]}], "kwAr": "وعبد الرب", "noteAr": ""}, {"kw": "must", "raw": "Mat_12:19; Act_15:2; 2Co_10:4; Phi_2:3, Phi_2:14; 1Ti_3:3; Tit_1:7; Jam_1:19, Jam_1:20; Jud_1:3", "note": "", "refs": [{"l": "Mat 12:19", "n": "", "vs": [[19, "لا يخاصم ولا يصرخ، ولا يسمع أحد صوته في الشوارع."]]}, {"l": "Act 15:2", "n": "", "vs": [[2, "فجادلهم بولس وبرنابا جدالا عنيفا. وبعد المناقشة قرر مؤمنو أنطاكية أن يذهب بولس وبرنابا مع بعض المؤمنين ليقابلوا الرسل والشيوخ في أورشليم، ويبحثوا معهم في هذه القضية."]]}, {"l": "2Co 10:4", "n": "", "vs": [[4, "فإن الأسلحة التي نحارب بها ليست جسدية، بل قادرة بالله على هدم الحصون: بها نهدم النظريات"]]}, {"l": "Phi 2:3", "n": "", "vs": [[3, "لا يكن بينكم شيء بروح التحزب والافتخار الباطل، بل بالتواضع ليعتبر كل واحد منكم غيره أفضل كثيرا من نفسه،"]]}, {"l": "Phi 2:14", "n": "", "vs": [[14, "فافعلوا كل شيء دون تذمر أو جدال،"]]}, {"l": "1Ti 3:3", "n": "", "vs": [[3, "لا مدمنا للخمر ولا عنيفا؛ بل لطيفا، غير متعود الخصام، غير مولع بالمال،"]]}, {"l": "Tit 1:7", "n": "", "vs": [[7, "وذلك لأن الناظر يجب أن يكون بريئا من كل تهمة باعتباره وكيلا لله، لا معجبا بنفسه ولا حاد الطبع، ولا مدمن الخمر، ولا عنيفا، ولا ساعيا إلى المكسب الخسيس؛"]]}, {"l": "Jam 1:19", "n": "", "vs": [[19, "لذلك، ياإخوتي الأحباء، على كل واحد منكم أن يكون مسرعا إلى الإصغاء، غير متسرع في الكلام، بطيء الغضب."]]}, {"l": "Jam 1:20", "n": "", "vs": [[20, "لأن الإنسان، إذا غضب، لا يعمل الصلاح الذي يريده الله ."]]}, {"l": "Jud 1:3", "n": "", "vs": [[3, "أيها الأحباء، كنت قد نويت أن أكتب إليكم في موضوع الخلاص الذي نشترك فيه جميعا. ولكن، أراني الآن مضطرا لأن أكتب لأشجعكم على الجهاد في سبيل الإيمان الذي سلم مرة واحدة للقديسين."]]}], "kwAr": "يجب", "noteAr": ""}, {"kw": "strive", "raw": "Joh_6:52; Act_7:26, Act_23:9; Jam_4:2 *Gr.", "note": "", "refs": [{"l": "Joh 6:52", "n": "", "vs": [[52, "فأثار هذا الكلام جدالا عنيفا بين اليهود، وتساءلوا: «كيف يقدر هذا أن يعطينا جسده لنأكله؟»"]]}, {"l": "Act 7:26", "n": "", "vs": [[26, "وفي اليوم التالي وجد اثنين من إخوته يتعاركان، فحاول أن يصلح بينهما، قائلا: أنتما أخوان، فلماذا يعتدي أحدكما على الآخر؟"]]}, {"l": "Act 23:9", "n": "", "vs": [[9, "وعلا الصياح، فوقف بعض علماء الشريعة الموالين للفريسيين، يحتجون بحماسة، فقالوا: «لا نجد على هذا الرجل ذنبا، فلربما كلمه روح أو ملاك!»"]]}, {"l": "Jam 4:2", "n": "*Gr.", "vs": [[2, "فأنتم ترغبون في امتلاك ما لا يخصكم، لكن ذلك لا يتحقق لكم، فتقتلون، وتحسدون، ولا تتمكنون من بلوغ غايتكم. وهكذا تتخاصمون وتتصارعون! إنكم لا تمتلكون ما تريدونه، لأنكم لا تطلبونه من الله."]]}], "kwAr": "ألا يتشاجر", "noteAr": ""}, {"kw": "but", "raw": "Isa_40:11; 2Co_10:1; Gal_5:22; 1Th_2:7; Tit_3:2; Jam_3:17; 1Pe_3:8", "note": "", "refs": [{"l": "Isa 40:11", "n": "", "vs": [[11, "يرعى قطيعه كراع، ويجمع الحملان بذراعه، وفي أحضانه يحملها ويقود المرضعات برفق."]]}, {"l": "2Co 10:1", "n": "", "vs": [[1, "ولكني أتوسل إليكم بوداعة المسيح وحلمه، أنا بولس «المتواضع وأنا حاضر بينكم، والجريء عليكم وأنا غائب عنكم»،"]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "1Th 2:7", "n": "", "vs": [[7, "مع أن لنا الحق في أن نفرض أنفسنا عليكم باعتبارنا رسلا للمسيح. ولكننا كنا مترفقين بكم كأم مرضع تحنو على أولادها."]]}, {"l": "Tit 3:2", "n": "", "vs": [[2, "ولا يقولوا سوءا في أحد، ولا يكونوا مخاصمين، بل لطفاء يعاملون الجميع بوداعة تامة."]]}, {"l": "Jam 3:17", "n": "", "vs": [[17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}, {"l": "1Pe 3:8", "n": "", "vs": [[8, "والخلاصة، كونوا جميعا متحدين في الرأي، متعاطفين بعضكم مع بعض، مبادلين أحدكم الآخر المحبة الأخوية، شفوقين، متواضعين."]]}], "kwAr": "بل أن يكون مترفقا", "noteAr": ""}, {"kw": "apt", "raw": "1Ti_3:2, 1Ti_3:3; Tit_1:9", "note": "", "refs": [{"l": "1Ti 3:2", "n": "", "vs": [[2, "إذن، يجب أن يكون الراعي بلا
