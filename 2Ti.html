", "vs": [[1, "أيها الأحباء، لا تصدقوا كل روح، بل امتحنوا الأرواح لتعرفوا ما إذا كانت من عند الله أم لا، لأن عددا كبيرا من الأنبياء الدجالين قد انتشر في العالم."]]}, {"l": "Rev 2:6", "n": "", "vs": [[6, "أما ما يسرني فيك فهو أنك تكره أعمال النيقولاويين التي أكرهها أنا أيضا."]]}, {"l": "Rev 2:14", "n": "", "vs": [[14, "ولكني عاتب عليك قليلا لأنك تتسامح مع القوم الذين يتمسكون بتعليم بلعام عندما علم الملك بالاق أن يدمر بني إسرائيل بتوريطهم في ارتكاب الزنى والأكل من الذبائح المقدمة للأصنام،"]]}, {"l": "Rev 2:15", "n": "", "vs": [[15, "هكذا عندك أنت أيضا قوم يتمسكون بتعاليم النيقولاويين!"]]}, {"l": "Rev 2:20", "n": "", "vs": [[20, "ولكن لي عليك أنك تتساهل مع هذه المرأة إيزابل، التي تدعي أنها نبية، فتعلم عبيدي وتغويهم أن يزنوا ويأكلوا من الذبائح المقدمة للأصنام."]]}], "kwAr": "يقاوم هؤلاء الحق", "noteAr": ""}, {"kw": "men", "raw": "Act_8:21, Act_8:22; Rom_1:28, Rom_16:18; 2Co_11:13-15; 1Ti_1:19, 1Ti_4:2, 1Ti_6:5; Tit_1:16; 2Pe_2:14; Jud_1:18, Jud_1:19", "note": "", "refs": [{"l": "Act 8:21", "n": "", "vs": [[21, "لا قسمة لك في هذا الأمر ولا نصيب، لأن قلبك ليس مخلصا تجاه الله."]]}, {"l": "Act 8:22", "n": "", "vs": [[22, "فتب عن شرك هذا واطلب إلى الله، عسى أن يغفر لك نية قلبك،"]]}, {"l": "Rom 1:28", "n": "", "vs": [[28, "وبما أنهم لم يتخيروا إبقاء الله ضمن معرفتهم، أسلمهم الله إلى ذهن عاطل عن التمييز دفعهم إلى ممارسة الأمور غير اللائقة."]]}, {"l": "Rom 16:18", "n": "", "vs": [[18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."]]}, {"l": "2Co 11:13-15", "n": "", "vs": [[13, "فإن أمثال هؤلاء هم رسل دجالون، عمال ماكرون، يظهرون أنفسهم بمظهر رسل المسيح."], [14, "ولا عجب! فالشيطان نفسه يظهر نفسه بمظهر ملاك نور."], [15, "فليس كثيرا إذن أن يظهر خدامه أنفسهم بمظهر خدام البر. وإن عاقبتهم ستكون على حسب أعمالهم."]]}, {"l": "1Ti 1:19", "n": "", "vs": [[19, "متمسكا بالإيمان، وبالضمير الصالح، هذا الضمير الذي تخلى عنه بعضهم، فانكسرت بهم سفينة الإيمان."]]}, {"l": "1Ti 4:2", "n": "", "vs": [[2, "في موجة رياء ينشرها معلمون دجالون لهم ضمائر كويت بالنار."]]}, {"l": "1Ti 6:5", "n": "", "vs": [[5, "وشتى أنواع النزاع بين أناس فاسدي العقول مجردين من الحق، يعتبرون التقوى تجارة."]]}, {"l": "Tit 1:16", "n": "", "vs": [[16, "يشهدون معترفين بأنهم يعرفون الله ، ولكنهم بأعمالهم ينكرونه، لأنهم مكروهون وغير طائعين، وقد تبين أنهم غير أهل لكل عمل صالح."]]}, {"l": "2Pe 2:14", "n": "", "vs": [[14, "عيونهم لا تنظر إلا نظرات الزنى، ولا تشبع من الخطيئة. وكم من نفوس ضعيفة تقع في فخاخهم! أما قلوبهم، فقد تدربت على الشهوة والطمع. إنهم حقا أبناء اللعنة!"]]}, {"l": "Jud 1:18", "n": "", "vs": [[18, "فقد سبق أن نبهوكم إلى أنه، في نهاية الزمان، سيطلع مستهزئون يعيشون منغمسين في شهواتهم الفاسقة."]]}, {"l": "Jud 1:19", "n": "", "vs": [[19, "هؤلاء هم الذين يسببون الانشقاق، وينساقون وراء غرائزهم الحيوانية، وليس الروح القدس فيهم!"]]}], "kwAr": "أناس عقولهم فاسدة", "noteAr": ""}, {"kw": "reprobate", "raw": "or, of no judgment, 2Co_13:5, 2Co_13:6", "note": "or, of no judgment, 2Co_13:5, 2Co_13:6", "refs": [{"l": "2Co 13:5", "n": "", "vs": [[5, "لذلك امتحنوا أنفسكم لتروا هل أنتم في الإيمان. اختبروا أنفسكم. ألستم تعرفون أنفسكم، أن يسوع المسيح فيكم، إلا إذا تبين أنكم فاشلون؟"]]}, {"l": "2Co 13:6", "n": "", "vs": [[6, "غير أني أرجو أنه سيتبين لكم أننا نحن لسنا فاشلين."]]}], "kwAr": "غير أهل للإيمان", "noteAr": "أو: عديمو التمييز (مرفوضون بعد الامتحان)."}], "arS": [["ومثلما ", []], ["قاوم", ["G436"]], [" (الساحران) ", []], ["ينيس", ["G2389"]], [" ", []], ["ويمبريس", ["G2387"]], [" ", []], ["موسى", ["G3475"]], ["، ", []], ["كذلك", ["G3779"]], [" أيضا ", []], ["يقاوم", ["G436"]], [" هؤلاء ", []], ["الحق", ["G225"]], ["؛ ", []], ["أناس", ["G444"]], [" ", []], ["عقولهم", ["G3563"]], [" ", []], ["فاسدة", ["G2704"]], ["، وقد تبين أنهم ", []], ["غير أهل", ["G96"]], [" ", []], ["للإيمان", ["G4102"]], [".", []]]}, {"c": 3, "v": 9, "text": "ولكنهم لن يزدادوا تقدما، لأن حماقتهم ستنكشف للجميع، مثلما انكشفت حماقة الرجلين المذكورين.", "groups": [{"kw": "their", "raw": "2Ti_3:8; Exo_7:12, Exo_8:18, Exo_8:19, Exo_9:11; 1Ki_22:25; Psa_76:10; Jer_28:15-17; Jer_29:21-23, Jer_29:31, Jer_29:32, Jer_37:19; Act_13:11, Act_19:15-17", "note": "", "refs": [{"l": "2Ti 3:8", "n": "", "vs": [[8, "ومثلما قاوم (الساحران) ينيس ويمبريس موسى، كذلك أيضا يقاوم هؤلاء الحق؛ أناس عقولهم فاسدة، وقد تبين أنهم غير أهل للإيمان."]]}, {"l": "Exo 7:12", "n": "", "vs": [[12, "فطرح كل واحد عصاه فتحولت إلى حية. غير أن عصا هرون ابتلعت عصيهم."]]}, {"l": "Exo 8:18", "n": "", "vs": [[18, "وكذلك حاول السحرة بسحرهم ليخرجوا البعوض فأخفقوا. وكان البعوض منتشرا على الناس والبهائم."]]}, {"l": "Exo 8:19", "n": "", "vs": [[19, "فقال السحرة لفرعون «هو فعل الله». ولكن قلب فرعون ظل متصلبا فلم يسمع لهما، تماما كما قال الرب."]]}, {"l": "Exo 9:11", "n": "", "vs": [[11, "ولم يستطع السحرة أن يواجهوا موسى من جراء الدمامل، لأن الدمامل أصابت السحرة وكل المصريين أيضا."]]}, {"l": "1Ki 22:25", "n": "", "vs": [[25, "فأجابه ميخا: «ستعرف ذلك في اليوم الذي تلجأ فيه للاختباء من مخدع إلى مخدع»."]]}, {"l": "Psa 76:10", "n": "", "vs": [[10, "حقا يحمدك غضب الإنسان، وما تبقى من الغضب تتمنطق أنت به."]]}, {"l": "Jer 28:15-17", "n": "", "vs": [[15, "وأضاف إرميا النبي مخاطبا حننيا المتنبيء: «اسمع ياحننيا، هذا ما يعلنه الرب: إن الرب لم يبعثك، وأنت جعلت هذا الشعب يصدق كذبك."], [16, "لذلك هكذا يعلن الرب: ها أنا أبيدك عن وجه الأرض فتموت في هذه السنة لأنك نطقت بالتمرد على الرب»."], [17, "وفي الشهر السابع من تلك السنة عينها مات حننيا."]]}, {"l": "Jer 29:21-23", "n": "", "vs": [[21, "يقول الرب القدير إله إسرائيل عن أخآب بن قولايا وعن صدقيا بن معسيا اللذين يتنبآن لكم باسمي زورا: «ها أنا أسلمهما ليد نبوخذناصر ملك بابل فيقتلهما على مرأى منكم،"], [22, "فيصبحان مثل لعنة بين جميع المسبيين من يهوذا في بابل، فيقال: ليجعلك الله نظير صدقيا وأخآب اللذين قلاهما ملك بابل بالنار،"], [23, "لأنهما ارتكبا الفواحش في إسرائيل وزنيا مع نساء أصحابهما وتنبآ باسمي نبوءات كاذبة لم آمرهما بها. فأنا العارف والشاهد» يقول الرب."]]}, {"l": "Jer 29:31", "n": "", "vs": [[31, "«ابعث إلى جميع المسبيين قائلا: هذا ما يعلنه الرب عن شمعيا النحلامي: بما أن شمعيا قد تنبأ لكم مع أني لم أرسله وجعلكم تصدقون الكذب،"]]}, {"l": "Jer 29:32", "n": "", "vs": [[32, "فلذلك يقول الرب: ها أنا أعاقب شمعيا وذريته فلا يمتد العمر بأحد منهم بين هذا الشعب ليشهد الخير الذي سأجريه على شعبي، لأنه نطق بالتمرد علي»."]]}, {"l": "Jer 37:19", "n": "", "vs": [[19, "وأين أنبياؤكم الذين تنبأوا لكم قائلين: إن ملك بابل لن يزحف عليكم وعلى هذه الأرض؟"]]}, {"l": "Act 13:11", "n": "", "vs": [[11, "الآن ستمتد يد الرب عليك، فتصير أعمى لا تبصر النور إلى حين». وفي الحال سقطت على عينيه غمامة مظلمة، فأخذ يدور طالبا من يقوده بيده!"]]}, {"l": "Act 19:15-17", "n": "", "vs": [[15, "فأجابهم الروح الشرير: «يسوع أنا أعرفه، وبولس أفهمه. ولكن، من أنتم؟»"], [16, "ثم هجم عليهم الرجل الذي به الروح الشرير، فتمكن منهم وغلبهم، فهربوا من البيت الذي كانوا فيه، عراة مجرحين."], [17, "فانتشر خبر ذلك بين اليهود واليونانيين الساكنين في أفسس، فاستولت الرهبة على الجميع. وتمجد اسم الرب يسوع."]]}], "kwAr": "حماقتهم", "noteAr": ""}], "arS": [["ولكنهم لن ", []], ["يزدادوا تقدما", ["G4298"]], ["، لأن ", []], ["حماقتهم", ["G454"]], [" ", []], ["ستنكشف", ["G1552"]], [" ", []], ["للجميع", ["G3956"]], ["، مثلما ", []], ["انكشفت", ["G1096"]], [" حماقة الرجلين المذكورين.", []]]}, {"c": 3, "v": 10, "text": "وأما أنت، فقد عرفت جيدا تعليمي، وسيرتي، وهدفي، وإيماني، وتحملي للمشقات، ومحبتي، وثباتي،", "groups": [{"kw": "thou hast fully known", "raw": "or, thou hast been a diligent follower of, Luk_1:3; Phi_2:22; 1Ti_4:6 *Gr.", "note": "or, thou hast been a diligent follower of, Luk_1:3; Phi_2:22; 1Ti_4:6 *Gr.", "refs": [{"l": "Luk 1:3", "n": "", "vs": [[3, "رأيت أنا أيضا، بعدما تفحصت كل شيء من أول الأمر تفحصا دقيقا، أن أكتبها إليك مرتبة ياصاحب السمو ثاوفيلس"]]}, {"l": "Phi 2:22", "n": "", "vs": [[22, "أما تيموثاوس، فأنتم تعرفون أنه مختبر، إذ خدم معي في التبشير بالإنجيل كأنه ولد يعاون أباه."]]}, {"l": "1Ti 4:6", "n": "*Gr.", "vs": [[6, "إن بسطت هذه الأمور أمام الإخوة، كنت خادما صالحا للمسيح يسوع، متغذيا بكلام الإيمان والتعليم الصالح الذي اتبعته تماما."]]}], "kwAr": "فقد عرفت جيدا", "noteAr": "أو: قد تتبّعت باجتهاد."}, {"kw": "my", "raw": "2Ti_3:16, 2Ti_3:17, 2Ti_4:3; Act_2:42; Rom_16:17; Eph_4:14; 1Ti_1:3, 1Ti_4:12, 1Ti_4:13; Tit_2:7; Heb_13:9; 2Jo_1:9, 2Jo_1:10", "note": "", "refs": [{"l": "2Ti 3:16", "n": "", "vs": [[16, "إن الكتاب بكل ما فيه، قد أوحى به الله؛ وهو مفيد للتعليم والتوبيخ والتقويم وتهذيب الإنسان في البر،"]]}, {"l": "2Ti 3:17", "n": "", "vs": [[17, "لكي يجعل إنسان الله مؤهلا تأهيلا كاملا، ومجهزا لكل عمل صالح."]]}, {"l": "2Ti 4:3", "n": "", "vs": [[3, "فإنه سيأتي زمان لا يطيق الناس فيه التعليم الصحيح، بل تبعا لشهواتهم الخاصة يكدسون لأنفسهم معلمين (يقولون لهم كلاما) يداعب الآذان."]]}, {"l": "Act 2:42", "n": "", "vs": [[42, "وكان الجميع يداومون على تلقي تعليم الرسل، وعلى حياة الشركة، وكسر الخبز، والصلوات."]]}, {"l": "Rom 16:17", "n": "", "vs": [[17, "ولكن، أتوسل إليكم، أيها الإخوة، أن تنتبهوا إلى مثيري الانقسامات والعثرات، خلافا للتعليم الذي تعلمتم، وأن تبتعدوا عنهم."]]}, {"l": "Eph 4:14", "n": "", "vs": [[14, "وذلك حتى لا نكون فيما بعد أطفالا تتقاذفنا وتحملنا كل ريح تعليم يقوم على خداع الناس والمكر بهم لجرهم إلى الضلال الملفق،"]]}, {"l": "1Ti 1:3", "n": "", "vs": [[3, "كما أوصيتك لما كنت منطلقا إلى مقاطعة مقدونية، (أطلب إليك) أن تبقى في مدينة أفسس، لكي تمنع بعض المعلمين من نشر التعاليم المخالفة للتعليم الصحيح،"]]}, {"l": "1Ti 4:12", "n": "", "vs": [[12, "لا يستخف أحد بحداثة سنك. وإنما كن قدوة للمؤمنين، في الكلام والسلوك والمحبة والإيمان والطهارة."]]}, {"l": "1Ti 4:13", "n": "", "vs": [[13, "إلى حين وصولي، انصرف إلى تلاوة الكتاب، وإلى الوعظ، وإلى التعليم."]]}, {"l": "Tit 2:7", "n": "", "vs": [[7, "جاعلا من نفسك في كل شيء قدوة للأعمال الصالحة، مظهرا في تعليمك النقاوة والوقار"]]}, {"l": "Heb 13:9", "n": "", "vs": [[9, "فلا تنخدعوا وتتبعوا تلك التعاليم الغريبة المتنوعة ... فمن الأفضل أن يثبت القلب بالنعمة لا بنظم الأطعمة التي لم تنفع المتقيدين بها."]]}, {"l": "2Jo 1:9", "n": "", "vs": [[9, "لأن من تعدى تعليم المسيح ولم يثبت فيه، فليس الله من نصيبه. أما من يثبت في هذا التعليم، فله الآب والابن معا."]]}, {"l": "2Jo 1:10", "n": "", "vs": [[10, "إن جاءكم أحد بغير هذا التعليم، فلا تستقبلوه في بيتكم، ولا تبادلوه التحية."]]}], "kwAr": "تعليمي", "noteAr": ""}, {"kw": "manner", "raw": "Act_20:18, Act_26:4; 1Th_1:5; 2Pe_3:11", "note": "", "refs": [{"l": "Act 20:18", "n": "", "vs": [[18, "فلما جاءوا إليه، قال لهم:"]]}, {"l": "Act 26:4", "n": "", "vs": [[4, "إن اليهود جميعا يعرفون نشأتي من البداية. فقد عشت بين شعبي في أورشليم منذ صغري."]]}, {"l": "1Th 1:5", "n": "", "vs": [[5, "لأن تبشيرنا لكم بالإنجيل لم يكن مجرد كلام، بل كان مصحوبا أيضا بالقوة وبالروح القدس وبتمام اليقين. كما أنكم تعلمون تماما ماذا كنا بينكم لأجل مصلحتكم،"]]}, {"l": "2Pe 3:11", "n": "", "vs": [[11, "ومادامت هذه الأشياء جميعا ستنحل، فكيف يجب أن تكونوا أنتم أصحاب سلوك مقدس يتصف بالتقوى،"]]}], "kwAr": "وسيرتي", "noteAr": ""}, {"kw": "purpose", "raw": "Dan_1:8; Act_11:23; 2Co_1:17", "note": "", "refs": [{"l": "Dan 1:8", "n": "", "vs": [[8, "أما دانيآل فقد عزم في نفسه أن لا يتنجس بأطايب مأكولات الملك ولا بخمر شرابه، وطلب من رئيس الخصيان أن يعفيه من ذلك."]]}, {"l": "Act 11:23", "n": "", "vs": [[23, "فلما وصل ورأى النعمة التي منحها الله ، امتلأ فرحا، وحث الجميع على الثبات في الرب بعزم القلب."]]}, {"l": "2Co 1:17", "n": "", "vs": [[17, "فهل تظنون أني باعتمادي لهذه الخطة تصرفت بخفة، أو أني أتخذ قراراتي وفقا لمنطق البشر، ليكون في كلامي نعم نعم ولا لا في آن واحد؟"]]}], "kwAr": "وهدفي", "noteAr": ""}, {"kw": "faith", "raw": "2Ti_2:22; 2Co_6:4-10; 1Ti_4:12, 1Ti_6:11; 2Pe_1:5-7", "note": "", "refs": [{"l": "2Ti 2:22", "n": "", "vs": [[22, "إنما اهرب من الشهوات الشبابية، واسع وراء البر والإيمان والمحبة والسلام، مشاركا الذين يدعون الرب من قلب نقي."]]}, {"l": "2Co 6:4-10", "n": "", "vs": [[4, "وإنما نتصرف في كل شيء بما يبين أننا فعلا خدام الله: في تحمل الكثير؛ في الشدائد والحاجات والضيقات والجلدات"], [5, "والسجون والاضطرابات والأتعاب والسهر والصوم؛"], [6, "في الطهارة والمعرفة وطول البال واللطف؛ في الروح القدس والمحبة الخالصة من الرياء؛"], [7, "في كلمة الحق وقدرة الله؛ بأسلحة البر في الهجوم والدفاع؛"], [8, "بالكرامة والهوان؛ بالصيت السييء والصيت الحسن. نعامل كمضللين ونحن صادقون،"], [9, "كمجهولين ونحن معروفون، كمائتين وها نحن نحيا ، كمعاقبين ولا نقتل،"], [10, "كمحزونين ونحن دائما فرحون، كفقراء ونحن نغني كثيرين، كمن لا شيء عندهم ونحن نملك كل شيء."]]}, {"l": "1Ti 4:12", "n": "", "vs": [[12, "لا يستخف أحد بحداثة سنك. وإنما كن قدوة للمؤمنين، في الكلام والسلوك والمحبة والإيمان والطهارة."]]}, {"l": "1Ti 6:11", "n": "", "vs": [[11, "وأما أنت، ياإنسان الله، فاهرب من هذه الأمور، واسع في إثر البر والتقوى والإيمان والمحبة والصبر والوداعة."]]}, {"l": "2Pe 1:5-7", "n": "", "vs": [[5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"], [6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"], [7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."]]}], "kwAr": "وإيماني", "noteAr": ""}], "arS": [["وأما أنت، فقد ", []], ["عرفت جيدا", ["G3877"]], [" ", []], ["تعليمي", ["G1319", "G3450"]], ["، ", []], ["وسيرتي", ["G72"]], ["، ", []], ["وهدفي", ["G4286"]], ["، ", []], ["وإيماني", ["G4102"]], ["، ", []], ["وتحملي للمشقات", ["G3115"]], ["، ", []], ["ومحبتي", ["G26"]], ["، ", []], ["وثباتي", ["G5281"]], ["،", []]]}, {"c": 3, "v": 11, "text": "واضطهاداتي، وآلامي تلك التي حدثت لي في مدن أنطاكية وإيقونية ولسترة وغيرها؛ وكم احتملت من اضطهادات، والرب أنقذني منها جميعا!", "groups": [{"kw": "Persecutions", "raw": "Act_9:16, Act_20:19, Act_20:23, Act_20:24; Rom_8:35-37; 1Co_4:9-11; 2Co_1:8-10, 2Co_4:8-11; 2Co_11:23-28; Heb_10:33-34", "note": "", "refs": [{"l": "Act 9:16", "n": "", "vs": [[16, "وسأريه كم ينبغي أن يتألم من أجل اسمي!»"]]}, {"l": "Act 20:19", "n": "", "vs": [[19, "فقد كنت أخدم الرب بكل تواضع، وبكثير من الدموع، وأنا أعاني المحن التي أصابتني بها مؤامرات اليهود."]]}, {"l": "Act 20:23", "n": "", "vs": [[23, "إلا أن الروح القدس كان يعلن لي في كل مدينة أذهب إليها أن السجن والمصاعب تنتظرني"]]}, {"l": "Act 20:24", "n": "", "vs": [[24, "ولكني لا أحسب لحياتي أية قيمة، ما دمت أسعى إلى بلوغ غايتي وإتمام الخدمة التي كلفني إياها الرب يسوع: أن أشهد ببشارة نعمة الله."]]}, {"l": "Rom 8:35-37", "n": "", "vs": [[35, "فمن سيفصلنا عن محبة المسيح لنا؟ هل الشدة أم الضيق أم الاضطهاد أم الجوع أم العري أم الخطر أم السيف؟"], [36, "بل كما قد كتب: «إننا من أجلك نعاني الموت طول النهار. قد حسبنا كأننا غنم للذبح!»"], [37, "ولكننا، في جميع هذه الأمور، نحرز ما يفوق الانتصار على يد من أحبنا."]]}, {"l": "1Co 4:9-11", "n": "", "vs": [[9, "فإني أرى أن الله عرضنا، نحن الرسل، في آخر الموكب كأنه محكوم علينا بالموت، لأننا صرنا معرضا للعالم، للملائكة والبشر معا."], [10, "نحن جهلاء من أجل المسيح، وأنتم حكماء في المسيح. نحن ضعفاء وأنتم أقوياء. أنتم مكرمون ونحن مهانون."], [11, "فما زلنا حتى هذه الساعة نجوع ونعطش، ونعرى ونلطم ونحرم محلا للإقامة"]]}, {"l": "2Co 1:8-10", "n": "", "vs": [[8, "فيا أيها الإخوة، نريد أن لا يخفى عليكم أمر الضيقة التي مررنا بها في مقاطعة أسيا. فقد كانت وطأتها علينا شديدة جدا وفوق طاقتنا، حتى يئسنا من الحياة نفسها."], [9, "ولكننا شعرنا، في قرارة أنفسنا، أنه محكوم علينا بالموت، حتى نكون متكلين لا على أنفسنا بل على الله الذي يقيم الأموات؛"], [10, "وقد أنقذنا من هذا الموت الشنيع، ومازال ينقذنا حتى الآن، ولنا ملء الثقة بأنه حقا سينقذنا فيما بعد؛"]]}, {"l": "2Co 4:8-11", "n": "", "vs": [[8, "فالصعوبات تضيق علينا من كل جهة، ولكن لا ننهار. لا نجد حلا مناسبا، ولكن لا نيأس."], [9, "يطاردنا الاضطهاد، ولكن لا يتخلى الله عنا. نطرح أرضا، ولكن لا نموت."], [10, "وحيثما ذهبنا، نحمل موت يسوع دائما في أجسادنا لتظهر فيها أيضا حياة يسوع."], [11, "فمع أننا مازلنا أحياء، فإننا نسلم دائما إلى الموت من أجل يسوع، لتظهر في أجسادنا الفانية حياة يسوع أيضا."]]}, {"l": "2Co 11:23-28", "n": "", "vs": [[23, "وإن كانوا خدام المسيح، أتكلم كأني فقدت صوابي، فأنا متفوق عليهم: في الأتعاب أوفر منهم جدا، في الجلدات فوق الحد، في السجون أوفر جدا، في التعرض للموت أكثر مرارا."], [24, "من اليهود تلقيت الجلد خمس مرات، كل مرة أربعين جلدة إلا واحدة."], [25, "ضربت بالعصي ثلاث مرات. رجمت بالحجارة مرة. تحطمت بي السفينة ثلاث مرات. قضيت في عرض البحر يوما بنهاره وليله."], [26, "سافرت أسفارا عديدة؛ وواجهتني أخطار السيول الجارفة، وأخطار قطاع الطرق، وأخطار من بني جنسي، وأخطار من الأمم، وأخطار في المدن، وأخطار في البراري، وأخطار في البحر، وأخطار بين إخوة دجالين."], [27, "وكم عانيت من التعب والكد والسهر الطويل، والجوع والعطش والصوم الكثير، والبرد والعري."], [28, "وفضلا عن هذه المخاطر الخارجية، يزداد علي الضغط يوما بعد يوم، إذ أحمل هم جميع الكنائس."]]}, {"l": "Heb 10:33-34", "n": "", "vs": [[33, "وذلك عندما تعرضتم للإهانات والمضايقات من جهة، وعندما شاركتم الذين عوملوا مثل هذه المعاملة من جهة أخرى."], [34, "فقد تعاطفتم مع المسجونين، كما تقبلتم نهب ممتلكاتكم بفرح، علما منكم بأن لكم في السماء ثروة أفضل وأبقى."]]}], "kwAr": "واضطهاداتي", "noteAr": ""}, {"kw": "at Antioch", "raw": "Act_13:45, Act_13:50,Act_13:51, Act_14:2, Act_14:5, Act_14:6, Act_14:19-21", "note": "", "refs": [{"l": "Act 13:45", "n": "", "vs": [[45, "فلما رأى اليهود الجموع ملأت الغيرة صدورهم، وأخذوا يعارضون كلام بولس مجدفين."]]}, {"l": "Act 13:50", "n": "", "vs": [[50, "ولكن اليهود حرضوا النساء النبيلات والمتعبدات ووجهاء المدينة، وأثاروا الاضطهاد على بولس وبرنابا، حتى طردوهما من بلدهم،"]]}, {"l": "Act 13:51", "n": "", "vs": [[51, "فنفضا عليهم غبار أقدامهما وتوجها إلى مدينة إيقونية."]]}, {"l": "Act 14:2", "n": "", "vs": [[2, "ولكن اليهود الذين لم يؤمنوا أثاروا غير اليهود على الإخوة، وأفسدوا عقولهم."]]}, {"l": "Act 14:5", "n": "", "vs": [[5, "ولما أوشك غير اليهود واليهود ورؤساؤهم أن يهينوا الرسولين ويرجموهما بالحجارة،"]]}, {"l": "Act 14:6", "n": "", "vs": [[6, "علما بذلك فهربا إلى مدينتي لسترة ودربة الواقعتين في مقاطعة ليكأونية، وإلى المنطقة المحيطة بهما،"]]}, {"l": "Act 14:19-21", "n": "", "vs": [[19, "بعد ذلك جاء بعض اليهود من أنطاكية وإيقونية، واستمالوا الجموع، فرجموا بولس حتى ظنوا أنه مات، وجروه إلى خارج المدينة."], [20, "ولما أحاط به التلاميذ، قام وعاد إلى المدينة. وفي اليوم التالي سافر مع برنابا إلى دربة،"], [21, "وبشرا أهلها، فصار كثيرون منهم تلاميذ للرب. ثم رجعا إلى لسترة، ومنها إلى إيقونية، وأخيرا إلى أنطاكية."]]}], "kwAr": "أنطاكية", "noteAr": ""}, {"kw": "but", "raw": "2Ti_4:7, 2Ti_4:17, 2Ti_4:18; Gen_48:16; 2Sa_22:1, 2Sa_22:49; Job_5:19, Job_5:20; Psa_34:19, Psa_37:40; Psa_91:2-6, Psa_91:14; Isa_41:10,Isa_41:14, Isa_43:2; Jer_1:19; Dan_6:27; Act_9:23-25; Act_21:32, Act_21:33, Act_23:10,Act_23:12-24, Act_25:3, Act_25:4, Act_26:17, Act_26:22; 2Co_1:10; 2Pe_2:9", "note": "", "refs": [{"l": "2Ti 4:7", "n": "", "vs": [[7, "قد جاهدت الجهاد الحسن، قد بلغت نهاية الشوط، قد حافظت على الإيمان."]]}, {"l": "2Ti 4:17", "n": "", "vs": [[17, "إلا أن الرب وقف بجانبي وأمدني بالقوة، لكي تتم بي المناداة بالبشارة، فيسمعها جميع من هم من الأمم؛ وقد نجوت من فم الأسد."]]}, {"l": "2Ti 4:18", "n": "", "vs": [[18, "وسينجيني الرب من كل عمل شرير ويحفظني سالما لملكوته السماوي. فله المجد إلى أبد الآبدين آمين!"]]}, {"l": "Gen 48:16", "n": "", "vs": [[16, "الملاك الذي أنقذني من كل شر، يبارك الغلامين، وليدع عليهما اسمي واسما أبوي إبراهيم وإسحق، وليكثرا كثيرا في الأرض»."]]}, {"l": "2Sa 22:1", "n": "", "vs": [[1, "وخاطب داود الرب بأبيات هذا النشيد في اليوم الذي أنقذه فيه الرب من كل أعدائه، ومن شاول:"]]}, {"l": "2Sa 22:49", "n": "", "vs": [[49, "منقذي من أعدائي، رافعي على المتمردين ومن الرجل الطاغي يخلصني"]]}, {"l": "Job 5:19", "n": "", "vs": [[19, "من ست بلايا ينجيك، وفي سبع لا يقع بك أذى."]]}, {"l": "Job 5:20", "n": "", "vs": [[20, "يفديك من الموت جوعا، وفي الحرب من الموت بحد السيف."]]}, {"l": "Psa 34:19", "n": "", "vs": [[19, "ما أكثر مصائب الصديق، ولكن من جميعها ينقذه الرب."]]}, {"l": "Psa 37:40", "n": "", "vs": [[40, "يعينهم الرب حقا، وينقذهم من الأشرار، ويخلصهم لأنهم احتموا به."]]}, {"l": "Psa 91:2-6", "n": "", "vs": [[2, "أقول للرب: أنت ملجإي وحصني، إلهي الذي به وثقت"], [3, "لأنه ينقذك حقا من فخ الصياد ومن الوباء المهلك."], [4, "بريشه الناعم يظللك، وتحت أجنحته تحتمي، فتكون لك وعوده الأمينة ترسا ومتراسا،"], [5, "فلا تخاف من هول الليل ولا من سهم يطير في النهار."], [6, "ولا من وباء يسري في الظلام، ولا من هلاك يفسد في الظهيرة."]]}, {"l": "Psa 91:14", "n": "", "vs": [[14, "قال الرب: أنجيه لأنه تعلق بي. أرفعه لأنه عرف اسمي."]]}, {"l": "Isa 41:10", "n": "", "vs": [[10, "لا تخف لأني معك. لا تتلفت حولك جزعا، لأني إلهك، أشددك وأعينك وأعضدك بيمين بري"]]}, {"l": "Isa 41:14", "n": "", "vs": [[14, "لا تخف يايعقوب الضعيف كالحشرة، وياإسرائيل العليل كالشرذمة، لأني سأعينك، يقول الرب فاديك قدوس إسرائيل."]]}, {"l": "Isa 43:2", "n": "", "vs": [[2, "إذا اجتزت في وسط المياه أكون معك، وإن خضت الأنهار لا تغمرك. إن عبرت في النار لا تلذعك. واللهيب لا يحرقك."]]}, {"l": "Jer 1:19", "n": "", "vs": [[19, "فيحاربونك ولكن لا يقهرونك، لأني أنا معك لأنقذك يقول الرب»."]]}, {"l": "Dan 6:27", "n": "", "vs": [[27, "هو ينجي وينقذ ويجري الآيات والعجائب في السماوات والأرض، وهو الذي خلص دانيآل من أنياب الأسود»."]]}, {"l": "Act 9:23-25", "n": "", "vs": [[23, "وبعد عدة أيام، حاك اليهود في دمشق مؤامرة لقتل شاول،"], [24, "فعلم بها. وكانوا يراقبون أبواب المدينة نهارا وليلا ليقتلوه وهو يخرج منها."], [25, "فأخذه بعض التلاميذ ليلا ووضعوه في سل، وأنزلوه بالحبال من على سور المدينة."]]}, {"l": "Act 21:32", "n": "", "vs": [[32, "فأخذ في الحال جماعة من الجنود وقواد المئات وحضر مسرعا. ولما رأى اليهود القائد وجنوده كفوا عن ضرب بولس."]]}, {"l": "Act 21:33", "n": "", "vs": [[33, "فاقترب القائد وألقى القبض عليه، وأمر جنوده أن يقيدوه بسلسلتين، وأخذ يسأل: «من هو، وماذا فعل؟»"]]}, {"l": "Act 23:10", "n": "", "vs": [[10, "وتفاقم الخلاف حتى خاف القائد أن يشقوا بولس شقين، فأمر الجنود أن ينزلوا ويخطفوه من بينهم ويعيدوه إلى الثكنة."]]}, {"l": "Act 23:12-24", "n": "", "vs": [[12, "ولما طلع الصباح حاك بعض اليهود مؤامرة لقتل بولس، وحرموا على أنفسهم الطعام والشراب إلى أن يقتلوه."], [13, "وكان عدد الذين حاكوا هذه المؤامرة نحو أربعين رجلا."], [14, "وذهبوا إلى رؤساء الكهنة والشيوخ وقالوا: «حرام علينا الطعام والشراب حتى نقتل بولس."], [15, "فاطلبوا من القائد بصفتكم أعضاء المجلس، أن يحضر بولس بحجة إعادة النظر في قضيته، ونحن مستعدون لاغتياله قبل وصوله إلى المجلس!»"], [16, "ولكن خبر هذه المؤامرة تسرب إلى ابن أخت بولس، فتوجه إلى الثكنة وأخبره بذلك."], [17, "فاستدعى بولس أحد قواد المئات وطلب إليه أن يأخذ ابن أخته إلى القائد ليخبره بأمر هام."], [18, "فأخذه إلى القائد وقال: «استدعاني السجين بولس وطلب أن أحضر هذا الشاب إليك، لأن عنده أمرا هاما يريد أن يخبرك به»."], [19, "فأمسك القائد الشاب بيده، وانفرد به، وسأله: «ما الأمر الذي تريد أن تخبرني به؟»"], [20, "فقال: «حاك اليهود مؤامرة على بولس، وسيطلبون منك أن تحضره إلى مجلسهم، بحجة إعادة النظر في قضيته،"], [21, "فلا تقبل طلبهم، لأن أكثر من أربعين رجلا منهم حرموا على أنفسهم الطعام والشراب ونصبوا كمينا لاغتياله، وهم الآن مستعدون لذلك، وينتظرون تلبية طلبهم!»"], [22, "فصرف القائد الشاب بعدما قال له: «لا تخبر أحدا بما أعلمتني به!»"], [23, "ودعا اثنين من قواد المئات لديه، وأمرهما قائلا: «جهزا مئتي جندي ليذهبوا إلى قيصرية الساعة التاسعة مساء الليلة ومعهم سبعون فارسا ومئتا حامل رمح،"], [24, "وبعض الدواب لتحمل بولس وتوصله سالما إلى الحاكم فيلكس»."]]}, {"l": "Act 25:3", "n": "", "vs": [[3, "بإلحاح أن يكرمهم بإحضار بولس إلى أورشليم. وكانوا قد نصبوا له كمينا على الطريق ليغتالوه."]]}, {"l": "Act 25:4", "n": "", "vs": [[4, "فأجابهم فستوس بأن بولس سيبقى محتجزا في قيصرية وأنه هو سيعود إليها بعد فترة قصيرة."]]}, {"l": "Act 26:17", "n": "", "vs": [[17, "وسأنقذك من شعبك ومن الأمم التي أرسلك إليها الآن،"]]}, {"l": "Act 26:22", "n": "", "vs": [[22, "ولكن الله حفظني حتى هذا اليوم، وبمعونته أقف أمام البسطاء والعظماء شاهدا له ولست أحيد عما تنبأ به موسى والأنبياء،"]]}, {"l": "2Co 1:10", "n": "", "vs": [[10, "وقد أنقذنا من هذا الموت الشنيع، ومازال ينقذنا حتى الآن، ولنا ملء الثقة بأنه حقا سينقذنا فيما بعد؛"]]}, {"l": "2Pe 2:9", "n": "", "vs": [[9, "وهكذا نرى أن الرب يعرف أن ينقذ الأتقياء من المحنة، ويحفظ الأشرار محبوسين ليحكم عليهم بالعقاب في يوم الدينونة."]]}], "kwAr": "والرب أنقذني", "noteAr": ""}], "arS": [["واضطهاداتي", ["G1375"]], ["، ", []], ["وآلامي", ["G3804"]], [" تلك التي ", []], ["حدثت", ["G1096"]], [" لي في مدن ", []], ["أنطاكية", ["G490"]], [" ", []], ["وإيقونية", ["G2430"]], [" ", []], ["ولسترة", ["G3082"]], [" وغيرها؛ وكم ", []], ["احتملت", ["G5297"]], [" من ", []], ["اضطهادات", ["G1375"]], ["، ", []], ["والرب", ["G2962"]], [" ", []], ["أنقذني", ["G4506"]], [" منها ", []], ["جميعا", ["G3956"]], ["!", []]]}, {"c": 3, "v": 12, "text": "وحقا، إن جميع الذين يعزمون أن يعيشوا عيشة التقوى في المسيح يسوع يضطهدون.", "groups": [{"kw": "live", "raw": "2Co_1:12; 1Ti_2:2, 1Ti_3:16, 1Ti_6:3; Tit_1:1, Tit_2:12; 2Pe_3:11", "note": "", "refs": [{"l": "2Co 1:12", "n": "", "vs": [[12, "فإن فخرنا هو هذا: شهادة ضميرنا بأننا، في قداسة الله وإخلاصه، قد سلكنا في العالم، وبخاصة تجاهكم؛ ولم يكن ذلك بحكمة بشرية بل بنعمة الله."]]}, {"l": "1Ti 2:2", "n": "", "vs": [[2, "ولأجل الملوك وأصحاب السلطة، لكي نعيش حياة مطمئنة هادئة كلية التقوى والرصانة."]]}, {"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}, {"l": "1Ti 6:3", "n": "", "vs": [[3, "أما إذا كان أحد يعلم ما يخالفها ولا يذعن للكلام الصحيح، كلام ربنا يسوع المسيح، وللتعليم الموافق للتقوى،"]]}, {"l": "Tit 1:1", "n": "", "vs": [[1, "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"]]}, {"l": "Tit 2:12", "n": "", "vs": [[12, "وهي تعلمنا أن نقطع علاقتنا بالإباحية والشهوات العالمية، وأن نحيا في العصر الحاضر حياة التعقل والبر والتقوى،"]]}, {"l": "2Pe 3:11", "n": "", "vs": [[11, "ومادامت هذه الأشياء جميعا ستنحل، فكيف يجب أن تكونوا أنتم أصحاب سلوك مقدس يتصف بالتقوى،"]]}], "kwAr": "يعيشوا عيشة التقوى", "noteAr": ""}, {"kw": "shall", "raw": "Jos_17:14; Psa_37:12-15; Mat_5:10-12, Mat_10:22-25, Mat_16:24, Mat_23:34; Mar_10:30; Luk_14:26, Luk_14:27; Joh_15:19-21, Joh_16:2, Joh_16:33, Joh_17:14; Act_14:22; 1Co_15:19; 1Th_3:3, 1Th_3:4; Heb_11:32-38; 1Pe_2:20,1Pe_2:21, 1Pe_3:14, 1Pe_4:12-16, 1Pe_5:9, 1Pe_5:10; Rev_1:9, Rev_1:10, Rev_7:14, Rev_12:4, Rev_12:7-10", "note": "", "refs": [{"l": "Jos 17:14", "n": "", "vs": [[14, "وقال أبناء يوسف ليشوع: «لماذا وهبتنا نصيبا واحدا وحصة واحدة ونحن شعب وافر العدد، إذ إن الرب قد باركنا حتى الآن؟»"]]}, {"l": "Psa 37:12-15", "n": "", "vs": [[12, "يكيد الشرير كثيرا للصديق ويصر عليه بأسنانه."], [13, "ولكن الرب يضحك منه لأنه يرى أن يوم عقابه آت."], [14, "قد سل الأشرار سيوفهم ووتروا أقواسهم ليصرعوا المسكين والفقير، ليقتلوا السالكين طريقا مستقيمة."], [15, "لكن سيوفهم ستخترق قلوبهم وتتكسر أقواسهم."]]}, {"l": "Mat 5:10-12", "n": "", "vs": [[10, "طوبى للمضطهدين من أجل البر، فإن لهم ملكوت السماوات."], [11, "طوبى لكم متى أهانكم الناس واضطهدوكم، وقالوا فيكم من أجلي كل سوء كاذبين."], [12, "افرحوا وتهللوا، فإن مكافأتكم في السماوات عظيمة. فإنهم هكذا اضطهدوا الأنبياء من قبلكم!"]]}, {"l": "Mat 10:22-25", "n": "", "vs": [[22, "وتكونون مكروهين لدى الجميع من أجل اسمي. ولكن من يثبت إلى النهاية، هو الذي يخلص."], [23, "فإذا اضطهدوكم في مدينة ما، فاهربوا إلى غيرها. فإني الحق أقول لكم: لن تفرغوا من مدن إسرائيل إلى أن يأتي ابن الإنسان."], [24, "ليس التلميذ أرفع من المعلم، ولا العبد أرفع من سيده."], [25, "يكفي التلميذ أن يصير مثل معلمه، والعبد مثل سيده! إن كانوا قد لقبوا رب البيت ببعلزبول، فكم بالأحرى يلقبون أهل بيته؟"]]}, {"l": "Mat 16:24", "n": "", "vs": [[24, "ثم قال يسوع لتلاميذه: «إن أراد أحد أن يسير ورائي، فلينكر نفسه ويحمل صليبه ويتبعني."]]}, {"l": "Mat 23:34", "n": "", "vs": [[34, "لذلك: ها أنا أرسل إليكم أنبياء وحكماء ومعلمين، فبعضهم تقتلون وتصلبون، وبعضهم تجلدون في مجامعكم، وتطاردونهم من مدينة إلى أخرى."]]}, {"l": "Mar 10:30", "n": "", "vs": [[30, "إلا وينال مئة ضعف الآن في هذا الزمان، وفي الزمان الآتي الحياة الأبدية."]]}, {"l": "Luk 14:26", "n": "", "vs": [[26, "«إن جاء إلي أحد، ولم يبغض أباه وأمه وزوجته وأولاده وإخوته وأخواته، بل نفسه أيضا، فلا يمكنه أن يكون تلميذا لي."]]}, {"l": "Luk 14:27", "n": "", "vs": [[27, "ومن لا يحمل صليبه ويتبعني، فلا يمكنه أن يكون تلميذا لي."]]}, {"l": "Joh 15:19-21", "n": "", "vs": [[19, "لو كنتم من أهل العالم، لكان العالم يحب أهله، ولكن لأنكم لستم من أهل العالم، بل إني اخترتكم من وسط العالم، لذلك يبغضكم العالم."], [20, "اذكروا الكلمة التي قلتها لكم: ليس عبد أعظم من سيده. فإن كان أهل العالم قد اضطهدوني، فسوف يضطهدونكم؛ وإن كانوا قد عملوا بكلمتي، فسوف يعملون بكلمتكم."], [21, "ولكنهم سيفعلون هذا كله بكم من أجل اسمي، لأنهم لا يعرفون الذي أرسلني."]]}, {"l": "Joh 16:2", "n": "", "vs": [[2, "ستطردون خارج المجامع، بل سيأتي وقت يظن فيه من يقتلكم أنه يؤدي خدمة لله."]]}, {"l": "Joh 16:33", "n": "", "vs": [[33, "أخبرتكم بهذا كله ليكون لكم في سلام. فإنكم في العالم ستقاسون الضيق. ولكن تشجعوا، فأنا قد انتصرت على العالم!»"]]}, {"l": "Joh 17:14", "n": "", "vs": [[14, "أبلغتهم كلمتك، فأبغضهم العالم لأنهم ليسوا من العالم."]]}, {"l": "Act 14:22", "n": "", "vs": [[22, "وفي هذه الأماكن كلها كانا يشددان عزيمة التلاميذ، ويحثانهم على الثبات في الإيمان، مؤكدين لهم أن دخول ملكوت الله يقتضي أن نقاسي صعوبات كثيرة."]]}, {"l": "1Co 15:19", "n": "", "vs": [[19, "ولو كان رجاؤنا في المسيح يقتصر على هذه الحياة، لكنا أشقى الناس جميعا!"]]}, {"l": "1Th 3:3", "n": "", "vs": [[3, "حتى لا يتزعزع أحد منكم من جراء هذه الضيقات. فإنكم تعلمون أننا معينون لذلك؛"]]}, {"l": "1Th 3:4", "n": "", "vs": [[4, "وقد سبق لنا، لما كنا عندكم أن أخبرناكم أننا سنقاسي الضيقات، الأمر الذي حدث بعد ذلك كما تعلمون."]]}, {"l": "Heb 11:32-38", "n": "", "vs": [[32, "وهل من حاجة بعد لمزيد من الأمثلة؟ إن الوقت لا يتسع لي حتى أسرد أخبار الإيمان عن: جدعون وباراق وشمشون ويفتاح وداود وصموئيل والأنبياء."], [33, "فبالإيمان، تغلب هؤلاء على ممالك الأعداء، وحكموا حكما عادلا ونالوا ما وعدهم به الله . وبه، أطبقوا أفواه الأسود،"], [34, "وأبطلوا قوة النار، ونجوا من الموت قتلا بالسيف. وبه أيضا نالوا القوة بعد ضعف، فصاروا أشداء في المعارك، وردوا جيوشا غريبة على أعقابها."], [35, "وبالإيمان، استرجعت بعض النساء أمواتهن بعدما أعيدوا إلى الحياة. وبه، تحمل كثيرون العذاب والضرب، وماتوا رافضين النجاة لعلمهم أنهم سوف يقومون إلى حياة أفضل."], [36, "وكثيرون غيرهم تحملوا المحاكمات الظالمة تحت الإهانة والجلد، والإلقاء في السجون مقيدين بالسلاسل."], [37, "ومنهم من حوكموا فماتوا رجما بالحجارة، أو نشرا بالمنشار، أو ذبحا بالسيف. وبعضهم، تشردوا متسترين بجلود الغنم والمعزى، يعانون من الحاجة والضيق والظلم،"], [38, "ولم يكن العالم يستحقهم، تائهين في البراري والجبال والمغاور والكهوف."]]}, {"l": "1Pe 2:20", "n": "", "vs": [[20, "فبالحقيقة، أي مجد لكم إن كنتم تصبرون وأنتم تتحملون قصاص أخطائكم؟ لا فضل لكم عند الله إلا إذا تحملتم الآلام صابرين، وأنتم تفعلون الصواب."]]}, {"l": "1Pe 2:21", "n": "", "vs": [[21, "لأن الله دعاكم إلى الاشتراك في هذا النوع من الآلام. فالمسيح، الذي تألم لأجلكم، هو القدوة التي تقتدون بها. فسيروا على آثار خطواته:"]]}, {"l": "1Pe 3:14", "n": "", "vs": [[14, "وإن كان لابد أن تتألموا في سبيل البر، فطوبى لكم! لا تخافوا من تهديد الذين يضطهدونكم، ولا تقلقوا."]]}, {"l": "1Pe 4:12-16", "n": "", "vs": [[12, "أيها الأحباء، لا تستغربوا نار الاضطهاد المشتعلة عندكم لاختباركم وكأن أمرا غريبا قد أصابكم!"], [13, "وإنما افرحوا: لأنكم كما تشاركون المسيح في الآلام الآن، لابد أن تفرحوا بمشاركته في الابتهاج عند ظهور مجده."], [14, "فإذا لحقتكم الإهانة لأنكم تحملون اسم المسيح، فطوبى لكم! لأن روح المجد، أي روح الله، يستقر عليكم."], [15, "لا يكن بينكم من يتأ لم عقابا على شر ارتكبه: كالقتل أو السرقة، أو غيرهما من الجرائم، أو التدخل في شؤون الآخرين."], [16, "ولكن إن تألم أحدكم لأنه «مسيحي»، فعليه ألا يخجل، بل أن يمجد الله لأجل هذا الاسم!"]]}, {"l": "1Pe 5:9", "n": "", "vs": [[9, "فقاوموه، ثابتين في الإيمان. واذكروا أن إخوتكم المنتشرين في العالم يجتازون وسط هذه الآلام عينها."]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}, {"l": "Rev 1:9", "n": "", "vs": [[9, "أنا، يوحنا أخاكم وشريككم في الضيقة والملكوت والصبر في يسوع، كنت منفيا في الجزيرة التي تسمى بطمس، لأجل كلمة الله وشهادة يسوع."]]}, {"l": "Rev 1:10", "n": "", "vs": [[10, "وفي يوم الرب، صرت في الروح، فسمعت من ورائي صوتا عاليا كصوت البوق"]]}, {"l": "Rev 7:14", "n": "", "vs": [[14, "فأجبته: «أنت أعلم ياسيدي!» فقال: «هؤلاء هم الذين أتوا من الضيقة العظيمة، وقد غسلوا ثيابهم وبيضوها بدم الحمل."]]}, {"l": "Rev 12:4", "n": "", "vs": [[4, "فسحب بذيله ثلث نجوم السماء وألقاها إلى الأرض. ثم وقف التنين أمام المرأة وهي تلد، ليبتلع طفلها بعد أن تلده!"]]}, {"l": "Rev 12:7-10", "n": "", "vs": [[7, "ونشبت حرب في السماء، إذ هاجم ميخائيل وملائكته التنين وملائكته،"], [8, "وحارب التنين وملائكته، لكنهم انهزموا ولم يبق لهم مكان في السماء،"], [9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."], [10, "ثم سمعت صوتا عاليا في السماء يقول: «الآن تم خلاص إلهنا، وآلت القدرة والملك إليه والسلطان إلى مسيحه! فإنه قد طرح من السماء إلى الأرض المشتكي الذي يتهم إخوتنا أمام إلهنا ليلا ونهارا."]]}], "kwAr": "يضطهدون", "noteAr": ""}], "arS": [["وحقا، إن ", []], ["جميع", ["G3956"]], [" الذين ", []], ["يعزمون", ["G2309"]], [" أن ", []], ["يعيشوا", ["G2198"]], [" عيشة ", []], ["التقوى", ["G2153"]], [" في ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["يضطهدون", ["G1377"]], [".", []]]}, {"c": 3, "v": 13, "text": "أما الناس الأشرار والدجالون المحتالون، فيتقدمون في الشر، مضللين الآخرين وهم أنفسهم مضللون!", "groups": [{"kw": "evil", "raw": "2Ti_3:8, 2Ti_2:16, 2Ti_2:17; 2Th_2:6-10; 1Ti_4:1; 2Pe_2:20, 2Pe_3:3; Rev_12:9, Rev_13:14, Rev_18:23", "note": "", "refs": [{"l": "2Ti 3:8", "n": "", "vs": [[8, "ومثلما قاوم (الساحران) ينيس ويمبريس موسى، كذلك أيضا يقاوم هؤلاء الحق؛ أناس عقولهم فاسدة، وقد تبين أنهم غير أهل للإيمان."]]}, {"l": "2Ti 2:16", "n": "", "vs": [[16, "أما الأحاديث الباطلة الدنسة، فتجنبها؛ فإن المنصرفين إليها يتقدمون إلى فجور أفظع،"]]}, {"l": "2Ti 2:17", "n": "", "vs": [[17, "وكلامهم ينهش كالآكلة، ومنهم هيمنايوس وفيليتوس،"]]}, {"l": "2Th 2:6-10", "n": "", "vs": [[6, "وأنتم الآن تعرفون ما الذي يحتجزه حتى لا يظهر إلا في الوقت المعين له."], [7, "فإن التمرد الآن يعمل خفية كأنه سر. ولكن فقط إلى أن يرفع من الوسط ذاك الذي يحتجز المتمرد."], [8, "عندئذ سيظهر الإنسان المتمرد ظهورا جليا فيبيده الرب يسوع بنفخة فمه ويلاشيه ببهاء ظهوره عند عودته."], [9, "أما بروز المتمرد، فسوف يكون بقدر طاقة الشيطان على المعجزات والعلامات والعجائب المزيفة كلها،"], [10, "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا."]]}, {"l": "1Ti 4:1", "n": "", "vs": [[1, "إلا أن الروح يعلن صراحة أن قوما في الأزمنة الأخيرة سوف يرتدون عن الإيمان، منساقين وراء أرواح مضللة وتعاليم شيطانية،"]]}, {"l": "2Pe 2:20", "n": "", "vs": [[20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."]]}, {"l": "2Pe 3:3", "n": "", "vs": [[3, "فاعلموا، قبل كل شيء أنه سيأتي في آخر الأيام أناس مستهزئون يسخرون بالحق، ويسلكون منجرفين وراء شهواتهم الخاصة."]]}, {"l": "Rev 12:9", "n": "", "vs": [[9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."]]}, {"l": "Rev 13:14", "n": "", "vs": [[14, "فخدع سكان الأرض بالآيات التي كان يقوم بها في حضور الوحش الأول. وأمر سكان الأرض أن يقيموا تمثالا للوحش الأول الذي كان قد جرح جرحا مميتا ولكنه عاش!"]]}, {"l": "Rev 18:23", "n": "", "vs": [[23, "ولن يضيء فيك نور مصباح. ولن يسمع فيك صوت عريس وعروس. فقد كان تجارك سادة الأرض، وبسحرك ضللت جميع الأمم."]]}], "kwAr": "الناس الأشرار", "noteAr": ""}, {"kw": "being", "raw": "Job_12:16; Isa_44:20; Eze_14:9, Eze_14:10; 2Th_2:11", "note": "", "refs": [{"l": "Job 12:16", "n": "", "vs": [[16, "له العزة والحكمة. في يده المضل والمضل."]]}, {"l": "Isa 44:20", "n": "", "vs": [[20, "لكأنه يأكل الرماد! يجري وراء سراب ويعجز عن إنقاذ نفسه أو الاعتراف أن الصنم الذي يمسكه بيده هو محض ضلال!"]]}, {"l": "Eze 14:9", "n": "", "vs": [[9, "فإذا ضل النبي ونطق بنبوءة باطلة، فإني أنا الرب قد أغويت ذلك النبي، لأنه تصرف من نفسه. فأعاقبه وأبيده من بين شعبي إسرائيل."]]}, {"l": "Eze 14:10", "n": "", "vs": [[10, "وينالون عقاب إثمهم، ويكون ذنب النبي مماثلا لذنب السائل."]]}, {"l": "2Th 2:11", "n": "", "vs": [[11, "ولهذا السبب، سيرسل الله إليهم طاقة الضلال حتى يصدقوا ما هو دجل،"]]}], "kwAr": "وهم أنفسهم مضللون", "noteAr": ""}], "arS": [["أما ", []], ["الناس", ["G444"]], [" ", []], ["الأشرار", ["G4190"]], [" ", []], ["والدجالون", ["G1114"]], [" المحتالون، ", []], ["فيتقدمون في الشر", ["G4298", "G1909", "G5501"]], ["، ", []], ["مضللين", ["G4105"]], [" الآخرين وهم أنفسهم ", []], ["مضللون", ["G4105"]], ["!", []]]}, {"c": 3, "v": 14, "text": "إنما أنت فاثبت على ما تعلمته وتيقنته بالتمام، إذ تعرف على يد من تعلمت ذلك.", "groups": [{"kw": "continue", "raw": "2Ti_1:13, 2Ti_2:2; 1Ti_4:16", "note": "", "refs": [{"l": "2Ti 1:13", "n": "", "vs": [[13, "اتخذ من الكلام الصحيح الذي سمعته مني مثالا في الإيمان والمحبة اللذين في المسيح يسوع."]]}, {"l": "2Ti 2:2", "n": "", "vs": [[2, "والتعاليم التي سمعتها مني بحضور شهود عديدين، أودعها أمانة بين أيدي أناس جديرين بالثقة، يكونون قادرين على تعليم الآخرين."]]}, {"l": "1Ti 4:16", "n": "", "vs": [[16, "انتبه جيدا لنفسك وللتعليم. فإنك إذ تواظب على ذلك، تنقذ نفسك وسامعيك أيضا."]]}], "kwAr": "فاثبت", "noteAr": ""}, {"kw": "assured", "raw": "Act_17:31; Rom_14:5 *marg. Col_2:2; 1Th_1:5; Heb_6:11, Heb_10:22", "note": "", "refs": [{"l": "Act 17:31", "n": "", "vs": [[31, "لأنه حدد يوما يدين فيه العالم بالعدل على يد رجل اختاره لذلك. وقد قدم للجميع برهانا، إذ أقامه من بين الأموات»."]]}, {"l": "Rom 14:5", "n": "*marg.", "vs": [[5, "ومن الناس من يراعي يوما دون غيره، ومنهم من يعتبر الأيام كلها متساوية. فليكن كل واحد مقتنعا برأيه في عقله."]]}, {"l": "Col 2:2", "n": "", "vs": [[2, "بغرض أن تتشجع قلوبهم وتكون كلها متحدة في المحبة، لبلوغ الإدراك التام بكل غناه، لمعرفة سر الله، أي المسيح،"]]}, {"l": "1Th 1:5", "n": "", "vs": [[5, "لأن تبشيرنا لكم بالإنجيل لم يكن مجرد كلام، بل كان مصحوبا أيضا بالقوة وبالروح القدس وبتمام اليقين. كما أنكم تعلمون تماما ماذا كنا بينكم لأجل مصلحتكم،"]]}, {"l": "Heb 6:11", "n": "", "vs": [[11, "وإنما نتمنى أن يظهر كل واحد منكم اجتهادا مماثلا في المحافظة حتى النهاية على الثقة الكاملة بالرجاء."]]}, {"l": "Heb 10:22", "n": "", "vs": [[22, "فلنتقدم إلى حضرة الله بقلب صادق وبثقة الإيمان الكاملة، بعدما طهر رش الدم قلوبنا من كل شعور بالذنب، وغسل الماء النقي أجسادنا."]]}], "kwAr": "وتيقنته", "noteAr": ""}, {"kw": "knowing", "raw": "2Ti_3:15; 1Th_2:13", "note": "", "refs": [{"l": "2Ti 3:15", "n": "", "vs": [[15, "وتعلم أنك منذ حداثة سنك تعرف الكتب المقدسة، وهي القادرة أن تجعلك حكيما لبلوغ الخلاص عن طريق الإيمان في المسيح يسوع."]]}, {"l": "1Th 2:13", "n": "", "vs": [[13, "ولذلك نحن أيضا نرفع الشكر لله بلا توقف، لأنكم لما تلقيتم منا كلمة البشارة من الله، قبلتموها لا كأنها كلمة بشر، بل كما هي في الحقيقة: باعتبارها كلمة الله العاملة أيضا فيكم أنتم المؤمنين."]]}], "kwAr": "إذ تعرف", "noteAr": ""}], "arS": [["إنما أنت ", []], ["فاثبت", ["G3306"]], [" على ما ", []], ["تعلمته", ["G3129"]], [" ", []], ["وتيقنته", ["G4104"]], [" بالتمام، إذ ", []], ["تعرف", ["G1492"]], [" على يد ", []], ["من", ["G5101"]], [" ", []], ["تعلمت", ["G3129"]], [" ذلك.", []]]}, {"c": 3, "v": 15, "text": "وتعلم أنك منذ حداثة سنك تعرف الكتب المقدسة، وهي القادرة أن تجعلك حكيما لبلوغ الخلاص عن طريق الإيمان في المسيح يسوع.", "groups": [{"kw": "from", "raw": "2Ti_1:5; 1Sa_2:18; 2Ch_34:3; Psa_71:17; Pro_8:17, Pro_22:6; Ecc_12:1; Luk_1:15; Luk_2:40", "note": "", "refs": [{"l": "2Ti 1:5", "n": "", "vs": [[5, "كما أستذكر إيمانك الخالي من الرياء، هذا الإيمان الذي فيك والذي حل أولا في جدتك لوئيس ثم في أمك أفنيكي، وأنا متأكد أنه حال فيك أيضا."]]}, {"l": "1Sa 2:18", "n": "", "vs": [[18, "وكان صموئيل آنئِذ يخدم في محضر الرب وهو ما برح صبيا، يرتدي أفودا من كتان."]]}, {"l": "2Ch 34:3", "n": "", "vs": [[3, "وفي السنة الثامنة من ملكه، وهو بعد فتى، ابتدأ يعبد إله جده داود. وفي السنة الثانية عشرة شرع يطهر أرض يهوذا وأورشليم من المرتفعات وتماثيل عشتاروث والأصنام والمسبوكات."]]}, {"l": "Psa 71:17", "n": "", "vs": [[17, "قد علمتني ياالله منذ صباي، فلم أكف لحظة عن إعلان عجائبك."]]}, {"l": "Pro 8:17", "n": "", "vs": [[17, "أحب من يحبونني، ومن يجد في البحث عني يعثر علي."]]}, {"l": "Pro 22:6", "n": "", "vs": [[6, "درب الولد بمقتضى مواهبه وطبيعته، فمتى شاخ لا يميل عنها."]]}, {"l": "Ecc 12:1", "n": "", "vs": [[1, "فاذكر خالقك في أيام حداثتك قبل أن تقبل عليك أيام الشر، أو تغلب عليك السنون، حين تقول: ليس لي فيها لذة."]]}, {"l": "Luk 1:15", "n": "", "vs": [[15, "وسوف يكون عظيما أمام الرب، ولا يشرب خمرا ولا مسكرا، ويمتليء بالروح القدس وهو بعد في بطن أمه،"]]}, {"l": "Luk 2:40", "n": "", "vs": [[40, "وكان الطفل ينمو ويتقوى، ممتلئا حكمة، وكانت نعمة الله عليه."]]}], "kwAr": "منذ حداثة سنك", "noteAr": ""}, {"kw": "the holy", "raw": "Dan_10:21; Mat_22:29; Luk_24:27, Luk_24:32, Luk_24:45; Act_17:2; Rom_1:2, Rom_16:26; 1Co_15:3, 1Co_15:4; 2Pe_1:20,2Pe_1:21, 2Pe_3:16", "note": "", "refs": [{"l": "Dan 10:21", "n": "", "vs": [[21, "ولكني أطلعك على ما نص عليه في كتاب الحق، ولا أحد يؤازرني ضد هؤلاء سوى حارس شعبكم الملاك ميخائيل»."]]}, {"l": "Mat 22:29", "n": "", "vs": [[29, "فرد عليهم يسوع قائلا: «أنتم في ضلال لأنكم لا تفهمون الكتاب ولا قدرة الله."]]}, {"l": "Luk 24:27", "n": "", "vs": [[27, "ثم أخذ يفسر لهما، منطلقا من موسى ومن الأنبياء جميعا، ما ورد عنه في جميع الكتب."]]}, {"l": "Luk 24:32", "n": "", "vs": [[32, "فقال أحدهما للآخر: «أما كان قلبنا يلتهب في صدورنا فيما كان يحدثنا في الطريق ويشرح لنا الكتب؟»"]]}, {"l": "Luk 24:45", "n": "", "vs": [[45, "ثم فتح أذهانهم ليفهموا الكتب،"]]}, {"l": "Act 17:2", "n": "", "vs": [[2, "فذهب إليه كعادته، وناقشهم لثلاثة سبوت، مستندا إلى الكتاب،"]]}, {"l": "Rom 1:2", "n": "", "vs": [[2, "هذا الإنجيل الذي وعد الله به من قبل على ألسنة أنبيائه في الكتب المقدسة،"]]}, {"l": "Rom 16:26", "n": "", "vs": [[26, "ولكن أذيع الآن، بأمر الله الأزلي في الكتابات النبوية، على جميع الأمم لأجل إطاعة الإيمان؛"]]}, {"l": "1Co 15:3", "n": "", "vs": [[3, "فالواقع أني سلمتكم، في أول الأمر، ما كنت قد تسلمته، وهو أن المسيح مات من أجل خطايانا وفقا لما في الكتاب،"]]}, {"l": "1Co 15:4", "n": "", "vs": [[4, "وأنه دفن، وأنه قام في اليوم الثالث وفقا لما في الكتاب،"]]}, {"l": "2Pe 1:20", "n": "", "vs": [[20, "ولكن، قبل كل شيء، اعلموا أن كل نبوءة واردة في الكتاب لا تفسر باجتهاد خاص."]]}, {"l": "2Pe 1:21", "n": "", "vs": [[21, "إذ لم تأت نبوءة قط بإرادة بشرية، بل تكلم بالنبوآت جميعا رجال الله غالقديسونف مدفوعين بوحي الروح القدس."]]}, {"l": "2Pe 3:16", "n": "", "vs": [[16, "وما كتبه في رسالته إليكم، يوافق ما كتبه في باقي رسائله. وفي تلك الرسائل كلها أمور صعبة الفهم، يحرفها الجهال وغير الراسخين في الحق، كما يحرفون غيرها أيضا من الكتابات الموحى بها، فيجلبون الهلاك على أنفسهم."]]}], "kwAr": "الكتب المقدسة", "noteAr": ""}, {"kw": "which", "raw": "Psa_19:7; Joh_5:39, Joh_5:40; Act_10:43, Act_13:29, Act_13:38, Act_13:39; 1Pe_1:10-12; 1Jo_5:11, 1Jo_5:12; Rev_19:10", "note": "", "refs": [{"l": "Psa 19:7", "n": "", "vs": [[7, "شريعة الرب كاملة تنعش النفس. شهادة الرب صادقة تجعل الجاهل حكيما."]]}, {"l": "Joh 5:39", "n": "", "vs": [[39, "أنتم تدرسون الكتب لأنكم تعتقدون أنها ستهديكم إلى الحياة الأبدية. هذه الكتب تشهد لي،"]]}, {"l": "Joh 5:40", "n": "", "vs": [[40, "ولكنكم ترفضون أن تأتوا إلي لتكون لكم الحياة."]]}, {"l": "Act 10:43", "n": "", "vs": [[43, "له يشهد جميع الأنبياء أن كل من يؤمن به ينال باسمه غفران الخطايا»."]]}, {"l": "Act 13:29", "n": "", "vs": [[29, "وبعدما نفذوا فيه كل ما كتب عنه، أنزلوه عن الصليب، ودفنوه في قبر."]]}, {"l": "Act 13:38", "n": "", "vs": [[38, "فاعلموا، أيها الإخوة، أنه بيسوع تبشرون بغفران الخطايا ،"]]}, {"l": "Act 13:39", "n": "", "vs": [[39, "وأنه به يتبرر كل من يؤمن من كل ما عجزت شريعة موسى أن تبرره منه."]]}, {"l": "1Pe 1:10-12", "n": "", "vs": [[10, "وكم فتش الأنبياء قديما وبحثوا عن هذا الخلاص! فهم تنبأوا عن نعمة الله التي كان قد أعدها لكم أنتم،"], [11, "واجتهدوا لمعرفة الزمان والأحوال التي كان يشير إليها روح المسيح الذي كان عاملا فيهم، عندما شهد لهم مسبقا بما ينتظر المسيح من آلام، وبما يأتي بعدها من أمجاد."], [12, "ولكن الله أوحى إليهم أن اجتهادهم لم يكن لمصلحتهم هم، بل لمصلحتكم أنتم. فقد كان ذلك من أجل البشارة التي نقلها إليكم في الزمان الحاضر مبشرون يؤيدهم الروح القدس المرسل من السماء. ويالها من أمور يتمنى حتى الملائكة أن يطلعوا عليها!"]]}, {"l": "1Jo 5:11", "n": "", "vs": [[11, "وهذه الشهادة هي أن الله أعطانا حياة أبدية، وأن هذه الحياة هي في ابنه."]]}, {"l": "1Jo 5:12", "n": "", "vs": [[12, "فمن كان له ابن الله كانت له الحياة. ومن لم يكن له ابن الله، لم تكن له الحياة!"]]}, {"l": "Rev 19:10", "n": "", "vs": [[10, "فجثوت عند قدميه لأسجد له، فقال لي: «لا تفعل! إني عبد لله، مثلك ومثل إخوتك المؤمنين الذين لديهم الشهادة المختصة بيسوع: لله اسجد! فإن الشهادة المختصة بيسوع هي روح النبوءة»."]]}], "kwAr": "وهي القادرة", "noteAr": ""}], "arS": [["وتعلم أنك منذ ", []], ["حداثة سنك", ["G1025"]], [" ", []], ["تعرف", ["G1492"]], [" ", []], ["الكتب", ["G1121"]], [" ", []], ["المقدسة", ["G2413"]], ["، وهي ", []], ["القادرة", ["G1410"]], [" أن ", []], ["تجعلك حكيما", ["G4679"]], [" لبلوغ ", []], ["الخلاص", ["G4991"]], [" عن طريق ", []], ["الإيمان", ["G4102"]], [" في ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [".", []]]}, {"c": 3, "v": 16, "text": "إن الكتاب بكل ما فيه، قد أوحى به الله؛ وهو مفيد للتعليم والتوبيخ والتقويم وتهذيب الإنسان في البر،", "groups": [{"kw": "All", "raw": "2Sa_23:2; Mat_21:42, Mat_22:31, Mat_22:32, Mat_22:43, Mat_26:54, Mat_26:56; Mar_12:24, Mar_12:36; Joh_10:35; Act_1:16, Act_28:25; Rom_3:2, Rom_15:4; Gal_3:8; Heb_3:7, Heb_4:12; 2Pe_1:19-21", "note": "", "refs": [{"l": "2Sa 23:2", "n": "", "vs": [[2, "«تكلم روح الرب بفمي، وكلمته نطق بها لساني."]]}, {"l": "Mat 21:42", "n": "", "vs": [[42, "فقال لهم يسوع: «ألم تقرأوا في الكتاب: الحجر الذي رفضه البناة، هو نفسه صار حجر الزاوية الأساسي. من الرب كان هذا، وهو عجيب في أنظارنا!"]]}, {"l": "Mat 22:31", "n": "", "vs": [[31, "أما عن قيامة الأموات، أفما قرأتم ما قيل لكم على لسان الله:"]]}, {"l": "Mat 22:32", "n": "", "vs": [[32, "أنا إله إبراهيم وإله إسحاق وإله يعقوب؟ وليس الله بإله أموات، بل هو إله أحياء»."]]}, {"l": "Mat 22:43", "n": "", "vs": [[43, "فسألهم: «إذن، كيف يدعوه داود بالروح ربا له إذ يقول:"]]}, {"l": "Mat 26:54", "n": "", "vs": [[54, "ولكن كيف يتم الكتاب حيث يقول إن ما يحدث الآن لابد أن يحدث؟ »"]]}, {"l": "Mat 26:56", "n": "", "vs": [[56, "ولكن، قد حدث هذا كله لتتم كتابات الأنبياء!» عندئذ تركه التلاميذ كلهم وهربوا!"]]}, {"l": "Mar 12:24", "n": "", "vs": [[24, "فرد عليهم يسوع قائلا: «ألستم في ضلال لأنكم لا تفهمون الكتاب ولا قدرة الله؟"]]}, {"l": "Mar 12:36", "n": "", "vs": [[36, "فإن داود نفسه قال بالروح القدس: قال الرب لربي: اجلس عن يميني حتى أضع أعداءك موطئا لقدميك!"]]}, {"l": "Joh 10:35", "n": "", "vs": [[35, "فإذا كانت الشريعة تدعو أولئك الذين نزلت إليهم كلمة الله آلهة والكتاب لا يمكن أن ينقض"]]}, {"l": "Act 1:16", "n": "", "vs": [[16, "«أيها الإخوة، كان لابد من أن تتم النبوءة التي قالها الروح القدس بلسان النبي داود، عن يهوذا الذي انقلب دليلا للذين قبضوا على يسوع."]]}, {"l": "Act 28:25", "n": "", "vs": [[25, "فاختلفوا فيما بينهم، وانصرفوا بعدما قال لهم: «صدق الروح القدس إذ قال لآبائكم بلسان النبي إشعياء:"]]}, {"l": "Rom 3:2", "n": "", "vs": [[2, "إنه كثير من جميع الجهات، وأهمها فعلا أن أقوال الله وضعت أمانة بين أيديهم."]]}, {"l": "Rom 15:4", "n": "", "vs": [[4, "فإن كل ما سبق أن كتب فإنما كتب لتعليمنا، حتى يكون لنا رجاء بما في الكتاب من الصبر والعزاء."]]}, {"l": "Gal 3:8", "n": "", "vs": [[8, "ثم إن الكتاب، إذ سبق فرأى أن الله سوف يبرر الأمم على أساس الإيمان، بشر إبراهيم سلفا بقوله: «فيك تتبارك جميع الأمم!»"]]}, {"l": "Heb 3:7", "n": "", "vs": [[7, "لهذا، ينبهنا الروح القدس إذ يقول: «اليوم، إن سمعتم صوته،"]]}, {"l": "Heb 4:12", "n": "", "vs": [[12, "ذلك لأن كلمة الله حية، وفعاله، وأمضى من كل سيف له حدان، وخارقة إلى مفترق النفس والروح والمفاصل ونخاع العظام، وقادرة أن تميز أفكار القلب ونياته."]]}, {"l": "2Pe 1:19-21", "n": "", "vs": [[19, "وهكذا، صارت الكلمة النبوية أكثر ثباتا عندنا. فحسنا تفعلون إن انتبهتم إلى هذه الكلمة في قلوبكم. إذ إنها أشبه بمصباح يضيء في مكان مظلم، إلى أن يطلع النهار ويظهر كوكب الصبح."], [20, "ولكن، قبل كل شيء، اعلموا أن كل نبوءة واردة في الكتاب لا تفسر باجتهاد خاص."], [21, "إذ لم تأت نبوءة قط بإرادة بشرية، بل تكلم بالنبوآت جميعا رجال الله غالقديسونف مدفوعين بوحي الروح القدس."]]}], "kwAr": "الكتاب بكل ما فيه", "noteAr": ""}, {"kw": "and is", "raw": "Psa_19:7-11, Psa_119:97-104, Psa_119:130; Mic_2:7; Act_20:20,Act_20:27; 1Co_12:7; Eph_4:11-16", "note": "", "refs": [{"l": "Psa 19:7-11", "n": "", "vs": [[7, "شريعة الرب كاملة تنعش النفس. شهادة الرب صادقة تجعل الجاهل حكيما."], [8, "وصايا الرب مستقيمة تفرح القلب. أمر الرب نقي ينير العينين."], [9, "مخافة الرب طاهرة ثابتة إلى الأبد، وأحكام الرب حق وعادلة كلها."], [10, "إنها أشهى من الذهب النقي، وهي أحلى من العسل بل القطر السائل من أقراص الشهد."], [11, "عبدك يهتدي بها، وفي صونها ثواب عظيم."]]}, {"l": "Psa 119:97-104", "n": "", "vs": [[97, "كم أحببت شريعتك، إنها موضوع تأملي طول النهار."], [98, "وصيتك جعلتني أحكم من أعدائي، لأنها نصيبي إلى الأبد."], [99, "صرت أكثر فهما من معلمي، لأن شهاداتك هي موضوع تأملي."], [100, "صرت أكثر فطنة من الشيوخ، لأني راعيت وصاياك."], [101, "منعت قدمي عن سلوك كل طريق شر، لكي أحفظ كلامك."], [102, "لم أبتعد عن أحكامك لأنك هكذا علمتني."], [103, "ما أحلى أقوالك لمذاقي. إنها أحلى من العسل في فمي."], [104, "من وصاياك اكتسبت فطنة لذلك أبغضت كل طريق باطل."]]}, {"l": "Psa 119:130", "n": "", "vs": [[130, "فتح كلامك ينير الذهن، ويهب البسطاء فهما."]]}, {"l": "Mic 2:7", "n": "", "vs": [[7, "آه يابيت يعقوب؟ هل نفد صبر روح الرب؟ أهذه الأفعال صدرت عنه؟ أليست كلماتي صالحة للسالكين بالاستقامة؟"]]}, {"l": "Act 20:20", "n": "", "vs": [[20, "وما قصرت في شيء يمكن أن يعود عليكم بالفائدة إلا وكنت أعلنه لكم وأعلمكم به علنا ومن بيت إلى بيت."]]}, {"l": "Act 20:27", "n": "", "vs": [[27, "لأني لم أمتنع عن إبلاغكم جميع مقاصد الله."]]}, {"l": "1Co 12:7", "n": "", "vs": [[7, "وإنما كل واحد يوهب موهبة يتجلى الروح فيها لأجل المنفعة."]]}, {"l": "Eph 4:11-16", "n": "", "vs": [[11, "وهو قد وهب البعض أن يكونوا رسلا، والبعض أنبياء، والبعض مبشرين والبعض رعاة ومعلمين،"], [12, "لتأهيل القديسين من جهة عمل الخدمة، لبنيان جسد المسيح،"], [13, "حتى نصل جميعا إلى وحدة الإيمان ووحدة المعرفة لابن الله، إلى إنسان تام البلوغ، إلى مقدار قامة ملء المسيح."], [14, "وذلك حتى لا نكون فيما بعد أطفالا تتقاذفنا وتحملنا كل ريح تعليم يقوم على خداع الناس والمكر بهم لجرهم إلى الضلال الملفق،"], [15, "بل نتمسك بالحق في المحبة، فننمو في كل شيء نحو من هو الرأس، أي المسيح."], [16, "فمنه يستمد الجسد كله تماسكه وترابطه بمساندة كل مفصل وفقا لمقدار العمل المخصص لكل جزء، لينشيء نموا يؤول إلى بنيان الجسد بنيانا ذاتيا في المحبة."]]}], "kwAr": "وهو مفيد", "noteAr": ""}, {"kw": "for doctrine", "raw": "2Ti_3:10", "note": "", "refs": [{"l": "2Ti 3:10", "n": "", "vs": [[10, "وأما أنت، فقد عرفت جيدا تعليمي، وسيرتي، وهدفي، وإيماني، وتحملي للمشقات، ومحبتي، وثباتي،"]]}], "kwAr": "للتعليم", "noteAr": ""}, {"kw": "for reproof", "raw": "2Ti_4:2; Pro_6:23, Pro_15:10,Pro_15:31; Joh_3:20; Eph_5:11-13; Heb_11:1 *Gr.", "note": "", "refs": [{"l": "2Ti 4:2", "n": "", "vs": [[2, "أن تنادي بالكلمة منشغلا بها كليا، في الفرص المناسبة وغير المناسبة على السواء، وأن توبخ وتنذر وتشجع بكل صبر في التعليم."]]}, {"l": "Pro 6:23", "n": "", "vs": [[23, "فالوصية مصباح والشريعة نور، والتوبيخ في سبيل التأديب هو طريق حياة،"]]}, {"l": "Pro 15:10", "n": "", "vs": [[10, "المنحرف عن طريق الرب يجازى بالتأديب القاسي، ومن يمقت التقويم يموت."]]}, {"l": "Pro 15:31", "n": "", "vs": [[31, "ذو الأذن المستمعة إلى التوبيخ المحيي يمكث بين الحكماء."]]}, {"l": "Joh 3:20", "n": "", "vs": [[20, "فكل من يعمل الشر يبغض النور، ولا يأتي إليه مخافة أن تفضح أعماله."]]}, {"l": "Eph 5:11-13", "n": "", "vs": [[11, "وعليكم ألا تكتفوا بعدم الاشتراك في أعمال الظلام العقيمة، بل بالأحرى أن تفضحوها أيضا."], [12, "فالأمور التي يفعلونها سرا، قبيح حتى ذكرها."], [13, "إلا أن كل شيء، إذا ما فضح النور أمره، يصير مكشوفا:"]]}, {"l": "Heb 11:1", "n": "*Gr.", "vs": [[1, "أما الإيمان، فهو الثقة بأن ما نرجوه لابد أن يتحقق، والاقتناع بأن ما لا نراه موجود حقا."]]}], "kwAr": "والتوبيخ", "noteAr": ""}, {"kw": "for instruction", "raw": "2Ti_2:25; Deu_4:36; Neh_9:20; Psa_119:9, Psa_119:11; Mat_13:52; Act_18:25; Rom_2:20", "note": "", "refs": [{"l": "2Ti 2:25", "n": "", "vs": [[25, "ويؤدب بالوداعة مقاومي الإيمان، عسى أن يمنحهم الله التوبة، فيعرفوا الحق بالتمام،"]]}, {"l": "Deu 4:36", "n": "", "vs": [[36, "فقد أسمعكم صوته من السماء لينذركم. وأراكم ناره العظيمة على الأرض، وسمعتم صوته من وسط النار."]]}, {"l": "Neh 9:20", "n": "", "vs": [[20, "وأنعمت عليهم بروحك الصالح ليلقنهم، ولم تمنع منك عن أفواههم، ووفرت لهم ماء لإرواء عطشهم."]]}, {"l": "Psa 119:9", "n": "", "vs": [[9, "بماذا يزكي الشاب مسلكه؟ بطاعته لكلمتك."]]}, {"l": "Psa 119:11", "n": "", "vs": [[11, "خبأت كلامك في قلبي، لئلا أخطيء إليك."]]}, {"l": "Mat 13:52", "n": "", "vs": [[52, "فقال: «ولهذا السبب، فأي واحد من الكتبة يصير تلميذا لملكوت السماوات، يشبه بإنسان رب بيت يطلع من كنزه ما هو جديد وما هو عتيق! »"]]}, {"l": "Act 18:25", "n": "", "vs": [[25, "كان قد تلقن طريق الرب. فبدأ يخطب بحماسة شديدة، ويعلم الحقائق المختصة بيسوع تعليما صحيحا. ومع أنه لم يكن يعرف سوى معمودية يوحنا،"]]}, {"l": "Rom 2:20", "n": "", "vs": [[20, "ومؤدب للجهال، ومعلم للأطفال؛ ولك في الشريعة صورة المعرفة والحق؛"]]}], "kwAr": "وتهذيب الإنسان في البر", "noteAr": ""}], "arS": [["إن ", []], ["الكتاب", ["G1124"]], [" ", []], ["بكل", ["G3956"]], [" ما فيه، قد ", []], ["أوحى به الله", ["G2315"]], ["؛ وهو ", []], ["مفيد", ["G5624"]], [" ", []], ["للتعليم", ["G1319"]], [" ", []], ["والتوبيخ", ["G1650"]], [" ", []], ["والتقويم", ["G1882"]], [" ", []], ["وتهذيب", ["G3809"]], [" الإنسان في ", []], ["البر", ["G1343"]], ["،", []]]}, {"c": 3, "v": 17, "text": "لكي يجعل إنسان الله مؤهلا تأهيلا كاملا، ومجهزا لكل عمل صالح.", "groups": [{"kw": "the man", "raw": "Psa_119:98-100; 1Ti_6:11", "note": "", "refs": [{"l": "Psa 119:98-100", "n": "", "vs": [[98, "وصيتك جعلتني أحكم من أعدائي، لأنها نصيبي إلى الأبد."], [99, "صرت أكثر فهما من معلمي، لأن شهاداتك هي موضوع تأملي."], [100, "صرت أكثر فطنة من الشيوخ، لأني راعيت وصاياك."]]}, {"l": "1Ti 6:11", "n": "", "vs": [[11, "وأما أنت، ياإنسان الله، فاهرب من هذه الأمور، واسع في إثر البر والتقوى والإيمان والمحبة والصبر والوداعة."]]}], "kwAr": "إنسان الله", "noteAr": ""}, {"kw": "thoroughly furnished", "raw": "or, perfected, 2Ti_2:21; Neh_2:18; Act_9:36; 2Co_9:8; Eph_2:10; Tit_2:14, Tit_3:1; Heb_10:24", "note": "or, perfected, 2Ti_2:21; Neh_2:18; Act_9:36; 2Co_9:8; Eph_2:10; Tit_2:14, Tit_3:1; Heb_10:24", "refs": [{"l": "2Ti 2:21", "n": "", "vs": [[21, "إذن الذي ينفصل عن هذه الأخيرة، مطهرا نفسه، يكون إناء للاستعمال الرفيع، مقدسا، نافعا لرب البيت، متأهبا لكل عمل صالح."]]}, {"l": "Neh 2:18", "n": "", "vs": [[18, "وأطلعتهم عما رعاني به إلهي من عناية صالحة، وعلى حديث الملك الذي خاطبني به، فقالوا: لنقم ونبن السور وتضافروا جميعا للقيام بالعمل الصالح."]]}, {"l": "Act 9:36", "n": "", "vs": [[36, "وكان في مدينة يافا تلميذة اسمها طابيثا، ومعنى اسمها: غزالة، كان يشغلها دائما فعل الخير ومساعدة الفقراء."]]}, {"l": "2Co 9:8", "n": "", "vs": [[8, "والله قادر أن يجعل كل نعمة تفيض عليكم، حتى يكون لكم اكتفاء كلي في كل شيء وكل حين، فتفيضوا في كل عمل صالح؛"]]}, {"l": "Eph 2:10", "n": "", "vs": [[10, "فإننا نحن تحفة الله، وقد خلقنا في المسيح يسوع لأعمال صالحة أعدها سلفا لنسلك فيها."]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Tit 3:1", "n": "", "vs": [[1, "ذكر المؤمنين أن يخضعوا للحكام والسلطات، ويطيعوا القانون، ويكونوا مستعدين لكل عمل صالح،"]]}, {"l": "Heb 10:24", "n": "", "vs": [[24, "وعلى كل واحد منا أن ينتبه للآخرين، لنحث بعضنا بعضا على المحبة والأعمال الصالحة."]]}], "kwAr": "ومجهزا لكل عمل صالح", "noteAr": "أو: مكمَّلًا (مؤهلًا تمامًا)."}], "arS": [["لكي يجعل ", []], ["إنسان", ["G444"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["مؤهلا", ["G739"]], [" تأهيلا كاملا، ", []], ["ومجهزا", ["G1822"]], [" ", []], ["لكل", ["G3956"]], [" ", []], ["عمل", ["G2041"]], [" ", []], ["صالح", ["G18"]], [".", []]]}, {"c": 4, "v": 1, "text": "أطلب منك في حضرة الله والمسيح الذي سيدين الأحياء والأموات، بعودته العلنية وملكوته،", "groups": [{"kw": "charge", "raw": "2Ti_2:14; 1Ti_5:21, 1Ti_6:13", "note": "", "refs": [{"l": "2Ti 2:14", "n": "", "vs": [[14, "بهذه الأمور ذكر، شاهدا في حضرة الله أن لا تنشأ المجادلات الكلامية، وهي لا تنفع شيئا، غير تخريب سامعيها."]]}, {"l": "1Ti 5:21", "n": "", "vs": [[21, "أطلب منك أمام الله والمسيح والملائكة المختارين أن تعمل بهذه التوصيات دون مراعاة أشخاص، فلا تعمل شيئا بتحيز."]]}, {"l": "1Ti 6:13", "n": "", "vs": [[13, "وأوصيك، أمام الله الذي يحيي كل شيء، والمسيح يسوع الذي شهد أمام بيلاطس البنطي بالاعتراف الحسن،"]]}], "kwAr": "أطلب منك", "noteAr": ""}, {"kw": "who", "raw": "Psa_50:6, Psa_96:13, Psa_98:9; Mat_16:27, 25:31-46; Joh_5:22-27; Act_10:42; Act_17:31; Rom_2:16, Rom_14:9-11; 1Co_4:4, 1Co_4:5; 2Co_5:9, 2Co_5:10; 2Th_1:7-10; 1Pe_4:5; Rev_20:11-15", "note": "", "refs": [{"l": "Psa 50:6", "n": "", "vs": [[6, "فتذيع السماوات عدله لأن الله هو الديان."]]}, {"l": "Psa 96:13", "n": "", "vs": [[13, "في حضرة الرب لأنه آت ليدين العالم بالعدل والشعوب بالحق."]]}, {"l": "Psa 98:9", "n": "", "vs": [[9, "أمام الرب لأنه جاء ليدين الأرض بالعدل والشعوب بالإنصاف."]]}, {"l": "Mat 16:27", "n": "", "vs": [[27, "فإن ابن الإنسان سوف يعود في مجد أبيه مع ملائكته، فيجازي كل واحد حسب أعماله."]]}, {"l": "Mat 25:31-46", "n": "", "vs": [[31, "وعندما يعود ابن الإنسان في مجده ومعه جميع ملائكته، فإنه يجلس على عرش مجده،"], [32, "وتجتمع أمامه الشعوب كلها، فيفصل بعضهم عن بعض كما يفصل الراعي الغنم عن المعاز،"], [33, "فيوقف الغنم عن يمينه، والمعاز عن يساره؛"], [34, "ثم يقول الملك للذين عن يمينه: تعالوا يامن باركهم أبي، رثوا الملكوت الذي أعد لكم منذ إنشاء العالم:"], [35, "لأني جعت فأطعمتموني، عطشت فسقيتموني، كنت غريبا فآويتموني،"], [36, "عريانا فكسوتموني، مريضا فزرتموني، سجينا فأتيتم إلي!"], [37, "فيرد الأبرار قائلين: يارب، متى رأيناك جائعا فأطعمناك، أو عطشانا فسقيناك؟"], [38, "ومتى رأيناك غريبا فآويناك، أو عريانا فكسوناك؟"], [39, "ومتى رأيناك مريضا أو سجينا فزرناك؟"], [40, "فيجيبهم الملك: الحق أقول لكم: بما أنكم فعلتم ذلك بأحد إخوتي هؤلاء الصغار، فبي فعلتم!"], [41, "ثم يقول للذين عن يساره: ابتعدوا عني ياملاعين إلى النار الأبدية المعدة لإبليس وأعوانه!"], [42, "لأني جعت فلم تطعموني، وعطشت فلم تسقوني،"], [43, "كنت غريبا فلم تأووني، عريانا فلم تكسوني، مريضا وسجينا فلم تزوروني!"], [44, "فيرد هؤلاء أيضا قائلين: يارب، متى رأيناك جائعا أو عطشانا أو غريبا أو عريانا أو مريضا أو سجينا، ولم نخدمك؟"], [45, "فيجيبهم: الحق أقول لكم: بما أنكم لم تفعلوا ذلك بأحد إخوتي هؤلاء الصغار، فبي لم تفعلوا!"], [46, "فيذهب هؤلاء إلى العقاب الأبدي، والأبرار إلى الحياة الأبدية! »"]]}, {"l": "Joh 5:22-27", "n": "", "vs": [[22, "والآب لا يحاكم أحدا، بل أعطى الابن سلطة القضاء كلها،"], [23, "ليكرم الجميع الابن كما يكرمون الآب. ومن لا يكرم الابن لا يكرم الآب الذي أرسله."], [24, "الحق الحق أقول لكم إن من يسمع كلامي ويؤمن بالذي أرسلني تكون له الحياة الأبدية، ولا يحاكم في اليوم الأخير، لأنه قد انتقل من الموت إلى الحياة."], [25, "الحق الحق أقول لكم: إن الساعة التي يسمع فيها الأموات صوت ابن الله ستأتي بل هي الآن والذين يسمعونه يحيون."], [26, "لأنه كما أن للآب حياة في ذاته، فقد أعطى الابن أيضا أن تكون له حياة في ذاته،"], [27, "وأعطاه سلطة أن يدين، لأنه ابن الإنسان."]]}, {"l": "Act 10:42", "n": "", "vs": [[42, "ثم أمرنا أن نبشر شعبنا به، ونشهد أنه هو الذي عينه الله ديانا للأحياء وللأموات."]]}, {"l": "Act 17:31", "n": "", "vs": [[31, "لأنه حدد يوما يدين فيه العالم بالعدل على يد رجل اختاره لذلك. وقد قدم للجميع برهانا، إذ أقامه من بين الأموات»."]]}, {"l": "Rom 2:16", "n": "", "vs": [[16, "(وتكون الدينونة) يوم يدين الله خفايا الناس، وفقا لإنجيلي، على يد يسوع المسيح."]]}, {"l": "Rom 14:9-11", "n": "", "vs": [[9, "فإن المسيح مات وعاد حيا لأجل هذا: أن يكون سيدا على الأموات والأحياء."], [10, "ولكن، لماذا أنت تدين أخاك؟ وأنت أيضا، لماذا تحتقر أخاك؟ فإننا جميعا سوف نقف أمام عرش الله لنحاسب."], [11, "فإنه قد كتب: «أنا حي، يقول الرب، لي ستنحني كل ركبة، وسيعترف كل لسان لله!»"]]}, {"l": "1Co 4:4", "n": "", "vs": [[4, "فإن ضميري لا يؤنبني بشيء، ولكني لست أعتمد ذلك لتبرير نفسي. فإن الذي يحكم في هو الرب."]]}, {"l": "1Co 4:5", "n": "", "vs": [[5, "إذن، لا تحكموا في شيء قبل الأوان، ريثما يرجع الرب الذي سيسلط النور على الأشياء التي يحجبها الظلام الآن، ويكشف نيات القلوب، عندئذ ينال كل واحد حقه من المدح من عند الله!"]]}, {"l": "2Co 5:9", "n": "", "vs": [[9, "ولذلك أيضا نحرص أن نرضيه، سواء أكنا مقيمين أم مغتربين."]]}, {"l": "2Co 5:10", "n": "", "vs": [[10, "إذ لابد أن نقف جميعا مكشوفين أمام عرش المسيح، لينال كل واحد منا استحقاق ما عمله حين كان في الجسد، أصالحا كان أم رديئا!"]]}, {"l": "2Th 1:7-10", "n": "", "vs": [[7, "وأن يكافئكم، أنتم الذين تتضايقون، كما يكافئنا نحن، بالراحة لدى ظهور الرب يسوع علنا من السماء، ومعه ملائكة قدرته،"], [8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."], [9, "فهؤلاء سيكابدون عقاب الهلاك الأبدي، بعيدا من حضرة الرب ومن مجد قوته،"], [10, "عندما يعود في ذلك اليوم ليتمجد في قديسيه ويكون موضع العجب عند جميع الذين آمنوا، وأنتم قد آمنتم بشهادتنا لكم!"]]}, {"l": "1Pe 4:5", "n": "", "vs": [[5, "لكنهم سوف يؤدون الحساب أمام المسيح، المستعد أن يدين الأحياء والأموات."]]}, {"l": "Rev 20:11-15", "n": "", "vs": [[11, "ثم رأيت عرشا عظيما أبيض هربت السماء والأرض من أمام الجالس عليه، فلم يبق لهما مكان."], [12, "ورأيت الأموات، كبارا وصغارا، واقفين قدام العرش. وفتحت الكتب، ثم فتح كتاب آخر هو سجل الحياة، ودين الأموات بحسب ما هو مدون في تلك الكتب، كل واحد حسب أعماله."], [13, "وسلم البحر من فيه من الأموات، وسلم "]]}, {"l": "Eze 3:17", "n": "", "vs": [[17, "«ياابن آدم، قد جعلتك رقيبا لشعب إسرائيل، فأصغ إلى كلمتي وأنذرهم بها على لساني."]]}, {"l": "Eze 33:2", "n": "", "vs": [[2, "«ياابن آدم، خاطب أبناء إسرائيل وقل لهم: إذا جلبت سيفا على أرض كان أهلها قد أقاموا لهم رقيبا من بينهم."]]}, {"l": "Eze 33:7", "n": "", "vs": [[7, "وأنت ياابن آدم، قد أقمتك رقيبا لشعب إسرائيل، فتسمع قضائي، وتحذرهم من قبلي."]]}, {"l": "Mar 13:34", "n": "", "vs": [[34, "فالأمر أشبه بإنسان مسافر، ترك بيته، وأعطى عبيده السلطة معينا لكل واحد عمله، وأوصى حارس الباب أن يسهر."]]}, {"l": "Mar 13:37", "n": "", "vs": [[37, "وما أقوله لكم، أقوله للجميع: اسهروا! »"]]}, {"l": "Luk 12:37", "n": "", "vs": [[37, "طوبى لأولئك العبيد الذين يجدهم سيدهم لدى عودته ساهرين. الحق أقول لكم: إنه يشد وسطه بالحزام ويجعلهم يتكئون ويقوم يخدمهم."]]}, {"l": "Act 20:30", "n": "", "vs": [[30, "بل إن قوما منكم أنتم سيقومون ويعلمون تعاليم منحرفة، ليجروا التلاميذ وراءهم."]]}, {"l": "Act 20:31", "n": "", "vs": [[31, "لذلك كونوا متيقظين، وتذكروا أني، مدة ثلاث سنين، لم أتوقف ليلا ونهارا عن نصح كل واحد منكم وأنا أذرف الدموع."]]}, {"l": "1Th 5:6", "n": "", "vs": [[6, "إذن، لا ننم كما ينام الآخرون، بل لنظل ساهرين وصاحين،"]]}, {"l": "Heb 13:17", "n": "", "vs": [[17, "أطيعوا مرشديكم، واخضعوا لهم، لأنهم يسهرون على مصلحتكم الروحية، كما يسهر الذي يحمل مسئولية سوف يقدم حسابا عن قيامه بها. وعندئذ، يؤدون مهمتهم بفرح دون تذمر. فلن يكون في تذمرهم نفع لكم!"]]}, {"l": "Rev 3:2", "n": "", "vs": [[2, "تيقظ، وما تبقى لديك أنعشه قبل أن يموت، لأني وجدت أعمالك غير كاملة في نظر إلهي."]]}], "kwAr": "فكن بصيرا", "noteAr": ""}, {"kw": "endure", "raw": "2Ti_1:8, 2Ti_2:3, 2Ti_2:10, 2Ti_3:10-12", "note": "", "refs": [{"l": "2Ti 1:8", "n": "", "vs": [[8, "فلا تخجل إذن بالشهادة لربنا، ولا تخجل بي أنا السجين لأجله، بل شاركني في المشقات لأجل الإنجيل، متوكلا على قدرة الله."]]}, {"l": "2Ti 2:3", "n": "", "vs": [[3, "شارك في احتمال الآلام كجندي صالح للمسيح يسوع."]]}, {"l": "2Ti 2:10", "n": "", "vs": [[10, "لهذا السبب أحتمل كل شيء بصبر لأجل الذين اختارهم الله ، لكي يحصلوا، هم أيضا، على الخلاص الذي في المسيح يسوع مع المجد الأبدي."]]}, {"l": "2Ti 3:10-12", "n": "", "vs": [[10, "وأما أنت، فقد عرفت جيدا تعليمي، وسيرتي، وهدفي، وإيماني، وتحملي للمشقات، ومحبتي، وثباتي،"], [11, "واضطهاداتي، وآلامي تلك التي حدثت لي في مدن أنطاكية وإيقونية ولسترة وغيرها؛ وكم احتملت من اضطهادات، والرب أنقذني منها جميعا!"], [12, "وحقا، إن جميع الذين يعزمون أن يعيشوا عيشة التقوى في المسيح يسوع يضطهدون."]]}], "kwAr": "وتحمل المشقات", "noteAr": ""}, {"kw": "an", "raw": "Act_21:8; Eph_4:11; 1Ti_4:12, 1Ti_4:15", "note": "", "refs": [{"l": "Act 21:8", "n": "", "vs": [[8, "وفي اليوم التالي ذهبنا إلى مدينة قيصرية ونزلنا ضيوفا ببيت المبشر فيلبس، وهو واحد من المدبرين السبعة،"]]}, {"l": "Eph 4:11", "n": "", "vs": [[11, "وهو قد وهب البعض أن يكونوا رسلا، والبعض أنبياء، والبعض مبشرين والبعض رعاة ومعلمين،"]]}, {"l": "1Ti 4:12", "n": "", "vs": [[12, "لا يستخف أحد بحداثة سنك. وإنما كن قدوة للمؤمنين، في الكلام والسلوك والمحبة والإيمان والطهارة."]]}, {"l": "1Ti 4:15", "n": "", "vs": [[15, "انصرف إلى هذه الأمور، وانشغل بها كليا، ليكون تقدمك واضحا للجميع."]]}], "kwAr": "عمل المبشر", "noteAr": ""}, {"kw": "make full proof of", "raw": "or, fulfil, Rom_15:19; Col_1:25, Col_4:17", "note": "or, fulfil, Rom_15:19; Col_1:25, Col_4:17", "refs": [{"l": "Rom 15:19", "n": "", "vs": [[19, "وبقوة الآيات والعجائب، وبقوة روح الله. حتى إنني، من أورشليم وما حولها حتى مقاطعة إليريكون، قد أكملت التبشير بإنجيل المسيح."]]}, {"l": "Col 1:25", "n": "", "vs": [[25, "ولها قد صرت أنا خادما بموجب تدبير الله الموهوب لي من أجلكم، وهو أن أتمم كلمة الله، بإعلان"]]}, {"l": "Col 4:17", "n": "", "vs": [[17, "وقولوا لأرخبس: «تنبه للخدمة التي تلقيتها في الرب، وقم بها كاملة!»"]]}], "kwAr": "وأكمل خدمتك", "noteAr": "أو: تمّم (خدمتك)."}], "arS": [["أما أنت، ", []], ["فكن بصيرا", ["G3525"]], [" في ", []], ["كل", ["G3956"]], [" أمر، ", []], ["وتحمل المشقات", ["G2553"]], ["، ", []], ["واعمل", ["G4160"]], [" ", []], ["عمل", ["G2041"]], [" ", []], ["المبشر", ["G2099"]], ["، ", []], ["وأكمل", ["G4135"]], [" ", []], ["خدمتك", ["G1248", "G4675"]], [" إلى التمام!", []]]}, {"c": 4, "v": 6, "text": "وأما أنا، فها إن حياتي بدأت تسكب سكيبا، وموعد رحيلي قد اقترب.", "groups": [{"kw": "I am", "raw": "Phi_2:17", "note": "", "refs": [{"l": "Phi 2:17", "n": "", "vs": [[17, "حتى لو سفك دمي سكيبا فوق ذبيحة إيمانكم وخدمته، فإني أفرح وأبتهج معكم جميعا."]]}], "kwAr": "حياتي بدأت تسكب سكيبا", "noteAr": ""}, {"kw": "and", "raw": "Gen_48:21, Gen_50:24; Num_27:12-17; Deu_31:14; Jos_23:14; Phi_1:23; 2Pe_1:14, 2Pe_1:15", "note": "", "refs": [{"l": "Gen 48:21", "n": "", "vs": [[21, "ثم قال إسرائيل ليوسف: «إنني مشرف على الموت ولكن الله سيكون معكم ويردكم إلى أرض آبائكم."]]}, {"l": "Gen 50:24", "n": "", "vs": [[24, "ثم قال يوسف لإخوته: «أنا موشك على الموت، ولكن الله سيفتقدكم ويخرجكم من هذه الأرض ويردكم إلى الأرض التي وعد بها بقسم لإبراهيم وإسحق ويعقوب»."]]}, {"l": "Num 27:12-17", "n": "", "vs": [[12, "وقال الرب لموسى: «اصعد إلى جبل عباريم، وانظر من عبر النهر إلى الأرض التي أعطيتها لبني إسرائيل."], [13, "ومتى شاهدتها تموت وتنضم إلى قومك أيضا، نظير أخيك هرون."], [14, "لأنكما في صحراء صين عصيتما قولي، حين تمرد الشعب، ولم تقدساني أمام أعينهم، إذ لم تأمرا الماء بالتفجر من الصخرة». ذلك ماء مريبة عند قادش في صحراء صين"], [15, "فقال موسى للرب:"], [16, "«ليقم الرب، إله أرواح جميع الناس، قائدا للشعب،"], [17, "يخرج ويدخل أمامهم، يقودهم ويرجعهم لئلا تصبح جماعة الرب كغنم لا راعي لها»."]]}, {"l": "Deu 31:14", "n": "", "vs": [[14, "وكان الرب قد قال لموسى: «ها أنت قد أوشكت على الموت، وأيام حياتك باتت معدودة. فادع يشوع، وقفا كلاكما عند خيمة الاجتماع لكي أوصيه». فمضى موسى ويشوع ومثلا عند خيمة الاجتماع."]]}, {"l": "Jos 23:14", "n": "", "vs": [[14, "وها أنا اليوم ماض في الطريق التي يمضي إليها أحياء الأرض كلهم، ولكنكم تعلمون حق العلم من كل قلوبكم ومن كل نفوسكم أن جميع وعود الرب الصالحة التي وعدكم بها قد تحققت. الكل صار لكم. لم تسقط منه كلمة واحدة."]]}, {"l": "Phi 1:23", "n": "", "vs": [[23, "فأنا تحت ضغط من كليهما: إذ إني راغب في أن أرحل وأقيم مع المسيح، وهذا أفضل بكثير جدا؛"]]}, {"l": "2Pe 1:14", "n": "", "vs": [[14, "فأنا أعلم أن خيمتي ستطوى بعد وقت قصير، كما سبق أن أعلن لي ربنا يسوع المسيح."]]}, {"l": "2Pe 1:15", "n": "", "vs": [[15, "ولهذا، أجتهد الآن في تذكيركم بهذه الأمور، حتى تستطيعوا أن تتذكروها دائما بعد رحيلي."]]}], "kwAr": "وموعد رحيلي", "noteAr": ""}], "arS": [["وأما ", []], ["أنا", ["G1473"]], ["، فها إن حياتي بدأت ", []], ["تسكب سكيبا", ["G4689"]], ["، وموعد ", []], ["رحيلي", ["G359"]], [" قد ", []], ["اقترب", ["G2186"]], [".", []]]}, {"c": 4, "v": 7, "text": "قد جاهدت الجهاد الحسن، قد بلغت نهاية الشوط، قد حافظت على الإيمان.", "groups": [{"kw": "", "raw": "have thought, 1Ti_6:12", "note": "have thought, 1Ti_6:12", "refs": [{"l": "1Ti 6:12", "n": "", "vs": [[12, "أحسن الجهاد في معركة الإيمان الجميلة. تمسك بالحياة الأبدية، التي إليها قد دعيت، وقد اعترفت الاعتراف الحسن (بالإيمان) أمام شهود كثيرين."]]}], "kwAr": "", "noteAr": "قد جاهدت الجهاد الحسن؛ انظر 1تي 6: 12."}, {"kw": "I have finished", "raw": "Joh_4:34; Act_13:25, Act_20:24; 1Co_9:24-27; Phi_3:13, Phi_3:14; Heb_12:1, Heb_12:2", "note": "", "refs": [{"l": "Joh 4:34", "n": "", "vs": [[34, "فقال لهم يسوع: «طعامي هو أن أعمل مشيئة الذي أرسلني وأن أنجز عمله."]]}, {"l": "Act 13:25", "n": "", "vs": [[25, "ولما أوشك يوحنا أن ينهي مهمته، قال: من تظنونني؟ لست أنا (المخلص)، بل إنه آت بعدي. ولست أستحق أن أحل رباط حذائه!"]]}, {"l": "Act 20:24", "n": "", "vs": [[24, "ولكني لا أحسب لحياتي أية قيمة، ما دمت أسعى إلى بلوغ غايتي وإتمام الخدمة التي كلفني إياها الرب يسوع: أن أشهد ببشارة نعمة الله."]]}, {"l": "1Co 9:24-27", "n": "", "vs": [[24, "أما تعلمون أن المتبارين يركضون جميعا في الميدان ولكن واحدا منهم فقط يفوز بالجائزة؟ هكذا اركضوا أنتم حتى تفوزوا!"], [25, "وكل متبار يفرض على نفسه تدريبا صارما في شتى المجالات. فهؤلاء المتبارون يفعلون ذلك ليفوزوا بإكليل فان، وأما نحن فلنفوز بإكليل غير فان."], [26, "إذن، أنا أركض هكذا، لا كمن لا هدف له، وهكذا ألاكم أيضا، لا كمن يلطم الهواء،"], [27, "بل أسدد اللكمات إلى جسدي وأسوقه أسيرا، مخافة أن يتبين أني غير مؤهل (للمجازاة) بعدما دعوت الآخرين إليها!"]]}, {"l": "Phi 3:13", "n": "", "vs": [[13, "أيها الإخوة، أنا لا أعتبر نفسي قد نلت الجائزة، ولكني أفعل أمرا واحدا: أنسى ما هو وراء وأتقدم إلى ما هو أمام،"]]}, {"l": "Phi 3:14", "n": "", "vs": [[14, "إذ أسعى إلى الهدف، لنوال تلك الجائزة التي يدعونا الله إليها دعوة عليا في المسيح يسوع."]]}, {"l": "Heb 12:1", "n": "", "vs": [[1, "فبما أن هذا العدد الكبير من الشاهدين للإيمان، يتجمع حولنا كأنه سحابة عظيمة، فلنطرح جانبا كل ثقل يعيقنا عن التقدم، ونتخلص من تلك الخطيئة التي نتعرض للسقوط في فخها بسهولة، لكي نتمكن، نحن أيضا، أن نركض باجتهاد في السباق الممتد أمامنا،"]]}, {"l": "Heb 12:2", "n": "", "vs": [[2, "متطلعين دائما إلى يسوع: رائد إيماننا ومكمله. فهو قد تحمل الموت صلبا، هازئا بما في ذلك من عار، إذ كان ينظر إلى السرور الذي ينتظره، ثم جلس عن يمين عرش الله."]]}], "kwAr": "قد بلغت نهاية الشوط", "noteAr": ""}, {"kw": "I have kept", "raw": "2Ti_1:14; Pro_23:23; Luk_8:15, Luk_11:28; Joh_17:6; 1Ti_6:20; Rev_3:8, Rev_3:10", "note": "", "refs": [{"l": "2Ti 1:14", "n": "", "vs": [[14, "وحافظ على الأمانة الكريمة المودعة لديك، بالروح القدس الحال فينا."]]}, {"l": "Pro 23:23", "n": "", "vs": [[23, "اقتن الحق ولا تبعه، وكذا الحكمة والتأديب والفطنة."]]}, {"l": "Luk 8:15", "n": "", "vs": [[15, "وأما الذي وقع في الأرض الجيدة، فهم الذين يسمعون الكلمة ويحفظونها في قلب جيد مستقيم، وينتجون ثمرا بالصبر."]]}, {"l": "Luk 11:28", "n": "", "vs": [[28, "إلا أنه قال: «بل طوبى للذين يسمعون كلمة الله ويعملون بها»."]]}, {"l": "Joh 17:6", "n": "", "vs": [[6, "أظهرت اسمك للناس الذين وهبتهم لي من العالم. كانوا لك، فوهبتهم لي. وقد عملوا بكلمتك،"]]}, {"l": "1Ti 6:20", "n": "", "vs": [[20, "ياتيموثاوس، حافظ على الأمانة المودعة لديك. تجنب الكلام الدنس الباطل، ومناقضات ما يسمى زورا «معرفة»."]]}, {"l": "Rev 3:8", "n": "", "vs": [[8, "إني عالم بأعمالك. فمع أن لك قوة ضئيلة، فقد أطعت كلمتي ولم تنكر اسمي، ولذلك فتحت لك بابا لا يقدر أحد أن يغلقه."]]}, {"l": "Rev 3:10", "n": "", "vs": [[10, "ولأنك حفظت كلمتي وصبرت، فسأحفظك أنا أيضا من ساعة التجربة التي ستأتي على العالم أجمع لتجرب الساكنين على الأرض."]]}], "kwAr": "قد حافظت على الإيمان", "noteAr": ""}], "arS": [["قد ", []], ["جاهدت", ["G75"]], [" ", []], ["الجهاد", ["G73"]], [" ", []], ["الحسن", ["G2570"]], ["، قد ", []], ["بلغت نهاية", ["G5055"]], [" ", []], ["الشوط", ["G1408"]], ["، قد ", []], ["حافظت", ["G5083"]], [" على ", []], ["الإيمان", ["G4102"]], [".", []]]}, {"c": 4, "v": 8, "text": "إنما ينتظرني الآن إكليل البر المحفوظ لي، والذي سيهبه لي الرب الديان العادل في ذلك اليوم؛ ولن يوهب لي وحدي، بل أيضا لجميع الذين يحبون ظهوره.", "groups": [{"kw": "there", "raw": "Psa_31:19; Mat_6:19, Mat_6:20; Col_1:5; 1Ti_6:19", "note": "", "refs": [{"l": "Psa 31:19", "n": "", "vs": [[19, "يارب، ما أعظم صلاحك الذي ذخرته لخائفيك، وأظهرته للواثقين بك على مرأى جميع البشر،"]]}, {"l": "Mat 6:19", "n": "", "vs": [[19, "لا تكنزوا لكم كنوزا على الأرض، حيث يفسدها السوس والصدأ، وينقب عنها اللصوص ويسرقون."]]}, {"l": "Mat 6:20", "n": "", "vs": [[20, "بل اكنزوا لكم كنوزا في السماء، حيث لا يفسدها سوس ولا ينقب عنها لصوص ولا يسرقون."]]}, {"l": "Col 1:5", "n": "", "vs": [[5, "بسبب الرجاء المحفوظ لكم في السماوات، الرجاء الذي سمعتم به سابقا في كلمة الحق التي في الإنجيل"]]}, {"l": "1Ti 6:19", "n": "", "vs": [[19, "وبذلك يوفرون لأنفسهم رأس مال للمستقبل، حتى يمسكوا بالحياة الحقيقية."]]}], "kwAr": "ينتظرني الآن", "noteAr": ""}, {"kw": "a crown", "raw": "2Ti_2:5; Pro_4:9; 1Co_9:25; Jam_1:12; 1Pe_5:4; Rev_2:10, Rev_4:4, Rev_4:10", "note": "", "refs": [{"l": "2Ti 2:5", "n": "", "vs": [[5, "كما أن المصارع لا يفوز بالإكليل إلا إذا صارع بحسب القوانين."]]}, {"l": "Pro 4:9", "n": "", "vs": [[9, "تتوج رأسك بإكليل جمال، وتنعم عليك بتاج بهاء»."]]}, {"l": "1Co 9:25", "n": "", "vs": [[25, "وكل متبار يفرض على نفسه تدريبا صارما في شتى المجالات. فهؤلاء المتبارون يفعلون ذلك ليفوزوا بإكليل فان، وأما نحن فلنفوز بإكليل غير فان."]]}, {"l": "Jam 1:12", "n": "", "vs": [[12, "طوبى لمن يتحمل المحنة بصبر. فإنه، بعد أن يجتاز الامتحان بنجاح، سينال «إكليل الحياة» الذي وعد به الرب محبيه!"]]}, {"l": "1Pe 5:4", "n": "", "vs": [[4, "وعندما يظهر رئيس الرعاة، تنالون إكليل المجد الذي لا يفنى."]]}, {"l": "Rev 2:10", "n": "", "vs": [[10, "دع عنك الخوف مما ينتظرك من آلام، فإن إبليس سيزج ببعضكم في السجن لكي تمتحنوا، فتقاسون الاضطهاد عشرة أيام. فابق أمينا حتى الموت، فأمنحك إكليل الحياة."]]}, {"l": "Rev 4:4", "n": "", "vs": [[4, "وقد أحاط بالعرش أربعة وعشرون عرشا يجلس عليها أربعة وعشرون شيخا يلبسون ثيابا بيضاء، وعلى رؤوسهم أكاليل من ذهب."]]}, {"l": "Rev 4:10", "n": "", "vs": [[10, "يجثو الشيوخ الأربعة والعشرون أمام الجالس على العرش ساجدين للحي إلى أبد الآبدين، ويلقون أكاليلهم أمام عرشه وهم يهتفون:"]]}], "kwAr": "إكليل البر", "noteAr": ""}, {"kw": "the righteous", "raw": "2Ti_4:1; Gen_18:25; Psa_7:11; Rom_2:5; 2Th_1:5, 2Th_1:6; Rev_19:11", "note": "", "refs": [{"l": "2Ti 4:1", "n": "", "vs": [[1, "أطلب منك في حضرة الله والمسيح الذي سيدين الأحياء والأموات، بعودته العلنية وملكوته،"]]}, {"l": "Gen 18:25", "n": "", "vs": [[25, "تنزهت عن أن تهلك البار مع الأثيم، فيكون البار كالأثيم؛ حاشا لك. أديان الأرض كلها لا يجري عدلا؟»"]]}, {"l": "Psa 7:11", "n": "", "vs": [[11, "الله قاض عادل، وهو إله يسخط على الأشرار في كل يوم."]]}, {"l": "Rom 2:5", "n": "", "vs": [[5, "ولكنك بسبب قساوتك وقلبك غير التائب، تخزن لنفسك غضبا ليوم الغضب، يوم تعلن دينونة الله العادلة."]]}, {"l": "2Th 1:5", "n": "", "vs": [[5, "وفي هذا دليل على حكم الله العادل، بقصد أن تعتبروا مؤهلين لملكوت الله الذي من أجله تلاقون الآلام."]]}, {"l": "2Th 1:6", "n": "", "vs": [[6, "فمن العدل عند الله حقا أن يجازي بالضيقة أولئك الذين يضايقونكم،"]]}, {"l": "Rev 19:11", "n": "", "vs": [[11, "ثم رأيت السماء مفتوحة، وإذا حصان أبيض يسمى راكبه «الأمين الصادق» الذي يقضي ويحارب بالعدل."]]}], "kwAr": "الديان العادل", "noteAr": ""}, {"kw": "at that", "raw": "2Ti_1:12, 2Ti_1:18; Mal_3:17; Mat_7:22, Mat_24:36; Luk_10:12; 1Th_5:4", "note": "", "refs": [{"l": "2Ti 1:12", "n": "", "vs": [[12, "من أجل ذلك أيضا أقاسي الآن هذه الآلام، ولكني لست أخجل، لأنني أعرف من أنا مؤمن به، ولي تمام الثقة بأنه قادر أن يحفظ لي الأمانة التي أودعتها عنده سالمة إلى ذلك اليوم."]]}, {"l": "2Ti 1:18", "n": "", "vs": [[18, "لينعم عليه الرب بأن يلقى الرحمة من الرب في ذلك اليوم! أما كل ما خدمني به في مدينة أفسس، فأنت تعرفه جيدا."]
