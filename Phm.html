<script>window.CATALOG=[{"id": 17, "abbr": "Est", "en": "Esther", "nc": 10, "nv": 167, "refs": 1266, "last": "10:3", "first": "وحدث في أيام أحشويروش، الذي امتد حكمه من الهند إلى كوش، فملك على مئة وسبعة وعشرين إقليما،"}, {"id": 18, "abbr": "Job", "en": "Job", "nc": 42, "nv": 1070, "refs": 10209, "last": "42:17", "first": "عاش في أرض عوص رجل اسمه أيوب، كان صالحا كاملا يتقي الله ويحيد عن الشر."}, {"id": 19, "abbr": "Psa", "en": "Psalms", "nc": 150, "nv": 2461, "refs": 33395, "last": "150:6", "first": "طوبى للإنسان الذي لا يتبع مشورة الأشرار، ولا يقف في طريق الخاطئين، ولا يجالس المستهزئين."}, {"id": 20, "abbr": "Pro", "en": "Proverbs", "nc": 31, "nv": 915, "refs": 10457, "last": "31:31", "first": "هذه هي أمثال سليمان بن داود ملك إسرائيل،"}, {"id": 21, "abbr": "Ecc", "en": "Ecclesiastes", "nc": 12, "nv": 222, "refs": 3186, "last": "12:14", "first": "هذه أقوال الجامعة ابن داود ملك أورشليم."}, {"id": 22, "abbr": "Son", "en": "Song of Solomon", "nc": 8, "nv": 117, "refs": 1802, "last": "8:14", "first": "هذا نشيد الأناشيد لسليمان."}, {"id": 23, "abbr": "Isa", "en": "Isaiah", "nc": 66, "nv": 1292, "refs": 21959, "last": "66:24", "first": "هذه هي رؤيا إشعياء بن آموص، التي أعلنت له بشأن يهوذا وأورشليم في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا."}, {"id": 24, "abbr": "Jer", "en": "Jeremiah", "nc": 52, "nv": 1364, "refs": 20659, "last": "52:34", "first": "هذه نبوءة إرميا بن حلقيا أحد الكهنة المقيمين في عناثوث بأرض سبط بنيامين."}, {"id": 25, "abbr": "Lam", "en": "Lamentations", "nc": 5, "nv": 154, "refs": 2238, "last": "5:22", "first": "كيف أصبحت المدينة الآهلة بالسكان مهجورة وحيدة؟ صارت كأرملة! هذه التي كانت عظيمة بين الأمم. السيدة بين المدن صارت تحت الجزية!"}, {"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 48, "nv": 1273, "refs": 15264, "last": "48:35", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 57, "abbr": "Phm", "en": "Philemon", "verses": [{"c": 1, "v": 1, "text": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،", "groups": [{"kw": "", "raw": "ad 64, am 4068", "note": "ad 64, am 4068", "refs": [], "kwAr": "", "noteAr": "كُتبت نحو سنة 64م (سنة 4068 من بدء الخليقة حسب التقويم القديم)."}, {"kw": "a prisoner", "raw": "Phm_1:9; Eph_3:1, Eph_4:1, Eph_6:20; 2Ti_1:8", "note": "", "refs": [{"l": "Phm 1:9", "n": "", "vs": [[9, "إلا أني، إكراما للمحبة، اخترت أن أقدم إليك التماسا، بصفتي بولس العجوز والسجين حاليا لأجل المسيح يسوع."]]}, {"l": "Eph 3:1", "n": "", "vs": [[1, "لهذا السبب، أنا بولس سجين المسيح يسوع لأجلكم أنتم الأمم …"]]}, {"l": "Eph 4:1", "n": "", "vs": [[1, "... إذن، أنا السجين في الرب، أناشدكم أن تسلكوا سلوكا يليق بالدعوة التي إليها دعيتم،"]]}, {"l": "Eph 6:20", "n": "", "vs": [[20, "الذي أنا سفيره المقيد بالسلاسل، فأكون جريئا في إعلانه كما يجب أن أتكلم به."]]}, {"l": "2Ti 1:8", "n": "", "vs": [[8, "فلا تخجل إذن بالشهادة لربنا، ولا تخجل بي أنا السجين لأجله، بل شاركني في المشقات لأجل الإنجيل، متوكلا على قدرة الله."]]}], "kwAr": "السجين لأجل المسيح يسوع", "noteAr": ""}, {"kw": "Timothy", "raw": "2Co_1:1; Col_1:1; 2Th_1:1", "note": "", "refs": [{"l": "2Co 1:1", "n": "", "vs": [[1, "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."]]}, {"l": "Col 1:1", "n": "", "vs": [[1, "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"]]}, {"l": "2Th 1:1", "n": "", "vs": [[1, "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."]]}], "kwAr": "تيموثاوس", "noteAr": ""}, {"kw": "Philemon", "raw": "Th e apostle in this epistle indulges in some fine paronomasais on the proper names. Thus Philemon, Φιλημον [Strongs G5371], affectionate, or beloved, is our dearly beloved; Apphia (Απφια [Strongs G682], from απφα), the affectionate address of a brother or sister, according to Suidas), is the beloved sister, as several manuscripts, Vulgate, and others correctly read; Archippus (Αρχιππος [Strongs G751], the ruler of the horse, for the managing of which heros were anciently famous), is our fellow- soldier; and Onesimus (Ονησιμος [Strongs G3682], useful or profitable), once unprofitable, is now profitable., and fellow labourer, Phm_1:24; 1Co_3:9; Phi_2:25, Phi_4:3; Col_4:11; 1Th_3:2", "note": "Th e apostle in this epistle indulges in some fine paronomasais on the proper names. Thus Philemon, Φιλημον [Strongs G5371], affectionate, or beloved, is our dearly beloved; Apphia (Απφια [Strongs G682], from απφα), the affectionate address of a brother or sister, according to Suidas), is the beloved sister, as several manuscripts, Vulgate, and others correctly read; Archippus (Αρχιππος [Strongs G751], the ruler of the horse, for the managing of which heros were anciently famous), is our fellow- soldier; and Onesimus (Ονησιμος [Strongs G3682], useful or profitable), once unprofitable, is now profitable., and fellow labourer, Phm_1:24; 1Co_3:9; Phi_2:25, Phi_4:3; Col_4:11; 1Th_3:2", "refs": [{"l": "Phm 1:24", "n": "", "vs": [[24, "وكذلك مرقس، وأرسترخس، وديماس، ولوقا زملائي في العمل."]]}, {"l": "1Co 3:9", "n": "", "vs": [[9, "فإننا نحن جميعا عاملون معا عند الله، وأنتم حقل الله وبناء الله."]]}, {"l": "Phi 2:25", "n": "", "vs": [[25, "إلا أني رأيت من الضروري أن أرسل إليكم أبفروديتس، أخي ومعاوني ورفيقي في التجند، والمرسل من قبلكم عاملا على سد حاجتي،"]]}, {"l": "Phi 4:3", "n": "", "vs": [[3, "أجل، أطلب إليك أنت أيضا، أيها الزميل المخلص، أن تساعدهما، لأنهما جاهدتا معي في خدمة الإنجيل، هما وأكليمندس ومعاوني الآخرون، المكتوبة أسماؤهم في سجل الحياة."]]}, {"l": "Col 4:11", "n": "", "vs": [[11, "ويسوع المعروف باسم يسطس. هؤلاء جميعا من أهل الختان، وهم وحدهم معاوني لأجل ملكوت الله، وقد كانوا لي عزاء."]]}, {"l": "1Th 3:2", "n": "", "vs": [[2, "فبعثنا تيموثاوس، أخانا ومعاوننا في خدمة الله بنشر الإنجيل، لكي يشددكم ويشجعكم في إيمانكم،"]]}], "kwAr": "فليمون", "noteAr": "يتلاعب الرسول في هذه الرسالة تلاعبًا لطيفًا بمعاني أسماء الأعلام: ففليمون (Φιλημον G5371) معناه «المحب أو المحبوب»، وهو «حبيبنا»؛ وأبفية (Απφια G682) لفظ تحبب بين الإخوة والأخوات، وهي «الأخت الحبيبة» كما تقرأ مخطوطات عدة والفولجاتا؛ وأرخيبوس (Αρχιππος G751) «قائد الخيل»، وهو «رفيقنا في التجند»؛ وأونسيموس (Ονησιμος G3682) «النافع»، الذي كان غير نافع وصار الآن نافعًا. وعن «شريكنا في العمل» انظر الشواهد."}], "arS": [["من ", []], ["بولس", ["G3972"]], ["، ", []], ["السجين", ["G1198"]], [" لأجل ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], ["، ومن ", []], ["تيموثاوس", ["G5095"]], [" ", []], ["الأخ", ["G80"]], ["، إلى ", []], ["فليمون", ["G5371"]], [" ", []], ["الحبيب", ["G27"]], [" ", []], ["شريكنا في العمل", ["G4904"]], ["،", []]]}, {"c": 1, "v": 2, "text": "وإلى أبفية الأخت، وأرخيبوس رفيقنا في التجند، وإلى الكنيسة التي في بيتك.", "groups": [{"kw": "Archippus", "raw": "Col_4:17", "note": "", "refs": [{"l": "Col 4:17", "n": "", "vs": [[17, "وقولوا لأرخبس: «تنبه للخدمة التي تلقيتها في الرب، وقم بها كاملة!»"]]}], "kwAr": "أرخيبوس", "noteAr": ""}, {"kw": "our fellowsoldier", "raw": "Phi_2:25; 2Ti_2:3, 2Ti_2:4", "note": "", "refs": [{"l": "Phi 2:25", "n": "", "vs": [[25, "إلا أني رأيت من الضروري أن أرسل إليكم أبفروديتس، أخي ومعاوني ورفيقي في التجند، والمرسل من قبلكم عاملا على سد حاجتي،"]]}, {"l": "2Ti 2:3", "n": "", "vs": [[3, "شارك في احتمال الآلام كجندي صالح للمسيح يسوع."]]}, {"l": "2Ti 2:4", "n": "", "vs": [[4, "وما من مجند يربك نفسه بشؤون الحياة إذا رغب في إرضاء من جنده."]]}], "kwAr": "رفيقنا في التجند", "noteAr": ""}, {"kw": "the church", "raw": "Rom_16:5; 1Co_16:19; Col_4:15", "note": "", "refs": [{"l": "Rom 16:5", "n": "", "vs": [[5, "وسلموا على الكنيسة في بيتهما. سلموا على أبينتوس، حبيبي الذي هو باكورة للمسيح من مقاطعة أسيا."]]}, {"l": "1Co 16:19", "n": "", "vs": [[19, "الكنائس في مقاطعة أسيا تسلم عليكم. ويسلم عليكم في الرب كثيرا، أكيلا وبريسكلا مع الكنيسة التي في بيتهما."]]}, {"l": "Col 4:15", "n": "", "vs": [[15, "سلموا على الإخوة الذين في لاودكية، وعلى نمفاس، وعلى الكنيسة التي في بيته."]]}], "kwAr": "الكنيسة التي في بيتك", "noteAr": ""}], "arS": [["وإلى ", []], ["أبفية", ["G682"]], [" الأخت، ", []], ["وأرخيبوس", ["G751"]], [" ", []], ["رفيقنا في التجند", ["G4961"]], ["، وإلى ", []], ["الكنيسة", ["G1577"]], [" التي في ", []], ["بيتك", ["G3624", "G4675"]], [".", []]]}, {"c": 1, "v": 3, "text": "لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!", "groups": [{"kw": "", "raw": "Rom_1:7; 2Co_13:14; Eph_1:2", "note": "", "refs": [{"l": "Rom 1:7", "n": "", "vs": [[7, "إلى جميع من هم في روما من أحباء الله القديسين المدعوين. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}, {"l": "2Co 13:14", "n": "", "vs": [[14, "ولتكن معكم جميعا نعمة ربنا يسوع المسيح، ومحبة الله، وشركة الروح القدس. آمين!"]]}, {"l": "Eph 1:2", "n": "", "vs": [[2, "لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."]]}], "kwAr": "", "noteAr": ""}], "arS": [["لتكن لكم ", []], ["النعمة", ["G5485"]], [" ", []], ["والسلام", ["G1515"]], [" من ", []], ["الله", ["G2316"]], [" ", []], ["أبينا", ["G3962", "G2257"]], [" ", []], ["والرب", ["G2962"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], ["!", []]]}, {"c": 1, "v": 4, "text": "إني أشكر إلهي، إذ أذكرك دائما في صلواتي،", "groups": [{"kw": "", "raw": "Rom_1:8; Eph_1:16; Phi_1:3; Col_1:3; 1Th_1:2; 2Th_1:3; 2Ti_1:3", "note": "", "refs": [{"l": "Rom 1:8", "n": "", "vs": [[8, "بادىء بدء، أشكر إلهي بيسوع المسيح من أجلكم جميعا، لأن إيمانكم يذاع خبره في العالم كله."]]}, {"l": "Eph 1:16", "n": "", "vs": [[16, "لا أنقطع عن شكر الله لأجلكم وعن ذكركم في صلواتي،"]]}, {"l": "Phi 1:3", "n": "", "vs": [[3, "إني أشكر إلهي كلما تذكرتكم،"]]}, {"l": "Col 1:3", "n": "", "vs": [[3, "إننا دائما نرفع الشكر لله، أبي ربنا يسوع المسيح فيما نصلي لأجلكم."]]}, {"l": "1Th 1:2", "n": "", "vs": [[2, "إننا نشكر الله دائما من أجلكم جميعا، إذ نذكركم في صلواتنا دون توقف؛"]]}, {"l": "2Th 1:3", "n": "", "vs": [[3, "من واجبنا أن نشكر الله على الدوام لأجلكم أيها الإخوة. كما أن هذا حق: لأن إيمانك ن."]]}, {"l": "Rom 15:26", "n": "", "vs": [[26, "ذلك أن مؤمني مقاطعتي مقدونية وأخائية حسن لديهم أن يجمعوا إعانة للفقراء بين القديسين الذين في أورشليم."]]}, {"l": "1Co 16:1", "n": "", "vs": [[1, "وأما بخصوص جمع التبرعات للقديسين، فكما أوصيت الكنائس في مقاطعة غلاطية، كذلك اعملوا أنتم أيضا."]]}, {"l": "1Jo 3:23", "n": "", "vs": [[23, "وأما وصيته فهي أن نؤمن باسم ابنه يسوع المسيح، وأن يحب بعضنا بعضا كما أوصانا."]]}, {"l": "1Jo 5:1", "n": "", "vs": [[1, "كل من يؤمن حقا أن يسوع هو المسيح، فهو مولود من الله. ومن يحب الوالد، فلابد أن يحب المولودين منه أيضا."]]}, {"l": "1Jo 5:2", "n": "", "vs": [[2, "وما يثبت لنا محبتنا لأولاد الله هو أن نحب الله ونعمل بوصاياه."]]}], "kwAr": "من نحو الرب يسوع", "noteAr": ""}], "arS": [["وقد ", []], ["سمعت", ["G191"]], [" بما لك من ", []], ["محبة", ["G26"]], [" ", []], ["وأمانة", ["G4102"]], [" من نحو ", []], ["الرب", ["G2962"]], [" ", []], ["يسوع", ["G2424"]], ["، ومن نحو ", []], ["جميع", ["G3956"]], [" ", []], ["القديسين", ["G40"]], ["،", []]]}, {"c": 1, "v": 6, "text": "طالبا أن يكون اشتراكك معنا في الإيمان فعالا، فتدرك إلى التمام ما فينا من كل صلاح لأجل المسيح.", "groups": [{"kw": "the communication", "raw": "2Co_9:12-14; Phi_1:9-11; Tit_3:14; Heb_6:10; Jam_2:14, Jam_2:17", "note": "", "refs": [{"l": "2Co 9:12-14", "n": "", "vs": [[12, "ذلك لأن خدمة الله بهذه الإعانة لا تسد حاجة القديسين وحسب، بل تفيض بشكر كثير لله."], [13, "فإن القديسين، إذ يختبرون هذه الخدمة، يمجدون الله على طاعتكم في الشهادة لإنجيل المسيح وعلى السخاء الطوعي في مشاركتكم لهم وللجميع."], [14, "كما يرفعون الدعاء لأجلكم، متشوقين إليكم، بسبب نعمة الله الفائقة التي ظهرت فيكم."]]}, {"l": "Phi 1:9-11", "n": "", "vs": [[9, "وصلاتي لأجلكم هي هذه: أن تزداد محبتكم أكثر فأكثر في تمام المعرفة والإدراك،"], [10, "لكي تستحسنوا الأمور الممتازة، حتى تكونوا طاهرين وخالين من العثرات إلى يوم المسيح،"], [11, "كاملين في ثمار البر الآتية بيسوع المسيح، لمجد الله وحمده."]]}, {"l": "Tit 3:14", "n": "", "vs": [[14, "وليتعلم ذوونا أيضا أن يمارسوا أعمالا حسنة، لسد الحاجات الضرورية، لكي لا يكونوا عديمي الثمر."]]}, {"l": "Heb 6:10", "n": "", "vs": [[10, "وليس الله بظالم حتى ينسى عملكم الجاد في إظهار محبتكم له عن طريق خدمتكم للقديسين إكراما لاسمه، الأمر الذي قمتم به قبلا، وتقومون به الآن!"]]}, {"l": "Jam 2:14", "n": "", "vs": [[14, "ياإخوتي، هل ينفع أحدا أن يدعي أنه مؤمن، وليس له أعمال تثبت ذلك، هل يقدر إيمان مثل هذا أن يخلصه؟"]]}, {"l": "Jam 2:17", "n": "", "vs": [[17, "هكذا نرى أن الإيمان وحده ميت ما لم تنتج عنه أعمال."]]}], "kwAr": "اشتراكك معنا في الإيمان", "noteAr": ""}, {"kw": "the acknowledging", "raw": "Mat_5:16; 1Co_14:25; Phi_4:8; 1Pe_1:5-8, 1Pe_2:12, 1Pe_3:1, 1Pe_3:16", "note": "", "refs": [{"l": "Mat 5:16", "n": "", "vs": [[16, "هكذا، فليضيء نوركم أمام الناس، ليروا أعمالكم الحسنة ويمجدوا أباكم الذي في السماوات."]]}, {"l": "1Co 14:25", "n": "", "vs": [[25, "وإذ تنكشف خبايا قلبه، يخر على وجهه ساجدا لله، معترفا بأن الله فيكم حقا."]]}, {"l": "Phi 4:8", "n": "", "vs": [[8, "وختاما، أيها الإخوة: كل ما كان حقا، وكل ما كان شريفا، وكل ما كان عادلا، وكل ما كان طاهرا وكل ما كان مستحبا، وكل ما كان حسن السمعة، وكل ما كان فيه فضيلة وخصلة حميدة، فاشغلوا أفكاركم به."]]}, {"l": "1Pe 1:5-8", "n": "", "vs": [[5, "محفوظا لكم في السماوات. فإنكم محفوظون بقدرة الله العاملة من خلال إيمانكم، إلى أن تفوزوا بالخلاص النهائي المعد لكم والذي سوف يتجلى في الزمان الأخير."], [6, "وهذا يدعوكم إلى الابتهاج، مع أنه لابد لكم الآن من الحزن فترة قصيرة تحت وطأة التجارب المتنوعة!"], [7, "إلا أن غاية هذه التجارب هي اختبار حقيقة إيمانكم. فكما تختبر النار الذهب وتنقيه، تختبر التجارب حقيقة إيمانكم، وهو أثمن جدا من الذهب الفاني. وهكذا، يكون إيمانكم مدعاة مدح وإكرام وتمجيد لكم، عندما يعود يسوع المسيح ظاهرا بمجده."], [8, "أنتم لم تروا المسيح، ولكنكم تحبونه. ومع أنكم لا ترونه الآن، فأنتم تؤمنون به وتبتهجون بفرح مجيد يفوق الوصف."]]}, {"l": "1Pe 2:12", "n": "", "vs": [[12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالحة يمجدون الله في يوم الافتقاد."]]}, {"l": "1Pe 3:1", "n": "", "vs": [[1, "كذلك، أيتها الزوجات، اخضعن لأزواجكن. حتى وإن كان الزوج "], [4, "وما أعظم الفرح الذي يغمر قلبي حين أسمع الأخبار الطيبة التي تؤكد أن أولادي يسلكون بحسب الحق!"], [5, "أيها الحبيب، إن معاملتك الحسنة للإخوة وللغرباء تدل على أنك تتصرف بأمانة نحو الله."], [6, "وقد شهد هؤلاء الإخوة، أمام الكنيسة، شهادة جميلة لمحبتك. فإنك تفعل حسنا إذا زودتهم بما يحتاجون إليه في السفر. فأنت تعرف أن هذا يرضي الله ،"]]}], "kwAr": "سرور عظيم", "noteAr": ""}, {"kw": "the bowels", "raw": "Phm_1:20; 2Co_7:13; 2Ti_1:16", "note": "", "refs": [{"l": "Phm 1:20", "n": "", "vs": [[20, "نعم، أيها الأخ، أطلب منك أن تنفعني، في الرب، بهذا المعروف: أنعش عواطفي في المسيح"]]}, {"l": "2Co 7:13", "n": "", "vs": [[13, "لهذا السبب قد تعزينا. وفوق تعزيتنا، فرحنا أكثر جدا لفرح تيطس لأن روحه انتعشت بكم جميعا."]]}, {"l": "2Ti 1:16", "n": "", "vs": [[16, "ليرحم الرب عائلة أونيسيفورس، لأنه كثيرا ما أنعشني، ولم يخجل بقيودي،"]]}], "kwAr": "عواطف القديسين", "noteAr": ""}], "arS": [["فقد كان لي أيها ", []], ["الأخ", ["G80"]], ["، ", []], ["سرور", ["G5485"]], [" ", []], ["عظيم", ["G4183"]], [" ", []], ["وتشجيع", ["G3874"]], ["، بفضل ", []], ["محبتك", ["G26"]], ["، لأن ", []], ["عواطف", ["G4698"]], [" ", []], ["القديسين", ["G40"]], [" قد ", []], ["انتعشت", ["G373"]], [" بفضلك!", []]]}, {"c": 1, "v": 8, "text": "لذلك، فمع أن لي كامل الحق في المسيح أن آمرك بالواجب،", "groups": [{"kw": "bold", "raw": "2Co_3:12, 2Co_10:1, 2Co_10:2, 2Co_11:21; 1Th_2:2, 1Th_2:6", "note": "", "refs": [{"l": "2Co 3:12", "n": "", "vs": [[12, "فإذ لنا هذا الرجاء الوطيد، نعمل بكثير من الجرأة."]]}, {"l": "2Co 10:1", "n": "", "vs": [[1, "ولكني أتوسل إليكم بوداعة المسيح وحلمه، أنا بولس «المتواضع وأنا حاضر بينكم، والجريء عليكم وأنا غائب عنكم»،"]]}, {"l": "2Co 10:2", "n": "", "vs": [[2, "راجيا ألا تضطروني لأن أكون جريئا عند حضوري، فألجأ إلى الحزم الذي أظن أني سأتجرأ عليه في معاملة من يظنون منكم أننا نسلك وفقا للجسد."]]}, {"l": "2Co 11:21", "n": "", "vs": [[21, "ياللمهانة! كم كنا ضعفاء في معاملتنا لكم!"]]}, {"l": "1Th 2:2", "n": "", "vs": [[2, "فمع أننا كنا قد قاسينا الألم والإهانة في مدينة فيلبي، كما تعلمون، فقد بع مرات؟»"], [22, "فأجابه يسوع: «لا إلى سبع مرات، بل إلى سبعين سبع مرات!"], [23, "لهذا السبب، يشبه ملكوت السماوات بإنسان ملك أراد أن يحاسب عبيده."], [24, "فلما شرع يحاسبهم، أحضر إليه واحد مديون بعشرة آلاف وزنة."], [25, "وإذ لم يكن عنده ما يوفي به دينه، أمر سيده بأن يباع هو وزوجته وأولاده وكل ما يملك ليوفي الدين."], [26, "لكن العبد خر أمامه ساجدا وقائلا: ياسيد، أمهلني فأوفي لك الدين كله."], [27, "فأشفق سيد ذلك العبد عليه، فأطلق سراحه، وسامحه بالدين."], [28, "«ولكن لما خرج ذلك العبد، قصد واحدا من زملائه العبيد كان مديونا له بمئة دينار. فقبض عليه وأخذ بخناقه قائلا: أوفني ما عليك!"], [29, "فخر زميله العبد أمامه وقال متوسلا: أمهلني فأوفيك!"], [30, "فلم يقبل بل مضى وألقاه في السجن حتى يوفي ما عليه."], [31, "وإذ شاهد زملاؤه العبيد ما جرى، حزنوا جدا، فمضوا وأخبروا سيدهم بكل ما جرى."], [32, "فاستدعاه سيده وقال له: أيها العبد الشرير، ذلك الدين كله سامحتك به لأنك توسلت إلي."], [33, "أفما كان يجب أن ترحم زميلك العبد كما رحمتك أنا؟"], [34, "وإذ ثار غضب سيده عليه، دفعه إلى الجلادين ليعذبوه حتى يوفي كل ما عليه."], [35, "هكذا يفعل بكم أبي السماوي إن لم يغفر كل منكم لأخيه من قلبه! »"]]}, {"l": "Mar 11:25", "n": "", "vs": [[25, "ومتى وقفتم تصلون، وكان لكم على أحد شيء، فاغفروا له، لكي يغفر لكم أبوكم الذي في السماوات زلاتكم أيضا."]]}, {"l": "Eph 4:32", "n": "", "vs": [[32, "وكونوا لطفاء بعضكم نحو بعض، شفوقين، مسامحين بعضكم بعضا كما سامحكم الله في المسيح."]]}], "kwAr": "فاقبله", "noteAr": ""}, {"kw": "mine", "raw": "Deu_13:6; 2Sa_16:11; Jer_31:20; Luk_15:20", "note": "", "refs": [{"l": "Deu 13:6", "n": "", "vs": [[6, "وإذا أضلك سرا أخوك ابن أمك، أو ابنك أو ابنتك، أو زوجتك المحبوبة، أو صديقك الحميم قائلا: لنذهب ونعبد آلهة أخرى غريبة عنك وعن آبائك"]]}, {"l": "2Sa 16:11", "n": "", "vs": [[11, "وقال الملك لأبيشاي وسائر رجاله: «هوذا ابني الذي خرج من صلبي يسعى لقتلي، فكم بالحري هذا البنياميني. دعوه يشتم لأن الرب أمره بشتمي."]]}, {"l": "Jer 31:20", "n": "", "vs": [[20, "هل أفرايم ابن أثير لدي؟ أليس هو ابنا مسرا؟ لأني مع كثرة تنديدي به فإني مازلت أذكره، لذلك يشتاق قلبي إليه، وأكن له الرحمة»، يق
