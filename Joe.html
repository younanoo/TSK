 Psa_2:9, Psa_7:6, Psa_76:8, Psa_76:9, Psa_96:13, Psa_98:9, Psa_110:5, Psa_110:6; Isa_2:4, Isa_3:13; Eze_30:3; Mic_4:3; Rev_19:11", "note": "", "refs": [{"l": "Psa 2:8", "n": "", "vs": [[8, "اطلب مني فأعطيك الأمم ميراثا، وأقاصي الأرض ملكا لك."]]}, {"l": "Psa 2:9", "n": "", "vs": [[9, "فتكسرهم بقضيب من حديد، وتحطمهم كآنية الفخار»."]]}, {"l": "Psa 7:6", "n": "", "vs": [[6, "انهض يارب في احتدام غضبك، وانتصب في وجه سخط خصومي، يامن أوصيت بالعدل."]]}, {"l": "Psa 76:8", "n": "", "vs": [[8, "من السماء أصدرت حكما فلما سمعته الأرض فزعت وصمتت."]]}, {"l": "Psa 76:9", "n": "", "vs": [[9, "كان ذلك عندما قمت للقضاء لتخلص ودعاء الأرض كلهم."]]}, {"l": "Psa 96:13", "n": "", "vs": [[13, "في حضرة الرب لأنه آت ليدين العالم بالعدل والشعوب بالحق."]]}, {"l": "Psa 98:9", "n": "", "vs": [[9, "أمام الرب لأنه جاء ليدين الأرض بالعدل والشعوب بالإنصاف."]]}, {"l": "Psa 110:5", "n": "", "vs": [[5, "الرب واقف عن يمينك. في يوم غضبه يحطم ملوكا."]]}, {"l": "Psa 110:6", "n": "", "vs": [[6, "يقضي بين الأمم، فيملأ الأرض الرحبة بجثث رؤسائها."]]}, {"l": "Isa 2:4", "n": "", "vs": [[4, "فيقضي بين الأمم ويحكم بين الشعوب الكثيرة، فيطبعون سيوفهم محاريث ورماحهم مناجل، ولا ترفع أمة على أمة سيفا، ولا يتدربون على الحرب فيما بعد."]]}, {"l": "Isa 3:13", "n": "", "vs": [[13, "لقد تربع الرب على كرسي القضاء، قام ليدين الناس."]]}, {"l": "Eze 30:3", "n": "", "vs": [[3, "إن يوم الرب بات وشيكا؛ يوم الرب قريب، إنه يوم مكفهر بالغيوم، ساعة دينونة للأمم،"]]}, {"l": "Mic 4:3", "n": "", "vs": [[3, "فيقضي بين الأمم الكثيرة ويملي أحكامه بعدل على أمم قوية بعيدة، فيصنعون من سيوفهم أسنة محاريث، ومن رماحهم مناجل حصاد، فلا ترفع أمة على أمة سيفا ولا يتلقنون فنون الحرب بعد."]]}, {"l": "Rev 19:11", "n": "", "vs": [[11, "ثم رأيت السماء مفتوحة، وإذا حصان أبيض يسمى راكبه «الأمين الصادق» الذي يقضي ويحارب بالعدل."]]}], "kwAr": "لأنني", "noteAr": ""}], "arS": [["لتنهض", ["H5782"]], [" ", []], ["الأمم", ["H1471"]], [" ", []], ["وتقبل", ["H5927"]], [" إلى ", []], ["وادي", ["H6010"]], [" القضاء لأنني ", []], ["هناك", ["H8033"]], [" ", []], ["أجلس", ["H3427"]], [" ", []], ["لأدين", ["H8199"]], [" ", []], ["الشعوب", ["H1471"]], [" المتوافدة من كل ", []], ["جهة", ["H4480", "H5439"]], [".", []]]}, {"c": 3, "v": 13, "text": "احملوا المنجل لأن الحصيد قد نضج. تعالوا ودوسوا فإن معصرة الخمر قد امتلأت، والحياض فاضت بكثرة شرهم.", "groups": [{"kw": "the sickle", "raw": "Deu_16:9; Mar_4:29; Rev_14:15, Rev_14:16", "note": "", "refs": [{"l": "Deu 16:9", "n": "", "vs": [[9, "احسبوا سبعة أسابيع منذ ابتداء حصاد الزرع،"]]}, {"l": "Mar 4:29", "n": "", "vs": [[29, "ولكن حالما ينضج الثمر، يعمل فيه المنجل إذ يكون الحصاد قد حان»."]]}, {"l": "Rev 14:15", "n": "", "vs": [[15, "وخرج ملاك آخر من الهيكل يناديه بصوت عال: «أرسل منجلك ليحصد، فقد حلت ساعة الحصاد ونضج حصاد الأرض»."]]}, {"l": "Rev 14:16", "n": "", "vs": [[16, "فألقى الجالس على السحابة منجله على الأرض فحصدت الأرض."]]}], "kwAr": "المنجل", "noteAr": ""}, {"kw": "the harvest", "raw": "Jer_51:33; Hos_6:11; Mat_13:39", "note": "", "refs": [{"l": "Jer 51:33", "n": "", "vs": [[33, "لأن هذا ما يعلنه الرب القدير إله إسرائيل: إن أهل بابل كالبيدر، وقد حان أوان درس حنطته. وبعد قليل يأزف موعد حصادهم."]]}, {"l": "Hos 6:11", "n": "", "vs": [[11, "أما أنت يايهوذا فقد تحدد موعد عقابك عندما أرد سبي شعبي."]]}, {"l": "Mat 13:39", "n": "", "vs": [[39, "أما العدو الذي زرع الزوان فهو إبليس. والحصاد هو نهاية الزمان. والحصادون هم الملائكة."]]}], "kwAr": "الحصيد", "noteAr": ""}, {"kw": "for the press", "raw": "Isa_63:3; Lam_1:15; Rev_14:17-20", "note": "", "refs": [{"l": "Isa 63:3", "n": "", "vs": [[3, "لقد دست المعصرة وحدي، ولم يكن معي أحد من الشعوب. قد دستهم في سخطي ووطئتهم في غيظي، فتناثر دمهم على ردائي ولطخت ثيابي."]]}, {"l": "Lam 1:15", "n": "", "vs": [[15, "بدد الرب جميع جبابرتي في وسطي، وألب علي حشدا من أعدائي ليسحقوا شباني. داس الرب العذراء بنت صهيون كما يداس العنب في المعصرة."]]}, {"l": "Rev 14:17-20", "n": "", "vs": [[17, "ثم خرج ملاك آخر من الهيكل الذي في السماء، ومعه أيضا منجل حاد."], [18, "ومن المذبح خرج ملاك آخر له السلطة على النار، ونادى بصوت عظيم الملاك الذي يمسك المنجل الحاد: «أرسل منجلك الحاد واقطف عناقيد كرم الأرض لأن عنبها قد نضج»."], [19, "فألقى الملاك منجله إلى الأرض وقطف العناقيد وألقاها في معصرة غضب الله العظمى،"], [20, "فديست المعصرة بالأرجل خارج المدينة، فانبثق منها الدم وجرى أنهارا حتى إلى لجم الخيل، مسافة ثلثمائة وعشرين كيلومترا."]]}], "kwAr": "فإن معصرة", "noteAr": ""}, {"kw": "for their", "raw": "Gen_13:13, Gen_15:16, Gen_18:20", "note": "", "refs": [{"l": "Gen 13:13", "n": "", "vs": [[13, "وكان أهل سدوم متورطين في الشر وخاطئين جدا لدى الرب."]]}, {"l": "Gen 15:16", "n": "", "vs": [[16, "أما هم فسيرجعون بعد أربعة أجيال إلى هنا، لأن إثم الأموريين لم يكتمل بعد»."]]}, {"l": "Gen 18:20", "n": "", "vs": [[20, "وقال الرب: «لأن الشكوى ضد مظالم سدوم وعمورة قد كثرت وخطيئتهم قد عظمت جدا"]]}], "kwAr": "بكثرة شرهم", "noteAr": ""}], "arS": [["احملوا", ["H7971"]], [" ", []], ["المنجل", ["H4038"]], [" لأن ", []], ["الحصيد", ["H7105"]], [" قد ", []], ["نضج", ["H1310"]], [". ", []], ["تعالوا", ["H935"]], [" ", []], ["ودوسوا", ["H3381"]], [" فإن ", []], ["معصرة", ["H1660"]], [" الخمر قد ", []], ["امتلأت", ["H4390"]], ["، ", []], ["والحياض", ["H3342"]], [" ", []], ["فاضت", ["H7783"]], [" ", []], ["بكثرة", ["H7227"]], [" ", []], ["شرهم", ["H7451"]], [".", []]]}, {"c": 3, "v": 14, "text": "جماهير جماهير متزاحمة في وادي القضاء، لأن يوم الرب قريب في وادي القضاء.", "groups": [{"kw": "multitudes", "raw": "Joe_3:2; Isa_34:2-8, Isa_63:1-7; Ezek. 38:8-23, Eze_39:8-20; Rev_16:14-16, Rev_19:19-21", "note": "", "refs": [{"l": "Joe 3:2", "n": "", "vs": [[2, "أجمع الأمم كلها وأحضرهم إلى وادي يهوشافاط، وأحاكمهم هناك من أجل شعبي وميراثي إسرائيل، لأنهم شتتوهم بين الشعوب واقتسموا أرضي."]]}, {"l": "Isa 34:2-8", "n": "", "vs": [[2, "لأن الرب ساخط على كل الشعوب، وغضبه منصب على جميع أجنادهم. قضى عليهم بالفناء، وأسلمهم إلى الذبح،"], [3, "فتطرح قتلاهم وينتشر نتن جيفهم في الفضاء، وتفيض الجبال بدمائهم،"], [4, "وتنحل كل كواكب السماء، وتطوى السماوات كدرج، وتتساقط كل نجومها كتساقط أوراق الكرمة أو حبات التين المتغضنة."], [5, "لأن سيفي قد تشرب بالسخط في السماء، وها هو ينزل ليعاقب أدوم، وينتقم من الشعب الذي قضيت عليه بالفناء."], [6, "للرب سيف مشبع بالدم، مطلي بالشحم، بدم حملان وتيوس، وبشحم كلى كباش، لأن للرب ذبيحة في بصرة، ومذبحة في أدوم."], [7, "ويسقط معهم البقر الوحشي، والعجول والثيران القوية، فتتشبع أرضهم بالدماء، ويخصب ترابهم بالشحم،"], [8, "لأن للرب يوم انتقام، سنة ثأر لدعوى صهيون،"]]}, {"l": "Isa 63:1-7", "n": "", "vs": [[1, "من هذا المقبل من أدوم، بثياب حمراء من بصرة؛ هذا المتسربل بالبهاء. السائر بخيلاء قوته؟ إنه أنا الرب الناطق بالبر، العظيم للخلاص."], [2, "ما بال ردائك أحمر وثيابك كمن داس عنب المعصرة؟"], [3, "لقد دست المعصرة وحدي، ولم يكن معي أحد من الشعوب. قد دستهم في سخطي ووطئتهم في غيظي، فتناثر دمهم على ردائي ولطخت ثيابي."], [4, "لأن يوم الانتقام كان كامنا في قلبي، وسنة مفديي قد أتت."], [5, "تلفت فلم أعثر على معين، وعجبت إذ لم يكن من ناصر، فانتصرت بقوة ذراعي، وتأيدت بنجدة سخطي،"], [6, "فدست الشعوب في غيظي، وأسكرتهم في غضبي، وسكبت دماءهم فوق الأرض."], [7, "ألهج برأفات الرب وتسابيحه وإحساناته التي أغدقها على بيت إسرائيل بفضل خيره ورحمته."]]}, {"l": "Eze 38:8-23", "n": "", "vs": [[8, "إذ بعد أيام كثيرة تستدعى للقتال، فتقبل في السنين الأخيرة إلى الأرض الناجية من السيف التي تم جمع أهلها من بين شعوب كثيرة، فأقاموا مطمئنين على جبال إسرائيل التي كانت دائما مقفرة في نظر الذين لم شتاتهم من بين الأمم،"], [9, "فتأتي مندفعا كزوبعة، وتكون كسحابة تغطي الأرض أنت وجيوشك وكل من معك من شعوب كثيرة."], [10, "ويحدث في ذلك اليوم أن أفكار سوء تراودك"], [11, "فتقول: أزحف على أرض عراء مكشوفة وأهاجم المطمئنين الساكنين في أمن، المقيمين كلهم من غير سور يقيهم، وليس لديهم مزاليج ولا مصاريع،"], [12, "للاستيلاء على الأسلاب ونهب الغنائم ومهاجمة الخرائب التي أصبحت آهلة، ولمحاربة الشعب المجتمع من بين الأمم، المقتني ماشية وأملاكا، المستوطن في مركز الأرض."], [13, "ويسألك أهل شبا ورودس وتجار ترشيش وكل قراها؛ أقادم أنت للاستيلاء على الأسلاب؟ هل حشدت جيوشك لنهب الغنائم ولحمل الفضة والذهب وأخذ الماشية والمقتنيات وللسلب العظيم؟"], [14, "لذلك تنبأ ياابن آدم، وقل لجوج هذا ما يعلنه السيد الرب: في ذلك اليوم عندما يسكن شعبي إسرائيل آمنا، ألا تعلم ذلك؟"], [15, "وتقبل أنت من مقرك في أقاصي الشمال مع جيوش غفيرة، تغشي الأرض؛ كلهم راكبو خيل وجمع عظيم وجيش كثير."], [16, "وتزحف على شعبي إسرائيل كسحابة تغطي الأرض، أني في الأيام الأخيرة آتي بك إلى أرضي لكي تعرفني الشعوب عندما تتجلى قداستي حين أدمرك ياجوج أمام عيونهم.هذا ما يقوله السيد الرب:"], [17, "ألست أنت الذي تحدثت عنه في الأيام الغابرة على ألسنة عبيدي أنبياء إسرائيل الذين تنبأوا في تلك الأيام لسنين كثيرة بأني سآتي بك عليهم؟"], [18, "ويقول السيد الرب: في ذلك اليوم عندما يزحف جوج على أرض إسرائيل يحتدم غضبي في وجهي."], [19, "وفي خضم غيرتي واتقاد سخطي أقول إنه في ذلك اليوم تحدث هزة عظيمة في أرض إسرائيل،"], [20, "فيرتعش من حضرتي سمك البحر وطيور السماء ووحوش البرية وجميع الحيوانات الدابة على الأرض، وكل الناس الذين على وجه المسكونة، وتندك الجبال وتسقط المعاقل وتنهار كل الأسوار إلى الأرض."], [21, "وأسلط عليه السيف في كل جبالي يقول السيد الرب، فيكون سيف كل رجل ضد أخيه."], [22, "وأدينه بالوباء وبالدم، وأمطر عليه وعلى جيوشه وعلى جموع حلفائه الغفيرة مطرا جارفا وبردا عظيما ونارا وكبريتا."], [23, "فأعظم نفسي وأقدسها، وأعلن ذاتي على مرأى من كل الأمم، فيدركون أني أنا الرب»."]]}, {"l": "Eze 39:8-20", "n": "", "vs": [[8, "ها إن الأمر قد وقع وتم يقول السيد الرب. هذا هو اليوم الذي أخبرت به،"], [9, "فيخرج سكان مدن إسرائيل ويحرقون الأسلحة والمجان والأتراس والقسي والسهام والحراب والرماح، ويوقدون بها النار سبع سنين."], [10, "ولا يجمعون من الحقل قضيبا ولا يحتطبون من الغاب، لأنهم يوقدون النار بالسلاح، وينهبون ناهبيهم ويسلبون سالبيهم، يقول السيد الرب."], [11, "ومن ذلك اليوم أجعل لجوج موضعا يدفن فيه في إسرائيل، هو وادي العابرين المتجه شرقا نحو البحر (الميت)، فيسد الطريق أمام العابرين إذ هناك يدفنون جوجا وسائر جيوشه ويدعون الموضع «وادي جمهور جوج»."], [12, "ويقوم شعب إسرائيل بدفنهم طوال سبعة أشهر تطهيرا للأرض."], [13, "ويتولى كل شعب الأرض دفنهم، ويكون يوم تمجيدي يوما مشهودا لهم، يقول السيد الرب."], [14, "ويخصصون رجالا يتجولون دائما في الأرض ليدفنوا مع العابرين جثث الباقين على وجه الأرض تطهيرا لها. وبعد سبعة أشهر يستكشفونها."], [15, "فيجتاز العابرون فيها، فإن عثر أحد على عظم إنسان يكوم إلى جواره صوة إلى أن يأتي العابرون ليدفنوه في وادي جمهور جوج."], [16, "ويكون اسم المدينة همونة (أي حشدا أو جماعة) وهكذا يطهرون الأرض."], [17, "أما أنت ياابن آدم، فهذا ما يعلنه السيد الرب: قل لكل أصناف الطيور ولجميع وحوش البرية اجتمعي وتعالي، احتشدي من كل جهة حول ذبيحتي التي أعدها لك، ذبيحة عظيمة أقيمها على جبال إسرائيل فتأكلين لحما وتشربين دما."], [18, "تأكلين لحم الجبابرة وترتوين من دماء رؤساء الأرض وكأنها كباش وحملان وتيوس وعجول كلها من قطعان باشان السمينة."], [19, "فتأكلين شحما حتى الشبع، وتشربين دما حتى السكر من ذبيحتي التي أعددتها لك."], [20, "فتشبعين على مائدتي من الخيل وفرسانها، من الجبابرة وكل المحاربين، يقول السيد الرب."]]}, {"l": "Rev 16:14-16", "n": "", "vs": [[14, "وهي أرواح شيطانية قادرة على صنع المعجزات، تذهب إلى ملوك الأرض جميعا وتجمعهم للحرب في ذلك اليوم العظيم، يوم الله القادر على كل شيء."], [15, "»ها أنا آت كما يأتي اللص، طوبى لمن يكون بانتظاري، ساهرا وحارسا لثيابه، لئلا يمشي عريانا فيرى الناس عورته!«"], [16, "وجمعت الأرواح الشيطانية جيوش العالم كلها في مكان يسمى بالعبرية «هرمجدون»."]]}, {"l": "Rev 19:19-21", "n": "", "vs": [[19, "ورأيت الوحش وملوك الأرض وجيوشهم وقد احتشدوا ليحاربوا هذا الفارس وجيشه."], [20, "فقبض على الوحش وعلى النبي الدجال الذي قام بالمعجزات في حضور الوحش وأضل بها الذين قبلوا علامة الوحش، وسجدوا لتمثاله. وطرح كلاهما حيا في بحيرة النار والكبريت المتقدة،"], [21, "وقتل السيف الخارج من فم الفارس جميع الباقين، وشبعت الطيور كلها من لحومهم."]]}], "kwAr": "جماهير", "noteAr": ""}, {"kw": "decision", "raw": "or, concision, Phi_3:2, or, threshing", "note": "or, concision, Phi_3:2, or, threshing", "refs": [{"l": "Phi 3:2", "n": "", "vs": [[2, "خذوا حذركم من «الكلاب»، من العمال الأشرار، من الذين يبترون الجسد."]]}], "kwAr": "وادي القضاء", "noteAr": "أو: «قطع»، انظر في 3: 2؛ أو: «دراس»."}, {"kw": "for", "raw": "Joe_2:1; Psa_37:13; 2Pe_3:7", "note": "", "refs": [{"l": "Joe 2:1", "n": "", "vs": [[1, "انفخوا بالبوق في صهيون، وأطلقوا نفير الإنذار في جبل قدسي، وليرتعد جميع سكان الأرض، لأن يوم الرب مقبل وقد بات وشيكا."]]}, {"l": "Psa 37:13", "n": "", "vs": [[13, "ولكن الرب يضحك منه لأنه يرى أن يوم عقابه آت."]]}, {"l": "2Pe 3:7", "n": "", "vs": [[7, "أما السماوات والأرض الحالية، فستبقى مخزونة ومحفوظة للنار بتلك الكلمة عينها إلى يوم الدينونة وهلاك الفاجرين!"]]}], "kwAr": "لأن يوم", "noteAr": ""}], "arS": [["جماهير", ["H1995"]], [" جماهير متزاحمة في وادي ", []], ["القضاء", ["H2742"]], ["، لأن ", []], ["يوم", ["H3117"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["قريب", ["H7138"]], [" في ", []], ["وادي", ["H6010"]], [" القضاء.", []]]}, {"c": 3, "v": 15, "text": "قد أظلمت الشمس والقمر، وكفت الكواكب عن الضياء.", "groups": [{"kw": "", "raw": "Joe_2:10,Joe_2:31; Isa_13:10; Mat_24:29; Luk_21:25, Luk_21:26; Rev_6:12, Rev_6:13", "note": "", "refs": [{"l": "Joe 2:10", "n": "", "vs": [[10, "ترتعد الأرض أمامهم وترجف السماء، تظلم الشمس والقمر، وتكف الكواكب عن الضياء."]]}, {"l": "Joe 2:31", "n": "", "vs": [[31, "وتتحول الشمس إلى ظلام، والقمر إلى دم، قبل مجيء يوم الرب العظيم المخيف."]]}, {"l": "Isa 13:10", "n": "", "vs": [[10, "فإن نجوم السماء وكواكبها لا تشرق بنورها، والشمس تظلم عند بزوغها، والقمر لا يشع بضوئه."]]}, {"l": "Mat 24:29", "n": "", "vs": [[29, "وحالا بعد الضيقة في تلك الأيام، تظلم الشمس، ويحجب القمر ضوءه، وتتهاوى النجوم من السماء، وتتزعزع قوات السماوات."]]}, {"l": "Luk 21:25", "n": "", "vs": [[25, "وستظهر علامات في الشمس والقمر والنجوم، وتكون على الأرض ضيقة على الأمم الواقعة في حيرة، لأن البحر والأمواج تعج وتجيش،"]]}, {"l": "Luk 21:26", "n": "", "vs": [[26, "ويغمى على الناس من الرعب ومن توقع ما سوف يجتاح المسكونة، إذ تتزعزع قوات السماوات."]]}, {"l": "Rev 6:12", "n": "", "vs": [[12, "ثم نظرت، فرأيت الحمل يفك الختم السادس، وإذا الأرض قد زلزلت زلزالا عظيما، والشمس اسودت فصارت كخرقة من شعر، وصار القمر أحمر كالدم،"]]}, {"l": "Rev 6:13", "n": "", "vs": [[13, "وسقطت نجوم السماء على الأرض كما تطرح شجرة التين ثمارها الفجة، إذا هزتها ريح عاصفة."]]}], "kwAr": "", "noteAr": ""}], "arS": [["قد ", []], ["أظلمت", ["H6937"]], [" ", []], ["الشمس", ["H8121"]], [" ", []], ["والقمر", ["H3394"]], ["، ", []], ["وكفت", ["H622"]], [" ", []], ["الكواكب", ["H3556"]], [" عن ", []], ["الضياء", ["H5051"]], [".", []]]}, {"c": 3, "v": 16, "text": "يزأر الرب في صهيون، ويجلجل بصوته من أورشليم فترجف السماوات والأرض؛ لكن الرب يكون ملجأ لشعبه، وحصنا لبني إسرائيل.", "groups": [{"kw": "roar", "raw": "Joe_2:11; Isa_42:13; Jer_25:30,Jer_25:31; Hos_11:10; Amo_1:2, Amo_3:8", "note": "", "refs": [{"l": "Joe 2:11", "n": "", "vs": [[11, "يجهر الرب بصوته في مقدمة جيشه لأن جنده لا يحصى لهم عدد، ومن ينفذ أمره يكون مقتدرا، لأن يوم الرب عظيم ومخيف جدا، فمن يتحمله؟"]]}, {"l": "Isa 42:13", "n": "", "vs": [[13, "يبرز الرب كجبار، يستثير حميته كما يستثيرها المحارب، ويطلق صرخة حرب داوية، يظهر جبروته أمام أعدائه."]]}, {"l": "Jer 25:30", "n": "", "vs": [[30, "أما أنت فتنبأ عليهم بكل هذا القضاء، وقل لهم: «الرب يزأر من العلاء، ومن مسكن قدسه يدوي صوته. يزأر زئيرا على مسكنه، ويجهر هاتفا على جميع سكان الأرض كما يجهر الدائسون على العنب»."]]}, {"l": "Jer 25:31", "n": "", "vs": [[31, "قد بلغت الجلبة جميع أقاصي الأرض، لأن للرب دعوى على الأمم، فيدخل في محاكمة مع البشر، ويلقي بالأشرار إلى السيف."]]}, {"l": "Hos 11:10", "n": "", "vs": [[10, "يسيرون ورائي أنا الرب، فأزأر كالأسد، وعندئذ يسرع أبنائي قادمين من الغرب."]]}, {"l": "Amo 1:2", "n": "", "vs": [[2, "قال: «يزأر الرب من صهيون ويدوي بصوته من أورشليم، فتنتحب مراعي الرعاة، وتذوي قمة الكرمل."]]}, {"l": "Amo 3:8", "n": "", "vs": [[8, "قد زأر الأسد فمن لا يخاف، وتكلم الرب فمن لا يتنبأ؟"]]}], "kwAr": "يزأر", "noteAr": ""}, {"kw": "and the heavens", "raw": "Joe_2:10; Eze_38:19; Hag_2:6; Heb_12:26; Rev_11:13, Rev_11:19, Rev_16:18", "note": "", "refs": [{"l": "Joe 2:10", "n": "", "vs": [[10, "ترتعد الأرض أمامهم وترجف السماء، تظلم الشمس والقمر، وتكف الكواكب عن الضياء."]]}, {"l": "Eze 38:19", "n": "", "vs": [[19, "وفي خضم غيرتي واتقاد سخطي أقول إنه في ذلك اليوم تحدث هزة عظيمة في أرض إسرائيل،"]]}, {"l": "Hag 2:6", "n": "", "vs": [[6, "لأنه هكذا يقول الرب القدير: ها أنا مزمع مرة أخرى، عما قليل، أن أزلزل السماء والأرض والبحر واليابسة."]]}, {"l": "Heb 12:26", "n": "", "vs": [[26, "وإذ تكلم الله قديما، زلزل صوته الأرض، أما الآن، فيعد قائلا: «إني مرة أخرى، سوف أزلزل لا الأرض وحدها، بل السماء أيضا!»"]]}, {"l": "Rev 11:13", "n": "", "vs": [[13, "وفي الوقت ذاته يحدث زلزال عنيف يدمر عشر المدينة، ويهلك سبعة آلاف من ساكنيها. فيرتعب الناجون ويمجدون إله السماء."]]}, {"l": "Rev 11:19", "n": "", "vs": [[19, "وانفتح هيكل الله في السماء، وظهر تابوت العهد في داخله. وحدثت بروق وأصوات ورعود وزلزلة، وسقط برد كبير."]]}, {"l": "Rev 16:18", "n": "", "vs": [[18, "فحدثت بروق وأصوات ورعود وزلزال عنيف لم تشهد الأرض له مثيلا منذ وجد الإنسان على الأرض، لأنه كان زلزالا عنيفا جدا!"]]}], "kwAr": "فترجف السماوات", "noteAr": ""}, {"kw": "hope", "raw": "Heb. place of repair, or, harbour, Psa_18:2, Psa_46:1-11, Psa_61:3, Psa_91:1, Psa_91:2; Pro_18:10; Isa_33:16, Isa_33:21, Isa_51:5, Isa_51:6, Isa_51:16", "note": "Heb. place of repair, or, harbour, Psa_18:2, Psa_46:1-11, Psa_61:3, Psa_91:1, Psa_91:2; Pro_18:10; Isa_33:16, Isa_33:21, Isa_51:5, Isa_51:6, Isa_51:16", "refs": [{"l": "Psa 18:2", "n": "", "vs": [[2, "الرب صخرتي وحصني ومنقذي. إلهي صخرتي به أحتمي. ترسي وركن خلاصي، وقلعتي الحصينة."]]}, {"l": "Psa 46:1-11", "n": "", "vs": [[1, "الله لنا ملجأ وقوة، عونه متوافر لنا دائما في الضيقات."], [2, "لذلك لا نخاف ولو تزحزحت الأرض وانقلبت الجبال إلى قلب البحار."], [3, "تهيج وتزبد مياهها؛ تتزلزل الجبال من عنف جيشانها."], [4, "تفرح مدينة الله حيث مساكن العلي بنهر دائم الجريان."], [5, "الله في وسط المدينة فلن تتزعزع. يعينها الله في الفجر المبكر."], [6, "ماجت الأمم وهاجت، فتزلزلت الممالك، ولكن ما إن دوى بصوته حتى ذابت الأرض."], [7, "رب الجنود معنا، ملجأنا إله يعقوب."], [8, "تعالوا وانظروا أعمال الله الذي صنع عجائب في الأرض"], [9, "يقضي على الحروب في الأرض كلها. يكسر القوس ويشق الرمح، ويحرق المركبات الحربية بالنار."], [10, "استكينوا واعلموا أني أنا الله ، أتعالى بين الأمم وأتعالى في الأرض."], [11, "رب الجنود معنا. ملجأنا إله يعقوب."]]}, {"l": "Psa 61:3", "n": "", "vs": [[3, "لأنك كنت لي ملجأ وبرجا منيعا يحميني من العدو."]]}, {"l": "Psa 91:1", "n": "", "vs": [[1, "المحتمي بقدس أقداس العلي، في ظل القدير يبيت،"]]}, {"l": "Psa 91:2", "n": "", "vs": [[2, "أقول للرب: أنت ملجإي وحصني، إلهي الذي به وثقت"]]}, {"l": "Pro 18:10", "n": "", "vs": [[10, "اسم الرب برج منيع يهرع إليه الصديق وينجو من الخطر."]]}, {"l": "Isa 33:16", "n": "", "vs": [[16, "هو الذي يسكن في العلاء، وملجأه معاقل الصخور، يؤمن له خبزه. ويكفل له ماؤه."]]}, {"l": "Isa 33:21", "n": "", "vs": [[21, "هناك يكون الرب لنا بجلاله مكان أنهار وجداول واسعة لا يبحر فيها قارب ذو مجداف، ولا تمخر فيها سفينة عظيمة،"]]}, {"l": "Isa 51:5", "n": "", "vs": [[5, "بري بات قريبا، وتجلى خلاصي، وذر اعاي تقضيان للشعوب، وإياي ترتقب الجزائر، وتنتظر برجاء ذراعي."]]}, {"l": "Isa 51:6", "n": "", "vs": [[6, "ارفعوا عيونكم إلى السماوات وتفرسوا في الأرض من تحت، فإن السماوات كدخان تضمحل، والأرض كثوب تبلى، ويبيد سكانها كالذباب. أما خلاصي فيبقى إلى الأبد، وبري يثبت مدى الدهر."]]}, {"l": "Isa 51:16", "n": "", "vs": [[16, "قد وضعت كلامي في فمك، وواريتك في ظل يدي، لأقر السماوات في موضعها وأرسي قواعد الأرض، وأقول لصهيون: أنت شعبي."]]}], "kwAr": "ملجأ", "noteAr": "بالعبرية: «موضع لجوء» أو «مرفأ». انظر مز 18: 2؛ 46: 1-11؛ 61: 3؛ 91: 1، 2؛ أم 18: 10؛ إش 33: 16، 21؛ 51: 5، 6، 16"}, {"kw": "and the strength", "raw": "1Sa_15:29; Psa_29:11; Zec_10:6, Zec_10:12, Zec_12:5-8", "note": "", "refs": [{"l": "1Sa 15:29", "n": "", "vs": [[29, "فإن قوة إسرائيل (أي الله) لا يكذب ولا يندم. ليس هو إنسانا حتى يغير رأيه»."]]}, {"l": "Psa 29:11", "n": "", "vs": [[11, "الرب يعطي شعبه عزا. الرب يبارك شعبه بالسلام."]]}, {"l": "Zec 10:6", "n": "", "vs": [[6, "إني أشدد شعب يهوذا وأخلص ذرية يوسف وأردهم إلى أرضهم لأني أكن لهم الرحمة، فيكونون كأني لم أنبذهم لأني أنا الرب إلههم فأستجيبهم."]]}, {"l": "Zec 10:12", "n": "", "vs": [[12, "وأشددهم بالرب فيسلكون بمقتضى اسمه، يقول الرب."]]}, {"l": "Zec 12:5-8", "n": "", "vs": [[5, "فيقول آنئذ رؤساء يهوذا في قلوبهم: إن سكان أورشليم أعزاء بفضل قوة الرب القدير إلههم."], [6, "في ذلك اليوم أجعل عشائر يهوذا كمستوقد نار بين الحطب، أو كمشعل ملتهب بين أكداس الحنطة، فيلتهمون الشعوب من حولهم ممن عن يمينهم وعن يسارهم، بينما تظل أورشليم مستقرة آمنة آهلة في موضعها."], [7, "ويخلص الرب أولا خيام يهوذا لئلا يتعاظم افتخار بيت داود وأهل أورشليم على سائر يهوذا."], [8, "في ذلك اليوم يحفظ الرب سكان أورشليم، فيكون أضعفهم قويا قادرا مثل داود، ويتولى بيت داود قيادتهم في الطليعة، تماما كما كان الله أو ملاك الرب يتقدمهم."]]}], "kwAr": "وحصنا", "noteAr": ""}], "arS": [["يزأر", ["H7580"]], [" ", []], ["الرب", ["H3068"]], [" في ", []], ["صهيون", ["H4480", "H6726"]], ["، ", []], ["ويجلجل", ["H5414"]], [" ", []], ["بصوته", ["H6963"]], [" من ", []], ["أورشليم", ["H4480", "H3389"]], [" ", []], ["فترجف", ["H7493"]], [" ", []], ["السماوات", ["H8064"]], [" ", []], ["والأرض", ["H776"]], ["؛ لكن الرب يكون ", []], ["ملجأ", ["H4268"]], [" ", []], ["لشعبه", ["H5971"]], ["، ", []], ["وحصنا", ["H4581"]], [" ", []], ["لبني", ["H1121"]], [" ", []], ["إسرائيل", ["H3478"]], [".", []]]}, {"c": 3, "v": 17, "text": "فتدركون أني أنا هو الرب إلهكم الساكن في صهيون جبلي المقدس، وتكون أورشليم مقدسة ولا يجتاز فيها الغرباء أبدا.", "groups": [{"kw": "shall ye", "raw": "Joe_3:21, Joe_2:27; Psa_9:11, Psa_76:2; Isa_12:6; Eze_48:35; Mic_4:7; Zep_3:14-16", "note": "", "refs": [{"l": "Joe 3:21", "n": "", "vs": [[21, "وأزكي دمهم الذي لم أبرئه، لأن الرب يسكن في صهيون."]]}, {"l": "Joe 2:27", "n": "", "vs": [[27, "فتدركون أني في وسط إسرائيل، وأني أنا هو الرب إلهكم وليس غيري، ولن يخزى شعبي ثانية."]]}, {"l": "Psa 9:11", "n": "", "vs": [[11, "أشيدوا بالحمد للرب المتوج في صهيون، أذيعوا بين الشعوب أعماله العظيمة."]]}, {"l": "Psa 76:2", "n": "", "vs": [[2, "خيمته في أورشليم ومسكنه في جبل صهيون."]]}, {"l": "Isa 12:6", "n": "", "vs": [[6, "اهتفوا وتغنوا ياأهل صهيون، لأن قدوس إسرائيل عظيم بينكم»."]]}, {"l": "Eze 48:35", "n": "", "vs": [[35, "أما محيط المدينة فهو ثمانية عشر ألف ذراع (نحو تسعة كيلومترات)، ويكون اسم المدينة من ذلك اليوم «يهوه شمة» ومعناه: «الرب هناك»."]]}, {"l": "Mic 4:7", "n": "", "vs": [[7, "فأجعل من العرج بقية، ومن المنبوذين أمة قوية، فيملك الرب عليهم في جبل صهيون من الآن وإلى الأبد."]]}, {"l": "Zep 3:14-16", "n": "", "vs": [[14, "اشدي ياابنة صهيون واهتف ياإسرائيل، ابتهجي وتهللي ياابنة أورشليم."], [15, "لأن الرب قد رفع عنك حكم قضائه ورد عنك أعداءك. إن الرب ملك إسرائيل هو في وسطك، فلا تخشي شرا في ما بعد."], [16, "ويقال في ذلك اليوم لأورشليم: لا تخافي ياصهيون، ولا ترتخ يداك."]]}], "kwAr": "فتدركون", "noteAr": ""}, {"kw": "my", "raw": "Dan_11:45; Oba_1:16; Zec_8:3", "note": "", "refs": [{"l": "Dan 11:45", "n": "", "vs": [[45, "وينصب خيمته الملكية بين البحر وأورشليم، ويبلغ نهاية مصيره وليس له من نصير»."]]}, {"l": "Oba 1:16", "n": "", "vs": [[16, "فإنه كما شربت على جبل قدسي فإن جميع الأمم تشرب في كل حين. يشربون ويجرعون ويتلاشون كمن لم يكونوا."]]}, {"l": "Zec 8:3", "n": "", "vs": [[3, "لهذا يقول الرب القدير: ها أنا عائد إلى صهيون لأقيم في أورشليم، فتدعى آنئذ مدينة الحق، كما يدعى جبل الرب القدير الجبل المقدس."]]}], "kwAr": "جبلي", "noteAr": ""}, {"kw": "Jerusalem", "raw": "Isa_4:3; Jer_31:23; Eze_43:12; Oba_1:17; Zec_14:20", "note": "", "refs": [{"l": "Isa 4:3", "n": "", "vs": [[3, "ويدعى كل من يبقى في صهيون ممن مكث في أورشليم قدوسا، كل من كتب للحياة في أورشليم،"]]}, {"l": "Jer 31:23", "n": "", "vs": [[23, "وهذا ما يعلنه الرب القدير إله إسرائيل: «سيرددون هذه العبارة مرة أخرى في أرض يهوذا وفي أرجاء مدنها، عندما أردهم من سبيهم: ليباركك الرب يامسكن البر، ياأيها الجبل المقدس."]]}, {"l": "Eze 43:12", "n": "", "vs": [[12, "وهذه هي شريعة الهيكل: إن رأس الجبل وكل المنطقة المحيطة به، هي قدس أقداس."]]}, {"l": "Oba 1:17", "n": "", "vs": [[17, "أما جبل صهيون فيصبح ملاذ النجاة، ويكون قدسا، ويرث بيت يعقوب نصيبه."]]}, {"l": "Zec 14:20", "n": "", "vs": [[20, "وينقش في ذلك اليوم على أجراس الخيل: «قدس للرب». وتكون القدور في الهيكل مقدسة كالمناضح التي أمام المذبح."]]}], "kwAr": "أورشليم", "noteAr": ""}, {"kw": "holy", "raw": "Heb. holiness", "note": "Heb. holiness", "refs": [], "kwAr": "مقدسة", "noteAr": "بالعبرية: «قداسة»."}, {"kw": "there", "raw": "Isa_35:8, Isa_52:1; Nah_1:15; Zec_14:21; Rev_21:27", "note": "", "refs": [{"l": "Isa 35:8", "n": "", "vs": [[8, "وتكون هناك طريق تدعى طريق القداسة، لا يسلك فيها من هو دنس، إنما تكون من نصيب السالكين في تلك الطريق، ولا يضل فيها حتى الجهال."]]}, {"l": "Isa 52:1", "n": "", "vs": [[1, "استيقظي، استيقظي تسربلي بقوتك ياصهيون، ارتدي ثياب بهائك ياأورشليم، المدينة المقدسة، إذ لن يدخلك بعد اليوم أغلف ولا نجس."]]}, {"l": "Nah 1:15", "n": "", "vs": [[15, "هوذا على الجبال (تسير) قدما المبشر حامل الأخبار السارة، الذي يعلن السلام. فيايهوذا واظب على الاحتفال بأعيادك وأوف نذورك لأنه لن يهاجمك الشرير من بعد، إذ قد انقرض تماما."]]}, {"l": "Zec 14:21", "n": "", "vs": [[21, "بل يكون كل قدر في أورشليم وفي يهوذا مقدسا للرب القدير، فيصبح في وسع المقربين أن يأتوا ويستخدموا ما يشاؤون منها، ليطبخوا فيها لحم الذبيحة. ولا يبقى في هيكل الرب القدير تجار في ذلك اليوم."]]}, {"l": "Rev 21:27", "n": "", "vs": [[27, "ولن يدخلها شيء نجس، ولا الذين يعملون القبائح ويدجلون، بل فقط الذين كتبت أسماؤهم في سجل الحياة للحمل!"]]}], "kwAr": "ولا يجتاز", "noteAr": ""}], "arS": [["فتدركون", ["H3045"]], [" أني أنا هو ", []], ["الرب", ["H3068"]], [" ", []], ["إلهكم", ["H430"]], [" ", []], ["الساكن", ["H7931"]], [" في ", []], ["صهيون", ["H6726"]], [" ", []], ["جبلي", ["H2022"]], [" ", []], ["المقدس", ["H6944"]], ["، وتكون ", []], ["أورشليم", ["H3389"]], [" ", []], ["مقدسة", ["H6944"]], [" ولا ", []], ["يجتاز", ["H5674"]], [" فيها ", []], ["الغرباء", ["H2114"]], [" ", []], ["أبدا", ["H5750"]], [".", []]]}, {"c": 3, "v": 18, "text": "وتقطر الجبال في ذلك اليوم خمرة عذبة، وتفيض التلال باللبن وجميع ينابيع يهوذا تتدفق ماء، ويخرج ينبوع من هيكل الرب يروي وادي السنط،", "groups": [{"kw": "the mountains", "raw": "Job_29:6; Isa_55:12, Isa_55:13; Amo_9:13, Amo_9:14", "note": "", "refs": [{"l": "Job 29:6", "n": "", "vs": [[6, "حين كنت أغسل خطواتي باللبن، والصخر يفيض لي أنهارا من الزيت."]]}, {"l": "Isa 55:12", "n": "", "vs": [[12, "لأنكم ستتركون بابل بفرح وسلام فتترنم الجبال والتلال أمامكم بهجة وتصفق أشجار الحقل بأيديها غبطة،"]]}, {"l": "Isa 55:13", "n": "", "vs": [[13, "وحيث كان الشوك والقراص، تنمو أشجار السرو والآس: فيكون ذلك تخليدا لاسم الرب وعلامة أبدية لا تمحى."]]}, {"l": "Amo 9:13", "n": "", "vs": [[13, "ها أيام تأتي يقول الرب، يدرك فيها الحارث الحاصد، ودائس العنب باذر الحب، وتسيل الخمور الطيبة من كروم الجبال وتفيض بها التلال كلها."]]}, {"l": "Amo 9:14", "n": "", "vs": [[14, "وأرد سبي شعبي إسرائيل فيعيدون بناء المدن الخربة ويسكنونها، ويزرعون كروما ويشربون من خمرها، ويغرسون جنات ويأكلون من ثمارها."]]}], "kwAr": "الجبال", "noteAr": ""}, {"kw": "and all", "raw": "Isa_30:25, Isa_35:6, Isa_41:17, Isa_41:18", "note": "", "refs": [{"l": "Isa 30:25", "n": "", "vs": [[25, "وفي يوم مجزرة أعدائكم، حينما تنهار الأبراج، تتدفق شلالات مياه وجداول من كل جبل وتل،"]]}, {"l": "Isa 35:6", "n": "", "vs": [[6, "ويطفر الأعرج كالظبي، ويترنم لسان الأبكم فرحا، إذ تنفجر المياه في البرية، وتتدفق الجداول في الصحراء،"]]}, {"l": "Isa 41:17", "n": "", "vs": [[17, "وعندما يلتمس البائسون والمساكين ماء ولا يجدونه، وتتشقق ألسنتهم من العطش، أنا الرب أستجيب لهم، أنا إله إسرائيل لا أتخلى عنهم."]]}, {"l": "Isa 41:18", "n": "", "vs": [[18, "فأفجر أنهارا على الهضاب وينابيع في وسط الأودية، وأحول البرية إلى واحة ماء والأرض القاحلة إلى جداول."]]}], "kwAr": "وجميع", "noteAr": ""}, {"kw": "flow", "raw": "Heb. go", "note": "Heb. go", "refs": [], "kwAr": "تتدفق", "noteAr": "بالعبرية: «تسير»."}, {"kw": "and a", "raw": "Psa_46:4; Eze_47:1-12; Zec_14:8; Rev_22:1, Rev_22:2", "note": "", "refs": [{"l": "Psa 46:4", "n": "", "vs": [[4, "تفرح مدينة الله حيث مساكن العلي بنهر دائم الجريان."]]}, {"l": "Eze 47:1-12", "n": "", "vs": [[1, "ثم أرجعني إلى مدخل الهيكل، وإذا بمياه تتدفق من تحت عتبته نحو الشرق، لأن واجهة الهيكل كانت نحو الشرق. وكانت المياه جارية من تحت، من أسفل الطرف الأيمن لعتبة الهيكل جنوبي المذبح."], [2, "ثم انطلق بي من طريق باب الشمال، سالكا بي الطريق الخارجي إلى الباب الشرقي الخارجي، وإذا بالمياه تجري في الجانب الأيمن."], [3, "وبعد أن خرج الرجل نحو المشرق شرع يقيس ألف ذراع (نحو خمس مئة متر) بخيط قياس كان بيده. واجتاز بي المياه التي بلغ عمقها إلى الكعبين."], [4, "ثم قاس ألف ذراع (نحو خمس مئة متر) أخرى واجتاز بي المياه التي بلغ عمقها الركبتين، وعاد فقاس ألف ذراع (نحو خمس مئة متر) ثالثة واجتاز بي المياه التي بلغ عمقها إلى الحقوين."], [5, "ثم قاس ألف ذراع (نحو خمس مئة متر) رابعة، وإذا بنهر لم أستطع خوضه، لأن المياه كانت طاغية عميقة، مياه سباحة لنهر يتعذر عبوره."], [6, "وقال لي: أرأيت هذا ياابن آدم؟» ثم أعادني إلى شاطيء النهر،"], [7, "وإذا بي أجد عليه أشجارا كثيرة قائمة على ضفتيه،"], [8, "وقال لي: «هذه المياه جارية نحو المنطقة الشرقية، ومنحدرة إلى الغور حيث تصب في البحر (الميت) فتجعل مياهه عذبة."], [9, "وفي مجاريه تعيش كل نفس حية وتتكاثر الأسماك، لأن مياهه تبلغ إليها، فيبرأ كل ما تبلغ إليه مياه النهر وتسري الحياة فيه."], [10, "ويجتمع الصيادون على شاطئه من عين جدي إلى عين عجلايم، فيصبح مبسطا لشباكهم، ويعج بكل أصناف الأسماك، كسمك البحر العظيم (الأبيض المتوسط)."], [11, "أما مستنقعاته وبركه فلا تبرأ من ملوحتها."], [12, "وتنمو على ضفتيه كل أنواع أشجار الفاكهة التي تؤكل. لا يذبل ورقها ولا ينقطع ثمرها. تحمل أثمارها في كل شهر، لأن مياه النهر تنبع من المقدس، فتكون ثمار أشجاره للأكل وورقها عقاقير للمداواة."]]}, {"l": "Zec 14:8", "n": "", "vs": [[8, "في ذلك اليوم تجري مياه حية من أورشليم، يصب نصفها في البحر الشرقي (البحر الميت)، ونصفها الآخر في البحر الغربي (البحر الأبيض المتوسط) طوال الصيف والشتاء."]]}, {"l": "Rev 22:1", "n": "", "vs": [[1, "ثم أراني الملاك نهر ماء الحياة صافيا كالبلور، ينبع من عرش الله والحمل"]]}, {"l": "Rev 22:2", "n": "", "vs": [[2, "ويخترق ساحة المدينة، وعلى ضفتيه شجرة الحياة تثمر اثنتي عشرة مرة، كل شهر مرة. وأوراقها دواء يشفي الأمم."]]}], "kwAr": "ويخرج", "noteAr": ""}, {"kw": "the valley", "raw": "Num_25:1; Mic_6:5", "note": "", "refs": [{"l": "Num 25:1", "n": "", "vs": [[1, "وأقام الإسرائيليون في شطيم، فشرع الرجال يرتكبون الزنى مع الموآبيات"]]}, {"l": "Mic 6:5", "n": "", "vs": [[5, "اذكر ياشعبي ما تآمر به عليك بالاق ملك موآب، وما أجابه به بلعام بن بعور. واذكر ما أحسنت به إليك في رحلتك من شطيم إلى الجلجال لكي تدرك عدل الرب."]]}], "kwAr": "وادي السنط", "noteAr": ""}], "arS": [["وتقطر", ["H5197"]], [" ", []], ["الجبال", ["H2022"]], [" في ذلك ", []], ["اليوم", ["H3117"]], [" ", []], ["خمرة", ["H6071"]], [" عذبة، ", []], ["وتفيض", ["H1980"]], [" ", []], ["التلال", ["H1389"]], [" ", []], ["باللبن", ["H2461"]], [" ", []], ["وجميع", ["H3605"]], [" ", []], ["ينابيع", ["H650"]], [" ", []], ["يهوذا", ["H3063"]], [" ", []], ["تتدفق", ["H1980"]], [" ", []], ["ماء", ["H4325"]], ["، ", []], ["ويخرج", ["H3318"]], [" ", []], ["ينبوع", ["H4599"]], [" من ", []], ["هيكل", ["H4480", "H1004"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["يروي", ["H8248"]], [" ", []], ["وادي", ["H5158"]], [" ", []], ["السنط", ["H7851"]], ["،", []]]}, {"c": 3, "v": 19, "text": "وتصبح مصر خرابا، وأدوم قفرا موحشا لفرط ما أنزلوه من ظلم بأبناء يهوذا، ولأنهم سفكوا دما بريئا في ديارهم.", "groups": [{"kw": "Egypt", "raw": "Isa_11:15, Isa_19:1-15; Zec_10:10, Zec_14:18, Zec_14:19", "note": "", "refs": [{"l": "Isa 11:15", "n": "", "vs": [[15, "ويجفف الرب تماما لسان بحر مصر، ويهز يده على النهر فتهب ريح عاصفة تقسم ماءه إلى سبع ممرات تعبر فيها الجيوش."]]}, {"l": "Isa 19:1-15", "n": "", "vs": [[1, "نبوءة بشأن مصر: ها هو الرب قادم إلى مصر يركب سحابة سريعة، فترتجف أوثان مصر في حضرته، وتذوب قلوب المصريين في داخلهم."], [2, "وأثير مصريين على مصريين فيتحاربون، ويقوم الواحد على أخيه، والمدينة على المدينة والمملكة على المملكة،"], [3, "فتذوب أرواح المصريين في داخلهم، وأبطل مشورتهم، فيسألون الأوثان والسحرة وأصحاب التوابع والعرافين."], [4, "وأسلط على المصريين مولى قاس، فيسود ملك عنيف عليهم. هذا ما يقوله الرب القدير."], [5, "وتنضب مياه النيل وتجف الأحواض وتيبس."], [6, "تنتن القنوات، وتتناقص تفرعات النيل وتجف، ويتلف القصب والأسل."], [7, "وتذبل النباتات على ضفاف نهر النيل، والحقول والمزروعات كلها تجف، وكأنها لم تكن مخضرة."], [8, "فيئن الصيادون وطارحو الشصوص في النيل وينوحون ويتحسر الذين يلقون شباكهم في المياه."], [9, "ويتولى اليأس قلوب الذين يصنعون الكتان الممشط، ويفقد حائكو الكتان الفاخر كل أمل."], [10, "ويسحق الرجال، أعمدة الأرض، ويكتئب كل عامل أجير."], [11, "رؤساء صوعن حمقى، ومشورات أحكم حكماء فرعون غبية. كيف تقولون لفرعون نحن من نسل حكماء، وأبناء ملوك قدامى؟"], [12, "أين حكماؤك يا فرعون ليطلعوك على ما قضى به الرب القدير على مصر؟"], [13, "قد حمق رؤساء صوعن وانخدع أمراء نوف وأضل مصر شرفاء قبائلها"], [14, "جعل الرب فيها روح فوضى، فأضلوا مصر فى كل تصرفاتها، حتى ترنحت كترنح السكران في قيئه."], [15, "فلم يبق لعظمائها أو أدنيائها ما يفعلونه فيها."]]}, {"l": "Zec 10:10", "n": "", "vs": [[10, "سأردهم إلى موطنهم من ديار مصر، وأجمع شتاتهم من أشور، وآتي بهم إلى أرض جلعاد ولبنان حتى لا يبقى متسع لهم بعد."]]}, {"l": "Zec 14:18", "n": "", "vs": [[18, "وإن أبى أهل مصر الصعود للاشتراك في الاحتفال، يحل بهم البلاء الذي يعاقب به الرب الأمم التي لا تجيء للاحتفال بعيد المظال."]]}, {"l": "Zec 14:19", "n": "", "vs": [[19, "هذا هو عقاب مصر وعقاب سائر الشعوب التي تأبى المجيء للاحتفال بعيد المظال."]]}], "kwAr": "مصر", "noteAr": ""}, {"kw": "Edom", "raw": "Isa. 34:1-17, Isa_63:1-6; Jer_49:17; Lam_4:21; Ezek. 25:1-17, Eze_35:1-15; Amo_1:11, Amo_1:12; Oba_1:1, Oba_1:10-14; Mal_1:3, Mal_1:4", "note": "", "refs": [{"l": "Isa 34:1-17", "n": "", "vs": [[1, "اقتربوا أيها الأمم للاستماع، اصغوا أيها الشعوب. لتسمع الأرض وملؤها، المسكونة وكل ما يخرج منها،"], [2, "لأن الرب ساخط على كل الشعوب، وغضبه منصب على جميع أجنادهم. قضى عليهم بالفناء، وأسلمهم إلى الذبح،"], [3, "فتطرح قتلاهم وينتشر نتن جيفهم في الفضاء، وتفيض الجبال بدمائهم،"], [4, "وتنحل كل كواكب السماء، وتطوى السماوات كدرج، وتتساقط كل نجومها كتساقط أوراق الكرمة أو حبات التين المتغضنة."], [5, "لأن سيفي قد تشرب بالسخط في السماء، وها هو ينزل ليعاقب أدوم، وينتقم من الشعب الذي قضيت عليه بالفناء."], [6, "للرب سيف مشبع بالدم، مطلي بالشحم، بدم حملان وتيوس، وبشحم كلى كباش، لأن للرب ذبيحة في بصرة، ومذبحة في أدوم."], [7, "ويسقط معهم البقر الوحشي، والعجول والثيران القوية، فتتشبع أرضهم بالدماء، ويخصب ترابهم بالشحم،"], [8, "لأن للرب يوم انتقام، سنة ثأر لدعوى صهيون،"], [9, "فتنقلب أنهار أدوم إلى زفت، وترابهم إلى كبريت، وتصبح أرضها قارا مشتعلا."], [10, "فلا تنطفيء ليلا ونهارا، ويحلق دخانها إلى الفضاء مدى الدهر، وتظل خرابا جيلا بعد جيل، فلا يعبر بها أحد إلى الأبد،"], [11, "ولا يرثها سوى الصقور والقنافذ، ويسكن فيها البوم والغراب، ويمد الرب عليها خيط الدمار ومطمار الهلاك،"], [12, "ولا يجد فيها أشرافها أثرا للملك، وينقرض جميع رؤسائها."], [13, "ينمو الشوك في قصورها، ويزحف العوسج على حصونها، فتصبح مأوى لبنات آوى، ومسكنا للنعام."], [14, "وتجتمع فيها الوحوش البرية مع الذئاب، ووعل البر يدعو صاحبه، وهناك تستقر وحوش الليل وتجد لنفسها ملاذ راحة."], [15, "هناك تعيش البوم وتبيض وتفرخ وترعى صغارها تحت أجنحتها، وهناك أيضا تتلاقى الصقور بعضها ببعض."], [16, "ابحثوا في سفر الرب واقرأوا: فكلمة واحدة لا يمكن أن تسقط، إذ كل أليف سيجتمع بأليفه، لأن فم الرب قد أمر، وروحه يجمعها معا."], [17, "فهو قد ألقى عليها القرعة، ويده قد وزعتها بقسطاس، فترثها إلى الأبد وتقيم فيها جيلا بعد جيل."]]}, {"l": "Isa 63:1-6", "n": "", "vs": [[1, "من هذا المقبل من أدوم، بثياب حمراء من بصرة؛ هذا المتسربل بالبهاء. السائر بخيلاء قوته؟ إنه أنا الرب الناطق بالبر، العظيم للخلاص."], [2, "ما بال ردائك أحمر وثيابك كمن داس عنب المعصرة؟"], [3, "لقد دست المعصرة وحدي، ولم يكن معي أحد من الشعوب. قد دستهم في سخطي ووطئتهم في غيظي، فتناثر دمهم على ردائي ولطخت ثيابي."], [4, "لأن يوم الانتقام كان كامنا في قلبي، وسنة مفديي قد أتت."], [5, "تلفت فلم أعثر على معين، وعجبت إذ لم يكن من ناصر، فانتصرت بقوة ذراعي، وتأيدت بنجدة سخطي،"], [6, "فدست الشعوب في غيظي، وأسكرتهم في غضبي، وسكبت دماءهم فوق الأرض."]]}, {"l": "Jer 49:17", "n": "", "vs": [[17, "ستصبح أدوم مثار رعب، وكل من يمر بها تعتريه رعدة، ويصفر من جراء كل نكباتها،"]]}, {"l": "Lam 4:21", "n": "", "vs": [[21, "ابتهجي وافرحي ياابنة أدوم، ياساكنة عوص. إنما هذه الكأس ستجوز عليك أيضا فتسكرين وتتعرين."]]}, {"l": "Eze 25:1-17", "n": "", "vs": [[1, "وأوحى إلي الرب بكلمته قائلا:"], [2, "«ياابن آدم، التفت بوجهك نحو بني عمون وتنبأ عليهم."], [3, "وقل لهم اسمعوا ما يعلنه السيد الرب من قضاء: لأنك شمت بمقدسي لأنه تدنس، وبأرض إسرائيل لأنها خربت وبشعب يهوذا لأنهم سيقوا إلى السبي،"], [4, "أسلمك للبدو وأبناء المشرق، فتصيرين ملكا لهم فينصبون مضاربهم فيك، ويقيمون مساكنهم فوق أرضك. هم يلتهمون غلتك، ويشربون لبنك."], [5, "وأجعل مدينة ربة مناخا للإبل، وسائر مدن بني عمون مرابض للغنم، فتدركون أني أنا الرب."], [6, "لأنك صفقت بكفيك طربا، وخبطت برجليك، وفرحت بكل ما فيك من لؤم لما حل بأرض إسرائيل."], [7, "لذلك ها أنا أثقل يدي عليك، وأسلمك غنيمة للأمم، وأستأصلك من بين الشعوب، وأفنيك من بين البلدان، وأدمرك، فتدرك أني أنا الرب."], [8, "وهذا ما يعلنه السيد الرب: لأن الموآبيين وأهل سعير يقولون: هل شعب يهوذا كبقية الأمم."], [9, "لذلك ها أنا أقوض جبهتهم الشرقية، وأدمر مدن حدودهم، بيت بشيموت وبعل معون وقريتايم وهي مدن مفخرة موآب."], [10, "فيستولى قبائل البدو عليها، ويصير بنو عمون ملكا لهم فلا يعود لهم ذكر بين الأمم."], [11, "وأنفذ في الموآبيين أحكاما، فيدركون أني أنا الرب."], [12, "وهذا أيضا ما يعلنه السيد الرب: لأن الأدوميين أقدموا على الانتقام من شعب يهوذا، وأساءوا إليه أشد إساءة."], [13, "ها أنا أعاقب الأدوميين وأستأصل من أرضهم الإنسان والحيوان، وأحولها إلى أطلال دارسة من التيمن إلى ددان، إذ يقتل أهلها جميعا بالسيف."], [14, "وأعهد بنقمتي إلى شعبي إسرائيل، فيفعلون بالأدوميين بمقتضى غضبي وسخطي، فيدركون شدة نقمتي، يقول السيد الرب."], [15, "وهذا أيضا ما يعلنه السيد الرب لأن الفلسطينيين قد أقدموا على الانتقام وأفرطوا فيه بكل لؤم قلوبهم، عامدين إلى الخراب بسبب عداوة أبدية،"], [16, "ها أنا أعاقب الفلسطينيين وأستأصل الكريتيين، وأبيد بقية سكان ساحل البحر،"], [17, "وأنفذ فيهم انتقامي العظيم بتأديب مفعم بالسخط، فيدركون أني أنا الرب، إذ أصب نقمتي عليهم»."]]}, {"l": "Eze 35:1-15", "n": "", "vs": [[1, "وأوحى إلي الرب بكلمته قائلا:"], [2, "«ياابن آدم، التفت بوجهك نحو جبل سعير وتنبأ عليه."], [3, "وقل لأهله: ها أنا أنقلب عليك ياجبل سعير وأعاقبك لأجعلك خرابا مقفرا."], [4, "أجعل مدنك أطلالا وتكون أنت مقفرا، فتدرك أني أنا الرب."], [5, "لأنك أضمرت في نفسك بغضة أبدية، وأسلمت بني إسرائيل إلى حد السيف في أثناء محنتهم، في ساعة دينونة إثمهم."], [6, "لذلك حي أنا يقول السيد الرب، إني أعدك لسفك الدم، والدم يتعقبك. لأنك لم تمقت سفك الدم فالدم يتعقبك."], [7, "فأحول جبل سعير إلى أطلال وأستأصل منه كل ذاهب وآيب."], [8, "وأجعل جباله تكتظ بقتلاه، فيتساقطون في تلالك وأوديتك وجميع أنهارك صرعى السيف."], [9, "وأحيلك إلى خرائب أبدية، فلا يبقى لمدنك أثر، فتدركون أني أنا الرب."], [10, "لأنك قلت: إن هاتين الأمتين، وهاتين الأرضين تصبحان لي فأمتلكهما، ولو كان الرب هناك."], [11, "لذلك حي أنا يقول السيد الرب: لأعاملنك بمقتضى غضبك وحسدك اللذين أبديتهما في بغضائك لهم، فأعلن ذاتي عندما أدينك."], [12, "فتدرك أني أنا الرب قد سمعت كل إهانتك التي عيرت بها جبال إسرائيل قائلا: قد أصبحت خرابا وصارت لنا مغنما."], [13, "قد تباهيتم علي بأفواهكم، وأكثرتم من لغوكم علي وأنا سمعت."], [14, "ففي موسم الربيع أجعلك مقفرا"], [15, "وكما فرحت لخراب ميراث شعب إسرائيل، كذلك أفعل بك، فتصير ياجبل سعير خرابا أنت وكل بلاد أدوم فتدركون أني أنا الرب»."]]}, {"l": "Amo 1:11", "n": "", "vs": [[11, "وهذا ما يقوله الرب: من أجل معاصي أدوم الثلاث والأربع لن أرد عنهم سخطي، لأنهم تعقبوا إخوتهم بالسيف، وتغاضوا عن كل رحمة، وجعلوا غضبهم يتأجج ملتهما باستمرار، وظلوا حاقدين على الدوام."]]}, {"l": "Amo 1:12", "n": "", "vs": [[12, "فأرسل نارا على تيمان، فتلتهم حصون بصرة."]]}, {"l": "Oba 1:1", "n": "", "vs": [[1, "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."]]}, {"l": "Oba 1:10-14", "n": "", "vs": [[10, "فمن أجل ما أنزلت بأخيك يعقوب من ظلم، يغشاك العار وتنقرض إلى الأبد."], [11, "ففي ذلك اليوم الذي وقفت فيه بعيدا، يوم غنم الغرباء كنوزه، واقتحم الأجانب أبوابه وألقوا القرعة على أورشليم، كنت أنت أيضا كواحد منهم."], [12, "ما كان يجب أن تشمت بيوم مصير أخيك، في يوم فاجعته، وما كان يجب أن تبتهج في يوم دمار شعب يهوذا أو تتباهى في يوم الضيق."], [13, "وما كان يجب أن تقتحم أبواب شعبي في يوم كارثته، أو تشمت لمصيبته في يوم نكبته، أو تنهب ثروته في يوم بليته،"], [14, "أو تقف عند مفترق الطرق لتقضي على الناجين من قومه وتسلم الباقين الأحياء منهم في يوم الضيق."]]}, {"l": "Mal 1:3", "n": "", "vs": [[3, "وأبغضت عيسو، وحولت جباله إلى أراض موحشة، وجعلت ميراثه لبنات آوى البرية."]]}, {"l": "Mal 1:4", "n": "", "vs": [[4, "وإن قال الأدوميون: مع إننا تحطمنا فإننا نبني الخرب، فإن الرب القدير يقول: هم يعمرون وأنا أهدم، ويدعو الناس بلادهم، «أرض النفاق»، وأهلها بالأمة التي سخط الرب عليها إلى الأبد."]]}], "kwAr": "وأدوم", "noteAr": ""}, {"kw": "for", "raw": "Psa_137:7; Jer_51:35; Oba_1:10-16; 2Th_1:6", "note": "", "refs": [{"l": "Psa 137:7", "n": "", "vs": [[7, "اذكر يارب لبني أدوم ما فعلوه يوم خراب أورشليم، إذ قالوا: «اهدموا اهدموا حتى يتعرى أساسها»."]]}, {"l": "Jer 51:35", "n": "", "vs": [[35, "يقول أهل أورشليم: ليحل ببابل ما أصابنا وأصاب لحومنا من ظلم. وتقول أورشليم: دمي على أهل أرض الكلدانيين."]]}, {"l": "Oba 1:10-16", "n": "", "vs": [[10, "فمن أجل ما أنزلت بأخيك يعقوب من ظلم، يغشاك العار وتنقرض إلى الأبد."], [11, "ففي ذلك اليوم الذي وقفت فيه بعيدا، يوم غنم الغرباء كنوزه، واقتحم الأجانب أبوابه وألقوا القرعة على أورشليم، كنت أنت أيضا كواحد منهم."], [12, "ما كان يجب أن تشمت بيوم مصير أخيك، في يوم فاجعته، وما كان يجب أن تبتهج في يوم دمار شعب يهوذا أو تتباهى في يوم الضيق."], [13, "وما كان يجب أن تقتحم أبواب شعبي في يوم كارثته، أو تشمت لمصيبته في يوم نكبته، أو تنهب ثروته في يوم بليته،"], [14, "أو تقف عند مفترق الطرق لتقضي على الناجين من قومه وتسلم الباقين الأحياء منهم في يوم الضيق."], [15, "لأن يوم الرب قريب آت على كل الأمم، وكما فعلت، لابد أن يفعل بك أيضا، فيرتد عملك على رأسك."], [16, "فإنه كما شربت على جبل قدسي فإن جميع الأمم تشرب في كل حين. يشربون ويجرعون ويتلاشون كمن لم يكونوا."]]}, {"l": "2Th 1:6", "n": "", "vs": [[6, "فمن العدل عند الله حقا أن يجازي بالضيقة أولئك الذين يضايقونكم،"]]}], "kwAr": "ولأنهم", "noteAr": ""}], "arS": [["وتصبح ", []], ["مصر", ["H4714"]], [" ", []], ["خرابا", ["H8077"]], ["، ", []], ["وأدوم", ["H123"]], [" ", []], ["قفرا", ["H8077"]], [" ", []], ["موحشا", ["H4057"]], [" لفرط ما أنزلوه من ", []], ["ظلم", ["H2555"]], [" ", []], ["بأبناء", ["H1121"]], [" ", []], ["يهوذا", ["H3063"]], ["، ولأنهم ", []], ["سفكوا", ["H8210"]], [" ", []], ["دما", ["H1818"]], [" ", []], ["بريئا", ["H5355"]], [" في ", []], ["ديارهم", ["H776"]], [".", []]]}, {"c": 3, "v": 20, "text": "أما يهوذا فإنه يسكن الأرض إلى الأبد، وتعمر أورشليم مدى الأجيال.", "groups": [{"kw": "Judah", "raw": "Isa_33:20; Eze_37:25; Amo_9:15", "note": "", "refs": [{"l": "Isa 33:20", "n": "", "vs": [[20, "التفت إلى صهيون مدينة أعيادنا، فتكتحل عيناك بمرأى أورشليم، المسكن المطمئن والخيمة الثابتة التي لا تقلع أوتادها إلى الأبد ولا تنقطع حبالها"]]}, {"l": "Eze 37:25", "n": "", "vs": [[25, "ويقيمون في الأرض التي وهبتها لعبدي يعقوب التي سكن فيها آباؤكم، فيستوطنون فيها ه
