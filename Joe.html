هما", ["H2428"]], [".", []]]}, {"c": 2, "v": 23, "text": "افرحوا ياأبناء صهيون، ابتهجوا بالرب إلهكم لأنه أنعم عليكم بفضل صلاحه بأمطار الخريف، وسكب عليكم الغيث المبكر والمتأخر بغزارة، كالسابق.", "groups": [{"kw": "ye children", "raw": "Psa_149:2; Lam_4:2; Zec_9:13; Gal_4:26, Gal_4:27", "note": "", "refs": [{"l": "Psa 149:2", "n": "", "vs": [[2, "ليفرح شعب إسرائيل بصانعه، وليبتهج بنو صهيون بملكهم."]]}, {"l": "Lam 4:2", "n": "", "vs": [[2, "كيف حسب أبناء صهيون الكرام الموزونون بالذهب النقي، كآنية خزفية من عمل يد الفخاري؟"]]}, {"l": "Zec 9:13", "n": "", "vs": [[13, "ها أنا أوتر يهوذا كقوس وأجعل أفرايم كسهم وأثير رجال صهيون على أبناء اليونان فتكونين كسيف جبار."]]}, {"l": "Gal 4:26", "n": "", "vs": [[26, "أما الثاني، فرمزه الحرة التي تمثل أورشليم السماوية التي هي أمنا."]]}, {"l": "Gal 4:27", "n": "", "vs": [[27, "فإنه قد كتب: «افرحي أيتها العاقر التي لا تلد، اهتفي بأعلى صوتك أيتها التي لا تتمخض، لأن أولاد المهجورة أكثر عددا من أولاد التي لها زوج!»"]]}], "kwAr": "ياأبناء صهيون", "noteAr": ""}, {"kw": "rejoice", "raw": "Psa_28:7, Psa_32:11, Psa_33:1, Psa_95:1-3, Psa_104:34; Isa_12:2-6, Isa_41:16, Isa_61:10; Hab_3:17, Hab_3:18; Zep_3:14-17; Zec_9:9, Zec_10:7; Luk_1:46, Luk_1:47; Phi_3:1, Phi_3:3, Phi_4:4", "note": "", "refs": [{"l": "Psa 28:7", "n": "", "vs": [[7, "الرب قوتي وترسي. عليه اتكل قلبي، فنلت الغوث. لذلك يبتهج قلبي وأحمده بنشيدي."]]}, {"l": "Psa 32:11", "n": "", "vs": [[11, "افرحوا بالرب أيها الأبرار وابتهجوا. اهتفوا ياجميع المستقيمي القلوب."]]}, {"l": "Psa 33:1", "n": "", "vs": [[1, "سبحوا الرب أيها الأبرار، فإن الحمد يليق بالمستقيمين."]]}, {"l": "Psa 95:1-3", "n": "", "vs": [[1, "هيا نرنم عاليا للرب، ونهتف فرحا لصخرة خلاصنا."], [2, "لنتقدم أمام حضرته بالشكر، ونهتف له بالترنيم."], [3, "لأن الرب إله عظيم، وملك كبير على جميع الآلهة."]]}, {"l": "Psa 104:34", "n": "", "vs": [[34, "فيلذ له نشيدي، وأنا أفرح بالرب."]]}, {"l": "Isa 12:2-6", "n": "", "vs": [[2, "ها إن الله خلاصي فأطمئن ولا أرتعد، لأن الرب الله هو قوتي وترنيمتي وقد أصبح لي خلاصا»."], [3, "فتستقون ببهجة من ينابيع الخلاص."], [4, "وتقولون في ذلك اليوم: «احمدوا الرب، نادوا باسمه، عرفوا بأفعاله بين الشعوب، وأذيعوا أن اسمه قد تعالى."], [5, "اشدوا للرب لأنه قد صنع عظائم. ليعلن ذلك في الأرض كلها"], [6, "اهتفوا وتغنوا ياأهل صهيون، لأن قدوس إسرائيل عظيم بينكم»."]]}, {"l": "Isa 41:16", "n": "", "vs": [[16, "فتذريها، وتحملها الريح بعيدا، وتبددها الزوبعة. أما أنت فتبتهج بالرب وتمجد قدوس إسرائيل."]]}, {"l": "Isa 61:10", "n": "", "vs": [[10, "إنني أبتهج حقا بالرب وتفرح نفسي بإلهي، لأنه كساني ثياب الخلاص وسربلني برداء البر، مثل عريس يزين رأسه بتاج، وكعروس تتجمل بحليها."]]}, {"l": "Hab 3:17", "n": "", "vs": [[17, "فمع أنه لا يزهر التين ولا يكون حمل في الكروم يكذب عمل الزيتونة والحقول لا تصنع طعاما ينقطع الغنم من الحظيرة ولا بقر في المذاود"]]}, {"l": "Hab 3:18", "n": "", "vs": [[18, "فإني أبتهج بالرب وأفرح بإله خلاصي."]]}, {"l": "Zep 3:14-17", "n": "", "vs": [[14, "اشدي ياابنة صهيون واهتف ياإسرائيل، ابتهجي وتهللي ياابنة أورشليم."], [15, "لأن الرب قد رفع عنك حكم قضائه ورد عنك أعداءك. إن الرب ملك إسرائيل هو في وسطك، فلا تخشي شرا في ما بعد."], [16, "ويقال في ذلك اليوم لأورشليم: لا تخافي ياصهيون، ولا ترتخ يداك."], [17, "فالرب إلهك في وسطك، جبار يخلص. يسر فرحا بك، ويجدد بمحبته حياتك، ويبتهج بك مترنما."]]}, {"l": "Zec 9:9", "n": "", "vs": [[9, "»ابتهجي جدا ياابنة صهيون واهتفي ياابنة أورشليم، لأن هوذا ملكك مقبل إليك. هو عادل ظافر، ولكنه وديع راكب على أتان، على جحش ابن أتان."]]}, {"l": "Zec 10:7", "n": "", "vs": [[7, "ويصبح شعب إسرائيل كجبابرة الحرب، وتنتشي قلوبهم كمن شرب خمرة، ويشهد أبناؤهم هذا ويفرحون، وتبتهج نفوسهم بالرب."]]}, {"l": "Luk 1:46", "n": "", "vs": [[46, "فقالت مريم: «تعظم نفسي الرب،"]]}, {"l": "Luk 1:47", "n": "", "vs": [[47, "وتبتهج روحي بالله مخلصي."]]}, {"l": "Phi 3:1", "n": "", "vs": [[1, "وبعد، ياإخوتي، افرحوا في الرب. لا يزعجني أن أكتب إليكم بالأمور نفسها، فإن ذلك يجعلكم في مأمن."]]}, {"l": "Phi 3:3", "n": "", "vs": [[3, "فإننا نحن أهل الختان الحق، لأننا إنما نعبد بروح الله ونفتخر في المسيح يسوع، ولا نعتمد على أمور الجسد،"]]}, {"l": "Phi 4:4", "n": "", "vs": [[4, "افرحوا في الرب دائما، وأقول أيضا: افرحوا."]]}], "kwAr": "ابتهجوا", "noteAr": ""}, {"kw": "the former", "raw": "etc. or, a teacher of righteousness, Joe_2:28, Joe_2:29; Deu_32:2; Job_33:23; Psa_72:6, Psa_72:7; Isa_30:21, Isa_30:23; Eph_4:8-11", "note": "etc. or, a teacher of righteousness, Joe_2:28, Joe_2:29; Deu_32:2; Job_33:23; Psa_72:6, Psa_72:7; Isa_30:21, Isa_30:23; Eph_4:8-11", "refs": [{"l": "Joe 2:28", "n": "", "vs": [[28, "ثم أسكب روحي على كل بشر، فيتنبأ أبناؤكم وبناتكم، ويحلم شيوخكم أحلاما ويرى شبابكم رؤى."]]}, {"l": "Joe 2:29", "n": "", "vs": [[29, "وأسكب في تلك الأيام أيضا روحي على العبيد والإماء."]]}, {"l": "Deu 32:2", "n": "", "vs": [[2, "لينهمر تعليمي كالمطر، وليقطر كلامي، فيكون كالطل على الكلإ وكالغيث على العشب."]]}, {"l": "Job 33:23", "n": "", "vs": [[23, "إن وجد له ملاك، شفيع، واحد من بين ألف، ليعلن للإنسان ما هو صالح له،"]]}, {"l": "Psa 72:6", "n": "", "vs": [[6, "ليكن الملك كالمطر المنهمر على المراعي المجزوزة، كالغيوث التي تسقي الأرض."]]}, {"l": "Psa 72:7", "n": "", "vs": [[7, "ليزدهر في أيامه الصديق، ويتوافر السلام مادام القمر يضيء."]]}, {"l": "Isa 30:21", "n": "", "vs": [[21, "وتسمع أذناك كلمة صادرة من خلفك قائلة:"]]}, {"l": "Isa 30:23", "n": "", "vs": [[23, "ويسكب الرب مطره على بذورك التي تزرعها في الأرض، فيكون الطعام الذي تغله من الأرض سمينا دسما، فترعى مواشيك في ذلك اليوم في مراع فسيحة،"]]}, {"l": "Eph 4:8-11", "n": "", "vs": [[8, "لذلك يقول (الوحي): «إذ صعد إلى الأعالي، ساق أسرى، ووهب الناس مواهب!»"], [9, "وأما أنه «صعد»، فما معنى هذا سوى أنه كان قد نزل أيضا إلى الأقسام السفلى في الأرض؟"], [10, "إن الذي نزل هو نفسه الذي صعد إلى ما فوق جميع السماوات لكي يملأ كل شيء."], [11, "وهو قد وهب البعض أن يكونوا رسلا، والبعض أنبياء، والبعض مبشرين والبعض رعاة ومعلمين،"]]}], "kwAr": "بفضل صلاحه", "noteAr": "إلخ. أو: «معلم البر». انظر يوء 2: 28، 29؛ تث 32: 2؛ أي 33: 23؛ مز 72: 6، 7؛ إش 30: 21، 23؛ أف 4: 8-11"}, {"kw": "moderately", "raw": "Heb. according to righteousness", "note": "Heb. according to righteousness", "refs": [], "kwAr": "بأمطار الخريف", "noteAr": "بالعبرية: «بحسب البر»."}, {"kw": "he will", "raw": "Lev_26:4; Deu_11:14, Deu_28:12; Pro_16:15; Jer_3:3; Hos_6:3; Zec_10:1; Jam_5:7, Jam_5:8", "note": "", "refs": [{"l": "Lev 26:4", "n": "", "vs": [[4, "فإني أسكب عليكم المطر في أوانه، وتعطي الأرض غلتها، وتثمر أشجار الحقل،"]]}, {"l": "Deu 11:14", "n": "", "vs": [[14, "فإن الرب يسكب على أرضكم المطر المبكر والمتأخر في أوانه، فتجمعون حنطتكم وخمركم، وزيتكم،"]]}, {"l": "Deu 28:12", "n": "", "vs": [[12, "ويفتح لكم الرب كنوز سمائه الصالحة، فيمطر على أرضكم في مواسمها، ويبارك كل ما تنتجه أيديكم، فتقرضون أمما كثيرة وأنتم لا تقترضون."]]}, {"l": "Pro 16:15", "n": "", "vs": [[15, "في بشاشة وجه الملك حياة، ورضاه كسحاب المطر المتأخر."]]}, {"l": "Jer 3:3", "n": "", "vs": [[3, "لذلك امتنع عنك الغيث، ولم تهطل أمطار الربيع، ومع ذلك صارت لك جبهة زانية تأبى أن تخجل."]]}, {"l": "Hos 6:3", "n": "", "vs": [[3, "لنعرف، بل لنجد حتى نعرف الرب، فمجيئه يقين كالفجر، يقبل إلينا كإقبال المطر وكغيوث الربيع التي تروي الأرض»."]]}, {"l": "Zec 10:1", "n": "", "vs": [[1, "اطلبوا من الرب المطر في موسم الربيع، لأن الرب هو الذي يستجيب ببروق، ويسكب على الناس وابلا هطالا، ويرزق كل واحد عشبا في الحقل."]]}, {"l": "Jam 5:7", "n": "", "vs": [[7, "وأما أنتم، ياإخوتي، فاصبروا منتظرين عودة الرب. خذوا العبرة من الفلاح: فهو ينتظر أن تعطيه الأرض غلالا ثمينة، صابرا على الزرع حتى يشرب من مطر الخريف ومطر الربيع."]]}, {"l": "Jam 5:8", "n": "", "vs": [[8, "فاصبروا أنتم إذن، وشددوا قلوبكم لأن عودة الرب قد صارت قريبة."]]}], "kwAr": "وسكب", "noteAr": ""}, {"kw": "in", "raw": "Amo_4:7", "note": "", "refs": [{"l": "Amo 4:7", "n": "", "vs": [[7, "منعت عنكم المطر ولم يكن قد بقي للحصاد سوى ثلاثة أشهر، وأمطرت على مدينة دون مدينة، وعلى حقل دون الآخر، فجف الحقل الذي لم أمطر عليه."]]}], "kwAr": "كالسابق", "noteAr": ""}], "arS": [["افرحوا", ["H1523"]], [" ", []], ["ياأبناء", ["H1121"]], [" ", []], ["صهيون", ["H6726"]], ["، ", []], ["ابتهجوا", ["H8055"]], [" ", []], ["بالرب", ["H3068"]], [" ", []], ["إلهكم", ["H430"]], [" لأنه ", []], ["أنعم", ["H5414"]], [" عليكم بفضل ", []], ["صلاحه", ["H6666"]], [" ", []], ["بأمطار", ["H4175"]], [" ", []], ["الخريف", ["H1653"]], ["، وسكب عليكم ", []], ["الغيث", ["H4175"]], [" المبكر ", []], ["والمتأخر", ["H4456"]], [" بغزارة، ", []], ["كالسابق", ["H7223"]], [".", []]]}, {"c": 2, "v": 24, "text": "فتمتليء البيادر بأكوام القمح، وتتدفق المعاصر بالخمرة والزيت.", "groups": [{"kw": "", "raw": "Joe_3:13, Joe_3:18; Lev_26:10; Pro_3:9, Pro_3:10; Amo_9:13; Mal_3:10", "note": "", "refs": [{"l": "Joe 3:13", "n": "", "vs": [[13, "احملوا المنجل لأن الحصيد قد نضج. تعالوا ودوسوا فإن معصرة الخمر قد امتلأت، والحياض فاضت بكثرة شرهم."]]}, {"l": "Joe 3:18", "n": "", "vs": [[18, "وتقطر الجبال في ذلك اليوم خمرة عذبة، وتفيض التلال باللبن وجميع ينابيع يهوذا تتدفق ماء، ويخرج ينبوع من هيكل الرب يروي وادي السنط،"]]}, {"l": "Lev 26:10", "n": "", "vs": [[10, "وتظلون تأكلون من الغلال القديمة حين تفرغونها من مخازنها لتوسعوا لغلات السنة الجديدة."]]}, {"l": "Pro 3:9", "n": "", "vs": [[9, "أكرم الرب من مالك، ومن أوائل غلات محاصيلك."]]}, {"l": "Pro 3:10", "n": "", "vs": [[10, "فتمتليء أهراؤك وفرة، وتفيض معاصرك خمرا."]]}, {"l": "Amo 9:13", "n": "", "vs": [[13, "ها أيام تأتي يقول الرب، يدرك فيها الحارث الحاصد، ودائس العنب باذر الحب، وتسيل الخمور الطيبة من كروم الجبال وتفيض بها التلال كلها."]]}, {"l": "Mal 3:10", "n": "", "vs": [[10, "هاتوا العشور جميعها إلى بيت الخزينة ليتوافر في هيكلي طعام، واختبروني لتروا إن كنت لا أفتح كوى السماء وأفيض عليكم بركة وفيرة، يقول الرب القدير."]]}], "kwAr": "", "noteAr": ""}], "arS": [["فتمتليء", ["H4390"]], [" ", []], ["البيادر", ["H1637"]], [" بأكوام ", []], ["القمح", ["H1250"]], ["، ", []], ["وتتدفق", ["H7783"]], [" ", []], ["المعاصر", ["H3342"]], [" ", []], ["بالخمرة", ["H8492"]], [" ", []], ["والزيت", ["H3323"]], [".", []]]}, {"c": 2, "v": 25, "text": "وأعوضكم عن محاصيل السنين التي التهمها الجراد والجندب والطيار والقمص، جيشي العظيم الذي أطلقته عليكم.", "groups": [{"kw": "that", "raw": "Joe_2:2-11, Joe_1:4-7; Zec_10:6", "note": "", "refs": [{"l": "Joe 2:2-11", "n": "", "vs": [[2, "هو يوم ظلمة وتجهم، يوم غيوم مكفهرة وقتام دامس،فيه تزحف أمة قوية وعظيمة كما يزحف الظلام على الجبال، أمة لم يكن لها شبيه في سالف الزمان، ولن يكون لها نظير من بعدها عبر سني الأجيال."], [3, "تلتهم النار ما أمامها، ويحرق اللهيب ما خلفها. الأرض قدامها كجنة عدن، وخلفها صحراء موحشة، ولا شيء ينجو منها."], [4, "منظرهم كالخيول، وكأفراس الحرب يركضون."], [5, "يثبون على رؤوس الجبال في جلبة كجلبة المركبات، كفرقعة لهيب نار يلتهم القش، وكجيش عات مصطف للقتال."], [6, "تنتاب الرعدة منهم جميع الشعوب وتشحب كل الوجوه."], [7, "يندفعون كالجبابرة وكرجال الحرب يتسلقون السور، وكل منهم يزحف في طريقه لا يحيد عن سبيله."], [8, "لا يزاحم بعضهم بعضا. بل يتقدم كل منهم في طريقه. ينسلون بين الأسلحة من غير أن يتوقفوا."], [9, "ينقضون على المدينة ويتواثبون فوق الأسوار، يتسلقون البيوت ويتسللون من الكوى كاللص."], [10, "ترتعد الأرض أمامهم وترجف السماء، تظلم الشمس والقمر، وتكف الكواكب عن الضياء."], [11, "يجهر الرب بصوته في مقدمة جيشه لأن جنده لا يحصى لهم عدد، ومن ينفذ أمره يكون مقتدرا، لأن يوم الرب عظيم ومخيف جدا، فمن يتحمله؟"]]}, {"l": "Joe 1:4-7", "n": "", "vs": [[4, "إن ما تخلف من محصولكم عن هجمات الزحاف التهمته أسراب الجراد، وما تفضل عن أسراب الجراد أكلته الجنادب؛ وما بقي عن الجنادب قضى عليه الطيار."], [5, "اصحوا أيها السكارى، وابكوا ياجميع مدمني الخمر على العصير لأنه قد انقطع عن أفواهكم."], [6, "فإن أمة قد زحفت على أرضي، أمة قوية لا تحصى لكثرتها. لها أسنان ليث وأنياب لبؤة،"], [7, "فأتلفت كرومي وحطمت أشجار بيتي وسلخت قشورها وطرحتها، فابيضت أغصانها."]]}, {"l": "Zec 10:6", "n": "", "vs": [[6, "إني أشدد شعب يهوذا وأخلص ذرية يوسف وأردهم إلى أرضهم لأني أكن لهم الرحمة، فيكونون كأني لم أنبذهم لأني أنا الرب إلههم فأستجيبهم."]]}], "kwAr": "التي التهمها", "noteAr": ""}], "arS": [["وأعوضكم", ["H7999"]], [" عن محاصيل ", []], ["السنين", ["H8141"]], [" التي ", []], ["التهمها", ["H398"]], [" ", []], ["الجراد", ["H697"]], [" ", []], ["والجندب", ["H3218"]], [" ", []], ["والطيار", ["H2625"]], [" ", []], ["والقمص", ["H1501"]], ["، ", []], ["جيشي", ["H2428"]], [" ", []], ["العظيم", ["H1419"]], [" الذي ", []], ["أطلقته", ["H7971"]], [" عليكم.", []]]}, {"c": 2, "v": 26, "text": "فتأكلون بوفرة وتشبعون وتسبحون اسم الرب إلهكم الذي أجرى لكم العجائب، ولن يخزى شعبي ثانية.", "groups": [{"kw": "ye shall", "raw": "Lev_26:5, Lev_26:26; Deu_6:11, Deu_6:12, Deu_8:10; Neh_9:25; Psa_22:26, Psa_103:5; Pro_13:25; Son_5:1; Isa_55:2, Isa_62:8, Isa_62:9; Mic_6:14; Zec_9:15, Zec_9:17; 1Ti_6:17", "note": "", "refs": [{"l": "Lev 26:5", "n": "", "vs": [[5, "فتستمر دراسة حنطتكم حتى موعد قطاف العنب، ويستمر قطاف العنب حتى موسم الزراعة، فتأكلون خبزكم حتى الشبع، وتسكنون في أرضكم آمنين."]]}, {"l": "Lev 26:26", "n": "", "vs": [[26, "وحين أقطع عنكم مؤونة الدقيق، تخبز عشر نساء خبزكم في فرن واحد لقلة الدقيق، وتقسمون الخبز بالميزان فتأكلون ولا تشبعون."]]}, {"l": "Deu 6:11", "n": "", "vs": [[11, "وبيوت عامرة بخيرات لم تخزنوها، وآبار محفورة لم تحفروها، وأشجار كروم وزيتون لم تغرسوها، فأكلتم وشبعتم،"]]}, {"l": "Deu 6:12", "n": "", "vs": [[12, "فإياكم أن تنسوا الرب إلهكم الذي أطلقكم من عبودية ديار مصر."]]}, {"l": "Deu 8:10", "n": "", "vs": [[10, "فمتى أكلتم وشبعتم باركوا الرب إلهكم الذي وهبكم هذه الأرض الخصيبة."]]}, {"l": "Neh 9:25", "n": "", "vs": [[25, "فتملكوا مدنا حصينة وأرضا خصيبة، وورثوا بيوتا تفيض خيرا، وآبارا محفورة، وكروما وزيتونا وأشجارا مثمرة كثيرة، فأكلوا وشبعوا وسمنوا وتمتعوا بخيرك العميم."]]}, {"l": "Psa 22:26", "n": "", "vs": [[26, "يأكل الودعاء ويشبعون، وطالبو الرب يسبحونه. تحيا قلوبكم إلى الأبد."]]}, {"l": "Psa 103:5", "n": "", "vs": [[5, "ويشبع بالخير عمرك فيتجدد كالنسر شبابك."]]}, {"l": "Pro 13:25", "n": "", "vs": [[25, "يأكل الصديق حتى الشبع، أما بطن الشرير فتظل خاوية."]]}, {"l": "Son 5:1", "n": "", "vs": [[1, "(المحب): قد جئت إلى جنتي ياأختي، ياعروسي، وقطفت مري مع أطيابي، وأكلت شهدي مع عسلي، وشربت خمري مع لبني.(بنات أورشليم): كلوا أيها الخلان. اشربوا حتى الانتشاء أيها المحبون."]]}, {"l": "Isa 55:2", "n": "", "vs": [[2, "لماذا تنفقون الفضة على ما ليس بخبز، وتتعبون لغير شبع؟ أحسنوا الاستماع إلي، وكلوا الشهي ولتتمتع أنفسكم بالدسم."]]}, {"l": "Isa 62:8", "n": "", "vs": [[8, "قد أقسم الرب بيمينه وبذراعه القديرة قائلا: لن أعطي حنطتك من بعد طعاما لأعدائك، ولن يشرب الغرباء خمرك التي تعبت فيها،"]]}, {"l": "Isa 62:9", "n": "", "vs": [[9, "بل يأكلها الذين تكبدوا مشقة زرعها، ويحمدون الله . والذين جنوا الكرم يشربون الخمر في ساحات مقدسي."]]}, {"l": "Mic 6:14", "n": "", "vs": [[14, "ستأكلين ولا تشبعين، ويظل جوفك خاويا. وما تدخرينه تعجزين عن الاحتفاظ به. لأني أدفعه للسيف."]]}, {"l": "Zec 9:15", "n": "", "vs": [[15, "يقيهم الرب القدير فلا تنالهم حجارة المقلاع، بل تقصر عنهم ويطأونها، ويشربون (من دماء أعدائهم) ويصخبون كالسكارى من الخمر ويمتلئون كمناضح المحرقات وزوايا المذبح."]]}, {"l": "Zec 9:17", "n": "", "vs": [[17, "فما أجملهم وما أبهاهم! الحنطة تجعل الفتيان أكثر ازدهارا، والخمرة تجعل الفتيات أكثر نضرة»."]]}, {"l": "1Ti 6:17", "n": "", "vs": [[17, "أوص أغنياء هذا الزمان بأن لا يتكبروا، ولا يتكلوا على الغنى غير الثابت، بل على الله الذي يمنحنا كل شيء بوفرة لنتمتع به،"]]}], "kwAr": "فتأكلون", "noteAr": ""}, {"kw": "and praise", "raw": "Deu_12:7, Deu_12:12, Deu_12:18, Deu_26:10,Deu_26:11; 1Ti_4:3-5", "note": "", "refs": [{"l": "Deu 12:7", "n": "", "vs": [[7, "فتأكلون هناك أنتم وعائلاتكم لدى الرب، وتفرحون بكل ما تمتد إليه أيديكم، لأن الرب إلهكم قد بارككم."]]}, {"l": "Deu 12:12", "n": "", "vs": [[12, "وهناك احتفلوا أنتم وبنوكم وبناتكم وعبيدكم وإماؤكم واللاوي المقيم في جواركم، لأنه ليس له نصيب أو ميراث خاص به."]]}, {"l": "Deu 12:18", "n": "", "vs": [[18, "بل تأكلونها أنتم وأبناؤكم وبناتكم وعبيدكم وإماؤكم واللاويون المقيمون في جواركم لدى الرب إلهكم في المكان الذي يختاره الرب إلهكم، وتحتفلون أمامه بكل ما تمتلكه أيديكم"]]}, {"l": "Deu 26:10", "n": "", "vs": [[10, "فها أنا الآن قد أتيت بأول ثمر الأرض التي وهبتني يارب ثم يضعه أمام الرب إلهكم ويسجد في حضرته،"]]}, {"l": "Deu 26:11", "n": "", "vs": [[11, "ويحتفل بجميع الخير الذي أنعم به الرب إلهكم عليه وعلى أهل بيته، هو واللاوي والغريب المقيم بينكم."]]}, {"l": "1Ti 4:3-5", "n": "", "vs": [[3, "يحرمون الزواج، ويأمرون بالامتناع عن أطعمة خلقها الله ليتناولها المؤمنون وعارفو الحق شاكرين."], [4, "فإن كل ما خلقه الله جيد، ولا شيء منه يرفض إذا تناوله الإنسان شاكرا؛"], [5, "لأنه يصير مقدسا بكلمة الله والصلاة."]]}], "kwAr": "وتسبحون", "noteAr": ""}, {"kw": "that", "raw": "Joe_2:20,Joe_2:21; Gen_33:11; Psa_13:6, Psa_72:18, Psa_116:7, Psa_126:2, Psa_126:3; Isa_25:1", "note": "", "refs": [{"l": "Joe 2:20", "n": "", "vs": [[20, "سأطرد عنكم الشمالي، وأطوح به إلى أرض مقفرة موحشة فتكون طليعته في البحر الميت ومؤخرته في البحر الأبيض، فتملأ رائحة نتنه وعفونته الفضاء، لأنه قد ارتكب الكبائر."]]}, {"l": "Joe 2:21", "n": "", "vs": [[21, "لا تخافي أيتها الأرض، ابتهجي وافرحي لأن الرب قد صنع عظائم."]]}, {"l": "Gen 33:11", "n": "", "vs": [[11, "فأطلب إليك أن تقبل بركتي التي حملتها إليك، فإن الله قد أغدق علي، ولدي من كل شيء». وألح عليه حتى قبل."]]}, {"l": "Psa 13:6", "n": "", "vs": [[6, "أرنم للرب لأنه غمرني بإحسانه العميم."]]}, {"l": "Psa 72:18", "n": "", "vs": [[18, "تبارك الرب إله إسرائيل، فهو وحده صانع العجائب."]]}, {"l": "Psa 116:7", "n": "", "vs": [[7, "عودي يانفسي إلى طمأنينتك، لأن الرب قد أحسن إليك."]]}, {"l": "Psa 126:2", "n": "", "vs": [[2, "عندئذ امتلأت أفواهنا ضحكا، وألسنتنا ترنما. عندئذ قالت الأمم: إن الرب قد أجرى أمورا عظيمة مع هؤلاء."]]}, {"l": "Psa 126:3", "n": "", "vs": [[3, "نعم، إن الرب قد صنع أمورا عظيمة لنا، ففرحنا."]]}, {"l": "Isa 25:1", "n": "", "vs": [[1, "يارب أنت إلهي، أعظمك وأحمد اسمك لأنك صنعت عجائب كنت قد قضيت بها منذ القدم، وهي حق وصدق."]]}], "kwAr": "الذي أجرى", "noteAr": ""}, {"kw": "and my", "raw": "Psa_25:2, Psa_25:3, Psa_37:19; Isa_29:22, Isa_45:17, Isa_49:23, Isa_54:4; Zep_3:11; Rom_5:5; Rom_9:33, Rom_10:11; 1Jo_2:28", "note": "", "refs": [{"l": "Psa 25:2", "n": "", "vs": [[2, "عليك ياإلهي توكلت فلا تخزني، ولا تدع أعدائي يشمتون بي."]]}, {"l": "Psa 25:3", "n": "", "vs": [[3, "فإن كل من يرجوك لن يخيب. أما الغادرون بغيرهم من غير علة، فسيخزون."]]}, {"l": "Psa 37:19", "n": "", "vs": [[19, "لا يخزون في زمان السوء، وفي أيام الجوع يشبعون."]]}, {"l": "Isa 29:22", "n": "", "vs": [[22, "لذلك هكذا يقول الرب مفتدي إبراهيم لبيت يعقوب: لن يخجل يعقوب في ما بعد، ولن يعلو وجهه الشحوب،"]]}, {"l": "Isa 45:17", "n": "", "vs": [[17, "أما إسرائيل فقد خلصه الرب بخلاص أبدي، ولن يلحقكم عار أو خزي مدى الدهور،"]]}, {"l": "Isa 49:23", "n": "", "vs": [[23, "يكون لك الملوك آباء مربين، وملكاتهم مرضعات، ينحنون أمامك بوجوه مطرقة إلى الأرض، ويلحسون تراب قدميك. عندئذ تدركين أنني أنا الرب، وكل من يتكل علي لا يخزى»."]]}, {"l": "Isa 54:4", "n": "", "vs": [[4, "لا تجزعي لأنك لن تخزي، ولا تخجلي لأنه لن يلحق بك عار، فأنت ستنسين خزي صباك، ولن تذكري من بعد عار ترملك."]]}, {"l": "Zep 3:11", "n": "", "vs": [[11, "في ذلك اليوم لن يلحقكم العار من جراء ما ارتكبتم من أعمال تمردتم بها علي، لأني سأزيل آنئذ من وسطكم المستخفين المتكبرين، فلا يبقى متشامخ في جبلي المقدس."]]}, {"l": "Rom 5:5", "n": "", "vs": [[5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."]]}, {"l": "Rom 9:33", "n": "", "vs": [[33, "كما كتب: «ها أنا واضع في صهيون حجر عثرة وصخرة سقوط. ومن يؤمن به لا يخيب»."]]}, {"l": "Rom 10:11", "n": "", "vs": [[11, "لأن الكتاب يقول: «كل من هو مؤمن به، لا يخيب»."]]}, {"l": "1Jo 2:28", "n": "", "vs": [[28, "والآن، أيها الأولاد، كونوا ثابتين في المسيح، حتى تكون لنا نحن ثقة أمامه، ولا نخجل منه، عندما يعود."]]}], "kwAr": "ولن يخزى", "noteAr": ""}], "arS": [["فتأكلون", ["H398", "H398"]], [" بوفرة ", []], ["وتشبعون", ["H7646"]], [" ", []], ["وتسبحون", ["H1984"]], [" ", []], ["اسم", ["H8034"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["إلهكم", ["H430"]], [" الذي ", []], ["أجرى", ["H6213"]], [" ", []], ["لكم", ["H5973"]], [" ", []], ["العجائب", ["H6381"]], ["، ولن ", []], ["يخزى", ["H954"]], [" ", []], ["شعبي", ["H5971"]], [" ثانية.", []]]}, {"c": 2, "v": 27, "text": "فتدركون أني في وسط إسرائيل، وأني أنا هو الرب إلهكم وليس غيري، ولن يخزى شعبي ثانية.", "groups": [{"kw": "I am", "raw": "Joe_3:17; Lev_26:11, Lev_26:12; Deu_23:14; Psa_46:5, Psa_68:18; Isa_12:6; Eze_37:26-28; Zep_3:17; 2Co_6:16; Rev_21:3", "note": "", "refs": [{"l": "Joe 3:17", "n": "", "vs": [[17, "فتدركون أني أنا هو الرب إلهكم الساكن في صهيون جبلي المقدس، وتكون أورشليم مقدسة ولا يجتاز فيها الغرباء أبدا."]]}, {"l": "Lev 26:11", "n": "", "vs": [[11, "وأقيم مسكني في وسطكم ولا أخذلكم،"]]}, {"l": "Lev 26:12", "n": "", "vs": [[12, "وأسير بينكم وأكون إلهكم، وأنتم تكونون لي شعبا."]]}, {"l": "Deu 23:14", "n": "", "vs": [[14, "لأن الرب إلهكم سائر في وسط معسكركم لينقذكم ويظفركم بأعدائكم. فليكن معسكركم مقدسا لئلا يشهد فيه أقذارا فيتحول عنكم."]]}, {"l": "Psa 46:5", "n": "", "vs": [[5, "الله في وسط المدينة فلن تتزعزع. يعينها الله في الفجر المبكر."]]}, {"l": "Psa 68:18", "n": "", "vs": [[18, "يصعد إلى العلى ويأخذ معه سبايا كثيرين؛ يوزع الغنائم على الناس وحتى على الذين تمردوا قبلا على مقر سكناك، أيها الرب الإله."]]}, {"l": "Isa 12:6", "n": "", "vs": [[6, "اهتفوا وتغنوا ياأهل صهيون، لأن قدوس إسرائيل عظيم بينكم»."]]}, {"l": "Eze 37:26-28", "n": "", "vs": [[26, "وأبرم معهم ميثاق سلام، فيكون معهم عهدا أبديا، وأوطنهم وأكثرهم وأقيم مقدسي في وسطهم إلى الأبد."], [27, "ويكون مسكني معهم، فأكون لهم إلها ويكونون لي شعبا."], [28, "فتدرك الأمم أني أنا الرب مقدس إسرائيل، حين يكون مقدسي قائما في وسطهم إلى الأبد»."]]}, {"l": "Zep 3:17", "n": "", "vs": [[17, "فالرب إلهك في وسطك، جبار يخلص. يسر فرحا بك، ويجدد بمحبته حياتك، ويبتهج بك مترنما."]]}, {"l": "2Co 6:16", "n": "", "vs": [[16, "وأي وفاق لهيكل الله مع الأصنام؟ فإننا نحن هيكل الله الحي، وفقا لما قاله الله : «سأسكن في وسطهم، وأسير بينهم، وأكون إلههم وهم يكونون شعبا لي…"]]}, {"l": "Rev 21:3", "n": "", "vs": [[3, "وسمعت صوتا هاتفا من العرش: «الآن صار مسكن الله مع الناس، هو يسكن بينهم، وهم يصيرون شعبا له. الله نفسه يكون معهم إلها لهم!"]]}], "kwAr": "في وسط", "noteAr": ""}, {"kw": "that I", "raw": "Isa_45:5, Isa_45:18, Isa_45:21, Isa_45:22, Isa_53:6; Eze_39:22, Eze_39:28", "note": "", "refs": [{"l": "Isa 45:5", "n": "", "vs": [[5, "أنا هو الرب ولا إله غيري. ليس هناك آخر، شددتك مع أنك لم تعرفني."]]}, {"l": "Isa 45:18", "n": "", "vs": [[18, "لأن هكذا يقول الرب خالق السماوات، «إنه الله مكون الأرض وصانعها، ومرسي قواعدها: لم يخلقها لتكون خواء، بل لتصبح آهلة بسكانها. أنا هو الرب وليس هناك آخر."]]}, {"l": "Isa 45:21", "n": "", "vs": [[21, "أعلنوا، واعرضوا دعواكم. ليتشاوروا معا. من أنبأ بهذا منذ القدم، ومن أخ قضيت عليه بالفناء."]]}, {"l": "Mat 24:29", "n": "", "vs": [[29, "وحالا بعد الضيقة في تلك الأيام، تظلم الشمس، ويحجب القمر ضوءه، وتتهاوى النجوم من السماء، وتتزعزع قوات السماوات."]]}, {"l": "Mat 27:45", "n": "", "vs": [[45, "ومن الساعة الثانية عشرة ظهرا إلى الساعة الثالثة بعد الظهر، حل الظلام على الأرض كلها."]]}, {"l": "Mar 13:24", "n": "", "vs": [[24, "ولكن في تلك الأيام، بعد تلك الضيقة، تظلم الشمس ويحجب القمر ضوءه،"]]}, {"l": "Mar 13:25", "n": "", "vs": [[25, "وتتهاوى نجوم السماء، وتتزعزع القوات التي في السماوات."]]}, {"l": "Luk 21:25", "n": "", "vs": [[25, "وستظهر علامات في الشمس والقمر والنجوم، وتكون على الأرض ضيقة على الأمم الواقعة في حيرة، لأن البحر والأمواج تعج وتجيش،"]]}, {"l": "Rev 6:12", "n": "", "vs": [[12, "ثم نظرت، فرأيت الحمل يفك الختم السادس، وإذا الأرض قد زلزلت زلزالا عظيما، والشمس اسودت فصارت كخرقة من شعر، وصار القمر أحمر كالدم،"]]}, {"l": "Rev 6:13", "n": "", "vs": [[13, "وسقطت نجوم السماء على الأرض كما تطرح شجرة التين ثمارها الفجة، إذا هزتها ريح عاصفة."]]}], "kwAr": "الشمس", "noteAr": ""}, {"kw": "the great", "raw": "Zep_1:14-16; Mal_4:1, Mal_4:5", "note": "", "refs": [{"l": "Zep 1:14-16", "n": "", "vs": [[14, "إن يوم الرب العظيم قريب، وشيك وسريع جدا. دوي يوم الرب مخيف، فيه يصرخ الجبار مرتعبا."], [15, "يوم غضب هو ذلك اليوم، يوم ضيق وعذاب، يوم خراب ودمار، يوم ظلمة واكتئاب، يوم غيوم وقتام."], [16, "يوم دوي بوق وصيحة قتال ضد المدن الحصينة والبروج الشامخة."]]}, {"l": "Mal 4:1", "n": "", "vs": [[1, "«انظروا، ها يوم القضاء مقبل، لاهب كتنور يكون فيه جميع المستكبرين وفاعلي الإثم عصافة، فيحرقهم ذلك اليوم ولا يبقي لهم أصلا ولا فرعا، يقول الرب القدير."]]}, {"l": "Mal 4:5", "n": "", "vs": [[5, "ها أنا أرسل إليكم إيليا النبي قبل أن يجيء يوم قضاء الرب الرهيب العظيم"]]}], "kwAr": "العظيم", "noteAr": ""}], "arS": [["وتتحول", ["H2015"]], [" ", []], ["الشمس", ["H8121"]], [" إلى ", []], ["ظلام", ["H2822"]], ["، ", []], ["والقمر", ["H3394"]], [" إلى ", []], ["دم", ["H1818"]], ["، ", []], ["قبل", ["H6440"]], [" ", []], ["مجيء", ["H935"]], [" ", []], ["يوم", ["H3117"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["العظيم", ["H1419"]], [" ", []], ["المخيف", ["H3372"]], [".", []]]}, {"c": 2, "v": 32, "text": "إنما كل من يدعو باسم الرب يخلص، لأن النجاة تكون في جبل صهيون وفي أورشليم، كما قال الرب، إذ يكون بين الناجين من يدعوه الرب.", "groups": [{"kw": "that", "raw": "Psa_50:15; Jer_33:3; Zec_13:9; Act_2:21; Rom_10:11-14; 1Co_1:2", "note": "", "refs": [{"l": "Psa 50:15", "n": "", "vs": [[15, "ادعني في يوم ضيقك أنقذك فتمجدني»."]]}, {"l": "Jer 33:3", "n": "", "vs": [[3, "ادعني فأجيبك وأطلعك على عظائم وغرائب لم تعرفها."]]}, {"l": "Zec 13:9", "n": "", "vs": [[9, "فأجيز هذا الثلث في النار لأنقيه تنقية الفضة، وأمحصه كما يمحص الذهب. هو يدعو باسمي وأنا أستجيبه. أنا أقول: هو شعبي، وهو يقول: الرب هو إلهي»."]]}, {"l": "Act 2:21", "n": "", "vs": [[21, "ولكن كل من يدعو باسم الرب يخلص!"]]}, {"l": "Rom 10:11-14", "n": "", "vs": [[11, "لأن الكتاب يقول: «كل من هو مؤمن به، لا يخيب»."], [12, "فلا فرق بين اليهودي واليوناني، لأن للجميع ربا واحدا، غنيا تجاه كل من يدعوه»."], [13, "«فإن كل من يدعو باسم الرب يخلص»."], [14, "ولكن، كيف يدعون من لم يؤمنوا به؟ وكيف يؤمنون بمن لم يسمعوا به؟ وكيف يسمعون بلا مبشر؟"]]}, {"l": "1Co 1:2", "n": "", "vs": [[2, "إلى كنيسة الله في مدينة كورنثوس، إلى الذين تقدسوا في المسيح يسوع، المدعوين، القديسين؛ وإلى جميع الذين يدعون باسم ربنا يسوع المسيح في كل مكان ربا لهم ولنا."]]}], "kwAr": "كل من", "noteAr": ""}, {"kw": "for", "raw": "Isa_46:13, Isa_59:20,Isa_59:21; Oba_1:17, Oba_1:21; Joh_4:22; Rom_11:26; Heb_12:22", "note": "", "refs": [{"l": "Isa 46:13", "n": "", "vs": [[13, "لقد جعلت أوان بري قريبا. لم يعد بعيدا، وخلاصي لا يبطيء. سأجعل خلاصا في صهيون، وفي إسرائيل مجدي."]]}, {"l": "Isa 59:20", "n": "", "vs": [[20, "ويقبل الفادي إلى صهيون، وإلى التائبين عن معاصيهم من ذرية يعقوب، يقول الرب."]]}, {"l": "Isa 59:21", "n": "", "vs": [[21, "أما أنا يقول الرب، فهذا عهدي معهم: إن روحي الحال عليك وكلامي الذي لقنتك إياه، لا يزول من فمك أو من فم أبنائك أو أحفادك، من الآن وإلى الأبد."]]}, {"l": "Oba 1:17", "n": "", "vs": [[17, "أما جبل صهيون فيصبح ملاذ النجاة، ويكون قدسا، ويرث بيت يعقوب نصيبه."]]}, {"l": "Oba 1:21", "n": "", "vs": [[21, "ويصعد المنقذون إلى جبل صهيون ليحكموا جبل عيسو، ويصبح الملك للرب."]]}, {"l": "Joh 4:22", "n": "", "vs": [[22, "أنتم تعبدون ما تجهلون، ونحن نعبد ما نعلم، لأن الخلاص هو من عند اليهود."]]}, {"l": "Rom 11:26", "n": "", "vs": [[26, "وهكذا، سوف يخلص جميع إسرائيل، وفقا لما قد كتب: «إن المنقذ سيطلع من صهيون ويرد الإثم عن يعقوب."]]}, {"l": "Heb 12:22", "n": "", "vs": [[22, "ولكنكم قد اقتربتم إلى جبل صهيون، إلى مدينة الله الحي، أورشليم السماوية. بل تقدمتم إلى حفلة يجتمع فيها عدد لا يحصى من الملائكة،"]]}], "kwAr": "لأن النجاة", "noteAr": ""}, {"kw": "and in", "raw": "Isa_10:22, Isa_11:11, Isa_11:16; Jer_31:7; Mic_4:6, Mic_4:7, Mic_5:3, Mic_5:7, Mic_5:8; Joh_10:16; Act_2:39, Act_15:17; Rom_8:28-30, Rom_9:24, Rom_9:27, Rom_11:5, Rom_11:7; 2Th_2:13, 2Th_2:14", "note": "", "refs": [{"l": "Isa 10:22", "n": "", "vs": [[22, "مع أن شعبك ياإسرائيل كرمل البحر، فإن بقية فقط ترجع، لأن الله قضى بفنائهم، وقضاؤه عادل."]]}, {"l": "Isa 11:11", "n": "", "vs": [[11, "فيعود الرب ليمد يده ثانية ليسترد البقية الباقية من شعبه، من أشور ومصر وفتروس وكوش وعيلام وشنعار وحماة، ومن جزائر البحر،"]]}, {"l": "Isa 11:16", "n": "", "vs": [[16, "ويمد الرب طريقا من أشور ليعود منه من بقي هناك من بني إسرائيل، كما أعاد الرب جميع إسرائيل من مصر."]]}, {"l": "Jer 31:7", "n": "", "vs": [[7, "فإن هذا ما يعلنه الرب: «رنموا بهتاف ليعقوب، اهتفوا لرأس الأمم، أعلنوا وسبحوا وقولوا: أنقذ يارب شعبك، بقية إسرائيل»."]]}, {"l": "Mic 4:6", "n": "", "vs": [[6, "في ذلك اليوم، يقول الرب، أجمع العرج، وأضم المطرودين وكل الذين أنزلت بهم البلاء."]]}, {"l": "Mic 4:7", "n": "", "vs": [[7, "فأجعل من العرج بقية، ومن المنبوذين أمة قوية، فيملك الرب عليهم في جبل صهيون من الآن وإلى الأبد."]]}, {"l": "Mic 5:3", "n": "", "vs": [[3, "لذلك يسلم الرب شعبه إلى أعدائهم إلى أن تلد من تقاسي من المخاض، عندئذ ترجع بقية إخوته من السبي إلى شعب إسرائيل."]]}, {"l": "Mic 5:7", "n": "", "vs": [[7, "عندئذ تغدو بقية ذرية يعقوب بين الأمم الكثيرة كندى من لدن الرب، كالمطر الوابل على العشب الذي لا يتوانى من أجل الناس أو يرجو أبناء البشر."]]}, {"l": "Mic 5:8", "n": "", "vs": [[8, "وتكون بقية ذرية يعقوب بين الشعوب الكثيرة كأسد بين وحوش الغابة، أو كشبل بين قطعان الغنم، الذي إن اقتحم يدوس ويفترس وليس من منقذ."]]}, {"l": "Joh 10:16", "n": "", "vs": [[16, "ولي خراف أخرى لا تنتمي إلى هذه الحظيرة، لا بد أن أجمعها إلي أيضا، فتصغي لصوتي؛ فيكون هناك قطيع واحد وراع واحد."]]}, {"l": "Act 2:39", "n": "", "vs": [[39, "لأن الوعد هو لكم ولأولادكم وللبعيدين جميعا، يناله كل من يدعوه الرب إلهنا!»"]]}, {"l": "Act 15:17", "n": "", "vs": [[17, "لكي يسعى إلى الرب باقي الناس وجميع الشعوب التي تحمل اسمي، يقول الرب، فاعل هذه الأمور"]]}, {"l": "Rom 8:28-30", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."], [29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."], [30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."]]}, {"l": "Rom 9:24", "n": "", "vs": [[24, "فينا نحن الذين دعاهم لا من بين اليهود فقط بل من بين الأمم أيضا؟"]]}, {"l": "Rom 9:27", "n": "", "vs": [[27, "أما إشعياء، فيهتف متكلما على إسرائيل: «ولو كان بنو إسرائيل كرمل البحر عددا، فإن بقية منهم ستخلص."]]}, {"l": "Rom 11:5", "n": "", "vs": [[5, "فكذلك، في الزمان الحاضر، ماتزال بقية اختارها الله بالنعمة."]]}, {"l": "Rom 11:7", "n": "", "vs": [[7, "فما الخلاصة إذا؟ إن ما يسعى إليه إسرائيل لم ينالوه، بل ناله المختارون منهم، والباقون عميت بصائرهم،"]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "2Th 2:14", "n": "", "vs": [[14, "فإلى هذا الأمر قد دعاكم ببشارتنا لكم، لنوال مجد ربنا يسوع المسيح."]]}], "kwAr": "وفي أورشليم", "noteAr": ""}], "arS": [["إنما كل من ", []], ["يدعو", ["H7121"]], [" ", []], ["باسم", ["H8034"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["يخلص", ["H4422"]], ["، لأن ", []], ["النجاة", ["H6413"]], [" تكون في ", []], ["جبل", ["H2022"]], [" ", []], ["صهيون", ["H6726"]], [" وفي ", []], ["أورشليم", ["H3389"]], ["، كما ", []], ["قال", ["H559"]], [" الرب، إذ يكون بين ", []], ["الناجين", ["H8300"]], [" من ", []], ["يدعوه", ["H7121"]], [" الرب.", []]]}, {"c": 3, "v": 1, "text": "لأنه في تلك الأيام، وفي ذلك الحين عندما أرد سبي يهوذا وأورشليم،", "groups": [{"kw": "in those", "raw": "Joe_2:29; Dan_12:1; Zep_3:19, Zep_3:20", "note": "", "refs": [{"l": "Joe 2:29", "n": "", "vs": [[29, "وأسكب في تلك الأيام أيضا روحي على العبيد والإماء."]]}, {"l": "Dan 12:1", "n": "", "vs": [[1, "«وفي ذلك الوقت يقوم الرئيس العظيم الملاك ميخائيل حارس شعبك، وذلك في أثناء ضيق لم يكن له مثيل منذ أن وجدت أمة حتى ذلك الزمان. غير أن كل من كان اسمه مدونا في الكتاب من شعبك ينجو في ذلك الزمان."]]}, {"l": "Zep 3:19", "n": "", "vs": [[19, "في ذلك الوقت أعاقب الذين ضايقوك، وأخلص الأعرج، وأعيد المسبي، وأغدق عليهم مدحا وشرفا في كل أرض تعرضوا فيها للخزي."]]}, {"l": "Zep 3:20", "n": "", "vs": [[20, "في ذلك الوقت أجمعكم من الشتات وأعيدكم إلى موطنكم، وأجعل لكم مقاما شريفا محمودا بين جميع شعوب الأرض، حين أرد لكم ازدهاركم. هكذا قال الرب."]]}], "kwAr": "في تلك الأيام", "noteAr": ""}, {"kw": "when", "raw": "Deu_30:3; 2Ch_6:37, 2Ch_6:38; Psa_14:7, Psa_85:1; Isa_11:11-16; Jer_16:15, Jer_23:3-8; Jer_29:14, Jer_30:3, Jer_30:18; Eze_16:53, Eze_37:21, Eze_37:22, Eze_38:14-18, Eze_39:25, Eze_39:28, Eze_39:29; Amo_9:14", "note": "", "refs": [{"l": "Deu 30:3", "n": "", "vs": [[3, "فإن الرب إلهكم يرد سبيكم ويرحمكم، ويلم شتاتكم من بين جميع الشعوب الذين نفاكم الرب إلهكم إليهم."]]}, {"l": "2Ch 6:37", "n": "", "vs": [[37, "فإن تابوا في أرض سبيهم، ورجعوا متضرعين إليك قائلين: قد أخطأنا وانحرفنا وأذنبنا،"]]}, {"l": "2Ch 6:38", "n": "", "vs": [[38, "وتابوا حقا من كل قلوبهم وأنفسهم وهم في ديار آسريهم، وصلوا إليك متوجهين نحو أرضهم التي وهبتها لآبائهم، نحو المدينة التي اخترتها والهيكل الذي بنيته لاسمك،"]]}, {"l": "Psa 14:7", "n": "", "vs": [[7, "ليت من صهيون خلاص إسرائيل. عندما يرد الرب سبي شعبه، يبتهج يعقوب، ويفرح بنو إسرائيل."]]}, {"l": "Psa 85:1", "n": "", "vs": [[1, "يارب، قد رضيت عن أرضك، وأرجعت سبي يعقوب."]]}, {"l": "Isa 11:11-16", "n": "", "vs": [[11, "فيعود الرب ليمد يده ثانية ليسترد البقية الباقية من شعبه، من أشور ومصر وفتروس وكوش وعيلام وشنعار وحماة، ومن جزائر البحر،"], [12, "وينصب راية للأمم ويجمع منفيي إسرائيل ومشتتي يهوذا من أربعة أطراف الأرض،"], [13, "فيتلاشى حسد أفرايم، وتزول عداوة يهوذا، فلا أفرايم يحسد يهوذا، ولا يهوذا يعادي أفرايم،"], [14, "وينقضان على أكتاف الفلسطينيين غربا ويغزوان أبناء المشرق معا، ويستوليان على بلاد أدوم وموآب، ويخضع لهم بنو عمون."], [15, "ويجفف الرب تماما لسان بحر مصر، ويهز يده على النهر فتهب ريح عاصفة تقسم ماءه إلى سبع ممرات تعبر فيها الجيوش."], [16, "ويمد الرب طريقا من أشور ليعود منه من بقي هناك من بني إسرائيل، كما أعاد الرب جميع إسرائيل من مصر."]]}, {"l": "Jer 16:15", "n": "", "vs": [[15, "إنما يقال: حي هو الرب الذي أخرج شعب إسرائيل من بلاد الشمال ومن سائر الأراضي التي سباهم إليها. لأني سأرجعهم ثانية إلى أرضهم التي وهبتها لآبائهم."]]}, {"l": "Jer 23:3-8", "n": "", "vs": [[3, "وأجمع شتات غنمي من جميع الأراضي التي أجليتها إليها، وأردها إلى مراعيها فتنمو وتتكاثر،"], [4, "وأقيم عليها رعاة يتعهدونها فلا يعتريها خوف من بعد ولا ترتعد ولا تضل."], [5, "ها أيام مقبلة أقيم فيها لداود ذرية بر، ملكا يسود بحكمة، ويجري في الأرض عدلا وحقا."], [6, "في عهده يتم خلاص شعب يهوذا، ويسكن شعب إسرائيل آمنا. أما الاسم الذي سيدعى به فهو: الرب برنا."], [7, "لذلك ها أيام مقبلة لا يردد فيها الناس من بعد: حي هو الرب الذي أخرج بني إسرائيل من ديار مصر."], [8, "بل يقولون: حي هو الرب الذي أخرج ذرية شعب إسرائيل، وأتى بهم من أرض الشمال ومن كافة الديار التي أجلاهم إليها، فيسكنون في أرضهم»."]]}, {"l": "Jer 29:14", "n": "", "vs": [[14, "وحين تجدونني أرد سبيكم، وأجمعكم من بين جميع الأمم ومن جميع الأماكن التي شتتكم إليها."]]}, {"l": "Jer 30:3", "n": "", "vs": [[3, "ها أيام مقبلة أرد فيها سبي شعبي إسرائيل ويهوذا، وأعيدهم إلى الأرض التي أعطيتها لآبائهم فيرثونها»."]]}, {"l": "Jer 30:18", "n": "", "vs": [[18, "وهذا ما يعلنه الرب: «ها أنا أرد سبي ذرية يعقوب إلى منازلهم، وأرحم مساكنهم، فتبنى المدينة على رابيتها، وينتصب القصر كالعهد به."]]}, {"l": "Eze 16:53", "n": "", "vs": [[53, "ولكني سأرد سبيهن: سبي سدوم وبناتها، وسبي السامرة وبناتها، وسبي مسبييك في جملتهم."]]}, {"l": "Eze 37:21", "n": "", "vs": [[21, "وها أنا أحشد أبناء إسرائيل من بين الأمم التي تفرقوا فيها وأجمعهم من كل جهة وأحضرهم إلى أرضهم."]]}, {"l": "Eze 37:22", "n": "", "vs": [[22, "وأجعلهم أمة واحدة في الأرض وعلى الجبال، تحت رئاسة ملك واحد، فلا يكونون بعد أمتين، ولا ينقسمون إلى مملكتين."]]}, {"l": "Eze 38:14-18", "n": "", "vs": [[14, "لذلك تنبأ ياابن آدم، وقل لجوج هذا ما يعلنه السيد الرب: في ذلك اليوم عندما يسكن شعبي إسرائيل آمنا، ألا تعلم ذلك؟"], [15, "وتقبل أنت من مقرك في أقاصي الشمال مع جيوش غفيرة، تغشي الأرض؛ كلهم راكبو خيل وجمع عظيم وجيش كثير."], [16, "وتزحف على شعبي إسرائيل كسحابة تغطي الأرض، أني في الأيام الأخيرة آتي بك إلى أرضي لكي تعرفني الشعوب عندما تتجلى قداستي حين أدمرك ياجوج أمام عيونهم.هذا ما يقوله السيد الرب:"], [17, "ألست أنت الذي تحدثت عنه في الأيام الغابرة على ألسنة عبيدي أنبياء إسرائيل الذين تنبأوا في تلك الأيام لسنين كثيرة بأني سآتي بك عليهم؟"], [18, "ويقول السيد الرب: في ذلك اليوم عندما يزحف جوج على أرض إسرائيل يحتدم غضبي في وجهي."]]}, {"l": "Eze 39:25", "n": "", "vs": [[25, "أما الآن فها أنا أرد سبي ذرية يعقوب وأرحم كل شعب إسرائيل وأغار على اسمي القدوس،"]]}, {"l": "Eze 39:28", "n": "", "vs": [[28, "فيدركون أني أنا الرب إلههم، إذ نفيتهم إلى الأمم، ثم عدت وجمعتهم إلى أرضهم، من غير أن أبقي هناك منهم أحدا من بعد."]]}, {"l": "Eze 39:29", "n": "", "vs": [[29, "ولا أعود أحجب وجهي عنهم لأني أسكب روحي على شعب إسرائيل يقول السيد الرب»."]]}, {"l": "Amo 9:14", "n": "", "vs": [[14, "وأرد سبي شعبي إسرائيل فيعيدون بناء المدن الخربة ويسكنونها، ويزرعون كروما ويشربون من خمرها، ويغرسون جنات ويأكلون من ثمارها."]]}], "kwAr": "عندما", "noteAr": ""}], "arS": [["لأنه في تلك ", []], ["الأيام", ["H3117"]], ["، وفي ذلك ", []], ["الحين", ["H6256"]], [" عندما ", []], ["أرد", ["H7725"]], [" ", []], ["سبي", ["H7622"]], [" ", []], ["يهوذا", ["H3063"]], [" ", []], ["وأورشليم", ["H3389"]], ["،", []]]}, {"c": 3, "v": 2, "text": "أجمع الأمم كلها وأحضرهم إلى وادي يهوشافاط، وأحاكمهم هناك من أجل شعبي وميراثي إسرائيل، لأنهم شتتوهم بين الشعوب واقتسموا أرضي.", "groups": [{"kw": "also", "raw": "Zep_3:8; Zec_14:2-4; Rev_16:14, Rev_16:16, Rev_19:19-21, Rev_20:8", "note": "", "refs": [{"l": "Zep 3:8", "n": "", "vs": [[8, "لذلك يقول الرب: انتظروني لأني عزمت في اليوم الذي أقوم فيه كشاهد أن أجمع الأمم وأحشد الممالك لأسكب عليهم سخطي واحتدام غضبي، لأن الأرض بكاملها ستؤكل بنار غيرة غيظي."]]}, {"l": "Zec 14:2-4", "n": "", "vs": [[2, "لأني أجمع جميع الأمم على أورشليم لتحاربها، فتؤخذ المدينة وتنهب البيوت وتغتصب النساء ويسبى نصف أهلها إلى المنفى. إنما لا ينقرض بقية الشعب من المدينة."], [3, "ولا يلبث أن يهب الرب ليحارب تلك الأمم، كما كان يحارب في يوم القتال."], [4, "وتقف قدماه في ذلك اليوم على جبل الزيتون الممتد أمام أورشليم باتجاه الشرق، فينشق جبل الزيتون إلى شطرين من الشرق إلى الغرب عن واد عظيم جدا، فيتراجع نصف الجبل إلى الشمال، والنصف الآخر نحو الجنوب."]]}, {"l": "Rev 16:14", "n": "", "vs": [[14, "وهي أرواح شيطانية قادرة على صنع المعجزات، تذهب إلى ملوك الأرض جميعا وتجمعهم للحرب في ذلك اليوم العظيم، يوم الله القادر على كل شيء."]]}, {"l": "Rev 16:16", "n": "", "vs": [[16, "وجمعت الأرواح الشيطانية جيوش العالم كلها في مكان يسمى بالعبرية «هرمجدون»."]]}, {"l": "Rev 19:19-21", "n": "", "vs": [[19, "ورأيت الوحش وملوك الأرض وجيوشهم وقد احتشدوا ليحاربوا هذا الفارس وجيشه."], [20, "فقبض على الوحش وعلى النبي الدجال الذي قام بالمعجزات في حضور الوحش وأضل بها الذين قبلوا علامة الوحش، وسجدوا لتمثاله. وطرح كلاهما حيا في بحيرة النار والكبريت المتقدة،"], [21, "وقتل السيف الخارج من فم الفارس جميع الباقين، وشبعت الطيور كلها من لحومهم."]]}, {"l": "Rev 20:8", "n": "", "vs": [[8, "فيخرج ليضلل الأمم في زوايا الأرض الأربع، جوج وماجوج، ويجمعهم للقتال، وعددهم كثير جدا كرمل البحر!"]]}], "kwAr": "أجمع", "noteAr": ""}, {"kw": "the valley", "raw": "Joe_3:12; 2Ch_20:26; Eze_39:11; Zec_14:4", "note": "", "refs": [{"l": "Joe 3:12", "n": "", "vs": [[12, "لتنهض الأمم وتقبل إلى وادي القضاء لأنني هناك أجلس لأدين الشعوب المتوافدة من كل جهة."]]}, {"l": "2Ch 20:26", "n": "", "vs": [[26, "ثم اجتمعوا في اليوم الرابع في وادي البركة لأنهم هناك باركوا الرب، فدعوا ذلك المكان وادي البركة إلى هذا اليوم."]]}, {"l": "Eze 39:11", "n": "", "vs": [[11, "ومن ذلك اليوم أجعل لجوج موضعا يدفن فيه في إسرائيل، هو وادي العابرين المتجه شرقا نحو البحر (الميت)، فيسد الطريق أمام العابرين إذ هناك يدفنون جوجا وسائر جيوشه ويدعون الموضع «وادي جمهور جوج»."]]}, {"l": "Zec 14:4", "n": "", "vs": [[4, "وتقف قدماه في ذلك اليوم على جبل الزيتون الممتد أمام أورشليم باتجاه الشرق، فينشق جبل الزيتون إلى شطرين من الشرق إلى الغرب عن واد عظيم جدا، فيتراجع نصف الجبل إلى الشمال، والنصف الآخر نحو الجنوب."]]}], "kwAr": "وادي يهوشافاط", "noteAr": ""}, {"kw": "will plead", "raw": "Isa_66:16; Eze_38:22; Amo_1:11; Oba_1:10-16; Zec_12:3, Zec_12:4; Rev_11:18, Rev_16:6; Rev_18:20,Rev_18:21", "note": "", "refs": [{"l": "Isa 66:16", "n": "", "vs": [[16, "لأن الرب يعاقب أهل الأرض بناره وسيفه، ويكثر قتلى الرب."]]}, {"l": "Eze 38:22", "n": "", "vs": [[22, "وأدينه بالوباء وبالدم، وأمطر عليه وعلى جيوشه وعلى جموع حلفائه الغفيرة مطرا جارفا وبردا عظيما ونارا وكبريتا."]]}, {"l": "Amo 1:11", "n": "", "vs": [[11, "وهذا ما يقوله الرب: من أجل معاصي أدوم الثلاث والأربع لن أرد عنهم سخطي، لأنهم تعقبوا إخوتهم بالسيف، وتغاضوا عن كل رحمة، وجعلوا غضبهم يتأجج ملتهما باستمرار، وظلوا حاقدين على الدوام."]]}, {"l": "Oba 1:10-16", "n": "", "vs": [[10, "فمن أجل ما أنزلت بأخيك يعقوب من ظلم، يغشاك العار وتنقرض إلى الأبد."], [11, "ففي ذلك اليوم الذي وقفت فيه بعيدا، يوم غنم الغرباء كنوزه، واقتحم الأجانب أبوابه وألقوا القرعة على أورشليم، كنت أنت أيضا كواحد منهم."], [12, "ما كان يجب أن تشمت بيوم مصير أخيك، في يوم فاجعته، وما كان يجب أن تبتهج في يوم دمار شعب يهوذا أو تتباهى في يوم الضيق."], [13, "وما كان يجب أن تقتحم أبواب شعبي في يوم كارثته، أو تشمت لمصيبته في يوم نكبته، أو تنهب ثروته في يوم بليته،"], [14, "أو تقف عند مفترق الطرق لتقضي على الناجين من قومه وتسلم الباقين الأحياء منهم في يوم الضيق."], [15, "لأن يوم الرب قريب آت على كل الأمم، وكما فعلت، لابد أن يفعل بك أيضا، فيرتد عملك على رأسك."], [16, "فإنه كما شربت على جبل قدسي فإن جميع الأمم تشرب في كل حين. يشربون ويجرعون ويتلاشون كمن لم يكونوا."]]}, {"l": "Zec 12:3", "n": "", "vs": [[3, "في ذلك اليوم أجعل أورشليم كصخرة ثقيلة تعجز عن حملها جميع الشعوب. وكل من يحاول حملها ينشق شقا، ويتألب عليها جميع شعوب الأرض."]]}, {"l": "Zec 12:4", "n": "", "vs": [[4, "في ذلك اليوم، يقول الرب: أصيب كل فرس من جيوش الأعداء بالرعب، وفارسه بالجنون، وأرعى برضاي شعب يهوذا، وأبتلي جميع خيول الأمم بالعمى."]]}, {"l": "Rev 11:18", "n": "", "vs": [[18, "غضبت الشعوب عليك، فجاء دور غضبك عليهم. جاءت الساعة ليدان الأموات، وتكافيء عبيدك الأنبياء والقديسين والمتقين اسمك، صغارا وكبارا، وتهلك الذين كانوا يدمرون الأرض!»"]]}, {"l": "Rev 16:6", "n": "", "vs": [[6, "فقد سفك الناس دم قديسين وأنبياء، وها أنت تسقي قاتليهم دما! إنهم ينالون ما يستحقون!»"]]}, {"l": "Rev 18:20", "n": "", "vs": [[20, "اشمتي بها أيتها السماء! واشمتوا بها أيها القديسون والرسل والأنبياء، فقد أصدر الله حكمه عليها بعدما أصدرت أحكامها عليكم»."]]}, {"l": "Rev 18:21", "n": "", "vs": [[21, "وتناول ملاك قوي حجرا كأنه حجر طاحونة عظيم وألقاه في البحر قائلا: «هكذا تدفع وتطرح بابل المدينة العظمى، فتختفي إلى الأبد!"]]}], "kwAr": "وأحاكمهم", "noteAr": ""}, {"kw": "and parted", "raw": "Jer_12:14, Jer_49:1; Eze_25:8, Eze_35:10; Zep_2:8-10", "note": "", "refs": [{"l": "Jer 12:14", "n": "", "vs": [[14, "وهذا ما يعلنه الرب عن جميع جيراني الأشرار الذين يمسون الميراث الذي ورثته لشعبي إسرائيل: «ها أنا أقتلعهم من أرضهم كما أقتلع أيضا شعب يهوذا من وسطهم."]]}, {"l": "Jer 49:1", "n": "", "vs": [[1, "نبوءة عن بني عمون، هذا ما يعلنه الرب: «أليس لإسرائيل أبناء؟ أليس له وارث؟ فما بال ملك العمونيين قد استولى على ميراث سبط جاد وسكن شعبه في مدنه؟"]]}, {"l": "Eze 25:8", "n": "", "vs": [[8, "وهذا ما يعلنه السيد الرب: لأن الموآبيين وأهل سعير يقولون: هل شعب يهوذا كبقية الأمم."]]}, {"l": "Eze 35:10", "n": "", "vs": [[10, "لأنك قلت: إن هاتين الأمتين، وهاتين الأرضين تصبحان لي فأمتلكهما، ولو كان الرب هناك."]]}, {"l": "Zep 2:8-10", "n": "", "vs": [[8, "قد سمعت تعيير موآب وتجاديف بني عمون، وكيف احتقروا شعبي وهددوا تخمهم."], [9, "لذلك، كما أنا حي، يقول الرب القدير إله إسرائيل، ليصبحن أهل موآب كسدوم، والعمونيون كعمورة، منبتا للقريص وحفرة للملح وخرابا إلى الأبد، وتنهبهم بقية شعبي ويمتلكهم الناجون من أمتي."], [10, "هذا ما يجنونه لقاء تشامخهم، لأنهم احتقروا وتباهوا على شعب الرب القدير."]]}], "kwAr": "واقتسموا", "noteAr": ""}], "arS": [["أجمع", ["H6908"]], [" ", []], ["الأمم", ["H1471"]], [" كلها ", []], ["وأحضرهم", ["H3381"]], [" إلى ", []], ["وادي", ["H6010"]], [" ", []], ["يهوشافاط", ["H3092"]], ["، ", []], ["وأحاكمهم", ["H8199"]], [" ", []], ["هناك", ["H8033"]], [" من أجل ", []], ["شعبي", ["H5971"]], [" ", []], ["وميراثي", ["H5159"]], [" ", []], ["إسرائيل", ["H3478"]], ["، لأنهم ", []], ["شتتوهم", ["H6340"]], [" بين ", []], ["الشعوب", ["H1471"]], [" ", []], ["واقتسموا", ["H2505"]], [" ", []], ["أرضي", ["H776"]], [".", []]]}, {"c": 3, "v": 3, "text": "وألقوا القرعة على شعبي فقايضوا الزانية بالصبي، وباعوا الصبية لقاء شربة خمر.", "groups": [{"kw": "", "raw": "2Ch_28:8, 2Ch_28:9; Amo_2:6; Oba_1:11; Nah_3:10; Rev_18:13", "note": "", "refs": [{"l": "2Ch 28:8", "n": "", "vs": [[8, "وسبى بنو إسرائيل من أقربائهم بني يهوذا مئتي ألف من النساء والأبناء والبنات، ونهبوا منهم أسلابا وافرة حملوها إلى السامرة."]]}, {"l": "2Ch 28:9", "n": "", "vs": [[9, "غير أن نبيا للرب يدعى عوديد خرج للقاء الجيش الراجع إلى السامرة وقال لهم: «لقد نصركم الرب إله آبائكم على يهوذا لأنه غضب عليهم، وها أنتم قد قتلتموهم بقسوة أغضبت السماء."]]}, {"l": "Amo 2:6", "n": "", "vs": [[6, "هذا ما يقوله الرب: من أجل معاصي إسرائيل الثلاث والأربع لن أرد عنهم سخطي، لأنهم باعوا الصديق لقاء الفضة، والبائس مقابل نعلين."]]}, {"l": "Oba 1:11", "n": "", "vs": [[11, "ففي ذلك اليوم الذي وقفت فيه بعيدا، يوم غنم الغرباء كنوزه، واقتحم الأجانب أبوابه وألقوا القرعة على أورشليم، كنت أنت أيضا كواحد منهم."]]}, {"l": "Nah 3:10", "n": "", "vs": [[10, "ومع ذلك فقد وقعت أسيرة واقتيدت إلى السبي، وتمزق أطفالها أشلاء في زاوية كل شارع، واقترع على عظمائها، وصفد نبلاؤها بالأغلال."]]}, {"l": "Rev 18:13", "n": "", "vs": [[13, "والقرفة والبهار، والعطور والطيب والبخور، والخمر والزيت والدقيق والحبوب، والبهائم والغنم، والخيل والمركبات، والأجساد والنفوس البشرية"]]}], "kwAr": "", "noteAr": ""}], "arS": [["وألقوا", ["H3032"]], [" ", []], ["القرعة", ["H1486"]], [" على ", []], ["شعبي", ["H5971"]], [" ", []], ["فقايضوا", ["H5414"]], [" ", []], ["الزانية", ["H2181"]], [" ", []], ["بالصبي", ["H3206"]], ["، ", []], ["وباعوا", ["H4376"]], [" ", []], ["الصبية", ["H3207"]], [" لقاء ", []], ["شربة", ["H8354"]], [" ", []], ["خمر", ["H3196"]], [".", []]]}, {"c": 3, "v": 4, "text": "ماذا لديكم ضدي ياصور وصيدون وسائر أقاليم فلسطين؟ أتجازونني على أمر أتيته؟ أم تسعون لإيذائي؟ إني أنزل العقاب على رؤوسكم بغتة وسريعا.", "groups": [{"kw": "and what", "raw": "Jdg_11:12; 2Ch_21:16, 2Ch_28:17, 2Ch_28:18; Act_9:4", "note": "", "refs": [{"l": "Jdg 11:12", "n": "", "vs": [[12, "ثم بعث يفتاح رسلا إلى ملك عمون يسأله: «ماذا تضمر ضدنا حتى أتيت لتهاجمنا في بلادنا؟»"]]}, {"l": "2Ch 21:16", "n": "", "vs": [[16, "وأثار الرب على يهورام عداء الفلسطينيين والعرب المستوطنين إلى جوار الكوشيين."]]}, {"l": "2Ch 28:17", "n": "", "vs": [[17, "لأن الأدوميين زحفوا على يهوذا وهاجموهم وأخذوا منهم أسرى."]]}, {"l": "2Ch 28:18", "n": "", "vs": [[18, "واقتحم الفلسطينيون مدن السواحل وجنوبي يهوذا واستولوا على بيت شمس وأيلون وجديروت وسوكو وضياعها وتمنة وضياعها وجمزو وضياعها، واستوطنوا فيها،"]]}, {"l": "Act 9:4", "n": "", "vs": [[4, "فوقع إلى الأرض وسمع صوتا يقول له: «شاول! شاول! لماذا تضطهدني؟»"]]}], "kwAr": "ماذا", "noteAr": ""}, {"kw": "O Tyre", "raw": "Amo_1:6-10,Amo_1:12-14; Zec_9:2-8", "note": "", "refs": [{"l": "Amo 1:6-10", "n": "", "vs": [[6, "هذا ما يقوله الرب: من أجل معاصي غزة الثلاث والأربع لن أرد عنها سخطي، لأن أهلها نفوا شعبا عن آخره ليسلموه إلى أدوم."], [7, "لذلك سأرسل نارا على أسوار غزة تلتهم حصونها."], [8, "وأستأصل أهل أشدود، وأهلك حامل صولجان ملك أشقلون، وأوجه ضرباتي ضد عقرون فيفنى من بقي من الفلسطينيين."], [9, "هذا ما يقوله الرب: من أجل معاصي صور الثلاث والأربع لن أرد عنها سخطي، لأن أهلها سلموا شعبا بكامله إلى أدوم، ونقضوا عهد الإخوة."], [10, "لهذا أرسل نارا على أسوار صور فتلتهم حصونها."]]}, {"l": "Amo 1:12-14", "n": "", "vs": [[12, "فأرسل نارا على تيمان، فتلتهم حصون بصرة."], [13, "هذا ما يقوله الرب: من أجل معاصي العمونيين الثلاث والأربع لن أرد عنهم سخطي، لأنهم شقوا بطون الحوامل في جلعاد ليوسعوا تخمهم."], [14, "لهذا أضرم نارا في سور ربة فتلتهم حصونها في معترك جلبة يوم الحرب، وفي وسط عاصفة في يوم الزوبعة."]]}, {"l": "Zec 9:2-8", "n": "", "vs": [[2, "وكذلك قضاء الرب على حماة المتاخمة لدمشق، وعلى صور وصيدون المتصفتين بالحكمة:"], [3, "«قد بنت صور حصنا لنفسها وادخرت الفضة كالتراب والذهب كطين الشوارع."], [4, "ولكن ها الرب يجردها من ممتلكاتها، ويطرح عزتها إلى البحر، وتلتهمها النيران."], [5, "فتشهد مدينة أشقلون هذا فتفزع، وتتلوى غزة ألما. تتوجع عقرون أيضا لأن رجاءها قد تبدد. يهلك ملك غزة وتصبح أشقلون موحشة."], [6, "ويستوطن الزنيم في أشدود، ويستأصل الرب كبرياء الفلسطينيين."], [7, "لا يعودون يأكلون لحما بدمه أو طعاما نجسا ويصبحون هم أيضا بقية ناجية للرب، يصيرون كعشيرة في سبط يهوذا، وتغدو عقرون نظير اليبوسيين."], [8, "ثم أعسكر حول شعبي لأحفظه من غزوات الجيوش في ذهابها وإيابها، فلا يذلهم مستعمر، لأني رأيت الآن بعيني معاناتهم»."]]}], "kwAr": "ياصور", "noteAr": ""}, {"kw": "will ye", "raw": "Eze_25:12-17", "note": "", "refs": [{"l": "Eze 25:12-17", "n": "", "vs": [[12, "وهذا أيضا ما يعلنه السيد الرب: لأن الأدوميين أقدموا على الانتقام من شعب يهوذا، وأساءوا إليه أشد إساءة."], [13, "ها أنا أعاقب الأدوميين وأستأصل من أرضهم الإنسان والحيوان، وأحولها إلى أطلال دارسة من التيمن إلى ددان، إذ يقتل أهلها جميعا بالسيف."], [14, "وأعهد بنقمتي إلى شعبي إسرائيل، فيفعلون بالأدوميين بمقتضى غضبي وسخطي، فيدركون شدة نقمتي، يقول السيد الرب."], [15, "وهذا أيضا ما يعلنه السيد الرب لأن الفلسطينيين قد أقدموا على الانتقام وأفرطوا فيه بكل لؤم قلوبهم، عامدين إلى الخراب بسبب عداوة أبدية،"], [16, "ها أنا أعاقب الفلسطينيين وأستأصل الكريتيين، وأبيد بقية سكان ساحل البحر،"], [17, "وأنفذ فيهم انتقامي العظيم بتأديب مفعم بالسخط، فيدركون أني أنا الرب، إذ أصب نقمتي عليهم»."]]}], "kwAr": "أتجازونني", "noteAr": ""}, {"kw": "swiftly", "raw": "Deu_32:35; Isa_34:8, Isa_59:18; Jer_51:6; Luk_18:7; 2Th_1:6", "note": "", "refs": [{"l": "Deu 32:35", "n": "", "vs": [[35, "لي النقمة وأنا أجازي. وفي الوقت المعين تزل أقدامهم فيوم هلاكهم بات وشيكا، ومصيرهم المحتوم يسرع إليهم،"]]}, {"l": "Isa 34:8", "n": "", "vs": [[8, "لأن للرب يوم انتقام، سنة ثأر لدعوى صهيون،"]]}, {"l": "Isa 59:18", "n": "", "vs": [[18, "فهو يجازيهم بمقتضى أعمالهم. يجازي أعداءه، ويعاقب خصومه، وينزل القصاص بالجزائر،"]]}, {"l": "Jer 51:6", "n": "", "vs": [[6, "اهربوا من وسط بابل، ولينج كل واحد بحياته. لا تبيدوا من جراء إثمها، لأن هذا هو وقت انتقام الرب، وموعد مجازاتها."]]}, {"l": "Luk 18:7", "n": "", "vs": [[7, "أفلا ينصف الله مختاريه الذين يصرخون إليه نهارا وليلا؟ أما يسرع في الاستجابة لهم؟"]]}, {"l": "2Th 1:6", "n": "", "vs": [[6, "فمن العدل عند الله حقا أن يجازي بالضيقة أولئك الذين يضايقونكم،"]]}], "kwAr": "وسريعا", "noteAr": ""}], "arS": [["ماذا", ["H4100"]], [" لديكم ضدي ", []], ["ياصور", ["H6865"]], [" ", []], ["وصيدون", ["H6721"]], [" وسائر ", []], ["أقاليم", ["H1552"]], [" ", []], ["فلسطين", ["H6429"]], ["؟ ", []], ["أتجازونني", ["H7999", "H5921"]], [" على أمر أتيته؟ أم ", []], ["تسعون", ["H1580", "H5921"]], [" لإيذائي؟ إني ", []], ["أنزل", ["H7725"]], [" ", []], ["العقاب", ["H1576"]], [" على ", []], ["رؤوسكم", ["H7218"]], [" ", []], ["بغتة", ["H7031"]], [" ", []], ["وسريعا", ["H4120"]], [".", []]]}, {"c": 3, "v": 5, "text": "لأنكم قد استوليتم على ذهبي وفضتي، ونقلتم نفائسي إلى هياكلكم.", "groups": [{"kw": "ye", "raw": "2Ki_12:18, 2Ki_16:8, 2Ki_18:15, 2Ki_18:16, 2Ki_24:13, 2Ki_25:13-17; Jer_50:28, Jer_51:11; Dan_5:2, Dan_5:3", "note": "", "refs": [{"l": "2Ki 12:18", "n": "", "vs": [[18, "فجمع يهوآش ملك يهوذا كل الأقداس التي خصصها يهوشافاط ويهورام وأخزيا آباؤه ملوك يهوذا، وما خصصه هو من أقداس، وكل الذهب الموجود في خزائن هيكل الرب وقصر الملك، وأرسلها إلى حزائيل ملك أرام. فرجع عن مهاجمة أورشليم."]]}, {"l": "2Ki 16:8", "n": "", "vs": [[8, "وجمع آحاز الفضة والذهب الموجودة في هيكل الرب وفي خزائن قصر الملك، وأرسلها إلى ملك أشور هدية."]]}, {"l": "2Ki 18:15", "n": "", "vs": [[15, "فجمع حزقيا كل ما في بيت الرب وخزائن قصر الملك من فضة وذهب ودفعها له."]]}, {"l": "2Ki 18:16", "n": "", "vs": [[16, "كما قشر الذهب الذي كان قد غشى به أبواب هيكل الرب والدعائم، وبعث به إلى ملك أشور."]]}, {"l": "2Ki 24:13", "n": "", "vs": [[13, "واستولى على جميع ما في خزائن الهيكل وخزائن القصر، وحطم كل آنية الذهب التي صنعها سليمان ملك إسرائيل لهيكل الرب، تماما كما قضى الرب."]]}, {"l": "2Ki 25:13-17", "n": "", "vs": [[13, "وحطم الكلدانيون أعمدة النحاس وبركة النحاس التي في بيت الرب، ونقلوا نحاسها إلى بابل."], [14, "واستولوا أيضا على القدور والرفوش والمقاص والصحون وجميع آنية النحاس التي كانت تستخدم في الهيكل."], [15, "وكذلك المجامر والمناضح. كل ما كان مصنوعا من ذهب أخذه قائد الحرس الملكي كذهب، وما كان مصنوعا من فضة كفضة."], [16, "وكان من العسير وزن النحاس الذي صنع منه سليمان العمودين والبركة الواحدة، والقواعد لهيكل الرب"], [17, "إذ كان ارتفاع العمود يزيد على ثماني عشرة ذراعا (نحو تسعة أمتار)، وقد وضع عليه تاج ارتفاعه ثلاث أذرع (نحو متر ونصف المتر)، تحيط به الشبكة والرمانات النحاسية. وكان العمود الثاني مصنوعا على غرار العمود الأول."]]}, {"l": "Jer 50:28", "n": "", "vs": [[28, "اسمعوا! ها جلبة الفارين الناجين من ديار بابل لكي يذيعوا في صهيون أنباء انتقام الرب إلهنا والثأر لهيكله."]]}, {"l": "Jer 51:11", "n": "", "vs": [[11, "سنوا السهام، وتقلدوا الأتراس، لأن الرب قد أثار روح ملوك الماديين، إذ وطد العزم على إهلاك بابل، لأن هذا هو انتقام الرب، والثأر لهيكله."]]}, {"l": "Dan 5:2", "n": "", "vs": [[2, "وفيما كان يحتسي الخمر أمر بإحضار آنية الذهب والفضة التي استولى عليها أبوه نبوخذناصر من هيكل أورشليم، ليشرب بها مع نبلاء مملكته وزوجاته ومحظياته."]]}, {"l": "Dan 5:3", "n": "", "vs": [[3, "فأحضروها وشرب بها الملك ونبلاء مملكته وزوجاته ومحظياته"]]}], "kwAr": "استوليتم", "noteAr": ""}, {"kw": "into", "raw": "1Sa_5:2-5", "note": "", "refs": [{"l": "1Sa 5:2-5", "n": "", "vs": [[2, "ثم أدخلوه إلى معبد داجون إلههم، ووضعوه إلى جواره."], [3, "وفي صباح اليوم التالي وجد أهل أشدود صنم إلههم داجون مطروحا على وجهه إلى الأرض أمام تابوت الرب، فرفعوه وأقاموه في موضعه."], [4, "وفي صباح اليوم التالي عثروا على صنم داجون مطروحا على وجهه إلى الأرض أمام تابوت الرب، ورأسه ويداه مقطوعة وملقاة على العتبة، ولم يبق منه سوى جسم السمكة."], [5, "لذلك لا يطأ كهنة داجون وسائر الداخلين إلى معبد داجون على عتبة المعبد في أشدود إلَى هذا اليوم."]]}], "kwAr": "إلى هياكلكم", "noteAr": ""}, {"kw": "pleasant", "raw": "Heb. desirable, Dan_11:38", "note": "Heb. desirable, Dan_11:38", "refs": [{"l": "Dan 11:38", "n": "", "vs": [[38, "إنما يكرم إله الحصون بدلا منهم، وهو إله لم يعرفه آباؤه، ويكرمه بالذهب والفضة والحجارة الكريمة والنفائس."]]}], "kwAr": "نفائسي", "noteAr": "بالعبرية: «مشتهى». انظر دا 11: 38"}], "arS": [["لأنكم قد ", []], ["استوليتم", ["H3947"]], [" على ", []], ["ذهبي", ["H3701"]], [" ", []], ["وفضتي", ["H2091"]], ["، ", []], ["ونقلتم", ["H935"]], [" ", []], ["نفائسي", ["H4261"]], [" إلى ", []], ["هياكلكم", ["H1964"]], [".", []]]}, {"c": 3, "v": 6, "text": "وبعتم يهوذا وأبناء أورشليم إلى الأغارقة لتبعدوهم عن تخوم أرضهم.", "groups": [{"kw": "have ye", "raw": "Joe_3:3, Joe_3:8; Deu_28:32, Deu_28:68; Eze_27:13", "note": "", "refs": [{"l": "Joe 3:3", "n": "", "vs": [[3, "وألقوا القرعة على شعبي فقايضوا الزانية بالصبي، وباعوا الصبية لقاء شربة خمر."]]}, {"l": "Joe 3:8", "n": "", "vs": [[8, "وأبيع أبناءكم وبناتكم بأيدي أبناء يهوذا، فيبيعونهم بدورهم إلى السبئيين، إلى أمة بعيدة، لأن الرب قد أصدر قضاءه."]]}, {"l": "Deu 28:32", "n": "", "vs": [[32, "يساق أولادك وبناتك إلى أمة أخرى وعيناك تراقبانهم طوال النهار، حتى تكلا، وما في يدك حيلة."]]}, {"l": "Deu 28:68", "n": "", "vs": [[68, "ويردكم الرب إلى ديار مصر في سفن في طريق وعدكم ألا تعودوا ترونها، فتباعون هناك لأعدائكم عبيدا وإماء، وليس من يشتري»."]]}, {"l": "Eze 27:13", "n": "", "vs": [[13, "تاجرت معك اليونان وتوبال وماشك، فقايضوا بضائعك بالرقيق وآنية النحاس،"]]}], "kwAr": "وبعتم", "noteAr": ""}, {"kw": "Grecians", "raw": "Heb. sons of the Grecians", "note": "Heb. sons of the Grecians", "refs": [], "kwAr": "الأغارقة", "noteAr": "بالعبرية: «بني اليونانيين»."}], "arS": [["وبعتم", ["H4376"]], [" ", []], ["يهوذا", ["H3063"]], [" ", []], ["وأبناء", ["H1121"]], [" ", []], ["أورشليم", ["H3389"]], [" إلى ", []], ["الأغارقة", ["H1121", "H3125"]], [" ", []], ["لتبعدوهم", ["H7368"]], [" عن ", []], ["تخوم", ["H1366"]], [" أرضهم.", []]]}, {"c": 3, "v": 7, "text": "وها أنا الآن أنهضهم من الموضع حيث بعتموهم، وأرد على رؤوسكم سوء أعمالكم.", "groups": [{"kw": "I will", "raw": "Isa_11:12, Isa_43:5, Isa_43:6, Isa_49:12; Jer_23:8, Jer_30:10,Jer_30:16, Jer_31:8, Jer_32:37; Eze_34:12, Eze_34:13, Eze_36:24, Eze_38:8; Zec_10:6-10", "note": "", "refs": [{"l": "Isa 11:12", "n": "", "vs": [[12, "وينصب راية للأمم ويجمع منفيي إسرائيل ومشتتي يهوذا من أربعة أطراف الأرض،"]]}, {"l": "Isa 43:5", "n": "", "vs": [[5, "لا تجزع لأني معك. سألم شتات ذريتك من المشرق، وأجمعك من المغرب."]]}, {"l": "Isa 43:6", "n": "", "vs": [[6, "أقول للشمال: أطلقهم من عقالك، وللجنوب لا تحجزهم. اجمع أبنائي من بعيد وبناتي من أقاصي الأرض،"]]}, {"l": "Isa 49:12", "n": "", "vs": [[12, "انظروا، ها هم يقبلون من ديار بعيدة، هؤلاء من الشمال والغرب، وهؤلاء من أرض سينيم."]]}, {"l": "Jer 23:8", "n": "", "vs": [[8, "بل يقولون: حي هو الرب الذي أخرج ذرية شعب إسرائيل، وأتى بهم من أرض الشمال ومن كافة الديار التي أجلاهم إليها، فيسكنون في أرضهم»."]]}, {"l": "Jer 30:10", "n": "", "vs": [[10, "فلا تفزع يا(نسل) عبدي يعقوب، ولا تجزع ياإسرائيل، فإني أخلصك من الغربة، وأنقذ ذريتك من أرض سبيهم، فيرجع نسل إسرائيل ويطمئن ويستريح من غير أن يضايقه أحد."]]}, {"l": "Jer 30:16", "n": "", "vs": [[16, "ولكن سيأتي يوم يفترس فيه جميع مفترسيك ويذهب جميع مضايقيك إلى السبي، ويصبح ناهبوك منهوبين،"]]}, {"l": "Jer 31:8", "n": "", "vs": [[8, "ها أنا آتي بهم من بلاد الشمال، وأجمعهم من أقصى أطراف الأرض، وفيهم الأعمى والأعرج، الحبلى والماخض، فيرجع حشد عظيم إلى هنا."]]}, {"l": "Jer 32:37", "n": "", "vs": [[37, "ها أنا أعود فأجمعهم من جميع البلدان التي شتتهم إليها في غضبي وغيظي وسخطي الشديد، وأردهم إلى هذا الموضع وأسكنهم آمنين،"]]}, {"l": "Eze 34:12", "n": "", "vs": [[12, "وكما يتفقد الراعي قطيعه في اليوم الذي يكون فيه بين غنمه المشتتة، هكذا أتفقد قطيعي وأخلصه من كل الأماكن التي تفرق إليها في يوم غائم كئيب."]]}, {"l": "Eze 34:13", "n": "", "vs": [[13, "وأخرجه من بين الشعوب وأجمعه من البلدان، وأرده إلى أرضه، حيث أرعاه على جبال إسرائيل وفي الأودية وفي جميع أماكن الأرض الآهلة."]]}, {"l": "Eze 36:24", "n": "", "vs": [[24, "إذ آخذكم من بين الأمم وأجمعكم من كل البلدان وأحضركم إلى أرضكم،"]]}, {"l": "Eze 38:8", "n": "", "vs": [[8, "إذ بعد أيام كثيرة تستدعى للقتال، فتقبل في السنين الأخيرة إلى الأرض الناجية من السيف التي تم جمع أهلها من بين شعوب كثيرة، فأقاموا مطمئنين على جبال إسرائيل التي كانت دائما مقفرة في نظر الذين لم شتاتهم من بين الأمم،"]]}, {"l": "Zec 10:6-10", "n": "", "vs": [[6, "إني أشدد شعب يهوذا وأخلص ذرية يوسف وأردهم إلى أرضهم لأني أكن لهم الرحمة، فيكونون كأني لم أنبذهم لأني أنا الرب إلههم فأستجيبهم."], [7, "ويصبح شعب إسرائيل كجبابرة الحرب، وتنتشي قلوبهم كمن شرب خمرة، ويشهد أبناؤهم هذا ويفرحون، وتبتهج نفوسهم بالرب."], [8, "أصدر إشارتي لهم فأجمع شتاتهم، لأني افتديتهم، ويكثرون كما في الحقب الأولى."], [9, "مع أني بددتهم بين الأمم، فإنهم يظلون يذكرونني في المنافي البعيدة، ويحيون مع أولادهم ويرجعون."], [10, "سأردهم إلى موطنهم من ديار مصر، وأجمع شتاتهم من أشور، وآتي بهم إلى أرض جلعاد ولبنان حتى لا يبقى متسع لهم بعد."]]}], "kwAr": "أنهضهم", "noteAr": ""}, {"kw": "and will", "raw": "Joe_3:4; Jdg_1:7; 1Sa_15:33; Est_7:10; Mat_7:2; 2Th_1:6; Jam_2:13; Rev_13:10; Rev_16:6, Rev_19:2", "note": "", "refs": [{"l": "Joe 3:4", "n": "", "vs": [[4, "ماذا لديكم ضدي ياصور وصيدون وسائر أقاليم فلسطين؟ أتجازونني على أمر أتيته؟ أم تسعون لإيذائي؟ إني أنزل العقاب على رؤوسكم بغتة وسريعا."]]}, {"l": "Jdg 1:7", "n": "", "vs": [[7, "فقال أدوني بازق: «لقد قطعت أباهم أيدي وأرجل سبعين ملكا كانوا يلتقطون الفتات تحت مائدتي، فها الرب قد جازاني بمثل ما فعلت». وأتوا به إلى أورشليم حيث مات."]]}, {"l": "1Sa 15:33", "n": "", "vs": [[33, "وقال له صموئيل: «كما أثكل سيفك النساء لتثكل كذلك أمك بين النساء». وقطع صموئيل أجاج إربا أمام الرب في الجلجال."]]}, {"l": "Est 7:10", "n": "", "vs": [[10, "فصلبوا هامان على الخشبة التي أعدها لمردخاي. ثم هدأت سورة غضب الملك."]]}, {"l": "Mat 7:2", "n": "", "vs": [[2, "فإنكم بالدينونة التي بها تدينون تدانون؛ وبالكيل الذي به تكيلون يكال لكم."]]}, {"l": "2Th 1:6", "n": "", "vs": [[6, "فمن العدل عند الله حقا أن يجازي بالضيقة أولئك الذين يضايقونكم،"]]}, {"l": "Jam 2:13", "n": "", "vs": [[13, "فلابد أن يكون الحكم على الذين لا يمارسون الرحمة، حكما خاليا من الرحمة، أما الرحمة فهي تتفوق على الحكم!"]]}, {"l": "Rev 13:10", "n": "", "vs": [[10, "من ساق غيره إلى السبي، فإلى السبي سيساق؛ ومن قتل بالسيف، فبالسيف سيقتل! هنا يظهر صبر القديسين وإيمانهم."]]}, {"l": "Rev 16:6", "n": "", "vs": [[6, "فقد سفك الناس دم قديسين وأنبياء، وها أنت تسقي قاتليهم دما! إنهم ينالون ما يستحقون!»"]]}, {"l": "Rev 19:2", "n": "", "vs": [[2, "فإن أحكامه حق وعدل، لأنه عاقب الزانية الكبرى التي أفسدت الأرض، وانتقم لدم عبيده منها»."]]}], "kwAr": "وأرد", "noteAr": ""}], "arS": [["وها أنا الآن ", []], ["أنهضهم", ["H5782"]], [" من ", []], ["الموضع", ["H4725"]], [" حيث ", []], ["بعتموهم", ["H4376"]], ["، ", []], ["وأرد", ["H7725"]], [" على ", []], ["رؤوسكم", ["H7218"]], [" سوء أعمالكم.", []]]}, {"c": 3, "v": 8, "text": "وأبيع أبناءكم وبناتكم بأيدي أبناء يهوذا، فيبيعونهم بدورهم إلى السبئيين، إلى أمة بعيدة، لأن الرب قد أصدر قضاءه.", "groups": [{"kw": "I will", "raw": "Deu_32:30; Jdg_2:14, Jdg_4:2, Jdg_4:9", "note": "", "refs": [{"l": "Deu 32:30", "n": "", "vs": [[30, "إذ كيف يدحر واحد ألفا، ويهزم اثنان من أعدائهم عشرة آلاف منهم، لولا أن صخرهم قد هجرهم والرب قد سلمهم؟"]]}, {"l": "Jdg 2:14", "n": "", "vs": [[14, "فاحتدم غضب الرب على إسرائيل وتركهم تحت رحمة الناهبين الغزاة. وأسلمهم إلى أعدائهم المحيطين بهم فعجزوا عن مقاومتهم."]]}, {"l": "Jdg 4:2", "n": "", "vs": [[2, "فأخضعهم الرب ليابين ملك كنعان المقيم في حاصور. وكان سيسرا رئيس جيشه قاطنا في حروشة الأمم."]]}, {"l": "Jdg 4:9", "n": "", "vs": [[9, "فأجابت: «أذهب معك، غير أنه لن يكون لك فخر في الطريق التي أنت ماض فيها، لأن الرب يسلم سيسرا لامرأة». فنهضت دبورة ورافقت باراق إلى قادش."]]}], "kwAr": "وأبيع", "noteAr": ""}, {"kw": "your sons", "raw": "Isa_14:1, Isa_14:2, Isa_60:14", "note": "", "refs": [{"l" _3:8; Zec_14:2, Zec_14:3; Rev_16:14-16, Rev_19:19, Rev_19:20; Rev_20:8, Rev_20:9", "note": "", "refs": [{"l": "Joe 3:2", "n": "", "vs": [[2, "أجمع الأمم كلها وأحضرهم إلى وادي يهوشافاط، وأحاكمهم هناك من أجل شعبي وميراثي إسرائيل، لأنهم شتتوهم بين الشعوب واقتسموا أرضي."]]}, {"l": "Eze 38:9-18", "n": "", "vs": [[9, "فتأتي مندفعا كزوبعة، وتكون كسحابة تغطي الأرض أنت وجيوشك وكل من معك من شعوب كثيرة."], [10, "ويحدث في ذلك اليوم أن أفكار سوء تراودك"], [11, "فتقول: أزحف على أرض عراء مكشوفة وأهاجم المطمئنين الساكنين في أمن، المقيمين كلهم من غير سور يقيهم، وليس لديهم مزاليج ولا مصاريع،"], [12, "للاستيلاء على الأسلاب ونهب الغنائم ومهاجمة الخرائب التي أصبحت آهلة، ولمحاربة الشعب المجتمع من بين الأمم، المقتني ماشية وأملاكا، المستوطن في مركز الأرض."], [13, "ويسألك أهل شبا ورودس وتجار ترشيش وكل قراها؛ أقادم أنت للاستيلاء على الأسلاب؟ هل حشدت جيوشك لنهب الغنائم ولحمل الفضة والذهب وأخذ الماشية والمقتنيات وللسلب العظيم؟"], [14, "لذلك تنبأ ياابن آدم، وقل لجوج هذا ما يعلنه السيد الرب: في ذلك اليوم عندما يسكن شعبي إسرائيل آمنا، ألا تعلم ذلك؟"], [15, "وتقبل أنت من مقرك في أقاصي الشمال مع جيوش غفيرة، تغشي الأرض؛ كلهم راكبو خيل وجمع عظيم وجيش كثير."], [16, "وتزحف على شعبي إسرائيل كسحابة تغطي الأرض، أني في الأيام الأخيرة آتي بك إلى أرضي لكي تعرفني الشعوب عندما تتجلى قداستي حين أدمرك ياجوج أمام عيونهم.هذا ما يقوله السيد الرب:"], [17, "ألست أنت الذي تحدثت عنه في الأيام الغابرة على ألسنة عبيدي أنبياء إسرائيل الذين تنبأوا في تلك الأيام لسنين كثيرة بأني سآتي بك عليهم؟"], [18, "ويقول السيد الرب: في ذلك اليوم عندما يزحف جوج على أرض إسرائيل يحتدم غضبي في وجهي."]]}, {"l": "Mic 4:12", "n": "", "vs": [[12, "لكنهم لم يعرفوا نوايا الرب، ولم يفهموا مقاصده، فإنه قد جمعهم كأكداس إلى البيدر ليعاقبهم."]]}, {"l": "Zep 3:8", "n": "", "vs": [[8, "لذلك يقول الرب: انتظروني لأني عزمت في اليوم الذي أقوم فيه كشاهد أن أجمع الأمم وأحشد الممالك لأسكب عليهم سخطي واحتدام غضبي، لأن الأرض بكاملها ستؤكل بنار غيرة غيظي."]]}, {"l": "Zec 14:2", "n": "", "vs": [[2, "لأني أجمع جميع الأمم على أورشليم لتحاربها، فتؤخذ المدينة وتنهب البيوت وتغتصب النساء ويسبى نصف أهلها إلى المنفى. إنما لا ينقرض بقية الشعب من المدينة."]]}, {"l": "Zec 14:3", "n": "", "vs": [[3, "ولا يلبث أن يهب الرب ليحارب تلك الأمم، كما كان يحارب في يوم القتال."]]}, {"l": "Rev 16:14-16", "n": "", "vs": [[14, "وهي أرواح شيطانية قادرة على صنع المعجزات، تذهب إلى ملوك الأرض جميعا وتجمعهم للحرب في ذلك اليوم العظيم، يوم الله القادر على كل شيء."], [15, "»ها أنا آت كما يأتي اللص، طوبى لمن يكون بانتظاري، ساهرا وحارسا لثيابه، لئلا يمشي عريانا فيرى الناس عورته!«"], [16, "وجمعت الأرواح الشيطانية جيوش العالم كلها في مكان يسمى بالعبرية «هرمجدون»."]]}, {"l": "Rev 19:19", "n": "", "vs": [[19, "ورأيت الوحش وملوك الأرض وجيوشهم وقد احتشدوا ليحاربوا هذا الفارس وجيشه."]]}, {"l": "Rev 19:20", "n": "", "vs": [[20, "فقبض على الوحش وعلى النبي الدجال الذي قام بالمعجزات في حضور الوحش وأضل بها الذين قبلوا علامة الوحش، وسجدوا لتمثاله. وطرح كلاهما حيا في بحيرة النار والكبريت المتقدة،"]]}, {"l": "Rev 20:8", "n": "", "vs": [[8, "فيخرج ليضلل الأمم في زوايا الأرض الأربع، جوج وماجوج، ويجمعهم للقتال، وعددهم كثير جدا كرمل البحر!"]]}, {"l": "Rev 20:9", "n": "", "vs": [[9, "فيصعدون على سهول الأرض العريضة، ويحاصرون من كل جانب معسكر القديسين والمدينة المحبوبة، ولكن نارا من السماء تنزل عليهم وتلتهمهم."]]}], "kwAr": "أسرعوا", "noteAr": ""}, {"kw": "cause", "raw": "etc. or, the Lord shall bring down thy mighty ones, mighty. Psa_103:20; Isa_10:34, Isa_13:3, Isa_37:36; 2Th_1:7; Rev_19:14", "note": "etc. or, the Lord shall bring down thy mighty ones, mighty. Psa_103:20; Isa_10:34, Isa_13:3, Isa_37:36; 2Th_1:7; Rev_19:14", "refs": [{"l": "Psa 103:20", "n": "", "vs": [[20, "باركوا الرب ياملائكته المقتدرين قوة، الفاعلين أمره فور صدور كلمته."]]}, {"l": "Isa 10:34", "n": "", "vs": [[34, "تستأصل أجمات الغابة بفأس، ويسقط لبنان أمام جبار مهوب."]]}, {"l": "Isa 13:3", "n": "", "vs": [[3, "إني أمرت مقدسي واستدعيت جبابرتي المفتخرين بعظمتي لينفذوا عقاب غضبي."]]}, {"l": "Isa 37:36", "n": "", "vs": [[36, "وحدث في تلك الليلة أن ملاك الرب قتل مئة وخمسة وثمانين ألفا من جيش الأشوريين، وما إن طلع
