<script>window.CATALOG=[{"id": 17, "abbr": "Est", "en": "Esther", "nc": 10, "nv": 167, "refs": 1266, "last": "10:3", "first": "وحدث في أيام أحشويروش، الذي امتد حكمه من الهند إلى كوش، فملك على مئة وسبعة وعشرين إقليما،"}, {"id": 18, "abbr": "Job", "en": "Job", "nc": 42, "nv": 1070, "refs": 10209, "last": "42:17", "first": "عاش في أرض عوص رجل اسمه أيوب، كان صالحا كاملا يتقي الله ويحيد عن الشر."}, {"id": 19, "abbr": "Psa", "en": "Psalms", "nc": 150, "nv": 2461, "refs": 33395, "last": "150:6", "first": "طوبى للإنسان الذي لا يتبع مشورة الأشرار، ولا يقف في طريق الخاطئين، ولا يجالس المستهزئين."}, {"id": 20, "abbr": "Pro", "en": "Proverbs", "nc": 31, "nv": 915, "refs": 10457, "last": "31:31", "first": "هذه هي أمثال سليمان بن داود ملك إسرائيل،"}, {"id": 21, "abbr": "Ecc", "en": "Ecclesiastes", "nc": 12, "nv": 222, "refs": 3186, "last": "12:14", "first": "هذه أقوال الجامعة ابن داود ملك أورشليم."}, {"id": 22, "abbr": "Son", "en": "Song of Solomon", "nc": 8, "nv": 117, "refs": 1802, "last": "8:14", "first": "هذا نشيد الأناشيد لسليمان."}, {"id": 23, "abbr": "Isa", "en": "Isaiah", "nc": 66, "nv": 1292, "refs": 21959, "last": "66:24", "first": "هذه هي رؤيا إشعياء بن آموص، التي أعلنت له بشأن يهوذا وأورشليم في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا."}, {"id": 24, "abbr": "Jer", "en": "Jeremiah", "nc": 52, "nv": 1364, "refs": 20659, "last": "52:34", "first": "هذه نبوءة إرميا بن حلقيا أحد الكهنة المقيمين في عناثوث بأرض سبط بنيامين."}, {"id": 25, "abbr": "Lam", "en": "Lamentations", "nc": 5, "nv": 154, "refs": 2238, "last": "5:22", "first": "كيف أصبحت المدينة الآهلة بالسكان مهجورة وحيدة؟ صارت كأرملة! هذه التي كانت عظيمة بين الأمم. السيدة بين المدن صارت تحت الجزية!"}, {"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 48, "nv": 1273, "refs": 15264, "last": "48:35", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 29, "abbr": "Joe", "en": "Joel", "verses": [{"c": 1, "v": 1, "text": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:", "groups": [{"kw": "word", "raw": "Jer_1:2; Eze_1:3; Hos_1:1; 2Pe_1:21", "note": "", "refs": [{"l": "Jer 1:2", "n": "", "vs": [[2, "وقد أعلن الرب له هذه النبوءة في عهد يوشيا بن آمون ملك يهوذا، في السنة الثالثة عشرة من ملكه."]]}, {"l": "Eze 1:3", "n": "", "vs": [[3, "أوحى الرب إلى حزقيال الكاهن ابن بوزي عند جوار نهر خابور، في ديار الكلدانيين، إذ كانت علي يد الرب،"]]}, {"l": "Hos 1:1", "n": "", "vs": [[1, "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."]]}, {"l": "2Pe 1:21", "n": "", "vs": [[21, "إذ لم تأت نبوءة قط بإرادة بشرية، بل تكلم بالنبوآت جميعا رجال الله غالقديسونف مدفوعين بوحي الروح القدس."]]}], "kwAr": "أوحى", "noteAr": ""}, {"kw": "to", "raw": "Act_2:16", "note": "", "refs": [{"l": "Act 2:16", "n": "", "vs": [[16, "ولكن هذا ما قيل بلسان النبي يوئيل:"]]}], "kwAr": "إلى", "noteAr": ""}], "arS": [["هذا ما ", []], ["أوحى", ["H1697"]], [" به ", []], ["الرب", ["H3068"]], [" ", []], ["إلى", ["H413"]], [" ", []], ["يوئيل", ["H3100"]], [" ", []], ["بن", ["H1121"]], [" ", []], ["فثوئيل", ["H6602"]], [":", []]]}, {"c": 1, "v": 2, "text": "اسمعوا هذا أيها الشيوخ، وأصغوا ياجميع أهل الأرض، هل جرى مثل هذا في أيامكم أو في أيام آبائكم؟", "groups": [{"kw": "Hear", "raw": "Psa_49:1; Isa_34:1; Jer_5:21; Hos_5:1; Amo_3:1, Amo_4:1, Amo_5:1; Mic_1:2; Mic_3:1, Mic_3:9; Mat_13:9; Rev_2:7", "note": "", "refs": [{"l": "Psa 49:1", "n": "", "vs": [[1, "اسمعوا هذا ياجميع الشعوب، أصغوا ياجميع سكان العالم."]]}, {"l": "Isa 34:1", "n": "", "vs": [[1, "اقتربوا أيها الأمم للاستماع، اصغوا أيها الشعوب. لتسمع الأرض وملؤها، المسكونة وكل ما يخرج منها،"]]}, {"l": "Jer 5:21", "n": "", "vs": [[21, "اسمع هذا أيها الشعب الأحمق الغبي، يامن له عيون ولكنه لا يبصر، وله آذان ولكنه لا يسمع."]]}, {"l": "Hos 5:1", "n": "", "vs": [[1, "اسمعوا هذا أيها الكهنة وأنصتوا ياشعب إسرائيل، وأصغوا ياأهل بيت الملك، لأن القضاء حال بكم إذ كنتم فخا في المصفاة وشبكة منصوبة على جبل تابور."]]}, {"l": "Amo 3:1", "n": "", "vs": [[1, "اسمعوا يابني إسرائيل هذه الكلمة التي قضى بها الرب عليكم، بل على كل القبيلة التي أخرجتها من ديار مصر:"]]}, {"l": "Amo 4:1", "n": "", "vs": [[1, "اسمعي هذه الكلمة يانساء باشان، اللواتي يقمن في جبل السامرة، ممن يظلمن المسكين ويسحقن الفقراء واللواتي يقلن لأزواجهن: هاتوا مسكرا لنشرب."]]}, {"l": "Amo 5:1", "n": "", "vs": [[1, "اسمعوا هذه المرثية التي أرثيكم بها يابني إسرائيل."]]}, {"l": "Mic 1:2", "n": "", "vs": [[2, "اسمعوا ياجميع الشعوب، وأصغي أيتها الأرض وكل من فيها، وليكن السيد الرب من هيكله المقدس شاهدا عليكم."]]}, {"l": "Mic 3:1", "n": "", "vs": [[1, "وقلت اسمعوا يارؤساء يعقوب وياقضاة شعب إسرائيل: ألا ينبغي لكم أن تعرفوا الحق؟"]]}, {"l": "Mic 3:9", "n": "", "vs": [[9, "استمعوا هذا يارؤساء بيت يعقوب وقضاة شعب إسرائيل الذين يكرهون العدل ويحرفون الحق."]]}, {"l": "Mat 13:9", "n": "", "vs": [[9, "من له أذنان فليسمع! »"]]}, {"l": "Rev 2:7", "n": "", "vs": [[7, "من له أذنان فليسمع ما يقوله الروح للكنائس! كل من ينتصر سأطعمه من ثمر شجرة الحياة في فردوس الله."]]}], "kwAr": "اسمعوا", "noteAr": ""}, {"kw": "ye old", "raw": "Job_8:8, Job_12:12, Job_15:10, Job_21:7", "note": "", "refs": [{"l": "Job 8:8", "n": "", "vs": [[8, "اسأل الأجيال الغابرة، وتأمل ما اختبره الآباء،"]]}, {"l": "Job 12:12", "n": "", "vs": [[12, "الحكمة تلازم الشيخوخة، وفي طول الأيام فهم."]]}, {"l": "Job 15:10", "n": "", "vs": [[10, "رب شيخ وأشيب بيننا أكبر سنا من أبيك."]]}, {"l": "Job 21:7", "n": "", "vs": [[7, "لماذا يحيا الأشرار ويطعنون في السن ويزدادون قوة؟"]]}], "kwAr": "أيها الشيوخ", "noteAr": ""}, {"kw": "Hath", "raw": "Joe_2:2; Deu_4:32-35; Isa_7:17; Jer_30:7; Dan_12:1; Mat_24:21", "note": "", "refs": [{"l": "Joe 2:2", "n": "", "vs": [[2, "هو يوم ظلمة وتجهم، يوم غيوم مكفهرة وقتام دامس،فيه تزحف أمة قوية وعظيمة كما يزحف الظلام على الجبال، أمة لم يكن لها شبيه في سالف الزمان، ولن يكون لها نظير من بعدها عبر سني الأجيال."]]}, {"l": "Deu 4:32-35", "n": "", "vs": [[32, "فاسألوا عن الأيام الغابرة التي انقضت قبلكم، منذ اليوم الذي خلق الله فيه الإنسان على الأرض. اسأل من أقصى السموات إلى أقصاها: هل حدث قط مثل هذا الأمر العظيم؟ وهل سمع أحد بمثله؟"], [33, "هل سمعت أمة صوت الله يتكلم من وسط النار كما سمعتم أنتم، وعاشت؟"], [34, "وهل حاول إله قط أن يأخذ لنفسه شعبا من وسط شعب آخر مجريا تجارب وآيات ومعجزات وحروبا وقدرة فائقة وقوة شديدة ومخاوف عظيمة كما صنع معكم الرب إلهكم في مصر على مرأى منكم؟"], [35, "لقد اطلعتم على هذه كلها لتعلموا أن الرب هو الإله، وليس آخر سواه."]]}, {"l": "Isa 7:17", "n": "", "vs": [[17, "وسيجلب الرب عليك وعلى شعبك وعلى بيت أبيك أياما لم تمر بكم منذ انفصال أفرايم عن يهوذا، وذلك على يد ملك أشور."]]}, {"l": "Jer 30:7", "n": "", "vs": [[7, "ما أرهب ذلك اليوم إذ لا مثيل له! هو زمن ضيق على ذرية يعقوب، ولكنها ستنجو منه."]]}, {"l": "Dan 12:1", "n": "", "vs": [[1, "«وفي ذلك الوقت يقوم الرئيس العظيم الملاك ميخائيل حارس شعبك، وذلك في أثناء ضيق لم يكن له مثيل منذ أن وجدت أمة حتى ذلك الزمان. غير أن كل من كان اسمه مدونا في الكتاب من شعبك ينجو في ذلك الزمان."]]}, {"l": "Mat 24:21", "n": "", "vs": [[21, "فسوف تحدث عندئذ ضيقة عظيمة لم يحدث مثلها منذ بدء العالم إلى الآن، ولن يحدث."]]}], "kwAr": "هل جرى", "noteAr": ""}], "arS": [["اسمعوا", ["H8085"]], [" ", []], ["هذا", ["H2063"]], [" أيها ", []], ["الشيوخ", ["H2205"]], ["، ", []], ["وأصغوا", ["H238"]], [" ", []], ["ياجميع", ["H3605"]], [" ", []], ["أهل", ["H3427"]], [" ", []], ["الأرض", ["H776"]], ["، هل ", []], ["جرى", ["H1961"]], [" مثل هذا في ", []], ["أيامكم", ["H3117"]], [" أو في ", []], ["أيام", ["H3117"]], [" ", []], ["آبائكم", ["H1"]], ["؟", []]]}, {"c": 1, "v": 3, "text": "أخبروا بهذا أبناءكم، وليخبر أبناؤكم أبناءهم لينقلوه إلى الأجيال القادمة.", "groups": [{"kw": "", "raw": "Exo_10:1, Exo_10:2, Exo_13:14; Deu_6:7; Jos_4:6, Jos_4:7, Jos_4:21, Jos_4:22; Psa_44:1, Psa_71:18, Psa_78:3-8; Psa_145:4; Isa_38:19", "note": "", "refs": [{"l": "Exo 10:1", "n": "", "vs": [[1, "وقال الرب لموسى: «امثل أمام فرعون لأنني قد قسيت قلبه وقلوب حاشيته لكي أجري آياتي هذه بينهم."]]}, {"l": "Exo 10:2", "n": "", "vs": [[2, "لكي تخبر في مسامع بنيك وأحفادك عما ابتليت به المصريين وبآياتي التي أجريتها بينهم فتعلمون أني أنا الرب»."]]}, {"l": "Exo 13:14", "n": "", "vs": [[14, "وحين يسألك ابنك في الأيام المقبلة: ما معنى هذا؟ تجيبه: إنه بيد قديرة أخرجنا الرب من ديار العبودية."]]}, {"l": "Deu 6:7", "n": "", "vs": [[7, "وقصوها على أولادكم، وتحدثوا بها حين تجلسون في بيوتكم، وحين تسيرون في الطريق، وحين تنامون، وحين تنهضون."]]}, {"l": "Jos 4:6", "n": "", "vs": [[6, "فتكون هذه الحجارة، بعد نصبها، علامة في وسطكم، حتى إذا سألكم أبناؤكم في الأيام المقبلة: ماذا تعني لكم هذه الحجارة؟"]]}, {"l": "Jos 4:7", "n": "", "vs": [[7, "تجيبونهم: إن مياه الأردن توقفت عن الجريان، وانفلقت عند عبور تابوت عهد الرب النهر. وهكذا تصبح هذه الحجارة نصبا تذكاريا لبني إسرائيل مدى الدهر»."]]}, {"l": "Jos 4:21", "n": "", "vs": [[21, "وقال لبني إسرائيل: «إذا سأل بنوكم آباءهم في الأجيال المقبلة: ما هذه الحجارة؟"]]}, {"l": "Jos 4:22", "n": "", "vs": [[22, "يجيبونهم: إن الإسرائيليين قد عبروا نهر الأردن فوق أرض يابسة."]]}, {"l": "Psa 44:1", "n": "", "vs": [[1, "ياالله ، بآذاننا قد سمعنا، وآباؤنا أخبرونا بما عملته في أيامهم القديمة."]]}, {"l": "Psa 71:18", "n": "", "vs": [[18, "لا تتركني في الشيخوخة والشيب ياالله ، حتى أخبر هذا الجيل بأعمال قدرتك، وبقوتك (الجيل) الآتي."]]}, {"l": "Psa 78:3-8", "n": "", "vs": [[3, "سمعناها وعرفناها وحدثنا بها آباؤنا."], [4, "لا نكتمها عن أبنائنا بل نخبر الجيل القادم: عن قوة الرب وعجائبه التي صنع."], [5, "فإنه أعطى شرائع لبني إسرائيل وأوامر لذرية يعقوب، أوصى فيها آباءنا أن يعرفوا بها أبناءهم."], [6, "لكي يعرفها الجيل القادم، البنون الذين لم يولدوا بعد، فيعلموها أيضا لأعقابهم."], [7, "فيضعون على الله اتكالهم ولا ينسون أعماله، بل يحفظون وصاياه."], [8, "ولا يكونون مثل آبائهم، جيلا عنيدا متمردا، جيلا لم يثبت قلبه ولا كانت روحه أمينة لله."]]}, {"l": "Psa 145:4", "n": "", "vs": [[4, "يمدح أعمالك جيل ماض لجيل آت، معلنين أفعالك المقتدرة."]]}, {"l": "Isa 38:19", "n": "", "vs": [[19, "الأحياء وحدهم يسبحونك كما أفعل اليوم، ويحدث الآباء أبناءهم عن أمانتك"]]}], "kwAr": "", "noteAr": ""}], "arS": [["أخبروا", ["H5608"]], [" بهذا ", []], ["أبناءكم", ["H1121"]], ["، ", []], ["وليخبر", ["H5608"]], [" ", []], ["أبناؤكم", ["H1121"]], [" ", []], ["أبناءهم", ["H1121"]], [" لينقلوه إلى ", []], ["الأجيال", ["H1755"]], [" ", []], ["القادمة", ["H312"]], [".", []]]}, {"c": 1, "v": 4, "text": "إن ما تخلف من محصولكم عن هجمات الزحاف التهمته أسراب الجراد، وما تفضل عن أسراب الجراد أكلته الجنادب؛ وما بقي عن الجنادب قضى عليه الطيار.", "groups": [{"kw": "That which the palmerworm hath left", "raw": "Heb. The residue of the palmer-worm, Joe_2:25; Amo_4:9; The learned Bochart, and others, are of the opinion that the four Hebrew words, gazam, yelek, arbeh, chasil, respectively rendered the palmer-worm, locust, canker-worm and caterpillar, denote four different species of locusts. See note on Exo_10:4", "note": "Heb. The residue of the palmer-worm, Joe_2:25; Amo_4:9; The learned Bochart, and others, are of the opinion that the four Hebrew words, gazam, yelek, arbeh, chasil, respectively rendered the palmer-worm, locust, canker-worm and caterpillar, denote four different species of locusts. See note on Exo_10:4", "refs": [{"l": "Joe 2:25", "n": "", "vs": [[25, "وأعوضكم عن محاصيل السنين التي التهمها الجراد والجندب والطيار والقمص، جيشي العظيم الذي أطلقته عليكم."]]}, {"l": "Amo 4:9", "n": "", "vs": [[9, "أرسلت الرياح اللافحة واليرقان لتجفف محاصيلكم، والتهم الجراد حدائقكم وكرومكم وأشجار تينكم وزيتونكم. وما رجعتم إلي!"]]}, {"l": "Exo 10:4", "n": "", "vs": [[4, "وإذا أبيت أن تطلق سراح شعبي، فها أنا أجلب غدا الجراد على تخومك،"]]}], "kwAr": "ما تخلف من محصولكم عن هجمات الزحاف", "noteAr": "بالعبرية: «بقية الزحاف». انظر يوء 2: 25؛ عا 4: 9. يرى العالم بوشارت وغيره أن الكلمات العبرية الأربع (جازام، ياليك، أربيه، حاسيل) المترجمة على التوالي بالزحاف والجراد والجندب والطيار تدل على أربعة أنواع مختلفة من الجراد. انظر الملاحظة على خر 10: 4."}, {"kw": "the locust eaten", "raw": "Exo_10:12-15; Deu_28:38, Deu_28:42; 1Ki_8:37; 2Ch_6:28, 2Ch_7:13; Psa_78:46, Psa_105:34; Amo_7:1; Rev_9:3-7", "note": "", "refs": [{"l": "Exo 10:12-15", "n": "", "vs": [[12, "فقال الرب لموسى: «أبسط يدك على أرض مصر لتبتلى بالجراد، فيغطي بلاد مصر ويلتهم كل نبات الأرض المتخلف عن البرد»."], [13, "فمد موسى عصاه على أرض مصر، فأرسل الرب عليهم ريحا شرقية طوال ذلك النهار والليل، وما إن أقبل الصباح حتى حملت الريح الشرقية الجراد."], [14, "فانتشر الجراد في كل بلاد مصر، وحل في جميع تخومها بأسراب عظيمة، فلم يكن له نظير من قبل ولن يحدث مثله في ما بعد."], [15, "فقد غطى وجه كل الأرض حتى أظلمت، والتهم كل عشب فيها وكل أثمار الأشجار التي خلفها البرد، فلم يبق شيء أخضر لا على الأشجار ولا في حقول المزروعات في كل أرجاء مصر."]]}, {"l": "Deu 28:38", "n": "", "vs": [[38, "تبذرون كثيرا من البذار في الحقول، ولا تحصدون إلا القليل، لأن الجراد يلتهمه."]]}, {"l": "Deu 28:42", "n": "", "vs": [[42, "تلتهم أسراب الجراد أشجاركم وغلات أرضكم."]]}, {"l": "1Ki 8:37", "n": "", "vs": [[37, "وإن أصابت الأرض مجاعة، أو تفشى فيها وبأ، أو اعترتها آفات زراعية، أو جفاف، أو غزاها الجراد والجندب، أو إذا حاصر الشعب عدو في أية مدينة من مدنه، أو حلت به كارثة أو مرض،"]]}, {"l": "2Ch 6:28", "n": "", "vs": [[28, "وإن أصابت الأرض مجاعة، أو تفشى فيها وبأ، أو اعترتها آفات زراعية أو جفاف، أو غزاها الجراد والجندب، أو إذا حاصر الشعب عدو في مدينة من مدنه، أو حلت به كارثة أو مرض،"]]}, {"l": "2Ch 7:13", "n": "", "vs": [[13, "فإن أغلقت السماء فانحبس المطر، وإن أمرت الجراد أن يلتهم عشب الأرض، وإن جعلت الوبأ يتفشى بين شعبي،"]]}, {"l": "Psa 78:46", "n": "", "vs": [[46, "أسلم غلتهم لليسارع ومحاصيلهم للجراد ليدمرها."]]}, {"l": "Psa 105:34", "n": "", "vs": [[34, "أمر، فتوافد الجراد الطيار والزحاف بأعداد لا تحصى،"]]}, {"l": "Amo 7:1", "n": "", "vs": [[1, "وهذا ما أراني السيد الرب: ها هو يعد أسراب جراد في بدء نمو الأعشاب المتأخرة بعد أن تم جز نصيب الملك منها."]]}, {"l": "Rev 9:3-7", "n": "", "vs": [[3, "وطلع من الدخان جراد على الأرض، وأعطي سلطة أن يلسع كالعقارب،"], [4, "وأمر ألا يضر عشب الأرض ولا مزروعاتها ولا أشجارها بل فقط جميع من ليس على جباههم ختم الله،"], [5, "فيعذبهم دون أن يقتلهم، مدة خمسة أشهر. والألم الذي يسببه يشبه ألم لدغة العقرب."], [6, "وفي أثناء تلك الشهور يحاول الناس أن يتخلصوا من حياتهم فلا يقدرون! ويتمنون أن يموتوا، لكن الموت يهرب منهم."], [7, "ويبدو هذا الجراد كأنه خيل مجهزة للقتال، على رؤوسه ما يشبه أكاليل الذهب، ووجوهه كوجوه البشر،"]]}], "kwAr": "التهمته أسراب الجراد", "noteAr": ""}, {"kw": "the cankerworm eaten", "raw": "Nah_3:15-17", "note": "", "refs": [{"l": "Nah 3:15-17", "n": "", "vs": [[15, "هناك تلتهمك النار، ويستأصلك السيف، فيبيدك الأعداء كالجراد. تكاثري كالجراد وكالجنادب."], [16, "قد أضحى تجارك أكثر من كواكب السماء، ولكنهم تبددوا كجراد فرد أجنحته وطار."], [17, "أصبح رؤساؤك كالجنادب، وقادتك كأسراب الجراد المتكومة على سياج في يوم بارد. ما إن تشرق الشمس حتى تطير بعيدا إلى حيث لا يعلم أحد."]]}], "kwAr": "أكلته الجنادب", "noteAr": ""}, {"kw": "the caterpillar", "raw": "Isa_33:4; Jer_51:14, Jer_51:27", "note": "", "refs": [{"l": "Isa 33:4", "n": "", "vs": [[4, "وكما يلتهم الجراد كل ما هو أخضر، هكذا يجمع سلبكم، ويتواثب الناس عليه كتواثب الجنادب."]]}, {"l": "Jer 51:14", "n": "", "vs": [[14, "قد أقسم الرب القدير بذاته قائلا: لأملأنك أناسا كالغوغاء فتعلو جلبتهم عليك."]]}, {"l": "Jer 51:27", "n": "", "vs": [[27, "انصبوا راية في الأرض. انفخوا في البوق بين الأمم. أثيروا عليها الأمم لقتالها، وألبوا عليها ممالك أراراط ومني وأشكناز. أقيموا عليها قائدا. اجعلوا الخيل تزحف عليها كجحافل الجنادب الشرسة."]]}], "kwAr": "قضى عليه الطيار", "noteAr": ""}], "arS": [["إن ما ", []], ["تخلف", ["H3499"]], [" من محصولكم عن هجمات ", []], ["الزحاف", ["H1501"]], [" ", []], ["التهمته", ["H398"]], [" أسراب ", []], ["الجراد", ["H697"]], ["، وما ", []], ["تفضل", ["H3499"]], [" عن أسراب الجراد ", []], ["أكلته", ["H398"]], [" ", []], ["الجنادب", ["H3218"]], ["؛ وما ", []], ["بقي", ["H3499"]], [" عن الجنادب ", []], ["قضى", ["H398"]], [" عليه ", []], ["الطيار", ["H2625"]], [".", []]]}, {"c": 1, "v": 5, "text": "اصحوا أيها السكارى، وابكوا ياجميع مدمني الخمر على العصير لأنه قد انقطع عن أفواهكم.", "groups": [{"kw": "Awake", "raw": "Isa_24:7-11; Amo_6:3-7; Luk_21:34-36; Rom_13:11-14", "note": "", "refs": [{"l": "Isa 24:7-11", "n": "", "vs": [[7, "قد انتحبت الخمرة، وذبلت الكرمة، وأن جميع ذوي القلوب الطربة."], [8, "خرس طرب الدفوف، كف ضجيج المبتهجين، وصمت مرح العود."], [9, "لا يعودون يشربون الخمر مع الغناء، ويكون المسكر مرا لشاربيه."], [10, "قد تدمرت مدينة الفوضى، وأغلق كل بيت، فلا يقدر أحد على الدخول."], [11, "ترتفع صرخة في الأزقة طلبا للخمرة المفقودة. زال كل فرح، وتلاشى السرور من الأرض"]]}, {"l": "Amo 6:3-7", "n": "", "vs": [[3, "أنتم يامن تتجاهلون يوم السوء وتقربون كرسي الظلم."], [4, "ويل للراقدين فوق أسرة من عاج، المسترخين فوق الأرائك، الآكلين لحم خيرة الحملان والعجول المختارة من وسط المعلف."], [5, "المغنين على صوت الرباب، المخترعين لأنفسهم آلات غناء كداود."], [6, "الشاربين خمرا في كؤوس، المتطيبين بأفضل العطور، ولا يكتئبون على خراب يوسف."], [7, "لهذا سيكونون أول الذاهبين إلى السبي، ويزول ما أنتم عليه من لهو وعبث."]]}, {"l": "Luk 21:34-36", "n": "", "vs": [[34, "ولكن احذروا لأنفسكم لئلا تتثقل قلوبكم بالانغماس في اللذات وبالسكر وهموم الحياة، فيدهمكم ذلك اليوم فجأة؛"], [35, "فإنه سوف يطبق كالفخ على جميع الساكنين على وجه الأرض كلها."], [36, "فاسهروا إذن وتضرعوا في كل حين، لكي تتمكنوا من أن تنجوا من جميع هذه الأمور التي هي على وشك أن تحدث، وتقفوا أمام ابن الإنسان»."]]}, {"l": "Rom 13:11-14", "n": "", "vs": [[11, "وفوق هذا، فأنتم تعرفون الوقت، وأنها الآن الساعة التي يجب أن نستيقظ فيها من النوم. فخلاصنا الآن، أقرب إلينا مما كان يوم آمنا:"], [12, "كاد الليل أن ينتهي والنهار أن يطلع. فلنطرح أعمال الظلام، ونلبس سلاح النور"], [13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."], [14, "وإنما البسوا الرب يسوع المسيح (تمثلوا به)، ولا تنشغلوا بالتدبير للجسد لقضاء شهواته."]]}], "kwAr": "اصحوا", "noteAr": ""}, {"kw": "weep", "raw": "Joe_1:11, Joe_1:13; Jer_4:8; Eze_30:2; Jam_5:1", "note": "", "refs": [{"l": "Joe 1:11", "n": "", "vs": [[11, "اخزوا أيها الحراثون وأعولوا أيها الكرامون على الحنطة والشعير، لأن حصاد الحقل قد تلف."]]}, {"l": "Joe 1:13", "n": "", "vs": [[13, "أيها الكهنة اتشحوا بالمسوح ونوحوا. ولولوا ياخدام المذبح. تعالوا وبيتوا ليلتكم بالمسوح ياخدام إلهي، لأن تقدمات الدقيق والخمر قد منعت عن هيكل الله."]]}, {"l": "Jer 4:8", "n": "", "vs": [[8, "لذلك تمنطقوا بالمسوح، ونوحوا وولولوا، لأن غضب الرب المحتدم لم يرتد عنا»"]]}, {"l": "Eze 30:2", "n": "", "vs": [[2, "«ياابن آدم، تنبأ وقل: هذا ما يعلنه السيد الرب: ولولوا قائلين: يالليوم الرهيب!"]]}, {"l": "Jam 5:1", "n": "", "vs": [[1, "أيها الأغنياء، هيا الآن ابكوا مولولين بسبب ما ينتظركم من أهوال وشقاء."]]}], "kwAr": "وابكوا", "noteAr": ""}, {"kw": "for", "raw": "Isa_32:10-12; Luk_16:19, Luk_16:23-25", "note": "", "refs": [{"l": "Isa 32:10-12", "n": "", "vs": [[10, "ما تكاد تنقضي أيام على سنة حتى تعتريكن رعدة أيتها الآمنات، لأن القطاف قد تلف، وموعد جني الأثمار قد أخلف."], [11, "ارتعدن أيتها النساء المطمئنات وارتجفن أيتها الفتيات الآمنات. تجردن من ثيابكن وتعرين ومنطقن أحقاءكن بالمسوح."], [12, "اضربن على صدوركن حسرة على المروج المبهجة والكروم المثمرة."]]}, {"l": "Luk 16:19", "n": "", "vs": [[19, "كان هنالك إنسان غني، يلبس الأرجوان وناعم الثياب، ويقيم الولائم المترفة، متنعما كل يوم."]]}, {"l": "Luk 16:23-25", "n": "", "vs": [[23, "وإذ رفع عينيه وهو في الهاوية يتعذب، رأى إبراهيم من بعيد ولعازر في حضنه."], [24, "فنادى قائلا: ياأباي إبراهيم! ارحمني، وأرسل لعازر ليغمس طرف إصبعه في الماء ويبرد لساني: فإني معذب في هذا اللهيب."], [25, "ولكن إبراهيم قال: يابني، تذكر أنك نلت خيراتك كاملة في أثناء حياتك، ولعازر نال البلايا. ولكنه الآن يتعزى هنا، وأنت هناك تتعذب."]]}], "kwAr": "لأنه", "noteAr": ""}], "arS": [["اصحوا", ["H6974"]], [" أيها ", []], ["السكارى", ["H7910"]], ["، ", []], ["وابكوا", ["H1058"]], [" ياجميع ", []], ["مدمني", ["H8354"]], [" ", []], ["الخمر", ["H3196"]], [" على ", []], ["العصير", ["H6071"]], [" ", []], ["لأنه", ["H3588"]], [" قد ", []], ["انقطع", ["H3772"]], [" عن ", []], ["أفواهكم", ["H4480", "H6310"]], [".", []]]}, {"c": 1, "v": 6, "text": "فإن أمة قد زحفت على أرضي، أمة قوية لا تحصى لكثرتها. لها أسنان ليث وأنياب لبؤة،", "groups": [{"kw": "nation", "raw": "Joe_2:2-11, Joe_2:25; Pro_30:25-27", "note": "", "refs": [{"l": "Joe 2:2-11", "n": "", "vs": [[2, "هو يوم ظلمة وتجهم، يوم غيوم مكفهرة وقتام دامس،فيه تزحف أمة قوية وعظيمة كما يزحف الظلام على الجبال، أمة لم يكن لها شبيه في سالف الزمان، ولن يكون لها نظير من بعدها عبر سني الأجيال."], [3, "تلتهم النار ما أمامها، ويحرق اللهيب ما خلفها. الأرض قدامها كجنة عدن، وخلفها صحراء موحشة، ولا شيء ينجو منها."], [4, "منظرهم كالخيول، وكأفراس الحرب يركضون."], [5, "يثبون على رؤوس الجبال في جلبة كجلبة المركبات، كفرقعة لهيب نار يلتهم القش، وكجيش عات مصطف للقتال."], [6, "تنتاب الرعدة منهم جميع الشعوب وتشحب كل الوجوه."], [7, "يندفعون كالجبابرة وكرجال الحرب يتسلقون السور، وكل منهم يزحف في طريقه لا يحيد عن سبيله."], [8, "لا يزاحم بعضهم بعضا. بل يتقدم كل منهم في طريقه. ينسلون بين الأسلحة من غير أن يتوقفوا."], [9, "ينقضون على المدينة ويتواثبون فوق الأسوار، يتسلقون البيوت ويتسللون من الكوى كاللص."], [10, "ترتعد الأرض أمامهم وترجف السماء، تظلم الشمس والقمر، وتكف الكواكب عن الضياء."], [11, "يجهر الرب بصوته في مقدمة جيشه لأن جنده لا يحصى لهم عدد، ومن ينفذ أمره يكون مقتدرا، لأن يوم الرب عظيم ومخيف جدا، فمن يتحمله؟"]]}, {"l": "Joe 2:25", "n": "", "vs": [[25, "وأعوضكم عن محاصيل السنين التي التهمها الجراد والجندب والطيار والقمص، جيشي العظيم الذي أطلقته عليكم."]]}, {"l": "Pro 30:25-27", "n": "", "vs": [[25, "النمل طائفة ضعيفة، لكنه يخزن في الصيف قوته."], [26, "الوبار طائفة لا قدرة لها، لكنها تنقر في الصخر بيوتها."], [27, "والجراد لا ملك له، لكنه يتقدم في أسراب منظمة."]]}], "kwAr": "أمة", "noteAr": ""}, {"kw": "my", "raw": "Psa_107:34; Isa_8:8, Isa_32:13; Hos_9:3", "note": "", "refs": [{"l": "Psa 107:34", "n": "", "vs": [[34, "يجعل الحقول الخصيبة أرضا ملحة جرداء من جراء شر سكانها."]]}, {"l": "Isa 8:8", "n": "", "vs": [[8, "فيكتسح أرض يهوذا، ويطفو مرتفعا إلى الأعناق، وتنتشر جيوشه في عرض أرضك ياعمانوئيل»."]]}, {"l": "Isa 32:13", "n": "", "vs": [[13, "لأن أرض شعبي تنبت الشوك والحسك، فتنمو حتى في كل بيوت الفرح في المدينة المبتهجة."]]}, {"l": "Hos 9:3", "n": "", "vs": [[3, "لن تظلوا مقيمين في أرض الرب بل يرجع أفرايم إلى ديار مصر، ويأكلوا لحما نجسا في أشور."]]}], "kwAr": "أرضي", "noteAr": ""}, {"kw": "whose", "raw": "Pro_30:14; Rev_9:7-10", "note": "", "refs": [{"l": "Pro 30:14", "n": "", "vs": [[14, "رب جيل أسنانه مرهفة كالسيوف، وأنيابه حادة كالسكاكين، ليفترس المساكين في الأرض والبائسين من بين أبناء البشر."]]}, {"l": "Rev 9:7-10", "n": "", "vs": [[7, "ويبدو هذا الجراد كأنه خيل مجهزة للقتال، على رؤوسه ما يشبه أكاليل الذهب، ووجوهه كوجوه البشر،"], [8, "وله شعر طويل كشعر النساء، وأسنانه كأسنان الأسود،"], [9, "وصدوره كدروع حديدية، وحفيف أجنحته كضجيج مركبات خيل تجري إلى القتال،"], [10, "وأذنابه ذات إبر كالعقارب. وله سلطة أن يؤذي البشر بأذنابه مدة خمسة أشهر."]]}], "kwAr": "لها أسنان", "noteAr": ""}], "arS": [["فإن", ["H3588"]], [" ", []], ["أمة", ["H1471"]], [" قد ", []], ["زحفت", ["H5927"]], [" ", []], ["على", ["H5921"]], [" ", []], ["أرضي", ["H776"]], ["، أمة ", []], ["قوية", ["H6099"]], [" لا ", []], ["تحصى", ["H369"]], [" ", []], ["لكثرتها", ["H4557"]], [". لها ", []], ["أسنان", ["H8127"]], [" ", []], ["ليث", ["H738"]], [" ", []], ["وأنياب", ["H4973"]], [" ", []], ["لبؤة", ["H3833"]], ["،", []]]}, {"c": 1, "v": 7, "text": "فأتلفت كرومي وحطمت أشجار بيتي وسلخت قشورها وطرحتها، فابيضت أغصانها.", "groups": [{"kw": "laid", "raw": "Joe_1:12; Exo_10:15; Psa_105:33; Isa_5:6, Isa_24:7; Jer_8:13; Hos_2:12; Hab_3:17", "note": "", "refs": [{"l": "Joe 1:12", "n": "", "vs": [[12, "قد ذوى الكرم وذبل التين والرمان والنخيل والتفاح ويبست سائر أشجار الحقل، وزالت البهجة من أبناء البشر."]]}, {"l": "Exo 10:15", "n": "", "vs": [[15, "فقد غطى وجه كل الأرض حتى أظلمت، والتهم كل عشب فيها وكل أثمار الأشجار التي خلفها البرد، فلم يبق شيء أخضر لا على الأشجار ولا في حقول المزروعات في كل أرجاء مصر."]]}, {"l": "Psa 105:33", "n": "", "vs": [[33, "ضرب كرومهم وتينهم، وهشم كل أشجارهم"]]}, {"l": "Isa 5:6", "n": "", "vs": [[6, "وأجعله خرابا فلا يقلم ولا ينقب، فينبت فيه شوك وحسك. وأوصي السحاب أن لا يمطر عليه أبدا."]]}, {"l": "Isa 24:7", "n": "", "vs": [[7, "قد انتحبت الخمرة، وذبلت الكرمة، وأن جميع ذوي القلوب الطربة."]]}, {"l": "Jer 8:13", "n": "", "vs": [[13, "«وسأبيدهم حقا، إذ لا يكون في الكرمة عنب ولا في التينة تين. حت ن كبيرهم إلى صغيرهم ."], [6, "ثم بلغ إنذار النبي ملك نينوى، فقام عن عرشه وخلع عنه حلته، وارتدى المسح وجلس على الرماد."], [7, "وأذاع في كل نينوى مرسوما ورد فيه: «بأمر من الملك ونبلائه، يمتنع الناس عن الأكل والشرب، وكذلك البهائم والغنم والبقر، لا ترع ولا تشرب ماء."], [8, "وعلى جميع الناس والبهائم أن يرتدوا المسوح، متضرعين إلى الله تائبين عن طرقهم الشريرة وعما ارتكبوه من ظلم."]]}], "kwAr": "وبيتوا", "noteAr": ""}, {"kw": "ye ministers", "raw": "Isa_61:6; 1Co_4:1; 2Co_3:6, 2Co_6:4, 2Co_11:23", "note": "", "refs": [{"l": "Isa 61:6", "n": "", "vs": [[6, "أما أنتم فتدعون كهنة الرب، ويسميكم الناس خدام إلهنا، فتأكلون ثروة الأمم وتتعظمون بغناهم."]]}, {"l": "1Co 4:1", "n": "", "vs": [[1, "فلينظر إلينا الناس باعتبارنا خداما للمسيح ووكلاء على أسرار الله."]]}, {"l": "2Co 3:6", "n": "", "vs": [[6, "الذي جعلنا أصحاب كفاءة لنكون خداما لعهد جديد قائم لا على الحرف بل على الروح. فالحرف يؤدي إلى الموت؛ أما الروح فيعطي الحياة."]]}, {"l": "2Co 6:4", "n": "", "vs": [[4, "وإنما نتصرف في كل شيء بما يبين أننا فعلا خدام الله: في تحمل الكثير؛ في الشدائد والحاجات والضيقات والجلدات"]]}, {"l": "2Co 11:23", "n": "", "vs": [[23, "وإن كانوا خدام المسيح، أتكلم كأني فقدت صوابي، فأنا متفوق عليهم: في الأتعاب أوفر منهم جدا، في الجلدات فوق الحد، في السجون أوفر جدا، في التعرض للموت أكثر مرارا."]]}], "kwAr": "ياخدام إلهي", "noteAr": ""}, {"kw": "for", "raw": "Joe_1:9; Lev_2:8-10; Num_29:6", "note": "", "refs": [{"l": "Joe 1:9", "n": "", "vs": [[9, "لأن تقدمات الدقيق والخمر قد انقطعت عن بيت الرب، وانتحب الكهنة خدام الرب."]]}, {"l": "Lev 2:8-10", "n": "", "vs": [[8, "فتحضر التقدمة، سواء أكانت مخبوزة في فرن أم على الصاج أم في مقلاة، إلى الكاهن وهو يقترب بها إلى المذبح."], [9, "ويتناول من التقدمة جزءا تذكاريا ويحرقه على المذبح، فيكون وقود محرقة رضى تسر الرب."], [10, "أما بقية التقدمة فتكون من نصيب هرون وأبنائه، فهي تقدمة محرقة مقدسة للرب."]]}, {"l": "Num 29:6", "n": "", "vs": [[6, "فتكون هذه علاوة على المحرقة الشهرية وتقدمتها من الدقيق والمحرقة اليومية الدائمة وتقدمتها من الدقيق، مع ما يرافقها من سكائب الخمر، هي  18"}, {"kw": "the elders", "raw": "Deu_29:10,Deu_29:11; 2Ch_20:13; Neh_9:2, Neh_9:3", "note": "", "refs": [{"l": "Deu 29:10", "n": "", "vs": [[10, "أنتم ماثلون اليوم جميعكم في حضرة الرب إلهكم: رؤساؤكم وقادة أسباطكم وعرفاؤكم وسائر رجال إسرائيل،"]]}, {"l": "Deu 29:11", "n": "", "vs": [[11, "وأطفالكم ونساؤكم، والغرباء المقيمون فى وسطكم، ممن يحتطب لكم ويستقي لكم ماءكم،"]]}, {"l": "2Ch 20:13", "n": "", "vs": [[13, "وبينما كان كل بني يهوذا ماثلين في حضرة الرب مع أطفالهم ونسائهم وبنيهم،"]]}, {"l": "Neh 9:2", "n": "", "vs": [[2, "وعزل الإسرائيليون أنفسهم عن الغرباء، ووقفوا معترفين بخطاياهم وخطايا آبائهم،"]]}, {"l": "Neh 9:3", "n": "", "vs": [[3, "ومكثوا في أماكنهم حيث تلي عليهم من سفر شريعة الرب إلههم ربع النهار، وحمدوا وسجدوا له في الربع الأخير."]]}], "kwAr": "الشيوخ", "noteAr": ""}, {"kw": "cry", "raw": "Jon_3:8", "note": "", "refs": [{"l": "Jon 3:8", "n": "", "vs": [[8, "وعلى جميع الناس والبهائم أن يرتدوا المسوح، متضرعين إلى الله تائبين عن طرقهم الشريرة وعما ارتكبوه من ظلم."]]}], "kwAr": "وتضرعوا", "noteAr": ""}], "arS": [["خصصوا", ["H6942"]], [" ", []], ["صوما", ["H6685"]], [". ", []], ["نادوا", ["H7121"]], [" ", []], ["بالاعتكاف", ["H6116"]], [". ", []], ["ادعوا", ["H622"]], [" ", []], ["الشيوخ", ["H2205"]], [" ", []], ["وجميع", ["H3605"]], [" ", []], ["سكان", ["H3427"]], [" ", []], ["الأرض", ["H776"]], [" للاجتماع في ", []], ["هيكل", ["H1004"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["إلهكم", ["H430"]], [" ", []], ["وتضرعوا", ["H2199"]], [" ", []], ["إليه", ["H413"]], [".", []]]}, {"c": 1, "v": 15, "text": "يا له من يوم رهيب، لأن يوم الرب قريب يأتي حاملا معه الدمار من عند القدير.", "groups": [{"kw": "Alas", "raw": "Joe_2:2; Jer_30:7; Amo_5:16-18", "note": "", "refs": [{"l": "Joe 2:2", "n": "", "vs": [[2, "هو يوم ظلمة وتجهم، يوم غيوم مكفهرة وقتام دامس،فيه تزحف أمة قوية وعظيمة كما يزحف الظلام على الجبال، أمة لم يكن لها شبيه في سالف الزمان، ولن يكون لها نظير من بعدها عبر سني الأجيال."]]}, {"l": "Jer 30:7", "n": "", "vs": [[7, "ما أرهب ذلك اليوم إذ لا مثيل له! هو زمن ضيق على ذرية يعقوب، ولكنها ستنجو منه."]]}, {"l": "Amo 5:16-18", "n": "", "vs": [[16, "لذلك، هذا ما يقوله الرب الإله القدير، سيملأ النحيب أرجاء الساحات، ويرتفع عويلهم في الشوارع قائلين: آه! آه! ويدعون الفلاحين إلى البكاء، والنادبات إلى الرثاء،"], [17, "وتعلو الولولة في جوانب الكروم، لأني سأجتاز منتقما في وسطكم يقول الرب."], [18, "ويل للذين يتشوقون ليوم الرب. لماذا تطلبون مجيء يوم الرب؟ فيوم الرب هو ظلمة لا نور."]]}], "kwAr": "يا له من يوم", "noteAr": ""}, {"kw": "the day of", "raw": "Joe_2:1; Psa_37:13; Isa_13:6-9; Eze_7:2-12, Eze_12:22-28; Zep_1:14-18; Luk_19:41-44; Jam_5:9; Rev_6:17", "note": "", "refs": [{"l": "Joe 2:1", "n": "", "vs": [[1, "انفخوا بالبوق في صهيون، وأطلقوا نفير الإنذار في جبل قدسي، وليرتعد جميع سكان الأرض، لأن يوم الرب مقبل وقد بات وشيكا."]]}, {"l": "Psa 37:13", "n": "", "vs": [[13, "ولكن الرب يضحك منه لأنه يرى أن يوم عقابه آت."]]}, {"l": "Isa 13:6-9", "n": "", "vs": [[6, "ولولوا، فإن يوم الرب بات وشيكا قادما من عند الرب محملا بالدمار."], [7, "لذلك ترتخي كل يد، ويذوب قلب كل إنسان."], [8, "ينتابهم الفزع، وتأخذهم أوجاع ومخاض، يتلوون كوالدة تقاسي من آلآم المخاض. ويحملق بعضهم ببعض مبهوتين بوجوه ملتهبة."], [9, "ها هو يوم الرب آت مفعما بالقسوة والسخط والغضب العنيف، ليجعل الأرض خرابا ويبيد منها الخطاة."]]}, {"l": "Eze 7:2-12", "n": "", "vs": [[2, "«ياابن آدم، هذا ما يعلنه الرب لأرض إسرائيل. النهاية قد أزفت على زوايا الأرض الأربع."], [3, "قد أقبلت النهاية عليك، فأطلق غضبي عليك وأدينك بمقتضى طرقك، وأجازيك على كل رجاساتك ياأرض إسرائيل،"], [4, "فلا تتر أف عليك عيني، ولا أعفو، بل أجازيك بمقتضى طرقك، وتكون رجاساتك في وسطك. عندئذ تدركون أني أنا الرب»."], [5, "وهذا ما يعلنه السيد الرب: «هوذا شر قد أقبل، شر لا مثيل له."], [6, "قد أزفت النهاية قد أزفت النهاية. انتبهت لك، وها هي مقبلة."], [7, "قد حل بك القضاء ياساكن الأرض، وأزف الموعد، اقترب يوم الاضطراب لا يوم الهتاف في الجبال."], [8, "أنا موشك على صب غضبي عليك وأنفث غيظي فيك، وأدينك بمقتضى طرقك، وأجازيك على كل رجاساتك،"], [9, "فلا تترَأف عليك عيني ولا أعفو، بل أجازيك بمقتضى طرقك، وتكون رجاساتك في وسطك. وعندئذ تدركون أني أنا الضارب."], [10, "ها هو اليوم قد أقبل! قد أزف القضاء وأزهر الظلم وأفرخت الكبرياء"], [11, "انتصب الجور وصار عصا للشر، لذلك يفنى الظالمون وتفنى ثروتهم وضجيجهم ولا من ينوح عليهم."], [12, "قد حان الموعد واقترب اليوم، فلا يفرحن المشتري ولا يحزنن البائع، لأن الغضب منصب على جمهورهم بأسره."]]}, {"l": "Eze 12:22-28", "n": "", "vs": [[22, "«ياابن آدم، ما هذا المثل الشائع في أرض إسرائيل القائل: قد طالت الأيام وكذبت كل رؤيا؟."], [23, "لذلك قل لهم: هذا ما يعلنه السيد الرب: ها أنا قد أبطلت هذا المثل فلا يعودون يرددونه في إسرائيل، بل قل لهم: قد أزفت الأيام وحان تحقيق كلام كل رؤيا،"], [24, "إذ لن تكون بعد رؤيا باطلة ولا عرافة متملقة في وسط شعب إسرائيل."], [25, "لأني أنا الرب أتكلم، والكلمة التي أقضي بها تتم، من غير مماطلة، بل ها أنا أنطق بقضائي في أيامكم أيها الشعب المتمرد وأنفذه في حينه، يقول السيد الرب»."], [26, "ثم أوحى إلي الرب بكلمته قائلا:"], [27, "«ياابن آدم، ها شعب إسرائيل يقولون: إن الرؤيا التي تراها لا تتم إلا بعد أيام كثيرة، ونبوءتك لا تتحقق إلا في أزمنة بعيدة"], [28, "لذلك قل لهم: هذا ما يعلنه السيد الرب: لن يتأخر بعد تنفيذ كلمة من كلامي الذي قضيت به، فكل كلمة نطقت بها لابد أن تتم، يقول السيد الرب»."]]}, {"l": "Zep 1:14-18", "n": "", "vs": [[14, "إن يوم الرب العظيم قريب، وشيك وسريع جدا. دوي يوم الرب مخيف، فيه يصرخ الجبار مرتعبا."], [15, "يوم غضب هو ذلك اليوم، يوم ضيق وعذاب، يوم خراب ودمار، يوم ظلمة واكتئاب، يوم غيوم وقتام."], [16, "يوم دوي بوق وصيحة قتال ضد المدن الحصينة والبروج الشامخة."], [17, "فيه أضايق الناس فيمشون كالعمي، لأنهم أخطأوا بحق الرب، فتنسكب دماؤهم كالتراب، ولحمهم يتناثر كالجلة."], [18, "لا ينقذهم ذهبهم ولا فضتهم في يوم غضب الرب، إذ بنار غيرته تلتهم كل الأرض، وفيه يضع نهاية مباغتة كاملة سريعة لكل سكان المعمورة»."]]}, {"l": "Luk 19:41-44", "n": "", "vs": [[41, "ولما اقترب، ورأى المدينة، بكى عليها،"], [42, "قائلا: «ليتك أنت أيضا، في يومك هذا، عرفت ما فيه سلامك! ولكن ذلك محجوب الآن عن عينيك."], [43, "فستأتي عليك أيام يحاصرك فيها أعداؤك بالمتاريس، ويطبقون عليك، ويشددون عليك الحصار من كل جهة،"], [44, "ويهدمونك على أبنائك الذين فيك، فلا يتركون فيك l": "Isa 2:12", "n": "", "vs": [[12, "فإن للرب القدير يوما فيه يوضع كل متعظم ومتكبر ومتغطرس."]]}, {"l": "Eze 7:5-7", "n": "", "vs": [[5, "وهذا ما يعلنه السيد الرب: «هوذا شر قد أقبل، شر لا مثيل له."], [6, "قد أزفت النهاية قد أزفت النهاية. انتبهت لك، وها هي مقبلة."], [7, "قد حل بك القضاء ياساكن الأرض، وأزف الموعد، اقترب يوم الاضطراب لا يوم الهتاف في الجبال."]]}, {"l": "Eze 7:10", "n": "", "vs": [[10, "ها هو اليوم قد أقبل! قد أزف القضاء وأزهر الظلم وأفرخت الكبرياء"]]}, {"l": "Eze 7:12", "n": "", "vs": [[12, "قد حان الموعد واقترب اليوم، فلا يفرحن المشتري ولا يحزنن البائع، لأن الغضب منصب على جمهورهم بأسره."]]}, {"l": "Eze 12:23", "n": "", "vs": [[23, "لذلك قل لهم: هذا ما يعلنه السيد الرب: ها أنا قد أبطلت هذا المثل فلا يعودون يرددونه في إسرائيل، بل قل لهم: قد أزفت الأيام وحان تحقيق كلام كل رؤيا،"]]}, {"l": "Amo 8:2", "n": "", "vs": [[2, "وسألني: «ماذا ترى ياعاموس؟» فأجبت: «سلة مليئة بثمار الصيف الناضجة». فقال لي الرب: «لقد دنت نهاية شعبي إسرائيل ولن أعفو عنهم بعد."]]}, {"l": "Oba 1:15", "n": "", "vs": [[15, "لأن يوم الرب قريب آت على كل الأمم، وكما فعلت، لابد أن يفعل بك أيضا، فيرتد عملك على رأسك."]]}, {"l": "Mal 4:1", "n": "", "vs": [[1, "«انظروا، ها يوم القضاء مقبل، لاهب كتنور يكون فيه جميع المستكبرين وفاعلي الإثم عصافة، فيحرقهم ذلك اليوم ولا يبقي لهم أصلا ولا فرعا، يقول الرب القدير."]]}, {"l": "1Th 5:2", "n": "", "vs": [[2, "لأنكم تعلمون يقينا أن يوم الرب سيأتي كما يأتي اللص في الليل."]]}, {"l": "Jam 5:8", "n": "", "vs": [[8, "فاصبروا أنتم إذن، وشددوا قلوبكم لأن عودة الرب قد صارت قريبة."]]}, {"l": "1Pe 4:7", "n": "", "vs": [[7, "إن نهاية كل شيء قد صارت قريبة. فتعقلوا إذن، وكونوا متنبهين لرفع الصلاة دائما."]]}], "kwAr": "لأن يوم", "noteAr": ""}], "arS": [["انفخوا", ["H8628"]], [" ", []], ["بالبوق", ["H7782"]], [" في ", []], ["صهيون", ["H6726"]], ["، ", []], ["وأطلقوا", ["H7321"]], [" نفير الإنذار في ", []], ["جبل", ["H2022"]], [" ", []], ["قدسي", ["H6944"]], ["، ", []], ["وليرتعد", ["H7264"]], [" ", []], ["جميع", ["H3605"]], [" ", []], ["سكان", ["H3427"]], [" ", []], ["ال o traverse more rapidly a desert soil, the heavens may literally be said to be obscured by them. Joe_2:10,Joe_2:31, Joe_3:14, Joe_3:15; Exo_20:21; Psa_97:2; Isa_5:30, Isa_8:22; Jer_13:16; Amo_5:18-20; Zep_1:14, Zep_1:15; Heb_12:18; Jud_1:13", "refs": [{"l": "Joe 2:10", "n": "", "vs": [[10, "ترتعد الأرض أمامهم وترجف السماء، تظلم الشمس والقمر، وتكف الكواكب عن الضياء."]]}, {"l": "Joe 2:31", "n": "", "vs": [[31, "وتتحول الشمس إلى ظلام، والقمر إلى دم، قبل مجيء يوم الرب العظيم المخيف."]]}, {"l": "Joe 3:14", "n": "", "vs": [[14, "جماهير جماهير متزاحمة في وادي القضاء، لأن يوم الرب قريب في وادي القضاء."]]}, {"l": "Joe 3:15", "n": "", "vs": [[15, "قد أظلمت الشمس والقمر، وكفت الكواكب عن الضياء."]]}, {"l": "Exo 20:21", "n": "", "vs": [[21, "وبينما كان الشعب واقفا من بعيد، اقترب موسى من الظلام المتكاثف حيث كان الله ."]]}, {"l": "Psa 97:2", "n": "", "vs": [[2, "حوله الغيوم والضباب، والعدل والحق قاعدة عرشه."]]}, {"l": "Isa 5:30", "n": "", "vs": [[30, "يزمجرون عليها في ذلك اليوم كهدير البحر. وإن جاس أحد في البلاد متفرسا لا يرى سوى الظلمة والضيق، حتى (انفراجات) الضوء (أي ومضات الرجاء) قد احتجبت وراء سحبه."]]}, {"l": "Isa 8:22", "n": "", "vs": [[22, "ثم ينظرون إلى الأرض فلا يجدون سوى الكرب والظلمة والضنك والعذاب، ويطردون إلى دياجير الظلام."]]}, {"l": "Jer 13:16", "n": "", "vs": [[16, "مجدوا الرب إلهكم قبل أن يجعل الظلام يخيم عليكم، وقبل أن تتعثر أقدامكم على الجبال المعتمة. أنتم ترتقبون النور ولكنه يحوله إلى ظلام الموت ويجعله ليلا دامسا."]]}, {"l": "Amo 5:18-20", "n": "", "vs": [[18, "ويل للذين يتشوقون ليوم الرب. لماذا تطلبون مجيء يوم الرب؟ فيوم الرب هو ظلمة لا نور."], [19, "فتكونون كرجل هرب من وجه أسد فلقيه دب، أو كمن دخل إلى بيت واتكأ بيده على حائط فلدغته أفعى."], [20, "أو ليس يوم الرب ظلمة لا نورا، وقتاما خاليا من الضياء؟"]]}, {"l": "Zep 1:14", "n": "", "vs": [[14, "إن يوم الرب العظيم قريب، وشيك وسريع جدا. دوي يوم الرب مخيف، فيه يصرخ الجبار مرتعبا."]]}, {"l": "Zep 1:15", "n": "", "vs": [[15, "يوم غضب هو ذلك اليوم، يوم ضيق وعذاب، يوم خراب ودمار، يوم ظلمة واكتئاب، يوم غيوم وقتام."]]}, {"l": "Heb 12:18", "n": "", "vs": [[18, "إنكم لم تقتربوا إلى جبل ملموس، مشتعل بالنار، ولا ضباب وظلام وريح عاصفة،"]]}, {"l": "Jud 1:13", "n": "", "vs": [[13, "وبأعمالهم المخجلة يفضحون أنفسهم كأمواج في البحر هائجة تقذف الأوساخ. وهم أشبه بنجوم تائهة في الفضاء، مصيرها الظلام الشديد إلى الأبد!"]]}], "kwAr": "هو يوم ظلمة وتجهم", "noteAr": "يقول كاتب فرنسي إن كمية هذه الحشرات لا تصدق عند من لم يشهد بنفسه أعدادها المذهلة؛ فالأرض كلها تغطى بها على امتداد فراسخ عدة. وضجيجها وهي ترعى الأشجار والأعشاب يُسمع من بعيد، ويشبه ضجيج جيش في الخفاء. وحيثما انتشرت أسرابها اختفت خضرة البلاد؛ وتتجرد الأشجار والنباتات من أوراقها وتُختزل إلى أغصان وسيقان عارية، فيحل منظر الشتاء الموحش فجأة محل جمال الربيع الغني. وحين تحلق هذه السحب من الجراد، لتتخطى العوائق أو لتعبر أرضا قاحلة بسرعة، يمكن القول حرفيا إن السماوات تحتجب بها. انظر يوء 2: 10، 31؛ 3: 14، 15؛ خر 20: 21؛ مز 97: 2؛ إش 5: 30؛ 8: 22؛ إر 13: 16؛ عا 5: 18-20؛ صف 1: 14، 15؛ عب 12: 18؛ يه 1: 13"}, {"kw": "as", "raw": "Amo_4:13", "note": "", "refs": [{"l": "Amo 4:13", "n": "", "vs": [[13, "فانظر إنه هو صانع الجبال وخالق الرياح، الذي أعلن فكره للبشر، وأحال النهار إلى ليل، ومشى فوق مشارف الأرض، الرب الإله القدير اسمه."]]}], "kwAr": "كما يزحف الظلام", "noteAr": ""}, {"kw": "a great", "raw": "Joe_2:5, Joe_2:11, Joe_2:25, Joe_1:6", "note": "", "refs": [{"l": "Joe 2:5", "n": "", "vs": [[5, "يثبون على رؤوس الجبال في جلبة كجلبة المركبات، كفرقعة لهيب نار يلتهم القش، وكجيش عات مصطف للقتال."]]}, {"l": "Joe 2:11", "n": "", "vs": [[11, "يجهر الرب بصوته في مقدمة جيشه لأن جنده لا يحصى لهم عدد، ومن ينفذ أمره يكون مقتدرا، لأن يوم الرب عظيم ومخيف جدا، فمن يتحمله؟"]]}, {"l": "Joe 2:25", "n": "", "vs": [[25, "وأعوضكم عن محاصيل السنين التي التهمها الجراد والجندب والطيار والقمص، جيشي العظيم الذي أطلقته عليكم."]]}, {"l": "Joe 1:6", "n": "", "vs": [[6, "فإن أمة قد زحفت على أرضي، أمة قوية لا تحصى لكثرتها. لها أسنان ليث وأنياب لبؤة،"]]}], "kwAr": "وعظيمة", "noteAr": ""}, {"kw": "there", "raw": "Joe_1:2, Joe_1:3; Exo_10:6, Exo_10:14; Dan_12:1; Mar_13:19", "note": "", "refs": [{"l": "Joe 1:2", "n": "", "vs": [[2, "اسمعوا هذا أيها الشيوخ، وأصغوا ياجميع أهل الأرض، هل جرى مثل هذا في أيامكم أو في أيام آبائكم؟"]]}, {"l": "Joe 1:3", "n": "", "vs": [[3, "أخبروا بهذا أبناءكم، وليخبر أبناؤكم أبناءهم لينقلوه إلى الأجيال القادمة."]]}, {"l": "Exo 10:6", "n": "", "vs": [[6, "ويملأ بيوتك وبيوت حاشيتك وبيوت جميع المصريين، الأمر الذي لم يشهد مثله آباؤك ولا أجدادك منذ أن استوطنوا هذه الأرض إلى الآن». ثم تحول وانصرف من لدن فرعون."]]}, {"l": "Exo 10:14", "n": "", "vs": [[14, "فانتشر الجراد في كل بلاد مصر، وحل في جميع تخومها بأسراب عظيمة، فلم يكن له نظير من قبل ولن يحدث مثله في ما بعد."]]}, {"l": "Dan 12:1", "n": "", "vs": [[1, "«وفي ذلك الوقت يقوم الرئيس العظيم الملاك ميخائيل حارس شعبك، وذلك في أثناء ضيق لم يكن له مثيل منذ أن وجدت أمة حتى ذلك الزمان. غير أن كل من كان اسمه مدونا في الكتاب من شعبك ينجو في ذلك الزمان."]]}, {"l": "Mar 13:19", "n": "", "vs": [[19, "فسوف تحدث في تلك الأيام ضيقة لم يحدث مثلها منذ بدء الخليقة التي خلقها الله إلى الآن ولن يحدث."]]}], "kwAr": "لم يكن لها", "noteAr": ""}, {"kw": "many generations", "raw": "Heb. generation and generation, Deu_32:7; Psa_10:6 *marg.", "note": "Heb. generation and generation, Deu_32:7; Psa_10:6 *marg.", "refs": [{"l": "Deu 32:7", "n": "", "vs": [[7, "اذكروا الأيام الغابرة، وتأملوا في سنوات الأجيال الماضية. اسألوا آباءكم فينبئوكم، وشيوخكم فيخبروكم."]]}, {"l": "Psa 10:6", "n": "*marg.", "vs": [[6, "قال في نفسه: «لن يزحزحني شيء، ولن ينالني مكروه قط»."]]}], "kwAr": "سني الأجيال", "noteAr": "بالعبرية: «جيل وجيل». انظر تث 32: 7؛ مز 10: 6"}], "arS": [["هو يوم ", []], ["ظلمة", ["H2822"]], [" ", []], ["وتجهم", ["H653"]], ["، يوم ", []], ["غيوم", ["H6051"]], [" مكفهرة ", []], ["وقتام", ["H6205"]], [" دامس،فيه تزحف أمة ", []], ["قوية", ["H6099"]], [" ", []], ["وعظيمة", ["H7227"]], [" ", []], ["كما", ["H7837"]], [" ", []], ["يزحف", ["H6566"]], [" الظلام ", []], ["على", ["H5921"]], [" ", []], ["الجبال", ["H2022"]], ["، ", []], ["أمة", ["H5971"]], [" لم ", []], ["يكن", ["H1961"]], [" لها ", []], ["شبيه", , Jer_29:12, Jer_29:13; Lam_3:40,Lam_3:41; Hos_6:1, Hos_12:6, Hos_14:1; Zec_1:3, Zec_1:4; Act_26:20", "note": "", "refs": [{"l": "Deu 4:29", "n": "", "vs": [[29, "ولكن إن طلبتم من هناك الرب إلهكم، ملتمسينه من كل قلوبكم ونفوسكم، فإنكم تجدونه."]]}, {"l": "Deu 4:30", "n": "", "vs": [[30, "فعندما يكتنفكم الضيق وتصيبكم في آخر الأيام جميع هذه الأمور، عندئذ ترجعون إلى الرب إلهكم وتطيعون أوامره."]]}, {"l": "1Sa 7:3", "n": "", "vs": [[3, "فقال صموئيل لكل شعب إسرائيل: «إن كنتم حقا قد تبتم من كل قلوبكم إلى الرب، فانزعوا الآلهة الغريبة وأصنام العشتاروث من وسطكم، وهيئوا قلوبكم للرب واعبدوه وحده، فينقذكم من قبضة الفلسطينيين»."]]}, {"l": "1Ki 8:47-49", "n": "", "vs": [[47, "فإن تابوا في أرض سبيهم ورجعوا متضرعين إليك قائلين: قد أخطأنا وانحرفنا وأذنبنا،"], [48, "وتابوا حقا من كل قلوبهم ونفوسهم وهم أسرى في ديار أعدائهم، متوجهين نحو أرضهم التي وهبتها لآبائهم، نحو المدينة التي اخترتها والهيكل الذي شيدته لاسمك،"], [49, "فاستجب صلاتهم وتضرعهم من السماء مقر سكناك، وانصر قضيتهم،"]]}, {"l": "2Ch 6:38", "n": "", "vs": [[38, "وتابوا حقا من كل قلوبهم وأنفسهم وهم في ديار آسريهم، وصلوا إليك متوجهين نحو أرضهم التي وهبتها لآبائهم، نحو المدينة التي اخترتها والهيكل الذي بنيته لاسمك،"]]}, {"l": "2Ch 6:39", "n": "", "vs": [[39, "فاستجب من السماء، مقر سكناك، صلاتهم وتضرعهم، وانصر قضيتهم، واصفح عن خطيئة شعبك."]]}, {"l": "2Ch 7:13", "n": "", "vs": [[13, "فإن أغلقت السماء فانحبس المطر، وإن أمرت الجراد أن يلتهم عشب الأرض، وإن جعلت الوبأ يتفشى بين شعبي،"]]}, {"l": "2Ch 7:14", "n": "", "vs": [[14, "ثم اتضع شعبي الذي دعي اسمي عليهم، وتضرعوا طالبين وجهي، وتابوا عن غيهم، فإنني أستجيب من السماء وأصفح عن خطيئتهم وأخصب أرضهم."]]}, {"l": "Isa 55:6", "n": "", "vs": [[6, "اطلبوا الرب مادام موجودا، ادعوه وهو قريب."]]}, {"l": "Isa 55:7", "n": "", "vs": [[7, "ليترك الشرير طريقه والأثيم أفكاره، وليتب إلى الرب فيرحمه، وليرجع إلى إلهنا لأنه يكثر الغفران."]]}, {"l": "Jer 4:1", "n": "", "vs": [[1, "ويقول الرب: «إن رجعت إلي ياشعب إسرائيل، وأزلت أصنامك المقيتة من أمامي، وكففت عن الضلال،"]]}, {"l": "Jer 29:12", "n": "", "vs": [[12, "فتدعونني وتقبلون، وتصلون إلي فأستجيب لكم،"]]}, {"l": "Jer 29:13", "n": "", "vs": [[13, "وتلتمسونني فتجدونني إذ تطلبونني بكل قلوبكم."]]}, {"l": "Lam 3:40", "n": "", "vs": [[40, "لنفحص طرقنا ونختبرها ونرجع إلى الرب."]]}, {"l": "Lam 3:41", "n": "", "vs": [[41, "لنرفع قلوبنا وأيدينا إلى الله في السماوات."]]}, {"l": "Hos 6:1", "n": "", "vs": [[1, "«تعالوا نرجع إلى الرب. هو الذي مزقنا إربا إربا، وهو وحده يبرئنا. هو الذي ضربنا، وهو وحده الذي يجبرنا."]]}, {"l": "Hos 12:6", "n": "", "vs": [[6, "أما أنتم فارجعوا إلى إلهكم تائبين. تمسكوا برحمته وعدله، وداوموا على الا تكال عليه."]]}, {"l": "Hos 14:1", "n": "", "vs": [[1, "ارجع تائبا ياإسرائيل إلى الرب إلهك، لأنك قد تعثرت بخطيئتك."]]}, {"l": "Zec 1:3", "n": "", "vs": [[3, "ولكن قل لهم، هذا ما يعلنه الرب القدير: ارجعوا إلي فأرجع إليكم، يقول الرب القدير."]]}, {"l": "Zec 1:4", "n": "", "vs": [[4, "ولا تكونوا كآبائكم الذين ناداهم الأنبياء السالفون قائلين: هكذا يقول الرب القدير، ارجعوا عن طرقكم الباطلة وأعمالكم الشريرة، ولكنهم لم يسمعوا ولم يصغوا إلي، يقول الرب."]]}, {"l": "Act 26:20", "n": "", "vs": [[20, "فبشرت أهل دمشق أولا، ثم أهل أورشليم ومنطقة اليهودية كلها، ثم الأجانب. فدعوت الجميع إلى التوبة والرجوع إلى الله، والقيام بأعمال تليق بالتوبة."]]}], "kwAr": "ارجعوا", "noteAr": ""}, {"kw": "with fasting", "raw": "Jdg_20:26; 1Sa_7:6; 2Ch_20:3, 2Ch_20:4; Neh_9:1, Neh_9:2; Isa_22:12; Jon_3:5-8; Zec_7:3, Zec_7:5, Zec_12:10-14; Jam_4:8, Jam_4:9", "note": "", "refs": [{"l": "Jdg 20:26", "n": "", "vs": [[26, "فتوجه جميع الشعب من المحاربين إلى بيت إيل وبكوا ومثلوا أمام الرب صائمين في ذلك اليوم إلى المساء، ثم أصعدوا للرب محرقات وذبائح سلام."]]}, {"l": "1Sa 7:6", "n": "", "vs": [[6, "فاجتمعوا في المصفاة حيث استقوا ماء وسكبوه أمام الرب، وصاموا في ذلك اليوم قائلين هناك: «قد أخطأنا إلى الرب». وكان صموئيل يقضي لبني إسرائيل في المصفاة."]]}, {"l": "2Ch 20:3", "n": "", "vs": [[3, "فاعتراه الخوف وعقد العزم على الاستغاثة بالرب ونادى بصوم في جميع يهوذا."]]}, {"l": "2Ch 20:4", "n": "", "vs": [[4, "فاحتشد بنو يهوذا قادمين من كل مدن يهوذا ليطلبوا عون الرب."]]}, {"l": "Neh 9:1", "n": "", "vs": [[1, "وفي اليوم الرابع والعشرين من الشهر ذاته، اجتمع بنو إسرائيل صائمين ومرتدين المسوح ومعفري الرؤوس بالتراب."]]}, {"l": "Neh 9:2", "n": "", "vs": [[2, "وعزل الإسرائيليون أنفسهم عن الغرباء، ووقفوا معترفين بخطاياهم وخطايا آبائهم،"]]}, {"l": "Isa 22:12", "n": "", "vs": [[12, "في ذلك اليوم يدعوكم السيد الرب القدير للبكاء والنوح وحلق الشعر والتنطق بالمسوح."]]}, {"l": "Jon 3:5-8", "n": "", "vs": [[5, "فآمن شعب نينوى بالرب، وأعلنوا الصيام وارتدوا المسوح من كبيرهم إلى صغيرهم ."], [6, "ثم بلغ إنذار النبي ملك نينوى، فقام عن عرشه وخلع عنه حلته، وارتدى المسح وجلس على الرماد."], [7, "وأذاع في كل نينوى مرسوما ورد فيه: «بأمر من الملك ونبلائه، يمتنع الناس عن الأكل والشرب، وكذلك البهائم والغنم والبقر، لا ترع ولا تشرب ماء."], [8, "وعلى جميع الناس والبهائم أن يرتدوا المسوح، متضرعين إلى الله تائبين عن طرقهم الشريرة وعما ارتكبوه من ظلم."]]}, {"l": "Zec 7:3", "n": "", "vs": [[3, "ليستشيروا كهنة بيت الرب القدير والأنبياء قائلين: «هل ننوح ونصوم في الشهر الخامس (آب ; أوغسطس) كما اعتدنا طوال هذه السنين الكثيرة؟»"]]}, {"l": "Zec 7:5", "n": "", "vs": [[5, "قل لجميع شعب الأرض والكهنة: «حين كنتم تصومون وتنوحون في الشهر الخامس والشهر السابع (أي تشرين ; الأول أكتوبر) في غضون سنوات المنفى السبعين، هل كان صيامكم حقا لي؟"]]}, {"l": "Zec 12:10-14", "n": "", "vs": [[10, "وأفيض على ذرية داود وعلى سكان أورشليم روح النعمة والابتهال، حتى إذا نظروا إلي أنا الذي طعنوه ينوحون عليه كما ينوح والد على ولده الوحيد، متفجعين عليه كتفجعهم على موت بكرهم."], [11, "في ذلك اليوم يكون النواح في أورشليم مماثلا للنواح في هددرمون في سهل مجدو (حيث قتل الملك يوشيا)."], [12, "فيشيع النحيب بين أهل البلاد، فتنوح كل عشيرة على حدة، فيبكي رجال عشيرة داود منفردين عن النساء، والنساء عن الرجال، ورجال عشيرة ذرية ناثان منفردين عن النساء، والنساء عن الرجال."], [13, "وكذلك ينوح رجال ونساء عشيرة لاوي كل على حدة، ورجال ونساء عشيرة شمعي كل على حدة."], [14, "وأيضا ينوح رجال ونساء سائر العشائر الباقية كل على حدة»."]]}, {"l": "Jam 4:8", "n": "", "vs": [[8, "اقتربوا إلى الله فيقترب إليكم. أيها الخاطئون نظفوا أيديكم، وياأصحاب الرأيين طهروا قلوبكم."]]}, {"l": "Jam 4:9", "n": "", "vs": [[9, "احزنوا مولولين ونائحين وباكين. ليتحول ضحككم إلى نواح، وفرحكم إلى كآبة."]]}], "kwAr": "بصوم", "noteAr": ""}], "arS": [["والآن", ["H6258"]], ["، ", []], ["يقول", ["H5002"]], [" ", []], ["الرب", ["H3068"]], [": ", []], ["ارجعوا", ["H7725"]], [" إلي من كل ", []], ["قلوبكم", ["H3824"]], [" ", []], ["بصوم", ["H6685"]], [" ", []], ["وبكاء", ["H1065"]], [" ", []], ["ونوح", ["H4553"]], [".", []]]}, {"c": 2, "v": 13, "text": "مزقوا قلوبكم لا ثيابكم. ارجعوا إلى الرب إلهكم لأنه رؤوف ورحيم بطيء الغضب وكثير الرأفة، ولا يسر بالعقاب.", "groups": [{"kw": "rend", "raw": "Here the word rend is used only once, but with two significations; in the former sentence it is used figuratively; in the latter literally - the heart not being rent in the same sense in which garments are rent. 2Ki_22:19; Psa_34:18, Psa_51:17; Isa_57:15, Isa_66:2; Eze_9:4; Mat_5:3, Mat_5:4", "note": "Here the word rend is used only once, but with two significations; in the former sentence it is used figuratively; in the latter literally - the heart not being rent in the same sense in which garments are rent. 2Ki_22:19; Psa_34:18, Psa_51:17; Isa_57:15, Isa_66:2; Eze_9:4; Mat_5:3, Mat_5:4", "refs": [{"l": "2Ki 22:19", "n": "", "vs": [[19, "من حيث أن قلبك قد رق، وتواضعت أمام الرب لدى سماعك ما قضيت به على هذا الموضع وعلى أهله، بأن يصيروا مثار دهشة ولعنة، ومزقت ثيابك وبكيت أمامي، فإنني قد استجبت أنا أيضا رجاءك."]]}, {"l": "Psa 34:18", "n": "", "vs": [[18, "الرب قريب من كسيري القلب، ويخلص مسحوقي الروح."]]}, {"l": "Psa 51:17", "n": "", "vs": [[17, "إن الذبائح التي يطلبها الله هي روح منكسرة. فلا تحتقرن القلب المنكسر والمنسحق ياالله ."]]}, {"l": "Isa 57:15", "n": "", "vs": [[15, "لأنه هكذا يقول العلي السامي، المقيم في الأبد، الذي يدعى اسمه القدوس: إنني أسكن في العلى وفي الموضع المقدس، وأقيم مع المنسحق، وذوي الروح المتواضعة، لأحيي أرواح المتواضعين، وأنعش قلوب المنسحقين."]]}, {"l": "Isa 66:2", "n": "", "vs": [[2, "جميع هذه صنعتها يدي فوجدت كلها، لكنني أسر بالرجل المتواضع المنسحق الروح الذي يرتعد من كلمتي."]]}, {"l": "Eze 9:4", "n": "", "vs": [[4, "وقال له الرب: «اجتز وسط مدينة أورشليم وارسم سمة على جباه الرجال الذين يئنون ويزفرون على كل ما ارتكب من أرجاس فيها»."]]}, {"l": "Mat 5:3", "n": "", "vs": [[3, "«طوبى للمساكين بالروح، فإن لهم ملكوت السماوات."]]}, {"l": "Mat 5:4", "n": "", "vs": [[4, "طوبى للحزانى، فإنهم سيعزون."]]}], "kwAr": "مزقوا", "noteAr": "وردت كلمة «مزقوا» هنا مرة واحدة لكن بمعنيين: ففي الجملة الأولى استُعملت مجازا، وفي الثانية حرفيا، إذ لا يتمزق القلب بالمعنى الذي تتمزق به الثياب. انظر 2مل 22: 19؛ مز 34: 18؛ 51: 17؛ إش 57: 15؛ 66: 2؛ حز 9: 4؛ مت 5: 3، 4"}, {"kw": "your garments", "raw": "Gen_37:29, Gen_37:34; 2Sa_1:11; 1Ki_21:27; 2Ki_5:7, 2Ki_6:30, 2Ki_22:11; Job_1:20; Isa_58:5; Mat_6:16-18; 1Ti_4:8", "note": "", "refs": [{"l": "Gen 37:29", "n": "", "vs": [[29, "ثم ذهب رأوبين إلى البئر لينقذ يوسف فلم يجده، فمزق ثيابه،"]]}, {"l": "Gen 37:34", "n": "", "vs": [[34, "فشق يعقوب ثيابه، وارتدى المسوح على حقويه، وناح على ابنه أياما عديدة."]]}, {"l": "2Sa 1:11", "n": "", "vs": [[11, "فمزق داود ورجاله الذين معه ثيابهم."]]}, {"l": "1Ki 21:27", "n": "", "vs": [[27, "وعندما سمع أخآب هذا القضاء، مزق ثيابه وارتدى مسحا، وصام واضطجع بثياب المسح ومشى ذليلا."]]}, {"l": "2Ki 5:7", "n": "", "vs": [[7, "فلما اطلع ملك إسرائيل على الرسالة مزق ثيابه وقال: «هل أنا الله حتى أميت وأحيي، فيرسل إلي هذا لكي أشفي رجلا من برصه؟ اعلموا أنه يحاول أن يجد مبررا لمحاربتنا»."]]}, {"l": "2Ki 6:30", "n": "", "vs": [[30, "فلما سمع الملك حديث المرأة مزق ثيابه وهو يتفقد السور، فرأى المحيطون به أنه كان يرتدي مسوحا فوق جسده."]]}, {"l": "2Ki 22:11", "n": "", "vs": [[11, "فلما سمع الملك ما ورد في سفر الشريعة مزق ثيابه،"]]}, {"l": "Job 1:20", "n": "", "vs": [[20, "فقام أيوب ومزق جبته وجز شعر رأسه وأكب على الأرض ساجدا،"]]}, {"l": "Isa 58:5", "n": "", "vs": [[5, "أيكون الصوم الذي أختاره في إذلال المرء نفسه يوما، أو في إحناء رأسه كالقصبة، أو افتراش المسح والرماد؟ أتدعو هذا صوما مقبولا لدى الرب؟"]]}, {"l": "Mat 6:16-18", "n": "", "vs": [[16, "وعندما تصومون، لا تكونوا عابسي الوجوه، كما يفعل المراؤون الذين يقطبون وجوههم لكي يظهروا للناس صائمين. الحق أقول لكم إنهم قد نالوا مكافأتهم."], [17, "أما أنت، فعندما تصوم، فاغسل وجهك، وعطر رأسك،"], [18, "لكي لا تظهر للناس صائما، بل لأبيك الذي في الخفاء. وأبوك الذي يرى في الخفاء، هو يكافئك."]]}, {"l": "1Ti 4:8", "n": "", "vs": [[8, "فالرياضة البدنية نافعة بعض الشيء. أما التقوى فنافعة لكل شيء، لأن فيها وعدا بالحياة الحاضرة والآتية."]]}], "kwAr": "ثيابكم", "noteAr": ""}, {"kw": "for", "raw": "Exo_34:6, Exo_34:7; Num_14:18; Psa_86:5, Psa_86:15, Psa_145:7-9; Jon_4:2; Mic_7:18; Rom_2:4; Rom_5:20,Rom_5:21; Eph_2:4", "note": "", "refs": [{"l": "Exo 34:6", "n": "", "vs": [[6, "وعبر من أمام موسى مناديا: «أنا الرب. الرب إله رؤوف رحيم، بطيء الغضب وكثير الإحسان والوفاء."]]}, {"l": "Exo 34:7", "n": "", "vs": [[7, "أدخر الإحسان وأغفر الإثم والمعصية والخطيئة. ولكني لا أعفي المذنب من العقاب، بل أفتقد إثم الآباء في الأبناء والأحفاد حتى الجيل الرابع»."]]}, {"l": "Num 14:18", "n": "", "vs": [[18, "الرب طويل الأناة، وافر الرحمة، يغفر الذنب والسيئة. لكنه لا يبريء، بل يفتقد ذنب الآباء في الأبناء إلى الجيل الثالث والرابع."]]}, {"l": "Psa 86:5", "n": "", "vs": [[5, "لأنك أنت يارب طيب وغفور، وكثير الرحمة لجميع الذين يدعونك."]]}, {"l": "Psa 86:15", "n": "", "vs": [[15, "إنما أنت يارب إله رحيم ورؤوف وبطيء الغضب ووافر الرحمة والحق."]]}, {"l": "Psa 145:7-9", "n": "", "vs": [[7, "يفيضون بذكر صلاحك العميم وبعدلك يترنمون."], [8, "الرب حنان ورحيم، بطيء الغضب ووافر الرأفة."], [9, "الرب يغمر الجميع بصلاحه، ومراحمه تعم كل أعماله."]]}, {"l": "Jon 4:2", "n": "", "vs": [[2, "وصلى إلى الرب قائلا: «أيها الرب، أليس هذا ما قلته عندما كنت في بلادي؟ لهذا أسرعت إلى الهرب إلى ترشيش، لأني عرفت أنك إله رحيم رؤوف بطيء الغضب كثير الإحسان، ترجع عن العقاب."]]}, {"l": "Mic 7:18", "n": "", "vs": [[18, "إي إله مثلك يصفح عن الإثم ويعفو عن معصية بقية ميراثه؟ لا يحتفظ إلى الأبد بغضبه لأنه يسر بالرحمة."]]}, {"l": "Rom 2:4", "n": "", "vs": [[4, "أم أنك تحتقر غنى لطفه وصبره وطول أناته وأنت لا تعرف أن لطف الله يدفعك إلى التوبة؟"]]}, {"l": "Rom 5:20", "n": "", "vs": [[20, "وأما الشريعة فقد أدخلت لتظهر كثرة المعصية. ولكن، حيث كثرت الخطيئة، تتوافر النعمة أكثر جدا،"]]}, {"l": "Rom 5:21", "n": "", "vs": [[21, "حتى إنه كما ملكت الخطيئة بالموت، فكذلك أيضا تملك النعمة على أساس البر مؤدية إلى الحياة الأبدية بيسوع المسيح ربنا."]]}, {"l": "Eph 2:4", "n": "", "vs": [[4, "أما الله ، وهو غني في الرحمة، فبسبب محبته العظيمة التي أحبنا بها،"]]}], "kwAr": "لأنه", "noteAr": ""}, {"kw": "slow", "raw": "Neh_9:17; Psa_103:8; Nah_1:3; Jam_1:19, Jam_1:20", "note": "", "refs": [{"l": "Neh 9:17", "n": "", "vs": [[17, "وأبوا أن يسمعوا، وتجاهلوا عجائبك التي أجريتها لهم، وأغلظوا قلوبهم، ثم تمردوا ونصبوا عليهم قائدا ليرجعوا إلى عبوديتهم، ولكنك إله غفور وحنان ورحيم وحكيم وكثير الإحسان، فلم تتخل عنهم،"]]}, {"l": "Psa 103:8", "n": "", "vs": [[8, "الرب رحيم ورؤوف، بطيء الغضب ووافر الرحمة."]]}, {"l": "Nah 1:3", "n": "", "vs": [[3, "الرب بطيء في غضبه وعظيم العزة، إنما لا يبريء الخاطيء البتة. طريق الرب في الزوبعة والعاصفة، والغمام غبار قدميه."]]}, {"l": "Jam 1:19", "n": "", "vs": [[19, "لذلك، ياإخوتي الأحباء، على كل واحد منكم أن يكون مسرعا إلى الإصغاء، غير متسرع في الكلام، بطيء الغضب."]]}, {"l": "Jam 1:20", "n": "", "vs": [[20, "لأن الإنسان، إذا غضب، لا يعمل الصلاح الذي يريده الله ."]]}], "kwAr": "بطيء", "noteAr": ""}, {"kw": "and repenteth", "raw": "Psa_106:45; Jer_18:7, Jer_18:8; Amo_7:2-6; Jon_4:2", "note": "", "refs": [{"l": "Psa 106:45", "n": "", "vs": [[45, "تذكر عهده لهم ورق لهم حسب كثرة رحمته،"]]}, {"l": "Jer 18:7", "n": "", "vs": [[7, "تارة أقضي على أمة وعلى مملكة بالاستئصال والهدم والدمار،"]]}, {"l": "Jer 18:8", "n": "", "vs": [[8, "فترتد تلك الأمة التي قضيت عليها بالعقاب عن شرها، فأكف عن الشر الذي نويت معاقبتها به."]]}, {"l": "Amo 7:2-6", "n": "", "vs": [[2, "وبعد أن فرغ الجراد من التهام عشب الأرض، قلت: «أيها السيد الرب، اصفح عن شعبك. إذ كيف يمكن ليعقوب أن ينهض، فإنه صغير؟»"], [3, "فعفا الرب عن هذا وقال: «لن يحدث ما رأيته»."], [4, "ثم هذا ما أراني السيد الرب: شاهدت السيد الرب يدعو للمحاكمة بالنار التي لعقت ا لطلب الرب إله آبائه، حتى لو لم يكن طاهرا وفق فرائض التطهير التي نصت عليها أحكام الهيكل»."]]}, {"l": "2Ch 35:6", "n": "", "vs": [[6, "واذبحوا حمل الفصح وتقدسوا. وهيئوا إخوتكم ليعملوا وفق شريعة الرب التي أعطاها لموسى»."]]}, {"l": "Job 1:5", "n": "", "vs": [[5, "وحالما تنقضي أيام الولائم كان أيوب يستدعي أبناءه ويقدسهم، فكان ينهض مبكرا في الصباح ويقرب محرقات على عددهم قائلا: «لئلا يكون بني قد أخطأوا في قلوبهم وجدفوا على الله». هذا ما واظب عليه أيوب دائما."]]}], "kwAr": "قدسوا", "noteAr": ""}, {"kw": "assemble", "raw": "Joe_1:14; Deu_29:10,Deu_29:11; 2Ch_20:13; Jon_3:7, Jon_3:8", "note": "", "refs": [{"l": "Joe 1:14", "n": "", "vs": [[14, "خصصوا صوما. نادوا بالاعتكاف. ادعوا الشيوخ وجميع سكان الأرض للاجتماع في هيكل الرب إلهكم وتضرعوا إليه."]]}, {"l": "Deu 29:10", "n": "", "vs": [[10, "أنتم ماثلون اليوم جميعكم في حضرة الرب إلهكم: رؤساؤكم وقادة أسباطكم وعرفاؤكم وسائر رجال إسرائيل،"]]}, {"l": "Deu 29:11", "n": "", "vs": [[11, "وأطفالكم ونساؤكم، والغرباء المقيمون فى وسطكم، ممن يحتطب لكم ويستقي لكم ماءكم،"]]}, {"l": "2Ch 20:13", "n": "", "vs": [[13, "وبينما كان كل بني يهوذا ماثلين في حضرة الرب مع أطفالهم ونسائهم وبنيهم،"]]}, {"l": "Jon 3:7", "n": "", "vs": [[7, "وأذاع في كل نينوى مرسوما ورد فيه: «بأمر من الملك ونبلائه، يمتنع الناس عن الأكل والشرب، وكذلك البهائم والغنم والبقر، لا ترع ولا تشرب ماء."]]}, {"l": "Jon 3:8", "n": "", "vs": [[8, "وعلى جميع الناس والبهائم أن يرتدوا المسوح، متضرعين إلى الله تائبين عن طرقهم الشريرة وعما ارتكبوه من ظلم."]]}], "kwAr": "احشدوا", "noteAr": ""}, {"kw": "let", "raw": "Zec_12:11-14; Mat_9:15; 1Co_7:5", "note": "", "refs": [{"l": "Zec 12:11-14", "n": "", "vs": [[11, "في ذلك اليوم يكون النواح في أورشليم مماثلا للنواح في هددرمون في سهل مجدو (حيث قتل الملك يوشيا)."], [12, "فيشيع النحيب بين أهل البلاد، فتنوح كل عشيرة على حدة، فيبكي رجال عشيرة داود منفردين عن النساء، والنساء عن الرجال، ورجال عشيرة ذرية ناثان منفردين عن النساء، والنساء عن الرجال."], [13, "وكذلك ينوح رجال ونساء عشيرة لاوي كل على حدة، ورجال ونساء عشيرة شمعي كل على حدة."], [14, "وأيضا ينوح رجال ونساء سائر العشائر الباقية كل على حدة»."]]}, {"l": "Mat 9:15", "n": "", "vs": [[15, "فقال لهم يسوع: «هل يقدر أهل العرس أن يحزنوا مادام العريس بينهم؟ ولكن، ستأتي أيام يكون فيها العريس قد رفع من بينهم، فعندئذ يصومون!"]]}, {"l": "1Co 7:5", "n": "", "vs": [[5, "فلا يمنع أحدكما الآخر عن نفسه إلا حين تتفقان معا على ذلك، ولفترة معينة، بقصد التفرغ للصلاة. وبعد ذلك عودا إلى علاقتكما السابقة، لكي لا يجربكما الشيطان لعدم ضبط النفس."]]}], "kwAr": "ليغادر", "noteAr": ""}], "arS": [["اجمعوا", ["H622"]], [" ", []], ["الشعب", ["H5971"]], ["، ", []], ["قدسوا", ["H6942"]], [" ", []], ["الجماعة", ["H6951"]], ["، ", []], ["احشدوا", ["H6908"]], [" ", []], ["الشيوخ", ["H2205"]], [" ", []], ["والأولاد", ["H5768"]], [" ", []], ["والرضع", ["H3243"]], [". ", []], ["ليغادر", ["H3318"]], [" ", []], ["العريس", ["H2860"]], [" ", []], ["مخدعه", ["H4480", "H2315"]], [" ", []], ["والعروس", ["H3618"]], [" ", []], ["حجرتها", ["H4480", "H2646"]], [".", []]]}, {"c": 2, "v": 17, "text": "ليبك الكهنة خدام الرب بين الرواق والمذبح قائلين: «اعف عن شعبك يارب ولا تجعل ميراثك مثار احتقار وهزء بين الأمم، فيقولوا بين الشعوب: أين إلههم؟»", "groups": [{"kw": "the priests", "raw": "Joe_1:9, Joe_1:13", "note": "", "refs": [{"l": "Joe 1:9", "n": "", "vs": [[9, "لأن تقدمات الدقيق والخمر قد انقطعت عن بيت الرب، وانتحب الكهنة خدام الرب."]]}, {"l": "Joe 1:13", "n": "", "vs": [[13, "أيها الكهنة اتشحوا بالمسوح ونوحوا. ولولوا ياخدام المذبح. تعالوا وبيتوا ليلتكم بالمسوح ياخدام إلهي، لأن تقدمات الدقيق والخمر قد منعت عن هيكل الله."]]}], "kwAr": "الكهنة", "noteAr": ""}, {"kw": "between", "raw": "1Ki_6:3; 2Ch_8:12; Eze_8:16; Mat_23:35", "note": "", "refs": [{"l": "1Ki 6:3", "n": "", "vs": [[3, "وكانت هناك شرفة أمام الهيكل طولها عشرون ذراعا (نحو عشرة أمتار) وعرضها عشر أذرع (نحو خمسة أمتار)"]]}, {"l": "2Ch 8:12", "n": "", "vs": [[12, "ثم قرب سليمان محرقات للرب على المذبح الذي شيده أمام الرواق،"]]}, {"l": "Eze 8:16", "n": "", "vs": [[16, "ثم أحضرني إلى الفناء الداخلي لبيت الرب، فإذا عند مدخل هيكل الرب بين الرواق والمذبح نحو خمسة وعشرين رجلا أداروا ظهورهم لهيكل الرب، واتجهوا بوجوههم نحو الشرق ساجدين للشمس."]]}, {"l": "Mat 23:35", "n": "", "vs": [[35, "وبهذا يقع عليكم كل دم زكي سفك على الأرض: من دم هابيل البار إلى دم زكريا بن برخيا الذي قتلتموه بين الهيكل والمذبح."]]}], "kwAr": "بين الرواق", "noteAr": ""}, {"kw": "and let", "raw": "Hos_14:2", "note": "", "refs": [{"l": "Hos 14:2", "n": "", "vs": [[2, "احملوا معكم كلام ابتهال وارجعوا إلى الرب قائلين له: «انزع إثمنا، وتقبلنا بفائق رحمتك، فنزجي إليك حمد شفاهنا كالقرابين."]]}], "kwAr": "قائلين", "noteAr": ""}, {"kw": "Spare", "raw": "Exo_32:11-13, Exo_34:9; Deu_9:16-29; Isa_37:20, Isa_64:9-12; Dan_9:18, Dan_9:19; Amo_7:2, Amo_7:5; Mal_1:9", "note": "", "refs": [{"l": "Exo 32:11-13", "n": "", "vs": [[11, "فابتهل موسى إلى الرب وقال: «لماذا يحتدم غضبك على شعبك الذي أخرجته من ديار مصر بقوة عظيمة وذراع مقتدرة؟"], [12, "لماذا يشمت المصريون فينا قائلين: لقد احتال عليهم إلههم فأخرجهم من ههنا ليهلكهم في الجبال ويفنيهم عن وجه الأرض. ارجع عن حمو غضبك ولا توقع هذا العقاب بشعبك."], [13, "اذكر وعودك لعبيدك إبراهيم وإسحق وإسرائيل الذين أقسمت لهم بنفسك قائلا: أكثر نسلكم كنجوم السماء، وأهبكم جميع هذه الأرض التي وعدت بها فتملكونها إلى الأبد»."]]}, {"l": "Exo 34:9", "n": "", "vs": [[9, "وقال: «إن حظيت برضاك أيها السيد، فليرافقنا الرب في مسيرنا. ومع أن هذا الشعب متصلب القلب. لكن اصفح عن إثمنا وخطيئتنا واتخذنا خاصة لك»."]]}, {"l": "Deu 9:16-29", "n": "", "vs": [[16, "وتطلعت وإذا بكم قد أخطأتم إلى الرب، وصغتم لأنفسكم عجلا مسبوكا، وضللتم سريعا عن السبيل الذي أوصاكم به الرب."], [17, "فأخذت اللوحين وألقيتهما من يدي وحطمتهما أمام أعينكم."], [18, "ثم انطرحت بذل أمام الرب أربعين نهارا وأربعين ليلة، كما في السابق، لا آكل خبزا ولا أشرب ماء، من جراء كل خطاياكم التي ارتكبتموها في عيني الرب لتغيظوه،"], [19, "لأنني جزعت من غضب الرب واحتدام سخطه عليكم، حتى أوشك أن يبيدكم. فاستجاب لي الرب أيضا في تلك المرة."], [20, "كما غضب الرب على هرون أيضا حتى كاد أن يهلكه، فصليت من أجله حينئذ، فقبل الرب تضرعي."], [21, "أما خطيئتكم، العجل الذي سبكتموه، فقد أخذته وأحرقته ودققته وطحنته جيدا، حتى استحال إلى غبار، ثم طرحت غباره في النهر المنحدر من الجبل."], [22, "وما لبثتم أن أسخطتم الرب في تبعيرة ومسة وقبروت هتأوة."], [23, "وحين أرسلكم الرب من قادش برنيع وأمر: اصعدوا لامتلاك الأرض التي وهبتها لكم، عصيتم أمر الرب إلهكم ولم تصدقوه، ولم تأتمروا بقوله،"], [24, "فأنتم حقا متمردون على الرب منذ أن عرفتكم."], [25, "فسقطت أمام الرب أربعين نهارا وأربعين ليلة، لأن الرب أعلن أنه عازم أن يقضي عليكم."], [26, "وابتهلت إلى الرب قائلا: ياسيد الرب، لا تهلك شعبك وميراثك الذي افتديته بقوتك العظيمة، وأخرجته من مصر بقدرة فائقة."], [27, "اذكر عبيدك إبراهيم وإسحق ويعقوب، وتغاض عن عناد هذا الشعب وإثمه وخطيئته،"], [28, "لئلا يقول أهل مصر الذين أخرجتنا من بينهم: لقد أخرجهم الرب ليهلكهم في البرية، لأنه عجز عن إدخالهم إلى الأرض التي وعدهم بها، ولأنه مقتهم."], [29, "إنهم شعبك وميراثك الذي أخرجته بقوتك العظيمة وقدرتك الفائقة."]]}, {"l": "Isa 37:20", "n": "", "vs": [[20, "فخلصنا الآن أيها الرب إلهنا، أنقذنا من يده، فتدرك ممالك الأرض بأسرها أنك أنت وحدك الرب الإله»."]]}, {"l": "Isa 64:9-12", "n": "", "vs": [[9, "لا توغل في غضبك علينا يارب، ولا تذكر الإثم إلى الأبد. إنما انظر إلينا، فكلنا شعبك."], [10, "قد استحالت مدينتك المقدسة إلى قفر، وأصبحت صهيون برية وأورشليم موحشة،"], [11, "واحترق بالنار هيكلنا المقدس البهي، الذي شدا آباؤنا فيه بتسبيحك، وصار كل ما هو أثير لدينا خرابا."], [12, "هل بعد هذا كله تسكت يارب، وتعتصم بالصمت وتنزل بنا أشد البلاء؟"]]}, {"l": "Dan 9:18", "n": "", "vs": [[18, "أرهف أذنك ياإلهي واستمع، وافتح عينيك وشاهد خرائبنا والمدينة التي دعي اسمك عليها، فإننا لا من أجل بر فينا نرفع تضرعاتنا إليك، بل بفضل مراحمك العظيمة."]]}, {"l": "Dan 9:19", "n": "", "vs": [[19, "فاستمع أيها السيد واغفر. أصغ أيها السيد وتصرف ولا تبطىء من أجل نفسك ياإلهي، لأن اسمك دعي على مدينتك وعلى شعبك»."]]}, {"l": "Amo 7:2", "n": "", "vs": [[2, "وبعد أن فرغ الجراد من التهام عشب الأرض، قلت: «أيها السيد الرب، اصفح عن شعبك. إذ كيف يمكن ليعقوب أن ينهض، فإنه صغير؟»"]]}, {"l": "Amo 7:5", "n": "", "vs": [[5, "عندئذ قلت: «أيها السيد الرب، كف عن هذا، إذ كيف يمكن ليعقوب أن ينهض، فإنه صغير؟»"]]}, {"l": "Mal 1:9", "n": "", "vs": [[9, "الآن التمسوا رضى الله ليرأف بنا، ولكن هل بمثل هذه القرابين المعتلة يرضى عنكم؟ يقول الرب القدير."]]}], "kwAr": "اعف", "noteAr": ""}, {"kw": "and give", "raw": "Psa_44:10-14, Psa_74:10,Psa_74:18-23, Psa_79:4, Psa_89:41, Psa_89:51; Eze_36:4-7", "note": "", "refs": [{"l": "Psa 44:10-14", "n": "", "vs": [[10, "جعلتنا نتقهقر أمام عدونا. أما مبغضونا فيغنمون لأنفسهم."], [11, "أسلمتنا كغنم معدة للذبح، وبددتنا بين الأمم."], [12, "بعت شعبك بلا مال وبثمنهم لم تربح."], [13, "تجعلنا عارا عند جيراننا، ومثار هزء وسخرية لمن حولنا."], [14, "تجعلنا مثلا بين الأمم وأضحوكة بين الشعوب."]]}, {"l": "Psa 74:10", "n": "", "vs": [[10, "ياالله : إلى متى يعيرنا الخصم؟ أيظل العدو يستهين باسمك إلى الأبد؟"]]}, {"l": "Psa 74:18-23", "n": "", "vs": [[18, "إنما اذكر أن عدوا قد عير الرب، وشعبا جاهلا قد استهان باسمك."], [19, "لا تسلم للوحش نفس شعبك الضعيف، ولا تنس إلى الأبد حياة جمهورك المضطهد."], [20, "اذكر العهد الذي قطعته لنا، فإن الظلم كامن في كل ركن مظلم من الأرض."], [21, "لا تدع المنسحق يرجع بالخزي، بل ليسبح اسمك الفقير والبائس."], [22, "قم ياالله ودافع عن دعواك. اذكر كيف يعيرك الجاهل طول النهار."], [23, "لا تنس أصوات خصومك، فإن ضجيج الثائرين عليك يتصاعد دائما."]]}, {"l": "Psa 79:4", "n": "", "vs": [[4, "قد صرنا عارا عند جيراننا، ومثار هزء وأضحوكة لمن حولنا."]]}, {"l": "Psa 89:41", "n": "", "vs": [[41, "نهبه كل عابري السبيل، وصار هزأة عند جيرانه."]]}, {"l": "Psa 89:51", "n": "", "vs": [[51, "العار الذي عيرنا به أعداؤك يارب، إذ عيروا خطوات الملك الذي مسحته."]]}, {"l": "Eze 36:4-7", "n": "", "vs": [[4, "لذلك اسمعي ياجبال إسرائيل وحي السيد الرب للجبال والآكام والأنهار والأودية وللخرائب المقفرة وللمدن المهجورة التي صارت نهبا لبقية الأمم المحيطة بها ومثار استهزاء:"], [5, "ها أنا في أثناء احتدام نار غيرتي أصدرت قضائي على بقية الأمم وعلى أدوم قاطبة، الذين اغتصبوا أرضي ميراثا لهم، بقلوب مغتبطة ونفوس حاقدة لتكون لهم نهبا وغنيمة."], [6, "لذلك تنبأ عن أرض إسرائيل وقل للجبال والتلال والأودية: هذا ما يعلنه السيد الرب: ها أنا في غيرتي وسخطي قد أصدرت قضائي لأنكم قد تحملتم تعيير الأمم،"], [7, "فأقسمت أن تتحمل الأمم المحيطة بكم عار أنفسهم."]]}], "kwAr": "ولا تجعل", "noteAr": ""}, {"kw": "that", "raw": "Neh_9:36; Isa_63:17-19", "note": "", "refs": [{"l": "Neh 9:36", "n": "", "vs": [[36, "وها نحن اليوم مستعبدون في الأرض التي وهبتها لآبائنا ليأكلوا أثمارها وخيرها."]]}, {"l": "Isa 63:17-19", "n": "", "vs": [[17, "لماذا يارب تركتنا نضل عن طرقك وقسيت قلوبنا حتى لم نعد نتقيك؟ ارجع إلينا من أجل عبيدك، أسباط ميراثك."], [18, "قد داس أعداؤنا هيكلك الذي امتلكه شعبك المقدس زمنا يسيرا،"], [19, "وأصبحنا نظير الذين لم تتسلط عليهم قط ولم يدع عليهم باسمك."]]}], "kwAr": "احتقار", "noteAr": ""}, {"kw": "rule over them", "raw": "or, use a byword against them, Deu_28:37; 1Ki_9:7; 2Ch_7:20; Psa_44:14", "note": "or, use a byword against them, Deu_28:37; 1Ki_9:7; 2Ch_7:20; Psa_44:14", "refs": [{"l": "Deu 28:37", "n": "", "vs": [[37, "وتصبحون مثار دهشة وسخرية وعبرة في نظر جميع الشعوب التي ينفيكم الرب إليهم"]]}, {"l": "1Ki 9:7", "n": "", "vs": [[7, "فإني أبيد إسرائيل عن وجه الأرض التي وهبتها لهم، وأنبذ الهيكل الذي قدسته لاسمي، فيصبح إسرائيل مثلا ومثار هزء لجميع الأمم."]]}, {"l": "2Ch 7:20", "n": "", "vs": [[20, "فإنني أستأصلكم من أرضي التي وهبتها لكم، وأنبذ هذا الهيكل الذي قدسته لاسمي، وأجعله مثلا ومثار هزء لجميع الأمم."]]}, {"l": "Psa 44:14", "n": "", "vs": [[14, "تجعلنا مثلا بين الأمم وأضحوكة بين الشعوب."]]}], "kwAr": "وهزء", "noteAr": "أو: «يتخذوهم مثلا». انظر تث 28: 37؛ 1مل 9: 7؛ 2أخ 7: 20؛ مز 44: 14"}, {"kw": "wherefore", "raw": "Num_14:14-16; Deu_32:27; Psa_42:10, Psa_79:10, Psa_115:2; Eze_20:9; Mic_7:10; Mat_27:43", "note": "", "refs": [{"l": "Num 14:14-16", "n": "", "vs": [[14, "ويخبرون به أهل هذه الأرض، الذين قد سمعوا يارب أنك قائم في وسط هذا الشعب، وأنك قد ظهرت لهم وجها لوجه تظللهم بحمايتك، وتسير أمامهم في عمود سحاب نهارا وفي عمود نار ليلا."], [15, "فإن أهلكت هذا الشعب دفعة واحدة، فإن الأمم التي سمعت بخبرك تقول"], [16, "إنك قد عجزت عن أن تدخل هذا الشعب إلى الأرض التي وعدتهم بها، فأهلكتهم في الصحراء."]]}, {"l": "Deu 32:27", "n": "", "vs": [[27, "لولا خوفي من تبجح العدو،  2:15", "n": "", "vs": [[15, "وأرد لها كرومها هناك، وأجعل من وادي عخور (أي وادي الإزعاج) بابا للرجاء، فتتجاوب معي كالعهد بها في أيام صباها، حين خرجت من ديار مصر."]]}, {"l": "Amo 9:13", "n": "", "vs": [[13, "ها أيام تأتي يقول الرب، يدرك فيها الحارث الحاصد، ودائس العنب باذر الحب، وتسيل الخمور الطيبة من كروم الجبال وتفيض بها التلال كلها."]]}, {"l": "Amo 9:14", "n": "", "vs": [[14, "وأرد سبي شعبي إسرائيل فيعيدون بناء المدن الخربة ويسكنونها، ويزرعون كروما ويشربون من خمرها، ويغرسون جنات ويأكلون من ثمارها."]]}, {"l": "Hag 2:16-19", "n": "", "vs": [[16, "عندما كان يقبل أحد على كومة حبوب ظنا منه أن الأرض قد غلت عشرين مكيالا، يجد أنها لم تغل سوى عشرة فقط. وحين يدنو من المعصرة ليغرف ملء خمسين وعاء، لا يجد إلا عشرين."], [17, "إني ابتليت تعب أيديكم بالقحط والذبول والبرد، ولكنكم لم ترجعوا تائبين إلي، يقول الرب."], [18, "ولكن تأملوا فيما يجري منذ هذا اليوم وصاعدا، من اليوم الرابع والعشرين من الشهر التاسع، منذ أن تم وضع أساس هيكل الرب. تأملوا."], [19, "هل في الأهراء بذار بعد؟ حتى الكروم والتين والرمان والزيتون لم تثمر بعد. لكن منذ هذا اليوم أبارك فيها»."]]}, {"l": "Mal 3:10-12", "n": "", "vs": [[10, "هاتوا العشور جميعها إلى بيت الخزينة ليتوافر في هيكلي طعام، واختبروني لتروا إن كنت لا أفتح كوى السماء وأفيض عليكم بركة وفيرة، يقول الرب القدير."], [11, "وأكف عنكم أذى الجراد الملتهم، فلا يتلف لكم غلات الأرض، ولا تصاب كرومكم بالعقم، يقول الرب القدير."], [12, "عندئذ تدعوكم جميع الشعوب «بالأمة المباركة» لأن أرضكم تكون أوض بهجة، يقول الرب القدير."]]}, {"l": "Mat 6:33", "n": "", "vs": [[33, "أما أنتم، فاطلبوا أولا ملكوت الله وبره، وهذه كلها تزاد لكم."]]}], "kwAr": "ها أنا أنعم", "noteAr": ""}, {"kw": "and ye", "raw": "Joe_2:26", "note": "", "refs": [{"l": "Joe 2:26", "n": "", "vs": [[26, "فتأكلون بوفرة وتشبعون وتسبحون اسم الرب إلهكم الذي أجرى لكم العجائب، ولن يخزى شعبي ثانية."]]}], "kwAr": "فتشبعون", "noteAr": ""}, {"kw": "and I", "raw": "Eze_34:29, Eze_36:15, Eze_39:29", "note": "", "refs": [{"l": "Eze 34:29", "n": "", "vs": [[29, "وأقيم لهم مغرسا ذائع الصيت، فلا يكونون بعد ضحايا مجاعة في ا 20", "n": "", "vs": [[18, "لكم أنت البهائم، وشردت المواشي إذ افتقرت إلى المرعى. حتى قطعان الغنم هلكت أيضا."], [19, "إليك يارب أصرخ لأن النار قد التهمت مراعي البرية، وأحرق اللهيب كل أشجار الحقل."], [20, "حتى الحيوانات البرية استغاثت بك، لأن مياه الجداول الجارية قد جفت، والتهمت النيران مراعي البرية."]]}, {"l": "Psa 36:6", "n": "", "vs": [[6, "عدلك ثابت مثل الجبال الشامخة، وأحكامك كالغور السحيق. وأنت يارب تحفظ الناس والبهائم جميعا."]]}, {"l": "Psa 104:11-14", "n": "", "vs": [[11, "تسقي جميع حيوانات البرية، وتروي منها حمير الوحش عطشها."], [12, "إلى جوارها تعشش طيور السماء، وتغرد بين الأغصان."], [13, "تسقي الجبال من أمطار سمائك، وتمتلىء الأرض من أثمار أعمالك."], [14, "أنت المنبت عشبا للبهائم وخضرة لخدمة الإنسان، لإنتاج خبز من الأرض،"]]}, {"l": "Psa 104:27-29", "n": "", "vs": [[27, "تلتفت جميعها إليك كي ترزقها طعامها في أوانه."], [28, "أنت تعطيها وهي تلتقط، تبسط يدك لها فتشبع خيرا."], [29, "تحجب عنها وجهك فتفزع. تقبض أرواحها فتموت، وإلى ترابها تعود."]]}, {"l": "Psa 145:15", "n": "", "vs": [[15, "بك تتعلق أعين الناس راجية وأنت ترزقهم طعامهم في أوانه."]]}, {"l": "Psa 145:16", "n": "", "vs": [[16, "تبسط يدك فتشبع رغبة كل مخلوق حي."]]}, {"l": "Psa 147:8", "n": "", "vs": [[8, "فهو يكسو السماوات سحابا ويمطر على الأرض، وينبت العشب على الجبال."]]}, {"l": "Psa 147:9", "n": "", "vs": [[9, "يهب الطعام للبهائم، ولفراخ الغربان الناعقة."]]}, {"l": "Isa 30:23", "n": "", "vs": [[23, "ويسكب الرب مطره على بذورك التي تزرعها في الأرض، فيكون الطعام الذي تغله من الأرض سمينا دسما، فترعى مواشيك في ذلك اليوم في مراع فسيحة،"]]}, {"l": "Isa 30:24", "n": "", "vs": [[24, "وتأكل ثيرانك وحميرك التي تحرث الأرض علفا مملحا مذرى بالرفش والمذراة."]]}, {"l": "Jon 4:11", "n": "", "vs": [[11, "أفلا أشفق أنا على نينوى المدينة العظيمة التي يقيم فيها أكثر من مئة وعشرين ألف شخص ممن لا يفرقون بين يمينهم وشمالهم، فضلا عما فيها من بهائم كثيرة؟»."]]}], "kwAr": "لا تخافي", "noteAr": ""}, {"kw": "for the pastures", "raw": "Joe_1:19; Psa_65:12; Isa_51:3", "note": "", "refs": [{"l": "Joe 1:19", "n": "", "vs": [[19, "إليك
