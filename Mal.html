<script>window.CATALOG=[{"id": 17, "abbr": "Est", "en": "Esther", "nc": 10, "nv": 167, "refs": 1266, "last": "10:3", "first": "وحدث في أيام أحشويروش، الذي امتد حكمه من الهند إلى كوش، فملك على مئة وسبعة وعشرين إقليما،"}, {"id": 18, "abbr": "Job", "en": "Job", "nc": 42, "nv": 1070, "refs": 10209, "last": "42:17", "first": "عاش في أرض عوص رجل اسمه أيوب، كان صالحا كاملا يتقي الله ويحيد عن الشر."}, {"id": 19, "abbr": "Psa", "en": "Psalms", "nc": 150, "nv": 2461, "refs": 33395, "last": "150:6", "first": "طوبى للإنسان الذي لا يتبع مشورة الأشرار، ولا يقف في طريق الخاطئين، ولا يجالس المستهزئين."}, {"id": 20, "abbr": "Pro", "en": "Proverbs", "nc": 31, "nv": 915, "refs": 10457, "last": "31:31", "first": "هذه هي أمثال سليمان بن داود ملك إسرائيل،"}, {"id": 21, "abbr": "Ecc", "en": "Ecclesiastes", "nc": 12, "nv": 222, "refs": 3186, "last": "12:14", "first": "هذه أقوال الجامعة ابن داود ملك أورشليم."}, {"id": 22, "abbr": "Son", "en": "Song of Solomon", "nc": 8, "nv": 117, "refs": 1802, "last": "8:14", "first": "هذا نشيد الأناشيد لسليمان."}, {"id": 23, "abbr": "Isa", "en": "Isaiah", "nc": 66, "nv": 1292, "refs": 21959, "last": "66:24", "first": "هذه هي رؤيا إشعياء بن آموص، التي أعلنت له بشأن يهوذا وأورشليم في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا."}, {"id": 24, "abbr": "Jer", "en": "Jeremiah", "nc": 52, "nv": 1364, "refs": 20659, "last": "52:34", "first": "هذه نبوءة إرميا بن حلقيا أحد الكهنة المقيمين في عناثوث بأرض سبط بنيامين."}, {"id": 25, "abbr": "Lam", "en": "Lamentations", "nc": 5, "nv": 154, "refs": 2238, "last": "5:22", "first": "كيف أصبحت المدينة الآهلة بالسكان مهجورة وحيدة؟ صارت كأرملة! هذه التي كانت عظيمة بين الأمم. السيدة بين المدن صارت تحت الجزية!"}, {"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 48, "nv": 1273, "refs": 15264, "last": "48:35", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 39, "abbr": "Mal", "en": "Malachi", "verses": [{"c": 1, "v": 1, "text": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:", "groups": [{"kw": "burden", "raw": "Isa_13:1; Hab_1:1; Zec_9:1, Zec_12:1", "note": "", "refs": [{"l": "Isa 13:1", "n": "", "vs": [[1, "رؤيا إشعياء بن آموص بشأن بابل:"]]}, {"l": "Hab 1:1", "n": "", "vs": [[1, "هذه رؤيا حبقوق النبي:"]]}, {"l": "Zec 9:1", "n": "", "vs": [[1, "وحي قضاء الرب بعقاب أرض حدراخ ودمشق، لأن أعين الناس وسائر أسباط إسرائيل نحو الرب."]]}, {"l": "Zec 12:1", "n": "", "vs": [[1, "وحي كلمة الرب بشأن إسرائيل. يقول الرب باسط السماوات ومرسي الأرض، وجابل روح الإنسان فيه:"]]}], "kwAr": "كلمة الرب", "noteAr": ""}, {"kw": "by", "raw": "Heb. by the hand of, Hag_1:1, Hag_2:1 *marg.", "note": "Heb. by the hand of, Hag_1:1, Hag_2:1 *marg.", "refs": [{"l": "Hag 1:1", "n": "", "vs": [[1, "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"]]}, {"l": "Hag 2:1", "n": "*marg.", "vs": [[1, "وفي اليوم الحادي والعشرين من الشهر السابع (أي شهر تشرين الأول ; أكتوبر) أوحى الرب بهذه الكلمة إلى حجي النبي:"]]}], "kwAr": "على لسان", "noteAr": "بالعبرية: «بيد». انظر حج 1: 1؛ 2: 1"}], "arS": [["هذه ", []], ["كلمة", ["H1697"]], [" ", []], ["الرب", ["H3068"]], [" التي ", []], ["أوحى", ["H4853"]], [" بها بشأن ", []], ["إسرائيل", ["H3478"]], [" على ", []], ["لسان", ["H3027"]], [" ", []], ["ملاخي", ["H4401"]], [":", []]]}, {"c": 1, "v": 2, "text": "«يقول الرب: إنني أحببتكم، ولكنكم تسألون: كيف أحببتنا؟ ويجيب الرب: أليس عيسو أخا ليعقوب؟ ومع ذلك أحببت يعقوب،", "groups": [{"kw": "I have", "raw": "The prophet shows in Mal_1:2-5 how much Jacob and the Israelites were favoured by Jehovah, more than Esau and the Edomites. Through every period of the history of Jacobs posterity, they could not deny that God had remarkably appeared on their behalf; but he had rendered the heritage of Esaus descendants, by wars and various other means, barren and waste forever. Deu_7:6-8, Deu_10:15, Deu_32:8-14; Isa_41:8, Isa_41:9, Isa_43:4; Jer_31:3; Rom_11:28, Rom_11:29", "note": "The prophet shows in Mal_1:2-5 how much Jacob and the Israelites were favoured by Jehovah, more than Esau and the Edomites. Through every period of the history of Jacobs posterity, they could not deny that God had remarkably appeared on their behalf; but he had rendered the heritage of Esaus descendants, by wars and various other means, barren and waste forever. Deu_7:6-8, Deu_10:15, Deu_32:8-14; Isa_41:8, Isa_41:9, Isa_43:4; Jer_31:3; Rom_11:28, Rom_11:29", "refs": [{"l": "Mal 1:2-5", "n": "", "vs": [[2, "«يقول الرب: إنني أحببتكم، ولكنكم تسألون: كيف أحببتنا؟ ويجيب الرب: أليس عيسو أخا ليعقوب؟ ومع ذلك أحببت يعقوب،"], [3, "وأبغضت عيسو، وحولت جباله إلى أراض موحشة، وجعلت ميراثه لبنات آوى البرية."], [4, "وإن قال الأدوميون: مع إننا تحطمنا فإننا نبني الخرب، فإن الرب القدير يقول: هم يعمرون وأنا أهدم، ويدعو الناس بلادهم، «أرض النفاق»، وأهلها بالأمة التي سخط الرب عليها إلى الأبد."], [5, "وتشهد عيونكم هذا، وتقولون ما أعظم الرب الذي يمتد سلطانه إلى ما وراء تخوم إسرائيل."]]}, {"l": "Deu 7:6-8", "n": "", "vs": [[6, "لأنكم شعب مقدس للرب إلهكم. فإياكم قد اختار الرب إلهكم من بين جميع شعوب الأرض لتكونوا شعبه الخاص."], [7, "ولم يفضلكم الرب ويتخيركم لأنكم أكثر عددا من سائر الشعوب، فأنتم أقل الأمم عددا."], [8, "بل من محبته، وحفاظا على القسم الذي أقسم به لآبائكم، أخرجكم بقوة فائقة، وفداكم من نير عبودية فرعون ملك مصر."]]}, {"l": "Deu 10:15", "n": "", "vs": [[15, "غير أن الرب فضل آباءكم واصطفى ذريتهم من بعدهم، التي هي أنتم، لتكونوا فوق جميع أمم الأرض، كما هو حادث اليوم."]]}, {"l": "Deu 32:8-14", "n": "", "vs": [[8, "عندما قسم العلي الميراث على الأمم، وحين فرق بني آدم، أقام حدودا للشعوب على عدد بني إسرائيل،"], [9, "لأن نصيب الرب هو شعبه، وأبناء يعقوب قرعة ميراثه."], [10, "وجدهم في أرض قفر وفي خلاء موحش. فأحاط بهم ورعاهم وصانهم كحدقة عينه."], [11, "وكما يهز النسر عشه، ويرف على فراخه، باسطا جناحيه ليأخذها ويحملها على منكبيه،"], [12, "هكذا الرب وحده قاد شعبه، وليس معه إله غريب."], [13, "أصعدهم على هضاب الأرض فأكلوا ثمار الصحراء، وغذاهم بعسل من صخر، وزيت من حجر الصوان،"], [14, "وزبدة البقر ولبن الغنم وشحم خراف وتيوس وخيار كباش باشان، وأفضل لب الحنطة، وسقاهم دم العنب القاني."]]}, {"l": "Isa 41:8", "n": "", "vs": [[8, "أما أنت ياإسرائيل عبدي. يايعقوب الذي اصطفيته، ياذرية إبراهيم خليلي،"]]}, {"l": "Isa 41:9", "n": "", "vs": [[9, "يامن أخذتك من أقاصي الأرض، ودعوتك من أبعد أطرافها قائلا لك: أنت عبدي. لقد اصطفيتك ولم أنبذك."]]}, {"l": "Isa 43:4", "n": "", "vs": [[4, "إذ أصبحت كريما في عيني، وعزيزا ومحبوبا، فقد بادلت أناسا بك، وقايضت أمما عوضا عن حياتك."]]}, {"l": "Jer 31:3", "n": "", "vs": [[3, "ظهر لي الرب قائلا: «أحببتكم حبا أبديا، لذلك اجتذبتكم إلي برحمة."]]}, {"l": "Rom 11:28", "n": "", "vs": [[28, "ففيما يتعلق بالإنجيل، هم أعداء الله من أجلكم. وأما فيما يتعلق بالاختيار الإلهي فهم محبوبون من أجل الآباء."]]}, {"l": "Rom 11:29", "n": "", "vs": [[29, "فإن الله لا يتراجع أبدا عن هباته ودعوته."]]}], "kwAr": "إنني أحببتكم", "noteAr": "يبين النبي في ملاخي 1: 2-5 كم كان يعقوب وبنو إسرائيل محظيين عند الرب أكثر من عيسو والأدوميين. ففي كل عصر من تاريخ نسل يعقوب لم يستطيعوا إنكار أن الله ظهر لهم ظهورا عجيبا، بينما جعل ميراث نسل عيسو بالحروب وغيرها قفرا خربا إلى الأبد. انظر تث 7: 6-8؛ 10: 15؛ 32: 8-14؛ إش 41: 8، 9؛ 43: 4؛ إر 31: 3؛ رو 11: 28، 29"}, {"kw": "Wherein", "raw": "Mal_1:6, Mal_1:7, Mal_2:17, Mal_3:7, Mal_3:8, Mal_3:13, Mal_3:14; Jer_2:5, Jer_2:31; Luk_10:29", "note": "", "refs": [{"l": "Mal 1:6", "n": "", "vs": [[6, "إن الابن يكرم أباه والعبد سيده. فإن كنت أنا حقا أبا فأين كرامتي؟ وإن كنت حقا سيدا فأين مهابتي؟ إن الرب القدير يقول لكم: أيها الكهنة المزدرون باسمي؛ فتسألون: كيف ازدرينا باسمك؟"]]}, {"l": "Mal 1:7", "n": "", "vs": [[7, "فيجيب: لأنكم تقربون على مذبحي خبزا نجسا. ثم تتساءلون: بم نجسناك؟ فيرد: بظنكم أن مائدة الرب مزدراة."]]}, {"l": "Mal 2:17", "n": "", "vs": [[17, "قد أتعبتم الرب بكلامكم، وما برحتم تتساءلون: كيف أتعبناه؟ أتعبتموه بقولكم: كل من يرتكب الشر هو صالح في عيني الرب وهو يسر بهم، أو بسؤالكم: أين هو إله العدل؟»"]]}, {"l": "Mal 3:7", "n": "", "vs": [[7, "إن شأنكم كشأن آبائكم. ابتعدتم عن فرائضي ولم تطيعوها. ارجعوا إلي فأرجع إليكم، يقول الرب القدير، ولكنكم تسألون كيف نرجع؟"]]}, {"l": "Mal 3:8", "n": "", "vs": [[8, "أيسلب الإنسان الله ؟ لقد سلبتموني! وتسألون: بماذا سلبناك؟ في العشور والقرابين."]]}, {"l": "Mal 3:13", "n": "", "vs": [[13, "لقد قسوتم في كلامكم علي يقول الرب، ومع ذلك تقولون: بماذا تكلمنا ضدك؟"]]}, {"l": "Mal 3:14", "n": "", "vs": [[14, "لقد قلتم: من العبث عبادة الله، وأي جدوى من حفظنا شعائره، والنواح أمام حضرة الرب القدير؟"]]}, {"l": "Jer 2:5", "n": "", "vs": [[5, "أي خطأ وجده في آباؤكم حتى نبذوني وضلوا وراء الباطل وصاروا باطلا؟"]]}, {"l": "Jer 2:31", "n": "", "vs": [[31, "وأنت أيها الجيل، اسمع قضاء الرب: أكنت صحراء لإسرائيل أو أرض ظلام دامس؟ إذا لماذا يقول شعبي: نحن طليقون نسعى حيث شئنا، ولن نقبل إليك بعد؟"]]}, {"l": "Luk 10:29", "n": "", "vs": [[29, "لكنه إذ كان راغبا في تبرير نفسه، سأل يسوع: «ومن هو قريبي؟»"]]}], "kwAr": "كيف أحببتنا", "noteAr": ""}, {"kw": "yet I", "raw": "Gen_25:23, Gen_27:27-30,Gen_27:33, Gen_28:3, Gen_28:4, Gen_28:13, Gen_28:14, Gen_32:28-30, Gen_48:4; Rom_9:10-13", "note": "", "refs": [{"l": "Gen 25:23", "n": "", "vs": [[23, "فقال لها الرب: «في أحشائك أمتان، يتفرع منهما شعبان. شعب يستقوي على شعب، وكبير يستعبد لصغير»."]]}, {"l": "Gen 27:27-30", "n": "", "vs": [[27, "فاقترب منه وقبله، فتنسم رائحة ثيابه وباركه قائلا: «ها إن رائحة ابني كرائحة حقل باركه الرب،"], [28, "فلينعم عليك الرب من ندى السماء ومن خيرات الأرض، فيكثر لك الحنطة والخمر."], [29, "لتخدمك الشعوب، وتسجد لك القبائل، لتكن سيدا على إخوتك. وبنو أمك لك ينحنون. وليكن لاعنوك ملعونين، ومباركوك مباركين»."], [30, "ولما فرغ إسحق من مباركة يعقوب، وخرج يعقوب من عند أبيه، رجع عيسو من صيده،"]]}, {"l": "Gen 27:33", "n": "", "vs": [[33, "فارتعد إسحق بعنف وقال: «من هو إذا الذي اصطاد صيدا وأحضره إلي فأكلت من الكل قبل أن تجيء، وباركته؟ وحقا يكون مباركا»."]]}, {"l": "Gen 28:3", "n": "", "vs": [[3, "وليباركك الله القدير وينمك ويكثرك لتكون أمة تتفرع منها شعوب كثيرة،"]]}, {"l": "Gen 28:4", "n": "", "vs": [[4, "وليعطك أنت وذريتك معك بركة إبراهيم لترث أرض غربتك التي تقيم فيها الآن؛ هذه الأرض التي وهبها الله لإبراهيم»."]]}, {"l": "Gen 28:13", "n": "", "vs": [[13, "والرب نفسه واقف فوقها يقول: «أنا هو الرب إله أبيك إبراهيم وإله إسحق. إن الأرض التي ترقد عليها الآن أعطيها لك ولذريتك،"]]}, {"l": "Gen 28:14", "n": "", "vs": [[14, "التي ستكون كتراب الأرض، وتمتد غربا وشرقا، وشمالا وجنوبا، وتتبارك بك وبذريتك جميع شعوب الأرض."]]}, {"l": "Gen 32:28-30", "n": "", "vs": [[28, "فقال: «لا يدعى اسمك في ما بعد يعقوب، بل إسرائيل (ومعناه: يجاهد مع الله)، لأنك جاهدت مع الله والناس وقدرت»."], [29, "فسأله يعقوب: «أخبرني ما اسمك؟» فقال: «لماذا تسأل عن اسمي؟» وباركه هناك."], [30, "ودعا يعقوب اسم المكان فنيئيل (ومعناه: وجه الله) إذ قال: «لأني شاهدت الله وجها لوجه وبقيت حيا»."]]}, {"l": "Gen 48:4", "n": "", "vs": [[4, "وقال لي: ها أنا أجعلك مثمرا، وأكثرك ويخرج من صلبك جمهور شعوب وأهب ذريتك هذه الأرض ملكا أبديا."]]}, {"l": "Rom 9:10-13", "n": "", "vs": [[10, "ليس ذلك فقط، بل إن رفقة أيضا، وقد حبلت من رجل واحد، من إسحاق أبينا،"], [11, "ولم يكن الولدان قد ولدا بعد ولا فعلا خيرا أو شرا، وذلك كي يبقى قصد الله من جهة الاختيار"], [12, "لا على أساس الأعمال بل على أساس دعوة منه، قيل لها: «إن الولد الأكبر يكون عبدا للأصغر»،"], [13, "كما قد كتب: «أحببت يعقوب، وأبغضت عيسو»."]]}], "kwAr": "ومع ذلك أحببت", "noteAr": ""}], "arS": [["«", []], ["يقول", ["H559"]], [" ", []], ["الرب", ["H3068"]], [": إنني ", []], ["أحببتكم", ["H157"]], ["، ولكنكم ", []], ["تسألون", ["H559"]], [": ", []], ["كيف", ["H4100"]], [" ", []], ["أحببتنا", ["H157"]], ["؟ ", []], ["ويجيب", ["H5002"]], [" ", []], ["الرب", ["H3068"]], [": ", []], ["أليس", ["H3808"]], [" ", []], ["عيسو", ["H6215"]], [" ", []], ["أخا", ["H251"]], [" ", []], ["ليعقوب", ["H3290"]], ["؟ ومع ذلك ", []], ["أحببت", ["H157"]], [" ", []], ["يعقوب", ["H3290"]], ["،", []]]}, {"c": 1, "v": 3, "text": "وأبغضت عيسو، وحولت جباله إلى أراض موحشة، وجعلت ميراثه لبنات آوى البرية.", "groups": [{"kw": "hated", "raw": "Gen_29:30,Gen_29:31; Deu_21:15, Deu_21:16; Luk_14:26", "note": "", "refs": [{"l": "Gen 29:30", "n": "", "vs": [[30, "فدخل يعقوب على راحيل أيضا، وأحب راحيل أكثر من ليئة. وخدم خاله سبع سنين أخر."]]}, {"l": "Gen 29:31", "n": "", "vs": [[31, "وعندما رأى الرب أن ليئة مكروهة جعلها منجبة، أما راحيل فكانت عاقرا."]]}, {"l": "Deu 21:15", "n": "", "vs": [[15, "إن كان رجل متزوجا من امرأتين، يؤثر إحداهما وينفر من الأخرى، فولدت كلتاهما له أبناء، وكان الابن البكر من إنجاب المكروهة،"]]}, {"l": "Deu 21:16", "n": "", "vs": [[16, "فحين يوزع ميراثه على أبنائه، لا يحل له أن يقدم ابن الزوجة الأثيرة ليجعله بكره في الميراث على بكره ابن الزوجة المكروهة."]]}, {"l": "Luk 14:26", "n": "", "vs": [[26, "«إن جاء إلي أحد، ولم يبغض أباه وأمه وزوجته وأولاده وإخوته وأخواته، بل نفسه أيضا، فلا يمكنه أن يكون تلميذا لي."]]}], "kwAr": "وأبغضت", "noteAr": ""}, {"kw": "laid", "raw": "Isa_34:9-12; Jer_49:16-18; Eze_25:13, Eze_25:14, Eze_36:3, Eze_36:4, Eze_36:7, Eze_36:9, Eze_36:14, Eze_36:15; Joe_3:19; Oba_1:10,Oba_1:18, Oba_1:19-21", "note": "", "refs": [{"l": "Isa 34:9-12", "n": "", "vs": [[9, "فتنقلب أنهار أدوم إلى زفت، وترابهم إلى كبريت، وتصبح أرضها قارا مشتعلا."], [10, "فلا تنطفيء ليلا ونهارا، ويحلق دخانها إلى الفضاء مدى الدهر، وتظل خرابا جيلا بعد جيل، فلا يعبر بها أحد إلى الأبد،"], [11, "ولا يرثها سوى الصقور والقنافذ، ويسكن فيها البوم والغراب، ويمد الرب عليها خيط الدمار ومطمار الهلاك،"], [12, "ولا يجد فيها أشرافها أثرا للملك، وينقرض جميع رؤسائها."]]}, {"l": "Jer 49:16-18", "n": "", "vs": [[16, "قد خدعك ما تثيره من رعب، وأغوتك كبرياء قلبك، يامن تقيم في شقوق الصخر وتعتصم بقمة التل. ولكنني سأطرحك من هناك ولو بنيت عشك عاليا كعش النسر، يقول الرب."], [17, "ستصبح أدوم مثار رعب، وكل من يمر بها تعتريه رعدة، ويصفر من جراء كل نكباتها،"], [18, "ويصيبها ما أصاب سدوم وعمورة وما جاورهما، من انقلاب، يقول الرب، فلا يسكن هناك إنسان ولا يتغرب فيها أحد."]]}, {"l": "Eze 25:13", "n": "", "vs": [[13, "ها أنا أعاقب الأدوميين وأستأصل من أرضهم الإنسان والحيوان، وأحولها إلى أطلال دارسة من التيمن إلى ددان، إذ يقتل أهلها جميعا بالسيف."]]}, {"l": "Eze 25:14", "n": "", "vs": [[14, "وأعهد بنقمتي إلى شعبي إسرائيل، فيفعلون بالأدوميين بمقتضى غضبي وسخطي، فيدركون شدة نقمتي، يقول السيد الرب."]]}, {"l": "Eze 36:3", "n": "", "vs": [[3, "لذلك تنبأ وقل: لأنهم قد دمروكم واقتحموكم من كل جهة لتصبحوا ميراثا لسائر الأمم، وصرتم حديث كل شفة ومذمة الشعب،"]]}, {"l": "Eze 36:4", "n": "", "vs": [[4, "لذلك اسمعي ياجبال إسرائيل وحي السيد الرب للجبال والآكام والأنهار والأودية وللخرائب المقفرة وللمدن المهجورة التي صارت نهبا لبقية الأمم المحيطة بها ومثار استهزاء:"]]}, {"l": "Eze 36:7", "n": "", "vs": [[7, "فأقسمت أن تتحمل الأمم المحيطة بكم عار أنفسهم."]]}, {"l": "Eze 36:9", "n": "", "vs": [[9, "فأنا لك، أعتني بك فتحرثين وتزرعين."]]}, {"l": "Eze 36:14", "n": "", "vs": [[14, "لهذا لن تفترسي الناس بعد، ولن تثكلي شعوبك يقول السيد الرب."]]}, {"l": "Eze 36:15", "n": "", "vs": [[15, "ولا يتردد فيك من بعد تعيير الأمم، ولا تحملين تعيير الشعوب ولا تعودين تعثرين شعوبك يقول السيد الرب»."]]}, {"l": "Joe 3:19", "n": "", "vs": [[19, "وتصبح مصر خرابا، وأدوم قفرا موحشا لفرط ما أنزلوه من ظلم بأبناء يهوذا، ولأنهم سفكوا دما بريئا في ديارهم."]]}, {"l": "Oba 1:10", "n": "", "vs": [[10, "فمن أجل ما أنزلت بأخيك يعقوب من ظلم، يغشاك العار وتنقرض إلى الأبد."]]}, {"l": "Oba 1:18", "n": "", "vs": [[18, "ويصير بيت يعقوب نارا، وبيت يوسف لهيبا، وبيت عيسو قشا فيوقدونهم ويلتهمونهم، ولا يفلت من بيت عيسو أحد، يقول الرب."]]}, {"l": "Oba 1:19-21", "n": "", "vs": [[19, "ويرث أهل النقب جبل عيسو، وسكان السهول أرض الفلسطينيين، ويملكون أرض أفرايم وبلاد السامرة، ويرث بنيامين جلعاد."], [20, "ويستولي جيش مسبيي بني إسرائيل على أرض الكنعانيين حتى صرفة، ويحتل مسبيو أورشليم في صفارد مدن جنوب يهوذا."], [21, "ويصعد المنقذون إلى جبل صهيون ليحكموا جبل عيسو، ويصبح الملك للرب."]]}], "kwAr": "وحولت جباله", "noteAr": ""}, {"kw": "the", "raw": "Isa_13:21, Isa_13:22, Isa_34:13, Isa_34:14, Isa_35:7; Jer_9:11, Jer_51:37", "note": "", "refs": [{"l": "Isa 13:21", "n": "", "vs": [[21, "إنما تأوي إليها وحوش القفر وتعج بيوت خرائبها بالبوم، وتلجأ إليها بنات النعام، وتتواثب فيها الماعز البرية،"]]}, {"l": "Isa 13:22", "n": "", "vs": [[22, "وتتعاوى الضباع بين أبراجها، وبنات آوى بين قصورها الفخمة. إن وقت عقابها بات وشيكا، وأيامها لن تطول!"]]}, {"l": "Isa 34:13", "n": "", "vs": [[13, "ينمو الشوك في قصورها، ويزحف العوسج على حصونها، فتصبح مأوى لبنات آوى، ومسكنا للنعام."]]}, {"l": "Isa 34:14", "n": "", "vs": [[14, "وتجتمع فيها الوحوش البرية مع الذئاب، ووعل البر يدعو صاحبه، وهناك تستقر وحوش الليل وتجد لنفسها ملاذ راحة."]]}, {"l": "Isa 35:7", "n": "", "vs": [[7, "ويتحول السراب إلى واحة، والأرض الظمأى إلى جداول. وفي الأوجرة حيث كانت تأوي بنات آوى، ينمو العشب والقصب والبردي."]]}, {"l": "Jer 9:11", "n": "", "vs": [[11, "«سأجعل أورشليم رجمة خراب، ومأوى لبنات آوى، وأحول مدن يهوذا إلى قفر مهجور»."]]}, {"l": "Jer 51:37", "n": "", "vs": [[37, "فتصير بابل ركاما ومأوى لبنات آوى، ومثار دهشة وصفير وأرضا موحشة."]]}], "kwAr": "لبنات آوى", "noteAr": ""}], "arS": [["وأبغضت", ["H8130"]], [" ", []], ["عيسو", ["H6215"]], ["، ", []], ["وحولت", ["H7760"]], [" ", []], ["جباله", ["H2022"]], [" إلى أراض ", []], ["موحشة", ["H8077"]], ["، وجعلت ", []], ["ميراثه", ["H5159"]], [" ", []], ["لبنات آوى", ["H8568"]], [" ", []], ["البرية", ["H4057"]], [".", []]]}, {"c": 1, "v": 4, "text": "وإن قال الأدوميون: مع إننا تحطمنا فإننا نبني الخرب، فإن الرب القدير يقول: هم يعمرون وأنا أهدم، ويدعو الناس بلادهم، «أرض النفاق»، وأهلها بالأمة التي سخط الرب عليها إلى الأبد.", "groups": [{"kw": "but", "raw": "Isa_9:9, Isa_9:10; Jam_4:13-16", "note": "", "refs": [{"l": "Isa 9:9", "n": "", "vs": [[9, "فيعلم الشعب كله: أفرايم وسكان السامرة القائلون بزهو وكبرياء قلب:"]]}, {"l": "Isa 9:10", "n": "", "vs": [[10, "«قد تساقط اللبن ولكننا سنبني بحجارة منحوتة. قد قطع الجميز ولكننا نعتاض عنه بخشب الأرز!»"]]}, {"l": "Jam 4:13-16", "n": "", "vs": [[13, "وأنتم، يامن تخططون قائلين: «اليوم أو غدا، نذهب إلى مدينة كذا، ونقضي هناك سنة، فنتاجر ونربح...»"], [14, "مهلا! فأنتم لا تعرفون ماذا يحدث غدا! وما هي حياتكم؟ إنها بخار، يظهر فترة قصيرة ثم يتلاشى!"], [15, "بدلا من ذلك، كان يجب أن تقولوا: «إن شاء الرب، نعيش ونعمل هذا الأمر أو ذاك!»"], [16, "وإلا، فإنكم تفتخرون متكبرين. وكل افتخار كهذا، هو افتخار رديء."]]}], "kwAr": "مع إننا تحطمنا", "noteAr": ""}, {"kw": "They shall build", "raw": "Job_9:4, Job_12:14, Job_34:29; Psa_127:1; Pro_21:30; Isa_10:4, Isa_10:15, Isa_10:16; Lam_3:37; Mat_12:30", "note": "", "refs": [{"l": "Job 9:4", "n": "", "vs": [[4, "هو حكيم القلب وعظيم القوة، فمن تصلب أمامه وسلم؟"]]}, {"l": "Job 12:14", "n": "", "vs": [[14, "وما يهدمه لا يبنى، والمرء الذي يأسره الله لا يحرره إنسان."]]}, {"l": "Job 34:29", "n": "", "vs": [[29, "فإن هيمن بسكينته فمن يدينه، وإن وارى وجهه فمن يعاينه، سواء أكانوا شعبا أم فردا"]]}, {"l": "Psa 127:1", "n": "", "vs": [[1, "إن لم يبن الرب البيت، فباطلا يتعب البناؤون. وإن لم يحرس الرب المدينة فباطلا يسهر الحارس."]]}, {"l": "Pro 21:30", "n": "", "vs": [[30, "ليس من حكمة، ولا من مشورة، ولا من فطنة بقادر ة على مقاومة الله."]]}, {"l": "Isa 10:4", "n": "", "vs": [[4, "لا يبقى شيء سوى أن تجثوا بين الأسرى، وتسقطوا بين القتلى. من أجل ذلك كله لم يرتد غضبه وما برحت يده ممدودة للعقاب."]]}, {"l": "Isa 10:15", "n": "", "vs": [[15, "أتزهو الفأس على من يقطع بها، أم يتعظم المنشار على من ينشر به، وكأن القضيب يحرك رافعه، أو كأن العصا ترفع ما ليس خشبا؟!"]]}, {"l": "Isa 10:16", "n": "", "vs": [[16, "لذلك فإن الرب القدير سيفشي وبأ مهلكا بين محاربيه الشجعان، ويوقد تحت مجده وقيدا كاشتعال النار،"]]}, {"l": "Lam 3:37", "n": "", "vs": [[37, "من ذا الذي يقضي بأمر فيتحقق إن لم يكن الرب قد أمر به؟"]]}, {"l": "Mat 12:30", "n": "", "vs": [[30, "من ليس معي، فهو ضدي؛ ومن لا يجمع معي، فهو يفرق."]]}], "kwAr": "هم يعمرون", "noteAr": ""}, {"kw": "The border", "raw": "Jer_31:17; Eze_11:10; Amo_6:2", "note": "", "refs": [{"l": "Jer 31:17", "n": "", "vs": [[17, "فلغدك رجاء»، يقول الرب، «إذ سيرجع أولادك إلى موطنهم."]]}, {"l": "Eze 11:10", "n": "", "vs": [[10, "فتقتلون بالسيف. وأنفذ قضاء فيكم في تخوم إسرائيل، فتدركون حينئذ أني أنا الرب."]]}, {"l": "Amo 6:2", "n": "", "vs": [[2, "توجهوا إلى مدينة كلنة وتأملوا، ثم انتقلوا إلى حماة العظيمة، ومنها انحدروا إلى جت مدينة الفلسطينيين. هل هي خير من هذه الممالك أم تخومهم أعظم من تخومكم؟"]]}], "kwAr": "أرض النفاق", "noteAr": ""}, {"kw": "The people", "raw": "Mal_1:3; Psa_137:7; Isa_11:14, Isa_34:5, Isa_34:10, Isa_63:1-6; Lam_4:21, Lam_4:22; Eze_25:14, Eze_35:9", "note": "", "refs": [{"l": "Mal 1:3", "n": "", "vs": [[3, "وأبغضت عيسو، وحولت جباله إلى أراض موحشة، وجعلت ميراثه لبنات آوى البرية."]]}, {"l": "Psa 137:7", "n": "", "vs": [[7, "اذكر يارب لبني أدوم ما فعلوه يوم خراب أورشليم، إذ قالوا: «اهدموا اهدموا حتى يتعرى أساسها»."]]}, {"l": "Isa 11:14", "n": "", "vs": [[14, "وينقضان على أكتاف الفلسطينيين غربا ويغزوان أبناء المشرق معا، ويستوليان على بلاد أدوم وموآب، ويخضع لهم بنو عمون."]]}, {"l": "Isa 34:5", "n": "", "vs": [[5, "لأن سيفي قد تشرب بالسخط في السماء، وها هو ينزل ليعاقب أدوم، وينتقم من الشعب الذي قضيت عليه بالفناء."]]}, {"l": "Isa 34:10", "n": "", "vs": [[10, "فلا تنطفيء ليلا ونهارا، ويحلق دخانها إلى الفضاء مدى الدهر، وتظل خرابا جيلا بعد جيل، فلا يعبر بها أحد إلى الأبد،"]]}, {"l": "Isa 63:1-6", "n": "", "vs": [[1, "من هذا المقبل من أدوم، بثياب حمراء من بصرة؛ هذا المتسربل بالبهاء. السائر بخيلاء قوته؟ إنه أنا الرب الناطق بالبر، العظيم للخلاص."], [2, "ما بال ردائك أحمر وثيابك كمن داس عنب المعصرة؟"], [3, "لقد دست المعصرة وحدي، ولم يكن معي أحد من الشعوب. قد دستهم في سخطي ووطئتهم في غيظي، فتناثر دمهم على ردائي ولطخت ثيابي."], [4, "لأن يوم الانتقام كان كامنا في قلبي، وسنة مفديي قد أتت."], [5, "تلفت فلم أعثر على معين، وعجبت إذ لم يكن من ناصر، فانتصرت بقوة ذراعي، وتأيدت بنجدة سخطي،"], [6, "فدست الشعوب في غيظي، وأسكرتهم في غضبي، وسكبت دماءهم فوق الأرض."]]}, {"l": "Lam 4:21", "n": "", "vs": [[21, "ابتهجي وافرحي ياابنة أدوم، ياساكنة عوص. إنما هذه الكأس ستجوز عليك أيضا فتسكرين وتتعرين."]]}, {"l": "Lam 4:22", "n": "", "vs": [[22, "قد تم إثمك ياابنة صهيون، ولن يطيل (الله ) من حقبة سبيك. أما أنت ياابنة أدوم فإنه يعاقبك ويفضح خطاياك."]]}, {"l": "Eze 25:14", "n": "", "vs": [[14, "وأعهد بنقمتي إلى شعبي إسرائيل، فيفعلون بالأدوميين بمقتضى غضبي وسخطي، فيدركون شدة نقمتي، يقول السيد الرب."]]}, {"l": "Eze 35:9", "n": "", "vs": [[9, "وأحيلك إلى هابتي؟ إن الرب القدير يقول لكم: أيها الكهنة المزدرون باسمي؛ فتسألون: كيف ازدرينا باسمك؟", "groups": [{"kw": "son", "raw": "Exo_20:12; Lev_19:3; Deu_5:16; Pro_30:11, Pro_30:17; Mat_15:4, Mat_15:6, Mat_19:19; Mar_7:10; Mar_10:19; Luk_18:20; Eph_6:2", "note": "", "refs": [{"l": "Exo 20:12", "n": "", "vs": [[12, "أكرم أباك وأمك لكي يطول عمرك في الأرض التي يهبك إياها الرب إلهك."]]}, {"l": "Lev 19:3", "n": "", "vs": [[3, "ليوقر كل إنسان أمه وأباه، وراعوا سبوتي. فأنا الرب إلهكم."]]}, {"l": "Deu 5:16", "n": "", "vs": [[16, "أكرم أباك وأمك كما أمرك الرب إلهك، فتطول أيامك ويكون لك خير على الأرض التي يورثها لك الرب إلهك."]]}, {"l": "Pro 30:11", "n": "", "vs": [[11, "رب جيل يشتم أباه ولا يبارك أمه."]]}, {"l": "Pro 30:17", "n": "", "vs": [[17, "العين الساخرة بالأب، والتي تحتقر طاعة أمها، تقتلعها غربان الوادي، وتلتهمها فراخ النسور."]]}, {"l": "Mat 15:4", "n": "", "vs": [[4, "فقد أوصى الله قائلا: أكرم أباك وأمك. ومن أهان أباه أو أمه، فليكن الموت عقابا له."]]}, {"l": "Mat 15:6", "n": "", "vs": [[6, "فهو في حل من إكرام أبيه وأمه. وأنتم، بهذا، تلغون ما أوصى به الله ، محافظة على تقاليدكم."]]}, {"l": "Mat 19:19", "n": "", "vs": [[19, "أكرم أباك وأمك؛ وأحب قريبك كنفسك...»"]]}, {"l": "Mar 7:10", "n": "", "vs": [[10, "فإن موسى قال: أكرم أباك وأمك! وأيضا: من أهان أباه أو أمه، فليكن الموت عقابا له!"]]}, {"l": "Mar 10:19", "n": "", "vs": [[19, "أنت تعرف الوصايا: لا تقتل؛ لا تزن؛ لا تسرق؛ لا تشهد بالزور؛ لا تظلم؛ أكرم أباك وأمك!»"]]}, {"l": "Luk 18:20", "n": "", "vs": [[20, "أنت تعرف الوصايا: لا تزن؛ لا تقتل؛ لا تسرق؛ لا تشهد بالزور؛ أكرم أباك وأمك!»"]]}, {"l": "Eph 6:2", "n": "", "vs": [[2, "«أكرم أباك وأمك» وهذه أول وصية مرتبطة بوعد"]]}], "kwAr": "إن الابن", "noteAr": ""}, {"kw": "a servant", "raw": "1Ti_6:1, 1Ti_6:2; Tit_2:9, Tit_2:10; 1Pe_2:17-19", "note": "", "refs": [{"l": "1Ti 6:1", "n": "", "vs": [[1, "على جميع من هم تحت نير العبودية أن يعتبروا سادتهم أهلا لكل إكرام، لكي لا يجلبوا التجديف على اسم الله وعلى التعليم."]]}, {"l": "1Ti 6:2", "n": "", "vs": [[2, "وعلى الذين لهم سادة مؤمنون , "vs": [[9, "سيرجعون بنوح، وبتضرعات أهديهم. إلى جوار جداول المياه أسيرهم فيمشون في طريق مستقيمة لا يعثرون فيها، لأني أب لإسرائيل، وأفرايم بكري»."]]}, {"l": "Mat 6:9", "n": "", "vs": [[9, "فصلوا أنتم مثل هذه الصلاة: أبانا الذي في السماوات، ليتقدس اسمك!"]]}, {"l": "Mat 6:14", "n": "", "vs": [[14, "فإن غفرتم للناس زلاتهم، يغفر لكم أبوكم السماوي زلاتكم."]]}, {"l": "Mat 6:15", "n": "", "vs": [[15, "وإن لم تغفروا للناس، لا يغفر لكم أبوكم السماوي زلاتكم."]]}, {"l": "Luk 6:36", "n": "", "vs": [[36, "فكونوا أنتم رحماء، كما أن أباكم رحيم."]]}, {"l": "Luk 6:46", "n": "", "vs": [[46, "ولماذا تدعونني: يارب، يارب! ولا تعملون بما أقوله؟"]]}, {"l": "1Pe 1:17", "n": "", "vs": [[17, "وما دمتم تعترفون بالله أبا لكم، وهو يحكم على كل إنسان حسب أعماله دون انحياز، فاسلكوا في مخافته مدة إقامتكم المؤقتة على الأرض."]]}], "kwAr": "فإن كنت أنا حقا أبا", "noteAr": "من هذه الآية إلى ملاخي 2: 9 يوبخ النبي الكهنة والشعب لتقديمهم نفاية البهائم ذبائح، ويعلن العقاب على الكهنة لأنهم لم يعلموا الشعب واجبهم في ذلك. انظر خر 4: 22، 23؛ إش 1: 2؛ 64: 8؛ إر 31: 9؛ مت 6: 9، 14، 15؛ لو 6: 36، 46؛ 1بط 1: 17"}, {"kw": "and if", "raw": "Mat_7:21; Luk_6:46; Joh_13:13-17", "note": "", "refs": [{"l": "Mat 7:21", "n": "", "vs": [[21, "ليس كل من يقول لي: يارب، يارب! يدخل ملكوت السماوات، بل من يعمل بإرادة أبي الذي في السماوات."]]}, {"l": "Luk 6:46", "n": "", "vs": [[46, "ولماذا تدعونني: يارب، يارب! ولا تعملون بما أقوله؟"]]}, {"l": "Joh 13:13-17", "n": "", "vs": [[13, "أنتم تدعونني معلما وسيدا، وقد صدقتم، فأنا كذلك."], [14, "فإن كنت، وأنا السيد والمعلم، قد غسلت أقدامكم، فعليكم أنتم أيضا أن يغسل بعضكم أقدام بعض."], [15, "فقد قدمت لكم مثالا لكي تعملوا مثل ما عملت أنا لكم."], [16, "الحق الحق أقول لكم: ليس عبد أعظم من سيده، ولا رسول أعظم من مرسله."], [17, "فإن كنتم قد عرفتم هذا، فطوبى لكم إذا عملتم به."]]}], "kwAr": "وإن كنت حقا سيدا", "noteAr": ""}, {"kw": "O priests", "raw": "Mal_2:8; 1Sa_2:28-30; Jer_5:30,Jer_5:31, Jer_23:11; Eze_22:26; Hos_4:6, Hos_5:1", "note": "", "refs": [{"l": "Mal 2:8", "n": "", "vs": [[8, "ولكنكم انحرفتم عن الطريق المستقيم، وأعثرتم بتعاليمكم كثيرين، ونقضتم عهدي مع النسل الكهنوتي، يقول الرب القدير."]]}, {"l": "1Sa 2:28-30", "n": "", "vs": [[28, "وانتخبت أباكم هرون من بين جميع أسباط إسرائيل ليكون لي كاهنا يصعد على مذبحي قرابين ويوقد بخورا،ويرتدي أمامي أفودا، ووهبت لبيت أبيك جميع وقائد بني إسرائيل."], [29, "فلماذا تحتقرون ذبيحتي وتقدمتي التي أمرت بها للمسكن، وتفضل ابنيك عني لتكدسوا الشحم على أبدانكم، مما تخيرتموه من قرابين شعبي؟"], [30, "لذلك يقول الرب إله إسرائيل: لقد وعدت أن يظل بيتك وبيت أبيك يخدمون في محضري إلى الأبد. أما الآن، يقول الرب: فحاشا لي أن أفعل ذلك، لأنني أكرم الذين يكرمونني، أما الذين يحتقرونني فيصغرون."]]}, {"l": "Jer 5:30", "n": "", "vs": [[30, "قد جرى في البلاد حدث مذهل فظيع."]]}, {"l": "Jer 5:31", "n": "", "vs": [[31, "فالأنبياء يتنبأون زورا، والكهنة يتصرفون بمقتضى أحكامهم، وشعبي أحب مثل هذا. ولكن ماذا تصنعون في نهاية المطاف؟»"]]}, {"l": "Jer 23:11", "n": "", "vs": [[11, "ويقول الرب: «النبي والكاهن كافران، وفي بيتي وجدت شرهما."]]}, {"l": "Eze 22:26", "n": "", "vs": [[26, "خالف كهنتها شريعتي ونجسوا مقادسي. لم يميزوا بين المقدس والرجس، ولم يعلموا الفرق بين الطاهر والنجس، وحجبوا عيونهم عن أيام سبوتي فصرت مدنسا في وسطهم."]]}, {"l": "Hos 4:6", "n": "", "vs": [[6, "قد هلك شعبي لافتقاره إلى المعرفة، ولأنك رفضت المعرفة فأنا أرفضك فلا تكون لي كاهنا، أنت تجاهلت شريعتي لذلك أنا أنسى أبناءك."]]}, {"l": "Hos 5:1", "n": "", "vs": [[1, "اسمعوا هذا أيها الكهنة وأنصتوا ياشعب إسرائيل، وأصغوا ياأهل بيت الملك، لأن القضاء حال بكم إذ كنتم فخا في المصفاة وشبكة منصوبة على جبل تابور."]]}], "kwAr": "أيها الكهنة", "noteAr": ""}, {"kw": "And ye", "raw": "Mal_2:14-17, Mal_3:7, Mal_3:8, Mal_3:13, Mal_3:14; Jer_2:21, Jer_2:22; Hos_12:8; Luk_10:29", "note": "", "refs": [{"l": "Mal 2:14-17", "n": "", "vs": [[14, "وتتساءلون: لماذا؟ لأن الرب كان شاهدا على العهد المقطوع بينك وبين زوجة صباك التي غدرت بها، مع أنها شريكتك وامرأة عهدك."], [15, "ولكن لم يقدم على ذلك أي واحد مازالت فيه بقية من الروح. وماذا طلب هذا الواحد (أي إبراهيم)؟ ذرية الله. لهذا حافظوا على أرواحكم، ولا يغدر أحد بزوجة صباه."], [16, "ويقول الرب إله إسرائيل: إني أمقت الطلاق وأمقت أن يغطي الرجل زوجته بجوره، كما يتغطى هو بثوبه. لذلك احترسوا على أنفسكم ولا تنكثوا عهدا."], [17, "قد أتعبتم الرب بكلامكم، وما برحتم تتساءلون: كيف أتعبناه؟ أتعبتموه بقولكم: كل من يرتكب الشر هو صالح في عيني الرب وهو يسر بهم، أو بسؤالكم: أين هو إله العدل؟»"]]}, {"l": "Mal 3:7", "n": "", "vs": [[7, "إن شأنكم كشأن آبائكم. ابتعدتم عن فرائضي ولم تطيعوها. ارجعوا إلي فأرجع إليكم، يقول الرب القدير، ولكنكم تسألون كيف نرجع؟"]]}, {"l": "Mal 3:8", "n": "", "vs": [[8, "أيسلب الإنسان الله ؟ لقد سلبتموني! وتسألون: بماذا سلبناك؟ في العشور والقرابين."]]}, {"l": "Mal 3:13", "n": "", "vs": [[13, "لقد قسوتم في كلامكم علي يقول الرب، ومع ذلك تقولون: بماذا تكلمنا ضدك؟"]]}, {"l": "Mal 3:14", "n": "", "vs": [[14, "لقد قلتم: من العبث عبادة الله، وأي جدوى من حفظنا شعائره، والنواح أمام حضرة الرب القدير؟"]]}, {"l": "Jer 2:21", "n": "", "vs": [[21, "وأنا غرستك ككرمة مختارة، ومن بذور سليمة كاملة، فكيف تحولت إلى كرمة فاسدة غريبة؟"]]}, {"l": "Jer 2:22", "n": "", "vs": [[22, "وإن اغتسلت بالنطرون، وأكثرت من استعمال الإشنان (الصابون)، فإن لطخة إثمك تظل ماثلة أمامي."]]}, {"l": "Hos 12:8", "n": "", "vs": [[8, "ويقول: «قد أصبحت غنيا، وضمنت لنفسي ثروة، ولا يمكن لأحد إن يجد في كل ما اكتسبته من غنى مالا حراما أثيما»."]]}, {"l": "Luk 10:29", "n": "", "vs": [[29, "لكنه إذ كان راغبا في تبرير نفسه، سأل يسوع: «ومن هو قريبي؟»"]]}], "kwAr": "فتسألون", "noteAr": ""}], "arS": [["إن ", []], ["الابن", ["H1121"]], [" ", []], ["يكرم", ["H3513"]], [" ", []], ["أباه", ["H1"]], [" ", []], ["والعبد", ["H5650"]], [" ", []], ["سيده", ["H113"]], [". ", []], ["فإن", ["H518"]], [" كنت ", []], ["أنا", ["H589"]], [" حقا ", []], ["أبا", ["H1"]], [" ", []], ["فأين", ["H346"]], [" ", []], ["كرامتي", ["H3519"]], ["؟ ", []], ["وإن", ["H518"]], [" كنت حقا ", []], ["سيدا", ["H113"]], [" فأين ", []], ["مهابتي", ["H4172"]], ["؟ إن ", []], ["الرب", ["H3068"]], [" ", []], ["القدير", ["H6635"]], [" ", []], ["يقول", ["H559"]], [" لكم: أيها ", []], ["الكهنة", ["H3548"]], [" ", []], ["المزدرون", ["H959"]], [" ", []], ["باسمي", ["H8034"]], ["؛ ", []], ["فتسألون", ["H559"]], [": ", []], ["كيف", ["H4100"]], [" ", []], ["ازدرينا", ["H959"]], [" ", []], ["باسمك", ["H8034"]], ["؟", []]]}, {"c": 1, "v": 7, "text": "فيجيب: لأنكم تقربون على مذبحي خبزا نجسا. ثم تتساءلون: بم نجسناك؟ فيرد: بظنكم أن مائدة الرب مزدراة.", "groups": [{"kw": "Ye offer", "raw": "etc. or, Bring unto my, etc", "note": "etc. or, Bring unto my, etc", "refs": [], "kwAr": "تقربون على مذبحي", "noteAr": "أو: «قدموا لمذبحي…» إلخ."}, {"kw": "polluted", "raw": "Lev_2:11, Lev_21:6; Deu_15:21", "note": "", "refs": [{"l": "Lev 2:11", "n": "", "vs": [[11, "لا تضعوا خميرا في كل تقدمة دقيق تقدمونها للرب. كل قربان فيه خمير أو عسل لا تقدموه محرقة للرب."]]}, {"l": "Lev 21:6", "n": "", "vs": [[6, "وعلى الكهنة أن يكونوا مفروزين لإلههم. لا يدنسوا اسمه لأنهم يقربون وقائد الرب كأنها طعام يقدمونه لإلههم فيكون مقدسا."]]}, {"l": "Deu 15:21", "n": "", "vs": [[21, "ولكن إن كان في البكر عيب من عرج أو عمى أو أي عيب، فلا تذبحه للرب إلهك،"]]}], "kwAr": "نجسا", "noteAr": ""}, {"kw": "The table", "raw": "Mal_1:12; 1Sa_2:15-17; Eze_41:22; 1Co_10:21, 1Co_11:21, 1Co_11:22, 1Co_11:27-32", "note": "", "refs": [{"l": "Mal 1:12", "n": "", "vs": [[12, "أما أنتم فقد دنستموه، إذ قلتم إن مائدة الرب نجسة، وإن طعامها فاسد ومزدرى."]]}, {"l": "1Sa 2:15-17", "n": "", "vs": [[15, "كذلك كان خادم الكاهن يأتي إلى ذابح القربان ويقول له قبل إحراق الشحم: «أعط لحما للكاهن حتى يشوى، فإنه لا يقبل منك لحما مطبوخا بل نيئا»."], [16, "فيجيبه الرجل: «ليحرقوا أولا شحم الذبيحة، ثم خذ ما تشتهيه نفسك». فيقول الخادم: «لا، بل أعطني الآن اللحم وإلا آخذه بالرغم عنك»."], [17, "فعظمت خطيئة أبناء عالي أمام الرب، لأن الشعب استهان بذبيحة الرب من جراء تصرفاتهما."]]}, {"l": "Eze 41:22", "n": "", "vs": [[22, "أما المذبح فكان مصنوعا من خشب ارتفاعه ثلاث أذرع (نحو متر ونصف المتر)، وطوله ذراعان (نحو متر). وكانت زواياه وقاعدته وجوانبه مصنوعة من خشب. وقال لي الملاك: «هذه هي المائدة التي أمام الرب»."]]}, {"l": "1Co 10:21", "n": "", "vs": [[21, "فلا تستطيعون أن تشربوا كأس الرب وكأس الشياطين معا، ولا أن تشتركوا في مائدة الرب ومائدة الشياطين معا،"]]}, {"l": "1Co 11:21", "n": "", "vs": [[21, "لأن كل واحد يسبق غيره ليتناول عشاءه الخاص، فيظل الواحد جائعا، ويشرب الآخر حتى يسكر!"]]}, {"l": "1Co 11:22", "n": "", "vs": [[22, "أفليس عندكم بيوت تأكلون وتشربون فيها؟ أم إنكم تحتقرون كنيسة الله وتهينون الذين لا يملكون شيئا؟ فماذا أقول لكم؟ أأمدحكم؟ على هذا لست أمدحكم!"]]}, {"l": "1Co 11:27-32", "n": "", "vs": [[27, "فمن أكل الخبز، أو شرب كأس الرب بغير استحقاق، يكون مذنبا تجاه جسد الرب ودمه."], [28, "ولكن، ليفحص الإنسان نفسه، ثم يأكل من الخبز ويشرب من الكأس."], [29, "لأن الآكل والشارب يأكل ويشرب الحكم على نفسه إذ لا يميز جسد الرب."], [30, "لهذا السبب فيكم كثيرون من الضعفاء والمرضى، وكثيرون يرقدون."], [31, "فلو كنا حكمنا على نفوسنا، لما كان حكم علينا."], [32, "ولكن، ما دام قد حكم علينا، فإننا نؤدب من قبل الرب حتى لا ندان مع العالم."]]}], "kwAr": "مائدة الرب", "noteAr": ""}], "arS": [["فيجيب", ["H559"]], [": لأنكم ", []], ["تقربون", ["H5066"]], [" على ", []], ["مذبحي", ["H4196"]], [" ", []], ["خبزا", ["H3899"]], [" ", []], ["نجسا", ["H1351"]], [". ثم ", []], ["تتساءلون", ["H559"]], [": بم ", []], ["نجسناك", ["H1351"]], ["؟ ", []], ["فيرد", ["H559"]], [": بظنكم أن ", []], ["مائدة", ["H7979"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["مزدراة", ["H959"]], [".", []]]}, {"c": 1, "v": 8, "text": "عندما تقربون الحيوان الأعمى ذبيحة، أليس ذلك شرا؟ أو حين تقدمون الحيوان الأعرج والمريض، أليس هذا شرا؟ قدموا مثل هذا القربان هدية لحاكمكم، أفيرضى عنكم ويكرمكم؟ يقول الرب القدير.", "groups": [{"kw": "if ye offer the blind", "raw": "Mal_1:14; Lev_22:19-25; Deu_15:21", "note": "", "refs": [{"l": "Mal 1:14", "n": "", "vs": [[14, "ملعون المنافق الذي ينذر للرب ذكرا سليما من قطيعه، ثم يقرب للرب ما هو مصاب بعيب، لأني ملك عظيم واسمي مهوب بين الأمم، يقول الرب القدير»."]]}, {"l": "Lev 22:19-25", "n": "", "vs": [[19, "تكون محرقة للرضى عنكم، ثورا أو كبشا أو تيسا سليما."], [20, "لا تقربوا تقدمة فيها عيب، لأنها لن تكون مقبولة للرضى عنكم."], [21, "وإذا أصعد أحدكم ذبيحة سلام للرب، وفاء لنذر، أو ذبيحة طوعية، فلتكن من البقر أو الغنم، سليمة خالية من كل عيب ليرضى الرب عنكم."], [22, "لا تقربوا للرب من الذبائح ما هو أعمى أو مكسور أو مجروح أو به بثور أو أجرب أو أكلف، ولا تجعلوا منها وقودا على المذبح للرب."], [23, "أما الثور أو الحمل الذي فيه عضو زائد أو ناقص، فلك أن تقربه تقدمة طوعية، ولكن ليس وفاء لنذر، فإنه يكون مرفوضا."], [24, "لا تصعدوا للرب حيوانا ذا خصى مرضوضة أو مسحوقة أو مقطوعة. لا تفعلوا هذا في أرضكم."], [25, "لا تشتروا مثل هذه الحيوانات من غريب لتقدموها ذبائح لإلهكم، لأنه لن يقبلها منكم، لما فيها من تشويه وعيب»."]]}, {"l": "Deu 15:21", "n": "", "vs": [[21, "ولكن إن كان في البكر عيب من عرج أو عمى أو أي عيب، فلا تذبحه للرب إلهك،"]]}], "kwAr": "تقربون الحيوان الأعمى", "noteAr": ""}, {"kw": "for sacrifice", "raw": "Heb. to sacrifice", "note": "Heb. to sacrifice", "refs": [], "kwAr": "ذبيحة", "noteAr": "بالعبرية: «للذبح»."}, {"kw": "or accept", "raw": "Mal_1:10,Mal_1:13; Job_42:8; Psa_20:3; Jer_14:10; Hos_8:13", "note": "", "refs": [{"l": "Mal 1:10", "n": "", "vs": [[10, "آه، ياليت بينكم من يغلق أبواب الهيكل لئلا توقدوا نارا باطلة على مذبحي، يقول الرب القدير: إذ لا مسرة لي بكم ولا أرضى بتقدمة من أيديكم."]]}, {"l": "Mal 1:13", "n": "", "vs": [[13, "ثم قلتم: ما هذه المشقة التي نتكبدها؟ وتأففتم علي، يقول الرب القدير. وتقربون إلي ما استوليتم عليه ظلما وما هو أعرج أو مريض، فيكون هذا تقدمة قربانكم فهل أقبل هذا من أيديكم؟ يقول الرب."]]}, {"l": "Job 42:8", "n": "", "vs": [[8, "فخذوا الآن لكم سبعة ثيران وسبعة كباش، وامضوا إلى عبدي أيوب وقربوها ذبيحة محرقة عن أنفسكم، فيصلي من أجلكم، فأعفو عنكم إكراما له، لئلا أعاقبكم بمقتضى حماقتكم، لأنكم لم تنطقوا بالحق عني كعبدي أيوب»."]]}, {"l": "Psa 20:3", "n": "", "vs": [[3, "ليتذكر جميع تقدماتك، ويتقبل محرقاتك."]]}, {"l": "Jer 14:10", "n": "", "vs": [[10, "وهذا ما يعلنه الرب لهذا الشعب: «لشد ما أحبوا التجول ولم يمتنعوا عن الشر، لذلك لا يقبلهم الله . والآن يذكر إثمهم ويعاقب خطاياهم»."]]}, {"l": "Hos 8:13", "n": "", "vs": [[13, "يذبحون الذبائح المقربة إلي ليأكلوا لحومها، لا ليقدموها إلي. ولكني لا أسر بها. والآن أذكر إثمهم وأعاقبهم على خطاياهم وإلى مصر يرجعون."]]}], "kwAr": "أفيرضى عنكم", "noteAr": ""}], "arS": [["عندما ", []], ["تقربون", ["H5066"]], [" الحيوان ", []], ["الأعمى", ["H5787"]], [" ", []], ["ذبيحة", ["H2076"]], ["، ", []], ["أليس", ["H369"]], [" ذلك ", []], ["شرا", ["H7451"]], ["؟ أو حين ", []], ["تقدمون", ["H5066"]], [" الحيوان ", []], ["الأعرج", ["H6455"]], [" ", []], ["والمريض", ["H2470"]], ["، ", []], ["أليس", ["H369"]], [" هذا ", []], ["شرا", ["H7451"]], ["؟ ", []], ["قدموا", ["H7126"]], [" مثل هذا القربان هدية ", []], ["لحاكمكم", ["H6346"]], ["، ", []], ["أفيرضى", ["H7521"]], [" عنكم ", []], ["ويكرمكم", ["H5375"]], ["؟ ", []], ["يقول", ["H559"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["القدير", ["H6635"]], [".", []]]}, {"c": 1, "v": 9, "text": "الآن التمسوا رضى الله ليرأف بنا، ولكن هل بمثل هذه القرابين المعتلة يرضى عنكم؟ يقول الرب القدير.", "groups": [{"kw": "beseech", "raw": "2Ch_30:27; Jer_27:18; Joe_1:13, Joe_1:14, Joe_2:17; Zec_3:1-5; Joh_9:31; Heb_7:26, Heb_7:27", "note": "", "refs": [{"l": "2Ch 30:27", "n": "", "vs": [[27, "ووقف الكهنة واللاويون وطلبوا البركة على الشعب فاستجاب الرب صلاتهم التي صعدت إلى مسكن قدسه في السماء."]]}, {"l": "Jer 27:18", "n": "", "vs": [[18, "وإن كانوا حقا أنبياء، وإن كان حقا وحي الرب لديهم فليبتهلوا إلى الرب القدير لكي لا يحمل ما تبقى من آنية هيكل الرب، وقصر ملك يهوذا، وأورشليم إلى بابل."]]}, {"l": "Joe 1:13", "n": "", "vs": [[13, "أيها الكهنة اتشحوا بالمسوح ونوحوا. ولولوا ياخدام المذبح. تعالوا وبيتوا ليلتكم بالمسوح ياخدام إلهي، لأن تقدمات الدقيق والخمر قد منعت عن هيكل الله."]]}, {"l": "Joe 1:14", "n": "", "vs": [[14, "خصصوا صوما. نادوا بالاعتكاف. ادعوا الشيوخ وجميع سكان الأرض للاجتماع في هيكل الرب إلهكم وتضرعوا إليه."]]}, {"l": "Joe 2:17", "n": "", "vs": [[17, "ليبك الكهنة خدام الرب بين الرواق والمذبح قائلين: «اعف عن شعبك يارب ولا تجعل ميراثك مثار احتقار وهزء بين الأمم، فيقولوا بين الشعوب: أين إلههم؟»"]]}, {"l": "Zec 3:1-5", "n": "", "vs": [[1, "ثم أراني الرب يهوشع رئيس الكهنة واقفا في حضرة ملاك الرب، وعن يمينه ينتصب الشيطان ليقاومه."], [2, "فقال الرب للشيطان: «إن الرب ينتهرك ياشيطان، الرب الذي اصطفى أورشليم ينتهرك، أليس هذا الرجل كحطبة مشتعلة انتشلت من النار؟»"], [3, "وكان يهوشع آنئذ واقفا في حضرة الملاك مرتديا ثيابا قذرة."], [4, "فقال الملاك للماثلين في حضرته: «اخلعوا عنه هذه الثياب القذرة». ثم قال ليهوشع: «انظر، ها أنا قد أزلت عنك إثمك وكسوتك ثوبا جديدا»."], [5, "ثم أضاف: «ضعوا عمامة طاهرة على رأسه». فوضعوا العمامة الطاهرة على رأسه وكسوه ثيابا بهية، وملاك الرب ما برح واقفا."]]}, {"l": "Joh 9:31", "n": "", "vs": [[31, "نحن نعلم أن الله لا يستجيب للخاطئين، ولكنه يستمع لمن يتقيه ويعمل بإرادته،"]]}, {"l": "Heb 7:26", "n": "", "vs": [[26, "نعم، هذا هو رئيس الكهنة الذي كنا محتاجين إليه. إنه قدوس، لا عيبة فيه، ولا نجاسة، قد انفصل عن الخاطئين، وارتفع حتى صار أسمى من السماوات."]]}, {"l": "Heb 7:27", "n": "", "vs": [[27, "وهو لا يحتاج إلى ما كان يحتاج إليه قديما كل رئيس كهنة: أن يقدم الذبائح يوميا للتكفير عن خطاياه الخاصة أولا، ثم عن خطايا الشعب، وذلك لأنه كفر عن خطاياهم مرة واحدة، حين قدم نفسه عنهم."]]}], "kwAr": "التمسوا", "noteAr": ""}, {"kw": "God", "raw": "Heb. the face of God, Exo_32:11; Jer_26:19 *marg. Lam_2:19", "note": "Heb. the face of God, Exo_32:11; Jer_26:19 *marg. Lam_2:19", "refs": [{"l": "Exo 32:11", "n": "", "vs": [[11, "فابتهل موسى إلى الرب وقال: «لماذا يحتدم غضبك على شعبك الذي أخرجته من ديار مصر بقوة عظيمة وذراع مقتدرة؟"]]}, {"l": "Jer 26:19", "n": "*marg.", "vs": [[19, "فهل قتله حزقيا ملك يهوذا وكل شعب يهوذا؟ أما اتقى الرب واستعطفه، فامتنع الرب عن الشر الذي قضى به عليهم؟ إننا نكاد نجلب بلاء عظيما على أنفسنا»."]]}, {"l": "Lam 2:19", "n": "", "vs": [[19, "قومي وانتحبي في الربع الأول من الليل. اسكبي كالماء قلبك في محضر الرب. ارفعي إليه يديك من أجل نفوس أطفالك المغشي عليهم من الجوع عند ناصية كل شارع."]]}], "kwAr": "رضى الله", "noteAr": "بالعبرية: «وجه الله». انظر خر 32: 11؛ إر 26: 19؛ مرا 2: 19"}, {"kw": "by your means", "raw": "Heb. from your hand", "note": "Heb. from your hand", "refs": [], "kwAr": "بمثل هذه القرابين", "noteAr": "بالعبرية: «من يدكم»."}, {"kw": "will he", "raw": "Act_19:15, Act_19:16; Rom_2:11; 1Pe_1:17", "note": "", "refs": [{"l": "Act 19:15", "n": "", "vs": [[15, "فأجابهم الروح الشرير: «يسوع أنا أعرفه، وبولس أفهمه. ولكن، من أنتم؟»"]]}, {"l": "Act 19:16", "n": "", "vs": [[16, "ثم هجم عليهم الرجل الذي به الروح الشرير، فتمكن منهم وغلبهم، فهربوا من البيت الذي كانوا فيه، عراة مجرحين."]]}, {"l": "Rom 2:11", "n": "", "vs": [[11, "فليس عند الله تحيز."]]}, {"l": "1Pe 1:17", "n": "", "vs": [[17, "وما دمتم تعترفون بالله أبا لكم، وهو يحكم على كل إنسان حسب أعماله دون انحياز، فاسلكوا في مخافته مدة إقامتكم المؤقتة على الأرض."]]}], "kwAr": "يرضى عنكم", "noteAr": ""}], "arS": [["الآن", ["H6258"]], [" ", []], ["التمسوا", ["H2470"]], [" رضى ", []], ["الله", ["H410"]], [" ", []], ["ليرأف", ["H2603"]], [" بنا، ولكن هل بمثل هذه القرابين المعتلة ", []], ["يرضى", ["H5375"]], [" عنكم؟ ", []], ["يقول", ["H559"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["القدير", ["H6635"]], [".", []]]}, {"c": 1, "v": 10, "text": "آه، ياليت بينكم من يغلق أبواب الهيكل لئلا توقدوا نارا باطلة على مذبحي، يقول الرب القدير: إذ لا مسرة لي بكم ولا أرضى بتقدمة من أيديكم.", "groups": [{"kw": "Who", "raw": "Instead of mi who, one manuscript (30; K) with the LXX reads ki surely, which is adopted by Houbigant and Abp. Newcome, who renders, Surely the doors shall be closed against you, neither shall ye kindle the fire of my altar in vain.", "note": "Instead of mi who, one manuscript (30; K) with the LXX reads ki surely, which is adopted by Houbigant and Abp. Newcome, who renders, Surely the doors shall be closed against you, neither shall ye kindle the fire of my altar in vain.", "refs": [], "kwAr": "من يغلق", "noteAr": "في بعض المخطوطات مع الترجمة السبعينية «كي» أي «حقا» بدل «من»، وقد أخذ بها هوبيغان والمطران نيوكم، فترجم: حقا ستغلق الأبواب عليكم، ولن توقدوا نار مذبحي عبثا."}, {"kw": "even", "raw": "Job_1:9-11; Isa_56:11, Isa_56:12; Jer_6:13, Jer_8:10; Mic_3:11; Joh_10:12; Phi_2:21; 1Pe_5:2", "note": "", "refs": [{"l": "Job 1:9-11", "n": "", "vs": [[9, "فأجاب الشيطان: «أمجانا يتقي أيوب الله ؟"], [10, "ألم تسيج حوله وحول بيته وحول كل ما يملك. لقد باركت كل ما يقوم به من أعمال، فملأت مواشيه الأرض."], [11, "ولكن حالما تمد يدك وتمس جميع ما يملك، فإنه في وجهك يجدف عليك»."]]}, {"l": "Isa 56:11", "n": "", "vs": [[11, "هم كلاب نهمة لا تعرف الشبع، ورعاة أيضا مجردون من الفهم، كل مال إلى طريقه طمعا في الربح،"]]}, {"l": "Isa 56:12", "n": "", "vs": [[12, "قائلين: تعالوا نأتي بالخمر، ونشرب مسكرا حتى الثمالة، فالغد يكون مماثلا لهذا اليوم، بل أعظم منه."]]}, {"l": "Jer 6:13", "n": "", "vs": [[13, "لأنهم جميعا، صغارهم وكبارهم، مولعون بالربح الحرام. حتى النبي والكاهن يرتكبان الزور في أعمالهما."]]}, {"l": "Jer 8:10", "n": "", "vs": [[10, "لذلك أعطي نساءهم لآخرين وحقولهم للوارثين القاهرين، لأنهم جميعا من صغيرهم إلى كبيرهم مولعون بالربح. حتى النبي والكاهن يرتكبان الزور في أعمالهما،"]]}, {"l": "Mic 3:11", "n": "", "vs": [[11, "إذ يحكم رؤساؤها بالرشوة، وكهنتها يعلمون بالأجرة ويتعاطى أنبياؤها العرافة لقاء المال، ومع ذلك يدعون الاتكال على الله قائلين: «أليس الرب في وسطنا؟ لذلك لن يصيبنا مكروه»."]]}, {"l": "Joh 10:12", "n": "", "vs": [[12, "وليس الأجير كالراعي، لأن الخراف ليست ملكه. فعندما يرى الذئب قادما، يترك الخراف لينجو بنفسه، فيخطف الذئب الخراف ويبددها."]]}, {"l": "Phi 2:21", "n": "", "vs": [[21, "فإن الجميع يسعون وراء مصالحهم الخاصة، لا لأجل المسيح يسوع."]]}, {"l": "1Pe 5:2", "n": "", "vs": [[2, "ارعوا قطيع الله الذي بينكم، كحراس له، لا بدافع الواجب، بل بدافع التطوع، كما يريد الله ، ولا رغبة في الربح الدنيء، بل رغبة في الخدمة بنشاط."]]}], "kwAr": "أبواب الهيكل", "noteAr": ""}, {"kw": "neither", "raw": "1Co_9:13", "note": "", "refs": [{"l": "1Co 9:13", "n": "", "vs": [[13, "أما تعلمون أن الذين يشتغلون بالمقدسات كانوا يأكلون مما يقدم إلى الهيكل، وأن الذين يقومون بخدمة المذبح، كانوا يشتركون في خيرات المذبح؟"]]}], "kwAr": "لئلا توقدوا", "noteAr": ""}, {"kw": "I have", "raw": "Isa_1:11-15; Jer_6:20; Amo_5:21-24; Heb_10:38", "note": "", "refs": [{"l": "Isa 1:11-15", "n": "", "vs": [[11, "ماذا تجديني كثرة ذبائحكم، يقول الرب؟ اتخمت من محرقات كباش وشحم المسمنات، ولا أسر بدم عجول وخرفان وتيوس."], [12, "حين جئتم لتمثلوا أمامي، من طلب منكم أن تدوسوا دوري؟"], [13, "كفوا عن تقديم قرابين باطلة، فالبخور رجس لي، وكذلك رأس الشهر والسبت والدعاء إلى المحفل، فأنا لا أطيق الاعتكاف مع ارتكاب الإثم."], [14, "لشد ما تبغض نفسي احتفالات رؤوس شهوركم ومواسم أعيادكم! صارت علي عبئا، وسئمت حملها."], [15, "عندما تبسطون نحوي أيديكم أحجب وجهي عنكم، وإن أكثرتم الصلاة لا أستجيب، لأن أيديكم مملوءة دما."]]}, {"l": "Jer 6:20", "n": "", "vs": [[20, "لأي غرض يصعد إلي البخور من شبا، وقصب الذريرة من أرض نائية؟ محرقاتكم مرفوضة، وتقدماتكم لا تسرني»."]]}, {"l": "Amo 5:21-24", "n": "", "vs": [[21, "إني أمقت أعيادكم وأحتقرها، ولا أسر باحتفالاتكم."], [22, "ومع أنكم تقربون لي ذبائح محرقاتكم وتقدماتكم من الدقيق، فإني لا أقبلها ولا ألتفت إلى ذبائح السلام من مسمنات مواشيكم."], [23, "أبعدوا عني جلبة أغانيكم لأني لن أصغي إلى نغمات رباباتكم."], [24, "إنما ليجر الحق متدفقا كالمياه والعدل كنهر سيال."]]}, {"l": "Heb 10:38", "n": "", "vs": [[38, "وأما من تبرر بالإيمان، فبالإيمان يحيا. ومن ارتد لا تسر به نفسي!"]]}], "kwAr": "لا مسرة لي", "noteAr": ""}], "arS": [["آه، ياليت بينكم من ", []], ["يغلق", ["H5462"]], [" ", []], ["أبواب", ["H1817"]], [" الهيكل لئلا ", []], ["توقدوا", ["H215"]], [" نارا ", []], ["باطلة", ["H2600"]], [" على ", []], ["مذبحي", ["H4196"]], ["، ", []], ["يقول", ["H559"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["القدير", ["H6635"]], [": إذ لا ", []], ["مسرة", ["H2656"]], [" لي بكم ولا ", []], ["أرضى", ["H7521"]], [" ", []], ["بتقدمة", ["H4503"]], [" من ", []], ["أيديكم", ["H3027"]], [".", []]]}, {"c": 1, "v": 11, "text": "لأنه من مشرق الشمس إلى مغربها اسمي عظيم بين الأمم، وفي كل مكان يحرق لاسمي بخور وذبائح طاهرة، لأن اسمي عظيم بين الأمم، يقول الرب القدير.", "groups": [{"kw": "from", "raw": "As the preceding verse was a prediction of the abolition of the Levitical priesthood, so this is a prophecy of the conversion of the Gentiles, and the spiritual priesthood of the Gospel times. As none but priests of Aarons race might burn incense before Jehovah, a total change of the external administration of the sacred ordinances is evidently predicted. Psa_50:1, Psa_113:3; Isa_45:6, Isa_59:19; Zec_8:7", "note": "As the preceding verse was a prediction of the abolition of the Levitical priesthood, so this is a prophecy of the conversion of the Gentiles, and the spiritual priesthood of the Gospel times. As none but priests of Aarons race might burn incense before Jehovah, a total change of the external administration of the sacred ordinances is evidently predicted. Psa_50:1, Psa_113:3; Isa_45:6, Isa_59:19; Zec_8:7", "refs": [{"l": "Psa 50:1", "n": "", "vs": [[1, "الرب الإله القدير تكلم، ودعا الأرض للمحاكمة من مشرق الشمس إلى مغربها."]]}, {"l": "Psa 113:3", "n": "", "vs": [[3, "ليسبح باسم الرب من مشرق الشمس إلى مغربها."]]}, {"l": "Isa 45:6", "n": "", "vs": [[6, "حتى يدرك الناس من مشرق الشمس ومن مغربها أني أنا هو الرب وليس هناك آخر."]]}, {"l": "Isa 59:19", "n": "", "vs": [[19, "فيتقون من المغرب اسم الرب، ومن المشرق يخشون مجد الرب، لأنه سيأتي العدو كنهر متدفق فتدفعه ريح الرب."]]}, {"l": "Zec 8:7", "n": "", "vs": [[7, "ها أنا أنقذ شعبي المنفي في أرض المشرق أو في المغرب."]]}], "kwAr": "من مشرق الشمس", "noteAr": "كما أن الآية السابقة نبوة بإبطال الكهنوت اللاوي، فهذه نبوة باهتداء الأمم وبكهنوت روحي في أزمنة الإنجيل. ولما كان الكهنة من نسل هارون وحدهم يحرقون البخور أمام الرب، فمن الواضح أن تغييرا شاملا سيحدث في إقامة الفرائض المقدسة. انظر مز 50: 1؛ 113: 3؛ إش 45: 6؛ 59: 19؛ زك 8: 7"}, {"kw": "my name", "raw": "Mal_1:14; Psa_22:27-31, Psa_67:2, Psa_72:11-17, Psa_98:1-3; Isa_11:9, Isa_11:10, Isa_45:22, Isa_45:23; Isa_49:6, Isa_49:7, Isa_49:22, Isa_49:23, Isa_54:1-3, Isa_54:5, Isa_60:1-11, Isa_60:16-22, Isa_66:19, Isa_66:20; Amo_9:12; Mic_5:4; Zep_3:9; Zec_8:20-23; Mat_6:9, Mat_6:10, Mat_28:19; Act_15:17, Act_15:18; Rev_11:15, Rev_15:4", "note": "", "refs": [{"l": "Mal 1:14", "n": "", "vs": [[14, "ملعون المنافق الذي ينذر للرب ذكرا سليما من قطيعه، ثم يقرب للرب ما هو مصاب بعيب، لأني ملك عظيم واسمي مهوب بين الأمم، يقول الرب القدير»."]]}, {"l": "Psa 22:27-31", "n": "", "vs": [[27, "تتذكر جميع أقاصي الأرض وترجع إلى الرب، وتتعبد أمامك جميع قبائل الأمم."], [28, "لأن الملك للرب، وهو يتسلط على الأمم."], [29, "جميع عظماء الأرض يحتفلون ويسجدون. ينحني أمامه الهابطون إلى التراب والفانون،"], [30, "يتعبد نسلهم لله، ويتحدثون عن الرب للجيل الآتي."], [31, "يأتون ويخبرون ببره وبمعجزاته شعبا لم يولد بعد."]]}, {"l": "Psa 67:2", "n": "", "vs": [[2, "لكي يعرف في الأرض طريقك، وبين جميع الأمم خلاصك."]]}, {"l": "Psa 72:11-17", "n": "", "vs": [[11, "ينحني أمامه جميع الملوك. وتتعبد له كل الأمم."], [12, "لأنه ينقذ المسكين المستغيث البائس الذي لا معين له."], [13, "يعطف على الفقير والمحتاج ويخلص نفوس المساكين."], [14, "إذ يفتدي نفوسهم من الظلم والعنف، ويحفظ حياتهم لأنها ثمينة في عينيه."], [15, "ليحي الملك! ليعط له ذهب شبا. وليصلوا من أجله دائما ويطلبوا له بركة الله كل النهار."], [16, "لتتكاثر الغلال في الأرض وعلى رؤوس الجبال، وتتماوج مثل أرز لبنان، ويزهر أهل المدينة كعشب الأرض."], [17, "يخلد اسمه إلى الدهر، ويدوم اسمه كديمومة الشمس، ويتبارك الناس به، وتطوبه كل الأمم."]]}, {"l": "Psa 98:1-3", "n": "", "vs": [[1, "رنموا للرب ترنيمة جديدة، لأنه قد صنع عجائب. وبيمينه وذراعه المقدسة أحرز خلاصا."], [2, "أعلن الرب خلاصه؛ أمام أنظار الأمم كشف بره."], [3, "ذكر رحمته وأمانته لبيت إسرائيل. رأت كل أقاصي الأرض خلاص إلهنا."]]}, {"l": "Isa 11:9", "n": "", "vs": [[9, "لا يؤذون ولا يسيئون في كل جبل قدسي، لأن الأرض تمتليء من معرفة الرب كما تغمر المياه البحر."]]}, {"l": "Isa 11:10", "n": "", "vs": [[10, "في ذلك اليوم ينتصب أصل يسى راية للأمم، وإليه تسعى جميع الشعوب، ويكون مسكنه مجيدا."]]}, {"l": "Isa 45:22", "n": "", "vs": [[22, "التفتوا إلي واخلصوا ياجميع أقاصي الأرض، لأني أنا الله وليس هناك آخر."]]}, {"l": "Isa 45:23", "n": "", "vs": [[23, "لقد أقسمت بذاتي، وخرجت من فمي، بكل صدق، كلمة لا تنقض: إنه ستجثو لي كل ركبة ويقسم بي كل لسان."]]}, {"l": "Isa 49:6", "n": "", "vs": [[6, "لكم هو يسير أن تكون لي عبدا لتستنهض أسباط يعقوب، وترد من نجيت من إسرائيل، لذلك سأجعلك نورا للأمم لتكون خلاصي إلى أقصى الأرض."]]}, {"l": "Isa 49:7", "n": "", "vs": [[7, "وهذا ما يقوله الرب فادي إسرائيل وقدوسه لمن صار محتقرا ومرذولا لدى الأمم وعبدا للمتسلطين: يراك الملوك وينهضون، ويسجد لك الرؤساء من أجل الرب الأمين، قدوس إسرائيل الذي اصطفاك."]]}, {"l": "Isa 49:22", "n": "", "vs": [[22, "وهذا ما يقوله السيد الرب: ها أنا أرفع يدي إلى الأمم وأنصب رايتي إلى الشعوب، فيحملون أبناءك في أحضانهم وبناتك على أكتافهم."]]}, {"l": "Isa 49:23", "n": "", "vs": [[23, "يكون لك الملوك آباء مربين، وملكاتهم مرضعات، ينحنون أمامك بوجوه مطرقة إلى الأرض، ويلحسون تراب قدميك. عندئذ تدركين أنني أنا الرب، وكل من يتكل علي لا يخزى»."]]}, {"l": "Isa 54:1-3", "n": "", "vs": [[1, "ترنمي أيتها العاقر التي لم تنجب، أشيدي بالترنم والهتاف يامن لم تقاسي من المخاض، لأن أبناء المستوحشة أكثر من أبناء ذات الزوج، يقول الرب."], [2, "وسعي فسحة خيمتك وابسطي ستائر مساكنك، لا تضيقي. أطيلي حبال خيمتك ورسخي أوتادك،"], [3, "لأنك ستمتدين يمينا وشمالا، ويرث نسلك أمما ويعمرون المدن الخربة،"]]}, {"l": "Isa 54:5", "n": "", "vs": [[5, "لأن صانعك هو بعلك، والرب القدير اسمه، وفاديك هو قدوس إسرائيل الذي يدعى إله كل الأرض."]]}, {"l": "Isa 60:1-11", "n": "", "vs": [[1, "قومي استضيئي، فإن نورك قد جاء، ومجد الرب أشرق عليك."], [2, "ها إن الظلمة تغمر الأرض، والليل الدامس يكتنف الشعوب، ولكن الرب يشرق عليك، ويتجلى مجده حولك،"], [3, "فتقبل الأمم إلى نورك، وتتوافد الملوك إلى إشراق ضيائك."], [4, "تأملي حولك وانظري، فها هم جميعا قد اجتمعوا، وأتوا إليك. يجيء أبناؤك من مكان بعيد، وتحمل بناتك على الأذرع."], [5, "عندئذ تنظرين وتتهللين، وتطغى الإثارة على قلبك، وتمتلئين فرحا لأن ثروات البحر تتحول إليك وغنى الأمم يتدفق عليك."], [6, "تكتظ أرضك بكثرة الإبل. من أرض مديان وعيفة تغشاك بكران، تتقاطر إليك من شبا محملة بالذهب واللبان وتذيع تسبيح الرب."], [7, "جميع قطعان قيدار تجتمع إليك، وكباش نبايوت تخدمك، تقدم قرابين مقبولة على مذبحي، وأمجد بيتي البهي."], [8, "من هؤلاء الطائرون كالسحاب وكالحمام إلى أعشاشها؟"], [9, "فالجزائر تنتظرني، وفي الطليعة سفن ترشيش حاملة أبناءك لتأتي بهم من أرض بعيدة، ومعهم فضتهم وذهبهم، تكريما لاسم الرب إلهك ولقدوس إسرائيل لأنه قد مجدك."], [10, "يعمر الغرباء أسوارك، ويخدمك ملوكهم، لأني في غضبي عاقبتك، وفي رضاي رحمتك."], [11, "تنفتح أبوابك دائما ولا توصد ليل نهار، ليحمل إليك الناس ثروة الأمم، وفي موكب يساق إليك ملوكهم،"]]}, {"l": "Isa 60:16-22", "n": "", "vs": [[16, "وتشربين لبن الأمم، وترضعين ثدي الملوك، وتدركين أني أنا الرب مخلصك وفاديك عزيز يعقوب."], [17, "وعوضا عن النحاس أجلب لك الذهب، وبدل الحديد آتي لك بالفضة، وعوض الخشب نحاسا، وبدل الحجارة حديدا، وأجعل ولاتك مصدر سلام، ومسخريك يعاملونك بالعدل."], [18, "ولا يسمع بظلم في أرضك، ولا بدمار أو خراب داخل تخومك، وتدعين أسوارك خلاصا، وبواباتك تسابيح."], [19, "ولا تعود الشمس نورا لك في النهار ولا يشرق ضوء القمر عليك لأن الرب يكون نورك الأبدي، وإلهك يكون مجدك."], [20, "ولا تغرب شمسك من بعد، ولا يتضاءل قمرك، لأن الرب يكون نورك الأبدي، وتنقضي أيام مناحتك."], [21, "ويكون شعبك جميعا أبرارا ويرثون الأرض إلى الأبد، فهم غصن غرسي وعمل يدي لأتمجد."], [22, "ويضحى أقلهم ألفا، وأصغرهم أمة قوية، أنا الرب أسرع في تحقيق ذلك في حينه."]]}, {"l": "Isa 66:19", "n": "", "vs": [[19, "وأجعل بينهم آية وأبعث بعض الناجين منهم إلى الأمم: إلى ترشيش، وفول، ولود، المهرة في رمي السهام، وإلى توبال وياوان وإلى الجزائر البعيدة ممن لم يسمعوا بشهرتي أو يروا مجدي، فيذيعون مجدي بين الأمم."]]}, {"l": "Isa 66:20", "n": "", "vs": [[20, "ويحضرون جميع إخوتكم من سائر الأمم، تقدمة للرب، على متون الجياد، وفي المركبات والهوادج، وعلى ظهور البغال وأسنمة الجمال، إلى أورشليم جبل قدسي، كما يحضر الإسرائيليون تقدمة الحنطة في آنية طاهرة إلى بيت الرب"]]}, {"l": "Amo 9:12", "n": "", "vs": [[12, "لكي يرث إسرائيل ما تبقى من أدوم وجميع الأمم التي دعي اسمي عليها، يقول الرب صانع هذه الأمور."]]}, {"l": "Mic 5:4", "n": "", "vs": [[4, "فيقوم ويرعى شعبه بقوة الرب وبجلال اسم الرب إلهه، فيعيشون بأمن، لأن عظمته تمتد إلى أقاصي الأرض."]]}, {"l": "Zep 3:9", "n": "", "vs": [[9, "عندئذ أنقي شفاه الشعب ليدعوا جميعهم باسم الرب ويعبدوه جنبا إلى جنب."]]}, {"l": "Zec 8:20-23", "n": "", "vs": [[20, "وستأتي شعوب أيضا وأفواج من سكان مدن كثيرة إلى أورشليم."], [21, "ويمضي أهل المدينة الواحدة إلى المدينة الأخرى قائلين: هيا نذهب على الفور لنطلب رضى وجه الرب القدير ونلتمس بركته، لأننا على أي حال منطلقون إلى هناك."], [22, "فتتوافد أمم كثيرة وشعوب قوية ليلتمسوا وجه الرب القدير في أورشليم وليحظوا برضاه."], [23, "في تلك الأيام يتشبث عشرة رجال من أبناء الأمم بثوب رجل يهودي قائلين: دعنا نذهب معكم، لأننا سمعنا أن الرب معكم»."]]}, {"l": "Mat 6:9", "n": "", "vs": [[9, "فصلوا أنتم مثل هذه الصلاة: أبانا الذي في السماوات، ليتقدس اسمك!"]]}, {"l": "Mat 6:10", "n": "", "vs": [[10, "ليأت ملكوتك! لتكن مشيئتك على الأرض كما هي في السماء!"]]}, {"l": "Mat 28:19", "n": "", "vs": [[19, "فاذهبوا إذن، وتلمذوا جميع الأمم، وعمدوهم باسم الآب والابن والروح القدس؛"]]}, {"l": "Act 15:17", "n": "", "vs": [[17, "لكي يسعى إلى الرب باقي الناس وجميع الشعوب التي تحمل اسمي، يقول الرب، فاعل هذه الأمور"]]}, {"l": "Act 15:18", "n": "", "vs": [[18, "المعروفة لديه منذ الأزل."]]}, {"l": "Rev 11:15", "n": "", "vs": [[15, "ونفخ الملاك السابع في بوقه فسمعت أصوات عالية في السماء تقول: «قد صار ملك العالم لربنا ومسيحه. إنه يملك إلى أبد الآبدين»."]]}, {"l": "Rev 15:4", "n": "", "vs": [[4, "من لا يخافك يارب ولا يمجد اسمك؟ فأنت وحدك قدوس! والأمم جميعا سيأتون ويسجدون لك، لأن أحكامك قد ظهرت جلية»."]]}], "kwAr": "اسمي عظيم", "noteAr": ""}, {"kw": "and in", "raw": "Isa_24:14-16, Isa_42:10-12; Zep_2:11; Joh_4:21-23; Act_10:30-35; Rom_15:9-11, Rom_15:16; 1Ti_2:8; Rev_8:3", "note": "", "refs": [{"l": "Isa 24:14-16", "n": "", "vs": [[14, "هؤلاء الباقون يرفعون أصواتهم ويهتفون بفرح، ويشدون من الغرب بجلال الرب."], [15, "لذلك مجدوا الرب في المشرق، مجدوا اسم الرب إله إسرائيل في جزائر البحر."], [16, "من أقاصي المعمورة سمعنا تسابيح مجد قائلة: «المجد للبار». ولكني قلت: أنا هالك! أنا هالك ويل لي لأن الخونة يمارسون الخيانة. الخونة يمارسون الخيانة."]]}, {"l": "Isa 42:10-12", "n": "", "vs": [[10, "غنوا للرب أغنية جديدة، سبحوه من أقاصي الأرض أيها المسافرون في عباب البحر وكل ما فيه وياسكان الجزائر."], [11, "لتهتف الصحراء ومدنها، وديار قيدار المأهولة. ليتغن بفرح أهل سالع وليهتفوا من قمم الجبال."], [12, "وليمجدوا الرب ويذيعوا حمده في الجزائر."]]}, {"l": "Zep 2:11", "n": "", "vs": [[11, "سيكون الرب مثار رعبهم حين يحطم جميع آلهة الأرض، فيسجد له آنئذ جميع الناس، كل في موضعه، في كل ديار المسكونة."]]}, {"l": "Joh 4:21-23", "n": "", "vs": [[21, "فأجابها يسوع: «صدقيني ياامرأة، ستأتي الساعة التي فيها تعبدون الآب لا في هذا الجبل ولا في أورشليم."], [22, "أنتم تعبدون ما تجهلون، ونحن نعبد ما نعلم، لأن الخلاص هو من عند اليهود."], [23, "فستأتي ساعة، لا بل هي الآن، حين يعبد العابدون الصادقون الآب بالروح وبالحق. لأن الآب يبتغي مثل هؤلاء العابدين."]]}, {"l": "Act 10:30-35", "n": "", "vs": [[30, "فأجاب كرنيليوس: «منذ أربعة أيام، في مثل هذه الساعة كنت أصلي في بيتي صلاة الساعة الثالثة بعد الظهر فظهر أمامي فجأة رجل يلبس ثوبا براقا"], [31, "وقال لي: ياكرنيليوس، سمع الله صلاتك وذكر صدقاتك."], [32, "والآن أرسل رجالا إلى يافا، واستدع سمعان الملقب بطرس. إنه يقيم في بيت سمعان الدباغ عند البحر."], [33, "فأرسلت حالا أدعوك، وقد أحسنت بمجيئك. ونحن الآن جميعا حاضرون أمام الله لنسمع كل ما أمرك به الرب»."], [34, "فبدأ بطرس كلامه قائلا: «تبين لي فعلا أن الله لا يفضل أحدا على أحد،"], [35, "بل يقبل من يتقيه ويعمل الصلاح مهما كانت جنسيته."]]}, {"l": "Rom 15:9-11", "n": "", "vs": [[9, "وإن الأمم يمجدون الله على الرحمة، وفقا لما قد كتب: «لهذا أعترف لك بين الأمم وأرتل لاسمك!»"], [10, "وأيضا قيل: «افرحوا، أيها الأمم، مع شعبه»."], [11, "وأيضا: «سبحوا الرب ياجميع الأمم، ولتحمده جميع الشعوب»."]]}, {"l": "Rom 15:16", "n": "", "vs": [[16, "وبذلك أكون خادم المسيح يسوع، المرسل إلى الأمم، حاملا إنجيل الله وكأني أقوم بخدمة كهنوتية، بقصد أن ترفع لله من بين الأمم تقدمة تكون مقبولة ومقدسة بالروح القدس."]]}, {"l": "1Ti 2:8", "n": "", "vs": [[8, "فأريد إذن، أن يصلي الرجال في كل مكان، رافعين أيادي طاهرة، وهم لا يضمرون أي حقد أو شكوك."]]}, {"l": "Rev 8:3", "n": "", "vs": [[3, "ثم جاء ملاك آخر ومعه مبخرة من ذهب ووقف عند المذبح، وأعطي بخورا كثيرا ليقدمه مع صلوات القديسين على مذبح الذهب أمام العرش،"]]}], "kwAr": "وفي كل مكان", "noteAr": ""}, {"kw": "incense", "raw": "Psa_141:2; Isa_60:6; Luk_1:10; Rom_12:1; Phi_4:18; Heb_13:15, Heb_13:16; Rev_5:8, Rev_8:3, Rev_8:4", "note": "", "refs": [{"l": "Psa 141:2", "n": "", "vs": [[2, "لتكن صلاتي أمامك كالبخور، ورفع يدي مثل تقدمة المساء."]]}, {"l": "Isa 60:6", "n": "", "vs": [[6, "تكتظ أرضك بكثرة الإبل. من أرض مديان وعيفة تغشاك بكران، تتقاطر إليك من شبا محملة بالذهب واللبان وتذيع تسبيح الرب."]]}, {"l": "Luk 1:10", "n": "", "vs": [[10, "وكان جمهور الشعب جميعا يصلون خارجا في وقت إحراق البخور."]]}, {"l": "Rom 12:1", "n": "", "vs": [[1, "لذلك أتوسل إليكم أيها الإخوة، نظرا لمراحم الله، أن تقدموا له أجسادكم ذبيحة مقدسة مقبولة عنده، وهي عبادتكم بعقل."]]}, {"l": "Phi 4:18", "n": "", "vs": [[18, "فالآن عندي كل ما يسد حاجتي ويزيد عنها. أنا في بحبوحة إذ تسلمت من أبفروديتس ما بعثتم به إلي، عطرا طيب الرائحة، ذبيحة يقبلها الله ويسر بها."]]}, {"l": "Heb 13:15", "n": "", "vs": [[15, "فبالمسيح، رئيس كهنتنا، لنقرب لله دائما ذبيحة الحمد والتسبيح، أي الثمار التي تنتجها أفواهنا المعترفة باسمه."]]}, {"l": "Heb 13:16", "n": "", "vs": [[16, "ولا تغفلوا أيضا عن عمل الخير وإعانة المحتاجين: لأن مثل هذه «الذبائح» تسر الله جدا!"]]}, {"l": "Rev 5:8", "n": "", "vs": [[8, "فسجد الشيوخ الأربعة والعشرون والكائنات الحية الأربعة أمام الحمل، وكان بيد كل منهم قيثارة وكؤوس ذهب مملوءة بالبخور، الذي هو صلوات القديسين."]]}, {"l": "Rev 8:3", "n": "", "vs": [[3, "ثم جاء ملاك آخر ومعه مبخرة من ذهب ووقف عند المذبح، وأعطي بخورا كثيرا ليقدمه مع صلوات القديسين على مذبح الذهب أمام العرش،"]]}, {"l": "Rev 8:4", "n": "", "vs": [[4, "فارتفع دخان البخور من يد الملاك مصحوبا بصلوات القديسين إلى حضرة الله."]]}], "kwAr": "بخور", "noteAr": ""}, {"kw": "for", "raw": "Isa_66:19, Isa_66:20", "note": "", "refs": [{"l": "Isa 66:19", "n": "", "vs": [[19, "وأجعل بينهم آية وأبعث بعض الناجين منهم إلى الأمم: إلى ترشيش، وفول، ولود، المهرة في رمي السهام، وإلى توبال وياوان وإلى الجزائر البعيدة ممن لم يسمعوا بشهرتي أو يروا مجدي، فيذيعون مجدي بين الأمم."]]}, {"l": "Isa 66:20", "n": "", "vs": [[20, "ويحضرون جميع إخوتكم من سائر الأمم، تقدمة للرب، على متون الجياد، وفي المركبات والهوادج، وعلى ظهور البغال وأسنمة الجمال، إلى أورشليم جبل قدسي، كما يحضر الإسرائيليون تقدمة الحنطة في آنية طاهرة إلى بيت الرب"]]}], "kwAr": "لأن اسمي", "noteAr":
