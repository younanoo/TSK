"refs": [{"l": "Psa 10:4", "n": "", "vs": [[4, "في تكبره وتشامخه لا يلتمس الله ، ولا مكان لله في أفكاره كلها،"]]}, {"l": "Psa 20:7", "n": "", "vs": [[7, "يتكل هؤلاء على مركبات الحرب، وأولئك على الخيل. أما نحن فنتكل على اسم الرب إلهنا."]]}, {"l": "Psa 94:19", "n": "", "vs": [[19, "عند كثرة همومي في داخلي تبتهج نفسي بتعزياتك."]]}, {"l": "Psa 104:33", "n": "", "vs": [[33, "أرنم للرب وأشدو لإلهي مادمت حيا."]]}, {"l": "Isa 26:3", "n": "", "vs": [[3, "أنت تحفظ ذا الرأي الثابت سالما لأنه عليك توكل."]]}, {"l": "Isa 26:8", "n": "", "vs": [[8, "انتظرناك يارب بشوق في طريق أحكامك. تتوق النفس إلى اسمك وتشتهي ذكرك."]]}, {"l": "Heb 4:12", "n": "", "vs": [[12, "ذلك لأن كلمة الله حية، وفعاله، وأمضى من كل سيف له حدان، وخارقة إلى مفترق النفس والروح والمفاصل ونخاع العظام، وقادرة أن تميز أفكار القلب ونياته."]]}, {"l": "Heb 4:13", "n": "", "vs": [[13, "وليس هنالك مخلوق واحد محجوب عن نظر الله، بل كل شيء عريان ومكشوف أمام عينيه، هو الذي سنؤدي له حسابا."]]}], "kwAr": "والمتأملين باسمه", "noteAr": ""}], "arS": [["ثم ", []], ["حدث", ["H1696"]], [" ", []], ["خائفو", ["H3373"]], [" ", []], ["الرب", ["H3068"]], [" بعضهم بعضا. ", []], ["فأصغى", ["H7181"]], [" ", []], ["الرب", ["H3068"]], [" إلى كلامهم ", []], ["وسمعهم", ["H8085"]], ["، فتم ", []], ["تدوين", ["H3789"]], [" أسماء ", []], ["متقي", ["H3372"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["والمتأملين", ["H2803"]], [" ", []], ["باسمه", ["H8034"]], [" ", []], ["أمامه", ["H6440"]], [" في ", []], ["كتاب", ["H5612"]], [" ", []], ["تذكرة", ["H2146"]], ["، ورد فيه:", []]]}, {"c": 3, "v": 17, "text": "سيكونون لي، يقول الرب القدير، في اليوم الذي أصنع فيه نفائسي، وأحافظ عليهم كما يحافظ الوالد على ابنه الذي يخدمه.", "groups": [{"kw": "they shall", "raw": "Son_2:16; Jer_31:33, Jer_32:38, Jer_32:39; Eze_16:8, Eze_36:27, Eze_36:28; Zec_13:9; Joh_10:27-30, Joh_17:9, Joh_17:10,Joh_17:24; 1Co_3:22, 1Co_3:23, 1Co_6:20, 1Co_15:23; Gal_5:24; 2Th_1:7-10; Rev_20:12-15", "note": "", "refs": [{"l": "Son 2:16", "n": "", "vs": [[16, "(المحبوبة): حبيبي لي وأنا له، هو يرعى قطيعه بين السوسن."]]}, {"l": "Jer 31:33", "n": "", "vs": [[33, "ولكن هذا هو العهد الذي أبرمه مع ذرية إسرائيل بعد تلك الأيام»، يقول الرب: «سأجعل شريعتي في دواخلهم، وأدونها على قلوبهم وأكون لهم إلها وهم يكونون لي شعبا."]]}, {"l": "Jer 32:38", "n": "", "vs": [[38, "فيكونون لي شعبا وأكون لهم إلها."]]}, {"l": "Jer 32:39", "n": "", "vs": [[39, "وأعطيهم قلبا واحدا وطريقا واحدا ليتقوني كل الأيام، وذلك لخيرهم وخير أولادهم من بعدهم."]]}, {"l": "Eze 16:8", "n": "", "vs": [[8, "فمررت بك ورأيتك وإذا بك قد بلغت سن الحب، فبسطت عليك أطراف ثوبي، وسترت عورتك وحلفت لك وأبرمت معك عهدا، فصرت لي، يقول السيد الرب."]]}, {"l": "Eze 36:27", "n": "", "vs": [[27, "وأضع روحي في داخلكم فأجعلكم تمارسون فرائضي وتطيعون أحكامي عاملين بها،"]]}, {"l": "Eze 36:28", "n": "", "vs": [[28, "وتستوطنون الأرض التي وهبتها لآبائكم وتكونون لي شعبا وأنا أكون لكم إلها،"]]}, {"l": "Zec 13:9", "n": "", "vs": [[9, "فأجيز هذا الثلث في النار لأنقيه تنقية الفضة، وأمحصه كما يمحص الذهب. هو يدعو باسمي وأنا أستجيبه. أنا أقول: هو شعبي، وهو يقول: الرب هو إلهي»."]]}, {"l": "Joh 10:27-30", "n": "", "vs": [[27, "فخرافي تصغي لصوتي، وأنا أعرفها وهي تتبعني،"], [28, "وأعطيها حياة أبدية، فلا تهلك إلى الأبد، ولا ينتزعها أحد من يدي."], [29, "إن الآب الذي أعطاني إياها هو أعظم من الجميع، ولا يقدر أحد أن ينتزع من يد الآب شيئا."], [30, "أنا والآب واحد!»"]]}, {"l": "Joh 17:9", "n": "", "vs": [[9, "من أجل هؤلاء أصلي إليك. لست أصلي الآن من أجل العالم، بل من أجل الذين وهبتهم لي، لأنهم لك."]]}, {"l": "Joh 17:10", "n": "", "vs": [[10, "وكل ما هو لي فهو لك، وكل ما هو لك فهو لي؛ وأنا قد تمجدت فيهم."]]}, {"l": "Joh 17:24", "n": "", "vs": [[24, "أيها الآب، أريد لهؤلاء الذين وهبتهم لي أن يكونوا معي حيث أكون أنا، فيشاهدوا مجدي الذي أعطيتني، لأنك أحببتني قبل إنشاء العالم."]]}, {"l": "1Co 3:22", "n": "", "vs": [[22, "أبولس أم أبلوس أم بطرس أم العالم أم الحيا ة أم الموت أم الحاضر أم المستقبل: هذه الأمور كلها لكم،"]]}, {"l": "1Co 3:23", "n": "", "vs": [[23, "وأنتم للمسيح، والمسيح لله."]]}, {"l": "1Co 6:20", "n": "", "vs": [[20, "لأنكم قد اشتريتم بفدية. إذن، مجدوا الله في أجسادكم."]]}, {"l": "1Co 15:23", "n": "", "vs": [[23, "على أن لكل واحد رتبته: فأولا المسيح بصفته البكر؛ وبعده خاصته لدى رجوعه،"]]}, {"l": "Gal 5:24", "n": "", "vs": [[24, "ولكن الذين صاروا خاصة للمسيح، قد صلبوا الجسد مع الأهواء والشهوات."]]}, {"l": "2Th 1:7-10", "n": "", "vs": [[7, "وأن يكافئكم، أنتم الذين تتضايقون، كما يكافئنا نحن، بالراحة لدى ظهور الرب يسوع علنا من السماء، ومعه ملائكة قدرته،"], [8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."], [9, "فهؤلاء سيكابدون عقاب الهلاك الأبدي، بعيدا من حضرة الرب ومن مجد قوته،"], [10, "عندما يعود في ذلك اليوم ليتمجد في قديسيه ويكون موضع العجب عند جميع الذين آمنوا، وأنتم قد آمنتم بشهادتنا لكم!"]]}, {"l": "Rev 20:12-15", "n": "", "vs": [[12, "ورأيت الأموات، كبارا وصغارا، واقفين قدام العرش. وفتحت الكتب، ثم فتح كتاب آخر هو سجل الحياة، ودين الأموات بحسب ما هو مدون في تلك الكتب، كل واحد حسب أعماله."], [13, "وسلم البحر من فيه من الأموات، وسلم الموت وهاوية الموتى الأموات الذين فيهما، وحكم على كل واحد بحسب أعماله."], [14, "وطرح الموت وهاوية الموتى في بحيرة النار، الذي هو الموت الثاني."], [15, "وكل من لم يوجد اسمه مكتوبا في سجل الحياة طرح في بحيرة النار!"]]}], "kwAr": "سيكونون لي", "noteAr": ""}, {"kw": "jewels", "raw": "or, special treasure, Exo_19:5; Deu_7:6, Deu_14:2, Deu_26:17, Deu_26:18; Psa_135:4; Isa_62:3, Isa_62:4; Tit_2:14; 1Pe_2:9", "note": "or, special treasure, Exo_19:5; Deu_7:6, Deu_14:2, Deu_26:17, Deu_26:18; Psa_135:4; Isa_62:3, Isa_62:4; Tit_2:14; 1Pe_2:9", "refs": [{"l": "Exo 19:5", "n": "", "vs": [[5, "لذلك إن أطعتم عهدي، تكونوا لي ملكا خاصا من بين جميع الشعوب، لأن لي كل الأرض."]]}, {"l": "Deu 7:6", "n": "", "vs": [[6, "لأنكم شعب مقدس للرب إلهكم. فإياكم قد اختار الرب إلهكم من بين جميع شعوب الأرض لتكونوا شعبه الخاص."]]}, {"l": "Deu 14:2", "n": "", "vs": [[2, "لأنكم شعب مقدس للرب إلهكم، وقد اختاركم من بين شعوب الأرض كافة لتكونوا له شعبا خاصا."]]}, {"l": "Deu 26:17", "n": "", "vs": [[17, "فأنتم قد أعلنتم اليوم أن الرب إلهكم وأنكم ستسلكون في سبله وتطيعون فرائضه وأحكامه وتسمعون لصوته"]]}, {"l": "Deu 26:18", "n": "", "vs": [[18, "كما أعلن الرب اليوم أنكم تكونون له شعبا خاصا، حسب وعده لكم، وأن عليكم طاعة وصاياه جميعها،"]]}, {"l": "Psa 135:4", "n": "", "vs": [[4, "لأن الرب قد اختار يعقوب لنفسه، واتخذ إسرائيل شعبا خاصا له."]]}, {"l": "Isa 62:3", "n": "", "vs": [[3, "وتكونين تاج جمال في يد الرب، وإكليلا ملكيا في كف إلهك."]]}, {"l": "Isa 62:4", "n": "", "vs": [[4, "ولا تعودين تدعين بالمهجورة، ولا يقال لأرضك من بعد خربة، بل تدعين «حفصيبة» (أي مسرتي بها)، وأرضك تدعى ذات بعل، لأن الرب يسر بك، وأرضك تصبح ذات بعل."]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}], "kwAr": "نفائسي", "noteAr": "أو: «كنزا خاصا». انظر خر 19: 5؛ تث 7: 6؛ 14: 2؛ 26: 17، 18؛ مز 135: 4؛ إش 62: 3، 4؛ تي 2: 14؛ 1بط 2: 9"}, {"kw": "and I", "raw": "Neh_13:22; Psa_103:8-13; Isa_26:20,Isa_26:21; Jer_31:20; Zep_2:2; Mat_25:34; Rom_8:32; 2Co_6:18; 1Jo_3:1-3", "note": "", "refs": [{"l": "Neh 13:22", "n": "", "vs": [[22, "وأمرت اللاويين أن يتطهروا ليأتوا ويقوموا بحراسة البوابات ليقدسوا يوم السبت. فاذكرني ياإلهي من أجل هذا أيضا، وأحسن إلي بحسب مراحمك الكثيرة."]]}, {"l": "Psa 103:8-13", "n": "", "vs": [[8, "الرب رحيم ورؤوف، بطيء الغضب ووافر الرحمة."], [9, "لا يسخط إلى الأبد ولا يحقد إلى الدهر."], [10, "لم يعاملنا حسب خطايانا ولم يجازنا حسب آثامنا."], [11, "مثل ارتفاع السماوات فوق الأرض، تعاظمت رحمته على متقيه."], [12, "وكبعد المشرق عن المغرب أبعد عنا معاصينا."], [13, "مثلما يعطف الأب على بنيه يعطف الرب على أتقيائه."]]}, {"l": "Isa 26:20", "n": "", "vs": [[20, "تعالوا يا شعبي وادخلوا إلى مخادعكم، وأوصدوا أبوابكم خلفكم. تواروا قليلا حتى يعبر السخط."]]}, {"l": "Isa 26:21", "n": "", "vs": [[21, "وانظروا فإن الرب خارج من مكانه ليعاقب سكان الأرض على آثامهم، فتكشف الأرض عما سفك عليها من دماء ولا تغطي قتلاها فيما بعد."]]}, {"l": "Jer 31:20", "n": "", "vs": [[20, "هل أفرايم ابن أثير لدي؟ أليس هو ابنا مسرا؟ لأني مع كثرة تنديدي به فإني مازلت أذكره، لذلك يشتاق قلبي إليه، وأكن له الرحمة»، يقول الرب."]]}, {"l": "Zep 2:2", "n": "", "vs": [[2, "قبل أن يحين القضاء، فيطوح بك كالعصافة أمام الريح، قبل أن يحل بك غضب الرب الماحق، قبل أن ينصب عليك سخط الرب."]]}, {"l": "Mat 25:34", "n": "", "vs": [[34, "ثم يقول الملك للذين عن يمينه: تعالوا يامن باركهم أبي، رثوا الملكوت الذي أعد لكم منذ إنشاء العالم:"]]}, {"l": "Rom 8:32", "n": "", "vs": [[32, "بل بذله لأجلنا جميعا، كيف لا يجود علينا معه بكل شيء أيضا؟"]]}, {"l": "2Co 6:18", "n": "", "vs": [[18, "فأقبلكم، وأكون لكم أبا، وتكونوا لي بنين وبنات»، هذا يقوله الرب القادر على كل شيء."]]}, {"l": "1Jo 3:1-3", "n": "", "vs": [[1, "تأملوا ما أعظم المحبة التي أحبنا بها الآب حتى صرنا ندعى «أولاد الله»، ونحن أولاده حقا. ولكن، بما أن أهل العالم لا يعرفون الله، فهم لا يعرفوننا."], [2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"], [3, "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر."]]}], "kwAr": "وأحافظ عليهم", "noteAr": ""}, {"kw": "son", "raw": "Mal_1:6; 1Pe_1:13-16", "note": "", "refs": [{"l": "Mal 1:6", "n": "", "vs": [[6, "إن الابن يكرم أباه والعبد سيده. فإن كنت أنا حقا أبا فأين كرامتي؟ وإن كنت حقا سيدا فأين مهابتي؟ إن الرب القدير يقول لكم: أيها الكهنة المزدرون باسمي؛ فتسألون: كيف ازدرينا باسمك؟"]]}, {"l": "1Pe 1:13-16", "n": "", "vs": [[13, "لذلك اجعلوا أذهانكم متنبهة دائما، وتيقظوا، وعلقوا رجاءكم كله على النعمة التي ستكون من نصيبكم عندما يعود يسوع المسيح ظاهرا بمجده!"], [14, "وبما أنكم صرتم أولادا لله مطيعين له، فلا تعودوا إلى مجاراة الشهوات التي كانت تسيطر عليكم سابقا في أيام جهلكم."], [15, "وإنما اسلكوا سلوكا مقدسا في كل أمر، مقتدين بالقدوس الذي دعاكم،"], [16, "لأنه قد كتب: «كونوا قديسين، لأني أنا قدوس!»"]]}], "kwAr": "ابنه", "noteAr": ""}], "arS": [["سيكونون", ["H1961"]], [" لي، ", []], ["يقول", ["H559"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["القدير", ["H6635"]], ["، في ", []], ["اليوم", ["H3117"]], [" الذي ", []], ["أصنع", ["H6213"]], [" فيه ", []], ["نفائسي", ["H5459"]], ["، ", []], ["وأحافظ", ["H2550", "H5921"]], [" عليهم كما ", []], ["يحافظ", ["H2550", "H5921"]], [" الوالد على ", []], ["ابنه", ["H1121"]], [" الذي ", []], ["يخدمه", ["H5647"]], [".", []]]}, {"c": 3, "v": 18, "text": "فتشرعون ثانية في التمييز بين الصالح والطالح، بين من يعبد الله ومن لا يعبده».", "groups": [{"kw": "shall", "raw": "Mal_3:14, Mal_3:15, Mal_1:4; Job_6:29, Job_17:10; Jer_12:15; Joe_2:14; Zec_1:6", "note": "", "refs": [{"l": "Mal 3:14", "n": "", "vs": [[14, "لقد قلتم: من العبث عبادة الله، وأي جدوى من حفظنا شعائره، والنواح أمام حضرة الرب القدير؟"]]}, {"l": "Mal 3:15", "n": "", "vs": [[15, "وها نحن الآن نغبط المستكبرين، ونرى فاعلي الشر يزدهرون، بل إنهم تحدوا الله ونجوا."]]}, {"l": "Mal 1:4", "n": "", "vs": [[4, "وإن قال الأدوميون: مع إننا تحطمنا فإننا نبني الخرب، فإن الرب القدير يقول: هم يعمرون وأنا أهدم، ويدعو الناس بلادهم، «أرض النفاق»، وأهلها بالأمة التي سخط الرب عليها إلى الأبد."]]}, {"l": "Job 6:29", "n": "", "vs": [[29, "ارجعوا، لا تكونوا حائرين، فإن أمانتي معرضة للاتهام."]]}, {"l": "Job 17:10", "n": "", "vs": [[10, "ولكن ارجعوا جميعكم، تعالوا كلكم، فلا أجد فيكم حكيما."]]}, {"l": "Jer 12:15", "n": "", "vs": [[15, "ولكن بعد أن أستأصلهم، أترَأف عليهم، وأعيدهم كل واحد إلى ميراثه وإلى أرضه."]]}, {"l": "Joe 2:14", "n": "", "vs": [[14, "لعله يرجع ويكف عن العقاب مخلفا وراءه بركة: تقدمة دقيق وتقدمة سكيب لتقربوهما للرب إلهكم."]]}, {"l": "Zec 1:6", "n": "", "vs": [[6, "ولكن ألم تدرك أقوالي وفرائضي التي أمرت بها عبيدي الأنبياء آباءكم فتابوا قائلين: لقد نفذ الرب القدير ما عزم أن يعاقبنا بمقتضى ما ارتكبناه من أعمال باطلة؟»"]]}], "kwAr": "فتشرعون ثانية", "noteAr": ""}, {"kw": "discern", "raw": "Gen_18:25; Psa_58:10,Psa_58:11; Isa_3:10,Isa_3:11; Dan_12:1-3; Mat_25:46; Rom_2:5, Rom_2:6; 2Th_1:5-10", "note": "", "refs": [{"l": "Gen 18:25", "n": "", "vs": [[25, "تنزهت عن أن تهلك البار مع الأثيم، فيكون البار كالأثيم؛ حاشا لك. أديان الأرض كلها لا يجري عدلا؟»"]]}, {"l": "Psa 58:10", "n": "", "vs": [[10, "يفرح الأبرار حين يرون عقاب الأشرار، ويغسلون أقدامهم بدمهم."]]}, {"l": "Psa 58:11", "n": "", "vs": [[11, "فيقول الناس: «حقا إن للصديق مكافأة، وإن في الأرض إلها يقضي»."]]}, {"l": "Isa 3:10", "n": "", "vs": [[10, "ولكن بشروا الصديقين بالخير لأنهم سيتمتعون بثواب أعمالهم"]]}, {"l": "Isa 3:11", "n": "", "vs": [[11, "أما الشرير فويل له وبئس المصير لأنه يجازى على ما جنته يداه"]]}, {"l": "Dan 12:1-3", "n": "", "vs": [[1, "«وفي ذلك الوقت يقوم الرئيس العظيم الملاك ميخائيل حارس شعبك، وذلك في أثناء ضيق لم يكن له مثيل منذ أن وجدت أمة حتى ذلك الزمان. غير أن كل من كان اسمه مدونا في الكتاب من شعبك ينجو في ذلك الزمان."], [2, "ويستيقظ كثيرون من الأموات المدفونين في تراب الأرض، بعضهم ليثابوا بالحياة الأبدية وبعضهم ليساموا ذل العار والازدراء إلى الأبد."], [3, "ويضيء الحكماء (أي شعب الله) كضياء الجلد، وكذلك الذين ردوا كثيرين إلى البر يشعون كالكواكب إلى مدى الدهر."]]}, {"l": "Mat 25:46", "n": "", "vs": [[46, "فيذهب هؤلاء إلى العقاب الأبدي، والأبرار إلى الحياة الأبدية! »"]]}, {"l": "Rom 2:5", "n": "", "vs": [[5, "ولكنك بسبب قساوتك وقلبك غير التائب، تخزن لنفسك غضبا ليوم الغضب، يوم تعلن دينونة الله العادلة."]]}, {"l": "Rom 2:6", "n": "", "vs": [[6, "فإنه سيجازي كل إنسان بحسب أعماله."]]}, {"l": "2Th 1:5-10", "n": "", "vs": [[5, "وفي هذا دليل على حكم الله العادل، بقصد أن تعتبروا مؤهلين لملكوت الله الذي من أجله تلاقون الآلام."], [6, "فمن العدل عند الله حقا أن يجازي بالضيقة أولئك الذين يضايقونكم،"], [7, "وأن يكافئكم، أنتم الذين تتضايقون، كما يكافئنا نحن، بالراحة لدى ظهور الرب يسوع علنا من السماء، ومعه ملائكة قدرته،"], [8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."], [9, "فهؤلاء سيكابدون عقاب الهلاك الأبدي، بعيدا من حضرة الرب ومن مجد قوته،"], [10, "عندما يعود في ذلك اليوم ليتمجد في قديسيه ويكون موضع العجب عند جميع الذين آمنوا، وأنتم قد آمنتم بشهادتنا لكم!"]]}], "kwAr": "التمييز", "noteAr": ""}, {"kw": "between him", "raw": "Jos_24:15; Dan_3:17-26; Joh_12:26; Act_16:17, Act_27:23; Rom_1:9, Rom_6:16-22; 1Th_1:9", "note": "", "refs": [{"l": "Jos 24:15", "n": "", "vs": [[15, "وإن ساءكم أن تعبدوا الرب، فاختاروا لأنفسكم اليوم من تعبدون سواء من الآلهة التي عبدها آباؤكم الذين استوطنوا شرقي نهر الفرات أم آلهة الأموريين الذين أنتم مقيمون في أرضهم. أما أنا وبيتي فنعبد الرب»."]]}, {"l": "Dan 3:17-26", "n": "", "vs": [[17, "لأن إلهنا الذي نعبده قادر أن ينجينا من أتون النار المتقدة، وأن ينقذنا من يدك أيها الملك."], [18, "وحتى إن لم ينقذنا، فاعلم يقينا أيها الملك أننا لا نعبد آلهتك، ولا نسجد لتمثال الذهب الذي نصبته»."], [19, "فاستشاط نبوخذناصر حنقا واكفهر وجهه غضبا على شدرخ وميشخ وعبدنغو، وأمر أن يضرموا الأتون سبعة أضعاف عما كانت عليه العادة."], [20, "وطلب من بعض رجال جيشه الصناديد أن يوثقوا شدرخ وميشخ وعبدنغو ويطرحوهم في أتون النار المتقدة."], [21, "حينئذ أوثق الرجال بما عليهم من ثيا ب وسراويل وأقمصة وأردية، وطرحوا في وسط أتون النار المتقدة."], [22, "وإذ كان أمر الملك صارما والأتون قد أضرم أشد إضرام، فإن لهيب النار أحر ق الرجال الذين حملوا شدرخ وميشخ وعبدنغو، وطرحوهم في النار."], [23, "فسقط هؤلاء الرجال الثلاثة موثقين وسط أتون النار المتقدة."], [24, "وما لبثت الحيرة أن اعترت نبوخذناصر، فهب مسرعا وقال لمشيريه: «ألم نطرح ثلاثة رجال موثقين في وسط النار؟» فأجابوا: «صحيح أيها الملك»."], [25, "فقال: «إني أرى أربعة رجال طليقين يتمشون في وسط النار، لم ينلهم أذى، ومنظر الرابع شبيه بابن الآلهة»."], [26, "ثم دنا نبوخذناصر من باب الأتون المتقد بالنار وهتف: «ياشدرخ وميشخ وعبدنغو ياعبيد الله العلي، اخرجوا وتعالوا». فخرج شدرخ وميشخ وعبدنغو من وسط النار."]]}, {"l": "Joh 12:26", "n": "", "vs": [[26, "من أراد أن يخدمني فليتبعني. وحيث أكون أنا يكون خادمي أيضا. وكل من يخدمني يكرمه أبي."]]}, {"l": "Act 16:17", "n": "", "vs": [[17, "فأخذت تسير وراء بولس ووراءنا صارخة: «هؤلاء الناس هم عبيد الله العلي، يعلنون لكم طريق الخلاص»."]]}, {"l": "Act 27:23", "n": "", "vs": [[23, "فقد ظهر لي هذه الليلة ملاك من عند الله الذي أنا له وإياه أخدم،"]]}, {"l": "Rom 1:9", "n": "", "vs": [[9, "فإن الله الذي أخدمه بروحي في التبشير بإنجيل ابنه، هو شاهد لي كيف لا أتوقف عن ذكركم"]]}, {"l": "Rom 6:16-22", "n": "", "vs": [[16, "أما تعلمون أنكم عندما تقدمون أنفسكم عبيدا للطاعة، تكونون للذي تطيعونه عبيدا: إما للخطيئة فإلى الموت، وإما للطاعة فإلى البر؟"], [17, "إنما الشكر لله، لأنكم كنتم عبيدا للخطيئة ولكن أطعتم من القلب صيغة التعليم الذي وضعتم في عهدته."], [18, "والآن، إذ حررتم من الخطيئة، صرتم عبيدا للبر."], [19, "أتكلم بشريا هنا بسبب ضعفكم البشري. فكما قدمتم سابقا أعضاءكم عبيدا للنجاسة والإثم في خدمة الإثم، كذلك قدموا الآن أعضاءكم عبيدا للبر في خدمة القداسة."], [20, "فإنكم، لما كنتم عبيدا للخطيئة، كنتم أحرارا من البر."], [21, "ولكن أي ثمر أنتجتم حينذاك من الأمور التي تخجلون بها الآن، وما عاقبتها إلا الموت؟"], [22, "أما الآن، وقد حررتم من الخطيئة وصرتم عبيدا لله، فإن لكم ثمركم للقداسة، والعاقبة هي الحياة الأبدية."]]}, {"l": "1Th 1:9", "n": "", "vs": [[9, "فإن أولئك المؤمنين أنفسهم يخبرون عنا كيف كان قدومنا إليكم أول مرة، وكيف تحولتم إلى الله عن الأصنام، لتصيروا عبيدا يخدمون الله الحي الحق،"]]}], "kwAr": "بين من يعبد الله", "noteAr": ""}], "arS": [["فتشرعون", ["H7725"]], [" ثانية في ", []], ["التمييز", ["H7200"]], [" ", []], ["بين", ["H996"]], [" ", []], ["الصالح", ["H6662"]], [" ", []], ["والطالح", ["H7563"]], ["، ", []], ["بين", ["H996"]], [" من ", []], ["يعبد", ["H5647"]], [" ", []], ["الله", ["H430"]], [" ومن ", []], ["لا", ["H3808"]], [" ", []], ["يعبده", ["H5647"]], ["».", []]]}, {"c": 4, "v": 1, "text": "«انظروا، ها يوم القضاء مقبل، لاهب كتنور يكون فيه جميع المستكبرين وفاعلي الإثم عصافة، فيحرقهم ذلك اليوم ولا يبقي لهم أصلا ولا فرعا، يقول الرب القدير.", "groups": [{"kw": "the day", "raw": "Mal_4:5, Mal_3:2; Eze_7:10; Joe_2:1, Joe_2:31; Zep_1:14; Zec_14:1; Luk_19:43, Luk_21:20; 2Pe_3:7", "note": "", "refs": [{"l": "Mal 4:5", "n": "", "vs": [[5, "ها أنا أرسل إليكم إيليا النبي قبل أن يجيء يوم قضاء الرب الرهيب العظيم"]]}, {"l": "Mal 3:2", "n": "", "vs": [[2, "ولكن من يحتمل يوم مجيئه؟ ومن يثبت عند ظهوره؟ فإنه مثل نار الممحص أو أشنان القصارين."]]}, {"l": "Eze 7:10", "n": "", "vs": [[10, "ها هو الي ين لإنجيل ربنا يسوع."]]}], "kwAr": "لاهب كتنور", "noteAr": ""}, {"kw": "and all the", "raw": "Mal_3:15, Mal_3:18; Exo_15:7; Psa_119:119; Isa_2:12-17, Isa_5:24, Isa_40:24, Isa_41:2, Isa_47:14; Oba_1:18; Nah_1:10", "note": "", "refs": [{"l": "Mal 3:15", "n": "", "vs": [[15, "وها نحن الآن نغبط المستكبرين، ونرى فاعلي الشر يزدهرون، بل إنهم تحدوا الله ونجوا."]]}, {"l": "Mal 3:18", "n": "", "vs": [[18, "فتشرعون ثانية في التمييز بين الصالح والطالح، بين من يعبد الله ومن لا يعبده»."]]}, {"l": "Exo 15:7", "n": "", "vs": [[7, "بعظمة جلالك تصرع مقاوميك. ترسل غضبك فتأكلهم كالقش."]]}, {"l": "Psa 119:119", "n": "", "vs": [[119, "رذلت جميع أشرار الأرض كأنهم نفاية، لذلك أحببت شهاداتك."]]}, {"l": "Isa 2:12-17", "n": "", "vs": [[12, "فإن للرب القدير يوما فيه يوضع كل متعظم ومتكبر ومتغطرس."], [13, "ويسمو على أرز لبنان المتعالي الشامخ، وعلى كل بلوط باشان،"], [14, "وعلى كل جبل أشم، وعلى التلال المرتفعة،"], [15, "وعلى كل برج عال، وسور حصين،"], [16, "وعلى كل سفن ترشيش، وعلى كل صنعة جميلة،"], [17, "فيعتري الهوان غطرسة كل إنسان، ويذل تشامخ البشر، ويتعظم الرب وحده في ذلك اليوم،"]]}, {"l": "Isa 5:24", "n": "", "vs": [[24, "لهذا كما تلتهم النار القش، وكما يفنى الحشيش الجاف في اللهب، كذلك يصيب أصولهم العفن، ويتناثر زهرهم كالتراب، لأنهم نبذوا شريعة الله واستهانوا بكلمة قدوس إسرائيل"]]}, {"l": "Isa 40:24", "n": "", "vs": [[24, "فما كادوا يغرسون ويزرعون ويتأصلون في الأرض حتى نفخ عليهم، فذووا وعصفت بهم زوبعة كالتبن."]]}, {"l": "Isa 41:2", "n": "", "vs": [[2, "من أقام من المشرق قائدا مظفرا، يواكب النصر كل خطوة من خطواته، وأسلم الأمم إليه وأخضع له الملوك، وجعلهم كالتراب بسيفه، وكالعصافة المذراة بقوسه؟"]]}, {"l": "Isa 47:14", "n": "", "vs": [[14, "غير أنهم أنفسهم أصبحوا كالهشيم الذي تلتهمه النار عاجزين عن إنقاذ أنفسهم وإنقاذك من شدة اللهب المحرق، فلا هو جمر للاستدفاء ولا هي نار للجلوس حولها."]]}, {"l": "Oba 1:18", "n": "", "vs": [[18, "ويصير بيت يعقوب نارا، وبيت يوسف لهيبا، وبيت عيسو قشا فيوقدونهم ويلتهمونهم، ولا يفلت من بيت عيسو أحد، يقول الرب."]]}, {"l": "Nah 1:10", "n": "", "vs": [[10, "وتلتهمهم النار
