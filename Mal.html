22:28", "n": "", "vs": [[28, "فأجابه ميخا: «إن رجعت بسلام لا يكون الرب قد تكلم على لساني، فاشهدوا على ذلك أيها الشعب جميعا»."]]}, {"l": "Jer 28:15", "n": "", "vs": [[15, "وأضاف إرميا النبي مخاطبا حننيا المتنبيء: «اسمع ياحننيا، هذا ما يعلنه الرب: إن الرب لم يبعثك، وأنت جعلت هذا الشعب يصدق كذبك."]]}, {"l": "Jer 28:16", "n": "", "vs": [[16, "لذلك هكذا يعلن الرب: ها أنا أبيدك عن وجه الأرض فتموت في هذه السنة لأنك نطقت بالتمرد على الرب»."]]}, {"l": "Jer 29:20-22", "n": "", "vs": [[20, "أما أنتم فاسمعوا كلمة الرب ياجميع المسبيين الذين أجليتهم عن أورشليم إلى بابل."], [21, "يقول الرب القدير إله إسرائيل عن أخآب بن قولايا وعن صدقيا بن معسيا اللذين يتنبآن لكم باسمي زورا: «ها أنا أسلمهما ليد نبوخذناصر ملك بابل فيقتلهما على مرأى منكم،"], [22, "فيصبحان مثل لعنة بين جميع المسبيين من يهوذا في بابل، فيقال: ليجعلك الله نظير صدقيا وأخآب اللذين قلاهما ملك بابل بالنار،"]]}, {"l": "Jer 29:31", "n": "", "vs": [[31, "«ابعث إلى جميع المسبيين قائلا: هذا ما يعلنه الرب عن شمعيا النحلامي: بما أن شمعيا قد تنبأ لكم مع أني لم أرسله وجعلكم تصدقون الكذب،"]]}, {"l": "Jer 29:32", "n": "", "vs": [[32, "فلذلك يقول الرب: ها أنا أعاقب شمعيا وذريته فلا يمتد العمر بأحد منهم بين هذا الشعب ليشهد الخير الذي سأجريه على شعبي، لأنه نطق بالتمرد علي»."]]}, {"l": "Eze 13:12-16", "n": "", "vs": [[12, "فلا يلبث السور أن ينهار أفلا تسألون آنئذ: أين الطين الذي طينتم به؟"], [13, "لذلك، هذا ما يعلنه السيد الرب: ها أنا أجعل ريحا عاتية تخترق السور بفعل حنقي، ومطرا جارفا ينهمر في خضم غضبي، وحجارة برد تتساقط في أثناء سخطي لكي تهلك،"], [14, "فأهدم السور الذي طليتموه بماء الكلس وأسويه بالأرض فيتعرى أساسه وتتداعى المدينة وتفنون جميعا في وسطها فتدركون أني أنا الرب."], [15, "فأنفث غضبي بالسور وبمن يطلونه بماء الكلس وأقول لكم: قد تلاشى السور والذين يطلونه."], [16, "الذين هم أنبياء إسرائيل الأدعياء، المتنبئون لإسرائيل، الذين يرون لها رؤى سلام، مع أنه لا سلام هناك، يقول السيد الرب."]]}, {"l": "Eze 13:21", "n": "", "vs": [[21, "وأمزق أنقابكن وأنقذ شعبي من أيديكن، فلا يظلون بعد في قبضتكن فريسة، فتدركن أني أنا الرب."]]}, {"l": "Mar 7:13", "n": "", "vs": [[13, "وهكذا تبطلون كلمة الله بتعليمكم التقليدي الذي تتناقلونه. وهناك أمور كثيرة مثل هذه تفعلونها! »"]]}, {"l": "Mar 7:14", "n": "", "vs": [[14, "وإذ دعا الجمع إليه ثانية، قال لهم: «اسمعوا لي كلكم وافهموا!"]]}, {"l": "Luk 20:45-47", "n": "", "vs": [[45, "وفيما كان جميع الشعب يصغون، قال لتلاميذه:"], [46, "«احذروا من الكتبة الذين يرغبون التجول بالأثواب الفضفاضة، ويحبون تلقي التحيات في الساحات العامة، وصدور المجالس في المجامع، وأماكن الصدارة في الولائم؛"], [47, "يلتهمون بيوت الأرامل ويتذرعون بإطالة الصلوات. هؤلاء ستنزل بهم دينونة أقسى!»"]]}], "kwAr": "أمام جميع الناس", "noteAr": ""}, {"kw": "but", "raw": "Mal_2:8; Mat_5:21, Mat_5:22, Mat_5:27, Mat_5:28, Mat_5:33-37, Mat_5:43, Mat_5:44, Mat_19:17, Mat_19:18, Mat_23:16-24; Mar_7:8-13; Luk_10:29, Luk_11:42; Rom_7:7-10", "note": "", "refs": [{"l": "Mal 2:8", "n": "", "vs": [[8, "ولكنكم انحرفتم عن الطريق المستقيم، وأعثرتم بتعاليمكم كثيرين، ونقضتم عهدي مع النسل الكهنوتي، يقول الرب القدير."]]}, {"l": "Mat 5:21", "n": "", "vs": [[21, "سمعتم أنه قيل للأقدمين: لا تقتل! ومن قتل يستحق المحاكمة."]]}, {"l": "Mat 5:22", "n": "", "vs": [[22, "أما أنا فأقول لكم: كل من هو غاضب على أخيه، يستحق المحاكمة؛ ومن يقول لأخيه: ياتافه! يستحق المثول أمام المجلس الأعلى؛ ومن يقول: ياأحمق! يستحق نار جهنم!"]]}, {"l": "Mat 5:27", "n": "", "vs": [[27, "وسمعتم أنه قيل: لا تزن!"]]}, {"l": "Mat 5:28", "n": "", "vs": [[28, "أما أنا فأقول لكم: كل من ينظر إلى امرأة بقصد أن يشتهيها، فقد زنى بها في قلبه!"]]}, {"l": "Mat 5:33-37", "n": "", "vs": [[33, "وسمعتم أنه قيل للأقدمين: لا تخالف قسمك، بل أوف للرب ما نذرته له."], [34, "أما أنا فأقول لكم: لا تحلفوا أبدا، لا بالسماء لأنها عرش الله،"], [35, "ولا بالأرض لأنها موطيء قدميه، ولا بأورشليم لأنها مدينة الملك الأعظم."], [36, "ولا تحلف برأسك لأنك لا تقدر أن تجعل شعرة واحدة فيها بيضاء أو سوداء."], [37, "ليكن كلامكم: نعم، إن كان نعم؛ أو: لا، إن كان لا. وما زاد على ذلك فهو من الشرير."]]}, {"l": "Mat 5:43", "n": "", "vs": [[43, "وسمعتم أنه قيل: تحب قريبك وتبغض عدوك."]]}, {"l": "Mat 5:44", "n": "", "vs": [[44, "أما أنا فأقول لكم: أحبوا أعداءكم، وباركوا لاعنيكم، وأحسنوا معاملة الذين يبغضونكم، وصلوا لأجل الذين يسيئون إليكم ويضطهدونكم،"]]}, {"l": "Mat 19:17", "n": "", "vs": [[17, "فأجابه: «لماذا تسألني عن الصالح؟ واحد هو الصالح. ولكن، إن أردت أن تدخل الحياة، فاعمل بالوصايا»."]]}, {"l": "Mat 19:18", "n": "", "vs": [[18, "فسأل: «أية وصايا؟» أجابه يسوع: «لا تقتل؛ لا تزن؛ لا تسرق؛ لا تشهد بالزور؛"]]}, {"l": "Mat 23:16-24", "n": "", "vs": [[16, "الويل لكم أيها القادة العميان! تقولون: من أقسم بالهيكل، فقسمه غير ملزم؛ أما من أقسم بذهب الهيكل، فقسمه ملزم!"], [17, "أيها الجهال والعميان! أي الاثنين أعظم: الذهب أم الهيكل الذي يجعل الذهب مقدسا؟"], [18, "وتقولون: من أقسم بالمذبح، فقسمه غير ملزم؛ أما من أقسم بالقربان الذي على المذبح، فقسمه ملزم!"], [19, "أيها العميان! أي الاثنين أعظم: القربان أم المذبح الذي يجعل القربان مقدسا؟"], [20, "فإن من أقسم بالمذبح، فقد أقسم به وبكل ما عليه؛"], [21, "ومن أقسم بالهيكل، فقد أقسم به وبالساكن فيه؛"], [22, "ومن أقسم بالسماء، فقد أقسم بعرش الله وبالجالس عليه!"], [23, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تؤدون حتى عشور النعنع والشبث والكمون، وقد أهملتم أهم ما في الشريعة: العدل والرحمة والأمانة. كان يجب أن تفعلوا هذه ولا تغفلوا تلك!"], [24, "أيها القادة العميان! إنكم تصفون الماء من البعوضة، ولكنكم تبلعون الجمل!"]]}, {"l": "Mar 7:8-13", "n": "", "vs": [[8, "فقد أهملتم وصية الله وتمسكتم بتقليد الناس!»"], [9, "وقال لهم: «حقا أنكم رفضتم وصية الله لتحافظوا على تقليدكم أنتم!"], [10, "فإن موسى قال: أكرم أباك وأمك! وأيضا: من أهان أباه أو أمه، فليكن الموت عقابا له!"], [11, "ولكنكم أنتم تقولون: إذا قال أحد لأبيه أو أمه: إن ما كنت أعولك به قد جعلته قربانا، أي تقدمة (للهيكل)،"], [12, "فهو في حل من إعانة أبيه أو أمه!"], [13, "وهكذا تبطلون كلمة الله بتعليمكم التقليدي الذي تتناقلونه. وهناك أمور كثيرة مثل هذه تفعلونها! »"]]}, {"l": "Luk 10:29", "n": "", "vs": [[29, "لكنه إذ كان راغبا في تبرير نفسه، سأل يسوع: «ومن هو قريبي؟»"]]}, {"l": "Luk 11:42", "n": "", "vs": [[42, "ولكن الويل لكم أيها الفريسيون فإنكم تدفعون عشر النعنع والسذاب والبقول الأخرى، وتتجاوزون عن العدل ومحبة الله: كان يجب أن تعملوا هذا ولا تهملوا ذاك!"]]}, {"l": "Rom 7:7-10", "n": "", "vs": [[7, "إذن، ماذا نقول؟ هل الشريعة خطيئة؟ حاشا! ولكني ما عرفت الخطيئة إلا بالشريعة. فما كنت لأعرف الشهوة لولا قول الشريعة: «لا تشته!»"], [8, "ولكن الخطيئة استغلت هذه الوصية فأثارت في كل شهوة. فإن الخطيئة، لولا الشريعة، ميتة."], [9, "أما أنا فكنت من قبل عائشا بمعزل عن الشريعة؛ ولكن لما جاءت الشريعة عاشت الخطيئة،"], [10, "فمت أنا. والوصية الهادفة إلى الحياة، صارت لي مؤدية إلى الموت."]]}], "kwAr": "لأنكم لم تطيعوا", "noteAr": ""}, {"kw": "have been partial in", "raw": "or, lifted up the face against, Heb. accepted faces. Deu_1:17 *marg. Gal_2:6", "note": "or, lifted up the face against, Heb. accepted faces. Deu_1:17 *marg. Gal_2:6", "refs": [{"l": "Deu 1:17", "n": "*marg.", "vs": [[17, "لا تحابوا في القضاء واستمعوا للصغير كما تستمعون للكبير. لا تهابوا إنسانا، لأن القضاء لله. وما يشكل عليكم من أمر ترفعونه إلي فأقضي فيه."]]}, {"l": "Gal 2:6", "n": "", "vs": [[6, "أما الذين كانوا يعتبرون من البارزين، ولا فرق عندي مهما كانت مكانتهم مادام الله لا يراعي وجاهة إنسان، فإنهم لم يزيدوا شيئا على ما أبشر به."]]}], "kwAr": "وحابيتم في تطبيق شريعتي", "noteAr": "أو: «رفعتم الوجه ضد»؛ بالعبرية: «قبلتم الوجوه». انظر تث 1: 17؛ غل 2: 6"}], "arS": [["لذلك ", []], ["أحقركم", ["H959"]], [" ", []], ["وأذلكم", ["H8217"]], [" أمام ", []], ["جميع", ["H3605"]], [" ", []], ["الناس", ["H5971"]], ["، لأنكم لم ", []], ["تطيعوا", ["H8104"]], [" ", []], ["طرقي", ["H1870"]], ["، ", []], ["وحابيتم", ["H5375", "H6440"]], [" في تطبيق ", []], ["شريعتي", ["H8451"]], ["».", []]]}, {"c": 2, "v": 10, "text": "أليس لنا جميعا أب واحد؟ ألم يخلقنا إله واحد، فما بالنا يغدر أحدنا بالآخر وندنس عهد آبائنا؟", "groups": [{"kw": "all", "raw": "Mal_1:6; Jos_24:3; Isa_51:2, Isa_63:16, Isa_64:8; Eze_33:24; Mat_3:9; Luk_1:73, Luk_3:8; Joh_8:39, Joh_8:53, Joh_8:56; Act_7:2; Rom_4:1, Rom_9:10; 1Co_8:6; Eph_4:6; Heb_12:9", "note": "", "refs": [{"l": "Mal 1:6", "n": "", "vs": [[6, "إن الابن يكرم أباه والعبد سيده. فإن كنت أنا حقا أبا فأين كرامتي؟ وإن كنت حقا سيدا فأين مهابتي؟ إن الرب القدير يقول لكم: أيها الكهنة المزدرون باسمي؛ فتسألون: كيف ازدرينا باسمك؟"]]}, {"l": "Jos 24:3", "n": "", "vs": [[3, "فأخذت أباكم إبراهيم من شرقي النهر وقدته عبر أرض كنعان وكثرت نسله، ورزقته بإسحق،"]]}, {"l": "Isa 51:2", "n": "", "vs": [[2, "انظروا إلى إبراهيم أبيكم وإلى سارة التي أنجبتكم، فقد دعوته حين كان فردا واحدا وباركته وأكثرته."]]}, {"l": "Isa 63:16", "n": "", "vs": [[16, "فأنت هو أبونا، مع أن إبراهيم لا يعرفنا، وإسرائيل لا يعترف بنا، فأنت أيها الرب، هو أبونا، واسمك فادينا منذ القديم."]]}, {"l": "Isa 64:8", "n": "", "vs": [[8, "ومع ذلك فأنت أيها الرب أبونا، نحن الطين وأنت الخزاف، وكلنا عمل يديك."]]}, {"l": "Eze 33:24", "n": "", "vs": [[24, "«ياابن آدم، إن المقيمين في خرائب أرض إسرائيل يقولون إن إبراهيم كان فردا واحدا ومع ذلك ورث الأرض، وهكذا نحن كثيرون، وقد وهبت لنا الأرض ميراثا."]]}, {"l": "Mat 3:9", "n": "", "vs": [[9, "ولا تعللوا أنفسكم قائلين: لنا إبراهيم أبا! فإني أقول لكم: إن الله قادر أن يطلع من هذه الحجارة أولادا لإبراهيم."]]}, {"l": "Luk 1:73", "n": "", "vs": [[73, "ذلك القسم الذي أقسم لإبراهيم أبينا: بأن يمنحنا،"]]}, {"l": "Luk 3:8", "n": "", "vs": [[8, "فأثمروا أثمارا تليق بالتوبة، ولا تبتدئوا تقولون في أنفسكم: لنا إبراهيم أبا! فإني أقول لكم إن الله قادر أن يطلع من هذه الحجارة أولادا لإبراهيم."]]}, {"l": "Joh 8:39", "n": "", "vs": [[39, "فاعترضوه قائلين: «أبونا هو إبراهيم!» فقال لو كنتم أولاد إبراهيم لعملتم أعمال إبراهيم."]]}, {"l": "Joh 8:53", "n": "", "vs": [[53, "أأنت أعظم من أبينا إبراهيم الذي مات؟ حتى الأنبياء ماتوا؛ فمن تجعل نفسك؟»"]]}, {"l": "Joh 8:56", "n": "", "vs": [[56, "أبوكم إبراهيم ابتهج لرجائه أن يرى يومي، فرآه وفرح»"]]}, {"l": "Act 7:2", "n": "", "vs": [[2, "فأجاب: «أيها الإخوة والآباء، اسمعوا: ظهر إله المجد لأبينا إبراهيم وهو في بلاد ما بين النهرين، قبل أن يرحل ليسكن في حاران،"]]}, {"l": "Rom 4:1", "n": "", "vs": [[1, "والآن، ما قولنا في إبراهيم أبينا حسب الجسد؟ ماذا وجد؟"]]}, {"l": "Rom 9:10", "n": "", "vs": [[10, "ليس ذلك فقط، بل إن رفقة أيضا، وقد حبلت من رجل واحد، من إسحاق أبينا،"]]}, {"l": "1Co 8:6", "n": "", "vs": [[6, "فليس عندنا نحن إلا إله واحد هو الآب الذي منه كل شيء، ونحن له؛ ورب واحد هو يسوع المسيح الذي به كل شيء ونحن به."]]}, {"l": "Eph 4:6", "n": "", "vs": [[6, "وإله وآب واحد للجميع، وهو فوق الجميع وبالجميع وفي الجميع."]]}, {"l": "Heb 12:9", "n": "", "vs": [[9, "إن آباءنا الأرضيين كانوا يؤدبوننا ونحن أولاد، وكنا نحترمهم. أفلا يجدر بنا الآن أن نخضع خضوعا تاما لتأديب أبي الأرواح، لنحيا حياة فضلى؟"]]}], "kwAr": "لنا جميعا أب واحد", "noteAr": ""}, {"kw": "hath", "raw": "Job_31:15; Psa_100:3; Isa_43:1, Isa_43:7, Isa_43:15, Isa_44:2; Joh_8:41; Act_17:25", "note": "", "refs": [{"l": "Job 31:15", "n": "", "vs": [[15, "أليس الذي كونني في الرحم كونه أيضا؟ أو ليس الذي شكلنا في الرحم واحد؟"]]}, {"l": "Psa 100:3", "n": "", "vs": [[3, "اعلموا أن الرب هو الله . هو صنعنا ونحن له، نحن شعبه وقطيع مرعاه."]]}, {"l": "Isa 43:1", "n": "", "vs": [[1, "أما الآن، فهذا ما يقوله الرب خالقك يايعقوب وجابلك ياإسرائيل: «لا تجزع لأني افتديتك، دعوتك باسمك. أنت لي."]]}, {"l": "Isa 43:7", "n": "", "vs": [[7, "كل من يدعى باسمي ممن خلقته لمجدي وجبلته وصنعته»."]]}, {"l": "Isa 43:15", "n": "", "vs": [[15, "أنا هو الرب قدوسكم خالق إسرائيل وملككم."]]}, {"l": "Isa 44:2", "n": "", "vs": [[2, "أنا خالقكم من الرحم ومعينكم، لا تخف يا عبدي يعقوب ولا تجزعي يا أورشليم التي اخترتها."]]}, {"l": "Joh 8:41", "n": "", "vs": [[41, "أنتم تعملون أعمال أبيكم!» فقالوا له: «نحن لم نولد من زنا! لنا أب واحد هو الله »."]]}, {"l": "Act 17:25", "n": "", "vs": [[25, "وليس بحاجة إلى خدمة يقدمها له الناس. فإنه يهب جميع الخلق الحياة والنفس وكل شيء."]]}], "kwAr": "ألم يخلقنا", "noteAr": ""}, {"kw": "why", "raw": "Mal_2:11, Mal_2:14, Mal_2:15; Jer_9:4, Jer_9:5; Mic_7:2-6; Mat_10:21, Mat_22:16; Act_7:26; 1Co_6:6-8; Eph_4:25; 1Th_4:6", "note": "", "refs": [{"l": "Mal 2:11", "n": "", "vs": [[11, "لقد غدر يهوذا وارتكب الرجاسة في إسرائيل وفي أورشليم لأن يهوذا قد دنس هيكل الرب المحبوب، وتزوج من بنات يعبدن آلهة غريبة."]]}, {"l": "Mal 2:14", "n": "", "vs": [[14, "وتتساءلون: لماذا؟ لأن الرب كان شاهدا على العهد المقطوع بينك وبين زوجة صباك التي غدرت بها، مع أنها شريكتك وامرأة عهدك."]]}, {"l": "Mal 2:15", "n": "", "vs": [[15, "ولكن لم يقدم على ذلك أي واحد مازالت فيه بقية من الروح. وماذا طلب هذا الواحد (أي إبراهيم)؟ ذرية الله. لهذا حافظوا على أرواحكم، ولا يغدر أحد بزوجة صباه."]]}, {"l": "Jer 9:4", "n": "", "vs": [[4, "«ليحترس كل واحد من جاره، ولا يثق بأحد من أقربائه، لأن كل قريب مخادع، وكل صاحب واش."]]}, {"l": "Jer 9:5", "n": "", "vs": [[5, "كل واحد منهم يخدع جاره ولا ينطقون بالصدق. دربوا ألسنتهم على قول الكذب، وأرهقوا أنفسهم في ارتكاب الإثم."]]}, {"l": "Mic 7:2-6", "n": "", "vs": [[2, "قد باد الصالح من الأرض واختفى المستقيم من بين الناس. جميعهم يكمنون لسفك الدماء، وكل واحد منهم يقتنص أخاه."], [3, "تجد أيديهم في ارتكاب الشر، ويسعى الرئيس والقاضي وراء الرشوة، ويملي العظيم عليهم أهواء نفسه، فيتآمرون جميعا على الحق."], [4, "أفضلهم مثل العوسج، وأكثرهم استقامة أسوأ من سياج الشوك. وها يوم عقابكم الذي أنذر به أنبياؤكم قد وافى. عندئذ يعتريكم الارتباك."], [5, "لا تأتمن جارك ولا تثق بصديق، واحترس مما تنطق به شفتاك ممن ترقد في حضنك."], [6, "فإن الابن يستخف بأبيه والابنة تتمرد على أمها، والكنة على حماتها، وأعداء الإنسان أهل بيته."]]}, {"l": "Mat 10:21", "n": "", "vs": [[21, "وسوف يسلم الأخ أخاه إلى الموت، والأب ولده. ويتمرد الأولاد على والديهم، ويقتلونهم!"]]}, {"l": "Mat 22:16", "n": "", "vs": [[16, "فأرسلوا إليه بعض تلاميذهم مع أعضاء حزب هيرودس، يقولون له: «يامعلم، نعلم أنك صادق وتعلم الناس طريق الله في الحق، ولا تبالي بأحد لأنك لا تراعي مقامات الناس،"]]}, {"l": "Act 7:26", "n": "", "vs": [[26, "وفي اليوم التالي وجد اثنين من إخوته يتعاركان، فحاول أن يصلح بينهما، قائلا: أنتما أخوان، فلماذا يعتدي أحدكما على الآخر؟"]]}, {"l": "1Co 6:6-8", "n": "", "vs": [[6, "غير أن الأخ يقاضي أخاه، وذلك لدى غير المؤمنين."], [7, "والواقع أنه من العيب على الإطلاق أن يقاضي بعضكم بعضا. أما كان أحر ى بكم أن تحتملوا الظلم وأحرى بكم أن تتقبلوا السلب؟"], [8, "ولكنكم أنتم تظلمون وتسلبون حتى إخوتكم."]]}, {"l": "Eph 4:25", "n": "", "vs": [[25, "لذلك اخلعوا عنكم الكذب، وتكلموا بالصدق كل واحد مع قريبه، لأننا أعضاء بعضنا لبعض."]]}, {"l": "1Th 4:6", "n": "", "vs": [[6, "وألا يتعدى حقوق أخيه ويسيء إليه في هذا الأمر، لأن الرب هو المنتقم لجميع هذه الإساءات، كما أنذرناكم قبلا وشهدنا لكم بحق."]]}], "kwAr": "فما بالنا", "noteAr": ""}, {"kw": "by", "raw": "Mal_2:8, Mal_2:11; Exo_34:10-16; Jos_23:12-16; Ezr_9:11-14, Ezr_10:2, Ezr_10:3; Neh_13:29", "note": "", "refs": [{"l": "Mal 2:8", "n": "", "vs": [[8, "ولكنكم انحرفتم عن الطريق المستقيم، وأعثرتم بتعاليمكم كثيرين، ونقضتم عهدي مع النسل الكهنوتي، يقول الرب القدير."]]}, {"l": "Mal 2:11", "n": "", "vs": [[11, "لقد غدر يهوذا وارتكب الرجاسة في إسرائيل وفي أورشليم لأن يهوذا قد دنس هيكل الرب المحبوب، وتزوج من بنات يعبدن آلهة غريبة."]]}, {"l": "Exo 34:10-16", "n": "", "vs": [[10, "فأجاب الرب: «ها أنا أبرم معك ميثاقا، فأجري أمام جميع شعبك معجزات لم يجر مثيلها في جميع أمم الأرض كلها، فيشهد الشعب الذي تقيم في وسطه، الفعل المهول الذي أصنعه من أجلك."], [11, "ولكن أطع ما أوصيتك اليوم به. ها أنا طارد من أمامك الأموريين والكنعانيين والحثيين والفرزيين والحويين واليبوسيين."], [12, "إياك أن تعقد معاهدة مع سكان الأرض التي أنت ماض إليها لئلا يكونوا شركا لكم."], [13, "بل اهدموا مذابحهم، واكسروا أنصابهم، واقطعوا أشجارهم المقدسة."], [14, "إياكم أن تعبدوا إلها آخر غيري، لأن الرب اسمه غيور جدا."], [15, "إياكم أن تعقدوا معاهدة مع سكان الأرض، لأنهم حين يعبدون آلهتهم مشركين ويذبحون لهم، يدعونكم فتأكلون من ذبيحتهم."], [16, "وتزوجون بنيكم من بناتهم، فيجعلن بنيكم يغوون أيضا بعبادة آلهتهن."]]}, {"l": "Jos 23:12-16", "n": "", "vs": [[12, "ولكن إذا ارتددتم والتصقتم ببقية هذه الأمم الماكثين معكم، وصاهرتموهم واختلطتم بهم وهم بكم،"], [13, "فاعلموا يقينا أن الرب إلهكم لا يعود يطرد تلك الأمم من أمامكم، فيصبحوا لكم شركا وفخا وسوطا ينهال على ظهوركم، وشوكا في أعينكم حتى تنقرضوا من الأرض الصالحة التي وهبها لكم الرب إلهكم."], [14, "وها أنا اليوم ماض في الطريق التي يمضي إليها أحياء الأرض كلهم، ولكنكم تعلمون حق العلم من كل قلوبكم ومن كل نفوسكم أن جميع وعود الرب الصالحة التي وعدكم بها قد تحققت. الكل صار لكم. لم تسقط منه كلمة واحدة."], [15, "وكما وفى الرب بوعوده الصالحة التي وعدكم بها، فإنه كذلك يجلب عليكم كل وعيد أنذركم به، حتى يفنيكم عن هذه الأرض الخيرة التي وهبها لكم."], [16, "حين تتعدون على عهد الرب إلهكم الذي أمركم به فتعبدون آلهة أخرى وتسجدون لها، عندئذ يحتدم غضب الرب عليكم فتنقرضون سريعا من الأرض الخيرة التي وهبها لكم»."]]}, {"l": "Ezr 9:11-14", "n": "", "vs": [[11, "التي أمرتنا بها على لسان عبيدك الأنبياء قائلا: إن الأرض التي تدخلون لترثوها هي أرض نجستها شعوبها برجاساتهم، من أقصاها إلى أقصاها."], [12, "والآن لا تزوجوا بناتكم من بنيهم، ولا تزوجوا أبناءكم من بناتهم، ولا تسعوا في سبيل أمنهم وخيرهم، لكي تترسخ قوتكم وتأكلوا خير الأرض وتورثوها لأبنائكم إلى الأبد."], [13, "والآن بعد كل ما جرى علينا من جراء أعمالنا السيئة وآثامنا العظيمة، نعلم أنك عاقبتنا ياإلهنا بأقل من آثامنا، ووهبتنا نجاة مثل هذه."], [14, "أنعود بعد ذلك ونتعدى على وصاياك ونصاهر الأمم الذين يرتكبون هذه الرجاسات؟ ألا تسخط علينا آنئذ حتى تفنينا فلا تبقى منا بقية ولا نجاة؟"]]}, {"l": "Ezr 10:2", "n": "", "vs": [[2, "وقال شكنيا بن يحيئيل من بني عيلام لعزرا: «لقد خنا إلهنا وتزوجنا من نساء غريبات من أمم الأرض، ولكن على الرغم من هذا فلا يزال هناك رجاء لإسرائيل."]]}, {"l": "Ezr 10:3", "n": "", "vs": [[3, "لذلك، لنبرم عهدا مع إلهنا، بأن نخرج كل النساء الغريبات، ومن أنجبن من أبناء بموجب رأي سيدي ومشورة سائر الذين يطيعون وصايا الله مطبقين بذلك نص الشريعة."]]}, {"l": "Neh 13:29", "n": "", "vs": [[29, "فاذكرهم ياإلهي لأنهم دنسوا الكهنوت وعهد الكهنوت واللاويين،"]]}], "kwAr": "وندنس عهد آبائنا", "noteAr": ""}], "arS": [["أليس لنا ", []], ["جميعا", ["H3605"]], [" ", []], ["أب", ["H1"]], [" ", []], ["واحد", ["H259"]], ["؟ ألم ", []], ["يخلقنا", ["H1254"]], [" ", []], ["إله", ["H410"]], [" ", []], ["واحد", ["H259"]], ["، فما بالنا ", []], ["يغدر", ["H898"]], [" ", []], ["أحدنا", ["H376"]], [" ", []], ["بالآخر", ["H251"]], [" ", []], ["وندنس", ["H2490"]], [" ", []], ["عهد", ["H1285"]], [" ", []], ["آبائنا", ["H1"]], ["؟", []]]}, {"c": 2, "v": 11, "text": "لقد غدر يهوذا وارتكب الرجاسة في إسرائيل وفي أورشليم لأن يهوذا قد دنس هيكل الرب المحبوب، وتزوج من بنات يعبدن آلهة غريبة.", "groups": [{"kw": "and an", "raw": "Lev_18:24-30; Jer_7:10; Eze_18:13, Eze_22:11; Rev_21:8", "note": "", "refs": [{"l": "Lev 18:24-30", "n": "", "vs": [[24, "لا تتنجسوا بكل هذه الأعمال المشينة لأن بها تنجست الشعوب التي سأطردها من أمامكم،"], [25, "فقد تنجست بها الأرض، لهذا سأعاقب الأرض بذنبها فتتقيأ سكانها."], [26, "أما أنتم فاحفظوا فرائضي وأحكامي، ولا تقترفوا شيئا من هذه الرجاسات، المواطن والغريب المقيم في وسطكم على حد سواء."], [27, "لأن جميع هذه الرجاسات قد ارتكبها أهل البلاد الذين قبلكم، فتنجست الأرض."], [28, "فلا تنجسوا الأرض بارتكابكم إياها، لئلا تتقيأكم كما تقيأت الأمم التي قبلكم."], [29, "بل كل من اقترف شيئا من هذه الرجاسات جميعها تستأصل تلك النفس الجانية من بين شعبها."], [30, "فاحفظوا شعائري لكي لا ترتكبوا شيئا من الممارسات الرجسة التي اقترفت قبلكم، ولا تتنجسوا بها. أنا الرب إلهكم»."]]}, {"l": "Jer 7:10", "n": "", "vs": [[10, "ثم تمثلون في حضرتي في هذا الهيكل الذي دعي باسمي قائلين: «قد نجونا»؛ ثم ترتكبون جميع هذه الرجاسات؟"]]}, {"l": "Eze 18:13", "n": "", "vs": [[13, "وأقرض بالربا وأخذ ربحا حراما، أفيحيا؟ إنه لا يحيا! لأنه اقترف جميع هذه الموبقات فإنه حتما يموت، ويكون دمه على رأسه."]]}, {"l": "Eze 22:11", "n": "", "vs": [[11, "فيك إنسان زنى مع امرأة قريبه، واقترف إنسان الرذيلة مع كنته، وفيك ضاجع إنسان أخته ابنة أبيه."]]}, {"l": "Rev 21:8", "n": "", "vs": [[8, "أما الجبناء وغير المؤمنين، والفاسدون والقاتلون والزناة، والمتصلون بالشياطين وعبدة الأصنام وجميع الدجالين، فمصيرهم إلى البحيرة المتقدة بالنار والكبريت، الذي هو الموت الثاني»."]]}], "kwAr": "وارتكب الرجاسة", "noteAr": ""}, {"kw": "profaned", "raw": "Exo_19:5, Exo_19:6; Lev_20:26; Deu_7:3-6, Deu_14:2, Deu_33:26-29; Psa_106:28, Psa_106:34-39; Jer_2:3, Jer_2:7, Jer_2:8, Jer_2:21, Jer_2:22", "note": "", "refs": [{"l": "Exo 19:5", "n": "", "vs": [[5, "لذلك إن أطعتم عهدي، تكونوا لي ملكا خاصا من بين جميع الشعوب، لأن لي كل الأرض."]]}, {"l": "Exo 19:6", "n": "", "vs": [[6, "وتكونون لي مملكة كهنة وأمة مقدسة. هذا هو الكلام الذي تخاطب به بني إسرائيل»."]]}, {"l": "Lev 20:26", "n": "", "vs": [[26, "وكونوا قديسين لأني أنا قدوس، وقد أفرزتكم من بين الشعوب لتكونوا خاصتي."]]}, {"l": "Deu 7:3-6", "n": "", "vs": [[3, "ولا تصاهروهم. فلا تزوجوا بناتكم من أبنائهم، ولا أبناءكم من بناتهم،"], [4, "إذ يغوون أبناءكم عن عبادتي ليعبدوا آلهة أخرى، فيحتدم غضب الرب عليكم ويهلككم سريعا."], [5, "ولكن هذا ما تفعلونه بهم: اهدموا مذابحهم وحطموا أصنامهم وقطعوا سواريهم وأحرقوا تماثيلهم."], [6, "لأنكم شعب مقدس للرب إلهكم. فإياكم قد اختار الرب إلهكم من بين جميع شعوب الأرض لتكونوا شعبه الخاص."]]}, {"l": "Deu 14:2", "n": "", "vs": [[2, "لأنكم شعب مقدس للرب إلهكم، وقد اختاركم من بين شعوب الأرض كافة لتكونوا له شعبا خاصا."]]}, {"l": "Deu 33:26-29", "n": "", "vs": [[26, "ليس نظير الرب يابني إسرائيل يمتطي السماء لمعونتكم والغمام في عظمته،"], [27, "فالإله الأبدي هو ملجأكم، وتحتكم تنبسط الأذرع الأبدية، يطرد أمامكم أعداءكم قائلا: أهلكوهم."], [28, "ليسكن بنو إسرائيل آمنين وحدهم، ولتجر ينابيع ماء يعقوب إلى أرض حنطة وخمر، وتقطر سماؤه بالندى."], [29, "طوباكم يابني إسرائيل، أي شعب مثلكم منتصر بالرب؟ إنه ترسكم وعونكم وسيفكم المجيد. لكم يخضع أعداؤكم، وأنتم تطأون مرتفعاتهم»."]]}, {"l": "Psa 106:28", "n": "", "vs": [[28, "وتعلقوا ببعل فغور وأكلوا ذبائح الموتى."]]}, {"l": "Psa 106:34-39", "n": "", "vs": [[34, "لم يستأصلوا الشعوب مثلما أمرهم الرب."], [35, "بل خالطوا الأمم الوثنية وتعلموا أعمالهم."], [36, "تعبدوا لأوثانهم فصارت لهم فخا."], [37, "ضحوا بأبنائهم وبناتهم للشياطين."], [38, "سفكوا دما بريئا، دم بنيهم وبناتهم الذين ذبحوهم لأصنام الكنعانيين، فتدنست الأرض بالدماء."], [39, "لذلك تنجسوا بأعمالهم، وخانوا الرب بأفعالهم"]]}, {"l": "Jer 2:3", "n": "", "vs": [[3, "كان إسرائيل مقدسا للرب وباكورة غلته، وكل من يعتدي عليه، يرتكب إثما ويحل به شر."]]}, {"l": "Jer 2:7", "n": "", "vs": [[7, "وأتيت بكم إلى أرض خيرات لتستمتعوا بأكل ثمارها وطيباتها. ولكنكم عندما دخلتموها نجستم أرضي وجعلتم ميراثي رجسا."]]}, {"l": "Jer 2:8", "n": "", "vs": [[8, "إن الكهنة لم يسألوا: أين الرب؟ وأهل الشريعة لم يعرفوني، وحكام الشعب تمردوا علي، والأنبياء تنبأوا بتأثير بعل وضلوا وراء ما لا جدوى منه."]]}, {"l": "Jer 2:21", "n": "", "vs": [[21, "وأنا غرستك ككرمة مختارة، ومن بذور سليمة كاملة، فكيف تحولت إلى كرمة فاسدة غريبة؟"]]}, {"l": "Jer 2:22", "n": "", "vs": [[22, "وإن اغتسلت بالنطرون، وأكثرت من استعمال الإشنان (الصابون)، فإن لطخة إثمك تظل ماثلة أمامي."]]}], "kwAr": "دنس هيكل الرب", "noteAr": ""}, {"kw": "loved", "raw": "or, ought to love", "note": "or, ought to love", "refs": [], "kwAr": "المحبوب", "noteAr": "أو: «كان ينبغي أن يحب»."}, {"kw": "and hath", "raw": "Gen_6:1, Gen_6:2; Jdg_3:6; 1Ki_11:1-8; Ezr_9:1, Ezr_9:2, Ezr_9:12, Ezr_10:2; Neh_13:23-29; Hos_6:7; 2Co_6:14-18", "note": "", "refs": [{"l": "Gen 6:1", "n": "", "vs": [[1, "وحدث لما ابتدأ الناس يتكاثرون على سطح الأرض وولد لهم بنات،"]]}, {"l": "Gen 6:2", "n": "", "vs": [[2, "انجذبت أنظار أبناء الله إلى بنات الناس فرأوا أنهن جميلات فاتخذوا لأنفسهم منهن زوجات حسب ما طاب لهم."]]}, {"l": "Jdg 3:6", "n": "", "vs": [[6, "وتزوجوا من بناتهم، وزوجوا بناتهم لأبنائهم وعبدوا آلهتهم."]]}, {"l": "1Ki 11:1-8", "n": "", "vs": [[1, "وأولع سليمان بنساء غريبات كثيرات، فضلا عن ابنة فرعون، فتزوج نساء موآبيات وعمونيات وأدوميات وصيدونيات وحثيات،"], [2, "وكلهن من بنات الأمم التي نهى الرب بني إسرائيل عن الزواج منهم قائلا لهم: «لا تتزوجوا منهم ولا هم منكم، لأنهم يغوون قلوبكم وراء آلهتهم». ولكن سليمان التصق بهن لفرط محبته لهن."], [3, "فكانت له سبع مئة زوجة، وثلاث مئة محظية، فانحرفن بقلبه عن الرب."], [4, "فاستطعن في زمن شيخوخته أن يغوين قلبه وراء آلهة أخرى، فلم يكن قلبه مستقيما مع الرب إلهه كقلب داود أبيه."], [5, "وما لبث أن عبد عشتاروث آلهة الصيدونيين، وملكوم إله العمونيين البغيض،"], [6, "وارتكب الشر في عيني الرب، ولم يتبع سبيل الرب بكمال كما فعل أبوه داود."], [7, "وأقام على تل شرقي أورشليم مرتفعا لكموش إله الموآبيين الفاسق، ولمولك إله بني عمون البغيض."], [8, "وشيد مرتفعات لجميع نسائه الغريبات، اللواتي رحن يوقدن البخور عليها ويقربن المحرقات لآلهتهن."]]}, {"l": "Ezr 9:1", "n": "", "vs": [[1, "وبعد أن كملت هذه الأمور جاءني رؤساء اليهود قائلين: «إن شعب إسرائيل والكهنة واللاويين ما برحوا منغمسين في رجاسات أمم الأرض كالكنعانيين والحثيين والفرزيين واليبوسيين والعمونيين والموآبيين والمصريين والأموريين، ولم ينفصلوا عنهم،"]]}, {"l": "Ezr 9:2", "n": "", "vs": [[2, "لأنهم تزوجوا هم وأبناؤهم من بناتهم، فاختلط النسل المقدس بأمم الأراضي، وقد كان الرؤساء والولاة أول من ارتكب هذه الخيانة»."]]}, {"l": "Ezr 9:12", "n": "", "vs": [[12, "والآن لا تزوجوا بناتكم من بنيهم، ولا تزوجوا أبناءكم من بناتهم، ولا تسعوا في سبيل أمنهم وخيرهم، لكي تترسخ قوتكم وتأكلوا خير الأرض وتورثوها لأبنائكم إلى الأبد."]]}, {"l": "Ezr 10:2", "n": "", "vs": [[2, "وقال شكنيا بن يحيئيل من بني عيلام لعزرا: «لقد خنا إلهنا وتزوجنا من نساء غريبات من أمم الأرض، ولكن على الرغم من هذا فلا يزال هناك رجاء لإسرائيل."]]}, {"l": "Neh 13:23-29", "n": "", "vs": [[23, "وفي ذلك الزمن شاهدت يهودا ممن تزوجوا من نساء أشدوديات وعمونيات وموآبيات،"], [24, "ولاحظت أن نصف كلام أولادهم بلغة أشدود، أو لغة بعض الشعوب الأخرى، ويجهلون اللغة اليهودية،"], [25, "فأنبتهم ولعنتهم وضربت منهم قوما ونتفت شعورهم، واستحلفتهم باسم الله قائلا: «إياكم أن تزوجوا بناتكم من بنيهم، ولا تأخذوا بناتهم لأبنائكم ولا لكم."], [26, "أليس بمثل هذا أخطأ سليمان ملك إسرائيل، مع أنه لم يكن له نظير بين ملوك شعوب كثيرة؟ لقد كان محبوبا عند إلهه، وجعله الله ملكا على إسرائيل، ومع ذلك أغوته النساء الأجنبيات على ارتكاب الإثم"], [27, "فهل نتغاضى عما اقترفتموه من شر عظيم في حق إلهنا باتخاذكم زوجات غريبات؟"], [28, "وكان أحد أبناء يوياداع بن ألياشيب رئيس الكهنة صهرا لسنبلط الحوروني، فطردته عني."], [29, "فاذكرهم ياإلهي لأنهم دنسوا الكهنوت وعهد الكهنوت واللاويين،"]]}, {"l": "Hos 6:7", "n": "", "vs": [[7, "ولكنكم مثل آدم، نقضتم عهدي وغدرتم بي."]]}, {"l": "2Co 6:14-18", "n": "", "vs": [[14, "لا تدخلوا مع غير المؤمنين تحت نير واحد. فأي ارتباط بين البر والإثم؟ وأية شركة بين النور والظلام؟"], [15, "وأي تحالف للمسيح مع إبليس؟ وأي نصيب للمؤمن مع غير المؤمن؟"], [16, "وأي وفاق لهيكل الله مع الأصنام؟ فإننا نحن هيكل الله الحي، وفقا لما قاله الله : «سأسكن في وسطهم، وأسير بينهم، وأكون إلههم وهم يكونون شعبا لي…"], [17, "لذلك اخرجوا من وسطهم، وكونوا منفصلين، يقول الرب، ولا تلمسوا ما هو نجس،"], [18, "فأقبلكم، وأكون لكم أبا، وتكونوا لي بنين وبنات»، هذا يقوله الرب القادر على كل شيء."]]}], "kwAr": "وتزوج من بنات", "noteAr": ""}], "arS": [["لقد ", []], ["غدر", ["H898"]], [" ", []], ["يهوذا", ["H3063"]], [" ", []], ["وارتكب", ["H6213"]], [" ", []], ["الرجاسة", ["H8441"]], [" في ", []], ["إسرائيل", ["H3478"]], [" وفي ", []], ["أورشليم", ["H3389"]], [" لأن ", []], ["يهوذا", ["H3063"]], [" قد ", []], ["دنس", ["H2490"]], [" ", []], ["هيكل", ["H6944"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["المحبوب", ["H157"]], ["، ", []], ["وتزوج", ["H1166"]], [" من ", []], ["بنات", ["H1323"]], [" يعبدن ", []], ["آلهة", ["H410"]], [" ", []], ["غريبة", ["H5236"]], [".", []]]}, {"c": 2, "v": 12, "text": "ليستأصل الرب من شعب إسرائيل كل من فعل هذا، من غير تمييز، وحتى ممن يقدمون قرابين للرب القدير.", "groups": [{"kw": "cut", "raw": "Lev_18:29, Lev_20:3; Num_15:30,Num_15:31; Jos_23:12, Jos_23:13; 1Sa_2:31-34", "note": "", "refs": [{"l": "Lev 18:29", "n": "", "vs": [[29, "بل كل من اقترف شيئا من هذه الرجاسات جميعها تستأصل تلك النفس الجانية من بين شعبها."]]}, {"l": "Lev 20:3", "n": "", "vs": [[3, "وأنا أنقلب على ذلك الإنسان وأستأصله من بين شعبه، لأنه قرب أحد أبنائه للوثن مولك لينجس قدسي ويدنس اسمي المقدس."]]}, {"l": "Num 15:30", "n": "", "vs": [[30, "أما إن تعمد أحد الخطأ، سواء كان من الإسرائيليين أم من الغرباء، فهو يزدري بي ويجب أن يستأصل من بين شعبه،"]]}, {"l": "Num 15:31", "n": "", "vs": [[31, "لأنه احتقر كلامي ونقض وصيتي، لهذا يستأصل متحملا عقاب ذنبه»."]]}, {"l": "Jos 23:12", "n": "", "vs": [[12, "ولكن إذا ارتددتم والتصقتم ببقية هذه الأمم الماكثين معكم، وصاهرتموهم واختلطتم بهم وهم بكم،"]]}, {"l": "Jos 23:13", "n": "", "vs": [[13, "فاعلموا يقينا أن الرب إلهكم لا يعود يطرد تلك الأمم من أمامكم، فيصبحوا لكم شركا وفخا وسوطا ينهال على ظهوركم، وشوكا في أعينكم حتى تنقرضوا من الأرض الصالحة التي وهبها لكم الرب إلهكم."]]}, {"l": "1Sa 2:31-34", "n": "", "vs": [[31, "ها هي أيام مقبلة يخطف فيها الموت رجالكم فلا يبقى شيخ في بيتك."], [32, "وتشهد ضيقا في مسكني، بينما ينعم الإسرائيليون بالرفاهية ويخلو بيتك من الشيوخ كل الأيام."], [33, "ويكون من أستحييه من ذريتك لخدمة مذبحي سببا في إعشاء عينيك بالدموع وإذابة قلبك بالحزن، وبقية ذريتك يموتون شبانا."], [34, "وتصديقا لقولي أعطيك علامة تصيب ابنيك حفني وفينحاس: إنهما في يوم واحد يموتان كلاهما."]]}], "kwAr": "ليستأصل الرب", "noteAr": ""}, {"kw": "the master and the scholar", "raw": "or, him that waketh, and him that answereth, 1Ch_25:8; Ezr_10:18, Ezr_10:19; Neh_13:28, Neh_13:29; Isa_9:14-16, Isa_24:1, Isa_24:2; Eze_14:10; Hos_4:4, Hos_4:5; Mat_15:14; 2Ti_3:13; Rev_19:20", "note": "or, him that waketh, and him that answereth, 1Ch_25:8; Ezr_10:18, Ezr_10:19; Neh_13:28, Neh_13:29; Isa_9:14-16, Isa_24:1, Isa_24:2; Eze_14:10; Hos_4:4, Hos_4:5; Mat_15:14; 2Ti_3:13; Rev_19:20", "refs": [{"l": "1Ch 25:8", "n": "", "vs": [[8, "وقد حددوا مسئوليات عملهم عن طريق القرعة، بغض النظر عن العمر أو الكفاءة."]]}, {"l": "Ezr 10:18", "n": "", "vs": [[18, "فوجد بين الكهنة ممن تزوجوا من نساء غريبات: من بني يشوع بن يوصاداق وإخوته: معشيا وأليعزر وياريب وجدليا."]]}, {"l": "Ezr 10:19", "n": "", "vs": [[19, "هؤلاء تعهدوا بإخراج نسائهم الغريبات مقربين كبش غنم تكفيرا عن إثمهم."]]}, {"l": "Neh 13:28", "n": "", "vs": [[28, "وكان أحد أبناء يوياداع بن ألياشيب رئيس الكهنة صهرا لسنبلط الحوروني، فطردته عني."]]}, {"l": "Neh 13:29", "n": "", "vs": [[29, "فاذكرهم ياإلهي لأنهم دنسوا الكهنوت وعهد الكهنوت واللاويين،"]]}, {"l": "Isa 9:14-16", "n": "", "vs": [[14, "لذلك سيقطع الرب من إسرائيل في يوم واحد الرأس والذنب، النخل والأسل."], [15, "إن الشيخ والوجيه هو الرأس، والنبي الذي يلقن الكذب هو الذنب"], [16, "فمرشدو هذا الشعب يضلونه، والمرشدون يبتلعون."]]}, {"l": "Isa 24:1", "n": "", "vs": [[1, "ها إن الرب يخرب أرض يهوذا ويقفرها ويقلب وجهها ويشتت سكانها."]]}, {"l": "Isa 24:2", "n": "", "vs": [[2, "وما يقع على الشعب يقع على الكاهن أيضا، والسيد كالعبد والسيدة كأمتها والبائع كالمشتري، والمقترض كالمقرض، والدائن كالمديون."]]}, {"l": "Eze 14:10", "n": "", "vs": [[10, "وينالون عقاب إثمهم، ويكون ذنب النبي مماثلا لذنب السائل."]]}, {"l": "Hos 4:4", "n": "", "vs": [[4, "ولكن لا يخاصم أحد أحدا، ولا يتهمه لأن دعواي هي ضدكم أيها الكهنة."]]}, {"l": "Hos 4:5", "n": "", "vs": [[5, "إنك تتعثر في النهار، ويكبو النبي معك في الليل، وأنا أدمر أمكم إسرائيل."]]}, {"l": "Mat 15:14", "n": "", "vs": [[14, "دعوهم وشأنهم، فهم عميان يقودون عميانا. وإذا كان الأعمى يقود أعمى، يسقطان معا في حفرة»."]]}, {"l": "2Ti 3:13", "n": "", "vs": [[13, "أما الناس الأشرار والدجالون المحتالون، فيتقدمون في الشر، مضللين الآخرين وهم أنفسهم مضللون!"]]}, {"l": "Rev 19:20", "n": "", "vs": [[20, "فقبض على الوحش وعلى النبي الدجال الذي قام بالمعجزات في حضور الوحش وأضل بها الذين قبلوا علامة الوحش، وسجدوا لتمثاله. وطرح كلاهما حيا في بحيرة النار والكبريت المتقدة،"]]}], "kwAr": "من غير تمييز", "noteAr": "أو: «الساهر والمجيب». انظر 1أخ 25: 8؛ عز 10: 18، 19؛ نح 13: 28، 29؛ إش 9: 14-16؛ 24: 1، 2؛ حز 14: 10؛ هو 4: 4، 5؛ مت 15: 14؛ 2تي 3: 13؛ رؤ 19: 20"}, {"kw": "out", "raw": "Num_24:5; Zec_12:7", "note": "", "refs": [{"l": "Num 24:5", "n": "", "vs": [[5, "ما أجمل خيامك يايعقوب، وما أبهى مساكنك ياإسرائيل!"]]}, {"l": "Zec 12:7", "n": "", "vs": [[7, "ويخلص الرب أولا خيام يهوذا لئلا يتعاظم افتخار بيت داود وأهل أورشليم على سائر يهوذا."]]}], "kwAr": "من شعب إسرائيل", "noteAr": ""}, {"kw": "and him", "raw": "Mal_2:10; Gen_4:3-5; 1Sa_3:14, 1Sa_15:22, 1Sa_15:23; Isa_61:8, Isa_66:3; Amo_5:22", "note": "", "refs": [{"l": "Mal 2:10", "n": "", "vs": [[10, "أليس لنا جميعا أب واحد؟ ألم يخلقنا إله واحد، فما بالنا يغدر أحدنا بالآخر وندنس عهد آبائنا؟"]]}, {"l": "Gen 4:3-5", "n": "", "vs": [[3, "وحدث بعد مرور أيام أن قدم قايين من ثمار الأرض قربانا للرب،"], [4, "وقدم هابيل أيضا من خيرة أبكار غنمه وأسمنها. فتقبل الرب قربان هابيل ورضي عنه."], [5, "لكنه لم يتقبل قربان قايين ولم يرض عنه. فاغتاظ قايين جدا وتجهم وجهه كمدا."]]}, {"l": "1Sa 3:14", "n": "", "vs": [[14, "لهذا أقسمت أن لا يكفر عن إثم بيت عالي بذبيحة أو تقدمة إلى الأبد»."]]}, {"l": "1Sa 15:22", "n": "", "vs": [[22, "فقال صموئيل: «هل يسر الرب بالذبائح والمحرقات كسروره بالاستماع إلى صوته؟ إن الاستماع أفضل من الذبيحة، والإصغاء أفضل من شحم الكباش."]]}, {"l": "1Sa 15:23", "n": "", "vs": [[23, "فالتمرد مماثل لخطيئة العرافة، والعناد شبيه بشر عبادة الوثن والإثم. ولأنك رفضت كلام الرب فقد رفضك الرب من الملك»."]]}, {"l": "Isa 61:8", "n": "", "vs": [[8, "لأني أنا الرب أحب العدل وأمقت الاختلاس والظلم، وأكافئهم بأمانة، وأقطع معهم عهدا أبديا."]]}, {"l": "Isa 66:3", "n": "", "vs": [[3, "إن من ينحر ثورا كمن يقتل إنسانا، ومن يقرب حملا كمن يكسر عنق كلب، ومن يصعد تقدمة حنطة كمن يقدم دم خنزير، ومن يحرق بخورا كمن يبارك وثنا، لأن هؤلاء آثروا طرقهم، واستطابت نفوسهم أرجاسهم."]]}, {"l": "Amo 5:22", "n": "", "vs": [[22, "ومع أنكم تقربون لي ذبائح محرقاتكم وتقدماتكم من الدقيق، فإني لا أقبلها ولا ألتفت إلى ذبائح السلام من مسمنات مواشيكم."]]}], "kwAr": "وحتى ممن يقدمون قرابين", "noteAr": ""}], "arS": [["ليستأصل", ["H3772"]], [" ", []], ["الرب", ["H3068"]], [" من شعب ", []], ["إسرائيل", ["H3290"]], [" كل من ", []], ["فعل", ["H6213"]], [" هذا، من غير تمييز، وحتى ممن ", []], ["يقدمون", ["H5066"]], [" ", []], ["قرابين", ["H4503"]], [" ", []], ["للرب", ["H3068"]], [" ", []], ["القدير", ["H6635"]], [".", []]]}, {"c": 2, "v": 13, "text": "وهذا أيضا ما ارتكبتم: لقد أغرقتم مذبح الرب بالدموع، فأنتم تبكون وتنوحون لأنه لم يعد يعير تقدماتكم انتباها أو يقبلها منكم بمسرة.", "groups": [{"kw": "covering", "raw": "Deu_15:9; 1Sa_1:9, 1Sa_1:10; 2Sa_13:19, 2Sa_13:20; Psa_78:34-37; Ecc_4:1", "note": "", "refs": [{"l": "Deu 15:9", "n": "", "vs": [[9, "إياكم أن تحدثوا قلوبكم بخبث قائلين: ها قد قربت السنة السابعة، سنة الإبراء من الديون فيسوء الأمر في أعينكم وتمتنعون عن إقراضه. فإن فعلتم هذا فإنه يستغيث بالرب عليكم، فتصبحون مذنبين في حكم الرب."]]}, {"l": "1Sa 1:9", "n": "", "vs": [[9, "وذات مرة بعد أن فرغوا من تناول الطعام في شيلوه، وفيما كان عالي الكاهن جالسا على الكرسي عند قائمة خيمة الرب، قامت حنة"]]}, {"l": "1Sa 1:10", "n": "", "vs": [[10, "بنفس مرة وصلت إلى الرب وبكت بحرقة،"]]}, {"l": "2Sa 13:19", "n": "", "vs": [[19, "فمزقت الثوب الملون وعفرت رأسها بالرماد ووضعت عليه يدها ومضت باكية."]]}, {"l": "2Sa 13:20", "n": "", "vs": [[20, "وعندما رآها أخوها أبشالوم سألها: «هل اغتصبك أمنون؟ اسكتي الآن ياأختي، فإنه أخوك ولا تحملي وزر هذا الأمر في قلبك». فأقامت ثامار في بيت أخيها أبشالوم في عزلة وحزن."]]}, {"l": "Psa 78:34-37", "n": "", "vs": [[34, "وعندما قتل بعضهم، رجعوا بحرارة تائبين يلتمسون الله ."], [35, "تذكروا أن الله صخرتهم والإله العلي فاديهم."], [36, "ولكنهم خادعوه بأفواههم، ونافقوه بألسنتهم."], [37, "لم يكونوا مخلصين له، ولا كانوا أوفياء لعهده."]]}, {"l": "Ecc 4:1", "n": "", "vs": [[1, "ثم تأملت حولي فرأيت جميع المظالم التي ترتكب تحت الشمس. شهدت دموع المظلومين الذين لا معزي لهم، أما ظالموهم فيتمتعون بالقوة، غير أن المظلومين لا معزي لهم."]]}], "kwAr": "أغرقتم مذبح الرب بالدموع", "noteAr": ""}, {"kw": "insomuch", "raw": "Deu_26:14; Neh_8:9-12; Pro_15:8, Pro_21:27; Isa_1:11-15; Jer_6:20", "note": "", "refs": [{"l": "Deu 26:14", "n": "", "vs": [[14, "لم أتناول منه في أثناء حزني، ولم آخذ منه وأنا في حالة نجاسة، ولا أعطيت منه لأجل ميت. بل أطعت صوت إلهي وعملت بموجب كل ما أوصيتني به."]]}, {"l": "Neh 8:9-12", "n": "", "vs": [[9, "وإذ بكى الشعب لدى سماعهم نص الشريعة، خاطبهم نحميا الوالي وعزرا الكاتب واللاويون الذين علموا الشعب قائلين: «لا تنوحوا ولا تبكوا، فهذا اليوم مقدس للرب إلهكم»"], [10, "ثم استطرد نحميا: «اذهبوا واحتفلوا آكلين أطايب الطعام، وشاربين حلو الشراب، وابعثوا أنصبة لمن لم يعد لهم. ولا تحزنوا لأن هذا اليوم مقدس لسيدنا، ففرح الرب هو قوتكم»."], [11, "وأخذ اللاويون يهدئون كل الشعب قائلين: «كفوا، لأن اليوم مقدس فلا تحزنوا»."], [12, "فمضى الشعب كله ليأكل ويشرب ويبعث بأنصبة ويحتفل بفرح عظيم، لأنه فهم نص الشريعة التي علموه إياها."]]}, {"l": "Pro 15:8", "n": "", "vs": [[8, "قربان المنافقين مكرهة الرب، ومسرته صلاة المستقيمين."]]}, {"l": "Pro 21:27", "n": "", "vs": [[27, "ذبيحة الشرير رجس عند الرب، فكم بالحري إن قربها بنية أثيمة؟"]]}, {"l": "Isa 1:11-15", "n": "", "vs": [[11, "ماذا تجديني كثرة ذبائحكم، يقول الرب؟ اتخمت من محرقات كباش وشحم المسمنات، ولا أسر بدم عجول وخرفان وتيوس."], [12, "حين جئتم لتمثلوا أمامي، من طلب منكم أن تدوسوا دوري؟"], [13, "كفوا عن تقديم قرابين باطلة، فالبخور رجس لي، وكذلك رأس الشهر والسبت والدعاء إلى المحفل، فأنا لا أطيق الاعتكاف مع ارتكاب الإثم."], [14, "لشد ما تبغض نفسي احتفالات رؤوس شهوركم ومواسم أعيادكم! صارت علي عبئا، وسئمت حملها."], [15, "عندما تبسطون نحوي أيديكم أحجب وجهي عنكم، وإن أكثرتم الصلاة لا أستجيب، لأن أيديكم مملوءة دما."]]}, {"l": "Jer 6:20", "n": "", "vs": [[20, "لأي غرض يصعد إلي البخور من شبا، وقصب الذريرة من أرض نائية؟ محرقاتكم مرفوضة، وتقدماتكم لا تسرني»."]]}], "kwAr": "لأنه لم يعد يعير", "noteAr": ""}], "arS": [["وهذا أيضا ما ", []], ["ارتكبتم", ["H6213"]], [": لقد ", []], ["أغرقتم", ["H3680"]], [" ", []], ["مذبح", ["H4196"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["بالدموع", ["H1832"]], ["، فأنتم ", []], ["تبكون", ["H1065"]], [" ", []], ["وتنوحون", ["H603"]], [" لأنه لم يعد يعير ", []], ["تقدماتكم", ["H4503"]], [" انتباها أو ", []], ["يقبلها", ["H3947"]], [" منكم ", []], ["بمسرة", ["H7522"]], [".", []]]}, {"c": 2, "v": 14, "text": "وتتساءلون: لماذا؟ لأن الرب كان شاهدا على العهد المقطوع بينك وبين زوجة صباك التي غدرت بها، مع أنها شريكتك وامرأة عهدك.", "groups": [{"kw": "Wherefore", "raw": "Mal_1:6, Mal_1:7, Mal_3:8; Pro_30:20; Isa_58:3; Jer_8:12", "note": "", "refs": [{"l": "Mal 1:6", "n": "", "vs": [[6, "إن الابن يكرم أباه والعبد سيده. فإن كنت أنا حقا أبا فأين كرامتي؟ وإن كنت حقا سيدا فأين مهابتي؟ إن الرب القدير يقول لكم: أيها الكهنة المزدرون باسمي؛ فتسألون: كيف ازدرينا باسمك؟"]]}, {"l": "Mal 1:7", "n": "", "vs": [[7, "فيجيب: لأنكم تقربون على مذبحي خبزا نجسا. ثم تتساءلون: بم نجسناك؟ فيرد: بظنكم أن مائدة الرب مزدراة."]]}, {"l": "Mal 3:8", "n": "", "vs": [[8, "أيسلب الإنسان الله ؟ لقد سلبتموني! وتسألون: بماذا سلبناك؟ في العشور والقرابين."]]}, {"l": "Pro 30:20", "n": "", "vs": [[20, "هذا هو أسلوب المرأة العاهر ة: إنها تأثم وتستخف وتقول: لم أرتكب شرا!"]]}, {"l": "Isa 58:3", "n": "", "vs": [[3, "ويسألون: ما بالنا صمنا وأنت لم تلاحظ، وتذللنا ولم تحفل بذلك؟. إنكم في يوم صومكم تلتمسون مسرة أنفسكم وتسخرون جميع عمالكم."]]}, {"l": "Jer 8:12", "n": "", "vs": [[12, "هل خجلوا عندما اقترفوا الرجس؟ كلا! لم يخزوا قط ولم يعرفوا الخجل. لذلك سيسقطون بين الساقطين، وحين أعاقبهم يطوح بهم»، يقول الرب."]]}], "kwAr": "لماذا", "noteAr": ""}, {"kw": "the Lord", "raw": "Mal_3:5; Gen_31:50; Jdg_11:10; 1Sa_12:5; Jer_42:5; Mic_1:2", "note": "", "refs": [{"l": "Mal 3:5", "n": "", "vs": [[5, "وأقترب منكم لأكون شاهدا سريعا ضد السحرة والزناة والحالفين بالزور والمستغلين لأجرة العامل ومضطهدي الأرامل والأيتام، والذين يظلمون الغرباء ولا يخافونني"]]}, {"l": "Gen 31:50", "n": "", "vs": [[50, "إن أسأت معاملة ابنتي، أو تزوجت عليهما، فإن الله يراك ويكون حاكما بيني وبينك حتى لو لم أعرف أنا»."]]}, {"l": "Jdg 11:10", "n": "", "vs": [[10, "فأجابوه: «الرب شاهد بيننا إن كنا لا نفعل حسب قولك»."]]}, {"l": "1Sa 12:5", "n": "", "vs": [[5, "فقال لهم: «ليكن الرب وملكه المختار شاهدين في هذا اليوم على براءتي الكاملة». فقالوا: «يشهد الرب»."]]}, {"l": "Jer 42:5", "n": "", "vs": [[5, "ثم قالوا لإرميا: «ليكن الرب بيننا شاهدا أمينا صادقا، أننا ننفذ كل كلمة يوحي بها الرب إلينا على لسانك،"]]}, {"l": "Mic 1:2", "n": "", "vs": [[2, "اسمعوا ياجميع الشعوب، وأصغي أيتها الأرض وكل من فيها، وليكن السيد الرب من هيكله المقدس شاهدا عليكم."]]}], "kwAr": "كان شاهدا", "noteAr": ""}, {"kw": "the wife", "raw": "Mal_2:15; Pro_5:18, Pro_5:19; Ecc_9:9; Isa_54:6", "note": "", "refs": [{"l": "Mal 2:15", "n": "", "vs": [[15, "ولكن لم يقدم على ذلك أي واحد مازالت فيه بقية من الروح. وماذا طلب هذا الواحد (أي إبراهيم)؟ ذرية الله. لهذا حافظوا على أرواحكم، ولا يغدر أحد بزوجة صباه."]]}, {"l": "Pro 5:18", "n": "", "vs": [[18, "ليكن ينبوع عفتك مباركا، واغتبط بامرأة شبابك،"]]}, {"l": "Pro 5:19", "n": "", "vs": [[19, "فتكون كالظبية المحبوبة والوعلة البهية، فترتوي من فيض فتنتها، وتظل دائما أسير حبها."]]}, {"l": "Ecc 9:9", "n": "", "vs": [[9, "تمتع طوال أيام حياتك الباطلة التي أعطاك إياها الرب تحت الشمس مع المرأة التي أحببتها، لأن ذلك هو حظك من الحياة ومن عناء تعبك الذي تكابده تحت الشمس."]]}, {"l": "Isa 54:6", "n": "", "vs": [[6, "قد دعاك الرب كزوجة مهجورة مكروبة الروح، كزوجة عهد الصبا المنبوذة، يقول الرب."]]}], "kwAr": "زوجة صباك", "noteAr": ""}, {"kw": "thy companion", "raw": "Gen_2:18; Pro_2:17; Son_1:15 *marg. Eze_16:8", "note": "", "refs": [{"l": "Gen 2:18", "n": "", "vs": [[18, "ثم قال الرب الإله: «ليس مستح ]}, {"l": "Mar 10:6-8", "n": "", "vs": [[6, "ولكن منذ بدء الخليقة جعل الله الإنسان ذكرا وأنثى."], [7, "لذلك يترك الرجل أباه وأمه ويتحد بزوجته،"], [8, "فيصير الاثنان جسدا واحدا. فلا يكونان بعد اثنين بل جسدا واحدا."]]}, {"l": "1Co 7:2", "n": "", "vs": [[2, "ولكن، تجنبا للزنا، ليكن لكل رجل زوجته، ولكل امرأة زوجها."]]}], "kwAr": "لم يقدم", "noteAr": ""}, {"kw": "residue", "raw": "or, excellency", "note": "or, excellency", "refs": [], "kwAr": "بقية من الروح", "noteAr": "أو: «فضل»."}, {"kw": "the spirit", "raw": "Gen_2:7; Job_27:3; Ecc_12:7; Joh_20:22", "note": "", "refs": [{"l": "Gen 2:7", "n": "", "vs": [[7, "ثم جبل الرب الإله آدم من تراب الأرض ونفخ في أنفه نسمة حياة، فصار آدم نفسا حية."]]}, {"l": "Job 27:3", "n": "", "vs": [[3, "ولكن مادامت نسمتي في، ونفخة الله في أنفي،"]]}, {"l": "Ecc 12:7", "n": "", "vs": [[7, "فيعود التراب إلى الأرض كما كان، وترجع الروح إلى الله واهبها."]]}, {"l": "Joh 20:22", "n": "", "vs": [[22, "قال هذا ونفخ فيهم وقال لهم: «اقبلوا الروح القدس."]]}], "kwAr": "الروح", "noteAr": ""}, {"kw": "That he", "raw": "Gen_24:3-7, Gen_24:44, Gen_26:34, Gen_26:35, Gen_27:46, Gen_28:2-4; Deu_7:4; Ezr_9:4; Neh_13:24; Jer_2:21; 1Co_7:14; Eph_6:4; 1Ti_3:4, 1Ti_3:5, 1Ti_3:11, 1Ti_3:12; Tit_1:6", "note": "", "refs": [{"l": "Gen 24:3-7", "n": "", "vs": [[3, "فأستحلفك بالرب إله السماء والأرض أن لا تأخذ لابني زوجة من بنات الكنعانيين الذين أنا مقيم في وسطهم."], [4, "بل تمضي إلى بلدي وإلى عشيرتي، وتأخذ زوجة لابني إسحق»."], [5, "فقال له العبد: «هب أن المرأة لا تشاء أن تتبعني إلى هذه الأرض، فهل أرجع بابنك إلى الأرض التي ارتحلت عنها؟»."], [6, "فأجاب إبراهيم: «إياك أن ترجع بابني إلى هناك،"], [7, "فالرب إله السماء الذي أخذني من بيت أبي ومن أرض قومي، وخاطبني وأقسم لي قائلا: لذريتك أهب هذه الأرض، هو يرسل ملاكه أمامك لتأخذ زوجة لابني من هناك."]]}, {"l": "Gen 24:44", "n": "", "vs": [[44, "فتقول لي: اشرب أنت، وأنا أستقي لجمالك أيضا، تكون هي الفتاة التي عينها الرب لابن سيدي."]]}, {"l": "Gen 26:34", "n": "", "vs": [[34, "ولما بلغ عيسو الأربعين من عمره تزوج كلا من يهوديت بنت بيري الح أبا لأولاد مؤمنين لا يتهمون بالخلاعة والتمرد."]]}], "kwAr": "وماذا طلب هذا الواحد", "noteAr": ""}, {"kw": "godly seed", "raw": "Heb. seed of God, Gen_6:2; Hos_1:10; Act_3:25; 2Co_6:18", "note": "Heb. seed of God, Gen_6:2; Hos_1:10; Act_3:25; 2Co_6:18", "refs": [{"l": "Gen 6:2", "n": "", "vs": [[2, "انجذبت أنظار أبناء الله إلى بنات الناس فرأوا أنهن جميلات فاتخذوا لأنفسهم منهن زوجات حسب ما طاب لهم."]]}, {"l": "Hos 1:10", "n": "", "vs": [[10, "ومع ذلك فإن عدد بني إسرائيل يكون كرمل البحر الذي لا يكال ولا يحصى. وفي الموضع الذي قيل لهم فيه: أنتم لستم شعبي، يقال لهم: أنتم أبناء الله الحي."]]}, {"l": "Act 3:25", "n": "", "vs": [[25, "وأنتم أحفاد هؤلاء الأنبياء، وأبناء العهد الذي أبرمه الله لآبائنا عندما قال لإبراهيم: بنسلك تنال البركة شعوب الأرض كلها."]]}, {"l": "2Co 6:18", "n": "", "vs": [[18, "فأقبلكم، وأكون لكم أبا، وتكونوا لي بنين وبنات»، هذا يقوله الرب القادر على كل شيء."]]}], "kwAr": "ذرية الله", "noteAr": "بالعبرية: «نسل الله». انظر تك 6: 2؛ هو 1: 10؛ أع 3: 25؛ 2كو 6: 18"}, {"kw": "take", "raw": "Mal_2:14; Pro_4:23, Pro_6:25, Pro_7:25; Mat_5:28, Mat_5:29, Mat_15:19; Jam_1:14, Jam_1:15", "note": "", "refs": [{"l": "Mal 2:14", "n": "", "vs": [[14, "وتتساءلون: لماذا؟ لأن الرب كان شاهدا على العهد المقطوع بينك وبين زوجة صباك التي غدرت بها، مع أنها شريكتك وامرأة عهدك."]]}, {"l": "Pro 4:23", "n": "", "vs": [[23, "فوق كل حرص احفظ قلبك لأن منه تنبثق الحياة."]]}, {"l": "Pro 6:25", "n": "", "vs": [[25, "لا تشته جمالها في قلبك ولا تأسر لبك بأهدابها."]]}, {"l": "Pro 7:25", "n": "", "vs": [[25, "لا تجنح قلوبكم نحو طرقها، ولا تحوم في دروبها."]]}, {"l": "Mat 5:28", "n": "", "vs": [[28, "أما أنا فأقول لكم: كل من ينظر إلى امرأة بقصد أن يشتهيها، فقد زنى بها في قلبه!"]]}, {"l": "Mat 5:29", "n": "", "vs": [[29, "فإن كانت عينك اليمنى فخا لك، فاقلعها وارمها عنك، فخير لك أن تفقد عضوا من أعضائك ولا يطرح جسدك كله في جهنم!"]]}, {"l": "Mat 15:19", "n": "", "vs": [[19, "فمن القلب تنبع الأفكار الشريرة، القتل، الزنى، الفسق، السرقة، شهادة الزور، التجديف."]]}, {"l": "Jam 1:14", "n": "", "vs": [[14,  تزوج بمطلقة، فهو يرتكب الزنى."]]}, {"l": "Mat 19:3-9", "n": "", "vs": [[3, "وتقدم إليه بعض الفريسيين يجربونه، فسألوه: «هل يحل للرجل أن يطلق زوجته لأي سبب؟»"], [4, "فأجابهم قائلا: «ألم تقرأوا أن الخالق جعل الإنسان منذ البدء ذكرا وأنثى،"], [5, "وقال: لذلك يترك الرجل أباه وأمه ويتحد بزوجته، فيصير الاثنان جسدا واحدا؟"], [6, "فليسا في ما بعد اثنين، بل جسد واحد. فلا يفرقن الإنسان ما قد قرنه الله !»"], [7, "فسألوه: «فلماذا أوصى موسى بأن تعطى الزوجة وثيقة طلاق فتطلق؟»"], [8, "أجاب: «بسبب قساوة قلوبكم، سمح لكم موسى بتطليق زوجاتكم. ولكن الأمر لم يكن هكذا منذ البدء."], [9, "ولكني أقول لكم: إن الذي يطلق زوجته لغير علة الزنى، ويتزوج بغيرها، فإنه يرتكب الزنى. والذي يتزوج بمطلقة، يرتكب الزنى»."]]}, {"l": "Mar 10:2-12", "n": "", "vs": [[2, "وتقدم إليه بعض الفريسيين وسألوه ليجربوه: «هل يحل للرجل أن يطلق زوجته؟»"], [3, "فرد عليهم سائلا:"], [4, "«بماذا أوصاكم موسى؟» فقالوا: «سمح موسى بأن تكتب وثيقة طلاق ثم تطلق الزوجة»."], [5, "فأجابهم يسوع: «بسبب قساوة قلوبكم كتب لكم موسى هذه الوصية."], [6, "ولكن منذ بدء الخليقة جعل الله الإنسان ذكرا وأنثى."], [7, "لذلك يترك الرجل أباه وأمه ويتحد بزوجته،"], [8, "فيصير الاثنان جسدا واحدا. فلا يكونان بعد اثنين بل جسدا واحدا."], [9, "فما جمعه الله لا يفرقه إنسان»."], [10, "وفي البيت، عاد تلاميذه فسألوه عن الأمر."], [11, "فقال لهم: «أي من طلق زوجته وتزوج بأخرى، يرتكب معها الزنى."], [12, "وإن طلقت الزوجة زوجها وتزوجت من آخر، ترتكب الزنى! »"]]}, {"l": "Luk 16:18", "n": "", "vs": [[18, "كل من يطلق زوجته ويتزوج بأخرى، يرتكب الزنى. وكل من يتزوج بمطلقة من زوجها يرتكب الزنى."]]}], "kwAr": "ويقول الرب", "noteAr": ""}, {"kw": "that he hateth putting away", "raw": "or, if he hate her, put her away, Heb. to put away", "note": "or, if he hate her, put her away, Heb. to put away", "refs": [], "kwAr": "أمقت الطلاق", "noteAr": "أو: «إن كرهها فليطلقها»؛ بالعبرية: «للتطليق»."}, {"kw": "covereth", "raw": "Pro_28:13; Isa_28:20, Isa_59:6; Mic_7:2, Mic_7:3", "note": "", "refs": [{"l": "Pro 28:13", "n": "", "vs": [[13, "من يكتم آثامه لا يفلح، ومن يعترف بها ويقلع عنها يحظى با 9, "لأنه يقول: لا ينتفع الإنسان شيئا من إرضاء الله."]]}, {"l": "Job 34:17", "n": "", "vs": [[17, "أيمكن لمبغض العدل أن يحكم؟ أتدين البار القدير؟"]]}, {"l": "Job 34:36", "n": "", "vs": [[36, "ياليت أيوب يمتحن أقسى امتحان، لأنه أجاب كما يجيب أهل الشر."]]}, {"l": "Job 36:17", "n": "", "vs": [[17, "ولكنك مثقل بالدينونة الواقعة على الأشرار، فالدعوى والقضاء يمسكانك."]]}, {"l": "Psa 73:3-15", "n": "", "vs": [[3, "لأني حسدت المتكبرين، إذ شاهدت نجاح الأشرار."], [4, "فإن أوجاع الموت لا تصيبهم وأجسامهم سمينة."], [5, "لا يقاسون من أتعاب البشر، ولا يعانون من المصائب كالناس."], [6, "لذلك لبسوا الكبرياء كقلادة، وارتدوا الظلم كثوب."], [7, "عيونهم جاحظة من كثرة شحم طمعهم. وشرهم تجاوز ما يتصوره القلب."], [8, "يستهزئون ويتكلمون بالظلم خبثا، وبكبرياء ينطقون."], [9, "جدفوا على السماء بأفواههم، ولوثوا الأرض بخبث ألسنتهم."], [10, "حتى شعب الله يرجعون إليهم، ويصدقون ما يقولونه لهم."], [11, "أما هم فيقولون: كيف يعلم الله، وهل يدري العلي بما يحدث؟"], [12, "ها هم الأشرار المفلحون في العالم يزدادون ثروة."], [13, "باطلا قد طهرت قلبي وغسلت يدي بالنقاوة."], [14, "لقد جعلتني يارب مصابا طول النهار، وأوقعت علي عقابك كل صباح."], [15, "لو أنني نطقت بمثل هذا، لكنت قد خنت جيل أولادك."]]}, {"l": "Mat 11:18", "n": "", "vs": [[18, "فقد جاء يوحنا لا يأكل ولا يشرب، فقالوا: إن شيطانا يسكنه!"]]}, {"l": "Mat 11:19", "n": "", "vs": [[19, "ثم جاء ابن الإنسان يأكل ويشرب، فقالوا: هذا رجل شره وسكير، صديق لجباة الضرائب والخاطئين. ولكن تختبر الحكمة بأعمالها.»"]]}], "kwAr": "كل من يرتكب الشر", "noteAr": ""}, {"kw": "Where", "raw": "Deu_32:4; 1Sa_2:3; Psa_10:11-13; Ecc_8:11; Isa_5:18, Isa_5:19, Isa_30:18; Eze_8:12; Eze_9:9; Zep_1:12; 2Pe_3:3, 2Pe_3:4", "note": "", "refs": [{"l": "Deu 32:4", "n": "", "vs": [[4, "هو الصخر، وصنائعه كلها كاملة، سبله جميعها عدل. هو إله أمانة لا يرتكب جورا، صديق وعادل هو."]]}, {"l": "1Sa 2:3", "n": "", "vs": [[3, "كفوا عن الكبرياء، وكموا أفواهكم عن الغرور لأن الرب إله عليم وبه توزن الأعمال."]]}, {"l": "Psa 10:11-13", "n": "", "vs": [[11, "يقول في قلبه: الله غافل. قد حجب وجهه، ولن يرى ما يجري"  "vs": [[3, "صوت يصرخ ويقول: «أعدوا في البرية طريق الرب، وأقيموا طريقا مستقيما لإلهنا."], [4, "كل واد يرتفع، وكل تل ينخفض. وتمهد كل أرض معوجة وتعبد كل بقعة وعرة"], [5, "ويتجلى مجد الله، فيشاهده كل ذي جسد، لأن فم الرب قد تكلم»."]]}, {"l": "Mat 3:1-3", "n": "", "vs": [[1, "في تلك الفترة من الزمان، ظهر يوحنا المعمدان في برية اليهودية، يبشر"], [2, "قائلا: «توبوا، فقد اقترب ملكوت السماوات!»"], [3, "ويوحنا هذا هو الذي قيل عنه بلسان النبي إشعياء القائل: «صوت مناد في البرية: أعدوا طريق الرب، واجعلوا سبله مستقيمة!»"]]}, {"l": "Mat 17:10-13", "n": "", "vs": [[10, "فسأله تلاميذه: «لماذا إذن يقول الكتبة إن إيليا لابد أن يأتي قبلا؟»"], [11, "فأجابهم قائلا: «حقا، إن إيليا يأتي قبلا ويصلح كل شيء."], [12, "على أني أقول لكم: قد جاء إيليا، ولم يعرفوه، بل فعلوا به كل ما شاءوا. كذلك ابن الإنسان أيضا على وشك أن يتألم على أيديهم»."], [13, "عندئذ فهم التلاميذ أنه كلمهم عن يوحنا المعمدان."]]}, {"l": "Luk 1:16", "n": "", "vs": [[16, "ويرد كثيرين من بني إسرائيل إلى الرب إلههم،"]]}, {"l": "Luk 1:17", "n": "", "vs": [[17, "فيتقدم أمامه وله روح إيليا وقدرته، ليرد قلوب الآباء إلى الأولاد، والعصاة إلى حكمة الأبرار، ليهييء للرب شعبا معدا!»"]]}, {"l": "Luk 3:3-6", "n": "", "vs": [[3, "فانطلق إلى جميع النواحي المحيطة بنهر الأردن ينادي بمعمودية التوبة لمغفرة الخطايا،"], [4, "كما كتب في كتاب أقوال النبي إشعياء: «صوت مناد في البرية: أعدوا طريق الرب واجعلوا سبله مستقيمة."], [5, "كل واد سيردم، وكل جبل وتل سيخفض، وتصير الأماكن الملتوية مستقيمة والأماكن الوعرة طرقا مستوية،"], [6, "فيبصر كل بشر الخلاص الإلهي! »"]]}, {"l": "Joh 1:15-23", "n": "", "vs": [[15, "شهد له يوحنا فهتف قائلا: «هذا هو الذي قلت عنه: إن الآتي بعدي متقدم علي، لأنه كان قبل أن أوجد»."], [16, "فمن امتلائه أخذنا جميعنا ونلنا نعمة على نعمة،"], [17, "لأن الشريعة أعطيت على يد موسى، أما النعمة والحق فقد تواجدا بيسوع المسيح."], [18, "ما من أحد رأى الله قط. ولكن الابن الوحيد، الذي في حضن الآب، هو الذي كشف عنه."], [19, "وهذه شهادة يوحنا حين أرسل اليهود من أورشليم بعض الكهنة واللاويين يسألونه: «من أنت؟»"], [20, "فاعترف ولم ينكر، بل أكد قائلا: «لست أنا المسيح»."], [21, "فسألوه: «ماذا إذن؟ هل أنت إيليا؟» قال: «لست إياه!»؛ «أو أنت النبي؟» فأجاب: «لا!»"], [22, "فقالوا: «فمن أنت، لنحمل الجواب إلى الذين أرسلونا؟ ماذا تقول عن نفسك؟»"], [23, "فقال «أنا صوت مناد في البرية: اجعلوا الطريق مستقيمة أمام الرب، كما قال النبي إشعياء»."]]}, {"l": "Joh 1:33", "n": "", "vs": [[33, "ولم أكن أعرفه، ولكن الذي أرسلني لأعمد بالماء هو قال لي: الذي ترى الروح ينزل ويستقر عليه هو الذي سيعمد بالروح القدس."]]}, {"l": "Joh 1:34", "n": "", "vs": [[34, "فإذ شاهدت هذا، أشهد أنه هو ابن الله»."]]}, {"l": "Joh 3:28-30", "n": "", "vs": [[28, "أنتم تشهدون أني قلت: لست المسيح، بل أنا رسول يمهد له الطريق."], [29, "ومن له العروس، يكون هو العريس! أما صديق العريس، الذي يقف قربه ويسمعه، فيبتهج لفرحه بصوت العريس. وها إن فرحي هذا قد تم."], [30, "فلابد أن يزيد هو وأنقص أنا»"]]}, {"l": "Act 13:24", "n": "", "vs": [[24, "وقد سبق يوحنا مجيء يسوع، فدعا شعب إسرائيل جميعا إلى معمودية التوبة."]]}, {"l": "Act 13:25", "n": "", "vs": [[25, "ولما أوشك يوحنا أن ينهي مهمته، قال: من تظنونني؟ لست أنا (المخلص)، بل إنه آت بعدي. ولست أستحق أن أحل رباط حذائه!"]]}, {"l": "Act 19:4", "n": "", "vs": [[4, "فقال بولس: «كان يوحنا يعمد بمعمودية التوبة، ويدعو الشعب إلى الإيمان بالآتي بعده، أي بيسوع»."]]}], "kwAr": "فيمهد الطريق", "noteAr": ""}, {"kw": "and", "raw": "Psa_110:1; Isa_7:14, Isa_9:6; Hag_2:7-9; Luk_2:11, Luk_2:21-32, Luk_2:38, Luk_2:46; Luk_7:19, Luk_7:20, Luk_19:47; Joh_2:14-16", "note": "", "refs": [{"l": "Psa 110:1", "n": "", "vs": [[1, "قال الرب لربي: «اجلس عن يميني حتى أضع أعداءك موطئا لقدميك»."]]}, {"l": "Isa 7:14", "n": "", "vs": [[14, "ولكن السيد نفسه يعطيكم آية: ها العذراء تحبل وتلد ابنا، وتدعو اسمه عمانوئيل."]]}, {"l": "Isa 9:6", "n": "", "vs": [[6, "لأنه يولد لنا ولد ويعطى لنا ابن يحمل الرياسة على كتفه، ويدعى اسمه عجيبا، مشيرا، إلها قديرا، أبا أبديا، رئيس السلام."]]}, {"l": "Hag 2:7-9", "n": "", "vs": [[7, "وأزعزع أركان جميع الأمم فتجلب نفائسهم إلى هذا المكان وأملأ هذا الهيكل بالمجد."], [8, "فالذهب والفضة لي يقول الرب القدير."], [9, "ويكون مجد هذا الهيكل الأخير أعظم من مجد الهيكل السابق، وأجعل السلام يسود هذا الموضع يقول الرب القدير»."]]}, {"l": "Luk 2:11", "n": "", "vs": [[11, "فقد ولد لكم اليوم في مدينة داود مخلص هو المسيح الرب."]]}, {"l": "Luk 2:21-32", "n": "", "vs": [[21, "ولما تمت ثمانية أيام ليختن الطفل، سمي يسوع، كما كان قد سمي بلسان الملاك قبل أن يحبل به في البطن."], [22, "ثم لما تمت الأيام لتطهيرها حسب شريعة موسى، صعدا به إلى أورشليم ليقدماه إلى الرب،"], [23, "كما كتب في شريعة الرب: «كل بكر من الذكور يدعى قدسا للرب»،"], [24, "وليقدما ذبيحة كما يوصى في شريعة الرب: «زوجي يمام، أو فرخي حمام»."], [25, "وكان في أورشليم رجل اسمه سمعان، وهو رجل بار تقي ينتظر العزاء لإسرائيل وكان الروح القدس عليه."], [26, "وكان الروح القدس قد أوحى إليه أنه لا يرى الموت قبل أن يرى مسيح الرب،"], [27, "وقد جاء إلى الهيكل بدافع من الروح. فلما أحضر الأبوان الطفل يسوع ليقدما عنه ما سن في الشريعة،"], [28, "حمله على ذراعيه وبارك الله ، وقال:"], [29, "«أيها السيد، الآن تطلق عبدك بسلام حسب وعدك!"], [30, "فإن عيني قد أبصرتا خلاصك"], [31, "الذي هيأته لتقدمه إلى الشعوب كلها،"], [32, "نور هداية للأمم ومجدا لشعبك إسر ائيل»."]]}, {"l": "Luk 2:38", "n": "", "vs": [[38, "فإذ حضرت في تلك الساعة، أخذت تسبح الرب وتتحدث عن يسوع مع جميع الذين كانوا ينتظرون فداء في أورشليم."]]}, {"l": "Luk 2:46", "n": "", "vs": [[46, "وبعد ثلاثة أيام وجداه في الهيكل، جالسا وسط المعلمين يستمع إليهم ويطرح عليهم الأسئلة."]]}, {"l": "Luk 7:19", "n": "", "vs": [[19, "وأرسلهما إلى الرب، يسأله: «أأنت هو الآتي، أم ننتظر آخر؟»"]]}, {"l": "Luk 7:20", "n": "", "vs": [[20, "فلما جاء الرجلان إلى الرب، قالا: «أرسلنا إليك يوحنا المعمدان، يسأل: أأنت هو الآتي، أم ننتظر آخر ؟»"]]}, {"l": "Luk 19:47", "n": "", "vs": [[47, "وكان يعلم يوما فيوما في الهيكل. وسعى رؤساء الكهنة والكتبة ووجهاء الشعب إلى قتله."]]}, {"l": "Joh 2:14-16", "n": "", "vs": [[14, "فوجد في الهيكل باعة البقر والغنم والحمام، والصيارفة جالسين إلى موائدهم،"], [15, "فجدل سوطا من حبال، وطردهم جميعا من الهيكل، مع الغنم والبقر، وبعثر نقود الصيارفة وقلب مناضدهم،"], [16, "وقال لبائعي الحمام: «أخرجوا هذه من هنا. لا تجعلوا بيت أبي بيتا للتجارة!»"]]}], "kwAr": "ويأتي الرب", "noteAr": ""}, {"kw": "even", "raw": "Gen_48:15, Gen_48:16; Exo_23:20; Isa_63:9; Hos_12:3-5; Act_7:38", "note": "", "refs": [{"l": "Gen 48:15", "n": "", "vs": [[15, "وبارك يوسف قائلا: «إن الله الذي سلك أمامه أبواي إبراهيم وإسحق، الله الذي رعاني منذ وجودي إلى هذا اليوم،"]]}, {"l": "Gen 48:16", "n": "", "vs": [[16, "الملاك الذي أنقذني من كل شر، يبارك الغلامين، وليدع عليهما اسمي واسما أبوي إبراهيم وإسحق، وليكثرا كثيرا في الأرض»."]]}, {"l": "Exo 23:20", "n": "", "vs": [[20, "ها أنا مرسل ملاكي أمامك ليحرسك طوال الطريق، ويقودك إلى الأرض التي أعددتها لك."]]}, {"l": "Isa 63:9", "n": "", "vs": [[9, "فتضايق في كل ضيقاتهم، وملاك حضرته أنقذهم، وبفضل محبته وحنانه افتداهم ورفعهم وحملهم طوال الأيام الغابرة."]]}, {"l": "Hos 12:3-5", "n": "", "vs": [[3, "(لكم طمع يعقوب في بركة الرب)، فقبض وهو ما برح في الرحم على عقب أخيه، وفي رجولته جاهد مع الله."], [4, "تصارع مع الملاك وغلب. بكى والتمس رضاه وبركته، التقاه الله في بيت إيل فخاطبه هناك."], [5, "هو الله القدير ويهوه اسمه."]]}, {"l": "Act 7:38", "n": "", "vs": [[38, "وهو الذي كان يقود جماعة الشعب في الصحراء، وقد قام بدور الوسيط بين الملاك الذي كلمه على جبل سيناء وآبائنا، فنقل إليكم وصايا الله الحية."]]}], "kwAr": "ملاك العهد", "noteAr": ""}, {"kw": "he shall come", "raw": "Hag_2:7", "note": "", "refs": [{"l": "Hag 2:7", "n": "", "vs": [[7, "وأزعزع أركان جميع الأمم فتجلب نفائسهم إلى هذا المكان وأملأ هذا الهيكل بالمجد."]]}], "kwAr": "ويقبل", "noteAr": ""}], "arS": [["«ها أنا ", []], ["أرسل", ["H7971"]], [" ", []], ["رسولي", ["H4397"]], [" ", []], ["فيمهد", ["H6437"]], [" ", []], ["الطريق", ["H1870"]], [" ", []], ["أمامي", ["H6440"]], [" ", []], ["ويأتي", ["H935"]], [" ", []], ["الرب", ["H113"]], [" الذي ", []], ["تطلبونه", ["H1245"]], [" ", []], ["فجأة", ["H6597"]], [" إلى ", []], ["هيكله", ["H1964"]], [" ", []], ["ويقبل", ["H935"]], [" أيضا ", []], ["ملاك", ["H4397"]], [" ", []], ["العهد", ["H1285"]], [" الذي ", []], ["تسرون", ["H2655"]], [" به» ", []], ["يقول", ["H559"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["القدير", ["H6635"]]]}, {"c": 3, "v": 2, "text": "ولكن من يحتمل يوم مجيئه؟ ومن يثبت عند ظهوره؟ فإنه مثل نار الممحص أو أشنان القصارين.", "groups": [{"kw": "who may abide", "raw": "Mal_4:1; Amo_5:18-20; Mat_3:7-12, Mat_21:31-44, 23:13-35, Mat_25:10; Luk_2:34; Luk_3:9, Luk_3:17, Luk_7:23, Luk_11:37-47, Luk_11:52-54, Luk_21:36; Joh_6:42-44, Joh_8:41-48, Joh_8:55, Joh_9:39-41, Joh_15:22-24; Act_7:52-54; Rom_9:31-33; Rom_11:5-10; Heb_10:28, Heb_10:29, Heb_12:25; 1Pe_2:7, 1Pe_2:8; Rev_1:6, Rev_1:7, Rev_6:17", "note": "", "refs": [{"l": "Mal 4:1", "n": "", "vs": [[1, "«انظروا، ها يوم القضاء مقبل، لاهب كتنور يكون فيه جميع المستكبرين وفاعلي الإثم عصافة، فيحرقهم ذلك اليوم ولا يبقي لهم أصلا ولا فرعا، يقول الرب القدير."]]}, {"l": "Amo 5:18-20", "n": "", "vs": [[18, "ويل للذين يتشوقون ليوم الرب. لماذا تطلبون مجيء يوم الرب؟ فيوم الرب هو ظلمة لا نور."], [19, "فتكونون كرجل هرب من وجه أسد فلقيه دب، أو كمن دخل إلى بيت واتكأ بيده على حائط فلدغته أفعى."], [20, "أو ليس يوم الرب ظلمة لا نورا، وقتاما خاليا من الضياء؟"]]}, {"l": "Mat 3:7-12", "n": "", "vs": [[7, "ولما رأى يوحنا كثيرين من الفر يسيين والصدوقيين يأتون إليه ليتعمدوا، قال لهم: «ياأولاد الأفاعي، من أنذركم لتهربوا من الغضب الآتي؟"], [8, "فأثمروا ثمرا يليق بالتوبة."], [9, "ولا تعللوا أنفسكم قائلين: لنا إبراهيم أبا! فإني أقول لكم: إن الله قادر أن يطلع من هذه الحجارة أولادا لإبراهيم."], [10, "وها إن الفأس قد ألقيت على أصل الشجر، فكل شجرة لا تثمر ثمرا جيدا تقطع وتطرح في النار."], [11, "أنا أعمدكم بالماء لأجل التوبة، ولكن الآتي بعدي هو أقدر مني، وأنا لا أستحق أن أحمل حذاءه. هو سيعمدكم بالروح القدس، وبالنار."], [12, "فهو يحمل المذرى بيده، وسينقي بيدره تماما: فيجمع قمحه إلى المخزن، وأما التبن فيحرقه بنار لا تطفأ! »"]]}, {"l": "Mat 21:31-44", "n": "", "vs": [[31, "فأي الاثنين عمل بإرادة الأب؟» فقالوا: «الأول!» فقال لهم يسوع: «الحق أقول لكم: إن جباة الضرائب والزانيات سيسبقونكم في الدخول إلى ملكوت الله."], [32, "فقد جاء يوحنا إليكم سالكا طريق الحق، فلم تصدقوه. أما جباة الضرائب والزانيات فصدقوه. ولما رأيتم أنتم هذا، لم تندموا بعد ذلك لتصدقوه!"], [33, "اسمعوا مثلا آخر: غرس إنسان رب بيت كرما، وأقام حوله سياجا، وحفر فيه معصرة، وبنى فيه برج حراسة. ثم سلم الكرم إلى مزارعين وسافر."], [34, "ولما حان أوان القطاف، أرسل عبيده إلى المزارعين ليتسلم ثمر الكرم."], [35, "فقبض المزارعون على العبيد، فضربوا أحدهم، وقتلوا غيره، ورجموا الآخر بالحجارة."], [36, "ثم أرسل رب البيت ثانية عبيدا آخرين أكثر عددا من الأولين. ففعل المزارعون بهؤلاء ما فعلوه بأولئك."], [37, "وأخيرا أرسل إليهم ابنه، قائلا: سيهابون ابني!"], [38, "فما إن رأى المزارعون الابن حتى قال بعضهم لبعض: هذا هو الوريث! تعالوا نقتله فنستولي على ميراثه."], [39, "ثم قبضوا عليه، وطرحوه خارج الكرم، وقتلوه!"], [40, "فعندما يعود رب الكرم، ماذا يفعل بأولئك المزارعين؟»"], [41, "أجابوه: «أولئك الأشرار، يهلكهم شر هلاك. ثم يسلم الكرم إلى مزارعين آخرين يؤدون له الثمر في أوانه»."], [42, "فقال لهم يسوع: «ألم تقرأوا في الكتاب: الحجر الذي رفضه البناة، هو نفسه صار حجر الزاوية الأساسي. من الرب كان هذا، وهو عجيب في أنظارنا!"], [43, "لذلك أقول لكم: إن ملكوت الله سينزع من أيديكم ويسلم إلى شعب يؤدي ثمره."], [44, "فأي من يقع على هذا الحجر يتكسر، ومن يقع الحجر عليه يسحقه سحقا! »"]]}, {"l": "Mat 23:13-35", "n": "", "vs": [[13, "لكن الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تغلقون ملكوت السماوات في وجوه الناس، فلا أنتم تدخلون، ولا تدعون الداخلين يدخلون!"], [14, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تلتهمون بيوت الأرامل وتتذرعون بإطالة صلواتكم. لذلك ستنزل بكم دينونة أقسى!"], [15, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تطوفون البحر والبر لتكسبوا متهودا واحدا؛ فإذا تهود جعلتموه أهلا لجهنم ضعف ما أنتم عليه!"], [16, "الويل لكم أيها القادة العميان! تقولون: من أقسم بالهيكل، فقسمه غير ملزم؛ أما من أقسم بذهب الهيكل، فقسمه ملزم!"], [17, "أيها الجهال والعميان! أي الاثنين أعظم: الذهب أم الهيكل الذي يجعل الذهب مقدسا؟"], [18, "وتقولون: من أقسم بالمذبح، فقسمه غير ملزم؛ أما من أقسم بالقربان الذي على المذبح، فقسمه ملزم!"], [19, "أيها العميان! أي الاثنين أعظم: القربان أم المذبح الذي يجعل القربان مقدسا؟"], [20, "فإن من أقسم بالمذبح، فقد أقسم به وبكل ما عليه؛"], [21, "ومن أقسم بالهيكل، فقد أقسم به وبالساكن فيه؛"], [22, "ومن أقسم بالسماء، فقد أقسم بعرش الله وبالجالس عليه!"], [23, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تؤدون حتى عشور النعنع والشبث والكمون، وقد أهملتم أهم ما في الشريعة: العدل والرحمة والأمانة. كان يجب أن تفعلوا هذه ولا تغفلوا تلك!"], [24, "أيها القادة العميان! إنكم تصفون الماء من البعوضة، ولكنكم تبلعون الجمل!"], [25, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تنظفون الكأس والصحفة من الخارج، ولكنهما من الداخل ممتلئتان بما كسبتم بالنهب والطمع!"], [26, "أيها الفريسي الأعمى، نظف أولا داخل الكأس ليصير خارجها أيضا نظيفا!"], [27, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم كالقبور المطلية بالكلس: تبدو جميلة من الخارج، ولكنها من الداخل ممتلئة بعظام الموتى وكل نجاسة!"], [28, "كذلك أنتم أيضا، تبدون للناس أبرارا، ولكنكم من الداخل ممتلئون بالرياء والفسق!"], [29, "«الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تبنون قبور الأنبياء وتزينون مدافن الأبرار،"], [30, "وتقولون: لو عشنا في زمن آبائنا لما شاركناهم في سفك دم الأنبياء."], [31, "فبهذا تشهدون على أنفسكم بأنكم أبناء قاتلي الأنبياء!"], [32, "فأكملوا ما بدأه آباؤكم ليطفح الكيل!"], [33, "أيها الحيات، أولاد الأفاعي! كيف تفلتون من عقاب جهنم؟"], [34, "لذلك: ها أنا أرسل إليكم أنبياء وحكماء ومعلمين، فبعضهم تقتلون وتصلبون، وبعضهم تجلدون في مجامعكم، وتطاردونهم من مدينة إلى أخرى."], [35, "وبهذا يقع عليكم كل دم زكي سفك على الأرض: من دم هابيل البار إلى دم زكريا بن برخيا الذي قتلتموه بين الهيكل والمذبح."]]}, {"l": "Mat 25:10", "n": "", "vs": [[10, "وبينما الجاهلات ذاهبات للشراء، وصل العريس، فدخلت المستعدات معه إلى قاعة العرس، وأغلق الباب."]]}, {"l": "Luk 2:34", "n": "", "vs": [[34, "فباركهما سمعان، وقال لمريم أم الطفل: «ها إن هذا الطفل قد جعل لسقوط كثيرين وقيام كثيرين في إسرائيل، وآية تقاوم"]]}, {"l": "Luk 3:9", "n": "", "vs": [[9, "وها إن الفأس أيضا قد وضعت على أصل الشجر: فكل شجرة لا تثمر ثمرا جيدا تقطع وتطرح في النار»."]]}, {"l": "Luk 3:17", "n": "", "vs": [[17, "فهو يحمل المذرى بيده لينقي بيدره تماما، فيجمع القمح إلى مخزنه، وأما التبن فيحرقه بنار لا تطفأ»."]]}, {"l": "Luk 7:23", "n": "", "vs": [[23, "وطوبى لكل من لا يشك في! »"]]}, {"l": "Luk 11:37-47", "n": "", "vs": [[37, "وبينما هو يتكلم، طلب إليه أحد الفريسيين أن يتغدى عنده. فدخل (بيته) واتكأ."], [38, "ولكن الفريسي تعجب لما رأى أنه لم يغتسل قبل الغداء."], [39, "فقال له الرب: «أنتم الفريسيين تنظفون الكأس والصحفة من الخارج، ولكنكم من الداخل مملوؤون نهبا وخبثا."], [40, "أيها الأغبياء، أليس الذي صنع الخارج قد صنع الداخل أيضا؟"], [41, "أحرى بكم أن تتصدقوا بما عندكم، فإذا كل شيء يكون طاهرا لكم."], [42, "ولكن الويل لكم أيها الفريسيون فإنكم تدفعون عشر النعنع والسذاب والبقول الأخرى، وتتجاوزون عن العدل ومحبة الله: كان يجب أن تعملوا هذا ولا تهملوا ذاك!"], [43, "الويل لكم أيها الفريسيون، فإنكم تحبون تصدر المقاعد الأولى في المجامع وتلقي التحيات في الساحات العامة!"], [44, "الويل لكم، فإنكم تشبهون القبور المخفية، يمشي الناس عليها وهم لا يعلمون!»"], [45, "وتكلم أحد علماء الشريعة، قائلا له: «يامعلم، إنك بقولك هذا تهيننا نحن أيضا»."], [46, "فقال: «والويل أيضا لكم ياعلماء الشريعة، فإنكم تحملون الناس أحمالا مرهقة، وأنتم لا تمسونها بإصبع من أصابعكم!"], [47, "الويل لكم، فإنكم تبنون قبور الأنبياء وآباؤكم قتلوهم."]]}, {"l": "Luk 11:52-54", "n": "", "vs": [[52, "الويل لكم ياعلماء الشريعة، فإنكم خطفتم مفتاح المعرفة، فلا أنتم دخلتم ولا تركتم الداخلين يدخلون! »"], [53, "وفيما هو خارج من هناك، بدأ الكتبة والفريسيون يضيقون عليه كثيرا، وأخذوا يستدرجونه إلى الكلام في أمور كثيرة،"], [54, "وهم يراقبونه سعيا إلى اصطياده بكلام يقوله."]]}, {"l": "Luk 21:36", "n": "", "vs": [[36, "فاسهروا إذن وتضرعوا في كل حين، لكي تتمكنوا من أن تنجوا من جميع هذه الأمور التي هي على وشك أن تحدث، وتقفوا أمام ابن الإنسان»."]]}, {"l": "Joh 6:42-44", "n": "", "vs": [[42, "وقالوا: «أليس هذا يسوع ابن يوسف، الذي نعرف نحن أباه وأمه، فكيف يقول: إني نزلت من السماء؟»"], [43, "فأجابهم يسوع: «لا تتذمروا فيما بينكم!"], [44, "لا يقدر أحد أن يأتي إلي إلا إذا اجتذبه الآب الذي أرسلني. وأنا أقيمه في اليوم الأخير."]]}, {"l": "Joh 8:41-48", "n": "", "vs": [[41, "أنتم تعملون أعمال أبيكم!» فقالوا له: «نحن لم نولد من زنا! لنا أب واحد هو الله »."], [42, "فقال يسوع: «لو كان الله أباكم لكنتم تحبونني، لأني خرجت من الله وجئت. لم آت من نفسي، بل هو الذي أرسلني."], [43, "لماذا لا تفهمون كلامي؟ لأنكم لا تطيقون سماع كلمتي!"], [44, "إنكم أولاد أبيكم إبليس، وترغبون أن تعملوا شهوات أبيكم. فهو من البدء كان قاتلا للناس، ولم يثبت في الحق لأنه خال من الحق! وعندما ينطق بالكذب فهو ينضح بما فيه، لأنه كذاب وأبو الكذب!"], [45, "أما أنا فلأني أقول الحق، لستم تصدقونني."], [46, "من منكم يثبت علي خطيئة؟ فما دمت أقول الحق، فلماذا لا تصدقونني؟"], [47, "من كان من الله حقا، يسمع كلام الله. ولكنكم ترفضون كلام الله، لأنكم لستم من الله!»"], [48, "فقال اليهود: «ألسنا نقول الحق عندما نقول إنك سامري وإن فيك شيطانا؟»"]]}, {"l": "Joh 8:55", "n": "", "vs": [[55, "مع أنكم لا تعرفونه. أما أنا فأعرفه. ولو قلت لكم إني لا أعرفه لكنت مثلكم كاذبا. لكني أعرفه وأعمل بكلمته."]]}, {"l": "Joh 9:39-41", "n": "", "vs": [[39, "فقال يسوع: «لدينونة أتيت إلى هذا العالم: ليبصر العميان، ويعمى المبصرون!»"], [40, "فسمع ذلك بعض الفريسيين الذين كانوا معه فسألوه: «وهل نحن أيضا عميان؟»"], [41, "فأجابهم يسوع: «لو كنتم عميانا بالفعل، لما كانت عليكم خطيئة. ولكنكم تدعون أنكم تبصرون، ولذلك فإن خطيئتكم باقية...»"]]}, {"l": "Joh 15:22-24", "n": "", "vs": [[22, "لو لم آت وأكلمهم، لما كانت لهم خطيئة؛ ولكن لا عذر لهم الآن في خطيئتهم."], [23, "الذي يبغضني، يبغض أبي أيضا."], [24, "ولو لم أعمل بينهم أعمالا لم يعملها أحد غيري، لما كانت لهم خطيئة. ولكنهم أبغضوني وأبغضوا أبي، مع أنهم رأوا تلك الأعمال."]]}, {"l": "Act 7:52-54", "n": "", "vs": [[52, "فأي نبي نجا من اضطهادهم وقد قتلوا الذين أنبأوا بمجيء البار الذي سلمتموه أنتم وقتلتموه!"], [53, "فأنتم أخذتم الشريعة من أيدي الملائكة، ولكنكم لم تطيعوها!»"], [54, "فلما سمع المجتمعون كلام استفانوس، ملأ الغيظ قلوبهم، وأخذوا يصرون بأسنانهم توعدا."]]}, {"l": "Rom 9:31-33", "n": "", "vs": [[31, "أما إسرائيل، وقد كانوا يسعون وراء شريعة تهدف إلى البر، فقد فشلوا حتى في بلوغ الشريعة."], [32, "ولأي سبب؟ لأن سعيهم لم يكن على أساس الإيمان، بل كان وكأن الأمر قائم على الأعمال. فقد تعثروا بحجر العثرة،"], [33, "كما كتب: «ها أنا واضع في صهيون حجر عثرة وصخرة سقوط. ومن يؤمن به لا يخيب»."]]}, {"l": "Rom 11:5-10", "n": "", "vs": [[5, "فكذلك، في الزمان الحاضر، ماتزال بقية اختارها الله بالنعمة."], [6, "ولكن، بما أن ذلك قد تم بالنعمة، فليس بعد على أساس الأعمال، وإلا فليست النعمة نعمة بعد."], [7, "فما الخلاصة إذا؟ إن ما يسعى إليه إسرائيل لم ينالوه، بل ناله المختارون منهم، والباقون عميت بصائرهم،"], [8, "وفقا لما قد كتب: «ألقى الله عليهم روح خمول وأعطاهم عيونا لا يبصرون بها، وآذانا لا يسمعون بها، حتى هذا اليوم»."], [9, "كذلك يقول داود: «لتصر لهم مائدتهم فخا وشركا وعقبة وعقابا."], [10, "لتظلم عيونهم كي لا يبصروا، ولتكن ظهورهم منحنية دائما!»"]]}, {"l": "Heb 10:28", "n": "", "vs": [[28, "تعلمون أن من خالف شريعة موسى، كان عقابه الموت دون رحمة، على أن يؤيد مخالفته شاهدان أو ثلاثة."]]}, {"l": "Heb 10:29", "n": "", "vs": [[29, "ففي ظنكم، كم يكون أشد كثيرا ذلك العقاب الذي يستحقه من يدوس ابن الله، إذ يعتبر أن دم العهد، الذي يتقدس به، هو دم نجس، وبذلك يهين روح النعمة؟"]]}, {"l": "Heb 12:25", "n": "", "vs": [[25, "إذن حذار أن ترفضوا الذي يتكلم! فمادام أولئك الذين رفضوا الاستماع لمن كلمهم على هذه الأرض، لم يفلتوا (من العقاب) قط، فكم بالأحرى لا نفلت نحن أبدا إن تحولنا عن الذي يتكلم إلينا من السماء عينها!"]]}, {"l": "1Pe 2:7", "n": "", "vs": [[7, "فإن هذا الحجر هو ثمين في نظركم، أنتم المؤمنين به. أما بالنسبة إلى الذين لا يؤمنون، «فالحجر الذي رفضه البناؤون صار هو الحجر الأساسي رأس زاوية البيت»،"]]}, {"l": "1Pe 2:8", "n": "", "vs": [[8, "كما أنه هو «الحجر الذي يصطدمون به، والصخرة التي يسقطون عليها»! وهم يسقطون لأنهم يرفضون أن يؤمنوا بالكلمة."]]}, {"l": "Rev 1:6", "n": "", "vs": [[6, "وجعل منا مملكة، وكهنة لله أبيه، له المجد والسلطان إلى أبد الآبدين. آمين!"]]}, {"l": "Rev 1:7", "n": "", "vs": [[7, "ها هو آت مع السحاب! ستراه عيون الجميع، حتى أولئك الذين طعنوه، وتنوح بسببه قبائل الأرض كلها! نعم، آمين!"]]}, {"l": "Rev 6:17", "n": "", "vs": [[17, "فإن يوم الغضب العظيم قد جاءهم، ومن يقوى على الوقوف أمامه؟"]]}], "kwAr": "من يحتمل يوم مجيئه", "noteAr": ""}, {"kw": "for", "raw": "Isa_4:4; Zec_13:9; Mat_3:10-12; 1Co_3:13-15; Rev_2:23", "note": "", "refs": [{"l": "Isa 4:4", "n": "", "vs": [[4, "إذ يغسل الرب قذر بنات صهيون، ويطهر أورشليم من لطخات الدماء بروح العدل وبروح النار المحرقة."]]}, {"l": "Zec 13:9", "n": "", "vs": [[9, "فأجيز هذا الثلث في النار لأنقيه تنقية الفضة، وأمحصه كما يمحص الذهب. هو يدعو باسمي وأنا أستجيبه. أنا أقول: هو شعبي، وهو يقول: الرب هو إلهي»."]]}, {"l": "Mat 3:10-12", "n": "", "vs": [[10, "وها إن الفأس قد ألقيت على أصل الشجر، فكل شجرة لا تثمر ثمرا جيدا تقطع وتطرح في النار."], [11, "أنا أعمدكم بالماء لأجل التوبة، ولكن الآتي بعدي هو أقدر مني، وأنا لا أستحق أن أحمل حذاءه. هو سيعمدكم بالروح القدس، وبالنار."], [12, "فهو يحمل المذرى بيده، وسينقي بيدره تماما: فيجمع قمحه إلى المخزن، وأما التبن فيحرقه بنار لا تطفأ! »"]]}, {"l": "1Co 3:13-15", "n": "", "vs": [[13, "فعمل كل واحد سينكشف علنا إذ يظهره ذلك اليوم الذي سيعلن في نار، وسوف تمتحن النار قيمة عمل كل واحد."], [14, "فمن بقي عمله الذي بناه على الأساس، ينال أجرا."], [15, "ومن احترق عمله، يخسر، إلا أنه هو سيخلص؛ ولكن كمن يمر في النار."]]}, {"l": "Rev 2:23", "n": "", "vs": [[23, "سأبيد أولادها بالموت، فتعرف الكنائس كلها أنني أنا الذي أفحص الأفكار والقلوب، وأجازي كل واحد منكم بحسب أعماله."]]}], "kwAr": "فإنه مثل نار الممحص", "noteAr": ""}, {"kw": "like fullers", "raw": "Psa_2:7; Isa_1:18; Jer_2:22; Mar_9:3; Rev_1:5, Rev_7:14, Rev_19:8", "note": "", "refs": [{"l": "Psa 2:7", "n": "", "vs": [[7, "وها أنا أعلن ما قضى به الرب: قال لي الرب: «أنت ابني، أنا اليوم ولدتك."]]}, {"l": "Isa 1:18", "n": "", "vs": [[18, "تعالوا نتحاجج يقول الرب، إن كانت خطاياكم كلطخات قرمزية فإنها تبيض كالثلج، وإن كانت حمراء كصبغ الدودي تصبح في نقاء الصوف!"]]}, {"l": "Jer 2:22", "n": "", "vs": [[22, "وإن اغتسلت بالنطرون، وأكثرت من استعمال الإشنان (الصابون)، فإن لطخة إثمك تظل ماثلة أمامي."]]}, {"l": "Mar 9:3", "n": "", "vs": [[3, "وصارت ثيابه لماعة تفوق الثلج بياضا، يعجز أي قصار على الأرض أن يبيض ما يماثلها."]]}, {"l": "Rev 1:5", "n": "", "vs": [[5, "ومن يسوع المسيح الشاهد الأمين، بكر القائمين من بين الأموات، ملك ملوك الأرض، ذاك الذي بدافع محبته لنا مات لأجلنا فغسلنا بدمه من خطايانا،"]]}, {"l": "Rev 7:14", "n": "", "vs": [[14, "فأجبته: «أنت أعلم ياسيدي!» فقال: «هؤلاء هم الذين أتوا من الضيقة العظيمة، وقد غسلوا ثيابهم وبيضوها بدم الحمل."]]}, {"l": "Rev 19:8", "n": "", "vs": [[8, "ووهب لها أن تلبس الكتان الأبيض الناصع!» والكتان يرمز إلى أعمال الصلاح التي قام بها القديسون."]]}], "kwAr": "أشنان القصارين", "noteAr": ""}], "arS": [["ولكن من ", []], ["يحتمل", ["H3557"]], [" ", []], ["يوم", ["H3117"]], [" ", []], ["مجيئه", ["H935"]], ["؟ ومن ", []], ["يثبت", ["H5975"]], [" عند ", []], ["ظهوره", ["H7200"]], ["؟ فإنه مثل ", []], ["نار", ["H784"]], [" ", []], ["الممحص", ["H6884"]], [" أو ", []], ["أشنان", ["H1287"]], [" ", []], ["القصارين", ["H3526"]], [".", []]]}, {"c": 3, "v": 3, "text": "فيجلس ممحصا ومنقيا للفضة ليطهر أبناء لاوي ويمحصهم كالفضة والذهب، حتى يقربوا للرب تقدمات بقلوب طاهرة.", "groups": [{"kw": "sit", "raw": "Psa_66:10; Pro_17:3, Pro_25:4; Isa_1:25, Isa_48:10; Jer_6:28-30; Eze_22:18-22; Dan_12:10; Zec_13:9; Luk_3:16; Eph_5:26, Eph_5:27; Tit_2:14; Heb_12:10; 1Pe_1:7, 1Pe_4:12, 1Pe_4:13; Rev_3:18", "note": "", "refs": [{"l": "Psa 66:10", "n": "", "vs": [[10, "فإنك قد اختبرتنا ياالله ، فنقيتنا كما تنقى الفضة."]]}, {"l": "Pro 17:3", "n": "", "vs": [[3, "كما تنقي البوتقة الفضة، والكور الذهب، فإن الرب يمتحن القلوب أيضا."]]}, {"l": "Pro 25:4", "n": "", "vs": [[4, "نق الفضة من شوائبها، فيخلص للصائغ ما يصنع منه إناء."]]}, {"l": "Isa 1:25", "n": "", "vs": [[25, "لأعاقبنك وأنقينك من غشك كما تنقى المعادن بالبورق، وأصفينك من قصديرك،"]]}, {"l": "Isa 48:10", "n": "", "vs": [[10, "نقيتك وليس كالفضة وامتحنتك في كور الألم."]]}, {"l": "Jer 6:28-30", "n": "", "vs": [[28, "فكلهم عصاة متمردون ساعون في النميمة. هم نحاس وحديد وكلهم فاسدون."], [29, "لشد ما تضرم ريح المنفاخ الشديدة النار فتلتهم الرصاص ولكن كما يتعذر تنقيته من الزغل كذلك يتعذر فصل الأشرار."], [30, "وهم يدعون حثالة الفضة المرذولة، لأن الرب قد رفضهم»."]]}, {"l": "Eze 22:18-22", "n": "", "vs": [[18, "«ياابن آدم، قد أصبح شعب إسرائيل لي نفاية. كلهم مثل النحاس والقصدير والحديد والرصاص في كور. صاروا حثالة فضة."], [19, "لأجل ذلك هذا ما يعلنه السيد الرب: لأنكم كلكم قد صرتم نفاية، فها أنا أجمعكم في وسط أورشليم،"], [20, "كما تجمع الفضة والنحاس والحديد والرصاص والقصدير في الكور، لتنفخ عليها نار لتسبك. كذلك أجمعكم في غضبي وسخطي وأطرحكم وأسبككم."], [21, "أجمعكم وأنفخ عليكم في نار غضبي فتسبكون فيها"], [22, "كما تسبك الفضة في بوتقة النار، هكذا تسبكون فيها، فتدركون أني أنا الرب قد سكبت سخطي عليكم»."]]}, {"l": "Dan 12:10", "n": "", "vs": [[10, "كثيرون يتطهرون ويتنقون ويمحصون بالتجارب، أما الأشرار فيرتكبون شرا ولا يفهمون. إنما ذوو الفطنة يدركون."]]}, {"l": "Zec 13:9", "n": "", "vs": [[9, "فأجيز هذا الثلث في النار لأنقيه تنقية الفضة، وأمحصه كما يمحص الذهب. هو يدعو باسمي وأنا أستجيبه. أنا أقول: هو شعبي، وهو يقول: الرب هو إلهي»."]]}, {"l": "Luk 3:16", "n": "", "vs": [[16, "أجاب يوحنا الجميع قائلا: «أنا أعمدكم بالماء، ولكن سيأتي من هو أقدر مني، من لا أستحق أن أحل رباط حذائه: هو سيعمدكم بالروح القدس، وبالنار."]]}, {"l": "Eph 5:26", "n": "", "vs": [[26, "لكي يقدسها مطهرا إياها بغسل الماء، بالكلمة،"]]}, {"l": "Eph 5:27", "n": "", "vs": [[27, "حتى يزفها إلى نفسه كنيسة بهية لا يشوبها عيب أو تجعد أو أية نقيصة مشابهة بل تكون مقدسة خالية من العيوب."]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Heb 12:10", "n": "", "vs": [[10, "وقد أدبنا آباؤنا فترة من الزمان، حسب ما رأوه مناسبا. أما الله ، فيؤدبنا دائما من أجل منفعتنا: لكي نشترك في قداسته."]]}, {"l": "1Pe 1:7", "n": "", "vs": [[7, "إلا أن غاية هذه التجارب هي اختبار حقيقة إيمانكم. فكما تختبر النار الذهب وتنقيه، تختبر التجارب حقيقة إيمانكم، وهو أثمن جدا من الذهب الفاني. وهكذا، يكون إيمانكم مدعاة مدح وإكرام وتمجيد لكم، عندما يعود يسوع المسيح ظاهرا بمجده."]]}, {"l": "1Pe 4:12", "n": "", "vs": [[12, "أيها الأحباء، لا تستغربوا نار الاضطهاد المشتعلة عندكم لاختباركم وكأن أمرا غريبا قد أصابكم!"]]}, {"l": "1Pe 4:13", "n": "", "vs": [[13, "وإنما افرحوا: لأنكم كما تشاركون المسيح في الآلام الآن، لابد أن تفرحوا بمشاركته في الابتهاج عند ظهور مجده."]]}, {"l": "Rev 3:18", "n": "", "vs": [[18, "نصيحتي لك أن تشتري مني ذهبا نقيا، صفته النار، فتغتني حقا، وثيابا بيضاء ترتديها فتستر عريك المعيب، وكحلا لشفاء عينيك فيعود إليك البصر."]]}], "kwAr": "فيجلس ممحصا", "noteAr": ""}, {"kw": "the sons", "raw": "Mal_1:6-10, Mal_2:1-8; Isa_61:6, Isa_66:19-21; Jer_33:18-22; Eze_44:15, Eze_44:16; Rev_1:6, Rev_5:10", "note": "", "refs": [{"l": "Mal 1:6-10", "n": "", "vs": [[6, "إن الابن يكرم أباه والعبد سيده. فإن كنت أنا حقا أبا فأين كرامتي؟ وإن كنت حقا سيدا فأين مهابتي؟ إن الرب القدير يقول لكم: أيها الكهنة المزدرون باسمي؛ فتسألون: كيف ازدرينا باسمك؟"], [7, "فيجيب: لأنكم تقربون على مذبحي خبزا نجسا. ثم تتساءلون: بم نجسناك؟ فيرد: بظنكم أن مائدة الرب مزدراة."], [8, "عندما تقربون الحيوان الأعمى ذبيحة، أليس ذلك شرا؟ أو حين تقدمون الحيوان الأعرج والمريض، أليس هذا شرا؟ قدموا مثل هذا القربان هدية لحاكمكم، أفيرضى عنكم ويكرمكم؟ يقول الرب القدير."], [9, "الآن التمسوا رضى الله ليرأف بنا، ولكن هل بمثل هذه القرابين المعتلة يرضى عنكم؟ يقول الرب القدير."], [10, "آه، ياليت بينكم من يغلق أبواب الهيكل لئلا توقدوا نارا باطلة على مذبحي، يقول الرب القدير: إذ لا مسرة لي بكم ولا أرضى بتقدمة من أيديكم."]]}, {"l": "Mal 2:1-8", "n": "", "vs": [[1, "«والآن هاكم هذه الوصية أيها الكهنة:"], [2, "إن أبيتم الاستماع، ولم تنووا في قلوبكم أن تمجدوا اسمي، أصب عليكم اللعنة، وألعن بركاتكم، بل ها أنا قد حولتها إلى لعنات لأنكم لم تجعلوها في قلوبكم."], [3, "ها أنا أعاقب أولادكم، وأنثر روث الحيوانات التي تقدمونها لي على وجوهكم، ثم يطرحونكم معها خارجا فوق القمامة الدنسة."], [4, "فتدركون أني أرسلت إليكم هذه التحذيرات لكي يظل عهدي مع أبناء لاوي قائما."], [5, "فقد كان عهدي مع لاوي ونسله عهد حياة وسلام، فوهبتهما لهم، ومنحتهم التقوى، فاتقوني ووقفوا خاشعين لاسمي يقول الرب القدير."], [6, "نطق فمه بشريعة الحق، ولم يكن في شفتيه إثم. وسلك معي سبيل السلام والاستقامة ورد كثيرين عن المعصية."], [7, "لأن شفتي الكاهن تحفظان العلم، ومن فمه يطلب الناس الشريعة، لأنه رسول الرب القدير."], [8, "ولكنكم انحرفتم عن الطريق المستقيم، وأعثرتم بتعاليمكم كثيرين، ونقضتم عهدي مع النسل الكهنوتي، يقول الرب القدير."]]}, {"l": "Isa 61:6", "n": "", "vs": [[6, "أما أنتم فتدعون كهنة الرب، ويسميكم الناس خدام إلهنا، فتأكلون ثروة الأمم وتتعظمون بغناهم."]]}, {"l": "Isa 66:19-21", "n": "", "vs": [[19, "وأجعل بينهم آية وأبعث بعض الناجين منهم إلى الأمم: إلى ترشيش، وفول، ولود، المهرة في رمي السهام، وإلى توبال وياوان وإلى الجزائر البعيدة ممن لم يسمعوا بشهرتي أو يروا مجدي، فيذيعون مجدي بين الأمم."], [20, "ويحضرون جميع إخوتكم من سائر الأمم، تقدمة للرب، على متون الجياد، وفي المركبات والهوادج، وعلى ظهور البغال وأسنمة الجمال، إلى أورشليم جبل قدسي، كما يحضر الإسرائيليون تقدمة الحنطة في آنية طاهرة إلى بيت الرب"], [21, "ومنهم أصطفي كهنة ولاويين يقول الرب."]]}, {"l": "Jer 33:18-22", "n": "", "vs": [[18, "ولن ينقرض من أمامي رجل من الكهنة واللاويين يصعد محرقة، ويقدم تقدمة حنطة، ويقرب ذبيحة مدى الدهر»."], [19, "ثم أوحى الرب إلى إرميا بهذه النبوءة:"], [20, "«هذا ما يقوله الرب: إن استطعتم أن تنقضوا عهدي مع النهار، ومع الليل، بحيث لا يحل النهار والليل في أوانهما،"], [21, "يمكن أن تنقضوا عهدي مع عبدي داود، فلا يكون من ذريته ابن يملك على عرشه، ومع الكهنة واللاويين خدامي."], [22, "وأكثر ذرية داود عبدي وذر اري اللاويين خدامي، وأجعلها في كثرة نجوم السماء التي لا تحصى، وكرمل البحر الذي لا يعد»."]]}, {"l": "Eze 44:15", "n": "", "vs": [[15, "أما الكهنة اللاويون من نسل صادوق الذين واظبوا بحرص على حراسة مقدسي حين ضل عني بنو إسرائيل فهؤلاء فقط يتقدمون لخدمتي ويمثلون في حضرتي ليقربوا لي الشحم والدم يقول السيد الرب."]]}, {"l": "Eze 44:16", "n": "", "vs": [[16, "هم وحدهم يدخلون مقدسي ويتقدمون إلى مائدتي لخدمتي وللمحافظة على شعائري."]]}, {"l": "Rev 1:6", "n": "", "vs": [[6, "وجعل منا مملكة، وكهنة لله أبيه، له المجد والسلطان إلى أبد الآبدين. آمين!"]]}, {"l": "Rev 5:10", "n": "", "vs": [[10, "وجعلتهم مملكة لإلهنا وكهنة له، وسيملكون على الأرض»."]]}], "kwAr": "أبناء لاوي", "noteAr": ""}, {"kw": "an", "raw": "Mal_1:11; Psa_4:5, Psa_50:14, Psa_50:23, Psa_69:30,Psa_69:31, Psa_107:21, Psa_107:22, Psa_116:17, Psa_141:1, Psa_141:2; Hos_14:2; Joh_4:23, Joh_4:24; Rom_12:1, Rom_15:16; Phi_2:17, Phi_4:18; 2Ti_4:6; Heb_13:15, Heb_13:16; 1Pe_2:5, 1Pe_2:9", "note": "", "refs": [{"l": "Mal 1:11", "n": "", "vs": [[11, "لأنه من مشرق الشمس إلى مغربها اسمي عظيم بين الأمم، وفي كل مكان يحرق لاسمي بخور وذبائح طاهرة، لأن اسمي عظيم بين الأمم، يقول الرب القدير."]]}, {"l": "Psa 4:5", "n": "", "vs": [[5, "قدموا ذبائح البر، واتكلوا على الرب."]]}, {"l": "Psa 50:14", "n": "", "vs": [[14, "قدم لله ذبائح الحمد وأوف العلي عهودك."]]}, {"l": "Psa 50:23", "n": "", "vs": [[23, "أما من يقدم لي ذبيحة حمد فهو يمجدني، ومن يقوم طريقه أريه خلاص الله»."]]}, {"l": "Psa 69:30", "n": "", "vs": [[30, "أسبح اسم الله بنشيد وأعظمه بحمد."]]}, {"l": "Psa 69:31", "n": "", "vs": [[31, "فيطيب ذلك لدى الرب أكثر من محرقة: ثور أو عجل."]]}, {"l": "Psa 107:21", "n": "", "vs": [[21, "فليرفعوا الشكر للرب على رحمته، وعلى عجائبه لبني آدم."]]}, {"l": "Psa 107:22", "n": "", "vs": [[22, "وليقربوا له ذبائح الشكر، ويحدثوا بأعماله بترانيم الفرح."]]}, {"l": "Psa 116:17", "n": "", "vs": [[17, "لك أقدم ذبائح الشكر، وأدعو باسمك."]]}, {"l": "Psa 141:1", "n": "", "vs": [[1, "يارب إليك دعوت، فأسرع لإغاثتي. أصغ إلى صوتي عندما أصرخ إليك."]]}, {"l": "Psa 141:2", "n": "", "vs": [[2, "لتكن صلاتي أمامك كالبخور، ورفع يدي مثل تقدمة المساء."]]}, {"l": "Hos 14:2", "n": "", "vs": [[2, "احملوا معكم كلام ابتهال وارجعوا إلى الرب قائلين له: «انزع إثمنا، وتقبلنا بفائق رحمتك، فنزجي إليك حمد شفاهنا كالقرابين."]]}, {"l": "Joh 4:23", "n": "", "vs": [[23, "فستأتي ساعة، لا بل هي الآن، حين يعبد العابدون الصادقون الآب بالروح وبالحق. لأن الآب يبتغي مثل هؤلاء العابدين."]]}, {"l": "Joh 4:24", "n": "", "vs": [[24, "الله روح، فلذلك لابد لعابديه من أن يعبدوه بالروح وبالحق»."]]}, {"l": "Rom 12:1", "n": "", "vs": [[1, "لذلك أتوسل إليكم أيها الإخوة، نظرا لمراحم الله، أن تقدموا له أجسادكم ذبيحة مقدسة مقبولة عنده، وهي عبادتكم بعقل."]]}, {"l": "Rom 15:16", "n": "", "vs": [[16, "وبذلك أكون خادم المسيح يسوع، المرسل إلى الأمم، حاملا إنجيل الله وكأني أقوم بخدمة كهنوتية، بقصد أن ترفع لله من بين الأمم تقدمة تكون مقبولة ومقدسة بالروح القدس."]]}, {"l": "Phi 2:17", "n": "", "vs": [[17, "حتى لو سفك دم
