"l": "Amo 2:7", "n": "", "vs": [[7, "الذين يسحقون رأس المسكين في التراب، ويجورون على البائسين، ويعاشر الرجل وابنه امرأة واحدة، فيتدنس بذلك اسمي المقدس."]]}, {"l": "Rom 2:24", "n": "", "vs": [[24, "فإن «اسم الله يجدف عليه بين الأمم بسببكم»، كما هو مكتوب."]]}], "kwAr": "فقد دنستموه", "noteAr": ""}, {"kw": "The table", "raw": "Mal_1:7, Mal_1:13; Num_11:4-8; Dan_5:3, Dan_5:4", "note": "", "refs": [{"l": "Mal 1:7", "n": "", "vs": [[7, "فيجيب: لأنكم تقربون على مذبحي خبزا نجسا. ثم تتساءلون: بم نجسناك؟ فيرد: بظنكم أن مائدة الرب مزدراة."]]}, {"l": "Mal 1:13", "n": "", "vs": [[13, "ثم قلتم: ما هذه المشقة التي نتكبدها؟ وتأففتم علي، يقول الرب القدير. وتقربون إلي ما استوليتم عليه ظلما وما هو أعرج أو مريض، فيكون هذا تقدمة قربانكم فهل أقبل هذا من أيديكم؟ يقول الرب."]]}, {"l": "Num 11:4-8", "n": "", "vs": [[4, "واشتهى أخلاط الأمم المقيمين بين بني إسرائيل، ممن خرجوا معهم من مصر، طعام مصر، فعاد بنو إسرائيل يبكون قائلين: «من يطعمنا لحما؟"], [5, "لقد تذكرنا سمك مصر الذي كنا نأكله مجانا، والقثاء والبطيخ والكرات والبصل والثوم،"], [6, "أما الآن فقد فقدنا شهيتنا وهزلنا، وليس أمام أعيننا سوى هذا المن»."], [7, "وكان المن في حجم بذور الكزبرة، وشكله مماثلا للمقل."], [8, "وكان الشعب يطوفون ليجمعوه ثم يطحنونه بالرحى أو يدقونه في الهاون ويطبخونه في القدور أو يخبزونه على حجارة محماة. وكان طعمه كطعم قطائف بزيت."]]}, {"l": "Dan 5:3", "n": "", "vs": [[3, "فأحضروها وشرب بها الملك ونبلاء مملكته وزوجاته ومحظياته"]]}, {"l": "Dan 5:4", "n": "", "vs": [[4, "وأخذوا يسبحون آلهة الذهب والفضة والنحاس والحديد والخشب والحجر."]]}], "kwAr": "مائدة الرب", "noteAr": ""}], "arS": [["أما ", []], ["أنتم", ["H859"]], [" فقد ", []], ["دنستموه", ["H2490"]], ["، إذ ", []], ["قلتم", ["H559"]], [" إن ", []], ["مائدة", ["H7979"]], [" ", []], ["الرب", ["H136"]], [" ", []], ["نجسة", ["H1351"]], ["، وإن ", []], ["طعامها", ["H400"]], [" ", []], ["فاسد", ["H5108"]], [" ", []], ["ومزدرى", ["H959"]], [".", []]]}, {"c": 1, "v": 13, "text": "ثم قلتم: ما هذه المشقة التي نتكبدها؟ وتأففتم علي، يقول الرب القدير. وتقربون إلي ما استوليتم عليه ظلما وما هو أعرج أو مريض، فيكون هذا تقدمة قربانكم فهل أقبل هذا من أيديكم؟ يقول الرب.", "groups": [{"kw": "Behold", "raw": "1Sa_2:29; Isa_43:22; Amo_8:5; Mic_6:3; Mar_14:4, Mar_14:5, Mar_14:37, Mar_14:38", "note": "", "refs": [{"l": "1Sa 2:29", "n": "", "vs": [[29, "فلماذا تحتقرون ذبيحتي وتقدمتي التي أمرت بها للمسكن، وتفضل ابنيك عني لتكدسوا الشحم على أبدانكم، مما تخيرتموه من قرابين شعبي؟"]]}, {"l": "Isa 43:22", "n": "", "vs": [[22, "ولكنك لم تلتمسني يايعقوب، بل سئمت مني ياإسرائيل."]]}, {"l": "Amo 8:5", "n": "", "vs": [[5, "قائلين: «متى ينقضي أول الشهر حتى نبيع الحنطة؟ متى يمضي السبت لنعرض القمح في السوق، فنعمد إلى تصغير حجم مكيال الإيفة ونرفع الأسعار، ونستعمل ميزانا مغشوشا."]]}, {"l": "Mic 6:3", "n": "", "vs": [[3, "بماذا أسأت إليك ياشعبي وبما ضايقتك؟ أجبني."]]}, {"l": "Mar 14:4", "n": "", "vs": [[4, "فاستاء بعضهم في أنفسهم وقالوا: «لماذا هذا التبذير للعطر؟"]]}, {"l": "Mar 14:5", "n": "", "vs": [[5, "فقد كان يمكن أن يباع هذا العطر بأكثر من ثلاث مئة دينار، ويوهب الثمن للفقراء». وأخذوا يؤنبون المرأة."]]}, {"l": "Mar 14:37", "n": "", "vs": [[37, "ثم رجع فوجد تلاميذه نائمين، فقال لبطرس: «هل أنت نائم ياسمعان؟ ألم تقدر أن تسهر ساعة واحدة؟"]]}, {"l": "Mar 14:38", "n": "", "vs": [[38, "اسهروا وصلوا لئلا تدخلوا في تجربة. إن الروح نشيط، وأما الجسد فضعيف»."]]}], "kwAr": "ما هذه المشقة", "noteAr": ""}, {"kw": "and ye have snuffed at it", "raw": "or, whereas ye might have blown it away", "note": "or, whereas ye might have blown it away", "refs": [], "kwAr": "وتأففتم", "noteAr": "أو: «بينما كان بوسعكم أن تنفخوا عليه»."}, {"kw": "torn", "raw": "Mal_1:7, Mal_1:8; Lev_22:8, Lev_22:19-23; Deu_15:21; Eze_4:14, Eze_44:31", "note": "", "refs": [{"l": "Mal 1:7", "n": "", "vs": [[7, "فيجيب: لأنكم تقربون على مذبحي خبزا نجسا. ثم تتساءلون: بم نجسناك؟ فيرد: بظنكم أن مائدة الرب مزدراة."]]}, {"l": "Mal 1:8", "n": "", "vs": [[8, "عندما تقربون الحيوان الأعمى ذبيحة، أليس ذلك شرا؟ أو حين تقدمون الحيوان الأعرج والمريض، أليس هذا شرا؟ قدموا مثل هذا القربان هدية لحاكمكم، أفيرضى عنكم ويكرمكم؟ يقول الرب القدير."]]}, {"l": "Lev 22:8", "n": "", "vs": [[8, "لا يأكل من جيفة حيوان أو فريسة فيتنجس بها. فأنا الرب."]]}, {"l": "Lev 22:19-23", "n": "", "vs": [[19, "تكون محرقة للرضى عنكم، ثورا أو كبشا أو تيسا سليما."], [20, "لا تقربوا تقدمة فيها عيب، لأنها لن تكون مقبولة للرضى عنكم."], [21, "وإذا أصعد أحدكم ذبيحة سلام للرب، وفاء لنذر، أو ذبيحة طوعية، فلتكن من البقر أو الغنم، سليمة خالية من كل عيب ليرضى الرب عنكم."], [22, "لا تقربوا للرب من الذبائح ما هو أعمى أو مكسور أو مجروح أو به بثور أو أجرب أو أكلف، ولا تجعلوا منها وقودا على المذبح للرب."], [23, "أما الثور أو الحمل الذي فيه عضو زائد أو ناقص، فلك أن تقربه تقدمة طوعية، ولكن ليس وفاء لنذر، فإنه يكون مرفوضا."]]}, {"l": "Deu 15:21", "n": "", "vs": [[21, "ولكن إن كان في البكر عيب من عرج أو عمى أو أي عيب، فلا تذبحه للرب إلهك،"]]}, {"l": "Eze 4:14", "n": "", "vs": [[14, "ولكني قلت: «آه، أيها السيد الرب، أنا لم أنجس نفسي أبدا فمنذ حداثتي حتى الآن لم آكل ميتة أو فريسة، ولم يدخل فمي لحم نجس»."]]}, {"l": "Eze 44:31", "n": "", "vs": [[31, "ولا يأكلن الكاهن من أية ميتة أو فريسة، طيرا كانت أو بهيمة."]]}], "kwAr": "ما استوليتم عليه ظلما", "noteAr": ""}, {"kw": "should I accept", "raw": "Mal_2:13; Isa_1:12, Isa_57:6; Jer_7:9-11, Jer_7:21-24; Amo_5:21-23; Zec_7:5, Zec_7:6; Mat_6:1, Mat_6:2, Mat_6:5, Mat_6:16", "note": "", "refs": [{"l": "Mal 2:13", "n": "", "vs": [[13, "وهذا أيضا ما ارتكبتم: لقد أغرقتم مذبح الرب بالدموع، فأنتم تبكون وتنوحون لأنه لم يعد يعير تقدماتكم انتباها أو يقبلها منكم بمسرة."]]}, {"l": "Isa 1:12", "n": "", "vs": [[12, "حين جئتم لتمثلوا أمامي، من طلب منكم أن تدوسوا دوري؟"]]}, {"l": "Isa 57:6", "n": "", "vs": [[6, "إن نصيبكم هو أصنامكم من حصى الوادي الملساء. هي قرعتكم، ولها سكبتم سكيب تقدماتكم، وأصعدتم قرابينكم، فهل أرضى عن هذه الأمور؟"]]}, {"l": "Jer 7:9-11", "n": "", "vs": [[9, "أتسرقون وتقتلون وتزنون وتحلفون زورا وتبخرون للبعل، وتضلون وراء الأوثان التي لم تعرفوها،"], [10, "ثم تمثلون في حضرتي في هذا الهيكل الذي دعي باسمي قائلين: «قد نجونا»؛ ثم ترتكبون جميع هذه الرجاسات؟"], [11, "هل أصبح هذا الهيكل الذي دعي باسمي، مغارة لصوص في أعينكم؟ ها أنا قد رأيت كل هذا الشر، يقول الرب."]]}, {"l": "Jer 7:21-24", "n": "", "vs": [[21, "وهذا ما يعلنه الرب القدير إله إسرائيل: «أضيفوا محرقاتكم إلى ذبائحكم وكلوا لحمها."], [22, "فإني لم أكلم آباءكم ولم آمرهم يوم أخرجتهم من مصر بشأن محرقة أو ذبيحة"], [23, "إنما أوصيتهم أن يطيعوا صوتي فأكون لهم إلها، ويكونون لي شعبا وأن يسلكوا في كل الطريق الذي أوصيتهم به، فينالوا خيرا."], [24, "إلا أنهم لم يطيعوا ولم يسمعوا، بل سلكوا بمقتضى مشورات قلوبهم الشريرة وعنادهم، وأداروا لي ظهورهم بدل وجوههم."]]}, {"l": "Amo 5:21-23", "n": "", "vs": [[21, "إني أمقت أعيادكم وأحتقرها، ولا أسر باحتفالاتكم."], [22, "ومع أنكم تقربون لي ذبائح محرقاتكم وتقدماتكم من الدقيق، فإني لا أقبلها ولا ألتفت إلى ذبائح السلام من مسمنات مواشيكم."], [23, "أبعدوا عني جلبة أغانيكم لأني لن أصغي إلى نغمات رباباتكم."]]}, {"l": "Zec 7:5", "n": "", "vs": [[5, "قل لجميع شعب الأرض والكهنة: «حين كنتم تصومون وتنوحون في الشهر الخامس والشهر السابع (أي تشرين ; الأول أكتوبر) في غضون سنوات المنفى السبعين، هل كان صيامكم حقا لي؟"]]}, {"l": "Zec 7:6", "n": "", "vs": [[6, "وحين تأكلون وتشربون، ألم يكن ذلك لإشباع نهمكم وإرواء أنفسكم؟"]]}, {"l": "Mat 6:1", "n": "", "vs": [[1, "احذروا من أن تعملوا بركم أمام الناس بقصد أن ينظروا إليكم. وإلا، فليس لكم مكافأة عند أبيكم الذي في السماوات."]]}, {"l": "Mat 6:2", "n": "", "vs": [[2, "فإذا تصدقت على أحد، فلا تنفخ أمامك في البوق، كما يفعل المراؤون في المجامع والشوارع، ليمدحهم الناس. الحق أقول لكم: إنهم قد نالوا مكافأتهم."]]}, {"l": "Mat 6:5", "n": "", "vs": [[5, "وعندما تصلون، لا تكونوا مثل المرائين الذين يحبون أن يصلوا واقفين في المجامع وفي زوايا الشوارع ليراهم الناس. الحق أقول لكم: إنهم قد نالوا مكافأتهم."]]}, {"l": "Mat 6:16", "n": "", "vs": [[16, "وعندما تصومون، لا تكونوا عابسي الوجوه، كما يفعل المراؤون الذين يقطبون وجوههم لكي يظهروا للناس صائمين. الحق أقول لكم إنهم قد نالوا مكافأتهم."]]}], "kwAr": "فهل أقبل", "noteAr": ""}], "arS": [["ثم ", []], ["قلتم", ["H559"]], [": ما هذه ", []], ["المشقة", ["H4972"]], [" التي نتكبدها؟ ", []], ["وتأففتم", ["H5301"]], [" علي، ", []], ["يقول", ["H559"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["القدير", ["H6635"]], [". ", []], ["وتقربون", ["H935"]], [" إلي ما ", []], ["استوليتم", ["H1497"]], [" عليه ظلما وما هو ", []], ["أعرج", ["H6455"]], [" أو ", []], ["مريض", ["H2470"]], ["، فيكون هذا ", []], ["تقدمة", ["H4503"]], [" قربانكم فهل ", []], ["أقبل", ["H7521"]], [" هذا من ", []], ["أيديكم", ["H3027"]], ["؟ ", []], ["يقول", ["H559"]], [" ", []], ["الرب", ["H3068"]], [".", []]]}, {"c": 1, "v": 14, "text": "ملعون المنافق الذي ينذر للرب ذكرا سليما من قطيعه، ثم يقرب للرب ما هو مصاب بعيب، لأني ملك عظيم واسمي مهوب بين الأمم، يقول الرب القدير».", "groups": [{"kw": "cursed", "raw": "Mal_3:9; Gen_27:12; Jos_7:11, Jos_7:12; Jer_48:10; Mat_24:51; Luk_12:1, Luk_12:2, Luk_12:46; Act_5:1-10; Rev_21:8", "note": "", "refs": [{"l": "Mal 3:9", "n": "", "vs": [[9, "أنتم، بل الأمة كلها، تحت اللعنة لأنكم سلبتموني."]]}, {"l": "Gen 27:12", "n": "", "vs": [[12, "وقد يجسني أبي فيتبين خداعي، وأستجلب على نفسي لعنة لا بركة»."]]}, {"l": "Jos 7:11", "n": "", "vs": [[11, "لقد ارتكب إسرائيل خطيئة، بل تعدوا على عهدي الذي أمرتهم به، بل أخذوا مما حرمته عليهم وسرقوا وأنكروا، بل خبأوا في أمتعتهم."]]}, {"l": "Jos 7:12", "n": "", "vs": [[12, "لهذا عجز بنو إسرائيل عن الثبات أمام أعدائهم، فولوا أمامهم الأدبار، لأنهم هالكون إذ لن أعود أكون معكم ما لم تستأصلوا الحرام من وسطكم،"]]}, {"l": "Jer 48:10", "n": "", "vs": [[10, "ملعون من يقوم بعمل الرب متهاونا، وملعون من حظر على سيفه الدم."]]}, {"l": "Mat 24:51", "n": "", "vs": [[51, "فيفصله ويجعل نصيبه مع المرائين، هناك يكون البكاء وصرير الأسنان!"]]}, {"l": "Luk 12:1", "n": "", "vs": [[1, "وفي تلك الأثناء، إذ احتشد عشرات الألوف من الشعب حتى داس بعضهم بعضا، أخذ يقول لتلاميذه أولا: «احذروا لأنفسكم من خمير الفريسيين الذي هو الريا ء!"]]}, {"l": "Luk 12:2", "n": "", "vs": [[2, "فما من مستور لن يكشف، ولا من سر لن يعرف."]]}, {"l": "Luk 12:46", "n": "", "vs": [[46, "فإن سيد ذلك العبد يرجع في يوم لا يتوقعه وساعة لا يعرفها، فيمزقه ويجعل مصيره مع الخائنين."]]}, {"l": "Act 5:1-10", "n": "", "vs": [[1, "ولكن رجلا اسمه حنانيا، اتفق مع زوجته سفيرة فباع حقلا كان يملكه،"], [2, "واحتفظ لنفسه بجزء من الثمن بعلم من زوجته، وجاء بما تبقى ووضعه عند أقدام الرسل."], [3, "فقال له بطرس: «ياحنانيا، لماذا سمحت للشيطان أن يملأ قلبك، فكذبت على الروح القدس، واحتفظت لنفسك بجزء من ثمن الحقل؟"], [4, "أما كان بقي لك لو لم تبعه؟ وبعد بيعه أما كان لك حق الاحتفاظ بثمنه؟ لماذا قصدت في قلبك أن تغش؟ إنك لم تكذب على الناس، بل على الله!»"], [5, "فما إن سمع حنانيا هذا الكلام حتى سقط أرضا ومات! فاستولت الرهبة الشديدة على جميع الذين عرفوا ذلك."], [6, "وقام بعض الشبان وكفنوا حنانيا، وحملوه إلى حيث دفنوه."], [7, "وبعد نحو ثلاث ساعات حضرت زوجة حنانيا وهي لا تدري بما حدث،"], [8, "فسألها بطرس: «قولي لي: أبهذا المبلغ بعتما الحقل؟» فأجابت: «نعم، بهذا المبلغ»."], [9, "فقال لها بطرس: «لماذا اتفقت مع زوجك على امتحان روح الرب؟ ها قد وصل الشبان الذين دفنوا زوجك إلى الباب، وسيحملونك أيضا!»"], [10, "فوقعت حالا عند قدمي بطرس وماتت! ولما دخل الشبان وجدوها ميتة، فحملوا جثتها ودفنوها إلى جوار زوجها."]]}, {"l": "Rev 21:8", "n": "", "vs": [[8, "أما الجبناء وغير المؤمنين، والفاسدون والقاتلون والزناة، والمتصلون بالشياطين وعبدة الأصنام وجميع الدجالين، فمصيرهم إلى البحيرة المتقدة بالنار والكبريت، الذي هو الموت الثاني»."]]}], "kwAr": "ملعون المنافق", "noteAr": ""}, {"kw": "which hath in his flock", "raw": "or, in whose flock is, Ecc_5:4, Ecc_5:5; Mar_12:41-44, Mar_14:8; 2Co_8:12", "note": "or, in whose flock is, Ecc_5:4, Ecc_5:5; Mar_12:41-44, Mar_14:8; 2Co_8:12", "refs": [{"l": "Ecc 5:4", "n": "", "vs": [[4, "عندما تنذر نذرا لله لا تماطل في الوفاء به، لأنه لا يرضى عن الجهال، لذلك أوف نذورك،"]]}, {"l": "Ecc 5:5", "n": "", "vs": [[5, "لأنه خير أن لا تنذر من أن تنذر ولا تفي."]]}, {"l": "Mar 12:41-44", "n": "", "vs": [[41, "وإذ جلس يسوع مقابل صندوق الهيكل، رأى كيف كان الجمع يلقون النقود في الصندوق. وألقى كثيرون من الأغنياء مالا كثيرا."], [42, "ثم جاءت أرملة فقيرة وألقت فلسين يساويان ربعا واحدا."], [43, "فدعا تلاميذه وقال لهم: «الحق أقول لكم: إن هذه الأرملة الفقيرة قد ألقت أكثر من جميع الذين ألقوا في الصندوق:"], [44, "لأن جميعهم ألقوا من الفاضل عن حاجتهم، ولكنها هي ألقت من حاجتها كل ما عندها ألقت معيشتها كلها ! »"]]}, {"l": "Mar 14:8", "n": "", "vs": [[8, "إنها عملت ما تقدر عليه. فقد سبقت فعطرت جسدي إعدادا للدفن."]]}, {"l": "2Co 8:12", "n": "", "vs": [[12, "فمتى وجد الاستعداد، يقبل العطاء على قدر ما يملك الإنسان، لا على قدر ما لا يملك."]]}], "kwAr": "ذكرا سليما من قطيعه", "noteAr": "أو: «الذي في قطيعه». انظر جا 5: 4، 5؛ مر 12: 41-44؛ 14: 8؛ 2كو 8: 12"}, {"kw": "for", "raw": "Mal_1:8, Mal_1:11; Deu_28:58; Psa_47:2, Psa_48:2, Psa_95:3; Isa_57:15; Jer_10:10; Dan_4:37; Zec_14:9; Mat_5:35; 1Ti_6:15", "note": "", "refs": [{"l": "Mal 1:8", "n": "", "vs": [[8, "عندما تقربون الحيوان الأعمى ذبيحة، أليس ذلك شرا؟ أو حين تقدمون الحيوان الأعرج والمريض، أليس هذا شرا؟ قدموا مثل هذا القربان هدية لحاكمكم، أفيرضى عنكم ويكرمكم؟ يقول الرب القدير."]]}, {"l": "Mal 1:11", "n": "", "vs": [[11, "لأنه من مشرق الشمس إلى مغربها اسمي عظيم بين الأمم، وفي كل مكان يحرق لاسمي بخور وذبائح طاهرة، لأن اسمي عظيم بين الأمم، يقول الرب القدير."]]}, {"l": "Deu 28:58", "n": "", "vs": [[58, "فإن لم تحرصوا على العمل بجميع كلمات هذه الشريعة المكتوبة في هذا الكتاب، لتهابوا اسم الرب إلهكم الجليل المرهوب،"]]}, {"l": "Psa 47:2", "n": "", "vs": [[2, "لأن الرب علي مخوف، ملك عظيم على كل الأرض."]]}, {"l": "Psa 48:2", "n": "", "vs": [[2, "جبل صهيون جميل في شموخه، (هو) فرح كل الأرض حتى أقاصي الشمال. هو مدينة الملك العظيم."]]}, {"l": "Psa 95:3", "n": "", "vs": [[3, "لأن الرب إله عظيم، وملك كبير على جميع الآلهة."]]}, {"l": "Isa 57:15", "n": "", "vs": [[15, "لأنه هكذا يقول العلي السامي، المقيم في الأبد، الذي يدعى اسمه القدوس: إنني أسكن في العلى وفي الموضع المقدس، وأقيم مع المنسحق، وذوي الروح المتواضعة، لأحيي أرواح المتواضعين، وأنعش قلوب المنسحقين."]]}, {"l": "Jer 10:10", "n": "", "vs": [[10, "أما الرب فهو الإله الحق، الإله الحي والملك السرمدي. ترتعد الأرض أمام غضبه ولا تتحمل الأمم فرط سخطه."]]}, {"l": "Dan 4:37", "n": "", "vs": [[37, "فالآن، أنا نبوخذناصر، أسبح وأمجد وأحمد ملك السماء الذي جميع أعماله حق، وطرقه عادلة وقادر على إذلال كل من يسلك بالكبرياء."]]}, {"l": "Zec 14:9", "n": "", "vs": [[9, "ويملك الرب على الأرض كلها، فيكون في ذلك اليوم رب واحد لا يذكر سوى اسمه."]]}, {"l": "Mat 5:35", "n": "", "vs": [[35, "ولا بالأرض لأنها موطيء قدميه، ولا بأورشليم لأنها مدينة الملك الأعظم."]]}, {"l": "1Ti 6:15", "n": "", "vs": [[15, "هذا الظهور سوف يتممه الله في وقته الخاص، هو السيد المبارك الأوحد، ملك الملوك ورب الأرباب،"]]}], "kwAr": "لأني ملك عظيم", "noteAr": ""}, {"kw": "my name", "raw": "Psa_68:35, Psa_76:12; Dan_9:4; Heb_12:29; Rev_15:4", "note": "", "refs": [{"l": "Psa 68:35", "n": "", "vs": [[35, "أنت مرهب ياالله من مقادسك. إله إسرائيل نفسه هو الذي يمد شعبه قوة وشدة. تبارك الله ."]]}, {"l": "Psa 76:12", "n": "", "vs": [[12, "فهو يستأصل أرواح رؤساء الأرض، ويرهب ملوكها العظماء."]]}, {"l": "Dan 9:4", "n": "", "vs": [[4, "وصليت إلى الرب إلهي واعترفت قائلا: «أيها الرب الإله العظيم المهوب، حافظ العهد والرحمة لمحبيه وعاملي وصاياه."]]}, {"l": "Heb 12:29", "n": "", "vs": [[29, "متذكرين أن «إلهنا نار آكلة!»"]]}, {"l": "Rev 15:4", "n": "", "vs": [[4, "من لا يخافك يارب ولا يمجد اسمك؟ فأنت وحدك قدوس! والأمم جميعا سيأتون ويسجدون لك، لأن أحكامك قد ظهرت جلية»."]]}], "kwAr": "واسمي مهوب", "noteAr": ""}], "arS": [["ملعون", ["H779"]], [" ", []], ["المنافق", ["H5230"]], [" الذي ", []], ["ينذر", ["H5087"]], [" ", []], ["للرب", ["H136"]], [" ", []], ["ذكرا", ["H2145"]], [" سليما من ", []], ["قطيعه", ["H5739"]], ["، ثم ", []], ["يقرب", ["H2076"]], [" ", []], ["للرب", ["H136"]], [" ما هو ", []], ["مصاب", ["H7843"]], [" بعيب، لأني ", []], ["ملك", ["H4428"]], [" ", []], ["عظيم", ["H1419"]], [" ", []], ["واسمي", ["H8034"]], [" ", []], ["مهوب", ["H3372"]], [" بين ", []], ["الأمم", ["H1471"]], ["، ", []], ["يقول", ["H559"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["القدير", ["H6635"]], ["».", []]]}, {"c": 2, "v": 1, "text": "«والآن هاكم هذه الوصية أيها الكهنة:", "groups": [{"kw": "", "raw": "Mal_1:6; Jer_13:13; Lam_4:13; Hos_5:1", "note": "", "refs": [{"l": "Mal 1:6", "n": "", "vs": [[6, "إن الابن يكرم أباه والعبد سيده. فإن كنت أنا حقا أبا فأين كرامتي؟ وإن كنت حقا سيدا فأين مهابتي؟ إن الرب القدير يقول لكم: أيها الكهنة المزدرون باسمي؛ فتسألون: كيف ازدرينا باسمك؟"]]}, {"l": "Jer 13:13", "n": "", "vs": [[13, "فتقول لهم، «هذا ما يعلنه الرب: ها أنا أملأ بالسكر جميع سكان هذه الأرض والملوك من ذرية داود الجالسين على عرشه، والكهنة، والأنبياء وكل أهل أورشليم."]]}, {"l": "Lam 4:13", "n": "", "vs": [[13, "عقابا لها على خطايا أنبيائها وآثام كهنتها، الذين سفكوا في وسطها دم الصديقين."]]}, {"l": "Hos 5:1", "n": "", "vs": [[1, "اسمعوا هذا أيها الكهنة وأنصتوا ياشعب إسرائيل، وأصغوا ياأهل بيت الملك، لأن القضاء حال بكم إذ كنتم فخا في المصفاة وشبكة منصوبة على جبل تابور."]]}], "kwAr": "", "noteAr": ""}], "arS": [["«", []], ["والآن", ["H6258"]], [" هاكم هذه ", []], ["الوصية", ["H4687"]], [" أيها ", []], ["الكهنة", ["H3548"]], [":", []]]}, {"c": 2, "v": 2, "text": "إن أبيتم الاستماع، ولم تنووا في قلوبكم أن تمجدوا اسمي، أصب عليكم اللعنة، وألعن بركاتكم، بل ها أنا قد حولتها إلى لعنات لأنكم لم تجعلوها في قلوبكم.", "groups": [{"kw": "ye will not hear", "raw": "Lev. 26:14-46; Deut. 28:15-68, Deu_30:17, Deu_30:18; Psa_81:11, Psa_81:12; Isa_30:8-13; Jer_6:16-20, Jer_13:17, Jer_25:4-9, Jer_34:17; Eze_3:7; Zec_1:3-6, Zec_7:11-14", "note": "", "refs": [{"l": "Lev 26:14-46", "n": "", "vs": [[14, "ولكن إن عصيتموني ولم تعملوا بكل هذه الوصايا،"], [15, "وإن تنكرتم لفرائضي وكرهتم أحكامي ولم تعملوا بكل وصاياي، بل نكثتم ميثاقي،"], [16, "فإني أبتليكم بالرعب المفاجيء وداء السل والحمى التي تفني العينين وتتلف النفس، وتزرعون على غير طائل، وينهب أعداؤكم زرعكم."], [17, "وأنقلب عليكم فتنهزمون أمام أعدائكم، ويتحكم بكم مبغضوكم وتهربون من غير طارد لكم."], [18, "وإن أمعنتم في عصيانكم أزيد من عقابكم سبع مرات وفقا لخطاياكم."], [19, "أذل غطرستكم، وأجعل سماءكم كالحديد لا تمطر وأرضكم كالنحاس لا تغل"], [20, "فيذهب جهدكم باطلا لأن أرضكم لن تعطي غلتها، وأشجار الأرض لن تعطي أثمارها."], [21, "وإن واظبتم على عصيانكم وأبيتم طاعتي، أضاعف عقابي لكم سبع مرات وفقا لخطاياكم."], [22, "وأطلق عليكم وحوش الصحراء فتفترس أولادكم وتهلك بهائمكم، وتنقص من عددكم، فتقفر طرقاتكم."], [23, "وإن لم تتعظوا، وتماديتم في عصيانكم،"], [24, "أنقلب عليكم وأزيد في بلائكم سبع مرات وفقا لخطاياكم."], [25, "أسلط عليكم سيف العدو. فينتقم منكم لنقضكم ميثاقي، فتلوذون بمدنكم حيث أرسل عليكم الوباء وتسلمون إلى يد العدو"], [26, "وحين أقطع عنكم مؤونة الدقيق، تخبز عشر نساء خبزكم في فرن واحد لقلة الدقيق، وتقسمون الخبز بالميزان فتأكلون ولا تشبعون."], [27, "وإن لم يجد هذا العقاب في تأديبكم، فتماديتم في عصيانكم،"], [28, "فإني أزيد في احتدام غضبي، من عدائي لكم وأضاعف عقابي سبع مرات أخرى وفقا لخطاياكم،"], [29, "فتأكلون لحم أبنائكم وبناتكم."], [30, "وأدك مذابح مرتفعاتكم، وأحطم أنصاب شموسكم وأكوم جثثكم فوق بقايا أصنامكم، وتنبذكم نفسي."], [31, "وأحول مدنكم إلى خرائب، وأجعل مقادسكم موحشة، ولا أبتهج برائحة تقدمات سروركم،"], [32, "وأجعل الأرض قفرا فيرتاع من وحشتها أعداؤكم الساكنون فيها"], [33, "وأشتتكم بين الشعوب، وأجرد عليكم سيفي، وألاحقكم، وأحول أرضكم إلى قفر ومدنكم إلى خرائب."], [34, "عندئذ تستوفي الأرض راحة سبوتها طوال سني وحشتها وأنتم مشتتون في ديار أعدائكم. حينئذ ترتاح الأرض وتستوفي سني سبوتها."], [35, "فتعوض في أيام وحشتها عن راحتها التي لم تنعم بها في سنوات سبوتكم عندما كنتم تقيمون عليها."], [36, "أما الباقون منكم في أرض أعدائكم، فإني ألقي الرعب في قلوبهم فيهربون من حفيف ورقة تسوقها الريح، وكأنهم يهربون من السيف، ويسقطون وليس ثمة من طارد لهم."], [37, "ويعثر بعضهم ببعض كمن يفر من أمام سيف من غير طارد لهم، ولا تثبتون أمام أعدائكم"], [38, "فتهلكون بين الشعوب، وتبتلعكم أرض أعدائكم."], [39, "أما بقيتكم فتفنى بذنوبها وذنوب آبائها في أرض أعدائكم كما فني آباؤهم من قبلهم."], [40, "ولكن إن اعترفوا بخطاياهم وخطايا آبائهم وبخيانتهم لي وعداوتهم،"], [41, "التي جعلتني أنقلب عليهم وأنفيهم إلى أرض أعدائهم، وإن خضعت قلوبهم النجسة بعد أن استوفوا عقاب خطاياهم،"], [42, "فإني أذكر ميثاقي مع يعقوب، وميثاقي مع إسحق، وميثاقي مع إبراهيم، وأذكر الأرض،"], [43, "التي أقفرت منهم، فاستوفت راحة سبوتها في أثناء نفيهم عنها، ويكونون آنئذ قد استوفوا عقاب خطاياهم لأنهم تنكروا لشرائعي وكرهوا فرائضي."], [44, "ولكن على الرغم من ذلك فإنني لم أنبذهم وهم في أرض أعدائهم، ولا كرهتهم حتى أبيدهم وأنقض ميثاقي معهم، لأني أنا الرب إلههم،"], [45, "بل أذكر ميثاقي مع آبائهم الأولين الذين أخرجتهم من ديار مصر على مشهد من الشعوب لأكون لهم إلها. أنا الرب»."], [46, "هذه هي الفرائض والأحكام والشرائع التي أقامها الرب بينه وبين بني إسرائيل في جبل سيناء على لسان موسى."]]}, {"l": "Deu 28:15-68", "n": "", "vs": [[15, "ولكن إن عصيتم صوت الرب إلهكم ولم تحرصوا على العمل بجميع وصاياه وفرائضه التي أنا آمركم اليوم بها، فإن جميع هذه اللعنات تحل بكم وتلازمكم."], [16, "تكونون ملعونين في المدينة وملعونين في الحقول."], [17, "وتكون سلالكم ومعاجنكم ملعونة."], [18, "وتحل اللعنة بأبنائكم وغلات أرضكم ونتاج بقركم ونعاجكم،"], [19, "وتكونون ملعونين في ذهابكم وإيابكم،"], [20, "ويصب الرب عليكم اللعنة والفوضى والفشل في كل ما تنتجه أيديكم، حتى تهلكوا وتفنوا سريعا لسوء أفعالكم، إذ تركتموني."], [21, "ويتفشى بينكم الوباء حتى يبيدكم عن الأرض التي أنتم ماضون إليها لامتلاكها،"], [22, "ويضربكم الرب بالسل والحمى والرعشة والالتهاب والجفاف واللفح والذبول، فتلازمكم حتى تفنوا."], [23, "وتصبح السماء التي فوقكم كالنحاس والأرض تحتكم كالحديد."], [24, "ويحول الرب مطر أرضكم إلى غبار وعواصف ترابية تنهمر عليكم من السماء حتى تهلكوا."], [25, "ويهزمكم الرب أمام أعدائكم فتقبلون عليهم في طريق واحدة وتولون الأدبار أمامهم متفرقين في سبع طرق، وتصبحون عبرة لجميع ممالك الأرض."], [26, "وتكون جثثكم طعاما لجميع طيور السماء ووحوش الأرض ولا يطردها أحد."], [27, "ويصيبكم الرب بداء قرحة مصر وبالبواسير والجرب والحكة، ولا تجدون لها علاجا."], [28, "ويبتليكم الرب بالجنون والعمى وارتباك الفكر،"], [29, "فتتحسسون طرقكم في الظهر كما يتحسس الأعمى طريقه في الظلام، وتبوء طرقكم بالإخفاق، ولا تكونون إلا مظلومين مغصوبين كل الأيام، وليس من منقذ."], [30, "يخطب أحدكم امرأة ولكن آخر يتزوجها ويضاجعها. تبني بيتا ولا تسكن فيه، وتغرس كرما ولا تجنيه."], [31, "يذبح ثورك أمام عينيك ولا تأكل منه، ويغتصب حمارك على مرأى منك ولا يرد إليك، ويستولي أعداؤك على ماشيتك وليس من منقذ."], [32, "يساق أولادك وبناتك إلى أمة أخرى وعيناك تراقبانهم طوال النهار، حتى تكلا، وما في يدك حيلة."], [33, "محصول أرضك وثمر تعبك يأكله شعب غريب عنك، ولا تكون سوى مظلوم مسحوق دائما."], [34, "ويصيبك الجنون من هول ما ترى."], [35, "ويبتليك الرب بقروح خبيثة تغطي الركبتين والساقين، حتى لا تجد لها شفاء من قمة الرأس إلى أخمص القدم."], [36, "ينفيكم الرب أنتم وملككم الذي تختارونه إلى أمة لا تعرفونها أنتم ولا آباؤكم، حيث تعبدون هناك آلهة أخرى من خشب وحجر،"], [37, "وتصبحون مثار دهشة وسخرية وعبرة في نظر جميع الشعوب التي ينفيكم الرب إليهم"], [38, "تبذرون كثيرا من البذار في الحقول، ولا تحصدون إلا القليل، لأن الجراد يلتهمه."], [39, "تكدحون في غرس كروم ومن خمرها لا تشربون، ومن ثمرها لا تجنون، لأن الدود ينخرها."], [40, "تكتظ أراضيكم بأشجار الزيتون، ولكن من زيتها لا تدهنون، لأن زيتونكم ينتثر على الأرض قبل نضجه."], [41, "تنجبون بنين وبنات ولا يكونون لكم، لأنهم يسبون."], [42, "تلتهم أسراب الجراد أشجاركم وغلات أرضكم."], [43, "يعظم شأن الغرباء المقيمين بينكم، ويتفاقم انحطاط شأنكم."], [44, "هم يقرضونكم وأنتم لا تقرضونهم، وهم يكونون رأسا وأنتم تكونون ذنبا،"], [45, "وتحل بكم هذه اللعنات وتلازمكم وتلاحقكم حتى تهلكوا، لأنكم لم تطيعوا صوت الرب إلهكم لتحفظوا وصاياه وفرائضه التي أمركم بها،"], [46, "فتكون فيكم وفي ذريتكم عبرة ونذيرا إلى الأبد."], [47, "ولأنكم لم تعبدوا الرب إلهكم بفرح وغبطة في زمن الازدهار والوفرة،"], [48, "فإنكم تصبحون عبيدا لأعدائكم الذين يرسلهم الرب عليكم في أحوال الجوع والعطش والعري والفاقة، ويضع نير حديد على أعناقكم حتى يهلككم."], [49, "ويجلب الرب عليكم من بعيد، من أقصى الأرض، أمة لا تفهمون لغتها، فتنقض عليكم كالنسر."], [50, "أمة يثير منظرها الرعب، لا تهاب الشيخ ولا ترأف بالطفل،"], [51, "فتستولي على نتاج بهائمكم، وتلتهم غلات أرضكم حتى تفنوا، ولا تبقي لكم قمحا ولا خمرا ولا زيتا ولا نتاج بقركم ونعاجكم حتى تهلككم."], [52, "وتحاصركم في جميع مدنكم حتى تتهدم أسواركم الشامخة الحصينة التي وثقتم بمناعتها في كل مدنكم. فتحاصركم في جميع مدنكم في كل أرضكم التي يهبها الرب إلهكم لكم."], [53, "فتأكلون في أثناء الحصار والضيقة التي يضايقكم بها عدوكم ثمار بطونكم، لحم أبنائكم وبناتكم الذين رزقكم بهم الرب إلهكم."], [54, "فيقسو قلب أكثركم رقة ورأفة على أخيه وامرأته التي في حضنه وسائر أبنائه الأحياء."], [55, "فلا يعطي أحدهم من لحم أبنائه، الذي يأكله، لأنه لم يبق لديه شيء سواه في الحصار والضيقة التي يضايقكم بها عدوكم في جميع مدنكم."], [56, "وكذلك فإن أكثر النساء رقة ورأفة، والتي لنعومتها وترفهها لا تجرؤ على لمس الأرض بباطن قدمها، تبخل على زوجها رجل حضنها وعلى ابنها وابنتها"], [57, "بمشيمتها الساقطة منها، وبأولادها الذين تلدهم، لأنها تنوي أن تأكلهم سرا في أثناء الحصار، في الضيقة التي يضايقكم بها عدوكم في كل مدنكم."], [58, "فإن لم تحرصوا على العمل بجميع كلمات هذه الشريعة المكتوبة في هذا الكتاب، لتهابوا اسم الرب إلهكم الجليل المرهوب،"], [59, "فإن الرب يجعل الضربات النازلة بكم وبذريتكم ضربات مخيفة وكوارث رهيبة دائمة وأمراضا خبيثة مزمنة،"], [60, "ويرسل عليكم كل أمراض مصر التي فزعتم منها فتلازمكم،"], [61, "ويسلط الرب عليكم أيضا كل داء وكل بلية لم ترد في كتاب الشريعة هذا، حتى تهلكوا."], [62, "فتصيرون قلة بعد أن كنتم في كثرة نجوم السماء، لأنكم لم تسمعوا صوت الرب إلهكم."], [63, "وكما سر الرب بكم فأحسن إليكم وكثركم، فإنه سيسر بأن يفنيكم ويهلككم فتنقرضون من الأرض التي أنتم ماضون إليها لامتلاكها."], [64, "ويشتتكم الرب بين جميع الأمم من أقصى الأرض إلى أقصاها، فتعبدون هناك آلهة أخرى من خشب أو حجر لم تعرفوها أنتم ولا آباؤكم،"], [65, "ولا تجدون بين تلك الأمم اطمئنانا ولا مقرا لقدم، بل يعطيكم الرب قلبا هلعا، وعيونا أوهنها الترقب، ونفوسا يائسة."], [66, "وتعيشون حياة مفعمة دائما بالتوتر، مليئة بالرعب ليلا ونهارا."], [67, "وتقولون في الصباح: يا ليته المساء، وفي المساء: يا ليته الصباح، من فرط ارتعاب قلوبكم وما تشهده عيونكم من هول."], [68, "ويردكم الرب إلى ديار مصر في سفن في طريق وعدكم ألا تعودوا ترونها، فتباعون هناك لأعدائكم عبيدا وإماء، وليس من يشتري»."]]}, {"l": "Deu 30:17", "n": "", "vs": [[17, "ولكن إن تحولت قلوبكم ولم تطيعوا، بل غويتم وسجدتم لآلهة أخرى وعبدتموها"]]}, {"l": "Deu 30:18", "n": "", "vs": [[18, "فإني أنذركم اليوم أنكم لا محالة هالكون. لا تطيل الأيام على الأرض التي أنت عابر الأردن لتدخلها وتمتلكها."]]}, {"l": "Psa 81:11", "n": "", "vs": [[11, "غير أن شعبي لم يسمع لي، وإسرائيل لم يرض بي."]]}, {"l": "Psa 81:12", "n": "", "vs": [[12, "لذلك أسلمتهم إلى عناد قلوبهم. وسلكوا وفقا لمشورات أنفسهم."]]}, {"l": "Isa 30:8-13", "n": "", "vs": [[8, "والآن، امض ودون ذلك على لوح، وسجله في كتاب ليكون شاهدا أبديا في الأيام الآتية."], [9, "لأن إسرائيل شعب متمرد، أبناء كذبة، يأبون الاستماع إلى شريعة الرب،"], [10, "ويقولون للأنبياء: «لا تتنبأوا لنا بما هو حق، بل كلمونا بالكلام المداهن وتنبأوا بالمخادعات."], [11, "اعدلوا عن الطريق، حيدوا عن السبيل، وكفوا عن مجابهتنا بكلام قدوس إسرائيل»."], [12, "لذلك هكذا يقول قدوس إسرائيل: «لأنكم ازدريتم بهذه الكلمة واتكلتم على الجور والانحراف واعتمدتم عليهما،"], [13, "لذلك يصبح هذا الذنب لكم كصدع ناتيء في سور عال مشرف على الانهيار الذي يحدث بغتة وفى لحظة"]]}, {"l": "Jer 6:16-20", "n": "", "vs": [[16, "وهذا ما يعلنه الرب: «قفوا في الطرقات وانظروا، واسألوا عن المسالك الصالحة القديمة واطرقوها، فتجدوا راحة لنفوسكم. ولكنكم قلتم: لن نسير فيها."], [17, "فأقمت عليكم رقباء قائلا: اسمعوا دوي البوق. ولكنكم قلتم: «لن نسمع!»"], [18, "لذلك اسمعوا أيها الأمم، واعلمي أيتها الجماعة ماذا يحل بهم."], [19, "اسمعي أيتها الأرض وانظري، لأني جالب شرا على هذا الشعب عقابا لهم على أفكارهم الأثيمة، لأنهم لم يطيعوا كلماتي وتنكروا لشريعتي."], [20, "لأي غرض يصعد إلي البخور من شبا، وقصب الذريرة من أرض نائية؟ محرقاتكم مرفوضة، وتقدماتكم لا تسرني»."]]}, {"l": "Jer 13:17", "n": "", "vs": [[17, "وإن لم تنصتوا فإن نفسي تبكي في الخفاء من أجل كبريائكم، وتذرف عيناي الدموع المريرة، فتسيل العبرات لأن الرب قد سبى شعبه."]]}, {"l": "Jer 25:4-9", "n": "", "vs": [[4, "ومع أن الرب قد واظب على إرسال عبيده الأنبياء إليكم، فإنكم لم تصغوا ولم تستمعوا لإنذاراته."], [5, "وقد قالوا لكم: توبوا الآن. ليرجع كل واحد منكم عن طرقه الشريرة وممارساته الأثيمة فتقيموا في الأرض التي وهبها لكم الرب على مدى الدهور،"], [6, "ولا تضلوا وراء آلهة أخرى لتعبدوها وتسجدوا لها، ولا تثيروا غيظي بما تصنعه أيديكم من أوثان. عندئذ لا أنزل بكم أذى."], [7, "غير أنكم لم تسمعوا لي، بل أثرتم غيظي بما جنته أيديكم، فاستجلبتم على أنفسكم الشر»."], [8, "لذلك هكذا يقول الرب القدير: «لأنكم عصيتم كلامي،"], [9, "فها أنا أجند جميع قبائل الشمال بقيادة نبوخذناصر عبدي، وآتي بها إلى هذه الأرض فيجتاحونها ويهلكون جميع سكانها مع سائر الأمم المحيطة بها، وأجعلهم مثار دهشة وصفير، وخرائب أبدية."]]}, {"l": "Jer 34:17", "n": "", "vs": [[17, "لذلك يقول الرب: «لأنكم لم تطيعوني ولم تنادوا بعتق إخوتكم، لذلك سأنادي أنا بعتقكم فأطلقكم لتسقطوا بحد السيف والوباء والجوع، وأجعلكم عرضة للرعب في جميع ممالك الأرض،"]]}, {"l": "Eze 3:7", "n": "", "vs": [[7, "لكن شعب إسرائيل لا يودون الاستماع لك، لأنهم لا يودون الاستماع لي، لأنهم جميعا معاندون قساة القلوب."]]}, {"l": "Zec 1:3-6", "n": "", "vs": [[3, "ولكن قل لهم، هذا ما يعلنه الرب القدير: ارجعوا إلي فأرجع إليكم، يقول الرب القدير."], [4, "ولا تكونوا كآبائكم الذين ناداهم الأنبياء السالفون قائلين: هكذا يقول الرب القدير، ارجعوا عن طرقكم الباطلة وأعمالكم الشريرة، ولكنهم لم يسمعوا ولم يصغوا إلي، يقول الرب."], [5, "أين هم آباؤكم؟ وهل يحيا الأنبياء إلى الأبد؟"], [6, "ولكن ألم تدرك أقوالي وفرائضي التي أمرت بها عبيدي الأنبياء آباءكم فتابوا قائلين: لقد نفذ الرب القدير ما عزم أن يعاقبنا بمقتضى ما ارتكبناه من أعمال باطلة؟»"]]}, {"l": "Zec 7:11-14", "n": "", "vs": [[11, "ولكنهم أبوا أن يصغوا، واعتصموا بعنادهم غير عابئين، وأصموا آذانهم لئلا يسمعوا."], [12, "وقسوا قلوبهم كالصوان لئلا يسمعوا الشريعة التي أرسلها الرب القدير بروحه على لسان أنبيائه السابقين. فانصب غضب عظيم من لدن الرب القدير."], [13, "وكما ناديت فلم يسمعوا فإني أنا أيضا لا أسمع، يقول الرب القدير."], [14, "فبددتهم بالزوبعة بين الأمم التي لم يعرفوها من قبل، فصارت الأرض التي نفوا منها خرابا لا يجتازها ذاهب أو راجع، وأضحت الأرض المبهجة قفرا»."]]}], "kwAr": "إن أبيتم الاستماع", "noteAr": ""}, {"kw": "if ye will not lay", "raw": "Isa_42:25, Isa_47:7, Isa_57:11", "note": "", "refs": [{"l": "Isa 42:25", "n": "", "vs": [[25, "لذلك صب عليهم جام غضبه في وطيس الحرب فاكتنفتهم بضرامها ولكنهم لم يفهموا، وأحرقتهم بنيرانها ولم يتعظوا."]]}, {"l": "Isa 47:7", "n": "", "vs": [[7, "وقلت: سأظل السيدة إلى الأبد. لذلك لم تفكري بهذه الأمور في نفسك ولا تأملت بما تؤول إليه."]]}, {"l": "Isa 57:11", "n": "", "vs": [[11, "ممن خفتم وارتعبتم حتى كذبتم ولم تذكروني أو تفكروا في؟ هل اعتصمت بالسكينة زمنا طويلا حتى لم تعودوا تخافونني؟"]]}], "kwAr": "ولم تنووا في قلوبكم", "noteAr": ""}, {"kw": "to give", "raw": "Jos_7:19; Jer_13:16; Luk_17:18; 1Pe_4:11; Rev_14:7, Rev_16:9", "note": "", "refs": [{"l": "Jos 7:19", "n": "", "vs": [[19, "فقال يشوع لعخان: «ياابني، مجد الرب إله إسرائيل واعترف له، وأخبرني الآن ماذا جنيت؟ لا تخف عني شيئا»."]]}, {"l": "Jer 13:16", "n": "", "vs": [[16, "مجدوا الرب إلهكم قبل أن يجعل الظلام يخيم عليكم، وقبل أن تتعثر أقدامكم على الجبال المعتمة. أنتم ترتقبون النور ولكنه يحوله إلى ظلام الموت ويجعله ليلا دامسا."]]}, {"l": "Luk 17:18", "n": "", "vs": [[18, "ألم يوجد من يعود ويقدم المجد لله سوى هذا الأجنبي؟»"]]}, {"l": "1Pe 4:11", "n": "", "vs": [[11, "فمن يتكلم، عليه أن يتكلم بما يوافق أقوال الله؛ ومن يخدم، عليه أن يخدم بموجب القوة التي يمنحها الله . وذلك لكي يتمجد الله في كل شيء، بيسوع المسيح، له المجد والسلطة إلى أبد الآبدين. آمين!"]]}, {"l": "Rev 14:7", "n": "", "vs": [[7, "وهو ينادي عاليا: «اتقوا الله ومجدوه، فقد حانت ساعة دينونته. اسجدوا لمن خلق السماء والأرض والبحر والينابيع»."]]}, {"l": "Rev 16:9", "n": "", "vs": [[9, "فاحترق الناس من الحر الشديد. ولكنهم لم يتوبوا ليمجدوا الله ، بل جدفوا على اسم الله صاحب السلطة على هذه البلايا."]]}], "kwAr": "أن تمجدوا اسمي", "noteAr": ""}, {"kw": "and I", "raw": "Deu_28:16-18, Deu_28:53-57; Psa_69:22, Psa_109:7-15; Hos_4:7-10, Hos_9:11-14; Hag_1:6, Hag_1:9, Hag_2:16, Hag_2:17; Luk_23:28-30", "note": "", "refs": [{"l": "Deu 28:16-18", "n": "", "vs": [[16, "تكونون ملعونين في المدينة وملعونين في الحقول."], [17, "وتكون سلالكم ومعاجنكم ملعونة."], [18, "وتحل اللعنة بأبنائكم وغلات أرضكم ونتاج بقركم ونعاجكم،"]]}, {"l": "Deu 28:53-57", "n": "", "vs": [[53, "فتأكلون في أثناء الحصار والضيقة التي يضايقكم بها عدوكم ثمار بطونكم، لحم أبنائكم وبناتكم الذين رزقكم بهم الرب إلهكم."], [54, "فيقسو قلب أكثركم رقة ورأفة على أخيه وامرأته التي في حضنه وسائر أبنائه الأحياء."], [55, "فلا يعطي أحدهم من لحم أبنائه، الذي يأكله، لأنه لم يبق لديه شيء سواه في الحصار والضيقة التي يضايقكم بها عدوكم في جميع مدنكم."], [56, "وكذلك فإن أكثر النساء رقة ورأفة، والتي لنعومتها وترفهها لا تجرؤ على لمس الأرض بباطن قدمها، تبخل على زوجها رجل حضنها وعلى ابنها وابنتها"], [57, "بمشيمتها الساقطة منها، وبأولادها الذين تلدهم، لأنها تنوي أن تأكلهم سرا في أثناء الحصار، في الضيقة التي يضايقكم بها عدوكم في كل مدنكم."]]}, {"l": "Psa 69:22", "n": "", "vs": [[22, "لتصر لهم مائدتهم فخا وعقبة وعقابا."]]}, {"l": "Psa 109:7-15", "n": "", "vs": [[7, "عند محاكمته ليثبت عليه ذنبه، ولتحسب له صلاته خطيئة."], [8, "لتقصر أيامه وليتول وظيفته آخر."], [9, "ليتيتم بنوه وتترمل زوجته."], [10, "ليتشرد بنوه ويستعطوا، وليلتمسوا قوتهم بعيدا عن خرائب سكناهم."], [11, "ليسترهن المداين كل ممتلكاته، ولينهب الغرباء ثمار تعبه."], [12, "لينقرض من يتراءف عليه، ولينقطع من يتحنن على أيتامه."], [13, "لينقرض نسله وليمح اسمهم من الجيل القادم."], [14, "ليذكر الرب إثم آبائه، ولا يغفر خطيئة أمه."], [15, "لتمثل خطاياهم أمام الرب دائما كي يستأصل من الأرض ذكرهم."]]}, {"l": "Hos 4:7-10", "n": "", "vs": [[7, "وبقدر ما تكاثروا تفاقمت خطيئتهم، لذلك أحول مجدهم إلى عار."], [8, "يأكلون من ذبائح خطيئة شعبي ويفرحون لتماديهم في الإثم ليكثر نصيبهم منها."], [9, "فيصبح الشعب كالكاهن. وأعاقبهم جميعا على سوء تصرفاتهم وأجزيهم على أعمالهم."], [10, "فيأكلون ولا يشبعون، ويزنون ولا يتكاثرون، لأنهم نبذوا الرب واستسلموا إلى العهارة."]]}, {"l": "Hos 9:11-14", "n": "", "vs": [[11, "إن مجد أفرايم يتوارى كالطائر المحلق إذ يموت أولادكم في أثناء الولادة أو في الأرحام، أو لا يحبل بهم أبدا."], [12, "وحتى إن أنجبوا أولادا فإني أحرمكم منهم حتى لا يبقى منهم أحد. ويل لكم حين أنصرف عنكم."], [13, "مصير أبناء أفرايم، كما أرى، هو الوقوع في قبضة الصياد، لأن أفرايم، يقتاد أبناءه للذبح."], [14, "أعطهم يارب: ولكن ماذا تعطيهم؟ أعطهم نساء ذوات أرحام مسقطة، وأثداء جافة."]]}, {"l": "Hag 1:6", "n": "", "vs": [[6, "لقد زرعتم كثيرا وحصدتم قليلا. أكلتم ولم تشبعوا. شربتم ولم ترتووا. اكتسيتم ولم تستدفئوا. ومن ينال أجرة سرعان ما تتبدد، وكأنها وضعت في صرة مثقوبة»."]]}, {"l": "Hag 1:9", "n": "", "vs": [[9, "لقد توقعتم كثيرا فحصلتم على قليل، وما أتيتم به إلى البيت من غلة نفخت عليه وبددته. لماذا فعلت هذا يقول الرب القدير؟ من أجل بيتي الذي ما برح مهدما بينما كل واحد منكم منهمك في بناء بيته."]]}, {"l": "Hag 2:16", "n": "", "vs": [[16, "عندما كان يقبل أحد على كومة حبوب ظنا منه أن الأرض قد غلت عشرين مكيالا، يجد أنها لم تغل سوى عشرة فقط. وحين يدنو من المعصرة ليغرف ملء خمسين وعاء، لا يجد إلا عشرين."]]}, {"l": "Hag 2:17", "n": "", "vs": [[17, "إني ابتليت تعب أيديكم بالقحط والذبول والبرد، ولكنكم لم ترجعوا تائبين إلي، يقول الرب."]]}, {"l": "Luk 23:28-30", "n": "", "vs": [[28, "فالتفت إليهن يسوع، وقال: «يابنات أورشليم، لا تبكين علي، بل ابكين على أنفسكن وعلى أولادكن!"], [29, "فها إن أياما ستأتي فيها يقول الناس: طوبى للعواقر اللواتي ما حملت بطونهن ولا أرضعت أثداؤهن!"], [30, "عندئذ يقولون للجبال: اسقطي علينا، وللتلال: غطينا!"]]}], "kwAr": "وألعن بركاتكم", "noteAr": ""}, {"kw": "I have cursed", "raw": "By sending them unfruitful seasons, Mal_3:9", "note": "By sending them unfruitful seasons, Mal_3:9", "refs": [{"l": "Mal 3:9", "n": "", "vs": [[9, "أنتم، بل الأمة كلها، تحت اللعنة لأنكم سلبتموني."]]}], "kwAr": "قد حولتها إلى لعنات", "noteAr": "بإرسال سنين عقيمة عليهم. انظر ملا 3: 9"}], "arS": [["إن ", []], ["أبيتم", ["H3808"]], [" ", []], ["الاستماع", ["H8085"]], ["، ولم ", []], ["تنووا", ["H7760"]], [" في ", []], ["قلوبكم", ["H3820"]], [" أن ", []], ["تمجدوا", ["H3519"]], [" ", []], ["اسمي", ["H8034"]], ["، ", []], ["أصب", ["H7971"]], [" عليكم ", []], ["اللعنة", ["H3994"]], ["، ", []], ["وألعن", ["H779"]], [" ", []], ["بركاتكم", ["H1293"]], ["، بل ها أنا قد حولتها إلى ", []], ["لعنات", ["H779"]], [" لأنكم لم ", []], ["تجعلوها", ["H7760"]], [" في ", []], ["قلوبكم", ["H3820"]], [".", []]]}, {"c": 2, "v": 3, "text": "ها أنا أعاقب أولادكم، وأنثر روث الحيوانات التي تقدمونها لي على وجوهكم، ثم يطرحونكم معها خارجا فوق القمامة الدنسة.", "groups": [{"kw": "I will", "raw": "Joe_1:17", "note": "", "refs": [{"l": "Joe 1:17", "n": "", "vs": [[17, "قد تعفنت الحبوب المزروعة في الأرض الجافة، وتهدمت المخازن وفرغت الأهراء من القمح، لأن الحبوب قد جفت."]]}], "kwAr": "ها أنا", "noteAr": ""}, {"kw": "corrupt", "raw": "or reprove", "note": "or reprove", "refs": [], "kwAr": "أعاقب", "noteAr": "أو: «أوبخ»."}, {"kw": "spread", "raw": "Heb. scatter, Mal_2:9; 1Sa_2:29, 1Sa_2:30; 1Ki_14:10; 2Ki_9:36, 2Ki_9:37; Job_20:7; Psa_83:10; Jer_8:2; Nah_3:6; Luk_14:35; 1Co_4:13", "note": "Heb. scatter, Mal_2:9; 1Sa_2:29, 1Sa_2:30; 1Ki_14:10; 2Ki_9:36, 2Ki_9:37; Job_20:7; Psa_83:10; Jer_8:2; Nah_3:6; Luk_14:35; 1Co_4:13", "refs": [{"l": "Mal 2:9", "n": "", "vs": [[9, "لذلك أحقركم وأذلكم أمام جميع الناس، لأنكم لم تطيعوا طرقي، وحابيتم في تطبيق شريعتي»."]]}, {"l": "1Sa 2:29", "n": "", "vs": [[29, "فلماذا تحتقرون ذبيحتي وتقدمتي التي أمرت بها للمسكن، وتفضل ابنيك عني لتكدسوا الشحم على أبدانكم، مما تخيرتموه من قرابين شعبي؟"]]}, {"l": "1Sa 2:30", "n": "", "vs": [[30, "لذلك يقول الرب إله إسرائيل: لقد وعدت أن يظل بيتك وبيت أبيك يخدمون في محضري إلى الأبد. أما الآن، يقول الرب: فحاشا لي أن أفعل ذلك، لأنني أكرم الذين يكرمونني، أما الذين يحتقرونني فيصغرون."]]}, {"l": "1Ki 14:10", "n": "", "vs": [[10, "لذلك ها أنا مزمع أن أبتلي بيتك بشر عظيم، وأبيد كل ذكر من نسلك، عبدا كان أم حرا، وأفني بيتك كما تفني النار الروث الجاف،"]]}, {"l": "2Ki 9:36", "n": "", "vs": [[36, "فرجعوا وأخبروه، فقال: «هذا إتمام لقضاء الرب الذي نطق به على لسان إيليا التشبي قائلا: إن الكلاب ستلتهم لحم إيزابل في حقل يزرعيل."]]}, {"l": "2Ki 9:37", "n": "", "vs": [[37, "وتصبح جثة إيزابل كالزبل على وجه حقل يزرعيل بحيث لا يتعرف عليها أحد فيقول: هذه إيزابل»."]]}, {"l": "Job 20:7", "n": "", "vs": [[7, "فإنه سيبيد كبرازه، فيتساءل الذين يعرفونه، مندهشين: أين هو؟"]]}, {"l": "Psa 83:10", "n": "", "vs": [[10, "بادوا في عين دور، وصاروا زبلا للأرض."]]}, {"l": "Jer 8:2", "n": "", "vs": [[2, "ويعرضونها أمام الشمس والقمر وكواكب السماء التي أحبوها وعبدوها وضلوا وراءها، واستشاروها وسجدوا لها، فلا تجمع ولا تدفن، بل تصير نفاية فوق وجه الأرض،"]]}, {"l": "Nah 3:6", "n": "", "vs": [[6, "وألوثك بالأوساخ وأحقرك وأجعلك عبرة."]]}, {"l": "Luk 14:35", "n": "", "vs": [[35, "إنه لا يصلح لا للتربة ولا للسماد، فيطرح خارجا. من له أذنان للسمع، فليسمع!»"]]}, {"l": "1Co 4:13", "n": "", "vs": [[13, "وللتجريح فنسالم. صرنا كأقذار العالم ونفاية الجميع، ومازلنا!"]]}], "kwAr": "وأنثر", "noteAr": "بالعبرية: «أبدد». انظر ملا 2: 9؛ 1 العهود الأولى. عندئذ تدعين مدينة العدل، المدينة الأمينة."], [27, "فتفدى صهيون بالحق، وتائبوها بالبر."], [28, "أما العصاة والخطاة فيتحطمون جميعا، ويبيد الذين تركوا الرب."]]}, {"l": "Isa 27:9", "n": "", "vs": [[9, "لهذا يكفر عن إثم يعقوب، ويكون هذا هو كل ثمر محو خطيئته، عندما يجعل جميع حجارة المذبح كحجارة الكلس المسحوقة، ولا يبقى تمثال لعشتاروث أو مذبح قائما."]]}, {"l": "Eze 20:38-41", "n": "", "vs": [[38, "وأعزل من بينكم المتمردين والعصاة علي، وأخرجهم من أرض غربتهم، ولكنهم لن يدخلوا أرض إسرائيل، فتدركون آنئذ أني أنا الرب."], [39, "أما أنتم ياشعب إسرائيل فامضوا وليعبد كل إنسان أصنامه، ولكن فيما بعد، ستستمعون حتما لي، ولن تدنسوا اسمي القدوس بعد بعطاياكم وأوثانكم."], [40, "لأنه في جبل قدسي، جبل إسرائيل الشامخ، هناك يعبدوني في الأرض شعب إسرائيل كلهم. هناك أرضى عنهم وألتمس تقدماتكم وباكورة غلاتكم مع جميع مقدساتكم."], [41, "وأرضى عنكم كرائحة سرور حين أخرجكم من بين الشعوب، وأجمعكم من البلدان التي تشتتم إليها، وأتجلى بقداستي بينكم على مشهد من الأمم."]]}, {"l": "Eze 44:9-16", "n": "", "vs": [[9, "لذلك لا يدخل مقدسي غريب غير مختون القلب واللحم من الغرباء المقيمين بين إسرائيل."], [10, "حتى اللاويون الذين ابتعدوا عني حين ضل إسرائيل وراء أصنامه يحملون عقاب إثمهم."], [11, "فيكونون خداما في الهيكل وكحراس لأبوابه وخدام له. هم يذبحون المحرقة والقربان للشعب ويخدمونهم،"], [12, "لأنهم قاموا على خدمة عبادة أصنامهم، وكانوا عثرة إثم لشعب إسرائيل، لذلك أقسمت يقول السيد الرب أن أحملهم عقاب إثمهم،"], [13, "فلا يقتربون مني ليكونوا لي كهنة، ولا يدنون من شيء من أقداسي ومن قدس الأقداس، بل يحملون عقاب خزيهم ورجاستهم التي ارتكبوها."], [14, "لكن أكلفهم بحراسة الهيكل، وبكل خدمة سواها من أعمال الصيانة."], [15, "أما الكهنة اللاويون من نسل صادوق الذين واظبوا بحرص على حراسة مقدسي حين ضل عني بنو إسرائيل فهؤلاء فقط يتقدمون لخدمتي ويمثلون في حضرتي ليقربوا لي الشحم والدم يقول السيد الرب."], [16, "هم وحدهم يدخلون مقدسي ويتقدمون إلى مائدتي لخدمتي وللمحافظة على شعائري."]]}, {"l": "Mat 3:12", "n": "", "vs": [[12, "فهو يحمل المذرى بيده، وسينقي بيدره تماما: فيجمع قمحه إلى المخزن، وأما التبن فيحرقه بنار لا تطفأ! »"]]}, {"l": "Joh 15:2", "n": "", "vs": [[2, "كل غصن في لا ينتج ثمرا يقطعه؛ وكل غصن ينتج ثمرا ينقيه لينتج مزيدا من الثمر."]]}], "kwAr": "لكي يظل عهدي", "noteAr": ""}], "arS": [["فتدركون", ["H3045"]], [" أني ", []], ["أرسلت", ["H7971"]], [" إليكم هذه ", []], ["التحذيرات", ["H4687"]], [" لكي ", []], ["يظل", ["H1961"]], [" ", []], ["عهدي", ["H1285"]], [" مع أبناء ", []], ["لاوي", ["H3878"]], [" قائما.", []]]}, {"c": 2, "v": 5, "text": "فقد كان عهدي مع لاوي ونسله عهد حياة وسلام، فوهبتهما لهم، ومنحتهم التقوى، فاتقوني ووقفوا خاشعين لاسمي يقول الرب القدير.", "groups": [{"kw": "covenant", "raw": "Num_3:45, Num_8:15, Num_16:9, Num_16:10, 18:8-24, Num_25:12, Num_25:13; Deu_33:8-10; Psa_106:30,Psa_106:31; Eze_34:25, Eze_37:26", "note": "", "refs": [{"l": "Num 3:45", "n": "", "vs": [[45, "«أفرز اللاويين بدل كل بكر في بني إسرائيل، وكذلك بهائم اللاويين بدل بهائمهم، فيكون اللاويون خاصتي. أنا الرب."]]}, {"l": "Num 8:15", "n": "", "vs": [[15, "ثم يقبل اللاويون على خدمة خيمة الاجتماع، فتطهرهم وتجعلهم تقدمة ترجيح،"]]}, {"l": "Num 16:9", "n": "", "vs": [[9, "ألم يكفكم أن إله إسرائيل قد أفرزكم من بين الشعب ليقربكم إليه لكي تخدموا مسكن الرب وتقفوا في حضرة الشعب كله لخدمته."]]}, {"l": "Num 16:10", "n": "", "vs": [[10, "فقربك مع بقية إخوتك من بني لاوي، حتى صرتم تطمعون في الكهنوت."]]}, {"l": "Num 18:8-24", "n": "", "vs": [[8, "وقال الرب لهرون: «ها أنا قد وليتك القيام بخدمة قرابيني. وكل التقدمات المقدسة التي يحضرها بنو إسرائيل لي، أمنحك إياها أنت وبنيك لتكون لكم نصيبا فريضة دائمة."], [9, "فيكون من نصيبكم قرابين قدس الأقداس، إلا ما تحرقونه منها على المذبح؛ فيكون لكم من تقدمات قدس الأقداس التي يحضرونها لي، سواء كانت تقدمات دقيق أم ذبائح خطاياهم أم ذبائح آثامهم. هذه تكون نصيبا لك ولأبنائك."], [10, "وعلى كل ذكر منكم أن يأكلها في مكان مقدس لأنها أصبحت مقدسة"], [11, "وأما ما ترجحه من عطايا بني إسرائيل فإنني أهبه لك ولأبنائك وبناتك فريضة دائمة، ولا يأكل منها من أهل بيتك إلا من كان طاهرا."], [12, "وأعطيك أيضا باكورة غلات أفضل زيت الزيتون والخمر والحنطة التي يقدمونها للرب،"], [13, "فتكون لك أبكار غلات أرضهم التي يقدمونها للرب، فيأكل منها كل طاهر من أهل بيتك."], [14, "كل ما هو منذور للرب في إسرائيل يكون لك."], [15, "وكذلك كل بكر فاتح رحم من الناس والبهائم يقدمونه للرب يكون لك، ما عدا بكر الإنسان وبكر البهيمة النجسة فإنك تقبل فداءهما."], [16, "وفداء الناس من ابن شهر، حسب تقويمك، خمسة شواقل (نحو ستين جراما) من الفضة وفقا للوزن المعتمد في القدس،"], [17, "لكن لا تقبل فداء بكر البقر أو الضأن أو المعز. إنه مفرز للرب. بل ترش دمه على المذبح، وتحرق شحمه وقودا رائحة رضى ومسرة للرب."], [18, "أما لحمه فيكون لك نصيبا كصدر الترجيح والساق اليمنى."], [19, "وهكذا أعطيك أنت وأبناءك وبناتك، حقا أبديا، جميع تقدمات الأقداس التي يقربها بنو إسرائيل للرب، فيكون هذا ميثاق ملح أبديا أمام الرب، لك ولنسلك أيضا»."], [20, "وقال الرب لهرون: «لا يكون لك ميراث في أرضهم ولا نصيب بينهم، لأنني أنا نصيبك وميراثك في وسط بني إسرائيل."], [21, "أما اللاويون فقد وهبتهم كل عشر في إسرائيل، لقاء عملهم الذي يقومون به في خدمة خيمة الاجتماع."], [22, "وعلى الإسرائيليين، منذ الآن، أن لا يقتربوا إلى خيمة الاجتماع، وإلا تحملوا نتائج خطيئتهم فيموتون."], [23, "فاللاويون وحدهم يقومون بخدمة خيمة الاجتماع، ويتحملون مسئولية خطئهم، فتكون هذه لكم فريضة دائمة جيلا بعد جيل. ولا يكون للاويين نصيب من الأملاك في وسط إسرائيل."], [24, "إن العشور التي يقدمها الإسرائيليون للرب قد وهبتها للاويين نصيبا، لهذا قلت لهم، لا يرثون نصيبا في وسط إسرائيل»."]]}, {"l": "Num 25:12", "n": "", "vs": [[12, "لذلك قل له: هأنذا أقطع معه ميثاق سلام،"]]}, {"l": "Num 25:13", "n": "", "vs": [[13, "فيكون له ولنسله من بعده ميثاق كهنوت أبدي، لأنه غار لله وكفر عن الإسرائيليين»."]]}, {"l": "Deu 33:8-10", "n": "", "vs": [[8, "وقال عن سبط لاوي: «لقد أعطيت يارب تميمك وأوريمك لرجلك الذي جربته وامتحنته في مسة، وخاصمته عند ماء مريبة."], [9, "الذي قال عن والديه: لم أرهما، وبإخوته لم يعترف، وأنكر أبناءه، بل أطاعوا وصاياك وصانوا عهدك."], [10, "هم يعلمون يعقوب أحكامك وبني إسرائيل شريعتك، يحرقون بخورا أمام أنفك وقرابين على مذبحك"]]}, {"l": "Psa 106:30", "n": "", "vs": [[30, "فوقف فينحاس وأجرى القضاء، فامتنع الوبأ."]]}, {"l": "Psa 106:31", "n": "", "vs": [[31, "فحسب له ذلك برا جيلا فجيلا إلى الأبد."]]}, {"l": "Eze 34:25", "n": "", "vs": [[25, "وأبرم معهم ميثاق سلام، وأقضي على الوحوش الضارية في الأرض فيقيمون في الصحراء آمنين، وينامون في الغابات مطمئنين."]]}, {"l": "Eze 37:26", "n": "", "vs": [[26, "وأبرم معهم ميثاق سلام، فيكون معهم عهدا أبديا، وأوطنهم وأكثرهم وأقيم مقدسي في وسطهم إلى الأبد."]]}], "kwAr": "عهدي مع لاوي", "noteAr": ""}, {"kw": "I gave", "raw": "Exo_32:26-29; Deu_33:8-11", "note": "", "refs": [{"l": "Exo 32:26-29", "n": "", "vs": [[26, "وقف في باب المخيم وصاح: «كل من يتبع الرب فليقبل إلي هنا». فاجتمع حوله اللاويون."], [27, "فهتف بهم: «هذا ما يعلنه الرب إله بني إسرائيل: ليتقلد كل واحد سيفه، وجولوا في المخيم ذهابا وإيابا من مدخل إلى مدخل، واقتلوا كل داعر سواء أكان أخا أم صاحبا أم قريبا»."], [28, "فأطاع اللاويون أمر موسى. فقتل من الشعب في ذلك اليوم نحو ثلاثة آلاف رجل."], [29, "عندئذ قال موسى للاويين: «لقد كرستم اليوم أنفسكم لخدمة الرب، وقد كلف ذلك كل واحد منكم قتل ابنه أو أخيه، ولكن لينعم عليكم الرب في هذا اليوم ببركة»."]]}, {"l": "Deu 33:8-11", "n": "", "vs": [[8, "وقال عن سبط لاوي: «لقد أعطيت يارب تميمك وأوريمك لرجلك الذي جربته وامتحنته في مسة، وخاصمته عند ماء مريبة."], [9, "الذي قال عن والديه: لم أرهما، وبإخوته لم يعترف، وأنكر أبناءه، بل أطاعوا وصاياك وصانوا عهدك."], [10, "هم يعلمون يعقوب أحكامك وبني إسرائيل شريعتك، يحرقون بخورا أمام أنفك وقرابين على مذبحك"], [11, "بارك يارب مهاراتهم واغتبط بعمل أيديهم. حطم متون مقاوميهم ومبغضيهم فلا تقوم لهم قائمة»."]]}], "kwAr": "فوهبتهما", "noteAr": ""}], "arS": [["فقد كان ", []], ["عهدي", ["H1285"]], [" مع ", []], ["لاوي", ["H3878"]], [" ونسله عهد ", []], ["حياة", ["H2416"]], [" ", []], ["وسلام", ["H7965"]], ["، ", []], ["فوهبتهما", ["H5414"]], [" لهم، ومنحتهم ", []], ["التقوى", ["H4172"]], ["، ", []], ["فاتقوني", ["H3372"]], [" ووقفوا ", []], ["خاشعين", ["H2865"]], [" ", []], ["لاسمي", ["H8034"]], [" يقول الرب القدير.", []]]}, {"c": 2, "v": 6, "text": "نطق فمه بشريعة الحق، ولم يكن في شفتيه إثم. وسلك معي سبيل السلام والاستقامة ورد كثيرين عن المعصية.", "groups": [{"kw": "law", "raw" ""}, {"kw": "he walked", "raw": "Gen_5:21-24, Gen_6:9, Gen_17:1; Luk_1:6", "note": "", "refs": [{"l": "Gen 5:21-24", "n": "", "vs": [[21, "وكان عمر أخنوخ خمسا وستين سنة عندما أنجب متوشالح."], [22, "ثم عاش أخنوخ بعد ذلك ثلاث مئة سنة سار فيها مع الله. وولد له بنون وبنات."], [23, "وكانت كل أيام أخنوخ ثلاث مئة وخمسا وستين سنة."], [24, "وسار أخنوخ مع الله، ثم توارى من الوجود، لأن الله نقله إليه."]]}, {"l": "Gen 6:9", "n": "", "vs": [[9, "وهذا سجل مواليد نوح: كان نوح صالحا كاملا في زمانه، وسار نوح مع الله."]]}, {"l": "Gen 17:1", "n": "", "vs": [[1, "وعندما كان أبرام في التاسعة والتسعين من عمره، ظهر له الرب قائلا: «أنا هو الله القدير. سر أمامي وكن كاملا،"]]}, {"l": "Luk 1:6", "n": "", "vs": [[6, "وكان كلاهما بارين أمام الله، يسلكان وفقا لوصايا الرب وأحكامه كلها بغير لوم."]]}], "kwAr": "وسلك معي", "noteAr": ""}, {"kw": "and did", "raw": "Jer_23:22; Dan_12:3; Luk_1:16, Luk_1:17; Act_26:18; 1Th_1:9, 1Th_1:10; Jam_5:19, Jam_5:20", "note": "", "refs": [{"l": "Jer 23:22", "n": "", "vs": [[22, "لو مثلوا حقا في مجلسي لبلغوا كلامي لشعبي، ولكانوا ردوهم عن مساوئهم وعن شر أعمالهم."]]}, {"l": "Dan 12:3", "n": "", "vs": [[3, "ويضيء الحكماء (أي شعب الله) كضياء الجلد، وكذلك الذين ردوا كثيرين إلى البر يشعون كالكواكب إلى مدى الدهر."]]}, {"l": "Luk 1:16", "n": "", "vs": [[16, "ويرد كثيرين من بني إسرائيل إلى الرب إلههم،"]]}, {"l": "Luk 1:17", "n": "", "vs": [[17, "فيتقدم أمامه وله روح إيليا وقدرته، ليرد قلوب الآباء إلى الأولاد، والعصاة إلى حكمة الأبرار، ليهييء للرب شعبا معدا!»"]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "1Th 1:9", "n": "", "vs": [[9, "فإن أولئك المؤمنين أنفسهم يخبرون عنا كيف كان قدومنا إليكم أول مرة، وكيف تحولتم إلى الله عن الأصنام، لتصيروا عبيدا يخدمون الله الحي الحق،"]]}, {"l": "1Th 1:10", "n": "", "vs": [[10, "وتنتظروا من السماوات ابنه الذي أقامه من بين الأموات، يسوع مخلصنا من الغضب الآتي."]]}, {"l": "Jam 5:19", "n": "", "vs": [[19, "أيها الإخوة، إن ضل أحد بينكم عن الحق، ورده آخر،"]]}, {"l": "Jam 5:20", "n": "", "vs": [[20, "فليتأكد أن الذي يرد خاطئا عن ضلال مسلكه، فإنما ينقذ نفسا من الموت، ويستر خطايا كثيرة!"]]}], "kwAr": "ورد كثيرين", "noteAr": ""}], "arS": [["نطق ", []], ["فمه", ["H6310"]], [" ", []], ["بشريعة", ["H8451"]], [" ", []], ["الحق", ["H571"]], ["، ولم يكن في ", []], ["شفتيه", ["H8193"]], [" ", []], ["إثم", ["H5766"]], [". ", []], ["وسلك", ["H1980"]], [" معي سبيل ", []], ["السلام", ["H7965"]], [" ", []], ["والاستقامة", ["H4334"]], [" ", []], ["ورد", ["H7725"]], [" ", []], ["كثيرين", ["H7227"]], [" عن ", []], ["المعصية", ["H5771"]], [".", []]]}, {"c": 2, "v": 7, "text": "لأن شفتي الكاهن تحفظان العلم، ومن فمه يطلب الناس الشريعة، لأنه رسول الرب القدير.", "groups": [{"kw": "the priests", "raw": "Lev_10:11; Deu_17:8-11, Deu_21:5, Deu_24:8; 2Ch_17:8, 2Ch_17:9, 2Ch_30:22; Ezr_7:10; Neh_8:2-8; Jer_15:19, Jer_18:18; Hag_2:11-13; 2Ti_2:24, 2Ti_2:25", "note": "", "refs": [{"l": "Lev 10:11", "n": "", "vs": [[11, "ولتعلموا شعب إسرائيل جميع الفرائض التي أمرت بها على لسان موسى»."]]}, {"l": "Deu 17:8-11", "n": "", "vs": [[8, "إذا تعذر عليكم إصدار حكم في قضية سفك دم أو دعوى حق أو اعتداء بالضرب، مما يجري من أمور الخصومات في مدنكم، فقوموا وامضوا إلى المكان الذي يختاره الرب إلهكم،"], [9, "واحضروا أمام الكهنة اللاويين والقاضي القائم في تلك الأيام، واسألوا، فيخبروكم بحكم القضاء."], [10, "فتنفذوا ما يصدرون من قرارات في الموضع الذي يختاره الرب. واحرصوا على العمل بمقتضى ما يعلمونكم"], [11, "واعملوا بموجب الشريعة التي يعلمونكم إياها، والقضاء الذي يصدرونه. ولا تحيدوا عما ينصون عليه من حكم لا يمينا ولا شمالا."]]}, {"l": "Deu 21:5", "n": "", "vs": [[5, "ثم يتقدم الكهنة بنو لاوي، لأن الرب إلهكم قد اختارهم لخدمته، ولإعلان البركة باسم الرب، وللقضاء في كل خصومة وكل ضربة."]]}, {"l": "Deu 24:8", "n": "", "vs": [[8, "احرصوا على طاعة تعليمات الكهنة واللاويين في حالة الإصابة بالبرص، ونفذوا بدقة ما أمرتهم به."]]}, {"l": "2Ch 17:8", "n": "", "vs": [[8, "بالتعاون مع اللاويين: شمعيا ونثنيا وزبديا وعسائيل وشميراموث ويهوناثان وأدونيا وطوبيا وطوب أدونيا، فضلا عن الكاهنين أليشمع ويهورام."]]}, {"l": "2Ch 17:9", "n": "", "vs": [[9, "فتجولوا في جميع أرجاء يهوذا حاملين معهم سفر شريعة الرب ليعلموا الشعب."]]}, {"l": "2Ch 30:22", "n": "", "vs": [[22, "وعزى حزقيا بكلمات التشجيع قلوب اللاويين الذين أبدوا فطنة في خدمة الرب. وظلوا يأكلون نصيبهم سبعة أيام، ويقربون ذبائح سلام حامدين الرب إله آبائهم."]]}, {"l": "Ezr 7:10", "n": "", "vs": [[10, "لأن عزرا أخلص نيته لطلب شريعة الرب وممارستها، وتعليم الشعب فرائضها وأحكامها."]]}, {"l": "Neh 8:2-8", "n": "", "vs": [[2, "فأخرج عزرا الكاتب سفر الشريعة في اليوم الأول من الشهر السابع، ونشره أمام الجماعة من الرجال والنساء وكل من يفهم ما يسمع،"], [3, "وقرأ منه أمام الساحة الواقعة قبالة بوابة الماء من الصباح حتى انتصاف النهار، في حضرة الرجال والنساء والفاهمين، الذين أرهفوا آذانهم للاستماع إلى كلمات سفر الشريعة."], [4, "ووقف عزرا الكاتب على منبر من خشب أعدوه خصيصا لهذه المناسبة، ووقف إلى جواره عن يمينه كل من متثيا وشمع وعنايا وأوريا وحلقيا ومعسيا، وعن شماله فدايا وميشائيل وملكيا وحشوم وحشبدانة وزكريا ومشلام."], [5, "وإذ كان عزرا الكاتب يقف على مكان مرتفع بحيث يراه جميع الحاضرين، فتح السفر على مرأى من كل الشعب الذين وقفوا احتراما."], [6, "وبارك عزرا الرب الإله العظيم، وأجاب الشعب كله: «آمين، آمين» بأيد مرفوعة. ثم أكبوا بوجوههم نحو الأرض ساجدين للرب."], [7, "وشرع يشوع وباني وشربيا، ويامين، وعقوب وشبتاي وهوديا ومعسيا وقليطا وعزريا ويوزاباد وحنان وفلايا واللاويون يشرحون للشعب الشريعة والشعب واقف في أماكنه،"], [8, "وقرأوا من سفر شريعة الله بوضوح، وفسروا محتوياته، بحيث فهم الشعب ما كان يقرأ."]]}, {"l": "Jer 15:19", "n": "", "vs": [[19, "لذلك، هكذا قال الرب: «إن رجعت أستردك فتمثل أمامي. إن نطقت بالقول السديد ونبذت الكلام الغث، أجعلك المتحدث بفمي، فيقبلون إليك مسترشدين، وأنت لا تلجأ إليهم طالبا نصيحة."]]}, {"l": "Jer 18:18", "n": "", "vs": [[18, "ثم قالوا: «تعالوا نتآمر على إرميا، لأن الشريعة لا تبيد عن الكاهن، ولا المشورة عن الحكيم، ولا الوحي عن النبي. تعالوا نلذعه بوخزات اللسان ونصم آذاننا عن كلامه»."]]}, {"l": "Hag 2:11-13", "n": "", "vs": [[11, "«هذا ما يقوله الرب القدير: اسأل الكهنة عما تقوله الشريعة بشأن هذا السؤال:"], [12, "إن حمل إنسان لحما مقدسا بين طيات ثوبه، ولمس طرفه خبزا أو طبيخا أو خمرا أو زيتا أو أي طعام آخر، فهل يصبح ذاك مقدسا؟» فأجاب الكهنة: «لا»."], [13, "ثم سأل حجي: «إن لمس إنسان تنجس بمس ميت شيئا من هذه هل تصبح نجسة؟» فأجاب الكهنة: «نعم، تصبح نجسة»."]]}, {"l": "2Ti 2:24", "n": "", "vs": [[24, "وعبد الرب يجب ألا يتشاجر، بل أن يكون مترفقا تجاه الجميع، قادرا على التعليم، يتحمل المشقات بصبر،"]]}, {"l": "2Ti 2:25", "n": "", "vs": [[25, "ويؤدب بالوداعة مقاومي الإيمان، عسى أن يمنحهم الله التوبة، فيعرفوا الحق بالتمام،"]]}], "kwAr": "شفتي الكاهن", "noteAr": ""}, {"kw": "the messenger", "raw": "Mal_3:1; Isa_42:19, Isa_44:26; Hag_1:13; Joh_13:20, Joh_20:21; Act_16:17; 2Co_5:20; Gal_4:14; 1Th_4:8", "note": "", "refs": [{"l": "Mal 3:1", "n": "", "vs": [[1, "«ها أنا أرسل رسولي فيمهد الطريق أمامي ويأتي الرب الذي تطلبونه فجأة إلى هيكله ويقبل أيضا ملاك العهد الذي تسرون به» يقول الرب القدير"]]}, {"l": "Isa 42:19", "n": "", "vs": [[19, "من هو أعمى سوى عبدي؟ ومن هو أصم كرسولي الذي أرسلته؟ من هو أعمى مثل من يكن لي الولاء؟ ومن هو كفيف كعبد الرب؟"]]}, {"l": "Isa 44:26", "n": "", "vs": [[26, "أنا هو متمم كلام عبده، ومحقق مشورة رسله، القائل عن أورشليم: لابد أن تعود عامرة وعن مدن يهوذا: لابد أن تبنى، وأنا أعيد تشييد خربها."]]}, {"l": "Hag 1:13", "n": "", "vs": [[13, "ثم أبلغ حجي رسول الرب، الشعب رسالة الرب قائلا: «أنا معكم، يقول الرب»."]]}, {"l": "Joh 13:20", "n": "", "vs": [[20, "الحق الحق أقول لكم: من يقبل الذي أرسله، يقبلني؛ ومن يقبلني، يقبل الذي أرسلني»."]]}, {"l": "Joh 20:21", "n": "", "vs": [[21, "فقال لهم يسوع: «سلام لكم. كما أن الآب أرسلني، أرسلكم أنا»."]]}, {"l": "Act 16:17", "n": "", "vs": [[17, "فأخذت تسير وراء بولس ووراءنا صارخة: «هؤلاء الناس هم عبيد الله العلي، يعلنون لكم طريق الخلاص»."]]}, {"l": "2Co 5:20", "n": "", "vs": [[20, "فنحن إذن سفراء المسيح، وكأن الله يعظ بنا نتوسل بالنيابة عن المسيح منادين: «تصالحوا مع الله!»"]]}, {"l": "Gal 4:14", "n": "", "vs": [[14, "ومع أن العلة التي في جسدي كانت تجربة لكم، فإنكم لم تحتقروني ولم تنفروا مني بسببها، بل قبلتموني كأني ملاك من عند الله، أو كأني المسيح يسوع."]]}, {"l": "1Th 4:8", "n": "", "vs": [[8, "إذن، من استخف بأخيه في هذا الأمر، يستخف لا بإنسان بل بالله، بذاك الذي وهبكم فعلا روحه القدوس."]]}], "kwAr": "رسول الرب القدير", "noteAr": ""}], "arS": [["لأن ", []], ["شفتي", ["H8193"]], [" ", []], ["الكاهن", ["H3548"]], [" ", []], ["تحفظان", ["H8104"]], [" ", []], ["العلم", ["H1847"]], ["، ومن ", []], ["فمه", ["H6310"]], [" ", []], ["يطلب", ["H1245"]], [" الناس ", []], ["الشريعة", ["H8451"]], ["، لأنه ", []], ["رسول", ["H4397"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["القدير", ["H6635"]], [".", []]]}, {"c": 2, "v": 8, "text": "ولكنكم انحرفتم عن الطريق المستقيم، وأعثرتم بتعاليمكم كثيرين، ونقضتم عهدي مع النسل الكهنوتي، يقول الرب القدير.", "groups": [{"kw": "ye are", "raw": "Psa_18:21, Psa_119:102; Isa_30:11, Isa_59:13; Jer_17:5, Jer_17:13; Eze_44:10; Dan_9:5, Dan_9:6; Heb_3:12", "note": "", "refs": [{"l": "Psa 18:21", "n": "", "vs": [[21, "لأني سلكت دائما في طرق الرب ولم أعص إلهي."]]}, {"l": "Psa 119:102", "n": "", "vs": [[102, "لم أبتعد عن أحكامك لأنك هكذا علمتني."]]}, {"l": "Isa 30:11", "n": "", "vs": [[11, "اعدلوا عن الطريق، حيدوا عن السبيل، وكفوا عن مجابهتنا بكلام قدوس إسرائيل»."]]}, {"l": "Isa 59:13", "n": "", "vs": [[13, "تمردنا وتنكرنا للرب. ارتددنا عن اتباع طرق إلهنا، تفوهنا بالظلم والعصيان افتراء، وبكلام زور من القلب."]]}, {"l": "Jer 17:5", "n": "", "vs": [[5, "وهذا ما يقوله الرب: «ليكن ملعونا كل من يتوكل على بشر، ويتخذ من الناس ذراع قوة له، ويحول قلبه عن الرب."]]}, {"l": "Jer 17:13", "n": "", "vs": [[13, "أيها الرب رجاء إسرائيل: إن جميع الذين يتخلون عنك يلحق بهم الخزي، والذين ينصرفون عنك (يزولون) كمن كتبت أسماؤهم على التراب لأنهم نبذوا الرب ينبوع المياه الحية."]]}, {"l": "Eze 44:10", "n": "", "vs": [[10, "حتى اللاويون الذين ابتعدوا عني حين ضل إسرائيل وراء أصنامه يحملون عقاب إثمهم."]]}, {"l": "Dan 9:5", "n": "", "vs": [[5, "إننا أخطأنا وأثمنا وارتكبنا الشر، وتمردنا وانحرفنا عن وصاياك وأحكامك."]]}, {"l": "Dan 9:6", "n": "", "vs": [[6, "ولم نسمع لعبيدك الأنبياء الذين باسمك أنذروا ملوكنا ورؤساءنا وآباءنا وجميع شعب الأرض."]]}, {"l": "Heb 3:12", "n": "", "vs": [[12, "فعليكم، أيها الإخوة، أن تأخذوا حذركم جيدا، حتى لا يكون قلب أي واحد منكم شريرا لا إيمان فيه، مما يؤدي به إلى الارتداد عن الله الحي."]]}], "kwAr": "انحرفتم", "noteAr": ""}, {"kw": "ye have caused", "raw": "Mal_2:9; 1Sa_2:17, 1Sa_2:24, 1Sa_2:30; Isa_9:16; Jer_18:15, Jer_23:11-15; Mat_15:2-5; Luk_11:45, Luk_11:46; Rom_2:19-24, Rom_14:21", "note": "", "refs": [{"l": "Mal 2:9", "n": "", "vs": [[9, "لذلك أحقركم وأذلكم أمام جميع الناس، لأنكم لم تطيعوا طرقي، وحابيتم في تطبيق شريعتي»."]]}, {"l": "1Sa 2:17", "n": "", "vs": [[17, "فعظمت خطيئة أبناء عالي أمام الرب، لأن الشعب استهان بذبيحة الرب من جراء تصرفاتهما."]]}, {"l": "1Sa 2:24", "n": "", "vs": [[24, "لا، يا بني، فالأخبار التي بلغتني مشينة، إذ إنكم تجعلون الشعب يتعدى على شريعة الرب."]]}, {"l": "1Sa 2:30", "n": "", "vs": [[30, "لذلك يقول الرب إله إسرائيل: لقد وعدت أن يظل بيتك وبيت أبيك يخدمون في محضري إلى الأبد. أما الآن، يقول الرب: فحاشا لي أن أفعل ذلك، لأنني أكرم الذين يكرمونني، أما الذين يحتقرونني فيصغرون."]]}, {"l": "Isa 9:16", "n": "", "vs": [[16, "فمرشدو هذا الشعب يضلونه، والمرشدون يبتلعون."]]}, {"l": "Jer 18:15", "n": "", "vs": [[15, "لكن شعبي قد نسيني وأحرق بخورا لأوثان باطلة، جعلته يتعثر في طرقه، في السبل القديمة، فسلك في ممرات وطرق غير معبدة."]]}, {"l": "Jer 23:11-15", "n": "", "vs": [[11, "ويقول الرب: «النبي والكاهن كافران، وفي بيتي وجدت شرهما."], [12, "لذلك يضحي طريقهما مزالق لهما، تفضي بهما إلى الظلمات التي يطردون إليها، ويهويان فيها لأني أجلب عليهما شرا في سنة عقابهما»."], [13, "في أوساط أنبيا ء السامرة شهدت أمورا كريهة، إذ تنبأوا باسم البعل، وأضلوا شعبي إسرائيل."], [14, "وفي أوساط أنبياء أورشليم رأيت أمورا مهولة: يرتكبون الفسق، ويسلكون في الأكاذيب، يشددون أيدي فاعلي الإثم لئلا يتوب أحد عن شره. صاروا جميعا كسكان سدوم وأصبح أهلها كأهل عمورة."], [15, "لذلك هذا ما يقوله الرب القدير عن الأنبياء: «ها أنا أطعمهم أفسنتينا وأسقيهم ماء مسموما، لأنه من أنبياء أورشليم شاع الكفر في كل أرجاء الأرض»."]]}, {"l": "Mat 15:2-5", "n": "", "vs": [[2, "«لماذا يخالف تلاميذك تقاليد الشيوخ، فلا يغسلون أيديهم قبل أن يأكلوا؟»"], [3, "فأجابهم «ولماذا تخالفون أنتم وصية الله من أجل المحافظة على تقاليدكم؟"], [4, "فقد أوصى الله قائلا: أكرم أباك وأمك. ومن أهان أباه أو أمه، فليكن الموت عقابا له."], [5, "ولكنكم أنتم تقولون: من قال لأبيه أو أمه: إن ما أعولك به قد قدمته قربانا للهيكل،"]]}, {"l": "Luk 11:45", "n": "", "vs": [[45, "وتكلم أحد علماء الشريعة، قائلا له: «يامعلم، إنك بقولك هذا تهيننا نحن أيضا»."]]}, {"l": "Luk 11:46", "n": "", "vs": [[46, "فقال: «والويل أيضا لكم ياعلماء الشريعة، فإنكم تحملون الناس أحمالا مرهقة، وأنتم لا تمسونها بإصبع من أصابعكم!"]]}, {"l": "Rom 2:19-24", "n": "", "vs": [[19, "ولك ثقة في نفسك بأنك قائد للعميان، ونور للذين في الظلام،"], [20, "ومؤدب للجهال، ومعلم للأطفال؛ ولك في الشريعة صورة المعرفة والحق؛"], [21, "فأنت إذن، يامن تعلم غيرك، أما تعلم نفسك؟ أنت يامن تعظ أن لا يسرق، أتسرق؟"], [22, "أنت يامن تنهى عن الزنى، أتزني؟ أنت يامن تستنكر الأصنام، أتسرق الهياكل"], [23, "الذي تفتخر بالشريعة، أتهين الله بمخالفة الشريعة؟"], [24, "فإن «اسم الله يجدف عليه بين الأمم بسببكم»، كما هو مكتوب."]]}, {"l": "Rom 14:21", "n": "", "vs": [[21, "فمن الصواب ألا تأكل لحما ولا تشرب خمرا، ولا تفعل شيئا يتعثر فيه أخوك."]]}], "kwAr": "وأعثرتم", "noteAr": ""}, {"kw": "stumble at", "raw": "or, fall in", "note": "or, fall in", "refs": [], "kwAr": "بتعاليمكم", "noteAr": "أو: «سقطوا في»."}, {"kw": "ye have corrupted", "raw": "Mal_2:5, Mal_2:10; Lev_21:15; Neh_13:29", "note": "", "refs": [{"l": "Mal 2:5", "n": "", "vs": [[5, "فقد كان عهدي مع لاوي ونسله عهد حياة وسلام، فوهبتهما لهم، ومنحتهم التقوى، فاتقوني ووقفوا خاشعين لاسمي يقول الرب القدير."]]}, {"l": "Mal 2:10", "n": "", "vs": [[10, "أليس لنا جميعا أب واحد؟ ألم يخلقنا إله واحد، فما بالنا يغدر أحدنا بالآخر وندنس عهد آبائنا؟"]]}, {"l": "Lev 21:15", "n": "", "vs": [[15, "فلا يدنس نسله بين شعبه، لأني أنا الرب الذي أقدسه»."]]}, {"l": "Neh 13:29", "n": "", "vs": [[29, "فاذكرهم ياإلهي لأنهم دنسوا الكهنوت وعهد الكهنوت واللاويين،"]]}],
