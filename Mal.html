, "جميع هذه صنعتها يدي فوجدت كلها، لكنني أسر بالرجل المتواضع المنسحق الروح الذي يرتعد من كلمتي."]]}, {"l": "Luk 1:50", "n": "", "vs": [[50, "ورحمته للذين يتقونه جيلا بعد جيل."]]}, {"l": "Act 13:26", "n": "", "vs": [[26, "أيها الإخوة، يابني جنس إبراهيم، ويا كل من يتقي الله من الحاضرين هنا: إلينا أرسل الله كلمة هذا الخلاص!"]]}, {"l": "Rev 11:18", "n": "", "vs": [[18, "غضبت الشعوب عليك، فجاء دور غضبك عليهم. جاءت الساعة ليدان الأموات، وتكافيء عبيدك الأنبياء والقديسين والمتقين اسمك، صغارا وكبارا، وتهلك الذين كانوا يدمرون الأرض!»"]]}], "kwAr": "المتقون اسمي", "noteAr": ""}, {"kw": "the Sun", "raw": "2Sa_23:4; Psa_67:1, Psa_84:11; Pro_4:18; Isa_9:2, Isa_30:26, Isa_49:6, Isa_60:1-3, Isa_60:19, Isa_60:20; Hos_6:3; Mat_4:15, Mat_4:16; Luk_1:78, Luk_2:32; Joh_1:4, Joh_1:8, Joh_1:14, Joh_8:12, Joh_9:4, Joh_12:35, Joh_12:36; Joh_12:40; Act_13:47, Act_26:18; Eph_5:8-14; 2Pe_1:19; 1Jo_2:8; Rev_2:28; Rev_22:16", "note": "", "refs": [{"l": "2Sa 23:4", "n": "", "vs": [[4, "فإنه يشرق عليهم كنور الفجر، وكالشمس يشع عليهم في صباح صاف، وكالمطر الذي يستنبت عشب الأرض."]]}, {"l": "Psa 67:1", "n": "", "vs": [[1, "ليترَأف الله علينا وليباركنا، وليضيء بوجهه علينا"]]}, {"l": "Psa 84:11", "n": "", "vs": [[11, "لأن الرب الإله شمس وترس. الرب يعطي نعمة ومجدا؛ لا يمنع أي خير عن السالكين بالاستقامة."]]}, {"l": "Pro 4:18", "n": "", "vs": [[18, "أما سبيل الأبرار فكنور متلأليء يتزايد إشراقه إلى أن يكتمل النهار،"]]}, {"l": "Isa 9:2", "n": "", "vs": [[2, "الشعب السالك في الظلمة أبصر نورا عظيما، والمقيمون في أرض ظلال الموت أضاء عليهم نور."]]}, {"l": "Isa 30:26", "n": "", "vs": [[26, "ويصبح نور القمر كنور الشمس، ويتضاعف نور الشمس سبع مرات كنور سبعة أيام، في يوم يجبر الرب فيه كسر شعبه ويشفي رضوض ضرباته."]]}, {"l": "Isa 49:6", "n": "", "vs": [[6, "لكم هو يسير أن تكون لي عبدا لتستنهض أسباط يعقوب، وترد من نجيت من إسرائيل، لذلك سأجعلك نورا للأمم لتكون خلاصي إلى أقصى الأرض."]]}, {"l": "Isa 60:1-3", "n": "", "vs": [[1, "قومي استضيئي، فإن نورك قد جاء، ومجد الرب أشرق عليك."], [2, "ها إن الظلمة تغمر الأرض، والليل الدامس يكتنف الشعوب، ولكن الرب يشرق عليك، ويتجلى مجده حولك،"], [3, "فتقبل الأمم إلى نورك، وتتوافد الملوك إلى إشراق ضيائك."]]}, {"l": "Isa 60:19", "n": "", "vs": [[19, "ولا تعود الشمس نورا لك في النهار ولا يشرق ضوء القمر عليك لأن الرب يكون نورك الأبدي، وإلهك يكون مجدك."]]}, {"l": "Isa 60:20", "n": "", "vs": [[20, "ولا تغرب شمسك من بعد، ولا يتضاءل قمرك، لأن الرب يكون نورك الأبدي، وتنقضي أيام مناحتك."]]}, {"l": "Hos 6:3", "n": "", "vs": [[3, "لنعرف، بل لنجد حتى نعرف الرب، فمجيئه يقين كالفجر، يقبل إلينا كإقبال المطر وكغيوث الربيع التي تروي الأرض»."]]}, {"l": "Mat 4:15", "n": "", "vs": [[15, "«أرض زبولون وأرض نفتاليم، على طريق البحيرة ما وراء نهر الأردن، بلاد الجليل التي يسكنها الأجانب،"]]}, {"l": "Mat 4:16", "n": "", "vs": [[16, "الشعب الجالس في الظلمة، أبصر نورا عظيما، والجالسون في أرض الموت وظلاله، أشرق عليهم نور ! »"]]}, {"l": "Luk 1:78", "n": "", "vs": [[78, "بفضل عواطف الرحمة لدى إلهنا، تلك التي تفقدنا بها الفجر المشرق من العلاء،"]]}, {"l": "Luk 2:32", "n": "", "vs": [[32, "نور هداية للأمم ومجدا لشعبك إسر ائيل»."]]}, {"l": "Joh 1:4", "n": "", "vs": [[4, "فيه كانت الحياة. والحياة هذه كانت نور الناس."]]}, {"l": "Joh 1:8", "n": "", "vs": [[8, "لم يكن هو النور، بل كان شاهدا للنور،"]]}, {"l": "Joh 1:14", "n": "", "vs": [[14, "والكلمة صار بشرا، وخيم بيننا، ونحن رأينا مجده، مجد ابن وحيد عند الآب، وهو ممتلىء بالنعمة والحق."]]}, {"l": "Joh 8:12", "n": "", "vs": [[12, "وخاطبهم يسوع أيضا فقال: «أنا نور العالم. من يتبعني فلا يتخبط في الظلام بل يكون له نور الحياة»."]]}, {"l": "Joh 9:4", "n": "", "vs": [[4, "فعلي أن أعمل أعمال الذي أرسلني مادام الوقت نهارا. فسيأتي الليل، ولا أحد يقدر أن يعمل فيه."]]}, {"l": "Joh 12:35", "n": "", "vs": [[35, "فقال لهم يسوع: «النور باق معكم وقتا قصيرا. فواصلوا سيركم مادام النور يشرق عليكم، لئلا يطبق عليكم الظلام، فإن الذي يمشي في الظلام لا يعلم أين يذهب."]]}, {"l": "Joh 12:36", "n": "", "vs": [[36, "آمنوا بالنور مادام النور معكم، فتصيروا أبناء النور»."]]}, {"l": "Joh 12:40", "n": "", "vs": [[40, "«أعمى عيونهم وقسى قلوبهم، لئلا يبصروا بعيونهم ويفهموا بقلوبهم، ويتوبوا فأشفيهم»."]]}, {"l": "Act 13:47", "n": "", "vs": [[47, "فقد أوصانا الرب قائلا: قد جعلتك نورا للأمم، لتكون سبيل خلاص إلى أقصى الأرض!»"]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "Eph 5:8-14", "n": "", "vs": [[8, "فقد كنتم في الماضي ظلاما، ولكنكم الآن نور في الرب. فاسلكوا سلوك أولاد النور."], [9, "فإن ثمر النور يكون في كل صلاح واستقامة وحق."], [10, "هكذا تختبرون الأمور التي ترضي الرب."], [11, "وعليكم ألا تكتفوا بعدم الاشتراك في أعمال الظلام العقيمة، بل بالأحرى أن تفضحوها أيضا."], [12, "فالأمور التي يفعلونها سرا، قبيح حتى ذكرها."], [13, "إلا أن كل شيء، إذا ما فضح النور أمره، يصير مكشوفا:"], [14, "لأن الذي يكشف كل شيء هو النور. لذلك يقال: «استيقظ أيها النائم، وقم من بين الأموات، فيشرق عليك نور المسيح!»"]]}, {"l": "2Pe 1:19", "n": "", "vs": [[19, "وهكذا، صارت الكلمة النبوية أكثر ثباتا عندنا. فحسنا تفعلون إن انتبهتم إلى هذه الكلمة في قلوبكم. إذ إنها أشبه بمصباح يضيء في مكان مظلم، إلى أن يطلع النهار ويظهر كوكب الصبح."]]}, {"l": "1Jo 2:8", "n": "", "vs": [[8, "ومع ذلك فالوصية التي أكتبها إليكم، هي جديدة دائما، وتتضح حقيقتها في المسيح كما تتضح فيكم أنتم. ذلك لأن الظلام قد بدأ يزول منذ أن أشرق النور الحقيقي الذي مازال الآن مشرقا."]]}, {"l": "Rev 2:28", "n": "", "vs": [[28, "وأمنحه كوكب الصبح!"]]}, {"l": "Rev 22:16", "n": "", "vs": [[16, "أنا يسوع أرسلت ملاكي لأشهد لكم بهذه الأمور في الكنائس. أنا أصل داود ونسله. أنا كوكب الصبح المنير»."]]}], "kwAr": "شمس البر", "noteAr": ""}, {"kw": "healing", "raw": "Psa_103:3, Psa_147:3; Isa_53:5, Isa_57:18, Isa_57:19; Jer_17:14, Jer_33:6; Eze_47:12; Hos_6:1, Hos_14:4; Mat_11:5; Rev_22:2", "note": "", "refs": [{"l": "Psa 103:3", "n": "", "vs": [[3, "إنه يغفر جميع آثامك ويبريء كل أمراضك."]]}, {"l": "Psa 147:3", "n": "", "vs": [[3, "إنه يشفي منكسري القلب ويضمد جراحهم."]]}, {"l": "Isa 53:5", "n": "", "vs": [[5, "إلا أنه كان مجروحا من أجل آثامنا ومسحوقا من أجل معاصينا، حل به تأديب سلامنا، وبجراحه برئنا."]]}, {"l": "Isa 57:18", "n": "", "vs": [[18, "لقد رأيت طرقه المكتوبة، إنما سأقومه وأقوده وأرد له ولنائحيه الطمأنينة"]]}, {"l": "Isa 57:19", "n": "", "vs": [[19, "وأستبدل نواحه بالحمد، يقول الرب؛ فيكون سلام للقريب والبعيد لأنني سأشفيه."]]}, {"l": "Jer 17:14", "n": "", "vs": [[14, "أبرئني يارب فأبرأ. خلصني فأخلص، فإنك أنت تسبحتي."]]}, {"l": "Jer 33:6", "n": "", "vs": [[6, "ولكن لا ألبث أن أرد لها العافية والشفاء. أبرئهم وأبدي لهم وفرة السلام والأمن."]]}, {"l": "Eze 47:12", "n": "", "vs": [[12, "وتنمو على ضفتيه كل أنواع أشجار الفاكهة التي تؤكل. لا يذبل ورقها ولا ينقطع ثمرها. تحمل أثمارها في كل شهر، لأن مياه النهر تنبع من المقدس، فتكون ثمار أشجاره للأكل وورقها عقاقير للمداواة."]]}, {"l": "Hos 6:1", "n": "", "vs": [[1, "«تعالوا نرجع إلى الرب. هو الذي مزقنا إربا إربا، وهو وحده يبرئنا. هو الذي ضربنا، وهو وحده الذي يجبرنا."]]}, {"l": "Hos 14:4", "n": "", "vs": [[4, "أنا أبريء ارتدادهم وأحبهم فضلا، لأن غضبي قد تحول عنهم."]]}, {"l": "Mat 11:5", "n": "", "vs": [[5, "العمي يبصرون، والعرج يمشون، والبرص يطهرون، والصم يسمعون، والموتى يقامون، والمساكين يبشرون."]]}, {"l": "Rev 22:2", "n": "", "vs": [[2, "ويخترق ساحة المدينة، وعلى ضفتيه شجرة الحياة تثمر اثنتي عشرة مرة، كل شهر مرة. وأوراقها دواء يشفي الأمم."]]}], "kwAr": "الشفاء", "noteAr": ""}, {"kw": "wings", "raw": "Rth_2:12; Mat_23:37", "note": "", "refs": [{"l": "Rut 2:12", "n": "", "vs": [[12, "ليكافئك الرب إله إسرائيل، الذي جئت لتحتمي تحت جناحيه، وفقا لإحسانك. وليكن أجرك كاملا من عنده»."]]}, {"l": "Mat 23:37", "n": "", "vs": [[37, "ياأورشليم، ياأورشليم، ياقاتلة الأنبياء وراجمة المرسلين إليها! كم مرة أردت أن أجمع أولادك كما تجمع الدجاجة فراخها تحت جناحيها، فلم تريدوا!"]]}], "kwAr": "أجنحتها", "noteAr": ""}, {"kw": "ye shall", "raw": "Psa_92:12-14; Isa_49:9, Isa_49:10, Isa_55:12, Isa_55:13; Jer_31:9-14; Hos_14:5-7; Joh_15:2-5; 2Th_1:3; 2Pe_3:18", "note": "", "refs": [{"l": "Psa 92:12-14", "n": "", "vs": [[12, "الصديق يزهو كالنخلة وينمو كالأرز في لبنان."], [13, "لأن المغروسين في بيت الرب يزدهرون في ديار بيت إلهنا"], [14, "يثمرون أيضا في الشيخوخة، ويظلون موفوري العافية والنضرة"]]}, {"l": "Isa 49:9", "n": "", "vs": [[9, "لتقول للأسرى: اخرجوا، وللذين في الظلمة اظهروا، فيرعون في الطرقات وتصبح الروابي الجرداء مراعي لهم."]]}, {"l": "Isa 49:10", "n": "", "vs": [[10, "لا يجوعون ولا يعطشون، ولا يعييهم لهيب الصحراء ولا لفح الشمس، لأن راحمهم يهديهم ويقودهم إلى ينابيع المياه."]]}, {"l": "Isa 55:12", "n": "", "vs": [[12, "لأنكم ستتركون بابل بفرح وسلام فتترنم الجبال والتلال أمامكم بهجة وتصفق أشجار الحقل بأيديها غبطة،"]]}, {"l": "Isa 55:13", "n": "", "vs": [[13, "وحيث كان الشوك والقراص، تنمو أشجار السرو والآس: فيكون ذلك تخليدا لاسم الرب وعلامة أبدية لا تمحى."]]}, {"l": "Jer 31:9-14", "n": "", "vs": [[9, "سيرجعون بنوح، وبتضرعات أهديهم. إلى جوار جداول المياه أسيرهم فيمشون في طريق مستقيمة لا يعثرون فيها، لأني أب لإسرائيل، وأفرايم بكري»."], [10, "«فاسمعوا كلام الرب أيها الأمم، وأذيعوا في الجزائر البعيدة، وقولوا: «الذي بدد شعب إسرائيل هو الذي يجمعه ويحافظ عليه كما يحافظ الراعي على قطيعه."], [11, "لأن الرب افتدى إسرائيل وفكه من يد من هو أقوى منه."], [12, "فيقبلون مرنمين بهتاف على مرتفعات صهيون، ويبتهجون بخيرات الرب من حنطة وخمر جديد وزيت وحملان وعجول، وتكون نفوسهم كجنة مروية، ولا يعتريهم حزن بعد."], [13, "حينئذ تبتهج العذارى بالرقص، ويطر ب الشيوخ والشبان على حد سواء. أحول نوحهم إلى سرور وأستبدل حزنهم بالفرح والطمأنينة."], [14, "وأشبع نفوس الكهنة من الخيرات، ويمتليء شعبي من نعمتي»."]]}, {"l": "Hos 14:5-7", "n": "", "vs": [[5, "وأكون كالطل لإسرائيل، فيزهر كالسوسن، وتتأصل جذوره كأرز لبنان."], [6, "تمتد أغصانه ويصير جماله كشجرة الزيتون وشذاه كأرز لبنان."], [7, "ويعودون ويقيمون في ظله ويزدهرون كالحنطة، ويزهرون كالكرمة، ويذيع ذكرهم كخمر لبنان."]]}, {"l": "Joh 15:2-5", "n": "", "vs": [[2, "كل غصن في لا ينتج ثمرا يقطعه؛ وكل غصن ينتج ثمرا ينقيه لينتج مزيدا من الثمر."], [3, "أنتم الآن أنقياء بسبب الكلمة التي خاطبتكم بها."], [4, "فاثبتوا في وأنا فيكم. كما أن الغصن لا يقدر أن ينتج ثمرا إلا إذا ثبت في الكرمة؛ فكذلك أنتم، إلا إذا ثبتم في."], [5, "أنا الكرمة وأنتم الأغصان. من يثبت في وأنا فيه، فذاك ينتج ثمرا كثيرا. فإنكم بمعزل عني لا تقدرون أن تفعلوا شيئا."]]}, {"l": "2Th 1:3", "n": "", "vs": [[3, "من واجبنا أن نشكر الله على الدوام لأجلكم أيها الإخوة. كما أن هذا حق: لأن إيمانكم ينمو نموا فائقا، ومحبة أحدكم للآخر تفيض بينكم جميعا."]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}], "kwAr": "فتنطلقون", "noteAr": ""}], "arS": [["أما أنتم أيها ", []], ["المتقون", ["H3372"]], [" ", []], ["اسمي", ["H8034"]], [" ", []], ["فتشرق", ["H2224"]], [" عليكم ", []], ["شمس", ["H8121"]], [" ", []], ["البر", ["H6666"]], [" حاملة في ", []], ["أجنحتها", ["H3671"]], [" ", []], ["الشفاء", ["H4832"]], [" ", []], ["فتنطلقون", ["H3318"]], [" ", []], ["متواثبين", ["H6335"]], [" ", []], ["كعجول", ["H5695"]], [" ", []], ["المعلف", ["H4770"]], ["،", []]]}, {"c": 4, "v": 3, "text": "وتطأون الأشرار، إذ يكونون رمادا تحت بطون أقدامكم، في اليوم الذي أجري فيه أعمالي، يقول الرب القدير.", "groups": [{"kw": "tread down", "raw": "Gen_3:15; Jos_10:24, Jos_10:25; 2Sa_22:43; Job_40:12; Psa_91:13; Isa_25:10, Isa_26:6, Isa_63:3-6; Dan_7:18, Dan_7:27; Mic_5:8, Mic_7:10; Zec_10:5; Rom_16:20; Rev_11:15, Rev_14:20", "note": "", "refs": [{"l": "Gen 3:15", "n": "", "vs": [[15, "وأثير عداوة دائمة بينك وبين المرأة، وكذلك بين نسليكما. هو يسحق رأسك وأنت تلدغين عقبه»."]]}, {"l": "Jos 10:24", "n": "", "vs": [[24, "وما إن أقبلوا بهم إليه حتى استدعى كل محاربيه، وقال لقادتهم الذين ساروا معه: «تقدموا وطئوا بأرجلكم رقاب هؤلاء الملوك». ففعلوا كذلك."]]}, {"l": "Jos 10:25", "n": "", "vs": [[25, "فقال لهم يشوع: «لا تخافوا ولا تجزعوا، بل تقووا وتشجعوا، لأنه هكذا يصنع الرب بجميع أعدائكم الذين تحاربونهم»."]]}, {"l": "2Sa 22:43", "n": "", "vs": [[43, "فأسحقهم كغبار الأرض، ومثل طين الأسواق أدقهم وأدوسهم."]]}, {"l": "Job 40:12", "n": "", "vs": [[12, "انظر إلى كل متعظم وذلله، ودس الأشرار في مواضعهم."]]}, {"l": "Psa 91:13", "n": "", "vs": [[13, "تطأ على الأسد والأفعى، تدوس الشبل والثعبان."]]}, {"l": "Isa 25:10", "n": "", "vs": [[10, "لأن يد الرب تستقر على هذا الجبل ويوطأ موآب في مكانه كما يوطأ التبن في الطين."]]}, {"l": "Isa 26:6", "n": "", "vs": [[6, "فداستها أقدام البائس والفقير."]]}, {"l": "Isa 63:3-6", "n": "", "vs": [[3, "لقد دست المعصرة وحدي، ولم يكن معي أحد من الشعوب. قد دستهم في سخطي ووطئتهم في غيظي، فتناثر دمهم على ردائي ولطخت ثيابي."], [4, "لأن يوم الانتقام كان كامنا في قلبي، وسنة مفديي قد أتت."], [5, "تلفت فلم أعثر على معين، وعجبت إذ لم يكن من ناصر، فانتصرت بقوة ذراعي، وتأيدت بنجدة سخطي،"], [6, "فدست الشعوب في غيظي، وأسكرتهم في غضبي، وسكبت دماءهم فوق الأرض."]]}, {"l": "Dan 7:18", "n": "", "vs": [[18, "غير أن قديسي العلي يستولون على المملكة ويتملكونها إلى أبد الآبدين."]]}, {"l": "Dan 7:27", "n": "", "vs": [[27, "وتوهب المملكة والسلطان وعظمة الممالك القائمة تحت كل السماء إلى شعب قديسي العلي، فيكون ملكوت العلي ملكوتا أبديا، وتعبده جميع السلاطين ويطيعونه."]]}, {"l": "Mic 5:8", "n": "", "vs": [[8, "وتكون بقية ذرية يعقوب بين الشعوب الكثيرة كأسد بين وحوش الغابة، أو كشبل بين قطعان الغنم، الذي إن اقتحم يدوس ويفترس وليس من منقذ."]]}, {"l": "Mic 7:10", "n": "", "vs": [[10, "عندئذ ترى ذلك عدوتي فيعتريها الخزي إذ قالت لي: «أين هو الرب إلهك؟» ستشهدها عيناي تداس كطين الشوارع والأزقة."]]}, {"l": "Zec 10:5", "n": "", "vs": [[5, "ويدوسون الأعداء معا كما يدوس الجبابرة الطين في الشوارع، ويحاربون لأن الرب معهم فيلحقون العار بفرسان الأعداء."]]}, {"l": "Rom 16:20", "n": "", "vs": [[20, "وإله السلام سيسحق الشيطان تحت أقدامكم سريعا. لتكن نعمة ربنا يسوع المسيح معكم."]]}, {"l": "Rev 11:15", "n": "", "vs": [[15, "ونفخ الملاك السابع في بوقه فسمعت أصوات عالية في السماء تقول: «قد صار ملك العالم لربنا ومسيحه. إنه يملك إلى أبد الآبدين»."]]}, {"l": "Rev 14:20", "n": "", "vs": [[20, "فديست المعصرة بالأرجل خارج المدينة، فانبثق منها الدم وجرى أنهارا حتى إلى لجم الخيل، مسافة ثلثمائة وعشرين كيلومترا."]]}], "kwAr": "وتطأون الأشرار", "noteAr": ""}], "arS": [["وتطأون", ["H6072"]], [" ", []], ["الأشرار", ["H7563"]], ["، إذ يكونون ", []], ["رمادا", ["H665"]], [" ", []], ["تحت", ["H8478"]], [" ", []], ["بطون", ["H3709"]], [" ", []], ["أقدامكم", ["H7272"]], ["، في ", []], ["اليوم", ["H3117"]], [" الذي ", []], ["أجري", ["H6213"]], [" فيه أعمالي، ", []], ["يقول", ["H559"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["القدير", ["H6635"]], [".", []]]}, {"c": 4, "v": 4, "text": "اذكروا شريعة موسى عبدي وسائر فرائضي وأحكامي التي أعطيتها في جبل حوريب لجميع شعب إسرائيل.", "groups": [{"kw": "the law", "raw": "Exod. 20:3-21; Deu_4:5, Deu_4:6; Psa_147:19, Psa_147:20; Isa_8:20, Isa_42:21; Mat_5:17-20, Mat_19:16-22, Mat_22:36-40; Mar_12:28-34; Luk_10:25-28, Luk_16:29-31; Joh_5:39-47; Rom_3:31, Rom_13:1-10; Gal_5:13, Gal_5:14, Gal_5:24, Gal_5:25; Jam_2:9-13", "note": "", "refs": [{"l": "Exo 20:3-21", "n": "", "vs": [[3, "لا يكن لك آلهة أخرى سواي."], [4, "لا تنحت لك تمثالا، ولا تصنع صورة ما مما في السماء من فوق، وما في الأرض من تحت، وما في الماء من أسفل الأرض."], [5, "لا تسجد لهن ولا تعبدهن، لأني أنا الرب إلهك، إله غيور، أفتقد آثام الآباء في البنين حتى الجيل الثالث والرابع من مبغضي،"], [6, "وأبدي إحسانا نحو ألوف من محبي الذين يطيعون وصاياي."], [7, "لا تنطق باسم الرب إلهك باطلا، لأن الرب يعاقب من نطق باسمه باطلا."], [8, "اذكر يوم السبت لتقدسه،"], [9, "ستة أيام تعمل وتقوم بجميع مشاغلك،"], [10, "أما اليوم السابع فتجعله سبتا للرب إلهك، فلا تقم فيه بأي عمل أنت أو ابنك أو ابنتك أو عبدك أو أمتك أو بهيمتك أو النزيل المقيم داخل أبوابك."], [11, "لأن الرب قد صنع السماء والأرض والبحر وكل ما فيها في ستة أيام، ثم استراح في اليوم السابع. لهذا بارك الرب يوم السبت وجعله مقدسا."], [12, "أكرم أباك وأمك لكي يطول عمرك في الأرض التي يهبك إياها الرب إلهك."], [13, "لا تقتل."], [14, "لا تزن."], [15, "لا تسرق."], [16, "لا تشهد زورا على جارك."], [17, "لا تشته بيت جارك، ولا زوجته، ولا عبده، ولا أمته، ولا ثوره، ولا حماره، ولا شيئا مما له»."], [18, "وعندما عاين الشعب كله الرعود والبروق، وسمعوا دوي صوت البوق، ورأوا الجبل يدخن ارتجفوا خوفا ووقفوا من بعيد،"], [19, "وقالوا لموسى: «كلمنا أنت بنفسك فنسمع، لئلا نموت إذا ظل الله يخاطبنا»."], [20, "فأجاب موسى: «لا تخافوا. إنما الرب قد جاء ليمتحنكم حتى تظل مخافة الرب تلازمكم فلا تخطئوا»."], [21, "وبينما كان الشعب واقفا من بعيد، اقترب موسى من الظلام المتكاثف حيث كان الله ."]]}, {"l": "Deu 4:5", "n": "", "vs": [[5, "انظروا، ها أنا قد علمتكم شرائع وأحكاما كما أمرني الرب إلهي لتعملوا بموجبها في الأرض التي أنتم ماضون إليها لترثوها."]]}, {"l": "Deu 4:6", "n": "", "vs": [[6, "فاحفظوها وطبقوها، لأنها هي حكمتكم وفطنتكم لدى الشعوب الذين يسمعون عن هذه الشرائع، فيقولون: إن هذا الشعب العظيم هو حقا شعب حكيم فطن."]]}, {"l": "Psa 147:19", "n": "", "vs": [[19, "يعلن ليعقوب كلمته ولإسرائيل فرائضه وأحكامه."]]}, {"l": "Psa 147:20", "n": "", "vs": [[20, "لم يعامل أمة أخرى هكذا، ولم يعرفها أحكامه هللويا."]]}, {"l": "Isa 8:20", "n": "", "vs": [[20, "فإلى الشريعة وإلى الشهادة: ومن لا ينطق بمثل هذا القول، فلا فجر له."]]}, {"l": "Isa 42:21", "n": "", "vs": [[21, "قد سر الرب من أجل بره أن يعظم شريعته ويمجدها،"]]}, {"l": "Mat 5:17-20", "n": "", "vs": [[17, "لا تظنوا أني جئت لألغي الشريعة أو الأنبياء. ما جئت لألغي، بل لأكمل."], [18, "فالحق أقول لكم: إلى أن تزول الأرض والسماء، لن يزول حرف واحد أو نقطة واحدة من الشريعة، حتى يتم كل شيء."], [19, "فأي من خالف واحدة من هذه الوصايا الصغرى، وعلم الناس أن يفعلوا فعله، يدعى الأصغر في ملكوت السماوات. وأما من عمل بها وعلمها، فيدعى عظيما في ملكوت السماوات."], [20, "فإني أقول لكم: إن لم يزد بركم على بر الكتبة والفريسيين، لن تدخلوا ملكوت السماوات أبدا."]]}, {"l": "Mat 19:16-22", "n": "", "vs": [[16, "وإذا شاب يتقدم إليه ويسأل: «أيها المعلم الصالح، أي صلاح أعمل لأحصل على الحياة الأبدية؟»"], [17, "فأجابه: «لماذا تسألني عن الصالح؟ واحد هو الصالح. ولكن، إن أردت أن تدخل الحياة، فاعمل بالوصايا»."], [18, "فسأل: «أية وصايا؟» أجابه يسوع: «لا تقتل؛ لا تزن؛ لا تسرق؛ لا تشهد بالزور؛"], [19, "أكرم أباك وأمك؛ وأحب قريبك كنفسك...»"], [20, "قال له الشاب: «هذه كلها عملت بها منذ صغري، فماذا ينقصني بعد؟»"], [21, "فأجابه يسوع: «إن أردت أن تكون كاملا، فاذهب وبع كل ما تملك، ووزع على الفقراء، فيكون لك كنز في السماوات. وتعال اتبعني!»"], [22, "فلما سمع الشاب هذا الكلام، مضى حزينا لأنه كان صاحب ثروة كبيرة."]]}, {"l": "Mat 22:36-40", "n": "", "vs": [[36, "«يامعلم، ما هي الوصية العظمى في الشريعة؟»"], [37, "فأجابه: «أحب الرب إلهك بكل قلبك وكل نفسك وكل فكرك!"], [38, "هذه هي الوصية العظمى الأولى."], [39, "والثانية مثلها: أحب قريبك كنفسك!"], [40, "بهاتين الوصيتين تتعلق الشريعة وكتب الأنبياء! »"]]}, {"l": "Mar 12:28-34", "n": "", "vs": [[28, "وتقدم إليه واحد من الكتبة كان قد سمعهم يتجادلون، ورأى أنه أحسن الرد عليهم، فسأله: «أية وصية هي أولى الوصايا جميعا؟»"], [29, "فأجابه يسوع: «أولى الوصايا جميعا هي: اسمع ياإسرائيل، الرب إلهنا رب واحد"], [30, "فأحب الرب إلهك بكل قلبك وبكل نفسك وبكل فكرك وبكل قوتك. هذه هي الوصية الأولى."], [31, "وهناك ثانية مثلها، وهي أن تحب قريبك كنفسك. فما من وصية أخرى أعظم من هاتين»."], [32, "فقال له الكاتب: «صحيح، يامعلم! حسب الحق تكلمت. فإن الله واحد وليس آخر سواه."], [33, "ومحبته بكل القلب وبكل الفهم وبكل القوة، ومحبة القريب كالنفس، أفضل من جميع المحرقات والذبائح!»"], [34, "فلما رأى يسوع أنه أجاب بحكمة، قال له: «لست بعيدا عن ملكوت الله!» ولم يجرؤ أحد بعد ذلك أن يوجه إليه أي سؤال."]]}, {"l": "Luk 10:25-28", "n": "", "vs": [[25, "وتصدى له أحد علماء الشريعة ليجربه، فقال: «يامعلم، ماذا أعمل لأرث الحياة الأبدية؟»"], [26, "فقال له: «ماذا كتب في الشريعة؟ وكيف تقرأها؟»"], [27, "فأجاب: «أحب الرب إلهك بكل قلبك وكل نفسك وكل قدرتك وكل فكرك، وأحب قريبك كنفسك»."], [28, "فقال له: «جوابك صحيح. فإن عملت بهذا، تحيا!»"]]}, {"l": "Luk 16:29-31", "n": "", "vs": [[29, "ولكن إبراهيم قال له: عندهم موسى والأنبياء: فليسمعوا لهم!"], [30, "فقال له: لا ياأبي إبراهيم، بل إذا ذهب إليهم واحد من بين الأموات يتوبون!"], [31, "فقال له: إن كانوا لا يسمعون لموسى والأنبياء، فلا يقتنعون حتى لو قام واحد من بين الأموات!»"]]}, {"l": "Joh 5:39-47", "n": "", "vs": [[39, "أنتم تدرسون الكتب لأنكم تعتقدون أنها ستهديكم إلى الحياة الأبدية. هذه الكتب تشهد لي،"], [40, "ولكنكم ترفضون أن تأتوا إلي لتكون لكم الحياة."], [41, "لست أقبل مجدا من عند الناس."], [42, "ولكني أعرفكم، وأعرف أن محبة الله ليست في نفوسكم."], [43, "فقد جئت باسم أبي ولم تقبلوني، ولكنكم ترحبون بمن يجيء باسم نفسه."], [44, "من أين لكم أن تؤمنوا بي وأنتم تقبلون المجد بعضكم من بعض، دون أن تسعوا في طلب المجد الذي لا يمنحه إلا الله !"], [45, "لا تظنوا أني أشكوكم إلى الآب، فإن هنالك من يشكوكم، وهو موسى الذي علقتم عليه رجاءكم."], [46, "فلو كنتم صدقتم موسى، لكنتم صدقتموني، لأنه هو كتب عني."], [47, "وإذا كنتم لا تصدقون ما كتبه موسى، فكيف تصدقون كلامي؟»"]]}, {"l": "Rom 3:31", "n": "", "vs": [[31, "إذن، هل نحن نبطل الشريعة بالإيمان؟ حاشا، بل إننا به نثبت الشريعة."]]}, {"l": "Rom 13:1-10", "n": "", "vs": [[1, "على كل نفس أن تخضع للسلطات الحاكمة. فلا سلطة إلا من عند الله، والسلطات القائمة مرتبة من قبل الله."], [2, "حتى إن من يقاوم السلطة، يقاوم ترتيب الله، والمقاومون سيجلبون العقاب على أنفسهم."], [3, "فإن الحكام لا يخافهم من يفعل الصلاح بل من يفعل الشر. أفترغب إذن في أن تكون غير خائف من السلطة؟ اعمل ما هو صالح، فتكون ممدوحا عندها،"], [4, "لأنها خادمة الله لك لأجل الخير. أما إن كنت تعمل الشر فخف، لأن السلطة لا تحمل السيف عبثا، إذ إنها خادمة الله، وهي التي تنتقم لغضبه ممن يفعل الشر."], [5, "ولذلك، فمن الضروري أن تخضعوا، لا اتقاء للغضب فقط، بل مراعاة للضمير أيضا."], [6, "فلهذا السبب تدفعون الضرائب أيضا، لأن رجال السلطة هم خدام لله يواظبون على هذا العمل بعينه."], [7, "فأدوا لكل واحد حقه: الضريبة لصاحب الضريبة والجزية لصاحب الجزية، والاحترام لصاحب الاحترام، والإكرام لصاحب الإكرام."], [8, "لا تكونوا في دين لأحد، إلا بأن يحب بعضكم بعضا. فإن من يحب غيره، يكون قد تمم الشريعة،"], [9, "لأن الوصايا «لا تزن، لا تقتل، لا تسرق، لا تشهد زورا، لا تشته....» وباقي الوصايا، تتلخص في هذه الكلمة: «أحب قريبك كنفسك!»"], [10, "فالمحبة لا تعمل سوءا للقريب. وهكذا تكون المحبة إتماما للشريعة كلها."]]}, {"l": "Gal 5:13", "n": "", "vs": [[13, "فإنما إلى الحرية قد دعيتم، أيها الإخوة؛ ولكن لا تتخذوا من الحرية ذريعة لإرضاء الجسد، بل بالمحبة كونوا عبيدا في خدمة أحدكم الآخر."]]}, {"l": "Gal 5:14", "n": "", "vs": [[14, "فإن الشريعة كلها تتم في وصية واحدة: «أن تحب قريبك كنفسك»."]]}, {"l": "Gal 5:24", "n": "", "vs": [[24, "ولكن الذين صاروا خاصة للمسيح، قد صلبوا الجسد مع الأهواء والشهوات."]]}, {"l": "Gal 5:25", "n": "", "vs": [[25, "إذا كنا نحيا بالروح، فلنسلك أيضا بالروح."]]}, {"l": "Jam 2:9-13", "n": "", "vs": [[9, "ولكن عندما تعاملون الناس بالانحياز والتمييز، ترتكبون خطيئة وتحكم عليكم الشريعة باعتباركم مخالفين لها."], [10, "فأنتم تعرفون أن من يطيع جميع الوصايا الواردة في شريعة موسى، ويخالف واحدة منها فقط، يصير مذنبا، تماما كالذي يخالف الوصايا كلها."], [11, "فإن الله ، مثلا، قال: «لا تزن» كما قال: «لا تقتل!» فإن لم تزن، ولكن قتلت، فقد خرقت الشريعة."], [12, "إذن، تصرفوا في القول والعمل بحسب قانون الحرية، كأنكم سوف تحاكمون وفقا له."], [13, "فلابد أن يكون الحكم على الذين لا يمارسون الرحمة، حكما خاليا من الرحمة، أما الرحمة فهي تتفوق على الحكم!"]]}], "kwAr": "شريعة موسى", "noteAr": ""}, {"kw": "in", "raw": "Deu_4:10", "note": "", "refs": [{"l": "Deu 4:10", "n": "", "vs": [[10, "ففي اليوم الذي مثلتم فيه أمام الرب إلهكم في جبل حوريب، حين قال لي الرب: اجمع لي الشعب حتى أسمعهم كلامي، فيتعلموا مخافتي طوال أيام حياتهم على الأرض، ويعلموا أولادهم أيضا."]]}], "kwAr": "في جبل حوريب", "noteAr": ""}, {"kw": "with", "raw": "Exod. 21:1-23:33; Lev. 1:1-7:38; Psa_147:19", "note": "", "refs": [{"l": "Exo 21:1-23:33", "n": "", "vs": [[1, "وهذه هي الأحكام التي تضعها أمامهم:"], [2, "إن اشتريت عبدا عبرانيا فليخدمك ست سنوات، وفي السنة السابعة تطلقه حرا مجانا"], [3, "وإذا اشتريته وهو أعزب يطلق وحده. وإن اشتريته وهو بعل امرأة، تطلق زوجته معه."], [4, "وإن وهبه مولاه زوجة وأنجبت له بنين وبنات، فإن زوجته وأولادها يكونون ملكا لسيده، وهو يطلق وحده حرا."], [5, "لكن إن قال العبد: «أحب مولاي وزوجتي وأولادي، ولا أريد أن أخرج حرا."], [6, "يأخذه سيده إلى قضاة المدينة، ثم يقيمه لصق الباب أو قائمته، ويثقب أذنه بمخرز، فيصبح خادما له مدى الحياة."], [7, "ولكن إذا باع رجل ابنته كأمة، فإنها لا تطلق حرة كما يطلق العبد."], [8, "فإذا لم ترق لمولاها الذي خطبها لنفسه، يسمح بافتدائها، ولا يحق له أن يبيعها لقوم أجانب لأنه غدر بها فلم يتزوجها"], [9, "وإن خطبها لابنه فإنه يعاملها كابنة له."], [10, "أما إذا أعجبته وتزوجها، ثم عاد فتزوج من أخرى، فإنه لا ينقص شيئا من طعامها وكسوتها ومعاشرتها،"], [11, "فإذا قصر في واحد من هذه الأشياء الثلاثة، عليه أن يطلقها حرة مجانا."], [12, "من ضرب إنسانا وقتله، فالضارب حتما يموت."], [13, "ولكن إن لم يتعمد الضارب ذلك، بل حدث الأمر بقضاء الله فإني سأعين له مكانا يلجأ إليه."], [14, "ولكن إذا تآمر أحد على آخر وتعمد قتله، فسقه للموت حتى ولو احتمى بمذبحي"], [15, "كل من يضرب أباه أو أمه، يقتل."], [16, "من يخطف إنسانا ويبعه أو يسترقه عنده حتما يمت."], [17, "من يشتم أباه أو أمه يقتل."], [18, "إذا تعارك رجلان فضرب أحدهما الآخر بحجر أو لكمه من غير أن يميته بل ألزمه الفراش،"], [19, "ثم قام متمشيا متوكئا على عكازه، يبرأ الضارب، إلا أن عليه أن يدفع للمضروب تعويضا عن مدة تعطله، ويتحمل نفقات علاجه."], [20, "إن ضرب أحد عبده أو أمته بالعصا ضربا أفضى إلى الموت، يعاقب."], [21, "لكن إن بقي حيا يوما أو يومين، لا يعاقب الضارب، لأن العبد ملكه."], [22, "إن تضارب رجال وصدموا امرأة حاملا فأجهضت من غير أن تتأذى، يدفع الصادم غرامة بمقتضى ما يطالب به الزوج ووفقا لقرار القضاة."], [23, "أما إذا تأذت المرأة، تأخذ نفسا بنفس،"], [24, "وعينا بعين، وسنا بسن، ويدا بيد، ورجلا برجل،"], [25, "وكيا بكي، وجرحا بجرح، ورضا برض."], [26, "وإذا ضرب أحد عبده أو أمته، فأتلف عينه، فإنه يطلقه حرا تعويضا له عن عينه"], [27, "وإذا ضرب أحد عبده أو أمته، فأسقط سنه، فإنه يطلقه حرا تعويضا عن سنه."], [28, "إذا نطح ثور رجلا أو امرأة فمات، يرجم الثور حتى الموت ولا تأكلون لحمه، ويكون صاحب الثور بريئا."], [29, "أما إن كان الثور نطاحا من قبل، وسبق إنذار صاحبه، فلم يكبحه، فقتل رجلا أو امرأة، يرجم الثور، ويقتل صاحبه."], [30, "إلا إذا طولب بدفع الدية، فيدفع آنئذ فداء نفسه ما هو متوجب عليه."], [31, "وإذا نطح ابنا أو ابنة، ينفذ فيه هذا الحكم."], [32, "وإذا نطح الثور عبدا أو أمة، فإن صاحبه يدفع ثلاثين قطعة فضة تعويضا لمولاه، ويرجم الثور."], [33, "إن كشف إنسان غطاء بئره، أو حفر بئرا وتركها من غير غطاء، فوقع فيها ثور أو حمار،"], [34, "يقوم صاحب البئر بدفع تعويض عن الخسارة تضاهي ثمنه، ويكون الميت له."], [35, "وإذا نطح ثور إنسان ثور صاحب له فمات الثور، فإنهما يبيعان الثور الحي ويقتسمان ثمنه، وكذلك يقتسمان الثور الميت."], [36, "وأما إذا كان معروفا من قبل، أن الثور نطاح ولم يكبحه صاحبه، فإنه يعوض ثورا بثور، ويكون الثور الميت له."], [1, "وإذا سرق إنسان ثورا أو خروفا وذبحه أو باعه، فعليه أن يعوض صاحب الثور بخمسة ثيران، وصاحب الخروف بأربعة من الغنم."], [2, "إذا ضبط السارق وهو ينقب ليلا وضرب فمات، يذهب دمه هدرا."], [3, "ولكن إن ضبط بعد شروق الشمس وهو ينقب وضرب حتى قتل، يكون الضارب مطالبا بدمه. على اللص أن يدفع تعويضا. إن كان معدما، يباع بسرقته."], [4, "وإذا وجد الحيوان المسروق حيا في حوزته، ثورا كان أم حمارا أم خروفا، يعوض السارق بمثلين."], [5, "إذا سرح إنسان بهائمه لترعى في حقل جاره أو كرمه، فعليه أن يعوض صاحب الحقل أو الكرم من أجود نتاج حقله أو كرمه."], [6, "إذا اندلعت نار وامتدت من الشوك إلى أكداس القمح أو السنابل النامية أو مزروعات الحقول، فعلى من أوقد النار أن يعوض الخسارة."], [7, "إذا أودع إنسان صاحبه فضة أو أمتعة أمانة، ثم سرقت من بيت صاحبه، فعلى السارق إذا اكتشف أمره أن يدفع ضعفي قيمة المسروق كتعويض."], [8, "ولكن إذا لم يقبض على اللص، يمثل صاحب البيت أمام القضاة ليقر روا إن كان هو الذي امتدت يده إلى أمتعة صاحبه."], [9, "في كل قضية حيازة غير شرعية سواء أكانت متعلقة بثوب أم حمار أم خروف أم ثور أم أي شيء مفقود، يدعي شخص ما أنه ملكه، يمثل الطرفان المتنازعان أمام القضاة، ومن يحكم عليه القضاة بالذنب يعوض صاحبه بمثلين."], [10, "إذا أودع إنسان ثورا أو حمارا أو بهيمة أمانة، فمات أو تأذى أو سرق في غفلة."], [11, "يحلف صاحب البيت بالرب أنه لم يمد يده إلى ملك جاره، فيقبل منه صاحبه اليمين ولا يأخذ تعويضا."], [12, "ولكن إن سرق منه بفعل الإهمال فعليه أن يعوض صاحبه."], [13, "أما إذا افترس فعليه أن يأتي بأشلائه شهادة على ذلك، ولا يطالب بالتعويض عن الحيوان المفترس."], [14, "إذا استعار إنسان من صاحبه شيئا فانكسر أو مات في غياب صاحبه، يدفع المستعير تعويضا."], [15, "لكن إن كان صاحب الحيوان حاضرا، فلا يدفع المستعير تعويضا. أما إذا كان الحيوان أو الشيء مستأجرا، فتغطي الأجرة المدفوعة قيمة الخسارة."], [16, "إذا راود رجل عذراء غير مخطوبة، وعاشرها، يدفع مهرها ويتزوجها،"], [17, "وإن أبى والدها قطعيا أن يزوجها منه، يتحتم عليه أيضا أن يدفع له مهر العذارى."], [18, "لا تدع ساحرة تعيش."], [19, "كل من ضاجع بهيمة حتما يقتل."], [20, "من يقرب ذبائح لآلهة غير الرب وحده، يبد."], [21, "لا تضطهد غريبا ولا تضايقه، فقد كنتم غرباء في ديار مصر."], [22, "لا تسيء إلى أرملة أو يتيم،"], [23, "لأ نك إن أسأت إليهما وصرخا إلي أسمع صراخهما،"], [24, "فيحتدم غضبي وأقتلكم بالسيف، فتصبح زوجاتكم أرامل وأولادكم يتامى."], [25, "إن أقرضت فقيرا من شعبي المقيم عندك فلا تعامله كالمرابي، ولا تتقاض منه فائدة."], [26, "إذا استرهنت ثوب صاحبك لقاء دين، فرده إليه عند مغيب الشمس،"], [27, "لأن ذلك الثوب هو ثوبه الذي يقي به بدنه، وإلا فبأي شيء ينام؟ إذا صرخ إلي أسمعه لأني رحيم."], [28, "لا تشتم القضاة ولا تلعن رؤساء شعبك."], [29, "لا تؤخر تقديم باكورة محصول بيدرك ومعصرتك، وأعطني أبكار بنيك."], [30, "وكذلك تفعل ببقرك وغنمك. سبعة أيام تبقي البكر مع أمه، وفي يومه الثامن تقدمه لي."], [31, "وتكونون لي شعبا مقدسا. لا تأكلوا لحم فريسة في الصحراء، بل اطرحوه طعاما للكلاب."], [1, "لا تقبل أخبارا كاذبة، ولا تتعاون مع المنافق في شهادة زور."], [2, "لا تنسق وراء الأغلبية لارتكاب الشر، ولا تحرف شهادتك في دعوى انجرافا مع الأكثرية،"], [3, "ولا تتحيز مع الفقير لأنه فقير فقط في دعواه."], [4, "إذا صادفت ثور عدوك أو حماره شاردا، فرده إليه."], [5, "وإذا عاينت حمار مبغضك واقعا تحت حمله، فلا تتجاوزه حتى تسعف عدوك في حل ثقل حماره."], [6, "لا تحرف حق فقيرك في دعواه لكونه فقيرا."], [7, "اجتنب الاتهام الكاذب ولا تقتل البريء والصالح، لأنني لا أبرىء المذنب."], [8, "لا تقبل رشوة لأن الرشوة تعمي المبصرين وتحرف أقوال الصالحين."], [9, "لا تضايق غريبا لأنكم تعلمون مشاعر الغريب، فقد كنتم غرباء في ديار مصر."], [10, "ازرع أرضك واحصد غلتها ست سنين،"], [11, "ثم أرحها في السنة السابعة واتركها ليأكل منها فقراء شعبك. وما فضل عنهم تقتاته وحوش البرية. وهكذا تفعل أيضا بكرمك وزيتونك."], [12, "اعمل ستة أيام فقط، وفي اليوم السابع تستريح لكي يستريح أيضا ثورك وحمارك، وينتعش ابن أمتك والغريب."], [13, "أطيعوا كل ما أوصيتكم به، ولا تذكروا اسم آلهة أخرى، ولا يتلفظ به فمك."], [14, "ثلاث مرات تحتفل لي في السنة:"], [15, "تحتفل بعيد الفطير فتأكل كما أمرتك فطيرا، مدة سبعة أيام، في الوقت المعين من شهر أبيب (أي شهر آذار ; مارس)، لأنه فيه خرجت من مصر. ولا يمثل أحد أمامي بيدين فارغتين."], [16, "وتحتفل أيضا بعيد الحصاد، حيث تقدم باكورة غلاتك التي زرعتها في الحقل، ثم عيد الجمع في نهاية موسم الحصاد عندما تجمع غلاتك من الحقل."], [17, "ثلاث مرات يمثل جميع الرجال أمام السيد الرب."], [18, "لا تقرب لي دم ذبيحة مع خبز مختمر، ولا يبت شحم ذبائح عيدي إلى صباح الغد."], [19, "أحضر أجود باكورة أرضك إلى بيت إلهك. ولا تطبخ جديا بلبن أمه."], [20, "ها أنا مرسل ملاكي أمامك ليحرسك طوال الطريق، ويقودك إلى الأرض التي أعددتها لك."], [21, "فاصغ إليه وامتثل له ولا تعصه لأنه لا يصفح عن ذنوبكم إذ أن اسمي فيه."], [22, "إن حرصت على الاستماع إلى أقواله وفعلت كل ما قلته، أعادي من يعاديك، وأقاوم مقاوميك،"], [23, "إذ يسير ملاكي أمامك حتى يدخلك بلاد الأموريين والحثيين والفرزيين والكنعانيين والحويين واليبوسيين الذين أنا أبيدهم."], [24, "إياك أن تسجد لآلهتهم، ولا تعبدها، ولا تعمل أعمالهم، بل تبيدهم وتحطم أنصابهم."], [25, "إنما تعبدونني أنا الرب إلهكم فأبارك طعامك وشرابك وأزيل الأمراض من بينكم"], [26, "فلا تكون مجهضة ولا عاقر في أرضك. وأمتعك بكامل عمرك."], [27, "وأجعل هيبتي تتقدمك، أزعج كل أمة تقف في وجهك، وأجعل أعداءك يولون الأدبار أمامك."], [28, "وأبعث الزنابير أمامك، فتطرد الحو يين والكنعانيين والحثيين من قدامك."], [29, "إنما لن أطردهم في سنة واحدة لئلا تقفر الأرض فتتكاثر عليك وحوش البرية،"], [30, "بل أطردهم تدريجيا من أمامك ريثما تنمون وترثون البلاد."], [31, "وأجعل تخومك تمتد من البحر الأحمر إلى ساحل فلسطين، ومن البرية حتى نهر الفرات، وأخضع لك سكان الأرض فتطردهم من أمامك."], [32, "لا تبرم معهم ولا مع آلهتهم ميثاقا،"], [33, "ولا تسكنهم في أرضك لئلا يجعلوك تخطيء إلي، لأنك إن عبدت آلهتهم، فإن ذلك يكون لك فخا»."]]}, {"l": "Lev 1:1-7:38", "n": "", "vs": [[1, "واستدعى الرب موسى، وخاطبه من خيمة الاجتماع:"], [2, "«أوص بني إسرائيل: إذا قدم أحدكم ذبيحة من البهائم للرب، فليكن ذلك القربان من البقر والغنم."], [3, "إن كانت تقدمته محرقة من البقر، فليقرب ثورا سليما، يحضره عند مدخل خيمة الاجتماع، ويقدمه أمام الرب طلبا لرضاه عنه."], [4, "فيضع يده على رأس المحرقة، فيرضى الرب بموت الثور بديلا عن صاحبه، للتكفير عن خطاياه."], [5, "ثم يذبح المقرب العجل أمام الرب. ويقدم بنو هرون، الكهنة، الدم ويرشونه على جوانب المذبح القائم عند مدخل خيمة الاجتماع."], [6, "وعلى المقرب أيضا أن يسلخ المحرقة ويقطعها إلى أجزاء."], [7, "ويوقد أبناء هرون نارا على المذبح ويرتبون عليها حطبا"], [8, "ثم يرتبون فوق حطب نار المذبح أجزاء الثور ورأسه وشحمه."], [9, "أما أعضاؤه الداخلية وأكارعه فيغسلها المقرب بماء، ثم يحرقها الكاهن جميعا على المذبح، فتكون محرقة، وقود رضى تسر الرب."], [10, "وإن كانت محرقته من الماشية: الضأن أو المعز، فلتكن ذكرا سليما."], [11, "وعلى المقرب أن يذبحه في حضرة الرب، عند الجانب الشمالي للمذبح، ثم يقوم أبناء هرون الكهنة برش دمه على جوانب المذبح."], [12, "ويقطعه المقرب إلى أجزاء مع رأسه وشحمه، فيرتبها الكاهن فوق حطب نار المذبح،"], [13, "وأما الأعضاء الداخلية والأكارع فيغسلها بماء، ثم يحرقها الكاهن جميعها فتكون محرقة ووقود رضى تسر الرب."], [14, "وإن كانت تقدمته للرب محرقة من الطير، فلتكن من اليمام أو من أفراخ الحمام."], [15, "فيقدم الكاهن القربان إلى المذبح ويحز رأسه ويصفي دمه على حائط المذبح بعد إيقاد النار على المذبح،"], [16, "وينزع حوصلته مع نثرياتها ويطرحهما إلى جانب المذبح الشرقي، حيث يجمع الرماد."], [17, "ويشق الكاهن الطائر من بين جناحيه، من غير أن يفصله إلى قطعتين، ويحرقه على المذبح فوق حطب النار، فيكون محرقة ووقود رضى تسر الرب."], [1, "وإذا قدم أحد للرب تقدمة من حنطة، فلتكن من دقيق يسكب عليها زيتا ويضع عليها لبانا،"], [2, "ثم يحضرها إلى أبناء هرون الكهنة، فيملأ الكاهن قبضته من دقيق التقدمة وزيتها مع كل لبانها ويوقدها الكاهن تذكارا على المذبح، فتكون وقود محرقة رضى تسر الرب."], [3, "أما بقية التقدمة فتكون من نصيب هرون وأبنائه، فهي تقدمة محرقة مقدسة للرب."], [4, "إن كان القربان تقدمة مخبوزة في تنور، فلتكن أقراصا من دقيق فطيرا ملتوتة أو مدهونة بزيت."], [5, "وإن كان قربانك مخبوزا على الصاج، فلتكن من دقيق فطيرا ملتوتة بزيت."], [6, "قطعها إلى فتات وصب عليها زيتا؛ إنها تقدمة."], [7, "وإن كانت تقدمتك مخبوزة في مقلاة، فلتكن من دقيق معجون بزيت."], [8, "فتحضر التقدمة، سواء أكانت مخبوزة في فرن أم على الصاج أم في مقلاة، إلى الكاهن وهو يقترب بها إلى المذبح."], [9, "ويتناول من التقدمة جزءا تذكاريا ويحرقه على المذبح، فيكون وقود محرقة رضى تسر الرب."], [10, "أما بقية التقدمة فتكون من نصيب هرون وأبنائه، فهي تقدمة محرقة مقدسة للرب."], [11, "لا تضعوا خميرا في كل تقدمة دقيق تقدمونها للرب. كل قربان فيه خمير أو عسل لا تقدموه محرقة للرب."], [12, "يمكن أن تقدموا للرب خبزا مختمرا وعسلا كقرابين بواكير الحصاد، ولكنها لا تصعد على المذبح كمحرقات رضى وسرور."], [13, "عليك أن تملح تقدماتك. إياك أن تخلي تقدمتك من ملح عهد إلهك. مع جميع تقدماتك قرب ملحا."], [14, "وإن قدمت قربانا من بواكير حصادك، فليكن فريكا مشويا بنار، تنزع حبه من رؤوس سنابله الطرية وتجرشه وتشويه، ثم تقدمه باكورة حصادك،"], [15, "بعد أن تصب عليه زيتا وتضع فوقه لبانا. إنه تقدمة."], [16, "ثم يحرق الكاهن منه جزءا تذكاريا مع زيته وجميع لبانه، فيكون محرقة للرب."], [1, "وإن قرب أحد ذبيحة سلام من بقر، ثورا أو عجلة، فليقدم قربانا للرب سليما من كل عيب،"], [2, "فيضع المقرب يده على رأس تقدمته ويذبحها عند باب خيمة الاجتماع، ثم يرش أبناء هرون، الكهنة، الدم على جوانب المذبح، المحيطة به."], [3, "ويحرق الكاهن أمام الرب من ذبيحة السلام، جميع شحم الأعضاء الداخلية"], [4, "والكليتين وشحمهما الذي على الخاصرتين والمرارة."], [5, "فيوقدها أبناء هرون على المذبح، على المحرقة التي فوق حطب النار، فتكون محرقة ووقود رضى تسر الرب."], [6, "وإن قرب ذبيحة سلام من غنم، ذكرا أو أنثى، فليقدم قربانا للرب سليما من كل عيب."], [7, "وإن كان القربان من الضأن، فليقدمه أمام الرب."], [8, "ويضع يده على رأس تقدمته ويذبحها عند خيمة الاجتماع، فيرش أبناء هرون دمها على جوانب المذبح المحيطة به."], [9, "ويحرق الكاهن أمام الرب من ذبيحة السلام شحمها، فينزع كامل الألية من عند العصعص وجميع شحم الأعضاء الداخلية"], [10, "والكليتين وشحمهما الذي على الخاصرتين، والمرارة،"], [11, "ويحرقها الكاهن على المذبح طعام وقود للرب."], [12, "وإن كان قربانه من المعز فليقدمه أمام الرب،"], [13, "فيضع يده على رأس تقدمته ويذبحها عند خيمة الاجتماع، فيرش أبناء هرون دمها على جوانب المذبح المحيطة به."], [14, "ويحرق الكاهن أمام الرب من ذبيحته جميع شحم الأعضاء الداخلية،"], [15, "وينزع كذلك الكليتين وشحمهما الذي على الخاصرتين والمرارة."], [16, "ويحرقها الكاهن على المذبح طعام وقود رضى وسرور، فيكون كل الشحم للرب."], [17, "لا تأكلوا الشحم ولا الدم. هذا فرض دائم عليكم حيث تقيمون، جيلا بعد جيل»."], [1, "وقال الرب لموسى:"], [2, "«أوص بني إسرائيل: إن سهت نفس فأخطأت في أمر من كل نواهي الرب، واقترفت ما لا ينبغي، فهذا ما تفعلونه:"], [3, "إن أخطأ الكاهن الممسوح سهوا، وجلب على الشعب إثما، فليقدم للرب عن خطيئته التي ارتكبها ثورا لا عيب فيه، ذبيحة خطيئة."], [4, "فيحضر الثور إلى مدخل خيمة الاجتماع في حضرة الرب، ويضع يده على رأسه ويذبحه أمام الرب."], [5, "ويأخذ الكاهن الممسوح من دم الثور ويدخل به إلى خيمة الاجتماع،"], [6, "ثم يغمس إصبعه في الدم ويرش منه سبع مرات أمام الرب عند حجاب القدس، الفاصل بين القدس وقدس الأقداس."], [7, "ثم يضع الكاهن بعض الدم على قرون مذبح البخور العطر الذي في داخل القدس في حضرة الرب. أما بقية دم الثور فيصبه عند قاعدة مذبح المحرقة، القائم عند مدخل خيمة الاجتماع."], [8, "وينزع جميع شحم ثور الخطيئة وشحم الأعضاء الداخلية كلها،"], [9, "والكليتين وشحمهما الذي على الخاصرتين والمرارة،"], [10, "على غرار ما يفعل بثور ذبيحة السلام، ويحرقها الكاهن على مذبح المحرقة."], [11, "أما جلد الثور وكل لحمه مع رأسه وأكارعه وأمعائه وفرثه"], [12, "فإنه يحملها إلى خارج المخيم إلى مكان طاهر، حيث يطرح الرماد، فيحرقها كلها على حطب مشتعل فوق مكان إلقاء الرماد."], [13, "وإن أخطأ شعب إسرائيل كله سهوا، واقترفوا إحدى نواهي الرب التي لا ينبغي اقترافها، وأثموا، وكان المجمع غافلا عن الأمر،"], [14, "ثم اكتشف المجمع الخطيئة المرتكبة، عندئذ يقرب المجمع ثورا ذبيحة خطيئة، يحضرونه أمام الرب عند خيمة الاجتماع."], [15, "ويضع شيوخ الشعب أيديهم على رأس الثور في حضرة الرب، ويذبحونه هناك،"], [16, "ويأخذ الكاهن الممسوح من دم الثور ويدخل به إلى خيمة الاجتماع،"], [17, "ثم يغمس إصبعه في الدم ويرش منه سبع مرات أمام الرب عند حجاب «القدس»"], [18, "وكذلك يضع بعض الدم على قرون مذبح البخور العطر الذي في داخل «القدس» في حضرة الرب. أما بقية الدم فيصبه عند قاعدة مذبح المحرقة القائم عند مدخل خيمة الاجتماع."], [19, "وينزع الكاهن جميع شحمه ويحرقه على المذبح."], [20, "ويفعل بالثور كما فعل بثور الخطيئة، فيكفر عنهم الكاهن ويغفر الله لهم."], [21, "ثم يحمل بقية الثور إلى خارج المخيم ويحرقه كما أحرق الثور الأول، فيكون ذبيحة خطيئة عن كل الشعب."], [22, "إن أخطأ أحد قادة الشعب سهوا، واقترف إحدى نواهي الرب التي لا ينبغي اقترافها وأثم،"], [23, "ثم تنبه إلى خطئه الذي ارتكبه، فإنه يحضر قربانا، جديا ذكرا سليما من كل عيب،"], [24, "ويضع يده على رأس الجدي ويذبحه في الجانب الشمالي لمذبح المحرقة، أمام الرب. فيكون ذبيحة خطيئة."], [25, "ويأخذ الكاهن من دم ذبيحة الخطيئة بإصبعه ويضعه على قرون مذبح المحرقة."], [26, "ويحرق جميع شحمه على المذبح، كما فعل بشحم ذبيحة السلام. وهكذا يكفر الكاهن عن خطيئته، فيغفر الرب له."], [27, "وإن أخطأ واحد من عامة الشعب سهوا واقترف إحدى نواهي الرب التي لا ينبغي اقترافها وأثم،"], [28, "ثم نبه إلى خطيئته التي ارتكبها، فإنه يحضر قربانا: عنزا أنثى سليمة من كل عيب للتكفير عن خطيئته التي ارتكبها."], [29, "ويضع يده على رأس ذبيحة الخطيئة ويذبحها عند موضع المحرقة،"], [30, "فيأخذ الكاهن من دمها ويضعه على قرون مذبح المحرقة، ويصب بقية دمها عند قاعدة المذبح."], [31, "ثم ينتزع الكاهن جميع شحمها على غرار ما فعل بشحم ذبيحة السلام، ويحرقها على المذبح تقدمة رضى وسرور للرب فيكفر الكاهن عنه ويغفر الرب له."], [32, "وإن أحضر قربانه من الضأن لتكون ذبيحة خطيئة، فليكن نعجة سليمة من كل عيب،"], [33, "فيضع يده على رأسها ويذبحها قربان خطيئة، في الموضع الذي تذبح فيه المحرقة."], [34, "ويأخذ الكاهن من دم ذبيحة الخطيئة بإصبعه ويضعه على قرون مذبح المحرقة، ويصب بقية الدم عند قاعدة المذبح."], [35, "وينزع جميع شحمها على غرار ما فعل بشحم ذبيحة السلام، ويحرقه على المذبح فوق وقائد الرب. وهكذا يكفر الكاهن عن خطيئته التي ارتكبها، ويغفر الرب له."], [1, "إذا أخطأ أحد لأنه صمت عندما استحلف، ولم يدل بشهادته حول جريمة رآها أو علم بها، فإنه يكون شريكا في الذنب."], [2, "كل من يلمس شيئا نجسا، سواء أكان جثة حيوان محرم أكله، أم جثة وحش أو حشرة محرمة، يكون مذنبا ونجسا، حتى لو لم يعلم أنه لمسها."], [3, "كل من يمس إحدى نجاسات الإنسان التي يتنجس بها، عن غير علم منه، ثم نبه إلى الأمر، يصبح مذنبا."], [4, "كل من يفرط بشفتيه بحلف، للإحسان أو للإساءة من جميع الأحلاف التي يفرط بها اللسان، من غير علم منه، ثم نبه إلى الأمر، يصبح مذنبا في كلا الحالين."], [5, "فكل من يكون مذنبا في أحد هذه الأمور، عليه الإقرار بما أخطأ به،"], [6, "ثم يحضر إلى الرب ذبيحة إثم عن خطيئته التي اقترفها: نعجة أو عنزة، فيكفر الكاهن عن خطيئته."], [7, "وإن كان فقيرا، غير قادر على إحضار شاة، فليقدم إلى الرب ذبيحة عن إثمه الذي ارتكبه يمامتين أو فرخي حمام، فيكون أحدها ذبيحة خطيئة والآخر محرقة،"], [8, "فيأخذ الكاهن ذبيحة الخطيئة أولا، ويقربها بأن يحز رأسها من الخلف ولا يفصله،"], [9, "ويرش بعض دمها على حائط المذبح، ويصفي بقية الدم عند قاعدة المذبح. إنها ذبيحة خطيئة."], [10, "ثم يقدم الثاني محرقة وفقا للنظام المتبع، وهكذا يكفر الكاهن عن خطيئة المذنب ويغفر الرب له."], [11, "وإن كان المذنب أفقر من أن يقدم يمامتين أو فرخي حمام، فليحضر قربانا عن خطيئته. عشر الإيفة (نحو لترين ونصف اللتر) من دقيق ناعم، لا يضع عليه زيتا أو لبانا، لأنه قربان خطيئة،"], [12, "ويقدمه إلى الكاهن، فيملأ منه قبضته للتذكار، ويحرقه على المذبح، على وقائد الرب. إنه قربان خطيئة."], [13, "فيكفر الكاهن بذلك عن أي خطيئة من الخطايا السالفة التي ارتكبها، فيغفر الرب له. أما بقية التقدمة فتكون من نصيب الكاهن على غرار تقدمة الدقيق»."], [14, "قال الرب لموسى:"], [15, "«إن سها أحد وتعدى على واحد من أقداس الرب، يحضر إلى الرب ذبيحة إثم: كبشا سليما، يقدر الكاهن قيمته من الفضة وفقا للمعايير المستعملة في القدس،"], [16, "فيعوض عما أخطأ به من القدس، بعد أن يضيف عليه ما يعادل خمسه غرامة، ويؤديه للكاهن. فيكفر الكاهن عنه بكبش الإثم، ويغفر الرب له."], [17, "إن أخطأ أحد سهوا وارتكب إحدى نواهي الرب التي ينبغي ألا يرتكبها، يكون مذنبا ومسئولا عن إثمه."], [18, "وعليه أن يحضر إلى الكاهن ذبيحة إثم كبشا سليما تقدر أنت ثمنه، فيكفر الكاهن عما ارتكبه المخطيء من سهو على غير علم منه، فيغفر الرب له."], [19, "إنه ذبيحة إثم، إذ قد ارتكب ذنبا في حق الرب»."], [1, "وقال الرب لموسى:"], [2, "«إن أخطأ أحد في حق الرب ورفض أن يرد لصاحبه وديعة أو أمانة أو مسلوبا، أو اغتصب منه شيئا،"], [3, "أو عثر على شيء مفقود وأنكره، أو حلف كاذبا على خطيئة ارتكبها فأثم،"], [4, "فعليه إذا أخطأ وأثم أن يرد ما سلبه أو اغتصبه أو استودعه، أو المفقود الذي عثر عليه،"], [5, "أو كل ما حلف عليه كاذبا، ويعوض قيمة الشيء مضافا إليه خمسه، وفي نفس اليوم يحضر إلى خيمة الاجتماع ذبيحة إثم:"], [6, "كبشا سليما تقدر أنت ثمنه ويأتي به إلى الكاهن،"], [7, "فيكفر عنه الكاهن أمام الرب، فيغفر الرب له ذنبه الذي ارتكبه»."], [8, "وقال الرب لموسى:"], [9, "«وهذا ما توصي به هرون وأبناءه بشأن شريعة تقدمة المحرقة: تترك المحرقة على الموقدة فوق المذبح كل الليل حتى الصباح، ونار المذبح تتوهج عليه."], [10, "ثم يرتدي الكاهن ثوبه وسراويله الكتانية، وينظف المذبح من رماد المحرقة ويضعه إلى جانب المذبح."], [11, "ثم يستبدل ملابسه بملابس أخرى، ويحمل هذا الرماد إلى خارج المخيم إلى مكان طاهر."], [12, "وتظل النار في غضون ذلك تتوهج على المذبح لا تطفأ، لكي يشعل الكاهن بها حطبا كل صباح، ويرتب عليها المحرقة، ويوقد عليها شحم ذبيحة السلام اليومية."], [13, "لتبق النار دائما متقدة على المذبح، لا تنطفيء أبدا."], [14, "وهذه نصوص تعليمات تقدمة الدقيق التي يقربها أبناء هرون في حضرة الرب أمام المذبح:"], [15, "يأخذ الكاهن ملء قبضته من دقيق التقدمة وزيتها وكل اللبان الذي عليها، ويحرقها على المذبح للتذكار، فتكون ذبيحة رضى وسرور للرب."], [16, "أما بقيتها فيأكله هرون وأبناؤه فطيرا في مكان مقدس في دار خيمة الاجتماع."], [17, "يجب ألا يخبز بخميرة، فقد جعلته نصيب الكهنة من محرقاتي. إنها قدس أقداس كذبيحة الخطيئة وذبيحة الإثم."], [18, "كل ذكر من أبناء هرون يأكل منها، فتكون لكم من محرقات الرب فريضة أبدية جيلا بعد جيل، ولا يمسها إلا من كان مقدسا»."], [19, "وقال الرب لموسى:"], [20, "«هذا ما يقربه هرون وأبناؤه للرب يوم تكريسهم كهنة: يقدمون للرب عشر الإيفة (نحو لترين ونصف اللتر) تقدمة دائمة من الدقيق، نصفها في الصباح ونصفها في المساء،"], [21, "معجونة بزيت عجنا جيدا ومخبوزة على صاج ومقطعة إلى فتات، فتقربونها للرب قربان رضى وسرور."], [22, "وعلى كل أبناء الكهنة الذين يتكرسون كهنة عوضا عن والديهم أن يقدموا التقدمة نفسها فريضة أبدية للرب، وتحرق كلها."], [23, "كل تقدمة كاهن تحرق بأجمعها، ولا يؤكل منها»."], [24, "وقال الرب لموسى:"], [25, "«قل لهرون وأبنائه: هذه نصوص تعليمات ذبيحة الخطيئة: تذبح ذبيحة الخطيئة في حضرة الرب، في نفس المكان الذي تذبح فيه المحرقة. إنها قدس أقداس."], [26, "وعلى الكاهن الذي يقربها أن يأكلها في مكان مقدس، في دار خيمة الاجتماع."], [27, "كل من مس لحمها يكون مقدسا. وإذا تناثر دمها على ثوب، تغسل الثوب في موضع مقدس."], [28, "أما إناء الخزف الذي تطبخ فيه فيكسر. أما إن طبخت في إناء نحاسي فيجب أن يجلى ويغسل بماء."], [29, "لا يأكل منها إلا الذكور من أولاد الكهنة لأنها قدس أقداس."], [30, "كل ذبيحة يؤخذ من دمها إلى خيمة الاجتماع للتكفير في القدس لا يؤكل منها بل تحرق كلها بنار."], [1, "وهذه نصوص تعليمات ذبيحة الإثم. إنها قدس أقداس."], [2, "تذبحون ذبيحة الإثم في نفس الموضع الذي تذبحون فيه ذبيحة المحرقة، ويرش دمها على جوانب المذبح المحيطة به."], [3, "ويقرب الكاهن منها كل شحمها: الألية وشحم الأعضاء الداخلية،"], [4, "والكليتين وشحمهما الذي على الخاصرتين وينزع المرارة مع الكليتين،"], [5, "ويحرقها الكاهن على المذبح وقودا للرب. إنها قربان إثم."], [6, "كل ذكر من الكهنة يأكل منها في مكان مقدس، لأنها قدس أقداس."], [7, "وشريعة ذبيحة الإثم مماثلة لذبيحة الخطيئة، إذ تكون من نصيب الكاهن الذي يكفر بها."], [8, "والكاهن الذي يقرب محرقة إنسان يكون جلد المحرقة المقربة من نصيبه أيضا،"], [9, "وكذلك كل تقدمة دقيق مخبوز في فرن أو مقلاة أو على الصاج تكون للكاهن الذي يقربها"], [10, "وكل تقدمة دقيق بزيت أو جافة تكون من نصيب أبناء هرون، توزع عليهم بالتساوي."], [11, "وهذه نصوص تعليمات ذبيحة السلام المقربة إلى الرب:"], [12, "إن قربها أحد لأجل الشكر، فليقدم معها كعكا غير مختمر معجونا بزيت، ورقاق فطير مدهونة بالزيت ودقيقا ملتوتا بزيت."], [13, "فضلا عن أرغفة خبز مختمرة، يقربها مع ذبيحة شكر سلامته."], [14, "وعليه أن يقدم واحدا من كل قربان يرفعه ويرجحه أمام الرب ويكون من نصيب الكاهن الذي يرش دم ذبيحة السلام."], [15, "أما لحم ذبيحة شكر سلامته فيؤكل في نفس يوم تقديم الذبيحة كقربان، لا يبقي منه شيئا إلى الصباح."], [16, "وإذا كانت ذبيحة تقدمته نذرا أو ذبيحة اختيارية أخرى، فإنها تؤكل في يوم تقديمها، وفي اليوم التالي يؤكل ما فضل منها،"], [17, "ويحرق كل ما يتبقى من الذبيحة لليوم الثالث."], [18, "وكل من يأكل من ذبيحة سلامته في اليوم الثالث يكون مذنبا، لأنها تصبح غير مقبولة ولا يحسبها الله لمن قربها إذ تكون نجسة."], [19, "وأي لحم يمس شيئا نجسا لا تأكلوا منه بل أحرقوه بالنار. لا يأكل من اللحم إلا كل طاهر."], [20, "وكل نجس يأكل من لحم ذبيحة السلام المكرسة للرب يستأصل من بين شعبه"], [21, "والنفس التي تمس شيئا نجسا، سواء أكان نجاسة إنسان أم حيوان أم مكروها ما نجسا، ثم تتناول من لحم ذبيحة السلام، تستأصل تلك النفس من بين شعبها»."], [22, "وقال الرب لموسى:"], [23, "«أوص بني إسرائيل: لا تأكلوا كل شحم ثور أو كبش أو ماعز."], [24, "أما شحم الحيوانات الميتة أو المفترسة فاستخدموه في أغراضكم المختلفة، إنما إياكم أن تأكلوا منه."], [25, "من يأكل شحم بهائم المحرقات التي تقدمونها للرب يباد من بين شعبه."], [26, "لا تأكلوا في جميع مساكنكم من دم الطير أو البهائم."], [27, "من يأكل شيئا من الدم يباد من بين شعبه»."], [28, "وقال الرب لموسى:"], [29, "«أوص بني إسرائيل: من يقدم للرب ذبيحة سلامته عليه أن يحضرها بنفسه."], [30, "هو نفسه يأتي بوقائد الرب. يأتي بالشحم والصدر. فيرجح الصدر أمام الرب،"], [31, "أما الشحم فيوقده الكاهن على المذبح، ويكون الصدر من نصيب هرون وبنيه."], [32, "وتقدمون الساق اليمنى من ذبائح سلامتكم إلى الكاهن نصيبا له."], [33, "فمن يقرب دم قربان السلام والشحم من أبناء هرون تكون الساق اليمنى نصيبا له،"], [34, "لأنني قد أخذت صدر الترجيح وساق ذبيحة سلام بني إسرائيل وأعطيتها لهرون الكاهن وأبنائه، فريضة دائمة، جيلا بعد جيل."], [35, "هذا هو نصيب هرون ونصيب أبنائه من محرقات الرب، يوم تكريسهم ليكونوا كهنة للرب."], [36, "وقد أمر الرب أن يعطى لهم يوم تكريسهم من بين بني إسرائيل، فريضة دائمة جيلا بعد جيل."], [37, "تلك هي نصوص تعليمات شريعة المحرقة وتقدمة الدقيق وذبيحة الخطية وذبيحة الإثم، وذبيحة التكريس وذبيحة السلام،"], [38, "التي أوصى الرب بها موسى في جبل سيناء، عندما أمر بني إسرائيل بتقديم قرابينهم للرب في صحراء سيناء»."]]}, {"l": "Psa 147:19", "n": "", "vs": [[19, "يعلن ليعقوب كلمته ولإسرائيل فرائضه وأحكامه."]]}], "kwAr": "فرائضي وأحكامي", "noteAr": ""}], "arS": [["اذكروا", ["H2142"]], [" ", []], ["شريعة", ["H8451"]], [" ", []], ["موسى", ["H4872"]], [" ", []], ["عبدي", ["H5650"]], [" وسائر ", []], ["فرائضي", ["H2706"]], [" ", []], ["وأحكامي", ["H4941"]], [" التي ", []], ["أعطيتها", ["H6680"]], [" في جبل ", []], ["حوريب", ["H2722"]], [" ", []], ["لجميع", ["H3605"]], [" شعب ", []], ["إسرائيل", ["H3478"]], [".", []]]}, {"c": 4, "v": 5, "text": "ها أنا أرسل إليكم إيليا النبي قبل أن يجيء يوم قضاء الرب الرهيب العظيم", "groups": [{"kw": "I will", "raw": "Mal_3:1; Isa_40:3; Mat_11:13, Mat_11:14, Mat_17:10-13, Mat_27:47-49; Mar_9:11-13; Luk_1:17, Luk_7:26-28, Luk_9:30; Joh_1:21, Joh_1:25", "note": "", "refs": [{"l": "Mal 3:1", "n": "", "vs": [[1, "«ها أنا أرسل رسولي فيمهد الطريق أمامي ويأتي الرب الذي تطلبونه فجأة إلى هيكله ويقبل أيضا ملاك العهد الذي تسرون به» يقول الرب القدير"]]}, {"l": "Isa 40:3", "n": "", "vs": [[3, "صوت يصرخ ويقول: «أعدوا في البرية طريق الرب، وأقيموا طريقا مستقيما لإلهنا."]]}, {"l": "Mat 11:13", "n": "", "vs": [[13, "فإن الشريعة والأنبياء تنبأوا جميعا حتى ظهور يوحنا."]]}, {"l": "Mat 11:14", "n": "", "vs": [[14, "وإن شئتم أن تصدقوا، فإن يوحنا هذا، هو إيليا الذي كان رجوعه منتظرا."]]}, {"l": "Mat 17:10-13", "n": "", "vs": [[10, "فسأله تلاميذه: «لماذا إذن يقول الكتبة إن إيليا لابد أن يأتي قبلا؟»"], [11, "فأجابهم قائلا: «حقا، إن إيليا يأتي قبلا ويصلح كل شيء."], [12, "على أني أقول لكم: قد جاء إيليا، ولم يعرفوه، بل فعلوا به كل ما شاءوا. كذلك ابن الإنسان أيضا على وشك أن يتألم على أيديهم»."], [13, "عندئذ فهم التلاميذ أنه كلمهم عن يوحنا المعمدان."]]}, {"l": "Mat 27:47-49", "n": "", "vs": [[47, "فلما سمعه بعض الواقفين هناك، قالوا: «إنه ينادي إيليا!»"], [48, "فركض واحد منهم، وأخذ إسفنجة غمسها في الخل، وثبتها على قصبة وقدم إليه ليشرب؛"], [49, "ولكن الباقين قالوا: «دعه وشأنه! لنر هل يأتي إيليا ليخلصه!»"]]}, {"l": "Mar 9:11-13", "n": "", "vs": [[11, "وسألوه: «لماذا يقول الكتبة إن إيليا لابد أن يأتي قبلا؟»"], [12, "فأجابهم: «حقا، إن إيليا يأتي قبلا ويصلح كل شيء. كذلك جاء في الكتاب أن ابن الإنسان لابد أن يتألم كثيرا ويهان."], [13, "على أني أقول لكم: إن إيليا قد أتى فعلا، وقد عملوا به أيضا كل ما شاءوا، كما جاء عنه في الكتاب! »"]]}, {"l": "Luk 1:17", "n": "", "vs": [[17, "فيتقدم أمامه وله روح إيليا وقدرته، ليرد قلوب الآباء إلى الأولاد، والعصاة إلى حكمة الأبرار، ليهييء للرب شعبا معدا!»"]]}, {"l": "Luk 7:26-28", "n": "", "vs": [[26, "إذن، ماذا خرجتم لتروا؟ أنبيا؟ نعم، أقول لكم، وأعظم من نبي!"], [27, "فهذا هو الذي كتب عنه: إني مرسل قدامك رسولي الذي يمهد لك طريقك."], [28, "فإني أقول لكم: إنه ليس بين من ولدتهم النساء أعظم من يوحنا، ولكن الأصغر في ملكوت الله أعظم منه!»"]]}, {"l": "Luk 9:30", "n": "", "vs": [[30, "وإذا رجلان يتحدثان معه، وهما موسى وإيليا،"]]}, {"l": "Joh 1:21", "n": "", "vs": [[21, "فسألوه: «ماذا إذن؟ هل أنت إيليا؟» قال: «لست إياه!»؛ «أو أنت النبي؟» فأجاب: «لا!»"]]}, {"l": "Joh 1:25", "n": "", "vs": [[25, "فعادوا يسألونه: «إن لم تكن أنت المسيح، ولا إيليا، ولا النبي، فلماذا تعمد إذن؟»"]]}], "kwAr": "ها أنا أرسل", "noteAr": ""}, {"kw": "great", "raw": "Mal_4:1; Joe_2:31; Act_2:19, Act_2:20; Rev_6:17", "note": "", "refs": [{"l": "Mal 4:1", "n": "", "vs": [[1, "«انظروا، ها يوم القضاء مقبل، لاهب كتنور يكون فيه جميع المستكبرين وفاعلي الإثم عصافة، فيحرقهم ذلك اليوم ولا يبقي لهم أصلا ولا فرعا، يقول الرب القدير."]]}, {"l": "Joe 2:31", "n": "", "vs": [[31, "وتتحول الشمس إلى ظلام، والقمر إلى دم، قبل مجيء يوم الرب العظيم المخيف."]]}, {"l": "Act 2:19", "n": "", "vs": [[19, "سأجري عجائب فوق في السماء وعلامات تحت على الأرض، حيث يكون دم ونار ودخان كثيف!"]]}, {"l": "Act 2:20", "n": "", "vs": [[20, "وقبل أن يأتي يوم الرب، ذلك اليوم العظيم الشهير، ستظلم الشمس، ويتحول القمر إلى لون الدم."]]}, {"l": "Rev 6:17", "n": "", "vs": [[17, "فإن يوم الغضب العظيم قد جاءهم، ومن يقوى على الوقوف أمامه؟"]]}], "kwAr": "العظيم", "noteAr": ""}], "arS": [["ها ", []], ["أنا", ["H595"]], [" ", []], ["أرسل", ["H7971"]], [" إليكم ", []], ["إيليا", ["H452"]], [" ", []], ["النبي", ["H5030"]], [" قبل أن ", []], ["يجيء", ["H935"]], [" ", []], ["يوم", ["H3117"]], [" قضاء ", []], ["الرب", ["H3068"]], [" ", []], ["الرهيب", ["H3372"]], [" ", []], ["العظيم", ["H1419"]]]}, {"c": 4, "v": 6, "text": "فيعطف قلب الآباء على أبنائهم وقلب الأبناء على آبائهم، لئلا آتي (إن لم يتوبوا)، وأصيب الأرض باللعنة.", "groups": [{"kw": "turn", "raw": "Luk_1:16, Luk_1:17, Luk_1:76", "note": "", "refs": [{"l": "Luk 1:16", "n": "", "vs": [[16, "ويرد كثيرين من بني إسرائيل إلى الرب إلههم،"]]}, {"l": "Luk 1:17", "n": "", "vs": [[17, "فيتقدم أمامه وله روح إيليا وقدرته، ليرد قلوب الآباء إلى الأولاد، والعصاة إلى حكمة الأبرار، ليهييء للرب شعبا معدا!»"]]}, {"l": "Luk 1:76", "n": "", "vs": [[76, "وأنت، أيها الطفل، سوف تدعى نبي العلي، لأنك ستتقدم أمام الرب لتعد طرقه،"]]}], "kwAr": "فيعطف", "noteAr": ""}, {"kw": "lest", "raw": "Isa_61:2; Dan_9:26, Dan_9:27; Zec_11:6, Zec_13:8, Zec_14:2; Mat_22:7, Mat_23:35-38; Mat_24:27-30; Mar_13:14-26; Luk_19:41-44, Luk_21:22-27", "note": "", "refs": [{"l": "Isa 61:2", "n": "", "vs": [[2, "لأعلن سنة الرب المقبولة، ويوم انتقام لإلهنا، لأعزي جميع النائحين."]]}, {"l": "Dan 9:26", "n": "", "vs": [[26, "وبعد اثنين وستين أسبوعا يقتل المسيح، ولكن ليس من أجل نفسه، ويدمر شعب رئيس آت المدينة والقدس، وتقبل آخرتها كطوفان، وتستمر الحرب حتى النهاية، ويعم الخراب المقضي به."]]}, {"l": "Dan 9:27", "n": "", "vs": [[27, "ويبرم عهدا ثابتا مع كثيرين لمدة أسبوع واحد، ولكنه في وسط الأسبوع يبطل الذبيحة والتقدمة، ويقيم على جناح الهيكل رجاسة الخراب، إلى أن يتم القضاء، فينصب العقاب على المخرب»."]]}, {"l": "Zec 11:6", "n": "", "vs": [[6, "ويقول الرب: «لذلك لا أشفق بعد على سكان الأرض، بل أنا أسلم كل واحد إلى قريبه أو مالكه، فيهلكون الناس ولا أنقذ أحدا من أيديهم»."]]}, {"l": "Zec 13:8", "n": "", "vs": [[8, "يقول الرب فيفنى ثلثا شعب أرضي ويبقى ثلثهم حيا فقط."]]}, {"l": "Zec 14:2", "n": "", "vs": [[2, "لأني أجمع جميع الأمم على أورشليم لتحاربها، فتؤخذ المدينة وتنهب البيوت وتغتصب النساء ويسبى نصف أهلها إلى المنفى. إنما لا ينقرض بقية الشعب من المدينة."]]}, {"l": "Mat 22:7", "n": "", "vs": [[7, "فغضب الملك وأرسل جيوشه، فأهلك أولئك القتلة وأحرق مدينتهم."]]}, {"l": "Mat 23:35-38", "n": "", "vs": [[35, "وبهذا يقع عليكم كل دم زكي سفك على الأرض: من دم هابيل البار إلى دم زكريا بن برخيا الذي قتلتموه بين الهيكل والمذبح."], [36, "الحق أقول لكم: إن عقاب ذلك كله سينزل بهذا الجيل."], [37, "ياأورشليم، ياأورشليم، ياقاتلة الأنبياء وراجمة المرسلين إليها! كم مرة أردت أن أجمع أولادك كما تجمع الدجاجة فراخها تحت جناحيها، فلم تريدوا!"], [38, "ها إن بيتكم يترك لكم خرابا!"]]}, {"l": "Mat 24:27-30", "n": "", "vs": [[27, "فكما أن البرق يومض من الشرق فيضيء في الغرب، هكذا يكون رجوع ابن الإنسان."], [28, "فحيث توجد الجيفة، تتجمع النسور!"], [29, "وحالا بعد الضيقة في تلك الأيام، تظلم الشمس، ويحجب القمر ضوءه، وتتهاوى النجوم من السماء، وتتزعزع قوات السماوات."], [30, "وعندئذ تظهر آية ابن الإنسان في السماء، فتنتحب قبائل الأرض كلها، ويرون ابن الإنسان آتيا على سحب السماء بقدرة ومجد عظيم."]]}, {"l": "Mar 13:14-26", "n": "", "vs": [[14, "فعندما ترون رجاسة الخراب قائمة حيث لا ينبغي، ليفهم القاريء! عندئذ ليهرب الذين في منطقة اليهودية إلى الجبال؛"], [15, "ومن كان على السطح، فلا ينزل إلى البيت ولا يدخل ليأخذ ما في بيته؛"], [16, "ومن كان في الحقل، فلا يرجع ليأخذ ثوبه."], [17, "والويل للحبالى والمرضعات في تلك الأيام!"], [18, "فصلوا لكي لا يقع ذلك في شتاء:"], [19, "فسوف تحدث في تلك الأيام ضيقة لم يحدث مثلها منذ بدء الخليقة التي خلقها الله إلى الآن ولن يحدث."], [20, "ولولا أن الرب قد اختصر تلك الأيام، لما كان أحد من البشر ينجو. ولكنه لأجل المختارين الذين اختارهم، قد اختصر تلك الأيام."], [21, "فإن قال لكم أحد عندئذ: ها إن المسيح هنا! أو: ها هو هناك! فلا تصدقوا."], [22, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."], [23, "فانتبهوا إذن! ها أنا قد أخبرتكم بالأمور كلها قبل حدوثها."], [24, "ولكن في تلك الأيام، بعد تلك الضيقة، تظلم الشمس ويحجب القمر ضوءه،"], [25, "وتتهاوى نجوم السماء، وتتزعزع القوات التي في السماوات."], [26, "وعندئذ سوف يبصرون ابن الإنسان آتيا في السحب بقدرة عظيمة ومجد."]]}, {"l": "Luk 19:41-44", "n": "", "vs": [[41, "ولما اقترب، ورأى المدينة، بكى عليها،"], [42, "قائلا: «ليتك أنت أيضا، في يومك هذا، عرفت ما فيه سلامك! ولكن ذلك محجوب الآن عن عينيك."], [43, "فستأتي عليك أيام يحاصرك فيها أعداؤك بالمتاريس، ويطبقون عليك، ويشددون عليك الحصار من كل جهة،"], [44, "ويهدمونك على أبنائك الذين فيك، فلا يتركون فيك حجرا فوق حجر: لأنك لم تعرفي وقت افتقاد الله لك»."]]}, {"l": "Luk 21:22-27", "n": "", "vs": [[22, "فإن هذه الأيام أيام انتقام يتم فيها كل ما قد كتب."], [23, "ولكن الويل للحبالى والمرضعات في تلك الأيام، لأن ضيقة عظيمة سوف تقع على الأرض وغضبا شديدا سينزل بهذا الشعب،"], [24, "فيسقطون بحد السيف ويساقون أسرى إلى جميع الأمم، وتبقى أورشليم تدوسها الأمم إلى أن تكتمل أزمنة الأمم."], [25, "وستظهر علامات في الشمس والقمر والنجوم، وتكون على الأرض ضيقة على الأمم الواقعة في حيرة، لأن البحر والأمواج تعج وتجيش،"], [26, "ويغمى على الناس من الرعب ومن توقع ما سوف يجتاح المسكونة، إذ تتزعزع قوات السماوات."], [27, "عندئذ يرون ابن الإنسان آتيا في السحاب بقوة ومجد عظيم."]]}], "kwAr": "لئلا آتي", "noteAr": ""}, {"kw": "and smite", "raw": "Deu_29:19-29; Isa_24:6, Isa_43:28, Isa_65:15; Dan_9:11; Zec_5:3, Zec_14:12; Mar_11:21; Heb_6:8, Heb_10:26-31; Rev_22:3, Rev_22:20,Rev_22:21", "note": "", "refs": [{"l": "Deu 29:19-29", "n": "", "vs": [[19, "فإن سمع كلام هذا القسم يستمطر بركة على نفسه قائلا: «سأكون آمنا حتى ولو أصررت على الاستمرار فى سلوك طريقي إن هذا يفضي إلى فناء الأخضر واليابس على حد سواء."], [20, "إن الرب لا يشاء الرفق بمثل هذا الإنسان، بل يحتدم غضبه وغيرته عليه، فتنزل به كل اللعنات المدونة في هذا الكتاب، ويمحو اسمه من تحت السماء."], [21, "ويفرزه الرب من بين أسباط إسرائيل ليهلكه بمقتضى جميع لعنات العهد المدونة في كتاب الشريعة هذا."], [22, "فيشاهد أبناؤكم من الأجيال القادمة، والغرباء الوافدون من أرض بعيدة بلايا تلك الأرض وما يصيبها الرب به من أمراض،"], [23, "إذ تصبح جميع الأرض كبريتا، محترقة لا زرع فيها ولا نبات ولا عشب، وكأنها انقلبت كما جرى لسدوم وعمورة وأدمة وصبوييم، التي قلبها الرب من جراء غضبه وسخطه."], [24, "فتقول جميع الأمم: لماذا فعل الرب هذا كله بهذه الأرض؟ ولماذا احتدام هذا الغضب العظيم؟"], [25, "فيكون الجواب: لأن هذا الشعب نقض عهد الرب إله آبائهم الذي قطعه معهم حين أخرجهم من ديار مصر،"], [26, "وغووا وعبدوا آلهة أخرى وسجدوا لها، آلهة غريبة لم يعرفوها ولم يعطها الرب لهم،"], [27, "فالتهب غضب الرب على تلك الأرض، فصب عليها كل اللعنات المدونة فى هذا الكتاب"], [28, "واجتثهم من أرضهم بغضب وسخط وغيظ عظيم، وطوح بهم إلى أرض أخرى كما هو حادث اليوم."], [29, "إن السرائر للرب إلهنا، أما الوصايا المعلنة فهي لنا ولأبنائنا إلى الأبد، لنعمل بجميع كلمات هذه الشريعة."]]}, {"l": "Isa 24:6", "n": "", "vs": [[6, "لذلك التهمت اللعنة الأرض، وعوقب أهلها بإثمهم، فاحترق سكان الأرض ولم يبق منهم سوى قلة."]]}, {"l": "Isa 43:28", "n": "", "vs": [[28, "لذلك أدنس عظماء مقادسي وأقضي على إسرائيل بالهلاك وأتركه عرضة للخزي والعار."]]}, {"l": "Isa 65:15", "n": "", "vs": [[15, "وتخلفون اسمكم لعنة على شفاه مختاري، ويميتكم الرب ويطلق على عبيده اسما آخر."]]}, {"l": "Dan 9:11", "n": "", "vs": [[11, "قد تعدى كل شعب إسرائيل على شريعتك، وانحرفوا فلم يسمعوا صوتك، فسكبت علينا اللعنة وما أقسمت أن توقعه بنا، كما نصت عليه شريعة موسى عبد الله، لأننا أخطأنا إليك."]]}, {"l": "Zec 5:3", "n": "", "vs": [[3, "فقال لي: «هذه هي اللعنة المنصبة على وجه الأرض كلها. كل من يسرق يستأصل بمقتضى ما هو مدون فيها، وكل حالف زور يعاقب بموجب ما هو منصوص فيها»."]]}, {"l": "Zec 14:12", "n": "", "vs": [[12, "وهذا هو البلاء الذي يعاقب به الرب جميع الشعوب الذين اجتمعوا على أورشليم: تتهرأ لحومهم وهم واقفون على أرجلهم، وتتآكل عيونهم في أوقابها، وتتلف ألسنتهم في أفواههم."]]}, {"l": "Mar 11:21", "n": "", "vs": [[21, "فتذكر بطرس وقال له: «يامعلم، انظر! إن التينة التي لعنتها قد يبست!»"]]}, {"l": "Heb 6:8", "n": "", "vs": [[8, "ولكنها، إن أخرجت الشوك والعشب البري، تكون مرفوضة وتستحق اللعنة، وما نهايتها إلا الحريق."]]}, {"l": "Heb 10:26-31", "n": "", "vs": [[26, "فإن أخطأنا عمدا برفضنا للمسيح بعد حصولنا على معرفة الحق، لا تبقى هناك ذبيحة لغفران الخطايا،"], [27, "بل انتظار العقاب الأكيد في لهيب النار التي ستلتهم المتمردين. ويا له من انتظار مخيف!"], [28, "تعلمون أن من خالف شريعة موسى، كان عقابه الموت دون رحمة، على أن يؤيد مخالفته شاهدان أو ثلاثة."], [29, "ففي ظنكم، كم يكون أشد كثيرا ذلك العقاب الذي يستحقه من يدوس ابن الله، إذ يعتبر أن دم العهد، الذي يتقدس به، هو دم نجس، وبذلك يهين روح النعمة؟"], [30, "فنحن نعرف من قال: «لي الانتقام، أنا أجازي، يقول الرب!» وأيضا: «إن الرب سوف يحاكم شعبه!»"], [31, "حقا ما أرهب الوقوع في يدي الله الحي!"]]}, {"l": "Rev 22:3", "n": "", "vs": [[3, "لن تكون فيما بعد لعنة أبدا. لأن عرش الله والحمل قائم في المدينة، حيث يخدمه عبيده"]]}, {"l": "Rev 22:20", "n": "", "vs": [[20, "والذي يشهد بهذه الأمور يقول: «نعم! أنا آت سريعا»."]]}, {"l": "Rev 22:21", "n": "", "vs": [[21, "ولتكن نعمة ربنا يسوع المسيح معكم جميعا."]]}], "kwAr": "وأصيب الأرض باللعنة", "noteAr": ""}], "arS": [["فيعطف", ["H7725"]], [" ", []], ["قلب", ["H3820"]], [" ", []], ["الآباء", ["H1"]], [" على ", []], ["أبنائهم", ["H1121"]], [" ", []], ["وقلب", ["H3820"]], [" ", []], ["الأبناء", ["H1121"]], [" على ", []], ["آبائهم", ["H1"]], ["، لئلا ", []], ["آتي", ["H935"]], [" (إن لم يتوبوا)، ", []], ["وأصيب", ["H5221"]], [" ", []], ["الأرض", ["H776"]], [" ", []], ["باللعنة", ["H2764"]], [".", []]]}], "strong": true}];</script>
