ي سكيبا فوق ذبيحة إيمانكم وخدمته، فإني أفرح وأبتهج معكم جميعا."]]}, {"l": "Phi 4:18", "n": "", "vs": [[18, "فالآن عندي كل ما يسد حاجتي ويزيد عنها. أنا في بحبوحة إذ تسلمت من أبفروديتس ما بعثتم به إلي، عطرا طيب الرائحة، ذبيحة يقبلها الله ويسر بها."]]}, {"l": "2Ti 4:6", "n": "", "vs": [[6, "وأما أنا، فها إن حياتي بدأت تسكب سكيبا، وموعد رحيلي قد اقترب."]]}, {"l": "Heb 13:15", "n": "", "vs": [[15, "فبالمسيح، رئيس كهنتنا، لنقرب لله دائما ذبيحة الحمد والتسبيح، أي الثمار التي تنتجها أفواهنا المعترفة باسمه."]]}, {"l": "Heb 13:16", "n": "", "vs": [[16, "ولا تغفلوا أيضا عن عمل الخير وإعانة المحتاجين: لأن مثل هذه «الذبائح» تسر الله جدا!"]]}, {"l": "1Pe 2:5", "n": "", "vs": [[5, "إذن اتحدوا به كحجارة حية، مبنيين بيتا روحيا، تكونون فيه كهنة مقدسين تقدمون لله ذبائح روحية مقبولة لديه بفضل يسوع المسيح."]]}, {"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}], "kwAr": "بقلوب طاهرة", "noteAr": ""}], "arS": [["فيجلس", ["H3427"]], [" ", []], ["ممحصا", ["H6884"]], [" ", []], ["ومنقيا", ["H2891"]], [" ", []], ["للفضة", ["H3701"]], [" ", []], ["ليطهر", ["H2891"]], [" ", []], ["أبناء", ["H1121"]], [" ", []], ["لاوي", ["H3878"]], [" ", []], ["ويمحصهم", ["H2212"]], [" ", []], ["كالفضة", ["H3701"]], [" ", []], ["والذهب", ["H2091"]], ["، حتى ", []], ["يقربوا", ["H5066"]], [" ", []], ["للرب", ["H3068"]], [" ", []], ["تقدمات", ["H4503"]], [" بقلوب ", []], ["طاهرة", ["H6666"]], [".", []]]}, {"c": 3, "v": 4, "text": "عندئذ تكون تقدمة يهوذا وشعب أورشليم مرضية عند الرب، كالعهد بها في سالف الأيام وفي السنين الغابرة.", "groups": [{"kw": "the offering", "raw": "Isa_1:26, Isa_1:27, Isa_56:7; Jer_30:18-20, Jer_31:23, Jer_31:24; Eze_20:40,Eze_20:41, Eze_43:26, Eze_43:27; Zec_8:3, Zec_14:20,Zec_14:21", "note": "", "refs": [{"l": "Isa 1:26", "n": "", "vs": [[26, "وأعيد قضاتك كما كانوا في الحقب الغابرة، ومشيريك كما كانوا في العهود الأولى. عندئذ تدعين مدينة العدل، المدينة الأمينة."]]}, {"l": "Isa 1:27", "n": "", "vs": [[27, "فتفدى صهيون بالحق، وتائبوها بالبر."]]}, {"l": "Isa 56:7", "n": "", "vs": [[7, "فهؤلاء آتي بهم إلى جبلي المقدس وأفيض عليهم الفرح في بيت صلاتي، وتكون محرقاتهم وقرابينهم مقبولة على مذبحي، لأن بيتي سيدعى بيت الصلاة لجميع الأمم."]]}, {"l": "Jer 30:18-20", "n": "", "vs": [[18, "وهذا ما يعلنه الرب: «ها أنا أرد سبي ذرية يعقوب إلى منازلهم، وأرحم مساكنهم، فتبنى المدينة على رابيتها، وينتصب القصر كالعهد به."], [19, "وتصدر عنهم ترانيم الشكر مع أهازيج أصوات المطربين، وأكثرهم فلا يكونون قلة، وأكرمهم فلا يستذلون."], [20, "ويكون أبناؤهم مفلحين كما في العهد الغابر، ويثبت جمهورهم أمامي، وأعاقب جميع مضايقيهم."]]}, {"l": "Jer 31:23", "n": "", "vs": [[23, "وهذا ما يعلنه الرب القدير إله إسرائيل: «سيرددون هذه العبارة مرة أخرى في أرض يهوذا وفي أرجاء مدنها، عندما أردهم من سبيهم: ليباركك الرب يامسكن البر، ياأيها الجبل المقدس."]]}, {"l": "Jer 31:24", "n": "", "vs": [[24, "فيقيم هناك يهوذا وكل أهل مدنه والفلاحون والسارحون بقطعانهم."]]}, {"l": "Eze 20:40", "n": "", "vs": [[40, "لأنه في جبل قدسي، جبل إسرائيل الشامخ، هناك يعبدوني في الأرض شعب إسرائيل كلهم. هناك أرضى عنهم وألتمس تقدماتكم وباكورة غلاتكم مع جميع مقدساتكم."]]}, {"l": "Eze 20:41", "n": "", "vs": [[41, "وأرضى عنكم كرائحة سرور حين أخرجكم من بين الشعوب، وأجمعكم من البلدان التي تشتتم إليها، وأتجلى بقداستي بينكم على مشهد من الأمم."]]}, {"l": "Eze 43:26", "n": "", "vs": [[26, "فتكفرون عن المذبح وتطهرونه وتكرسونه سبعة أيام."]]}, {"l": "Eze 43:27", "n": "", "vs": [[27, "وفي اليوم الثامن وما يليه من أيام بعد إتمام أسبوع التطهير، يقرب الكهنة على المذبح محرقاتكم وذبائح سلامكم، فأرضى عنكم يقول السيد الرب."]]}, {"l": "Zec 8:3", "n": "", "vs": [[3, "لهذا يقول الرب القدير: ها أنا عائد إلى صهيون لأقيم في أورشليم، فتدعى آنئذ مدينة الحق، كما يدعى جبل الرب القدير الجبل المقدس."]]}, {"l": "Zec 14:20", "n": "", "vs": [[20, "وينقش في ذلك اليوم على أجراس الخيل: «قدس للرب». وتكون القدور في الهيكل مقدسة كالمناضح التي أمام المذبح."]]}, {"l": "Zec 14:21", "n": "", "vs": [[21, "بل يكون كل قدر في أورشليم وفي يهوذا مقدسا للرب القدير، فيصبح في وسع المقربين أن يأتوا ويستخدموا ما يشاؤون منها، ليطبخوا فيها لحم الذبيحة. ولا يبقى في هيكل الرب القدير تجار في ذلك اليوم."]]}], "kwAr": "تقدمة يهوذا", "noteAr": ""}, {"kw": "as", "raw": "1Ch_15:26, 1Ch_16:1-3, 1Ch_21:26, 1Ch_29:20-22; 2Ch_1:6, 2Ch_7:1-3, 2Ch_7:10-12; 2Ch_8:12-14, 2Ch_29:31-36, 2Ch_30:21-27, 2Ch_31:20,2Ch_31:21; Jer_2:2, Jer_2:3", "note": "", "refs": [{"l": "1Ch 15:26", "n": "", "vs": [[26, "وإذ أعان الله اللاويين حاملي تابوت عهد الرب ذبحوا سبعة عجول وسبعة كباش."]]}, {"l": "1Ch 16:1-3", "n": "", "vs": [[1, "ثم أدخلوا تابوت الله إلى الخيمة التي نصبها داود، ووضعوه في وسطها وقربوا محرقات وذبائح سلام لله."], [2, "وبعد أن انتهى داود من تقديم المحرقات وذبائح السلام بارك الشعب باسم الرب."], [3, "ووزع على كل الإسرائيليين من رجال ونساء وسائر الحاضرين رغيف خبز وكأس خمر وقرص زبيب."]]}, {"l": "1Ch 21:26", "n": "", "vs": [[26, "وبنى هناك مذبحا للرب أصعد عليه محرقات وذبائح سلام، ودعا الرب فاستجاب له بإنزال نار من السماء على مذبح المحرقة."]]}, {"l": "1Ch 29:20-22", "n": "", "vs": [[20, "ثم قال داود للجمع الحاضر: «باركوا الرب إلهكم». فسبح كل الجمع الرب إله آبائهم وسجدوا للرب وللملك."], [21, "وفي اليوم الثاني قربوا للرب ذبائح وقدموا محرقات: ألف ثور، وألف كبش، وألف خروف مع سكائب خمرها، وذبائح أخرى كثيرة عن إسرائيل."], [22, "واحتفلوا في ذلك اليوم أمام الرب آكلين شاربين بفرح عظيم، وبايعوا سليمان بن داود ثانية ملكا عليهم، ومسحوه للرب رئيسا، واختاروا صادوق كاهنا."]]}, {"l": "2Ch 1:6", "n": "", "vs": [[6, "وأصعد سليمان ألف محرقة أمام الرب على مذبح النحاس الذي في خيمة الاجتماع."]]}, {"l": "2Ch 7:1-3", "n": "", "vs": [[1, "وما إن أتم سليمان صلاته حتى نزلت نار من السماء التهمت المحرقة والذبائح، وملأ مجد الرب الهيكل،"], [2, "ولم يتمكن الكهنة من الدخول إلى بيت الرب، لأن مجد الرب ملأه."], [3, "وشهد جميع بني إسرائيل نزول النار ومجد الرب على الهيكل، فخروا على وجوههم ساجدين على بلاط الأرض المجزع، وحمدوا الرب لأنه صالح، ولأن رحمته إلى الأبد تدوم."]]}, {"l": "2Ch 7:10-12", "n": "", "vs": [[10, "ثم صرف الشعب إلى بيوتهم في اليوم الثالث والعشرين من الشهر السابع، فانطلقوا بقلوب يغمرها الفرح والغبطة من أجل كل الخيرات التي أبداها الرب نحو داود وسليمان وإسرائيل شعبه."], [11, "وهكذا أكمل سليمان إقامة الهيكل وقصر الملك، وحالفه النجاح في كل ما خطط أن يبنيه فيهما."], [12, "وتجلى الرب لسليمان ليلا وقال له: «قد استجبت صلاتك، واخترت هذا المكان لي ليكون هيكلا للذبائح."]]}, {"l": "2Ch 8:12-14", "n": "", "vs": [[12, "ثم قرب سليمان محرقات للرب على المذبح الذي شيده أمام الرواق،"], [13, "فكانت المحرقات تقدم كل يوم بموجب ما نصت عليه وصية موسى، وفي السبوت، وفي مطلع كل شهر قمري، ومواسم الأعياد الثلاثة السنوية: عيد الفطير، وعيد الحصاد، وعيد المظال."], [14, "ونظم خدمات وواجبات فرق الكهنة واللاويين بمقتضى ما رتبه أبوه داود، فكان اللاويون يقومون بالتسبيح والخدمة تحت إشراف الكهنة، وحراسة الأبواب حسب فرقهم كل يوم بيومه، تنفيذا لأوامر داود رجل الله."]]}, {"l": "2Ch 29:31-36", "n": "", "vs": [[31, "ثم قال حزقيا للحاضرين: «الآن قد كرستم أنفسكم للرب، فهاتوا ذبائح وقرابين الشكر لهيكل الرب». فأقبلت الجماعة بذبائح وقرابين شكر، وأتى كل سخي بمحرقات."], [32, "وبلغت جملة ما تقدمت به الجماعة من محرقات سبعين ثورا ومئة كبش ومئتي خروف، قربت جميعها محرقات للرب."], [33, "أما الذبائح المخصصة كأقداس فقد بلغ عددها ست مئة من البقر وثلاثة آلاف من الضأن."], [34, "ولما كان عدد الكهنة غير كاف للقيام بسلخ كل تلك المحرقات، ساعدهم اللاويون حتى اكتمل العمل، وحتى تطهر بقية الكهنة، لأن اللاويين كانوا أكثر اهتماما بتطهير أنفسهم من الكهنة."], [35, "وفضلا عن المحرقات الكثيرة فقد توافر شحم ذبائح السلام وسكائب خمر المحرقات. وهكذا عادت العبادة في الهيكل إلى سابق عهدها."], [36, "وابتهج حزقيا وجميع الشعب بما أنعم الرب به عليهم، لأن الأمر حدث بصورة مفاجئة."]]}, {"l": "2Ch 30:21-27", "n": "", "vs": [[21, "واحتفل بنو إسرائيل الحاضرون في أورشليم بفرح عظيم بعيد الفطير سبعة أيام، سبح فيها اللاويون والكهنة، يوما فيوما، بآلات حمد للرب."], [22, "وعزى حزقيا بكلمات التشجيع قلوب اللاويين الذين أبدوا فطنة في خدمة الرب. وظلوا يأكلون نصيبهم سبعة أيام، ويقربون ذبائح سلام حامدين الرب إله آبائهم."], [23, "ثم اتفقوا على الاستمرار بالاحتفال سبعة أيام أخرى قضوها بفرح عظيم،"], [24, "لأن حزقيا تبرع للجماعة بألف ثور وسبعة آلاف من الضأن، كما تبرع رؤساء الشعب بألف ثور وعشرة آلاف من الضأن، وتطهر عدد كبير من الكهنة."], [25, "وعمت البهجة كل جماعة يهوذا والكهنة واللاويين، وكل الوافدين من إسرائيل، والغرباء القادمين من أرض إسرائيل المقيمين في يهوذا."], [26, "وغمرت الفرحة العظيمة أورشليم لأنه لم يحتفل بمثل هذا في أورشليم منذ أيام سليمان بن داود."], [27, "ووقف الكهنة واللاويون وطلبوا البركة على الشعب فاستجاب الرب صلاتهم التي صعدت إلى مسكن قدسه في السماء."]]}, {"l": "2Ch 31:20", "n": "", "vs": [[20, "هذا ما أجراه حزقيا في كل بلاد يهوذا، صانعا كل ما هو صالح وقويم وحق أمام الرب إلهه."]]}, {"l": "2Ch 31:21", "n": "", "vs": [[21, "وكل ما قام به في خدمة بيت الله كان طاعة للشريعة والوصية، وسعيا وراء طلب الله، بكل ولاء، فأفلح."]]}, {"l": "Jer 2:2", "n": "", "vs": [[2, "«امض وأعلن في مسامع أهل أورشليم هاتفا: هذا ما يقوله الرب: قد ذكرت لك ولاء صباك، ومحبتك كعروس لي، وكيف تبعتني في البرية في أرض لا زرع فيها."]]}, {"l": "Jer 2:3", "n": "", "vs": [[3, "كان إسرائيل مقدسا للرب وباكورة غلته، وكل من يعتدي عليه، يرتكب إثما ويحل به شر."]]}], "kwAr": "كالعهد بها", "noteAr": ""}, {"kw": "former", "raw": "or, ancient", "note": "or, ancient", "refs": [], "kwAr": "الغابرة", "noteAr": "أو: «قديمة»."}], "arS": [["عندئذ تكون ", []], ["تقدمة", ["H4503"]], [" ", []], ["يهوذا", ["H3063"]], [" وشعب ", []], ["أورشليم", ["H3389"]], [" ", []], ["مرضية", ["H6149"]], [" عند ", []], ["الرب", ["H3068"]], ["، كالعهد بها في ", []], ["سالف", ["H5769"]], [" ", []], ["الأيام", ["H3117"]], [" وفي ", []], ["السنين", ["H8141"]], [" ", []], ["الغابرة", ["H6931"]], [".", []]]}, {"c": 3, "v": 5, "text": "وأقترب منكم لأكون شاهدا سريعا ضد السحرة والزناة والحالفين بالزور والمستغلين لأجرة العامل ومضطهدي الأرامل والأيتام، والذين يظلمون الغرباء ولا يخافونني", "groups": [{"kw": "I will come", "raw": "Mal_2:17; Psa_50:3-6, Psa_96:13, Psa_98:9; Eze_34:20-22; Heb_10:30,Heb_10:31; Jam_5:8, Jam_5:9; Jud_1:14, Jud_1:15", "note": "", "refs": [{"l": "Mal 2:17", "n": "", "vs": [[17, "قد أتعبتم الرب بكلامكم، وما برحتم تتساءلون: كيف أتعبناه؟ أتعبتموه بقولكم: كل من يرتكب الشر هو صالح في عيني الرب وهو يسر بهم، أو بسؤالكم: أين هو إله العدل؟»"]]}, {"l": "Psa 50:3-6", "n": "", "vs": [[3, "يأتي إلهنا ولا يصمت، تحيط به النار الآكلة والعواصف الثائرة."], [4, "ينادي السماوات من العلى، والأرض أيضا من تحت لكي يدين شعبه، قائلا:"], [5, "«اجمعوا إلي أتقيائي الذين قطعوا معي عهدا على ذبيحة»."], [6, "فتذيع السماوات عدله لأن الله هو الديان."]]}, {"l": "Psa 96:13", "n": "", "vs": [[13, "في حضرة الرب لأنه آت ليدين العالم بالعدل والشعوب بالحق."]]}, {"l": "Psa 98:9", "n": "", "vs": [[9, "أمام الرب لأنه جاء ليدين الأرض بالعدل والشعوب بالإنصاف."]]}, {"l": "Eze 34:20-22", "n": "", "vs": [[20, "لذلك ها أنا أقضي بين الشاة السمينة والشاة الهزيلة،"], [21, "لأنكم دفعتم بالجنب والكتف الشاة المريضة ونطحتموها بقرونكم حتى شتتموها إلى خارج."], [22, "ولكني أنقذ غنمي فلا تكون من بعد غنيمة، وأقضي بين شاة وشاة،"]]}, {"l": "Heb 10:30", "n": "", "vs": [[30, "فنحن نعرف من قال: «لي الانتقام، أنا أجازي، يقول الرب!» وأيضا: «إن الرب سوف يحاكم شعبه!»"]]}, {"l": "Heb 10:31", "n": "", "vs": [[31, "حقا ما أرهب الوقوع في يدي الله الحي!"]]}, {"l": "Jam 5:8", "n": "", "vs": [[8, "فاصبروا أنتم إذن، وشددوا قلوبكم لأن عودة الرب قد صارت قريبة."]]}, {"l": "Jam 5:9", "n": "", "vs": [[9, "أيها الإخوة، لا تتذمروا بعضكم على بعض، لكي لا يصدر الحكم ضدكم. تذكروا دائما أن الديان قريب جدا، إنه أمام الباب."]]}, {"l": "Jud 1:14", "n": "", "vs": [[14, "عن هؤلاء وأمثالهم، تنبأ أخنوخ السابع بعد آدم، فقال: «انظروا إن الرب آت بصحبة عشرات الألوف من قديسيه،"]]}, {"l": "Jud 1:15", "n": "", "vs": [[15, "ليدين جميع الناس، ويوبخ جميع الأشرار الذين لا يهابون الله ، بسبب جميع أعمالهم الشريرة التي ارتكبوها وجميع أقوالهم القاسية التي أهانوه بها والتي لا تصدر إلا عن الخاطئين الأشرار غير الأتقياء!»"]]}], "kwAr": "وأقترب منكم", "noteAr": ""}, {"kw": "a swift", "raw": "Mal_2:14; Psa_50:7, Psa_81:8; Jer_29:23; Mic_1:2; Matt. 23:14-35", "note": "", "refs": [{"l": "Mal 2:14", "n": "", "vs": [[14, "وتتساءلون: لماذا؟ لأن الرب كان شاهدا على العهد المقطوع بينك وبين زوجة صباك التي غدرت بها، مع أنها شريكتك وامرأة عهدك."]]}, {"l": "Psa 50:7", "n": "", "vs": [[7, "اسمع ياشعبي فأتكلم. ياإسرائيل إني أشهد عليك: «أنا الله إلهك."]]}, {"l": "Psa 81:8", "n": "", "vs": [[8, "اسمع ياشعبي فأحذرك، ياإسرائيل هلا سمعت لي؟"]]}, {"l": "Jer 29:23", "n": "", "vs": [[23, "لأنهما ارتكبا الفواحش في إسرائيل وزنيا مع نساء أصحابهما وتنبآ باسمي نبوءات كاذبة لم آمرهما بها. فأنا العارف والشاهد» يقول الرب."]]}, {"l": "Mic 1:2", "n": "", "vs": [[2, "اسمعوا ياجميع الشعوب، وأصغي أيتها الأرض وكل من فيها، وليكن السيد الرب من هيكله المقدس شاهدا عليكم."]]}, {"l": "Mat 23:14-35", "n": "", "vs": [[14, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تلتهمون بيوت الأرامل وتتذرعون بإطالة صلواتكم. لذلك ستنزل بكم دينونة أقسى!"], [15, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تطوفون البحر والبر لتكسبوا متهودا واحدا؛ فإذا تهود جعلتموه أهلا لجهنم ضعف ما أنتم عليه!"], [16, "الويل لكم أيها القادة العميان! تقولون: من أقسم بالهيكل، فقسمه غير ملزم؛ أما من أقسم بذهب الهيكل، فقسمه ملزم!"], [17, "أيها الجهال والعميان! أي الاثنين أعظم: الذهب أم الهيكل الذي يجعل الذهب مقدسا؟"], [18, "وتقولون: من أقسم بالمذبح، فقسمه غير ملزم؛ أما من أقسم بالقربان الذي على المذبح، فقسمه ملزم!"], [19, "أيها العميان! أي الاثنين أعظم: القربان أم المذبح الذي يجعل القربان مقدسا؟"], [20, "فإن من أقسم بالمذبح، فقد أقسم به وبكل ما عليه؛"], [21, "ومن أقسم بالهيكل، فقد أقسم به وبالساكن فيه؛"], [22, "ومن أقسم بالسماء، فقد أقسم بعرش الله وبالجالس عليه!"], [23, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تؤدون حتى عشور النعنع والشبث والكمون، وقد أهملتم أهم ما في الشريعة: العدل والرحمة والأمانة. كان يجب أن تفعلوا هذه ولا تغفلوا تلك!"], [24, "أيها القادة العميان! إنكم تصفون الماء من البعوضة، ولكنكم تبلعون الجمل!"], [25, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تنظفون الكأس والصحفة من الخارج، ولكنهما من الداخل ممتلئتان بما كسبتم بالنهب والطمع!"], [26, "أيها الفريسي الأعمى، نظف أولا داخل الكأس ليصير خارجها أيضا نظيفا!"], [27, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم كالقبور المطلية بالكلس: تبدو جميلة من الخارج، ولكنها من الداخل ممتلئة بعظام الموتى وكل نجاسة!"], [28, "كذلك أنتم أيضا، تبدون للناس أبرارا، ولكنكم من الداخل ممتلئون بالرياء والفسق!"], [29, "«الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تبنون قبور الأنبياء وتزينون مدافن الأبرار،"], [30, "وتقولون: لو عشنا في زمن آبائنا لما شاركناهم في سفك دم الأنبياء."], [31, "فبهذا تشهدون على أنفسكم بأنكم أبناء قاتلي الأنبياء!"], [32, "فأكملوا ما بدأه آباؤكم ليطفح الكيل!"], [33, "أيها الحيات، أولاد الأفاعي! كيف تفلتون من عقاب جهنم؟"], [34, "لذلك: ها أنا أرسل إليكم أنبياء وحكماء ومعلمين، فبعضهم تقتلون وتصلبون، وبعضهم تجلدون في مجامعكم، وتطاردونهم من مدينة إلى أخرى."], [35, "وبهذا يقع عليكم كل دم زكي سفك على الأرض: من دم هابيل البار إلى دم زكريا بن برخيا الذي قتلتموه بين الهيكل والمذبح."]]}], "kwAr": "شاهدا سريعا", "noteAr": ""}, {"kw": "the sorcerers", "raw": "Lev_20:6, Lev_20:10,Lev_20:27; Deu_5:11, Deu_5:17-21; Jer_7:9, Jer_7:10; Eze_22:6-12; Zec_5:3, Zec_5:4; 1Co_6:9, 1Co_6:10; Gal_5:19-21; Heb_13:4; Rev_21:8, Rev_22:15", "note": "", "refs": [{"l": "Lev 20:6", "n": "", "vs": [[6, "وكل نفس غوت وراء أصحاب الجان وتعلقت بالتوابع خيانة لي، أنقلب على تلك النفس وأستأصلها من بين شعبها."]]}, {"l": "Lev 20:10", "n": "", "vs": [[10, "إذا زنى رجل مع امرأة قريبه، فالزاني والزانية يقتلان."]]}, {"l": "Lev 20:27", "n": "", "vs": [[27, "أي رجل أو امرأة يمارس الوساطة مع الجان أو مناجاة الأرواح، ارجموه ويكون دمه على رأسه»."]]}, {"l": "Deu 5:11", "n": "", "vs": [[11, "لا تنطق باسم الرب إلهك باطلا، لأن الرب لا يبريء من ينطق باسمه باطلا."]]}, {"l": "Deu 5:17-21", "n": "", "vs": [[17, "لا تقتل."], [18, "لا تزن."], [19, "لا تسرق."], [20, "لا تشهد على جارك شهادة زور."], [21, "لا تشته امرأة غيرك ولا بيته ولا حقله ولا عبده ولا أمته ولا ثوره ولا حماره ولا كل ما له."]]}, {"l": "Jer 7:9", "n": "", "vs": [[9, "أتسرقون وتقتلون وتزنون وتحلفون زورا وتبخرون للبعل، وتضلون وراء الأوثان التي لم تعرفوها،"]]}, {"l": "Jer 7:10", "n": "", "vs": [[10, "ثم تمثلون في حضرتي في هذا الهيكل الذي دعي باسمي قائلين: «قد نجونا»؛ ثم ترتكبون جميع هذه الرجاسات؟"]]}, {"l": "Eze 22:6-12", "n": "", "vs": [[6, "هوذا كل واحد من رؤساء إسرائيل ممن كانوا فيك انهمك في سفك الدماء على قدر طاقته."], [7, "فيك استخفوا بأب وأم وجاروا في وسطك على الغريب، واضطهدوا اليتيم والأرملة،"], [8, "احتقرت مقدساتي ونجست أيام سبوتي."], [9, "أقام فيك وشاة عملوا على سفك الدم، وأكلوا أمام الأصنام على الجبال، وارتكبوا في وسطك الموبقات."], [10, "فيك فضح الإنسان عري أبيه، وفيك أذلوا من برحت متنجسة بطمثها."], [11, "فيك إنسان زنى مع امرأة قريبه، واقترف إنسان الرذيلة مع كنته، وفيك ضاجع إنسان أخته ابنة أبيه."], [12, "فيك أخذوا الرشوة لقاء سفك الدماء. أخذت الربا ومال الحرام، وسلبت أقرباءك ظلما ونسيتني، يقول السيد الرب."]]}, {"l": "Zec 5:3", "n": "", "vs": [[3, "فقال لي: «هذه هي اللعنة المنصبة على وجه الأرض كلها. كل من يسرق يستأصل بمقتضى ما هو مدون فيها، وكل حالف زور يعاقب بموجب ما هو منصوص فيها»."]]}, {"l": "Zec 5:4", "n": "", "vs": [[4, "ويقول الرب القدير: «إني أصب هذه اللعنة على بيت كل سارق أو حالف باسمي زورا، فتحل في وسط بيته وتبيده مع خشبه وحجره»."]]}, {"l": "1Co 6:9", "n": "", "vs": [[9, "أما تعلمون أن الظالمين لن يرثوا ملكوت الله؟ لا تضلوا: فإن ملكوت الله لن يرثه الزناة ولا عابدو الأصنام ولا الفاسقون ولا المتخنثون ولا مضاجعو الذكور"]]}, {"l": "1Co 6:10", "n": "", "vs": [[10, "ولا السراقون ولا الطماعون ولا السكيرون ولا الشتامون ولا المغتصبون."]]}, {"l": "Gal 5:19-21", "n": "", "vs": [[19, "أما أعمال الجسد فظاهرة، وهي: الزنى والنجاسة والدعارة،"], [20, "وعبادة الأصنام والسحر، والعداوة والنزاع والغيرة والغضب، والتحزب والانقسام والتعصب،"], [21, "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!"]]}, {"l": "Heb 13:4", "n": "", "vs": [[4, "حافظوا جميعا على كرامة الزواج، مبعدين النجاسة عن الفراش. فإن الله سوف يعاقب الذين ينغمسون في خطايا الدعارة والزنى."]]}, {"l": "Rev 21:8", "n": "", "vs": [[8, "أما الجبناء وغير المؤمنين، والفاسدون والقاتلون والزناة، والمتصلون بالشياطين وعبدة الأصنام وجميع الدجالين، فمصيرهم إلى البحيرة المتقدة بالنار والكبريت، الذي هو الموت الثاني»."]]}, {"l": "Rev 22:15", "n": "", "vs": [[15, "أما في خارج المدينة، فهنالك الكلاب والمتصلون بالشياطين، والزناة والقتلة، وعبدة الأصنام والدجالون ومحبو التدجيل!"]]}], "kwAr": "السحرة", "noteAr": ""}, {"kw": "against those", "raw": "Exo_22:21-24; Lev_19:13; Deu_24:14, Deu_24:15, Deu_24:17, Deu_27:19; Pro_22:22, Pro_22:23, Pro_23:10,Pro_23:11; Jer_22:13-17; Jam_5:4, Jam_5:12", "note": "", "refs": [{"l": "Exo 22:21-24", "n": "", "vs": [[21, "لا تضطهد غريبا ولا تضايقه، فقد كنتم غرباء في ديار مصر."], [22, "لا تسيء إلى أرملة أو يتيم،"], [23, "لأ نك إن أسأت إليهما وصرخا إلي أسمع صراخهما،"], [24, "فيحتدم غضبي وأقتلكم بالسيف، فتصبح زوجاتكم أرامل وأولادكم يتامى."]]}, {"l": "Lev 19:13", "n": "", "vs": [[13, "لا تظلم قريبك، ولا تسلب ولا ترجيء دفع أجرة أجيرك إلى الغد."]]}, {"l": "Deu 24:14", "n": "", "vs": [[14, "لا تظلم أجيرا وفقيرا، سواء كان من بني إسرائيل أو من الغرباء المقيمين في مدينتك."]]}, {"l": "Deu 24:15", "n": "", "vs": [[15, "ادفع له أجرته في يومه قبل غروب الشمس لأنه فقير، أجهد نفسه للحصول عليها. وإلا توجه إلى الرب بالشكوى ضدك، فتكون هذه عليك خطيئة."]]}, {"l": "Deu 24:17", "n": "", "vs": [[17, "لا تحرفوا حكم العدالة فتظلموا الغريب واليتيم، ولا تسترهنوا ثوب الأرملة،"]]}, {"l": "Deu 27:19", "n": "", "vs": [[19, "ملعون كل من يجور على حق الغريب واليتيم والأرملة. ويقول جميع الشعب: آمين."]]}, {"l": "Pro 22:22", "n": "", "vs": [[22, "لا تسلب الفقير لأنه فقير، ولا تسحق البائس الماثل عند الباب،"]]}, {"l": "Pro 22:23", "n": "", "vs": [[23, "لأن الرب يدافع عن دعواهم، ويهلك ناهبيهم."]]}, {"l": "Pro 23:10", "n": "", "vs": [[10, "لا تنقل معالم تخم قديم، ولا تدخل حقول الأيتام،"]]}, {"l": "Pro 23:11", "n": "", "vs": [[11, "لأن وليهم قادر، وهو يدافع عن دعواهم ضدك."]]}, {"l": "Jer 22:13-17", "n": "", "vs": [[13, "«ويل لمن يبني بيته على الظلم ومخادعه العالية على الجور، الذي يستخدم جاره مجانا ولا يوفيه أجرة عمله،"], [14, "الذي يقول: «سأبني لنفسي بيتا رحبا وغرفا عالية فسيحة. وأفتح له كوى وأغشيه بألواح الأرز وأدهنه بألوان حمراء."], [15, "أتظن أنك صرت ملكا لأنك بنيت بيتك من الأرز؟ أما أكل أبوك وشرب وأجرى عدلا وحقا، فتمتع بالخيرات؟"], [16, "قد قضى بالعدل للبائس والمسكين فأحرز خيرا. أليست هذه هي معرفتي؟» يقول الرب"], [17, "«أما أنت فعيناك وقلبك متهافتة على الربح الحرام، وعلى سفك الدم البريء، وعلى الظلم والابتزاز»."]]}, {"l": "Jam 5:4", "n": "", "vs": [[4, "وهذه أجرة العمال الذين حصدوا حقولكم، تلك الأجرة التي مازلتم تحبسونها عنهم ظلما، إنها تصرخ، وصراخ أولئك العمال أنفسهم قد سمعه رب الجنود!"]]}, {"l": "Jam 5:12", "n": "", "vs": [[12, "ولكن قبل كل شيء، ياإخوتي، لا تحلفوا، لا بالسماء، ولا بالأرض ولا بأي قسم آخر. وإنما ليكن كلامكم «نعم» إن كان نعم، و«لا» إن كان لا. وذلك لكي لا تقعوا تحت الحكم."]]}], "kwAr": "والمستغلين", "noteAr": ""}, {"kw": "oppress", "raw": "or, defraud, 1Th_4:6", "note": "or, defraud, 1Th_4:6", "refs": [{"l": "1Th 4:6", "n": "", "vs": [[6, "وألا يتعدى حقوق أخيه ويسيء إليه في هذا الأمر، لأن الرب هو المنتقم لجميع هذه الإساءات، كما أنذرناكم قبلا وشهدنا لكم بحق."]]}], "kwAr": "لأجرة العامل", "noteAr": "أو: «يغبنون». انظر 1تس 4: 6"}, {"kw": "fear", "raw": "Gen_20:11, Gen_42:18; Exo_1:17, Exo_18:21; Neh_5:15; Psa_36:1; Pro_8:13, Pro_16:6; Luk_23:40; Rom_3:8", "note": "", "refs": [{"l": "Gen 20:11", "n": "", "vs": [[11, "فقال إبراهيم: «لقد فعلت هذا لأنني ظننت أنه ليس في هذا الموضع بأسره خوف الله فخشيت أن تقتلوني من أجل زوجتي."]]}, {"l": "Gen 42:18", "n": "", "vs": [[18, "وفي اليوم الثالث قال لهم: «افعلوا ما أطلبه منكم فتحيوا، فأنا رجل أتقي الله."]]}, {"l": "Exo 1:17", "n": "", "vs": [[17, "غير أن القابلتين كانتا تخافان الله فلم تنفذا أمر الملك فاستحيتا الأطفال الذكور."]]}, {"l": "Exo 18:21", "n": "", "vs": [[21, "ولكن اختر من بين الشعب رجالا مقتدرين خائفين الله أمناء يبغضون الرشوة، تقيمهم عليهم رؤساء لفئات الألوف والمئات والخماسين والعشرات."]]}, {"l": "Neh 5:15", "n": "", "vs": [[15, "على نقيض الولاة السابقين الذين ثقلوا الضرائب على الشعب، وابتزوا منهم خبزا وخمرا، فضلا عن أربعين شاقلا (نحو أربع مئة وثمانين جراما من الفضة). كما تسلط رجالهم على الشعب. أما أنا فلم أفعل هكذا من خوف الله،"]]}, {"l": "Psa 36:1", "n": "", "vs": [[1, "ينبئني قلبي في داخلي بمعصية الشرير، الذي لا يرتدع خوفا من الله."]]}, {"l": "Pro 8:13", "n": "", "vs": [[13, "مخافة الرب كراهة الشر. أنا قد أبغضت الكبرياء والغطرسة وطريق السوء وفم المكر."]]}, {"l": "Pro 16:6", "n": "", "vs": [[6, "بالرحمة والحق يستر الإثم، وبتقوى الرب يتفادى الإنسان الوقوع في الشر."]]}, {"l": "Luk 23:40", "n": "", "vs": [[40, "ولكن الآخر كلمه زاجرا فقال: «أحتى أنت لا تخاف الله ، وأنت تعاني العقوبة نفسها؟"]]}, {"l": "Rom 3:8", "n": "", "vs": [[8, "أما يفترى علينا كما نتهم زورا ويزعم بعضهم أننا نقول لنمارس الشرور لكي يأتي الخير؟ هؤلاء دينونتهم عادلة."]]}], "kwAr": "ولا يخافونني", "noteAr": ""}], "arS": [["وأقترب", ["H7126"]], [" منكم ", []], ["لأكون", ["H1961"]], [" ", []], ["شاهدا", ["H5707"]], [" ", []], ["سريعا", ["H4116"]], [" ضد ", []], ["السحرة", ["H3784"]], [" ", []], ["والزناة", ["H5003"]], [" ", []], ["والحالفين", ["H7650"]], [" ", []], ["بالزور", ["H8267"]], [" ", []], ["والمستغلين", ["H6231"]], [" ", []], ["لأجرة", ["H7939"]], [" ", []], ["العامل", ["H7916"]], [" ومضطهدي ", []], ["الأرامل", ["H490"]], [" ", []], ["والأيتام", ["H3490"]], ["، والذين ", []], ["يظلمون", ["H5186"]], [" ", []], ["الغرباء", ["H1616"]], [" ولا ", []], ["يخافونني", ["H3372"]]]}, {"c": 3, "v": 6, "text": "فإني أنا الرب لا أتغير، لذلك أنتم أيضا لم تفنوا ياأبناء يعقوب.", "groups": [{"kw": "I am", "raw": "Gen_15:7, Gen_15:18, Gen_22:16; Exo_3:14, Exo_3:15; Neh_9:7, Neh_9:8; Isa_41:13, Isa_42:5-8, Isa_43:11, Isa_43:12; Isa_44:6, Isa_45:5-8; Jer_32:27; Hos_11:9", "note": "", "refs": [{"l": "Gen 15:7", "n": "", "vs": [[7, "وقال له: «أنا هو الرب الذي أتي بك من أور الكلدانيين لأعطيك هذه الأرض ميراثا»."]]}, {"l": "Gen 15:18", "n": "", "vs": [[18, "في ذلك اليوم عقد الله ميثاقا مع أبرام قائلا: «سأعطي نسلك هذه الأرض من وادي العريش إلى النهر الكبير، نهر الفرات."]]}, {"l": "Gen 22:16", "n": "", "vs": [[16, "وقال: «ها أنا أقسم بذاتي يقول الرب: لأنك صنعت هذا الأمر، ولم تمنع ابنك وحيدك عني،"]]}, {"l": "Exo 3:14", "n": "", "vs": [[14, "فأجابه الله : «أهيه الذي أهيه» (ومعناه أنا الكائن الدائم). وأضاف: «هكذا تقول لبني إسرائيل: «أهيه (أنا الكائن)، هو الذي أرسلني إليكم»."]]}, {"l": "Exo 3:15", "n": "", "vs": [[15, "وقال أيضا لموسى: «هكذا تقول لشعب إسرائيل: إن الرب «الكائن» إله آبائكم، إله إبراهيم وإسحق ويعقوب قد أرسلني إليكم. هذا هو اسمي إلى الأبد، وهو الاسم الذي أدعى به من جيل إلى جيل."]]}, {"l": "Neh 9:7", "n": "", "vs": [[7, "أنت هو الرب الإله الذي اخترت أبرام وأخرجته من أور الكلدانيين ودعوته إبراهيم،"]]}, {"l": "Neh 9:8", "n": "", "vs": [[8, "وقد وجدت قلبه خالص الولاء لك، فقطعت له عهدا أن تهبه أرض الكنعانيين والحثيين والأموريين والفرزيين واليبوسيين والجرجاشيين فيرثها نسله. وقد حققت وعدك لأنك صادق."]]}, {"l": "Isa 41:13", "n": "", "vs": [[13, "لأني أنا الرب إلهك الذي يمسك بيمينك قائلا لك: لا تخف. سأعينك."]]}, {"l": "Isa 42:5-8", "n": "", "vs": [[5, "هذا ما يقوله الله ، الرب خالق السماوات وباسطها، وناشر الأرض وما يستخر ج منها. الواهب أهلها نسمة، والمنعم بالروح على السائرين عليها:"], [6, "«أنا هو الرب قد دعوتك بالبر. أمسكت بيدك وحافظت عليك وجعلتك عهدا للشعب ونورا للأمم"], [7, "لتفتح عيون العمي، وتطلق سراح المأسورين في السجن، وتحرر الجالسين في ظلمة الحبس."], [8, "أنا هو الرب وهذا اسمي. لا أعطي مجدي لآخر، ولا حمدي للمنحوتات."]]}, {"l": "Isa 43:11", "n": "", "vs": [[11, "أنا هو الرب، ولا مخلص غيري."]]}, {"l": "Isa 43:12", "n": "", "vs": [[12, "إني أنبأت وخلصت وأعلنت أنا، وليس إله غريب بينكم. أنتم شهودي أني أنا الله، يقول الرب."]]}, {"l": "Isa 44:6", "n": "", "vs": [[6, "هذا ما يقوله الرب القدير ملك إسرائيل وفاديه: «أنا هو الأول والآخر، ولا إله غيري."]]}, {"l": "Isa 45:5-8", "n": "", "vs": [[5, "أنا هو الرب ولا إله غيري. ليس هناك آخر، شددتك مع أنك لم تعرفني."], [6, "حتى يدرك الناس من مشرق الشمس ومن مغربها أني أنا هو الرب وليس هناك آخر."], [7, "أنا مبدع النور وخالق الظلمة، أنا صانع الخير وخالق الضر، أنا هو الرب فاعل كل هذه."], [8, "اهطلي أيتها السماوات من فوق، وأمطري ياغمام برا، لتنفتح الأرض حتى يثمر الخلاص، وينبت البر. أنا خلقته."]]}, {"l": "Jer 32:27", "n": "", "vs": [[27, "«انظر، أنا الرب إله كل بشر. هل يتعذر علي أمر؟"]]}, {"l": "Hos 11:9", "n": "", "vs": [[9, "لن أنفذ فيهم قضاء احتدام غضبي، ولن أدمر أفرايم ثانية، لأني الله لا إنسان، أنا القدوس الذي في وسطك لا أقبل عليكم بسخط."]]}], "kwAr": "أنا الرب", "noteAr": ""}, {"kw": "I change not", "raw": "Num_23:19; 1Sa_15:29; Psa_102:26; Heb_6:18, Heb_13:8; Jam_1:17; Rev_1:8; Rev_22:13", "note": "", "refs": [{"l": "Num 23:19", "n": "", "vs": [[19, "ليس الله إنسانا فيكذب. ولا هو ابن آدم فيندم. هل يقول ولا يفعل أو يعد ولا يفي؟"]]}, {"l": "1Sa 15:29", "n": "", "vs": [[29, "فإن قوة إسرائيل (أي الله) لا يكذب ولا يندم. ليس هو إنسانا حتى يغير رأيه»."]]}, {"l": "Psa 102:26", "n": "", "vs": [[26, "هي زائلة أما أنت فباق. تبلى كلها كالثوب. وتستبدلها كما يستبدل الرداء القديم بالجديد."]]}, {"l": "Heb 6:18", "n": "", "vs": [[18, "فاستنادا إلى وعد الله وقسمه، وهما أمران ثابتان لا يتغيران ويستحيل أن يكذب الله فيهما، نحصل على تشجيع قوي، بعدما التجأنا إلى التمسك بالرجاء الموضوع أمامنا."]]}, {"l": "Heb 13:8", "n": "", "vs": [[8, "يسوع المسيح هو هو أمسا واليوم وإلى الأبد."]]}, {"l": "Jam 1:17", "n": "", "vs": [[17, "إن كل عطية صالحة وهبة كاملة إنما تنزل من فوق، من لدن أبي الأنوار الذي ليس فيه تحول، ولا ظل لأنه لا يدور."]]}, {"l": "Rev 1:8", "n": "", "vs": [[8, "«أنا الألف والياء» (البداية والنهاية). هذا يقوله الرب الإله الكائن والذي كان والذي سيأتي، القادر على كل شيء."]]}, {"l": "Rev 22:13", "n": "", "vs": [[13, "أنا الألف والياء، الأول والآخر، البداية والنهاية."]]}], "kwAr": "لا أتغير", "noteAr": ""}, {"kw": "therefore", "raw": "Psa_78:38, Psa_78:57, Psa_103:17, Psa_105:7-10; Isa_40:28-31; Lam_3:22, Lam_3:23; Rom_5:10; Rom_8:28-32, Rom_11:28, Rom_11:29; Phi_1:6; 2Th_2:13, 2Th_2:14", "note": "", "refs": [{"l": "Psa 78:38", "n": "", "vs": [[38, "لكنه كان رحيما، فعفا عن الإثم ولم يهلكهم. وكثيرا ما كبح غضبه عنهم ولم يضرم كل سخطه."]]}, {"l": "Psa 78:57", "n": "", "vs": [[57, "بل ارتدوا عنه وغدروا كما فعل آباؤهم، وانحرفوا كقوس مخطئة."]]}, {"l": "Psa 103:17", "n": "", "vs": [[17, "أما رحمة الرب فهي من الأزل وإلى الأبد على متقيه، وعدله يمتد إلى بني البنين،"]]}, {"l": "Psa 105:7-10", "n": "", "vs": [[7, "هو الرب إلهنا، أحكامه تملأ الأرض كلها."], [8, "لم ينس عهده قط ولا وعده الذي قطعه إلى ألف جيل،"], [9, "العهد الذي أبرمه مع إبراهيم، والقسم الذي أقسم به لإسحق."], [10, "ثم ثبته ليعقوب فريضة، ولإسرائيل ميثاقا أبديا،"]]}, {"l": "Isa 40:28-31", "n": "", "vs": [[28, "ألم تعلموا؟ ألم تسمعوا؟ إن الرب هو إله سرمدي وخالق أقاصي الأرض. لا يهن ولا يخور، وفهمه لا يستقصى."], [29, "يهب المنهوك قوة ويمنح الضعيف قدرة عظيمة."], [30, "إن الشبيبة ينالها الإعياء والإرهاق، والفتيان يتعثرون أشد تعثر،"], [31, "أما الراجون الرب فإنهم يجددون قوتهم، ويحلقون بأجنحة النسور. يركضون ولا يعيون. يمشون ولا يتعبون."]]}, {"l": "Lam 3:22", "n": "", "vs": [[22, "من إحسانات الرب أننا لم نفن، لأن مراحمه لا تزول."]]}, {"l": "Lam 3:23", "n": "", "vs": [[23, "تتجدد في كل صباح. فائقة أمانتك."]]}, {"l": "Rom 5:10", "n": "", "vs": [[10, "فإن كنا، ونحن أعداء، قد تصالحنا مع الله بموت ابنه، فكم بالأحرى نخلص بحياته ونحن مصالحون!"]]}, {"l": "Rom 8:28-32", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."], [29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."], [30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."], [31, "فبعد هذا، ماذا نقول؟ مادام الله معنا، فمن يكون علينا؟ ذاك الذي لم يمسك عنا ابنه،"], [32, "بل بذله لأجلنا جميعا، كيف لا يجود علينا معه بكل شيء أيضا؟"]]}, {"l": "Rom 11:28", "n": "", "vs": [[28, "ففيما يتعلق بالإنجيل، هم أعداء الله من أجلكم. وأما فيما يتعلق بالاختيار الإلهي فهم محبوبون من أجل الآباء."]]}, {"l": "Rom 11:29", "n": "", "vs": [[29, "فإن الله لا يتراجع أبدا عن هباته ودعوته."]]}, {"l": "Phi 1:6", "n": "", "vs": [[6, "ولي ثقة في هذا الأمر بالذات: أن الذي بدأ فيكم عملا صالحا سوف يتممه إلى يوم المسيح يسوع."]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "2Th 2:14", "n": "", "vs": [[14, "فإلى هذا الأمر قد دعاكم ببشارتنا لكم، لنوال مجد ربنا يسوع المسيح."]]}], "kwAr": "لذلك", "noteAr": ""}], "arS": [["فإني ", []], ["أنا", ["H589"]], [" ", []], ["الرب", ["H3068"]], [" لا ", []], ["أتغير", ["H8138"]], ["، لذلك ", []], ["أنتم", ["H859"]], [" أيضا لم ", []], ["تفنوا", ["H3615"]], [" ", []], ["ياأبناء", ["H1121"]], [" ", []], ["يعقوب", ["H3290"]], [".", []]]}, {"c": 3, "v": 7, "text": "إن شأنكم كشأن آبائكم. ابتعدتم عن فرائضي ولم تطيعوها. ارجعوا إلي فأرجع إليكم، يقول الرب القدير، ولكنكم تسألون كيف نرجع؟", "groups": [{"kw": "from the", "raw": "Deu_9:7-21, Deu_31:20,Deu_31:27-29; Neh_9:16, Neh_9:17, Neh_9:26, Neh_9:28-30; Psa_78:8-10; Eze_20:8, Eze_20:13, Eze_20:21, Eze_20:28; Luk_11:48-51; Act_7:51, Act_7:52", "note": "", "refs": [{"l": "Deu 9:7-21", "n": "", "vs": [[7, "اذكروا ولا تنسوا كيف أسخطتم الرب إلهكم عليكم في الصحراء، فمنذ أن غادرتم ديار مصر حتى بلغتم هذا المكان وأنتم تقاومون الرب."], [8, "ففي جبل حوريب أثرتم غيظ الرب، فاحتدم غضبه عليكم حتى أوشك أن يفنيكم."], [9, "فحين صعدت إلى الجبل لأتسلم لوحي حجر العهد الذي قطعه الرب معكم، وأقمت فيه أربعين نهارا وأربعين ليلة لا آكل فيها خبزا أو أشرب ماء،"], [10, "وسلمني الرب لوحي الحجر المكتوبين بأصبع الله، حيث خط عليهما جميع الوصايا التي كلمكم بها الرب في الجبل من وسط النار في يوم الاجتماع."], [11, "وحين أعطاني الرب لوحي حجر العهد في نهاية الأربعين نهارا والأربعين ليلة،"], [12, "قال لي الرب: قم وأسرع بالنزول من هنا، لأن شعبك الذي أخرجته من مصر قد ضل، وزاغوا سريعا عن السبيل الذي أوصيتهم به، إذ صاغوا لأنفسهم تمثالا مسبوكا."], [13, "ثم قال لي: قد تأملت هذا الشعب وإذ به شعب متصلب القلب."], [14, "دعني أستأصلهم وأمحو اسمهم من تحت السماء، وأقيم منك شعبا أعظم وأكثر منهم."], [15, "فانصرفت، وانحدرت من الجبل وهو ما برح يشتعل بالنار، ولوحا العهد في يدي."], [16, "وتطلعت وإذا بكم قد أخطأتم إلى الرب، وصغتم لأنفسكم عجلا مسبوكا، وضللتم سريعا عن السبيل الذي أوصاكم به الرب."], [17, "فأخذت اللوحين وألقيتهما من يدي وحطمتهما أمام أعينكم."], [18, "ثم انطرحت بذل أمام الرب أربعين نهارا وأربعين ليلة، كما في السابق، لا آكل خبزا ولا أشرب ماء، من جراء كل خطاياكم التي ارتكبتموها في عيني الرب لتغيظوه،"], [19, "لأنني جزعت من غضب الرب واحتدام سخطه عليكم، حتى أوشك أن يبيدكم. فاستجاب لي الرب أيضا في تلك المرة."], [20, "كما غضب الرب على هرون أيضا حتى كاد أن يهلكه، فصليت من أجله حينئذ، فقبل الرب تضرعي."], [21, "أما خطيئتكم، العجل الذي سبكتموه، فقد أخذته وأحرقته ودققته وطحنته جيدا، حتى استحال إلى غبار، ثم طرحت غباره في النهر المنحدر من الجبل."]]}, {"l": "Deu 31:20", "n": "", "vs": [[20, "لأني حالما أدخلهم إلى الأرض التي تفيض لبنا وعسلا، هذه الأرض التي حلفت أن تكون لآبائهم، فيأكلون ويشبعون ويسمنون، فإنهم يسعون وراء آلهة أخرى ويعبدونها ويزدرون بي ناقضين عهدي."]]}, {"l": "Deu 31:27-29", "n": "", "vs": [[27, "لأني أعرف تمردكم وقساوة قلوبكم. إذ وأنا مازلت حيا معكم اليوم أخذتم في مقاومة الرب. فكم بالأحرى تتمردون بعد موتي؟"], [28, "اجمعوا إلي جميع شيوخ أسباطكم وعرفاءكم، لأتلو على مسامعهم هذه الكلمات، وأشهد عليهم السماء والأرض."], [29, "لأنني واثق أنكم بعد موتي تفسدون وتضلون عن الطريق التي أوصيتكم بها، فيصيبكم الشر في آخر الأيام، لأنكم تقترفون الشر أمام الرب حتى تثيروا غيظه بما تجنيه أيديكم»."]]}, {"l": "Neh 9:16", "n": "", "vs": [[16, "ولكن أسلافنا وآباءنا طغوا وقسوا قلوبهم ولم يطيعوا وصاياك،"]]}, {"l": "Neh 9:17", "n": "", "vs": [[17, "وأبوا أن يسمعوا، وتجاهلوا عجائبك التي أجريتها لهم، وأغلظوا قلوبهم، ثم تمردوا ونصبوا عليهم قائدا ليرجعوا إلى عبوديتهم، ولكنك إله غفور وحنان ورحيم وحكيم وكثير الإحسان، فلم تتخل عنهم،"]]}, {"l": "Neh 9:26", "n": "", "vs": [[26, "ومع ذلك ثاروا عليك وتمردوا وطرحوا شريعتك خلف ظهورهم، وقتلوا أنبياءك الذين حذروهم وأنذروهم ليرتدوا إليك، وارتكبوا الشرور الفواحش."]]}, {"l": "Neh 9:28-30", "n": "", "vs": [[28, "ولكن ما إن استقر لهم الأمر حتى رجعوا يرتكبون الشر أمامك، فأسلمتهم إلى أعدائهم الذين تسلطوا عليهم، فعادوا يستغيثون بك، فاستمعت إليهم من السماء وأنقذتهم بفضل مراحمك الوفيرة، أحيانا كثيرة"], [29, "وأنذرتهم لتردهم إلى شريعتك. غير أنهم طغوا وتمردوا على وصاياك وأخطأوا ضد أحكامك، التي إن مارسها إنسان يحيا بها، واعتصموا بعنادهم وأغلظوا قلوبهم ولم يطيعوا."], [30, "لقد تحملتهم سنين كثيرة، وحذرتهم بروحك على لسان أنبيائك فلم يصغوا، فأسلمتهم لعبودية أمم البلاد."]]}, {"l": "Psa 78:8-10", "n": "", "vs": [[8, "ولا يكونون مثل آبائهم، جيلا عنيدا متمردا، جيلا لم يثبت قلبه ولا كانت روحه أمينة لله."], [9, "رماة القوس، بنو أفرايم تقهقروا في يوم المعركة."], [10, "لأنهم لم يراعوا عهد الله، ورفضوا السلوك في شريعته."]]}, {"l": "Eze 20:8", "n": "", "vs": [[8, "ولكنهم تمردوا علي ولم يسمعوا لي، ولم يتركوا الأرجاس التي تنجس عيونهم، ولم يهجروا أصنام مصر. فقلت: سأسكب عليهم غضبي وأنفث فيهم كامل سخطي في وسط ديار مصر."]]}, {"l": "Eze 20:13", "n": "", "vs": [[13, "لكن شعب إسرائيل تمردوا علي في البرية ولم يمارسوا فرائضي، وتنكروا لأحكامي التي إن عمل بها إنسان يحيا، ونجسوا أيام سبوتي كثيرا. فقلت: سأسكب غضبي عليهم في البرية لأميتهم."]]}, {"l": "Eze 20:21", "n": "", "vs": [[21, "فتمرد الأبناء علي. لم يسلكوا في فرائضي ولم يحفظوا أحكامي ليعملوها التي إن عملها إنسان يحيا بها، ونجسوا سبوتي. فقلت إني أسكب غضبي عليهم لأتم سخطي عليهم في البرية."]]}, {"l": "Eze 20:28", "n": "", "vs": [[28, "عندما جئت بهم إلى الأرض التي أقسمت أن أهبها لهم، ورأوا كل أكمة مرتفعة وكل شجرة وارفة، فذبحوا قرابينهم هناك وقربوا ذبائحهم المغيظة، وأصعدوا تقدمات، روائح الرضى وسكبوا سكائب خمرهم،"]]}, {"l": "Luk 11:48-51", "n": "", "vs": [[48, "فأنتم إذن تشهدون موافقين على أعمال آبائكم: فهم قتلوا الأنبياء، وأنتم تبنون قبورهم."], [49, "لهذا السبب أيضا قالت حكمة الله: سأرسل إليهم أنبياء ورسلا، فيقتلون منهم ويضطهدون،"], [50, "حتى إن دماء جميع الأنبياء المسفوكة منذ تأسيس العالم، يطالب بها هذا الجيل،"], [51, "من دم هابيل إلى دم زكريا الذي قتل بين المذبح والقدس! أقول لكم: نعم، إن تلك الدماء يطالب بها هذا الجيل."]]}, {"l": "Act 7:51", "n": "", "vs": [[51, "ثم قال استفانوس: «ياأصحاب الرقاب الصلبة والقلوب والآذان غير المختونة! إنكم دائما تقاومون الروح القدس. وكما فعل آباؤكم تفعلون!"]]}, {"l": "Act 7:52", "n": "", "vs": [[52, "فأي نبي نجا من اضطهادهم وقد قتلوا الذين أنبأوا بمجيء البار الذي سلمتموه أنتم وقتلتموه!"]]}], "kwAr": "إن شأنكم كشأن آبائكم", "noteAr": ""}, {"kw": "Return unto me", "raw": "Lev_26:40-42; Deu_4:29-31, Deu_30:1-4; 1Ki_8:47-49; Neh_1:8, Neh_1:9; Isa_55:6, Isa_55:7; Jer_3:12-14, Jer_3:22; Eze_18:30-32; Hos_14:1; Zec_1:3; Jam_4:8", "note": "", "refs": [{"l": "Lev 26:40-42", "n": "", "vs": [[40, "ولكن إن اعترفوا بخطاياهم وخطايا آبائهم وبخيانتهم لي وعداوتهم،"], [41, "التي جعلتني أنقلب عليهم وأنفيهم إلى أرض أعدائهم، وإن خضعت قلوبهم النجسة بعد أن استوفوا عقاب خطاياهم،"], [42, "فإني أذكر ميثاقي مع يعقوب، وميثاقي مع إسحق، وميثاقي مع إبراهيم، وأذكر الأرض،"]]}, {"l": "Deu 4:29-31", "n": "", "vs": [[29, "ولكن إن طلبتم من هناك الرب إلهكم، ملتمسينه من كل قلوبكم ونفوسكم، فإنكم تجدونه."], [30, "فعندما يكتنفكم الضيق وتصيبكم في آخر الأيام جميع هذه الأمور، عندئذ ترجعون إلى الرب إلهكم وتطيعون أوامره."], [31, "لأن الرب إلهكم إله رحيم لا ينبذكم ولا يفنيكم، ولا ينسى عهد آبائكم الذي أقسم لهم عليه."]]}, {"l": "Deu 30:1-4", "n": "", "vs": [[1, "وعندما تحل بكم هذه البركات واللعنات كلها التي وضعتها أمامكم، ورددتموها في قلوبكم بين الأمم حيث شتتكم الرب إلهكم،"], [2, "ورجعتم إلى الرب إلهكم أنتم وبنوكم، وسمعتم لصوته من كل قلوبكم ونفوسكم بحسب كل ما أنا أوصيكم به اليوم،"], [3, "فإن الرب إلهكم يرد سبيكم ويرحمكم، ويلم شتاتكم من بين جميع الشعوب الذين نفاكم الرب إلهكم إليهم."], [4, "فإن كان قد بددكم إلى أقصى السماوات فمن هناك يجمعكم ويرجع بكم،"]]}, {"l": "1Ki 8:47-49", "n": "", "vs": [[47, "فإن تابوا في أرض سبيهم ورجعوا متضرعين إليك قائلين: قد أخطأنا وانحرفنا وأذنبنا،"], [48, "وتابوا حقا من كل قلوبهم ونفوسهم وهم أسرى في ديار أعدائهم، متوجهين نحو أرضهم التي وهبتها لآبائهم، نحو المدينة التي اخترتها والهيكل الذي شيدته لاسمك،"], [49, "فاستجب صلاتهم وتضرعهم من السماء مقر سكناك، وانصر قضيتهم،"]]}, {"l": "Neh 1:8", "n": "", "vs": [[8, "اذكر تحذيرك الذي أنذرت به عبدك موسى قائلا: إن خنتم عهدي فإني أشتت شملكم بين الشعوب."]]}, {"l": "Neh 1:9", "n": "", "vs": [[9, "وإن رجعتم إلي وأطعتم وصاياي ومارستموها، فإني أجمع المنفيين حتى من أقاصي السماوات، وآتي بهم إلى المكان الذي اخترته لأسكن اسمي فيه."]]}, {"l": "Isa 55:6", "n": "", "vs": [[6, "اطلبوا الرب مادام موجودا، ادعوه وهو قريب."]]}, {"l": "Isa 55:7", "n": "", "vs": [[7, "ليترك الشرير طريقه والأثيم أفكاره، وليتب إلى الرب فيرحمه، وليرجع إلى إلهنا لأنه يكثر الغفران."]]}, {"l": "Jer 3:12-14", "n": "", "vs": [[12, "فاذهب وأعلن هذه الكلمات نحو الشمال وقل: ارجعي أيتها الخائنة إسرائيل، فأكف غضبي عنكم لأني رحيم، ولن أسخط عليكم إلى الأبد."], [13, "إنما اعترفي بإثمك وأقري أنك قد تمردت على الرب إلهك، وأغدقت غرامك على الغرباء تحت كل شجرة خضراء، وأنك أبيت طاعة صوتي."], [14, "فارجعوا أيها الأبناء الغادرون، لأني أنا سيدكم، فآخذكم واحدا من المدينة واثنين من العشيرة وآتي بكم إلى صهيون،"]]}, {"l": "Jer 3:22", "n": "", "vs": [[22, "«فارجعوا أيها الأبناء المرتدون فأشفي ارتدادكم». ويقولون: «ها نحن نقبل إليك لأنك أنت الرب إلهنا."]]}, {"l": "Eze 18:30-32", "n": "", "vs": [[30, "لذلك أدينكم ياشعب إسرائيل، كل واحد بمقتضى طرقه، يقول السيد الرب. توبوا وارجعوا عن ذنوبكم كلها، فلا يكون لكم الإثم معثرة هلاك."], [31, "اطرحوا عنكم كل ذنوبكم التي ارتكبتموها، واحصلوا لأنفسكم على قلب جديد وروح جديدة. فلماذا تنقرضون ياشعب إسرائيل؟"], [32, "إذ لا أسر بموت أحد، يقول السيد الرب، فتوبوا واحيوا."]]}, {"l": "Hos 14:1", "n": "", "vs": [[1, "ارجع تائبا ياإسرائيل إلى الرب إلهك، لأنك قد تعثرت بخطيئتك."]]}, {"l": "Zec 1:3", "n": "", "vs": [[3, "ولكن قل لهم، هذا ما يعلنه الرب القدير: ارجعوا إلي فأرجع إليكم، يقول الرب القدير."]]}, {"l": "Jam 4:8", "n": "", "vs": [[8, "اقتربوا إلى الله فيقترب إليكم. أيها الخاطئون نظفوا أيديكم، وياأصحاب الرأيين طهروا قلوبكم."]]}], "kwAr": "ارجعوا إلي", "noteAr": ""}, {"kw": "Wherein", "raw": "Mal_3:13, Mal_1:6; Isa_65:2; Mat_23:27; Luk_15:16; Rom_7:9, Rom_10:3, Rom_10:21", "note": "", "refs": [{"l": "Mal 3:13", "n": "", "vs": [[13, "لقد قسوتم في كلامكم علي يقول الرب، ومع ذلك تقولون: بماذا تكلمنا ضدك؟"]]}, {"l": "Mal 1:6", "n": "", "vs": [[6, "إن الابن يكرم أباه والعبد سيده. فإن كنت أنا حقا أبا فأين كرامتي؟ وإن كنت حقا سيدا فأين مهابتي؟ إن الرب القدير يقول لكم: أيها الكهنة المزدرون باسمي؛ فتسألون: كيف ازدرينا باسمك؟"]]}, {"l": "Isa 65:2", "n": "", "vs": [[2, "بسطت يدي اليوم كله إلى شعب متمرد يسلك في طريق غير صالح، تابعين أهواءهم،"]]}, {"l": "Mat 23:27", "n": "", "vs": [[27, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم كالقبور المطلية بالكلس: تبدو جميلة من الخارج، ولكنها من الداخل ممتلئة بعظام الموتى وكل نجاسة!"]]}, {"l": "Luk 15:16", "n": "", "vs": [[16, "وكم اشتهى لو يملأ بطنه من الخرنوب الذي كانت الخنازير تأكله، فما أعطاه أحد!"]]}, {"l": "Rom 7:9", "n": "", "vs": [[9, "أما أنا فكنت من قبل عائشا بمعزل عن الشريعة؛ ولكن لما جاءت الشريعة عاشت الخطيئة،"]]}, {"l": "Rom 10:3", "n": "", "vs": [[3, "فبما أنهم جهلوا بر الله وسعوا إلى إثبات برهم الذاتي، لم يخضعوا للبر الإلهي."]]}, {"l": "Rom 10:21", "n": "", "vs": [[21, "ولكنه عن إسرائيل يقول: «طول النهار مددت يدي إلى شعب عاص معارض!»"]]}], "kwAr": "كيف نرجع", "noteAr": ""}], "arS": [["إن شأنكم كشأن ", []], ["آبائكم", ["H1"]], [". ", []], ["ابتعدتم", ["H5493"]], [" عن ", []], ["فرائضي", ["H2706"]], [" ولم ", []], ["تطيعوها", ["H8104"]], [". ", []], ["ارجعوا", ["H7725"]], [" إلي ", []], ["فأرجع", ["H7725"]], [" إليكم، ", []], ["يقول", ["H559"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["القدير", ["H6635"]], ["، ولكنكم ", []], ["تسألون", ["H559"]], [" كيف ", []], ["نرجع", ["H7725"]], ["؟", []]]}, {"c": 3, "v": 8, "text": "أيسلب الإنسان الله ؟ لقد سلبتموني! وتسألون: بماذا سلبناك؟ في العشور والقرابين.", "groups": [{"kw": "a man", "raw": "Psa_29:2; Pro_3:9, Pro_3:10; Mat_22:21; Mar_12:17; Luk_20:25; Rom_13:7", "note": "", "refs": [{"l": "Psa 29:2", "n": "", "vs": [[2, "قدموا للرب مجدا لاَسمه. اسجدوا للرب بثوب الإجلال والقداسة."]]}, {"l": "Pro 3:9", "n": "", "vs": [[9, "أكرم الرب من مالك، ومن أوائل غلات محاصيلك."]]}, {"l": "Pro 3:10", "n": "", "vs": [[10, "فتمتليء أهراؤك وفرة، وتفيض معاصرك خمرا."]]}, {"l": "Mat 22:21", "n": "", "vs": [[21, "أجابوه: «للقيصر!» فقال لهم: «إذن، أعطوا ما للقيصر للقيصر، وما لله لله»"]]}, {"l": "Mar 12:17", "n": "", "vs": [[17, "فرد عليهم قائلا: «أعطوا ما للقيصر للقيصر، وما لله لله!» فذهلوا منه."]]}, {"l": "Luk 20:25", "n": "", "vs": [[25, "فقال لهم: «إذن، أعطوا ما للقيصر للقيصر، وما لله لله»."]]}, {"l": "Rom 13:7", "n": "", "vs": [[7, "فأدوا لكل واحد حقه: الضريبة لصاحب الضريبة والجزية لصاحب الجزية، والاحترام لصاحب الاحترام، والإكرام لصاحب الإكرام."]]}], "kwAr": "الإنسان", "noteAr": ""}, {"kw": "In", "raw": "Mal_1:8, Mal_1:13; Lev_5:15, Lev_5:16, 27:2-34; Num_18:21-32; Jos_7:11; Neh_13:4-14; Rom_2:22", "note": "", "refs": [{"l": "Mal 1:8", "n": "", "vs": [[8, "عندما تقربون الحيوان الأعمى ذبيحة، أليس ذلك شرا؟ أو حين تقدمون الحيوان الأعرج والمريض، أليس هذا شرا؟ قدموا مثل هذا القربان هدية لحاكمكم، أفيرضى عنكم ويكرمكم؟ يقول الرب القدير."]]}, {"l": "Mal 1:13", "n": "", "vs": [[13, "ثم قلتم: ما هذه المشقة التي نتكبدها؟ وتأففتم علي، يقول الرب القدير. وتقربون إلي ما استوليتم عليه ظلما وما هو أعرج أو مريض، فيكون هذا تقدمة قربانكم فهل أقبل هذا من أيديكم؟ يقول الرب."]]}, {"l": "Lev 5:15", "n": "", "vs": [[15, "«إن سها أحد وتعدى على واحد من أقداس الرب، يحضر إلى الرب ذبيحة إثم: كبشا سليما، يقدر الكاهن قيمته من الفضة وفقا للمعايير المستعملة في القدس،"]]}, {"l": "Lev 5:16", "n": "", "vs": [[16, "فيعوض عما أخطأ به من القدس، بعد أن يضيف عليه ما يعادل خمسه غرامة، ويؤديه للكاهن. فيكفر الكاهن عنه بكبش الإثم، ويغفر الرب له."]]}, {"l": "Lev 27:2-34", "n": "", "vs": [[2, "«أوص بني إسرائيل أنه إذا نذر أحد نفسه أو سواه للرب فإن فداء المنذور يكون بموجب جدول تقويمك التالي حسب موازين القدس:"], [3, "يفتدى كل ذكر من ابن عشرين إلى ابن ستين سنة بخمسين شاقلا (نحو ست مئة جرام) من الفضة."], [4, "وتفتدي كل امرأة منذورة بثلاثين شاقلا (نحو ثلاث مئة وستين جراما) من الفضة."], [5, "أما إن كان المنذور ذكرا من ابن خمس سنوات إلى عشرين فيفتدى بعشرين شاقلا (نحو مئتين وأربعين جراما) من الفضة. أما فداء الأنثى فيكون عشرة شواقل (نحو مئة وعشرين جراما)."], [6, "وإن كان عمر المنذور بين شهر وخمس سنوات فيفتدى الذكر بخمسة شواقل (نحو ستين جراما) من الفضة، والأنثى بثلاثة شواقل (نحو ستة وثلاثين جراما)."], [7, "وإن كان المنذور ذكرا ابن ستين سنة فما فوق يفتدى بخمسة عشر شاقلا (نحو مئة وثمانين جراما)؛ أما الأنثى فتفتدى بعشرة شواقل (نحو مئة وعشرين جراما)."], [8, "وإن كان الناذر فقيرا يعجز عن دفع تقويمك، يحضر إلى الكاهن فيقدر فداءه وفقا لقدرة الناذر المادية."], [9, "وإن كان المنذور بهيمة مما يقدمونه قربانا للرب فإن هذه البهيمة تصبح قدسا للرب."], [10, "لا يغيره الناذر ولا يبدله جيدا برديء أو رديئا بجيد. وإن استبدل بهيمة بأخرى فإنها تكون هي وبديلها قدسا للرب."], [11, "وإن كان النذر بهيمة نجسة، لا يجوز تقريبها للرب، يحضر الناذر البهيمة أمام الكاهن،"], [12, "فيقدر قيمتها، سواء كانت جيدة أم رديئة، وحسب تقدير الكاهن يدفع الناذر قيمتها."], [13, "فإن فكها فعليه أن يضيف خمسها على تقدير الكاهن."], [14, "وإن كرس إنسان بيته قدسا للرب، يقومه الكاهن وفقا لحالته من الجودة والرداءة. وحسب تقدير الكاهن هكذا يكون."], [15, "فإذا رغب المكرس أن يفك بيته، يضيف على تقدير الكاهن ما يعادل خمسه ويسترده."], [16, "وإن كرس إنسان جزءا من حقل يملكه للرب، فإن تقويمك يكون على قدر ما يزرع فيه من بذار، فيكون لكل بذار حومر (نحو مئتين وأربعين لترا) من بذار الشعير خمسون شاقلا (نحو ست مئة جرام) من الفضة"], [17, "فإن كرس حقله في سنة اليوبيل فإنه يقوم بدفع ما تم تقويمه."], [18, "وإن كرس حقله بعد سنة اليوبيل فعلى الكاهن أن يقدر قيمة الفضة وفقا لعدد السنين الباقية لحلول سنة اليوبيل، فيتم إنقاص تقويمك."], [19, "فإن فك المكرس الحقل يضيف على تقويمك خمسه من الفضة ويسترده."], [20, "لكن إن لم يفك الحقل، وباعه لإنسان آخر فإنه لا يسترده أبدا،"], [21, "بل يصبح الحقل في سنة اليوبيل قدسا للرب، ويكون ملكا للكاهن."], [22, "وإن اشترى حقلا ولم يكن قد آل إليه بالميراث، وكرسه للرب،"], [23, "يقدر الكاهن ثمنه حسب تقويمك إلى سنة اليوبيل. فيدفع في ذلك اليوم مقدار تقويمك، قدسا للرب."], [24, "وفي سنة اليوبيل يرد الحقل إلى مالكه الذي باعه إياه،"], [25, "أما تقويمك فيكون قائما على شاقل المقدس، فكل عشرين جيرة تعادل شاقلا، (أي اثنى عشر جراما) من الفضة."], [26, "لا يقدس أحد بكرا من البهائم فإنه يفرز للرب، سواء كان ثورا أم شاة فهو للرب."], [27, "أما إن كان من البهائم النجسة، فعلى صاحبه أن يفديه حسب تقديرك، ويضيف على ذلك خمسه وإن لم يفده يباع وفقا لتقويمك."], [28, "لكن كل ما يوقفه إنسان للرب مما يملكه من الناس والبهائم والحقول الموروثة فلا يباع ولا يفتدى، لأن كل وقف هو قدس أقداس للرب."], [29, "كل ما يصدر الأمر بتحريمه من الناس لا يفدى بل يقتل حتما."], [30, "كل عشور غلات الأرض من الحبوب وأثمار الشجر هو للرب وقدس له."], [31, "وإن فك إنسان بعض عشره يضيف عليه خمس ثمنه."], [32, "أما كل عشر البقر والغنم فيكون العاشر منها قدسا للرب وفقا لإحصاء الراعي"], [33, "لا فرق إن كان جيدا أو رديا، ولا يجري تبديله؛ وإن أبدل يكون هو وبديله قدسا لا يفتدى»."], [34, "هذه هي الوصايا التي أمر الرب موسى أن يبلغها لبني إسرائيل في جبل سيناء."]]}, {"l": "Num 18:21-32", "n": "", "vs": [[21, "أما اللاويون فقد وهبتهم كل عشر في إسرائيل، لقاء عملهم الذي يقومون به في خدمة خيمة الاجتماع."], [22, "وعلى الإسرائيليين، منذ الآن، أن لا يقتربوا إلى خيمة الاجتماع، وإلا تحملوا نتائج خطيئتهم فيموتون."], [23, "فاللاويون وحدهم يقومون بخدمة خيمة الاجتماع، ويتحملون مسئولية خطئهم، فتكون هذه لكم فريضة دائمة جيلا بعد جيل. ولا يكون للاويين نصيب من الأملاك في وسط إسرائيل."], [24, "إن العشور التي يقدمها الإسرائيليون للرب قد وهبتها للاويين نصيبا، لهذا قلت لهم، لا يرثون نصيبا في وسط إسرائيل»."], [25, "وقال الرب لموسى:"], [26, "«أوص اللاويين وقل لهم: متى أخذتم من الإسرائيليين العشر الذي جعلته نصيبا لكم، تقدمون منه عشره للرب."], [27, "فيحسب تقدمتكم مثل الحنطة من البيدر أو تقدمة عصير الكرمة."], [28, "وهكذا تقدمون أنتم أيضا تقدمة للرب من جميع عشوركم التي تأخذونها من بني إسرائيل، وما تقربونه للرب، تعطونه لهرون الكاهن."], [29, "وعليكم أن تحضروا للرب أفضل جزء وأقدسه مما أعطي لكم."], [30, "وقل لهم: حين تقدمون من أفضل عطاياكم فإنها تحسب لكم مثل محصول البيدر ونتاج المعصرة."], [31, "وتأكلونه في كل مكان أنتم وأهل بيوتكم، لأنه أجرة لكم لقاء خدمتكم في خيمة الاجتماع."], [32, "ولدى تقديم خير جزء منها لا تتحملون وزرا بسببها. أما أقداس بني إسرائيل فلا تدنسوها لئلا تموتوا»."]]}, {"l": "Jos 7:11", "n": "", "vs": [[11, "لقد ارتكب إسرائيل خطيئة، بل تعدوا على عهدي الذي أمرتهم به، بل أخذوا مما حرمته عليهم وسرقوا وأنكروا، بل خبأوا في أمتعتهم."]]}, {"l": "Neh 13:4-14", "n": "", "vs": [[4, "وقبل هذه الأمور كان ألياشيب الكاهن الأمين على مخازن هيكل إلهنا ذا علاقة حميمة بطوبيا،"], [5, "فهيأ له مخدعا عظيما، حيث اعتادوا سابقا أن يخزنوا التقدمات والبخور والآنية وعشر القمح والخمر والزيت المخصصة للاويين والمرتلين وحراس أبواب الهيكل، وحيث كانت تخزن المخصصات المقدمة إلى الكهنة."], [6, "ولم أكن في أورشليم في أثناء ذلك، لأني في السنة الثانية والثلاثين من حكم أرتحششتا ملك بابل مثلت أمامه ثم استأذنت منه بعد أيام،"], [7, "ورجعت إلى أورشليم واطلعت على ما ارتكبه ألياشيب من شر عظيم عندما أعد لطوبيا مخدعا في ديار هيكل الله."], [8, "فساءني الأمر جدا حتى إني طرحت جميع أمتعة طوبيا خارج المخدع،"], [9, "ثم أصدرت أوامري بتطهير المخادع كلها، ورددت إليها آنية هيكل الله مع التقدمة والبخور."], [10, "وعلمت أن اللاويين لم يتسلموا مخصصاتهم، فلجأوا هم والمغنون الذين قاموا بالعمل، إلى حقولهم."], [11, "فأنبت المسئولين وسألتهم: «لماذا ترك بيت الله بغير رعاية؟» ثم جمعت اللاويين وأعدتهم إلى مراكزهم."], [12, "وأدى جميع يهوذا عشر الحنطة والخمر والزيت إلى المخازن."], [13, "وعينت على أمانة شؤون المخازن شلميا الكاهن، وصادوق الكاتب، وفدايا من اللاويين. كما عينت حانان بن زكور بن متنيا لما عرف عنهم من أمانة، وكانت مهمتهم توزيع الأنصبة على إخوتهم."], [14, "فاذكرني ياإلهي من أجل هذا ولا تنس حسناتي التي بذلتها في خدمة بيت إلهي."]]}, {"l": "Rom 2:22", "n": "", "vs": [[22, "أنت يامن تنهى عن الزنى، أتزني؟ أنت يامن تستنكر الأصنام، أتسرق الهياكل"]]}], "kwAr": "في العشور", "noteAr": ""}], "arS": [["أيسلب", ["H6906"]], [" ", []], ["الإنسان", ["H120"]], [" ", []], ["الله", ["H430"]], [" ؟ لقد ", []], ["سلبتموني", ["H6906"]], ["! ", []], ["وتسألون", ["H559"]], [": بماذا ", []], ["سلبناك", ["H6906"]], ["؟ في ", []], ["العشور", ["H4643"]], [" ", []], ["والقرابين", ["H8641"]], [".", []]]}, {"c": 3, "v": 9, "text": "أنتم، بل الأمة كلها، تحت اللعنة لأنكم سلبتموني.", "groups": [{"kw": "", "raw": "Mal_2:2; Deu_28:15-19; Jos_7:12, Jos_7:13, Jos_22:20; Isa_43:28; Hag_1:6-11, Hag_2:14-17", "note": "", "refs": [{"l": "Mal 2:2", "n": "", "vs": [[2, "إن أبيتم الاستماع، ولم تنووا في قلوبكم أن تمجدوا اسمي، أصب عليكم اللعنة، وألعن بركاتكم، بل ها أنا قد حولتها إلى لعنات لأنكم لم تجعلوها في قلوبكم."]]}, {"l": "Deu 28:15-19", "n": "", "vs": [[15, "ولكن إن عصيتم صوت الرب إلهكم ولم تحرصوا على العمل بجميع وصاياه وفرائضه التي أنا آمركم اليوم بها، فإن جميع هذه اللعنات تحل بكم وتلازمكم."], [16, "تكونون ملعونين في المدينة وملعونين في الحقول."], [17, "وتكون سلالكم ومعاجنكم ملعونة."], [18, "وتحل اللعنة بأبنائكم وغلات أرضكم ونتاج بقركم ونعاجكم،"], [19, "وتكونون ملعونين في ذهابكم وإيابكم،"]]}, {"l": "Jos 7:12", "n": "", "vs": [[12, "لهذا عجز بنو إسرائيل عن الثبات أمام أعدائهم، فولوا أمامهم الأدبار، لأنهم هالكون إذ لن أعود أكون معكم ما لم تستأصلوا الحرام من وسطكم،"]]}, {"l": "Jos 7:13", "n": "", "vs": [[13, "قم، واطلب من الشعب أن يتقدسوا ليوم غد، لأنه هكذا قال الرب إله إسرائيل: في وسطك حرام ياإسرائيل، ولن تتمكنوا من هزيمة أعدائكم حتى تستأصلوا الحرام من بينكم."]]}, {"l": "Jos 22:20", "n": "", "vs": [[20, "ألم يرتكب عخان بن زارح خيانة فسرق ما حرمه الله ، فانصب السخط على كل جماعة إسرائيل ولم يكن هو وحده فقط الذي هلك من جراء إثمه؟»"]]}, {"l": "Isa 43:28", "n": "", "vs": [[28, "لذلك أدنس عظماء مقادسي وأقضي على إسرائيل بالهلاك وأتركه عرضة للخزي والعار."]]}, {"l": "Hag 1:6-11", "n": "", "vs": [[6, "لقد زرعتم كثيرا وحصدتم قليلا. أكلتم ولم تشبعوا. شربتم ولم ترتووا. اكتسيتم ولم تستدفئوا. ومن ينال أجرة سرعان ما تتبدد، وكأنها وضعت في صرة مثقوبة»."], [7, "هكذا يقول الرب القدير: «تأملوا فيما فعلتم:"], [8, "اصعدوا إلى الجبل واجلبوا خشبا وشيدوا الهيكل فأرضى عنه وأتمجد، قال الرب."], [9, "لقد توقعتم كثيرا فحصلتم على قليل، وما أتيتم به إلى البيت من غلة نفخت عليه وبددته. لماذا فعلت هذا يقول الرب القدير؟ من أجل بيتي الذي ما برح مهدما بينما كل واحد منكم منهمك في بناء بيته."], [10, "لذلك منعت السماء من فوق عنكم الندى، ومنعت الأرض غلتها."], [11, "وقضيت بالقحط على الأرض والتلال، وعلى حقول الحنطة والكروم، وأشجار الزيتون وعلى كل ما تنتجه الأرض، وعلى الناس والبهائم، وعلى كل تعب أيديكم»."]]}, {"l": "Hag 2:14-17", "n": "", "vs": [[14, "عندئذ قال حجي: «هذا هو حال الشعب، وهذه هي حال الأمة أمامي يقول الرب، فكل أعمال أيديهم وجميع ما يقدمونه نجس."], [15, "والآن تأملوا فيما صنعتم اليوم والأيام السالفة قبل أن تضعوا حجرا فوق حجر لبناء هيكل الرب."], [16, "عندما كان يقبل أحد على كومة حبوب ظنا منه أن الأرض قد غلت عشرين مكيالا، يجد أنها لم تغل سوى عشرة فقط. وحين يدنو من المعصرة ليغرف ملء خمسين وعاء، لا يجد إلا عشرين."], [17, "إني ابتليت تعب أيديكم بالقحط والذبول والبرد، ولكنكم لم ترجعوا تائبين إلي، يقول الرب."]]}], "kwAr": "", "noteAr": ""}], "arS": [["أنتم", ["H859"]], ["، بل ", []], ["الأمة", ["H1471"]], [" ", []], ["كلها", ["H3605"]], ["، تحت ", []], ["اللعنة", ["H3994"]], [" لأنكم ", []], ["سلبتموني", ["H6906"]], [".", []]]}, {"c": 3, "v": 10, "text": "هاتوا العشور جميعها إلى بيت الخزينة ليتوافر في هيكلي طعام، واختبروني لتروا إن كنت لا أفتح كوى السماء وأفيض عليكم بركة وفيرة، يقول الرب القدير.", "groups": [{"kw": "all", "raw": "2Ch_31:4-10; Neh_10:33-39; Pro_3:9, Pro_3:10", "note": "", "refs": [{"l": "2Ch 31:4-10", "n": "", "vs": [[4, "وطلب إلى أهل أورشليم أن يعطوا الكهنة واللاويين حصتهم حتى يتفرغوا لشريعة الرب."], [5, "وما إن ذاع أمر الملك حتى قدم بنو إسرائيل بسخاء من بواكير الحنطة، وأول محصول الكروم، والزيت والعسل ومن كل محاصيل الحقل، وأتوا بعشور إنتاجها بكميات وافرة،"], [6, "كما قدم بنو إسرائيل ويهوذا المقيمون في مدن يهوذا عشور البقر والضأن، وعشور الأقداس المخصصة للرب إلههم، وجعلوها أكواما أكواما."], [7, "وشرعوا في تكويمها في الشهر الثالث وفرغوا منها في الشهر السابع."], [8, "ثم جاء حزقيا ورؤساء الشعب وشاهدوا الأكوام فباركوا الرب وشعبه إسرائيل."], [9, "ولما سأل حزقيا الكهنة واللاويين عن هذه الأكوام،"], [10, "أجابه عزريا رئيس الكهنة من بيت صادوق: «منذ أن أخذ الشعب في التبرع بالتقدمات إلى هيكل الرب، أكلنا وشبعنا، وفضلت عنا هذه الكميات الوافرة، لأن الرب بارك شعبه. وهذه الوفرة قد فضلت عنا»."]]}, {"l": "Neh 10:33-39", "n": "", "vs": [[33, "ولتوفير خبز التقدمة والتقدمة الدائمة والمحرقة اليومية وقرابين السبوت ومطالع الشهور والأعياد والأقداس وذبائح الخطيئة، للتكفير عن إسرائيل، وللقيام بصيانة بيت إلهنا."], [34, "ثم، نحن الكهنة واللاويين والشعب، ألقينا القرعة لنقرر متى يتحتم على كل عائلة من عائلاتنا أن تجلب تقدماتها السنوية من الحطب إلى بيت الله، لإحراقها على مذبح الرب إلهنا، كما نصت الشريعة،"], [35, "كما ألزمنا أنفسنا بحمل باكورات أرضنا من المحاصيل أو من أثمار الأشجار سنة فسنة إلى هيكل إلهنا"], [36, "وكذلك أبكار أبنائنا وبهائمنا ومواشينا من بقر وغنم، فنحضرها إلى هيكل إلهنا إلى الكهنة الخادمين، كما نصت عليه الشريعة."], [37, "وتعهدنا أيضا أن نأتي بأوائل عجيننا وقرابيننا وثمر كل شجرة وأوائل الخمر والزيت إلى الكهنة إلى مخازن هيكل إلهنا، وبعشر محاصيل أرضنا إلى اللاويين، لأن اللاويين هم الذين يجمعون العشور من جميع مدننا الريفية."], [38, "ويكون كاهن من ذرية هرون مع اللاويين حين يقومون بجمع العشور، فيودع اللاويون عشر الأعشار في مخازن هيكل إلهنا،"], [39, "لأن الشعب وأبناء اللاويين هم الذين يأتون بتقدمات القمح والخمر والزيت إلى المخازن، حيث توجد آنية القدس والكهنة والقائمون بالخدمة وحراس أبواب الهيكل والمرتلون. وهكذا لا نهمل هيكل إلهنا."]]}, {"l": "Pro 3:9", "n": "", "vs": [[9, "أكرم الرب من مالك، ومن أوائل غلات محاصيلك."]]}, {"l": "Pro 3:10", "n": "", "vs": [[10, "فتمتليء أهراؤك وفرة، وتفيض معاصرك خمرا."]]}], "kwAr": "العشور جميعها", "noteAr": ""}, {"kw": "the storehouse", "raw": "1Ch_26:20; 2Ch_31:11-19; Neh_10:38, Neh_12:44, Neh_12:47, Neh_13:5, Neh_13:10-13", "note": "", "refs": [{"l": "1Ch 26:20", "n": "", "vs": [[20, "وأشرف أخيا من اللاويين على خزائن بيت الله وعلى خزائن الأقداس."]]}, {"l": "2Ch 31:11-19", "n": "", "vs": [[11, "وأمر حزقيا بإعداد مخازن في بيت الرب، فهيأوها،"], [12, "وأودعوا فيها التقدمات والعشور والأقداس بأمانة، وتعين كوننيا اللاوي رئيسا مشرفا على القائمين بهذا العمل، يعاونه في ذلك أخوه شمعي،"], [13, "أما يحيئيل وعزريا ونحث وعسائيل ويريموث ويوزاباد وإيليئيل ويسمخيا ومحث وبنايا، فكانوا وكلاء يعملون تحت إشراف كوننيا وشمعي وفقا للترتيب الذي قرره حزقيا الملك وعزريا رئيس كهنة بيت الله."], [14, "وكان قوري بن يمنة اللاوي حارس الباب الشرقي مشرفا على التبرعات الطوعية المقدمة لله، وعلى توزيع التقدمات المخصصة للرب وعلى عطايا الأقداس،"], [15, "يعاونه بأمانة: عدن ومنيامين ويشوع وشمعيا وأمريا وشكنيا في مدن الكهنة، في توزيع أنصبة إخوتهم الكهنة حسب فرقهم، من غير تمييز بين كبير وصغير."], [16, "فضلا عما كانوا يوزعونه كل يوم بيومه على المنتسبين من ذكورهم من ابن ثلاث سنوات فما فوق، وعلى كل من يدخل إلى بيت الله ليقوم بمختلف مهام خدمته اليومية، وفقا لمسؤلياتهم وفرقهم."], [17, "وقد أدرجت أسماء الكهنة في السجلات بحسب انتمائهم لبيوت آبائهم. أما اللاويون من ابن عشرين سنة فما فوق فقد سجلوا حسب العمل الذي يقومون به."], [18, "وقد اشتملت السجلات على أسماء الكهنة وجميع أطفالهم ونسائهم وأبنائهم وبناتهم، لأنهم كانوا أمناء في تطهير أنفسهم."], [19, "وقد تم تعيين كهنة بأسمائهم من أبناء هرون المقيمين في مزارع المدن، وفي كل مدينة، ليقوموا بتوزيع حصص على كل ذكر من الكهنة، وعلى كل منتسب من اللاويين."]]}, {"l": "Neh 10:38", "n": "", "vs": [[38, "ويكون كاهن من ذرية هرون مع اللاويين حين يقومون بجمع العشور، فيودع اللاويون عشر الأعشار في مخازن هيكل إلهنا،"]]}, {"l": "Neh 12:44", "n": "", "vs": [[44, "وعهد في ذلك اليوم بالمخازن والخزائن والرفائع وأوائل المحاصيل والعشور إلى أشخاص معينين، ليجمعوا فيها من حقول المدن ما نصت عليه الشريعة من مخصصات الكهنة واللاويين، لأن أبناء سبط يهوذا فرحوا بالكهنة واللاويين القائمين"]]}, {"l": "Neh 12:47", "n": "", "vs": [[47, "وكان الإسرائيليون في أيام زربابل ونحميا يقومون بتزويد المرتلين وحراس أبواب الهيكل واللاويين بالطعام كل يوم، ويقوم اللاويون بتقديم جزء مما يتلقونه من طعام للكهنة."]]}, {"l": "Neh 13:5", "n": "", "vs": [[5, "فهيأ له مخدعا عظيما، حيث اعتادوا سابقا أن يخزنوا التقدمات والبخور والآنية وعشر القمح والخمر والزيت المخصصة للاويين والمرتلين وحراس أبواب الهيكل، وحيث كانت تخزن المخصصات المقدمة إلى الكهنة."]]}, {"l": "Neh 13:10-13", "n": "", "vs": [[10, "وعلمت أن اللاويين لم يتسلموا مخصصاتهم، فلجأوا هم والمغنون الذين قاموا بالعمل، إلى حقولهم."], [11, "فأنبت المسئولين وسألتهم: «لماذا ترك بيت الله بغير رعاية؟» ثم جمعت اللاويين وأعدتهم إلى مراكزهم."], [12, "وأدى جميع يهوذا عشر الحنطة والخمر والزيت إلى المخازن."], [13, "وعينت على أمانة شؤون المخازن شلميا الكاهن، وصادوق الكاتب، وفدايا من اللاويين. كما عينت حانان بن زكور بن متنيا لما عرف عنهم من أمانة، وكانت مهمتهم توزيع الأنصبة على إخوتهم."]]}], "kwAr": "بيت الخزينة", "noteAr": ""}, {"kw": "and prove", "raw": "1Ki_17:13-16; Psa_37:3; Hag_2:19; Mat_6:33; 2Co_9:6-8", "note": "", "refs": [{"l": "1Ki 17:13-16", "n": "", "vs": [[13, "فقال لها إيليا: «لا تخافي. امضي واصنعي كما قلت، ولكن أعدي لي منه كعكة صغيرة أولا وأحضريها لي، ثم اعملي لك ولابنك أخيرا،"], [14, "لأن هذا ما يقوله الرب إله إسرائيل: إن جرة الدقيق لن تفرغ، وقارورة الزيت لن تنقص، إلى اليوم الذي يرسل فيه الرب مطرا على وجه الأرض»."], [15, "فراحت إلى منزلها ونفذت كلام إيليا، فتوافر لها طعام لتأكل هي وابنها وإيليا لمدة طويلة."], [16, "جرة الدقيق لم تفرغ، وقارورة الزيت لم تنقص، تماما كما قال الرب على لسان إيليا."]]}, {"l": "Psa 37:3", "n": "", "vs": [[3, "توكل على الرب واصنع الخير. اسكن في الأرض (مطمئنا) وراع الأمانة."]]}, {"l": "Hag 2:19", "n": "", "vs": [[19, "هل في الأهراء بذار بعد؟ حتى الكروم والتين والرمان والزيتون لم تثمر بعد. لكن منذ هذا اليوم أبارك فيها»."]]}, {"l": "Mat 6:33", "n": "", "vs": [[33, "أما أنتم، فاطلبوا أولا ملكوت الله وبره، وهذه كلها تزاد لكم."]]}, {"l": "2Co 9:6-8", "n": "", "vs": [[6, "فمن الحق أن من يزرع بالتقتير، يحصد أيضا بالتقتير، ومن يزرع بالبركات، يحصد أيضا بالبركات."], [7, "فليتبرع كل واحد بما نوى في قلبه، لا بأسف ولا عن اضطرار، لأن الله يحب المعطي المتهلل."], [8, "والله قادر أن يجعل كل نعمة تفيض عليكم، حتى يكون لكم اكتفاء كلي في كل شيء وكل حين، فتفيضوا في كل عمل صالح؛"]]}], "kwAr": "واختبروني", "noteAr": ""}, {"kw": "open", "raw": "Gen_7:11; Deu_28:12; 2Ki_7:2, 2Ki_7:19", "note": "", "refs": [{"l": "Gen 7:11", "n": "", "vs": [[11, "ففي سنة ست مئة من عمر نوح، في الشهر الثاني، في اليوم السابع عشر منه، تفجرت المياه من اللجج العميقة في باطن الأرض، وهطلت أمطار السماء الغزيرة،"]]}, {"l": "Deu 28:12", "n": "", "vs": [[12, "ويفتح لكم الرب كنوز سمائه الصالحة، فيمطر على أرضكم في مواسمها، ويبارك كل ما تنتجه أيديكم، فتقرضون أمما كثيرة وأنتم لا تقترضون."]]}, {"l": "2Ki 7:2", "n": "", "vs": [[2, "فقال الجندي الذي كان الملك يتوكأ على ذراعه لرجل الله: «حتى إن فتح الرب كوى في السماء، فهل يمكن أن يحدث هذا الأمر؟» فأجاب أليشع: «سترى ذلك بعينيك، ولكنك لن تأكل منه»."]]}, {"l": "2Ki 7:19", "n": "", "vs": [[19, "ولكن الجندي قال لرجل الله: «حتى إن فتح الرب كوى في السماء فهل يمكن أن يحدث هذا الأمر؟» فقال له أليشع: «سترى ذلك بعينيك ولكنك لن تأكل منه»."]]}], "kwAr": "أفتح كوى السماء", "noteAr": ""}, {"kw": "pour you out", "raw": "Heb. empty out, Ecc_11:3", "note": "Heb. empty out, Ecc_11:3", "refs": [{"l": "Ecc 11:3", "n": "", "vs": [[3, "إذا كانت السحب مثقلة بالمياه فإنها تصب المطر على الأرض، وإن سقطت شجرة باتجاه الشمال أو الجنوب فإنها تظل مستقرة حيث سقطت."]]}], "kwAr": "وأفيض", "noteAr": "بالعبرية: «أفرغ». انظر جا 11: 3"}, {"kw": "that there", "raw": "Lev_26:10; 2Ch_31:10; Luk_5:6, Luk_5:7, Luk_12:16, Luk_12:17; Joh_21:6-11", "note": "", "refs": [{"l": "Lev 26:10", "n": "", "vs": [[10, "وتظلون تأكلون من الغلال القديمة حين تفرغونها من مخازنها لتوسعوا لغلات السنة الجديدة."]]}, {"l": "2Ch 31:10", "n": "", "vs": [[10, "أجابه عزريا رئيس الكهنة من بيت صادوق: «منذ أن أخذ الشعب في التبرع بالتقدمات إلى هيكل الرب، أكلنا وشبعنا، وفضلت عنا هذه الكميات الوافرة، لأن الرب بارك شعبه. وهذه الوفرة قد فضلت عنا»."]]}, {"l": "Luk 5:6", "n": "", "vs": [[6, "ولما فعلوا ذلك، صادوا سمكا كثيرا جدا، حتى تخرقت شباكهم."]]}, {"l": "Luk 5:7", "n": "", "vs": [[7, "فأشاروا إلى شركائهم الذين في القارب الآخر أن يأتوا ويساعدوهم. فأتوا، وملأوا القاربين كليهما حتى كادا يغرقان."]]}, {"l": "Luk 12:16", "n": "", "vs": [[16, "وضرب لهم مثلا، قال «إنسان غني غلت له أرضه محاصيل وافرة."]]}, {"l": "Luk 12:17", "n": "", "vs": [[17, "ففكر في نفسه قائلا: ماذا أعمل وليس عندي مكان أخزن فيه محاصيلي؟"]]}, {"l": "Joh 21:6-11", "n": "", "vs": [[6, "فقال لهم: «ألقوا الشبكة إلى يمين القارب، تجدوا!» فألقوها، ولم يعودوا يقدرون أن يجذبوها لكثرة ما فيها من السمك!"], [7, "فقال التلميذ الذي كان يسوع يحبه، لبطرس: «إنه الرب!» وكان بطرس عريانا، فما إن سمع أن ذلك هو الرب، حتى تستر بردائه، وألقى نفسه في الماء سابحا."], [8, "وجاء باقي التلاميذ بالقارب وهم يجرون شبكة السمك، إذ كانوا غير بعيدين عن الشاطيء إلا نحو مئتي ذراع."], [9, "فلما نزلوا إلى الشاطيء، رأوا هناك جمرا وسمكا موضوعا عليه، وخبزا."], [10, "فقال لهم يسوع: «هاتوا من السمك الذي صدتموه الآن!»"], [11, "فصعد سمعان بطرس إلى القارب وجذب الشبكة إلى البر، فإذا فيها مئة وثلاث وخمسون سمكة من السمك الكبير، ومع هذه الكثرة لم تتمزق الشبكة."]]}], "kwAr": "بركة وفيرة", "noteAr": ""}], "arS": [["هاتوا", ["H935"]], [" ", []] تكم وخمركم، وزيتكم،"]]}, {"l": "Jer 8:13", "n": "", "vs": [[13, "«وسأبيدهم حقا، إذ لا يكون في الكرمة عنب ولا في التينة تين. حتى أوراق الأشجار تذوي وتتساقط، وما أغدقته عليهم من نعم يسلب منهم."]]}, {"l": "Joe 1:7", "n": "", "vs": [[7, "فأتلفت كرومي وحطمت أشجار بيتي وسلخت قشورها وطرحتها، فابيضت أغصانها."]]}, {"l": "Joe 1:12", "n": "", "vs": [[12, "قد ذوى الكرم وذبل التين والرمان والنخيل والتفاح ويبست سائر أشجار الحقل، وزالت البهجة من أبناء البشر."]]}, {"l": "Joe 2:22", "n": "", "vs": [[22, "لا تخافي يابهائم الحقل، لأن مراعي البر قد أضحت خضراء، والأشجار باتت مثقلة بالثمار، وشجرة التين والكرمة تجودان بنتاجهما."]]}, {"l": "Hab 3:17", "n": "", "vs": [[17, "فمع أنه لا يزهر التين ولا يكون حمل في الكروم يكذب عمل الزيتونة والحقول لا تصنع طعاما ينقطع الغنم من الحظيرة ولا بقر في المذاود"]]}, {"l": "Zec 8:12", "n": "", "vs": [[12, "بل يزرعون في سلام، فتعطي الكروم ثمرها والأرض غلاتها، وتجود السماء بأمطارها، وأورث بقية هذا الشعب الناجية كل هذه."]]}], "kwAr": "ولا تصاب كرومكم", "noteAr": ""}], "arS": [["وأكف", ["H1605"]], [" عنكم أذى ", []], ["الجراد", ["H398"]], [" الملتهم، فلا ", []], ["يتلف", ["H7843"]], [" لكم ", []], ["غلات", ["H6529"]], [" ", []], ["الأرض", ["H127"]], ["، ولا تصاب ", []], ["كرومكم", ["H1612"]], [" ", []], ["بالعقم", ["H7921"]], ["، ", []], ["يقول", ["H559"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["القدير", ["H6635"]], [".", []]]}, {"c": 3, "v": 12, "text": "عندئذ تدعوكم جميع الشعوب «بالأمة المباركة» لأن أرضكم تكون أوض بهجة، يقول الرب القدير.", "groups": [{"kw": "all", "raw": "Deu_4:6, Deu_4:7; 2Ch_32:23; Psa_72:17; Isa_61:9; Jer_33:9; Zep_3:19, Zep_3:20; Zec_8:23; Luk_1:48", "note": "", "refs": [{"l": "Deu 4:6", "n": "", "vs": [[6, "فاحفظوها وطبقوها، لأنها هي حكمتكم وفطنتكم لدى الشعوب الذين يسمعون عن هذه الشرائع، فيقولون: إن هذا الشعب العظيم هو حقا شعب حكيم فطن."]]}, {"l": "Deu 4:7", "n": "", "vs": [[7, "لأنه أي شعب، مهما عظم، له آلهة قريبة منه مثل الرب إلهنا في كل ما ندعوه؟"]]}, {"l": "2Ch 32:23", "n": "", "vs": [[23, "وشرع كثيرون يأتون بتقدمات للرب إلى يد؟"]]}, {"l": "Jer 12:2", "n": "", "vs": [[2, "أنت غرستهم فتأصلوا ونموا وأثمروا. اسمك يتردد على أفواههم، ولكنه بعيد عن قلوبهم."]]}, {"l": "Hab 1:13-17", "n": "", "vs": [[13, "إن عينيك أطهر من أن تشهدا الشر، وأنت لا تطيق رؤية الظلم، فكيف تحتمل مشاهدة الأثمة، وتصمت عندما يبتلع المنافقون من هم أبر منهم؟"], [14, "وكيف تجعل الناس كأسماك البحر، أو كأسراب الحشرات التي لا قائد لها؟"], [15, "إن الكلدانيين يستخرجونهم بالشصوص، ويصطادونهم بالشبكة، ويجمعونهم في مصيدتهم متهللين فرحين."], [16, "لهذا هم يقربون ذبائح لشباكهم، ويحرقون بخورا لمصائدهم، لأنهم بفضلها يتمتعون بالرفاهية ويتلذذون بأطايب الطعام."], [17, "أمن أجل هذا يظلون يفرغون شباكهم ولا يكفون عن إهلاك الأمم إلى الأبد؟"]]}], "kwAr": "فاعلي الشر", "noteAr": ""}, {"kw": "set", "raw": "Heb. built, Job_22:23", "note": "Heb. built, Job_22:23", "refs": [{"l": "Job 22:23", "n": "", "vs": [[23, "إن رجعت إلى القدير واتضعت، وإن طرحت الإثم بعيدا عن خيامك،"]]}], "kwAr": "يزدهرون", "noteAr": "بالعبرية: «بنوا». انظر أي 22: 23"}, {"kw": "they that tempt", "raw": "Num_14:22, Num_14:23; Dan_6:16; Psa_78:18, Psa_78:41, Psa_78:56, Psa_95:9, Psa_106:14; Mat_4:6, Mat_4:7; Act_5:9; 1Co_10:9; Heb_3:9", "note": "", "refs": [{"l": "Num 14:22", "n": "", "vs": [[22, "فإن جميع الرجال الذين عاينوا مجدي ومعجزاتي التي أجريتها في مصر وفي الصحراء، وجربوني عشر مرات من غير أن يطيعوا قولي،"]]}, {"l": "Num 14:23", "n": "", "vs": [[23, "لن يروا الأرض التي وعدت بها آباءهم. جميع الذين استخفوا بي، لن يشاهدوها."]]}, {"l": "Dan 6:16", "n": "", "vs": [[16, "عند ذلك أمر الملك فأحضروا دانيآل وطرحوه في جب الأسود. وقال الملك لدانيآل: «إن إلهك الذي تعبده دائما هو ينقذك»."]]}, {"l": "Psa 78:18", "n": "", "vs": [[18, "وجربوا الله في قلوبهم، طالبين طعاما اشتهته نفوسهم"]]}, {"l": "Psa 78:41", "n": "", "vs": [[41, "ثم عادوا يجربون الله ويغيظون قدوس إسرائيل."]]}, {"l": "Psa 78:56", "n": "", "vs": [[56, "غير أنهم جربوا الله العلي وتمردوا عليه، ولم يراعوا شهاداته."]]}, {"l": "Psa 95:9", "n": "", "vs": [[9, "عندما امتحنني آباؤكم واختبروني وشهدوا جميع عجائبي."]]}, {"l": "Psa 106:14", "n": "", "vs": [[14, "بل انصاعوا لشهوتهم الشديدة في البرية، وتحدوا الله في الصحراء."]]}, {"l": "Mat 4:6", "n": "", "vs": [[6, "وقال له: «إن كنت ابن الله، فاطرح نفسك إلى أسفل، لأنه قد كتب: يوصي ملائكته بك، فيحملونك على أيديهم لكي لا تصدم قدمك بحجر!»"]]}, {"l": "Mat 4:7", "n": "", "vs": [[7, "فقال له يسوع: «وقد كتب أيضا: لا تجرب الرب إلهك! »"]]}, {"l": "Act 5:9", "n": "", "vs": [[9, "فقال لها بطرس: «لماذا اتفقت مع زوجك على امتحان روح الرب؟ ها قد وصل الشبان الذين دفنوا زوجك إلى الباب، وسيحملونك أيضا!»"]]}, {"l": "1Co 10:9", "n": "", "vs": [[9, "ولا نجرب الرب كما جربه بعضهم، فأهلكتهم الحيات."]]}, {"l": "Heb 3:9", "n": "", "vs": [[9, "هناك جربوني واختبروني، وقد شاهدوا أعمالي طوال أربعين سنة."]]}], "kwAr": "تحدوا الله", "noteAr": ""}], "arS": [["وها نحن الآن ", []], ["نغبط", ["H833"]], [" ", []], ["المستكبرين", ["H2086"]], ["، ونرى ", []], ["فاعلي", ["H6213"]], [" ", []], ["الشر", ["H7564"]], [" ", []], ["يزدهرون", ["H1129"]], ["، بل إنهم ", []], ["تحدوا", ["H974"]], [" ", []], ["الله", ["H430"]], [" ", []], ["ونجوا", ["H4422"]], [".", []]]}, {"c": 3, "v": 16, "text": "ثم حدث خائفو الرب بعضهم بعضا. فأصغى الرب إلى كلامهم وسمعهم، فتم تدوين أسماء متقي الرب والمتأملين باسمه أمامه في كتاب تذكرة، ورد فيه:", "groups": [{"kw": "that feared", "raw": "Mal_3:5, Mal_4:2; Gen_22:12; 1Ki_18:3, 1Ki_18:12; Job_28:28; Psa_33:18, Psa_111:10, Psa_112:1; Psa_147:11; Isa_50:10; Act_9:31, Act_10:2; Rev_15:4", "note": "", "refs": [{"l": "Mal 3:5", "n": "", "vs": [[5, "وأقترب منكم لأكون شاهدا سريعا ضد السحرة والزناة والحالفين بالزور والمستغلين لأجرة العامل ومضطهدي الأرامل والأيتام، والذين يظلمون الغرباء ولا يخافونني"]]}, {"l": "Mal 4:2", "n": "", "vs": [[2, "أما أنتم أيها المتقون اسمي فتشرق عليكم شمس البر حاملة في أجنحتها الشفاء فتنطلقون متواثبين كعجول المعلف،"]]}, {"l": "Gen 22:12", "n": "", "vs": [[12, "فقال: «لا تمد يدك إلى الصبي ولا توقع به ضرا لأني علمت أنك تخاف الله ولم تمنع ابنك وحيدك عني»."]]}, {"l": "1Ki 18:3", "n": "", "vs": [[3, "فاستدعى أخآب عوبديا مدير شؤون القصر، وكان عوبديا يتقي الرب جدا."]]}, {"l": "1Ki 18:12", "n": "", "vs": [[12, "وما إن أنطلق من عندك لأخبره حتى يحملك روح الرب إلى حيث لا أدري، فيأتي أخآب ولا يجدك فيقتلني، وأنا عبدك أتقي الرب منذ صباي."]]}, {"l": "Job 28:28", "n": "", "vs": [[28, "ثم قال للإنسان: انظر، إن مخافة الرب هي الحكمة، وتفادي الشر هو الفطنة»."]]}, {"l": "Psa 33:18", "n": "", "vs": [[18, "هوذا عين الرب على خائفيه، المتكلين على رحمته،"]]}, {"l": "Psa 111:10", "n": "", "vs": [[10, "رأس الحكمة مخافة الرب. والعامل بها ذو فطنة شديدة. تسبيح الرب دائم إلى الأبد."]]}, {"l": "Psa 112:1", "n": "", "vs": [[1, "هللويا! طوبى لمن يخشى الرب ويبتهج جدا بوصاياه."]]}, {"l": "Psa 147:11", "n": "", "vs": [[11, "إنما يرضى الرب بخائفيه، الراجين رحمته."]]}, {"l": "Isa 50:10", "n": "", "vs": [[10, "من منكم يتقي الرب ويطيع صوت خادمه؟ من الذي يسلك في الظلمة من غير نور؟ فليتكل على اسم الرب ويعتمد على إلهه."]]}, {"l": "Act 9:31", "n": "", "vs": [[31, "في أثناء ذلك كانت الكنيسة في مناطق اليهودية والجليل والسامرة تتمتع بالسلام. وكانت تنمو وتسير في تقوى الر ب، بمساندة الروح القدس."]]}, {"l": "Act 10:2", "n": "", "vs": [[2, "وكان تقيا يخاف الله ، هو وأهل بيته جميعا، يتصدق على الشعب كثيرا، ويصلي إلى الله دائما."]]}, {"l": "Rev 15:4", "n": "", "vs": [[4, "من لا يخافك يارب ولا يمجد اسمك؟ فأنت وحدك قدوس! والأمم جميعا سيأتون ويسجدون لك، لأن أحكامك قد ظهرت جلية»."]]}], "kwAr": "خائفو الرب", "noteAr": ""}, {"kw": "spake", "raw": "Deu_6:6-8; 1Sa_23:16-18; Est_4:5-17; Psa_16:3, Psa_66:16, Psa_73:15-17, Psa_119:63; Pro_13:20; Eze_9:4; Dan_2:17, Dan_2:18; Luk_2:38, 24:14-31; Joh_1:40-47; Joh_12:20-22; Act_1:13, Act_2:1, Act_4:23-30; Eph_5:19; 1Th_5:11, 1Th_5:14; Heb_3:13; Heb_10:24, Heb_12:15", "note": "", "refs": [{"l": "Deu 6:6-8", "n": "", "vs": [[6, "وضعوا هذه الكلمات التي أوصيكم بها على قلوبكم،"], [7, "وقصوها على أولادكم، وتحدثوا بها حين تجلسون في بيوتكم، وحين تسيرون في الطريق، وحين تنامون، وحين تنهضون."], [8, "اربطوها علامة على أيديكم، واجعلوها عصائب على جباهكم."]]}, {"l": "1Sa 23:16-18", "n": "", "vs": [[16, "فأقبل يوناثان بن شاول إلى داود في الغابة ليقوي من ثقته بالله،"], [17, "وقال له: «لا تخف، لأن يد شاول أبي لن تطولك. وأنت ستكون ملكا على إسرائيل، وأنا أكون الرجل الثاني في المملكة. وأبي أيضا يعلم هذا الأمر»."], [18, "وجددا عهدهما أمام الرب. ومضى يوناثان إلى بيته، أما داود فمكث في الغابة."]]}, {"l": "Est 4:5-17", "n": "", "vs": [[5, "فاستدعت أستير هتاخ، أحد خصيان الملك الذي كلفه الملك بخدمتها، وطلبت إليه أن يذهب للاستخبار عما يزعج مردخاي."], [6, "فانطلق هتاخ إلى ساحة المدينة الواقعة أمام باب الملك إلى مردخاي، وسأله عن أمره."], [7, "فأخبره مردخاي بكل ما أصابه، وعن مبلغ الفضة الذي وعد هامان بدفعه إلى خزينة الملك لقاء إبادة اليهود،"], [8, "وأعطاه نسخة من الأمر الصادر عن العاصمة بإفناء اليهود لكي يطلع أستير عليها، ويخبرها بما جرى، ويوصيها أن تمثل أمام الملك وتتوسل إليه أن يعفو عن شعبها."], [9, "فعاد هتاخ إلى أستير ونقل إليها كلام مردخاي."], [10, "فأرسلت إليه مع هتاخ ثانية قائلة:"], [11, "«إن كل حاشية الملك وشعوب أقاليم الملك يعلمون أن كل رجل أو امرأة يدخل إلى الملك في مخدعه الداخلي، من غير دعوة، فجزاؤه حتما الموت، إلا الذي يمد له الملك قضيب الذهب فإنه يحيا. وأنا لم أدع للمثول بين يدي الملك هذه الثلاثين يوما»."], [12, "فأبلغ مردخاي بكلام أستير."], [13, "فطلب أن يجيبوها: «لا يخطرن ببالك أنك ستنجين من العاقبة من دون سائر اليهود، لأنك في قصر الملك."], [14, "لأنك إن لزمت الصمت في مثل هذا الوقت، فإن الفرج والنجاة لابد أن يأتيا لليهود من مصدر آخر، وأما أنت وبيت أبيك فتفنون. ومن يدري، فلربما قد وصلت إلى عرش الملك لوقت مثل هذا!»"], [15, "عندئذ طلبت من مبلغيها أن يحملوا جوابها إلى مردخاي:"], [16, "«امض اجمع كل اليهود المقيمين في شوشن، وصوموا من أجلي ولا تأكلوا ولا تشربوا ثلاثة أيام ليلا ونهارا، وسأصوم أنا ووصيفاتي أيضا مثلكم. ثم أدخل إلى الملك مخالفة العرف المتبع، فإذا هلكت، هلكت»."], [17, "فانصرف مردخاي ونفذ كل ما أوصته به أستير."]]}, {"l": "Psa 16:3", "n": "", "vs": [[3, "كل بهجتي في قديسي الأرض وأفاضلها."]]}, {"l": "Psa 66:16", "n": "", "vs": [[16, "تعالوا اسمعوا ياجميع خائفي الله، فأحدثكم بما فعل لنفسي."]]}, {"l": "Psa 73:15-17", "n": "", "vs": [[15, "لو أنني نطقت بمثل هذا، لكنت قد خنت جيل أولادك."], [16, "وعندما نويت أن أفهم هذا، تعذر الأمر علي،"], [17, "إلى أن دخلت أقداس الله، وتأملت مآل الأشرار"]]}, {"l": "Psa 119:63", "n": "", "vs": [[63, "رفيق أنا لكل الذين يتقونك، ولحافظي وصاياك."]]}, {"l": "Pro 13:20", "n": "", "vs": [[20, "من يعاشر الحكماء يصبح حكيما، ورفيق الحمقى يناله الأذى."]]}, {"l": "Eze 9:4", "n": "", "vs": [[4, "وقال له الرب: «اجتز وسط مدينة أورشليم وارسم سمة على جباه الرجال الذين يئنون ويزفرون على كل ما ارتكب من أرجاس فيها»."]]}, {"l": "Dan 2:17", "n": "", "vs": [[17, "ثم مضى دانيآل إلى بيته وأبلغ رفاقه حننيا وميشائيل وعزريا الأمر،"]]}, {"l": "Dan 2:18", "n": "", "vs": [[18, "ليطلبوا من إله السماوات الرحمة بشأن هذا اللغز لكي لا يهلك دانيآل ورفاقه مع سائر حكماء بابل."]]}, {"l": "Luk 2:38", "n": "", "vs": [[38, "فإذ حضرت في تلك الساعة، أخذت تسبح الرب وتتحدث عن يسوع مع جميع الذين كانوا ينتظرون فداء في أورشليم."]]}, {"l": "Luk 24:14-31", "n": "", "vs": [[14, "وكانا يتحدثان عن جميع ما حدث"], [15, "وبينما هما يتحدثان ويتباحثان، إذا يسوع نفسه قد اقترب إليهما وسار معهما."], [16, "ولكن أعينهما حجبت عن معرفته."], [17, "وسألهما: «أي حديث يجري بينكما وأنتما سائران؟» فتوقفا عابسين."], [18, "وأجاب أحدهما، واسمه كليوباس، فقال له: «أأنت وحدك الغريب النازل في أورشليم، ولا تعلم بما حدث فيها في هذه الأيام؟»"], [19, "فقال لهما: «ماذا حدث؟» فقالا: «ما حدث ليسوع الناصري الذي كان نبيا مقتدرا في الفعل والقول أمام الله والشعب كله،"], [20, "وكيف سلمه رؤساء الكهنة وحكامنا إلى عقوبة الموت وصلبوه."], [21, "ولكننا كنا نرجو أنه الموشك أن يفدي إسرائيل. ومع هذا كله، فاليوم هو اليوم الثالث منذ حدوث ذلك."], [22, "على أن بعض النساء منا أذهلننا، إذ قصدن إلى القبر باكرا"], [23, "ولم يجدن جثمانه، فرجعن وقلن لنا إنهن شاهدن رؤيا: ملاكين يقولان إنه حي."], [24, "فذهب بعض الذين معنا إلى القبر فوجدوا الأمر صحيحا على حد ما قالت النساء أيضا، وأما هو فلم يروه!»"], [25, "فقال لهما: «ياقليلي الفهم وبطيئي القلب في الإيمان بجميع ما تكلم به الأنبياء!"], [26, "أما كان لابد أن يعاني المسيح هذه الآلام ثم يدخل إلى مجده؟»"], [27, "ثم أخذ يفسر لهما، منطلقا من موسى ومن الأنبياء جميعا، ما ورد عنه في جميع الكتب."], [28, "ثم اقتربوا من القرية التي كان التلميذان يقصدانها، وتظاهر هو بأنه ذاهب إلى مكان أبعد."], [29, "فألحا عليه قائلين: «انزل عندنا، فقد مال النهار واقترب المساء». فدخل لينزل عندهما."], [30, "ولما اتكأ معهما، أخذ الخبز، وبارك، وكسر، وأعطاهما."], [31, "فانفتحت أعينهما وعرفاه. ثم اختفى عنهما."]]}, {"l": "Joh 1:40-47", "n": "", "vs": [[40, "وكان أندراوس أخو سمعان بطرس أحد هذين اللذين تبعا يسوع، بعدما سمعا كلام يوحنا،"], [41, "فما إن وجد أخاه سمعان، حتى قال له: «وجدنا المسيا» أي المسيح."], [42, "واقتاده إلى يسوع. فنظر يسوع مليا إلى سمعان وقال: «أنت سمعان بن يونا، ولكني سأدعوك: صفا» أي صخرا."], [43, "وفي اليوم التالي نوى يسوع أن يذهب إلى منطقة الجليل، فوجد فيلبس، فقال له: «اتبعني!»"], [44, "وكان فيلبس من بيت صيدا، بلدة أندراوس وبطرس."], [45, "ثم وجد فيلبس نثنائيل، فقال له: «وجدنا الذي كتب عنه موسى في الشريعة، والأنبياء في كتبهم وهو يسوع ابن يوسف من الناصرة»."], [46, "فقال نثنائيل: «وهل يطلع من الناصرة شيء صالح؟» أجابه فيلبس: «تعال وانظر!»"], [47, "ورأى يسوع نثنائيل قادما نحوه فقال عنه: «هذا إسرائيلي أصيل لا شك فيه!»"]]}, {"l": "Joh 12:20-22", "n": "", "vs": [[20, "وكان بين الذين قصدوا أورشليم للعبادة في أثناء العيد بعض اليونانيين،"], [21, "فذهبوا إلى فيلبس، وهو من بيت صيدا في منطقة الجليل، وقالوا له: «ياسيد، نريد أن نرى يسوع»."], [22, "فجاء فيلبس وأخبر أندراوس، ثم ذهبا معا وأخبرا يسوع."]]}, {"l": "Act 1:13", "n": "", "vs": [[13, "ولما وصلوا صعدوا إلى غرفة في الطبقة العليا كانوا يقيمون فيها، وهم: بطرس ويوحنا، ويعقوب وأندراوس، وفيلبس وتوما، وبرثلماوس ومتى، ويعقوب بن حلفى وسمعان الغيور، ويهوذا أخو يعقوب."]]}, {"l": "Act 2:1", "n": "", "vs": [[1, "ولما جاء اليوم الخمسون، كان الإخوة مجتمعين معا في مكان واحد،"]]}, {"l": "Act 4:23-30", "n": "", "vs": [[23, "وما إن أطلق بطرس ويوحنا حتى رجعا إلى رفاقهما، وأخبراهم بكل ما قاله لهما رؤساء الكهنة والشيوخ،"], [24, "فتوجهوا بقلب واحد إلى الله بالدعاء، قائلين: «يارب، ياخالق السماء والأرض والبحر وكل ما فيها،"], [25, "يامن قلت بالروح القدس على لسان عبدك داود: لماذا ضجت الأمم؟ ولماذا تآمرت الشعوب باطلا؟"], [26, "اجتمع ملوك الأرض ورؤساؤها، وتحالفوا ليقاوموا الرب ومسيحه!"], [27, "وقد تحققت هذه الكلمات فعلا، إذ تحالف هيرودس، وبيلاطس البنطي، والوثنيون وأسباط إسرائيل، لمقاومة فتاك القدوس يسوع، الذي جعلته مسيحا،"], [28, "وعملوا به كل ما سبق أن رسمت يدك وقضت مشيئتك أن يكون."], [29, "والآن انظر، يارب، إلى تهديدهم، وهبنا نحن عبيدك أن نعلن كلامك بكل جرأة،"], [30, "ومد يدك للشفاء، كي تجرى معجزات وعجائب باسم فتاك القدوس يسوع»."]]}, {"l": "Eph 5:19", "n": "", "vs": [[19, "محدثين بعضكم بعضا بمزامير وتسابيح وأناشيد روحية، مرنمين ومرتلين بقلوبكم للرب؛"]]}, {"l": "1Th 5:11", "n": "", "vs": [[11, "لذلك عزوا بعضكم بعضا وشددوا أحدكم الآخر، كما أنتم فاعلون."]]}, {"l": "1Th 5:14", "n": "", "vs": [[14, "إلا أننا نناشدكم، أيها الإخوة، أن تعظوا الفوضويين، وتشددوا فاقدي العزم، وتساندوا الضعفاء، وتعاملوا الجميع بطول البال."]]}, {"l": "Heb 3:13", "n": "", "vs": [[13, "وإنما، شجعوا بعضكم بعضا كل يوم، مادمنا نقول: «اليوم...». وذلك لكي لا تقسي الخطيئة قلب أحد منكم بخداعها."]]}, {"l": "Heb 10:24", "n": "", "vs": [[24, "وعلى كل واحد منا أن ينتبه للآخرين، لنحث بعضنا بعضا على المحبة والأعمال الصالحة."]]}, {"l": "Heb 12:15", "n": "", "vs": [[15, "انتبهوا ألا يسقط أحدكم من نعمة الله، حتى لا يتأصل بينكم جذر مرارة، فيسبب بلبلة، وينجس كثيرين منكم."]]}], "kwAr": "حدث", "noteAr": ""}, {"kw": "and the", "raw": "2Sa_7:1; 2Ch_6:7; Psa_139:4; Mat_18:19, Mat_18:20; Act_4:31-33", "note": "", "refs": [{"l": "2Sa 7:1", "n": "", "vs": [[1, "وبعد أن استقر الملك في قصره، وأراحه الرب من أعدائه المحيطين به،"]]}, {"l": "2Ch 6:7", "n": "", "vs": [[7, "وقد نوى أبي داود أن يبني هيكلا لاسم الرب إله إسرائيل."]]}, {"l": "Psa 139:4", "n": "", "vs": [[4, "عرفت كل كلمة من قبل أن يتفوه بها لساني."]]}, {"l": "Mat 18:19", "n": "", "vs": [[19, "وأيضا أقول لكم: إذا اتفق اثنان منكم على الأرض في أي أمر، مهما كان ما يطلبانه، فإن ذلك يكون لهما من قبل أبي الذي في السماوات."]]}, {"l": "Mat 18:20", "n": "", "vs": [[20, "فإنه حيثما اجتمع اثنان أو ثلاثة باسمي، فأنا أكون في وسطهم»."]]}, {"l": "Act 4:31-33", "n": "", "vs": [[31, "وفيما هم يصلون ارتج المكان الذي كانوا مجتمعين فيه، وامتل
