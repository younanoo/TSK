 معي على مائدتي»."], [8, "فسجد مفيبوشث وقال: «من هو عبدك حتى تكرم كلبا ميتا مثلي؟»"], [9, "واستدعى الملك صيبا خادم شاول وقال له: «لقد وهبت حفيد سيدك كل ما كان يملكه شاول وأهل بيته."], [10, "فعليك أنت وأبنائك وعبيدك أن تعملوا له في الأرض، وتفلحوها ليكون لحفيد سيدك رزق يعيش منه. أما مفيبوشث حفيد سيدك فيأكل دائما على مائدتي» وكان لصيبا خمسة عشر ابنا وعشرون عبدا."]]}, {"l": "Psa 37:34", "n": "", "vs": [[34, "انتظر الرب واسلك دائما في طريقه، فيرفعك لتمتلك الأرض، وتشهد انقراض الأشرار."]]}, {"l": "Ecc 2:18", "n": "", "vs": [[18, "وكرهت كل ما سعيت من أجله تحت الشمس، لأني سأتركه لمن يخلفني."]]}, {"l": "Ecc 2:19-26", "n": "", "vs": [[19, "ومن يدري: أيكون حكيما أم جاهلا؟ ومع ذلك فإنه سيتولى كل عملي الذي بذلت فيه كل جهدي وحكمتي تحت الشمس. وهذا أيضا باطل."], [20, "فتحولت وأسلمت قلبي لليأس من كل ما بذلته من جهد تحت الشمس."], [21, "إذ قد يترك الإنسان كل ما تعب فيه بحكمة ومعرفة وحذاقة لرجل آخر يتمتع بما لم يشق به. هذا أيضا باطل وشر عظيم."], [22, "فأي نفع للإنسان من جميع تعبه ومكابدته العناء الذي قاسى منه تحت الشمس؟"], [23, "كل أيام حياته مفعمة بالمشقة، وعمله عناء. حتى في الليل لا يستريح قلبه. وهذا أيضا باطل."], [24, "فليس أفضل للإنسان من أن يأكل ويشرب ويتمتع بتعب يديه. وهذا أيضا، كما أرى، هو من يد الله."], [25, "إذ بمعزل عنه من يستطيع أن يأكل ويستمتع؟"], [26, "لأن المرء الذي يحظى برضى الله ينعم الله عليه بالحكمة والمعرفة والفرح. أما الخاطيء فيفرض عليه عناء الجمع والادخار، ليكون ذلك من نصيب من يرضي الله . وهذا أيضا باطل كملاحقة الريح."]]}, {"l": "Ecc 5:13", "n": "", "vs": [[13, "قد رأيت شرا مقيتا تحت الشمس: ثروة مدخرة لغير صاحبها."]]}, {"l": "Ecc 5:14", "n": "", "vs": [[14, "أو ثروة تلفت في مشروع خاسر، ولم يبق (صاحبها) لابنه الذي أنجبه شيئا."]]}, {"l": "Dan 2:48", "n": "", "vs": [[48, "ثم عظم الملك دانيآل ووهبه عطايا كثير ة، وسلطه على كل ولاية بابل، وأقامه رئيسا على كل حكماء بابل وولاتها."]]}], "kwAr": "أن يشرف", "noteAr": ""}], "arS": [["فنزع", ["H5493"]], [" ", []], ["الملك", ["H4428"]], [" ", []], ["خاتمه", ["H2885"]], [" ", []], ["الذي", ["H834"]], [" ", []], ["استرده", ["H5674"]], [" ", []], ["من", ["H4480"]], [" ", []], ["هامان", ["H2001"]], [" ", []], ["وأعطاه", ["H5414"]], [" ", []], ["لمردخاي", ["H4782"]], ["، وطلبت ", []], ["أستير", ["H635"]], [" ", []], ["من", ["H5921"]], [" ", []], ["مردخاي", ["H4782"]], [" أن ", []], ["يشرف", ["H7760"]], [" على ", []], ["ممتلكات", ["H1004"]], [" هامان.", []]]}, {"c": 8, "v": 3, "text": "ثم عادت أستير وكلمت الملك، وانطرحت عند قدميه، وتوسلت إليه باكية ليبطل مؤامرة هامان الأجاجي وتدبيراته التي خططها ضد اليهود،", "groups": [{"kw": "fell", "raw": "1Sa_25:24; 2Ki_4:27", "note": "", "refs": [{"l": "1Sa 25:24", "n": "", "vs": [[24, "وانطرحت عند رجليه قائلة: «ضع اللوم علي وحدي يا سيدي، ودع أمتك تتكلم في مسامعك واصغ إلى حديثها."]]}, {"l": "2Ki 4:27", "n": "", "vs": [[27, "فلما جاءت إلى رجل الله في الجبل تشبثت بقدميه. فاقترب منها جيحزي ليبعدها عنه، فقال رجل الله: «اتركها، فإن نفسها مريرة في داخلها والرب لم يكشف لي ما بها»."]]}], "kwAr": "انطرحت", "noteAr": ""}, {"kw": "besought him with tears", "raw": "Heb. she wept and besought him, Isa_38:2; Hos_12:4; Heb_5:7", "note": "Heb. she wept and besought him, Isa_38:2; Hos_12:4; Heb_5:7", "refs": [{"l": "Isa 38:2", "n": "", "vs": [[2, "فأدار حزقيا وجهه نحو الحائط وصلى إلى الرب،"]]}, {"l": "Hos 12:4", "n": "", "vs": [[4, "تصارع مع الملاك وغلب. بكى والتمس رضاه وبركته، التقاه الله في بيت إيل فخاطبه هناك."]]}, {"l": "Heb 5:7", "n": "", "vs": [[7, "والمسيح، في أثناء حياته البشرية على الأرض، رفع أدعية وتضرعات مقترنة بصراخ شديد ودموع، إلى القادر أن يخلصه من الموت. وقد لبى الله طلبه إكراما لتقواه."]]}], "kwAr": "توسلت إليه باكية", "noteAr": "بالعبرانية: بكت وتوسلت إليه. انظر إش 38: 2؛ هو 12: 4؛ عب 5: 7"}, {"kw": "mischief", "raw": "Est_3:8-15, Est_7:4", "note": "", "refs": [{"l": "Est 3:8-15", "n": "", "vs": [[8, "فقال هامان للملك أحشويروش: «هناك شعب ما متشتت ومتفرق بين الشعوب في كل أرجاء مملكتك، تغاير شرائعهم شرائع جميع الأمم، وهم لا ينفذون سنن الملك. فلا يجدر بالملك إغفال أمرهم."], [9, "فإن طاب للملك، فليصدر أمرا بإبادتهم، وأنا أدفع عشرة آلاف وزنة من الفضة (نحو ثلاث مئة ."], [15, "ثم تجمع المتآمرون في حضرة الملك للمرة الثانية وقالوا له: «اعلم أيها الملك أن شريعة مادي وفارس تنص على أن كل نهي أو أمر يوقعه الملك لا يتغير»."]]}, {"l": "2Ti 2:19", "n": "", "vs": [[19, "إلا أن الأساس الراسخ الذي وضعه الله يظل ثابتا، وعليه هذا الختم: «الرب يعرف خاصته»، وأيضا: «لينفصل عن الإثم كل من يسمي اسم الرب!»"]]}, {"l": "Heb 6:17", "n": "", "vs": [[17, "ولذلك، لما أراد الله أن يؤكد بصورة قاطعة لوارثي وعده، أن قراره لا يتغير أبدا، ثبته بالقسم."]]}, {"l": "Heb 6:18", "n": "", "vs": [[18, "فاستنادا إلى وعد الله وقسمه، وهما أمران ثابتان لا يتغيران ويستحيل أن يكذب الله فيهما، نحصل على تشجيع قوي، بعدما التجأنا إلى التمسك بالرجاء الموضوع أمامنا."]]}], "kwAr": "لا تبطل", "noteAr": "ولا حتى الملك نفسه؛ وهذا هو السبب في أن الملك اضطر إلى ألا ينقض المرسوم الأول بل أصدر مرسوما مناقضا، ليتمكن اليهود، إن هوجموا بموجب المرسوم الأول، من الدفاع عن أنفسهم شرعا بموجب الثاني، فيقتلوا أعداءهم بل ويأخذوا الغنيمة. انظر أس 8: 5؛ 1: 19؛ دا 6: 8؛ 6: 12-15؛ 2تي 2: 19؛ عب 6: 17، 18"}], "arS": [["فاكتبا", ["H3789"]], [" أنتما ", []], ["إلى", ["H5921"]], [" ", []], ["اليهود", ["H3064"]], [" بكل ", []], ["ما", ["H834"]], [" ", []], ["تريانه", ["H2896"]], [" مناسبا ", []], ["باسم", ["H8034", "H4428"]], [" ", []], ["الملك", ["H4428"]], ["، ", []], ["واختماه", ["H2856"]], [" ", []], ["بخاتمه", ["H2885"]], ["، ", []], ["لأن", ["H3588"]], [" المراسيم التي تسن ", []], ["باسم", ["H8034"]], [" ", []], ["الملك", ["H4428"]], [" ", []], ["وتختم", ["H2856"]], [" بخاتمه ", []], ["لا", ["H369"]], [" ", []], ["تبطل", ["H7725"]], ["».", []]]}, {"c": 8, "v": 9, "text": "فاستدعي كتاب الملك على التو، في اليوم الثالث والعشرين من شهر سيوان، (تموز ; يوليو) وكتبوا ما أملاه عليهم مردخاي إلى اليهود والحكام والولاة ورؤساء الأقاليم، التي تمتد من الهند إلى كوش، والبالغ عددها مئة وسبعة وعشرين إقليما إلى كل إقليم بلغته ولهجة شعبه، وإلى اليهود بلغتهم ولهجتهم.", "groups": [{"kw": "the kings", "raw": "Est_3:12", "note": "", "refs": [{"l": "Est 3:12", "n": "", "vs": [[12, "وفي اليوم الثالث عشر من الشهر الأول استدع nd, is rendered India by all the versions. India, or Hindostan, is a large country of the south of Asia, extending from north to south about 2,400 miles, and from east to west 1,800, between 8 degrees and 35 degrees n lat. and 68 degrees and 92 degrees e long.; being bounded on the west by the Indus, east by the Birman empire and Thibet, north by the Indian Caucasus, and south by the Indian Ocean. It is probable, however, that all the country east of the Indus was anciently called India.", "refs": [], "kwAr": "الهند", "noteAr": "الكلمة العبرانية «هدو»، وبالسريانية «هندو» وبالعربية «هند»، تترجمها كل الترجمات «الهند». والهند أو هندستان بلاد واسعة في جنوب آسيا، تمتد من الشمال إلى الجنوب نحو 2400 ميل ومن الشرق إلى الغرب 1800 ميل، بين خطي عرض 8 و35 شمالا وخطي طول 68 و92 شرقا، يحدها غربا نهر السند وشرقا الإمبراطورية البورمية والتبت وشمالا القوقاز الهندي وجنوبا المحيط الهندي. والمرجح أن كل البلاد شرق السند كانت تسمى قديما الهند"}, {"kw": "and according", "raw": "Est_1:22, Est_3:12; 2Ki_18:26; Dan_4:1; 1Co_14:9-11", "note": "", "refs": [{"l": "Est 1:22", "n": "", "vs": [[22, "فبعث رسائل إلى كل أرجاء المملكة، مكتوبة بلغة أقاليمها وبلهجة شعوبها، يأمر فيها أن يكون كل رجل السيد المطاع في بيته وأوصى أن يذاع هذا الأمر حسب لغة كل شعب."]]}, {"l": "Est 3:12", "n": "", "vs": [[12, "وفي اليوم الثالث عشر من الشهر الأول استدعي كتاب الملك وأمليت عليهم أوامر هامان إلى ولاة الملك وإلى حكام كل إقليم بإقليمه، وإلى رؤساء كل شعب بشعبه، حسب لغة كل إقليم ولهجة أهلها، ووقع تلك الرسائل باسم الملك أحشويروش وختمها بخاتمه."]]}, {"l": "2Ki 18:26", "n": "", "vs": [[26, "فقال ألياقيم بن حلقيا وشبنة ويواخ لقائد الجيش: «خاطب عبيدك بالأرامية لأننا نفهمها، ولا تخاطبنا باللغة اليهودية لئلا يسمع الشعب المتجمع على السور»."]]}, {"l": "Dan 4:1", "n": "", "vs": [[1, "من نبوخذناصر الملك إلى جميع الشعوب والأمم والأقوام من كل لسان المقيمين في كل الأرض: ليكثر سلامكم."]]}, {"l": "1Co 14:9-11", "n": "", "vs": [[9, "فهذه حالكم أيضا في التكلم بلغة مجهولة، فإن كنتم لا تنطقون بكلام مميز، فكيف يفهم السامعون ما تقولون؟ فإنكم 8: 28؛ 97: 11؛ أم 4: 18، 19؛ 11: 10؛ إش 30: 29، 30؛ 35: 10"}], "arS": [["وعمت ", []], ["اليهود", ["H3064", "H219"]], [" ", []], ["الغبطة", ["H8057"]], [" والسعادة ونور ", []], ["الفرح", ["H8342"]], [" المتألق، ونالهم ", []], ["الإكرام", ["H3366"]], [".", []]]}, {"c": 8, "v": 17, "text": "وساد الفرح يهود كل بلاد المملكة ومدنها عندما وصلهم مرسوم الملك وأمره، فأقاموا الولائم واحتفلوا. وكثيرون من أبناء أمم الأقاليم تهودوا لأن الخوف من اليهود طغى عليهم.", "groups": [{"kw": "a feast", "raw": "Est_9:17, Est_9:19, Est_9:22; 1Sa_25:8; Neh_8:10", "note": "", "refs": [{"l": "Est 9:17", "n": "", "vs": [[17, "حدث هذا في اليوم الثالث عشر من شهر أذار، واستراحوا في اليوم الرابع عشر منه، حيث احتفلوا فيه شاربين فرحين."]]}, {"l": "Est 9:19", "n": "", "vs": [[19, "لهذا يحتفل اليهود المقيمون في مدن المناطق الريفية باليوم الرابع عشر من أذار إلى هذا اليوم، فيقيمون الولائم ويبتهجون ويتبادلون الهدايا."]]}, {"l": "Est 9:22", "n": "", "vs": [[22, "وهما اليومان اللذان استراح فيهما اليهود من أعدائهم، وهو الشهر الذي تحول عندهم من شهر حزن إلى شهر فرح، ومن نواح إلى احتفال، فيجعلونهما يومي شرب وفرح وتبادل هدايا وإحسان إلى الفقراء."]]}, {"l": "1Sa 25:8", "n": "", "vs": [[8, "تحر الأمر من غلمانك فيخبروك. لذلك ليحظ غلماني برضاك، فقد جئنا إليك في يوم عيد، فهب عبيدك وابنك داود ما تجود به نفسك»."]]}, {"l": "Neh 8:10", "n": "", "vs": [[10, "ثم استطرد نحميا: «اذهبوا واحتفلوا آكلين أطايب الطعام، وشاربين حلو الشراب، وابعثوا أنصبة لمن لم يعد لهم. ولا تحزنوا لأن هذا اليوم مقدس لسيدنا، ففرح الرب هو قوتكم»."]]}], "kwAr": "الولائم", "noteAr": ""}, {"kw": "many of the people", "raw": "Psa_18:43; Zec_8:20-23", "note": "", "refs": [{"l": "Psa 18:43", "n": "", "vs": [[43, "تنقذني من ثورات الشعب، وتجعلني سيدا للأمم، حتى صار شعب لم أكن أعرفه عبدا يخدمني."]]}, {"l": "Zec 8:20-23", "n": "", "vs": [[20, "وستأتي شعوب أيضا وأفواج من سكان مدن كثيرة إلى أورشليم."], [21, "ويمضي أهل المدينة الواحدة إلى المدينة الأخرى قائلين: هيا نذهب على الفور لنطلب رضى وجه الرب القدير ونلتمس بركته، لأننا على أي حال منطلقون إلى هناك."], [22, "ف ing to their will, The Chaldee paraphrast says that none appeared against the Jews but Amalekites only, who were infatuated, and had their hearts hardened, as Pharaohs against Israel, to take up arms to their own destruction. Some had such an inveterate, implacable malice against the Jews, that Hamans fall and Mordecais advancement, instead of convincing, seemed only to exasperate them the more. How have the most dreadful scourges ravaged a country, and yet the inhabitants are unmindful of the Almighty Disposer of events, and that the cause of his righteous displeasure is their continual provocation! Forty years long was he grieved with one generation, who learned not his ways, although daily fed and clothed by a miracle.", "note": "Heb. according to their will, The Chaldee paraphrast says that none appeared against the Jews but Amalekites only, who were infatuated, and had their hearts hardened, as Pharaohs against Israel, to take up arms to their own destruction. Some had such an inveterate, implacable malice against the Jews, that Hamans fall and Mordecais advancement, instead of convincing, seemed only to exasperate them the more. How have the most dreadful scourges ravaged a country, and yet the inhabitants are unmindful of the Almighty Disposer of events, and that the cause of his righteous displeasure is their continual provocation! Forty years long was he grieved with one generation, who learned not his ways, although daily fed and clothed by a miracle.", "refs": [], "kwAr": "ما شاءوا", "noteAr": "بالعبرانية: حسب مشيئتهم. ويقول المفسر الكلداني إنه لم يقف في وجه اليهود إلا العمالقة وحدهم، وقد أعماهم الله وقسى قلوبهم كفرعون ضد إسرائيل ليحملوا السلاح إلى هلاكهم. وكان بعضهم يحمل حقدا مزمنا لا يهدأ على اليهود، حتى إن سقوط هامان ورفعة مردخاي لم يقنعاهم بل زادا غيظهم. كم من ضربات رهيبة اجتاحت بلادا وسكانها غافلون عن الله ضابط الأحداث، وعن أن سبب سخطه البار هو استفزازهم المتواصل! أربعين سنة تضايق من جيل واحد لم يتعلم طرقه، مع أنه كان يطعمه ويكسوه يوميا بمعجزة"}], "a هم ويتقاسمون الثمن على قدر احتياج كل منهم،"], [46, "ويداومون على الحضور إلى الهيكل يوميا بقلب واحد، ويكسرون الخبز في البيوت، ويتناولون الطعام معا بابتهاج وبساطة قلب،"]]}, {"l": "Gal 2:10", "n": "", "vs": [[10, "على ألا نغفل أمر الفقراء، وهذا عينه طالما كنت مجتهدا في العمل له."]]}], "kwAr": "تبادل هدايا", "noteAr": ""}], "arS": [["وهما ", []], ["اليومان", ["H3117"]], [" ", []], ["اللذان", ["H834"]], [" ", []], ["استراح", ["H5117"]], [" فيهما ", []], ["اليهود", ["H3064"]], [" ", []], ["من", ["H4480"]], [" ", []], ["أعدائهم", ["H341"]], ["، ", []], ["وهو", ["H834"]], [" ", []], ["الشهر", ["H2320"]], [" ", []], ["الذي", ["H376"]], [" ", []], ["تحول", ["H2015"]], [" عندهم ", []], ["من", ["H4480"]], [" شهر ", []], ["حزن", ["H3015", "H60"]], [" إلى شهر ", []], ["فرح", ["H8057", "H4960"]], ["، ", []], ["ومن", ["H4480"]], [" نواح إلى احتفال، فيجعلونهما يومي شرب ", []], ["وفرح", ["H8057"]], [" ", []], ["وتبادل", ["H4916"]], [" ", []], ["هدايا", ["H4979"]], [" ", []], ["وإحسان", ["H2896"]], [" إلى ", []], ["الفقراء", ["H34"]], [".", []]]}, {"c": 9, "v": 23, "text": "فقبل اليهود ما عرضه عليهم مردخاي، واستمروا يحتفلون بذلك اليوم في كل سنة،", "groups": [], "arS": [["فقبل", ["H6901"]], [" ", []], ["اليهود", ["H3064"]], [" ", []], ["ما", ["H834"]], [" عرضه عليهم ", []], ["مردخاي", ["H4782"]], ["، واستمروا ", []], ["يحتفلون", ["H6213"]], [" بذلك ", []], ["اليوم", ["H834"]], [" ", []], ["في", ["H413"]], [" كل سنة،", []]]}, {"c": 9, "v": 24, "text": "تذكارا لمؤامرة هامان بن همداثا الأجاجي عدو اليهود، الذي سعى لإبادتهم، وألقى القرعة، أي الفور لإفنائهم وإهلاكهم.", "groups": [{"kw": "the enemy", "raw": "Est_9:10, Est_3:5-13", "note": "", "refs": [{"l": "Est 9:10", "n": "", "vs": [[10, "وهم عشرة أبناء لهامان بن همداثا عدو اليهود، ولكنهم لم يقدموا إطلاقا على النهب."]]}, {"l": "Est 3:5-13", "n": "", "vs": [[5, "وعندما تثبت هامان من أن مردخاي لا ينحني ولا يسجد له استشاط غضبا،"], [6, "واستصغر أن يعاقب مردخاي وحده، بعد أن أخبروه عن شعب مردخاي. فعزم أن يفني جميع اليهود، شعب مردخاي، المقيمين في كل أرجاء مملكة أحشويروش."], [7, "وفي الشهر الأول، أي شهر نيسان، من السنة الثانية عشرة لحكم الملك أحشويروش، أخذوا في إلقاء القرعة أمام هامان، يوما بعد يوم، وشهرا بعد شهر حتى الشهر الثاني عشر، أي شهر أذار، وكانوا يدعون القرعة «فورا»."], [8, "فقال هامان للملك أحشويروش: «هناك شعب ما متشتت ومتفرق بين الشعوب في كل أرجاء مملكتك، تغاير شرائعهم شرائع جميع الأمم، وهم لا ينفذون سنن الملك. فلا يجدر بالملك إغفال أمرهم."], [9, "فإن طاب للملك، فليصدر أمرا بإبادتهم، وأنا أدفع عشرة آلاف وزنة من الفضة (نحو ثلاث مئة ألف كيلوجرام) للخزينة الملكية لتغطية نفقات ذلك»."], [10, "فنزع الملك خاتمه من أصبعه، وأعطاه لهامان بن همداثا الأجاجي عدو اليهود، إعرابا عن موافقته،"], [11, "وقال له: «لقد وهبتك الفضة والشعب أيضا، فافعل بهم ما يحلو لك»."], [12, "وفي اليوم الثالث عشر من الشهر الأول استدعي كتاب الملك وأمليت عليهم أوامر هامان إلى ولاة الملك وإلى حكام كل إقليم بإقليمه، وإلى رؤساء كل شعب بشعبه، حسب لغة كل إقليم ولهجة أهلها، ووقع تلك الرسائل باسم الملك أحشويروش وختمها بخاتمه."], [13, "وحمل السعاة الرسائل إلى جميع أقاليم المملكة، وفيها أمر بإبادة وقتل وإهلاك جميع اليهود، شبانا وشيوخا وأطفالا ونساء في يوم واحد، هو الثالث عشر من الشهر الثاني عشر، أي شهر أذار، والاستيلاء على غنائمهم."]]}], "kwAr": "عدو", "noteAr": ""}, {"kw": "Pur", "raw": "The word pur seems to be derived either from the Persian bahr and bar, a part, portion, lot, or pari, anything which happens fortuitously or fortunately; whence the annual festival in commemoration of the wonderful deliverance of the Jews from their enemies was called Purim, or in Arabic and Persian, Fuhr, or Lots; which has been observed by them, in all places of their dispersion, from that day to the present time, without any interruption. Est_3:7", "note": "The word pur seems to be derived either from the Persian bahr and bar, a part, portion, lot, or pari, anything which happens fortuitously or fortunately; whence the annual festival in commemoration of the wonderful deliverance of the Jews from their enemies was called Purim, or in Arabic and Persian, Fuhr, or Lots; which has been observed by them, in all places of their dispersion, from that day to the present time, without any interruption. Est_3:7", "refs": [{"l": "Est 3:7", "n": "", "vs": [[7, "وفي الشهر الأول، أي شهر نيسان، من السنة الثانية عشرة لحكم الملك أحشويروش، أخذوا في إلقاء القرعة أمام هامان، يوما بعد يوم، وشهرا بعد شهر حتى الشهر الثاني عشر، أي شهر أذار، وكانوا يدعون القرعة «فورا»."]]}], "kwAr": "القرعة", "noteAr": "يبدو أن كلمة «فور» مشتقة إما من الفارسية «بهر» أو «بار» أي حصة ونصيب وقرعة، أو «باري» أي ما يحدث مصادفة أو بحظ سعيد؛ ومن هنا سمي العيد السنوي إحياء للخلاص العجيب لليهود من أعدائهم «فوريم»، أو بالعربية والفارسية «فهر» أي القرعة، وقد احتفلوا به في كل أماكن شتاتهم منذ ذلك اليوم حتى الآن دون انقطاع. انظر أس 3: 7"}, {"kw": "consume", "raw": "Heb. crush", "note": "Heb. crush", "refs": [], "kwAr": "إفنائهم", "noteAr": "بالعبرانية: سحق"}], "arS": [["تذكارا لمؤامرة ", []], ["هامان", ["H2001"]], [" ", []], ["بن", ["H1121"]], [" ", []], ["همداثا", ["H4099"]], [" ", []], ["الأجاجي", ["H91"]], [" ", []], ["عدو", ["H6887"]], [" ", []], ["اليهود", ["H3064"]], ["، الذي ", []], ["سعى", ["H2803"]], [" ", []], ["لإبادتهم", ["H6"]], ["، ", []], ["وألقى", ["H5307"]], [" ", []], ["القرعة", ["H1486"]], ["، ", []], ["أي", ["H3605"]], [" ", []], ["الفور", ["H6332"]], [" ", []], ["لإفنائهم", ["H2000"]], [" وإهلاكهم.", []]]}, {"c": 9, "v": 25, "text": "ولكن حالما لفتت أستير انتباه الملك إلى المؤامرة أصدر مرسوما ارتد فيه كيد هامان الذي كاده لليهود على رأسه، وتم صلبه مع أبنائه على خشبة.", "groups": [{"kw": "when Esther came", "raw": "Heb. when she came, Est_9:13, Est_9:14, Est_7:5-10, Est_8:1-14", "note": "Heb. when she came, Est_9:13, Est_9:14, Est_7:5-10, Est_8:1-14", "refs": [{"l": "Est 9:13", "n": "", "vs": [[13, "فأجابت: «إن طاب للملك فليؤذن لليهود في شوشن العاصمة أن يفعلوا غدا ما فعلوه اليوم ويصلبوا أبناء هامان العشرة على خشبة»."]]}, {"l": "Est 9:14", "n": "", "vs": [[14, "فأمر الملك بتنفيذ الطلب، وأصدر مرسوما بذلك في شوشن العاصمة، وصلبوا أبناء هامان العشرة."]]}, {"l": "Est 7:5-10", "n": "", "vs": [[5, "فقال الملك أحشويروش للملكة أستير: «من هو هذا الذي يجرؤ أن يرتكب مثل هذا؟ أين هو؟»"], [6, "فأجابت: «إن هذا الخصم والعدو هو هامان الشرير»."], [7, "فارتاع هامان أمام الملك والملكة. وانصرف الملك عن الشرب مغتاظا، ومضى إلى حديقة القصر. ووقف هامان يتوسل إلى أستير الملكة حفاظا على حياته، لأنه أدرك أن الملك قد قرر مصيره الرهيب."], [8, "وعندما رجع الملك من حديقة القصر إلى قاعة المأدبة، وجد هامان منطرحا على الأريكة التي كانت أستير تجلس عليها. فقال الملك: «أيتحرش أيضا بالملكة وهي معي، وفي القصر؟» وما إن نطق الملك بهذه العبارة حتى غطوا وجه هامان."], [9, "فقال حربونا أحد الخصيان الماثلين في حضرة الملك: «ها هي الخشبة التي أعدها هامان لصلب مردخاي، الذي أسدى للملك خيرا، منصوبة في بيت هامان، وارتفاعها خمسون ذراعا». فقال الملك: «اصلبوه عليها»."], [10, "فصلبوا هامان على الخشبة التي أعدها لمردخاي. ثم هدأت سورة غضب الملك."]]}, {"l": "Est 8:1-14", "n": "", "vs": [[1, "في ذلك اليوم وهب الملك أحشويروش للملكة أستير بيت هامان عدو اليهود. ومثل مردخاي أمام الملك لأن أستير أطلعته على قرابته منها،"], [2, "فنزع الملك خاتمه الذي استرده من هامان وأعطاه لمردخاي، وطلبت أستير من مردخاي أن يشرف على ممتلكات هامان."], [3, "ثم عادت أستير وكلمت الملك، وانطرحت عند قدميه، وتوسلت إليه باكية ليبطل مؤامرة هامان الأجاجي وتدبيراته التي خططها ضد اليهود،"], [4, "فمد الملك لأستير صولجان الذهب، فنهضت ووقفت أمامه"], [5, "وقالت: «إذا طاب للملك وحظيت برضاه، واستصوب الملك الرأي، ورقت أنا في عينيه، فليصدر الملك أوامر تلغي رسائل تدبيرات هامان بن همداثا الأجاجي، التي بعث بها لإبادة اليهود المقمين في كل أقاليم الملك،"], [6, "إذ كيف يمكن أن أرى الشر يحيق بشعبي؟ وكيف يمكن أن أشهد هلاك أبناء جنسي؟»"], [7, "فقال الملك أحشويروش للملكة أستير ولمردخاي اليهودي: «لقد أعطيت ممتلكات هامان لأستير، وصلبته هو على خشبة، لأنه حاول أن يمس اليهود بسوء."], [8, "فاكتبا أنتما إلى اليهود بكل ما تريانه مناسبا باسم الملك، واختماه بخاتمه، لأن المراسيم التي تسن باسم الملك وتختم بخاتمه لا تبطل»."], [9, "فاستدعي كتاب الملك على التو، في اليوم الثالث والعشرين من شهر سيوان، (تموز ; يوليو) وكتبوا ما أملاه عليهم مردخاي إلى
