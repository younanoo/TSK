<script>window.CATALOG=[{"id": 17, "abbr": "Est", "en": "Esther", "nc": 10, "nv": 167, "refs": 1266, "last": "10:3", "first": "وحدث في أيام أحشويروش، الذي امتد حكمه من الهند إلى كوش، فملك على مئة وسبعة وعشرين إقليما،"}, {"id": 18, "abbr": "Job", "en": "Job", "nc": 42, "nv": 1070, "refs": 10209, "last": "42:17", "first": "عاش في أرض عوص رجل اسمه أيوب، كان صالحا كاملا يتقي الله ويحيد عن الشر."}, {"id": 19, "abbr": "Psa", "en": "Psalms", "nc": 150, "nv": 2461, "refs": 33395, "last": "150:6", "first": "طوبى للإنسان الذي لا يتبع مشورة الأشرار، ولا يقف في طريق الخاطئين، ولا يجالس المستهزئين."}, {"id": 20, "abbr": "Pro", "en": "Proverbs", "nc": 31, "nv": 915, "refs": 10457, "last": "31:31", "first": "هذه هي أمثال سليمان بن داود ملك إسرائيل،"}, {"id": 21, "abbr": "Ecc", "en": "Ecclesiastes", "nc": 12, "nv": 222, "refs": 3186, "last": "12:14", "first": "هذه أقوال الجامعة ابن داود ملك أورشليم."}, {"id": 22, "abbr": "Son", "en": "Song of Solomon", "nc": 8, "nv": 117, "refs": 1802, "last": "8:14", "first": "هذا نشيد الأناشيد لسليمان."}, {"id": 23, "abbr": "Isa", "en": "Isaiah", "nc": 66, "nv": 1292, "refs": 21959, "last": "66:24", "first": "هذه هي رؤيا إشعياء بن آموص، التي أعلنت له بشأن يهوذا وأورشليم في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا."}, {"id": 24, "abbr": "Jer", "en": "Jeremiah", "nc": 52, "nv": 1364, "refs": 20659, "last": "52:34", "first": "هذه نبوءة إرميا بن حلقيا أحد الكهنة المقيمين في عناثوث بأرض سبط بنيامين."}, {"id": 25, "abbr": "Lam", "en": "Lamentations", "nc": 5, "nv": 154, "refs": 2238, "last": "5:22", "first": "كيف أصبحت المدينة الآهلة بالسكان مهجورة وحيدة؟ صارت كأرملة! هذه التي كانت عظيمة بين الأمم. السيدة بين المدن صارت تحت الجزية!"}, {"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 48, "nv": 1273, "refs": 15264, "last": "48:35", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 17, "abbr": "Est", "en": "Esther", "verses": [{"c": 1, "v": 1, "text": "وحدث في أيام أحشويروش، الذي امتد حكمه من الهند إلى كوش، فملك على مئة وسبعة وعشرين إقليما،", "groups": [{"kw": "Ahasuerus", "raw": "Prideaux has shewn satisfactorily that Ahasuerus was the Artaxerxes Longimanus of the Greeks, agreeably to the Septuagint and Josephus. See note on Ezr_6:14. Ezr_4:6; Dan_9:1", "note": "Prideaux has shewn satisfactorily that Ahasuerus was the Artaxerxes Longimanus of the Greeks, agreeably to the Septuagint and Josephus. See note on Ezr_6:14. Ezr_4:6; Dan_9:1", "refs": [{"l": "Ezr 6:14", "n": "", "vs": [[14, "وهكذا تابع شيوخ اليهود البناء بنجاح، تتميما لنبوءة حجي النبي وزكريا بن عدو، فاستكملوا البناء حسب أمر إله إسرائيل وأمر كورش وداريوس وأرتحششتا ملوك فارس."]]}, {"l": "Ezr 4:6", "n": "", "vs": [[6, "وفي مستهل ولاية الملك أحشويروش رفعوا شكوى ضد سكان يهوذا وأورشليم."]]}, {"l": "Dan 9:1", "n": "", "vs": [[1, "في السنة الأولى من حكم داريوس بن أحشويروش من ذرية الماديين، الذي اعتلى عرش مملكة الكلدانيين."]]}], "kwAr": "أحشويروش", "noteAr": "أثبت بريدو بصورة مقنعة أن أحشويروش هو أرتحشستا لونغيمانوس عند اليونان، وفقا للسبعينية ويوسيفوس. انظر الملاحظة على عزرا 6: 14. انظر عز 4: 6؛ دا 9: 1"}, {"kw": "from India", "raw": "Est_8:9; Isa_18:1, Isa_37:9", "note": "", "refs": [{"l": "Est 8:9", "n": "", "vs": [[9, "فاستدعي كتاب الملك على التو، في اليوم الثالث والعشرين من شهر سيوان، (تموز ; يوليو) وكتبوا ما أملاه عليهم مردخاي إلى اليهود والحكام والولاة ورؤساء الأقاليم، التي تمتد من الهند إلى كوش، والبالغ عددها مئة وسبعة وعشرين إقليما إلى كل إقليم بلغته ولهجة شعبه، وإلى اليهود بلغتهم ولهجتهم."]]}, {"l": "Isa 18:1", "n": "", "vs": [[1, "ويل لأرض حفيف الأجنحة في عبر أنهار كوش،"]]}, {"l": "Isa 37:9", "n": "", "vs": [[9, "ثم بلغ ملك أشور أن ترهاقة ملك كوش قد خرج لمحاربته، فبعث مرة أخرى رسله إلى حزقيا قائلا لهم:"]]}], "kwAr": "من الهند", "noteAr": ""}, {"kw": "an hundred", "raw": "Dan_6:1", "note": "", "refs": [{"l": "Dan 6:1", "n": "", "vs": [[1, "وارتأى داريوس أن يولي على المملكة مئة وعشرين حاكما يشرفون على أقاليم المملكة كلها،"]]}], "kwAr": "مئة وسبعة وعشرين", "noteAr": ""}], "arS": [["وحدث", ["H1961"]], [" في ", []], ["أيام", ["H3117"]], [" ", []], ["أحشويروش", ["H325"]], ["، الذي امتد ", []], ["حكمه", ["H4427"]], [" ", []], ["من", ["H4480"]], [" ", []], ["الهند", ["H1912"]], [" ", []], ["إلى", ["H5704"]], [" ", []], ["كوش", ["H3568"]], ["، فملك على ", []], ["مئة", ["H3967"]], [" ", []], ["وسبعة", ["H7651"]], [" ", []], ["وعشرين", ["H6242"]], [" ", []], ["إقليما", ["H4082"]], ["،", []]]}, {"c": 1, "v": 2, "text": "أنه جلس ذات يوم على عرش ملكه في شوشن القصر،", "groups": [{"kw": "sat", "raw": "2Sa_7:1; 1Ki_1:46; Dan_4:4", "note": "", "refs": [{"l": "2Sa 7:1", "n": "", "vs": [[1, "وبعد أن استقر الملك في قصره، وأراحه الرب من أعدائه المحيطين به،"]]}, {"l": "1Ki 1:46", "n": "", "vs": [[46, "وقد جلس سليمان على كرسي المملكة»."]]}, {"l": "Dan 4:4", "n": "", "vs": [[4, "أنا نبوخذناصر كنت مقيما مطمئنا في بيتي، أتمتع في البحبوحة في قصري،"]]}], "kwAr": "جلس", "noteAr": ""}, {"kw": "Shushan", "raw": "Est_2:3, Est_3:15, Est_4:16, Est_9:12-15; Neh_1:1; Dan_8:2", "note": "", "refs": [{"l": "Est 2:3", "n": "", "vs": [[3, "وليعهد الملك إلى وكلائه في كل أرجاء مملكته حتى يجمعوا كل الفتيات العذارى الفاتنات إلى جناح الحريم في شوشن القصر، ليكن تحت إشراف هيجاي خصي الملك وحارس النساء، حيث تقدم إليهن الدهون المعطرة."]]}, {"l": "Est 3:15", "n": "", "vs": [[15, "وهكذا انطلق السعاة مسرعين تلبية لأمر الملك، بعد أن صدر الأمر في شوشن العاصمة. وجلس الملك وهامان يتنادمان على الشراب. أما أهل شوشن فقد اعترتهم الحيرة!"]]}, {"l": "Est 4:16", "n": "", "vs": [[16, "«امض اجمع كل اليهود المقيمين في شوشن، وصوموا من أجلي ولا تأكلوا ولا تشربوا ثلاثة أيام ليلا ونهارا، وسأصوم أنا ووصيفاتي أيضا مثلكم. ثم أدخل إلى الملك مخالفة العرف المتبع، فإذا هلكت، هلكت»."]]}, {"l": "Est 9:12-15", "n": "", "vs": [[12, "فقال الملك لأستير الملكة: «إن كان اليهود قد قتلوا في العاصمة شوشن وحدها خمس مئة رجل، فضلا عن أبناء هامان العشرة، فكم قتلوا في باقي أقاليم الملك؟ والآن ما هو سؤلك فألبيه، وما هي طلبتك فأقضيها لك؟»"], [13, "فأجابت: «إن طاب للملك فليؤذن لليهود في شوشن العاصمة أن يفعلوا غدا ما فعلوه اليوم ويصلبوا أبناء هامان العشرة على خشبة»."], [14, "فأمر الملك بتنفيذ الطلب، وأصدر مرسوما بذلك في شوشن العاصمة، وصلبوا أبناء هامان العشرة."], [15, "ثم اجتمع اليهود المقيمون في العاصمة شوشن في اليوم الرابع عشر أيضا من شهر أذار، وقتلوا ثلاث مئة رجل، ولكنهم لم يقدموا على النهب."]]}, {"l": "Neh 1:1", "n": "", "vs": [[1, "من حديث نحميا بن حكليا، قال: «في شهر كسلو (أي كانون الأول ; ديسمبر) في السنة العشرين من حكم أرتحششتا، بينما كنت في العاصمة شوشن،"]]}, {"l": "Dan 8:2", "n": "", "vs": [[2, "وكنت آنئذ في شوشان عاصمة ولاية عيلام بجوار نهر أولاي،"]]}], "kwAr": "شوشن", "noteAr": ""}], "arS": [["أنه ", []], ["جلس", ["H3427"]], [" ذات ", []], ["يوم", ["H3117"]], [" ", []], ["على", ["H5921"]], [" ", []], ["عرش", ["H3678"]], [" ", []], ["ملكه", ["H4428", "H4438"]], [" في ", []], ["شوشن", ["H7800"]], [" ", []], ["القصر", ["H1002"]], ["،", []]]}, {"c": 1, "v": 3, "text": "في السنة الثالثة من عهده، وأقام مأدبة لجميع رؤساء جيش مادي وفارس وقادته، ومثل أمامه نبلاء المملكة وعظماؤها.", "groups": [{"kw": "", "raw": "am 3542, bc 462", "note": "am 3542, bc 462", "refs": [], "kwAr": "", "noteAr": "السنة العالمية 3542، قبل الميلاد 462"}, {"kw": "he made", "raw": "Est_2:18; Gen_40:20; 1Ki_3:15; Dan_5:1; Mar_6:21", "note": "", "refs": [{"l": "Est 2:18", "n": "", "vs": [[18, "وأقام الملك مأدبة عظيمة دعا إليها جميع قادته ورجاله، احتفاء بأستير، وأعفى البلاد من الجزية، ووزع الهدايا بسخاء ملكي."]]}, {"l": "Gen 40:20", "n": "", "vs": [[20, "وكان اليوم الثالث هو يوم عيد ميلاد فرعون، فأقام مأدبة لجميع رجاله، وأحضر من السجن رئيس السقاة ورئيس الخبازين أمامهم."]]}, {"l": "1Ki 3:15", "n": "", "vs": [[15, "وعندما استيقظ سليمان من نومه أدرك أن ذلك كان حلما، فعاد إلى أورشليم ووقف أمام تابوت عهد الرب وقرب محرقات وذبائح سلام، وأقام وليمة لكل رجاله."]]}, {"l": "Dan 5:1", "n": "", "vs": [[1, "وأقام بيلشاصر الملك مأدبة عظيمة لنبلاء دولته الألف، وشرب خمرا أمامهم."]]}, {"l": "Mar 6:21", "n": "", "vs": [[21, "ثم سنحت الفرصة عندما أقام هيرودس بمناسبة ذكرى مولده وليمة لعظمائه وقادة الألوف وأعيان منطقة الجليل."]]}], "kwAr": "أقام", "noteAr": ""}, {"kw": "of Persia", "raw": "Est_1:14; Ezr_1:2; Isa_21:2; Jer_51:11; Dan_5:28, Dan_8:20", "note": "", "refs": [{"l": "Est 1:14", "n": "", "vs": [[14, "كرشنا وشيثار وأدماثا وترشيش ومرس ومرسنا ومموكان، وهم سبعة حكماء مقربون إليه من رؤساء مادي وفارس، ممن يمثلون دائما أمام الملك، ويحتلون المراتب الأولى في المملكة:"]]}, {"l": "Ezr 1:2", "n": "", "vs": [[2, "«هذا ما يقوله كورش ملك فارس: لقد وهبني الرب إله السماء جميع ممالك الأرض، وأوصاني أن أشيد له هيكلا في أورشليم في مملكة يهوذا،"]]}, {"l": "Isa 21:2", "n": "", "vs": [[2, "لقد أعلنت لي رؤيا رهيبة: رأيت الناهب ينهب، والمدمر يدمر. فاصعدي يا عيلام، وحاصري يا مادي، لأنني سأسكت كل الأنين الذي سببته."]]}, {"l": "Jer 51:11", "n": "", "vs": [[11, "سنوا السهام، وتقلدوا الأتراس، لأن الرب قد أثار روح ملوك الماديين، إذ وطد العزم على إهلاك بابل، لأن هذا هو انتقام الرب، والثأر لهيكله."]]}, {"l": "Dan 5:28", "n": "", "vs": [[28, "فرس: شطرت مملكتك وأعطيت لمادي وفارس»."]]}, {"l": "Dan 8:20", "n": "", "vs": [[20, "إن الكبش ذا القرنين الذي رأيته هو ملوك مادي وفارس."]]}], "kwAr": "فارس", "noteAr": ""}, {"kw": "the nobles", "raw": "Dan_3:2, Dan_3:3, Dan_6:1, Dan_6:6, Dan_6:7", "note": "", "refs": [{"l": "Dan 3:2", "n": "", "vs": [[2, "واستدعى نبوخذناصر الملك جميع أقطاب الدولة وولاتها وحكامها وقضاتها وأمناء خزائنها ومستشاريها، وسائر كبار موظفي الأقاليم، ليأتوا للاشتراك في تدشين التمثال الذي نصبه."]]}, {"l": "Dan 3:3", "n": "", "vs": [[3, "فاجتمع الأقطاب والحكام والقضاة وأمناء الخزائن والمستشارون وسائر عظماء الأقاليم لتدشين التمثال الذي نصبه نبوخذناصر ومثلوا أمامه."]]}, {"l": "Dan 6:1", "n": "", "vs": [[1, "وارتأى داريوس أن يولي على المملكة مئة وعشرين حاكما يشرفون على أقاليم المملكة كلها،"]]}, {"l": "Dan 6:6", "n": "", "vs": [[6, "عندئذ اجتمع هؤلاء الوزراء والحكام في حضرة الملك قائلين: «لتعش أيها الملك داريوس إلى الأبد."]]}, {"l": "Dan 6:7", "n": "", "vs": [[7, "إن جميع وزراء المملكة وقادة الحرس والحكام والمشيرين والولاة قد تداولوا فيما بينهم على إصدار أمر ملكي صارم يعلن فيه: أن كل من يرفع طلبة إلى إله أو إنسان سواك أيها الملك، لمدة ثلاثين يوما، يطرح في جب الأسود."]]}], "kwAr": "نبلاء", "noteAr": ""}], "arS": [["في ", []], ["السنة", ["H8141"]], [" ", []], ["الثالثة", ["H7969"]], [" من ", []], ["عهده", ["H4427"]], ["، ", []], ["وأقام", ["H6213"]], [" ", []], ["مأدبة", ["H4960"]], [" ", []], ["لجميع", ["H3605"]], [" ", []], ["رؤساء", ["H8269"]], [" ", []], ["جيش", ["H2428"]], [" ", []], ["مادي", ["H4074"]], [" ", []], ["وفارس", ["H6539"]], [" ", []], ["وقادته", ["H5650"]], ["، ومثل ", []], ["أمامه", ["H6440"]], [" ", []], ["نبلاء", ["H8269", "H6579"]], [" ", []], ["المملكة", ["H4082"]], [" وعظماؤها.", []]]}, {"c": 1, "v": 4, "text": "وظلت الولائم قائمة طوال مئة وثمانين يوما، أظهر فيها الملك كل بذخ من غنى ملكه وعزة جلال عظمته.", "groups": [{"kw": "When he", "raw": "Isa_39:2; Eze_28:5; Dan_4:30", "note": "", "refs": [{"l": "Isa 39:2", "n": "", "vs": [[2, "فرحب بهم حزقيا ترحيبا حارا، وأطلعهم على ما في خزائنه من فضة وذهب وأطياب وعطور، وعلى مخازن أسلحته. لم يبق شيء في قصره وفي حوزته لم يرهم إياه."]]}, {"l": "Eze 28:5", "n": "", "vs": [[5, "وبمهارتك العظيمة في التجارة ضاعفت ثروتك، فتكبر قلبك لفرط غناك."]]}, {"l": "Dan 4:30", "n": "", "vs": [[30, "قال: «أليست هذه هي بابل العظيمة التي بنيتها بقوة اقتداري لتكون عاصمة للمملكة، ولجلال مجدي؟»"]]}], "kwAr": "أظهر فيها الملك", "noteAr": ""}, {"kw": "the riches", "raw": "Psa_76:1-4, Psa_145:5, Psa_145:12, Psa_145:13; Dan_2:37-44, Dan_7:9-14; Mat_4:8, Mat_6:13; Rom_9:23; Eph_1:18; Col_1:27; Rev_4:11", "note": "", "refs": [{"l": "Psa 76:1-4", "n": "", "vs": [[1, "الله معروف في يهوذا واسمه معظم في إسرائيل."], [2, "خيمته في أورشليم ومسكنه في جبل صهيون."], [3, "هناك حطم السهام البارقة، والترس والسيف وكل أسلحة الحرب."], [4, "أنت أمجد وأعظم جلالا من الجبال الخالدة"]]}, {"l": "Psa 145:5", "n": "", "vs": [[5, "أتحدث عن بهاء مجدك الجليل، وأتأمل في أعمالك الخارقة."]]}, {"l": "Psa 145:12", "n": "", "vs": [[12, "لكي يطلعوا الناس على أفعالك المقتدرة، وعلى بهاء ملكك المجيد."]]}, {"l": "Psa 145:13", "n": "", "vs": [[13, "ملكك ملك سرمدي، وسلطانك من جيل إلى جيل يدوم."]]}, {"l": "Dan 2:37-44", "n": "", "vs": [[37, "أنت أيها الملك هو ملك الملوك، لأن إله السموات أنعم عليك بمملكة وقدرة وسلطان ومجد،"], [38, "وولاك وسلطك على كل ما يسكنه أبناء البشر ووحوش البر وطيور السماء. فأنت الرأس الذي من ذهب."], [39, "ثم لا تلبث أن تقوم من بعدك مملكة أخرى أقل شأنا منك، وتليها مملكة ثالثة أخرى ممثلة بالنحاس فتسود على كل الأرض."], [40, "ثم تعقبها مملكة رابعة صلبة كالحديد، فتحطم وتسحق كل تلك الممالك كالحديد الذي يدق ويسحق كل شيء."], [41, "وكما رأيت أن القدمين والأصابع هي خليط من خزف وحديد، فإن المملكة تكون منقسمة فيكون فيها من قوة الحديد، بمقدار ما شاهدت فيها من الحديد مختلطا بالخزف."], [42, "وكما أن أصابع القدمين بعضها من حديد والبعض من خزف، فإن بعض المملكة يكون صلبا والبعض الآخر هشا."], [43, "وكما رأيت الحديد مختلطا بخزف الطين، فإن هذه المملكة تعقد صلات زواج مع ممالك الناس الأخرى، إنما لا يلتحمون معا، كما أن الحديد لا يختلط بالخزف."], [44, "وفي عهد هؤلاء الملوك يقيم إله السماوات مملكة لا تنقرض إلى الأبد، ولا يترك ملكها لشعب آخر، وتسحق وتبيد جميع هذه الممالك. أما هي فتخلد إلى الأبد."]]}, {"l": "Dan 7:9-14", "n": "", "vs": [[9, "وفيما كنت أنظر، نصبت عروش واعتلى الأزلي كرسيه وكانت ثيابه بيضاء كالثلج، وشعر رأسه كالصوف النقي، وعرشه لهيبا متوهجا وعجلاته نارا متقدة."], [10, "ومن أمامه يتدفق ويجري نهر من نار، وتخدمه ألوف ألوف الملائكة، ويمثل في حضرته عشرات الألوف. فانعقد مجلس القضاء وفتحت الأسفار."], [11, "وبقيت أراقب القرن من جراء ما تفوه به من عظائم، حتى قتل الحيوان وتلف جسمه وطرح وقودا للنار."], [12, "أما سائر الحيوانات فقد جردت من سلطانها، ولكنها وهبت البقاء على قيد الحياة لزمن ما."], [13, "وشاهدت أيضا في رؤى الليل وإذا بمثل ابن الإنسان مقبلا على سحاب حتى بلغ الأزلي فقربوه منه."], [14, "فأنعم عليه بسلطان ومجد وملكوت لتتعبد له كل الشعوب والأمم من كل لسان. سلطانه سلطان أبدي لا يفنى، وملكه لا ينقرض."]]}, {"l": "Mat 4:8", "n": "", "vs": [[8, "ثم أخذه إبليس أيضا إلى قمة جبل عال جدا، وأراه جميع ممالك العالم وعظمتها،"]]}, {"l": "Mat 6:13", "n": "", "vs": [[13, "ولا تدخلنا في تجربة، لكن نجنا من الشرير، لأن لك الملك والقوة والمجد إلى الأبد. آمين."]]}, {"l": "Rom 9:23", "n": "", "vs": [[23, "وذلك بقصد أن يعلن غنى مجده في أوعية الرحمة التي سبق فأعدها للمجد،"]]}, {"l": "Eph 1:18", "n": "", "vs": [[18, "إذ تستنير بصائر قلوبكم، فتعلموا ما في دعوته لكم من رجاء، وما هو غنى مجد ميراثه في القديسين،"]]}, {"l": "Col 1:27", "n": "", "vs": [[27, "الذين أراد الله أن يعلن لهم كم هو غني مجد هذا السر بين الأمم: إنه المسيح فيكم، وهو رجاء المجد؛"]]}, {"l": "Rev 4:11", "n": "", "vs": [[11, "«مستحق أنت ياربنا وإلهنا المجد والإجلال والقدرة، لأنك خلقت الأشياء كلها، وهي بإرادتك كائنة وقد خلقت!»"]]}], "kwAr": "غنى ملكه", "noteAr": ""}, {"kw": "excellent", "raw": "1Ch_29:11, 1Ch_29:12, 1Ch_29:25; Job_40:10; Psa_21:5, Psa_45:3, Psa_93:1; Dan_4:36, Dan_5:18; 2Pe_1:16, 2Pe_1:17", "note": "", "refs": [{"l": "1Ch 29:11", "n": "", "vs": [[11, "لك يارب العظمة والسطوة والجلال والبهاء والمجد، لأن لك كل ما في السماء والأرض. أنت يارب صاحب الملك وقد تعاليت فوق رؤوس الجميع."]]}, {"l": "1Ch 29:12", "n": "", "vs": [[12, "أنت مصدر كل غنى وكرامة، وأنت المتسلط على الجميع، والمالك للقوة والسطوة، وأنت القادر على تعظيم الجميع وتقوية عزيمتهم."]]}, {"l": "1Ch 29:25", "n": "", "vs": [[25, "وعظم الرب من شأن سليمان في أعين الإسرائيليين جميعا، وأضفى عليه مهابة ملكية لم يحظ بها ملك قبله في إسرائيل."]]}, {"l": "Job 40:10", "n": "", "vs": [[10, "إذا تسربل بالجلال والعظمة، وتزين بالمجد والبهاء."]]}, {"l": "Psa 21:5", "n": "", "vs": [[5, "عظيم مجده بفضل خلاصك، بالعزة والبهاء كللته."]]}, {"l": "Psa 45:3", "n": "", "vs": [[3, "في جلالك وبهائك تقلد سيفك على فخذك أيها المقتدر،"]]}, {"l": "Psa 93:1", "n": "", "vs": [[1, "الرب قد ملك مرتديا الجلال. متنطقا بحزام القوة. الأرض تثبتت فلن تتزعزع."]]}, {"l": "Dan 4:36", "n": "", "vs": [[36, "في ذلك الحين ثاب إلي عقلي، وعاد إلي جلال مملكتي ومجدي وبهائي، وطلبني مشيري ونبلاء دولتي، وتثبت على عرش مملكتي وازدادت عظمتي جدا."]]}, {"l": "Dan 5:18", "n": "", "vs": [[18, "أيها الملك قد وهب الله العلي أباك نبوخذناصر ملكا وعظمة وجلالا وبهاء."]]}, {"l": "2Pe 1:16", "n": "", "vs": [[16, "فنحن، عندما أخبرناكم بقدرة ربنا يسوع المسيح، وبعودته المجيدة، لم نكن ننقل عن أساطير مختلقة بمهارة. وإنما، تكلمنا باعتبارنا شهود عيان لعظمة المسيح."]]}, {"l": "2Pe 1:17", "n": "", "vs": [[17, "فإنه قد نال من الله الآب كرامة ومجدا، إذ جاءه من المجد الفائق صوت يقول: «هذا هو ابني الحبيب الذي به سررت كل سرور!»"]]}], "kwAr": "جلال عظمته", "noteAr": ""}], "arS": [["وظلت الولائم قائمة ", []], ["طوال", ["H7227"]], [" ", []], ["مئة", ["H3967"]], [" ", []], ["وثمانين", ["H8084"]], [" ", []], ["يوما", ["H3117"]], ["، ", []], ["أظهر", ["H7200"]], [" فيها ", []], ["الملك", ["H4438"]], [" كل ", []], ["بذخ", ["H3519"]], [" من ", []], ["غنى", ["H6239"]], [" ملكه ", []], ["وعزة", ["H3366"]], [" ", []], ["جلال", ["H8597"]], [" ", []], ["عظمته", ["H1420"]], [".", []]]}, {"c": 1, "v": 5, "text": "وبعد أن انقضت هذه الأيام، صنع الملك وليمة لجميع الشعب المقيم في شوشن العاصمة، كبارهم وصغارهم، استمرت سبعة أيام في دار حديقة القصر.", "groups": [{"kw": "present", "raw": "Heb. found", "note": "Heb. found", "refs": [], "kwAr": "المقيم", "noteAr": "بالعبرانية: وجد"}, {"kw": "seven days", "raw": "2Ch_7:8, 2Ch_7:9, 2Ch_30:21-25", "note": "", "refs": [{"l": "2Ch 7:8", "n": "", "vs": [[8, "واحتفل سليمان بالعيد في ذلك الوقت طوال سبعة أيام مع كل إسرائيل، وجمهور كبير توافد من مدخل حماة إلى وادي مصر."]]}, {"l": "2Ch 7:9", "n": "", "vs": [[9, "واعتكفوا في اليوم الثامن للعبادة بعد أن احتفلوا بتدشين المذبح سبعة أيام، وبالعيد سبعة أيام أخرى."]]}, {"l": "2Ch 30:21-25", "n": "", "vs": [[21, "واحتفل بنو إسرائيل الحاضرون في أورشليم بفرح عظيم بعيد الفطير سبعة أيام، سبح فيها اللاويون والكهنة، يوما فيوما، بآلات حمد للرب."], [22, "وعزى حزقيا بكلمات التشجيع قلوب اللاويين الذين أبدوا فطنة في خدمة الرب. وظلوا يأكلون نصيبهم سبعة أيام، ويقربون ذبائح سلام حامدين الرب إله آبائهم."], [23, "ثم اتفقوا على الاستمرار بالاحتفال سبعة أيام أخرى قضوها بفرح عظيم،"], [24, "لأن حزقيا تبرع للجماعة بألف ثور وسبعة آلاف من الضأن، كما تبرع رؤساء الشعب بألف ثور وعشرة آلاف من الضأن، وتطهر ع لإنسان يسعى في تخطيط طريقه، والرب يوجه خطواته."]]}, {"l": "Pro 23:29-33", "n": "", "vs": [[29, "لمن المعاناة؟ لمن الويل والشقاء والمخاصمات والشكوى؟ لمن الجر اح بلا سبب؟ ولمن احمرار العينين؟"], [30, "إنها للمدمنين الخمر، الساعين وراء المسكر الممزوج."], [31, "لا تنظر إلى الخمر إذا التهبت بالاحمرار، وتألقت في الكأس، وسالت سائغة،"], [32, "فإنها في آخرها تلسع كالحية وتلدغ كالأفعوان."], [33, "فتشاهد عيناك أمورا غريبة، وقلبك يحدثك بأشياء ملتوية،"]]}, {"l": "Mar 6:21", "n": "", "vs": [[21, "ثم سنحت الفرصة عندما أقام هيرودس بمناسبة ذكرى مولده وليمة لعظمائه وقادة الألوف وأعيان منطقة الجليل."]]}, {"l": "Mar 6:22", "n": "", "vs": [[22, "فقد دخلت ابنة هيروديا ورقصت، فسرت هيرودس والمتكئين معه. فقال الملك للصبية: «اطلبي مني ما تريدين، فأعطيك إياه!»"]]}], "kwAr": "وشتي", "noteAr": ""}, {"kw": "fair to look on", "raw": "Heb. good of countenance, 1Sa_25:3; 2Sa_14:25; Pro_31:30", "note": "Heb. good of countenance, 1Sa_25:3; 2Sa_14:25; Pro_31:30", "refs": [{"l": "1Sa 25:3", "n": "", "vs": [[3, "وكان اسم الرجل نابال، واسم امرأته أبيجايل. وكانت المرأة فاتنة الجمال راجحة العقل، أما الرجل فكان قاسيا سييء الأعمال، وهو ينتمي إلى عشيرة كالب."]]}, {"l": "2Sa 14:25", "n": "", "vs": [[25, "ولم يكن في كل إسرائيل رجل وسيم المحيا، يحظى بالإعجاب كأبشالوم الذي خلا من كل عيب من قمة الرأس إلى أخمص القدم."]]}, {"l": "Pro 31:30", "n": "", "vs": [[30, "الحسن غش والجمال باطل، أما المرأة المتقية الرب فهي التي تمدح."]]}], "kwAr": "رائعة الفتنة", "noteAr": "بالعبرانية: حسنة المنظر. انظر 1صم 25: 3؛ 2صم 14: 25؛ أم 31: 30"}], "arS": [["أن", ["H3588"]], [" ", []], ["يأتوا", ["H935"]], [" ", []], ["بالملكة", ["H4436"]], [" ", []], ["وشتي", ["H2060"]], [" لتمثل في ", []], ["حضرته", ["H6440"]], ["، وعلى رأسها ", []], ["تاج", ["H3804"]], [" ", []], ["الملك", ["H4428"]], ["، ", []], ["ليرى", ["H7200"]], [" الحاضرون من ", []], ["الشعب", ["H5971"]], [" ", []], ["والعظماء", ["H8269"]], [" ", []], ["جمالها", ["H3308"]], ["، ", []], ["لأنها", ["H1931"]], [" كانت ", []], ["رائعة", ["H2896"]], [" ", []], ["الفتنة", ["H4758"]], [".", []]]}, {"c": 1, "v": 12, "text": "فأبت الملكة أن تطيع أمر الملك الذي نقله إليها الخصيان. فاستشاط الملك غيظا واشتعل غضبه في داخله.", "groups": [{"kw": "the queen", "raw": "This refusal of Vashtis, to expose herself to the view of such a group of drunken Bacchanalians, was highly praiseworthy, and became the dignity of her rank and the modesty of her sex.", "note": "This refusal of Vashtis, to expose herself to the view of such a group of drunken Bacchanalians, was highly praiseworthy, and became the dignity of her rank and the modesty of her sex.", "refs": [], "kwAr": "الملكة", "noteAr": "كان رفض وشتي أن تعرض نفسها أمام جماعة من السكارى العابثين عملا جديرا بالثناء، يليق بمقامها وبحشمة جنسها"}, {"kw": "refused", "raw": "Gen_3:16; Eph_5:22, Eph_5:24; 1Pe_3:1", "note": "", "refs": [{"l": "Gen 3:16", "n": "", "vs": [[16, "ثم قال للمرأة: «أكثر تكثيرا أوجاع مخاضك فتنجبين بالآلام أولادا، وإلى زوجك يكون اشتياقك وهو يتسلط عليك»."]]}, {"l": "Eph 5:22", "n": "", "vs": [[22, "أيتها الزوجات، اخضعن لأزواجكن، كما للرب."]]}, {"l": "Eph 5:24", "n": "", "vs": [[24, "فكما أن الكنيسة قد أخضعت للمسيح، فكذلك الزوجات أيضا لأزواجهن، في كل شيء."]]}, {"l": "1Pe 3:1", "n": "", "vs": [[1, "كذلك، أيتها الزوجات، اخضعن لأزواجكن. حتى وإن كان الزوج غير مؤمن بالكلمة، تجذبه زوجته إلى الإيمان، بتصرفها اللائق دون كلام،"]]}], "kwAr": "فأبت", "noteAr": ""}, {"kw": "by his chamberlains", "raw": "Heb. which was by the hand of his eunuchs", "note": "Heb. which was by the hand of his eunuchs", "refs": [], "kwAr": "الخصيان", "noteAr": "بالعبرانية: التي كانت بيد خصيانه"}, {"kw": "was the king", "raw": "Pro_19:12, Pro_20:2; Dan_2:12, Dan_3:13, Dan_3:19; Nah_1:6; Rev_6:16, Rev_6:17", "note": "", "refs": [{"l": "Pro 19:12", "n": "", "vs": [[12, "حنق الملك كزمجرة الأسد، ورضاه كالطل على العشب."]]}, {"l": "Pro 20:2", "n": "", "vs": [[2, "سخط الملك مثل زمجرة الأسد، ومن يثير غيظه يسيء إلى نفسه."]]}, {"l": "Dan 2:12", "n": "", "vs": [[12, "عند ذلك استشاط الملك غضبا وحنقا وأمر بإبادة كل حكماء بابل."]]}, {"l": "D t upon extraordinary occasions. These servants were probably officers who here waited the kings call; and it is likely that Mordecai was one of them. Est_2:19, Est_2:21", "refs": [{"l": "Est 2:19", "n": "", "vs": [[19, "وعندما جمعت العذارى للمرة الثانية. كان مردخاي في ذلك الوقت قد صار حاجب الملك."]]}, {"l": "Est 2:21", "n": "", "vs": [[21, "وذات يوم تآمر بغثان وترش خصيا الملك وحاجباه لاغتياله لأنهما غضبا منه. وكان مردخاي آنئذ جالسا عند باب الملك،"]]}], "kwAr": "رجال الملك الواقفين", "noteAr": "يقول الدكتور شو متحدثا عن مدن الشرق: إذا تركنا الشوارع ودخلنا أحد البيوت الكبيرة، مررنا أولا برواق أو مدخل على جانبيه مقاعد، يستقبل فيه رب الأسرة زواره وينجز أعماله؛ وقلما يسمح لأحد، حتى أقرب الأقرباء، بالتوغل أكثر إلا في مناسبات استثنائية. وعلى الأرجح كان هؤلاء الخدام موظفين ينتظرون استدعاء الملك، ويحتمل أن مردخاي كان منهم. انظر أس 2: 19، 21"}, {"kw": "bowed", "raw": "Gen_41:43; Phi_2:10", "note": "", "refs": [{"l": "Gen 41:43", "n": "", "vs": [[43, "وأركبه في مركبته الثانية، ونادوا: «اركعوا أمامه». وأقامه واليا على كل أرض مصر."]]}, {"l": "Phi 2:10", "n": "", "vs": [[10, "لكي تنحني سجودا لاسم يسوع كل ركبة، سواء في السماء أم على الأرض أم تحت الأرض،"]]}], "kwAr": "ينحنون", "noteAr": ""}, {"kw": "bowed not", "raw": "Yichra welo yishtachaweh, bowed not down, nor prostrated himself, or worshipped him. Had this meant only civil reverence the king would not have needed to command it; nor would Mordecai have refused it; there was, therefore, some kind of divine honour intended, such as was paid to the Persian kings, and which even the Greeks refused, as express adoration. Est_3:1, Est_3:5; Exo_17:14, Exo_17:16; Deu_25:19; 1Sa_15:3; Psa_15:4", "note": "Yichra welo yishtachaweh, bowed not down, nor prostrated himself, or worshipped him. Had this meant only civil reverence the king would not have needed to command it; nor would Mordecai have refused it; there was, therefore, some kind of divine honour intended, such as was paid to the Persian kings, and which even the Greeks refused, as express adoration. Est_3:1, Est_3:5; Exo_17:14, Exo_17:16; Deu_25:19; 1Sa_15:3; Psa_15:4", "refs": [{"l": "Est 3:1", "n": "", "vs": [[1, "وبعد ذلك رفع الملك أحشويروش من مقام هامان بن همداثا الأجاجي وعظمه، وجعل مرتبته فوق مراتب جميع رؤسائه الآخرين،"]]}, {"l": "Est 3:5", "n": "", "vs": [[5, "وعندما تثبت هامان من أن مردخاي لا ينحني ولا يسجد له استشاط غضبا،"]]}, {"l": "Exo 17:14", "n": "", "vs": [[14, "فقال الرب لموسى: «دون هذا في الكتاب للتذكار، واتله على يشوع، لأنني سأمحو ذكر العمالقة من تحت السماء»."]]}, {"l": "Exo 17:16", "n": "", "vs": [[16, "قائلا: «لأن يدا ارتفعت ضد عرش الرب، فإن الرب سيحارب العمالقة جيلا بعد جيل»."]]}, {"l": "Deu 25:19", "n": "", "vs": [[19, "فمتى أراحكم الرب إلهكم من جميع أعدائكم المحيطين بكم في الأرض التي يهبها لكم ميراثا، امحوا ذكر شعب عماليق من تحت السماء. لا تنسوا هذا."]]}, {"l": "1Sa 15:3", "n": "", "vs": [[3, "فاذهب الآن وهاجم عماليق واقض على كل ماله. لا تعف عن أحد منهم بل اقتلهم جميعا رجالا ونساء، وأطفالا ورضعا، بقرا وغنما، جمالا وحميرا»."]]}, {"l": "Psa 15:4", "n": "", "vs": [[4, "يحتقر الأراذل ويكرم خائفي الرب. لا ينقض حلفه ولو فيه أذى له."]]}], "kwAr": "أبى أن ينحني", "noteAr": "«يخرع ولو يشتحوه» أي لم ينحن ولم يسجد له ولم يعبده. ولو كان المقصود مجرد توقير مدني لما احتاج الملك إلى أن يأمر به، ولما رفضه مردخاي؛ فلا بد أن المقصود كان تكريما إلهيا من النوع الذي كان يقدم لملوك الفرس، والذي رفضه اليونان نفسهم لأنه عبادة صريحة. انظر أس 3: 1، 5؛ خر 17: 14، 16؛ تث 25: 19؛ 1صم 15: 3؛ مز 15: 4"}], "arS": [["فصار ", []], ["جميع", ["H3605"]], [" ", []], ["رجال", ["H5650"]], [" ", []], ["الملك", ["H4428"]], [" الواقفين عند ", []], ["باب", ["H8179"]], [" ", []], ["الملك", ["H4428"]], [" ", []], ["ينحنون", ["H7812", "H3766"]], [" ", []], ["ويسجدون", ["H7812"]], [" ", []], ["لهامان", ["H2001"]], [" بموجب ", []], ["أمر", ["H6680"]], [" ", []], ["الملك", ["H4428"]], [". ", []], ["أما", ["H3808"]], [" ", []], ["مردخاي", ["H4782"]], [" ", []], ["فأبى", ["H3808"]], [" ", []], ["أن", ["H3588"]], [" ", []], ["ينحني", ["H3766"]], [" أمامه ويسجد له.", []]]}, {"c": 3, "v": 3, "text": "فسأل رجال الملك الواقفون بباب مردخاي: «لماذا تتمرد على أمر الملك؟»", "groups": [{"kw": "Why", "raw": "Est_3:2; Exo_1:17; Mat_15:2, Mat_15:3", "note": "", "refs": [{"l": "Est 3:2", "n": "", "vs": [[2, "فصار جميع رجال الملك الواقفين عند باب الملك ينحنون ويسجدون لهامان بموجب أمر الملك. أما مردخاي فأبى أن ينحني أمامه ويسجد له."]]}, {"l": "Exo 1:17", "n": "", "vs": [[17, "غير أن القابلتين كانتا تخافان الله فلم تنفذا أمر الملك فاستحيتا الأطفال الذكور."]]}, {"l": "Mat 15:2", "n": "", "vs": [[2, "«لماذا يخالف تلاميذك تقاليد الشيوخ، فلا يغسلون أيديهم قبل أن يأكلوا؟»"]]}, {"l": "Mat 15:3", "n": "", "vs": [[3, "فأجابهم «ولماذا تخالفون أنتم وصية الله من أجل المحافظة على تقاليدكم؟"]]}], "kwAr": "لماذا", "noteAr": ""}], "arS": [["فسأل", ["H559"]], [" ", []], ["رجال", ["H5650"]], [" ", []], ["الملك", ["H4428"]], [" الواقفون ", []], ["بباب", ["H8179"]], [" ", []], ["مردخاي", ["H4782"]], [": «", []], ["لماذا", ["H4069"]], [" ", []], ["تتمرد", ["H5674"]], [" على ", []], ["أمر", ["H4687"]], [" ", []], ["الملك", ["H4428"]], ["؟»", []]]}, {"c": 3, "v": 4, "text": "ولكنه أصر على رفضه بالرغم من إلحاحهم اليومي عليه، فأخبروا هامان بأمره ليروا إن كان تصرف مردخاي يمكن تبريره، لأنه قال لهم إنه يهودي.", "groups": [{"kw": "when they spake", "raw": "Gen_39:10", "note": "", "refs": [{"l": "Gen 39:10", "n": "", "vs": [[10, "ولم يذعن يوسف لها مع أنها كانت تلح عليه يوما بعد آخر."]]}], "kwAr": "إلحاحهم", "noteAr": ""}, {"kw": "that they told", "raw": "Dan_3:8, Dan_3:9, Dan_6:13", "note": "", "refs": [{"l": "Dan 3:8", "n": "", "vs": [[8, "غير أن بعضا من رجال الكلدانيين تقدموا إلى الملك نبوخذناصر واشتكوا على اليهود"]]}, {"l": "Dan 3:9", "n": "", "vs": [[9, "قائلين: «لتعش أيها الملك إلى الأبد."]]}, {"l": "Dan 6:13", "n": "", "vs": [[13, "حينئذ قالوا للملك: «إن دانيآل أحد مسبيي يهوذا قد استهان بك، ولم يأخذ الأمر الذي وقعته بعين الاعتبار، بل ها هو يرفع طلباته لإلهه ثلاث مرات في اليوم»."]]}], "kwAr": "أخبروا هامان", "noteAr": ""}, {"kw": "he had told", "raw": "Ezr_1:3; Dan_3:12, Dan_3:16-18, Dan_3:23-30, Dan_6:20-28; Jon_1:9", "note": "", "refs": [{"l": "Ezr 1:3", "n": "", "vs": [[3, "فعلى كل واحد من أبناء شعبه ليكن الرب معه أن يصعد إلى أورشليم في أرض يهوذا فيبني هيكل الرب إله إسرائيل. إنه الله الذي في أورشليم."]]}, {"l": "Dan 3:12", "n": "", "vs": [[12, "وها هنا رجال يهود ممن وليتهم على أعمال إقليم بابل، هم شدرخ وميشخ وعبدنغو لم يأبهوا لك، ولم يعبدوا آلهتك، ولم يسجدوا لتمثال الذهب الذي نصبته»."]]}, {"l": "Dan 3:16-18", "n": "", "vs": [[16, "فأجابه شدرخ وميشخ وعبدنغو: «لا داعي لأن نجيبك عن هذا الشأن"], [17, "لأن إلهنا الذي نعبده قادر أن ينجينا من أتون النار المتقدة، وأن ينقذنا من يدك أيها الملك."], [18, "وحتى إن لم ينقذنا، فاعلم يقينا أيها الملك أننا لا نعبد آلهتك، ولا نسجد لتمثال الذهب الذي نصبته»."]]}, {"l": "Dan 3:23-30", "n": "", "vs": [[23, "فسقط هؤلاء الرجال الثلاثة موثقين وسط أتون النار المتقدة."], [24, "وما لبثت الحيرة أن اعترت نبوخذناصر، فهب مسرعا وقال لمشيريه: «ألم نطرح ثلاثة رجال موثقين في وسط النار؟» فأجابوا: «صحيح أيها الملك»."], [25, "فقال: «إني أرى أربعة رجال طليقين يتمشون في وسط النار، لم ينلهم أذى، ومنظر الرابع شبيه بابن الآلهة»."], [26, "ثم دنا نبوخذناصر من باب الأتون المتقد بالنار وهتف: «ياشدرخ وميشخ وعبدنغو ياعبيد الله العلي، اخرجوا وتعالوا». فخرج شدرخ وميشخ وعبدنغو من وسط النار."], [27, "فأحاط الأقطاب والولاة والحكام وعظماء الدولة بهم، فوجدوا أن النار لم تؤذ أجسامهم، ولم تحترق شعرة من رؤوسهم، ولم تشط ثيابهم، ولم تعلق بهم رائحة النار."], [28, "فقال نبوخذناصر: «تبارك إله شدرخ وميشخ وعبدنغو الذي أرسل ملاكه وأنقذ عبيده الذين اتكلوا عليه وخالفوا أمر الملك وبذلوا أجسادهم كيلا يعبدوا أو يسجدوا لإله غير إلههم."], [29, "لهذا قد صدر مني أمر أن أي شعب أو أمة أو قوم من أي لسان يذمون إله شدرخ وميشخ وعبدنغو، يمزقون إربا إربا، وتصبح بيوتهم أنقاضا، إذ ليس هناك إله آخر يقدر أن ينجي مثله»."], [30, "ثم رفع الملك من شأن شدرخ وميشخ وعبدنغو في ولاية بابل."]]}, {"l": "Dan 6:20-28", "n": "", "vs": [[20, "فلما دنا منه نادى دانيآل بصوت حزين قائلا: «يادانيآل، عبد الله الحي، هل إلهك الذي تعبده دائما استطاع أن ينجيك من الأسود؟»"], [21, "فأجاب دانيآل: «لتعش أيها الملك إلى الأبد."], [22, "قد أرسل إلهي ملاكه فسد أفواه الأسود فلم تؤذني، لأني وجدت بريئا أمامه، ولم أرتكب سوءا أمامك أيضا أيها الملك»."], [23, "حينئذ فرح الملك جدا وأمر أن يخرج دانيآل من الجب، فأصعدوه ولم يكن قد ناله أي أذى، لأنه آمن بإلهه."], [24, "ثم أصدر الملك أمره فأحضروا المتآمرين الذين اتهموا دانيآل وطرحوهم في جب الأسود، مع أولادهم ونسائهم. وما كادوا يصلون إلى أسفل الجب حتى بطشت بهم الأسود وهشمت عظامهم."], [25, "ثم بعث الملك داريوس إلى كل الشعوب والأمم من كل لسان من الساكنين في مملكته برسائل قائلا: «ليكثر سلامكم."], [26, "قد صدر مني أمر أن يرتعد كل من يقيم في تخوم مملكتي ويخاف أمام إله دانيآل، لأنه هو الإله الحي القيوم إلى الأبد، لا يزول له ملكوت وسلطانه إلى المنتهى."], [27, "هو ينجي وينقذ ويجري الآيات والعجائب في السماوات والأرض، وهو الذي خلص دانيآل من أنياب الأسود»."], [28, "وحالف النجاح دانيآل في ملك داريوس وفي عهد حكم كورش الفارسي."]]}, {"l": "Jon 1:9", "n": "", "vs": [[9, "فأجابهم: «أنا عبراني، وأنا خائف من الرب إله السماوات، صانع البحر والبر»."]]}], "kwAr": "قال لهم", "noteAr": ""}], "arS": [["ولكنه أصر ", []], ["على", ["H413"]], [" رفضه بالرغم ", []], ["من", ["H834"]], [" إلحاحهم ", []], ["اليومي", ["H3117"]], [" ", []], ["عليه", ["H413"]], ["، ", []], ["فأخبروا", ["H5046"]], [" ", []], ["هامان", ["H2001"]], [" ", []], ["بأمره", ["H559", "H1697"]], [" ", []], ["ليروا", ["H7200"]], [" ", []], ["إن", ["H3588"]], [" ", []], ["كان", ["H1961"]], [" تصرف ", []], ["مردخاي", ["H4782"]], [" يمكن ", []], ["تبريره", ["H5975"]], ["، ", []], ["لأنه", ["H1931"]], [" قال لهم إنه ", []], ["يهودي", ["H3064"]], [".", []]]}, {"c": 3, "v": 5, "text": "وعندما تثبت هامان من أن مردخاي لا ينحني ولا يسجد له استشاط غضبا،", "groups": [{"kw": "that Mordecai", "raw": "Est_3:2, Est_5:9", "note": "", "refs": [{"l": "Est 3:2", "n": "", "vs": [[2, "فصار جميع رجال الملك الواقفين عند باب الملك ينحنون ويسجدون لهامان بموجب أمر الملك. أما مردخاي فأبى أن ينحني أمامه ويسجد له."]]}, {"l": "Est 5:9", "n": "", "vs": [[9, "فخرج هامان في ذلك اليوم من لدنها بقلب يفيض فرحا وانشراحا، ولك نقبلها أو نعمل بها!»"]]}, {"l": "Act 17:6", "n": "", "vs": [[6, "ولما لم يجدوهما هناك جروا ياسون وبعض الإخوة واقتادوهم إلى حكام المدينة، واشتكوا عليهم صارخين: «إن هذين الرجلين اللذين قلبا الدنيا ، قد جاءا إلى مدينتنا أيضا،"]]}, {"l": "Act 17:7", "n": "", "vs": [[7, "فاستضافهما ياسون. وهم جميعا يخالفون أوامر القيصر، وينادون بملك آخر اسمه يسوع»."]]}, {"l": "Act 24:5", "n": "", "vs": [[5, "وجدنا هذا المتهم مخربا، يثير الفتنة بين جميع اليهود في البلاد كلها، وهو يتزعم مذهب النصارى."]]}, {"l": "Act 28:22", "n": "", "vs": [[22, "ولكننا نرى من المناسب أن نسمع رأيك، لأننا نعلم أن الناس في كل مكان يعارضون هذا المذهب!»"]]}], "kwAr": "شرائعهم", "noteAr": ""}, {"kw": "for the kings profit to", "raw": "Heb. meet, or equal for the king to, etc", "note": "Heb. meet, or equal for the king to, etc", "refs": [], "kwAr": "فلا يجدر بالملك", "noteAr": "بالعبرانية: لا يليق أو لا يساوي للملك، إلخ"}], "arS": [["فقال", ["H559"]], [" ", []], ["هامان", ["H2001"]], [" ", []], ["للملك", ["H4428"]], [" ", []], ["أحشويروش", ["H325"]], [": «", []], ["هناك", ["H3426"]], [" ", []], ["شعب", ["H5971", "H259"]], [" ما ", []], ["متشتت", ["H6340", "H6504"]], [" ومتفرق ", []], ["بين", ["H996"]], [" ", []], ["الشعوب", ["H5971"]], [" في ", []], ["كل", ["H3605"]], [" ", []], ["أرجاء", ["H4082"]], [" ", []], ["مملكتك", ["H4438"]], ["، ", []], ["تغاير", ["H8138"]], [" ", []], ["شرائعهم", ["H1881"]], [" شرائع ", []], ["جميع", ["H3605"]], [" ", []], ["الأمم", ["H5971"]], ["، وهم ", []], ["لا", ["H369"]], [" ", []], ["ينفذون", ["H6213"]], [" سنن ", []], ["الملك", ["H4428"]], [". ", []], ["فلا", ["H369"]], [" ", []], ["يجدر", ["H7737"]], [" ", []], ["بالملك", ["H4428"]], [" ", []], ["إغفال", ["H5117"]], [" أمرهم.", []]]}, {"c": 3, "v": 9, "text": "فإن طاب للملك، فليصدر أمرا بإبادتهم، وأنا أدفع عشرة آلاف وزنة من الفضة (نحو ثلاث مئة ألف كيلوجرام) للخزينة الملكية لتغطية نفقات ذلك».", "groups": [{"kw": "that they may be destroyed", "raw": "Heb. to destroy them", "note": "Heb. to destroy them", "refs": [], "kwAr": "بإبادتهم", "noteAr": "بالعبرانية: لإهلاكهم"}, {"kw": "and I will pay", "raw": "Heb. and I will weigh, Gen_23:16; Here Haman is obliged to acknowledge that there would be a loss to the revenue, which he was willing to make up out of his own property. Ten thousand talents of silver, counted by the Babylonish talent, amount to 2,119,000£.; but reckoned by the Jewish talent, they amount to double that sum. In those days, silver and gold were more plentiful than at present; and we have many instances of individuals possessing almost incredible riches. Herodotus relates, that when Xerxes went into Greece, Pythius the Lydian had 2,000 talents of silver, and 4,000,000 of gold darics, which unitedly amount to nearly 5,500,000£. Plutarch tells us, that after Crassus had dedicated the tenth of all he had to Hercules, he entertained the Roman people at 10,000 tables, and distributed to every citizen as much corn as was sufficient for three months; and, after all these expenses, he had 7,100; Roman talents left, which amount to more than 1,500,000£. Lentulus the augur is said to have possessed no less than 3,333,333£. 6s. 8d. Apicius was worth more than 916,671£ 13s. 4d.; and, after having spent in his kitchen 833,333£ 6s. 8d. he considered the remainder too little for his support, and poisoned himself!", "note": "Heb. and I will weigh, Gen_23:16; Here Haman is obliged to acknowledge that there would be a loss to the revenue, which he was willing to make up out of his own property. Ten thousand talents of silver, counted by the Babylonish talent, amount to 2,119,000£.; but reckoned by the Jewish talent, they amount to double that sum. In those days, silver and gold were more plentiful than at present; and we have many instances of individuals possessing almost incredible riches. Herodotus relates, that when Xerxes went into Greece, Pythius the Lydian had 2,000 talents of silver, and 4,000,000 of gold darics, which unitedly amount to nearly 5,500,000£. Plutarch tells us, that after Crassus had dedicated the tenth of all he had to Hercules, he entertained the Roman people at 10,000 tables, and distributed to every citizen as much corn as was sufficient for three months; and, after all these expenses, he had 7,100; Roman talents left, which amount to more than 1,500,000£. Lentulus the augur is said to have possessed no less than 3,333,333£. 6s. 8d. Apicius was worth more than 916,671£ 13s. 4d.; and, after having spent in his kitchen 833,333£ 6s. 8d. he considered the remainder too little for his support, and poisoned himself!", "refs": [{"l": "Gen 23:16", "n": "", "vs": [[16, "فقبل إبراهيم عرض عفرون، ووزن له الفضة التي ذكرها في مسامع الحثيين. أربع مئة شاقل رائجة بين التجار."]]}], "kwAr": "وأنا أدفع", "noteAr": "بالعبرانية: وأنا أزن. انظر تك 23: 16. يضطر هامان هنا إلى الاعتراف بأن في الأمر خسارة للخزينة، وكان مستعدا لتعويضها من ماله. وعشرة آلاف وزنة من الفضة بحساب الوزنة البابلية تبلغ نحو 2,119,000 جنيه، وبحساب الوزنة اليهودية ضعف هذا المبلغ. وكانت الفضة والذهب في تلك الأيام أوفر مما هي اليوم، وهناك أمثلة كثيرة لأفراد امتلكوا ثروات لا تصدق. يروي هيرودوت أن بيثيوس اللودي كان عنده، حين ذهب أحشويروش إلى اليونان، ألفا وزنة من الفضة وأربعة ملايين دارك ذهبي، يبلغ مجموعها نحو 5,500,000 جنيه. ويقول بلوتارخ إن كراسوس، بعد أن نذر عشر ماله لهرقل، أولم للشعب الروماني على عشرة آلاف مائدة ووزع على كل مواطن قمحا يكفيه ثلاثة أشهر، ومع ذلك بقي له 7,100 وزنة رومانية تزيد على 1,500,000 جنيه. ويقال إن لنتلوس العراف امتلك ما لا يقل عن 3,333,333 جنيها، وكانت ثروة أبيكيوس تزيد على 916,671 جنيها؛ وبعد أن أنفق في مطبخه 833,333 جنيها رأى الباقي قليلا لا يكفي لمعيشته فسمم نفسه!"}, {"kw": "ten thousand", "raw": "Mat_18:24", "note": "", "refs": [{"l": "Mat 18:24", "n": "", "vs": [[24, "فلما شرع يحاسبهم، أحضر إليه واحد مديون بعشرة آلاف وزنة."]]}], "kwAr": "عشرة آلاف", "noteAr": ""}], "arS": [["فإن", ["H518"]], [" ", []], ["طاب", ["H2895"]], [" ", []], ["للملك", ["H4428"]], ["، فليصدر أمرا ", []], ["بإبادتهم", ["H6"]], ["، وأنا ", []], ["أدفع", ["H8254"]], [" ", []], ["عشرة", [ حتى اليوم «في جبل الرب الإله يرى»."]]}, {"l": "Num 23:22-24", "n": "", "vs": [[22, "الله أخرجهم من مصر، وقوتهم مثل قوة الثور الوحشي."], [23, "فلا عيافة تضر يعقوب، ولا عرافة تؤثر في إسرائيل. منذ الآن يقال عن يعقوب وعن إسرائيل: «انظر ماذا فعل الله!»"], [24, "هوذا شعب يتحفز كلبوة وينهض كأسد. لا ينام حتى يلتهم فريسة ويلغ في دم قتلى»."]]}, {"l": "Deu 32:26", "n": "", "vs": [[26, "قلت: أشتتهم في زوايا الأرض، وأمحو من بين الناس ذكرهم."]]}, {"l": "Deu 32:27", "n": "", "vs": [[27, "لولا خوفي من تبجح العدو، إذ يظنون قائلين: إن يدنا قد عظمت، وليس ما جرى هو من فعل الرب."]]}, {"l": "Deu 32:36", "n": "", "vs": [[36, "لأن الرب يدين شعبه ويرأف بعبيده. عندما يرى أن قوتهم قد اضمحلت ولم يبق عبد ولا حر،"]]}, {"l": "1Sa 12:22", "n": "", "vs": [[22, "فالرب لا يتخلى عن شعبه إكراما لاسمه العظيم، لأنه شاء أن يجعلكم له شعبا."]]}, {"l": "Isa 54:17", "n": "", "vs": [[17, "لا يحالف التوفيق أي سلاح صنع لمهاجمتك، وكل لسان يتهمك أمام القضاء تفحمينه، لأن هذا هو ميراث عبيد الرب، وبرهم الذي أنعمت به عليهم»، يقول الرب."]]}, {"l": "Jer 30:11", "n": "", "vs": [[11, "لأني معك لأخلصك، يقول الرب، فأبيد جميع الأمم التي شتتك بينها. أما أنت فلن أفنيك بل أؤدبك بالحق ولا أبرئك تبرئة كاملة»."]]}, {"l": "Jer 33:24-26", "n": "", "vs": [[24, "«ألم تسمع ما قاله ذلك الشعب: قد نبذ الرب العشيرتين اللتين اختارهما؟ كذلك احتقروا شعبي وكأنهم لم يعودوا أمة."], [25, "وهذا ما يعلنه الرب: إن كنت لم أعقد ميثاقا مع النهار والليل، ولم أسن أحكاما للسماوات والأرض،"], [26, "فإني أرفض ذرية يعقوب وداود عبدي، فلا أصطفي من ذريته من يحكم على نسل إبراهيم وإسحق ويعقوب. ولكني سأرد سبيهم وأرحمهم»."]]}, {"l": "Jer 46:28", "n": "", "vs": [[28, "لا تخافوا ياذرية عبدي يعقوب، يقول الرب، لأني معكم وأفني جميع الأمم التي شتتكم إليها. أما أنتم فلا أفنيكم بل أؤدبكم بالحق، إنما لا أبرئكم جميعا»."]]}, {"l": "Amo 9:8", "n": "", "vs": [[8, "ها إن عيني الرب مسلطتان على المملكة الخاطئة لأمحوها عن وجه الأرض، إلا أني لن أستأصل بيت يعقوب قاطبة يقول الرب."]]}, {"l": "Amo 9:9", "n": "", "vs": [[9, "أغربل بيت إسرائيل بين جميع الأمم كما تغربل الحنطة في غربال، فلا تسقط حبة على الأرض."]]}, {"l": "Mat 16:18", "n": "", "vs": [[18, "وأنا أيضا أقول لك: أنت صخر. وعلى هذه الصخرة أبني كنيستي وأبواب الجحيم لن تقوى عليها!"]]}, {"l": "Mat 24:22", "n": "", "vs": [[22, "ولولا أن تلك الأيام ستختصر، لما كان أحد من البشر ينجو. ولكن من أجل المختارين ستختصر تلك الأيام."]]}], "kwAr": "فتفنون", "noteAr": ""}, {"kw": "enlargement", "raw": "Heb. respiration, Ezr_9:9; Job_9:18", "note": "Heb. respiration, Ezr_9:9; Job_9:18", "refs": [{"l": "Ezr 9:9", "n": "", "vs": [[9, "ومع أننا عبيد لم تتخل عنا في عبوديتنا، بل ظللتنا بالرحمة أمام ملوك فارس ومنحتنا حياة لنبني هيكلا ونرمم خرائبه ونتمتع بالحماية في يهوذا وفي أورشليم."]]}, {"l": "Job 9:18", "n": "", "vs": [[18, "لا يدعني ألتقط أنفاسي بل يشبعني مرائر."]]}], "kwAr": "الفرج", "noteAr": "بالعبرانية: تنفس. انظر عز 9: 9؛ أي 9: 18"}, {"kw": "but thou", "raw": "Est_2:7, Est_2:15; Jdg_14:15-18, Jdg_15:6", "note": "", "refs": [{"l": "Est 2:7", "n": "", "vs": [[7, "هذا أشرف على تربية ابنة عمه أستير المدعوة هدسة، لأنها كانت يتيمة الأبوين. وكانت الفتاة رائعة الجمال، جميلة الطلعة تبناها مردخاي عند وفاة والديها."]]}, {"l": "Est 2:15", "n": "", "vs": [[15, "ولما جاء دور أستير ابنة أبيحائل عم مردخاي الذي تبناها للمثول في حضرة الملك، لم تطلب شيئا إلا ما أشار به عليها هيجاي خصي الملك وحارس الحريم. وكانت أستير تحظى بإعجاب كل من رآها."]]}, {"l": "Jdg 14:15-18", "n": "", "vs": [[15, "وفي اليوم الرابع قالوا لزوجة شمشون: «تملقي زوجك ليكشف لنا عن حل الأحجية، لئلا نضرم النار فيك وفي بيت أبيك. أدعوتمونا إلى الوليمة لتسلبونا؟»"], [16, "فبكت امرأة شمشون لديه قائلة: «أنت تمقتني ولا تحبني حقا. فقد طرحت على بني قومي أحجية ولم تطلعني على حلها». فقال لها: «هوذا أبي وأمي لم أطلعهما على حلها، فلماذا أخبرك أنت به؟»"], [17, "فظلت تبكي لديه طوال سبعة أيام الوليمة. وفي اليوم السابع أطلعها على الحل لفرط ما ضايقته، فأسرت به لبني قومها."], [18, "وقبل غروب شمس اليوم السابع قال له رجال المدينة: «أي شيء أحلى من العسل، وما هو أقوى من الأسد؟» فقال لهم شمشون: «لولا أنكم حرثتم على عجلتي لما وجدتم حل أحجيتي»."]]}, {"l": "Jdg 15:6", "n": "", "vs": [[6, "فسأل الفلسطينيون: «من الجاني؟» فقيل لهم: «شمشون صهر التمني، لأنه أخذ امرأة شمشون وزوجها لنديمه»، فصعد الفلسطينيون وأحرقوها مع أبيها بالنار."]]}], "kwAr": "وأما أنت", "noteAr": ""}, {"kw": "whether", "raw": "Gen_45:4-8; Isa_45:1-5, Isa_49:23; Act_7:20-25", "note": "", "refs": [{"l": "Gen 45:4-8", "n": "", "vs": [[4, "فقال يوسف لإخوته: «ادنوا مني». فاقتربوا منه، فقال: «أنا يوسف أخوكم الذي بعتموه إلى مصر."], [5, "فلا تتأسفوا الآن، ولا يصعب عليكم أنكم بعتموني إلى هنا، لأن الله أرسلني أمامكم حفاظا على حياتكم."], [6, "فقد صار للمجاعة في هذه الأرض سنتان، وبقيت خمس سنوات لن يكون فيها فلاحة ولا حصاد."], [7, "وقد أرسلني الله أمامكم ليجعل لكم بقية في الأرض وينقذ حياتكم بخلاص عظيم."], [8, "فلستم إذا أنتم الذين أرسلتموني إلى هنا بل الله ، الذي جعلني مستشارا لفرعون وسيدا لكل بيته، ومتسلطا على جميع أرض مصر."]]}, {"l": "Isa 45:1-5", "n": "", "vs": [[1, "هذا ما يقوله الرب لكورش مختاره، الذي أخذت بيمينه حتى أخضع أمامه أمما وأكسر شوكة ملوك، لأفتح أمامه كوات ولا توصد في وجهه مصاريع."], [2, "ها أنا أتقدمك لأسوي الجبال بالأرض وأحطم أبواب النحاس، وأكسر مغاليق الحديد،"], [3, "وأهبك كنوز الأقبية المظلمة وذخائر المخابيء، لتعرف أني أنا هو الرب إله إسرائيل الذي دعاك باسمك."], [4, "لأجل عبدي يعقوب، وإسرائيل مختاري دعوتك باسمك، لقبتك من غير أن تعرفني."], [5, "أنا هو الرب ولا إله غيري. ليس هناك آخر، شددتك مع أنك لم تعرفني."]]}, {"l": "Isa 49:23", "n": "", "vs": [[23, "يكون لك الملوك آباء مربين، وملكاتهم مرضعات، ينحنون أمامك بوجوه مطرقة إلى الأرض، ويلحسون تراب قدميك. عندئذ تدركين أنني أنا الرب، وكل من يتكل علي لا يخزى»."]]}, {"l": "Act 7:20-25", "n": "", "vs": [[20, "في تلك الفترة ولد موسى. وكان جميلا جدا، فرباه والداه في بيتهما ثلاثة أشهر،"], [21, "ولكنهما اضطرا أخيرا إلى التخلي عنه، فأنقذته ابنة فرعون وتبنته وربته."], [22, "فتثقف موسى بعلوم مصر كلها، حتى صار مقتدرا في القول والعمل."], [23, "ولما بلغ الأربعين من العمر خطر بقلبه أن يتفقد أحوال إخوته من بني إسرائيل،"], [24, "فرأى واحدا منهم يعتدي عليه مصري، فتدخل ليدافع عن المظلوم، وانتقم له فقتل المصري،"], [25, "على أمل أن يدرك إخوته أن الله سينقذهم على يده. غير أنهم لم يدركوا!"]]}], "kwAr": "ومن يدري", "noteAr": ""}, {"kw": "for such a time", "raw": "1Sa_17:29; 2Ki_19:3; Neh_6:11; The fact related in this verse was unquestionably the reason why Esther was raised to regal honours, by the overruling providence of God. she was therefore bound in gratitude to do this service for God, else she would not have answered the end of her elevation, and she need not fear the miscarriage of the enterprise, for if God designed her for it, he would surely bear her through and give success. It appeared by the event that Mordecai spoke prophetically, when he modestly conjectured that Esther came to the kingdom that she might be the instrument of the Jews deliverance. Mordecai thoroughly believed that it was a cause which one way or other would certainly be carried, and which, therefore, she might safely venture upon. Instruments might fail, but Gods covenant cannot. There is a wise design in all the providences of God, which is unknown to us till it is accomplished; but it will prove in the issue that all is intended for and centre in the good of those who trust in Him.", "note": "1Sa_17:29; 2Ki_19:3; Neh_6:11; The fact related in this verse was unquestionably the reason why Esther was raised to regal honours, by the overruling providence of God. she was therefore bound in gratitude to do this service for God, else she would not have answered the end of her elevation, and she need not fear the miscarriage of the enterprise, for if God designed her for it, he would surely bear her through and give success. It appeared by the event that Mordecai spoke prophetically, when he modestly conjectured that Esther came to the kingdom that she might be the instrument of the Jews deliverance. Mordecai thoroughly believed that it was a cause which one way or other would certainly be carried, and which, therefore, she might safely venture upon. Instruments might fail, but Gods covenant cannot. There is a wise design in all the providences of God, which is unknown to us till it is accomplished; but it will prove in the issue that all is intended for and centre in the good of those who trust in Him.", "refs": [{"l": "1Sa 17:29", "n": "", "vs": [[29, "فأجاب داود: «أية جناية ارتكبت الآن؟ ألا يحق لي حتى أن أوجه سؤالا؟»"]]}, {"l": "2Ki 19:3", "n": "", "vs": [[3, "فقالوا له: «هذا ما يقوله حزقيا: هذا اليوم هو يوم ضيق وإهانة وكرب، فإننا كالأجنة المشرفة على الولادة من غير أن تتوافر لها القوة على ذلك."]]}, {"l": "Neh 6:11", "n": "", "vs": [[11, "فأجبته: «أرجل مثلي يهرب؟ أمثلي من يعتصم بالهيكل كي ينجو؟ لا أدخل!»"]]}], "kwAr": "لوقت مثل هذا", "noteAr": "انظر 1صم 17: 29؛ 2مل 19: 3؛ نح 6: 11. لا ريب أن الواقعة المذكورة في هذه الآية هي سبب رفع أستير إلى المجد الملكي بعناية الله الغالبة، فهي مدينة بالشكر لله أن تؤدي هذه الخدمة، وإلا لم تحقق غاية ارتفاعها، ولا داعي لأن تخشى فشل المهمة، لأن الله إن قصدها لها فسيحملها ويمنحها النجاح. وقد ظهر بالنتيجة أن مردخاي تكلم نبويا حين ظن بتواضع أن أستير بلغت الملك لتكون أداة خلاص اليهود. وكان على يقين بأن هذه قضية لا بد أن تنتصر بطريقة أو بأخرى. فقد تخيب الأدوات لكن عهد الله لا يخيب. وفي كل عنايات الله قصد حكيم لا نعرفه حتى يتم، ثم يتضح أن الكل مقصود لخير المتوكلين عليه"}], "arS": [["لأنك", ["H3588"]], [" ", []], ["إن", ["H518"]], [" ", []], ["لزمت", ["H2790"]], [" ", []], ["الصمت", ["H2790"]], [" في ", []], ["مثل", ["H5975"]], [" ", []], ["هذا", ["H2063"]], [" ", []], ["الوقت", ["H6256"]], ["، ", []], ["فإن", ["H518"]], [" ", []], ["الفرج", ["H7305"]], [" ", []], ["والنجاة", ["H2020"]], [" لابد أن ", []], ["يأتيا", ["H5060"]], [" ", []], ["لليهود", ["H3064"]], [" ", []], ["من", ["H4480"]], [" ", []], ["مصدر", ["H4725"]], [" ", []], ["آخر", ["H312"]], ["، وأما ", []], ["أنت", ["H859"]], [" ", []], ["وبيت", ["H1004"]], [" ", []], ["أبيك", ["H1"]], [" ", []], ["فتفنون", ["H6"]], [". ", []], ["ومن", ["H4310"]], [" ", []], ["يدري", ["H3045"]], ["، فلربما قد وصلت إلى عرش ", []], ["الملك", ["H4438"]], [" لوقت مثل ", []], ["هذا", ["H2063"]], ["!»", []]]}, {"c": 4, "v": 15, "text":  "فآمن شعب نينوى بالرب، وأعلنوا الصيام وارتدوا المسوح من كبيرهم إلى صغيرهم ."], [6, "ثم بلغ إنذار النبي ملك نينوى، فقام عن عرشه وخلع عنه حلته، وارتدى المسح وجلس على الرماد."], [7, "وأذاع في كل نينوى مرسوما ورد فيه: «بأمر من الملك ونبلائه، يمتنع الناس عن الأكل والشرب، وكذلك البهائم والغنم والبقر، لا ترع ولا تشرب ماء."], [8, "وعلى جميع الناس والبهائم أن يرتدوا المسوح، متضرعين إلى الله تائبين عن طرقهم الشريرة وعما ارتكبوه من ظلم."], [9, "لعل الرب يرجع فيعدل عن احتدام سخطه فلا نهلك»."]]}], "kwAr": "صوموا", "noteAr": ""}, {"kw": "eat nor drink", "raw": "Est_5:1; Mat_12:40; Act_9:9, Act_27:33", "note": "", "refs": [{"l": "Est 5:1", "n": "", "vs": [[1, "وفي اليوم الثالث ارتدت أستير ثيابا ملكية، ووقفت في القاعة الداخلية أمام البهو الملكي، الذي يجلس فيه الملك على عرشه."]]}, {"l": "Mat 12:40", "n": "", "vs": [[40, "فكما بقي يونان في جوف الحوت ثلاثة أيام وثلاث ليال، هكذا سيبقى ابن الإنسان في جوف الأرض ثلاثة أيام وثلاث ليال."]]}, {"l": "Act 9:9", "n": "", "vs": [[9, "حيث بقي ثلاثة أيام لا يبصر ولا يأكل ولا يشرب."]]}, {"l": "Act 27:33", "n": "", "vs": [[33, "ولما اقترب طلوع الصباح، طلب بولس إلى الجميع أن يأكلوا، وقال: «مرت أربعة عشر يوما وأنتم لا تأكلون شيئا،"]]}], "kwAr": "ولا تأكلوا ولا تشربوا", "noteAr": ""}, {"kw": "I also", "raw": "Gen_18:19; Jos_24:15; Act_10:7", "note": "", "refs": [{"l": "Gen 18:19", "n": "", "vs": [[19, "لأنني قد اخترته ليوصي بنيه وأهل بيته من بعده كي يحفظوا طريق الرب، عاملين البر والعدل، حتى ينجز الرب ما وعد به إبراهيم»."]]}, {"l": "Jos 24:15", "n": "", "vs": [[15, "وإن ساءكم أن تعبدوا الرب، فاختاروا لأنفسكم اليوم من تعبدون سواء من الآلهة التي عبدها آباؤكم الذين استوطنوا شرقي نهر الفرات أم آلهة الأموريين الذين أنتم مقيمون في أرضهم. أما أنا وبيتي فنعبد الرب»."]]}, {"l": "Act 10:7", "n": "", "vs": [[7, "فما إن ذهب الملاك الذي كان يكلم كرنيليوس، حتى دعا اثنين من خدمه، وجنديا تقيا من مرافقيه الدائمين،"]]}], "kwAr": "أنا ووصيفاتي", "noteAr": ""}, {"kw": "if I perish", "raw": "If I lose my life in the attempt to save my people, I shall lose it cheerfully. I see it is my duty to make the attempt; and, come what will, I am resolved to do it. Gen_43:14; 1Sa_19:5; 2Sa_10:12; Luk_9:24; Act_20:24, Act_21:13; Rom_16:4; Phi_2:30", "note": "If I lose my life in the attempt to save my people, I shall lose it cheerfully. I see it is my duty to make the attempt; and, come what will, I am resolved to do it. Gen_43:14; 1Sa_19:5; 2Sa_10:12; Luk_9:24; Act_20:24, Act_21:13; Rom_16:4; Phi_2:30", "refs": [{"l": "Gen 43:14", "n": "", "vs": [[14, "ولينعم عليكم الله القدير بالرحمة لدى الرجل، فيطلق لكم أخاكم الآخر وبنيامين أيضا. وأنا إن ثكلتهما، أكون قد ثكلتهما»."]]}, {"l": "1Sa 19:5", "n": "", "vs": [[5, "لقد عرض حياته للخطر عندما قتل الفلسطيني، فأجرى الرب خلاصا عظيما لجميع إسرائيل. وقد شهدت ذلك وابتهجت به. فلماذا تقتل داود من غير داع وتسيء إلى دم بريء؟»"]]}, {"l": "2Sa 10:12", "n": "", "vs": [[12, "لتتشجع ولتتقو من أجل شعبنا ومن أجل مدن إلهنا، والرب يجري ما يشاء»."]]}, {"l": "Luk 9:24", "n": "", "vs": [[24, "فأي من أراد أن يخلص نفسه، يخسرها؛ ولكن من يخسر نفسه من أجلي، فهو يخلصها."]]}, {"l": "Act 20:24", "n": "", "vs": [[24, "ولكني لا أحسب لحياتي أية قيمة، ما دمت أسعى إلى بلوغ غايتي وإتمام الخدمة التي كلفني إياها الرب يسوع: أن أشهد ببشارة نعمة الله."]]}, {"l": "Act 21:13", "n": "", "vs": [[13, "ولكنه قال لنا: «ما لكم تبكون وتحطمون قلبي؟ إني مستعد ليس فقط لأن أقيد في أورشليم، بل أيضا لأن أموت من أجل اسم الرب يسوع!»"]]}, {"l": "Rom 16:4", "n": "", "vs": [[4, "اللذين عرضا عنقيهما للذبح إنقاذا لحياتي، ولست أنا وحدي شاكرا لهما بل جميع كنائس الأمم أيضا."]]}, {"l": "Phi 2:30", "n": "", "vs": [[30, "فإنه من أجل عمل المسيح أشرف على الموت، مخاطرا بحياته ليسد ما نقص من خدمتكم لي."]]}], "kwAr": "هلكت", "noteAr": "إن فقدت حياتي في محاولة إنقاذ شعبي فسأفقدها بفرح. أرى أن واجبي أن أحاول، ومهما يكن الأمر فقد عزمت على ذلك. انظر تك 43: 14؛ 1صم 19: 5؛ 2صم 10: 12؛ لو 9: 24؛ أع 20: 24؛ 21: 13؛ رو 16: 4؛ في 2: 30"}], "arS": [["«", []], ["امض", ["H1980"]], [" ", []], ["اجمع", ["H935", "H3664"]], [" ", []], ["كل", ["H3605"]], [" ", []], ["اليهود", ["H3064"]], [" " بوا أبناء هامان العشرة على خشبة»."]]}, {"l": "Job 27:14", "n": "", "vs": [[14, "إن تكاثر بنوه فليكونوا طعاما للسيف، ونسله لا يشبع خبزا."]]}, {"l": "Job 27:15", "n": "", "vs": [[15, "ذريته تموت بالوبأ، وأراملهم لا تنوح عليهم."]]}, {"l": "Hos 9:13", "n": "", "vs": [[13, "مصير أبناء أفرايم، كما أرى، هو الوقوع في قبضة الصياد، لأن أفرايم، يقتاد أبناءه للذبح."]]}, {"l": "Hos 9:14", "n": "", "vs": [[14, "أعطهم يارب: ولكن ماذا تعطيهم؟ أعطهم نساء ذوات أرحام مسقطة، وأثداء جافة."]]}], "kwAr": "من بنين", "noteAr": ""}, {"kw": "and how he had", "raw": "Est_3:1", "note": "", "refs": [{"l": "Est 3:1", "n": "", "vs": [[1, "وبعد ذلك رفع الملك أحشويروش من مقام هامان بن همداثا الأجاجي وعظمه، وجعل مرتبته فوق مراتب جميع رؤسائه الآخرين،"]]}], "kwAr": "وكل ما أنعم", "noteAr": ""}], "arS": [["وراح ", []], ["يعدد", ["H5608"]], [" أمامهم ", []], ["ما", ["H834"]], [" يملك ", []], ["من", ["H5921"]], [" ", []], ["ثروات", ["H6239"]], [" ", []], ["ومن", ["H834"]], [" ", []], ["بنين", ["H1121", "H7230"]], ["، ", []], ["وكل", ["H3605"]], [" ما ", []], ["أنعم", ["H5375"]], [" عليه ", []], ["الملك", ["H4428"]], [" به من ", []], ["عظمة", ["H1431"]], [" ", []], ["وجاه", ["H3519"]], ["، حتى صارت مرتبته فوق مرتبة جميع ", []], ["رؤساء", ["H8269"]], [" ", []], ["الملك", ["H4428"]], [" ", []], ["ورجاله", ["H5650"]], ["!", []]]}, {"c": 5, "v": 12, "text": "وأضاف: «حتى أستير الملكة لم تدع مع الملك إلى المأدبة التي أقامتها سواي، وأنا مدعو غدا مع الملك لحضور مأدبة ثانية.", "groups": [{"kw": "Esther", "raw": "Plutarch, in his life of Artaxerxes, informs us, that none but the kings mother, and his real wife, were permitted to sit at his table; and therefore he mentions it as a condescension in that prince, that he sometimes invited his brothers. Haman, therefore, had some reason to be proud of this favour.", "note": "Plutarch, in his life of Artaxerxes, informs us, that none but the kings mother, and his real wife, were permitted to sit at his table; and therefore he mentions it as a condescension in that prince, that he sometimes invited his brothers. Haman, therefore, had some reason to be proud of this favour.", "refs": [], "kwAr": "أستير", "noteAr": "يخبرنا بلوتارخ في سيرة أرتحشستا أنه لم يسمح لأحد بالجلوس إلى مائدة الملك إلا أمه وزوجته الشرعية؛ ولذا يذكر أنه من تنازل ذلك الأمير أن دعا إخوته أحيانا. فكان لهامان إذن بعض الحق في أن يفخر بهذه الحظوة"}, {"kw": "to morrow", "raw": "Job_8:12, Job_8:13, Job_20:5-8; Psa_37:35, Psa_37:36; Pro_7:22, Pro_7:23, Pro_27:1; Luk_21:34, Luk_21:35; 1Th_5:3", "note": "", "refs": [{"l": "Job 8:12", "n": "", "vs": [[12, "إنها تيبس قبل سائر العشب، وهي في نضارتها لم تقطع."]]}, {"l": "Job 8:13", "n": "", "vs": [[13, "هكذا يكون مصير كل من ينسى الله ، وهكذا يخيب رجاء الفاجر."]]}, {"l": "Job 20:5-8", "n": "", "vs": [[5, "أن طرب الشرير إلى حين، وأن فرح الفاجر إلى لحظة؟"], [6, "مهما بلغت كبرياؤه السماوات ومست هامته الغمام،"], [7, "فإنه سيبيد كبرازه، فيتساءل الذين يعرفونه، مندهشين: أين هو؟"], [8, "يتلاشى كحلم ولا يبقى منه أثر، ويضمحل كرؤيا الليل،"]]}, {"l": "Psa 37:35", "n": "", "vs": [[35, "قد رأيت الشرير مزدهرا وارفا كالشجرة الخضراء المتأصلة في تربة موطنها،"]]}, {"l": "Psa 37:36", "n": "", "vs": [[36, "ثم عبر ومضى، لم يوجد. فتشت عنه فلم أعثر له على أثر."]]}, {"l": "Pro 7:22", "n": "", "vs": [[22, "فمضى على التو في إثرها، كثور مسوق إلى الذبح، أو أيل وقع في فخ."]]}, {"l": "Pro 7:23", "n": "", "vs": [[23, "إلى أن ينفذ سهم في كبده، ويكون كعصفور مندفع إلى شرك، لا يدري أنه قد نصب للقضاء عليه."]]}, {"l": "Pro 27:1", "n": "", "vs": [[1, "لا تتباه بالغد لأنك لا تدري ماذا يلد اليوم."]]}, {"l": "Luk 21:34", "n": "", "vs": [[34, "ولكن احذروا لأنفسكم لئلا تتثقل قلوبكم بالانغماس في اللذات وبالسكر وهموم الحياة، فيدهمكم ذلك اليوم فجأة؛"]]}, {"l": "Luk 21:35", "n": "", "vs": [[35, "فإنه سوف يطبق كالفخ على جميع الساكنين على وجه الأرض كلها."]]}, {"l": "1Th 5:3", "n": "", "vs": [[3, "فبينما الناس يقولون: حل السلام والأمن! ينزل بهم الهلاك المفاجيء كالمخاض الذي يدهم الحبلى، فلا يستطيعون أبدا أن يفلتوا."]]}], "kwAr": "غدا", "noteAr": ""}], "arS": [["وأضاف", ["H559"]], [": «", []], ["حتى", ["H1571"]], [" ", []], ["أستير", ["H635"]], [" ", []], ["الملكة", ["H4436"]], [" ", []], ["لم", ["H3808"]], [" ", []], ["تدع", ["H7121"]], [" ", []], ["مع", ["H5973"]], [" ", []], ["الملك", ["H4428"]], [" ", []], ["إلى", ["H413"]], [" المأدبة ", []], ["التي", ["H834"]], [" ", []], ["أقامتها", ["H6213"]], [" سواي، ", []], ["وأنا", ["H589"]], [" ", []], ["مدعو", ["H935"]], [" ", []], ["غدا", ["H4279"]], [" ", []], ["مع", ["H5973"]], [" ", []], ["الملك", ["H4428"]], [" لحضور ", []], ["مأدبة", ["H4960"]], [" ثانية.", []]]}, {"c": 5, "v": 13, "text": "ولكن هذا كله لا قيمة له عندي حين أرى مردخاي اليهودي جالسا أمام باب الملك».", "groups": [{"kw": "Yet all this", "raw": "Pride will ever render its possessor unhappy. Haman, though possessed of immense riches, glory, and honour, and the prime favourite of his king, is wretched, because he could not have the homage of that man whom his heart even despised! Oh, how distressing are the inquietudes of pride and vanity. 1Ki_21:4-6; Job_15:20, Job_18:4; Ecc_1:2, Ecc_1:14; Phi_4:11, Phi_4:12", "note": "Pride will ever render its possessor unhappy. Haman, though possessed of immense riches, glory, and honour, and the prime favourite of his king, is wretched, because he could not have the homage of that man whom his heart even despised! Oh, how distressing are the inquietudes of pride and vanity. 1Ki_21:4-6; Job_15:20, Job_18:4; Ecc_1:2, Ecc_1:14; Phi_4:11, Phi_4:12", "refs": [{"l": "1Ki 21:4-6", "n": "", "vs": [[4, "فدخل أخآب قصره مكتئبا مهموما متأثرا من قول نابوت اليزرعيلي: «لا أفرط في ميراث آبائي». واستلقى فوق سريره مشيحا بوجهه نحو الحائط عازفا عن الطعام."], [5, "فأقبلت إليه زوجته إيزابل قائلة: «مالي أراك منقبضا عازفا عن الطعام؟»"], [6, "فأجابها: «لأني قلت لنابوت اليزرعيلي: بعني كرمك، وإذا شئت قايضتك بكرم آخر، فأجاب: لا أعطيك كرمي»"]]}, {"l": "Job 15:20", "n": "", "vs": [[20, "يتلوى الشرير ألما كل أيام حياته، ومعدودة هي سنو الجائر."]]}, {"l": "Job 18:4", "n": "", "vs": [[4, "يامن تمزق نفسك إربا غيظا، هل تهجر الأرض من أجلك أم تتزحزح الصخرة من موضعها؟"]]}, {"l": "Ecc 1:2", "n": "", "vs": [[2, "يقول الجامعة: باطل الأباطيل، باطل الأباطيل، كل شيء باطل."]]}, {"l": "Ecc 1:14", "n": "", "vs": [[14, "لقد شاهدت كل الأشياء التي تم صنعها تحت الشمس فإذا الجميع باطل كملاحقة الريح."]]}, {"l": "Phi 4:11", "n": "", "vs": [[11, "لست أعني أني كنت في حاجة، فأنا قد تعلمت أن أكون قنوعا في كل حال."]]}, {"l": "Phi 4:12", "n": "", "vs": [[12, "وأعرف كيف أعيش في العوز، وكيف أعيش في الوفرة. فإني، في كل شيء، وفي جميع الأحوال، متدرب على الشبع وعلى الجوع، وعلى العيش في الوفرة أو في العوز."]]}], "kwAr": "ولكن هذا كله", "noteAr": "الكبرياء تشقي صاحبها دائما. فهامان، مع ما حاز من الغنى والمجد والكرامة وكونه المفضل الأول عند ملكه، تعيس لأنه لم ينل إكرام ذلك الرجل الذي كان قلبه يحتقره! ما أشد قلق الكبرياء والغرور. انظر 1مل 21: 4-6؛ أي 15: 20؛ 18: 4؛ جا 1: 2، 14؛ في 4: 11، 12"}], "arS": [["ولكن ", []], ["هذا", ["H2088"]], [" ", []], ["كله", ["H3605"]], [" ", []], ["لا", ["H369"]], [" ", []], ["قيمة", ["H7737"]], [" له عندي ", []], ["حين", ["H6256"]], [" ", []], ["أرى", ["H7200"]], [" ", []], ["مردخاي", ["H4782"]], [" ", []], ["اليهودي", ["H3064"]], [" ", []], ["جالسا", ["H3427", "H589"]], [" أمام ", []], ["باب", ["H8179"]], [" ", []], ["الملك", ["H4428"]], ["».", []]]}, {"c": 5, "v": 14, "text": "عندئذ قالت له زوجته زرش وسائر المقربين إليه: «ليجهزوا خشبة ارتفاعها خمسون ذراعا (خمسة وعشرون مترا)، واطلب من الملك في الصباح أن يأمر بصلب مردخاي عليها، ثم اذهب مع الملك إلى المأدبة سعيدا». فاستصوب هامان الرأي، وأمر بتجهيز الخشبة!", "groups": [{"kw": "said Zeresh", "raw": "2Sa_13:3-5; 1Ki_21:7, 1Ki_21:25; 2Ch_22:3, 2Ch_22:4; Mar_6:19-24", "note": "", "refs": [{"l": "2Sa 13:3-5", "n": "", "vs": [[3, "وكان لأمنون صديق راجح العقل، هو ابن عمه، يوناداب بن شمعى،"], [4, "فسأله: «مالي أراك سقيما ياابن الملك يوما بعد يوم؟ ألا تخبرني؟» فأجابه أمنون: «إني أحب ثامار أخت أبشالوم أخي»."], [5, "فقال يوناداب: «تمارض في سريرك. وعندما يجيء أبوك ليزورك قل له: دع ثامار أختي تأتي لتطعمني. دعها تعد الطعام أمامي فأرى ما تفعل وآكل من يدها»."]]}, {"l": "1Ki 21:7", "n": "", "vs": [[7, "فقالت له إيزابل: «أهكذا تحكم كملك على إسرائيل؟ قم وتناول طعاما وطب نفسا، فأنا أحصل لك على كرم نابوت اليزرعيلي»."]]}, {"l": "1Ki 21:25", "n": "", "vs": [[25, "ولم يكن نظير أخآب الذي أغوته زوجته إيزابل، فباع نفسه لارتكاب الشر في عيني الرب."]]}, {"l": "2Ch 22:3", "n": "", "vs": [[3, "وقد سلك أيضا في طريق بيت أخآب، لأن أمه كانت تشير عليه بارتكاب الشر."]]}, {"l": "2Ch 22:4", "n": "", "vs": [[4, "فاقترف الشر في عيني الرب على غرار بيت أخآب، إذ أصبحوا له مشيرين بعد وفاة أبيه، مما أفضى إلى هلاكه."]]}, {"l": "Mar 6:19-24", "n": "", "vs": [[19, "فكانت هيروديا ناقمة على يوحنا، وتتمنى أن تقتله، ولكنها لم تستطع."], [20, "فقد كان هيرودس يرهب يوحنا لعلمه أنه رجل بار وقديس، وكان يحافظ على سلامته. ومع أنه كان يتضايق كثيرا من كلامه، إلا أنه كان يحب الاستماع إليه."], [21, "ثم سنحت الفرصة عندما أقام هيرودس بمناسبة ذكرى مولده وليمة لعظمائه وقادة الألوف وأعيان منطقة الجليل."], [22, "فقد دخلت ابنة هيروديا ورقصت، فسرت هيرودس والمتكئين معه. فقال الملك للصبية: «اطلبي مني ما تريدين، فأعطيك إياه!»"], [23, "وأقسم لها قائلا: «لأعطينك مهما طلبت مني، ولو نصف مملكتي!»"], [24, "فخرجت وسألت أمها: «ماذا أطلب؟» فأجابت: «رأس يوحنا المعمدان!»"]]}], "kwAr": "قالت له زوجته زرش", "noteAr": ""}, {"kw": "Let a gallows", "raw": "Heb. Let a tree, Est_7:9", "note": "Heb. Let a tree, Est_7:9", "refs": [{"l": "Est 7:9", "n": "", "vs": [[9, "فقال حربونا أحد الخصيان الماثلين في حضرة الملك: «ها هي الخشبة التي أعدها هامان لصلب مردخاي، الذي أسدى للملك خيرا، منصوبة في بيت هامان، وارتفاعها خمسون ذراعا». فقال الملك: «اصلبوه عليها»."]]}], "kwAr": "خشبة", "noteAr": "بالعبرانية: شجرة. انظر أس 7: 9"}, {"kw": "speak thou", "raw": "Est_3:8-15, Est_6:4", "note": "", "refs": [{"l": "Est 3:8-15", "n": "", "vs": [[8, "فقال هامان للملك أحشويروش: «هناك شعب ما متشتت ومتفرق بين الشعوب في كل أرجاء مملكتك، تغاير شرائعهم شرائع جميع الأمم، وهم لا ينفذون سنن الملك. فلا يجدر بالملك إغفال أمرهم."], [9, "فإن طاب للملك، فليصدر أمرا بإبادتهم، وأنا أدفع عشرة آلاف وزنة من الفضة (نحو ثلاث مئة ألف كيلوجرام) للخزينة الملكية لتغطية نفقات ذلك»."], [10, "فنزع الملك خاتمه من أصبعه، وأعطاه لهامان بن همداثا الأجاجي عدو اليهود، إعرابا عن موافقته،"], [11, "وقال له: «لقد وهبتك الفضة والشعب أيضا، فافعل بهم ما يحلو لك»."], [12, "وفي اليوم الثالث عشر من الشهر الأول استدعي كتاب الملك وأمليت عليهم أوامر هامان إلى ولاة الملك وإلى حكام كل إقليم بإقليمه، وإلى رؤساء كل شعب بشعبه، حسب لغة كل إقليم ولهجة أهلها، ووقع تلك الرسائل باسم الملك أحشويروش وختمها بخاتمه."], [13, "وحمل السعاة الرسائل إلى جميع أقاليم المملكة، وفيها أمر بإبادة وقتل وإهلاك جميع اليهود، شبانا وشيوخا وأطفالا ونساء في يوم واحد، هو الثالث عشر من الشهر الثاني عشر، أي شهر أذار، والاستيلاء على غنائمهم."], [14, "وكان لابد من إذاعة نسخة من نص هذا المرسوم في كل إقليم لتصبح قانونا يعمل به، كي يتأهب الشعب استعدادا لذلك اليوم."], [15, "وهكذا انطلق السعاة مسرعين تلبية لأمر الملك، بعد أن صدر الأمر في شوشن العاصمة. وجلس الملك وهامان يتنادمان على الشراب. أما أهل شوشن فقد اعترتهم الحيرة!"]]}, {"l": "Est 6:4", "n": "", "vs": [[4, "فقال الملك: «من في ساحة القصر؟» وكان هامان قد دخل ساحة قصر الملك الخارجية ليطلب من الملك أن يأمر بصلب مردخاي على الخشبة التي أعدها له."]]}], "kwAr": "واطلب", "noteAr": ""}, {"kw": "go thou in", "raw": "Est_3:15; 1Ki_21:7; Amo_6:4-6; Rev_11:10", "note": "", "refs": [{"l": "Est 3:15", "n": "", "vs": [[15, "وهكذا انطلق السعاة مسرعين تلبية لأمر الملك، بعد أن صدر الأمر في شوشن العاصمة. وجلس الملك وهامان يتنادمان على الشراب. أما أهل شوشن فقد اعترتهم الحيرة!"]]}, {"l": "1Ki 21:7", "n": "", "vs": [[7, "فقالت له إيزابل: «أهكذا تحكم كملك على إسرائيل؟ قم وتناول طعاما وطب نفسا، فأنا أحصل لك على كرم نابوت اليزرعيلي»."]]}, {"l": "Amo 6:4-6", "n": "", "vs": [[4, "ويل للراقدين فوق أسرة من عاج، المسترخين فوق الأرائك، الآكلين لحم خيرة الحملان والعجول المختارة من وسط المعلف."], [5, "المغنين على صوت الرباب، المخترعين لأنفسهم آلات غناء كداود."], [6, "الشاربين خمرا في كؤوس، المتطيبين بأفضل العطور، ولا يكتئبون على خراب يوسف."]]}, {"l": "Rev 11:10", "n": "", "vs": [[10, "ويشمت بهما أهل الأرض، فيفرحون كأنهم في عيد، ويتبادلون الهدايا، لأن هذين النبيين كانا قد عذباهم كثيرا."]]}], "kwAr": "اذهب", "noteAr": ""}, {"kw": "the thing", "raw": "2Sa_16:21-23, 2Sa_17:1-4; Mar_14:10, Mar_14:11; Act_23:14, Act_23:15; Rom_1:32", "note": "", "refs": [{"l": "2Sa 16:21-23", "n": "", "vs": [[21, "فأجاب أخيتوفل: «ادخل وضاجع محظيات أبيك اللواتي تركهن للمحافظة على القصر، فيسمع جميع بني إسرائيل أنك قد صرت مكروها لدى أبيك، فتتشدد أيدي مناصريك»."], [22, "فنصبوا لأبشالوم الخيمة على السطح، ودخل لمضاجعة محظيات أبيه على مرأى جميع الإسرائيليين."], [23, "وكانت مشورات أخيتوفل التي يسديها في تلك الأيام تحظى بقبول داود وأبشالوم لأنها كانت في اعتبارهما كأنها صادرة عن فم الله."]]}, {"l": "2Sa 17:1-4", "n": "", "vs": [[1, "وقال أخيتوفل لأبشالوم: «دعني أختار اثني عشر ألف رجل لأقوم وأتعقب بهم داود هذه الليلة،"], [2, "فأهاجمه وهو متعب خائر القوى، فأثير الذعر بين رجاله، فينفضون من حوله، وأقتل الملك وحده."], [3, "وأرد جميع الشعب إليك، لأن موت الرجل الذي تطلبه معناه رجوع الجميع للالتفاف حولك، ولا ينال الأذى أي واحد من الناس»."], [4, "فاستحسن أبشالوم وقادة بني إسرائيل هذا الرأي."]]}, {"l": "Mar 14:10", "n": "", "vs": [[10, "ثم ذهب يهوذا الإسخريوطي، أحد الاثني عشر، إلى رؤساء الكهنة ليسلم يسوع إليهم."]]}, {"l": "Mar 14:11", "n": "", "vs": [[11, "فلما سمعوا بذلك، فرحوا، ووعدوه أن يعطوه مالا. فأخذ يتحين تسليمه في فرصة مناسبة."]]}, {"l": "Act 23:14", "n": "", "vs": [[14, "وذهبوا إلى رؤساء الكهنة والشيوخ وقالوا: «حرام علينا الطعام والشراب حتى نقتل بولس."]]}, {"l": "Act 23:15", "n": "", "vs": [[15, "فاطلبوا من القائد بصفتكم أعضاء المجلس، أن يحضر بولس بحجة إعادة النظر في قضيته، ونحن مستعدون لاغتياله قبل وصوله إلى المجلس!»"]]}, {"l": "Rom 1:32", "n": "", "vs": [[32, "إنهم يعلمون حكم الله العادل: أن الذين يفعلون هذه الأمور يستوجبون الموت؛ ومع ذلك، لا يمارسونها وحسب، بل يسرون بفاعليها."]]}], "kwAr": "الرأي", "noteAr": ""}, {"kw": "he caused", "raw": "Est_7:10; Psa_7:13-16, Psa_9:15, Psa_37:14, Psa_37:32; Pro_1:18, Pro_4:16; Rom_3:15", "note": "", "refs": [{"l": "Est 7:10", "n": "", "vs": [[10, "فصلبوا هامان على الخشبة التي أعدها لمردخاي. ثم هدأت س i_20:43, 1Ki_21:4; 2Ch_26:20; Job_20:5", "note": "", "refs": [{"l": "2Sa 17:23", "n": "", "vs": [[23, "وعندما رأى أخيتوفل أن مشورته لم يعمل بها، ركب حماره وتوجه إلى بيته في مسقط رأسه، ثم نظم شؤون عائلته، وخنق نفسه فمات، ودفن في قبر أبيه."]]}, {"l": "1Ki 20:43", "n": "", "vs": [[43, "فانصرف ملك إسرائيل إلى قصره في السامرة مكتئبا مغموما."]]}, {"l": "1Ki 21:4", "n": "", "vs": [[4, "فدخل أخآب قصره مكتئبا مهموما متأثرا من قول نابوت اليزرعيلي: «لا أفرط في ميراث آبائي». واستلقى فوق سريره مشيحا بوجهه نحو الحائط عازفا عن الطعام."]]}, {"l": "2Ch 26:20", "n": "", "vs": [[20, "فتفرس به رئيس الكهنة عزريا وسائر الكهنة وإذا بهم يشاهدون أمارات البرص في جبهته فطردوه من الهيكل، بل إنه هو نفسه بادر إلى الخروج لأن الرب ابتلاه بالبرص."]]}, {"l": "Job 20:5", "n": "", "vs": [[5, "أن طرب الشرير إلى حين، وأن فرح الفاجر إلى لحظة؟"]]}], "kwAr": "فأسرع إلى بيته", "noteAr": ""}, {"kw": "having", "raw": "Est_7:8; 2Sa_15:30; Job_9:24; Jer_14:3, Jer_14:4", "note": "", "refs": [{"l": "Est 7:8", "n": "", "vs": [[8, "وعندما رجع الملك من حديقة القصر إلى قاعة المأدبة، وجد هامان منطرحا على الأريكة التي كانت أستير تجلس عليها. فقال الملك: «أيتحرش أيضا بالملكة وهي معي، وفي القصر؟» وما إن نطق الملك بهذه العبارة حتى غطوا وجه هامان."]]}, {"l": "2Sa 15:30", "n": "", "vs": [[30, "أما داود فاستمر يرتقي جبل الزيتون باكيا مغطى الرأس حافي القدمين. وغطى جميع الشعب الذي معه رؤوسهم وارتقوا مسالك الجبل باكين."]]}, {"l": "Job 9:24", "n": "", "vs": [[24, "فقد عهد بالأرض إلى يد الشرير، وأعمى عيون قضاتها. إن لم يكن هو الفاعل، إذا من هو؟"]]}, {"l": "Jer 14:3", "n": "", "vs": [[3, "أرسل أشرافهم خدامهم ليحملوا إليهم الماء، فأقبلوا إلى الجباب وإذا بها فارغة من الماء، فرجعوا بجرار خاوية وقد اعتراهم الخزي والخجل وغطوا رؤوسهم."]]}, {"l": "Jer 14:4", "n": "", "vs": [[4, "خزي الفلاحون وغطوا رؤوسهم لأن الأرض قد تشققت لانقطاع المطر عنها."]]}], "kwAr": "أذيال الخزي", "noteAr": ""}], "arS": [["ثم", ["H7725"]], [" عاد ", []], ["مردخاي", ["H4782"]], [" ", []], ["إلى", ["H413"]], [" عمله. أما ", []], ["هامان", ["H2001"]], [" ", []], ["فأس  "vs": [[17, "فإن ما يعده من ثياب يرتديه الصديق، والبريء يوزع الفضة."]]}, {"l": "Psa 39:6", "n": "", "vs": [[6, "إنما كخيال يتمشى الإنسان، فعبثا يكافح الناس. يجمع الواحد منهم ثروة ولا يدري من يرثها من بعده."]]}, {"l": "Psa 49:6-13", "n": "", "vs": [[6, "أولئك المتكلون على ثروتهم، وبوفرة غناهم يفتخرون."], [7, "لا يقدر أحد أبدا أن يفتدي أخاه أو يقدم لله كفارة عنه."], [8, "لأن فدية النفوس باهظة يتعذر دفعها مدى الحياة"], [9, "طلبا للخلود على الأرض وتفاديا لرؤية القبر."], [10, "لكن الحكماء يموتون كما يموت الجاهل والغبي، تاركين ثروتهم لغيرهم."], [11, "يتوهمون أن بيوتهم خالدة، وأن مساكنهم باقية من جيل إلى جيل، فأطلقوا أسماءهم على أراضيهم (تخليدا لذكرهم)."], [12, "ولكن الإنسان لا يخلد في أبهته. إنه يماثل البهائم التي تباد."], [13, "هذا هو مصير الجهال الواثقين بأنفسهم، ومصير أعقابهم الذين يستحسنون أقوالهم."]]}, {"l": "Pro 13:22", "n": "", "vs": [[22, "ثروة الصالح تدوم حتى يرثها الأحفاد، أما ميراث الخاطيء فمدخر للصديق."]]}, {"l": "Pro 28:8", "n": "", "vs": [[8, "المكثر ماله بالربا والاستغلال، إنما يجمعه لمن هو رحيم بالفقراء."]]}, {"l": "Ecc 2:18", "n": "", "vs": [[18, "وكرهت كل ما سعيت من أجله تحت الشمس، لأني سأتركه لمن يخلفني."]]}, {"l": "Ecc 2:19", "n": "", "vs": [[19, "ومن يدري: أيكون حكيما أم جاهلا؟ ومع ذلك فإنه سيتولى كل عملي الذي بذلت فيه كل جهدي وحكمتي تحت الشمس. وهذا أيضا باطل."]]}, {"l": "Luk 12:20", "n": "", "vs": [[20, "ولكن الله قال له: ياغبي، هذه الليلة تطلب نفسك منك، فلمن يبقى ما أعددته؟"]]}], "kwAr": "وهب", "noteAr": ""}, {"kw": "came before", "raw": "Est_1:14, Est_2:7, Est_2:15", "note": "", "refs": [{"l": "Est 1:14", "n": "", "vs": [[14, "كرشنا وشيثار وأدماثا وترشيش ومرس ومرسنا ومموكان، وهم سبعة حكماء مقربون إليه من رؤساء مادي وفارس، ممن يمثلون دائما أمام الملك، ويحتلون المراتب الأولى في المملكة:"]]}, {"l": "Est 2:7", "n": "", "vs": [[7, "هذا أشرف على تربية ابنة عمه أستير المدعوة هدسة، لأنها كانت يتيمة الأبوين. وكانت الفتاة رائعة الجمال، جميلة الطلعة تبناها مردخاي عند وفاة والديها."]]}, {"l": "Est 2:15", "n": "", "vs": [[15, "ولما جاء دور أستير ابنة أبيحائل ع
