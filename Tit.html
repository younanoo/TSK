أكثر مما في الأخذ!»"]]}, {"l": "2Th 3:9", "n": "", "vs": [[9, "وذلك لا يعني أنه ليس لنا حق، بل لنجعل أنفسنا مثالا لكم لتقتدوا بنا."]]}, {"l": "1Ti 4:12", "n": "", "vs": [[12, "لا يستخف أحد بحداثة سنك. وإنما كن قدوة للمؤمنين، في الكلام والسلوك والمحبة والإيمان والطهارة."]]}, {"l": "1Pe 5:3", "n": "", "vs": [[3, "لا تتسلطوا على القطيع الذي وضعه الله أمانة بين أيديكم، بل كونوا قدوة له."]]}], "kwAr": "في كل شيء", "noteAr": ""}, {"kw": "uncorruptness", "raw": "2Co_2:17, 2Co_4:2", "note": "", "refs": [{"l": "2Co 2:17", "n": "", "vs": [[17, "فإننا لا نتاجر بكلمة الله كما يفعل الكثيرون، وإنما بإخلاص ومن قبل الله، وأمام الله، نتكلم في المسيح."]]}, {"l": "2Co 4:2", "n": "", "vs": [[2, "ولكننا قد رفضنا الأساليب الخفية المخجلة، إذ لا نسلك في المكر، ولا نزور كلمة الله، بل بإعلاننا للحق نمدح أنفسنا لدى ضمير كل إنسان، أمام الله."]]}], "kwAr": "النقاوة", "noteAr": ""}, {"kw": "gravity", "raw": "Tit_2:2", "note": "", "refs": [{"l": "Tit 2:2", "n": "", "vs": [[2, "أن يكون الشيوخ ذوي رزانة ووقار، متعقلين، صحيحي الإيمان والمحبة والصبر."]]}], "kwAr": "والوقار", "noteAr": ""}, {"kw": "sincerity", "raw": "2Co_1:12, 2Co_8:8; Eph_6:24; Phi_1:10", "note": "", "refs": [{"l": "2Co 1:12", "n": "", "vs": [[12, "فإن فخرنا هو هذا: شهادة ضميرنا بأننا، في قداسة الله وإخلاصه، قد سلكنا في العالم، وبخاصة تجاهكم؛ ولم يكن ذلك بحكمة بشرية بل بنعمة الله."]]}, {"l": "2Co 8:8", "n": "", "vs": [[8, "لا أقول هذا على سبيل الأمر، بل اختبارا لصدق محبتكم بحماسة الآخرين."]]}, {"l": "Eph 6:24", "n": "", "vs": [[24, "لتكن النعمة مع جميع الذين يحبون ربنا يسوع المسيح محبة لا يعتريها الفساد!"]]}, {"l": "Phi 1:10", "n": "", "vs": [[10, "لكي تستحسنوا الأمور الممتازة، حتى تكونوا طاهرين وخالين من العثرات إلى يوم المسيح،"]]}], "kwAr": "والكلمة الصحيحة", "noteAr": ""}], "arS": [["جاعلا", ["G3930"]], [" من ", []], ["نفسك", ["G4572"]], [" في ", []], ["كل شيء", ["G3956"]], [" ", []], ["قدوة", ["G5179"]], [" ", []], ["للأعمال", ["G2041"]], [" ", []], ["الصالحة", ["G2570"]], ["، مظهرا في ", []], ["تعليمك", ["G1319"]], [" ", []], ["النقاوة", ["G90"]], [" ", []], ["والوقار", ["G4587"]]]}, {"c": 2, "v": 8, "text": "والكلمة الصحيحة التي لا تلام، لكي يخجل المقاوم حين لا يجد أمرا سيئا يقوله فينا.", "groups": [{"kw": "Sound", "raw": "Mar_12:17, Mar_12:28, Mar_12:32, Mar_12:34; 1Ti_6:3", "note": "", "refs": [{"l": "Mar 12:17", "n": "", "vs": [[17, "فرد عليهم قائلا: «أعطوا ما للقيصر للقيصر، وما لله لله!» فذهلوا منه."]]}, {"l": "Mar 12:28", "n": "", "vs": [[28, "وتقدم إليه واحد من الكتبة كان قد سمعهم يتجادلون، ورأى أنه أحسن الرد عليهم، فسأله: «أية وصية هي أولى الوصايا جميعا؟»"]]}, {"l": "Mar 12:32", "n": "", "vs": [[32, "فقال له الكاتب: «صحيح، يامعلم! حسب الحق تكلمت. فإن الله واحد وليس آخر سواه."]]}, {"l": "Mar 12:34", "n": "", "vs": [[34, "فلما رأى يسوع أنه أجاب بحكمة، قال له: «لست بعيدا عن ملكوت الله!» ولم يجرؤ أحد بعد ذلك أن يوجه إليه أي سؤال."]]}, {"l": "1Ti 6:3", "n": "", "vs": [[3, "أما إذا كان أحد يعلم ما يخالفها ولا يذعن للكلام الصحيح، كلام ربنا يسوع المسيح، وللتعليم الموافق للتقوى،"]]}], "kwAr": "والكلمة الصحيحة", "noteAr": ""}, {"kw": "that he", "raw": "Neh_5:9; 1Ti_5:14; 1Pe_2:12, 1Pe_2:15, 1Pe_3:16", "note": "", "refs": [{"l": "Neh 5:9", "n": "", "vs": [[9, "ثم استطردت: «هذا تصرف سيء. ألا تسلكون في خوف إلهنا تفاديا لتعيير الأمم أعدائنا؟"]]}, {"l": "1Ti 5:14", "n": "", "vs": [[14, "فأريد إذن أن تتزوج الأرامل الشابات، فيلدن الأولاد، ويدبرن بيوتهن، ولا يفسحن للمقاوم في المجال للطعن في سلوكهن."]]}, {"l": "1Pe 2:12", "n": "", "vs": [[12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالحة يمجدون الله في يوم الافتقاد."]]}, {"l": "1Pe 2:15", "n": "", "vs": [[15, "فإن هذه هي إرادة الله: أن تفعلوا الخير دائما، فتفحموا جهالة الناس الأغبياء!"]]}, {"l": "1Pe 3:16", "n": "", "vs": [[16, "على أن تفعلوا ذلك بوداعة واحترام، محافظين على طهارة ضمائركم، سالكين في المسيح سلوكا صالحا، وعندئذ يخيب الذين يوجهون إليكم التهم الكاذبة ويشتمونكم كأنكم تفعلون شرا."]]}], "kwAr": "لكي يخجل المقاوم", "noteAr": ""}, {"kw": "may", "raw": "Isa_66:5; Luk_13:17; 2Th_3:14", "note": "", "refs": [{"l": "Isa 66:5", "n": "", "vs": [[5, "اسمعوا قول الرب أيها المرتعدون من كلامه: يسخر منكم إخوتكم الذين يكرهونكم وينبذونكم لأنكم تخافون اسمي قائلين: ليتمجد الرب حتى نشهد فرحكم. ولكنهم لا يعرفون أنهم هم الذين يخزون."]]}, {"l": "Luk 13:17", "n": "", "vs": [[17, "وإذ قال هذا، خجل جميع معارضيه، وفرح الجمع كله بجميع الأعمال المجيدة التي كان يجريها."]]}, {"l": "2Th 3:14", "n": "", "vs": [[14, "وإن كان أحد لا يطيع كلمتنا في هذه الرسالة، فميزوه ولا تتعاملوا معه، لتدفعوه إلى الخجل."]]}], "kwAr": "يخجل", "noteAr": ""}, {"kw": "having", "raw": "Phi_2:14-16", "note": "", "refs": [{"l": "Phi 2:14-16", "n": "", "vs": [[14, "فافعلوا كل شيء دون تذمر أو جدال،"], [15, "لتكونوا بلا أذى وبسطاء، أولادا لله لا يعابون بشيء في وسط جيل منحرف فاسد، تضيئون بينهم كأنوار في العالم،"], [16, "حاملين كلمة الحياة، لتكونوا في يوم المسيح موضع فخر بأني ما سعيت باطلا ولا اجتهدت عبثا."]]}], "kwAr": "لا يجد أمرا سيئا", "noteAr": ""}], "arS": [["والكلمة", ["G3056"]], [" ", []], ["الصحيحة", ["G5199"]], [" التي ", []], ["لا تلام", ["G176"]], ["، لكي ", []], ["يخجل", ["G1788"]], [" ", []], ["المقاوم", ["G1727"]], [" حين لا ", []], ["يجد", ["G2192"]], [" أمرا ", []], ["سيئا", ["G5337"]], [" ", []], ["يقوله", ["G3004"]], [" فينا.", []]]}, {"c": 2, "v": 9, "text": "وعلم العبيد أن يكونوا خاضعين لسادتهم، مرضين لهم في كل شيء؛ غير معاندين؛", "groups": [{"kw": "servants", "raw": "Eph_6:5-8; Col_3:22-25; 1Ti_6:1, 1Ti_6:2; 1Pe_2:18-25", "note": "", "refs": [{"l": "Eph 6:5-8", "n": "", "vs": [[5, "أيها العبيد، أطيعوا سادتكم البشريين بخوف وارتعاد، من قلب صادق، كمن يطيع المسيح،"], [6, "غير عاملين بجد فقط حين تكون عيونهم عليكم كمن يحاول إرضاء الناس، بل انطلاقا من كونكم عبيدا للمسيح،"], [7, "عاملين بمشيئة الله من القلب، خادمين بنية حسنة كما للرب، لا للناس."], [8, "فأنتم تعلمون أنه مهما عمل كل واحد من الخير، فسوف ينال المكافأة من الرب، سواء أكان عبدا أم حرا."]]}, {"l": "Col 3:22-25", "n": "", "vs": [[22, "أيها العبيد، أطيعوا في كل أمر سادتكم البشريين، فلا تعملوا بجد فقط حين تكون عيونهم عليكم، كمن يحاول إرضاء الناس، بل بقلب صادق خائفين الرب."], [23, "ومهما عملتم، فاجتهدوا فيه من صميم القلب، وكأنه للرب لا للناس،"], [24, "عالمين أنكم سوف تنالون المكافأة بالميراث من الرب. فإنما أنتم عبيد تخدمون الرب المسيح"], [25, "وأما من عمل شرا فسوف ينال جزاء عمله الشرير، وليس محاباة."]]}, {"l": "1Ti 6:1", "n": "", "vs": [[1, "على جميع من هم تحت نير العبودية أن يعتبروا سادتهم أهلا لكل إكرام، لكي لا يجلبوا التجديف على اسم الله وعلى التعليم."]]}, {"l": "1Ti 6:2", "n": "", "vs": [[2, "وعلى الذين لهم سادة مؤمنون أن لا يستخفوا بهم لأنهم إخوة لهم، بل بالأحرى أن يخدموهم بخضوع، لأن المستفيدين من خدمتهم الصالحة هم مؤمنون محبوبون."]]}, {"l": "1Pe 2:18-25", "n": "", "vs": [[18, "أيها الخدم، اخضعوا لسادتكم باحترام لائق. ليس للسادة الصالحين المترفقين فقط، بل للظالمين القساة أيضا!"], [19, "فما أجمل أن يتحمل الإنسان الأحزان حين يتألم مظلوما، بدافع من ضميره الخاضع لله!"], [20, "فبالحقيقة، أي مجد لكم إن كنتم تصبرون وأنتم تتحملون قصاص أخطائكم؟ لا فضل لكم عند الله إلا إذا تحملتم الآلام صابرين، وأنتم تفعلون الصواب."], [21, "لأن الله دعاكم إلى الاشتراك في هذا النوع من الآلام. فالمسيح، الذي تألم لأجلكم، هو القدوة التي تقتدون بها. فسيروا على آثار خطواته:"], [22, "إنه لم يفعل خطيئة واحدة، ولا كان في فمه مكر."], [23, "ومع أنه أهين، فلم يكن يرد الإهانة. وإذ تحمل الآلام، لم يكن يهدد بالانتقام، بل أسلم أمره لله الذي يحكم بالعدل."], [24, "وهو نفسه حمل خطايانا في جسده (عندما مات مصلوبا) على الخشبة، لكي نموت بالنسبة للخطايا فنحيا حياة البر. وبجراحه هو تم لكم الشفاء،"], [25, "فقد كنتم ضالين كخراف ضائعة، ولكنكم قد رجعتم الآن إلى راعي نفوسكم وحارسها!"]]}], "kwAr": "العبيد", "noteAr": ""}, {"kw": "to please", "raw": "Eph_5:24", "note": "", "refs": [{"l": "Eph 5:24", "n": "", "vs": [[24, "فكما أن الكنيسة قد أخضعت للمسيح، فكذلك الزوجات أيضا لأزواجهن، في كل شيء."]]}], "kwAr": "مرضين لهم", "noteAr": ""}, {"kw": "answering again", "raw": "or, gainsaying", "note": "or, gainsaying", "refs": [], "kwAr": "غير معاندين", "noteAr": "أو: غير مناقضين (غير مجادلين)."}], "arS": [["وعلم ", []], ["العبيد", ["G1401"]], [" أن يكونوا ", []], ["خاضعين", ["G5293"]], [" ", []], ["لسادتهم", ["G2398", "G1203"]], ["، ", []], ["مرضين", ["G2101"]], [" لهم في ", []], ["كل شيء", ["G3956"]], ["؛ غير ", []], ["معاندين", ["G483"]], ["؛", []]]}, {"c": 2, "v": 10, "text": "ولا سارقين، بل مظهرين أمانة كلية صالحة، لكي يزينوا في كل شيء تعليم مخلصنا الله.", "groups": [{"kw": "purloining", "raw": "2Ki_5:20-24; Luk_16:6-8; Joh_12:6; Act_5:2, Act_5:3", "note": "", "refs": [{"l": "2Ki 5:20-24", "n": "", "vs": [[20, "حتى حدث جيحزي خادم أليشع نفسه: «سيدي امتنع عن قبول ما أحضره نعمان من هدايا. حي هو الرب لأسرعن وراءه وآخذ منه شيئا»."], [21, "فلحق جيحزي بنعمان. ولما أبصره نعمان راكضا نحوه، ترجل عن المركبة للقائه سائلا: «أللخير جئت؟»"], [22, "فأجاب: «للخير. إن سيدي قد أرسلني قائلا: إن رجلين من جبل أفرايم من بني الأنبياء جاءاه، فأرجوك أن تعطيهما وزنة من الفضة وحلتي ثياب»."], [23, "فقال نعمان: «أرجوك أن تأخذ وزنتين» وألح عليه، وصرهما في كيسين وحلتي ثياب، وأعطاهما لرجلين من رجاله، فحملاهما وانطلقا أمام جيحزي."], [24, "وعندما وصل إلى الأكمة حيث يقيم أليشع أخذها منهما وأخفاها في البيت، وصرف الرجلين."]]}, {"l": "Luk 16:6-8", "n": "", "vs": [[6, "فأجاب: مئة بث من الزيت. فقال له: خذ صكك، واجلس سريعا، واكتب خمسين!"], [7, "ثم قال للآخر: وأنت، كم عليك؟ فأجاب: مئة كر من القمح. فقال له: خذ صكك، واكتب ثمانين!"], [8, "فامتدح السيد وكيله الخائن لأنه تصرف بحكمة. فإن أبناء هذا العالم أحكم مع أهل جيلهم من أبناء النور."]]}, {"l": "Joh 12:6", "n": "", "vs": [[6, "ولم يقل هذا لأنه كان يعطف على الفقراء، بل لأنه كان لصا، فقد كان أمينا للصندوق وكان يختلس مما يودع فيه."]]}, {"l": "Act 5:2", "n": "", "vs": [[2, "واحتفظ لنفسه بجزء من الثمن بعلم من زوجته، وجاء بما تبقى ووضعه عند أقدام الرسل."]]}, {"l": "Act 5:3", "n": "", "vs": [[3, "فقال له بطرس: «ياحنانيا، لماذا سمحت للشيطان أن يملأ قلبك، فكذبت على الروح القدس، واحتفظت لنفسك بجزء من ثمن الحقل؟"]]}], "kwAr": "ولا سارقين", "noteAr": ""}, {"kw": "showing", "raw": "Gen_31:37, Gen_31:38, Gen_39:8, Gen_39:9; 1Sa_22:14, 1Sa_26:23; Psa_101:6; Mat_24:45; Luk_16:10; 1Co_4:2", "note": "", "refs": [{"l": "Gen 31:37", "n": "", "vs": [[37, "وها أنت قد فتشت جميع أثاث بيتي، فماذا وجدت من جميع أثاث بيتك؟ اعرضه هنا أمام أقربائنا فيحكموا بيننا كلينا."]]}, {"l": "Gen 31:38", "n": "", "vs": [[38, "لقد مكثت معك عشرين سنة، فما أسقطت نعاجك وعنازك، ولم آكل من كباش غنمك."]]}, {"l": "Gen 39:8", "n": "", "vs": [[8, "فأبى وقال لها: «هوذا سيدي قد عهد إلي بكل ما يملك في هذا البيت ولم يشغل نفسه بأي شأن فيه."]]}, {"l": "Gen 39:9", "n": "", "vs": [[9, "وليس في هذا البيت من هو أعظم مني. ولم يمنع عني شيئا غيرك لأنك زوجته. فكيف أقترف هذا الشر العظيم وأخطيء إلى الله؟»"]]}, {"l": "1Sa 22:14", "n": "", "vs": [[14, "فأجاب أخيمالك: «أي واحد من بين جميع رجالك مثل داود أمين وصهر الملك وقائد حرسه وذو مكانة رفيعة في بيتك؟"]]}, {"l": "1Sa 26:23", "n": "", "vs": [[23, "وليكافيء الرب كل واحد على استقامته وأمانته، لأن الرب قد أوقعك اليوم فى قبضتي، لكني لم أشأ أن أمد يدي لأسيء إلى مختار الرب."]]}, {"l": "Psa 101:6", "n": "", "vs": [[6, "ترعى عيناي الأمناء في الأرض ليسكنوا معي. وخدامي هم السالكون في طريق الكمال."]]}, {"l": "Mat 24:45", "n": "", "vs": [[45, "فمن هو إذن ذلك العبد الأمين والحكيم الذي أقامه سيده على أهل بيته ليقدم لهم الطعام في أوانه؟"]]}, {"l": "Luk 16:10", "n": "", "vs": [[10, "إن الأمين في القليل أمين أيضا في الكثير، والخائن في القليل خائن أيضا في الكثير."]]}, {"l": "1Co 4:2", "n": "", "vs": [[2, "والمطلوب من الوكلاء، قبل كل شيء، أن يوجد كل منهم أمينا."]]}], "kwAr": "مظهرين أمانة كلية صالحة", "noteAr": ""}, {"kw": "adorn", "raw": "Mat_5:16; Eph_4:1; Phi_1:27, Phi_2:15, Phi_2:16, Phi_4:8; 1Pe_2:12, 1Pe_3:16", "note": "", "refs": [{"l": "Mat 5:16", "n": "", "vs": [[16, "هكذا، فليضيء نوركم أمام الناس، ليروا أعمالكم الحسنة ويمجدوا أباكم الذي في السماوات."]]}, {"l": "Eph 4:1", "n": "", "vs": [[1, "... إذن، أنا السجين في الرب، أناشدكم أن تسلكوا سلوكا يليق بالدعوة التي إليها دعيتم،"]]}, {"l": "Phi 1:27", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"]]}, {"l": "Phi 2:15", "n": "", "vs": [[15, "لتكونوا بلا أذى وبسطاء، أولادا لله لا يعابون بشيء في وسط جيل منحرف فاسد، تضيئون بينهم كأنوار في العالم،"]]}, {"l": "Phi 2:16", "n": "", "vs": [[16, "حاملين كلمة الحياة، لتكونوا في يوم المسيح موضع فخر بأني ما سعيت باطلا ولا اجتهدت عبثا."]]}, {"l": "Phi 4:8", "n": "", "vs": [[8, "وختاما، أيها الإخوة: كل ما كان حقا، وكل ما كان شريفا، وكل ما كان عادلا، وكل ما كان طاهرا وكل ما كان مستحبا، وكل ما كان حسن السمعة، وكل ما كان فيه فضيلة وخصلة حميدة، فاشغلوا أفكاركم به."]]}, {"l": "1Pe 2:12", "n": "", "vs": [[12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالحة يمجدون الله في يوم الافتقاد."]]}, {"l": "1Pe 3:16", "n": "", "vs": [[16, "على أن تفعلوا ذلك بوداعة واحترام، محافظين على طهارة ضمائركم، سالكين في المسيح سلوكا صالحا، وعندئذ يخيب الذين يوجهون إليكم التهم الكاذبة ويشتمونكم كأنكم تفعلون شرا."]]}], "kwAr": "لكي يزينوا", "noteAr": ""}, {"kw": "the doctrine", "raw": "1Ti_5:17, 1Ti_6:1, 1Ti_6:3; 2Jo_1:9", "note": "", "refs": [{"l": "1Ti 5:17", "n": "", "vs": [[17, "أما الشيوخ الذين يحسنون القيادة، فليعتبروا أهلا للإكرام المضاعف، وبخاصة الذين يبذلون الجهد في نشر الكلمة وفي التعليم."]]}, {"l": "1Ti 6:1", "n": "", "vs": [[1, "على جميع من هم تحت نير العبودية أن يعتبروا سادتهم أهلا لكل إكرام، لكي لا يجلبوا التجديف على اسم الله وعلى التعليم."]]}, {"l": "1Ti 6:3", "n": "", "vs": [[3, "أما إذا كان أحد يعلم ما يخالفها ولا يذعن للكلام الصحيح، كلام ربنا يسوع المسيح، وللتعليم الموافق للتقوى،"]]}, {"l": "2Jo 1:9", "n": "", "vs": [[9, "لأن من تعدى تعليم المسيح ولم يثبت فيه، فليس الله من نصيبه. أما من يثبت في هذا التعليم، فله الآب والابن معا."]]}], "kwAr": "تعليم", "noteAr": ""}, {"kw": "God", "raw": "Tit_1:3; 1Ti_1:1; Isa_12:2", "note": "", "refs": [{"l": "Tit 1:3", "n": "", "vs": [[3, "ثم بين كلمته في أوانها المعين: بالبشارة التي وضعت أمانة بين يدي بموجب أمر مخلصنا الله …"]]}, {"l": "1Ti 1:1", "n": "", "vs": [[1, "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"]]}, {"l": "Isa 12:2", "n": "", "vs": [[2, "ها إن الله خلاصي فأطمئن ولا أرتعد، لأن الرب الله هو قوتي وترنيمتي وقد أصبح لي خلاصا»."]]}], "kwAr": "مخلصنا الله", "noteAr": ""}], "arS": [["ولا ", []], ["سارقين", ["G3557"]], ["، بل ", []], ["مظهرين", ["G1731"]], [" ", []], ["أمانة", ["G4102"]], [" ", []], ["كلية", ["G3956"]], [" ", []], ["صالحة", ["G18"]], ["، لكي ", []], ["يزينوا", ["G2885"]], [" في ", []], ["كل شيء", ["G3956"]], [" ", []], ["تعليم", ["G1319"]], [" ", []], ["مخلصنا", ["G4990", "G2257"]], [" ", []], ["الله", ["G2316"]], [".", []]]}, {"c": 2, "v": 11, "text": "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت.", "groups": [{"kw": "the grace", "raw": "Tit_3:4, Tit_3:5; Psa_84:11; Zec_4:7, Zec_12:10; Joh_1:14, Joh_1:16, Joh_1:17; Act_11:23, Act_13:43; Act_20:24; Rom_4:4, Rom_4:5, Rom_5:2, Rom_5:15, Rom_5:20,Rom_5:21, Rom_11:5, Rom_11:6; 2Co_6:1; Gal_2:21; Eph_1:6, Eph_1:7, Eph_2:5, Eph_2:8; 2Th_2:16; 1Ti_1:14; Heb_2:9, Heb_12:15; 1Pe_1:10-12; 1Pe_5:5-12", "note": "", "refs": [{"l": "Tit 3:4", "n": "", "vs": [[4, "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،"]]}, {"l": "Tit 3:5", "n": "", "vs": [[5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"]]}, {"l": "Psa 84:11", "n": "", "vs": [[11, "لأن الرب الإله شمس وترس. الرب يعطي نعمة ومجدا؛ لا يمنع أي خير عن السالكين بالاستقامة."]]}, {"l": "Zec 4:7", "n": "", "vs": [[7, "أي شيء أنت أيها الجبل العظيم؟ أنت سهل أمام زربابل، وسيضع زربابل حجر الزاوية في خضم هتاف القائلين: ليباركه، ليباركه الرب»."]]}, {"l": "Zec 12:10", "n": "", "vs": [[10, "وأفيض على ذرية داود وعلى سكان أورشليم روح النعمة والابتهال، حتى إذا نظروا إلي أنا الذي طعنوه ينوحون عليه كما ينوح والد على ولده الوحيد، متفجعين عليه كتفجعهم على موت بكرهم."]]}, {"l": "Joh 1:14", "n": "", "vs": [[14, "والكلمة صار بشرا، وخيم بيننا، ونحن رأينا مجده، مجد ابن وحيد عند الآب، وهو ممتلىء بالنعمة والحق."]]}, {"l": "Joh 1:16", "n": "", "vs": [[16, "فمن امتلائه أخذنا جميعنا ونلنا نعمة على نعمة،"]]}, {"l": "Joh 1:17", "n": "", "vs": [[17, "لأن الشريعة أعطيت على يد موسى، أما النعمة والحق فقد تواجدا بيسوع المسيح."]]}, {"l": "Act 11:23", "n": "", "vs": [[23, "فلما وصل ورأى النعمة التي منحها الله ، امتلأ فرحا، وحث الجميع على الثبات في الرب بعزم القلب."]]}, {"l": "Act 13:43", "n": "", "vs": [[43, "وتبعهما بعد الاجتماع كثيرون من اليهود والمتهودين العابدين، فأخذا يكلمانهم ويشجعانهم على الثبات في نعمة الله."]]}, {"l": "Act 20:24", "n": "", "vs": [[24, "ولكني لا أحسب لحياتي أية قيمة، ما دمت أسعى إلى بلوغ غايتي وإتمام الخدمة التي كلفني إياها الرب يسوع: أن أشهد ببشارة نعمة الله."]]}, {"l": "Rom 4:4", "n": "", "vs": [[4, "إن الذي يعمل، لا تحسب له الأجرة من قبيل النعمة بل من قبيل الدين. أما الذي لا يعمل"]]}, {"l": "Rom 4:5", "n": "", "vs": [[5, "وإنما يؤمن بمن يبرر الأثيم، فإن إيمانه يحسب له برا."]]}, {"l": "Rom 5:2", "n": "", "vs": [[2, "وبه أيضا تم لنا الدخول بالإيمان إلى هذه النعمة التي نقيم فيها الآن؛ ونحن نفتخر برجائنا في التمتع بمجد الله."]]}, {"l": "Rom 5:15", "n": "", "vs": [[15, "ولكن مفعول المعصية ليس كمفعول النعمة! فإذا كان الكثيرون بمعصية إنسان واحد قد ماتوا، فكم بالأحرى في الإنسان الواحد يسوع المسيح تتوافر للكثيرين نعمة الله والعطية المجانية بالنعمة."]]}, {"l": "Rom 5:20", "n": "", "vs": [[20, "وأما الشريعة فقد أدخلت لتظهر كثرة المعصية. ولكن، حيث كثرت الخطيئة، تتوافر النعمة أكثر جدا،"]]}, {"l": "Rom 5:21", "n": "", "vs": [[21, "حتى إنه كما ملكت الخطيئة بالموت، فكذلك أيضا تملك النعمة على أساس البر مؤدية إلى الحياة الأبدية بيسوع المسيح ربنا."]]}, {"l": "Rom 11:5", "n": "", "vs": [[5, "فكذلك، في الزمان الحاضر، ماتزال بقية اختارها الله بالنعمة."]]}, {"l": "Rom 11:6", "n": "", "vs": [[6, "ولكن، بما أن ذلك قد تم بالنعمة، فليس بعد على أساس الأعمال، وإلا فليست النعمة نعمة بعد."]]}, {"l": "2Co 6:1", "n": "", "vs": [[1, "فبما أننا عاملون معا عند الله، نطلب ألا يكون قبولكم لنعمة الله عبثا."]]}, {"l": "Gal 2:21", "n": "", "vs": [[21, "إني لا أبطل فاعلية نعمة الله، إذ لو كان البر بالشريعة، لكان موت المسيح عملا لا داعي له."]]}, {"l": "Eph 1:6", "n": "", "vs": [[6, "بغرض مدح مجد نعمته التي بها أعطانا حظوة لديه في المحبوب:"]]}, {"l": "Eph 1:7", "n": "", "vs": [[7, "ففيه لنا بدمه الفداء، أي غفران الخطايا؛ بحسب غنى نعمته"]]}, {"l": "Eph 2:5", "n": "", "vs": [[5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"]]}, {"l": "Eph 2:8", "n": "", "vs": [[8, "فإنكم بالنعمة مخلصون، بالإيمان، وهذا ليس منكم. إنه هبة من الله،"]]}, {"l": "2Th 2:16", "n": "", "vs": [[16, "وليت ربنا يسوع المسيح نفسه، والله أبانا، الذي أحبنا ووهبنا بنعمته راحة أبدية ورجاء صالحا،"]]}, {"l": "1Ti 1:14", "n": "", "vs": [[14, "إلا أن نعمة ربنا قد فاضت علي فوق كل حد، ومعها الإيمان والمحبة، وذلك في المسيح يسوع."]]}, {"l": "Heb 2:9", "n": "", "vs": [[9, "إلا أننا نرى يسوع الآن مكللا بالمجد والكرامة، لأنه قاسى الموت. وذلك بعدما صار أدنى من الملائكة إلى حين، ليذوق بنعمة الله الموت عوضا عن كل واحد."]]}, {"l": "Heb 12:15", "n": "", "vs": [[15, "انتبهوا ألا يسقط أحدكم من نعمة الله، حتى لا يتأصل بينكم جذر مرارة، فيسبب بلبلة، وينجس كثيرين منكم."]]}, {"l": "1Pe 1:10-12", "n": "", "vs": [[10, "وكم فتش الأنبياء قديما وبحثوا عن هذا الخلاص! فهم تنبأوا عن نعمة الله التي كان قد أعدها لكم أنتم،"], [11, "واجتهدوا لمعرفة الزمان والأحوال التي كان يشير إليها روح المسيح الذي كان عاملا فيهم، عندما شهد لهم مسبقا بما ينتظر المسيح من آلام، وبما يأتي بعدها من أمجاد."], [12, "ولكن الله أوحى إليهم أن اجتهادهم لم يكن لمصلحتهم هم، بل لمصلحتكم أنتم. فقد كان ذلك من أجل البشارة التي نقلها إليكم في الزمان الحاضر مبشرون يؤيدهم الروح القدس المرسل من السماء. ويالها من أمور يتمنى حتى الملائكة أن يطلعوا عليها!"]]}, {"l": "1Pe 5:5-12", "n": "", "vs": [[5, "كذلك، أيها الشباب، اخضعوا للشيوخ. البسوا جميعا ثوب التواضع في معاملتكم بعضكم لبعض. لأن الله يقاوم المتكبرين، ولكنه يعطي المتواضعين نعمة."], [6, "إذن، تواضعوا تحت يد الله القديرة لكي يرفعكم عندما يحين الوقت،"], [7, "واطرحوا عليه ثقل همومكم كلها، لأنه هو يعتني بكم."], [8, "تعقلوا وتنبهوا. إن خصمكم إبليس كأسد يزأر، يجول باحثا عن فريسة يبتلعها."], [9, "فقاوموه، ثابتين في الإيمان. واذكروا أن إخوتكم المنتشرين في العالم يجتازون وسط هذه الآلام عينها."], [10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."], [11, "له المجد والسلطة إلى أبد الآبدين. آمين!"], [12, "إني مرسل إليكم هذه الرسالة القصيرة بيد سلوانس الأخ الأمين. وغايتي أن أحرضكم وأشهد لكم أن النعمة التي تتمتعون بها هي نعمة الله الحقيقية التي أنتم فيها ثابتون."]]}], "kwAr": "نعمة الله", "noteAr": ""}, {"kw": "bringeth", "raw": "etc. or, bringeth salvation to all men", "note": "etc. or, bringeth salvation to all men", "refs": [], "kwAr": "التي تحمل معها الخلاص", "noteAr": "أو: التي تحمل الخلاص لجميع الناس."}, {"kw": "hath appeared", "raw": "hath, Psa_96:1-3, Psa_96:10, Psa_98:1-3, Psa_117:1, Psa_117:2; Isa_2:2, Isa_2:3, Isa_45:22, Isa_49:6, Isa_52:10, Isa_60:1-3; Mat_28:19; Mar_16:15; Luk_3:6, Luk_24:47; Act_13:47; Joh_1:9; Rom_10:18; Rom_15:9-19; Eph_3:6-8; Col_1:6, Col_1:23; 1Ti_2:4; 2Ti_4:17", "note": "hath, Psa_96:1-3, Psa_96:10, Psa_98:1-3, Psa_117:1, Psa_117:2; Isa_2:2, Isa_2:3, Isa_45:22, Isa_49:6, Isa_52:10, Isa_60:1-3; Mat_28:19; Mar_16:15; Luk_3:6, Luk_24:47; Act_13:47; Joh_1:9; Rom_10:18; Rom_15:9-19; Eph_3:6-8; Col_1:6, Col_1:23; 1Ti_2:4; 2Ti_4:17", "refs": [{"l": "Psa 96:1-3", "n": "", "vs": [[1, "رنموا للرب ترنيمة جديدة. رنموا للرب ياساكني الأرض جميعا."], [2, "رنموا للرب. باركوا اسمه. بشروا بخلاصه يوما فيوما."], [3, "أعلنوا مجده بين الأمم، وعجائبه بين الشعوب كلها."]]}, {"l": "Psa 96:10", "n": "", "vs": [[10, "نادوا بين الأمم أن الرب قد ملك. هوذا الأرض قد استقرت مطمئنة لأنه يدين الشعوب بالإنصاف."]]}, {"l": "Psa 98:1-3", "n": "", "vs": [[1, "رنموا للرب ترنيمة جديدة، لأنه قد صنع عجائب. وبيمينه وذراعه المقدسة أحرز خلاصا."], [2, "أعلن الرب خلاصه؛ أمام أنظار الأمم كشف بره."], [3, "ذكر رحمته وأمانته لبيت إسرائيل. رأت كل أقاصي الأرض خلاص إلهنا."]]}, {"l": "Psa 117:1", "n": "", "vs": [[1, "سبحوا الرب يا جميع الأمم، ومجدوه يا كل الشعوب."]]}, {"l": "Psa 117:2", "n": "", "vs": [[2, "لأن رحمته غلبت علينا، وأمانة الرب إلى الأبد تدوم. هللويا!"]]}, {"l": "Isa 2:2", "n": "", "vs": [[2, "ويحدث في آخر الأيام، أن جبل هيكل الرب يصبح أسمى من كل الجبال، ويعلو فوق كل التلال، فتتوافد إليه جميع الأمم."]]}, {"l": "Isa 2:3", "n": "", "vs": [[3, "وتقبل شعوب كثيرة وتقول: تعالوا لنذهب إلى جبل الرب، إلى بيت إله يعقوب، فيعلمنا طرقه، ونسلك في سبله، لأن من صهيون تخرج الشريعة، ومن أورشليم تعلن كلمة الرب."]]}, {"l": "Isa 45:22", "n": "", "vs": [[22, "التفتوا إلي واخلصوا ياجميع أقاصي الأرض، لأني أنا الله وليس هناك آخر."]]}, {"l": "Isa 49:6", "n": "", "vs": [[6, "لكم هو يسير أن تكون لي عبدا لتستنهض أسباط يعقوب، وترد من نجيت من إسرائيل، لذلك سأجعلك نورا للأمم لتكون خلاصي إلى أقصى الأرض."]]}, {"l": "Isa 52:10", "n": "", "vs": [[10, "شمر الرب عن ذراع قدسه أمام عيون كل الأمم، فترى أقاصي الأرض خلاص إلهنا."]]}, {"l": "Isa 60:1-3", "n": "", "vs": [[1, "قومي استضيئي، فإن نورك قد جاء، ومجد الرب أشرق عليك."], [2, "ها إن الظلمة تغمر الأرض، والليل الدامس يكتنف الشعوب، ولكن الرب يشرق عليك، ويتجلى مجده حولك،"], [3, "فتقبل الأمم إلى نورك، وتتوافد الملوك إلى إشراق ضيائك."]]}, {"l": "Mat 28:19", "n": "", "vs": [[19, "فاذهبوا إذن، وتلمذوا جميع الأمم، وعمدوهم باسم الآب والابن والروح القدس؛"]]}, {"l": "Mar 16:15", "n": "", "vs": [[15, "وقال لهم: «اذهبوا إلى العالم أجمع، وبشروا الخليقة كلها بالإنجيل:"]]}, {"l": "Luk 3:6", "n": "", "vs": [[6, "فيبصر كل بشر الخلاص الإلهي! »"]]}, {"l": "Luk 24:47", "n": "", "vs": [[47, "وأن يبشر باسمه بالتوبة وغفران الخطايا في جميع الأمم انطلاقا من أورشليم."]]}, {"l": "Act 13:47", "n": "", "vs": [[47, "فقد أوصانا الرب قائلا: قد جعلتك نورا للأمم، لتكون سبيل خلاص إلى أقصى الأرض!»"]]}, {"l": "Joh 1:9", "n": "", "vs": [[9, "فالنور الحق الذي ينير كل إنسان كان آتيا إلى العالم."]]}, {"l": "Rom 10:18", "n": "", "vs": [[18, "ولكني أقول: أما سمعوا؟ بلى، فإن المبشرين «انطلق صوتهم إلى الأرض كلها، وكلامهم إلى أقاصي العالم»."]]}, {"l": "Rom 15:9-19", "n": "", "vs": [[9, "وإن الأمم يمجدون الله على الرحمة، وفقا لما قد كتب: «لهذا أعترف لك بين الأمم وأرتل لاسمك!»"], [10, "وأيضا قيل: «افرحوا، أيها الأمم، مع شعبه»."], [11, "وأيضا: «سبحوا الرب ياجميع الأمم، ولتحمده جميع الشعوب»."], [12, "ويقول إشعياء أيضا: «سيطلع أصل يسى، والقائم، ليسود على الأمم: عليه تعلق الشعوب الرجاء»."], [13, "فليملأكم إله الرجاء كل فرح وسلام في إيمانكم حتى تزدادوا رجاء بقوة الروح القدس."], [14, "وأنا نفسي أيضا على يقين من جهتكم أيها الإخوة بأنكم مشحونون صلاحا، وممتلئون بكل معرفة، وقادرون أيضا على نصح بعضكم بعضا."], [15, "على أني كتبت إليكم بأوفر جرأة في بعض الأمور، مذكرا لكم، وذلك بالنعمة التي وهبها الله لي."], [16, "وبذلك أكون خادم المسيح يسوع، المرسل إلى الأمم، حاملا إنجيل الله وكأني أقوم بخدمة كهنوتية، بقصد أن ترفع لله من بين الأمم تقدمة تكون مقبولة ومقدسة بالروح القدس."], [17, "يحق لي إذن أن أفتخر في المسيح يسوع بما يعود لله من خدمتي."], [18, "فما كنت لأتجاسر أن أتكلم بشيء إلا على ما عمله المسيح على يدي لهداية الأمم إلى الطاعة، بالقول والفعل،"], [19, "وبقوة الآيات والعجائب، وبقوة روح الله. حتى إنني، من أورشليم وما حولها حتى مقاطعة إليريكون، قد أكملت التبشير بإنجيل المسيح."]]}, {"l": "Eph 3:6-8", "n": "", "vs": [[6, "وهو أن الأمم هم شركاء اليهود في الميراث، وأعضاء في الجسد معهم، ولهم أيضا حق الاستفادة من الوعد. وذلك في المسيح يسوع وبفضل الإنجيل"], [7, "الذي صرت أنا خادما له بحسب نعمة الله الموهوبة لي وفقا لعمل قدرته."], [8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "Col 1:6", "n": "", "vs": [[6, "والتي وصلت إليكم كما تنتشر الآن في العالم أجمع، منتجة الثمر ونامية، مثلما يحدث بينكم أنتم منذ أن سمعتم بنعمة الله واختبرتموها بالحق،"]]}, {"l": "Col 1:23", "n": "", "vs": [[23, "على أن تثبتوا فعلا في الإيمان، مؤسسين وراسخين وغير متحولين عن رجاء الإنجيل الذي سمعتموه والذي بشر به للخليقة كلها تحت السماء، وله صرت أنا بولس خادما."]]}, {"l": "1Ti 2:4", "n": "", "vs": [[4, "فهو يريد لجميع الناس أن يخلصوا، ويقبلوا إلى معرفة الحق بالتمام:"]]}, {"l": "2Ti 4:17", "n": "", "vs": [[17, "إلا أن الرب وقف بجانبي وأمدني بالقوة، لكي تتم بي المناداة بالبشارة، فيسمعها جميع من هم من الأمم؛ وقد نجوت من فم الأسد."]]}], "kwAr": "قد ظهرت", "noteAr": "قد ظهرت (لجميع الناس)."}], "arS": [["فإن ", []], ["نعمة", ["G5485"]], [" ", []], ["الله", ["G2316"]], [" التي ", []], ["تحمل معها الخلاص", ["G4992"]], [" ", []], ["لجميع", ["G3956"]], [" ", []], ["الناس", ["G444"]], ["، قد ", []], ["ظهرت", ["G2014"]], [".", []]]}, {"c": 2, "v": 12, "text": "وهي تعلمنا أن نقطع علاقتنا بالإباحية والشهوات العالمية، وأن نحيا في العصر الحاضر حياة التعقل والبر والتقوى،", "groups": [{"kw": "Teaching", "raw": "Mat_28:20; Joh_6:25; 1Th_4:9; Heb_8:11; 1Jo_2:27", "note": "", "refs": [{"l": "Mat 28:20", "n": "", "vs": [[20, "وعلموهم أن يعملوا بكل ما أوصيتكم به. وها أنا معكم كل الأيام إلى انتهاء الزمان! »."]]}, {"l": "Joh 6:25", "n": "", "vs": [[25, "فلما وجدوه على الضفة المقابلة من البحيرة، قالوا له: «يامعلم، متى وصلت إلى هنا؟»"]]}, {"l": "1Th 4:9", "n": "", "vs": [[9, "أما المحبة الأخوية، فلستم في حاجة لأن أكتب إليكم عنها، لأنكم بأنفسكم قد تعلمتم من الله أن تحبوا بعضكم بعضا،"]]}, {"l": "Heb 8:11", "n": "", "vs": [[11, "بعد ذلك، لا يعلم أحد منهم ابن وطنه ولا أخاه قائلا: تعرف بالرب! ذلك لأن الجميع سوف يعرفونني حق المعرفة، من الصغير فيهم إلى العظيم."]]}, {"l": "1Jo 2:27", "n": "", "vs": [[27, "أما أنتم فقد نلتم من الله مسحة تبقى فيكم دائما. ولذلك، لستم بحاجة إلى من يعلمكم الحق. فتلك المسحة عينها هي التي تعلمكم كل شيء. وهي حق وليست كذبا. فكما علمتكم اثبتوا في المسيح."]]}], "kwAr": "وهي تعلمنا", "noteAr": ""}, {"kw": "denying", "raw": "Isa_55:6, Isa_55:7; Eze_18:30,Eze_18:31, Eze_33:14, Eze_33:15; Mat_3:8-10, Mat_16:24; Luk_1:75; Rom_6:4-6, Rom_6:12, Rom_6:19, Rom_8:13, Rom_13:12, Rom_13:13; 1Co_6:9-11; 2Co_7:1; Gal_5:24; Eph_1:4, Eph_4:22-25; Col_1:22, Col_3:5-9; 1Th_4:7; Jam_4:8-10; 1Pe_2:11, 1Pe_2:12, 1Pe_4:2-5; 2Pe_1:4, 2Pe_2:20-22; 1Jo_2:15-17; Jud_1:18", "note": "", "refs": [{"l": "Isa 55:6", "n": "", "vs": [[6, "اطلبوا الرب مادام موجودا، ادعوه وهو قريب."]]}, {"l": "Isa 55:7", "n": "", "vs": [[7, "ليترك الشرير طريقه والأثيم أفكاره، وليتب إلى الرب فيرحمه، وليرجع إلى إلهنا لأنه يكثر الغفران."]]}, {"l": "Eze 18:30", "n": "", "vs": [[30, "لذلك أدينكم ياشعب إسرائيل، كل واحد بمقتضى طرقه، يقول السيد الرب. توبوا وارجعوا عن ذنوبكم كلها، فلا يكون لكم الإثم معثرة هلاك."]]}, {"l": "Eze 18:31", "n": "", "vs": [[31, "اطرحوا عنكم كل ذنوبكم التي ارتكبتموها، واحصلوا لأنفسكم على قلب جديد وروح جديدة. فلماذا تنقرضون ياشعب إسرائيل؟"]]}, {"l": "Eze 33:14", "n": "", "vs": [[14, "وإذا قلت للشرير إنك لا محالة مائت: فارتدع عن خطيئته ومارس العدل والحق،"]]}, {"l": "Eze 33:15", "n": "", "vs": [[15, "ورد الرهن، وعوض عما اغتصبه، وسلك في الفرائض التي تؤمن له الحياة، من غير أن يرتكب إثما، فإنه لا محالة يحيا ولا يموت في خطاياه،"]]}, {"l": "Mat 3:8-10", "n": "", "vs": [[8, "فأثمروا ثمرا يليق بالتوبة."], [9, "ولا تعللوا أنفسكم قائلين: لنا إبراهيم أبا! فإني أقول لكم: إن الله قادر أن يطلع من هذه الحجارة أولادا لإبراهيم."], [10, "وها إن الفأس قد ألقيت على أصل الشجر، فكل شجرة لا تثمر ثمرا جيدا تقطع وتطرح في النار."]]}, {"l": "Mat 16:24", "n": "", "vs": [[24, "ثم قال يسوع لتلاميذه: «إن أراد أحد أن يسير ورائي، فلينكر نفسه ويحمل صليبه ويتبعني."]]}, {"l": "Luk 1:75", "n": "", "vs": [[75, "بقداسة وبر أمامه، طوال حياتنا."]]}, {"l": "Rom 6:4-6", "n": "", "vs": [[4, "وبسبب ذلك دفنا معه بالمعمودية للموت، حتى كما أقيم المسيح من الأموات بمجد الآب، كذلك نسلك نحن أيضا في حياة جديدة."], [5, "فما دمنا قد اتحدنا به في ما يشبه موته، فإننا سنتحد به أيضا في قيامته."], [6, "فنحن نعلم هذا: أن الإنسان العتيق فينا قد صلب معه لكي يبطل جسد الخطيئة فلا نبقى عبيدا للخطيئة فيما بعد."]]}, {"l": "Rom 6:12", "n": "", "vs": [[12, "إذن، لا تملكن الخطيئة في جسدكم المائت فتنقادوا لها في شهواته."]]}, {"l": "Rom 6:19", "n": "", "vs": [[19, "أتكلم بشريا هنا بسبب ضعفكم البشري. فكما قدمتم سابقا أعضاءكم عبيدا للنجاسة والإثم في خدمة الإثم، كذلك قدموا الآن أعضاءكم عبيدا للبر في خدمة القداسة."]]}, {"l": "Rom 8:13", "n": "", "vs": [[13, "لأنه إن عشتم بحسب الجسد، فإنكم ستموتون، ولكن إن كنتم بالروح تميتون أعمال الجسد، فستحيون."]]}, {"l": "Rom 13:12", "n": "", "vs": [[12, "كاد الليل أن ينتهي والنهار أن يطلع. فلنطرح أعمال الظلام، ونلبس سلاح النور"]]}, {"l": "Rom 13:13", "n": "", "vs": [[13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."]]}, {"l": "1Co 6:9-11", "n": "", "vs": [[9, "أما تعلمون أن الظالمين لن يرثوا ملكوت الله؟ لا تضلوا: فإن ملكوت الله لن يرثه الزناة ولا عابدو الأصنام ولا الفاسقون ولا المتخنثون ولا مضاجعو الذكور"], [10, "ولا السراقون ولا الطماعون ولا السكيرون ولا الشتامون ولا المغتصبون."], [11, "وهكذا كان بعضكم، إلا أنكم قد اغتسلتم، بل تقدستم، بل تبررتم، باسم الرب يسوع المسيح وبروح إلهنا."]]}, {"l": "2Co 7:1", "n": "", "vs": [[1, "فإذ نلنا هذه الوعود، أيها الأحباء، لنطهر أنفسنا من كل ما يدنس الجسد والروح، ونكمل القداسة في مخافة الله."]]}, {"l": "Gal 5:24", "n": "", "vs": [[24, "ولكن الذين صاروا خاصة للمسيح، قد صلبوا الجسد مع الأهواء والشهوات."]]}, {"l": "Eph 1:4", "n": "", "vs": [[4, "كما كان قد اختارنا فيه قبل تأسيس العالم، لنكون قديسين بلا لوم أمامه."]]}, {"l": "Eph 4:22-25", "n": "", "vs": [[22, "وهو أن تخلعوا ما يتعلق بسيرتكم الماضية: الإنسان العتيق الذي يفسد نفسه بالشهوات الخداعة؛"], [23, "وتتجددوا في روح ذهنكم؛"], [24, "وتلبسوا الإنسان الجديد المخلوق على مثال الله في البر والقداسة بالحق."], [25, "لذلك اخلعوا عنكم الكذب، وتكلموا بالصدق كل واحد مع قريبه، لأننا أعضاء بعضنا لبعض."]]}, {"l": "Col 1:22", "n": "", "vs": [[22, "قد صالحكم الآن في جسد بشرية (ابنه) بالموت. وذلك لكي يحضركم فتمثلوا أمامه وأنتم قديسون بلا ذنب ولا لوم."]]}, {"l": "Col 3:5-9", "n": "", "vs": [[5, "فأميتوا إذن أعضاءكم الأرضية: الزنى، النجاسة، جموح العاطفة، الشهوة الرديئة، والاشتهاء النهم الذي هو عبادة أصنام."], [6, "فبسبب هذه الخطايا ينزل غضب الله،"], [7, "وفيها سلكتم في الماضي، حين كنتم تعيشون فيها."], [8, "وأما الآن، فانزعوا عنكم، أنتم أيضا، هذه الخطايا كلها: الغضب، النقمة، الخبث، التجديف، الكلام القبيح الخارج من أفواهكم."], [9, "لا يكذب أحدكم على الآخر، إذ قد نزعتم الإنسان العتيق وأعماله"]]}, {"l": "1Th 4:7", "n": "", "vs": [[7, "فإن الله دعانا لا إلى النجاسة بل (إلى العيش( في القداسة."]]}, {"l": "Jam 4:8-10", "n": "", "vs": [[8, "اقتربوا إلى الله فيقترب إليكم. أيها الخاطئون نظفوا أيديكم، وياأصحاب الرأيين طهروا قلوبكم."], [9, "احزنوا مولولين ونائحين وباكين. ليتحول ضحككم إلى نواح، وفرحكم إلى كآبة."], [10, "تواضعوا في حضرة الرب فيرفعكم!"]]}, {"l": "1Pe 2:11", "n": "", "vs": [[11, "أيها الأحباء، ما أنتم إلا غرباء تزورون الأرض زيارة عابرة. لذلك أطلب إليكم أن تبتعدوا عن الشهوات الجسدية التي تصارع النفس."]]}, {"l": "1Pe 2:12", "n": "", "vs": [[12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالحة يمجدون الله في يوم الافتقاد."]]}, {"l": "1Pe 4:2-5", "n": "", "vs": [[2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."], [3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."], [4, "ورفاقكم في تلك العيشة سابقا يستغربون أنكم لا تركضون معهم إلى فيض هذه الخلاعة، ويجرحون سمعتكم."], [5, "لكنهم سوف يؤدون الحساب أمام المسيح، المستعد أن يدين الأحياء والأموات."]]}, {"l": "2Pe 1:4", "n": "", "vs": [[4, "اللذين بهما أعطانا الله بركاته العظمى الثمينة التي كان قد وعد بها. وبهذا صار بإمكانكم أن تتخلصوا من الفساد الذي تنشره الشهوة في العالم، وتشتركوا في الطبيعة الإلهية."]]}, {"l": "2Pe 2:20-22", "n": "", "vs": [[20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."], [21, "وبالحقيقة، كان أفضل لهم لو أنهم لم يتعرفوا بطريق البر، من أن يتعرفوا به ثم يرتدوا عن الوصية المقدسة التي تسلموها."], [22, "وينطبق على هؤلاء ما يقوله المثل الصادق: «عاد الكلب إلى تناول ما تقيأه، والخنزيرة المغتسلة إلى التمرغ في الوحل!»"]]}, {"l": "1Jo 2:15-17", "n": "", "vs": [[15, "لا تحبوا العالم، ولا الأشياء التي في العالم. فالذي يحب العالم، لا تكون محبة الآب في قلبه."], [16, "لأن كل ما في العالم، من شهوات الجسد وشهوات العين وترف المعيشة، ليس من الآب، بل من العالم."], [17, "وسوف يزول العالم، وما فيه من شهوات أما الذي يعمل بإرادة الله، فيبقى إلى الأبد!"]]}, {"l": "Jud 1:18", "n": "", "vs": [[18, "فقد سبق أن نبهوكم إلى أنه، في نهاية الزمان، سيطلع مستهزئون يعيشون منغمسين في شهواتهم الفاسقة."]]}], "kwAr": "نقطع علاقتنا بالإباحية", "noteAr": ""}, {"kw": "live", "raw": "Psa_105:45; Eze_36:27; Mat_5:19, Mat_5:20; Luk_1:6, Luk_1:75, Luk_3:9-13; Act_24:16, Act_24:25; Rom_6:19; 1Ti_4:12; 1Pe_1:14-18; 2Pe_1:5-8, 2Pe_3:11; 1Jo_2:6; Rev_14:12", "note": "", "refs": [{"l": "Psa 105:45", "n": "", "vs": [[45, "ليمارسوا فرائضه ويطيعوا شرائعه. هللويا."]]}, {"l": "Eze 36:27", "n": "", "vs": [[27, "وأضع روحي في داخلكم فأجعلكم تمارسون فرائضي وتطيعون أحكامي عاملين بها،"]]}, {"l": "Mat 5:19", "n": "", "vs": [[19, "فأي من خالف واحدة من هذه الوصايا الصغرى، وعلم الناس أن يفعلوا فعله، يدعى الأصغر في ملكوت السماوات. وأما من عمل بها وعلمها، فيدعى عظيما في ملكوت السماوات."]]}, {"l": "Mat 5:20", "n": "", "vs": [[20, "فإني أقول لكم: إن لم يزد بركم على بر الكتبة والفريسيين، لن تدخلوا ملكوت السماوات أبدا."]]}, {"l": "Luk 1:6", "n": "", "vs": [[6, "وكان كلاهما بارين أمام الله، يسلكان وفقا لوصايا الرب وأحكامه كلها بغير لوم."]]}, {"l": "Luk 1:75", "n": "", "vs": [[75, "بقداسة وبر أمامه، طوال حياتنا."]]}, {"l": "Luk 3:9-13", "n": "", "vs": [[9, "وها إن الفأس أيضا قد وضعت على أصل الشجر: فكل شجرة لا تثمر ثمرا جيدا تقطع وتطرح في النار»."], [10, "وسألته الجموع: «فماذا نفعل إذن؟»"], [11, "فأجابهم: «من كان عنده ثوبان، فليعط من لا ثوب عنده؛ ومن كان عنده طعام، فليعمل كذلك أيضا»."], [12, "وجاء أيضا جباة ضرائب ليتعمدوا، فسألوه: «يامعلم، ماذا نفعل؟»"], [13, "فقال لهم: «لا تجبوا أكثر مما فرض لكم»."]]}, {"l": "Act 24:16", "n": "", "vs": [[16, "لذلك أنا أيضا أدرب نفسي لكي أحيا دائما بضمير نقي أمام الله والناس."]]}, {"l": "Act 24:25", "n": "", "vs": [[25, "ولما تحدث بولس عن البر وضبط النفس والدينونة الآتية ارتعب فيلكس، وقال لبولس: «اذهب الآن، ومتى توفر لي الوقت أستدعيك ثانية»."]]}, {"l": "Rom 6:19", "n": "", "vs": [[19, "أتكلم بشريا هنا بسبب ضعفكم البشري. فكما قدمتم سابقا أعضاءكم عبيدا للنجاسة والإثم في خدمة الإثم، كذلك قدموا الآن أعضاءكم عبيدا للبر في خدمة القداسة."]]}, {"l": "1Ti 4:12", "n": "", "vs": [[12, "لا يستخف أحد بحداثة سنك. وإنما كن قدوة للمؤمنين، في الكلام والسلوك والمحبة والإيمان والطهارة."]]}, {"l": "1Pe 1:14-18", "n": "", "vs": [[14, "وبما أنكم صرتم أولادا لله مطيعين له، فلا تعودوا إلى مجاراة الشهوات التي كانت تسيطر عليكم سابقا في أيام جهلكم."], [15, "وإنما اسلكوا سلوكا مقدسا في كل أمر، مقتدين بالقدوس الذي دعاكم،"], [16, "لأنه قد كتب: «كونوا قديسين، لأني أنا قدوس!»"], [17, "وما دمتم تعترفون بالله أبا لكم، وهو يحكم على كل إنسان حسب أعماله دون انحياز، فاسلكوا في مخافته مدة إقامتكم المؤقتة على الأرض."], [18, "واعلموا أنه قد دفع الفدية ليحرركم من سيرة حياتكم الباطلة التي أخذتموها بالتقليد عن آبائكم. وهذه الفدية لم تكن شيئا فانيا كالفضة أو الذهب،"]]}, {"l": "2Pe 1:5-8", "n": "", "vs": [[5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"], [6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"], [7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."], [8, "فحين تكون هذه الصفات الطيبة في داخلكم، وتزداد بوفرة، تجعلكم مجتهدين ومثمرين في معرفتكم لربنا يسوع المسيح."]]}, {"l": "2Pe 3:11", "n": "", "vs": [[11, "ومادامت هذه الأشياء جميعا ستنحل، فكيف يجب أن تكونوا أنتم أصحاب سلوك مقدس يتصف بالتقوى،"]]}, {"l": "1Jo 2:6", "n": "", "vs": [[6, "كل من يعترف أنه ثابت في المسيح، يلتزم أن يسلك كما سلك المسيح!"]]}, {"l": "Rev 14:12", "n": "", "vs": [[12, "وهنا يظهر صبر القديسين الذين يحافظون على وصايا الله والإيمان بيسوع!»"]]}], "kwAr": "نحيا", "noteAr": ""}, {"kw": "soberly", "raw": "Tit_2:4", "note": "", "refs": [{"l": "Tit 2:4", "n": "", "vs": [[4, "لكي يدربن الشابات على أن يكن محبات لأزواجهن ولأولادهن،"]]}], "kwAr": "حياة التعقل", "noteAr": ""}, {"kw": "godly", "raw": "Psa_4:3; 2Co_1:12; 2Pe_2:9", "note": "", "refs": [{"l": "Psa 4:3", "n": "", "vs": [[3, "اعلموا أن الرب قد ميز لنفسه تقيه؛ الرب يسمع عندما أدعوه."]]}, {"l": "2Co 1:12", "n": "", "vs": [[12, "فإن فخرنا هو هذا: شهادة ضميرنا بأننا، في قداسة الله وإخلاصه، قد سلكنا في العالم، وبخاصة تجاهكم؛ ولم يكن ذلك بحكمة بشرية بل بنعمة الله."]]}, {"l": "2Pe 2:9", "n": "", "vs": [[9, "وهكذا نرى أن الرب يعرف أن ينقذ الأتقياء من المحنة، ويحفظ الأشرار محبوسين ليحكم عليهم بالعقاب في يوم الدينونة."]]}], "kwAr": "والتقوى", "noteAr": ""}, {"kw": "this", "raw": "Joh_14:30, Joh_17:14, Joh_17:15; Rom_12:2; Gal_1:4; Eph_2:2; 2Ti_4:10; 1Jo_5:19", "note": "", "refs": [{"l": "Joh 14:30", "n": "", "vs": [[30, "لن أكلمكم كثيرا بعد، فإن سيد هذا العالم قادم علي، ولا شيء له في."]]}, {"l": "Joh 17:14", "n": "", "vs": [[14, "أبلغتهم كلمتك، فأبغضهم العالم لأنهم ليسوا من العالم."]]}, {"l": "Joh 17:15", "n": "", "vs": [[15, "وأنا لا أطلب أن تأخذهم من العالم، بل أن تحفظهم من الشرير."]]}, {"l": "Rom 12:2", "n": "", "vs": [[2, "ولا تتكيفوا مع هذا العالم، بل تغيروا بتجديد الذهن، لتميزوا ما هي إرادة الله الصالحة المقبولة الكاملة."]]}, {"l": "Gal 1:4", "n": "", "vs": [[4, "الذي بذل نفسه من أجل خطايانا لكي ينقذنا من العالم الحاضر الشرير، وفقا لمشيئة إلهنا وأبينا."]]}, {"l": "Eph 2:2", "n": "", "vs": [[2, "التي كنتم تسلكون فيها حسب مسرى هذا العالم، تابعين رئيس قوات الهواء، ذلك الروح العامل الآن في أبناء العصيان،"]]}, {"l": "2Ti 4:10", "n": "", "vs": [[10, "لأن ديماس، إذ أحب الحياة الحاضرة، تركني وذهب إلى مدينة تسالونيكي. أما كريسكيس، فقد ذهب إلى مقاطعة غلاطية، وتيطس إلى دلماطية"]]}, {"l": "1Jo 5:19", "n": "", "vs": [[19, "ونحن واثقون أيضا بأننا من الله، وأن العالم كله خاضع لسيطرة إبليس الشرير."]]}], "kwAr": "في العصر الحاضر", "noteAr": ""}], "arS": [["وهي ", []], ["تعلمنا", ["G3811"]], [" أن ", []], ["نقطع علاقتنا", ["G720"]], [" ", []], ["بالإباحية", ["G763"]], [" ", []], ["والشهوات", ["G1939"]], [" ", []], ["العالمية", ["G2886"]], ["، وأن ", []], ["نحيا", ["G2198"]], [" في ", []], ["العصر", ["G165"]], [" ", []], ["الحاضر", ["G3568"]], [" حياة ", []], ["التعقل", ["G4996"]], [" ", []], ["والبر", ["G1346"]], [" ", []], ["والتقوى", ["G2153"]], ["،", []]]}, {"c": 2, "v": 13, "text": "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،", "groups": [{"kw": "Looking", "raw": "1Co_1:7; Phi_3:20,Phi_3:21; 2Ti_4:8; 2Pe_3:12-14", "note": "", "refs": [{"l": "1Co 1:7", "n": "", "vs": [[7, "حتى إنكم لا تحتاجون بعد إلى أية موهبة فيما تتوقعون ظهور ربنا يسوع المسيح علنا."]]}, {"l": "Phi 3:20", "n": "", "vs": [[20, "أما نحن، فإن وطننا في السماوات التي منها ننتظر عودة مخلصنا الرب يسوع المسيح،"]]}, {"l": "Phi 3:21", "n": "", "vs": [[21, "الذي سيحول جسدنا الوضيع إلى صورة مطابقة لجسده المجيد، وفقا لعمل قدرته على إخضاع كل شيء لنفسه."]]}, {"l": "2Ti 4:8", "n": "", "vs": [[8, "إنما ينتظرني الآن إكليل البر المحفوظ لي، والذي سيهبه لي الرب الديان العادل في ذلك اليوم؛ ولن يوهب لي وحدي، بل أيضا لجميع الذين يحبون ظهوره."]]}, {"l": "2Pe 3:12-14", "n": "", "vs": [[12, "منتظرين «يوم الله» الأبدي وطالبين حلوله بسرعة. ففي ذلك اليوم، تنحل السماوات ملتهبة، وتذوب العناصر محترقة."], [13, "إلا أننا، وفقا لوعد الرب، ننتظر سماوات جديدة وأرضا جديدة، حيث يسكن البر."], [14, "فبينما تنتظرون إتمام هذا الوعد، أيها الأحباء، اجتهدوا أن يجدكم الرب في سلام، خالين من الدنس والعيب."]]}], "kwAr": "فيما ننتظر", "noteAr": ""}, {"kw": "blessed", "raw": "Tit_1:2, Tit_3:7; Act_24:15; Rom_5:5, Rom_8:24, Rom_8:25, Rom_15:13; Col_1:5, Col_1:23, Col_1:27; 2Th_2:16; Heb_6:18, Heb_6:19; 1Pe_1:3; 1Jo_3:3", "note": "", "refs": [{"l": "Tit 1:2", "n": "", "vs": [[2, "في رجاء الحياة الأبدية، التي وعد بها الله المنزه عن الكذب، من قبل أزمنة الأزل،"]]}, {"l": "Tit 3:7", "n": "", "vs": [[7, "حتى إذا تبررنا بنعمته، نصير ورثة، وفقا لرجائنا بالحياة الأبدية."]]}, {"l": "Act 24:15", "n": "", "vs": [[15, "ولي بالله ما لهم من رجاء ينتظرون تحقيقه: وهو أن القيامة ستحدث للأموات، الأبرار منهم والأشرار."]]}, {"l": "Rom 5:5", "n": "", "vs": [[5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."]]}, {"l": "Rom 8:24", "n": "", "vs": [[24, "فإننا قد خلصنا، إنما بالرجاء؛ ولكن الرجاء متى رأيناه لا يكون رجاء؛ فما يراه الإنسان لماذا يرجوه بعد؟"]]}, {"l": "Rom 8:25", "n": "", "vs": [[25, "ولكن، إن كنا نرجو ما لا نراه، فبالصبر نتوقعه."]]}, {"l": "Rom 15:13", "n": "", "vs": [[13, "فليملأكم إله الرجاء كل فرح وسلام في إيمانكم حتى تزدادوا رجاء بقوة الروح القدس."]]}, {"l": "Col 1:5", "n": "", "vs": [[5, "بسبب الرجاء المحفوظ لكم في السماوات، الرجاء الذي سمعتم به سابقا في كلمة الحق التي في الإنجيل"]]}, {"l": "Col 1:23", "n": "", "vs": [[23, "على أن تثبتوا فعلا في الإيمان، مؤسسين وراسخين وغير متحولين عن رجاء الإنجيل الذي سمعتموه والذي بشر به للخليقة كلها تحت السماء، وله صرت أنا بولس خادما."]]}, {"l": "Col 1:27", "n": "", "vs": [[27, "الذين أراد الله أن يعلن لهم كم هو غني مجد هذا السر بين الأمم: إنه المسيح فيكم، وهو رجاء المجد؛"]]}, {"l": "2Th 2:16", "n": "", "vs": [[16, "وليت ربنا يسوع المسيح نفسه، والله أبانا، الذي أحبنا ووهبنا بنعمته راحة أبدية ورجاء صالحا،"]]}, {"l": "Heb 6:18", "n": "", "vs": [[18, "فاستنادا إلى وعد الله وقسمه، وهما أمران ثابتان لا يتغيران ويستحيل أن يكذب الله فيهما، نحصل على تشجيع قوي، بعدما التجأنا إلى التمسك بالرجاء الموضوع أمامنا."]]}, {"l": "Heb 6:19", "n": "", "vs": [[19, "هذا الرجاء هو لنا بمثابة مرساة أمينة ثابتة تشد نفوسنا إلى ما وراء الحجاب السماوي."]]}, {"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}, {"l": "1Jo 3:3", "n": "", "vs": [[3, "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر."]]}], "kwAr": "رجائنا السعيد", "noteAr": ""}, {"kw": "the glorious", "raw": "Job_19:25-27; Isa_25:9; Mat_16:27, Mat_25:31, Mat_26:64; Mar_8:38, Mar_14:62; 1Ti_6:13, 1Ti_6:14; Heb_9:28; 2Co_4:4, 2Co_4:6 *Gr: Col_3:4; 2Ti_4:1, 2Ti_4:8; 1Pe_1:7; 1Jo_3:2; Rev_1:7", "note": "", "refs": [{"l": "Job 19:25-27", "n": "", "vs": [[25, "أما أنا فإني موقن أن فادي حي، وأنه لابد في النهاية أن يقوم على الأرض."], [26, "وبعد أن يفنى جلدي، فإني بذاتي أعاين الله ."], [27, "الذي أشاهده لنفسي فتنظره عيناي وليس عينا آخر، قد فنيت كليتاي شوقا في داخلي."]]}, {"l": "Isa 25:9", "n": "", "vs": [[9, "ويقولون في ذلك اليوم: «ها هو إلهنا الذي انتظرناه فخلصنا. هذا هو الرب الذي انتظرناه نبتهج ونفرح بخلاصه»."]]}, {"l": "Mat 16:27", "n": "", "vs": [[27, "فإن ابن الإنسان سوف يعود في مجد أبيه مع ملائكته، فيجازي كل واحد حسب أعماله."]]}, {"l": "Mat 25:31", "n": "", "vs": [[31, "وعندما يعود ابن الإنسان في مجده ومعه جميع ملائكته، فإنه يجلس على عرش مجده،"]]}, {"l": "Mat 26:64", "n": "", "vs": [[64, "فأجابه يسوع: «أنت قلت! وأقول لكم أيضا إنكم منذ الآن سوف ترون ابن الإنسان جالسا عن يمين القدرة ثم آتيا على سحب السماء!»"]]}, {"l": "Mar 8:38", "n": "", "vs": [[38, "فإن أي من يستحي بي وبكلامي في هذا الجيل الفاسق الخاطيء، به يستحي ابن الإنسان عندما يعود في مجد أبيه مع الملائكة المقدسين»."]]}, {"l": "Mar 14:62", "n": "", "vs": [[62, "فقال يسوع: «أنا هو. وسوف ترون ابن الإنسان جالسا عن يمين القدرة، ثم آتيا على سحب السماء! »"]]}, {"l": "1Ti 6:13", "n": "", "vs": [[13, "وأوصيك، أمام الله الذي يحيي كل شيء، والمسيح يسوع الذي شهد أمام بيلاطس البنطي بالاعتراف الحسن،"]]}, {"l": "1Ti 6:14", "n": "", "vs": [[14, "أن تحفظ الوصية خالية من العيب واللوم إلى يوم ظهور ربنا يسوع المسيح علنا."]]}, {"l": "Heb 9:28", "n": "", "vs": [[28, "كذلك المسيح أيضا: مات مرة واحدة حاملا خطايا كثيرين، مقربا نفسه (لله) عوضا عنهم. ولا بد أن يعود إلى الظهور. لا ليعالج الخطايا، بل ليحقق الخلاص النهائي لجميع منتظريه!"]]}, {"l": "2Co 4:4", "n": "", "vs": [[4, "الذين أعمى إله هذا العالم أذهانهم حتى لا يضيء لهم نور الإنجيل المختص بمجد المسيح الذي هو صورة الله."]]}, {"l": "2Co 4:6", "n": "*Gr:", "vs": [[6, "فإن الله ، الذي أمر أن يشرق نور من الظلام، هو الذي جعل النور يشرق في قلوبنا، لإشعاع معرفة مجد الله المتجلي في وجه المسيح."]]}, {"l": "Col 3:4", "n": "", "vs": [[4, "فعندما يظهر المسيح، وهو حياتنا، عندئذ تظهرون أنتم أيضا معه في المجد."]]}, {"l": "2Ti 4:1", "n": "", "vs": [[1, "أطلب منك في حضرة الله والمسيح الذي سيدين الأحياء والأموات، بعودته العلنية وملكوته،"]]}, {"l": "2Ti 4:8", "n": "", "vs": [[8, "إنما ينتظرني الآن إكليل البر المحفوظ لي، والذي سيهبه لي الرب الديان العادل في ذلك اليوم؛ ولن يوهب لي وحدي، بل أيضا لجميع الذين يحبون ظهوره."]]}, {"l": "1Pe 1:7", "n": "", "vs": [[7, "إلا أن غاية هذه التجارب هي اختبار حقيقة إيمانكم. فكما تختبر النار الذهب وتنقيه، تختبر التجارب حقيقة إيمانكم، وهو أثمن جدا من الذهب الفاني. وهكذا، يكون إيمانكم مدعاة مدح وإكرام وتمجيد لكم، عندما يعود يسوع المسيح ظاهرا بمجده."]]}, {"l": "1Jo 3:2", "n": "", "vs": [[2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"]]}, {"l": "Rev 1:7", "n": "", "vs": [[7, "ها هو آت مع السحاب! ستراه عيون الجميع، حتى أولئك الذين طعنوه، وتنوح بسببه قبائل الأرض كلها! نعم، آمين!"]]}], "kwAr": "الظهور العلني لمجد", "noteAr": ""}, {"kw": "our", "raw": "Tit_3:4, Tit_3:6; 2Pe_3:18; 1Jo_4:14", "note": "", "refs": [{"l": "Tit 3:4", "n": "", "vs": [[4, "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،"]]}, {"l": "Tit 3:6", "n": "", "vs": [[6, "الذي سكبه علينا بغنى بيسوع المسيح مخلصنا."]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}, {"l": "1Jo 4:14", "n": "", "vs": [[14, "ونحن أنفسنا نشهد أن الآب قد أرسل الابن مخلصا للعالم، لأننا رأيناه بعيوننا."]]}], "kwAr": "إلهنا ومخلصنا العظيم", "noteAr": ""}], "arS": [["فيما ", []], ["ننتظر", ["G4327"]], [" تحقيق ", []], ["رجائنا", ["G1680"]], [" ", []], ["السعيد", ["G3107"]], ["، ثم ", []], ["الظهور", ["G2015"]], [" العلني ", []], ["لمجد", ["G1391"]], [" ", []], ["إلهنا", ["G2316"]], [" ", []], ["ومخلصنا", ["G4990", "G2257"]], [" ", []], ["العظيم", ["G3173"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], ["،", []]]}, {"c": 2, "v": 14, "text": "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة.", "groups": [{"kw": "gave", "raw": "Mat_20:28; Joh_6:51, Joh_10:15; Gal_1:4, Gal_2:20, Gal_3:13; Eph_5:2, Eph_5:23-27; 1Ti_1:15, 1Ti_2:6; Heb_9:14; 1Pe_3:18; Rev_1:5, Rev_5:9", "note": "", "refs": [{"l": "Mat 20:28", "n": "", "vs": [[28, "فهكذا ابن الإنسان: قد جاء لا ليخدم، بل ليخدم ويبذل نفسه فدية عن كثيرين. »"]]}, {"l": "Joh 6:51", "n": "", "vs": [[51, "أنا الخبز الحي الذي نزل من السماء. إن أكل أحد من هذا الخبز يحيا إلى الأبد. والخبز الذي أقدمه أنا، هو جسدي، أبذله من أجل أن يحيا العالم»."]]}, {"l": "Joh 10:15", "n": "", "vs": [[15, "مثلما يعرفني الآب وأنا أعرفه. وأنا أبذل حياتي فدى خرافي."]]}, {"l": "Gal 1:4", "n": "", "vs": [[4, "الذي بذل نفسه من أجل خطايانا لكي ينقذنا من العالم الحاضر الشرير، وفقا لمشيئة إلهنا وأبينا."]]}, {"l": "Gal 2:20", "n": "", "vs": [[20, "مع المسيح صلبت، وفيما بعد لا أحيا أنا بل المسيح يحيا في. أما الحياة التي أحياها الآن في الجسد، فإنما أحياها بالإيمان في ابن الله، الذي أحبني وبذل نفسه عني."]]}, {"l": "Gal 3:13", "n": "", "vs": [[13, "إن المسيح حررنا بالفداء من لعنة الشريعة، إذ صار لعنة عوضا عنا، لأنه قد كتب: «ملعون كل من علق على خشبة»،"]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "Eph 5:23-27", "n": "", "vs": [[23, "فإن الزوج هو رأس الزوجة كما أن المسيح أيضا هو رأس الكنيسة (جسده)، وهو نفسه مخلص الجسد."], [24, "فكما أن الكنيسة قد أخضعت للمسيح، فكذلك الزوجات أيضا لأزواجهن، في كل شيء."], [25, "أيها الأزواج، أحبوا زوجاتكم مثلما أحب المسيح الكنيسة وبذل نفسه لأجلها،"], [26, "لكي يقدسها مطهرا إياها بغسل الماء، بالكلمة،"], [27, "حتى يزفها إلى نفسه كنيسة بهية لا يشوبها عيب أو تجعد أو أية نقيصة مشابهة بل تكون مقدسة خالية من العيوب."]]}, {"l": "1Ti 1:15", "n": "", "vs": [[15, "ما أصدق هذا القول، وما أجدره بالتصديق الكلي: إن المسيح يسوع قد جاء إلى العالم ليخلص الخاطئين، وأنا أولهم!"]]}, {"l": "1Ti 2:6", "n": "", "vs": [[6, "الذي بذل نفسه فدية عوضا عن الجميع. هذه شهادة تؤدى في أوقاتها الخاصة،"]]}, {"l": "Heb 9:14", "n": "", "vs": [[14, "فكم بالأحرى دم المسيح الذي قدم نفسه لله بروح أزلي ذبيحة لا عيب فيها، يطهر ضمائرنا من الأعمال الميتة لنعبد الله الحي."]]}, {"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}, {"l": "Rev 1:5", "n": "", "vs": [[5, "ومن يسوع المسيح الشاهد الأمين، بكر القائمين من بين الأموات، ملك ملوك الأرض، ذاك الذي بدافع محبته لنا مات لأجلنا فغسلنا بدمه من خطايانا،"]]}, {"l": "Rev 5:9", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"]]}], "kwAr": "بذل نفسه لأجلنا", "noteAr": ""}, {"kw": "that", "raw": "Gen_48:16; Psa_130:8; Eze_36:25; Mat_1:21; Rom_11:26, Rom_11:27", "note": "", "refs": [{"l": "Gen 48:16", "n": "", "vs": [[16, "الملاك الذي أنقذني من كل شر، يبارك الغلامين، وليدع عليهما اسمي واسما أبوي إبراهيم وإسحق، وليكثرا كثيرا في الأرض»."]]}, {"l": "Psa 130:8", "n": "", "vs": [[8, "وهو يفدي إسرائيل من جميع آثامه."]]}, {"l": "Eze 36:25", "n": "", "vs": [[25, "وأرش عليكم ماء نقيا فتطهرون من كل نجاستكم ومن كل أصنامكم،"]]}, {"l": "Mat 1:21", "n": "", "vs": [[21, "فستلد ابنا، وأنت تسميه يسوع، لأنه هو الذي يخلص شعبه من خطاياهم»."]]}, {"l": "Rom 11:26", "n": "", "vs": [[26, "وهكذا، سوف يخلص جميع إسرائيل، وفقا لما قد كتب: «إن المنقذ سيطلع من صهيون ويرد الإثم عن يعقوب."]]}, {"l": "Rom 11:27", "n": "", "vs": [[27, "وهذا هو العهد مني لهم حين أزيل خطاياهم»."]]}], "kwAr": "لكي يفتدينا من كل إثم", "noteAr": ""}, {"kw": "purify", "raw": "Mal_3:3; Mat_3:12; Act_15:9; Heb_9:14; Jam_4:8; 1Pe_1:22; 1Jo_3:2", "note": "", "refs": [{"l": "Mal 3:3", "n": "", "vs": [[3, "فيجلس ممحصا ومنقيا للفضة ليطهر أبناء لاوي ويمحصهم كالفضة والذهب، حتى يقربوا للرب تقدمات بقلوب طاهرة."]]}, {"l": "Mat 3:12", "n": "", "vs": [[12, "فهو يحمل المذرى بيده، وسينقي بيدره تماما: فيجمع قمحه إلى المخزن، وأما التبن فيحرقه بنار لا تطفأ! »"]]}, {"l": "Act 15:9", "n": "", "vs": [[9, "فهو لم يفرق بيننا وبينهم في شيء، إذ طهر بالإيمان قلوبهم."]]}, {"l": "Heb 9:14", "n": "", "vs": [[14, "فكم بالأحرى دم المسيح الذي قدم نفسه لله بروح أزلي ذبيحة لا عيب فيها، يطهر ضمائرنا من الأعمال الميتة لنعبد الله الحي."]]}, {"l": "Jam 4:8", "n": "", "vs": [[8, "اقتربوا إلى الله فيقترب إليكم. أيها الخاطئون نظفوا أيديكم، وياأصحاب الرأيين طهروا قلوبكم."]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}, {"l": "1Jo 3:2", "n": "", "vs": [[2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"]]}], "kwAr": "ويطهرنا", "noteAr": ""}, {"kw": "unto", "raw": "Act_15:14; Rom_14:7, Rom_14:8; 2Co_5:14, 2Co_5:15", "note": "", "refs": [{"l": "Act 15:14", "n": "", "vs": [[14, "»استمعوا لي أيها الإخوة: أخبر كم سمعان كيف تفقد الله منذ البداية غير اليهود ليتخذ من بينهم شعبا يحمل اسمه؛"]]}, {"l": "Rom 14:7", "n": "", "vs": [[7, "فلا أحد منا يحيا لنفسه، ولا أحد يموت لنفسه."]]}, {"l": "Rom 14:8", "n": "", "vs": [[8, "فإن حيينا، فللرب نحيا؛ وإن متنا فللرب نموت. فسواء حيينا أم متنا، فإنما نحن للرب."]]}, {"l": "2Co 5:14", "n": "", "vs": [[14, "فإن محبة المسيح تسيطر علينا، وقد حكمنا بهذا: مادام واحد قد مات عوضا عن الجميع، فمعنى ذلك أن الجميع ماتوا؛"]]}, {"l": "2Co 5:15", "n": "", "vs": [[15, "وهو قد مات عوضا عن الجميع حتى لا يعيش الأحياء في ما بعد لأنفسهم بل للذي مات عوضا عنهم ثم قام."]]}], "kwAr": "لنفسه", "noteAr": ""}, {"kw": "peculiar", "raw": "Exo_15:16, Exo_19:5, Exo_19:6; Deu_7:6, Deu_14:2, Deu_26:18; Psa_135:4; 1Pe_2:9", "note": "", "refs": [{"l": "Exo 15:16", "n": "", "vs": [[16, "يسودهم الخوف والرعدة وبقدرة ذراعك يجمدون كالحجارة حتى يعبر شعبك يارب، حتى يعبر شعبك الذي اشتريته."]]}, {"l": "Exo 19:5", "n": "", "vs": [[5, "لذلك إن أطعتم عهدي، تكونوا لي ملكا خاصا من بين جميع الشعوب، لأن لي كل الأرض."]]}, {"l": "Exo 19:6", "n": "", "vs": [[6, "وتكونون لي مملكة كهنة وأمة مقدسة. هذا هو الكلام الذي تخاطب به بني إسرائيل»."]]}, {"l": "Deu 7:6", "n": "", "vs": [[6, "لأنكم شعب مقدس للرب إلهكم. فإياكم قد اختار الرب إلهكم من بين جميع شعوب الأرض لتكونوا شعبه الخاص."]]}, {"l": "Deu 14:2", "n": "", "vs": [[2, "لأنكم شعب مقدس للرب إلهكم، وقد اختاركم من بين شعوب الأرض كافة لتكونوا له شعبا خاصا."]]}, {"l": "Deu 26:18", "n": "", "vs": [[18, "كما أعلن الرب اليوم أنكم تكونون له شعبا خاصا، حسب وعده لكم، وأن عليكم طاعة وصاياه جميعها،"]]}, {"l": "Psa 135:4", "n": "", "vs": [[4, "لأن الرب قد اختار يعقوب لنفسه، واتخذ إسرائيل شعبا خاصا له."]]}, {"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}], "kwAr": "شعبا خاصا", "noteAr": ""}, {"kw": "zealous", "raw": "Tit_2:7, Tit_3:8; Num_25:13; Act_9:36; Eph_2:10; 1Ti_2:10, 1Ti_6:18; Heb_10:24; 1Pe_2:12", "note": "", "refs": [{"l": "Tit 2:7", "n": "", "vs": [[7, "جاعلا من نفسك في كل شيء قدوة للأعمال الصالحة، مظهرا في تعليمك النقاوة والوقار"]]}, {"l": "Tit 3:8", "n": "", "vs": [[8, "صادق هذا القول! وأريد أن تقرر هذه الأمور قرارا حاسما، حتى يهتم الذين آمنوا بالله بأن يجتهدوا في الأعمال الصالحة. هذه الأمور حسنة ونافعة للناس."]]}, {"l": "Num 25:13", "n": "", "vs": [[13, "فيكون له ولنسله من بعده ميثاق كهنوت أبدي، لأنه غار لله وكفر عن الإسرائيليين»."]]}, {"l": "Act 9:36", "n": "", "vs": [[36, "وكان في مدينة يافا تلميذة اسمها طابيثا، ومعنى اسمها: غزالة، كان يشغلها دائما فعل الخير ومساعدة الفقراء."]]}, {"l": "Eph 2:10", "n": "", "vs": [[10, "فإننا نحن تحفة الله، وقد خلقنا في المسيح يسوع لأعمال صالحة أعدها سلفا لنسلك فيها."]]}, {"l": "1Ti 2:10", "n": "", "vs": [[10, "بل بما يليق بنساء يعترفن علنا بأنهن يعشن في تقوى الله، بالأعمال الصالحة!"]]}, {"l": "1Ti 6:18", "n": "", "vs": [[18, "وأن يفعلوا خيرا، ويكونوا أغنياء بالأعمال الصالحة، ويوزعوا بسخاء، ويكونوا على استعداد دائم لإشراك الآخرين في خيراتهم."]]}, {"l": "Heb 10:24", "n": "", "vs": [[24, "وعلى كل واحد منا أن ينتبه للآخرين، لنحث بعضنا بعضا على المحبة والأعمال الصالحة."]]}, {"l": "1Pe 2:12", "n": "", "vs": [[12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالحة يمجدون الله في يوم الافتقاد."]]}], "kwAr": "يجتهد بحماسة", "noteAr": ""}], "arS": [["الذي ", []], ["بذل", ["G1325"]], [" ", []], ["نفسه", ["G1438"]], [" ", []], ["لأجلنا", ["G5228"]], [" لكي ", []], ["يفتدينا", ["G3084"]], [" من ", [
