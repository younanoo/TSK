": 1, "text": "ذكر المؤمنين أن يخضعوا للحكام والسلطات، ويطيعوا القانون، ويكونوا مستعدين لكل عمل صالح،", "groups": [{"kw": "Put", "raw": "Isa_43:26; 1Ti_4:6; 2Ti_1:6; 2Pe_1:12, 2Pe_3:1, 2Pe_3:2; Jud_1:5", "note": "", "refs": [{"l": "Isa 43:26", "n": "", "vs": [[26, "هيا إلى المحاكمة، واعرض علي دعواك، لتتبرر"]]}, {"l": "1Ti 4:6", "n": "", "vs": [[6, "إن بسطت هذه الأمور أمام الإخوة، كنت خادما صالحا للمسيح يسوع، متغذيا بكلام الإيمان والتعليم الصالح الذي اتبعته تماما."]]}, {"l": "2Ti 1:6", "n": "", "vs": [[6, "لهذا السبب أنبهك أن تلهب نار موهبة الله التي فيك بوضع يدي عليك."]]}, {"l": "2Pe 1:12", "n": "", "vs": [[12, "لذلك أنوي أن أذكركم دائما بهذه الأمور، وإن كنتم عالمين بها، وراسخين في الحق الذي عندكم."]]}, {"l": "2Pe 3:1", "n": "", "vs": [[1, "أيها الأحباء، أنا الآن أكتب إليكم رسالتي الثانية. وفي كلتا الرسالتين، أقصد أن أنبه أذهانكم الصافية، مذكرا إياكم بحقائق تعرفونها."]]}, {"l": "2Pe 3:2", "n": "", "vs": [[2, "وغايتي أن تتذكروا الأقوال التي أعلنها الأنبيا ء القديسون قديما، وكذلك وصية الرب والمخلص، تلك الوصية التي نقلها إليكم الرسل."]]}, {"l": "Jud 1:5", "n": "", "vs": [[5, "فالآن، أريد أن أذكركم بأمور تعرفونها. فأنتم تعرفون أن الرب، بعدما أنقذ الشعب من مصر، عاد فأهلك الذين لم يؤمنوا من ذلك الشعب."]]}], "kwAr": "ذكر المؤمنين", "noteAr": ""}, {"kw": "to be subject", "raw": "Deu_17:12; Pro_24:21; Ecc_8:2-5, Ecc_10:4; Jer_27:17; Mat_22:21, Mat_23:2, Mat_23:3; Rom_13:1-7; 1Ti_2:2; 1Pe_2:13-17", "note": "", "refs": [{"l": "Deu 17:12", "n": "", "vs": [[12, "ومن يرفض متمردا تنفيذ حكم الكاهن الماثل هناك لخدمة الرب إلهكم، أو القاضي، فإنه يقتل. وبذلك يستأصل الشر من إسرائيل."]]}, {"l": "Pro 24:21", "n": "", "vs": [[21, "ياابني اتق الرب والملك، ولا تعاشر المتقلبين،"]]}, {"l": "Ecc 8:2-5", "n": "", "vs": [[2, "أقول لك: أطع كلام الملك، ولاسيما من أجل يمين الله الذي أقسمت به."], [3, "لا تسرع في الاختفاء من حضرته، ولا تتشبث بقضية سيئة لأنه يصنع ما يشاء،"], [4, "إذ تنطوي كلمة الملك على سلطان. ومن يقدر أن يقول له: ماذا تفعل؟"], [5, "من يطع الأمر لا يلق أذى، وقلب الحكيم يدرك الوقت المناسب وأسلوب القضاء."]]}, {"l": "Ecc 10:4", "n": "", "vs": [[4, "إذا ثار غضب الحاكم عليك فلا تهجر مكانك، فإن الهدوء يسكن السخط على خطايا عظيمة."]]}, {"l": "Jer 27:17", "n": "", "vs": [[17, "لا تصغوا لهم، بل اخدموا ملك بابل واحيوا، فلماذا تتحول هذه المدينة إلى أطلال؟"]]}, {"l": "Mat 22:21", "n": "", "vs": [[21, "أجابوه: «للقيصر!» فقال لهم: «إذن، أعطوا ما للقيصر للقيصر، وما لله لله»"]]}, {"l": "Mat 23:2", "n": "", "vs": [[2, "وقال: «اعتلى الكتبة والفريسيون كرسي موسى:"]]}, {"l": "Mat 23:3", "n": "", "vs": [[3, "فافعلوا كل ما يقولونه لكم واعملوا به. ولكن لا تعملوا مثل ما يعملون: لأنهم يقولون ولا يفعلون،"]]}, {"l": "Rom 13:1-7", "n": "", "vs": [[1, "على كل نفس أن تخضع للسلطات الحاكمة. فلا سلطة إلا من عند الله، والسلطات القائمة مرتبة من قبل الله."], [2, "حتى إن من يقاوم السلطة، يقاوم ترتيب الله، والمقاومون سيجلبون العقاب على أنفسهم."], [3, "فإن الحكام لا يخافهم من يفعل الصلاح بل من يفعل الشر. أفترغب إذن في أن تكون غير خائف من السلطة؟ اعمل ما هو صالح، فتكون ممدوحا عندها،"], [4, "لأنها خادمة الله لك لأجل الخير. أما إن كنت تعمل الشر فخف، لأن السلطة لا تحمل السيف عبثا، إذ إنها خادمة الله، وهي التي تنتقم لغضبه ممن يفعل الشر."], [5, "ولذلك، فمن الضروري أن تخضعوا، لا اتقاء للغضب فقط، بل مراعاة للضمير أيضا."], [6, "فلهذا السبب تدفعون الضرائب أيضا، لأن رجال السلطة هم خدام لله يواظبون على هذا العمل بعينه."], [7, "فأدوا لكل واحد حقه: الضريبة لصاحب الضريبة والجزية لصاحب الجزية، والاحترام لصاحب الاحترام، والإكرام لصاحب الإكرام."]]}, {"l": "1Ti 2:2", "n": "", "vs": [[2, "ولأجل الملوك وأصحاب السلطة، لكي نعيش حياة مطمئنة هادئة كلية التقوى والرصانة."]]}, {"l": "1Pe 2:13-17", "n": "", "vs": [[13, "فإكراما للرب، اخضعوا لكل نظام يدير شؤون الناس: للملك، باعتباره صاحب السلطة العليا،"], [14, "وللحكام، باعتبارهم ممثلي الملك الذين يعاقبون المذنبين ويمدحون الصالحين."], [15, "فإن هذه هي إرادة الله: أن تفعلوا الخير دائما، فتفحموا جهالة الناس الأغبياء!"], [16, "تصرفوا كأحرار حقا، لا كالذين يتخذون من الحرية ستارا لارتكاب الشر بل باعتبار أنكم عبيد لله."], [17, "أكرموا جميع الناس. أحبوا الإخوة. خافوا الله . أكرموا الملك."]]}], "kwAr": "أن يخضعوا للحكام", "noteAr": ""}, {"kw": "to be ready", "raw": "Tit_3:8, Tit_3:14, Tit_2:14; 1Co_15:58; Gal_6:9, Gal_6:10; Eph_2:10; Phi_1:11; Col_1:10; 1Ti_5:10; 2Ti_2:21; Heb_13:21", "note": "", "refs": [{"l": "Tit 3:8", "n": "", "vs": [[8, "صادق هذا القول! وأريد أن تقرر هذه الأمور قرارا حاسما، حتى يهتم الذين آمنوا بالله بأن يجتهدوا في الأعمال الصالحة. هذه الأمور حسنة ونافعة للناس."]]}, {"l": "Tit 3:14", "n": "", "vs": [[14, "وليتعلم ذوونا أيضا أن يمارسوا أعمالا حسنة، لسد الحاجات الضرورية، لكي لا يكونوا عديمي الثمر."]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "1Co 15:58", "n": "", "vs": [[58, "إذن، ياإخوتي الأحباء، كونوا راسخين غير متزحزحين، كثيري الاجتهاد في عمل الرب دائما، عالمين أن جهدكم في الرب ليس عبثا!"]]}, {"l": "Gal 6:9", "n": "", "vs": [[9, "لأننا، متى حان الأوان، سنحصد، إن كنا لا نتراخى."]]}, {"l": "Gal 6:10", "n": "", "vs": [[10, "فمادامت لنا الفرصة إذن، فلنعمل الخير للجميع، وخصوصا لأهل الإيمان."]]}, {"l": "Eph 2:10", "n": "", "vs": [[10, "فإننا نحن تحفة الله، وقد خلقنا في المسيح يسوع لأعمال صالحة أعدها سلفا لنسلك فيها."]]}, {"l": "Phi 1:11", "n": "", "vs": [[11, "كاملين في ثمار البر الآتية بيسوع المسيح، لمجد الله وحمده."]]}, {"l": "Col 1:10", "n": "", "vs": [[10, "لكي تسلكوا سلوكا لائقا بالرب ومرضيا في كل شيء، منتجين الثمر في كل عمل صالح ونامين في معرفة الله إلى التمام،"]]}, {"l": "1Ti 5:10", "n": "", "vs": [[10, "ويكون مشهودا لها بالأعمال الصالحة، كأن تكون قد ربت الأولاد، وأضافت الغرباء، وغسلت أقدام القديسين، وأسعفت المتضايقين، ومارست كل عمل صالح!"]]}, {"l": "2Ti 2:21", "n": "", "vs": [[21, "إذن الذي ينفصل عن هذه الأخيرة، مطهرا نفسه، يكون إناء للاستعمال الرفيع، مقدسا، نافعا لرب البيت، متأهبا لكل عمل صالح."]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}], "kwAr": "مستعدين لكل عمل صالح", "noteAr": ""}], "arS": [["ذكر", ["G5279"]], [" المؤمنين أن ", []], ["يخضعوا", ["G5293"]], [" ", []], ["للحكام", ["G746"]], [" ", []], ["والسلطات", ["G1849"]], ["، ", []], ["ويطيعوا القانون", ["G3980"]], ["، ويكونوا ", []], ["مستعدين", ["G2092"]], [" ", []], ["لكل", ["G3956"]], [" ", []], ["عمل", ["G2041"]], [" ", []], ["صالح", ["G18"]], ["،", []]]}, {"c": 3, "v": 2, "text": "ولا يقولوا سوءا في أحد، ولا يكونوا مخاصمين، بل لطفاء يعاملون الجميع بوداعة تامة.", "groups": [{"kw": "speak", "raw": "Psa_140:11; Pro_6:19; Act_23:5; 1Co_6:10; 2Co_12:20; Eph_4:31; 1Ti_3:11; Jam_4:11; 1Pe_2:1, 1Pe_3:10, 1Pe_4:4; 2Pe_2:10; Jud_1:8, Jud_1:10", "note": "", "refs": [{"l": "Psa 140:11", "n": "", "vs": [[11, "لا تدع ذا اللسان السليط يثبت في الأرض: فالشر يتصيد رجل الظلم ليهلكه."]]}, {"l": "Pro 6:19", "n": "", "vs": [[19, "وشاهد زور ينفث كذبا، ورجل يزرع خصومات بين الإخوة."]]}, {"l": "Act 23:5", "n": "", "vs": [[5, "فأجاب بولس: «لم أكن أعرف أيها الإخوة أنه رئيس كهنة فقد جاء في الكتاب: لا تشتم رئيس شعبك!»"]]}, {"l": "1Co 6:10", "n": "", "vs": [[10, "ولا السراقون ولا الطماعون ولا السكيرون ولا الشتامون ولا المغتصبون."]]}, {"l": "2Co 12:20", "n": "", "vs": [[20, "فإني أخشى أن آتي إليكم فأجدكم في حالة لا أريدها وتجدوني في حالة لا تريدونها! أي أن يكون بينكم كثير من النزاع والحسد والحقد والتحزب والتجريح والنميمة والتكبر والبلبلة."]]}, {"l": "Eph 4:31", "n": "", "vs": [[31, "انزعوا عنكم كل حقد ونقمة وغضب وصخب وسباب وكل شر."]]}, {"l": "1Ti 3:11", "n": "", "vs": [[11, "كذلك يجب أن تكون النساء أيضا رزينات، غير نمامات، نبيهات، أمينات في كل شيء."]]}, {"l": "Jam 4:11", "n": "", "vs": [[11, "وياإخوتي، لا تذموا بعضكم بعضا. فمن يفعل هذا ويحكم على أخيه، يطعن في شريعة الله ويحكم عليها. فإن كنت تحكم على الشريعة، لا تكون عاملا بها بل تجعل نفسك قاضيا لها."]]}, {"l": "1Pe 2:1", "n": "", "vs": [[1, "لذلك، تخلصوا من كل أثر للشر والخداع والرياء والحسد والذم."]]}, {"l": "1Pe 3:10", "n": "", "vs": [[10, "فمن أراد أن يتمتع بحياة سعيدة وأيام طيبة، فليمنع لسانه عن الشر وشفتيه عن كلام الغش."]]}, {"l": "1Pe 4:4", "n": "", "vs": [[4, "ورفاقكم في تلك العيشة سابقا يستغربون أنكم لا تركضون معهم إلى فيض هذه الخلاعة، ويجرحون سمعتكم."]]}, {"l": "2Pe 2:10", "n": "", "vs": [[10, "وما أشد العقاب، وبخاصة على الذين ينجرفون وراء الميول الجسدية، مستجيبين لشهوة النجاسة، ومحتقرين سيادة الله! ثم إنهم وقحون، معجبون بأنفسهم، لا يخافون أن يتكلموا بالشتم والإهانة على أصحاب الأمجاد."]]}, {"l": "Jud 1:8", "n": "", "vs": [[8, "ومع ذلك، فإن أولئك المعلمين المتوهمين يسيرون في الطريق التي سار فيها أهل تلك المدن. إذ يلوثون أجسادهم بالنجاسة، ويحتقرون السيادة الإلهية، ويتكلمون بالإهانة على الكائنات المجيدة!"]]}, {"l": "Jud 1:10", "n": "", "vs": [[10, "ولكن هؤلاء المعلمين يتكلمون كلاما مهينا على أمور لا يعرفونها. وأما ما يفهمونه بالغريزة، كالحيوانات غير العاقلة، فإنهم به يدمرون أنفسهم."]]}], "kwAr": "ولا يقولوا سوءا", "noteAr": ""}, {"kw": "no", "raw": "Pro_19:19, Pro_25:24; 1Ti_3:3; 2Ti_2:24, 2Ti_2:25", "note": "", "refs": [{"l": "Pro 19:19", "n": "", "vs": [[19, "الجامح الغضب يدفع ثمن جموحه، وإن كبحته أو اعترضته فإنك تزيده سوءا"]]}, {"l": "Pro 25:24", "n": "", "vs": [[24, "الإقامة في ركن سطح خير من مشاطرة بيت مع زوجة نكدة."]]}, {"l": "1Ti 3:3", "n": "", "vs": [[3, "لا مدمنا للخمر ولا عنيفا؛ بل لطيفا، غير متعود الخصام، غير مولع بالمال،"]]}, {"l": "2Ti 2:24", "n": "", "vs": [[24, "وعبد الرب يجب ألا يتشاجر، بل أن يكون مترفقا تجاه الجميع، قادرا على التعليم، يتحمل المشقات بصبر،"]]}, {"l": "2Ti 2:25", "n": "", "vs": [[25, "ويؤدب بالوداعة مقاومي الإيمان، عسى أن يمنحهم الله التوبة، فيعرفوا الحق بالتمام،"]]}], "kwAr": "ولا يكونوا مخاصمين", "noteAr": ""}, {"kw": "gentle", "raw": "2Sa_22:36; Isa_40:11; Mat_11:29; 2Co_10:1; Gal_5:22, Gal_6:1; Eph_4:2; Phi_4:5; Col_3:12, Col_3:13; 1Th_2:7; 2Ti_2:24, 2Ti_2:25; Jam_1:19, Jam_1:20, Jam_3:17; 1Pe_3:8", "note": "", "refs": [{"l": "2Sa 22:36", "n": "", "vs": [[36, "تعطيني ترس خلاصك، وبلطفك تعظمني."]]}, {"l": "Isa 40:11", "n": "", "vs": [[11, "يرعى قطيعه كراع، ويجمع الحملان بذراعه، وفي أحضانه يحملها ويقود المرضعات برفق."]]}, {"l": "Mat 11:29", "n": "", "vs": [[29, "احملوا نيري عليكم، وتتلمذوا على يدي، لأني وديع ومتواضع القلب، فتجدوا الراحة لنفوسكم."]]}, {"l": "2Co 10:1", "n": "", "vs": [[1, "ولكني أتوسل إليكم بوداعة المسيح وحلمه، أنا بولس «المتواضع وأنا حاضر بينكم، والجريء عليكم وأنا غائب عنكم»،"]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Gal 6:1", "n": "", "vs": [[1, "أيها الإخوة، إن سقط أحدكم في خطأ ما فمثل هذا أصلحوه أنتم الروحيين بروح وداعة. واحذر أنت لنفسك لئلا تجرب أيضا."]]}, {"l": "Eph 4:2", "n": "", "vs": [[2, "بكل تواضع ووداعة وطول بال، محتملين بعضكم بعضا في المحبة،"]]}, {"l": "Phi 4:5", "n": "", "vs": [[5, "ليكن طول بالكم معروفا لدى الناس جميعا. إن الرب قريب."]]}, {"l": "Col 3:12", "n": "", "vs": [[12, "فباعتباركم جماعة مختارة من الله، قديسين محبوبين، البسوا دائما عواطف الحنان واللطف والتواضع والوداعة وطول البال،"]]}, {"l": "Col 3:13", "n": "", "vs": [[13, "محتملين بعضكم بعضا، ومسامحين بعضكم بعضا. إن كان لأحدكم شكوى على آخر، كما سامحكم الرب، هكذا افعلوا أنتم أيضا."]]}, {"l": "1Th 2:7", "n": "", "vs": [[7, "مع أن لنا الحق في أن نفرض أنفسنا عليكم باعتبارنا رسلا للمسيح. ولكننا كنا مترفقين بكم كأم مرضع تحنو على أولادها."]]}, {"l": "2Ti 2:24", "n": "", "vs": [[24, "وعبد الرب يجب ألا يتشاجر، بل أن يكون مترفقا تجاه الجميع، قادرا على التعليم، يتحمل المشقات بصبر،"]]}, {"l": "2Ti 2:25", "n": "", "vs": [[25, "ويؤدب بالوداعة مقاومي الإيمان، عسى أن يمنحهم الله التوبة، فيعرفوا الحق بالتمام،"]]}, {"l": "Jam 1:19", "n": "", "vs": [[19, "لذلك، ياإخوتي الأحباء، على كل واحد منكم أن يكون مسرعا إلى الإصغاء، غير متسرع في الكلام، بطيء الغضب."]]}, {"l": "Jam 1:20", "n": "", "vs": [[20, "لأن الإنسان، إذا غضب، لا يعمل الصلاح الذي يريده الله ."]]}, {"l": "Jam 3:17", "n": "", "vs": [[17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}, {"l": "1Pe 3:8", "n": "", "vs": [[8, "والخلاصة، كونوا جميعا متحدين في الرأي، متعاطفين بعضكم مع بعض، مبادلين أحدكم الآخر المحبة الأخوية، شفوقين، متواضعين."]]}], "kwAr": "لطفاء", "noteAr": ""}, {"kw": "all men", "raw": "1Co_9:19; Gal_6:10; 1Th_5:14, 1Th_5:15; 1Pe_2:17", "note": "", "refs": [{"l": "1Co 9:19", "n": "", "vs": [[19, "فمع أني حر من الجميع، جعلت نفسي عبدا للجميع، لأكسب أكبر عدد ممكن منهم."]]}, {"l": "Gal 6:10", "n": "", "vs": [[10, "فمادامت لنا الفرصة إذن، فلنعمل الخير للجميع، وخصوصا لأهل الإيمان."]]}, {"l": "1Th 5:14", "n": "", "vs": [[14, "إلا أننا نناشدكم، أيها الإخوة، أن تعظوا الفوضويين، وتشددوا فاقدي العزم، وتساندوا الضعفاء، وتعاملوا الجميع بطول البال."]]}, {"l": "1Th 5:15", "n": "", "vs": [[15, "حذار أن يبادل أحدكم شر غيره بشر مثله بل اسعوا دائما إلى الخير في معاملتكم بعضكم لبعض وللآخرين جميعا."]]}, {"l": "1Pe 2:17", "n": "", "vs": [[17, "أكرموا جميع الناس. أحبوا الإخوة. خافوا الله . أكرموا الملك."]]}], "kwAr": "الجميع", "noteAr": ""}], "arS": [["ولا ", []], ["يقولوا سوءا", ["G987"]], [" في ", []], ["أحد", ["G3367"]], ["، ولا يكونوا ", []], ["مخاصمين", ["G269"]], ["، بل ", []], ["لطفاء", ["G1933"]], [" ", []], ["يعاملون", ["G1731"]], [" ", []], ["الجميع", ["G3956"]], [" ", []], ["بوداعة", ["G4236"]], [" ", []], ["تامة", ["G3956"]], [".", []]]}, {"c": 3, "v": 3, "text": "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض.", "groups": [{"kw": "we", "raw": "Rom_3:9-20; 1Co_6:9-11; Eph_2:1-3; Col_1:21, Col_3:7; 1Pe_4:1-3", "note": "", "refs": [{"l": "Rom 3:9-20", "n": "", "vs": [[9, "فماذا إذن؟ أنحن اليهود أفضل؟ لا، على الإطلاق! فإننا، في ما سبق، قد اتهمنا اليهود واليونانيين بكونهم جميعا تحت الخطيئة،"], [10, "كما قد كتب:"], [11, "ليس من يبحث عن الله."], [12, "جميع الناس قد ضلوا، وصاروا كلهم بلا نفع. ليس من يمارس الصلاح، لا ولا واحد."], [13, "حناجرهم قبور مفتوحة؛ ألسنتهم أدوات للمكر؛ شفاههم تخفي سم الأفاعي القاتلة؛"], [14, "أفواههم مملوءة لعنة ومرارة،"], [15, "أقدامهم سريعة إلى سفك الدماء؛"], [16, "في طرقهم الخراب والشقاء؛"], [17, "أما طريق السلام فلم يعرفوه؛"], [18, "ومخافة الله ليست نصب عيونهم»."], [19, "ونحن نعلم أن كل ما تقوله الشريعة إنما تخاطب به الذين هم تحت الشريعة، لكي يسد كل فم ويقع العالم كله تحت دينونة من الله."], [20, "فإن أحدا من البشر لا يتبرر أمامه بالأعمال المطلوبة في الشريعة. إذ إن الشريعة هي لإظهار الخطيئة."]]}, {"l": "1Co 6:9-11", "n": "", "vs": [[9, "أما تعلمون أن الظالمين لن يرثوا ملكوت الله؟ لا تضلوا: فإن ملكوت الله لن يرثه الزناة ولا عابدو الأصنام ولا الفاسقون ولا المتخنثون ولا مضاجعو الذكور"], [10, "ولا السراقون ولا الطماعون ولا السكيرون ولا الشتامون ولا المغتصبون."], [11, "وهكذا كان بعضكم، إلا أنكم قد اغتسلتم، بل تقدستم، بل تبررتم، باسم الرب يسوع المسيح وبروح إلهنا."]]}, {"l": "Eph 2:1-3", "n": "", "vs": [[1, "وأنتم كنتم في السابق أمواتا بذنوبكم وخطاياكم،"], [2, "التي كنتم تسلكون فيها حسب مسرى هذا العالم، تابعين رئيس قوات الهواء، ذلك الروح العامل الآن في أبناء العصيان،"], [3, "الذين بينهم نحن أيضا كنا نسلك سابقا في شهوات جسدنا، عاملين ما يريده الجسد والأفكار، وكنا بالطبيعة أولاد الغضب كالآخرين أيضا."]]}, {"l": "Col 1:21", "n": "", "vs": [[21, "وأنتم، يامن كنتم في الماضي أجانب وأعداء في الفكر، بأعمالكم الشريرة،"]]}, {"l": "Col 3:7", "n": "", "vs": [[7, "وفيها سلكتم في الماضي، حين كنتم تعيشون فيها."]]}, {"l": "1Pe 4:1-3", "n": "", "vs": [[1, "فبما أن المسيح قد تحمل الآلام الجسمية لأجلكم، سلحوا أنفسكم بالاستعداد دائما لتحمل الآلام. فإن من يتحمل الآلام الجسمية، يكون قد قاطع الخطيئة."], [2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."], [3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}], "kwAr": "فإننا نحن أيضا", "noteAr": ""}, {"kw": "foolish", "raw": "Pro_1:22, Pro_1:23, Pro_8:5, Pro_9:6", "note": "", "refs": [{"l": "Pro 1:22", "n": "", "vs": [[22, "«إلى متى أيها الجهال تظلون مولعين بالسذاجة، والساخرون تسرون بالسخرية، والحمقى بكراهية المعرفة؟"]]}, {"l": "Pro 1:23", "n": "", "vs": [[23, "إن رجعتم عند توبيخي وتبتم، أسكب عليكم روحي وأعلمكم كلماتي."]]}, {"l": "Pro 8:5", "n": "", "vs": [[5, "أيها الحمقى، تعلموا الفطنة، وأيها الأغبياء اكتسبوا فهما."]]}, {"l": "Pro 9:6", "n": "", "vs": [[6, "انبذوا الجهالة فتحيوا، واسلكوا سبيل الفهم»."]]}], "kwAr": "جهالا", "noteAr": ""}, {"kw": "disobedient", "raw": "Mat_21:29; Act_9:1-6, Act_26:19, Act_26:20; Eph_2:2; 1Pe_1:14", "note": "", "refs": [{"l": "Mat 21:29", "n": "", "vs": [[29, "فأجاب: لا أريد. ولكنه بعد ذلك ندم وذهب."]]}, {"l": "Act 9:1-6", "n": "", "vs": [[1, "أما شاول فكان لايزال يفور بالتهديد والقتل على تلاميذ الرب. فذهب إلى رئيس الكهنة،"], [2, "وطلب منه رسائل إلى مجامع اليهود في دمشق لتسهيل القبض على أتباع هذا الطريق من الرجال والنساء، حيثما يجدهم، ليسوقهم مقيدين إلى أورشليم."], [3, "وفيما هو منطلق إلى دمشق، وقد اقترب منها، لمع حوله فجأة نور من السماء،"], [4, "فوقع إلى الأرض وسمع صوتا يقول له: «شاول! شاول! لماذا تضطهدني؟»"], [5, "فسأل: «من أنت ياسيد؟» فجاءه الجواب: «أنا يسوع الذي أنت تضطهده، صعب عليك أن ترفس المناخس»."], [6, "فقال وهو مرتعد ومتحير؛ «يارب ماذا تريد أن أفعل؟» فقال له الرب: «قم، وادخل المدينة فيقال لك ما يجب أن تفعله»."]]}, {"l": "Act 26:19", "n": "", "vs": [[19, "ومن ذلك الحين لم أعاند الرؤيا السماوية، أيها الملك أغريباس."]]}, {"l": "Act 26:20", "n": "", "vs": [[20, "فبشرت أهل دمشق أولا، ثم أهل أورشليم ومنطقة اليهودية كلها، ثم الأجانب. فدعوت الجميع إلى التوبة والرجوع إلى الله، والقيام بأعمال تليق بالتوبة."]]}, {"l": "Eph 2:2", "n": "", "vs": [[2, "التي كنتم تسلكون فيها حسب مسرى هذا العالم، تابعين رئيس قوات الهواء، ذلك الروح العامل الآن في أبناء العصيان،"]]}, {"l": "1Pe 1:14", "n": "", "vs": [[14, "وبما أنكم صرتم أولادا لله مطيعين له، فلا تعودوا إلى مجاراة الشهوات التي كانت تسيطر عليكم سابقا في أيام جهلكم."]]}], "kwAr": "غير مطيعين", "noteAr": ""}, {"kw": "deceived", "raw": "Isa_44:20; Oba_1:3; Luk_21:8; Gal_6:3; Jam_1:26; Rev_12:9, Rev_13:14", "note": "", "refs": [{"l": "Isa 44:20", "n": "", "vs": [[20, "لكأنه يأكل الرماد! يجري وراء سراب ويعجز عن إنقاذ نفسه أو الاعتراف أن الصنم الذي يمسكه بيده هو محض ضلال!"]]}, {"l": "Oba 1:3", "n": "", "vs": [[3, "قد غرتك كبرياء قلبك أيها المقيم في شقوق الصخور، ومساكنه في القمم، القائل في قلبه: من يهوي بي إلى الأرض؟"]]}, {"l": "Luk 21:8", "n": "", "vs": [[8, "فقال: «انتبهوا! لا تضلوا! فإن كثيرين سيأتون باسمي قائلين إني أنا هو وإن الزمان قد اقترب: فلا تتبعوهم!"]]}, {"l": "Gal 6:3", "n": "", "vs": [[3, "فإن ظن أحد أنه شيء، وهو في الواقع لا شيء، فإنما يخدع نفسه."]]}, {"l": "Jam 1:26", "n": "", "vs": [[26, "وإن ظن أحد أنه متدين، وهو لا يلجم لسانه، فإنه يغش قلبه، وديانته غير نافعة!"]]}, {"l": "Rev 12:9", "n": "", "vs": [[9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."]]}, {"l": "Rev 13:14", "n": "", "vs": [[14, "فخدع سكان الأرض بالآيات التي كان يقوم بها في حضور الوحش الأول. وأمر سكان الأرض أن يقيموا تمثالا للوحش الأول الذي كان قد جرح جرحا مميتا ولكنه عاش!"]]}], "kwAr": "تائهين في الضلال", "noteAr": ""}, {"kw": "serving", "raw": "Joh_8:34; Rom_6:17, Rom_6:22", "note": "", "refs": [{"l": "Joh 8:34", "n": "", "vs": [[34, "أجابهم يسوع: «الحق الحق أقول لكم: إن من يرتكب الخطيئة يكون عبدا لها."]]}, {"l": "Rom 6:17", "n": "", "vs": [[17, "إنما الشكر لله، لأنكم كنتم عبيدا للخطيئة ولكن أطعتم من القلب صيغة التعليم الذي وضعتم في عهدته."]]}, {"l": "Rom 6:22", "n": "", "vs": [[22, "أما الآن، وقد حررتم من الخطيئة وصرتم عبيدا لله، فإن لكم ثمركم للقداسة، والعاقبة هي الحياة الأبدية."]]}], "kwAr": "عبيدا يخدمون الشهوات", "noteAr": ""}, {"kw": "living", "raw": "Rom_1:29-31; 2Co_12:20; 2Ti_3:2, 2Ti_3:3", "note": "", "refs": [{"l": "Rom 1:29-31", "n": "", "vs": [[29, "إذ قد امتلأوا من كل إثم وشر وجشع وخبث، وشحنوا حسدا وقتلا وخصاما ومكرا وسوءا. وهم ثرثارون،"], [30, "مغتابون، كارهون لله، شتامون، متكبرون، متفاخرون، مخترعون للشرور، غير طائعين للوالدين."], [31, "لا فهم عندهم، ولا أمانة، ولا حنان، ولا رحمة."]]}, {"l": "2Co 12:20", "n": "", "vs": [[20, "فإني أخشى أن آتي إليكم فأجدكم في حالة لا أريدها وتجدوني في حالة لا تريدونها! أي أن يكون بينكم كثير من النزاع والحسد والحقد والتحزب والتجريح والنميمة والتكبر والبلبلة."]]}, {"l": "2Ti 3:2", "n": "", "vs": [[2, "إذ يكون الناس محبين لأنفسهم، محبين للمال، متكبرين، مباهين بأنفسهم، شتامين، غير مطيعين لوالديهم، ناكرين للجميل، دنسين،"]]}, {"l": "2Ti 3:3", "n": "", "vs": [[3, "متحجري العواطف، غير صفوحين، نمامين، جامحي الأهواء، شرسين غير محبين للصلاح،"]]}], "kwAr": "نعيش في الخبث والحسد", "noteAr": ""}, {"kw": "hateful", "raw": "Psa_36:2; Rev_18:2", "note": "", "refs": [{"l": "Psa 36:2", "n": "", "vs": [[2, "فإنه يتملق نفسه (ليقنعها) أن خطيئته الممقوتة لن تكتشف وتدان."]]}, {"l": "Rev 18:2", "n": "", "vs": [[2, "وصاح بأعلى صوته: «سقطت، سقطت بابل العظمى، وصارت وكرا للشياطين ومأوى لكل روح نجس ولكل طائر نجس مكروه،"]]}], "kwAr": "مكروهين", "noteAr": ""}], "arS": [["فإننا ", []], ["نحن", ["G2249"]], [" أيضا كنا في ", []], ["الماضي", ["G4218"]], [" ", []], ["جهالا", ["G453"]], ["، ", []], ["غير مطيعين", ["G545"]], ["، ", []], ["تائهين في الضلال", ["G4105"]], ["، عبيدا ", []], ["يخدمون", ["G1398"]], [" ", []], ["الشهوات", ["G1939"]], [" ", []], ["واللذات", ["G2237"]], [" ", []], ["المختلفة", ["G4164"]], ["، ", []], ["نعيش", ["G1236"]], [" في ", []], ["الخبث", ["G2549"]], [" ", []], ["والحسد", ["G5355"]], ["، ", []], ["مكروهين", ["G4767"]], ["، ", []], ["وكارهين", ["G3404"]], [" ", []], ["بعضنا لبعض", ["G240"]], [".", []]]}, {"c": 3, "v": 4, "text": "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،", "groups": [{"kw": "the kindness", "raw": "Tit_2:11; Rom_5:20,Rom_5:21; Eph_2:4-10", "note": "", "refs": [{"l": "Tit 2:11", "n": "", "vs": [[11, "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت."]]}, {"l": "Rom 5:20", "n": "", "vs": [[20, "وأما الشريعة فقد أدخلت لتظهر كثرة المعصية. ولكن، حيث كثرت الخطيئة، تتوافر النعمة أكثر جدا،"]]}, {"l": "Rom 5:21", "n": "", "vs": [[21, "حتى إنه كما ملكت الخطيئة بالموت، فكذلك أيضا تملك النعمة على أساس البر مؤدية إلى الحياة الأبدية بيسوع المسيح ربنا."]]}, {"l": "Eph 2:4-10", "n": "", "vs": [[4, "أما الله ، وهو غني في الرحمة، فبسبب محبته العظيمة التي أحبنا بها،"], [5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"], [6, "وأقامنا معه وأجلسنا معه في الأماكن السماوية في المسيح يسوع."], [7, "وذلك كي يعرض في الدهور القادمة غنى نعمته الفائق في لطفه علينا في المسيح يسوع."], [8, "فإنكم بالنعمة مخلصون، بالإيمان، وهذا ليس منكم. إنه هبة من الله،"], [9, "لا على أساس الأعمال، حتى لا يفتخر أحد."], [10, "فإننا نحن تحفة الله، وقد خلقنا في المسيح يسوع لأعمال صالحة أعدها سلفا لنسلك فيها."]]}], "kwAr": "لطف", "noteAr": ""}, {"kw": "love", "raw": "or, pity", "note": "or, pity", "refs": [], "kwAr": "ومحبته للناس", "noteAr": "أو: رأفة."}, {"kw": "God", "raw": "Tit_1:3, Tit_2:10; 1Ti_1:1, 1Ti_2:3, 1Ti_4:10", "note": "", "refs": [{"l": "Tit 1:3", "n": "", "vs": [[3, "ثم بين كلمته في أوانها المعين: بالبشارة التي وضعت أمانة بين يدي بموجب أمر مخلصنا الله …"]]}, {"l": "Tit 2:10", "n": "", "vs": [[10, "ولا سارقين، بل مظهرين أمانة كلية صالحة، لكي يزينوا في كل شيء تعليم مخلصنا الله."]]}, {"l": "1Ti 1:1", "n": "", "vs": [[1, "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"]]}, {"l": "1Ti 2:3", "n": "", "vs": [[3, "فإن هذا الأمر جيد ومقبول في نظر الله مخلصنا،"]]}, {"l": "1Ti 4:10", "n": "", "vs": [[10, "فإننا لأجل هذا نعمل باجتهاد ونقاسي التعيير، لأننا وضعنا رجاءنا في الله الحي، حافظ جميع الناس، وبالأخص المؤمنين."]]}], "kwAr": "مخلصنا الله", "noteAr": ""}, {"kw": "appeared", "raw": "Tit_2:11; 2Ti_1:10; Heb_9:26", "note": "", "refs": [{"l": "Tit 2:11", "n": "", "vs": [[11, "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت."]]}, {"l": "2Ti 1:10", "n": "", "vs": [[10, "والتي أعلنت الآن بظهور مخلصنا يسوع المسيح الذي سحق الموت وأنار الحياة والخلود بالإنجيل"]]}, {"l": "Heb 9:26", "n": "", "vs": [[26, "وإلا لكان يجب أن يموت المسيح متألما مرات كثيرة منذ تأسيس العالم! ولكنه الآن، عند انتهاء الأزمنة، ظهر مرة واحدة ليبطل قوة الخطيئة بتقديم نفسه ذبيحة لله."]]}], "kwAr": "ظهر", "noteAr": ""}], "arS": [["ولكن، لما ", []], ["ظهر", ["G2014"]], [" ", []], ["لطف", ["G5544"]], [" ", []], ["مخلصنا", ["G4990", "G2257"]], [" ", []], ["الله", ["G2316"]], ["، ", []], ["ومحبته للناس", ["G5363"]], ["،", []]]}, {"c": 3, "v": 5, "text": "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،", "groups": [{"kw": "by works", "raw": "Job_9:20, Job_15:14, Job_25:4; Psa_143:2; Isa_57:12; Luk_10:27-29; Rom_3:20,Rom_3:28; Rom_4:5, Rom_9:11, Rom_9:16, Rom_9:30, Rom_11:6; Gal_2:16, Gal_3:16-21; Eph_2:4, Eph_2:8, Eph_2:9; 2Ti_1:9", "note": "", "refs": [{"l": "Job 9:20", "n": "", "vs": [[20, "إن ظننت نفسي بريئا، فإن فمي يحكم علي، وإن كنت كاملا فإنه يجرمني."]]}, {"l": "Job 15:14", "n": "", "vs": [[14, "من هو الإنسان حتى يزكو أو مولود المرأة حتى يتبرر؟"]]}, {"l": "Job 25:4", "n": "", "vs": [[4, "فكيف يتبرر الإنسان عند الله، وكيف يزكو مولود المرأة؟"]]}, {"l": "Psa 143:2", "n": "", "vs": [[2, "لا تحاكم عبدك، فلن يتبرر أمامك إنسان."]]}, {"l": "Isa 57:12", "n": "", "vs": [[12, "سأتحدث عن بركم وأعمالكم، ولكنها لن تجديكم نفعا."]]}, {"l": "Luk 10:27-29", "n": "", "vs": [[27, "فأجاب: «أحب الرب إلهك بكل قلبك وكل نفسك وكل قدرتك وكل فكرك، وأحب قريبك كنفسك»."], [28, "فقال له: «جوابك صحيح. فإن عملت بهذا، تحيا!»"], [29, "لكنه إذ كان راغبا في تبرير نفسه، سأل يسوع: «ومن هو قريبي؟»"]]}, {"l": "Rom 3:20", "n": "", "vs": [[20, "فإن أحدا من البشر لا يتبرر أمامه بالأعمال المطلوبة في الشريعة. إذ إن الشريعة هي لإظهار الخطيئة."]]}, {"l": "Rom 3:28", "n": "", "vs": [[28, "لأننا قد استنتجنا أن الإنسان يتبرر بالإيمان، بمعزل عن الأعمال المطلوبة في الشريعة."]]}, {"l": "Rom 4:5", "n": "", "vs": [[5, "وإنما يؤمن بمن يبرر الأثيم، فإن إيمانه يحسب له برا."]]}, {"l": "Rom 9:11", "n": "", "vs": [[11, "ولم يكن الولدان قد ولدا بعد ولا فعلا خيرا أو شرا، وذلك كي يبقى قصد الله من جهة الاختيار"]]}, {"l": "Rom 9:16", "n": "", "vs": [[16, "إذا، لا يتعلق الأمر برغبة الإنسان ولا بسعيه، وإنما برحمة الله فقط."]]}, {"l": "Rom 9:30", "n": "", "vs": [[30, "فما هي خلاصة القول؟ إن الأمم الذين لم يكونوا يسعون وراء البر، قد بلغوا البر، ولكنه البر القائم على أساس الإيمان."]]}, {"l": "Rom 11:6", "n": "", "vs": [[6, "ولكن، بما أن ذلك قد تم بالنعمة، فليس بعد على أساس الأعمال، وإلا فليست النعمة نعمة بعد."]]}, {"l": "Gal 2:16", "n": "", "vs": [[16, "ولكننا، إذ علمنا أن الإنسان لا يتبرر على أساس الأعمال المطلوبة في الشريعة بل فقط بالإيمان بيسوع المسيح، آمنا نحن أيضا بالمسيح يسوع، لنتبرر على أساس الإيمان به، لا على أساس أعمال الشريعة، لأنه على أعمال الشريعة لا يبرر أي إنسان."]]}, {"l": "Gal 3:16-21", "n": "", "vs": [[16, "وقد وجهت الوعود لإبراهيم ونسله، ولا يقول «وللأنسال» كأنه يشير إلى كثيرين، بل يشير إلى واحد، إذ يقول «ولنسلك»، يعني المسيح."], [17, "فما أقوله هو هذا: إن عهدا سبق أن أقره الله لا تنقضه الشريعة التي جاءت بعده بأربع مئة وثلاثين سنة، وكأنها تلغي الوعد."], [18, "فلو كان الميراث يتم على مبدأ الشريعة، لما كان الأمر متعلقا بعد بالوعد. غير أن الله ، بالوعد، أنعم بالميراث على إبراهيم."], [19, "فلماذا الشريعة إذن؟ إنها فقط أضيفت إظهارا للمعاصي، إلى أن يجيء «النسل» الذي قطع له الوعد، وقد رتبت بملائكة وعلى يد وسيط."], [20, "ولكن، عندما يصدر الوعد من جانب واحد، فلا لزوم لوسيط. والواعد هنا هو الله وحده."], [21, "فهل تناقض الشريعة وعود الله؟ حاشا! فلو أعطيت شريعة قادرة أن تحيي، لكان البر بالحقيقة على مبدأ الشريعة."]]}, {"l": "Eph 2:4", "n": "", "vs": [[4, "أما الله ، وهو غني في الرحمة، فبسبب محبته العظيمة التي أحبنا بها،"]]}, {"l": "Eph 2:8", "n": "", "vs": [[8, "فإنكم بالنعمة مخلصون، بالإيمان، وهذا ليس منكم. إنه هبة من الله،"]]}, {"l": "Eph 2:9", "n": "", "vs": [[9, "لا على أساس الأعمال، حتى لا يفتخر أحد."]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،"]]}], "kwAr": "لا على أساس أعمال بر", "noteAr": ""}, {"kw": "according", "raw": "Tit_3:4; Psa_62:12, Psa_86:5, Psa_86:15, Psa_130:7; Mic_7:18; Luk_1:50,Luk_1:54, Luk_1:72, Luk_1:78; Eph_1:6, Eph_1:7; Heb_4:16; 1Pe_1:3, 1Pe_2:10", "note": "", "refs": [{"l": "Tit 3:4", "n": "", "vs": [[4, "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،"]]}, {"l": "Psa 62:12", "n": "", "vs": [[12, "لك الرحمة يارب فأنت تجازي كل إنسان بمقتضى عمله."]]}, {"l": "Psa 86:5", "n": "", "vs": [[5, "لأنك أنت يارب طيب وغفور، وكثير الرحمة لجميع الذين يدعونك."]]}, {"l": "Psa 86:15", "n": "", "vs": [[15, "إنما أنت يارب إله رحيم ورؤوف وبطيء الغضب ووافر الرحمة والحق."]]}, {"l": "Psa 130:7", "n": "", "vs": [[7, "ليترج إسرائيل الرب، لأن منه الرحمة والفداء الكثير."]]}, {"l": "Mic 7:18", "n": "", "vs": [[18, "إي إله مثلك يصفح عن الإثم ويعفو عن معصية بقية ميراثه؟ لا يحتفظ إلى الأبد بغضبه لأنه يسر بالرحمة."]]}, {"l": "Luk 1:50", "n": "", "vs": [[50, "ورحمته للذين يتقونه جيلا بعد جيل."]]}, {"l": "Luk 1:54", "n": "", "vs": [[54, "أعان إسرائيل فتاه، متذكرا الرحمة،"]]}, {"l": "Luk 1:72", "n": "", "vs": [[72, "ليتم الرحمة نحو آبائنا ويتذكر عهده المقدس"]]}, {"l": "Luk 1:78", "n": "", "vs": [[78, "بفضل عواطف الرحمة لدى إلهنا، تلك التي تفقدنا بها الفجر المشرق من العلاء،"]]}, {"l": "Eph 1:6", "n": "", "vs": [[6, "بغرض مدح مجد نعمته التي بها أعطانا حظوة لديه في المحبوب:"]]}, {"l": "Eph 1:7", "n": "", "vs": [[7, "ففيه لنا بدمه الفداء، أي غفران الخطايا؛ بحسب غنى نعمته"]]}, {"l": "Heb 4:16", "n": "", "vs": [[16, "فلنتقدم بثقة إلى عرش النعمة، لننال الرحمة ونجد نعمة تعيننا عند الحاجة."]]}, {"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}, {"l": "1Pe 2:10", "n": "", "vs": [[10, "فإنكم في الماضي لم تكونوا شعبا؛ أما الآن، فأنتم «شعب الله وقد كنتم سابقا لا تتمتعون برحمة الله، أما الآن، فإنكم تتمتعون بها!»"]]}], "kwAr": "بموجب رحمته", "noteAr": ""}, {"kw": "washing", "raw": "Joh_3:3-5; 1Co_6:11; Eph_5:26; 1Pe_3:21", "note": "", "refs": [{"l": "Joh 3:3-5", "n": "", "vs": [[3, "فأجابه يسوع: «الحق الحق أقول لك: لا أحد يمكنه أن يرى ملكوت الله إلا إذا ولد من جديد»."], [4, "فسأله نيقوديموس: «كيف يمكن الإنسان أن يولد وهو كبير السن؟ ألعله يستطيع أن يدخل بطن أمه ثانية ثم يولد؟»"], [5, "أجابه يسوع: «الحق الحق أقول لك: لا يمكن أن يدخل أحد ملكوت الله إلا إذا ولد من الماء والروح."]]}, {"l": "1Co 6:11", "n": "", "vs": [[11, "وهكذا كان ": "Joh 14:17", "n": "", "vs": [[17, "وهو روح الحق، الذي لا يقدر العالم أن يتقبله لأنه لا يراه ولا يعرفه، وأما أنتم فتعرفونه لأنه في وسطكم، وسيكون في داخلكم."]]}, {"l": "Joh 16:7", "n": "", "vs": [[7, "ولكني أقول لكم الحق: من الأفضل لكم أن أذهب، لأني إن كنت لا أذهب، لا يأتيكم المعين. ولكني إذا ذهبت أرسله إليكم."]]}, {"l": "Rom 8:2", "n": "", "vs": [[2, "لأن ناموس روح الحياة في المسيح يسوع قد حررني من ناموس الخطيئة ومن الموت."]]}], "kwAr": "بيسوع المسيح مخلصنا", "noteAr": ""}], "arS": [["الذي ", []], ["سكبه", ["G1632"]], [" علينا ", []], ["بغنى", ["G4146"]], [" ", []], ["بيسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [" ", []], ["مخلصنا", ["G4990", "G2257"]], [".", []]]}, {"c": 3, "v": 7, "text": "حتى إذا تبررنا بنعمته، نصير ورثة، وفقا لرجائنا بالحياة الأبدية.", "groups": [{"kw": "being", "raw": "Tit_2:11; Rom_3:24, Rom_3:28, Rom_4:4, Rom_4:16, Rom_5:1, Rom_5:2, Rom_5:15-21, Rom_11:6; 1Co_6:11; Gal_2:16", "note": "", "refs": [{"l": "Tit 2:11", "n": "", "vs": [[11, "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت."]]}, {"l": "Rom 3:24", "n": "", "vs": [[24, "فهم يبررون مجانا، بنعمته، بالفداء بالمسيح يسوع"]]}, {"l": "Rom 3:28", "n": "", "vs": [[28, "لأننا قد استنتجنا أن الإنسان يتبرر بالإيمان، بمعزل عن الأعمال المطلوبة في الشريعة."]]}, {"l": "Rom 4:4", "n": "", "vs": [[4, "إن الذي يعمل، لا تحسب له الأجرة من قبيل النعمة بل من قبيل الدين. أما الذي لا يعمل"]]}, {"l": "Rom 4:16", "n": "", "vs": [[16, "لذلك، فإن الوعد هو على أساس الإيمان ليكون بحسب النعمة، بقصد أن يكون مضمونا للنسل كله: ليس لأهل الشريعة وحدهم، بل أيضا لأهل الإيمان الذي كان لإبراهيم. فإنه أب لنا جميعا،"]]}, {"l": "Rom 5:1", "n": "", "vs": [[1, "فبما أننا قد تبررنا على أساس الإيمان، صرنا في سلام مع الله بربنا يسوع المسيح."]]}, {"l": "Rom 5:2", "n": "", "vs": [[2, "وبه أيضا تم لنا الدخول بالإيمان إلى هذه النعمة التي نقيم فيها الآن؛ ونحن نفتخر برجائنا في التمتع بمجد الله."]]}, {"l": "Rom 5:15-21", "n": "", "vs": [[15, "ولكن مفعول المعصية ليس كمفعول النعمة! فإذا كان الكثيرون بمعصية إنسان واحد قد "vs": [[24, "فإننا قد خلصنا، إنما بالرجاء؛ ولكن الرجاء متى رأيناه لا يكون رجاء؛ فما يراه الإنسان لماذا يرجوه بعد؟"]]}, {"l": "Gal 3:29", "n": "", "vs": [[29, "فإذا كنتم للمسيح، فأنتم إذن نسل إبراهيم وحسب الوعد وارثون."]]}, {"l": "Gal 4:7", "n": "", "vs": [[7, "إذن، أنت لست عبدا بعد الآن، بل أنت ابن. ومادمت ابنا، فقد جعلك الله وريثا أيضا."]]}, {"l": "Heb 6:17", "n": "", "vs": [[17, "ولذلك، لما أراد الله أن يؤكد بصورة قاطعة لوارثي وعده، أن قراره لا يتغير أبدا، ثبته بالقسم."]]}, {"l": "Heb 11:7", "n": "", "vs": [[7, "وبالإيمان نوح، لما أنذره الله عن طريق الوحي بالطوفان الآتي، دفعه خوف الله إلى بناء سفينة ضخمة كانت وسيلة النجاة له ولعائلته، مع أنه لم يكن قد رأى طوفانا من قبل. وبعمله هذا، حكم على العالم وأصبح وارثا للبر القائم على أساس الإيمان."]]}, {"l": "Heb 11:9", "n": "", "vs": [[9, "وبالإيمان، كان يرحل كالغريب من مكان إلى آخر في الأرض التي وعده الله بها، وكأنها أرض غريبة. وكان يسكن في الخيام مع إسحاق ويعقوب، شريكيه في إرث الوعد عينه."]]}, {"l": "Jam 2:5", "n": "", "vs": [[5, "فياإخوتي الأحباء، أما اختار الله الفقراء في نظر الناس ليجعلهم أغنياء في الإيمان، ويعطيهم حق الإرث في الملكوت الذي وعد به محبيه؟"]]}, {"l": "1Pe 3:7", "n": "", "vs": [[7, "وأنتم، أيها الأزواج، إذ تساكنون زوجاتكم عالمين بأنهن أضعف منكم، أكرموهن باعتبارهن شريكات لكم في وراثة نعمة الحياة، لكي لا يعوق صلواتكم شيء."]]}], "kwAr": "نصير ورثة", "noteAr": ""}, {"kw": "hope", "raw": "Tit_1:2, Tit_2:13", "note": "", "refs": [{"l": "Tit 1:2", "n": "", "vs": [[2, "في رجاء الحياة الأبدية، التي وعد بها الله المنزه عن الكذب، من قبل أزمنة الأزل،"]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}], "kwAr": "لرجائنا بالحياة الأبدية", "noteAr": ""}], "arS": [["حتى إذا ", []], ["تبررنا", ["G1344"]], [" ", []], ["بنعمته", ["G5485"]], ["، ", []], ["نصير", ["G1096"]], [" ", []], ["ورثة", ["G2818"]], ["، وفقا ", []], ["لرجائنا", ["G1680"]], [" ", []], ["بالحياة", ["G2222"]], [" ", []], ["الأبدية", ["G166"]], [".", []]]}, {"c": 3, "v": 8, "text": "صادق هذا القول! وأريد أن تقرر هذه الأمور قرارا حاسما، حتى يهتم الذين آمنوا بالله بأن يجتهدوا في الأعمال الصالحة. هذه الأمور حسنة ونافعة للناس.", "groups": [{"kw": "a faithful", "raw": "Tit_1:9; 1Ti_1:15", "note": "", "refs": [{"l": "Tit 1:9", "n": "", "vs": [[9, "ملتصقا بالكلمة الصادقة الموافقة للتعليم، ليكون قادرا على تشجيع المؤمنين بالتعليم الصحيح وعلى إفحام المعارضين."]]}, {"l": "1Ti 1:15", "n": "", "vs": [[15, "ما أصدق هذا القول، وما أجدره بالتصديق الكلي: إن المسيح يسوع قد جاء إلى العالم ليخلص الخاطئين، وأنا أولهم!"]]}], "kwAr": "صادق هذا القول", "noteAr": ""}, {"kw": "that thou", "raw": "Pro_21:28; Act_12:15; 2Co_4:13", "note": "", "refs": [{"l": "Pro 21:28", "n": "", "vs": [[28, "شاهد الزور يهلك، أما أقوال الرجل الحريص على الاستماع فتدوم."]]}, {"l": "Act 12:15", "n": "", "vs": [[15, "فقالوا لها: «أنت تهذين!» ولكنها أكدت لهم الخبر، فقالوا: «لعله ملاك بطرس!»"]]}, {"l": "2Co 4:13", "n": "", "vs": [[13, "وبما أن لنا روح الإيمان عينه، هذا الذي كتب بخصوصه: «آمنت، لذلك تكلمت»، فنحن أيضا نؤمن، ولذلك نتكلم،"]]}], "kwAr": "أن تقرر هذه الأمور", "noteAr": ""}, {"kw": "which", "raw": "Psa_78:22; Joh_5:24, Joh_12:44; Rom_4:5; 1Pe_1:21; 1Jo_5:10-13", "note": "", "refs": [{"l": "Psa 78:22", "n": "", "vs": [[22, "لأنهم لم يؤمنوا بالله ولم يتكلوا على خلاصه."]]}, {"l": "Joh 5:24", "n": "", "vs": [[24, "الحق الحق أقول لكم إن من يسمع كلامي ويؤمن بالذي أرسلني تكون له الحياة الأبدية، ولا يحاكم في اليوم الأخير، لأنه قد انتقل من الموت إلى الحياة."]]}, {"l": "Joh 12:44", "n": "", "vs": [[44, "فقال يسوع بصوت عال: «من يؤمن بي، فهو يؤمن لا بي أنا بل بالذي أرسلني،"]]}, {"l": "Rom 4:5", "n": "", "vs": [[5, "وإنما يؤمن بمن يبرر الأثيم، فإن إيمانه يحسب له برا."]]}, {"l": "1Pe 1:21", "n": "", "vs": [[21, "أنتم الذين تؤمنون بالله بالمسيح الذي أقامه من الموت وأعطاه المجد، حتى يكون الله غاية إيمانكم ورجائكم."]]}, {"l": "1Jo 5:10-13", "n": "", "vs": [[10, "فمن يؤمن بابن الله، يثق في قلبه بصحة هذه الشهادة. أما من لا يصدق الله ، إذ يرفض تصديق الشهادة التي شهد بها لابنه، فهو يتهم الله بالكذب."], [11, "وهذه الشهادة هي أن الله أعطانا حياة أبدية، وأن هذه الحياة هي في ابنه."], [12, "فمن كان له ابن الله كانت له الحياة. ومن لم يكن له ابن الله، لم تكن له الحياة!"], [13, "يامن آمنتم باسم ابن الله، إني كتبت هذا إليكم لكي تعرفوا أن الحياة الأبدية ملك لكم منذ الآن."]]}], "kwAr": "الذين آمنوا بالله", "noteAr": ""}, {"kw": "be", "raw": "Tit_3:1, Tit_3:14, Tit_2:14", "note": "", "refs": [{"l": "Tit 3:1", "n": "", "vs": [[1, "ذكر المؤمنين أن يخضعوا للحكام والسلطات، ويطيعوا القانون، ويكونوا مستعدين لكل عمل صالح،"]]}, {"l": "Tit 3:14", "n": "", "vs": [[14, "وليتعلم ذوونا أيضا أن يمارسوا أعمالا حسنة، لسد الحاجات الضرورية، لكي لا يكونوا عديمي الثمر."]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}], "kwAr": "يهتم", "noteAr": ""}, {"kw": "good", "raw": "Job_22:2, Job_35:7, Job_35:8; Psa_16:2, Psa_16:3; 2Co_9:12-15; Phm_1:11", "note": "", "refs": [{"l": "Job 22:2", "n": "", "vs": [[2, "«أينفع الإنسان الله ؟ إنما الحكيم ينفع نفسه!"]]}, {"l": "Job 35:7", "n": "", "vs": [[7, "وإن كنت بارا فماذا تعطيه؟ أو ماذا يأخذ من يدك؟"]]}, {"l": "Job 35:8", "n": "", "vs": [[8, "إن شرك يؤثر في إنسان نظيرك، وبرك يفيد فقط أبناء الناس."]]}, {"l": "Psa 16:2", "n": "", "vs": [[2, "قلت للرب: أنت سيدي، ولا خير لي بمعزل عنك."]]}, {"l": "Psa 16:3", "n": "", "vs": [[3, "كل بهجتي في قديسي الأرض وأفاضلها."]]}, {"l": "2Co 9:12-15", "n": "", "vs": [[12, "ذلك لأن خدمة الله بهذه الإعانة لا تسد حاجة القديسين وحسب، بل تفيض بشكر كثير لله."], [13, "فإن القديسين، إذ يختبرون هذه الخدمة، يمجدون الله على طاعتكم في الشهادة لإنجيل المسيح وعلى السخاء الطوعي في مشاركتكم لهم وللجميع."], [14, "كما يرفعون الدعاء لأجلكم، متشوقين إليكم، بسبب نعمة الله الفائقة التي ظهرت فيكم."], [15, "فشكرا لله على عطيته المجانية التي تفوق الوصف!"]]}, {"l": "Phm 1:11", "n": "", "vs": [[11, "الذي كان في الماضي غير نافع لك، ولكنه الآن نافع لك ولي."]]}], "kwAr": "حسنة ونافعة", "noteAr": ""}], "arS": [["صادق", ["G4103"]], [" هذا ", []], ["القول", ["G3056"]], ["! ", []], ["وأريد", ["G1014"]], [" أن ", []], ["تقرر", ["G1226"]], [" هذه ", []], ["الأمور", ["G5130"]], [" قرارا حاسما، حتى ", []], ["يهتم", ["G5431"]], [" الذين ", []], ["آمنوا", ["G4100"]], [" ", []], ["بالله", ["G2316"]], [" بأن ", []], ["يجتهدوا", ["G4291"]], [" في ", []], ["الأعمال", ["G2041"]], [" ", []], ["الصالحة", ["G2570"]], [". هذه ", []], ["الأمور", ["G5023"]], [" ", []], ["حسنة", ["G2570"]], [" ", []], ["ونافعة", ["G5624"]], [" ", []], ["للناس", ["G444"]], [".", []]]}, {"c": 3, "v": 9, "text": "أما المسائل السخيفة، وسلاسل النسب، والمخاصمات، والمنازعات حول الشريعة، فتجنبها، لأنها غير نافعة، وباطلة.", "groups": [{"kw": "avoid", "raw": "Tit_1:14; 1Ti_1:3-7, 1Ti_4:7; 2Ti_2:23", "note": "", "refs": [{"l": "Tit 1:14", "n": "", "vs": [[14, "لا يديرون عقولهم إلى خرافات يهودية ووصايا أناس تحولوا عن الحق بعيدا."]]}, {"l": "1Ti 1:3-7", "n": "", "vs": [[3, "كما أوصيتك لما كنت منطلقا إلى مقاطعة مقدونية، (أطلب إليك) أن تبقى في مدينة أفسس، لكي تمنع بعض المعلمين من نشر التعاليم المخالفة للتعليم الصحيح،"], [4, "وتوصي المؤمنين ألا ينشغلوا بالأساطير وسلاسل النسب المتشابكة. فتلك الأمور تثير المجادلات ولا تعمل على تقدم تدبير الله القائم على الإيمان."], [5, "أما الغاية مما أوصيتك به، فهي المحبة النابعة من قلب طاهر وضمير صالح وإيمان خال من الرياء."], [6, "هذه الفضائل قد زاغ عنها بعضهم، فانحرفوا إلى المجادلات الباطلة،"], [7, "راغبين في أن يكونوا أساتذة في الشريعة، وهم لا يفهمون ما يقولون ولا ما يقررون!"]]}, {"l": "1Ti 4:7", "n": "", "vs": [[7, "أما أساطير العجائز المبتذلة، فتجنبها. إنما مرن نفسك في طريق التقوى."]]}, {"l": "2Ti 2:23", "n": "", "vs": [[23, "أما المجادلات الغبية الحمقاء، فتجنبها، عالما أنها تولد المشاجرات."]]}], "kwAr": "فتجنبها", "noteAr": ""}, {"kw": "unprofitable", "raw": "Job_15:3; 1Co_8:1, 1Co_13:2; 2Ti_2:14", "note": "", "refs": [{"l": "Job 15:3", "n": "", "vs": [[3, "فيحتج بكلام أجوف وبأقوال خرقاء؟"]]}, {"l": "1Co 8:1", "n": "", "vs": [[1, "وأما فيما يتعلق بالذبائح المقدمة للأصنام، فنعلم أن المعرفة لجميعنا. غير أن المعرفة تنفخ تكبرا، ولكن المحبة تبني. فمن ظن أنه يعرف شيئا،"]]}, {"l": "1Co 13:2", "n": "", "vs": [[2, "ولو كانت لي موهبة النبوءة، وكنت عالما بجميع الأسرار والعلم كله، وكان عندي الإيمان كله حتى أنقل الجبال، وليس عندي محبة، فلست شيئا!"]]}, {"l": "2Ti 2:14", "n": "", "vs": [[14, "بهذه الأمور ذكر، شاهدا في حضرة الله أن لا تنشأ المجادلات الكلامية، وهي لا تنفع شيئا، غير تخريب سامعيها."]]}], "kwAr": "غير نافعة", "noteAr": ""}], "arS": [["أما ", []], ["المسائل", ["G2214"]], [" ", []], ["السخيفة", ["G3474"]], ["، ", []], ["وسلاسل النسب", ["G1076"]], ["، ", []], ["والمخاصمات", ["G2054"]], ["، ", []], ["والمنازعات", ["G3163"]], [" حول ", []], ["الشريعة", ["G3544"]], ["، ", []], ["فتجنبها", ["G4026"]], ["، لأنها ", []], ["غير نافعة", ["G512"]], ["، ", []], ["وباطلة", ["G3152"]], [".", []]]}, {"c": 3, "v": 10, "text": "وصاحب الهرطقة اقطع العلاقة به بعد إنذاره أولا وثانيا،", "groups": [{"kw": "heretic", "raw": "1Co_11:19; Gal_5:20; 2Pe_2:1", "note": "", "refs": [{"l": "1Co 11:19", "n": "", "vs": [[19, "لأنه لابد من وجود المذاهب بينكم، حتى يبرز الفاضلون فيكم."]]}, {"l": "Gal 5:20", "n": "", "vs": [[20, "وعبادة الأصنام والسحر، والعداوة والنزاع والغيرة والغضب، والتحزب والانقسام والتعصب،"]]}, {"l": "2Pe 2:1", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."]]}], "kwAr": "صاحب الهرطقة", "noteAr": ""}, {"kw": "after", "raw": "Mat_18:15-17; 2Co_13:2", "note": "", "refs": [{"l": "Mat 18:15-17", "n": "", "vs": [[15, "إن أخطأ إليك أخوك، فاذهب إليه وعاتبه بينك وبينه على انفراد. فإذا سمع لك، تكون قد ربحت أخاك."], [16, "وإذا لم يسمع، فخذ معك أخا آخر أو اثنين، حتى يثبت كل أمر بشهادة شاهدين أو ثلاثة."], [17, "فإذا لم يسمع لهما، فاعرض الأمر على الكنيسة. فإذا لم يسمع للكنيسة أيضا، فليكن عندك كالوثني وجابي الضرائب."]]}, {"l": "2Co 13:2", "n": "", "vs": [[2, "سبق لي أن أعلنت، وها أنا أقول مقدما وأنا غائب، كما قلت وأنا حاضر عندكم في المرة الثانية، للذين أخطأوا في الما  هدايا كثيرة، وزودونا عند رحيلنا بما نحتاج إليه في سفرنا."]]}, {"l": "Rom 15:24", "n": "", "vs": [[24, "فعندما أذهب إلى أسبانيا أرجو أن أمر بكم، فأراكم وتسهلون لي متابعة السفر بعد أن أتمتع بلقائكم ولو لفترة قصيرة."]]}, {"l": "1Co 16:11", "n": "", "vs": [[11, "فلا يستخف به أحد، بل سهلوا له السبيل ليعود إلي بسلام، فأنا أنتظر وصوله، مع الإخوة."]]}, {"l": "3Jo 1:6-8", "n": "", "vs": [[6, "وقد شهد هؤلاء الإخوة، أمام الكنيسة، شهادة جميلة لمحبتك. فإنك تفعل حسنا إذا زودتهم بما يحتاجون إليه في السفر. فأنت تعرف أن هذا يرضي الله ،"], [7, "لأن هؤلاء الإخوة قد انطلقوا في سبيل خدمة المسيح، وهم لا يتلقون أي عون من غير المؤمنين."], [8, "فعلينا نحن أن نرحب بأمثال هؤلاء لكي نكون حقا شركاء لهم في خدمة الحق."]]}], "kwAr": "في إطلاق", "noteAr": ""}], "arS": [["اجتهد", ["G4709"]], [" في ", []], ["إطلاق", ["G4311"]], [" ", []], ["زيناس", ["G2211"]], [" ", []], ["المحامي", ["G3544"]], [" ", []], ["وأبلوس", ["G625"]], [" بعد تزويدهما للسفر، حتى لا ", []], ["يحتاجا", ["G3007"]], [" إلى شيء.", []]]}, {"c": 3, "v": 14, "text": "وليتعلم ذوونا أيضا أن يمارسوا أعمالا حسنة، لسد الحاجات الضرورية، لكي لا يكونوا عديمي الثمر.", "groups": [{"kw": "learn", "raw": "Tit_3:8", "note": "", "refs": [{"l": "Tit 3:8", "n": "", "vs": [[8, "صادق هذا القول! وأريد أن تقرر هذه الأمور قرارا حاسما، حتى يهتم الذين آمنوا بالله بأن يجتهدوا في الأعمال الصالحة. هذه الأمور حسنة ونافعة للناس."]]}], "kwAr": "وليتعلم ذوونا", "noteAr": ""}, {"kw": "maintain good works", "raw": "or, profess honest trades, Act_18:3, Act_20:35 *Gr: Eph_4:28; 1Th_2:9; 2Th_3:8", "note": "or, profess honest trades, Act_18:3, Act_20:35 *Gr: Eph_4:28; 1Th_2:9; 2Th_3:8", "refs": [{"l": "Act 18:3", "n": "", "vs": [[3, "وإذ كان من أهل مهنتهما، وهي صناعة الخيام، أقام عندهما وكان يشتغل معهما."]]}, {"l": "Act 20:35", "n": "*Gr:", "vs": [[35, "وقد أظهرت لكم بوضوح كيف يجب أن نبذل الجهد لنساعد المحتاجين، متذكرين كلمات الرب يسوع، إذ قال: الغبطة في العطاء أكثر مما في الأخذ!»"]]}, {"l": "Eph 4:28", "n": "", "vs": [[28, "ومن كان سارقا، فلا يسرق في ما بعد، بل بالأحرى ليكد ويستخدم يديه في عمل شريف ليكون عنده ما يشارك فيه المحتاجين."]]}, {"l": "1Th 2:9", "n": "", "vs": [[9, "فأنتم تذكرون، أيها الإخوة، جهدنا وكدنا، إذ بشرناكم بإنجيل الله ونحن نشتغل ليلا ونهارا لكي لا نكون عبئا ثقيلا على أحد منكم."]]}, {"l": "2Th 3:8", "n": "", "vs": [[8, "ولا أكلنا الخبز من عند أحد مجانا، بل كنا نشتغل بتعب وكد ليل نهار، لكي لا نكون عبئا ثقيلا على أي واحد منكم."]]}], "kwAr": "يمارسوا أعمالا حسنة", "noteAr": "أو: يمارسوا حِرَفًا شريفة؛ وفي اليونانية بهذا المعنى."}, {"kw": "that", "raw": "Isa_61:3; Mat_7:19, Mat_21:19; Luk_13:6-9; Joh_15:8, Joh_15:16; Rom_15:28; Phi_1:11; Phi_4:17; Col_1:10; Heb_6:6-12; 2Pe_1:8", "note": "", "refs": [{"l": "Isa 61:3", "n": "", "vs": [[3, "لأمنح نائحي صهيون تاج جمال بدل الرماد، ودهن السرور بدل النوح، ورداء تسبيح بدل الروح اليائسة، فيدعون أشجار البر وغرس الرب لكي يتمجد."]]}, {"l": "Mat 7:19", "n": "", "vs": [[19, "وكل شجرة لا تثمر ثمرا جيدا، تقطع وتطرح في النار."]]}, {"l": "Mat 21:19", "n": "", "vs": [[19, "وإذ رأى شجرة تين على جانب الطريق اتجه إليها، ولكنه لم يجد عليها إلا الورق، فقال لها: «لا يكن منك ثمر بعد إلى الأبد!» فيبست التينة في الحال."]]}, {"l": "Luk 13:6-9", "n": "", "vs": [[6, "ثم ضرب هذا المثل: «كان عند أحدهم شجرة تين مغروسة في كرمه. فجاءها طلبا للثمر، فما وجد شيئا."], [7, "فقال للمزارع: هذه ثلاث سنين وأنا أقصد هذه التينة طلبا للثمر فلا أجد شيئا: اقطعها، لماذا نتركها تعطل الأرض؟"], [8, "ولكن المزارع أجابه قائلا: ياسيد اتركها هذه السنة أيضا، حتى أنقب التربة من حولها وأضع سمادا."], [9, "فلعلها تنتج ثمرا! وإلا، فبعد ذلك تقطعها!»"]]}, {"l": "Joh 15:8", "n": "", "vs": [[8, "بهذا يتمجد أبي: أن تنتجوا ثمرا كثيرا فتكونون حقا تلاميذي."]]}, {"l": "Joh 15:16", "n": "", "vs": [[16, "ليس أنتم اخترتموني، بل أنا اخترتكم وعينتكم لتنطلقوا وتنتجوا ثمرا ويدوم ثمركم، فيعطيكم الآب كل ما تطلبونه باسمي."]]}, {"l": "Rom 15:28", "n": "", "vs": [[28, "فبعد انتهائي من هذه المهمة، وتسليمي هذا الثمر للقديسين،"]]}, {"l": "Phi 1:11", "n": "", "vs": [[11, "كاملين في ثمار البر الآتية بيسوع المسيح، لمجد الله وحمده."]]}, {"l": "Phi 4:17", "n": "", "vs": [[17, "والواقع أني لا أسعى إلى العطايا، بل أسعى إلى الفائدة المتكاثرة لحسابكم."]]}, {"l": "Col 1:10", "n": "", "vs": [[10, "لكي تسلكوا سلوكا لائقا بالرب ومرضيا في كل شيء، منتجين الثمر في كل عمل صالح ونامين في معرفة الله إلى التمام،"]]}, {"l": "Heb 6:6-12", "n": "", "vs": [[6, "ثم ارتدوا إلى تلك الأسس القديمة، أولئك يستحيل عليهم أن يتجددوا ثانية فيعودوا إلى التوبة. فهم يجنون على أنفسهم إذ يصلبون ابن الله مرة ثانية ويجعلونه عرضة للعار."], [7, "ولا عجب، فالتربة التي تشرب الأمطار النازلة عليها مرارا كثيرة، ثم تنتج نباتا ينفع الذين حرثوها، تنال البركة من الله!"], [8, "ولكنها، إن أخرجت الشوك والعشب البري، تكون مرفوضة وتستحق اللعنة، وما نهايتها إلا الحريق."], [9, "أيها الأحباء، مع أني قصدت تحذيركم بما قلته هنا، فأنا مقتنع بأن خلاصكم أمر لا شك فيه. إذ قد عملتم أعمالا فضلى، ترافق هذا الخلاص."], [10, "وليس الله بظالم حتى ينسى عملكم الجاد في إظهار محبتكم له عن طريق خدمتكم للقديسين إكراما لاسمه، الأمر الذي قمتم به قبلا، وتقومون به الآن!"], [11, "وإنما نتمنى أن يظهر كل واحد منكم اجتهادا مماثلا في المحافظة حتى النهاية على الثقة الكاملة بالرجاء."], [12, "وذلك حتى لا تتكاسلوا، بل تقتدوا بالذين يرثون ما وعد الله به، عن طريق الإيمان والصبر."]]}, {"l": "2Pe 1:8", "n": "", "vs": [[8, "فحين تكون هذه الصفات الطيبة في داخلكم، وتزداد بوفرة، تجعلكم مجتهدين ومثمرين في معرفتكم لربنا يسوع المسيح."]]}], "kwAr": "لكي لا يكونوا عديمي الثمر", "noteAr": ""}], "arS": [["وليتعلم", ["G3129"]], [" ", []], ["ذوونا", ["G2251"]], [" أيضا أن ", []], ["يمارسوا", ["G4291"]], [" ", []], ["أعمالا", ["G2041"]], [" ", []], ["حسنة", ["G2570"]], ["، لسد ", []], ["الحاجات", ["G5532"]], [" ", []], ["الضرورية", ["G316"]], ["، لكي لا يكونوا ", []], ["عديمي الثمر", ["G175"]], [".", []]]}, {"c": 3, "v": 15, "text": "جميع الذين معي يسلمون عليك. سلم على محبينا في الإيمان. لتكن النعمة معكم جميعا!", "groups": [{"kw": "with me", "raw": "Rom_16:21-24", "note": "", "refs": [{"l": "Rom 16:21-24", "n": "", "vs": [[21, "يسلم عليكم تيموثاوس معاوني، ولوكيوس وياسون وسوسيباترس أقربائي."], [22, "وأنا، ترتيوس الذي أخط هذه الرسالة، أسلم عليكم في الرب."], [23, "يسلم عليكم غايوس، المضيف لي وللكنيسة كلها. يسلم عليكم أراستس، أمين صندوق المدينة، والأخ كوارتس."], [24, "«لتكن نعمة ربنا يسوع المسيح معكم. آمين!»"]]}], "kwAr": "جميع الذين معي", "noteAr": ""}, {"kw": "Greet", "raw": "Rom. 16:1-20", "note": "", "refs": [{"l": "Rom 16:1-20", "n": "", "vs": [[1, "وأوصيكم بفيبي أختنا الخادمة في كنيسة كنخريا:"], [2, "فاقبلوها في الرب قبولا يليق بالقديسين وقدموا لها أي عون تحتاج إليه منكم، لأنها هي كانت معينة لكثيرين ولي أنا أيضا."], [3, "سلموا على بريسكلا وأكيلا، معاوني في خدمة المسيح يسوع،"], [4, "اللذين عرضا عنقيهما للذبح إنقاذا لحياتي، ولست أنا وحدي شاكرا لهما بل جميع كنائس الأمم أيضا."], [5, "وسلموا على الكنيسة في بيتهما. سلموا على أبينتوس، حبيبي الذي هو باكورة للمسيح من مقاطعة أسيا."], [6, "سلموا على مريم التي أجهدت نفسها كثيرا في خدمتنا من قبلكم."], [7, "سلموا على أندرونيكوس ويونياس، قريبي اللذين سجنا معي، وهما مشهوران بين الرسل، وقد كانا في المسيح قبلي."], [8, "سلموا على أمبلياس، حبيبي في الرب."], [9, "سلموا على أوربانوس، معاوننا في خدمة المسيح، وعلى إستاخيس، حبيبي."], [10, "سلموا على أبلس، الذي برهن عن ثباته في المسيح. سلموا على ذوي أرستوبولوس."], [11, "سلموا على هيروديون، قريبي. سلموا على ذوي نركيسوس الذين في الرب."], [12, "سلموا على تريفينا وتريفوسا اللتين تجهدان نفسيهما في خدمة الرب. سلموا على برسيس المحبوبة، التي أجهدت نفسها كثيرا في خدمة الرب."], [13, "سلموا على روفس المختار في الرب، وعلى أمه التي هي أم لي."], [14, "سلموا على أسينكريتس، وفليغون، وهرمس، وبتروباس، وهرماس، وعلى الإخوة الذين معهم."], [15, "سلموا على فيلولوغوس، وجوليا، ونيريوس، وأخته، وأولمباس، وعلى جميع القديسين الذين معهم."], [16, "سلموا بعضكم على بعض بقبلة مقدسة. تسلم عليكم جميع كنائس المسيح."], [17, "ولكن، أتوسل إليكم، أيها الإخوة، أن تنتبهوا إلى مثيري الانقسامات والعثرات، خلافا للتعليم الذي تعلمتم، وأن تبتعدوا عنهم."], [18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."], [19, "إن خبر طاعتكم قد بلغ الجميع. ولذلك أفرح بكم، ولكن أريد لكم أن تكونوا حكماء في ما هو خير، وبسطاء في ما هو شر."], [20, "وإله السلام سيسحق الشيطان تحت أقدامكم سريعا. لتكن نعمة ربنا يسوع المسيح معكم."]]}], "kwAr": "سلم على", "noteAr": ""}, {"kw": "love", "raw": "Gal_5:6; Eph_6:23; 1Ti_1:5; Phm_1:5; 2Jo_1:1, 2Jo_1:2; 3Jo_1:1", "note": "", "refs": [{"l": "Gal 5:6", "n": "", "vs": [[6, "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة."]]}, {"l": "Eph 6:23", "n": "", "vs": [[23, "سلام إلى الإخوة، ومحبة مع إيمان، من الله الآب والرب يسوع المسيح!"]]}, {"l": "1Ti 1:5", "n": "", "vs": [[5, "أما الغاية مما أوصيتك به، فهي المحبة النابعة من قلب طاهر وضمير صالح وإيمان خال من الرياء."]]}, {"l": "Phm 1:5", "n": "", "vs": [[5, "وقد سمعت بما لك من محبة وأمانة من نحو الرب يسوع، ومن نحو جميع القديسين،"]]}, {"l": "2Jo 1:1", "n": "", "vs": [[1, "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."]]}, {"l": "2Jo 1:2", "n": "", "vs": [[2, "بما أن الحق ثابت في قلوبنا، ولابد أن يرافقنا إلى الأبد،"]]}, {"l": "3Jo 1:1", "n": "", "vs": [[1, "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."]]}], "kwAr": "محبينا", "noteAr": ""}, {"kw": "Grace", "raw": "1Co_16:23; Eph_6:24; 2Ti_4:22; Heb_13:25", "note": "", "refs": [{"l": "1Co 16:23", "n": "", "vs": [[23, "لتكن معكم نعمة الرب يسوع المسيح!"]]}, {"l": "Eph 6:24", "n": "", "vs": [[24, "لتكن النعمة مع جميع الذين يحبون ربنا يسوع المسيح محبة لا يعتريها الفساد!"]]}, {"l": "2Ti 4:22", "n": "", "vs": [[22, "ليكن الرب مع روحك، ولتكن النعمة معكم!"]]}, {"l": "Heb 13:25", "n": "", "vs": [[25, "لتكن النعمة معكم جميعا!"]]}], "kwAr": "لتكن النعمة معكم", "noteAr": ""}], "arS": [["جميع", ["G3956"]], [" الذين ", []], ["معي", ["G1700"]], [" ", []], ["يسلمون", ["G782"]], [" عليك. ", []], ["سلم", ["G782"]], [" على ", []], ["محبينا", ["G5368"]], [" في ", []], ["الإيمان", ["G4102"]], [". لتكن ", []], ["النعمة", ["G5485"]], [" معكم ", []], ["جميعا", ["G3956"]], ["!", []]]}], "strong": true}];</script>
