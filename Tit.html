85"]], [" ", []], ["يجب", ["G1163"]], [" أن يكون ", []], ["بريئا من كل تهمة", ["G410"]], [" باعتباره ", []], ["وكيلا", ["G3623"]], [" ", []], ["لله", ["G2316"]], ["، لا ", []], ["معجبا بنفسه", ["G829"]], [" ولا ", []], ["حاد الطبع", ["G3711"]], ["، ولا ", []], ["مدمن الخمر", ["G3943"]], ["، ولا ", []], ["عنيفا", ["G4131"]], ["، ولا ", []], ["ساعيا إلى المكسب الخسيس", ["G146"]], ["؛", []]]}, {"c": 1, "v": 8, "text": "بل مضيافا، محبا للصلاح، رزينا، بارا، تقيا، مالكا لطبعه،", "groups": [{"kw": "a lover of hospitality", "raw": "1Ti_3:2", "note": "", "refs": [{"l": "1Ti 3:2", "n": "", "vs": [[2, "إذن، يجب أن يكون الراعي بلا عيب، زوجا لامرأة واحدة، نبيها عاقلا مهذبا مضيافا، قادرا على التعليم؛"]]}], "kwAr": "مضيافا", "noteAr": ""}, {"kw": "a lover of good", "raw": "1Sa_18:1; 1Ki_5:1, 1Ki_5:7; Psa_16:3; Amo_5:15; 1Jo_3:14, 1Jo_5:1", "note": "", "refs": [{"l": "1Sa 18:1", "n": "", "vs": [[1, "وعندما فرغ داود من حديثه مع شاول، تعلقت نفس يوناثان بداود وأحبه كنفسه."]]}, {"l": "1Ki 5:1", "n": "", "vs": [[1, "وأرسل حيرام ملك صور وفدا إلى سليمان بعد أن سمع أنه اعتلى العرش خلفا لأبيه، وكان حيرام صديقا محبا لداود."]]}, {"l": "1Ki 5:7", "n": "", "vs": [[7, "فلما سمع حيرام كلام سليمان، غمرته البهجة وقال: «مبارك اليوم الرب الذي رزق داود ابنا حكيما ليملك على هذا الشعب الغفير»."]]}, {"l": "Psa 16:3", "n": "", "vs": [[3, "كل بهجتي في قديسي الأرض وأفاضلها."]]}, {"l": "Amo 5:15", "n": "", "vs": [[15, "امقتوا الشر وأحبوا الخير وأقيموا العدل في ساحة القضاء، لعل الرب الإله القدير يترفق على بقية بيت يوسف."]]}, {"l": "1Jo 3:14", "n": "", "vs": [[14, "إن محبتنا لإخوتنا تبين لنا أننا انتقلنا من الموت إلى الحياة. فالذي لا يحب إخوته، فهو باق في الموت."]]}, {"l": "1Jo 5:1", "n": "", "vs": [[1, "كل من يؤمن حقا أن يسوع هو المسيح، فهو مولود من الله. ومن يحب الوالد، فلابد أن يحب المولودين منه أيضا."]]}], "kwAr": "محبا للصلاح", "noteAr": ""}, {"kw": "men", "raw": "or, things", "note": "or, things", "refs": [], "kwAr": "الصلاح", "noteAr": "أو: الأمور (محبًا للأمور الصالحة)."}, {"kw": "sober", "raw": "Tit_2:7; 2Co_6:4-8; 1Th_2:10; 1Ti_4:12, 1Ti_6:11; 2Ti_2:22", "note": "", "refs": [{"l": "Tit 2:7", "n": "", "vs": [[7, "جاعلا من نفسك في كل شيء قدوة للأعمال الصالحة، مظهرا في تعليمك النقاوة والوقار"]]}, {"l": "2Co 6:4-8", "n": "", "vs": [[4, "وإنما نتصرف في كل شيء بما يبين أننا فعلا خدام الله: في تحمل الكثير؛ في الشدائد والحاجات والضيقات والجلدات"], [5, "والسجون والاضطرابات والأتعاب والسهر والصوم؛"], [6, "في الطهارة والمعرفة وطول البال واللطف؛ في الروح القدس والمحبة الخالصة من الرياء؛"], [7, "في كلمة الحق وقدرة الله؛ بأسلحة البر في الهجوم والدفاع؛"], [8, "بالكرامة والهوان؛ بالصيت السييء والصيت الحسن. نعامل كمضللين ونحن صادقون،"]]}, {"l": "1Th 2:10", "n": "", "vs": [[10, "فأنتم تشهدون، ويشهد الله ، كيف تصرفنا بينكم، أنتم المؤمنين، بطهارة واستقامة وبراءة من اللوم،"]]}, {"l": "1Ti 4:12", "n": "", "vs": [[12, "لا يستخف أحد بحداثة سنك. وإنما كن قدوة للمؤمنين، في الكلام والسلوك والمحبة والإيمان والطهارة."]]}, {"l": "1Ti 6:11", "n": "", "vs": [[11, "وأما أنت، ياإنسان الله، فاهرب من هذه الأمور، واسع في إثر البر والتقوى والإيمان والمحبة والصبر والوداعة."]]}, {"l": "2Ti 2:22", "n": "", "vs": [[22, "إنما اهرب من الشهوات الشبابية، واسع وراء البر والإيمان والمحبة والسلام، مشاركا الذين يدعون الرب من قلب نقي."]]}], "kwAr": "رزينا", "noteAr": ""}], "arS": [["بل ", []], ["مضيافا", ["G5382"]], ["، ", []], ["محبا للصلاح", ["G5358"]], ["، ", []], ["رزينا", ["G4998"]], ["، ", []], ["بارا", ["G1342"]], ["، ", []], ["تقيا", ["G3741"]], ["، ", []], ["مالكا لطبعه", ["G1468"]], ["،", []]]}, {"c": 1, "v": 9, "text": "ملتصقا بالكلمة الصادقة الموافقة للتعليم، ليكون قادرا على تشجيع المؤمنين بالتعليم الصحيح وعلى إفحام المعارضين.", "groups": [{"kw": "Holding", "raw": "Job_2:3, Job_27:6; Pro_23:23; 1Th_5:21; 2Th_2:15; 2Ti_1:13; Jud_1:3; Rev_2:25, Rev_3:3, Rev_3:11", "note": "", "refs": [{"l": "Job 2:3", "n": "", "vs": [[3, "فقال الرب للشيطان: «هل راقبت عبدي أيوب فإنه لا نظير له في الأرض، فهو رجل كامل صالح، يتقي الله ويحيد عن الشر، وحتى الآن لا يزال معتصما بكماله، مع أنك أثرتني عليه لأهلكه من غير داع»."]]}, {"l": "Job 27:6", "n": "", "vs": [[6, "أتشبث ببري ولن أرخيه، لأن ضميري لا يؤنبني على يوم من أيامي."]]}, {"l": "Pro 23:23", "n": "", "vs": [[23, "اقتن الحق ولا تبعه، وكذا الحكمة والتأديب والفطنة."]]}, {"l": "1Th 5:21", "n": "", "vs": [[21, "امتحنوا كل شيء وتمسكوا بالحسن."]]}, {"l": "2Th 2:15", "n": "", "vs": [[15, "فاثبتوا إذن، أيها الإخوة، وتمسكوا بالتعاليم التي تلقيتم منا، سواء كان بالكلام أم برسالتنا."]]}, {"l": "2Ti 1:13", "n": "", "vs": [[13, "اتخذ من الكلام الصحيح الذي سمعته مني مثالا في الإيمان والمحبة اللذين في المسيح يسوع."]]}, {"l": "Jud 1:3", "n": "", "vs": [[3, "أيها الأحباء، كنت قد نويت أن أكتب إليكم في موضوع الخلاص الذي نشترك فيه جميعا. ولكن، أراني الآن مضطرا لأن أكتب لأشجعكم على الجهاد في سبيل الإيمان الذي سلم مرة واحدة للقديسين."]]}, {"l": "Rev 2:25", "n": "", "vs": [[25, "فقط تمسكوا بما لديكم إلى أن أجيء."]]}, {"l": "Rev 3:3", "n": "", "vs": [[3, "تذكر ما سبق أن تقبلته وسمعته، وتمسك بما آمنت به، وتب! فإن كنت لا تتنبه، آتيك كما يأتي اللص، ولا تدري في أية ساعة أفاجئك!"]]}, {"l": "Rev 3:11", "n": "", "vs": [[11, "إني آت سريعا، فتمسك بما عندك، لئلا يسلب أحد إكليلك."]]}], "kwAr": "ملتصقا", "noteAr": ""}, {"kw": "fast", "raw": "1Ti_1:15, 1Ti_4:9, 1Ti_6:3; 2Ti_2:2", "note": "", "refs": [{"l": "1Ti 1:15", "n": "", "vs": [[15, "ما أصدق هذا القول، وما أجدره بالتصديق الكلي: إن المسيح يسوع قد جاء إلى العالم ليخلص الخاطئين، وأنا أولهم!"]]}, {"l": "1Ti 4:9", "n": "", "vs": [[9, "ما أصدق هذا القول، وما أجدره بالتصديق!"]]}, {"l": "1Ti 6:3", "n": "", "vs": [[3, "أما إذا كان أحد يعلم ما يخالفها ولا يذعن للكلام الصحيح، كلام ربنا يسوع المسيح، وللتعليم الموافق للتقوى،"]]}, {"l": "2Ti 2:2", "n": "", "vs": [[2, "والتعاليم التي سمعتها مني بحضور شهود عديدين، أودعها أمانة بين أيدي أناس جديرين بالثقة، يكونون قادرين على تعليم الآخرين."]]}], "kwAr": "بالكلمة الصادقة", "noteAr": ""}, {"kw": "as he hath been taught", "raw": "or, in teaching", "note": "or, in teaching", "refs": [], "kwAr": "الموافقة للتعليم", "noteAr": "أو: في التعليم."}, {"kw": "sound", "raw": "Tit_2:1, Tit_2:7, Tit_2:8; 1Ti_1:10, 1Ti_6:3; 2Ti_4:3", "note": "", "refs": [{"l": "Tit 2:1", "n": "", "vs": [[1, "أما أنت، فعلم بما يوافق التعليم الصحيح:"]]}, {"l": "Tit 2:7", "n": "", "vs": [[7, "جاعلا من نفسك في كل شيء قدوة للأعمال الصالحة، مظهرا في تعليمك النقاوة والوقار"]]}, {"l": "Tit 2:8", "n": "", "vs": [[8, "والكلمة الصحيحة التي لا تلام، لكي يخجل المقاوم حين لا يجد أمرا سيئا يقوله فينا."]]}, {"l": "1Ti 1:10", "n": "", "vs": [[10, "والزناة ومضاجعي الذكور، وخطافي الناس والكذابين وشاهدي الزور. وذوي كل شر آخر يخالف التعليم الصحيح"]]}, {"l": "1Ti 6:3", "n": "", "vs": [[3, "أما إذا كان أحد يعلم ما يخالفها ولا يذعن للكلام الصحيح، كلام ربنا يسوع المسيح، وللتعليم الموافق للتقوى،"]]}, {"l": "2Ti 4:3", "n": "", "vs": [[3, "فإنه سيأتي زمان لا يطيق الناس فيه التعليم الصحيح، بل تبعا لشهواتهم الخاصة يكدسون لأنفسهم معلمين (يقولون لهم كلاما) يداعب الآذان."]]}], "kwAr": "بالتعليم الصحيح", "noteAr": ""}, {"kw": "to convince", "raw": "Tit_1:11; Act_18:28; 1Co_14:24; 2Ti_2:25", "note": "", "refs": [{"l": "Tit 1:11", "n": "", "vs": [[11, "هؤلاء يجب أن تسد أفواههم: فهم يخربون بيوتا بجملتها، إذ يعلمون تعاليم يجب ألا تعلم، في سبيل مكسب خسيس."]]}, {"l": "Act 18:28", "n": "", "vs": [[28, "فقد كان جريئا في مجادلاته العلنية مع اليهود، وكان يفحمهم مستندا إلى الكتاب فيثبت أن يسوع هو المسيح."]]}, {"l": "1Co 14:24", "n": "", "vs": [[24, "ولكن، إن كان الجميع يتنبأون، ثم دخل واحد من غير المؤمنين أو قليلي الخبرة، فإنه يقتنع من الجميع، ويحكم عليه من قبل الجميع،"]]}, {"l": "2Ti 2:25", "n": "", "vs": [[25, "ويؤدب بالوداعة مقاومي الإيمان، عسى أن يمنحهم الله التوبة، فيعرفوا الحق بالتمام،"]]}], "kwAr": "إفحام المعارضين", "noteAr": ""}], "arS": [["ملتصقا", ["G472"]], [" ", []], ["بالكلمة", ["G3056"]], [" ", []], ["الصادقة", ["G4103"]], [" الموافقة ", []], ["للتعليم", ["G1322"]], ["، ليكون ", []], ["قادرا", ["G1415"]], [" على ", []], ["تشجيع", ["G3870"]], [" المؤمنين ", []], ["بالتعليم", ["G1319"]], [" ", []], ["الصحيح", ["G5198"]], [" وعلى ", []], ["إفحام", ["G1651"]], [" ", []], ["المعارضين", ["G483"]], [".", []]]}, {"c": 1, "v": 10, "text": "فإن هنالك كثيرين من معلمي الباطل المتمردين وخادعي عقول الناس، وبخاصة الذين من أهل الختان.", "groups": [{"kw": "there", "raw": "Act_20:29; Rom_16:17-18; 2Co_11:12-15; Eph_4:14; 2Th_2:10-12; 1Ti_1:4, 1Ti_1:6, 1Ti_6:3-5; 2Ti_3:13, 2Ti_4:4; Jam_1:26; 2Pe_2:1, 2Pe_2:2; 1Jo_2:18, 1Jo_4:1; Rev_2:6, Rev_2:14", "note": "", "refs": [{"l": "Act 20:29", "n": "", "vs": [[29, "فإني أعلم أنه بعد رحيلي سيندس بينكم ذئاب خاطفة، لا تشفق على القطيع."]]}, {"l": "Rom 16:17-18", "n": "", "vs": [[17, "ولكن، أتوسل إليكم، أيها الإخوة، أن تنتبهوا إلى مثيري الانقسامات والعثرات، خلافا للتعليم الذي تعلمتم، وأن تبتعدوا عنهم."], [18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."]]}, {"l": "2Co 11:12-15", "n": "", "vs": [[12, "ولكن، سأفعل ما أنا فاعله الآن لأسقط حجة الذين يلتمسون حجة تبين أنهم مثلنا في ما يفتخرون به."], [13, "فإن أمثال هؤلاء هم رسل دجالون، عمال ماكرون، يظهرون أنفسهم بمظهر رسل المسيح."], [14, "ولا عجب! فالشيطان نفسه يظهر نفسه بمظهر ملاك نور."], [15, "فليس كثيرا إذن أن يظهر خدامه أنفسهم بمظهر خدام البر. وإن عاقبتهم ستكون على حسب أعمالهم."]]}, {"l": "Eph 4:14", "n": "", "vs": [[14, "وذلك حتى لا نكون فيما بعد أطفالا تتقاذفنا وتحملنا كل ريح تعليم يقوم على خداع الناس والمكر بهم لجرهم إلى الضلال الملفق،"]]}, {"l": "2Th 2:10-12", "n": "", "vs": [[10, "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا."], [11, "ولهذا السبب، سيرسل الله إليهم طاقة الضلال حتى يصدقوا ما هو دجل،"], [12, "فتقع الدينونة على جميع الذين لم يؤمنوا بالحق بل سرهم الإثم."]]}, {"l": "1Ti 1:4", "n": "", "vs": [[4, "وتوصي المؤمنين ألا ينشغلوا بالأساطير وسلاسل النسب المتشابكة. فتلك الأمور تثير المجادلات ولا تعمل على تقدم تدبير الله القائم على الإيمان."]]}, {"l": "1Ti 1:6", "n": "", "vs": [[6, "هذه الفضائل قد زاغ عنها بعضهم، فانحرفوا إلى المجادلات الباطلة،"]]}, {"l": "1Ti 6:3-5", "n": "", "vs": [[3, "أما إذا كان أحد يعلم ما يخالفها ولا يذعن للكلام الصحيح، كلام ربنا يسوع المسيح، وللتعليم الموافق للتقوى،"], [4, "فهو قد انتفخ تكبرا، ولا يعرف شيئا، وإنما هو مهووس بالمجادلات والمنازعات الكلامية، ومنها ينشأ الحسد والخصام والتجريح والنيات السيئة،"], [5, "وشتى أنواع النزاع بين أناس فاسدي العقول مجردين من الحق، يعتبرون التقوى تجارة."]]}, {"l": "2Ti 3:13", "n": "", "vs": [[13, "أما الناس الأشرار والدجالون المحتالون، فيتقدمون في الشر، مضللين الآخرين وهم أنفسهم مضللون!"]]}, {"l": "2Ti 4:4", "n": "", "vs": [[4, "فيحولون آذانهم بعيدا عن الحق، منحرفين إلى الخرافات."]]}, {"l": "Jam 1:26", "n": "", "vs": [[26, "وإن ظن أحد أنه متدين، وهو لا يلجم لسانه، فإنه يغش قلبه، وديانته غير نافعة!"]]}, {"l": "2Pe 2:1", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."]]}, {"l": "2Pe 2:2", "n": "", "vs": [[2, "وكثيرون سيسيرون وراءهم في طرق الإباحية. وبسببهم توجه الإهانة إلى طريق الحق."]]}, {"l": "1Jo 2:18", "n": "", "vs": [[18, "أيها الأولاد، اعلموا أننا نعيش الآن في الزمن الأخير. وكما سمعتم أنه سوف يأتي أخيرا «مسيح دجال»، فقد ظهر حتى الآن كثيرون من الدجالين المقاومين للمسيح. من هنا نتأكد أننا نعيش في الزمن الأخير."]]}, {"l": "1Jo 4:1", "n": "", "vs": [[1, "أيها الأحباء، لا تصدقوا كل روح، بل امتحنوا الأرواح لتعرفوا ما إذا كانت من عند الله أم لا، لأن عددا كبيرا من الأنبياء الدجالين قد انتشر في العالم."]]}, {"l": "Rev 2:6", "n": "", "vs": [[6, "أما ما يسرني فيك فهو أنك تكره أعمال النيقولاويين التي أكرهها أنا أيضا."]]}, {"l": "Rev 2:14", "n": "", "vs": [[14, "ولكني عاتب عليك قليلا لأنك تتسامح مع القوم الذين يتمسكون بتعليم بلعام عندما علم الملك بالاق أن يدمر بني إسرائيل بتوريطهم في ارتكاب الزنى والأكل من الذبائح المقدمة للأصنام،"]]}], "kwAr": "هنالك كثيرين", "noteAr": ""}, {"kw": "specially", "raw": "Act_15:1, Act_15:24; Gal_1:6-8, Gal_2:4, Gal_3:1, Gal_4:17-21, Gal_5:1-4; Phi_3:2, Phi_3:3", "note": "", "refs": [{"l": "Act 15:1", "n": "", "vs": [[1, "وجاء بعض اليهود (الذين كانوا قد آمنوا بالمسيح) من منطقة اليهودية إلى أنطاكية، وأخذوا يعلمون الإخوة قائلين: «لا يمكنكم أن تخلصوا ما لم تختنوا حسب شريعة موسى»"]]}, {"l": "Act 15:24", "n": "", "vs": [[24, "علمنا أن بعض الأشخاص ذهبوا من عندنا إليكم، دون تفويض منا فأثاروا بكلامهم الاضطراب بينكم وأقلقوا أفكاركم."]]}, {"l": "Gal 1:6-8", "n": "", "vs": [[6, "عجبا! كيف تتحولون بمثل هذه السرعة عن الذي دعاكم بنعمة المسيح، وتنصرفون إلى إنجيل غريب؟"], [7, "لا أعني أن هنالك إنجيلا آخر، بل إنما هنالك بعض (المعلمين) الذين يثيرون البلبلة بينكم، راغبين في تحوير إنجيل المسيح."], [8, "ولكن، حتى لو بشرناكم نحن، أو بشركم ملاك من السماء، بغير الإنجيل الذي بشرناكم به، فليكن ملعونا!"]]}, {"l": "Gal 2:4", "n": "", "vs": [[4, "إنما أثير الأمر بسبب الإخوة الدجالين الذين أدخلوا بيننا خلسة، فاندسوا ليتجسسوا حريتنا التي لنا في المسيح يسوع، لعلهم يعيدوننا إلى العبودية؛"]]}, {"l": "Gal 3:1", "n": "", "vs": [[1, "ياأهل غلاطية الأغبياء! من سحر عقولكم، أنتم الذين قد رسم أمام أعينكم يسوع المسيح وهو مصلوب؟"]]}, {"l": "Gal 4:17-21", "n": "", "vs": [[17, "إن أولئك (المعلمين) يظهرون من نحوكم حماسة، ولكنها غير صادقة، بل هم يرغبون في عزلكم عنا،"], [18, "لكي تتحمسوا لهم. جميل إظهار الحماسة في ما هو حق، كل حين، وليس فقط حين أكون حاضرا عندكم."], [19, "ياأطفالي الذين أتمخض بكم مرة أخرى إلى أن تتشكل فيكم صورة المسيح."], [20, "وكم أود لو أكون الآن حاضرا عندكم، فأخاطبكم بغير هذه اللهجة، لأني متحير في أمركم."], [21, "قولوا لي، يامن ترغبون في الرجوع إلى العبودية للشريعة، ألستم تسمعون ما جاء في الشريعة؟"]]}, {"l": "Gal 5:1-4", "n": "", "vs": [[1, "إن المسيح قد حررنا وأطلقنا في سبيل الحرية. فاثبتوا إذن، ولا تعودوا إلى الارتباك بنير العبودية."], [2, "ها أنا بولس أقول لكم: إن ختنتم، لا ينفعكم المسيح شيئا."], [3, "وأشهد مرة أخرى لكل مختون بأنه ملتزم أن يعمل بالشريعة كلها."], [4, "يامن تريدون التبرير عن طريق الشريعة، قد حرمتم المسيح وسقطتم من النعمة!"]]}, {"l": "Phi 3:2", "n": "", "vs": [[2, "خذوا حذركم من «الكلاب»، من العمال الأشرار، من الذين يبترون الجسد."]]}, {"l": "Phi 3:3", "n": "", "vs": [[3, "فإننا نحن أهل الختان الحق، لأننا إنما نعبد بروح الله ونفتخر في المسيح يسوع، ولا نعتمد على أمور الجسد،"]]}], "kwAr": "وبخاصة", "noteAr": ""}], "arS": [["فإن هنالك ", []], ["كثيرين", ["G4183"]], [" من ", []], ["معلمي الباطل", ["G3151"]], [" ", []], ["المتمردين", ["G506"]], [" ", []], ["وخادعي عقول الناس", ["G5423"]], ["، ", []], ["وبخاصة", ["G3122"]], [" الذين من أهل ", []], ["الختان", ["G4061"]], [".", []]]}, {"c": 1, "v": 11, "text": "هؤلاء يجب أن تسد أفواههم: فهم يخربون بيوتا بجملتها، إذ يعلمون تعاليم يجب ألا تعلم، في سبيل مكسب خسيس.", "groups": [{"kw": "mouths", "raw": "Tit_1:9, Tit_3:10; Psa_63:11, Psa_107:42; Eze_16:63; Luk_20:40; Rom_3:19; 2Co_11:10", "note": "", "refs": [{"l": "Tit 1:9", "n": "", "vs": [[9, "ملتصقا بالكلمة الصادقة الموافقة للتعليم، ليكون قادرا على تشجيع المؤمنين بالتعليم الصحيح وعلى إفحام المعارضين."]]}, {"l": "Tit 3:10", "n": "", "vs": [[10, "وصاحب الهرطقة اقطع العلاقة به بعد إنذاره أولا وثانيا،"]]}, {"l": "Psa 63:11", "n": "", "vs": [[11, "أما الملك فيفرح بالله ويفتخر به كل من يقسم (صادقا) لأن أفواه الناطقين بالكذب تسد."]]}, {"l": "Psa 107:42", "n": "", "vs": [[42, "يرى المستقيمون هذا ويفرحون، أما الأثمة فيخرسون."]]}, {"l": "Eze 16:63", "n": "", "vs": [[63, "لكي تتذكري فتخجلي ولا تفتحي فمك من بعد بسبب خزيك، حين أغفر لك كل ما ارتكبت من شر يقول السيد الرب»."]]}, {"l": "Luk 20:40", "n": "", "vs": [[40, "ولم يجرؤ أحد بعد ذلك أن يسأله شيئا."]]}, {"l": "Rom 3:19", "n": "", "vs": [[19, "ونحن نعلم أن كل ما تقوله الشريعة إنما تخاطب به الذين هم تحت الشريعة، لكي يسد كل فم ويقع العالم كله تحت دينونة من الله."]]}, {"l": "2Co 11:10", "n": "", "vs": [[10, "ومادام حق المسيح في، لن يوقف أحد افتخاري هذا في بلاد أخائية كلها!"]]}], "kwAr": "تسد أفواههم", "noteAr": ""}, {"kw": "subvert", "raw": "Mat_23:14; 2Ti_3:6", "note": "", "refs": [{"l": "Mat 23:14", "n": "", "vs": [[14, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تلتهمون بيوت الأرامل وتتذرعون بإطالة صلواتكم. لذلك ستنزل بكم دينونة أقسى!"]]}, {"l": "2Ti 3:6", "n": "", "vs": [[6, "فمن هؤلاء من يدخلون البيوت خلسة، ويوقعون في حبائلهم بعض النساء السخيفات المثقلات بالخطايا، اللواتي تجرفهن شهوات مختلفة،"]]}], "kwAr": "يخربون بيوتا بجملتها", "noteAr": ""}, {"kw": "filthy", "raw": "Tit_1:7; Isa_56:10,Isa_56:11; Jer_8:10; Eze_13:19; Mic_3:5, Mic_3:11; Joh_10:12; 1Ti_6:5; 2Pe_2:1-3", "note": "", "refs": [{"l": "Tit 1:7", "n": "", "vs": [[7, "وذلك لأن الناظر يجب أن يكون بريئا من كل تهمة باعتباره وكيلا لله، لا معجبا بنفسه ولا حاد الطبع، ولا مدمن الخمر، ولا عنيفا، ولا ساعيا إلى المكسب الخسيس؛"]]}, {"l": "Isa 56:10", "n": "", "vs": [[10, "فإن رقباءهم عمي، وكلهم جهال، وكلاب بكم عاجزون عن النباح، حالمون راقدون مولعون بالنوم."]]}, {"l": "Isa 56:11", "n": "", "vs": [[11, "هم كلاب نهمة لا تعرف الشبع، ورعاة أيضا مجردون من الفهم، كل مال إلى طريقه طمعا في الربح،"]]}, {"l": "Jer 8:10", "n": "", "vs": [[10, "لذلك أعطي نساءهم لآخرين وحقولهم للوارثين القاهرين، لأنهم جميعا من صغيرهم إلى كبيرهم مولعون بالربح. حتى النبي والكاهن يرتكبان الزور في أعمالهما،"]]}, {"l": "Eze 13:19", "n": "", "vs": [[19, "فتدنسنني عند شعبي لقاء حفنة شعير وفتات خبز حتى تمتن نفوسا ما كان يجب أن تموت، ولكي تستحيين نفوسا أخرى لم يكن لها أن تحيا من جراء كذبكن على شعبي السامع للكذب."]]}, {"l": "Mic 3:5", "n": "", "vs": [[5, "وهذا ما يقوله الرب بشأن الأنبياء الذين يضلون شعبه، الذين ينادون قائلين: «سلام» لمن يعطيهم طعاما، ويعلنون الحرب على من لا يلقم أفواههم."]]}, {"l": "Mic 3:11", "n": "", "vs": [[11, "إذ يحكم رؤساؤها بالرشوة، وكهنتها يعلمون بالأجرة ويتعاطى أنبياؤها العرافة لقاء المال، ومع ذلك يدعون الاتكال على الله قائلين: «أليس الرب في وسطنا؟ لذلك لن يصيبنا مكروه»."]]}, {"l": "Joh 10:12", "n": "", "vs": [[12, "وليس الأجير كالراعي، لأن الخراف ليست ملكه. فعندما يرى الذئب قادما، يترك الخراف لينجو بنفسه، فيخطف الذئب الخراف ويبددها."]]}, {"l": "1Ti 6:5", "n": "", "vs": [[5, "وشتى أنواع النزاع بين أناس فاسدي العقول مجردين من الحق، يعتبرون التقوى تجارة."]]}, {"l": "2Pe 2:1-3", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."], [2, "وكثيرون سيسيرون وراءهم في طرق الإباحية. وبسببهم توجه الإهانة إلى طريق الحق."], [3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}], "kwAr": "مكسب خسيس", "noteAr": ""}], "arS": [["هؤلاء ", []], ["يجب", ["G1163"]], [" أن ", []], ["تسد", ["G1993"]], [" ", []], ["أفواههم", ["G1993"]], [": فهم ", []], ["يخربون", ["G396"]], [" ", []], ["بيوتا", ["G3624"]], [" ", []], ["بجملتها", ["G3650"]], ["، إذ ", []], ["يعلمون", ["G1321"]], [" تعاليم ", []], ["يجب", ["G1163"]], [" ألا تعلم، في سبيل ", []], ["مكسب خسيس", ["G150", "G2771"]], [".", []]]}, {"c": 1, "v": 12, "text": "وقد قال واحد منهم، وهو عندهم نبي خاص بهم: «أهل كريت دائما كذابون، وحوش شرسة، نهمون كسالى».", "groups": [{"kw": "of", "raw": "Act_17:28", "note": "", "refs": [{"l": "Act 17:28", "n": "", "vs": [[28, "لأننا به نحيا ونتحرك ونوجد، أو كما قال بعض شعرائكم: نحن أيضا ذريته!"]]}], "kwAr": "واحد منهم", "noteAr": ""}, {"kw": "liars", "raw": "Rom_16:18; 1Ti_4:2; 2Pe_2:12, 2Pe_2:15; Jud_1:8-13", "note": "", "refs": [{"l": "Rom 16:18", "n": "", "vs": [[18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."]]}, {"l": "1Ti 4:2", "n": "", "vs": [[2, "في موجة رياء ينشرها معلمون دجالون لهم ضمائر كويت بالنار."]]}, {"l": "2Pe 2:12", "n": "", "vs": [[12, "حقا إن هؤلاء المعلمين الدجالين الذين يتكلمون كلاما مهينا في أمور يجهلونها، يشبهون الحيوانات المفترسة غير العاقلة، المولودة ليصطادها الناس ويقتلوها. فلابد أن يهلكوا مثلها."]]}, {"l": "2Pe 2:15", "n": "", "vs": [[15, "وإذ خرجوا عن الطريق المستقيم، ضلوا. فهم سائرون في طريق بلعام بن بعور، الذي أحب الحصول على المال أجرة لإثمه."]]}, {"l": "Jud 1:8-13", "n": "", "vs": [[8, "ومع ذلك، فإن أولئك المعلمين المتوهمين يسيرون في الطريق التي سار فيها أهل تلك المدن. إذ يلوثون أجسادهم بالنجاسة، ويحتقرون السيادة الإلهية، ويتكلمون بالإهانة على الكائنات المجيدة!"], [9, "فحتى ميخائيل، وهو رئيس ملائكة، لم يجرؤ أن يحكم على إبليس بكلام مهين عندما خاصمه وتجادل معه بخصوص جثمان موسى، وإنما اكتفى بالقول له: «ليزجرك الرب!»"], [10, "ولكن هؤلاء المعلمين يتكلمون كلاما مهينا على أمور لا يعرفونها. وأما ما يفهمونه بالغريزة، كالحيوانات غير العاقلة، فإنهم به يدمرون أنفسهم."], [11, "الويل لهم! لأنهم سلكوا طريق قايين، واندفعوا إلى ارتكاب خطيئة بلعام طلبا للمال، وتمردوا كما تمرد قورح، فدمروا أنفسهم."], [12, "إنهم يشتركون معكم في ولائم المحبة دون خجل، ولكنهم كصخور تعيقكم. لا هم لهم سوى تعليف أنفسهم! إنهم يشبهون غيوما بلا مطر تسوقها الرياح، وأشجارا خريفية بلا ثمر، يقتلعها أصحابها، فتكون قد ماتت مرتين."], [13, "وبأعمالهم المخجلة يفضحون أنفسهم كأمواج في البحر هائجة تقذف الأوساخ. وهم أشبه بنجوم تائهة في الفضاء، مصيرها الظلام الشديد إلى الأبد!"]]}], "kwAr": "كذابون", "noteAr": ""}], "arS": [["وقد ", []], ["قال", ["G2036"]], [" ", []], ["واحد", ["G5100"]], [" منهم، وهو عندهم ", []], ["نبي", ["G4396"]], [" خاص بهم: «أهل ", []], ["كريت", ["G2912"]], [" ", []], ["دائما", ["G104"]], [" ", []], ["كذابون", ["G5583"]], ["، ", []], ["وحوش", ["G2342"]], [" ", []], ["شرسة", ["G2556"]], ["، ", []], ["نهمون", ["G1064"]], [" ", []], ["كسالى", ["G692"]], ["».", []]]}, {"c": 1, "v": 13, "text": "وهذه شهادة صدق. لذلك كن متشددا في توبيخهم، ليكونوا أصحاء في الإيمان،", "groups": [{"kw": "rebuke", "raw": "Tit_2:15; Pro_27:5; 2Co_13:10; 1Ti_5:20; 2Ti_4:2", "note": "", "refs": [{"l": "Tit 2:15", "n": "", "vs": [[15, "بهذه الأمور تكلم، وعظ، ووبخ بكل سلطان، ولا تدع أحدا يستخف بك!"]]}, {"l": "Pro 27:5", "n": "", "vs": [[5, "التوبيخ الظاهر خير من الحب المضمر."]]}, {"l": "2Co 13:10", "n": "", "vs": [[10, "لهذا أكتب إليكم بهذه الأمور وأنا غائب، حتى إذا حضرت لا ألجأ إلى الحزم بحسب السلطة التي منحني إياها الرب للبنيان لا للهدم."]]}, {"l": "1Ti 5:20", "n": "", "vs": [[20, "فإذا ثبت أن المتهم مخطيء، وبخه أمام الجميع، ليكون عند الباقين خوف!"]]}, {"l": "2Ti 4:2", "n": "", "vs": [[2, "أن تنادي بالكلمة منشغلا بها كليا، في الفرص المناسبة وغير المناسبة على السواء، وأن توبخ وتنذر وتشجع بكل صبر في التعليم."]]}], "kwAr": "كن متشددا في توبيخهم", "noteAr": ""}, {"kw": "that", "raw": "Tit_2:2; Lev_19:17; Psa_119:80, Psa_141:5; 2Co_7:8-12; 1Ti_4:6", "note": "", "refs": [{"l": "Tit 2:2", "n": "", "vs": [[2, "أن يكون الشيوخ ذوي رزانة ووقار، متعقلين، صحيحي الإيمان والمحبة والصبر."]]}, {"l": "Lev 19:17", "n": "", "vs": [[17, "لا تبغض أخاك في قلبك، بل إنذارا تنذره لئلا تكون شريكا في ذنبه."]]}, {"l": "Psa 119:80", "n": "", "vs": [[80, "ليكن قلبي متعلقا بكامل فرائضك، فلا أخزى."]]}, {"l": "Psa 141:5", "n": "", "vs": [[5, "ليضربني الصديق فذلك رحمة، وليوبخني فذلك زيت عاطر لرأسي. أما الأشرار فإني أصلي دائما (كي تحفظني من أفعالهم الأثيمة)."]]}, {"l": "2Co 7:8-12", "n": "", "vs": [[8, "فإذا كنت قد أحزنتكم برسالتي إليكم، فلست نادما على ذلك، مع أني كنت قد ندمت، لأني أرى أن تلك الرسالة أحزنتكم ولو إلى حين."], [9, "وأنا الآن أفرح، لا لأنكم قد أحزنتم، بل لأن حزنكم أدى بكم إلى التوبة. فإنكم قد أحزنتم بما يوافق مشيئة الله، حتى لا تتأذوا منا في أي شيء."], [10, "فإن الحزن الذي يوافق مشيئة الله ينتج توبة تؤدي إلى الخلاص، وليس عليه ندم. وأما حزن العالم فينتج موتا."], [11, "فانظروا، إذن، هذا الحزن عينه الذي يوافق الله ، كم أنتج فيكم من الاجتهاد، بل من الاعتذار، بل من الاستنكار، بل من الخوف، بل من التشوق، بل من الغيرة، بل من الانتقام! وقد بينتم في كل شيء أنكم أبرياء من ذلك الأمر."], [12, "إذن، كتبت إليكم ما كتبته سابقا لا من أجل المذنب ولا من أجل المذنب إليه، بل لكي يظهر لكم أمام الله مدى حماستكم لطاعتنا."]]}, {"l": "1Ti 4:6", "n": "", "vs": [[6, "إن بسطت هذه الأمور أمام الإخوة، كنت خادما صالحا للمسيح يسوع، متغذيا بكلام الإيمان والتعليم الصالح الذي اتبعته تماما."]]}], "kwAr": "ليكونوا أصحاء في الإيمان", "noteAr": ""}], "arS": [["وهذه ", []], ["شهادة", ["G3141"]], [" ", []], ["صدق", ["G227"]], [". ", []], ["لذلك", ["G1223", "G3739", "G156"]], [" كن ", []], ["متشددا", ["G664"]], [" في ", []], ["توبيخهم", ["G1651"]], ["، ليكونوا ", []], ["أصحاء", ["G5198"]], [" في ", []], ["الإيمان", ["G4102"]], ["،", []]]}, {"c": 1, "v": 14, "text": "لا يديرون عقولهم إلى خرافات يهودية ووصايا أناس تحولوا عن الحق بعيدا.", "groups": [{"kw": "Jewish", "raw": "1Ti_1:4-7; 2Ti_4:4", "note": "", "refs": [{"l": "1Ti 1:4-7", "n": "", "vs": [[4, "وتوصي المؤمنين ألا ينشغلوا بالأساطير وسلاسل النسب المتشابكة. فتلك الأمور تثير المجادلات ولا تعمل على تقدم تدبير الله القائم على الإيمان."], [5, "أما الغاية مما أوصيتك به، فهي المحبة النابعة من قلب طاهر وضمير صالح وإيمان خال من الرياء."], [6, "هذه الفضائل قد زاغ عنها بعضهم، فانحرفوا إلى المجادلات الباطلة،"], [7, "راغبين في أن يكونوا أساتذة في الشريعة، وهم لا يفهمون ما يقولون ولا ما يقررون!"]]}, {"l": "2Ti 4:4", "n": "", "vs": [[4, "فيحولون آذانهم بعيدا عن الحق، منحرفين إلى الخرافات."]]}], "kwAr": "خرافات يهودية", "noteAr": ""}, {"kw": "commandments", "raw": "Isa_29:13; Mat_15:9; Mar_7:7; Col_2:22", "note": "", "refs": [{"l": "Isa 29:13", "n": "", "vs": [[13, "لذلك يقول الرب: لأن هذا الشعب يقترب مني بفمه ويكرمني بشفتيه، بينما قلبه بعيد عنى. وما مخافتهم مني سوى تقليد تلقنوه من الناس."]]}, {"l": "Mat 15:9", "n": "", "vs": [[9, "إنما باطلا يعبدونني وهم يعلمون تعاليم ليست إلا وصايا الناس.»"]]}, {"l": "Mar 7:7", "n": "", "vs": [[7, "إنما باطلا يعبدونني وهم يعلمون تعاليم ليست إلا وصايا الناس !"]]}, {"l": "Col 2:22", "n": "", "vs": [[22, "وهذه أشياء تستهلك وتزول. فتلك الفرائض هي وصايا البشر وتعاليمهم."]]}], "kwAr": "ووصايا أناس", "noteAr": ""}, {"kw": "turn", "raw": "Gal_4:9; 2Ti_4:4; Heb_12:25; 2Pe_2:22", "note": "", "refs": [{"l": "Gal 4:9", "n": "", "vs": [[9, "أما الآن وقد عرفتم الله ، بل بالأحرى عرفكم الله ، فكيف ترتدون أيضا إلى تلك المباديء العاجزة الفقيرة التي ترغبون في الرجوع إلى العبودية لها من جديد؟"]]}, {"l": "2Ti 4:4", "n": "", "vs": [[4, "فيحولون آذانهم بعيدا عن الحق، منحرفين إلى الخرافات."]]}, {"l": "Heb 12:25", "n": "", "vs": [[25, "إذن حذار أن ترفضوا الذي يتكلم! فمادام أولئك الذين رفضوا الاستماع لمن كلمهم على هذه الأرض، لم يفلتوا (من العقاب) قط، فكم بالأحرى لا نفلت نحن أبدا إن تحولنا عن الذي يتكلم إلينا من السماء عينها!"]]}, {"l": "2Pe 2:22", "n": "", "vs": [[22, "وينطبق على هؤلاء ما يقوله المثل الصادق: «عاد الكلب إلى تناول ما تقيأه، والخنزيرة المغتسلة إلى التمرغ في الوحل!»"]]}], "kwAr": "تحولوا عن الحق", "noteAr": ""}], "arS": [["لا ", []], ["يديرون عقولهم", ["G4337"]], [" إلى ", []], ["خرافات", ["G3454"]], [" ", []], ["يهودية", ["G2451"]], [" ", []], ["ووصايا", ["G1785"]], [" ", []], ["أناس", ["G444"]], [" ", []], ["تحولوا", ["G654"]], [" عن ", []], ["الحق", ["G225"]], [" بعيدا.", []]]}, {"c": 1, "v": 15, "text": "عند الطاهرين، كل شيء طاهر. أما عند النجسين وغير المؤمنين، فما من شيء طاهر، بل إن عقولهم وضمائرهم أيضا قد صارت نجسة.", "groups": [{"kw": "the pure", "raw": "Luk_11:39-41; Act_10:15; Rom_14:14, Rom_14:20; 1Co_6:12, 1Co_6:13, 1Co_10:23, 1Co_10:25, 1Co_10:31; 1Ti_4:3, 1Ti_4:4", "note": "", "refs": [{"l": "Luk 11:39-41", "n": "", "vs": [[39, "فقال له الرب: «أنتم الفريسيين تنظفون الكأس والصحفة من الخارج، ولكنكم من الداخل مملوؤون نهبا وخبثا."], [40, "أيها الأغبياء، أليس الذي صنع الخارج قد صنع الداخل أيضا؟"], [41, "أحرى بكم أن تتصدقوا بما عندكم، فإذا كل شيء يكون طاهرا لكم."]]}, {"l": "Act 10:15", "n": "", "vs": [[15, "فقال له الصوت أيضا: «ما طهره الله لا تحسبه أنت نجسا!»"]]}, {"l": "Rom 14:14", "n": "", "vs": [[14, "فأنا عالم، بل مقتنع من الرب يسوع، أنه لا شيء نجس في ذاته. أما إن اعتبر أحد شيئا ما نجسا، فهو نجس في نظره."]]}, {"l": "Rom 14:20", "n": "", "vs": [[20, "لا تدمر عمل الله بسبب الطعام! حقا إن الأطعمة كلها طاهرة، ولكن الشر في أن يأكل الإنسان شيئا يسبب العثرة."]]}, {"l": "1Co 6:12", "n": "", "vs": [[12, "كل شيء حلال لي، ولكن ليس كل شيء ينفع. كل شيء حلال لي، ولكني لن أدع أي شيء يسود علي."]]}, {"l": "1Co 6:13", "n": "", "vs": [[13, "الطعام للبطن، والبطن للطعام؛ ولكن الله سيبيد هذا وذاك. غير أن الجسد ليس للزنى، بل للرب؛ والرب للجسد."]]}, {"l": "1Co 10:23", "n": "", "vs": [[23, "كل شيء حلال، ولكن ليس كل شيء ينفع. كل شيء حلال، ولكن ليس كل شيء يبني."]]}, {"l": "1Co 10:25", "n": "", "vs": [[25, "فكل ما يباع في الملحمة، لكم أن تأكلوا منه، دونما استفهام لإرضاء الضمير."]]}, {"l": "1Co 10:31", "n": "", "vs": [[31, "فإذا أكلتم أو شربتم أو مهما فعلتم، فافعلوا كل شيء لتمجيد الله."]]}, {"l": "1Ti 4:3", "n": "", "vs": [[3, "يحرمون الزواج، ويأمرون بالامتناع عن أطعمة خلقها الله ليتناولها المؤمنون وعارفو الحق شاكرين."]]}, {"l": "1Ti 4:4", "n": "", "vs": [[4, "فإن كل ما خلقه الله جيد، ولا شيء منه يرفض إذا تناوله الإنسان شاكرا؛"]]}], "kwAr": "عند الطاهرين", "noteAr": ""}, {"kw": "but", "raw": "Pro_21:4; Hag_2:13; Zec_7:5, Zec_7:6; Mat_15:18; Rom_14:20,Rom_14:23; 1Co_11:27-29", "note": "", "refs": [{"l": "Pro 21:4", "n": "", "vs": [[4, "تشامخ العينين من غطرسة القلب، وسراج الأشرار خطيئة."]]}, {"l": "Hag 2:13", "n": "", "vs": [[13, "ثم سأل حجي: «إن لمس إنسان تنجس بمس ميت شيئا من هذه هل تصبح نجسة؟» فأجاب الكهنة: «نعم، تصبح نجسة»."]]}, {"l": "Zec 7:5", "n": "", "vs": [[5, "قل لجميع شعب الأرض والكهنة: «حين كنتم تصومون وتنوحون في الشهر الخامس والشهر السابع (أي تشرين ; الأول أكتوبر) في غضون سنوات المنفى السبعين، هل كان صيامكم حقا لي؟"]]}, {"l": "Zec 7:6", "n": "", "vs": [[6, "وحين تأكلون وتشربون، ألم يكن ذلك لإشباع نهمكم وإرواء أنفسكم؟"]]}, {"l": "Mat 15:18", "n": "", "vs": [[18, "أما ما يخرج من الفم، فإنه من القلب يصدر، وهو الذي ينجس الإنسان."]]}, {"l": "Rom 14:20", "n": "", "vs": [[20, "لا تدمر عمل الله بسبب الطعام! حقا إن الأطعمة كلها طاهرة، ولكن الشر في أن يأكل الإنسان شيئا يسبب العثرة."]]}, {"l": "Rom 14:23", "n": "", "vs": [[23, "وأما من يشك، فإذا أكل يحكم عليه، لأن ذلك ليس عن إيمان. وكل ما لا يصدر عن الإيمان، فهو خطيئة."]]}, {"l": "1Co 11:27-29", "n": "", "vs": [[27, "فمن أكل الخبز، أو شرب كأس الرب بغير استحقاق، يكون مذنبا تجاه جسد الرب ودمه."], [28, "ولكن، ليفحص الإنسان نفسه، ثم يأكل من الخبز ويشرب من الكأس."], [29, "لأن الآكل والشارب يأكل ويشرب الحكم على نفسه إذ لا يميز جسد الرب."]]}], "kwAr": "أما عند النجسين", "noteAr": ""}, {"kw": "their", "raw": "1Co_8:7; Heb_9:14, Heb_10:22", "note": "", "refs": [{"l": "1Co 8:7", "n": "", "vs": [[7, "على أن هذه الحقيقة لا يعرفها الجميع: فبعضهم قد تعودوا الظن بأن الأصنام موجودة فعلا، ومازالوا يأكلون من تلك الذبائح كأنها فعلا مقدمة لها، فيتدنس ضميرهم بسبب ضعفه."]]}, {"l": "Heb 9:14", "n": "", "vs": [[14, "فكم بالأحرى دم المسيح الذي قدم نفسه لله بروح أزلي ذبيحة لا عيب فيها، يطهر ضمائرنا من الأعمال الميتة لنعبد الله الحي."]]}, {"l": "Heb 10:22", "n": "", "vs": [[22, "فلنتقدم إلى حضرة الله بقلب صادق وبثقة الإيمان الكاملة، بعدما طهر رش الدم قلوبنا من كل شعور بالذنب، وغسل الماء النقي أجسادنا."]]}], "kwAr": "عقولهم وضمائرهم", "noteAr": ""}], "arS": [["عند ", []], ["الطاهرين", ["G2513"]], ["، ", []], ["كل شيء", ["G3956"]], [" ", []], ["طاهر", ["G2513"]], [". أما عند ", []], ["النجسين", ["G3392"]], [" ", []], ["وغير المؤمنين", ["G571"]], ["، فما من شيء ", []], ["طاهر", ["G2513"]], ["، بل إن ", []], ["عقولهم", ["G3563"]], [" ", []], ["وضمائرهم", ["G4893"]], [" أيضا قد صارت ", []], ["نجسة", ["G3392"]], [".", []]]}, {"c": 1, "v": 16, "text": "يشهدون معترفين بأنهم يعرفون الله ، ولكنهم بأعمالهم ينكرونه، لأنهم مكروهون وغير طائعين، وقد تبين أنهم غير أهل لكل عمل صالح.", "groups": [{"kw": "profess", "raw": "Num_24:16; Isa_29:13, Isa_48:1, Isa_58:2; Eze_33:31; Hos_8:2, Hos_8:3; Rom_2:18-24; 2Ti_3:5-8; Jud_1:4", "note": "", "refs": [{"l": "Num 24:16", "n": "", "vs": [[16, "كلام من يسمع أقوال الله، ويتلقى المعرفة من العلي، الذي يشاهد رؤيا القدير، الذي ينطرح فتنفتح عيناه."]]}, {"l": "Isa 29:13", "n": "", "vs": [[13, "لذلك يقول الرب: لأن هذا الشعب يقترب مني بفمه ويكرمني بشفتيه، بينما قلبه بعيد عنى. وما مخافتهم مني سوى تقليد تلقنوه من الناس."]]}, {"l": "Isa 48:1", "n": "", "vs": [[1, "اسمعوا هذا يابيت يعقوب المدعوين باسم إسرائيل الخارجين من صلب يهوذا، الحالفين باسم الرب، المستشهدين بإله إسرائيل باطلا وكذبا"]]}, {"l": "Isa 58:2", "n": "", "vs": [[2, "ومع ذلك، فإنهم يلتمسونني يوميا، ويسرون بمعرفة طرقي وكأنهم أمة تصنع برا، وكأنهم لم يهملوا أحكام إلههم، يطلبون مني أحكام بر، ويغتبطون بالتقرب من الله."]]}, {"l": "Eze 33:31", "n": "", "vs": [[31, "ويقبلون إليك مثل سائر الشعب ويجلسون في حضرتك نظير شعبي، ويصغون إلى كلامك ولا يعملون به. إنهم يعربون عن أشواقهم بكلامهم، أما قلبهم فقد غوى وراء مكسبهم."]]}, {"l": "Hos 8:2", "n": "", "vs": [[2, "يستغيثون بي قائلين: «ياإلهنا، إننا نعرفك، فنحن إسرائيل شعبك»."]]}, {"l": "Hos 8:3", "n": "", "vs": [[3, "غير أن إسرائيل قد مقت الخير، لهذا يطارده عدو."]]}, {"l": "Rom 2:18-24", "n": "", "vs": [[18, "وتميز ما هو الأفضل بسبب ما تعلمته من الشريعة؛"], [19, "ولك ثقة في نفسك بأنك قائد للعميان، ونور للذين في الظلام،"], [20, "ومؤدب للجهال، ومعلم للأطفال؛ ولك في الشريعة صورة المعرفة والحق؛"], [21, "فأنت إذن، يامن تعلم غيرك، أما تعلم نفسك؟ أنت يامن تعظ أن لا يسرق، أتسرق؟"], [22, "أنت يامن تنهى عن الزنى، أتزني؟ أنت يامن تستنكر الأصنام، أتسرق الهياكل"], [23, "الذي تفتخر بالشريعة، أتهين الله بمخالفة الشريعة؟"], [24, "فإن «اسم الله يجدف عليه بين الأمم بسببكم»، كما هو مكتوب."]]}, {"l": "2Ti 3:5-8", "n": "", "vs": [[5, "لهم من التقوى مظهرها ولكنهم لقوتها منكرون، فعن هؤلاء الناس ابتعد!"], [6, "فمن هؤلاء من يدخلون البيوت خلسة، ويوقعون في حبائلهم بعض النساء السخيفات المثقلات بالخطايا، اللواتي تجرفهن شهوات مختلفة،"], [7, "يصغين للتعليم دائما، ولا يستطعن أبدا أن يبلغن معرفة الحق بالتمام!"], [8, "ومثلما قاوم (الساحران) ينيس ويمبريس موسى، كذلك أيضا يقاوم هؤلاء الحق؛ أناس عقولهم فاسدة، وقد تبين أنهم غير أهل للإيمان."]]}, {"l": "Jud 1:4", "n": "", "vs": [[4, "لأنه قد تسلل إلى ما بينكم معلمون لابد أن يلاقوا الحكم بالعقاب الأبدي، كما هو مكتوب لهم منذ القديم. فهم أشرار لا يهابون الله ، يتخذون من نعمة إلهنا فرصة لإباحة الرذائل، وينكرون سيدنا وربنا الوحيد يسوع المسيح."]]}], "kwAr": "يشهدون معترفين", "noteAr": ""}, {"kw": "being", "raw": "Job_15:16; Rev_21:8, Rev_21:27", "note": "", "refs": [{"l": "Job 15:16", "n": "", "vs": [[16, "فكم بالأحرى يكون الإنسان الشارب الإثم كالماء مكروها وفاسدا!"]]}, {"l": "Rev 21:8", "n": "", "vs": [[8, "أما الجبناء وغير المؤمنين، والفاسدون والقاتلون والزناة، والمتصلون بالشياطين وعبدة الأصنام وجميع الدجالين، فمصيرهم إلى البحيرة المتقدة بالنار والكبريت، الذي هو الموت الثاني»."]]}, {"l": "Rev 21:27", "n": "", "vs": [[27, "ولن يدخلها شيء نجس، ولا الذين يعملون القبائح ويدجلون، بل فقط الذين كتبت أسماؤهم في سجل الحياة للحمل!"]]}], "kwAr": "لأنهم مكروهون", "noteAr": ""}, {"kw": "and disobedient", "raw": "1Sa_15:22, 1Sa_15:24; Eph_5:6; 1Ti_1:9", "note": "", "refs": [{"l": "1Sa 15:22", "n": "", "vs": [[22, "فقال صموئيل: «هل يسر الرب بالذبائح والمحرقات كسروره بالاستماع إلى صوته؟ إن الاستماع أفضل من الذبيحة، والإصغاء أفضل من شحم الكباش."]]}, {"l": "1Sa 15:24", "n": "", "vs": [[24, "فقال شاول: «لقد أخطأت لأني عصيت أمر الرب ووصيتك، إذ خشيت الشعب فسمعت لقولهم."]]}, {"l": "Eph 5:6", "n": "", "vs": [[6, "لا يخدعكم أحد بكلام باطل! فبسبب هذه الأمور يحل غضب الله على أبناء العصيان."]]}, {"l": "1Ti 1:9", "n": "", "vs": [[9, "إذ ندرك أن الشريعة لا تطبق على من كان بارا، بل على الأشرار والمتمردين، على الفاجرين والخاطئين، والنجسين والدنسين، وقاتلي آبائهم وأمهاتهم، وقاتلي الناس،"]]}], "kwAr": "وغير طائعين", "noteAr": ""}, {"kw": "unto", "raw": "Jer_6:30; Rom_1:28; 2Ti_3:8", "note": "", "refs": [{"l": "Jer 6:30", "n": "", "vs": [[30, "وهم يدعون حثالة الفضة المرذولة، لأن الرب قد رفضهم»."]]}, {"l": "Rom 1:28", "n": "", "vs": [[28, "وبما أنهم لم يتخيروا إبقاء الله ضمن معرفتهم، أسلمهم الله إلى ذهن عاطل عن التمييز دفعهم إلى ممارسة الأمور غير اللائقة."]]}, {"l": "2Ti 3:8", "n": "", "vs": [[8, "ومثلما قاوم (الساحران) ينيس ويمبريس موسى، كذلك أيضا يقاوم هؤلاء الحق؛ أناس عقولهم فاسدة، وقد تبين أنهم غير أهل للإيمان."]]}], "kwAr": "لكل عمل صالح", "noteAr": ""}, {"kw": "reprobate", "raw": "or, void of judgment", "note": "or, void of judgment", "refs": [], "kwAr": "غير أهل", "noteAr": "أو: عديمو التمييز."}], "arS": [["يشهدون ", []], ["معترفين", ["G3670"]], [" بأنهم ", []], ["يعرفون", ["G1492"]], [" ", []], ["الله", ["G2316"]], [" ، ولكنهم ", []], ["بأعمالهم", ["G2041"]], [" ", []], ["ينكرونه", ["G720"]], ["، لأنهم ", []], ["مكروهون", ["G947"]], [" ", []], ["وغير طائعين", ["G545"]], ["، وقد تبين أنهم ", []], ["غير أهل", ["G96"]], [" ", []], ["لكل", ["G3956"]], [" ", []], ["عمل", ["G2041"]], [" ", []], ["صالح", ["G18"]], [".", []]]}, {"c": 2, "v": 1, "text": "أما أنت، فعلم بما يوافق التعليم الصحيح:", "groups": [{"kw": "", "raw": "Tit_2:11-14, Tit_1:9, Tit_3:8; 1Ti_1:10, 1Ti_6:3; 2Ti_1:13", "note": "", "refs": [{"l": "Tit 2:11-14", "n": "", "vs": [[11, "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت."], [12, "وهي تعلمنا أن نقطع علاقتنا بالإباحية والشهوات العالمية، وأن نحيا في العصر الحاضر حياة التعقل والبر والتقوى،"], [13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"], [14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Tit 1:9", "n": "", "vs": [[9, "ملتصقا بالكلمة الصادقة الموافقة للتعليم، ليكون قادرا على تشجيع المؤمنين بالتعليم الصحيح وعلى إفحام المعارضين."]]}, {"l": "Tit 3:8", "n": "", "vs": [[8, "صادق هذا القول! وأريد أن تقرر هذه الأمور قرارا حاسما، حتى يهتم الذين آمنوا بالله بأن يجتهدوا في الأعمال الصالحة. هذه الأمور حسنة ونافعة للناس."]]}, {"l": "1Ti 1:10", "n": "", "vs": [[10, "والزناة ومضاجعي الذكور، وخطافي الناس والكذابين وشاهدي الزور. وذوي كل شر آخر يخالف التعليم الصحيح"]]}, {"l": "1Ti 6:3", "n": "", "vs": [[3, "أما إذا كان أحد يعلم ما يخالفها ولا يذعن للكلام الصحيح، كلام ربنا يسوع المسيح، وللتعليم الموافق للتقوى،"]]}, {"l": "2Ti 1:13", "n": "", "vs": [[13, "اتخذ من الكلام الصحيح الذي سمعته مني مثالا في الإيمان والمحبة اللذين في المسيح يسوع."]]}], "kwAr": "", "noteAr": ""}], "arS": [["أما أنت، ", []], ["فعلم", ["G2980"]], [" بما ", []], ["يوافق", ["G4241"]], [" ", []], ["التعليم", ["G1319"]], [" ", []], ["الصحيح", ["G5198"]], [":", []]]}, {"c": 2, "v": 2, "text": "أن يكون الشيوخ ذوي رزانة ووقار، متعقلين، صحيحي الإيمان والمحبة والصبر.", "groups": [{"kw": "the", "raw": "Lev_19:32; Job_12:12; Psa_92:14; Pro_16:31; Isa_65:20", "note": "", "refs": [{"l": "Lev 19:32", "n": "", "vs": [[32, "قف في حضرة كبار السن، ووقر الشيوخ، واتق إلهك، فأنا الرب."]]}, {"l": "Job 12:12", "n": "", "vs": [[12, "الحكمة تلازم الشيخوخة، وفي طول الأيام فهم."]]}, {"l": "Psa 92:14", "n": "", "vs": [[14, "يثمرون أيضا في الشيخوخة، ويظلون موفوري العافية والنضرة"]]}, {"l": "Pro 16:31", "n": "", "vs": [[31, "الشيبة إكليل بهاء، ولا سيما في طريق البر."]]}, {"l": "Isa 65:20", "n": "", "vs": [[20, "ولا يكون فيها بعد طفل لا يعيش سوى أيام قلائل، أو شيخ لا يستوفي أيامه. ومن يموت ابن مئة سنة يعتبر فتى، ومن لا يبلغها يكون ملعونا."]]}], "kwAr": "الشيوخ", "noteAr": ""}, {"kw": "sober", "raw": "or, vigilant, 1Co_15:34; 1Th_5:6, 1Th_5:8; 1Ti_3:2, 1Ti_3:11; 1Pe_1:13, 1Pe_4:7, 1Pe_5:8 *Gr.", "note": "or, vigilant, 1Co_15:34; 1Th_5:6, 1Th_5:8; 1Ti_3:2, 1Ti_3:11; 1Pe_1:13, 1Pe_4:7, 1Pe_5:8 *Gr.", "refs": [{"l": "1Co 15:34", "n": "", "vs": [[34, "عودوا إلى الصواب كما يجب ولا تخطئوا، فإن بعضا منكم يجهلون الله تماما أقول هذا لكي تخجلوا!"]]}, {"l": "1Th 5:6", "n": "", "vs": [[6, "إذن، لا ننم كما ينام الآخرون، بل لنظل ساهرين وصاحين،"]]}, {"l": "1Th 5:8", "n": "", "vs": [[8, "وأما نحن، أهل النهار، فلنظل صاحين، متخذين من الإيمان والمحبة درعا لصدورنا، ومن الرجاء بالخلاص خوذة لرؤوسنا."]]}, {"l": "1Ti 3:2", "n": "", "vs": [[2, "إذن، يجب أن يكون الراعي بلا عيب، زوجا لامرأة واحدة، نبيها عاقلا مهذبا مضيافا، قادرا على التعليم؛"]]}, {"l": "1Ti 3:11", "n": "", "vs": [[11, "كذلك يجب أن تكون النساء أيضا رزينات، غير نمامات، نبيهات، أمينات في كل شيء."]]}, {"l": "1Pe 1:13", "n": "", "vs": [[13, "لذلك اجعلوا أذهانكم متنبهة دائما، وتيقظوا، وعلقوا رجاءكم كله على النعمة التي ستكون من نصيبكم عندما يعود يسوع المسيح ظاهرا بمجده!"]]}, {"l": "1Pe 4:7", "n": "", "vs": [[7, "إن نهاية كل شيء قد صارت قريبة. فتعقلوا إذن، وكونوا متنبهين لرفع الصلاة دائما."]]}, {"l": "1Pe 5:8", "n": "*Gr.", "vs": [[8, "تعقلوا وتنبهوا. إن خصمكم إبليس كأسد يزأر، يجول باحثا عن فريسة يبتلعها."]]}], "kwAr": "ذوي رزانة", "noteAr": "أو: ساهرين (يقظين). وفي اليونانية بهذا المعنى."}, {"kw": "grave", "raw": "Tit_2:7; 1Ti_3:4, 1Ti_3:8, 1Ti_3:11; Phi_4:8 *Gr.", "note": "", "refs": [{"l": "Tit 2:7", "n": "", "vs": [[7, "جاعلا من نفسك في كل شيء قدوة للأعمال الصالحة، مظهرا في تعليمك النقاوة والوقار"]]}, {"l": "1Ti 3:4", "n": "", "vs": [[4, "يحسن تدبير بيته، ويربي أولاده في الخضوع بكل احترام."]]}, {"l": "1Ti 3:8", "n": "", "vs": [[8, "أما المدبرون، فيجب أن يكونوا أيضا ذوي رصانة، لا ذوي لسانين، ولا مدمنين للخمر، لا ساعين إلى المكسب الخسيس."]]}, {"l": "1Ti 3:11", "n": "", "vs": [[11, "كذلك يجب أن تكون النساء أيضا رزينات، غير نمامات، نبيهات، أمينات في كل شيء."]]}, {"l": "Phi 4:8", "n": "*Gr.", "vs": [[8, "وختاما، أيها الإخوة: كل ما كان حقا، وكل ما كان شريفا، وكل ما كان عادلا، وكل ما كان طاهرا وكل ما كان مستحبا، وكل ما كان حسن السمعة، وكل ما كان فيه فضيلة وخصلة حميدة، فاشغلوا أفكاركم به."]]}], "kwAr": "ووقار", "noteAr": ""}, {"kw": "temperate", "raw": "Tit_1:8; Act_24:25; 1Co_9:25; Gal_5:23; 2Pe_1:6; Mar_5:15; Luk_8:35; Rom_12:3; 2Co_5:13; 1Pe_4:7 *Gr.", "note": "", "refs": [{"l": "Tit 1:8", "n": "", "vs": [[8, "بل مضيافا، محبا للصلاح، رزينا، بارا، تقيا، مالكا لطبعه،"]]}, {"l": "Act 24:25", "n": "", "vs": [[25, "ولما تحدث بولس عن البر وضبط النفس والدينونة الآتية ارتعب فيلكس، وقال لبولس: «اذهب الآن، ومتى توفر لي الوقت أستدعيك ثانية»."]]}, {"l": "1Co 9:25", "n": "", "vs": [[25, "وكل متبار يفرض على نفسه تدريبا صارما في شتى المجالات. فهؤلاء المتبارون يفعلون ذلك ليفوزوا بإكليل فان، وأما نحن فلنفوز بإكليل غير فان."]]}, {"l": "Gal 5:23", "n": "", "vs": [[23, "والوداعة وضبط النفس. وليس من قانون يمنع مثل هذه الفضائل."]]}, {"l": "2Pe 1:6", "n": "", "vs": [[6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"]]}, {"l": "Mar 5:15", "n": "", "vs": [[15, "وجاءوا إلى يسوع، فرأوا الذي كان مسكونا بالشياطين جالسا ولابسا وصحيح العقل، فاستولى عليهم الخوف."]]}, {"l": "Luk 8:35", "n": "", "vs": [[35, "فخرج الناس ليروا ما حدث، وجاءوا إلى يسوع، فوجدوا الرجل الذي خرجت منه الشياطين جالسا عند قدمي يسوع وهو لابس وسليم العقل. فخافوا."]]}, {"l": "Rom 12:3", "n": "", "vs": [[3, "فإني، بالنعمة الموهوبة لي، أوصي كل واحد بينكم ألا يقدر نفسه تقديرا يفوق حقه، بل أن يكون متعقلا في تفكيره، بحسب مقدار الإيمان الذي قسمه الله لكل منكم."]]}, {"l": "2Co 5:13", "n": "", "vs": [[13, "أترانا فقدنا صوابنا؟ إن ذلك لأجل الله. أم ترانا متعقلين؟ إن ذلك لأجلكم."]]}, {"l": "1Pe 4:7", "n": "*Gr.", "vs": [[7, "إن نهاية كل شيء قد صارت قريبة. فتعقلوا إذن، وكونوا متنبهين لرفع الصلاة دائما."]]}], "kwAr": "متعقلين", "noteAr": ""}, {"kw": "sound", "raw": "Tit_1:13", "note": "", "refs": [{"l": "Tit 1:13", "n": "", "vs": [[13, "وهذه شهادة صدق. لذلك كن متشددا في توبيخهم، ليكونوا أصحاء في الإيمان،"]]}], "kwAr": "صحيحي الإيمان", "noteAr": ""}, {"kw": "in patience", "raw": "1Ti_1:5", "note": "", "refs": [{"l": "1Ti 1:5", "n": "", "vs": [[5, "أما الغاية مما أوصيتك به، فهي المحبة النابعة من قلب طاهر وضمير صالح وإيمان خال من الرياء."]]}], "kwAr": "والصبر", "noteAr": ""}], "arS": [["أن يكون ", []], ["الشيوخ", ["G4246"]], [" ذوي ", []], ["رزانة", ["G3524"]], [" ", []], ["ووقار", ["G4586"]], ["، ", []], ["متعقلين", ["G4998"]], ["، ", []], ["صحيحي", ["G5198"]], [" ", []], ["الإيمان", ["G4102"]], [" ", []], ["والمحبة", ["G26"]], [" ", []], ["والصبر", ["G5281"]], [".", []]]}, {"c": 2, "v": 3, "text": "وكذلك أن تكون العجائز ذوات سيرة موافقة للقداسة، غير نمامات ولا مدمنات للخمر، بل معلمات لما هو صالح،", "groups": [{"kw": "as", "raw": "Rom_16:2; Eph_5:3; 1Ti_2:9, 1Ti_2:10, 1Ti_3:11, 1Ti_5:5-10; 1Pe_3:3-5", "note": "", "refs": [{"l": "Rom 16:2", "n": "", "vs": [[2, "فاقبلوها في الرب قبولا يليق بالقديسين وقدموا لها أي عون تحتاج إليه منكم، لأنها هي كانت معينة لكثيرين ولي أنا أيضا."]]}, {"l": "Eph 5:3", "n": "", "vs": [[3, "أما الزنى، وكل نجاسة أو شهوة نهمة، فلا يذكر بينكم حتى اسمها، كما يليق بالقديسين."]]}, {"l": "1Ti 2:9", "n": "", "vs": [[9, "كما أريد أيضا، أن تظهر النساء بمظهر لائق محشوم اللباس، متزينات بالحياء والرزانة، غير متحليات بالجدائل والذهب واللاليء والحلل الغالية الثمن،"]]}, {"l": "1Ti 2:10", "n": "", "vs": [[10, "بل بما يليق بنساء يعترفن علنا بأنهن يعشن في تقوى الله، بالأعمال الصالحة!"]]}, {"l": "1Ti 3:11", "n": "", "vs": [[11, "كذلك يجب أن تكون النساء أيضا رزينات، غير نمامات، نبيهات، أمينات في كل شيء."]]}, {"l": "1Ti 5:5-10", "n": "", "vs": [[5, "ولكن الأرملة التي تعيش وحيدة ولا معيل لها، فقد وضعت رجاءها في الله وهي تداوم على الأدعية والصلوات ليلا ونهارا."], [6, "أما تلك التي تعيش منغمسة في اللذات، فقد ماتت، وإن كانت حية."], [7, "وعليك أن توصي بهذه الأمور، لكي يكون الجميع بلا لوم."], [8, "فإذا كان أحد لا يهتم بذويه، وبخاصة بأهل بيته، فقد أنكر الإيمان، وهو أسوأ من غير المؤمن."], [9, "لتقيد في سجل الأرامل من بلغت سن الستين على الأقل، على أن تكون قد تزوجت من رجل واحد،"], [10, "ويكون مشهودا لها بالأعمال الصالحة، كأن تكون قد ربت الأولاد، وأضافت الغرباء، وغسلت أقدام القديسين، وأسعفت المتضايقين، ومارست كل عمل صالح!"]]}, {"l": "1Pe 3:3-5", "n": "", "vs": [[3, "وعلى المرأة ألا تعتمد الزينة الخارجية لإظهار جمالها، بضفر الشعر والتحلي بالذهب ولبس الثياب الفاخرة."], [4, "وإنما لتعتمد الزينة الداخلية، ليكون قلبها متزينا بروح الوداعة والهدوء. هذه هي الزينة التي لا تفنى، وهي غالية الثمن في نظر الله!"], [5, "وبها كانت تتزين النساء التقيات قديما، فكانت الواحدة منهن تتكل على الله وتخضع لزوجها."]]}], "kwAr": "ذوات سيرة", "noteAr": ""}, {"kw": "holiness", "raw": "or holy women", "note": "or holy women", "refs": [], "kwAr": "موافقة للقداسة", "noteAr": "أو: كما يليق بالنساء القديسات."}, {"kw": "false accusers", "raw": "or, makebates, 1Ti_3:8, 1Ti_3:11", "note": "or, makebates, 1Ti_3:8, 1Ti_3:11", "refs": [{"l": "1Ti 3:8", "n": "", "vs": [[8, "أما المدبرون، فيجب أن يكونوا أيضا ذوي رصانة، لا ذوي لسانين، ولا مدمنين للخمر، لا ساعين إلى المكسب الخسيس."]]}, {"l": "1Ti 3:11", "n": "", "vs": [[11, "كذلك يجب أن تكون النساء أيضا رزينات، غير نمامات، نبيهات، أمينات في كل شيء."]]}], "kwAr": "غير نمامات", "noteAr": "أو: مثيرات للفتن (نمّامات)."}, {"kw": "not given", "raw": "Tit_1:7", "note": "", "refs": [{"l": "Tit 1:7", "n": "", "vs": [[7, "وذلك لأن الناظر يجب أن يكون بريئا من كل تهمة باعتباره وكيلا لله، لا معجبا بنفسه ولا حاد الطبع، ولا مدمن الخمر، ولا عنيفا، ولا ساعيا إلى المكسب الخسيس؛"]]}], "kwAr": "ولا مدمنات للخمر", "noteAr": ""}, {"kw": "teachers", "raw": "Tit_2:4; Heb_5:12; Rev_2:20", "note": "", "refs": [{"l": "Tit 2:4", "n": "", "vs": [[4, "لكي يدربن الشابات على أن يكن محبات لأزواجهن ولأولادهن،"]]}, {"l": "Heb 5:12", "n": "", "vs": [[12, "كان يجب أن تكونوا الآن قادرين على تعليم الآخرين، بعدما مضى زمان طويل على اهتدائكم. ولكنكم مازلتم بحاجة إلى من يعلمكم حتى المباديء الأساسية لإعلانات الله. ها قد عدتم من جديد تحتاجون إلى اللبن! فأنتم غير قادرين على هضم الطعام القوي."]]}, {"l": "Rev 2:20", "n": "", "vs": [[20, "ولكن لي عليك أنك تتساهل مع هذه المرأة إيزابل، التي تدعي أنها نبية، فتعلم عبيدي وتغويهم أن يزنوا ويأكلوا من الذبائح المقدمة للأصنام."]]}], "kwAr": "معلمات لما هو صالح", "noteAr": ""}], "arS": [["وكذلك", ["G5615"]], [" أن تكون ", []], ["العجائز", ["G4247"]], [" ذوات ", []], ["سيرة", ["G2688"]], [" ", []], ["موافقة للقداسة", ["G2412"]], ["، غير ", []], ["نمامات", ["G1228"]], [" ولا ", []], ["مدمنات", ["G1402"]], [" ", []], ["للخمر", ["G3631"]], ["، بل ", []], ["معلمات لما هو صالح", ["G2567"]], ["،", []]]}, {"c": 2, "v": 4, "text": "لكي يدربن الشابات على أن يكن محبات لأزواجهن ولأولادهن،", "groups": [{"kw": "the", "raw": "1Ti_5:2, 1Ti_5:11, 1Ti_5:14", "note": "", "refs": [{"l": "1Ti 5:2", "n": "", "vs": [[2, "والعجائز كأنهن أمهات؛ والشابات كأنهن أخوات، بكل طهارة."]]}, {"l": "1Ti 5:11", "n": "", "vs": [[11, "أما الأرامل الشابات، فلا تقيدهن. إذ عندما يبطرن على المسيح، يرغبن في الزواج،"]]}, {"l": "1Ti 5:14", "n": "", "vs": [[14, "فأريد إذن أن تتزوج الأرامل الشابات، فيلدن الأولاد، ويدبرن بيوتهن، ولا يفسحن للمقاوم في المجال للطعن في سلوكهن."]]}], "kwAr": "الشابات", "noteAr": ""}, {"kw": "sober", "raw": "or, wise, Tit_2:2", "note": "or, wise, Tit_2:2", "refs": [{"l": "Tit 2:2", "n": "", "vs": [[2, "أن يكون الشيوخ ذوي رزانة ووقار، متعقلين، صحيحي الإيمان والمحبة والصبر."]]}], "kwAr": "يدربن", "noteAr": "أو: حكيمات."}, {"kw": "to love their husbands", "raw": "1Ti_5:14", "note": "", "refs": [{"l": "1Ti 5:14", "n": "", "vs": [[14, "فأريد إذن أن تتزوج الأرامل الشابات، فيلدن الأولاد، ويدبرن بيوتهن، ولا يفسحن للمقاوم في المجال للطعن في سلوكهن."]]}], "kwAr": "محبات لأزواجهن", "noteAr": ""}], "arS": [["لكي ", []], ["يدربن", ["G4994"]], [" ", []], ["الشابات", ["G3501"]], [" على أن يكن ", []], ["محبات لأزواجهن", ["G5362"]], [" ", []], ["ولأولادهن", ["G5388"]], ["،", []]]}, {"c": 2, "v": 5, "text": "متعقلات، عفيفات، مهتمات بشؤون بيوتهن صالحات، خاضعات لأزواجهن، حتى لا يتكلم أحد بالسوء على كلمة الله.", "groups": [{"kw": "discreet", "raw": "Tit_2:2", "note": "", "refs": [{"l": "Tit 2:2", "n": "", "vs": [[2, "أن يكون الشيوخ ذوي رزانة ووقار، متعقلين، صحيحي الإيمان والمحبة والصبر."]]}], "kwAr": "متعقلات", "noteAr": ""}, {"kw": "keepers", "raw": "Gen_16:8, Gen_16:9, Gen_18:9; Pro_7:11, 31:10-31; 1Ti_5:13", "note": "", "refs": [{"l": "Gen 16:8", "n": "", "vs": [[8, "فقال: «ياهاجر جارية ساراي، من أين جئت؟ وإلى أين تذهبين؟». فأجابت: «إنني هاربة من وجه سيدتي ساراي»."]]}, {"l": "Gen 16:9", "n": "", "vs": [[9, "فقال لها ملاك الرب: «عودي إلى مولاتك واخضعي لها»."]]}, {"l": "Gen 18:9", "n": "", "vs": [[9, "ثم سألوه: «أين زوجتك؟» فأجاب: «ها هي في الخيمة»."]]}, {"l": "Pro 7:11", "n": "", "vs": [[11, "صخابة وجامحة لا تستقر قدماها في بيتها."]]}, {"l": "Pro 31:10-31", "n": "", "vs": [[10, "من يعثر على المرأة الفاضلة؟ إن قيمتها تفوق اللآليء."], [11, "بها يثق قلب زوجها فلا يحتاج إلى ما هو نفيس."], [12, "تسبغ عليه الخير دون الشر كل أيام حياتها."], [13, "تلتمس صوفا وكتانا وتشتغل بيدين راضيتين،"], [14, "فتكون كسفن التاجر التي تجلب طعامها من بلاد نائية."], [15, "تنهض والليل ما برح مخيما، لتعد طعاما لأهل بيتها، وتدبر أعمال جواريها"], [16, "تتفحص حقلا وتشتريه، ومن مكسب يديها تغرس كرما"], [17, "تنطق حقويها بالقوة وتشدد ذراعيها."], [18, "وتدرك أن تجارتها رابحة، ولا ينطفيء سراجها في الليل."], [19, "تقبض بيديها على المغزل وتمسك كفاها بالفلكة."], [20, "تبسط كفيها للفقير وتمد يديها لإغاثة البائس."], [21, "لا تخشى على أهل بيتها من الثلج، لأن جميعهم يرتدون الحلل القرمزية."], [22, "تصنع لنفسها أغطية موشاة، وثيابها محاكة من كتان وأرجوان."], [23, "زوجها معروف في مجالس بوابات المدينة، حيث يجلس بين وجهاء البلاد."], [24, "تصنع أقمصة كتانية وتبيعها، وتزود التاجر الكنعاني بمناطق."], [25, "كساؤها العزة والشرف، وتبتهج بالأيام المقبلة."], [26, "ينطق فمها بالحكمة، وفي لسانها سنة المعروف."], [27, "ترعى بعناية شؤون أهل بيتها، ولا تأكل خبز الكسل."], [28, "يقوم أبناؤها ويغبطونها، ويطريها زوجها أيضا قائلا:"], [29, "«نساء كثيرات قمن بأعمال جليلة، ولكنك تفوقت عليهن جميعا»."], [30, "الحسن غش والجمال باطل، أما المرأة المتقية الرب فهي التي تمدح."], [31, "أعطوها من ثمر يديها، ولتكن أعمالها مصدر الثناء عليها."]]}, {"l": "1Ti 5:13", "n": "", "vs": [[13, "وفي الوقت نفسه يتعودن البطالة والتنقل من بيت إلى بيت. ولا تكفيهن البطالة، بل ينصرفن أيضا إلى الثرثرة والتشاغل بما لا يعنيهن والتحدث بأمور غير لائقة."]]}], "kwAr": "مهتمات بشؤون بيوتهن", "noteAr": ""}, {"kw": "good", "raw": "Act_9:36, Act_9:39; 1Ti_5:10", "note": "", "refs": [{"l": "Act 9:36", "n": "", "vs": [[36, "وكان في مدينة يافا تلميذة اسمها طابيثا، ومعنى اسمها: غزالة، كان يشغلها دائما فعل الخير ومساعدة الفقراء."]]}, {"l": "Act 9:39", "n": "", "vs": [[39, "فقام وذهب. ولما وصل قادوه إلى الطبقة العليا، فتقدمت إليه جميع الأرامل باكيات، يعرضن بعض الأقمصة والثياب مما كانت غزالة تخيطه وهي معهن."]]}, {"l": "1Ti 5:10", "n": "", "vs": [[10, "ويكون مشهودا لها بالأعمال الصالحة، كأن تكون قد ربت الأولاد، وأضافت الغرباء، وغسلت أقدام القديسين، وأسعفت المتضايقين، ومارست كل عمل صالح!"]]}], "kwAr": "صالحات", "noteAr": ""}, {"kw": "obedient", "raw": "Gen_3:16; 1Co_11:3, 1Co_14:34; Eph_5:22-24, Eph_5:33; Col_3:18; 1Ti_2:11, 1Ti_2:12; 1Pe_3:1-5", "note": "", "refs": [{"l": "Gen 3:16", "n": "", "vs": [[16, "ثم قال للمرأة: «أكثر تكثيرا أوجاع مخاضك فتنجبين بالآلام أولادا، وإلى زوجك يكون اشتياقك وهو يتسلط عليك»."]]}, {"l": "1Co 11:3", "n": "", "vs": [[3, "ولكني أريد أن تعلموا أن المسيح هو الرأس لكل رجل؛ أما رأس المرأة فهو الرجل، ورأس المسيح هو الله ."]]}, {"l": "1Co 14:34", "n": "", "vs": [[34, "لتصمت النساء في الكنائس، فليس مسموحا لهن أن يتكلمن، بل عليهن أن يكن خاضعات، على حد ما توصي به الشريعة أيضا."]]}, {"l": "Eph 5:22-24", "n": "", "vs": [[22, "أيتها الزوجات، اخضعن لأزواجكن، كما للرب."], [23, "فإن الزوج هو رأس الزوجة كما أن المسيح أيضا هو رأس الكنيسة (جسده)، وهو نفسه مخلص الجسد."], [24, "فكما أن الكنيسة قد أخضعت للمسيح، فكذلك الزوجات أيضا لأزواجهن، في كل شيء."]]}, {"l": "Eph 5:33", "n": "", "vs": [[33, "إنما أنتم أيضا، كل بمفرده، ليحب كل واحد منكم زوجته كنفسه. وأما الزوجة، فعليها أن تهاب زوجها."]]}, {"l": "Col 3:18", "n": "", "vs": [[18, "أيتها الزوجات اخضعن لأزواجكن كما يليق (بالعيشة) في الرب."]]}, {"l": "1Ti 2:11", "n": "", "vs": [[11, "على المرأة أن تتلقى التعليم بسكوت وبكل خضوع."]]}, {"l": "1Ti 2:12", "n": "", "vs": [[12, "ولست أسمح للمرأة أن تعلم ولا تتسلط على الرجل. بل عليها أن تلزم السكوت."]]}, {"l": "1Pe 3:1-5", "n": "", "vs": [[1, "كذلك، أيتها الزوجات، اخضعن لأزواجكن. حتى وإن كان الزوج غير مؤمن بالكلمة، تجذبه زوجته إلى الإيمان، بتصرفها اللائق دون كلام،"], [2, "وذلك حين يلاحظ سلوكها الطاهر ووقارها."], [3, "وعلى المرأة ألا تعتمد الزينة الخارجية لإظهار جمالها، بضفر الشعر والتحلي بالذهب ولبس الثياب الفاخرة."], [4, "وإنما لتعتمد الزينة الداخلية، ليكون قلبها متزينا بروح الوداعة والهدوء. هذه هي الزينة التي لا تفنى، وهي غالية الثمن في نظر الله!"], [5, "وبها كانت تتزين النساء التقيات قديما، فكانت الواحدة منهن تتكل على الله وتخضع لزوجها."]]}], "kwAr": "خاضعات لأزواجهن", "noteAr": ""}, {"kw": "that", "raw": "2Sa_12:14; Psa_74:10; Rom_2:24; 1Ti_5:14, 1Ti_6:1", "note": "", "refs": [{"l": "2Sa 12:14", "n": "", "vs": [[14, "ولكن لأنك جعلت أعداء الرب يشمتون من جراء هذا الأمر، فإن الابن المولود لك يموت»."]]}, {"l": "Psa 74:10", "n": "", "vs": [[10, "ياالله : إلى متى يعيرنا الخصم؟ أيظل العدو يستهين باسمك إلى الأبد؟"]]}, {"l": "Rom 2:24", "n": "", "vs": [[24, "فإن «اسم الله يجدف عليه بين الأمم بسببكم»، كما هو مكتوب."]]}, {"l": "1Ti 5:14", "n": "", "vs": [[14, "فأريد إذن أن تتزوج الأرامل الشابات، فيلدن الأولاد، ويدبرن بيوتهن، ولا يفسحن للمقاوم في المجال للطعن في سلوكهن."]]}, {"l": "1Ti 6:1", "n": "", "vs": [[1, "على جميع من هم تحت نير العبودية أن يعتبروا سادتهم أهلا لكل إكرام، لكي لا يجلبوا التجديف على اسم الله وعلى التعليم."]]}], "kwAr": "حتى لا يتكلم أحد بالسوء على كلمة الله", "noteAr": ""}], "arS": [["متعقلات", ["G4998"]], ["، ", []], ["عفيفات", ["G53"]], ["، ", []], ["مهتمات بشؤون بيوتهن", ["G3626"]], [" ", []], ["صالحات", ["G18"]], ["، ", []], ["خاضعات", ["G5293"]], [" ", []], ["لأزواجهن", ["G2398", "G435"]], ["، حتى لا ", []], ["يتكلم أحد بالسوء", ["G987"]], [" على ", []], ["كلمة", ["G3056"]], [" ", []], ["الله", ["G2316"]], [".", []]]}, {"c": 2, "v": 6, "text": "كذلك عظ الشبان أن يكونوا متعقلين،", "groups": [{"kw": "Young", "raw": "Job_29:8; Psa_148:12; Ecc_11:9, Ecc_12:1; Joe_2:28; 1Pe_5:5; 1Jo_2:13", "note": "
