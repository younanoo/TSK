<script>window.CATALOG=[{"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 48, "nv": 1273, "refs": 15264, "last": "48:35", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>

const AR = {Gen:"التكوين",Exo:"الخروج",Lev:"اللاويين",Num:"العدد",Deu:"التثنية",Jos:"يشوع",Jdg:"القضاة",Rut:"راعوث","1Sa":"صموئيل الأول","2Sa":"صموئيل الثاني","1Ki":"الملوك الأول","2Ki":"الملوك الثاني","1Ch":"أخبار الأيام الأول","2Ch":"أخبار الأيام الثاني",Ezr:"عزرا",Neh:"نحميا",Est:"أستير",Job:"أيوب",Psa:"المزامير",Pro:"الأمثال",Ecc:"الجامعة",Son:"نشيد الأنشاد",Isa:"إشعياء",Jer:"إرميا",Lam:"مراثي إرميا",Eze:"حزقيال",Dan:"دانيال",Hos:"هوشع",Joe:"يوئيل",Amo:"عاموس",Oba:"عوبديا",Jon:"يونان",Mic:"ميخا",Nah:"ناحوم",Hab:"حبقوق",Zep:"صفنيا",Hag:"حجي",Zec:"زكريا",Mal:"ملاخي",Mat:"متى",Mar:"مرقس",Luk:"لوقا",Joh:"يوحنا",Act:"أعمال الرسل",Rom:"رومية","1Co":"كورنثوس الأولى","2Co":"كورنثوس الثانية",Gal:"غلاطية",Eph:"أفسس",Phi:"فيلبي",Col:"كولوسي","1Th":"تسالونيكي الأولى","2Th":"تسالونيكي الثانية","1Ti":"تيموثاوس الأولى","2Ti":"تيموثاوس الثانية",Tit:"تيطس",Phm:"فليمون",Heb:"العبرانيين",Jam:"يعقوب","1Pe":"بطرس الأولى","2Pe":"بطرس الثانية","1Jo":"يوحنا الأولى","2Jo":"يوحنا الثانية","3Jo":"يوحنا الثالثة",Jud:"يهوذا",Rev:"الرؤيا"};

<section class="hero" data-wm="${AR[lb.abbr]}">
  <h2>مكتبة دراسة الشواهد</h2>
  <p>دراسة الكتاب المقدس عددًا بعدد، مع كل شواهد «كنز معرفة الكتاب المقدس» (TSK) ونصها الكامل بالعربية، وأرقام سترونج داخل النص مع قاموس عربي–إنجليزي. لكل سفر صفحته الخاصة: اختر سفرًا لتبدأ.</p>

    <div class="stat"><b>${n(CAT.length)}</b><span>أسفار</span></div>
    <div class="stat"><b>${n(allV)}</b><span>عددًا</span></div>
    <div class="stat"><b>${n(allR)}</b><span>شاهدًا من TSK</span></div>
    <div class="stat"><b>${n(dn)}</b><span>درستها</span></div>
  </div>
  <a class="cta" style="text-decoration:none;display:inline-block" href="${page(lb.abbr,"/"+lb.abbr+"/"+lc+":"+lv)}">${dn?"تابع من":"ابدأ من"} ${AR[lb.abbr]} ${n(lc)}: ${n(lv)} ←</a>
</section>
<h3 class="sec-title">الأسفار</h3>
<div class="chgrid">${CAT.map(c=>{const d=dIn(c.id);return `<a class="chcard bookcard" style="text-decoration:none" href="${page(c.abbr,"/"+c.abbr)}"><span class="ab">${SH[c.abbr]}</span><div class="n">${AR[c.abbr]}<small class="ltr">${c.en}</small></div>
  <div class="meta">${chs(c.nc)} · ${n(c.nv)} عددًا · ${n(c.refs)} شاهدًا</div>
  <div class="open ar">${esc(c.first)}</div>
  <div class="bar"><i style="width:${d/c.nv*100}%"></i></div><div class="pct">درست ${n(d)} من ${n(c.nv)}</div></a>`}).join("")}</div>
<h3 class="sec-title">الكتاب المقدس كله</h3>
<div class="canon"><h5>العهد القديم</h5><div class="row">${ABBR.slice(0,39).map(chip).join("")}</div>
<h5>العهد الجديد</h5><div class="row">${ABBR.slice(39).map(chip).join("")}</div>
<div class="legend">الأسفار الملوّنة موجودة في المكتبة؛ اضغط أي سفر لفتح صفحته.</div></div>`;
document.addEventListener("click",e=>{if(e.target.closest("#menu"))document.getElementById("side").classList.toggle("open")});
document.getElementById("themeBtn").addEventListener("click",()=>{const c=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");const nx=c==="dark"?"light":"dark";document.documentElement.dataset.theme=nx;set("theme",nx)});
const th=get("theme",null); if(th) document.documentElement.dataset.theme=th;
</script>
</body>
</html>
