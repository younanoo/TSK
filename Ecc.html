<script>window.CATALOG=[{"id": 17, "abbr": "Est", "en": "Esther", "nc": 10, "nv": 167, "refs": 1266, "last": "10:3", "first": "وحدث في أيام أحشويروش، الذي امتد حكمه من الهند إلى كوش، فملك على مئة وسبعة وعشرين إقليما،"}, {"id": 18, "abbr": "Job", "en": "Job", "nc": 42, "nv": 1070, "refs": 10209, "last": "42:17", "first": "عاش في أرض عوص رجل اسمه أيوب، كان صالحا كاملا يتقي الله ويحيد عن الشر."}, {"id": 19, "abbr": "Psa", "en": "Psalms", "nc": 150, "nv": 2461, "refs": 33395, "last": "150:6", "first": "طوبى للإنسان الذي لا يتبع مشورة الأشرار، ولا يقف في طريق الخاطئين، ولا يجالس المستهزئين."}, {"id": 20, "abbr": "Pro", "en": "Proverbs", "nc": 31, "nv": 915, "refs": 10457, "last": "31:31", "first": "هذه هي أمثال سليمان بن داود ملك إسرائيل،"}, {"id": 21, "abbr": "Ecc", "en": "Ecclesiastes", "nc": 12, "nv": 222, "refs": 3186, "last": "12:14", "first": "هذه أقوال الجامعة ابن داود ملك أورشليم."}, {"id": 22, "abbr": "Son", "en": "Song of Solomon", "nc": 8, "nv": 117, "refs": 1802, "last": "8:14", "first": "هذا نشيد الأناشيد لسليمان."}, {"id": 23, "abbr": "Isa", "en": "Isaiah", "nc": 66, "nv": 1292, "refs": 21959, "last": "66:24", "first": "هذه هي رؤيا إشعياء بن آموص، التي أعلنت له بشأن يهوذا وأورشليم في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا."}, {"id": 24, "abbr": "Jer", "en": "Jeremiah", "nc": 52, "nv": 1364, "refs": 20659, "last": "52:34", "first": "هذه نبوءة إرميا بن حلقيا أحد الكهنة المقيمين في عناثوث بأرض سبط بنيامين."}, {"id": 25, "abbr": "Lam", "en": "Lamentations", "nc": 5, "nv": 154, "refs": 2238, "last": "5:22", "first": "كيف أصبحت المدينة الآهلة بالسكان مهجورة وحيدة؟ صارت كأرملة! هذه التي كانت عظيمة بين الأمم. السيدة بين المدن صارت تحت الجزية!"}, {"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 48, "nv": 1273, "refs": 15264, "last": "48:35", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 21, "abbr": "Ecc", "en": "Ecclesiastes", "verses": [{"c": 1, "v": 1, "text": "هذه أقوال الجامعة ابن داود ملك أورشليم.", "groups": [{"kw": "the Preacher", "raw": "Ecc_1:12, Ecc_7:27, Ecc_12:8-10; Neh_6:7; Psa_40:9; Isa_61:1; Jon_3:2; 2Pe_2:5", "note": "", "refs": [{"l": "Ecc 1:12", "n": "", "vs": [[12, "أنا الجامعة، كنت ملكا على إسرائيل في أورشليم."]]}, {"l": "Ecc 7:27", "n": "", "vs": [[27, "ويقول الجامعة: إليك ما وجدته: أضف واحدا إلى واحد لتكتشف حاصل الأشياء"]]}, {"l": "Ecc 12:8-10", "n": "", "vs": [[8, "يقول الجامعة: باطل الأباطيل وكل شيء باطل."], [9, "وفضلا عن كون الجامعة حكيما، فإنه علم الناس المعرفة أيضا، وقوم وبحث ونظم أمثالا كثيرة."], [10, "إذ سعى الجامعة لانتقاء ألفاظ مبهجة، وكتب باستقامة كلمات الحق."]]}, {"l": "Neh 6:7", "n": "", "vs": [[7, "وقد نصبت لنفسك أنبياء لينادوا في أورشليم قائلين: هناك ملك في يهوذا! ولابد أن يبلغ الخبر مسامع الملك، فتعال لنتداول معا»."]]}, {"l": "Psa 40:9", "n": "", "vs": [[9, "أعلنت برك وسط جماعة شعبك العظيم، وأنت يارب علمت أنني لم ألجم شفتي."]]}, {"l": "Isa 61:1", "n": "", "vs": [[1, "روح السيد الرب علي، لأن الرب مسحني لأبشر المساكين، أرسلني لأضمد جراح المنكسري القلوب، لأنادي للمسبيين بالعتق وللمأسورين بالحرية،"]]}, {"l": "Jon 3:2", "n": "", "vs": [[2, "«قم امض إلى نينوى المدينة العظيمة، وأعلن لهم الرسالة التي أبلغك إياها»."]]}, {"l": "2Pe 2:5", "n": "", "vs": [[5, "كذلك لم يشفق على العالم القديم عندما أحدث الطوفان على عالم الفاجرين، إلا أنه حفظ نوحا المنادي ببر الله وعدله. وكان نوح واحدا من ثمانية أشخاص نجوا من الطوفان."]]}], "kwAr": "الجامعة", "noteAr": ""}, {"kw": "king", "raw": "Ecc_1:12; 1Ki_11:42, 1Ki_11:43; 2Ch_9:30, 2Ch_10:17-19", "note": "", "refs": [{"l": "Ecc 1:12", "n": "", "vs": [[12, "أنا الجامعة، كنت ملكا على إسرائيل في أورشليم."]]}, {"l": "1Ki 11:42", "n": "", "vs": [[42, "ودام ملك سليمان في أورشليم على إسرائيل أربعين سنة."]]}, {"l": "1Ki 11:43", "n": "", "vs": [[43, "ثم مات سليمان، فدفن مع أسلافه في مدينة داود أبيه، وخلفه ابنه رحبعام على العرش."]]}, {"l": "2Ch 9:30", "n": "", "vs": [[30, "ودام ملك سليمان على إسرائيل في أورشليم أربعين سنة،"]]}, {"l": "2Ch 10:17-19", "n": "", "vs": [[17, "أما بنو إسرائيل المقيمون في مدن سبط يهوذا فملك عليهم رحبعام."], [18, "وعندما أرسل الملك رحبعام هدورام الموكل على أعمال التسخير إلى أسباط إسرائيل، رجموه بالحجارة فمات. فبادر الملك رحبعام واستقل مركبته هاربا إلى أورشليم."], [19, "وهكذا تمرد الإسرائيليون على حكم ذرية داود إلى هذا اليوم."]]}], "kwAr": "ملك أورشليم", "noteAr": ""}], "arS": [["هذه ", []], ["أقوال", ["H1697"]], [" ", []], ["الجامعة", ["H6953"]], [" ", []], ["ابن", ["H1121"]], [" ", []], ["داود", ["H1732"]], [" ", []], ["ملك", ["H4428"]], [" ", []], ["أورشليم", ["H3389"]], [".", []]]}, {"c": 1, "v": 2, "text": "يقول الجامعة: باطل الأباطيل، باطل الأباطيل، كل شيء باطل.", "groups": [{"kw": "", "raw": "Ecc_2:11, Ecc_2:15, Ecc_2:17, Ecc_2:19, Ecc_2:21, Ecc_2:23, Ecc_2:26, Ecc_3:19, Ecc_4:4, Ecc_4:8, Ecc_4:16, Ecc_5:10, Ecc_6:11, Ecc_11:8, Ecc_11:10, Ecc_12:8; Psa_39:5, Psa_39:6, Psa_62:9, Psa_62:10, Psa_144:4; Rom_8:20", "note": "", "refs": [{"l": "Ecc 2:11", "n": "", "vs": [[11, "ثم تأملت كل ما صنعته يداي وما كابدته من تعب في عمله، فإذا الجميع باطل، وكملاحقة الريح، ولا جدوى من شيء تحت الشمس."]]}, {"l": "Ecc 2:15", "n": "", "vs": [[15, "ثم حدثت نفسي: إن ما يحدث للجاهل يحدث لي أيضا، فلماذا أنا أوفر حكمة؟ فناجيت قلبي: وهذا أيضا باطل،"]]}, {"l": "Ecc 2:17", "n": "", "vs": [[17, "فكرهت الحياة، لأن ما تم صنعه تحت الشمس كان مثار أسى لي، فكل شيء باطل كملاحقة الريح."]]}, {"l": "Ecc 2:19", "n": "", "vs": [[19, "ومن يدري: أيكون حكيما أم جاهلا؟ ومع ذلك فإنه سيتولى كل عملي الذي بذلت فيه كل جهدي وحكمتي تحت الشمس. وهذا أيضا باطل."]]}, {"l": "Ecc 2:21", "n": "", "vs": [[21, "إذ قد يترك الإنسان كل ما تعب فيه بحكمة ومعرفة وحذاقة لرجل آخر يتمتع بما لم يشق به. هذا أيضا باطل وشر عظيم."]]}, {"l": "Ecc 2:23", "n": "", "vs": [[23, "كل أيام حياته مفعمة بالمشقة، وعمله عناء. حتى في الليل لا يستريح قلبه. وهذا أيضا باطل."]]}, {"l": "Ecc 2:26", "n": "", "vs": [[26, "لأن المرء الذي يحظى برضى الله ينعم الله عليه بالحكمة والمعرفة والفرح. أما الخاطيء فيفرض عليه عناء الجمع والادخار، ليكون ذلك من نصيب من يرضي الله . وهذا أيضا باطل كملاحقة الريح."]]}, {"l": "Ecc 3:19", "n": "", "vs": [[19, "لأن ما يحل بأبناء البشر يحل بالبهائم. فكما يموت الواحد من الناس يموت الآخر من البهائم، فلكليهما نسمة واحدة، وليس للإنسان فضل على البهيمة، فكل شيء باطل."]]}, {"l": "Ecc 4:4", "n": "", "vs": [[4, "وأدركت أيضا أن كل تعب الإنسان ومنجزاته، ناتجة عن حسده لقريبه. هذا أيضا باطل كملاحقة الريح."]]}, {"l": "Ecc 4:8", "n": "", "vs": [[8, "واحد وحيد، لا ثاني له. لا ابن ولا أخ. ولا نهاية لتعبه. عينه لا تشبع من الغنى، ولا يقول: لمن أكدح وأحرم نفسي من المسرات؟ هذا أيضا باطل وعناء شاق!"]]}, {"l": "Ecc 4:16", "n": "", "vs": [[16, "ولم يكن نهاية للجماهير الذين سار في طليعتهم، غير أن الأجيال اللاحقة لا تسر به، فهذا أيضا باطل وكملاحقة الريح."]]}, {"l": "Ecc 5:10", "n": "", "vs": [[10, "من يحب الفضة لا يشبع منها، والمولع بالغنى لا يشبع من ربح. وهذا أيضا باطل."]]}, {"l": "Ecc 6:11", "n": "", "vs": [[11, "في كثرة الكلام كثرة الباطل، فأي جدوى منه للإنسان؟"]]}, {"l": "Ecc 11:8", "n": "", "vs": [[8, "إن عاش الإنسان سنين كثيرة وتمتع فيها جميعا، فليتذكر الأيام السوداء، لأنها ستكون عديدة. وباطل كل ما هو آت!"]]}, {"l": "Ecc 11:10", "n": "", "vs": [[10, "فأزل الغم من صدرك، واقص الشر عن جسدك، لأن الحداثة والشباب باطلان."]]}, {"l": "Ecc 12:8", "n": "", "vs": [[8, "يقول الجامعة: باطل الأباطيل وكل شيء باطل."]]}, {"l": "Psa 39:5", "n": "", "vs": [[5, "هوذا قد جعلت حياتي قصيرة، وعمري كلا شيء أمامك. كل إنسان حي ليس سوى نفخة!"]]}, {"l": "Psa 39:6", "n": "", "vs": [[6, "إنما كخيال يتمشى الإنسان، فعبثا يكافح الناس. يجمع الواحد منهم ثروة ولا يدري من يرثها من بعده."]]}, {"l": "Psa 62:9", "n": "", "vs": [[9, "ليس البشر جميعا، عظماء وأدنياء، سوى باطل ووهم. إن وضعتهم في كفة ميزان لا يزنون شيئا. إنهم أخف من نسمة."]]}, {"l": "Psa 62:10", "n": "", "vs": [[10, "لا تتكلوا على الظلم ولا تتفاخروا بالسرقة. إن كثر الغنى فلا تعتمدوا عليه،"]]}, {"l": "Psa 144:4", "n": "", "vs": [[4, "إنما الإنسان أشبه بنفخة. أيامه كظل عابر."]]}, {"l": "Rom 8:20", "n": "", "vs": [[20, "لأن الخليقة قد أخضعت للباطل، لا باختيارها بل من قبل الذي أخضعها، على رجاء أن"]]}], "kwAr": "", "noteAr": ""}], "arS": [["يقول", ["H559"]], [" ", []], ["الجامعة", ["H6953"]], [": ", []], ["باطل", ["H1892"]], [" ", []], ["الأباطيل", ["H1892"]], ["، ", []], ["باطل", ["H1892"]], [" الأباطيل، ", []], ["كل", ["H3605"]], [" شيء ", []], ["باطل", ["H1892"]], [".", []]]}, {"c": 1, "v": 3, "text": "ما الفائدة من كل تعب الإنسان الذي يتعبه تحت الشمس.", "groups": [{"kw": "profit", "raw": "Ecc_2:22, Ecc_3:9, Ecc_5:16; Pro_23:4, Pro_23:5; Isa_55:2; Hab_2:13, Hab_2:18; Mat_16:26; Mar_8:36, Mar_8:37; Joh_6:27", "note": "", "refs": [{"l": "Ecc 2:22", "n": "", "vs": [[22, "فأي نفع للإنسان من جميع تعبه ومكابدته العناء الذي قاسى منه تحت الشمس؟"]]}, {"l": "Ecc 3:9", "n": "", "vs": [[9, "فأي نفع يجنيه العامل من كده؟"]]}, {"l": "Ecc 5:16", "n": "", "vs": [[16, "وهذا أيضا شر أليم، إذ إنه يفارق الدنيا كما جاء فأي منفعة له، إذ إن تعبه يذهب أدراج الرياح؟"]]}, {"l": "Pro 23:4", "n": "", "vs": [[4, "لا تشق طلبا للثراء. اكبح جماح نفسك بفضل فطنتك."]]}, {"l": "Pro 23:5", "n": "", "vs": [[5, "ما تكاد تتألق عيناك حبورا به حتى يتبدد، إذ فجأة يصنع لنفسه أجنحة ويطير كالنسر محلقا نحو السماء."]]}, {"l": "Isa 55:2", "n": "", "vs": [[2, "لماذا تنفقون الفضة على ما ليس بخبز، وتتعبون لغير شبع؟ أحسنوا الاستماع إلي، وكلوا الشهي ولتتمتع أنفسكم بالدسم."]]}, {"l": "Hab 2:13", "n": "", "vs": [[13, "ألم يصدر القضاء من عند الرب القدير أن يؤول تعب الشعوب إلى النار وجهد الأمم إلى الباطل؟"]]}, {"l": "Hab 2:18", "n": "", "vs": [[18, "أي جدوى من تمثال حتى يصوغه صانع، أو صنم يعلم الكذب لأن من يصنعه يتكل على ما صنعه، وهو لم يصنع سوى أصنام بكماء."]]}, {"l": "Mat 16:26", "n": "", "vs": [[26, "فماذا ينتفع الإنسان لو ربح العالم كله وخسر نفسه؟ أو ماذا يقدم الإنسان فداء عن نفسه؟"]]}, {"l": "Mar 8:36", "n": "", "vs": [[36, "فماذا ينتفع الإنسان لو ربح العالم كله وخسر نفسه؟"]]}, {"l": "Mar 8:37", "n": "", "vs": [[37, "أو ماذا يقدم الإنسان فداء عن نفسه؟"]]}, {"l": "Joh 6:27", "n": "", "vs": [[27, "لا تسعوا وراء الطعام الفاني، بل وراء الطعام الباقي إلى الحياة الأبدية، والذي يعطيكم إياه ابن الإنسان، لأن هذا الطعام قد وضع الله الآب ختمه عليه»."]]}], "kwAr": "الفائدة", "noteAr": ""}, {"kw": "under", "raw": "Ecc_2:11, Ecc_2:19, Ecc_4:3, Ecc_4:7, Ecc_5:18, Ecc_6:12, Ecc_7:11, Ecc_8:15-17, Ecc_9:3, Ecc_9:6, Ecc_9:13", "note": "", "refs": [{"l": "Ecc 2:11", "n": "", "vs": [[11, "ثم تأملت كل ما صنعته يداي وما كابدته من تعب في عمله، فإذا الجميع باطل، وكملاحقة الريح، ولا جدوى من شيء تحت الشمس."]]}, {"l": "Ecc 2:19", "n": "", "vs": [[19, "ومن يدري: أيكون حكيما أم جاهلا؟ ومع ذلك فإنه سيتولى كل عملي الذي بذلت فيه كل جهدي وحكمتي تحت الشمس. وهذا أيضا باطل."]]}, {"l": "Ecc 4:3", "n": "", "vs": [[3, "وأفضل من كليهما من لم يولد بعد، الذي لم ير الشر المرتكب تحت الشمس."]]}, {"l": "Ecc 4:7", "n": "", "vs": [[7, "وعدت أتأمل فرأيت باطلا آخر تحت الشمس:"]]}, {"l": "Ecc 5:18", "n": "", "vs": [[18, "فتأمل ما وجدت: من الأفضل والأليق أن يأكل الإنسان ويشرب ويستمتع بما تكبده من عناء تحت الشمس طوال أيام حياته القليلة التي وهبها الله له، لأن هذا هو حظه."]]}, {"l": "Ecc 6:12", "n": "", "vs": [[12, "إذ من يدري ما هو خير للإنسان في الحيا ة التي يقضي فيها أياما قليلة باطلة كالظل؟ ومن يقدر أن يطلع الإنسان على ما سيحدث تحت الشمس من بعده؟"]]}, {"l": "Ecc 7:11", "n": "", "vs": [[11, "الحكمة مع الميراث صالحة وذات منفعة للأحياء."]]}, {"l": "Ecc 8:15-17", "n": "", "vs": [[15, "فأطريت المسرة لأنه ليس للمرء خير تحت الشمس أفضل من أن يأكل ويشرب ويمتع نفسه، فهذا ما يبقى له من عنائه مدة أيام حياته التي أنعم بها الله عليه تحت الشمس."], [16, "وعندما جعلت قلبي يعزم على معرفة الحكمة، والتأمل في معاناة الإنسان التي يقاسيها على الأرض، وكيف لا تذوق عيناه النوم ليلا ونهارا،"], [17, "رأيت أعمال الله كلها، وعجز الإنسان عن إدراك الأعمال التي تم إنجازها تحت الشمس. ومهما جد في سعيه لمعرفتها فلن يدركها. وحتى إن ادعى الحكيم معرفتها فإنه حقا لن يستطيع أن يجدها."]]}, {"l": "Ecc 9:3", "n": "", "vs": [[3, "وأشر ما يجري تحت الشمس أن الجميع يلقون نفس المصير، وأن قلوب بني البشر مفعمة بالشر، وفي حياتهم تمتليء صدورهم بالحماقة، ثم يموتون!"]]}, {"l": "Ecc 9:6", "n": "", "vs": [[6, "فقد باد حبهم وبغضهم وغيرتهم، ولم يبق لهم نصيب فيما يجري تحت الشمس."]]}, {"l": "Ecc 9:13", "n": "", "vs": [[13, "وشاهدت أيضا تحت الشمس هذه الحكمة التي أثارت إعجابي المفرط:"]]}], "kwAr": "تحت الشمس", "noteAr": ""}], "arS": [["ما", ["H4100"]], [" ", []], ["الفائدة", ["H3504"]], [" من ", []], ["كل", ["H3605"]], [" ", []], ["تعب", ["H5999"]], [" ", []], ["الإنسان", ["H120"]], [" الذي ", []], ["يتعبه", ["H5998"]], [" ", []], ["تحت", ["H8478"]], [" ", []], ["الشمس", ["H8121"]], [".", []]]}, {"c": 1, "v": 4, "text": "جيل يمضي وجيل يقبل والأرض قائمة إلى الأبد.", "groups": [{"kw": "One generation", "raw": "Ecc_6:12; Gen. 5:3-31, Gen_11:20-32, Gen_36:9-19, Gen_47:9; Exo_1:6, Exo_1:7, Exo_6:16-27; Psa_89:47, Psa_89:48, Psa_90:9, Psa_90:10; Zec_1:5", "note": "", "refs": [{"l": "Ecc 6:12", "n": "", "vs": [[12, "إذ من يدري ما هو خير للإنسان في الحيا ة التي يقضي فيها أياما قليلة باطلة كالظل؟ ومن يقدر أن يطلع الإنسان على ما سيحدث تحت الشمس من بعده؟"]]}, {"l": "Gen 5:3-31", "n": "", "vs": [[3, "كان عمر آدم مئة وثلاثين سنة عندما أنجب ولدا كشبهه ومثاله، وسماه شيثا."], [4, "وعاش آدم بعد مولد شيث ثماني مئة سنة، وولد له بنون وبنات."], [5, "ومات آدم وله من العمر تسع مئة وثلاثون سنة."], [6, "كان عمر شيث مئة وخمس سنوات عندما أنجب أنوش."], [7, "وعاش شيث بعد ذلك ثماني مئة وسبع سنوات، ولد له فيها بنون وبنات."], [8, "ومات شيث وله من العمر تسع مئة واثنتا عشرة سنة."], [9, "وكان عمر أنوش تسعين سنة عندما أنجب قينان."], [10, "وعاش أنوش بعد ذلك ثماني مئة وخمس عشرة سنة، ولد له فيها بنون وبنات."], [11, "ومات أنوش وله من العمر تسع مئة وخمس سنوات."], [12, "وكان عمر قينان سبعين سنة عندما أنجب مهللئيل."], [13, "وعاش قينان بعد ذلك ثماني مئة وأربعين سنة، ولد له فيها بنون وبنات."], [14, "ومات قينان وله من العمر تسع مئة وعشر سنوات."], [15, "وكان عمر مهللئيل خمسا وستين سنة عندما أنجب يارد،"], [16, "وعاش مهللئيل بعد ذلك ثماني مئة وثلاثين سنة، ولد له فيها بنون وبنات."], [17, "ومات مهللئيل وله من العمر ثماني مئة وخمس وتسعون سنة."], [18, "وكان عمر يارد مئة واثنتين وستين سنة عندما أنجب أخنوخ."], [19, "وعاش بعد ذلك ثماني مئة سنة، ولد له فيها بنون وبنات."], [20, "ومات يارد وله من العمر تسع مئة واثنتان وستون سنة."], [21, "وكان عمر أخنوخ خمسا وستين سنة عندما أنجب متوشالح."], [22, "ثم عاش أخنوخ بعد ذلك ثلاث مئة سنة سار فيها مع الله. وولد له بنون وبنات."], [23, "وكانت كل أيام أخنوخ ثلاث مئة وخمسا وستين سنة."], [24, "وسار أخنوخ مع الله، ثم توارى من الوجود، لأن الله نقله إليه."], [25, "وكان عمر متوشالح مئة وسبعا وثمانين سنة عندما أنجب لامك."], [26, "وعاش متوشالح بعد ذلك سبع مئة واثنتين وثمانين سنة، ولد له فيها بنون وبنات."], [27, "ومات متوشالح وله من العمر تسع مئة وتسع وستون سنة."], [28, "كان عمر لامك مئة واثنتين وثمانين سنة عندما أنجب ابنا،"], [29, "سماه نوحا قائلا: «هذا يعزينا عن أعمالنا ومشقة أيدينا في الأرض التي لعنها الرب»."], [30, "وعاش لامك خمس مئة وخمسا وتسعين سنة بعد ولادة نوح، ولد له فيها بنون وبنات"], [31, "ومات لامك وله من العمر سبع مئة وسبع وسبعون سنة."]]}, {"l": "Gen 11:20-32", "n": "", "vs": [[20, "وكان عمر رعو اثنتين وثلاثين سنة عندما ولد سروج."], [21, "وعاش رعو بعد ذلك مئتين وسبع سنين، ولد له فيها بنون وبنات."], [22, "وكان عمر سروج ثلاثين سنة عندما ولد ناحور."], [23, "وعاش سروج بعد ذلك مئتي سنة، ولد له فيها بنون وبنات."], [24, "وكان عمر ناحور تسعا وعشرين سنة عندما ولد تارح."], [25, "وعاش ناحور بعد ذلك مئة وتسع عشرة سنة، ولد له فيها بنون وبنات."], [26, "وعندما بلغ تارح السبعين من عمره أنجب أبرام وناحور وهاران."], [27, "وهذا هو سجل مواليد تارح: ولد تارح أبرام وناحور وهاران. وولد هاران لوطا."], [28, "ومات هاران قبل تار ح أبيه في أرض مولده في أور الكلدانيين."], [29, "وتزوج كل من أبرام وناحور. وكان اسم زوجة أبرام ساراي، واسم زوجة ناحور ملكة بنت هاران الذي أنجب ملكة ويسكة."], [30, "وكانت ساراي عاقرا ليس لها ولد."], [31, "وأخذ تارح ابنه أبرام وحفيده لوطا بن هاران، وساراي كنته زوجة ابنه أبرام، وارتحل بهم من أور الكلدانيين ليذهبوا إلى أرض كنعان."], [32, "لكنهم وصلوا إلى حاران واستقروا فيها. وهناك مات تارح وله من العمر مئتان وخمس سنين."]]}, {"l": "Gen 36:9-19", "n": "", "vs": [[9, "وهذه هي أسماء أبناء عيسو:"], [10, "أليفاز بن عدا، ورعوئيل بن بسمة."], [11, "أما أبناء أليفاز فهم: تيمان وأومار وصفو وجعثام وقناز."], [12, "وكانت تمناع سرية لأليفاز بن عيسو فأنجبت لأليفاز عماليق. هؤلاء أبناء عدا زوجة عيسو."], [13, "أما أبناء رعوئيل فهم: نحث وزارح وشمة ومزة. وجميعهم أبناء بسمة زوجة عيسو."], [14, "وهؤلاء هم أبناء أهوليبامة بنت عنى حفيدة صبعون، زوجة عيسو؛ فقد أنجبت لعيسو يعوش ويعلام وقورح."], [15, "وهؤلاء هم رؤساء قبائل بني عيسو، من مواليد أليفاز بكر عيسو: تيمان وأومار وصفو وقناز."], [16, "وقورح وجعثام وعماليق. هؤلاء هم رؤساء القبائل المنحدرة من أليفاز في أرض أدوم. وهم من ذرية عدا."], [17, "وهؤلاء هم رؤساء قبائل بني رعوئيل ابن عيسو: نحث وزارح وشمة ومزة. هؤلاء هم رؤساء القبائل المنحدرة من رعوئيل في أرض أدوم. وهم من ذرية بسمة امرأة عيسو."], [18, "وهؤلاء هم أبناء أهوليبامة امرأة عيسو: الرؤساء يعوش ويعلام وقورح. وهم رؤساء القبائل المنحدرة من أهوليبامة امرأة عيسو."], [19, "هؤلاء هم أبناء عيسو، أي أدوم، وهؤلاء هم رؤساء قبائلهم."]]}, {"l": "Gen 47:9", "n": "", "vs": [[9, "فأجاب يعقوب فرعون: «سنوات غربتي مئة وثلاثون سنة، قليلة وشاقة، ولم تبلغ سني غربة آبائي»."]]}, {"l": "Exo 1:6", "n": "", "vs": [[6, "ثم مات يوسف وإخوته جميعا وكذلك سائر ذلك الجيل."]]}, {"l": "Exo 1:7", "n": "", "vs": [[7, "ونما بنو إسرائيل، وتوالدوا وتكاثروا وعظموا جدا حتى اكتظت بهم الأرض."]]}, {"l": "Exo 6:16-27", "n": "", "vs": [[16, "وهذه أسماء أبناء لاوي حسب عشائرهم: جرشون وقهات ومراري. وقد عاش لاوي مئة وسبعا وثلاثين سنة."], [17, "أما ابنا جرشون حسب عشائرهما فهما: لبني وشمعي."], [18, "وأبناء قهات هم: عمرام ويصهار وحبرون وعزيئيل. وقد عاش قهات مئة وثلاثا وثلاثين سنة."], [19, "وابنا مراري هما محلي وموشي. هذه هي عشائر اللاويين بحسب سجل مواليدهم."], [20, "وتزوج عمرام عمته يوكابد فأنجبت له هرون وموسى. وقد عاش عمرام مئة وسبعا وثلاثين سنة."], [21, "وأبناء يصهار هم: قورح ونافج وذكري."], [22, "أبناء عزيئيل هم: ميشائيل وألصافان وستري"], [23, "وتزوج هرون من أليشابع ابنة عميناداب أخت نحشون فأنجبت له ناداب وأبيهو وألعازار وإيثامار."], [24, "وأبناء قورح هم: أسير وألقانة وأبيأساف: هذه هي عشائر القورحيين."], [25, "وتزوج ألعازار بن هرون من إحدى بنات فوطيئيل فأنجبت له فينحاس. هؤلاء رؤساء آباء اللاويين بحسب ترتيب عشائرهم."], [26, "هذان هما هرون وموسى اللذان قال لهما الرب: أخرجا بني إسرائيل من أرض مصر بحسب فرقهم."], [27, "وهما نفس موسى وهرون اللذين خاطبا فرعون ملك مصر ليطلق بني إسرائيل من مصر."]]}, {"l": "Psa 89:47", "n": "", "vs": [[47, "اذكر قصر عمري وأنك خلقت كل بني آدم للزوال."]]}, {"l": "Psa 89:48", "n": "", "vs": [[48, "أي إنسان يحيا ولا يرى الموت؟ ومن ينجي نفسه من قبضة الهاوية؟"]]}, {"l": "Psa 90:9", "n": "", "vs": [[9, "لأن أيامنا كلها تنقضي في غضبك الشديد، وأعوامنا تتلاشى كزفرة."]]}, {"l": "Psa 90:10", "n": "", "vs": [[10, "قد نعيش سبعين سنة، وإن كنا ذوي عافية فثمانين وأفضل أيامنا تعب وبلية، لأنها سرعان ما تزول فنطير."]]}, {"l": "Zec 1:5", "n": "", "vs": [[5, "أين هم آباؤكم؟ وهل يحيا الأنبياء إلى الأبد؟"]]}], "kwAr": "جيل يمضي", "noteAr": ""}, {"kw": "but", "raw": "Psa_102:24-28, Psa_104:5, Psa_119:90, Psa_119:91; Mat_24:35; 2Pe_3:10-13", "note": "", "refs": [{"l": "Psa 102:24-28", "n": "", "vs": [[24, "حتى قلت: «يارب أنت حي إلى الأبد. لا تقصفني في منتصف عمري، قبل أن أبلغ الشيخوخة."], [25, "من قدم أسست الأرض، والسماوات هي صنع يديك."], [26, "هي زائلة أما أنت فباق. تبلى كلها كالثوب. وتستبدلها كما يستبدل الرداء القديم بالجديد."], [27, "لكنك أنت الدائم الخالد، وسنوك لن تنتهي."], [28, "أبناء عبيدك يدومون، ونسلهم يظل ثابتا أمامك»."]]}, {"l": "Psa 104:5", "n": "", "vs": [[5, "المؤسس الأرض على قواعدها فلا تتزعزع إلى الدهر والأبد."]]}, {"l": "Psa 119:90", "n": "", "vs": [[90, "من جيل إلى جيل أمانتك. أنت أسست الأرض فلن تتزعزع."]]}, {"l": "Psa 119:91", "n": "", "vs": [[91, "بموجب أحكامك تثبت اليوم، لأن الكل خدام لك."]]}, {"l": "Mat 24:35", "n": "", "vs": [[35, "إن السماء والأرض تزولان؛ ولكن كلامي لا يزول أبدا."]]}, {"l": "2Pe 3:10-13", "n": "", "vs": [[10, "إلا أن «يوم الرب» سيأتي كما يأتي اللص في الليل. في ذلك اليوم، تزول السماوات محدثة دويا هائلا وتنحل العناصر محترقة بنار شديدة، وتحترق الأرض وما فيها من منجزات."], [11, "ومادامت هذه الأشياء جميعا ستنحل، فكيف يجب أن تكونوا أنتم أصحاب سلوك مقدس يتصف بالتقوى،"], [12, "منتظرين «يوم الله» الأبدي وطالبين حلوله بسرعة. ففي ذلك اليوم، تنحل السماوات ملتهبة، وتذوب العناصر محترقة."], [13, "إلا أننا، وفقا لوعد الرب، ننتظر سماوات جديدة وأرضا جديدة، حيث يسكن البر."]]}], "kwAr": "والأرض قائمة", "noteAr": ""}], "arS": [["جيل", ["H1755"]], [" ", []], ["يمضي", ["H1980"]], [" ", []], ["وجيل", ["H1755"]], [" ", []], ["يقبل", ["H935"]], [" ", []], ["والأرض", ["H776"]], [" ", []], ["قائمة", ["H5975"]], [" ", []], ["إلى", ["H5769"]], [" الأبد.", []]]}, {"c": 1, "v": 5, "text": "الشمس تشرق ثم تغرب، مسرعة إلى موضعها الذي منه طلعت.", "groups": [{"kw": "sun", "raw": "Gen_8:22; Psa_19:4-6, Psa_89:36, Psa_89:37, Psa_104:19-23; Jer_33:20", "note": "", "refs": [{"l": "Gen 8:22", "n": "", "vs": [[22, "وتكون كل أيام الأرض مواسم زرع وحصاد وبرد وحر وصيف وشتاء ونهار وليل، لن تبطل أبدا»."]]}, {"l": "Psa 19:4-6", "n": "", "vs": [[4, "انطلق صوتهم إلى الأرض كلها وكلامهم إلى أقاصي العالم. جعل للشمس مسكنا فيها،"], [5, "وهي مثل العريس الخارج من مخدعه، كالعداء المبتهج للسباق في الطريق."], [6, "تنطلق من أقصى السموات، وتدور إلى أقاصيها، ولا شيء يحتجب من حرها."]]}, {"l": "Psa 89:36", "n": "", "vs": [[36, "نسله يدوم إلى الدهر، وعرشه يبقى أمامي بقاء الشمس."]]}, {"l": "Psa 89:37", "n": "", "vs": [[37, "يظل ثابتا إلى الأبد ثبات القمر الشاهد الأمين في السماء."]]}, {"l": "Psa 104:19-23", "n": "", "vs": [[19, "أنت صنعت القمر لتحديد مواقيت الشهور، والشمس تعرف موعد مغربها."], [20, "تحل الظلمة فيصير ليل يجوس فيه كل حيوان الغابة."], [21, "تزمجر الأشبال طلبا لفريستها ملتمسة طعامها من عند الله."], [22, "وما إن تشرق الشمس حتى تعود إلى عرائنها وتربض فيها"], [23, "أما الإنسان فيخرج إلى عمله وشغله حتى المساء."]]}, {"l": "Jer 33:20", "n": "", "vs": [[20, "«هذا ما يقوله الرب: إن استطعتم أن تنقضوا عهدي مع النهار، ومع الليل، بحيث لا يحل النهار والليل في أوانهما،"]]}], "kwAr": "الشمس", "noteAr": ""}, {"kw": "hasteth", "raw": "Heb. panteth, Jos_10:13, Jos_10:14; Psa_42:1; Hab_3:11", "note": "Heb. panteth, Jos_10:13, Jos_10:14; Psa_42:1; Hab_3:11", "refs": [{"l": "Jos 10:13", "n": "", "vs": [[13, "فثبتت الشمس، وتوقف القمر حتى انتقم الجيش من أعدائه. أليس هذا مدونا في كتاب ياشر؟ فوقفت الشمس في كبد السماء ولم تسرع للغروب نحو يوم كامل."]]}, {"l": "Jos 10:14", "n": "", "vs": [[14, "ولم يحدث نظير ذلك اليوم لا من قبل ولا من بعد، فيه استجاب الرب دعاء إنسان، لأن الرب حارب حقا عن إسرائيل."]]}, {"l": "Psa 42:1", "n": "", "vs": [[1, "مثلما تشتاق الغزلان إلى جداول المياه، هكذا تشتاق نفسي إليك ياالله ."]]}, {"l": "Hab 3:11", "n": "", "vs": [[11, "القمر والشمس توقفا في منازلهما أمام وميض سهامك المندفعة وبريق رمحك المتلأليء."]]}], "kwAr": "مسرعة", "noteAr": "بالعبرانية: تلهث. انظر يش 10: 13، 14؛ مز 42: 1؛ حب 3: 11"}], "arS": [["الشمس", ["H8121"]], [" ", []], ["تشرق", ["H2224"]], [" ثم ", []], ["تغرب", ["H935"]], ["، ", []], ["مسرعة", ["H7602"]], [" ", []], ["إلى", ["H413"]], [" ", []], ["موضعها", ["H4725"]], [" الذي منه طلعت.", []]]}, {"c": 1, "v": 6, "text": "الريح تهب نحو الجنوب، ثم تلتف صوب الشمال. تدور حول نفسها ولا تلبث أن ترجع إلى مسارها.", "groups": [{"kw": "The wind", "raw": "This verse should be connected with the preceding, and rendered, The sun also riseth, and the sun goeth down, and hasteth to his place where he arose; going toward the south, and turning about unto the north. The wind whirleth about continually, etc. Alluding, in the former part, to the apparent daily motion of the sun from east to west, and to his annual course through the signs of the zodiac. Job_37:9, Job_37:17; Psa_107:25, Psa_107:29; Jon_1:4; Mat_7:24, Mat_7:27; Joh_3:8; Act_27:13-15", "note": "This verse should be connected with the preceding, and rendered, The sun also riseth, and the sun goeth down, and hasteth to his place where he arose; going toward the south, and turning about unto the north. The wind whirleth about continually, etc. Alluding, in the former part, to the apparent daily motion of the sun from east to west, and to his annual course through the signs of the zodiac. Job_37:9, Job_37:17; Psa_107:25, Psa_107:29; Jon_1:4; Mat_7:24, Mat_7:27; Joh_3:8; Act_27:13-15", "refs": [{"l": "Job 37:9", "n": "", "vs": [[9, "تقبل العاصفة من الجنوب، والبرد من الشمال،"]]}, {"l": "Job 37:17", "n": "", "vs": [[17, "أنت يامن تسخن ثيابه عندما ترين سكينة على الأرض بتأثير ريح الجنوب."]]}, {"l": "Psa 107:25", "n": "", "vs": [[25, "فإنه بأمره أثار ريحا عاصفة فأهاجت أمواج البحر"]]}, {"l": "Psa 107:29", "n": "", "vs": [[29, "هدأ العاصفة الشديدة، وسكن الأمواج."]]}, {"l": "Jon 1:4", "n": "", "vs": [[4, "فأرسل الرب ريحا عاتية على البحر أثارت إعصارا بحريا، حتى أشرفت السفينة على الانكسار."]]}, {"l": "Mat 7:24", "n": "", "vs": [[24, "فأي من يسمع أقوالي هذه ويعمل بها، أشبهه برجل حكيم بنى بيته على الصخر،"]]}, {"l": "Mat 7:27", "n": "", "vs": [[27, "فنزلت الأمطار، وجرت السيول، وهبت العواصف، فضربت ذلك البيت، فسقط، وكان سقوطه عظيما»"]]}, {"l": "Joh 3:8", "n": "", "vs": [[8, "الريح تهب حيث تشاء وتسمع صفيرها، ولكنك لا تعلم من أين تأتي ولا إلى أين تذهب. هكذا كل من ولد من الروح»."]]}, {"l": "Act 27:13-15", "n": "", "vs": [[13, "وهبت ريح خفيفة من الجنوب، فظن البحارة أنها ستدفعهم نحو فينكس، فرفعوا المرساة وأبحروا على مقربة من شاطيء كريت."], [14, "ولكن ريحا عاصفة تعرف بالشمالية الشرقية هبت بعد قليل،"], [15, "فاندفعت السفينة ولم تقو على مقاومة الريح، فاستسلمنا. وحملتنا العاصفة"]]}], "kwAr": "الريح", "noteAr": "ينبغي ربط هذه الآية بما قبلها، وتُقرأ هكذا: والشمس تشرق والشمس تغرب وتسرع إلى موضعها الذي منه طلعت؛ ذاهبة نحو الجنوب ومنعطفة إلى الشمال. والريح تدور دورانا دائما، إلخ. وفي الشطر الأول إشارة إلى الحركة اليومية الظاهرة للشمس من الشرق إلى الغرب، وإلى مسارها السنوي عبر بروج الفلك. انظر أي 37: 9، 17؛ مز 107: 25، 29؛ يون 1: 4؛ مت 7: 24، 27؛ يو 3: 8؛ أع 27: 13-15"}], "arS": [["الريح", ["H7307"]], [" ", []], ["تهب", ["H1980"]], [" ", []], ["نحو", ["H413"]], [" ", []], ["الجنوب", ["H1864"]], ["، ثم ", []], ["تلتف", ["H5437"]], [" صوب ", []], ["الشمال", ["H6828"]], [". ", []], ["تدور", ["H5437", "H1980"]], [" ", []], ["حول", ["H5439"]], [" نفسها ولا تلبث أن ", []], ["ترجع", ["H7725"]], [" ", []], ["إلى", ["H413"]], [" مسارها.", []]]}, {"c": 1, "v": 7, "text": "جميع الأنهار تصب في البحر، ولكن البحر لا يمتليء، ثم ترجع المياه إلى المكا , {"l": "Rom 8:22", "n": "", "vs": [[22, "فإننا نعلم أن الخليقة كلها تئن وتتمخض معا حتى الآن."]]}, {"l": "Rom 8:23", "n": "", "vs": [[23, "وليس هي وحدها، بل أيضا نحن الذين لنا باكورة الروح، نحن أنفسنا نئن في قرارة نفوسنا مترقبين إعلان بنوتنا بافتداء أجسادنا."]]}], "kwAr": "مرهقة", "noteAr": ""}, {"kw": "man", "raw": "Ecc_4:1-4, Ecc_7:24-26", "note": "", "refs": [{"l": "Ecc 4:1-4", "n": "", "vs": [[1, "ثم تأملت حولي فرأيت جميع المظالم التي ترتكب تحت الشمس. شهدت دموع المظلومين الذين لا معزي لهم، أما ظالموهم فيتمتعون بالقوة، غير أن المظلومين لا معزي لهم."], [2, "فغبطت الأموات الذين قضوا منذ زمان أكثر من الأحياء الذين ما برحوا على قيد الحياة."], [3, "وأفضل من كليهما من لم يولد بعد، الذي لم ير الشر المرتكب تحت الشمس."], [4, "وأدركت أيضا أن كل تعب الإنسان ومنجزاته، ناتجة عن حسده لقريبه. هذا أيضا باطل كملاحقة الريح."]]}, {"l": "Ecc 7:24-26", "n": "", "vs": [[24, "ما هو بعيد، بعيد جدا، وما هو عميق، عميق جدا. ومن لي بمن يكتشفه؟"], [25, "فتفحصت قلبي لأعلم وأبحث وأنشد الحكمة وألتمس جواهر الأشياء وأعرف جهالة الشر، وحماقة الجنون."], [26, "فوجدت أن المرأة التي قلبها أشراك وشباك، ويداها قيود، هي أمر من الموت، ومن يرضي الله يهرب منها، أما الخاطيء فيقع في أشراكها."]]}], "kwAr": "المرء", "noteAr": ""}, {"kw": "the eye", "raw": "Ecc_4:8, Ecc_5:10, Ecc_5:11; Psa_63:5; Pro_27:20, Pro_30:15, Pro_30:16; Mat_5:6; Rev_7:16, Rev_7:17", "note": "", "refs": [{"l": "Ecc 4:8", "n": "", "vs": [[8, "واحد وحيد، لا ثاني له. لا ابن ولا أخ. ولا نهاية لتعبه. عينه لا تشبع من الغنى، ولا يقول: لمن أكدح وأحرم نفسي من المسرات؟ هذا أيضا باطل وعناء شاق!"]]}, {"l": "Ecc 5:10", "n": "", "vs": [[10, "من يحب الفضة لا يشبع منها، والمولع بالغنى لا يشبع من ربح. وهذا أيضا باطل."]]}, {"l": "Ecc 5:11", "n": "", "vs": [[11, "إن كثرت الخيرات كثر آكلوها أيضا، وأي جدوى لمالكها إلا أن تكتحل عيناه برؤيتها."]]}, {"l": "Psa 63:5", "n": "", "vs": [[5, "تشبع نفسي كأنها أكلت من الشحم والدسم، ويسبحك فمي بشفتين مبتهجتين"]]}, {"l": "Pro 27:20", "n": "", "vs": [[20, "كما أن الهاوية والهلاك لا يشبعان، هكذا لا تشبع عينا الإنسان."]]}, { بمرارة الحسد وبالتحزب، فلا تفتخروا بحكمتكم، ولا تنكروا الحق."], [15, "إن هذه الحكمة التي تدعونها ليست نازلة من عند الله، بل هي «حكمة» أرضية بشرية شيطانية."], [16, "فحيث تكون مرارة الحسد والتحزب، ينتشر الخلاف والفوضى وجميع الشرور."], [17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}], "kwAr": "لأن كثرة الحكمة", "noteAr": ""}], "arS": [["لأن", ["H3588"]], [" ", []], ["كثرة", ["H7230"]], [" ", []], ["الحكمة", ["H2451"]], [" تقترن ", []], ["بكثرة", ["H7230"]], [" ", []], ["الغم", ["H3708"]], ["، ومن ", []], ["يزداد", ["H3254"]], [" ", []], ["علما", ["H1847"]], [" يزداد ", []], ["حزنا", ["H4341"]], ["!", []]]}, {"c": 2, "v": 1, "text": "فناجيت نفسي: تعالي الآن أمتحنك بالفرح، فأستمتع باللذة! وإذا هذا أيضا باطل.", "groups": [{"kw": "said", "raw": "Ecc_2:15, Ecc_1:16, Ecc_1:17, Ecc_3:17, Ecc_3:18; Psa_10:6, Psa_14:1, Psa_27:8, Psa_30:6, Psa_30:7; Luk_12:19", "note": "", "refs": [{"l": "Ecc 2:15", "n": "", "vs": [[15, "ثم حدثت نفسي: إن ما يحدث للجاهل يحدث لي أيضا، فلماذا أنا أوفر حكمة؟ فناجيت قلبي: وهذا أيضا باطل،"]]}, {"l": "Ecc 1:16", "n": "", "vs": [[16, "فقلت لنفسي: قد عظمت ونموت في الحكمة أكثر من كل أسلافي الذين حكموا أورشليم من قبلي، وقد عرف قلبي كثيرا من الحكمة والعلم."]]}, {"l": "Ecc 1:17", "n": "", "vs": [[17, "ثم وجهت فكري نحو معرفة الحكمة والجنون والحماقة، فأدركت أن هذا ليس سوى ملاحقة الريح أيضا."]]}, {"l": "Ecc 3:17", "n": "", "vs": [[17, "فقلت في نفسي: إن الله سيحكم على الصديق وعلى الشرير، لأن لكل عمل ولكل أمر وقتا هناك."]]}, {"l": "Ecc 3:18", "n": "", "vs": [[18, "وناجيت قلبي أيضا بشأن أبناء البشر قائلا: إنما الله يمتحنهم، ليبين لهم أنهم ليسوا أفضل من البهائم،"]]}, {"l": "Psa 10:6", "n": "", "vs": [[6, "قال في نفسه: «لن يزحزحني شيء، ولن ينالني مكروه قط»."]]}, {"l": "Psa 14:1", "n": "", "vs": [[1, "قال الجاهل في قلبه: لا يوجد إله! قد فسد البشر وارتكبوا الموبقات، وليس بينهم من يعمل الصلاح."]]}, {"l": "Psa 27:8", "n the things of the world, but of intemperate pleasure, whose two attendants, laughter and mirth, are introduced by a beautiful prosopopoeia, as two persons, whom he treats with the utmost contempt.", "note": "Solomon is not speaking here of sober enjoyment of the things of the world, but of intemperate pleasure, whose two attendants, laughter and mirth, are introduced by a beautiful prosopopoeia, as two persons, whom he treats with the utmost contempt.", "refs": [], "kwAr": "قلت عن الضحك", "noteAr": "ليس سليمان يتكلم هنا عن التمتع المعتدل بأمور العالم، بل عن اللذة المفرطة، التي يقدّم لها مرافقيها، الضحك والطرب، بتشخيص جميل كأنهما شخصان يعاملهما بأشد الازدراء."}, {"kw": "It is", "raw": "Ecc_7:2-6; Pro_14:13; Isa_22:12, Isa_22:13; Amo_6:3-6; 1Pe_4:2-4", "note": "", "refs": [{"l": "Ecc 7:2-6", "n": "", "vs": [[2, "الذهاب إلى بيت النوح خير من الحضور إلى بيت الوليمة، لأن الموت هو مصير كل إنسان. وهذا ما يحتفظ به الحي في قلبه."], [3, "الحزن خير من الضحك، لأنه بكآبة الوجه يصلح القلب."], [4, "قلب الحكماء في بيت النوح، أما قلوب الجهال ففي بيت اللذة."], [5, "الاستماع إلى زجر الحكيم خير من الإصغاء إلى غناء الجهال."], [6, "لأن ضحك الجهال كقرقعة الشوك تحت القدر، وهذا أيضا باطل."]]}, {"l": "Pro 14:13", "n": "", "vs": [[13, "في الضحك أيضا تطغى الكآبة على القلب، وعاقبة الفرح الغم."]]}, {"l": "Isa 22:12", "n": "", "vs": [[12, "في ذلك اليوم يدعوكم السيد الرب القدير للبكاء والنوح وحلق الشعر والتنطق بالمسوح."]]}, {"l": "Isa 22:13", "n": "", "vs": [[13, "ولكنكم انهمكتم بالفرح والسرور وذبح الثيران وتضحية الغنم وأكل اللحم وشرب الخمر قائلين: «لنأكل ونشرب لأننا غدا نموت»."]]}, {"l": "Amo 6:3-6", "n": "", "vs": [[3, "أنتم يامن تتجاهلون يوم السوء وتقربون كرسي الظلم."], [4, "ويل للراقدين فوق أسرة من عاج، المسترخين فوق الأرائك، الآكلين لحم خيرة الحملان والعجول المختارة من وسط المعلف."], [5, "المغنين على صوت الرباب، المخترعين لأنفسهم آلات غناء كداود."], [6, "الشاربين خمرا في كؤوس، المتطيبين بأفضل العطور، ولا يكتئبون على خراب يوسف."]]}, {"l": "1Pe 4:2-4", "n": "", "vs": [[2, "وغايته أن يعيش بقية عم ay", "raw": "Ecc_7:18; Pro_20:1, Pro_23:29-35; Mat_6:24; 2Co_6:15-17", "note": "", "refs": [{"l": "Ecc 7:18", "n": "", "vs": [[18, "حسن أن تتشبث بهذا وأن لا تفرط في ذاك، لأن متقي الله يتفادى التطرف في كليهما."]]}, {"l": "Pro 20:1", "n": "", "vs": [[1, "الخمر مستهزئة، والمسكر صخاب، ومن يدمن عليها فليس بحكيم."]]}, {"l": "Pro 23:29-35", "n": "", "vs": [[29, "لمن المعاناة؟ لمن الويل والشقاء والمخاصمات والشكوى؟ لمن الجر اح بلا سبب؟ ولمن احمرار العينين؟"], [30, "إنها للمدمنين الخمر، الساعين وراء المسكر الممزوج."], [31, "لا تنظر إلى الخمر إذا التهبت بالاحمرار، وتألقت في الكأس، وسالت سائغة،"], [32, "فإنها في آخرها تلسع كالحية وتلدغ كالأفعوان."], [33, "فتشاهد عيناك أمورا غريبة، وقلبك يحدثك بأشياء ملتوية،"], [34, "فتكون مترنحا كمن يضطجع في وسط عباب البحر، أو كراقد على قمة سارية!"], [35, "فتقول: «ضر بوني ولكن لم أتوجع. لكموني فلم أشعر، فمتى أستيقظ؟ سأذهب ألتمس شربها مرة أخرى»."]]}, {"l": "Mat 6:24", "n": "", "vs": [[24, "لا يمكن لأحد أن يكون عبدا لسيدين: لأنه إما أن يبغض أحدهما فيحب الآخر، وإما أن يلزم أحدهما فيهجر الآخر. لا يمكنكم أن تكونوا عبيدا لله والمال معا."]]}, {"l": "2Co 6:15-17", "n": "", "vs": [[15, "وأي تحالف للمسيح مع إبليس؟ وأي نصيب للمؤمن مع غير المؤمن؟"], [16, "وأي وفاق لهيكل الله مع الأصنام؟ فإننا نحن هيكل الله الحي، وفقا لما قاله الله : «سأسكن في وسطهم، وأسير بينهم، وأكون إلههم وهم يكونون شعبا لي…"], [17, "لذلك اخرجوا من وسطهم، وكونوا منفصلين، يقول الرب، ولا تلمسوا ما هو نجس،"]]}], "kwAr": "أختبر الحماقة", "noteAr": ""}, {"kw": "till", "raw": "Ecc_6:12, Ecc_12:13", "note": "", "refs": [{"l": "Ecc 6:12", "n": "", "vs": [[12, "إذ من يدري ما هو خير للإنسان في الحيا ة التي يقضي فيها أياما قليلة باطلة كالظل؟ ومن يقدر أن يطلع الإنسان على ما سيحدث تحت الشمس من بعده؟"]]}, {"l": "Ecc 12:13", "n": "", "vs": [[13, "فلنسمع ختام الكلام كله: اتق الله ، واحفظ وصاياه، لأن هذا هو كل واجب الإنسان،"]]}], "kwAr": "حتى أرى", "noteAr": ""}, {"kw": "all", "raw": "Heb. the number of, Gen_47:9; Job_14:14; Psa_90:9-12", "note": "Heb. the number of, Gen_47:9; Job_14:14; Psa_90:9-12", "r n": "", "vs": [[20, "أما من تبقى من الأموريين والحثيين والفرزيين والحو يين واليبوسيين الذين لا ينتمون إلى إسرائيل،"], [21, "من ذراري الأمم التي عجز الإسرائيليون عن إفنائهم، فقد فرض عليهم سليمان خدمة التسخير كالعبيد إلى هذا اليوم."], [22, "أما أبناء إسرائيل فلم يسخر سليمان منهم أحدا، لأن منهم كان يتألف جنوده ورجال حاشيته وأمراؤه وضباطه وقادة مركباته وفرسانه،"]]}, {"l": "Ezr 2:58", "n": "", "vs": [[58, "فكانت جملة العائدين من خدام الهيكل وذراري عبيد سليمان ثلاث مئة واثنين وتسعين."]]}, {"l": "Neh 7:57", "n": "", "vs": [[57, "ومن نسل رجال سليمان العائدين من السبي: بنو سوطاي، وسوفرث وفريدا،"]]}], "kwAr": "عبيدا وإماء", "noteAr": ""}, {"kw": "and had", "raw": "Gen_17:12, Gen_17:13", "note": "", "refs": [{"l": "Gen 17:12", "n": "", "vs": [[12, "تختنون على مدى أجيالكم كل ذكر فيكم ابن ثمانية أيام سواء كان المولود من ذريتك أم كان ابنا لغريب مشترى بمالك ممن ليس من نسلك."]]}, {"l": "Gen 17:13", "n": "", "vs": [[13, "فعلى كل وليد سواء ولد في بيتك أم اشتري بمال أن يختن، فيكون عهدي في لحمكم عهدا أبديا."]]}], "kwAr": "كان لي", "noteAr": ""}, {"kw": "servants born in my house", "raw": "Heb. sons of my house", "note": "Heb. sons of my house", "refs": [], "kwAr": "عبيد ممن ولدوا في داري", "noteAr": "بالعبرانية: بنو بيتي."}, {"kw": "also", "raw": "Gen_13:2; 2Ki_3:4; 1Ch_27:29-31; 2Ch_26:10, 2Ch_32:27-29; Job_1:3, Job_42:12", "note": "", "refs": [{"l": "Gen 13:2", "n": "", "vs": [[2, "وكان أبرام يملك ثروة طائلة من المواشي والفضة والذهب."]]}, {"l": "2Ki 3:4", "n": "", "vs": [[4, "وكان ميشع ملك موآب يقوم بتربية المواشي، ويؤدي لملك إسرائيل مئة ألف خروف ومئة ألف كبش مع أصوافها."]]}, {"l": "1Ch 27:29-31", "n": "", "vs": [[29, "وشطراي الشاروني على قطعان البقر الراعي في شارون، وشافاط بن عدلاي على قطعان البقر السائم في الأودية."], [30, "وأوبيل الاسمعيلي على الجمال، ويحديا الميرونوثي على الحمير."], [31, "ويازير الهاجري على ماشية الغنم. كل هؤلاء كانوا المشرفين على أملاك الملك داود."]]}, {"l": "2Ch 26:10", "n": "", "vs": [[10, "كما شيد أبراجا في الصحراء، وحفر آبارا عديدة لأنه كان يملك ماشية كثيرة في الساحل والسهل، كذلك استخدم كرامين وفلاحين في الجبال والأراضي الخصيبة لأنه كان مولعا بالفلاحة."]]}, {"l": "2Ch 32:27-29", "n": "", "vs": [[27, "وأحرز حزقيا غنى ومجدا عظيمين، وبنى لنفسه مخازن للفضة والذهب والحجارة الكريمة والأطياب والأتراس وكل آنية ثمينة،"], [28, "ومخازن لمحاصيل الحنطة، ونتاج الكرمة والزيت، ومرابط لكل أنواع البهائم وحظائر للقطعان."], [29, "وبنى لنفسه قرى، وامتلك مواشي غنم وبقر بوفرة، لأن الله أغدق عليه أموالا كثيرة جدا."]]}, {"l": "Job 1:3", "n": "", "vs": [[3, "وبلغت مواشيه سبعة آلاف من الغنم، وثلاثة آلاف جمل، وخمس مئة زوج من البقر، وخمس مئة أتان. أما خدمه فكانوا كثيرين جدا. وكان هذا الرجل أعظم أبناء المشرق قاطبة."]]}, {"l": "Job 42:12", "n": "", "vs": [[12, "وبارك الرب آخرة أيوب أكثر من أولاه، فأصبح له أربعة عشر ألف خروف وستة آلاف من الإبل وألف زوج من البقر وألف أتان."]]}], "kwAr": "اقتنيت أيضا", "noteAr": ""}], "arS": [["واشتريت", ["H7069"]], [" ", []], ["عبيدا", ["H5650"]], [" ", []], ["وإماء", ["H8198"]], ["، ", []], ["وكان", ["H1961"]], [" لي عبيد ", []], ["ممن", ["H4480"]], [" ", []], ["ولدوا", ["H1121"]], [" في ", []], ["داري", ["H1004"]], ["، واقتنيت ", []], ["أيضا", ["H1571"]], [" ", []], ["قطعان", ["H6629", "H4735"]], [" ", []], ["بقر", ["H1241"]], [" ومواشي غنم، حتى فقت ", []], ["جميع", ["H3605"]], [" أسلافي ممن ", []], ["كانوا", ["H1961"]], [" ", []], ["قبلي", ["H6440"]], [" في ", []], ["أورشليم", ["H3389"]], [".", []]]}, {"c": 2, "v": 8, "text": "واكتنزت لنفسي فضة وذهبا، وكنوز الملوك والأقاليم، واتخذت لنفسي مغنين ومغنيات وزوجات وسراري، وكل ما هو متعة لقلب أبناء البشر.", "groups": [{"kw": "silver", "raw": "1Ki_9:14, 1Ki_9:28, 1Ki_10:10, 1Ki_14:21, 1Ki_14:22, 1Ki_14:27; 2Ch_9:11, 2Ch_9:15-21", "note": "", "refs": [{"l": "1Ki 9:14", "n": "", "vs": [[14, "وكان الذهب الذي أرسله حيرام إلى الملك سليمان مئة وعشرين وزنة ذهب (نحو أربعة آلاف وثلاث مئة وعشرين كيلوجراما)."]]}, {"l": "1Ki 9:28", "n": "", "vs": [[28, "فبلغوا أوفير حيث جلبوا من هناك أربع مئة وعشرين وزنة (نحو خمسة عشر ألفا ومئة وعشرين كيلوجراما) من الذهب، حملوها إلى الملك سليمان."]]}, {"l": "1Ki 10:10", "n": "", "vs": [[10, "وأهدت الملك مئة وعشرين وزنة (نحو أربعة آلاف وثلاث مئة وعشرين كيلو جراما) من الذهب وأطيابا كثيرة وحجارة كريمة، فكانت التوابل التي أهدتها ملكة سبأ للملك سليمان من الوفرة بحيث لم يجلب مثلها في ما بعد."]]}, {"l": "1Ki 14:21", "n": "", "vs": [[21, "أما رحبعام بن سليمان فقد ملك في يهوذا وكان عمره إحدى وأربعين سنة حين ملك، واستمر حكمه سبع عشرة سنة في أورشليم، المدينة التي اختارها الرب من بين جميع مدن إسرائيل ليضع اسمه عليها، وكان اسم أمه نعمة العمونية."]]}, {"l": "1Ki 14:22", "n": "", "vs": [[22, "وارتكب شعب يهوذا الشر في عيني الرب، فاستثاروا غيظه كما لم تستثره خطايا آبائهم التي ارتكبوها."]]}, {"l": "1Ki 14:27", "n": "", "vs": [[27, "فصنع الملك رحبعام عوضا عنها أتراسا نحاسية، سلمها لرؤساء حرس باب قصر الملك."]]}, {"l": "2Ch 9:11", "n": "", "vs": [[11, "فاستخدم الملك خشب الصندل في صنع سلالم لبيت الرب وقصر الملك، كما صنع منه أعوادا وقيثارات، ولم يكن لها نظير من قبل في أرض يهوذا."]]}, {"l": "2Ch 9:15-21", "n": "", "vs": [[15, "وصنع سليمان مئتي ترس من الذهب المطروق، استهلك كل ترس منها ست مئة شاقل من الذهب المطروق (نحو سبعة آلاف ومئتي جرام)،"], [16, "وثلاث مئة درع ذهبي، استهلك كل درع منها ثلاث مئة شاقل من الذهب (نحو ثلاثة آلاف وست مئة جرام)، جعلها الملك في قصر غابة لبنان."], [17, "وصنع الملك عرشا عظيما من عاج، غشاه بذهب خالص."], [18, "وكان للعرش ست درجات وموطيء من ذهب متصل به، ومسندان على جانبيه حول موضع الجلوس، وأسدان يقفان إلى جوار المسندين."], [19, "وأقيم على الدرجات الست اثنا عشر أسدا، ستة على كل جانب، فلم يكن لهذا العرش نظير في كل الممالك."], [20, "أما جميع آنية شرب الملك سليمان وسائر آنية قصر غابة لبنان، فقد كانت كلها مصنوعة من الذهب الخالص، فالفضة لم يكن لها قيمة في أيام سليمان،"], [21, "فقد كان سليمان يملك أسطولا بحريا تجاريا يعمل بالمشاركة مع رجال حيرام، فكان يبحر إلى ترشيش ثم يعود مرة كل ثلاث سنوات محملا بالذهب والفضة والعاج والقرود والطواويس."]]}], "kwAr": "فضة", "noteAr": ""}, {"kw": "men singers", "raw": "2Sa_19:35; Ezr_2:65", "note": "", "refs": [{"l": "2Sa 19:35", "n": "", "vs": [[35, "أنا اليوم قد بلغت الثمانين، فهل أستطيع أن أميز بين الطيب والرديء؟ وهل يلتذ عبدك بما يأكل ويشرب؟ وهل مازلت قادرا على الاستماع إلى أصوات المغنين والمغنيات؟ فلماذا يصبح عبدك عبئا على سيدي الملك؟"]]}, {"l": "Ezr 2:65", "n": "", "vs": [[65, "فضلا عن عبيدهم وإمائهم وعددهم سبعة آلاف وثلاث مئة وسبعة وثلاثون بالإضافة إلى مئتين من المغنين والمغنيات."]]}], "kwAr": "مغنين", "noteAr": ""}, {"kw": "musical instruments", "raw": "etc. Heb. musical instrument and instruments, 1Ch_25:1, 1Ch_25:6; Job_21:11, Job_21:12; Psa_150:3-5; Dan_3:5, Dan_3:7, Dan_3:15; Amo_6:5; The difficult words shiddah weshiddoth are variously rendered. The LXX have οινοχοον και οινοχοας, male and female cup-bearers, with which the Syriac and Arabic and Parkhurst agree; Aquila, κυλικον και κυλικια, a cup and smaller cups; Jerome, scyphos et urceolos, Vulgate urceos), goblets and pots; Targum, warm and cold baths; others, as M. Desvoeux, male and female captives; others, cooks and confectioners; others, a species of musical compositions, derived from Sido, a celebrated Phoenician woman, to whom Sanchoniatho attributes the invention of music; but others, with more probability, wives and concubines; and siddoth may be in this sense synonymous with the Arabic seedat, domina, conjux from sada, in Conj. V. conjugium inivit. Of the former, Solomon had three hundred, and of the latter, seven hundred; and if they are not mentioned here they are not mentioned at all, which is wholly unaccountable.", "note": "etc. Heb. musical instrument and instruments, 1Ch_25:1, 1Ch_25:6; Job_21:11, Job_21:12; Psa_150:3-5; Dan_3:5, Dan_3:7, Dan_3:15; Amo_6:5; The difficult words shiddah weshiddoth are variously rendered. The LXX have οινοχοον και οινοχοας, male and female cup-bearers, with which the Syriac and Arabic and Parkhurst agree; Aquila, κυλικον και κυλικια, a cup and smaller cups; Jerome, scyphos et urceolos, Vulgate urceos), goblets and pots; Targum, warm and cold baths; others, as M. Desvoeux, male and female captives; others, cooks and confectioners; others, a species of musical compositions, derived from Sido, a celebrated Phoenician woman, to whom Sanchoniatho attributes the invention of music; but others, with more probability, wives and concubines; and siddoth may be in this sense synonymous with the Arabic seedat, domina, conjux from sada, in Conj. V. conjugium inivit. Of the former, Solomon had three hundred, and of the latter, seven hundred; and if they are not mentioned here they are not mentioned at all, which is wholly unaccountable.", "refs": [{"l": "1Ch 25:1", "n": "", "vs": [[1, "واختار داود ورؤساء الجيش بعض أبناء آساف وهيمان ويدوثون، لقيادة خدمات القيادة بإعلان رسالة الله تصحبهم موسيقى العيدان والرباب والصنوج. وهذه أسماء الرجال الذين أدوا هذه الخدمات وواجباتهم:"]]}, {"l": "1Ch 25:6", "n": "", "vs": [[6, "وكانوا جميعهم يجيدون العزف على الصنوج والرباب والعيدان، بقيادة أبيهم، للاشتراك في العبادة بالهيكل. وكان آساف ويدوثون وهيمان يتلقون تعليماتهم من الملك."]]}, {"l": "Job 21:11", "n": "", "vs": [[11, "يسرحون صبيانهم كسرب، وأطفالهم يرقصون."]]}, {"l": "Job 21:12", "n": "", "vs": [[12, "يغنون بالدف والعود ويطربون لصوت المزمار،"]]}, {"l": "Psa 150:3-5", "n": "", "vs": [[3, "سبحوه بصوت بوق. سبحوه بالرباب والعود."], [4, "سبحوه بالدف والرقص. سبحوه بأوتار ومزمار."], [5, "سبحوه على وقع الصنوج. سبحوه بالصنوج المداوية."]]}, {"l": "Dan 3:5", "n": "", "vs": [[5, "أنكم حين تسمعون أصوات بوق القرن والناي والعود والرباب والقيثارة المثلثة والمزمار وكل أنواع الموسيقى، تنحنون وتسجدون لتمثال الذهب الذي نصبه نبوخذناصر الملك."]]}, {"l": "Dan 3:7", "n": "", "vs": [[7, "لهذا حالما سمعت الشعوب الحاضرة أصوات تلك الالات الموسيقية المختلفة، انحنت وسجدت لتمثال الذهب المنصوب."]]}, {"l": "Dan 3:15", "n": "", "vs": [[15, "والآن إن كنتم مستعدين لدى سماعكم صوت الالات الموسيقية المختلفة أن تنحنوا وتسجدوا للتمثال الذي صنعته، أعفو عنكم. ولكن إن أبيتم السجود، تطرحون في تلك الساعة في وسط أتون النار المتقدة. وأي إله يقدر أن ينقذكم عندئذ من يدي؟»"]]}, {"l": "Amo 6:5", "n": "", "vs": [[5, "المغنين على صوت الرباب، المخترعين لأنفسهم آلات غناء كداود."]]} ا»."]]}, {"l": "Psa 17:14", "n": "", "vs": [[14, "أنقذني بيدك يارب من الناس. من أهل الدنيا الذين نصيبهم هو في هذه الحياة. أنت تملأ بطونهم من خيراتك المخزونة، فيشبع أبناؤهم، ويورثون أولادهم ما يفضل عنهم."]]}, {"l": "Psa 39:6", "n": "", "vs": [[6, "إنما كخيال يتمشى الإنسان، فعبثا يكافح الناس. يجمع الواحد منهم ثروة ولا يدري من يرثها من بعده."]]}, {"l": "Psa 49:10", "n": "", "vs": [[10, "لكن الحكماء يموتون كما يموت الجاهل والغبي، تاركين ثروتهم لغيرهم."]]}, {"l": "Luk 12:20", "n": "", "vs": [[20, "ولكن الله قال له: ياغبي، هذه الليلة تطلب نفسك منك، فلمن يبقى ما أعددته؟"]]}, {"l": "Luk 16:27", "n": "", "vs": [[27, "فقال: ألتمس منك إذن، ياأبي، أن ترسله إلى بيت أبي،"]]}, {"l": "Luk 16:28", "n": "", "vs": [[28, "فإن عندي خمسة إخوة، حتى يشهد لهم منذرا، لئلا يأتوا هم أيضا إلى مكان العذاب هذا."]]}, {"l": "Act 20:29", "n": "", "vs": [[29, "فإني أعلم أنه بعد رحيلي سيندس بينكم ذئاب خاطفة، لا تشفق على القطيع."]]}, {"l": "Act 20:30", "n": "", "vs": [[30, "بل إن قوما منكم أنتم سيقومون ويعلمون تعاليم منحرفة، ليجروا التلاميذ وراءهم."]]}, {"l": "1Co 3:10", "n": "", "vs": [[10, "وبحسب نعمة الله الموهوبة لي، وضعت الأساس كما يفعل البناء الماهر، وغيري يبني عليه. ولكن، لينتبه كل واحد كيف يبني عليه."]]}], "kwAr": "سأتركه", "noteAr": ""}], "arS": [["وكرهت", ["H8130"]], [" ", []], ["كل", ["H3605"]], [" ما ", []], ["سعيت", ["H5999"]], [" من أجله ", []], ["تحت", ["H8478"]], [" ", []], ["الشمس", ["H8121"]], ["، ", []], ["لأني", ["H589"]], [" ", []], ["سأتركه", ["H5117"]], [" لمن ", []], ["يخلفني", ["H310"]], [".", []]]}, {"c": 2, "v": 19, "text": "ومن يدري: أيكون حكيما أم جاهلا؟ ومع ذلك فإنه سيتولى كل عملي الذي بذلت فيه كل جهدي وحكمتي تحت الشمس. وهذا أيضا باطل.", "groups": [{"kw": "who knoweth", "raw": "Ecc_3:22; 1Ki_12:14-20, 1Ki_14:25-28; 2Ch_10:13-16, 2Ch_12:9, 2Ch_12:10", "note": "", "refs": [{"l": "Ecc 3:22", "n": "", "vs": [[22, "فرأيت أنه ليس أفضل من أن يستمتع الإنسان بكده، لأن هذا نصيبه، لأنه من يرجعه ليرى ما سيجري من بعده؟"]]}, {"l": "1Ki 12:14-20", "n": "", "vs": [[14, "وخاطبهم بما أشار عليه الأحداث قائلا: «أبي أثقل عليكم النير وأنا أضاعفه. أبي أدبكم بالسياط، وأنا أؤدبكم بالعقارب»."], [15, "ورفض رحبعام الاستجابة لمطالب الشعب، وكان ذلك من الرب لينفذ ما تكلم به على لسان أخيا الشيلوني بشأن يربعام بن نباط."], [16, "فلما رأى كل بني إسرائيل أن الملك لم يستجب لمطالبهم، أجابوه: «أي نصيب لنا في داود، وأي حظ لنا بابن يسى؟ فإلى بيوتك ياإسرائيل. وليملك رحبعام على أهله وعشيرته». وانصرف الإسرائيليون عنه إلى منازلهم."], [17, "ولم يبق تحت حكمه سوى أبناء إسرائيل المقيمين في مدن يهوذا، فملك رحبعام عليهم."], [18, "وعندما أرسل الملك رحبعام أدورام الموكل على أعمال التسخير إلى أسباط إسرائيل رجموه بالحجارة فمات، فبادر الملك رحبعام واستقل مركبته هاربا إلى أورشليم."], [19, "وهكذا تمرد إسرائيل على ذرية داود إلى هذا اليوم."], [20, "وعندما علم جميع بني إسرائيل برجوع يربعام من مصر، استدعوه للمثول أمام جماعة إسرائيل، ونصبوه ملكا عليهم، ولم يبق تحت حكم رحبعام سوى سبط يهوذا."]]}, {"l": "1Ki 14:25-28", "n": "", "vs": [[25, "وفي السنة الخامسة للملك رحبعام هاجم شيشق ملك مصر أورشليم."], [26, "واستولى على خزائن بيت الرب وخزائن قصر الملك، وسلب كل ما فيها، لاسيما الأتراس الذهبية التي عملها سليمان."], [27, "فصنع الملك رحبعام عوضا عنها أتراسا نحاسية، سلمها لرؤساء حرس باب قصر الملك."], [28, "فكان كلما دخل الملك إلى هيكل الرب يحملها الحراس أمامه، ثم يعيدونها إلى غرفة الحرس."]]}, {"l": "2Ch 10:13-16", "n": "", "vs": [[13, "فأجابهم بقسوة لأنه تجاهل مشورة الشيوخ، التي أسدوها إليه."], [14, "وخاطبهم بما أشار عليه به الشباب قائلا: «أبي ثقل عليكم النير وأنا أزيد عليه. أبي أدبكم بالسياط، وأنا أؤدبكم بالعقارب»."], [15, "ورفض الملك الاستجابة لمطالب الشعب، وكان السبب من الرب ليتم ما تكلم به على لسان أخيا الشيلوني بشأن يربعام بن نباط."], [16, "فلما رأى كل بني إسرائيل أن الملك لم يستجب لمطالبهم، قالوا: «أي نصيب لنا في داود، وأي حظ لنا في ابن يسى؟ فليمض كل واحد إلى بيته ياإسرائيل، واعتن الآن ببيتك ياداود». وانصرف الإسرائيليون عنه إلى منازلهم."]]}, {"l": "2Ch 12:9", "n": "", "vs": [[9, "وهكذا هاجم شيشق ملك مصر أورشليم، واستولى على خزائن بيت الرب، وخزائن قصر الملك، وغنم أتراس الذهب التي عملها سليمان."]]}, { لشمس، لأني سأتركه لمن يخلفني."]]}, {"l": "Ecc 9:18", "n": "", "vs": [[18, "الحكمة خير من آلات الحرب، وخاطيء واحد يفسد خيرا جزيلا."]]}, {"l": "2Ch 31:20", "n": "", "vs": [[20, "هذا ما أجراه حزقيا في كل بلاد يهوذا، صانعا كل ما هو صالح وقويم وحق أمام الرب إلهه."]]}, {"l": "2Ch 31:21", "n": "", "vs": [[21, "وكل ما قام به في خدمة بيت الله كان طاعة للشريعة والوصية، وسعيا وراء طلب الله، بكل ولاء، فأفلح."]]}, {"l": "2Ch 33:2-9", "n": "", "vs": [[2, "وارتكب الشر أمام الرب، مقترفا رجاسات الأمم الذين طردهم الرب من أمام بني إسرائيل."], [3, "وعاد وشيد معابد المرتفعات التي هدمها أبوه حزقيا، وأقام مذابح للبعل ونصب تماثيل عشتاروث، وسجد لكواكب السماء وعبدها."], [4, "وبنى مذابح في هيكل الرب الذي قال عنه الرب في أورشليم أجعل اسمي إلى الأبد."], [5, "وشيد في فناءي بيت الرب مذابح لكل كواكب السماء."], [6, "وأجاز أولاده في النار في وادي ابن هنوم، ولجأ إلى السحرة والعرافات وأصحاب الجان وأوغل في ارتكاب الشر مما أثار غضب الرب الشديد عليه."], [7, "وعمل تمثالا نصبه في هيكل الله، الذي قال الله عنه لداود ولسليمان ابنه: «في هذا الهيكل وفي أورشليم التي اخترتها من بين جميع مدن أسباط إسرائيل أجعل اسمي إلى الأبد."], [8, "وإن أطاعوا وعملوا كل ما أمرتهم به، وطبقوا كل الشريعة والفرائض والأحكام التي أوصيتهم بها على لسان موسى، فإنني لن أزعزع أقدام إسرائيل عن الأرض التي عينتها لآبائهم»."], [9, "غير أن منسى أضل شعب يهوذا وأهل أورشليم وأغواهم لارتكاب شرور أشد هولا من شرور الأمم الذين طردهم الرب من أمام بني إسرائيل."]]}, {"l": "2Ch 34:2", "n": "", "vs": [[2, "وكان ملكا صالحا سار في طريق جده داود من غير أن يحيد عنه يمينا أو شمالا."]]}, {"l": "2Ch 35:18", "n": "", "vs": [[18, "ولم يجر احتفال مثله في إسرائيل منذ أيام صموئيل النبي. ولم يحتفل أحد ملوك إسرائيل بالفصح بمثل ما احتفل به يوشيا والكهنة واللاويون وكل يهوذا وإسرائيل الحاضرون، وأهل أورشليم."]]}, {"l": "2Ch 36:5-10", "n": "", "vs": [[5, "وكان يهوياقيم في الخامسة والعشرين من عمره حين ملك، ودام حكمه إحدى عشرة سنة في أورشليم، وارتكب الشر في عيني الرب."], [6, "ثم هاجمه نبوخذناصر ملك بابل وأخذه أسيرا مقيدا إلى بابل."], [7, "واستولى نبوخذناصر على بعض آنية هيكل الرب، وأخذها معه إلى بابل، حيث وضعها في هيكله هناك."], [8, "أما بقية أخبار يهوياقيم وشروره التي اقترفها فهي مدونة في كتاب تاريخ ملوك إسرائيل ويهوذا. ثم خلفه ابنه يهوياكين على الملك."], [9, "وكان يهوياكين في الثامنة عشرة من عمره حين ملك، ودام حكمه ثلاثة أشهر وعشرة أيام في أورشليم، وارتكب الشر في عيني الرب."], [10, "وفي مطلع السنة الجديدة، أرسل الملك نبوخذناصر فقبض عليه ونقله إلى بابل مع آنية بيت الرب الثمينة، وولى أخاه صدقيا خلفا له على يهوذا وأورشليم."]]}, {"l": "Jer 22:15", "n": "", "vs": [[15, "أتظن أنك صرت ملكا لأنك بنيت بيتك من الأرز؟ أما أكل أبوك وشرب وأجرى عدلا وحقا، فتمتع بالخيرات؟"]]}, {"l": "Jer 22:17", "n": "", "vs": [[17, "«أما أنت فعيناك وقلبك متهافتة على الربح الحرام، وعلى سفك الدم البريء، وعلى الظلم والابتزاز»."]]}], "kwAr": "بحكمة ومعرفة وحذاقة", "noteAr": ""}, {"kw": "leave", "raw": "Heb. give", "note": "Heb. give", "refs": [], "kwAr": "لرجل آخر", "noteAr": "بالعبرانية: يعطي."}], "arS": [["إذ", ["H3588"]], [" قد ", []], ["يترك", ["H5414"]], [" ", []], ["الإنسان", ["H120"]], [" كل ما ", []], ["تعب", ["H5999", "H5998"]], [" فيه ", []], ["بحكمة", ["H2451"]], [" ", []], ["ومعرفة", ["H1847"]], [" ", []], ["وحذاقة", ["H3788"]], [" ", []], ["لرجل", ["H120"]], [" آخر يتمتع بما ", []], ["لم", ["H3808"]], [" يشق به. ", []], ["هذا", ["H2088"]], [" ", []], ["أيضا", ["H1571"]], [" ", []], ["باطل", ["H1892"]], [" ", []], ["وشر", ["H7451"]], [" ", []], ["عظيم", ["H7227"]], [".", []]]}, {"c": 2, "v": 22, "text": "فأي نفع للإنسان من جميع تعبه ومكابدته العناء الذي قاسى منه تحت الشمس؟", "groups": [{"kw": "hath man", "raw": "Ecc_1:3, Ecc_3:9, Ecc_5:10, Ecc_5:11, Ecc_5:17, Ecc_6:7, Ecc_6:8, Ecc_8:15; Pro_16:26; 1Ti_6:8", "note": "", "refs": [{"l": "Ecc 1:3", "n": "", "vs": [[3, "ما الفائدة من كل تعب الإنسان الذي يتعبه تحت الشمس."]]}, {"l": "Ecc 3:9", "n": "", "vs": [[9, "فأي نفع يجنيه العامل من كده؟"]]}, {"l": "Ecc 5:10", "n": "", "vs": [[10, "من يحب الفضة لا يشبع منها، والمولع بالغنى لا يشبع من ربح. وهذا أيضا باطل."]]}, {"l": "Ecc 5:11", "n": "", "vs": [[11, "إن كثرت الخير " ويتمتع ", []], ["بتعب", ["H5999"]], [" ", []], ["يديه", ["H3027"]], [". ", []], ["وهذا", ["H2090"]], [" ", []], ["أيضا", ["H1571"]], ["، كما ", []], ["أرى", ["H7200"]], ["، ", []], ["هو", ["H1931"]], [" من يد ", []], ["الله", ["H430"]], [".", []]]}, {"c": 2, "v": 25, "text": "إذ بمعزل عنه من يستطيع أن يأكل ويستمتع؟", "groups": [{"kw": "who can", "raw": "Ecc_2:1-12; 1Ki_4:21-24", "note": "", "refs": [{"l": "Ecc 2:1-12", "n": "", "vs": [[1, "فناجيت نفسي: تعالي الآن أمتحنك بالفرح، فأستمتع باللذة! وإذا هذا أيضا باطل."], [2, "قلت عن الضحك: هذا جنون، وعن اللذة ما جدواها."], [3, "وبعد أن فحصت قلبي، حاولت أن أشرح صدري بالخمر، مع أن عقلي مازال يرشدني بالحكمة، وأن أختبر الحماقة حتى أرى ما هو صالح لأبناء البشر فيصنعوه تحت السماء طوال أيام حياتهم."], [4, "فأنجزت أعمالا عظيمة، وشيدت لي بيوتا وغرست كروما."], [5, "وأنشأت لنفسي جنات وبساتين غرستها أشجارا من جميع الأصناف،"], [6, "وحفرت برك مياه لأروي الأشجار النامية،"], [7, "واشتريت عبيدا وإماء، وكان لي عبيد ممن ولدوا في داري، واقتنيت أيضا قطعان بقر ومواشي غنم، حتى فقت جميع أسلافي ممن كانوا قبلي في أورشليم."], [8, "واكتنزت لنفسي فضة وذهبا، وكنوز الملوك والأقاليم، واتخذت لنفسي مغنين ومغنيات وزوجات وسراري، وكل ما هو متعة لقلب أبناء البشر."], [9, "وازددت عظمة حتى فقت جميع أسلافي في أورشليم، دون أن تبارحني الحكمة."], [10, "ولم أحرم عيني مما اشتهتاه، ولم أصد قلبي عن أية متعة، فابتهج قلبي لكل تعبي، وكان هذا ثوابي عن كل مشقتي."], [11, "ثم تأملت كل ما صنعته يداي وما كابدته من تعب في عمله، فإذا الجميع باطل، وكملاحقة الريح، ولا جدوى من شيء تحت الشمس."], [12, "ورجعت أمعن التفكير في الحكمة والجنون والحماقة، إذ ماذا في وسع من يخلف الملك أن يفعل أكثر مما تم فعله؟"]]}, {"l": "1Ki 4:21-24", "n": "", "vs": [[21, "وامتد سلطان سليمان على جميع الممالك الواقعة ما بين نهر الفرات إلى أرض الفلسطينيين وحتى تخوم مصر. فكانت هذه الممالك تقدم له الجزية وتخضع له كل أيام حياته."], [22, "وكانت متطلبات القصر اليومية من الطعام ثلاثين كرسميذ (نحو سبعة آلاف ومئتي لتر)، وستين كر دقيق،"], [23, "وعشرة ثيران مسمنة، وعشرين ثورا من المراعي، ومئة خروف، فضلا عن الأيائل والغزلان واليحامير والإوز المسمن،"], [24, "لأن سلطانه كان ممتدا على كل الأراضي الواقعة غربي نهر الفرات من تفسح إلى غزة وعلى ملوكها، فكان السلام يحيط به من كل جانب."]]}], "kwAr": "من يستطيع", "noteAr": ""}], "arS": [["إذ", ["H3588"]], [" ", []], ["بمعزل", ["H2351"]], [" عنه ", []], ["من", ["H4480", "H4310"]], [" يستطيع أن ", []], ["يأكل", ["H398"]], [" ", []], ["ويستمتع", ["H2363"]], ["؟", []]]}, {"c": 2, "v": 26, "text": "لأن المرء الذي يحظى برضى الله ينعم الله عليه بالحكمة والمعرفة والفرح. أما الخاطيء فيفرض عليه عناء الجمع والادخار، ليكون ذلك من نصيب من يرضي الله . وهذا أيضا باطل كملاحقة الريح.", "groups": [{"kw": "in his sight", "raw": "Heb. before him, Gen_7:1; Luk_1:6", "note": "Heb. before him, Gen_7:1; Luk_1:6", "refs": [{"l": "Gen 7:1", "n": "", "vs": [[1, "وقال الرب لنوح: «هيا ادخل أنت وأهل بيتك جميعا إلى الفلك لأني وجدتك وحدك صالحا أمامي في هذا الجيل."]]}, {"l": "Luk 1:6", "n": "", "vs": [[6, "وكان كلاهما بارين أمام الله، يسلكان وفقا لوصايا الرب وأحكامه كلها بغير لوم."]]}], "kwAr": "يحظى برضى الله", "noteAr": "بالعبرانية: أمامه. انظر تك 7: 1؛ لو 1: 6"}, {"kw": "wisdom", "raw": "2Ch_31:20, 2Ch_31:21; Pro_3:13-18; Isa_3:10, Isa_3:11; Joh_16:24; Rom_14:17, Rom_14:18; 1Co_1:30, 1Co_1:31; Gal_5:22, Gal_5:23; Col_1:9-12, Col_3:16, Col_3:17; Jam_3:17", "note": "", "refs": [{"l": "2Ch 31:20", "n": "", "vs": [[20, "هذا ما أجراه حزقيا في كل بلاد يهوذا، صانعا كل ما هو صالح وقويم وحق أمام الرب إلهه."]]}, {"l": "2Ch 31:21", "n": "", "vs": [[21, "وكل ما قام به في خدمة بيت الله كان طاعة للشريعة والوصية، وسعيا وراء طلب الله، بكل ولاء، فأفلح."]]}, {"l": "Pro 3:13-18", "n": "", "vs": [[13, "طوبى للإنسان الذي عثر على الحكمة وللرجل الذي أحرز فهما،"], [14, "لأن مكاسبها أفضل من مكاسب الفضة، وأرباحها خير من أرباح الذهب الخالص."], [15, "هي أثمن من الجواهر، وكل نفائسك لا تعادلها."], [16, "في يمينها حياة مديدة وفي يسارها غنى وجاه."], [17, "طرقها طرق نعم، ودروبها دروب سلام."], [18, "هي شجرة حياة لمن يتشبث بها، وطوبى لمن يتمسك بها."]]}, {"l": "Isa 3:10", "n": "", "vs": [[10, "ولكن بشروا الصديقين بالخير لأنهم سيتمتعون بثواب أعمالهم"]]}, {"l": "Isa 3:11", "n": "", "vs": [[11, "أما الشرير فويل له وبئس المصير لأنه يجازى على ما جنته يداه"]]}, {"l": "Joh 16:24", "n": "", "vs": [[24, "حتى الآن لم تطلبوا باسمي شيئا. اطلبوا تنالوا، فيكون فرحكم كاملا."]]}, {"l": "Rom 14:17", "n": "", "vs": [[17, "إذ ليس ملكوت الله بأكل وشرب، بل هو بر وسلام وفرح في الروح القدس."]]}, {"l": "Rom 14:18", "n": "", "vs": [[18, "فمن خدم المسيح هكذا، كان مقبولا عند الله وممدوحا عند الناس."]]}, {"l": "1Co 1:30", "n": "", "vs": [[30, "وبفضل الله صار لكم مقام في المسيح يسوع الذي جعل لنا حكمة من الله وبرا وقداسة وفداء،"]]}, {"l": "1Co 1:31", "n": "", "vs": [[31, "حتى إن «من افتخر، فليفتخر بالرب»، على حد ما قد كتب."]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Gal 5:23", "n": "", "vs": [[23, "والوداعة وضبط النفس. وليس من قانون يمنع مثل هذه الفضائل."]]}, {"l": "Col 1:9-12", "n": "", "vs": [[9, "لذلك نحن أيضا، من اليوم الذي فيه سمعنا بأخباركم، مازلنا نصلي ونتضرع لأجلكم، لأن تمتلئوا من تمام المعرفة لمشيئة الله في كل حكمة وإدراك روحي،"], [10, "لكي تسلكوا سلوكا لائقا بالرب ومرضيا في كل شيء، منتجين الثمر في كل عمل صالح ونامين في معرفة الله إلى التمام،"], [11, "متشددين بكل قوة موافقة لقدرة مجده، لتتمكنوا تماما من الاحتمال وطول البال،"], [12, "رافعين الشكر بفرح للآب الذي جعلكم أهلا للاشتراك في ميراث القديسين في (ملكوت) النور،"]]}, {"l": "Col 3:16", "n": "", "vs": [[16, "لتسكن كلمة المسيح في داخلكم بغنى، في كل حكمة، معلمين وواعظين بعضكم بعضا، مرنمين بمزامير وتسابيح وأناشيد روحية في قلوبكم لله، رافعين له الحمد."]]}, {"l": "Col 3:17", "n": "", "vs": [[17, "ومهما كان ما تعملونه، بالقول أو بالفعل، فليجر كل شيء باسم الرب يسوع، رافعين به الشكر لله الآب."]]}, {"l": "Jam 3:17", "n": "", "vs": [[17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}], "kwAr": "بالحكمة والمعرف
