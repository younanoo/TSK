 ""}], "arS": [["وشاهدت", ["H7200"]], [" ", []], ["عبيدا", ["H5650"]], [" يمتطون ", []], ["صهوات", ["H5921"]], [" ", []], ["الجياد", ["H5483"]], ["، ", []], ["وأمراء", ["H8269"]], [" ", []], ["يسيرون", ["H1980"]], [" ", []], ["على", ["H5921"]], [" الأقدام ", []], ["كالعبيد", ["H5650"]], [".", []]]}, {"c": 10, "v": 8, "text": "كل من يحفر حفرة يقع فيها، ومن ينقض جدارا تلدغه حية.", "groups": [{"kw": "that", "raw": "Jdg_9:5, Jdg_9:53-57; 2Sa_17:23, 2Sa_18:15; Est_7:10; Psa_7:15, Psa_7:16, Psa_9:15, Psa_9:16; Pro_26:27", "note": "", "refs": [{"l": "Jdg 9:5", "n": "", "vs": [[5, "واقتحم بهم بيت أبيه في عفرة، حيث ذبح إخوته السبعين على حجر واحد، ولم ينج إلا يوثام بن يربعل الأصغر الذي تمكن من الاختباء."]]}, {"l": "Jdg 9:53-57", "n": "", "vs": [[53, "فألقت امرأة حجر رحى على رأسه فشجت جمجمته."], [54, "فاستدعى على التو حامل سلاحه وقال له: «اخترط سيفك واقتلني لئلا يقولوا عني: قتلته امرأة». فطعنه بالسيف فمات."], [55, "فلما رأى رجال أبيمالك أن قائدهم قد مات انصرف كل منهم إلى مكانه."], [56, "وهكذا عاقب الله أبيمالك على جريمته التي ارتكبها بحق أبيه حين قتل إخوته السبعين."], [57, "وكذلك رد الله شر أهل شكيم على رؤوسهم، وبذلك تحققت لعنة يوثام بن يربعل."]]}, {"l": "2Sa 17:23", "n": "", "vs": [[23, "وعندما رأى أخيتوفل أن مشورته لم يعمل بها، ركب حماره وتوجه إلى بيته في مسقط رأسه، ثم نظم شؤون عائلته، وخنق نفسه فمات، ودفن في قبر أبيه."]]}, {"l": "2Sa 18:15", "n": "", "vs": [[15, "ثم أحاط بالشجرة عشرة غلمان، حاملي سلاح يوآب، وأجهزوا على أبشالوم فمات."]]}, {"l": "Est 7:10", "n": "", "vs": [[10, "فصلبوا هامان على الخشبة التي أعدها لمردخاي. ثم هدأت سورة غضب الملك."]]}, {"l": "Psa 7:15", "n": "", "vs": [[15, "حفر بئرا وعمقها، فسقط فيها."]]}, {"l": "Psa 7:16", "n": "", "vs": [[16, "شره يرتد على رأسه، وظلمه يهبط على هامته."]]}, {"l": "Psa 9:15", "n": "", "vs": [[15, "لقد هوت الشعوب في أعماق الحفرة التي حفروها، وأطبق الفخ الذي نصبوه على أرجلهم."]]}, {"l": "Psa 9:16", "n": "", "vs": [[16, "الرب معروف بعدله، قضى أن يقع الشرير في شرك أعماله."]]}, {"l": "Pro 26:27", "n": "", "vs": [[27, "من يحفر حفرة لإيذاء غيره يقع فيها، ومن دحرج حجرا يرتد عليه."]]}], "kwAr": "يحفر حفرة", "noteAr": ""}, {"kw": "a serpent", "raw": "Amo_5:19, Amo_9:3", "note": "", "refs": [{"l": "Amo 5:19", "n": "", "vs": [[19, "فتكونون كرجل هرب من وجه أسد فلقيه دب، أو كمن دخل إلى بيت واتكأ بيده على حائط فلدغته أفعى."]]}, {"l": "Amo 9:3", "n": "", "vs": [[3, "وإن اختبأوا في أعالي الكرمل فهناك أبحث عنهم وأعتقلهم. وإن تواروا عني في أعماق البحر فإني آمر هناك الحية فتلدغهم."]]}], "kwAr": "تلدغه حية", "noteAr": ""}], "arS": [["كل من ", []], ["يحفر", ["H2658"]], [" ", []], ["حفرة", ["H1475"]], [" ", []], ["يقع", ["H5307"]], [" فيها، ومن ", []], ["ينقض", ["H6555"]], [" ", []], ["جدارا", ["H1447"]], [" ", []], ["تلدغه", ["H5391"]], [" ", []], ["حية", ["H5175"]], [".", []]]}, {"c": 10, "v": 9, "text": "ومن يقلع حجارة تؤذه، ومن يشقق حطبا يتعرض لخطرها.", "groups": [], "arS": [["ومن ", []], ["يقلع", ["H5265"]], [" ", []], ["حجارة", ["H68"]], [" ", []], ["تؤذه", ["H6087"]], ["، ومن ", []], ["يشقق", ["H1234"]], [" ", []], ["حطبا", ["H6086"]], [" ", []], ["يتعرض", ["H5533"]], [" لخطرها.", []]]}, {"c": 10, "v": 10, "text": "إن كل الحديد ولم يشحذ صاحبه حده، فعليه أن يبذل جهدا أكبر! والحكمة تسعف على النجاح.", "groups": [{"kw": "wisdom", "raw": "Ecc_10:15, Ecc_9:15-17; Gen_41:33-39; Exo_18:19-23; 1Ki_3:9; 1Ch_12:32; 2Ch_23:4-11; Mat_10:16; Act_6:1-9, 15:2-21; Rom_16:19; 1Co_14:20; Eph_5:15-17; Col_4:5; Jam_1:5", "note": "", "refs": [{"l": "Ecc 10:15", "n": "", "vs": [[15, "كد الجاهل يعييه، لأنه يضل طريقه إلى المدينة."]]}, {"l": "Ecc 9:15-17", "n": "", "vs": [[15, "وكان يقيم في تلك المدينة رجل مسكين حكيم أنقذ المدينة بفضل حكمته. ولكن أحدا لم يذكره."], [16, "فقلت: إن الحكمة خير من القوة. غير أن حكمة المسكين محتقرة وكلامه غير مسموع."], [17, "كلام الحكماء المسموع في الهدوء خير من صراخ الحكام بين الجهال."]]}, {"l": "Gen 41:33-39", "n": "", "vs": [[33, "والآن ليبحث فرعون عن رجل بصير حكيم يوليه على البلاد،"], [34, "وليقم فرعون نظارا على أرض مصر يجبون خمس غلتها في سنوات الرخاء السبع."], [35, "وليجمعوا كل طعام سنوات الخير المقبلة، ويخزنوا القمح بتفويض من فرعون ويحفظوه في المدن ليكون طعاما،"], [36, "ومؤونة لأهل الأرض في سنوات المجاعة السبع التي ستسود أرض مصر فلا يهلكون جوعا»."], [37, "فاستحسن فرعون ورجاله جميعا هذا الكلام،"], [38, "وقال فرعون لعبيده: «هل نجد نظير هذا رجلا فيه روح الله؟»"], [39, "ثم قال فرعون ليوسف: «من حيث أن الله قد أطلعك على كل هذا، فليس هناك بصير وحكيم نظيرك."]]}, {"l": "Exo 18:19-23", "n": "", "vs": [[19, "فأصغ إلى صوتي لأسدي لك نصيحة، وليكن الله معك. فلتكن أنت ممثل الشعب أمام الله، فترفع إليه دعاواهم."], [20, "وعلمهم الفرائض والشرائع، وأعلن لهم الطريق الذي يسلكونه، وما يستوجب عليهم القيام به من أعمال."], [21, "ولكن اختر من بين الشعب رجالا مقتدرين خائفين الله أمناء يبغضون الرشوة، تقيمهم عليهم رؤساء لفئات الألوف والمئات والخماسين والعشرات."], [22, "فيقضون للشعب في الدعاوى الصغيرة في كل حين. أما القضايا المستعصية فيرفعونها إليك، فيخفف ذلك عنك، إذ يشاركونك في حمل العبء."], [23, "فإن فعلت هذا وأوصاك الله به، أمكنك القيام بمسئولياتك، ويمضي جميع هذا الشعب إلى مكانه بسلام»."]]}, {"l": "1Ki 3:9", "n": "", "vs": [[9, "فهب عبدك قلبا فهيما لأقضي بين شعبك، وأميز بين الخير والشر، لأنه من يستطيع أن يحكم شعبك العظيم هذا؟»"]]}, {"l": "1Ch 12:32", "n": "", "vs": [[32, "ومن سبط يساكر، من ذوي الخبرة والحكمة في سياسة شؤون إسرائيل: مئتان من الرؤساء مع أقربائهم الذين تحت إمرتهم."]]}, {"l": "2Ch 23:4-11", "n": "", "vs": [[4, "وإليكم ما يجب أن تفعلوا: ليقم ثلث الحراس من الكهنة واللاويين، الذين يتولون الخدمة يوم السبت بحراسة الأبواب."], [5, "والثلث الثاني يحرس قصر الملك، والثلث الثالث يحرس باب الأساس، أما بقية الشعب فليحتشدوا في ديار الهيكل."], [6, "ويحظر على غير الكهنة والذين يخدمون من اللاويين دخول هيكل الرب، لأنهم وحدهم مقدسون. أما بقية الشعب فليقوموا بحراسة ما عهد الرب إليهم به."], [7, "وعلى اللاويين الإحاطة بالملك، وكل واحد منهم مدجج بسلاحه. وليقتل كل من يتسلل إلى الهيكل من الغرباء. رافقوا الملك في غدواته وروحاته»."], [8, "فنفذ اللاويون وكل أبناء يهوذا أوامر يهوياداع الكاهن، وجند كل قائد رجاله القائمين على الخدمة في يوم السبت والمعفين منها، لأن يهوياداع الكاهن لم يسرح أية فرقة."], [9, "فسلم يهوياداع رؤساء المئات حراب الملك داود ودروعه وأتراسه، التي كانت محفوظة في الهيكل،"], [10, "وأوقف جميع الحراس وكل واحد سلاحه بيده محيطين بالملك، إلى جانب المذبح والهيكل، من الطرف الأيمن للهيكل حتى الطرف الأيسر منه."], [11, "ثم أخرجوا ابن الملك وتوجوه، وأعطوه نسخة من شهادة العهد، ونصبوه ملكا. ومسحه يهوياداع وأبناؤه هاتفين: «ليحي الملك!»"]]}, {"l": "Mat 10:16", "n": "", "vs": [[16, "ها أنا أرسلكم مثل الخراف بين الذئاب، فكونوا متنبهين كالحيات ومسالمين كالحمام."]]}, {"l": "Act 6:1-9", "n": "", "vs": [[1, "وإذ تكاثر التلاميذ في تلك الأيام، احتج اليهود اليونانيون على العبرانيين، لأن أراملهم لم يكن يحصلن على نصيب من الإعانات اليومية."], [2, "فدعا الرسل الاثنا عشر جماعة التلاميذ وقالوا لهم: «لا يصح أن نترك نحن كلمة الله لنقوم بتوزيع الإعانات!"], [3, "فاختاروا، أيها الإخوة، سبعة رجال منكم، لهم شهادة حسنة، ممتلئين من الروح القدس والحكمة، فنعينهم ليقوموا بهذه المهمة."], [4, "أما نحن، فنداوم على الصلاة وخدمة الكلمة»."], [5, "فاستحسنت الجماعة كلها هذا الرأي؛ ووقع الاختيار على استفانوس، وهو رجل مملوء من الإيمان والروح القدس، وفيلبس، وبروخورس، ونيكانور، وتيمون، وبرميناس، ونيقولاوس الأنطاكي المتهود."], [6, "وقدموهم للرسل، فصلوا ووضعوا أيديهم عليهم."], [7, "فزادت كلمة الله انتشارا، وتكاثر عدد التلاميذ في أورشليم، وأذعن للإيمان مجموعة كبيرة من الكهنة."], [8, "وإذ كان استفانوس مملوءا بالإيمان والقوة، كان يعمل عجائب ومعجزات عظيمة بين الشعب."], [9, "فعارضه بعض المنتمين إلى جماعة العبيد المحررين، يساندهم بعض اليهود من القيروان والإسكندرية، وغيرهم من مقاطعتي كيليكيا وأسيا، وأخذوا يجادلونه."]]}, {"l": "Act 15:2-21", "n": "", "vs": [[2, "فجادلهم بولس وبرنابا جدالا عنيفا. وبعد المناقشة قرر مؤمنو أنطاكية أن يذهب بولس وبرنابا مع بعض المؤمنين ليقابلوا الرسل والشيوخ في أورشليم، ويبحثوا معهم في هذه القضية."], [3, "وبعدما ودعتهم الكنيسة، سافروا إلى أورشليم مرورا بمدن فينيقية والسامرة، مخبرين الإخوة فيها بأن غير اليهود أيضا قد اهتدوا إلى المسيح، فأشاعوا بذلك فرحا كبيرا بين الإخوة جميعا."], [4, "ولما وصلوا إلى أورشليم، رحبت بهم الكنيسة بمن فيها من رسل وشيوخ، فأخبروهم بكل ما فعل الله بواسطتهم."], [5, "ولكن بعض الذين كانوا على مذهب الفريسيين، ثم آمنوا، وقفوا وقالوا: «يجب أن يختن المؤمنون من غير اليهود ويلزموا أن يعملوا بشريعة موسى»."], [6, "فعقد الرسل والشيوخ اجتماعا لدراسة هذه القضية."], [7, "وبعد نقاش كثير، وقف بطرس وقال:"], [8, "وقد شهد الله العليم بما في القلوب على قبوله لهم إذ وهبهم الروح القدس كما وهبنا إياه."], [9, "فهو لم يفرق بيننا وبينهم في شيء، إذ طهر بالإيمان قلوبهم."], [10, "فلماذا تعارضون الله فتحملون تلاميذ الرب عبئا ثقيلا عجز الآباء وعجزنا نحن عن حمله؟"], [11, "فنحن نؤمن بأننا نخلص، كما يخلصون هم، بنعمة الرب يسوع."], [12, "»عندئذ توقف الجدال بين الحاضرين، وأخذوا يستمعون إلى برنابا وبولس وهما يخبرانهم بما أجراه الله بواسطتهما من علامات وعجائب بين غير اليهود."], [13, "وبعد انتهائهما من الكلام، قال يعقوب:"], [14, "»استمعوا لي أيها الإخوة: أخبر كم سمعان كيف تفقد الله منذ البداية غير اليهود ليتخذ من بينهم شعبا يحمل اسمه؛"], [15, "وتوافق هذا أقوال الأنبياء، كما جاء في الكتاب."], [16, "سأعود من بعد هذا وأبني خيمة داود المنهدمة ثم أقيم أنقاضها وأبنيها من جديد،"], [17, "لكي يسعى إلى الرب باقي الناس وجميع الشعوب التي تحمل اسمي، يقول الرب، فاعل هذه الأمور"], [18, "المعروفة لديه منذ الأزل."], [19, "لذلك أرى أن لا نضع عبئا على المهتدين إلى الله من غير اليهود،"], [20, "بل نكتب إليهم رسالة نوصيهم فيها بأن يمتنعوا عن الأكل من الذبائح النجسة المقربة للأصنام، وعن ارتكاب الزنى، وعن تناول لحوم الحيوانات المخنوقة، وعن الدم."], [21, "فإن لموسى، منذ القدم، أتباعا في كل مدينة، يقرأون شريعته ويبشرون بها في المجامع كل سبت»."]]}, {"l": "Rom 16:19", "n": "", "vs": [[19, "إن خبر طاعتكم قد بلغ الجميع. ولذلك أفرح بكم، ولكن أريد لكم أن تكونوا حكماء في ما هو خير، وبسطاء في ما هو شر."]]}, {"l": "1Co 14:20", "n": "", "vs": [[20, "أيها الإخوة، لا تكونوا أولادا في التفكير، بل كونوا أطفالا في الشر. وأما في التفكير، فكونوا راشدين."]]}, {"l": "Eph 5:15-17", "n": "", "vs": [[15, "فانتبهوا تماما إذن كيف تسلكون بتدقيق، لا سلوك الجهلاء بل سلوك العقلاء،"], [16, "مستغلين الوقت أحسن استغلال، لأن الأيام شريرة."], [17, "لذلك لا تكونوا أغبياء، بل افهموا ما هي مشيئة الرب."]]}, {"l": "Col 4:5", "n": "", "vs": [[5, "تصرفوا بحكمة مع الذين هم من خارج الكنيسة، مستغلين الوقت أحسن استغلال."]]}, {"l": "Jam 1:5", "n": "", "vs": [[5, "وإن كان أحد منكم بحاجة إلى الحكمة، فليطلب من الله الذي يعطي الجميع بسخاء ولا يعير. فسيعطى له."]]}], "kwAr": "والحكمة تسعف", "noteAr": ""}], "arS": [["إن", ["H518"]], [" كل ", []], ["الحديد", ["H1270"]], [" ", []], ["ولم", ["H3808"]], [" ", []], ["يشحذ", ["H7043"]], [" صاحبه حده، ", []], ["فعليه", ["H6440"]], [" أن يبذل ", []], ["جهدا", ["H2428"]], [" أكبر! ", []], ["والحكمة", ["H2451"]], [" ", []], ["تسعف", ["H3787"]], [" على ", []], ["النجاح", ["H3504"]], [".", []]]}, {"c": 10, "v": 11, "text": "إن كانت الحية تلدغ بلا رقية، فلا منفعة من الراقي.", "groups": [{"kw": "the serpent", "raw": "Psa_58:4, Psa_58:5; Jer_8:17", "note": "", "refs": [{"l": "Psa 58:4", "n": "", "vs": [[4, "فيهم سم كسم الحيات، يسدون آذانهم كالأفاعي الصماء،"]]}, {"l": "Psa 58:5", "n": "", "vs": [[5, "التي لا تسمع لصوت الحواة، ولا لصوت الساحر الماهر."]]}, {"l": "Jer 8:17", "n": "", "vs": [[17, "انظروا، ها أنا أرسل عليكم أفاعي مميتة لا تنجع معها رقى فتلدغكم»، يقول الرب."]]}], "kwAr": "الحية تلدغ", "noteAr": ""}, {"kw": "a babbler", "raw": "Heb. the master of the tongue, Psa_52:2, Psa_64:3; Pro_18:21; Jam_3:6", "note": "Heb. the master of the tongue, Psa_52:2, Psa_64:3; Pro_18:21; Jam_3:6", "refs": [{"l": "Psa 52:2", "n": "", "vs": [[2, "لسانك يخترع المساويء، ويمارس الغش ويجرح كالموسى المسنونة."]]}, {"l": "Psa 64:3", "n": "", "vs": [[3, "الذين سنوا ألسنتهم كالسيف، وصوبوا سهام كلامهم المر،"]]}, {"l": "Pro 18:21", "n": "", "vs": [[21, "في اللسان حياة أو موت، والمولعون باستخدامه يتحملون العواقب."]]}, {"l": "Jam 3:6", "n": "", "vs": [[6, "واللسان كالنار خطرا: فهو وحده، بين أعضاء الجسم، جامع للشرور كلها، ويلوث الجسم كله بالفساد. إنه يشعل دائرة الكون، ويستمد ناره من جهنم!"]]}], "kwAr": "الراقي", "noteAr": "بالعبرانية: سيد اللسان. انظر مز 52: 2؛ 64: 3؛ أم 18: 21؛ يع 3: 6"}], "arS": [["إن", ["H518"]], [" كانت ", []], ["الحية", ["H5175"]], [" ", []], ["تلدغ", ["H5391"]], [" ", []], ["بلا", ["H3808"]], [" ", []], ["رقية", ["H3908"]], ["، ", []], ["فلا", ["H369"]], [" ", []], ["منفعة", ["H3504"]], [" من ", []], ["الراقي", ["H1167", "H3956"]], [".", []]]}, {"c": 10, "v": 12, "text": "كلمات فم الرجل الحكيم مفعمة بالنعمة، أما أقوال شفتي الأحمق فتبتلعه.", "groups": [{"kw": "words", "raw": "Job_4:3, Job_4:4, Job_16:5; Psa_37:30, Psa_40:9, Psa_40:10, Psa_71:15-18; Pro_10:13, Pro_10:20, Pro_10:21, Pro_10:31, Pro_10:32; Pro_12:13, Pro_12:14, Pro_12:18, Pro_15:2, Pro_15:23, Pro_16:21-24, Pro_22:17, Pro_22:18, Pro_25:11, Pro_25:12, Pro_31:26; Mat_12:35; Luk_4:22; Eph_4:29; Col_4:6", "note": "", "refs": [{"l": "Job 4:3", "n": "", "vs": [[3, "لكم أرشدت كثيرين وشددت أيادي مرتخية."]]}, {"l": "Job 4:4", "n": "", "vs": [[4, "ولكم أنهض كلامك العاثر، وثبت الركب المصطكة!"]]}, {"l": "Job 16:5", "n": "", "vs": [[5, "بل كنت أشجعكم بنصائحي، وأشددكم بتعزياتي."]]}, {"l": "Psa 37:30", "n": "", "vs": [[30, "فم الصديق ينطق دائما بالحكمة، ويتفوه بكلام الحق"]]}, {"l": "Psa 40:9", "n": "", "vs": [[9, "أعلنت برك وسط جماعة شعبك العظيم، وأنت يارب علمت أنني لم ألجم شفتي."]]}, {"l": "Psa 40:10", "n": "", "vs": [[10, "لم أخف برك داخل قلبي، بل أعلنت أمانتك وخلاصك. لم أكتم رحمتك وحقك عن جماعة شعبك العظيم»."]]}, {"l": "Psa 71:15-18", "n": "", "vs": [[15, "أخبر ببرك وخلاصك طول النهار، وإن كانا يفوقان إدراكي."], [16, "أجيء (مؤيدا) بقوة السيد الرب، لأذكر برك وحدك."], [17, "قد علمتني ياالله منذ صباي، فلم أكف لحظة عن إعلان عجائبك."], [18, "لا تتركني في الشيخوخة والشيب ياالله ، حتى أخبر هذا الجيل بأعمال قدرتك، وبقوتك (الجيل) الآتي."]]}, {"l": "Pro 10:13", "n": "", "vs": [[13, "في شفتي العاقل تكمن حكمة أما العصا فمن نصيب ظهر الأحمق."]]}, {"l": "Pro 10:20", "n": "", "vs": [[20, "كلام الصديق كالفضة المصفاة، وقلب الشرير يخلو من كل قيمة."]]}, {"l": "Pro 10:21", "n": "", "vs": [[21, "كلام الصديق يفيد كثيرين، أما الحمقى فيموتون من سوء الفهم."]]}, {"l": "Pro 10:31", "n": "", "vs": [[31, "من فم الصديق تفيض الحكمة، واللسان المخاتل يقطع."]]}, {"l": "Pro 10:32", "n": "", "vs": [[32, "شفتا الصديق تدركان ما هو حق، فتنطقان به، وفم الشرير لا يتكلم إلا بالباطل."]]}, {"l": "Pro 12:13", "n": "", "vs": [[13, "يقع الشرير في فخ أكاذيب لسانه، أما الصديق فيفلت من الضيق."]]}, {"l": "Pro 12:14", "n": "", "vs": [[14, "من ثمر صدق أقواله يشبع الإنسان خيرا، كما ترد له ثمار أعمال يديه."]]}, {"l": "Pro 12:18", "n": "", "vs": [[18, "رب مهذار تنفذ كلماته كطعنات السيف، وفي أقوال فم الحكماء شفاء."]]}, {"l": "Pro 15:2", "n": "", "vs": [[2, "لسان الحكيم يتقن المعرفة، وأقوال الجهال تفيض حماقة."]]}, {"l": "Pro 15:23", "n": "", "vs": [[23, "الجواب الملائم يفرح الإنسان، وما أحسن الكلمة في حينها."]]}, {"l": "Pro 16:21-24", "n": "", "vs": [[21, "الحكيم القلب يدعى فهيما، وعذوبة المنطق تزيد من قوة الإقناع."], [22, "الفطنة ينبوع حياة لصاحبها، وعقاب الجاهل في حماقته."], [23, "عقل الحكيم يرشد فمه، ويزيد منطقه قوة إقناع."], [24, "عذوبة الكلام شهد عسل، حلو للنفس وعافية للجسد."]]}, {"l": "Pro 22:17", "n": "", "vs": [[17, "أرهف أذنك واستمع لكلام الحكماء، وليعزم قلبك على إدراك معرفتي،"]]}, {"l": "Pro 22:18", "n": "", "vs": [[18, "فتطيب إن حفظتها في قرارة نفسك، وأثبتها دائما على شفتيك."]]}, {"l": "Pro 25:11", "n": "", "vs": [[11, "كلمة تقال في أوانها مثل تفاح من ذهب في مصوغ من فضة."]]}, {"l": "Pro 25:12", "n": "", "vs": [[12, "الموبخ الحكيم لأذن صاغية مثل قرط من ذهب وحلي من إبريز."]]}, {"l": "Pro 31:26", "n": "", "vs": [[26, "ينطق فمها بالحكمة، وفي لسانها سنة المعروف."]]}, {"l": "Mat 12:35", "n": "", "vs": [[35, "فالإنسان الصالح، من الكنز الصالح في قلبه، يصدر ما هو صالح. والإنسان الشرير، يصدر ما هو شرير."]]}, {"l": "Luk 4:22", "n": "", "vs": [[22, "وشهد له جميع الحاضرين، متعجبين من كلام النعمة الخارج من فمه، وتساءلوا: «أليس هذا ابن يوسف؟»"]]}, {"l": "Eph 4:29", "n": "", "vs": [[29, "لا تخرج من أفواهكم كلمة فاسدة، بل الكلام الصالح للبنيان الذي تدعو إليه الحاجة، كي يعطي السامعين نعمة."]]}, {"l": "Col 4:6", "n": "", "vs": [[6, "ليكن كلامكم دائما مصحوبا بالنعمة، وليكن مصلحا بملح، فتعرفوا كيف يجب أن تجيبوا كل واحد."]]}], "kwAr": "كلمات فم الرجل الحكيم", "noteAr": ""}, {"kw": "gracious", "raw": "Heb. grace", "note": "Heb. grace", "refs": [], "kwAr": "مفعمة بالنعمة", "noteAr": "بالعبرانية: نعمة."}, {"kw": "but", "raw": "2Sa_1:16; 1Ki_20:40-42; Psa_64:8, Psa_140:9; Pro_10:8, Pro_10:10, Pro_10:14, Pro_18:6-8, Pro_19:5; Pro_26:9; Luk_19:22", "note": "", "refs": [{"l": "2Sa 1:16", "n": "", "vs": [[16, "وقال داود: «دمك على رأسك، لأن فمك شهد عليك بعد اعترافك أنك قتلت مختار الرب»."]]}, {"l": "1Ki 20:40-42", "n": "", "vs": [[40, "وفيما عبدك منهمك في بعض الأمور، اختفى الأسير». فقال له ملك إسرائيل: «لقد حكمت على نفسك بما قضيت به»."], [41, "عندئذ بادر النبي فرفع العصابة عن عينيه فأدرك الملك أنه من بني الأنبياء."], [42, "وقال للملك: «هذا ما يقوله الرب: لأنك أبقيت على حياة رجل قضيت بهلاكه، فستموت بدلا منه، ويهلك شعبك بدلا من شعبه»."]]}, {"l": "Psa 64:8", "n": "", "vs": [[8, "كلمات ألسنتهم ترتد عليهم، وكل من يراهم يهز رأسه احتقارا،"]]}, {"l": "Psa 140:9", "n": "", "vs": [[9, "رد على رؤوس من يحاصرونني مكائد شفاههم."]]}, {"l": "Pro 10:8", "n": "", "vs": [[8, "الحكيم القلب يتقبل الوصايا، والمتبجح الشفتين مصيره الخراب."]]}, {"l": "Pro 10:10", "n": "", "vs": [[10, "من يغمز بعينه مكرا يولد غما. والموبخ بجرأة يصنع سلاما."]]}, {"l": "Pro 10:14", "n": "", "vs": [[14, "الحكماء يذخرون المعرفة، أما فم الغبي فيجلب الدمار."]]}, {"l": "Pro 18:6-8", "n": "", "vs": [[6, "أقوال الجاهل توقعه في المتاعب، وكلماته تسبب له الضرب."], [7, "كلمات الجاهل مهلكة له، وأقواله فخ لنفسه."], [8, "همسات النمام كلقم سائغة تنزلق إلى بواطن الجوف."]]}, {"l": "Pro 19:5", "n": "", "vs": [[5, "شاهد الزور لا ينجو من العقاب، ونافث الكذب لا يفلت من القصاص."]]}, {"l": "Pro 26:9", "n": "", "vs": [[9, "المثل في فم الجهال كشوك في يد سكران."]]}, {"l": "Luk 19:22", "n": "", "vs": [[22, "فقال له: من فمك سأحكم عليك أيها العبد الشرير: عرفت أني إنسان قاس، أستوفي ما لم أستودعه، وأحصد ما لم أزر عه."]]}], "kwAr": "أما أقوال شفتي الأحمق", "noteAr": ""}], "arS": [["كلمات", ["H1697"]], [" ", []], ["فم", ["H6310"]], [" الرجل ", []], ["الحكيم", ["H2450"]], [" مفعمة ", []], ["بالنعمة", ["H2580"]], ["، أما أقوال ", []], ["شفتي", ["H8193"]], [" ", []], ["الأحمق", ["H3684"]], [" ", []], ["فتبتلعه", ["H1104"]], [".", []]]}, {"c": 10, "v": 13, "text": "بداية كلمات فمه حماقة، وخاتمة حديثه جنون خبيث.", "groups": [{"kw": "beginning", "raw": "Jdg_14:15; 1Sa_20:26-33, 1Sa_22:7, 1Sa_22:8, 1Sa_22:16-18, 1Sa_25:10, 1Sa_25:11; 2Sa_19:41-43; 2Sa_20:1; 2Ki_6:27, 2Ki_6:31; Pro_29:9; Mat_2:7, Mat_2:8, Mat_2:16; Luk_6:2, Luk_6:11; Luk_11:38, Luk_11:53, Luk_11:54; Joh_12:10; Act_5:28-33, Act_6:9-11, Act_7:54-59, Act_19:24-28", "note": "", "refs": [{"l": "Jdg 14:15", "n": "", "vs": [[15, "وفي اليوم الرابع قالوا لزوجة شمشون: «تملقي زوجك ليكشف لنا عن حل الأحجية، لئلا نضرم النار فيك وفي بيت أبيك. أدعوتمونا إلى الوليمة لتسلبونا؟»"]]}, {"l": "1Sa 20:26-33", "n": "", "vs": [[26, "ولم يعلق شاول في ذلك اليوم على غياب داود، ظنا منه أن عارضا قد ألم به وأنه غير طاهر طبقا للشريعة."], [27, "ولكن عندما خلا موضع داود في اليوم الثاني من الشهر، سأل شاول يوناثان ابنه: «لماذا تغيب ابن يسى عن الطعام أمس واليوم؟»"], [28, "فأجاب يوناثان: «لقد استأذن داود مني للذهاب إلى بيت لحم،"], [29, "وقال: دعني أذهب لأن عشيرتي تقدم ذبيحة في المدينة، وقد أوصاني أخي بالحضور. فإن حظيت برضاك فدعني أمضي لأرى إخوتي، لذلك تغيب عن مائدة الملك»."], [30, "فاستشاط شاول غضبا على يوناثان وقال له: «يا ابن المتعوجة المتمردة، أتظن أنني لم أعلم أن انحيازك لابن يسى يفضي إلى خزيك وخزي أمك التي أنجبتك؟"], [31, "فمادام ابن يسى حيا فإنك لا تستقر أنت ولا مملكتك. والآن أرسل واقبض عليه، وأت به لأنه محكوم عليه بالموت»."], [32, "فأجاب يوناثان: «لماذا يقتل، وأي ذنب جناه؟»"], [33, "فصوب شاول الرمح نحوه ليطعنه، فأدرك يوناثان على الفور أن والده مصر على قتل داود."]]}, {"l": "1Sa 22:7", "n": "", "vs": [[7, "فقال شاول لرجاله: «استمعوا يا بنيامينيون: ألعل ابن يسى يعطيكم جميعا حقولا وكروما أو يجعلكم جميعا رؤساء على ألوف الجنود أو على مئات منهم،"]]}, {"l": "1Sa 22:8", "n": "", "vs": [[8, "حتى تحالفتم كلكم علي، فلم يخبرني أحد منكم بالعهد الذي أبرمه ابني مع ابن يسى، وليس بينكم من يأسى لي أو ينبئني بأن ابني قد أثار خادمي ليكمن لي كما يفعل اليوم؟»"]]}, {"l": "1Sa 22:16-18", "n": "", "vs": [[16, "فقال الملك: «إنك لا محالة مائت يا أخيمالك، أنت وجميع بيت أبيك»."], [17, "وأمر الملك حراسه الماثلين لديه: «هيا أحيطوا بكهنة الرب واقتلوهم، لأنهم أيضا قد تحالفوا مع داود، ولأنهم عرفوا أنه كان هاربا فلم يخبروني». فلم يرض حراس الملك أن يقتلوا كهنة الرب."], [18, "فأمر الملك دواغ قائلا: «در أنت واقتل الكهنة». فهجم دواغ الأدومي على الكهنة وقتل منهم في ذلك اليوم خمسة وثمانين رجلا لابسي أفود كتان."]]}, {"l": "1Sa 25:10", "n": "", "vs": [[10, "فأجابهم نابال: «من هو داود؟ ومن هو ابن يسى؟ قد كثر اليوم العبيد الهاربون من أسيادهم."]]}, {"l": "1Sa 25:11", "n": "", "vs": [[11, "هل آخذ خبزي ومائي وذبيحتي التي جهزتها لجازي وأعطيها لقوم لا أعلم من أين هم؟»"]]}, {"l": "2Sa 19:41-43", "n": "", "vs": [[41, "واجتمع رجال إسرائيل وقالوا للملك: «لماذا أخذك إخوتنا رجال يهوذا خفية، وعبروا الأردن بالملك وبأهل بيته وبكل رجال داود؟»"], [42, "فأجاب رجال يهوذا رجال إسرائيل: «لأن الملك قريب لنا، فماذا يثير غيظكم في هذا الأمر؟ هل أكلنا شيئا من مؤونة الملك؟ هل نلنا مكافأة على ذلك؟»"], [43, "فقال رجال إسرائيل لرجال يهوذا: «إن لنا عشرة سهام في الملك، ونحن أولى منكم بداود، فلماذا استخففتم بنا؟ أولم نكن نحن أول من تحدث عن إرجاع ملكنا؟» فكان رد رجال يهوذا أغلظ من كلام رجال إسرائيل."]]}, {"l": "2Sa 20:1", "n": "", "vs": [[1, "وحدث أن كان هناك رجل لئيم يدعى شبع بن بكري من سبط بنيامين، فنفخ هذا بالبوق وقال: «ليس لنا نصيب في داود ولا قسم في ابن يسى، فليرجع كل رجل إلى خيمته ياإسرائيل»."]]}, {"l": "2Ki 6:27", "n": "", "vs": [[27, "فقال لها: «إن لم يغثك الرب، فمن أين يمكنني أن أحصل لك على الغوث؟ أمن قمح البيدر أم من نبيذ المعصرة؟»"]]}, {"l": "2Ki 6:31", "n": "", "vs": [[31, "وقال: «ليعاقبني الرب أشد عقاب ويزد، إن لم أقطع رأس أليشع بن شافاط اليوم»."]]}, {"l": "Pro 29:9", "n": "", "vs": [[9, "إن خاصم الحكيم سفيها، لن يجد راحة، سواء غضب السفيه أو ضحك."]]}, {"l": "Mat 2:7", "n": "", "vs": [[7, "فاستدعى هيرودس المجوس سرا، وتحقق منهم زمن ظهور النجم."]]}, {"l": "Mat 2:8", "n": "", "vs": [[8, "ثم أرسلهم إلى بيت لحم، وقال: «اذهبوا وابحثوا جيدا عن الصبي. وعندما تجدونه أخبروني، لأذهب أنا أيضا وأسجد له»."]]}, {"l": "Mat 2:16", "n": "", "vs": [[16, "وعندما أدرك هيرودس أن المجوس سخروا منه، استولى عليه الغضب الشديد، فأرسل وقتل جميع الصبيان في بيت لحم وجوارها، من ابن سنتين فما دون، بحسب زمن ظهور النجم كما تحققه من المجوس."]]}, {"l": "Luk 6:2", "n": "", "vs": [[2, "ولكن بعض الفريسيين قالوا لهم: «لماذا تفعلون ما لا يحل فعله في السبت؟»"]]}, {"l": "Luk 6:11", "n": "", "vs": [[11, "ولكن الحماقة استولت عليهم حتى أخذوا يتشاورون في ما بينهم ماذا يفعلون بيسوع."]]}, {"l": "Luk 11:38", "n": "", "vs": [[38, "ولكن الفريسي تعجب لما رأى أنه لم يغتسل قبل الغداء."]]}, {"l": "Luk 11:53", "n": "", "vs": [[53, "وفيما هو خارج من هناك، بدأ الكتبة والفريسيون يضيقون عليه كثيرا، وأخذوا يستدرجونه إلى الكلام في أمور كثيرة،"]]}, {"l": "Luk 11:54", "n": "", "vs": [[54, "وهم يراقبونه سعيا إلى اصطياده بكلام يقوله."]]}, {"l": "Joh 12:10", "n": "", "vs": [[10, "فقرر رؤساء الكهنة أن يقتلوا لعازر أيضا،"]]}, {"l": "Act 5:28-33", "n": "", "vs": [[28, "قائلا: «أمرناكم بشدة ألا تعلموا بهذا الاسم، ولكنكم قد ملأتم أورشليم بتعليمكم، وتريدون أن تحملونا مسئولية سفك دمه!»"], [29, "فأجاب بطرس والرسل: «ينبغي أن يطاع الله لا الناس!"], [30, "إن إله آبائنا أقام يسوع، الذي قتلتموه أنتم معلقين إياه على الخشبة!"], [31, "ولكن الله رفعه إلى يمينه وجعله رئيسا ومخلصا ليمنح إسرائيل التوبة وغفران الخطايا؛"], [32, "ونحن نشهد على هذا، وكذلك يشهد الروح القدس الذي وهبه الله للذين يطيعونه»."], [33, "ولما سمع المجتمعون هذا الكلام اشتد غضبهم، وقرروا أن يقتلوا الرسل."]]}, {"l": "Act 6:9-11", "n": "", "vs": [[9, "فعارضه بعض المنتمين إلى جماعة العبيد المحررين، يساندهم بعض اليهود من القيروان والإسكندرية، وغيرهم من مقاطعتي كيليكيا وأسيا، وأخذوا يجادلونه."], [10, "ولكنهم لم يتمكنوا من مقاومة حكمته والروح الذي كان يتكلم به."], [11, "فما كان منهم إلا أن دفعوا رشوة لبعض الأشخاص ليقولوا: «سمعنا استفانوس يتكلم بالتجديف على موسى وعلى الله!»"]]}, {"l": "Act 7:54-59", "n": "", "vs": [[54, "فلما سمع المجتمعون كلام استفانوس، ملأ الغيظ قلوبهم، وأخذوا يصرون بأسنانهم توعدا."], [55, "فرفع استفانوس نظره إلى السماء، وهو ممتليء من الروح القدس، فرأى مجد الله ويسوع واقفا عن يمين الله،"], [56, "فقال: «إني أرى السماء مفتوحة وابن الإنسان واقفا عن يمين الله!»"], [57, "فصاحوا صياحا شديدا، وسدوا آذانهم وهجموا عليه هجمة واحدة،"], [58, "ودفعوه إلى خارج المدينة، وأخذوا يرجمونه بالحجارة. وخلع الشهود ثيابهم عند قدمي شاب اسمه شاول لكي يحرسها."], [59, "وبينما كانوا يرجمون استفانوس، كان يدعو: «أيها الرب يسوع، اقبل روحي!»"]]}, {"l": "Act 19:24-28", "n": "", "vs": [[24, "فإن صائغا اسمه ديمتريوس كان يصنع نماذج فضية صغيرة لمعابد الإلهة أرطاميس، فيعود ذلك عليه وعلى عماله بربح وفير،"], [25, "دعا عماله وأهل مهنته، وقال لهم: «تعلمون أيها الرجال أن عيشنا الرغيد يعتمد على صناعتنا هذه،"], [26, "وقد رأيتم وسمعتم أن بولس هذا أضل عددا كبيرا من الناس، لا في أفسس وحدها، بل في مقاطعة أسيا كلها تقريبا، وأقنعهم بأن الآلهة التي تصنعها الأيدي ليست بآلهة."], [27, "وهذا لا يهدد صناعتنا بالكساد وحسب، بل يعرض معبد أرطاميس إلهتنا العظمى لفقدان هيبته. فنخشى أن تتلاشى كرامتها وتنهار عظمتها، وهي التي يتعبد لها سكان أسيا جميعا، بل العالم كله!»"], [28, "فلما سمع العمال هذا الكلام تملكهم الغضب وبدأوا يصرخون: «عظيمة أرطاميس إلهة أهل أفسس!»"]]}], "kwAr": "بداية كلمات فمه", "noteAr": ""}, {"kw": "talk", "raw": "Heb. mouth", "note": "Heb. mouth", "refs": [], "kwAr": "خاتمة حديثه", "noteAr": "بالعبرانية: فم."}], "arS": [["بداية", ["H8462"]], [" ", []], ["كلمات", ["H1697"]], [" ", []], ["فمه", ["H6310"]], [" ", []], ["حماقة", ["H5531"]], ["، ", []], ["وخاتمة", ["H319"]], [" حديثه ", []], ["جنون", ["H1948"]], [" ", []], ["خبيث", ["H7451"]], [".", []]]}, {"c": 10, "v": 14, "text": "يكثر الأحمق من الكلام، ولا أحد يدري ماذا سيكون، ومن يقدر أن يخبره بما سيجري من بعده؟", "groups": [{"kw": "fool", "raw": "Ecc_5:3; Pro_10:19, Pro_15:2", "note": "", "refs": [{"l": "Ecc 5:3", "n": "", "vs": [[3, "فكما تراود الأحلام النائم من كثرة العناء، كذلك أقوال الجهل تصدر عن الإفراط في الكلام."]]}, {"l": "Pro 10:19", "n": "", "vs": [[19, "في كثرة الكلام زلات لسان، ومن يضبط شفتيه فهو عاقل."]]}, {"l": "Pro 15:2", "n": "", "vs": [[2, "لسان الحكيم يتقن المعرفة، وأقوال الجهال تفيض حماقة."]]}], "kwAr": "الأحمق", "noteAr": ""}, {"kw": "is full of words", "raw": "Heb. multiplieth words, Job_34:37, Job_35:16", "note": "Heb. multiplieth words, Job_34:37, Job_35:16", "refs": [{"l": "Job 34:37", "n": "", "vs": [[37, "لكنه أضاف إلى خطيئته عصيانا، إذ يصفق بيننا باحتقار، مثرثرا بأقوال ضد الله!»"]]}, {"l": "Job 35:16", "n": "", "vs": [[16, "فغر أيوب فاه بالباطل، وأكثر من الكلام بجهل!»"]]}], "kwAr": "من الكلام", "noteAr": "بالعبرانية: يكثّر الكلام. انظر أي 34: 37؛ 35: 16"}, {"kw": "a man", "raw": "Ecc_3:22, Ecc_6:12, Ecc_8:7; Jam_4:13, Jam_4:14", "note": "", "refs": [{"l": "Ecc 3:22", "n": "", "vs": [[22, "فرأيت أنه ليس أفضل من أن يستمتع الإنسان بكده، لأن هذا نصيبه، لأنه من يرجعه ليرى ما سيجري من بعده؟"]]}, {"l": "Ecc 6:12", "n": "", "vs": [[12, "إذ من يدري ما هو خير للإنسان في الحيا ة التي يقضي فيها أياما قليلة باطلة كالظل؟ ومن يقدر أن يطلع الإنسان على ما سيحدث تحت الشمس من بعده؟"]]}, {"l": "Ecc 8:7", "n": "", "vs": [[7, "لأنه لا يعرف ما يضمره الغد، إذ من يخبره عما تكون عليه الأحداث؟"]]}, {"l": "Jam 4:13", "n": "", "vs": [[13, "وأنتم، يامن تخططون قائلين: «اليوم أو غدا، نذهب إلى مدينة كذا، ونقضي هناك سنة، فنتاجر ونربح...»"]]}, {"l": "Jam 4:14", "n": "", "vs": [[14, "مهلا! فأنتم لا تعرفون ماذا يحدث غدا! وما هي حياتكم؟ إنها بخار، يظهر فترة قصيرة ثم يتلاشى!"]]}], "kwAr": "ولا أحد يدري", "noteAr": ""}], "arS": [["يكثر", ["H7235"]], [" ", []], ["الأحمق", ["H5530"]], [" ", []], ["من", ["H4480"]], [" ", []], ["الكلام", ["H1697"]], ["، ", []], ["ولا", ["H3808"]], [" ", []], ["أحد", ["H120"]], [" ", []], ["يدري", ["H3045"]], [" ", []], ["ماذا", ["H4100"]], [" ", []], ["سيكون", ["H1961"]], ["، ", []], ["ومن", ["H4310"]], [" يقدر أن ", []], ["يخبره", ["H5046"]], [" بما ", []], ["سيجري", ["H1961"]], [" ", []], ["من", ["H834"]], [" ", []], ["بعده", ["H310"]], ["؟", []]]}, {"c": 10, "v": 15, "text": "كد الجاهل يعييه، لأنه يضل طريقه إلى المدينة.", "groups": [{"kw": "labour", "raw": "Ecc_10:3, Ecc_10:10; Isa_44:12-17, Isa_47:12, Isa_47:13, Isa_55:2, Isa_57:1; Hab_2:6; Mat_11:28-30", "note": "", "refs": [{"l": "Ecc 10:3", "n": "", "vs": [[3, "حتى إذا مشى الجاهل في الطريق يفتقر إلى البصيرة، ويقول عن نفسه لكل واحد: إنه أحمق."]]}, {"l": "Ecc 10:10", "n": "", "vs": [[10, "إن كل الحديد ولم يشحذ صاحبه حده، فعليه أن يبذل جهدا أكبر! والحكمة تسعف على النجاح."]]}, {"l": "Isa 44:12-17", "n": "", "vs": [[12, "يصنع الحداد فأسا بعد أن يقلبها في جمرات الكور ويطرقها، ويشكلها بذراعه القوية. لا يعبأ بالجوع ولا بنضوب قوته، ولا بالعطش والإعياء."], [13, "ثم يأتي نجار فيتناول قطعة خشب ويمد عليها الخيط ويعلمها وينعمها ويحفر عليها بالبركار صورة إنسان ساحر الجمال لينصبه صنما في منزل."], [14, "يقطع شجرة أرز أو يختار سنديانا أو بلوطا. يتركها تنمو بين أشجار الغابة. أو يزرع شجرة صنوبر فينميها المطر."], [15, "ثم تصبح وقودا لنيران الناس: يأخذ بعضا منها ليدفيء نفسه، أو يوقده ليخبز خبزه، أو ينحت منه إلها يعبده، يصنع منه تمثالا يخر أمامه ساجدا."], [16, "يوقد نصفه في النار وعلى نصفه الآخر يأكل لحما، يشوي شواء ويشبع، ويدفيء نفسه قائلا: آه، أنا مستدفيء، وأرى نارا."], [17, "ويصنع ما تبقى منه إلها، صنما يخر أمامه ساجدا مبتهلا إليه قائلا: أنقذني. أنت إلهي."]]}, {"l": "Isa 47:12", "n": "", "vs": [[12, "تشبثي برقاك وكثرة سحرك التي تعبت فيها منذ صباك، فقد يحالفك النجاح أو تثيرين الرعب."]]}, {"l": "Isa 47:13", "n": "", "vs": [[13, "لقد ضعفت من كثرة طلب المشورة، فادعي المنجمين والفلكيين ليكشفوا لك طوالع المستقبل وينقذوك مما يأتي عليك."]]}, {"l": "Isa 55:2", "n": "", "vs": [[2, "لماذا تنفقون الفضة على ما ليس بخبز، وتتعبون لغير شبع؟ أحسنوا الاستماع إلي، وكلوا الشهي ولتتمتع أنفسكم بالدسم."]]}, {"l": "Isa 57:1", "n": "", "vs": [[1, "هلك الصديق فلم يتأمل أحد في نفسه ويعتبر، ومات الأتقياء ولم يدرك أحد أن الصديق قد أخذ تفاديا للكارثة."]]}, {"l": "Hab 2:6", "n": "", "vs": [[6, "ولكن لا يلبث أن يسخر منه سباياه قائلين: «ويل لمن يكوم لنفسه الأسلاب، ويثرى على حساب ما نهب. إنما إلى متى؟"]]}, {"l": "Mat 11:28-30", "n": "", "vs": [[28, "تعالوا إلي ياجميع المتعبين والرازحين تحت الأحمال الثقيلة، وأنا أريحكم."], [29, "احملوا نيري عليكم، وتتلمذوا على يدي، لأني وديع ومتواضع القلب، فتجدوا الراحة لنفوسكم."], [30, "فإن نيري هين، وحملي خفيف!»"]]}], "kwAr": "كد الجاهل", "noteAr": ""}, {"kw": "because", "raw": "Psa_107:4, Psa_107:7; Isa_35:8-10; Jer_50:4, Jer_50:5", "note": "", "refs": [{"l": "Psa 107:4", "n": "", "vs": [[4, "تاهوا في البرية، في صحراء بلا طريق، ولم يجدوا مدينة يسكنون فيها."]]}, {"l": "Psa 107:7", "n": "", "vs": [[7, "وهداهم طريقا مستقيما ليتوجهوا إلى مدينة للسكن."]]}, {"l": "Isa 35:8-10", "n": "", "vs": [[8, "وتكون هناك طريق تدعى طريق القداسة، لا يسلك فيها من هو دنس، إنما تكون من نصيب السالكين في تلك الطريق، ولا يضل فيها حتى الجهال."], [9, "لا يطرقها أسد، ولا يأتيها حيوان مفترس. إنما يسلك فيها المفديون"], [10, "ويرجع إليها مفديو الرب ويقبلون إلى صهيون مترنمين يكلل رؤوسهم فرح أبدي، وتغمرهم الغبطة والسرور، ويهرب الحزن والأنين."]]}, {"l": "Jer 50:4", "n": "", "vs": [[4, "وفي تلك الأيام، يقول الرب، يتوافد أبناء إسرائيل وأبناء يهوذا معا. يبكون في سيرهم ويلتمسون الرب إلههم."]]}, {"l": "Jer 50:5", "n": "", "vs": [[5, "يسألون عن الطريق إلى صهيون، ويتوجهون إليها قائلين: هلم ننضم إلى الرب بعهد أبدي لا ينسى."]]}], "kwAr": "لأنه يضل", "noteAr": ""}], "arS": [["كد", ["H5999"]], [" ", []], ["الجاهل", ["H3684"]], [" ", []], ["يعييه", ["H3021"]], ["، لأنه يضل طريقه ", []], ["إلى", ["H413"]], [" ", []], ["المدينة", ["H5892"]], [".", []]]}, {"c": 10, "v": 16, "text": "ويل لك أيتها الأرض إن كان ملكك ولدا، ورؤساؤك يأكلون إلى الصباح.", "groups": [{"kw": "when", "raw": "2Ch_13:7, 33:1-20, 2Ch_36:2, 2Ch_36:5, 2Ch_36:9, 2Ch_36:11; Isa_3:4, Isa_3:5, Isa_3:12", "note": "", "refs": [{"l": "2Ch 13:7", "n": "", "vs": [[7, "فالتف حوله رجال بطالون أشرار، وثاروا على رحبعام بن سليمان، فلم يثبت رحبعام أمامهم لحداثته وقلة خبرته."]]}, {"l": "2Ch 33:1-20", "n": "", "vs": [[1, "كان منسى في الثانية عشرة من عمره حين تولى مقاليد الحكم، ودام ملكه في أورشليم خمسا وخمسين سنة."], [2, "وارتكب الشر أمام الرب، مقترفا رجاسات الأمم الذين طردهم الرب من أمام بني إسرائيل."], [3, "وعاد وشيد معابد المرتفعات التي هدمها أبوه حزقيا، وأقام مذابح للبعل ونصب تماثيل عشتاروث، وسجد لكواكب السماء وعبدها."], [4, "وبنى مذابح في هيكل الرب الذي قال عنه الرب في أورشليم أجعل اسمي إلى الأبد."], [5, "وشيد في فناءي بيت الرب مذابح لكل كواكب السماء."], [6, "وأجاز أولاده في النار في وادي ابن هنوم، ولجأ إلى السحرة والعرافات وأصحاب الجان وأوغل في ارتكاب الشر مما أثار غضب الرب الشديد عليه."], [7, "وعمل تمثالا نصبه في هيكل الله، الذي قال الله عنه لداود ولسليمان ابنه: «في هذا الهيكل وفي أورشليم التي اخترتها من بين جميع مدن أسباط إسرائيل أجعل اسمي إلى الأبد."], [8, "وإن أطاعوا وعملوا كل ما أمرتهم به، وطبقوا كل الشريعة والفرائض والأحكام التي أوصيتهم بها على لسان موسى، فإنني لن أزعزع أقدام إسرائيل عن الأرض التي عينتها لآبائهم»."], [9, "غير أن منسى أضل شعب يهوذا وأهل أورشليم وأغواهم لارتكاب شرور أشد هولا من شرور الأمم الذين طردهم الرب من أمام بني إسرائيل."], [10, "ومع أن الرب حذر منسى وشعبه فلم يصغوا إليه."], [11, "لهذا أرسل الرب عليهم قادة جند ملك أشور، فقبضوا على منسى ووضعوا خزامة في أنفه، وقادوه مغلولا بسلاسل نحاس إلى بابل."], [12, "وفي ضيقه استغاث بالرب إلهه وتذلل جدا أمام إله آبائه،"], [13, "وابتهل إليه فاستجاب له، وسمع تضرعه ورده إلى أورشليم وإلى مملكته. فعلم منسى أن الرب هو الله ."], [14, "وما لبث أن أعاد بناء سور خارج مدينة داود، غربي نهر جيحون في الوادي، حتى مدخل باب السمك، وأحاط قلعة الأكمة بسور مرتفع جدا، وأقام قادة جيوشه في جميع مدن يهوذا الحصينة."], [15, "وأزال الآلهة الغريبة والأصنام من هيكل الرب، وهدم المذابح التي بناها في تل الهيكل وفي أورشليم، وطرحها خارج المدينة."], [16, "ورمم مذبح الرب وقرب عليه ذبائح سلام وشكر، وأمر شعبه أن يعبدوا الرب إله إسرائيل."], [17, "إلا أن الشعب ظل يقدم الذبائح على المرتفعات، ولكنهم قدموها للرب إلههم."], [18, "أما بقية أخبار منسى وصلاته إلى إلهه، وتحذيرات الأنبياء التي أنذروه بها باسم الرب إله إسرائيل، فهي مدونة في كتاب تاريخ ملوك إسرائيل."], [19, "كما أن صلاته واستجابة الرب له، وسائر خطاياه وخيانته، والأماكن التي شيد فيها المرتفعات ونصب فيها تماثيل عشتاروث، والأصنام التي أقامها قبل تذلله فهي مدونة في أخبار الأنبياء."], [20, "ثم مات منسى ودفن في بيته، وخلفه ابنه آمون على الملك."]]}, {"l": "2Ch 36:2", "n": "", "vs": [[2, "وكان يهوآحاز في الثالثة والعشرين من عمره حين ملك، ودام حكمه ثلاثة أشهر في أورشليم."]]}, {"l": "2Ch 36:5", "n": "", "vs": [[5, "وكان يهوياقيم في الخامسة والعشرين من عمره حين ملك، ودام حكمه إحدى عشرة سنة في أورشليم، وارتكب الشر في عيني الرب."]]}, {"l": "2Ch 36:9", "n": "", "vs": [[9, "وكان يهوياكين في الثامنة عشرة من عمره حين ملك، ودام حكمه ثلاثة أشهر وعشرة أيام في أورشليم، وارتكب الشر في عيني الرب."]]}, {"l": "2Ch 36:11", "n": "", "vs": [[11, "وكان صدقيا في الحادية والعشرين من عمره حين ملك، ودام حكمه إحدى عشرة سنة في أورشليم."]]}, {"l": "Isa 3:4", "n": "", "vs": [[4, "وأجعل الصبيان رؤساء لهم، والأطفال حكاما عليهم،"]]}, {"l": "Isa 3:5", "n": "", "vs": [[5, "فيجور الشعب بعضهم على بعض، والرجل على صاحبه، والجار على جاره، ويتمرد الصغير على الكبير والحقير على النبيل."]]}, {"l": "Isa 3:12", "n": "", "vs": [[12, "ظالمو شعبي أولاد والحاكمون عليه نساء. آه ياشعبي! إن قادتكم يضلونكم ويقتادونكم في مسالك منحرفة."]]}], "kwAr": "إن كان ملكك ولدا", "noteAr": ""}, {"kw": "and", "raw": "Pro_20:1, Pro_20:2; Isa_5:11, Isa_5:12, Isa_28:7, Isa_28:8; Hos_7:5-7", "note": "", "refs": [{"l": "Pro 20:1", "n": "", "vs": [[1, "الخمر مستهزئة، والمسكر صخاب، ومن يدمن عليها فليس بحكيم."]]}, {"l": "Pro 20:2", "n": "", "vs": [[2, "سخط الملك مثل زمجرة الأسد، ومن يثير غيظه يسيء إلى نفسه."]]}, {"l": "Isa 5:11", "n": "", "vs": [[11, "ويل لمن ينهضون في الصباح مبكرين يسعون وراء المسكر حتى ساعة متأخرة من الليل إلى أن تلهبهم الخمر."]]}, {"l": "Isa 5:12", "n": "", "vs": [[12, "يتلهون في مآدبهم بالعود والرباب والدف والناي والخمر، غير مكترثين لأعمال الرب ولا ناظرين إلى صنع يديه،"]]}, {"l": "Isa 28:7", "n": "", "vs": [[7, "ولكن هؤلاء أيضا أضلتهم الخمر وترنحوا بالسكر، فسلب المسكر عقول أنبيائهم وكهنتهم، فأربكهم ورنحهم، فأخطأوا الرؤيا، وتعثروا في الأحكام."]]}, {"l": "Isa 28:8", "n": "", "vs": [[8, "فامتلأت موائدهم كلها بالقيء، ولم يبق مكان لم يتلوث."]]}, {"l": "Hos 7:5-7", "n": "", "vs": [[5, "في يوم احتفال ملكنا انتشى الرؤساء من سورة الخمر، وانضم هو إلى المتبذلين."], [6, "فقلوبهم تشتعل بالمكائد كالأتون. يخمد غضبهم في الليل، ويتوهج كنار ملتهبة عند الصباح."], [7, "كلهم متأججون كأتون مشتعل. يفترسون حكامهم. هلك جميع ملوكهم، ولم يوجد بينهم من يطلبني."]]}], "kwAr": "ورؤساؤك يأكلون", "noteAr": ""}, {"kw": "in the", "raw": "Jer_21:12", "note": "", "refs": [{"l": "Jer 21:12", "n": "", "vs": [[12, "ياذرية داود، هذا ما يعلنه الرب: أجروا العدل في الصباح، وأنقذوا المغتصب من يد المغتصب لئلا ينصب غضبي كنار، فيحرق وليس من يخمده لفرط ما ارتكبتم من أعمال شريرة."]]}], "kwAr": "إلى الصباح", "noteAr": ""}], "arS": [["ويل", ["H337"]], [" لك أيتها ", []], ["الأرض", ["H776"]], [" إن كان ", []], ["ملكك", ["H4428"]], [" ", []], ["ولدا", ["H5288"]], ["، ", []], ["ورؤساؤك", ["H8269"]], [" ", []], ["يأكلون", ["H398"]], [" إلى ", []], ["الصباح", ["H1242"]], [".", []]]}, {"c": 10, "v": 17, "text": "طوبى لك أيتها الأرض إن كان ملكك ابن شرفاء، ورؤساؤك يأكلون في المواعيد المعينة، طلبا للقوة وليس سعيا وراء السكر.", "groups": [{"kw": "when", "raw": "Ecc_10:6, Ecc_10:7; Pro_28:2, Pro_28:3; Jer_30:21", "note": "", "refs": [{"l": "Ecc 10:6", "n": "", "vs": [[6, "فقد تبوأت الحماقة مراتب عالية، أما الأغنياء فقد احتلوا مقامات دنية."]]}, {"l": "Ecc 10:7", "n": "", "vs": [[7, "وشاهدت عبيدا يمتطون صهوات الجياد، وأمراء يسيرون على الأقدام كالعبيد."]]}, {"l": "Pro 28:2", "n": "", "vs": [[2, "عندما يتمرد أهل أرض يكثر رؤساؤهم وتعم الفوضى، ولكنها تدوم إن حكمها ذو فهم ومعرفة."]]}, {"l": "Pro 28:3", "n": "", "vs": [[3, "الفقير الجائر على المعوز، كمطر جارف لا يبقي على طعام."]]}, {"l": "Jer 30:21", "n": "", "vs": [[21, "ويكون قائدهم منهم، ويخرج حاكمهم من وسطهم فأستدنيه فيدنو مني، إذ من يجرؤ على الاقتراب مني من نفسه؟"]]}], "kwAr": "إن كان ملكك ابن شرفاء", "noteAr": ""}, {"kw": "and thy", "raw": "Pro_31:4, Pro_31:5", "note": "", "refs": [{"l": "Pro 31:4", "n": "", "vs": [[4, "ليس للملوك يالموئيل، ليس للملوك أن يدمنوا الخمر، ولا للعظماء أن يجرعوا المسكر."]]}, {"l": "Pro 31:5", "n": "", "vs": [[5, "لئلا يسكروا فينسوا الشريعة، ويجوروا على حقوق البائسين."]]}], "kwAr": "ورؤساؤك يأكلون في المواعيد", "noteAr": ""}], "arS": [["طوبى", ["H835"]], [" لك أيتها ", []], ["الأرض", ["H776"]], [" إن كان ", []], ["ملكك", ["H4428"]], [" ", []], ["ابن", ["H1121"]], [" ", []], ["شرفاء", ["H2715"]], ["، ", []], ["ورؤساؤك", ["H8269"]], [" ", []], ["يأكلون", ["H398"]], [" في ", []], ["المواعيد", ["H6256"]], [" المعينة، طلبا ", []], ["للقوة", ["H1369"]], [" ", []], ["وليس", ["H3808"]], [" سعيا وراء ", []], ["السكر", ["H8358"]], [".", []]]}, {"c": 10, "v": 18, "text": "من جراء الكسل ينهار السقف، وبتراخي اليدين يسقط البيت.", "groups": [{"kw": "", "raw": "Pro_12:24, Pro_14:1, Pro_20:4, Pro_21:25, Pro_23:21, Pro_24:30, Pro_24:31; Heb_6:11; 2Pe_1:5-10", "note": "", "refs": [{"l": "Pro 12:24", "n": "", "vs": [[24, "ذو اليد المجتهدة يسود، والكسول ذو اليد المرتخية يخدم تحت الجزية."]]}, {"l": "Pro 14:1", "n": "", "vs": [[1, "حكمة المرأة تبني بيتها، وحماقتها تهدمه بيديها."]]}, {"l": "Pro 20:4", "n": "", "vs": [[4, "لا يحرث الكسول في الموسم خشية البرد، وفي أوان الحصاد يطلب غلة فلا يجد."]]}, {"l": "Pro 21:25", "n": "", "vs": [[25, "أوهام الكسول تقتله لأن يديه تأبيان العمل."]]}, {"l": "Pro 23:21", "n": "", "vs": [[21, "لأن السكير والشره يفتقران، وكثرة النوم تكسو المرء بالخرق."]]}, {"l": "Pro 24:30", "n": "", "vs": [[30, "اجتزت في حقل الكسول وبكرم الرجل الفاقد البصيرة،"]]}, {"l": "Pro 24:31", "n": "", "vs": [[31, "وإذا بالشوك قد كساه، والعوسج قد غطى كل أرضه، وجدار حجارته قد انهار،"]]}, {"l": "Heb 6:11", "n": "", "vs": [[11, "وإنما نتمنى أن يظهر كل واحد منكم اجتهادا مماثلا في المحافظة حتى النهاية على الثقة الكاملة بالرجاء."]]}, {"l": "2Pe 1:5-10", "n": "", "vs": [[5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"], [6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"], [7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."], [8, "فحين تكون هذه الصفات الطيبة في داخلكم، وتزداد بوفرة، تجعلكم مجتهدين ومثمرين في معرفتكم لربنا يسوع المسيح."], [9, "أما الذي لا يملك هذه الصفات، فهو أعمى روحيا. إنه قصير البصر، قد نسي أنه تطهر من خطاياه القديمة!"], [10, "فأحرى بكم إذن، أيها الإخوة، أن تجتهدوا لتثبتوا عمليا أن الله قد دعاكم واختاركم حقا. فإنكم، إن فعلتم هذا، لن تسقطوا أبدا!"]]}], "kwAr": "", "noteAr": ""}], "arS": [["من جراء ", []], ["الكسل", ["H6103"]], [" ", []], ["ينهار", ["H4355"]], [" ", []], ["السقف", ["H4746"]], ["، ", []], ["وبتراخي", ["H8220"]], [" ", []], ["اليدين", ["H3027"]], [" ", []], ["يسقط", ["H1811"]], [" ", []], ["البيت", ["H1004"]], [".", []]]}, {"c": 10, "v": 19, "text": "تقام المأدبة للتسلية، والخمرة تولد الفرح، أما المال فيسد جميع الحاجات.", "groups": [{"kw": "feast", "raw": "Ecc_2:1, Ecc_2:2, Ecc_7:2-6; Gen_43:34; Dan_5:1-12; 1Pe_4:3", "note": "", "refs": [{"l": "Ecc 2:1", "n": "", "vs": [[1, "فناجيت نفسي: تعالي الآن أمتحنك بالفرح، فأستمتع باللذة! وإذا هذا أيضا باطل."]]}, {"l": "Ecc 2:2", "n": "", "vs": [[2, "قلت عن الضحك: هذا جنون، وعن اللذة ما جدواها."]]}, {"l": "Ecc 7:2-6", "n": "", "vs": [[2, "الذهاب إلى بيت النوح خير من الحضور إلى بيت الوليمة، لأن الموت هو مصير كل إنسان. وهذا ما يحتفظ به الحي في قلبه."], [3, "الحزن خير من الضحك، لأنه بكآبة الوجه يصلح القلب."], [4, "قلب الحكماء في بيت النوح، أما قلوب الجهال ففي بيت اللذة."], [5, "الاستماع إلى زجر الحكيم خير من الإصغاء إلى غناء الجهال."], [6, "لأن ضحك الجهال كقرقعة الشوك تحت القدر، وهذا أيضا باطل."]]}, {"l": "Gen 43:34", "n": "", "vs": [[34, "وقدم إليهم حصصا من مائدته، فكانت حصة بنيامين خمسة أضعاف حصص إخوته. واحتفوا وشربوا معه."]]}, {"l": "Dan 5:1-12", "n": "", "vs": [[1, "وأقام بيلشاصر الملك مأدبة عظيمة لنبلاء دولته الألف، وشرب خمرا أمامهم."], [2, "وفيما كان يحتسي الخمر أمر بإحضار آنية الذهب والفضة التي استولى عليها أبوه نبوخذناصر من هيكل أورشليم، ليشرب بها مع نبلاء مملكته وزوجاته ومحظياته."], [3, "فأحضروها وشرب بها الملك ونبلاء مملكته وزوجاته ومحظياته"], [4, "وأخذوا يسبحون آلهة الذهب والفضة والنحاس والحديد والخشب والحجر."], [5, "فظهرت أصابع يد إنسان وخطت بإزاء المصباح على كلس جدار قصر الملك، والملك يشهد اليد الكاتبة."], [6, "عندئذ شحب وجه الملك وأفزعته أفكاره واصطكت ركبتاه واعتراه الانهيار،"], [7, "فزعق طالبا أن يحضروا السحرة والكلدانيين والمنجمين، وقال لهم: «أي رجل يقرأ هذه الكتابة ويفسر لي محتواها، يرتدي الأرجوان وقلادة من ذهب في عنقه، ويصبح الرجل الثالث المتسلط في المملكة»."], [8, "فأقبل حكماء الملك ولكنهم عجزوا عن قراءة الكتابة وعن إطلاع الملك على تفسيرها."], [9, "فدب الفزع في الملك بيلشاصر، وتبدلت هيئته واعترى عظماءه الاضطراب."], [10, "وعلى أثر كلام الملك ونبلائه، أقبلت الملكة الأم إلى قاعة المأدبة وقالت له: «أيها الملك لتعش إلى الأبد. لا تروعك أفكارك، ولا يشحب وجهك،"], [11, "لأن في مملكتك رجلا فيه روح الآلهة القدوسين، وقد تميز في عهد أبيك باستنارة وفهم وحكمة كحكمة الآلهة، فعينه أبوك الملك نبوخذناصر رئيسا للمجوس والسحرة والكلدانيين والمنجمين."], [12, "لأن دانيآل هذا الذي دعاه الملك بلطشاصر، كان يتحلى بروح فاضلة ومعرفة وفطنة، وقدرة على تفسير الأحلام وفك الألغاز وحل المعضلات. فليدع الآن دانيآل ليطلعك على تفسير الكتابة»."]]}, {"l": "1Pe 4:3", "n": "", "vs": [[3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}], "kwAr": "تقام المأدبة", "noteAr": ""}, {"kw": "and wine", "raw": "Ecc_9:7; Psa_104:15; Isa_24:11; 1Sa_25:36; 2Sa_13:28; Luk_12:19; Eph_5:18, Eph_5:19", "note": "", "refs": [{"l": "Ecc 9:7", "n": "", "vs": [[7, "فامض وتمتع بأكل طعامك، واشرب خمرك بقلب منشرح، لأن الرب قد رضي الآن عن أعمالك."]]}, {"l": "Psa 104:15", "n": "", "vs": [[15, "وخمر تفرح قلب الإنسان وتورد وجهه فيلمع كبريق الزيت، وخبز يسند قلبه."]]}, {"l": "Isa 24:11", "n": "", "vs": [[11, "ترتفع صرخة في الأزقة طلبا للخمرة المفقودة. زال كل فرح، وتلاشى السرور من الأرض"]]}, {"l": "1Sa 25:36", "n": "", "vs": [[36, "فأقبلت أبيجايل إلى نابال، فوجدت أنه قد أقام مأدبة في بيته كمأدبة ملك، وقد أخذته النشوة بعد أن أكثر من احتساء الخمر حتى سكر، فلم تخبره بشيء إطلاقا حتى صباح اليوم التالي."]]}, {"l": "2Sa 13:28", "n": "", "vs": [[28, "وأوصى أبشالوم رجاله: «متى ذهبت الخمر بعقل أمنون وقلت لكم اضربوا أمنون واقتلوه، فلا تخافوا. ألست أنا الذي أمرتكم بذلك؟ تشجعوا وتصرفوا كأبطال»."]]}, {"l": "Luk 12:19", "n": "", "vs": [[19, "وأقول لنفسي: يانفس، عندك خيرات كثيرة مخزونة لسنين عديدة، فاستريحي وكلي واشربي واطر بي!"]]}, {"l": "Eph 5:18", "n": "", "vs": [[18, "لا تسكروا بالخمر، ففيها الخلاعة، وإنما امتلئوا بالروح،"]]}, {"l": "Eph 5:19", "n": "", "vs": [[19, "محدثين بعضكم بعضا بمزامير وتسابيح وأناشيد روحية، مرنمين ومرتلين بقلوبكم للرب؛"]]}], "kwAr": "والخمرة", "noteAr": ""}, {"kw": "maketh merry", "raw": "Heb. maketh glad the life", "note": "Heb. maketh glad the life", "refs": [], "kwAr": "تولد الفرح", "noteAr": "بالعبرانية: يفرح الحياة."}, {"kw": "but", "raw": "Money which would have answered every good purpose, and served for every emergency, is too often spent in feastings and revellings. Ecc_7:11, Ecc_7:12; 1Ch_21:24, 1Ch_29:2-9; 2Ch_24:11-14; Ezr_1:6, Ezr_7:15-18; Neh_5:8; Psa_112:9; Isa_23:18; Mat_17:27, Mat_19:21; Luk_8:3, Luk_16:9; Act_2:45, Act_11:29; Phi_4:15-19; 1Ti_6:17-19", "note": "Money which would have answered every good purpose, and served for every emergency, is too often spent in feastings and revellings. Ecc_7:11, Ecc_7:12; 1Ch_21:24, 1Ch_29:2-9; 2Ch_24:11-14; Ezr_1:6, Ezr_7:15-18; Neh_5:8; Psa_112:9; Isa_23:18; Mat_17:27, Mat_19:21; Luk_8:3, Luk_16:9; Act_2:45, Act_11:29; Phi_4:15-19; 1Ti_6:17-19", "refs": [{"l": "Ecc 7:11", "n": "", "vs": [[11, "الحكمة مع الميراث صالحة وذات منفعة للأحياء."]]}, {"l": "Ecc 7:12", "n": "", "vs": [[12, "الذي يستظل بالحكمة كمن يستظل بالفضة، إلا أن لمعرفة الحكمة فضلا، وهو أنها تحفظ حياة أصحابها."]]}, {"l": "1Ch 21:24", "n": "", "vs": [[24, "فقال الملك: «لا! بل أشتري ذلك بفضة، إذ لا يمكن أن آخذ مالك فأقدم للرب محرقة مجانية»."]]}, {"l": "1Ch 29:2-9", "n": "", "vs": [[2, "وقد بذلت كل جهدي لتجهيز ما يتطلبه بناء هيكل إلهي من مواد، فوفرت الذهب لما يصنع من ذهب، والفضة لما يصنع من فضة، والنحاس لما يصنع من نحاس، والحديد لما يصنع من حديد، والخشب لما يصنع من خشب، وحجارة الجزع وجواهر ثمينة للترصيع، وحجارة ذات ألوان مختلفة، وحجارة كريمة ورخاما كثيرا."], [3, "ولفرط سروري ببيت إلهي، فقد قدمت من مالي الخاص ذهبا وفضة، بالإضافة إلى كل ما أعددته للهيكل."], [4, "وهي في جملتها ثلاثة آلاف وزنة (نحو مئة وثمانية آلاف كيلوجرام) من ذهب أوفير، وسبعة آلاف وزنة (نحو مئتين واثنين وخمسين ألف كيلوجرام) من الفضة النقية لتغشية جدران البيوت."], [5, "فالذهب لما يصنع من ذهب، والفضة لما يصنع من فضة. فمن يرغب اليوم في التبرع لخدمة الرب؟»"], [6, "فتبرع زعماء عائلات إسرائيل ورؤساء أسباطهم، وقادة الألوف والمئات ومديرو أعمال الملك،"], [7, "وقدموا لخدمة هيكل الرب خمسة آلاف وزنة وعشرة آلاف درهم (نحو مئة وثمانين ألف كيلوجرام) من الذهب، وعشرة آلاف وزنة (نحو ثلاث مئة وستين ألف كيلوجرام) من الفضة، وثمانية عشر ألف وزنة (نحو ست مئة طن) من النحاس، ومئة ألف وزنة (نحو ثلاثة آلاف وستمائة طن) من الحديد."], [8, "وكل من وجدت لديه حجارة كريمة قدمها لخزينة الهيكل التي يشرف عليها يحيئيل الجرشوني."], [9, "واغتبط الشعب بما قدمه عن رضى لأنهم تبرعوا للرب بقلب كامل، وابتهج الملك أيضا ابتهاجا شديدا."]]}, {"l": "2Ch 24:11-14", "n": "", "vs": [[11, "وكلما كثرت الفضة في الصندوق يجيء اللاويون ويحملونه إلى مقر وكالة موظفي الملك، فيأتي كاتب الملك ووكيل رئيس الكهنة، ويفرغان الصندوق، ثم يحملانه ويردانه إلى موضعه. هكذا كانوا يفعلون كل يوم حتى جمعوا فضة وفيرة،"], [12, "دفعها الملك ويهوياداع للمشرفين على أعمال خدمة بيت الرب، فكان هؤلاء يستأجرون نحاتين ونجارين وحدادين لصيانة هيكل الرب وترميمه."], [13, "وجد المشرفون في عملهم فأفلحوا، وأعادوا ترميم بيت الرب بموجب رسمه الأصلي، وثبتوه."], [14, "ولما تم إنجاز العمل حملوا ما تبقى من فضة إلى الملك ويهوياداع، فصاغوا آنية للهيكل ولتقريب المحرقات، وصحونا وآنية ذهب وفضة. وثابروا على إصعاد المحرقات في بيت الرب بصورة دائمة كل أيام يهوياداع."]]}, {"l": "Ezr 1:6", "n": "", "vs": [[6, "وأمدهم جيرانهم بآنية فضة وذهب وبأمتعة ودواب وتحف، فضلا عما تبرعوا به."]]}, {"l": "Ezr 7:15-18", "n": "", "vs": [[15, "ولحمل ما يتبرع به الملك ومستشاروه من فضة وذهب لإله إسرائيل الذي مسكنه في أورشليم."], [16, "فضلا عما تحصل عليه من فضة وذهب من إقليم بابل، وما تجمعه من تبرعات الشعب والكهنة لهيكل إلههم في أورشليم،"], [17, "لتجد في شراء ثيران وكباش وخراف مع تقدماتها وسكائب خمرها بهذه الفضة، لتقربها على مذبح هيكل إلهكم في أورشليم."], [18, "أما ما يتبقى من الفضة والذهب، فتتصرف فيه أنت وسائر الكهنة حسب ما تراه بمقتضى إرادة إلهكم."]]}, {"l": "Neh 5:8", "n": "", "vs": [[8, "وقلت لهم: «إننا بحسب طاقتنا افتدينا بالأموال إخوتنا اليهود الذين بيعوا للأمم، وها أنتم تبيعون إخوتكم لهم، وهم يعودون فيبيعونهم لنا». فسكتوا ولم يجدوا جوابا."]]}, {"l": "Psa 112:9", "n": "", "vs": [[9, "يوزع بسخاء ويعطي الفقراء، وبره يدوم إلى الأبد، فيرتفع رأسه باعتزاز."]]}, {"l": "Isa 23:18", "n": "", "vs": [[18, "أما تجارتها وأجرتها فتصبح قدسا للرب. لا تخزن ولا تدخر لأن تجارتها توفر غذاء وفيرا، وثيابا فاخرة للساكنين أمام الرب."]]}, {"l": "Mat 17:27", "n": "", "vs": [[27, "ولكن لكي لا نضع لهم عثرة، اذهب إلى البحيرة، وألق صنارة الصيد؛ وأمسك السمكة التي تطلع أولا، ثم افتح فمها تجد فيه قطعة نقد بقيمة أربعة دراهم، فخذها وأد الضريبة عني وعنك! »"]]}, {"l": "Mat 19:21", "n": "", "vs": [[21, "فأجابه يسوع: «إن أردت أن تكون كاملا، فاذهب وبع كل ما تملك، ووزع على الفقراء، فيكون لك كنز في السماوات. وتعال اتبعني!»"]]}, {"l": "Luk 8:3", "n": "", "vs": [[3, "ويونا زوجة خوزي وكيل هيرودس، وسوسنة، وغيرهن كثيرات ممن كن يساعدنه بأموالهن."]]}, {"l": "Luk 16:9", "n": "", "vs": [[9, "وأقول لكم: اكسبوا لكم أصدقاء بمال الظلم، حتى إذا فني مالكم، تقبلون في المنازل الأبدية!"]]}, {"l": "Act 2:45", "n": "", "vs": [[45, "ويبيعون أملاكهم ومقتنياتهم ويتقاسمون الثمن على قدر احتياج كل منهم،"]]}, {"l": "Act 11:29", "n": "", "vs": [[29, "لذلك قرر التلاميذ في أنطاكية أن يتبرع كل منهم بما يتيسر له، ويرسلوا إعانة إلى الإخوة المقيمين في اليهودية."]]}, {"l": "Phi 4:15-19", "n": "", "vs": [[15, "وتعرفون أيضا، يامؤمني فيلبي، أنه عند ابتداء خدمتي للإنجيل، إذ انطلقت من مقاطعة مقدونية، ما من كنيسة ساهمت معي في حساب العطاء والأخذ إلا أنتم وحدكم."], [16, "حتى وأنا في مدينة تسالونيكي، بعثتم إلي بما أحتاج إليه، لا مرة واحدة بل أكثر."], [17, "والواقع أني لا أسعى إلى العطايا، بل أسعى إلى الفائدة المتكاثرة لحسابكم."], [18, "فالآن عندي كل ما يسد حاجتي ويزيد عنها. أنا في بحبوحة إذ تسلمت من أبفروديتس ما بعثتم به إلي، عطرا طيب الرائحة، ذبيحة يقبلها الله ويسر بها."], [19, "وإن إلهي سيسد حاجاتكم كلها إلى التمام، وفقا لغناه في المجد، في المسيح يسوع."]]}, {"l": "1Ti 6:17-19", "n": "", "vs": [[17, "أوص أغنياء هذا الزمان بأن لا يتكبروا، ولا يتكلوا على الغنى غير الثابت، بل على الله الذي يمنحنا كل شيء بوفرة لنتمتع به،"], [18, "وأن يفعلوا خيرا، ويكونوا أغنياء بالأعمال الصالحة، ويوزعوا بسخاء، ويكونوا على استعداد دائم لإشراك الآخرين في خيراتهم."], [19, "وبذلك يوفرون لأنفسهم رأس مال للمستقبل، حتى يمسكوا بالحياة الحقيقية."]]}], "kwAr": "أما المال", "noteAr": "إن المال الذي كان يفي بكل غرض صالح ويسد كل حاجة طارئة كثيرا ما يُنفق في الولائم والعربدة. انظر جا 7: 11، 12؛ 1أخ 21: 24؛ 29: 2-9؛ 2أخ 24: 11-14؛ عز 1: 6؛ 7: 15-18؛ نح 5: 8؛ مز 112: 9؛ إش 23: 18؛ مت 17: 27؛ 19: 21؛ لو 8: 3؛ 16: 9؛ أع 2: 45؛ 11: 29؛ في 4: 15-19؛ 1تي 6: 17-19"}], "arS": [["تقام ", []], ["المأدبة", ["H3899"]], [" ", []], ["للتسلية", ["H7814"]], ["، ", []], ["والخمرة", ["H3196"]], [" ", []], ["تولد", ["H6213"]], [" ", []], ["الفرح", ["H8055"]], ["، أما ", []], ["المال", ["H3701"]], [" ", []], ["فيسد", ["H6030"]], [" ", []], ["جميع", ["H3605"]], [" الحاجات.", []]]}, {"c": 10, "v": 20, "text": "لا تلعن الملك حتى في فكرك، ولا تشتم الغني في مخدعك، لأن طير السماء ينقل صوتك، وذا الجناح يبلغ الأمر.", "groups": [{"kw": "Curse", "raw": "Exo_22:28; Isa_8:21; Act_23:5", "note": "", "refs": [{"l": "Exo 22:28", "n": "", "vs": [[28, "لا تشتم القضاة ولا تلعن رؤساء شعبك."]]}, {"l": "Isa 8:21", "n": "", "vs": [[21, "فإنهم يتيهون في الأرض مكتئبين جائعين، وعندما يعضهم الجوع بنابه يأخذهم الغضب ويلعنون ملكهم وإلههم ويلتفتون إلى العلاء،"]]}, {"l": "Act 23:5", "n": "", "vs": [[5, "فأجاب بولس: «لم أكن أعرف أيها الإخوة أنه رئيس كهنة فقد جاء في الكتاب: لا تشتم رئيس شعبك!»"]]}], "kwAr": "لا تلعن الملك", "noteAr": ""}, {"kw": "thought", "raw": "or, conscience, Ecc_7:21, Ecc_7:22; Luk_19:40", "note": "or, conscience, Ecc_7:21, Ecc_7:22; Luk_19:40", "refs": [{"l": "Ecc 7:21", "n": "", "vs": [[21, "لا تكترث لكل كلام يقال لئلا تسمع عبدك يشتمك."]]}, {"l": "Ecc 7:22", "n": "", "vs": [[22, "لأنك تدرك في قرارة نفسك أنك كثيرا ما لعنت غيرك."]]}, {"l": "Luk 19:40", "n": "", "vs": [[40, "فأجابهم قائلا: «أقول لكم: إن سكت هؤلاء، هتفت الحجارة!»" ة عليهم بلا جدوى. وقد أوضح الدكتور جيب ذلك بالمقاطع التالية:"}, {"kw": "", "raw": "Vain are the favours done to vicious men;", "note": "Vain are the favours done to vicious men;", "refs": [], "kwAr": "", "noteAr": "باطلة هي الإحسانات إلى الأشرار؛"}, {"kw": "", "raw": "Not vainer tis to sow the foaming deep.", "note": "Not vainer tis to sow the foaming deep.", "refs": [], "kwAr": "", "noteAr": "ليس أبطل منها زرع البحر الهائج."}, {"kw": "", "raw": "The deep no pleasant harvest shall afford,", "note": "The deep no pleasant harvest shall afford,", "refs": [], "kwAr": "", "noteAr": "فالعمق لا يعطي حصادا لذيذا،"}, {"kw": "", "raw": "Nor will the wicked ever make return.", "note": "Nor will the wicked ever make return.", "refs": [], "kwAr": "", "noteAr": "ولا يرد الأشرار شيئا أبدا."}, {"kw": "", "raw": "To befriend the wicked is like sowing in the sea.", "note": "To befriend the wicked is like sowing in the sea.", "refs": [], "kwAr": "", "noteAr": "الإحسان إلى الأشرار كالزرع في البحر."}, {"kw": "", "raw": "These, indeed, invert this precept;", "note": "These, indeed, invert this precept;", "refs": [], "kwAr": "", "noteAr": "وهؤلاء، في الحقيقة، يعكسون هذه الوصية؛"}, {"kw": "", "raw": "Nor is it extraordinary that they should.", "note": "Nor is it extraordinary that they should.", "refs": [], "kwAr": "", "noteAr": "وليس غريبا أن يفعلوا ذلك."}, {"kw": "", "raw": "The one, frail human power alone produced,", "note": "The one, frail human power alone produced,", "refs": [], "kwAr": "", "noteAr": "الأول لم تنتجه إلا قدرة بشرية واهية،"}, {"kw": "", "raw": "The other, God.", "note": "The other, God.", "refs": [], "kwAr": "", "noteAr": "والثاني الله."}, {"kw": "thy bread", "raw": "Deu_15:7-11; Pro_11:24, Pro_11:25, Pro_22:9; Isa_32:8", "note": "", "refs": [{"l": "Deu 15:7-11", "n": "", "vs": [[7, "إن وجد بينكم إسرائيلي فقير مقيم في أي مدينة من مدن الأرض التي سيهبها لكم الرب إلهكم، فلا تقسوا قلوبكم وتمتنعوا عن إعانته،"], [8, "بل اسخوا عليه وأقرضوه مقدار ما يحتاج إليه."], [9, "إياكم {"l": "1Ki 18:45", "n": "", "vs": [[45, "وسرعان ما تلبدت السماء بالغيوم، وهبت ريح عاصفة، وهطل مطر غزير، فاندفع أخآب بمركبته نحو يزرعيل."]]}, {"l": "Psa 65:9-13", "n": "", "vs": [[9, "تعهدت الأرض وجعلتها تفيض غيثا، فأخصبتها. مجرى نهر الله دافق بالماء فتفيض الأرض بالمحاصيل."], [10, "تروي أتلامها (خطوط المحراث) وتسوي روابيها، فتلينها وتبارك غلتها."], [11, "كللت السنة بجودك، وآثار صنائعك تفيض خصبا."], [12, "تموج مراعي البرية بالخير، وتكتسي التلال بالبهجة."], [13, "تتغطى المروج بالقطعان، وتتوشح الوديان بالحنطة، فيهتف لك الكل فرحا وتسبيحا."]]}, {"l": "Isa 55:10", "n": "", "vs": [[10, "وكما تهطل الأمطار وينهمر الثلج من السماء، ولا ترجع إلى هناك، بل تروي الحقول والأشجار، وتجعل البذور تنبت وتنمو وتثمر زرعا للفلاح وخبزا للجياع،"]]}, {"l": "Isa 55:11", "n": "", "vs": [[11, "هكذا تكون كلمتي التي تصدر عني مثمرة دائما، وتحقق ما أرغب فيه وتفلح بما أعهد به إليها."]]}, {"l": "1Jo 3:17", "n": "", "vs": [[17, "وأما الذي يملك مالا يمكنه من العيش في بحبوحة، ويقسي قلبه على أحد الإخوة المحتاجين، فكيف تكون محبة الله متأصلة فيه؟"]]}], "kwAr": "السحب", "noteAr": ""}, {"kw": "if the tree", "raw": "Mat_3:10; Luk_13:7, Luk_16:22-26", "note": "", "refs": [{"l": "Mat 3:10", "n": "", "vs": [[10, "وها إن الفأس قد ألقيت على أصل الشجر، فكل شجرة لا تثمر ثمرا جيدا تقطع وتطرح في النار."]]}, {"l": "Luk 13:7", "n": "", "vs": [[7, "فقال للمزارع: هذه ثلاث سنين وأنا أقصد هذه التينة طلبا للثمر فلا أجد شيئا: اقطعها، لماذا نتركها تعطل الأرض؟"]]}, {"l": "Luk 16:22-26", "n": "", "vs": [[22, "ومات المسكين، وحملته الملائكة إلى حضن إبراهيم. ثم مات الغني أيضا ودفن."], [23, "وإذ رفع عينيه وهو في الهاوية يتعذب، رأى إبراهيم من بعيد ولعازر في حضنه."], [24, "فنادى قائلا: ياأباي إبراهيم! ارحمني، وأرسل لعازر ليغمس طرف إصبعه في الماء ويبرد لساني: فإني معذب في هذا اللهيب."], [25, "ولكن إبراهيم قال: يابني، تذكر أنك نلت خيراتك كاملة في أثناء حياتك، ولعازر نال البلايا. ولكنه الآن يتعزى هنا، وأنت هناك تتعذب."], [26, "وفضلا عن هذا كله، فإن بيننا وبينكم هوة عظيمة قد أثبتت، حتى إن الذين يريدون العبور من هنا لا يقدرون، ولا الذين من ه
