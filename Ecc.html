أن كاهل الإنسان ينوء بثقل متاعبه."]]}, {"l": "2Ki 5:26", "n": "", "vs": [[26, "فقال له: «ألا تعرف أن قلبي كان حاضرا هناك حين ترجل الرجل من مركبته للقائك؟ أهذا وقت الحصول على فضة أو أخذ ثياب وزيتون وكروم وغنم وبقر وعبيد وجوار؟"]]}, {"l": "2Ch 33:12", "n": "", "vs": [[12, "وفي ضيقه استغاث بالرب إلهه وتذلل جدا أمام إله آبائه،"]]}, {"l": "Pro 15:23", "n": "", "vs": [[23, "الجواب الملائم يفرح الإنسان، وما أحسن الكلمة في حينها."]]}, {"l": "Mat 16:3", "n": "", "vs": [[3, "وإذا كانت السماء حمراء متجهمة في الصباح، تقولون: اليوم مطر! إنكم تستدلون على حالة الطقس من منظر السماء. أما علامات الأزمنة، فلا تستطيعون الاستدلال عليها!"]]}], "kwAr": "لكل شيء أوان", "noteAr": ""}, {"kw": "under", "raw": "Ecc_1:13, Ecc_2:3, Ecc_2:17", "note": "", "refs": [{"l": "Ecc 1:13", "n": "", "vs": [[13, "فوجهت قلبي ليلتمس ويبحث بالحكمة عن كل ما صنع تحت السماء، وإذا به مشقة منهكة كبدها الرب لأبناء الناس ليعانوا فيها."]]}, {"l": "Ecc 2:3", "n": "", "vs": [[3, "وبعد أن فحصت قلبي، حاولت أن أشرح صدري بالخمر، مع أن عقلي مازال يرشدني بالحكمة، وأن أختبر الحماقة حتى أرى ما هو صالح لأبناء البشر فيصنعوه تحت السماء طوال أيام حياتهم."]]}, {"l": "Ecc 2:17", "n": "", "vs": [[17, "فكرهت الحياة، لأن ما تم صنعه تحت الشمس كان مثار أسى لي، فكل شيء باطل كملاحقة الريح."]]}], "kwAr": "تحت السماء", "noteAr": ""}], "arS": [["لكل", ["H3605"]], [" ", []], ["شيء", ["H3605"]], [" ", []], ["أوان", ["H6256", "H2165"]], ["، ولكل ", []], ["أمر", ["H2656"]], [" ", []], ["تحت", ["H8478"]], [" ", []], ["السماء", ["H8064"]], [" زمان.", []]]}, {"c": 3, "v": 2, "text": "للولادة وقت وللموت وقت. للغرس وقت ولاستئصال المغروس وقت.", "groups": [{"kw": "time to be born", "raw": "Heb. time to bear, Gen_17:21, Gen_21:1, Gen_21:2; 1Sa_2:5; 1Ki_13:2; 2Ki_4:16; Psa_113:9; Isa_54:1; Luk_1:13, Luk_1:20, Luk_1:36; Joh_16:21; Act_7:17, Act_7:20; Gal_4:4", "note": "Heb. time to bear, Gen_17:21, Gen_21:1, Gen_21:2; 1Sa_2:5; 1Ki_13:2; 2Ki_4:16; Psa_113:9; Isa_54:1; Luk_1:13, Luk_1:20, Luk_1:36; Joh_16:21; Act_7:17, Act_7:20; Gal_4:4", "refs": [{"l": "Gen 17:21", "n": "", "vs": [[21, "غير أن عهدي أبرمه مع إسحق الذي تنجبه لك سارة في مثل هذا الوقت من السنة القادمة»."]]}, {"l": "Gen 21:1", "n": "", "vs": [[1, "وافتقد الرب سارة كما قال، وأنجز لها ما وعد به."]]}, {"l": "Gen 21:2", "n": "", "vs": [[2, "فحبلت سارة وولدت لإبراهيم في شيخوخته ابنا، في الوقت الذي عينه الله له."]]}, {"l": "1Sa 2:5", "n": "", "vs": [[5, "الذين كانوا شباعى آجروا أنفسهم لقاء الطعام، والذين كانوا جياعا ملأهم الشبع. أنجبت العاقر سبعة، أما كثيرة الأبناء فقد ذبلت."]]}, {"l": "1Ki 13:2", "n": "", "vs": [[2, "وهتف مخاطبا المذبح بقضاء الرب قائلا: «يامذبح، يامذبح، هذا ما يقوله الرب: سيولد لبيت داود ابن يدعى يوشيا، فيذبح عليك كهنة المرتفعات الذين يقربون عليك، وتحرق فوقك عظام الناس»."]]}, {"l": "2Ki 4:16", "n": "", "vs": [[16, "فقال لها أليشع: «في مثل هذا الوقت من السنة القادمة ستحضنين ابنا بين ذراعيك». فقالت: «لا ياسيدي رجل الله. لا تخدع أمتك»."]]}, {"l": "Psa 113:9", "n": "", "vs": [[9, "يرزق العاقر أولادا. يجعلها أما سعيدة. هللويا."]]}, {"l": "Isa 54:1", "n": "", "vs": [[1, "ترنمي أيتها العاقر التي لم تنجب، أشيدي بالترنم والهتاف يامن لم تقاسي من المخاض، لأن أبناء المستوحشة أكثر من أبناء ذات الزوج، يقول الرب."]]}, {"l": "Luk 1:13", "n": "", "vs": [[13, "فقال له الملاك: «لا تخف يازكريا، لأن طلبتك قد سمعت، وزوجتك أليصابات ستلد لك ابنا، وأنت تسميه يوحنا،"]]}, {"l": "Luk 1:20", "n": "", "vs": [[20, "وها أنت ستبقى صامتا لا تستطيع الكلام، إلى اليوم الذي يحدث فيه هذا، لأنك لم تصدق كلامي، وهو سيتم في حينه»."]]}, {"l": "Luk 1:36", "n": "", "vs": [[36, "وها هي نسيبتك أليصابات أيضا قد حبلت بابن في سنها المتقدمة. وهذا هو الشهر السادس لتلك التي كانت تدعى عاقرا."]]}, {"l": "Joh 16:21", "n": "", "vs": [[21, "المرأة تحزن إذا حانت ساعتها لتلد. ولكنها حالما تلد طفلها، لا تعود تتذكر عناءها، لفرحها بأن إنسانا قد ولد في العالم."]]}, {"l": "Act 7:17", "n": "", "vs": [[17, "وفيما كان يقترب إتمام الوعد الذي قطعه الله لإبراهيم، كان الشعب في مصر يتكاثرون ويزدادون عددا."]]}, {"l": "Act 7:20", "n": "", "vs": [[20, "في تلك الفترة ولد موسى. وكان جميلا جدا، فرباه والداه في بيتهما ثلاثة أشهر،"]]}, {"l": "Gal 4:4", "n": "", "vs": [[4, "ولكن لما جاء تمام الزمان، أرسل الله ابنه، وقد ولد من امرأة وكان خاضعا للشريعة،"]]}], "kwAr": "للولادة وقت", "noteAr": "بالعبرانية: وقت للإنجاب. انظر تك 17: 21؛ 21: 1، 2؛ 1صم 2: 5؛ 1مل 13: 2؛ 2مل 4: 16؛ مز 113: 9؛ إش 54: 1؛ لو 1: 13، 20، 36؛ يو 16: 21؛ أع 7: 17، 20؛ غل 4: 4"}, {"kw": "and a time", "raw": "Gen_47:29; Num_20:24-28, Num_27:12-14; Deu_3:23-26, Deu_34:5; Job_7:1, Job_14:5, Job_14:14; Isa_38:1, Isa_38:5; Joh_7:30; Heb_9:27", "note": "", "refs": [{"l": "Gen 47:29", "n": "", "vs": [[29, "وعندما قرب يوم وفاته، استدعى ابنه يوسف وقال له: «إن كنت قد حظيت برضاك، فضع يدك تحت فخذي، وأسد لي معروفا وأمانة: لا تدفني في مصر"]]}, {"l": "Num 20:24-28", "n": "", "vs": [[24, "«هرون لن يلبث أن يموت، لأنه لن يدخل الأرض التي وهبتها لبني إسرائيل، لأنكم عصيتم كلامي عند ماء مريبة»."], [25, "خذ هرون وألعازار ابنه واصعد إلى جبل هور،"], [26, "وانزع عن هرون ثيابه وألبسها ألعازار ابنه، لأن هناك يموت هرون»."], [27, "ففعل موسى كما أمر الرب، فصعدوا جميعا إلى الجبل على مرأى من الشعب كله،"], [28, "فنزع موسى ثياب هرون وألبسها ألعازار ابنه. ومات هرون هناك على قمة الجبل، ثم انحدر موسى وألعازار عن الجبل."]]}, {"l": "Num 27:12-14", "n": "", "vs": [[12, "وقال الرب لموسى: «اصعد إلى جبل عباريم، وانظر من عبر النهر إلى الأرض التي أعطيتها لبني إسرائيل."], [13, "ومتى شاهدتها تموت وتنضم إلى قومك أيضا، نظير أخيك هرون."], [14, "لأنكما في صحراء صين عصيتما قولي، حين تمرد الشعب، ولم تقدساني أمام أعينهم، إذ لم تأمرا الماء بالتفجر من الصخرة». ذلك ماء مريبة عند قادش في صحراء صين"]]}, {"l": "Deu 3:23-26", "n": "", "vs": [[23, "وتضرعت إلى الرب في ذلك الحين قائلا:"], [24, "ياسيد ها أنت قد ابتدأت تعلن لعبدك عظمتك وقوة قدرتك فأي إله في السماء وعلى الأرض يجري مثل أعمالك وجبروتك."], [25, "دعني أعبر لأرى لبنان والأرض الخصيبة غربي الأردن بتلالها الطيبة."], [26, "لكن الرب غضب علي من أجلكم، ولم يستجب لي، بل قال: كفاك. لا تعد تكلمني في هذا الأمر."]]}, {"l": "Deu 34:5", "n": "", "vs": [[5, "فمات موسى عبد الرب في أرض موآب بموجب قول الرب."]]}, {"l": "Job 7:1", "n": "", "vs": [[1, "أليست حياة الإنسان جهادا شاقا على الأرض، وأيامه كأيام الأجير؟"]]}, {"l": "Job 14:5", "n": "", "vs": [[5, "فإن كانت أيامه محدودة، وعدد أشهره مكتوبا لديك، وعينت أجله فلا يتجاوزه،"]]}, {"l": "Job 14:14", "n": "", "vs": [[14, "إن مات رجل أفيحيا؟ إذن لصبرت كل أيام مكابدتي، ريثما يأتي زمن إعفائي."]]}, {"l": "Isa 38:1", "n": "", "vs": [[1, "ومرض حزقيا في تلك الأيام حتى أوشك على الموت، فجاء إليه النبي إشعياء بن آموص، وقال له: «هذا ما يقوله الرب: نظم شؤون بيتك لأنك لن تبرأ بل حتما تموت»."]]}, {"l": "Isa 38:5", "n": "", "vs": [[5, "«اذهب بلغ حزقيا: هذا ما يقوله الرب إله داود أبيك: قد سمعت صلاتك ورأيت دموعك، وها أنا أضيف إلى عمرك خمس عشرة سنة،"]]}, {"l": "Joh 7:30", "n": "", "vs": [[30, "فسعى اليهود للقبض عليه، ولكن أحدا لم يلق عليه يدا، لأن ساعته لم تكن قد حانت."]]}, {"l": "Heb 9:27", "n": "", "vs": [[27, "فكما أن مصير الناس المحتوم، هو أن يموتوا مرة واحدة ثم تأتي الدينونة،"]]}], "kwAr": "وللموت وقت", "noteAr": ""}, {"kw": "a time to plant", "raw": "Psa_52:5; Isa_5:2-5; Jer_1:10, Jer_18:7-10, Jer_45:4; Mat_13:28, Mat_13:29, Mat_13:41, Mat_15:13", "note": "", "refs": [{"l": "Psa 52:5", "n": "", "vs": [[5, "حقا سيدمرك الله إلى الأبد، ويختطفك ويقتلعك من خيمتك، ويستأصلك من أرض الأحياء."]]}, {"l": "Isa 5:2-5", "n": "", "vs": [[2, "حرث أرضه ونقاه من الحجارة، وغرس فيه أفضل كرمة، وشيد في وسطه برجا، ونقر في الصخر معصرة. ثم انتظر أن يثمر له عنبا فأنتج له حصرما!"], [3, "والآن ياأهل أورشليم ورجال يهوذا، احكموا بيني وبين كرمي."], [4, "أي شيء يمكن أن يصنع لكرمي لم أصنعه؟ وعندما انتظرت منه أن يثمر لي عنبا، لماذا أنتج حصرما؟"], [5, "وا لآن أخبركم ما أصنع بكرمي: سأزيل سياجه فيصبح مرعى ماشية، وأهدم سوره فيضحى مداس أقدام،"]]}, {"l": "Jer 1:10", "n": "", "vs": [[10, "انظر. ها أنا قد وليتك على أمم وشعوب لتستأصل وتهدم وتبدد وتقلب وتبني وتغرس»."]]}, {"l": "Jer 18:7-10", "n": "", "vs": [[7, "تارة أقضي على أمة وعلى مملكة بالاستئصال والهدم والدمار،"], [8, "فترتد تلك الأمة التي قضيت عليها بالعقاب عن شرها، فأكف عن الشر الذي نويت معاقبتها به."], [9, "وتارة أقضي بمكافأة أمة أو مملكة ببناء قوتها وإنمائها."], [10, "ثم لا تلبث أن ترتكب الشر أمامي ولا تسمع لصوتي، فأكف عن الخير الذي نويت أن أنعم به عليها."]]}, {"l": "Jer 45:4", "n": "", "vs": [[4, "لذلك هذا ما تقوله له: هكذا يعلن الرب، ها أنا أهدم ما بنيته وأستأصل ما غرسته في كل هذه الأرض."]]}, {"l": "Mat 13:28", "n": "", "vs": [[28, "أجابهم إنسان عدو فعل هذا! فسألوه: أتريد أن نذهب ونجمع الزوان؟"]]}, {"l": "Mat 13:29", "n": "", "vs": [[29, "أجابهم: لا، لئلا تقلعوا القمح وأنتم تجمعون الزوان."]]}, {"l": "Mat 13:41", "n": "", "vs": [[41, "يرسل ابن الإنسان ملائكته، فيخرجون من ملكوته جميع المفسدين ومرتكبي الإثم،"]]}, {"l": "Mat 15:13", "n": "", "vs": [[13, "فأجابهم: «كل غرسة لم يغرسها أبي السماوي، لابد أن تقلع."]]}], "kwAr": "للغرس وقت", "noteAr": ""}], "arS": [["للولادة", ["H3205"]], [" ", []], ["وقت", ["H6256"]], [" ", []], ["وللموت", ["H4191"]], [" ", []], ["وقت", ["H6256"]], [". ", []], ["للغرس", ["H5193"]], [" ", []], ["وقت", ["H6256"]], [" ", []], ["ولاستئصال", ["H6131"]], [" المغروس ", []], ["وقت", ["H6256"]], [".", []]]}, {"c": 3, "v": 3, "text": "للقتل وقت وللعلاج وقت. للهدم وقت وللبناء وقت.", "groups": [{"kw": "time to kill", "raw": "Deu_32:39; 1Sa_2:6, 1Sa_2:25; Hos_6:1, Hos_6:2", "note": "", "refs": [{"l": "Deu 32:39", "n": "", "vs": [[39, "انظروا الآن: إني أنا هو وليس إله آخر معي. أنا أميت وأحيي، أسحق وأشفي، ولا منقذ من يدي."]]}, {"l": "1Sa 2:6", "n": "", "vs": [[6, "الرب يميت ويحيي، يطرح إلى الهاوية ويصعد منها."]]}, {"l": "1Sa 2:25", "n": "", "vs": [[25, "فإن أخطأ إنسان نحو إنسان، فالله يدينه، ولكن إن أخطأ إلى الرب فمن يصلي من أجله؟» لكنهم لم يعيروا توبيخ أبيهم أي اهتمام لأن الرب شاء أن يميتهم."]]}, {"l": "Hos 6:1", "n": "", "vs": [[1, "«تعالوا نرجع إلى الرب. هو الذي مزقنا إربا إربا، وهو وحده يبرئنا. هو الذي ضربنا، وهو وحده الذي يجبرنا."]]}, {"l": "Hos 6:2", "n": "", "vs": [[2, "بعد يومين يحيينا، وفي اليوم الثالث يقيمنا، لنحيا أمامه."]]}], "kwAr": "للقتل وقت", "noteAr": ""}, {"kw": "a time to heal", "raw": "Num_26:6-9; Isa. 38:5-20; Jer_33:6; Luk_9:54-56; Act_5:15, Act_5:16", "note": "", "refs": [{"l": "Num 26:6-9", "n": "", "vs": [[6, "وحصرون رأس عشيرة الحصرونيين، وكرمي رأس عشيرة الكرميين."], [7, "هذه العشائر المنحدرة من نسل رأوبين. وكان المحصون منهم ثلاثة وأربعين ألفا وسبع مئة وثلاثين."], [8, "وأليآب بن فلو."], [9, "أما أبناء أليآب فهم: نموئيل وداثان وأبيرام. وكان داثان وأبيرام من المنتخبين في المجلس وهما اللذان خاصما موسى وهرون مع بقية جماعة قورح حين تمردوا على الرب."]]}, {"l": "Isa 38:5-20", "n": "", "vs": [[5, "«اذهب بلغ حزقيا: هذا ما يقوله الرب إله داود أبيك: قد سمعت صلاتك ورأيت دموعك، وها أنا أضيف إلى عمرك خمس عشرة سنة،"], [6, "وأنقذك أنت وهذه المدينة من ملك أشور، وأدافع عنها."], [7, "وهذه لك علامة من عند الرب أنه لابد أن يحقق ما وعد به:"], [8, "سأرجع ظل الشمس إلى الوراء عشر درجات على مقياس درجات آحاز». وهكذا تراجعت الشمس عشر درجات إلى الوراء بعد أن كانت قد تخطتها."], [9, "وحين شفي حزقيا كتب هذه القصيدة:"], [10, "قلت ها أنا في ريعان أيامي أنحدر إلى عالم الموتى وتفنى بقية سنوات عمري"], [11, "وقلت لن أرى الرب بعد في أرض الأحياء، ولن أبصر أحدا من الناس في هذه الدنيا الفانية."], [12, "قد خلع عني مسكني، وانتقل كخيمة الراعي. طوى حياتي كحائك: قطعني من النول. أنت تفنيني ليل نهار."], [13, "انتظرت بصبر حتى الصباح، ولكنه كأسد هشم كل عظامي. أنت تفنيني ليل نهار ."], [14, "أصيح كسنونة، وأنوح كهديل الحمامة. كلت عيناي من النظر إلى السماء، يارب إني متضايق فكن لي مأمنا."], [15, "ولكن ماذا أقول؟ فقد خاطبني هو. هو نفسه قضى بذلك علي. طار النوم مني لفرط مرارة روحي."], [16, "يارب، بمثل هذه يحيا الناس، وفي هذه حياة روحي، فرد لي عافيتي وأحيني."], [17, "حقا إن ما قاسيته من مرارة كان من أجل خيري، فقد حفظتني بحبك من حفرة الهلاك، وألقيت جميع خطاياي خلف ظهرك."], [18, "لأنه ليس في وسع الهاوية أن تحمدك، والموت لا يسبحك، ولا يقدر الذين ذهبوا إلى الهاوية أن يرجوا أمانتك."], [19, "الأحياء وحدهم يسبحونك كما أفعل اليوم، ويحدث الآباء أبناءهم عن أمانتك"], [20, "الرب ينقذني. فلنشد بآلات وترية كل أيام حياتنا في هيكل الرب»."]]}, {"l": "Jer 33:6", "n": "", "vs": [[6, "ولكن لا ألبث أن أرد لها العافية والشفاء. أبرئهم وأبدي لهم وفرة السلام والأمن."]]}, {"l": "Luk 9:54-56", "n": "", "vs": [[54, "فلما رأى ذلك تلميذاه يعقوب ويوحنا، قالا: «يارب، أتريد أن نأمر بأن تنزل النار من السماء وتلتهمهم؟»"], [55, "فالتفت إليهما ووبخهما قائلا: «لا تعلمان من أي روح أنتما،"], [56, "لأن ابن الإنسان أتى لا ليهلك نفوس الناس، بل ليخلصها.» ثم ذهبوا إلى قرية أخرى."]]}, {"l": "Act 5:15", "n": "", "vs": [[15, "وكان الناس يحملون المرضى على فرشهم وأسرتهم إلى الشوارع، لعل ظل بطرس عند مروره يقع على أحد منهم فينال الشفاء."]]}, {"l": "Act 5:16", "n": "", "vs": [[16, "بل كانت الجموع من المدن والقرى المجاورة يأتون إلى أورشليم حاملين المرضى والمعذبين بالأرواح النجسة، فكانوا جميعا يبرأون."]]}], "kwAr": "وللعلاج وقت", "noteAr": ""}, {"kw": "a time to break", "raw": "Isa_5:5, Isa_5:6, Isa_44:26; Jer_31:28, Jer_45:4; Eze_13:14; Dan_9:25-27; Zec_1:12", "note": "", "refs": [{"l": "Isa 5:5", "n": "", "vs": [[5, "وا لآن أخبركم ما أصنع بكرمي: سأزيل سياجه فيصبح مرعى ماشية، وأهدم سوره فيضحى مداس أقدام،"]]}, {"l": "Isa 5:6", "n": "", "vs": [[6, "وأجعله خرابا فلا يقلم ولا ينقب، فينبت فيه شوك وحسك. وأوصي السحاب أن لا يمطر عليه أبدا."]]}, {"l": "Isa 44:26", "n": "", "vs": [[26, "أنا هو متمم كلام عبده، ومحقق مشورة رسله، القائل عن أورشليم: لابد أن تعود عامرة وعن مدن يهوذا: لابد أن تبنى، وأنا أعيد تشييد خربها."]]}, {"l": "Jer 31:28", "n": "", "vs": [[28, "وكما تربصت بهم لأستأصل وأهدم وأنقض وأهلك وأسيء، كذلك أسهر عليكم لأبنيكم وأغرسكم»، يقول الرب."]]}, {"l": "Jer 45:4", "n": "", "vs": [[4, "لذلك هذا ما تقوله له: هكذا يعلن الرب، ها أنا أهدم ما بنيته وأستأصل ما غرسته في كل هذه الأرض."]]}, {"l": "Eze 13:14", "n": "", "vs": [[14, "فأهدم السور الذي طليتموه بماء الكلس وأسويه بالأرض فيتعرى أساسه وتتداعى المدينة وتفنون جميعا في وسطها فتدركون أني أنا الرب."]]}, {"l": "Dan 9:25-27", "n": "", "vs": [[25, "لهذا فاعلم وافهم أن الحقبة الممتدة منذ صدور الأمر بإعادة بناء أورشليم إلى مجيء المسيح، سبعة أسابيع، ثم اثنان وستون أسبوعا يبنى في غضونها سوق وخليج. إنما تكون تلك أزمنة ضيق."], [26, "وبعد اثنين وستين أسبوعا يقتل المسيح، ولكن ليس من أجل نفسه، ويدمر شعب رئيس آت المدينة والقدس، وتقبل آخرتها كطوفان، وتستمر الحرب حتى النهاية، ويعم الخراب المقضي به."], [27, "ويبرم عهدا ثابتا مع كثيرين لمدة أسبوع واحد، ولكنه في وسط الأسبوع يبطل الذبيحة والتقدمة، ويقيم على جناح الهيكل رجاسة الخراب، إلى أن يتم القضاء، فينصب العقاب على المخرب»."]]}, {"l": "Zec 1:12", "n": "", "vs": [[12, "فقال الملاك: «إلى متى أيها الرب القدير لا تشفق على أورشليم ومدن يهوذا التي سخطت عليها طوال هذه السبعين سنة؟»"]]}], "kwAr": "للهدم وقت", "noteAr": ""}], "arS": [["للقتل", ["H2026"]], [" ", []], ["وقت", ["H6256"]], [" ", []], ["وللعلاج", ["H7495"]], [" ", []], ["وقت", ["H6256"]], [". ", []], ["للهدم", ["H6555"]], [" ", []], ["وقت", ["H6256"]], [" ", []], ["وللبناء", ["H1129"]], [" ", []], ["وقت", ["H6256"]], [".", []]]}, {"c": 3, "v": 4, "text": "للبكاء وقت وللضحك وقت. للنوح وقت وللرقص وقت.", "groups": [{"kw": "time to weep", "raw": "Neh_8:9-12, 9:1-38; Psa_30:5, Psa_126:1, Psa_126:2, Psa_126:5, Psa_126:6; Isa_22:12, Isa_22:13; Mat_9:15; Mat_11:17; Joh_16:20-22; Rom_12:15; 2Co_7:10; Jam_4:9", "note": "", "refs": [{"l": "Neh 8:9-12", "n": "", "vs": [[9, "وإذ بكى الشعب لدى سماعهم نص الشريعة، خاطبهم نحميا الوالي وعزرا الكاتب واللاويون الذين علموا الشعب قائلين: «لا تنوحوا ولا تبكوا، فهذا اليوم مقدس للرب إلهكم»"], [10, "ثم استطرد نحميا: «اذهبوا واحتفلوا آكلين أطايب الطعام، وشاربين حلو الشراب، وابعثوا أنصبة لمن لم يعد لهم. ولا تحزنوا لأن هذا اليوم مقدس لسيدنا، ففرح الرب هو قوتكم»."], [11, "وأخذ اللاويون يهدئون كل الشعب قائلين: «كفوا، لأن اليوم مقدس فلا تحزنوا»."], [12, "فمضى الشعب كله ليأكل ويشرب ويبعث بأنصبة ويحتفل بفرح عظيم، لأنه فهم نص الشريعة التي علموه إياها."]]}, {"l": "Neh 9:1-38", "n": "", "vs": [[1, "وفي اليوم الرابع والعشرين من الشهر ذاته، اجتمع بنو إسرائيل صائمين ومرتدين المسوح ومعفري الرؤوس بالتراب."], [2, "وعزل الإسرائيليون أنفسهم عن الغرباء، ووقفوا معترفين بخطاياهم وخطايا آبائهم،"], [3, "ومكثوا في أماكنهم حيث تلي عليهم من سفر شريعة الرب إلههم ربع النهار، وحمدوا وسجدوا له في الربع الأخير."], [4, "ووقف يشوع وباني وقدميئيل وشبنيا وبني وشربيا وباني وكناني على درج اللاويين، وهتفوا بصوت عظيم إلى الرب إلههم."], [5, "ونادى اللاويون: يشوع وقدميئيل وباني وحشبنيا وشربيا وهوديا وشبنيا وفتحيا قائلين: «قوموا وباركوا الرب إلهكم من الأزل إلى الأبد، وليتبارك اسمك المجيد المتعالي فوق كل بركة وتسبيح."], [6, "أنت وحدك هو الرب. أنت صانع السماوات وسماء السماوات، وكل كواكبها، والأرض وجميع ما عليها، والبحار وكل ما فيها. أنت تحييها، وكل جند السماء يسجدون لك."], [7, "أنت هو الرب الإله الذي اخترت أبرام وأخرجته من أور الكلدانيين ودعوته إبراهيم،"], [8, "وقد وجدت قلبه خالص الولاء لك، فقطعت له عهدا أن تهبه أرض الكنعانيين والحثيين والأموريين والفرزيين واليبوسيين والجرجاشيين فيرثها نسله. وقد حققت وعدك لأنك صادق."], [9, "أنت رأيت مذلة آبائنا في مصر واستجبت إلى صراخهم عند البحر الأحمر،"], [10, "فأجريت عجائب وآيات على فرعون وعلى سائر رجاله وعلى شعب أرضه كله، لأنك علمت أنهم تجبروا عليهم، فأشهرت بهذه العجائب اسمك إلى هذا اليوم،"], [11, "إذ فلقت البحر أمام آبائنا، فاجتازوا في وسطه على اليابسة، وطرحت مطارديهم في الأعماق كما يطرح حجر في مياه هائجة،"], [12, "وهديتهم بعمود سحاب نهارا، وبعمود نار ليلا، لتضيء لهم طريقهم التي هم فيها سالكون،"], [13, "ونزلت على جبل سيناء وخاطبتهم من السماء، وأعطيتهم أحكاما مستقيمة وشرائع صادقة وفرائض ووصايا صالحة،"], [14, "ولقنتهم حفظ سبتك المقدس، وأمرتهم بممارسة وصايا وفرائض وشرائع على لسان موسى عبدك،"], [15, "وأشبعت جوعهم بخبز من السماء، وفجرت لهم ماء من الصخرة إرواء لعطشهم، وأمرتهم أن يدخلوا ويرثوا الأرض التي أقسمت أن تهبها لهم."], [16, "ولكن أسلافنا وآباءنا طغوا وقسوا قلوبهم ولم يطيعوا وصاياك،"], [17, "وأبوا أن يسمعوا، وتجاهلوا عجائبك التي أجريتها لهم، وأغلظوا قلوبهم، ثم تمردوا ونصبوا عليهم قائدا ليرجعوا إلى عبوديتهم، ولكنك إله غفور وحنان ورحيم وحكيم وكثير الإحسان، فلم تتخل عنهم،"], [18, "مع أنهم سبكوا لأنفسهم عجلا وقالوا: «هذا هو إلهكم الذي أخرجكم من مصر!» فاقترفوا بذلك إثما عظيما."], [19, "فأنت بفائق رحمتك لم تنبذهم في الصحراء، ولم يفارقهم عمود السحاب الذي هداهم في الطريق نهارا، ولا عمود النار الذي أضاء لهم مسالكهم التي يسيرون فيها ليلا."], [20, "وأنعمت عليهم بروحك الصالح ليلقنهم، ولم تمنع منك عن أفواههم، ووفرت لهم ماء لإرواء عطشهم."], [21, "وعلتهم طوال أربعين سنة في الصحراء، فلم يعوزهم شيء، ولم تبل ثيابهم ولا تورمت أقدامهم،"], [22, "ووهبت لهم ممالك وأمما، ووزعت عليهم أنصبة في أقصى البلاد فامتلكوا بلاد سيحون وأرض ملك حشبون وديار عوج ملك باشان،"], [23, "وأكثرت نسلهم فصاروا كنجوم السماء عددا، وأتيت بهم إلى الأرض التي وعدت آباءهم أن يدخلوها ويرثوها،"], [24, "فاستولى عليها الأبناء وورثوا الأرض بعد أن أخضعت لهم سكانها الكنعانيين، وأسلمتهم لهم مع ملوكهم وأمم البلاد ليصنعوا بهم حسب ما يطيب لهم."], [25, "فتملكوا مدنا حصينة وأرضا خصيبة، وورثوا بيوتا تفيض خيرا، وآبارا محفورة، وكروما وزيتونا وأشجارا مثمرة كثيرة، فأكلوا وشبعوا وسمنوا وتمتعوا بخيرك العميم."], [26, "ومع ذلك ثاروا عليك وتمردوا وطرحوا شريعتك خلف ظهورهم، وقتلوا أنبياءك الذين حذروهم وأنذروهم ليرتدوا إليك، وارتكبوا الشرور الفواحش."], [27, "عندئذ أسلمتهم لمضايقيهم، فساموهم سوء العذاب. وفي ضيقهم استغاثوا بك، فاستجبت من السماء. وبفضل مراحمك الغزيرة بعثت من أنقذهم من يد مضايقيهم."], [28, "ولكن ما إن استقر لهم الأمر حتى رجعوا يرتكبون الشر أمامك، فأسلمتهم إلى أعدائهم الذين تسلطوا عليهم، فعادوا يستغيثون بك، فاستمعت إليهم من السماء وأنقذتهم بفضل مراحمك الوفيرة، أحيانا كثيرة"], [29, "وأنذرتهم لتردهم إلى شريعتك. غير أنهم طغوا وتمردوا على وصاياك وأخطأوا ضد أحكامك، التي إن مارسها إنسان يحيا بها، واعتصموا بعنادهم وأغلظوا قلوبهم ولم يطيعوا."], [30, "لقد تحملتهم سنين كثيرة، وحذرتهم بروحك على لسان أنبيائك فلم يصغوا، فأسلمتهم لعبودية أمم البلاد."], [31, "ولكن من أجل مراحمك العميمة لم تبدهم، ولم تتخل عنهم، لأنك إله حنان رحيم."], [32, "والآن ياإلهنا، أيها الإله العظيم الجبار المرهوب حافظ العهد ومغدق الرحمة، لا تستصغر كل المشقات التي أصابتنا نحن وملوكنا ورؤساءنا وكهنتنا وأنبياءنا وآباءنا وكل شعبك، منذ أيام ملوك أشور إلى هذا اليوم،"], [33, "فقد كنت عادلا في كل ما حل بنا، لأنك عاقبتنا بالحق، ونحن الذين أذنبنا."], [34, "ولم يطع ملوكنا ورؤساؤنا وكهنتنا وآباؤنا شريعتك، ولا استمعوا إلى وصاياك وتحذيراتك التي أنذرتهم بها."], [35, "ولم يعبدوك في ملكهم، ولا حين كانوا يتمتعون بخيرك العميم الذي أنعمت به عليهم، ولا في أرضهم الشاسعة الخصيبة التي بسطتها أمامهم، ولم يرتدوا عن سيئات أعمالهم."], [36, "وها نحن اليوم مستعبدون في الأرض التي وهبتها لآبائنا ليأكلوا أثمارها وخيرها."], [37, "تذهب غلاتها الوفيرة إلى الملوك الذين سلطتهم علينا من جراء معاصينا، وهم يتحكمون في أجسادنا وبهائمنا كما يطيب لهم، بينما نحن في كرب شديد."], [38, "فمن أجل ذلك كله ها نحن نبرم معك ميثاقا مكتوبا يوقعه رؤساؤنا ولاويونا وكهنتنا»."]]}, {"l": "Psa 30:5", "n": "", "vs": [[5, "فإن غضبه يدوم للحظة، أما رضاه فمدى الحياة. يبقى البكاء لليلة، أما في الصباح فيعم الابتهاج."]]}, {"l": "Psa 126:1", "n": "", "vs": [[1, "عندما أرجع الرب أهل أورشليم من السبي، صرنا كمن يرى حلما."]]}, {"l": "Psa 126:2", "n": "", "vs": [[2, "عندئذ امتلأت أفواهنا ضحكا، وألسنتنا ترنما. عندئذ قالت الأمم: إن الرب قد أجرى أمورا عظيمة مع هؤلاء."]]}, {"l": "Psa 126:5", "n": "", "vs": [[5, "فمن يزرع بالدموع يحصد غلاته بالابتهاج."]]}, {"l": "Psa 126:6", "n": "", "vs": [[6, "ومن يذهب باكيا حاملا بذاره يرجع مترنما حاملا حزم حصيده."]]}, {"l": "Isa 22:12", "n": "", "vs": [[12, "في ذلك اليوم يدعوكم السيد الرب القدير للبكاء والنوح وحلق الشعر والتنطق بالمسوح."]]}, {"l": "Isa 22:13", "n": "", "vs": [[13, "ولكنكم انهمكتم بالفرح والسرور وذبح الثيران وتضحية الغنم وأكل اللحم وشرب الخمر قائلين: «لنأكل ونشرب لأننا غدا نموت»."]]}, {"l": "Mat 9:15", "n": "", "vs": [[15, "فقال لهم يسوع: «هل يقدر أهل العرس أن يحزنوا مادام العريس بينهم؟ ولكن، ستأتي أيام يكون فيها العريس قد رفع من بينهم، فعندئذ يصومون!"]]}, {"l": "Mat 11:17", "n": "", "vs": [[17, "زمرنا لكم، فلم ترقصوا! وندبنا لكم، فلم تنتحبوا!"]]}, {"l": "Joh 16:20-22", "n": "", "vs": [[20, "الحق الحق أقول لكم: إنكم ستبكون وتنوحون، أما العالم فيفرح. إنكم ستحزنون، ولكن حزنكم سيتحول إلى فرح."], [21, "المرأة تحزن إذا حانت ساعتها لتلد. ولكنها حالما تلد طفلها، لا تعود تتذكر عناءها، لفرحها بأن إنسانا قد ولد في العالم."], [22, "فكذلك أنتم، تحزنون الآن؛ ولكن عندما أعود للقائكم، تبتهج قلوبكم، ولا أحد يسلبكم فرحكم."]]}, {"l": "Rom 12:15", "n": "", "vs": [[15, "افرحوا مع الفرحين، وابكوا مع الباكين."]]}, {"l": "2Co 7:10", "n": "", "vs": [[10, "فإن الحزن الذي يوافق مشيئة الله ينتج توبة تؤدي إلى الخلاص، وليس عليه ندم. وأما حزن العالم فينتج موتا."]]}, {"l": "Jam 4:9", "n": "", "vs": [[9, "احزنوا مولولين ونائحين وباكين. ليتحول ضحككم إلى نواح، وفرحكم إلى كآبة."]]}], "kwAr": "للبكاء وقت", "noteAr": ""}, {"kw": "a time to laugh", "raw": "Gen_21:6; Luk_1:13, Luk_1:14, Luk_1:58, Luk_6:21-25", "note": "", "refs": [{"l": "Gen 21:6", "n": "", "vs": [[6, "وقالت سارة «لقد أضحكني الرب. كل من يسمع هذا الأمر يضحك معي»."]]}, {"l": "Luk 1:13", "n": "", "vs": [[13, "فقال له الملاك: «لا تخف يازكريا، لأن طلبتك قد سمعت، وزوجتك أليصابات ستلد لك ابنا، وأنت تسميه يوحنا،"]]}, {"l": "Luk 1:14", "n": "", "vs": [[14, "ويكون لك فرح وابتهاج وكثيرون سيفرحون بولادته."]]}, {"l": "Luk 1:58", "n": "", "vs": [[58, "وسمع جيرانها وأقاربها أن الرب أفاض رحمته عليها، ففرحوا معها."]]}, {"l": "Luk 6:21-25", "n": "", "vs": [[21, "طوبى لكم أيها الجائعون الآن، فإنكم سوف تشبعون. طوبى لكم أيها الباكون الآن، فإنكم سوف تضحكون."], [22, "طوبى لكم متى أبغضكم الناس، وعزلوكم، وأهانوا اسمكم ونبذوه كأنه شرير، من أجل ابن الإنسان."], [23, "افرحوا في ذلك اليوم وتهللوا، فها إن مكافأتكم في السماء عظيمة: لأنه هكذا عامل آباؤهم الأنبياء."], [24, "«ولكن الويل لكم أنتم الأغنياء، فإنكم قد نلتم عزاءكم!"], [25, "الويل لكم أيها المشبعون الآن، فإنكم سوف تجوعون. الويل لكم أيها الضاحكون الآن، فإنكم سوف تنوحون وتبكون."]]}], "kwAr": "وللضحك وقت", "noteAr": ""}, {"kw": "to dance", "raw": "Exo_15:20; 2Sa_6:16", "note": "", "refs": [{"l": "Exo 15:20", "n": "", "vs": [[20, "عندئذ أخذت مريم النبية أخت هرون، الدف بيدها، فتبعها جميع النساء بالدف والرقص."]]}, {"l": "2Sa 6:16", "n": "", "vs": [[16, "ولما دخل موكب تابوت الرب مدينة داود، أطلت ميكال بنت شاول من الكوة، وشاهدت الملك داود يطفر ويرقص في حضرة الرب، فاحتقرته في نفسها."]]}], "kwAr": "وللرقص وقت", "noteAr": ""}], "arS": [["للبكاء", ["H1058"]], [" ", []], ["وقت", ["H6256"]], [" ", []], ["وللضحك", ["H7832"]], [" ", []], ["وقت", ["H6256"]], [". ", []], ["للنوح", ["H5594"]], [" ", []], ["وقت", ["H6256"]], [" ", []], ["وللرقص", ["H7540"]], [" ", []], ["وقت", ["H6256"]], [".", []]]}, {"c": 3, "v": 5, "text": "لبعثرة الحجارة وقت ولتكويمها وقت. للمعانقة وقت وللكف عنها وقت.", "groups": [{"kw": "to cast", "raw": "Jos_4:3-9, Jos_10:27; 2Sa_18:17, 2Sa_18:18; 2Ki_3:25", "note": "", "refs": [{"l": "Jos 4:3-9", "n": "", "vs": [[3, "وأمروهم قائلين: ليحمل كل منكم حجرا من هنا من وسط مجرى النهر حيث يقف الكهنة بأقدام ثابتة، وعبروها معكم، وأقيموها في الموضع الذي تبيتون فيه الليلة»."], [4, "فاستدعى يشوع الاثني عشر رجلا الذين تم اختيارهم من بين بني إسرائيل، رجلا من كل سبط."], [5, "وقال لهم: «تقدموا إلى وسط نهر الأردن، حيث يوجد تابوت الرب إلهكم، وليحمل كل رجل منكم حجرا واحدا على كتفه، بحسب عدد أسباط بني إسرائيل،"], [6, "فتكون هذه الحجارة، بعد نصبها، علامة في وسطكم، حتى إذا سألكم أبناؤكم في الأيام المقبلة: ماذا تعني لكم هذه الحجارة؟"], [7, "تجيبونهم: إن مياه الأردن توقفت عن الجريان، وانفلقت عند عبور تابوت عهد الرب النهر. وهكذا تصبح هذه الحجارة نصبا تذكاريا لبني إسرائيل مدى الدهر»."], [8, "فنفذ بنو إسرائيل ما أمر به يشوع، وحملوا اثني عشر حجرا من وسط نهر الأردن بحسب عدد أسباط بني إسرائيل كما أوصى الرب يشوع، وأجازوها معهم إلى حيث خيموا للمبيت ووضعوها هناك."], [9, "وأقام يشوع أيضا نصبا تذكاريا آخر من اثني عشر حجرا في وسط نهر الأردن حيث استقرت أقدام الكهنة حاملي تابوت العهد، وهي ما زالت هناك حتى الآن."]]}, {"l": "Jos 10:27", "n": "", "vs": [[27, "وعند غروب الشمس أمر يشوع فأنزلوهم عنها وطرحوهم في الكهف الذي لجأوا إليه وسدوا مدخله بحجارة كبيرة باقية إلى هذا اليوم."]]}, {"l": "2Sa 18:17", "n": "", "vs": [[17, "وأنزلوا أبشالوم وطرحوه في الغابة في حفرة عميقة، وأهالوا عليه رجمة كبيرة جدا من الحجارة. وهرب كل جندي من جيش إسرائيل إلى بيته."]]}, {"l": "2Sa 18:18", "n": "", "vs": [[18, "وكان أبشالوم قد أقام لنفسه في أثناء حياته نصبا تذكاريا في وادي الملك، لأنه قال: «ليس لي ابن يحمل اسمي من بعدي». ومازال هذا النصب معروفا بنصب أبشالوم إلى هذا اليوم."]]}, {"l": "2Ki 3:25", "n": "", "vs": [[25, "وهدموا المدن. وراح كل واحد من أفراد الجيش يلقي حجرا في كل حقل خصب حتى ملأوها، وردموا جميع عيون الماء، وقطعوا كل شجرة مثمرة، ولم تسلم إلا العاصمة «قير حارسة» التي حاصرتها وهاجمتها فرق المجانيق."]]}], "kwAr": "لبعثرة الحجارة", "noteAr": ""}, {"kw": "a time to embrace", "raw": "Exo_19:15; 1Sa_21:4, 1Sa_21:5; Son_2:6, Son_2:7; Joe_2:16; 1Co_7:5", "note": "", "refs": [{"l": "Exo 19:15", "n": "", "vs": [[15, "وقال للشعب: «كونوا متأهبين لليوم الثالث، وامتنعوا عن معاشرة نسائكم»."]]}, {"l": "1Sa 21:4", "n": "", "vs": [[4, "فأجاب الكاهن: «ليس عندي خبز عادي، وإنما خبز مقدس، يمكن لرجالك أن يأكلوا منه شريطة أن يكونوا قد حفظوا أنفسهم طاهرين ولاسيما من النساء»."]]}, {"l": "1Sa 21:5", "n": "", "vs": [[5, "فقال داود للكاهن: «إن النساء قد منعن عنا منذ أمس وما قبل، كما هي العادة عند خروجي في مهمة، أما أمتعتهم فهي دائما طاهرة، حتى في أثناء تنفيذ المهمات العادية. فكم بالحري إن كانت المهمة مقدسة؟»"]]}, {"l": "Son 2:6", "n": "", "vs": [[6, "شماله تحت رأسي، ويمينه تعانقني."]]}, {"l": "Son 2:7", "n": "", "vs": [[7, "أستحلفكن يابنات أورشليم بظباء الصحراء وأيائلها ألا توقظن أو تنبهن حبيبي حتى يشاء."]]}, {"l": "Joe 2:16", "n": "", "vs": [[16, "اجمعوا الشعب، قدسوا الجماعة، احشدوا الشيوخ والأولاد والرضع. ليغادر العريس مخدعه والعروس حجرتها."]]}, {"l": "1Co 7:5", "n": "", "vs": [[5, "فلا يمنع أحدكما الآخر عن نفسه إلا حين تتفقان معا على ذلك، ولفترة معينة، بقصد التفرغ للصلاة. وبعد ذلك عودا إلى علاقتكما السابقة، لكي لا يجربكما الشيطان لعدم ضبط النفس."]]}], "kwAr": "للمعانقة وقت", "noteAr": ""}, {"kw": "refrain from", "raw": "Heb. be far from", "note": "Heb. be far from", "refs": [], "kwAr": "وللكف عنها", "noteAr": "بالعبرانية: يبتعد."}], "arS": [["لبعثرة", ["H7993"]], [" ", []], ["الحجارة", ["H68"]], [" ", []], ["وقت", ["H6256"]], [" ", []], ["ولتكويمها", ["H3664"]], [" ", []], ["وقت", ["H6256"]], [". ", []], ["للمعانقة", ["H2263"]], [" ", []], ["وقت", ["H6256"]], [" ", []], ["وللكف", ["H7368"]], [" عنها ", []], ["وقت", ["H6256"]], [".", []]]}, {"c": 3, "v": 6, "text": "للسعي وقت، وللخسارة وقت. للصيانة وقت وللبعثرة وقت.", "groups": [{"kw": "time to get", "raw": "or, time to seek, Gen_30:30-43, Gen_31:18; Exo_12:35, Exo_12:36; Deu_8:17, Deu_8:18; 2Ki_5:26, 2Ki_8:9, an a time to lose, Mat_16:25, Mat_16:26, Mat_19:29; Mar_8:35-37, Mar_10:28-30; Luk_9:24, Luk_9:25", "note": "or, time to seek, Gen_30:30-43, Gen_31:18; Exo_12:35, Exo_12:36; Deu_8:17, Deu_8:18; 2Ki_5:26, 2Ki_8:9, an a time to lose, Mat_16:25, Mat_16:26, Mat_19:29; Mar_8:35-37, Mar_10:28-30; Luk_9:24, Luk_9:25", "refs": [{"l": "Gen 30:30-43", "n": "", "vs": [[30, "فالقليل الذي كان لك قبل مجيئي ازداد أضعافا كثيرة، فباركك الرب منذ أن قدمت عليك، والآن متى أشرع في تحصيل رزق عائلتي؟»"], [31, "فسأله: «ماذا أعطيك؟» فأجابه يعقوب: «لا تعطني شيئا. ولكن إن أردت، فاصنع لي هذا الأمر الواحد فأذهب وأرعى غنمك وأعتني بها:"], [32, "دعني أمر اليوم بين مواشيك كلها، فتعزل منها كل شاة رقطاء وبلقاء وسوداء من بين الخرفان، وكل بلقاء ورقطاء بين المعزى، فتكون هذه أجرتي."], [33, "وتكون أمانتي شاهدة على صدق خدمتي في مستقبل الأيام. فإذا جئت تفحص أجرتي، ووجدت عندي ما ليس أرقط أو أبلق بين المعزى وأسود بين الخرفان، يكون مسروقا عندي»."], [34, "فقال لابان: «ليكن وفقا لقولك»."], [35, "وعزل لابان في ذلك اليوم التيوس المخططة والبلقاء، وكل عنز رقطاء وبلقاء، كل ما فيه بياض وكل خروف أسود. وعهد بها إلى أبناء يعقوب."], [36, "وجعل بينه وبين يعقوب مسافة ثلاثة أيام، واستمر يعقوب يرعى مواشي لابان."], [37, "وأخذ يعقوب قضبانا خضراء من أشجار اللبنى واللوز والدلب وقلمها بخطوط بيضاء كاشفا عما تحت القشرة من بياض،"], [38, "ونصب القضبان التي قلمها تجاه الغنم في أجران مساقي الماء حيث ترد المواشي، فتتوحم عليها إذا ما أقبلت لتشرب."], [39, "فكانت الغنم تتوحم عند القضبان، فتلد غنما مخططة ورقطاء وبلقاء."], [40, "وفرز يعقوب الحملان، وجعل مقدمة المواشي في مواجهة كل ما هو مخطط وأسود من غنم لابان، وأقام لنفسه قطعانا على حدة بمعزل عن غنم لابان."], [41, "فكان يعقوب كلما توحمت الغنم القوية ينصب القضبان أمام عيون المواشي في الأجران لتتوحم بين القضبان."], [42, "وحين تكون الغنم ضعيفة، لا يضع القضبان أمامها، فصارت الضعيفة للابان والقوية ليعقوب."], [43, "فاغتنى الرجل جدا، وكثرت مواشيه وجواريه وعبيده وجماله وحميره."]]}, {"l": "Gen 31:18", "n": "", "vs": [[18, "وساق كل ماشيته أمامه وجميع مقتنياته التي اقتناها في سهل أرام واتجه إلى إسحق أبيه في أرض كنعان."]]}, {"l": "Exo 12:35", "n": "", "vs": [[35, "وطلبوا من المصريين آنية فضة وذهبا وثيابا بحسب قول موسى."]]}, {"l": "Exo 12:36", "n": "", "vs": [[36, "وجعل الرب الشعب يحظى برضى المصريين، فأعطوهم كل ما طلبوه، فغنموا من المصريين."]]}, {"l": "Deu 8:17", "n": "", "vs": [[17, "خوفا من أن تقولوا في قلوبكم: لقد أحرزنا هذا الثراء بفضل قوتنا وقدرة أيدينا."]]}, {"l": "Deu 8:18", "n": "", "vs": [[18, "ولكن اذكروا أن الرب إلهكم هو الذي يمنحكم القوة لإحراز الثروة، وفاء بوعده الذي أقسم عليه لآبائكم كما في هذا اليوم."]]}, {"l": "2Ki 5:26", "n": "", "vs": [[26, "فقال له: «ألا تعرف أن قلبي كان حاضرا هناك حين ترجل الرجل من مركبته للقائك؟ أهذا وقت الحصول على فضة أو أخذ ثياب وزيتون وكروم وغنم وبقر وعبيد وجوار؟"]]}, {"l": "2Ki 8:9", "n": "", "vs": [[9, "فمضى حزائيل لاستقباله آخذا معه هدية، حمل أربعين جملا من كل خيرات دمشق. وقال لأليشع: «ابنك بنهدد ملك أرام أرسلني إليك يسأل إن كان سيبرأ من مرضه»."]]}, {"l": "Mat 16:25", "n": "", "vs": [[25, "فأي من أراد أن يخلص نفسه، يخسرها؛ ولكن من يخسر نفسه لأجلي، فإنه يجدها."]]}, {"l": "Mat 16:26", "n": "", "vs": [[26, "فماذا ينتفع الإنسان لو ربح العالم كله وخسر نفسه؟ أو ماذا يقدم الإنسان فداء عن نفسه؟"]]}, {"l": "Mat 19:29", "n": "", "vs": [[29, "فأي من ترك بيوتا أو إخوة أو أخوات أو أبا أو أما أو أولادا أو أراضي من أجل اسمي، ينال مئة ضعف ويرث الحياة الأبدية."]]}, {"l": "Mar 8:35-37", "n": "", "vs": [[35, "فأي من أراد أن يخلص نفسه، يخسرها. ولكن من يخسر نفسه من أجلي ومن أجل الإنجيل، فهو يخلصها."], [36, "فماذا ينتفع الإنسان لو ربح العالم كله وخسر نفسه؟"], [37, "أو ماذا يقدم الإنسان فداء عن نفسه؟"]]}, {"l": "Mar 10:28-30", "n": "", "vs": [[28, "فأخذ بطرس يقول له: «ها نحن قد تركنا كل شيء وتبعناك.»"], [29, "فأجاب يسوع: «الحق أقول لكم: ما من أحد ترك لأجلي ولأجل الإنجيل بيتا أو إخوة أو أخوات أو أما أو أبا أو أولادا أو حقولا،"], [30, "إلا وينال مئة ضعف الآن في هذا الزمان، وفي الزمان الآتي الحياة الأبدية."]]}, {"l": "Luk 9:24", "n": "", "vs": [[24, "فأي من أراد أن يخلص نفسه، يخسرها؛ ولكن من يخسر نفسه من أجلي، فهو يخلصها."]]}, {"l": "Luk 9:25", "n": "", "vs": [[25, "فماذا ينتفع الإنسان لو ربح العالم كله وخسر نفسه أو أهلكها؟"]]}], "kwAr": "للسعي وقت", "noteAr": "أو: وقت للطلب. انظر تك 30: 30-43؛ 31: 18؛ خر 12: 35، 36؛ تث 8: 17، 18؛ 2مل 5: 26؛ 8: 9 «ووقت للخسارة». انظر مت 16: 25، 26؛ 19: 29؛ مر 8: 35-37؛ 10: 28-30؛ لو 9: 24، 25"}, {"kw": "and a time to cast", "raw": "Ecc_11:1; 2Ki_7:15; Psa_112:9; Isa_2:20; Jon_1:5; Act_27:19, Act_27:38; Phi_3:7, Phi_3:8; Heb_10:34, Heb_10:35", "note": "", "refs": [{"l": "Ecc 11:1", "n": "", "vs": [[1, "اطرح خبزك على وجه المياه، فإنك تجده بعد أيام كثيرة."]]}, {"l": "2Ki 7:15", "n": "", "vs": [[15, "فاقتفوا أثرهم إلى نهر الأردن، وإذا كل الطريق مملوءة ثيابا وأمتعة مما طرحها الأراميون عند فرارهم المفاجيء السريع. فرجع الرسل وأخبروا الملك."]]}, {"l": "Psa 112:9", "n": "", "vs": [[9, "يوزع بسخاء ويعطي الفقراء، وبره يدوم إلى الأبد، فيرتفع رأسه باعتزاز."]]}, {"l": "Isa 2:20", "n": "", "vs": [[20, "في ذلك اليوم يطرح الناس للجرذان والخفافيش أوثانهم الفضية وأصنامهم الذهبية التي صنعوها ليعبدوها،"]]}, {"l": "Jon 1:5", "n": "", "vs": [[5, "ففزع الملاحون واستغاث كل واحد منهم بإلهه، وطرحوا ما في السفينة من أمتعة ليخففوا من حمولتها. أما يونان فلجأ إلى جوف السفينة ورقد مستغرقا في نوم عميق."]]}, {"l": "Act 27:19", "n": "", "vs": [[19, "وفي اليوم الثالث رموا أثاث السفينة بأيديهم."]]}, {"l": "Act 27:38", "n": "", "vs": [[38, "وبعدما شبعوا رموا بالقمح في البحر ليخففوا حمولة السفينة."]]}, {"l": "Phi 3:7", "n": "", "vs": [[7, "ولكن، ما كان لي من ربح، فقد اعتبرته خسارة، من أجل المسيح."]]}, {"l": "Phi 3:8", "n": "", "vs": [[8, "بل إني أعتبر كل شيء خسارة، من أجل امتياز معرفة المسيح يسوع ربي؛ فمن أجله تحملت خسارة كل شيء، وأعتبر كل شيء نفاية، لكي أربح المسيح"]]}, {"l": "Heb 10:34", "n": "", "vs": [[34, "فقد تعاطفتم مع المسجونين، كما تقبلتم نهب ممتلكاتكم بفرح، علما منكم بأن لكم في السماء ثروة أفضل وأبقى."]]}, {"l": "Heb 10:35", "n": "", "vs": [[35, "إذن، لا تتخلوا عن ثقتكم بالرب. فإن لها مكافأة عظيمة."]]}], "kwAr": "وللبعثرة وقت", "noteAr": ""}], "arS": [["للسعي", ["H1245"]], [" ", []], ["وقت", ["H6256"]], ["، ", []], ["وللخسارة", ["H6"]], [" ", []], ["وقت", ["H6256"]], [". ", []], ["للصيانة", ["H8104"]], [" ", []], ["وقت", ["H6256"]], [" ", []], ["وللبعثرة", ["H7993"]], [" ", []], ["وقت", ["H6256"]], [".", []]]}, {"c": 3, "v": 7, "text": "للتمزيق وقت وللخياطة وقت. للصمت وقت وللإفصاح وقت.", "groups": [{"kw": "time to rend", "raw": "Gen_37:29, Gen_37:34; 2Sa_1:11, 2Sa_3:31; 1Ki_21:27; 2Ki_5:7, 2Ki_6:30; Jer_36:24; Joe_2:13; Act_9:39", "note": "", "refs": [{"l": "Gen 37:29", "n": "", "vs": [[29, "ثم ذهب رأوبين إلى البئر لينقذ يوسف فلم يجده، فمزق ثيابه،"]]}, {"l": "Gen 37:34", "n": "", "vs": [[34, "فشق يعقوب ثيابه، وارتدى المسوح على حقويه، وناح على ابنه أياما عديدة."]]}, {"l": "2Sa 1:11", "n": "", "vs": [[11, "فمزق داود ورجاله الذين معه ثيابهم."]]}, {"l": "2Sa 3:31", "n": "", "vs": [[31, "وأمر داود يوآب وسائر الشعب الذي معه قائلا: «مزقوا ثيابكم وارتدوا المسوح، والطموا وجوهكم نوحا على أبنير». وكان داود الملك يمشي خلف النعش."]]}, {"l": "1Ki 21:27", "n": "", "vs": [[27, "وعندما سمع أخآب هذا القضاء، مزق ثيابه وارتدى مسحا، وصام واضطجع بثياب المسح ومشى ذليلا."]]}, {"l": "2Ki 5:7", "n": "", "vs": [[7, "فلما اطلع ملك إسرائيل على الرسالة مزق ثيابه وقال: «هل أنا الله حتى أميت وأحيي، فيرسل إلي هذا لكي أشفي رجلا من برصه؟ اعلموا أنه يحاول أن يجد مبررا لمحاربتنا»."]]}, {"l": "2Ki 6:30", "n": "", "vs": [[30, "فلما سمع الملك حديث المرأة مزق ثيابه وهو يتفقد السور، فرأى المحيطون به أنه كان يرتدي مسوحا فوق جسده."]]}, {"l": "Jer 36:24", "n": "", "vs": [[24, "ولم يخف الملك ولا أحد من خدامه الذين سمعوا هذا الكلام، ولم يمزقوا ثيابهم."]]}, {"l": "Joe 2:13", "n": "", "vs": [[13, "مزقوا قلوبكم لا ثيابكم. ارجعوا إلى الرب إلهكم لأنه رؤوف ورحيم بطيء الغضب وكثير الرأفة، ولا يسر بالعقاب."]]}, {"l": "Act 9:39", "n": "", "vs": [[39, "فقام وذهب. ولما وصل قادوه إلى الطبقة العليا، فتقدمت إليه جميع الأرامل باكيات، يعرضن بعض الأقمصة والثياب مما كانت غزالة تخيطه وهي معهن."]]}], "kwAr": "للتمزيق وقت", "noteAr": ""}, {"kw": "time to keep", "raw": "Job_2:13; Psa_39:2; Isa_36:21; Jer_8:14; Lam_3:28; Amo_5:13, Amo_8:3; Mic_7:5", "note": "", "refs": [{"l": "Job 2:13", "n": "", "vs": [[13, "ومكثوا جالسين معه على الأرض سبعة أيام وسبع ليال، لم يكلمه فيها أحد منهم بكلمة لشدة ما كان عليه من كآبة."]]}, {"l": "Psa 39:2", "n": "", "vs": [[2, "صمت صمتا. أمسكت حتى عن الخير، فثار وجعي."]]}, {"l": "Isa 36:21", "n": "", "vs": [[21, "فاعتصموا بالصمت ولم يجيبوا بكلمة، لأن الملك أمر بعدم الرد عليه."]]}, {"l": "Jer 8:14", "n": "", "vs": [[14, "فما لنا قابعون هنا؟ اجتمعوا معا ولنلجأ إلى المدن الحصينة ونهلك هناك، لأن الرب إلهنا قد قضى علينا بالهلاك، وأعطانا ماء مسموما لنشربه، لأننا أخطأنا في حقه."]]}, {"l": "Lam 3:28", "n": "", "vs": [[28, "ليعتكف وحيدا في صمت لأن الرب قد وضع النير عليه."]]}, {"l": "Amo 5:13", "n": "", "vs": [[13, "لهذا يصمت العاقل في مثل هذا الزمان الرديء."]]}, {"l": "Amo 8:3", "n": "", "vs": [[3, "فتتحول أغاني قصورهم إلى عويل في ذلك اليوم، وتكثر الجثث ويطرحونها في كل مكان بصمت»."]]}, {"l": "Mic 7:5", "n": "", "vs": [[5, "لا تأتمن جارك ولا تثق بصديق، واحترس مما تنطق به شفتاك ممن ترقد في حضنك."]]}], "kwAr": "للصمت وقت", "noteAr": ""}, {"kw": "and a time to speak", "raw": "Gen_44:18, Gen_44:34; 1Sa_19:4, 1Sa_19:5, 25:24-44; Est_4:13, Est_4:14, Est_7:4; Job 32:4-37:24; Pro_24:11, Pro_24:12, Pro_31:8, Pro_31:9; Luk_19:37-40; Act_4:20", "note": "", "refs": [{"l": "Gen 44:18", "n": "", "vs": [[18, "فتقدم منه يهوذا وقال: «ياسيدي، دع عبدك ينطق بكلمة في مسمع سيدي، ولا يحتدم غضبك على عبدك، لأن سلطتك مماثلة لسلطة فرعون."]]}, {"l": "Gen 44:34", "n": "", "vs": [[34, "إذ كيف يمكنني أن أرجع إلى أبي والغلام ليس معي وأشهد ما يحل به من الشر؟»."]]}, {"l": "1Sa 19:4", "n": "", "vs": [[4, "وراح يوناثان يثني على داود أمام أبيه وتساءل: «لماذا يسيء الملك إلى عبده داود، فإنه لم يخطيء إليك، ومآثره عظيمة جدا؟"]]}, {"l": "1Sa 19:5", "n": "", "vs": [[5, "لقد عرض حياته للخطر عندما قتل الفلسطيني، فأجرى الرب خلاصا عظيما لجميع إسرائيل. وقد شهدت ذلك وابتهجت به. فلماذا تقتل داود من غير داع وتسيء إلى دم بريء؟»"]]}, {"l": "1Sa 25:24-44", "n": "", "vs": [[24, "وانطرحت عند رجليه قائلة: «ضع اللوم علي وحدي يا سيدي، ودع أمتك تتكلم في مسامعك واصغ إلى حديثها."], [25, "لا يضغن قلب سيدي على هذا الرجل اللئيم نابال، فهو فظ كاسمه والحماقة مقرونة به، أما أنا فلم أر رجال سيدي حين أرسلتهم."], [26, "والآن أقسم لك بالرب الحي وبحياتك، إن الرب قد جنبك سفك الدماء والثأر لنفسك، وليكن أعداؤك ومن يسعون في هلاكك، كنابال."], [27, "فتقبل الآن هذه البركة التي أحضرتها جاريتك يا سيدي وأعطها لرجالك الملتفين حولك."], [28, "واعف عن ذنب أمتك، لأن الرب لابد أن يثبت كرسي ملك سيدي إلى الأبد، لأن سيدي يحارب حروب الرب، فلا يوجد فيك شر كل أيامك."], [29, "وإن قام من يتعقبك ليقتلك، فلتكن نفس سيدي محزومة في حزمة الأحياء مع الرب إلهك. وأما نفس أعدائك فليقذف بها كما يقذف حجر من وسط كفة مقلاع."], [30, "وعندما يحقق الرب لسيدي كل هذا الخير الذي وعد به وينصبك رئيسا على إسرائيل،"], [31, "فلن تقاسي من عذاب الضمير لأنك سفكت دماء اعتباطا أو انتقمت لنفسك. ومتى حقق لك الرب وعده فاذكر أمتك»."], [32, "فقال داود لأبيجايل: «مبارك الرب إله إسرائيل الذي أرسلك اليوم للقائي،"], [33, "ومباركة فطنتك، ومباركة أنت لأنك جنبتني اليوم سفك الدماء والانتقام لنفسي."], [34, "ولكن حي هو الرب الذي منعني من الإساءة إليك، فلو لم تبادري وتأتي لاستقبالي لما بقي لنابال رجل على قيد الحياة عند مطلع ضوء الصباح»."], [35, "وقبل داود منها ما حملته إليه قائلا لها: «امضي إلى بيتك بسلام، فها أنا قد استمعت لتوسلك واستجبت طلبتك»."], [36, "فأقبلت أبيجايل إلى نابال، فوجدت أنه قد أقام مأدبة في بيته كمأدبة ملك، وقد أخذته النشوة بعد أن أكثر من احتساء الخمر حتى سكر، فلم تخبره بشيء إطلاقا حتى صباح اليوم التالي."], [37, "وفي الصباح، بعد أن صحا نابال من سكرته، أخبرته بما جرى، فأصابه الشلل وتجمد كحجر."], [38, "وبعد عشرة أيام ضربه الله فمات."], [39, "فلما سمع داود بموت نابال قال: «مبارك الرب الذي انتقم لي بذاته من إهانة نابال، وجنبني ارتكاب الشر وعاقب نابال على إثمه». وأرسل داود إلى أبيجايل يسألها الزواج منه."], [40, "فوفد رسل داود إلى أبيجايل إلى الكرمل وقالوا لها: «أرسلنا داود إليك لنسألك الزواج منه»."], [41, "فقامت وسجدت بوجهها إلى الأرض وقالت: «أنا أمته المستعدة لخدمته ولغسل أرجل عبيد سيدي»."], [42, "ثم أسرعت أبيجايل وركبت حمارها بعد أن صحبت معها خمس فتيات من جواريها سرن وراءها، وتبعت رسل داود، وصارت له زوجة."], [43, "ثم تزوج داود أخينوعم من يزرعيل فكانتا له زوجتين."], [44, "عندئذ زوج شاول ميكال ابنته امرأة داود من فلطي بن لايش الذي من جليم."]]}, {"l": "Est 4:13", "n": "", "vs": [[13, "فطلب أن يجيبوها: «لا يخطرن ببالك أنك ستنجين من العاقبة من دون سائر اليهود، لأنك في قصر الملك."]]}, {"l": "Est 4:14", "n": "", "vs": [[14, "لأنك إن لزمت الصمت في مثل هذا الوقت، فإن الفرج والنجاة لابد أن يأتيا لليهود من مصدر آخر، وأما أنت وبيت أبيك فتفنون. ومن يدري، فلربما قد وصلت إلى عرش الملك لوقت مثل هذا!»"]]}, {"l": "Est 7:4", "n": "", "vs": [[4, "لأنه قد تم بيعي أنا وشعبي للهلاك والقتل والإبادة. ولو أنهم باعونا عبيدا وإماء لكنت سكت، لأن هذا الأمر لا يبرر إزعاج الملك»."]]}, {"l": "Job 32:4-37:24", "n": "", "vs": [[4, "وكان أليهو قد لزم الصمت حتى فرغوا من الكلام مع أيوب، لأنهم كانوا أكبر منه سنا."], [5, "ولما رأى أليهو أن الرجال الثلاثة قد أخفقوا في إجابة أيوب قال بغضب محتدم:"], [6, "«أنا صغير السن وأنتم شيوخ، لذلك تهيبت وخفت أن أبدي لكم رأيي،"], [7, "قائلا لنفسي: لتتكلم الأيام، ولتلقن كثرة السنين حكمة»"], [8, "ولكن الروح الذي في الإنسان، ونسمة القدير، تعطي الإنسان فهما."], [9, "ليس المسنون وحدهم هم الحكماء، ولا الشيوخ فقط يدركون الحق."], [10, "لذلك أقول: أصغوا إلي لأحدثكم بما أعرف."], [11, "لقد أنصت بصبر حين تكلمتم، واستمعت إلى حججكم حين بحثتم عن الكلام،"], [12, "وأوليتكم انتباهي، فلم أجد في كلامكم ما أفحم أيوب، أو رد على أقواله."], [13, "احترسوا لئلا تقولوا إننا قد أحرزنا حكمة، فالرب يفحم أيوب لا الإنسان."], [14, "إنه لم يوجه حديثه إلي، لذلك لن أجيبه بمثل كلامكم."], [15, "لقد تحيروا، ياأيوب، ولم يجيبوا إذ أعياهم النطق،"], [16, "فهل أصمت لأنهم لم يتكلموا، وهل أمتنع عن الرد؟"], [17, "لا، سأجيب أنا أيضا وأبدي رأيي،"], [18, "لأني أفيض كلاما، والروح في داخلي يحفزني."], [19, "انظروا، إن قلبي في داخلي كخمر لم تفتح، وكزقاق جديدة تكاد تنشق!"], [20, "فلأتكلمن لأفرج عن نفسي، أفتح شفتي لأجيب."], [21, "لن أحابي إنسانا أو أتملق أحدا."], [22, "لأني لا أعرف التملق، وإلا يقضي علي صانعي سريعا."], [1, "والآن ياأيوب اصغ إلى أقوالي، واسمع كلامي كله:"], [2, "ها أنا قد فتحت فمي فنطق لساني في حنكي،"], [3, "كلماتي تصدر من قلب مستقيم، وشفتاي تتحدثان بإخلاص بما أعلم."], [4, "روح الله هو الذي كونني، ونسمة القدير أحيتني،"], [5, "فأجبني إن كنت تستطيع. أحسن الدعوى، واتخذ لك موقفا."], [6, "إنما أنا نظيرك أمام الله، من الطين جبلت،"], [7, "فلا هيبتي تخيفك، ولا يدي ثقيلة عليك."], [8, "حقا قد تكلمت في أذني فاستمعت إلى أقوالك."], [9, "أنت قلت: أنا نقي بريء من كل ذنب، أنا طاهر لا إثم في،"], [10, "إنما الله يتربص بي ليجد علة علي ويحسبني عدوا له،"], [11, "يضع أقدامي في المقطرة، ويترصد سبلي."], [12, "ولكنك مخطيء في هذا، وأنا الذي أجيبك. إن الله أعظم من الإنسان،"], [13, "فما بالك تخاصمه قائلا: إنه لن يجيب عن تساؤلاتي؟"], [14, "إن الله يتكلم بطريقة أو بأخرى وإن كان الإنسان لا يدركها."], [15, "يتكلم في حلم، في رؤيا الليل عندما يغشى الناس سبات عميق."], [16, "عندئذ يفتح آذان الناس ويرعبهم بتحذيراته،"], [17, "ليصرف الإنسان عن خطيئته ويستأصل منه الكبرياء،"], [18, "لينقذ نفسه من الهاوية وحياته من الهلاك بحد السيف."], [19, "قد يقوم الإنسان بالألم على مضجعه، وبالأوجاع الناشبة في عظامه،"], [20, "حتى تعاف حياته الطعام، وشهيته لذيذ المأكل."], [21, "يبلى لحمه فيختفي عن العيان، وتنبري عظامه التي كانت خافية من قبل."], [22, "تدنو نفسه من الهاوية، وحياته من زبانية الموت."], [23, "إن وجد له ملاك، شفيع، واحد من بين ألف، ليعلن للإنسان ما هو صالح له،"], [24, "يترَأف عليه قائلا: أنقذه يارب من الانحدار إلى الهاوية، فقد وجدت له فدية."], [25, "فيصير لحمه أكثر غضاضة من أيام صباه ويعود إلى عهد ريعان شبابه"], [26, "عندئذ يدعو المرء الله فيرضى عنه، ويمثل في حضرته بفرح، ويرد له الله بره،"], [27, "ثم يرنم أمام الناس قائلا: لقد أخطأت وحرفت ما هو حق ولم أجاز عليه،"], [28, "قد افتدى الله حياتي من الانحدار إلى الهاوية، فتنتعش حياتي لترى النور."], [29, "هذا كله يجريه الله على الإنسان مرتين وثلاث مرات،"], [30, "ليرد نفسه عن الهاوية ليستضيء بنور الحياة."], [31, "فاصغ ياأيوب وأنصت إلي. اصمت ودعني أتكلم."], [32, "وإن كان لديك ما تقوله فأجبني، تكلم، فإني أرغب في تبريرك."], [33, "وإلا فاصغ إلي، أنصت فأعلمك الحكمة»."], [1, "وأضاف أليهو قائلا:"], [2, "«استمعوا إلى أقوالي أيها الحكماء، وأصغوا إلي ياذوي المعرفة،"], [3, "لأن الأذن تمحص الأقوال كما يتذوق الحنك الطعام."], [4, "لنتداول فيما بيننا لنميز ما هو أصوب لنا، ونتعلم معا ما هو صالح."], [5, "يقول أيوب: «إني بار، ولكن الله قد تنكر لحقي،"], [6, "ومع أني محق فأنا أدعى كاذبا، ومع أني بريء فإن سهمه أصابني بجرح مستعص»."], [7, "فمن هو نظير أيوب الذي يجرع الهزء كالماء،"], [8, "يواظب على معاشرة فاعلي الإثم، ويأتلف مع الأشرار،"], [9, "لأنه يقول: لا ينتفع الإنسان شيئا من إرضاء الله."], [10, "لذلك أصغوا إلي ياذوي الفهم: حاشا لله أن يرتكب شرا أو للقدير أن يقترف خطأ،"], [11, "لأنه يجازي الإنسان بموجب أعماله، وبمقتضى طريقه يحاسبه."], [12, "إذ حاشا لله أن يرتكب شرا، والقدير أن يعوج القضاء."], [13, "من وكل الله بالأرض؟ ومن عهد إليه بالمسكونة؟"], [14, "إن استرجع روحه إليه واستجمع نسمته إلى نفسه"], [15, "فالبشر جميعا يفنون معا، ويعود الإنسان إلى التراب."], [16, "فإن كنت من أولي الفهم، فاستمع إلى هذا، وأنصت لما أقول:"], [17, "أيمكن لمبغض العدل أن يحكم؟ أتدين البار القدير؟"], [18, "الذي يقول للملك: أنت عديم القيمة، وللنبلاء: أنتم أشرار؟"], [19, "الذي لا يحابي الأمراء، ولا يؤثر الأغنياء على الفقراء، لأنهم جميعا عمل يديه."], [20, "في لحظة يموتون، تفاجئهم المنية في منتصف الليل، تتزعزع الشعوب فيفنون، ويستأصل الأعزاء من غير عون بشري،"], [21, "لأن عينيه على طرق الإنسان وهو يراقب خطواته."], [22, "لا توجد ظلمة، ولا ظل موت، يتوارى فيهما فاعلو الإثم،"], [23, "لأنه لا يحتاج أن يفحص الإنسان مرة أخرى حتى يدعوه للمثول أمامه في محاكمة."], [24, "يحطم الأعزاء من غير إجراء تحقيق، ويقيم آخرين مكانهم"], [25, "لذلك هو مطلع على أعمالهم، فيطيح بهم في الليل فيسحقون."], [26, "يضربهم لشرهم على مرأى من الناس،"], [27, "لأنهم انحرفوا عن اتباعه، ولم يتأملوا في طرقه،"], [28, "فكانوا سببا في ارتفاع صراخ البائس إليه، والله يستجيب استغاثة المسكين."], [29, "فإن هيمن بسكينته فمن يدينه، وإن وارى وجهه فمن يعاينه، سواء أكانوا شعبا أم فردا"], [30, "لكي لا يسود الفاجر، لئلا تعثر الأمة."], [31, "هل قال أحد لله: لقد تحملت العقاب فلن أعود إلى الإساءة؟"], [32, "علمني ما لا أراه، وإن كنت قد أثمت فإنني عنه أرتدع."], [33, "أيجزيك الله إذا بمقتضى رأيك إذا رفضت التوبة؟ لأن عليك أنت أن تختار لا أنا، فأخبرني بما تعرف."], [34, "إن ذوي الفهم يعلنون، والحكماء الذين ينصتون إلى كلامي يقولون لي:"], [35, "إن أيوب يتكلم بجهل، وكلامه يفتقر إلى التعقل."], [36, "ياليت أيوب يمتحن أقسى امتحان، لأنه أجاب كما يجيب أهل الشر."], [37, "لكنه أضاف إلى خطيئته عصيانا، إذ يصفق بيننا باحتقار، مثرثرا بأقوال ضد الله!»"], [1, "وقال أليهو أيضا:"], [2, "«أتحسب هذا عدلا؟ ثم تقول: إن هذا حقي أمام الله،"], [3, "وتسأل: أية منفعة لي؟ هل أكون في حال أفضل لو لم أخطىء؟"], [4, "سأجيبك أنت وأصدقاءك معك:"], [5, "انظر إلى السماوات وتأمل: تفرس في السحب الشامخة فوقك."], [6, "إن أثمت فماذا يؤثر هذا فيه؟ وإن كثرت خطاياك فأي شيء يلحق به؟"], [7, "وإن كنت بارا فماذا تعطيه؟ أو ماذا يأخذ من يدك؟"], [8, "إن شرك يؤثر في إنسان نظيرك، وبرك يفيد فقط أبناء الناس."], [9, "لأن من كثرة الجور يستغيث المظلومون طلبا للخلاص من قبضة العتاة،"], [10, "ولكن لا أحد يقول: أين الله صانعي، الواهب ترنيما في الليل،"], [11, "الذي علمنا أكثر من وحوش الأرض، وجعلنا أعظم حكمة من طيور السماء."], [12, "يستغيثون به فلا يجيب من جراء تشامخ الأشرار"], [13, "فإن كان الله لا يسمع لصراخهم الفارغ، ولا يأبه القدير له"], [14, "فكم بالأحرى لا يسمع لك عندما تقول إنك لا تراه! لكن اصبر، فدعواك أمامه"], [15, "والآن، لأنه لم يجاز في غضبه ولم يبال بمعاقبة الإثم،"], [16, "فغر أيوب فاه بالباطل، وأكثر من الكلام بجهل!»"], [1, "واستطرد أليهو:"], [2, "«تحملني قليلا فأزيدك اطلاعا، فمازال عندي ما أقوله نيابة عن الله،"], [3, "لأني أتلقى علمي من بعيد وأعزو برا لصانعي."], [4, "حقا إن كلامي صادق، لأن الكامل في المعرفة حاضر معك."], [5, "الله قدير ولكنه لا يحتقر الإنسان، هو قدير عظيم القدرة والفهم."], [6, "لا يبقي على حياة الشرير إنما يقضي حق البائسين."], [7, "لا يغض طرفه عن الصديقين، بل يقيمهم مع الملوك على العروش إلى الأبد فيتعظمون."], [8, "وإن رسفوا في القيود، ووقعوا في حبال الشقاء،"], [9, "عندئذ يبدي لهم أفعالهم وآثامهم إذ سلكوا بغرور."], [10, "يفتح آذانهم لتحذيراته، ويأمرهم بالتوبة عن إثمهم."], [11, "فإن أطاعوا وعبدوه، يقضون أيامهم برغد، وسنيهم بالنعم."], [12, "ولكن إن عصوا فبحد السيف يهلكون، ويموتون من غير فهم."], [13, "أما فجار القلوب فيذخرون لأنفسهم غضبا، ولا يستغيثون بالله حين يعاقبهم."], [14, "يموتون في الصبا بين مأبوني المعابد."], [15, "أما المبتلون فينقذهم في بلائهم، وبالضيق يفتح آذانهم."], [16, "يجتذبك من الضيق إلى رحب طليق، ويملأ مائدتك بالأطعمة الدسمة."], [17, "ولكنك مثقل بالدينونة الواقعة على الأشرار، فالدعوى والقضاء يمسكانك."], [18, "فاحرص لئلا يغريك الغضب بالسخرية، أو تصرفك الرشوة العظيمة عن الحق"], [19, "أيمكن لثرائك أو لجهودك الجبارة أن تدعمك فلا تغرق في الكآبة؟"], [20, "لا تتشوق إلى الليل حتى تجر الناس خارجا من بيوتهم."], [21, "احترس أن تتحول إلى الشر، فإن هذا ما اخترته عوضا عن الشقاء."], [22, "انظر، إن الله يتمجد في قوته. أي معلم نظيره؟"], [23, "من سن له طرقه أو قال له: لقد ارتكبت خطأ؟"], [24, "لا تنس أن تعظم عمله الذي يتغنى به الناس."], [25, "لقد شهده الناس كلهم، وتفرسوا فيه من بعيد."], [26, "فما أعظم الله ! ونحن لا نعرفه، وعدد سنيه لا يستقصى."], [27, "لأنه يجتذب قطرات الماء، ويجعل سحبه تهطل أمطارا،"], [28, "تسكبها السماوات وتصبها بغزارة على الإنسان."], [29, "أهناك من يفهم كيف تنتشر السحب، وكيف ترعد سماؤه؟"], [30, "فانظر كيف بسط بروقه حواليه وتسربل بلجج البحر."], [31, "هكذا يطعم الله الشعوب ويزودهم بالغذاء بوفرة."], [32, "يملأ يديه بالبروق ويأمرها أن تصيب الهدف."], [33, "إن رعده ينذر باقتراب العاصفة، وحتى الماشية تنبيء بدنوها."], [1, "لذلك يرتعد قلبي ويثب في موضعه."], [2, "فأنصت، واصغ إلى زئير صوته، وإلى زمجرة فمه."], [3, "يستل بروقه من تحت كل السماوات ويرسلها إلى جميع أقاصي الأرض،"], [4, "فتدوي زمجرة زئيره، ويرعد بصوت جلاله، وحين تتردد أصداؤه لا يكبح جماحها شيء."], [5, "يرعد الله بصوته صانعا عجائب وآيات تفوق إدراكنا."], [6, "يقول للثلج اهطل على الأرض، وللأمطار: انهمري بشدة."], [7, "يوقف كل إنسان عن عمله، ليدرك كل الناس الذين خلقهم حقيقة قوته."], [8, "فتلجأ الوحوش إلى أوجرتها، وتمكث في مآويها."], [9, "تقبل العاصفة من الجنوب، والبرد من الشمال،"], [10, "من نسمة الله يتكون الجليد، وتتجمد بسرعة المياه الغزيرة."], [11, "يشحن السحب المتكاثفة بالندى، ويبعثر برقه بينها."], [12, "فتتحرك كما يشاء هو، لتنفذ كل ما يأمرها به على وجه المسكونة."], [13, "يرسلها سواء للتأديب أو لأرضه أو رحمة منه."], [14, "فاستمع إلى هذا ياأيوب. وتوقف وتأمل في عجائب الله."], [15, "هل تدري كيف يتحكم الله في السحب، وكيف يجعل بروقه تومض؟"], [16, "هل تعرف كيف تتعلق السحب بتوازن؟ هذه العجائب الصادرة عن كامل المعرفة!"], [17, "أنت يامن تسخن ثيابه عندما ترين سكينة على الأرض بتأثير ريح الجنوب."], [18, "هل يمكنك مثله أن تصفح الجلد الممتد وكأنه مرآة مسبوكة؟"], [19, "أنبئنا ماذا علينا أن نقول له، فإننا لا نحسن عرض قضيتنا بسبب الظلمة (أي الجهل)"], [20, "هل أطلب من الله أن أتكلم معه؟ أي رجل يتمنى لنفسه الهلاك؟"], [21, "لا يقدر أحد أن يحدق إلى النور عندما يكون متوهجا في السماء، بعد أن تكون الريح قد بددت عنه السحب."], [22, "يقبل من الشمال بهاء ذهبي، إن الله مسربل بجلال مرهب."], [23, "ولا يمكننا إدراك القدير، فهو متعظم بالقوة والعدل والبر ولا يجور،"], [24, "لذلك يرهبه الجميع، لأنه يحتقر أدعياء الحكمة»."]]}, {"l": "Pro 24:11", "n": "", "vs": [[11, "أنقذ المسوقين إلى الموت ورد المتعثرين الذاهبين إلى الذبح."]]}, {"l": "Pro 24:12", "n": "", "vs": [[12, "إن قلت: إننا لم نعرف هذا، أفلا يفهم هذا وازن القلوب؟ ألا يدركه راعي النفوس، فيجازي الإنسان بمقتضى عمله؟"]]}, {"l": "Pro 31:8", "n": "", "vs": [[8, "افتح فمك مدافعا عن الأخرس، وفي دعوى كل منبوذ."]]}, {"l": "Pro 31:9", "n": "", "vs": [[9, "افتح فمك قاضيا بالعدل، ودافع عن حقوق الفقراء والمحتاجين."]]}, {"l": "Luk 19:37-40", "n": "", "vs": [[37, "ولما اقترب (من أورشليم) إذ وصل إلى منحدر جبل الزيتون، أخذ جماعة التلاميذ يهتفون جميعا بفرح مسبحين الله بصوت عال على جميع المعجزات التي شاهدوها،"], [38, "فيقولون: «مبارك الملك الآتي باسم الرب! سلام في السماء ومجد في الأعالي!»"], [39, "ولكن بعض الفريسيين من الجمع قالوا له: «يامعلم، ازجر تلاميذك!»"], [40, "فأجابهم قائلا: «أقول لكم: إن سكت هؤلاء، هتفت الحجارة!»"]]}, {"l": "Act 4:20", "n": "", "vs": [[20, "لا نستطيع أن نكف عن التحدث بما رأينا وسمعنا»."]]}], "kwAr": "وللإفصاح وقت", "noteAr": ""}], "arS": [["للتمزيق", ["H7167"]], [" ", []], ["وقت", ["H6256"]], [" ", []], ["وللخياطة", ["H8609"]], [" ", []], ["وقت", ["H6256"]], [". ", []], ["للصمت", ["H2814"]], [" ", []], ["وقت", ["H6256"]], [" ", []], ["وللإفصاح", ["H1696"]], [" ", []], ["وقت", ["H6256"]], [".", []]]}, {"c": 3, "v": 8, "text": "للحب وقت وللبغضاء وقت. للحرب وقت وللسلام وقت.", "groups": [{"kw": "time to love", "raw": "Eze_16:8; Psa_139:21; Eph_3:19, Eph_5:25, Eph_5:28, Eph_5:29; Tit_2:4", "note": "", "refs": [{"l": "Eze 16:8", "n": "", "vs": [[8, "فمررت بك ورأيتك وإذا بك قد بلغت سن الحب، فبسطت عليك أطراف ثوبي، وسترت عورتك وحلفت لك وأبرمت معك عهدا، فصرت لي، يقول السيد الرب."]]}, {"l": "Psa 139:21", "n": "", "vs": [[21, "يارب ألا أبغض مبغضيك، وأكره الثائرين عليك؟"]]}, {"l": "Eph 3:19", "n": "", "vs": [[19, "وتعرفوا محبة المسيح التي تفوق المعرفة، فتمتلئوا حتى تبلغوا ملء الله كله."]]}, {"l": "Eph 5:25", "n": "", "vs": [[25, "أيها الأزواج، أحبوا زوجاتكم مثلما أحب المسيح الكنيسة وبذل نفسه لأجلها،"]]}, {"l": "Eph 5:28", "n": "", "vs": [[28, "على هذا المثال يجب على الأزواج أن يحبوا زوجاتهم كأجسادهم. إن من يحب زوجته، يحب نفسه."]]}, {"l": "Eph 5:29", "n": "", "vs": [[29, "فلا أحد يبغض جسده البتة، بل يغذيه ويعتني به، كما يعامل المسيح أيضا الكنيسة."]]}, {"l": "Tit 2:4", "n": "", "vs": [[4, "لكي يدربن الشابات على أن يكن محبات لأزواجهن ولأولادهن،"]]}], "kwAr": "للحب وقت", "noteAr": ""}, {"kw": "a time to hate", "raw": "2Ch_19:2; Luk_14:26; Rev_2:2", "note": "", "refs": [{"l": "2Ch 19:2", "n": "", "vs": [[2, "فخرج النبي ياهو بن حناني للقائه وقال للملك يهوشافاط: «أتعين الشرير وتحب مبغضي الرب؟ لذلك يحل عليك غضب الرب."]]}, {"l": "Luk 14:26", "n": "", "vs": [[26, "«إن جاء إلي أحد، ولم يبغض أباه وأمه وزوجته وأولاده وإخوته وأخواته، بل نفسه أيضا، فلا يمكنه أن يكون تلميذا لي."]]}, {"l": "Rev 2:2", "n": "", "vs": [[2, "إني عالم بأعمالك، وجهدك، وصبرك، وأعلم أنك لا تستطيع احتمال الأشرار، وأنك دققت في فحص ادعاءات أولئك الذين يزعمون أنهم رسل، وما هم برسل، فتبين لك أنهم دجالون!"]]}], "kwAr": "وللبغضاء وقت", "noteAr": ""}, {"kw": "a time of war", "raw": "Gen_14:14-17; Josh. 8:1-29, Jos_11:23; 2Sa_10:6-19; 1Ki_5:4; 2Chr. 20:1-29, 2Ch_20:30", "note": "", "refs": [{"l": "Gen 14:14-17", "n": "", "vs": [[14, "فلما سمع أبرام أن ابن أخيه قد أسر، جرد ثلاث مئة وثمانية عشر من غلمانه المدربين المولودين في بيته وتعقبهم حتى بلغ دان"], [15, "وفي أثناء الليل قسم رجاله، وهاجمهم وقهرهم، ثم طاردهم حتى حوبة شمالي دمشق."], [16, "واسترد كل الغنائم، واسترجع ابن أخيه لوطا وأملاكه، والنساء أيضا وسواهم من الأسرى."], [17, "وجاء ملك سدوم للقاء أبرام في وادي شوى المعروف بوادي الملك، بعد عودته من كسرة كدرلعومر والملوك حلفائه."]]}, {"l": "Jos 8:1-29", "n": "", "vs": [[1, "وقال الرب ليشوع: «لا تجزع ولا تثبط همتك. خذ جيشك برمته وحاصر عاي لأني قد أسلمتك ملك عاي وشعبه ومدينته وأرضه."], [2, "فتجري على عاي وملكها ما أجريته على أريحا وملكها، غير أنكم تنهبون لأنفسكم غنيمتها وبهائمها. انصب كمينا خلف المدينة»."], [3, "فهب يشوع وجميع المحاربين وتوجهوا لمهاجمة عاي. واختار يشوع ثلاثين ألف رجل من محاربيه الأشداء، وأرسلهم ليلا، بعد أن أوصاهم قائلا:"], [4, "«اذهبوا واكمنوا خلف المدينة. لا تبتعدوا عنها كثيرا وتأهبوا جميعكم للقتال."], [5, "وأما أنا وبقية المحاربين الذين معي فنقترب إلى المدينة. فما إن يخرجوا للقائنا، كما حدث سابقا، حتى نتظاهر بالهرب أمامهم،"], [6, "فيتعقبونا، وبذلك نجذبهم بعيدا عن المدينة، ظنا منهم أننا هاربون أمامهم كما جرى في المرة الماضية،"], [7, "فتنقضون أنتم من المكمن وتستولون على المدينة التي يخضعها الرب إلهكم لكم."], [8, "ولدى استيلائكم على المدينة تضرمون فيها النار كأمر الرب، فافعلوا ونفذوا ما أوصيتكم به»."], [9, "وأطلقهم يشوع فتوجهوا إلى المكمن، حيث تربصوا بالمدينة ما بين بيت إيل وغربي عاي. وقضى يشوع ليلته تلك في وسط الشعب."], [10, "وفي الصباح التالي نهض يشوع مبكرا، وأحصى الجيش وسار هو وشيوخ إسرائيل في طليعتهم نحو عاي."], [11, "وتقدمت معه قواته كلها حتى أتوا إلى مقابل المدينة، حيث نزلوا شماليها، لا يفصل بينهم وبين عاي سوى الوادي."], [12, "وأرسل يشوع قوة دعم أخرى مؤلفة من خمسة آلاف محارب لتكمن بين بيت إيل وعاي غربي المدينة."], [13, "وتمركز الجيش الرئيسي في شمالي المدينة، في حين تربص الكمين في غربيها، أما يشوع فقد قضى تلك الليلة في وسط الوادي."], [14, "ولما رأى ملك عاي ما يجري، خرج بجيشه مبكرا للقاء إسرائيل ومحاربته في السهل، وهو لا يدري أن هناك كمينا يتحفز للهجوم عليهم من خلف المدينة."], [15, "فتظاهر يشوع وبقية الجيش بالانكسار أمامهم، ولاذوا بالفرار في طريق الصحراء."], [16, "فتنادى جميع الشعب الذين في المدينة لتعقب يشوع، فجدوا وراءهم مبتعدين عن المدينة."], [17, "ولم يبق في عاي أو في بيت إيل رجل لم يسع في مطاردة الإسرائيليين، تاركين المدينة مفتوحة للكمين."], [18, "فقال الرب ليشوع: «مد رمحك نحو عاي لأنني وهبتك المدينة». فمد يشوع الحربة التي بيده نحو المدينة،"], [19, "فاندفع الكمين من مكانه بسرعة عندما مد يده بالحربة وركضوا واقتحموا المدينة واستولوا عليها وأحرقوها بالنار."], [20, "فالتفت رجال عاي وراءهم وإذ بهم يشاهدون دخان المدينة يتصاعد إلى السماء، فلم يكن لهم من مهرب، فانقلب الجيش الهارب إلى الصحراء على مطارديه."], [21, "ولما رأى يشوع ومحاربوه أن الكمين قد استولى على المدينة، وأن دخانها قد ملأ الفضاء، شرعوا في مهاجمة رجال عاي والقضاء عليهم."], [22, "كذلك خرج الكمين من المدينة لقطع طريق الهرب عليهم. فوجد أهل عاي أنفسهم محصورين بين الإسرائيليين من الأمام ومن الخلف، ففتك بهم الإسرائيليون، فلم ينج منهم أحد."], [23, "أما ملك عاي فقد وقع في الأسر فتسلمه يشوع."], [24, "وعندما تم القضاء على جيش عاي في الصحراء حيث تعقبوا الإسرائيليين، وفنوا جميعهم بحد السيف، رجع المحاربون الإسرائيليون إلى عاي وقتلوا كل من فيها."], [25, "فكان جميع من قتل في ذلك اليوم من رجال ونساء اثني عشر ألفا، وهم جميع أهل عاي."], [26, "وظل يشوع مادا يده بالحربة نحو المدينة حتى تم القضاء على جميع أهل عاي."], [27, "أما البهائم وغنائم المدينة فقد نهبها الإسرائيليون لأنفسهم، بمقتضى أمر الرب الذي أصدره إلى يشوع."], [28, "وهكذا أحرق يشوع عاي وحولها إلى تل خراب أبدي إلى هذا اليوم."], [29, "وشنق ملك عاي على شجرة إلى وقت المساء، وعند غروب الشمس أمر يشوع فأنزلوا جثته عن الشجرة وطرحوها عند مدخل بوابة المدينةوهالوا عليها كومة حجارة عظيمة إلى هذا اليوم."]]}, {"l": "Jos 11:23", "n": "", "vs": [[23, "فاستولى يشوع على كل الأرض كما وعد الرب موسى، ووهبها يشوع ميراثا لإسرائيل وفقا لطوائفهم وأسباطهم. وأخيرا استراحت الأرض من الحرب."]]}, {"l": "2Sa 10:6-19", "n": "", "vs": [[6, "وعندما تبين العمونيون أن داود قد أضمر لهم البغضاء، استأجروا من أرام بيت رحوب وأرام صوبا عشرين ألف راجل، ومن ملك معكة ألف رجل، ومن رجال طوب اثني عشر ألف رجل."], [7, "فحين بلغ الخبر داود أرسل يوآب وسائر قواته الأبطال،"], [8, "فخرج بنو عمون واصطفوا للقتال عند مدخل باب المدينة، أما أراميو صوبا ورحوب ورجال طوب ومعكة فقد احتشدوا في الحقول."], [9, "وعندما أدرك يوآب أنه محاصر بجبهتي قتال من أمام ومن خلف، انتخب من صفوة جيشه رجالا صفهم للقاء الأراميين،"], [10, "وعهد ببقية الجيش إلى أخيه أبيشاي، فصفهم هذا لمواجهة بني عمون."], [11, "وقال يوآب: «إن تغلب علي الأراميون تسرع لنجدتي، وإن قوي عليك العمونيون أخف لإغاثتك."], [12, "لتتشجع ولتتقو من أجل شعبنا ومن أجل مدن إلهنا، والرب يجري ما يشاء»."], [13, "وتقدم يوآب بقواته لمحاربة الأراميين فلاذوا بالفرار."], [14, "وعندما شاهد العمونيون الأراميين يولون الأدبار، هربوا هم أيضا من أمام أبيشاي ودخلوا المدينة، فرجع يوآب عن بني عمون وعاد إلى أورشليم."], [15, "وبعد أن رأى الأراميون أنهم قد انهزموا أمام جيش إسرائيل اجتمعوا معا."], [16, "فأرسل هدد عزر واستدعى أراميي نهر الفرات، فتجمعوا في حيلام تحت قيادة شوبك رئيس جيش هدد عزر."], [17, "فلما علم داود، حشد جيوشه واجتاز نهر الأردن حتى قدم إلى حيلام فالتقى الجيشان في حرب ضروس."], [18, "وما لبث الأراميون أن اندحروا أمام الإسرائيليين، فقتلت قوات داود رجال سبع مئة مركبة، وأربعين ألف فارس. وأصيب شوبك رئيس الجيش ومات هناك."], [19, "وحين أدرك جميع حلفاء هدد عزر أنهم اندحروا أمام الإسرائيليين، عقدوا صلحا معهم وأصبحوا تابعين لهم ولم يجرؤوا على نجدة بني عمون بعد ذلك."]]}, {"l": "1Ki 5:4", "n": "", "vs": [[4, "أما الآن وقد أراحني الرب من كل جانب، فليس من ثائر أو حادثة شر."]]}, {"l": "2Ch 20:1-29", "n": "", "vs": [[1, "ثم اجتمع الموآبيون والمعونيون لمحاربة يهوشافاط،"], [2, "فأتى قوم وأبلغوا يهوشافاط أن جيشا عظيما قد زحف عليه قادما من عبر البحر من أرام، وها هو قد أصبح في حصون تامار التي هي عين جدي."], [3, "فاعتراه الخوف وعقد العزم على الاستغاثة بالرب ونادى بصوم في جميع يهوذا."], [4, "فاحتشد بنو يهوذا قادمين من كل مدن يهوذا ليطلبوا عون الرب."], [5, "فوقف يهوشافاط أمام الدار الجديدة في بيت الرب، في وسط جماعة يهوذا وأهل أورشليم،"], [6, "وقال: «يارب إله آبائنا، ألست أنت الله في السماء، المتسلط على جميع ممالك الأمم، المتمتع بالعزة والجبروت. فمن إذا يستطيع أن يثبت أمامك؟"], [7, "ألست أنت إلهنا الذي طردت أهل هذه الأرض من أمام شعبك إسرائيل، ووهبتها إلى الأبد لنسل إبراهيم خليلك؟"], [8, "فأقاموا فيها وشيدوا لك ولاسمك مقدسا قائلين:"], [9, "إذا أصابنا شر، سواء سيف قضاء أم وبأ، أم جوع، ووقفنا أمام هذا الهيكل، وفي حضرتك، لأن اسمك حال فيه، واستغثنا بك من ضيقنا فإنك تسمع وتخلص."], [10, "والآن ها هي جيوش العمونيين والموآبيين وسكان جبل سعير الذين منعت إسرائيل من الدخول إلى أرضهم عند خروجهم من مصر فتحولوا عنهم ولم يهلكوهم."], [11, "ها هم يكافئوننا بهجومهم علينا لطردنا من ملكك الذي أورثتنا إياه."], [12, "فيا إلهنا، ألا تنزل بهم قضاءك؟ لأننا نفتقر إلى القوة لمحاربة هذا الجيش العظيم القادم علينا، ونحن لا ندري ماذا نفعل، إنما إليك وحدك تلتفت عيوننا»."], [13, "وبينما كان كل بني يهوذا ماثلين في حضرة الرب مع أطفالهم ونسائهم وبنيهم،"], [14, "حل روح الرب على يحزئيل بن زكريا بن بنايا بن يعيئيل بن متنيا اللاوي، من بني آساف، الذي كان واقفا وسط الجماعة،"], [15, "فقال: «اصغوا ياجميع يهوذا وسكان أورشليم، وياأ يها الملك يهوشافاط. هذا ما يقوله الرب لكم: لا تجزعوا ولا ترتعبوا خوفا من هذا الجيش العظيم، إذ ليست الحرب حربكم، بل هي حرب الله."], [16, "ازحفوا نحوهم غدا، فها هم صاعدون في عقبة صيص، فتجدوهم في طرف الوادي بحذاء صحراء يروئيل."], [17, "ليس عليكم أن تخوضوا هذه المعركة، بل قفوا واثبتوا واشهدوا خلاص الرب الذي ينعم به عليكم يابني يهوذا وياأهل أورشليم. لا تجزعوا ولا ترتعبوا. انطلقوا غدا للقائهم والرب معكم»."], [18, "فأكب يهوشافاط على وجهه إلى الأرض، وسجد معه للرب جميع يهوذا وسكان أورشليم."], [19, "ثم وقف اللاويون من بني قهات ومن بني قورح ليسبحوا الرب بهتاف عظيم."], [20, "وفي ساعة مبكرة من صباح اليوم التالي توجه جيش يهوذا إلى صحراء تقوع، فقال يهوشافاط لهم عند خروجهم: «اصغوا يارجال يهوذا وياسكان أورشليم. آمنوا بالرب إلهكم فتأمنوا. آمنوا بأنبيائه فتفلحوا»."], [21, "وبعد التداول مع الشعب، جعل فرقة من المغنين الذين تزينوا بالثياب المقدسة تتقدم مسيرة المجندين للقتال، لتسبح الرب قائلة: «احمدوا الرب لأن رحمته إلى الأبد تدوم»."], [22, "وعندما شرعوا في الغناء والتسبيح أثار الرب كمائن على العمونيين والموآبيين، وأهل جبل سعير القادمين لمحاربة يهوذا، فانكسروا."], [23, "فقد انقلب العمونيون والموآبيون على سكان جبل سعير وقضوا عليهم، ثم انقلبوا على أنفسهم فأفنى بعضهم بعضا."], [24, "وحين بلغ جيش يهوذا برج المراقبة في الصحراء، التفتوا نحو جيش الأعداء، وإذا بهم جثث متناثرة على الأرض، لم يفلت منهم حي."], [25, "فهب يهوشافاط وجيشه لنهب الغنائم، فوجدوا بين الجثث أموالا وأسلابا هائلة وأمتعة ثمينة وفيرة فغنموها لأنفسهم حتى عجزوا عن حملها، وظلوا ينهبون الغنيمة طوال ثلاثة أيام لوفرتها."], [26, "ثم اجتمعوا في اليوم الرابع في وادي البركة لأنهم هناك باركوا الرب، فدعوا ذلك المكان وادي البركة إلى هذا اليوم."], [27, "ثم رجع رجال يهوذا وأورشليم وعلى رأسهم يهوشافاط إلى أورشليم بفرح، لأن الرب هزم أعداءهم."], [28, "ودخلوا أورشليم عازفين على الرباب والعيدان والأبواق، وتوجهوا إلى هيكل الرب."], [29, "وطغت هيبة الرب على كل ممالك الأراضي المجاورة بعد أن سمعوا أن الرب حارب أعداء إسرائيل."]]}, {"l": "2Ch 20:30", "n": "", "vs": [[30, "وتمتعت مملكة يهوشافاط بالسلام، ووفر له الرب أمانا شاملا من كل جانب."]]}], "kwAr": "للحرب وقت", "noteAr": ""}], "arS": [["للحب", ["H157"]], [" ", []], ["وقت", ["H6256"]], [" ", []], ["وللبغضاء", ["H8130"]], [" ", []], ["وقت", ["H6256"]], [". ", []], ["للحرب", ["H4421"]], [" ", []], ["وقت", ["H6256"]], [" ", []], ["وللسلام", ["H7965"]], [" ", []], ["وقت", ["H6256"]], [".", []]]}, {"c": 3, "v": 9, "text": "فأي نفع يجنيه العامل من كده؟", "groups": [{"kw": "", "raw": "Ecc_1:3, Ecc_2:11, Ecc_2:22, Ecc_2:23, Ecc_5:16; Pro_14:23; Mat_16:26", "note": "", "refs": [{"l": "Ecc 1:3", "n": "", "vs": [[3, "ما الفائدة من كل تعب الإنسان الذي يتعبه تحت الشمس."]]}, {"l": "Ecc 2:11", "n": "", "vs": [[11, "ثم تأملت كل ما صنعته يداي وما كابدته من تعب في عمله، فإذا الجميع باطل، وكملاحقة الريح، ولا جدوى من شيء تحت الشمس."]]}, {"l": "Ecc 2:22", "n": "", "vs": [[22, "فأي نفع للإنسان من جميع تعبه ومكابدته العناء الذي قاسى منه تحت الشمس؟"]]}, {"l": "Ecc 2:23", "n": "", "vs": [[23, "كل أيام حياته مفعمة بالمشقة، وعمله عناء. حتى في الليل لا يستريح قلبه. وهذا أيضا باطل."]]}, {"l": "Ecc 5:16", "n": "", "vs": [[16, "وهذا أيضا شر أليم، إذ إنه يفارق الدنيا كما جاء فأي منفعة له، إذ إن تعبه يذهب أدراج الرياح؟"]]}, {"l": "Pro 14:23", "n": "", "vs": [[23, "في كل جهد مبذول ربح، أما مجرد الكلام فيؤدي إلى الفقر."]]}, {"l": "Mat 16:26", "n": "", "vs": [[26, "فماذا ينتفع الإنسان لو ربح العالم كله وخسر نفسه؟ أو ماذا يقدم الإنسان فداء عن نفسه؟"]]}], "kwAr": "", "noteAr": ""}], "arS": [["فأي", ["H4100"]], [" ", []], ["نفع", ["H3504"]], [" يجنيه ", []], ["العامل", ["H6213"]], [" ", []], ["من", ["H834"]], [" ", []], ["كده", ["H6001"]], ["؟", []]]}, {"c": 3, "v": 10, "text": "لقد رأيت المشقة التي حملها الله لأبناء الناس ليقوموا بها.", "groups": [{"kw": "", "raw": "Ecc_1:13, Ecc_1:14, Ecc_2:26; Gen_3:19; 1Th_2:9; 2Th_3:8", "note": "", "refs": [{"l": "Ecc 1:13", "n": "", "vs": [[13, "فوجهت قلبي ليلتمس ويبحث بالحكمة عن كل ما صنع تحت السماء، وإذا به مشقة منهكة كبدها الرب لأبناء الناس ليعانوا فيها."]]}, {"l": "Ecc 1:14", "n": "", "vs": [[14, "لقد شاهدت كل الأشياء التي تم صنعها تحت الشمس فإذا الجميع باطل كملاحقة الريح."]]}, {"l": "Ecc 2:26", "n": "", "vs": [[26, "لأن المرء الذي يحظى برضى الله ينعم الله عليه بالحكمة والمعرفة والفرح. أما الخاطيء فيفرض عليه عناء الجمع والادخار، ليكون ذلك من نصيب من يرضي الله . وهذا أيضا باطل كملاحقة الريح."]]}, {"l": "Gen 3:19", "n": "", "vs": [[19, "بعرق جبينك تكسب عيشك حتى تعود إلى الأرض، فمن تراب أخذت، وإلى تراب تعود»."]]}, {"l": "1Th 2:9", "n": "", "vs": [[9, "فأنتم تذكرون، أيها الإخوة، جهدنا وكدنا، إذ بشرناكم بإنجيل الله ونحن نشتغل ليلا ونهارا لكي لا نكون عبئا ثقيلا على أحد منكم."]]}, {"l": "2Th 3:8", "n": "", "vs": [[8, "ولا أكلنا الخبز من عند أحد مجانا، بل كنا نشتغل بتعب وكد ليل نهار، لكي لا نكون عبئا ثقيلا على أي واحد منكم."]]}], "kwAr": "", "noteAr": ""}], "arS": [["لقد ", []], ["رأيت", ["H7200"]], [" ", []], ["المشقة", ["H6045"]], [" ", []], ["التي", ["H834"]], [" ", []], ["حملها", ["H5414"]], [" ", []], ["الله", ["H430"]], [" ", []], ["لأبناء", ["H1121"]], [" ", []], ["الناس", ["H120"]], [" ", []], ["ليقوموا", ["H6031"]], [" بها.", []]]}, {"c": 3, "v": 11, "text": "إذ صنع كل شيء حسنا في حينه وغرس الأبدية في قلوب البشر، ومع ذلك لم يدركوا أعمال الله من البداية إلى النهاية.", "groups": [{"kw": "hath made", "raw": "Ecc_7:29; Gen_1:31; Deu_32:4; Mar_7:37", "note": "", "refs": [{"l": "Ecc 7:29", "n": "", "vs": [[29, "بل هذا ما وجدته: إن الله قد صنع البشر مستقيمين، أما هم فانطلقوا باحثين عن مستحدثات كثيرة!"]]}, {"l": "Gen 1:31", "n": "", "vs": [[31, "ورأى الله ما خلقه فاستحسنه جدا. ثم جاء مساء أعقبه صباح فكان اليوم السادس."]]}, {"l": "Deu 32:4", "n": "", "vs": [[4, "هو الصخر، وصنائعه كلها كاملة، سبله جميعها عدل. هو إله أمانة لا يرتكب جورا، صديق وعادل هو."]]}, {"l": "Mar 7:37", "n": "", "vs": [[37, "وذهلوا إلى الغاية، قائلين: «إنه يبدع في كل ما يفعل. فهو يجعل الصم يسمعون والخرس يتكلمون»."]]}], "kwAr": "صنع كل شيء حسنا", "noteAr": ""}, {"kw": "also", "raw": "Mat_13:22; Rom_1:19, Rom_1:20, Rom_1:28", "note": "", "refs": [{"l": "Mat 13:22", "n": "", "vs": [[22, "أما المزروع بين الأشواك، فهو الذي يسمع الكلمة، ولكن هم الزمان الحاضر وخداع الغنى يخنقان الكلمة، فلا يعطي ثمرا."]]}, {"l": "Rom 1:19", "n": "", "vs": [[19, "ذلك لأن ما يعرف عن الله واضح بينهم، إذ بينه الله لهم."]]}, {"l": "Rom 1:20", "n": "", "vs": [[20, "فإن ما لا يرى من أمور الله، أي قدرته الأزلية وألوهته، ظاهر للعيان منذ خلق العالم، إذ تدركه العقول من خلال المخلوقات. حتى إن الناس باتوا بلا عذر."]]}, {"l": "Rom 1:28", "n": "", "vs": [[28, "وبما أنهم لم يتخيروا إبقاء الله ضمن معرفتهم، أسلمهم الله إلى ذهن عاطل عن التمييز دفعهم إلى ممارسة الأمور غير اللائقة."]]}], "kwAr": "غرس الأبدية", "noteAr": ""}, {"kw": "so", "raw": "Ecc_8:17; Job_11:7, Job_37:23; Psa_104:24; Mat_11:27; Rom_11:33", "note": "", "refs": [{"l": "Ecc 8:17", "n": "", "vs": [[17, "رأيت أعمال الله كلها، وعجز الإنسان عن إدراك الأعمال التي تم إنجازها تحت الشمس. ومهما جد في سعيه لمعرفتها فلن يدركها. وحتى إن ادعى الحكيم معرفتها فإنه حقا لن يستطيع أن يجدها."]]}, {"l": "Job 11:7", "n": "", "vs": [[7, "ألعلك تدرك أعماق الله، أم تبلغ أقصى قوة القدير؟"]]}, {"l": "Job 37:23", "n": "", "vs": [[23, "ولا يمكننا إدراك القدير، فهو متعظم بالقوة والعدل والبر ولا يجور،"]]}, {"l": "Psa 104:24", "n": "", "vs": [[24, "يارب ما أعظم أعمالك، كلها صنعت بحكمة، فامتلأت الأرض من غناك."]]}, {"l": "Mat 11:27", "n": "", "vs": [[27, "كل شيء قد سلمه إلي أبي. ولا أحد يعرف الابن إلا الآب، ولا أحد يعرف الآب إلا الابن، ومن أراد الابن أن يعلنه له."]]}, {"l": "Rom 11:33", "n": "", "vs": [[33, "فما أعمق غنى الله وحكمته وعلمه! ما أبعد أحكامه عن الفحص وطرقه عن التتبع !"]]}], "kwAr": "ومع ذلك لم يدركوا", "noteAr": ""}], "arS": [["إذ ", []], ["صنع", ["H6213"]], [" ", []], ["كل", ["H3605"]], [" شيء ", []], ["حسنا", ["H3303"]], [" في ", []], ["حينه", ["H6256"]], [" ", []], ["وغرس", ["H5414"]], [" ", []], ["الأبدية", ["H5769"]], [" في ", []], ["قلوب", ["H3820"]], [" ", []], ["البشر", ["H120"]], ["، ", []], ["ومع", ["H1571"]], [" ذلك ", []], ["لم", ["H4672"]], [" ", []], ["يدركوا", ["H1097"]], [" ", []], ["أعمال", ["H4639"]], [" ", []], ["الله", ["H430"]], [" ", []], ["من", ["H4480"]], [" ", []], ["البداية", ["H7218"]], [" ", []], ["إلى", ["H5704"]], [" ", []], ["النهاية", ["H4480", "H5490"]], [".", []]]}, {"c": 3, "v": 12, "text": "فأيقنت أنه ليس أفضل لهم من أن يفرحوا ويمتعوا أنفسهم وهم مازالوا على قيد الحياة.", "groups": [{"kw": "but", "raw": "Ecc_3:22, Ecc_9:7-9; Deu_28:63; Psa_37:3; Isa_64:5; Luk_11:41; Act_20:35; Phi_4:4-9; 1Th_5:15, 1Th_5:16; 1Ti_6:18", "note": "", "refs": [{"l": "Ecc 3:22", "n": "", "vs": [[22, "فرأيت أنه ليس أفضل من أن يستمتع الإنسان بكده، لأن هذا نصيبه، لأنه من يرجعه ليرى ما سيجري من بعده؟"]]}, {"l": "Ecc 9:7-9", "n": "", "vs": [[7, "فامض وتمتع بأكل طعامك، واشرب خمرك بقلب منشرح، لأن الرب قد رضي الآن عن أعمالك."], [8, "لتكن ثيابك دائما بيضاء، ولا يعوزن رأسك الطيب."], [9, "تمتع طوال أيام حياتك الباطلة التي أعطاك إياها الرب تحت الشمس مع المرأة التي أحببتها، لأن ذلك هو حظك من الحياة ومن عناء تعبك الذي تكابده تحت الشمس."]]}, {"l": "Deu 28:63", "n": "", "vs": [[63, "وكما سر الرب بكم فأحسن إليكم وكثركم، فإنه سيسر بأن يفنيكم ويهلككم فتنقرضون من الأرض التي أنتم ماضون إليها لامتلاكها."]]}, {"l": "Psa 37:3", "n": "", "vs": [[3, "توكل على الرب واصنع الخير. اسكن في الأرض (مطمئنا) وراع الأمانة."]]}, {"l": "Isa 64:5", "n": "", "vs": [[5, "أنت تلاقي من يفرح بعمل البر ومن يسلك دائما في طرقك. لكم سخطت علينا لأننا واظبنا على ارتكاب الآثام زمانا طويلا، فكيف لمثلنا أن يخلص؟"]]}, {"l": "Luk 11:41", "n": "", "vs": [[41, "أحرى بكم أن تتصدقوا بما عندكم، فإذا كل شيء يكون طاهرا لكم."]]}, {"l": "Act 20:35", "n": "", "vs": [[35, "وقد أظهرت لكم بوضوح كيف يجب أن نبذل الجهد لنساعد المحتاجين، متذكرين كلمات الرب يسوع، إذ قال: الغبطة في العطاء أكثر مما في الأخذ!»"]]}, {"l": "Phi 4:4-9", "n": "", "vs": [[4, "افرحوا في الرب دائما، وأقول أيضا: افرحوا."], [5, "ليكن طول بالكم معروفا لدى الناس جميعا. إن الرب قريب."], [6, "لا تقلقوا من جهة أي شيء، بل في كل أمر لتكن طلباتكم معروفة لدى الله، بالصلاة والدعاء، مع الشكر."], [7, "وسلام الله، الذي تعجز العقول عن إدراكه، يحرس قلوبكم وأفكاركم في المسيح يسوع."], [8, "وختاما، أيها الإخوة: كل ما كان حقا، وكل ما كان شريفا، وكل ما كان عادلا، وكل ما كان طاهرا وكل ما كان مستحبا، وكل ما كان حسن السمعة، وكل ما كان فيه فضيلة وخصلة حميدة، فاشغلوا أفكاركم به."], [9, "واعملوا بها ما تعلمتم وتلقيتم وسمعتم مني وما رأيتم في. وإله السلام يكون معكم."]]}, {"l": "1Th 5:15", "n": "", "vs": [[15, "حذار أن يبادل أحدكم شر غيره بشر مثله بل اسعوا دائما إلى الخير في معاملتكم بعضكم لبعض وللآخرين جميعا."]]}, {"l": "1Th 5:16", "n": "", "vs": [[16, "افرحوا على الدوام؛"]]}, {"l": "1Ti 6:18", "n": "", "vs": [[18, "وأن يفعلوا خيرا، ويكونوا أغنياء بالأعمال الصالحة، ويوزعوا بسخاء، ويكونوا على استعداد دائم لإشراك الآخرين في خيراتهم."]]}], "kwAr": "ليس أفضل لهم", "noteAr": ""}], "arS": [["فأيقنت", ["H3045"]], [" ", []], ["أنه", ["H3588"]], [" ", []], ["ليس", ["H369"]], [" ", []], ["أفضل", ["H2896"]], [" لهم من ", []], ["أن", ["H3588"]], [" ", []], ["يفرحوا", ["H8055"]], [" ", []], ["ويمتعوا", ["H6213"]], [" أنفسهم وهم مازالوا على قيد ", []], ["الحياة", ["H2416"]], [".", []]]}, {"c": 3, "v": 13, "text": "إن من نعم الله على الإنسان أن يأكل ويشرب ويستمتع بما يجنيه من كده.", "groups": [{"kw": "", "raw": "Ecc_2:24, Ecc_5:18-20, Ecc_6:2, Ecc_9:7; Deu_28:30, Deu_28:31, Deu_28:47, Deu_28:48; Jdg_6:3-6; Psa_128:2; Isa_65:21-23", "note": "", "refs": [{"l": "Ecc 2:24", "n": "", "vs": [[24, "فليس أفضل للإنسان من أن يأكل ويشرب ويتمتع بتعب يديه. وهذا أيضا، كما أرى، هو من يد الله."]]}, {"l": "Ecc 5:18-20", "n": "", "vs": [[18, "فتأمل ما وجدت: من الأفضل والأليق أن يأكل الإنسان ويشرب ويستمتع بما تكبده من عناء تحت الشمس طوال أيام حياته القليلة التي وهبها الله له، لأن هذا هو حظه."], [19, "وكل إنسان حباه الله بالثروة، جعله يستمتع بها، ويتنعم بنصيبه منها ليفرح بتعبه. فهذا أيضا عطية الله له."], [20, "عندئذ لا يكثر من ذكر أيام حياته الباطلة لأن الله يلهيه بفرح قلبه."]]}, {"l": "Ecc 6:2", "n": "", "vs": [[2, "إنسان رزقه الله غنى وممتلكات وكرامة، فلم تفتقر نفسه إلى شيء رغبت فيه. ولكن الله لم ينعم عليه بالقدرة على التمتع بها، وإنما تكون من حظ الغريب. هذا باطل، وداء خبيث."]]}, {"l": "Ecc 9:7", "n": "", "vs": [[7, "فامض وتمتع بأكل طعامك، واشرب خمرك بقلب منشرح، لأن الرب قد رضي الآن عن أعمالك."]]}, {"l": "Deu 28:30", "n": "", "vs": [[30, "يخطب أحدكم امرأة ولكن آخر يتزوجها ويضاجعها. تبني بيتا ولا تسكن فيه، وتغرس كرما ولا تجنيه."]]}, {"l": "Deu 28:31", "n": "", "vs": [[31, "يذبح ثورك أمام عينيك ولا تأكل منه، ويغتصب حمارك على مرأى منك ولا يرد إليك، ويستولي أعداؤك على ماشيتك وليس من منقذ."]]}, {"l": "Deu 28:47", "n": "", "vs": [[47, "ولأنكم لم تعبدوا الرب إلهكم بفرح وغبطة في زمن الازدهار والوفرة،"]]}, {"l": "Deu 28:48", "n": "", "vs": [[48, "فإنكم تصبحون عبيدا لأعدائكم الذين يرسلهم الرب عليكم في أحوال الجوع والعطش والعري والفاقة، ويضع نير حديد على أعناقكم حتى يهلككم."]]}, {"l": "Jdg 6:3-6", "n": "", "vs": [[3, "وكلما زرع بنو إسرائيل زرعا جاء الناهبون المديانيون والعمالقة وسواهم من أبناء المشرق لينهبوا محاصيلهم،"], [4, "فيغزونهم ويتلفون غلات أرضهم حتى تخوم غزة ولا يتركون للإسرائيليين ما يقتاتون به، ويستولون أيضا على الغنم والبقر والحمير."], [5, "لأنهم كانوا يغزون البلاد بمواشيهم وخيامهم، فكانوا في كثرة الجراد، لا يحصى لهم ولا لجمالهم عدد، فيغزون الأرض ويتلفونها."], [6, "فأذل المديانيون الإسرائيليين جدا، فاستغاث هؤلاء بالرب."]]}, {"l": "Psa 128:2", "n": "", "vs": [[2, "لأنك تأكل من تعب يديك وتتمتع بالسعادة والخير."]]}, {"l": "Isa 65:21-23", "n": "", "vs": [[21, "يغرس الناس كرومهم ويأكلون ثمارها، ويبنون بيوتهم ويقيمون فيها،"], [22, "لا يبنون ليأتي آخر فيسكن فيها، ولا يغرسون كروما ليجنيها آخر، لأن أيام شعبي تكون مديدة كأيام الشجر، ويتمتع مختاري بعمل أيديهم."], [23, "فهم لن يتعبوا باطلا ولا تنجب نساؤهم أولادا للرعب، لأنهم يكونون ذرية مباركي الرب، ويتبارك أولادهم معهم."]]}], "kwAr": "", "noteAr": ""}], "arS": [["إن من ", []], ["نعم", ["H4991"]], [" ", []], ["الله", ["H430"]], [" على ", []], ["الإنسان", ["H120"]], [" أن ", []], ["يأكل", ["H398"]], [" ", []], ["ويشرب", ["H8354"]], [" ", []], ["ويستمتع", ["H7200"]], [" بما يجنيه من ", []], ["كده", ["H5999"]], [".", []]]}, {"c": 3, "v": 14, "text": "وعلمت أن كل ما يفعله الله يخلد إلى الأبد، لا يضاف عليه شيء أو ينقص منه. وقد أجراه الله ليتقيه الناس.", "groups": [{"kw": "whatsoever", "raw": "Psa_33:11, Psa_119:90, Psa_119:91; Isa_46:10; Dan_4:34, Dan_4:35; Act_2:23, Act_4:28; Rom_11:36; Eph_3:11; Tit_1:2; Jam_1:17", "note": "", "refs": [{"l": "Psa 33:11", "n": "", "vs": [[11, "أما مقاصد الرب فتثبت إلى الأبد، وأفكار قلبه تدوم مدى الدهور."]]}, {"l": "Psa 119:90", "n": "", "vs": [[90, "من جيل إلى جيل أمانتك. أنت أسست الأرض فلن تتزعزع."]]}, {"l": "Psa 119:91", "n": "", "vs": [[91, "بموجب أحكامك تثبت اليوم، لأن الكل خدام لك."]]}, {"l": "Isa 46:10", "n": "", "vs": [[10, "وقد أنبأت بالنهاية منذ البدء، وأخبرت من القدم بأمور لم تكن قد حدثت بعد، قائلا: مقاصدي لابد أن تتم، ومشيئتي لابد أن تتحقق."]]}, {"l": "Dan 4:34", "n": "", "vs": [[34, "وفي ختام السبعة الأزمنة، أنا نبوخذناصر، التفت نحو السماء، فرجع إلي عقلي، وباركت العلي وسبحت وحمدت الحي الأبدي ذا السلطان السرمدي، والذي ملكه على مدى الأجيال."]]}, {"l": "Dan 4:35", "n": "", "vs": [[35, "وعرفت أن كل أهل الأرض لا يحسبون شيئا، وأنه يفعل ما يشاء في جند السماء وسكان الأرض، وليس من يكف يده أو يقول له: ماذا تفعل؟"]]}, {"l": "Act 2:23", "n": "", "vs": [[23, "ومع ذلك فقد سمح الله ، وفقا لمشيئته المحتومة وعلمه السابق، أن تقبضوا عليه وتصلبوه وتقتلوه بأيدي الأثمة."]]}, {"l": "Act 4:28", "n": "", "vs": [[28, "وعملوا به كل ما سبق أن رسمت يدك وقضت مشيئتك أن يكون."]]}, {"l": "Rom 11:36", "n": "", "vs": [[36, "فإن منه وبه وله كل شيء. له المجد إلى الأبد. آمين!"]]}, {"l": "Eph 3:11", "n": "", "vs": [[11, "وفقا للقصد الأزلي الذي قصده الله في المسيح يسوع ربنا،"]]}, {"l": "Tit 1:2", "n": "", "vs": [[2, "في رجاء الحياة الأبدية، التي وعد بها الله المنزه عن الكذب، من قبل أزمنة الأزل،"]]}, {"l": "Jam 1:17", "n": "", "vs": [[17, "إن كل عطية صالحة وهبة كاملة إنما تنزل من فوق، من لدن أبي الأنوار الذي ليس فيه تحول، ولا ظل لأنه لا يدور."]]}], "kwAr": "كل ما يفعله الله", "noteAr": ""}, {"kw": "nothing", "raw": "Psa_76:10; Pro_19:21, Pro_21:30, Pro_30:6; Isa_10:12-15; Dan_8:8, Dan_11:2-4; Joh_19:10, Joh_19:11, Joh_19:28-37; Act_5:39", "note": "", "refs": [{"l": "Psa 76:10", "n": "", "vs": [[10, "حقا يحمدك غضب الإنسان، وما تبقى من الغضب تتمنطق أنت به."]]}, {"l": "Pro 19:21", "n": "", "vs": [[21, "كثيرة هي نوايا قلب الإنسان، إنما مشورة الرب هي التي تسود."]]}, {"l": "Pro 21:30", "n": "", "vs": [[30, "ليس من حكمة، ولا من مشورة، ولا من فطنة بقادر ة على مقاومة الله."]]}, {"l": "Pro 30:6", "n": "", "vs": [[6, "لا تضف على كلامه لئلا يوبخك فتصبح كاذبا."]]}, {"l": "Isa 10:12-15", "n": "", "vs": [[12, "ولكن حالما ينتهي الرب من عمله بجبل صهيون، فإنه سيعاقب ملك أشور على غرور قلبه وتشامخ عينيه،"], [13, "لأنه يقول: بقوة ذراعي قد صنعت هذا، وبحكمتي، لأنني فهيم! قد نقلت تخوم الأمم، ونهبت كنوزهم، وعزلت الجالسين على العروش كما يفعل ذو البطش."], [14, "وكما تستحوذ يد الإنسان على العش، هكذا استحوذت يدي على ثروات الشعوب. وكما يجمع الإنسان البيض المهجور، هكذا جمعت الأرض بأسرها، فلم يجرؤ أحد أن يحرك جناحا أو يفتح فاها أو ينبس بهمسة."], [15, "أتزهو الفأس على من يقطع بها، أم يتعظم المنشار على من ينشر به، وكأن القضيب يحرك رافعه، أو كأن العصا ترفع ما ليس خشبا؟!"]]}, {"l": "Dan 8:8", "n": "", "vs": [[8, "فعظم شأن التيس. وعندما اعتز انكسر القرن العظيم ونبت عوضا عنه أربعة قرون بارزة نحو جهات الأرض الأربع."]]}, {"l": "Dan 11:2-4", "n": "", "vs": [[2, "والآن لأكشفن لك الحقيقة، فها ثلاثة ملوك يتولون حكم فارس، يعقبهم رابع يكون أوفرهم ثراء. وبفضل قوة غناه يثير الجميع على مملكة اليونان."], [3, "ولكن لا يلبث أن يظهر في اليونان ملك عات يتمتع بسلطان عظيم، ويفعل ما يحلو له."], [4, "ولكن في ذروة قوته تنقسم مملكته إلى أربعة أقسام، فلا تكون لعقبه، ولا تكون في مثل قوة ملكه، بل يتولاها آخرون. أما سلطانه فينقرض."]]}, {"l": "Joh 19:10", "n": "", "vs": [[10, "فقال له بيلاطس: «أما تكلمني؟ ألا تعلم أن لي سلطة أن أطلقك، وسلطة أن أصلبك؟»"]]}, {"l": "Joh 19:11", "n": "", "vs": [[11, "فأجابه يسوع «ما كان لك علي سلطة قط، لو لم تكن قد أعطيت لك من فوق. لذلك فالذي سلمني إليك له خطيئة أعظم...»"]]}, {"l": "Joh 19:28-37", "n": "", "vs": [[28, "بعد هذا رأى يسوع أن كل شيء قد اكتمل، فقال: «أنا عطشان»، ليتم ما جاء في الكتاب."], [29, "وكان هناك وعاء مليء بالخل، فغمسوا في الخل إسفنجة وضعوها على زوفا، ورفعوها إلى فمه."], [30, "فلما ذاق يسوع الخل، قال: «قد أكمل!» ثم نكس رأسه وأسلم الروح."], [31, "ولما كان الإعداد يتم في ذلك اليوم، طلب اليهود من بيلاطس أن تكسر سيقان المصلوبين، فتؤخذ جثثهم لئلا تبقى معلقة على الصليب يوم السبت، ولا سيما لأن ذلك السبت كان يوما عظيما."], [32, "فجاء الجنود وكسروا ساقي كلا الرجلين المصلوبين مع يسوع."], [33, "أما يسوع، فلما وصلوا إليه وجدوه قد مات، فلم يكسروا ساقيه."], [34, "وإنما طعنه أحد الجنود بحربة في جنبه، فخرج في الحال دم وماء."], [35, "والذي رأى هذا هو يشهد، وشهادته حق وهو يعلم تماما أنه يقول الحق، لكي تؤمنوا أنتم أيضا."], [36, "وقد حدث هذا ليتم ما جاء في الكتاب: «لن يكسر منه عظم!»"], [37, "وقد جاء أيضا في موضع آخر من الكتاب: «سينظرون إلى ذاك الذي طعنوه»."]]}, {"l": "Act 5:39", "n": "", "vs": [[39, "ولكن إن كان من عند الله فلن تتمكنوا أبدا من الوقوف في وجهه، وإلا جعلتم من أنفسكم أعداء لله أيضا»."]]}], "kwAr": "لا يضاف عليه شيء", "noteAr": ""}, {"kw": "God doeth it", "raw": "Psa_64:9; Isa_59:18, Isa_59:19; Rev_15:4", "note": "", "refs": [{"l": "Psa 64:9", "n": "", "vs": [[9, "فيخاف جميع البشر ويذيعون ما فعله الله ، معتبرين بصنائعه."]]}, {"l": "Isa 59:18", "n": "", "vs": [[18, "فهو يجازيهم بمقتضى أعمالهم. يجازي أعداءه، ويعاقب خصومه، وينزل القصاص بالجزائر،"]]}, {"l": "Isa 59:19", "n": "", "vs": [[19, "فيتقون من المغرب اس
