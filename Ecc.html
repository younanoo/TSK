ups": [{"kw": "", "raw": "Deu_23:22; Pro_20:25; Act_5:4", "note": "", "refs": [{"l": "Deu 23:22", "n": "", "vs": [[22, "وإن لم تنذروا لا تكون عليكم خطيئة."]]}, {"l": "Pro 20:25", "n": "", "vs": [[25, "شرك للإنسان أن يتسرع في النذر للرب ثم يندم على ما نذر."]]}, {"l": "Act 5:4", "n": "", "vs": [[4, "أما كان بقي لك لو لم تبعه؟ وبعد بيعه أما كان لك حق الاحتفاظ بثمنه؟ لماذا قصدت في قلبك أن تغش؟ إنك لم تكذب على الناس، بل على الله!»"]]}], "kwAr": "", "noteAr": ""}], "arS": [["لأنه ", []], ["خير", ["H2896"]], [" أن ", []], ["لا", ["H3808"]], [" ", []], ["تنذر", ["H5087"]], [" ", []], ["من", ["H4480"]], [" أن تنذر ", []], ["ولا", ["H3808"]], [" ", []], ["تفي", ["H7999"]], [".", []]]}, {"c": 5, "v": 6, "text": "لا تدع فمك يجعل جسدك يخطيء، ولا تقل في حضرة المرسل من الله إنه سهو، إذ لماذا يغضب الله على كلامك فيبيد كل عمل يديك؟", "groups": [{"kw": "thy mouth", "raw": "Ecc_5:1, Ecc_5:2; Jam_1:26, Jam_3:2", "note": "", "refs": [{"l": "Ecc 5:1", "n": "", "vs": [[1, "احرص أن تكون قدمك طاهرة عندما تذهب إلى بيت الرب، فإن الدنو للاستماع خير من تقريب ذبيحة الجهال الذين لا يدركون أنهم يرتكبون شرا."]]}, {"l": "Ecc 5:2", "n": "", "vs": [[2, "لا تتسرع في أقوال فمك، ولا يتهور قلبك في نطق كلام لغو أمام الله، فالله في السماء وأنت على الأرض، فلتكن كلماتك قليلة."]]}, {"l": "Jam 1:26", "n": "", "vs": [[26, "وإن ظن أحد أنه متدين، وهو لا يلجم لسانه، فإنه يغش قلبه، وديانته غير نافعة!"]]}, {"l": "Jam 3:2", "n": "", "vs": [[2, "فإننا جميعا معرضون للوقوع في أخطاء كثيرة. ولكن من يلجم لسانه ولا يخطيء في كلامه هو ناضج يقدر أن يسيطر على طبيعته سيطرة تامة."]]}], "kwAr": "فمك", "noteAr": ""}, {"kw": "before", "raw": "Or, before the messenger, hammalach, the priest whose business it was to take cognizance of vows and offerings. Lev_5:4, Lev_5:5; Gen_48:16; Hos_12:4, Hos_12:5; Mal_2:7, Mal_3:1; Act_7:30-35; 1Co_11:10; 1Ti_5:21; Heb_1:14", "note": "Or, before the messenger, hammalach, the priest whose business it was to take cognizance of vows and offerings. Lev_5:4, Lev_5:5; Gen_48:16; Hos_12:4, Hos_12:5; Mal_2:7, Mal_3:1; Act_7:30-35; 1Co_11:10; 1Ti_5:21; Heb_1:14", "refs": [{"l": "Lev 5:4", "n": "", "vs": [[4, "كل من يفرط بشفتيه بحلف، للإحسان أو للإساءة من جميع الأحلاف التي يفرط بها اللسان، من غير علم منه، ثم نبه إلى الأمر، يصبح مذنبا في كلا الحالين."]]}, {"l": "Lev 5:5", "n": "", "vs": [[5, "فكل من يكون مذنبا في أحد هذه الأمور، عليه الإقرار بما أخطأ به،"]]}, {"l": "Gen 48:16", "n": "", "vs": [[16, "الملاك الذي أنقذني من كل شر، يبارك الغلامين، وليدع عليهما اسمي واسما أبوي إبراهيم وإسحق، وليكثرا كثيرا في الأرض»."]]}, {"l": "Hos 12:4", "n": "", "vs": [[4, "تصارع مع الملاك وغلب. بكى والتمس رضاه وبركته، التقاه الله في بيت إيل فخاطبه هناك."]]}, {"l": "Hos 12:5", "n": "", "vs": [[5, "هو الله القدير ويهوه اسمه."]]}, {"l": "Mal 2:7", "n": "", "vs": [[7, "لأن شفتي الكاهن تحفظان العلم، ومن فمه يطلب الناس الشريعة، لأنه رسول الرب القدير."]]}, {"l": "Mal 3:1", "n": "", "vs": [[1, "«ها أنا أرسل رسولي فيمهد الطريق أمامي ويأتي الرب الذي تطلبونه فجأة إلى هيكله ويقبل أيضا ملاك العهد الذي تسرون به» يقول الرب القدير"]]}, {"l": "Act 7:30-35", "n": "", "vs": [[30, "وبعدما مضت أربعون سنة كان موسى في صحراء جبل سيناء، عندما ظهر له ملاك الرب في لهيب نار من عليقة تشتعل"], [31, "وأثار المنظر دهشة موسى، فاقترب ليستطلع الأمر، وإذا صوت الرب يناديه:"], [32, "أنا إله آبائك، إله إبراهيم وإسحاق ويعقوب! فارتعد موسى ولم يعد يجرؤ على أن ينظر."], [33, "فقال له الرب: اخلع نعليك لأن المكان الذي تقف عليه هو أرض مقدسة!"], [34, "إني رأيت العذاب الذي يعانيه شعبي في مصر، وسمعت أنينهم، فنزلت لأنقذهم. والآن، هيا أرسلك إلى مصر!"], [35, "فموسى الذي رفضه شعبه قائلين: من أقامك رئيسا وقاضيا علينا؟ هو نفسه أرسله الله رئيسا ومحررا، يؤيده الملاك الذي ظهر له في العليقة!"]]}, {"l": "1Co 11:10", "n": "", "vs": [[10, "لذا يجب على المرأة أن تضع على رأسها علامة الخضوع، من أجل الملائكة."]]}, {"l": "1Ti 5:21", "n": "", "vs": [[21, "أطلب منك أمام الله والمسيح والملائكة المختارين أن تعمل بهذه التوصيات دون مراعاة أشخاص، فلا تعمل شيئا بتحيز."]]}, {"l": "Heb 1:14", "n": "", "vs": [[14, "لا! فليس الملائكة إلا أرواحا خادمة ترسل لخدمة الذين سيرثون الخلاص."]]}], "kwAr": "في حضرة المرسل", "noteAr": "أو: أمام الملاك، «هملاخ»، أي الكاهن الذي كان من شأنه النظر في النذور والقرابين. انظر لا 5: 4، 5؛ تك 48: 16؛ هو 12: 4، 5؛ ملا 2: 7؛ 3: 1؛ أع 7: 30-35؛ 1كو 11: 10؛ 1تي 5: 21؛ عب 1: 14"}, {"kw": "it was", "raw": "Lev_5:4-6, Lev_27:9, Lev_27:10", "note": "", "refs": [{"l": "Lev 5:4-6", "n": "", "vs": [[4, "كل من يفرط بشفتيه بحلف، للإحسان أو للإساءة من جميع الأحلاف التي يفرط بها اللسان، من غير علم منه، ثم نبه إلى الأمر، يصبح مذنبا في كلا الحالين."], [5, "فكل من يكون مذنبا في أحد هذه الأمور، عليه الإقرار بما أخطأ به،"], [6, "ثم يحضر إلى الرب ذبيحة إثم عن خطيئته التي اقترفها: نعجة أو عنزة، فيكفر الكاهن عن خطيئته."]]}, {"l": "Lev 27:9", "n": "", "vs": [[9, "وإن كان المنذور بهيمة مما يقدمونه قربانا للرب فإن هذه البهيمة تصبح قدسا للرب."]]}, {"l": "Lev 27:10", "n": "", "vs": [[10, "لا يغيره الناذر ولا يبدله جيدا برديء أو رديئا بجيد. وإن استبدل بهيمة بأخرى فإنها تكون هي وبديلها قدسا للرب."]]}], "kwAr": "إنه سهو", "noteAr": ""}, {"kw": "destroy", "raw": "Hag_1:9-11, Hag_2:14-17; 1Co_3:13-15; 2Jo_1:8", "note": "", "refs": [{"l": "Hag 1:9-11", "n": "", "vs": [[9, "لقد توقعتم كثيرا فحصلتم على قليل، وما أتيتم به إلى البيت من غلة نفخت عليه وبددته. لماذا فعلت هذا يقول الرب القدير؟ من أجل بيتي الذي ما برح مهدما بينما كل واحد منكم منهمك في بناء بيته."], [10, "لذلك منعت السماء من فوق عنكم الندى، ومنعت الأرض غلتها."], [11, "وقضيت بالقحط على الأرض والتلال، وعلى حقول الحنطة والكروم، وأشجار الزيتون وعلى كل ما تنتجه الأرض، وعلى الناس والبهائم، وعلى كل تعب أيديكم»."]]}, {"l": "Hag 2:14-17", "n": "", "vs": [[14, "عندئذ قال حجي: «هذا هو حال الشعب، وهذه هي حال الأمة أمامي يقول الرب، فكل أعمال أيديهم وجميع ما يقدمونه نجس."], [15, "والآن تأملوا فيما صنعتم اليوم والأيام السالفة قبل أن تضعوا حجرا فوق حجر لبناء هيكل الرب."], [16, "عندما كان يقبل أحد على كومة حبوب ظنا منه أن الأرض قد غلت عشرين مكيالا، يجد أنها لم تغل سوى عشرة فقط. وحين يدنو من المعصرة ليغرف ملء خمسين وعاء، لا يجد إلا عشرين."], [17, "إني ابتليت تعب أيديكم بالقحط والذبول والبرد، ولكنكم لم ترجعوا تائبين إلي، يقول الرب."]]}, {"l": "1Co 3:13-15", "n": "", "vs": [[13, "فعمل كل واحد سينكشف علنا إذ يظهره ذلك اليوم الذي سيعلن في نار، وسوف تمتحن النار قيمة عمل كل واحد."], [14, "فمن بقي عمله الذي بناه على الأساس، ينال أجرا."], [15, "ومن احترق عمله، يخسر، إلا أنه هو سيخلص؛ ولكن كمن يمر في النار."]]}, {"l": "2Jo 1:8", "n": "", "vs": [[8, "فانتبهوا لأنفسكم، لكي لا يضيع الجهد الذي بذلناه في سبيلكم، بل لتنالوا أجركم كاملا."]]}], "kwAr": "فيبيد", "noteAr": ""}], "arS": [["لا", ["H408"]], [" تدع ", []], ["فمك", ["H6310"]], [" ", []], ["يجعل", ["H5414"]], [" ", []], ["جسدك", ["H1320"]], [" ", []], ["يخطيء", ["H2398"]], ["، ", []], ["ولا", ["H408"]], [" ", []], ["تقل", ["H559"]], [" ", []], ["في", ["H3027"]], [" ", []], ["حضرة", ["H6440"]], [" ", []], ["المرسل", ["H4397"]], [" ", []], ["من", ["H5921"]], [" ", []], ["الله", ["H430"]], [" ", []], ["إنه", ["H3588"]], [" ", []], ["سهو", ["H7684"]], ["، إذ ", []], ["لماذا", ["H4100"]], [" ", []], ["يغضب", ["H7107"]], [" الله على ", []], ["كلامك", ["H6963"]], [" ", []], ["فيبيد", ["H2254"]], [" كل ", []], ["عمل", ["H4639"]], [" يديك؟", []]]}, {"c": 5, "v": 7, "text": "لأن في كثرة الأحلام أباطيل، وكذلك في اللغو المفرط؛ فاتق الله .", "groups": [{"kw": "in the", "raw": "Ecc_5:3; Mat_12:36", "note": "", "refs": [{"l": "Ecc 5:3", "n": "", "vs": [[3, "فكما تراود الأحلام النائم من كثرة العناء، كذلك أقوال الجهل تصدر عن الإفراط في الكلام."]]}, {"l": "Mat 12:36", "n": "", "vs": [[36, "على أني أقول لكم: إن كل كلمة باطلة يتكلم بها الناس، سوف يؤدون عنها الحساب في يوم الدينونة."]]}], "kwAr": "في كثرة الأحلام", "noteAr": ""}, {"kw": "but", "raw": "Ecc_7:18, Ecc_8:12, Ecc_12:13; Pro_23:17; Isa_50:10, Isa_50:11", "note": "", "refs": [{"l": "Ecc 7:18", "n": "", "vs": [[18, "حسن أن تتشبث بهذا وأن لا تفرط في ذاك، لأن متقي الله يتفادى التطرف في كليهما."]]}, {"l": "Ecc 8:12", "n": "", "vs": [[12, "ومع أن الخاطيء يرتكب الشر مئة مرة وتطول أيامه، إلا أنني أعلم أنه يكون خير لمتقي الله الذين يخشعون في حضرته."]]}, {"l": "Ecc 12:13", "n": "", "vs": [[13, "فلنسمع ختام الكلام كله: اتق الله ، واحفظ وصاياه، لأن هذا هو كل واجب الإنسان،"]]}, {"l": "Pro 23:17", "n": "", "vs": [[17, "لا يغر قلبك من الخطاة، بل واظب على تقوى الرب اليوم كله،"]]}, {"l": "Isa 50:10", "n": "", "vs": [[10, "من منكم يتقي الرب ويطيع صوت خادمه؟ من الذي يسلك في الظلمة من غير نور؟ فليتكل على اسم الرب ويعتمد على إلهه."]]}, {"l": "Isa 50:11", "n": "", "vs": [[11, "انظروا، ياجميع موقدي النار، الذين يضيئون لأنفسهم مشاعل، سيروا في نور نيرانكم، وعلى وهج مشاعلكم التي أوقدتموها، وهذا ما تنالونه من يدي؛ تضطجعون وأنتم تتضورون من الألم."]]}], "kwAr": "فاتق الله", "noteAr": ""}], "arS": [["لأن", ["H3588"]], [" في ", []], ["كثرة", ["H7230", "H7235"]], [" ", []], ["الأحلام", ["H2472"]], [" ", []], ["أباطيل", ["H1892"]], ["، ", []], ["وكذلك", ["H3588"]], [" في ", []], ["اللغو", ["H1697"]], [" المفرط؛ ", []], ["فاتق", ["H3372"]], [" ", []], ["الله", ["H430"]], [" .", []]]}, {"c": 5, "v": 8, "text": "إن شهدت في البلاد الفقير مظلوما، والحق والعدل مزهوقين فلا تعجب من الأمر، فإن فوق المسئول الكبير مسئولا أعلى منه رتبة يراقبه وفوقهما من هو أعظم مقاما منهما.", "groups": [{"kw": "thou seest", "raw": "Ecc_3:16, Ecc_4:1; Psa_12:5, Psa_55:9, Psa_58:11; Pro_8:17; Hab_1:2, Hab_1:3, Hab_1:13", "note": "", "refs": [{"l": "Ecc 3:16", "n": "", "vs": [[16, "ورأيت أيضا تحت الشمس: الجور في موضع العدل، والظلم في موضع الحق."]]}, {"l": "Ecc 4:1", "n": "", "vs": [[1, "ثم تأملت حولي فرأيت جميع المظالم التي ترتكب تحت الشمس. شهدت دموع المظلومين الذين لا معزي لهم، أما ظالموهم فيتمتعون بالقوة، غير أن المظلومين لا معزي لهم."]]}, {"l": "Psa 12:5", "n": "", "vs": [[5, "ولكن الرب يقول: إنقاذا للمساكين، واستجابة لتنهدات المظلومين، أهب الآن لأفرج كربة المتضايقين."]]}, {"l": "Psa 55:9", "n": "", "vs": [[9, "بلبل ألسنة (أعدائي) يارب وأبكمهم، فإني أرى في المدينة عنفا وعدوانا،"]]}, {"l": "Psa 58:11", "n": "", "vs": [[11, "فيقول الناس: «حقا إن للصديق مكافأة، وإن في الأرض إلها يقضي»."]]}, {"l": "Pro 8:17", "n": "", "vs": [[17, "أحب من يحبونني، ومن يجد في البحث عني يعثر علي."]]}, {"l": "Hab 1:2", "n": "", "vs": [[2, "إلى متى يارب أستغيث وأنت لا تستجيب؟ وأصرخ إليك مستجيرا من الظلم وأنت لا تخلص؟"]]}, {"l": "Hab 1:3", "n": "", "vs": [[3, "لماذا تريني الإثم، وتتحمل رؤية الظلم؟ أينما تلفت أشهد أمامي جورا واغتصابا، ويثور حولي خصام ونزاع."]]}, {"l": "Hab 1:13", "n": "", "vs": [[13, "إن عينيك أطهر من أن تشهدا الشر، وأنت لا تطيق رؤية الظلم، فكيف تحتمل مشاهدة الأثمة، وتصمت عندما يبتلع المنافقون من هم أبر منهم؟"]]}], "kwAr": "إن شهدت", "noteAr": ""}, {"kw": "marvel", "raw": "Zec_8:6; 1Jo_3:13; Rev_17:6, Rev_17:7", "note": "", "refs": [{"l": "Zec 8:6", "n": "", "vs": [[6, "فإن كان هذا الأمر عجيبا في أعين البقية الناجية من هذا الشعب، أيكون عجيبا في عيني الرب؟"]]}, {"l": "1Jo 3:13", "n": "", "vs": [[13, "إذن، ياإخوتي، لا تتعجبوا إن كان أهل العالم يبغضونكم!"]]}, {"l": "Rev 17:6", "n": "", "vs": [[6, "ورأيت المرأة سكرى لكثرة ما شربت من دم القديسين، ودم شهداء يسوع الذين قتلتهم. فتملكتني الدهشة لمنظرها،"]]}, {"l": "Rev 17:7", "n": "", "vs": [[7, "فسألني الملاك: «لماذا دهشت؟ سأطلعك على ما ترمز إليه المرأة والوحش الذي يحملها، صاحب الرؤوس السبعة والقرون العشرة:"]]}], "kwAr": "فلا تعجب", "noteAr": ""}, {"kw": "matter", "raw": "Heb. will, or purpose, Isa_10:5-7, Isa_10:12, Isa_46:10, Isa_46:11; Hab_1:12; Act_4:27, Act_4:28; Rom_11:33", "note": "Heb. will, or purpose, Isa_10:5-7, Isa_10:12, Isa_46:10, Isa_46:11; Hab_1:12; Act_4:27, Act_4:28; Rom_11:33", "refs": [{"l": "Isa 10:5-7", "n": "", "vs": [[5, "ويل للأشوريين، قضيب غضبي، الحاملين في أيديهم عصا سخطي."], [6, "أرسلهم ضد أمة منافقة، وأوصيهم على شعبي الذي غضبت عليه، ليغنموا غنائمهم ويستولوا على أسلابهم، ويطأوهم كما يطأون الوحل."], [7, "ولكن ملك أشور لا يعرف أنني أنا الذي أرسلته، ويظن أنه بقدرته قد هاجم شعبي، وفي نيته أن يدمر ويجتاح أمما كثيرة."]]}, {"l": "Isa 10:12", "n": "", "vs": [[12, "ولكن حالما ينتهي الرب من عمله بجبل صهيون، فإنه سيعاقب ملك أشور على غرور قلبه وتشامخ عينيه،"]]}, {"l": "Isa 46:10", "n": "", "vs": [[10, "وقد أنبأت بالنهاية منذ البدء، وأخبرت من القدم بأمور لم تكن قد حدثت بعد، قائلا: مقاصدي لابد أن تتم، ومشيئتي لابد أن تتحقق."]]}, {"l": "Isa 46:11", "n": "", "vs": [[11, "أدعو من المشرق الطائر الجارح، ومن الأرض البعيدة رجل مشورتي. قد نطقت بقضائي ولابد أن أجريه، وما رسمته من خطة لابد أن أنفذه."]]}, {"l": "Hab 1:12", "n": "", "vs": [[12, "ألست أنت منذ الأزل أيها الرب إلهي، قدوسي؟ لهذا لن نفنى. لقد أقمت الكلدانيين لمقاضاتنا واخترتهم ياصخرتي لتعاقبنا."]]}, {"l": "Act 4:27", "n": "", "vs": [[27, "وقد تحققت هذه الكلمات فعلا، إذ تحالف هيرودس، وبيلاطس البنطي، والوثنيون وأسباط إسرائيل، لمقاومة فتاك القدوس يسوع، الذي جعلته مسيحا،"]]}, {"l": "Act 4:28", "n": "", "vs": [[28, "وعملوا به كل ما سبق أن رسمت يدك وقضت مشيئتك أن يكون."]]}, {"l": "Rom 11:33", "n": "", "vs": [[33, "فما أعمق غنى الله وحكمته وعلمه! ما أبعد أحكامه عن الفحص وطرقه عن التتبع !"]]}], "kwAr": "من الأمر", "noteAr": "بالعبرانية: مشيئة، أو قصد. انظر إش 10: 5-7، 12؛ 46: 10، 11؛ حب 1: 12؛ أع 4: 27، 28؛ رو 11: 33"}, {"kw": "for", "raw": "Isa_57:15; Luk_1:32, Luk_1:35, Luk_1:76", "note": "", "refs": [{"l": "Isa 57:15", "n": "", "vs": [[15, "لأنه هكذا يقول العلي السامي، المقيم في الأبد، الذي يدعى اسمه القدوس: إنني أسكن في العلى وفي الموضع المقدس، وأقيم مع المنسحق، وذوي الروح المتواضعة، لأحيي أرواح المتواضعين، وأنعش قلوب المنسحقين."]]}, {"l": "Luk 1:32", "n": "", "vs": [[32, "إنه يكون عظيما، وابن العلي يدعى، ويمنحه الرب الإله عرش داود أبيه،"]]}, {"l": "Luk 1:35", "n": "", "vs": [[35, "فأجابها الملاك: «الروح القدس يحل عليك، وقدرة العلي تظللك. لذلك أيضا فالقدوس المولود منك يدعى ابن الله."]]}, {"l": "Luk 1:76", "n": "", "vs": [[76, "وأنت، أيها الطفل، سوف تدعى نبي العلي، لأنك ستتقدم أمام الرب لتعد طرقه،"]]}], "kwAr": "فإن فوق المسئول", "noteAr": ""}, {"kw": "regardeth", "raw": "1Ki_21:19, 1Ki_21:20; Job_20:19-29, 27:8-23; Psa_10:17, Psa_10:18, Psa_12:5, Psa_58:10, Psa_58:11; Psa_82:1, Psa_83:18, Psa_140:11, Psa_140:12; Isa_3:15, Isa_5:7, Isa_59:13-16; Jer_22:17-19; Eze_22:6-14; Amo_5:12, Amo_6:2-6, Amo_6:12, Amo_8:4-7; Mic_2:1-3, Mic_2:9, Mic_3:1-4, Mic_3:9-12; Mic_6:10-13; Zec_7:9-13; Mal_3:5; Jam_2:13, Jam_5:2-7", "note": "", "refs": [{"l": "1Ki 21:19", "n": "", "vs": [[19, "وقل له: هذا ما يقوله الرب: هل قتلت وامتلكت أيضا؟ في المكان الذي لعقت فيه الكلاب دم نابوت تلعق الكلاب دمك أيضا»."]]}, {"l": "1Ki 21:20", "n": "", "vs": [[20, "وما إن رأى أخآب إيليا حتى قال: «هل وجدتني ياعدوي؟» فأجابه: «قد وجدتك لأنك بعت نفسك لارتكاب الشر في عيني الرب."]]}, {"l": "Job 20:19-29", "n": "", "vs": [[19, "لأنه هضم حق الفقراء وخذلهم وسلب بيوتا لم يبنها."], [20, "وإذ لا يعرف طمعه قناعة، فإنه لن يدخر شيئا يستمتع به."], [21, "لم يبق نهمه على شيء، لذلك لن يدوم خيره."], [22, "في وفرة سعته يصيبه الضنك، وتحل به أقسى الكوارث."], [23, "وعندما يملأ بطنه ينفث عليه الله غضبه الحارق ويمطره عليه طعاما له."], [24, "إن فر من آلة حرب من حديد، تخترقه قوس النحاس."], [25, "اخترقته عميقا وخرجت من جسده، ونفذ حدها اللامع من مرارته، وحل به رعب."], [26, "كل ظلمة تتربص بذخائره، وتأكله نار لم تنفخ، وتلتهم ما بقي من خيمته."], [27, "تفضح السماوات إثمه، وتتمرد الأرض عليه،"], [28, "تفنى مدخرات بيته وتحترق في يوم غضب الرب."], [29, "هذا هو المصير الذي يعده الله للأشرار، والميراث الذي كتبه الله لهم»."]]}, {"l": "Job 27:8-23", "n": "", "vs": [[8, "إذ ما هو رجاء الفاجر عندما يستأصله الله ويزهق أنفاسه؟"], [9, "هل يستمع الله إلى صرخته إذا حل به ضيق؟"], [10, "هل يسر بالقدير ويستغيث به في كل الأزمنة؟"], [11, "إني أعلمكم عن قوة الله، ولا أكتم عنكم ما لدى القدير."], [12, "فأنتم جميعا قد عاينتم ذلك بأنفسكم، فما بالكم تنطقون بالباطل قائلين:"], [13, "هذا هو نصيب الشرير عند الله والميراث الذي يناله الظالم من القدير."], [14, "إن تكاثر بنوه فليكونوا طعاما للسيف، ونسله لا يشبع خبزا."], [15, "ذريته تموت بالوبأ، وأراملهم لا تنوح عليهم."], [16, "إن جمع فضته كأكوام التراب، وكوم ملابس كالطين،"], [17, "فإن ما يعده من ثياب يرتديه الصديق، والبريء يوزع الفضة."], [18, "يبني بيته كبيت العنكبوت، أو كمظلة صنعها حارس الكروم."], [19, "يضطجع غنيا ويستيقظ معدما. يفتح عينيه وإذا بثروته قد تلاشت."], [20, "يطغى عليه رعب كفيضان، وتخطفه في الليل زوبعة."], [21, "تطوح به الريح الشرقية فيختفي وتقتلعه من مكانه."], [22, "تطبق عليه من غير رحمة وهو هارب من وجه عنفوانها."], [23, "تصفر الريح عليه، وترعبه بقوتها المدمرة."]]}, {"l": "Psa 10:17", "n": "", "vs": [[17, "أنت يارب تستجيب طلبة الودعاء، تشدد قلوبهم إذ تصغي (إلى تأوهاتهم)."]]}, {"l": "Psa 10:18", "n": "", "vs": [[18, "تنصف اليتيم والمقهور، فلا يعود إنسان في الأرض يرعبهم."]]}, {"l": "Psa 12:5", "n": "", "vs": [[5, "ولكن الرب يقول: إنقاذا للمساكين، واستجابة لتنهدات المظلومين، أهب الآن لأفرج كربة المتضايقين."]]}, {"l": "Psa 58:10", "n": "", "vs": [[10, "يفرح الأبرار حين يرون عقاب الأشرار، ويغسلون أقدامهم بدمهم."]]}, {"l": "Psa 58:11", "n": "", "vs": [[11, "فيقول الناس: «حقا إن للصديق مكافأة، وإن في الأرض إلها يقضي»."]]}, {"l": "Psa 82:1", "n": "", "vs": [[1, "الله يترأس ساحة قضائه، وعلى القضاة يصدر حكما."]]}, {"l": "Psa 83:18", "n": "", "vs": [[18, "ويعلموا أنك أنت وحدك، يهوه العلي على الأرض كلها."]]}, {"l": "Psa 140:11", "n": "", "vs": [[11, "لا تدع ذا اللسان السليط يثبت في الأرض: فالشر يتصيد رجل الظلم ليهلكه."]]}, {"l": "Psa 140:12", "n": "", "vs": [[12, "قد علمت أن الرب ينصف دعوى المساكين ويحكم بالحق للمحتاجين."]]}, {"l": "Isa 3:15", "n": "", "vs": [[15, "فماذا تقصدون من سحق شعبي وطحن وجوه البائسين؟»"]]}, {"l": "Isa 5:7", "n": "", "vs": [[7, "لأن كرم الرب القدير هو بيت إسرائيل، ورجال يهوذا هم غرس بهجته. ولكن عندما انتظر حقا وجد سفك دماء، وعندما التمس عدلا رأى صراخا."]]}, {"l": "Isa 59:13-16", "n": "", "vs": [[13, "تمردنا وتنكرنا للرب. ارتددنا عن اتباع طرق إلهنا، تفوهنا بالظلم والعصيان افتراء، وبكلام زور من القلب."], [14, "قد ارتد عنا الإنصاف، ووقف العدل بعيدا، إذ سقط الحق صريعا في الشوارع، والبر لم يستطع الدخول."], [15, "أضحى الحق مفقودا، والحائد عن الشر ضحية. رأى الرب ذلك فأسخطه فقدان الإنصاف."], [16, "وإذ لم يجد إنسانا ينتصر للحق، وأدهشه أن لا يرى شفيعا، أحرزت له ذراعه انتصارا، وعضده بره."]]}, {"l": "Jer 22:17-19", "n": "", "vs": [[17, "«أما أنت فعيناك وقلبك متهافتة على الربح الحرام، وعلى سفك الدم البريء، وعلى الظلم والابتزاز»."], [18, "لذلك هذا ما يقوله الرب عن يهوياقيم بن يوشيا، ملك يهوذا: «لن يندبك أحد قائلا: آه ياأخي أو آه ياأختي، أو يندبون عليه قائلين: آواه ياسيدي، أو آه على جلاله."], [19, "بل يدفن دفن حمار، مجرورا ومطروحا خارج بوابات أورشليم»."]]}, {"l": "Eze 22:6-14", "n": "", "vs": [[6, "هوذا كل واحد من رؤساء إسرائيل ممن كانوا فيك انهمك في سفك الدماء على قدر طاقته."], [7, "فيك استخفوا بأب وأم وجاروا في وسطك على الغريب، واضطهدوا اليتيم والأرملة،"], [8, "احتقرت مقدساتي ونجست أيام سبوتي."], [9, "أقام فيك وشاة عملوا على سفك الدم، وأكلوا أمام الأصنام على الجبال، وارتكبوا في وسطك الموبقات."], [10, "فيك فضح الإنسان عري أبيه، وفيك أذلوا من برحت متنجسة بطمثها."], [11, "فيك إنسان زنى مع امرأة قريبه، واقترف إنسان الرذيلة مع كنته، وفيك ضاجع إنسان أخته ابنة أبيه."], [12, "فيك أخذوا الرشوة لقاء سفك الدماء. أخذت الربا ومال الحرام، وسلبت أقرباءك ظلما ونسيتني، يقول السيد الرب."], [13, "ها أنا قد صفقت بكفي من جراء ما حصلت عليه من ربح حرام، وما سفك من دم في وسطك."], [14, "فهل يصمد قلبك أو تحتفظ يداك بقوتهما في الأيام التي فيها أتعامل معك؟ أنا الرب قد تكلمت وأتمم ما أنطق به."]]}, {"l": "Amo 5:12", "n": "", "vs": [[12, "لأنني عالم بكثرة معاصيكم وعظم خطاياكم، إذ أنكم تضايقون البار أيها المرتشون الذين تصدون المسكين عن حقه في ساحة القضاء."]]}, {"l": "Amo 6:2-6", "n": "", "vs": [[2, "توجهوا إلى مدينة كلنة وتأملوا، ثم انتقلوا إلى حماة العظيمة، ومنها انحدروا إلى جت مدينة الفلسطينيين. هل هي خير من هذه الممالك أم تخومهم أعظم من تخومكم؟"], [3, "أنتم يامن تتجاهلون يوم السوء وتقربون كرسي الظلم."], [4, "ويل للراقدين فوق أسرة من عاج، المسترخين فوق الأرائك، الآكلين لحم خيرة الحملان والعجول المختارة من وسط المعلف."], [5, "المغنين على صوت الرباب، المخترعين لأنفسهم آلات غناء كداود."], [6, "الشاربين خمرا في كؤوس، المتطيبين بأفضل العطور، ولا يكتئبون على خراب يوسف."]]}, {"l": "Amo 6:12", "n": "", "vs": [[12, "أتجري الخيول على الصخور؟ وهل يحرث البحر بثيران؟ لقد حولتم الحق سما زعافا، وثمار البر مرارة."]]}, {"l": "Amo 8:4-7", "n": "", "vs": [[4, "استمعوا هذا أيها الدائسون على البائسين، يامن حاولتم أن تقضوا على فقراء الأرض،"], [5, "قائلين: «متى ينقضي أول الشهر حتى نبيع الحنطة؟ متى يمضي السبت لنعرض القمح في السوق، فنعمد إلى تصغير حجم مكيال الإيفة ونرفع الأسعار، ونستعمل ميزانا مغشوشا."], [6, "لنشتري المسكين بقطعة من الفضة، والبائس بنعلين، ونبيع نفاية القمح؟»"], [7, "قد أقسم الرب بعزة يعقوب قائلا: «لن أنسى شيئا من مساوئهم."]]}, {"l": "Mic 2:1-3", "n": "", "vs": [[1, "ويل للمتآمرين بالسوء، الذين يحوكون الشر وهم في مضاجعهم، الذين ينفذون عند طلوع الصباح ما خططوا له، لأن ذلك في متناول قدرتهم."], [2, "يشتهون حقولا ويغتصبونها، وبيوتا فيستولون عليها. يجورون على الرجل وعلى بيته والإنسان وميراثه."], [3, "لهذا، هكذا يقول الرب. ها أنا أدبر شرا لهذا الشعب تعجزون عن فك رقابكم منه، ولن تمشوا بعد متشامخين لأن الزمن يكون زمن سوء."]]}, {"l": "Mic 2:9", "n": "", "vs": [[9, "تطردون أرامل شعبي من بيوتهن، وتجردون أطفال كل منهن من عطاياي إلى الأبد."]]}, {"l": "Mic 3:1-4", "n": "", "vs": [[1, "وقلت اسمعوا يارؤساء يعقوب وياقضاة شعب إسرائيل: ألا ينبغي لكم أن تعرفوا الحق؟"], [2, "أنتم يامن تبغضون الخير وتحبون الشر، وتسلخون جلود شعبي وتجردون لحومهم عن عظامهم."], [3, "الذين تأكلون لحوم شعبي، وتسلخون جلودهم عنهم وتهشمون عظامهم، وتقطعونهم كما يقطع اللحم في القدر، أو كاللحم المعد للمقلى."], [4, "ثم حين تستغيثون بالرب لا يستجيب ويحجب وجهه عنكم في ذلك الوقت بسبب ما ارتكبتموه من أعمال شريرة."]]}, {"l": "Mic 3:9-12", "n": "", "vs": [[9, "استمعوا هذا يارؤساء بيت يعقوب وقضاة شعب إسرائيل الذين يكرهون العدل ويحرفون الحق."], [10, "الذين يبنون صهيون بالدم وأورشليم بالظلم."], [11, "إذ يحكم رؤساؤها بالرشوة، وكهنتها يعلمون بالأجرة ويتعاطى أنبياؤها العرافة لقاء المال، ومع ذلك يدعون الاتكال على الله قائلين: «أليس الرب في وسطنا؟ لذلك لن يصيبنا مكروه»."], [12, "لهذا من جراء أعمالكم ستحرث صهيون كالحقل وتصبح أورشليم كومة من الخرائب، وجبل الهيكل مرتفعا تنمو عليه أشجار الغاب."]]}, {"l": "Mic 6:10-13", "n": "", "vs": [[10, "في بيوت الأشرار كنوز مسروقة وموازين مغشوشة."], [11, "فكيف أبرىء ذا المعايير المغشوشة، صاحب كيس الموازين الناقصة؟"], [12, "قد امتلأ أثرياء المدينة ظلما، ونطق سكانها بالكذب وألسنة الغش في أفواههم"], [13, "لذلك شرعت في تدميرك لأجعلك خرابا من أجل خطاياك."]]}, {"l": "Zec 7:9-13", "n": "", "vs": [[9, "«هذا ما يقوله الرب القدير، اقضوا بالعدل، وليبد كل منكم إحسانا ورحمة لأخيه."], [10, "ولا تجوروا على الأرملة واليتيم والغريب والمسكين، ولا يضمر أحدكم شرا في قلبه لأخيه."], [11, "ولكنهم أبوا أن يصغوا، واعتصموا بعنادهم غير عابئين، وأصموا آذانهم لئلا يسمعوا."], [12, "وقسوا قلوبهم كالصوان لئلا يسمعوا الشريعة التي أرسلها الرب القدير بروحه على لسان أنبيائه السابقين. فانصب غضب عظيم من لدن الرب القدير."], [13, "وكما ناديت فلم يسمعوا فإني أنا أيضا لا أسمع، يقول الرب القدير."]]}, {"l": "Mal 3:5", "n": "", "vs": [[5, "وأقترب منكم لأكون شاهدا سريعا ضد السحرة والزناة والحالفين بالزور والمستغلين لأجرة العامل ومضطهدي الأرامل والأيتام، والذين يظلمون الغرباء ولا يخافونني"]]}, {"l": "Jam 2:13", "n": "", "vs": [[13, "فلابد أن يكون الحكم على الذين لا يمارسون الرحمة، حكما خاليا من الرحمة، أما الرحمة فهي تتفوق على الحكم!"]]}, {"l": "Jam 5:2-7", "n": "", "vs": [[2, "إن ثرواتكم الكثيرة قد فسدت، وثيابكم الفاخرة قد أكلها العث"], [3, "ذهبكم وفضتكم قد تآكلا، وسيكون تآكلهما شاهدا ضدكم، ويأكل لحمكم كنار جمعتموها ثروة للأيام الأخيرة؟"], [4, "وهذه أجرة العمال الذين حصدوا حقولكم، تلك الأجرة التي مازلتم تحبسونها عنهم ظلما، إنها تصرخ، وصراخ أولئك العمال أنفسهم قد سمعه رب الجنود!"], [5, "أنتم تعيشون على الأرض عيشة رفاهية وانصراف إلى المباهج واللذات؛ وقد أصبحت قلوبكم سمينة كأنها جاهزة ليوم الذبح."], [6, "والبريء حكمتم عليه وقتلتموه، وهو لا يقاومكم!"], [7, "وأما أنتم، ياإخوتي، فاصبروا منتظرين عودة الرب. خذوا العبرة من الفلاح: فهو ينتظر أن تعطيه الأرض غلالا ثمينة، صابرا على الزرع حتى يشرب من مطر الخريف ومطر الربيع."]]}], "kwAr": "يراقبه", "noteAr": ""}, {"kw": "higher than they", "raw": "1Ch_21:15, 1Ch_21:16; Psa_95:3; Isa_37:36; Mat_13:41, Mat_13:42; Act_12:7-10, Act_12:23", "note": "", "refs": [{"l": "1Ch 21:15", "n": "", "vs": [[15, "وأمر الرب ملاكه بإهلاك أورشليم. وفيما هو يقوم بالقضاء عليها رأى الرب ما يصيبها، فأشفق عليها بسبب ما حل بها من شر، وقال للملاك المهلك: «كف يدك عنها». وكان ملاك الرب واقفا آنئذ عند بيدر أرنان اليبوسي."]]}, {"l": "1Ch 21:16", "n": "", "vs": [[16, "وتلفت داود حوله فرأى ملاك الرب منتصبا بين الأرض والسماء، وقد شهر سيفه بيده ومده نحو أورشليم. فارتدى هو والشيوخ المسوح وسجدوا بوجوههم إلى الأرض."]]}, {"l": "Psa 95:3", "n": "", "vs": [[3, "لأن الرب إله عظيم، وملك كبير على جميع الآلهة."]]}, {"l": "Isa 37:36", "n": "", "vs": [[36, "وحدث في تلك الليلة أن ملاك الرب قتل مئة وخمسة وثمانين ألفا من جيش الأشوريين، وما إن طلع الصباح حتى كانت جثث القتلى تملأ المكان"]]}, {"l": "Mat 13:41", "n": "", "vs": [[41, "يرسل ابن الإنسان ملائكته، فيخرجون من ملكوته جميع المفسدين ومرتكبي الإثم،"]]}, {"l": "Mat 13:42", "n": "", "vs": [[42, "ويطرحونهم في أتون النار، هناك يكون البكاء وصرير الأسنان."]]}, {"l": "Act 12:7-10", "n": "", "vs": [[7, "وفجأة حضر ملاك من عند الرب، فامتلأت غرفة السجن نورا. وضرب الملاك بطرس على جنبه وأيقظه وقال: «قم سريعا!» فسقطت السلسلتان من يديه."], [8, "فقال له الملاك: «شد حزامك، والبس حذاءك!» ففعل. ثم قال له: «البس رداءك واتبعني!»"], [9, "فخرج بطرس يتبع الملاك وهو يظن أنه يرى رؤيا، ولا يدري أن ما يجري على يد الملاك أمر حقيقي."], [10, "واجتازا نقطة الحراسة الأولى ثم الثانية. ولما وصلا إلى باب السجن الحديدي الذي يؤدي إلى المدينة انفتح لهما من ذاته، فخرجا. وبعدما عبرا شارعا واحدا، فارقه الملاك حالا."]]}, {"l": "Act 12:23", "n": "", "vs": [[23, "فضربه ملاك من عند الرب في الحال لأنه لم يعط المجد لله، فأكله الدود ومات!"]]}], "kwAr": "أعظم مقاما منهما", "noteAr": ""}], "arS": [["إن", ["H3588"]], [" ", []], ["شهدت", ["H7200"]], [" في ", []], ["البلاد", ["H4082"]], [" ", []], ["الفقير", ["H7326"]], [" ", []], ["مظلوما", ["H6233"]], ["، ", []], ["والحق", ["H4941"]], [" ", []], ["والعدل", ["H6664"]], [" ", []], ["مزهوقين", ["H1499"]], [" ", []], ["فلا", ["H408"]], [" ", []], ["تعجب", ["H8539"]], [" ", []], ["من", ["H4480"]], [" ", []], ["الأمر", ["H2656"]], ["، ", []], ["فإن", ["H518"]], [" ", []], ["فوق", ["H5921"]], [" المسئول الكبير مسئولا ", []], ["أعلى", ["H1364"]], [" ", []], ["منه", ["H5921"]], [" رتبة ", []], ["يراقبه", ["H8104"]], [" وفوقهما ", []], ["من", ["H5921"]], [" هو ", []], ["أعظم", ["H1364"]], [" مقاما منهما.", []]]}, {"c": 5, "v": 9, "text": "وغلة الأرض يستفيد منها الكل، والأرض المفلوحة ذات جدوى للملك.", "groups": [{"kw": "the profit", "raw": "Gen_1:29, Gen_1:30, Gen_3:17-19; Psa_104:14, Psa_104:15, Psa_115:16; Pro_13:23, Pro_27:23-27; Pro_28:19; Jer_40:10-12", "note": "", "refs": [{"l": "Gen 1:29", "n": "", "vs": [[29, "ثم قال لهم: «إني قد أعطيتكم كل أصناف البقول المبزرة المنتشرة على كل سطح الأرض، وكل شجر مثمر مبزر، لتكون لكم طعاما."]]}, {"l": "Gen 1:30", "n": "", "vs": [[30, "أما العشب الأخضر فقد جعلته طعاما لكل من وحوش الأرض وطيور السماء والحيوانات الزاحفة، ولكل ما فيه نسمة حياة». وهكذا كان."]]}, {"l": "Gen 3:17-19", "n": "", "vs": [[17, "وقال لآدم: «لأنك أذعنت لقول امرأتك، وأكلت من الشجرة التي نهيتك عنها، فالأرض ملعونة بسببك وبالمشقة تقتات منها طوال عمرك."], [18, "شوكا وحسكا تنبت لك، وأنت تأكل عشب الحقل."], [19, "بعرق جبينك تكسب عيشك حتى تعود إلى الأرض، فمن تراب أخذت، وإلى تراب تعود»."]]}, {"l": "Psa 104:14", "n": "", "vs": [[14, "أنت المنبت عشبا للبهائم وخضرة لخدمة الإنسان، لإنتاج خبز من الأرض،"]]}, {"l": "Psa 104:15", "n": "", "vs": [[15, "وخمر تفرح قلب الإنسان وتورد وجهه فيلمع كبريق الزيت، وخبز يسند قلبه."]]}, {"l": "Psa 115:16", "n": "", "vs": [[16, "السماوات للرب وحده، أما الأرض فوهبها لبني آدم."]]}, {"l": "Pro 13:23", "n": "", "vs": [[23, "قد ينتج حقل الفقير المحروث وفرة من الغلال، إنما يتلفها سوء التبصر."]]}, {"l": "Pro 27:23-27", "n": "", "vs": [[23, "اجتهد في معرفة أحوال غنمك، واحرص كل الحرص على قطعانك."], [24, "لأن الغنى لا يدوم إلى الأبد، ولا يخلد التاج مدى الدهور."], [25, "عندما يضمحل العشب، وينمو الحشيش الجديد ويجمع كلأ الجبال،"], [26, "فإن الحملان توفر لك كساءك، وتكون الجداء ثمنا لحقلك."], [27, "ويكون لك من لبن الماعز قوت يكفيك، وطعام لأهل بيتك وغذاء لجواريك."]]}, {"l": "Pro 28:19", "n": "", "vs": [[19, "من يفلح أرضه يكثر طعامه، أما من يتبع أوهاما باطلة فيشتد فقره."]]}, {"l": "Jer 40:10-12", "n": "", "vs": [[10, "أما أنا فسأسكن في المصفاة، وأتولى الأمر عنكم لدى الكلدانيين الذين يفدون إلينا أما أنتم فاجمعوا خمرا وقطاف الصيف والزيت وادخروها في أوعيتكم وأقيموا في مدنكم التي أخذتموها»."], [11, "وكذلك حين سمع كل اليهود المشتتين في أرض موآب وبين بني عمون وفي أدوم وفي البلدان الأخرى أن ملك بابل قد ترك بقية من يهوذا، وولى جدليا بن أخيقام بن شافان حاكما عليهم،"], [12, "رجعوا من كل البقاع التي تشتتوا إليها، وجاءوا إلى أرض يهوذا إلى جدليا في المصفاة، واختزنوا خمرا وغلات كثيرة من قطاف الصيف."]]}], "kwAr": "وغلة الأرض", "noteAr": ""}, {"kw": "the king", "raw": "1Sa_8:12-17; 1Kings 4:7-23; 1Ch_27:26-31", "note": "", "refs": [{"l": "1Sa 8:12-17", "n": "", "vs": [[12, "ويعين بعضهم قادة ألوف وقادة خماسين، يحرثون حقوله ويحصدون غلاته، ويصنعون أسلحته ومركباته الحربية."], [13, "ويأخذ من بناتكم ليجعل منهن طباخات وخبازات وصانعات عطور،"], [14, "ويستولي على أجود حقولكم وكرومكم وزيتونكم ويهبها لعبيده."], [15, "ويجني عشر محاصيلكم ليوزعها على أصدقائه وحاشيته"], [16, "ويسخر عبيدكم وجواريكم وخيرة شبانكم وحميركم في أعماله."], [17, "ويستولي على عشر غنمكم ويستعبدكم."]]}, {"l": "1Ki 4:7-23", "n": "", "vs": [[7, "وعين سليمان اثني عشر وكيلا موزعين على أسباط إسرائيل، عهد إلى كل واحد منهم بإمداد القصر وأهله بالمؤن شهرا من كل سنة."], [8, "وهذه هي أسماؤهم: ابن حور في جبل أفرايم."], [9, "ابن دقر في ماقص وشعلبيم وبيت شمس وأيلون بيت حانان."], [10, "ابن حسد في أربوت، وكان مسؤولا عن سوكوه وسائر أرض حافر أيضا."], [11, "ابن أبيناداب، زوج طافة ابنة سليمان، في كل مرتفعات دور."], [12, "بعنا بن أخيلود في تعنك ومجدو وكل بيت شان المجاورة لصرتان أسفل يزرعيل، فضلا عن كل الأراضي الواقعة ما بين بيت شان وآبل محولة حتى يقمعام."], [13, "ابن جابر في راموت جلعاد، بما في ذلك قرى يائير بن منسى في جلعاد، وإقليم أرجوب في باشان، وهي ستون مدينة ذات أسوار وبوابات لها أرتاج نحاسية."], [14, "أخيناداب بن عدو في محنايم."], [15, "أخيمعص في نفتالي، وهو أيضا تزوج من باسمة ابنة سليمان."], [16, "بعنا بن حوشاي في أشير وبعلوت."], [17, "يهوشافاط بن فاروح في يساكر."], [18, "شمعي بن أيلا في بنيامين."], [19, "جابر بن أوري في أرض جلعاد التي كانت لسيحون ملك الأموريين وعوج ملك باشان، وكان يشرف على هؤلاء الوكلاء مراقب واحد عام."], [20, "وكان عدد يهوذا وإسرائيل كرمل البحر في الكثرة لا يحصى، وكانوا يأكلون ويشربون ويتمتعون بالسعادة."], [21, "وامتد سلطان سليمان على جميع الممالك الواقعة ما بين نهر الفرات إلى أرض الفلسطينيين وحتى تخوم مصر. فكانت هذه الممالك تقدم له الجزية وتخضع له كل أيام حياته."], [22, "وكانت متطلبات القصر اليومية من الطعام ثلاثين كرسميذ (نحو سبعة آلاف ومئتي لتر)، وستين كر دقيق،"], [23, "وعشرة ثيران مسمنة، وعشرين ثورا من المراعي، ومئة خروف، فضلا عن الأيائل والغزلان واليحامير والإوز المسمن،"]]}, {"l": "1Ch 27:26-31", "n": "", "vs": [[26, "وعزري بن كلوب على الفعلة العاملين في المزارع الملكية."], [27, "وشمعي الرامي على الكروم، وزبدي الشفمي على مخازن الخمر."], [28, "وبعل حانان الجديري على حقول الزيتون والجميز التي في السهول ويوعاش على مخازن الزيت."], [29, "وشطراي الشاروني على قطعان البقر الراعي في شارون، وشافاط بن عدلاي على قطعان البقر السائم في الأودية."], [30, "وأوبيل الاسمعيلي على الجمال، ويحديا الميرونوثي على الحمير."], [31, "ويازير الهاجري على ماشية الغنم. كل هؤلاء كانوا المشرفين على أملاك الملك داود."]]}], "kwAr": "للملك", "noteAr": ""}], "arS": [["وغلة ", []], ["الأرض", ["H776"]], [" يستفيد منها ", []], ["الكل", ["H3605"]], ["، ", []], ["والأرض", ["H7704"]], [" ", []], ["المفلوحة", ["H5647"]], [" ذات ", []], ["جدوى", ["H3504"]], [" ", []], ["للملك", ["H4428"]], [".", []]]}, {"c": 5, "v": 10, "text": "من يحب الفضة لا يشبع منها، والمولع بالغنى لا يشبع من ربح. وهذا أيضا باطل.", "groups": [{"kw": "He that", "raw": "The more he gets, the more he would get; for Crescit amor nummi, quantum ipsa pecunia crescit, The love of money increases, in proportion as money itself increases. Ecc_4:8, Ecc_6:7; Psa_52:1, Psa_52:7, Psa_62:10; Pro_30:15, Pro_30:16; Hab_2:5-7; Mat_6:19, Mat_6:24; Luk_12:15; 1Ti_6:10", "note": "The more he gets, the more he would get; for Crescit amor nummi, quantum ipsa pecunia crescit, The love of money increases, in proportion as money itself increases. Ecc_4:8, Ecc_6:7; Psa_52:1, Psa_52:7, Psa_62:10; Pro_30:15, Pro_30:16; Hab_2:5-7; Mat_6:19, Mat_6:24; Luk_12:15; 1Ti_6:10", "refs": [{"l": "Ecc 4:8", "n": "", "vs": [[8, "واحد وحيد، لا ثاني له. لا ابن ولا أخ. ولا نهاية لتعبه. عينه لا تشبع من الغنى، ولا يقول: لمن أكدح وأحرم نفسي من المسرات؟ هذا أيضا باطل وعناء شاق!"]]}, {"l": "Ecc 6:7", "n": "", "vs": [[7, "إن كل جهد الإنسان يلتهمه فمه، أما شهيته فلا تشبع."]]}, {"l": "Psa 52:1", "n": "", "vs": [[1, "لماذا تتفاخر بالشر أيها الجبار؟ إن رحمة الله تدوم اليوم كله"]]}, {"l": "Psa 52:7", "n": "", "vs": [[7, "هذا هو الرجل الذي لم يتخذ الله حصنا له، بل اتكل على وفرة غناه واعتز بغوايته."]]}, {"l": "Psa 62:10", "n": "", "vs": [[10, "لا تتكلوا على الظلم ولا تتفاخروا بالسرقة. إن كثر الغنى فلا تعتمدوا عليه،"]]}, {"l": "Pro 30:15", "n": "", "vs": [[15, "للعلقة بنتان هاتفتان: هات، هات. ثلاثة أشياء لا تشبع قط، والرابعة لا تقول كفى:"]]}, {"l": "Pro 30:16", "n": "", "vs": [[16, "الهاوية، والرحم العقيم، وأرض لا ترتوي من الماء، والنار التي لا تقول أبدا كفى."]]}, {"l": "Hab 2:5-7", "n": "", "vs": [[5, "وكما أن الخمر غادرة، كذلك تأخذ المغتر نشوة الانتصار فلا يستكين، فإن جشعه في سعة الهاوية، وهو كالموت لا يشبع. لهذا يجمع لنفسه كل الأمم ويسبي جميع الشعوب."], [6, "ولكن لا يلبث أن يسخر منه سباياه قائلين: «ويل لمن يكوم لنفسه الأسلاب، ويثرى على حساب ما نهب. إنما إلى متى؟"], [7, "ألا يقوم عليك دائنوك بغتة، أو لا يثورون عليك ويملأونك رعبا، فتصبح لهم غنيمة؟"]]}, {"l": "Mat 6:19", "n": "", "vs": [[19, "لا تكنزوا لكم كنوزا على الأرض، حيث يفسدها السوس والصدأ، وينقب عنها اللصوص ويسرقون."]]}, {"l": "Mat 6:24", "n": "", "vs": [[24, "لا يمكن لأحد أن يكون عبدا لسيدين: لأنه إما أن يبغض أحدهما فيحب الآخر، وإما أن يلزم أحدهما فيهجر الآخر. لا يمكنكم أن تكونوا عبيدا لله والمال معا."]]}, {"l": "Luk 12:15", "n": "", "vs": [[15, "وقال للجمع: «احذروا وتحفظوا من الطمع. فمتى كان الإنسان في سعة، لا تكون حياته في أمواله»."]]}, {"l": "1Ti 6:10", "n": "", "vs": [[10, "فإن حب المال أصل لكل شر؛ وإذ سعى بعضهم إليه، ضلوا عن الإيمان، وطعنوا أنفسهم بأوجاع كثيرة."]]}], "kwAr": "من يحب الفضة", "noteAr": "كلما نال أكثر اشتهى أكثر؛ إذ «يزداد حب المال بقدر ما يزداد المال نفسه». انظر جا 4: 8؛ 6: 7؛ مز 52: 1، 7؛ 62: 10؛ أم 30: 15، 16؛ حب 2: 5-7؛ مت 6: 19، 24؛ لو 12: 15؛ 1تي 6: 10"}, {"kw": "this", "raw": "Ecc_1:17, Ecc_2:11, Ecc_2:17, Ecc_2:18, Ecc_2:26, Ecc_3:19, Ecc_4:4, Ecc_4:8, Ecc_4:16", "note": "", "refs": [{"l": "Ecc 1:17", "n": "", "vs": [[17, "ثم وجهت فكري نحو معرفة الحكمة والجنون والحماقة، فأدركت أن هذا ليس سوى ملاحقة الريح أيضا."]]}, {"l": "Ecc 2:11", "n": "", "vs": [[11, "ثم تأملت كل ما صنعته يداي وما كابدته من تعب في عمله، فإذا الجميع باطل، وكملاحقة الريح، ولا جدوى من شيء تحت الشمس."]]}, {"l": "Ecc 2:17", "n": "", "vs": [[17, "فكرهت الحياة، لأن ما تم صنعه تحت الشمس كان مثار أسى لي، فكل شيء باطل كملاحقة الريح."]]}, {"l": "Ecc 2:18", "n": "", "vs": [[18, "وكرهت كل ما سعيت من أجله تحت الشمس، لأني سأتركه لمن يخلفني."]]}, {"l": "Ecc 2:26", "n": "", "vs": [[26, "لأن المرء الذي يحظى برضى الله ينعم الله عليه بالحكمة والمعرفة والفرح. أما الخاطيء فيفرض عليه عناء الجمع والادخار، ليكون ذلك من نصيب من يرضي الله . وهذا أيضا باطل كملاحقة الريح."]]}, {"l": "Ecc 3:19", "n": "", "vs": [[19, "لأن ما يحل بأبناء البشر يحل بالبهائم. فكما يموت الواحد من الناس يموت الآخر من البهائم، فلكليهما نسمة واحدة، وليس للإنسان فضل على البهيمة، فكل شيء باطل."]]}, {"l": "Ecc 4:4", "n": "", "vs": [[4, "وأدركت أيضا أن كل تعب الإنسان ومنجزاته، ناتجة عن حسده لقريبه. هذا أيضا باطل كملاحقة الريح."]]}, {"l": "Ecc 4:8", "n": "", "vs": [[8, "واحد وحيد، لا ثاني له. لا ابن ولا أخ. ولا نهاية لتعبه. عينه لا تشبع من الغنى، ولا يقول: لمن أكدح وأحرم نفسي من المسرات؟ هذا أيضا باطل وعناء شاق!"]]}, {"l": "Ecc 4:16", "n": "", "vs": [[16, "ولم يكن نهاية للجماهير الذين سار في طليعتهم، غير أن الأجيال اللاحقة لا تسر به، فهذا أيضا باطل وكملاحقة الريح."]]}], "kwAr": "هذا أيضا باطل", "noteAr": ""}], "arS": [["من", ["H4310"]], [" ", []], ["يحب", ["H157"]], [" ", []], ["الفضة", ["H3701"]], [" ", []], ["لا", ["H3808"]], [" ", []], ["يشبع", ["H7646"]], [" منها، والمولع ", []], ["بالغنى", ["H1995"]], [" لا يشبع من ", []], ["ربح", ["H8393"]], [". ", []], ["وهذا", ["H2088"]], [" ", []], ["أيضا", ["H1571"]], [" ", []], ["باطل", ["H1892"]], [".", []]]}, {"c": 5, "v": 11, "text": "إن كثرت الخيرات كثر آكلوها أيضا، وأي جدوى لمالكها إلا أن تكتحل عيناه برؤيتها.", "groups": [{"kw": "they", "raw": "Gen_12:16, Gen_13:2, Gen_13:5-7; 1Ki_4:22, 1Ki_4:23, 1Ki_5:13-16; Neh_5:17, Neh_5:18; Psa_119:36, Psa_119:37", "note": "", "refs": [{"l": "Gen 12:16", "n": "", "vs": [[16, "فأحسن إلى أبرام بسببها وأجزل له العطاء من الغنم والبقر والحمير والعبيد والإماء والأتن والجمال."]]}, {"l": "Gen 13:2", "n": "", "vs": [[2, "وكان أبرام يملك ثروة طائلة من المواشي والفضة والذهب."]]}, {"l": "Gen 13:5-7", "n": "", "vs": [[5, "وكان للوط المرافق لأبرام غنم وبقر وخيام أيضا."], [6, "فضاقت بهما الأرض لكثرة أملاكهما فلم يقدرا أن يسكنا معا."], [7, "ونشب نزاع بين رعاة مواشي أبرام ورعاة مواشي لوط، في الوقت الذي كان فيه الكنعانيون والفرزيون يقيمون في الأرض."]]}, {"l": "1Ki 4:22", "n": "", "vs": [[22, "وكانت متطلبات القصر اليومية من الطعام ثلاثين كرسميذ (نحو سبعة آلاف ومئتي لتر)، وستين كر دقيق،"]]}, {"l": "1Ki 4:23", "n": "", "vs": [[23, "وعشرة ثيران مسمنة، وعشرين ثورا من المراعي، ومئة خروف، فضلا عن الأيائل والغزلان واليحامير والإوز المسمن،"]]}, {"l": "1Ki 5:13-16", "n": "", "vs": [[13, "وسخر الملك سليمان ثلاثين ألف رجل من أرجاء إسرائيل،"], [14, "فكان يرسل منهم عشرة آلاف إلى لبنان لمدة شهر واحد مناوبة، فيقضون شهرا في لبنان وشهرين في بيوتهم. وكان أدونيرام المشرف على تنظيم عملية التسخير."], [15, "وفضلا عن هؤلاء، كان لسليمان سبعون ألفا من حمالي الخشب وثمانون ألفا من قاطعي الحجارة في الجبل،"], [16, "ماعدا ثلاثة آلاف وثلاث مئة من المشرفين على هؤلاء العمال."]]}, {"l": "Neh 5:17", "n": "", "vs": [[17, "كما شاركني على مائدتي مئة وخمسون رجلا من اليهود والموظفين، فضلا عن الوفود القادمة إلينا من الأمم المجاورة،"]]}, {"l": "Neh 5:18", "n": "", "vs": [[18, "فكان يعد لي في كل يوم ثور وستة من خيار الغنم علاوة على الطير، وكمية كبيرة من جميع أصناف الخمور كل عشرة أيام، ومع هذا لم آخذ الضرائب المخصصة لنفقات الوالي، لأن وطأة الضرائب كانت ثقيلة على هذا الشعب."]]}, {"l": "Psa 119:36", "n": "", "vs": [[36, "اجتذب قلبي نحو شهاداتك بعيدا عن مطامع المال."]]}, {"l": "Psa 119:37", "n": "", "vs": [[37, "حول عيني عن رؤية الباطل، وفي طريقك أحيني."]]}], "kwAr": "كثر آكلوها", "noteAr": ""}, {"kw": "what", "raw": "Ecc_6:9, Ecc_11:9; Jos_7:21-25; Pro_23:5; Jer_17:11; Hab_2:13; 1Jo_2:16", "note": "", "refs": [{"l": "Ecc 6:9", "n": "", "vs": [[9, "إن ما تراه العين خير مما تشتهيه النفس. وهذا أيضا باطل كملاحقة الريح."]]}, {"l": "Ecc 11:9", "n": "", "vs": [[9, "افرح أيها الشاب في حداثتك، وليمتعك قلبك في أيام شبابك، واتبع أهواء قلبك، وكل ما تشهده عيناك. ولكن اعلم أنه بسبب هذه الأمور كلها يأتي الله بك إلى كرسي القضاء."]]}, {"l": "Jos 7:21-25", "n": "", "vs": [[21, "رأيت بين الغنائم رداء شنعاريا نفيسا، ومئتي شاقل فضة (نحو كيلوجرامين ونصف)، وسبيكة من ذهب وزنها خمسون شاقلا (نحو ست مئة جرام)، فاشتهيتها وأخذتها. وها هي مطمورة في الأرض في وسط خيمتي، والفضة تحتها»."], [22, "فأرسل يشوع رسلا فهرعوا إلى الخيمة حيث عثروا عليها مطمورة فيها، والفضة تحتها،"], [23, "فأخرجوها من وسط الخيمة وحملوها إلى يشوع وإلى جميع بني إسرائيل وعرضوها أمام الرب."], [24, "فأخذ يشوع وجميع بني إسرائيل عخان بن زارح والفضة والرداء وسبيكة الذهب، وأبناءه وبناته وبقره وحميره وغنمه وخيمته وكل ماله، وذهبوا بهم إلى وادي عخور."], [25, "وقال يشوع: «لماذا جلبت علينا هذه الكارثة؟ لتحل بك اليوم الفواجع». فرجمه جميع إسرائيل بالحجارة مع أهل بيته وأحرقوهم بالنار،"]]}, {"l": "Pro 23:5", "n": "", "vs": [[5, "ما تكاد تتألق عيناك حبورا به حتى يتبدد، إذ فجأة يصنع لنفسه أجنحة ويطير كالنسر محلقا نحو السماء."]]}, {"l": "Jer 17:11", "n": "", "vs": [[11, "مكتنز الغنى من غير حق كحجلة تحتضن وتفقس ما لم تبض، لأنه سرعان ما يفقده في منتصف حياته، ويضحى آخر أيامه أحمق."]]}, {"l": "Hab 2:13", "n": "", "vs": [[13, "ألم يصدر القضاء من عند الرب القدير أن يؤول تعب الشعوب إلى النار وجهد الأمم إلى الباطل؟"]]}, {"l": "1Jo 2:16", "n": "", "vs": [[16, "لأن كل ما في العالم، من شهوات الجسد وشهوات العين وترف المعيشة، ليس من الآب، بل من العالم."]]}], "kwAr": "وأي جدوى لمالكها", "noteAr": ""}], "arS": [["إن", ["H3588"]], [" ", []], ["كثرت", ["H7231"]], [" ", []], ["الخيرات", ["H2896", "H3788"]], [" ", []], ["كثر", ["H7235"]], [" ", []], ["آكلوها", ["H398"]], [" أيضا، ", []], ["وأي", ["H4100"]], [" جدوى ", []], ["لمالكها", ["H1167"]], [" إلا أن تكتحل ", []], ["عيناه", ["H5869"]], [" ", []], ["برؤيتها", ["H7200"]], [".", []]]}, {"c": 5, "v": 12, "text": "نوم العامل هنيء سواء أكثر من الطعام أم أقل، أما الغني فوفرة غناه تجعله قلقا أرقا!", "groups": [{"kw": "", "raw": "Psa_4:8, Psa_127:2; Pro_3:24; Jer_31:26", "note": "", "refs": [{"l": "Psa 4:8", "n": "", "vs": [[8, "بسلام أضطجع وأنام، لأنك أنت وحدك يارب تنعم علي بالطمأنينة والسلام."]]}, {"l": "Psa 127:2", "n": "", "vs": [[2, "باطلا تكدون من الفجر المبكر وإلى وقت متأخر من الليل في سبيل لقمة العيش، فإن الرب يسد حاجة أحبائه حتى وهم نيام."]]}, {"l": "Pro 3:24", "n": "", "vs": [[24, "إذا اضطجعت لا يعتريك خوف، بل ترقد متمتعا بالنوم اللذيذ."]]}, {"l": "Jer 31:26", "n": "", "vs": [[26, "وآنئذ استيقظت وتأملت، وطاب لي نومي."]]}], "kwAr": "", "noteAr": ""}], "arS": [["نوم", ["H3462", "H8142"]], [" ", []], ["العامل", ["H5647"]], [" ", []], ["هنيء", ["H4966"]], [" سواء ", []], ["أكثر", ["H7235"]], [" من ", []], ["الطعام", ["H398"]], [" أم ", []], ["أقل", ["H4592"]], ["، أما ", []], ["الغني", ["H6223"]], [" ", []], ["فوفرة", ["H7647"]], [" غناه ", []], ["تجعله", ["H5117"]], [" قلقا أرقا!", []]]}, {"c": 5, "v": 13, "text": "قد رأيت شرا مقيتا تحت الشمس: ثروة مدخرة لغير صاحبها.", "groups": [{"kw": "a sore", "raw": "Ecc_4:8, Ecc_6:1, Ecc_6:2", "note": "", "refs": [{"l": "Ecc 4:8", "n": "", "vs": [[8, "واحد وحيد، لا ثاني له. لا ابن ولا أخ. ولا نهاية لتعبه. عينه لا تشبع من الغنى، ولا يقول: لمن أكدح وأحرم نفسي من المسرات؟ هذا أيضا باطل وعناء شاق!"]]}, {"l": "Ecc 6:1", "n": "", "vs": [[1, "رأيت شرا تحت الشمس خيم بثقله على الناس:"]]}, {"l": "Ecc 6:2", "n": "", "vs": [[2, "إنسان رزقه الله غنى وممتلكات وكرامة، فلم تفتقر نفسه إلى شيء رغبت فيه. ولكن الله لم ينعم عليه بالقدرة على التمتع بها، وإنما تكون من حظ الغريب. هذا باطل، وداء خبيث."]]}], "kwAr": "شرا مقيتا", "noteAr": ""}, {"kw": "riches", "raw": "Ecc_8:9; Gen_13:5-11, Gen_14:16, Gen_19:14, Gen_19:26, Gen_19:31-38; Pro_1:11-13, Pro_1:19, Pro_1:32; Pro_11:4, Pro_11:24, Pro_11:25; Isa_2:20, Isa_32:6-8; Zep_1:18; Luk_12:16-21; Luk_16:1-13, Luk_16:19, Luk_16:22, Luk_16:23, Luk_18:22, Luk_18:23, Luk_19:8; 1Ti_6:9, 1Ti_6:10; Jam_2:5-7, Jam_5:1-4", "note": "", "refs": [{"l": "Ecc 8:9", "n": "", "vs": [[9, "هذا كله رأيته عندما تأمل قلبي في كل عمل يعمل تحت الشمس، وقتما يتسلط إنسان على إنسان ليؤذيه."]]}, {"l": "Gen 13:5-11", "n": "", "vs": [[5, "وكان للوط المرافق لأبرام غنم وبقر وخيام أيضا."], [6, "فضاقت بهما الأرض لكثرة أملاكهما فلم يقدرا أن يسكنا معا."], [7, "ونشب نزاع بين رعاة مواشي أبرام ورعاة مواشي لوط، في الوقت الذي كان فيه الكنعانيون والفرزيون يقيمون في الأرض."], [8, "فقال أبرام للوط: «لا يكن نزاع بيني وبينك، ولا بين رعاتي ورعاتك لأننا نحن أخوان."], [9, "أليست الأرض كلها أمامك؟ فاعتزل عني. إن اتجهت شمالا، أتجه أنا يمينا، وإن تحولت يمينا، أتحول أنا شمالا»."], [10, "وتلفت لوط حوله فشاهد السهول المحيطة بنهر الأردن وإذا بها ريانة كلها، قبلما دمر الرب سدوم وعمورة، وكأنها جنة الرب كأرض مصر الممتدة إلى صوغر."], [11, "فاختار لوط لنفسه حوض الأردن كله وارتحل شرقا. وهكذا اعتزل أحدهما عن الآخر."]]}, {"l": "Gen 14:16", "n": "", "vs": [[16, "واسترد كل الغنائم، واسترجع ابن أخيه لوطا وأملاكه، والنساء أيضا وسواهم من الأسرى."]]}, {"l": "Gen 19:14", "n": "", "vs": [[14, "فمضى لوط وخاطب أصهاره أزواج بناته، قائلا: «هيا. قوموا واخرجوا من هذا المكان، لأن الرب سيدمر هذه المدينة». فبدا كمازح في أعين أصهاره."]]}, {"l": "Gen 19:26", "n": "", "vs": [[26, "وتلفتت زوجة لوط السائرة خلفه وراءها، فتحولت إلى عمود من الملح."]]}, {"l": "Gen 19:31-38", "n": "", "vs": [[31, "فقالت الابنة البكر لأختها الصغيرة: «إن أبانا قد شاخ وليس في الأرض حولنا رجل يتزوجنا كعادة كل الناس."], [32, "فتعالي نسقيه خمرا ونضطجع معه فلا تنقطع ذرية أبينا»."], [33, "فسقتا في تلك الليلة أباهما خمرا، وأقبلت الابنة الكبرى وضاجعت أباها فلم يعلم باضطجاعها ولا بقيامها."], [34, "وفي اليوم الثاني قالت الابنة البكر لأختها الصغيرة: «إني قد اضطجعت مع أبي ليلة أمس، فتعالي نسقيه الليلة أيضا خمرا ثم ادخلي واضطجعي معه فنحيي من أبينا نسلا»."], [35, "فسقتا أباهما خمرا في تلك الليلة أيضا وأقبلت الابنة الصغيرة وضاجعت أباها. فلم يعلم باضطجاعها ولا بقيامها."], [36, "وهكذا حملت الابنتان كلتاهما من أبيهما."], [37, "فولدت الكبرى ابنا دعته موآب (ومعناه من الأب)، وهو أبو الموآبيين إلى اليوم،"], [38, "أما الصغرى فولدت ابنا ودعته «بن عمي) (ومعناه ابن قومي) وهو أبو بني عمون إلى اليوم."]]}, {"l": "Pro 1:11-13", "n": "", "vs": [[11, "إن قالوا: «تعال معنا لنتربص بالناس حتى نسفك دماء أو نكمن للبريء ونقتله لغير علة."], [12, "أو قالوا لك: تعال لنبتلعهم أحياء كما تبتلعهم الهاوية وأصحاء كالهابطين في حفرة الموت"], [13, "فنغنم كل نفيس ونملأ بيوتنا بالأسلاب."]]}, {"l": "Pro 1:19", "n": "", "vs": [[19, "هذا هو مصير كل من يثرى ظلما، فإن الثراء الحرام يذهب بحياة قانيه."]]}, {"l": "Pro 1:32", "n": "", "vs": [[32, "لأن ضلال الحمقى يقتلهم، وتر ف الجهال يهلكهم."]]}, {"l": "Pro 11:4", "n": "", "vs": [[4, "لا يجدي الغنى في يوم قضاء الرب، أما البر فينجي من الموت."]]}, {"l": "Pro 11:24", "n": "", "vs": [[24, "قد يسخو المرء بما عنده فيزداد غنى ويبخل آخر بما عليه أن يسخو به فيفتقر."]]}, {"l": "Pro 11:25", "n": "", "vs": [[25, "النفس السخية تزداد ثراء، والمروي يروى أيضا."]]}, {"l": "Isa 2:20", "n": "", "vs": [[20, "في ذلك اليوم يطرح الناس للجرذان والخفافيش أوثانهم الفضية وأصنامهم الذهبية التي صنعوها ليعبدوها،"]]}, {"l": "Isa 32:6-8", "n": "", "vs": [[6, "لأن اللئيم ينطق باللؤم، وقلبه يتآمر بالإثم ليرتكب شرا وليفتري على الرب، تاركا المتضور جوعا من غير شبع، وحارما الظاميء من الشرب."], [7, "إن أساليب الماكر شريرة، ومؤامراته خبيثة ليهلك البائسين بالأكاذيب، حتى لو كان المسكين ينطق بالحق."], [8, "أما الكريم فبالمآثر يفتكر وبالمكارم يشتهر."]]}, {"l": "Zep 1:18", "n": "", "vs": [[18, "لا ينقذهم ذهبهم ولا فضتهم في يوم غضب الرب، إذ بنار غيرته تلتهم كل الأرض، وفيه يضع نهاية مباغتة كاملة سريعة لكل سكان المعمورة»."]]}, {"l": "Luk 12:16-21", "n": "", "vs": [[16, "وضرب لهم مثلا، قال «إنسان غني غلت له أرضه محاصيل وافرة."], [17, "ففكر في نفسه قائلا: ماذا أعمل وليس عندي مكان أخزن فيه محاصيلي؟"], [18, "وقال: أعمل هذا: أهدم مخازني وأبني أعظم منها، وهناك أخزن جميع غلالي وخيراتي."], [19, "وأقول لنفسي: يانفس، عندك خيرات كثيرة مخزونة لسنين عديدة، فاستريحي وكلي واشربي واطر بي!"], [20, "ولكن الله قال له: ياغبي، هذه الليلة تطلب نفسك منك، فلمن يبقى ما أعددته؟"], [21, "هذه هي حالة من يخزن الكنوز لنفسه ولا يكون غنيا عند الله!»"]]}, {"l": "Luk 16:1-13", "n": "", "vs": [[1, "وقال أيضا لتلاميذه: «كان لإنسان غني وكيل. فاتهم لديه بأنه يبذر أمواله."], [2, "فاستدعاه وسأله: ما هذا الذي أسمع عنك؟ قدم حساب وكالتك، فإنك لا يمكن أن تكون وكيلا لي بعد!"], [3, "فقال الوكيل في نفسه: ما عسى أن أعمل، مادام سيدي سينزع عني الوكالة؟ لا أقوى على نقب الأرض؛ وأستحي أن أستعطي!"], [4, "قد علمت ماذا أعمل، حتى إذا عزلت عن الوكالة، يستقبلني الأصدقاء في بيوتهم."], [5, "فاستدعى مديوني سيده واحدا فواحدا. وسأل أولهم: كم عليك لسيدي؟"], [6, "فأجاب: مئة بث من الزيت. فقال له: خذ صكك، واجلس سريعا، واكتب خمسين!"], [7, "ثم قال للآخر: وأنت، كم عليك؟ فأجاب: مئة كر من القمح. فقال له: خذ صكك، واكتب ثمانين!"], [8, "فامتدح السيد وكيله الخائن لأنه تصرف بحكمة. فإن أبناء هذا العالم أحكم مع أهل جيلهم من أبناء النور."], [9, "وأقول لكم: اكسبوا لكم أصدقاء بمال الظلم، حتى إذا فني مالكم، تقبلون في المنازل الأبدية!"], [10, "إن الأمين في القليل أمين أيضا في الكثير، والخائن في القليل خائن أيضا في الكثير."], [11, "فإن لم تكونوا أمناء في مال الظلم، فمن يأتمنكم على مال الحق؟"], [12, "وإن لم تكونوا أمناء في ما يخص غيركم، فمن يعطيكم ما يخصكم؟"], [13, "ما من خادم يقدر أن يكون عبدا لسيدين: فإنه إما أن يبغض أحدهما، فيحب الآخر؛ وإما أن يلتحق بأحدهما، فيهجر الآخر. لا تستطيعون أن تكونوا عبيدا لله والمال معا»."]]}, {"l": "Luk 16:19", "n": "", "vs": [[19, "كان هنالك إنسان غني، يلبس الأرجوان وناعم الثياب، ويقيم الولائم المترفة، متنعما كل يوم."]]}, {"l": "Luk 16:22", "n": "", "vs": [[22, "ومات المسكين، وحملته الملائكة إلى حضن إبراهيم. ثم مات الغني أيضا ودفن."]]}, {"l": "Luk 16:23", "n": "", "vs": [[23, "وإذ رفع عينيه وهو في الهاوية يتعذب، رأى إبراهيم من بعيد ولعازر في حضنه."]]}, {"l": "Luk 18:22", "n": "", "vs": [[22, "فلما سمع يسوع هذا، قال له: «ينقصك شيء واحد: بع كل ما عندك، ووزع على الفقراء، فيكون لك كنز في السماوات. ثم تعال اتبعني!»"]]}, {"l": "Luk 18:23", "n": "", "vs": [[23, "ولكنه لما سمع ذلك، حزن حزنا شديدا، لأنه كان غنيا جدا."]]}, {"l": "Luk 19:8", "n": "", "vs": [[8, "ولكن زكا وقف وقال للرب: «يارب، ها أنا أعطي نصف أموالي للفقراء. وإن كنت قد اغتصبت شيئا من أحد، أرد له أربعة أضعاف!»"]]}, {"l": "1Ti 6:9", "n": "", "vs": [[9, "أما الذين يرغبون في أن يصيروا أغنياء، فيسقطون في التجربة والفخ ويتورطون في كثير من الشهوات السفيهة المضرة التي تغرق الناس في الدمار والهلاك."]]}, {"l": "1Ti 6:10", "n": "", "vs": [[10, "فإن حب المال أصل لكل شر؛ وإذ سعى بعضهم إليه، ضلوا عن الإيمان، وطعنوا أنفسهم بأوجاع كثيرة."]]}, {"l": "Jam 2:5-7", "n": "", "vs": [[5, "فياإخوتي الأحباء، أما اختار الله الفقراء في نظر الناس ليجعلهم أغنياء في الإيمان، ويعطيهم حق الإرث في الملكوت الذي وعد به محبيه؟"], [6, "ولكنكم أنتم عاملتم الفقير معاملة مهينة. ألا تعرفون أن الأغنياء هم الذين يتسلطون عليكم ويجرونكم إلى المحاكم،"], [7, "وهم الذين يستهزئون بالمسيح الذي تحملون اسمه الجميل؟"]]}, {"l": "Jam 5:1-4", "n": "", "vs": [[1, "أيها الأغنياء، هيا الآن ابكوا مولولين بسبب ما ينتظركم من أهوال وشقاء."], [2, "إن ثرواتكم الكثيرة قد فسدت، وثيابكم الفاخرة قد أكلها العث"], [3, "ذهبكم وفضتكم قد تآكلا، وسيكون تآكلهما شاهدا ضدكم، ويأكل لحمكم كنار جمعتموها ثروة للأيام الأخيرة؟"], [4, "وهذه أجرة العمال الذين حصدوا حقولكم، تلك الأجرة التي مازلتم تحبسونها عنهم ظلما، إنها تصرخ، وصراخ أولئك العمال أنفسهم قد سمعه رب الجنود!"]]}], "kwAr": "ثروة مدخرة", "noteAr": ""}], "arS": [["قد ", []], ["رأيت", ["H7200"]], [" ", []], ["شرا", ["H7451"]], [" ", []], ["مقيتا", ["H2470"]], [" ", []], ["تحت", ["H8478"]], [" ", []], ["الشمس", ["H8121"]], [": ", []], ["ثروة", ["H6239"]], [" ", []], ["مدخرة", ["H8104"]], [" لغير ", []], ["صاحبها", ["H1167"]], [".", []]]}, {"c": 5, "v": 14, "text": "أو ثروة تلفت في مشروع خاسر، ولم يبق (صاحبها) لابنه الذي أنجبه شيئا.", "groups": [{"kw": "those", "raw": "Ecc_2:26; Job_5:5, Job_20:15-29, Job_27:16, Job_27:17; Psa_39:6; Pro_23:5; Hag_1:9; Hag_2:16, Hag_2:17; Mat_6:19, Mat_6:20", "note": "", "refs": [{"l": "Ecc 2:26", "n": "", "vs": [[26, "لأن المرء الذي يحظى برضى الله ينعم الله عليه بالحكمة والمعرفة والفرح. أما الخاطيء فيفرض عليه عناء الجمع والادخار، ليكون ذلك من نصيب من يرضي الله . وهذا أيضا باطل كملاحقة الريح."]]}, {"l": "Job 5:5", "n": "", "vs": [[5, "يأكل الجائع حصيدهم، ويلتهمه حتى من بين الشوك، ويمتص الظاميء ثروتهم."]]}, {"l": "Job 20:15-29", "n": "", "vs": [[15, "ويتقيأ ما ابتلعه من أموال، ويستخرجها الله من جوفه."], [16, "لقد رضع سم الصل، فقتله لسان الأفعى."], [17, "لن تكتحل عيناه بمرأى الأنهار الجارية، ولا بالجداول الفياضة بالعسل والزبد."], [18, "يرد ثمار تعبه ولا يبلعه ولا يستمتع بكسب تجارته."], [19, "لأنه هضم حق الفقراء وخذلهم وسلب بيوتا لم يبنها."], [20, "وإذ لا يعرف طمعه قناعة، فإنه لن يدخر شيئا يستمتع به."], [21, "لم يبق نهمه على شيء، لذلك لن يدوم خيره."], [22, "في وفرة سعته يصيبه الضنك، وتحل به أقسى الكوارث."], [23, "وعندما يملأ بطنه ينفث عليه الله غضبه الحارق ويمطره عليه طعاما له."], [24, "إن فر من آلة حرب من حديد، تخترقه قوس النحاس."], [25, "اخترقته عميقا وخرجت من جسده، ونفذ حدها اللامع من مرارته، وحل به رعب."], [26, "كل ظلمة تتربص بذخائره، وتأكله نار لم تنفخ، وتلتهم ما بقي من خيمته."], [27, "تفضح السماوات إثمه، وتتمرد الأرض عليه،"], [28, "تفنى مدخرات بيته وتحترق في يوم غضب الرب."], [29, "هذا هو المصير الذي يعده الله للأشرار، والميراث الذي كتبه الله لهم»."]]}, {"l": "Job 27:16", "n": "", "vs": [[16, "إن جمع فضته كأكوام التراب، وكوم ملابس كالطين،"]]}, {"l": "Job 27:17", "n": "", "vs": [[17, "فإن ما يعده من ثياب يرتديه الصديق، والبريء يوزع الفضة."]]}, {"l": "Psa 39:6", "n": "", "vs": [[6, "إنما كخيال يتمشى الإنسان، فعبثا يكافح الناس. يجمع الواحد منهم ثروة ولا يدري من يرثها من بعده."]]}, {"l": "Pro 23:5", "n": "", "vs": [[5, "ما تكاد تتألق عيناك حبورا به حتى يتبدد، إذ فجأة يصنع لنفسه أجنحة ويطير كالنسر محلقا نحو السماء."]]}, {"l": "Hag 1:9", "n": "", "vs": [[9, "لقد توقعتم كثيرا فحصلتم على قليل، وما أتيتم به إلى البيت من غلة نفخت عليه وبددته. لماذا فعلت هذا يقول الرب القدير؟ من أجل بيتي الذي ما برح مهدما بينما كل واحد منكم منهمك في بناء بيته."]]}, {"l": "Hag 2:16", "n": "", "vs": [[16, "عندما كان يقبل أحد على كومة حبوب ظنا منه أن الأرض قد غلت عشرين مكيالا، يجد أنها لم تغل سوى عشرة فقط. وحين يدنو من المعصرة ليغرف ملء خمسين وعاء، لا يجد إلا عشرين."]]}, {"l": "Hag 2:17", "n": "", "vs": [[17, "إني ابتليت تعب أيديكم بالقحط والذبول والبرد، ولكنكم لم ترجعوا تائبين إلي، يقول الرب."]]}, {"l": "Mat 6:19", "n": "", "vs": [[19, "لا تكنزوا لكم كنوزا على الأرض، حيث يفسدها السوس والصدأ، وينقب عنها اللصوص ويسرقون."]]}, {"l": "Mat 6:20", "n": "", "vs": [[20, "بل اكنزوا لكم كنوزا في السماء، حيث لا يفسدها سوس ولا ينقب عنها لصوص ولا يسرقون."]]}], "kwAr": "ثروة تلفت", "noteAr": ""}, {"kw": "and he", "raw": "1Sa_2:6-8, 1Sa_2:36; 1Ki_14:26; Psa_109:9-12", "note": "", "refs": [{"l": "1Sa 2:6-8", "n": "", "vs": [[6, "الرب يميت ويحيي، يطرح إلى الهاوية ويصعد منها."], [7, "الرب يفقر ويغني، يذل ويعز."], [8, "ينهض المسكين من التراب، ويرفع البائس من كومة الرماد، ليجلسه مع النبلاء، ويملكه عرش المجد، لأن للرب أساسات الأرض التي أرسى عليها المسكونة."]]}, {"l": "1Sa 2:36", "n": "", "vs": [[36, "وكل من يبقى من ذريتك يأتي إليه ساجدا متوسلا من أجل قطعة فضة ورغيف خبز، متضرعا إليه قائلا: هبني عملا بين الكهنة لآكل كسرة خبز»."]]}, {"l": "1Ki 14:26", "n": "", "vs": [[26, "واستولى على خزائن بيت الرب وخزائن قصر الملك، وسلب كل ما فيها، لاسيما الأتراس الذهبية التي عملها سليمان."]]}, {"l": "Psa 109:9-12", "n": "", "vs": [[9, "ليتيتم بنوه وتترمل زوجته."], [10, "ليتشرد بنوه ويستعطوا، وليلتمسوا قوتهم بعيدا عن خرائب سكناهم."], [11, "ليسترهن المداين كل ممتلكاته، ولينهب الغرباء ثمار تعبه."], [12, "لينقرض من يتراءف عليه، ولينقطع من يتحنن على أيتامه."]]}], "kwAr": "ولم يبق", "noteAr": ""}], "arS": [["أو ", []], ["ثروة", ["H6239"]], [" ", []], ["تلفت", ["H6"]], [" ", []], ["في", ["H3027"]], [" ", []], ["مشروع", ["H6045"]], [" ", []], ["خاسر", ["H7451"]], ["، ", []], ["ولم", ["H369"]], [" يبق (صاحبها) ", []], ["لابنه", ["H1121"]], [" الذي ", []], ["أنجبه", ["H3205"]], [" ", []], ["شيئا", ["H3972"]], [".", []]]}, {"c": 5, "v": 15, "text": "عريانا يخرج المرء من رحم أمه، وعريانا يفارق الدنيا كما جاء. لا يأخذ شيئا من تعبه يحمله معه في يده.", "groups": [{"kw": "", "raw": "Job_1:21; Psa_49:17; Luk_12:20; 1Ti_6:7", "note": "", "refs": [{"l" رة،"]]}, {"l": "Psa 4:6", "n": "", "vs": [[6, "ما أكثر المتسائلين: «من يرينا خيرا؟» أشرق علينا أيها الرب بنور وجهك."]]}, {"l": "Psa 4:7", "n": "", "vs": [[7, "غرست في قلبي فرحا أعظم من فرح من امتلأت بيوتهم وأجرانهم بالحنطة والخمر الجديدة."]]}, {"l": "Isa 64:5", "n": "", "vs": [[5, "أنت تلاقي من يفرح بعمل البر ومن يسلك دائما في طرقك. لكم سخطت علينا لأننا واظبنا على ارتكاب الآثام زمانا طويلا، فكيف لمثلنا أن يخلص؟"]]}, {"l": "Isa 65:13", "n": "", "vs": [[13, "لذلك هكذا يقول السيد الرب: ها عبيدي يأكلون وأنتم تجوعون، ويشربون وأنتم تظمأون، ويفرحون وأنتم تخزون،"]]}, {"l": "Isa 65:14", "n": "", "vs": [[14, "ويترنمون في غبطة القلب وأنتم تعولون من أسى القلب، وتولولون من انكسار الروح،"]]}, {"l": "Isa 65:21-24", "n": "", "vs": [[21, "يغرس الناس كرومهم ويأكلون ثمارها، ويبنون بيوتهم ويقيمون فيها،"], [22, "لا يبنون ليأتي آخر فيسكن فيها، ولا يغرسون كروما ليجنيها آخر، لأن أيام شعبي تكون مديدة كأيام الشجر، ويتمتع مختاري بعمل أيديهم."], [23, "فهم لن يتعبوا باطلا ولا تنجب نساؤهم أولادا للرعب، لأنهم يكونون ذرية مباركي الرب، ويتبارك أولادهم معهم."], [24, "وقبل أن يدعوا أستجيب، وفيما هم يتكلمون أنصت إليهم."]]}, {"l": "Rom 5:1", "n": "", "vs": [[1, "فبما أننا قد تبررنا على أساس الإيمان، صرنا في سلام مع الله بربنا يسوع المسيح."]]}, {"l": "Rom 5:5-11", "n": "", "vs": [[5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."], [6, "فإنه ونحن بعد عاجزون، مات المسيح عن العصاة في الوقت المعين."], [7, "إذ قلما يموت أحد فدى إنسان بار، بل قد يتجرأ أحد أن يموت فدى إنسان صالح."], [8, "ولكن الله أثبت لنا محبته، إذ ونحن مازلنا خاطئين مات المسيح عوضا عنا."], [9, "ومادمنا الآن قد تبررنا بدمه، فكم بالأحرى نخلص به من الغضب الآتي!"], [10, "فإن كنا، ونحن أعداء، قد تصالحنا مع الله بموت ابنه، فكم بالأحرى نخلص بحياته ونحن مصالحون!"], [11, "وليس هذا فقط، بل إننا نفتخر أيضا بالله، بفضل ربنا يسوع المسيح الذي به نلنا المصالحة الآن."]]}], "kwAr": "الله يلهيه", "noteAr": ""}], "arS": [["عندئذ", ["H3588"]], [" ", []], ["لا", ["H3808"]], [" ", []], ["يكثر", ["H7235"]], [" من ", []], ["ذكر", ["H2142"]], [" ", []], ["أيام", ["H3117"]], [" ", []], ["حياته", ["H2416"]], [" الباطلة ", []], ["لأن", ["H3588"]], [" ", []], ["الله", ["H430"]], [" ", []], ["يلهيه", ["H6030"]], [" ", []], ["بفرح", ["H8057"]], [" ", []], ["قلبه", ["H3820"]], [".", []]]}, {"c": 6, "v": 1, "text": "رأيت شرا تحت الشمس خيم بثقله على الناس:", "groups": [{"kw": "", "raw": "Ecc_5:13", "note": "", "refs": [{"l": "Ecc 5:13", "n": "", "vs": [[13, "قد رأيت شرا مقيتا تحت الشمس: ثروة مدخرة لغير صاحبها."]]}], "kwAr": "", "noteAr": ""}], "arS": [["رأيت", ["H7200"]], [" ", []], ["شرا", ["H7451"]], [" ", []], ["تحت", ["H8478"]], [" ", []], ["الشمس", ["H8121"]], [" ", []], ["خيم", ["H7227"]], [" بثقله ", []], ["على", ["H5921"]], [" ", []], ["الناس", ["H120"]], [":", []]]}, {"c": 6, "v": 2, "text": "إنسان رزقه الله غنى وممتلكات وكرامة، فلم تفتقر نفسه إلى شيء رغبت فيه. ولكن الله لم ينعم عليه بالقدرة على التمتع بها، وإنما تكون من حظ الغريب. هذا باطل، وداء خبيث.", "groups": [{"kw": "a man", "raw": "Ecc_5:19; 1Ki_3:13; 1Ch_29:25, 1Ch_29:28; 2Ch_1:11; Dan_5:18", "note": "", "refs": [{"l": "Ecc 5:19", "n": "", "vs": [[19, "وكل إنسان حباه الله بالثروة، جعله يستمتع بها، ويتنعم بنصيبه منها ليفرح بتعبه. فهذا أيضا عطية الله له."]]}, {"l": "1Ki 3:13", "n": "", "vs": [[13, "وقد أنعمت عليك أيضا بما لم تسأله، من غنى ومجد، حتى لا يكون لك نظير بين الملوك في أيامك."]]}, {"l": "1Ch 29:25", "n": "", "vs": [[25, "وعظم الرب من شأن سليمان في أعين الإسرائيليين جميعا، وأضفى عليه مهابة ملكية لم يحظ بها ملك قبله في إسرائيل."]]}, {"l": "1Ch 29:28", "n": "", "vs": [[28, "ومات بشيخوخة صالحة، وقد شبع أياما وتمتع بالغنى والكرامة، وخلفه ابنه سليمان."]]}, {"l": "2Ch 1:11", "n": "", "vs": [[11, "فقال الله لسليمان: «من أجل أنك قد عزمت في قلبك على طلب هذا الأمر، ولم تنشد غنى، ولا أموالا، ولا عظمة، ولا الانتقام من أعدائك، ولم تطلب حياة طويلة، بل سألت لنفسك حكمة ومعرفة لتحكم بهما شعبي الذي ملكتك عليه،"]]}, {"l": "Dan 5:18", "n": "", "vs": [[18, "أيها الملك قد وهب الله العلي أباك نبوخذناصر ملكا وعظمة وجلالا وبهاء."]]}], "kwAr": "إنسان رزقه الله", "noteAr": ""}, {"kw": "so", "raw": "Ecc_2:4-10; Deu_8:7-10; Jdg_18:10; Job_21:9-15; Psa_17:14, Psa_73:7; Luk_12:19, Luk_12:20", "note": "", "refs": [{"l": "Ecc 2:4-10", "n": "", "vs": [[4, "فأنجزت أعمالا عظيمة، وشيدت لي بيوتا وغرست كروما."], [5, "وأنشأت لنفسي جنات وبساتين غرستها أشجارا من جميع الأصناف،"], [6, "وحفرت برك مياه لأروي الأشجار النامية،"], [7, "واشتريت عبيدا وإماء، وكان لي عبيد ممن ولدوا في داري، واقتنيت أيضا قطعان بقر ومواشي غنم، حتى فقت جميع أسلافي ممن كانوا قبلي في أورشليم."], [8, "واكتنزت لنفسي فضة وذهبا، وكنوز الملوك والأقاليم، واتخذت لنفسي مغنين ومغنيات وزوجات وسراري، وكل ما هو متعة لقلب أبناء البشر."], [9, "وازددت عظمة حتى فقت جميع أسلافي في أورشليم، دون أن تبارحني الحكمة."], [10, "ولم أحرم عيني مما اشتهتاه، ولم أصد قلبي عن أية متعة، فابتهج قلبي لكل تعبي، وكان هذا ثوابي عن كل مشقتي."]]}, {"l": "Deu 8:7-10", "n": "", "vs": [[7, "لأن الرب إلهكم آت بكم إلى أرض خصيبة، تكثر فيها الأنهار والآبار، وعيون ماء تتدفق في الوديان والجبال."], [8, "إلى أرض حنطة وشعير وكروم وتين ورمان وزيتون وعسل."], [9, "إلى أرض لا تأكلون بالذل خبزكم ولا يعوزكم فيها شيء. هي أرض يتوافر في حجارتها الحديد، ومن جبالها تستخرجون النحاس."], [10, "فمتى أكلتم وشبعتم باركوا الرب إلهكم الذي وهبكم هذه الأرض الخصيبة."]]}, {"l": "Jdg 18:10", "n": "", "vs": [[10, "فأنتم عندما تقدمون عليها ستجدون قوما مطمئنين في أرض شاسعة. إن الرب قد وهبها لكم وهي أرض خصيبة لا تفتقر إلى شيء»."]]}, {"l": "Job 21:9-15", "n": "", "vs": [[9, "بيوتهم آمنة من المخاوف، وعصا الله لا تنزل عليهم."], [10, "ثورهم يلقح ولا يخفق، وبقرتهم تلد ولا تسقط."], [11, "يسرحون صبيانهم كسرب، وأطفالهم يرقصون."], [12, "يغنون بالدف والعود ويطربون لصوت المزمار،"], [13, "يقضون أيامهم في الرغد، ثم في لحظة يهبطون إلى الهاوية."], [14, "يقولون للرب: فارقنا فإننا لا نعبأ بمعرفة طرقك."], [15, "من هو القدير حتى نعبده؟ وأي كسب نجنيه إن صلينا إليه؟"]]}, {"l": "Psa 17:14", "n": "", "vs": [[14, "أنقذني بيدك يارب من الناس. من أهل الدنيا الذين نصيبهم هو في هذه الحياة. أنت تملأ بطونهم من خيراتك المخزونة، فيشبع أبناؤهم، ويورثون أولادهم ما يفضل عنهم."]]}, {"l": "Psa 73:7", "n": "", "vs": [[7, "عيونهم جاحظة من كثرة شحم طمعهم. وشرهم تجاوز ما يتصوره القلب."]]}, {"l": "Luk 12:19", "n": "", "vs": [[19, "وأقول لنفسي: يانفس، عندك خيرات كثيرة مخزونة لسنين عديدة، فاستريحي وكلي واشربي واطر بي!"]]}, {"l": "Luk 12:20", "n": "", "vs": [[20, "ولكن الله قال له: ياغبي، هذه الليلة تطلب نفسك منك، فلمن يبقى ما أعددته؟"]]}], "kwAr": "فلم تفتقر نفسه", "noteAr": ""}, {"kw": "yet", "raw": "A man may possess much earthly goods, and yet have neither the heart nor power to enjoy them. Possession and fruition are not necessarily joined together; and this is also among the vanities of life, and was and still is a very common evil among men. It belongs to God as much to give the power to enjoy, as it does to give earthly blessings.", "note": "A man may possess much earthly goods, and yet have neither the heart nor power to enjoy them. Possession and fruition are not necessarily joined together; and this is also among the vanities of life, and was and still is a very common evil among men. It belongs to God as much to give the power to enjoy, as it does to give earthly blessings.", "refs": [], "kwAr": "ولكن الله لم ينعم", "noteAr": "قد يملك المرء كثيرا من خيرات الأرض ومع ذلك لا يكون له قلب ولا قدرة على التمتع بها. فالامتلاك والتمتع لا يقترنان بالضرورة؛ وهذا أيضا من أباطيل الحياة، وكان ولا يزال شرا شائعا جدا بين الناس. وإعطاء القدرة على التمتع هو من الله كما أن إعطاء البركات الأرضية منه."}, {"kw": "but", "raw": "Deu_28:33, Deu_28:43; Psa_39:6; Lam_5:2; Hos_7:9", "note": "", "refs": [{"l": "Deu 28:33", "n": "", "vs": [[33, "محصول أرضك وثمر تعبك يأكله شعب غريب عنك، ولا تكون سوى مظلوم مسحوق دائما."]]}, {"l": "Deu 28:43", "n": "", "vs": [[43, "يعظم شأن الغرباء المقيمين بينكم، ويتفاقم انحطاط شأنكم."]]}, {"l": "Psa 39:6", "n": "", "vs": [[6, "إنما كخيال يتمشى الإنسان، فعبثا يكافح الناس. يجمع الواحد منهم ثروة ولا يدري من يرثها من بعده."]]}, {"l": "Lam 5:2", "n": "", "vs": [[2, "قد تحول ميراثنا إلى الغرباء وبيوتنا إلى الأجانب."]]}, {"l": "Hos 7:9", "n": "", "vs": [[9, "استنزف الغرباء قوته وهو لا يدري، وخط الشيب شعر رأسه وهو لا يعلم."]]}], "kwAr": "وإنما تكون", "noteAr": ""}, {"kw": "vanity", "raw": "Ecc_4:4, Ecc_4:8, Ecc_5:16", "note": "", "refs": [{"l": "Ecc 4:4", "n": "", "vs": [[4, "وأدركت أيضا أن كل تعب الإنسان ومنجزاته، ناتجة عن حسده لقريبه. هذا أيضا باطل كملاحقة الريح."]]}, {"l": "Ecc 4:8", "n": "", "vs": [[8, "واحد وحيد، لا ثاني له. لا ابن ولا أخ. ولا نهاية لتعبه. عينه لا تشبع من الغنى، ولا يقول: لمن أكدح وأحرم نفسي من المسرات؟ هذا أيضا باطل وعناء شاق!"]]}, {"l": "Ecc 5:16", "n": "", "vs": [[16, "وهذا أيضا شر أليم، إذ إنه يفارق الدنيا كما جاء فأي منفعة له، إذ إن تعبه يذهب أدراج الرياح؟"]]}], "kwAr": "هذا باطل", "noteAr": ""}], "arS": [["إنسان", ["H376"]], [" رزقه ", []], ["الله", ["H430"]], [" ", []], ["غنى", ["H6239", "H5233"]], [" وممتلكات ", []], ["وكرامة", ["H3519"]], ["، ", []], ["فلم", ["H3808"]], [" ", []], ["تفتقر", ["H2638"]], [" ", []], ["نفسه", ["H5315"]], [" إلى ", []], ["شيء", ["H3605"]], [" ", []], ["رغبت", ["H183"]], [" فيه. ", []], ["ولكن", ["H834"]], [" ", []], ["الله", ["H430"]], [" ", []], ["لم", ["H369"]], [" ", []], ["ينعم", ["H5414"]], [" عليه ", []], ["بالقدرة", ["H7980"]], [" على ", []], ["التمتع", ["H398"]], [" بها، ", []], ["وإنما", ["H3588"]], [" ", []], ["تكون", ["H1931"]], [" ", []], ["من", ["H4480"]], [" حظ ", []], ["الغريب", ["H5237"]], [". ", []], ["هذا", ["H2088"]], [" ", []], ["باطل", ["H1892"]], ["، ", []], ["وداء", ["H2483"]], [" ", []], ["خبيث", ["H7451"]], [".", []]]}, {"c": 6, "v": 3, "text": "رب رجل ينجب مئة ولد ويعيش عمرا طويلا حتى تكثر سنو حياته، لكنه لا يتمتع بخيرات الحياة ولا يثوي في قبر. أقول إن السقط خير منه!", "groups": [{"kw": "a man", "raw": "Gen_33:5; 1Sa_2:20, 1Sa_2:21; 2Ki_10:1; 1Ch_28:5; 2Ch_11:21; Est_5:11; Psa_127:4, Psa_127:5; Pro_17:6", "note": "", "refs": [{"l": "Gen 33:5", "n": "", "vs": [[5, "وتلفت عيسو حوله فشاهد النساء والأولاد فقال: «من هؤلاء الذين معك؟» فأجاب: «هم الأولاد الذين أنعم الله بهم على عبدك»."]]}, {"l": "1Sa 2:20", "n": "", "vs": [[20, "فيبارك عالي ألقانة وزوجته قائلا: «ليرزقك الرب ذرية من هذه المرأة عوضا عن الصبي الذي وهبتماه للرب». ثم يرجعان إلى حيث يقيمان."]]}, {"l": "1Sa 2:21", "n": "", "vs": [[21, "وعندما افتقد الرب حنة، حملت وأنجبت ثلاثة أبناء وبنتين. أما صموئيل فقد ترعرع في خدمة الرب."]]}, {"l": "2Ki 10:1", "n": "", "vs": [[1, "وكان لأخآب سبعون ابنا يقيمون في السامرة، فكتب ياهو رسائل بعث بها إلى شيوخ مدينة يزرعيل وإلى الأوصياء على أبناء أخآب قائلا:"]]}, {"l": "1Ch 28:5", "n": "", "vs": [[5, "ثم اصطفى ابني سليمان من بين أبنائي الكثيرين الذين رزقني بهم الرب، ليخلفني على عرش مملكة الرب، على إسرائيل."]]}, {"l": "2Ch 11:21", "n": "", "vs": [[21, "وأحب رحبعام معكة ابنة أبشالوم أكثر من سائر نسائه ومحظياته، وكان قد تزوج ثماني عشرة امرأة، وكانت له ستون محظية، أنجبن له ثمانية وعشرين ابنا وستين بنتا."]]}, {"l": "Est 5:11", "n": "", "vs": [[11, "وراح يعدد أمامهم ما يملك من ثروات ومن بنين، وكل ما أنعم عليه الملك به من عظمة وجاه، حتى صارت مرتبته فوق مرتبة جميع رؤساء الملك ورجاله!"]]}, {"l": "Psa 127:4", "n": "", "vs": [[4, "أبناء الشبيبة مثل سهام في يد جبار متمرس."]]}, {"l": "Psa 127:5", "n": "", "vs": [[5, "طوبى للذي ملأ جعبته منهم، فإنهم لا يخيبون حين يواجهون الخصوم في مجلس القضاء عند بوابة المدينة."]]}, {"l": "Pro 17:6", "n": "", "vs": [[6, "تاج الشيوخ الأحفاد، وفخر الأبناء آباؤهم."]]}], "kwAr": "رجل ينجب مئة ولد", "noteAr": ""}, {"kw": "so", "raw": "Ecc_5:17-19; Gen_47:9", "note": "", "refs": [{"l": "Ecc 5:17-19", "n": "", "vs": [[17, "وينفق أيضا كل حياته في الظلمات يقاسي من الأسى والغم والمرض والسخط."], [18, "فتأمل ما وجدت: من الأفضل والأليق أن يأكل الإنسان ويشرب ويستمتع بما تكبده من عناء تحت الشمس طوال أيام حياته القليلة التي وهبها الله له، لأن هذا هو حظه."], [19, "وكل إنسان حباه الله بالثروة، جعله يستمتع بها، ويتنعم بنصيبه منها ليفرح بتعبه. فهذا أيضا عطية الله له."]]}, {"l": "Gen 47:9", "n": "", "vs": [[9, "فأجاب يعقوب فرعون: «سنوات غربتي مئة وثلاثون سنة، قليلة وشاقة، ولم تبلغ سني غربة آبائي»."]]}], "kwAr": "تكثر سنو حياته", "noteAr": ""}, {"kw": "and also", "raw": "2Ki_9:35; Est_7:10, Est أكل الإنسان ويشرب ويستمتع بما تكبده من عناء تحت الشمس طوال أيام حياته القليلة التي وهبها الله له، لأن هذا هو حظه."]]}], "kwAr": "ما تراه العين خير", "noteAr": ""}, {"kw": "wandering of the desire", "raw": "Heb. walking of the soul, Job_31:7; Pro_30:15, Pro_30:16; Jer_2:20", "note": "Heb. walking of the soul, Job_31:7; Pro_30:15, Pro_30:16; Jer_2:20", "refs": [{"l": "Job 31:7", "n": "", "vs": [[7, "إن حادت خطواتي عن الطريق، وغوى قلبي وراء عيني، وعلقت بيدي لطخة عار،"]]}, {"l": "Pro 30:15", "n": "", "vs": [[15, "للعلقة بنتان هاتفتان: هات، هات. ثلاثة أشياء لا تشبع قط، والرابعة لا تقول كفى:"]]}, {"l": "Pro 30:16", "n": "", "vs": [[16, "الهاوية، والرحم العقيم، وأرض لا ترتوي من الماء، والنار التي لا تقول أبدا كفى."]]}, {"l": "Jer 2:20", "n": "", "vs": [[20, "قد حطمت نيري من زمن بعيد، وقطعت قيودك وقلت: لن أتعبد لك، وصرت تضطجعين كزانية فوق كل أكمة مرتفعة وتحت كل شجرة خضراء (أي عبدت الأوثان)."]]}], "kwAr": "مما تشتهيه النفس", "noteAr": "بالعبرانية: مسير النفس. انظر أي 31: 7؛ أم 30: 15، 16؛ إر 2: 20"}, {"kw": "this", "raw": "Ecc_6:2, Ecc_1:2, Ecc_1:14, Ecc_2:11, Ecc_2:22, Ecc_2:23, Ecc_4:4", "note": "", "refs": [{"l": "Ecc 6:2", "n": "", "vs": [[2, "إنسان رزقه الله غنى وممتلكات وكرامة، فلم تفتقر نفسه إلى شيء رغبت فيه. ولكن الله لم ينعم عليه بالقدرة على التمتع بها، وإنما تكون من حظ الغريب. هذا باطل، وداء خبيث."]]}, {"l": "Ecc 1:2", "n": "", "vs": [[2, "يقول الجامعة: باطل الأباطيل، باطل الأباطيل، كل شيء باطل."]]}, {"l": "Ecc 1:14", "n": "", "vs": [[14, "لقد شاهدت كل الأشياء التي تم صنعها تحت الشمس فإذا الجميع باطل كملاحقة الريح."]]}, {"l": "Ecc 2:11", "n": "", "vs": [[11, "ثم تأملت كل ما صنعته يداي وما كابدته من تعب في عمله، فإذا الجميع باطل، وكملاحقة الريح، ولا جدوى من شيء تحت الشمس."]]}, {"l": "Ecc 2:22", "n": "", "vs": [[22, "فأي نفع للإنسان من جميع تعبه ومكابدته العناء الذي قاسى منه تحت الشمس؟"]]}, {"l": "Ecc 2:23", "n": "", "vs": [[23, "كل أيام حياته مفعمة بالمشقة، وعمله عناء. حتى في الليل لا يستريح قلبه. وهذا أيضا باطل."]]}, {"l": "Ecc 4:4", "n": "", "vs": [[4, "وأدركت أيضا أن كل تعب الإنسان ومنجزاته، ناتجة عن حسده لقريبه. هذا أيضا باطل كملاحقة الريح."]]}], "kwAr": "وهذا أيضا باطل", "noteAr": ""}], "arS": [["إن ما ", []], ["تراه", ["H4758"]], [" ", []], ["العين", ["H5869"]], [" ", []], ["خير", ["H2896"]], [" مما ", []], ["تشتهيه", ["H1980"]], [" ", []], ["النفس", ["H5315"]], [". ", []], ["وهذا", ["H2088"]], [" ", []], ["أيضا", ["H1571"]], [" ", []], ["باطل", ["H1892"]], [" ", []], ["كملاحقة", ["H7469"]], [" ", []], ["الريح", ["H7307"]], [".", []]]}, {"c": 6, "v": 10, "text": "كل ما هو كائن أمر مقرر منذ زمن قديم وما جبل عليه الإنسان من طبع معروف يتعذر تغييره لأنه لا يقدر على مخاصمة من هو أقوى منه (أي صانعه).", "groups": [{"kw": "which", "raw": "Ecc_1:9-11, Ecc_3:15", "note": "", "refs": [{"l": "Ecc 1:9-11", "n": "", "vs": [[9, "ما هو كائن هو الذي سيظل كائنا، وما صنع هو الذي يظل يصنع، ولا شيء جديد تحت الشمس."], [10, "أهناك شيء يمكن أن يقال عنه: انظر، هذا جديد؟ كل شيء كان موجودا منذ العصور التي خلت قبلنا!"], [11, "ليس من ذكر للأمور السالفة، ولن يكون ذكر للأشياء الآتية بين الذين يأتون من بعدنا."]]}, {"l": "Ecc 3:15", "n": "", "vs": [[15, "فما كان قبلا هو كائن الآن، وما سيكون هو كائن من قبل. والله يطالب بما قد مضى."]]}], "kwAr": "كل ما هو كائن", "noteAr": ""}, {"kw": "and it", "raw": "Gen_3:9, Gen_3:17-19; Job_14:1-4; Psa_39:6, Psa_82:6, Psa_82:7, Psa_103:15", "note": "", "refs": [{"l": "Gen 3:9", "n": "", "vs": [[9, "فنادى الرب الإله آدم: «أين أنت؟»"]]}, {"l": "Gen 3:17-19", "n": "", "vs": [[17, "وقال لآدم: «لأنك أذعنت لقول امرأتك، وأكلت من الشجرة التي نهيتك عنها، فالأرض ملعونة بسببك وبالمشقة تقتات منها طوال عمرك."], [18, "شوكا وحسكا تنبت لك، وأنت تأكل عشب الحقل."], [19, "بعرق جبينك تكسب عيشك حتى تعود إلى الأرض، فمن تراب أخذت، وإلى تراب تعود»."]]}, {"l": "Job 14:1-4", "n": "", "vs": [[1, "الإنسان مولود المرأة. قصير العمر ومفعم بالشقاء،"], [2, "يتفتح كالزهر ثم ينتثر، ويتوارى كالشبح فلا يبقى له أثر."], [3, "أعلى مثل هذا فتحت عينيك وأحضرتني لأتحاج معك؟"], [4, "من يستولد الطاهر من النجس؟ لا أحد!"]]}, {"l": "Psa 39:6", "n": "", "vs": [[6, "إن
