9:15", "n": "", "vs": [[15, "لم يخف عليك كياني عندما كونت في السر، وجبلت في أعماق الأرض."]]}], "kwAr": "عظام الجنين", "noteAr": ""}, {"kw": "even", "raw": "Ecc_7:24, Ecc_8:17; Job_5:9, Job_26:5-14, Job_36:24-33, Job_37:23, 38:4-41, 39:1-41:34; Psa_40:5, Psa_92:5, Psa_104:24; Isa_40:28; Rom_11:33", "note": "", "refs": [{"l": "Ecc 7:24", "n": "", "vs": [[24, "ما هو بعيد، بعيد جدا، وما هو عميق، عميق جدا. ومن لي بمن يكتشفه؟"]]}, {"l": "Ecc 8:17", "n": "", "vs": [[17, "رأيت أعمال الله كلها، وعجز الإنسان عن إدراك الأعمال التي تم إنجازها تحت الشمس. ومهما جد في سعيه لمعرفتها فلن يدركها. وحتى إن ادعى الحكيم معرفتها فإنه حقا لن يستطيع أن يجدها."]]}, {"l": "Job 5:9", "n": "", "vs": [[9, "هو صانع عجائب لا تفحص وعظائم لا تحصى."]]}, {"l": "Job 26:5-14", "n": "", "vs": [[5, "ترتعد الأشباح من تحت، وكذلك المياه وسكانها."], [6, "الهاوية مكشوفة أمام الله والهلاك لا ستر له."], [7, "يمد الشمال على الخواء ويعلق الأرض على لا شيء."], [8, "يصر المياه في سحبه فلا يتخرق الغيم تحتها."], [9, "يحجب وجه عرشه ويبسط فوقه غيومه."], [10, "رسم حدا على وجه المياه عند خط اتصال النور بالظلمة."], [11, "من زجره ترتعش أعمدة السماء وترتعد من تقريعه."], [12, "بقوته يهديء هيجان البحر وبحكمته يسحق رهب."], [13, "بنسمته جمل السماوات، ويداه اخترقتا الحية الهاربة."], [14, "وهذه ليست سوى أدنى طرقه، وما أخفت همس كلامه الذي نسمعه؛ فمن يدرك إذا رعد جبروته؟»"]]}, {"l": "Job 36:24-33", "n": "", "vs": [[24, "لا تنس أن تعظم عمله الذي يتغنى به الناس."], [25, "لقد شهده الناس كلهم، وتفرسوا فيه من بعيد."], [26, "فما أعظم الله ! ونحن لا نعرفه، وعدد سنيه لا يستقصى."], [27, "لأنه يجتذب قطرات الماء، ويجعل سحبه تهطل أمطارا،"], [28, "تسكبها السماوات وتصبها بغزارة على الإنسان."], [29, "أهناك من يفهم كيف تنتشر السحب، وكيف ترعد سماؤه؟"], [30, "فانظر كيف بسط بروقه حواليه وتسربل بلجج البحر."], [31, "هكذا يطعم الله الشعوب ويزودهم بالغذاء بوفرة."], [32, "يملأ يديه بالبروق ويأمرها أن تصيب الهدف."], [33, "إن رعده ينذر باقتراب العاصفة، وحتى الماشية تنبيء بدنوها."]]}, {"l": "Job 37:23", "n": "", "vs": [[23, "ولا يمكننا إدراك القدير، فهو متعظم بالقوة والعدل والبر ولا يجور،"]]}, {"l": "Job 38:4-41", "n": "", "vs": [[4, "أين كنت عندما أسست الأرض؟ أخبرني إن كنت ذا حكمة."], [5, "من حدد مقاييسها، إن كنت حقا تعرف؟ أو من مد عليها خيط القياس؟"], [6, "على أي شيء استقرت قواعدها؟ ومن وضع حجر زاويتها؟"], [7, "بينما كانت كواكب السماء تترنم معا وملائكة الله تهتف بفرح."], [8, "من حجز البحر ببوابات، عندما اندفق من رحم الأرض،"], [9, "حين جعلت السحب لباسا له والظلمة قماطه،"], [10, "عندما عينت له حدودا، وأثبت بواباته ومغاليقه في مواضعها،"], [11, "وقلت له: إلى هنا تخومك فلا تتعداها، وهنا يتوقف عتو أمواجك؟"], [12, "هل أمرت مرة الصبح في أيامك، وأريت الفجر موضعه،"], [13, "ليقبض على أكناف الأرض وينفض الأشرار منها؟"], [14, "تتشكل كطين تحت الخاتم، وتبدو معالمها كمعالم الرداء."], [15, "يمتنع النور عن الأشرار، وتتحطم ذراعهم المرتفعة."], [16, "هل غصت إلى ينابيع البحر، أم دلفت إلى مقاصير اللجج؟"], [17, "هل اطلعت على أبواب المنية، أم رأيت بوابات ظلال الموت؟"], [18, "هل أحطت بعرض الأرض؟ أخبرني إن كنت بكل هذا عليما."], [19, "أين الطريق إلى مقر النور، وأين مستقر الظلمة؟"], [20, "حتى تقودها إلى تخومها وتعرف سبل مسكنها؟"], [21, "حقا أنت تعرفها لأنك آنئذ كنت قد ولدت وعشت أياما طويلة!"], [22, "هل دلفت إلى مخازن الثلج، أم رأيت خزائن البرد،"], [23, "التي ادخرتها لأوقات الضيق، ليوم المعركة والحرب؟"], [24, "ما هو السبيل إلى موضع انتشار النور، أو أين تتوزع الريح الشرقية على الأرض؟"], [25, "من حفر قنوات لسيول المطر، وممرا للصواعق،"], [26, "ليمطر على أرض مقفرة لا إنسان فيها،"], [27, "ليروي الأرض الخربة، وليستنبت الأرض عشبا؟"], [28, "هل للمطر أب؟ ومن أنجب قطرات الندى؟"], [29, "ومن أي أحشاء خرج الجمد، ومن ولد صقيع السماء؟"], [30, "تتجلد المياه كحجارة ويتجمد وجه الغمر."], [31, "هل تربط سلاسل الثريا، أم تفك عقد الجوزاء؟"], [32, "هل تهدي كواكب المنازل في فصولها، أم تهدي النعش مع بناته؟"], [33, "هل تعرف أحكام السماوات، أم أسست سلطتها على الأرض؟"], [34, "هل ترفع صوتك آمرا الغمام فيغمرك فيض المياه؟"], [35, "هل في وسعك أن تطلق البروق فتمضي وتقول لك: ها نحن طوع أمرك؟"], [36, "من أضفى على الغيوم حكمة وأنعم على الضباب بالفهم؟"], [37, "من له الحكمة ليحصي النجوم، ومن يصب الماء من ميازيب السماء،"], [38, "حين يتلبد التراب وتتماسك كتل الطين؟"], [39, "هل تصطاد الفريسة للبؤة، أم تشبع جوع الأشبال،"], [40, "حين تتربص في العرائن وتكمن في أوجارها؟"], [41, "من يزود الغراب بصيده إذ تنعب فراخه مستغيثة بالله، وتهيم لافتقارها إلى القوت؟"]]}, {"l": "Job 39:1-41:34", "n": "", "vs": [[1, "هل تدرك متى تلد أوعال الصخور أم ترقب مخاض الأيائل؟"], [2, "هل تحسب أشهر حملهن، وتعلم ميعاد وضعهن،"], [3, "حين يجثمن ليضعن صغارهن، ويتخلصن من آلام مخاضهن؟"], [4, "تكبر صغارهن، وتنمو في القفر، ثم تشرد ولا تعود."], [5, "من أطلق سراح الفرا وفك ربط حمار الوحش؟"], [6, "لمن أعطيت الصحراء مسكنا والأرض الملحية منزلا؟"], [7, "فيسخر من جلبة المدن ولا يسمع نداء السائق؟"], [8, "يرتاد الجبال مرعى له، ويلتمس كل ما هو أخضر،"], [9, "أيرضى الثور الوحشي أن يخدمك؟ أيبيت عند معلفك؟"], [10, "أتربطه بالنير ليجر لك المحراث، أم يمهد الوادي خلفك؟"], [11, "أتتكل عليه لقوته العظيمة، وتكلفه القيام بأعمالك؟"], [12, "أتثق بعودته حاملا إليك حنطتك ليكومها في بيدرك؟"], [13, "يرفرف جناحا النعامة بغبطة، ولكن أهما جناحان مكسوان بريش المحبة؟"], [14, "فهي تترك بيضها على الأرض ليدفأ بالتراب،"], [15, "وتنسى أن القدم قد تطأ عليه، وأن بعض الحيوانات الكاسرة قد تحطمه."], [16, "إنها تعامل صغارها بقسوة كأنها ليست لها، غير آسفة على ضياع تعبها،"], [17, "لأن الله قد أنساها الحكمة، ولم يمنحها نصيبا من الفهم."], [18, "ولكن ما إن تبسط جناحيها، لتجري حتى تهزأ بالفرس وراكبه!"], [19, "أأنت وهبت الفرس قوته، وكسوت عنقه عرفا؟"], [20, "أأنت تجعله يثب كجرادة؟ إن نخيره الهائل لمخيف."], [21, "يشق الوادي بحوافره، ويمرح في جم نشاطه، ويقتحم المعارك."], [22, "يسخر من الخوف ولا يرتاع، ولا يتراجع أمام السيف."], [23, "تصلصل عليه جعبة السهام، وأيضا بريق الرماح والحراب."], [24, "في جريه ينهب الأرض بعنفوان وغضب ولا يستقر في مكانه عند نفخ بوق الحرب."], [25, "عندما يدوي صوت البوق يقول: هه هه! ويستروح المعركة عن بعد، ويسمع زئير القادة وهتافهم."], [26, "أبحكمتك يحلق الصقر ويفرد جناحيه نحو الجنوب؟"], [27, "أبأمرك يحلق النسر ويجعل وكره في العلاء؟"], [28, "يعشش بين الصخور، ويبيت فيها وعلى جرف صخري يكون معقله."], [29, "من هناك يترصد قوته، وترقب عيناه فريسته من بعيد."], [30, "وتلغ فراخه أيضا في الدماء، وحيث تكون الجثث تتجمع النسور»."], [1, "واستطرد الرب قائلا لأيوب:"], [2, "«أيخاصم اللائم القدير؟ليجب المشتكي على الله»."], [3, "عندئذ أجاب أيوب الرب:"], [4, "«انظر، أنا حقير فبماذا أجيبك؟ ها أنا أضع يدي على فمي"], [5, "لقد تكلمت مرة ولن أجيب، ومرتين ولن أضيف»."], [6, "حينئذ أجاب الرب أيوب من العاصفة:"], [7, "«اشدد حقويك وكن رجلا، فأسألك وتجيبني."], [8, "أتشك في قضائي أو تستذنبني لتبرر نفسك؟"], [9, "أتملك ذراعا كذراع الله؟ أترعد بمثل صوته؟"], [10, "إذا تسربل بالجلال والعظمة، وتزين بالمجد والبهاء."], [11, "صب فيض غضبك، وانظر إلى كل متكبر واخفضه."], [12, "انظر إلى كل متعظم وذلله، ودس الأشرار في مواضعهم."], [13, "اطمرهم كلهم في التراب معا، واحبس وجوههم في الهاوية."], [14, "عندئذ أعترف لك بأن يمينك قادرة على إنقاذك."], [15, "انظر إلى بهيموث الذي صنعته معك، فإنه يأكل العشب كالبقر."], [16, "إن قوته في متنيه، وشدته في عضل بطنه."], [17, "ينتصب ذيله كشجرة أرز، وعضلات فخذيه مضفورة."], [18, "عظامه أنابيب نحاس وأطرافه قضبان حديد،"], [19, "إنه أعجب كل الخلائق، ولا يقدر أن يهزمه إلا الذي خلقه."], [20, "تنمو الأعشاب التي يتغذى بها على الجبال، حيث تمرح وحوش البرية."], [21, "يربض تحت شجيرات السدر، وبين الحلفاء في المستنقعات."], [22, "يستظل بشجيرات السدر، وبالصفصاف على المياه الجارية"], [23, "لا يخامره الخوف إن هاج النهر، ويظل مطمئنا ولو اندفق نهر الأردن في فمه."], [24, "من يقدر أن يصطاده من الأمام، أو يثقب أنفه بخزامة؟"], [1, "أيمكن أن تصطاد لوياثان بشص، أو تربط لسانه بحبل؟"], [2, "أتقدر أن تضع خزامة في أنفه، أو تثقب فكه بخطاف؟"], [3, "أيكثر من تضرعاته إليك أم يستعطفك؟"], [4, "أيبرم معك عهدا لتتخذه عبدا مؤبدا لك؟"], [5, "أتلاعبه كما تلاعب العصفور، أم تطوقه بترس ليكون لعبة لفتياتك؟"], [6, "أيساوم عليه التجار، أم يتقاسمونه بينهم؟"], [7, "أتثخن جلده بالحراب ورأسه بأسنة الرماح؟"], [8, "إن حاولت القبض عليه بيدك فإنك ستذكر ضراوة قتاله ولا تعود تقدم على ذلك ثانية!"], [9, "أي أمل في إخضاعه قد خاب، ومجرد النظر إليه يبعث على الفزع."], [10, "لا أحد يملك جرأة كافية ليستثيره. فمن إذا، يقوى على مجابهتي؟"], [11, "من أنا مدين له فأوفيه؟ كل ما تحت جميع السماوات هو لي."], [12, "دعني أحدثك عن أطراف لوياثان وعن قوته وتناسق قامته."], [13, "من يخلع كساءه أو يدنو من متناول صفي أضراسه؟"], [14, "من يفتح شدقيه؟ إن دائرة أسنانه مرعبة!"], [15, "ظهره مصنوع من حراشف كتروس مصفوفة متلاصقة بإحكام، وكأنها مضغوطة بخاتم،"], [16, "متلاصقة لا ينفذ من بينها الهواء،"], [17, "متصلة بعضها ببعض، متلبدة لا تنفصل."], [18, "عطاسه يومض نورا، وعيناه كأجفان الفجر،"], [19, "من فمه تخرج مشاعل ملتهبة، ويتطاير منه شرار نار،"], [20, "ينبعث من منخريه دخان وكأنه من قدر يغلي أو مرجل."], [21, "يضرم نفسه الجمر، ومن فمه ينطلق اللهب."], [22, "في عنقه تكمن قوة، وأمام عينيه يعدو الهول."], [23, "ثنايا لحمه محكمة التماسك، مسبوكة عليه لا تتحرك."], [24, "قلبه صلب كالصخر، صلد كالرحى السفلى."], [25, "عندما ينهض يدب الفزع في الأقوياء، ومن جلبته يعتريهم شلل."], [26, "لا ينال منه السيف الذي يصيبه، ولا الرمح ولا السهم ولا الحربة."], [27, "يحسب الحديد كالقش والنحاس كالخشب النخر."], [28, "لا يرغمه السهم على الفرار، وحجارة المقلاع لديه كالقش."], [29, "الهراوة في عينيه كالعصافة، ويهزأ باهتزاز الرمح المصوب إليه."], [30, "بطنه كقطع الخزف الحادة. إذا تمدد على الطين يترك آثارا مماثلة لآثار النورج."], [31, "يجعل اللجة تغلي كالقدر، والبحر يجيش كقدر الطيب."], [32, "يترك خلفه خطا من زبد أبيض، فيخال أن البحر قد أصابه الشيب."], [33, "لا نظير له فوق الأرض لأنه مخلوق عديم الخوف."], [34, "يحتقر كل ما هو متعال، وهو ملك على ذوي الكبرياء»."]]}, {"l": "Psa 40:5", "n": "", "vs": [[5, "أيها الرب إلهي، ما أكثر أعمالك العجيبة. إن تحدثت عن خططك الرائعة لنا فلن أقدر أن أحصيها. زادت عن أن تعد."]]}, {"l": "Psa 92:5", "n": "", "vs": [[5, "يارب ما أعظم أعمالك! أفكارك عميقة جدا،"]]}, {"l": "Psa 104:24", "n": "", "vs": [[24, "يارب ما أعظم أعمالك، كلها صنعت بحكمة، فامتلأت الأرض من غناك."]]}, {"l": "Isa 40:28", "n": "", "vs": [[28, "ألم تعلموا؟ ألم تسمعوا؟ إن الرب هو إله سرمدي وخالق أقاصي الأرض. لا يهن ولا يخور، وفهمه لا يستقصى."]]}, {"l": "Rom 11:33", "n": "", "vs": [[33, "فما أعمق غنى الله وحكمته وعلمه! ما أبعد أحكامه عن الفحص وطرقه عن التتبع !"]]}], "kwAr": "كذلك لا تدرك", "noteAr": ""}], "arS": [["كما", ["H834"]], [" ", []], ["تجهل", ["H3045"]], [" اتجاه ", []], ["مسار", ["H1870"]], [" ", []], ["الريح", ["H7307"]], ["، ", []], ["أو", ["H3808"]], [" ", []], ["كيف", ["H4100"]], [" تتكون ", []], ["عظام", ["H6106"]], [" ", []], ["الجنين", ["H4392"]], [" في ", []], ["رحم", ["H990"]], [" الأم، كذلك ", []], ["لا", ["H369"]], [" ", []], ["تدرك", ["H3045"]], [" ", []], ["أعمال", ["H4639"]], [" ", []], ["الله", ["H430"]], [" ", []], ["التي", ["H834"]], [" ", []], ["يجريها", ["H6213"]], [" ", []], ["كلها", ["H3605"]], [".", []]]}, {"c": 11, "v": 6, "text": "ازرع زرعك في الصباح، ولا تكف يدك عن العمل في المساء، لأنك لا تدري أيهما يفلح: أهذا المزروع في الصباح أم ذاك الذي في المساء، أم كلاهما على حد سواء؟", "groups": [{"kw": "sow", "raw": "Ecc_9:10; Isa_55:10; Hos_10:12; Mar_4:26-29; Joh_4:36-38; 2Co_9:6; 2Ti_4:2", "note": "", "refs": [{"l": "Ecc 9:10", "n": "", "vs": [[10, "وكل ما تحصل عليه من عمل، فاعمله بكل قوتك، إذ لن تجد في الهاوية التي أنت ماض إليها أي عمل أو ابتكار أو معرفة أو حكمة."]]}, {"l": "Isa 55:10", "n": "", "vs": [[10, "وكما تهطل الأمطار وينهمر الثلج من السماء، ولا ترجع إلى هناك، بل تروي الحقول والأشجار، وتجعل البذور تنبت وتنمو وتثمر زرعا للفلاح وخبزا للجياع،"]]}, {"l": "Hos 10:12", "n": "", "vs": [[12, "ازرعوا لأنفسكم بذار البر، فتحصدوا بمقتضاه ثمار الرحمة، احرثوا لكم حرثا لأن هذا أوان التماس الرب، حتى يأتي ويمطر عليكم غيوث صلاحه."]]}, {"l": "Mar 4:26-29", "n": "", "vs": [[26, "وقال: «إن ملكوت الله يشبه بإنسان يلقي البذار على الأرض،"], [27, "ثم ينام ليلا ويقوم نهارا فيما البذار يطلع وينمو، وهو لا يدري كيف يحدث الأمر."], [28, "فالأرض من ذاتها تعطي الثمر، فتطلع أولا عشبة، ثم سنبلة، ثم قمحا ملء السنبلة."], [29, "ولكن حالما ينضج الثمر، يعمل فيه المنجل إذ يكون الحصاد قد حان»."]]}, {"l": "Joh 4:36-38", "n": "", "vs": [[36, "والحاصد يأخذ أجرته، ويجمع الثمر للحياة الأبدية، فيفرح الزارع والحاصد معا،"], [37, "حتى يصدق القول: واحد يزرع، وآخر يحصد."], [38, "إني أرسلتكم لتحصدوا ما لم تتعبوا فيه، فغيركم تعبوا، وأنتم تجنون ثمر أتعابهم»."]]}, {"l": "2Co 9:6", "n": "", "vs": [[6, "فمن الحق أن من يزرع بالتقتير، يحصد أيضا بالتقتير، ومن يزرع بالبركات، يحصد أيضا بالبركات."]]}, {"l": "2Ti 4:2", "n": "", "vs": [[2, "أن تنادي بالكلمة منشغلا بها كليا، في الفرص المناسبة وغير المناسبة على السواء، وأن توبخ وتنذر وتشجع بكل صبر في التعليم."]]}], "kwAr": "ازرع زرعك", "noteAr": ""}, {"kw": "thou knowest", "raw": "Ecc_9:1; Hag_1:6-11, Hag_2:17-19; Zec_8:11, Zec_8:12; Act_11:20, Act_11:21; 1Co_3:5-7; 2Co_9:10, 2Co_9:11", "note": "", "refs": [{"l": "Ecc 9:1", "n": "", "vs": [[1, "هذا كله ادخرته في قلبي واختبرته: أن الأبرار والحكماء، وما يصدر عنهم من أعمال، في يد الله، ولا أحد يدري ما ينتظره، حبا كان أم بغضا،"]]}, {"l": "Hag 1:6-11", "n": "", "vs": [[6, "لقد زرعتم كثيرا وحصدتم قليلا. أكلتم ولم تشبعوا. شربتم ولم ترتووا. اكتسيتم ولم تستدفئوا. ومن ينال أجرة سرعان ما تتبدد، وكأنها وضعت في صرة مثقوبة»."], [7, "هكذا يقول الرب القدير: «تأملوا فيما فعلتم:"], [8, "اصعدوا إلى الجبل واجلبوا خشبا وشيدوا الهيكل فأرضى عنه وأتمجد، قال الرب."], [9, "لقد توقعتم كثيرا فحصلتم على قليل، وما أتيتم به إلى البيت من غلة نفخت عليه وبددته. لماذا فعلت هذا يقول الرب القدير؟ من أجل بيتي الذي ما برح مهدما بينما كل واحد منكم منهمك في بناء بيته."], [10, "لذلك منعت السماء من فوق عنكم الندى، ومنعت الأرض غلتها."], [11, "وقضيت بالقحط على الأرض والتلال، وعلى حقول الحنطة والكروم، وأشجار الزيتون وعلى كل ما تنتجه الأرض، وعلى الناس والبهائم، وعلى كل تعب أيديكم»."]]}, {"l": "Hag 2:17-19", "n": "", "vs": [[17, "إني ابتليت تعب أيديكم بالقحط والذبول والبرد، ولكنكم لم ترجعوا تائبين إلي، يقول الرب."], [18, "ولكن تأملوا فيما يجري منذ هذا اليوم وصاعدا، من اليوم الرابع والعشرين من الشهر التاسع، منذ أن تم وضع أساس هيكل الرب. تأملوا."], [19, "هل في الأهراء بذار بعد؟ حتى الكروم والتين والرمان والزيتون لم تثمر بعد. لكن منذ هذا اليوم أبارك فيها»."]]}, {"l": "Zec 8:11", "n": "", "vs": [[11, "أما الآن فلن أتعامل مع بقية شعبي الناجية كما تعاملت معه في الأيام الغابرة، يقول الرب القدير."]]}, {"l": "Zec 8:12", "n": "", "vs": [[12, "بل يزرعون في سلام، فتعطي الكروم ثمرها والأرض غلاتها، وتجود السماء بأمطارها، وأورث بقية هذا الشعب الناجية كل هذه."]]}, {"l": "Act 11:20", "n": "", "vs": [[20, "غير أن بعضا منهم، وهم أصلا من قبرص والقيروان، وصلوا أنطاكية، وأخذوا يبشرون اليونانيين أيضا بالرب يسوع."]]}, {"l": "Act 11:21", "n": "", "vs": [[21, "فكانت يد الرب معهم، فآمن عدد كبير واهتدوا إلى الرب."]]}, {"l": "1Co 3:5-7", "n": "", "vs": [[5, "فمن هو بولس؟ ومن هو أبلوس؟ إنهما فقط خادمان آمنتم على أيديهما، وكما أنعم الرب على كل منهما."], [6, "أنا غرست وأبلوس سقى؛ ولكن الله أنمى."], [7, "فليس الغارس شيئا ولا الساقي، بل الله الذي يعطي النمو."]]}, {"l": "2Co 9:10", "n": "", "vs": [[10, "والذي يقدم بذارا للزارع، وخبزا للأكل، سيقدم لكم بذاركم ويكثره ويزيد أثمار بركم:"]]}, {"l": "2Co 9:11", "n": "", "vs": [[11, "إذ تغتنون في كل شيء، لأجل كل سخاء طوعي ينتج بنا شكرا لله"]]}], "kwAr": "لا تدري أيهما", "noteAr": ""}, {"kw": "prosper", "raw": "Heb. be right", "note": "Heb. be right", "refs": [], "kwAr": "يفلح", "noteAr": "بالعبرانية: يكون مستقيما."}], "arS": [["ازرع", ["H2232"]], [" ", []], ["زرعك", ["H2233"]], [" ", []], ["في", ["H3027"]], [" ", []], ["الصباح", ["H1242"]], ["، ", []], ["ولا", ["H408"]], [" ", []], ["تكف", ["H5117"]], [" يدك عن العمل في ", []], ["المساء", ["H6153"]], ["، ", []], ["لأنك", ["H3588"]], [" ", []], ["لا", ["H369"]], [" ", []], ["تدري", ["H3045"]], [" أيهما ", []], ["يفلح", ["H3787"]], [": ", []], ["أهذا", ["H2088"]], [" المزروع في الصباح أم ", []], ["ذاك", ["H2088"]], [" الذي في المساء، أم ", []], ["كلاهما", ["H8147", "H259"]], [" على حد ", []], ["سواء", ["H2896"]], ["؟", []]]}, {"c": 11, "v": 7, "text": "النور مبهج، وكم يلذ للعينين أن تريا الشمس.", "groups": [{"kw": "the light", "raw": "Job_33:28, Job_33:30; Psa_56:13; Pro_15:30, Pro_29:13", "note": "", "refs": [{"l": "Job 33:28", "n": "", "vs": [[28, "قد افتدى الله حياتي من الانحدار إلى الهاوية، فتنتعش حياتي لترى النور."]]}, {"l": "Job 33:30", "n": "", "vs": [[30, "ليرد نفسه عن الهاوية ليستضيء بنور الحياة."]]}, {"l": "Psa 56:13", "n": "", "vs": [[13, "لأنك أنقذت نفسي من الموت، وحفظت رجلي من الزلق، لكي أسلك أمام الله في نور الحياة."]]}, {"l": "Pro 15:30", "n": "", "vs": [[30, "البهجة المتألقة في العينين تفرح قلب الصديق، والخبر الطيب ينعش النفس."]]}, {"l": "Pro 29:13", "n": "", "vs": [[13, "في هذا يتشابه الفقير والظالم. إن الرب يعطي نورا لعيني كل منهما."]]}], "kwAr": "النور مبهج", "noteAr": ""}, {"kw": "a pleasant", "raw": "Ecc_7:11; Psa_84:11; Mat_5:45", "note": "", "refs": [{"l": "Ecc 7:11", "n": "", "vs": [[11, "الحكمة مع الميراث صالحة وذات منفعة للأحياء."]]}, {"l": "Psa 84:11", "n": "", "vs": [[11, "لأن الرب الإله شمس وترس. الرب يعطي نعمة ومجدا؛ لا يمنع أي خير عن السالكين بالاستقامة."]]}, {"l": "Mat 5:45", "n": "", "vs": [[45, "فتكونوا أبناء أبيكم الذي في السماوات: فإنه يشرق بشمسه على الأشرار والصالحين، ويمطر على الأبرار وغير الأبرار."]]}], "kwAr": "وكم يلذ", "noteAr": ""}], "arS": [["النور", ["H216"]], [" ", []], ["مبهج", ["H4966"]], ["، وكم ", []], ["يلذ", ["H2896"]], [" ", []], ["للعينين", ["H5869"]], [" أن ", []], ["تريا", ["H7200"]], [" ", []], ["الشمس", ["H8121"]], [".", []]]}, {"c": 11, "v": 8, "text": "إن عاش الإنسان سنين كثيرة وتمتع فيها جميعا، فليتذكر الأيام السوداء، لأنها ستكون عديدة. وباطل كل ما هو آت!", "groups": [{"kw": "", "raw": "if a man, Ecc_6:6, Ecc_8:12", "note": "if a man, Ecc_6:6, Ecc_8:12", "refs": [{"l": "Ecc 6:6", "n": "", "vs": [[6, "من الذي يعيش ألفي سنة، ولكنه يخفق في الاستمتاع بالخيرات. ألا يذهب كلاهما، في نهاية المطاف، إلى موضع واحد؟"]]}, {"l": "Ecc 8:12", "n": "", "vs": [[12, "ومع أن الخاطيء يرتكب الشر مئة مرة وتطول أيامه، إلا أنني أعلم أنه يكون خير لمتقي الله الذين يخشعون في حضرته."]]}], "kwAr": "", "noteAr": "أي: إن عاش إنسان. انظر جا 6: 6؛ 8: 12"}, {"kw": "rejoice", "raw": "Ecc_3:12, Ecc_3:13, Ecc_5:18-20, Ecc_8:15", "note": "", "refs": [{"l": "Ecc 3:12", "n": "", "vs": [[12, "فأيقنت أنه ليس أفضل لهم من أن يفرحوا ويمتعوا أنفسهم وهم مازالوا على قيد الحياة."]]}, {"l": "Ecc 3:13", "n": "", "vs": [[13, "إن من نعم الله على الإنسان أن يأكل ويشرب ويستمتع بما يجنيه من كده."]]}, {"l": "Ecc 5:18-20", "n": "", "vs": [[18, "فتأمل ما وجدت: من الأفضل والأليق أن يأكل الإنسان ويشرب ويستمتع بما تكبده من عناء تحت الشمس طوال أيام حياته القليلة التي وهبها الله له، لأن هذا هو حظه."], [19, "وكل إنسان حباه الله بالثروة، جعله يستمتع بها، ويتنعم بنصيبه منها ليفرح بتعبه. فهذا أيضا عطية الله له."], [20, "عندئذ لا يكثر من ذكر أيام حياته الباطلة لأن الله يلهيه بفرح قلبه."]]}, {"l": "Ecc 8:15", "n": "", "vs": [[15, "فأطريت المسرة لأنه ليس للمرء خير تحت الشمس أفضل من أن يأكل ويشرب ويمتع نفسه، فهذا ما يبقى له من عنائه مدة أيام حياته التي أنعم بها الله عليه تحت الشمس."]]}], "kwAr": "وتمتع", "noteAr": ""}, {"kw": "yet", "raw": "Ecc_7:14, Ecc_12:1-5; Deu_32:29; Job_10:22, Job_14:10, Job_15:23, Job_18:18; Jer_13:16; Joe_2:2; Mat_22:13; Joh_12:35; Jud_1:18", "note": "", "refs": [{"l": "Ecc 7:14", "n": "", "vs": [[14, "افرح في يوم السراء، واعتبر في يوم الضراء. إن الرب قد جعل السراء مع الضراء، لئلا يكتشف الإنسان شيئا مما يحدث بعد موته."]]}, {"l": "Ecc 12:1-5", "n": "", "vs": [[1, "فاذكر خالقك في أيام حداثتك قبل أن تقبل عليك أيام الشر، أو تغلب عليك السنون، حين تقول: ليس لي فيها لذة."], [2, "قبل أن تظلم في عينيك الشمس والنور والقمر والكواكب، وترجع سحب الحزن في أعقاب المطر"], [3, "في يوم ترتعد فيه حفظة البيت (أي الأذرع)، وينحني الرجال الأشداء (أي الأرجل القوية)، وتكف الطواحين (أي الأسنان) لقلتها، وتظلم العيون المطلة من بين الأجفان."], [4, "وتوصد أبواب الشفاه على الشارع (أي الفم) ويتلاشى صوت الأسنان، ويستيقظ الرجال عند زقزقة العصفور، ولكن تغريدها يكون خافتا في مسامعك."], [5, "يوم يفزع الرجال من العلو، ويتخوفون من أخطار الطريق، ويزهر الشيب، ويصبح الجراد ثقيلا على كتف المرء، وتموت الرغبة. عندئذ يمضي الإنسان إلى مقره الأبدي، ويطوف النادبون في الشوارع."]]}, {"l": "Deu 32:29", "n": "", "vs": [[29, "لو عقلوا لفطنوا لمآلهم وتأملوا في مصيرهم،"]]}, {"l": "Job 10:22", "n": "", "vs": [[22, "إلى أرض الظلمة المتكاثفة والفوضى، حيث الإشراق فيها كالليل البهيم»."]]}, {"l": "Job 14:10", "n": "", "vs": [[10, "أما الإنسان فإنه يموت ويبلى، يلفظ آخر أنفاسه، فأين هو؟"]]}, {"l": "Job 15:23", "n": "", "vs": [[23, "يهيم بحثا عن لقمة العيش، وهو يعلم أن يوم الظلمة آت وشيكا."]]}, {"l": "Job 18:18", "n": "", "vs": [[18, "يطرد من النور إلى الظلمة، وينفى من المسكونة."]]}, {"l": "Jer 13:16", "n": "", "vs": [[16, "مجدوا الرب إلهكم قبل أن يجعل الظلام يخيم عليكم، وقبل أن تتعثر أقدامكم على الجبال المعتمة. أنتم ترتقبون النور ولكنه يحوله إلى ظلام الموت ويجعله ليلا دامسا."]]}, {"l": "Joe 2:2", "n": "", "vs": [[2, "هو يوم ظلمة وتجهم، يوم غيوم مكفهرة وقتام دامس،فيه تزحف أمة قوية وعظيمة كما يزحف الظلام على الجبال، أمة لم يكن لها شبيه في سالف الزمان، ولن يكون لها نظير من بعدها عبر سني الأجيال."]]}, {"l": "Mat 22:13", "n": "", "vs": [[13, "فأمر الملك خدامه قائلا: قيدوا رجليه ويديه، واطرحوه في الظلام الخارجي، هنالك يكون البكاء وصرير الأسنان!"]]}, {"l": "Joh 12:35", "n": "", "vs": [[35, "فقال لهم يسوع: «النور باق معكم وقتا قصيرا. فواصلوا سيركم مادام النور يشرق عليكم، لئلا يطبق عليكم الظلام، فإن الذي يمشي في الظلام لا يعلم أين يذهب."]]}, {"l": "Jud 1:18", "n": "", "vs": [[18, "فقد سبق أن نبهوكم إلى أنه، في نهاية الزمان، سيطلع مستهزئون يعيشون منغمسين في شهواتهم الفاسقة."]]}], "kwAr": "فليتذكر", "noteAr": ""}, {"kw": "All that", "raw": "Ecc_2:1-11, Ecc_2:15, Ecc_2:17, Ecc_2:19, Ecc_2:21-23, Ecc_2:26, Ecc_4:8, Ecc_4:16, Ecc_5:15, Ecc_5:16, Ecc_6:11", "note": "", "refs": [{"l": "Ecc 2:1-11", "n": "", "vs": [[1, "فناجيت نفسي: تعالي الآن أمتحنك بالفرح، فأستمتع باللذة! وإذا هذا أيضا باطل."], [2, "قلت عن الضحك: هذا جنون، وعن اللذة ما جدواها."], [3, "وبعد أن فحصت قلبي، حاولت أن أشرح صدري بالخمر، مع أن عقلي مازال يرشدني بالحكمة، وأن أختبر الحماقة حتى أرى ما هو صالح لأبناء البشر فيصنعوه تحت السماء طوال أيام حياتهم."], [4, "فأنجزت أعمالا عظيمة، وشيدت لي بيوتا وغرست كروما."], [5, "وأنشأت لنفسي جنات وبساتين غرستها أشجارا من جميع الأصناف،"], [6, "وحفرت برك مياه لأروي الأشجار النامية،"], [7, "واشتريت عبيدا وإماء، وكان لي عبيد ممن ولدوا في داري، واقتنيت أيضا قطعان بقر ومواشي غنم، حتى فقت جميع أسلافي ممن كانوا قبلي في أورشليم."], [8, "واكتنزت لنفسي فضة وذهبا، وكنوز الملوك والأقاليم، واتخذت لنفسي مغنين ومغنيات وزوجات وسراري، وكل ما هو متعة لقلب أبناء البشر."], [9, "وازددت عظمة حتى فقت جميع أسلافي في أورشليم، دون أن تبارحني الحكمة."], [10, "ولم أحرم عيني مما اشتهتاه، ولم أصد قلبي عن أية متعة، فابتهج قلبي لكل تعبي، وكان هذا ثوابي عن كل مشقتي."], [11, "ثم تأملت كل ما صنعته يداي وما كابدته من تعب في عمله، فإذا الجميع باطل، وكملاحقة الريح، ولا جدوى من شيء تحت الشمس."]]}, {"l": "Ecc 2:15", "n": "", "vs": [[15, "ثم حدثت نفسي: إن ما يحدث للجاهل يحدث لي أيضا، فلماذا أنا أوفر حكمة؟ فناجيت قلبي: وهذا أيضا باطل،"]]}, {"l": "Ecc 2:17", "n": "", "vs": [[17, "فكرهت الحياة، لأن ما تم صنعه تحت الشمس كان مثار أسى لي، فكل شيء باطل كملاحقة الريح."]]}, {"l": "Ecc 2:19", "n": "", "vs": [[19, "ومن يدري: أيكون حكيما أم جاهلا؟ ومع ذلك فإنه سيتولى كل عملي الذي بذلت فيه كل جهدي وحكمتي تحت الشمس. وهذا أيضا باطل."]]}, {"l": "Ecc 2:21-23", "n": "", "vs": [[21, "إذ قد يترك الإنسان كل ما تعب فيه بحكمة ومعرفة وحذاقة لرجل آخر يتمتع بما لم يشق به. هذا أيضا باطل وشر عظيم."], [22, "فأي نفع للإنسان من جميع تعبه ومكابدته العناء الذي قاسى منه تحت الشمس؟"], [23, "كل أيام حياته مفعمة بالمشقة، وعمله عناء. حتى في الليل لا يستريح قلبه. وهذا أيضا باطل."]]}, {"l": "Ecc 2:26", "n": "", "vs": [[26, "لأن المرء الذي يحظى برضى الله ينعم الله عليه بالحكمة والمعرفة والفرح. أما الخاطيء فيفرض عليه عناء الجمع والادخار، ليكون ذلك من نصيب من يرضي الله . وهذا أيضا باطل كملاحقة الريح."]]}, {"l": "Ecc 4:8", "n": "", "vs": [[8, "واحد وحيد، لا ثاني له. لا ابن ولا أخ. ولا نهاية لتعبه. عينه لا تشبع من الغنى، ولا يقول: لمن أكدح وأحرم نفسي من المسرات؟ هذا أيضا باطل وعناء شاق!"]]}, {"l": "Ecc 4:16", "n": "", "vs": [[16, "ولم يكن نهاية للجماهير الذين سار في طليعتهم، غير أن الأجيال اللاحقة لا تسر به، فهذا أيضا باطل وكملاحقة الريح."]]}, {"l": "Ecc 5:15", "n": "", "vs": [[15, "عريانا يخرج المرء من رحم أمه، وعريانا يفارق الدنيا كما جاء. لا يأخذ شيئا من تعبه يحمله معه في يده."]]}, {"l": "Ecc 5:16", "n": "", "vs": [[16, "وهذا أيضا شر أليم، إذ إنه يفارق الدنيا كما جاء فأي منفعة له، إذ إن تعبه يذهب أدراج الرياح؟"]]}, {"l": "Ecc 6:11", "n": "", "vs": [[11, "في كثرة الكلام كثرة الباطل، فأي جدوى منه للإنسان؟"]]}], "kwAr": "وباطل كل ما هو آت", "noteAr": ""}], "arS": [["إن", ["H3588"]], [" ", []], ["عاش", ["H2421"]], [" ", []], ["الإنسان", ["H120"]], [" ", []], ["سنين", ["H8141"]], [" ", []], ["كثيرة", ["H7235"]], [" ", []], ["وتمتع", ["H8055"]], [" فيها ", []], ["جميعا", ["H3605"]], ["، ", []], ["فليتذكر", ["H2142"]], [" ", []], ["الأيام", ["H3117"]], [" ", []], ["السوداء", ["H2822"]], ["، ", []], ["لأنها", ["H3588"]], [" ", []], ["ستكون", ["H1961"]], [" ", []], ["عديدة", ["H7235"]], [". ", []], ["وباطل", ["H1892"]], [" ", []], ["كل", ["H3605"]], [" ما هو ", []], ["آت", ["H935"]], ["!", []]]}, {"c": 11, "v": 9, "text": "افرح أيها الشاب في حداثتك، وليمتعك قلبك في أيام شبابك، واتبع أهواء قلبك، وكل ما تشهده عيناك. ولكن اعلم أنه بسبب هذه الأمور كلها يأتي الله بك إلى كرسي القضاء.", "groups": [{"kw": "Rejoice", "raw": "1Ki_18:27, 1Ki_22:15; Luk_15:12, Luk_15:13", "note": "", "refs": [{"l": "1Ki 18:27", "n": "", "vs": [[27, "وعند الظهر سخر بهم إيليا وقال: «ادعوا بصوت أعلى فهو حقا إله! لعله مستغرق في التأمل أو في خلوة أو في سفر! أو لعله نائم فيستيقظ»."]]}, {"l": "1Ki 22:15", "n": "", "vs": [[15, "ولما حضر أمام الملك سأله: «ياميخا، هل نذهب للحرب إلى راموت جلعاد، أم نمتنع؟» فأجابه (بتهكم): «اذهب فتظفر بها لأن الرب يسلمها إلى الملك»."]]}, {"l": "Luk 15:12", "n": "", "vs": [[12, "فقال أصغرهما لأبيه: ياأبي، أعطني الحصة التي تخصني من الميراث! فقسم لهما كل ما يملكه."]]}, {"l": "Luk 15:13", "n": "", "vs": [[13, "وبعد بضعة أيام، جمع الابن الأصغر كل ما عنده، ومضى إلى بلد بعيد. وهنالك بذر حصته من المال في عيشة الخلاعة."]]}], "kwAr": "افرح أيها الشاب", "noteAr": ""}, {"kw": "in thy youth", "raw": "Ecc_12:1; 1Ki_18:12; Lam_3:27", "note": "", "refs": [{"l": "Ecc 12:1", "n": "", "vs": [[1, "فاذكر خالقك في أيام حداثتك قبل أن تقبل عليك أيام الشر، أو تغلب عليك السنون، حين تقول: ليس لي فيها لذة."]]}, {"l": "1Ki 18:12", "n": "", "vs": [[12, "وما إن أنطلق من عندك لأخبره حتى يحملك روح الرب إلى حيث لا أدري، فيأتي أخآب ولا يجدك فيقتلني، وأنا عبدك أتقي الرب منذ صباي."]]}, {"l": "Lam 3:27", "n": "", "vs": [[27, "خير للمرء أن يحمل النير في حداثته."]]}], "kwAr": "في حداثتك", "noteAr": ""}, {"kw": "walk", "raw": "Num_15:30, Num_22:32; Deu_29:19; Job_31:7; Psa_81:12; Jer_7:24, Jer_23:17; Jer_44:16, Jer_44:17; Act_14:16; Eph_2:2, Eph_2:3; 1Pe_4:3, 1Pe_4:4", "note": "", "refs": [{"l": "Num 15:30", "n": "", "vs": [[30, "أما إن تعمد أحد الخطأ، سواء كان من الإسرائيليين أم من الغرباء، فهو يزدري بي ويجب أن يستأصل من بين شعبه،"]]}, {"l": "Num 22:32", "n": "", "vs": [[32, "فقال له ملاك الرب: «لماذا ضربت الآن أتانك ثلاث مرات؟ فها أنا قد جئت لأعترضك، لأن طريقك ملتوية في نظري،"]]}, {"l": "Deu 29:19", "n": "", "vs": [[19, "فإن سمع كلام هذا القسم يستمطر بركة على نفسه قائلا: «سأكون آمنا حتى ولو أصررت على الاستمرار فى سلوك طريقي إن هذا يفضي إلى فناء الأخضر واليابس على حد سواء."]]}, {"l": "Job 31:7", "n": "", "vs": [[7, "إن حادت خطواتي عن الطريق، وغوى قلبي وراء عيني، وعلقت بيدي لطخة عار،"]]}, {"l": "Psa 81:12", "n": "", "vs": [[12, "لذلك أسلمتهم إلى عناد قلوبهم. وسلكوا وفقا لمشورات أنفسهم."]]}, {"l": "Jer 7:24", "n": "", "vs": [[24, "إلا أنهم لم يطيعوا ولم يسمعوا، بل سلكوا بمقتضى مشورات قلوبهم الشريرة وعنادهم، وأداروا لي ظهورهم بدل وجوههم."]]}, {"l": "Jer 23:17", "n": "", "vs": [[17, "قائلين بإصرار لمن يحتقرونني: قد أعلن الرب أن السلام يسودكم ويرددون لكل من يجري وراء أهواء قلبه: لن يصيبكم ضر."]]}, {"l": "Jer 44:16", "n": "", "vs": [[16, "«لن نطيعك في ما خاطبتنا به من كلام باسم الرب،"]]}, {"l": "Jer 44:17", "n": "", "vs": [[17, "بل نعمل بمقتضى ما تعهدنا به، فنحرق بخورا لملكة السماء ونقرب لها السكائب كما سبق أن فعلنا نحن وآباؤنا وملوكنا ورؤساؤنا في مدن يهوذا وفي شوارع أورشليم، فكانت لنا وفرة من الطعام وتمتعنا بالخير ولم يصبنا شر."]]}, {"l": "Act 14:16", "n": "", "vs": [[16, "وقد ترك الأمم في العصور الماضية يسلكون في طرقهم،"]]}, {"l": "Eph 2:2", "n": "", "vs": [[2, "التي كنتم تسلكون فيها حسب مسرى هذا العالم، تابعين رئيس قوات الهواء، ذلك الروح العامل الآن في أبناء العصيان،"]]}, {"l": "Eph 2:3", "n": "", "vs": [[3, "الذين بينهم نحن أيضا كنا نسلك سابقا في شهوات جسدنا، عاملين ما يريده الجسد والأفكار، وكنا بالطبيعة أولاد الغضب كالآخرين أيضا."]]}, {"l": "1Pe 4:3", "n": "", "vs": [[3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}, {"l": "1Pe 4:4", "n": "", "vs": [[4, "ورفاقكم في تلك العيشة سابقا يستغربون أنكم لا تركضون معهم إلى فيض هذه الخلاعة، ويجرحون سمعتكم."]]}], "kwAr": "واتبع أهواء قلبك", "noteAr": ""}, {"kw": "in the sight", "raw": "Ecc_2:10; Gen_3:6, Gen_6:2; Jos_7:21; 2Sa_11:2-4; Mat_5:28; 1Jo_2:15, 1Jo_2:16", "note": "", "refs": [{"l": "Ecc 2:10", "n": "", "vs": [[10, "ولم أحرم عيني مما اشتهتاه، ولم أصد قلبي عن أية متعة، فابتهج قلبي لكل تعبي، وكان هذا ثوابي عن كل مشقتي."]]}, {"l": "Gen 3:6", "n": "", "vs": [[6, "وعندما شاهدت المرأة أن الشجرة لذيذة للمأكل وشهية للعيون، ومثيرة للنظر قطفت من ثمرها وأكلت، ثم أعطت زوجها أيضا فأكل معها،"]]}, {"l": "Gen 6:2", "n": "", "vs": [[2, "انجذبت أنظار أبناء الله إلى بنات الناس فرأوا أنهن جميلات فاتخذوا لأنفسهم منهن زوجات حسب ما طاب لهم."]]}, {"l": "Jos 7:21", "n": "", "vs": [[21, "رأيت بين الغنائم رداء شنعاريا نفيسا، ومئتي شاقل فضة (نحو كيلوجرامين ونصف)، وسبيكة من ذهب وزنها خمسون شاقلا (نحو ست مئة جرام)، فاشتهيتها وأخذتها. وها هي مطمورة في الأرض في وسط خيمتي، والفضة تحتها»."]]}, {"l": "2Sa 11:2-4", "n": "", "vs": [[2, "وفي إحدى الأمسيات نهض داود عن سريره وأخذ يتمشى على سطح قصره، فشاهد امرأة ذات جمال أخاذ تستحم."], [3, "فأرسل داود من يتحرى عنها. فأبلغه أحدهم: «هذه بثشبع بنت أليعام زوجة أوريا الحثي»،"], [4, "فبعث داود يستدعيها. فأقبلت إليه وضاجعها إذ كانت قد تطهرت من طمثها، ثم رجعت إلى بيتها."]]}, {"l": "Mat 5:28", "n": "", "vs": [[28, "أما أنا فأقول لكم: كل من ينظر إلى امرأة بقصد أن يشتهيها، فقد زنى بها في قلبه!"]]}, {"l": "1Jo 2:15", "n": "", "vs": [[15, "لا تحبوا العالم، ولا الأشياء التي في العالم. فالذي يحب العالم، لا تكون محبة الآب في قلبه."]]}, {"l": "1Jo 2:16", "n": "", "vs": [[16, "لأن كل ما في العالم، من شهوات الجسد وشهوات العين وترف المعيشة، ليس من الآب، بل من العالم."]]}], "kwAr": "تشهده عيناك", "noteAr": ""}, {"kw": "know", "raw": "Ecc_3:17, Ecc_12:14; Psa_50:4-6; Act_17:30, Act_17:31, Act_24:25; Rom_2:5-11, Rom_14:10; 1Co_4:5; 2Co_5:10; 2Pe_3:7; Heb_9:27; Rev_20:12-15", "note": "", "refs": [{"l": "Ecc 3:17", "n": "", "vs": [[17, "فقلت في نفسي: إن الله سيحكم على الصديق وعلى الشرير، لأن لكل عمل ولكل أمر وقتا هناك."]]}, {"l": "Ecc 12:14", "n": "", "vs": [[14, "لأن الله سيدين كل عمل مهما كان خفيا، سواء كان خيرا أم شرا."]]}, {"l": "Psa 50:4-6", "n": "", "vs": [[4, "ينادي السماوات من العلى، والأرض أيضا من تحت لكي يدين شعبه، قائلا:"], [5, "«اجمعوا إلي أتقيائي الذين قطعوا معي عهدا على ذبيحة»."], [6, "فتذيع السماوات عدله لأن الله هو الديان."]]}, {"l": "Act 17:30", "n": "", "vs": [[30, "فالله الآن يدعو جميع الناس في كل مكان أن يرجعوا إليه تائبين، وقد غض النظر عن أزمنة الجهل التي مرت،"]]}, {"l": "Act 17:31", "n": "", "vs": [[31, "لأنه حدد يوما يدين فيه العالم بالعدل على يد رجل اختاره لذلك. وقد قدم للجميع برهانا، إذ أقامه من بين الأموات»."]]}, {"l": "Act 24:25", "n": "", "vs": [[25, "ولما تحدث بولس عن البر وضبط النفس والدينونة الآتية ارتعب فيلكس، وقال لبولس: «اذهب الآن، ومتى توفر لي الوقت أستدعيك ثانية»."]]}, {"l": "Rom 2:5-11", "n": "", "vs": [[5, "ولكنك بسبب قساوتك وقلبك غير التائب، تخزن لنفسك غضبا ليوم الغضب، يوم تعلن دينونة الله العادلة."], [6, "فإنه سيجازي كل إنسان بحسب أعماله."], [7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"], [8, "ويكون الغضب والسخط للمخاصمين الذين يرفضون الطاعة للحق ولكنهم يخضعون للإثم."], [9, "فالشدة والضيق على نفس كل إنسان يعمل الشر اليهودي أولا ثم اليوناني؛"], [10, "والمجد والكرامة والسلام لكل من يعمل الصلاح اليهودي أولا، ثم اليوناني ."], [11, "فليس عند الله تحيز."]]}, {"l": "Rom 14:10", "n": "", "vs": [[10, "ولكن، لماذا أنت تدين أخاك؟ وأنت أيضا، لماذا تحتقر أخاك؟ فإننا جميعا سوف نقف أمام عرش الله لنحاسب."]]}, {"l": "1Co 4:5", "n": "", "vs": [[5, "إذن، لا تحكموا في شيء قبل الأوان، ريثما يرجع الرب الذي سيسلط النور على الأشياء التي يحجبها الظلام الآن، ويكشف نيات القلوب، عندئذ ينال كل واحد حقه من المدح من عند الله!"]]}, {"l": "2Co 5:10", "n": "", "vs": [[10, "إذ لابد أن نقف جميعا مكشوفين أمام عرش المسيح، لينال كل واحد منا استحقاق ما عمله حين كان في الجسد، أصالحا كان أم رديئا!"]]}, {"l": "2Pe 3:7", "n": "", "vs": [[7, "أما السماوات والأرض الحالية، فستبقى مخزونة ومحفوظة للنار بتلك الكلمة عينها إلى يوم الدينونة وهلاك الفاجرين!"]]}, {"l": "Heb 9:27", "n": "", "vs": [[27, "فكما أن مصير الناس المحتوم، هو أن يموتوا مرة واحدة ثم تأتي الدينونة،"]]}, {"l": "Rev 20:12-15", "n": "", "vs": [[12, "ورأيت الأموات، كبارا وصغارا، واقفين قدام العرش. وفتحت الكتب، ثم فتح كتاب آخر هو سجل الحياة، ودين الأموات بحسب ما هو مدون في تلك الكتب، كل واحد حسب أعماله."], [13, "وسلم البحر من فيه من الأموات، وسلم الموت وهاوية الموتى الأموات الذين فيهما، وحكم على كل واحد بحسب أعماله."], [14, "وطرح الموت وهاوية الموتى في بحيرة النار، الذي هو الموت الثاني."], [15, "وكل من لم يوجد اسمه مكتوبا في سجل الحياة طرح في بحيرة النار!"]]}], "kwAr": "ولكن اعلم", "noteAr": ""}], "arS": [["افرح", ["H8055"]], [" أيها ", []], ["الشاب", ["H970"]], [" في ", []], ["حداثتك", ["H3208"]], ["، ", []], ["وليمتعك", ["H3190"]], [" ", []], ["قلبك", ["H3820"]], [" في ", []], ["أيام", ["H3117"]], [" ", []], ["شبابك", ["H979"]], ["، ", []], ["واتبع", ["H1980"]], [" ", []], ["أهواء", ["H1870"]], [" ", []], ["قلبك", ["H3820"]], ["، ", []], ["وكل", ["H3605"]], [" ما ", []], ["تشهده", ["H4758"]], [" ", []], ["عيناك", ["H5869"]], [". ولكن ", []], ["اعلم", ["H3045"]], [" ", []], ["أنه", ["H3588"]], [" ", []], ["بسبب", ["H5921"]], [" ", []], ["هذه", ["H428"]], [" الأمور كلها ", []], ["يأتي", ["H935"]], [" ", []], ["الله", ["H430"]], [" بك إلى كرسي ", []], ["القضاء", ["H4941"]], [".", []]]}, {"c": 11, "v": 10, "text": "فأزل الغم من صدرك، واقص الشر عن جسدك، لأن الحداثة والشباب باطلان.", "groups": [{"kw": "remove", "raw": "Ecc_12:1; Job_13:26; Psa_25:7; 2Pe_3:11-14", "note": "", "refs": [{"l": "Ecc 12:1", "n": "", "vs": [[1, "فاذكر خالقك في أيام حداثتك قبل أن تقبل عليك أيام الشر، أو تغلب عليك السنون، حين تقول: ليس لي فيها لذة."]]}, {"l": "Job 13:26", "n": "", "vs": [[26, "فأنت كتبت علي أمورا مرة، وأورثتني آثام صباي."]]}, {"l": "Psa 25:7", "n": "", "vs": [[7, "لا تذكر خطايا صباي التي ارتكبتها، ولا معاصي، بل اذكرني وفقا لرحمتك ومن أجل جودتك يارب."]]}, {"l": "2Pe 3:11-14", "n": "", "vs": [[11, "ومادامت هذه الأشياء جميعا ستنحل، فكيف يجب أن تكونوا أنتم أصحاب سلوك مقدس يتصف بالتقوى،"], [12, "منتظرين «يوم الله» الأبدي وطالبين حلوله بسرعة. ففي ذلك اليوم، تنحل السماوات ملتهبة، وتذوب العناصر محترقة."], [13, "إلا أننا، وفقا لوعد الرب، ننتظر سماوات جديدة وأرضا جديدة، حيث يسكن البر."], [14, "فبينما تنتظرون إتمام هذا الوعد، أيها الأحباء، اجتهدوا أن يجدكم الرب في سلام، خالين من الدنس والعيب."]]}], "kwAr": "فأزل", "noteAr": ""}, {"kw": "sorrow", "raw": "or, anger, Psa_90:7-11", "note": "or, anger, Psa_90:7-11", "refs": [{"l": "Psa 90:7-11", "n": "", "vs": [[7, "إن غضبك قد أفنانا وسخطك قد روعنا."], [8, "جعلت آثامنا أمامك وخطايانا الخفية ظاهرة لديك."], [9, "لأن أيامنا كلها تنقضي في غضبك الشديد، وأعوامنا تتلاشى كزفرة."], [10, "قد نعيش سبعين سنة، وإن كنا ذوي عافية فثمانين وأفضل أيامنا تعب وبلية، لأنها سرعان ما تزول فنطير."], [11, "من يعرف شدة غضبك؟ إن سخطك هو بحسب مهابتك؟"]]}], "kwAr": "الغم", "noteAr": "أو: الغضب. انظر مز 90: 7-11"}, {"kw": "and put", "raw": "Job_20:11; 2Co_7:1; 2Ti_2:22", "note": "", "refs": [{"l": "Job 20:11", "n": "", "vs": [[11, "(لا تجديه) حيوية عظامه لأنها تدفن في عز قوته،"]]}, {"l": "2Co 7:1", "n": "", "vs": [[1, "فإذ نلنا هذه الوعود، أيها الأحباء، لنطهر أنفسنا من كل ما يدنس الجسد والروح، ونكمل القداسة في مخافة الله."]]}, {"l": "2Ti 2:22", "n": "", "vs": [[22, "إنما اهرب من الشهوات الشبابية، واسع وراء البر والإيمان والمحبة والسلام، مشاركا الذين يدعون الرب من قلب نقي."]]}], "kwAr": "واقص الشر", "noteAr": ""}, {"kw": "for", "raw": "Ecc_1:2, Ecc_1:14; Psa_39:5; Pro_22:15", "note": "", "refs": [{"l": "Ecc 1:2", "n": "", "vs": [[2, "يقول الجامعة: باطل الأباطيل، باطل الأباطيل، كل شيء باطل."]]}, {"l": "Ecc 1:14", "n": "", "vs": [[14, "لقد شاهدت كل الأشياء التي تم صنعها تحت الشمس فإذا الجميع باطل كملاحقة الريح."]]}, {"l": "Psa 39:5", "n": "", "vs": [[5, "هوذا قد جعلت حياتي قصيرة، وعمري كلا شيء أمامك. كل إنسان حي ليس سوى نفخة!"]]}, {"l": "Pro 22:15", "n": "", "vs": [[15, "الحماقة متأصلة في قلب الولد، وعصا التأديب تطردها منه."]]}], "kwAr": "لأن الحداثة", "noteAr": ""}], "arS": [["فأزل", ["H5493"]], [" ", []], ["الغم", ["H3708"]], [" ", []], ["من", ["H4480"]], [" ", []], ["صدرك", ["H3820"]], ["، ", []], ["واقص", ["H5674"]], [" ", []], ["الشر", ["H7451"]], [" ", []], ["عن", ["H4480"]], [" ", []], ["جسدك", ["H1320"]], ["، ", []], ["لأن", ["H3588"]], [" ", []], ["الحداثة", ["H3208"]], [" ", []], ["والشباب", ["H7839"]], [" ", []], ["باطلان", ["H1892"]], [".", []]]}, {"c": 12, "v": 1, "text": "فاذكر خالقك في أيام حداثتك قبل أن تقبل عليك أيام الشر، أو تغلب عليك السنون، حين تقول: ليس لي فيها لذة.", "groups": [{"kw": "Remember", "raw": "Ecc_11:10; Gen_39:2, Gen_39:8, Gen_39:9, Gen_39:23; 1Sa_1:28, 1Sa_2:18, 1Sa_2:26, 1Sa_3:19-21, 1Sa_16:7, 1Sa_16:12, 1Sa_16:13, 1Sa_17:36, 1Sa_17:37; 1Ki_3:6-12, 1Ki_14:13, 1Ki_18:12; 2Ch_34:2, 2Ch_34:3; Psa_22:9, Psa_22:10; Psa_34:11, Psa_71:17, Psa_71:18; Pro_8:17, Pro_22:6; Isa_26:8; Lam_3:27; Dan_1:8, Dan_1:9, Dan_1:17; Luk_1:15, Luk_2:40-52, Luk_18:16; Eph_6:4; 2Ti_3:15", "note": "", "refs": [{"l": "Ecc 11:10", "n": "", "vs": [[10, "فأزل الغم من صدرك، واقص الشر عن جسدك، لأن الحداثة والشباب باطلان."]]}, {"l": "Gen 39:2", "n": "", "vs": [[2, "وكان الرب مع يوسف، فأفلح في أعماله، وأقام في بيت سيده المصري."]]}, {"l": "Gen 39:8", "n": "", "vs": [[8, "فأبى وقال لها: «هوذا سيدي قد عهد إلي بكل ما يملك في هذا البيت ولم يشغل نفسه بأي شأن فيه."]]}, {"l": "Gen 39:9", "n": "", "vs": [[9, "وليس في هذا البيت من هو أعظم مني. ولم يمنع عني شيئا غيرك لأنك زوجته. فكيف أقترف هذا الشر العظيم وأخطيء إلى الله؟»"]]}, {"l": "Gen 39:23", "n": "", "vs": [[23, "ولم يحاسب رئيس السجن يوسف بأي شيء أوكله إليه، لأن الرب كان معه. ومهما فعل كان الرب يكلله بالنجاح."]]}, {"l": "1Sa 1:28", "n": "", "vs": [[28, "لذلك أنا أهبه للرب جميع أيام حياته». وسجدوا هناك للرب."]]}, {"l": "1Sa 2:18", "n": "", "vs": [[18, "وكان صموئيل آنئِذ يخدم في محضر الرب وهو ما برح صبيا، يرتدي أفودا من كتان."]]}, {"l": "1Sa 2:26", "n": "", "vs": [[26, "أما الصبي صموئيل فاستمر ينمو في الصلاح ويحظى برضى الله والناس."]]}, {"l": "1Sa 3:19-21", "n": "", "vs": [[19, "وكبر الصبي. وكان الرب معه. لم يخذله قط."], [20, "وعرف جميع بني إسرائيل من دان إلى بئر سبع أن الرب قد ائتمن صموئيل ليكون له نبيا."], [21, "وظل الرب يتجلى في شيلوه حيث كان يعلن ذاته لصموئيل من خلال رسائله التي كان صموئيل يبلغها لجميع الشعب."]]}, {"l": "1Sa 16:7", "n": "", "vs": [[7, "فقال الرب لصموئيل: «لا تلق بالا إلى وسامته وطول قامته إذ ليس هذا من اخترته، فنظرة الرب تختلف عن نظرة الإنسان، لأن الإنسان ينظر إلى المظهر الخارجي وأما الرب فإنه ينظر إلى القلب»."]]}, {"l": "1Sa 16:12", "n": "", "vs": [[12, "فبعث يسى من استدعاه، وكان فتى أشقر، أخاذ العينين وسيم الطلعة. فقال الرب: « قم امسحه، لأن هذا هو من اخترته»."]]}, {"l": "1Sa 16:13", "n": "", "vs": [[13, "فتناول صموئيل قرن الز يت ومسحه أمام إخوته. ومنذ ذلك اليوم فصاعدا حل روح الرب على داود. ثم رجع صموئيل إلى الرامة."]]}, {"l": "1Sa 17:36", "n": "", "vs": [[36, "وهكذا قتل عبدك الأسد والدب كليهما، فليكن هذا الفلسطيني الأغلف كواحد منهما لأنه عير جيش الله الحي»."]]}, {"l": "1Sa 17:37", "n": "", "vs": [[37, "واستطرد داود: «إن الرب الذي أنقذني من مخالب الأسد ومن مخالب الدب، ينقذني أيضا من قبضة هذا الفلسطيني». فقال شاول لداود: «امض وليكن الرب معك»."]]}, {"l": "1Ki 3:6-12", "n": "", "vs": [[6, "فأجاب: «لقد صنعت إلى عبدك داود أبي رحمة واسعة لأنه سلك أمامك بأمانة وصلاح واستقامة قلب، فلم تحرمه من الرحمة العظيمة، ورزقته ابنا يخلفه على عرشه في هذا اليوم."], [7, "والآن أيها الرب إلهي، لقد جعلت عبدك ملكا خلفا لداود أبي، وأنا ما برحت فتى صغيرا غير متمرس بشؤون الحكم،"], [8, "وعبدك يتولى حكم شعبك الذي اخترته، وهو شعب أعظم من أن يعد أو يحصى لكثرته."], [9, "فهب عبدك قلبا فهيما لأقضي بين شعبك، وأميز بين الخير والشر، لأنه من يستطيع أن يحكم شعبك العظيم هذا؟»"], [10, "فسر الرب بطلب سليمان هذا."], [11, "وقال له: «لأنك قد طلبت هذا الأمر، ولم تطلب حياة طويلة، ولا غنى، ولا انتقاما من أعدائك، بل سألت حكمة لتسوس شؤون الحكم،"], [12, "فإنني سألبي طلبك، فأهبك قلبا حكيما مميزا، فلا يضاهيك أحد من قبل ولا من بعد."]]}, {"l": "1Ki 14:13", "n": "", "vs": [[13, "فينوح عليه الإسرائيليون ويدفنونه، لأن هذا وحده من نسل يربعام يوارى في قبر، لأن الرب إله إسرائيل قد وجد فيه، من دون سائر بيت يربعام، شيئا صالحا."]]}, {"l": "1Ki 18:12", "n": "", "vs": [[12, "وما إن أنطلق من عندك لأخبره حتى يحملك روح الرب إلى حيث لا أدري، فيأتي أخآب ولا يجدك فيقتلني، وأنا عبدك أتقي الرب منذ صباي."]]}, {"l": "2Ch 34:2", "n": "", "vs": [[2, "وكان ملكا صالحا سار في طريق جده داود من غير أن يحيد عنه يمينا أو شمالا."]]}, {"l": "2Ch 34:3", "n": "", "vs": [[3, "وفي السنة الثامنة من ملكه، وهو بعد فتى، ابتدأ يعبد إله جده داود. وفي السنة الثانية عشرة شرع يطهر أرض يهوذا وأورشليم من المرتفعات وتماثيل عشتاروث والأصنام والمسبوكات."]]}, {"l": "Psa 22:9", "n": "", "vs": [[9, "أنت أخرجتني من الرحم. أنت جعلتني أنام مطمئنا وأنا مازلت على صدر أمي."]]}, {"l": "Psa 22:10", "n": "", "vs": [[10, "أنت متكلي من قبل ميلادي، فأنت إلهي منذ كنت جنينا."]]}, {"l": "Psa 34:11", "n": "", "vs": [[11, "تعالوا أيها البنون وأصغوا إلي، فأعلمكم مخافة الرب."]]}, {"l": "Psa 71:17", "n": "", "vs": [[17, "قد علمتني ياالله منذ صباي، فلم أكف لحظة عن إعلان عجائبك."]]}, {"l": "Psa 71:18", "n": "", "vs": [[18, "لا تتركني في الشيخوخة والشيب ياالله ، حتى أخبر هذا الجيل بأعمال قدرتك، وبقوتك (الجيل) الآتي."]]}, {"l": "Pro 8:17", "n": "", "vs": [[17, "أحب من يحبونني، ومن يجد في البحث عني يعثر علي."]]}, {"l": "Pro 22:6", "n": "", "vs": [[6, "درب الولد بمقتضى مواهبه وطبيعته، فمتى شاخ لا يميل عنها."]]}, {"l": "Isa 26:8", "n": "", "vs": [[8, "انتظرناك يارب بشوق في طريق أحكامك. تتوق النفس إلى اسمك وتشتهي ذكرك."]]}, {"l": "Lam 3:27", "n": "", "vs": [[27, "خير للمرء أن يحمل النير في حداثته."]]}, {"l": "Dan 1:8", "n": "", "vs": [[8, "أما دانيآل فقد عزم في نفسه أن لا يتنجس بأطايب مأكولات الملك ولا بخمر شرابه، وطلب من رئيس الخصيان أن يعفيه من ذلك."]]}, {"l": "Dan 1:9", "n": "", "vs": [[9, "فأعطى الله دانيآل حظوة ورحمة لدى رئيس الخصيان،"]]}, {"l": "Dan 1:17", "n": "", "vs": [[17, "ووهب الله أولئك الفتيان الأربعة معرفة وعقلا في كل ضروب الكتابة والعلم. وكان دانيآل فطنا في تفسير جميع الرؤى والأحلام."]]}, {"l": "Luk 1:15", "n": "", "vs": [[15, "وسوف يكون عظيما أمام الرب، ولا يشرب خمرا ولا مسكرا، ويمتليء بالروح القدس وهو بعد في بطن أمه،"]]}, {"l": "Luk 2:40-52", "n": "", "vs": [[40, "وكان الطفل ينمو ويتقوى، ممتلئا حكمة، وكانت نعمة الله عليه."], [41, "وكان أبواه يذهبان كل سنة إلى أورشليم في عيد الفصح."], [42, "فلما بلغ سن الثانية عشرة، صعدوا إلى أورشليم كالعادة في العيد."], [43, "وبعد انتهاء أيام العيد، رجعا، وبقي الصبي يسوع في أورشليم، وهما لا يعلمان."], [44, "ولكنهما إذ ظناه بين الرفاق، سارا مسيرة يوم واحد ثم أخذا يبحثان عنه بين الأقارب والمعارف."], [45, "ولما لم يجداه، رجعا إلى أورشليم يبحثان عنه."], [46, "وبعد ثلاثة أيام وجداه في الهيكل، جالسا وسط المعلمين يستمع إليهم ويطرح عليهم الأسئلة."], [47, "وجميع الذين سمعوه ذهلوا من فهمه وأجوبته."], [48, "فلما رأياه دهشا، وقالت له أمه: «يابني، لماذا عملت بنا هكذا؟ فقد كنا، أبوك وأنا، نبحث عنك متضايقين!»"], [49, "فأجابهما: «لماذا كنتما تبحثان عني؟ ألم تعلما أن علي أن أكون في ما يخص أبي؟»"], [50, "فلم يفهما ما قاله لهما."], [51, "ثم نزل معهما ورجع إلى الناصرة، وكان خاضعا لهما. وكانت أمه تحفظ هذه الأمور كلها في قلبها."], [52, "أما يسوع، فكان يتقدم في الحكمة والقامة، وفي النعمة عند الله والناس."]]}, {"l": "Luk 18:16", "n": "", "vs": [[16, "أما يسوع فدعاهم إليه وقال: «دعوا الصغار يأتون إلي، ولا تمنعوهم: لأن لمثل هؤلاء ملكوت الله !"]]}, {"l": "Eph 6:4", "n": "", "vs": [[4, "وأنتم، أيها الآباء، لا تثيروا غضب أولادكم. وإنما ربوهم بتأديب الرب وتحريضه."]]}, {"l": "2Ti 3:15", "n": "", "vs": [[15, "وتعلم أنك منذ حداثة سنك تعرف الكتب المقدسة، وهي القادرة أن تجعلك حكيما لبلوغ الخلاص عن طريق الإيمان في المسيح يسوع."]]}], "kwAr": "فاذكر خالقك", "noteAr": ""}, {"kw": "while", "raw": "Ecc_11:8; Job_30:2; Psa_90:10; Hos_7:9", "note": "", "refs": [{"l": "Ecc 11:8", "n": "", "vs": [[8, "إن عاش الإنسان سنين كثيرة وتمتع فيها جميعا، فليتذكر الأيام السوداء، لأنها ستكون صره فعجز عن النظر."]]}, {"l": "1Sa 4:15", "n": "", "vs": [[15, "وكان عالي قد بلغ من العمر ثمان وتسعين سنة، وكانت عيناه قد كلتا جدا، فلم يعد قادرا على الإبصار."]]}, {"l": "1Sa 4:18", "n": "", "vs": [[18, "وما إن ذكر الرجل نبأ تابوت الله حتى سقط عالي عن الكرسي إلى الوراء إلى جوار الباب، فانكسرت رقبته ومات لأنه كان رجلا شيخا ثقيل الجسم. وقد قضى لبني إسرائيل مدة أربعين سنة."]]}], "kwAr": "الشمس والنور", "noteAr": ""}, {"kw": "nor", "raw": "Psa_42:7, Psa_71:20, Psa_77:16", "note": "", "refs": [{"l": "Psa 42:7", "n": "", "vs": [[7, "أمواج النكبات توالت علي كما تتوالى مياه شلالاتك."]]}, {"l": "Psa 71:20", "n": "", "vs": [[20, "أنت الذي اجتزت بنا ضيقات كثيرة وقاسية، ولكنك تعود فتحيينا، وتصعدنا من جديد من أعماق الأرض."]]}, {"l": "Psa 77:16", "n": "", "vs": [[16, "رأتك المياه ياالله فارتجفت واضطربت أعماقها أيضا."]]}], "kwAr": "وترجع سحب الحزن", "noteAr": ""}], "arS": [["قبل", ["H310"]], [" أن ", []], ["تظلم", ["H2821"]], [" في عينيك ", []], ["الشمس", ["H8121"]], [" ", []], ["والنور", ["H216"]], [" ", []], ["والقمر", ["H3394"]], [" ", []], ["والكواكب", ["H3556"]], ["، ", []], ["وترجع", ["H7725"]], [" سحب الحزن في أعقاب ", []], ["المطر", ["H1653"]]]}, {"c": 12, "v": 3, "text": "في يوم ترتعد فيه حفظة البيت (أي الأذرع)، وينحني الرجال الأشداء (أي الأرجل القوية)، وتكف الطواحين (أي الأسنان) لقلتها، وتظلم العيون المطلة من بين الأجفان.", "groups": [{"kw": "strong", "raw": "2Sa_21:15-17; Psa_90:9, Psa_90:10, Psa_102:23; Zec_8:4", "note": "", "refs": [{"l": "2Sa 21:15-17", "n": "", "vs": [[15, "ودارت حرب بعد ذلك بين الفلسطينيين وإسرائيل، فخاض داود ورجاله المعركة لمحاربة الفلسطينيين، ولكن الإعياء أصاب داود."], [16, "وهم يشبي بن بنوب، أحد أبناء رافا، أن يقتل داود، وكان وزن رمحه النحاسي ثلاث مئة شاقل (نحو ثلاثة كيلوجرامات ونصف)، وقد تقلد سيفا جديدا."], [17, "فأنجده أبيشاي بن صروية، وضرب الفلسطيني وقتله. حينئذ أقسم رجال داود عليه قائلين: «لا تخرج معنا بعد الآن إلى الحرب، ولا تطفيء بموتك سراج إسرائيل»."]]}, {"l": "Psa 90:9", "n": "", "vs": [[9, "لأن أيامنا كلها تنقضي في غضبك الشديد، وأعوامنا d is", "refs": [], "kwAr": "فلنسمع ختام الكلام كله", "noteAr": "أو: خاتمة الأمر، أي كل ما سُمع، هي:"}, {"kw": "Fear", "raw": "Ecc_5:7, Ecc_8:12; Gen_22:12; Deu_6:2, Deu_10:12; Psa_111:10, Psa_112:1, Psa_145:19, Psa_147:11; Pro_1:7, Pro_23:17; 1Pe_2:17; Rev_19:5", "note": "", "refs": [{"l": "Ecc 5:7", "n": "", "vs": [[7, "لأن في كثرة الأحلام أباطيل، وكذلك في اللغو المفرط؛ فاتق الله ."]]}, {"l": "Ecc 8:12", "n": "", "vs": [[12, "ومع أن الخاطيء يرتكب الشر مئة مرة وتطول أيامه، إلا أنني أعلم أنه يكون خير لمتقي الله الذين يخشعون في حضرته."]]}, {"l": "Gen 22:12", "n": "", "vs": [[12, "فقال: «لا تمد يدك إلى الصبي ولا توقع به ضرا لأني علمت أنك تخاف الله ولم تمنع ابنك وحيدك عني»."]]}, {"l": "Deu 6:2", "n": "", "vs": [[2, "وبذلك تتقي الرب إلهك وتمارس جميع فرائضه ووصاياه التي أنا أوصيك بها أنت وابنك وحفيدك كل أيام حياتك فتطول أيامك."]]}, {"l": "Deu 10:12", "n": "", "vs": [[12, "فالآن أيها الإسرائيليون ماذا يطلب منكم الرب إلهكم سوى أن تتقوه وتسلكوا في كل طرقه، وتحبوه وتعبدوه من كل قلوبكم ومن كل نفوسكم،"]]}, {"l": "Psa 111:10", "n": "", "vs": [[10, "رأس الحكمة مخافة الرب. والعامل بها ذو فطنة شديدة. تسبيح الرب دائم إلى الأبد."]]}, {"l": "Psa 112:1", "n": "", "vs": [[1, "هللويا! طوبى لمن يخشى الرب ويبتهج جدا بوصاياه."]]}, {"l": "Psa 145:19", "n": "", "vs": [[19, "يجيب سؤل جميع خائفيه، ويسمع تضرعهم فيخلصهم."]]}, {"l": "Psa 147:11", "n": "", "vs": [[11, "إنما يرضى الرب بخائفيه، الراجين رحمته."]]}, {"l": "Pro 1:7", "n": "", "vs": [[7, "فإن مخافة الرب هي رأس المعرفة، أما الحمقى فيستهينون بالحكمة والتأديب."]]}, {"l": "Pro 23:17", "n": "", "vs": [[17, "لا يغر قلبك من الخطاة، بل واظب على تقوى الرب اليوم كله،"]]}, {"l": "1Pe 2:17", "n": "", "vs": [[17, "أكرموا جميع الناس. أحبوا الإخوة. خافوا الله . أكرموا الملك."]]}, {"l": "Rev 19:5", "n": "", "vs": [[5, "وخرج من العرش صوت يقول: «سبحوا إلهنا ياجميع عبيده الذين يتقونه صغارا وكبارا!»"]]}], "kwAr": "اتق الله", "noteAr": ""}, {"kw": "for", "raw": "Ecc_2:3, Ecc_6:12; Job_28:28; Psa_115:13-15; Pro_19:23; Luk_1:50", "note": "", "refs": [{"l": "Ecc 2:3", "n": "", "vs": [[3, "وبعد أن فحصت قلبي، حاولت أن أشرح صدري بالخمر، مع أن عقلي مازال يرشدني بالحكمة، وأن أختبر الحماقة حتى أرى ما هو صالح لأبناء البشر فيصنعوه تحت السماء طوال أيام حياتهم."]]}, {"l": "Ecc 6:12", "n": "", "vs": [[12, "إذ من يدري ما هو خير للإنسان في الحيا ة التي يقضي فيها أياما قليلة باطلة كالظل؟ ومن يقدر أن يطلع الإنسان على ما سيحدث تحت الشمس من بعده؟"]]}, {"l": "Job 28:28", "n": "", "vs": [[28, "ثم قال للإنسان: انظر، إن مخافة الرب هي الحكمة، وتفادي الشر هو الفطنة»."]]}, {"l": "Psa 115:13-15", "n": "", "vs": [[13, "يبارك كل من يتقيه، صغارهم وكبارهم."], [14, "ليزد الرب بركته عليكم وعلى أولادكم."], [15, "ليبارككم الرب، خالق السماوات والأرض."]]}, {"l": "Pro 19:23", "n": "", "vs": [[23, "تقوى الرب تفضي إلى الحياة، وصاحبها يبيت مطمئنا ولا يناله شر."]]}, {"l": "Luk 1:50", "n": "", "vs": [[50, "ورحمته للذين يتقونه جيلا بعد جيل."]]}], "kwAr": "لأن هذا هو كل واجب الإنسان", "noteAr": ""}], "arS": [["فلنسمع", ["H8085"]], [" ", []], ["ختام", ["H5490"]], [" ", []], ["الكلام", ["H1697"]], [" ", []], ["كله", ["H3605"]], [": ", []], ["اتق", ["H3372"]], [" ", []], ["الله", ["H430"]], [" ، ", []], ["واحفظ", ["H8104"]], [" ", []], ["وصاياه", ["H4687"]], ["، ", []], ["لأن", ["H3588"]], [" ", []], ["هذا", ["H2088"]], [" هو ", []], ["كل", ["H3605"]], [" واجب ", []], ["الإنسان", ["H120"]], ["،", []]]}, {"c": 12, "v": 14, "text": "لأن الله سيدين كل عمل مهما كان خفيا، سواء كان خيرا أم شرا.", "groups": [{"kw": "", "raw": "Ecc_11:9; Psa_96:13; Mat_12:36, 25:31-46; Luk_12:1, Luk_12:2; Joh_5:29; Act_17:30, Act_17:31; Rom_2:16, Rom_14:10-12; 1Co_4:5; 2Co_5:10; Rev_20:11-15", "note": "", "refs": [{"l": "Ecc 11:9", "n": "", "vs": [[9, "افرح أيها الشاب في حداثتك، وليمتعك قلبك في أيام شبابك، واتبع أهواء قلبك، وكل ما تشهده عيناك. ولكن اعلم أنه بسبب هذه الأمور كلها يأتي الله بك إلى كرسي القضاء."]]}, {"l": "Psa 96:13", "n": "", "vs": [[13, "في حضرة الرب لأنه آت ليدين العالم بالعدل والشعوب بالحق."]]}, {"l": "Mat 12:36", "n": "", "vs": [[36, "على أني أقول لكم: إن كل كلمة باطلة يتكلم بها الناس، سوف يؤدون عنها الحساب في يوم الدينونة."]]}, {"l": "Mat 25:31-46", "n": "", "vs": [[31, "وعندما يعود ابن الإنسان في مجده ومعه جميع ملائكته، فإنه يجلس على عرش مجده،"], [32, "وتجتمع أمامه الشعوب كلها، فيفصل بعضهم عن بعض كما يفصل الراعي الغنم عن المعاز،"], [33, "فيوقف الغنم عن يمينه، والمعاز عن يساره؛"], [34, "ثم يقول الملك للذين عن يمينه: تعالوا يامن باركهم أبي، رثوا الملكوت الذي أعد لكم منذ إنشاء العالم:"], [35, "لأني جعت فأطعمتموني، عطشت فسقيتموني، كنت غريبا فآويتموني،"], [36, "عريانا فكسوتموني، مريضا فزرتموني، سجينا فأتيتم إلي!"], [37, "فيرد الأبرار قائلين: يارب، متى رأيناك جائعا فأطعمناك، أو عطشانا فسقيناك؟"], [38, "ومتى رأيناك غريبا فآويناك، أو عريانا فكسوناك؟"], [39, "ومتى رأيناك مريضا أو سجينا فزرناك؟"], [40, "فيجيبهم الملك: الحق أقول لكم: بما أنكم فعلتم ذلك بأحد إخوتي هؤلاء الصغار، فبي فعلتم!"], [41, "ثم يقول للذين عن يساره: ابتعدوا عني ياملاعين إلى النار الأبدية المعدة لإبليس وأعوانه!"], [42, "لأني جعت فلم تطعموني، وعطشت فلم تسقوني،"], [43, "كنت غريبا فلم تأووني، عريانا فلم تكسوني، مريضا وسجينا فلم تزوروني!"], [44, "فيرد هؤلاء أيضا قائلين: يارب، متى رأيناك جائعا أو عطشانا أو غريبا أو عريانا أو مريضا أو سجينا، ولم نخدمك؟"], [45, "فيجيبهم: الحق أقول لكم: بما أنكم لم تفعلوا ذلك بأحد إخوتي هؤلاء الصغار، فبي لم تفعلوا!"], [46, "فيذهب هؤلاء إلى العقاب الأبدي، والأبرار إلى الحياة الأبدية! »"]]}, {"l": "Luk 12:1", "n": "", "vs": [[1, "وفي تلك الأثناء، إذ احتشد عشرات الألوف من الشعب حتى داس بعضهم بعضا، أخذ يقول لتلاميذه أولا: «احذروا لأنفسكم من خمير الفريسيين الذي هو الريا ء!"]]}, {"l": "Luk 12:2", "n": "", "vs": [[2, "فما من مستور لن يكشف، ولا من سر لن يعرف."]]}, {"l": "Joh 5:29", "n": "", "vs": [[29, "فيخرجون منها: فالذين عملوا الصالحات يخرجون في القيامة المؤدية إلى الحياة، وأما الذين عملوا السيئات ففي القيامة المؤدية إلى الدينونة."]]}, {"l": "Act 17:30", "n": "", "vs": [[30, "فالله الآن يدعو جميع الناس في كل مكان أن يرجعوا إليه تائبين، وقد غض النظر عن أزمنة الجهل التي مرت،"]]}, {"l": "Act 17:31", "n": "", "vs": [[31, "لأنه حدد يوما يدين فيه العالم بالعدل على يد رجل اختاره لذلك. وقد قدم للجميع برهانا، إذ أقامه من بين الأموات»."]]}, {"l": "Rom 2:16", "n": "", "vs": [[16, "(وتكون الدينونة) يوم يدين الله خفايا الناس، وفقا لإنجيلي، على يد يسوع المسيح."]]}, {"l": "Rom 14:10-12", "n": "", "vs": [[10, "ولكن، لماذا أنت تدين أخاك؟ وأنت أيضا، لماذا تحتقر أخاك؟ فإننا جميعا سوف نقف أمام عرش الله لنحاسب."], [11, "فإنه قد كتب: «أنا حي، يقول الرب، لي ستنحني كل ركبة، وسيعترف كل لسان لله!»"], [12, "إذا، كل واحد منا سيؤدي حسابا عن نفسه لله."]]}, {"l": "1Co 4:5", "n": "", "vs": [[5, "إذن، لا تحكموا في شيء قبل الأوان، ريثما يرجع الرب الذي سيسلط النور على الأشياء التي يحجبها الظلام الآن، ويكشف نيات القلوب، عندئذ ينال كل واحد حقه من المدح من عند الله!"]]}, {"l": "2Co 5:10", "n": "", "vs": [[10, "إذ لابد أن نقف جميعا مكشوفين أمام عرش المسيح، لينال كل واحد منا استحقاق ما عمله حين كان في الجسد، أصالحا كان أم رديئا!"]]}, {"l": "Rev 20:11-15", "n": "", "vs": [[11, "ثم رأيت عرشا عظيما أبيض هربت السماء والأرض من أمام الجالس عليه، فلم يبق لهما مكان."], [12, "ورأيت الأموات، كبارا وصغارا، واقفين قدام العرش. وفتحت الكتب، ثم فتح كتاب آخر هو سجل الحياة، ودين الأموات بحسب ما هو مدون في تلك الكتب، كل واحد حسب أعماله."], [13, "وسلم البحر من فيه من الأموات، وسلم الموت وهاوية الموتى الأموات الذين فيهما، وحكم على كل واحد بحسب أعماله."], [14, "وطرح الموت وهاوية الموتى في بحيرة النار، الذي هو الموت الثاني."], [15, "وكل من لم يوجد اسمه مكتوبا في سجل الحياة طرح في بحيرة النار!"]]}], "kwAr": "", "noteAr": ""}], "arS": [["لأن", ["H3588"]], [" ", []], ["الله", ["H430"]], [" ", []], ["سيدين", ["H4941"]], [" ", []], ["كل", ["H3605"]], [" ", []], ["عمل", ["H4639"]], [" مهما كان خفيا، سواء كان ", []], ["خيرا", ["H2896"]], [" أم ", []], ["شرا", ["H7451"]], [".", []]]}], "strong": true}];</script>
