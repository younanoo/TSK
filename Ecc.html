4:22; Isa_59:14; Mic_2:2, Mic_7:3; Zep_3:3; Mat_26:59; Act_23:3; Jam_2:6", "note": "", "refs": [{"l": "Ecc 4:1", "n": "", "vs": [[1, "ثم تأملت حولي فرأيت جميع المظالم التي ترتكب تحت الشمس. شهدت دموع المظلومين الذين لا معزي لهم، أما ظالموهم فيتمتعون بالقوة، غير أن المظلومين لا معزي لهم."]]}, {"l": "Ecc 5:8", "n": "", "vs": [[8, "إن شهدت في البلاد الفقير مظلوما، والحق والعدل مزهوقين فلا تعجب من الأمر، فإن فوق المسئول الكبير مسئولا أعلى منه رتبة يراقبه وفوقهما من هو أعظم مقاما منهما."]]}, {"l": "1Ki 21:9-21", "n": "", "vs": [[9, "وقالت فيها: «ادعوا الشعب للصوم، وأجلسوا نابوت في مكان الصدارة،"], [10, "وأقيموا شاهدي زور ليشهدا أن نابوت جدف على الله وعلى الملك، ثم أخرجوه من المدينة وارجموه حتى يموت»."], [11, "فنفذ شيوخ مدينته ووجهاؤها أوامر إيزابل كما هي واردة في الرسائل التي بعثت بها إليهم."], [12, "فتداعوا للصوم، وأجلسوا نابوت في مكان الصدارة."], [13, "ثم أقبل شاهدا زور وجلسا تجاهه، وشهدا على نابوت أمام الشعب قائلين: «قد جدف نابوت على الله وعلى الملك». فجروه إلى خارج المدينة ورجموه بالحجارة حتى مات."], [14, "وأبلغوا إيزابل أن نابوت قد رجم فمات."], [15, "فلما سمعت إيزابل بموت نابوت قالت لأخآب: «قم ورث كرم نابوت اليزرعيلي، الذي أبى أن يبيعك إياه بفضة، لأن نابوت قد أصبح في عداد الأموات»."], [16, "عندئذ قام أخآب ونزل ليتفقد كرم نابوت ويستولي عليه."], [17, "ولكن الرب قال لإيليا التشبي:"], [18, "«قم امض للقاء أخآب ملك إسرائيل المقيم في السامرة، فها هو قد نزل إلى كرم نابوت ليستولي عليه،"], [19, "وقل له: هذا ما يقوله الرب: هل قتلت وامتلكت أيضا؟ في المكان الذي لعقت فيه الكلاب دم نابوت تلعق الكلاب دمك أيضا»."], [20, "وما إن رأى أخآب إيليا حتى قال: «هل وجدتني ياعدوي؟» فأجابه: «قد وجدتك لأنك بعت نفسك لارتكاب الشر في عيني الرب."], [21, "لهذا يقول الرب: ها أنا أجلب عليك شرا وأبيد ذريتك وأفني كل ذكر لك، حرا كان أم عبدا."]]}, {"l": "Psa 58:1", "n": "", "vs": [[1, "أحقا تنطقون بالحق أيها الحكام، وتقضون بالاستقامة يابني البشر؟"]]}, {"l": "Psa 58:2", "n": "", "vs": [[2, "لا! إنما تضمرون الباطل في القلب وترتكب أيديكم الظلم في الأرض."]]}, {"l": "Psa 82:2-5", "n": "", "vs": [[2, "حتى متى تقضون بالظلم وتنحازون إلى الأشرار؟"], [3, "احكموا للذليل واليتيم. وأنصفوا المسكين والبائس."], [4, "أنقذوا المسكين والفقير؛ أنقذوهما من قبضة الأشرار."], [5, "هم من غير معرفة وفهم، يتمشون في الظلمة وتتزعزع أسس الأرض من كثرة الجور."]]}, {"l": "Psa 94:21", "n": "", "vs": [[21, "يجتمعون معا للقضاء على حياة الصديق، ويحكمون على البريء بالموت."]]}, {"l": "Psa 94:22", "n": "", "vs": [[22, "ولكن الرب هو حصني المنيع؛ إلهي هو الصخرة التي بها أحتمي."]]}, {"l": "Isa 59:14", "n": "", "vs": [[14, "قد ارتد عنا الإنصاف، ووقف العدل بعيدا، إذ سقط الحق صريعا في الشوارع، والبر لم يستطع الدخول."]]}, {"l": "Mic 2:2", "n": "", "vs": [[2, "يشتهون حقولا ويغتصبونها، وبيوتا فيستولون عليها. يجورون على الرجل وعلى بيته والإنسان وميراثه."]]}, {"l": "Mic 7:3", "n": "", "vs": [[3, "تجد أيديهم في ارتكاب الشر، ويسعى الرئيس والقاضي وراء الرشوة، ويملي العظيم عليهم أهواء نفسه، فيتآمرون جميعا على الحق."]]}, {"l": "Zep 3:3", "n": "", "vs": [[3, "رؤساؤها في داخلها أسود زائرة، وقضاتها كذئاب المساء الجائعة التي لا تبقي شيئا من فرائسها إلى الصباح."]]}, {"l": "Mat 26:59", "n": "", "vs": [[59, "وانعقد المجلس من رؤساء الكهنة والشيوخ كلهم، وبحثوا عن شهادة زور على يسوع، ليحكموا عليه بالموت،"]]}, {"l": "Act 23:3", "n": "", "vs": [[3, "فقال له بولس: «ضربك الله ، ياحائط المقبرة المطلي بالكلس! كيف تجلس لتحاكمني وفقا للشريعة، ثم تخالف الشريعة فتأمر بضربي؟»"]]}, {"l": "Jam 2:6", "n": "", "vs": [[6, "ولكنكم أنتم عاملتم الفقير معاملة مهينة. ألا تعرفون أن الأغنياء هم الذين يتسلطون عليكم ويجرونكم إلى المحاكم،"]]}], "kwAr": "", "noteAr": ""}], "arS": [["ورأيت", ["H7200"]], [" ", []], ["أيضا", ["H5750"]], [" ", []], ["تحت", ["H8478"]], [" ", []], ["الشمس", ["H8121"]], [": ", []], ["الجور", ["H4941", "H7562"]], [" في ", []], ["موضع", ["H4725"]], [" ", []], ["العدل", ["H6664"]], ["، ", []], ["والظلم", ["H7562"]], [" في ", []], ["موضع", ["H4725"]], [" الحق.", []]]}, {"c": 3, "v": 17, "text": "فقلت في نفسي: إن الله سيحكم على الصديق وعلى الشرير، لأن لكل عمل ولكل أمر وقتا هناك.", "groups": [{"kw": "said", "raw": "Ecc_1:16, Ecc_2:1", "note": "", "refs": [{"l": "Ecc 1:16", "n": "", "vs": [[16, "فقلت لنفسي: قد عظمت ونموت في الحكمة أكثر من كل أسلافي الذين حكموا أورشليم من قبلي، وقد عرف قلبي كثيرا من الحكمة والعلم."]]}, {"l": "Ecc 2:1", "n": "", "vs": [[1, "فناجيت نفسي: تعالي الآن أمتحنك بالفرح، فأستمتع باللذة! وإذا هذا أيضا باطل."]]}], "kwAr": "فقلت في نفسي", "noteAr": ""}, {"kw": "God", "raw": "Ecc_12:14; Gen_18:25; Psa_98:9; Mat_16:27, 25:31-46; Joh_5:22, Joh_5:26-29; Act_17:31; Rom_2:5-9; 1Co_4:5; 2Co_5:10; 2Th_1:6-10; Rev_20:11-15", "note": "", "refs": [{"l": "Ecc 12:14", "n": "", "vs": [[14, "لأن الله سيدين كل عمل مهما كان خفيا، سواء كان خيرا أم شرا."]]}, {"l": "Gen 18:25", "n": "", "vs": [[25, "تنزهت عن أن تهلك البار مع الأثيم، فيكون البار كالأثيم؛ حاشا لك. أديان الأرض كلها لا يجري عدلا؟»"]]}, {"l": "Psa 98:9", "n": "", "vs": [[9, "أمام الرب لأنه جاء ليدين الأرض بالعدل والشعوب بالإنصاف."]]}, {"l": "Mat 16:27", "n": "", "vs": [[27, "فإن ابن الإنسان سوف يعود في مجد أبيه مع ملائكته، فيجازي كل واحد حسب أعماله."]]}, {"l": "Mat 25:31-46", "n": "", "vs": [[31, "وعندما يعود ابن الإنسان في مجده ومعه جميع ملائكته، فإنه يجلس على عرش مجده،"], [32, "وتجتمع أمامه الشعوب كلها، فيفصل بعضهم عن بعض كما يفصل الراعي الغنم عن المعاز،"], [33, "فيوقف الغنم عن يمينه، والمعاز عن يساره؛"], [34, "ثم يقول الملك للذين عن يمينه: تعالوا يامن باركهم أبي، رثوا الملكوت الذي أعد لكم منذ إنشاء العالم:"], [35, "لأني جعت فأطعمتموني، عطشت فسقيتموني، كنت غريبا فآويتموني،"], [36, "عريانا فكسوتموني، مريضا فزرتموني، سجينا فأتيتم إلي!"], [37, "فيرد الأبرار قائلين: يارب، متى رأيناك جائعا فأطعمناك، أو عطشانا فسقيناك؟"], [38, "ومتى رأيناك غريبا فآويناك، أو عريانا فكسوناك؟"], [39, "ومتى رأيناك مريضا أو سجينا فزرناك؟"], [40, "فيجيبهم الملك: الحق أقول لكم: بما أنكم فعلتم ذلك بأحد إخوتي هؤلاء الصغار، فبي فعلتم!"], [41, "ثم يقول للذين عن يساره: ابتعدوا عني ياملاعين إلى النار الأبدية المعدة لإبليس وأعوانه!"], [42, "لأني جعت فلم تطعموني، وعطشت فلم تسقوني،"], [43, "كنت غريبا فلم تأووني، عريانا فلم تكسوني، مريضا وسجينا فلم تزوروني!"], [44, "فيرد هؤلاء أيضا قائلين: يارب، متى رأيناك جائعا أو عطشانا أو غريبا أو عريانا أو مريضا أو سجينا، ولم نخدمك؟"], [45, "فيجيبهم: الحق أقول لكم: بما أنكم لم تفعلوا ذلك بأحد إخوتي هؤلاء الصغار، فبي لم تفعلوا!"], [46, "فيذهب هؤلاء إلى العقاب الأبدي، والأبرار إلى الحياة الأبدية! »"]]}, {"l": "Joh 5:22", "n": "", "vs": [[22, "والآب لا يحاكم أحدا، بل أعطى الابن سلطة القضاء كلها،"]]}, {"l": "Joh 5:26-29", "n": "", "vs": [[26, "لأنه كما أن للآب حياة في ذاته، فقد أعطى الابن أيضا أن تكون له حياة في ذاته،"], [27, "وأعطاه سلطة أن يدين، لأنه ابن الإنسان."], [28, "لا تتعجبوا من هذا: فسوف تأتي ساعة يسمع فيها جميع من في القبور صوته،"], [29, "فيخرجون منها: فالذين عملوا الصالحات يخرجون في القيامة المؤدية إلى الحياة، وأما الذين عملوا السيئات ففي القيامة المؤدية إلى الدينونة."]]}, {"l": "Act 17:31", "n": "", "vs": [[31, "لأنه حدد يوما يدين فيه العالم بالعدل على يد رجل اختاره لذلك. وقد قدم للجميع برهانا، إذ أقامه من بين الأموات»."]]}, {"l": "Rom 2:5-9", "n": "", "vs": [[5, "ولكنك بسبب قساوتك وقلبك غير التائب، تخزن لنفسك غضبا ليوم الغضب، يوم تعلن دينونة الله العادلة."], [6, "فإنه سيجازي كل إنسان بحسب أعماله."], [7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"], [8, "ويكون الغضب والسخط للمخاصمين الذين يرفضون الطاعة للحق ولكنهم يخضعون للإثم."], [9, "فالشدة والضيق على نفس كل إنسان يعمل الشر اليهودي أولا ثم اليوناني؛"]]}, {"l": "1Co 4:5", "n": "", "vs": [[5, "إذن، لا تحكموا في شيء قبل الأوان، ريثما يرجع الرب الذي سيسلط النور على الأشياء التي يحجبها الظلام الآن، ويكشف نيات القلوب، عندئذ ينال كل واحد حقه من المدح من عند الله!"]]}, {"l": "2Co 5:10", "n": "", "vs": [[10, "إذ لابد أن نقف جميعا مكشوفين أمام عرش المسيح، لينال كل واحد منا استحقاق ما عمله حين كان في الجسد، أصالحا كان أم رديئا!"]]}, {"l": "2Th 1:6-10", "n": "", "vs": [[6, "فمن العدل عند الله حقا أن يجازي بالضيقة أولئك الذين يضايقونكم،"], [7, "وأن يكافئكم، أنتم الذين تتضايقون، كما يكافئنا نحن، بالراحة لدى ظهور الرب يسوع علنا من السماء، ومعه ملائكة قدرته،"], [8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."], [9, "فهؤلاء سيكابدون عقاب الهلاك الأبدي، بعيدا من حضرة الرب ومن مجد قوته،"], [10, "عندما يعود في ذلك اليوم ليتمجد في قديسيه ويكون موضع العجب عند جميع الذين آمنوا، وأنتم قد آمنتم بشهادتنا لكم!"]]}, {"l": "Rev 20:11-15", "n": "", "vs": [[11, "ثم رأيت عرشا عظيما أبيض هربت السماء والأرض من أمام الجالس عليه، فلم يبق لهما مكان."], [12, "ورأيت الأموات، كبارا وصغارا، واقفين قدام العرش. وفتحت الكتب، ثم فتح كتاب آخر هو سجل الحياة، ودين الأموات بحسب ما هو مدون في تلك الكتب، كل واحد حسب أعماله."], [13, "وسلم البحر من فيه من الأموات، وسلم الموت وهاوية الموتى الأموات الذين فيهما، وحكم على كل واحد بحسب أعماله."], [14, "وطرح الموت وهاوية الموتى في بحيرة النار، الذي هو الموت الثاني."], [15, "وكل من لم يوجد اسمه مكتوبا في سجل الحياة طرح في بحيرة النار!"]]}], "kwAr": "الله سيحكم", "noteAr": ""}, {"kw": "for", "raw": "Ecc_3:1; Jer_29:10, Jer_29:11; Dan_11:40, Dan_12:4, Dan_12:9, Dan_12:11-13; Act_1:7; 1Th_5:1; 2Pe_3:7, 2Pe_3:8; Rev_11:2, Rev_11:3, Rev_11:18, Rev_17:12-17, Rev_20:2, Rev_20:7-9", "note": "", "refs": [{"l": "Ecc 3:1", "n": "", "vs": [[1, "لكل شيء أوان، ولكل أمر تحت السماء زمان."]]}, {"l": "Jer 29:10", "n": "", "vs": [[10, "ولكن بعد انقضاء سبعين سنة عليكم في بابل، ألتفت إليكم وأفي لكم بوعودي الصالحة بردكم إلى هذا الموضع."]]}, {"l": "Jer 29:11", "n": "", "vs": [[11, "لأني عرفت ما رسمته لكم. إنها خطط سلام لا شر لأمنحكم مستقبلا ورجاء."]]}, {"l": "Dan 11:40", "n": "", "vs": [[40, "وعندما تأزف النهاية يحاربه ملك الجنوب، فينقض عليه ملك الشمال كالزوبعة بمركبات وفرسان وسفن كثيرة، ويقتحم دياره كالطوفان الجارف."]]}, {"l": "Dan 12:4", "n": "", "vs": [[4, "أما أنت يادانيآل فاكتم الكلام، واختم على الكتاب إلى ميعاد النهاية. وكثيرون يطوفون في الأرض وتزداد المعرفة»."]]}, {"l": "Dan 12:9", "n": "", "vs": [[9, "فأجاب: «اذهب يادانيآل لأن الكلمات مكتومة ومختومة إلى وقت النهاية."]]}, {"l": "Dan 12:11-13", "n": "", "vs": [[11, "أما الفترة ما بين إزالة المحرقة الدائمة وإقامة رجس المخرب، فهي ألف ومئتان وتسعون يوما."], [12, "فطوبى لمن ينتظر حتى يبلغ إلى الألف والثلاث مئة والخمسة والثلاثين يوما."], [13, "وأما أنت فاذهب إلى آخرتك فتستريح، ثم تقوم في نهاية الأيام لتثاب بما قسم لك»."]]}, {"l": "Act 1:7", "n": "", "vs": [[7, "فأجابهم: «ليس لكم أن تعرفوا المواعيد والأوقات التي حددها الآب بسلطته."]]}, {"l": "1Th 5:1", "n": "", "vs": [[1, "أما مسألة الأزمنة والأوقات المحددة، فلستم في حاجة لأن يكتب إليكم فيها."]]}, {"l": "2Pe 3:7", "n": "", "vs": [[7, "أما السماوات والأرض الحالية، فستبقى مخزونة ومحفوظة للنار بتلك الكلمة عينها إلى يوم الدينونة وهلاك الفاجرين!"]]}, {"l": "2Pe 3:8", "n": "", "vs": [[8, "ولكن، أيها الأحباء، عليكم ألا تنسوا هذه الحقيقة: أن يوما واحدا في نظر الرب هو كألف سنة، وألف سنة كيوم واحد."]]}, {"l": "Rev 11:2", "n": "", "vs": [[2, "وقيل لي: «لا تقس الساحة الخارجية لأنها خصصت للأمم، وسيدوسون المدينة المقدسة مدة اثنين وأربعين شهرا،"]]}, {"l": "Rev 11:3", "n": "", "vs": [[3, "ولكني سأمنح شاهدي أن يتنبآ مدة ألف ومئتين وستين يوما، وهما يلبسان ثوبين من الوبر»."]]}, {"l": "Rev 11:18", "n": "", "vs": [[18, "غضبت الشعوب عليك، فجاء دور غضبك عليهم. جاءت الساعة ليدان الأموات، وتكافيء عبيدك الأنبياء والقديسين والمتقين اسمك، صغارا وكبارا، وتهلك الذين كانوا يدمرون الأرض!»"]]}, {"l": "Rev 17:12-17", "n": "", "vs": [[12, "وأما القرون العشرة التي رأيت هي عشرة ملوك لم يتولوا الملك بعد، وسيتولون سلطة الملك مع الوحش لمدة ساعة واحدة،"], [13, "يتفقون فيها برأي واحد أن يعطوا الوحش قوتهم وسلطتهم."], [14, "ثم يحاربون الحمل، ولكن الحمل يهزمهم، لأنه رب الأرباب وملك الملوك، والذين معه هم المدعوون، المختارون، المؤمنون»."], [15, "ثم قال لي الملاك: «أما الميا ه التي رأيت حيث تجلس الزانية، فترمز إلى شعوب وجماهير وأمم ولغات."], [16, "وأما القرون العشرة التي رأيتها، والوحش، فسيبغضون الزانية ويجعلونها معزولة وعارية، ويأكلون لحمها ويحرقونها بالنار،"], [17, "لأن الله جعل في قلوبهم أن يعملوا وفق قصده، فيتفقوا على أن يعطوا الوحش ملكهم، حتى تتم كلمات الله."]]}, {"l": "Rev 20:2", "n": "", "vs": [[2, "قيد بها التنين، أي الحية القديمة، وهو إبليس أو الشيطان، وسجنه مدة ألف سنة،"]]}, {"l": "Rev 20:7-9", "n": "", "vs": [[7, "فحين تنقضي الألف سنة، يطلق ا [20, "فالإنسان المتمتع بالكرامة من غير فهم، يماثل البهائم البائدة."]]}, {"l": "Psa 73:18", "n": "", "vs": [[18, "حقا إنك أوقفتهم في أماكن زلقة، وأوقعتهم في التهلكات."]]}, {"l": "Psa 73:19", "n": "", "vs": [[19, "كيف صاروا للخر اب فجأة؟ انقرضوا وأفنتهم الدواهي."]]}, {"l": "Psa 90:5-12", "n": "", "vs": [[5, "تجرف البشر كما يجرفهم الطوفان، فيزولون كالحلم عند الصباح مثل العشب الذي ينمو."], [6, "يزهر في الصباح وينمو، وفي المساء يقطع ويجف."], [7, "إن غضبك قد أفنانا وسخطك قد روعنا."], [8, "جعلت آثامنا أمامك وخطايانا الخفية ظاهرة لديك."], [9, "لأن أيامنا كلها تنقضي في غضبك الشديد، وأعوامنا تتلاشى كزفرة."], [10, "قد نعيش سبعين سنة، وإن كنا ذوي عافية فثمانين وأفضل أيامنا تعب وبلية، لأنها سرعان ما تزول فنطير."], [11, "من يعرف شدة غضبك؟ إن سخطك هو بحسب مهابتك؟"], [12, "علمنا إحصاء أيامنا، لعلنا نتعقل بقلب حكيم."]]}, {"l": "Heb 9:27", "n": "", "vs": [[27, "فكما أن مصير الناس المحتوم، هو أن يموتوا مرة واحدة ثم تأتي الدينونة،"]]}, {"l": "1Pe 1:24", "n": "", "vs": [[24, "فإن الحياة البشرية كالعشب، ومجدها كله كزهر العشب. ولابد أن تفنى كما ييبس العشب ويسقط زهره!"]]}], "kwAr": "بشأن أبناء البشر", "noteAr": ""}, {"kw": "that God", "raw": "etc. or, that they might clear God, and see, etc. Job_40:8; Psa_51:4; Rom_3:4, Rom_9:23", "note": "etc. or, that they might clear God, and see, etc. Job_40:8; Psa_51:4; Rom_3:4, Rom_9:23", "refs": [{"l": "Job 40:8", "n": "", "vs": [[8, "أتشك في قضائي أو تستذنبني لتبرر نفسك؟"]]}, {"l": "Psa 51:4", "n": "", "vs": [[4, "إليك وحدك أخطأت، والشر قدام عينيك صنعت. لكي تتبرر إذا حكمت وتزكو إذا قضيت."]]}, {"l": "Rom 3:4", "n": "", "vs": [[4, "حاشا! وإنما، ليكن الله صادقا وكل إنسان كاذبا، كما قد كتب: «لكي تتبرر في كلامك، وتظفر متى حكمت»."]]}, {"l": "Rom 9:23", "n": "", "vs": [[23, "وذلك بقصد أن يعلن غنى مجده في أوعية الرحمة التي سبق فأعدها للمجد،"]]}], "kwAr": "الله يمتحنهم", "noteAr": "إلخ. أو: ليبرّروا الله ويروا، إلخ. انظر أي 40: 8؛ مز 51: 4؛ رو 3: 4؛ 9: 23"}, {"kw": "and that", "raw": "Psa_73:22; 2Pe_2:12", "note": "", "refs": [{"l": "Psa 73:22", "n": "", "v يشرب ويمتع نفسه، فهذا ما يبقى له من عنائه مدة أيام حياته التي أنعم بها الله عليه تحت الشمس."]]}, {"l": "Ecc 9:7-9", "n": "", "vs": [[7, "فامض وتمتع بأكل طعامك، واشرب خمرك بقلب منشرح، لأن الرب قد رضي الآن عن أعمالك."], [8, "لتكن ثيابك دائما بيضاء، ولا يعوزن رأسك الطيب."], [9, "تمتع طوال أيام حياتك الباطلة التي أعطاك إياها الرب تحت الشمس مع المرأة التي أحببتها، لأن ذلك هو حظك من الحياة ومن عناء تعبك الذي تكابده تحت الشمس."]]}, {"l": "Ecc 11:9", "n": "", "vs": [[9, "افرح أيها الشاب في حداثتك، وليمتعك قلبك في أيام شبابك، واتبع أهواء قلبك، وكل ما تشهده عيناك. ولكن اعلم أنه بسبب هذه الأمور كلها يأتي الله بك إلى كرسي القضاء."]]}, {"l": "Deu 12:7", "n": "", "vs": [[7, "فتأكلون هناك أنتم وعائلاتكم لدى الرب، وتفرحون بكل ما تمتد إليه أيديكم، لأن الرب إلهكم قد بارككم."]]}, {"l": "Deu 12:18", "n": "", "vs": [[18, "بل تأكلونها أنتم وأبناؤكم وبناتكم وعبيدكم وإماؤكم واللاويون المقيمون في جواركم لدى الرب إلهكم في المكان الذي يختاره الرب إلهكم، وتحتفلون أمامه بكل ما تمتلكه أيديكم"]]}, {"l": "Deu 26:10", "n": "", "vs": [[10, "فها أنا الآن قد أتيت بأول ثمر الأرض التي وهبتني يارب ثم يضعه أمام الرب إلهكم ويسجد في حضرته،"]]}, {"l": "Deu 26:11", "n": "", "vs": [[11, "ويحتفل بجميع الخير الذي أنعم به الرب إلهكم عليه وعلى أهل بيته، هو واللاوي والغريب المقيم بينكم."]]}, {"l": "Deu 28:47", "n": "", "vs": [[47, "ولأنكم لم تعبدوا الرب إلهكم بفرح وغبطة في زمن الازدهار والوفرة،"]]}, {"l": "Rom 12:11", "n": "", "vs": [[11, "لا تتكاسلوا في الاجتهاد، بل كونوا ملتهبين في الروح، عبيدا خادمين للرب،"]]}, {"l": "Rom 12:12", "n": "", "vs": [[12, "فرحين بالرجاء، صابرين في الضيق، مواظبين على الصلاة،"]]}, {"l": "Phi 4:4", "n": "", "vs": [[4, "افرحوا في الرب دائما، وأقول أيضا: افرحوا."]]}, {"l": "Phi 4:5", "n": "", "vs": [[5, "ليكن طول بالكم معروفا لدى الناس جميعا. إن الرب قريب."]]}], "kwAr": "ليس أفضل", "noteAr": ""}, {"kw": "who", "raw": "Ecc_6:12, Ecc_8:7, Ecc_9:12, Ecc_10:14; Job_14:21; Dan_12:9, Dan_12:10, Dan_12:13; Mat_6:34", "note": "", "refs": [{"l": "Ecc 6:12", "n": "", "vs": [[12, "إذ من يدري ما هو خ  4:17", "n": "", "vs": [[17, "إلا أن الرب وقف بجانبي وأمدني بالقوة، لكي تتم بي المناداة بالبشارة، فيسمعها جميع من هم من الأمم؛ وقد نجوت من فم الأسد."]]}], "kwAr": "لا معزي لهم", "noteAr": ""}, {"kw": "side", "raw": "Heb. hand", "note": "Heb. hand", "refs": [], "kwAr": "ظالموهم", "noteAr": "بالعبرانية: يد."}], "arS": [["ثم ", []], ["تأملت", ["H7200", "H7725"]], [" حولي ", []], ["فرأيت", ["H2009"]], [" ", []], ["جميع", ["H3605"]], [" ", []], ["المظالم", ["H6231"]], [" ", []], ["التي", ["H834"]], [" ", []], ["ترتكب", ["H6213"]], [" ", []], ["تحت", ["H8478"]], [" ", []], ["الشمس", ["H8121"]], [". شهدت ", []], ["دموع", ["H1832"]], [" ", []], ["المظلومين", ["H6217"]], [" الذين ", []], ["لا", ["H369"]], [" ", []], ["معزي", ["H5162"]], [" لهم، أما ", []], ["ظالموهم", ["H3027"]], [" فيتمتعون ", []], ["بالقوة", ["H3581"]], ["، ", []], ["غير", ["H369"]], [" أن ", []], ["المظلومين", ["H6217"]], [" لا ", []], ["معزي", ["H5162"]], [" لهم.", []]]}, {"c": 4, "v": 2, "text": "فغبطت الأموات الذين قضوا منذ زمان أكثر من الأحياء الذين ما برحوا على قيد الحياة.", "groups": [{"kw": "", "raw": "Ecc_2:17, Ecc_9:4-6; Job_3:17-21", "note": "", "refs": [{"l": "Ecc 2:17", "n": "", "vs": [[17, "فكرهت الحياة، لأن ما تم صنعه تحت الشمس كان مثار أسى لي، فكل شيء باطل كملاحقة الريح."]]}, {"l": "Ecc 9:4-6", "n": "", "vs": [[4, "أما من لا يزال حيا مع الأحياء فله رجاء، لأن كلبا حيا خير من أسد ميت."], [5, "لأن الأحياء يدركون أنهم سيموتون، أما الأموات فلا يعلمون شيئا، وليس لهم ثواب بعد، إذ قد ينسى ذكرهم."], [6, "فقد باد حبهم وبغضهم وغيرتهم، ولم يبق لهم نصيب فيما يجري تحت الشمس."]]}, {"l": "Job 3:17-21", "n": "", "vs": [[17, "فهناك يكف الأشرار عن إثارة المتاعب، وهناك يرتاح المرهقون."], [18, "هناك يطمئن الأسرى جميعا، إذ لا يلاحقهم صوت المسخر."], [19, "هناك يكون الصغير كالكبير، والعبد متحررا من سيده."], [20, "لم يوهب الشقي نورا، وذوو النفوس المرة حياة؟"], [21, "الذين يتوقون إلى الموت فلا يقبل، وينقبون عنه أكثر مما ينقبون عن الكنوز الخفية،"]]}], "kwAr": "", "noteAr": ""}], "arS": [["فغبطت", ["H7623"]], [" ", []], ["الأموات", ["H4191"]], [" ", []], ["الذين", ["H834"]], [" قضوا ", []], ["منذ", ["H4480"]], [" زمان أكثر من ", []], ["الأحياء", ["H2416"]], [" الذين ", []], ["ما", ["H5728"]], [" برحوا على قيد ", []], ["الحياة", ["H2416"]], [".", []]]}, {"c": 4, "v": 3, "text": "وأفضل من كليهما من لم يولد بعد، الذي لم ير الشر المرتكب تحت الشمس.", "groups": [{"kw": "better", "raw": "Ecc_6:3-5; Job_3:10-16, Job_10:18, Job_10:19; Jer_20:17, Jer_20:18; Mat_24:19; Luk_23:29", "note": "", "refs": [{"l": "Ecc 6:3-5", "n": "", "vs": [[3, "رب رجل ينجب مئة ولد ويعيش عمرا طويلا حتى تكثر سنو حياته، لكنه لا يتمتع بخيرات الحياة ولا يثوي في قبر. أقول إن السقط خير منه!"], [4, "لأنه يقبل إلى الدنيا بالباطل، ويفارق في الظلام ويحتجب اسمه بالظلمة."], [5, "ومع أنه لم ير الدنيا ولا عرف شيئا، فإنه ينال راحة أكثر"]]}, {"l": "Job 3:10-16", "n": "", "vs": [[10, "لأنه لم يغلق رحم أمي ولم يستر الشقاء عن عيني."], [11, "لم لم أمت في الرحم، ولم لم أسلم الروح عندما خرجت من بطن أمي؟"], [12, "لماذا وجدت الركب لتعينني والثدي لترضعني؟"], [13, "وإلا لكنت مازلت مضطجعا ساكنا، ولكنت نائما مستريحا"], [14, "مع ملوك الأرض ومشيريها، الذين بنوا أهراما لأنفسهم."], [15, "أو مع الرؤساء الذين كنزوا ذهبا وملأوا بيوتهم فضة."], [16, "أو لماذا لم أطمر في الأرض كسقط لم ير النور؟"]]}, {"l": "Job 10:18", "n": "", "vs": [[18, "لماذا أخرجتني من الرحم؟ ألم يكن خيرا لو أسلمت الروح ولم ترني عين؟"]]}, {"l": "Job 10:19", "n": "", "vs": [[19, "فأكون كأني لم أكن فأنقل من الرحم إلى القبر."]]}, {"l": "Jer 20:17", "n": "", "vs": [[17, "ليكن ذلك الرجل ملعونا لأنه لم يقتلني من الرحم، فتضحى أمي قبرا لي، وتظل حبلى بي إلى الأبد."]]}, {"l": "Jer 20:18", "n": "", "vs": [[18, "لماذا خرجت من الرحم لأقاسي التعب والأوجاع، وأفني أيامي بالخزي؟"]]}, {"l": "Mat 24:19", "n": "", "vs": [[19, "والويل للحبالى والمرضعات في تلك الأيام!"]]}, {"l": "Luk 23:29", "n": "", "vs": [[29, "فها إن أياما ستأتي فيها يقول الناس: طوبى للعواقر اللواتي ما حملت بطونهن ولا أرضعت أثداؤهن!"]]}], "kwAr": "وأفضل من كليهما", "noteAr": ""}, {"kw": "who", "raw": "Ecc_1:14, Ecc_2:17; Psa_55:6-11; Jer_9:2, Jer_9:3", "note": "", "refs": [{"l": "Ecc 1:14", "n": "", "vs": [[14, "لقد شاهدت كل الأشياء التي تم صنعها تحت الشمس فإذا الجميع باطل كملاحقة الريح."]]}, {"l": "Ecc 2:17", "n": "", "vs": [[17, "فكرهت الحياة، لأن ما تم صنعه تحت الشمس كان مثار أسى لي، فكل شيء باطل كملاحقة الريح."]]}, {"l": "Psa 55:6-11", "n": "", "vs": [[6, "فقلت: «ليت لي جناحا كالحمامة فأطير وأستريح."], [7, "كنت أشرد هاربا وأبيت في البرية."], [8, "كنت أسرع للنجاة من الريح العاصفة، ومن نوء البحر»."], [9, "بلبل ألسنة (أعدائي) يارب وأبكمهم، فإني أرى في المدينة عنفا وعدوانا،"], [10, "يحدقان بأسوارها نهارا وليلا، وفي وسطها الإثم والأذى."], [11, "المفاسد في وسطها، والظلم والغش لا يفارقان ساحاتها."]]}, {"l": "Jer 9:2", "n": "", "vs": [[2, "ياليت لي في الصحراء مبيت عابر سبيل، فأهجر شعبي وأنطلق بعيدا عنهم، لأنهم جميعا زناة وجماعة خونة."]]}, {"l": "Jer 9:3", "n": "", "vs": [[3, "«قد وتروا ألسنتهم كقسي جاهزة ليطلقوا الأكاذيب التي تقولوا بها في الأرض من دون الحق، إذ أنهم انتهوا من شر إلى شر، وإياي لم يعرفوا» يقول الرب."]]}], "kwAr": "الذي لم ير الشر", "noteAr": ""}], "arS": [["وأفضل", ["H2896"]], [" ", []], ["من", ["H4480"]], [" ", []], ["كليهما", ["H8147"]], [" ", []], ["من", ["H834"]], [" ", []], ["لم", ["H3808"]], [" ", []], ["يولد", ["H1961"]], [" ", []], ["بعد", ["H5728"]], ["، ", []], ["الذي", ["H834"]], [" ", []], ["لم", ["H3808"]], [" ", []], ["ير", ["H7200"]], [" ", []], ["الشر", ["H7451"]], [" ", []], ["المرتكب", ["H6213", "H4639"]], [" ", []], ["تحت", ["H8478"]], [" ", []], ["الشمس", ["H8121"]], [".", []]]}, {"c": 4, "v": 4, "text": "وأدركت أيضا أن كل تعب الإنسان ومنجزاته، ناتجة عن حسده لقريبه. هذا أيضا باطل كملاحقة الريح.", "groups": [{"kw": "every", "raw": "etc. Heb. all the rightness of work, that this is the envy of man from his neighbour, Gen_4:4-8, Gen_37:2-11; 1Sa_18:8, 1Sa_18:9, 1Sa_18:14-16, 1Sa_18:29, 1Sa_18:30; Pro_27:4; Mat_27:18; Act_7:9; Jam_4:5; 1Jo_3:12", "note": "etc. Heb. all the rightness of work, that this is the envy of man from his neighbour, Gen_4:4-8, Gen_37:2-11; 1Sa_18:8, 1Sa_18:9, 1Sa_18:14-16, 1Sa_18:29, 1Sa_18:30; Pro_27:4; Mat_27:18; Act_7:9; Jam_4:5; 1Jo_3:12", "refs": [{"l": "Gen 4:4-8", "n": "", "vs": [[4, "وقدم هابيل أيضا من خيرة أبكار غنمه وأسمنها. فتقبل الرب قربان هابيل ورضي عنه."], [5, "لكنه لم يتقبل قربان قايين ولم يرض عنه. فاغتاظ قايين جدا وتجهم وجهه كمدا."], [6, "فسأل الرب قايين: «لماذا اغتظت؟ لماذا تجهم وجهك؟"], [7, "لو أحسنت في تصرفك ألا يشرق وجهك فرحا؟ وإن لم تحسن التصرف، فعند الباب خطيئة تنتظرك، تتشوق أن تتسلط عليك، لكن يجب أن تتحكم فيها»"], [8, "وعاد قايين يتظاهر بالود لأخيه هابيل. وحدث إذ كانا معا في الحقل أن قايين هجم على أخيه هابيل وقتله."]]}, {"l": "Gen 37:2-11", "n": "", "vs": [[2, "وهذا سجل بسيرة يعقوب. إذ كان يوسف غلاما في السابعة عشرة من عمره، راح يرعى الغنم مع إخوته أبناء بلهة وزلفة زوجتي أبيه، فأبلغ يوسف أباه بنميمتهم الرديئة."], [3, "وكان إسرائيل يحب يوسف أكثر من بقية إخوته، لأنه كان ابن شيخوخته، فصنع له قميصا ملونا."], [4, "ولما رأى إخوته أن أباهم يحبه أكثر منهم كرهوه وأساءوا إليه بكلامهم."], [5, "وحلم يوسف حلما قصه على إخوته، فازدادوا له بغضا."], [6, "قال لهم: «اسمعوا هذا الحلم الذي حلمته."], [7, "رأيت وكأننا نحزم حزما في الحقل، فإذا بحزمتي وقفت ثم انتصبت، فأحاطت بها حزمكم وانحنت لها»."], [8, "فقال له إخوته: «ألعلك تملك علينا أو تحكمنا؟» وزاد بغضهم له بسبب أحلامه وكلامه."], [9, "ثم حلم حلما آخر سرده على إخوته، قال: «حلمت حلما آخر، وإذا الشمس والقمر وأحد عشر كوكبا ساجدة لي»."], [10, "وقصه على أبيه وإخوته، فأنبه أبوه وقال: «أي حلم هذا الذي حلمته؟ أتظن حقا أنني وأمك وإخوتك سنأتي وننحني لك إلى الأرض؟»"], [11, "فحسده إخوته. أما أبوه فأسر هذا الكلام في قلبه."]]}, {"l": "1Sa 18:8", "n": "", "vs": [[8, "فأثار هذا غضب شاول، وساء هذا الغناء في نفسه وقال: «نسبن لداود قتل عشرات الألوف، أما أنا فنسبن لي قتل الألوف فقط! لم يبق سوى أن ينعمن عليه بالمملكة»."]]}, {"l": "1Sa 18:9", "n": "", "vs": [[9, "وشرع شاول منذ ذلك اليوم فصاعدا يراقب داود بعين ممتلئة بالغيرة."]]}, {"l": "1Sa 18:14-16", "n": "", "vs": [[14, "وحالفه الفلاح في كل أعماله لأن الرب كان معه."], [15, "وعندما رأى شاول ما يتمتع به داود من فطنة تفاقم فزعه منه."], [16, "أما جميع إسرائيل ويهوذا فقد ازدادوا حبا له، لأنه كان دائما يقودهم في حملاتهم العسكرية الموفقة."]]}, {"l": "1Sa 18:29", "n": "", "vs": [[29, "فتزايد خوف شاول من داود، وأصبح عدوه اللدود طوال حياته."]]}, {"l": "1Sa 18:30", "n": "", "vs": [[30, "وثابر أقطاب الفلسطينيين على محاربة إسرائيل، فكان داود يظفر بهم أكثر من بقية قواد شاول، وأصبح اسمه على كل شفة ولسان."]]}, {"l": "Pro 27:4", "n": "", "vs": [[4, "الغضب فظ، والسخط قهار، ولكن من يصمد أمام الغيرة؟"]]}, {"l": "Mat 27:18", "n": "", "vs": [[18, "إذ كان يعلم أنهم سلموه عن حسد."]]}, {"l": "Act 7:9", "n": "", "vs": [[9, "وحسد الآباء الأولون يوسف وباعوه، فأصبح عبدا في مصر. ولكن الله كان معه،"]]}, {"l": "Jam 4:5", "n": "", "vs": [[5, "أتظنون أن الكتاب يتكلم عبثا! هل الروح الذي حل في داخلنا يغار عن حسد؟"]]}, {"l": "1Jo 3:12", "n": "", "vs": [[12, "لا أن نكون مثل قايين الذي قتل أخاه. فقايين كان من أولاد إبليس الشرير. ولماذا قتل أخاه؟ قتله لأن أعماله هو كانت شريرة، أما أعمال أخيه فكانت صالحة."]]}], "kwAr": "كل تعب الإنسان", "noteAr": "إلخ. بالعبرانية: كل استقامة العمل، وهي حسد الإنسان من قريبه. انظر تك 4: 4-8؛ 37: 2-11؛ 1صم 18: 8، 9؛ 18: 14-16، 29، 30؛ أم 27: 4؛ مت 27: 18؛ أع 7: 9؛ يع 4: 5؛ 1يو 3: 12"}, {"kw": "This is", "raw": "Ecc_4:16, Ecc_1:14, Ecc_2:21, Ecc_2:26, Ecc_6:9, Ecc_6:11; Gen_37:4, Gen_37:11", "note": "", "refs": [{"l": "Ecc 4:16", "n": "", "vs": [[16, "ولم يكن نهاية للجماهير الذين سار في طليعتهم، غير أن الأجيال اللاحقة لا تسر به، فهذا أيضا باطل وكملاحقة الريح."]]}, {"l": "Ecc 1:14", "n": "", "vs": [[14, "لقد شاهدت كل الأشياء التي تم صنعها تحت الشمس فإذا الجميع باطل كملاحقة الريح."]]}, {"l": "Ecc 2:21", "n": "", "vs": [[21, "إذ قد يترك الإنسان كل ما تعب فيه بحكمة ومعرفة وحذاقة لرجل آخر يتمتع بما لم يشق به. هذا أيضا باطل وشر عظيم."]]}, {"l": "Ecc 2:26", "n": "", "vs": [[26, "لأن المرء الذي يحظى برضى الله ينعم الله عليه بالحكمة والمعرفة والفرح. أما الخاطيء فيفرض عليه عناء الجمع والادخار، ليكون ذلك من نصيب من يرضي الله . وهذا أيضا باطل كملاحقة الريح."]]}, {"l": "Ecc 6:9", "n": "", "vs": [[9, "إن ما تراه العين خير مما تشتهيه النفس. وهذا أيضا باطل كملاحقة الريح."]]}, {"l": "Ecc 6:11", "n": "", "vs": [[11, "في كثرة الكلام كثرة الباطل، فأي جدوى منه للإنسان؟"]]}, {"l": "Gen 37:4", "n": "", "vs": [[4, "ولما رأى إخوته أن أباهم يحبه أكثر منهم كرهوه وأساءوا إليه بكلامهم."]]}, {"l": "Gen 37:11", "n": "", "vs": [[11, "فحسده إخوته. أما أبوه فأسر هذا الكلام في قلبه."]]}], "kwAr": "هذا أيضا باطل", "noteAr": ""}], "arS": [["وأدركت", ["H7200"]], [" ", []], ["أيضا", ["H1571"]], [" ", []], ["أن", ["H3588"]], [" ", []], ["كل", ["H3605"]], [" ", []], ["تعب", ["H5999"]], [" ", []], ["الإنسان", ["H376"]], [" ", []], ["ومنجزاته", ["H3788", "H4639"]], ["، ناتجة ", []], ["عن", ["H4480"]], [" ", []], ["حسده", ["H7068"]], [" ", []], ["لقريبه", ["H7453"]], [". ", []], ["هذا", ["H2088"]], [" أيضا ", []], ["باطل", ["H1892"]], [" ", []], ["كملاحقة", ["H7469"]], [" ", []], ["الريح", ["H7307"]], [".", []]]}, {"c": 4, "v": 5, "text": "يطوي الجاهل يديه ويأكل لحمه.", "groups": [{"kw": "fool", "raw": "Pro_6:10, Pro_6:11, Pro_12:27, Pro_13:4, Pro_20:4, Pro_24:33, Pro_24:34", "note": "", "refs": [{"l": "Pro 6:10", "n": "", "vs": [[10, "فإن بعض النوم، ثم بعض الرقاد، وطي اليدين للهجوع،"]]}, {"l": "Pro 6:11", "n": "", "vs": [[11, "تجعل الفقر يقبل عليك كقاطع طريق، والفاقة كغاز مسلح."]]}, {"l": "Pro 12:27", "n": "", "vs": [[27, "المتقاعس لا يحظى بصيد، وأثمن ما لدى الإنسان هو اجتهاده."]]}, {"l": "Pro 13:4", "n": "", "vs": [[4, "نفس الكسول تشتهي كثيرا ولا تحصل على شيء، أما نفس المجتهد فتغنى."]]}, {"l": "Pro 20:4", "n": "", "vs": [[4, "لا يحرث الكسول في الموسم خشية البرد، وفي أوان الحصاد يطلب غلة فلا يجد."]]}, {"l": "Pro 24:33", "n": "", "vs": [[33, "أدركت أن قليلا من النعاس بعد قليل من النوم، وطي اليدين للهجوع،"]]}, {"l": "Pro 24:34", "n": "", "vs": [[34, "تجعل الفقر يقبل عليك كقاطع طريق والفاقة كغاز مسلح!"]]}], "kwAr": "الجاهل", "noteAr": ""}, {"kw": "eateth", "raw": "That is, with envy (see Ecc_4:4), though too idle to follow his neighbours example. Job_13:14; Pro_11:17; Isa_9:20", "note": "That is, with envy (see Ecc_4:4), though too idle to follow his neighbours example. Job_13:14; Pro_11:17; Isa_9:20", "refs": [{"l": "Ecc 4:4", "n": "", "vs": [[4, "وأدركت أيضا أن كل تعب الإنسان ومنجزاته، ناتجة عن حسده لقريبه. هذا أيضا باطل كملاحقة الريح."]]}, {"l": "Job 13:14", "n": "", "vs": [[14, "لماذا أنهش لحمي بأسناني وأضع نفسي في كفي؟"]]}, {"l": "Pro 11:17", "n": "", "vs": [[17, "الرحيم يحسن إلى نفسه، والقاسي يؤذي ذاته."]]}, {"l": "Isa 9:20", "n": "", "vs": [[20, "يلتهمون ذات اليمين ولكن يظلون جياعا، ويفترسون ذات الشمال ولا يشبعون. كل واحد منهم يأكل لحم أخيه."]]}], "kwAr": "ويأكل لحمه", "noteAr": "أي: بالحسد (انظر جا 4: 4)، مع أنه أكسل من أن يحذو حذو قريبه. انظر أي 13: 14؛ أم 11: 17؛ إش 9: 20"}], "arS": [["يطوي ", []], ["الجاهل", ["H3684"]], [" يديه ", []], ["ويأكل", ["H398"]], [" ", []], ["لحمه", ["H1320"]], [".", []]]}, {"c": 4, "v": 6, "text": "حفنة راحة خير من حفنتي تعب وملاحقة الريح.", "groups": [{"kw": "", "raw": "Psa_37:16; Pro_15:16, Pro_15:17, Pro_16:8, Pro_17:1", "note": "", "refs": [{"l": "Psa 37:16", "n": "", "vs": [[16, "الخير القليل الذي يملكه الصديق أفضل من ثروة أشرار كثيرين،"]]}, {"l": "Pro 15:16", "n": "", "vs": [[16, "قليل من المال مع تقوى الرب خير من كنز عظيم يخالطه هم."]]}, {"l": "Pro 15:17", "n": "", "vs": [[17, "أكلة من البقول في جو مشبع بالمحبة خير من أكل وجبة من لحم عجل معلوف في جو من البغضاء."]]}, {"l": "Pro 16:8", "n": "", "vs": [[8, "المال القليل مع العدل خير من دخل وفير حرام."]]}, {"l": "Pro 17:1", "n": "", "vs": [[1, "لقمة خبز جافة مصحوبة بالسلام خير من بيت مليء بذبائح ويسوده الخصام."]]}], "kwAr": "", "noteAr": ""}], "arS": [["حفنة", ["H4393"]], [" ", []], ["راحة", ["H5183"]], [" ", []], ["خير", ["H2896"]], [" ", []], ["من", ["H4480"]], [" ", []], ["حفنتي", ["H2651"]], [" ", []], ["تعب", ["H5999"]], [" ", []], ["وملاحقة", ["H7469"]], [" ", []], ["الريح", ["H7307"]], [".", []]]}, {"c": 4, "v": 7, "text": "وعدت أتأمل فرأيت باطلا آخر تحت الشمس:", "groups": [{"kw": "", "raw": "Ecc_4:1; Psa_78:33; Zec_1:6", "note": "", "refs": [{"l": "Ecc 4:1", "n": "", "vs": [[1, "ثم تأملت حولي فرأيت جميع المظالم التي ترتكب تحت الشمس. شهدت دموع المظلومين الذين لا معزي لهم، أما ظالموهم فيتمتعون بالقوة، غير أن المظلومين لا معزي لهم."]]}, {"l": "Psa 78:33", "n": "", "vs": [[33, "فأفنى أيامهم بالباطل وسنيهم في الرعب."]]}, {"l": "Zec 1:6", "n": "", "vs": [[6, "ولكن ألم تدرك أقوالي وفرائضي التي أمرت بها عبيدي الأنبياء آباءكم فتابوا قائلين: لقد نفذ الرب القدير ما عزم أن يعاقبنا بمقتضى ما ارتكبناه من أعمال باطلة؟»"]]}], "kwAr": "", "noteAr": ""}], "arS": [["وعدت", ["H7725"]], [" ", []], ["أتأمل", ["H7200"]], [" فرأيت ", []], ["باطلا", ["H1892"]], [" آخر ", []], ["تحت", ["H8478"]], [" ", []], ["الشمس", ["H8121"]], [":", []]]}, {"c": 4, "v": 8, "text": "واحد وحيد، لا ثاني له. لا ابن ولا أخ. ولا نهاية لتعبه. عينه لا تشبع من الغنى، ولا يقول: لمن أكدح وأحرم نفسي من المسرات؟ هذا أيضا باطل وعناء شاق!", "groups": [{"kw": "one", "raw": "Ecc_4:9-12; Gen_2:18; Isa_56:3-5", "note": "", "refs": [{"l": "Ecc 4:9-12", "n": "", "vs": [[9, "اثنان خير من واحد، لأن لهما حسن الثواب على كدهما."], [10, "لأنه إذا سقط أحدهما ينهضه الآخر. ولكن ويل لمن هو وحيد، لأنه إن سقط فلا مسعف له على النهوض."], [11, "كذلك إن رقد اثنان معا يدفآن، أما الراقد وحده فكيف يدفأ؟"], [12, "وإن كان الواحد القوي يغلب واحدا أضعف منه، فإن اثنين قادران على مقاومته. فالخيط المثلث يتعذر قطعه سريعا."]]}, {"l": "Gen 2:18", "n": "", "vs": [[18, "ثم قال الرب الإله: «ليس مستحسنا أن يبقى آدم وحيدا. سأصنع له معينا مشابها له»."]]}, {"l": "Isa 56:3-5", "n": "", "vs": [[3, "لا يقل ابن الغريب المنضم إلى الرب: إن الرب يفصلني عن شعبه. ولا يقولن الخصي: أنا شجرة يابسة."], [4, "لأن هذا ما يقوله الرب للخصيان الذين يحافظون على سبوتي، ويختارون ما يسرني ويتشبثون بعهدي:"], [5, "أهبهم داخل بيتي وأسواري نصيبا واسما أفضل من البنين والبنات. أعطيهم اسما مخلدا لا ينقرض."]]}], "kwAr": "واحد وحيد", "noteAr": ""}, {"kw": "he hath", "raw": "Gen_15:2, Gen_15:3", "note": "", "refs": [{"l": "Gen 15:2", "n": "", "vs": [[2, "فقال أبرام: «أيها السيد الرب أي خير في ما تعطيني وأنا من غير عقب ووارث بيتي هو أليعازر الدمشقي؟»"]]}, {"l": "Gen 15:3", "n": "", "vs": [[3, "وقال أبرام أيضا: «إنك لم تعطني نسلا، وها هو عبد مولود في بيتي يكون وارثي»"]]}], "kwAr": "لا ابن ولا أخ", "noteAr": ""}, {"kw": "no", "raw": "Isa_5:8", "note": "", "refs": [{"l": "Isa 5:8", "n": "", "vs": [[8, "اشتريتم البيوت والحقول حتى لم يبق لأحد غيركم مكان يسكن فيه! صارت الأرض لكم وحدكم!"]]}], "kwAr": "ولا نهاية", "noteAr": ""}, {"kw": "is his", "raw": "Ecc_1:8, Ecc_5:10; Pro_27:20; Hab_2:5-9; 1Jo_2:16", "note": "", "refs": [{"l": "Ecc 1:8", "n": "", "vs": [[8, "جميع الأشياء مرهقة، وليس في وسع المرء أن يعبر عنها، فلا العين تشبع من النظر، ولا الأذن تمتليء من السمع."]]}, {"l": "Ecc 5:10", "n": "", "vs": [[10, "من يحب الفضة لا يشبع منها، والمولع بالغنى لا يشبع من ربح. وهذا أيضا باطل."]]}, {"l": "Pro 27:20", "n": "", "vs": [[20, "كما أن الهاوية والهلاك لا يشبعان، هكذا لا تشبع عينا الإنسان."]]}, {"l": "Hab 2:5-9", "n": "", "vs": [[5, "وكما أن الخمر غادرة، كذلك تأخذ المغتر نشوة الانتصار فلا يستكين، فإن جشعه في سعة الهاوية، وهو كالموت لا يشبع. لهذا يجمع لنفسه كل الأمم ويسبي جميع الشعوب."], [6, "ولكن لا يلبث أن يسخر منه سباياه قائلين: «ويل لمن يكوم لنفسه الأسلاب، ويثرى على حساب ما نهب. إنما إلى متى؟"], [7, "ألا يقوم عليك دائنوك بغتة، أو لا يثورون عليك ويملأونك رعبا، فتصبح لهم غنيمة؟"], [8, "لأنك سلبت أمما كثيرة فإن بقية الشعوب ينهبونك ثأرا لما سفكت من دماء وارتكبت من جور في الأرض، فدمرت مدنا وأهلكت الساكنين فيها."], [9, "ويل لمن يدخر لبنيه مكسب ظلم، ويشيد مسكنه في مقام حصين ليكون في مأمن من الخطر."]]}, {"l": "1Jo 2:16", "n": "", "vs": [[16, "لأن كل ما في العالم، من شهوات الجسد وشهوات العين وترف المعيشة، ليس من الآب، بل من العالم."]]}], "kwAr": "عينه لا تشبع", "noteAr": ""}, {"kw": "For", "raw": "Psa_39:6; Isa_44:19, Isa_44:20; Luk_12:20", "note": "", "refs": [{"l": "Psa 39:6", "n": "", "vs": [[6, "إنما كخيال يتمشى الإنسان، فعبثا يكافح الناس. يجمع الواحد منهم ثروة ولا يدري من يرثها من بعده."]]}, {"l": "Isa 44:19", "n": "", "vs": [[19, "ليس من متأمل أو ذي معرفة أو إدراك يقول: قد أحرقت نصف الشجرة بالنار وخبزت خبزي على جمراتها، شويت لحما عليها وأكلته. أفأصنع من بقيتها رجسا وأسجد أمام قطعة خشب؟"]]}, {"l": "Isa 44:20", "n": "", "vs": [[20, "لكأنه يأكل الرماد! يجري وراء سراب ويعجز عن إنقاذ نفسه أو الاعتراف أن الصنم الذي يمسكه بيده هو محض ضلال!"]]}, {"l": "Luk 12:20", "n": "", "vs": [[20, "ولكن الله قال له: ياغبي، هذه الليلة تطلب نفسك منك، فلمن يبقى ما أعددته؟"]]}], "kwAr": "لمن أكدح", "noteAr": ""}, {"kw": "it is", "raw": "Ecc_1:13, Ecc_2:23; Isa_55:2; Mat_11:28", "note": "", "refs": [{"l": "Ecc 1:13", "n": "", "vs": [[13, "فوجهت قلبي ليلتمس ويبحث بالحكمة عن كل ما صنع تحت السماء، وإذا به مشقة منهكة كبدها الرب لأبناء الناس ليعانوا فيها."]]}, {"l": "Ecc 2:23", "n": "", "vs": [[23, "كل أيام حياته مفعمة بالمشقة، وعمله عناء. حتى في الليل لا يستريح قلبه. وهذا أيضا باطل."]]}, {"l": "Isa 55:2", "n": "", "vs": [[2, "لماذا تنفقون الفضة على ما ليس بخبز، وتتعبون لغير شبع؟ أحسنوا الاستماع إلي، وكلوا الشهي ولتتمتع أنفسكم بالدسم."]]}, {"l": "Mat 11:28", "n": "", "vs": [[28, "تعالوا إلي ياجميع المتعبين والرازحين تحت الأحمال الثقيلة، وأنا أريحكم."]]}], "kwAr": "وعناء شاق", "noteAr": ""}], "arS": [["واحد", ["H259"]], [" وحيد، ", []], ["لا", ["H3808"]], [" ", []], ["ثاني", ["H8145"]], [" له. ", []], ["لا", ["H369"]], [" ", []], ["ابن", ["H1121"]], [" ", []], ["ولا", ["H369"]], [" ", []], ["أخ", ["H251"]], [". ", []], ["ولا", ["H369"]], [" ", []], ["نهاية", ["H7093"]], [" ", []], ["لتعبه", ["H5999"]], [". ", []], ["عينه", ["H5869"]], [" لا ", []], ["تشبع", ["H7646"]], [" ", []], ["من", ["H4480"]], [" ", []], ["الغنى", ["H6239"]], ["، ", []], ["ولا", ["H1571"]], [" يقول: ", []], ["لمن", ["H4310"]], [" ", []], ["أكدح", ["H6001"]], [" ", []], ["وأحرم", ["H2637"]], [" ", []], ["نفسي", ["H5315"]], [" من ", []], ["المسرات", ["H2896"]], ["؟ ", []], ["هذا", ["H2088"]], [" ", []], ["أيضا", ["H1571"]], [" ", []], ["باطل", ["H1892"]], [" ", []], ["وعناء", ["H7451"]], [" ", []], ["شاق", ["H6045"]], ["!", []]]}, {"c": 4, "v": 9, "text": "اثنان خير من واحد، لأن لهما حسن الثواب على كدهما.", "groups": [{"kw": "are", "raw": "Gen_2:18; Exo_4:14-16; Num_11:14; Pro_27:17; Hag_1:14; Mar_6:7; Act_13:2; Act_15:39, Act_15:40; 1Co_12:18-21", "note": "", "refs": [{"l": "Gen 2:18", "n": "", "vs": [[18, "ثم قال الرب الإله: «ليس مستحسنا أن يبقى آدم وحيدا. سأصنع له معينا مشابها له»."]]}, {"l": "Exo 4:14-16", "n": "", "vs": [[14, "فاحتدم غضب الرب على موسى وقال: «أليس هرون اللاوي أخاك؟ أنا أعلم أنه يحسن الكلام، وها هو أيضا قادم للقائك. وحالما يراك يبتهج قلبه."], [15, "فتحدثه وتلقن فمه الكلام، فأعينكما على القول، وأعلمكما ماذا تفعلان،"], [16, "فيخاطب هو الشعب عنك ويكون لك بمثابة فم وأنت تكون له بمثابة إله."]]}, {"l": "Num 11:14", "n": "", "vs": [[14, "إنني عاجز عن حمل عبء هذا الشعب وحدي لأنه ثقيل علي."]]}, {"l": "Pro 27:17", "n": "", "vs": [[17, "كما يصقل الحديد الحديد، هكذا يصقل الإنسان صاحبه."]]}, {"l": "Hag 1:14", "n": "", "vs": [[14, "وبث الرب الهمة في نفس زربابل بن شألتيئيل حاكم يهوذا ونفس يهوشع بن يهوصادق رئيس الكهنة ونفوس سائر بقية الشعب، فتوافدوا وباشروا العمل في هيكل الرب القدير إلههم."]]}, {"l": "Mar 6:7", "n": "", "vs": [[7, "ثم استدعى الاثني عشر تلميذا، وأخذ يرسلهم اثنين اثنين، وقد أعطاهم سلطة على الأرواح النجسة،"]]}, {"l": "Act 13:2", "n": "", "vs": [[2, "وذات يوم، وهم صائمون يتعبدون للرب، قال لهم الروح القدس: «خصصوا لي برنابا وشاول لأجل العمل الذي دعوتهما إليه»."]]}, {"l": "Act 15:39", "n": "", "vs": [[39, "فوقعت بينهما مشاجرة حتى انفصل أحدهما عن الآخر. فأخذ برنابا مرقس وسافر بحرا إلى قبرص،"]]}, {"l": "Act 15:40", "n": "", "vs": [[40, "واختار بولس أن يرافقه سيلا. فأسلمه الإخوة إلى نعمة الله،"]]}, {"l": "1Co 12:18-21", "n": "", "vs": [[18, "على أن الله قد رتب كلا من الأعضاء في الجسد كما أراد."], [19, "فلو كانت كلها عضوا واحدا، فكيف يتكون الجسد؟"], [20, "فالواقع أن الأعضاء كثيرة، والجسد واحد."], [21, "وهكذا، لا تستطيع العين أن تقول لليد: «أنا لا أحتاج إليك!» ولا الرأس أن تقول للرجلين: «أنا لا أحتاج إليكما!»،"]]}], "kwAr": "اثنان خير", "noteAr": ""}, {"kw": "a good", "raw": "Rth_2:12; Joh_4:36; 2Jo_1:8", "note": "", "refs": [{"l": "Rut 2:12", "n": "", "vs": [[12, "ليكافئك الرب إله إسرائيل، الذي جئت لتحتمي تحت جناحيه، وفقا لإحسانك. وليكن أجرك كاملا من عنده»."]]}, {"l": "Joh 4:36", "n": "", "vs": [[36, "والحاصد يأخذ أجرته، ويجمع الثمر للحياة الأبدية، فيفرح الزارع والحاصد معا،"]]}, {"l": "2Jo 1:8", "n": "", "vs": [[8, "فانتبهوا لأنفسكم، لكي لا يضيع الجهد الذي بذلناه في سبيلكم، بل لتنالوا أجركم كاملا."]]}], "kwAr": "حسن الثواب", "noteAr": ""}], "arS": [["اثنان", ["H8147"]], [" ", []], ["خير", ["H2896"]], [" ", []], ["من", ["H4480"]], [" ", []], ["واحد", ["H259"]], ["، ", []], ["لأن", ["H834"]], [" لهما حسن ", []], ["الثواب", ["H7939"]], [" على ", []], ["كدهما", ["H5999"]], [".", []]]}, {"c": 4, "v": 10, "text": "لأنه إذا سقط أحدهما ينهضه الآخر. ولكن ويل لمن هو وحيد، لأنه إن سقط فلا مسعف له على النهوض.", "groups": [{"kw": "if", "raw": "Exo_32:2-4, Exo_32:21; Deu_9:19, Deu_9:20; 1Sa_23:16; 2Sa_11:27, 2Sa_12:7-14; Job_4:3, Job_4:4; Isa_35:3, Isa_35:4; Luk_22:31, Luk_22:32; Gal_2:11-14, Gal_6:1; 1Th_4:18, 1Th_5:11", "note": "", "refs": [{"l": "Exo 32:2-4", "n": "", "vs": [[2, "فأجابهم هرون: «انزعوا أقراط الذهب التي في آذان نسائكم وبناتكم وبنيكم، وأعطوني إياها»."], [3, "فنزعوها من آذانهم، وجاءوا بها إليه."], [4, "فأخذها منهم وصهرها وصاغ عجلا. عندئذ قالوا: «هذه آلهتك ياإسرائيل التي أخرجتك من ديار مصر»."]]}, {"l": "Exo 32:21", "n": "", "vs": [[21, "وخاطب موسى هرون: «ماذا فعل بك هذا الشعب حتى جلبت عليه هذه الخطيئة العظيمة؟»"]]}, {"l": "Deu 9:19", "n": "", "vs": [[19, "لأنني جزعت من غضب الرب واحتدام سخطه عليكم، حتى أوشك أن يبيدكم. فاستجاب لي الرب أيضا في تلك المرة."]]}, {"l": "Deu 9:20", "n": "", "vs": [[20, "كما غضب الرب على هرون أيضا حتى كاد أن يهلكه، فصليت من أجله حينئذ، فقبل الرب تضرعي."]]}, {"l": "1Sa 23:16", "n": "", "vs": [[16, "فأقبل يوناثان بن شاول إلى داود في الغابة ليقوي من ثقته بالله،"]]}, {"l": "2Sa 11:27", "n": "", "vs": [[27, "وحين انقضت فترة الحداد، أرسل داود وأحضرها إلى القصر وتزوجها وولدت ابنا ولكن الرب استاء من هذا الأمر الذي ارتكبه داود."]]}, {"l": "2Sa 12:7-14", "n": "", "vs": [[7, "فقال ناثان لداود: «أنت هو الرجل! وهذا ما يقوله الرب إله إسرائيل: لقد اخترتك لتكون ملكا على إسرائيل وأنقذتك من قبضة شاول،"], [8, "ووهبتك بيت سيدك وزوجاته، ووليتك على بني إسرائيل ويهوذا. ولو كان ذلك قليلا لوهبتك المزيد."], [9, "فلماذا احتقرت كلام الرب لتقترف الشر أمامه؟ قتلت أوريا الحثي بسيف العمونيين وتزوجت امرأته."], [10, "لذلك لن يفارق السيف بيتك إلى الأبد، لأنك احتقرتني واغتصبت امرأة أوريا الحثي»."], [11, "واستطرد: «هذا ما يقوله الرب: سأثير عليك من أهل بيتك من ينزل بك البلايا، وآخذ نساءك أمام عينيك وأعطيهن لقريبك، فيضاجعهن في وضح النهار."], [12, "أنت ارتكبت خطيئتك في السر، وأنا أفعل هذا الأمر على مرأى جميع بني إسرائيل وفي وضح النهار»."], [13, "فقال داود لناثان: «قد أخطأت إلى الرب». فقال ناثان: «والرب قد نقل عنك خطيئتك، فلن تموت."], [14, "ولكن لأنك جعلت أعداء الرب يشمتون من جراء هذا الأمر، فإن الابن المولود لك يموت»."]]}, {"l": "Job 4:3", "n": "", "vs": [[3, "لكم أرشدت كثيرين وشددت أيادي مرتخية."]]}, {"l": "Job 4:4", "n": "", "vs": [[4, "ولكم أنهض كلامك العاثر، وثبت الركب المصطكة!"]]}, {"l": "Isa 35:3", "n": "", "vs": [[3, "شددوا الأيدي المسترخية، وثبتوا الركب المرتعشة."]]}, {"l": "Isa 35:4", "n": "", "vs": [[4, "قولوا لذوي القلوب الخائرة: «تقووا ولا تفزعوا، فها هو إلهكم قادم، مقبل بالنقمة، حامل جزاءه. سيأتي ويخلصكم»."]]}, {"l": "Luk 22:31", "n": "", "vs": [[31, "وقال الرب «سمعان، سمعان! ها إن الشيطان قد طلبكم لكي يغربلكم كما يغربل القمح،"]]}, {"l": "Luk 22:32", "n": "", "vs": [[32, "ولكني تضرعت لأجلك لكي لا يخيب إيمانك. وأنت، بعد أن تسترد، ثبت إخوتك»."]]}, {"l": "Gal 2:11-14", "n": "", "vs": [[11, "ولكن لما جاء بطرس إلى مدينة أنطاكية، قاومته وجها لوجه لأنه كان يستحق أن يلام."], [12, "إذ قبل أن يأتي بعضهم من عند يعقوب، كان بطرس يأكل مع الإخوة الذين من الأمم؛ ولكن لما أتى أولئك، انسحب وعزل نفسه، خوفا من أهل الختان."], [13, "وجاراه في ريائه باقي الإخوة الذين من اليهود. حتى إن برنابا أيضا انساق إلى ريائهم."], [14, "فلما رأيت أنهم لا يسلكون باستقامة توافق حق الإنجيل، قلت لبطرس أمام الحاضرين جميعا: «إن كنت وأنت يهودي تعيش كالأمم لا كاليهود، فكيف تجبر الأمم أن يعيشوا كاليهود؟»"]]}, {"l": "Gal 6:1", "n": "", "vs": [[1, "أيها الإخوة، إن 9"]], [" القوي ", []], ["يغلب", ["H8630"]], [" واحدا أضعف منه، فإن ", []], ["اثنين", ["H8147"]], [" قادران على ", []], ["مقاومته", ["H5975", "H5048"]], [". ", []], ["فالخيط", ["H2339"]], [" ", []], ["المثلث", ["H8027"]], [" يتعذر ", []], ["قطعه", ["H5423"]], [" ", []], ["سريعا", ["H4120"]], [".", []]]}, {"c": 4, "v": 13, "text": "شاب فقير حكيم خير من ملك شيخ جاهل كف عن قبول النصيحة،", "groups": [{"kw": "is a poor", "raw": "Ecc_9:15, Ecc_9:16; Gen_37:2; Pro_19:1, Pro_28:6, Pro_28:15, Pro_28:16", "note": "", "refs": [{"l": "Ecc 9:15", "n": "", "vs": [[15, "وكان يقيم في تلك المدينة رجل مسكين حكيم أنقذ المدينة بفضل حكمته. ولكن أحدا لم يذكره."]]}, {"l": "Ecc 9:16", "n": "", "vs": [[16, "فقلت: إن الحكمة خير من القوة. غير أن حكمة المسكين محتقرة وكلامه غير مسموع."]]}, {"l": "Gen 37:2", "n": "", "vs": [[2, "وهذا سجل بسيرة يعقوب. إذ كان يوسف غلاما في السابعة عشرة من عمره، راح يرعى الغنم مع إخوته أبناء بلهة وزلفة زوجتي أبيه، فأبلغ يوسف أباه بنميمتهم الرديئة."]]}, {"l": "Pro 19:1", "n": "", "vs": [[1, "الفقير السالك بكماله خير من الجاهل المخاتل."]]}, {"l": "Pro 28:6", "n": "", "vs": [[6, "الرجل الفقير السالك بكماله، خير من الغني المنحرف في طرقه."]]}, {"l": "Pro 28:15", "n": "", "vs": [[15, "الحاكم العاتي المتسلط على الضعفاء، مثل أسد زائر أو دب ثائر."]]}, {"l": "Pro 28:16", "n": "", "vs": [[16, "الحاكم المفتقر إلى الفطنة، هو متسلط جائر. ومن يمقت الربح الحرام يتمتع بعمر مديد."]]}], "kwAr": "شاب فقير حكيم", "noteAr": ""}, {"kw": "will no more be", "raw": "Heb. knoweth not to be, 1Ki_22:8; 2Ch_16:9, 2Ch_16:10, 2Ch_24:20-22, 2Ch_25:16", "note": "Heb. knoweth not to be, 1Ki_22:8; 2Ch_16:9, 2Ch_16:10, 2Ch_24:20-22, 2Ch_25:16", "refs": [{"l": "1Ki 22:8", "n": "", "vs": [[8, "فأجاب ملك إسرائيل: «يوجد بعد رجل واحد، يمكننا عن طريقه أن نطلب مشورة الرب، ولكني أمقته لأنه لا يتنبأ علي بغير الشر. إنه ميخا بن يملة». فقال يهوشافاط: «لا تقل هذا أيها الملك»."]]}, {"l": "2Ch 16:9", "n": "", "vs": [[9, "إن عيني الرب تجولان في الأرض قاطبة ليقوي ذوي القلوب الخالصة له، أما أنت فقد تصرفت بحماقة في هذا الأمر لهذا تثور ضدك حروب»."]]}, {"l": "2Ch 16:10", "n": "", "vs": [[10, "فغضب آسا على النبي وزج به في السجن لأنه اغتاظ من كلامه، كذلك ضايق آسا بعضا من أفراد الشعب في ذلك الحين."]]}, {"l": "2Ch 24:20-22", "n": "", "vs": [[20, "فحل روح الله على زكريا بن يهوياداع الكاهن، فوقف أمام الشعب وقال لهم: «هذا ما يقوله الله : لماذا تتعدون أوامر الرب فلا تفلحون؟ لقد نبذتم الرب فنبذكم الرب»."], [21, "فكادوا له حتى أمر الملك برجمه بالحجارة في ساحة الهيكل."], [22, "ولم يذكر الملك الفضل الذي أسداه إليه يهوياداع، بل قتل ابنه، وفيما هو يلفظ أنفاسه قال: «لينظر الرب ويجر قضاءه»."]]}, {"l": "2Ch 25:16", "n": "", "vs": [[16, "فقاطعه الملك وقال: «هل أقمناك أحد مشيري الملك؟ كف لئلا تقتل». فانصرف النبي وهو يقول: «قد أيقنت أن الله قضى بإهلاكك، لأنك ارتكبت هذا وأبيت أن تسمع لمشورتي»."]]}], "kwAr": "كف عن قبول النصيحة", "noteAr": "بالعبرانية: لا يعرف أن يكون. انظر 1مل 22: 8؛ 2أخ 16: 9، 10؛ 24: 20-22؛ 25: 16"}], "arS": [["شاب", ["H3206"]], [" ", []], ["فقير", ["H4542"]], [" ", []], ["حكيم", ["H2450"]], [" ", []], ["خير", ["H2896"]], [" ", []], ["من", ["H4480"]], [" ", []], ["ملك", ["H4428"]], [" ", []], ["شيخ", ["H2205"]], [" ", []], ["جاهل", ["H3684"]], [" ", []], ["كف", ["H5750"]], [" عن قبول ", []], ["النصيحة", ["H2094"]], ["،", []]]}, {"c": 4, "v": 14, "text": "لأنه قد يخرج من السجن ليتبوأ عرش الملك، وإن كان مولودا في عائلة فقيرة من عائلات المملكة.", "groups": [{"kw": "For out", "raw": "This is probably an allusion to some fact with which we are unacquainted. History furnishes many instances of mean persons raised to sovereign authority, and of kings being reduced to the meanest offices, and to a morsel. Agrippa mounted the throne of Israel after having been long in prison; and similar instances are not wanting in modern times. Gen_41:14, Gen_41:33-44; Job_5:11; Psa_113:7, Psa_113:8", "note": "This is probably an allusion to some fact with which we are unacquainted. History furnishes many instances of mean persons raised to sovereign authority, and of kings being reduced to the meanest offices, and to a morsel. Agrippa mounted the throne of Israel after having been long in prison; and similar instances are not wanting in modern times. Gen_41:14, Gen_41:33-44; Job_5:11; Psa_113:7, Psa_113:8", "refs": [{"l": "Gen 41:14", "n": "", "vs": [[14, "فبعث فرعون واستدعى يوسف، فأسرعوا وأتوا به من السجن فحلق واستبدل ثيابه ومثل أمام فرعون."]]}, {"l": "Gen 41:33-44", "n": "", "vs": [[33, "والآن ليبحث فرعون عن رجل بصير حكيم يوليه على البلاد،"], [34, "وليقم فرعون نظارا على أرض مصر يجبون خمس غلتها في سنوات الرخاء السبع."], [35, "وليجمعوا كل طعام سنوات الخير المقبلة، ويخزنوا القمح بتفويض من فرعون ويحفظوه في المدن ليكون طعاما،"], [36, "ومؤونة لأهل الأرض في سنوات المجاعة السبع التي ستسود أرض مصر فلا يهلكون جوعا»."], [37, "فاستحسن فرعون ورجاله جميعا هذا الكلام،"], [38, "وقال فرعون لعبيده: «هل نجد نظير هذا رجلا فيه روح الله؟»"], [39, "ثم قال فرعون ليوسف: «من حيث أن الله قد أطلعك على كل هذا، فليس هناك بصير وحكيم نظيرك."], [40, "لذلك أوليك على بيتي، ويذعن شعبي لكل أمر تصدره، ولن يكون أعظم منك سواي أنا صاحب العرش»."], [41, "ثم قال فرعون ليوسف: «ها أنا قد وليتك على كل أرض مصر»."], [42, "ونزع فرعون خاتمه من يده ووضعه في يد يوسف، وألبسه ثياب كتان فاخرة وطوق عنقه بطوق من ذهب،"], [43, "وأركبه في مركبته الثانية، ونادوا: «اركعوا أمامه». وأقامه واليا على كل أرض مصر."], [44, "وقال فرعون ليوسف: «أنا فرعون، ولا أحد يمكن أن يحرك ساكنا في كل أرض مصر من غير إذنك»."]]}, {"l": "Job 5:11", "n": "", "vs": [[11, "يقيم المتواضعين في العلى، ويرفع النائحين إلى مكان الطمأنينة."]]}, {"l": "Psa 113:7", "n": "", "vs": [[7, "ينهض المسكين من التراب، ويرفع البائس من المزبلة،"]]}, {"l": "Psa 113:8", "n": "", "vs": [[8, "ليجلسه مع أشراف شعبه."]]}], "kwAr": "يخرج من السجن", "noteAr": "يحتمل أن هذا إشارة إلى واقعة لا نعرفها. فالتاريخ يقدم أمثلة كثيرة لأناس وضعاء ارتقوا إلى السلطان، ولملوك هبطوا إلى أدنى الوظائف وإلى لقمة العيش. فأغريبا اعتلى عرش إسرائيل بعد أن قضى زمنا طويلا في السجن؛ ولا تعوز الأمثلة المشابهة في العصور الحديثة. انظر تك 41: 14؛ 41: 33-44؛ أي 5: 11؛ مز 113: 7، 8"}, {"kw": "also", "raw": "1Ki_14:26, 1Ki_14:27; 2Ki_23:31-34, 2Ki_24:1, 2Ki_24:2, 2Ki_24:6, 2Ki_24:12, 2Ki_25:7, 2Ki_25:27-30; Lam_4:20; Dan_4:31", "note": "", "refs": [{"l": "1Ki 14:26", "n": "", "vs": [[26, "واستولى على خزائن بيت الرب وخزائن قصر الملك، وسلب كل ما فيها، لاسيما الأتراس الذهبية التي عملها سليمان."]]}, {"l": "1Ki 14:27", "n": "", "vs": [[27, "فصنع الملك رحبعام عوضا عنها أتراسا نحاسية، سلمها لرؤساء حرس باب قصر الملك."]]}, {"l": "2Ki 23:31-34", "n": "", "vs": [[31, "وكان يهوآحاز في الثالثة والعشرين من عمره حين ملك، ودام حكمه ثلاثة أشهر في أورشليم، واسم أمه حموطل بنت إرميا من لبنة."], [32, "وارتكب الشر في عيني الرب على غرار ما فعل آباؤه."], [33, "واعتقل فرعون نخو يهوآحاز وقيده في ربلة في أرض حماة لئلا يملك في أورشليم، وفرض جزية على البلاد: مئة وزنة من الفضة (نحو ثلاث مئة وستين كيلو جراما)، ووزنة من الذهب (نحو ثلاثة كيلوجرامات)."], [34, "ونصب فرعون نخو ألياقيم بن يوشيا خلفا ليوشيا أبيه، وغير اسمه إلى يهوياقيم. ثم ساق يهوآحاز أسيرا إلى مصر حيث مات."]]}, {"l": "2Ki 24:1", "n": "", "vs": [[1, "وفي غضون حكمه هاجم نبوخذناصر ملك بابل مملكة يهوذا، فخضع له يهوياقيم طوال ثلاث سنوات، ثم تمرد عليه."]]}, {"l": "2Ki 24:2", "n": "", "vs": [[2, "فأرسل الرب غزاة من كلدانيين وأراميين وموآبيين وعمونيين للإغارة على مملكة يهوذا وإبادتها، بموجب ما قضى به الرب على لسان عبيده الأنبياء."]]}, {"l": "2Ki 24:6", "n": "", "vs": [[6, "ثم مات يهوياقيم، وخلفه ابنه يهوياكين."]]}, {"l": "2Ki 24:12", "n": "", "vs": [[12, "فاستسلم يهوياكين ملك يهوذا وأمه ورجاله وقادته وخصيانه إلى ملك بابل، فقبض عليه نبوخذناصر. وكان ذلك في السنة الثامنة لملكه."]]}, {"l": "2Ki 25:7", "n": "", "vs": [[7, "ثم قتلوا أبناء صدقيا على مرأى منه، وقلعوا عينيه، وقيدوه بسلسلتين من نحاس، وساقوه إلى بابل."]]}, {"l": "2Ki 25:27-30", "n": "", "vs": [[27, "وفي السنة السابعة والثلاثين لسبي يهوياكين ملك يهوذا، في اليوم السابع والعشرين من الشهر الثاني عشر، أطلق أويل مرودخ ملك بابل، بمناسبة توليه العرش، يهوياكين ملك يهوذا من السجن."], [28, "وتلطف به وأكرمه إكراما فوق إكرامه لسائر الملوك الذين معه في بابل،"], [29, "وأبدل ثياب سجنه، فصار ينادم الملك على مائدته بصورة دائمة."], [30, "وصرف له ملك بابل راتبا يوميا كل أيام حياته."]]}, {"l": "Lam 4:20", "n": "", "vs": [[20, "وقع في حفرهم مصدر حياتنا، الملك الذي اختاره الرب، الذي قلنا: في ظله نعيش بين الأمم."]]}, {"l": "Dan 4:31", "n": "", "vs": [[31, "وفيما كانت كلماته بعد تتردد على شفتيه تجاوب صوت من السماء قائلا: «يانبوخذناصر الملك، لك يقولون الآن قد زال عنك الملك."]]}], "kwAr": "مولودا في عائلة فقيرة", "noteAr": ""}], "arS": [["لأنه", ["H3588"]], [" قد ", []], ["يخرج", ["H3318"]], [" ", []], ["من", ["H4480"]], [" ", []], ["السجن", ["H631"]], [" ", []], ["ليتبوأ", ["H4427"]], [" عرش ", []], ["الملك", ["H4438"]], ["، ", []], ["وإن", ["H3588"]], [" كان ", []], ["مولودا", ["H3205"]], [" في عائلة ", []], ["فقيرة", ["H7326"]], [" من عائلات المملكة.", []]]}, {"c": 4, "v": 15, "text": "وقد رأيت جميع الأحياء السائرين تحت الشمس يلتفون حول الشاب الذي يخلف الملك الشيخ.", "groups": [{"kw": "child", "raw": "2Sa_15:6", "note": "", "refs": [{"l": "2Sa 15:6", "n": "", "vs": [[6, "وظل أبشالوم يفعل هذا الأمر مع كل قادم بقضية إلى الملك، حتى تمكن من اكتساب قلوب رجال إسرائيل."]]}], "kwAr": "الشاب", "noteAr": ""}], "arS": [["وقد ", []], ["رأيت", ["H7200"]], [" ", []], ["جميع", ["H3605"]], [" ", []], ["الأحياء", ["H2416"]], [" ", []], ["السائرين", ["H1980"]], [" ", []], ["تحت", ["H8478"]], [" ", []], ["الشمس", ["H8121"]], [" ", []], ["يلتفون", ["H5975"]], [" حول ", []], ["الشاب", ["H3206"]], [" ", []], ["الذي", ["H834"]], [" ", []], ["يخلف", ["H8145"]], [" الملك الشيخ.", []]]}, {"c": 4, "v": 16, "text": "ولم يكن نهاية للجماهير الذين سار في طليعتهم، غير أن الأجيال اللاحقة لا تسر به، فهذا أيضا باطل وكملاحقة الريح.", "groups": [{"kw": "no end", "raw": "2Sa_15:12, 2Sa_15:13; 1Ki_1:5-7, 1Ki_1:40, 1Ki_12:10-16", "note": "", "refs": [{"l": "2Sa 15:12", "n": "", "vs": [[12, "وفي أثناء تقريبه ذبائح، استدعى أبشالوم أخيتوفل الجيلوني مشير داود، من بلدته جيلوه. وتفاقمت الفتنة وازداد التفاف الشعب حول أبشالوم."]]}, {"l": "2Sa 15:13", "n": "", "vs": [[13, "فجاء مخبر قال لداود: «إن قلوب رجال إسرائيل قد مالت نحو أبشالوم»."]]}, {"l": "1Ki 1:5-7", "n": "", "vs": [[5, "وعظم أدونيا ابن حجيث نفسه قائلا: «أنا أملك»، وجهز لنفسه مركبات وفرسانا واستأجر خمسين رجلا يجرون أمام موكبه."], [6, "ولم يغضبه أبوه قط بسؤاله: «لماذا فعلت هكذا؟» وكان أدونيا وسيم الطلعة، وقد أنجبته أمه بعد أبشالوم."], [7, "وتداول الأمر مع يوآب بن صروية وأبياثار الكاهن فأعاناه،"]]}, {"l": "1Ki 1:40", "n": "", "vs": [[40, "وصعد جميع الشعب وراء سليمان وهم يعزفون على الناي هاتفين فرحا، حتى ارتجت الأرض من أصواتهم."]]}, {"l": "1Ki 12:10-16", "n": "", "vs": [[10, "فأجابوه: «تقول لهذا الشعب الذي طالبك بتخفيف نير أبيك عنهم: إن خنصري أغلظ من خاصرة أبي."], [11, "أبي أثقل عليكم النير وأنا أضاعفه. أبي أدبكم بالسياط وأنا أؤدبكم بالعقارب»."], [12, "وفي اليوم الثالث مثل يربعام وسائر الشعب أمام رحبعام، كما طلب إليهم الملك."], [13, "وتلقوا رده القاسي الذي تجاهل فيه مشورة الشيوخ،"], [14, "وخاطبهم بما أشار عليه الأحداث قائلا: «أبي أثقل عليكم النير وأنا أضاعفه. أبي أدبكم بالسياط، وأنا أؤدبكم بالعقارب»."], [15, "ورفض رحبعام الاستجابة لمطالب الشعب، وكان ذلك من الرب لينفذ ما تكلم به على لسان أخيا الشيلوني بشأن يربعام بن نباط."], [16, "فلما رأى كل بني إسرائيل أن الملك لم يستجب لمطالبهم، أجابوه: «أي نصيب لنا في داود، وأي حظ لنا بابن يسى؟ فإلى بيوتك ياإسرائيل. وليملك رحبعام على أهله وعشيرته». وانصرف الإسرائيليون عنه إلى منازلهم."]]}], "kwAr": "ولم يكن نهاية", "noteAr": ""}, {"kw": "they also", "raw": "Jdg_9:19, Jdg_9:20; 2Sa_18:7, 2Sa_18:8, 2Sa_19:9", "note": "", "refs": [{"l": "Jdg 9:19", "n": "", "vs": [[19, "فإن كنتم قد تصرفتم بحق وصواب مع يربعل وأهل بيته في هذا اليوم، فهنيئا لكم بأبيمالك وهنيئا له بكم."]]}, {"l": "Jdg 9:20", "n": "", "vs": [[20, "وإلا فلتندلع نار من أبيمالك وتلتهم أهل شكيم وسكان القلعة، ولتندلع نار من أهل شكيم ومن سكان القلعة وتلتهم أبيمالك»."]]}, {"l": "2Sa 18:7", "n": "", "vs": [[7, "انتهت بهزيمة جيش إسرائيل أمام قوات داود، وقتل منهم عشرون ألفا في مجزرة ذلك اليوم."]]}, {"l": "2Sa 18:8", "n": "", "vs": [[8, "واتسعت رقعة القتال، وافترست الغابة من الجيش أكثر من الذين افترسهم السيف في ذلك اليوم."]]}, {"l": "2Sa 19:9", "n": نار آكلة!»"]]}], "kwAr": "قدمك", "noteAr": ""}, {"kw": "ready", "raw": "Act_10:33, Act_17:11; Jam_1:19; 1Pe_2:1, 1Pe_2:2", "note": "", "refs": [{"l": "Act 10:33", "n": "", "vs": [[33, "فأرسلت حالا أدعوك، وقد أحسنت بمجيئك. ونحن الآن جميعا حاضرون أمام الله لنسمع كل ما أمرك به الرب»."]]}, {"l": "Act 17:11", "n": "", "vs": [[11, "وكان يهود بيرية أشرف من يهود تسالونيكي، فقبلوا كلمة الله برغبة شديدة، وأخذوا يدرسون الكتاب يوميا ليتأكدوا من صحة التعليم."]]}, {"l": "Jam 1:19", "n": "", "vs": [[19, "لذلك، ياإخوتي الأحباء، على كل واحد منكم أن يكون مسرعا إلى الإصغاء، غير متسرع في الكلام، بطيء الغضب."]]}, {"l": "1Pe 2:1", "n": "", "vs": [[1, "لذلك، تخلصوا من كل أثر للشر والخداع والرياء والحسد والذم."]]}, {"l": "1Pe 2:2", "n": "", "vs": [[2, "وكأطفال مولودين حديثا، تشوقوا إلى اللبن الروحي النقي لكي تنموا به إلى أن تبلغوا الخلاص،"]]}], "kwAr": "الدنو للاستماع", "noteAr": ""}, {"kw": "give", "raw": "Gen_4:3-5; 1Sa_13:12, 1Sa_13:13, 1Sa_15:21, 1Sa_15:22; Psa_50:8-18; Pro_15:8, Pro_21:27; Isa_1:12-15, Isa_66:3; Jer_7:21-23; Hos_6:6, Hos_6:7; Mal_1:10, Mal_1:11; Heb_10:26", "note": "", "refs": [{"l": "Gen 4:3-5", "n": "", "vs": [[3, "وحدث بعد مرور أيام أن قدم قايين من ثمار الأرض قربانا للرب،"], [4, "وقدم هابيل أيضا من خيرة أبكار غنمه وأسمنها. فتقبل الرب قربان هابيل ورضي عنه."], [5, "لكنه لم يتقبل قربان قايين ولم يرض عنه. فاغتاظ قايين جدا وتجهم وجهه كمدا."]]}, {"l": "1Sa 13:12", "n": "", "vs": [[12, "فقلت إن الفلسطينيين متأهبون الآن للهجوم علي في الجلجال وأنا لم أتضرع إلى الرب بعد طلبا لعونه، فوجدت نفسي مرغما على تقريب المحرقة»."]]}, {"l": "1Sa 13:13", "n": "", "vs": [[13, "فقال صموئيل لشاول: «لقد تصرفت بحماقة، فأنت قد عصيت وصية الرب إلهك التي أمرك بها. ولو أطعته لثبت ملكك على إسرائيل إلى الأبد."]]}, {"l": "1Sa 15:21", "n": "", "vs": [[21, "فاختار القوم من الغنيمة أفضل الغنم والبقر لتقريبها ذبائح للرب إلهك في الجلجال»."]]}, {"l": "1Sa 15:22", "n": "", "vs": [[22, "فقال صموئيل: «هل يسر الرب بالذبائح والمحرقات كسروره بالاستماع إلى صوته؟ إن الاستماع أفضل من الذبيحة، والإصغاء أفضل من شحم الكباش."]]}, {"l": "Psa 50:8-18", "n": "", "vs": [[8, "لست أوبخك على ذبائحك فإن محرقاتك هي دائما قدامي."], [9, "فما كنت لآخذ من بيتك ثورا ولا من حظائرك تيسا."], [10, "لأن جميع حيوانات الغابة ملكي، وكذلك البهائم المنتشرة على ألوف الجبال."], [11, "أنا عالم بجميع طيور الجبال، وكل مخلوقات البراري هي لي."], [12, "إن جعت لا ألتمس منك حاجتي لأن لي المسكونة وكل ما فيها."], [13, "هل آكل لحم الثيران، أو أشرب دم التيوس؟"], [14, "قدم لله ذبائح الحمد وأوف العلي عهودك."], [15, "ادعني في يوم ضيقك أنقذك فتمجدني»."], [16, "وقال الله للشرير: «بأي حق تحدث بأحكامي، ولماذا تتكلم عن عهدي،"], [17, "وأنت تمقت التأديب ولا تكترث لكلامي؟"], [18, "ترى سارقا فتوافقه، ومع الزناة نصيبك."]]}, {"l": "Pro 15:8", "n": "", "vs": [[8, "قربان المنافقين مكرهة الرب، ومسرته صلاة المستقيمين."]]}, {"l": "Pro 21:27", "n": "", "vs": [[27, "ذبيحة الشرير رجس عند الرب، فكم بالحري إن قربها بنية أثيمة؟"]]}, {"l": "Isa 1:12-15", "n": "", "vs": [[12, "حين جئتم لتمثلوا أمامي، من طلب منكم أن تدوسوا دوري؟"], [13, "كفوا عن تقديم قرابين باطلة، فالبخور رجس لي، وكذلك رأس الشهر والسبت والدعاء إلى المحفل، فأنا لا أطيق الاعتكاف مع ارتكاب الإثم."], [14, "لشد ما تبغض نفسي احتفالات رؤوس شهوركم ومواسم أعيادكم! صارت علي عبئا، وسئمت حملها."], [15, "عندما تبسطون نحوي أيديكم أحجب وجهي عنكم، وإن أكثرتم الصلاة لا أستجيب، لأن أيديكم مملوءة دما."]]}, {"l": "Isa 66:3", "n": "", "vs": [[3, "إن من ينحر ثورا كمن يقتل إنسانا، ومن يقرب حملا كمن يكسر عنق كلب، ومن يصعد تقدمة حنطة كمن يقدم دم خنزير، ومن يحرق بخورا كمن يبارك وثنا، لأن هؤلاء آثروا طرقهم، واستطابت نفوسهم أرجاسهم."]]}, {"l": "Jer 7:21-23", "n": "", "vs": [[21, "وهذا ما يعلنه الرب القدير إله إسرائيل: «أضيفوا محرقاتكم إلى ذبائحكم وكلوا لحمها."], [22, "فإني لم أكلم آباءكم ولم آمرهم يوم أخرجتهم من مصر بشأن محرقة أو ذبيحة"], [23, "إنما أوصيتهم أن يطيعوا صوتي فأكون لهم إلها، ويكونون لي شعبا وأن يسلكوا في كل الطريق الذي أوصيتهم به، فينالوا خيرا."]]}, {"l": "Hos 6:6", "n": "", "vs": [[6, "إني أطلب رحمة لا ذبيحة، ومعرفتي أكثر من المحرقات."]]}, {"l": "Hos 6:7", "n": "", "vs": [[7, "ولكنكم مثل آدم، نقضتم عهدي وغدرتم بي."]]}, {"l": "Mal 1:10", "n": "", "vs": [[10, "آه، ياليت بينكم من يغلق أبواب الهيكل لئلا توقدوا نارا باطلة على مذبحي، يقول الرب القدير: إذ لا مسرة لي بكم ولا أرضى بتقدمة من أيديكم."]]}, {"l": "Mal 1:11", "n": "", "vs": [[11, "لأنه من مشرق الشمس إلى مغربها اسمي عظيم بين الأمم، وفي كل مكان يحرق لاسمي بخور وذبائح طاهرة، لأن اسمي عظيم بين الأمم، يقول الرب القدير."]]}, {"l": "Heb 10:26", "n": "", "vs": [[26, "فإن أخطأنا عمدا برفضنا للمسيح بعد حصولنا على معرفة الحق، لا تبقى هناك ذبيحة لغفران الخطايا،"]]}], "kwAr": "تقريب ذبيحة", "noteAr": ""}], "arS": [["احرص", ["H8104"]], [" ", []], ["أن", ["H3588"]], [" تكون ", []], ["قدمك", ["H7272"]], [" طاهرة عندما ", []], ["تذهب", ["H1980"]], [" ", []], ["إلى", ["H413"]], [" ", []], ["بيت", ["H1004"]], [" ", []], ["الرب", ["H430"]], ["، فإن ", []], ["الدنو", ["H7126"]], [" ", []], ["للاستماع", ["H8085"]], [" خير ", []], ["من", ["H4480"]], [" ", []], ["تقريب", ["H5414"]], [" ", []], ["ذبيحة", ["H2077"]], [" ", []], ["الجهال", ["H3045", "H3684"]], [" ", []], ["الذين", ["H834"]], [" ", []], ["لا", ["H369"]], [" يدركون أنهم ", []], ["يرتكبون", ["H6213"]], [" ", []], ["شرا", ["H7451"]], [".", []]]}, {"c": 5, "v": 2, "text": "لا تتسرع في أقوال فمك، ولا يتهور قلبك في نطق كلام لغو أمام الله، فالله في السماء وأنت على الأرض، فلتكن كلماتك قليلة.", "groups": [{"kw": "not rash", "raw": "Gen_18:27, Gen_18:30, Gen_18:32, Gen_28:20, Gen_28:22; Num_30:2-5; Jdg_11:30; 1Sam. 14:24-45; Mar_6:23", "note": "", "refs": [{"l": "Gen 18:27", "n": "", "vs": [[27, "فأجاب إبراهيم: «ها أنا قد أخذت في مخاطبة المولى، مع أنني لست سوى تراب ورماد."]]}, {"l": "Gen 18:30", "n": "", "vs": [[30, "وقال إبراهيم: «لا يغضب المولى، بل دعني أتكلم. ماذا لو وجد هناك ثلاثون بارا؟». فأجابه: «لا أهلكها إن وجدت ثلاثين»."]]}, {"l": "Gen 18:32", "n": "", "vs": [[32, "وقال إبراهيم: «لا يغضب المولى، فأتكلم مرة أخرى: ماذا لو وجد هناك عشرة؟». فأجابه الرب: «لا أهلكها من أجل العشرة»."]]}, {"l": "Gen 28:20", "n": "", "vs": [[20, "ونذر يعقوب نذرا قائلا: «إن كان الله معي، ورعاني في هذه الطريق التي أنا أسير فيها ووفر لي طعاما لآكل وثيابا لألبس،"]]}, {"l": "Gen 28:22", "n": "", "vs": [[22, "ويكون هذا الحجر الذي نصبته عمودا بيتا لله، وأدفع عشر كل ما ترزقني به»."]]}, {"l": "Num 30:2-5", "n": "", "vs": [[2, "إذا نذر رجل نذرا للرب، أو أقسم أن يلتزم بأمر ما، فعليه أن يفي بكلامه وينفذ كل ما تعهد به."], [3, "ولكن إذا نذرت صبية نذرا للرب وألزمت نفسها بأمر، وهي ما برحت في بيت أبيها،"], [4, "وسمع أبوها ما نذرته أو تعهدت به، وسكت، فإنها تكون ملزمة بكل نذورها وتعهداتها."], [5, "ولكن إن منعها أبوها عند سماعه ما نذرت أو تعهدت به، فإنها لا تكون ملزمة بالإيفاء، والرب يصفح عنها لأن أباها قد منعها."]]}, {"l": "Jdg 11:30", "n": "", "vs": [[30, "ونذر يفتاح نذرا للرب وقال: «إن نصرتني على بني عمون،"]]}, {"l": "1Sa 14:24-45", "n": "", "vs": [[24, "وأعيا رجال إسرائيل في ذلك اليوم، لأن شاول حلف الشعب قائلا: «ملعون الرجل الذي يأكل طعاما إلى المساء حتى أنتقم من أعدائي». فلم يذق جميع القوم طعاما."], [25, "وأقبل كل الجيش إلى الغابة حيث كان العسل يتقاطر،"], [26, "ولكن لم يجرؤ أحد أن يتذوق منه خوفا من لعنة الحلف."], [27, "أما يوناثان فلم يكن حاضرا عندما استحلف والده القوم، فمد طرف عصاه التي كانت بيده وغمسه في قطر العسل وتذوق منه فانتعشت قوته."], [28, "فقال له واحد من المحاربين: «قد حلف أبوك القوم قائلا: ملعون الرجل الذي يأكل اليوم طعاما»، فأصاب الشعب الإعياء."], [29, "فقال يوناثان: «لقد أضر أبي بكل الجيش. انظروا كيف انتعشت قواي لأني ذقت قليلا من العسل."], [30, "فكيف يكون حال الجيش لو أكل اليوم من غنائم أعدائه التي أحرزها؟ ألا تكون عندئذ كارثة الفلسطينيين أدهى وأمر؟»"], [31, "في ذلك اليوم ظل الإسرائيليون يتعقبون الفلسطينيين ويقتلونهم من مخماس إلى أيلون. وأصاب الجيش إعياء شديد."], [32, "وهجم الجيش على الغنائم من الماشية وأخذوا غنما وبقرا وعجولا، وذبحوا على الأرض وأكلوا اللحم بدمه."], [33, "فأخبر بعضهم شاول قائلين: «إن الجيش يرتكب خطيئة بحق الرب، إذ يأكلون اللحم مع الدم». فقال شاول: «لقد نقضتم عهدكم. دحرجوا إلي حجرا كبيرا،"], [34, "وتفرقوا بين الجيش وأمروهم أن يحضروا بقرهم وشياههم ليذبحوها عند الحجر، ويتركوها لتسيل دماؤها، فلا يرتكبون إثما في حق الرب بأكل الدم». وفعل الجنود ما أمر شاول به فأحضروا بقرهم وذبحوها هناك."], [35, "وبنى شاول مذبحا للرب. فكان أول مذبح يشرع في بنائه."], [36, "وأمر شاول: «لنتعقب الفلسطينيين ليلا ونظل ننهبهم إلى ضوء الصباح، ولا نبق منهم أحدا». فأجابوه: «افعل كل ما يطيب لك». ولكن الكاهن قال: «لنستشر الله هنا»."], [37, "فاستشار شاول الله سائلا: «أنتعقب الفلسطينيين؟ أتنصرنا عليهم؟» فلم يحظ بجواب في ذلك اليوم."], [38, "فقال شاول: «اقتربوا إلى هنا يا جميع وجوه إسرائيل، وتقصوا أية خطيئة ارتكبت اليوم."], [39, "لأنه حي هو الرب مخلص إسرائيل إن الموت هو جزاء مرتكب الخطيئة حتى لو كان جانيها ابني يوناثان». فاعتصم القوم بالصمت."], [40, "فقال لكل الجيش: «قفوا أنتم في جانب، وأقف أنا وابني يوناثان في جانب آخر». فأجاب الشعب: «اصنع ما يروق لك»."], [41, "وصلى شاول للرب إله إسرائيل قائلا: «اكشف لي الحق». فوقعت القرعة على شاول ويوناثان، وتبرأ القوم."], [42, "وقال شاول: «ألقوا القرعة بيني وبين يوناثان ابني». فوقعت القرعة على يوناثان."], [43, "فقال شاول ليوناثان: «أخبرني ماذا جنيت؟» فقال يوناثان: «ذقت قليلا من العسل بطرف عصاي التي بيدي. أمن أجل قليل من العسل ينبغي أن أموت؟»"], [44, "فقال شاول: «ليضاعف الرب عقابي إن لم ينفذ بك حكم الموت»."], [45, "فهتف الجيش في وجه شاول: «أيموت يوناثان الذي صنع هذا الخلاص العظيم في إسرائيل؟ هذا لا يمكن! حي هو الرب، لا تسقط شعرة من رأسه إلى الأرض لأنه صنع هذا الأمر بمعونة الرب اليوم». وهكذا افتدى الشعب يوناثان فلم يمت."]]}, {"l": "Mar 6:23", "n": "", "vs": [[23, "وأقسم لها قائلا: «لأعطينك مهما طلبت مني، ولو نصف مملكتي!»"]]}], "kwAr": "لا تتسرع", "noteAr": ""}, {"kw": "thing", "raw": "or, word", "note": "or, word", "refs": [], "kwAr": "كلام لغو", "noteAr": "أو: كلمة."}, {"kw": "for", "raw": "Psa_115:3; Isa_55:9; Mat_6:9, let thy , Ecc_5:3, Ecc_5:7; Pro_10:19; Mat_6:7; Jam_3:2", "note": "Psa_115:3; Isa_55:9; Mat_6:9, let thy , Ecc_5:3, Ecc_5:7; Pro_10:19; Mat_6:7; Jam_3:2", "refs": [{"l": "Psa 115:3", "n": "", "vs": [[3, "إن إلهنا في السماوات. كل ما شاء صنع."]]}, {"l": "Isa 55:9", "n": "", "vs": [[9, "فكما ارتفعت السماوات عن الأرض، كذلك ارتفعت طرقي عن طرقكم، وأفكاري عن أفكاركم."]]}, {"l": "Mat 6:9", "n": "", "vs": [[9, "فصلوا أنتم مثل هذه الصلاة: أبانا الذي في السماوات، ليتقدس اسمك!"]]}, {"l": "Ecc 5:3", "n": "", "vs": [[3, "فكما تراود الأحلام النائم من كثرة العناء، كذلك أقوال الجهل تصدر عن الإفراط في الكلام."]]}, {"l": "Ecc 5:7", "n": "", "vs": [[7, "لأن في كثرة الأحلام أباطيل، وكذلك في اللغو المفرط؛ فاتق الله ."]]}, {"l": "Pro 10:19", "n": "", "vs": [[19, "في كثرة الكلام زلات لسان، ومن يضبط شفتيه فهو عاقل."]]}, {"l": "Mat 6:7", "n": "", "vs": [[7, "وعندما تصلون، لا تكرروا كلاما فارغا كما يفعل الوثنيون، ظنا منهم أنه بالإكثار من الكلام، يستجاب لهم."]]}, {"l": "Jam 3:2", "n": "", "vs": [[2, "فإننا جميعا معرضون للوقوع في أخطاء كثيرة. ولكن من يلجم لسانه ولا يخطيء في كلامه هو ناضج يقدر أن يسيطر على طبيعته سيطرة تامة."]]}], "kwAr": "فالله في السماء", "noteAr": "انظر مز 115: 3؛ إش 55: 9؛ مت 6: 9؛ «فلتكن كلماتك قليلة». انظر جا 5: 3، 7؛ أم 10: 19؛ مت 6: 7؛ يع 3: 2"}], "arS": [["لا", ["H408"]], [" ", []], ["تتسرع", ["H926"]], [" في ", []], ["أقوال", ["H1697"]], [" ", []], ["فمك", ["H6310"]], ["، ", []], ["ولا", ["H408"]], [" ", []], ["يتهور", ["H4116"]], [" ", []], ["قلبك", ["H3820"]], [" في ", []], ["نطق", ["H3318"]], [" ", []], ["كلام", ["H1697"]], [" لغو ", []], ["أمام", ["H6440"]], [" ", []], ["الله", ["H430"]], ["، ", []], ["فالله", ["H3588"]], [" في ", []], ["السماء", ["H8064"]], [" ", []], ["وأنت", ["H859"]], [" ", []], ["على", ["H5921"]], [" ", []], ["الأرض", ["H776"]], ["، ", []], ["فلتكن", ["H1961", "H3651"]], [" كلماتك ", []], ["قليلة", ["H4592"]], [".", []]]}, {"c": 5, "v": 3, "text": "فكما تراود الأحلام النائم من كثرة العناء، كذلك أقوال الجهل تصدر عن الإفراط في الكلام.", "groups": [{"kw": "a fools", "raw": "Ecc_10:12-14; Pro_10:19, Pro_15:2", "note": "", "refs": [{"l": "Ecc 10:12-14", "n": "", "vs": [[12, "كلمات فم الرجل الحكيم مفعمة بالنعمة، أما أقوال شفتي الأحمق فتبتلعه."], [13, "بداية كلمات فمه حماقة، وخاتمة حديثه جنون خبيث."], [14, "يكثر الأحمق من الكلام، ولا أحد يدري ماذا سيكون، ومن يقدر أن يخبره بما سيجري من بعده؟"]]}, {"l": "Pro 10:19", "n": "", "v
