 Pro_19:14; Mal_2:15", "note": "", "refs": [{"l": "Pro 5:18", "n": "", "vs": [[18, "ليكن ينبوع عفتك مباركا، واغتبط بامرأة شبابك،"]]}, {"l": "Pro 5:19", "n": "", "vs": [[19, "فتكون كالظبية المحبوبة والوعلة البهية، فترتوي من فيض فتنتها، وتظل دائما أسير حبها."]]}, {"l": "Pro 18:22", "n": "", "vs": [[22, "من عثر على زوجة صالحة نال خيرا وحظي بمرضاة الله."]]}, {"l": "Pro 19:14", "n": "", "vs": [[14, "البيت والثروة ميراث من الآباء، أما الزوجة العاقلة فهي من عند الرب."]]}, {"l": "Mal 2:15", "n": "", "vs": [[15, "ولكن لم يقدم على ذلك أي واحد مازالت فيه بقية من الروح. وماذا طلب هذا الواحد (أي إبراهيم)؟ ذرية الله. لهذا حافظوا على أرواحكم، ولا يغدر أحد بزوجة صباه."]]}], "kwAr": "مع المرأة التي أحببتها", "noteAr": ""}, {"kw": "all the days of the life", "raw": "Ecc_6:12; Psa_39:5, Psa_144:4", "note": "", "refs": [{"l": "Ecc 6:12", "n": "", "vs": [[12, "إذ من يدري ما هو خير للإنسان في الحيا ة التي يقضي فيها أياما قليلة باطلة كالظل؟ ومن يقدر أن يطلع الإنسان على ما سيحدث تحت الشمس من بعده؟"]]}, {"l": "Psa 39:5", "n": "", "vs": [[5, "هوذا قد جعلت حياتي قصيرة، وعمري كلا شيء أمامك. كل إنسان حي ليس سوى نفخة!"]]}, {"l": "Psa 144:4", "n": "", "vs": [[4, "إنما الإنسان أشبه بنفخة. أيامه كظل عابر."]]}], "kwAr": "أيام حياتك الباطلة", "noteAr": ""}, {"kw": "for", "raw": "Ecc_2:10, Ecc_2:24, Ecc_3:13, Ecc_3:22, Ecc_5:18", "note": "", "refs": [{"l": "Ecc 2:10", "n": "", "vs": [[10, "ولم أحرم عيني مما اشتهتاه، ولم أصد قلبي عن أية متعة، فابتهج قلبي لكل تعبي، وكان هذا ثوابي عن كل مشقتي."]]}, {"l": "Ecc 2:24", "n": "", "vs": [[24, "فليس أفضل للإنسان من أن يأكل ويشرب ويتمتع بتعب يديه. وهذا أيضا، كما أرى، هو من يد الله."]]}, {"l": "Ecc 3:13", "n": "", "vs": [[13, "إن من نعم الله على الإنسان أن يأكل ويشرب ويستمتع بما يجنيه من كده."]]}, {"l": "Ecc 3:22", "n": "", "vs": [[22, "فرأيت أنه ليس أفضل من أن يستمتع الإنسان بكده، لأن هذا نصيبه، لأنه من يرجعه ليرى ما سيجري من بعده؟"]]}, {"l": "Ecc 5:18", "n": "", "vs": [[18, "فتأمل ما وجدت: من الأفضل والأليق أن يأكل الإنسان ويشرب ويستمتع بما تكبده من عناء تحت الشمس طوال أيام حياته القليلة التي وهبها الله له، لأن هذا هو حظه."]]}], "kwAr": "لأن ذلك هو حظك", "noteAr": ""}], "arS": [["تمتع", ["H7200"]], [" طوال ", []], ["أيام", ["H3117"]], [" ", []], ["حياتك", ["H2416"]], [" ", []], ["الباطلة", ["H1892"]], [" ", []], ["التي", ["H834"]], [" ", []], ["أعطاك", ["H5414"]], [" إياها الرب ", []], ["تحت", ["H8478"]], [" ", []], ["الشمس", ["H8121"]], [" ", []], ["مع", ["H5973"]], [" ", []], ["المرأة", ["H802"]], [" ", []], ["التي", ["H834"]], [" ", []], ["أحببتها", ["H157"]], ["، ", []], ["لأن", ["H3588"]], [" ", []], ["ذلك", ["H1931"]], [" هو ", []], ["حظك", ["H2506"]], [" ", []], ["من", ["H834"]], [" ", []], ["الحياة", ["H2416"]], [" ومن ", []], ["عناء", ["H5999"]], [" تعبك الذي ", []], ["تكابده", ["H6001"]], [" ", []], ["تحت", ["H8478"]], [" ", []], ["الشمس", ["H8121"]], [".", []]]}, {"c": 9, "v": 10, "text": "وكل ما تحصل عليه من عمل، فاعمله بكل قوتك، إذ لن تجد في الهاوية التي أنت ماض إليها أي عمل أو ابتكار أو معرفة أو حكمة.", "groups": [{"kw": "thy hand", "raw": "Num_13:30; 1Ch_22:19, 1Ch_28:20, 1Ch_29:2, 1Ch_29:3; 2Ch_31:20, 2Ch_31:21; Ezr_6:14, Ezr_6:15; Neh_2:12-20, 3:1-16, Neh_4:2, Neh_4:6, Neh_4:9-13, Neh_4:17-23, 13:8-31; Psa_71:15-18; Jer_29:13; Mat_6:33; Joh_4:34; Rom_12:11, Rom_15:18-20; 1Co_9:24, 1Co_9:26; 1Co_15:10, 1Co_16:10; Eph_5:16; Col_3:23; 2Pe_1:12-15", "note": "", "refs": [{"l": "Num 13:30", "n": "", "vs": [[30, "ولكن كالب هدأ روع الشعب الماثل أمام موسى وقال: «لنمض ونمتلك الأرض لأننا قادرون حقا على ذلك»."]]}, {"l": "1Ch 22:19", "n": "", "vs": [[19, "فاعقدوا العزم في قلوبكم ونفوسكم على طلب الرب إلهكم، وتعاونوا على بناء مقدس الرب الإله لتنقلوا تابوت عهد الرب وآنية قدس الله إلى الهيكل الذي يبنى لاسم الرب»."]]}, {"l": "1Ch 28:20", "n": "", "vs": [[20, "فتقو وتشجع واعمل. لا تجزع ولا ترتعب لأن الرب الإله إلهي معك، ولن يخذلك ولا يتركك حتى تستوفي كل عمل خدمة هيكل الرب."]]}, {"l": "1Ch 29:2", "n": "", "vs": [[2, "وقد بذلت كل جهدي لتجهيز ما يتطلبه بناء هيكل إلهي من مواد، فوفرت الذهب لما يصنع من ذهب، والفضة لما يصنع من فضة، والنحاس لما يصنع من نحاس، والحديد لما يصنع من حديد، والخشب لما يصنع من خشب، وحجارة الجزع وجواهر ثمينة للترصيع، وحجارة ذات ألوان مختلفة، وحجارة كريمة ورخاما كثيرا."]]}, {"l": "1Ch 29:3", "n": "", "vs": [[3, "ولفرط سروري ببيت إلهي، فقد قدمت من مالي الخاص ذهبا وفضة، بالإضافة إلى كل ما أعددته للهيكل."]]}, {"l": "2Ch 31:20", "n": "", "vs": [[20, "هذا ما أجراه حزقيا في كل بلاد يهوذا، صانعا كل ما هو صالح وقويم وحق أمام الرب إلهه."]]}, {"l": "2Ch 31:21", "n": "", "vs": [[21, "وكل ما قام به في خدمة بيت الله كان طاعة للشريعة والوصية، وسعيا وراء طلب الله، بكل ولاء، فأفلح."]]}, {"l": "Ezr 6:14", "n": "", "vs": [[14, "وهكذا تابع شيوخ اليهود البناء بنجاح، تتميما لنبوءة حجي النبي وزكريا بن عدو، فاستكملوا البناء حسب أمر إله إسرائيل وأمر كورش وداريوس وأرتحششتا ملوك فارس."]]}, {"l": "Ezr 6:15", "n": "", "vs": [[15, "وتم بناء الهيكل في اليوم الثالث من شهر آذار، في السنة السادسة من ملك داريوس الملك."]]}, {"l": "Neh 2:12-20", "n": "", "vs": [[12, "ثم قمت ليلا برفقة نفر قليل من الرجال، من غير أن أطلع أحدا عما أثقل إلهي به قلبي لأصنعه في أورشليم. ولم يكن معي بهيمة سوى البهيمة التي أمتطيها."], [13, "فتسللت ليلا من باب الوادي، نحو عين التنين، حتى وصلت إلى بوابة الدمن. وشرعت أتفرس في أسوار أورشليم المنهدمة وأبوابها المحترقة،"], [14, "ثم اجتزت إلى باب العين، ومنه إلى بركة الملك، حيث لم يكن موضع تعبر عليه البهيمة التي أمتطيها."], [15, "ثم تابعت صعودي ليلا بمحاذاة الوادي، ورحت أتأمل في السور، ثم عدت راجعا عبر باب الوادي"], [16, "ولم يعرف الولاة وسواهم من اليهود والكهنة والأشراف وباقي العمال إلى أين ذهبت، ولا ما أنا مزمع فعله، لأنني لم أطلع أحدا على شيء."], [17, "ثم قلت لهم: أنتم تشهدون ما نحن عليه من ضنك، فأورشليم خربة وأبوابها محترقة، فهيا بنا نبني سور أورشليم فلا نقاسي بعد من العار."], [18, "وأطلعتهم عما رعاني به إلهي من عناية صالحة، وعلى حديث الملك الذي خاطبني به، فقالوا: لنقم ونبن السور وتضافروا جميعا للقيام بالعمل الصالح."], [19, "وعندما عرف سنبلط الحوروني وطوبيا العبد العموني وجشم العربي بما ننوي عمله، سخروا بنا واحتقرونا قائلين: أي أمر أنتم عازمون عليه؟ أتتمردون على الملك؟"], [20, "عندئذ أجبتهم: إله السماء يكلل عملنا بالنجاح، ونحن عبيده نقوم ونبني. وأما أنتم فلا نصيب لكم ولا حق ولا ذكر في أورشليم."]]}, {"l": "Neh 3:1-16", "n": "", "vs": [[1, "وقام ألياشيب رئيس الكهنة وبنى باب الضأن بمؤازرة إخوته الكهنة. ثم قدسوه وثبتوا مصاريعه، وثابروا على البناء حتى بلغوا برج المئة وبرج حننئيل."], [2, "وقام رجال أريحا إلى جوارهم يبنون جزءا من السور، وإلى جوارهم بنى زكور بن إمري،"], [3, "وبنى بنو هسناءة باب السمك، وسقفوه ونصبوا مصاريعه وأقفاله وعوارضه."], [4, "وإلى جوارهم رمم مريموث بن أوريا بن هقوص قسما من السور، كما قام إلى جوارهم مشلام بن برخيا بن مشيزبئيل بالترميم، وإلى جانبه رمم صادوق بن بعنا."], [5, "وإلى جوارهم رمم التقوعيون. أما أشرافهم فامتنعوا عن مؤازرة عمل أسيادهم."], [6, "ورمم يوياداع بن فاسيح ومشلام بن بسوديا الباب العتيق، وسقفاه ونصبا مصاريعه وأقفاله وعوارضه."], [7, "وإلى جوارهما قام ملطيا الجبعوني ويادون الميرونوثي من أهل جبعون والمصفاة بالترميم، حتى وصل إلى قصر حاكم منطقة غربي الفرات."], [8, "ورمم إلى جوارهما عزيئيل بن حرهايا الصائغ. وإلى جانبه رمم حننيا العطار وتركوا ترميم أورشليم إلى السور العريض."], [9, "وإلى جوارهم رمم رفايا بن حور، رئيس نصف دائرة أورشليم، جزءا من السور."], [10, "كما رمم إلى جوارهم يدايا بن حروماف القسم المقابل لبيته. وإلى جانبه رمم حطوش بن حشبنيا."], [11, "ورمم ملكيا بن حاريم وحشوب بن فحث موآب قسما ثانيا، بالإضافة إلى برج التنانير."], [12, "وقام إلى جانبه شلوم بن هلوحيش رئيس نصف دائرة أورشليم هو وبناته بالترميم."], [13, "ورمم حانون وسكان زانوح باب الوادي، ونصبوا مصاريعه وأقفاله وعوارضه، فضلا عن ألف ذراع (خمس مئة متر) من السور حتى باب الدمن."], [14, "ورمم ملكيا بن ركاب رئيس دائرة بيت هكاريم باب الدمن ونصب مصاريعه وأقفاله وعوارضه."], [15, "كما رمم شلون بن كلحوزة رئيس دائرة المصفاة باب العين وسقفه ونصب مصاريعه وأقفاله وعوارضه، وأعاد بناء سور بركة سلوام عند حديقة الملك حتى الدرج المنحدر من مدينة داود."], [16, "وبعده رمم نحميا بن عزبوق رئيس نصف دائرة بيت صور جزءا من السور حتى مقابل مدافن داود، فالبركة الاصطناعية إلى بيت الأبطال."]]}, {"l": "Neh 4:2", "n": "", "vs": [[2, "وتساءل أمام أقربائه وجيش السامرة: «أي شيء يفعله هؤلاء اليهود الضعفاء؟ هل في وسعهم أن يعيدوا بناء السور؟ هل يعودون لتقريب الذبائح؟ هل يكملون البناء في يوم واحد؟ هل يحيون الحجارة من أكوام الركام وهي محترقة؟»"]]}, {"l": "Neh 4:6", "n": "", "vs": [[6, "وهكذا قمنا بإعادة بناء كل السور حتى نصف ارتفاعه. وكان الشعب يعمل بقلب واحد."]]}, {"l": "Neh 4:9-13", "n": "", "vs": [[9, "فتضرعنا إلى إلهنا وأقمنا حراسا ضدهم نهارا وليلا حذرا منهم."], [10, "وقال أبناء يهوذا: «لقد وهنت قوى الحمالين، وأكوام الأنقاض كثيرة، ونحن لا يمكننا بناء السور."], [11, "وقد قال أعداؤنا: إننا سنفاجئهم فلا يدرون ولا يبصرون إلا ونحن قد أصبحنا في وسطهم، فنقتلهم ونعطل العمل!"], [12, "وعندما جاء اليهود الساكنون إلى جوارهم حذرونا عشر مرات قائلين: إنهم سيزحفون عليكم من جميع الأماكن التي يقيمون فيها»."], [13, "لذلك أقمت حراسا من الشعب حسب عشائرهم، متسلحين بالسيوف والرماح والقسي في المنخفضات وراء السور وعلى المرتفعات."]]}, {"l": "Neh 4:17-23", "n": "", "vs": [[17, "الذين كانوا يبنون السور. أما حاملو الأحمال فكانوا يعملون باليد الواحدة ويمسكون السلاح باليد الأخرى."], [18, "وتقلد كل بان سيفا على جنبه، بينما وقف نافخ البوق إلى جواري."], [19, "فقلت للأشراف والولاة ولبقية الشعب: «العمل كثير ممتد في رقعة واسعة في الأرض، ونحن متفرقون على السور ومتباعدون عن بعضنا."], [20, "فعليكم أن تتجمعوا في المكان الذي يدوي منه نفير البوق، وليحارب إلهنا عنا»."], [21, "وهكذا كنا نحن نقوم بالعمل، بينما نصفنا الآخر يتقلد الرماح من طلوع الفجر حتى بزوغ النجوم."], [22, "وأمرت الشعب في ذلك الوقت: «ليبت كل واحد مع خادمه في أورشليم، فيكونوا لنا حراسا في الليل وعمالا في النهار»."], [23, "ولم أخلع ثيابي طوال تلك الفترة، لا أنا ولا إخوتي ولا خدامي ولا الحراس التابعون لي، بل ظل كل واحد منا متأهبا بسلاحه حتى عند ذهابه إلى الماء."]]}, {"l": "Neh 13:8-31", "n": "", "vs": [[8, "فساءني الأمر جدا حتى إني طرحت جميع أمتعة طوبيا خارج المخدع،"], [9, "ثم أصدرت أوامري بتطهير المخادع كلها، ورددت إليها آنية هيكل الله مع التقدمة والبخور."], [10, "وعلمت أن اللاويين لم يتسلموا مخصصاتهم، فلجأوا هم والمغنون الذين قاموا بالعمل، إلى حقولهم."], [11, "فأنبت المسئولين وسألتهم: «لماذا ترك بيت الله بغير رعاية؟» ثم جمعت اللاويين وأعدتهم إلى مراكزهم."], [12, "وأدى جميع يهوذا عشر الحنطة والخمر والزيت إلى المخازن."], [13, "وعينت على أمانة شؤون المخازن شلميا الكاهن، وصادوق الكاتب، وفدايا من اللاويين. كما عينت حانان بن زكور بن متنيا لما عرف عنهم من أمانة، وكانت مهمتهم توزيع الأنصبة على إخوتهم."], [14, "فاذكرني ياإلهي من أجل هذا ولا تنس حسناتي التي بذلتها في خدمة بيت إلهي."], [15, "وفي تلك الأيام شاهدت في أرض يهوذا قوما يدوسون المعاصر في يوم السبت، ويأتون بأكياس الحنطة ويحملونها على الحمير، وكذلك بأحمال العنب والتين وسواها من المحاصيل التي يجلبونها إلى أورشليم في يوم السبت، فحذرتهم من بيع الطعام في ذلك اليوم."], [16, "كما رأيت بعض أهل صور ممن يقيمون في أورشليم يأتون بالسمك وغيره من صنوف البضائع لبيعها إلى سكان يهوذا وأهل أورشليم في يوم السبت."], [17, "عندئذ خاصمت أشراف يهوذا وقلت لهم: «أي شر ترتكبونه إذ تدنسون يوم السبت؟"], [18, "ألم يتصرف آباؤكم هكذا؟ ألم يصب إلهنا كل غضبه علينا وعلى هذه المدينة؟ ومع ذلك فإنكم تجلبون مزيدا من السخط على إسرائيل إذ تدنسون يوم السبت»."], [19, "وعندما زحف الظلام على أبواب أورشليم عند حلول السبت، أمرت بإغلاق البوابات والامتناع عن فتحها حتى انقضاء يوم السبت وكلفت بعض رجالي بحراسة البوابات لئلا يتم إدخال بعض الأحمال في يوم السبت،"], [20, "فبات التجار وباعة مختلف البضائع خارج أورشليم مرة ومرتين،"], [21, "فأنذرتهم قائلا: «لماذا تبيتون أمام السور؟ إن عدتم إلى ذلك فإني ألقي القبض عليكم». ومنذ ذلك الحين كفوا عن المجيء في يوم السبت."], [22, "وأمرت اللاويين أن يتطهروا ليأتوا ويقوموا بحراسة البوابات ليقدسوا يوم السبت. فاذكرني ياإلهي من أجل هذا أيضا، وأحسن إلي بحسب مراحمك الكثيرة."], [23, "وفي ذلك الزمن شاهدت يهودا ممن تزوجوا من نساء أشدوديات وعمونيات وموآبيات،"], [24, "ولاحظت أن نصف كلام أولادهم بلغة أشدود، أو لغة بعض الشعوب الأخرى، ويجهلون اللغة اليهودية،"], [25, "فأنبتهم ولعنتهم وضربت منهم قوما ونتفت شعورهم، واستحلفتهم باسم الله قائلا: «إياكم أن تزوجوا بناتكم من بنيهم، ولا تأخذوا بناتهم لأبنائكم ولا لكم."], [26, "أليس بمثل هذا أخطأ سليمان ملك إسرائيل، مع أنه لم يكن له نظير بين ملوك شعوب كثيرة؟ لقد كان محبوبا عند إلهه، وجعله الله ملكا على إسرائيل، ومع ذلك أغوته النساء الأجنبيات على ارتكاب الإثم"], [27, "فهل نتغاضى عما اقترفتموه من شر عظيم في حق إلهنا باتخاذكم زوجات غريبات؟"], [28, "وكان أحد أبناء يوياداع بن ألياشيب رئيس الكهنة صهرا لسنبلط الحوروني، فطردته عني."], [29, "فاذكرهم ياإلهي لأنهم دنسوا الكهنوت وعهد الكهنوت واللاويين،"], [30, "وهكذا طهرتهم من كل ما هو غريب، وعينت للكهنة واللاويين واجباتهم، لكل بمقتضى خدمته،"], [31, "كما رتبت أمر جلب حطب التقدمات في مواعيدها المقررة، وكذلك رفع أوائل المحاصيل. فاذكرني ياإلهي بالخير."]]}, {"l": "Psa 71:15-18", "n": "", "vs": [[15, "أخبر ببرك وخلاصك طول النهار، وإن كانا يفوقان إدراكي."], [16, "أجيء (مؤيدا) بقوة السيد الرب، لأذكر برك وحدك."], [17, "قد علمتني ياالله منذ صباي، فلم أكف لحظة عن إعلان عجائبك."], [18, "لا تتركني في الشيخوخة والشيب ياالله ، حتى أخبر هذا الجيل بأعمال قدرتك، وبقوتك (الجيل) الآتي."]]}, {"l": "Jer 29:13", "n": "", "vs": [[13, "وتلتمسونني فتجدونني إذ تطلبونني بكل قلوبكم."]]}, {"l": "Mat 6:33", "n": "", "vs": [[33, "أما أنتم، فاطلبوا أولا ملكوت الله وبره، وهذه كلها تزاد لكم."]]}, {"l": "Joh 4:34", "n": "", "vs": [[34, "فقال لهم يسوع: «طعامي هو أن أعمل مشيئة الذي أرسلني وأن أنجز عمله."]]}, {"l": "Rom 12:11", "n": "", "vs": [[11, "لا تتكاسلوا في الاجتهاد، بل كونوا ملتهبين في الروح، عبيدا خادمين للرب،"]]}, {"l": "Rom 15:18-20", "n": "", "vs": [[18, "فما كنت لأتجاسر أن أتكلم بشيء إلا على ما عمله المسيح على يدي لهداية الأمم إلى الطاعة، بالقول والفعل،"], [19, "وبقوة الآيات والعجائب، وبقوة روح الله. حتى إنني، من أورشليم وما حولها حتى مقاطعة إليريكون، قد أكملت التبشير بإنجيل المسيح."], [20, "وكنت حريصا على التبشير حيث لم يكن قد عرف اسم المسيح، لكي لا أبني على أساس وضعه غيري،"]]}, {"l": "1Co 9:24", "n": "", "vs": [[24, "أما تعلمون أن المتبارين يركضون جميعا في الميدان ولكن واحدا منهم فقط يفوز بالجائزة؟ هكذا اركضوا أنتم حتى تفوزوا!"]]}, {"l": "1Co 9:26", "n": "", "vs": [[26, "إذن، أنا أركض هكذا، لا كمن لا هدف له، وهكذا ألاكم أيضا، لا كمن يلطم الهواء،"]]}, {"l": "1Co 15:10", "n": "", "vs": [[10, "ولكن، بنعمة الله صرت على ما أنا عليه الآن، ونعمته الموهوبة لي لم تكن عبثا، إذ عملت جاهدا أكثر من الرسل الآخرين جميعا. إلا أني لم أكن أنا العامل، بل نعمة الله التي كانت معي."]]}, {"l": "1Co 16:10", "n": "", "vs": [[10, "وإذا وصل تيموثاوس إليكم، فاهتموا بأن يكون مطمئنا عندكم، لأنه يقوم بعمل الرب مثلي."]]}, {"l": "Eph 5:16", "n": "", "vs": [[16, "مستغلين الوقت أحسن استغلال، لأن الأيام شريرة."]]}, {"l": "Col 3:23", "n": "", "vs": [[23, "ومهما عملتم، فاجتهدوا فيه من صميم القلب، وكأنه للرب لا للناس،"]]}, {"l": "2Pe 1:12-15", "n": "", "vs": [[12, "لذلك أنوي أن أذكركم دائما بهذه الأمور، وإن كنتم عالمين بها، وراسخين في الحق الذي عندكم."], [13, "فمادمت في خيمة جسمي هذه، أرى من واجبي أن أنبهكم مذكرا."], [14, "فأنا أعلم أن خيمتي ستطوى بعد وقت قصير، كما سبق أن أعلن لي ربنا يسوع المسيح."], [15, "ولهذا، أجتهد الآن في تذكيركم بهذه الأمور، حتى تستطيعوا أن تتذكروها دائما بعد رحيلي."]]}], "kwAr": "فاعمله بكل قوتك", "noteAr": ""}, {"kw": "for", "raw": "Ecc_9:5, Ecc_9:6, Ecc_11:3; Job_14:7-12; Psa_6:5, Psa_88:10-12; Isa_38:18, Isa_38:19; Joh_9:4; Act_20:25-31", "note": "", "refs": [{"l": "Ecc 9:5", "n": "", "vs": [[5, "لأن الأحياء يدركون أنهم سيموتون، أما الأموات فلا يعلمون شيئا، وليس لهم ثواب بعد، إذ قد ينسى ذكرهم."]]}, {"l": "Ecc 9:6", "n": "", "vs": [[6, "فقد باد حبهم وبغضهم وغيرتهم، ولم يبق لهم نصيب فيما يجري تحت الشمس."]]}, {"l": "Ecc 11:3", "n": "", "vs": [[3, "إذا كانت السحب مثقلة بالمياه فإنها تصب المطر على الأرض، وإن سقطت شجرة باتجاه الشمال أو الجنوب فإنها تظل مستقرة حيث سقطت."]]}, {"l": "Job 14:7-12", "n": "", "vs": [[7, "لأن للشجرة أملا، إذا قطعت أن تفرخ من جديد ولا تفنى براعمها."], [8, "حتى لو شاخت أصولها في الأرض ومات جذعها في التراب،"], [9, "فإنها حالما تستروح الماء تفرخ، وتنبت فروعا كالغرس."], [10, "أما الإنسان فإنه يموت ويبلى، يلفظ آخر أنفاسه، فأين هو؟"], [11, "كما تنفد المياه من البحيرة، ويجف النهر،"], [12, "هكذا يرقد الإنسان ولا يقوم، ولا يستيقظ من نومه إلى أن تزول السموات."]]}, {"l": "Psa 6:5", "n": "", "vs": [[5, "إذ ليس في عالم الموت من يذكرك، أو في مقر الأموات من يسبحك."]]}, {"l": "Psa 88:10-12", "n": "", "vs": [[10, "هل تصنع عجائب للأموات، أم تقوم أشباح الموتى فتمجدك؟"], [11, "أفي القبر تعلن رحمتك، وفي الهاوية أمانتك؟"], [12, "هل في الظلام تعرف عجائبك، وفي أرض النسيان يظهر برك؟"]]}, {"l": "Isa 38:18", "n": "", "vs": [[18, "لأنه ليس في وسع الهاوية أن تحمدك، والموت لا يسبحك، ولا يقدر الذين ذهبوا إلى الهاوية أن يرجوا أمانتك."]]}, {"l": "Isa 38:19", "n": "", "vs": [[19, "الأحياء وحدهم يسبحونك كما أفعل اليوم، ويحدث الآباء أبناءهم عن أمانتك"]]}, {"l": "Joh 9:4", "n": "", "vs": [[4, "فعلي أن أعمل أعمال الذي أرسلني مادام الوقت نهارا. فسيأتي الليل، ولا أحد يقدر أن يعمل فيه."]]}, {"l": "Act 20:25-31", "n": "", "vs": [[25, "وأنا أعلم أنكم لن تروا وجهي بعد اليوم، أنتم الذين تجولت بينكم جميعا مبشرا بملكوت الله."], [26, "لذلك أشهد لكم اليوم أني بريء من دمكم جميعا،"], [27, "لأني لم أمتنع عن إبلاغكم جميع مقاصد الله."], [28, "فاسهروا إذن على أنفسكم وعلى جميع القطيع الذي عينكم بينه الروح القدس نظارا، لترعوا كنيسة الله التي اشتراها بدمه."], [29, "فإني أعلم أنه بعد رحيلي سيندس بينكم ذئاب خاطفة، لا تشفق على القطيع."], [30, "بل إن قوما منكم أنتم سيقومون ويعلمون تعاليم منحرفة، ليجروا التلاميذ وراءهم."], [31, "لذلك كونوا متيقظين، وتذكروا أني، مدة ثلاث سنين، لم أتوقف ليلا ونهارا عن نصح كل واحد منكم وأنا أذرف الدموع."]]}], "kwAr": "إذ لن تجد", "noteAr": ""}], "arS": [["وكل", ["H3605"]], [" ", []], ["ما", ["H834"]], [" تحصل عليه ", []], ["من", ["H834"]], [" ", []], ["عمل", ["H4639"]], ["، ", []], ["فاعمله", ["H6213"]], [" بكل ", []], ["قوتك", ["H3581"]], ["، ", []], ["إذ", ["H3588"]], [" ", []], ["لن", ["H369"]], [" ", []], ["تجد", ["H4672"]], [" ", []], ["في", ["H3027"]], [" ", []], ["الهاوية", ["H7585"]], [" التي ", []], ["أنت", ["H859"]], [" ", []], ["ماض", ["H1980"]], [" ", []], ["إليها", ["H8033"]], [" أي ", []], ["عمل", ["H6213"]], [" أو ", []], ["ابتكار", ["H2808"]], [" أو ", []], ["معرفة", ["H1847"]], [" أو ", []], ["حكمة", ["H2451"]], [".", []]]}, {"c": 9, "v": 11, "text": "وتطلعت فرأيت شيئا آخر تحت الشمس: إن الفوز في السباق ليس للسريع، والظفر في المعركة ليس للأقوياء، ولا الخبز من نصيب الحكماء، ولا الغنى لذوي الفهم، ولا الحظوة للعلماء، لأنهم كافة معرضون لتقلبات الأوقات والمفاجآت،", "groups": [{"kw": "returned", "raw": "Ecc_2:12, Ecc_4:1, Ecc_4:4; Mal_3:18", "note": "", "refs": [{"l": "Ecc 2:12", "n": "", "vs": [[12, "ورجعت أمعن التفكير في الحكمة والجنون والحماقة، إذ ماذا في وسع من يخلف الملك أن يفعل أكثر مما تم فعله؟"]]}, {"l": "Ecc 4:1", "n": "", "vs": [[1, "ثم تأملت حولي فرأيت جميع المظالم التي ترتكب تحت الشمس. شهدت دموع المظلومين الذين لا معزي لهم، أما ظالموهم فيتمتعون بالقوة، غير أن المظلومين لا معزي لهم."]]}, {"l": "Ecc 4:4", "n": "", "vs": [[4, "وأدركت أيضا أن كل تعب الإنسان ومنجزاته، ناتجة عن حسده لقريبه. هذا أيضا باطل كملاحقة الريح."]]}, {"l": "Mal 3:18", "n": "", "vs": [[18, "فتشرعون ثانية في التمييز بين الصالح والطالح، بين من يعبد الله ومن لا يعبده»."]]}], "kwAr": "وتطلعت", "noteAr": ""}, {"kw": "that the race", "raw": "1Sa_17:50; 2Sa_2:18-23, 2Sa_17:14, 2Sa_17:23; Psa_33:16, Psa_33:17, Psa_73:6, Psa_73:7, Psa_147:10, Psa_147:11; Jer_9:23, Jer_46:6; Amo_2:14-16", "note": "", "refs": [{"l": "1Sa 17:50", "n": "", "vs": [[50, "وهكذا قضى داود على الفلسطيني بالمقلاع والحجر وقتله. وإذ لم يكن بيده سيف"]]}, {"l": "2Sa 2:18-23", "n": "", "vs": [[18, "وكان من جملة رجال داود هناك أبناء صروية: يوآب وأبيشاي وعسائيل. وكان عسائيل سريع العدو كالغزال البري."], [19, "فتعقب عسائيل أبنير ولم يمل عنه يمنة أو يسرة."], [20, "فالتفت أبنير وراءه وتساءل: «هل أنت عسائيل؟ فأجاب: «أنا هو»."], [21, "فقال له: «تنح عني واقبض على أحد الرجال الآخرين واسلبه سلاحه». غير أن عسائيل ظل يسعى في أثره."], [22, "ثم عاد أبنير يلح على عسائيل أن يكف عنه قائلا: «لماذا تدفعني إلى قتلك؟ وكيف يمكنني أن أواجه أخاك يوآب إذا قتلتك؟»"], [23, "لكن عسائيل أبى أن يتنحى عنه، فطعنه أبنير بعقب الرمح، فغاص الرمح في بطنه وخرج من ظهره،فوقع صريعا ومات في مكانه. فكان كل من يمر بالموضع الذي صرع فيه عسائيل يتوقف عنده."]]}, {"l": "2Sa 17:14", "n": "", "vs": [[14, "فقال أبشالوم وسائر رجال إسرائيل: «إن رأي حوشاي الأركي أفضل من رأي أخيتوفل». لأن الرب أراد أن يبطل مشورة أخيتوفل الصائبة لكي يحل الشر بأبشالوم."]]}, {"l": "2Sa 17:23", "n": "", "vs": [[23, "وعندما رأى أخيتوفل أن مشورته لم يعمل بها، ركب حماره وتوجه إلى بيته في مسقط رأسه، ثم نظم شؤون عائلته، وخنق نفسه فمات، ودفن في قبر أبيه."]]}, {"l": "Psa 33:16", "n": "", "vs": [[16, "لا يخلص الملك بالجيش العظيم، ولا الجبار بشدة القوة."]]}, {"l": "Psa 33:17", "n": "", "vs": [[17, "باطلا يرجو النصر من يتكل على الخيل، فإنها لا تنجي رغم قوتها."]]}, {"l": "Psa 73:6", "n": "", "vs": [[6, "لذلك لبسوا الكبرياء كقلادة، وارتدوا الظلم كثوب."]]}, {"l": "Psa 73:7", "n": "", "vs": [[7, "عيونهم جاحظة من كثرة شحم طمعهم. وشرهم تجاوز ما يتصوره القلب."]]}, {"l": "Psa 147:10", "n": "", "vs": [[10, "لا تستهويه قوة الخيل، ولا تسره ساقا العداء."]]}, {"l": "Psa 147:11", "n": "", "vs": [[11, "إنما يرضى الرب بخائفيه، الراجين رحمته."]]}, {"l": "Jer 9:23", "n": "", "vs": [[23, "«فلا يفتخرن الحكيم بحكمته، ولا يزهون الجبار بجبروته، ولا الغني بثروته."]]}, {"l": "Jer 46:6", "n": "", "vs": [[6, "«عجز الخفيف عن الجري للفرار، وليس في وسع المحارب الهرب. في الشمال عثروا وسقطوا إلى جوار نهر الفرات."]]}, {"l": "Amo 2:14-16", "n": "", "vs": [[14, "فلا يتاح الهرب للسريع، وتتلاشى قوة الجبار، ويعجز القوي عن إنقاذ نفسه."], [15, "ولا يصمد رامي القوس ولا يصيب الهدف، ولا يسلم سريع العدو، ولا ينجو راكب الفرس بحياته."], [16, "والثابت الجنان بين أقرانه الأبطال يفر عريانا في ذلك اليوم، يقول الرب."]]}], "kwAr": "الفوز في السباق", "noteAr": ""}, {"kw": "but", "raw": "Ecc_2:14, Ecc_2:15, Ecc_3:14, Ecc_3:17, Ecc_7:13; 1Sa_2:3-10; Job_5:11-14, Job_34:29; Pro_21:30, Pro_21:31; Lam_3:37, Lam_3:38; Dan_4:35; Eph_1:11", "note": "", "refs": [{"l": "Ecc 2:14", "n": "", "vs": [[14, "لأن عيني الحكيم في رأسه، أما الجاهل فيمشي في الظلمة. لكنني أدركت أنهما يلاقيان مصيرا واحدا."]]}, {"l": "Ecc 2:15", "n": "", "vs": [[15, "ثم حدثت نفسي: إن ما يحدث للجاهل يحدث لي أيضا، فلماذا أنا أوفر حكمة؟ فناجيت قلبي: وهذا أيضا باطل،"]]}, {"l": "Ecc 3:14", "n": "", "vs": [[14, "وعلمت أن كل ما يفعله الله يخلد إلى الأبد، لا يضاف عليه شيء أو ينقص منه. وقد أجراه الله ليتقيه الناس."]]}, {"l": "Ecc 3:17", "n": "", "vs": [[17, "فقلت في نفسي: إن الله سيحكم على الصديق وعلى الشرير، لأن لكل عمل ولكل أمر وقتا هناك."]]}, {"l": "Ecc 7:13", "n": "", "vs": [[13, "تأمل في عمل الله، من يقدر أن يقوم ما يعوجه؟"]]}, {"l": "1Sa 2:3-10", "n": "", "vs": [[3, "كفوا عن الكبرياء، وكموا أفواهكم عن الغرور لأن الرب إله عليم وبه توزن الأعمال."], [4, "لقد تحطمت أقواس الجبابرة وتنطق الضعفاء بالقوة."], [5, "الذين كانوا شباعى آجروا أنفسهم لقاء الطعام، والذين كانوا جياعا ملأهم الشبع. أنجبت العاقر سبعة، أما كثيرة الأبناء فقد ذبلت."], [6, "الرب يميت ويحيي، يطرح إلى الهاوية ويصعد منها."], [7, "الرب يفقر ويغني، يذل ويعز."], [8, "ينهض المسكين من التراب، ويرفع البائس من كومة الرماد، ليجلسه مع النبلاء، ويملكه عرش المجد، لأن للرب أساسات الأرض التي أرسى عليها المسكونة."], [9, "هو يحفظ أقدام أتقيائه، أما الأشرار فينطوون في الظلام، لأنه ليس بالقوة يتغلب الإنسان."], [10, "مخاصمو الرب يتحطمون، ومن السماء يقذف رعوده عليهم؛ يدين الرب أقاصي الأرض، ويمنح عزة لمن يختاره ملكا ويمجد مسيحه»."]]}, {"l": "Job 5:11-14", "n": "", "vs": [[11, "يقيم المتواضعين في العلى، ويرفع النائحين إلى مكان الطمأنينة."], [12, "يبطل تدبيرات المحتالين فيخفقون،"], [13, "أو يوقع الحكماء في خدعتهم، فتتلاشى مشورة الماكرين."], [14, "يكتنفهم ظلام في النهار، ويتحسسون طريقهم في الظهيرة، كمن يمشي في الليل."]]}, {"l": "Job 34:29", "n": "", "vs": [[29, "فإن هيمن بسكينته فمن يدينه، وإن وارى وجهه فمن يعاينه، سواء أكانوا شعبا أم فردا"]]}, {"l": "Pro 21:30", "n": "", "vs": [[30, "ليس من حكمة، ولا من مشورة، ولا من فطنة بقادر ة على مقاومة الله."]]}, {"l": "Pro 21:31", "n": "", "vs": [[31, "مع أن الفرس معد ليوم القتال، فإن النصر هو من عند الله."]]}, {"l": "Lam 3:37", "n": "", "vs": [[37, "من ذا الذي يقضي بأمر فيتحقق إن لم يكن الرب قد أمر به؟"]]}, {"l": "Lam 3:38", "n": "", "vs": [[38, "أليس من فم العلي يصدر الضر والخير؟"]]}, {"l": "Dan 4:35", "n": "", "vs": [[35, "وعرفت أن كل أهل الأرض لا يحسبون شيئا، وأنه يفعل ما يشاء في جند السماء وسكان الأرض، وليس من يكف يده أو يقول له: ماذا تفعل؟"]]}, {"l": "Eph 1:11", "n": "", "vs": [[11, "وفي المسيح أيضا قد حصلنا على الميراث الذي سبق أن عينا له، وفقا لقصده، هو الذي يعمل كل vs": [[2, "فإنه يقول: «في وقت القبول استجبت لك، وفي يوم الخلاص أعنتك». والآن هو وقت القبول. اليوم يوم الخلاص!"]]}, {"l": "1Pe 2:12", "n": "", "vs": [[12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالحة يمجدون الله في يوم الافتقاد."]]}], "kwAr": "فالمرء لا يعلم", "noteAr": ""}, {"kw": "as the fishes", "raw": "Pro_7:22, Pro_7:23; Hab_1:14-17; 2Ti_2:26", "note": "", "refs": [{"l": "Pro 7:22", "n": "", "vs": [[22, "فمضى على التو في إثرها، كثور مسوق إلى الذبح، أو أيل وقع في فخ."]]}, {"l": "Pro 7:23", "n": "", "vs": [[23, "إلى أن ينفذ سهم في كبده، ويكون كعصفور مندفع إلى شرك، لا يدري أنه قد نصب للقضاء عليه."]]}, {"l": "Hab 1:14-17", "n": "", "vs": [[14, "وكيف تجعل الناس كأسماك البحر، أو كأسراب الحشرات التي لا قائد لها؟"], [15, "إن الكلدانيين يستخرجونهم بالشصوص، ويصطادونهم بالشبكة، ويجمعونهم في مصيدتهم متهللين فرحين."], [16, "لهذا هم يقربون ذبائح لشباكهم، ويحرقون بخورا لمصائدهم، لأنهم بفضلها يتمتعون بالرفاهية ويتلذذون بأطايب الطعام."], [17, "أمن أجل هذا يظلون يفرغون شباكهم ولا يكفون عن إهلاك الأمم إلى الأبد؟"]]}, {"l": "2Ti 2:26", "n": "", "vs": [[26, "فيعودوا إلى الصواب ناجين من فخ إبليس الذي أطبق عليهم، ليعملوا إرادته."]]}], "kwAr": "تقع الأسماك", "noteAr": ""}, {"kw": "the sons", "raw": "Job_18:8-10; Psa_11:6, Psa_73:18-20; Pro_6:15, Pro_29:6; Isa_30:13; Luk_12:20, Luk_12:39, Luk_17:26-31, Luk_21:34-36; 1Th_5:3; 2Pe_2:12", "note": "", "refs": [{"l": "Job 18:8-10", "n": "", "vs": [[8, "لأن قدميه توقعانه في الشرك وتطرحانه في حفرة،"], [9, "يقبض الفخ على عقبيه والشرك يشد عليه،"], [10, "حبالته مطمورة في الطريق، والمصيدة كامنة في سبيله،"]]}, {"l": "Psa 11:6", "n": "", "vs": [[6, "يمطر على الأشرار جمرا وكبريتا وتكون الريح المحرقة نصيبهم."]]}, {"l": "Psa 73:18-20", "n": "", "vs": [[18, "حقا إنك أوقفتهم في أماكن زلقة، وأوقعتهم في التهلكات."], [19, "كيف صاروا للخر اب فجأة؟ انقرضوا وأفنتهم الدواهي."], [20, "كحلم يتلاشى عند اليقظة هكذا تختفي صورتهم عندما تنهض يارب لمعاقبتهم."]]}, {"l": "Pro 6:15", "n": "", "vs": [[15, "لذلك تغشاه البلايا فجأة، وفي لحظة يتحطم ويستعصي شفاؤه."]]}, {"l": "Pro 29:6", "n": "", "vs": [[6, "الشرير مقتنص في شرك إثمه، أما الصديق فيشدو ويبتهج."]]}, {"l": "Isa 30:13", "n": "", "vs": [[13, "لذلك يصبح هذا الذنب لكم كصدع ناتيء في سور عال مشرف على الانهيار الذي يحدث بغتة وفى لحظة"]]}, {"l": "Luk 12:20", "n": "", "vs": [[20, "ولكن الله قال له: ياغبي، هذه الليلة تطلب نفسك منك، فلمن يبقى ما أعددته؟"]]}, {"l": "Luk 12:39", "n": "", "vs": [[39, "ولكن اعلموا هذا: أنه لو كان رب البيت يعرف في أية ساعة يدهمه اللص، لكان سهر وما ترك بيته ينقب."]]}, {"l": "Luk 17:26-31", "n": "", "vs": [[26, "وكما حدث في زمان نوح، هكذا أيضا سوف يحدث في زمان ابن الإنسان:"], [27, "كان الناس يأكلون ويشربون ويتزوجون ويزوجون، إلى اليوم الذي فيه دخل نوح السفينة وجاء الطوفان فأهلك الجميع."], [28, "وكذلك، كما حدث في زمان لوط: كانوا يأكلون ويشربون ويشترون ويبيعون ويغرسون ويبنون،"], [29, "ولكن في اليوم الذي فيه خرج لوط من سدوم، أمطر (الله ) من السماء نارا وكبريتا، فأهلك الجميع"], [30, "هكذا سيحدث في يوم ظهور ابن الإنسان."], [31, "فمن كان في ذلك اليوم على السطح وأمتعته في البيت، فلا ينزل ليأخذها؛ ومن كان في الحقل كذلك، فلا يرجع إلى الوراء."]]}, {"l": "Luk 21:34-36", "n": "", "vs": [[34, "ولكن احذروا لأنفسكم لئلا تتثقل قلوبكم بالانغماس في اللذات وبالسكر وهموم الحياة، فيدهمكم ذلك اليوم فجأة؛"], [35, "فإنه سوف يطبق كالفخ على جميع الساكنين على وجه الأرض كلها."], [36, "فاسهروا إذن وتضرعوا في كل حين، لكي تتمكنوا من أن تنجوا من جميع هذه الأمور التي هي على وشك أن تحدث، وتقفوا أمام ابن الإنسان»."]]}, {"l": "1Th 5:3", "n": "", "vs": [[3, "فبينما الناس يقولون: حل السلام والأمن! ينزل بهم الهلاك المفاجيء كالمخاض الذي يدهم الحبلى، فلا يستطيعون أبدا أن يفلتوا."]]}, {"l": "2Pe 2:12", "n": "", "vs": [[12, "حقا إن هؤلاء المعلمين الدجالين الذين يتكلمون كلاما مهينا في أمور يجهلونها، يشبهون الحيوانات المفترسة غير العاقلة، المولودة ليصطادها الناس ويقتلوها. فلابد أن يهلكوا مثلها."]]}], "kwAr": "بني البشر", "noteAr": ""}], "arS": [["فالمرء", ["H120"]], [" ", []], ["لا", ["H3808"]], [" ", []], ["يعلم", ["H3045"]], [" متى يحين ", []], ["وقته", ["H6256"]], ["، فكما تقع ", []], ["الأسماك", ["H1709"]], [" في ", []], ["شبكة", ["H4686"]], [" مهلكة، أو ", []], ["تعلق", ["H270"]], [" ", []], ["العصافير", ["H6833"]], [" ", []], ["بالفخاخ", ["H6341"]], ["، هكذا ", []], ["تقتنص", ["H3369"]], [" الأيام ", []], ["الرديئة", ["H7451"]], [" ", []], ["بني", ["H1121"]], [" ", []], ["البشر", ["H120"]], ["، ", []], ["إذ", ["H3588"]], [" ", []], ["تفاجئهم", ["H5307"]], [" ", []], ["على", ["H5921"]], [" ", []], ["حين", ["H6256"]], [" ", []], ["غرة", ["H6597"]], [".", []]]}, {"c": 9, "v": 13, "text": "وشاهدت أيضا تحت الشمس هذه الحكمة التي أثارت إعجابي المفرط:", "groups": [{"kw": "", "raw": "Ecc_9:11, Ecc_6:1, Ecc_7:15, Ecc_8:16", "note": "", "refs": [{"l": "Ecc 9:11", "n": "", "vs": [[11, "وتطلعت فرأيت شيئا آخر تحت الشمس: إن الفوز في السباق ليس للسريع، والظفر في المعركة ليس للأقوياء، ولا الخبز من نصيب الحكماء، ولا الغنى لذوي الفهم، ولا الحظوة للعلماء، لأنهم كافة معرضون لتقلبات الأوقات والمفاجآت،"]]}, {"l": "Ecc 6:1", "n": "", "vs": [[1, "رأيت شرا تحت الشمس خيم بثقله على الناس:"]]}, {"l": "Ecc 7:15", "n": "", "vs": [[15, "لقد شاهدت هذه جميعها في أيام أباطيلي: رب صديق يهلك في بره، ومنافق تطول أيامه في شره."]]}, {"l": "Ecc 8:16", "n": "", "vs": [[16, "وعندما جعلت قلبي يعزم على معرفة الحكمة، والتأمل في معاناة الإنسان التي يقاسيها على الأرض، وكيف لا تذوق عيناه النوم ليلا ونهارا،"]]}], "kwAr": "", "noteAr": ""}], "arS": [["وشاهدت", ["H7200"]], [" ", []], ["أيضا", ["H1571"]], [" ", []], ["تحت", ["H8478"]], [" ", []], ["الشمس", ["H8121"]], [" ", []], ["هذه", ["H1931", "H2090"]], [" ", []], ["الحكمة", ["H2451"]], [" التي أثارت إعجابي ", []], ["المفرط", ["H1419"]], [":", []]]}, {"c": 9, "v": 14, "text": "كانت هناك مدينة صغيرة فيها نفر قليل من الرجال، أقبل عليها ملك قوي وحاصرها وبنى حولها أبراجا عظيمة.", "groups": [{"kw": "There was", "raw": "2Sa_20:15-22; 2Ki_6:24-33, 7:1-20", "note": "", "refs": [{"l": "2Sa 20:15-22", "n": "", "vs": [[15, "وجاءت قوات يوآب وحاصرته في آبل بيت معكة، وأقاموا متراسا مرتفعا إزاء المدينة في مواجهة استحكامات السور وشرعوا في هدمه."], [16, "فنادت امرأة حكيمة من المدينة: «اسمعوا، اسمعوا! قولوا ليوآب، ادن من هنا لأكلمك»."], [17, "فتقدم إليها، فقالت المرأة: «أأنت يوآب؟» فأجاب: «أنا هو». فقالت له: «أصغ إلى كلام أمتك». فقال: «أنا سامع»"], [18, "فتكلمت المرأة: «كانوا قديما يقولون: إن أردت الحصول على جواب (حكيم) فإنك تجده في آبل، وكان هذا يحسم كل جدال."], [19, "أنا واحدة من بين بقية المسالمين في إسرائيل، وأنت تبغي تدمير مدينة هي أم في إسرائيل، فلماذا تريد أن تبتلع ميراث الرب؟»"], [20, "فأجاب يوآب: «معاذ الله، معاذ الله أن أبتلع أو أن أدمر."], [21, "إن الأمر ليس كذلك، إنما هناك رجل من جبل أفرايم يدعى شبع بن بكري تطاول على الملك داود. سلموه وحده فأنصرف عن المدينة». فقالت المرأة ليوآب: «عما قليل يطرح إليك رأسه من على السور»."], [22, "وتداولت المرأة مع الشعب كله فأقنعتهم بسداد رأيها، فقطعوا رأس شبع بن بكري وألقوه إلى يوآب، فنفخ بالبوق، ففكوا الحصار عن المدينة، وعاد كل واحد إلى بيته، وأما يوآب فرجع إلى الملك في أورشليم."]]}, {"l": "2Ki 6:24-33", "n": "", "vs": [[24, "وحشد بنهدد ملك أرام، بعد زمن، كل جيشه وحاصر السامرة."], [25, "وإذ طال الحصار، عمت المجاعة السامرة حتى صار رأس الحمار يباع بثمانين قطعة من الفضة، وأوقية زبل الحمام بخمس قطع من الفضة."], [26, "وفيما كان ملك إسرائيل يتفقد سور المدينة استغاثت به امرأة قائلة: «أغث ياسيدي الملك»."], [27, "فقال لها: «إن لم يغثك الرب، فمن أين يمكنني أن أحصل لك على الغوث؟ أمن قمح البيدر أم من نبيذ المعصرة؟»"], [28, "ثم سألها الملك: «مالك؟» فأجابت: «لقد قالت لي هذه المرأة، هاتي ابنك فنأكله اليوم، ثم نأكل ابني في اليوم التالي."], [29, "فسلقنا ابني وأكلناه. وعندما قلت لها في اليوم التالي: هاتي ابنك لنأكله، خبأت ابنها»."], [30, "فلما سمع الملك حديث المرأة مزق ثيابه وهو يتفقد السور، فرأى المحيطون به أنه كان يرتدي مسوحا فوق جسده."], [31, "وقال: «ليعاقبني الرب أشد عقاب ويزد، إن لم أقطع رأس أليشع بن شافاط اليوم»."], [32, "وكان أليشع آنئذ مجتمعا في بيته مع شيوخ إسرائيل، فوجه الملك رسولا إليه يتقدمه. وقبل أن يصل الرسول قال أليشع للشيوخ: «أرأيتم كيف أن هذا القاتل قد أرسل رسولا ليقطع رأسي؟ فحالما يأتي الرسول أغلقوا الباب واتركوه موصدا في وجهه. فإن وقع خطوات سيده يتجاوب وراءه»"], [33, "وبينما هو يخاطبهم أقبل الرسول إليه، وتبعه الملك الذي قال: «إن هذا الشر قد حل بنا من عند الرب، فأي شيء أتوقع من الرب بعد؟»"]]}, {"l": "2Ki 7:1-20", "n": "", "vs": [[1, "ثم قال أليشع: «اسمعوا ما يقول الرب: غدا في مثل هذا الوقت تصبح كيلة الدقيق باثني عشر جراما، وكيلتا الشعير باثني عشر جراما عند مدخل السامرة»."], [2, "فقال الجندي الذي كان الملك يتوكأ على ذراعه لرجل الله: «حتى إن فتح الرب كوى في السماء، فهل يمكن أن يحدث هذا الأمر؟» فأجاب أليشع: «سترى ذلك بعينيك، ولكنك لن تأكل منه»."], [3, "وكان هناك أربعة رجال برص عند مدخل بوابة المدينة، فقال أحدهم لرفاقه: «ما بالنا نجلس حتى نموت جوعا؟"], [4, "إن قلنا لندخل إلى المدينة، فالجوع فيها، وسنموت. وإن مكثنا هنا نموت أيضا. فهيا بنا نلجأ إلى معسكر الأراميين، فإن استحيونا عشنا، وإن قتلونا متنا»."], [5, "فانطلقوا في المساء إلى معسكر الأراميين. وعندما بلغوا أطراف المعسكر لم يجدوا هناك أحدا."], [6, "فإن الرب قد جعل جيش أرام يسمع صلصلة مركبات، وصوت وقع حوافر خيل، وجلبة جيش كثيف، فقال أحدهم للآخر: «لابد أن ملك إسرائيل استأجر ضدنا جيوش الحثيين والمصريين لينقضوا علينا»."], [7, "ففروا هاربين عند المساء، مخلفين وراءهم خيامهم وخيولهم وحميرهم، تاركين المعسكر على حاله، وفروا ناجين بأنفسهم."], [8, "ودخل هؤلاء البرص إحدى الخيام في أطراف المعسكر، فأكلوا وشربوا واستولوا على ما فيها من فضة وذهب وثياب، ثم طمروها. ورجعوا ودخلوا إلى خيمة أخرى واستولوا على ما فيها أيضا وطمروه."], [9, "ثم قال بعضهم لبعض: «إننا نخطيء فيما نفعل. فاليوم يوم بشارة ونحن ساكتون، فإن انتظرنا طلوع الفجر ولم نخبر ينالنا العقاب. فلندخل المدينة ونخبر رجال قصر الملك»."], [10, "فرجعوا إلى المدينة وقالوا للبواب: «لقد دخلنا معسكر الأراميين فلم نجد فيه أحدا، ولم نسمع في أرجائه صوت إنسان. ولكننا رأينا خيلا وحميرا ما برحت معقولة في مرابضها، وخياما لا تزال منصوبة»."], [11, "فأذاع البوابون النبأ حتى بلغ قصر الملك."], [12, "فنهض الملك ليلا وقال لضباطه: «لأخبرنكم ما صنع الأراميون! لقد أدركوا أننا نتضور جوعا، فهجروا المعسكر ليختبئوا في الحقول، حتى إذا خرجنا من المدينة ينقضون علينا ويأسروننا أحياء ويستولون على المدينة»."], [13, "فأجاب واحد من الضباط وقال: «ليأخذ بعض منا خمسة من الخيل الباقية في المدينة. فإن أصابهم شر يكونون نظير بقية الإسرائيليين المعتصمين بالمدينة، أو نظير من هلكوا من الإسرائيليين. فلنرسل ونستطلع الأمر»."], [14, "فأعدوا مركبتي خيل انطلقتا بمن فيهما من رجال أرسلهم الملك خلف الأراميين."], [15, "فاقتفوا أثرهم إلى نهر الأردن، وإذا كل الطريق مملوءة ثيابا وأمتعة مما طرحها الأراميون عند فرارهم المفاجيء السريع. فرجع الرسل وأخبروا الملك."], [16, "فاندفع الشعب نحو معسكر الأراميين ونهبوه، وصارت كيلة الدقيق بشاقل، وكيلتا الشعير بشاقل(اثني عشر جراما)، حسب كلام الرب."], [17, "وعين الملك على مدخل بوابة المدينة الجندي الذي كان يتوكأ على ذراعه، فداسه الشعب في الزحام ومات عند الباب كما تنبأ أليشع في اليوم السابق عندما جاءه الملك ليقبض عليه."], [18, "فعندما قال رجل الله للملك: «غدا في مثل هذا الوقت تكون كيلتا الشعير بشاقل وكيلة الدقيق بشاقل في مدخل بوابة السامرة»."], [19, "ولكن الجندي قال لرجل الله: «حتى إن فتح الرب كوى في السماء فهل يمكن أن يحدث هذا الأمر؟» فقال له أليشع: «سترى ذلك بعينيك ولكنك لن تأكل منه»."], [20, "فتحققت النبوءة إذ داسه الشعب عند الباب فمات."]]}], "kwAr": "كانت هناك مدينة صغيرة", "noteAr": ""}], "arS": [["كانت هناك ", []], ["مدينة", ["H5892"]], [" ", []], ["صغيرة", ["H6996"]], [" فيها نفر ", []], ["قليل", ["H4592"]], [" ", []], ["من", ["H5921"]], [" ", []], ["الرجال", ["H376"]], ["، ", []], ["أقبل", ["H935"]], [" ", []], ["عليها", ["H413"]], [" ", []], ["ملك", ["H4428"]], [" قوي ", []], ["وحاصرها", ["H5437"]], [" ", []], ["وبنى", ["H1129"]], [" حولها ", []], ["أبراجا", ["H4685"]], [" ", []], ["عظيمة", ["H1419"]], [".", []]]}, {"c": 9, "v": 15, "text": "وكان يقيم في تلك المدينة رجل مسكين حكيم أنقذ المدينة بفضل حكمته. ولكن أحدا لم يذكره.", "groups": [{"kw": "yet", "raw": "Gen_40:23; Est_6:2, Est_6:3", "note": "", "refs": [{"l": "Gen 40:23", "n": "", "vs": [[23, "ولكن رئيس السقاة لم يذكر يوسف بل نسيه."]]}, {"l": "Est 6:2", "n": "", "vs": [[2, "وإذا مكتوب فيه ما كشفه مردخاي عن مؤامرة بغثانا وترش خصيي الملك وحاجبي الباب اللذين خططا لاغتيال الملك أحشويروش."]]}, {"l": "Est 6:3", "n": "", "vs": [[3, "فسأل الملك: «أية مكافأة وإكرام أجزلتهما لمردخاي من أجل هذا؟» فأجابه رجاله القائمون على خدمته: «لم يكافأ بشيء»."]]}], "kwAr": "ولكن أحدا لم يذكره", "noteAr": ""}], "arS": [["وكان يقيم في ", []], ["تلك", ["H1931"]], [" ", []], ["المدينة", ["H5892"]], [" ", []], ["رجل", ["H376", "H120"]], [" ", []], ["مسكين", ["H4542"]], [" ", []], ["حكيم", ["H2450"]], [" ", []], ["أنقذ", ["H4422"]], [" المدينة ", []], ["بفضل", ["H3808"]], [" ", []], ["حكمته", ["H2451"]], [". ولكن ", []], ["أحدا", ["H376"]], [" ", []], ["لم", ["H4672"]], [" ", []], ["يذكره", ["H2142"]], [".", []]]}, {"c": 9, "v": 16, "text": "فقلت: إن الحكمة خير من القوة. غير أن حكمة المسكين محتقرة وكلامه غير مسموع.", "groups": [{"kw": "Wisdom", "raw": "Ecc_9:18, Ecc_7:19; Pro_21:22, Pro_24:5", "note": "", "refs": [{"l": "Ecc 9:18", "n": "", "vs": [[18, "الحكمة خير من آلات الحرب، وخاطيء واحد يفسد خيرا جزيلا."]]}, {"l": "Ecc 7:19", "n": "", "vs": [[19, "تدعم الحكمة الحكيم بالقوة أكثر من عشرة متسلطين في المدينة."]]}, {"l": "Pro 21:22", "n": "", "vs": [[22, "الحكيم يتسلق سور مدينة الجبابرة ويدمر معقل اعتمادهم"]]}, {"l": "Pro 24:5", "n": "", "vs": [[5, "الرجل الحكيم يتمتع بالعزة، وذو المعرفة يزداد قوة،"]]}], "kwAr": "الحكمة خير من القوة", "noteAr": ""}, {"kw": "the poor", "raw": "Pro_10:15; Mar_6:2, Mar_6:3; Joh_7:47-49, Joh_9:24-34; 1Co_1:26-29; Jam_2:2-6", "note": "", "refs": [{"l": "Pro 10:15", "n": "", "vs": [[15, "ثروة الغني قلعته الحصينة، وفي فقر المساكين هلاكهم."]]}, {"l": "Mar 6:2", "n": "", "vs": [[2, "ولما حل السبت، أخذ يعلم في المجمع، فدهش كثيرون حين سمعوه، وقالوا: «من أين له هذا؟ وما هذه الحكمة الموهوبة له، وهذه المعجزات الجارية على يديه؟"]]}, {"l": "Mar 6:3", "n": "", "vs": [[3, "أليس هذا هو النجار ابن مريم، وأخا يعقوب ويوسي ويهوذا وسمعان؟ أوليست أخواته عندنا هنا؟» هكذا كانوا يشكون فيه."]]}, {"l": "Joh 7:47-49", "n": "", "vs": [[47, "فردوا غاضبين: «وهل ضللتم أنتم أيضا؟"], [48, "أرأيتم أحدا من الرؤساء أو من الفريسيين آمن به؟"], [49, "أما عامة الشعب الذين يجهلون الشريعة، فاللعنة عليهم!»"]]}, {"l": "Joh 9:24-34", "n": "", "vs": [[24, "ثم استدعى الفريسيون، مرة ثانية الرجل الذي كان أعمى، وقالوا له: «مجد الله ! نحن نعلم أن هذا الرجل خاطيء»."], [25, "فأجاب: «أخاطيء هو، لست أعلم! إنما أعلم شيئا واحدا: أني كنت أعمى والآن أبصر!»"], [26, "فسألوه ثانية: «ماذا فعل بك؟ كيف فتح عينيك؟»"], [27, "أجابهم: «قد قلت لكم ولم تسمعوا لي، فلماذا تريدون أن تسمعوا مرة ثانية؟ ألعلكم تريدون أنتم أيضا أن تصيروا تلاميذ له؟»"], [28, "فشتموه وقالوا له: «بل أنت تلميذه ! أما نحن فتلاميذ موسى."], [29, "نحن نعلم أن موسى كلمه الله ؛ أما هذا، فلا نعلم له أصلا!»"], [30, "فأجابهم الرجل: «إن في ذلك عجبا! إنه فتح عيني، وتقولون إنكم لا تعلمون له أصلا!"], [31, "نحن نعلم أن الله لا يستجيب للخاطئين، ولكنه يستمع لمن يتقيه ويعمل بإرادته،"], [32, "ولم يسمع على مدى الأجيال أن أحدا فتح عيني مولود أعمى!"], [33, "فلو لم يكن هو من الله، لما استطاع أن يعمل شيئا»."], [34, "فصاحوا به: «أنت بكاملك ولدت في الخطيئة وتعلمنا؟!» ثم طردوه خارج المجمع."]]}, {"l": "1Co 1:26-29", "n": "", "vs": [[26, "فاتخذوا العبرة من دعوتكم أيها الإخوة: فليس بينكم كثيرون من الحكماء حكمة بشرية، ولا كثيرون من المقتدرين، ولا كثيرون من النبلاء."], [27, "بل إن الله قد اختار ما هو جاهل في العالم ليخجل الحكماء. وقد اختار الله ما هو ضعيف في العالم ليخجل المقتدرين."], [28, "وقد اختار الله ما كان في العالم وضيعا ومحتقرا وعديم الشأن، ليزيل ما له شأن،"], [29, "حتى لا يفتخر أي بشر أمام الله."]]}, {"l": "Jam 2:2-6", "n": "", "vs": [[2, "لنفرض أن إنسانين دخلا مجمعكم، أحدهما غني يلبس ثيابا فاخرة ويزين أصابعه بخواتم من ذهب، والآخر فقير يلبس ثيابا رثة."], [3, "فإن رحبتم بالغني قائلين: «تفضل، اجلس هنا في الصدر!» ثم قلتم للفقير: «وأنت، قف هناك، أو اقعد على الأرض عند أقدامنا!»"], [4, "فإن ذلك يؤكد أنكم تميزون بين الناس بحسب طبقاتهم، جاعلين من أنفسكم قضاة ذوي أفكار سيئة!"], [5, "فياإخوتي الأحباء، أما اختار الله الفقراء في نظر الناس ليجعلهم أغنياء في الإيمان، ويعطيهم حق الإرث في الملكوت الذي وعد به محبيه؟"], [6, "ولكنكم أنتم عاملتم الفقير معاملة مهينة. ألا تعرفون أن الأغنياء هم الذين يتسلطون عليكم ويجرونكم إلى المحاكم،"]]}], "kwAr": "حكمة المسكين", "noteAr": ""}], "arS": [["فقلت", ["H559"]], [": إن ", []], ["الحكمة", ["H2451"]], [" ", []], ["خير", ["H2896"]], [" ", []], ["من", ["H4480"]], [" ", []], ["القوة", ["H1369"]], [". ", []], ["غير", ["H369"]], [" أن ", []], ["حكمة", ["H2451"]], [" ", []], ["المسكين", ["H4542"]], [" ", []], ["محتقرة", ["H959"]], [" ", []], ["وكلامه", ["H1697"]], [" غير ", []], ["مسموع", ["H8085"]], [".", []]]}, {"c": 9, "v": 17, "text": "كلام الحكماء المسموع في الهدوء خير من صراخ الحكام بين الجهال.", "groups": [{"kw": "", "raw": "Gen_41:33-40; 1Sa_7:3-6; Pro_28:23; Isa_42:2, Isa_42:4; Jam_1:20, Jam_3:17, Jam_3:18", "note": "", "refs": [{"l": "Gen 41:33-40", "n": "", "vs": [[33, "والآن ليبحث فرعون عن رجل بصير حكيم يوليه على البلاد،"], [34, "وليقم فرعون نظارا على أرض مصر يجبون خمس غلتها في سنوات الرخاء السبع."], [35, "وليجمعوا كل طعام سنوات الخير المقبلة، ويخزنوا القمح بتفويض من فرعون ويحفظوه في المدن ليكون طعاما،"], [36, "ومؤونة لأهل الأرض في سنوات المجاعة السبع التي ستسود أرض مصر فلا يهلكون جوعا»."], [37, "فاستحسن فرعون ورجاله جميعا هذا الكلام،"], [38, "وقال فرعون لعبيده: «هل نجد نظير هذا رجلا فيه روح الله؟»"], [39, "ثم قال فرعون ليوسف: «من حيث أن الله قد أطلعك على كل هذا، فليس هناك بصير وحكيم نظيرك."], [40, "لذلك أوليك على بيتي، ويذعن شعبي لكل أمر تصدره، ولن يكون أعظم منك سواي أنا صاحب العرش»."]]}, {"l": "1Sa 7:3-6", "n": "", "vs": [[3, "فقال صموئيل لكل شعب إسرائيل: «إن كنتم حقا قد تبتم من كل قلوبكم إلى الرب، فانزعوا الآلهة الغريبة وأصنام العشتاروث من وسطكم، وهيئوا قلوبكم للرب واعبدوه وحده، فينقذكم من قبضة الفلسطينيين»."], [4, "فتخلص بنو إسرائيل من البعليم وأصنام عشتاروث، وعبدوا الرب وحده."], [5, "فقال صموئيل: «ادعوا كل إسرائيل للاجتماع في المصفاة فأصلي لأجلكم إلى الرب»."], [6, "فاجتمعوا في المصفاة حيث استقوا ماء وسكبوه أمام الرب، وصاموا في ذلك اليوم قائلين هناك: «قد أخطأنا إلى الرب». وكان صموئيل يقضي لبني إسرائيل في المصفاة."]]}, {"l": "Pro 28:23", "n": "", "vs": [[23, "من يوبخ إنسانا يحظى من بعد برضاه أكثر ممن يتملق بلسانه."]]}, {"l": "Isa 42:2", "n": "", "vs": [[2, "لا يصيح ولا يصرخ ولا يرفع صوته في الطريق."]]}, {"l": "Isa 42:4", "n": "", "vs": [[4, "لا يكل ولا تثبط له همة حتى يرسخ العدل في الأرض، وتنتظر الجزائر شريعته."]]}, {"l": "Jam 1:20", "n": "", "vs": [[20, "لأن الإنسان، إذا غضب، لا يعمل الصلاح الذي يريده الله ."]]}, {"l": "Jam 3:17", "n": "", "vs": [[17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}, {"l": "Jam 3:18", "n": "", "vs": [[18, "والبر هو ثمر ة ما يزرعه في سلام صانعو السلام."]]}], "kwAr": "", "noteAr": ""}], "arS": [["كلام", ["H1697"]], [" ", []], ["الحكماء", ["H2450"]], [" ", []], ["المسموع", ["H8085"]], [" في ", []], ["الهدوء", ["H5183"]], [" خير ", []], ["من", ["H4480"]], [" ", []], ["صراخ", ["H2201"]], [" ", []], ["الحكام", ["H4910"]], [" بين ", []], ["الجهال", ["H3684"]], [".", []]]}, {"c": 9, "v": 18, "text": "الحكمة خير من آلات الحرب، وخاطيء واحد يفسد خيرا جزيلا.", "groups": [{"kw": "better", "raw": "Ecc_9:16", "note": "", "refs": [{"l": "Ecc 9:16", "n": "", "vs": [[16, "فقلت: إن الحكمة خير من القوة. غير أن حكمة المسكين محتقرة وكلامه غير مسموع."]]}], "kwAr": "الحكمة خير من آلات", "noteAr": ""}, {"kw": "sinner", "raw": "Jos_7:1, Jos_7:5, Jos_7:11, Jos_7:12, Jos_22:20; 1Sa_14:28, 1Sa_14:29, 1Sa_14:36-46; 2Sa_20:1, 2Sa_20:2; 2Th_2:8-12; 2Ti_2:16-18, 2Ti_3:8, 2Ti_4:3, 2Ti_4:4; Tit_1:10, Tit_1:11; Heb_12:15, Heb_12:16", "note": "", "refs": [{"l": "Jos 7:1", "n": "", "vs": [[1, "ولكن الإسرائيليين ارتكبوا خيانة، إذ أخذ عخان بن كرمي بن زبدي بن زارح من سبط يهوذا مما هو مخصص للرب، فاحتدم غضب الرب على بني إسرائيل."]]}, {"l": "Jos 7:5", "n": "", "vs": [[5, "وقتل منهم أهل عاي نحو ستة وثلاثين رجلا، وتعقبوهم من أمام بوابة المدينة حتى شباريم وكسروهم عند المنحدر. فدب الرعب في قلوب بني إسرائيل."]]}, {"l": "Jos 7:11", "n": "", "vs": [[11, "لقد ارتكب إسرائيل خطيئة، بل تعدوا على عهدي الذي أمرتهم به، بل أخذوا مما حرمته عليهم وسرقوا وأنكروا، بل خبأوا في أمتعتهم."]]}, {"l": "Jos 7:12", "n": "", "vs": [[12, "لهذا عجز بنو إسرائيل عن الثبات أمام أعدائهم، فولوا أمامهم الأدبار، لأنهم هالكون إذ لن أعود أكون معكم ما لم تستأصلوا الحرام من وسطكم،"]]}, {"l": "Jos 22:20", "n": "", "vs": [[20, "ألم يرتكب عخان بن زارح خيانة فسرق ما حرمه الله ، فانصب السخط على كل جماعة إسرائيل ولم يكن هو وحده فقط الذي هلك من جراء إثمه؟»"]]}, {"l": "1Sa 14:28", "n": "", "vs": [[28, "فقال له واحد من المحاربين: «قد حلف أبوك القوم قائلا: ملعون الرجل الذي يأكل اليوم طعاما»، فأصاب الشعب الإعياء."]]}, {"l": "1Sa 14:29", "n": "", "vs": [[29, "فقال يوناثان: «لقد أضر أبي بكل الجيش. انظروا كيف انتعشت قواي لأني ذقت قليلا من العسل."]]}, {"l": "1Sa 14:36-46", "n": "", "vs": [[36, "وأمر شاول: «لنتعقب الفلسطينيين ليلا ونظل ننهبهم إلى ضوء الصباح، ولا نبق منهم أحدا». فأجابوه: «افعل كل ما يطيب لك». ولكن الكاهن قال: «لنستشر الله هنا»."], [37, "فاستشار شاول الله سائلا: «أنتعقب الفلسطينيين؟ أتنصرنا عليهم؟» فلم يحظ بجواب في ذلك اليوم."], [38, "فقال شاول: «اقتربوا إلى هنا يا جميع وجوه إسرائيل، وتقصوا أية خطيئة ارتكبت اليوم."], [39, "لأنه حي هو الرب مخلص إسرائيل إن الموت هو جزاء مرتكب الخطيئة حتى لو كان جانيها ابني يوناثان». فاعتصم القوم بالصمت."], [40, "فقال لكل الجيش: «قفوا أنتم في جانب، وأقف أنا وابني يوناثان في جانب آخر». فأجاب الشعب: «اصنع ما يروق لك»."], [41, "وصلى شاول للرب إله إسرائيل قائلا: «اكشف لي الحق». فوقعت القرعة على شاول ويوناثان، وتبرأ القوم."], [42, "وقال شاول: «ألقوا القرعة بيني وبين يوناثان ابني». فوقعت القرعة على يوناثان."], [43, "فقال شاول ليوناثان: «أخبرني ماذا جنيت؟» فقال يوناثان: «ذقت قليلا من العسل بطرف عصاي التي بيدي. أمن أجل قليل من العسل ينبغي أن أموت؟»"], [44, "فقال شاول: «ليضاعف الرب عقابي إن لم ينفذ بك حكم الموت»."], [45, "فهتف الجيش في وجه شاول: «أيموت يوناثان الذي صنع هذا الخلاص العظيم في إسرائيل؟ هذا لا يمكن! حي هو الرب، لا تسقط شعرة من رأسه إلى الأرض لأنه صنع هذا الأمر بمعونة الرب اليوم». وهكذا افتدى الشعب يوناثان فلم يمت."], [46, "وكف شاول عن تعقب الفلسطينيين، فرجع الفلسطينيون إلى أرضهم."]]}, {"l": "2Sa 20:1", "n": "", "vs": [[1, "وحدث أن كان هناك رجل لئيم يدعى شبع بن بكري من سبط بنيامين، فنفخ هذا بالبوق وقال: «ليس لنا نصيب في داود ولا قسم في ابن يسى، فليرجع كل رجل إلى خيمته ياإسرائيل»."]]}, {"l": "2Sa 20:2", "n": "", "vs": [[2, "فتخلى كل رجال إسرائيل عن داود وتبعوا شبع بن بكري، وأما رجال يهوذا فلازموا ملكهم وواكبوه من الأردن إلى أورشليم."]]}, {"l": "2Th 2:8-12", "n": "", "vs": [[8, "عندئذ سيظهر الإنسان المتمرد ظهورا جليا فيبيده الرب يسوع بنفخة فمه ويلاشيه ببهاء ظهوره عند عودته."], [9, "أما بروز المتمرد، فسوف يكون بقدر طاقة الشيطان على المعجزات والعلامات والعجائب المزيفة كلها،"], [10, "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا."], [11, "ولهذا السبب، سيرسل الله إليهم طاقة الضلال حتى يصدقوا ما هو دجل،"], [12, "فتقع الدينونة على جميع الذين لم يؤمنوا بالحق بل سرهم الإثم."]]}, {"l": "2Ti 2:16-18", "n": "", "vs": [[16, "أما الأحاديث الباطلة الدنسة، فتجنبها؛ فإن المنصرفين إليها يتقدمون إلى فجور أفظع،"], [17, "وكلامهم ينهش كالآكلة، ومنهم هيمنايوس وفيليتوس،"], [18, "اللذان زاغا عن الحق؛ إذ يزعمان أن القيامة قد حدثت، ويهدمان إيمان بعض الناس."]]}, {"l": "2Ti 3:8", "n": "", "vs": [[8, "ومثلما قاوم (الساحران) ينيس ويمبريس موسى، كذلك أيضا يقاوم هؤلاء الحق؛ أناس عقولهم فاسدة، وقد تبين أنهم غير أهل للإيمان."]]}, {"l": "2Ti 4:3", "n": "", "vs": [[3, "فإنه سيأتي زمان لا يطيق الناس فيه التعليم الصحيح، بل تبعا لشهواتهم الخاصة يكدسون لأنفسهم معلمين (يقولون لهم كلاما) يداعب الآذان."]]}, {"l": "2Ti 4:4", "n": "", "vs": [[4, "فيحولون آذانهم بعيدا عن الحق، منحرفين إلى الخرافات."]]}, {"l": "Tit 1:10", "n": "", "vs": [[10, "فإن هنالك كثيرين من معلمي الباطل المتمردين وخادعي عقول الناس، وبخاصة الذين من أهل الختان."]]}, {"l": "Tit 1:11", "n": "", "vs": [[11, "هؤلاء يجب أن تسد أفواههم: فهم يخربون بيوتا بجملتها، إذ يعلمون تعاليم يجب ألا تعلم، في سبيل مكسب خسيس."]]}, {"l": "Heb 12:15", "n": "", "vs": [[15, "انتبهوا ألا يسقط أحدكم من نعمة الله، حتى لا يتأصل بينكم جذر مرارة، فيسبب بلبلة، وينجس كثيرين منكم."]]}, {"l": "Heb 12:16", "n": "", "vs": [[16, "وحذار أن يكون بينكم زان أو مستهتر مثل عيسو الذي باع حقوقه بوصفه الابن البكر، لقاء أكلة واحدة."]]}], "kwAr": "خاطيء واحد", "noteAr": ""}], "arS": [["الحكمة", ["H2451"]], [" ", []], ["خير", ["H2896"]], [" ", []], ["من", ["H4480"]], [" ", []], ["آلات", ["H3627"]], [" ", []], ["الحرب", ["H7128"]], ["، ", []], ["وخاطيء", ["H2398"]], [" ", []], ["واحد", ["H259"]], [" ", []], ["يفسد", ["H6"]], [" ", []], ["خيرا", ["H2896"]], [" ", []], ["جزيلا", ["H7235"]], [".", []]]}, {"c": 10, "v": 1, "text": "كما أن الذباب الميت ينتن طيب العطار، فإن بعض الحماقة تكون أثقل من الحكمة والكرامة.", "groups": [{"kw": "Dead flies", "raw": "Heb. Flies of death", "note": "Heb. Flies of death", "refs": [], "kwAr": "الذباب الميت", "noteAr": "بالعبرانية: ذباب الموت."}, {"kw": "the ointment", "raw": "Exo_30:34, Exo_30:35", "note": "", "refs": [{"l": "Exo 30:34", "n": "", "vs": [[34, "وقال الرب لموسى: «خذ لك أطيابا، أجزاء متساوية من الميعة والأظفار والقنة العطرة واللبان الزكي، واخلطها،"]]}, {"l": "Exo 30:35", "n": "", "vs": [[35, "صانعا منها بخورا عطرا مملحا نقيا مقدسا، كما يفعل أمهر العطارين."]]}], "kwAr": "طيب العطار", "noteAr": ""}, {"kw": "a little", "raw": "2Ch_19:2; Neh_6:13, Neh_13:26; Mat_5:13-16; Gal_2:12-14", "note": "", "refs": [{"l": "2Ch 19:2", "n": "", "vs": [[2, "فخرج النبي ياهو بن حناني للقائه وقال للملك يهوشافاط: «أتعين الشرير وتحب مبغضي الرب؟ لذلك يحل عليك غضب الرب."]]}, {"l": "Neh 6:13", "n": "", "vs": [[13, "ليبث الرعب في، فأخطىء إذ أفعل وفق رأيه، فتشيع عني سمعة سيئة يعيرانني بها."]]}, {"l": "Neh 13:26", "n": "", "vs": [[26, "أليس بمثل هذا أخطأ سليمان ملك إسرائيل، مع أنه لم يكن له نظير بين ملوك شعوب كثيرة؟ لقد كان محبوبا عند إلهه، وجعله الله ملكا على إسرائيل، ومع ذلك أغوته النساء الأجنبيات على ارتكاب الإثم"]]}, {"l": "Mat 5:13-16", "n": "", "vs": [[13, "أنتم ملح الأرض. فإذا فسد الملح، فماذا يعيد إليه ملوحته؟ إنه لا يعود يصلح لشيء إلا لأن يطرح خارجا لتدوسه الناس!"], [14, "أنتم نور العالم. لا يمكن أن تخفى مدينة مبنية على جبل؛"], [15, "ولا يضيء الناس مصباحا ثم يضعونه تحت مكيال، بل يضعونه في مكان مرتفع ليضيء لجميع من في البيت."], [16, "هكذا، فليضيء نوركم أمام الناس، ليروا أعمالكم الحسنة ويمجدوا أباكم الذي في السماوات."]]}, {"l": "Gal 2:12-14", "n": "", "vs": [[12, "إذ قبل أن يأتي بعضهم من عند يعقوب، كان بطرس يأكل مع الإخوة الذين من الأمم؛ ولكن لما أتى أولئك، انسحب وعزل نفسه، خوفا من أهل الختان."], [13, "وجاراه في ريائه باقي الإخوة الذين من اليهود. حتى إن برنابا أيضا انساق إلى ريائهم."], [14, "فلما رأيت أنهم لا يسلكون باستقامة توافق حق الإنجيل، قلت لبطرس أمام الحاضرين جميعا: «إن كنت وأنت يهودي تعيش كالأمم لا كاليهود، فكيف تجبر الأمم أن يعيشوا كاليهود؟»"]]}], "kwAr": "بعض الحماقة", "noteAr": ""}], "arS": [["كما أن ", []], ["الذباب", ["H2070"]], [" ", []], ["الميت", ["H4194"]], [" ", []], ["ينتن", ["H887", "H5042"]], [" ", []], ["طيب", ["H8081"]], [" ", []], ["العطار", ["H7543"]], ["، فإن ", []], ["بعض", ["H4480", "H4592"]], [" ", []], ["الحماقة", ["H5531"]], [" تكون أثقل ", []], ["من", ["H4480"]], [" ", []], ["الحكمة", ["H2451"]], [" ", []], ["والكرامة", ["H3519", "H3368"]], [".", []]]}, {"c": 10, "v": 2, "text": "قلب الحكيم ميال لعمل الحق، وقلب الجاهل ينزع نحو ارتكاب الشر.", "groups": [{"kw": "wise", "raw": "Ecc_9:10; Pro_14:8; Luk_14:28-32", "note": "", "refs": [{"l": "Ecc 9:10", "n": "", "vs": [[10, "وكل ما تحصل عليه من عمل، فاعمله بكل قوتك، إذ لن تجد في الهاوية التي أنت ماض إليها أي عمل أو ابتكار أو معرفة أو حكمة."]]}, {"l": "Pro 14:8", "n": "", "vs": [[8, "حكمة العاقل في تبين حسن مسلكه، وغباوة الجهال في ارتكاب خدعهم."]]}, {"l": "Luk 14:28-32", "n": "", "vs": [[28, "فأي منكم، وهو راغب في أن يبني برجا، لا يجلس أولا ويحسب الكلفة ليرى هل عنده ما يكفي لإنجازه؟"], [29, "وذلك لئلا يضع له الأساس ولا يقدر أن ينجزه. أفلا يأخذ جميع الناظرين يسخرون منه."], [30, "قائلين: هذا الإنسان شرع يبني وعجز عن الإنجاز؟"], [31, "أم أي ملك ذاهب لمحاربة آخر، لا يجلس أولا ويستشير ليرى هل يقدر أن يواجه بعشرة آلاف ذلك الزاحف عليه بعشرين ألفا."], [32, "وإلا فإنه، والعدو مازال بعيدا، يرسل إليه وفدا، طالبا ما يؤول إلى الصلح."]]}], "kwAr": "قلب الحكيم", "noteAr": ""}, {"kw": "but", "raw": "Ecc_10:10, Ecc_10:14; Pro_17:16; Luk_12:18-20", "note": "", "refs": [{"l": "Ecc 10:10", "n": "", "vs": [[10, "إن كل الحديد ولم يشحذ صاحبه حده، فعليه أن يبذل جهدا أكبر! والحكمة تسعف على النجاح."]]}, {"l": "Ecc 10:14", "n": "", "vs": [[14, "يكثر الأحمق من الكلام، ولا أحد يدري ماذا سيكون، ومن يقدر أن يخبره بما سيجري من بعده؟"]]}, {"l": "Pro 17:16", "n": "", "vs": [[16, "ما جدوى أن يكون لدى الجاهل مال لاقتناء الحكمة، وهو لا يملك الفهم لتعلمها."]]}, {"l": "Luk 12:18-20", "n": "", "vs": [[18, "وقال: أعمل هذا: أهدم مخازني وأبني أعظم منها، وهناك أخزن جميع غلالي وخيراتي."], [19, "وأقول لنفسي: يانفس، عندك خيرات كثيرة مخزونة لسنين عديدة، فاستريحي وكلي واشربي واطر بي!"], [20, "ولكن الله قال له: ياغبي، هذه الليلة تطلب نفسك منك، فلمن يبقى ما أعددته؟"]]}], "kwAr": "وقلب الجاهل", "noteAr": ""}], "arS": [["قلب", ["H3820"]], [" ", []], ["الحكيم", ["H2450"]], [" ميال لعمل الحق، ", []], ["وقلب", ["H3820"]], [" ", []], ["الجاهل", ["H3684"]], [" ", []], ["ينزع", ["H8040"]], [" نحو ارتكاب الشر.", []]]}, {"c": 10, "v": 3, "text": "حتى إذا مشى الجاهل في الطريق يفتقر إلى البصيرة، ويقول عن نفسه لكل واحد: إنه أحمق.", "groups": [{"kw": "wisdom", "raw": "Heb. heart", "note": "Heb. heart", "refs": [], "kwAr": "يفتقر إلى البصيرة", "noteAr": "بالعبرانية: قلب."}, {"kw": "and he", "raw": "Ecc_5:3; Pro_13:16, Pro_18:2, Pro_18:6; 1Pe_4:4", "note": "", "refs": [{"l": "Ecc 5:3", "n": "", "vs": [[3, "فكما تراود الأحلام النائم من كثرة العناء، كذلك أقوال الجهل تصدر عن الإفراط في الكلام."]]}, {"l": "Pro 13:16", "n": "", "vs": [[16, "كل عاقل يعمل بالمعرفة أما الأحمق فيعرض حمقه."]]}, {"l": "Pro 18:2", "n": "", "vs": [[2, "لا يعبأ الجاهل بالفطنة، بل همه الإعراب عما في نفسه."]]}, {"l": "Pro 18:6", "n": "", "vs": [[6, "أقوال الجاهل توقعه في المتاعب، وكلماته تسبب له الضرب."]]}, {"l": "1Pe 4:4", "n": "", "vs": [[4, "ورفاقكم في تلك العيشة سابقا يستغربون أنكم لا تركضون معهم إلى فيض هذه الخلاعة، ويجرحون سمعتكم."]]}], "kwAr": "ويقول عن نفسه", "noteAr": ""}], "arS": [["حتى", ["H1571"]], [" ", []], ["إذا", ["H3605"]], [" ", []], ["مشى", ["H1980"]], [" ", []], ["الجاهل", ["H5530"]], [" في ", []], ["الطر ، فوجدت أنه قد أقام مأدبة في بيته كمأدبة ملك، وقد أخذته النشوة بعد أن أكثر من احتساء الخمر حتى سكر، فلم تخبره بشيء إطلاقا حتى صباح اليوم التالي."], [37, "وفي الصباح، بعد أن صحا نابال من سكرته، أخبرته بما جرى، فأصابه الشلل وتجمد كحجر."], [38, "وبعد عشرة أيام ضربه الله فمات."], [39, "فلما سمع داود بموت نابال قال: «مبارك الرب الذي انتقم لي بذاته من إهانة نابال، وجنبني ارتكاب الشر وعاقب نابال على إثمه». وأرسل داود إلى أبيجايل يسألها الزواج منه."], [40, "فوفد رسل داود إلى أبيجايل إلى الكرمل وقالوا لها: «أرسلنا داود إليك لنسألك الزواج منه»."], [41, "فقامت وسجدت بوجهها إلى الأرض وقالت: «أنا أمته المستعدة لخدمته ولغسل أرجل عبيد سيدي»."], [42, "ثم أسرعت أبيجايل وركبت حمارها بعد أن صحبت معها خمس فتيات من جواريها سرن وراءها، وتبعت رسل داود، وصارت له زوجة."], [43, "ثم تزوج داود أخينوعم من يزرعيل فكانتا له زوجتين."], [44, "عندئذ زوج شاول ميكال ابنته امرأة داود من فلطي بن لايش الذي من جليم."]]}, {"l": "Pro 25:15", "n": "", "vs": [[15, "بالصبر يتم إقناع الحاكم، واللسان اللين يكسر العظام."]]}], "kwAr": "فإن الهدوء", "noteAr": ""}], "arS": [["إذا", ["H3588"]], [" ", []], ["ثار", ["H5927"]], [" ", []], ["غضب", ["H1419", "H7307"]], [" ", []], ["الحاكم", ["H4910"]], [" ", []], ["عليك", ["H5921"]], [" ", []], ["فلا", ["H408"]], [" ", []], ["تهجر", ["H5117"]], [" ", []], ["مكانك", ["H4725"]], ["، ", []], ["فإن", ["H518"]], [" ", []], ["الهدوء", ["H4832"]], [" ", []], ["يسكن", ["H5117"]], [" السخط على ", []], ["خطايا", ["H2399"]], [" عظيمة.", []]]}, {"c": 10, "v": 5, "text": "رأيت شرا تحت السماء هو: كالسهو الصادر عن السلطان.", "groups": [{"kw": "an evil", "raw": "Ecc_4:7, Ecc_5:13, Ecc_6:1, Ecc_9:3", "note": "", "refs": [{"l": "Ecc 4:7", "n": "", "vs": [[7, "وعدت أتأمل فرأيت باطلا آخر تحت الشمس:"]]}, {"l": "Ecc 5:13", "n": "", "vs": [[13, "قد رأيت شرا مقيتا تحت الشمس: ثروة مدخرة لغير صاحبها."]]}, {"l": "Ecc 6:1", "n": "", "vs": [[1, "رأيت شرا تحت الشمس خيم بثقله على الناس:"]]}, {"l": "Ecc 9:3", "n": "", "vs": [[3, "وأشر ما يجري تحت الشمس أن الجميع يلقون نفس المصير، وأن قلوب بني البشر مفعم
