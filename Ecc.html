 Psa_31:12; Pro_10:7; Jer_17:13; Heb_10:38", "note": "", "refs": [{"l": "Ecc 2:16", "n": "", "vs": [[16, "فإن الحكيم كالجاهل، لن يكون لهما ذكر إلى الأبد، ففي الأيام المقبلة سيصبحان كلاهما نسيا منسيا، إذ يموت الجاهل كالحكيم."]]}, {"l": "Ecc 9:5", "n": "", "vs": [[5, "لأن الأحياء يدركون أنهم سيموتون، أما الأموات فلا يعلمون شيئا، وليس لهم ثواب بعد، إذ قد ينسى ذكرهم."]]}, {"l": "Psa 31:12", "n": "", "vs": [[12, "صرت منسيا كما لو كنت ميتا، وأصبحت كإناء محطم،"]]}, {"l": "Pro 10:7", "n": "", "vs": [[7, "ذكر الصديق بركة، واسم الأشرار يعتريه البلى."]]}, {"l": "Jer 17:13", "n": "", "vs": [[13, "أيها الرب رجاء إسرائيل: إن جميع الذين يتخلون عنك يلحق بهم الخزي، والذين ينصرفون عنك (يزولون) كمن كتبت أسماؤهم على التراب لأنهم نبذوا الرب ينبوع المياه الحية."]]}, {"l": "Heb 10:38", "n": "", "vs": [[38, "وأما من تبرر بالإيمان، فبالإيمان يحيا. ومن ارتد لا تسر به نفسي!"]]}], "kwAr": "كيلت لهم", "noteAr": ""}], "arS": [["ثم ", []], ["رأيت", ["H7200"]], [" ", []], ["الأشرار", ["H7563"]], [" ", []], ["ممن", ["H834"]], [" كانوا ", []], ["يروحون", ["H1980"]], [" ", []], ["ويجيئون", ["H935"]], [" إلى ", []], ["المكان", ["H4725"]], [" ", []], ["المقدس", ["H6918"]], ["، ", []], ["يدفنون", ["H6912"]], [" وقد كيلت لهم هالات المديح في ", []], ["المدينة", ["H5892"]], [" التي ", []], ["ارتكبوا", ["H6213"]], [" فيها ", []], ["هذه", ["H2088"]], [" الأمور. ", []], ["وهذا", ["H3651"]], [" ", []], ["أيضا", ["H1571"]], [" ", []], ["باطل", ["H1892"]], [".", []]]}, {"c": 8, "v": 11, "text": "ولأن القضاء لا ينفذ بسرعة على الشر المرتكب، فإن قلوب البشر تمتليء بالعزم على فعل الشر.", "groups": [{"kw": "sentence", "raw": "Exo_8:15, Exo_8:32; Job_21:11-15; Psa_10:6, Psa_50:21, Psa_50:22; Isa_5:18, Isa_5:19, Isa_26:10; Isa_57:11; Jer_48:11; Mat_24:49, Mat_24:50; Rom_2:4, Rom_2:5; 2Pe_3:3-10", "note": "", "refs": [{"l": "Exo 8:15", "n": "", "vs": [[15, "وعندما رأى فرعون أن البلية قد انقشعت، أغلظ قلبه ولم يستمع لهما، تماما كما قال الرب."]]}, {"l": "Exo 8:32", "n": "", "vs": [[32, "ولكن فرعون قسى قلبه هذه المرة أيضا ولم يطلق سراح الشعب."]]}, {"l": "Job 21:11-15", "n": "", "vs": [[11, "يسرحون صبيانهم كسرب، وأطفالهم يرقصون."], [12, "يغنون بالدف والعود ويطربون لصوت المزمار،"], [13, "يقضون أيامهم في الرغد، ثم في لحظة يهبطون إلى الهاوية."], [14, "يقولون للرب: فارقنا فإننا لا نعبأ بمعرفة طرقك."], [15, "من هو القدير حتى نعبده؟ وأي كسب نجنيه إن صلينا إليه؟"]]}, {"l": "Psa 10:6", "n": "", "vs": [[6, "قال في نفسه: «لن يزحزحني شيء، ولن ينالني مكروه قط»."]]}, {"l": "Psa 50:21", "n": "", "vs": [[21, "هذه كلها فعلت وأنا سكت، فظننت أني مثلك. غير أني أوبخك وأصف إثمك أمام عينيك."]]}, {"l": "Psa 50:22", "n": "", "vs": [[22, "والآن تنبهوا أيها الناسون الله ، لئلا أمزقكم وليس من ينقذكم."]]}, {"l": "Isa 5:18", "n": "", "vs": [[18, "ويل لمن يجرون الإثم بحبال الباطل، والخطيئة بمثل أمراس العربة"]]}, {"l": "Isa 5:19", "n": "", "vs": [[19, "ويقولون: ليسرع وليعجل بعقابه حتى نراه. لينفذ مقدس إسرائيل مأربه فينا فندرك حقيقة ما يفعله بنا."]]}, {"l": "Isa 26:10", "n": "", "vs": [[10, "إن أبديت رحمتك للمنافق فإنه لا يتعلم العدل، بل يظل يرتكب الشر حتى في أرض الاستقامة، ولا يعبأ بجلال الرب."]]}, {"l": "Isa 57:11", "n": "", "vs": [[11, "ممن خفتم وارتعبتم حتى كذبتم ولم تذكروني أو تفكروا في؟ هل اعتصمت بالسكينة زمنا طويلا حتى لم تعودوا تخافونني؟"]]}, {"l": "Jer 48:11", "n": "", "vs": [[11, "قد قضى موآب حياة مترفة منذ حداثته، كالخمر المستقر على عكره. لم يفرغ من إناء إلى إناء، ولم يذهب إلى السبي قط لذلك ظل محتفظا بطعمه ولم تتغير رائحته."]]}, {"l": "Mat 24:49", "n": "", "vs": [[49, "وبدأ يضرب زملاءه العبيد ويأكل ويشرب مع السكيرين،"]]}, {"l": "Mat 24:50", "n": "", "vs": [[50, "فإن سيد ذلك العبد لابد أن يرجع في يوم لا يتوقعه، وساعة لا يعرفها،"]]}, {"l": "Rom 2:4", "n": "", "vs": [[4, "أم أنك تحتقر غنى لطفه وصبره وطول أناته وأنت لا تعرف أن لطف الله يدفعك إلى التوبة؟"]]}, {"l": "Rom 2:5", "n": "", "vs": [[5, "ولكنك بسبب قساوتك وقلبك غير التائب، تخزن لنفسك غضبا ليوم الغضب، يوم تعلن دينونة الله العادلة."]]}, {"l": "2Pe 3:3-10", "n": "", "vs": [[3, "فاعلموا، قبل كل شيء أنه سيأتي في آخر الأيام أناس مستهزئون يسخرون بالحق، ويسلكون منجرفين وراء شهواتهم الخاصة."], [4, "وسيقولون: «أين هو الوعد برجوع المسيح؟ فمنذ أن مات آباؤنا الأولون، بل منذ بدء الخليقة، مازال كل شيء على حاله!»"], [5, "إنهم يتناسون، عمدا، أنه بكلمة أمر من الله وجدت السماوات منذ القديم وتكونت الأرض من الماء وبالماء."], [6, "وبكلمة منه أيضا، دمر العالم الذي كان موجودا في ذلك الزمان، إذ فاض الماء عليه."], [7, "أما السماوات والأرض الحالية، فستبقى مخزونة ومحفوظة للنار بتلك الكلمة عينها إلى يوم الدينونة وهلاك الفاجرين!"], [8, "ولكن، أيها الأحباء، عليكم ألا تنسوا هذه الحقيقة: أن يوما واحدا في نظر الرب هو كألف سنة، وألف سنة كيوم واحد."], [9, "فالرب، إذن، لا يبطيء في إتمام وعده، كما يظن بعض الناس، ولكنه يتأنى عليكم، فهو لا يريد لأحد من الناس أن يهلك، بل يريد لجميع الناس أن يرجعوا إليه تائبين."], [10, "إلا أن «يوم الرب» سيأتي كما يأتي اللص في الليل. في ذلك اليوم، تزول السماوات محدثة دويا هائلا وتنحل العناصر محترقة بنار شديدة، وتحترق الأرض وما فيها من منجزات."]]}], "kwAr": "القضاء لا ينفذ", "noteAr": ""}, {"kw": "fully", "raw": "Jer_42:15", "note": "", "refs": [{"l": "Jer 42:15", "n": "", "vs": [[15, "إذا اسمعوا قضاء الرب يابقية يهوذا: إن وطدتم العزم على الذهاب إلى مصر وارتحلتم لتتغربوا هناك،"]]}], "kwAr": "تمتليء", "noteAr": ""}], "arS": [["ولأن ", []], ["القضاء", ["H6213", "H6599"]], [" ", []], ["لا", ["H369"]], [" ", []], ["ينفذ", ["H6213"]], [" ", []], ["بسرعة", ["H4120"]], [" ", []], ["على", ["H5921"]], [" ", []], ["الشر", ["H7451"]], [" المرتكب، فإن ", []], ["قلوب", ["H3820"]], [" ", []], ["البشر", ["H120", "H1121"]], [" ", []], ["تمتليء", ["H4390"]], [" بالعزم على ", []], ["فعل", ["H4639"]], [" ", []], ["الشر", ["H7451"]], [".", []]]}, {"c": 8, "v": 12, "text": "ومع أن الخاطيء يرتكب الشر مئة مرة وتطول أيامه، إلا أنني أعلم أنه يكون خير لمتقي الله الذين يخشعون في حضرته.", "groups": [{"kw": "a sinner", "raw": "Ecc_5:16, Ecc_7:15; 1Ki_2:5-9, 1Ki_21:25, 1Ki_22:34, 1Ki_22:35; Pro_13:21; Isa_65:20; Rom_2:5; Rom_9:22; 2Pe_2:9", "note": "", "refs": [{"l": "Ecc 5:16", "n": "", "vs": [[16, "وهذا أيضا شر أليم، إذ إنه يفارق الدنيا كما جاء فأي منفعة له، إذ إن تعبه يذهب أدراج الرياح؟"]]}, {"l": "Ecc 7:15", "n": "", "vs": [[15, "لقد شاهدت هذه جميعها في أيام أباطيلي: رب صديق يهلك في بره، ومنافق تطول أيامه في شره."]]}, {"l": "1Ki 2:5-9", "n": "", "vs": [[5, "أنت تعلم ما جناه علي يوآب ابن صروية حين قتل قائدي جيوش إسرائيل: أبنير بن نير وعماسا بن يثر، فسفك دما في وقت السلم، وكأنه في خضم حرب، فلطخ بذلك الدم حزام حقويه ونعلي رجليه."], [6, "فاقض بما تمليه عليك حكمتك، ولا تدع رأسه الأشيب يموت في سلام."], [7, "واصنع معروفا لبني برزلاي الجلعادي، فيكونوا بين الآكلين الدائمين على مائدتك، لأنهم وقفوا إلى جانبي عند هروبي من وجه أبشالوم أخيك."], [8, "وهناك أيضا شمعي بن جيرا البنياميني من بحوريم، فقد صب علي أشد اللعنات يوم انطلقت إلى محنايم، ولكنه انحدر للقائي عند نهر الأردن مستغفرا، فحلفت له بالرب أنني لن أميته بالسيف،"], [9, "أما أنت فلا تبرره من ذنبه، وأنت رجل حكيم، فانظر ما تعاقبه به. أحدر شيبته إلى القبر ملطخة بالدم»."]]}, {"l": "1Ki 21:25", "n": "", "vs": [[25, "ولم يكن نظير أخآب الذي أغوته زوجته إيزابل، فباع نفسه لارتكاب الشر في عيني الرب."]]}, {"l": "1Ki 22:34", "n": "", "vs": [[34, "ولكن حدث أن جنديا أطلق سهمه من قوسه غير متعمد، فأصاب ملك إسرائيل بين أوصال درعه، فقال أخآب لقائد مركبته: «استدر وأخرجني من أرض المعركة فقد جرحت»"]]}, {"l": "1Ki 22:35", "n": "", "vs": [[35, "واشتدت المعركة في ذلك اليوم، وأوقف الملك مركبته في مواجهة الأراميين، ولم يلبث أن مات عند المساء، فجرى دم الجرح إلى أرض المركبة."]]}, {"l": "Pro 13:21", "n": "", "vs": [[21, "تلاحق البلية الخطاة، ويثاب الصديقون خيرا."]]}, {"l": "Isa 65:20", "n": "", "vs": [[20, "ولا يكون فيها بعد طفل لا يعيش سوى أيام قلائل، أو شيخ لا يستوفي أيامه. ومن يموت ابن مئة سنة يعتبر فتى، ومن لا يبلغها يكون ملعونا."]]}, {"l": "Rom 2:5", "n": "", "vs": [[5, "ولكنك بسبب قساوتك وقلبك غير التائب، تخزن لنفسك غضبا ليوم الغضب، يوم تعلن دينونة الله العادلة."]]}, {"l": "Rom 9:22", "n": "", "vs": [[22, "فماذا إذا إن كان الله ، وقد شاء أن يظهر غضبه ويعلن قدرته، احتمل بكل صبر أوعية غضب جاهزة للهلاك،"]]}, {"l": "2Pe 2:9", "n": "", "vs": [[9, "وهكذا نرى أن الرب يعرف أن ينقذ الأتقياء من المحنة، ويحفظ الأشرار محبوسين ليحكم عليهم بالعقاب في يوم الدينونة."]]}], "kwAr": "الخاطيء", "noteAr": ""}, {"kw": "surely", "raw": "Ecc_7:18; Psa_37:11, Psa_37:18, Psa_37:19, Psa_112:1, Psa_115:13; Pro_1:32, Pro_1:33; Isa_3:10, Isa_3:11; Isa_65:13, Isa_65:14, Isa_65:20-24; Mat_25:34, Mat_25:41-46; Luk_1:50", "note": "", "refs": [{"l": "Ecc 7:18", "n": "", "vs": [[18, "حسن أن تتشبث بهذا وأن لا تفرط في ذاك، لأن متقي الله يتفادى التطرف في كليهما."]]}, {"l": "Psa 37:11", "n": "", "vs": [[11, "أما الودعاء فيرثون خيرات الأرض ويتمتعون بفيض السلام."]]}, {"l": "Psa 37:18", "n": "", "vs": [[18, "الرب عليم بأيام الكاملين، وميراثهم يدوم إلى الأبد."]]}, {"l": "Psa 37:19", "n": "", "vs": [[19, "لا يخزون في زمان السوء، وفي أيام الجوع يشبعون."]]}, {"l": "Psa 112:1", "n": "", "vs": [[1, "هللويا! طوبى لمن يخشى الرب ويبتهج جدا بوصاياه."]]}, {"l": "Psa 115:13", "n": "", "vs": [[13, "يبارك كل من يتقيه، صغارهم وكبارهم."]]}, {"l": "Pro 1:32", "n": "", "vs": [[32, "لأن ضلال الحمقى يقتلهم، وتر ف الجهال يهلكهم."]]}, {"l": "Pro 1:33", "n": "", "vs": [[33, "أما المستمع لي فيسكن آمنا مطمئنا لا يصيبه خوف من الشر»."]]}, {"l": "Isa 3:10", "n": "", "vs": [[10, "ولكن بشروا الصديقين بالخير لأنهم سيتمتعون بثواب أعمالهم"]]}, {"l": "Isa 3:11", "n": "", "vs": [[11, "أما الشرير فويل له وبئس المصير لأنه يجازى على ما جنته يداه"]]}, {"l": "Isa 65:13", "n": "", "vs": [[13, "لذلك هكذا يقول السيد الرب: ها عبيدي يأكلون وأنتم تجوعون، ويشربون وأنتم تظمأون، ويفرحون وأنتم تخزون،"]]}, {"l": "Isa 65:14", "n": "", "vs": [[14, "ويترنمون في غبطة القلب وأنتم تعولون من أسى القلب، وتولولون من انكسار الروح،"]]}, {"l": "Isa 65:20-24", "n": "", "vs": [[20, "ولا يكون فيها بعد طفل لا يعيش سوى أيام قلائل، أو شيخ لا يستوفي أيامه. ومن يموت ابن مئة سنة يعتبر فتى، ومن لا يبلغها يكون ملعونا."], [21, "يغرس الناس كرومهم ويأكلون ثمارها، ويبنون بيوتهم ويقيمون فيها،"], [22, "لا يبنون ليأتي آخر فيسكن فيها، ولا يغرسون كروما ليجنيها آخر، لأن أيام شعبي تكون مديدة كأيام الشجر، ويتمتع مختاري بعمل أيديهم."], [23, "فهم لن يتعبوا باطلا ولا تنجب نساؤهم أولادا للرعب، لأنهم يكونون ذرية مباركي الرب، ويتبارك أولادهم معهم."], [24, "وقبل أن يدعوا أستجيب، وفيما هم يتكلمون أنصت إليهم."]]}, {"l": "Mat 25:34", "n": "", "vs": [[34, "ثم يقول الملك للذين عن يمينه: تعالوا يامن باركهم أبي، رثوا الملكوت الذي أعد لكم منذ إنشاء العالم:"]]}, {"l": "Mat 25:41-46", "n": "", "vs": [[41, "ثم يقول للذين عن يساره: ابتعدوا عني ياملاعين إلى النار الأبدية المعدة لإبليس وأعوانه!"], [42, "لأني جعت فلم تطعموني، وعطشت فلم تسقوني،"], [43, "كنت غريبا فلم تأووني، عريانا فلم تكسوني، مريضا وسجينا فلم تزوروني!"], [44, "فيرد هؤلاء أيضا قائلين: يارب، متى رأيناك جائعا أو عطشانا أو غريبا أو عريانا أو مريضا أو سجينا، ولم نخدمك؟"], [45, "فيجيبهم: الحق أقول لكم: بما أنكم لم تفعلوا ذلك بأحد إخوتي هؤلاء الصغار، فبي لم تفعلوا!"], [46, "فيذهب هؤلاء إلى العقاب الأبدي، والأبرار إلى الحياة الأبدية! »"]]}, {"l": "Luk 1:50", "n": "", "vs": [[50, "ورحمته للذين يتقونه جيلا بعد جيل."]]}], "kwAr": "يكون خير", "noteAr": ""}, {"kw": "fear before", "raw": "Ecc_3:14; 1Ch_16:30; Psa_96:9", "note": "", "refs": [{"l": "Ecc 3:14", "n": "", "vs": [[14, "وعلمت أن كل ما يفعله الله يخلد إلى الأبد، لا يضاف عليه شيء أو ينقص منه. وقد أجراه الله ليتقيه الناس."]]}, {"l": "1Ch 16:30", "n": "", "vs": [[30, "ارتعدي أمامه ياكل الأرض، هوذا الأرض قد استقرت ثابتة."]]}, {"l": "Psa 96:9", "n": "", "vs": [[9, "اسجدوا للرب بزينة مقدسة، ارتعدوا أمامه ياجميع ساكني الأرض."]]}], "kwAr": "يخشعون في حضرته", "noteAr": ""}], "arS": [["ومع", ["H1571"]], [" ", []], ["أن", ["H3588"]], [" ", []], ["الخاطيء", ["H2398"]], [" ", []], ["يرتكب", ["H6213"]], [" ", []], ["الشر", ["H7451"]], [" ", []], ["مئة", ["H3967"]], [" مرة ", []], ["وتطول", ["H748"]], [" أيامه، إلا ", []], ["أنني", ["H589"]], [" ", []], ["أعلم", ["H3045"]], [" أنه ", []], ["يكون", ["H1961"]], [" ", []], ["خير", ["H2896"]], [" ", []], ["لمتقي", ["H3372", "H3373"]], [" ", []], ["الله", ["H430"]], [" ", []], ["الذين", ["H834"]], [" يخشعون في ", []], ["حضرته", ["H6440"]], [".", []]]}, {"c": 8, "v": 13, "text": "أما الأشرار الذين لا يتقون الله فلن ينالوا خيرا، ولن تطول أيامهم التي تشبه الظل، لأنهم لا يخشون الله .", "groups": [{"kw": "it shall", "raw": "Job_18:5, Job_20:5, Job_21:30; Psa_11:5; Isa_57:21; Mal_3:18; Mat_13:49, Mat_13:50; Joh_5:29", "note": "", "refs": [{"l": "Job 18:5", "n": "", "vs": [[5, "أجل! إن نور الأشرار ينطفيء ولهيب نارهم لا يضيء."]]}, {"l": "Job 20:5", "n": "", "vs": [[5, "أن طرب الشرير إلى حين، وأن فرح الفاجر إلى لحظة؟"]]}, {"l": "Job 21:30", "n": "", "vs": [[30, "إن الشرير قد أفلت من يوم البوار، ونجا من العقاب في يوم الغضب."]]}, {"l": "Psa 11:5", "n": "", "vs": [[5, "يمتحن الرب الصديق، ولكن نفسه تمقت الشرير ومحب الظلم."]]}, {"l": "Isa 57:21", "n": "", "vs": [[21, "إذ ليس سلام للأشرار، قال إلهي."]]}, {"l": "Mal 3:18", "n": "", "vs": [[18, "فتشرعون ثانية في التمييز بين الصالح والطالح، بين من يعبد الله ومن لا يعبده»."]]}, {"l": "Mat 13:49", "n": "", "vs": [[49, "هكذا يحدث في نهاية الزمان: يأتي الملائكة فيخرجون الأشرار من بين الأبرار،"]]}, {"l": "Mat 13:50", "n": "", "vs": [[50, "ويطرحونهم في أتون النار، هناك يكون البكاء وصرير الأسنان."]]}, {"l": "Joh 5:29", "n": "", "vs": [[29, "فيخرجون منها: فالذين عملوا الصالحات يخرجون في القيامة المؤدية إلى الحياة، وأما الذين عملوا السيئات ففي القيامة المؤدية إلى الدينونة."]]}], "kwAr": "فلن ينالوا خيرا", "noteAr": ""}, {"kw": "neither", "raw": "Psa_55:23; Isa_30:13; 2Pe_2:3", "note": "", "refs": [{"l": "Psa 55:23", "n": "", "vs": [[23, "وأنت ياالله تطرح الأشرار إلى هوة الهلاك وتقصر أعمار سافكي الدماء والغشاشين. أما أنا فأتكل عليك."]]}, {"l": "Isa 30:13", "n": "", "vs": [[13, "لذلك يصبح هذا الذنب لكم كصدع ناتيء في سور عال مشرف على الانهيار الذي يحدث بغتة وفى لحظة"]]}, {"l": "2Pe 2:3", "n": "", "vs": [[3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}], "kwAr": "ولن تطول أيامهم", "noteAr": ""}, {"kw": "as a", "raw": "Ecc_6:12; Job_7:6, Job_7:7, Job_14:2; Psa_39:5, Psa_144:4; Jam_4:14", "note": "", "refs": [{"l": "Ecc 6:12", "n": "", "vs": [[12, "إذ من يدري ما هو خير للإنسان في الحيا ة التي يقضي فيها أياما قليلة باطلة كالظل؟ ومن يقدر أن يطلع الإنسان على ما سيحدث تحت الشمس من بعده؟"]]}, {"l": "Job 7:6", "n": "", "vs": [[6, "أيامي أسرع من وشيعة النساجين، تتلاشى من غير رجاء!"]]}, {"l": "Job 7:7", "n": "", "vs": [[7, "فاذكر ياالله أن حياتي ليست سوى نسمة، وأن عيني لن تعودا تريان الخير."]]}, {"l": "Job 14:2", "n": "", "vs": [[2, "يتفتح كالزهر ثم ينتثر، ويتوارى كالشبح فلا يبقى له أثر."]]}, {"l": "Psa 39:5", "n": "", "vs": [[5, "هوذا قد جعلت حياتي قصيرة، وعمري كلا شيء أمامك. كل إنسان حي ليس سوى نفخة!"]]}, {"l": "Psa 144:4", "n": "", "vs": [[4, "إنما الإنسان أشبه بنفخة. أيامه كظل عابر."]]}, {"l": "Jam 4:14", "n": "", "vs": [[14, "مهلا! فأنتم لا تعرفون ماذا يحدث غدا! وما هي حياتكم؟ إنها بخار، يظهر فترة قصيرة ثم يتلاشى!"]]}], "kwAr": "التي تشبه الظل", "noteAr": ""}], "arS": [["أما", ["H3808"]], [" ", []], ["الأشرار", ["H7563"]], [" ", []], ["الذين", ["H834"]], [" ", []], ["لا", ["H3808"]], [" ", []], ["يتقون", ["H3372"]], [" ", []], ["الله", ["H430"]], [" فلن ينالوا ", []], ["خيرا", ["H2896"]], ["، ولن ", []], ["تطول", ["H748"]], [" ", []], ["أيامهم", ["H3117"]], [" التي تشبه ", []], ["الظل", ["H6738"]], ["، لأنهم ", []], ["لا", ["H369"]], [" يخشون الله .", []]]}, {"c": 8, "v": 14, "text": "في الأرض يسود باطل: هناك صديقون ينالهم جزاء أعمال الأشرار، وأشرار يحظون بثواب أعمال الأبرار، فقلت: هذا أيضا باطل.", "groups": [{"kw": "a vanity", "raw": "Ecc_4:4, Ecc_4:8, Ecc_9:3, Ecc_10:5", "note": "", "refs": [{"l": "Ecc 4:4", "n": "", "vs": [[4, "وأدركت أيضا أن كل تعب الإنسان ومنجزاته، ناتجة عن حسده لقريبه. هذا أيضا باطل كملاحقة الريح."]]}, {"l": "Ecc 4:8", "n": "", "vs": [[8, "واحد وحيد، لا ثاني له. لا ابن ولا أخ. ولا نهاية لتعبه. عينه لا تشبع من الغنى، ولا يقول: لمن أكدح وأحرم نفسي من المسرات؟ هذا أيضا باطل وعناء شاق!"]]}, {"l": "Ecc 9:3", "n": "", "vs": [[3, "وأشر ما يجري تحت الشمس أن الجميع يلقون نفس المصير، وأن قلوب بني البشر مفعمة بالشر، وفي حياتهم تمتليء صدورهم بالحماقة، ثم يموتون!"]]}, {"l": "Ecc 10:5", "n": "", "vs": [[5, "رأيت شرا تحت السماء هو: كالسهو الصادر عن السلطان."]]}], "kwAr": "باطل", "noteAr": ""}, {"kw": "there be just", "raw": "Ecc_2:14, Ecc_7:15, Ecc_9:1-3; Job_9:22-24, 21:17-34, Job_24:21-25; Psa_73:13, Psa_73:14; Mal_3:15", "note": "", "refs": [{"l": "Ecc 2:14", "n": "", "vs": [[14, "لأن عيني الحكيم في رأسه، أما الجاهل فيمشي في الظلمة. لكنني أدركت أنهما يلاقيان مصيرا واحدا."]]}, {"l": "Ecc 7:15", "n": "", "vs": [[15, "لقد شاهدت هذه جميعها في أيام أباطيلي: رب صديق يهلك في بره، ومنافق تطول أيامه في شره."]]}, {"l": "Ecc 9:1-3", "n": "", "vs": [[1, "هذا كله ادخرته في قلبي واختبرته: أن الأبرار والحكماء، وما يصدر عنهم من أعمال، في يد الله، ولا أحد يدري ما ينتظره، حبا كان أم بغضا،"], [2, "إذ الجميع معرضون لنفس المصير، الصالحون والطالحون، الأخيار والأشرار، الطاهر والنجس، المقرب للذبائح وغير المقرب. فالصالح كالطالح سيان، والحالف كمن يخشى الحلف."], [3, "وأشر ما يجري تحت الشمس أن الجميع يلقون نفس المصير، وأن قلوب بني البشر مفعمة بالشر، وفي حياتهم تمتليء صدورهم بالحماقة، ثم يموتون!"]]}, {"l": "Job 9:22-24", "n": "", "vs": [[22, "ولكن الأمر سيان، لذلك قلت: إنه يفني الكامل والشرير على حد سواء!"], [23, "عندما تؤدي ضربات السوط إلى الموت المفاجيء يسخر من بؤس الأبرياء"], [24, "فقد عهد بالأرض إلى يد الشرير، وأعمى عيون قضاتها. إن لم يكن هو الفاعل، إذا من هو؟"]]}, {"l": "Job 21:17-34", "n": "", "vs": [[17, "كم مرة ينطفيء مصباح الأشرار؟ وكم مرة تتوالى عليهم النكبات، إذ يقسم الله لهم نصيبا في غضبه؟"], [18, "يصبحون كالتبن في وجه الريح، وكالعصافة التي تطوح بها الزوبعة."], [19, "أنتم تقولون: إن الله يدخر إثم الشرير لأبنائه، لا! إنه ينزل العقاب بالأثيم نفسه، فيعلم."], [20, "فليشهد هلاكه بعينيه، وليجرع غصص غضب القدير."], [21, "إذ ما بغيته من بيته بعد فنائه، وقد بتر عدد شهور حياته؟"], [22, "أهناك من يلقن الله علما، وهو الذي يدين المتشامخين؟"], [23, "قد يموت المرء في وفرة رغده، وهو ينعم بالدعة والطمأنينة،"], [24, "والعافية تكسو جنبيه، ومخ عظامه طريء."], [25, "وقد يموت آخر بمرارة نفس ولم يذق خيرا"], [26, "غير أن كليهما يواريهما التراب ويغشاهما الدود."], [27, "انظروا، أنا مطلع على أفكاركم وما تتهمونني به جورا،"], [28, "لأنكم تقولون: أين هو منزل الرجل العظيم، وأين هي خيام الأشرار المقيمين فيها؟"], [29, "هلا سألتم عابري السبيل؟ ألا تكترثون لشهادتهم؟"], [30, "إن الشرير قد أفلت من يوم البوار، ونجا من العقاب في يوم الغضب."], [31, "فمن يواجهه بسوء أعماله، ومن يدينه على رداءة تصرفاته؟"], [32, "عندما يوارى في قبره يقوم حارس على ضريحه."], [33, "تطيب له تربة الوادي، ويمشي خلفه جمهور غفير، والذين يتقدمونه لا يحصى لهم عدد."], [34, "فكيف، بعد هذا، تعزونني بلغو الكلام؟ لم يبق من أجوبتكم إلا كل ما هو باطل»."]]}, {"l": "Job 24:21-25", "n": "", "vs": [[21, "يسيئون إلى العاقر التي لم تلد، ولا يحسنون إلى الأرملة."], [22, "الله في جلاله يدمر القوي ويميته."], [23, "يمنحهم طمأنينة تركن إليها قلوبهم إلى حين، لكن عينيه تراقبان طرقهم."], [24, "تشامخوا للحظة ثم تلاشوا، انحطوا وجمعوا كالأشياء الأخرى، بل حصدوا كرؤوس السنابل؛"], [25, "وإلا، من يقدر أن يكذبني ويجعل كلامي كالعدم؟»"]]}, {"l": "Psa 73:13", "n": "", "vs": [[13, "باطلا قد طهرت قلبي وغسلت يدي بالنقاوة."]]}, {"l": "Psa 73:14", "n": "", "vs": [[14, "لقد جعلتني يارب مصابا طول النهار، وأوقعت علي عقابك كل صباح."]]}, {"l": "Mal 3:15", "n": "", "vs": [[15, "وها نحن الآن نغبط المستكبرين، ونرى فاعلي الشر يزدهرون، بل إنهم تحدوا الله ونجوا."]]}], "kwAr": "هناك صديقون", "noteAr": ""}], "arS": [["في", ["H413"]], [" ", []], ["الأرض", ["H776"]], [" يسود ", []], ["باطل", ["H1892"]], [": ", []], ["هناك", ["H3426"]], [" ", []], ["صديقون", ["H6662"]], [" ", []], ["ينالهم", ["H5060"]], [" جزاء ", []], ["أعمال", ["H4639", "H6213"]], [" ", []], ["الأشرار", ["H7563"]], ["، ", []], ["وأشرار", ["H7563"]], [" ", []], ["يحظون", ["H5060"]], [" بثواب ", []], ["أعمال", ["H4639"]], [" ", []], ["الأبرار", ["H6662"]], ["، ", []], ["فقلت", ["H559"]], [": ", []], ["هذا", ["H2088"]], [" ", []], ["أيضا", ["H1571"]], [" ", []], ["باطل", ["H1892"]], [".", []]]}, {"c": 8, "v": 15, "text": "فأطريت المسرة لأنه ليس للمرء خير تحت الشمس أفضل من أن يأكل ويشرب ويمتع نفسه، فهذا ما يبقى له من عنائه مدة أيام حياته التي أنعم بها الله عليه تحت الشمس.", "groups": [{"kw": "Then I", "raw": "Some consider this as the cavil of an infidel objector, equivalent to the Epicurean maxim, Ede, bibe, lude; post mortem nulla voluptas, Eat, drink, and play; there is no pleasure after death. But it may be regarded as a recommendation of a moderate use of worldly things, with a cheerful and contented mind; which may justly be considered as the greatest advantage which can be made of all below the sun, and amidst all changes, such a frame of mind, if the result of right principles, may and ought to be preserved; and it will be the recompence and solace of all our labours and toils. Ecc_2:24, Ecc_3:12, Ecc_3:13, Ecc_3:22, Ecc_5:18, Ecc_9:7-9; 1Ti_4:3, 1Ti_4:4, 1Ti_6:17", "note": "Some consider this as the cavil of an infidel objector, equivalent to the Epicurean maxim, Ede, bibe, lude; post mortem nulla voluptas, Eat, drink, and play; there is no pleasure after death. But it may be regarded as a recommendation of a moderate use of worldly things, with a cheerful and contented mind; which may justly be considered as the greatest advantage which can be made of all below the sun, and amidst all changes, such a frame of mind, if the result of right principles, may and ought to be preserved; and it will be the recompence and solace of all our labours and toils. Ecc_2:24, Ecc_3:12, Ecc_3:13, Ecc_3:22, Ecc_5:18, Ecc_9:7-9; 1Ti_4:3, 1Ti_4:4, 1Ti_6:17", "refs": [{"l": "Ecc 2:24", "n": "", "vs": [[24, "فليس أفضل للإنسان من أن يأكل ويشرب ويتمتع بتعب يديه. وهذا أيضا، كما أرى، هو من يد الله."]]}, {"l": "Ecc 3:12", "n": "", "vs": [[12, "فأيقنت أنه ليس أفضل لهم من أن يفرحوا ويمتعوا أنفسهم وهم مازالوا على قيد الحياة."]]}, {"l": "Ecc 3:13", "n": "", "vs": [[13, "إن من نعم الله على الإنسان أن يأكل ويشرب ويستمتع بما يجنيه من كده."]]}, {"l": "Ecc 3:22", "n": "", "vs": [[22, "فرأيت أنه ليس أفضل من أن يستمتع الإنسان بكده، لأن هذا نصيبه، لأنه من يرجعه ليرى ما سيجري من بعده؟"]]}, {"l": "Ecc 5:18", "n": "", "vs": [[18, "فتأمل ما وجدت: من الأفضل والأليق أن يأكل الإنسان ويشرب ويستمتع بما تكبده من عناء تحت الشمس طوال أيام حياته القليلة التي وهبها الله له، لأن هذا هو حظه."]]}, {"l": "Ecc 9:7-9", "n": "", "vs": [[7, "فامض وتمتع بأكل طعامك، واشرب خمرك بقلب منشرح، لأن الرب قد رضي الآن عن أعمالك."], [8, "لتكن ثيابك دائما بيضاء، ولا يعوزن رأسك الطيب."], [9, "تمتع طوال أيام حياتك الباطلة التي أعطاك إياها الرب تحت الشمس مع المرأة التي أحببتها، لأن ذلك هو حظك من الحياة ومن عناء تعبك الذي تكابده تحت الشمس."]]}, {"l": "1Ti 4:3", "n": "", "vs": [[3, "يحرمون الزواج، ويأمرون بالامتناع عن أطعمة خلقها الله ليتناولها المؤمنون وعارفو الحق شاكرين."]]}, {"l": "1Ti 4:4", "n": "", "vs": [[4, "فإن كل ما خلقه الله جيد، ولا شيء منه يرفض إذا تناوله الإنسان شاكرا؛"]]}, {"l": "1Ti 6:17", "n": "", "vs": [[17, "أوص أغنياء هذا الزمان بأن لا يتكبروا، ولا يتكلوا على الغنى غير الثابت، بل على الله الذي يمنحنا كل شيء بوفرة لنتمتع به،"]]}], "kwAr": "فأطريت المسرة", "noteAr": "يعدّ بعضهم هذا اعتراض منكر متشكك، يعادل القول الأبيقوري: كل واشرب والعب، فلا لذة بعد الموت. لكن يمكن عدّه توصية بالاستعمال المعتدل لأمور الدنيا بذهن مرح وقانع؛ وهذا يمكن أن يُعدّ بحق أعظم ما يمكن اكتسابه من كل ما تحت الشمس، وهذه الحال الذهنية، إن صدرت عن مبادئ سليمة، قد وينبغي أن تُحفظ وسط كل التغيرات، وستكون مكافأة كل أتعابنا وعزاءها. انظر جا 2: 24؛ 3: 12، 13، 22؛ 5: 18؛ 9: 7-9؛ 1تي 4: 3، 4؛ 6: 17"}], "arS": [["فأطريت", ["H7623"]], [" ", []], ["المسرة", ["H8057"]], [" ", []], ["لأنه", ["H3588"]], [" ", []], ["ليس", ["H369"]], [" ", []], ["للمرء", ["H120"]], [" ", []], ["خير", ["H2896"]], [" ", []], ["تحت", ["H8478"]], [" ", []], ["الشمس", ["H8121"]], [" أفضل ", []], ["من", ["H834"]], [" أن ", []], ["يأكل", ["H398"]], [" ", []], ["ويشرب", ["H8354"]], [" ", []], ["ويمتع", ["H8055"]], [" نفسه، فهذا ", []], ["ما", ["H834"]], [" ", []], ["يبقى", ["H3867"]], [" له من ", []], ["عنائه", ["H5999"]], [" مدة ", []], ["أيام", ["H3117"]], [" ", []], ["حياته", ["H2416"]], [" ", []], ["التي", ["H1931"]], [" ", []], ["أنعم", ["H5414"]], [" بها ", []], ["الله", ["H430"]], [" عليه ", []], ["تحت", ["H8478"]], [" ", []], ["الشمس", ["H8121"]], [".", []]]}, {"c": 8, "v": 16, "text": "وعندما جعلت قلبي يعزم على معرفة الحكمة، والتأمل في معاناة الإنسان التي يقاسيها على الأرض، وكيف لا تذوق عيناه النوم ليلا ونهارا،", "groups": [{"kw": "When I", "raw": "Solomon here records the result of his perplexing inquiries into the affairs of men, and the purposes, providence, and works of God. And when he examined with great attention and diligence into the works of God, he found he could neither comprehend nor explain them; and was persuaded, that no application or capacity would enable a man to fathom the depth of the Divine dispensations in this lower world. How vain, then, are all cavils against Divine providence; when we can neither understand, nor comprehend it! Ecc_8:9, Ecc_8:7 Ecc_7:25", "note": "Solomon here records the result of his perplexing inquiries into the affairs of men, and the purposes, providence, and works of God. And when he examined with great attention and diligence into the works of God, he found he could neither comprehend nor explain them; and was persuaded, that no application or capacity would enable a man to fathom the depth of the Divine dispensations in this lower world. How vain, then, are all cavils against Divine providence; when we can neither understand, nor comprehend it! Ecc_8:9, Ecc_8:7 Ecc_7:25", "refs": [{"l": "Ecc 8:9", "n": "", "vs": [[9, "هذا كله رأيته عندما تأمل قلبي في كل عمل يعمل تحت الشمس، وقتما يتسلط إنسان على إنسان ليؤذيه."]]}, {"l": "Ecc 8:7", "n": "", "vs": [[7, "لأنه لا يعرف ما يضمره الغد، إذ من يخبره عما تكون عليه الأحداث؟"]]}, {"l": "Ecc 7:25", "n": "", "vs": [[25, "فتفحصت قلبي لأعلم وأبحث وأنشد الحكمة وألتمس جواهر الأشياء وأعرف جهالة الشر، وحماقة الجنون."]]}], "kwAr": "جعلت قلبي يعزم", "noteAr": "يسجل سليمان هنا نتيجة أبحاثه الحائرة في شؤون البشر وقصد الله وعنايته وأعماله. فلما فحص أعمال الله بانتباه واجتهاد كبيرين وجد أنه لا يستطيع أن يفهمها ولا أن يفسرها، واقتنع بأنه لا اجتهاد ولا قدرة تمكّن إنسانا من سبر أغوار التدابير الإلهية في هذا العالم السفلي. فما أبطل كل المطاعن في العناية الإلهية، ونحن لا نفهمها ولا ندركها! انظر جا 8: 9، 7؛ 7: 25"}, {"kw": "there is that", "raw": "Ecc_2:23, Ecc_4:8, Ecc_5:12; Gen_31:40; Psa_127:2", "note": "", "refs": [{"l": "Ecc 2:23", "n": "", "vs": [[23, "كل أيام حياته مفعمة بالمشقة، وعمله عناء. حتى في الليل لا يستريح قلبه. وهذا أيضا باطل."]]}, {"l": "Ecc 4:8", "n": "", "vs": [[8, "واحد وحيد، لا ثاني له. لا ابن ولا أخ. ولا نهاية لتعبه. عينه لا تشبع من الغنى، ولا يقول: لمن أكدح وأحرم نفسي من المسرات؟ هذا أيضا باطل وعناء شاق!"]]}, {"l": "Ecc 5:12", "n": "", "vs": [[12, "نوم العامل هنيء سواء أكثر من الطعام أم أقل، أما الغني فوفرة غناه تجعله قلقا أرقا!"]]}, {"l": "Gen 31:40", "n": "", "vs": [[40, "كنت في النهار يأكلني الحر وفي الليل الجليد، وفارق نومي عيني."]]}, {"l": "Psa 127:2", "n": "", "vs": [[2, "باطلا تكدون من الفجر المبكر وإلى وقت متأخر من الليل في سبيل لقمة العيش، فإن الرب يسد حاجة أحبائه حتى وهم نيام."]]}], "kwAr": "لا تذوق عيناه النوم", "noteAr": ""}], "arS": [["وعندما", ["H3588"]], [" ", []], ["جعلت", ["H5414"]], [" ", []], ["قلبي", ["H3820"]], [" يعزم ", []], ["على", ["H5921"]], [" ", []], ["معرفة", ["H3045"]], [" ", []], ["الحكمة", ["H2451"]], ["، ", []], ["والتأمل", ["H7200"]], [" في ", []], ["معاناة", ["H6045"]], [" الإنسان ", []], ["التي", ["H834"]], [" ", []], ["يقاسيها", ["H6213"]], [" على ", []], ["الأرض", ["H776"]], ["، ", []], ["وكيف", ["H834"]], [" ", []], ["لا", ["H369"]], [" تذوق ", []], ["عيناه", ["H5869"]], [" ", []], ["النوم", ["H8142"]], [" ", []], ["ليلا", ["H3915"]], [" ", []], ["ونهارا", ["H3117"]], ["،", []]]}, {"c": 8, "v": 17, "text": "رأيت أعمال الله كلها، وعجز الإنسان عن إدراك الأعمال التي تم إنجازها تحت الشمس. ومهما جد في سعيه لمعرفتها فلن يدركها. وحتى إن ادعى الحكيم معرفتها فإنه حقا لن يستطيع أن يجدها.", "groups": [{"kw": "that a man", "raw": "Ecc_3:11, Ecc_7:23, Ecc_7:24, Ecc_11:5; Job_5:9, Job_11:7-9; Psa_40:5, Psa_73:16, Psa_104:24; Pro_30:3, Pro_30:4; Isa_40:28; Rom_11:33", "note": "", "refs": [{"l": "Ecc 3:11", "n": "", "vs": [[11, "إذ صنع كل شيء حسنا في حينه وغرس الأبدية في قلوب البشر، ومع ذلك لم يدركوا أعمال الله من البداية إلى النهاية."]]}, {"l": "Ecc 7:23", "n": "", "vs": [[23, "كل ذلك اختبرته بالحكمة وقلت: سأكون حكيما، ولكنها كانت بعيدة عني."]]}, {"l": "Ecc 7:24", "n": "", "vs": [[24, "ما هو بعيد، بعيد جدا، وما هو عميق، عميق جدا. ومن لي بمن يكتشفه؟"]]}, {"l": "Ecc 11:5", "n": "", "vs": [[5, "كما تجهل اتجاه مسار الريح، أو كيف تتكون عظام الجنين في رحم الأم، كذلك لا تدرك أعمال الله التي يجريها كلها."]]}, {"l": "Job 5:9", "n": "", "vs": [[9, "هو صانع عجائب لا تفحص وعظائم لا تحصى."]]}, {"l": "Job 11:7-9", "n": "", "vs": [[7, "ألعلك تدرك أعماق الله، أم تبلغ أقصى قوة القدير؟"], [8, "هو أسمى من السماوات، فماذا يمكنك أن تفعل؟ وهو أبعد غورا من الهاوية، فماذا تعلم؟"], [9, "هو أطول من الأرض وأعرض من البحر."]]}, {"l": "Psa 40:5", "n": "", "vs": [[5, "أيها الرب إلهي، ما أكثر أعمالك العجيبة. إن تحدثت عن خططك الرائعة لنا فلن أقدر أن أحصيها. زادت عن أن تعد."]]}, {"l": "Psa 73:16", "n": "", "vs": [[16, "وعندما نويت أن أفهم هذا، تعذر الأمر علي،"]]}, {"l": "Psa 104:24", "n": "", "vs": [[24, "يارب ما أعظم أعمالك، كلها صنعت بحكمة، فامتلأت الأرض من غناك."]]}, {"l": "Pro 30:3", "n": "", "vs": [[3, "لم أتلقن الحكمة، ولا أملك معرفة القدوس."]]}, {"l": "Pro 30:4", "n": "", "vs": [[4, "من ارتقى إلى السماء ثم هبط منها؟ ومن جمع الريح في حفنتيه؟ من صر المياه في ثوب؟ من أرسى جميع أطراف الأرض؟ ما اسمه وما اسم ابنه؟ أخبرني إن كنت تعلم."]]}, {"l": "Isa 40:28", "n": "", "vs": [[28, "ألم تعلموا؟ ألم تسمعوا؟ إن الرب هو إله سرمدي وخالق أقاصي الأرض. لا يهن ولا يخور، وفهمه لا يستقصى."]]}, {"l": "Rom 11:33", "n": "", "vs": [[33, "فما أعمق غنى الله وحكمته وعلمه! ما أبعد أحكامه عن الفحص وطرقه عن التتبع !"]]}], "kwAr": "عجز الإنسان", "noteAr": ""}], "arS": [["رأيت", ["H7200"]], [" ", []], ["أعمال", ["H4639"]], [" ", []], ["الله", ["H430"]], [" ", []], ["كلها", ["H3605"]], ["، ", []], ["وعجز", ["H3201"]], [" ", []], ["الإنسان", ["H120"]], [" عن ", []], ["إدراك", ["H4672"]], [" ", []], ["الأعمال", ["H4639"]], [" ", []], ["التي", ["H834"]], [" تم ", []], ["إنجازها", ["H6213"]], [" ", []], ["تحت", ["H8478"]], [" ", []], ["الشمس", ["H8121"]], [". ومهما جد في ", []], ["سعيه", ["H5998"]], [" لمعرفتها ", []], ["فلن", ["H3808"]], [" يدركها. ", []], ["وحتى", ["H1571"]], [" ", []], ["إن", ["H3588"]], [" ", []], ["ادعى", ["H559"]], [" ", []], ["الحكيم", ["H2450"]], [" ", []], ["معرفتها", ["H3045"]], [" فإنه ", []], ["حقا", ["H3808", "H518"]], [" ", []], ["لن", ["H3808"]], [" ", []], ["يستطيع", ["H3201"]], [" أن ", []], ["يجدها", ["H4672"]], [".", []]]}, {"c": 9, "v": 1, "text": "هذا كله ادخرته في قلبي واختبرته: أن الأبرار والحكماء، وما يصدر عنهم من أعمال، في يد الله، ولا أحد يدري ما ينتظره، حبا كان أم بغضا،", "groups": [{"kw": "considered in my heart", "raw": "Heb. gave, or set to my heart, Ecc_1:17, Ecc_7:25, Ecc_8:16, Ecc_12:9, Ecc_12:10", "note": "Heb. gave, or set to my heart, Ecc_1:17, Ecc_7:25, Ecc_8:16, Ecc_12:9, Ecc_12:10", "refs": [{"l": "Ecc 1:17", "n": "", "vs": [[17, "ثم وجهت فكري نحو معرفة الحكمة والجنون والحماقة، فأدركت أن هذا ليس سوى ملاحقة الريح أيضا."]]}, {"l": "Ecc 7:25", "n": "", "vs": [[25, "فتفحصت قلبي لأعلم وأبحث وأنشد الحكمة وألتمس جواهر الأشياء وأعرف جهالة الشر، وحماقة الجنون."]]}, {"l": "Ecc 8:16", "n": "", "vs": [[16, "وعندما جعلت قلبي يعزم على معرفة الحكمة، والتأمل في معاناة الإنسان التي يقاسيها على الأرض، وكيف لا تذوق عيناه النوم ليلا ونهارا،"]]}, {"l": "Ecc 12:9", "n": "", "vs": [[9, "وفضلا عن كون الجامعة حكيما، فإنه علم الناس المعرفة أيضا، وقوم وبحث ونظم أمثالا كثيرة."]]}, {"l": "Ecc 12:10", "n": "", "vs": [[10, "إذ سعى الجامعة لانتقاء ألفاظ مبهجة، وكتب باستقامة كلمات الحق."]]}], "kwAr": "ادخرته في قلبي", "noteAr": "بالعبرانية: وضعتُ في قلبي. انظر جا 1: 17؛ 7: 25؛ 8: 16؛ 12: 9، 10"}, {"kw": "that the", "raw": "Ecc_8:14; Deu_33:3; 1Sa_2:9; 2Sa_15:25, 2Sa_15:26; Job_5:8; Psa_10:14, Psa_31:5; Psa_37:5, Psa_37:6; Pro_16:3; Isa_26:12, Isa_49:1-4; Jer_1:18, Jer_1:19; Joh_10:27-30; 1Co_3:5-15; 2Ti_1:12; 1Pe_1:5", "note": "", "refs": [{"l": "Ecc 8:14", "n": "", "vs": [[14, "في الأرض يسود باطل: هناك صديقون ينالهم جزاء أعمال الأشرار، وأشرار يحظون بثواب أعمال الأبرار، فقلت: هذا أيضا باطل."]]}, {"l": "Deu 33:3", "n": "", "vs": [[3, "حقا إنك أنت الذي أحببت الشعب؛ وجميع القديسين في يدك، ساجدون عند قدميك يتلقون منك أقوالك،"]]}, {"l": "1Sa 2:9", "n": "", "vs": [[9, "هو يحفظ أقدام أتقيائه، أما الأشرار فينطوون في الظلام، لأنه ليس بالقوة يتغلب الإنسان."]]}, {"l": "2Sa 15:25", "n": "", "vs": [[25, "وقال الملك لصادوق: «أرجع تابوت الله إلى المدينة، فإنني إن حظيت برضى الرب فإنه يعيدني فأرى التابوت ومسكنه."]]}, {"l": "2Sa 15:26", "n": "", "vs": [[26, "وإن لم أستحوذ على رضاه وقال: «إني لم أسر بك، فليفعل بي ما يطيب له»."]]}, {"l": "Job 5:8", "n": "", "vs": [[8, "لو كنت في مكانك لاتجهت إلى الله وعرضت أمري عليه."]]}, {"l": "Psa 10:14", "n": "", "vs": [[14, "ولكنك قد رأيت. عاينت ما أصاب المساكين من المشقة والغم، فتجازي الشرير بيدك. يسلم إليك المسكين أمره، فأنت دائما معين اليتيم."]]}, {"l": "Psa 31:5", "n": "", "vs": [[5, "في يدك أستودع روحي. فديتني أيها الرب إله الحق."]]}, {"l": "Psa 37:5", "n": "", "vs": [[5, "سلم للرب طريقك وتوكل عليه فيتولى أمرك."]]}, {"l": "Psa 37:6", "n": "", "vs": [[6, "يظهر براءتك كالنور، وحقك ظاهرا كشمس الظهيرة."]]}, {"l": "Pro 16:3", "n": "", "vs": [[3, "اطرح على الرب أعمالك فتثبت مقاصدك."]]}, {"l": "Isa 26:12", "n": "", "vs": [[12, "يارب أنت تجعل سلاما لنا لأنك صنعت لنا كل أعمالنا."]]}, {"l": "Isa 49:1-4", "n": "", "vs": [[1, "أنصتي إلي أيتها الجزائر، واصغوا ياشعوب البلاد البعيدة: قد دعاني الرب وأنا مازلت جنينا، وذكر اسمي وأنا ما برحت في رحم أمي."], [2, "جعل فمي كسيف قاطع، وواراني في ظل يديه؛ صنع مني سهما مسنونا وأخفاني في جعبته،"], [3, "وقال لي: «أنت عبدي إسرائيل الذي به أتمجد"], [4, "ولكنني أجبت: لقد تعبت باطلا. وأفنيت قوتي سدى وعبثا. غير أن حقي محفوظ عند الرب، ومكافأتي عند إلهي."]]}, {"l": "Jer 1:18", "n": "", "vs": [[18, "انظر ها أنا قد جعلتك اليوم قويا كمدينة حصينة، وكعمود من حديد، وكأسوار من نحاس، لتجابه كل أهل الأرض، وملوك يهوذا وأمراءها وكهنتها وشعب البلاد،"]]}, {"l": "Jer 1:19", "n": "", "vs": [[19, "فيحاربونك ولكن لا يقهرونك، لأني أنا معك لأنقذك يقول الرب»."]]}, {"l": "Joh 10:27-30", "n": "", "vs": [[27, "فخرافي تصغي لصوتي، وأنا أعرفها وهي تتبعني،"], [28, "وأعطيها حياة أبدية، فلا تهلك إلى الأبد، ولا ينتزعها أحد من يدي."], [29, "إن الآب الذي أعطاني إياها هو أعظم من الجميع، ولا يقدر أحد أن ينتزع من يد الآب شيئا."], [30, "أنا والآب واحد!»"]]}, {"l": "1Co 3:5-15", "n": "", "vs": [[5, "فمن هو بولس؟ ومن هو أبلوس؟ إنهما فقط خادمان آمنتم على أيديهما، وكما أنعم الرب على كل منهما."], [6, "أنا غرست وأبلوس سقى؛ ولكن الله أنمى."], [7, "فليس الغارس شيئا ولا الساقي، بل الله الذي يعطي النمو."], [8, "فالغارس والساقي سواء. إلا أن كلا منهما سينال أجرته بالنسبة إلى تعبه."], [9, "فإننا نحن جميعا عاملون معا عند الله، وأنتم حقل الله وبناء الله."], [10, "وبحسب نعمة الله الموهوبة لي، وضعت الأساس كما يفعل البناء الماهر، وغيري يبني عليه. ولكن، لينتبه كل واحد كيف يبني عليه."], [11, "فليس ممكنا أن يضع أحد أساسا آخر بالإضافة إلى الأساس الموضوع، وهو يسوع المسيح."], [12, "فإن بنى أحد على هذا الأساس ذهبا وفضة وحجارة كريمة، أو خشبا وعشبا وقشا،"], [13, "فعمل كل واحد سينكشف علنا إذ يظهره ذلك اليوم الذي سيعلن في نار، وسوف تمتحن النار قيمة عمل كل واحد."], [14, "فمن بقي عمله الذي بناه على الأساس، ينال أجرا."], [15, "ومن احترق عمله، يخسر، إلا أنه هو سيخلص؛ ولكن كمن يمر في النار."]]}, {"l": "2Ti 1:12", "n": "", "vs": [[12, "من أجل ذلك أيضا أقاسي الآن هذه الآلام، ولكني لست أخجل، لأنني أعرف من أنا مؤمن به، ولي تمام الثقة بأنه قادر أن يحفظ لي الأمانة التي أودعتها عنده سالمة إلى ذلك اليوم."]]}, {"l": "1Pe 1:5", "n": "", "vs": [[5, "محفوظا لكم في السماوات. فإنكم محفوظون بقدرة الله العاملة من خلال إيمانكم، إلى أن تفوزوا بالخلاص النهائي المعد لكم والذي سوف يتجلى في الزمان الأخير."]]}], "kwAr": "الأبرار والحكماء", "noteAr": ""}, {"kw": "no man", "raw": "Ecc_7:15; Psa_73:3, Psa_73:11-13; Mal_3:15-18", "note": "", "refs": [{"l": "Ecc 7:15", "n": "", "vs": [[15, "لقد شاهدت هذه جميعها في أيام أباطيلي: رب صديق يهلك في بره، ومنافق تطول أيامه في شره."]]}, {"l": "Psa 73:3", "n": "", "vs": [[3, "لأني حسدت المتكبرين، إذ شاهدت نجاح الأشرار."]]}, {"l": "Psa 73:11-13", "n": "", "vs": [[11, "أما هم فيقولون: كيف يعلم الله، وهل يدري العلي بما يحدث؟"], [12, "ها هم الأشرار المفلحون في العالم يزدادون ثروة."], [13, "باطلا قد طهرت قلبي وغسلت يدي بالنقاوة."]]}, {"l": "Mal 3:15-18", "n": "", "vs": [[15, "وها نحن الآن نغبط المستكبرين، ونرى فاعلي الشر يزدهرون، بل إنهم تحدوا الله ونجوا."], [16, "ثم حدث خائفو الرب بعضهم بعضا. فأصغى الرب إلى كلامهم وسمعهم، فتم تدوين أسماء متقي الرب والمتأملين باسمه أمامه في كتاب تذكرة، ورد فيه:"], [17, "سيكونون لي، يقول الرب القدير، في اليوم الذي أصنع فيه نفائسي، وأحافظ عليهم كما يحافظ الوالد على ابنه الذي يخدمه."], [18, "فتشرعون ثانية في التمييز بين الصالح والطالح، بين من يعبد الله ومن لا يعبده»."]]}], "kwAr": "ولا أحد يدري", "noteAr": ""}], "arS": [["هذا", ["H2088"]], [" ", []], ["كله", ["H3605"]], [" ", []], ["ادخرته", ["H5414"]], [" ", []], ["في", ["H413"]], [" ", []], ["قلبي", ["H3820"]], [" ", []], ["واختبرته", ["H952"]], [": ", []], ["أن", ["H3588"]], [" ", []], ["الأبرار", ["H6662"]], [" ", []], ["والحكماء", ["H2450"]], ["، ", []], ["وما", ["H834"]], [" يصدر عنهم من ", []], ["أعمال", ["H5652"]], ["، ", []], ["في", ["H3027"]], [" يد ", []], ["الله", ["H430"]], ["، ", []], ["ولا", ["H369"]], [" ", []], ["أحد", ["H120"]], [" ", []], ["يدري", ["H3045"]], [" ما ينتظره، ", []], ["حبا", ["H160"]], [" كان أم ", []], ["بغضا", ["H8135"]], ["،", []]]}, {"c": 9, "v": 2, "text": "إذ الجميع معرضون لنفس المصير، الصالحون والطالحون، الأخيار والأشرار، الطاهر والنجس، المقرب للذبائح وغير المقرب. فالصالح كالطالح سيان، والحالف كمن يخشى الحلف.", "groups": [{"kw": "alike", "raw": "Ecc_2:14-16; Job 21:7-34; Psa_73:3; Mal_3:15", "note": "", "refs": [{"l": "Ecc 2:14-16", "n": "", "vs": [[14, "لأن عيني الحكيم في رأسه، أما الجاهل فيمشي في الظلمة. لكنني أدركت أنهما يلاقيان مصيرا واحدا."], [15, "ثم حدثت نفسي: إن ما يحدث للجاهل يحدث لي أيضا، فلماذا أنا أوفر حكمة؟ فناجيت قلبي: وهذا أيضا باطل،"], [16, "فإن الحكيم كالجاهل، لن يكون لهما ذكر إلى الأبد، ففي الأيام المقبلة سيصبحان كلاهما نسيا منسيا، إذ يموت الجاهل كالحكيم."]]}, {"l": "Job 21:7-34", "n": "", "vs": [[7, "لماذا يحيا الأشرار ويطعنون في السن ويزدادون قوة؟"], [8, "ذريتهم تتأصل أمامهم، ونسلهم يتكاثرون في أثناء حياتهم."], [9, "بيوتهم آمنة من المخاوف، وعصا الله لا تنزل عليهم."], [10, "ثورهم يلقح ولا يخفق، وبقرتهم تلد ولا تسقط."], [11, "يسرحون صبيانهم كسرب، وأطفالهم يرقصون."], [12, "يغنون بالدف والعود ويطربون لصوت المزمار،"], [13, "يقضون أيامهم في الرغد، ثم في لحظة يهبطون إلى الهاوية."], [14, "يقولون للرب: فارقنا فإننا لا نعبأ بمعرفة طرقك."], [15, "من هو القدير حتى نعبده؟ وأي كسب نجنيه إن صلينا إليه؟"], [16, "ولكن فلاحهم ليس في أيديهم، لذلك تظل مشورة الأشرار بعيدة عني."], [17, "كم مرة ينطفيء مصباح الأشرار؟ وكم مرة تتوالى عليهم النكبات، إذ يقسم الله لهم نصيبا في غضبه؟"], [18, "يصبحون كالتبن في وجه الريح، وكالعصافة التي تطوح بها الزوبعة."], [19, "أنتم تقولون: إن الله يدخر إثم الشرير لأبنائه، لا! إنه ينزل العقاب بالأثيم نفسه، فيعلم."], [20, "فليشهد هلاكه بعينيه، وليجرع غصص غضب القدير."], [21, "إذ ما بغيته من بيته بعد فنائه، وقد بتر عدد شهور حياته؟"], [22, "أهناك من يلقن الله علما، وهو الذي يدين المتشامخين؟"], [23, "قد يموت المرء في وفرة رغده، وهو ينعم بالدعة والطمأنينة،"], [24, "والعافية تكسو جنبيه، ومخ عظامه طريء."], [25, "وقد يموت آخر بمرارة نفس ولم يذق خيرا"], [26, "غير أن كليهما يواريهما التراب ويغشاهما الدود."], [27, "انظروا، أنا مطلع على أفكاركم وما تتهمونني به جورا،"], [28, "لأنكم تقولون: أين هو منزل الرجل العظيم، وأين هي خيام الأشرار المقيمين فيها؟"], [29, "هلا سألتم عابري السبيل؟ ألا تكترثون لشهادتهم؟"], [30, "إن الشرير قد أفلت من يوم البوار، ونجا من العقاب في يوم الغضب."], [31, "فمن يواجهه بسوء أعماله، ومن يدينه على رداءة تصرفاته؟"], [32, "عندما يوارى في قبره يقوم حارس على ضريحه."], [33, "تطيب له تربة الوادي، ويمشي خلفه جمهور غفير، والذين يتقدمونه لا يحصى لهم عدد."], [34, "فكيف، بعد هذا، تعزونني بلغو الكلام؟ لم يبق من أجوبتكم إلا كل ما هو باطل»."]]}, {"l": "Psa 73:3", "n": "", "vs": [[3, "لأني حسدت المتكبرين، إذ شاهدت نجاح الأشرار."]]}, {"l": "Mal 3:15", "n": "", "vs": [[15, "وها نحن الآن نغبط المستكبرين، ونرى فاعلي الشر يزدهرون، بل إنهم تحدوا الله ونجوا."]]}], "kwAr": "لنفس المصير", "noteAr": ""}, {"kw": "as is", "raw": "Ecc_2:26, Ecc_7:18, Ecc_8:12-14", "note": "", "refs": [{"l": "Ecc 2:26", "n": "", "vs": [[26, "لأن المرء الذي يحظى برضى الله ينعم الله عليه بالحكمة والمعرفة والفرح. أما الخاطيء فيفرض عليه عناء الجمع والادخار، ليكون ذلك من نصيب من يرضي الله . وهذا أيضا باطل كملاحقة الريح."]]}, {"l": "Ecc 7:18", "n": "", "vs": [[18, "حسن أن تتشبث بهذا وأن لا تفرط في ذاك، لأن متقي الله يتفادى التطرف في كليهما."]]}, {"l": "Ecc 8:12-14", "n": "", "vs": [[12, "ومع أن الخاطيء يرتكب الشر مئة مرة وتطول أيامه، إلا أنني أعلم أنه يكون خير لمتقي الله الذين يخشعون في حضرته."], [13, "أما الأشرار الذين لا يتقون الله فلن ينالوا خيرا، ولن تطول أيامهم التي تشبه الظل، لأنهم لا يخشون الله ."], [14, "في الأرض يسود باطل: هناك صديقون ينالهم جزاء أعمال الأشرار، وأشرار يحظون بثواب أعمال الأبرار، فقلت: هذا أيضا باطل."]]}], "kwAr": "فالصالح كالطالح", "noteAr": ""}, {"kw": "feareth", "raw": "Gen_24:3, Gen_24:8, Gen_24:9; Jos_2:17-20; 1Sa_14:26; Eze_17:18, Eze_17:19; Zec_5:3, Zec_5:4; Mal_3:5, Mal_3:18", "note": "", "refs": [{"l": "Gen 24:3", "n": "", "vs": [[3, "فأستحلفك بالرب إله السماء والأرض أن لا تأخذ لابني زوجة من بنات الكنعانيين الذين أنا مقيم في وسطهم."]]}, {"l": "Gen 24:8", "n": "", "vs": [[8, "إن أبت المرأة أن تتبعك، تكون آنئذ في حل من حلفي هذا، أما ابني فإياك أن ترجع به إلى هناك»."]]}, {"l": "Gen 24:9", "n": "", "vs": [[9, "فوضع العبد يده تحت فخذ سيده إبراهيم وحلف له على ذلك."]]}, {"l": "Jos 2:17-20", "n": "", "vs": [[17, "فقال لها الرجلان: «سنكون بريئين من اليمين التي حلفتنا به،"], [18, "إلا إذا ربطت لدى دخولنا إلى الأرض، هذا الحبل المصنوع من خيوط القرمز في الكوة التي دليتنا منها، وجمعت إليك في البيت أباك وأمك وإخوتك وسائر بيت أبيك."], [19, "وكل من يغادر منزلك يكون دمه على رأسه ونحن نكون بريئين، وأما كل من يكون معك في البيت فدمه على رأسنا إن أصابته يد بأذى."], [20, "وإن أفشيت أمرنا فإننا نكون في حل من يميننا»."]]}, {"l": "1Sa 14:26", "n": "", "vs": [[26, "ولكن لم يجرؤ أحد أن يتذوق منه خوفا من لعنة الحلف."]]}, {"l": "Eze 17:18", "n": "", "vs": [[18, "لقد ازدرى الحلف حين نكث العهد، وها هو قد مد يد الولاء إلى مصر. ولكنه وإن فعل هذا كله لن يفلت."]]}, {"l": "Eze 17:19", "n": "", "vs": [[19, "لذلك، هذا ما يقوله السيد الرب: حي أنا؛ إن حلفي الذي ازدراه، وعهدي الذي نكثه لابد أن يقعا على رأسه."]]}, {"l": "Zec 5:3", "n": "", "vs": [[3, "فقال لي: «هذه هي اللعنة المنصبة على وجه الأرض كلها. كل من يسرق يستأصل بمقتضى ما هو مدون فيها، وكل حالف زور يعاقب بموجب ما هو منصوص فيها»."]]}, {"l": "Zec 5:4", "n": "", "vs": [[4, "ويقول الرب القدير: «إني أصب هذه اللعنة على بيت كل سارق أو حالف باسمي زورا، فتحل في وسط بيته وتبيده مع خشبه وحجره»."]]}, {"l": "Mal 3:5", "n": "", "vs": [[5, "وأقترب منكم لأكون شاهدا سريعا ضد السحرة والزناة والحالفين بالزور والمستغلين لأجرة العامل ومضطهدي الأرامل والأيتام، والذين يظلمون الغرباء ولا يخافونني"]]}, {"l": "Mal 3:18", "n": "", "vs": [[18, "فتشرعون ثانية في التمييز بين الصالح والطالح، بين من يعبد الله ومن لا يعبده»."]]}], "kwAr": "يخشى الحلف", "noteAr": ""}], "arS": [["إذ ", []], ["الجميع", ["H3605"]], [" معرضون لنفس ", []], ["المصير", ["H4745"]], ["، ", []], ["الصالحون", ["H6662"]], [" ", []], ["والطالحون", ["H2398"]], ["، ", []], ["الأخيار", ["H2896"]], [" ", []], ["والأشرار", ["H7563"]], ["، ", []], ["الطاهر", ["H2889"]], [" ", []], ["والنجس", ["H2931"]], ["، ", []], ["المقرب", ["H2076"]], [" ", []], ["للذبائح", ["H2076"]], [" ", []], ["وغير", ["H369"]], [" المقرب. ", []], ["فالصالح", ["H2896"]], [" كالطالح سيان، ", []], ["والحالف", ["H7650"]], [" كمن ", []], ["يخشى", ["H3372"]], [" ", []], ["الحلف", ["H7621"]], [".", []]]}, {"c": 9, "v": 3, "text": "وأشر ما يجري تحت الشمس أن الجميع يلقون نفس المصير، وأن قلوب بني البشر مفعمة بالشر، وفي حياتهم تمتليء صدورهم بالحماقة، ثم يموتون!", "groups": [{"kw": "also", "raw": "Ecc_8:11; Gen_6:5, Gen_8:21; Job_15:16; Psa_51:5; Jer_17:9; Mat_15:19, Mat_15:20; Mar_7:21-23; Rom_1:29-31; Tit_3:3", "note": "", "refs": [{"l": "Ecc 8:11", "n": "", "vs": [[11, "ولأن القضاء لا ينفذ بسرعة على الشر المرتكب، فإن قلوب البشر تمتليء بالعزم على فعل الشر."]]}, {"l": "Gen 6:5", "n": "", "vs": [[5, "ورأى الرب أن شر الإنسان قد كثر في الأرض، وأن كل تصور فكر قلبه يتسم دائما بالإثم،"]]}, {"l": "Gen 8:21", "n": "", "vs": [[21, "فتقبلها الرب برضى، وقال في نفسه: «لن ألعن الأرض مرة أخرى من أجل الإنسان، لأن أهواء قلب الإنسان شريرة منذ حداثته ولن أقدم على إهلاك كل حي كما فعلت."]]}, {"l": "Job 15:16", "n": "", "vs": [[16, "فكم بالأحرى يكون الإنسان الشارب الإثم كالماء مكروها وفاسدا!"]]}, {"l": "Psa 51:5", "n": "", "vs": [[5, "ها إني بالإثم قد ولدت وفي الخطيئة حبلت بي أمي."]]}, {"l": "Jer 17:9", "n": "", "vs": [[9, "القلب أخدع من كل شيء وهو نجيس، فمن يقدر أن يفهمه؟"]]}, {"l": "Mat 15:19", "n": "", "vs": [[19, "فمن القلب تنبع الأفكار الشريرة، القتل، الزنى، الفسق، السرقة، شهادة الزور، التجديف."]]}, {"l": "Mat 15:20", "n": "", "vs": [[20, "هذه هي الأمور التي تنجس الإنسان. وأما تناول الطعام بأيد غير مغسولة، فلا ينجس الإنسان! »"]]}, {"l": "Mar 7:21-23", "n": "", "vs": [[21, "فإنه من الداخل، من قلوب الناس، تنبع الأفكار الشريرة، الفسق، السرقة، القتل،"], [22, "الزنى، الطمع، الخبث، الخداع، العهارة، العين الشريرة، التجديف، الكبرياء، الحماقة"], [23, "هذه الأمور الشريرة كلها تنبع من داخل الإنسان وتنجسه»."]]}, {"l": "Rom 1:29-31", "n": "", "vs": [[29, "إذ قد امتلأوا من كل إثم وشر وجشع وخبث، وشحنوا حسدا وقتلا وخصاما ومكرا وسوءا. وهم ثرثارون،"], [30, "مغتابون، كارهون لله، شتامون، متكبرون، متفاخرون، مخترعون للشرور، غير طائعين للوالدين."], [31, "لا فهم عندهم، ولا أمانة، ولا حنان، ولا رحمة."]]}, {"l": "Tit 3:3", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."]]}], "kwAr": "وأن قلوب بني البشر", "noteAr": ""}, {"kw": "and madness", "raw": "Ecc_1:17, Ecc_7:25; Luk_6:11, Luk_15:17; Act_26:11, Act_26:24; 2Pe_2:16", "note": "", "refs": [{"l": "Ecc 1:17", "n": "", "vs": [[17, "ثم وجهت فكري نحو معرفة الحكمة والجنون والحماقة، فأدركت أن هذا ليس سوى ملاحقة الريح أيضا."]]}, {"l": "Ecc 7:25", "n": "", "vs": [[25, "فتفحصت قلبي لأعلم وأبحث وأنشد الحكمة وألتمس جواهر الأشياء وأعرف جهالة الشر، وحماقة الجنون."]]}, {"l": "Luk 6:11", "n": "", "vs": [[11, "ولكن الحماقة استولت عليهم حتى أخذوا يتشاورون في ما بينهم ماذا يفعلون بيسوع."]]}, {"l": "Luk 15:17", "n": "", "vs": [[17, "ثم رجع إلى نفسه، وقال: ما أكثر خدام أبي المأجورين الذين يفضل عنهم الخبز، وأنا هنا أكاد أهلك جوعا!"]]}, {"l": "Act 26:11", "n": "", "vs": [[11, "وكم عذبتهم في المجامع كلها لأجبرهم على التجديف. وقد بلغ حقدي عليهم درجة جعلتني أطاردهم في المدن التي في خارج البلاد."]]}, {"l": "Act 26:24", "n": "", "vs": [[24, "وما إن وصل بولس في دفاعه إلى هذا الحد، حتى قاطعه فستوس قائلا بصوت عال: «جننت يابولس! إن تبحرك في العلم أصابك بالجنون!»"]]}, {"l": "2Pe 2:16", "n": "", "vs": [[16, "ولكنه توبخ على هذه المخالفة التي ارتكبها. إذ إن الحمار الأبكم نطق بصوت بشري، فوضع حدا لحماقة ذلك النبي!"]]}], "kwAr": "بالحماقة", "noteAr": ""}, {"kw": "after", "raw": "Ecc_12:7; Pro_14:32; Act_12:23", "note": "", "refs": [{"l": "Ecc 12:7", "n": "", "vs": [[7, "فيعود التراب إلى الأرض كما كان، وترجع الروح إلى الله واهبها."]]}, {"l": "Pro 14:32", "n": "", "vs": [[32, "يعاقب الشرير بمقتضى سوء تصرفاته، أما الصديق فله معتصم عند موته."]]}, {"l": "Act 12:23", "n": "", "vs": [[23, "فضربه ملاك من عند الرب في الحال لأنه لم يعط المجد لله، فأكله الدود ومات!"]]}], "kwAr": "ثم يموتون", "noteAr": ""}], "arS": [["وأشر", ["H7451"]], [" ", []], ["ما", ["H834"]], [" ", []], ["يجري", ["H6213"]], [" ", []], ["تحت", ["H8478"]], [" ", []], ["الشمس", ["H8121"]], [" ", []], ["أن", ["H3588"]], [" ", []], ["الجميع", ["H3605"]], [" ", []], ["يلقون", ["H4191"]], [" نفس ", []], ["المصير", ["H4745"]], ["، وأن ", []], ["قلوب", ["H3820", "H3824"]], [" ", []], ["بني", ["H1121"]], [" ", []], ["البشر", ["H120"]], [" مفعمة ", []], ["بالشر", ["H7451"]], ["، وفي ", []], ["حياتهم", ["H2416"]], [" ", []], ["تمتليء", ["H4390"]], [" صدورهم ", []], ["بالحماقة", ["H1947"]], ["، ثم يموتون!", []]]}, {"c": 9, "v": 4, "text": "أما من لا يزال حيا مع الأحياء فله رجاء، لأن كلبا حيا خير من أسد ميت.", "groups": [{"kw": "", "raw": "Job_14:7-12, Job_27:8; Isa_38:18; Lam_3:21, Lam_3:22; Luk_16:26-29", "note": "", "refs": [{"l": "Job 14:7-12", "n": "", "vs": [[7, "لأن للشجرة أملا، إذا قطعت أن تفرخ من جديد ولا تفنى براعمها."], [8, "حتى لو شاخت أصولها في الأرض ومات جذعها في التراب،"], [9, "فإنها حالما تستروح الماء تفرخ، وتنبت فروعا كالغرس."], [10, "أما الإنسان فإنه يموت ويبلى، يلفظ آخر أنفاسه، فأين هو؟"], [11, "كما تنفد المياه من البحيرة، ويجف النهر،"], [12, "هكذا يرقد الإنسان ولا يقوم، ولا يستيقظ من نومه إلى أن تزول السموات."]]}, {"l": "Job 27:8", "n": "", "vs": [[8, "إذ ما هو رجاء الفاجر عندما يستأصله الله ويزهق أنفاسه؟"]]}, {"l": "Isa 38:18", "n": "", "vs": [[18, "لأنه ليس في وسع الهاوية أن تحمدك، والموت لا يسبحك، ولا يقدر الذين ذهبوا إلى الهاوية أن يرجوا أمانتك."]]}, {"l": "Lam 3:21", "n": "", "vs": [[21, "ولكن هذا ما أناجي به نفسي، لذلك يغمرني الرجاء:"]]}, {"l": "Lam 3:22", "n": "", "vs": [[22, "من إحسانات الرب أننا لم نفن، لأن مراحمه لا تزول."]]}, {"l": "Luk 16:26-29", "n": "", "vs": [[26, "وفضلا عن هذا كله، فإن بيننا وبينكم هوة عظيمة قد أثبتت، حتى إن الذين يريدون العبور من هنا لا يقدرون، ولا الذين من هناك يستطيعون العبور إلينا!"], [27, "فقال: ألتمس منك إذن، ياأبي، أن ترسله إلى بيت أبي،"], [28, "فإن عندي خمسة إخوة، حتى يشهد لهم منذرا، لئلا يأتوا هم أيضا إلى مكان العذاب هذا."], [29, "ولكن إبراهيم قال له: عندهم موسى والأنبياء: فليسمعوا لهم!"]]}], "kwAr": "", "noteAr": ""}], "arS": [["أما ", []], ["من", ["H4480"]], [" لا يزال ", []], ["حيا", ["H2416"]], [" ", []], ["مع", ["H413"]], [" ", []], ["الأحياء", ["H2416", "H2266"]], [" فله ", []], ["رجاء", ["H986"]], ["، ", []], ["لأن", ["H3588"]], [" ", []], ["كلبا", ["H3611"]], [" حيا ", []], ["خير", ["H2896"]], [" ", []], ["من", ["H834"]], [" ", []], ["أسد", ["H738"]], [" ", []], ["ميت", ["H4191"]], [".", []]]}, {"c": 9, "v": 5, "text": "لأن الأحياء يدركون أنهم سيموتون، أما الأموات فلا يعلمون شيئا، وليس لهم ثواب بعد، إذ قد ينسى ذكرهم.", "groups": [{"kw": "the living", "raw": "Ecc_7:2; Job_30:23; Heb_9:27", "note": "", "refs": [{"l": "Ecc 7:2", "n": "", "vs": [[2, "الذهاب إلى بيت النوح خير من الحضور إلى بيت الوليمة، لأن الموت هو مصير كل إنسان. وهذا ما يحتفظ به الحي في قلبه."]]}, {"l": "Job 30:23", "n": "", "vs": [[23, "فأيقنت أنك تسوقني إلى الموت، وإلى دار ميعاد كل حي."]]}, {"l": "Heb 9:27", "n": "", "vs": [[27, "فكما أن مصير الناس المحتوم، هو أن يموتوا مرة واحدة ثم تأتي الدينونة،"]]}], "kwAr": "الأحياء يدركون", "noteAr": ""}, {"kw": "the dead", "raw": "Job_14:21; Psa_6:5, Psa_88:10, Psa_88:11; Isa_63:16", "note": "", "refs": [{"l": "Job 14:21", "n": "", "vs": [[21, "يكرم أبناؤه وهو لا يعلم، أو يذلون ولا يدرك ذلك."]]}, {"l": "Psa 6:5", "n": "", "vs": [[5, "إذ ليس في عالم الموت من يذكرك، أو في مقر الأموات من يسبحك."]]}, {"l": "Psa 88:10", "n": "", "vs": [[10, "هل تصنع عجائب للأموات، أم تقوم أشباح الموتى فتمجدك؟"]]}, {"l": "Psa 88:11", "n": "", "vs": [[11, "أفي القبر تعلن رحمتك، وفي الهاوية أمانتك؟"]]}, {"l": "Isa 63:16", "n": "", "vs": [[16, "فأنت هو أبونا، مع أن إبراهيم لا يعرفنا، وإسرائيل لا يعترف بنا، فأنت أيها الرب، هو أبونا، واسمك فادينا منذ القديم."]]}], "kwAr": "الأموات فلا يعلمون", "noteAr": ""}, {"kw": "for the", "raw": "Ecc_2:16, Ecc_8:10; Job_7:8-10; Psa_109:15; Isa_26:14", "note": "", "refs": [{"l": "Ecc 2:16", "n": "", "vs": [[16, "فإن الحكيم كالجاهل، لن يكون لهما ذكر إلى الأبد، ففي الأيام المقبلة سيصبحان كلاهما نسيا منسيا، إذ يموت الجاهل كالحكيم."]]}, {"l": "Ecc 8:10", "n": "", "vs": [[10, "ثم رأيت الأشرار ممن كانوا يروحون ويجيئون إلى المكان المقدس، يدفنون وقد كيلت لهم هالات المديح في المدينة التي ارتكبوا فيها هذه الأمور. وهذا أيضا باطل."]]}, {"l": "Job 7:8-10", "n": "", "vs": [[8, "إن عين من يراني الآن لن تبصرني فيما بعد، وعندما تلتفت عيناك إلي لا تجدني بعد."], [9, "كما يضمحل السحاب ويزول، هكذا المنحدر إلى الهاوية لا يصعد،"], [10, "لا يرجع بعد إلى منزله، ومكانه لا يعرفه بعد."]]}, {"l": "Psa 109:15", "n": "", "vs": [[15, "لتمثل خطاياهم أمام الرب دائما كي يستأصل من الأرض ذكرهم."]]}, {"l": "Isa 26:14", "n": "", "vs": [[14, "هم أموات لا يحيون وأشباح لا تقوم. عاقبتهم وأهلكتهم وأبدت ذكرهم."]]}], "kwAr": "إذ قد ينسى ذكرهم", "noteAr": ""}], "arS": [["لأن", ["H3588"]], [" ", []], ["الأحياء", ["H2416"]], [" ", []], ["يدركون", ["H3045"]], [" ", []], ["أنهم", ["H3588"]], [" ", []], ["سيموتون", ["H4191"]], ["، أما ", []], ["الأموات", ["H4191"]], [" ", []], ["فلا", ["H369"]], [" ", []], ["يعلمون", ["H3045"]], [" ", []], ["شيئا", ["H3972"]], ["، ", []], ["وليس", ["H369"]], [" لهم ", []], ["ثواب", ["H7939"]], [" ", []], ["بعد", ["H5750"]], ["، إذ قد ", []], ["ينسى", ["H7911"]], [" ", []], ["ذكرهم", ["H2143"]], [".", []]]}, {"c": 9, "v": 6, "text": "فقد باد حبهم وبغضهم وغيرتهم، ولم يبق لهم نصيب فيما يجري تحت الشمس.", "groups": [{"kw": "their love", "raw": "Exo_1:8; Job_3:17, Job_3:18; Psa_146:3, Psa_146:4; Pro_10:28; Mat_2:20", "note": "", "refs": [{"l": "Exo 1:8", "n": "", "vs": [[8, "وما لبث أن قام ملك جديد على مصر لم يكن يعرف يوسف."]]}, {"l": "Job 3:17", "n": "", "vs": [[17, "فهناك يكف الأشرار عن إثارة المتاعب، وهناك يرتاح المرهقون."]]}, {"l": "Job 3:18", "n": "", "vs": [[18, "هناك يطمئن الأسرى جميعا، إذ لا يلاحقهم صوت المسخر."]]}, {"l": "Psa 146:3", "n": "", "vs": [[3, "لا تتوكلوا على الرؤساء، ولا على ابن آدم الذي لا يستطيع أن يخلصكم."]]}, {"l": "Psa 146:4", "n": "", "vs": [[4, "تنطلق روحه منه فيعود إلى ترابه، وآنئذ تندثر تدابيره."]]}, {"l": "Pro 10:28", "n": "", "vs": [[28, "البهجة هي أمل الصديق، ورجاء الأشرار مآله الفناء."]]}, {"l": "Mat 2:20", "n": "", "vs": [[20, "وقال له: «قم ارجع بالصبي وأمه إلى أرض إسر ائيل، فقد مات الذين كانوا يسعون إلى قتله!»"]]}], "kwAr": "حبهم وبغضهم", "noteAr": ""}, {"kw": "have they", "raw": "Ecc_2:18-23, Ecc_6:12", "note": "", "refs": [{"l": "Ecc 2:18-23", "n": "", "vs": [[18, "وكرهت كل ما سعيت من أجله تحت الشمس، لأني سأتركه لمن يخلفني."], [19, "ومن يدري: أيكون حكيما أم جاهلا؟ ومع ذلك فإنه سيتولى كل عملي الذي بذلت فيه كل جهدي وحكمتي تحت الشمس. وهذا أيضا باطل."], [20, "فتحولت وأسلمت قلبي لليأس من كل ما بذلته من جهد تحت الشمس."], [21, "إذ قد يترك الإنسان كل ما تعب فيه بحكمة ومعرفة وحذاقة لرجل آخر يتمتع بما لم يشق به. هذا أيضا باطل وشر عظيم."], [22, "فأي نفع للإنسان من جميع تعبه ومكابدته العناء الذي قاسى منه تحت الشمس؟"], [23, "كل أيام حياته مفعمة بالمشقة، وعمله عناء. حتى في الليل لا يستريح قلبه. وهذا أيضا باطل."]]}, {"l": "Ecc 6:12", "n": "", "vs": [[12, "إذ من يدري ما هو خير للإنسان في الحيا ة التي يقضي فيها أياما قليلة باطلة كالظل؟ ومن يقدر أن يطلع الإنسان على ما سيحدث تحت الشمس من بعده؟"]]}], "kwAr": "ولم يبق لهم نصيب", "noteAr": ""}], "arS": [["فقد ", []], ["باد", ["H6"]], [" ", []], ["حبهم", ["H160"]], [" ", []], ["وبغضهم", ["H8135"]], [" ", []], ["وغيرتهم", ["H7068"]], ["، ", []], ["ولم", ["H369"]], [" يبق لهم ", []], ["نصيب", ["H2506"]], [" فيما ", []], ["يجري", ["H6213"]], [" ", []], ["تحت", ["H8478"]], [" ", []], ["الشمس", ["H8121"]], [".", []]]}, {"c": 9, "v": 7, "text": "فامض وتمتع بأكل طعامك، واشرب خمرك بقلب منشرح، لأن الرب قد رضي الآن عن أعمالك.", "groups": [{"kw": "Go", "raw": "Gen_12:19; Mar_7:29; Joh_4:50", "note": "", "refs": [{"l": "Gen 12:19", "n": "", "vs": [[19, "ولماذا ادعيت أنها أختك حتى أخذتها لتكون زوجة لي؟ والآن ها هي زوجتك، خذها وامض في طريقك»."]]}, {"l": "Mar 7:29", "n": "", "vs": [[29, "فقال لها: «لأجل هذه الكلمة اذهبي، فقد خرج الشيطان من ابنتك!»"]]}, {"l": "Joh 4:50", "n": "", "vs": [[50, "أجابه يسوع: «اذهب! إن ابنك حي!» فآمن الرجل بكلمة يسوع التي قالها له، وانصرف."]]}], "kwAr": "فامض", "noteAr": ""}, {"kw": "eat", "raw": "Ecc_2:24-26, Ecc_3:12, Ecc_3:13, Ecc_5:18, Ecc_8:15, Ecc_10:19; Deu_12:7, Deu_12:12, Deu_16:14, Deu_16:15; 1Ki_8:66; 1Ch_16:1-3, 1Ch_29:21-23; 2Ch_30:23-27; Neh_8:10-12", "note": "", "refs": [{"l": "Ecc 2:24-26", "n": "", "vs": [[24, "فليس أفضل للإنسان من أن يأكل ويشرب ويتمتع بتعب يديه. وهذا أيضا، كما أرى، هو من يد الله."], [25, "إذ بمعزل عنه من يستطيع أن يأكل ويستمتع؟"], [26, "لأن المرء الذي يحظى برضى الله ينعم الله عليه بالحكمة والمعرفة والفرح. أما الخاطيء فيفرض عليه عناء الجمع والادخار، ليكون ذلك من نصيب من يرضي الله . وهذا أيضا باطل كملاحقة الريح."]]}, {"l": "Ecc 3:12", "n": "", "vs": [[12, "فأيقنت أنه ليس أفضل لهم من أن يفرحوا ويمتعوا أنفسهم وهم مازالوا على قيد الحياة."]]}, {"l": "Ecc 3:13", "n": "", "vs": [[13, "إن من نعم الله على الإنسان أن يأكل ويشرب ويستمتع بما يجنيه من كده."]]}, {"l": "Ecc 5:18", "n": "", "vs": [[18, "فتأمل ما وجدت: من الأفضل والأليق أن يأكل الإنسان ويشرب ويستمتع بما تكبده من عناء تحت الشمس طوال أيام حياته القليلة التي وهبها الله له، لأن هذا هو حظه."]]}, {"l": "Ecc 8:15", "n": "", "vs": [[15, "فأطريت المسرة لأنه ليس للمرء خير تحت الشمس أفضل من أن يأكل ويشرب ويمتع نفسه، فهذا ما يبقى له من عنائه مدة أيام حياته التي أنعم بها الله عليه تحت الشمس."]]}, {"l": "Ecc 10:19", "n": "", "vs": [[19, "تقام المأدبة للتسلية، والخمرة تولد الفرح، أما المال فيسد جميع الحاجات."]]}, {"l": "Deu 12:7", "n": "", "vs": [[7, "فتأكلون هناك أنتم وعائلاتكم لدى الرب، وتفرحون بكل ما تمتد إليه أيديكم، لأن الرب إلهكم قد بارككم."]]}, {"l": "Deu 12:12", "n": "", "vs": [[12, "وهناك احتفلوا أنتم وبنوكم وبناتكم وعبيدكم وإماؤكم واللاوي المقيم في جواركم، لأنه ليس له نصيب أو ميراث خاص به."]]}, {"l": "Deu 16:14", "n": "", "vs": [[14, "فتحتفلون بالعيد أنتم وأبناؤكم وبناتكم وإماؤكم واللاويون والغريب واليتيم والأرملة المقيمون في مدنكم،"]]}, {"l": "Deu 16:15", "n": "", "vs": [[15, "فتعيدون للرب سبعة أيام في الموضع الذي يختاره الرب، لأن الرب إلهكم يبارك لكم محاصيلكم وكل ما تنتجه أيديكم، فيكمل بذلك فرحكم."]]}, {"l": "1Ki 8:66", "n": "", "vs": [[66, "وفي اليوم الخامس عشر بعد العيد، صرف سليمان الشعب، فباركوه وتوجهوا إلى منازلهم بقلوب يغمرها الفرح والغبطة من أجل كل الخيرات التي أبداها الرب نحو داود عبده، ونحو شعبه إسرائيل."]]}, {"l": "1Ch 16:1-3", "n": "", "vs": [[1, "ثم أدخلوا تابوت الله إلى الخيمة التي نصبها داود، ووضعوه في وسطها وقربوا محرقات وذبائح سلام لله."], [2, "وبعد أن انتهى داود من تقديم المحرقات وذبائح السلام بارك الشعب باسم الرب."], [3, "ووزع على كل الإسرائيليين من رجال ونساء وسائر الحاضرين رغيف خبز وكأس خمر وقرص زبيب."]]}, {"l": "1Ch 29:21-23", "n": "", "vs": [[21, "وفي اليوم الثاني قربوا للرب ذبائح وقدموا محرقات: ألف ثور، وألف كبش، وألف خروف مع سكائب خمرها، وذبائح أخرى كثيرة عن إسرائيل."], [22, "واحتفلوا في ذلك اليوم أمام الرب آكلين شاربين بفرح عظيم، وبايعوا سليمان بن داود ثانية ملكا عليهم، ومسحوه للرب رئيسا، واختاروا صادوق كاهنا."], [23, "وخلف سليمان داود أباه على العرش الذي أسسه الرب وأفلح وأطاعه كل بني إسرائيل."]]}, {"l": "2Ch 30:23-27", "n": "", "vs": [[23, "ثم اتفقوا على الاستمرار بالاحتفال سبعة أيام أخرى قضوها بفرح عظيم،"], [24, "لأن حزقيا تبرع للجماعة بألف ثور وسبعة آلاف من الضأن، كما تبرع رؤساء الشعب بألف ثور وعشرة آلاف من الضأن، وتطهر عدد كبير من الكهنة."], [25, "وعمت البهجة كل جماعة يهوذا والكهنة واللاويين، وكل الوافدين من إسرائيل، والغرباء القادمين من أرض إسرائيل المقيمين في يهوذا."], [26, "وغمرت الفرحة العظيمة أورشليم لأنه لم يحتفل بمثل هذا في أورشليم منذ أيام سليمان بن داود."], [27, "ووقف الكهنة واللاويون وطلبوا البركة على الشعب فاستجاب الرب صلاتهم التي صعدت إلى مسكن قدسه في السماء."]]}, {"l": "Neh 8:10-12", "n": "", "vs": [[10, "ثم استطرد نحميا: «اذهبوا واحتفلوا آكلين أطايب الطعام، وشاربين حلو الشراب، وابعثوا أنصبة لمن لم يعد لهم. ولا تحزنوا لأن هذا اليوم مقدس لسيدنا، ففرح الرب هو قوتكم»."], [11, "وأخذ اللاويون يهدئون كل الشعب قائلين: «كفوا، لأن اليوم مقدس فلا تحزنوا»."], [12, "فمضى الشعب كله ليأكل ويشرب ويبعث بأنصبة ويحتفل بفرح عظيم، لأنه فهم نص الشريعة التي علموه إياها."]]}], "kwAr": "بأكل طعامك", "noteAr": ""}, {"kw": "for", "raw": "Gen_4:4, Gen_4:5; Exo_24:8-11; Luk_11:41; Act_10:35", "note": "", "refs": [{"l": "Gen 4:4", "n": "", "vs": [[4, "وقدم هابيل أيضا من خيرة أبكار غنمه وأسمنها. فتقبل الرب قربان هابيل ورضي عنه."]]}, {"l": "Gen 4:5", "n": "", "vs": [[5, "لكنه لم يتقبل قربان قايين ولم يرض عنه. فاغتاظ قايين جدا وتجهم وجهه كمدا."]]}, {"l": "Exo 24:8-11", "n": "", "vs": [[8, "ثم أخذ موسى الدم الذي في الطسوس ورشه على الشعب قائلا: «هوذا دم العهد الذي قطعه الرب معكم بناء على جميع هذه الأقوال»."], [9, "ثم صعد موسى وهرون وناداب وأبيهو وسبعون من شيوخ إسرائيل،"], [10, "ورأوا إله إسرائيل، وتحت قدميه أرضية كأنها مصنوعة من الياقوت الأزرق الشفاف تماثل السماء في النقاء،"], [11, "ولكن الله لم يمد يده ليهلك أشراف بني إسرائيل. فرأوا الله وأكلوا وشربوا."]]}, {"l": "Luk 11:41", "n": "", "vs": [[41, "أحرى بكم أن تتصدقوا بما عندكم، فإذا كل شيء يكون طاهرا لكم."]]},
