وب على الرأس، النازل على اللحية، على لحية هارون، الجاري إلى أطراف ثوبه،"]]}, {"l": "Pro 27:9", "n": "", "vs": [[9, "الطيب والبخور يفرحان القلب، ومسرة الصديق ناجمة عن المشورة المخلصة."]]}, {"l": "Son 1:3", "n": "", "vs": [[3, "رائحة عطورك شذية، واسمك أريج مسكوب؛ لذلك أحبتك العذارى."]]}, {"l": "Son 4:10", "n": "", "vs": [[10, "ما أعذب حبك ياأختي ياعروسي! لكم حبك ألذ من الخمر، وأريج أطيابك أزكى من كل العطور."]]}, {"l": "Joh 13:2", "n": "", "vs": [[2, "ففي أثناء العشاء، وكان الشيطان قد وضع في قلب يهوذا بن سمعان الإسخريوطي أن يخون يسوع،"]]}], "kwAr": "الطيب", "noteAr": ""}, {"kw": "the day", "raw": "Ecc_4:2; Job_3:17; Isa_57:1, Isa_57:2; 2Co_5:1, 2Co_5:8; Phi_1:21-23; Rev_14:13", "note": "", "refs": [{"l": "Ecc 4:2", "n": "", "vs": [[2, "فغبطت الأموات الذين قضوا منذ زمان أكثر من الأحياء الذين ما برحوا على قيد الحياة."]]}, {"l": "Job 3:17", "n": "", "vs": [[17, "فهناك يكف الأشرار عن إثارة المتاعب، وهناك يرتاح المرهقون."]]}, {"l": "Isa 57:1", "n": "", "vs": [[1, "هلك الصديق فلم يتأمل أحد في نفسه ويعتبر، ومات الأتقياء ولم يدرك أحد أن الصديق قد أخذ تفاديا للكارثة."]]}, {"l": "Isa 57:2", "n": "", "vs": [[2, "والسالكون بالاستقامة ينعمون بالسلام، وفي مضاجعهم يستريحون."]]}, {"l": "2Co 5:1", "n": "", "vs": [[1, "فإننا نعلم أنه متى تهدمت خيمتنا الأرضية التي نسكنها الآن، يكون لنا بناء من الله: بيت لم تصنعه أيدي البشر، أبدي في السماوات."]]}, {"l": "2Co 5:8", "n": "", "vs": [[8, "فنحن واثقون إذن، وراضون بالأحرى أن نكون مغتربين عن الجسد ومقيمين عند الرب."]]}, {"l": "Phi 1:21-23", "n": "", "vs": [[21, "فالحياة عندي هي المسيح، والموت ربح لي."], [22, "ولكن، إن كان لي أن أحيا في الجسد، فحياتي تهييء لي عملا مثمرا. ولست أدري أي الاثنين أختار!"], [23, "فأنا تحت ضغط من كليهما: إذ إني راغب في أن أرحل وأقيم مع المسيح، وهذا أفضل بكثير جدا؛"]]}, {"l": "Rev 14:13", "n": "", "vs": [[13, "وسمعت صوتا من السماء يقول: «اكتب: طوبى للأموات الذين يموتون منذ الآن وهم في الرب! يقول الروح: نعم! فليستريحوا من متاعبهم، لأن أعمالهم ترافقهم»."]]}], "kwAr": "يوم الوفاة", "noteAr": ""}], "arS": [["الصيت", ["H8034"]], [" الحسن ", []], ["خير", ["H2896"]], [" ", []], ["من", ["H4480"]], [" ", []], ["الطيب", ["H8081"]], ["، ", []], ["ويوم", ["H3117"]], [" ", []], ["الوفاة", ["H4194"]], [" ", []], ["أفضل", ["H2896"]], [" ", []], ["من", ["H4480"]], [" ", []], ["يوم", ["H3117"]], [" ", []], ["الولادة", ["H3205"]], [".", []]]}, {"c": 7, "v": 2, "text": "الذهاب إلى بيت النوح خير من الحضور إلى بيت الوليمة، لأن الموت هو مصير كل إنسان. وهذا ما يحتفظ به الحي في قلبه.", "groups": [{"kw": "better", "raw": "Gen. 48:1-22, 49:2-33, Gen_50:15-17; Job_1:4, Job_1:5; Isa_5:11, Isa_5:12, Isa_22:12-14; Amo_6:3-6; Mat_5:4, Mat_14:6-12; 1Pe_4:3, 1Pe_4:4", "note": "", "refs": [{"l": "Gen 48:1-22", "n": "", "vs": [[1, "ثم ما لبث أن قيل ليوسف: «أبوك مريض» فاصطحب معه ابنيه منسى وأفرايم."], [2, "وقيل ليعقوب: «ابنك يوسف قادم إليك». فاستجمع قواه وجلس على السرير."], [3, "وقال يعقوب ليوسف: «تجلى الله القدير لي في لوز في أرض كنعان وباركني،"], [4, "وقال لي: ها أنا أجعلك مثمرا، وأكثرك ويخرج من صلبك جمهور شعوب وأهب ذريتك هذه الأرض ملكا أبديا."], [5, "والآن، إن ابنيك أفرايم ومنسى اللذين أنجبتهما في مصر قبل مجيئي إليك هنا هما لي يرثانني كرأوبين وشمعون."], [6, "وأما أولادك الذين تنجبهم بعد ذلك، فيكونون لك، وما يرثونه يكون تحت اسم أخويهم."], [7, "لأنني فيما كنت راجعا من سهل آرام، ماتت راحيل في أرض كنعان في الطريق على مقربة من أفراتة، فدفنتها في الطريق المؤدية إلى أفراتة، التي هي بيت لحم»."], [8, "وأبصر إسرائيل ابني يوسف فسأل: «من هذان؟»"], [9, "فأجابه يوسف: «هما ابناي اللذان رزقني إياهما الله هنا». فقال: «أدنهما مني فأباركهما»."], [10, "وكانت عينا إسرائيل قد كلتا من الشيخوخة، فلم يكن قادرا على النظر، فقربهما إليه فقبلهما واحتضنهما"], [11, "وقال إسرائيل ليوسف: «ما كنت أظن أنني أبصر وجهك، وهوذا الله قد أراني ذريتك أيضا»."], [12, "ثم أبعدهما يوسف عن حضن أبيه وسجد في حضرته إلى الأرض."], [13, "وأخذ يوسف أفرايم بيمينه وأوقفه إلى يسار إسرائيل، وأخذ منسى بيساره وأوقفه إلى يمينه،"], [14, "فمد إسرائيل يمينه، متعمدا، ووضعها على رأس أفرايم وهو الصغير، ويساره على رأس منسى مع أنه البكر."], [15, "وبارك يوسف قائلا: «إن الله الذي سلك أمامه أبواي إبراهيم وإسحق، الله الذي رعاني منذ وجودي إلى هذا اليوم،"], [16, "الملاك الذي أنقذني من كل شر، يبارك الغلامين، وليدع عليهما اسمي واسما أبوي إبراهيم وإسحق، وليكثرا كثيرا في الأرض»."], [17, "وعندما رأى يوسف أن أباه قد وضع يده اليمنى على رأس أفرايم ساءه ذلك، فأمسك بيد أبيه لينقلها من رأس أفرايم إلى رأس منسى."], [18, "وقال يوسف لأبيه: «ليس هكذا ياأبي. فهذا هو البكر، ضع يمينك على رأسه»."], [19, "فأبى أبوه وقال: «أنا أعرف هذا ياابني، أنا أعرف هذا، فإنه أيضا يصبح أمة عظيمة، ولكن أخاه الصغير يصبح أكبر منه، وذريته تصير جمهورا من الأمم»."], [20, "وباركهما في ذلك اليوم قائلا: «بك يبارك بنو إسرائيل قائلين: «ليجعلك الله مثل أفرايم ومثل منسى». وهكذا قدم أفرايم على منسى."], [21, "ثم قال إسرائيل ليوسف: «إنني مشرف على الموت ولكن الله سيكون معكم ويردكم إلى أرض آبائكم."], [22, "وها أنا قد وهبت لك من الأرض سهما واحدا علاوة على إخوتك، أخذته من الأموريين بسيفي وقوسي»."]]}, {"l": "Gen 49:2-33", "n": "", "vs": [[2, "اجتمعوا واسمعوا ياأبناء يعقوب، واصغوا إلى إسرائيل أبيكم."], [3, "رأوبين أنت بكري وقوتي وأول مظهر رجولتي، فضل الرفعة وفضل العز"], [4, "لكنك فائر كالماء لذلك لن تظل متفوقا، لأنك اضطجعت في فراش أبيك. صعدت على سريري فدنسته."], [5, "شمعون ولاوي أخوان سيوفهما آلات ظلم."], [6, "فيانفسي لا تدخلي في مجلسهما، وياروحي لا تنضمي إلى مجمعهما."], [7, "لأنهما في غضبهما اغتالا إنسانا، وفي عبثهما عرقبا ثورا. ملعون سخطهما لأنه عنيف وغضبهما لأنه ضار. أفرقهما في يعقوب وأشتتهما في إسرائيل."], [8, "يهوذا، إياك يحمد إخوتك، وتكون يدك على عنق أعدائك، ويسجد لك بنو أبيك."], [9, "يهوذا شبل أسد، عن فريسة قمت ياابني. ثم جثا وربض كأسد أو كلبوة، فمن يجرؤ على إثارته؟"], [10, "لا يزول صولجان الملك من يهوذا ولا مشترع من صلبه حتى يأتي شيلوه (ومعناه: من له الأمر) فتطيعه الشعوب."], [11, "يربط بالكرمة جحشه، وبأفضل جفنة ابن أتانه. بالخمر يغسل لباسه وبدم العنب ثوبه."], [12, "تكون عيناه أشد سوادا من الخمر، وأسنانه أكثر بياضا من اللبن."], [13, "زبولون يسكن عند سواحل البحر، ويصبح مقره مرفَأ للسفن، وتمتد تخومه نحو صيدا"], [14, "يساكر حمار قوي رابض بين الحظائر."], [15, "عندما يرى خصوبة مرتعه وبهجة أرضه، تستكين كتفاه للأثقال، ويستعبد للعمل الشاق."], [16, "دان يقضي لشعبه كأحد أسباط إسرائيل."], [17, "دان يكون ثعبانا على جانب الطريق وأفعوانا على السبيل، يلسع عقبي الفرس فيهوي راكبه إلى الوراء."], [18, "إنني انتظرت خلاصك يارب."], [19, "جاد يقتحمه الغزاة، ولكنه يطارد فلولهم ويقحمهم."], [20, "طعام أشير دسم، وأطايبه صالحة لموائد الملوك."], [21, "نفتالي غزالة طليقة يردد أقوالا جميلة."], [22, "يوسف كرمة مثمرة إلى جوار عين، تسلقت أغصانه الحائط."], [23, "يهاجمه الرماة بمرارة. ويطلقون سهامهم عليه بعداوة."], [24, "ولكن قوسه ظلت متينة، وتشددت سواعد يديه بفضل سواعد عزيز يعقوب، الراعي صخر إسرائيل."], [25, "بفضل إله أبيك الذي يعينك، بفضل القدير الذي يباركك ببركات السماوات من فوق، وبركات الغمر من تحت، وبركات الثدي والرحم."], [26, "إن بركات أبيك أعظم من بركات الجبال الدهرية، وأعظم من ذخائر التلال القديمة، فلتحل جميعها على رأسك يايوسف وعلى جبين الذي انفصل عن إخوته."], [27, "بنيامين ذئب ضار، يفترس ضحيته في الصباح، ويفرق الغنيمة في المساء»."], [28, "هؤلاء جميعا هم رؤساء أسباط إسرائيل الاثني عشر. وهذا ما خاطبهم به أبوهم وباركهم؛ كل واحد بالبركة المناسبة له."], [29, "ثم أوصاهم قائلا: «قريبا أنضم إلى آبائي، فادفنوني إلى جوارهم في مغارة حقل عفرون الحثي."], [30, "التي في حقل المكفيلة المواجهة لممرا في أرض كنعان، التي اشتراها إبراهيم مع الحقل من عفرون الحثي لتكون مدفنا خاصا."], [31, "فيها دفن إبراهيم وزوجته سارة، ثم إسحق وزوجته رفقة، وأيضا دفنت ليئة."], [32, "وقد اشترى إبراهيم الحقل والمغارة التي فيه من الحثيين.»"], [33, "ولما فرغ يعقوب من توصية أبنائه تمدد على سريره، وضم رجليه معا، ثم أسلم روحه ولحق بآبائه."]]}, {"l": "Gen 50:15-17", "n": "", "vs": [[15, "ولما رأى إخوة يوسف أن أباهم قد مات قالوا: «لعل يوسف الآن يشرع في اضطهادنا وينتقم منا لإساءتنا إليه؟»"], [16, "فبعثوا إليه رسولا قائلين: «لقد أوصى أبوك قبل موته وقال:"], [17, "هكذا تقولون ليوسف: اغفر لإخوتك ذنبهم وخطيئتهم، فإنهم قد أساءوا إليك. فالآن اصفح عن إثم عبيد إله أبيك». فلما بلغته رسالتهم بكى يوسف."]]}, {"l": "Job 1:4", "n": "", "vs": [[4, "واعتاد أولاده أن يقيموا المآدب في بيت كل منهم بدوره، ويدعون أخواتهم الثلاث إليها ليشاركن فيها."]]}, {"l": "Job 1:5", "n": "", "vs": [[5, "وحالما تنقضي أيام الولائم كان أيوب يستدعي أبناءه ويقدسهم، فكان ينهض مبكرا في الصباح ويقرب محرقات على عددهم قائلا: «لئلا يكون بني قد أخطأوا في قلوبهم وجدفوا على الله». هذا ما واظب عليه أيوب دائما."]]}, {"l": "Isa 5:11", "n": "", "vs": [[11, "ويل لمن ينهضون في الصباح مبكرين يسعون وراء المسكر حتى ساعة متأخرة من الليل إلى أن تلهبهم الخمر."]]}, {"l": "Isa 5:12", "n": "", "vs": [[12, "يتلهون في مآدبهم بالعود والرباب والدف والناي والخمر، غير مكترثين لأعمال الرب ولا ناظرين إلى صنع يديه،"]]}, {"l": "Isa 22:12-14", "n": "", "vs": [[12, "في ذلك اليوم يدعوكم السيد الرب القدير للبكاء والنوح وحلق الشعر والتنطق بالمسوح."], [13, "ولكنكم انهمكتم بالفرح والسرور وذبح الثيران وتضحية الغنم وأكل اللحم وشرب الخمر قائلين: «لنأكل ونشرب لأننا غدا نموت»."], [14, "فقال لي القدير: «لن تغفر لكم آثامكم حتى تموتوا»."]]}, {"l": "Amo 6:3-6", "n": "", "vs": [[3, "أنتم يامن تتجاهلون يوم السوء وتقربون كرسي الظلم."], [4, "ويل للراقدين فوق أسرة من عاج، المسترخين فوق الأرائك، الآكلين لحم خيرة الحملان والعجول المختارة من وسط المعلف."], [5, "المغنين على صوت الرباب، المخترعين لأنفسهم آلات غناء كداود."], [6, "الشاربين خمرا في كؤوس، المتطيبين بأفضل العطور، ولا يكتئبون على خراب يوسف."]]}, {"l": "Mat 5:4", "n": "", "vs": [[4, "طوبى للحزانى، فإنهم سيعزون."]]}, {"l": "Mat 14:6-12", "n": "", "vs": [[6, "وفي أثناء الاحتفال بذكرى ميلاد هيرودس، رقصت ابنة هيروديا في الوسط، فسرت هيرودس،"], [7, "فأقسم لها واعدا بأن يعطيها أي شيء تطلبه."], [8, "فبعد استشارة أمها، قالت: «أعطني هنا على طبق رأس يوحنا المعمدان!»"], [9, "فحزن الملك؛ ولكنه أمر بأن تعطى ما تريد، من أجل ما أقسم به أمام المتكئين معه."], [10, "وأرسل إلى السجن فقطع رأس يوحنا."], [11, "وجيء بالرأس على طبق، فقدم إلى الصبية، فحملته إلى أمها."], [12, "وجاء تلاميذ يوحنا، فرفعوا جثمانه، ودفنوه. ثم ذهبوا وأخبروا يسوع."]]}, {"l": "1Pe 4:3", "n": "", "vs": [[3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}, {"l": "1Pe 4:4", "n": "", "vs": [[4, "ورفاقكم في تلك العيشة سابقا يستغربون أنكم لا تركضون معهم إلى فيض هذه الخلاعة، ويجرحون سمعتكم."]]}], "kwAr": "خير من الحضور", "noteAr": ""}, {"kw": "that", "raw": "Num_23:10; Deu_32:29; Rom_6:21, Rom_6:22; Phi_3:19; Heb_9:27", "note": "", "refs": [{"l": "Num 23:10", "n": "", "vs": [[10, "من يقدر أن يحصي تراب يعقوب أو يعد ربع إسرائيل؟ لتمت نفسي موت الأبرار، ولتكن آخرتي كآخرتهم»."]]}, {"l": "Deu 32:29", "n": "", "vs": [[29, "لو عقلوا لفطنوا لمآلهم وتأملوا في مصيرهم،"]]}, {"l": "Rom 6:21", "n": "", "vs": [[21, "ولكن أي ثمر أنتجتم حينذاك من الأمور التي تخجلون بها الآن، وما عاقبتها إلا الموت؟"]]}, {"l": "Rom 6:22", "n": "", "vs": [[22, "أما الآن، وقد حررتم من الخطيئة وصرتم عبيدا لله، فإن لكم ثمركم للقداسة، والعاقبة هي الحياة الأبدية."]]}, {"l": "Phi 3:19", "n": "", "vs": [[19, "الذين مصيرهم الهلاك، وإلههم بطونهم، ومفخرتهم في عيبتهم، وفكرهم منصرف إلى الأمور الأرضية."]]}, {"l": "Heb 9:27", "n": "", "vs": [[27, "فكما أن مصير الناس المحتوم، هو أن يموتوا مرة واحدة ثم تأتي الدينونة،"]]}], "kwAr": "الموت هو مصير", "noteAr": ""}, {"kw": "living", "raw": "Deu_32:46; Isa_47:7; Hag_1:5 *marg. Mal_2:2", "note": "", "refs": [{"l": "Deu 32:46", "n": "", "vs": [[46, "قال لهم: «تأملوا بقلوبكم في جميع هذه الكلمات التي أنا أشهد عليكم بها اليوم، لكي توصوا بها أولادكم، ليحرصوا على العمل بكلمات هذه التوراة كلها."]]}, {"l": "Isa 47:7", "n": "", "vs": [[7, "وقلت: سأظل السيدة إلى الأبد. لذلك لم تفكري بهذه الأمور في نفسك ولا تأملت بما تؤول إليه."]]}, {"l": "Hag 1:5", "n": "*marg.", "vs": [[5, "والآن هذا ما يقوله الرب القدير: «تأملوا فيما فعلتم:"]]}, {"l": "Mal 2:2", "n": "", "vs": [[2, "إن أبيتم الاستماع، ولم تنووا في قلوبكم أن تمجدوا اسمي، أصب عليكم اللعنة، وألعن بركاتكم، بل ها أنا قد حولتها إلى لعنات لأنكم لم تجعلوها في قلوبكم."]]}], "kwAr": "الحي", "noteAr": ""}], "arS": [["الذهاب", ["H1980"]], [" ", []], ["إلى", ["H413"]], [" ", []], ["بيت", ["H1004"]], [" ", []], ["النوح", ["H60"]], [" ", []], ["خير", ["H2896"]], [" ", []], ["من", ["H4480"]], [" ", []], ["الحضور", ["H1980"]], [" ", []], ["إلى", ["H413"]], [" ", []], ["بيت", ["H1004"]], [" ", []], ["الوليمة", ["H4960"]], ["، ", []], ["لأن", ["H834"]], [" الموت ", []], ["هو", ["H1931"]], [" ", []], ["مصير", ["H5490"]], [" ", []], ["كل", ["H3605"]], [" ", []], ["إنسان", ["H120"]], [". وهذا ما ", []], ["يحتفظ", ["H5414"]], [" به ", []], ["الحي", ["H2416"]], [" ", []], ["في", ["H413"]], [" ", []], ["قلبه", ["H3820"]], [".", []]]}, {"c": 7, "v": 3, "text": "الحزن خير من الضحك، لأنه بكآبة الوجه يصلح القلب.", "groups": [{"kw": "Sorrow", "raw": "or, Anger", "note": "or, Anger", "refs": [], "kwAr": "الحزن", "noteAr": "أو: الغضب."}, {"kw": "is better", "raw": "Psa_119:67, Psa_119:71, Psa_126:5, Psa_126:6; Jer_31:8, Jer_31:9, Jer_31:15-20, Jer_50:4, Jer_50:5; Dan. 9:3-19; Dan_10:2, Dan_10:3, Dan_10:19; Zec_12:10-14; Luk_6:21, Luk_6:25; Joh_16:20-22; 2Co_7:9-11; Jam_4:8-10", "note": "", "refs": [{"l": "Psa 119:67", "n": "", "vs": [[67, "ضللت قبل أن أدبتني، أما الآن فحفظت كلامك."]]}, {"l": "Psa 119:71", "n": "", "vs": [[71, "كان ما ذقت من هوان لخيري فتعلمت فرائضك."]]}, {"l": "Psa 126:5", "n": "", "vs": [[5, "فمن يزرع بالدموع يحصد غلاته بالابتهاج."]]}, {"l": "Psa 126:6", "n": "", "vs": [[6, "ومن يذهب باكيا حاملا بذاره يرجع مترنما حاملا حزم حصيده."]]}, {"l": "Jer 31:8", "n": "", "vs": [[8, "ها أنا آتي بهم من بلاد الشمال، وأجمعهم من أقصى أطراف الأرض، وفيهم الأعمى والأعرج، الحبلى والماخض، فيرجع حشد عظيم إلى هنا."]]}, {"l": "Jer 31:9", "n": "", "vs": [[9, "سيرجعون بنوح، وبتضرعات أهديهم. إلى جوار جداول المياه أسيرهم فيمشون في طريق مستقيمة لا يعثرون فيها، لأني أب لإسرائيل، وأفرايم بكري»."]]}, {"l": "Jer 31:15-20", "n": "", "vs": [[15, "وهذا ما يعلنه الرب: «قد تردد في الرامة صوت ندب وبكاء مر. راحيل تنوح على أبنائها وتأبى أن تتعزى عنهم لأنهم غير موجودين»."], [16, "وهذا ما يعلنه الرب: «كفي صوتك عن البكاء وعينيك عن العبرات لأن لعملك ثوابا»، يقول الرب، «إذ لابد أن يرجع أولادك من أرض العدو."], [17, "فلغدك رجاء»، يقول الرب، «إذ سيرجع أولادك إلى موطنهم."], [18, "قد سمعت أفرايم ينتحب قائلا: أدبتني فتأدبت كعجل غير مروض. أرجعني فأرجع لأنك أنت الرب إلهي."], [19, "فقد تبت بعد أن غويت، وبعد أن تعلمت صفقت على فخذي ندما. خجلت وخزيت لأني حملت عار حداثتي."], [20, "هل أفرايم ابن أثير لدي؟ أليس هو ابنا مسرا؟ لأني مع كثرة تنديدي به فإني مازلت أذكره، لذلك يشتاق قلبي إليه، وأكن له الرحمة»، يقول الرب."]]}, {"l": "Jer 50:4", "n": "", "vs": [[4, "وفي تلك الأيام، يقول الرب، يتوافد أبناء إسرائيل وأبناء يهوذا معا. يبكون في سيرهم ويلتمسون الرب إلههم."]]}, {"l": "Jer 50:5", "n": "", "vs": [[5, "يسألون عن الطريق إلى صهيون، ويتوجهون إليها قائلين: هلم ننضم إلى الرب بعهد أبدي لا ينسى."]]}, {"l": "Dan 9:3-19", "n": "", "vs": [[3, "فاتجهت بنفسي إلى السيد الرب، أبتهل إليه بالصلاة والتضرعات والصوم وارتداء المسح والتعفر بالرماد."], [4, "وصليت إلى الرب إلهي واعترفت قائلا: «أيها الرب الإله العظيم المهوب، حافظ العهد والرحمة لمحبيه وعاملي وصاياه."], [5, "إننا أخطأنا وأثمنا وارتكبنا الشر، وتمردنا وانحرفنا عن وصاياك وأحكامك."], [6, "ولم نسمع لعبيدك الأنبياء الذين باسمك أنذروا ملوكنا ورؤساءنا وآباءنا وجميع شعب الأرض."], [7, "لك أيها السيد البر، ولنا الخزي، كما هو حادث اليوم لرجال يهوذا ولأهل أورشليم، ولسائر بني إسرائيل القريبين والبعيدين، المشتتين في كل البلدان التي أجليتهم إليها عقابا لهم على ما اقترفوه من خيانة في حقك."], [8, "فلنا أيها السيد الخزي، نحن وملوكنا ورؤسائنا وآبائنا، لأننا أخطأنا إليك."], [9, "إنما للرب إلهنا الرحمة والمغفرة لأننا عصيناك."], [10, "ولم نطع صوت الرب إلهنا لنسلك في شرائعه التي أعلنها لنا على لسان عبيده الأنبياء."], [11, "قد تعدى كل شعب إسرائيل على شريعتك، وانحرفوا فلم يسمعوا صوتك، فسكبت علينا اللعنة وما أقسمت أن توقعه بنا، كما نصت عليه شريعة موسى عبد الله، لأننا أخطأنا إليك."], [12, "وقد نفذت قضاءك الذي قضيت به علينا وعلى قضاتنا الذين تولوا أمرنا، جالبا علينا وعلى أورشليم شرا عظيما لم يحدث له مثيل تحت السماء."], [13, "وكما ورد في شريعة موسى، أصابنا جميع هذا البلاء، ولم نستعطف وجهك أيها الرب إلهنا تائبين عن آثامنا ومتنبهين لحقك."], [14, "فأضمرت لنا العقاب وأوقعته بنا لأنك إلهنا البار في كل أعمالك التي صنعتها لأننا لم نستمع إليك."], [15, "والآن أيها السيد إلهنا، يامن أخرجت شعبك من ديار مصر بقوة مقتدرة، وأشهرت اسمك كما هو حادث اليوم، قد أخطأنا وارتكبنا الشر."], [16, "فاصرف ياسيد، حسب رحمتك، سخطك وغضبك عن مدينتك أورشليم جبل قدسك إذ من جراء خطايانا وآثام آبائنا أصبحت أورشليم مثار عار لنا عند جميع المحيطين بنا."], [17, "فأنصت الآن ياإلهنا إلى صلاة عبدك وابتهالاته، وأضيء بوجهك على هيكلك المتهدم، من أجل ذاتك."], [18, "أرهف أذنك ياإلهي واستمع، وافتح عينيك وشاهد خرائبنا والمدينة التي دعي اسمك عليها، فإننا لا من أجل بر فينا نرفع تضرعاتنا إليك، بل بفضل مراحمك العظيمة."], [19, "فاستمع أيها السيد واغفر. أصغ أيها السيد وتصرف ولا تبطىء من أجل نفسك ياإلهي، لأن اسمك دعي على مدينتك وعلى شعبك»."]]}, {"l": "Dan 10:2", "n": "", "vs": [[2, "في ذلك الوقت أنا دانيآل قضيت ثلاثة أسابيع في النوح،"]]}, {"l": "Dan 10:3", "n": "", "vs": [[3, "لم آكل فيها طعاما شهيا، ولم يدخل فمي لحم أو خمر، ولم أتطيب بدهن."]]}, {"l": "Dan 10:19", "n": "", "vs": [[19, "وقال: «لا تخف أيها الرجل المحبوب؛ سلام لك. تقو وتشجع». وحالما كلمني دبت في القوة وقلت: «ليتكلم سيدي لأنك شددتني»."]]}, {"l": "Zec 12:10-14", "n": "", "vs": [[10, "وأفيض على ذرية داود وعلى سكان أورشليم روح النعمة والابتهال، حتى إذا نظروا إلي أنا الذي طعنوه ينوحون عليه كما ينوح والد على ولده الوحيد، متفجعين عليه كتفجعهم على موت بكرهم."], [11, "في ذلك اليوم يكون النواح في أورشليم مماثلا للنواح في هددرمون في سهل مجدو (حيث قتل الملك يوشيا)."], [12, "فيشيع النحيب بين أهل البلاد، فتنوح كل عشيرة على حدة، فيبكي رجال عشيرة داود منفردين عن النساء، والنساء عن الرجال، ورجال عشيرة ذرية ناثان منفردين عن النساء، والنساء عن الرجال."], [13, "وكذلك ينوح رجال ونساء عشيرة لاوي كل على حدة، ورجال ونساء عشيرة شمعي كل على حدة."], [14, "وأيضا ينوح رجال ونساء سائر العشائر الباقية كل على حدة»."]]}, {"l": "Luk 6:21", "n": "", "vs": [[21, "طوبى لكم أيها الجائعون الآن، فإنكم سوف تشبعون. طوبى لكم أيها الباكون الآن، فإنكم سوف تضحكون."]]}, {"l": "Luk 6:25", "n": "", "vs": [[25, "الويل لكم أيها المشبعون الآن، فإنكم سوف تجوعون. الويل لكم أيها الضاحكون الآن، فإنكم سوف تنوحون وتبكون."]]}, {"l": "Joh 16:20-22", "n": "", "vs": [[20, "الحق الحق أقول لكم: إنكم ستبكون وتنوحون، أما العالم فيفرح. إنكم ستحزنون، ولكن حزنكم سيتحول إلى فرح."], [21, "المرأة تحزن إذا حانت ساعتها لتلد. ولكنها حالما تلد طفلها، لا تعود تتذكر عناءها، لفرحها بأن إنسانا قد ولد في العالم."], [22, "فكذلك أنتم، تحزنون الآن؛ ولكن عندما أعود للقائكم، تبتهج قلوبكم، ولا أحد يسلبكم فرحكم."]]}, {"l": "2Co 7:9-11", "n": "", "vs": [[9, "وأنا الآن أفرح، لا لأنكم قد أحزنتم، بل لأن حزنكم أدى بكم إلى التوبة. فإنكم قد أحزنتم بما يوافق مشيئة الله، حتى لا تتأذوا منا في أي شيء."], [10, "فإن الحزن الذي يوافق مشيئة الله ينتج توبة تؤدي إلى الخلاص، وليس عليه ندم. وأما حزن العالم فينتج موتا."], [11, "فانظروا، إذن، هذا الحزن عينه الذي يوافق الله ، كم أنتج فيكم من الاجتهاد، بل من الاعتذار، بل من الاستنكار، بل من الخوف، بل من التشوق، بل من الغيرة، بل من الانتقام! وقد بينتم في كل شيء أنكم أبرياء من ذلك الأمر."]]}, {"l": "Jam 4:8-10", "n": "", "vs": [[8, "اقتربوا إلى الله فيقترب إليكم. أيها الخاطئون نظفوا أيديكم، وياأصحاب الرأيين طهروا قلوبكم."], [9, "احزنوا مولولين ونائحين وباكين. ليتحول ضحككم إلى نواح، وفرحكم إلى كآبة."], [10, "تواضعوا في حضرة الرب فيرفعكم!"]]}], "kwAr": "خير من الضحك", "noteAr": ""}, {"kw": "by", "raw": "Rom_5:3, Rom_5:4; 2Co_4:17; Heb_12:10, Heb_12:11; Jam_1:2-4", "note": "", "refs": [{"l": "Rom 5:3", "n": "", "vs": [[3, "ليس هذا فقط، بل نفتخر أيضا في وسط الضيقات، لعلمنا أن الضيق ينتج فينا الصبر،"]]}, {"l": "Rom 5:4", "n": "", "vs": [[4, "والصبر يؤهلنا للفوز في الامتحان، والفوز يبعث فينا الرجاء،"]]}, {"l": "2Co 4:17", "n": "", "vs": [[17, "ذلك لأن ما يضايقنا الآن من صعوبات بسيطة عابرة، ينتج لنا بمقدار لا يحد وزنة أبدية من المجد،"]]}, {"l": "Heb 12:10", "n": "", "vs": [[10, "وقد أدبنا آباؤنا فترة من الزمان، حسب ما رأوه مناسبا. أما الله ، فيؤدبنا دائما من أجل منفعتنا: لكي نشترك في قداسته."]]}, {"l": "Heb 12:11", "n": "", "vs": [[11, "وطبعا، كل تأديب لا يبدو في الحال باعثا على الفرح، بل على الحزن. ولكنه فيما بعد، ينتج بسلام في الذين يتلقونه ثمر البر."]]}, {"l": "Jam 1:2-4", "n": "", "vs": [[2, "ياإخوتي، عندما تنزل بكم التجارب والمحن المختلفة، اعتبروها سبيلا إلى الفرح الكلي."], [3, "وكونوا على ثقة بأن امتحان إيمانكم هذا ينتج صبرا."], [4, "ودعوا الصبر يعمل عمله الكامل فيكم، لكي يكتمل نضوجكم وتصيروا أقوياء قادرين على مواجهة جميع الأحوال."]]}], "kwAr": "بكآبة الوجه", "noteAr": ""}], "arS": [["الحزن", ["H3708"]], [" ", []], ["خير", ["H2896", "H3190"]], [" ", []], ["من", ["H4480"]], [" ", []], ["الضحك", ["H7814"]], ["، ", []], ["لأنه", ["H3588"]], [" ", []], ["بكآبة", ["H7455"]], [" ", []], ["الوجه", ["H6440"]], [" يصلح ", []], ["القلب", ["H3820"]], [".", []]]}, {"c": 7, "v": 4, "text": "قلب الحكماء في بيت النوح، أما قلوب الجهال ففي بيت اللذة.", "groups": [{"kw": "heart", "raw": "Neh_2:2-5; Isa_53:3, Isa_53:4; Mat_8:14-16; Mar_5:38-43; Luk_7:12, Luk_7:13; Joh_11:31-35", "note": "", "refs": [{"l": "Neh 2:2-5", "n": "", "vs": [[2, "فسألني الملك: مالي أرى وجهك مكمدا «وأنت غير مريض؟ هذا ليس سوى كآبة قلب. فساورني خوف عظيم."], [3, "وقلت للملك: ليحي الملك إلى الأبد! كيف لا ينقبض وجهي، والمدينة التي دفن فيها آبائي قد صارت خرابا، وأبوابها قد التهمتها النيران؟"], [4, "فسألني الملك: أي شيء تطلب؟ فصليت إلى إله السماء،"], [5, "وأجبت الملك: إذا طاب للملك، وحظي عبدك برضاك، فإنني ألتمس أن ترسلني إلى يهوذا، إلى المدينة التي دفن فيها آبائي فأبنيها."]]}, {"l": "Isa 53:3", "n": "", "vs": [[3, "محتقر ومنبوذ من الناس، رجل آلام ومختبر الحزن، مخذول كمن حجب الناس عنه وجوههم فلم نأبه له."]]}, {"l": "Isa 53:4", "n": "", "vs": [[4, "لكنه حمل أحزاننا وتحمل أوجاعنا، ونحن حسبنا أن الرب قد عاقبه وأذله،"]]}, {"l": "Mat 8:14-16", "n": "", "vs": [[14, "وذهب يسوع إلى بيت بطرس، فوجد حماته طريحة الفراش تعاني من الحمى."], [15, "فلمس يدها، فذهبت عنها الحمى، ونهضت وأخذت تخدمه."], [16, "وعند حلول المساء، أحضر إليه الناس كثيرين من المسكونين بالشياطين. فكان يطرد الشياطين بكلمة منه. وشفى المرضى جميعا،"]]}, {"l": "Mar 5:38-43", "n": "", "vs": [[38, "ووصل إلى بيت رئيس المجمع، فرأى الجلبة والناس يبكون ويولولون كثيرا."], [39, "فلما دخل، قال لهم: «لماذا تضجون وتبكون؟ لم تمت الصبية، بل هي نائمة»."], [40, "فضحكوا منه. أما هو، فأخرجهم جميعا، ثم أخذ معه أبا الصبية وأمها والذين كانوا يرافقونه، ودخل حيث كانت الصبية."], [41, "وإذ أمسك بيدها قال: «طليثا قومي!» أي: «ياصبية، لك أقول: قومي»."], [42, "فنهضت الصبية حالا وأخذت تمشي، إذ كان عمرها اثنتي عشر ة سنة. فدهش الجميع دهشة عظيمة."], [43, "فأمرهم بشدة أن لا يعلم أحد بذلك، وطلب أن تعطى ما تأكله."]]}, {"l": "Luk 7:12", "n": "", "vs": [[12, "ولما اقترب من باب المدينة، إذا ميت محمول، وهو ابن وحيد لأمه التي كانت أرملة، وكان معها جمع كبير من المدينة."]]}, {"l": "Luk 7:13", "n": "", "vs": [[13, "فلما رآها الرب، تحنن عليها، وقال لها: «لا تبكي!»"]]}, {"l": "Joh 11:31-35", "n": "", "vs": [[31, "فلما رآها اليهود، الذين كانوا معها في البيت يعزونها، تهب واقفة وتسرع بالخروج، لحقوا بها، لأنهم ظنوا أنها ذاهبة لتبكي عند القبر."], [32, "وما إن وصلت مريم إلى حيث كان يسوع ورأته، حتى ارتمت على قدميه تقول: «ياسيد، لو كنت هنا، لما مات أخي!»"], [33, "فلما رآها يسوع تبكي ويبكي معها اليهود الذين رافقوها، فاض قلبه بالأسى الشديد،"], [34, "وسأل: «أين دفنتموه؟» فأجابوا: «تعال، ياسيد، وانظر!»"], [35, "عندئذ بكى يسوع."]]}], "kwAr": "قلب الحكماء", "noteAr": ""}, {"kw": "the heart", "raw": "1Sa_25:36, 1Sa_30:16; 2Sa_13:28; 1Ki_20:16; Isa_21:4; Jer_51:39, Jer_51:57; Dan_5:1-4, Dan_5:30; Hos_7:5; Nah_1:10; Mar_6:21-29", "note": "", "refs": [{"l": "1Sa 25:36", "n": "", "vs": [[36, "فأقبلت أبيجايل إلى نابال، فوجدت أنه قد أقام مأدبة في بيته كمأدبة ملك، وقد أخذته النشوة بعد أن أكثر من احتساء الخمر حتى سكر، فلم تخبره بشيء إطلاقا حتى صباح اليوم التالي."]]}, {"l": "1Sa 30:16", "n": "", "vs": [[16, "وقادهم إلى معسكر عماليق فوجدوهم منتشرين في الحقول يأكلون ويشربون ويرقصون من جراء ما أصابوه من غنيمة عظيمة نهبوها من أرض الفلسطينيين ومن أرض يهوذا."]]}, {"l": "2Sa 13:28", "n": "", "vs": [[28, "وأوصى أبشالوم رجاله: «متى ذهبت الخمر بعقل أمنون وقلت لكم اضربوا أمنون واقتلوه، فلا تخافوا. ألست أنا الذي أمرتكم بذلك؟ تشجعوا وتصرفوا كأبطال»."]]}, {"l": "1Ki 20:16", "n": "", "vs": [[16, "واندفعوا عند الظهر من المدينة وبنهدد منهمك في السكر في الخيام مع حلفائه الملوك الاثنين والثلاثين،"]]}, {"l": "Isa 21:4", "n": "", "vs": [[4, "تحير قلبي، وأرعبني الفزع، فتحول ليلي الذي كنت أتوق إليه إلى رعدة."]]}, {"l": "Jer 51:39", "n": "", "vs": [[39, "عند شبعهم أعد لهم مأدبة وأسكرهم حتى تأخذهم النشوة فينامون نوما أبديا لا يقظة منه، يقول الرب."]]}, {"l": "Jer 51:57", "n": "", "vs": [[57, "إني أسكر رؤساءها وحكماءها ومحاربيها، فينامون نوما أبديا لا يقظة منه، يقول الملك، الرب القدير اسمه."]]}, {"l": "Dan 5:1-4", "n": "", "vs": [[1, "وأقام بيلشاصر الملك مأدبة عظيمة لنبلاء دولته الألف، وشرب خمرا أمامهم."], [2, "وفيما كان يحتسي الخمر أمر بإحضار آنية الذهب والفضة التي استولى عليها أبوه نبوخذناصر من هيكل أورشليم، ليشرب بها مع نبلاء مملكته وزوجاته ومحظياته."], [3, "فأحضروها وشرب بها الملك ونبلاء مملكته وزوجاته ومحظياته"], [4, "وأخذوا يسبحون آلهة الذهب والفضة والنحاس والحديد والخشب والحجر."]]}, {"l": "Dan 5:30", "n": "", "vs": [[30, "في تلك الليلة قتل بيلشاصر ملك الكلدانيين،"]]}, {"l": "Hos 7:5", "n": "", "vs": [[5, "في يوم احتفال ملكنا انتشى الرؤساء من سورة الخمر، وانضم هو إلى المتبذلين."]]}, {"l": "Nah 1:10", "n": "", "vs": [[10, "وتلتهمهم النار كما تلتهم شجرة عليق كثيفة أو سكارى مترنحين من خمرهم أو حزمة قش جافة."]]}, {"l": "Mar 6:21-29", "n": "", "vs": [[21, "ثم سنحت الفرصة عندما أقام هيرودس بمناسبة ذكرى مولده وليمة لعظمائه وقادة الألوف وأعيان منطقة الجليل."], [22, "فقد دخلت ابنة هيروديا ورقصت، فسرت هيرودس والمتكئين معه. فقال الملك للصبية: «اطلبي مني ما تريدين، فأعطيك إياه!»"], [23, "وأقسم لها قائلا: «لأعطينك مهما طلبت مني، ولو نصف مملكتي!»"], [24, "فخرجت وسألت أمها: «ماذا أطلب؟» فأجابت: «رأس يوحنا المعمدان!»"], [25, "فعادت في الحال إلى الداخل وطلبت من الملك قائلة: «أريد أن تعطيني حالا رأس يوحنا المعمدان على طبق!»"], [26, "فحزن الملك جدا. ولكنه لأجل ما أقسم به ولأجل المتكئين معه، لم يرد أن يخلف وعده لها."], [27, "وفي الحال أرسل الملك سيافا وأمر أن يؤتى برأس يوحنا. فذهب السياف وقطع رأس يوحنا في السجن،"], [28, "ثم جاء بالرأس على طبق وقدمه إلى الصبية فحملته إلى أمها."], [29, "ولما سمع تلاميذ يوحنا بذلك، جاءوا ورفعوا جثمانه، ودفنوه في قبر."]]}], "kwAr": "قلوب الجهال", "noteAr": ""}], "arS": [["قلب", ["H3820"]], [" ", []], ["الحكماء", ["H2450"]], [ 1:13", "note": "", "refs": [{"l": "Ecc 2:2", "n": "", "vs": [[2, "قلت عن الضحك: هذا جنون، وعن اللذة ما جدواها."]]}, {"l": "Psa 58:9", "n": "", "vs": [[9, "وقبل أن تحس قدوركم بنار الأشواك تحتها، يكتسح الله كبيرهم وصغيرهم بعاصفة غضبه،"]]}, {"l": "Psa 118:12", "n": "", "vs": [[12, "حاصروني كالنحل، (اشتعلوا) ثم انطفأوا كنار الشوك. باسم الرب أبيدهم."]]}, {"l": "Isa 65:13-15", "n": "", "vs": [[13, "لذلك هكذا يقول السيد الرب: ها عبيدي يأكلون وأنتم تجوعون، ويشربون وأنتم تظمأون، ويفرحون وأنتم تخزون،"], [14, "ويترنمون في غبطة القلب وأنتم تعولون من أسى القلب، وتولولون من انكسار الروح،"], [15, "وتخلفون اسمكم لعنة على شفاه مختاري، ويميتكم الرب ويطلق على عبيده اسما آخر."]]}, {"l": "Amo 8:10", "n": "", "vs": [[10, "أحول أعيادكم إلى مآتم، وأغانيكم إلى مراث، وألبسكم المسوح على أحقائكم، وأفشي الصلع في كل رأس، فتصبح أعيادكم كمناحة على وحيد، ونهايتها كيوم مفعم بالمرارة."]]}, {"l": "Luk 6:25", "n": "", "vs": [[25, "الويل لكم أيها المشبعون الآن، فإنكم سوف تجوعون. الويل لكم أيها الضاحكون الآن، فإنكم سوف تنوحون وتبكون."]]}, {"l": "Luk 16:25", "n": "", "vs": [[25, "ولكن إبراهيم قال: يابني، تذكر أنك نلت خيراتك كاملة في أثناء حياتك، ولعازر نال البلايا. ولكنه الآن يتعزى هنا، وأنت هناك تتعذب."]]}, {"l": "2Pe 2:13-17", "n": "", "vs": [[13, "وبذلك ينالون أجرة إثمهم! إنهم يحسبون الانغماس في اللذات طول النهار بهجة عظيمة. فهم أوساخ وعيوب: يتلذذون بالنجاسة ويحاولون خداعكم، فيشتركون معكم في الولائم."], [14, "عيونهم لا تنظر إلا نظرات الزنى، ولا تشبع من الخطيئة. وكم من نفوس ضعيفة تقع في فخاخهم! أما قلوبهم، فقد تدربت على الشهوة والطمع. إنهم حقا أبناء اللعنة!"], [15, "وإذ خرجوا عن الطريق المستقيم، ضلوا. فهم سائرون في طريق بلعام بن بعور، الذي أحب الحصول على المال أجرة لإثمه."], [16, "ولكنه توبخ على هذه المخالفة التي ارتكبها. إذ إن الحمار الأبكم نطق بصوت بشري، فوضع حدا لحماقة ذلك النبي!"], [17, "فليس هؤلاء إلا آبارا لا ماء فيها، وغيوما تسوقها الريح العاصفة. ويا له من مصير مرعب محجوز لهم في الظلام الأبدي القاتم!"]]}, {"l": "Jud 1:12", "n": "", "vs": [[12, "إنهم يشتركون معكم في ولائم المحبة دون خجل، ولكنهم كصخور تعيقكم. لا هم لهم سوى تعليف أنفسهم! إنهم يشبهون غيوما بلا مطر تسوقها الرياح، وأشجارا خريفية بلا ثمر، يقتلعها أصحابها، فتكون قد ماتت مرتين."]]}, {"l": "Jud 1:13", "n": "", "vs": [[13, "وبأعمالهم المخجلة يفضحون أنفسهم كأمواج في البحر هائجة تقذف الأوساخ. وهم أشبه بنجوم تائهة في الفضاء، مصيرها الظلام الشديد إلى الأبد!"]]}], "kwAr": "كقرقعة", "noteAr": ""}, {"kw": "crackling", "raw": "Heb. sound", "note": "Heb. sound", "refs": [], "kwAr": "الشوك", "noteAr": "بالعبرانية: صوت."}, {"kw": "the laughter", "raw": "Pro_29:9", "note": "", "refs": [{"l": "Pro 29:9", "n": "", "vs": [[9, "إن خاصم الحكيم سفيها، لن يجد راحة، سواء غضب السفيه أو ضحك."]]}], "kwAr": "ضحك الجهال", "noteAr": ""}], "arS": [["لأن", ["H3588"]], [" ", []], ["ضحك", ["H7814"]], [" ", []], ["الجهال", ["H3684"]], [" ", []], ["كقرقعة", ["H6963"]], [" ", []], ["الشوك", ["H5518"]], [" ", []], ["تحت", ["H8478"]], [" ", []], ["القدر", ["H5518"]], ["، ", []], ["وهذا", ["H2088"]], [" ", []], ["أيضا", ["H1571"]], [" ", []], ["باطل", ["H1892"]], [".", []]]}, {"c": 7, "v": 7, "text": "الظلم يجعل الحكيم أحمق، والرشوة تفسد القلب.", "groups": [{"kw": "oppression", "raw": "Deu_28:33, Deu_28:34, Deu_28:65", "note": "", "refs": [{"l": "Deu 28:33", "n": "", "vs": [[33, "محصول أرضك وثمر تعبك يأكله شعب غريب عنك، ولا تكون سوى مظلوم مسحوق دائما."]]}, {"l": "Deu 28:34", "n": "", "vs": [[34, "ويصيبك الجنون من هول ما ترى."]]}, {"l": "Deu 28:65", "n": "", "vs": [[65, "ولا تجدون بين تلك الأمم اطمئنانا ولا مقرا لقدم، بل يعطيكم الرب قلبا هلعا، وعيونا أوهنها الترقب، ونفوسا يائسة."]]}], "kwAr": "الظلم", "noteAr": ""}, {"kw": "a gift", "raw": "Exo_23:8; Deu_16:19; 1Sa_8:3, 1Sa_12:3; Pro_17:23; Isa_1:23, Isa_33:15", "note": "", "refs": [{"l": "Exo 23:8", "n": "", "vs": [[8, "لا تقبل رشوة لأن الرشوة تعمي المبصرين وتحرف أقوال الصالحين."]]}, {"l": "Deu 16:19", "n": "", "vs": [[19, "لا تعوجوا القضاء ولا تحابوا، ولا تقبلوا رشوة، لأن الرشوة تعمي أبصار الحكماء، وتعوج أقوال الصديقين."]]}, {"l": "1Sa 8:3", "n": "", "vs": [[3, "غير أنهما لم يسلكا في طريقه، بل غويا وراء المكسب وقبلا الرشوة وحابيا في القضاء."]]}, {"l": "1Sa 12:3", "n": "", "vs": [[3, "فاشهدوا علي في حضرة الرب، وأمام ملكه المختار، إن كنت قد أخذت ثورا أو حمارا من أحد، أو ظلمت أو جرت على أحد أو قبلت رشوة من أحد لأغمض عيني عنه، فأعوض ذلك عليكم»."]]}, {"l": "Pro 17:23", "n": "", "vs": [[23, "الشرير يأخذ الرشوة من الحضن ليحرف سير القضاء."]]}, {"l": "Isa 1:23", "n": "", "vs": [[23, "أصبح رؤساؤك عصاة وشركاء لصوص، يولعون بالرشوة ويسعون وراء الهبات، لا يدافعون عن اليتيم، ولا ترفع إليهم دعوى الأرملة»."]]}, {"l": "Isa 33:15", "n": "", "vs": [[15, "السالك في البر، والناطق بالحق، والنابذ ربح الظلم، والنافض يديه من قبض الرشوة، الصام أذنيه عن الاستماع إلى مؤامرات سفك الدماء، المغمض عينيه عن التأمل في الشر،"]]}], "kwAr": "والرشوة", "noteAr": ""}], "arS": [["الظلم", ["H6233"]], [" يجعل ", []], ["الحكيم", ["H2450"]], [" ", []], ["أحمق", ["H1984"]], ["، ", []], ["والرشوة", ["H4979"]], [" ", []], ["تفسد", ["H6"]], [" ", []], ["القلب", ["H3820"]], [".", []]]}, {"c": 7, "v": 8, "text": "نهاية أمر خير من بدايته، والصبر خير من العجرفة.", "groups": [{"kw": "Better", "raw": "Psa_126:5, Psa_126:6; Isa_10:24, Isa_10:25, Isa_10:28-34; Luk_16:25; Jam_5:11; 1Pe_1:13", "note": "", "refs": [{"l": "Psa 126:5", "n": "", "vs": [[5, "فمن يزرع بالدموع يحصد غلاته بالابتهاج."]]}, {"l": "Psa 126:6", "n": "", "vs": [[6, "ومن يذهب باكيا حاملا بذاره يرجع مترنما حاملا حزم حصيده."]]}, {"l": "Isa 10:24", "n": "", "vs": [[24, "لذلك هكذا يقول الرب القدير: «ياشعبي المقيم في صهيون، لا تخف من أشور عندما يضربك بقضيب، ويرفع عليك عصاه كما فعل المصريون،"]]}, {"l": "Isa 10:25", "n": "", "vs": [[25, "فإنه عما قليل يكتمل سخطي، وينصب غضبي لإبادتهم»."]]}, {"l": "Isa 10:28-34", "n": "", "vs": [[28, "ها هو جيش أشور مقبل؛ قد وصل إلى عياث، واجتاز بمجرون. وضع مؤونته في مخماش."], [29, "قطعوا المعبر، وباتوا في جبع. ارتعد أهل الرامة، وهرب سكان جبعة شاول."], [30, "اصرخي يابنت جليم، واسمعي ياليشة، وأجيبي يامدينة عناثوث."], [31, "هرب أهل مدمنة. فر سكان جيبيم طلبا للنجاة."], [32, "اليوم يتوقف في نوب ويهز قبضته على جبل بنت صهيون، أكمة أورشليم."], [33, "لكن الرب القدير يحطم الأغصان بعنفوان. فكل متطاول يقطع، وكل متشامخ يذل."], [34, "تستأصل أجمات الغابة بفأس، ويسقط لبنان أمام جبار مهوب."]]}, {"l": "Luk 16:25", "n": "", "vs": [[25, "ولكن إبراهيم قال: يابني، تذكر أنك نلت خيراتك كاملة في أثناء حياتك، ولعازر نال البلايا. ولكنه الآن يتعزى هنا، وأنت هناك تتعذب."]]}, {"l": "Jam 5:11", "n": "", "vs": [[11, "فنحن نقول عن الصابرين على الألم: «طوبى لهم!» وقد سمعتم بصبر أيوب، ورأيتم كيف عامله الرب في النهاية. وهذا يبين أن الرب كثير الرحمة والشفقة."]]}, {"l": "1Pe 1:13", "n": "", "vs": [[13, "لذلك اجعلوا أذهانكم متنبهة دائما، وتيقظوا، وعلقوا رجاءكم كله على النعمة التي ستكون من نصيبكم عندما يعود يسوع المسيح ظاهرا بمجده!"]]}], "kwAr": "نهاية أمر خير", "noteAr": ""}, {"kw": "the patient", "raw": "Pro_13:10, Pro_14:29, Pro_15:18, Pro_16:32, Pro_28:25; Luk_21:19; Rom_2:7, Rom_2:8; Heb_10:36; Jam_5:8; 1Pe_2:20, 1Pe_2:21, 1Pe_5:5, 1Pe_5:6", "note": "", "refs": [{"l": "Pro 13:10", "n": "", "vs": [[10, "تولد الكبرياء الخصومة، أما المشاورون فذوو حكمة."]]}, {"l": "Pro 14:29", "n": "", "vs": [[29, "البطيء الغضب ذو فهم كثير، أما السريع إلى السخط فيبدي حماقة."]]}, {"l": "Pro 15:18", "n": "", "vs": [[18, "الرجل الغضوب يثير الخصومة، والطويل الأناة يسكن النزاع."]]}, {"l": "Pro 16:32", "n": "", "vs": [[32, "البطيء الغضب خير من المحارب العاتي، والضابط أهواء روحه خير من قاهر المدن."]]}, {"l": "Pro 28:25", "n": "", "vs": [[25, "الإنسان الجشع يثير النزاع، والمتوكل على الرب يغنى."]]}, {"l": "Luk 21:19", "n": "", "vs": [[19, "فباحتمالكم تربحون أنفسكم!"]]}, {"l": "Rom 2:7", "n": "", "vs": [[7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"]]}, {"l": "Rom 2:8", "n": "", "vs": [[8, "ويكون الغضب والسخط للمخاصمين الذين يرفضون الطاعة للحق ولكنهم يخضعون للإثم."]]}, {"l": "Heb 10:36", "n": "", "vs": [[36, "إنكم تحتاجون إلى الصبر لتعملوا إرادة الله، فتنالوا البركة التي وعدتم بها."]]}, {"l": "Jam 5:8", "n": "", "vs": [[8, "فاصبروا أنتم إذن، وشددوا قلوبكم لأن عودة الرب قد صارت قريبة."]]}, {"l": "1Pe 2:20", "n": "", "vs": [[20, "فبالحقيقة، أي مجد لكم إن كنتم تصبرون وأنتم تتحملون قصاص أخطائكم؟ لا فضل لكم عند الله إلا إذا تحملتم الآلام صابرين، وأنتم تفعلون الصواب."]]}, {"l": "1Pe 2:21", "n": "", "vs": [[21, "لأن الله دعاكم إلى الاشتراك في هذا النوع من الآلام. فالمسيح، الذي تألم لأجلكم، هو القدوة التي تقتدون بها. فسيروا على آثار خطواته:"]]}, {"l": "1Pe 5:5", "n": "", "vs": [[5, "كذلك، أيها الشباب، اخضعوا للشيوخ. البسوا جميعا ثوب التواضع في معاملتكم بعضكم لبعض. لأن الله يقاوم المتكبرين، ولكنه يعطي المتواضعين نعمة."]]}, {"l": "1Pe 5:6", "n": "", "vs": [[6, "إذن، تواضعوا تحت يد الله القديرة لكي يرفعكم عندما يحين الوقت،"]]}], "kwAr": "والصبر", "noteAr": ""}], "arS": [["نهاية", ["H4480", "H319"]], [" ", []], ["أمر", ["H1697"]], [" ", []], ["خير", ["H2896"]], [" ", []], ["من", ["H4480"]], [" ", []], ["بدايته", ["H7225"]], ["، ", []], ["والصبر", ["H750", "H7307"]], [" ", []], ["خير", ["H2896"]], [" من ", []], ["العجرفة", ["H1362", "H7307"]], [".", []]]}, {"c": 7, "v": 9, "text": "لا يستسلم قلبك سريعا للغضب، لأن الغضب يستقر في صدور الجهال.", "groups": [{"kw": "hasty", "raw": "1Sa_25:21, 1Sa_25:22; 2Sa_19:43; Est_3:5, Est_3:6; Pro_14:17, Pro_16:32; Jon_4:9; Eph_4:26, Eph_4:27; Jam_1:19", "note": "", "refs": [{"l": "1Sa 25:21", "n": "", "vs": [[21, "وكان داود آنئذ يحدث نفسه: «لقد حافظت على كل قطعان هذا الرجل في الصحراء، فكافأني شرا بدل الخير."]]}, {"l": "1Sa 25:22", "n": "", "vs": [[22, "فليضاعف الرب من عقاب داود، إن لم أقض على كل رجاله قبل طلوع ضوء الصباح»."]]}, {"l": "2Sa 19:43", "n": "", "vs": [[43, "فقال رجال إسرائيل لرجال يهوذا: «إن لنا عشرة سهام في الملك، ونحن أولى منكم بداود، فلماذا استخففتم بنا؟ أولم نكن نحن أول من تحدث عن إرجاع ملكنا؟» فكان رد رجال يهوذا أغلظ من كلام رجال إسرائيل."]]}, {"l": "Est 3:5", "n": "", "vs": [[5, "وعندما تثبت هامان من أن مردخاي لا ينحني ولا يسجد له استشاط غضبا،"]]}, {"l": "Est 3:6", "n": "", "vs": [[6, "واستصغر أن يعاقب مردخاي وحده، بعد أن أخبروه عن شعب مردخاي. فعزم أن يفني جميع اليهود، شعب مردخاي، المقيمين في كل أرجاء مملكة أحشويروش."]]}, {"l": "Pro 14:17", "n": "", "vs": [[17, "ذو الطبع الحاد يتصرف بحمق، وذو المكائد ممقوت."]]}, {"l": "Pro 16:32", "n": "", "vs": [[32, "البطيء الغضب خير من المحارب العاتي، والضابط أهواء روحه خير من قاهر المدن."]]}, {"l": "Jon 4:9", "n": "", "vs": [[9, "فقال الله ليونان: «أأنت محق في غضبك من أجل اليقطينة؟» فأجاب: «أنا محق في غضبي حتى الموت»."]]}, {"l": "Eph 4:26", "n": "", "vs": [[26, "إن غضبتم، فلا تخطئوا؛ لا تدعوا الشمس تغيب وأنتم غاضبون،"]]}, {"l": "Eph 4:27", "n": "", "vs": [[27, "ولا تتيحوا فرصة لإبليس!"]]}, {"l": "Jam 1:19", "n": "", "vs": [[19, "لذلك، ياإخوتي الأحباء، على كل واحد منكم أن يكون مسرعا إلى الإصغاء، غير متسرع في الكلام، بطيء الغضب."]]}], "kwAr": "سريعا للغضب", "noteAr": ""}, {"kw": "anger", "raw": "Gen_4:5, Gen_4:6, Gen_4:8, Gen_34:7, Gen_34:8, Gen_34:25, Gen_34:26, Gen_34:30, Gen_34:31; 2Sa_13:22, 2Sa_13:28, 2Sa_13:32; Pro_26:23-26; Mar_6:19, Mar_6:24", "note": "", "refs": [{"l": "Gen 4:5", "n": "", "vs": [[5, "لكنه لم يتقبل قربان قايين ولم يرض عنه. فاغتاظ قايين جدا وتجهم وجهه كمدا."]]}, {"l": "Gen 4:6", "n": "", "vs": [[6, "فسأل الرب قايين: «لماذا اغتظت؟ لماذا تجهم وجهك؟"]]}, {"l": "Gen 4:8", "n": "", "vs": [[8, "وعاد قايين يتظاهر بالود لأخيه هابيل. وحدث إذ كانا معا في الحقل أن قايين هجم على أخيه هابيل وقتله."]]}, {"l": "Gen 34:7", "n": "", "vs": [[7, "وأتى بنو يعقوب من الحقل عندما سمعوا بالأمر، وقد استشاطوا غضبا وغيظا لأن شكيم قد ارتكب فاحشة في إسرائيل بمضاجعة ابنة يعقوب، وهو أمر محظور."]]}, {"l": "Gen 34:8", "n": "", "vs": [[8, "وقال حمور: «لقد تعلقت نفس ابني شكيم بابنتكم، فأطلب إليكم أن تزوجوه منها."]]}, {"l": "Gen 34:25", "n": "", "vs": [[25, "وفي اليوم الثالث، بينما هم مازالوا متوجعين، تقلد كل من شمعون ولاوي ابني يعقوب وأخوي دينة، سيفه، ودخلا المدينة بجراءة وقتلا كل الذكور."]]}, {"l": "Gen 34:26", "n": "", "vs": [[26, "وقتلا أيضا حمور وشكيم بحد السيف، وأنقذا دينة من بيت شكيم وخرجا."]]}, {"l": "Gen 34:30", "n": "", "vs": [[30, "فقال يعقوب لشمعون ولاوي: «لقد جلبتما علي الشقاء وكراهية الكنعانيين والفرزيين الساكنين في هذه البلاد. وها أنا نفر قليل، فيتألبون علي ويقتلونني، فأبيد أنا وبيتي»."]]}, {"l": "Gen 34:31", "n": "", "vs": [[31, "فقالا له: «أنظير زانية يعامل أختنا؟ »."]]}, {"l": "2Sa 13:22", "n": "", "vs": [[22, "أما أبشالوم فلم يخاطب أمنون بخير أو شر، لكنه أضمر له بغضا شديدا لأنه انتهك حرمة أخته ثامار."]]}, {"l": "2Sa 13:28", "n": "", "vs": [[28, "وأوصى أبشالوم رجاله: «متى ذهبت الخمر بعقل أمنون وقلت لكم اضربوا أمنون واقتلوه، فلا تخافوا. ألست أنا الذي أمرتكم بذلك؟ تشجعوا وتصرفوا كأبطال»."]]}, {"l": "2Sa 13:32", "n": "", "vs": [[32, "ولكن يوناداب بن شمعي أخي داود قال: «لا يظن سيدي أنهم قتلوا جميع أبناء الاملك. إنما أمنون وحده هو الذي مات، لأن أبشالوم قد أضمر له هذا الشر منذ أن اغتصب أخته ثامار."]]}, {"l": "Pro 26:23-26", "n": "", "vs": [[23, "الشفتان المتوهجتان والقلب الشرير مثل فضة زغل تغطي خزفة."], [24, "الرجل الماكر يطلي نواياه بمعسول الشفاه، ولكنه يراعي الحقد في قلبه،"], [25, "إن تملقك بعذوبة حديثه، فلا تأتمنه، لأن قلبه مفعم بسبعة صنوف من الرجاسات."], [26, "إن وارى حقده بمكر، فإن نفاقه يفتضح بين الجماعة."]]}, {"l": "Mar 6:19", "n": "", "vs": [[19, "فكانت هيروديا ناقمة على يوحنا، وتتمنى أن تقتله، ولكنها لم تستطع."]]}, {"l": "Mar 6:24", "n": "", "vs": [[24, "فخرجت وسألت أمها: «ماذا أطلب؟» فأجابت: «رأس يوحنا المعمدان!»"]]}], "kwAr": "الغضب يستقر", "noteAr": ""}], "arS": [["لا", ["H408"]], [" ", []], ["يستسلم", ["H926"]], [" قلبك سريعا ", []], ["للغضب", ["H3707"]], ["، ", []], ["لأن", ["H3588"]], [" ", []], ["الغضب", ["H3708"]], [" ", []], ["يستقر", ["H5117"]], [" في ", []], ["صدور", ["H2436"]], [" ", []], ["الجهال", ["H3684"]], [".", []]]}, {"c": 7, "v": 10, "text": "لا تقل: كيف حدث أن الأيام الماضية كانت خيرا من هذه الأيام؟ لأن سؤالك هذا لا ينم عن حكمة.", "groups": [{"kw": "What", "raw": "Jdg_6:13; Jer_44:17-19", "note": "", "refs": [{"l": "Jdg 6:13", "n": "", "vs": [[13, "فقال له جدعون: «دعني أسألك ياسيدي: إن كان الرب معنا، فلماذا أصابنا كل هذا البلاء؟ وأين كل عجائبه التي حدثنا بها آباؤنا قائلين: ألم يخرجنا الرب من مصر؟ والآن قد نبذنا الرب وجعلنا في قبضة مديان»."]]}, {"l": "Jer 44:17-19", "n": "", "vs": [[17, "بل نعمل بمقتضى ما تعهدنا به، فنحرق بخورا لملكة السماء ونقرب لها السكائب كما سبق أن فعلنا نحن وآباؤنا وملوكنا ورؤساؤنا في مدن يهوذا وفي شوارع أورشليم، فكانت لنا وفرة من الطعام وتمتعنا بالخير ولم يصبنا شر."], [18, "ولكن منذ أن أهملنا إحراق البخور لملكة السماء وتقريب السكائب لها، افتقرنا إلى كل شيء، وفنينا بالسيف والجوع»."], [19, "وقالت النساء: «عندما أحرقنا البخور لملكة السماء وقربنا لها السكائب وعملنا أقراصا مماثلة لصورتها، وقربنا السكائب لها هل فعلنا ذلك بغير علم أزواجنا؟»"]]}], "kwAr": "كيف حدث", "noteAr": ""}, {"kw": "wisely", "raw": "Heb. out of wisdom, Gen_6:11, Gen_6:12; Psa_14:2, Psa_14:3; Isa_50:1; Rom_1:22-32, Rom_3:9-19", "note": "Heb. out of wisdom, Gen_6:11, Gen_6:12; Psa_14:2, Psa_14:3; Isa_50:1; Rom_1:22-32, Rom_3:9-19", "refs": [{"l": "Gen 6:11", "n": "", "vs": [[11, "وإذ ساد الشر الأرض أمام الله وعمها الظلم،"]]}, {"l": "Gen 6:12", "n": "", "vs": [[12, "نظر الله وإذا بها فاسدة لأن كل بشر على الأرض قد سلك في طريق الإثم."]]}, {"l": "Psa 14:2", "n": "", "vs": [[2, "أشرف الرب على بني آدم ليرى هل هناك أي فاهم يطلب الله ؟"]]}, {"l": "Psa 14:3", "n": "", "vs": [[3, "فإذا الجميع قد ضلوا على السواء. كلهم فسدوا، وليس بينهم من يعمل الصلاح، ولا واحد."]]}, {"l": "Isa 50:1", "n": "", "vs": [[1, "هذا ما يقوله الرب: أين كتاب طلاق أمكم الذي طلقتها به؟ لمن من دائني بعتكم؟ إنما من أجل ذنوبكم قد تم بيعكم، ومن جراء خطاياكم قد طلقت أمكم."]]}, {"l": "Rom 1:22-32", "n": "", "vs": [[22, "وفيما يدعون أنهم حكماء، صاروا جهالا،"], [23, "واستبدلوا بمجد الله الخالد تماثيل لصور الإنسان الفاني والطيور وذوات الأربع والزواحف."], [24, "لذلك أسلمهم الله ، في شهوات قلوبهم، إلى النجاسة، ليهينوا أجسادهم فيما بينهم."], [25, "إذ قد استبدلوا بحق الله ما هو باطل، فاتقوا المخلوق وعبدوه بدل الخالق، المبارك إلى الأبد. آمين!"], [26, "لهذا السبب أسلمهم الله إلى الشهوات المخزية. فإن إناثهم تحولن عن استعمال أجسادهن بالطريقة الطبيعية إلى استعمالها بطريقة مخالفة للطبيعة."], [27, "وكذلك تحول الذكور أيضا عن استعمال الأنثى بالطريقة الطبيعية، والتهبوا شهوة بعضهم لبعض، مرتكبين الفحشاء ذكورا بذكور، فاستحقوا أن ينالوا في أنفسهم الجزاء العادل على ضلالهم."], [28, "وبما أنهم لم يتخيروا إبقاء الله ضمن معرفتهم، أسلمهم الله إلى ذهن عاطل عن التمييز دفعهم إلى ممارسة الأمور غير اللائقة."], [29, "إذ قد امتلأوا من كل إثم وشر وجشع وخبث، وشحنوا حسدا وقتلا وخصاما ومكرا وسوءا. وهم ثرثارون،"], [30, "مغتابون، كارهون لله، شتامون، متكبرون، متفاخرون، مخترعون للشرور، غير طائعين للوالدين."], [31, "لا فهم عندهم، ولا أمانة، ولا حنان، ولا رحمة."], [32, "إنهم يعلمون حكم الله العادل: أن الذين يفعلون هذه الأمور يستوجبون الموت؛ ومع ذلك، لا يمارسونها وحسب، بل يسرون بفاعليها."]]}, {"l": "Rom 3:9-19", "n": "", "vs": [[9, "فماذا إذن؟ أنحن اليهود أفضل؟ لا، على الإطلاق! فإننا، في ما سبق، قد اتهمنا اليهود واليونانيين بكونهم جميعا تحت الخطيئة،"], [10, "كما قد كتب:"], [11, "ليس من يبحث عن الله."], [12, "جميع الناس قد ضلوا، وصاروا كلهم بلا نفع. ليس من يمارس الصلاح، لا ولا واحد."], [13, "حناجرهم قبور مفتوحة؛ ألسنتهم أدوات للمكر؛ شفاههم تخفي سم الأفاعي القاتلة؛"], [14, "أفواههم مملوءة لعنة ومرارة،"], [15, "أقدامهم سريعة إلى سفك الدماء؛"], [16, "في طرقهم الخراب والشقاء؛"], [17, "أما طريق السلام فلم يعرفوه؛"], [18, "ومخافة الله ليست نصب عيونهم»."], [19, "ونحن نعلم أن كل ما تقوله الشريعة إنما تخاطب به الذين هم تحت الشريعة، لكي يسد كل فم ويقع العالم كله تحت دينونة من الله."]]}], "kwAr": "عن حكمة", "noteAr": "بالعبرانية: من حكمة. انظر تك 6: 11، 12؛ مز 14: 2، 3؛ إش 50: 1؛ رو 1: 22-32؛ 3: 9-19"}], "arS": [["لا", ["H3808"]], [" ", []], ["تقل", ["H559"]], [": ", []], ["كيف", ["H4100"]], [" ", []], ["حدث", ["H1961"]], [" ", []], ["أن", ["H3588"]], [" ", []], ["الأيام", ["H3117"]], [" ", []], ["الماضية", ["H7223"]], [" ", []], ["كانت", ["H1961"]], [" ", []], ["خيرا", ["H2896"]], [" ", []], ["من", ["H4480"]], [" ", []], ["هذه", ["H428"]], [" الأيام؟ ", []], ["لأن", ["H5921"]], [" ", []], ["سؤالك", ["H7592"]], [" ", []], ["هذا", ["H2088"]], [" ", []], ["لا", ["H408"]], [" ينم ", []], ["عن", ["H4480"]], [" ", []], ["حكمة", ["H2451"]], [".", []]]}, {"c": 7, "v": 11, "text": "الحكمة مع الميراث صالحة وذات منفعة للأحياء.", "groups": [{"kw": "good with an inheritance", "raw": "or, as good as an inheritance, yea, better too. Ecc_9:15-18; 1Ki_3:6-9; Luk_16:8, Luk_16:9; 1Ti_6:17-19", "note": "or, as good as an inheritance, yea, better too. Ecc_9:15-18; 1Ki_3:6-9; Luk_16:8, Luk_16:9; 1Ti_6:17-19", "refs": [{"l": "Ecc 9:15-18", "n": "", "vs": [[15, "وكان يقيم في تلك المدينة رجل مسكين حكيم أنقذ المدينة بفضل حكمته. ولكن أحدا لم يذكره."], [16, "فقلت: إن الحكمة خير من القوة. غير أن حكمة المسكين محتقرة وكلامه غير مسموع."], [17, "كلام الحكماء المسموع في الهدوء خير من صراخ الحكام بين الجهال."], [18, "الحكمة خير من آلات الحرب، وخاطيء واحد يفسد خيرا جزيلا."]]}, {"l": "1Ki 3:6-9", "n": "", "vs": [[6, "فأجاب: «لقد صنعت إلى عبدك داود أبي رحمة واسعة لأنه سلك أمامك بأمانة وصلاح واستقامة قلب، فلم تحرمه من الرحمة العظيمة، ورزقته ابنا يخلفه على عرشه في هذا اليوم."], [7, "والآن أيها الرب إلهي، لقد جعلت عبدك ملكا خلفا لداود أبي، وأنا ما برحت فتى صغيرا غير متمرس بشؤون الحكم،"], [8, "وعبدك يتولى حكم شعبك الذي اخترته، وهو شعب أعظم من أن يعد أو يحصى لكثرته."], [9, "فهب عبدك قلبا فهيما لأقضي بين شعبك، وأميز بين الخير والشر، لأنه من يستطيع أن يحكم شعبك العظيم هذا؟»"]]}, {"l": "Luk 16:8", "n": "", "vs": [[8, "فامتدح السيد وكيله الخائن لأنه تصرف بحكمة. فإن أبناء هذا العالم أحكم مع أهل جيلهم من أبناء النور."]]}, {"l": "Luk 16:9", "n": "", "vs": [[9, "وأقول لكم: اكسبوا لكم أصدقاء بمال الظلم، حتى إذا فني مالكم، تقبلون في المنازل الأبدية!"]]}, {"l": "1Ti 6:17-19", "n": "", "vs": [[17, "أوص أغنياء هذا الزمان بأن لا يتكبروا، ولا يتكلوا على الغنى غير الثابت، بل على الله الذي يمنحنا كل شيء بوفرة لنتمتع به،"], [18, "وأن يفعلوا خيرا، ويكونوا أغنياء بالأعمال الصالحة، ويوزعوا بسخاء، ويكونوا على استعداد دائم لإشراك الآخرين في خيراتهم."], [19, "وبذلك يوفرون لأنفسهم رأس مال للمستقبل، حتى يمسكوا بالحياة الحقيقية."]]}], "kwAr": "الحكمة مع الميراث صالحة", "noteAr": "أو: صالحة كالميراث، بل أفضل منه. انظر جا 9: 15-18؛ 1مل 3: 6-9؛ لو 16: 8، 9؛ 1تي 6: 17-19"}, {"kw": "them", "raw": "Ecc_11:7", "note": "", "refs": [{"l": "Ecc 11 16, Ecc_8:14, Ecc_9:1, Ecc_9:2; 1Sa_22:18, 1Sa_22:19; 1Ki_21:13; 2Ch_24:21, 2Ch_24:22; Job_9:22, Job_9:23; Mat_23:34, Mat_23:35; Joh_16:2; Act_7:52", "note": "", "refs": [{"l": "Ecc 3:16", "n": "", "vs": [[16, "ورأيت أيضا تحت الشمس: الجور في موضع العدل، والظلم في موضع الحق."]]}, {"l": "Ecc 8:14", "n": "", "vs": [[14, "في الأرض يسود باطل: هناك صديقون ينالهم جزاء أعمال الأشرار، وأشرار يحظون بثواب أعمال الأبرار، فقلت: هذا أيضا باطل."]]}, {"l": "Ecc 9:1", "n": "", "vs": [[1, "هذا كله ادخرته في قلبي واختبرته: أن الأبرار والحكماء، وما يصدر عنهم من أعمال، في يد الله، ولا أحد يدري ما ينتظره، حبا كان أم بغضا،"]]}, {"l": "Ecc 9:2", "n": "", "vs": [[2, "إذ الجميع معرضون لنفس المصير، الصالحون والطالحون، الأخيار والأشرار، الطاهر والنجس، المقرب للذبائح وغير المقرب. فالصالح كالطالح سيان، والحالف كمن يخشى الحلف."]]}, {"l": "1Sa 22:18", "n": "", "vs": [[18, "فأمر الملك دواغ قائلا: «در أنت واقتل الكهنة». فهجم دواغ الأدومي على الكهنة وقتل منهم في ذلك اليوم خمسة وثمانين رجلا لابسي أفود كتان."]]}, {"l": "1Sa 22:19", "n": "", "vs": [[19, "ثم اقتحم نوب مدينة الكهنة وقتل بحد السيف الرجال والنساء والأطفال والرضع والثيران والحمير والغنم."]]}, {"l": "1Ki 21:13", "n": "", "vs": [[13, "ثم أقبل شاهدا زور وجلسا تجاهه، وشهدا على نابوت أمام الشعب قائلين: «قد جدف نابوت على الله وعلى الملك». فجروه إلى خارج المدينة ورجموه بالحجارة حتى مات."]]}, {"l": "2Ch 24:21", "n": "", "vs": [[21, "فكادوا له حتى أمر الملك برجمه بالحجارة في ساحة الهيكل."]]}, {"l": "2Ch 24:22", "n": "", "vs": [[22, "ولم يذكر الملك الفضل الذي أسداه إليه يهوياداع، بل قتل ابنه، وفيما هو يلفظ أنفاسه قال: «لينظر الرب ويجر قضاءه»."]]}, {"l": "Job 9:22", "n": "", "vs": [[22, "ولكن الأمر سيان، لذلك قلت: إنه يفني الكامل والشرير على حد سواء!"]]}, {"l": "Job 9:23", "n": "", "vs": [[23, "عندما تؤدي ضربات السوط إلى الموت المفاجيء يسخر من بؤس الأبرياء"]]}, {"l": "Mat 23:34", "n": "", "vs": [[34, "لذلك: ها أنا أرسل إليكم أنبياء وحكماء ومعلمين، فبعضهم تقتلون وتصلبون، وبعضهم تجلدون في مجامعكم، وتطاردونهم من مدينة إلى أخرى."]]}, {"l": "Mat 23:35", "n": "", "vs": [[35, "وبهذا يقع عليكم كل دم زكي سفك على الأرض: من دم هابيل البار إلى دم زكريا بن برخيا الذي قتلتموه بين الهيكل والمذبح."]]}, {"l": "Joh 16:2", "n": "", "vs": [[2, "ستطردون خارج المجامع، بل سيأتي وقت يظن فيه من يقتلكم أنه يؤدي خدمة لله."]]}, {"l": "Act 7:52", "n": "", "vs": [[52, "فأي نبي نجا من اضطهادهم وقد قتلوا الذين أنبأوا بمجيء البار الذي سلمتموه أنتم وقتلتموه!"]]}], "kwAr": "رب صديق يهلك", "noteAr": ""}, {"kw": "there is a wicked", "raw": "Ecc_8:12, Ecc_8:13; Job_21:7-15; Psa_73:3-13; Isa_65:20; Jer_12:1, Jer_12:2", "note": "", "refs": [{"l": "Ecc 8:12", "n": "", "vs": [[12, "ومع أن الخاطيء يرتكب الشر مئة مرة وتطول أيامه، إلا أنني أعلم أنه يكون خير لمتقي الله الذين يخشعون في حضرته."]]}, {"l": "Ecc 8:13", "n": "", "vs": [[13, "أما الأشرار الذين لا يتقون الله فلن ينالوا خيرا، ولن تطول أيامهم التي تشبه الظل، لأنهم لا يخشون الله ."]]}, {"l": "Job 21:7-15", "n": "", "vs": [[7, "لماذا يحيا الأشرار ويطعنون في السن ويزدادون قوة؟"], [8, "ذريتهم تتأصل أمامهم، ونسلهم يتكاثرون في أثناء حياتهم."], [9, "بيوتهم آمنة من المخاوف، وعصا الله لا تنزل عليهم."], [10, "ثورهم يلقح ولا يخفق، وبقرتهم تلد ولا تسقط."], [11, "يسرحون صبيانهم كسرب، وأطفالهم يرقصون."], [12, "يغنون بالدف والعود ويطربون لصوت المزمار،"], [13, "يقضون أيامهم في الرغد، ثم في لحظة يهبطون إلى الهاوية."], [14, "يقولون للرب: فارقنا فإننا لا نعبأ بمعرفة طرقك."], [15, "من هو القدير حتى نعبده؟ وأي كسب نجنيه إن صلينا إليه؟"]]}, {"l": "Psa 73:3-13", "n": "", "vs": [[3, "لأني حسدت المتكبرين، إذ شاهدت نجاح الأشرار."], [4, "فإن أوجاع الموت لا تصيبهم وأجسامهم سمينة."], [5, "لا يقاسون من أتعاب البشر، ولا يعانون من المصائب كالناس."], [6, "لذلك لبسوا الكبرياء كقلادة، وارتدوا الظلم كثوب."], [7, "عيونهم جاحظة من كثرة شحم طمعهم. وشرهم تجاوز ما يتصوره القلب."], [8, "يستهزئون ويتكلمون بالظلم خبثا، وبكبرياء ينطقون."], [9, "جدفوا على السماء بأفواههم، ولوثوا الأرض بخبث ألسنتهم."], [10, "حتى شعب الله يرجعون إليهم، ويصدقون ما يقولونه لهم."], [11, "أما هم فيقولون: كيف يعلم الله، وهل يدري العلي بما يحدث؟"], [12, "ها هم الأشرار المفلحون في العالم يزدادون ثروة."], [13, "باطلا قد طهرت قلبي وغسلت يدي بالنقاوة."]]}, {"l": "Isa 65:20", "n": "", "vs": [[20, "ولا يكون فيها بعد طفل لا يعيش سوى أيام قلائل، أو شيخ لا يستوفي أيامه. ومن يموت ابن مئة سنة يعتبر فتى، ومن لا يبلغها يكون ملعونا."]]}, {"l": "Jer 12:1", "n": "", "vs": [[1, "أنت دائما عادل حين أعرض عليك دعواي، ولكن دعني أحدثك بشأن أحكامك: لماذا تفلح طريق الأشرار؟ ولماذا يتمتع الغادرون بالعيش الرغيد؟"]]}, {"l": "Jer 12:2", "n": "", "vs": [[2, "أنت غرستهم فتأصلوا ونموا وأثمروا. اسمك يتردد على أفواههم، ولكنه بعيد عن قلوبهم."]]}], "kwAr": "منافق تطول أيامه", "noteAr": ""}], "arS": [["لقد ", []], ["شاهدت", ["H7200"]], [" هذه ", []], ["جميعها", ["H3605"]], [" في ", []], ["أيام", ["H3117"]], [" ", []], ["أباطيلي", ["H1892"]], [": رب ", []], ["صديق", ["H6662"]], [" ", []], ["يهلك", ["H6"]], [" في ", []], ["بره", ["H6664"]], ["، ", []], ["ومنافق", ["H7563"]], [" ", []], ["تطول", ["H748"]], [" أيامه في ", []], ["شره", ["H7451"]], [".", []]]}, {"c": 7, "v": 16, "text": "لا تغال في برك ولا تبالغ في حكمتك، إذ لماذا تهلك نفسك؟", "groups": [{"kw": "Be not", "raw": "This verse is probably the language of an ungodly man; to which Solomon answers, as in the following verse, Do not multiply wickedness; do not add direct opposition to godliness, to the rest of your crimes. Why should you provoke God to destroy you before your time? Pro_25:16; Mat_6:1-7, Mat_9:14, Mat_15:2-9, Mat_23:5, Mat_23:23, Mat_23:24, Mat_23:29; Luk_18:12; Rom_10:2; Phi_3:6; 1Ti_4:3", "note": "This verse is probably the language of an ungodly man; to which Solomon answers, as in the following verse, Do not multiply wickedness; do not add direct opposition to godliness, to the rest of your crimes. Why should you provoke God to destroy you before your time? Pro_25:16; Mat_6:1-7, Mat_9:14, Mat_15:2-9, Mat_23:5, Mat_23:23, Mat_23:24, Mat_23:29; Luk_18:12; Rom_10:2; Phi_3:6; 1Ti_4:3", "refs": [{"l": "Pro 25:16", "n": "", "vs": [[16, "إن عثرت على عسل فكل منه ما يكفيك، لئلا تتخم فتتقيأه،"]]}, {"l": "Mat 6:1-7", "n": "", "vs": [[1, "احذروا من أن تعملوا بركم أمام الناس بقصد أن ينظروا إليكم. وإلا، فليس لكم مكافأة عند أبيكم الذي في السماوات."], [2, "فإذا تصدقت على أحد، فلا تنفخ أمامك في البوق، كما يفعل المراؤون في المجامع والشوارع، ليمدحهم الناس. الحق أقول لكم: إنهم قد نالوا مكافأتهم."], [3, "أما أنت، فعندما تتصدق على أحد، فلا تدع يدك اليسرى تعرف ما تفعله اليمنى."], [4, "لتكون صدقتك في الخفاء، وأبوك السماوي الذي يرى في الخفاء، هو يكافئك."], [5, "وعندما تصلون، لا تكونوا مثل المرائين الذين يحبون أن يصلوا واقفين في المجامع وفي زوايا الشوارع ليراهم الناس. الحق أقول لكم: إنهم قد نالوا مكافأتهم."], [6, "أما أنت، فعندما تصلي، فادخل غرفتك، وأغلق الباب عليك، وصل إلى أبيك الذي في الخفاء. وأبوك الذي يرى في الخفاء، هو يكافئك."], [7, "وعندما تصلون، لا تكرروا كلاما فارغا كما يفعل الوثنيون، ظنا منهم أنه بالإكثار من الكلام، يستجاب لهم."]]}, {"l": "Mat 9:14", "n": "", "vs": [[14, "ثم تقدم تلاميذ يوحنا إلى يسوع يسألونه: «لماذا نصوم نحن والفريسيون، ولا يصوم تلاميذك؟»"]]}, {"l": "Mat 15:2-9", "n": "", "vs": [[2, "«لماذا يخالف تلاميذك تقاليد الشيوخ، فلا يغسلون أيديهم قبل أن يأكلوا؟»"], [3, "فأجابهم «ولماذا تخالفون أنتم وصية الله من أجل المحافظة على تقاليدكم؟"], [4, "فقد أوصى الله قائلا: أكرم أباك وأمك. ومن أهان أباه أو أمه، فليكن الموت عقابا له."], [5, "ولكنكم أنتم تقولون: من قال لأبيه أو أمه: إن ما أعولك به قد قدمته قربانا للهيكل،"], [6, "فهو في حل من إكرام أبيه وأمه. وأنتم، بهذا، تلغون ما أوصى به الله ، محافظة على تقاليدكم."], [7, "أيها المراؤون! أحسن إشعياء إذ تنبأ عنكم فقال:"], [8, "هذا الشعب يكرمني بشفتيه، أما قلبه فبعيد عني جدا!"], [9, "إنما باطلا يعبدونني وهم يعلمون تعاليم ليست إلا وصايا الناس.»"]]}, {"l": "Mat 23:5", "n": "", "vs": [[5, "وكل ما يعملونه، فإنما يعملونه لكي يلفتوا نظر الناس إليهم. فهم يعرضون عصائبهم ويطيلون أطراف أثوابهم؛"]]}, {"l": "Mat 23:23", "n": "", "vs": [[23, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تؤدون حتى عشور النعنع والشبث والكمون، وقد أهملتم أهم ما في الشريعة: العدل والرحمة والأمانة. كان يجب أن تفعلوا هذه ولا تغفلوا تلك!"]]}, {"l": "Mat 23:24", "n": "", "vs": [[24, "أيها القادة العميان! إنكم تصفون الماء من البعوضة، ولكنكم تبلعون الجمل!"]]}, {"l": "Mat 23:29", "n": "", "vs": [[29, "«الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تبنون قبور الأنبياء وتزينون مدافن الأبرار،"]]}, {"l": "Luk 18:12", "n": "", "vs": [[12, "أصوم مرتين في الأسبوع، وأقدم عشر كل ما أجنيه!"]]}, {"l": "Rom 10:2", "n": "", "vs": [[2, "فإني أشهد لهم أن عندهم غيرة لله، ولكنها ليست على أساس المعرفة."]]}, {"l": "Phi 3:6", "n": "", "vs": [[6, "ومن جهة الحماسة، مضطهد للكنيسة؛ ومن جهة البر المطلوب في الشريعة، كنت بلا لوم."]]}, {"l": "1Ti 4:3", "n": "", "vs": [[3, "يحرمون الزواج، ويأمرون بالامتناع عن أطعمة خلقها الله ليتناولها المؤمنون وعارفو الحق شاكرين."]]}], "kwAr": "لا تغال في برك", "noteAr": "يحتمل أن هذه الآية كلام رجل شرير، فيجيبه سليمان كما في الآية التالية: لا تكثّر الشر؛ ولا تضف مقاومة مباشرة للتقوى إلى بقية جرائمك. فلماذا تستفز الله ليهلكك قبل أوانك؟ انظر أم 25: 16؛ مت 6: 1-7؛ 9: 14؛ 15: 2-9؛ 23: 5، 23، 24، 29؛ لو 18: 12؛ رو 10: 2؛ في 3: 6؛ 1تي 4: 3"}, {"kw": "neither", "raw": "Ecc_12:12; Gen_3:6; Job_11:12, Job_28:28; Pro_23:4; Rom_11:25, Rom_12:3; 1Co_3:18, 1Co_3:20; Col_2:18, Col_2:23; Jam_3:13-17", "note": "", "refs": [{"l": "Ecc 12:12", "n": "", "vs": [[12, "وما خلا ذلك، فاحذر منه يابني، إذ لا نهاية لتأليف كتب عديدة، والدراسة الكثيرة تجهد الجسد."]]}, {"l": "Gen 3:6", "n": "", "vs": [[6, "وعندما شاهدت المرأة أن الشجرة لذيذة للمأكل وشهية للعيون، ومثيرة للنظر قطفت من ثمرها وأكلت، ثم أعطت زوجها أيضا فأكل معها،"]]}, {"l": "Job 11:12", "n": "", "vs": [[12, "يصبح الأحمق حكيما عندما يلد حمار الوحش إنسانا."]]}, {"l": "Job 28:28", "n": "", "vs": [[28, "ثم قال للإنسان: انظر، إن مخافة الرب هي الحكمة، وتفادي الشر هو الفطنة»."]]}, {"l": "Pro 23:4", "n": "", "vs": [[4, "لا تشق طلبا للثراء. اكبح جماح نفسك بفضل فطنتك."]]}, {"l": "Rom 11:25", "n": "", "vs": [[25, "فإني لا أريد، أيها الإخوة، أن يخفى عليكم هذا السر، لكي لا تكونوا حكماء في نظر أنفسكم، وهو أن العمى قد أصاب إسرائيل جزئيا إلى أن يتم دخول الأمم كليا."]]}, {"l": "Rom 12:3", "n": "", "vs": [[3, "فإني، بالنعمة الموهوبة لي، أوصي كل واحد بينكم ألا يقدر نفسه تقديرا يفوق حقه، بل أن يكون متعقلا في تفكيره، بحسب مقدار الإيمان الذي قسمه الله لكل منكم."]]}, {"l": "1Co 3:18", "n": "", "vs": [[18, "حذار أن يخدع أحد منكم نفسه! إن ظن أحد بينكم نفسه حكيما في هذا العالم، فليصر جاهلا ليصير حكيما حقا."]]}, {"l": "1Co 3:20", "n": "", "vs": [[20, "وأيضا: «الرب يعلم أفكار الحكماء ويعرف أنها باطلة!»"]]}, {"l": "Col 2:18", "n": "", "vs": [[18, "لا يحرمكم أحد من جائزتكم، بحملكم على ما يرغب فيه من إظهار التواضع والتعبد للملائكة، داخلا في رؤى يتوهمها، وقد نفخه باطلا ذهنه الجسدي،"]]}, {"l": "Col 2:23", "n": "", "vs": [[23, "لها مظاهر الحكمة لما فيها من إفراط في العبادة المصطنعة، وإذلال للذات، وقهر للجسد؛ أمور لا قيمة لها، وما هي إلا لإرضاء الميول البشرية."]]}, {"l": "Jam 3:13-17", "n": "", "vs": [[13, "أبينكم بعض الحكماء والفهماء؟ إذن، على هؤلاء أن يسلكوا سلوكا حسنا، مظهرين بأعمالهم تلك الوداعة التي تتصف بها الحكمة (الحقيقية)."], [14, "أما إن كانت قلوبكم مملوءة بمرارة الحسد وبالتحزب، فلا تفتخروا بحكمتكم، ولا تنكروا الحق."], [15, "إن هذه الحكمة التي تدعونها ليست نازلة من عند الله، بل هي «حكمة» أرضية بشرية شيطانية."], [16, "فحيث تكون مرارة الحسد والتحزب، ينتشر الخلاف والفوضى وجميع الشرور."], [17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}], "kwAr": "ولا تبالغ", "noteAr": ""}, {"kw": "destroy thyself", "raw": "Heb. be desolate, Mat_23:38; Rev_18:19", "note": "Heb. be desolate, Mat_23:38; Rev_18:19", "refs": [{"l": "Mat 23:38", "n": "", "vs": [[38, "ها إن بيتكم يترك لكم خرابا!"]]}, {"l": "Rev 18:19", "n": "", "vs": [[19, "ويذرون التراب على رؤوسهم وهم يصرخون باكين منتحبين: الويل، الويل على المدينة العظمى التي اغتنى أصحاب سفن البحر جميعا بفضل ثروتها! ها هي في ساعة واحدة قد زالت!"]]}], "kwAr": "تهلك نفسك", "noteAr": "بالعبرانية: تخرب. انظر مت 23: 38؛ رؤ 18: 19"}], "arS": [["لا", ["H408"]], [" تغال في ", []], ["برك", ["H6662"]],
