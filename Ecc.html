سق، السرقة، شهادة الزور، التجديف."]]}, {"l": "Mat 18:32-35", "n": "", "vs": [[32, "فاستدعاه سيده وقال له: أيها العبد الشرير، ذلك الدين كله سامحتك به لأنك توسلت إلي."], [33, "أفما كان يجب أن ترحم زميلك العبد كما رحمتك أنا؟"], [34, "وإذ ثار غضب سيده عليه، دفعه إلى الجلادين ليعذبوه حتى يوفي كل ما عليه."], [35, "هكذا يفعل بكم أبي السماوي إن لم يغفر كل منكم لأخيه من قلبه! »"]]}, {"l": "Joh 8:7-9", "n": "", "vs": [[7, "ولكنهم ألحوا عليه بالسؤال، فاعتدل وقال لهم: «من كان منكم بلا خطيئة فليرمها أولا بحجر!»"], [8, "ثم انحنى وعاد يكتب على الأرض."], [9, "فلما سمعوا هذا الكلام انسحبوا جميعا واحدا تلو الآخر، ابتداء من الشيوخ. وبقي يسوع وحده، والمرأة واقفة في مكانها."]]}, {"l": "Jam 3:9", "n": "", "vs": [[9, "به نرفع الحمد والشكر للرب والآب، وبه نوجه الشتائم إلى الناس الذين خلقهم الله على مثاله."]]}], "kwAr": "كثيرا ما لعنت", "noteAr": ""}], "arS": [["لأنك", ["H3588"]], [" ", []], ["تدرك", ["H3045"]], [" في قرارة ", []], ["نفسك", ["H3820"]], [" أنك ", []], ["كثيرا", ["H7227"]], [" ", []], ["ما", ["H834", "H6471"]], [" ", []], ["لعنت", ["H7043"]], [" ", []], ["غيرك", ["H312"]], [".", []]]}, {"c": 7, "v": 23, "text": "كل ذلك اختبرته بالحكمة وقلت: سأكون حكيما، ولكنها كانت بعيدة عني.", "groups": [{"kw": "I said", "raw": "Gen_3:5; 1Ki_3:11, 1Ki_3:12, 1Ki_11:1-8; Rom_1:22; 1Co_1:20", "note": "", "refs": [{"l": "Gen 3:5", "n": "", "vs": [[5, "بل إن الله يعرف أنه حين تأكلان من ثمر هذه الشجرة تنفتح أعينكما فتصيران مثله، قادرين على التمييز بين الخير والشر»."]]}, {"l": "1Ki 3:11", "n": "", "vs": [[11, "وقال له: «لأنك قد طلبت هذا الأمر، ولم تطلب حياة طويلة، ولا غنى، ولا انتقاما من أعدائك، بل سألت حكمة لتسوس شؤون الحكم،"]]}, {"l": "1Ki 3:12", "n": "", "vs": [[12, "فإنني سألبي طلبك، فأهبك قلبا حكيما مميزا، فلا يضاهيك أحد من قبل ولا من بعد."]]}, {"l": "1Ki 11:1-8", "n": "", "vs": [[1, "وأولع سليمان بنساء غريبات كثيرات، فضلا عن ابنة فرعون، فتزوج نساء موآبيات وعمونيات وأدوميات وصيدونيات وحثيات،"], [2, "وكلهن من بنات الأمم التي نهى الرب بني إسرائيل عن الزواج منهم قائلا لهم: «لا تتزوجوا منهم ولا هم منكم، لأنهم يغوون قلوبكم وراء آلهتهم». ولكن سليمان التصق بهن لفرط محبته لهن."], [3, "فكانت له سبع مئة زوجة، وثلاث مئة محظية، فانحرفن بقلبه عن الرب."], [4, "فاستطعن في زمن شيخوخته أن يغوين قلبه وراء آلهة أخرى، فلم يكن قلبه مستقيما مع الرب إلهه كقلب داود أبيه."], [5, "وما لبث أن عبد عشتاروث آلهة الصيدونيين، وملكوم إله العمونيين البغيض،"], [6, "وارتكب الشر في عيني الرب، ولم يتبع سبيل الرب بكمال كما فعل أبوه داود."], [7, "وأقام على تل شرقي أورشليم مرتفعا لكموش إله الموآبيين الفاسق، ولمولك إله بني عمون البغيض."], [8, "وشيد مرتفعات لجميع نسائه الغريبات، اللواتي رحن يوقدن البخور عليها ويقربن المحرقات لآلهتهن."]]}, {"l": "Rom 1:22", "n": "", "vs": [[22, "وفيما يدعون أنهم حكماء، صاروا جهالا،"]]}, {"l": "1Co 1:20", "n": "", "vs": [[20, "إذن، أين الحكيم؟ وأين الكاتب؟ وأين المجادل في هذا الزمان؟ ألم يقلب الله حكمة هذا العالم جهالة؟"]]}], "kwAr": "وقلت", "noteAr": ""}], "arS": [["كل", ["H3605"]], [" ", []], ["ذلك", ["H1931"]], [" ", []], ["اختبرته", ["H5254"]], [" ", []], ["بالحكمة", ["H2451"]], [" ", []], ["وقلت", ["H559"]], [": سأكون ", []], ["حكيما", ["H2449"]], ["، ولكنها كانت ", []], ["بعيدة", ["H7350"]], [" ", []], ["عني", ["H4480"]], [".", []]]}, {"c": 7, "v": 24, "text": "ما هو بعيد، بعيد جدا، وما هو عميق، عميق جدا. ومن لي بمن يكتشفه؟", "groups": [{"kw": "", "raw": "Deu_30:11-14; Job_11:7, Job_11:8, Job_28:12-23, Job_28:28; Psa_36:6, Psa_139:6; Isa_55:8, Isa_55:9; Rom_11:33; 1Ti_6:16", "note": "", "refs": [{"l": "Deu 30:11-14", "n": "", "vs": [[11, "إن ما أوصيكم به اليوم من وصايا ليست متعذرة عليكم ولا بعيدة المنال،"], [12, "فهي ليست في السماء حتى تقولوا: من يصعد لأجلنا إلى السماء ليأتي لنا بها ويتلوها علينا فنعمل بها؟"], [13, "ولا هي في ما وراء البحر حتى تتساءلوا: من يعبر البحر لأجلنا ويأتينا بها ويتلوها علينا فنعمل بها؟"], [14, "بل الكلمة قريبة منكم جدا، في أفواهكم وقلوبكم لتعملوا بها."]]}, {"l": "Job 11:7", "n": "", "vs": [[7, "ألعلك تدرك أعماق الله، أم تبلغ أقصى قوة القدير؟"]]}, {"l": "Job 11:8", "n": "", "vs": [[8, "هو أسمى من السماوات، فماذا يمكنك أن تفعل؟ وهو أبعد غورا من الهاوية، فماذا تعلم؟"]]}, {"l": "Job 28:12-23", "n": "", "vs": [[12, "ولكن أين توجد الحكمة؟ وأين مقر الفطنة؟"], [13, "لا يدرك الإنسان قيمتها، ولا يمكن أن توجد في أرض الأحياء."], [14, "يقول الغمر: ليست هي في؛ ويقول البحر إني لا أملكها."], [15, "لا تقايض بالذهب الخالص، ولا توزن الفضة ثمنا لها."], [16, "لا تثمن بذهب أوفير أو بالجزع الكريم أو بالياقوت الأزرق."], [17, "لا يعادلها ذهب أو زجاج، ولا تستبدل بمجوهرات من الذهب الخالص."], [18, "لا يذكر معها المرجان أو البلور، فثمن الحكمة أغلى من كل اللآليء."], [19, "لا يقارن بها ياقوت كوش ولا تثمن بالذهب النقي."], [20, "إذا من أين تأتي الحكمة، وأين هو مقر الفطنة؟"], [21, "إنها محجوبة عن عيني كل حي، وخافية عن طير السماء."], [22, "الهلاك والموت قالا: قد بلغت مسامعنا شائعة عنها."], [23, "الله وحده يعلم الطريق إليها ويعرف مقرها،"]]}, {"l": "Job 28:28", "n": "", "vs": [[28, "ثم قال للإنسان: انظر، إن مخافة الرب هي الحكمة، وتفادي الشر هو الفطنة»."]]}, {"l": "Psa 36:6", "n": "", "vs": [[6, "عدلك ثابت مثل الجبال الشامخة، وأحكامك كالغور السحيق. وأنت يارب تحفظ الناس والبهائم جميعا."]]}, {"l": "Psa 139:6", "n": "", "vs": [[6, "ما أعجب هذا العلم الفائق، إنه أسمى من أن أدركه."]]}, {"l": "Isa 55:8", "n": "", "vs": [[8, "لأن أفكاري ليست مماثلة لأفكاركم، ولا طرقكم مثل طرقي، يقول الرب."]]}, {"l": "Isa 55:9", "n": "", "vs": [[9, "فكما ارتفعت السماوات عن الأرض، كذلك ارتفعت طرقي عن طرقكم، وأفكاري عن أفكاركم."]]}, {"l": "Rom 11:33", "n": "", "vs": [[33, "فما أعمق غنى الله وحكمته وعلمه! ما أبعد أحكامه عن الفحص وطرقه عن التتبع !"]]}, {"l": "1Ti 6:16", "n": "", "vs": [[16, "الذي وحده لا فناء له، الساكن في نور لا يدنى منه، الذي لم يره أي إنسان ولا يقدر أن يراه. له الكرامة والقدرة الأبدية. آمين!"]]}], "kwAr": "", "noteAr": ""}], "arS": [["ما", ["H4100"]], [" هو ", []], ["بعيد", ["H7350"]], ["، بعيد جدا، ", []], ["وما", ["H4310"]], [" هو ", []], ["عميق", ["H6013"]], ["، عميق جدا. ومن لي بمن يكتشفه؟", []]]}, {"c": 7, "v": 25, "text": "فتفحصت قلبي لأعلم وأبحث وأنشد الحكمة وألتمس جواهر الأشياء وأعرف جهالة الشر، وحماقة الجنون.", "groups": [{"kw": "I applied mine heart", "raw": "Heb. I and my heart compassed, Ecc_1:13-17, Ecc_2:1-3, Ecc_2:12, Ecc_2:20", "note": "Heb. I and my heart compassed, Ecc_1:13-17, Ecc_2:1-3, Ecc_2:12, Ecc_2:20", "refs": [{"l": "Ecc 1:13-17", "n": "", "vs": [[13, "فوجهت قلبي ليلتمس ويبحث بالحكمة عن كل ما صنع تحت السماء، وإذا به مشقة منهكة كبدها الرب لأبناء الناس ليعانوا فيها."], [14, "لقد شاهدت كل الأشياء التي تم صنعها تحت الشمس فإذا الجميع باطل كملاحقة الريح."], [15, "فالمعوج لا يمكن أن يقوم، والنقص لا يمكن أن يكمل."], [16, "فقلت لنفسي: قد عظمت ونموت في الحكمة أكثر من كل أسلافي الذين حكموا أورشليم من قبلي، وقد عرف قلبي كثيرا من الحكمة والعلم."], [17, "ثم وجهت فكري نحو معرفة الحكمة والجنون والحماقة، فأدركت أن هذا ليس سوى ملاحقة الريح أيضا."]]}, {"l": "Ecc 2:1-3", "n": "", "vs": [[1, "فناجيت نفسي: تعالي الآن أمتحنك بالفرح، فأستمتع باللذة! وإذا هذا أيضا باطل."], [2, "قلت عن الضحك: هذا جنون، وعن اللذة ما جدواها."], [3, "وبعد أن فحصت قلبي، حاولت أن أشرح صدري بالخمر، مع أن عقلي مازال يرشدني بالحكمة، وأن أختبر الحماقة حتى أرى ما هو صالح لأبناء البشر فيصنعوه تحت السماء طوال أيام حياتهم."]]}, {"l": "Ecc 2:12", "n": "", "vs": [[12, "ورجعت أمعن التفكير في الحكمة والجنون والحماقة، إذ ماذا في وسع من يخلف الملك أن يفعل أكثر مما تم فعله؟"]]}, {"l": "Ecc 2:20", "n": "", "vs": [[20, "فتحولت وأسلمت قلبي لليأس من كل ما بذلته من جهد تحت الشمس."]]}], "kwAr": "فتفحصت قلبي", "noteAr": "بالعبرانية: أنا وقلبي دُرنا. انظر جا 1: 13-17؛ 2: 1-3، 12، 20"}, {"kw": "the reason", "raw": "Ecc_7:27 *marg. Ecc_2:15, Ecc_3:16, Ecc_3:17, Ecc_9:1, Ecc_9:2; Jer_12:1, Jer_12:2; 2Pe_2:3-9, 2Pe_3:3-9", "note": "", "refs": [{"l": "Ecc 7:27", "n": "*marg.", "vs": [[27, "ويقول الجامعة: إليك ما وجدته: أضف واحدا إلى واحد لتكتشف حاصل الأشياء"]]}, {"l": "Ecc 2:15", "n": "", "vs": [[15, "ثم حدثت نفسي: إن ما يحدث للجاهل يحدث لي أيضا، فلماذا أنا أوفر حكمة؟ فناجيت قلبي: وهذا أيضا باطل،"]]}, {"l": "Ecc 3:16", "n": "", "vs": [[16, "ورأيت أيضا تحت الشمس: الجور في موضع العدل، والظلم في موضع الحق."]]}, {"l": "Ecc 3:17", "n": "", "vs": [[17, "فقلت في نفسي: إن الله سيحكم على الصديق وعلى الشرير، لأن لكل عمل ولكل أمر وقتا هناك."]]}, {"l": "Ecc 9:1", "n": "", "vs": [[1, "هذا كله ادخرته في قلبي واختبرته: أن الأبرار والحكماء، وما يصدر عنهم من أعمال، في يد الله، ولا أحد يدري ما ينتظره، حبا كان أم بغضا،"]]}, {"l": "Ecc 9:2", "n": "", "vs": [[2, "إذ الجميع معرضون لنفس المصير، الصالحون والطالحون، الأخيار والأشرار، الطاهر والنجس، المقرب للذبائح وغير المقرب. فالصالح كالطالح سيان، والحالف كمن يخشى الحلف."]]}, {"l": "Jer 12:1", "n": "", "vs": [[1, "أنت دائما عادل حين أعرض عليك دعواي، ولكن دعني أحدثك بشأن أحكامك: لماذا تفلح طريق الأشرار؟ ولماذا يتمتع الغادرون بالعيش الرغيد؟"]]}, {"l": "Jer 12:2", "n": "", "vs": [[2, "أنت غرستهم فتأصلوا ونموا وأثمروا. اسمك يتردد على أفواههم، ولكنه بعيد عن قلوبهم."]]}, {"l": "2Pe 2:3-9", "n": "", "vs": [[3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."], [4, "فإن الله لم يشفق على الملائكة الذين أخطأوا، بل طرحهم في أعماق هاوية الظلام مقيدين بالسلاسل، حيث يظلون محبوسين إلى يوم الحساب."], [5, "كذلك لم يشفق على العالم القديم عندما أحدث الطوفان على عالم الفاجرين، إلا أنه حفظ نوحا المنادي ببر الله وعدله. وكان نوح واحدا من ثمانية أشخاص نجوا من الطوفان."], [6, "وإذ حكم الله على مدينتي سدوم وعمورة بالخراب، حولهما إلى رماد، جاعلا منهما عبرة للذين يعيشون حياة فاجرة."], [7, "ولكنه أنقذ لوطا البار، الذي كان متضايقا جدا من سلوك أشرار زمانه في الدعارة."], [8, "فإذ كان ساكنا بينهم، وهو رجل بار، كانت نفسه الزكية تتألم يوميا من جرائمهم التي كان يراها أو يسمع بها."], [9, "وهكذا نرى أن الرب يعرف أن ينقذ الأتقياء من المحنة، ويحفظ الأشرار محبوسين ليحكم عليهم بالعقاب في يوم الدينونة."]]}, {"l": "2Pe 3:3-9", "n": "", "vs": [[3, "فاعلموا، قبل كل شيء أنه سيأتي في آخر الأيام أناس مستهزئون يسخرون بالحق، ويسلكون منجرفين وراء شهواتهم الخاصة."], [4, "وسيقولون: «أين هو الوعد برجوع المسيح؟ فمنذ أن مات آباؤنا الأولون، بل منذ بدء الخليقة، مازال كل شيء على حاله!»"], [5, "إنهم يتناسون، عمدا، أنه بكلمة أمر من الله وجدت السماوات منذ القديم وتكونت الأرض من الماء وبالماء."], [6, "وبكلمة منه أيضا، دمر العالم الذي كان موجودا في ذلك الزمان، إذ فاض الماء عليه."], [7, "أما السماوات والأرض الحالية، فستبقى مخزونة ومحفوظة للنار بتلك الكلمة عينها إلى يوم الدينونة وهلاك الفاجرين!"], [8, "ولكن، أيها الأحباء، عليكم ألا تنسوا هذه الحقيقة: أن يوما واحدا في نظر الرب هو كألف سنة، وألف سنة كيوم واحد."], [9, "فالرب، إذن، لا يبطيء في إتمام وعده، كما يظن بعض الناس، ولكنه يتأنى عليكم، فهو لا يريد لأحد من الناس أن يهلك، بل يريد لجميع الناس أن يرجعوا إليه تائبين."]]}], "kwAr": "جواهر الأشياء", "noteAr": ""}, {"kw": "know", "raw": "Ecc_9:3, Ecc_10:13; Gen_34:7; Jos_7:13; 2Sa_13:12; Pro_17:12, Pro_26:11", "note": "", "refs": [{"l": "Ecc 9:3", "n": "", "vs": [[3, "وأشر ما يجري تحت الشمس أن الجميع يلقون نفس المصير، وأن قلوب بني البشر مفعمة بالشر، وفي حياتهم تمتليء صدورهم بالحماقة، ثم يموتون!"]]}, {"l": "Ecc 10:13", "n": "", "vs": [[13, "بداية كلمات فمه حماقة، وخاتمة حديثه جنون خبيث."]]}, {"l": "Gen 34:7", "n": "", "vs": [[7, "وأتى بنو يعقوب من الحقل عندما سمعوا بالأمر، وقد استشاطوا غضبا وغيظا لأن شكيم قد ارتكب فاحشة في إسرائيل بمضاجعة ابنة يعقوب، وهو أمر محظور."]]}, {"l": "Jos 7:13", "n": "", "vs": [[13, "قم، واطلب من الشعب أن يتقدسوا ليوم غد، لأنه هكذا قال الرب إله إسرائيل: في وسطك حرام ياإسرائيل، ولن تتمكنوا من هزيمة أعدائكم حتى تستأصلوا الحرام من بينكم."]]}, {"l": "2Sa 13:12", "n": "", "vs": [[12, "فأجابته: «لا ياأخي. لا تذلني. لأنه لا يقترف مثل هذا العمل الشنيع في إسرائيل. أرجوك لا ترتكب هذه القباحة،"]]}, {"l": "Pro 17:12", "n": "", "vs": [[12, "مصادفة دبة ثاكل خير من مصادفة جاهل متورط في حماقته."]]}, {"l": "Pro 26:11", "n": "", "vs": [[11, "كما يعود الكلب إلى قيئه، هكذا يعود الجاهل ليرتكب حماقته."]]}], "kwAr": "أعرف جهالة الشر", "noteAr": ""}], "arS": [["فتفحصت", ["H5437"]], [" ", []], ["قلبي", ["H3820"]], [" ", []], ["لأعلم", ["H3045"]], [" ", []], ["وأبحث", ["H8446"]], [" وأنشد ", []], ["الحكمة", ["H2451"]], [" ", []], ["وألتمس", ["H1245"]], [" ", []], ["جواهر", ["H2808"]], [" الأشياء ", []], ["وأعرف", ["H3045"]], [" ", []], ["جهالة", ["H3689"]], [" ", []], ["الشر", ["H7562"]], ["، ", []], ["وحماقة", ["H5531"]], [" ", []], ["الجنون", ["H1947"]], [".", []]]}, {"c": 7, "v": 26, "text": "فوجدت أن المرأة التي قلبها أشراك وشباك، ويداها قيود، هي أمر من الموت، ومن يرضي الله يهرب منها، أما الخاطيء فيقع في أشراكها.", "groups": [{"kw": "I find", "raw": "Jdg_16:18-21; Pro_2:18, Pro_2:19, Pro_5:3-5, Pro_7:21-27, Pro_9:18, Pro_22:14, Pro_23:27, Pro_23:28", "note": "", "refs": [{"l": "Jdg 16:18-21", "n": "", "vs": [[18, "ولما أدركت دليلة أنه قد أسر لها بمكنون قلبه، استدعت أقطاب الفلسطينيين قائلة: «تعالوا هذه المرة، فقد أطلعني على سر قوته». فأقبل عليها أقطاب الفلسطينيين حاملين معهم الفضة."], [19, "فأضجعته على ركبتيها واستدعت رجلا حلق له خصلات شعره السبع، وشرعت في إذلاله بعد أن فارقته قوته."], [20, "وقالت: «الفلسطينيون قادمون عليك ياشمشون» فاستيقظ من نومه وقال: «أقوم مثل كل مرة وأنتفض». ولم يعلم أن الرب قد فارقه."], [21, "فقبض عليه الفلسطينيون وقلعوا عينيه وأخذوه إلى غزة حيث أوثقوه بسلاسل نحاسية، وسخروه ليطحن الحبوب في السجن."]]}, {"l": "Pro 2:18", "n": "", "vs": [[18, "لأن بيتها يغوص عميقا إلى الموت، وسبلها تفضي إلى عالم الأرواح."]]}, {"l": "Pro 2:19", "n": "", "vs": [[19, "كل من يدخل إليها لا يرجع ولا يبلغ سبل الحياة."]]}, {"l": "Pro 5:3-5", "n": "", "vs": [[3, "لأن شفتي المرأة العاهرة تقطران شهدا، وحديثها أكثر نعومة من الزيت،"], [4, "لكن عاقبتها مرة كالعلقم، حادة كسيف ذي حدين."], [5, "تنحدر قدماها إلى الموت، وخطواتها تتشبث بالهاوية."]]}, {"l": "Pro 7:21-27", "n": "", "vs": [[21, "فأغوته بكثرة أفانين كلامها، ورنحته بتملق شفتيها."], [22, "فمضى على التو في إثرها، كثور مسوق إلى الذبح، أو أيل وقع في فخ."], [23, "إلى أن ينفذ سهم في كبده، ويكون كعصفور مندفع إلى شرك، لا يدري أنه قد نصب للقضاء عليه."], [24, "والآن أصغوا إلي أيها الأبناء، وأرهفوا آذانكم إلى أقوال فمي:"], [25, "لا تجنح قلوبكم نحو طرقها، ولا تحوم في دروبها."], [26, "فما أكثر الذين طرحتهم مثخنين بالجراح، وجميع صرعاها أقوياء."], [27, "إن بيتها هو طريق الهاوية المؤدي إلى مخادع الموت."]]}, {"l": "Pro 9:18", "n": "", "vs": [[18, "ولكنه لا يدري أن أشباح الموتى هناك، وأن ضيوفها مطروحون في أعماق الهاوية."]]}, {"l": "Pro 22:14", "n": "", "vs": [[14, "فم العاهرة حفرة عميقة فمن سخط الرب عليه يهوي فيها."]]}, {"l": "Pro 23:27", "n": "", "vs": [[27, "فإن العاهرة حفرة عميقة، والزوجة الماجنة بئر ضيقة،"]]}, {"l": "Pro 23:28", "n": "", "vs": [[28, "تكمن متر بصة كلص، وتزيد من الغادرين بين الناس."]]}], "kwAr": "فوجدت", "noteAr": ""}, {"kw": "whoso pleaseth God", "raw": "Heb. he that is good before God, Ecc_2:26", "note": "Heb. he that is good before God, Ecc_2:26", "refs": [{"l": "Ecc 2:26", "n": "", "vs": [[26, "لأن المرء الذي يحظى برضى الله ينعم الله عليه بالحكمة والمعرفة والفرح. أما الخاطيء فيفرض عليه عناء الجمع والادخار، ليكون ذلك من نصيب من يرضي الله . وهذا أيضا باطل كملاحقة الريح."]]}], "kwAr": "من يرضي الله", "noteAr": "بالعبرانية: من هو صالح أمام الله. انظر جا 2: 26"}], "arS": [["فوجدت", ["H4672"]], [" أن ", []], ["المرأة", ["H802"]], [" ", []], ["التي", ["H834"]], [" ", []], ["قلبها", ["H3820"]], [" ", []], ["أشراك", ["H4685"]], [" ", []], ["وشباك", ["H2764"]], ["، ويداها ", []], ["قيود", ["H612"]], ["، ", []], ["هي", ["H1931"]], [" ", []], ["أمر", ["H4751"]], [" ", []], ["من", ["H4480"]], [" ", []], ["الموت", ["H4194"]], ["، ", []], ["ومن", ["H4480"]], [" ", []], ["يرضي", ["H2896"]], [" ", []], ["الله", ["H430"]], [" ", []], ["يهرب", ["H4422"]], [" منها، أما ", []], ["الخاطيء", ["H2398"]], [" ", []], ["فيقع", ["H3920"]], [" ", []], ["في", ["H3027"]], [" أشراكها.", []]]}, {"c": 7, "v": 27, "text": "ويقول الجامعة: إليك ما وجدته: أضف واحدا إلى واحد لتكتشف حاصل الأشياء", "groups": [{"kw": "saith", "raw": "Ecc_1:1, Ecc_1:2, Ecc_12:8-10", "note": "", "refs": [{"l": "Ecc 1:1", "n": "", "vs": [[1, "هذه أقوال الجامعة ابن داود ملك أورشليم."]]}, {"l": "Ecc 1:2", "n": "", "vs": [[2, "يقول الجامعة: باطل الأباطيل، باطل الأباطيل، كل شيء باطل."]]}, {"l": "Ecc 12:8-10", "n": "", "vs": [[8, "يقول الجامعة: باطل الأباطيل وكل شيء باطل."], [9, "وفضلا عن كون الجامعة حكيما، فإنه علم الناس المعرفة أيضا، وقوم وبحث ونظم أمثالا كثيرة."], [10, "إذ سعى الجامعة لانتقاء ألفاظ مبهجة، وكتب باستقامة كلمات الحق."]]}], "kwAr": "ويقول الجامعة", "noteAr": ""}, {"kw": "counting one by one, to find out the account", "raw": "or, weighing one thing after another, to find out the reason, Ecc_7:25", "note": "or, weighing one thing after another, to find out the reason, Ecc_7:25", "refs": [{"l": "Ecc 7:25", "n": "", "vs": [[25, "فتفحصت قلبي لأعلم وأبحث وأنشد الحكمة وألتمس جواهر الأشياء وأعرف جهالة الشر، وحماقة الجنون."]]}], "kwAr": "أضف واحدا إلى واحد", "noteAr": "أو: وزن شيء بعد آخر لاكتشاف السبب. انظر جا 7: 25"}], "arS": [["ويقول", ["H559"]], [" ", []], ["الجامعة", ["H6953"]], [": إليك ما ", []], ["وجدته", ["H4672"]], [": أضف ", []], ["واحدا", ["H259"]], [" إلى ", []], ["واحد", ["H259"]], [" لتكتشف ", []], ["حاصل", ["H2808"]], [" الأشياء", []]]}, {"c": 7, "v": 28, "text": "التي ما برحت نفسي تبحث عنها من غير جدوى: وجدت صديقا واحدا بين ألف رجل، وعلى امرأة واحدة (صديقة) بين الألف لم أعثر.", "groups": [{"kw": "yet", "raw": "Ecc_7:23, Ecc_7:24; Isa_26:9", "note": "", "refs": [{"l": "Ecc 7:23", "n": "", "vs": [[23, "كل ذلك اختبرته بالحكمة وقلت: سأكون حكيما، ولكنها كانت بعيدة عني."]]}, {"l": "Ecc 7:24", "n": "", "vs": [[24, "ما هو بعيد، بعيد جدا، وما هو عميق، عميق جدا. ومن لي بمن يكتشفه؟"]]}, {"l": "Isa 26:9", "n": "", "vs": [[9, "تتوق إليك نفسي في الليل، وفي الصباح تشتاق إليك روحي. عندما تسود أحكامك في الأرض يتعلم أهلها العدل."]]}], "kwAr": "ما برحت نفسي", "noteAr": ""}, {"kw": "one", "raw": "Job_33:23; Psa_12:1", "note": "", "refs": [{"l": "Job 33:23", "n": "", "vs": [[23, "إن وجد له ملاك، شفيع، واحد من بين ألف، ليعلن للإنسان ما هو صالح له،"]]}, {"l": "Psa 12:1", "n": "", "vs": [[1, "أغث يارب لأنه قد انقرض التقي، واختفى الأمناء من بين بني البشر."]]}], "kwAr": "وجدت صديقا واحدا", "noteAr": ""}, {"kw": "but", "raw": "Solomon, instead of seeking one rational, virtuous woman, had collected an immense multitude, of various countries and religions, for magnificence and indulgence; among whom, as might have been expected, he had not found one who was thoroughly faithful, upright, and pious. He here uses the language of a penitent, warning others of the errors into which he had been led; and not that of a wasphish satirist, lashing indiscriminately one half of the human species. 1Ki_11:1-3", "note": "Solomon, instead of seeking one rational, virtuous woman, had collected an immense multitude, of various countries and religions, for magnificence and indulgence; among whom, as might have been expected, he had not found one who was thoroughly faithful, upright, and pious. He here uses the language of a penitent, warning others of the errors into which he had been led; and not that of a wasphish satirist, lashing indiscriminately one half of the human species. 1Ki_11:1-3", "refs": [{"l": "1Ki 11:1-3", "n": "", "vs": [[1, "وأولع سليمان بنساء غريبات كثيرات، فضلا عن ابنة فرعون، فتزوج نساء موآبيات وعمونيات وأدوميات وصيدونيات وحثيات،"], [2, "وكلهن من بنات الأمم التي نهى الرب بني إسرائيل عن الزواج منهم قائلا لهم: «لا تتزوجوا منهم ولا هم منكم، لأنهم يغوون قلوبكم وراء آلهتهم». ولكن سليمان التصق بهن لفرط محبته لهن."], [3, "فكانت له سبع مئة زوجة، وثلاث مئة محظية، فانحرفن بقلبه عن الرب."]]}], "kwAr": "لم أعثر", "noteAr": "كان سليمان، بدل أن يطلب امرأة واحدة عاقلة فاضلة، قد جمع جمهورا هائلا من نساء مختلف البلدان والأديان للأبهة والمتعة؛ فلم يجد بينهن، كما كان متوقعا، واحدة أمينة مستقيمة تقية تماما. وهو يتكلم هنا بلسان تائب يحذر الآخرين من الأخطاء التي انجرّ إليها، لا بلسان هجّاء لاذع يجلد نصف الجنس البشري بلا تمييز. انظر 1مل 11: 1-3"}], "arS": [["التي", ["H834"]], [" ما ", []], ["برحت", ["H5750"]], [" ", []], ["نفسي", ["H5315"]], [" ", []], ["تبحث", ["H1245"]], [" عنها ", []], ["من", ["H4480"]], [" ", []], ["غير", ["H3808"]], [" جدوى: ", []], ["وجدت", ["H4672"]], [" صديقا ", []], ["واحدا", ["H259"]], [" بين ", []], ["ألف", ["H505"]], [" ", []], ["رجل", ["H120"]], ["، وعلى ", []], ["امرأة", ["H802"]], [" واحدة (صديقة) بين الألف ", []], ["لم", ["H3808"]], [" ", []], ["أعثر", ["H4672"]], [".", []]]}, {"c": 7, "v": 29, "text": "بل هذا ما وجدته: إن الله قد صنع البشر مستقيمين، أما هم فانطلقوا باحثين عن مستحدثات كثيرة!", "groups": [{"kw": "God", "raw": "Gen_1:26, Gen_1:27, Gen_5:1", "note": "", "refs": [{"l": "Gen 1:26", "n": "", "vs": [[26, "ثم قال الله : «لنصنع الإنسان على صورتنا، كمثالنا، فيتسلط على سمك البحر، وعلى طير السماء، وعلى الأرض، وعلى كل زاحف يزحف عليها»."]]}, {"l": "Gen 1:27", "n": "", "vs": [[27, "فخلق الله الإنسان على صورته. على صورة الله خلقه. ذكرا وأنثى خلقهم."]]}, {"l": "Gen 5:1", "n": "", "vs": [[1, "هذا سجل بمواليد آدم. يوم خلق الله الإنسان، صنعه الله على مثاله."]]}], "kwAr": "الله قد صنع", "noteAr": ""}, {"kw": "they", "raw": "The descendants of Adam have sought out an immense number of inventions, in order to find happiness in the world, without God, which have only proved so many variations of impiety and iniquity. Gen_3:6, Gen_3:7, Gen_6:5, Gen_6:6, Gen_6:11, Gen_6:12, Gen_11:4-6; Psa_99:8, Psa_106:29, Psa_106:39; Jer_2:12, Jer_2:13; Jer_4:22; Eze_22:6-13; Mar_7:8, Mar_7:9; Act_7:40-43; Rom_1:21-32, Rom_3:9-19; Eph_2:2, Eph_2:3; Tit_3:3", "note": "The descendants of Adam have sought out an immense number of inventions, in order to find happiness in the world, without God, which have only proved so many variations of impiety and iniquity. Gen_3:6, Gen_3:7, Gen_6:5, Gen_6:6, Gen_6:11, Gen_6:12, Gen_11:4-6; Psa_99:8, Psa_106:29, Psa_106:39; Jer_2:12, Jer_2:13; Jer_4:22; Eze_22:6-13; Mar_7:8, Mar_7:9; Act_7:40-43; Rom_1:21-32, Rom_3:9-19; Eph_2:2, Eph_2:3; Tit_3:3", "refs": [{"l": "Gen 3:6", "n": "", "vs": [[6, "وعندما شاهدت المرأة أن الشجرة لذيذة للمأكل وشهية للعيون، ومثيرة للنظر قطفت من ثمرها وأكلت، ثم أعطت زوجها أيضا فأكل معها،"]]}, {"l": "Gen 3:7", "n": "", "vs": [[7, "فانفتحت للحال أعينهما، وأدركا أنهما عريانان، فخاطا لأنفسهما مآزر من أوراق التين."]]}, {"l": "Gen 6:5", "n": "", "vs": [[5, "ورأى الرب أن شر الإنسان قد كثر في الأرض، وأن كل تصور فكر قلبه يتسم دائما بالإثم،"]]}, {"l": "Gen 6:6", "n": "", "vs": [[6, "فملأ قلبه الأسف والحزن لأنه خلق الإنسان."]]}, {"l": "Gen 6:11", "n": "", "vs": [[11, "وإذ ساد الشر الأرض أمام الله وعمها الظلم،"]]}, {"l": "Gen 6:12", "n": "", "vs": [[12, "نظر الله وإذا بها فاسدة لأن كل بشر على الأرض قد سلك في طريق الإثم."]]}, {"l": "Gen 11:4-6", "n": "", "vs": [[4, "ثم قالوا: «هيا نشيد لأنفسنا مدينة وبرجا يبلغ رأسه السماء، فنخلد لنا اسما لئلا نتشتت على وجه الأرض كلها»."], [5, "ونزل الرب ليشهد المدينة والبرج اللذين شرع بنو البشر في بنائهما."], [6, "فقال الرب: «إن كانوا، كشعب واحد ينطقون بلغة واحدة، قد عملوا هذا منذ أول الأمر، فلن يمتنع إذا عليهم أي شيء عزموا على فعله."]]}, {"l": "Psa 99:8", "n": "", "vs": [[8, "أيها الرب إلهنا، أنت استجبت لهم. غفرت لهم إثمهم، وإن كنت قد عاقبتهم جزاء أفعالهم."]]}, {"l": "Psa 106:29", "n": "", "vs": [[29, "وأثاروا غضب الرب بأعمالهم الشريرة، فتفشى بينهم وبأ مفاجيء."]]}, {"l": "Psa 106:39", "n": "", "vs": [[39, "لذلك تنجسوا بأعمالهم، وخانوا الرب بأفعالهم"]]}, {"l": "Jer 2:12", "n": "", "vs": [[12, "فاذهلي أيتها السماوات، وارتجفي وارتعدي جدا."]]}, {"l": "Jer 2:13", "n": "", "vs": [[13, "قد ارتكب شعبي شرين: نبذوني أنا ينبوع الحياة، وحفروا لأنفسهم آبارا متصدعة لا تضبط ماء."]]}, {"l": "Jer 4:22", "n": "", "vs": [[22, "إن قومي حمقى لا يعرفونني. هم أبناء أغبياء مجردون من الفهم، حاذقون في ارتكاب الشر، وجهلاء في صنع الخير»."]]}, {"l": "Eze 22:6-13", "n": "", "vs": [[6, "هوذا كل واحد من رؤساء إسرائيل ممن كانوا فيك انهمك في سفك الدماء على قدر طاقته."], [7, "فيك استخفوا بأب وأم وجاروا في وسطك على الغريب، واضطهدوا اليتيم والأرملة،"], [8, "احتقرت مقدساتي ونجست أيام سبوتي."], [9, "أقام فيك وشاة عملوا على سفك الدم، وأكلوا أمام الأصنام على الجبال، وارتكبوا في وسطك الموبقات."], [10, "فيك فضح الإنسان عري أبيه، وفيك أذلوا من برحت متنجسة بطمثها."], [11, "فيك إنسان زنى مع امرأة قريبه، واقترف إنسان الرذيلة مع كنته، وفيك ضاجع إنسان أخته ابنة أبيه."], [12, "فيك أخذوا الرشوة لقاء سفك الدماء. أخذت الربا ومال الحرام، وسلبت أقرباءك ظلما ونسيتني، يقول السيد الرب."], [13, "ها أنا قد صفقت بكفي من جراء ما حصلت عليه من ربح حرام، وما سفك من دم في وسطك."]]}, {"l": "Mar 7:8", "n": "", "vs": [[8, "فقد أهملتم وصية الله وتمسكتم بتقليد الناس!»"]]}, {"l": "Mar 7:9", "n": "", "vs": [[9, "وقال لهم: «حقا أنكم رفضتم وصية الله لتحافظوا على تقليدكم أنتم!"]]}, {"l": "Act 7:40-43", "n": "", "vs": [[40, "وقالوا لهرون: اصنع لنا آلهة تهدينا في سيرنا، فإننا لا نعلم ماذا جرى لموسى هذا الذي أخرجنا من بلاد مصر!"], [41, "فصنعوا صنما على صورة عجل في تلك الأيام وقدموا له ذبيحة، وابتهجوا بما صنعت أيديهم."], [42, "فتحول الله عنهم وتركهم يعبدون كواكب السماء، كما جاء في كتاب الأنبياء:"], [43, "لا، بل حملتم خيمة الصنم مولوك، وكوكب الإله رمفان، التمثالين اللذين صنعتم لتسجدوا لهما! لذلك سأنفيكم إلى أبعد من بابل!"]]}, {"l": "Rom 1:21-32", "n": "", "vs": [[21, "فمع أنهم عرفوا الله ، لم يمجدوه باعتباره الله ، ولا شكروه، بل انحطوا بتفكيرهم إلى الحماقة وصار قلبهم لغباوته مظلما."], [22, "وفيما يدعون أنهم حكماء، صاروا جهالا،"], [23, "واستبدلوا بمجد الله الخالد تماثيل لصور الإنسان الفاني والطيور وذوات الأربع والزواحف."], [24, "لذلك أسلمهم الله ، في شهوات قلوبهم، إلى النجاسة، ليهينوا أجسادهم فيما بينهم."], [25, "إذ قد استبدلوا بحق الله ما هو باطل، فاتقوا المخلوق وعبدوه بدل الخالق، المبارك إلى الأبد. آمين!"], [26, "لهذا السبب أسلمهم الله إلى الشهوات المخزية. فإن إناثهم تحولن عن استعمال أجسادهن بالطريقة الطبيعية إلى استعمالها بطريقة مخالفة للطبيعة."], [27, "وكذلك تحول الذكور أيضا عن استعمال الأنثى بالطريقة الطبيعية، والتهبوا شهوة بعضهم لبعض، مرتكبين الفحشاء ذكورا بذكور، فاستحقوا أن ينالوا في أنفسهم الجزاء العادل على ضلالهم."], [28, "وبما أنهم لم يتخيروا إبقاء الله ضمن معرفتهم، أسلمهم الله إلى ذهن عاطل عن التمييز دفعهم إلى ممارسة الأمور غير اللائقة."], [29, "إذ قد امتلأوا من كل إثم وشر وجشع وخبث، وشحنوا حسدا وقتلا وخصاما ومكرا وسوءا. وهم ثرثارون،"], [30, "مغتابون، كارهون لله، شتامون، متكبرون، متفاخرون، مخترعون للشرور، غير طائعين للوالدين."], [31, "لا فهم عندهم، ولا أمانة، ولا حنان، ولا رحمة."], [32, "إنهم يعلمون حكم الله العادل: أن الذين يفعلون هذه الأمور يستوجبون الموت؛ ومع ذلك، لا يمارسونها وحسب، بل يسرون بفاعليها."]]}, {"l": "Rom 3:9-19", "n": "", "vs": [[9, "فماذا إذن؟ أنحن اليهود أفضل؟ لا، على الإطلاق! فإننا، في ما سبق، قد اتهمنا اليهود واليونانيين بكونهم جميعا تحت الخطيئة،"], [10, "كما قد كتب:"], [11, "ليس من يبحث عن الله."], [12, "جميع الناس قد ضلوا، وصاروا كلهم بلا نفع. ليس من يمارس الصلاح، لا ولا واحد."], [13, "حناجرهم قبور مفتوحة؛ ألسنتهم أدوات للمكر؛ شفاههم تخفي سم الأفاعي القاتلة؛"], [14, "أفواههم مملوءة لعنة ومرارة،"], [15, "أقدامهم سريعة إلى سفك الدماء؛"], [16, "في طرقهم الخراب والشقاء؛"], [17, "أما طريق السلام فلم يعرفوه؛"], [18, "ومخافة الله ليست نصب عيونهم»."], [19, "ونحن نعلم أن كل ما تقوله الشريعة إنما تخاطب به الذين هم تحت الشريعة، لكي يسد كل فم ويقع العالم كله تحت دينونة من الله."]]}, {"l": "Eph 2:2", "n": "", "vs": [[2, "التي كنتم تسلكون فيها حسب مسرى هذا العالم، تابعين رئيس قوات الهواء، ذلك الروح العامل الآن في أبناء العصيان،"]]}, {"l": "Eph 2:3", "n": "", "vs": [[3, "الذين بينهم نحن أيضا كنا نسلك سابقا في شهوات جسدنا، عاملين ما يريده الجسد والأفكار، وكنا بالطبيعة أولاد الغضب كالآخرين أيضا."]]}, {"l": "Tit 3:3", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."]]}], "kwAr": "فانطلقوا", "noteAr": "لقد بحث نسل آدم عن عدد هائل من الاختراعات ليجد السعادة في العالم بعيدا عن الله، فلم تكن إلا ضروبا شتى من الفجور والإثم. انظر تك 3: 6، 7؛ 6: 5، 6، 11، 12؛ 11: 4-6؛ مز 99: 8؛ 106: 29، 39؛ إر 2: 12، 13؛ 4: 22؛ حز 22: 6-13؛ مر 7: 8، 9؛ أع 7: 40-43؛ رو 1: 21-32؛ 3: 9-19؛ أف 2: 2، 3؛ تي 3: 3"}], "arS": [["بل ", []], ["هذا", ["H2088"]], [" ", []], ["ما", ["H834"]], [" ", []], ["وجدته", ["H4672"]], [": إن ", []], ["الله", ["H430"]], [" قد ", []], ["صنع", ["H6213"]], [" ", []], ["البشر", ["H120"]], [" ", []], ["مستقيمين", ["H3477"]], ["، أما ", []], ["هم", ["H1992"]], [" فانطلقوا ", []], ["باحثين", ["H1245"]], [" عن ", []], ["مستحدثات", ["H2810"]], [" ", []], ["كثيرة", ["H7227"]], ["!", []]]}, {"c": 8, "v": 1, "text": "من هو نظير الحكيم؟ ومن يعرف تعليل الأمور؟ حكمة الإنسان تضيء وجهه وتلطف من صلابة ملامحه.", "groups": [{"kw": "as the", "raw": "Ecc_2:13, Ecc_2:14; 1Co_2:13-16", "note": "", "refs": [{"l": "Ecc 2:13", "n": "", "vs": [[13, "فوجدت أن الحكمة أفضل من الحماقة، تماما كما أن النور خير من الظلمة،"]]}, {"l": "Ecc 2:14", "n": "", "vs": [[14, "لأن عيني الحكيم في رأسه، أما الجاهل فيمشي في الظلمة. لكنني أدركت أنهما يلاقيان مصيرا واحدا."]]}, {"l": "1Co 2:13-16", "n": "", "vs": [[13, "ونحن نتكلم بهذه الأمور لا في كلام تعلمه الحكمة البشرية، بل في كلام يعلمه الروح القدس، معبرين عن الحقائق الروحية بوسائل روحية."], [14, "غير أن الإنسان البشري لا يتقبل أمور روح الله إذ يعتبرها جهالة، ولا يستطيع أن يعرفها لأن تمييزها إنما يحتاج إلى حس روحي."], [15, "أما الإنسان الروحي، فهو يميز كل شيء، ولا يحكم فيه من أحد."], [16, "فإنه «من عرف فكر الرب؟» ومن يعلمه؟ وأما نحن، فلنا فكر المسيح!"]]}], "kwAr": "من هو نظير", "noteAr": ""}, {"kw": "who knoweth", "raw": "Gen_40:8, Gen_41:15, Gen_41:16, Gen_41:38, Gen_41:39; Job_33:23; Pro_1:6; Dan_2:28-30, Dan_2:47, Dan_4:18, Dan_4:19; 2Pe_1:20", "note": "", "refs": [{"l": "Gen 40:8", "n": "", "vs": [[8, "فأجاباه: «حلم كل منا حلما وليس من يفسره». فقال يوسف: «أليست تفاسير الأحلام لله؟ حدثاني بهما»."]]}, {"l": "Gen 41:15", "n": "", "vs": [[15, "فقال فرعون ليوسف: «لقد رأيت حلما وليس هناك من يفسره، وقد سمعت عنك حديثا أنك إن سمعت حلما تقدر أن تفسره»."]]}, {"l": "Gen 41:16", "n": "", "vs": [[16, "فأجاب يوسف: «لا فضل لي في ذلك، بل إن الله هو الذي يعطي فرعون الجواب الصائب»."]]}, {"l": "Gen 41:38", "n": "", "vs": [[38, "وقال فرعون لعبيده: «هل نجد نظير هذا رجلا فيه روح الله؟»"]]}, {"l": "Gen 41:39", "n": "", "vs": [[39, "ثم قال فرعون ليوسف: «من حيث أن الله قد أطلعك على كل هذا، فليس هناك بصير وحكيم نظيرك."]]}, {"l": "Job 33:23", "n": "", "vs": [[23, "إن وجد له ملاك، شفيع، واحد من بين ألف، ليعلن للإنسان ما هو صالح له،"]]}, {"l": "Pro 1:6", "n": "", "vs": [[6, "في فهم المثل والمعنى البليغ وأقوال الحكماء المأثورة وأحاجيهم."]]}, {"l": "Dan 2:28-30", "n": "", "vs": [[28, "ولكن هناك إله في السماء يعلن الخفايا. وقد عرف الملك نبوخذناصر عما سيحدث في آخر الأيام. أما حلمك والرؤيا التي شهدتها في منامك فهي هذه:"], [29, "أيها الملك، فيما أنت مستلق على مضجعك انتابتك الأفكار عما يحدث في الأيام المقبلة، والذي يكشف الخفايا عرفك بما سيكون."], [30, "وقد أعلن لي هذا السر، لا لحكمة في أكثر من سائر الأحياء، إنما لكي يطلع الملك على تفسيره وتدرك أفكار قلبك."]]}, {"l": "Dan 2:47", "n": "", "vs": [[47, "وقال الملك لدانيآل: «حقا إن إلهكم هو إله الآلهة ورب الملوك وكاشف الأسرار، لأنك استطعت إعلان هذا السر»."]]}, {"l": "Dan 4:18", "n": "", "vs": [[18, "هذا هو الحلم الذي رأيته أنا نبوخذناصر الملك، وعليك أنت يابلطشاصر أن تفسره، لأن كل حكماء مملكتي قد عجزوا عن إطلاعي على تفسيره. أما أنت فتستطيع ذلك لأن فيك روح الآلهة القدوسين»."]]}, {"l": "Dan 4:19", "n": "", "vs": [[19, "حينئذ انتابت الحيرة دانيآل المدعو بلطشاصر طوال ساعة وروعته أفكاره، فقال له الملك: «لا يفزعك الحلم ولا تفسيره يابلطشاصر». فأجاب: «ليرتد الحلم على مبغضيك وتفسيره على أعاديك."]]}, {"l": "2Pe 1:20", "n": "", "vs": [[20, "ولكن، قبل كل شيء، اعلموا أن كل نبوءة واردة في الكتاب لا تفسر باجتهاد خاص."]]}], "kwAr": "من يعرف تعليل", "noteAr": ""}, {"kw": "a mans", "raw": "Exo_34:29, Exo_34:30; Pro_4:8, Pro_4:9, Pro_17:24, Pro_24:5; Mat_17:2; Act_6:15", "note": "", "refs": [{"l": "Exo 34:29", "n": "", "vs": [[29, "وعندما انحدر من جبل سيناء حاملا بيديه لوحي الشهادة، لم يكن يدري أن وجهه كان يلمع لأنه كان يتحدث مع الله."]]}, {"l": "Exo 34:30", "n": "", "vs": [[30, "وحين شاهد هرون وبنو إسرائيل موسى، كان وجهه لامعا، فخافوا أن يقتربوا منه،"]]}, {"l": "Pro 4:8", "n": "", "vs": [[8, "مجدها فتمجدك، اعتنقها فتكرمك."]]}, {"l": "Pro 4:9", "n": "", "vs": [[9, "تتوج رأسك بإكليل جمال، وتنعم عليك بتاج بهاء»."]]}, {"l": "Pro 17:24", "n": "", "vs": [[24, "الحكمة هي غاية العاقل أما عينا الجاهل فزائغتان إلى أقاصي الأرض."]]}, {"l": "Pro 24:5", "n": "", "vs": [[5, "الرجل الحكيم يتمتع بالعزة، وذو المعرفة يزداد قوة،"]]}, {"l": "Mat 17:2", "n": "", "vs": [[2, "وتجلى أمامهم، فشع وجهه كالشمس، وصارت ثيابه بيضاء كالنور."]]}, {"l": "Act 6:15", "n": "", "vs": [[15, "فلما نظر إليه جميع الحاضرين في المجلس رأوا وجهه كأنه وجه ملاك."]]}], "kwAr": "حكمة الإنسان", "noteAr": ""}, {"kw": "and the", "raw": "Deu_28:50; Act_4:13, Act_4:29; Eph_6:19", "note": "", "refs": [{"l": "Deu 28:50", "n": "", "vs": [[50, "أمة يثير منظرها الرعب، لا تهاب الشيخ ولا ترأف بالطفل،"]]}, {"l": "Act 4:13", "n": "", "vs": [[13, "فتعجب المجتمعون من جرأة بطرس ويوحنا، لما عرفوا أنهما غير متعلمين وأنهما من عامة الشعب، فأدركوا أنهما كانا مع يسوع."]]}, {"l": "Act 4:29", "n": "", "vs": [[29, "والآن انظر، يارب، إلى تهديدهم، وهبنا نحن عبيدك أن نعلن كلامك بكل جرأة،"]]}, {"l": "Eph 6:19", "n": "", "vs": [[19, "ولأجلي كي ألهم ما أنطق به كلما فتحت فمي لأعلن بجرأة سر الإنجيل"]]}], "kwAr": "تضيء وجهه", "noteAr": ""}, {"kw": "boldness", "raw": "Heb. strength, 2Ti_4:17", "note": "Heb. strength, 2Ti_4:17", "refs": [{"l": "2Ti 4:17", "n": "", "vs": [[17, "إلا أن الرب وقف بجانبي وأمدني بالقوة، لكي تتم بي المناداة بالبشارة، فيسمعها جميع من هم من الأمم؛ وقد نجوت من فم الأسد."]]}], "kwAr": "صلابة ملامحه", "noteAr": "بالعبرانية: قوة. انظر 2تي 4: 17"}], "arS": [["من", ["H4310"]], [" هو نظير ", []], ["الحكيم", ["H2450"]], ["؟ ", []], ["ومن", ["H4310"]], [" ", []], ["يعرف", ["H3045"]], [" ", []], ["تعليل", ["H6592"]], [" ", []], ["الأمور", ["H1697"]], ["؟ ", []], ["حكمة", ["H2451"]], [" ", []], ["الإنسان", ["H120"]], [" ", []], ["تضيء", ["H215"]], [" ", []], ["وجهه", ["H6440"]], [" ", []], ["وتلطف", ["H8132"]], [" من ", []], ["صلابة", ["H5797"]], [" ملامحه.", []]]}, {"c": 8, "v": 2, "text": "أقول لك: أطع كلام الملك، ولاسيما من أجل يمين الله الذي أقسمت به.", "groups": [{"kw": "I counsel", "raw": "Pro_24:21; Rom_13:1-4; Tit_3:1; 1Pe_2:13-17", "note": "", "refs": [{"l": "Pro 24:21", "n": "", "vs": [[21, "ياابني اتق الرب والملك، ولا تعاشر المتقلبين،"]]}, {"l": "Rom 13:1-4", "n": "", "vs": [[1, "على كل نفس أن تخضع للسلطات الحاكمة. فلا سلطة إلا من عند الله، والسلطات القائمة مرتبة من قبل الله."], [2, "حتى إن من يقاوم السلطة، يقاوم ترتيب الله، والمقاومون سيجلبون العقاب على أنفسهم."], [3, "فإن الحكام لا يخافهم من يفعل الصلاح بل من يفعل الشر. أفترغب إذن في أن تكون غير خائف من السلطة؟ اعمل ما هو صالح، فتكون ممدوحا عندها،"], [4, "لأنها خادمة الله لك لأجل الخير. أما إن كنت تعمل الشر فخف، لأن السلطة لا تحمل السيف عبثا، إذ إنها خادمة الله، وهي التي تنتقم لغضبه ممن يفعل الشر."]]}, {"l": "Tit 3:1", "n": "", "vs": [[1, "ذكر المؤمنين أن يخضعوا للحكام والسلطات، ويطيعوا القانون، ويكونوا مستعدين لكل عمل صالح،"]]}, {"l": "1Pe 2:13-17", "n": "", "vs": [[13, "فإكراما للرب، اخضعوا لكل نظام يدير شؤون الناس: للملك، باعتباره صاحب السلطة العليا،"], [14, "وللحكام، باعتبارهم ممثلي الملك الذين يعاقبون المذنبين ويمدحون الصالحين."], [15, "فإن هذه هي إرادة الله: أن تفعلوا الخير دائما، فتفحموا جهالة الناس الأغبياء!"], [16, "تصرفوا كأحرار حقا، لا كالذين يتخذون من الحرية ستارا لارتكاب الشر بل باعتبار أنكم عبيد لله."], [17, "أكرموا جميع الناس. أحبوا الإخوة. خافوا الله . أكرموا الملك."]]}], "kwAr": "أقول لك", "noteAr": ""}, {"kw": "in regard", "raw": "1Ki_2:43; 1Ch_29:24; Eze_17:13-20; Rom_13:5", "note": "", "refs": [{"l": "1Ki 2:43", "n": "", "vs": [[43, "فلماذا نقضت يمين الرب ونكثت ما أوصيتك به؟»"]]}, {"l": "1Ch 29:24", "n": "", "vs": [[24, "كما أبدى الرؤساء والأبطال وسائر أبناء الملك داود خضوعا تاما لسليمان الملك."]]}, {"l": "Eze 17:13-20", "n": "", "vs": [[13, "واختار واحدا من ذرية العائلة الملكية وأبرم معه عهدا، وارتبط معه بقسم، واعتقل جميع أشراف البلاد،"], [14, "لتظل المملكة ذليلة عاجزة عن النهوض، بل توفي فقط بعهده ولا تنقرض."], [15, "لكن الملك تمرد عليه وأوفد رسلا إلى مصر يطلب خيلا وجيوشا غفيرة. أيفلح في ذلك؟ أيفلت مرتكب هذا الفعل؟ لقد نقض عهدا، أفيفلت من العواقب؟"], [16, "حي أنا يقول السيد الرب، إنه يموت عنده في بابل، مدينة الملك الذي نصبه ملكا، فازدرى هو حلفه، ونكث عهده."], [17, "ولن يغيثه فرعون بجيوشه العظيمة وجموعه الغفيرة في القتال، حين تقام المتاريس وتبنى بروج الحصار للقضاء على نفوس كثيرة."], [18, "لقد ازدرى الحلف حين نكث العهد، وها هو قد مد يد الولاء إلى مصر. ولكنه وإن فعل هذا كله لن يفلت."], [19, "لذلك، هذا ما يقوله السيد الرب: حي أنا؛ إن حلفي الذي ازدراه، وعهدي الذي نكثه لابد أن يقعا على رأسه."], [20, "وأنشر شبكتي عليه فيقع في شركي، وأحضره إلى بابل وأحاكمه هناك على ما ارتكبه من تعد علي."]]}, {"l": "Rom 13:5", "n": "", "vs": [[5, "ولذلك، فمن الضروري أن تخضعوا، لا اتقاء للغضب فقط، بل مراعاة للضمير أيضا."]]}], "kwAr": "من أجل يمين الله", "noteAr": ""}], "arS": [["أقول ", []], ["لك", ["H5921"]], [": ", []], ["أطع", ["H8104"]], [" ", []], ["كلام", ["H6310"]], [" ", []], ["الملك", ["H4428"]], ["، ولاسيما من ", []], ["أجل", ["H1700"]], [" ", []], ["يمين", ["H7621"]], [" ", []], ["الله", ["H430"]], [" الذي أقسمت به.", []]]}, {"c": 8, "v": 3, "text": "لا تسرع في الاختفاء من حضرته، ولا تتشبث بقضية سيئة لأنه يصنع ما يشاء،", "groups": [{"kw": "not hasty", "raw": "Ecc_10:4; Pro_14:29", "note": "", "refs": [{"l": "Ecc 10:4", "n": "", "vs": [[4, "إذا ثار غضب الحاكم عليك فلا تهجر مكانك، فإن الهدوء يسكن السخط على خطايا عظيمة."]]}, {"l": "Pro 14:29", "n": "", "vs": [[29, "البطيء الغضب ذو فهم كثير، أما السريع إلى السخط فيبدي حماقة."]]}], "kwAr": "لا تسرع في الاختفاء", "noteAr": ""}, {"kw": "stand", "raw": "1Ki_1:50-52, 1Ki_2:21-24; Isa_48:4; Jer_44:16, Jer_44:17; Act_5:8, Act_5:9", "note": "", "refs": [{"l": "1Ki 1:50-52", "n": "", "vs": [[50, "وملأ الخوف أدونيا من سليمان، فانطلق مسرعا وتمسك بقرون المذبح."], [51, "فقيل لسليمان: «ها هو أدونيا قد ملأه الخوف منك، وقد لجأ إلى المذبح يتمسك بقرونه ويقول: ليحلف لي اليوم سليمان أنه لا يقتل عبده بالسيف»."], [52, "فقال سليمان: «إن أثبت صدق ولائه فإن شعرة واحدة من رأسه لن تسقط إلى الأرض، ولكن إن أضمر الخيانة والشر فإنه حتما يموت»."]]}, {"l": "1Ki 2:21-24", "n": "", "vs": [[21, "فقالت: «زوج أدونيا أخاك من أبيشج الشونمية»."], [22, "فأجابها الملك: «لماذا تطلبين أبيشج الشونمية فقط لأدونيا؟ اطلبي له الملك أيضا، فهو أخي الأكبر، فيصبح الملك له ولأبياثار الكاهن ويوآب ابن صروية»."], [23, "وحلف سليمان الملك بالرب قائلا: «ليعاقبني الرب أشد عقاب ويزد إن لم يدفع أدونيا حياته ثمنا لهذا المطلب."], [24, "حي هو الرب الذي ثبتني وأجلسني على عرش داود أبي وأعطاني ملكا كما وعد. اليوم يموت أدونيا»."]]}, {"l": "Isa 48:4", "n": "", "vs": [[4, "لأني عالم بعنادك، وأن رقبتك ذات عضل من حديد وجبهتك من نحاس."]]}, {"l": "Jer 44:16", "n": "", "vs": [[16, "«لن نطيعك في ما خاطبتنا به من كلام باسم الرب،"]]}, {"l": "Jer 44:17", "n": "", "vs": [[17, "بل نعمل بمقتضى ما تعهدنا به، فنحرق بخورا لملكة السماء ونقرب لها السكائب كما سبق أن فعلنا نحن وآباؤنا وملوكنا ورؤساؤنا في مدن يهوذا وفي شوارع أورشليم، فكانت لنا وفرة من الطعام وتمتعنا بالخير ولم يصبنا شر."]]}, {"l": "Act 5:8", "n": "", "vs": [[8, "فسألها بطرس: «قولي لي: أبهذا المبلغ بعتما الحقل؟» فأجابت: «نعم، بهذا المبلغ»."]]}, {"l": "Act 5:9", "n": "", "vs": [[9, "فقال لها بطرس: «لماذا اتفقت مع زوجك على امتحان روح الرب؟ ها قد وصل الشبان الذين دفنوا زوجك إلى الباب، وسيحملونك أيضا!»"]]}], "kwAr": "ولا تتشبث", "noteAr": ""}, {"kw": "for", "raw": "Pro_16:14, Pro_16:15, Pro_30:31; Dan_4:35, Dan_5:19", "note": "", "refs": [{"l": "Pro 16:14", "n": "", "vs": [[14, "غضب الملك رسول الموت، وعلى الحكيم استرضاؤه."]]}, {"l": "Pro 16:15", "n": "", "vs": [[15, "في بشاشة وجه الملك حياة، ورضاه كسحاب المطر المتأخر."]]}, {"l": "Pro 30:31", "n": "", "vs": [[31, "والطاووس المختال، والتيس، والملك في طليعة جيشه."]]}, {"l": "Dan 4:35", "n": "", "vs": [[35, "وعرفت أن كل أهل الأرض لا يحسبون شيئا، وأنه يفعل ما يشاء في جند السماء وسكان الأرض، وليس من يكف يده أو يقول له: ماذا تفعل؟"]]}, {"l": "Dan 5:19", "n": "", "vs": [[19, "ولفرط عظمته التي أنعم الله بها عليه، كانت جميع الأمم والشعوب من كل لسان ترتعد أمامه وتفزع، فكان يقتل من يشاء، ويستحيي من يشاء، يرفع من يشاء ويضع من يشاء."]]}], "kwAr": "لأنه يصنع ما يشاء", "noteAr": ""}], "arS": [["لا", ["H408"]], [" ", []], ["تسرع", ["H926"]], [" في الاختفاء ", []], ["من", ["H4480"]], [" ", []], ["حضرته", ["H6440"]], ["، ", []], ["ولا", ["H408"]], [" ", []], ["تتشبث", ["H5975"]], [" ", []], ["بقضية", ["H1697"]], [" ", []], ["سيئة", ["H7451"]], [" ", []], ["لأنه", ["H3588"]], [" ", []], ["يصنع", ["H6213"]], [" ", []], ["ما", ["H834"]], [" ", []], ["يشاء", ["H2654"]], ["،", []]]}, {"c": 8, "v": 4, "text": "إذ تنطوي كلمة الملك على سلطان. ومن يقدر أن يقول له: ماذا تفعل؟", "groups": [{"kw": "the word", "raw": "1Ki_2:25, 1Ki_2:29-34, 1Ki_2:46; Pro_19:12, Pro_20:2, Pro_30:31; Dan_3:15; Luk_12:4, Luk_12:5; Rom_13:1-4", "note": "", "refs": [{"l": "1Ki 2:25", "n": "", "vs": [[25, "وأرسل الملك سليمان بناياهو بن يهوياداع فقتل أدونيا."]]}, {"l": "1Ki 2:29-34", "n": "", "vs": [[29, "فقيل للملك سليمان إن يوآب قد لجأ إلى خيمة الرب، وها هو مقيم إلى جوار المذبح، فأمر سليمان بناياهو بن يهوياداع أن يذهب ويقتله."], [30, "فدخل بناياهو إلى خيمة الرب وقال ليوآب: «الملك يأمرك بالخروج» فأجاب: «لا. لن أخرج بل أموت هنا» فأبلغ بناياهو الملك جواب يوآب"], [31, "فقال له الملك: «افعل مثلما قال، واقتله وادفنه وأزل عني وعن بيت أبي ذنب الدماء الزكية التي سفكها يوآب،"], [32, "فيحمله الرب وحده وزر إثمه، لأنه اغتال بالسيف رجلين بريئين، هما أفضل منه، من غير علم داود أبي، وهما أبنير بن نير رئيس جيش إسرائيل، وعماسا بن يثر رئيس جيش يهوذا،"], [33, "فيرتد دمهما على رأس يوآب ورأس نسله إلى الأبد، ويملأ سلام الرب داود ونسله وبيته وعرشه إلى مدى الدهر»."], [34, "فانطلق بناياهو بن يهوياداع وقتل يوآب. ودفن في جوار بيته في الصحراء."]]}, {"l": "1Ki 2:46", "n": "", "vs": [[46, "وأمر الملك بناياهو بن يهوياداع أن يخرج بشمعي ويقتله، وهكذا ثبت الملك لسليمان."]]}, {"l": "Pro 19:12", "n": "", "vs": [[12, "حنق الملك كزمجرة الأسد، ورضاه كالطل على العشب."]]}, {"l": "Pro 20:2", "n": "", "vs": [[2, "سخط الملك مثل زمجرة الأسد، ومن يثير غيظه يسيء إلى نفسه."]]}, {"l": "Pro 30:31", "n": "", "vs": [[31, "والطاووس المختال، والتيس، والملك في طليعة جيشه."]]}, {"l": "Dan 3:15", "n": "", "vs": [[15, "والآن إن كنتم مستعدين لدى سماعكم صوت الالات الموسيقية المختلفة أن تنحنوا وتسجدوا للتمثال الذي صنعته، أعفو عنكم. ولكن إن أبيتم السجود، تطرحون في تلك الساعة في وسط أتون النار المتقدة. وأي إله يقدر أن ينقذكم عندئذ من يدي؟»"]]}, {"l": "Luk 12:4", "n": "", "vs": [[4, "على أني أقول لكم ياأحبائي: لا تخافوا من الذين يقتلون الجسد ثم لا يستطيعون أن يفعلوا أكثر من ذلك."]]}, {"l": "Luk 12:5", "n": "", "vs": [[5, "ولكني أريكم ممن تخافون: خافوا من القادر أن يلقي في جهنم بعد القتل. نعم، أقول لكم، من هذا خافوا!"]]}, {"l": "Rom 13:1-4", "n": "", "vs": [[1, "على كل نفس أن تخضع للسلطات الحاكمة. فلا سلطة إلا من عند الله، والسلطات القائمة مرتبة من قبل الله."], [2, "حتى إن من يقاوم السلطة، يقاوم ترتيب الله، والمقاومون سيجلبون العقاب على أنفسهم."], [3, "فإن الحكام لا يخافهم من يفعل الصلاح بل من يفعل الشر. أفترغب إذن في أن تكون غير خائف من السلطة؟ اعمل ما هو صالح، فتكون ممدوحا عندها،"], [4, "لأنها خادمة الله لك لأجل الخير. أما إن كنت تعمل الشر فخف، لأن السلطة لا تحمل السيف عبثا، إذ إنها خادمة الله، وهي التي تنتقم لغضبه ممن يفعل الشر."]]}], "kwAr": "كلمة الملك", "noteAr": ""}, {"kw": "What", "raw": "Job_33:12, Job_33:13, Job_34:18, Job_34:19; Rom_9:20", "note": "", "refs": [{"l": "Job 33:12", "n": "", "vs": [[12, "ولكنك مخطيء في هذا، وأنا الذي أجيبك. إن الله أعظم من الإنسان،"]]}, {"l": "Job 33:13", "n": "", "vs": [[13, "فما بالك تخاصمه قائلا: إنه لن يجيب عن تساؤلاتي؟"]]}, {"l": "Job 34:18", "n": "", "vs": [[18, "الذي يقول للملك: أنت عديم القيمة، وللنبلاء: أنتم أشرار؟"]]}, {"l": "Job 34:19", "n": "", "vs": [[19, "الذي لا يحابي الأمراء، ولا يؤثر الأغنياء على الفقراء، لأنهم جميعا عمل يديه."]]}, {"l": "Rom 9:20", "n": "", "vs": [[20, "فأقول: من أنت أيها الإنسان حتى ترد جوابا على الله؟ أيقول الشيء المصنوع لصانعه: لماذا صنعتني هكذا؟"]]}], "kwAr": "ماذا تفعل", "noteAr": ""}], "arS": [["إذ تنطوي ", []], ["كلمة", ["H1697"]], [" ", []], ["الملك", ["H4428"]], [" على ", []], ["سلطان", ["H7983"]], [". ", []], ["ومن", ["H4310"]], [" يقدر أن ", []], ["يقول", ["H559"]], [" له: ", []], ["ماذا", ["H4100"]], [" ", []], ["تفعل", ["H6213"]], ["؟", []]]}, {"c": 8, "v": 5, "text": "من يطع الأمر لا يلق أذى، وقلب الحكيم يدرك الوقت المناسب وأسلوب القضاء.", "groups": [{"kw": "keepeth", "raw": "Ecc_8:2; Exo_1:17, Exo_1:20, Exo_1:21; Psa_119:6; Hos_5:11; Luk_20:25; Act_4:19, Act_5:29; Rom_13:5-7; 1Pe_3:13, 1Pe_3:14", "note": "", "refs": [{"l": "Ecc 8:2", "n": "", "vs": [[2, "أقول لك: أطع كلام الملك، ولاسيما من أجل يمين الله الذي أقسمت به."]]}, {"l": "Exo 1:17", "n": "", "vs": [[17, "غير أن القابلتين كانتا تخافان الله فلم تنفذا أمر الملك فاستحيتا الأطفال الذكور."]]}, {"l": "Exo 1:20", "n": "", "vs": [[20, "وتكاثر الشعب وعظم جدا."]]}, {"l": "Exo 1:21", "n": "", "vs": [[21, "وإذ خافت القابلتان الله أثابهما بنسل."]]}, {"l": "Psa 119:6", "n": "", "vs": [[6, "عندئذ لا أخزى إذا تأملت في جميع وصاياك."]]}, {"l": "Hos 5:11", "n": "", "vs": [[11, "لقد لحق الضيق بإسرائيل، وسحقه القضاء لأنه وطد العزم على الغواية وراء الأوثان."]]}, {"l": "Luk 20:25", "n": "", "vs": [[25, "فقال لهم: «إذن، أعطوا ما للقيصر للقيصر، وما لله لله»."]]}, {"l": "Act 4:19", "n": "", "vs": [[19, "ولكن بطرس ويوحنا قالا: «احكموا أنتم: أمن الحق أمام الله أن نطيع أمركم لا أمر الله؟"]]}, {"l": "Act 5:29", "n": "", "vs": [[29, "فأجاب بطرس والرسل: «ينبغي أن يطاع الله لا الناس!"]]}, {"l": "Rom 13:5-7", "n": "", "vs": [[5, "ولذلك، فمن الضروري أن تخضعوا، لا اتقاء للغضب فقط، بل مراعاة للضمير أيضا."], [6, "فلهذا السبب تدفعون الضرائب أيضا، لأن رجال السلطة هم خدام لله يواظبون على هذا العمل بعينه."], [7, "فأدوا لكل واحد حقه: الضريبة لصاحب الضريبة والجزية لصاحب الجزية، والاحترام لصاحب الاحترام، والإكرام لصاحب الإكرام."]]}, {"l": "1Pe 3:13", "n": "", "vs": [[13, "من يؤذيكم إن كنتم متحمسين للخير؟"]]}, {"l": "1Pe 3:14", "n": "", "vs": [[14, "وإن كان لابد أن تتألموا في سبيل البر، فطوبى لكم! لا تخافوا من تهديد الذين يضطهدونكم، ولا تقلقوا."]]}], "kwAr": "من يطع الأمر", "noteAr": ""}, {"kw": "feel", "raw": "Heb. know", "note": "Heb. know", "refs": [], "kwAr": "لا يلق أذى", "noteAr": "بالعبرانية: يعرف."}, {"kw": "a wise", "raw": "Ecc_2:14, Ecc_10:2; 1Ch_12:32; Pro_17:24; Luk_12:56, Luk_12:57; 1Co_2:14, 1Co_2:15; Phi_1:9, Phi_1:10; Col_1:9; Heb_5:14", "note": "", "refs": [{"l": "Ecc 2:14", "n": "", "vs": [[14, "لأن عيني الحكيم في رأسه، أما الجاهل فيمشي في الظلمة. لكنني أدركت أنهما يلاقيان مصيرا واحدا."]]}, {"l": "Ecc 10:2", "n": "", "vs": [[2, "قلب الحكيم ميال لعمل الحق، وقلب الجاهل ينزع نحو ارتكاب الشر."]]}, {"l": "1Ch 12:32", "n": "", "vs": [[32, "ومن سبط يساكر، من ذوي الخبرة والحكمة في سياسة شؤون إسرائيل: مئتان من الرؤساء مع أقربائهم الذين تحت إمرتهم."]]}, {"l": "Pro 17:24", "n": "", "vs": [[24, "الحكمة هي غاية العاقل أما عينا الجاهل فزائغتان إلى أقاصي الأرض."]]}, {"l": "Luk 12:56", "n": "", "vs": [[56, "يا مراؤون! تعرفون أن تميزوا منظر الأرض والسماء، قكيف لا تميزون هذا الزمان؟"]]}, {"l": "Luk 12:57", "n": "", "vs": [[57, "ولماذا لا تميزون ما هو حق من تلقاء أنفسكم؟"]]}, {"l": "1Co 2:14", "n": "", "vs": [[14, "غير أن الإنسان البشري لا يتقبل أمور روح الله إذ يعتبرها جهالة، ولا يستطيع أن يعرفها لأن تمييزها إنما يحتاج إلى حس روحي."]]}, {"l": "1Co 2:15", "n": "", "vs": [[15, "أما الإنسان الروحي، فهو يميز كل شيء، ولا يحكم فيه من أحد."]]}, {"l": "Phi 1:9", "n": "", "vs": [[9, "وصلاتي لأجلكم هي هذه: أن تزداد محبتكم أكثر فأكثر في تمام المعرفة والإدراك،"]]}, {"l": "Phi 1:10", "n": "", "vs": [[10, "لكي تستحسنوا الأمور الممتازة، حتى تكونوا طاهرين وخالين من العثرات إلى يوم المسيح،"]]}, {"l": "Col 1:9", "n": "", "vs": [[9, "لذلك نحن أيضا، من اليوم الذي فيه سمعنا بأخباركم، مازلنا نصلي ونتضرع لأجلكم، لأن تمتلئوا من تمام المعرفة لمشيئة الله في كل حكمة وإدراك روحي،"]]}, {"l": "Heb 5:14", "n": "", "vs": [[14, "أما الناضجون روحيا، فهم قادرون على تناول الطعام القوي: لأن حواسهم قد تدربت، بالممارسة الصحيحة، على التمييز بين الخير والشر."]]}], "kwAr": "وقلب الحكيم", "noteAr": ""}], "arS": [["من ", []], ["يطع", ["H8104"]], [" ", []], ["الأمر", ["H1697", "H4687"]], [" ", []], ["لا", ["H3808"]], [" يلق ", []], ["أذى", ["H7451"]], ["، ", []], ["وقلب", ["H3820"]], [" ", []], ["الحكيم", ["H2450"]], [" ", []], ["يدرك", ["H3045"]], [" ", []], ["الوقت", ["H6256"]], [" المناسب وأسلوب ", []], ["القضاء", ["H4941"]], [".", []]]}, {"c": 8, "v": 6, "text": "فهناك وقت وأسلوب لكل أمر مع أن كاهل الإنسان ينوء بثقل متاعبه.", "groups": [{"kw": "to every", "raw": "Ecc_3:1, Ecc_3:11, Ecc_3:17, Ecc_7:13, Ecc_7:14", "note": "", "refs": [{"l": "Ecc 3:1", "n": "", "vs": [[1, "لكل شيء أوان، ولكل أمر تحت السماء زمان."]]}, {"l": "Ecc 3:11", "n": "", "vs": [[11, "إذ صنع كل شيء حسنا في حينه وغرس الأبدية في قلوب البشر، ومع ذلك لم يدركوا أعمال الله من البداية إلى النهاية."]]}, {"l": "Ecc 3:17", "n": "", "vs": [[17, "فقلت في نفسي: إن الله سيحكم على الصديق وعلى الشرير، لأن لكل عمل ولكل أمر وقتا هناك."]]}, {"l": "Ecc 7:13", "n": "", "vs": [[13, "تأمل في عمل الله، من يقدر أن يقوم ما يعوجه؟"]]}, {"l": "Ecc 7:14", "n": "", "vs": [[14, "افرح في يوم السراء، واعتبر في يوم الضراء. إن الرب قد جعل السراء مع الضراء، لئلا يكتشف الإنسان شيئا مما يحدث بعد موته."]]}], "kwAr": "لكل أمر", "noteAr": ""}, {"kw": "therefore", "raw": "Ecc_11:9, Ecc_11:10, Ecc_12:1; Isa_3:11-14, Isa_22:12-14; Luk_13:25, Luk_17:26-30, Luk_19:42-44; Heb_3:7-11", "note": "", "refs": [{"l": "Ecc 11:9", "n": "", "vs": [[9, "افرح أيها الشاب في حداثتك، وليمتعك قلبك في أيام شبابك، واتبع أهواء قلبك، وكل ما تشهده عيناك. ولكن اعلم أنه بسبب هذه الأمور كلها يأتي الله بك إلى كرسي القضاء."]]}, {"l": "Ecc 11:10", "n": "", "vs": [[10, "فأزل الغم من صدرك، واقص الشر عن جسدك، لأن الحداثة والشباب باطلان."]]}, {"l": "Ecc 12:1", "n": "", "vs": [[1, "فاذكر خالقك في أيام حداثتك قبل أن تقبل عليك أيام الشر، أو تغلب عليك السنون، حين تقول: ليس لي فيها لذة."]]}, {"l": "Isa 3:11-14", "n": "", "vs": [[11, "أما الشرير فويل له وبئس المصير لأنه يجازى على ما جنته يداه"], [12, "ظالمو شعبي أولاد والحاكمون عليه نساء. آه ياشعبي! إن قادتكم يضلونكم ويقتادونكم في مسالك منحرفة."], [13, "لقد تربع الرب على كرسي القضاء، قام ليدين الناس."], [14, "الرب يدخل في المحاكمة ضد شيوخ شعبه وقادتهم. ويقول السيد الرب القدير: «أنتم الذين أتلفتم كرمي، وصار سلب البائس في منازلكم."]]}, {"l": "Isa 22:12-14", "n": "", "vs": [[12, "في ذلك اليوم يدعوكم السيد الرب القدير للبكاء والنوح وحلق الشعر والتنطق بالمسوح."], [13, "ولكنكم انهمكتم بالفرح والسرور وذبح الثيران وتضحية الغنم وأكل اللحم وشرب الخمر قائلين: «لنأكل ونشرب لأننا غدا نموت»."], [14, "فقال لي القدير: «لن تغفر لكم آثامكم حتى تموتوا»."]]}, {"l": "Luk 13:25", "n": "", "vs": [[25, "فمن بعد ما يكون رب البيت قد قام وأغلق الباب، وتبدأون بالوقوف خارجا تقرعون الباب قائلين: يارب افتح لنا! فيجيبكم قائلا: لا أعرف من أين أنتم!"]]}, {"l": "Luk 17:26-30", "n": "", "vs": [[26, "وكما حدث في زمان نوح، هكذا أيضا سوف يحدث في زمان ابن الإنسان:"], [27, "كان الناس يأكلون ويشربون ويتزوجون ويزوجون، إلى اليوم الذي فيه دخل نوح السفينة وجاء الطوفان فأهلك الجميع."], [28, "وكذلك، كما حدث في زمان لوط: كانوا يأكلون ويشربون ويشترون ويبيعون ويغرسون ويبنون،"], [29, "ولكن في اليوم الذي فيه خرج لوط من سدوم، أمطر (الله ) من السماء نارا وكبريتا، فأهلك الجميع"], [30, "هكذا سيحدث في يوم ظهور ابن الإنسان."]]}, {"l": "Luk 19:42-44", "n": "", "vs": [[42, "قائلا: «ليتك أنت أيضا، في يومك هذا، عرفت ما فيه سلامك! ولكن ذلك محجوب الآن عن عينيك."], [43, "فستأتي عليك أيام يحاصرك فيها أعداؤك بالمتاريس، ويطبقون عليك، ويشددون عليك الحصار من كل جهة،"], [44, "ويهدمونك على أبنائك الذين فيك، فلا يتركون فيك حجرا فوق حجر: لأنك لم تعرفي وقت افتقاد الله لك»."]]}, {"l": "Heb 3:7-11", "n": "", "vs": [[7, "لهذا، ينبهنا الروح القدس إذ يقول: «اليوم، إن سمعتم صوته،"], [8, "فلا تقسوا قلوبكم، كما حدث قديما، حين أثار آباؤكم غضبي، يوم التجربة في الصحراء."], [9, "هناك جربوني واختبروني، وقد شاهدوا أعمالي طوال أربعين سنة."], [10, "لذلك ثار غضبي على ذلك الجيل، وقلت: إن قلوبهم تدفعهم دائما إلى الضلال، ولم يعرفوا طرقي قط!"], [11, "وهكذا، في غضبي، أقسمت قائلا: إنهم لن يدخلوا مكان راحتي!»"]]}], "kwAr": "ينوء بثقل متاعبه", "noteAr": ""}], "arS": [["فهناك", ["H3426"]], [" ", []], ["وقت", ["H6256"]], [" ", []], ["وأسلوب", ["H4941"]], [" ", []], ["لكل", ["H3605"]], [" أمر ", []], ["مع", ["H5921"]], [" ", []], ["أن", ["H3588"]], [" كاهل ", []], ["الإنسان", ["H120"]], [" ينوء ", []], ["بثقل", ["H7227"]], [" ", []], ["متاعبه", ["H7451"]], [".", []]]}, {"c": 8, "v": 7, "text": "لأنه لا يعرف ما يضمره الغد، إذ من يخبره عما تكون عليه الأحداث؟", "groups": [{"kw": "he knoweth", "raw": "Ecc_6:12, Ecc_9:12, Ecc_10:14; Pro_24:22, Pro_29:1; Mat_24:44, Mat_24:50, Mat_25:6-13; 1Th_5:1-3", "note": "", "refs": [{"l": "Ecc 6:12", "n": "", "vs": [[12, "إذ من يدري ما هو خير للإنسان في الحيا ة التي يقضي فيها أياما قليلة باطلة كالظل؟ ومن يقدر أن يطلع الإنسان على ما سيحدث تحت الشمس من بعده؟"]]}, {"l": "Ecc 9:12", "n": "", "vs": [[12, "فالمرء لا يعلم متى يحين وقته، فكما تقع الأسماك في شبكة مهلكة، أو تعلق العصافير بالفخاخ، هكذا تقتنص الأيام الرديئة بني البشر، إذ تفاجئهم على حين غرة."
