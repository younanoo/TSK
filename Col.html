هود غفي السماء، الآب والكلمة والروح القدس، وهؤلاء الثلاثة هم واحدف."]]}], "kwAr": "لمعرفة سر الله", "noteAr": ""}, {"kw": "of the Father", "raw": "Col_1:15-17; Isa_53:11; Jer_9:24; Mat_11:25, Mat_11:27; Luk_10:21, Luk_10:22; Joh_1:1-3 Joh_5:17, Joh_5:23, Joh_10:30, Joh_10:38, Joh_14:9-11, Joh_16:15, Joh_17:21-23; 1Ti_3:16", "note": "", "refs": [{"l": "Col 1:15-17", "n": "", "vs": [[15, "هو صورة الله الذي لا يرى، والبكر على كل ما قد خلق،"], [16, "إذ به خلقت جميع الأشياء: ما في السماوات وما على الأرض، ما يرى وما لا يرى، أعروشا كانت أم سيادات أم رئاسات أم سلطات. كل ما في الكون قد خلق به ولأجله."], [17, "هو كائن قبل كل شيء، وبه يدوم كل شيء."]]}, {"l": "Isa 53:11", "n": "", "vs": [[11, "ويرى ثمار تعب نفسه ويشبع، وعبدي البار يبرر بمعرفته كثيرين ويحمل آثامهم."]]}, {"l": "Jer 9:24", "n": "", "vs": [[24, "بل ليفتخر المفتخر بأنه يدرك ويعرفني أني أنا الرب الذي يمارس الرحمة والعدل والبر في الأرض لأني أسر بها»."]]}, {"l": "Mat 11:25", "n": "", "vs": [[25, "وفي ذلك الوقت، تكلم يسوع فقال: «أحمدك أيها الآب، رب السماء والأرض، لأنك حجبت هذه الأمور عن الحكماء والفهماء، وكشفتها للأطفال!"]]}, {"l": "Mat 11:27", "n": "", "vs": [[27, "كل شيء قد سلمه إلي أبي. ولا أحد يعرف الابن إلا الآب، ولا أحد يعرف الآب إلا الابن، ومن أراد الابن أن يعلنه له."]]}, {"l": "Luk 10:21", "n": "", "vs": [[21, "في تلك الساعة ابتهج يسوع بالروح وقال: «أحمدك أيها الآب، رب السماء والأرض، لأنك حجبت هذه الأمور عن الحكماء والفهماء، وكشفتها للأطفال. نعم، أيها الآب، لأنه هكذا حسن في نظرك!"]]}, {"l": "Luk 10:22", "n": "", "vs": [[22, "كل شيء قد سلم إلي من قبل أبي، ولا أحد يعرف من هو الابن إلا الآب، ولا من هو الآب إلا الابن ومن أراد الابن أن يعلنه له!»"]]}, {"l": "Joh 1:1-3", "n": "", "vs": [[1, "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."], [2, "هو كان في البدء عند الله."], [3, "به تكون كل شيء، وبغيره لم يتكون أي شيء مما تكون."]]}, {"l": "Joh 5:17", "n": "", "vs": [[17, "ولكن يسوع قال لهم: «ما زال أبي يعمل إلى الآن. وأنا أيضا أعمل!»"]]}, {"l": "Joh 5:23", "n": "", "vs": [[23, "ليكرم الجميع الابن كما يكرمون الآب. ومن لا يكرم الابن لا يكرم الآب الذي أرسله."]]}, {"l": "Joh 10:30", "n": "", "vs": [[30, "أنا والآب واحد!»"]]}, {"l": "Joh 10:38", "n": "", "vs": [[38, "أما إن كنت أفعل ذلك، فصدقوا تلك الأعمال، إن كنتم لا تصدقونني أنا. عندئذ تعرفون ويتأكد لكم أن الآب في وأنا فيه»."]]}, {"l": "Joh 14:9-11", "n": "", "vs": [[9, "فأجابه يسوع: «مضت هذه المدة الطويلة وأنا معكم ولم تعرفني يافيلبس؟ الذي رآني رأى الآب، فكيف تقول: أرنا الآب؟"], [10, "ألا تؤمن أني أنا في الآب، وأن الآب في؟ الكلام الذي أقوله لا أقوله من عندي، وإنما الآب الحال في هو يعمل أعماله هذه."], [11, "صدقوا قولي: إني أنا في الآب وإن الآب في، وإلا فصدقوني بسبب تلك الأعمال."]]}, {"l": "Joh 16:15", "n": "", "vs": [[15, "كل ما هو للآب، فهو لي. ولذلك قلت لكم إن ما سيحدثكم به صادر عني."]]}, {"l": "Joh 17:21-23", "n": "", "vs": [[21, "ليكون الجميع واحدا؛ أيها الآب، كما أنك أنت في وأنا فيك، ليكونوا هم أيضا واحدا فينا، لكي يؤمن العالم أنك أنت أرسلتني."], [22, "إني أعطيتهم المجد الذي أعطيتني، ليكونوا واحدا كما نحن واحد."], [23, "أنا فيهم، وأنت في، ليكتملوا فيصيروا واحدا، حتى يعرف العالم أنك أرسلتني وأنك أحببتهم كما أحببتني."]]}, {"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}], "kwAr": "أي المسيح", "noteAr": ""}], "arS": [["بغرض أن ", []], ["تتشجع", ["G3870"]], [" ", []], ["قلوبهم", ["G2588"]], [" وتكون كلها ", []], ["متحدة", ["G4822"]], [" في ", []], ["المحبة", ["G26"]], ["، لبلوغ ", []], ["الإدراك", ["G4907"]], [" ", []], ["التام", ["G4136"]], [" بكل ", []], ["غناه", ["G4149"]], ["، ", []], ["لمعرفة", ["G1922"]], [" ", []], ["سر", ["G3466"]], [" ", []], ["الله", ["G2316"]], ["، أي ", []], ["المسيح", ["G5547"]], ["،", []]]}, {"c": 2, "v": 3, "text": "المخزونة فيه كنوز الحكمة والمعرفة كلها.", "groups": [{"kw": "In whom", "raw": "or, Wherein, Col_1:9, Col_1:19, Col_3:16; Rom_11:33; 1Co_1:24, 1Co_1:30, 1Co_2:6-8; Eph_1:8, Eph_3:10; 2Ti_3:15-17", "note": "or, Wherein, Col_1:9, Col_1:19, Col_3:16; Rom_11:33; 1Co_1:24, 1Co_1:30, 1Co_2:6-8; Eph_1:8, Eph_3:10; 2Ti_3:15-17", "refs": [{"l": "Col 1:9", "n": "", "vs": [[9, "لذلك نحن أيضا، من اليوم الذي فيه سمعنا بأخباركم، مازلنا نصلي ونتضرع لأجلكم، لأن تمتلئوا من تمام المعرفة لمشيئة الله في كل حكمة وإدراك روحي،"]]}, {"l": "Col 1:19", "n": "", "vs": [[19, "فإنه فيه سر الله أن يحل بكل ملئه،"]]}, {"l": "Col 3:16", "n": "", "vs": [[16, "لتسكن كلمة المسيح في داخلكم بغنى، في كل حكمة، معلمين وواعظين بعضكم بعضا، مرنمين بمزامير وتسابيح وأناشيد روحية في قلوبكم لله، رافعين له الحمد."]]}, {"l": "Rom 11:33", "n": "", "vs": [[33, "فما أعمق غنى الله وحكمته وعلمه! ما أبعد أحكامه عن الفحص وطرقه عن التتبع !"]]}, {"l": "1Co 1:24", "n": "", "vs": [[24, "وأما عند المدعوين، سواء من اليهود أو اليونانيين، فإن المسيح هو قدر ة الله وحكمة الله."]]}, {"l": "1Co 1:30", "n": "", "vs": [[30, "وبفضل الله صار لكم مقام في المسيح يسوع الذي جعل لنا حكمة من الله وبرا وقداسة وفداء،"]]}, {"l": "1Co 2:6-8", "n": "", "vs": [[6, "على أن لنا حكمة نتكلم بها بين البالغين. ولكنها حكمة ليست من هذا العالم ولا من رؤساء هذا العالم الزائلين."], [7, "بل إننا نتكلم بحكمة الله المطوية في سر، تلك الحكمة المحجوبة التي سبق الله فأعدها قبل الدهور لأجل مجدنا"], [8, "وهي حكمة لم يعرفها أحد من رؤساء هذا العالم. فلو عرفوها،"]]}, {"l": "Eph 1:8", "n": "", "vs": [[8, "التي جعلها تفيض علينا مصحوبة بكل حكمة وفهم."]]}, {"l": "Eph 3:10", "n": "", "vs": [[10, "والغاية أن يتجلى الآن أمام الرئاسات والسلطات في الأماكن السماوية ما يظهر في الكنيسة من حكمة الله المتعددة الوجوه،"]]}, {"l": "2Ti 3:15-17", "n": "", "vs": [[15, "وتعلم أنك منذ حداثة سنك تعرف الكتب المقدسة، وهي القادرة أن تجعلك حكيما لبلوغ الخلاص عن طريق الإيمان في المسيح يسوع."], [16, "إن الكتاب بكل ما فيه، قد أوحى به الله؛ وهو مفيد للتعليم والتوبيخ والتقويم وتهذيب الإنسان في البر،"], [17, "لكي يجعل إنسان الله مؤهلا تأهيلا كاملا، ومجهزا لكل عمل صالح."]]}], "kwAr": "المخزونة فيه", "noteAr": "أو: الذي فيه (المخزونة فيه)."}, {"kw": "hid", "raw": "Col_3:3; Job_28:21; Pro_2:4; Mat_10:26; Eph_3:9; Rev_2:17", "note": "", "refs": [{"l": "Col 3:3", "n": "", "vs": [[3, "فإنكم قد متم، وحياتكم مستورة مع المسيح في الله."]]}, {"l": "Job 28:21", "n": "", "vs": [[21, "إنها محجوبة عن عيني كل حي، وخافية عن طير السماء."]]}, {"l": "Pro 2:4", "n": "", "vs": [[4, "إن التمسته كما تلتمس الفضة، وبحثت عنه كما يبحث عن الكنوز الدفينة،"]]}, {"l": "Mat 10:26", "n": "", "vs": [[26, "فلا تخافوهم: لأنه ما من محجوب لن يكشف، وما من خفي لن يعلن!"]]}, {"l": "Eph 3:9", "n": "", "vs": [[9, "وأنير الجميع بمعرفة ما هو تدبير السر الذي أبقاه الله ، خالق كل شيء، مكتوما مدى الأجيال."]]}, {"l": "Rev 2:17", "n": "", "vs": [[17, "من له أذن فليسمع ما يقوله الروح للكنائس! كل من سينتصر سأطعمه من المن الخفي، وأعطيه حجرا صغيرا أبيض حفر عليه اسم جديد لا يعرفه إلا الذي يأخذه!"]]}], "kwAr": "كنوز الحكمة والمعرفة", "noteAr": ""}], "arS": [["المخزونة", ["G614"]], [" فيه ", []], ["كنوز", ["G2344"]], [" ", []], ["الحكمة", ["G4678"]], [" ", []], ["والمعرفة", ["G1108"]], [" ", []], ["كلها", ["G3956"]], [".", []]]}, {"c": 2, "v": 4, "text": "أقول هذا حتى لا يضللكم أحد بكلام خداع.", "groups": [{"kw": "lest", "raw": "Col_2:8, Col_2:18; Mat_24:4, Mat_24:24; Mar_13:22; Act_20:30; Rom_16:18, Rom_16:19; 2Co_11:3, 2Co_11:11-13; Gal_2:4; Eph_4:14, Eph_5:6; 2Th_2:9-11; 1Ti_4:1, 1Ti_4:2; 2Ti_2:16, 2Ti_3:13; Tit_1:10,Tit_1:11; 1Pe_2:1-3; 1Jo_2:18, 1Jo_2:26, 1Jo_4:1; 2Jo_1:7; Rev_12:9, Rev_13:8; Rev_20:3, Rev_20:8", "note": "", "refs": [{"l": "Col 2:8", "n": "", "vs": [[8, "احذروا أن يوقعكم أحد فريسة بالفلسفة والغرور الباطل، عملا بتقاليد الناس ومباديء العالم؛ مما لا يوافق المسيح."]]}, {"l": "Col 2:18", "n": "", "vs": [[18, "لا يحرمكم أحد من جائزتكم، بحملكم على ما يرغب فيه من إظهار التواضع والتعبد للملائكة، داخلا في رؤى يتوهمها، وقد نفخه باطلا ذهنه الجسدي،"]]}, {"l": "Mat 24:4", "n": "", "vs": [[4, "فأجاب يسوع: «انتبهوا! لا يضللكم أحد!"]]}, {"l": "Mat 24:24", "n": "", "vs": [[24, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات عظيمة وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Mar 13:22", "n": "", "vs": [[22, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Act 20:30", "n": "", "vs": [[30, "بل إن قوما منكم أنتم سيقومون ويعلمون تعاليم منحرفة، ليجروا التلاميذ وراءهم."]]}, {"l": "Rom 16:18", "n": "", "vs": [[18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."]]}, {"l": "Rom 16:19", "n": "", "vs": [[19, "إن خبر طاعتكم قد بلغ الجميع. ولذلك أفرح بكم، ولكن أريد لكم أن تكونوا حكماء في ما هو خير، وبسطاء في ما هو شر."]]}, {"l": "2Co 11:3", "n": "", "vs": [[3, "غير أني أخشى أن تضلل عقولكم عن الإخلاص والطهارة تجاه المسيح مثلما أغوت الحية بمكرها حواء."]]}, {"l": "2Co 11:11-13", "n": "", "vs": [[11, "لماذا؟ ألأني لا أحبكم؟ الله يعلم!"], [12, "ولكن، سأفعل ما أنا فاعله الآن لأسقط حجة الذين يلتمسون حجة تبين أنهم مثلنا في ما يفتخرون به."], [13, "فإن أمثال هؤلاء هم رسل دجالون، عمال ماكرون، يظهرون أنفسهم بمظهر رسل المسيح."]]}, {"l": "Gal 2:4", "n": "", "vs": [[4, "إنما أثير الأمر بسبب الإخوة الدجالين الذين أدخلوا بيننا خلسة، فاندسوا ليتجسسوا حريتنا التي لنا في المسيح يسوع، لعلهم يعيدوننا إلى العبودية؛"]]}, {"l": "Eph 4:14", "n": "", "vs": [[14, "وذلك حتى لا نكون فيما بعد أطفالا تتقاذفنا وتحملنا كل ريح تعليم يقوم على خداع الناس والمكر بهم لجرهم إلى الضلال الملفق،"]]}, {"l": "Eph 5:6", "n": "", "vs": [[6, "لا يخدعكم أحد بكلام باطل! فبسبب هذه الأمور يحل غضب الله على أبناء العصيان."]]}, {"l": "2Th 2:9-11", "n": "", "vs": [[9, "أما بروز المتمرد، فسوف يكون بقدر طاقة الشيطان على المعجزات والعلامات والعجائب المزيفة كلها،"], [10, "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا."], [11, "ولهذا السبب، سيرسل الله إليهم طاقة الضلال حتى يصدقوا ما هو دجل،"]]}, {"l": "1Ti 4:1", "n": "", "vs": [[1, "إلا أن الروح يعلن صراحة أن قوما في الأزمنة الأخيرة سوف يرتدون عن الإيمان، منساقين وراء أرواح مضللة وتعاليم شيطانية،"]]}, {"l": "1Ti 4:2", "n": "", "vs": [[2, "في موجة رياء ينشرها معلمون دجالون لهم ضمائر كويت بالنار."]]}, {"l": "2Ti 2:16", "n": "", "vs": [[16, "أما الأحاديث الباطلة الدنسة، فتجنبها؛ فإن المنصرفين إليها يتقدمون إلى فجور أفظع،"]]}, {"l": "2Ti 3:13", "n": "", "vs": [[13, "أما الناس الأشرار والدجالون المحتالون، فيتقدمون في الشر، مضللين الآخرين وهم أنفسهم مضللون!"]]}, {"l": "Tit 1:10", "n": "", "vs": [[10, "فإن هنالك كثيرين من معلمي الباطل المتمردين وخادعي عقول الناس، وبخاصة الذين من أهل الختان."]]}, {"l": "Tit 1:11", "n": "", "vs": [[11, "هؤلاء يجب أن تسد أفواههم: فهم يخربون بيوتا بجملتها، إذ يعلمون تعاليم يجب ألا تعلم، في سبيل مكسب خسيس."]]}, {"l": "1Pe 2:1-3", "n": "", "vs": [[1, "لذلك، تخلصوا من كل أثر للشر والخداع والرياء والحسد والذم."], [2, "وكأطفال مولودين حديثا، تشوقوا إلى اللبن الروحي النقي لكي تنموا به إلى أن تبلغوا الخلاص،"], [3, "إن كنتم حقا قد تذوقتم أن الرب طيب!"]]}, {"l": "1Jo 2:18", "n": "", "vs": [[18, "أيها الأولاد، اعلموا أننا نعيش الآن في الزمن الأخير. وكما سمعتم أنه سوف يأتي أخيرا «مسيح دجال»، فقد ظهر حتى الآن كثيرون من الدجالين المقاومين للمسيح. من هنا نتأكد أننا نعيش في الزمن الأخير."]]}, {"l": "1Jo 2:26", "n": "", "vs": [[26, "كتبت إليكم هذا مشيرا إلى الذين يحاولون أن يضللوكم."]]}, {"l": "1Jo 4:1", "n": "", "vs": [[1, "أيها الأحباء، لا تصدقوا كل روح، بل امتحنوا الأرواح لتعرفوا ما إذا كانت من عند الله أم لا، لأن عددا كبيرا من الأنبياء الدجالين قد انتشر في العالم."]]}, {"l": "2Jo 1:7", "n": "", "vs": [[7, "إن العالم أصبح يعج بالمضللين الذين لا يعترفون أن يسوع المسيح جاء إلى الأرض بجسم بشري. هذا هو روح المضل وضد المسيح!"]]}, {"l": "Rev 12:9", "n": "", "vs": [[9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."]]}, {"l": "Rev 13:8", "n": "", "vs": [[8, "فيسجد للوحش جميع سكان الأرض الذين لم تكتب أسماؤهم منذ تأسيس العالم في سجل الحياة للحمل الذي ذبح."]]}, {"l": "Rev 20:3", "n": "", "vs": [[3, "وطرحه في الهاوية وأغلقها عليه، وختمها، حتى يكف عن تضليل الأمم، إلى أن تنقضي الألف سنة. ولكن لابد من إطلاقه بعد ذلك لمدة قصيرة."]]}, {"l": "Rev 20:8", "n": "", "vs": [[8, "فيخرج ليضلل الأمم في زوايا الأرض الأربع، جوج وماجوج، ويجمعهم للقتال، وعددهم كثير جدا كرمل البحر!"]]}], "kwAr": "حتى لا يضللكم أحد", "noteAr": ""}, {"kw": "enticing", "raw": "1Co_2:4", "note": "", "refs": [{"l": "1Co 2:4", "n": "", "vs": [[4, "ولم يقم كلامي وتبشيري على الإقناع بكلام الحكمة، بل على ما يعلنه الروح والقدرة."]]}], "kwAr": "بكلام خداع", "noteAr": ""}], "arS": [["أقول", ["G3004"]], [" هذا حتى لا ", []], ["يضللكم", ["G3884"]], [" ", []], ["أحد", ["G5100"]], [" ", []], ["بكلام خداع", ["G4086"]], [".", []]]}, {"c": 2, "v": 5, "text": "فمع أني في الجسد غائب، إلا أني في الروح حاضر معكم، أفرح إذ أشاهد ترتيبكم وثباتكم في الإيمان بالمسيح.", "groups": [{"kw": "be", "raw": "Col_2:1; 1Co_5:3, 1Co_5:4; 1Th_2:17", "note": "", "refs": [{"l": "Col 2:1", "n": "", "vs": [[1, "فإني أريد أن تعلموا مقدار جهادي لأجلكم ولأجل الذين في مدينة لاودكية، ولأجل جميع الذين لا يعرفونني بالوجه،"]]}, {"l": "1Co 5:3", "n": "", "vs": [[3, "فإني، وأنا غائب عنكم بالجسد ولكن حاضر بينكم بالروح، قد حكمت على الفاعل كأني حاضر:"]]}, {"l": "1Co 5:4", "n": "", "vs": [[4, "باسم ربنا يسوع المسيح، إذ تجتمعون معا، وروحي معكم، فبسلطة ربنا يسوع المسيح،"]]}, {"l": "1Th 2:17", "n": "", "vs": [[17, "أما نحن، أيها الإخوة، فإذ قد سلخنا عنكم لمدة قصيرة، بالوجه لا بالقلب، بذلنا جهدا أوفر جدا لرؤية وجوهكم ونحن في غاية الشوق إليكم."]]}], "kwAr": "في الجسد غائب", "noteAr": ""}, {"kw": "and beholding", "raw": "2Ch_29:35; 1Co_11:34, 1Co_14:40", "note": "", "refs": [{"l": "2Ch 29:35", "n": "", "vs": [[35, "وفضلا عن المحرقات الكثيرة فقد توافر شحم ذبائح السلام وسكائب خمر المحرقات. وهكذا عادت العبادة في الهيكل إلى سابق عهدها."]]}, {"l": "1Co 11:34", "n": "", "vs": [[34, "وإن كان أحد جائعا فليأكل في بيته، لكي لا يكون اجتماعكم للحكم عليكم. أما المسائل الأخرى، فعندما آتي أرتبها."]]}, {"l": "1Co 14:40", "n": "", "vs": [[40, "وإنما، ليتم كل شيء بلياقة وترتيب."]]}], "kwAr": "إذ أشاهد ترتيبكم", "noteAr": ""}, {"kw": "and the", "raw": "Rth_1:18; Psa_78:8, Psa_78:37; Act_2:42; 1Co_15:58, 1Co_16:13; 1Th_3:8; Heb_3:14; Heb_6:19; 1Pe_5:9; 2Pe_3:17, 2Pe_3:18", "note": "", "refs": [{"l": "Rut 1:18", "n": "", "vs": [[18, "فلما رأت أنها مصرة على الذهاب معها، كفت عن محاولة إقناعها بالرجوع."]]}, {"l": "Psa 78:8", "n": "", "vs": [[8, "ولا يكونون مثل آبائهم، جيلا عنيدا متمردا، جيلا لم يثبت قلبه ولا كانت روحه أمينة لله."]]}, {"l": "Psa 78:37", "n": "", "vs": [[37, "لم يكونوا مخلصين له، ولا كانوا أوفياء لعهده."]]}, {"l": "Act 2:42", "n": "", "vs": [[42, "وكان الجميع يداومون على تلقي تعليم الرسل، وعلى حياة الشركة، وكسر الخبز، والصلوات."]]}, {"l": "1Co 15:58", "n": "", "vs": [[58, "إذن، ياإخوتي الأحباء، كونوا راسخين غير متزحزحين، كثيري الاجتهاد في عمل الرب دائما، عالمين أن جهدكم في الرب ليس عبثا!"]]}, {"l": "1Co 16:13", "n": "", "vs": [[13, "كونوا متيقظين حذرين. اثبتوا في الإيمان. كونوا رجالا. كونوا أقوياء."]]}, {"l": "1Th 3:8", "n": "", "vs": [[8, "فقد طابت لنا الحياة مادمتم ثابتين في الرب!"]]}, {"l": "Heb 3:14", "n": "", "vs": [[14, "فإن تمسكنا دائما بالثقة التي انطلقنا بها في البداية، وأبقيناها ثابتة إلى النهاية، نكون مشاركين للمسيح."]]}, {"l": "Heb 6:19", "n": "", "vs": [[19, "هذا الرجاء هو لنا بمثابة مرساة أمينة ثابتة تشد نفوسنا إلى ما وراء الحجاب السماوي."]]}, {"l": "1Pe 5:9", "n": "", "vs": [[9, "فقاوموه، ثابتين في الإيمان. واذكروا أن إخوتكم المنتشرين في العالم يجتازون وسط هذه الآلام عينها."]]}, {"l": "2Pe 3:17", "n": "", "vs": [[17, "أما أنتم أيها الأحباء، فإذ قد تنبهتم إلى الخطر قبل حدوثه، احذروا أن تسقطوا عن ثباتكم بالانجراف وراء ضلال الأشرار."]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}], "kwAr": "وثباتكم في الإيمان", "noteAr": ""}], "arS": [["فمع أني في ", []], ["الجسد", ["G4561"]], [" ", []], ["غائب", ["G548"]], ["، إلا أني في ", []], ["الروح", ["G4151"]], [" حاضر معكم، ", []], ["أفرح", ["G5463"]], [" إذ ", []], ["أشاهد", ["G991"]], [" ", []], ["ترتيبكم", ["G5010"]], [" ", []], ["وثباتكم", ["G4733"]], [" في ", []], ["الإيمان", ["G4102"]], [" ", []], ["بالمسيح", ["G5547"]], [".", []]]}, {"c": 2, "v": 6, "text": "فمثلما قبلتم المسيح يسوع الرب، ففيه اسلكوا", "groups": [{"kw": "received", "raw": "Mat_10:40; Joh_1:12, Joh_1:13, Joh_13:20; 1Co_1:30; Heb_3:14; 1Jo_5:11, 1Jo_5:12, 1Jo_5:20; 2Jo_1:8, 2Jo_1:9; Jud_1:3", "note": "", "refs": [{"l": "Mat 10:40", "n": "", "vs": [[40, "من يقبلكم، يقبلني؛ ومن يقبلني، يقبل الذي أرسلني."]]}, {"l": "Joh 1:12", "n": "", "vs": [[12, "أما الذين قبلوه، أي الذين آمنوا باسمه، فقد منحهم الحق في أن يصيروا أولاد الله،"]]}, {"l": "Joh 1:13", "n": "", "vs": [[13, "وهم الذين ولدوا ليس من دم، ولا من رغبة جسد، ولا من رغبة بشر، بل من الله."]]}, {"l": "Joh 13:20", "n": "", "vs": [[20, "الحق الحق أقول لكم: من يقبل الذي أرسله، يقبلني؛ ومن يقبلني، يقبل الذي أرسلني»."]]}, {"l": "1Co 1:30", "n": "", "vs": [[30, "وبفضل الله صار لكم مقام في المسيح يسوع الذي جعل لنا حكمة من الله وبرا وقداسة وفداء،"]]}, {"l": "Heb 3:14", "n": "", "vs": [[14, "فإن تمسكنا دائما بالثقة التي انطلقنا بها في البداية، وأبقيناها ثابتة إلى النهاية، نكون مشاركين للمسيح."]]}, {"l": "1Jo 5:11", "n": "", "vs": [[11, "وهذه الشهادة هي أن الله أعطانا حياة أبدية، وأن هذه الحياة هي في ابنه."]]}, {"l": "1Jo 5:12", "n": "", "vs": [[12, "فمن كان له ابن الله كانت له الحياة. ومن لم يكن له ابن الله، لم تكن له الحياة!"]]}, {"l": "1Jo 5:20", "n": "", "vs": [[20, "وإننا نعلم أن ابن الله قد جاء إلى الأرض وأنار أذهاننا لنعرف الإله الحق. ونحن الآن نحيا فيه، لأننا في ابنه يسوع المسيح. هذا هو الإله الحق، والحياة الأبدية."]]}, {"l": "2Jo 1:8", "n": "", "vs": [[8, "فانتبهوا لأنفسكم، لكي لا يضيع الجهد الذي بذلناه في سبيلكم، بل لتنالوا أجركم كاملا."]]}, {"l": "2Jo 1:9", "n": "", "vs": [[9, "لأن من تعدى تعليم المسيح ولم يثبت فيه، فليس الله من نصيبه. أما من يثبت في هذا التعليم، فله الآب والابن معا."]]}, {"l": "Jud 1:3", "n": "", "vs": [[3, "أيها الأحباء، كنت قد نويت أن أكتب إليكم في موضوع الخلاص الذي نشترك فيه جميعا. ولكن، أراني الآن مضطرا لأن أكتب لأشجعكم على الجهاد في سبيل الإيمان الذي سلم مرة واحدة للقديسين."]]}], "kwAr": "فمثلما قبلتم المسيح يسوع", "noteAr": ""}, {"kw": "walk", "raw": "Col_3:17; Isa_2:5; Mic_4:2; Joh_14:6; 2Co_5:7; Gal_2:20; Eph_4:1, Eph_5:1, Eph_5:2; Phi_1:27; 1Th_4:1; 1Jo_2:6", "note": "", "refs": [{"l": "Col 3:17", "n": "", "vs": [[17, "ومهما كان ما تعملونه، بالقول أو بالفعل، فليجر كل شيء باسم الرب يسوع، رافعين به الشكر لله الآب."]]}, {"l": "Isa 2:5", "n": "", "vs": [[5, "يابيت يعقوب، هيا لنسلك في نور الرب."]]}, {"l": "Mic 4:2", "n": "", "vs": [[2, "وتقبل إليه أمم كثيرة قائلة: «تعالوا لنصعد إلى جبل الرب، إلى هيكل يعقوب ليعلمنا طرقه فنسلك في سبله، لأن من صهيون تخرج الشريعة ومن أورشليم تذاع كلمة الرب»."]]}, {"l": "Joh 14:6", "n": "", "vs": [[6, "فأجابه يسوع: «أنا هو الطريق والحق والحياة. لا يأتي أحد إلى الآب إلا بي."]]}, {"l": "2Co 5:7", "n": "", "vs": [[7, "لأننا نسلك بالإيمان لا بالعيان."]]}, {"l": "Gal 2:20", "n": "", "vs": [[20, "مع المسيح صلبت، وفيما بعد لا أحيا أنا بل المسيح يحيا في. أما الحياة التي أحياها الآن في الجسد، فإنما أحياها بالإيمان في ابن الله، الذي أحبني وبذل نفسه عني."]]}, {"l": "Eph 4:1", "n": "", "vs": [[1, "... إذن، أنا السجين في الرب، أناشدكم أن تسلكوا سلوكا يليق بالدعوة التي إليها دعيتم،"]]}, {"l": "Eph 5:1", "n": "", "vs": [[1, "فاقتدوا إذن بالله كأولاد أحباء،"]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "Phi 1:27", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"]]}, {"l": "1Th 4:1", "n": "", "vs": [[1, "وبعد، أيها الإخوة، فمثلما تلقيتم منا كيف يجب أن تسلكوا سلوكا يرضي الله ، وكما أنتم فاعلون، نرجو منكم ونحرضكم في الرب يسوع أن تضاعفوا تقدمكم في ذلك أكثر فأكثر."]]}, {"l": "1Jo 2:6", "n": "", "vs": [[6, "كل من يعترف أنه ثابت في المسيح، يلتزم أن يسلك كما سلك المسيح!"]]}], "kwAr": "ففيه اسلكوا", "noteAr": ""}], "arS": [["فمثلما ", []], ["قبلتم", ["G3880"]], [" ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["الرب", ["G2962"]], ["، ففيه ", []], ["اسلكوا", ["G4043"]]]}, {"c": 2, "v": 7, "text": "وأنتم متأصلون ومبنيون فيه وراسخون في الإيمان الموافق لما تعلمتم وفائضون بالشكر.", "groups": [{"kw": "Rooted", "raw": "Col_1:23; Psa_1:3, Psa_92:13; Isa_61:3; Jer_17:8; Eze_17:23, Eze_17:24; Rom_11:17, Rom_11:18; Eph_2:21, Eph_2:22, Eph_3:17; Jud_1:12", "note": "", "refs": [{"l": "Col 1:23", "n": "", "vs": [[23, "على أن تثبتوا فعلا في الإيمان، مؤسسين وراسخين وغير متحولين عن رجاء الإنجيل الذي سمعتموه والذي بشر به للخليقة كلها تحت السماء، وله صرت أنا بولس خادما."]]}, {"l": "Psa 1:3", "n": "", "vs": [[3, "فيكون كشجرة مغروسة عند مجاري المياه، تعطي ثمرها في حينه، وورقها لا يذبل، وكل ما يصنعه يفلح."]]}, {"l": "Psa 92:13", "n": "", "vs": [[13, "لأن المغروسين في بيت الرب يزدهرون في ديار بيت إلهنا"]]}, {"l": "Isa 61:3", "n": "", "vs": [[3, "لأمنح نائحي صهيون تاج جمال بدل الرماد، ودهن السرور بدل النوح، ورداء تسبيح بدل الروح اليائسة، فيدعون أشجار البر وغرس الرب لكي يتمجد."]]}, {"l": "Jer 17:8", "n": "", "vs": [[8, "فيكون كشجرة مغروسة عند الميا ه، تمد جذورها إلى الجدول، ولا تخشى اشتداد الحر المقبل، إذ تظل أوراقها خضراء، ولا يفزعها القحط لأنها لا تكف عن الإثمار."]]}, {"l": "Eze 17:23", "n": "", "vs": [[23, "في جبل إسرائيل المرتفع فينبت أغصانا ويحمل ثمارا ويصبح أرزا وارفا يأوي تحت ظل أغصانه كل طائر."]]}, {"l": "Eze 17:24", "n": "", "vs": [[24, "فتدرك جميع أشجار الصحراء (أي جميع الأمم) أني أنا الرب، أذللت الأشجار المتعالية، وعظمت الأشجار الدنية. يبست الشجر النضر، وأنضرت الشجر المتيبس، أنا الرب قلت وأنجزت»."]]}, {"l": "Rom 11:17", "n": "", "vs": [[17, "فإذا كانت بعض أغصان الزيتونة قد قطعت، ثم طعمت فيها وأنت من زيتونة برية، فصرت بذلك شريكا في أصل الزيتونة وغذائها،"]]}, {"l": "Rom 11:18", "n": "", "vs": [[18, "فلا تفتخر على باقي الأغصان. وإن كنت تفتخر، فلست أنت تحمل الأصل، بل هو يحملك."]]}, {"l": "Eph 2:21", "n": "", "vs": [[21, "الذي فيه يتناسق البناء كله فيرتفع ليصير هيكلا مقدسا في الرب."]]}, {"l": "Eph 2:22", "n": "", "vs": [[22, "وفيه أنتم أيضا قد بنيتم معا فصرتم مسكنا لله بوجود الروح."]]}, {"l": "Eph 3:17", "n": "", "vs": [[17, "ليسكن المسيح في قلوبكم بالإيمان؛ حتى إذا تأصلتم وتأسستم في المحبة،"]]}, {"l": "Jud 1:12", "n": "", "vs": [[12, "إنهم يشتركون معكم في ولائم المحبة دون خجل، ولكنهم كصخور تعيقكم. لا هم لهم سوى تعليف أنفسهم! إنهم يشبهون غيوما بلا مطر تسوقها الرياح، وأشجارا خريفية بلا ثمر، يقتلعها أصحابها، فتكون قد ماتت مرتين."]]}], "kwAr": "متأصلون", "noteAr": ""}, {"kw": "built", "raw": "Mat_7:24, Mat_7:25; Luk_6:48; Joh_15:4, Joh_15:5; 1Co_3:9-15; Eph_2:20-22; 1Pe_2:4-6; Jud_1:20", "note": "", "refs": [{"l": "Mat 7:24", "n": "", "vs": [[24, "فأي من يسمع أقوالي هذه ويعمل بها، أشبهه برجل حكيم بنى بيته على الصخر،"]]}, {"l": "Mat 7:25", "n": "", "vs": [[25, "فنزلت الأمطار، وجرت السيول، وهبت العواصف، فضربت ذلك البيت، فلم يسقط لأنه مؤسس على الصخر."]]}, {"l": "Luk 6:48", "n": "", "vs": [[48, "إنه يشبه إنسانا يبني بيتا، فحفر وعمق ووضع الأساس على الصخر. ثم هطل مطر غزير وصدم السيل ذلك البيت، فلم يقدر أن يزعزعه، لأنه كان مؤسسا على الصخر."]]}, {"l": "Joh 15:4", "n": "", "vs": [[4, "فاثبتوا في وأنا فيكم. كما أن الغصن لا يقدر أن ينتج ثمرا إلا إذا ثبت في الكرمة؛ فكذلك أنتم، إلا إذا ثبتم في."]]}, {"l": "Joh 15:5", "n": "", "vs": [[5, "أنا الكرمة وأنتم الأغصان. من يثبت في وأنا فيه، فذاك ينتج ثمرا كثيرا. فإنكم بمعزل عني لا تقدرون أن تفعلوا شيئا."]]}, {"l": "1Co 3:9-15", "n": "", "vs": [[9, "فإننا نحن جميعا عاملون معا عند الله، وأنتم حقل الله وبناء الله."], [10, "وبحسب نعمة الله الموهوبة لي، وضعت الأساس كما يفعل البناء الماهر، وغيري يبني عليه. ولكن، لينتبه كل واحد كيف يبني عليه."], [11, "فليس ممكنا أن يضع أحد أساسا آخر بالإضافة إلى الأساس الموضوع، وهو يسوع المسيح."], [12, "فإن بنى أحد على هذا الأساس ذهبا وفضة وحجارة كريمة، أو خشبا وعشبا وقشا،"], [13, "فعمل كل واحد سينكشف علنا إذ يظهره ذلك اليوم الذي سيعلن في نار، وسوف تمتحن النار قيمة عمل كل واحد."], [14, "فمن بقي عمله الذي بناه على الأساس، ينال أجرا."], [15, "ومن احترق عمله، يخسر، إلا أنه هو سيخلص؛ ولكن كمن يمر في النار."]]}, {"l": "Eph 2:20-22", "n": "", "vs": [[20, "وقد بنيتم على أساس الرسل والأنبياء، والمسيح يسوع نفسه هو حجر الزاوية الأساس،"], [21, "الذي فيه يتناسق البناء كله فيرتفع ليصير هيكلا مقدسا في الرب."], [22, "وفيه أنتم أيضا قد بنيتم معا فصرتم مسكنا لله بوجود الروح."]]}, {"l": "1Pe 2:4-6", "n": "", "vs": [[4, "فأنتم قد أتيتم إليه، باعتباره الحجر الحي الذي رفضه الناس، واختاره الله ، وهو ثمين في نظره."], [5, "إذن اتحدوا به كحجارة حية، مبنيين بيتا روحيا، تكونون فيه كهنة مقدسين تقدمون لله ذبائح روحية مقبولة لديه بفضل يسوع المسيح."], [6, "وكما يقول الكتاب: «ها أنا أضع في صهيون حجر زاوية، مختارا وثمينا. والذي يؤمن به، لا يخيب!»"]]}, {"l": "Jud 1:20", "n": "", "vs": [[20, "وأما أنتم أيها الأحباء، فابنوا أنفسكم على إيمانكم الأقدس، وصلوا دائما في الروح القدس."]]}], "kwAr": "ومبنيون فيه", "noteAr": ""}, {"kw": "stablished", "raw": "Col_1:23; Rom_16:25; 1Co_15:58; 2Co_1:21; 2Th_2:17; 1Pe_5:10; 2Pe_3:17, 2Pe_3:18; Jud_1:24", "note": "", "refs": [{"l": "Col 1:23", "n": "", "vs": [[23, "على أن تثبتوا فعلا في الإيمان، مؤسسين وراسخين وغير متحولين عن رجاء الإنجيل الذي سمعتموه والذي بشر به للخليقة كلها تحت السماء، وله صرت أنا بولس خادما."]]}, {"l": "Rom 16:25", "n": "", "vs": [[25, "والمجد للقادر أن يثبتكم، وفقا لإنجيلي وللبشارة بيسوع المسيح، ووفقا لإعلان ما كان سرا ظل مكتوما مدى الأزمنة الأزلية،"]]}, {"l": "1Co 15:58", "n": "", "vs": [[58, "إذن، ياإخوتي الأحباء، كونوا راسخين غير متزحزحين، كثيري الاجتهاد في عمل الرب دائما، عالمين أن جهدكم في الرب ليس عبثا!"]]}, {"l": "2Co 1:21", "n": "", "vs": [[21, "ولكن الذي يرسخنا وإياكم في المسيح، والذي قد مسحنا، إنما هو الله ،"]]}, {"l": "2Th 2:17", "n": "", "vs": [[17, "يشجع قلوبكم ويرسخكم في كل عمل صالح وقول حسن!"]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}, {"l": "2Pe 3:17", "n": "", "vs": [[17, "أما أنتم أيها الأحباء، فإذ قد تنبهتم إلى الخطر قبل حدوثه، احذروا أن تسقطوا عن ثباتكم بالانجراف وراء ضلال الأشرار."]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}, {"l": "Jud 1:24", "n": "", "vs": [[24, "وللقادر أن يحرسكم من السقوط حتى يوصلكم إلى المثول أمامه في المجد مبتهجين ولا عيب فيكم …"]]}], "kwAr": "وراسخون في الإيمان", "noteAr": ""}, {"kw": "with", "raw": "Col_1:12, Col_1:13, Col_3:17; Eph_5:20; 1Th_5:18; Heb_13:15", "note": "", "refs": [{"l": "Col 1:12", "n": "", "vs": [[12, "رافعين الشكر بفرح للآب الذي جعلكم أهلا للاشتراك في ميراث القديسين في (ملكوت) النور،"]]}, {"l": "Col 1:13", "n": "", "vs": [[13, "هو الذي أنقذنا من سلطة الظلام ونقلنا إلى ملكوت ابن محبته"]]}, {"l": "Col 3:17", "n": "", "vs": [[17, "ومهما كان ما تعملونه، بالقول أو بالفعل، فليجر كل شيء باسم الرب يسوع، رافعين به الشكر لله الآب."]]}, {"l": "Eph 5:20", "n": "", "vs": [[20, "رافعين الشكر كل حين وعلى كل شيء لله والآب، باسم ربنا يسوع المسيح؛"]]}, {"l": "1Th 5:18", "n": "", "vs": [[18, "ارفعوا الشكر في كل حال: فهذه هي مشيئة الله لكم في المسيح يسوع."]]}, {"l": "Heb 13:15", "n": "", "vs": [[15, "فبالمسيح، رئيس كهنتنا، لنقرب لله دائما ذبيحة الحمد والتسبيح، أي الثمار التي تنتجها أفواهنا المعترفة باسمه."]]}], "kwAr": "وفائضون بالشكر", "noteAr": ""}], "arS": [["وأنتم ", []], ["متأصلون", ["G4492"]], [" ", []], ["ومبنيون", ["G2026"]], [" فيه ", []], ["وراسخون", ["G950"]], [" في ", []], ["الإيمان", ["G4102"]], [" الموافق لما ", []], ["تعلمتم", ["G1321"]], [" ", []], ["وفائضون", ["G4052"]], [" ", []], ["بالشكر", ["G2169"]], [".", []]]}, {"c": 2, "v": 8, "text": "احذروا أن يوقعكم أحد فريسة بالفلسفة والغرور الباطل، عملا بتقاليد الناس ومباديء العالم؛ مما لا يوافق المسيح.", "groups": [{"kw": "Beware", "raw": "Deu_6:12; Mat_7:15, Mat_10:17, Mat_16:6; Phi_3:2; 2Pe_3:17", "note": "", "refs": [{"l": "Deu 6:12", "n": "", "vs": [[12, "فإياكم أن تنسوا الرب إلهكم الذي أطلقكم من عبودية ديار مصر."]]}, {"l": "Mat 7:15", "n": "", "vs": [[15, "احذروا الأنبياء الدجالين الذين يأتون إليكم لابسين ثياب الحملان، ولكنهم من الداخل ذئاب خاطفة!"]]}, {"l": "Mat 10:17", "n": "", "vs": [[17, "احذروا من الناس! فإنهم سيسلمونكم إلى المحاكم، ويجلدونكم في مجامعهم؛"]]}, {"l": "Mat 16:6", "n": "", "vs": [[6, "وقال لهم يسوع: «انتبهوا! خذوا حذركم من خمير الفريسيين والصدوقيين!»"]]}, {"l": "Phi 3:2", "n": "", "vs": [[2, "خذوا حذركم من «الكلاب»، من العمال الأشرار، من الذين يبترون الجسد."]]}, {"l": "2Pe 3:17", "n": "", "vs": [[17, "أما أنتم أيها الأحباء، فإذ قد تنبهتم إلى الخطر قبل حدوثه، احذروا أن تسقطوا عن ثباتكم بالانجراف وراء ضلال الأشرار."]]}], "kwAr": "احذروا", "noteAr": ""}, {"kw": "spoil", "raw": "Col_2:18; Son_2:15; Jer_29:8; Rom_16:17; Eph_5:6; Heb_13:9; 2Jo_1:8", "note": "", "refs": [{"l": "Col 2:18", "n": "", "vs": [[18, "لا يحرمكم أحد من جائزتكم، بحملكم على ما يرغب فيه من إظهار التواضع والتعبد للملائكة، داخلا في رؤى يتوهمها، وقد نفخه باطلا ذهنه الجسدي،"]]}, {"l": "Son 2:15", "n": "", "vs": [[15, "اقتنصوا لنا الثعالب الصغار التي تتلف الكروم، فإن كرومنا قد أزهر ت."]]}, {"l": "Jer 29:8", "n": "", "vs": [[8, "لأن هذا ما يعلنه الرب القدير إله إسرائيل: لا يخدعنكم أنبياؤكم الكذبة المقيمون في وسطكم، والعرافون. لا تستمعوا إلى أحلامهم التي توهمكم بالأمل،"]]}, {"l": "Rom 16:17", "n": "", "vs": [[17, "ولكن، أتوسل إليكم، أيها الإخوة، أن تنتبهوا إلى مثيري الانقسامات والعثرات، خلافا للتعليم الذي تعلمتم، وأن تبتعدوا عنهم."]]}, {"l": "Eph 5:6", "n": "", "vs": [[6, "لا يخدعكم أحد بكلام باطل! فبسبب هذه الأمور يحل غضب الله على أبناء العصيان."]]}, {"l": "Heb 13:9", "n": "", "vs": [[9, "فلا تنخدعوا وتتبعوا تلك التعاليم الغريبة المتنوعة ... فمن الأفضل أن يثبت القلب بالنعمة لا بنظم الأطعمة التي لم تنفع المتقيدين بها."]]}, {"l": "2Jo 1:8", "n": "", "vs": [[8, "فانتبهوا لأنفسكم، لكي لا يضيع الجهد الذي بذلناه في سبيلكم، بل لتنالوا أجركم كاملا."]]}], "kwAr": "أن يوقعكم أحد فريسة", "noteAr": ""}, {"kw": "philosophy", "raw": "Act_17:18, Act_17:32; Rom_1:21, Rom_1:22; 1Co_1:19-23, 1Co_3:18, 1Co_3:19, 1Co_15:35, 1Co_15:36; 2Co_10:5 *Gr: 1Ti_6:20; 2Ti_2:17, 2Ti_2:18, 2Ti_3:13", "note": "", "refs": [{"l": "Act 17:18", "n": "", "vs": [[18, "وجرت مناقشة بينه وبين بعض الفلاسفة الأبيقوريين والرواقيين. ولما وجدوا أنه يبشر بيسوع والقيامة من الموت قال بعضهم: «ماذا يعني هذا المدعي الأحمق بكلامه؟» وقال آخرون: «يبدو أنه ينادي بآلهة غريبة»."]]}, {"l": "Act 17:32", "n": "", "vs": [[32, "وما إن سمع الحاضرون بالقيامة من بين الأموات حتى بدأ بعضهم يستهزئون. ولكن آخرين قالوا لبولس: «نود أن تحدثنا في هذا الموضوع ثانية»."]]}, {"l": "Rom 1:21", "n": "", "vs": [[21, "فمع أنهم عرفوا الله ، لم يمجدوه باعتباره الله ، ولا شكروه، بل انحطوا بتفكيرهم إلى الحماقة وصار قلبهم لغباوته مظلما."]]}, {"l": "Rom 1:22", "n": "", "vs": [[22, "وفيما يدعون أنهم حكماء، صاروا جهالا،"]]}, {"l": "1Co 1:19-23", "n": "", "vs": [[19, "فإنه قد كتب: «سأبيد حكمة الحكماء وأزيل فهم الفهماء!»"], [20, "إذن، أين الحكيم؟ وأين الكاتب؟ وأين المجادل في هذا الزمان؟ ألم يقلب الله حكمة هذا العالم جهالة؟"], [21, "فبما أن العالم، في حكمة الله، لم يعرف الله عن طريق الحكمة، فقد سر الله أن يخلص بجهالة البشارة الذين يؤمنون."], [22, "إذ إن اليهود يطلبون آيات، واليونانيين يبحثون عن الحكمة."], [23, "ولكننا نحن نبشر بالمسيح مصلوبا، مما يشكل عائقا عند اليهود وجهالة عند الأمم؛"]]}, {"l": "1Co 3:18", "n": "", "vs": [[18, "حذار أن يخدع أحد منكم نفسه! إن ظن أحد بينكم نفسه حكيما في هذا العالم، فليصر جاهلا ليصير حكيما حقا."]]}, {"l": "1Co 3:19", "n": "", "vs": [[19, "فإن حكمة هذا العالم هي جهالة في نظر الله. فإنه قد كتب: «إنه يمسك الحكماء بمكرهم»"]]}, {"l": "1Co 15:35", "n": "", "vs": [[35, "ولكن أحدا قد يقول: كيف يقام الأموات؟ وبأي جسم يعودون؟»"]]}, {"l": "1Co 15:36", "n": "", "vs": [[36, "ياغافل! إن ما تزرعه لا يحيا إلا بعد أن يموت."]]}, {"l": "2Co 10:5", "n": "*Gr:", "vs": [[5, "وكل ما يعلو مرتفعا لمقاومة معرفة الله، ونأسر كل فكر إلى طاعة المسيح."]]}, {"l": "1Ti 6:20", "n": "", "vs": [[20, "ياتيموثاوس، حافظ على الأمانة المودعة لديك. تجنب الكلام الدنس الباطل، ومناقضات ما يسمى زورا «معرفة»."]]}, {"l": "2Ti 2:17", "n": "", "vs": [[17, "وكلامهم ينهش كالآكلة، ومنهم هيمنايوس وفيليتوس،"]]}, {"l": "2Ti 2:18", "n": "", "vs": [[18, "اللذان زاغا عن الحق؛ إذ يزعمان أن القيامة قد حدثت، ويهدمان إيمان بعض الناس."]]}, {"l": "2Ti 3:13", "n": "", "vs": [[13, "أما الناس الأشرار والدجالون المحتالون، فيتقدمون في الشر، مضللين الآخرين وهم أنفسهم مضللون!"]]}], "kwAr": "بالفلسفة", "noteAr": ""}, {"kw": "after the tradition", "raw": "Col_2:22; Mat_15:2-9; Mar_7:3-13; Gal_1:14; 1Pe_1:18", "note": "", "refs": [{"l": "Col 2:22", "n": "", "vs": [[22, "وهذه أشياء تستهلك وتزول. فتلك الفرائض هي وصايا البشر وتعاليمهم."]]}, {"l": "Mat 15:2-9", "n": "", "vs": [[2, "«لماذا يخالف تلاميذك تقاليد الشيوخ، فلا يغسلون أيديهم قبل أن يأكلوا؟»"], [3, "فأجابهم «ولماذا تخالفون أنتم وصية الله من أجل المحافظة على تقاليدكم؟"], [4, "فقد أوصى الله قائلا: أكرم أباك وأمك. ومن أهان أباه أو أمه، فليكن الموت عقابا له."], [5, "ولكنكم أنتم تقولون: من قال لأبيه أو أمه: إن ما أعولك به قد قدمته قربانا للهيكل،"], [6, "فهو في حل من إكرام أبيه وأمه. وأنتم، بهذا، تلغون ما أوصى به الله ، محافظة على تقاليدكم."], [7, "أيها المراؤون! أحسن إشعياء إذ تنبأ عنكم فقال:"], [8, "هذا الشعب يكرمني بشفتيه، أما قلبه فبعيد عني جدا!"], [9, "إنما باطلا يعبدونني وهم يعلمون تعاليم ليست إلا وصايا الناس.»"]]}, {"l": "Mar 7:3-13", "n": "", "vs": [[3, "فقد كان الفريسيون، واليهود عامة، لا يأكلون ما لم يغسلوا أيديهم مرارا، متمسكين بتقليد الشيوخ."], [4, "وإذا عادوا من السوق، لا يأكلون ما لم يغتسلوا. وهناك طقوس أخرى كثيرة تسلموها ليتمسكوا بها، كغسل الكؤوس والأباريق وأوعية النحاس."], [5, "عندئذ سأله الفريسيون والكتبة: «لماذا لا يسلك تلاميذك وفقا لتقليد الشيوخ، بل يتناولون الطعام بأيد نجسة؟»"], [6, "فرد عليهم قائلا: «أحسن إشعياء إذ تنبأ عنكم أيها المراؤون، كما جاء في الكتاب: هذا الشعب يكرمني بشفتيه، وأما قلبه فبعيد عني جدا."], [7, "إنما باطلا يعبدونني وهم يعلمون تعاليم ليست إلا وصايا الناس !"], [8, "فقد أهملتم وصية الله وتمسكتم بتقليد الناس!»"], [9, "وقال لهم: «حقا أنكم رفضتم وصية الله لتحافظوا على تقليدكم أنتم!"], [10, "فإن موسى قال: أكرم أباك وأمك! وأيضا: من أهان أباه أو أمه، فليكن الموت عقابا له!"], [11, "ولكنكم أنتم تقولون: إذا قال أحد لأبيه أو أمه: إن ما كنت أعولك به قد جعلته قربانا، أي تقدمة (للهيكل)،"], [12, "فهو في حل من إعانة أبيه أو أمه!"], [13, "وهكذا تبطلون كلمة الله بتعليمكم التقليدي الذي تتناقلونه. وهناك أمور كثيرة مثل هذه تفعلونها! »"]]}, {"l": "Gal 1:14", "n": "", "vs": [[14, "وكيف كنت متفوقا في الديانة اليهودية على كثيرين من أبناء جيلي في أمتي لكوني غيورا أكثر منهم جدا على تقاليد آبائي."]]}, {"l": "1Pe 1:18", "n": "", "vs": [[18, "واعلموا أنه قد دفع الفدية ليحرركم من سيرة حياتكم الباطلة التي أخذتموها بالتقليد عن آبائكم. وهذه الفدية لم تكن شيئا فانيا كالفضة أو الذهب،"]]}], "kwAr": "بتقاليد الناس", "noteAr": ""}, {"kw": "the rudiments", "raw": "or, the elements, Col_2:20; Gal_4:3, Gal_4:9; Eph_2:2", "note": "or, the elements, Col_2:20; Gal_4:3, Gal_4:9; Eph_2:2", "refs": [{"l": "Col 2:20", "n": "", "vs": [[20, "فمادمتم قد متم مع المسيح بالنسبة لمباديء العالم، فلماذا، كما لو كنتم عائشين في العالم، تخضعون أنفسكم لفرائض مثل هذه:"]]}, {"l": "Gal 4:3", "n": "", "vs": [[3, "وهذه حالنا نحن أيضا: فإذ كنا قاصرين، كنا في حالة العبودية لمبادىء العالم."]]}, {"l": "Gal 4:9", "n": "", "vs": [[9, "أما الآن وقد عرفتم الله ، بل بالأحرى عرفكم الله ، فكيف ترتدون أيضا إلى تلك المباديء العاجزة الفقيرة التي ترغبون في الرجوع إلى العبودية لها من جديد؟"]]}, {"l": "Eph 2:2", "n": "", "vs": [[2, "التي كنتم تسلكون فيها حسب مسرى هذا العالم، تابعين رئيس قوات الهواء، ذلك الروح العامل الآن في أبناء العصيان،"]]}], "kwAr": "ومباديء العالم", "noteAr": "أو: الأركان (المبادئ الأولى)."}, {"kw": "after Christ", "raw": "Eph_4:20", "note": "", "refs": [{"l": "Eph 4:20", "n": "", "vs": [[20, "أما أنتم، فلم تتعلموا المسيح هكذا،"]]}], "kwAr": "مما لا يوافق المسيح", "noteAr": ""}], "arS": [["احذروا", ["G991"]], [" أن ", []], ["يوقعكم", ["G4812"]], [" ", []], ["أحد", ["G5100"]], [" ", []], ["فريسة", ["G4812"]], [" ", []], ["بالفلسفة", ["G5385"]], [" ", []], ["والغرور", ["G539"]], [" ", []], ["الباطل", ["G2756"]], ["، عملا ", []], ["بتقاليد", ["G3862"]], [" ", []], ["الناس", ["G444"]], [" ", []], ["ومباديء", ["G4747"]], [" ", []], ["العالم", ["G2889"]], ["؛ مما لا يوافق ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 2, "v": 9, "text": "فإنه فيه، جسديا، يحل الله بكل ملئه،", "groups": [{"kw": "in", "raw": "Col_2:2, Col_2:3, Col_1:19; Isa_7:14; Mat_1:23; Joh_10:30,Joh_10:38, Joh_14:9, Joh_14:10,Joh_14:20, Joh_17:21; 2Co_5:19; 1Ti_3:16; Tit_2:13; 1Jo_5:7, 1Jo_5:20", "note": "", "refs": [{"l": "Col 2:2", "n": "", "vs": [[2, "بغرض أن تتشجع قلوبهم وتكون كلها متحدة في المحبة، لبلوغ الإدراك التام بكل غناه، لمعرفة سر الله، أي المسيح،"]]}, {"l": "Col 2:3", "n": "", "vs": [[3, "المخزونة فيه كنوز الحكمة والمعرفة كلها."]]}, {"l": "Col 1:19", "n": "", "vs": [[19, "فإنه فيه سر الله أن يحل بكل ملئه،"]]}, {"l": "Isa 7:14", "n": "", "vs": [[14, "ولكن السيد نفسه يعطيكم آية: ها العذراء تحبل وتلد ابنا، وتدعو اسمه عمانوئيل."]]}, {"l": "Mat 1:23", "n": "", "vs": [[23, "«ها إن العذراء تحبل، وتلد ابنا، ويدعى عمانوئيل!» أي «الله معنا»."]]}, {"l": "Joh 10:30", "n": "", "vs": [[30, "أنا والآب واحد!»"]]}, {"l": "Joh 10:38", "n": "", "vs": [[38, "أما إن كنت أفعل ذلك، فصدقوا تلك الأعمال، إن كنتم لا تصدقونني أنا. عندئذ تعرفون ويتأكد لكم أن الآب في وأنا فيه»."]]}, {"l": "Joh 14:9", "n": "", "vs": [[9, "فأجابه يسوع: «مضت هذه المدة الطويلة وأنا معكم ولم تعرفني يافيلبس؟ الذي رآني رأى الآب، فكيف تقول: أرنا الآب؟"]]}, {"l": "Joh 14:10", "n": "", "vs": [[10, "ألا تؤمن أني أنا في الآب، وأن الآب في؟ الكلام الذي أقوله لا أقوله من عندي، وإنما الآب الحال في هو يعمل أعماله هذه."]]}, {"l": "Joh 14:20", "n": "", "vs": [[20, "في ذلك اليوم تعلمون أني أنا في أبي، وأنتم في، وأنا فيكم."]]}, {"l": "Joh 17:21", "n": "", "vs": [[21, "ليكون الجميع واحدا؛ أيها الآب، كما أنك أنت في وأنا فيك، ليكونوا هم أيضا واحدا فينا، لكي يؤمن العالم أنك أنت أرسلتني."]]}, {"l": "2Co 5:19", "n": "", "vs": [[19, "ذلك أن الله كان في المسيح مصالحا العالم مع نفسه، غير حاسب عليهم خطاياهم، وقد وضع بين أيدينا رسالة هذه المصالحة."]]}, {"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "1Jo 5:7", "n": "", "vs": [[7, "فإن هنالك ثلاثة شهود غفي السماء، الآب والكلمة والروح القدس، وهؤلاء الثلاثة هم واحدف."]]}, {"l": "1Jo 5:20", "n": "", "vs": [[20, "وإننا نعلم أن ابن الله قد جاء إلى الأرض وأنار أذهاننا لنعرف الإله الحق. ونحن الآن نحيا فيه، لأننا في ابنه يسوع المسيح. هذا هو الإله الحق، والحياة الأبدية."]]}], "kwAr": "فإنه فيه", "noteAr": ""}, {"kw": "bodily", "raw": "Luk_3:22; Joh_1:14, Joh_2:21", "note": "", "refs": [{"l": "Luk 3:22", "n": "", "vs": [[22, "وهبط عليه الروح القدس متخذا هيئة جسمية مثل حمامة، وانطلق صوت من السماء يقول: «أنت ابني الحبيب بك سررت كل سرور! »"]]}, {"l": "Joh 1:14", "n": "", "vs": [[14, "والكلمة صار بشرا، وخيم بيننا، ونحن رأينا مجده، مجد ابن وحيد عند الآب، وهو ممتلىء بالنعمة والحق."]]}, {"l": "Joh 2:21", "n": "", "vs": [[21, "ولكنه كان يشير إلى هيكل جسده."]]}], "kwAr": "جسديا", "noteAr": ""}], "arS": [["فإنه فيه، ", []], ["جسديا", ["G4985"]], ["، ", []], ["يحل", ["G2730"]], [" ", []], ["الله", ["G2320"]], [" ", []], ["بكل", ["G3956"]], [" ", []], ["ملئه", ["G4138"]], ["،", []]]}, {"c": 2, "v": 10, "text": "وأنتم مكملون فيه. فهو رأس كل رئاسة وسلطة؛", "groups": [{"kw": "complete", "raw": "Col_3:11; Joh_1:16; 1Co_1:30,1Co_1:31; Gal_3:26-29; Heb_5:9", "note": "", "refs": [{"l": "Col 3:11", "n": "", "vs": [[11, "وفيه لا فرق بين يوناني ويهودي، أو مختون وغير مختون، أو متحضر ومتخلف، أو عبد وحر، بل المسيح هو الكل وفي الكل."]]}, {"l": "Joh 1:16", "n": "", "vs": [[16, "فمن امتلائه أخذنا جميعنا ونلنا نعمة على نعمة،"]]}, {"l": "1Co 1:30", "n": "", "vs": [[30, "وبفضل الله صار لكم مقام في المسيح يسوع الذي جعل لنا حكمة من الله وبرا وقداسة وفداء،"]]}, {"l": "1Co 1:31", "n": "", "vs": [[31, "حتى إن «من افتخر، فليفتخر بالرب»، على حد ما قد كتب."]]}, {"l": "Gal 3:26-29", "n": "", "vs": [[26, "فإنكم جميعا أبناء الله بالإيمان بالمسيح يسوع."], [27, "لأنكم، جميع الذين تعمدتم في المسيح، قد لبستم المسيح."], [28, "لا فرق بعد الآن بين يهودي ويوناني، أو عبد وحر، أو ذكر وأنثى، لأنكم جميعا واحد في المسيح يسوع."], [29, "فإذا كنتم للمسيح، فأنتم إذن نسل إبراهيم وحسب الوعد وارثون."]]}, {"l": "Heb 5:9", "n": "", "vs": [[9, "وبذلك، أصبح مؤهلا لمهمته، فصار لجميع الذين يطيعونه مصدرا للخلاص الأبدي."]]}], "kwAr": "وأنتم مكملون فيه", "noteAr": ""}, {"kw": "the head", "raw": "Col_1:16-18; Eph_1:20-23, Eph_4:15, Eph_4:16; Phi_2:9-11; 1Pe_3:22; Rev_5:9-13", "note": "", "refs": [{"l": "Col 1:16-18", "n": "", "vs": [[16, "إذ به خلقت جميع الأشياء: ما في السماوات وما على الأرض، ما يرى وما لا يرى، أعروشا كانت أم سيادات أم رئاسات أم سلطات. كل ما في الكون قد خلق به ولأجله."], [17, "هو كائن قبل كل شيء، وبه يدوم كل شيء."], [18, "وهو رأس الجسد، أي الكنيسة؛ هو البداءة وبكر القائمين من بين الأموات، ليكون له المقام الأول في كل شيء."]]}, {"l": "Eph 1:20-23", "n": "", "vs": [[20, "الذي عمله في المسيح، بإقامته له من بين الأموات. وقد أجلسه عن يمينه في الأماكن السماوية،"], [21, "أرفع جدا من كل رئاسة وسلطة وقوة وسيا دة، ومن كل اسم يسمى، لا في هذا العالم وحسب، بل في ذلك الآتي أيضا."], [22, "وأخضع كل شيء تحت قدميه، وإياه جعل فوق كل شيء رأسا للكنيسة"], [23, "التي هي جسده وكماله، هو الذي يكمل الكل في الكل."]]}, {"l": "Eph 4:15", "n": "", "vs": [[15, "بل نتمسك بالحق في المحبة، فننمو في كل شيء نحو من هو الرأس، أي المسيح."]]}, {"l": "Eph 4:16", "n": "", "vs": [[16, "فمنه يستمد الجسد كله تماسكه وترابطه بمساندة كل مفصل وفقا لمقدار العمل المخصص لكل جزء، لينشيء نموا يؤول إلى بنيان الجسد بنيانا ذاتيا في المحبة."]]}, {"l": "Phi 2:9-11", "n": "", "vs": [[9, "لذلك أيضا رفعه الله عاليا، وأعطاه الاسم الذي يفوق كل اسم،"], [10, "لكي تنحني سجودا لاسم يسوع كل ركبة، سواء في السماء أم على الأرض أم تحت الأرض،"], [11, "ولكي يعترف كل لسان بأن يسوع المسيح هو الرب، لمجد الله الآب."]]}, {"l": "1Pe 3:22", "n": "", "vs": [[22, "الذي انطلق إلى السماء، وهو الآن جالس عن يمين الله؛ وقد جعلت الملائكة والسلطات والقوات (الروحية) خاضعة له!"]]}, {"l": "Rev 5:9-13", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"], [10, "وجعلتهم مملكة لإلهنا وكهنة له، وسيملكون على الأرض»."], [11, "ثم نظرت، فسمعت ترتيل الملايين من الملائكة وهي تحيط بالعرش وبالكائنات الحية والشيوخ،"], [12, "وهم يهتفون بصوت عال: «مستحق هو الحمل المذبوح أن ينال القدرة والغنى والحكمة والقوة والإجلال والمجد والبركة»."], [13, "ثم سمعت كل خليقة في السماء وعلى الأرض، وتحت الأرض، وعلى البحر، هاتفة مع كل ما فيها: «البركة والإجلال والمجد والسلطة للجالس على العرش وللحمل، إلى أبد الآبدين»."]]}], "kwAr": "رأس كل رئاسة وسلطة", "noteAr": ""}], "arS": [["وأنتم ", []], ["مكملون", ["G4137"]], [" فيه. فهو ", []], ["رأس", ["G2776"]], [" ", []], ["كل", ["G3956"]], [" ", []], ["رئاسة", ["G746"]], [" ", []], ["وسلطة", ["G1849"]], ["؛", []]]}, {"c": 2, "v": 11, "text": "وفيه أيضا ختنتم أنتم ختانا لم تجره الأيدي، إذ نزع عنكم جسد الخطايا البشري وهذا هو ختان المسيح:", "groups": [{"kw": "whom", "raw": "Deu_10:16, Deu_30:6; Jer_4:4; Rom_2:29; Phi_3:3", "note": "", "refs": [{"l": "Deu 10:16", "n": "", "vs": [[16, "فطهروا قلوبكم الأثيمة، وأقلعوا عن عنادكم،"]]}, {"l": "Deu 30:6", "n": "", "vs": [[6, "ويطهر الرب إلهكم قلوبكم وقلوب نسلكم لتحبوا الرب إلهكم من كل قلوبكم ومن كل نفوسكم لتحيوا مطمئنين"]]}, {"l": "Jer 4:4", "n": "", "vs": [[4, "اختتنوا للرب، وأزيلوا قلف قلوبكم (أي طهروا عقولكم وقلوبكم وليس أجسادكم فقط) لئلا يتفجر غضبي كنار فتحرق وليس من يخمدها، من جراء أعمالكم الشريرة."]]}, {"l": "Rom 2:29", "n": "", "vs": [[29, "وإنما اليهودي هو من كان يهوديا في الباطن، والختان هو ما كان ختانا للقلب بالروح لا بالحرف. وهذا يأتيه المدح لا من الناس بل من الله!"]]}, {"l": "Phi 3:3", "n": "", "vs": [[3, "فإننا نحن أهل الختان الحق، لأننا إنما نعبد بروح الله ونفتخر في المسيح يسوع، ولا نعتمد على أمور الجسد،"]]}], "kwAr": "وفيه أيضا ختنتم", "noteAr": ""}, {"kw": "without", "raw": "Mar_14:58; Act_7:48, Act_17:24; 2Co_5:1; Eph_2:11; Heb_9:11, Heb_9:24", "note": "", "refs": [{"l": "Mar 14:58", "n": "", "vs": [[58, "«سمعناه يقول: سأهدم هذا الهيكل الذي صنعته الأيادي، وفي ثلاثة أيام أبني هيكلا آخر لم تصنعه الأيادي»."]]}, {"l": "Act 7:48", "n": "", "vs": [[48, "إلا أن العلي لا يسكن في هياكل تصنعها أيدي البشر، كما قال النبي:"]]}, {"l": "Act 17:24", "n": "", "vs": [[24, "إنه الله الذي خلق الكون وكل ما فيه، وهو الذي لا يسكن في معابد بنتها أيدي البشر، لأنه رب السماء والأرض،"]]}, {"l": "2Co 5:1", "n": "", "vs": [[1, "فإننا نعلم أنه متى تهدمت خيمتنا الأرضية التي نسكنها الآن، يكون لنا بناء من الله: بيت لم تصنعه أيدي البشر، أبدي في السماوات."]]}, {"l": "Eph 2:11", "n": "", "vs": [[11, "لذلك اذكروا، أنتم الأمم في الجسد سابقا، يامن تسمون أهل عدم الختان من قبل من يسمون أهل الختان الذي يجري في الجسد باليد،"]]}, {"l": "Heb 9:11", "n": "", "vs": [[11, "ذلك أن البركات السماوية قد تحققت في المسيح. فهو الآن كاهننا الأعلى الذي يؤدي مهمته في الخيمة الحقيقية، وهي أعظم وأكمل من الخيمة الأرضية. إنها في السماء. لم تصنعها يد بشرية، وليست من هذا العالم المادي."]]}, {"l": "Heb 9:24", "n": "", "vs": [[24, "فالمسيح، رئيس كهنتنا، لم يدخل إلى «قدس الأقداس» الأرضي، الذي صنعته يد بشرية وما هو إلا ظل للحقيقة، بل دخل إلى السماء عينها، حيث يقوم الآن بتمثيلنا في حضرة الله بالذات."]]}], "kwAr": "ختانا لم تجره الأيدي", "noteAr": ""}, {"kw": "in putting", "raw": "Col_3:8, Col_3:9; Rom_6:6; Eph_4:22", "note": "", "refs": [{"l": "Col 3:8", "n": "", "vs": [[8, "وأما الآن، فانزعوا عنكم، أنتم أيضا، هذه الخطايا كلها: الغضب، النقمة، الخبث، التجديف، الكلام القبيح الخارج من أفواهكم."]]}, {"l": "Col 3:9", "n": "", "vs": [[9, "لا يكذب أحدكم على الآخر، إذ قد نزعتم الإنسان العتيق وأعماله"]]}, {"l": "Rom 6:6", "n": "", "vs": [[6, "فنحن نعلم هذا: أن الإنسان العتيق فينا قد صلب معه لكي يبطل جسد الخطيئة فلا نبقى عبيدا للخطيئة فيما بعد."]]}, {"l": "Eph 4:22", "n": "", "vs": [[22, "وهو أن تخلعوا ما يتعلق بسيرتكم الماضية: الإنسان العتيق الذي يفسد نفسه بالشهوات الخداعة؛"]]}], "kwAr": "إذ نزع عنكم جسد الخطايا", "noteAr": ""}, {"kw": "by", "raw": "Luk_2:21; 2Co_5:17; Gal_2:20, Gal_4:4, Gal_4:5; Eph_2:10-18", "note": "", "refs": [{"l": "Luk 2:21", "n": "", "vs": [[21, "ولما تمت ثمانية أيام ليختن الطفل، سمي يسوع، كما كان قد سمي بلسان الملاك قبل أن يحبل به في البطن."]]}, {"l": "2Co 5:17", "n": "", "vs": [[17, "فإنه إذا كان أحد في المسيح، فهو خليقة جديدة: إن الأشياء القديمة قد زالت، وها كل شيء قد صار جديدا."]]}, {"l": "Gal 2:20", "n": "", "vs": [[20, "مع المسيح صلبت، وفيما بعد لا أحيا أنا بل المسيح يحيا في. أما الحياة التي أحياها الآن في الجسد، فإنما أحياها بالإيمان في ابن الله، الذي أحبني وبذل نفسه عني."]]}, {"l": "Gal 4:4", "n": "", "vs": [[4, "ولكن لما جاء تمام الزمان، أرسل الله ابنه، وقد ولد من امرأة وكان خاضعا للشريعة،"]]}, {"l": "Gal 4:5", "n": "", "vs": [[5, "ليحرر بالفداء أولئك الخاضعين للشريعة، فننال جميعا مقام أبناء الله."]]}, {"l": "Eph 2:10-18", "n": "", "vs": [[10, "فإننا نحن تحفة الله، وقد خلقنا في المسيح يسوع لأعمال صالحة أعدها سلفا لنسلك فيها."], [11, "لذلك اذكروا، أنتم الأمم في الجسد سابقا، يامن تسمون أهل عدم الختان من قبل من يسمون أهل الختان الذي يجري في الجسد باليد،"], [12, "أنكم كنتم في ذلك الحين بلا مسيح، أجانب عن جماعة إسرائيل، وغرباء عن العهود الموعودة، لا رجاء لكم، ومنكرين لله في العالم."], [13, "أما الآن، ففي المسيح يسوع، أنتم الذين كنتم من قبل بعيدين قد صرتم قريبين بدم المسيح."], [14, "فإنه هو سلامنا، ذاك الذي جعل الفريقين واحدا وهدم حائط الحاجز الفاصل بينهما،"], [15, "أي العداء: إذ أبطل بجسده شريعة الوصايا ذات الفرائض، لكي يكون من الفريقين إنسانا واحدا جديدا، إذ أحل السلام بينهما،"], [16, "ولكي يصالحهما معا في جسد واحد مع الله بالصليب الذي به قتل العداء."], [17, "ثم جاء وبشركم بالسلام أنتم البعيدين، (كما بشر بالسلام) أولئك القريبين."], [18, "فبه لنا كلينا اقتراب إلى الآب بروح واحد."]]}], "kwAr": "ختان المسيح", "noteAr": ""}], "arS": [["وفيه أيضا ", []], ["ختنتم", ["G4059"]], [" أنتم ", []], ["ختانا", ["G4061"]], [" ", []], ["لم تجره الأيدي", ["G886"]], ["، إذ ", []], ["نزع", ["G555"]], [" عنكم ", []], ["جسد", ["G4983"]], [" ", []], ["الخطايا", ["G266"]], [" ", []], ["البشري", ["G4561"]], [" وهذا هو ", []], ["ختان", ["G4061"]], [" ", []], ["المسيح", ["G5547"]], [":", []]]}, {"c": 2, "v": 12, "text": "فقد دفنتم معه في المعمودية، وفيها أيضا أقمتم معه، عن طريق إيمانكم بقدرة الله الذي أقامه من بين الأموات.", "groups": [{"kw": "Buried", "raw": "Rom_6:4, Rom_6:5", "note": "", "refs": [{"l": "Rom 6:4", "n": "", "vs": [[4, "وبسبب ذلك دفنا معه بالمعمودية للموت، حتى كما أقيم المسيح من الأموات بمجد الآب، كذلك نسلك نحن أيضا في حياة جديدة."]]}, {"l": "Rom 6:5", "n": "", "vs": [[5, "فما دمنا قد اتحدنا به في ما يشبه موته، فإننا سنتحد به أيضا في قيامته."]]}], "kwAr": "دفنتم معه", "noteAr": ""}, {"kw": "baptism", "raw": "Rom_6:3; 1Co_12:13; Gal_3:27; Eph_4:5; Tit_3:5, Tit_3:6; Heb_6:2; 1Pe_3:21", "note": "", "refs": [{"l": "Rom 6:3", "n": "", "vs": [[3, "أم يخفى عليكم أننا جميعا، نحن الذين تعمدنا اتحادا بالمسيح يسوع، قد تعمدنا اتحادا بموته؟"]]}, {"l": "1Co 12:13", "n": "", "vs": [[13, "فإننا، بالروح الواحد، قد تعمدنا جميعا لنصير جسدا واحدا، سواء كنا يهودا أم يونانيين، عبيدا أم أحرارا، وقد سقينا جميعا الروح الواحد."]]}, {"l": "Gal 3:27", "n": "", "vs": [[27, "لأنكم، جميع الذين تعمدتم في المسيح، قد لبستم المسيح."]]}, {"l": "Eph 4:5", "n": "", "vs": [[5, "ولكم رب واحد، وإيمان واحد، ومعمودية واحدة،"]]}, {"l": "Tit 3:5", "n": "", "vs": [[5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"]]}, {"l": "Tit 3:6", "n": "", "vs": [[6, "الذي سكبه علينا بغنى بيسوع المسيح مخلصنا."]]}, {"l": "Heb 6:2", "n": "", "vs": [[2, "والنظم المختصة بطقوس الاغتسال، ووضع الأيدي، وقيامة الأموات، والدينونة الأبدية."]]}, {"l": "1Pe 3:21", "n": "", "vs": [[21, "وعملية النجاة هذه مصورة في المعمودية التي لا نقصد بها أن نغتسل من أوساخ أجسامنا، بل هي تعهد ضمير صالح أمام الله بفضل قيامة يسوع المسيح،"]]}], "kwAr": "في المعمودية", "noteAr": ""}, {"kw": "wherein", "raw": "Col_3:1, Col_3:2; Rom_6:8-11, Rom_7:4; 1Co_15:20; Eph_1:20, Eph_2:4-6, Eph_5:14; 1Pe_4:1-3", "note": "", "refs": [{"l": "Col 3:1", "n": "", "vs": [[1, "فبما أنكم قد قمتم مع المسيح، فاسعوا إلى الأمور التي في العلى، حيث المسيح جالس عن يمين الله."]]}, {"l": "Col 3:2", "n": "", "vs": [[2, "احصروا اهتمامكم بالأمور التي في العلى، لا بالأمور الأرضية."]]}, {"l": "Rom 6:8-11", "n": "", "vs": [[8, "ومادمنا متنا مع المسيح، فنحن نؤمن أننا سنحيا أيضا معه،"], [9, "لكوننا على يقين بأن المسيح، وقد أقيم من بين الأموات، لا يموت مرة ثانية، إذ ليس للموت سيادة عليه بعد."], [10, "لأنه بموته، قد مات لأجل الخطيئة مرة واحدة؛ وبحياته، يحيا لله."], [11, "فكذلك أنتم أيضا، احسبوا أنفسكم أمواتا بالنسبة للخطيئة وأحياء لله في المسيح يسوع."]]}, {"l": "Rom 7:4", "n": "", "vs": [[4, "وهكذا أنتم أيضا ياإخوتي، فإنكم بجسد المسيح الذي مات، قد صرتم أمواتا بالنسبة للشريعة، لكي تصيروا لآخر، إلى المسيح نفسه الذي أقيم من بين الأموات، من أجل أن نثمر لله."]]}, {"l": "1Co 15:20", "n": "", "vs": [[20, "أما الآن فالمسيح قد قام من بين الأموات بكرا للراقدين."]]}, {"l": "Eph 1:20", "n": "", "vs": [[20, "الذي عمله في المسيح، بإقامته له من بين الأموات. وقد أجلسه عن يمينه في الأماكن السماوية،"]]}, {"l": "Eph 2:4-6", "n": "", "vs": [[4, "أما الله ، وهو غني في الرحمة، فبسبب محبته العظيمة التي أحبنا بها،"], [5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"], [6, "وأقامنا معه وأجلسنا معه في الأماكن السماوية في المسيح يسوع."]]}, {"l": "Eph 5:14", "n": "", "vs": [[14, "لأن الذي يكشف كل شيء هو النور. لذلك يقال: «استيقظ أيها النائم، وقم من بين الأموات، فيشرق عليك نور المسيح!»"]]}, {"l": "1Pe 4:1-3", "n": "", "vs": [[1, "فبما أن المسيح قد تحمل الآلام الجسمية لأجلكم، سلحوا أنفسكم بالاستعداد دائما لتحمل الآلام. فإن من يتحمل الآلام الجسمية، يكون قد قاطع الخطيئة."], [2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."], [3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}], "kwAr": "وفيها أيضا أقمتم معه", "noteAr": ""}, {"kw": "the faith", "raw": "Luk_17:5 *Gr: Joh_1:12, Joh_1:13, Joh_3:3-7; Act_14:27; Eph_1:19, Eph_2:8, Eph_3:7, Eph_3:17; Phi_1:29; Heb_12:2; Jam_1:16, Jam_1:17", "note": "", "refs": [{"l": "Luk 17:5", "n": "*Gr:", "vs": [[5, "وقال الرسل للرب: «زدنا إيمانا!»"]]}, {"l": "Joh 1:12", "n": "", "vs": [[12, "أما الذين قبلوه، أي الذين آمنوا باسمه، فقد منحهم الحق في أن يصيروا أولاد الله،"]]}, {"l": "Joh 1:13", "n": "", "vs": [[13, "وهم الذين ولدوا ليس من دم، ولا من رغبة جسد، ولا من رغبة بشر، بل من الله."]]}, {"l": "Joh 3:3-7", "n": "", "vs": [[3, "فأجابه يسوع: «الحق الحق أقول لك: لا أحد يمكنه أن يرى ملكوت الله إلا إذا ولد من جديد»."], [4, "فسأله نيقوديموس: «كيف يمكن الإنسان أن يولد وهو كبير السن؟ ألعله يستطيع أن يدخل بطن أمه ثانية ثم يولد؟»"], [5, "أجابه يسوع: «الحق الحق أقول لك: لا يمكن أن يدخل أحد ملكوت الله إلا إذا ولد من الماء والروح."], [6, "فالمولود من الجسد هو جسد، والمولود من الروح هو روح."], [7, "فلا تتعجب إذا قلت لك إنكم بحاجة إلى الولادة من جديد."]]}, {"l": "Act 14:27", "n": "", "vs": [[27, "ولما وصلا، استدعيا الكنيسة إلى الاجتماع، وأخبرا بكل ما فعل الله بواسطتهما، وبأنه فتح باب الإيمان لغير اليهود."]]}, {"l": "Eph 1:19", "n": "", "vs": [[19, "وما هي عظمة قدرته الفائقة المعلنة لنا نحن المؤمنين، بحسب عمل اقتدار قوته"]]}, {"l": "Eph 2:8", "n": "", "vs": [[8, "فإنكم بالنعمة مخلصون، بالإيمان، وهذا ليس منكم. إنه هبة من الله،"]]}, {"l": "Eph 3:7", "n": "", "vs": [[7, "الذي صرت أنا خادما له بحسب نعمة الله الموهوبة لي وفقا لعمل قدرته."]]}, {"l": "Eph 3:17", "n": "", "vs": [[17, "ليسكن المسيح في قلوبكم بالإيمان؛ حتى إذا تأصلتم وتأسستم في المحبة،"]]}, {"l": "Phi 1:29", "n": "", "vs": [[29, "فقد وهب لكم، لأجل المسيح، لا أن تؤمنوا به وحسب، بل أيضا أن تتألموا لأجله،"]]}, {"l": "Heb 12:2", "n": "", "vs": [[2, "متطلعين دائما إلى يسوع: رائد إيماننا ومكمله. فهو قد تحمل الموت صلبا، هازئا بما في ذلك من عار، إذ كان ينظر إلى السرور الذي ينتظره، ثم جلس عن يمين عرش الله."]]}, {"l": "Jam 1:16", "n": "", "vs": [[16, "فيا إخوتي الأحباء، لا تضلوا:"]]}, {"l": "Jam 1:17", "n": "", "vs": [[17, "إن كل عطية صالحة وهبة كاملة إنما تنزل من فوق، من لدن أبي الأنوار الذي ليس فيه تحول، ولا ظل لأنه لا يدور."]]}], "kwAr": "إيمانكم بقدرة الله", "noteAr": ""}, {"kw": "who", "raw": "Act_2:24; Rom_4:24; Heb_13:20,Heb_13:21", "note": "", "refs": [{"l": "Act 2:24", "n": "", "vs": [[24, "ولكن الله أقامه من بين الأموات ناقضا أوجاع الموت، فما كان يمكن للموت أن يبقيه في قبضته!"]]}, {"l": "Rom 4:24", "n": "", "vs": [[24, "بل أيضا من أجلنا، نحن الذين سيحسب ذلك لنا إذ نؤمن بمن أقام من بين الأموات يسوع ربنا"]]}, {"l": "Heb 13:20", "n": "", "vs": [[20, "وأسأل الله ، إله السلام الذي أقام من بين الأموات ربنا يسوع راعي الخراف العظيم بفضل دمه الذي ختم به العهد الأبدي"]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}], "kwAr": "الذي أقامه من بين الأموات", "noteAr": ""}], "arS": [["فقد ", []], ["دفنتم معه", ["G4916"]], [" في ", []], ["المعمودية", ["G908"]], ["، وفيها أيضا ", []], ["أقمتم معه", ["G4891"]], ["، عن طريق ", []], ["إيمانكم", ["G4102"]], [" ", []], ["بقدرة", ["G1753"]], [" ", []], ["الله", ["G2316"]], [" الذي ", []], ["أقامه", ["G1453"]], [" من بين ", []], ["الأموات", ["G3498"]], [".", []]]}, {"c": 2, "v": 13, "text": "فأنتم، إذ كنتم أمواتا في الخطايا وعدم ختانكم الجسدي، أحياكم جميعا معه؛ مسامحا لنا جميعا بالخطايا كلها.", "groups": [{"kw": "dead", "raw": "Eze_37:1-10; Luk_9:60, Luk_15:24, Luk_15:32; Rom_6:13; 2Co_5:14, 2Co_5:15; Eph_2:1, Eph_2:5, Eph_2:6; Eph_5:14; 1Ti_5:6; Heb_6:1, Heb_9:14; Jam_2:17, Jam_2:20,Jam_2:26", "note": "", "refs": [{"l": "Eze 37:1-10", "n": "", "vs": [[1, "وكانت يد الرب علي فأحضرني بالروح إلى وسط واد مليء بعظام،"], [2, "وجعلني أجتاز بينها وحولها، وإذا بها كثيرة جدا، تغطي سطح أرض الوادي، كما كانت شديدة اليبوسة."], [3, "فقال لي «ياابن آدم، أيمكن أن تحيا هذه العظام؟» فأجبت: «ياسيد الرب، أنت أعلم»."], [4, "فقال لي: «تنبأ على هذه العظام وقل لها: اسمعي أيتها العظام اليابسة كلمة الرب:"], [5, "ها أنا أجعل روحا يدخل فيك فتحيين."], [6, "وأكسوك بالعصب واللحم، وأبسط عليك جلدا وأجعل فيك روحا فتحيين وتدركين أني أنا الرب»."], [7, "وفيما كنت أتنبأ كما أمرت، حدث صوت جلبة وزلزلة، فتقاربت العظام كل عظم إلى عظمه،"], [8, "واكتست بالعصب واللحم وبسط عليها الجلد. إنما لم يكن فيها روح"], [9, "فقال لي: «تنبأ للروح ياابن آدم، وقل: هذا ما يأمر به السيد الرب: هيا ياروح أقبل من الرياح الأربع وهب على هؤلاء القتلى ليحيوا»."], [10, "فتنبأت كما أمرني الرب، فدخل فيهم الروح فدبت فيهم الحياة، وانتصبوا على أقدامهم جيشا عظيما جدا جدا."]]}, {"l": "Luk 9:60", "n": "", "vs": [[60, "فقال له يسوع: «دع الموتى يدفنون موتاهم، وأما أنت فاذهب وبشر بملكوت الله»."]]}, {"l": "Luk 15:24", "n": "", "vs": [[24, "فإن ابني هذا كان ميتا فعاش، وكان ضائعا فوجد. فأخذوا يفرحون!"]]}, {"l": "Luk 15:32", "n": "", "vs": [[32, "ولكن كان من الصواب أن نفرح ونبتهج، لأن أخاك هذا كان ميتا فعاش، وكان ضالا فوجد!»"]]}, {"l": "Rom 6:13", "n": "", "vs": [[13, "ولا تقدموا أعضاءكم للخطيئة أسلحة للإثم، بل قدموا أنفسكم لله باعتباركم أقمتم من بين الأموات أحياء، وأعضاءكم لله أسلحة للبر."]]}, {"l": "2Co 5:14", "n": "", "vs": [[14, "فإن محبة المسيح تسيطر علينا، وقد حكمنا بهذا: مادام واحد قد مات عوضا عن الجميع، فمعنى ذلك أن الجميع ماتوا؛"]]}, {"l": "2Co 5:15", "n": "", "vs": [[15, "وهو قد مات عوضا عن الجميع حتى لا يعيش الأحياء في ما بعد لأنفسهم بل للذي مات عوضا عنهم ثم قام."]]}, {"l": "Eph 2:1", "n": "", "vs": [[1, "وأنتم كنتم في السابق أمواتا بذنوبكم وخطاياكم،"]]}, {"l": "Eph 2:5", "n": "", "vs": [[5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"]]}, {"l": "Eph 2:6", "n": "", "vs": [[6, "وأقامنا معه وأجلسنا معه في الأماكن السماوية في المسيح يسوع."]]}, {"l": "Eph 5:14", "n": "", "vs": [[14, "لأن الذي يكشف كل شيء هو النور. لذلك يقال: «استيقظ أيها النائم، وقم من بين الأموات، فيشرق عليك نور المسيح!»"]]}, {"l": "1Ti 5:6", "n": "", "vs": [[6, "أما تلك التي تعيش منغمسة في اللذات، فقد ماتت، وإن كانت حية."]]}, {"l": "Heb 6:1", "n": "", "vs": [[1, "لذلك، فلنترك تلك المباديء الأولية عن المسيح، ونتقدم إلى النضوج الكامل. ولا نضع من جديد تلك الأسس التي تعلمناها سابقا، وهي: التوبة من الأعمال المميتة، والإيمان بالله،"]]}, {"l": "Heb 9:14", "n": "", "vs": [[14, "فكم بالأحرى دم المسيح الذي قدم نفسه لله بروح أزلي ذبيحة لا عيب فيها، يطهر ضمائرنا من الأعمال الميتة لنعبد الله الحي."]]}, {"l": "Jam 2:17", "n": "", "vs": [[17, "هكذا نرى أن الإيمان وحده ميت ما لم تنتج عنه أعمال."]]}, {"l": "Jam 2:20", "n": "", "vs": [[20, "وهذا يؤكد لك، أيها الإنسان الغبي، أن الإيمان الذي لا تنتج عنه أعمال هو إيمان ميت!"]]}, {"l": "Jam 2:26", "n": "", "vs": [[26, "فكما أن جسم الإنسان يكون ميتا إذا فارقته الروح، كذلك يكون الإيمان ميتا إذا لم ترافقه الأعمال!"]]}], "kwAr": "إذ كنتم أمواتا في الخطايا", "noteAr": ""}, {"kw": "the uncircumcision", "raw": "Eph_2:11", "note": "", "refs": [{"l": "Eph 2:11", "n": "", "vs": [[11, "لذلك اذكروا، أنتم الأمم في الجسد سابقا، يامن تسمون أهل عدم الختان من قبل من يسمون أهل الختان الذي يجري في الجسد باليد،"]]}], "kwAr": "وعدم ختانكم الجسدي", "noteAr": ""}, {"kw": "he", "raw": "Psa_71:20, Psa_119:50; Joh_5:21, Joh_6:63; Rom_4:17, Rom_8:11; 1Co_15:36, 1Co_15:45; 2Co_3:6 *marg. 1Ti_6:13", "note": "", "refs": [{"l": "Psa 71:20", "n": "", "vs": [[20, "أنت الذي اجتزت بنا ضيقات كثيرة وقاسية، ولكنك تعود فتحيينا، وتصعدنا من جديد من أعماق الأرض."]]}, {"l": "Psa 119:50", "n": "", "vs": [[50, "وعدك ينعشني إذ هو تعزيتي في ضيقي."]]}, {"l": "Joh 5:21", "n": "", "vs": [[21, "فكما يقيم الآب الموتى ويحييهم، كذلك يحيي الابن من يشاء."]]}, {"l": "Joh 6:63", "n": "", "vs": [[63, "الروح هو الذي يعطي الحياة، أما الجسد فلا يفيد شيئا. الكلام الذي كلمتكم به هو روح وحيا ة."]]}, {"l": "Rom 4:17", "n": "", "vs": [[17, "كما قد كتب: «إني جعلتك أبا لأمم كثيرة». (إنه أب لنا) في نظر الله الذي به آمن، والذي يحيي الموتى ويستدعي إلى الوجود ما كان غير موجود."]]}, {"l": "Rom 8:11", "n": "", "vs": [[11, "وإذا كان روح الذي أقام يسوع من بين الأموات يسكن فيكم، فإن الذي أقام المسيح من بين الأموات سوف يحيي أيضا أجسادكم الفانية بسبب روحه الذي يسكن فيكم."]]}, {"l": "1Co 15:36", "n": "", "vs": [[36, "ياغافل! إن ما تزرعه لا يحيا إلا بعد أن يموت."]]}, {"l": "1Co 15:45", "n": "", "vs": [[45, "فهكذا أيضا قد كتب: «صار الإنسان الأول، آدم، نفسا حية» وأما آدم الأخير فهو روح باعث للحياة."]]}, {"l": "2Co 3:6", "n": "*marg.", "vs": [[6, "الذي جعلنا أصحاب كفاءة لنكون خداما لعهد جديد قائم لا على الحرف بل على الروح. فالحرف يؤدي إلى الموت؛ أما الروح فيعطي الحياة."]]}, {"l": "1Ti 6:13", "n": "", "vs": [[13, "وأوصيك، أمام الله الذي يحيي كل شيء، والمسيح يسوع الذي شهد أمام بيلاطس البنطي بالاعتراف الحسن،"]]}], "kwAr": "أحياكم جميعا معه", "noteAr": ""}, {"kw": "having", "raw": "Psa_32:1; Isa_1:18, Isa_55:7; Jer_31:34; Act_13:38, Act_13:39; 2Co_5:19; Heb_8:10-12; 1Jo_1:7-9, 1Jo_2:12", "note": "", "refs": [{"l": "Psa 32:1", "n": "", "vs": [[1, "طوبى للذي غفرت آثامه وسترت خطاياه."]]}, {"l": "Isa 1:18", "n": "", "vs": [[18, "تعالوا نتحاجج يقول الرب، إن كانت خطاياكم كلطخات قرمزية فإنها تبيض كالثلج، وإن كانت حمراء كصبغ الدودي تصبح في نقاء الصوف!"]]}, {"l": "Isa 55:7", "n": "", "vs": [[7, "ليترك الشرير طريقه والأثيم أفكاره، وليتب إلى الرب فيرحمه، وليرجع إلى إلهنا لأنه يكثر الغفران."]]}, {"l": "Jer 31:34", "n": "", "vs": [[34, "ولا يحض في ما بعد كل واحد قريبه قائلا: اعرف الرب إلهك لأنهم جميعا سيعرفونني، من صغيرهم إلى كبيرهم، لأني سأصفح عن إثمهم ولن أذكر خطاياهم من بعد»."]]}, {"l": "Act 13:38", "n": "", "vs": [[38, "فاعلموا، أيها الإخوة، أنه بيسوع تبشرون بغفران الخطايا ،"]]}, {"l": "Act 13:39", "n": "", "vs": [[39, "وأنه به يتبرر كل من يؤمن من كل ما عجزت شريعة موسى أن تبرره منه."]]}, {"l": "2Co 5:19", "n": "", "vs": [[19, "ذلك أن الله كان في المسيح مصالحا العالم مع نفسه، غير حاسب عليهم خطاياهم، وقد وضع بين أيدينا رسالة هذه المصالحة."]]}, {"l": "Heb 8:10-12", "n": "", "vs": [[10, "فهذا هو العهد الذي أبرمه مع بني إسرائيل، بعد تلك الأيام، يقول الرب: أضع شرائعي داخل ضمائرهم، وأكتبها على قلوبهم، وأكون لهم إلها، وهم يكونون لي شعبا."], [11, "بعد ذلك، لا يعلم أحد منهم ابن وطنه ولا أخاه قائلا: تعرف بالرب! ذلك لأن الجميع سوف يعرفونني حق المعرفة، من الصغير فيهم إلى العظيم."], [12, "لأني سأصفح عن آثامهم، ولا أعود أبدا إلى تذكر خطاياهم ومخالفاتهم!»"]]}, {"l": "1Jo 1:7-9", "n": "", "vs": [[7, "ولكن، إن كنا فعلا نعيش في النور، كما هو في النور، تكون لنا حقا شركة بعضنا مع بعض، ودم ابنه يسوع يطهرنا من كل خطيئة."], [8, "إن كنا ندعي أن لا خطيئة لنا، نخدع أنفسنا، ولا يكون الحق في داخلنا."], [9, "ولكن، إن اعترفنا لله بخطايانا، فهو جدير بالثقة وعادل، يغفر لنا خطايانا ويطهرنا من كل إثم."]]}, {"l": "1Jo 2:12", "n": "", "vs": [[12, "أكتب إليكم، أيها الأولاد، لأن الله قد غفر لكم خطاياكم إكراما لاسم المسيح."]]}], "kwAr": "مسامحا لنا", "noteAr": ""}], "arS": [["فأنتم، إذ كنتم ", []], ["أمواتا", ["G3498"]], [" في ", []], ["الخطايا", ["G3900"]], [" ", []], ["وعدم ختانكم", ["G203"]], [" ", []], ["الجسدي", ["G4561"]], ["، ", []], ["أحياكم", ["G4806"]], [" جميعا معه؛ ", []], ["مسامحا", ["G5483"]], [" لنا جميعا ", []], ["بالخطايا", ["G3900"]], [" ", []], ["كلها", ["G3956"]], [".", []]]}, {"c": 2, "v": 14, "text": "إذ قد محا صك الفرائض المكتوب علينا والمناقض لمصلحتنا، بل إنه قد أزاله من الوسط، مسمرا إياه على الصليب.", "groups": [{"kw": "Blotting", "raw": "Num_5:23; Neh_4:5; Psa_51:1, Psa_51:9; Isa_43:25, Isa_44:22; Act_3:19", "note": "", "refs": [{"l": "Num 5:23", "n": "", "vs": [[23, "«ثم يدون الكاهن هذه اللعنات في درج ويمحوها بالماء المر؛"]]}, {"l": "Neh 4:5", "n": "", "vs": [[5, "ولا تستر آثامهم، ولا تمح خطيئتهم من أمامك، لأنهم أثاروا غضبك أمام القائمين بالبناء»."]]}, {"l": "Psa 51:1", "n": "", "vs": [[1, "ارحمني ياالله حسب رحمتك، وامح معاصي حسب كثرة رأفتك."]]}, {"l": "Psa 51:9", "n": "", "vs": [[9, "احجب وجهك عن خطاياي وامح كل آثامي."]]}, {"l": "Isa 43:25", "n": "", "vs": [[25, "أنا، أنا هو الماحي ذنوبك من أجل ذاتي، وخطاياك لن أذكرها."]]}, {"l": "Isa 44:22", "n": "", "vs": [[22, "قد محوت كغيمة عابرة ذنوبك، وكسحابة خطاياك. ارجع تائبا إلي لأني قد فديتك."]]}, {"l": "Act 3:19", "n": "", "vs": [[19, "فتوبوا وارجعوا ليمحو الله خطاياكم،"]]}], "kwAr": "إذ قد محا", "noteAr": ""}, {"kw": "the handwriting", "raw": "Col_2:20; Est_3:12, Est_8:8; Dan_5:7, Dan_5:8; Luk_1:6; Gal_4:1-4; Eph_2:14-16; Heb_7:18; Heb_8:13, Heb_9:9, Heb_9:10, Heb_10:8, Heb_10:9", "note": "", "refs": [{"l": "Col 2:20", "n": "", "vs": [[20, "فمادمتم قد متم مع المسيح بالنسبة لمباديء العالم، فلماذا، كما لو كنتم عائشين في العالم، تخضعون أنفسكم لفرائض مثل هذه:"]]}, {"l": "Est 3:12", "n": "", "vs": [[12, "وفي اليوم الثالث عشر من الشهر الأول استدعي كتاب الملك وأمليت عليهم أوامر هامان إلى ولاة الملك وإلى حكام كل إقليم بإقليمه، وإلى رؤساء كل شعب بشعبه، حسب لغة كل إقليم ولهجة أهلها، ووقع تلك الرسائل باسم الملك أحشويروش وختمها بخاتمه."]]}, {"l": "Est 8:8", "n": "", "vs": [[8, "فاكتبا أنتما إلى اليهود بكل ما تريانه مناسبا باسم الملك، واختماه بخاتمه، لأن المراسيم التي تسن باسم الملك وتختم بخاتمه لا تبطل»."]]}, {"l": "Dan 5:7", "n": "", "vs": [[7, "فزعق طالبا أن يحضروا السحرة والكلدانيين والمنجمين، وقال لهم: «أي رجل يقرأ هذه الكتابة ويفسر لي محتواها، يرتدي الأرجوان وقلادة من ذهب في عنقه، ويصبح الرجل الثالث المتسلط في المملكة»."]]}, {"l": "Dan 5:8", "n": "", "vs": [[8, "فأقبل حكماء الملك ولكنهم عجزوا عن قراءة الكتابة وعن إطلاع الملك على تفسيرها."]]}, {"l": "Luk 1:6", "n": "", "vs": [[6, "وكان كلاهما بارين أمام الله، يسلكان وفقا لوصايا الرب وأحكامه كلها بغير لوم."]]}, {"l": "Gal 4:1-4", "n": "", "vs": [[1, "أقول أيضا مادام الوريث قاصرا، فليس بينه وبين العبد أي فرق، مع أنه صاحب الإرث كله،"], [2, "بل يبقى خاضعا للأوصياء والوكلاء إلى أن تنقضي الفترة التي حددها أبوه."], [3, "وهذه حالنا نحن أيضا: فإذ كنا قاصرين، كنا في حالة العبودية لمبادىء العالم."], [4, "ولكن لما جاء تمام الزمان، أرسل الله ابنه، وقد ولد من امرأة وكان خاضعا للشريعة،"]]}, {"l": "Eph 2:14-16", "n": "", "vs": [[14, "فإنه هو سلامنا، ذاك الذي جعل الفريقين واحدا وهدم حائط الحاجز الفاصل بينهما،"], [15, "أي العداء: إذ أبطل بجسده شريعة الوصايا ذات الفرائض، لكي يكون من الفريقين إنسانا واحدا جديدا، إذ أحل السلام بينهما،"], [16, "ولكي يصالحهما معا في جسد واحد مع الله بالصليب الذي به قتل العداء."]]}, {"l": "Heb 7:18", "n": "", "vs": [[18, "هكذا، يتبين أن نظام الكهنوت القديم قد ألغي لأنه عاجز وغير نافع."]]}, {"l": "Heb 8:13", "n": "", "vs": [[13, "وهكذا، نلاحظ أن الله بكلامه عن عهد جديد، جعل العهد السابق عتيقا. وطبيعي أن كل ما عتق وشاخ، يكون في طريقه إلى الزوال!"]]}, {"l": "Heb 9:9", "n": "", "vs": [[9, "وما هذا إلا صورة للوقت الحاضر الذي فيه مازالت التقدمات والذبائح تقرب وفقا لنظام العهد العتيق. ولكنها لا تستطيع أن تطهر قلوب الذين يتقربون بها إلى الله، ولا أن توصلهم إلى الكمال فتريح ضمائرهم."]]}, {"l": "Heb 9:10", "n": "", "vs": [[10, "إذ إن نظام العهد السابق قد اقتصر على تحريم بعض المأكولات والمشروبات وتحليل غيرها، وعلى وضع النظم المختصة بطقوس الاغتسال المختلفة. بل إن كل ما ضمه ذلك النظام، كان قوانين جسدية ينتهي عملها حين يأتي وقت الإصلاح."]]}, {"l": "Heb 10:8", "n": "", "vs": [[8, "فبعد أن عبر المسيح عن عدم رضى الله بجميع التقدمات والذبائح التي كانت تقرب مع أنها كانت تقدم وفقا للشريعة،"]]}, {"l": "Heb 10:9", "n": "", "vs": [[9, "أضاف قائلا: «ها أنا آتي لأعمل إرادتك!» فهو، إذن، يلغي النظام السابق، ليضع محله نظاما جديدا ينسجم مع إرادة الله."]]}], "kwAr": "صك الفرائض", "noteAr": ""}, {"kw": "took", "raw": "Isa_57:14; 2Th_2:7", "note": "", "refs": [{"l": "Isa 57:14", "n": "", "vs": [[14, "ويقال آنئذ: مهدوا! مهدوا السبيل، أزيلوا كل معثرة من طريق شعبي."]]}, {"l": "2Th 2:7", "n": "", "vs": [[7, "فإن التمرد الآن يعمل خفية كأنه سر. ولكن فقط إلى أن يرفع من الوسط ذاك الذي يحتجز المتمرد."]]}], "kwAr": "قد أزاله من الوسط", "noteAr": ""}], "arS": [["إذ قد ", []], ["محا", ["G1813"]], [" ", []], ["صك", ["G5498"]], [" ", []], ["الفرائض", ["G1378"]], [" المكتوب علينا ", []], ["والمناقض", ["G5227"]], [" لمصلحتنا، بل إنه قد ", []], ["أزاله", ["G142"]], [" من ", []], ["الوسط", ["G3319"]], ["، ", []], ["مسمرا", ["G4338"]], [" إياه على ", []], ["الصليب", ["G4716"]], [".", []]]}, {"c": 2, "v": 15, "text": "وإذ نزع سلاح الرئاسات والسلطات، فضحهم جهارا فيه، وساقهم في موكبه ظافرا عليهم.", "groups": [{"kw": "having", "raw": "Gen_3:15; Psa_68:18; Isa_49:24, Isa_49:25, Isa_53:12; Mat_12:29; Luk_10:18, Luk_11:22; Joh_12:31, Joh_16:11; Eph_4:8; Heb_2:14; Rev_12:9, Rev_20:2, Rev_20:3, Rev_20:10", "note": "", "refs": [{"l": "Gen 3:15", "n": "", "vs": [[15, "وأثير عداوة دائمة بينك وبين المرأة، وكذلك بين نسليكما. هو يسحق رأسك وأنت تلدغين عقبه»."]]}, {"l": "Psa 68:18", "n": "", "vs": [[18, "يصعد إلى العلى ويأخذ معه سبايا كثيرين؛ يوزع الغنائم على الناس وحتى على الذين تمردوا قبلا على مقر سكناك، أيها الرب الإله."]]}, {"l": "Isa 49:24", "n": "", "vs": [[24, "هل تسلب الغنيمة من المحارب الجبار؟ أو يفلت الأسرى من قبضة الغالب؟"]]}, {"l": "Isa 49:25", "n": "", "vs": [[25, "نعم سبي الجبار يسلب منه، وتسترد الغنيمة من الغالب، لأنني أخاصم مخاصميك وأنقذ أبناءك،"]]}, {"l": "Isa 53:12", "n": "", "vs": [[12, "لذلك أهبه نصيبا بين العظماء، فيقسم غنيمة مع الأعزاء، لأنه سكب للموت نفسه، وأحصي مع أثمة. وهو حمل خطيئة كثيرين، وشفع في المذنبين."]]}, {"l": "Mat 12:29", "n": "", "vs": [[29, "وإلا، فكيف يقدر أحد أن يدخل بيت القوي وينهب أمتعته إذا لم يربط القوي أولا؛ وبعدئذ ينهب بيته؟"]]}, {"l": "Luk 10:18", "n": "", "vs": [[18, "فقال لهم: «قد رأيت الشيطان وهو يهوي من السماء مثل البرق."]]}, {"l": "Luk 11:22", "n": "", "vs": [[22, "ولكن عندما يغزوه من هو أقوى منه فيغلبه، فإنه يجرده من كامل سلاحه الذي اعتمد عليه، ثم يوزع غنائمه."]]}, {"l": "Joh 12:31", "n": "", "vs": [[31, "الآن وقت الحكم على هذا العالم! الآن يطرد سيد هذا العالم خارجا!"]]}, {"l": "Joh 16:11", "n": "", "vs": [[11, "وأما على الدينونة، فلأن سيد هذا العالم قد صدر عليه حكم الدينونة."]]}, {"l": "Eph 4:8", "n": "", "vs": [[8, "لذلك يقول (الوحي): «إذ صعد إلى الأعالي، ساق أسرى، ووهب الناس مواهب!»"]]}, {"l": "Heb 2:14", "n": "", "vs": [[14, "إذن، بما أن هؤلاء الأولاد متشاركون في أجسام بشرية من لحم ودم، اشترك المسيح أيضا في اللحم والدم باتخاذه جسما بشريا. وهكذا تمكن أن يموت، ليقضي على من له سلطة الموت، أي إبليس،"]]}, {"l": "Rev 12:9", "n": "", "vs": [[9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."]]}, {"l": "Rev 20:2", "n": "", "vs": [[2, "قيد بها التنين، أي الحية القديمة، وهو إبليس أو الشيطان، وسجنه مدة ألف سنة،"]]}, {"l": "Rev 20:3", "n": "", "vs": [[3, "وطرحه في الهاوية وأغلقها عليه، وختمها، حتى يكف عن تضليل الأمم، إلى أن تنقضي الألف سنة. ولكن لابد من إطلاقه بعد ذلك لمدة قصيرة."]]}, {"l": "Rev 20:10", "n": "", "vs": [[10, "ثم يطرح إبليس الذي كان يضللهم، في بحيرة النار والكبريت، حيث الوحش والنبي الدجال. هناك سوف يعذبون نهارا وليلا، إلى أبد الآبدين."]]}], "kwAr": "وإذ نزع سلاح", "noteAr": ""}, {"kw": "principalities", "raw": "Col_1:16; 2Co_4:4; Eph_6:12", "note": "", "refs": [{"l": "Col 1:16", "n": "", "vs": [[16, "إذ به خلقت جميع الأشياء: ما في السماوات وما على الأرض، ما يرى وما لا يرى، أعروشا كانت أم سيادات أم رئاسات أم سلطات. كل ما في الكون قد خلق به ولأجله."]]}, {"l": "2Co 4:4", "n": "", "vs": [[4, "الذين أعمى إله هذا العالم أذهانهم حتى لا يضيء لهم نور الإنجيل المختص بمجد المسيح الذي هو صورة الله."]]}, {"l": "Eph 6:12", "n": "", "vs": [[12, "فإن حربنا ليست ضد ذوي اللحم والدم، بل ضد الرئاسات، ضد السلطات، ضد أسياد العالم حكام هذا الظلام، ضد قوى الشر الروحية في الأماكن السماوية."]]}], "kwAr": "الرئاسات والسلطات", "noteAr": ""}, {"kw": "triumphing", "raw": "Luk_23:39-43; Joh_12:32, Joh_19:30; Act_2:23, Act_2:24, Act_2:32-36", "note": "", "refs": [{"l": "Luk 23:39-43", "n": "", "vs": [[39, "وأخذ واحد من المجرمين المصلوبين يجدف عليه فيقول: «ألست أنت المسيح؟ إذن خلص نفسك وخلصنا!»"], [40, "ولكن الآخر كلمه زاجرا فقال: «أحتى أنت لا تخاف الله ، وأنت تعاني العقوبة نفسها؟"], [41, "أما نحن فعقوبتنا عادلة لأننا ننال الجزاء العادل لقاء ما فعلنا. وأما هذا الإنسان، فلم يفعل شيئا في غير محله!»"], [42, "ثم قال: «يايسوع، اذكرني عندما تجيء في ملكوتك!»"], [43, "فقال له يسوع: «الحق أقول لك: اليوم ستكون معي في الفردوس!»"]]}, {"l": "Joh 12:32", "n": "", "vs": [[32, "وحين أعلق مرفوعا عن الأرض أجذب إلي الجميع»."]]}, {"l": "Joh 19:30", "n": "", "vs": [[30, "فلما ذاق يسوع الخل، قال: «قد أكمل!» ثم نكس رأسه وأسلم الروح."]]}, {"l": "Act 2:23", "n": "", "vs": [[23, "ومع ذلك فقد سمح الله ، وفقا لمشيئته المحتومة وعلمه السابق، أن تقبضوا عليه وتصلبوه وتقتلوه بأيدي الأثمة."]]}, {"l": "Act 2:24", "n": "", "vs": [[24, "ولكن الله أقامه من بين الأموات ناقضا أوجاع الموت، فما كان يمكن للموت أن يبقيه في قبضته!"]]}, {"l": "Act 2:32-36", "n": "", "vs": [[32, "فيسوع هذا أقامه الله من الموت، ونحن جميعا شهود لذلك."], [33, "وإذ رفع إلى يمين الله، وأخذ من الآب الروح القدس الموعود به، أفاضه علينا. وما ترونه الآن وتسمعونه هو نتيجة لذلك."], [34, "فإن داود لم يرتفع بجسده إلى السماء. ثم إنه هو نفسه يقول: قال الرب لربي: اجلس عن يميني"], [35, "حتى أجعل أعداءك موطئا لقدميك."], [36, "فليعلم يقينا بنو إسر ائيل جميعا، أن الله قد جعل يسوع، هذا الذي صلبتموه أنتم، ربا ومسيحا!»"]]}], "kwAr": "وساقهم في موكبه ظافرا", "noteAr": ""}, {"kw": "in it", "raw": "or, in himself", "note": "or, in himself", "refs": [], "kwAr": "فيه", "noteAr": "أو: في نفسه."}], "arS": [["وإذ ", []], ["نزع سلاح", ["G554"]], [" ", []], ["الرئاسات", ["G746"]], [" ", []], ["والسلطات", ["G1849"]], ["، ", []], ["فضحهم", ["G1165"]], [" ", []], ["جهارا", ["G3954"]], [" فيه، وساقهم في موكبه ", []], ["ظافرا", ["G2358"]], [" عليهم.", []]]}, {"c": 2, "v": 16, "text": "فلا يحكم عليكم أحد في قضية الأكل والشرب، أو في القضايا المتعلقة بالأعياد ورؤوس الشهور والسبوت؛", "groups": [{"kw": "judge", "raw": "Rom_14:3, Rom_14:10,Rom_14:13; 1Co_10:28-31; Gal_2:12, Gal_2:13; Jam_4:11", "note": "", "refs": [{"l": "Rom 14:3", "n": "", "vs": [[3, "فمن كان يأكل كل شيء، عليه ألا يحتقر من لا يأكل، ومن كان لا يأكل، عليه ألا يدين من يأكل، لأن الله قد قبله."]]}, {"l": "Rom 14:10", "n": "", "vs": [[10, "ولكن، لماذا أنت تدين أخاك؟ وأنت أيضا، لماذا تحتقر أخاك؟ فإننا جميعا سوف نقف أمام عرش الله لنحاسب."]]}, {"l": "Rom 14:13", "n": "", "vs": [[13, "فلنكف عن محاكمة بعضنا بعضا، بل بالأحرى احكموا بهذا: أن لا يضع أحد أمام أخيه عقبة أو فخا."]]}, {"l": "1Co 10:28-31", "n": "", "vs": [[28, "ولكن إن قال لكم أحد: «هذه ذبيحة مقدمة لإله»، فلا تأكلوا منها مراعاة لمن أخبركم وإرضاء للضمير."], [29, "وبقولي «الضمير» لا أعني ضميرك أنت بل ضمير الآخر. ولماذا يتحكم ضمير غيري بحريتي؟"], [30, "ومادمت أتناول شيئا وأشكر عليه، فلماذا يقال في سوء لأجل ما أشكر عليه؟"], [31, "فإذا أكلتم أو شربتم أو مهما فعلتم، فافعلوا كل شيء لتمجيد الله."]]}, {"l": "Gal 2:12", "n": "", "vs": [[12, "إذ قبل أن يأتي بعضهم من عند يعقوب، كان بطرس يأكل مع الإخوة الذين من الأمم؛ ولكن لما أتى أولئك، انسحب وعزل نفسه، خوفا من أهل الختان."]]}, {"l": "Gal 2:13", "n": "", "vs": [[13, "وجاراه في ريائه باقي الإخوة الذين من اليهود. حتى إن برنابا أيضا انساق إلى ريائهم."]]}, {"l": "Jam 4:11", "n": "", "vs": [[11, "وياإخوتي، لا تذموا بعضكم بعضا. فمن يفعل هذا ويحكم على أخيه، يطعن في شريعة الله ويحكم عليها. فإن كنت تحكم على الشريعة، لا تكون عاملا بها بل تجعل نفسك قاضيا لها."]]}], "kwAr": "فلا يحكم عليكم أحد", "noteAr": ""}, {"kw": "in meat", "raw": "etc. or, for eating and drinking, Lev. 11:2-47, Lev_17:10-15; Deut. 14:3-21; Eze_4:14; Mat_15:11; Acts 11:3-18; Act_15:20; Rom_14:2, Rom_14:6, Rom_14:14-17, Rom_14:20,Rom_14:21; 1Co_8:7-13; 1Ti_4:3-5; Heb_9:10; Heb_13:9", "note": "etc. or, for eating and drinking, Lev. 11:2-47, Lev_17:10-15; Deut. 14:3-21; Eze_4:14; Mat_15:11; Acts 11:3-18; Act_15:20; Rom_14:2, Rom_14:6, Rom_14:14-17, Rom_14:20,Rom_14:21; 1Co_8:7-13; 1Ti_4:3-5; Heb_9:10; Heb_13:9", "refs": [{"l": "Lev 11:2-47", "n": "", "vs": [[2, "«أوصيا بني إسرائيل: هذه هي الحيوانات التي تأكلونها من جميع بهائم الأرض:"], [3, "تأكلون كل حيوان مشقوق الظلف ومجتر،"], [4, "أما الحيوانات المجترة فقط، أو المشقوقة الظلف فقط، فلا تأكلوا منها، فالجمل غير طاهر لكم لأنه مجتر ولكنه غير مشقوق الظلف،"], [5, "وكذلك الوبر نجس لكم لأنه مجتر ولكنه غير مشقوق الظلف،"], [6, "أما الأرنب فإنه مجتر ولكنه غير مشقوق الظلف، لذلك هو نجس لكم،"], [7, "والخنزير أيضا نجس لكم لأنه مشقوق الظلف ولكنه غير مجتر."], [8, "لا تأكلوا من لحمها ولا تلمسوا جثثها لأنها نجسة لكم."], [9, "أما ما يعيش في الماء فتأكلون منه كل ما له زعانف وقشور، سواء كان يعيش في البحار أم الأنهار، فهذه تأكلونها."], [10, "ولكن إياكم أن تأكلوا الحيوانات المائية التي ليس لها زعانف أو قشور، سواء كانت تعيش في الأنهار أو البحار، أو الزواحف في المياه، أو كل نفس حية فيها، فهذه كلها محظورة عليكم."], [11, "فلا تأكلوا من لحمها وامقتوا جثثها."], [12, "كل حيوان مائي خال من الزعانف والقشور يكون محظورا عليكم."], [13, "ومن الطيور التي يحظر عليكم أكلها لأنها ممقوتة: النسر والأنوق والعقاب،"], [14, "والحدأة والباشق على مختلف أصنافه،"], [15, "وكل أجناس الغربان،"], [16, "والنعامة والظليم والسأف وكل أنواع طير الباز،"], [17, "والبومة والغواص والكركي،"], [18, "والبجع والقوق والرخم،"], [19, "واللقلق والببغاء على اختلاف أجناسها، والهدهد والخفاش."], [20, "وكذلك تحظر عليكم كل حشرة مجنحة ذات أربع أرجل."], [21, "ولكن كلوا من بين الكائنات المجنحة التي تمشي على أربع ما له ساقان أطول من يديه يقفز بهما على الأرض."], [22, "فمن هذه الكائنات تأكلون: كل أنواع الجراد، وجميع أصناف الدبا والحرجوان على مختلف أجناسه والجندب بأنواعه"], [23, "أما سائر دبيب الطير ذوات الأربع الأرجل فهو محظور عليكم،"], [24, "فإنها تنجسكم، وكل من يلمس جثثها يتنجس حتى المساء."], [25, "وعلى كل من حمل جثثها أن يغسل ثيابه ويكون نجسا حتى المساء،"], [26, "وكذلك جميع البهائم ذوات الأظلاف غير المشقوقة وغير المجترة تكون نجسة لكم، وكل من يلمسها يتنجس."], [27, "وأيضا كل حيوان يمشي على كفوفه من جميع الحيوانات ذوات الأربع الأرجل، فهو نجس لكم، وكل من يمس جثثها يكون نجسا حتى المساء،"], [28, "ومن يحمل جثثها يغسل ثيابه ويكون نجسا إلى المساء. جميعها محظورة عليكم."], [29, "أما الحيوانات الدابة حولكم فوق الأرض والمحظورة عليكم لنجاستها فهي: ابن عرس والفأر والضب على مختلف أجناسه،"], [30, "والحرذون والورل والوزغة والعظاية والحرباء."], [31, "هذه هي الحيوانات النجسة لكم من جميع الحيوانات الدابة. كل من لمسها يكون نجسا حتى المساء."], [32, "إن وقعت جثة أحد هذه الحيوانات على شيء فإنه يتنجس، سواء أكان آنية من خشب أم قماش أم جلد أم مسح، أم أي شيء يستخدم في عمل ما. يوضع في ماء ويكون نجسا إلى المساء، ثم يطهر."], [33, "أما إن وقعت جثة أحدها في إناء خزفي، فإن ما في الإناء يتنجس، وأما الإناء فيكسر."], [34, "وأي طعام يؤكل استخدم فيه ماء من هذا الإناء يكون نجسا. وكذلك يكون ماؤه الذي يشرب أيضا."], [35, "وإذا سقطت جثة أحد هذه الحيوانات في التنور أو الموقد، فإنه يهدم، لأنه نجس وأنتم به تتنجسون."], [36, "أما إن سقطت في نبع أو بئر حيث يجتمع الماء، فإنهما تظلان طاهرتين. لكن كل من لمس جثتها يكون نجسا."], [37, "وإذا وقعت جثة واحدة منها على حبوب يبذرونها في حقل، فإنها تبقى طاهرة."], [38, "لكن إن كانت الحبوب مبتلة بماء وسقطت الجثة عليها، فإن الحبوب المبتلة تصبح نجسة لكم."], [39, "إن مات حيوان لا يحل لكم أكله، ولمس أحد جثته، فاللامس يكون نجسا حتى المساء."], [40, "وعلى من أكل من جثته أو حملها أن يغسل ثيابه ويكون نجسا إلى المساء."], [41, "ويحظر عليكم الأكل من الحيوانات الزاحفة،"], [42, "سواء كانت تزحف على بطنها أو تدب على أربع أو أكثر فإنها محظورة عليكم، فلا تأكلوا منها."], [43, "لا تدنسوا أنفسكم بالحيوانات الدابة هذه، ولا تتنجسوا بها. كونوا طاهرين."], [44, "أنا الرب إلهكم، فكرسوا أنفسكم وتقدسوا، لأني أنا قدوس، ولا تنجسوا أنفسكم بشيء من الدبيب المتحرك على الأرض."], [45, "لأني أنا الرب الذي أخرجكم من ديار مصر لأكون لكم إلها. فكونوا قديسين لأني أنا قدوس."], [46, "هذه هي الشرائع الخاصة بالحيوانات والطيور والحيوانات المائية والزواحف،"], [47, "لكي تميزوا بين النجس والطاهر، وبين الحيوانات التي تؤكل والحيوانات المحظور أكلها»."]]}, {"l": "Lev 17:10-15", "n": "", "vs": [[10, "وأي إسرائيلي أو غريب من المقيمين في وسطكم، يأكل دما، أنقلب عليه وأستأصله من بينكم."], [11, "لأن حياة الجسد هي في الدم. لهذا وهبتكم إياه لتكفروا عن نفوسكم، لأن الدم يكفر عن النفس."], [12, "لذلك أوصيت بني إسرائيل ألا يأكلوا دما، وكذلك لا يأكله الغريب المقيم في وسطكم."], [13, "أي إسرائيلي، أو غريب مقيم في وسطكم، يقتنص حيوانا أو طيرا محللا أكله، يسفك دمه ويغطيه بالتراب،"], [14, "لأن حياة كل مخلوق هي دمه، ولهذا أوصيت بني إسرائيل ألا يأكلوا دم جسد ما، لأن حياة كل جسد هي دمه، وكل من يأكل منه يستأصل."], [15, "أي إنسان، سواء كان مواطنا أم غريبا، يأكل من جيفة أو فريسة، عليه أن يغسل ثيابه ويستحم بماء، ويبقى نجسا إلى المساء، ثم يصبح طاهرا."]]}, {"l": "Deu 14:3-21", "n": "", "vs": [[3, "لا تأكلوا شيئا رجسا."], [4, "أما البهائم التي تأكلون منها فهي: البقر والضأن والمعز"], [5, "والأيل والظباء وبعض أنواع الوعول والغزلان البيضاء، والبقر الوحشي،"], [6, "وكل بهيمة ذات ظلف مشقوق ومجترة تأكلونها."], [7, "ولكن لا تأكلوا الحيوانات المجترة غير مشقوقة الظلف، كالجمل والأرنب والوبر، فإنها تجتر ولكنها غير مشقوقة الظلف، لذلك هي نجسة لكم،"], [8, "والخنزير لأنه مشقوق الظلف ولكنه غير مجتر، لذلك فهو نجس لكم. فلا تأكلوا من لحم جميع هذه البهائم ولا تلمسوا جثثها."], [9, "أما ما يعيش في الماء فكلوا من كل ما له زعانف وقشور،"], [10, "ولكن لا تأكلوا مما ليس له زعانف وقشور لأنه نجس لكم."], [11, "كلوا من كل طير طاهر،"], [12, "ولكن من الطيور التالية لا تأكلوا: النسر والأنوق والعقاب"], [13, "والحدأة والباشق والشاهين بمختلف أنواعه،"], [14, "وجميع أصناف الغربان،"], [15, "والنعامة والظليم والسأف وكل أجناس الباز،"], [16, "والبوم والكركي والبجع،"], [17, "والقوق والرخم والغواص،"], [18, "واللقلق والببغاء على مختلف أنواعه، والهدهد والخفاش."], [19, "وكل حشرة تطير، هي نجسة لكم. لا تأكلوها."], [20, "ولكن كلوا من كل طير طاهر."], [21, "لا تأكلوا
