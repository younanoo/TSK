 جثة حيوان ميت، بل أعطوها للغريب المقيم في جواركم فيأكلها أو يبيعها لأجنبي، لأنكم شعب مقدس للرب إلهكم. لا تطبخوا جديا بلبن أمه."]]}, {"l": "Eze 4:14", "n": "", "vs": [[14, "ولكني قلت: «آه، أيها السيد الرب، أنا لم أنجس نفسي أبدا فمنذ حداثتي حتى الآن لم آكل ميتة أو فريسة، ولم يدخل فمي لحم نجس»."]]}, {"l": "Mat 15:11", "n": "", "vs": [[11, "ليس ما يدخل الفم ينجس الإنسان، بل ما يخرج من الفم هو الذي ينجس الإنسان»."]]}, {"l": "Act 11:3-18", "n": "", "vs": [[3, "«كيف دخلت بيت رجال غير مختونين، وأكلت معهم؟»"], [4, "فشرح لهم بطرس ما حدث على التوالي، وقال:"], [5, "«كنت أصلي في مدينة يافا، فوقعت علي غيبوبة، فرأيت في رؤيا وعاء يشبه قطعة كبيرة من القماش مربوطة بأطرافها الأربعة، وقد تدلى إلي من السماء."], [6, "وعندما تأملته مليا وجدت فيه أنواع الحيوانات الدابة على الأرض والوحوش والزواحف وطيور السماء جميعا،"], [7, "وسمعت صوتا يقول لي: يابطرس، قم اذبح وكل!"], [8, "فأجبت: كلا يارب، فلم يدخل فمي قط شيء محرم أو نجس."], [9, "فقال لي الصوت السماوي أيضا: ما طهره الله لا تحسبه أنت نجسا."], [10, "وتكرر هذا ثلاث مرات، ثم سحب الوعاء بما فيه إلى السماء."], [11, "وإذا ثلاثة رجال مرسلون إلي من قيصرية وصلوا إلى البيت الذي كنت مقيما فيه،"], [12, "فأمرني الروح أن أذهب معهم بلا تردد، فذهبت، ورافقني هؤلاء الإخوة الستة. وعند دخولنا بيت الرجل،"], [13, "أخبرنا كيف رأى الملاك في بيته واقفا وقائلا له: أرسل رجالا إلى يافا، واستدع سمعان الملقب بطرس،"], [14, "وهو يكلمك كلاما به تخلص أنت وأهل بيتك جميعا."], [15, "ولما ابتدأت أتكلم، حل الروح القدس عليهم كما حل علينا في البداية"], [16, "فتذكرت ما قاله الرب لنا: إن يوحنا عمد بالماء، وأما أنتم فستتعمدون بالروح القدس."], [17, "فإن كان الله قد ساواهم بنا فأعطاهم الهبة التي أعطانا، إذ آمنا بالرب يسوع المسيح، فمن أكون أنا حتى أعيق الله ؟»"], [18, "فلما سمع المعارضون هذا، سكتوا، ومجدوا الله قائلين: «إذن، قد أنعم الله أيضا على غير اليهود بالتوبة لنوال الحياة»."]]}, {"l": "Act 15:20", "n": "", "vs": [[20, "بل نكتب إليهم رسالة نوصيهم فيها بأن يمتنعوا عن الأكل من الذبائح النجسة المقربة للأصنام، وعن ارتكاب الزنى، وعن تناول لحوم الحيوانات المخنوقة، وعن الدم."]]}, {"l": "Rom 14:2", "n": "", "vs": [[2, "من الناس من يعتقد أنه يحق له أن يأكل كل شيء. وأما الضعيف فيأكل البقول."]]}, {"l": "Rom 14:6", "n": "", "vs": [[6, "إن من يراعي يوما معينا، يراعيه لأجل الرب؛ ومن يأكل كل شيء، يأكل لأجل الرب، لأنه يؤدي الشكر لله؛ ومن لا يأكل، لا يأكل لأجل الرب، لأنه يؤدي الشكر لله."]]}, {"l": "Rom 14:14-17", "n": "", "vs": [[14, "فأنا عالم، بل مقتنع من الرب يسوع، أنه لا شيء نجس في ذاته. أما إن اعتبر أحد شيئا ما نجسا، فهو نجس في نظره."], [15, "فإن كنت بطعامك تسبب الحزن لأخيك، فلست تسلك بعد بما يتفق مع المحبة. لا تدمر بطعامك من لأجله مات المسيح."], [16, "إذن، لا تعرضوا صلاحكم لكلام السوء."], [17, "إذ ليس ملكوت الله بأكل وشرب، بل هو بر وسلام وفرح في الروح القدس."]]}, {"l": "Rom 14:20", "n": "", "vs": [[20, "لا تدمر عمل الله بسبب الطعام! حقا إن الأطعمة كلها طاهرة، ولكن الشر في أن يأكل الإنسان شيئا يسبب العثرة."]]}, {"l": "Rom 14:21", "n": "", "vs": [[21, "فمن الصواب ألا تأكل لحما ولا تشرب خمرا، ولا تفعل شيئا يتعثر فيه أخوك."]]}, {"l": "1Co 8:7-13", "n": "", "vs": [[7, "على أن هذه الحقيقة لا يعرفها الجميع: فبعضهم قد تعودوا الظن بأن الأصنام موجودة فعلا، ومازالوا يأكلون من تلك الذبائح كأنها فعلا مقدمة لها، فيتدنس ضميرهم بسبب ضعفه."], [8, "إلا أن الطعام لا يقربنا إلى الله، فإننا إن أكلنا منه لا يعلو مقامنا، وإن لم نأكل منه لا يصغر شأننا!"], [9, "ولكن خذوا حذركم لكي لا يكون حقكم هذا فخا يسقط فيه الضعفاء."], [10, "فياصاحب المعرفة، إن رآك أحد جالسا إلى الطعام في هيكل للأصنام، أفلا يتقوى ضميره، هو الضعيف، ليأكل من ذبائح الأصنام،"], [11, "وبذلك يتدمر ذلك الضعيف، وهو أخ لك مات المسيح من أجله، بسبب معرفتك!"], [12, "فإذ تخطئون هكذا إلى الإخوة فتجرحون ضمائرهم الضعيفة، إنما تخطئون إلى المسيح."], [13, "لذا، إن كان بعض الطعام فخا يسقط فيه أخي، فلن آكل لحما أبدا، لكي لا أسقط أخي!"]]}, {"l": "1Ti 4:3-5", "n": "", "vs": [[3, "يحرمون الزواج، ويأمرون بالامتناع عن أطعمة خلقها الله ليتناولها المؤمنون وعارفو الحق شاكرين."], [4, "فإن كل ما خلقه الله جيد، ولا شيء منه يرفض إذا تناوله الإنسان شاكرا؛"], [5, "لأنه يصير مقدسا بكلمة الله والصلاة."]]}, {"l": "Heb 9:10", "n": "", "vs": [[10, "إذ إن نظام العهد السابق قد اقتصر على تحريم بعض المأكولات والمشروبات وتحليل غيرها، وعلى وضع النظم المختصة بطقوس الاغتسال المختلفة. بل إن كل ما ضمه ذلك النظام، كان قوانين جسدية ينتهي عملها حين يأتي وقت الإصلاح."]]}, {"l": "Heb 13:9", "n": "", "vs": [[9, "فلا تنخدعوا وتتبعوا تلك التعاليم الغريبة المتنوعة ... فمن الأفضل أن يثبت القلب بالنعمة لا بنظم الأطعمة التي لم تنفع المتقيدين بها."]]}], "kwAr": "الأكل والشرب", "noteAr": "أو: من جهة الأكل والشرب."}, {"kw": "in respect", "raw": "or, in part", "note": "or, in part", "refs": [], "kwAr": "في القضايا المتعلقة", "noteAr": "أو: في جزء (من جهة)."}, {"kw": "of an", "raw": "Lev. 23:1-44; Num. 28:1-29:40; Deut. 16:1-17; Neh_8:9, Neh_10:31; Psa_42:4; Rom_14:5, Rom_14:6", "note": "", "refs": [{"l": "Lev 23:1-44", "n": "", "vs": [[1, "وقال الرب لموسى:"], [2, "«أوص بني إسرائيل: هذه هي مواسمي وأعيادي التي تعلنونها محافل مقدسة."], [3, "ستة أيام تعملون، أما اليوم السابع فهو سبت راحة ومحفل مقدس. لا تقوموا فيه بأي عمل، بل يكون سبت راحة للرب حيث تقيمون."], [4, "إليكم مواسم الرب والمحافل المقدسة التي تعيدونها في أوقاتها:"], [5, "في اليوم الرابع عشر من الشهر الأول العبري (أي شهر نيسان ; أبريل) بين العشاءين يكون فصح للرب."], [6, "وفي اليوم الخامس عشر من هذا الشهر يكون عيد الفطير للرب، فتأكلون فطيرا سبعة أيام."], [7, "في اليوم الأول يكون لكم محفل مقدس، تتوقف فيه جميع الأعمال."], [8, "ثم تقربون محرقات للرب طوال سبعة أيام. وفي اليوم السابع تقيمون محفلا مقدسا تتعطل فيه جميع الأعمال»."], [9, "وخاطب الرب موسى: «أوص بني إسرائيل وقل لهم:"], [10, "متى دخلتم الأرض التي أهبها لكم وحصدتم غلاتها، تحضرون أول حزمة من حصادكم للكاهن،"], [11, "فيرجح الكاهن الحزمة في اليوم التالي ليوم السبت أمام الرب ليرضى عنكم."], [12, "وتقدمون يوم ترجيح الحزمة خروفا سليما محرقة للرب،"], [13, "مع عشرين (نحو خمسة لترات) من دقيق معجون بالزيت وقودا للرب لتحظوا برضاه. وكذلك تقدمون سكيبه ربع الهين (نحو لتر) من الخمر."], [14, "لا تأكلوا من الغلة الجديدة، لا دقيقا مخبوزا ولا فريكا ولا سويقا إلى اليوم الذي تحضرون فيه قربان إلهكم، فتكون هذه عليكم فريضة دائمة جيلا بعد جيل."], [15, "ثم تحسبون سبعة أسابيع كاملة، ابتداء من اليوم التالي للسبت الذي تحضرون فيه حزمة الترجيح،"], [16, "فتحسبون خمسين يوما إلى اليوم التالي للسبت السابع، ثم تقربون تقدمة جديدة للرب."], [17, "فتأتون من مساكنكم بخبز ترجيح، رغيفين مقدارهما عشرين (نحو خمسة لترات) من دقيق مخبوزين بخمير، فيكونان باكورة للرب."], [18, "وتقدمون مع الخبز سبعة خراف سليمة حولية وثورا واحدا وكبشين وسكيب خمر. فتكون جميعها محرقة ووقود رضى وسرور للرب."], [19, "وتقربون تيسا واحدا من المعز ذبيحة خطيئة وخروفين حوليين ذبيحة سلام."], [20, "فيرجحها الكاهن أمام الرب مع خبز الباكورة والخروفين، فتكون مقدسة للرب نصيبا للكاهن."], [21, "وتخصصون ذلك اليوم عينه ليكون محفلا مقدسا لكم، تتعطل فيه جميع الأعمال، فتكون عليكم فريضة دائمة حيث تقيمون جيلا بعد جيل."], [22, "وعندما تستوفون حصاد غلاتكم، اتركوا زوايا حقولكم غير محصودة، ولا تلتقطوا ما يقع منها على الأرض، بل اتركوه للمسكين وعابر السبيل. فأنا الرب إلهكم»."], [23, "وقال الرب لموسى:"], [24, "«أوص بني إسرائيل وقل لهم: يكون لكم اليوم الأول من الشهر السابع (أي شهر أيلول ; سبتمبر) يوم عطلة فيه تحتفلون احتفالا مقدسا، تنفخون فيه بالأبواق."], [25, "تتوقفون فيه عن أعمالكم وتصعدون تقدمات محرقات للرب»."], [26, "وقال الرب لموسى:"], [27, "«ويكون اليوم العاشر من هذا الشهر السابع يوم كفارة، تحتفلون فيه احتفالا مقدسا، وتذللون نفوسكم، وتقربون محرقات للرب،"], [28, "وتتوقفون فيه أيضا عن أعمالكم، لأنه يوم كفارة للتكفير عنكم أمام الرب إلهكم."], [29, "وكل نفس لا تتذلل في هذا اليوم تستأصل من بين شعبها"], [30, "وأبيد كل من لا يتوقف عن عمله في هذا اليوم."], [31, "إياكم القيام بعمل ما. إنها فريضة دائمة عليكم جيلا بعد جيل حيث تقيمون."], [32, "إنه سبت راحة لكم تتذللون فيه، فتستريحون من مساء اليوم التاسع حتى مساء اليوم التالي»."], [33, "وقال الرب لموسى:"], [34, "«أوص بني إسرائيل أن يحتفلوا بعيد الخيام في اليوم الخامس عشر من الشهر السابع. يحتفلون للرب سبعة أيام."], [35, "تجتمعون في اليوم الأول في محفل مقدس، تتوقف فيه جميع الأعمال،"], [36, "ثم تثابرون على تقريب محرقات للرب طوال سبعة أيام. وفي اليوم الثامن تجتمعون لاحتفال مقدس تقدمون فيه محرقات للرب، وتعتكفون للعبادة. وفي هذا اليوم تتوقف أيضا جميع الأعمال."], [37, "هذه هي أعياد الرب التي تحتفلون فيها احتفالا مقدسا لتقريب محرقات للرب، محرقة وتقدمة وذبيحة وخمرا للرب، كل يوم بيومه،"], [38, "فتكون هذه المحرقات علاوة على تقدمات سبوت الرب، وعلاوة على عطاياكم وجميع نذوركم ونوافلكم التي تقدمونها للرب."], [39, "وتعيدون في اليوم الخامس عشر من الشهر السابع عيدا للرب، لأن فيه تجمعون غلة أرضكم. تعيدون للرب سبعة أيام، فيكون اليوم الثامن عطلة."], [40, "في اليوم الأول تجمعون ثمار أشجار نضرة وسعف نخل وأغصان أشجار كثيفة الورق، وأغصان صفصاف نهري، وتفرحون أمام الرب إلهكم سبعة أيام."], [41, "سبعة أيام في السنة من الشهر السابع تحتفلون به عيدا للرب. ويكون هذا فريضة دائمة عليكم جيلا بعد جيل،"], [42, "فيقيم كل أبناء أرض إسرائيل في خيام سبعة أيام."], [43, "لكي تتذكر أجيالكم أنني أسكنت أبناء إسرائيل في خيام عندما أخرجتهم من أرض مصر. فأنا الرب إلهكم»."], [44, "وهكذا أبلغ موسى بني إسرائيل بأعياد الرب."]]}, {"l": "Num 28:1-29:40", "n": "", "vs": [[1, "وقال الرب لموسى:"], [2, "«أوص بني إسرائيل وقل لهم: عليكم أن تقربوا لي طعام وقائدي في مواعيده كرائحة رضى لي،"], [3, "وقل لهم: هذا هو الوقود الذي تقدمونه للرب: حملان حوليان صحيحان، يوميا ليكونا محرقة دائمة."], [4, "قدموا أحد الحملين صباحا، والحمل الآخر ما بين العشاءين،"], [5, "مع تقدمة من عشر الإيفة (نحو لترين ونصف اللتر) من دقيق معجون بربع الهين (نحو لتر) من زيت زيتون مرضوض."], [6, "هذه هي التقدمة المعتادة التي نص عليها في جبل سيناء لتكون رائحة رضى ومحرقة دائمة للرب."], [7, "ويسكب مع الحمل الواحد ربع الهين (نحو لتر) من الخمر للرب في القدس."], [8, "أما الحمل الثاني فتقدمونه بين العشاءين كتقدمة الصباح، مع سكيبه، فيكون محرقة رائحة رضى للرب."], [9, "وفي يوم السبت تقربون حملين حوليين صحيحين، مع تقدمة من عشرين (نحو خمسة لترات) من دقيق معجون بزيت، وأيضا سكيب خمر."], [10, "فتكون هذه محرقة في كل سبت، علاوة على المحرقة الدائمة وسكيبها."], [11, "وتقربون أيضا في اليوم الأول من كل شهر محرقة للرب من ثورين وكبش واحد، وسبعة حملان حولية صحيحة."], [12, "وتقدمة من ثلاثة أعشار (نحو سبعة لترات ونصف اللتر) من دقيق معجون بزيت، لكل ثور، وتقدمة من عشرين (نحو خمسة لترات) من دقيق معجون بزيت للكبش الواحد."], [13, "وتقدمة من عشر واحد (نحو لتر ين ونصف اللتر) من دقيق معجون بزيت لكل حمل، فتكون محرقة رائحة رضى وقربانا للرب."], [14, "وتكون سكائب خمرها نصف الهين (نحو لترين) للثور، وثلث الهين (نحو لتر وثلث اللتر) للكبش، وربع الهين (نحو لتر) للحمل. هذه محرقة تقرب كل شهر من أشهر السنة."], [15, "كذلك تقدمون تيسا واحدا من المعز ذبيحة خطيئة للرب علاوة على المحرقة الدائمة المقربة مع سكيبها من الخمر."], [16, "ويكون اليوم الرابع عشر من الشهر الأول العبري (أي شهر آذار ; مارس) فصحا للرب."], [17, "وفي اليوم الخامس عشر منه تحتفلون وتأكلون فطيرا سبعة أيام."], [18, "وتقيمون في اليوم الأول محفلا مقدسا، تمتنعون فيه عن أي عمل."], [19, "وتصعدون ذبائح محرقات للرب ثورين وكبشا واحدا وسبعة حملان حولية صحيحة."], [20, "وتكون تقدمتها ثلاثة أعشار (نحو سبعة لترات ونصف اللتر) من دقيق معجون بزيت لكل ثور، وعشرين (نحو خمسة لترات) للكبش الواحد."], [21, "وعشرا واحدا (نحو لترين ونصف) لكل حمل من السبعة الحملان."], [22, "وتقربون أيضا تيسا واحدا ذبيحة خطيئة للتكفير عنكم،"], [23, "فتكون هذه التقدمة علاوة على محرقة الصباح الدائمة التي تصعدونها."], [24, "هكذا تصنعون كل يوم طوال السبعة الأيام، فتقدمون طعام وقود رائحة رضى للرب، فضلا عن المحرقة الدائمة التي تقرب مع سكيب خمرها."], [25, "ثم تقيمون محفلا مقدسا في اليوم السابع، تمتنعون فيه عن أي عمل."], [26, "وفي يوم أول الأثمار حين تقربون تقدمة جديدة للرب في أثناء عيد الأسابيع، أقيموا محفلا مقدسا، تمتنعون فيه عن أي عمل."], [27, "وتقربون محرقة كرائحة رضى للرب، من ثورين وكبش واحد وسبعة حملان حولية."], [28, "أما تقدمتهن فتكون ثلاثة أعشار (نحو سبعة لترات ونصف اللتر) من دقيق معجون بزيت لكل ثور، وعشرين (نحو خمسة لترات) للكبش الواحد"], [29, "وعشرا واحدا (نحو لترين ونصف اللتر) لكل حمل من الحملان السبعة."], [30, "وأيضا تقدمون تيسا واحدا من المعز للتكفير عنكم،"], [31, "وهكذا علاوة على المحرقة الدائمة وتقدمتها، أصعدوا هذه مع سكائبها من الخمر، على أن تكون الذبائح خالية من كل عيب."], [1, "وفي اليوم الأول من الشهر السابع العبري (أي شهر أيلول ; سبتمبر) تقيمون لكم محفلا مقدسا للرب، تمتنعون فيه عن أي عمل، إذ يكون لكم يوم نفخ بالأبواق."], [2, "وتصعدون فيه محرقة لرائحة رضى للرب ثورا واحدا وكبشا واحدا وسبعة حملان حولية سليمة."], [3, "وتكون تقدمتها ثلاثة أعشار (نحو سبعة لترات ونصف اللتر) من دقيق معجون بزيت للثور، وعشرين (نحو خمسة لترات) للكبش،"], [4, "وعشرا واحدا (نحو لترين ونصف اللتر) لكل حمل من السبعة الحملان."], [5, "كما تقدمون تيسا واحدا من المعز ذبيحة خطيئة للتكفير عنكم."], [6, "فتكون هذه علاوة على المحرقة الشهرية وتقدمتها من الدقيق والمحرقة اليومية الدائمة وتقدمتها من الدقيق، مع ما يرافقها من سكائب الخمر، هي محرقة رائحة رضى للرب."], [7, "وفي اليوم العاشر من الشهر السابع تقيمون لكم محفلا مقدسا، تصومون فيه وتمتنعون عن أي عمل."], [8, "وتقربون محرقة للرب رائحة رضى ثورا واحدا وكبشا واحدا وسبعة حملان حولية سليمة."], [9, "تكون تقدمتها ثلاثة أعشار (نحو سبعة لترات ونصف اللتر) من دقيق معجون بزيت للثور، وعشرين (نحو خمسة لترات) للكبش الواحد،"], [10, "وعشرا واحدا (نحو لترين ونصف اللتر) لكل حمل من السبعة الحملان"], [11, "كما تقدمون تيسا واحدا من المعز ذبيحة خطيئة للتكفير عنكم. فتكون هذه علاوة على ذبيحة الخطيئة السنوية المقدمة في يوم الكفارة، والمحرقة اليومية الدائمة مع ما يرافقها من سكائب الخمر."], [12, "وفي اليوم الخامس عشر من الشهر نفسه تقيمون لكم محفلا مقدسا، تمتنعون فيه عن أي عمل، وتحتفلون فيه للرب سبعة أيام."], [13, "وتقربون في اليوم الأول محرقة رائحة رضى للرب، ثلاثة عشر ثورا وكبشين وأربعة عشر حملا حوليا سليما."], [14, "وتكون تقدمتها ثلاثة أعشار (نحو سبعة لترات ونصف اللتر) من دقيق معجون بزيت لكل ثور من الثيران الثلاثة عشر، وعشرين (نحو خمسة لترات) لكل كبش من الكبشين."], [15, "وعشرا واحدا (نحو لترين ونصف اللتر) لكل حمل من الأربعة عشر حملا."], [16, "كما تقدمون تيسا من المعز ذبيحة خطيئة، علاوة على المحرقة اليومية الدائمة وتقدمتها وسكيبها من الخمر."], [17, "وتقربون في اليوم الثاني اثني عشر ثورا وكبشين وأربعة عشر حملا حوليا سليما."], [18, "وتكون تقدمتها من الدقيق وسكائب الخمر لكل من الثيران والكبشين والحملان، هي التقدمة المعتادة بما يتفق مع عددها."], [19, "كما تقدمون تيسا واحدا من المعز ذبيحة خطيئة، علاوة على المحرقة اليومية الدائمة، وتقدمتها من الدقيق وسكائب الخمر."], [20, "وتقربون في اليوم الثالث أحد عشر ثورا وكبشين وأربعة عشر حملا حوليا سليما."], [21, "وتكون تقدمتها من الدقيق وسكائب الخمر لكل من الثيران والكبشين والحملان هي التقدمة المعتادة بما يتفق مع عددها."], [22, "كما تقدمون تيسا واحدا من المعز ذبيحة خطيئة، علاوة على المحرقة اليومية الدائمة وتقدمتها من الدقيق وسكائب الخمر."], [23, "وتقربون في اليوم الرابع عشرة ثيران وكبشين وأربعة عشر حملا حوليا سليما."], [24, "وتكون تقدمتها من الدقيق وسكائب الخمر لكل من الثيران والكبشين والحملان هي التقدمة المعتادة بما يتفق مع عددها."], [25, "كما تقدمون تيسا واحدا من المعز ذبيحة خطيئة، علاوة على المحرقة اليومية الدائمة وتقدمتها من الدقيق وسكائب الخمر."], [26, "وتقربون في اليوم الخامس تسعة ثيران وكبشين وأربعة عشر حملا حوليا صحيحا،"], [27, "وتكون تقدمتها من الدقيق وسكائب الخمر لكل من الثيران والكبشين والحملان هي التقدمة المعتادة بما يتفق مع عددها."], [28, "كما تقدمون تيسا واحدا من المعز ذبيحة خطيئة، علاوة على المحرقة اليومية الدائمة وتقدمتها من الدقيق وسكائب الخمر."], [29, "وتقربون في اليوم السادس ثمانية ثيران وكبشين وأربعة عشر حملا حوليا سليما."], [30, "وتكون تقدمتها من الدقيق وسكائب الخمر لكل من الثيران والكبشين والحملان هي التقدمة المعتادة بما يتفق مع عددها."], [31, "كما تقدمون تيسا واحدا من المعز ذبيحة خطيئة، علاوة على المحرقة اليومية الدائمة وتقدمتها من الدقيق وسكائب الخمر."], [32, "وتقربون في اليوم السابع سبعة ثيران وكبشين وأربعة عشر حملا حوليا سليما."], [33, "وتكون تقدمتها من الدقيق وسكائب الخمر لكل من الثيران والكبشين والحملان هي التقدمة المعتادة بما يتفق مع عددها."], [34, "كما تقدمون تيسا واحدا من المعز ذبيحة خطيئة، علاوة على المحرقة اليومية الدائمة وتقدمتها من الدقيق وسكائب الخمر."], [35, "وفي اليوم الثامن تجتمعون للعبادة وفيه تمتنعون عن أي عمل."], [36, "وتقربون محرقة لتكون رائحة رضى للرب ثورا واحدا وكبشا واحدا وسبعة حملان حولية سليمة."], [37, "وتكون تقدمتها من الدقيق وسكائب الخمر لكل من الثور والكبش والحملان هي التقدمة المعتادة بما يتفق مع عددها."], [38, "كما تقدمون تيسا واحدا من المعز ذبيحة خطيئة علاوة على المحرقة اليومية الدائمة وتقدمتها من الدقيق وسكائب الخمر."], [39, "فهذه هي الذبائح التي تقربونها للرب في مواسم أعيادكم، علاوة على نذوركم وقرابين محرقاتكم الطوعية وتقدماتكم من الدقيق وسكائب خمركم وذبائح سلامتكم»."], [40, "فأبلغ موسى بني إسرائيل جميع ما أمره به الرب."]]}, {"l": "Deu 16:1-17", "n": "", "vs": [[1, "احتفلوا دائما بفصح الرب إلهكم في شهر أبيب (أي شهر نيسان ; أبريل)، ففي هذا الشهر أخرجكم الرب إلهكم من مصر ليلا."], [2, "واذبحوا للرب إلهكم غنما أو بقرا في الموضع الذي يختاره الرب ليحل اسمه فيه."], [3, "لا تأكلوه مع خبز مختمر، بل كلوه مع فطير طوال سبعة أيام، لأن هذا هو خبز المشقة، إذ إنكم على عجل غادرتم ديار مصر، وبذلك تتذكرون يوم خروجكم من ديار مصر كل أيام حياتكم."], [4, "لا تبقوا خميرا في أرضكم طوال سبعة أيام، ولا يبت شيء من لحم حمل الفصح المذبوح في مساء اليوم الأول إلى الغد."], [5, "يحظر عليكم ذبح الفصح في أي من مدنكم التي يورثها لكم الرب إلهكم،"], [6, "بل في المكان الذي يختاره الرب إلهكم ليحل اسمه فيه تذبحون الفصح في المساء، عند غروب الشمس، في نفس ميعاد خروجكم من مصر."], [7, "فتشوونه وتأكلونه في الموضع الذي يختاره الرب، ثم تنصرفون في الغد كل إلى خيمته."], [8, "ستة أيام تأكلون فطيرا، وفي اليوم السابع تتوقفون عن كل عمل، وتحتفلون معتكفين للرب."], [9, "احسبوا سبعة أسابيع منذ ابتداء حصاد الزرع،"], [10, "ثم احتفلوا بعيد الأسابيع للرب إلهكم، حيث تحضرون ما تسخو به نفوسكم حسب ما يبارككم الرب به،"], [11, "فتحتفلون أنتم وأبناؤكم وبناتكم وعبيدكم وإماؤكم، واللاويون المقيمون في مدنكم، والغريب واليتيم والأرملة الذين بينكم، لدى الرب في الموضع الذي يختاره ليحل اسمه فيه."], [12, "وتذكروا أنكم كنتم عبيدا في مصر، فأطيعوا هذه الفرائض واعملوا بها."], [13, "واحتفلوا بعيد المظلات في نهاية موسم الحصاد، عند جمع غلات بيادركم ومعاصركم،"], [14, "فتحتفلون بالعيد أنتم وأبناؤكم وبناتكم وإماؤكم واللاويون والغريب واليتيم والأرملة المقيمون في مدنكم،"], [15, "فتعيدون للرب سبعة أيام في الموضع الذي يختاره الرب، لأن الرب إلهكم يبارك لكم محاصيلكم وكل ما تنتجه أيديكم، فيكمل بذلك فرحكم."], [16, "ويحضر جميع ذكوركم ثلاث مرات للمثول أمام الرب إلهكم في الموضع الذي يختاره الرب، وذلك في عيد الفطير وعيد الأسابيع وعيد المظال. وإياهم أن يمثلوا أمام الرب من غير تقدمات."], [17, "فيقدم كل واحد ما تسخو به نفسه حسبما باركه الرب إلهه."]]}, {"l": "Neh 8:9", "n": "", "vs": [[9, "وإذ بكى الشعب لدى سماعهم نص الشريعة، خاطبهم نحميا الوالي وعزرا الكاتب واللاويون الذين علموا الشعب قائلين: «لا تنوحوا ولا تبكوا، فهذا اليوم مقدس للرب إلهكم»"]]}, {"l": "Neh 10:31", "n": "", "vs": [[31, "ورفض الشراء من شعوب الأرض الذين يأتون لبيع بضائعهم وحبوبهم في يوم السبت أو في أي يوم من الأيام المقدسة، وأن نمتنع عن زراعة الأرض كل سنة سابعة ونلغي فيها كل الديون."]]}, {"l": "Psa 42:4", "n": "", "vs": [[4, "حين أتأمل في نفسي تعاودني هذه الذكرى: كيف كنت أرافق حشود العابدين المحتفلين بالعيد وأقودهم في الحضور إلى بيت الله، هاتفا معهم فرحا وحمدا."]]}, {"l": "Rom 14:5", "n": "", "vs": [[5, "ومن الناس من يراعي يوما دون غيره، ومنهم من يعتبر الأيام كلها متساوية. فليكن كل واحد مقتنعا برأيه في عقله."]]}, {"l": "Rom 14:6", "n": "", "vs": [[6, "إن من يراعي يوما معينا، يراعيه لأجل الرب؛ ومن يأكل كل شيء، يأكل لأجل الرب، لأنه يؤدي الشكر لله؛ ومن لا يأكل، لا يأكل لأجل الرب، لأنه يؤدي الشكر لله."]]}], "kwAr": "بالأعياد", "noteAr": ""}, {"kw": "the new", "raw": "Num_10:10, Num_28:11, Num_28:14; 1Sa_20:5, 1Sa_20:18; 2Ki_4:23; 1Ch_23:31; Neh_10:33; Psa_81:3; Isa_1:13; Eze_45:17, Eze_46:1-3; Amo_8:5; Gal_4:10", "note": "", "refs": [{"l": "Num 10:10", "n": "", "vs": [[10, "انفخوا في الأبواق أيضا في أيام فرحكم وفي أعيادكم ورؤوس شهوركم، وكذلك على محرقاتكم وذبائح سلامتكم، فتكون لكم تذكارا أمامي. أنا الرب إلهكم»."]]}, {"l": "Num 28:11", "n": "", "vs": [[11, "وتقربون أيضا في اليوم الأول من كل شهر محرقة للرب من ثورين وكبش واحد، وسبعة حملان حولية صحيحة."]]}, {"l": "Num 28:14", "n": "", "vs": [[14, "وتكون سكائب خمرها نصف الهين (نحو لترين) للثور، وثلث الهين (نحو لتر وثلث اللتر) للكبش، وربع الهين (نحو لتر) للحمل. هذه محرقة تقرب كل شهر من أشهر السنة."]]}, {"l": "1Sa 20:5", "n": "", "vs": [[5, "فقال داود ليوناثان: «غدا هو الاحتفال بأول أيام الشهر، حيث من عادتي أن أجلس مع الملك حول مائدة الأكل ولكن دعني أذهب فأختبيء في الحقل إلى مساء اليوم الثالث."]]}, {"l": "1Sa 20:18", "n": "", "vs": [[18, "وقال له يوناثان: «غدا يكون الاحتفال بأول الشهر فيفتقدونك لأن موضعك يكون خاليا."]]}, {"l": "2Ki 4:23", "n": "", "vs": [[23, "فسألها: «لماذا تذهبين إليه اليوم، مع أنه ليس رأس الشهر ولا سبتا؟» فأجابت: «للخير!»"]]}, {"l": "1Ch 23:31", "n": "", "vs": [[31, "والمساعدة في تقريب محرقات للرب في أيام السبت ومطالع الشهور القمرية ومواسم الأعياد. وكان عليهم أن يخدموا الرب بصورة منتظمة بأعداد تتناسب مع الخدمات المعينة لهم،"]]}, {"l": "Neh 10:33", "n": "", "vs": [[33, "ولتوفير خبز التقدمة والتقدمة الدائمة والمحرقة اليومية وقرابين السبوت ومطالع الشهور والأعياد والأقداس وذبائح الخطيئة، للتكفير عن إسرائيل، وللقيام بصيانة بيت إلهنا."]]}, {"l": "Psa 81:3", "n": "", "vs": [[3, "انفخوا بالبوق في أول الشهر، في الوقت المعين ليوم عيدنا،"]]}, {"l": "Isa 1:13", "n": "", "vs": [[13, "كفوا عن تقديم قرابين باطلة، فالبخور رجس لي، وكذلك رأس الشهر والسبت والدعاء إلى المحفل، فأنا لا أطيق الاعتكاف مع ارتكاب الإثم."]]}, {"l": "Eze 45:17", "n": "", "vs": [[17, "وعلى الرئيس تكون قرابين المحرقات وتقدمات الدقيق وسكيب الخمر في الأعياد ورؤوس الشهور وأيام السبوت، وفي كل مواسم احتفالات شعب إسرائيل، إذ عليه أن يقدم ذبيحة الخطيئة وتقدمة الدقيق وذبيحة المحرقة وذبائح السلام للتكفير عن شعب إسرائيل."]]}, {"l": "Eze 46:1-3", "n": "", "vs": [[1, "هذا ما يعلنه السيد الرب: يجب أن يظل باب الساحة الداخلية المتجه شرقا موصدا ستة أيام العمل، ولا يفتح سوى في أيام السبت وفي رأس كل شهر."], [2, "ويدخل الرئيس إليها من رواق الباب من خارج، ويبقى واقفا عند قائمة الباب، إلى أن يتمم الكهنة تقريب محرقته وذبائح سلامه، ثم يسجد على عتبة الباب وينصرف. أما الباب فلا يغلق إلى المساء."], [3, "ويسجد الشعب في حضرة الرب عند مدخل هذا الباب في أيام السبت وفي أوائل الشهور."]]}, {"l": "Amo 8:5", "n": "", "vs": [[5, "قائلين: «متى ينقضي أول الشهر حتى نبيع الحنطة؟ متى يمضي السبت لنعرض القمح في السوق، فنعمد إلى تصغير حجم مكيال الإيفة ونرفع الأسعار، ونستعمل ميزانا مغشوشا."]]}, {"l": "Gal 4:10", "n": "", "vs": [[10, "تحتفلون بأيام وأشهر ومواسم وسنين!"]]}], "kwAr": "ورؤوس الشهور", "noteAr": ""}, {"kw": "or of the sabbath", "raw": "Lev_16:31, Lev_23:3, Lev_23:24, Lev_23:32, Lev_23:39", "note": "", "refs": [{"l": "Lev 16:31", "n": "", "vs": [[31, "إنه يوم راحة مقدسة لكم تتذللون فيه، فريضة دائمة."]]}, {"l": "Lev 23:3", "n": "", "vs": [[3, "ستة أيام تعملون، أما اليوم السابع فهو سبت راحة ومحفل مقدس. لا تقوموا فيه بأي عمل، بل يكون سبت راحة للرب حيث تقيمون."]]}, {"l": "Lev 23:24", "n": "", "vs": [[24, "«أوص بني إسرائيل وقل لهم: يكون لكم اليوم الأول من الشهر السابع (أي شهر أيلول ; سبتمبر) يوم عطلة فيه تحتفلون احتفالا مقدسا، تنفخون فيه بالأبواق."]]}, {"l": "Lev 23:32", "n": "", "vs": [[32, "إنه سبت راحة لكم تتذللون فيه، فتستريحون من مساء اليوم التاسع حتى مساء اليوم التالي»."]]}, {"l": "Lev 23:39", "n": "", "vs": [[39, "وتعيدون في اليوم الخامس عشر من الشهر السابع عيدا للرب، لأن فيه تجمعون غلة أرضكم. تعيدون للرب سبعة أيام، فيكون اليوم الثامن عطلة."]]}], "kwAr": "والسبوت", "noteAr": ""}], "arS": [["فلا ", []], ["يحكم", ["G2919"]], [" عليكم ", []], ["أحد", ["G5100"]], [" في قضية ", []], ["الأكل", ["G1035"]], [" ", []], ["والشرب", ["G4213"]], ["، أو في ", []], ["القضايا", ["G3313"]], [" المتعلقة ", []], ["بالأعياد", ["G1859"]], [" ", []], ["ورؤوس الشهور", ["G3561"]], [" ", []], ["والسبوت", ["G4521"]], ["؛", []]]}, {"c": 2, "v": 17, "text": "فهذه كانت ظلالا لما سيأتي، أي للحقيقة التي هي المسيح.", "groups": [{"kw": "a shadow", "raw": "Joh_1:17; Heb_8:5, Heb_9:9, Heb_10:1", "note": "", "refs": [{"l": "Joh 1:17", "n": "", "vs": [[17, "لأن الشريعة أعطيت على يد موسى، أما النعمة والحق فقد تواجدا بيسوع المسيح."]]}, {"l": "Heb 8:5", "n": "", "vs": [[5, "وهؤلاء يقومون بخدمة ما يشكل رمزا وظلا للأمور التي في السماء. وهذا واضح من قول الله لموسى قبل أن يصنع خيمة العبادة. إذ أوحى إليه قائلا: «انتبه! عليك أن تصنع الخيمة وما فيها وفقا للمثال الذي أظهرته لك على الجبل!»"]]}, {"l": "Heb 9:9", "n": "", "vs": [[9, "وما هذا إلا صورة للوقت الحاضر الذي فيه مازالت التقدمات والذبائح تقرب وفقا لنظام العهد العتيق. ولكنها لا تستطيع أن تطهر قلوب الذين يتقربون بها إلى الله، ولا أن توصلهم إلى الكمال فتريح ضمائرهم."]]}, {"l": "Heb 10:1", "n": "", "vs": [[1, "فقد كانت شريعة موسى تتضمن ظلا واهيا للخيرات التي سيأتي بها المسيح، ولم تكن لتصور الحقيقة كما هي. ولذلك، لم تكن قادرة أن توصل إلى الكمال أولئك الذين يتقربون بها إلى الله، مقدمين دائما الذبائح السنوية عينها،"]]}], "kwAr": "ظلالا لما سيأتي", "noteAr": ""}, {"kw": "the body", "raw": "Mat_11:28, Mat_11:29; Heb_4:1-11", "note": "", "refs": [{"l": "Mat 11:28", "n": "", "vs": [[28, "تعالوا إلي ياجميع المتعبين والرازحين تحت الأحمال الثقيلة، وأنا أريحكم."]]}, {"l": "Mat 11:29", "n": "", "vs": [[29, "احملوا نيري عليكم، وتتلمذوا على يدي، لأني وديع ومتواضع القلب، فتجدوا الراحة لنفوسكم."]]}, {"l": "Heb 4:1-11", "n": "", "vs": [[1, "ومادام الوعد بالدخول إلى الراحة الإلهية قائما حتى الآن، فلنخف: فربما تبين أن بعضا منكم قد فشلوا في الدخول."], [2, "ذلك أن البشارة بالوعد قد وصلت إلينا، نحن أيضا، كما كانت قد وصلت إلى ذلك الشعب. ولكن البشارة لم تنفع سامعيها شيئا، لأنهم قابلوها بالرفض فلم يؤمنوا بها."], [3, "أما نحن، الذين آمنا بالبشارة، فسوف ندخل الراحة الإلهية. إذ قال عن الذين لم يؤمنوا: «وهكذا، في غضبي، أقسمت قائلا: إنهم لن يدخلوا مكان راحتي...!» هذه الراحة، كانت جاهزة منذ أن أتم الله تأسيس العالم."], [4, "فقد قال الوحي في موضع من الكتاب مشيرا إلى اليوم السابع: «ثم استراح الله من جميع أعماله في اليوم السابع»."], [5, "ثم عاد فقال: «لن يدخلوا مكان راحتي!»"], [6, "وهكذا، يتبين أن الراحة الإلهية هي في انتظار من سيدخلون إليها. وبما أن الذين تلقوا البشارة بها أولا لم يدخلوا إليها بسبب تمردهم،"], [7, "أعلن الله عن فرصة جديدة، إذ قال: «اليوم...» بلسان داود، بعدما مضى زمان طويل على ما كان قد قاله قديما: «اليوم، إن سمعتم صوته، فلا تقسوا قلوبكم...»"], [8, "فلو كان يشوع قد أدخل الشعب إلى الراحة، لما تكلم الله بعد ذلك عن موعد جديد للدخول بقوله: «اليوم...»"], [9, "إذن، مازالت الراحة الحقيقية الكاملة محفوظة لشعب الله."], [10, "فالذي يدخل تلك الراحة، يستريح هو أيضا من أعماله، كما استراح الله من أعماله."], [11, "لذلك، لنجتهد جميعا للدخول إلى تلك الراحة، لكي لا يسقط أحد منا كما سقط أولئك الذين عصوا أمر الله."]]}], "kwAr": "للحقيقة التي هي المسيح", "noteAr": ""}], "arS": [["فهذه كانت ", []], ["ظلالا", ["G4639"]], [" لما ", []], ["سيأتي", ["G3195"]], ["، أي ", []], ["للحقيقة", ["G4983"]], [" التي هي ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 2, "v": 18, "text": "لا يحرمكم أحد من جائزتكم، بحملكم على ما يرغب فيه من إظهار التواضع والتعبد للملائكة، داخلا في رؤى يتوهمها، وقد نفخه باطلا ذهنه الجسدي،", "groups": [{"kw": "no", "raw": "Col_2:4, Col_2:8; Gen_3:13; Num_25:18; Mat_24:24; Rom_16:18; 2Co_11:3; Eph_5:6; 2Pe_2:14; 1Jo_2:26, 1Jo_4:1, 1Jo_4:2; 2Jo_1:7-11; Rev_3:11, Rev_12:9, Rev_13:8, Rev_13:14", "note": "", "refs": [{"l": "Col 2:4", "n": "", "vs": [[4, "أقول هذا حتى لا يضللكم أحد بكلام خداع."]]}, {"l": "Col 2:8", "n": "", "vs": [[8, "احذروا أن يوقعكم أحد فريسة بالفلسفة والغرور الباطل، عملا بتقاليد الناس ومباديء العالم؛ مما لا يوافق المسيح."]]}, {"l": "Gen 3:13", "n": "", "vs": [[13, "فسأل الرب الإله المرأة: «ماذا فعلت؟» فأجابت: «أغوتني الحية فأكلت»."]]}, {"l": "Num 25:18", "n": "", "vs": [[18, "لأنهم ضايقوكم بمكايدهم التي احتالوا بها عليكم بشأن فغور، وأختهم كزبي ابنة رئيس لمديان، التي قتلت عندما تفشى الوبأ بسبب عبادة فغور»."]]}, {"l": "Mat 24:24", "n": "", "vs": [[24, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات عظيمة وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Rom 16:18", "n": "", "vs": [[18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."]]}, {"l": "2Co 11:3", "n": "", "vs": [[3, "غير أني أخشى أن تضلل عقولكم عن الإخلاص والطهارة تجاه المسيح مثلما أغوت الحية بمكرها حواء."]]}, {"l": "Eph 5:6", "n": "", "vs": [[6, "لا يخدعكم أحد بكلام باطل! فبسبب هذه الأمور يحل غضب الله على أبناء العصيان."]]}, {"l": "2Pe 2:14", "n": "", "vs": [[14, "عيونهم لا تنظر إلا نظرات الزنى، ولا تشبع من الخطيئة. وكم من نفوس ضعيفة تقع في فخاخهم! أما قلوبهم، فقد تدربت على الشهوة والطمع. إنهم حقا أبناء اللعنة!"]]}, {"l": "1Jo 2:26", "n": "", "vs": [[26, "كتبت إليكم هذا مشيرا إلى الذين يحاولون أن يضللوكم."]]}, {"l": "1Jo 4:1", "n": "", "vs": [[1, "أيها الأحباء، لا تصدقوا كل روح، بل امتحنوا الأرواح لتعرفوا ما إذا كانت من عند الله أم لا، لأن عددا كبيرا من الأنبياء الدجالين قد انتشر في العالم."]]}, {"l": "1Jo 4:2", "n": "", "vs": [[2, "وهذه هي الطريقة التي تعرفون بها كون الروح من عند الله فعلا: إذا كان ذلك الروح يعترف بأن يسوع المسيح قد جاء إلى الأرض في الجسد، فهو من عند الله."]]}, {"l": "2Jo 1:7-11", "n": "", "vs": [[7, "إن العالم أصبح يعج بالمضللين الذين لا يعترفون أن يسوع المسيح جاء إلى الأرض بجسم بشري. هذا هو روح المضل وضد المسيح!"], [8, "فانتبهوا لأنفسكم، لكي لا يضيع الجهد الذي بذلناه في سبيلكم، بل لتنالوا أجركم كاملا."], [9, "لأن من تعدى تعليم المسيح ولم يثبت فيه، فليس الله من نصيبه. أما من يثبت في هذا التعليم، فله الآب والابن معا."], [10, "إن جاءكم أحد بغير هذا التعليم، فلا تستقبلوه في بيتكم، ولا تبادلوه التحية."], [11, "لأن من يسلم عليه، يشاركه في أعماله الشريرة."]]}, {"l": "Rev 3:11", "n": "", "vs": [[11, "إني آت سريعا، فتمسك بما عندك، لئلا يسلب أحد إكليلك."]]}, {"l": "Rev 12:9", "n": "", "vs": [[9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."]]}, {"l": "Rev 13:8", "n": "", "vs": [[8, "فيسجد للوحش جميع سكان الأرض الذين لم تكتب أسماؤهم منذ تأسيس العالم في سجل الحياة للحمل الذي ذبح."]]}, {"l": "Rev 13:14", "n": "", "vs": [[14, "فخدع سكان الأرض بالآيات التي كان يقوم بها في حضور الوحش الأول. وأمر سكان الأرض أن يقيموا تمثالا للوحش الأول الذي كان قد جرح جرحا مميتا ولكنه عاش!"]]}], "kwAr": "لا يحرمكم أحد", "noteAr": ""}, {"kw": "beguile you", "raw": "or, judge against you, Col_2:16", "note": "or, judge against you, Col_2:16", "refs": [{"l": "Col 2:16", "n": "", "vs": [[16, "فلا يحكم عليكم أحد في قضية الأكل والشرب، أو في القضايا المتعلقة بالأعياد ورؤوس الشهور والسبوت؛"]]}], "kwAr": "من جائزتكم", "noteAr": "أو: يحكم عليكم (يحرمكم الجائزة)."}, {"kw": "in a voluntary humility", "raw": "Gr. being a voluntary in humility, Col_2:23; Isa_57:9", "note": "Gr. being a voluntary in humility, Col_2:23; Isa_57:9", "refs": [{"l": "Col 2:23", "n": "", "vs": [[23, "لها مظاهر الحكمة لما فيها من إفراط في العبادة المصطنعة، وإذلال للذات، وقهر للجسد؛ أمور لا قيمة لها، وما هي إلا لإرضاء الميول البشرية."]]}, {"l": "Isa 57:9", "n": "", "vs": [[9, "ارتحلتم إلى ملوك محملين بالدهن، وبكثرة الأطياب، وأرسلتم سفراءكم إلى أرض بعيدة، وانحدرتم حتى إلى الهاوية."]]}], "kwAr": "إظهار التواضع", "noteAr": "في اليونانية: راغبًا في التواضع."}, {"kw": "worshipping", "raw": "Dan_11:38 *Heb: Rom_1:25; 1Co_8:5, 1Co_8:6; 1Ti_4:1 *Gr: Rev_19:10, Rev_22:8, Rev_22:9", "note": "", "refs": [{"l": "Dan 11:38", "n": "*Heb:", "vs": [[38, "إنما يكرم إله الحصون بدلا منهم، وهو إله لم يعرفه آباؤه، ويكرمه بالذهب والفضة والحجارة الكريمة والنفائس."]]}, {"l": "Rom 1:25", "n": "", "vs": [[25, "إذ قد استبدلوا بحق الله ما هو باطل، فاتقوا المخلوق وعبدوه بدل الخالق، المبارك إلى الأبد. آمين!"]]}, {"l": "1Co 8:5", "n": "", "vs": [[5, "حتى لو كانت الآلهة المزعومة موجودة في السماء أو على الأرض وما أكثر تلك الآلهة والأرباب!"]]}, {"l": "1Co 8:6", "n": "", "vs": [[6, "فليس عندنا نحن إلا إله واحد هو الآب الذي منه كل شيء، ونحن له؛ ورب واحد هو يسوع المسيح الذي به كل شيء ونحن به."]]}, {"l": "1Ti 4:1", "n": "*Gr:", "vs": [[1, "إلا أن الروح يعلن صراحة أن قوما في الأزمنة الأخيرة سوف يرتدون عن الإيمان، منساقين وراء أرواح مضللة وتعاليم شيطانية،"]]}, {"l": "Rev 19:10", "n": "", "vs": [[10, "فجثوت عند قدميه لأسجد له، فقال لي: «لا تفعل! إني عبد لله، مثلك ومثل إخوتك المؤمنين الذين لديهم الشهادة المختصة بيسوع: لله اسجد! فإن الشهادة المختصة بيسوع هي روح النبوءة»."]]}, {"l": "Rev 22:8", "n": "", "vs": [[8, "أنا يوحنا رأيت وسمعت هذه الأمور كلها. وبعدما سمعت ورأيت كل ما حدث، ارتميت على قدمي الملاك الذي أراني إياها لأسجد له."]]}, {"l": "Rev 22:9", "n": "", "vs": [[9, "فقال لي: «لا تفعل! إنني عبد مثلك ومثل إخوتك الأنبياء، ومثل الذين يراعون ما جاء في هذا الكتاب. لله اسجد!»"]]}], "kwAr": "والتعبد للملائكة", "noteAr": ""}, {"kw": "intruding", "raw": "Deu_29:29; Job_38:2; Psa_138:1, Psa_138:2; Eze_13:3; 1Ti_1:7", "note": "", "refs": [{"l": "Deu 29:29", "n": "", "vs": [[29, "إن السرائر للرب إلهنا، أما الوصايا المعلنة فهي لنا ولأبنائنا إلى الأبد، لنعمل بجميع كلمات هذه الشريعة."]]}, {"l": "Job 38:2", "n": "", "vs": [[2, "«من ذا الذي يظلم القضاء بكلام مجرد من المعرفة؟"]]}, {"l": "Psa 138:1", "n": "", "vs": [[1, "أسبحك من كل قلبي، وأشدو لك أمام الملائكة."]]}, {"l": "Psa 138:2", "n": "", "vs": [[2, "أسجد في هيكل قدسك، وأحمد اسمك من أجل رحمتك وحقك، لأنك عظمت كلمتك واسمك فوق كل شيء"]]}, {"l": "Eze 13:3", "n": "", "vs": [[3, "ويل للأنبياء الحمقى الضالين وراء أرواحهم من غير أن يروا شيئا."]]}, {"l": "1Ti 1:7", "n": "", "vs": [[7, "راغبين في أن يكونوا أساتذة في الشريعة، وهم لا يفهمون ما يقولون ولا ما يقررون!"]]}], "kwAr": "داخلا في رؤى يتوهمها", "noteAr": ""}, {"kw": "vainly", "raw": "Col_2:8; 1Co_4:18, 1Co_8:1, 1Co_13:4", "note": "", "refs": [{"l": "Col 2:8", "n": "", "vs": [[8, "احذروا أن يوقعكم أحد فريسة بالفلسفة والغرور الباطل، عملا بتقاليد الناس ومباديء العالم؛ مما لا يوافق المسيح."]]}, {"l": "1Co 4:18", "n": "", "vs": [[18, "فإن بعضا منكم ظنوا أني لن آتي إليكم فانتفخوا تكبرا!"]]}, {"l": "1Co 8:1", "n": "", "vs": [[1, "وأما فيما يتعلق بالذبائح المقدمة للأصنام، فنعلم أن المعرفة لجميعنا. غير أن المعرفة تنفخ تكبرا، ولكن المحبة تبني. فمن ظن أنه يعرف شيئا،"]]}, {"l": "1Co 13:4", "n": "", "vs": [[4, "المحبة تصبر طويلا؛ وهي لطيفة. المحبة لا تحسد. المحبة لا تتفاخر ولا تتكبر."]]}], "kwAr": "وقد نفخه باطلا", "noteAr": ""}, {"kw": "fleshly", "raw": "Rom_8:6-8; 1Co_3:3; 2Co_12:20; Gal_5:19, Gal_5:20; Jam_3:14-16, Jam_4:1-6", "note": "", "refs": [{"l": "Rom 8:6-8", "n": "", "vs": [[6, "فاهتمام الجسد هو موت؛ وأما اهتمام الروح فهو حياة وسلام."], [7, "لأن اهتمام الجسد هو عداوة لله، إذ إنه لا يخضع لناموس الله، بل لا يستطيع ذلك."], [8, "فالذين هم تحت سلطة الجسد لا يستطيعون أن يرضوا الله ."]]}, {"l": "1Co 3:3", "n": "", "vs": [[3, "فإنكم مازلتم جسديين. فمادام بينكم حسد وخصام (وانقسام)، أفلا تكونون جسديين وتسلكون وفقا للبشر؟"]]}, {"l": "2Co 12:20", "n": "", "vs": [[20, "فإني أخشى أن آتي إليكم فأجدكم في حالة لا أريدها وتجدوني في حالة لا تريدونها! أي أن يكون بينكم كثير من النزاع والحسد والحقد والتحزب والتجريح والنميمة والتكبر والبلبلة."]]}, {"l": "Gal 5:19", "n": "", "vs": [[19, "أما أعمال الجسد فظاهرة، وهي: الزنى والنجاسة والدعارة،"]]}, {"l": "Gal 5:20", "n": "", "vs": [[20, "وعبادة الأصنام والسحر، والعداوة والنزاع والغيرة والغضب، والتحزب والانقسام والتعصب،"]]}, {"l": "Jam 3:14-16", "n": "", "vs": [[14, "أما إن كانت قلوبكم مملوءة بمرارة الحسد وبالتحزب، فلا تفتخروا بحكمتكم، ولا تنكروا الحق."], [15, "إن هذه الحكمة التي تدعونها ليست نازلة من عند الله، بل هي «حكمة» أرضية بشرية شيطانية."], [16, "فحيث تكون مرارة الحسد والتحزب، ينتشر الخلاف والفوضى وجميع الشرور."]]}, {"l": "Jam 4:1-6", "n": "", "vs": [[1, "من أين النزاع والخصام بينكم؟ أليس من لذاتكم تلك المتصارعة في أعضائكم؟"], [2, "فأنتم ترغبون في امتلاك ما لا يخصكم، لكن ذلك لا يتحقق لكم، فتقتلون، وتحسدون، ولا تتمكنون من بلوغ غايتكم. وهكذا تتخاصمون وتتصارعون! إنكم لا تمتلكون ما تريدونه، لأنكم لا تطلبونه من الله."], [3, "وإذا طلبتم منه شيئا، فإنكم لا تحصلون عليه: لأنكم تطلبون بدافع شرير، إذ تنوون أن تستهلكوا ما تنالونه لإشباع شهواتكم فقط."], [4, "أيها الخونة! ألستم تعلمون أن مصادقة العالم هي معاداة لله؟ فالذي يريد أن يصادق العالم، يجعل نفسه عدوا لله."], [5, "أتظنون أن الكتاب يتكلم عبثا! هل الروح الذي حل في داخلنا يغار عن حسد؟"], [6, "لا، بل إنه يجود علينا بنعمة أعظم. لذلك يقول الكتاب: «إن الله يقاوم المتكبرين، ولكنه يعطي المتواضعين نعمة»."]]}], "kwAr": "ذهنه الجسدي", "noteAr": ""}], "arS": [["لا ", []], ["يحرمكم", ["G2603"]], [" ", []], ["أحد", ["G3367"]], [" من جائزتكم، بحملكم على ما ", []], ["يرغب", ["G2309"]], [" فيه من إظهار ", []], ["التواضع", ["G5012"]], [" ", []], ["والتعبد", ["G2356"]], [" ", []], ["للملائكة", ["G32"]], ["، ", []], ["داخلا", ["G1687"]], [" في رؤى يتوهمها، وقد ", []], ["نفخه", ["G5448"]], [" ", []], ["باطلا", ["G1500"]], [" ", []], ["ذهنه", ["G3563"]], [" ", []], ["الجسدي", ["G4561"]], ["،", []]]}, {"c": 2, "v": 19, "text": "وهو غير ممسك بالرأس الذي منه يتلقى الجسد كله غذاءه وتماسكه بالمفاصل والأوصال، فينمو النمو الذي يمنحه الله .", "groups": [{"kw": "not", "raw": "Col_2:6-9, Col_1:18; Gal_1:6-9, Gal_5:2-4; 1Ti_2:4-6", "note": "", "refs": [{"l": "Col 2:6-9", "n": "", "vs": [[6, "فمثلما قبلتم المسيح يسوع الرب، ففيه اسلكوا"], [7, "وأنتم متأصلون ومبنيون فيه وراسخون في الإيمان الموافق لما تعلمتم وفائضون بالشكر."], [8, "احذروا أن يوقعكم أحد فريسة بالفلسفة والغرور الباطل، عملا بتقاليد الناس ومباديء العالم؛ مما لا يوافق المسيح."], [9, "فإنه فيه، جسديا، يحل الله بكل ملئه،"]]}, {"l": "Col 1:18", "n": "", "vs": [[18, "وهو رأس الجسد، أي الكنيسة؛ هو البداءة وبكر القائمين من بين الأموات، ليكون له المقام الأول في كل شيء."]]}, {"l": "Gal 1:6-9", "n": "", "vs": [[6, "عجبا! كيف تتحولون بمثل هذه السرعة عن الذي دعاكم بنعمة المسيح، وتنصرفون إلى إنجيل غريب؟"], [7, "لا أعني أن هنالك إنجيلا آخر، بل إنما هنالك بعض (المعلمين) الذين يثيرون البلبلة بينكم، راغبين في تحوير إنجيل المسيح."], [8, "ولكن، حتى لو بشرناكم نحن، أو بشركم ملاك من السماء، بغير الإنجيل الذي بشرناكم به، فليكن ملعونا!"], [9, "وكما سبق أن قلنا، أكر ر القول الآن أيضا: إن كان أحد يبشركم بإنجيل غير الذي قبلتموه، فليكن ملعونا!"]]}, {"l": "Gal 5:2-4", "n": "", "vs": [[2, "ها أنا بولس أقول لكم: إن ختنتم، لا ينفعكم المسيح شيئا."], [3, "وأشهد مرة أخرى لكل مختون بأنه ملتزم أن يعمل بالشريعة كلها."], [4, "يامن تريدون التبرير عن طريق الشريعة، قد حرمتم المسيح وسقطتم من النعمة!"]]}, {"l": "1Ti 2:4-6", "n": "", "vs": [[4, "فهو يريد لجميع الناس أن يخلصوا، ويقبلوا إلى معرفة الحق بالتمام:"], [5, "فإن الله واحد، والوسيط بين الله والناس واحد، وهو الإنسان المسيح يسوع،"], [6, "الذي بذل نفسه فدية عوضا عن الجميع. هذه شهادة تؤدى في أوقاتها الخاصة،"]]}], "kwAr": "غير ممسك بالرأس", "noteAr": ""}, {"kw": "all", "raw": "Eph_4:15, Eph_4:16", "note": "", "refs": [{"l": "Eph 4:15", "n": "", "vs": [[15, "بل نتمسك بالحق في المحبة، فننمو في كل شيء نحو من هو الرأس، أي المسيح."]]}, {"l": "Eph 4:16", "n": "", "vs": [[16, "فمنه يستمد الجسد كله تماسكه وترابطه بمساندة كل مفصل وفقا لمقدار العمل المخصص لكل جزء، لينشيء نموا يؤول إلى بنيان الجسد بنيانا ذاتيا في المحبة."]]}], "kwAr": "الجسد كله", "noteAr": ""}, {"kw": "by", "raw": "Job_19:9-12; Psa_139:15, Psa_139:16", "note": "", "refs": [{"l": "Job 19:9-12", "n": "", "vs": [[9, "جردني من مجدي ونزع تاجي عن رأسي."], [10, "هدمني من كل جهة، فتلاشيت، واستأصل مثل غرس رجائي."], [11, "أضرم علي غضبه وحسبني من أعدائه."], [12, "زحفت قواته دفعة واحدة ليمهدوا طريق حصار ضدي، وعسكروا حول خيمتي."]]}, {"l": "Psa 139:15", "n": "", "vs": [[15, "لم يخف عليك كياني عندما كونت في السر، وجبلت في أعماق الأرض."]]}, {"l": "Psa 139:16", "n": "", "vs": [[16, "رأتني عيناك وأنا مازلت جنينا؛ وقبل أن تخلق أعضائي كتبت في سفرك يوم تصورتها."]]}], "kwAr": "بالمفاصل والأوصال", "noteAr": ""}, {"kw": "nourishment", "raw": "Joh_15:4-6; Rom_11:17; Eph_5:29", "note": "", "refs": [{"l": "Joh 15:4-6", "n": "", "vs": [[4, "فاثبتوا في وأنا فيكم. كما أن الغصن لا يقدر أن ينتج ثمرا إلا إذا ثبت في الكرمة؛ فكذلك أنتم، إلا إذا ثبتم في."], [5, "أنا الكرمة وأنتم الأغصان. من يثبت في وأنا فيه، فذاك ينتج ثمرا كثيرا. فإنكم بمعزل عني لا تقدرون أن تفعلوا شيئا."], [6, "إن كان أحد لا يثبت في يطرح خارجا كالغصن فيجف؛ ثم تجمع الأغصان الجافة، وتطرح في النار فتحترق."]]}, {"l": "Rom 11:17", "n": "", "vs": [[17, "فإذا كانت بعض أغصان الزيتونة قد قطعت، ثم طعمت فيها وأنت من زيتونة برية، فصرت بذلك شريكا في أصل الزيتونة وغذائها،"]]}, {"l": "Eph 5:29", "n": "", "vs": [[29, "فلا أحد يبغض جسده البتة، بل يغذيه ويعتني به، كما يعامل المسيح أيضا الكنيسة."]]}], "kwAr": "غذاءه", "noteAr": ""}, {"kw": "knit", "raw": "Col_2:2; Joh_17:21; Act_4:32; Rom_12:4, Rom_12:5; 1Co_1:10, 1Co_10:16, 1Co_10:17, 12:12-27; Eph_4:3; Phi_1:27, Phi_2:2-5; 1Pe_3:8", "note": "", "refs": [{"l": "Col 2:2", "n": "", "vs": [[2, "بغرض أن تتشجع قلوبهم وتكون كلها متحدة في المحبة، لبلوغ الإدراك التام بكل غناه، لمعرفة سر الله، أي المسيح،"]]}, {"l": "Joh 17:21", "n": "", "vs": [[21, "ليكون الجميع واحدا؛ أيها الآب، كما أنك أنت في وأنا فيك، ليكونوا هم أيضا واحدا فينا، لكي يؤمن العالم أنك أنت أرسلتني."]]}, {"l": "Act 4:32", "n": "", "vs": [[32, "وكانت جماعة المؤمنين قلبا واحدا ونفسا واحدة، ولم يكن أحد يقول إن شيئا مما عنده هو له وحده، بل كان كل شيء عندهم مشتركا."]]}, {"l": "Rom 12:4", "n": "", "vs": [[4, "فكما أن لنا في جسد واحد أعضاء كثيرة، ولكن ليس لجميع هذه الأعضاء عمل واحد،"]]}, {"l": "Rom 12:5", "n": "", "vs": [[5, "فكذلك نحن الكثيرين جسد واحد في المسيح، وكلنا أعضاء بعضنا لبعض."]]}, {"l": "1Co 1:10", "n": "", "vs": [[10, "على أنني أيها الإخوة، أتوسل إليكم باسم ربنا يسوع المسيح أن يكون لجميعكم صوت واحد وأن لا يكون بينكم أي انقسام. وإنما كونوا جميعا موحدي الفكر والرأي."]]}, {"l": "1Co 10:16", "n": "", "vs": [[16, "أليست كأس البركة التي نباركها هي شركة دم المسيح؟ أو ليس رغيف الخبز الذي نكسره هو الاشتراك في جسد المسيح؟"]]}, {"l": "1Co 10:17", "n": "", "vs": [[17, "فإننا نحن الكثيرين رغيف واحد، أي جسد واحد، لأننا جميعا نشترك في الرغيف الواحد."]]}, {"l": "1Co 12:12-27", "n": "", "vs": [[12, "فكما أن الجسد واحد وله أعضاء كثيرة، ولكن أعضاء الجسد كلها تشكل جسما واحدا مع أنها كثيرة، فكذلك حال المسيح أيضا."], [13, "فإننا، بالروح الواحد، قد تعمدنا جميعا لنصير جسدا واحدا، سواء كنا يهودا أم يونانيين، عبيدا أم أحرارا، وقد سقينا جميعا الروح الواحد."], [14, "فليس الجسد عضوا واحدا بل مجموعة أعضاء."], [15, "فإن قالت الرجل: «لأني لست يدا، لست من الجسد!» فهل تصبح من خارج الجسد فعلا؟"], [16, "وإن قالت الأذن: «لأني لست عينا، لست من الجسد!» فهل تصبح من خارج الجسد فعلا؟"], [17, "فلو كان الجسد كله عينا، فكيف كنا نسمع؟ ولو كان كله أذنا، فكيف كنا نشم؟"], [18, "على أن الله قد رتب كلا من الأعضاء في الجسد كما أراد."], [19, "فلو كانت كلها عضوا واحدا، فكيف يتكون الجسد؟"], [20, "فالواقع أن الأعضاء كثيرة، والجسد واحد."], [21, "وهكذا، لا تستطيع العين أن تقول لليد: «أنا لا أحتاج إليك!» ولا الرأس أن تقول للرجلين: «أنا لا أحتاج إليكما!»،"], [22, "بل بالأحرى جدا، أعضاء الجسد التي تبدو أضعف الأعضاء هي ضرورية،"], [23, "وتلك التي نعتبرها أقل ما في الجسد كرامة، نكسوها بإكرام أوفر. والأعضاء غير اللائقة يكون لها لياقة أوفر؛"], [24, "أما اللائقة، فلا تحتاج إلى ذلك. ولكن الله أحكم صنع الجسد بجملته، معطيا كرامة أوفر لما تنقصه الكرامة،"], [25, "لكي لا يكون في الجسد انقسام بل يكون بين الأعضاء اهتمام واحد لمصلحة الجسد."], [26, "فحين يصيب الألم واحدا من الأعضاء، تشعر الأعضاء الباقية معه بالألم. وحين ينال واحد من الأعضاء إكراما، تفرح معه الأعضاء الباقية."], [27, "فالواقع أنكم أنتم جميعا جسد المسيح، وأعضاء فيه كل بمفرده."]]}, {"l": "Eph 4:3", "n": "", "vs": [[3, "مجتهدين أن تحافظوا على وحدة الروح برابطة الوفاق. فإنما هناك جسد واحد وروح واحد،"]]}, {"l": "Phi 1:27", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"]]}, {"l": "Phi 2:2-5", "n": "", "vs": [[2, "فتمموا فرحي بأن يكون لكم رأي واحد ومحبة واحدة ونفس واحدة وفكر واحد."], [3, "لا يكن بينكم شيء بروح التحزب والافتخار الباطل، بل بالتواضع ليعتبر كل واحد منكم غيره أفضل كثيرا من نفسه،"], [4, "مهتما لا بمصلحته الخاصة بل بمصالح الآخرين أيضا."], [5, "فليكن فيكم هذا الفكر الذي هو أيضا في المسيح يسوع."]]}, {"l": "1Pe 3:8", "n": "", "vs": [[8, "والخلاصة، كونوا جميعا متحدين في الرأي، متعاطفين بعضكم مع بعض، مبادلين أحدكم الآخر المحبة الأخوية، شفوقين، متواضعين."]]}], "kwAr": "وتماسكه", "noteAr": ""}, {"kw": "increaseth", "raw": "Col_1:10; 1Co_3:6; Eph_4:16; 1Th_3:12, 1Th_4:10; 2Th_1:3; 2Pe_3:18", "note": "", "refs": [{"l": "Col 1:10", "n": "", "vs": [[10, "لكي تسلكوا سلوكا لائقا بالرب ومرضيا في كل شيء، منتجين الثمر في كل عمل صالح ونامين في معرفة الله إلى التمام،"]]}, {"l": "1Co 3:6", "n": "", "vs": [[6, "أنا غرست وأبلوس سقى؛ ولكن الله أنمى."]]}, {"l": "Eph 4:16", "n": "", "vs": [[16, "فمنه يستمد الجسد كله تماسكه وترابطه بمساندة كل مفصل وفقا لمقدار العمل المخصص لكل جزء، لينشيء نموا يؤول إلى بنيان الجسد بنيانا ذاتيا في المحبة."]]}, {"l": "1Th 3:12", "n": "", "vs": [[12, "وليجعلكم الرب تنمون وتفيضون في المحبة لتحبوا بعضكم بعضا وجميع الناس كمحبتنا لكم،"]]}, {"l": "1Th 4:10", "n": "", "vs": [[10, "ولأنكم أيضا هكذا تعاملون جميع الإخوة في مقاطعة مقدونية كلها. وإنما نحرضكم، أيها الإخوة، أن تضاعفوا ذلك أكثر فأكثر،"]]}, {"l": "2Th 1:3", "n": "", "vs": [[3, "من واجبنا أن نشكر الله على الدوام لأجلكم أيها الإخوة. كما أن هذا حق: لأن إيمانكم ينمو نموا فائقا، ومحبة أحدكم للآخر تفيض بينكم جميعا."]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}], "kwAr": "فينمو النمو للموت."], [6, "أما الآن، فنحن قد تحررنا من الشريعة، إذ متنا بالنِّسبة لما كان يقيدنا، حتى نكون عبيدا يخدمون وفقا للنظام الروحي الجديد، لا للنظام الحرفي العتيق."]]}, {"l": "Gal 2:19", "n": "", "vs": [[19, "فإنني، بالشريعة، قد مت عن الشريعة، لكي أحيا لله."]]}, {"l": "Gal 2:20", "n": "", "vs": [[20, "مع المسيح صلبت، وفيما بعد لا أحيا أنا بل المسيح يحيا في. أما الحياة التي أحياها الآن في الجسد، فإنما أحياها بالإيمان في ابن الله، الذي أحبني وبذل نفسه عني."]]}, {"l": "Gal 6:14", "n": "", "vs": [[14, "أما أنا فحاشا لي أن أفتخر إلا بصليب ربنا يسوع المسيح، الذي به أصبح العالم بالنسبة لي مصلوبا، وأنا أصبحت بالنسبة له مصلوبا."]]}, {"l": "1Pe 4:1-3", "n": "", "vs": [[1, "فبما أن المسيح قد تحمل الآلام الجسمية لأجلكم، سلحوا أنفسكم بالاستعداد دائما لتحمل الآلام. فإن من يتحمل الآلام الجسمية، يكون قد قاطع الخطيئة."], [2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."], [3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}], "kwAr": "فمادمتم قد متم مع المسيح", "noteAr": ""}, {"kw": "from", "raw": "Col_2:8; Eph_2:15", "note": "", "refs": [{"l": "Col 2:8", "n": "", "vs": [[8, "احذروا أن يوقعكم أحد فريسة بالفلسفة والغرور الباطل، عملا بتقاليد الناس ومباديء العالم؛ مما لا يوافق المسيح."]]}, {"l": "Eph 2:15", "n": "", "vs": [[15, "أي العداء: إذ أبطل بجسده شريعة الوصايا ذات الفرائض، لكي يكون من الفريقين إنسانا واحدا جديدا، إذ أحل السلام بينهما،"]]}], "kwAr": "بالنسبة لمباديء العالم", "noteAr": ""}, {"kw": "rudiments", "raw": "or, elements", "note": "or, elements", "refs": [], "kwAr": "مباديء العالم", "noteAr": "أو: أركان (مبادئ)."}, {"kw": "living", "raw": "Joh_15:19, Joh_17:14-16; 2Co_10:3; Jam_4:4; 1Jo_5:19", "note": "", "refs": [{"l": "Joh 15:19", "n": "", "vs": [[19, "لو كنتم من أهل العالم، لكان العالم يحب أهله، ولكن لأنكم لستم من أهل العالم، بل إني اخترتكم من وسط العالم، لذلك يبغضكم العالم."]]}, {"l": "Joh 17:14-16", "n": "", "vs": [[14, " يد تلقنوه من الناس."]]}, {"l": "Isa 29:18", "n": "", "vs": [[18, "في ذلك اليوم يسمع الأصم أقوال الكتاب، وتبصر عيون المكفوفين من وراء الظلمة والكآبة."]]}, {"l": "Dan 11:37", "n": "", "vs": [[37, "ولن يبالي هذا الملك بآلهة آبائه ولا بمعبود النساء، ولا بأي وثن آخر إذ يتعظم على الكل."]]}, {"l": "Mat 15:3-9", "n": "", "vs": [[3, "فأجابهم «ولماذا تخالفون أنتم وصية الله من أجل المحافظة على تقاليدكم؟"], [4, "فقد أوصى الله قائلا: أكرم أباك وأمك. ومن أهان أباه أو أمه، فليكن الموت عقابا له."], [5, "ولكنكم أنتم تقولون: من قال لأبيه أو أمه: إن ما أعولك به قد قدمته قربانا للهيكل،"], [6, "فهو في حل من إكرام أبيه وأمه. وأنتم، بهذا، تلغون ما أوصى به الله ، محافظة على تقاليدكم."], [7, "أيها المراؤون! أحسن إشعياء إذ تنبأ عنكم فقال:"], [8, "هذا الشعب يكرمني بشفتيه، أما قلبه فبعيد عني جدا!"], [9, "إنما باطلا يعبدونني وهم يعلمون تعاليم ليست إلا وصايا الناس.»"]]}, {"l": "Mar 7:7-13", "n": "", "vs": [[7, "إنما باطلا يعبدونني وهم يعلمون تعاليم ليست إلا وصايا الناس !"], [8, "فقد أهملتم وصية الله وتمسكتم بتقليد الناس!»"], [9, "وقال لهم: «حقا أنكم رفضتم وصية الله لتحافظوا على تقليدكم أنتم!"], [10, "فإن موسى قال: أكرم أباك وأمك! وأيضا: من أهان أباه أو أمه، فليكن الموت عقابا له!"], [11, "ولكنكم أنتم تقولون: إذا قال أحد لأبيه أو أمه: إن ما كنت أعولك به قد جعلته قربانا، أي تقدمة (للهيكل)،"], [12, "فهو في حل من إعانة أبيه أو أمه!"], [13, "وهكذا تبطلون كلمة الله بتعليمكم التقليدي الذي تتناقلونه. وهناك أمور كثيرة مثل هذه تفعلونها! »"]]}, {"l": "Tit 1:14", "n": "", "vs": [[14, "لا يديرون عقولهم إلى خرافات يهودية ووصايا أناس تحولوا عن الحق بعيدا."]]}, {"l": "Rev 17:18", "n": "", "vs": [[18, "أما هذه المرأة التي رأيتها، فإنها ترمز إلى المدينة العظمى التي تحكم ملوك الأرض»."]]}], "kwAr": "وصايا البشر وتعاليمهم", "noteAr": ""}], "arS": [["وهذه أشياء ", []], ["تستهلك", ["G671"]], [" ", []], ["وتزول", ["G5356"]], [". فتلك الفرائض هي ", []], ["وصايا", ["G1778"]], [" ", []], ["البشر", ["G444"]], [" ", []], ["وتعاليمهم", ["G1319"]], [".", []]]}, {"c": 2, "v": 23, "text": "لها مظاهر الحكمة لما فيها من إفراط في ا "noteAr": ""}, {"kw": "neglecting", "raw": "or, punishing, or, not sparing, Eph_5:29", "note": "or, punishing, or, not sparing, Eph_5:29", "refs": [{"l": "Eph 5:29", "n": "", "vs": [[29, "فلا أحد يبغض جسده البتة، بل يغذيه ويعتني به، كما يعامل المسيح أيضا الكنيسة."]]}], "kwAr": "وقهر للجسد", "noteAr": "أو: معاقبة، أو: عدم إشفاق (على الجسد)."}], "arS": [["لها ", []], ["مظاهر", ["G3056"]], [" ", []], ["الحكمة", ["G4678"]], [" لما فيها من إفراط في ", []], ["العبادة المصطنعة", ["G1479"]], ["، ", []], ["وإذلال للذات", ["G5012"]], ["، ", []], ["وقهر", ["G857"]], [" ", []], ["للجسد", ["G4983"]], ["؛ أمور لا ", []], ["قيمة", ["G5092"]], [" لها، وما هي إلا ", []], ["لإرضاء", ["G4140"]], [" الميول ", []], ["البشرية", ["G4561"]], [".", []]]}, {"c": 3, "v": 1, "text": "فبما أنكم قد قمتم مع المسيح، فاسعوا إلى الأمور التي في العلى، حيث المسيح جالس عن يمين الله.", "groups": [{"kw": "risen", "raw": "Col_2:12, Col_2:13, Col_2:20; Rom_6:4, Rom_6:5, Rom_6:9-11; Gal_2:19, Gal_2:20; Eph_1:19, Eph_1:20, Eph_2:5, Eph_2:6", "note": "", "refs": [{"l": "Col 2:12", "n": "", "vs": [[12, "فقد دفنتم معه في المعمودية، وفيها أيضا أقمتم معه، عن طريق إيمانكم بقدرة الله الذي أقامه من بين الأموات."]]}, {"l": "Col 2:13", "n": "", "vs": [[13, "فأنتم، إذ كنتم أمواتا في الخطايا وعدم ختانكم الجسدي، أحياكم جميعا معه؛ مسامحا لنا جميعا بالخطايا كلها."]]}, {"l": "Col 2:20", "n": "", "vs": [[20, "فمادمتم قد متم مع المسيح بالنسبة لمباديء العالم، فلماذا، كما لو كنتم عائشين في العالم، تخضعون أنفسكم لفرائض مثل هذه:"]]}, {"l": "Rom 6:4", "n": "", "vs": [[4, "وبسبب ذلك دفنا معه بالمعمودية للموت، حتى كما أقيم المسيح من الأموات بمجد الآب، كذلك نسلك نحن أيضا في حياة جديدة."]]}, {"l": "Rom 6:5", "n": "", "vs": [[5, "فما دمنا قد اتحدنا به في ما يشبه موته، فإننا سنتحد به أيضا في قيامته."]]}, {"l": "Rom 6:9-11", "n": "", "vs": [[9, "لكوننا على يقين بأن المسيح، وقد أقيم من بين الأموات، لا يموت مرة ثانية، إذ ليس للموت سيادة عليه بعد."], [10, "لأنه بموته، قد مات لأجل الخطيئة مرة واحدة؛ وبحياته، يحيا لله."], [11, "فكذلك أنتم أيضا، احسبوا أنفسكم أمواتا بالنسبة للخطيئة وأحياء لله في المسيح يسوع."]]}, {"l": "Gal 2:19", "n": "", "vs": [[19, "فإنني، بالشريعة، قد مت عن الشريعة، لكي أحيا لله."]]}, {"l": "Gal 2:20", "n": "", "vs": [[20, "مع المسيح صلبت، وفيما بعد لا أحيا أنا بل المسيح يحيا في. أما الحياة التي أحياها الآن في الجسد، فإنما أحياها بالإيمان في ابن الله، الذي أحبني وبذل نفسه عني."]]}, {"l": "Eph 1:19", "n": "", "vs": [[19, "وما هي عظمة قدرته الفائقة المعلنة لنا نحن المؤمنين، بحسب عمل اقتدار قوته"]]}, {"l": "Eph 1:20", "n": "", "vs": [[20, "الذي عمله في المسيح، بإقامته له من بين الأموات. وقد أجلسه عن يمينه في الأماكن السماوية،"]]}, {"l": "Eph 2:5", "n": "", "vs": [[5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"]]}, {"l": "Eph 2:6", "n": "", "vs": [[6, "وأقامنا معه وأجلسنا معه في الأماكن السماوية في المسيح يسوع."]]}], "kwAr": "قد قمتم مع المسيح", "noteAr": ""}, {"kw": "seek", "raw": "Col_3:2; Psa_16:11, Psa_17:14, Psa_17:15, Psa_73:25, Psa_73:26; Pro_15:24; Mat_6:20,Mat_6:33; Luk_12:33; Rom_8:6; 2Co_4:18; Phi_3:20,Phi_3:21; Heb_11:13-16", "note": "", "refs": [{"l": "Col 3:2", "n": "", "vs": [[2, "احصروا اهتمامكم بالأمور التي في العلى، لا بالأمور الأرضية."]]}, {"l": "Psa 16:11", "n": "", "vs": [[11, "هديتني سبل الحياة: فإن ملء البهجة في حضرتك، وفي يمينك مسرات أبدية."]]}, {"l": "Psa 17:14", "n": "", "vs": [[14, "أنقذني بيدك يارب من الناس. من أهل الدنيا الذين نصيبهم هو في هذه الحياة. أنت تملأ بطونهم من خيراتك المخزونة، فيشبع أبناؤهم، ويورثون أولادهم ما يفضل عنهم."]]}, {"l": "Psa 17:15", "n": "", "vs": [[15, "أما أنا فبالبر أشاهد وجهك. أشبع، إذا استيقظت، من بهاء طلعتك."]]}, {"l": "Psa 73:25", "n": "", "vs": [[25, "من لي في السماء غيرك؟ ولست أبغي في الأرض أحدا معك."]]}, {"l": "Psa 73:26", "n": "", "vs": [[26, "إن جسدي وقلبي يفنيان، أما الله فهو صخرة قلبي ونصيبي إلى الدهر."]]}, {"l": "Pro 15:24", "n": "", "vs": [[24, "طريق الإنسان الحكيم ترتقي به صعودا نحو الحياة، لكي يتفادى الهاوية من تحت."]]}, {"l": "Mat 6:20", "n": "", "vs": [[20, "بل اكنزوا لكم كنوزا في السماء، حيث لا يفسدها سوس ولا ينقب عنها لصوص ولا يسرقون."]]}, {"l": "Mat 6:33", "n": "", "vs": [[33, "أما أنتم، فاطلبوا أولا ملكوت الله وبره، وهذه كلها تزاد لكم."]]}, {"l": "Luk 12:33", "n": "", "vs": [[33, "بيعوا ما تملكون وأعطوا صدقة، واجعلوا لكم أكياسا لا تبلى، كنزا في السماوات لا ينفد، حيث لا يقترب لص ولا يفسد سوس."]]}, {"l": "Rom 8:6", "n": "", "vs": [[6, "فاهتمام الجسد هو موت؛ وأما اهتمام الروح فهو حياة وسلام."]]}, {"l": "2Co 4:18", "n": "", "vs": [[18, "إذ نرفع أنظارنا عن الأمور المنظورة ونثبتها على الأمور غير المنظورة. فإن الأمور المنظورة إنما هي إلى حين؛ وأما غير المنظورة فهي أبدية."]]}, {"l": "Phi 3:20", "n": "", "vs": [[20, "أما نحن، فإن وطننا في السماوات التي منها ننتظر عودة مخلصنا الرب يسوع المسيح،"]]}, {"l": "Phi 3:21", "n": "", "vs": [[21, "الذي سيحول جسدنا الوضيع إلى صورة مطابقة لجسده المجيد، وفقا لعمل قدرته على إخضاع كل شيء لنفسه."]]}, {"l": "Heb 11:13-16", "n": "", "vs": [[13, "هؤلاء جميعا، حافظوا على إيمانهم إلى النهاية. وماتوا قبل أن تتحقق وعود الله لهم في أثناء حياتهم. ولكنهم رأوها من بعيد، وتوقعوا تحقيقها كاملة في المستقبل. وإذ آمنوا بتلك الوعود الإلهية اعترفوا بأنهم ليسوا إلا غرباء على الأرض يزورونها زيارة عابرة."], [14, "والذين يقولون ذلك، يوضحون أن عيونهم على وطنهم الحقيقي."], [15, "ولو كانوا يتذكرون الوطن الأرضي الذي هجروه، لاغتنموا الفرصة وعادوا إليه."], [16, "ولكن، لا ... فهم الآن يتطلعون إلى وطن أفضل، أي الوطن السماوي. بسبب إيمانهم هذا لا يستحي الله أن يدعى إلههم. فهو قد أعد لهم مدينة!"]]}], "kwAr": "فاسعوا إلى الأمور التي في العلى", "noteAr": ""}, {"kw": "where", "raw": "Psa_110:1; Mat_22:44, Mat_26:64; Mar_12:36, Mar_14:62, Mar_16:19; Luk_20:42, Luk_22:69; Act_2:34, Act_7:55; Rom_8:34; Eph_1:20, Eph_4:10; Heb_1:3, Heb_1:13, Heb_8:1, Heb_10:12, Heb_12:2; 1Pe_3:22", "note": "", "refs": [{"l": "Psa 110:1", "n": "", "vs": [[1, "قال الرب لربي: «اجلس عن يميني حتى أضع أعداءك موطئا لقدميك»."]]}, {"l": "Mat 22:44", "n": "", "vs": [[44, "قال الرب لربي: اجلس عن يميني حتى أضع أعداءك موطئا لقدميك؟"]]}, {"l": "Mat 26:64", "n": "", "vs": [[64, "فأجابه , "vs": [[2, "متطلعين دائما إلى يسوع: رائد إيماننا ومكمله. فهو قد تحمل الموت صلبا، هازئا بما في ذلك من عار، إذ كان ينظر إلى السرور الذي ينتظره، ثم جلس عن يمين عرش الله."]]}, {"l": "1Pe 3:22", "n": "", "vs": [[22, "الذي انطلق إلى السماء، وهو الآن جالس عن يمين الله؛ وقد جعلت الملائكة والسلطات والقوات (الروحية) خاضعة له!"]]}], "kwAr": "حيث المسيح جالس عن يمين الله", "noteAr": ""}], "arS": [["فبما أنكم قد ", []], ["قمتم", ["G4891"]], [" مع ", []], ["المسيح", ["G5547"]], ["، ", []], ["فاسعوا", ["G2212"]], [" إلى الأمور التي في ", []], ["العلى", ["G507"]], ["، ", []], ["حيث", ["G3757"]], [" ", []], ["المسيح", ["G5547"]], [" ", []], ["جالس", ["G2521"]], [" عن ", []], ["يمين", ["G1188"]], [" ", []], ["الله", ["G2316"]], [".", []]]}, {"c": 3, "v": 2, "text": "احصروا اهتمامكم بالأمور التي في العلى، لا بالأمور الأرضية.", "groups": [{"kw": "Set", "raw": "Col_3:1; 1Ch_22:19, 1Ch_29:3; Psa_62:10, Psa_91:14, Psa_119:36, Psa_119:37; Pro_23:5; Ecc_7:14; Mat_16:23; Rom_8:4-6; Phi_1:23; 1Jo_2:15-17", "note": "", "refs": [{"l": "Col 3:1", "n": "", "vs": [[1, "فبما أنكم قد قمتم مع المسيح، فاسعوا إلى الأمور التي في العلى، حيث المسيح جالس عن يمين الله."]]}, {"l": "1Ch 22:19", "n": "", "vs": [[19, "فاعقدوا العزم في قلوبكم ونفوسكم على طلب الرب إلهكم، وتعاونوا على بناء مقدس الرب الإله لتنقلوا تابوت عهد الرب وآنية قدس الله إلى الهيكل الذي يبنى لاسم الرب»."]]}, {"l": "1Ch 29:3", "n": "", "vs": [[3, "ولفرط سروري ببيت إلهي، فقد قدمت من مالي الخاص ذهبا وفضة، بالإضافة إلى كل ما أعددته للهيكل."]]}, {"l": "Psa 62:10", "n": "", "vs": [[10, "لا تتكلوا على الظلم ولا تتفاخروا بالسرقة. إن كثر الغنى فلا تعتمدوا عليه،"]]}, {"l": "Psa 91:14", "n": "", "vs": [[14, "قال الرب: أنجيه لأنه تعلق بي. أرفعه لأنه عرف اسمي."]]}, {"l": "Psa 119:36", "n": "", "vs": [[36, "اجتذب قلبي نحو شهاداتك بعيدا عن مطامع المال."]]}, {"l": "Psa 119:37", "n": "", "vs": [[37, "حول عيني عن رؤية الباطل، وفي طريقك أحيني."]]}, {"l": "Pro 23:5", "n": "", "vs": [[5, "ما تكاد تتألق عيناك حبورا به حتى يتبدد، إذ فجأة يصنع لنفسه أجنحة ويطير كالنسر محلقا نحو السماء."]]}, {"l": "Ecc 7:14", "n": "", "vs": [[14, "افرح في يوم السراء، واعتبر في يوم الضراء. إن الرب قد جعل السراء مع الضراء، لئلا يكتشف الإنسان شيئا مما يحدث بعد موته."]]}, {"l": "Mat 16:23", "n": "", "vs": [[23, "فالتفت يسوع إلى بطرس وقال له: «اغرب من أمامي ياشيطان! أنت عقبة أمامي، لأنك تفكر لا بأمور الله، بل بأمور الناس! »"]]}, {"l": "Rom 8:4-6", "n": "", "vs": [[4, "حتى يتم فينا البر الذي تسعى إليه الشريعة، فينا نحن السالكين لا بحسب الجسد بل بحسب الروح."], [5, "فإن الذين هم بحسب الجسد يهتمون بأمور الجسد، والذين هم بحسب الروح يهتمون بأمور الروح."], [6, "فاهتمام الجسد هو موت؛ وأما اهتمام الروح فهو حياة وسلام."]]}, {"l": "Phi 1:23", "n": "", "vs": [[23, "فأنا تحت ضغط من كليهما: إذ إني راغب في أن أرحل وأقيم مع المسيح، وهذا أفضل بكثير جدا؛"]]}, {"l": "1Jo 2:15-17", "n": "", "vs": [[15, "لا تحبوا العالم، ولا الأشياء التي في العالم. فالذي يحب العالم، لا تكون محبة الآب في قلبه."], [16, "لأن كل ما في العالم، من شهوات الجسد وشهوات العين وترف المعيشة، ليس من الآب، بل من العالم."], [17, "وسوف يزول العالم، وما فيه من شهوات أما الذي يعمل بإرادة الله، فيبقى إلى الأبد!"]]}], "kwAr": "احصروا", "noteAr": ""}, {"kw": "affection", "raw": "or, mind", "note": "or, mind", "refs": [], "kwAr": "اهتمامكم بالأمور التي في العلى", "noteAr": "أو: فكركم (اهتمامكم)."}, {"kw": "not", "raw": "Col_3:5; Psa_49:11-17; Mat_6:19; Luk_12:15, Luk_16:8, Luk_16:9, Luk_16:11, Luk_16:19-25; Phi_3:19; 1Jo_2:15", "note": "", "refs": [{"l": "Col 3:5", "n": "", "vs": [[5, "فأميتوا إذن أعضاءكم الأرضية: الزنى، النجاسة، جموح العاطفة، الشهوة الرديئة، والاشتهاء النهم الذي هو عبادة أصنام."]]}, {"l": "Psa 49:11-17", "n": "", "vs": [[11, "يتوهمون أن بيوتهم خالدة، وأن مساكنهم باقية من جيل إلى جيل، فأطلقوا أسماءهم على أراضيهم (تخليدا لذكرهم)."], [12, "ولكن الإنسان لا يخلد في أبهته. إنه يماثل البهائم التي تباد."], [13, "هذا هو مصير الجهال الواثقين بأنفسهم، ومصير أعقابهم الذين يستحسنون أقوالهم."], [14, "يساقون للموت كالأغنام، ويكون الموت راعيهم ويسود المستقيمون عليهم. تبلى صورتهم، وتصير الهاوية مسكنهم."], [15, "إنما الله يفتدي نفسي من قبضة الهاوية إذ يأخذني إليه."], [16, "لا تخش إذا اغتنى إنسان، وزاد مجد بيته."], [17, "فإنه عند موته لا يأخذ معه شيئا، ولا يلحق به مجده إلى قبره."]]}, {"l": "Mat 6:19", "n": "", "vs": [[19, "لا تكنزوا لكم كنوزا على الأرض، حيث يفسدها السوس والصدأ، وينقب عنها اللصوص ويسرقون."]]}, {"l": "Luk 12:15", "n": "", "vs": [[15, "وقال للجمع: «احذروا وتحفظوا من الطمع. فمتى كان الإنسان في سعة، لا تكون حياته في أمواله»."]]}, {"l": "Luk 16:8", "n": "", "vs": [[8, "فامتدح السيد وكيله الخائن لأنه تصرف بحكمة. فإن أبناء هذا العالم أحكم مع أهل جيلهم من أبناء النور."]]}, {"l": "Luk 16:9", "n": "", "vs": [[9, "وأقول لكم: اكسبوا لكم أصدقاء بمال الظلم، حتى إذا فني مالكم، تقبلون في المنازل الأبدية!"]]}, {"l": "Luk 16:11", "n": "", "vs": [[11, "فإن لم تكونوا أمناء في مال الظلم، فمن يأتمنكم على مال الحق؟"]]}, {"l": "Luk 16:19-25", "n": "", "vs": [[19, "كان هنالك إنسان غني، يلبس الأرجوان وناعم الثياب، ويقيم الولائم المترفة، متنعما كل يوم."], [20, "وكان إنسان مسكين اسمه لعازر، مطروحا عند بابه وهو مصاب بالقروح،"], [21, "يشتهي أن يشبع من الفتات المتساقط من مائدة الغني. حتى الكلاب كانت تأتاي وتلحس قروحه."], [22, "ومات المسكين، وحملته الملائكة إلى حضن إبراهيم. ثم مات الغني أيضا ودفن."], [23, "وإذ رفع عينيه وهو في الهاوية يتعذب، رأى إبراهيم من بعيد ولعازر في حضنه."], [24, "فنادى قائلا: ياأباي إبراهيم! ارحمني، وأرسل لعازر ليغمس طرف إصبعه في الماء ويبرد لساني: فإني معذب في هذا اللهيب."], [25, "ولكن إبراهيم قال: يابني، تذكر أنك نلت خيراتك كاملة في أثناء حياتك، ولعازر نال البلايا. ولكنه الآن يتعزى هنا، وأنت هناك تتعذب."]]}, {"l": "Phi 3:19", "n": "", "vs": [[19, "الذين مصيرهم الهلاك، وإلههم بطونهم، ومفخرتهم في عيبتهم، وفكرهم منصرف إلى الأمور الأرضية."]]}, {"l": "1Jo 2:15", "n": "", "vs": [[15, "لا تحبوا العالم، ولا الأشياء التي في العالم. فالذي يحب العالم، لا تكون محبة الآب في قلبه."]]}], "kwAr": "لا بالأمور الأرضية", "noteAr": ""}], "arS": [["احصروا اهتمامكم", ["G5426"]], [" بالأمور التي في ", []], ["العلى", ["G507"]], ["، لا بالأمور ", []], ["الأرضية", ["G1093"]], [".", []]]}, {"c": 3, "v": 3, "text": "فإنكم قد متم، وحياتكم مستورة مع المسيح في الله.", "groups": [{"kw": "are", "raw": "Col_2:20; Rom_6:2; Gal_2:20", "note": "", "refs": [{"l": "Col 2:20", "n": "", "vs": [[20, "فمادمتم قد متم مع المسيح بالنسبة لمباديء العالم، فلماذا، كما لو كنتم عائشين في العالم، تخضعون أنفسكم لفرائض مثل هذه:"]]}, {"l": "Rom 6:2", "n": "", "vs": [[2, "حاشا! فنحن الذين متنا بالنسبة للخطيئة، كيف نعيش بعد فيها؟"]]}, {"l": "Gal 2:20", "n": "", "vs": [[20, "مع المسيح صلبت، وفيما بعد لا أحيا أنا بل المسيح يحيا في. أما الحياة التي أحياها الآن في الجسد، فإنما أحياها بالإيمان في ابن الله، الذي أحبني وبذل نفسه عني."]]}], "kwAr": "فإنكم قد متم", "noteAr": ""}, {"kw": "your", "raw": "Col_3:4, Col_1:5; Joh_3:16, Joh_4:14, Joh_5:21, Joh_5:24, Joh_5:40, Joh_6:39, Joh_6:40, Joh_10:28-30, Joh_14:19; Rom_5:10,Rom_5:21, Rom_8:2, Rom_8:34-39; 1Co_15:45; 2Co_5:7; Heb_7:25; 1Pe_1:3-5", "note": "", "refs": [{"l": "Col 3:4", "n": "", "vs": [[4, "فعندما يظهر المسيح، وهو حياتنا، عندئذ تظهرون أنتم أيضا معه في المجد."]]}, {"l": "Col 1:5", "n": "", "vs": [[5, "بسبب الرجاء المحفوظ لكم في السماوات، الرجاء الذي سمعتم به سابقا في كلمة الحق التي في الإنجيل"]]}, {"l": "Joh 3:16", "n": "", "vs": [[16, "لأنه هكذا أحب الله العالم حتى بذل ابنه الوحيد، لكي لا يهلك كل من يؤمن به، بل تكون له الحياة الأبدية."]]}, {"l": "Joh 4:14", "n": "", "vs": [[14, "ولكن الذي يشرب من الماء الذي أعطيه أنا، لن يعطش بعد ذلك أبدا، بل إن ما أعطيه من ماء يصبح في داخله نبعا يفيض فيعطي حياة أبدية»."]]}, {"l": "Joh 5:21", "n": "", "vs": [[21, "فكما يقيم الآب الموتى ويحييهم، كذلك يحيي الابن من يشاء."]]}, {"l": "Joh 5:24", "n": "", "vs": [[24, "الحق الحق أقول لكم إن من يسمع كلامي ويؤمن بالذي أرسلني تكون له الحياة الأبدية، ولا يحاكم في اليوم الأخير، لأنه قد انتقل من الموت إلى الحياة."]]}, {"l": "Joh 5:40", "n": "", "vs": [[40, "ولكنكم ترفضون أن تأتوا إلي لتكون لكم الحياة."]]}, {"l": "Joh 6:39", "n": "", "vs": [[39, "ومشيئته هي أن لا أدع أحدا ممن وهبهم لي يهلك، بل أقيمه في اليوم الأخير."]]}, {"l": "Joh 6:40", "n": "", "vs": [[40, "نعم! إن مشيئة أبي هي أن كل من يرى الابن ويؤمن به تكون له الحياة الأبدية، وسأقيمه أنا في اليوم الأخير»."]]}, {"l": "Joh 10:28-30", "n": "", "vs": [[28, "وأعطيها حياة أبدية، فلا تهلك إلى الأبد، ولا ينتزعها أحد من يدي."], [29, "إن الآب الذي أعطاني إياها هو أعظم من الجميع، ولا يقدر أحد أن ينتزع من يد الآب شيئا."], [30, "أنا والآب واحد!»"]]}, {"l": "Joh 14:19", "n": "", "vs": [[19, "بعد قليل لا يراني العالم. أما أنتم فسوف ترونني. ولأني أنا حي، فأنتم أيضا ستحيون."]]}, {"l": "Rom 5:10", "n": "", "vs": [[10, "فإن كنا، ونحن أعداء، قد تصالحنا مع الله بموت ابنه، فكم بالأحرى نخلص بحياته ونحن مصالحون!"]]}, {"l": "Rom 5:21", "n": "", "vs": [[21, "حتى إنه كما ملكت الخطيئة بالموت، فكذلك أيضا تملك النعمة على أساس البر مؤدية إلى الحياة الأبدية بيسوع المسيح ربنا."]]}, {"l": "Rom 8:2", "n": "", "vs": [[2, "لأن ناموس روح الحياة في المسيح يسوع قد حررني من ناموس الخطيئة ومن الموت."]]}, {"l": "Rom 8:34-39", "n": "", "vs": [[34, "فمن ذا يدين؟ إنه المسيح يسوع هو الذي مات، بل بالأحرى قام، وهو أيضا عن يمين الله، وهو يشفع فينا أيضا."], [35, "فمن سيفصلنا عن محبة المسيح لنا؟ هل الشدة أم الضيق أم الاضطهاد أم الجوع أم العري أم الخطر أم السيف؟"], [36, "بل كما قد كتب: «إننا من أجلك نعاني الموت طول النهار. قد حسبنا كأننا غنم للذبح!»"], [37, "ولكننا، في جميع هذه الأمور، نحرز ما يفوق الانتصار على يد من أحبنا."], [38, "فإني لعلى يقين بأنه لا الموت ولا الحياة، ولا الملائكة ولا الرياسات، ولا الأمور الحاضرة ولا الآتية، ولا القوات،"], [39, "ولا الأعالي ولا الأعماق، ولا خليقة أخرى، تقدر أن تفصلنا عن محبة الله التي لنا في المسيح يسوع ربنا."]]}, {"l": "1Co 15:45", "n": "", "vs": [[45, "فهكذا أيضا قد كتب: «صار الإنسان الأول، آدم، نفسا حية» وأما آدم الأخير فهو روح باعث للحياة."]]}, {"l": "2Co 5:7", "n": "", "vs": [[7, "لأننا نسلك بالإيمان لا بالعيان."]]}, {"l": "Heb 7:25", "n": "", "vs": [[25, "وهو لذلك قادر دائما أن يحقق الخلاص الكامل للذين يتقربون به إلى الله. فهو، في حضرة الله، حي على الدوام ليتضرع من أجلهم ويحامي عنهم!"]]}, {"l": "1Pe 1:3-5", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"], [4, "وإرثا لا يفنى ولا يفسد ولا يزول،"], [5, "محفوظا لكم في السماوات. فإنكم محفوظون بقدرة الله العاملة من خلال إيمانكم، إلى أن تفوزوا بالخلاص النهائي المعد لكم والذي سوف يتجلى في الزمان الأخير."]]}], "kwAr": "وحياتكم", "noteAr": ""}, {"kw": "hid", "raw": "Col_2:3; Mat_11:25; 1Co_2:14; Phi_4:7; 1Pe_3:4; 1Jo_3:2; Rev_2:17", "note": "", "refs": [{"l": "Col 2:3", "n": "", "vs": [[3, "المخزونة فيه كنوز الحكمة والمعرفة كلها."]]}, {"l": "Mat 11:25", "n": "", "vs": [[25, "وفي ذلك الوقت، تكلم يسوع فقال: «أحمدك أيها الآب، رب السماء والأرض، لأنك حجبت هذه الأمور عن الحكماء والفهماء، وكشفتها للأطفال!"]]}, {"l": "1Co 2:14", "n": "", "vs": [[14, "غير أن الإنسان البشري لا يتقبل أمور روح الله إذ يعتبرها جهالة، ولا يستطيع أن يعرفها لأن تمييزها إنما يحتاج إلى حس روحي."]]}, {"l": "Phi 4:7", "n": "", "vs": [[7, "وسلام الله، الذي تعجز العقول عن إدراكه، يحرس قلوبكم وأفكاركم في المسيح يسوع."]]}, {"l": "1Pe 3:4", "n": "", "vs": [[4, "وإنما لتعتمد الزينة الداخلية، ليكون قلبها متزينا بروح الوداعة والهدوء. هذه هي الزينة التي لا تفنى، وهي غالية الثمن في نظر الله!"]]}, {"l": "1Jo 3:2", "n": "", "vs": [[2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"]]}, {"l": "Rev 2:17", "n": "", "vs": [[17, "من له أذن فليسمع ما يقوله الروح للكنائس! كل من سينتصر سأطعمه من المن الخفي، وأعطيه حجرا صغيرا أبيض حفر عليه اسم جديد لا يعرفه إلا الذي يأخذه!"]]}], "kwAr": "مستورة مع المسيح في الله", "noteAr": ""}], "arS": [["فإنكم قد ", []], ["متم", ["G599"]], ["، ", []], ["وحياتكم", ["G2222", "G5216"]], [" ", []], ["مستورة", ["G2928"]], [" مع ", []], ["المسيح", ["G5547"]], [" في ", []], ["الله", ["G2316"]], [".", []]]}, {"c": 3, "v": 4, "text": "فعندما يظهر المسيح، وهو حياتنا، عندئذ تظهرون أنتم أيضا معه في المجد.", "groups": [{"kw": "our", "raw": "Joh_11:25, Joh_14:6, Joh_20:31; Act_3:15; Gal_2:20; 2Ti_1:1; 1Jo_1:1, 1Jo_1:2, 1Jo_5:12; Rev_2:7, Rev_22:1, Rev_22:14", "note": "", "refs": [{"l": "Joh 11:25", "n": "", "vs": [[25, "فرد يسوع: «أنا هو القيامة والحياة. من آمن بي، وإن مات فسيحيا."]]}, {"l": "Joh 14:6", "n": "", "vs": [[6, "فأجابه يسوع: «أنا هو الطريق والحق والحياة. لا يأتي أحد إلى الآب إلا بي."]]}, {"l": "Joh 20:31", "n": "", "vs": [[31, "وأما هذه الآيات فقد دونت لتؤمنوا بأن يسوع هو المسيح ابن الله، ولكي تكون لكم حياة باسمه إذ تؤمنون."]]}, {"l": "Act 3:15", "n": "", "vs": [[15, "وقتلتم واهب الحياة. ولكن الله أقامه من بين الأموات ونحن شهود لذلك."]]}, {"l": "Gal 2:20", "n": "", "vs": [[20, "مع المسيح صلبت، وفيما بعد لا أحيا أنا بل المسيح يحيا في. أما الحياة التي أحياها الآن في الجسد، فإنما أحياها بالإيمان في ابن الله، الذي أحبني وبذل نفسه عني."]]}, {"l": "2Ti 1:1", "n": "", "vs": [[1, "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"]]}, {"l": "1Jo 1:1", "n": "", "vs": [[1, "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."]]}, {"l": "1Jo 1:2", "n": "", "vs": [[2, "فإن «الحياة» تجلت أمامنا. وبعدما رأيناها فعلا، نشهد لها الآن. وها نحن ننقل إليكم خبر هذه الحياة الأبدية التي كانت عند الآب ثم تجلت أمامنا!"]]}, {"l": "1Jo 5:12", "n": "", "vs": [[12, "فمن كان له ابن الله كانت له الحياة. ومن لم يكن له ابن الله، لم تكن له الحياة!"]]}, {"l": "Rev 2:7", "n": "", "vs": [[7, "من له أذنان فليسمع ما يقوله الروح للكنائس! كل من ينتصر سأطعمه من ثمر شجرة الحياة في فردوس الله."]]}, {"l": "Rev 22:1", "n": "", "vs": [[1, "ثم أراني الملاك نهر ماء الحياة صافيا كالبلور، ينبع من عرش الله والحمل"]]}, {"l": "Rev 22:14", "n": "", "vs": [[14, "طوبى للذين يغسلون ثيابهم، فلهم السلطة على شجرة الحياة، والحق في دخول المدينة من الأبواب!"]]}], "kwAr": "وهو حياتنا", "noteAr": ""}, {"kw": "appear", "raw": "1Ti_6:14; 2Ti_4:8; Tit_2:13; Heb_9:28; 1Pe_5:4; 1Jo_2:28, 1Jo_3:2", "note": "", "refs": [{"l": "1Ti 6:14", "n": "", "vs": [[14, "أن تحفظ الوصية خالية من العيب واللوم إلى يوم ظهور ربنا يسوع المسيح علنا."]]}, {"l": "2Ti 4:8", "n": "", "vs": [[8, "إنما ينتظرني الآن إكليل البر المحفوظ لي، والذي سيهبه لي الرب الديان العادل في ذلك اليوم؛ ولن يوهب لي وحدي، بل أيضا لجميع الذين يحبون ظهوره."]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "Heb 9:28", "n": "", "vs": [[28, "كذلك المسيح أيضا: مات مرة واحدة حاملا خطايا كثيرين، مقربا نفسه (لله) عوضا عنهم. ولا بد أن يعود إلى الظهور. لا ليعالج الخطايا، بل ليحقق الخلاص النهائي لجميع منتظريه!"]]}, {"l": "1Pe 5:4", "n": "", "vs": [[4, "وعندما يظهر رئيس الرعاة، تنالون إكليل المجد الذي لا يفنى."]]}, {"l": "1Jo 2:28", "n": "", "vs": [[28, "والآن، أيها الأولاد، كونوا ثابتين في المسيح، حتى تكون لنا نحن ثقة أمامه، ولا نخجل منه، عندما يعود."]]}, {"l": "1Jo 3:2", "n": "", "vs": [[2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"]]}], "kwAr": "فعندما يظهر المسيح", "noteAr": ""}, {"kw": "ye", "raw": "Psa_17:15, Psa_73:24; Isa_25:8, Isa_25:9; Mat_13:43; Joh_6:39, Joh_6:40, Joh_14:3, Joh_17:24; 1Co_15:43; 2Co_4:17; Phi_3:21; 1Th_4:17; 2Th_1:10-12; Jud_1:24", "note": "", "refs": [{"l": "Psa 17:15", "n": "", "vs": [[15, "أما أنا فبالبر أشاهد وجهك. أشبع، إذا استيقظت، من بهاء طلعتك."]]}, {"l": "Psa 73:24", "n": "", "vs": [[24, "تهديني بمشورتك، وبعد ذلك تأخذني إلى المجد."]]}, {"l": "Isa 25:8", "n": "", "vs": [[8, "ويبتلع الموت إلى الأبد، ويمسح السيد الرب الدموع المنهمرة على الوجوه، ويزيل عار شعبه من كل الأرض. هذا ما تكلم به الرب."]]}, {"l": "Isa 25:9", "n": "", "vs": [[9, "ويقولون في ذلك اليوم: «ها هو إلهنا الذي انتظرناه فخلصنا. هذا هو الرب الذي انتظرناه نبتهج ونفرح بخلاصه»."]]}, {"l": "Mat 13:43", "n": "", "vs": [[43, "عندئذ يضيء الأبرار كالشمس في ملكوت أبيهم. من له أذنان، فليسمع!"]]}, {"l": "Joh 6:39", "n": "", "vs": [[39, "ومشيئته هي أن لا أدع أحدا ممن وهبهم لي يهلك، بل أقيمه في اليوم الأخير."]]}, {"l": "Joh 6:40", "n": "", "vs": [[40, "نعم! إن مشيئة أبي هي أن كل من يرى الابن ويؤمن به تكون له الحياة الأبدية، وسأقيمه أنا في اليوم الأخير»."]]}, {"l": "Joh 14:3", "n": "", "vs": [[3, "وبعدما أذهب وأعد لكم المكان أعود إليكم وآخذكم إلي، لتكونوا حيث أكون أنا."]]}, {"l": "Joh 17:24", "n": "", "vs": [[24, "أيها الآب، أريد لهؤلاء الذين وهبتهم لي أن يكونوا معي حيث أكون أنا، فيشاهدوا مجدي الذي أعطيتني، لأنك أحببتني قبل إنشاء العالم."]]}, {"l": "1Co 15:43", "n": "", "vs": [[43, "يزرع مهانا، ويقام مجيدا، يزرع ضعيفا، ويقام قويا،"]]}, {"l": "2Co 4:17", "n": "", "vs": [[17, "ذلك لأن ما يضايقنا الآن من صعوبات بسيطة عابرة، ينتج لنا بمقدار لا يحد وزنة أبدية من المجد،"]]}, {"l": "Phi 3:21", "n": "", "vs": [[21, "الذي سيحول جسدنا الوضيع إلى صورة مطابقة لجسده المجيد، وفقا لعمل قدرته على إخضاع كل شيء لنفسه."]]}, {"l": "1Th 4:17", "n": "", "vs": [[17, "ثم إننا، نحن الباقين أحياء، نختطف جميعا في السحب للاجتماع بالرب في الهواء. وهكذا نبقى مع الرب على الدوام."]]}, {"l": "2Th 1:10-12", "n": "", "vs": [[10, "عندما يعود في ذلك اليوم ليتمجد في قديسيه ويكون موضع العجب عند جميع الذين آمنوا، وأنتم قد آمنتم بشهادتنا لكم!"], [11, "لأجل ذلك أيضا نصلي من أجلكم على الدوام، لكي يجعلكم إلهنا مؤهلين للدعوة الإلهية ويتم فيكم، بقدرته، كل ما يسره من الصلاح وفعالية الإيمان،"], [12, "حتى يتمجد اسم ربنا يسوع فيكم وتتمجدوا أنتم فيه وفقا لنعمة إلهنا وربنا يسوع المسيح."]]}, {"l": "Jud 1:24", "n": "", "vs": [[24, "وللقادر أن يحرسكم من السقوط حتى يوصلكم إلى المثول أمامه في المجد مبتهجين ولا عيب فيكم …"]]}], "kwAr": "تظهرون أنتم أيضا معه في المجد", "noteAr": ""}], "arS": [["فعندما ", []], ["يظهر", ["G5319"]], [" ", []], ["المسيح", ["G5547"]], ["، وهو ", []], ["حياتنا", ["G2222", "G2257"]], ["، عندئذ ", []], ["تظهرون", ["G5319"]], [" أنتم أيضا معه في ", []], ["المجد", ["G1391"]], [".", []]]}, {"c": 3, "v": 5, "text": "فأميتوا إذن أعضاءكم الأرضية: الزنى، النجاسة، جموح العاطفة، الشهوة الرديئة، والاشتهاء النهم الذي هو عبادة أصنام.", "groups": [{"kw": "Mortify", "raw": "Rom_6:6, Rom_8:13; Gal_5:24; Eph_5:3-6", "note": "", "refs": [{"l": "Rom 6:6", "n": "", "vs": [[6, "فنحن نعلم هذا: أن الإنسان العتيق فينا قد صلب معه لكي يبطل جسد الخطيئة فلا نبقى عبيدا للخطيئة فيما بعد."]]}, {"l": "Rom 8:13", "n": "", "vs": [[13, "لأنه إن عشتم بحسب الجسد، فإنكم ستموتون، ولكن إن كنتم بالروح تميتون أعمال الجسد، فستحيون."]]}, {"l": "Gal 5:24", "n": "", "vs": [[24, "ولكن الذين صاروا خاصة للمسيح، قد صلبوا الجسد مع الأهواء والشهوات."]]}, {"l": "Eph 5:3-6", "n": "", "vs": [[3, "أما الزنى، وكل نجاسة أو شهوة نهمة، فلا يذكر بينكم حتى اسمها، كما يليق بالقديسين."], [4, "وكذلك البذاءة والكلام السفيه والهزل، فهي غير لائقة. وإنما أحرى بكم أن تلهجوا بالشكر لله!"], [5, "فإنكم تعلمون هذا جيدا: أن كل زان أو نجس أو صاحب شهوة نهمة، ما هو إلا عابد أصنام، ليس له ميراث في ملكوت المسيح والله."], [6, "لا يخدعكم أحد بكلام باطل! فبسبب هذه الأمور يحل غضب الله على أبناء العصيان."]]}], "kwAr": "فأميتوا", "noteAr": ""}, {"kw": "members", "raw": "Rom_6:13, Rom_7:5, Rom_7:23; Jam_4:1", "note": "", "refs": [{"l": "Rom 6:13", "n": "", "vs": [[13, "ولا تقدموا أعضاءكم للخطيئة أسلحة للإثم، بل قدموا أنفسكم لله باعتباركم أقمتم من بين الأموات أحياء، وأعضاءكم لله أسلحة للبر."]]}, {"l": "Rom 7:5", "n": "", "vs": [[5, "فعندما كنا في الجسد، كانت أهواء الخطايا المعلنة في الشريعة عاملة في أعضائنا لكي نثمر للموت."]]}, {"l": "Rom 7:23", "n": "", "vs": [[23, "ولكنني أرى في أعضائي ناموسا آخر يحارب الشريعة التي يريدها عقلي، ويجعلني أسيرا لناموس الخطيئة الكائن في أعضائي."]]}, {"l": "Jam 4:1", "n": "", "vs": [[1, "من أين النزاع والخصام بينكم؟ أليس من لذاتكم تلك المتصارعة في أعضائكم؟"]]}], "kwAr": "أعضاءكم الأرضية", "noteAr": ""}, {"kw": "fornication", "raw": "Mat_15:19; Mar_7:21, Mar_7:22; Rom_1:29; 1Co_5:1, 1Co_5:10,1Co_5:11, 1Co_6:9, 1Co_6:13, 1Co_6:18; 2Co_12:21; Gal_5:19-21; Eph_5:3; 1Th_4:3; Heb_12:16, Heb_13:4; Rev_21:8, Rev_22:15", "note": "", "refs": [{"l": "Mat 15:19", "n": "", "vs": [[19, "فمن القلب تنبع الأفكار الشريرة، القتل، الزنى، الفسق، السرقة، شهادة الزور، التجديف."]]}, {"l": "Mar 7:21", "n": "", "vs": [[21, "فإنه من الداخل، من قلوب الناس، تنبع الأفكار الشريرة، الفسق، السرقة، القتل،"]]}, {"l": "Mar 7:22", "n": "", "vs": [[22, "الزنى، الطمع، الخبث، الخداع، العهارة، العين الشريرة، التجديف، الكبرياء، الحماقة"]]}, {"l": "Rom 1:29", "n": "", "vs": [[29, "إذ قد امتلأوا من كل إثم وشر وجشع وخبث، وشحنوا حسدا وقتلا وخصاما ومكرا وسوءا. وهم ثرثارون،"]]}, {"l": "1Co 5:1", "n": "", "vs": [[1, "قد شاع فعلا أن بينكم زنى. ومثل هذا الزنى لا يوجد حتى بين الأمم. ذلك بأن رجلا منكم يعاشر زوجة أبيه."]]}, {"l": "1Co 5:10", "n": "", "vs": [[10, "فلا أعني زناة هذا العالم أو الطماعين أو السراقين أو عابدي الأصنام على وجه الإطلاق، وإلا كنتم مضطرين إلى الخروج من المجتمع البشري!"]]}, {"l": "1Co 5:11", "n": "", "vs": [[11, "أما الآن فقد كتبت إليكم بأن لا تعاشروا من يسمى أخا إن كان زانيا أو طماعا أو عابد أصنام أو شتاما أو سكيرا أو سراقا. فمثل هذا لا تعاشروه ولا تجلسوا معه لتناول الطعام."]]}, {"l": "1Co 6:9", "n": "", "vs": [[9, "أما تعلمون أن الظالمين لن يرثوا ملكوت الله؟ لا تضلوا: فإن ملكوت الله لن يرثه الزناة ولا عابدو الأصنام ولا الفاسقون ولا المتخنثون ولا مضاجعو الذكور"]]}, {"l": "1Co 6:13", "n": "", "vs": [[13, "الطعام للبطن، والبطن للطعام؛ ولكن الله سيبيد هذا وذاك. غير أن الجسد ليس للزنى، بل للرب؛ والرب للجسد."]]}, {"l": "1Co 6:18", "n": "", "vs": [[18, "اهربوا من الزنا! فكل خطيئة يرتكبها الإنسان هي خارجة عن جسده، وأما من يرتكب الزنا، فهو يسيء إلى جسده الخاص."]]}, {"l": "2Co 12:21", "n": "", "vs": [[21, "وأخشى أن يجعلني إلهي ذليلا بينكم عند مجيئي إليكم مرة أخرى، فيكون حزني شديدا على كثيرين من الذين أخطأوا قبلا ولم يتوبوا عما ارتكبوا من دنس وزنى وفسق!"]]}, {"l": "Gal 5:19-21", "n": "", "vs": [[19, "أما أعمال الجسد فظاهرة، وهي: الزنى والنجاسة والدعارة،"], [20, "وعبادة الأصنام والسحر، والعداوة والنزاع والغيرة والغضب، والتحزب والانقسام والتعصب،"], [21, "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!"]]}, {"l": "Eph 5:3", "n": "", "vs": [[3, "أما الزنى، وكل نجاسة أو شهوة نهمة، فلا يذكر بينكم حتى اسمها، كما يليق بالقديسين."]]}, {"l": "1Th 4:3", "n": "", "vs": [[3, "فإن مشيئة الله هي هذه: قداستكم. وذلك بأن تمتنعوا عن الزنى،"]]}, {"l": "Heb 12:16", "n": "", "vs": [[16, "وحذار أن يكون بينكم زان أو مستهتر مثل عيسو الذي باع حقوقه بوصفه الابن البكر، لقاء أكلة واحدة."]]}, {"l": "Heb 13:4", "n": "", "vs": [[4, "حافظوا جميعا على كرامة الزواج، مبعدين النجاسة عن الفراش. فإن الله سوف يعاقب الذين ينغمسون في خطايا الدعارة والزنى."]]}, {"l": "Rev 21:8", "n": "", "vs": [[8, "أما الجبناء وغير المؤمنين، والفاسدون والقاتلون والزناة، والمتصلون بالشياطين وعبدة الأصنام وجميع الدجالين، فمصيرهم إلى البحيرة المتقدة بالنار والكبريت، الذي هو الموت الثاني»."]]}, {"l": "Rev 22:15", "n": "", "vs": [[15, "أما في خارج المدينة، فهنالك الكلاب والمتصلون بالشياطين، والزناة والقتلة، وعبدة الأصنام والدجالون ومحبو التدجيل!"]]}], "kwAr": "الزنى", "noteAr": ""}, {"kw": "inordinate", "raw": "Rom_1:26; 1Th_4:5 *Gr.", "note": "", "refs": [{"l": "Rom 1:26", "n": "", "vs": [[26, "لهذا السبب أسلمهم الله إلى الشهوات المخزية. فإن إناثهم تحولن عن استعمال أجسادهن بالطريقة الطبيعية إلى استعمالها بطريقة مخالفة للطبيعة."]]}, {"l": "1Th 4:5", "n": "*Gr.", "vs": [[5, "غير منساق للشهوة الجامحة كالوثنيين الذين لا يعرفون الله ،"]]}], "kwAr": "جموح العاطفة", "noteAr": ""}, {"kw": "evil", "raw": "Rom_7:7, Rom_7:8; 1Co_10:6-8; Eph_4:19; 1Pe_2:11", "note": "", "refs": [{"l": "Rom 7:7", "n": "", "vs": [[7, "إذن، ماذا نقول؟ هل الشريعة خطيئة؟ حاشا! ولكني ما عرفت الخطيئة إلا بالشريعة. فما كنت لأعرف الشهوة لولا قول الشريعة: «لا تشته!»"]]}, {"l": "Rom 7:8", "n": "", "vs": [[8, "ولكن الخطيئة استغلت هذه الوصية فأثارت في كل شهوة. فإن الخطيئة، لولا الشريعة، ميتة."]]}, {"l": "1Co 10:6-8", "n": "", "vs": [[6, "وإنما حدثت هذه الأمور لتكون مثالا لنا، حتى لا نشتهي أمورا شريرة كما اشتهى أولئك."], [7, "فلا تكونوا عابدين للأصنام كما كان بعضهم، كما قد كتب: «جلس الشعب للأكل والشرب، ثم قاموا للرقص واللهو»."], [8, "ولا نرتكب الزنا كما فعل بعضهم، فسقط في يوم واحد ثلاثة وعشرون ألفا."]]}, {"l": "Eph 4:19", "n": "", "vs": [[19, "فهؤلاء، إذ طرحوا جانبا كل إحساس، استسلموا للإباحية ليرتكبوا كل نجاسة بشهوة نهمة لا ترتوي."]]}, {"l": "1Pe 2:11", "n": "", "vs": [[11, "أيها الأحباء، ما أنتم إلا غرباء تزورون الأرض زيارة عابرة. لذلك أطلب إليكم أن تبتعدوا عن الشهوات الجسدية التي تصارع النفس."]]}], "kwAr": "الشهوة الرديئة", "noteAr": ""}, {"kw": "covetousness", "raw": "1Co_6:10; Gal_5:19-21; Eph_5:3, Eph_5:5", "note": "", "refs": [{"l": "1Co 6:10", "n": "", "vs": [[10, "ولا السراقون ولا الطماعون ولا السكيرون ولا الشتامون ولا المغتصبون."]]}, {"l": "Gal 5:19-21", "n": "", "vs": [[19, "أما أعمال الجسد فظاهرة، وهي: الزنى والنجاسة والدعارة،"], [20, "وعبادة الأصنام والسحر، والعداوة والنزاع والغيرة والغضب، والتحزب والانقسام والتعصب،"], [21, "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!"]]}, {"l": "Eph 5:3", "n": "", "vs": [[3, "أما الزنى، وكل نجاسة أو شهوة نهمة، فلا يذكر بينكم حتى اسمها، كما يليق بالقديسين."]]}, {"l": "Eph 5:5", "n": "", "vs": [[5, "فإنكم تعلمون هذا جيدا: أن كل زان أو نجس أو صاحب شهوة نهمة، ما هو إلا عابد أصنام، ليس له ميراث في ملكوت المسيح والله."]]}], "kwAr": "والاشتهاء النهم", "noteAr": ""}], "arS": [["فأميتوا", ["G3499"]], [" إذن ", []], ["أعضاءكم", ["G3196"]], [" ", []], ["الأرضية", ["G1093"]], [": ", []], ["الزنى", ["G4202"]], ["، ", []], ["النجاسة", ["G167"]], ["، ", []], ["جموح العاطفة", ["G3806"]], ["، ", []], ["الشهوة", ["G1939"]], [" ", []], ["الرديئة", ["G2556"]], ["، ", []], ["والاشتهاء النهم", ["G4124"]], [" الذي هو ", []], ["عبادة أصنام", ["G1495"]], [".", []]]}, {"c": 3, "v": 6, "text": "فبسبب هذه الخطايا ينزل غضب الله،", "groups": [{"kw": "which", "raw": "Rom_1:18; Eph_5:6; Rev_22:15", "note": "", "refs": [{"l": "Rom 1:18", "n": "", "vs": [[18, "فإنه قد أعلن غضب الله من السماء على جميع ما يفعله الناس من عصيان وإثم فيحجبون الحق بالإثم."]]}, {"l": "Eph 5:6", "n": "", "vs": [[6, "لا يخدعكم أحد بكلام باطل! فبسبب هذه الأمور يحل غضب الله على أبناء العصيان."]]}, {"l": "Rev 22:15", "n": "", "vs": [[15, "أما في خارج المدينة، فهنالك الكلاب والمتصلون بالشياطين، والزناة والقتلة، وعبدة الأصنام والدجالون ومحبو التدجيل!"]]}], "kwAr": "فبسبب
