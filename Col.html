": "", "vs": [[18, "أيها الأولاد الصغار، لا يجب أن تكون محبتنا مجرد ادعاء بالكلام واللسان، بل تكون محبة عملية حقة."]]}], "kwAr": "بالقول أو بالفعل", "noteAr": ""}, {"kw": "in the", "raw": "Mic_4:5; Mat_28:19; Act_4:30, Act_19:17; Phi_1:11; 1Th_4:1, 1Th_4:2", "note": "", "refs": [{"l": "Mic 4:5", "n": "", "vs": [[5, "فإن جميع الأمم تسلك باسم إلهها، أما نحن فنسلك باسم الرب إلهنا إلى أبد الآبدين."]]}, {"l": "Mat 28:19", "n": "", "vs": [[19, "فاذهبوا إذن، وتلمذوا جميع الأمم، وعمدوهم باسم الآب والابن والروح القدس؛"]]}, {"l": "Act 4:30", "n": "", "vs": [[30, "ومد يدك للشفاء، كي تجرى معجزات وعجائب باسم فتاك القدوس يسوع»."]]}, {"l": "Act 19:17", "n": "", "vs": [[17, "فانتشر خبر ذلك بين اليهود واليونانيين الساكنين في أفسس، فاستولت الرهبة على الجميع. وتمجد اسم الرب يسوع."]]}, {"l": "Phi 1:11", "n": "", "vs": [[11, "كاملين في ثمار البر الآتية بيسوع المسيح، لمجد الله وحمده."]]}, {"l": "1Th 4:1", "n": "", "vs": [[1, "وبعد، أيها الإخوة، فمثلما تلقيتم منا كيف يجب أن تسلكوا سلوكا يرضي الله ، وكما أنتم فاعلون، نرجو منكم ونحرضكم في الرب يسوع أن تضاعفوا تقدمكم في ذلك أكثر فأكثر."]]}, {"l": "1Th 4:2", "n": "", "vs": [[2, "فإنكم تعرفون الوصايا التي لقناكم إياها من قبل الرب يسوع."]]}], "kwAr": "باسم الرب يسوع", "noteAr": ""}, {"kw": "giving", "raw": "Col_1:12, Col_2:7; Rom_1:8; Eph_5:20; 1Th_5:18; Heb_13:15; 1Pe_2:5, 1Pe_2:9, 1Pe_4:11", "note": "", "refs": [{"l": "Col 1:12", "n": "", "vs": [[12, "رافعين الشكر بفرح للآب الذي جعلكم أهلا للاشتراك في ميراث القديسين في (ملكوت) النور،"]]}, {"l": "Col 2:7", "n": "", "vs": [[7, "وأنتم متأصلون ومبنيون فيه وراسخون في الإيمان الموافق لما تعلمتم وفائضون بالشكر."]]}, {"l": "Rom 1:8", "n": "", "vs": [[8, "بادىء بدء، أشكر إلهي بيسوع المسيح من أجلكم جميعا، لأن إيمانكم يذاع خبره في العالم كله."]]}, {"l": "Eph 5:20", "n": "", "vs": [[20, "رافعين الشكر كل حين وعلى كل شيء لله والآب، باسم ربنا يسوع المسيح؛"]]}, {"l": "1Th 5:18", "n": "", "vs": [[18, "ارفعوا الشكر في كل حال: فهذه هي مشيئة الله لكم في المسيح يسوع."]]}, {"l": "Heb 13:15", "n": "", "vs": [[15, "فبالمسيح، رئيس كهنتنا، لنقرب لله دائما ذبيحة الحمد والتسبيح، أي الثمار التي تنتجها أفواهنا المعترفة باسمه."]]}, {"l": "1Pe 2:5", "n": "", "vs": [[5, "إذن اتحدوا به كحجارة حية، مبنيين بيتا روحيا، تكونون فيه كهنة مقدسين تقدمون لله ذبائح روحية مقبولة لديه بفضل يسوع المسيح."]]}, {"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}, {"l": "1Pe 4:11", "n": "", "vs": [[11, "فمن يتكلم، عليه أن يتكلم بما يوافق أقوال الله؛ ومن يخدم، عليه أن يخدم بموجب القوة التي يمنحها الله . وذلك لكي يتمجد الله في كل شيء، بيسوع المسيح، له المجد والسلطة إلى أبد الآبدين. آمين!"]]}], "kwAr": "رافعين به الشكر", "noteAr": ""}, {"kw": "God", "raw": "Eph_1:17; Phi_2:11; 1Th_1:1; Heb_1:5; 1Jo_2:23", "note": "", "refs": [{"l": "Eph 1:17", "n": "", "vs": [[17, "حتى يهبكم إله ربنا يسوع المسيح، أبو المجد، روح حكمة وإلهام: لتعرفوه معرفة كاملة"]]}, {"l": "Phi 2:11", "n": "", "vs": [[11, "ولكي يعترف كل لسان بأن يسوع المسيح هو الرب، لمجد الله الآب."]]}, {"l": "1Th 1:1", "n": "", "vs": [[1, "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."]]}, {"l": "Heb 1:5", "n": "", "vs": [[5, "فلأي واحد من الملائكة قال الله مرة: «أنت ابني، أنا اليوم ولدتك!» أو قال أيضا: «أنا أكون له أبا، وهو يكون لي ابنا؟»"]]}, {"l": "1Jo 2:23", "n": "", "vs": [[23, "وكل من ينكر الابن، لا يكون الآب أيضا من نصيبه. ومن يعترف بالابن، فله الآب أيضا."]]}], "kwAr": "لله الآب", "noteAr": ""}], "arS": [["ومهما كان ما ", []], ["تعملونه", ["G4160"]], ["، ", []], ["بالقول", ["G3056"]], [" أو ", []], ["بالفعل", ["G2041"]], ["، فليجر ", []], ["كل شيء", ["G3956"]], [" ", []], ["باسم", ["G3686"]], [" ", []], ["الرب", ["G2962"]], [" ", []], ["يسوع", ["G2424"]], ["، رافعين به ", []], ["الشكر", ["G2168"]], [" ", []], ["لله", ["G2316"]], [" ", []], ["الآب", ["G3962"]], [".", []]]}, {"c": 3, "v": 18, "text": "أيتها الزوجات اخضعن لأزواجكن كما يليق (بالعيشة) في الرب.", "groups": [{"kw": "submit", "raw": "Gen_3:16; Est_1:20; 1Co_11:3, 1Co_14:34; Eph_5:22-24, Eph_5:33; 1Ti_2:12; Tit_2:4, Tit_2:5; 1Pe_3:1-6", "note": "", "refs": [{"l": "Gen 3:16", "n": "", "vs": [[16, "ثم قال للمرأة: «أكثر تكثيرا أوجاع مخاضك فتنجبين بالآلام أولادا، وإلى زوجك يكون اشتياقك وهو يتسلط عليك»."]]}, {"l": "Est 1:20", "n": "", "vs": [[20, "وهكذا يذيع أمر الملك الصادر عنه في كل أرجاء مملكته الشاسعة، فتعامل جميع النساء أزواجهن صغارا وكبارا باحترام»."]]}, {"l": "1Co 11:3", "n": "", "vs": [[3, "ولكني أريد أن تعلموا أن المسيح هو الرأس لكل رجل؛ أما رأس المرأة فهو الرجل، ورأس المسيح هو الله ."]]}, {"l": "1Co 14:34", "n": "", "vs": [[34, "لتصمت النساء في الكنائس، فليس مسموحا لهن أن يتكلمن، بل عليهن أن يكن خاضعات، على حد ما توصي به الشريعة أيضا."]]}, {"l": "Eph 5:22-24", "n": "", "vs": [[22, "أيتها الزوجات، اخضعن لأزواجكن، كما للرب."], [23, "فإن الزوج هو رأس الزوجة كما أن المسيح أيضا هو رأس الكنيسة (جسده)، وهو نفسه مخلص الجسد."], [24, "فكما أن الكنيسة قد أخضعت للمسيح، فكذلك الزوجات أيضا لأزواجهن، في كل شيء."]]}, {"l": "Eph 5:33", "n": "", "vs": [[33, "إنما أنتم أيضا، كل بمفرده، ليحب كل واحد منكم زوجته كنفسه. وأما الزوجة، فعليها أن تهاب زوجها."]]}, {"l": "1Ti 2:12", "n": "", "vs": [[12, "ولست أسمح للمرأة أن تعلم ولا تتسلط على الرجل. بل عليها أن تلزم السكوت."]]}, {"l": "Tit 2:4", "n": "", "vs": [[4, "لكي يدربن الشابات على أن يكن محبات لأزواجهن ولأولادهن،"]]}, {"l": "Tit 2:5", "n": "", "vs": [[5, "متعقلات، عفيفات، مهتمات بشؤون بيوتهن صالحات، خاضعات لأزواجهن، حتى لا يتكلم أحد بالسوء على كلمة الله."]]}, {"l": "1Pe 3:1-6", "n": "", "vs": [[1, "كذلك، أيتها الزوجات، اخضعن لأزواجكن. حتى وإن كان الزوج غير مؤمن بالكلمة، تجذبه زوجته إلى الإيمان، بتصرفها اللائق دون كلام،"], [2, "وذلك حين يلاحظ سلوكها الطاهر ووقارها."], [3, "وعلى المرأة ألا تعتمد الزينة الخارجية لإظهار جمالها، بضفر الشعر والتحلي بالذهب ولبس الثياب الفاخرة."], [4, "وإنما لتعتمد الزينة الداخلية، ليكون قلبها متزينا بروح الوداعة والهدوء. هذه هي الزينة التي لا تفنى، وهي غالية الثمن في نظر الله!"], [5, "وبها كانت تتزين النساء التقيات قديما، فكانت الواحدة منهن تتكل على الله وتخضع لزوجها."], [6, "فسارة، مثلا، كانت تطيع زوجها إبراهيم وتدعوه «سيدي». والمؤمنات اللواتي يقتدين بها، يثبتن أنهن بنات لها، إذ يتصرفن تصرفا صالحا، فلا يخفن أي تهديد."]]}], "kwAr": "اخضعن لأزواجكن", "noteAr": ""}, {"kw": "as", "raw": "Act_5:29; Eph_5:3, Eph_6:1", "note": "", "refs": [{"l": "Act 5:29", "n": "", "vs": [[29, "فأجاب بطرس والرسل: «ينبغي أن يطاع الله لا الناس!"]]}, {"l": "Eph 5:3", "n": "", "vs": [[3, "أما الزنى، وكل نجاسة أو شهوة نهمة، فلا يذكر بينكم حتى اسمها، كما يليق بالقديسين."]]}, {"l": "Eph 6:1", "n": "", "vs": [[1, "أيها الأولاد، أطيعوا والديكم في (رضى) الرب. فهذا هو الصواب:"]]}], "kwAr": "كما يليق في الرب", "noteAr": ""}], "arS": [["أيتها ", []], ["الزوجات", ["G1135"]], [" ", []], ["اخضعن", ["G5293"]], [" ", []], ["لأزواجكن", ["G435"]], [" كما ", []], ["يليق", ["G433"]], [" (بالعيشة) في ", []], ["الرب", ["G2962"]], [".", []]]}, {"c": 3, "v": 19, "text": "أيها الأزواج، أحبوا زوجاتكم، ولا تعاملوهن بقسوة.", "groups": [{"kw": "love", "raw": "Gen_2:23, Gen_2:24, Gen_24:67; Pro_5:18, Pro_5:19; Ecc_9:9; Mal_2:14-16; Luk_14:26; Eph_5:25, Eph_5:28, Eph_5:29, Eph_5:33; 1Pe_3:7", "note": "", "refs": [{"l": "Gen 2:23", "n": "", "vs": [[23, "فقال آدم: «هذه الآن عظم من عظامي ولحم من لحمي. فهي تدعى امرأة لأنها من امريء أخذت»."]]}, {"l": "Gen 2:24", "n": "", "vs": [[24, "لهذا، فإن الرجل يترك أباه وأمه ويلتصق بامرأته، ويصيران جسدا واحدا."]]}, {"l": "Gen 24:67", "n": "", "vs": [[67, "فأدخل إسحق رفقة إلى خيمة أمه سارة، وتزوجها وأحبها وتعزى بها بعد موت أمه."]]}, {"l": "Pro 5:18", "n": "", "vs": [[18, "ليكن ينبوع عفتك مباركا، واغتبط بامرأة شبابك،"]]}, {"l": "Pro 5:19", "n": "", "vs": [[19, "فتكون كالظبية المحبوبة والوعلة البهية، فترتوي من فيض فتنتها، وتظل دائما أسير حبها."]]}, {"l": "Ecc 9:9", "n": "", "vs": [[9, "تمتع طوال أيام حياتك الباطلة التي أعطاك إياها الرب تحت الشمس مع المرأة التي أحببتها، لأن ذلك هو حظك من الحياة ومن عناء تعبك الذي تكابده تحت الشمس."]]}, {"l": "Mal 2:14-16", "n": "", "vs": [[14, "وتتساءلون: لماذا؟ لأن الرب كان شاهدا على العهد المقطوع بينك وبين زوجة صباك التي غدرت بها، مع أنها شريكتك وامرأة عهدك."], [15, "ولكن لم يقدم على ذلك أي واحد مازالت فيه بقية من الروح. وماذا طلب هذا الواحد (أي إبراهيم)؟ ذرية الله. لهذا حافظوا على أرواحكم، ولا يغدر أحد بزوجة صباه."], [16, "ويقول الرب إله إسرائيل: إني أمقت الطلاق وأمقت أن يغطي الرجل زوجته بجوره، كما يتغطى هو بثوبه. لذلك احترسوا على أنفسكم ولا تنكثوا عهدا."]]}, {"l": "Luk 14:26", "n": "", "vs": [[26, "«إن جاء إلي أحد، ولم يبغض أباه وأمه وزوجته وأولاده وإخوته وأخواته، بل نفسه أيضا، فلا يمكنه أن يكون تلميذا لي."]]}, {"l": "Eph 5:25", "n": "", "vs": [[25, "أيها الأزواج، أحبوا زوجاتكم مثلما أحب المسيح الكنيسة وبذل نفسه لأجلها،"]]}, {"l": "Eph 5:28", "n": "", "vs": [[28, "على هذا المثال يجب على الأزواج أن يحبوا زوجاتهم كأجسادهم. إن من يحب زوجته، يحب نفسه."]]}, {"l": "Eph 5:29", "n": "", "vs": [[29, "فلا أحد يبغض جسده البتة، بل يغذيه ويعتني به، كما يعامل المسيح أيضا الكنيسة."]]}, {"l": "Eph 5:33", "n": "", "vs": [[33, "إنما أنتم أيضا، كل بمفرده، ليحب كل واحد منكم زوجته كنفسه. وأما الزوجة، فعليها أن تهاب زوجها."]]}, {"l": "1Pe 3:7", "n": "", "vs": [[7, "وأنتم، أيها الأزواج، إذ تساكنون زوجاتكم عالمين بأنهن أضعف منكم، أكرموهن باعتبارهن شريكات لكم في وراثة نعمة الحياة، لكي لا يعوق صلواتكم شيء."]]}], "kwAr": "أحبوا زوجاتكم", "noteAr": ""}, {"kw": "bitter", "raw": "Col_3:21; Rom_3:14; Eph_4:31; Jam_3:14", "note": "", "refs": [{"l": "Col 3:21", "n": "", "vs": [[21, "أيها الآباء، لا تثيروا غضب أولادكم لئلا يصيبهم الفشل."]]}, {"l": "Rom 3:14", "n": "", "vs": [[14, "أفواههم مملوءة لعنة ومرارة،"]]}, {"l": "Eph 4:31", "n": "", "vs": [[31, "انزعوا عنكم كل حقد ونقمة وغضب وصخب وسباب وكل شر."]]}, {"l": "Jam 3:14", "n": "", "vs": [[14, "أما إن كانت قلوبكم مملوءة بمرارة الحسد وبالتحزب، فلا تفتخروا بحكمتكم، ولا تنكروا الحق."]]}], "kwAr": "ولا تعاملوهن بقسوة", "noteAr": ""}], "arS": [["أيها ", []], ["الأزواج", ["G435"]], ["، ", []], ["أحبوا", ["G25"]], [" ", []], ["زوجاتكم", ["G1135"]], ["، ولا ", []], ["تعاملوهن بقسوة", ["G4087"]], [".", []]]}, {"c": 3, "v": 20, "text": "أيها الأولاد، أطيعوا والديكم في كل أمر، لأن ذلك مرضي في الرب.", "groups": [{"kw": "obey", "raw": "Gen_28:7; Exo_20:12; Lev_19:3; Deu_21:18-21, Deu_27:16; Pro_6:20, Pro_20:20; Pro_30:11, Pro_30:17; Eze_22:7; Mal_1:6; Mat_15:4-6, Mat_19:19; Eph_6:1-3", "note": "", "refs": [{"l": "Gen 28:7", "n": "", "vs": [[7, "وأن يعقوب أطاع والديه وارتحل إلى سهل أرام"]]}, {"l": "Exo 20:12", "n": "", "vs": [[12, "أكرم أباك وأمك لكي يطول عمرك في الأرض التي يهبك إياها الرب إلهك."]]}, {"l": "Lev 19:3", "n": "", "vs": [[3, "ليوقر كل إنسان أمه وأباه، وراعوا سبوتي. فأنا الرب إلهكم."]]}, {"l": "Deu 21:18-21", "n": "", "vs": [[18, "إن كان لرجل ابن عنيد متمرد، لا يطيع أمر أبيه ولا قول أمه، ويؤدبانه ولكن من غير جدوى."], [19, "فليقبض عليه والداه ويأتيا به إلى شيوخ مدينته في ساحة القضاء،"], [20, "ويقولان للشيوخ: ابننا هذا عنيد متمرد، لا يطيع قولنا، وهو مبذر سكير."], [21, "فيرجمه رجال المدينة جميعهم بالحجارة حتى يموت. وهكذا تستأصلون الشر من بينكم ويشيع الخبر بين الشعب كله فيخاف."]]}, {"l": "Deu 27:16", "n": "", "vs": [[16, "ملعون كل من يستخف بأبيه وأمه. ويقول جميع الشعب: آمين."]]}, {"l": "Pro 6:20", "n": "", "vs": [[20, "ياابني احفظ وصايا أبيك ولا تتجاهل شريعة أمك."]]}, {"l": "Pro 20:20", "n": "", "vs": [[20, "من يشتم أباه أو أمه يطفيء الرب سراج حياته في الظلمة الحالكة."]]}, {"l": "Pro 30:11", "n": "", "vs": [[11, "رب جيل يشتم أباه ولا يبارك أمه."]]}, {"l": "Pro 30:17", "n": "", "vs": [[17, "العين الساخرة بالأب، والتي تحتقر طاعة أمها، تقتلعها غربان الوادي، وتلتهمها فراخ النسور."]]}, {"l": "Eze 22:7", "n": "", "vs": [[7, "فيك استخفوا بأب وأم وجاروا في وسطك على الغريب، واضطهدوا اليتيم والأرملة،"]]}, {"l": "Mal 1:6", "n": "", "vs": [[6, "إن الابن يكرم أباه والعبد سيده. فإن كنت أنا حقا أبا فأين كرامتي؟ وإن كنت حقا سيدا فأين مهابتي؟ إن الرب القدير يقول لكم: أيها الكهنة المزدرون باسمي؛ فتسألون: كيف ازدرينا باسمك؟"]]}, {"l": "Mat 15:4-6", "n": "", "vs": [[4, "فقد أوصى الله قائلا: أكرم أباك وأمك. ومن أهان أباه أو أمه، فليكن الموت عقابا له."], [5, "ولكنكم أنتم تقولون: من قال لأبيه أو أمه: إن ما أعولك به قد قدمته قربانا للهيكل،"], [6, "فهو في حل من إكرام أبيه وأمه. وأنتم، بهذا، تلغون ما أوصى به الله ، محافظة على تقاليدكم."]]}, {"l": "Mat 19:19", "n": "", "vs": [[19, "أكرم أباك وأمك؛ وأحب قريبك كنفسك...»"]]}, {"l": "Eph 6:1-3", "n": "", "vs": [[1, "أيها الأولاد، أطيعوا والديكم في (رضى) الرب. فهذا هو الصواب:"], [2, "«أكرم أباك وأمك» وهذه أول وصية مرتبطة بوعد"], [3, "«لكي تلاقي الخير ويطول عمرك على الأرض!»"]]}], "kwAr": "أطيعوا والديكم", "noteAr": ""}, {"kw": "in", "raw": "Col_3:22; Eph_5:24; Tit_2:9", "note": "", "refs": [{"l": "Col 3:22", "n": "", "vs": [[22, "أيها العبيد، أطيعوا في كل أمر سادتكم البشريين، فلا تعملوا بجد فقط حين تكون عيونهم عليكم، كمن يحاول إرضاء الناس، بل بقلب صادق خائفين الرب."]]}, {"l": "Eph 5:24", "n": "", "vs": [[24, "فكما أن الكنيسة قد أخضعت للمسيح، فكذلك الزوجات أيضا لأزواجهن، في كل شيء."]]}, {"l": "Tit 2:9", "n": "", "vs": [[9, "وعلم العبيد أن يكونوا خاضعين لسادتهم، مرضين لهم في كل شيء؛ غير معاندين؛"]]}], "kwAr": "في كل أمر", "noteAr": ""}, {"kw": "well pleasing", "raw": "Col_1:10; Phi_4:18; Heb_13:21", "note": "", "refs": [{"l": "Col 1:10", "n": "", "vs": [[10, "لكي تسلكوا سلوكا لائقا بالرب ومرضيا في كل شيء، منتجين الثمر في كل عمل صالح ونامين في معرفة الله إلى التمام،"]]}, {"l": "Phi 4:18", "n": "", "vs": [[18, "فالآن عندي كل ما يسد حاجتي ويزيد عنها. أنا في بحبوحة إذ تسلمت من أبفروديتس ما بعثتم به إلي، عطرا طيب الرائحة، ذبيحة يقبلها الله ويسر بها."]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}], "kwAr": "مرضي في الرب", "noteAr": ""}], "arS": [["أيها ", []], ["الأولاد", ["G5043"]], ["، ", []], ["أطيعوا", ["G5219"]], [" ", []], ["والديكم", ["G1118"]], [" في ", []], ["كل", ["G3956"]], [" أمر، لأن ذلك ", []], ["مرضي", ["G2101"]], [" في ", []], ["الرب", ["G2962"]], [".", []]]}, {"c": 3, "v": 21, "text": "أيها الآباء، لا تثيروا غضب أولادكم لئلا يصيبهم الفشل.", "groups": [{"kw": "", "raw": "Psa_103:13; Pro_3:12, Pro_4:1-4; Eph_6:4; 1Th_2:11; Heb_12:5-11", "note": "", "refs": [{"l": "Psa 103:13", "n": "", "vs": [[13, "مثلما يعطف الأب على بنيه يعطف الرب على أتقيائه."]]}, {"l": "Pro 3:12", "n": "", "vs": [[12, "لأن الرب يؤدب من يحبه، ويسر به كما يسر أب بابنه."]]}, {"l": "Pro 4:1-4", "n": "", "vs": [[1, "استمعوا أيها البنون إلى إرشاد الأب، وأصغوا لتكتسبوا الفطنة،"], [2, "فإني أقدم لكم تعليما صالحا، فلا تهملوا شريعتي."], [3, "عندما كنت ابنا لأبي، غضا وحيدا لأمي،"], [4, "قال لي: «ادخر في قلبك كلامي، واحفظ وصاياي فتحيا."]]}, {"l": "Eph 6:4", "n": "", "vs": [[4, "وأنتم، أيها الآباء، لا تثيروا غضب أولادكم. وإنما ربوهم بتأديب الرب وتحريضه."]]}, {"l": "1Th 2:11", "n": "", "vs": [[11, "كما أنكم تعلمون كيف عاملناكم معاملة الأب لأولاده، فكنا نعظ كل واحد منكم ونشجعكم"]]}, {"l": "Heb 12:5-11", "n": "", "vs": [[5, "فهل نسيتم الوعظ الذي يخاطبكم به الله بوصفكم أبناء له؟ إذ يقول: «ياابني، لا تستخف بتأديب الرب. ولا تفقد العزيمة حين يوبخك على الخطأ."], [6, "فإن الذي يحبه الرب يؤدبه. وهو يجلد كل من يتخذه له ابنا!»"], [7, "إذن، تحملوا تأديب الرب. فهو يعاملكم معاملة الأبناء: وأي ابن لا يؤدبه أبوه؟"], [8, "فإن كنتم لا تتلقون التأديب الذي يشترك فيه أبناء الله جميعا، فمعنى ذلك أنكم لستم أبناء شرعيين له."], [9, "إن آباءنا الأرضيين كانوا يؤدبوننا ونحن أولاد، وكنا نحترمهم. أفلا يجدر بنا الآن أن نخضع خضوعا تاما لتأديب أبي الأرواح، لنحيا حياة فضلى؟"], [10, "وقد أدبنا آباؤنا فترة من الزمان، حسب ما رأوه مناسبا. أما الله ، فيؤدبنا دائما من أجل منفعتنا: لكي نشترك في قداسته."], [11, "وطبعا، كل تأديب لا يبدو في الحال باعثا على الفرح، بل على الحزن. ولكنه فيما بعد، ينتج بسلام في الذين يتلقونه ثمر البر."]]}], "kwAr": "", "noteAr": ""}], "arS": [["أيها ", []], ["الآباء", ["G3962"]], ["، لا ", []], ["تثيروا", ["G2042"]], [" غضب ", []], ["أولادكم", ["G5043"]], [" لئلا ", []], ["يصيبهم الفشل", ["G120"]], [".", []]]}, {"c": 3, "v": 22, "text": "أيها العبيد، أطيعوا في كل أمر سادتكم البشريين، فلا تعملوا بجد فقط حين تكون عيونهم عليكم، كمن يحاول إرضاء الناس، بل بقلب صادق خائفين الرب.", "groups": [{"kw": "obey", "raw": "Col_3:20; Psa_123:2; Mal_1:6; Mat_8:9; Luk_6:46, Luk_7:8; Eph_6:5-7; 1Ti_6:1, 1Ti_6:2; Tit_2:9, Tit_2:10; Phm_1:16; 1Pe_2:18, 1Pe_2:19", "note": "", "refs": [{"l": "Col 3:20", "n": "", "vs": [[20, "أيها الأولاد، أطيعوا والديكم في كل أمر، لأن ذلك مرضي في الرب."]]}, {"l": "Psa 123:2", "n": "", "vs": [[2, "كما تتعلق عيون العبيد بأيدي سادتهم، وعينا الجارية بيد سيدتها، هكذا تتعلق أنظارنا بالرب إلهنا حتى يتحنن علينا."]]}, {"l": "Mal 1:6", "n": "", "vs": [[6, "إن الابن يكرم أباه والعبد سيده. فإن كنت أنا حقا أبا فأين كرامتي؟ وإن كنت حقا سيدا فأين مهابتي؟ إن الرب القدير يقول لكم: أيها الكهنة المزدرون باسمي؛ فتسألون: كيف ازدرينا باسمك؟"]]}, {"l": "Mat 8:9", "n": "", "vs": [[9, "فأنا أيضا رجل تحت سلطة أعلى مني، ولي جنود تحت إمرتي؛ أقول لأحدهم: اذهب! فيذهب، ولآخر: تعال! فيأتي، ولعبدي: افعل هذا! فيفعل»."]]}, {"l": "Luk 6:46", "n": "", "vs": [[46, "ولماذا تدعونني: يارب، يارب! ولا تعملون بما أقوله؟"]]}, {"l": "Luk 7:8", "n": "", "vs": [[8, "فأنا أيضا رجل موضوع تحت سلطة أعلى مني، ولي جنود تحت إمرتي، أقول لأحدهم: اذهب! فيذهب؛ ولغيره: تعال! فيأتي؛ ولعبدي: افعل هذا! فيفعل»."]]}, {"l": "Eph 6:5-7", "n": "", "vs": [[5, "أيها العبيد، أطيعوا سادتكم البشريين بخوف وارتعاد، من قلب صادق، كمن يطيع المسيح،"], [6, "غير عاملين بجد فقط حين تكون عيونهم عليكم كمن يحاول إرضاء الناس، بل انطلاقا من كونكم عبيدا للمسيح،"], [7, "عاملين بمشيئة الله من القلب، خادمين بنية حسنة كما للرب، لا للناس."]]}, {"l": "1Ti 6:1", "n": "", "vs": [[1, "على جميع من هم تحت نير العبودية أن يعتبروا سادتهم أهلا لكل إكرام، لكي لا يجلبوا التجديف على اسم الله وعلى التعليم."]]}, {"l": "1Ti 6:2", "n": "", "vs": [[2, "وعلى الذين لهم سادة مؤمنون أن لا يستخفوا بهم لأنهم إخوة لهم، بل بالأحرى أن يخدموهم بخضوع، لأن المستفيدين من خدمتهم الصالحة هم مؤمنون محبوبون."]]}, {"l": "Tit 2:9", "n": "", "vs": [[9, "وعلم العبيد أن يكونوا خاضعين لسادتهم، مرضين لهم في كل شيء؛ غير معاندين؛"]]}, {"l": "Tit 2:10", "n": "", "vs": [[10, "ولا سارقين، بل مظهرين أمانة كلية صالحة، لكي يزينوا في كل شيء تعليم مخلصنا الله."]]}, {"l": "Phm 1:16", "n": "", "vs": [[16, "لا كعبد في ما بعد، بل أفضل من عبد، أخا حبيبا، إلي بخاصة، فكم بالأحرى إليك، في الجسد وفي الرب معا؟"]]}, {"l": "1Pe 2:18", "n": "", "vs": [[18, "أيها الخدم، اخضعوا لسادتكم باحترام لائق. ليس للسادة الصالحين المترفقين فقط، بل للظالمين القساة أيضا!"]]}, {"l": "1Pe 2:19", "n": "", "vs": [[19, "فما أجمل أن يتحمل الإنسان الأحزان حين يتألم مظلوما، بدافع من ضميره الخاضع لله!"]]}], "kwAr": "أطيعوا في كل أمر سادتكم", "noteAr": ""}, {"kw": "menpleasers", "raw": "Gal_1:10; 1Th_2:4", "note": "", "refs": [{"l": "Gal 1:10", "n": "", "vs": [[10, "فهل أسعى الآن إلى كسب تأييد الناس أو الله؟ أم تراني أطلب أن أرضي الناس؟ لو كنت حتى الآن أرضي الناس، لما كنت عبدا للمسيح!"]]}, {"l": "1Th 2:4", "n": "", "vs": [[4, "بل إننا نتكلم كمن تبين من اختبار الله لهم أنهم أهل لأن يؤتمنوا على الإنجيل، لنرضي لا الناس بل الله الذي يختبر قلوبنا."]]}], "kwAr": "كمن يحاول إرضاء الناس", "noteAr": ""}, {"kw": "in singleness", "raw": "Mat_6:22; Act_2:46; Eph_6:5", "note": "", "refs": [{"l": "Mat 6:22", "n": "", "vs": [[22, "العين مصباح الجسد. فإن كانت عينك سليمة، يكون جسدك كله منورا."]]}, {"l": "Act 2:46", "n": "", "vs": [[46, "ويداومون على الحضور إلى الهيكل يوميا بقلب واحد، ويكسرون الخبز في البيوت، ويتناولون الطعام معا بابتهاج وبساطة قلب،"]]}, {"l": "Eph 6:5", "n": "", "vs": [[5, "أيها العبيد، أطيعوا سادتكم البشريين بخوف وارتعاد، من قلب صادق، كمن يطيع المسيح،"]]}], "kwAr": "بل بقلب صادق", "noteAr": ""}, {"kw": "fearing", "raw": "Gen_42:18; Neh_5:9, Neh_5:15; Ecc_5:7, Ecc_8:12, Ecc_12:13; 2Co_7:1", "note": "", "refs": [{"l": "Gen 42:18", "n": "", "vs": [[18, "وفي اليوم الثالث قال لهم: «افعلوا ما أطلبه منكم فتحيوا، فأنا رجل أتقي الله."]]}, {"l": "Neh 5:9", "n": "", "vs": [[9, "ثم استطردت: «هذا تصرف سيء. ألا تسلكون في خوف إلهنا تفاديا لتعيير الأمم أعدائنا؟"]]}, {"l": "Neh 5:15", "n": "", "vs": [[15, "على نقيض الولاة السابقين الذين ثقلوا الضرائب على الشعب، وابتزوا منهم خبزا وخمرا، فضلا عن أربعين شاقلا (نحو أربع مئة وثمانين جراما من الفضة). كما تسلط رجالهم على الشعب. أما أنا فلم أفعل هكذا من خوف الله،"]]}, {"l": "Ecc 5:7", "n": "", "vs": [[7, "لأن في كثرة الأحلام أباطيل، وكذلك في اللغو المفرط؛ فاتق الله ."]]}, {"l": "Ecc 8:12", "n": "", "vs": [[12, "ومع أن الخاطيء يرتكب الشر مئة مرة وتطول أيامه، إلا أنني أعلم أنه يكون خير لمتقي الله الذين يخشعون في حضرته."]]}, {"l": "Ecc 12:13", "n": "", "vs": [[13, "فلنسمع ختام الكلام كله: اتق الله ، واحفظ وصاياه، لأن هذا هو كل واجب الإنسان،"]]}, {"l": "2Co 7:1", "n": "", "vs": [[1, "فإذ نلنا هذه الوعود، أيها الأحباء، لنطهر أنفسنا من كل ما يدنس الجسد والروح، ونكمل القداسة في مخافة الله."]]}], "kwAr": "خائفين الرب", "noteAr": ""}], "arS": [["أيها ", []], ["العبيد", ["G1401"]], ["، ", []], ["أطيعوا", ["G5219"]], [" في ", []], ["كل", ["G3956"]], [" أمر ", []], ["سادتكم", ["G2962"]], [" ", []], ["البشريين", ["G4561"]], ["، فلا تعملوا بجد فقط حين تكون ", []], ["عيونهم", ["G3787"]], [" عليكم، كمن يحاول ", []], ["إرضاء الناس", ["G441"]], ["، بل ", []], ["بقلب", ["G2588"]], [" ", []], ["صادق", ["G572"]], [" ", []], ["خائفين", ["G5399"]], [" الرب.", []]]}, {"c": 3, "v": 23, "text": "ومهما عملتم، فاجتهدوا فيه من صميم القلب، وكأنه للرب لا للناس،", "groups": [{"kw": "whatsoever", "raw": "Col_3:17; 2Ch_31:21; Psa_47:6, Psa_47:7, Psa_103:1, Psa_119:10, Psa_119:34, Psa_119:145; Ecc_9:10; Jer_3:10; 1Pe_1:22", "note": "", "refs": [{"l": "Col 3:17", "n": "", "vs": [[17, "ومهما كان ما تعملونه، بالقول أو بالفعل، فليجر كل شيء باسم الرب يسوع، رافعين به الشكر لله الآب."]]}, {"l": "2Ch 31:21", "n": "", "vs": [[21, "وكل ما قام به في خدمة بيت الله كان طاعة للشريعة والوصية، وسعيا وراء طلب الله، بكل ولاء، فأفلح."]]}, {"l": "Psa 47:6", "n": "", "vs": [[6, "رنموا لله، رنموا. رنموا لملكنا، رنموا."]]}, {"l": "Psa 47:7", "n": "", "vs": [[7, "لأن الله هو ملك الأرض كلها. رنموا له قصيدة حمد."]]}, {"l": "Psa 103:1", "n": "", "vs": [[1, "باركي يانفسي الرب، وليحمد كل ما في داخلي اسمه القدوس."]]}, {"l": "Psa 119:10", "n": "", "vs": [[10, "لذلك طلبتك بكل قلبي، فلا تدعني أضل عن نكم عبيدا للمسيح،"]]}, {"l": "Eph 6:7", "n": "", "vs": [[7, "عاملين بمشيئة الله من القلب، خادمين بنية حسنة كما للرب، لا للناس."]]}, {"l": "1Pe 2:13", "n": "", "vs": [[13, "فإكراما للرب، اخضعوا لكل نظام يدير شؤون الناس: للملك، باعتباره صاحب السلطة العليا،"]]}, {"l": "1Pe 2:15", "n": "", "vs": [[15, "فإن هذه هي إرادة الله: أن تفعلوا الخير دائما، فتفحموا جهالة الناس الأغبياء!"]]}], "kwAr": "وكأنه للرب لا للناس", "noteAr": ""}], "arS": [["ومهما ", []], ["عملتم", ["G4160"]], ["، ", []], ["فاجتهدوا", ["G2038"]], [" فيه من ", []], ["صميم القلب", ["G5590"]], ["، وكأنه ", []], ["للرب", ["G2962"]], [" لا ", []], ["للناس", ["G444"]], ["،", []]]}, {"c": 3, "v": 24, "text": "عالمين أنكم سوف تنالون المكافأة بالميراث من الرب. فإنما أنتم عبيد تخدمون الرب المسيح", "groups": [{"kw": "ye shall", "raw": "Col_2:18; Gen_15:1; Rth_2:12; Pro_11:18; Mat_5:12, Mat_5:46, Mat_6:1, Mat_6:2, Mat_6:5, Mat_6:16, Mat_10:41; Luk_6:35, Luk_14:14; Rom_2:6, Rom_2:7, Rom_4:4, Rom_4:5; 1Co_3:8, 1Co_9:17, 1Co_9:18; Eph_6:8; Heb_9:15, Heb_10:35, Heb_11:6", "note": "", "refs": [{"l": "Col 2:18", "n": "", "vs": [[18, "لا يحرمكم أحد من جائزتكم، بحملكم على ما يرغب فيه من إظهار التواضع والتعبد للملائكة، داخلا في رؤى يتوهمها، وقد نفخه باطلا ذهنه الجسدي،"]]}, {"l": "Gen 15:1", "n": "", "vs": [[1, "وبعد هذه الأمور قال الرب لأبرام في الرؤيا: «لا تخف ياأبرام. أنا ترس لك. وأجرك عظيم جدا»."]]}, {"l": "Rut 2:12", "n": "", "vs": [[12, "ليكافئك الرب إله إسرائيل، الذي جئت لتحتمي تحت جناحيه، وفقا لإحسانك. وليكن أجرك كاملا من عنده»."]]}, {"l": "Pro 11:18", "n": "", "vs": [[18, "الشرير يكسب أجرة غش زائلة، أما زارع البر فله ثواب أكيد دائم."]]}, {"l": "Mat 5:12", "n": "", "vs": [[12, "افرحوا وتهللوا، فإن مكافأتكم في السماوات عظيمة. فإنهم هكذا اضطهدوا الأنبياء من قبلكم!"]]}, {"l": "Mat 5:46", "n": "", "vs": [[46, "فإن أحببتم الذين يحبونكم، فأية مكافأة لكم؟ أما يفعل ذلك حتى جباة الضرائب؟"]]}, {"l": "Mat 6:1", "n": "", "vs": [[1, "احذروا من أن تعملوا بركم أمام الناس بقصد أن ينظروا إليكم. وإلا، فليس لكم مكافأة عند أبيكم الذي في السماوات."]]}, {"l": "Mat 6:2", "n": "", "vs": [[2, "فإذا تصدقت على أحد، فلا تنفخ أمامك في البوق، كما يفعل المراؤون في المجامع والشوارع، ليمدحهم الناس. الحق أقول لكم: إنهم قد نالوا مكافأتهم."]]}, {"l": "Mat 6:5", "n": "", "vs": [[5, "وعندما تصلون، لا تكونوا مثل المرائين الذين يحبون أن يصلوا واقفين في المجامع وفي زوايا الشوارع ليراهم الناس. الحق أقول لكم: إنهم قد نالوا مكافأتهم."]]}, {"l": "Mat 6:16", "n": "", "vs": [[16, "وعندما تصومون، لا تكونوا عابسي الوجوه، كما يفعل المراؤون الذين يقطبون وجوههم لكي يظهروا للناس صائمين. الحق أقول لكم إنهم قد نالوا مكافأتهم."]]}, {"l": "Mat 10:41", "n": "", "vs": [[41, "من يرحب بنبي لكونه نبيا، فإنه ينال مكافأة نبي؛ ومن يرحب برجل بار لكونه بارا، فإنه ينال مكافأة بار."]]}, {"l": "Luk 6:35", "n": "", "vs": [[35, "ولكن، أحبوا أعداءكم، وأحسنوا المعاملة، وأقرضوا دون أن تأملوا استيفاء القرض، فتكون مكافأتكم عظيمة، وتكونوا أبناء العلي، لأنه ينعم على ناكري الجميل والأشرار."]]}, {"l": "Luk 14:14", "n": "", "vs": [[14, "فتكون مباركا لأن هؤلاء لا يملكون ما يكافئونك به، فإنك تكافأ في قيامة الأبرار»."]]}, {"l": "Rom 2:6", "n": "", "vs": [[6, "فإنه سيجازي كل إنسان بحسب أعماله."]]}, {"l": "Rom 2:7", "n": "", "vs": [[7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"]]}, {"l": "Rom 4:4", "n": "", "vs": [[4, "إن الذي يعمل، لا تحسب له الأجرة من قبيل النعمة بل من قبيل الدين. أما الذي لا يعمل"]]}, {"l": "Rom 4:5", "n": "", "vs": [[5, "وإنما يؤمن بمن يبرر الأثيم، فإن إيمانه يحسب له برا."]]}, {"l": "1Co 3:8", "n": "", "vs": [[8, "فالغارس والساقي سواء. إلا أن كلا منهما سينال أجرته بالنسبة إلى تعبه."]]}, {"l": "1Co 9:17", "n": "", "vs": [[17, "فإن قمت بذلك متطوعا، كانت لي مكافأة. ولكن، إن كنت مرغما، فأنا مؤتمن على مسئولية،"]]}, {"l": "1Co 9:18", "n": "", "vs": [[18, "فما هي مكافأتي إذن؟ هي أني في تبشيري أجعل الإنجيل بلا كلفة، غير مستغل كامل حقي لقاء التبشير بالإنجيل."]]}, {"l": "Eph 6:8", "n": "", "vs": [[8, "فأنتم تعلمون أنه مهما عمل كل واحد من الخير، فسوف ينال المكافأة من الرب، سواء أكان عبدا أم حرا."]]}, {"l": "Heb 9:15", "n": "", "vs": [[15, "ولذلك، فالمسيح هو الوسيط لهذا العهد الجديد. فبما أنه قد تم الموت فداء للمخالفات الحاصلة تحت العهد الأول، ينال المدعوون الوعد بالإرث الأبدي."]]}, {"l": "Heb 10:35", "n": "", "vs": [[35, "إذن، لا تتخلوا عن ثقتكم بالرب. فإن لها مكافأة عظيمة."]]}, {"l": "Heb 11:6", "n": "", "vs": [[6, "فمن المستحيل إرضاء الله بدون إيمان. إذ إن من يتقرب إلى الله، لابد له أن يؤمن بأنه موجود، وبأنه يكافيء الذين يسعون إليه."]]}], "kwAr": "سوف تنالون المكافأة بالميراث", "noteAr": ""}, {"kw": "for", "raw": "Joh_12:26; Rom_1:1, Rom_14:18; 1Co_7:22; Gal_1:10; Eph_6:6; 2Pe_1:1; Jud_1:1", "note": "", "refs": [{"l": "Joh 12:26", "n": "", "vs": [[26, "من أراد أن يخدمني فليتبعني. وحيث أكون أنا يكون خادمي أيضا. وكل من يخدمني يكرمه أبي."]]}, {"l": "Rom 1:1", "n": "", "vs": [[1, "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"]]}, {"l": "Rom 14:18", "n": "", "vs": [[18, "فمن خدم المسيح هكذا، كان مقبولا عند الله وممدوحا عند الناس."]]}, {"l": "1Co 7:22", "n": "", "vs": [[22, "فإن من دعي في الرب وهو عبد، صار معتقا للرب. وكذلك أيضا من دعي وهو حر، صار عبدا للمسيح."]]}, {"l": "Gal 1:10", "n": "", "vs": [[10, "فهل أسعى الآن إلى كسب تأييد الناس أو الله؟ أم تراني أطلب أن أرضي الناس؟ لو كنت حتى الآن أرضي الناس، لما كنت عبدا للمسيح!"]]}, {"l": "Eph 6:6", "n": "", "vs": [[6, "غير عاملين بجد فقط حين تكون عيونهم عليكم كمن يحاول إرضاء الناس، بل انطلاقا من كونكم عبيدا للمسيح،"]]}, {"l": "2Pe 1:1", "n": "", "vs": [[1, "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"]]}, {"l": "Jud 1:1", "n": "", "vs": [[1, "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."]]}], "kwAr": "تخدمون الرب المسيح", "noteAr": ""}], "arS": [["عالمين", ["G1492"]], [" أنكم سوف ", []], ["تنالون", ["G618"]], [" ", []], ["المكافأة", ["G469"]], [" ", []], ["بالميراث", ["G2817"]], [" من ", []], ["الرب", ["G2962"]], [". فإنما أنتم عبيد ", []], ["تخدمون", ["G1398"]], [" ", []], ["الرب", ["G2962"]], [" ", []], ["المسيح", ["G5547"]]]}, {"c": 3, "v": 25, "text": "وأما من عمل شرا فسوف ينال جزاء عمله الشرير، وليس محاباة.", "groups": [{"kw": "he that", "raw": "1Co_6:7, 1Co_6:8; 1Th_4:6; Phm_1:18", "note": "", "refs": [{"l": "1Co 6:7", "n": "", "vs": [[7, "والواقع أنه من العيب على الإطلاق أن يقاضي بعضكم بعضا. أما كان أحر ى بكم أن تحتملوا الظلم وأحرى بكم أن تتقبلوا السلب؟"]]}, {"l": "1Co 6:8", "n": "", "vs": [[8, "ولكنكم أنتم تظلمون وتسلبون حتى إخوتكم."]]}, {"l": "1Th 4:6", "n": "", "vs": [[6, "وألا يتعدى حقوق أخيه ويسيء إليه في هذا الأمر، لأن الرب هو المنتقم لجميع هذه الإساءات، كما أنذرناكم قبلا وشهدنا لكم بحق."]]}, {"l": "Phm 1:18", "n": "", "vs": [[18, "وإن كان قد أساء إليك في شيء، أو كان مديونا لك بشيء، فاحسب ذلك دينا علي."]]}], "kwAr": "من عمل شرا", "noteAr": ""}, {"kw": "receive", "raw": "2Co_5:10; Heb_2:2", "note": "", "refs": [{"l": "2Co 5:10", "n": "", "vs": [[10, "إذ لابد أن نقف جميعا مكشوفين أمام عرش المسيح، لينال كل واحد منا استحقاق ما عمله حين كان في الجسد، أصالحا كان أم رديئا!"]]}, {"l": "Heb 2:2", "n": "", "vs": [[2, "فإننا نعلم أن كل كلمة نقلتها الملائكة، قد تبين أنها ثابتة، وقد نال كل متعد أو مخالف لها عقابا عادلا."]]}], "kwAr": "فسوف ينال جزاء عمله", "noteAr": ""}, {"kw": "and", "raw": "Col_4:1; Lev_19:15; Deu_1:17, Deu_10:17; 2Sa_14:14; 2Ch_19:7; Job_34:19, Job_37:24; Luk_20:21; Act_10:34; Rom_2:11; Eph_6:9; 1Pe_1:17; Jud_1:16", "note": "", "refs": [{"l": "Col 4:1", "n": "", "vs": [[1, "أيها السادة، عاملوا عبيدكم بالعدل والإنصاف، عالمين أن لكم، أنتم أيضا، سيدا في السماء."]]}, {"l": "Lev 19:15", "n": "", "vs": [[15, "لا تظلموا في القضاء، ولا تتحيزوا لمسكين ولا تحابوا عظيما. احكم لقريبك بالعدل."]]}, {"l": "Deu 1:17", "n": "", "vs": [[17, "لا تحابوا في القضاء واستمعوا للصغير كما تستمعون للكبير. لا تهابوا إنسانا، لأن القضاء لله. وما يشكل عليكم من أمر ترفعونه إلي فأقضي فيه."]]}, {"l": "Deu 10:17", "n": "", "vs": [[17, "لأن الرب إلهكم هو إله الآلهة ورب الأرباب، الإله العظيم الجبار المهيب، الذي لا يحابي وجه أحد، ولا يرتشي."]]}, {"l": "2Sa 14:14", "n": "", "vs": [[14, "لأننا لابد أن نموت ونكون مثل المياه المتسربة في شقوق الأرض التي يتعذر جمعها. ولكن الله لا يستأصل نفسا بل يفكر بشتى الطرق حتى لا يقطع عنه منفيه."]]}, {"l": "2Ch 19:7", "n": "", "vs": [[7, "ولتكن هيبة الرب عليكم. فاحرصوا على إقامة العدل لأنه ليس عند الرب إلهنا ظلم ولا محاباة ولا رشوة»."]]}, {"l": "Job 34:19", "n": "", "vs": [[19, "الذي لا يحابي الأمراء، ولا يؤثر الأغنياء على الفقراء، لأنهم جميعا عمل يديه."]]}, {"l": "Job 37:24", "n": "", "vs": [[24, "لذلك يرهبه الجميع، لأنه يحتقر أدعياء الحكمة»."]]}, {"l": "Luk 20:21", "n": "", "vs": [[21, "فقالوا يسألونه: «يامعلم، نعلم أنك تتكلم وتعلم بالصدق، فلا تراعي مقامات الناس، بل تعلم طريق الله بالحق:"]]}, {"l": "Act 10:34", "n": "", "vs": [[34, "فبدأ بطرس كلامه قائلا: «تبين لي فعلا أن الله لا يفضل أحدا على أحد،"]]}, {"l": "Rom 2:11", "n": "", "vs": [[11, "فليس عند الله تحيز."]]}, {"l": "Eph 6:9", "n": "", "vs": [[9, "وأنتم، أيها السادة، عاملوهم بمثل هذه المعاملة غير لاجئين إلى التهديد، عالمين أن سيدكم وسيدهم هو في السماء، وهو لا يراعي مقامات الناس."]]}, {"l": "1Pe 1:17", "n": "", "vs": [[17, "وما دمتم تعترفون بالله أبا لكم، وهو يحكم على كل إنسان حسب أعماله دون انحياز، فاسلكوا في مخافته مدة إقامتكم المؤقتة على الأرض."]]}, {"l": "Jud 1:16", "n": "", "vs": [[16, "وهؤلاء المعلمون يتذمرون ويشكون دائما وفيما هم يندفعون وراء شهواتهم، يطلقون ألسنتهم متحدثين بأمور طنانة، ويمدحون من يعجبهم طلبا للمنفعة!"]]}], "kwAr": "وليس محاباة", "noteAr": ""}], "arS": [["وأما من ", []], ["عمل شرا", ["G91"]], [" فسوف ", []], ["ينال", ["G2865"]], [" جزاء عمله ", []], ["الشرير", ["G91"]], ["، وليس ", []], ["محاباة", ["G4382"]], [".", []]]}, {"c": 4, "v": 1, "text": "أيها السادة، عاملوا عبيدكم بالعدل والإنصاف، عالمين أن لكم، أنتم أيضا، سيدا في السماء.", "groups": [{"kw": "give", "raw": "Lev_19:13, Lev_25:39-43; Deu_15:12-15, Deu_24:14, Deu_24:15; Neh_5:5-13; Job_24:11, Job_24:12; Job_31:13-15; Isa_58:3, Isa_58:5-9; Jer_34:9-17; Mal_3:5; Jam_2:13, Jam_5:4", "note": "", "refs": [{"l": "Lev 19:13", "n": "", "vs": [[13, "لا تظلم قريبك، ولا تسلب ولا ترجيء دفع أجرة أجيرك إلى الغد."]]}, {"l": "Lev 25:39-43", "n": "", "vs": [[39, "وإذا افتقر أخوك وبيع لك عبدا، فلا تعامله كعبد،"], [40, "بل ليكن عندك كأجير أو نزيل، فيخدمك حتى حلول سنة اليوبيل،"], [41, "ثم تعتقه هو وأولاده، ويعود إلى قومه، ويرجع إلى ملك آبائه،"], [42, "لأن بني إسرائيل عبيدي الذين أخرجتهم من مصر، لا يباعون كالعبيد."], [43, "لا تطغ بتسلطك، بل اتق إلهك،"]]}, {"l": "Deu 15:12-15", "n": "", "vs": [[12, "إذا اشتريت عبرانيا أو عبرانية، وخدمك ست سنوات، ففي السنة السابعة تطلقه حرا من عندك."], [13, "لا تطلقه صفر اليدين،"], [14, "بل زوده مما باركك الرب إلهك به، من غنم وحنطة وزيت."], [15, "واذكروا أنكم كنتم عبيدا في ديار مصر، فحرركم الرب إلهكم. لذلك أوصيكم بهذا الأمر اليوم."]]}, {"l": "Deu 24:14", "n": "", "vs": [[14, "لا تظلم أجيرا وفقيرا، سواء كان من بني إسرائيل أو من الغرباء المقيمين في مدينتك."]]}, {"l": "Deu 24:15", "n": "", "vs": [[15, "ادفع له أجرته في يومه قبل غروب الشمس لأنه فقير، أجهد نفسه للحصول عليها. وإلا توجه إلى الرب بالشكوى ضدك، فتكون هذه عليك خطيئة."]]}, {"l": "Neh 5:5-13", "n": "", "vs": [[5, "ومع أن لحمنا من لحم إخوتنا وأولادنا كأولادهم، فإن علينا أن نخضع أبناءنا وبناتنا للعبودية، بل إن بعض بناتنا مستعبدات، وليس بيدنا حيلة، لأن حقولنا وكرومنا مرهونة للآخرين."], [6, "وحين سمعت صراخ شكواهم وكلامهم غضبت جدا."], [7, "وبعد أن تدبرت الأمر في نفسي عنفت الأشراف والولاة قائلا: «إنكم تأخذون الربا من إخوتكم». ثم عقدت اجتماعا عظيما لمقاضاتهم."], [8, "وقلت لهم: «إننا بحسب طاقتنا افتدينا بالأموال إخوتنا اليهود الذين بيعوا للأمم، وها أنتم تبيعون إخوتكم لهم، وهم يعودون فيبيعونهم لنا». فسكتوا ولم يجدوا جوابا."], [9, "ثم استطردت: «هذا تصرف سيء. ألا تسلكون في خوف إلهنا تفاديا لتعيير الأمم أعدائنا؟"], [10, "لقد أقرضت أنا وغلماني الشعب أيضا فضة وقمحا، فلنمتنع عن تقاضي الربا."], [11, "ردوا لهم هذا اليوم حقولهم وكرومهم وزيتونهم وبيوتهم، والنسبة المئوية من الربا التي تتقاضونها على الفضة والقمح والخمر والزيت»."], [12, "فأجابوا: «نرد ولا نطالبهم بربا، صانعين كل ما قلت». فاستدعيت الكهنة واستحلفتهم أن يفعلوا بمقتضى هذا التعهد،"], [13, "ثم نفضت حجري قائلا: «هكذا ينفض الله كل إنسان لا ينفذ هذا التعهد في بيته وفي عمله، فيصبح شريدا معدما». فأجابت كل الجماعة: «آمين». وسبحت الرب. ونفذ الشعب نص هذا التعهد."]]}, {"l": "Job 24:11", "n": "", "vs": [[11, "يعصرون الزيت بين أتلام زيتون الأشرار، ويدوسون معاصر الخمر وهم عطاش."]]}, {"l": "Job 24:12", "n": "", "vs": [[12, "يرتفع من المدن أنين المشرفين على الموت، وتستغيث نفوس الجرحى، والله لا يصغي إلى دعائهم."]]}, {"l": "Job 31:13-15", "n": "", "vs": [[13, "إن كنت قد تنكرت لحق خادمي وأمتي عندما اشتكيا علي،"], [14, "فماذا أصنع عندما يقوم الله (لمحاكمتي)؟ وبماذا أجيب عندما يتقصى (ليحاسبني)؟"], [15, "أليس الذي كونني في الرحم كونه أيضا؟ أو ليس الذي شكلنا في الرحم واحد؟"]]}, {"l": "Isa 58:3", "n": "", "vs": [[3, "ويسألون: ما بالنا صمنا وأنت لم تلاحظ، وتذللنا ولم تحفل بذلك؟. إنكم في يوم صومكم تلتمسون مسرة أنفسكم وتسخرون جميع عمالكم."]]}, {"l": "Isa 58:5-9", "n": "", "vs": [[5, "أيكون الصوم الذي أختاره في إذلال المرء نفسه يوما، أو في إحناء رأسه كالقصبة، أو افتراش المسح والرماد؟ أتدعو هذا صوما مقبولا لدى الرب؟"], [6, "أليس الصوم الذي أختاره يكون في فك قيود الشر، وحل عقد النير، وإطلاق سراح المتضايقين، وتحطيم كل نير؟"], [7, "ألا يكون في مشاطرة خبزك مع الجائع، وإيواء الفقير المتشرد في بيتك. وكسوة العريان الذي تلتقيه، وعدم التغاضي عن قريبك البائس؟"], [8, "عندئذ يشع نورك كالصباح، وتزهر عافيتك سريعا، ويتقدمك برك، ويحرس مجد الرب مؤخرة ساقتك."], [9, "عندئذ تدعو فيستجيب الرب. تستغيث فيقول ها أنا. إن أزلت من وسط بيتك النير، والإيماء بالأصبع احتقارا، والنطق بالشر،"]]}, {"l": "Jer 34:9-17", "n": "", "vs": [[9, "يعتق كل واحد عبده وأمته، العبراني والعبرانية فلا يستعبد أحد يهوديا من إخوته."], [10, "فاستجاب جميع الرؤساء وسائر الشعب الذين دخلوا في العهد الذي ينص على تحرير كل واحد عبده وأمته، فلا يستعبدهما من بعد. وأطاعوا العهد وأعتقوا."], [11, "ولكنهم ما لبثوا أن استردوا العبيد والإماء الذين أعتقوهم، واستعبدوهم من جديد."], [12, "فأوحى الرب بهذه النبوءة إلى إرميا:"], [13, "«هذا ما يعلنه الرب إله إسرائيل: إني عقدت ميثاقا مع آبائكم حين أخرجتهم من ديار مصر من أرض العبودية قائلا:"], [14, "ليطلق كل واحد منكم في ختام سبع سنين أخاه العبراني الذي باع نفسه لك، وخدمك ست سنوات، ليكون حرا. فلم يطعني آباؤكم ولم يسمعوا لي."], [15, "وها أنتم اليوم تبتم، وصنعتم ما هو قويم في عيني، داعين كل واحد لتحرير قريبه، وقطعتم عهدا أمامي في الهيكل الذي دعي باسمي."], [16, "ثم ما لبثتم أن عدتم فنجستم اسمي، واسترد كل واحد منكم عبده وأمته الذين أعتقتموهم أحرارا، بمقتضى رغبتهم، ثم استعبدتموهم من جديد»."], [17, "لذلك يقول الرب: «لأنكم لم تطيعوني ولم تنادوا بعتق إخوتكم، لذلك سأنادي أنا بعتقكم فأطلقكم لتسقطوا بحد السيف والوباء والجوع، وأجعلكم عرضة للرعب في جميع ممالك الأرض،"]]}, {"l": "Mal 3:5", "n": "", "vs": [[5, "وأقترب منكم لأكون شاهدا سريعا ضد السحرة والزناة والحالفين بالزور والمستغلين لأجرة العامل ومضطهدي الأرامل والأيتام، والذين يظلمون الغرباء ولا يخافونني"]]}, {"l": "Jam 2:13", "n": "", "vs": [[13, "فلابد أن يكون الحكم على الذين لا يمارسون الرحمة، حكما خاليا من الرحمة، أما الرحمة فهي تتفوق على الحكم!"]]}, {"l": "Jam 5:4", "n": "", "vs": [[4, "وهذه أجرة العمال الذين حصدوا حقولكم، تلك الأجرة التي مازلتم تحبسونها عنهم ظلما، إنها تصرخ، وصراخ أولئك العمال أنفسهم قد سمعه رب الجنود!"]]}], "kwAr": "عاملوا عبيدكم بالعدل والإنصاف", "noteAr": ""}, {"kw": "ye", "raw": "Ecc_5:8; Mat_23:8, Mat_23:9, Mat_24:48-51; Luk_16:1-13, Luk_19:15; Eph_6:8, Eph_6:9-20; Rev_17:14, Rev_19:16", "note": "", "refs": [{"l": "Ecc 5:8", "n": "", "vs": [[8, "إن شهدت في البلاد الفقير مظلوما، والحق والعدل مزهوقين فلا تعجب من الأمر، فإن فوق المسئول الكبير مسئولا أعلى منه رتبة يراقبه وفوقهما من هو أعظم مقاما منهما."]]}, {"l": "Mat 23:8", "n": "", "vs": [[8, "أما أنتم، فلا تقبلوا أن يدعوكم أحد: يامعلم! لأن معلمكم واحد، وأنتم جميعا إخوة."]]}, {"l": "Mat 23:9", "n": "", "vs": [[9, "ولا تدعوا أحدا على الأرض أبا لكم: لأن أباكم واحد، وهو الآب الذي في السماوات."]]}, {"l": "Mat 24:48-51", "n": "", "vs": [[48, "ولكن إذا قال ذلك العبد الشرير في قلبه: سيتأخر سيدي في رجوعه!"], [49, "وبدأ يضرب زملاءه العبيد ويأكل ويشرب مع السكيرين،"], [50, "فإن سيد ذلك العبد لابد أن يرجع في يوم لا يتوقعه، وساعة لا يعرفها،"], [51, "فيفصله ويجعل نصيبه مع المرائين، هناك يكون البكاء وصرير الأسنان!"]]}, {"l": "Luk 16:1-13", "n": "", "vs": [[1, "وقال أيضا لتلاميذه: «كان لإنسان غني وكيل. فاتهم لديه بأنه يبذر أمواله."], [2, "فاستدعاه وسأله: ما هذا الذي أسمع عنك؟ قدم حساب وكالتك، فإنك لا يمكن أن تكون وكيلا لي بعد!"], [3, "فقال الوكيل في نفسه: ما عسى أن أعمل، مادام سيدي سينزع عني الوكالة؟ لا أقوى على نقب الأرض؛ وأستحي أن أستعطي!"], [4, "قد علمت ماذا أعمل، حتى إذا عزلت عن الوكالة، يستقبلني الأصدقاء في بيوتهم."], [5, "فاستدعى مديوني سيده واحدا فواحدا. وسأل أولهم: كم عليك لسيدي؟"], [6, "فأجاب: مئة بث من الزيت. فقال له: خذ صكك، واجلس سريعا، واكتب خمسين!"], [7, "ثم قال للآخر: وأنت، كم عليك؟ فأجاب: مئة كر من القمح. فقال له: خذ صكك، واكتب ثمانين!"], [8, "فامتدح السيد وكيله الخائن لأنه تصرف بحكمة. فإن أبناء هذا العالم أحكم مع أهل جيلهم من أبناء النور."], [9, "وأقول لكم: اكسبوا لكم أصدقاء بمال الظلم، حتى إذا فني مالكم، تقبلون في المنازل الأبدية!"], [10, "إن الأمين في القليل أمين أيضا في الكثير، والخائن في القليل خائن أيضا في الكثير."], [11, "فإن لم تكونوا أمناء في مال الظلم، فمن يأتمنكم على مال الحق؟"], [12, "وإن لم تكونوا أمناء في ما يخص غيركم، فمن يعطيكم ما يخصكم؟"], [13, "ما من خادم يقدر أن يكون عبدا لسيدين: فإنه إما أن يبغض أحدهما، فيحب الآخر؛ وإما أن يلتحق بأحدهما، فيهجر الآخر. لا تستطيعون أن تكونوا عبيدا لله والمال معا»."]]}, {"l": "Luk 19:15", "n": "", "vs": [[15, "ولدى عودته بعدما تسلم الملك، أمر أن يدعى إليه هؤلاء العبيد الذين أودعهم المال، ليعرف ما ربحه كل واحد منهم بتجارته."]]}, {"l": "Eph 6:8", "n": "", "vs": [[8, "فأنتم تعلمون أنه مهما عمل كل واحد من الخير، فسوف ينال المكافأة من الرب، سواء أكان عبدا أم حرا."]]}, {"l": "Eph 6:9-20", "n": "", "vs": [[9, "وأنتم، أيها السادة، عاملوهم بمثل هذه المعاملة غير لاجئين إلى التهديد، عالمين أن سيدكم وسيدهم هو في السماء، وهو لا يراعي مقامات الناس."], [10, "وختاما، تشددوا في الرب وفي قدرة قوته."], [11, "البسوا سلاح الله الكامل، لتتمكنوا من الصمود في وجه مكايد إبليس."], [12, "فإن حربنا ليست ضد ذوي اللحم والدم، بل ضد الرئاسات، ضد السلطات، ضد أسياد العالم حكام هذا الظلام، ضد قوى الشر الروحية في الأماكن السماوية."], [13, "لذلك اتخذوا سلاح الله الكامل، لتتمكنوا من المقاومة في يوم الشر، ومن الصمود أيضا بعد تحقيق كل هدف."], [14, "فاصمدوا إذن بعد أن تتخذوا الحق حزاما لأوساطكم، والبر درعا لصدوركم،"], [15, "والاستعداد لنشر بشارة السلام حذاء لأقدامكم."], [16, "وفوق هذا كله، احملوا الإيمان ترسا به تقدرون أن تطفئوا جميع سهام الشرير المشتعلة."], [17, "واتخذوا الخلاص خوذة للرأس، وكلمة الله سيف الروح."], [18, "كونوا مصلين في كل حال، بكل صلاة وطلبة في الروح، وساهرين لهذا الغرض عينه مواظبين تماما على جميع الطلبات لأجل القديسين جميعا،"], [19, "ولأجلي كي ألهم ما أنطق به كلما فتحت فمي لأعلن بجرأة سر الإنجيل"], [20, "الذي أنا سفيره المقيد بالسلاسل، فأكون جريئا في إعلانه كما يجب أن أتكلم به."]]}, {"l": "Rev 17:14", "n": "", "vs": [[14, "ثم يحاربون الحمل، ولكن الحمل يهزمهم، لأنه رب الأرباب وملك الملوك، والذين معه هم المدعوون، المختارون، المؤمنون»."]]}, {"l": "Rev 19:16", "n": "", "vs": [[16, "وقد كتب على ثوبه وعلى فخذه «ملك الملوك ورب الأرباب»."]]}], "kwAr": "لكم أنتم أيضا سيدا في السماء", "noteAr": ""}], "arS": [["أيها ", []], ["السادة", ["G2962"]], ["، عاملوا ", []], ["عبيدكم", ["G1401"]], [" ", []], ["بالعدل", ["G1342"]], [" ", []], ["والإنصاف", ["G2471"]], ["، ", []], ["عالمين", ["G1492"]], [" أن لكم، أنتم أيضا، ", []], ["سيدا", ["G2962"]], [" في ", []], ["السماء", ["G3772"]], [".", []]]}, {"c": 4, "v": 2, "text": "داوموا على الصلاة، متيقظين فيها بالشكر،", "groups": [{"kw": "Continue", "raw": "Col_4:12, Col_1:9; 1Sa_12:23; Job_15:4, Job_27:8-10; Psa_55:16, Psa_55:17, Psa_109:4; Luk_18:1; Rom_12:12; Eph_6:18; Phi_4:6; 1Th_5:17, 1Th_5:18", "note": "", "refs": [{"l": "Col 4:12", "n": "", "vs": [[12, "يسلم عليكم أبفراس الذي هو منكم، وهو عبد للمسيح يسوع، يجاهد كل حين لأجلكم في الصلوات لتثبتوا كاملين ولكم تمام اليقين من جهة مشيئة الله كلها."]]}, {"l": "Col 1:9", "n": "", "vs": [[9, "لذلك نحن أيضا، من اليوم الذي فيه سمعنا بأخباركم، مازلنا نصلي ونتضرع لأجلكم، لأن تمتلئوا من تمام المعرفة لمشيئة الله في كل حكمة وإدراك روحي،"]]}, {"l": "1Sa 12:23", "n": "", "vs": [[23, "وأما أنا فحاشا لي أن أخطىء إلى الرب، فأكف عن الصلاة من أجلكم، بل أواظب على تعليمكم الطريق الصالح المستقيم."]]}, {"l": "Job 15:4", "n": "", "vs": [[4, "أما أنت فإنك تطرح جانبا مخافة الله وتنقض عبادته."]]}, {"l": "Job 27:8-10", "n": "", "vs": [[8, "إذ ما هو رجاء الفاجر عندما يستأصله الله ويزهق أنفاسه؟"], [9, "هل يستمع الله إلى صرخته إذا حل به ضيق؟"], [10, "هل يسر بالقدير ويستغيث به في كل الأزمنة؟"]]}, {"l": "Psa 55:16", "n": "", "vs": [[16, "أما أنا فبالرب أستغيث والرب يخلصني."]]}, {"l": "Psa 55:17", "n": "", "vs": [[17, "مساء وصباحا وظهرا أشكو له صارخا ونائحا، فيسمع صوتي."]]}, {"l": "Psa 109:4", "n": "", "vs": [[4, "يبادلون محبتي بخصام، أما أنا فأصلي من أجلهم."]]}, {"l": "Luk 18:1", "n": "", "vs": [[1, "وضرب لهم مثلا في وجوب الصلاة دائما ودون ملل،"]]}, {"l": "Rom 12:12", "n": "", "vs": [[12, "فرحين بالرجاء، صابرين في الضيق، مواظبين على الصلاة،"]]}, {"l": "Eph 6:18", "n": "", "vs": [[18, "كونوا مصلين في كل حال، بكل صلاة وطلبة في الروح، وساهرين لهذا الغرض عينه مواظبين تماما على جميع الطلبات لأجل القديسين جميعا،"]]}, {"l": "Phi 4:6", "n": "", "vs": [[6, "لا تقلقوا من جهة أي شيء، بل في كل أمر لتكن طلباتكم معروفة لدى الله، بالصلاة والدعاء، مع الشكر."]]}, {"l": "1Th 5:17", "n": "", "vs": [[17, "صلوا دون انقطاع؛"]]}, {"l": "1Th 5:18", "n": "", "vs": [[18, "ارفعوا الشكر في كل حال: فهذه هي مشيئة الله لكم في المسيح يسوع."]]}], "kwAr": "داوموا على الصلاة", "noteAr": ""}, {"kw": "watch", "raw": "Mat_26:41; Mar_13:33; Luk_21:36; 1Pe_4:7", "note": "", "refs": [{"l": "Mat 26:41", "n": "", "vs": [[41, "اسهروا وصلوا لكي لا تدخلوا في تجربة. إن الروح نشيط؛ أما الجسد فضعيف»."]]}, {"l": "Mar 13:33", "n": "", "vs": [[33, "فانتبهوا واسهروا لأنكم لا تعرفون متى يحين الوقت!"]]}, {"l": "Luk 21:36", "n": "", "vs": [[36, "فاسهروا إذن وتضرعوا في كل حين، لكي تتمكنوا من أن تنجوا من جميع هذه الأمور التي هي على وشك أن تحدث، وتقفوا أمام ابن الإنسان»."]]}, {"l": "1Pe 4:7", "n": "", "vs": [[7, "إن نهاية كل شيء قد صارت قريبة. فتعقلوا إذن، وكونوا متنبهين لرفع الصلاة دائما."]]}], "kwAr": "متيقظين فيها", "noteAr": ""}, {"kw": "thanksgiving", "raw": "Col_2:7, Col_3:15, Col_3:17", "note": "", "refs": [{"l": "Col 2:7", "n": "", "vs": [[7, "وأنتم متأصلون ومبنيون فيه وراسخون في الإيمان الموافق لما تعلمتم وفائضون بالشكر."]]}, {"l": "Col 3:15", "n": "", "vs": [[15, "وليملك في قلوبكم سلام المسيح، فإليه قد دعيتم في الجسد الواحد؛ وكونوا شاكرين!"]]}, {"l": "Col 3:17", "n": "", "vs": [[17, "ومهما كان ما تعملونه، بالقول أو بالفعل، فليجر كل شيء باسم الرب يسوع، رافعين به الشكر لله الآب."]]}], "kwAr": "بالشكر", "noteAr": ""}], "arS": [["داوموا", ["G4342"]], [" على ", []], ["الصلاة", ["G4335"]], ["، ", []], ["متيقظين", ["G1127"]], [" فيها ", []], ["بالشكر", ["G2169"]], ["،", []]]}, {"c": 4, "v": 3, "text": "مصلين معا لأجلنا أيضا، كي يفتح لنا الله بابا للكلمة، فنتكلم بسر المسيح الذي من أجله أنا مقيد أيضا،", "groups": [{"kw": "praying", "raw": "Rom_15:30-32; Eph_6:19; Phi_1:19; 1Th_5:25; Phm_1:22; Heb_13:18, Heb_13:19", "note": "", "refs": [{"l": "Rom 15:30-32", "n": "", "vs": [[30, "فأتوسل إليكم، أيها الإخوة، بربنا يسوع المسيح وبمحبة الروح، أن تجاهدوا معي في الصلوات إلى الله من أجلي،"], [31, "لكي أنجو من غير المؤمنين الذين في اليهودية، ولكي تكون خدمتي هذه للقديسين في أورشليم مقبولة عندهم،"], [32, "حتى أجيء إليكم في فرح بمشيئة الله فأنتعش عندكم وأستريح."]]}, {"l": "Eph 6:19", "n": "", "vs": [[19, "ولأجلي كي ألهم ما أنطق به كلما فتحت فمي لأعلن بجرأة سر الإنجيل"]]}, {"l": "Phi 1:19", "n": "", "vs": [[19, "فإنني أعلم أن هذا الأمر سيؤدي إلى الإفراج عني، بفضل صلاتكم وبمعونة روح يسوع المسيح؛"]]}, {"l": "1Th 5:25", "n": "", "vs": [[25, "أيها الإخوة، صلوا لأجلنا."]]}, {"l": "Phm 1:22", "n": "", "vs": [[22, "وفضلا عن هذا، أعد لي عندك مكانا للإقامة، لأني أرجو أن أوهب لكم إجابة لصلواتكم."]]}, {"l": "Heb 13:18", "n": "", "vs": [[18, "صلوا لأجلنا، فنحن مقتنعون بأن لنا ضميرا صالحا وراغبون في أن نحسن التصرف في كل شيء."]]}, {"l": "Heb 13:19", "n": "", "vs": [[19, "وبالأخص، أرجو بإلحاح أن تطلبوا من الله أن يعيدني إليكم في أسرع وقت."]]}], "kwAr": "مصلين معا لأجلنا", "noteAr": ""}, {"kw": "that", "raw": "1Co_16:9; 2Co_2:12; 2Th_3:1, 2Th_3:2; Rev_3:7, Rev_3:8", "note": "", "refs": [{"l": "1Co 16:9", "n": "", "vs": [[9, "لأن بابا كبيرا وفعالا قد انفتح لي، والمقاومون كثيرون!"]]}, {"l": "2Co 2:12", "n": "", "vs": [[12, "ولما وصلت إلى مدينة ترواس لأجل إنجيل المسيح، وفتح لي الرب بابا للخدمة"]]}, {"l": "2Th 3:1", "n": "", "vs": [[1, "وبعد، أيها الإخوة، صلوا لأجلنا، لتنتشر كلمة الرب بسرعة وتتمجد كما هي الحال عندكم،"]]}, {"l": "2Th 3:2", "n": "", "vs": [[2, "ولينقذنا الله من الناس الأردياء الأشرار، لأن الإيمان ليس من نصيب الجميع."]]}, {"l": "Rev 3:7", "n": "", "vs": [[7, "واكتب إلى ملاك الكنيسة في فيلادلفيا: إليك ما يقوله القدوس الحق، الذي بيده مفتاح داود، يفتح ولا أحد يغلق، ويغلق ولا أحد يفتح."]]}, {"l": "Rev 3:8", "n": "", "vs": [[8, "إني عالم بأعمالك. فمع أن لك قوة ضئيلة، فقد أطعت كلمتي ولم تنكر اسمي، ولذلك فتحت لك بابا لا يقدر أحد أن يغلقه."]]}], "kwAr": "كي يفتح لنا الله", "noteAr": ""}, {"kw": "a door", "raw": "The term door is used metaphorically for an entrance to any business, or occasion or opportunity of doing any thing; and consequently a door of utterance is an opportunity of preaching the gospel successfully. See the parallel texts.", "note": "The term door is used metaphorically for an entrance to any business, or occasion or opportunity of doing any thing; and consequently a door of utterance is an opportunity of preaching the gospel successfully. See the parallel texts.", "refs": [], "kwAr": "بابا للكلمة", "noteAr": "تُستعمل كلمة «باب» مجازيًا لمدخل إلى أي عمل، أو لمناسبة أو فرصة لفعل شيء؛ وعليه فـ«باب للكلام» هو فرصة للتبشير بالإنجيل بنجاح. انظر النصوص الموازية."}, {"kw": "the mystery", "raw": "Col_1:26, Col_2:2, Col_2:3; Mat_13:11; 1Co_4:1; Eph_6:19", "note": "", "refs": [{"l": "Col 1:26", "n": "", "vs": [[26, "السر الذي كان مكتوما طوال العصور والأجيال، ولكن كشف الآن لقديسيه،"]]}, {"l": "Col 2:2", "n": "", "vs": [[2, "بغرض أن تتشجع قلوبهم وتكون كلها متحدة في المحبة، لبلوغ الإدراك التام بكل غناه، لمعرفة سر الله، أي المسيح،"]]}, {"l": "Col 2:3", "n": "", "vs": [[3, "المخزونة فيه كنوز الحكمة والمعرفة كلها."]]}, {"l": "Mat 13:11", "n": "", "vs": [[11, "فأجاب: «لأنه قد أعطي لكم أن تعرفوا أسرار ملكوت السماوات؛ أما أولئك، فلم يعط لهم ذلك."]]}, {"l": "1Co 4:1", "n": "", "vs": [[1, "فلينظر إلينا الناس باعتبارنا خداما للمسيح ووكلاء على أسرار الله."]]}, {"l": "Eph 6:19", "n": "", "vs": [[19, "ولأجلي كي ألهم ما أنطق به كلما فتحت فمي لأعلن بجرأة سر الإنجيل"]]}], "kwAr": "بسر المسيح", "noteAr": ""}, {"kw": "for", "raw": "Eph_3:1, Eph_4:1, Eph_6:20; Phi_1:7, Phi_1:13, Phi_1:14; 2Ti_1:16, 2Ti_2:9", "note": "", "refs": [{"l": "Eph 3:1", "n": "", "vs": [[1, "لهذا السبب، أنا بولس سجين المسيح يسوع لأجلكم أنتم الأمم …"]]}, {"l": "Eph 4:1", "n": "", "vs": [[1, "... إذن، أنا السجين في الرب، أناشدكم أن تسلكوا سلوكا يليق بالدعوة التي إليها دعيتم،"]]}, {"l": "Eph 6:20", "n": "", "vs": [[20, "الذي أنا سفيره المقيد بالسلاسل، فأكون جريئا في إعلانه كما يجب أن أتكلم به."]]}, {"l": "Phi 1:7", "n": "", "vs": [[7, "كما أن من الحق أن يكون لي هذا الشعور تجاهكم جميعا، لأني أحتفظ بكم في قلبي، لكونكم جميعا شركاء لي في النعمة، سواء أكان في قيودي أم في الدفاع عن الإنجيل وتثبيته."]]}, {"l": "Phi 1:13", "n": "", "vs": [[13, "حتى إنه قد صار معروفا لدى الحرس الإمبراطوري كله ولدى الباقين جميعا أن قيودي إنما هي لأجل المسيح؛"]]}, {"l": "Phi 1:14", "n": "", "vs": [[14, "كما أن أكثر الإخوة، وقد صاروا واثقين بالرب بسبب قيودي، يجرؤون على التبشير بكلمة الله دون خوف."]]}, {"l": "2Ti 1:16", "n": "", "vs": [[16, "ليرحم الرب عائلة أونيسيفورس، لأنه كثيرا ما أنعشني، ولم يخجل بقيودي،"]]}, {"l": "2Ti 2:9", "n": "", "vs": [[9, "الذي لأجل التبشير به أقاسي حتى القيود كأني فاعل شر. إلا أن كلمة الله لا تكبلها القيود."]]}], "kwAr": "الذي من أجله أنا مقيد", "noteAr": ""}], "arS": [["مصلين", ["G4336"]], [" ", []], ["معا", ["G260"]], [" لأجلنا أيضا، كي ", []], ["يفتح", ["G455"]], [" لنا ", []], ["الله", ["G2316"]], [" ", []], ["بابا", ["G2374"]], [" ", []], ["للكلمة", ["G3056"]], ["، ", []], ["فنتكلم", ["G2980"]], [" ", []], ["بسر", ["G3466"]], [" ", []], ["المسيح", ["G5547"]], [" الذي من أجله أنا ", []], ["مقيد", ["G1210"]], [" أيضا،", []]]}, {"c": 4, "v": 4, "text": "حتى أعلنه كما يجب أن أتكلم به.", "groups": [{"kw": "I may", "raw": "Mat_10:26, Mat_10:27; Act_4:29; 2Co_3:12, 2Co_4:1-4", "note": "", "refs": [{"l": "Mat 10:26", "n": "", "vs": [[26, "فلا تخافوهم: لأنه ما من محجوب لن يكشف، وما من خفي لن يعلن!"]]}, {"l": "Mat 10:27", "n": "", "vs": [[27, "ما أقوله لكم في الظلام، قولوه في النور؛ وما تسمعونه همسا، نادوا به على السطوح."]]}, {"l": "Act 4:29", "n": "", "vs": [[29, "والآن انظر، يارب، إلى تهديدهم، وهبنا نحن عبيدك أن نعلن كلامك بكل جرأة،"]]}, {"l": "2Co 3:12", "n": "", "vs": [[12, "فإذ لنا هذا الرجاء الوطيد، نعمل بكثير من الجرأة."]]}, {"l": "2Co 4:1-4", "n": "", "vs": [[1, "فما دامت لنا إذن هذه الخدمة برحمة من الله، فلا تخور عزيمتنا."], [2, "ولكننا قد رفضنا الأساليب الخفية المخجلة، إذ لا نسلك في المكر، ولا نزور كلمة الله، بل بإعلاننا للحق نمدح أنفسنا لدى ضمير كل إنسان، أمام الله."], [3, "ولكن إن كان إنجيلنا محجوبا، فإنما هو محجوب لدى الهالكين، لدى غير المؤمنين"], [4, "الذين أعمى إله هذا العالم أذهانهم حتى لا يضيء لهم نور الإنجيل المختص بمجد المسيح الذي هو صورة الله."]]}], "kwAr": "حتى أعلنه", "noteAr": ""}, {"kw": "as", "raw": "Col_4:6; Act_5:29; 1Co_2:4, 1Co_2:5; 2Co_2:14-17; Eph_6:20", "note": "", "refs": [{"l": "Col 4:6", "n": "", "vs": [[6, "ليكن كلامكم دائما مصحوبا بالنعمة، وليكن مصلحا بملح، فتعرفوا كيف يجب أن تجيبوا كل واحد."]]}, {"l": "Act 5:29", "n": "", "vs": [[29, "فأجاب بطرس والرسل: «ينبغي أن يطاع الله لا الناس!"]]}, {"l": "1Co 2:4", "n": "", "vs": [[4, "ولم يقم كلامي وتبشيري على الإقناع بكلام الحكمة، بل على ما يعلنه الروح والقدرة."]]}, {"l": "1Co 2:5", "n": "", "vs": [[5, "وذلك لكي يتأسس إيمانكم لا على حكمة الناس، بل على قدرة الله."]]}, {"l": "2Co 2:14-17", "n": "", "vs": [[14, "ولكن، شكرا لله الذي يقودنا دائما في موكب النصر في المسيح، وينشر بنا رائحة معرفته في كل مكان."], [15, "فإننا رائحة المسيح الطيبة المرتفعة إلى الله، المنتشرة على السواء عند الذين يخلصون وعند الذين يهلكون:"], [16, "هؤلاء يشمون فيها رائحة من الموت وإلى الموت، وأولئك رائحة من الحياة وإلى الحياة. ومن هو صاحب الكفاءة لتأدية هذه الأمور؟"], [17, "فإننا لا نتاجر بكلمة الله كما يفعل الكثيرون، وإنما بإخلاص ومن قبل الله، وأمام الله، نتكلم في المسيح."]]}, {"l": "Eph 6:20", "n": "", "vs": [[20, "الذي أنا سفيره المقيد بالسلاسل، فأكون جريئا في إعلانه كما يجب أن أتكلم به."]]}], "kwAr": "كما يجب أن أتكلم به", "noteAr": ""}], "arS": [["حتى ", []], ["أعلنه", ["G5319"]], [" كما ", []], ["يجب", ["G1163"]], [" أن ", []], ["أتكلم", ["G2980"]], [" به.", []]]}, {"c": 4, "v": 5, "text": "تصرفوا بحكمة مع الذين هم من خارج الكنيسة، مستغلين الوقت أحسن استغلال.", "groups": [{"kw": "Walk", "raw": "Col_3:16; Psa_90:12; Mat_10:16; Rom_16:19; 1Co_14:19-25; Eph_5:15-17; Jam_1:5, Jam_3:13, Jam_3:17", "note": "", "refs": [{"l": "Col 3:16", "n": "", "vs": [[16, "لتسكن كلمة المسيح في داخلكم بغنى، في كل حكمة، معلمين وواعظين بعضكم بعضا، مرنمين بمزامير وتسابيح وأناشيد روحية في قلوبكم لله، رافعين له الحمد."]]}, {"l": "Psa 90:12", "n": "", "vs": [[12, "علمنا إحصاء أيامنا، لعلنا نتعقل بقلب حكيم."]]}, {"l": "Mat 10:16", "n": "", "vs": [[16, "ها أنا أرسلكم مثل الخراف بين الذئاب، فكونوا متنبهين كالحيات ومسالمين كالحمام."]]}, {"l": "Rom 16:19", "n": "", "vs": [[19, "إن خبر طاعتكم قد بلغ الجميع. ولذلك أفرح بكم، ولكن أريد لكم أن تكونوا حكماء في ما هو خير، وبسطاء في ما هو شر."]]}, {"l": "1Co 14:19-25", "n": "", "vs": [[19, "ولكن، حيث أكون في الكنيسة، أفضل أن أقول خمس كلمات بعقلي، لكي أعلم بها الآخرين أيضا، على أن أقول عشرة آلاف كلمة بلغة مجهولة."], [20, "أيها الإخوة، لا تكونوا أولادا في التفكير، بل كونوا أطفالا في الشر. وأما في التفكير، فكونوا راشدين."], [21, "فإنه قد كتب في الشريعة: «بأناس ذوي لغات أخرى، وبشفاه غريبة، سأكلم هذا الشعب؛ ولكن، حتى هكذا، لن يسمعوا لي، يقول الرب»."], [22, "إذن التكلم بلغات مجهولة هو علامة لا لأجل الذين يؤمنون، بل لأجل غير المؤمنين. وأما التنبؤ، فليس لغير المؤمنين، بل للذين يؤمنون."], [23, "فإن اجتمعت الكنيسة كلها معا، وأخذ الجميع يتكلمون بلغات مجهولة، ثم دخل بعض قليلي الخبرة أو غير المؤمنين، أفلا يقولون إنكم مجانين؟"], [24, "ولكن، إن كان الجميع يتنبأون، ثم دخل واحد من غير المؤمنين أو قليلي الخبرة، فإنه يقتنع من الجميع، ويحكم عليه من قبل الجميع،"], [25, "وإذ تنكشف خبايا قلبه، يخر على وجهه ساجدا لله، معترفا بأن الله فيكم حقا."]]}, {"l": "Eph 5:15-17", "n": "", "vs": [[15, "فانتبهوا تماما إذن كيف تسلكون بتدقيق، لا سلوك الجهلاء بل سلوك العقلاء،"], [16, "مستغلين الوقت أحسن استغلال، لأن الأيام شريرة."], [17, "لذلك لا تكونوا أغبياء، بل افهموا ما هي مشيئة الرب."]]}, {"l": "Jam 1:5", "n": "", "vs": [[5, "وإن كان أحد منكم بحاجة إلى الحكمة، فليطلب من الله الذي يعطي الجميع بسخاء ولا يعير. فسيعطى له."]]}, {"l": "Jam 3:13", "n": "", "vs": [[13, "أبينكم بعض الحكماء والفهماء؟ إذن، على هؤلاء أن يسلكوا سلوكا حسنا، مظهرين بأعمالهم تلك الوداعة التي تتصف بها الحكمة (الحقيقية)."]]}, {"l": "Jam 3:17", "n": "", "vs": [[17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}], "kwAr": "تصرفوا بحكمة", "noteAr": ""}, {"kw": "them", "raw": "1Co_5:12, 1Co_5:13; 1Th_4:12; 1Ti_3:7; 1Pe_3:1", "note": "", "refs": [{"l": "1Co 5:12", "n": "", "vs": [[12, "فما لي وللذين خارج (الكنيسة) حتى أدينهم؟ ألستم أنتم تدينون الذين داخلها؟"]]}, {"l": "1Co 5:13", "n": "", "vs": [[13, "أما الذين في الخارج، فالله يدينهم. فاعزلوا من هو شرير من بينكم."]]}, {"l": "1Th 4:12", "n": "", "vs": [[12, "عندئذ تكون سيرتكم حسنة السمعة تجاه الذين من خارج الكنيسة، ولا تكونون في حاجة إلى شيء."]]}, {"l": "1Ti 3:7", "n": "", "vs": [[7, "ومن الضروري أن تكون له شهادة حسنة من الذين في خارج الكنيسة، لكي لا يقع في العار وفي فخ إبليس."]]}, {"l": "1Pe 3:1", "n": "", "vs": [[1, "كذلك، أيتها الزوجات، اخضعن لأزواجكن. حتى وإن كان الزوج غير مؤمن بالكلمة، تجذبه زوجته إلى الإيمان، بتصرفها اللائق دون كلام،"]]}], "kwAr": "الذين هم من خارج الكنيسة", "noteAr": ""}, {"kw": "redeeming", "raw": "Eph_5:16", "note": "", "refs": [{"l": "Eph 5:16", "n": "", "vs": [[16, "مستغلين الوقت أحسن استغلال، لأن الأيام شريرة."]]}], "kwAr": "مستغلين الوقت", "noteAr": ""}], "arS": [["تصرفوا", ["G4043"]], [" ", []], ["بحكمة", ["G4678"]], [" مع الذين هم من ", []], ["خارج", ["G1854"]], [" الكنيسة، ", []], ["مستغلين", ["G1805"]], [" ", []], ["الوقت", ["G2540"]], [" أحسن استغلال.", []]]}, {"c": 4, "v": 6, "text": "ليكن كلامكم دائما مصحوبا بالنعمة، وليكن مصلحا بملح، فتعرفوا كيف يجب أن تجيبوا كل واحد.", "groups": [{"kw": "your", "raw": "Col_3:16; Deu_6:6, Deu_6:7, Deu_11:19; 1Ch_16:24; Psa_37:30,Psa_37:31, Psa_40:9, Psa_40:10, Psa_45:2, Psa_66:16; Psa_71:15-18, Psa_71:23, Psa_71:24, Psa_78:3, Psa_78:4, Psa_105:2, Psa_119:13, Psa_119:46; Pro_10:21, Pro_15:4, Pro_15:7; Pro_16:21-24, Pro_22:17, Pro_22:18, Pro_25:11, Pro_25:12; Ecc_10:12; Mal_3:16-18; Mat_12:34, Mat_12:35; Luk_4:22; Eph_4:29", "note": "", "refs": [{"l": "Col 3:16", "n": "", "vs": [[16, "لتسكن كلمة المسيح في داخلكم بغنى، في كل حكمة، معلمين وواعظين بعضكم بعضا، مرنمين بمزامير وتسابيح وأناشيد روحية في قلوبكم لله، رافعين له الحمد."]]}, {"l": "Deu 6:6", "n": "", "vs": [[6, "وضعوا هذه الكلمات التي أوصيكم بها على قلوبكم،"]]}, {"l": "Deu 6:7", "n": "", "vs": [[7, "وقصوها على أولادكم، وتحدثوا بها حين تجلسون في بيوتكم، وحين تسيرون في الطريق، وحين تنامون، وحين تنهضون."]]}, {"l": "Deu 11:19", "n": "", "vs": [[19, "وعلموها لأولادكم، وتحدثوا بها حين تكونون في بيوتكم، وحين تسيرون في الطريق، وحين تأوون إلى فراشكم، وحين تنهضون،"]]}, {"l": "1Ch 16:24", "n": "", "vs": [[24, "أعلنوا مجده بين الأمم؛ وعجائبه بين الشعوب كلها"]]}, {"l": "Psa 37:30", "n": "", "vs": [[30, "فم الصديق ينطق دائما بالحكمة، ويتفوه بكلام الحق"]]}, {"l": "Psa 37:31", "n": "", "vs": [[31, "شريعة إلهه ثابتة في قلبه، فلا تتقلقل خطواته."]]}, {"l": "Psa 40:9", "n": "", "vs": [[9, "أعلنت برك وسط جماعة شعبك العظيم، وأنت يارب علمت أنني لم ألجم شفتي."]]}, {"l": "Psa 40:10", "n": "", "vs": [[10, "لم أخف برك داخل قلبي، بل أعلنت أمانتك وخلاصك. لم أكتم رحمتك وحقك عن جماعة شعبك العظيم»."]]}, {"l": "Psa 45:2", "n": "", "vs": [[2, "أنت أبرع جمالا من كل بني البشر. انسكبت النعمة على شفتيك، لذلك باركك الله إلى الأبد."]]}, {"l": "Psa 66:16", "n": "", "vs": [[16, "تعالوا اسمعوا ياجميع خائفي الله، فأحدثكم بما فعل لنفسي."]]}, {"l": "Psa 71:15-18", "n": "", "vs": [[15, "أخبر ببرك وخلاصك طول النهار، وإن كانا يفوقان إدراكي."], [16, "أجيء (مؤيدا) بقوة السيد الرب، لأذكر برك وحدك."], [17, "قد علمتني ياالله منذ صباي، فلم أكف لحظة عن إعلان عجائبك."], [18, "لا تتركني في الشيخوخة والشيب ياالله ، حتى أخبر هذا الجيل بأعمال قدرتك، وبقوتك (الجيل) الآتي."]]}, {"l": "Psa 71:23", "n": "", "vs": [[23, "تبتهج شفتاي عندما أرنم لك، وكذلك نفسي التي فديتها."]]}, {"l": "Psa 71:24", "n": "", "vs": [[24, "ويلهج لساني ببرك اليوم كله، لأن الساعين إلى أذيتي يحل حتما بهم الخزي والعار."]]}, {"l": "Psa 78:3", "n": "", "vs": [[3, "سمعناها وعرفناها وحدثنا بها آباؤنا."]]}, {"l": "Psa 78:4", "n": "", "vs": [[4, "لا نكتمها عن أبنائنا بل نخبر الجيل القادم: عن قوة الرب وعجائبه التي صنع."]]}, {"l": "Psa 105:2", "n": "", "vs": [[2, "غنوا له، اشدوا له. حدثوا بكل عجائبه."]]}, {"l": "Psa 119:13", "n": "", "vs": [[13, "بشفتي أعلنت جميع الأحكام التي نطقت بها."]]}, {"l": "Psa 119:46", "n": "", "vs": [[46, "سأتحدث بشهاداتك أمام الملوك ولا يعتريني الخزي،"]]}, {"l": "Pro 10:21", "n": "", "vs": [[21, "كلام الصديق يفيد كثيرين، أما الحمقى فيموتون من سوء الفهم."]]}, {"l": "Pro 15:4", "n": "", "vs": [[4, "اللسان السليم ينعش كشجرة حياة، واعوجاجه يؤدي إلى انكسار الروح."]]}, {"l": "Pro 15:7", "n": "", "vs": [[7, "أقوال شفاه الحكماء تنشر المعرفة، أما قلوب الجهال فتنبع حماقة."]]}, {"l": "Pro 16:21-24", "n": "", "vs": [[21, "الحكيم القلب يدعى فهيما، وعذوبة المنطق تزيد من قوة الإقناع."], [22, "الفطنة ينبوع حياة لصاحبها، وعقاب الجاهل في حماقته."], [23, "عقل الحكيم يرشد فمه، ويزيد منطقه قوة إقناع."], [24, "عذوبة الكلام شهد عسل، حلو للنفس وعافية للجسد."]]}, {"l": "Pro 22:17", "n": "", "vs": [[17, "أرهف أذنك واستمع لكلام الحكماء، وليعزم قلبك على إدراك معرفتي،"]]}, {"l": "Pro 22:18", "n": "", "vs": [[18, "فتطيب إن حفظتها في قرارة نفسك، وأثبتها دائما على شفتيك."]]}, {"l": "Pro 25:11", "n": "", "vs": [[11, "كلمة تقال في أوانها مثل تفاح من ذهب في مصوغ من فضة."]]}, {"l": "Pro 25:12", "n": "", "vs": [[12, "الموبخ الحكيم لأذن صاغية مثل قرط من ذهب وحلي من إبريز."]]}, {"l": "Ecc 10:12", "n": "", "vs": [[12, "كلمات فم الرجل الحكيم مفعمة بالنعمة، أما أقوال شفتي الأحمق فتبتلعه."]]}, {"l": "Mal 3:16-18", "n": "", "vs": [[16, "ثم حدث خائفو الرب بعضهم بعضا. فأصغى الرب إلى كلامهم وسمعهم، فتم تدوين أسماء متقي الرب والمتأملين باسمه أمامه في كتاب تذكرة، ورد فيه:"], [17, "سيكونون لي، يقول الرب القدير، في اليوم الذي أصنع فيه نفائسي، وأحافظ عليهم كما يحافظ الوالد على ابنه الذي يخدمه."], [18, "فتشرعون ثانية في التمييز بين الصالح والطالح، بين من يعبد الله ومن لا يعبده»."]]}, {"l": "Mat 12:34", "n": "", "vs": [[34, "ياأولاد الأفاعي، كيف تقدرون، وأنتم أشرار، أن تتكلموا كلاما صالحا؟ لأن الفم يتكلم بما يفيض به القلب."]]}, {"l": "Mat 12:35", "n": "", "vs": [[35, "فالإنسان الصالح، من الكنز الصالح في قلبه، يصدر ما هو صالح. والإنسان الشرير، يصدر ما هو شرير."]]}, {"l": "Luk 4:22", "n": "", "vs": [[22, "وشهد له جميع الحاضرين، متعجبين من كلام النعمة الخارج من فمه، وتساءلوا: «أليس هذا ابن يوسف؟»"]]}, {"l": "Eph 4:29", "n": "", "vs": [[29, "لا تخرج من أفواهكم كلمة فاسدة، بل الكلام الصالح للبنيان الذي تدعو إليه الحاجة، كي يعطي السامعين نعمة."]]}], "kwAr": "ليكن كلامكم دائما مصحوبا بالنعمة", "noteAr": ""}, {"kw": "seasoned", "raw": "Lev_2:13; 2Ki_2:20-22; Mat_5:13; Mar_9:50", "note": "", "refs": [{"l": "Lev 2:13", "n": "", "vs": [[13, "عليك أن تملح تقدماتك. إياك أن تخلي تقدمتك من ملح عهد إلهك. مع جميع تقدماتك قرب ملحا."]]}, {"l": "2Ki 2:20-22", "n": "", "vs": [[20, "فقال: «أحضروا لي صحنا، وضعوا فيه ملحا». فأتوا إليه بما طلب."], [21, "فاتجه نحو نبع الماء وطرح فيه الملح، وقال: «هذا ما تكلم به الرب: لقد أبرأت هذه المياه فلن تسبب الموت أو الجدب بعد الآن»."], [22, "فبرئت المياه إلى هذا اليوم، كما أنبأ أليشع."]]}, {"l": "Mat 5:13", "n": "", "vs": [[13, "أنتم ملح الأرض. فإذا فسد الملح، فماذا يعيد إليه ملوحته؟ إنه لا يعود يصلح لشيء إلا لأن يطرح خارجا لتدوسه الناس!"]]}, {"l": "Mar 9:50", "n": "", "vs": [[50, "الملح جيد، ولكن إذا فقد الملح ملوحته، فبماذا تعيدون إليه طعمه؟ فليكن لكم ملح في أنفسكم، وكونوا مسالمين بعضكم لبعض! »"]]}], "kwAr": "مصلحا بملح", "noteAr": ""}, {"kw": "how", "raw": "Pro_26:4, Pro_26:5; Luke 20:20-40; 1Pe_3:15", "note": "", "refs": [{"l": "Pro 26:4", "n": "", "vs": [[4, "لا تجب الجاهل بمثل حمقه لئلا تصبح مثله."]]}, {"l": "Pro 26:5", "n": "", "vs": [[5, "رد على الجاهل حسب جهله لئلا يضحى حكيما في عيني نفسه."]]}, {"l": "Luk 20:20-40", "n": "", "vs": [[20, "فجعلوا يراقبونه، وبثوا حوله جواسيس يتظاهرون أنهم أبرار، لكي يمسكوه بكلمة يقولها، فيسلموه إلى قضاء الحاكم وسلطته."], [21, "فقالوا يسألونه: «يامعلم، نعلم أنك تتكلم وتعلم بالصدق، فلا تراعي مقامات الناس، بل تعلم طريق الله بالحق:"], [22, "أفيحل لنا أن ندفع الجزية للقيصر، أم لا؟»"], [23, "فأدرك مكرهم، وقال لهم:"], [24, "«أروني دينارا: لمن الصورة والنقش عليه؟» فأجابوا: «للقيصر!»"], [25, "فقال لهم: «إذن، أعطوا ما للقيصر للقيصر، وما لله لله»."], [26, "فلم يتمكنوا من الإيقاع به أمام الشعب بكلمة يقولها، فسكتوا مدهوشين مما سمعوا."], [27, "وتصدى له بعض الصدوقيين الذين ينكرون أمر القيامة، وسألوه قائلين:"], [28, "«يامعلم، كتب لنا موسى: إن مات لأحد أخ متزوج وليس له ولد، فعلى أخيه أن يتزوج بأرملته ويقيم نسلا على اسم أخيه."], [29, "فقد كان هناك سبعة إخوة، اتخذ أولهم زوجة ثم مات دون ولد،"], [30, "فتزوج الثاني بالأرملة،"], [31, "ثم اتخذها الثالث ... حتى تزوج بها السبعة وماتوا دون أن يخلفوا ولدا."], [32, "ومن بعدهم جميعا ماتت المرأة أيضا."], [33, "ففي القيامة لمن منهم تكون المرأة زوجة، فقد كانت زوجة لكل من السبعة»."], [34, "فرد عليهم يسوع قائلا: «أبناء الزمان الحاضر يزوجون ويزوجون."], [35, "أما الذين حسبوا أهلا للمشاركة في الزمان الآتي والقيامة من بين الأموات، فلا يزوجون ولا يزوجون."], [36, "إذ لا يمكن أن يموتوا أيضا بعد ذلك، لأنهم يكونون مثل الملائكة، وهم أبناء الله لكونهم أبناء القيامة."], [37, "وأما أن الموتى يقومون، فحتى موسى أشار إلى ذلك في الحديث عن العليقة، حيث يدعو الرب إله إبراهيم وإله إسحق وإله يعقوب."], [38, "ولكن الله ليس إله أموات بل هو إله أحياء، فإن الجميع يحيون لديه!»"], [39, "فقال بعض الكتبة: «يامعلم، أحسنت الكلام!»"], [40, "ولم يجرؤ أحد بعد ذلك من جهة مشيئة الله كلها."]]}, {"l": "Eph 6:21", "n": "", "vs": [[21, "ولكي تعرفوا أحوالي وأخبار عملي، فإن تيخيكس، الأخ الحبيب والخادم الأمين في الرب، يخبركم بها جميعا."]]}, {"l": "Phi 2:25", "n": "", "vs": [[25, "إلا أني رأيت من الضروري أن أرسل إليكم أبفروديتس، أخي ومعاوني ورفيقي في التجند، والمرسل من قبلكم عاملا على سد حاجتي،"]]}], "kwAr": "الأخ الحبيب", "noteAr": ""}, {"kw": "a faithful", "raw": "1Co_4:1-4", "note": "", "refs": [{"l": "1Co 4:1-4", "n": "", "vs": [[1, "فلينظر إلينا الناس باعتبارنا خداما للمسيح ووكلاء على أسرار الله."], [2, "والمطلوب من الوكلاء، قبل كل شيء، أن يوجد كل منهم أمينا."], [3, "أما أنا، فأقل ما أهتم به هو أن يتم الحكم في من قبلكم أو من قبل محكمة بشرية. بل أنا بذاتي لست أحكم على نفسي."], [4, "فإن ضميري لا يؤنبني بشيء، ولكني لست أعتمد ذلك لتبرير نفسي. فإن الذي يحكم في هو الرب."]]}], "kwAr": "والخادم الأمين", "noteAr": ""}], "arS": [["أما ", []], ["أحوالي", ["G1691"]], [" ", []], ["كلها", ["G3956"]], ["، ", []], ["فسيخبركم", ["G1107"]], [" بها ", []], ["تيخيكس", ["G5190"]], ["، ", []], ["الأخ", ["G80"]], [" ", []], ["الحبيب", ["G27"]], [" ", []], ["والخادم", ["G1249"]], [" ", []], ["الأمين", ["G4103"]], [" ", []], ["ورفيقنا العبد", ["G4889"]], [" في ", []], ["الرب", ["G2962"]], ["،", []]]}, {"c": 4, "v": 8, "text": "فإياه قد أرسلت إليكم لهذا الغرض عينه، لتعرفوا أحوالنا ويشجع قلوبكم،", "groups": [{"kw": "I have", "raw": "1Co_4:17; 2Co_12:18; Eph_6:22; Phi_2:28; 1Th_3:5", "note": "", "refs": [{"l": "1Co 4:17", "n": "", "vs": [[17, "لهذا السبب عينه أرسلت إليكم تيموثاوس، ابني الحبيب الأمين في الرب، فهو يذكركم بطرقي في السلوك في المسيح كما أعلم بها في كل مكان في جميع الكنائس."]]}, {"l": "2Co 12:18", "n": "", "vs": [[18, "التمست من تيطس أن يتوجه إليكم، وأرسلت معه ذلك الأخ، فهل غنم منكم تيطس شيئا؟ ألم نتصرف معكم، أنا وتيطس، بروح واحد وخطوات واحدة؟"]]}, {"l": "Eph 6:22", "n": "", "vs": [[22, "وقد أرسلته إليكم لهذا الأمر بعينه: لتعرفوا أحوالي فتتشجع قلوبكم."]]}, {"l": "Phi 2:28", "n": "", "vs": [[28, "لذلك عجلت كثيرا في إرساله إليكم، حتى إذا رأيتموه من
