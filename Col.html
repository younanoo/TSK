هذه الخطايا", "noteAr": ""}, {"kw": "children", "raw": "Isa_57:4; Eze_16:45, Eze_16:46; Eph_2:2, Eph_2:3; 1Pe_1:14; 2Pe_2:14 *Gr.", "note": "", "refs": [{"l": "Isa 57:4", "n": "", "vs": [[4, "بمن تسخرون؟ وعلى من تفغرون أشداقكم واسعة وتدلعون ألسنتكم؟ ألستم أنتم أبناء الخطاة والمنافقين؟"]]}, {"l": "Eze 16:45", "n": "", "vs": [[45, "فأنت ابنة أمك التي كرهت زوجها وأبناءها، وأنت شقيقة أخواتك اللواتي عفن رجالهن وأبناءهن. فأمكن حثية وأبوكن أموري."]]}, {"l": "Eze 16:46", "n": "", "vs": [[46, "وأختك الكبرى هي السامرة المقيمة مع بناتها إلى الشمال منك، وأختك الصغرى هي سدوم المقيمة مع بناتها إلى الجنوب منك."]]}, {"l": "Eph 2:2", "n": "", "vs": [[2, "التي كنتم تسلكون فيها حسب مسرى هذا العالم، تابعين رئيس قوات الهواء، ذلك الروح العامل الآن في أبناء العصيان،"]]}, {"l": "Eph 2:3", "n": "", "vs": [[3, "الذين بينهم نحن أيضا كنا نسلك سابقا في شهوات جسدنا، عاملين ما يريده الجسد والأفكار، وكنا بالطبيعة أولاد الغضب كالآخرين أيضا."]]}, {"l": "1Pe 1:14", "n": "", "vs": [[14, "وبما أنكم صرتم أولادا لله مطيعين له، فلا تعودوا إلى مجاراة الشهوات التي كانت تسيطر عليكم سابقا في أيام جهلكم."]]}, {"l": "2Pe 2:14", "n": "*Gr.", "vs": [[14, "عيونهم لا تنظر إلا نظرات الزنى، ولا تشبع من الخطيئة. وكم من نفوس ضعيفة تقع في فخاخهم! أما قلوبهم، فقد تدربت على الشهوة والطمع. إنهم حقا أبناء اللعنة!"]]}], "kwAr": "ينزل غضب الله", "noteAr": ""}], "arS": [["فبسبب هذه الخطايا ينزل ", []], ["غضب", ["G3709"]], [" ", []], ["الله", ["G2316"]], ["،", []]]}, {"c": 3, "v": 7, "text": "وفيها سلكتم في الماضي، حين كنتم تعيشون فيها.", "groups": [{"kw": "", "raw": "Col_2:13; Rom_6:19, Rom_6:20, Rom_7:5; 1Co_6:11; Eph_2:2; Tit_3:3; 1Pe_4:3, 1Pe_4:4", "note": "", "refs": [{"l": "Col 2:13", "n": "", "vs": [[13, "فأنتم، إذ كنتم أمواتا في الخطايا وعدم ختانكم الجسدي، أحياكم جميعا معه؛ مسامحا لنا جميعا بالخطايا كلها."]]}, {"l": "Rom 6:19", "n": "", "vs": [[19, "أتكلم بشريا هنا بسبب ضعفكم البشري. فكما قدمتم سابقا أعضاءكم عبيدا للنجاسة والإثم في خدمة الإثم، كذلك قدموا الآن أعضاءكم عبيدا للبر في خدمة القداسة."]]}, {"l": "Rom 6:20", "n": "", "vs": [[20, "فإنكم، لما كنتم عبيدا للخطيئة، كنتم أحرارا من البر."]]}, {"l": "Rom 7:5", "n": "", "vs": [[5, "فعندما كنا في الجسد، كانت أهواء الخطايا المعلنة في الشريعة عاملة في أعضائنا لكي نثمر للموت."]]}, {"l": "1Co 6:11", "n": "", "vs": [[11, "وهكذا كان بعضكم، إلا أنكم قد اغتسلتم، بل تقدستم، بل تبررتم، باسم الرب يسوع المسيح وبروح إلهنا."]]}, {"l": "Eph 2:2", "n": "", "vs": [[2, "التي كنتم تسلكون فيها حسب مسرى هذا العالم، تابعين رئيس قوات الهواء، ذلك الروح العامل الآن في أبناء العصيان،"]]}, {"l": "Tit 3:3", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."]]}, {"l": "1Pe 4:3", "n": "", "vs": [[3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}, {"l": "1Pe 4:4", "n": "", "vs": [[4, "ورفاقكم في تلك العيشة سابقا يستغربون أنكم لا تركضون معهم إلى فيض هذه الخلاعة، ويجرحون سمعتكم."]]}], "kwAr": "", "noteAr": ""}], "arS": [["وفيها ", []], ["سلكتم", ["G4043"]], [" في ", []], ["الماضي", ["G4218"]], ["، حين كنتم ", []], ["تعيشون", ["G2198"]], [" فيها.", []]]}, {"c": 3, "v": 8, "text": "وأما الآن، فانزعوا عنكم، أنتم أيضا، هذه الخطايا كلها: الغضب، النقمة، الخبث، التجديف، الكلام القبيح الخارج من أفواهكم.", "groups": [{"kw": "put", "raw": "Col_3:5, Col_3:9; Eph_4:22; Heb_12:1; Jam_1:21; 1Pe_2:1", "note": "", "refs": [{"l": "Col 3:5", "n": "", "vs": [[5, "فأميتوا إذن أعضاءكم الأرضية: الزنى، النجاسة، جموح العاطفة، الشهوة الرديئة، والاشتهاء النهم الذي هو عبادة أصنام."]]}, {"l": "Col 3:9", "n": "", "vs": [[9, "لا يكذب أحدكم على الآخر، إذ قد نزعتم الإنسان العتيق وأعماله"]]}, {"l": "Eph 4:22", "n": "", "vs": [[22, "وهو أن تخلعوا ما يتعلق بسيرتكم الماضية: الإنسان العتيق الذي يفسد نفسه بالشهوات الخداعة؛"]]}, {"l": "Heb 12:1", "n": "", "vs": [[1, "فبما أن هذا العدد الكبير من الشاهدين للإيمان، يتجمع حولنا كأنه سحابة عظيمة، فلنطرح جانبا كل ثقل يعيقنا عن التقدم، ونتخلص من تلك الخطيئة التي نتعرض للسقوط في فخها بسهولة، لكي نتمكن، نحن أيضا، أن نركض باجتهاد في السباق الممتد أمامنا،"]]}, {"l": "Jam 1:21", "n": "", "vs": [[21, "إذن، تخلصوا من كل ما في حياتكم من نجاسة وشر متزايد. وليكن قبولكم لتلك الكلمة التي غرسها الله في قلوبكم، قبولا وديعا. فهي القادرة أن تخلص نفوسكم."]]}, {"l": "1Pe 2:1", "n": "", "vs": [[1, "لذلك، تخلصوا من كل أثر للشر والخداع والرياء والحسد والذم."]]}], "kwAr": "فانزعوا عنكم", "noteAr": ""}, {"kw": "anger", "raw": "Psa_37:8; Pro_17:14, Pro_19:19, Pro_29:22; Mat_5:22; Rom_13:13; 1Co_3:3; 2Co_12:20; Gal_5:15, Gal_5:20,Gal_5:26; Eph_4:26, Eph_4:31, Eph_4:32; 2Ti_2:23, 2Ti_2:24; Jam_1:20; Jam_3:14-16", "note": "", "refs": [{"l": "Psa 37:8", "n": "", "vs": [[8, "كف عن الغضب، وانبذ السخط، ولا تتهور لئلا تفعل الشر."]]}, {"l": "Pro 17:14", "n": "", "vs": [[14, "بداية الخصام كتفجر المياه، فاترك الخصام قبل انفجاره."]]}, {"l": "Pro 19:19", "n": "", "vs": [[19, "الجامح الغضب يدفع ثمن جموحه، وإن كبحته أو اعترضته فإنك تزيده سوءا"]]}, {"l": "Pro 29:22", "n": "", "vs": [[22, "الإنسان الغضوب يثير النزاع، والرجل السخوط كثير المعاصي."]]}, {"l": "Mat 5:22", "n": "", "vs": [[22, "أما أنا فأقول لكم: كل من هو غاضب على أخيه، يستحق المحاكمة؛ ومن يقول لأخيه: ياتافه! يستحق المثول أمام المجلس الأعلى؛ ومن يقول: ياأحمق! يستحق نار جهنم!"]]}, {"l": "Rom 13:13", "n": "", "vs": [[13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."]]}, {"l": "1Co 3:3", "n": "", "vs": [[3, "فإنكم مازلتم جسديين. فمادام بينكم حسد وخصام (وانقسام)، أفلا تكونون جسديين وتسلكون وفقا للبشر؟"]]}, {"l": "2Co 12:20", "n": "", "vs": [[20, "فإني أخشى أن آتي إليكم فأجدكم في حالة لا أريدها وتجدوني في حالة لا تريدونها! أي أن يكون بينكم كثير من النزاع والحسد والحقد والتحزب والتجريح والنميمة والتكبر والبلبلة."]]}, {"l": "Gal 5:15", "n": "", "vs": [[15, "فإذا كنتم تنهشون وتفترسون بعضكم بعضا، فاحذروا أن يفني أحدكم الآخر!"]]}, {"l": "Gal 5:20", "n": "", "vs": [[20, "وعبادة الأصنام والسحر، والعداوة والنزاع والغيرة والغضب، والتحزب والانقسام والتعصب،"]]}, {"l": "Gal 5:26", "n": "", "vs": [[26, "لا نكن طامحين إلى المجد الباطل، يستفز بعضنا بعضا، ويحسد أحدنا الآخر!"]]}, {"l": "Eph 4:26", "n": "", "vs": [[26, "إن غضبتم، فلا تخطئوا؛ لا تدعوا الشمس تغيب وأنتم غاضبون،"]]}, {"l": "Eph 4:31", "n": "", "vs": [[31, "انزعوا عنكم كل حقد ونقمة وغضب وصخب وسباب وكل شر."]]}, {"l": "Eph 4:32", "n": "", "vs": [[32, "وكونوا لطفاء بعضكم نحو بعض، شفوقين، مسامحين بعضكم بعضا كما سامحكم الله في المسيح."]]}, {"l": "2Ti 2:23", "n": "", "vs": [[23, "أما المجادلات الغبية الحمقاء، فتجنبها، عالما أنها تولد المشاجرات."]]}, {"l": "2Ti 2:24", "n": "", "vs": [[24, "وعبد الرب يجب ألا يتشاجر، بل أن يكون مترفقا تجاه الجميع، قادرا على التعليم، يتحمل المشقات بصبر،"]]}, {"l": "Jam 1:20", "n": "", "vs": [[20, "لأن الإنسان، إذا غضب، لا يعمل الصلاح الذي يريده الله ."]]}, {"l": "Jam 3:14-16", "n": "", "vs": [[14, "أما إن كانت قلوبكم مملوءة بمرارة الحسد وبالتحزب، فلا تفتخروا بحكمتكم، ولا تنكروا الحق."], [15, "إن هذه الحكمة التي تدعونها ليست نازلة من عند الله، بل هي «حكمة» أرضية بشرية شيطانية."], [16, "فحيث تكون مرارة الحسد والتحزب، ينتشر الخلاف والفوضى وجميع الشرور."]]}], "kwAr": "الغضب", "noteAr": ""}, {"kw": "blasphemy", "raw": "Lev_24:11-16; Mar_7:22; 1Ti_1:13, 1Ti_1:20; Jam_2:7; Jud_1:8; Rev_16:9", "note": "", "refs": [{"l": "Lev 24:11-16", "n": "", "vs": [[11, "فجدف ابن الإسرائيلية، المدعوة شلومية بنت دبري، من سبط دان على اسم الرب وسبه، فأحضروه إلى موسى،"], [12, "وزجوه في السجن ريثما يصدر الرب حكمه عليه."], [13, "فقال الرب لموسى:"], [14, "«خذ الشاتم إلى خارج المخيم، واجعل جميع الذين سمعوا تجديفه يضعون أيديهم على رأسه، ويرجمه كل الشعب."], [15, "وقل لبني إسرائيل: كل من شتم إلهه يعاقب بذنبه."], [16, "ومن جدف على اسم الرب يقتل، إذ يرجمه الشعب رجما، الغريب كالإسرائيلي يعاقب بالقتل عند تجديفه على اسم الرب."]]}, {"l": "Mar 7:22", "n": "", "vs": [[22, "الزنى، الطمع، الخبث، الخداع، العهارة، العين الشريرة، التجديف، الكبرياء، الحماقة"]]}, {"l": "1Ti 1:13", "n": "", "vs": [[13, "مع أني كنت في الماضي مجدفا عليه، ومضطهدا ومهينا له! ولكني عوملت بالرحمة، لأني عملت ما عملته عن جهل وفي عدم إيمان."]]}, {"l": "1Ti 1:20", "n": "", "vs": [[20, "ومن هؤلاء همنايوس وإسكندر، وقد سلمتهما إلى الشيطان ليتعلما بالتأديب ألا يجدفا."]]}, {"l": "Jam 2:7", "n": "", "vs": [[7, "وهم الذين يستهزئون بالمسيح الذي تحملون اسمه الجميل؟"]]}, {"l": "Jud 1:8", "n": "", "vs": [[8, "ومع ذلك، فإن أولئك المعلمين المتوهمين يسيرون في الطريق التي سار فيها أهل تلك المدن. إذ يلوثون أجسادهم بالنجاسة، ويحتقرون السيادة الإلهية، ويتكلمون بالإهانة على الكائنات المجيدة!"]]}, {"l": "Rev 16:9", "n": "", "vs": [[9, "فاحترق الناس من الحر الشديد. ولكنهم لم يتوبوا ليمجدوا الله ، بل جدفوا على اسم الله صاحب السلطة على هذه البلايا."]]}], "kwAr": "التجديف", "noteAr": ""}, {"kw": "filthy", "raw": "Eph_4:29, Eph_5:4; Jam_3:4-6; 2Pe_2:7, 2Pe_2:18; Jud_1:8, Jud_1:13", "note": "", "refs": [{"l": "Eph 4:29", "n": "", "vs": [[29, "لا تخرج من أفواهكم كلمة فاسدة، بل الكلام الصالح للبنيان الذي تدعو إليه الحاجة، كي يعطي السامعين نعمة."]]}, {"l": "Eph 5:4", "n": "", "vs": [[4, "وكذلك البذاءة والكلام السفيه والهزل، فهي غير لائقة. وإنما أحرى بكم أن تلهجوا بالشكر لله!"]]}, {"l": "Jam 3:4-6", "n": "", "vs": [[4, "ومهما كانت السفينة كبيرة والرياح التي تدفعها قوية وهوجاء، فبدفة صغيرة جدا يتحكم الربان فيها ويسوقها إلى الجهة التي يريد. كذلك اللسان أيضا: فهو عضو صغير،"], [5, "ولكن ما أشد فعاليته! انظروا: إن شرارة صغيرة تحرق غابة كبيرة!"], [6, "واللسان كالنار خطرا: فهو وحده، بين أعضاء الجسم، جامع للشرور كلها، ويلوث الجسم كله بالفساد. إنه يشعل دائرة الكون، ويستمد ناره من جهنم!"]]}, {"l": "2Pe 2:7", "n": "", "vs": [[7, "ولكنه أنقذ لوطا البار، الذي كان متضايقا جدا من سلوك أشرار زمانه في الدعارة."]]}, {"l": "2Pe 2:18", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."]]}, {"l": "Jud 1:8", "n": "", "vs": [[8, "ومع ذلك، فإن أولئك المعلمين المتوهمين يسيرون في الطريق التي سار فيها أهل تلك المدن. إذ يلوثون أجسادهم بالنجاسة، ويحتقرون السيادة الإلهية، ويتكلمون بالإهانة على الكائنات المجيدة!"]]}, {"l": "Jud 1:13", "n": "", "vs": [[13, "وبأعمالهم المخجلة يفضحون أنفسهم كأمواج في البحر هائجة تقذف الأوساخ. وهم أشبه بنجوم تائهة في الفضاء، مصيرها الظلام الشديد إلى الأبد!"]]}], "kwAr": "الكلام القبيح", "noteAr": ""}], "arS": [["وأما ", []], ["الآن", ["G3570"]], ["، ", []], ["فانزعوا", ["G659"]], [" عنكم، أنتم أيضا، هذه الخطايا كلها: ", []], ["الغضب", ["G3709"]], ["، ", []], ["النقمة", ["G2372"]], ["، ", []], ["الخبث", ["G2549"]], ["، ", []], ["التجديف", ["G988"]], ["، ", []], ["الكلام القبيح", ["G148"]], [" الخارج من ", []], ["أفواهكم", ["G4750"]], [".", []]]}, {"c": 3, "v": 9, "text": "لا يكذب أحدكم على الآخر، إذ قد نزعتم الإنسان العتيق وأعماله", "groups": [{"kw": "Lie", "raw": "Lev_19:11; Isa_63:8; Jer_9:3-5; Zep_3:13; Zec_8:16; Joh_8:44; Eph_4:25; 1Ti_1:10; Tit_1:12, Tit_1:13; Rev_21:8, Rev_21:27, Rev_22:15", "note": "", "refs": [{"l": "Lev 19:11", "n": "", "vs": [[11, "لا تسرق، ولا تكذب، ولا تغدر بصاحبك،"]]}, {"l": "Isa 63:8", "n": "", "vs": [[8, "لأنه قال: إنهم حقا شعبي وأبناء أوفياء، لن يعودوا للباطل. فخلصهم."]]}, {"l": "Jer 9:3-5", "n": "", "vs": [[3, "«قد وتروا ألسنتهم كقسي جاهزة ليطلقوا الأكاذيب التي تقولوا بها في الأرض من دون الحق، إذ أنهم انتهوا من شر إلى شر، وإياي لم يعرفوا» يقول الرب."], [4, "«ليحترس كل واحد من جاره، ولا يثق بأحد من أقربائه، لأن كل قريب مخادع، وكل صاحب واش."], [5, "كل واحد منهم يخدع جاره ولا ينطقون بالصدق. دربوا ألسنتهم على قول الكذب، وأرهقوا أنفسهم في ارتكاب الإثم."]]}, {"l": "Zep 3:13", "n": "", "vs": [[13, "ولن يرتكب بقية إسرائيل الإثم، ولا ينطقون بالكذب، وليس في أفواههم غش، بل يعيشون آمنين من غير أن يهددهم أحد."]]}, {"l": "Zec 8:16", "n": "", "vs": [[16, "وهذا ما عليكم أن تفعلوه: لا تكذبوا بعضكم على بعض، واحكموا في ساحات قضائكم بالعدل وأحكام السلام."]]}, {"l": "Joh 8:44", "n": "", "vs": [[44, "إنكم أولاد أبيكم إبليس، وترغبون أن تعملوا شهوات أبيكم. فهو من البدء كان قاتلا للناس، ولم يثبت في الحق لأنه خال من الحق! وعندما ينطق بالكذب فهو ينضح بما فيه، لأنه كذاب وأبو الكذب!"]]}, {"l": "Eph 4:25", "n": "", "vs": [[25, "لذلك اخلعوا عنكم الكذب، وتكلموا بالصدق كل واحد مع قريبه، لأننا أعضاء بعضنا لبعض."]]}, {"l": "1Ti 1:10", "n": "", "vs": [[10, "والزناة ومضاجعي الذكور، وخطافي الناس والكذابين وشاهدي الزور. وذوي كل شر آخر يخالف التعليم الصحيح"]]}, {"l": "Tit 1:12", "n": "", "vs": [[12, "وقد قال واحد منهم، وهو عندهم نبي خاص بهم: «أهل كريت دائما كذابون، وحوش شرسة، نهمون كسالى»."]]}, {"l": "Tit 1:13", "n": "", "vs": [[13, "وهذه شهادة صدق. لذلك كن متشددا في توبيخهم، ليكونوا أصحاء في الإيمان،"]]}, {"l": "Rev 21:8", "n": "", "vs": [[8, "أما الجبناء وغير المؤمنين، والفاسدون والقاتلون والزناة، والمتصلون بالشياطين وعبدة الأصنام وجميع الدجالين، فمصيرهم إلى البحيرة المتقدة بالنار والكبريت، الذي هو الموت الثاني»."]]}, {"l": "Rev 21:27", "n": "", "vs": [[27, "ولن يدخلها شيء نجس، ولا الذين يعملون القبائح ويدجلون، بل فقط الذين كتبت أسماؤهم في سجل الحياة للحمل!"]]}, {"l": "Rev 22:15", "n": "", "vs": [[15, "أما في خارج المدينة، فهنالك الكلاب والمتصلون بالشياطين، والزناة والقتلة، وعبدة الأصنام والدجالون ومحبو التدجيل!"]]}], "kwAr": "لا يكذب أحدكم على الآخر", "noteAr": ""}, {"kw": "ye", "raw": "Col_3:8; Rom_6:6; Eph_4:22", "note": "", "refs": [{"l": "Col 3:8", "n": "", "vs": [[8, "وأما الآن، فانزعوا عنكم، أنتم أيضا، هذه الخطايا كلها: الغضب، النقمة، الخبث، التجديف، الكلام القبيح الخارج من أفواهكم."]]}, {"l": "Rom 6:6", "n": "", "vs": [[6, "فنحن نعلم هذا: أن الإنسان العتيق فينا قد صلب معه لكي يبطل جسد الخطيئة فلا نبقى عبيدا للخطيئة فيما بعد."]]}, {"l": "Eph 4:22", "n": "", "vs": [[22, "وهو أن تخلعوا ما يتعلق بسيرتكم الماضية: الإنسان العتيق الذي يفسد نفسه بالشهوات الخداعة؛"]]}], "kwAr": "إذ قد نزعتم الإنسان العتيق", "noteAr": ""}], "arS": [["لا ", []], ["يكذب", ["G5574"]], [" أحدكم على الآخر، إذ قد ", []], ["نزعتم", ["G554"]], [" ", []], ["الإنسان", ["G444"]], [" ", []], ["العتيق", ["G3820"]], [" ", []], ["وأعماله", ["G4234"]]]}, {"c": 3, "v": 10, "text": "ولبستم الجديد الذي يتجدد لبلوغ تمام المعرفة وفقا لصورة خالقه،", "groups": [{"kw": "put", "raw": "Col_3:12, Col_3:14; Job_29:14; Isa_52:1, Isa_59:17; Rom_13:12, Rom_13:14; 1Co_15:53, 1Co_15:54; Gal_3:27; Eph_4:24", "note": "", "refs": [{"l": "Col 3:12", "n": "", "vs": [[12, "فباعتباركم جماعة مختارة من الله، قديسين محبوبين، البسوا دائما عواطف الحنان واللطف والتواضع والوداعة وطول البال،"]]}, {"l": "Col 3:14", "n": "", "vs": [[14, "وفوق هذا كله البسوا المحبة، فهي رابطة الكمال."]]}, {"l": "Job 29:14", "n": "", "vs": [[14, "ارتديت البر فكساني، وكجبة وعمامة كان عدلي."]]}, {"l": "Isa 52:1", "n": "", "vs": [[1, "استيقظي، استيقظي تسربلي بقوتك ياصهيون، ارتدي ثياب بهائك ياأورشليم، المدينة المقدسة، إذ لن يدخلك بعد اليوم أغلف ولا نجس."]]}, {"l": "Isa 59:17", "n": "", "vs": [[17, "فتدرع بالبر وارتدى على رأسه خوذة الخلاص، واكتسى بثياب الانتقام، والتف بعباءة الغضب."]]}, {"l": "Rom 13:12", "n": "", "vs": [[12, "كاد الليل أن ينتهي والنهار أن يطلع. فلنطرح أعمال الظلام، ونلبس سلاح النور"]]}, {"l": "Rom 13:14", "n": "", "vs": [[14, "وإنما البسوا الرب يسوع المسيح (تمثلوا به)، ولا تنشغلوا بالتدبير للجسد لقضاء شهواته."]]}, {"l": "1Co 15:53", "n": "", "vs": [[53, "فلابد لهذا الجسم القابل للانحلال أن يلبس عدم انحلال، ولهذا الفاني أن يلبس خلودا."]]}, {"l": "1Co 15:54", "n": "", "vs": [[54, "وبعد أن يلبس هذا المنحل عدم انحلال، وهذا الفاني خلودا، تتم الكلمة التي قد كتبت: «ابتلع الموت في النصر!»"]]}, {"l": "Gal 3:27", "n": "", "vs": [[27, "لأنكم، جميع الذين تعمدتم في المسيح، قد لبستم المسيح."]]}, {"l": "Eph 4:24", "n": "", "vs": [[24, "وتلبسوا الإنسان الجديد المخلوق على مثال الله في البر والقداسة بالحق."]]}], "kwAr": "ولبستم", "noteAr": ""}, {"kw": "the new", "raw": "Eze_11:19, Eze_18:31, Eze_36:26; 2Co_5:17; Gal_6:15; Eph_2:10,Eph_2:15, Eph_4:24; Rev_21:5", "note": "", "refs": [{"l": "Eze 11:19", "n": "", "vs": [[19, "وأعطيهم جميعا قلبا واحدا، وأجعل في داخلهم روحا جديدا، وأزيل قلب الحجر من لحمهم. وأستبدله بقلب من لحم،"]]}, {"l": "Eze 18:31", "n": "", "vs": [[31, "اطرحوا عنكم كل ذنوبكم التي ارتكبتموها، واحصلوا لأنفسكم على قلب جديد وروح جديدة. فلماذا تنقرضون ياشعب إسرائيل؟"]]}, {"l": "Eze 36:26", "n": "", "vs": [[26, "وأهبكم قلبا جديدا، وأضع في داخلكم روحا جديدة، وأنتزع من لحمكم قلب الحجر وأعطيكم عوضا عنه قلب لحم."]]}, {"l": "2Co 5:17", "n": "", "vs": [[17, "فإنه إذا كان أحد في المسيح، فهو خليقة جديدة: إن الأشياء القديمة قد زالت، وها كل شيء قد صار جديدا."]]}, {"l": "Gal 6:15", "n": "", "vs": [[15, "فليس الختان بشيء، ولا عدم الختان بشيء، وإنما (المهم أن يصير الإنسان) خليقة جديدة."]]}, {"l": "Eph 2:10", "n": "", "vs": [[10, "فإننا نحن تحفة الله، وقد خلقنا في المسيح يسوع لأعمال صالحة أعدها سلفا لنسلك فيها."]]}, {"l": "Eph 2:15", "n": "", "vs": [[15, "أي العداء: إذ أبطل بجسده شريعة الوصايا ذات الفرائض، لكي يكون من الفريقين إنسانا واحدا جديدا، إذ أحل السلام بينهما،"]]}, {"l": "Eph 4:24", "n": "", "vs": [[24, "وتلبسوا الإنسان الجديد المخلوق على مثال الله في البر والقداسة بالحق."]]}, {"l": "Rev 21:5", "n": "", "vs": [[5, "وقال الجالس على العرش: «سأصنع كل شيء جديدا». ثم قال لي: «اكتب هذا، فإن ما أقوله هو الصدق والحق»."]]}], "kwAr": "الجديد", "noteAr": ""}, {"kw": "renewed", "raw": "Psa_51:10; Rom_12:2; Eph_4:23; Heb_6:6", "note": "", "refs": [{"l": "Psa 51:10", "n": "", "vs": [[10, "قلبا نقيا اخلق في ياالله وروحا مستقيما جدد في داخلي."]]}, {"l": "Rom 12:2", "n": "", "vs": [[2, "ولا تتكيفوا مع هذا العالم، بل تغيروا بتجديد الذهن، لتميزوا ما هي إرادة الله الصالحة المقبولة الكاملة."]]}, {"l": "Eph 4:23", "n": "", "vs": [[23, "وتتجددوا في روح ذهنكم؛"]]}, {"l": "Heb 6:6", "n": "", "vs": [[6, "ثم ارتدوا إلى تلك الأسس القديمة، أولئك يستحيل عليهم أن يتجددوا ثانية فيعودوا إلى التوبة. فهم يجنون على أنفسهم إذ يصلبون ابن الله مرة ثانية ويجعلونه عرضة للعار."]]}], "kwAr": "الذي يتجدد", "noteAr": ""}, {"kw": "knowledge", "raw": "Joh_17:3; 2Co_3:18, 2Co_4:6; 1Jo_2:3, 1Jo_2:5", "note": "", "refs": [{"l": "Joh 17:3", "n": "", "vs": [[3, "والحياة الأبدية هي أن يعرفوك أنت الإله الحق وحدك، والذي أرسلته: يسوع المسيح."]]}, {"l": "2Co 3:18", "n": "", "vs": [[18, "ونحن جميعا فيما ننظر إلى مجد الرب بوجوه كالمرآة لا حجاب عليها، نتجلى من مجد إلى مجد لنشابه الصورة الواحدة عينها، وذلك بفعل الرب الروح."]]}, {"l": "2Co 4:6", "n": "", "vs": [[6, "فإن الله ، الذي أمر أن يشرق نور من الظلام، هو الذي جعل النور يشرق في قلوبنا، لإشعاع معرفة مجد الله المتجلي في وجه المسيح."]]}, {"l": "1Jo 2:3", "n": "", "vs": [[3, "وما يؤكد لنا أننا قد عرفنا المسيح حقا هو أن نعمل بوصاياه."]]}, {"l": "1Jo 2:5", "n": "", "vs": [[5, "أما الذي يعمل بحسب كلمة المسيح، فإن محبة الله تكون قد اكتملت في داخله. بهذا نعرف أننا ننتمي إلى المسيحِ."]]}], "kwAr": "تمام المعرفة", "noteAr": ""}, {"kw": "after", "raw": "Gen_1:26, Gen_1:27; Eph_2:10, Eph_4:23, Eph_4:24; 1Pe_1:14, 1Pe_1:15", "note": "", "refs": [{"l": "Gen 1:26", "n": "", "vs": [[26, "ثم قال الله : «لنصنع الإنسان على صورتنا، كمثالنا، فيتسلط على سمك البحر، وعلى طير السماء، وعلى الأرض، وعلى كل زاحف يزحف عليها»."]]}, {"l": "Gen 1:27", "n": "", "vs": [[27, "فخلق الله الإنسان على صورته. على صورة الله خلقه. ذكرا وأنثى خلقهم."]]}, {"l": "Eph 2:10", "n": "", "vs": [[10, "فإننا نحن تحفة الله، وقد خلقنا في المسيح يسوع لأعمال صالحة أعدها سلفا لنسلك فيها."]]}, {"l": "Eph 4:23", "n": "", "vs": [[23, "وتتجددوا في روح ذهنكم؛"]]}, {"l": "Eph 4:24", "n": "", "vs": [[24, "وتلبسوا الإنسان الجديد المخلوق على مثال الله في البر والقداسة بالحق."]]}, {"l": "1Pe 1:14", "n": "", "vs": [[14, "وبما أنكم صرتم أولادا لله مطيعين له، فلا تعودوا إلى مجاراة الشهوات التي كانت تسيطر عليكم سابقا في أيام جهلكم."]]}, {"l": "1Pe 1:15", "n": "", "vs": [[15, "وإنما اسلكوا سلوكا مقدسا في كل أمر، مقتدين بالقدوس الذي دعاكم،"]]}], "kwAr": "وفقا لصورة خالقه", "noteAr": ""}], "arS": [["ولبستم", ["G1746"]], [" ", []], ["الجديد", ["G3501"]], [" الذي ", []], ["يتجدد", ["G341"]], [" لبلوغ تمام ", []], ["المعرفة", ["G1922"]], [" ", []], ["وفقا", ["G2596"]], [" ", []], ["لصورة", ["G1504"]], [" ", []], ["خالقه", ["G2936"]], ["،", []]]}, {"c": 3, "v": 11, "text": "وفيه لا فرق بين يوناني ويهودي، أو مختون وغير مختون، أو متحضر ومتخلف، أو عبد وحر، بل المسيح هو الكل وفي الكل.", "groups": [{"kw": "there", "raw": "Psa_117:2; Isa_19:23-25, Isa_49:6, Isa_52:10, Isa_66:18-22; Jer_16:19; Hos_2:23; Amo_9:12; Mic_4:2; Zec_2:11, Zec_8:20-23; Mal_1:11; Mat_12:18-21; Act_10:34, Act_10:35, Act_13:46-48, Act_15:17, Act_26:17, Act_26:18; Rom_3:29, Rom_4:10,Rom_4:11, Rom_9:24-26; Rom_9:30,Rom_9:31, Rom_10:12, Rom_15:9-13; 1Co_12:13; Gal_3:28; Eph_3:6", "note": "", "refs": [{"l": "Psa 117:2", "n": "", "vs": [[2, "لأن رحمته غلبت علينا، وأمانة الرب إلى الأبد تدوم. هللويا!"]]}, {"l": "Isa 19:23-25", "n": "", "vs": [[23, "في ذلك اليوم يمتد طريق من مصر إلى أشور، ومن أشور إلى مصر، فيعبد المصريون والأشوريون الرب معا."], [24, "في ذلك اليوم يكون إسرائيل ثالث ثلاثة مع مصر وأشور، وبركة في وسط الأرض،"], [25, "فيباركهم الرب القدير قائلا: «مبارك شعبي مصر، وصنعة يدي أشور، وميراثي إسرائيل»."]]}, {"l": "Isa 49:6", "n": "", "vs": [[6, "لكم هو يسير أن تكون لي عبدا لتستنهض أسباط يعقوب، وترد من نجيت من إسرائيل، لذلك سأجعلك نورا للأمم لتكون خلاصي إلى أقصى الأرض."]]}, {"l": "Isa 52:10", "n": "", "vs": [[10, "شمر الرب عن ذراع قدسه أمام عيون كل الأمم، فترى أقاصي الأرض خلاص إلهنا."]]}, {"l": "Isa 66:18-22", "n": "", "vs": [[18, "ولأني عالم بأعمالهم وأفكارهم فأنا مزمع أن آتي لأجمع كل الأمم والألسنة، فيتوافدون ويرون مجدي"], [19, "وأجعل بينهم آية وأبعث بعض الناجين منهم إلى الأمم: إلى ترشيش، وفول، ولود، المهرة في رمي السهام، وإلى توبال وياوان وإلى الجزائر البعيدة ممن لم يسمعوا بشهرتي أو يروا مجدي، فيذيعون مجدي بين الأمم."], [20, "ويحضرون جميع إخوتكم من سائر الأمم، تقدمة للرب، على متون الجياد، وفي المركبات والهوادج، وعلى ظهور البغال وأسنمة الجمال، إلى أورشليم جبل قدسي، كما يحضر الإسرائيليون تقدمة الحنطة في آنية طاهرة إلى بيت الرب"], [21, "ومنهم أصطفي كهنة ولاويين يقول الرب."], [22, "لأنه كما تدوم أمامي السماوات الجديدة والأرض الجديدة التي أنا أصنعها هكذا تدوم ذريتكم وذكركم."]]}, {"l": "Jer 16:19", "n": "", "vs": [[19, "يارب أنت عزي وحصني وملاذي في يوم الضيق، إليك تقبل الأمم من أقاصي الأرض قائلة: «لم يرث آباؤنا سوى الباطل والأكاذيب وما لا جدوى منه."]]}, {"l": "Hos 2:23", "n": "", "vs": [[23, "وأزرع شعبي في الأرض لنفسي، وأرحم لورحامة (أي: لا رحمة)، وأقول: للوعمي (أي: ليس شعبي) أنت شعبي، فيقول: أنت إلهي»."]]}, {"l": "Amo 9:12", "n": "", "vs": [[12, "لكي يرث إسرائيل ما تبقى من أدوم وجميع الأمم التي دعي اسمي عليها، يقول الرب صانع هذه الأمور."]]}, {"l": "Mic 4:2", "n": "", "vs": [[2, "وتقبل إليه أمم كثيرة قائلة: «تعالوا لنصعد إلى جبل الرب، إلى هيكل يعقوب ليعلمنا طرقه فنسلك في سبله، لأن من صهيون تخرج الشريعة ومن أورشليم تذاع كلمة الرب»."]]}, {"l": "Zec 2:11", "n": "", "vs": [[11, "فتنضم أمم كثيرة في ذلك اليوم إلى الرب ويكونون لي شعبا، فأقيم في وسطك، فتدركين أن الرب القدير قد أرسلني إليك."]]}, {"l": "Zec 8:20-23", "n": "", "vs": [[20, "وستأتي شعوب أيضا وأفواج من سكان مدن كثيرة إلى أورشليم."], [21, "ويمضي أهل المدينة الواحدة إلى المدينة الأخرى قائلين: هيا نذهب على الفور لنطلب رضى وجه الرب القدير ونلتمس بركته، لأننا على أي حال منطلقون إلى هناك."], [22, "فتتوافد أمم كثيرة وشعوب قوية ليلتمسوا وجه الرب القدير في أورشليم وليحظوا برضاه."], [23, "في تلك الأيام يتشبث عشرة رجال من أبناء الأمم بثوب رجل يهودي قائلين: دعنا نذهب معكم، لأننا سمعنا أن الرب معكم»."]]}, {"l": "Mal 1:11", "n": "", "vs": [[11, "لأنه من مشرق الشمس إلى مغربها اسمي عظيم بين الأمم، وفي كل مكان يحرق لاسمي بخور وذبائح طاهرة، لأن اسمي عظيم بين الأمم، يقول الرب القدير."]]}, {"l": "Mat 12:18-21", "n": "", "vs": [[18, "«ها هو فتاي الذي اخترته، حبيبي الذي سرت به نفسي! سأضع روحي عليه، فيعلن العدل للأمم."], [19, "لا يخاصم ولا يصرخ، ولا يسمع أحد صوته في الشوارع."], [20, "قصبة مرضوضة لا يكسر، وفتيلة مدخنة لا يطفيء، حتى يقود العدل إلى النصر،"], [21, "وعلى اسمه تعلق الأمم رجاءها! »"]]}, {"l": "Act 10:34", "n": "", "vs": [[34, "فبدأ بطرس كلامه قائلا: «تبين لي فعلا أن الله لا يفضل أحدا على أحد،"]]}, {"l": "Act 10:35", "n": "", "vs": [[35, "بل يقبل من يتقيه ويعمل الصلاح مهما كانت جنسيته."]]}, {"l": "Act 13:46-48", "n": "", "vs": [[46, "فخاطبهم بولس وبرنابا بجرأة قائلين: «كان يجب أن نبلغكم أنتم أولا كلمة الله، ولكنكم رفضتموها فأظهرتم أنكم لا تستحقون الحياة الأبدية. وها نحن نتوجه إلى غير اليهود!"], [47, "فقد أوصانا الرب قائلا: قد جعلتك نورا للأمم، لتكون سبيل خلاص إلى أقصى الأرض!»"], [48, "فلما سمع غير اليهود ذلك، فرحوا جدا، ومجدوا كلمة الرب. وآمن جميع من أعدهم الله للحياة الأبدية."]]}, {"l": "Act 15:17", "n": "", "vs": [[17, "لكي يسعى إلى الرب باقي الناس وجميع الشعوب التي تحمل اسمي، يقول الرب، فاعل هذه الأمور"]]}, {"l": "Act 26:17", "n": "", "vs": [[17, "وسأنقذك من شعبك ومن الأمم التي أرسلك إليها الآن،"]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "Rom 3:29", "n": "", "vs": [[29, "أو يكون الله إله اليهود وحدهم؟ أما هو إله الأمم أيضا؟ بلى، إنه إله الأمم أيضا،"]]}, {"l": "Rom 4:10", "n": "", "vs": [[10, "ففي أية حالة حسب له ذلك؟ أبعد الختان أم قبل الختان؟"]]}, {"l": "Rom 4:11", "n": "", "vs": [[11, "ثم تلقى إبراهيم علامة الختان ختما للبر الحاصل بالإيمان الذي كان له وهو مازال غير مختون، لكي يكون أبا لجميع الذين يؤمنون من غير المختونين فيحسب البر لهم أيضا،"]]}, {"l": "Rom 9:24-26", "n": "", "vs": [[24, "فينا نحن الذين دعاهم لا من بين اليهود فقط بل من بين الأمم أيضا؟"], [25, "وذلك على حد ما يقول أيضا في نبوءة هوشع: «من لم يكونوا شعبي سأدعوهم شعبي، ومن لم تكن محبوبة سأدعوها محبوبة."], [26, "ويكون أنه حيث قيل لهم: لستم شعبي، فهناك يدعون أبناء الله الحي»."]]}, {"l": "Rom 9:30", "n": "", "vs": [[30, "فما هي خلاصة القول؟ إن الأمم الذين لم يكونوا يسعون وراء البر، قد بلغوا البر، ولكنه البر القائم على أساس الإيمان."]]}, {"l": "Rom 9:31", "n": "", "vs": [[31, "أما إسرائيل، وقد كانوا يسعون وراء شريعة تهدف إلى البر، فقد فشلوا حتى في بلوغ الشريعة."]]}, {"l": "Rom 10:12", "n": "", "vs": [[12, "فلا فرق بين اليهودي واليوناني، لأن للجميع ربا واحدا، غنيا تجاه كل من يدعوه»."]]}, {"l": "Rom 15:9-13", "n": "", "vs": [[9, "وإن الأمم يمجدون الله على الرحمة، وفقا لما قد كتب: «لهذا أعترف لك بين الأمم وأرتل لاسمك!»"], [10, "وأيضا قيل: «افرحوا، أيها الأمم، مع شعبه»."], [11, "وأيضا: «سبحوا الرب ياجميع الأمم، ولتحمده جميع الشعوب»."], [12, "ويقول إشعياء أيضا: «سيطلع أصل يسى، والقائم، ليسود على الأمم: عليه تعلق الشعوب الرجاء»."], [13, "فليملأكم إله الرجاء كل فرح وسلام في إيمانكم حتى تزدادوا رجاء بقوة الروح القدس."]]}, {"l": "1Co 12:13", "n": "", "vs": [[13, "فإننا، بالروح الواحد، قد تعمدنا جميعا لنصير جسدا واحدا، سواء كنا يهودا أم يونانيين، عبيدا أم أحرارا، وقد سقينا جميعا الروح الواحد."]]}, {"l": "Gal 3:28", "n": "", "vs": [[28, "لا فرق بعد الآن بين يهودي ويوناني، أو عبد وحر، أو ذكر وأنثى، لأنكم جميعا واحد في المسيح يسوع."]]}, {"l": "Eph 3:6", "n": "", "vs": [[6, "وهو أن الأمم هم شركاء اليهود في الميراث، وأعضاء في الجسد معهم، ولهم أيضا حق الاستفادة من الوعد. وذلك في المسيح يسوع وبفضل الإنجيل"]]}], "kwAr": "لا فرق", "noteAr": ""}, {"kw": "circumcision", "raw": "1Co_7:19; Gal_5:6, Gal_6:15", "note": "", "refs": [{"l": "1Co 7:19", "n": "", "vs": [[19, "إن الختان ليس شيئا، وعدم الختان ليس شيئا، بل المهم هو العمل بوصايا الله."]]}, {"l": "Gal 5:6", "n": "", "vs": [[6, "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة."]]}, {"l": "Gal 6:15", "n": "", "vs": [[15, "فليس الختان بشيء، ولا عدم الختان بشيء، وإنما (المهم أن يصير الإنسان) خليقة جديدة."]]}], "kwAr": "مختون وغير مختون", "noteAr": ""}, {"kw": "Barbarian", "raw": "Act_28:2, Act_28:4; Rom_1:14; 1Co_14:11", "note": "", "refs": [{"l": "Act 28:2", "n": "", "vs": [[2, "واستقبلنا أهلها الغرباء بعطف كبير قل نظيره. فإذ كان المطر ينهمر والجو باردا، أوقدوا لنا نارا، ورحبوا بنا."]]}, {"l": "Act 28:4", "n": "", "vs": [[4, "ورأى أهل مالطة الأفعى عالقة بيده، فقال بعضهم لبعض: «لابد أن هذا الرجل قاتل، فإن العدل لم يدعه يحيا بعدما نجا من البحر»."]]}, {"l": "Rom 1:14", "n": "", "vs": [[14, "فإن علي دينا لليونانيين والبرابرة، للمتعلمين والجهال."]]}, {"l": "1Co 14:11", "n": "", "vs": [[11, "فإن كنت لا أفهم معنى الأصوات في لغة ما، أكون أجنبيا عند الناطق بها، ويكون هو أجنبيا عندي!"]]}], "kwAr": "متحضر ومتخلف", "noteAr": ""}, {"kw": "bond", "raw": "1Co_7:21, 1Co_7:22; Eph_6:8", "note": "", "refs": [{"l": "1Co 7:21", "n": "", "vs": [[21, "أكنت عبدا حين دعيت؟ فلا يهمك ذلك. لا بل إن سنحت لك الفرصة لتصير حرا، فأحرى بك أن تغتنمها."]]}, {"l": "1Co 7:22", "n": "", "vs": [[22, "فإن من دعي في الرب وهو عبد، صار معتقا للرب. وكذلك أيضا من دعي وهو حر، صار عبدا للمسيح."]]}, {"l": "Eph 6:8", "n": "", "vs": [[8, "فأنتم تعلمون أنه مهما عمل كل واحد من الخير، فسوف ينال المكافأة من الرب، سواء أكان عبدا أم حرا."]]}], "kwAr": "عبد وحر", "noteAr": ""}, {"kw": "but", "raw": "Col_2:10; 1Co_1:29, 1Co_1:30, 1Co_3:21-23; Gal_3:29, Gal_6:14; Phi_3:7-9; 1Jo_5:11, 1Jo_5:12; 2Jo_1:9", "note": "", "refs": [{"l": "Col 2:10", "n": "", "vs": [[10, "وأنتم مكملون فيه. فهو رأس كل رئاسة وسلطة؛"]]}, {"l": "1Co 1:29", "n": "", "vs": [[29, "حتى لا يفتخر أي بشر أمام الله."]]}, {"l": "1Co 1:30", "n": "", "vs": [[30, "وبفضل الله صار لكم مقام في المسيح يسوع الذي جعل لنا حكمة من الله وبرا وقداسة وفداء،"]]}, {"l": "1Co 3:21-23", "n": "", "vs": [[21, "إذن، لا يفتخر أحد بالبشر، لأن كل شيء هو لكم،"], [22, "أبولس أم أبلوس أم بطرس أم العالم أم الحيا ة أم الموت أم الحاضر أم المستقبل: هذه الأمور كلها لكم،"], [23, "وأنتم للمسيح، والمسيح لله."]]}, {"l": "Gal 3:29", "n": "", "vs": [[29, "فإذا كنتم للمسيح، فأنتم إذن نسل إبراهيم وحسب الوعد وارثون."]]}, {"l": "Gal 6:14", "n": "", "vs": [[14, "أما أنا فحاشا لي أن أفتخر إلا بصليب ربنا يسوع المسيح، الذي به أصبح العالم بالنسبة لي مصلوبا، وأنا أصبحت بالنسبة له مصلوبا."]]}, {"l": "Phi 3:7-9", "n": "", "vs": [[7, "ولكن، ما كان لي من ربح، فقد اعتبرته خسارة، من أجل المسيح."], [8, "بل إني أعتبر كل شيء خسارة، من أجل امتياز معرفة المسيح يسوع ربي؛ فمن أجله تحملت خسارة كل شيء، وأعتبر كل شيء نفاية، لكي أربح المسيح"], [9, "ويكون لي فيه مقام، إذ ليس لي بري الذاتي القائم على أساس الشريعة، بل البر الآتي من الإيمان بالمسيح، البر الذي من عند الله على أساس الإيمان."]]}, {"l": "1Jo 5:11", "n": "", "vs": [[11, "وهذه الشهادة هي أن الله أعطانا حياة أبدية، وأن هذه الحياة هي في ابنه."]]}, {"l": "1Jo 5:12", "n": "", "vs": [[12, "فمن كان له ابن الله كانت له الحياة. ومن لم يكن له ابن الله، لم تكن له الحياة!"]]}, {"l": "2Jo 1:9", "n": "", "vs": [[9, "لأن من تعدى تعليم المسيح ولم يثبت فيه، فليس الله من نصيبه. أما من يثبت في هذا التعليم، فله الآب والابن معا."]]}], "kwAr": "بل المسيح هو الكل", "noteAr": ""}, {"kw": "and", "raw": "Joh_6:56, Joh_6:57, Joh_14:23, Joh_15:5, Joh_17:23; Rom_8:10,Rom_8:11; Gal_2:20; Eph_1:23, Eph_3:17; 1Jo_5:20", "note": "", "refs": [{"l": "Joh 6:56", "n": "", "vs": [[56, "وكل من يأكل جسدي ويشرب دمي، يثبت في وأنا فيه."]]}, {"l": "Joh 6:57", "n": "", "vs": [[57, "وكما أني أحيا بالآب الحي الذي أرسلني، فكذلك يحيا بي من يأكلني."]]}, {"l": "Joh 14:23", "n": "", "vs": [[23, "أجابه يسوع: «من يحبني يعمل بكلمتي، ويحبه أبي، وإليه نأتي، وعنده نجعل لنا منزلا."]]}, {"l": "Joh 15:5", "n": "", "vs": [[5, "أنا الكرمة وأنتم الأغصان. من يثبت في وأنا فيه، فذاك ينتج ثمرا كثيرا. فإنكم بمعزل عني لا تقدرون أن تفعلوا شيئا."]]}, {"l": "Joh 17:23", "n": "", "vs": [[23, "أنا فيهم، وأنت في، ليكتملوا فيصيروا واحدا، حتى يعرف العالم أنك أرسلتني وأنك أحببتهم كما أحببتني."]]}, {"l": "Rom 8:10", "n": "", "vs": [[10, "وإذا كان المسيح فيكم، فمع أن الجسد مائت بسبب الخطيئة، فإن الروح حياة لكم بسبب البر."]]}, {"l": "Rom 8:11", "n": "", "vs": [[11, "وإذا كان روح الذي أقام يسوع من بين الأموات يسكن فيكم، فإن الذي أقام المسيح من بين الأموات سوف يحيي أيضا أجسادكم الفانية بسبب روحه الذي يسكن فيكم."]]}, {"l": "Gal 2:20", "n": "", "vs": [[20, "مع المسيح صلبت، وفيما بعد لا أحيا أنا بل المسيح يحيا في. أما الحياة التي أحياها الآن في الجسد، فإنما أحياها بالإيمان في ابن الله، الذي أحبني وبذل نفسه عني."]]}, {"l": "Eph 1:23", "n": "", "vs": [[23, "التي هي جسده وكماله، هو الذي يكمل الكل في الكل."]]}, {"l": "Eph 3:17", "n": "", "vs": [[17, "ليسكن المسيح في قلوبكم بالإيمان؛ حتى إذا تأصلتم وتأسستم في المحبة،"]]}, {"l": "1Jo 5:20", "n": "", "vs": [[20, "وإننا نعلم أن ابن الله قد جاء إلى الأرض وأنار أذهاننا لنعرف الإله الحق. ونحن الآن نحيا فيه، لأننا في ابنه يسوع المسيح. هذا هو الإله الحق، والحياة الأبدية."]]}], "kwAr": "وفي الكل", "noteAr": ""}], "arS": [["وفيه لا فرق بين ", []], ["يوناني", ["G1672"]], [" ", []], ["ويهودي", ["G2453"]], ["، أو ", []], ["مختون", ["G4061"]], [" ", []], ["وغير مختون", ["G203"]], ["، أو ", []], ["متحضر", ["G915"]], [" ومتخلف، أو ", []], ["عبد", ["G1401"]], [" ", []], ["وحر", ["G1658"]], ["، بل ", []], ["المسيح", ["G5547"]], [" هو ", []], ["الكل", ["G3956"]], [" وفي ", []], ["الكل", ["G3956"]], [".", []]]}, {"c": 3, "v": 12, "text": "فباعتباركم جماعة مختارة من الله، قديسين محبوبين، البسوا دائما عواطف الحنان واللطف والتواضع والوداعة وطول البال،", "groups": [{"kw": "Put", "raw": "Col_3:10; Eph_4:24", "note": "", "refs": [{"l": "Col 3:10", "n": "", "vs": [[10, "ولبستم الجديد الذي يتجدد لبلوغ تمام المعرفة وفقا لصورة خالقه،"]]}, {"l": "Eph 4:24", "n": "", "vs": [[24, "وتلبسوا الإنسان الجديد المخلوق على مثال الله في البر والقداسة بالحق."]]}], "kwAr": "البسوا", "noteAr": ""}, {"kw": "as", "raw": "Isa_42:1, Isa_45:4, Isa_65:9, Isa_65:22; Mat_24:22, Mat_24:24, Mat_24:31; Mar_13:20,Mar_13:22, Mar_13:27; Luk_18:7; Rom_8:29-33, Rom_9:11, Rom_11:5-7; 2Ti_2:10; Tit_1:1; 1Pe_1:2; 2Pe_1:10; 2Jo_1:13; Rev_17:14", "note": "", "refs": [{"l": "Isa 42:1", "n": "", "vs": [[1, "هوذا عبدي الذي أعضده، مختاري الذي ابتهجت به نفسي. وضعت روحي عليه ليسوس الأمم بالعدل."]]}, {"l": "Isa 45:4", "n": "", "vs": [[4, "لأجل عبدي يعقوب، وإسرائيل مختاري دعوتك باسمك، لقبتك من غير أن تعرفني."]]}, {"l": "Isa 65:9", "n": "", "vs": [[9, "بل أخرج من صلب يعقوب ذرية، ومن يهوذا وارثا لجبالي، فيملكها مختاري، ويقيم فيها عبيدي،"]]}, {"l": "Isa 65:22", "n": "", "vs": [[22, "لا يبنون ليأتي آخر فيسكن فيها، ولا يغرسون كروما ليجنيها آخر، لأن أيام شعبي تكون مديدة كأيام الشجر، ويتمتع مختاري بعمل أيديهم."]]}, {"l": "Mat 24:22", "n": "", "vs": [[22, "ولولا أن تلك الأيام ستختصر، لما كان أحد من البشر ينجو. ولكن من أجل المختارين ستختصر تلك الأيام."]]}, {"l": "Mat 24:24", "n": "", "vs": [[24, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات عظيمة وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Mat 24:31", "n": "", "vs": [[31, "ويرسل ملائكته بصوت بوق عظيم ليجمعوا مختاريه من الجهات الأربع، من أقاصي السماوات إلى أقاصيها."]]}, {"l": "Mar 13:20", "n": "", "vs": [[20, "ولولا أن الرب قد اختصر تلك الأيام، لما كان أحد من البشر ينجو. ولكنه لأجل المختارين الذين اختارهم، قد اختصر تلك الأيام."]]}, {"l": "Mar 13:22", "n": "", "vs": [[22, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Mar 13:27", "n": "", "vs": [[27, "فيرسل عندئذ ملائكته ويجمع مختاريه من الجهات الأربع، من أقصى الأرض إلى أقصى السماء."]]}, {"l": "Luk 18:7", "n": "", "vs": [[7, "أفلا ينصف الله مختاريه الذين يصرخون إليه نهارا وليلا؟ أما يسرع في الاستجابة لهم؟"]]}, {"l": "Rom 8:29-33", "n": "", "vs": [[29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."], [30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."], [31, "فبعد هذا، ماذا نقول؟ مادام الله معنا، فمن يكون علينا؟ ذاك الذي لم يمسك عنا ابنه،"], [32, "بل بذله لأجلنا جميعا، كيف لا يجود علينا معه بكل شيء أيضا؟"], [33, "ومن سيتهم مختاري الله؟ إن الله هو الذي يبرر،"]]}, {"l": "Rom 9:11", "n": "", "vs": [[11, "ولم يكن الولدان قد ولدا بعد ولا فعلا خيرا أو شرا، وذلك كي يبقى قصد الله من جهة الاختيار"]]}, {"l": "Rom 11:5-7", "n": "", "vs": [[5, "فكذلك، في الزمان الحاضر، ماتزال بقية اختارها الله بالنعمة."], [6, "ولكن، بما أن ذلك قد تم بالنعمة، فليس بعد على أساس الأعمال، وإلا فليست النعمة نعمة بعد."], [7, "فما الخلاصة إذا؟ إن ما يسعى إليه إسرائيل لم ينالوه، بل ناله المختارون منهم، والباقون عميت بصائرهم،"]]}, {"l": "2Ti 2:10", "n": "", "vs": [[10, "لهذا السبب أحتمل كل شيء بصبر لأجل الذين اختارهم الله ، لكي يحصلوا، هم أيضا، على الخلاص الذي في المسيح يسوع مع المجد الأبدي."]]}, {"l": "Tit 1:1", "n": "", "vs": [[1, "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"]]}, {"l": "1Pe 1:2", "n": "", "vs": [[2, "بحسب علمه السابق ثم قدسهم بالروح ليطيعوا يسوع المسيح ويطهروا برش دمه عليهم."]]}, {"l": "2Pe 1:10", "n": "", "vs": [[10, "فأحرى بكم إذن، أيها الإخوة، أن تجتهدوا لتثبتوا عمليا أن الله قد دعاكم واختاركم حقا. فإنكم، إن فعلتم هذا، لن تسقطوا أبدا!"]]}, {"l": "2Jo 1:13", "n": "", "vs": [[13, "يسلم عليك أولاد أختك التي اختارها الله ."]]}, {"l": "Rev 17:14", "n": "", "vs": [[14, "ثم يحاربون الحمل، ولكن الحمل يهزمهم، لأنه رب الأرباب وملك الملوك، والذين معه هم المدعوون، المختارون، المؤمنون»."]]}], "kwAr": "جماعة مختارة من الله", "noteAr": ""}, {"kw": "holy", "raw": "Rom_8:29; Eph_1:4; 1Th_1:3-6; 2Th_2:13, 2Th_2:14", "note": "", "refs": [{"l": "Rom 8:29", "n": "", "vs": [[29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."]]}, {"l": "Eph 1:4", "n": "", "vs": [[4, "كما كان قد اختارنا فيه قبل تأسيس العالم، لنكون قديسين بلا لوم أمامه."]]}, {"l": "1Th 1:3-6", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"], [4, "ونحن عالمون، أيها الإخوة أحباء الله، حقيقة اختياركم من قبل الله:"], [5, "لأن تبشيرنا لكم بالإنجيل لم يكن مجرد كلام، بل كان مصحوبا أيضا بالقوة وبالروح القدس وبتمام اليقين. كما أنكم تعلمون تماما ماذا كنا بينكم لأجل مصلحتكم،"], [6, "وقد صرتم مقتدين بنا وبالرب، إذ تقبلتم كلمة الله في وسط ضيقة شديدة بفرح الروح القدس."]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "2Th 2:14", "n": "", "vs": [[14, "فإلى هذا الأمر قد دعاكم ببشارتنا لكم، لنوال مجد ربنا يسوع المسيح."]]}], "kwAr": "قديسين", "noteAr": ""}, {"kw": "beloved", "raw": "Jer_31:3; Eze_16:8; Rom_1:7; Eph_2:4, Eph_2:5; 2Ti_1:9; Tit_3:4-6; 1Jo_4:19", "note": "", "refs": [{"l": "Jer 31:3", "n": "", "vs": [[3, "ظهر لي الرب قائلا: «أحببتكم حبا أبديا، لذلك اجتذبتكم إلي برحمة."]]}, {"l": "Eze 16:8", "n": "", "vs": [[8, "فمررت بك ورأيتك وإذا بك قد بلغت سن الحب، فبسطت عليك أطراف ثوبي، وسترت عورتك وحلفت لك وأبرمت معك عهدا، فصرت لي، يقول السيد الرب."]]}, {"l": "Rom 1:7", "n": "", "vs": [[7, "إلى جميع من هم في روما من أحباء الله القديسين المدعوين. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}, {"l": "Eph 2:4", "n": "", "vs": [[4, "أما الله ، وهو غني في الرحمة، فبسبب محبته العظيمة التي أحبنا بها،"]]}, {"l": "Eph 2:5", "n": "", "vs": [[5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،"]]}, {"l": "Tit 3:4-6", "n": "", "vs": [[4, "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،"], [5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"], [6, "الذي سكبه علينا بغنى بيسوع المسيح مخلصنا."]]}, {"l": "1Jo 4:19", "n": "", "vs": [[19, "ونحن نحب، لأن الله أحبنا أولا."]]}], "kwAr": "محبوبين", "noteAr": ""}, {"kw": "bowels", "raw": "Isa_63:15; Jer_31:20; Luk_1:78 *marg. Phi_1:8, Phi_2:1; 1Jo_3:17", "note": "", "refs": [{"l": "Isa 63:15", "n": "", "vs": [[15, "تطلع من السماء وانظر من مسكنك المقدس والمجيد. أين غيرتك واقتدارك؟ قد امتنع عني لهيب أشواقك وإحساناتك."]]}, {"l": "Jer 31:20", "n": "", "vs": [[20, "هل أفرايم ابن أثير لدي؟ أليس هو ابنا مسرا؟ لأني مع كثرة تنديدي به فإني مازلت أذكره، لذلك يشتاق قلبي إليه، وأكن له الرحمة»، يقول الرب."]]}, {"l": "Luk 1:78", "n": "*marg.", "vs": [[78, "بفضل عواطف الرحمة لدى إلهنا، تلك التي تفقدنا بها الفجر المشرق من العلاء،"]]}, {"l": "Phi 1:8", "n": "", "vs": [[8, "فإن الله شاهد لي كيف أحن إليكم جميعا في عواطف المسيح يسوع."]]}, {"l": "Phi 2:1", "n": "", "vs": [[1, "فما دام لنا التشجيع في المسيح، والتعزية في المحبة، والشركة في الروح، ولنا المراحم والحنو،"]]}, {"l": "1Jo 3:17", "n": "", "vs": [[17, "وأما الذي يملك مالا يمكنه من العيش في بحبوحة، ويقسي قلبه على أحد الإخوة المحتاجين، فكيف تكون محبة الله متأصلة فيه؟"]]}], "kwAr": "عواطف", "noteAr": ""}, {"kw": "mercies", "raw": "Rom_12:9, Rom_12:10; Gal_5:6, Gal_5:22, Gal_5:23; Eph_4:2, Eph_4:32; Phi_2:2-4; 1Th_5:15; Jam_3:17, Jam_3:18; 1Pe_3:8-11; 2Pe_1:5-8; 1Jo_3:14-20", "note": "", "refs": [{"l": "Rom 12:9", "n": "", "vs": [[9, "ولتكن المحبة بلا رياء. انفروا من الشر، والتصقوا بالخير."]]}, {"l": "Rom 12:10", "n": "", "vs": [[10, "أحبوا بعضكم بعضا محبة أخوية، مفضلين بعضكم على بعض في الكرامة."]]}, {"l": "Gal 5:6", "n": "", "vs": [[6, "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة."]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Gal 5:23", "n": "", "vs": [[23, "والوداعة وضبط النفس. وليس من قانون يمنع مثل هذه الفضائل."]]}, {"l": "Eph 4:2", "n": "", "vs": [[2, "بكل تواضع ووداعة وطول بال، محتملين بعضكم بعضا في المحبة،"]]}, {"l": "Eph 4:32", "n": "", "vs": [[32, "وكونوا لطفاء بعضكم نحو بعض، شفوقين، مسامحين بعضكم بعضا كما سامحكم الله في المسيح."]]}, {"l": "Phi 2:2-4", "n": "", "vs": [[2, "فتمموا فرحي بأن يكون لكم رأي واحد ومحبة واحدة ونفس واحدة وفكر واحد."], [3, "لا يكن بينكم شيء بروح التحزب والافتخار الباطل، بل بالتواضع ليعتبر كل واحد منكم غيره أفضل كثيرا من نفسه،"], [4, "مهتما لا بمصلحته الخاصة بل بمصالح الآخرين أيضا."]]}, {"l": "1Th 5:15", "n": "", "vs": [[15, "حذار أن يبادل أحدكم شر غيره بشر مثله بل اسعوا دائما إلى الخير في معاملتكم بعضكم لبعض وللآخرين جميعا."]]}, {"l": "Jam 3:17", "n": "", "vs": [[17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}, {"l": "Jam 3:18", "n": "", "vs": [[18, "والبر هو ثمر ة ما يزرعه في سلام صانعو السلام."]]}, {"l": "1Pe 3:8-11", "n": "", "vs": [[8, "والخلاصة، كونوا جميعا متحدين في الرأي، متعاطفين بعضكم مع بعض، مبادلين أحدكم الآخر المحبة الأخوية، شفوقين، متواضعين."], [9, "لا تبادلوا الشر بشر، ولا الشتيمة بشتيمة. بل بالعكس: باركوا، فترثوا البركة، لأنه لهذا دعاكم الله ."], [10, "فمن أراد أن يتمتع بحياة سعيدة وأيام طيبة، فليمنع لسانه عن الشر وشفتيه عن كلام الغش."], [11, "ليتحول عن الشر ويفعل الخير. ليطلب السلام ويسع للوصول إليه."]]}, {"l": "2Pe 1:5-8", "n": "", "vs": [[5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"], [6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"], [7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."], [8, "فحين تكون هذه الصفات الطيبة في داخلكم، وتزداد بوفرة، تجعلكم مجتهدين ومثمرين في معرفتكم لربنا يسوع المسيح."]]}, {"l": "1Jo 3:14-20", "n": "", "vs": [[14, "إن محبتنا لإخوتنا تبين لنا أننا انتقلنا من الموت إلى الحياة. فالذي لا يحب إخوته، فهو باق في الموت."], [15, "وكل من يبغض أخا له، فهو قاتل. وأنتم تعرفون أن القاتل لا تكون له حياة أبدية ثابتة فيه."], [16, "ومقياس المحبة هو العمل الذي قام به المسيح إذ بذل حياته لأجلنا. فعلينا نحن أيضا أن نبذل حياتنا لأجل إخوتنا."], [17, "وأما الذي يملك مالا يمكنه من العيش في بحبوحة، ويقسي قلبه على أحد الإخوة المحتاجين، فكيف تكون محبة الله متأصلة فيه؟"], [18, "أيها الأولاد الصغار، لا يجب أن تكون محبتنا مجرد ادعاء بالكلام واللسان، بل تكون محبة عملية حقة."], [19, "عندئذ نتأكد أننا نتصرف بحسب الحق، وتطمئن نفوسنا في حضرة الله،"], [20, "ولو لامتنا قلوبنا؛ فإن الله أعظم من قلوبنا، وهو العليم بكل شيء."]]}], "kwAr": "الحنان", "noteAr": ""}], "arS": [["فباعتباركم جماعة ", []], ["مختارة", ["G1588"]], [" من ", []], ["الله", ["G2316"]], ["، ", []], ["قديسين", ["G40"]], [" ", []], ["محبوبين", ["G25"]], ["، ", []], ["البسوا", ["G1746"]], [" دائما ", []], ["عواطف", ["G4698"]], [" ", []], ["الحنان", ["G3628"]], [" ", []], ["واللطف", ["G5544"]], [" ", []], ["والتواضع", ["G5012"]], [" ", []], ["والوداعة", ["G4236"]], [" ", []], ["وطول البال", ["G3115"]], ["،", []]]}, {"c": 3, "v": 13, "text": "محتملين بعضكم بعضا، ومسامحين بعضكم بعضا. إن كان لأحدكم شكوى على آخر، كما سامحكم الرب، هكذا افعلوا أنتم أيضا.", "groups": [{"kw": "Forbearing", "raw": "Rom_15:1, Rom_15:2; 2Co_6:6; Gal_6:2; Eph_4:2, Eph_4:32", "note": "", "refs": [{"l": "Rom 15:1", "n": "", "vs": [[1, "ولكن علينا نحن الأقوياء (في الإيمان)، أن نحتمل ضعف الضعفاء (فيه)، وأن لا نرضي أنفسنا."]]}, {"l": "Rom 15:2", "n": "", "vs": [[2, "فليسع كل واحد منا لإرضاء قريبه من جهة ما هو صالح، في سبيل البنيان."]]}, {"l": "2Co 6:6", "n": "", "vs": [[6, "في الطهارة والمعرفة وطول البال واللطف؛ في الروح القدس والمحبة الخالصة من الرياء؛"]]}, {"l": "Gal 6:2", "n": "", "vs": [[2, "ليحمل الواحد منكم أثقال الآخر، وهكذا تتممون شريعة المسيح."]]}, {"l": "Eph 4:2", "n": "", "vs": [[2, "بكل تواضع ووداعة وطول بال، محتملين بعضكم بعضا في المحبة،"]]}, {"l": "Eph 4:32", "n": "", "vs": [[32, "وكونوا لطفاء بعضكم نحو بعض، شفوقين، مسامحين بعضكم بعضا كما سامحكم الله في المسيح."]]}], "kwAr": "محتملين بعضكم بعضا", "noteAr": ""}, {"kw": "forgiving", "raw": "Mat_5:44, Mat_6:12, Mat_6:14, Mat_6:15, Mat_18:21-35; Mar_11:25; Luk_6:35-37, Luk_11:4, Luk_17:3, Luk_17:4; Luk_23:34; Jam_2:13", "note": "", "refs": [{"l": "Mat 5:44", "n": "", "vs": [[44, "أما أنا فأقول لكم: أحبوا أعداءكم، وباركوا لاعنيكم، وأحسنوا معاملة الذين يبغضونكم، وصلوا لأجل الذين يسيئون إليكم ويضطهدونكم،"]]}, {"l": "Mat 6:12", "n": "", "vs": [[12, "واغفر لنا ذنوبنا، كما نغفر نحن للمذنبين إلينا!"]]}, {"l": "Mat 6:14", "n": "", "vs": [[14, "فإن غفرتم للناس زلاتهم، يغفر لكم أبوكم السماوي زلاتكم."]]}, {"l": "Mat 6:15", "n": "", "vs": [[15, "وإن لم تغفروا للناس، لا يغفر لكم أبوكم السماوي زلاتكم."]]}, {"l": "Mat 18:21-35", "n": "", "vs": [[21, "عندئذ تقدم إليه بطرس وسأله: «يارب، كم مرة يخطيء إلي أخي فأغفر له؟ هل إلى سبع مرات؟»"], [22, "فأجابه يسوع: «لا إلى سبع مرات، بل إلى سبعين سبع مرات!"], [23, "لهذا السبب، يشبه ملكوت السماوات بإنسان ملك أراد أن يحاسب عبيده."], [24, "فلما شرع يحاسبهم، أحضر إليه واحد مديون بعشرة آلاف وزنة."], [25, "وإذ لم يكن عنده ما يوفي به دينه، أمر سيده بأن يباع هو وزوجته وأولاده وكل ما يملك ليوفي الدين."], [26, "لكن العبد خر أمامه ساجدا وقائلا: ياسيد، أمهلني فأوفي لك الدين كله."], [27, "فأشفق سيد ذلك العبد عليه، فأطلق سراحه، وسامحه بالدين."], [28, "«ولكن لما خرج ذلك العبد، قصد واحدا من زملائه العبيد كان مديونا له بمئة دينار. فقبض عليه وأخذ بخناقه قائلا: أوفني ما عليك!"], [29, "فخر زميله العبد أمامه وقال متوسلا: أمهلني فأوفيك!"], [30, "فلم يقبل بل مضى وألقاه في السجن حتى يوفي ما عليه."], [31, "وإذ شاهد زملاؤه العبيد ما جرى، حزنوا جدا، فمضوا وأخبروا سيدهم بكل ما جرى."], [32, "فاستدعاه سيده وقال له: أيها العبد الشرير، ذلك الدين كله سامحتك به لأنك توسلت إلي."], [33, "أفما كان يجب أن ترحم زميلك العبد كما رحمتك أنا؟"], [34, "وإذ ثار غضب سيده عليه، دفعه إلى الجلادين ليعذبوه حتى يوفي كل ما عليه."], [35, "هكذا يفعل بكم أبي السماوي إن لم يغفر كل منكم لأخيه من قلبه! »"]]}, {"l": "Mar 11:25", "n": "", "vs": [[25, "ومتى وقفتم تصلون، وكان لكم على أحد شيء، فاغفروا له، لكي يغفر لكم أبوكم الذي في السماوات زلاتكم أيضا."]]}, {"l": "Luk 6:35-37", "n": "", "vs": [[35, "ولكن، أحبوا أعداءكم، وأحسنوا المعاملة، وأقرضوا دون أن تأملوا استيفاء القرض، فتكون مكافأتكم عظيمة، وتكونوا أبناء العلي، لأنه ينعم على ناكري الجميل والأشرار."], [36, "فكونوا أنتم رحماء، كما أن أباكم رحيم."], [37, "ولا تدينوا، فلا تدانوا. لا تحكموا على أحد، فلا يحكم عليكم. اغفروا، يغفر لكم."]]}, {"l": "Luk 11:4", "n": "", "vs": [[4, "واغفر لنا خطايانا، لأننا نحن أيضا نغفر لكل من يذنب إلينا؛ ولا تدخلنا في تجربة لكن نجنا من الشرير! »"]]}, {"l": "Luk 17:3", "n": "", "vs": [[3, "خذوا الحذر لأنفسكم: إن أخطأ أخوك، فعاتبه. فإذا تاب، فاغفر له."]]}, {"l": "Luk 17:4", "n": "", "vs": [[4, "وإن أخطأ إليك سبع مرات في اليوم، وعاد إليك سبع مرات قائلا: أنا تائب! فعليك أن تغفر له»."]]}, {"l": "Luk 23:34", "n": "", "vs": [[34, "وقال يسوع: «ياأبي، اغفر لهم، لأنهم لا يدرون ما يفعلون!» واقتسموا ثيابه مقترعين عليها."]]}, {"l": "Jam 2:13", "n": "", "vs": [[13, "فلابد أن يكون الحكم على الذين لا يمارسون الرحمة، حكما خاليا من الرحمة، أما الرحمة فهي تتفوق على الحكم!"]]}], "kwAr": "ومسامحين بعضكم بعضا", "noteAr": ""}, {"kw": "quarrel", "raw": "or complaint, Mat_18:15-17; 1Co_6:7, 1Co_6:8", "note": "or complaint, Mat_18:15-17; 1Co_6:7, 1Co_6:8", "refs": [{"l": "Mat 18:15-17", "n": "", "vs": [[15, "إن أخطأ إليك أخوك، فاذهب إليه وعاتبه بينك وبينه على انفراد. فإذا سمع لك، تكون قد ربحت أخاك."], [16, "وإذا لم يسمع، فخذ معك أخا آخر أو اثنين، حتى يثبت كل أمر بشهادة شاهدين أو ثلاثة."], [17, "فإذا لم يسمع لهما، فاعرض الأمر على الكنيسة. فإذا لم يسمع للكنيسة أيضا، فليكن عندك كالوثني وجابي الضرائب."]]}, {"l": "1Co 6:7", "n": "", "vs": [[7, "والواقع أنه من العيب على الإطلاق أن يقاضي بعضكم بعضا. أما كان أحر ى بكم أن تحتملوا الظلم وأحرى بكم أن تتقبلوا السلب؟"]]}, {"l": "1Co 6:8", "n": "", "vs": [[8, "ولكنكم أنتم تظلمون وتسلبون حتى إخوتكم."]]}], "kwAr": "شكوى على آخر", "noteAr": "أو: شكوى."}, {"kw": "even", "raw": "Luk_5:20-24, Luk_7:48-50; 2Co_2:10; Eph_4:32, Eph_5:2; 1Pe_2:21", "note": "", "refs": [{"l": "Luk 5:20-24", "n": "", "vs": [[20, "فلما رأى إيمانهم، قال: «أيها الإنسان، قد غفرت لك خطاياك!»"], [21, "فأخذ الكتبة والفريسيون يفكرون قائلين: «من هذا الذي ينطق بكلام التجديف؟ من يقدر أن يغفر الخطايا إلا الله وحده؟»"], [22, "ولكن يسوع أدرك ما يفكرون فيه، فأجابهم قائلا: «فيم تفكرون في قلوبكم؟"], [23, "أي الأمرين أسهل: أن أقول: قد غفرت لك خطاياك! أم أن أقول: قم وامش؟"], [24, "ولكني (قلت ذلك) لكي تعلموا أن لابن الإنسان على الأرض سلطة غفران الخطايا...» وقال للمشلول: «لك أقول: قم احمل فراشك، واذهب إلى بيتك»."]]}, {"l": "Luk 7:48-50", "n": "", "vs": [[48, "ثم قال لها: «مغفورة لك خطاياك!»"], [49, "فأخذ المتكئون يسائلون أنفسهم: «من هو هذا الذي يغفر الخطايا أيضا؟»"], [50, "وقال للمرأة: «إيمانك قد خلصك. اذهبي بسلام!»"]]}, {"l": "2Co 2:10", "n": "", "vs": [[10, "فمن تسامحونه بشيء، أسامحه أنا أيضا. وإذا كنت أنا أيضا قد سامحت ذلك الرجل بشيء، فقد سامحته من أجلكم في حضرة المسيح،"]]}, {"l": "Eph 4:32", "n": "", "vs": [[32, "وكونوا لطفاء بعضكم نحو بعض، شفوقين، مسامحين بعضكم بعضا كما سامحكم الله في المسيح."]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "1Pe 2:21", "n": "", "vs": [[21, "لأن الله دعاكم إلى الاشتراك في هذا النوع من الآلام. فالمسيح، الذي تألم لأجلكم، هو القدوة التي تقتدون بها. فسيروا على آثار خطواته:"]]}], "kwAr": "كما سامحكم الرب", "noteAr": ""}], "arS": [["محتملين", ["G430"]], [" ", []], ["بعضكم بعضا", ["G240"]], ["، ", []], ["ومسامحين", ["G5483"]], [" بعضكم بعضا. إن كان لأحدكم ", []], ["شكوى", ["G3437"]], [" على آخر، كما ", []], ["سامحكم", ["G5483"]], [" ", []], ["الرب", ["G5547"]], ["، هكذا افعلوا أنتم أيضا.", []]]}, {"c": 3, "v": 14, "text": "وفوق هذا كله البسوا المحبة، فهي رابطة الكمال.", "groups": [{"kw": "charity", "raw": "Col_2:2; Joh_13:34, Joh_15:12; Rom_13:8; 1Co_13:1-13; Eph_5:2; 1Th_4:9; 1Ti_1:5; 1Pe_4:8; 2Pe_1:7; 1Jo_3:23, 1Jo_4:21", "note": "", "refs": [{"l": "Col 2:2", "n": "", "vs": [[2, "بغرض أن تتشجع قلوبهم وتكون كلها متحدة في المحبة، لبلوغ الإدراك التام بكل غناه، لمعرفة سر الله، أي المسيح،"]]}, {"l": "Joh 13:34", "n": "", "vs": [[34, "وصية جديدة أنا أعطيكم: أحبوا بعضكم بعضا، كما أحببتكم أنا، تحبون بعضكم."]]}, {"l": "Joh 15:12", "n": "", "vs": [[12, "وصيتي لكم هي هذه: أن يحب بعضكم بعضا كما أنا أحببتكم."]]}, {"l": "Rom 13:8", "n": "", "vs": [[8, "لا تكونوا في دين لأحد، إلا بأن يحب بعضكم بعضا. فإن من يحب غيره، يكون قد تمم الشريعة،"]]}, {"l": "1Co 13:1-13", "n": "", "vs": [[1, "... لو كنت أتكلم بلغات الناس والملائكة وليس عندي محبة، لما كنت إلا نحاسا يطن وصنجا يرن!"], [2, "ولو كانت لي موهبة النبوءة، وكنت عالما بجميع الأسرار والعلم كله، وكان عندي الإيمان كله حتى أنقل الجبال، وليس عندي محبة، فلست شيئا!"], [3, "ولو قدمت أموالي كلها للإطعام، وسلمت جسدي لأحرق، وليس عندي محبة، لما كنت أنتفع شيئا."], [4, "المحبة تصبر طويلا؛ وهي لطيفة. المحبة لا تحسد. المحبة لا تتفاخر ولا تتكبر."], [5, "لا تتصرف بغير لياقة، ولا تسعى إلى مصلحتها الخاصة. لا تستفز سريعا، ولا تنسب الشر لأحد."], [6, "لا تفرح بالظلم، بل تفرح بالحق."], [7, "إنها تستر كل شيء، وتصدق كل شيء، وترجو كل شيء، وتتحمل كل شيء."], [8, "المحبة لا تزول أبدا. أما مواهب النبوآت فستزال، ومواهب اللغات ستنقطع، والمعرفة ستزال."], [9, "فإن معرفتنا جزئية ونبوءتنا جزئية."], [10, "ولكن، عندما يأتي ما هو كامل، يزال ما هو جزئي."], [11, "فلما كنت طفلا، كنت أتكلم كالطفل، وأشعر كالطفل، وأفكر كالطفل. ولكن، لما صرت رجلا، أبطلت ما يخص الطفل."], [12, "ونحن الآن ننظر إلى الأمور من خلال زجاج قاتم فنراها بغموض. إلا أننا سنراها أخيرا مواجهة. الآن، أعرف معرفة جزئية. ولكني، عندئذ، سأعرف مثلما عرفت."], [13, "أما الآن، فهذه الثلاثة باقية: الإيمان، والرجاء، والمحبة. ولكن أعظمها هي المحبة!"]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "1Th 4:9", "n": "", "vs": [[9, "أما المحبة الأخوية، فلستم في حاجة لأن أكتب إليكم عنها، لأنكم بأنفسكم قد تعلمتم من الله أن تحبوا بعضكم بعضا،"]]}, {"l": "1Ti 1:5", "n": "", "vs": [[5, "أما الغاية مما أوصيتك به، فهي المحبة النابعة من قلب طاهر وضمير صالح وإيمان خال من الرياء."]]}, {"l": "1Pe 4:8", "n": "", "vs": [[8, "لكن أهم شيء هو أن تبادلوا بعضكم بعضا المحبة الشديدة. لأن المحبة تستر إساءات كثيرة."]]}, {"l": "2Pe 1:7", "n": "", "vs": [[7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."]]}, {"l": "1Jo 3:23", "n": "", "vs": [[23, "وأما وصيته فهي أن نؤمن باسم ابنه يسوع المسيح، وأن يحب بعضنا بعضا كما أوصانا."]]}, {"l": "1Jo 4:21", "n": "", "vs": [[21, "فهذه الوصية جاءتنا من المسيح نفسه: من يحب الله ، يحب أخاه!"]]}], "kwAr": "البسوا المحبة", "noteAr": ""}, {"kw": "the", "raw": "Eph_1:4, Eph_4:3; 1Jo_4:7-12", "note": "", "refs": [{"l": "Eph 1:4", "n": "", "vs": [[4, "كما كان قد اختارنا فيه قبل تأسيس العالم، لنكون قديسين بلا لوم أمامه."]]}, {"l": "Eph 4:3", "n": "", "vs": [[3, "مجتهدين أن تحافظوا على وحدة الروح برابطة الوفاق. فإنما هناك جسد واحد وروح واحد،"]]}, {"l": "1Jo 4:7-12", "n": "", "vs": [[7, "أيها الأحباء، لنحب بعضنا بعضا: لأن المحبة تصدر من الله. إذن، كل من يحب، يكون مولودا من الله ويعرف الله ."], [8, "أما من لا يحب، فهو لم يتعرف بالله قط لأن الله محبة!"], [9, "وقد أظهر الله محبته لنا إذ أرسل ابنه الأوحد إلى العالم لكي نحيا به."], [10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."], [11, "ومادام الله قد أحبنا هذه المحبة العظيمة، أيها الأحباء، فعلينا نحن أيضا أن نحب بعضنا بعضا."], [12, "إن الله لم يره أحد من الناس قط. ولكن، حين نحب بعضنا بعضا، نبين أن الله يحيا في داخلنا، وأن محبته قد اكتملت في داخلنا."]]}], "kwAr": "رابطة الكمال", "noteAr": ""}], "arS": [["وفوق هذا ", []], ["كله", ["G3956"]], [" ", []], ["البسوا المحبة", ["G26"]], ["، فهي ", []], ["رابطة", ["G4886"]], [" ", []], ["الكمال", ["G5047"]], [".", []]]}, {"c": 3, "v": 15, "text": "وليملك في قلوبكم سلام المسيح، فإليه قد دعيتم في الجسد الواحد؛ وكونوا شاكرين!", "groups": [{"kw": "the peace", "raw": "Psa_29:11; Isa_26:3, Isa_27:5, Isa_57:15, Isa_57:19; Joh_14:27, Joh_16:33; Rom_5:1, Rom_14:17; Rom_15:13; 2Co_5:19-21; Eph_2:12-18, Eph_5:1; Phi_4:7", "note": "", "refs": [{"l": "Psa 29:11", "n": "", "vs": [[11, "الرب يعطي شعبه عزا. الرب يبارك شعبه بالسلام."]]}, {"l": "Isa 26:3", "n": "", "vs": [[3, "أنت تحفظ ذا الرأي الثابت سالما لأنه عليك توكل."]]}, {"l": "Isa 27:5", "n": "", "vs": [[5, "أو ليستجيروا بحمايتي وليعقدوا معي سلاما؛ أجل! ليعقدوا معي سلاما."]]}, {"l": "Isa 57:15", "n": "", "vs": [[15, "لأنه هكذا يقول العلي السامي، المقيم في الأبد، الذي يدعى اسمه القدوس: إنني أسكن في العلى وفي الموضع المقدس، وأقيم مع المنسحق، وذوي الروح المتواضعة، لأحيي أرواح المتواضعين، وأنعش قلوب المنسحقين."]]}, {"l": "Isa 57:19", "n": "", "vs": [[19, "وأستبدل نواحه بالحمد، يقول الرب؛ فيكون سلام للقريب والبعيد لأنني سأشفيه."]]}, {"l": "Joh 14:27", "n": "", "vs": [[27, "سلاما أترك لكم. سلامي أعطيكم. ليس كما يعطي العالم أعطيكم أنا. فلا تضطرب قلوبكم، ولا ترتعب."]]}, {"l": "Joh 16:33", "n": "", "vs": [[33, "أخبرتكم بهذا كله ليكون لكم في سلام. فإنكم في العالم ستقاسون الضيق. ولكن تشجعوا، فأنا قد انتصرت على العالم!»"]]}, {"l": "Rom 5:1", "n": "", "vs": [[1, "فبما أننا قد تبررنا على أساس الإيمان، صرنا في سلام مع الله بربنا يسوع المسيح."]]}, {"l": "Rom 14:17", "n": "", "vs": [[17, "إذ ليس ملكوت الله بأكل وشرب، بل هو بر وسلام وفرح في الروح القدس."]]}, {"l": "Rom 15:13", "n": "", "vs": [[13, "فليملأكم إله الرجاء كل فرح وسلام في إيمانكم حتى تزدادوا رجاء بقوة الروح القدس."]]}, {"l": "2Co 5:19-21", "n": "", "vs": [[19, "ذلك أن الله كان في المسيح مصالحا العالم مع نفسه، غير حاسب عليهم خطاياهم، وقد وضع بين أيدينا رسالة هذه المصالحة."], [20, "فنحن إذن سفراء المسيح، وكأن الله يعظ بنا نتوسل بالنيابة عن المسيح منادين: «تصالحوا مع الله!»"], [21, "فإن الذي لم يعرف خطيئة، جعله الله خطيئة لأجلنا، لنصير نحن بر الله فيه."]]}, {"l": "Eph 2:12-18", "n": "", "vs": [[12, "أنكم كنتم في ذلك الحين بلا مسيح، أجانب عن جماعة إسرائيل، وغرباء عن العهود الموعودة، لا رجاء لكم، ومنكرين لله في العالم."], [13, "أما الآن، ففي المسيح يسوع، أنتم الذين كنتم من قبل بعيدين قد صرتم قريبين بدم المسيح."], [14, "فإنه هو سلامنا، ذاك الذي جعل الفريقين واحدا وهدم حائط الحاجز الفاصل بينهما،"], [15, "أي العداء: إذ أبطل بجسده شريعة الوصايا ذات الفرائض، لكي يكون من الفريقين إنسانا واحدا جديدا، إذ أحل السلام بينهما،"], [16, "ولكي يصالحهما معا في جسد واحد مع الله بالصليب الذي به قتل العداء."], [17, "ثم جاء وبشركم بالسلام أنتم البعيدين، (كما بشر بالسلام) أولئك القريبين."], [18, "فبه لنا كلينا اقتراب إلى الآب بروح واحد."]]}, {"l": "Eph 5:1", "n": "", "vs": [[1, "فاقتدوا إذن بالله كأولاد أحباء،"]]}, {"l": "Phi 4:7", "n": "", "vs": [[7, "وسلام الله، الذي تعجز العقول عن إدراكه، يحرس قلوبكم وأفكاركم في المسيح يسوع."]]}], "kwAr": "سلام المسيح", "noteAr": ""}, {"kw": "to the", "raw": "1Co_7:15; Eph_2:16, Eph_2:17, Eph_4:4, Eph_4:16", "note": "", "refs": [{"l": "1Co 7:15", "n": "", "vs": [[15, "ولكن إن انفصل الطرف غير المؤمن، فلينفصل؛ فليس الأخ أو الأخت تحت ارتباط في مثل هذه الحالات، وإنما الله دعاكم إلى العيش بسلام."]]}, {"l": "Eph 2:16", "n": "", "vs": [[16, "ولكي يصالحهما معا في جسد واحد مع الله بالصليب الذي به قتل العداء."]]}, {"l": "Eph 2:17", "n": "", "vs": [[17, "ثم جاء وبشركم بالسلام أنتم البعيدين، (كما بشر بالسلام) أولئك القريبين."]]}, {"l": "Eph 4:4", "n": "", "vs": [[4, "مثلما دعيتم، جميعكم، دعوة لها رجاء واحد."]]}, {"l": "Eph 4:16", "n": "", "vs": [[16, "فمنه يستمد الجسد كله تماسكه وترابطه بمساندة كل مفصل وفقا لمقدار العمل المخصص لكل جزء، لينشيء نموا يؤول إلى بنيان الجسد بنيانا ذاتيا في المحبة."]]}], "kwAr": "فإليه قد دعيتم", "noteAr": ""}, {"kw": "and be", "raw": "Col_3:17, Col_1:12, Col_2:7; Psa_100:4, Psa_107:22, Psa_116:17; Jon_2:9; Luk_17:16-18; Rom_1:21; 2Co_4:15, 2Co_9:11; Eph_5:20; Phi_4:6; 1Th_5:18; 1Ti_2:1; Heb_13:15; Rev_7:12", "note": "", "refs": [{"l": "Col 3:17", "n": "", "vs": [[17, "ومهما كان ما تعملونه، بالقول أو بالفعل، فليجر كل شيء باسم الرب يسوع، رافعين به الشكر لله الآب."]]}, {"l": "Col 1:12", "n": "", "vs": [[12, "رافعين الشكر بفرح للآب الذي جعلكم أهلا للاشتراك في ميراث القديسين في (ملكوت) النور،"]]}, {"l": "Col 2:7", "n": "", "vs": [[7, "وأنتم متأصلون ومبنيون فيه وراسخون في الإيمان الموافق لما تعلمتم وفائضون بالشكر."]]}, {"l": "Psa 100:4", "n": "", "vs": [[4, "ادخلوا أبوابه حامدين، دياره مسبحين. اشكروه وباركوا اسمه."]]}, {"l": "Psa 107:22", "n": "", "vs": [[22, "وليقربوا له ذبائح الشكر، ويحدثوا بأعماله بترانيم الفرح."]]}, {"l": "Psa 116:17", "n": "", "vs": [[17, "لك أقدم ذبائح الشكر، وأدعو باسمك."]]}, {"l": "Jon 2:9", "n": "", "vs": [[9, "أما أنا فبهتاف الحمد أذبح لك، وما نذرته أوفي به، لأن للرب الخلاص»."]]}, {"l": "Luk 17:16-18", "n": "", "vs": [[16, "وخر على وجهه عند قدميه مقدما له الشكر. وكان هذا سامريا."], [17, "فتكلم يسوع قائلا: «أما طهر العشرة؟ فأين التسعة؟"], [18, "ألم يوجد من يعود ويقدم المجد لله سوى هذا الأجنبي؟»"]]}, {"l": "Rom 1:21", "n": "", "vs": [[21, "فمع أنهم عرفوا الله ، لم يمجدوه باعتباره الله ، ولا شكروه، بل انحطوا بتفكيرهم إلى الحماقة وصار قلبهم لغباوته مظلما."]]}, {"l": "2Co 4:15", "n": "", "vs": [[15, "فإن جميع الأشياء نقاسيها من أجلكم، حتى إذا فاضت النعمة في الكثيرين، تجعل الشكر يفيض لأجل مجد الله."]]}, {"l": "2Co 9:11", "n": "", "vs": [[11, "إذ تغتنون في كل شيء، لأجل كل سخاء طوعي ينتج بنا شكرا لله"]]}, {"l": "Eph 5:20", "n": "", "vs": [[20, "رافعين الشكر كل حين وعلى كل شيء لله والآب، باسم ربنا يسوع المسيح؛"]]}, {"l": "Phi 4:6", "n": "", "vs": [[6, "لا تقلقوا من جهة أي شيء، بل في كل أمر لتكن طلباتكم معروفة لدى الله، بالصلاة والدعاء، مع الشكر."]]}, {"l": "1Th 5:18", "n": "", "vs": [[18, "ارفعوا الشكر في كل حال: فهذه هي مشيئة الله لكم في المسيح يسوع."]]}, {"l": "1Ti 2:1", "n": "", "vs": [[1, "فأطلب، قبل كل شيء، أن تقيموا الطلبات الحارة والصلوات والتضرعات والتشكرات لأجل جميع الناس،"]]}, {"l": "Heb 13:15", "n": "", "vs": [[15, "فبالمسيح، رئيس كهنتنا، لنقرب لله دائما ذبيحة الحمد والتسبيح، أي الثمار التي تنتجها أفواهنا المعترفة باسمه."]]}, {"l": "Rev 7:12", "n": "", "vs": [[12, "قائلين: «آمين! لإلهنا البركة والمجد والحكمة والشكر والإجلال والقدرة والقوة إلى أبد الآبدين. آمين!»"]]}], "kwAr": "وكونوا شاكرين", "noteAr": ""}], "arS": [["وليملك", ["G1018"]], [" في ", []], ["قلوبكم", ["G2588", "G5216"]], [" ", []], ["سلام", ["G1515"]], [" المسيح، فإليه قد ", []], ["دعيتم", ["G2564"]], [" في ", []], ["الجسد", ["G4983"]], [" ", []], ["الواحد", ["G1520"]], ["؛ وكونوا ", []], ["شاكرين", ["G2170"]], ["!", []]]}, {"c": 3, "v": 16, "text": "لتسكن كلمة المسيح في داخلكم بغنى، في كل حكمة، معلمين وواعظين بعضكم بعضا، مرنمين بمزامير وتسابيح وأناشيد روحية في قلوبكم لله، رافعين له الحمد.", "groups": [{"kw": "the word", "raw": "Joh_5:39, Joh_5:40; 2Ti_3:15; Heb_4:12, Heb_4:13; 1Pe_1:11, 1Pe_1:12; Rev_19:10", "note": "", "refs": [{"l": "Joh 5:39", "n": "", "vs": [[39, "أنتم تدرسون الكتب لأنكم تعتقدون أنها ستهديكم إلى الحياة الأبدية. هذه الكتب تشهد لي،"]]}, {"l": "Joh 5:40", "n": "", "vs": [[40, "ولكنكم ترفضون أن تأتوا إلي لتكون لكم الحياة."]]}, {"l": "2Ti 3:15", "n": "", "vs": [[15, "وتعلم أنك منذ حداثة سنك تعرف الكتب المقدسة، وهي القادرة أن تجعلك حكيما لبلوغ الخلاص عن طريق الإيمان في المسيح يسوع."]]}, {"l": "Heb 4:12", "n": "", "vs": [[12, "ذلك لأن كلمة الله حية، وفعاله، وأمضى من كل سيف له حدان، وخارقة إلى مفترق النفس والروح والمفاصل ونخاع العظام، وقادرة أن تميز أفكار القلب ونياته."]]}, {"l": "Heb 4:13", "n": "", "vs": [[13, "وليس هنالك مخلوق واحد محجوب عن نظر الله، بل كل شيء عريان ومكشوف أمام عينيه، هو الذي سنؤدي له حسابا."]]}, {"l": "1Pe 1:11", "n": "", "vs": [[11, "واجتهدوا لمعرفة الزمان والأحوال التي كان يشير إليها روح المسيح الذي كان عاملا فيهم، عندما شهد لهم مسبقا بما ينتظر المسيح من آلام، وبما يأتي بعدها من أمجاد."]]}, {"l": "1Pe 1:12", "n": "", "vs": [[12, "ولكن الله أوحى إليهم أن اجتهادهم لم يكن لمصلحتهم هم، بل لمصلحتكم أنتم. فقد كان ذلك من أجل البشارة التي نقلها إليكم في الزمان الحاضر مبشرون يؤيدهم الروح القدس المرسل من السماء. ويالها من أمور يتمنى حتى الملائكة أن يطلعوا عليها!"]]}, {"l": "Rev 19:10", "n": "", "vs": [[10, "فجثوت عند قدميه لأسجد له، فقال لي: «لا تفعل! إني عبد لله، مثلك ومثل إخوتك المؤمنين الذين لديهم الشهادة المختصة بيسوع: لله اسجد! فإن الشهادة المختصة بيسوع هي روح النبوءة»."]]}], "kwAr": "كلمة المسيح", "noteAr": ""}, {"kw": "dwell", "raw": "Deu_6:6-9, Deu_11:18-20; Job_23:12; Psa_119:11; Jer_15:16; Luk_2:51; Joh_15:7; 1Jo_2:14, 1Jo_2:24, 1Jo_2:27; 2Jo_1:2", "note": "", "refs": [{"l": "Deu 6:6-9", "n": "", "vs": [[6, "وضعوا هذه الكلمات التي أوصيكم بها على قلوبكم،"], [7, "وقصوها على أولادكم، وتحدثوا بها حين تجلسون في بيوتكم، وحين تسيرون في الطريق، وحين تنامون، وحين تنهضون."], [8, "اربطوها علامة على أيديكم، واجعلوها عصائب على جباهكم."], [9, "اكتبوها على قوائم أبواب بيوتكم وبوابات مدنكم."]]}, {"l": "Deu 11:18-20", "n": "", "vs": [[18, "فثبتوا كلماتي هذه على قلوبكم، واربطوها علامة على أيديكم، واعصبوا بها جباهكم،"], [19, "وعلموها لأولادكم، وتحدثوا بها حين تكونون في بيوتكم، وحين تسيرون في الطريق، وحين تأوون إلى فراشكم، وحين تنهضون،"], [20, "واكتبوها على قوائم أبواب بيوتكم وبوابات مدنكم،"]]}, {"l": "Job 23:12", "n": "", "vs": [[12, "لم أتعد على وصاياه، وذخرت في قلبي كلماته."]]}, {"l": "Psa 119:11", "n": "", "vs": [[11, "خبأت كلامك في قلبي، لئلا أخطيء إليك."]]}, {"l": "Jer 15:16", "n": "", "vs": [[16, "حالما بلغتني كلماتك أكلتها فأصبحت لي بهجة ومسرة لقلبي، لأني دعيت باسمك أيها الرب الإله القدير."]]}, {"l": "Luk 2:51", "n": "", "vs": [[51, "ثم نزل معهما ورجع إلى الناصرة، وكان خاضعا لهما. وكانت أمه تحفظ هذه الأمور كلها في قلبها."]]}, {"l": "Joh 15:7", "n": "", "vs": [[7, "ولكن، إن ثبتم في، وثبت كلامي فيكم، فاطلبوا ما تريدون يكن لكم."]]}, {"l": "1Jo 2:14", "n": "", "vs": [[14, "كتبت إليكم، أيها الآباء، لأنكم قد عرفتم المسيح الكائن منذ البداية. كتبت إليكم، أيها الشباب، لأنكم أقوياء، وقد ترسخت كلمة الله في قلوبكم، وغلبتم إبليس الشرير."]]}, {"l": "1Jo 2:24", "n": "", "vs": [[24, "أما أنتم، فالكلام الذي سمعتموه منذ البداية، فليكن راسخا فيكم. فحين يترسخ ذلك الكلام في داخلكم، تتوطد صلتكم بالابن، وبالآب."]]}, {"l": "1Jo 2:27", "n": "", "vs": [[27, "أما أنتم فقد نلتم من الله مسحة تبقى فيكم دائما. ولذلك، لستم بحاجة إلى من يعلمكم الحق. فتلك المسحة عينها هي التي تعلمكم كل شيء. وهي حق وليست كذبا. فكما علمتكم اثبتوا في المسيح."]]}, {"l": "2Jo 1:2", "n": "", "vs": [[2, "بما أن الحق ثابت في قلوبنا، ولابد أن يرافقنا إلى الأبد،"]]}], "kwAr": "لتسكن", "noteAr": ""}, {"kw": "richly", "raw": "1Ti_6:17; Tit_3:6 *marg.", "note": "", "refs": [{"l": "1Ti 6:17", "n": "", "vs": [[17, "أوص أغنياء هذا الزمان بأن لا يتكبروا، ولا يتكلوا على الغنى غير الثابت، بل على الله الذي يمنحنا كل شيء بوفرة لنتمتع به،"]]}, {"l": "Tit 3:6", "n": "*marg.", "vs": [[6, "الذي سكبه علينا بغنى بيسوع المسيح مخلصنا."]]}], "kwAr": "بغنى", "noteAr": ""}, {"kw": "all", "raw": "Col_1:9; 1Ki_3:9-12, 1Ki_3:28; Pro_2:6, Pro_2:7, Pro_14:8, Pro_18:1; Isa_10:2; Eph_1:17, Eph_5:17; Jam_1:5, Jam_3:17", "note": "", "refs": [{"l": "Col 1:9", "n": "", "vs": [[9, "لذلك نحن أيضا، من اليوم الذي فيه سمعنا بأخباركم، مازلنا نصلي ونتضرع لأجلكم، لأن تمتلئوا من تمام المعرفة لمشيئة الله في كل حكمة وإدراك روحي،"]]}, {"l": "1Ki 3:9-12", "n": "", "vs": [[9, "فهب عبدك قلبا فهيما لأقضي بين شعبك، وأميز بين الخير والشر، لأنه من يستطيع أن يحكم شعبك العظيم هذا؟»"], [10, "فسر الرب بطلب سليمان هذا."], [11, "وقال له: «لأنك قد طلبت هذا الأمر، ولم تطلب حياة طويلة، ولا غنى، ولا انتقاما من أعدائك، بل سألت حكمة لتسوس شؤون الحكم،"], [12, "فإنني سألبي طلبك، فأهبك قلبا حكيما مميزا، فلا يضاهيك أحد من قبل ولا من بعد."]]}, {"l": "1Ki 3:28", "n": "", "vs": [[28, "ولما سرى نبأ هذا الحكم الذي صدر عن الملك بين شعب إسرائيل، امتلأوا توقيرا له، لأنهم رأوا فيه حكمة الله لإجراء العدل."]]}, {"l": "Pro 2:6", "n": "", "vs": [[6, "لأن الرب يهب الحكمة، ومن فمه تتدفق المعرفة والفهم."]]}, {"l": "Pro 2:7", "n": "", "vs": [[7, "يذخر للمستقيمين فطنة، وهو ترس للسالكين بالكمال."]]}, {"l": "Pro 14:8", "n": "", "vs": [[8, "حكمة العاقل في تبين حسن مسلكه، وغباوة الجهال في ارتكاب خدعهم."]]}, {"l": "Pro 18:1", "n": "", "vs": [[1, "المعتزل (عن الله والناس) ينشد شهوته ويتنكر لكل مشورة صائبة."]]}, {"l": "Isa 10:2", "n": "", "vs": [[2, "ليصدوا البائسين عن العدل، ويسلبوا مساكين شعبي حقهم، لتكون الأرامل مغنما ل ; Eph_5:19; Jam_5:13", "note": "", "refs": [{"l": "Mat 26:30", "n": "", "vs": [[30, "ثم رتلوا، وانطلقوا خارجا إلى جبل الزيتون."]]}, {"l": "1Co 14:26", "n": "", "vs": [[26, "فما العمل إذن أيها الإخوة؟ كلما تجتمعون معا، سيكون لكل منكم مزمور، أو تعليم، أو كلام بلغة مجهولة، أو إعلان، أو ترجمة. فليتم كل شيء بهدف البنيان."]]}, {"l": "Eph 5:19", "n": "", "vs": [[19, "محدثين بعضكم بعضا بمزامير وتسابيح وأناشيد روحية، مرنمين ومرتلين بقلوبكم للرب؛"]]}, {"l": "Jam 5:13", "n": "", "vs": [[13, "هل بينكم من يتألم؟ فليصل! وهل بينكم من هو سعيد؟ فليرتل!"]]}], "kwAr": "بمزامير وتسابيح", "noteAr": ""}, {"kw": "and spiritual", "raw": "1Ch_25:7; Neh_12:46; Psa_32:7, Psa_119:54; Son_1:1; Isa_5:1, Isa_26:1, Isa_30:29; Rev_5:9, Rev_14:3, Rev_15:3", "note": "", "refs": [{"l": "1Ch 25:7", "n": "", "vs": [[7, "وقد بلغ عددهم مع بقية أقربائهم مئتين وثمانية وثمانين لاويا، وجميعهم بارعون في العزف والترتيل للرب."]]}, {"l": "Neh 12:46", "n": "", "vs": [[46, "فقد تعين منذ أيام داود وآساف في الحقب الغابرة رؤساء مرتلين لقيادة ترانيم التسبيح والحمد لله."]]}, {"l": "Psa 32:7", "n": "", "vs": [[7, "أنت ستر لي، في الضيق تحرسني. بترانيم بهجة النجاة تطوقني."]]}, {"l": "Psa 119:54", "n": "", "vs": [[54, "صارت فرائضك ترنيمات لي في أرض غربتي."]]}, {"l": "Son 1:1", "n": "", "vs": [[1, "هذا نشيد الأناشيد لسليمان."]]}, {"l": "Isa 5:1", "n": "", "vs": [[1, "سأشدو لحبيبي أغنية عن كرمه: كان لحبيبي كرم على تل خصيب،"]]}, {"l": "Isa 26:1", "n": "", "vs": [[1, "في ذلك اليوم يتردد هذا النشيد في أرض يهوذا: «لنا مدينة منيعة، يجعل الرب الخلاص أسوارا ومترسة."]]}, {"l": "Isa 30:29", "n": "", "vs": [[29, "أما أنتم فتشدون كما في ليلة الاحتفال بعيد مقدس، وتبتهج قلوبكم كقلب من يسير على ألحان ناي، آتيا إلى جبل الرب وإلى صخر إسرائيل."]]}, {"l": "Rev 5:9", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"]]}, {"l": "Rev 14:3", "n": "", "vs": [[3, "وكانوا ينشدون ترتيلة جديدة أمام عرش الله، وأمام الكائنات الحية الأربعة والشيو
