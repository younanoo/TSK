<script>window.CATALOG=[{"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 5, "nv": 99, "refs": 1290, "last": "5:17", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>

 لمشيئة الله في كل حكمة وإدراك روحي،"]]}, {"l": "Col 1:13", "n": "", "vs": [[13, "هو الذي أنقذنا من سلطة الظلام ونقلنا إلى ملكوت ابن محبته"]]}, {"l": "Eph 3:14-19", "n": "", "vs": [[14, "ولهذا السبب أحني ركبتي للآب"], [15, "الذي هو أصل كل أبوة في السماوات وعلى الأرض،"], [16, "لكي يمنحكم، وفقا لغنى مجده، أن يمد الروح الكيان الداخلي في كل منكم بالقوة المؤيدة،"], [17, "ليسكن المسيح في قلوبكم بالإيمان؛ حتى إذا تأصلتم وتأسستم في المحبة،"], [18, "تصيرون قادرين تماما أن تدركوا، مع القديسين جميعا، ما هو العرض والطول والعلو والعمق،"], [19, "وتعرفوا محبة المسيح التي تفوق المعرفة، فتمتلئوا حتى تبلغوا ملء الله كله."]]}, {"l": "Phi 1:9-11", "n": "", "vs": [[9, "وصلاتي لأجلكم هي هذه: أن تزداد محبتكم أكثر فأكثر في تمام المعرفة والإدراك،"], [10, "لكي تستحسنوا الأمور الممتازة، حتى تكونوا طاهرين وخالين من العثرات إلى يوم المسيح،"], [11, "كاملين في ثمار البر الآتية بيسوع المسيح، لمجد الله وحمده."]]}, {"l": "1Th 3:10-13", "n": "", "vs": [[10, "ونحن نتضرع ليل نهار متوسلين أن نرى وجوهكم ونكمل ما كان ناقصا في إيمانكم؟"], [11, "ليت الله أبانا نفسه، وربنا يسوع المسيح، يسهل أمامنا الطريق إليكم."], [12, "وليجعلكم الرب تنمون وتفيضون في المحبة لتحبوا بعضكم بعضا وجميع الناس كمحبتنا لكم،"], [13, "حتى تتثبت قلوبكم بغير لوم في القداسة أمام إلهنا وأبينا عندما يظهر ربنا يسوع عائدا مع جميع قديسيه."]]}, {"l": "2Th 2:16", "n": "", "vs": [[16, "وليت ربنا يسوع المسيح نفسه، والله أبانا، الذي أحبنا ووهبنا بنعمته راحة أبدية ورجاء صالحا،"]]}, {"l": "2Th 2:17", "n": "", "vs": [[17, "يشجع قلوبكم ويرسخكم في كل عمل صالح وقول حسن!"]]}, {"l": "2Ti 1:3", "n": "", "vs": [[3, "كم أشكر الله ، الذي أعبده بضمير طاهر كما أخذت عن أجدادي، إذ مازلت أذكرك دائما في تضرعاتي ليلا ونهارا؛"]]}], "kwAr": "فيما نصلي لأجلكم", "noteAr": ""}], "arS": [["إننا ", []], ["دائما", ["G3842"]], [" ", []], ["نرفع الشكر", ["G2168"]], [" ", []], ["لله", ["G2316"]], ["، ", []], ["أبي", ["G3962"]], [" ", []], ["ربنا", ["G2962", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [" فيما ", []], ["نصلي", ["G4336"]], [" لأجلكم.", []]]}, {"c": 1, "v": 4, "text": "إذ بلغنا خبر إيمانكم بالمسيح يسوع والمحبة التي لكم نحو جميع القديسين،", "groups": [{"kw": "we", "raw": "Col_1:9; 2Co_7:7; Eph_1:15; 1Th_3:6; 3Jo_1:3, 3Jo_1:4", "note": "", "refs": [{"l": "Col 1:9", "n": "", "vs": [[9, "لذلك نحن أيضا، من اليوم الذي فيه سمعنا بأخباركم، مازلنا نصلي ونتضرع لأجلكم، لأن تمتلئوا من تمام المعرفة لمشيئة الله في كل حكمة وإدراك روحي،"]]}, {"l": "2Co 7:7", "n": "", "vs": [[7, "لا بمجيئه وحسب، بل بالتشجيع الذي لقيه عندكم. وقد أخبرنا بشوقكم، وحزنكم، وغيرتكم علي، فتضاعف فرحي."]]}, {"l": "Eph 1:15", "n": "", "vs": [[15, "لذلك أنا أيضا، وقد سمعت بما فيكم من الإيمان بالرب يسوع والمحبة لجميع القديسين،"]]}, {"l": "1Th 3:6", "n": "", "vs": [[6, "أما الآن، وقد عاد تيموثاوس إلينا من عندكم وبشرنا بما لكم من إيمان ومحبة، وبأنكم تذكروننا ذكرا حسنا في كل حين، وتشتاقون كثيرا لرؤيتنا كما نشتاق نحن لرؤيتكم،"]]}, {"l": "3Jo 1:3", "n": "", "vs": [[3, "فكم كان فرحي عظيما عندما مر بي بعض الإخوة المسافرين وأخبروني أنك تسلك بحسب الحق، وشهدوا للحق الثابت فيك!"]]}, {"l": "3Jo 1:4", "n": "", "vs": [[4, "وما أعظم الفرح الذي يغمر قلبي حين أسمع الأخبار الطيبة التي تؤكد أن أولادي يسلكون بحسب الحق!"]]}], "kwAr": "إذ بلغنا خبر", "noteAr": ""}, {"kw": "faith", "raw": "Gal_5:6; 1Th_1:3, 1Th_4:9, 1Th_4:10; 2Th_1:3; Phm_1:5; 1Pe_1:21-23; 1Jo_3:14, 1Jo_3:23; 1Jo_4:16", "note": "", "refs": [{"l": "Gal 5:6", "n": "", "vs": [[6, "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة."]]}, {"l": "1Th 1:3", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"]]}, {"l": "1Th 4:9", "n": "", "vs": [[9, "أما المحبة الأخوية، فلستم في حاجة لأن أكتب إليكم عنها، لأنكم بأنفسكم قد تعلمتم من الله أن تحبوا بعضكم بعضا،"]]}, {"l": "1Th 4:10", "n": "", "vs": [[10, "ولأنكم أيضا هكذا تعاملون جميع الإخوة في مقاطعة مقدونية كلها. وإنما نحرضكم، أيها الإخوة، أن تضاعفوا ذلك أكثر فأكثر،"]]}, {"l": "2Th 1:3", "n": "", "vs": [[3, "من واجبنا أن نشكر الله على الدوام لأجلكم أيها الإخوة. كما أن هذا حق: لأن إيمانكم ينمو نموا فائقا، ومحبة أحدكم للآخر تفيض بينكم جميعا."]]}, {"l": "Phm 1:5", "n": "", "vs": [[5, "وقد سمعت بما لك من محبة وأمانة من نحو الرب يسوع، ومن نحو جميع القديسين،"]]}, {"l": "1Pe 1:21-23", "n": "", "vs": [[21, "أنتم الذين تؤمنون بالله بالمسيح الذي أقامه من الموت وأعطاه المجد، حتى يكون الله غاية إيمانكم ورجائكم."], [22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"], [23, "فأنتم قد ولدتم ولادة ثانية لا من زرع بشري يفنى، بل مما لا يفنى: بكلمة الله الحية الباقية إلى الأبد."]]}, {"l": "1Jo 3:14", "n": "", "vs": [[14, "إن محبتنا لإخوتنا تبين لنا أننا انتقلنا من الموت إلى الحياة. فالذي لا يحب إخوته، فهو باق في الموت."]]}, {"l": "1Jo 3:23", "n": "", "vs": [[23, "وأما وصيته فهي أن نؤمن باسم ابنه يسوع المسيح، وأن يحب بعضنا بعضا كما أوصانا."]]}, {"l": "1Jo 4:16", "n": "", "vs": [[16, "ونحن أنفسنا اختبرنا المحبة التي خصنا الله بها، ووضعنا ثقتنا فيها. إن الله محبة. ومن يثبت في المحبة، فإنه يثبت في الله، والله يثبت فيه."]]}], "kwAr": "إيمانكم بالمسيح يسوع", "noteAr": ""}, {"kw": "the love", "raw": "Heb_6:10", "note": "", "refs": [{"l": "Heb 6:10", "n": "", "vs": [[10, "وليس الله بظالم حتى ينسى عملكم الجاد في إظهار محبتكم له عن طريق خدمتكم للقديسين إكراما لاسمه، الأمر الذي قمتم به قبلا، وتقومون به الآن!"]]}], "kwAr": "والمحبة التي لكم", "noteAr": ""}], "arS": [["إذ ", []], ["بلغنا خبر", ["G191"]], [" ", []], ["إيمانكم", ["G4102", "G5216"]], [" ", []], ["بالمسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["والمحبة", ["G26"]], [" التي لكم نحو ", []], ["جميع", ["G3956"]], [" ", []], ["القديسين", ["G40"]], ["،", []]]}, {"c": 1, "v": 5, "text": "بسبب الرجاء المحفوظ لكم في السماوات، الرجاء الذي سمعتم به سابقا في كلمة الحق التي في الإنجيل", "groups": [{"kw": "the hope", "raw": "Col_1:23, Col_1:27; Act_23:6, Act_24:15, Act_26:6, Act_26:7; 1Co_13:13, 1Co_15:19; Gal_5:5; Eph_1:18, Eph_1:19; 2Th_2:16; Heb_7:19; 1Pe_3:15; 1Jo_3:3", "note": "", "refs": [{"l": "Col 1:23", "n": "", "vs": [[23, "على أن تثبتوا فعلا في الإيمان، مؤسسين وراسخين وغير متحولين عن رجاء الإنجيل الذي سمعتموه والذي بشر به للخليقة كلها تحت السماء، وله صرت أنا بولس خادما."]]}, {"l": "Col 1:27", "n": "", "vs": [[27, "الذين أراد الله أن يعلن لهم كم هو غني مجد هذا السر بين الأمم: إنه المسيح فيكم، وهو رجاء المجد؛"]]}, {"l": "Act 23:6", "n": "", "vs": [[6, "وإذ كان بولس يعلم أن بعض أعضاء المجلس من مذهب الصدوقيين، وبعضهم من مذهب الفريسيين، نادى في المجلس: «أيها الإخوة، أنا فريسي ابن فريسي، وإني أحاكم الآن لأنني أعتقد أن للموتى رجاء بالقيامة!»"]]}, {"l": "Act 24:15", "n": "", "vs": [[15, "ولي بالله ما لهم من رجاء ينتظرون تحقيقه: وهو أن القيامة ستحدث للأموات، الأبرار منهم والأشرار."]]}, {"l": "Act 26:6", "n": "", "vs": [[6, "وأنا اليوم أحاكم لأن لي رجاء بأن يحقق الله ما وعد به آباءنا،"]]}, {"l": "Act 26:7", "n": "", "vs": [[7, "ومازالت أسباط شعبنا الاثنا عشر تواظب على العبادة ليل نهار راجية تحقيقه. من أجل هذا الرجاء يتهمني اليهود، أيها الملك:"]]}, {"l": "1Co 13:13", "n": "", "vs": [[13, "أما الآن، فهذه الثلاثة باقية: الإيمان، والرجاء، والمحبة. ولكن أعظمها هي المحبة!"]]}, {"l": "1Co 15:19", "n": "", "vs": [[19, "ولو كان رجاؤنا في المسيح يقتصر على هذه الحياة، لكنا أشقى الناس جميعا!"]]}, {"l": "Gal 5:5", "n": "", "vs": [[5, "فإننا، بالروح وعلى أساس الإيمان، ننتظر الرجاء الذي ينتجه البر."]]}, {"l": "Eph 1:18", "n": "", "vs": [[18, "إذ تستنير بصائر قلوبكم، فتعلموا ما في دعوته لكم من رجاء، وما هو غنى مجد ميراثه في القديسين،"]]}, {"l": "Eph 1:19", "n": "", "vs": [[19, "وما هي عظمة قدرته الفائقة المعلنة لنا نحن المؤمنين، بحسب عمل اقتدار قوته"]]}, {"l": "2Th 2:16", "n": "", "vs": [[16, "وليت ربنا يسوع المسيح نفسه، والله أبانا، الذي أحبنا ووهبنا بنعمته راحة أبدية ورجاء صالحا،"]]}, {"l": "Heb 7:19", "n": "", "vs": [[19, "فالشريعة لم توصل الذين كانوا يعبدون الله بحسبها ولو إلى أدنى درجات الكمال. ولذلك، وضع الله أساسا جديدا للاقتراب إليه، مقدما لنا رجاء أفضل."]]}, {"l": "1Pe 3:15", "n": "", "vs": [[15, "وإنما كرسوا المسيح ربا في قلوبكم. وكونوا دائما مستعدين لأن تقدموا جوابا مقنعا لكل من يسألكم عن سبب الرجاء الذي في داخلكم"]]}, {"l": "1Jo 3:3", "n": "", "vs": [[3, "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر."]]}], "kwAr": "الرجاء", "noteAr": ""}, {"kw": "laid", "raw": "Psa_31:19; Mat_6:19, Mat_6:20; Luk_12:33; 2Ti_4:8; 1Pe_1:3, 1Pe_1:4", "note": "", "refs": [{"l": "Psa 31:19", "n": "", "vs": [[19, "يارب، ما أعظم صلاحك الذي ذخرته لخائفيك، وأظهرته للواثقين بك على مرأى جميع البشر،"]]}, {"l": "Mat 6:19", "n": "", "vs": [[19, "لا تكنزوا لكم كنوزا على الأرض، حيث يفسدها السوس والصدأ، وينقب عنها اللصوص ويسرقون."]]}, {"l": "Mat 6:20", "n": "", "vs": [[20, "بل اكنزوا لكم كنوزا في السماء، حيث لا يفسدها سوس ولا ينقب عنها لصوص ولا يسرقون."]]}, {"l": "Luk 12:33", "n": "", "vs": [[33, "بيعوا ما تملكون وأعطوا صدقة، واجعلوا لكم أكياسا لا تبلى، كنزا في السماوات لا ينفد، حيث لا يقترب لص ولا يفسد سوس."]]}, {"l": "2Ti 4:8", "n": "", "vs": [[8, "إنما ينتظرني الآن إكليل البر المحفوظ لي، والذي سيهبه لي الرب الديان العادل في ذلك اليوم؛ ولن يوهب لي وحدي، بل أيضا لجميع الذين يحبون ظهوره."]]}, {"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}, {"l": "1Pe 1:4", "n": "", "vs": [[4, "وإرثا لا يفنى ولا يفسد ولا يزول،"]]}], "kwAr": "المحفوظ لكم في السماوات", "noteAr": ""}, {"kw": "the word", "raw": "Col_3:16; Act_10:36, Act_13:26; Rom_10:8; 2Co_5:19, 2Co_6:7; Eph_1:13; 1Th_2:13; 1Ti_1:15; 1Pe_2:2", "note": "", "refs": [{"l": "Col 3:16", "n": "", "vs": [[16, "لتسكن كلمة المسيح في داخلكم بغنى، في كل حكمة، معلمين وواعظين بعضكم بعضا، مرنمين بمزامير وتسابيح وأناشيد روحية في قلوبكم لله، رافعين له الحمد."]]}, {"l": "Act 10:36", "n": "", "vs": [[36, "وقد أرسل كلمته إلى بني إسرائيل، وبشرهم بالسلام بواسطة يسوع المسيح، رب الجميع."]]}, {"l": "Act 13:26", "n": "", "vs": [[26, "أيها الإخوة، يابني جنس إبراهيم، ويا كل من يتقي الله من الحاضرين هنا: إلينا أرسل الله كلمة هذا الخلاص!"]]}, {"l": "Rom 10:8", "n": "", "vs": [[8, "فماذا يقول إذا؟ إنه يقول: «إن الكلمة قريبة منك. إنها في فمك وفي قلبك!» وما هذه الكلمة إلا كلمة الإيمان التي نبشر بها:"]]}, {"l": "2Co 5:19", "n": "", "vs": [[19, "ذلك أن الله كان في المسيح مصالحا العالم مع نفسه، غير حاسب عليهم خطاياهم، وقد وضع بين أيدينا رسالة هذه المصالحة."]]}, {"l": "2Co 6:7", "n": "", "vs": [[7, "في كلمة الحق وقدرة الله؛ بأسلحة البر في الهجوم والدفاع؛"]]}, {"l": "Eph 1:13", "n": "", "vs": [[13, "وفيه أنتم أيضا (وضعتم رجاءكم) إذ سمعتم كلمة الحق، أي الإنجيل الذي فيه خلاصكم؛ كذلك فيه أيضا ختمتم، إذ آمنتم، بالروح القدس الموعود،"]]}, {"l": "1Th 2:13", "n": "", "vs": [[13, "ولذلك نحن أيضا نرفع الشكر لله بلا توقف، لأنكم لما تلقيتم منا كلمة البشارة من الله، قبلتموها لا كأنها كلمة بشر، بل كما هي في الحقيقة: باعتبارها كلمة الله العاملة أيضا فيكم أنتم المؤمنين."]]}, {"l": "1Ti 1:15", "n": "", "vs": [[15, "ما أصدق هذا القول، وما أجدره بالتصديق الكلي: إن المسيح يسوع قد جاء إلى العالم ليخلص الخاطئين، وأنا أولهم!"]]}, {"l": "1Pe 2:2", "n": "", "vs": [[2, "وكأطفال مولودين حديثا، تشوقوا إلى اللبن الروحي النقي لكي تنموا به إلى أن تبلغوا الخلاص،"]]}], "kwAr": "كلمة الحق", "noteAr": ""}], "arS": [["بسبب ", []], ["الرجاء", ["G1680"]], [" ", []], ["المحفوظ", ["G606"]], [" لكم في ", []], ["السماوات", ["G3772"]], ["، الرجاء الذي ", []], ["سمعتم به سابقا", ["G4257"]], [" في ", []], ["كلمة", ["G3056"]], [" ", []], ["الحق", ["G225"]], [" التي في ", []], ["الإنجيل", ["G2098"]]]}, {"c": 1, "v": 6, "text": "والتي وصلت إليكم كما تنتشر الآن في العالم أجمع، منتجة الثمر ونامية، مثلما يحدث بينكم أنتم منذ أن سمعتم بنعمة الله واختبرتموها بالحق،", "groups": [{"kw": "is come", "raw": "Col_1:23; Psa_98:3; Mat_24:14, Mat_28:19; Mar_16:15; Rom_10:18, Rom_15:19, Rom_16:26; 2Co_10:14", "note": "", "refs": [{"l": "Col 1:23", "n": "", "vs": [[23, "على أن تثبتوا فعلا في الإيمان، مؤسسين وراسخين وغير متحولين عن رجاء الإنجيل الذي سمعتموه والذي بشر به للخليقة كلها تحت السماء، وله صرت أنا بولس خادما."]]}, {"l": "Psa 98:3", "n": "", "vs": [[3, "ذكر رحمته وأمانته لبيت إسرائيل. رأت كل أقاصي الأرض خلاص إلهنا."]]}, {"l": "Mat 24:14", "n": "", "vs": [[14, "فسوف ينادى ببشارة الملكوت هذه في العالم كله، شهادة لي لدى الأمم جميعا. وبعد ذلك تأتي النهاية."]]}, {"l": "Mat 28:19", "n": "", "vs": [[19, "فاذهبوا إذن، وتلمذوا جميع الأمم، وعمدوهم باسم الآب والابن والروح القدس؛"]]}, {"l": "Mar 16:15", "n": "", "vs": [[15, "وقال لهم: «اذهبوا إلى العالم أجمع، وبشروا الخليقة كلها بالإنجيل:"]]}, {"l": "Rom 10:18", "n": "", "vs": [[18, "ولكني أقول: أما سمعوا؟ بلى، فإن المبشرين «انطلق صوتهم إلى الأرض كلها، وكلامهم إلى أقاصي العالم»."]]}, {"l": "Rom 15:19", "n": "", "vs": [[19, "وبقوة الآيات والعجائب، وبقوة روح الله. حتى إنني، من أورشليم وما حولها حتى مقاطعة إليريكون، قد أكملت التبشير بإنجيل المسيح."]]}, {"l": "Rom 16:26", "n": "", "vs": [[26, "ولكن أذيع الآن، بأمر الله الأزلي في الكتابات النبوية، على جميع الأمم لأجل إطاعة الإيمان؛"]]}, {"l": "2Co 10:14", "n": "", "vs": [[14, "فإننا لسنا نتعدى حدودنا وكأننا لم نصل إليكم، إذ قد وصلنا إليكم فعلا بإنجيل المسيح؛"]]}], "kwAr": "وصلت إليكم", "noteAr": ""}, {"kw": "bringeth", "raw": "Col_1:10; Mar_4:8, Mar_4:26-29; Joh_15:16; Act_12:24; Rom_1:13, Rom_15:28; Eph_5:9; Phi_1:11, Phi_4:17", "note": "", "refs": [{"l": "Col 1:10", "n": "", "vs": [[10, "لكي تسلكوا سلوكا لائقا بالرب ومرضيا في كل شيء، منتجين الثمر في كل عمل صالح ونامين في معرفة الله إلى التمام،"]]}, {"l": "Mar 4:8", "n": "", "vs": [[8, "وبعض البذار وقع في الأرض الجيدة، فنبت ونما وأثمر، فأعطى بعضه ثلاثين ضعفا، وبعضه ستين، وبعضه مئة»."]]}, {"l": "Mar 4:26-29", "n": "", "vs": [[26, "وقال: «إن ملكوت الله يشبه بإنسان يلقي البذار على الأرض،"], [27, "ثم ينام ليلا ويقوم نهارا فيما البذار يطلع وينمو، وهو لا يدري كيف يحدث الأمر."], [28, "فالأرض من ذاتها تعطي الثمر، فتطلع أولا عشبة، ثم سنبلة، ثم قمحا ملء السنبلة."], [29, "ولكن حالما ينضج الثمر، يعمل فيه المنجل إذ يكون الحصاد قد حان»."]]}, {"l": "Joh 15:16", "n": "", "vs": [[16, "ليس أنتم اخترتموني، بل أنا اخترتكم وعينتكم لتنطلقوا وتنتجوا ثمرا ويدوم ثمركم، فيعطيكم الآب كل ما تطلبونه باسمي."]]}, {"l": "Act 12:24", "n": "", "vs": [[24, "أما كلمة الرب فكانت تنمو وتزداد انتشارا."]]}, {"l": "Rom 1:13", "n": "", "vs": [[13, "ثم لا أريد أن يخفى عليكم، أيها الإخوة، أنني كثيرا ما قصدت أن آتي إليكم، ليكون لي ثمر من بينكم أيضا كما لي من بين الأمم الأخرى، إلا أنني كنت أعاق حتى الآن"]]}, {"l": "Rom 15:28", "n": "", "vs": [[28, "فبعد انتهائي من هذه المهمة، وتسليمي هذا الثمر للقديسين،"]]}, {"l": "Eph 5:9", "n": "", "vs": [[9, "فإن ثمر النور يكون في كل صلاح واستقامة وحق."]]}, {"l": "Phi 1:11", "n": "", "vs": [[11, "كاملين في ثمار البر الآتية بيسوع المسيح، لمجد الله وحمده."]]}, {"l": "Phi 4:17", "n": "", "vs": [[17, "والواقع أني لا أسعى إلى العطايا، بل أسعى إلى الفائدة المتكاثرة لحسابكم."]]}], "kwAr": "منتجة الثمر", "noteAr": ""}, {"kw": "since", "raw": "Rom_10:17", "note": "", "refs": [{"l": "Rom 10:17", "n": "", "vs": [[17, "إذا، الإيمان نتيجة السماع، والسماع هو من التبشير بكلمة المسيح !"]]}], "kwAr": "منذ أن سمعتم", "noteAr": ""}, {"kw": "knew", "raw": "Psa_110:3; Act_11:18, Act_16:14, Act_26:18; 1Co_15:10,1Co_15:11; 2Co_6:1; Eph_3:2; Eph_4:23; 1Th_1:5, 1Th_2:13; 2Th_2:13; Tit_2:11, Tit_2:12; 1Pe_1:2, 1Pe_1:3, 1Pe_5:12", "note": "", "refs": [{"l": "Psa 110:3", "n": "", "vs": [[3, "في يوم محاربة أعدائك يتطوع شعبك. يجيء شبابك إلى التلال المقدسة كالندى في قلب الفجر."]]}, {"l": "Act 11:18", "n": "", "vs": [[18, "فلما سمع المعارضون هذا، سكتوا، ومجدوا الله قائلين: «إذن، قد أنعم الله أيضا على غير اليهود بالتوبة لنوال الحياة»."]]}, {"l": "Act 16:14", "n": "", "vs": [[14, "ومن بينهن تاجرة أرجوان من مدينة ثياتيرا، متعبدة لله، اسمها ليدية، كانت تسمع ففتح الله قلبها لتقبل كلام بولس."]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "1Co 15:10", "n": "", "vs": [[10, "ولكن، بنعمة الله صرت على ما أنا عليه الآن، ونعمته الموهوبة لي لم تكن عبثا، إذ عملت جاهدا أكثر من الرسل الآخرين جميعا. إلا أني لم أكن أنا العامل، بل نعمة الله التي كانت معي."]]}, {"l": "1Co 15:11", "n": "", "vs": [[11, "وسواء أكنت أ لحق، والحياة الأبدية."]]}], "kwAr": "وإدراك روحي", "noteAr": ""}], "arS": [["لذلك", ["G1223", "G5124"]], [" ", []], ["نحن", ["G2249"]], [" أيضا، من ", []], ["اليوم", ["G2250"]], [" الذي فيه ", []], ["سمعنا", ["G191"]], [" بأخباركم، ", []], ["مازلنا", ["G3973"]], [" ", []], ["نصلي", ["G4336"]], [" ", []], ["ونتضرع", ["G154"]], [" لأجلكم، لأن ", []], ["تمتلئوا", ["G4137"]], [" من تمام ", []], ["المعرفة", ["G1922"]], [" ", []], ["لمشيئة", ["G2307"]], [" الله في ", []], ["كل", ["G3956"]], [" ", []], ["حكمة", ["G4678"]], [" ", []], ["وإدراك", ["G4907"]], [" ", []], ["روحي", ["G4152"]], ["،", []]]}, {"c": 1, "v": 10, "text": "لكي تسلكوا سلوكا لائقا بالرب ومرضيا في كل شيء، منتجين الثمر في كل عمل صالح ونامين في معرفة الله إلى التمام،", "groups": [{"kw": "ye", "raw": "Col_2:6, Col_4:5; Mic_4:5; Rom_4:12, Rom_6:4; Eph_4:1, Eph_5:2, Eph_5:15; Phi_1:27; 1Th_2:12", "note": "", "refs": [{"l": "Col 2:6", "n": "", "vs": [[6, "فمثلما قبلتم المسيح يسوع الرب، ففيه اسلكوا"]]}, {"l": "Col 4:5", "n": "", "vs": [[5, "تصرفوا بحكمة مع الذين هم من خارج الكنيسة، مستغلين الوقت أحسن استغلال."]]}, {"l": "Mic 4:5", "n": "", "vs": [[5, "فإن جميع الأمم تسلك باسم إلهها، أما نحن فنسلك باسم الرب إلهنا إلى أبد الآبدين."]]}, {"l": "Rom 4:12", "n": "", "vs": [[12, "وأبا للمختونين الذين ليسوا من أهل الختان وحسب بل الذين يسيرون في خطى الإيمان الذي كان لأبينا إبراهيم وهو بعد غير مختون."]]}, {"l": "Rom 6:4", "n": "", "vs": [[4, "وبسبب ذلك دفنا معه بالمعمودية للموت، حتى كما أقيم المسيح من الأموات بمجد الآب، كذلك نسلك نحن أيضا في حياة جديدة."]]}, {"l": "Eph 4:1", "n": "", "vs": [[1, "... إذن، أنا السجين في الرب، أناشدكم أن تسلكوا سلوكا يليق بالدعوة التي إليها دعيتم،"]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "Eph 5:15", "n": "", "vs": [[15, "فانتبهوا تماما إذن كيف تسلكون بتدقيق، لا سلوك الجهلاء بل سلوك العقلاء،"]]}, {"l": "Phi 1:27", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"]]}, {"l": "1Th 2:12", "n": "", "vs": [[12, "ونحرضكم أن تسلكوا سلوكا يليق بالله، ذاك الذي يدعوكم إلى ملكوته ومجده."]]}], "kwAr": "لكي تسلكوا سلوكا لائقا بالرب", "noteAr": ""}, {"kw": "all", "raw": "Col_3:20; Pro_16:7; Phi_4:18; 1Th_4:1; 2Ti_2:4; Heb_11:5, Heb_13:16; 1Jo_3:22", "note": "", "refs": [{"l": "Col 3:20", "n": "", "vs": [[20, "أيها الأولاد، أطيعوا والديكم في كل أمر، لأن ذلك مرضي في الرب."]]}, {"l": "Pro 16:7", "n": "", "vs": [[7, "إذا رضي الرب عن تصرفات الإنسان، جعل أعداءه أيضا يسالمونه."]]}, {"l": "Phi 4:18", "n": "", "vs": [[18, "فالآن عندي كل ما يسد حاجتي ويزيد عنها. أنا في بحبوحة إذ تسلمت من أبفروديتس ما بعثتم به إلي، عطرا طيب الرائحة، ذبيحة يقبلها الله ويسر بها."]]}, {"l": "1Th 4:1", "n": "", "vs": [[1, "وبعد، أيها الإخوة، فمثلما تلقيتم منا كيف يجب أن تسلكوا سلوكا يرضي الله ، وكما أنتم فاعلون، نرجو منكم ونحرضكم في الرب يسوع أن تضاعفوا تقدمكم في ذلك أكثر فأكثر."]]}, {"l": "2Ti 2:4", "n": "", "vs": [[4, "وما من مجند يربك نفسه بشؤون الحياة إذا رغب في إرضاء من جنده."]]}, {"l": "Heb 11:5", "n": "", "vs": [[5, "وبالإيمان، انتقل أخنوخ إلى حضرة الله دون أن يموت. وقد اختفى من على هذه الأرض لأن الله أخذه إليه. وقبل حدوث ذلك، شهد له بأنه قد أرضى الله ."]]}, {"l": "Heb 13:16", "n": "", "vs": [[16, "ولا تغفلوا أيضا عن عمل الخير وإعانة المحتاجين: لأن مثل هذه «الذبائح» تسر الله جدا!"]]}, {"l": "1Jo 3:22", "n": "", "vs": [[22, "ومهما نطلب منه بالصلاة، نحصل عليه: لأننا نطيع ما يوصينا به، ونمارس الأعمال التي ترضيه."]]}], "kwAr": "ومرضيا في كل شيء", "noteAr": ""}, {"kw": "fruitful", "raw": "Joh_15:8, Joh_15:16; Gal_5:22, Gal_5:23; Eph_2:10; Phi_1:11; Tit_3:1, Tit_3:14; Heb_13:21; 2Pe_1:8", "note": "", "refs": [{"l": "Joh 15:8", "n": "", "vs": [[8, "بهذا يتمجد أبي: أن تنتجوا ثمرا كثيرا فتكونون حقا تلاميذي."]]}, {"l": "Joh 15:16", "n": "", "vs": [[16, "ليس أنتم اخترتموني، بل أنا اخترتكم وعينتكم لتنطلقوا وتنتجوا ثمرا ويدوم ثمركم، فيعطيكم الآب كل ما تطلبونه باسمي."]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Gal 5:23", "n": "", "vs": [[23, "والوداعة وضبط النفس. وليس من قانون يمنع مثل هذه الفضائل."]]}, {"l": "Eph 2:10", "n": "", "vs": [[10, "فإننا نحن تحفة الله، وقد خلقنا في المسيح يسوع لأعمال صالحة أعدها سلفا لنسلك فيها."]]}, {"l": "Phi 1:11", "n": "", "vs": [[11, "كاملين في ثمار البر الآتية بيسوع المسيح، لمجد الله وحمده."]]}, {"l": "Tit 3:1", "n": "", "vs": [[1, "ذكر المؤمنين أن يخضعوا للحكام والسلطات، ويطيعوا القانون، ويكونوا مستعدين لكل عمل صالح،"]]}, {"l": "Tit 3:14", "n": "", "vs": [[14, "وليتعلم ذوونا أيضا أن يمارسوا أعمالا حسنة، لسد الحاجات الضرورية، لكي لا يكونوا عديمي الثمر."]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}, {"l": "2Pe 1:8", "n": "", "vs": [[8, "فحين تكون هذه الصفات الطيبة في داخلكم، وتزداد بوفرة، تجعلكم مجتهدين ومثمرين في معرفتكم لربنا يسوع المسيح."]]}], "kwAr": "منتجين الثمر", "noteAr": ""}, {"kw": "increasing", "raw": "Col_2:19; Isa_53:11; Dan_12:4; Hab_2:14; Joh_17:3; 2Co_2:14, 2Co_4:6, 2Co_9:8; Eph_1:17, Eph_4:13; 2Pe_1:2, 2Pe_1:3, 2Pe_3:18; 1Jo_5:20", "note": "", "refs": [{"l": "Col 2:19", "n": "", "vs": [[19, "وهو غير ممسك بالرأس الذي منه يتلقى الجسد كله غذاءه وتماسكه بالمفاصل والأوصال، فينمو النمو الذي يمنحه الله ."]]}, {"l": "Isa 53:11", "n": "", "vs": [[11, "ويرى ثمار تعب نفسه ويشبع، وعبدي البار يبرر بمعرفته كثيرين ويحمل آثامهم."]]}, {"l": "Dan 12:4", "n": "", "vs": [[4, "أما أنت يادانيآل فاكتم الكلام، واختم على الكتاب إلى ميعاد النهاية. وكثيرون يطوفون في الأرض وتزداد المعرفة»."]]}, {"l": "Hab 2:14", "n": "", "vs": [[14, "لأن الأرض ستمتليء من معرفة مجد الرب كما تغمر المياه البحر."]]}, {"l": "Joh 17:3", "n": "", "vs": [[3, "والحياة الأبدية هي أن يعرفوك أنت الإله الحق وحدك، والذي أرسلته: يسوع المسيح."]]}, {"l": "2Co 2:14", "n": "", "vs": [[14, "ولكن، شكرا لله الذي يقودنا دائما في موكب النصر في المسيح، وينشر بنا رائحة معرفته في كل مكان."]]}, {"l": "2Co 4:6", "n": "", "vs": [[6, "فإن الله ، الذي أمر أن يشرق نور من الظلام، هو الذي جعل النور يشرق في قلوبنا، لإشعاع معرفة مجد الله المتجلي في وجه المسيح."]]}, {"l": "2Co 9:8", "n": "", "vs": [[8, "والله قادر أن يجعل كل نعمة تفيض عليكم، حتى يكون لكم اكتفاء كلي في كل شيء وكل حين، فتفيضوا في كل عمل صالح؛"]]}, {"l": "Eph 1:17", "n": "", "vs": [[17, "حتى يهبكم إله ربنا يسوع المسيح، أبو المجد، روح حكمة وإلهام: لتعرفوه معرفة كاملة"]]}, {"l": "Eph 4:13", "n": "", "vs": [[13, "حتى نصل جميعا إلى وحدة الإيمان ووحدة المعرفة لابن الله، إلى إنسان تام البلوغ، إلى مقدار قامة ملء المسيح."]]}, {"l": "2Pe 1:2", "n": "", "vs": [[2, "ليكن لكم المزيد من النعمة والسلام بفضل معرفة الله ويسوع ربنا!"]]}, {"l": "2Pe 1:3", "n": "", "vs": [[3, "إن الله، بقدرته الإلهية، قد زودنا بكل ما نحتاج إليه في الحيا ة الروحية المتصفة بالتقوى. ذلك أنه عرفنا بالمسيح الذي دعانا إلى مجده وفضيلته،"]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}, {"l": "1Jo 5:20", "n": "", "vs": [[20, "وإننا نعلم أن ابن الله قد جاء إلى الأرض وأنار أذهاننا لنعرف الإله الحق. ونحن الآن نحيا فيه، لأننا في ابنه يسوع المسيح. هذا هو الإله الحق، والحياة الأبدية."]]}], "kwAr": "ونامين في معرفة الله", "noteAr": ""}], "arS": [["لكي ", []], ["تسلكوا", ["G4043"]], [" سلوكا ", []], ["لائقا", ["G516"]], [" ", []], ["بالرب", ["G2962"]], [" ", []], ["ومرضيا", ["G699"]], [" في ", []], ["كل", ["G3956"]], [" شيء، ", []], ["منتجين الثمر", ["G2592"]], [" في كل ", []], ["عمل", ["G2041"]], [" ", []], ["صالح", ["G18"]], [" ", []], ["ونامين", ["G837"]], [" في ", []], ["معرفة", ["G1922"]], [" ", []], ["الله", ["G2316"]], [" إلى التمام،", []]]}, {"c": 1, "v": 11, "text": "متشددين بكل قوة موافقة لقدرة مجده، لتتمكنوا تماما من الاحتمال وطول البال،", "groups": [{"kw": "Strengthened", "raw": "Isa_45:24; 2Co_12:9; Eph_3:16, Eph_6:10; Phi_4:13", "note": "", "refs": [{"l": "Isa 45:24", "n": "", "vs": [[24, "ويقولون عني: إنما بالرب وحده البر والقوة، وكل من يغتاظ منه يأتي إلى الرب ويخزى."]]}, {"l": "2Co 12:9", "n": "", "vs": [[9, "فقال لي: «نعمتي تكفيك، لأن قدرتي تكمل في الضعف!» فأنا أرضى بأن أفتخر مسرورا بالضعفات التي في، لكي تخيم علي قدرة المسيح."]]}, {"l": "Eph 3:16", "n": "", "vs": [[16, "لكي يمنحكم، وفقا لغنى مجده، أن يمد الروح الكيان الداخلي في كل منكم بالقوة المؤيدة،"]]}, {"l": "Eph 6:10", "n": "", "vs": [[10, "وختاما، تشددوا في الرب وفي قدرة قوته."]]}, {"l": "Phi 4:13", "n": "", "vs": [[13, "إني أستطيع كل شيء، في المسيح الذي يقويني."]]}], "kwAr": "متشددين بكل قوة", "noteAr": ""}, {"kw": "his", "raw": "Exo_15:6; Psa_63:2; Act_1:8; 2Co_4:7; Jud_1:25", "note": "", "refs": [{"l": "Exo 15:6", "n": "", "vs": [[6, "يمينك يارب مجيدة في قوتها. بيمينك يارب تسحق العدو."]]}, {"l": "Psa 63:2", "n": "", "vs": [[2, "حتى أعاين قدرتك ومجدك، مثلما رأيتك في موضعك المقدس."]]}, {"l": "Act 1:8", "n": "", "vs": [[8, "ولكن حينما يحل الروح القدس عليكم تنالون القوة، وتكونون لي شهودا في أورشليم واليهودية كلها، وفي السامرة، وإلى أقاصي الأرض»."]]}, {"l": "2Co 4:7", "n": "", "vs": [[7, "ولكن هذا الكنز نحمله نحن في أوعية من فخار، ليتبين أن القدرة الفائقة آتية من الله لا صادرة منا."]]}, {"l": "Jud 1:25", "n": "", "vs": [[25, "لله الواحد، مخلصنا بيسوع المسيح ربنا ... المجد والجلال والقدرة والسلطة، من قبل أن كان الزمان، والآن وطوال الأزمان آمين!"]]}], "kwAr": "لقدرة مجده", "noteAr": ""}, {"kw": "unto", "raw": "Pro_24:10; Act_5:41; Rom_2:7, Rom_5:3-5; 2Co_6:4-6, 2Co_12:9, 2Co_12:10; Eph_4:2; 1Th_3:3, 1Th_3:4; 2Ti_2:1-3; Heb_10:34-38, Heb_11:34-38, Heb_12:1, Heb_12:2; Jam_1:2-4; Jam_5:7, Jam_5:8; 2Pe_1:6; Rev_14:12", "note": "", "refs": [{"l": "Pro 24:10", "n": "", "vs": [[10, "إن عييت في يوم الضيق تكون واهن القوى."]]}, {"l": "Act 5:41", "n": "", "vs": [[41, "ولكن الرسل خرجوا من المجلس فرحين، لأنهم اعتبروا أهلا لأن يلقوا الإهانة من أجل اسم يسوع."]]}, {"l": "Rom 2:7", "n": "", "vs": [[7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"]]}, {"l": "Rom 5:3-5", "n": "", "vs": [[3, "ليس هذا فقط، بل نفتخر أيضا في وسط الضيقات، لعلمنا أن الضيق ينتج فينا الصبر،"], [4, "والصبر يؤهلنا للفوز في الامتحان، والفوز يبعث فينا الرجاء،"], [5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."]]}, {"l": "2Co 6:4-6", "n": "", "vs": [[4, "وإنما نتصرف في كل شيء بما يبين أننا فعلا خدام الله: في تحمل الكثير؛ في الشدائد والحاجات والضيقات والجلدات"], [5, "والسجون والاضطرابات والأتعاب والسهر والصوم؛"], [6, "في الطهارة والمعرفة وطول البال واللطف؛ في الروح القدس والمحبة الخالصة من الرياء؛"]]}, {"l": "2Co 12:9", "n": "", "vs": [[9, "فقال لي: «نعمتي تكفيك، لأن قدرتي تكمل في الضعف!» فأنا أرضى بأن أفتخر مسرورا بالضعفات التي في، لكي تخيم علي قدرة المسيح."]]}, {"l": "2Co 12:10", "n": "", "vs": [[10, "فلأجل المسيح، تسرني الضعفات والإهانات والضيقات والاضطهادات والصعوبات، لأني حينما أكون ضعيفا، فحينئذ أكون قويا!"]]}, {"l": "Eph 4:2", "n": "", "vs": [[2, "بكل تواضع ووداعة وطول بال، محتملين بعضكم بعضا في المحبة،"]]}, {"l": "1Th 3:3", "n": "", "vs": [[3, "حتى لا يتزعزع أحد منكم من جراء هذه الضيقات. فإنكم تعلمون أننا معينون لذلك؛"]]}, {"l": "1Th 3:4", "n": "", "vs": [[4, "وقد سبق لنا، لما كنا عندكم أن أخبرناكم أننا سنقاسي الضيقات، الأمر الذي حدث بعد ذلك كما تعلمون."]]}, {"l": "2Ti 2:1-3", "n": "", "vs": [[1, "وأنت ياولدي، فكن قويا في النعمة التي في المسيح يسوع."], [2, "والتعاليم التي سمعتها مني بحضور شهود عديدين، أودعها أمانة بين أيدي أناس جديرين بالثقة، يكونون قادرين على تعليم الآخرين."], [3, "شارك في احتمال الآلام كجندي صالح للمسيح يسوع."]]}, {"l": "Heb 10:34-38", "n": "", "vs": [[34, "فقد تعاطفتم مع المسجونين، كما تقبلتم نهب ممتلكاتكم بفرح، علما منكم بأن لكم في السماء ثروة أفضل وأبقى."], [35, "إذن، لا تتخلوا عن ثقتكم بالرب. فإن لها مكافأة عظيمة."], [36, "إنكم تحتاجون إلى الصبر لتعملوا إرادة الله، فتنالوا البركة التي وعدتم بها."], [37, "فقريبا جدا، سيأتي الآتي ولا يتمهل."], [38, "وأما من تبرر بالإيمان، فبالإيمان يحيا. ومن ارتد لا تسر به نفسي!"]]}, {"l": "Heb 11:34-38", "n": "", "vs": [[34, "وأبطلوا قوة النار، ونجوا من الموت قتلا بالسيف. وبه أيضا نالوا القوة بعد ضعف، فصاروا أشداء في المعارك، وردوا جيوشا غريبة على أعقابها."], [35, "وبالإيمان، استرجعت بعض النساء أمواتهن بعدما أعيدوا إلى الحياة. وبه، تحمل كثيرون العذاب والضرب، وماتوا رافضين النجاة لعلمهم أنهم سوف يقومون إلى حياة أفضل."], [36, "وكثيرون غيرهم تحملوا المحاكمات الظالمة تحت الإهانة والجلد، والإلقاء في السجون مقيدين بالسلاسل."], [37, "ومنهم من حوكموا فماتوا رجما بالحجارة، أو نشرا بالمنشار، أو ذبحا بالسيف. وبعضهم، تشردوا متسترين بجلود الغنم والمعزى، يعانون من الحاجة والضيق والظلم،"], [38, "ولم يكن العالم يستحقهم، تائهين في البراري والجبال والمغاور والكهوف."]]}, {"l": "Heb 12:1", "n": "", "vs": [[1, "فبما أن هذا العدد الكبير من الشاهدين للإيمان، يتجمع حولنا كأنه سحابة عظيمة، فلنطرح جانبا كل ثقل يعيقنا عن التقدم، ونتخلص من تلك الخطيئة التي نتعرض للسقوط في فخها بسهولة، لكي نتمكن، نحن أيضا، أن نركض باجتهاد في السباق الممتد أمامنا،"]]}, {"l": "Heb 12:2", "n": "", "vs": [[2, "متطلعين دائما إلى يسوع: رائد إيماننا ومكمله. فهو قد تحمل الموت صلبا، هازئا بما في ذلك من عار، إذ كان ينظر إلى السرور الذي ينتظره، ثم جلس عن يمين عرش الله."]]}, {"l": "Jam 1:2-4", "n": "", "vs": [[2, "ياإخوتي، عندما تنزل بكم التجارب والمحن المختلفة، اعتبروها سبيلا إلى الفرح الكلي."], [3, "وكونوا على ثقة بأن امتحان إيمانكم هذا ينتج صبرا."], [4, "ودعوا الصبر يعمل عمله الكامل فيكم، لكي يكتمل نضوجكم وتصيروا أقوياء قادرين على مواجهة جميع الأحوال."]]}, {"l": "Jam 5:7", "n": "", "vs": [[7, "وأما أنتم، ياإخوتي، فاصبروا منتظرين عودة الرب. خذوا العبرة من الفلاح: فهو ينتظر أن تعطيه الأرض غلالا ثمينة، صابرا على الزرع حتى يشرب من مطر الخريف ومطر الربيع."]]}, {"l": "Jam 5:8", "n": "", "vs": [[8, "فاصبروا أنتم إذن، وشددوا قلوبكم لأن عودة الرب قد صارت قريبة."]]}, {"l": "2Pe 1:6", "n": "", "vs": [[6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"]]}, {"l": "Rev 14:12", "n": "", "vs": [[12, "وهنا يظهر صبر القديسين الذين يحافظون على وصايا الله والإيمان بيسوع!»"]]}], "kwAr": "الاحتمال وطول البال", "noteAr": ""}], "arS": [["متشددين", ["G1412"]], [" ", []], ["بكل", ["G3956"]], [" ", []], ["قوة", ["G1411"]], [" ", []], ["موافقة", ["G2596"]], [" ", []], ["لقدرة", ["G2904"]], [" ", []], ["مجده", ["G1391"]], ["، لتتمكنوا تماما من ", []], ["الاحتمال", ["G5281"]], [" ", []], ["وطول البال", ["G3115"]], ["،", []]]}, {"c": 1, "v": 12, "text": "رافعين الشكر بفرح للآب الذي جعلكم أهلا للاشتراك في ميراث القديسين في (ملكوت) النور،", "groups": [{"kw": "Giving", "raw": "Col_3:15, Col_3:17; 1Ch_29:20; Psa_79:13, Psa_107:21, Psa_107:22, Psa_116:7; Dan_2:23; Eph_5:4, Eph_5:20", "note": "", "refs": [{"l": "Col 3:15", "n": "", "vs": [[15, "وليملك في قلوبكم سلام المسيح، فإليه قد دعيتم في الجسد الواحد؛ وكونوا شاكرين!"]]}, {"l": "Col 3:17", "n": "", "vs": [[17, "ومهما كان ما تعملونه، بالقول أو بالفعل، فليجر كل شيء باسم الرب يسوع، رافعين به الشكر لله الآب."]]}, {"l": "1Ch 29:20", "n": "", "vs": [[20, "ثم قال داود للجمع الحاضر: «باركوا الرب إلهكم». فسبح كل الجمع الرب إله آبائهم وسجدوا للرب وللملك."]]}, {"l": "Psa 79:13", "n": "", "vs": [[13, "فنحمدك نحن شعبك وغنم مرعاك إلى الأبد ونذيع تسبيحك من جيل إلى جيل."]]}, {"l": "Psa 107:21", "n": "", "vs": [[21, "فليرفعوا الشكر للرب على رحمته، وعلى عجائبه لبني آدم."]]}, {"l": "Psa 107:22", "n": "", "vs": [[22, "وليقربوا له ذبائح الشكر، ويحدثوا بأعماله بترانيم الفرح."]]}, {"l": "Psa 116:7", "n": "", "vs": [[7, "عودي يانفسي إلى طمأنينتك، لأن الرب قد أحسن إليك."]]}, {"l": "Dan 2:23", "n": "", "vs": [[23, "لك ياإله آبائي أحمد وأسبح، لأنك أنعمت علي بالحكمة والقوة، أطلعتني الآن على ما التمسناه منك إذ عرفتنا بأمر الملك»."]]}, {"l": "Eph 5:4", "n": "", "vs": [[4, "وكذلك البذاءة والكلام السفيه والهزل، فهي غير لائقة. وإنما أحرى بكم أن تلهجوا بالشكر لله!"]]}, {"l": "Eph 5:20", "n": "", "vs": [[20, "رافعين الشكر كل حين وعلى كل شيء لله والآب، باسم ربنا يسوع المسيح؛"]]}], "kwAr": "رافعين الشكر بفرح", "noteAr": ""}, {"kw": "the Father", "raw": "Col_2:2; Joh_4:23, Joh_14:6, Joh_20:17; 1Co_8:6; Eph_4:6; Jam_3:9; 1Jo_1:3", "note": "", "refs": [{"l": "Col 2:2", "n": "", "vs": [[2, "بغرض أن تتشجع قلوبهم وتكون كلها متحدة في المحبة، لبلوغ الإدراك التام بكل غناه، لمعرفة سر الله، أي المسيح،"]]}, {"l": "Joh 4:23", "n": "", "vs": [[23, "فستأتي ساعة، لا بل هي الآن، حين يعبد العابدون الصادقون الآب بالروح وبالحق. لأن الآب يبتغي مثل هؤلاء العابدين."]]}, {"l": "Joh 14:6", "n": "", "vs": [[6, "فأجابه يسوع: «أنا هو الطريق والحق والحياة. لا يأتي أحد إلى الآب إلا بي."]]}, {"l": "Joh 20:17", "n": "", "vs": [[17, "فقال لها: «لا تمسكي بي! فإني لم أصعد بعد إلى الآب، بل اذهبي إلى إخوتي وقولي لهم: إني سأصعد إلى أبي وأبيكم، وإلهي وإلهكم!»"]]}, {"l": "1Co 8:6", "n": "", "vs": [[6, "فليس عندنا نحن إلا إله واحد هو الآب الذي منه كل شيء، ونحن له؛ ورب واحد هو يسوع المسيح الذي به كل شيء ونحن به."]]}, {"l": "Eph 4:6", "n": "", "vs": [[6, "وإله وآب واحد للجميع، وهو فوق الجميع وبالجميع وفي الجميع."]]}, {"l": "Jam 3:9", "n": "", "vs": [[9, "به نرفع الحمد والشكر للرب والآب، وبه نوجه الشتائم إلى الناس الذين خلقهم الله على مثاله."]]}, {"l": "1Jo 1:3", "n": "", "vs": [[3, "فنحن، إذن، نخبركم بما رأيناه وسمعناه، لكي تكونوا شركاءنا. كما أن شركتنا هي مع الآب ومع ابنه يسوع المسيح."]]}], "kwAr": "للآب", "noteAr": ""}, {"kw": "made", "raw": "1Ki_6:7; Pro_16:1; Rom_8:29, Rom_8:30, Rom_9:23; 2Co_5:5; Tit_2:14; Rev_22:14", "note": "", "refs": [{"l": "1Ki 6:7", "n": "", "vs": [[7, "وتم بناء الهيكل بحجارة صحيحة، اقتلعها العمال ونحتوها في مقالعها، فلم يسمع في الهيكل عند بنائه صوت منحت أو معول أو أي أداة حديدية."]]}, {"l": "Pro 16:1", "n": "", "vs": [[1, "يسعى الإنسان بالتفكير والتدبير، إنما الرب يعطي الجواب الفاصل."]]}, {"l": "Rom 8:29", "n": "", "vs": [[29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."]]}, {"l": "Rom 8:30", "n": "", "vs": [[30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."]]}, {"l": "Rom 9:23", "n": "", "vs": [[23, "وذلك بقصد أن يعلن غنى مجده في أوعية الرحمة التي سبق فأعدها للمجد،"]]}, {"l": "2Co 5:5", "n": "", "vs": [[5, "والذي أعدنا لهذا الأمر بعينه هو الله ، وقد أعطانا الروح عربونا أيضا."]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Rev 22:14", "n": "", "vs": [[14, "طوبى للذين يغسلون ثيابهم، فلهم السلطة على شجرة الحياة، والحق في دخول المدينة من الأبواب!"]]}], "kwAr": "جعلكم أهلا", "noteAr": ""}, {"kw": "partakers", "raw": "Rom_11:17, Rom_15:27; 1Co_9:23; Eph_3:6; Heb_3:1, Heb_3:14; 1Pe_5:1; 1Jo_3:1-3", "note": "", "refs": [{"l": "Rom 11:17", "n": "", "vs": [[17, "فإذا كانت بعض أغصان الزيتونة قد قطعت، ثم طعمت فيها وأنت من زيتونة برية، فصرت بذلك شريكا في أصل الزيتونة وغذائها،"]]}, {"l": "Rom 15:27", "n": "", "vs": [[27, "حسن لديهم ذلك، وهم في دين لأولئك القديسين: فإذا كان الأمم قد اشتركوا في ما هو روحي عند أولئك، فعليهم أيضا أن يخدموهم في ما هو مادي."]]}, {"l": "1Co 9:23", "n": "", "vs": [[23, "وإني أفعل الأمور كلها من أجل الإنجيل، لأكون شريكا فيه مع الآخرين."]]}, {"l": "Eph 3:6", "n": "", "vs": [[6, "وهو أن الأمم هم شركاء اليهود في الميراث، وأعضاء في الجسد معهم، ولهم أيضا حق الاستفادة من الوعد. وذلك في المسيح يسوع وبفضل الإنجيل"]]}, {"l": "Heb 3:1", "n": "", "vs": [[1, "إذن، أيها الإخوة القديسون الذين اشتركتم في الدعوة السماوية، تأملوا يسوع: الرسول ورئيس الكهنة في الإيمان الذي نتمسك به."]]}, {"l": "Heb 3:14", "n": "", "vs": [[14, "فإن تمسكنا دائما بالثقة التي انطلقنا بها في البداية، وأبقيناها ثابتة إلى النهاية، نكون مشاركين للمسيح."]]}, {"l": "1Pe 5:1", "n": "", "vs": [[1, "وهذه وصيتي إلى الشيوخ الذين بينكم، بصفتي شيخا رفيقا لهم، وشاهدا لآلام المسيح، وشريكا في المجد الذي سيتجلى:"]]}, {"l": "1Jo 3:1-3", "n": "", "vs": [[1, "تأملوا ما أعظم المحبة التي أحبنا بها الآب حتى صرنا ندعى «أولاد الله»، ونحن أولاده حقا. ولكن، بما أن أهل العالم لا يعرفون الله، فهم لا يعرفوننا."], [2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"], [3, "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر."]]}], "kwAr": "للاشتراك", "noteAr": ""}, {"kw": "inheritance", "raw": "Mat_25:34; Act_20:32, Act_26:18; Rom_8:17; Eph_1:11, Eph_1:18; 1Pe_1:2-5", "note": "", "refs": [{"l": "Mat 25:34", "n": "", "vs": [[34, "ثم يقول الملك للذين عن يمينه: تعالوا يامن باركهم أبي، رثوا الملكوت الذي أعد لكم منذ إنشاء العالم:"]]}, {"l": "Act 20:32", "n": "", "vs": [[32, "وا لآن أسلمكم إلى الله وإلى كلمة نعمته القادرة أن تبنيكم وتعطيكم ميراثا تشتركون فيه مع جميع المقدسين لله."]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "Rom 8:17", "n": "", "vs": [[17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}, {"l": "Eph 1:11", "n": "", "vs": [[11, "وفي المسيح أيضا قد حصلنا على الميراث الذي سبق أن عينا له، وفقا لقصده، هو الذي يعمل كل شيء كما تقضي مشيئته."]]}, {"l": "Eph 1:18", "n": "", "vs": [[18, "إذ تستنير بصائر قلوبكم، فتعلموا ما في دعوته لكم من رجاء، وما هو غنى مجد ميراثه في القديسين،"]]}, {"l": "1Pe 1:2-5", "n": "", "vs": [[2, "بحسب علمه السابق ثم قدسهم بالروح ليطيعوا يسوع المسيح ويطهروا برش دمه عليهم."], [3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"], [4, "وإرثا لا يفنى ولا يفسد ولا يزول،"], [5, "محفوظا لكم في السماوات. فإنكم محفوظون بقدرة الله العاملة من خلال إيمانكم، إلى أن تفوزوا بالخلاص النهائي المعد لكم والذي سوف يتجلى في الزمان الأخير."]]}], "kwAr": "ميراث القديسين", "noteAr": ""}, {"kw": "in", "raw": "Psa_36:9, Psa_97:11; Pro_4:18; Isa_60:19, Isa_60:20; Heb_12:23; Rev_21:23, Rev_22:5", "note": "", "refs": [{"l": "Psa 36:9", "n": "", "vs": [[9, "لأن عندك نبع الحياة، وبنورك نرى النور."]]}, {"l": "Psa 97:11", "n": "", "vs": [[11, "قد زرع نور للصديق وفرح للمستقيمي القلب."]]}, {"l": "Pro 4:18", "n": "", "vs": [[18, "أما سبيل الأبرار فكنور متلأليء يتزايد إشراقه إلى أن يكتمل النهار،"]]}, {"l": "Isa 60:19", "n": "", "vs": [[19, "ولا تعود الشمس نورا لك في النهار ولا يشرق ضوء القمر عليك لأن الرب يكون نورك الأبدي، وإلهك يكون مجدك."]]}, {"l": "Isa 60:20", "n": "", "vs": [[20, "ولا تغرب شمسك من بعد، ولا يتضاءل قمرك، لأن الرب يكون نورك الأبدي، وتنقضي أيام مناحتك."]]}, {"l": "Heb 12:23", "n": "", "vs": [[23, "إلى كنيسة تجمع أبناء لله أبكارا، أسماؤهم مكتوبة في السماء. بل إلى الله نفسه، ديان الجميع، وإلى أرواح أناس بررهم الله وجعلهم كاملين."]]}, {"l": "Rev 21:23", "n": "", "vs": [[23, "ولم تكن المدينة في حاجة إلى نور الشمس أو القمر، لأن مجد الله ينيرها، والحمل مصباحها."]]}, {"l": "Rev 22:5", "n": "", "vs": [[5, "ولن يكون هنالك ليل، فلا يحتاجون إلى نور مصباح أو شمس، لأن الرب الإله ينير عليهم، وهم سيملكون إلى أبد الآبدين!"]]}], "kwAr": "في النور", "noteAr": ""}], "arS": [["رافعين الشكر", ["G2168"]], [" ", []], ["بفرح", ["G5479"]], [" ", []], ["للآب", ["G3962"]], [" الذي ", []], ["جعلكم أهلا", ["G2427"]], [" ", []], ["للاشتراك", ["G3310"]], [" في ", []], ["ميراث", ["G2819"]], [" ", []], ["القديسين", ["G40"]], [" في (ملكوت) ", []], ["النور", ["G5457"]], ["،", []]]}, {"c": 1, "v": 13, "text": "هو الذي أنقذنا من سلطة الظلام ونقلنا إلى ملكوت ابن محبته", "groups": [{"kw": "delivered", "raw": "Isa_49:24, Isa_49:25, Isa_53:12; Mat_12:29, Mat_12:30; Act_26:18; Heb_2:14", "note": "", "refs": [{"l": "Isa 49:24", "n": "", "vs": [[24, "هل تسلب الغنيمة من المحارب الجبار؟ أو يفلت الأسرى من قبضة الغالب؟"]]}, {"l": "Isa 49:25", "n": "", "vs": [[25, "نعم سبي الجبار يسلب منه، وتسترد الغنيمة من الغالب، لأنني أخاصم مخاصميك وأنقذ أبناءك،"]]}, {"l": "Isa 53:12", "n": "", "vs": [[12, "لذلك أهبه نصيبا بين العظماء، فيقسم غنيمة مع الأعزاء، لأنه سكب للموت نفسه، وأحصي مع أثمة. وهو حمل خطيئة كثيرين، وشفع في المذنبين."]]}, {"l": "Mat 12:29", "n": "", "vs": [[29, "وإلا، فكيف يقدر أحد أن يدخل بيت القوي وينهب أمتعته إذا لم يربط القوي أولا؛ وبعدئذ ينهب بيته؟"]]}, {"l": "Mat 12:30", "n": "", "vs": [[30, "من ليس معي، فهو ضدي؛ ومن لا يجمع معي، فهو يفرق."]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "Heb 2:14", "n": "", "vs": [[14, "إذن، بما أن هؤلاء الأولاد متشاركون في أجسام بشرية من لحم ودم، اشترك المسيح أيضا في اللحم والدم باتخاذه جسما بشريا. وهكذا تمكن أن يموت، ليقضي على من له سلطة الموت، أي إبليس،"]]}], "kwAr": "أنقذنا", "noteAr": ""}, {"kw": "the power", "raw": "Luk_22:53; Joh_12:31, Joh_12:32; 2Co_4:4; Eph_4:18, Eph_5:8, Eph_6:12; 1Pe_2:9; 1Jo_2:8, 1Jo_3:8", "note": "", "refs": [{"l": "Luk 22:53", "n": "", "vs": [[53, "عندما كنت معكم كل يوم في الهيكل، لم تمدوا أيديكم علي. ولكن هذه الساعة لكم، والسلطة الآن للظلام!»"]]}, {"l": "Joh 12:31", "n": "", "vs": [[31, "الآن وقت الحكم على هذا العالم! الآن يطرد سيد هذا العالم خارجا!"]]}, {"l": "Joh 12:32", "n": "", "vs": [[32, "وحين أعلق مرفوعا عن الأرض أجذب إلي الجميع»."]]}, {"l": "2Co 4:4", "n": "", "vs": [[4, "الذين أعمى إله هذا العالم أذهانهم حتى لا يضيء لهم نور الإنجيل المختص بمجد المسيح الذي هو صورة الله."]]}, {"l": "Eph 4:18", "n": "", "vs": [[18, "لكونهم مظلمي البصيرة ومتغربين عن حياة الله بسبب ما فيهم من جهل وقساوة قلب."]]}, {"l": "Eph 5:8", "n": "", "vs": [[8, "فقد كنتم في الماضي ظلاما، ولكنكم الآن نور في الرب. فاسلكوا سلوك أولاد النور."]]}, {"l": "Eph 6:12", "n": "", "vs": [[12, "فإن حربنا ليست ضد ذوي اللحم والدم، بل ضد الرئاسات، ضد السلطات، ضد أسياد العالم حكام هذا الظلام، ضد قوى الشر الروحية في الأماكن السماوية."]]}, {"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}, {"l": "1Jo 2:8", "n": "", "vs": [[8, "ومع ذلك فالوصية التي أكتبها إليكم، هي جديدة دائما، وتتضح حقيقتها في المسيح كما تتضح فيكم أنتم. ذلك لأن الظلام قد بدأ يزول منذ أن أشرق النور الحقيقي الذي مازال الآن مشرقا."]]}, {"l": "1Jo 3:8", "n": "", "vs": [[8, "ولكن من يمارس الخطيئة، يظهر أنه من أولاد إبليس، لأن إبليس يمارس الخطيئة منذ البداية. وقد جاء ابن الله إلى الأرض لكي يبطل أعمال إبليس."]]}], "kwAr": "سلطة الظلام", "noteAr": ""}, {"kw": "and", "raw": "Luk_13:24; Joh_5:24; Rom_6:17-22; 1Co_6:9-11; 2Co_6:17, 2Co_6:18; Eph_2:3-10; 1Th_2:12; Tit_3:3-6; 2Pe_1:11; 1Jo_3:14", "note": "", "refs": [{"l": "Luk 13:24", "n": "", "vs": [[24, "«ابذلوا الجهد للدخول من الباب الضيق، فإني أقول لكم إن كثيرين سيسعون إلى الدخول، فلا يتمكنون."]]}, {"l": "Joh 5:24", "n": "", "vs": [[24, "الحق الحق أقول لكم إن من يسمع كلامي ويؤمن بالذي أرسلني تكون له الحياة الأبدية، ولا يحاكم في اليوم الأخير، لأنه قد انتقل من الموت إلى الحياة."]]}, {"l": "Rom 6:17-22", "n": "", "vs": [[17, "إنما الشكر لله، لأنكم كنتم عبيدا للخطيئة ولكن أطعتم من القلب صيغة التعليم الذي وضعتم في عهدته."], [18, "والآن، إذ حررتم من الخطيئة، صرتم عبيدا للبر."], [19, "أتكلم بشريا هنا بسبب ضعفكم البشري. فكما قدمتم سابقا أعضاءكم عبيدا للنجاسة والإثم في خدمة الإثم، كذلك قدموا الآن أعضاءكم عبيدا للبر في خدمة القداسة."], [20, "فإنكم، لما كنتم عبيدا للخطيئة، كنتم أحرارا من البر."], [21, "ولكن أي ثمر أنتجتم حينذاك من الأمور التي تخجلون بها الآن، وما عاقبتها إلا الموت؟"], [22, "أما الآن، وقد حررتم من الخطيئة وصرتم عبيدا لله، فإن لكم ثمركم للقداسة، والعاقبة هي الحياة الأبدية."]]}, {"l": "1Co 6:9-11", "n": "", "vs": [[9, "أما تعلمون أن الظالمين لن يرثوا ملكوت الله؟ لا تضلوا: فإن ملكوت الله لن يرثه الزناة ولا عابدو الأصنام ولا الفاسقون ولا المتخنثون ولا مضاجعو الذكور"], [10, "ولا السراقون ولا الطماعون ولا السكيرون ولا الشتامون ولا المغتصبون."], [11, "وهكذا كان بعضكم، إلا أنكم قد اغتسلتم، بل تقدستم، بل تبررتم، باسم الرب يسوع المسيح وبروح إلهنا."]]}, {"l": "2Co 6:17", "n": "", "vs": [[17, "لذلك اخرجوا من وسطهم، وكونوا منفصلين، يقول الرب، ولا تلمسوا ما هو نجس،"]]}, {"l": "2Co 6:18", "n": "", "vs": [[18, "فأقبلكم، وأكون لكم أبا، وتكونوا لي بنين وبنات»، هذا يقوله الرب القادر على كل شيء."]]}, {"l": "Eph 2:3-10", "n": "", "vs": [[3, "الذين بينهم نحن أيضا كنا نسلك سابقا في شهوات جسدنا، عاملين ما يريده الجسد والأفكار، وكنا بالطبيعة أولاد الغضب كالآخرين أيضا."], [4, "أما الله ، وهو غني في الرحمة، فبسبب محبته العظيمة التي أحبنا بها،"], [5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"], [6, "وأقامنا معه وأجلسنا معه في الأماكن السماوية في المسيح يسوع."], [7, "وذلك كي يعرض في الدهور القادمة غنى نعمته الفائق في لطفه علينا في المسيح يسوع."], [8, "فإنكم بالنعمة مخلصون، بالإيمان، وهذا ليس منكم. إنه هبة من الله،"], [9, "لا على أساس الأعمال، حتى لا يفتخر أحد."], [10, "فإننا نحن تحفة الله، وقد خلقنا في المسيح يسوع لأعمال صالحة أعدها سلفا لنسلك فيها."]]}, {"l": "1Th 2:12", "n": "", "vs": [[12, "ونحرضكم أن تسلكوا سلوكا يليق بالله، ذاك الذي يدعوكم إلى ملكوته ومجده."]]}, {"l": "Tit 3:3-6", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."], [4, "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،"], [5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"], [6, "الذي سكبه علينا بغنى بيسوع المسيح مخلصنا."]]}, {"l": "2Pe 1:11", "n": "", "vs": [[11, "وهكذا يفتح الله لكم الباب واسعا للدخول إلى الملكوت الأبدي، ملكوت ربنا ومخلصنا يسوع المسيح."]]}, {"l": "1Jo 3:14", "n": "", "vs": [[14, "إن محبتنا لإخوتنا تبين لنا أننا انتقلنا من الموت إلى الحياة. فالذي لا يحب إخوته، فهو باق في الموت."]]}], "kwAr": "ونقلنا", "noteAr": ""}, {"kw": "the kingdom", "raw": "Psa_2:6, Psa_2:7; Isa_9:6, Isa_9:7; Dan_7:13, Dan_7:14; Zec_9:9; Mat_25:34; Rom_14:17; 1Co_15:23-25", "note": "", "refs": [{"l": "Psa 2:6", "n": "", "vs": [[6, "قائلاَ: «أما أنا فقد مسحت ملكي، وأجلسته على صهيون، جبلي المقدس»."]]}, {"l": "Psa 2:7", "n": "", "vs": [[7, "وها أنا أعلن ما قضى به الرب: قال لي الرب: «أنت ابني، أنا اليوم ولدتك."]]}, {"l": "Isa 9:6", "n": "", "vs": [[6, "لأنه يولد لنا ولد ويعطى لنا ابن يحمل الرياسة على كتفه، ويدعى اسمه عجيبا، مشيرا، إلها قديرا، أبا أبديا، رئيس السلام."]]}, {"l": "Isa 9:7", "n": "", "vs": [[7, "ولا تكون نهاية لنمو رياسته وللسلام اللذين يسودان عرش داود ومملكته، ليثبتها ويعضدها بالحق والبر، من الآن وإلى الأبد. إن غيرة الرب القدير تتمم هذا."]]}, {"l": "Dan 7:13", "n": "", "vs": [[13, "وشاهدت أيضا في رؤى الليل وإذا بمثل ابن الإنسان مقبلا على سحاب حتى بلغ الأزلي فقربوه منه."]]}, {"l": "Dan 7:14", "n": "", "vs": [[14, "فأنعم عليه بسلطان ومجد وملكوت لتتعبد له كل الشعوب والأمم من كل لسان. سلطانه سلطان أبدي لا يفنى، وملكه لا ينقرض."]]}, {"l": "Zec 9:9", "n": "", "vs": [[9, "»ابتهجي جدا ياابنة صهيون واهتفي ياابنة أورشليم، لأن هوذا ملكك مقبل إليك. هو عادل ظافر، ولكنه وديع راكب على أتان، على جحش ابن أتان."]]}, {"l": "Mat 25:34", "n": "", "vs": [[34, "ثم يقول الملك للذين عن يمينه: تعالوا يامن باركهم أبي، رثوا الملكوت الذي أعد لكم منذ إنشاء العالم:"]]}, {"l": "Rom 14:17", "n": "", "vs": [[17, "إذ ليس ملكوت الله بأكل وشرب، بل هو بر وسلام وفرح في الروح القدس."]]}, {"l": "1Co 15:23-25", "n": "", "vs": [[23, "على أن لكل واحد رتبته: فأولا المسيح بصفته البكر؛ وبعده خاصته لدى رجوعه،"], [24, "وبعد ذلك الآخرة حين يسلم المسيح الملك لله الآب بعد أن يكون قد أباد كل رئاسة وكل سلطة وكل قوة."], [25, "فإنه لابد أن يملك «إلى أن يضع جميع الأعداء تحت قدميه»."]]}], "kwAr": "إلى ملكوت", "noteAr": ""}, {"kw": "his dear Son", "raw": "Gr. the Son of his love, Isa_42:1; Mat_3:17, Mat_17:5; Joh_3:35, Joh_17:24; Eph_1:6", "note": "Gr. the Son of his love, Isa_42:1; Mat_3:17, Mat_17:5; Joh_3:35, Joh_17:24; Eph_1:6", "refs": [{"l": "Isa 42:1", "n": "", "vs": [[1, "هوذا عبدي الذي أعضده، مختاري الذي ابتهجت به نفسي. وضعت روحي عليه ليسوس الأمم بالعدل."]]}, {"l": "Mat 3:17", "n": "", "vs": [[17, "وإذا صوت من السماوات يقول: «هذا هو ابني الحبيب، الذي به سررت كل سرور! »"]]}, {"l": "Mat 17:5", "n": "", "vs": [[5, "وبينما كان يتكلم، إذا سحابة منيرة قد خيمت عليهم، وصوت من السحابة يهتف: «هذا هو ابني الحبيب الذي سررت به كل سرور. له اسمعوا!»"]]}, {"l": "Joh 3:35", "n": "", "vs": [[35, "فالآب يحب الابن، وقد جعل في يده كل شيء."]]}, {"l": "Joh 17:24", "n": "", "vs": [[24, "أيها الآب، أريد لهؤلاء الذين وهبتهم لي أن يكونوا معي حيث أكون أنا، فيشاهدوا مجدي الذي أعطيتني، لأنك أحببتني قبل إنشاء العالم."]]}, {"l": "Eph 1:6", "n": "", "vs": [[6, "بغرض مدح مجد نعمته التي بها أعطانا حظوة لديه في المحبوب:"]]}], "kwAr": "ابن محبته", "noteAr": "في اليونانية: ابن محبته."}], "arS": [["هو الذي ", []], ["أنقذنا", ["G4506", "G2248"]], [" من ", []], ["سلطة", ["G1849"]], [" ", []], ["الظلام", ["G4655"]], [" ", []], ["ونقلنا", ["G3179"]], [" إلى ", []], ["ملكوت", ["G932"]], [" ", []], ["ابن", ["G5207"]], [" ", []], ["محبته", ["G26"]]]}, {"c": 1, "v": 14, "text": "الذي فيه لنا الفداء، أي غفران الخطايا.", "groups": [{"kw": "whom", "raw": "Mat_20:28; Act_20:28; Rom_3:24, Rom_3:25; Gal_3:13; Eph_1:7, Eph_5:2; 1Ti_2:6; Tit_2:14; Heb_9:12, Heb_9:22, Heb_10:12-14; 1Pe_1:19, 1Pe_1:20, 1Pe_3:18; 1Jo_2:2; Rev_1:5, Rev_5:9, Rev_14:4", "note": "", "refs": [{"l": "Mat 20:28", "n": "", "vs": [[28, "فهكذا ابن الإنسان: قد جاء لا ليخدم، بل ليخدم ويبذل نفسه فدية عن كثيرين. »"]]}, {"l": "Act 20:28", "n": "", "vs": [[28, "فاسهروا إذن على أنفسكم وعلى جميع القطيع الذي عينكم بينه الروح القدس نظارا، لترعوا كنيسة الله التي اشتراها بدمه."]]}, {"l": "Rom 3:24", "n": "", "vs": [[24, "فهم يبررون مجانا، بنعمته، بالفداء بالمسيح يسوع"]]}, {"l": "Rom 3:25", "n": "", "vs": [[25, "الذي قدمه الله كفارة، عن طريق الإيمان، وذلك بدمه."]]}, {"l": "Gal 3:13", "n": "", "vs": [[13, "إن المسيح حررنا بالفداء من لعنة الشريعة، إذ صار لعنة عوضا عنا، لأنه قد كتب: «ملعون كل من علق على خشبة»،"]]}, {"l": "Eph 1:7", "n": "", "vs": [[7, "ففيه لنا بدمه الفداء، أي غفران الخطايا؛ بحسب غنى نعمته"]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "1Ti 2:6", "n": "", "vs": [[6, "الذي بذل نفسه فدية عوضا عن الجميع. هذه شهادة تؤدى في أوقاتها الخاصة،"]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Heb 9:12", "n": "", "vs": [[12, "فإلى «قدس الأقداس» في هذه الخيمة، دخل المسيح مرة واحدة، حاملا دم نفسه، لا دم تيوس وعجول. وذلك بعدما سفك دمه عوضا عنا. فحقق فداء أبديا."]]}, {"l": "Heb 9:22", "n": "", "vs": [[22, "فالشريعة توصي بأن يتطهر كل شيء تقريبا بالدم. ولا غفران إلا بسفك الدم!"]]}, {"l": "Heb 10:12-14", "n": "", "vs": [[12, "ولكن المسيح، رئيس كهنتنا، قدم ذبيحة واحدة عن الخطايا، ثم جلس إلى الأبد عن يمين الله،"], [13, "منتظرا أن يوضع أعداؤه موطئا لقدميه."], [14, "إذ إنه، بتقدمة وحيدة جعل أولئك الذين قدسهم كاملين إلى الأبد."]]}, {"l": "1Pe 1:19", "n": "", "vs": [[19, "بل كانت دما ثمينا، دم المسيح، ذلك الحمل الطاهر الذي ليس فيه عيب ولا دنس!"]]}, {"l": "1Pe 1:20", "n": "", "vs": [[20, "ومع أن الله كان قد عين المسيح لهذا الغرض قبل تأسيس العالم، فهو لم يعلنه إلا في هذا الزمن الأخير لفائدتكم"]]}, {"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}, {"l": "1Jo 2:2", "n": "", "vs": [[2, "فهو كفارة لخطايانا، لا لخطايانا فقط، بل لخطايا العالم كله."]]}, {"l": "Rev 1:5", "n": "", "vs": [[5, "ومن يسوع المسيح الشاهد الأمين، بكر القائمين من بين الأموات، ملك ملوك الأرض، ذاك الذي بدافع محبته لنا مات لأجلنا فغسلنا بدمه من خطايانا،"]]}, {"l": "Rev 5:9", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"]]}, {"l": "Rev 14:4", "n": "", "vs": [[4, "فهؤلاء لم ينجسوا أنفسهم مع النساء لأنهم أطهار، وهم يتبعون الحمل حيثما ذهب، وقد تم شراؤهم من بين الناس باكورة لله، وللحمل،"]]}], "kwAr": "الذي فيه لنا الفداء", "noteAr": ""}, {"kw": "the", "raw": "Col_2:13, Col_3:13; Psa_32:1, Psa_32:2, Psa_130:4; Luk_5:20, Luk_7:47-50; Act_2:38, Act_10:43; Act_13:38, Act_13:39, Act_26:18; Rom_4:6-8; Eph_4:32; 1Jo_1:9, 1Jo_2:12", "note": "", "refs": [{"l": "Col 2:13", "n": "", "vs": [[13, "فأنتم، إذ كنتم أمواتا في الخطايا وعدم ختانكم الجسدي، أحياكم جميعا معه؛ مسامحا لنا جميعا بالخطايا كلها."]]}, {"l": "Col 3:13", "n": "", "vs": [[13, "محتملين بعضكم بعضا، ومسامحين بعضكم بعضا. إن كان لأحدكم شكوى على آخر، كما سامحكم الرب، هكذا افعلوا أنتم أيضا."]]}, {"l": "Psa 32:1", "n": "", "vs": [[1, "طوبى للذي غفرت آثامه وسترت خطاياه."]]}, {"l": "Psa 32:2", "n": "", "vs": [[2, "طوبى للرجل الذي لا يحسب له الرب خطيئة، وليس في روحه غش."]]}, {"l": "Psa 130:4", "n": "", "vs": [[4, "ولأنك مصدر الغفران فإن جميع الناس يهابونك."]]}, {"l": "Luk 5:20", "n": "", "vs": [[20, "فلما رأى إيمانهم، قال: «أيها الإنسان، قد غفرت لك خطاياك!»"]]}, {"l": "Luk 7:47-50", "n": "", "vs": [[47, "لهذا السبب أقول لك: إن خطاياها الكثيرة قد غفرت، لهذا أحبت كثيرا. ولكن الذي يغفر له القليل، يحب قليلا!»"], [48, "ثم قال لها: «مغفورة لك خطاياك!»"], [49, "فأخذ المتكئون يسائلون أنفسهم: «من هو هذا الذي يغفر الخطايا أيضا؟»"], [50, "وقال للمرأة: «إيمانك قد خلصك. اذهبي بسلام!»"]]}, {"l": "Act 2:38", "n": "", "vs": [[38, "أجابهم بطرس: «توبوا، وليتعمد كل واحد منكم باسم يسوع المسيح، فيغفر الله خطاياكم وتنالوا هبة الروح القدس،"]]}, {"l": "Act 10:43", "n": "", "vs": [[43, "له يشهد جميع الأنبياء أن كل من يؤمن به ينال باسمه غفران الخطايا»."]]}, {"l": "Act 13:38", "n": "", "vs": [[38, "فاعلموا، أيها الإخوة، أنه بيسوع تبشرون بغفران الخطايا ،"]]}, {"l": "Act 13:39", "n": "", "vs": [[39, "وأنه به يتبرر كل من يؤمن من كل ما عجزت شريعة موسى أن تبرره منه."]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "Rom 4:6-8", "n": "", "vs": [[6, "كما يهنيء داود أيضا الإنسان الذي يحسب له الله برا بمعزل عن الأعمال، إذ يقول:"], [7, "«طوبى للذين غفرت آثامهم وسترت خطاياهم."], [8, "طوبى للرجل الذي لا يحسب له الرب خطيئة!»"]]}, {"l": "Eph 4:32", "n": "", "vs": [[32, "وكونوا لطفاء بعضكم نحو بعض، شفوقين، مسامحين بعضكم بعضا كما سامحكم الله في المسيح."]]}, {"l": "1Jo 1:9", "n": "", "vs": [[9, "ولكن، إن اعترفنا لله بخطايانا، فهو جدير بالثقة وعادل، يغفر لنا خطايانا ويطهرنا من كل إثم."]]}, {"l": "1Jo 2:12", "n": "", "vs": [[12, "أكتب إليكم، أيها الأولاد، لأن الله قد غفر لكم خطاياكم إكراما لاسم المسيح."]]}], "kwAr": "غفران الخطايا", "noteAr": ""}], "arS": [["الذي فيه لنا ", []], ["الفداء", ["G629"]], ["، أي ", []], ["غفران", ["G859"]], [" ", []], ["الخطايا", ["G266"]], [".", []]]}, {"c": 1, "v": 15, "text": "هو صورة الله الذي لا يرى، والبكر على كل ما قد خلق،", "groups": [{"kw": "the image", "raw": "Exo_24:10; Num_12:8; Eze_1:26-28; Joh_1:18, Joh_14:9, Joh_15:24; 2Co_4:4, 2Co_4:6; Phi_2:6; Heb_1:3", "note": "", "refs": [{"l": "Exo 24:10", "n": "", "vs": [[10, "ورأوا إله إسرائيل، وتحت قدميه أرضية كأنها مصنوعة من الياقوت الأزرق الشفاف تماثل السماء في النقاء،"]]}, {"l": "Num 12:8", "n": "", "vs": [[8, "لذلك أكلمه وجها لوجه، وبوضوح من غير ألغاز، ويعاين صورة الرب. فلماذا جرؤتما على انتقاد عبدي موسى؟»"]]}, {"l": "Eze 1:26-28", "n": "", "vs": [[26, "وانتصب فوق الجلد المنبسط على رؤوسها شبه عرش، منظره كحجر اللازورد. ويجلس على شبه العرش من فوق من هو كشبه إنسان."], [27, "ورأيت ما يبدو من حقويه فما فوق وكأنه نحاس لامع يتوهج في داخله وحواليه. أما ما يبدو من حقويه وما تحت، فكأنه نار، وحواليها يشع بالضياء."], [28, "وكان منظر اللمعان المحيط به كمنظر قوس قزح في يوم مطير؛ هكذا كان منظر شبه مجد الرب. وعندما أبصرت خررت على وجهي وسمعت صوتا يتكلم."]]}, {"l": "Joh 1:18", "n": "", "vs": [[18, "ما من أحد رأى الله قط. ولكن الابن الوحيد، الذي في حضن الآب، هو الذي كشف عنه."]]}, {"l": "Joh 14:9", "n": "", "vs": [[9, "فأجابه يسوع: «مضت هذه المدة الطويلة وأنا معكم ولم تعرفني يافيلبس؟ الذي رآني رأى الآب، فكيف تقول: أرنا الآب؟"]]}, {"l": "Joh 15:24", "n": "", "vs": [[24, "ولو لم أعمل بينهم أعمالا لم يعملها أحد غيري، لما كانت لهم خطيئة. ولكنهم أبغضوني وأبغضوا أبي، مع أنهم رأوا تلك الأعمال."]]}, {"l": "2Co 4:4", "n": "", "vs": [[4, "الذين أعمى إله هذا العالم أذهانهم حتى لا يضيء لهم نور الإنجيل المختص بمجد المسيح الذي هو صورة الله."]]}, {"l": "2Co 4:6", "n": "", "vs": [[6, "فإن الله ، الذي أمر أن يشرق نور من الظلام، هو الذي جعل النور يشرق في قلوبنا، لإشعاع معرفة مجد الله المتجلي في وجه المسيح."]]}, {"l": "Phi 2:6", "n": "", "vs": [[6, "إذ إنه، وهو الكائن في هيئة الله، لم يعتبر مساواته لله خلسة، أو غنيمة يتمسك بها؛"]]}, {"l": "Heb 1:3", "n": "", "vs": [[3, "إنه ضياء مجد الله وصورة جوهره. حافظ كل ما في الكون بكلمته القديرة. وهو الذي بعدما طهرنا بنفسه من خطايانا،"]]}], "kwAr": "صورة الله", "noteAr": ""}, {"kw": "the invisible", "raw": "1Ti_1:17, 1Ti_6:16; Heb_11:27", "note": "", "refs": [{"l": "1Ti 1:17", "n": "", "vs": [[17, "فللملك الأزلي، الله الواحد غير المنظور وغير الفاني، الكرامة والمجد إلى أبد الآبدين. آمين!"]]}, {"l": "1Ti 6:16", "n": "", "vs": [[16, "الذي وحده لا فناء له، الساكن في نور لا يدنى منه، الذي لم يره أي إنسان ولا يقدر أن يراه. له الكرامة والقدرة الأبدية. آمين!"]]}, {"l": "Heb 11:27", "n": "", "vs": [[27, "بالإيمان، ترك أرض مصر وهو غير خائف من غضب الملك. فقد مضى في تنفيذ قراره، كأنه يرى بجانبه الله غير المنظور."]]}], "kwAr": "الذي لا يرى", "noteAr": ""}, {"kw": "the firstborn", "raw": "Col_1:13; Psa_89:27; Joh_1:14, Joh_3:16; Heb_1:6", "note": "", "refs": [{"l": "Col 1:13", "n": "", "vs": [[13, "هو الذي أنقذنا من سلطة الظلام ونقلنا إلى ملكوت ابن محبته"]]}, {"l": "Psa 89:27", "n": "", "vs": [[27, "أقيمه بكرا يسمو على ملوك الأرض."]]}, {"l": "Joh 1:14", "n": "", "vs": [[14, "والكلمة صار بشرا، وخيم بيننا، ونحن رأينا مجده، مجد ابن وحيد عند الآب، وهو ممتلىء بالنعمة والحق."]]}, {"l": "Joh 3:16", "n": "", "vs": [[16, "لأنه هكذا أحب الله العالم حتى بذل ابنه الوحيد، لكي لا يهلك كل من يؤمن به، بل تكون له الحياة الأبدية."]]}, {"l": "Heb 1:6", "n": "", "vs": [[6, "وعندما يعيد الله ابنه البكر إلى العالم، يقول: «ولتسجد له ملائكة الله جميعا!»"]]}], "kwAr": "والبكر", "noteAr": ""}, {"kw": "of every", "raw": "Col_1:16, Col_1:17; Pro_8:29-31; Rev_3:14", "note": "", "refs": [{"l": "Col 1:16", "n": "", "vs": [[16, "إذ به خلقت جميع الأشياء: ما في السماوات وما على الأرض، ما يرى وما لا يرى، أعروشا كانت أم سيادات أم رئاسات أم سلطات. كل ما في الكون قد خلق به ولأجله."]]}, {"l": "Col 1:17", "n": "", "vs": [[17, "هو كائن قبل كل شيء، وبه يدوم كل شيء."]]}, {"l": "Pro 8:29-31", "n": "", "vs": [[29, "عندما قرر للبحر تخوما لا تتجاوزها مياهه متعدية على أمر الرب، وحين رسم أسس الأرض،"], [30, "كنت عنده صانعا مبدعا، وكنت كل يوم لذته، أفيض بهجة دائما أمامه."], [31, "مغتبطة بعالمه المسكون، ومسراتي مع بني آدم."]]}, {"l": "Rev 3:14", "n": "", "vs": [[14, "واكتب إلى ملاك الكنيسة في لاودكية: إليك ما يقوله الحق، الشاهد الأمين الصادق، رئيس خليقة الله:"]]}], "kwAr": "على كل ما قد خلق", "noteAr": ""}], "arS": [["هو ", []], ["صورة", ["G1504"]], [" ", []], ["الله", ["G2316"]], [" الذي ", []], ["لا يرى", ["G517"]], ["، ", []], ["والبكر", ["G4416"]], [" على ", []], ["كل", ["G3956"]], [" ما قد ", []], ["خلق", ["G2937"]], ["،", []]]}, {"c": 1, "v": 16, "text": "إذ به خلقت جميع الأشياء: ما في السماوات وما على الأرض، ما يرى وما لا يرى، أعروشا كانت أم سيادات أم رئاسات أم سلطات. كل ما في الكون قد خلق به ولأجله.", "groups": [{"kw": "by him were", "raw": "Col_1:15; Psa_102:25-27; Isa_40:9-12, Isa_44:24; Joh_1:3; 1Co_8:6; Eph_3:9; Heb_1:2, Heb_1:10-12, Heb_3:3, Heb_3:4", "note": "", "refs": [{"l": "Col 1:15", "n": "", "vs": [[15, "هو صورة الله الذي لا يرى، والبكر على كل ما قد خلق،"]]}, {"l": "Psa 102:25-27", "n": "", "vs": [[25, "من قدم أسست الأرض، والسماوات هي صنع يديك."], [26, "هي زائلة أما أنت فباق. تبلى كلها كالثوب. وتستبدلها كما يستبدل الرداء القديم بالجديد."], [27, "لكنك أنت الدائم الخالد، وسنوك لن تنتهي."]]}, {"l": "Isa 40:9-12", "n": "", "vs": [[9, "اصعدي إلى جبل شامخ ياحاملة البشارة إلى صهيون. ارفعي صوتك بقوة يامبشرة أورشليم. اهتفي ولا تجزعي. قولي لمدن يهوذا: ها إلهكم قادم"], [10, "بقدرته وقوته، وذراعه تحكم له، وها أجرته معه ومكافأته أمامه."], [11, "يرعى قطيعه كراع، ويجمع الحملان بذراعه، وفي أحضانه يحملها ويقود المرضعات برفق."], [12, "من كال المياه بكفه وقاس السماوات بالشبر وكال تراب الأرض بالكيل ووزن الجبال بقبان، والتلال بميزان؟"]]}, {"l": "Isa 44:24", "n": "", "vs": [[24, "هذا ما يقوله الرب فاديك وجابلك من الرحم: «أنا هو الرب صانع كل الأشياء، الذي نشر السماوات وحده، وبسط الأرض بنفسه. من كان معي حينذاك؟"]]}, {"l": "Joh 1:3", "n": "", "vs": [[3, "به تكون كل شيء، وبغيره لم يتكون أي شيء مما تكون."]]}, {"l": "1Co 8:6", "n": "", "vs": [[6, "فليس عندنا نحن إلا إله واحد هو الآب الذي منه كل شيء، ونحن له؛ ورب واحد هو يسوع المسيح الذي به كل شيء ونحن به."]]}, {"l": "Eph 3:9", "n": "", "vs": [[9, "وأنير الجميع بمعرفة ما هو تدبير السر الذي أبقاه الله ، خالق كل شيء، مكتوما مدى الأجيال."]]}, {"l": "Heb 1:2", "n": "", "vs": [[2, "أما الآن، في هذا الزمن الأخير، فقد كلمنا بالابن، الذي جعله وارثا لكل شيء، وبه قد خلق الكون كله!"]]}, {"l": "Heb 1:10-12", "n": "", "vs": [[10, "كما يخاطب الابن أيضا بقوله: «أنت، يارب، وضعت أساس الأرض في البداية. والسماوات هي صنع يديك."], [11, "هي تفنى، وأنت تبقى. فسوف تبلى كلها كما تبلى الثياب،"], [12, "فتطويها كالرداء، ثم تبدلها. ولكنك أنت الدائم الباقي، وسنوك لن تنتهي!»"]]}, {"l": "Heb 3:3", "n": "", "vs": [[3, "إلا أنه يستحق مجدا أعظم من مجد موسى، كما أن الذي يبني بيتا ينال إكراما ومدحا أكثر مما ينال البيت الذي بناه!"]]}, {"l": "Heb 3:4", "n": "", "vs": [[4, "طبعا، كل بيت لابد أن يكون له بان، والله نفسه هو باني كل شيء."]]}], "kwAr": "به خلقت جميع الأشياء", "noteAr": ""}, {"kw": "in heaven", "raw": "Col_1:20; Deu_4:39; 1Ch_29:11; Eph_1:10; Phi_2:10; Rev_5:13, Rev_5:14", "note": "", "refs": [{"l": "Col 1:20", "n": "", "vs": [[20, "وأن يصالح به كل شيء مع نفسه، إذ أحل السلام بدمه على الصليب، فبه يصالح كل شيء، سواء كان ما على الأرض أو ما في السماوات."]]}, {"l": "Deu 4:39", "n": "", "vs": [[39, "فاعترفوا اليوم ورددوا في قلوبكم قائلين: إن الرب هو الإله في السماء من فوق، وعلى الأرض من تحت وليس إله سواه."]]}, {"l": "1Ch 29:11", "n": "", "vs": [[11, "لك يارب العظمة والسطوة والجلال والبهاء والمجد، لأن لك كل ما في السماء والأرض. أنت يارب صاحب الملك وقد تعاليت فوق رؤوس الجميع."]]}, {"l": "Eph 1:10", "n": "", "vs": [[10, "لأجل تدبير تمام الأزمنة، حين يوحد كل شيء تحت رئاسة المسيح، سواء الأشياء التي في السماوات والتي على الأرض."]]}, {"l": "Phi 2:10", "n": "", "vs": [[10, "لكي تنحني سجودا لاسم يسوع كل ركبة، سواء في السماء أم على الأرض أم تحت الأرض،"]]}, {"l": "Rev 5:13", "n": "", "vs": [[13, "ثم سمعت كل خليقة في السماء وعلى الأرض، وتحت الأرض، وعلى البحر، هاتفة مع كل ما فيها: «البركة والإجلال والمجد والسلطة للجالس على العرش وللحمل، إلى أبد الآبدين»."]]}, {"l": "Rev 5:14", "n": "", "vs": [[14, "فردت الكائنات الحية الأربعة: «آمين!» وجثا الشيوخ ساجدين."]]}], "kwAr": "ما في السماوات", "noteAr": ""}, {"kw": "thrones", "raw": "Col_2:10,Col_2:15; Rom_8:38; Eph_1:21, Eph_3:10, Eph_6:12; 1Pe_3:22", "note": "", "refs": [{"l": "Col 2:10", "n": "", "vs": [[10, "وأنتم مكملون فيه. فهو رأس كل رئاسة وسلطة؛"]]}, {"l": "Col 2:15", "n": "", "vs": [[15, "وإذ نزع سلاح الرئاسات والسلطات، فضحهم جهارا فيه، وساقهم في موكبه ظافرا عليهم."]]}, {"l": "Rom 8:38", "n": "", "vs": [[38, "فإني لعلى يقين بأنه لا الموت ولا الحياة، ولا الملائكة ولا الرياسات، ولا الأمور الحاضرة ولا الآتية، ولا القوات،"]]}, {"l": "Eph 1:21", "n": "", "vs": [[21, "أرفع جدا من كل رئاسة وسلطة وقوة وسيا دة، ومن كل اسم يسمى، لا في هذا العالم وحسب، بل في ذلك الآتي أيضا."]]}, {"l": "Eph 3:10", "n": "", "vs": [[10, "والغاية أن يتجلى الآن أمام الرئاسات والسلطات في الأماكن السماوية ما يظهر في الكنيسة من حكمة الله المتعددة الوجوه،"]]}, {"l": "Eph 6:12", "n": "", "vs": [[12, "فإن حربنا ليست ضد ذوي اللحم والدم، بل ضد الرئاسات، ضد السلطات، ضد أسياد العالم حكام هذا الظلام، ضد قوى الشر الروحية في الأماكن السماوية."]]}, {"l": "1Pe 3:22", "n": "", "vs": [[22, "الذي انطلق إلى السماء، وهو الآن جالس عن يمين الله؛ وقد جعلت الملائكة والسلطات والقوات (الروحية) خاضعة له!"]]}], "kwAr": "أعروشا كانت", "noteAr": ""}, {"kw": "by", "raw": "Pro_16:4; Isa_43:21; Rom_11:36; Heb_2:10", "note": "", "refs": [{"l": "Pro 16:4", "n": "", "vs": [[4, "لكل شيء صنعه الرب غرض في ذاته، حتى الشرير ليوم الضيق."]]}, {"l": "Isa 43:21", "n": "", "vs": [[21, "وجبلته لنفسي ليذيع حمدي."]]}, {"l": "Rom 11:36", "n": "", "vs": [[36, "فإن منه وبه وله كل شيء. له المجد إلى الأبد. آمين!"]]}, {"l": "Heb 2:10", "n": "", "vs": [[10, "فلما قصد الله ، الذي من أجله كل شيء وبه كل شيء، أن يحضر إلى المجد أبناء كثيرين، كان من اللائق أن يجعل قائدهم إلى الخلاص مؤهلا لإكمال مهمته عن طريق الآلام."]]}], "kwAr": "قد خلق به ولأجله", "noteAr": ""}], "arS": [["إذ به ", []], ["خلقت", ["G2936"]], [" ", []], ["جميع", ["G3956"]], [" الأشياء: ما في ", []], ["السماوات", ["G3772"]], [" وما على ", []], ["الأرض", ["G1093"]], ["، ما ", []], ["يرى", ["G3707"]], [" وما ", []], ["لا يرى", ["G517"]], ["، ", []], ["أعروشا", ["G2362"]], [" كانت أم ", []], ["سيادات", ["G2963"]], [" أم ", []], ["رئاسات", ["G746"]], [" أم ", []], ["سلطات", ["G1849"]], [". كل ما في الكون قد ", []], ["خلق", ["G2936"]], [" به ولأجله.", []]]}, {"c": 1, "v": 17, "text": "هو كائن قبل كل شيء، وبه يدوم كل شيء.", "groups": [{"kw": "he", "raw": "Col_1:15; Pro_8:22, Pro_8:23; Isa_43:11-13, Isa_44:6; Mic_5:2; Joh_1:1-3, Joh_8:58, Joh_17:5; 1Co_8:6; Heb_13:8; Rev_1:8, Rev_1:11, Rev_1:17, Rev_2:8", "note": "", "refs": [{"l": "Col 1:15", "n": "", "vs": [[15, "هو صورة الله الذي لا يرى، والبكر على كل ما قد خلق،"]]}, {"l": "Pro 8:22", "n": "", "vs": [[22, "اقتناني الرب منذ بدء خلقه، من قبل الشروع في أعماله القديمة."]]}, {"l": "Pro 8:23", "n": "", "vs": [[23, "منذ الأزل أنا هو، منذ البدء قبل أن توجد الأرض."]]}, {"l": "Isa 43:11-13", "n": "", "vs": [[11, "أنا هو الرب، ولا مخلص غيري."], [12, "إني أنبأت وخلصت وأعلنت أنا، وليس إله غريب بينكم. أنتم شهودي أني أنا الله، يقول الرب."], [13, "منذ البدء أنا هو الله وليس منقذ من يدي. أفعل ومن يبطل عملي؟"]]}, {"l": "Isa 44:6", "n": "", "vs": [[6, "هذا ما يقوله الرب القدير ملك إسرائيل وفاديه: «أنا هو الأول والآخر، ولا إله غيري."]]}, {"l": "Mic 5:2", "n": "", "vs": [[2, "أما أنت يابيت لحم أفراتة، مع أنك قرية صغيرة بين ألوف قرى يهوذا، إلا أن منك يخرج لي من يصبح ملكا في إسرائيل وأصله منذ القديم، منذ الأزل."]]}, {"l": "Joh 1:1-3", "n": "", "vs": [[1, "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."], [2, "هو كان في البدء عند الله."], [3, "به تكون كل شيء، وبغيره لم يتكون أي شيء مما تكون."]]}, {"l": "Joh 8:58", "n": "", "vs": [[58, "أجابهم: الحق الحق أقول لكم: إنني كائن من قبل أن يكون إبراهيم»."]]}, {"l": "Joh 17:5", "n": "", "vs": [[5, "فمجدني في حضرتك الآن، أيها الآب، بما كان لي من مجد عندك قبل تكوين العالم."]]}, {"l": "1Co 8:6", "n": "", "vs": [[6, "فليس عندنا نحن إلا إله واحد هو الآب الذي منه كل شيء، ونحن له؛ ورب واحد هو يسوع المسيح الذي به كل شيء ونحن به."]]}, {"l": "Heb 13:8", "n": "", "vs": [[8, "يسوع المسيح هو هو أمسا واليوم وإلى الأبد."]]}, {"l": "Rev 1:8", "n": "", "vs": [[8, "«أنا الألف والياء» (البداية والنهاية). هذا يقوله الرب الإله الكائن والذي كان والذي سيأتي، القادر على كل شيء."]]}, {"l": "Rev 1:11", "n": "", "vs": [[11, "يقول: «دون ما تراه في كتاب، وابعث به إلى الكنائس السبع: في أفسس، وسميرنا، وبرغامس، وثياتيرا، وساردس، وفيلادلفيا، ولاودكية»."]]}, {"l": "Rev 1:17", "n": "", "vs": [[17, "فلما رأيته ارتميت عند قدميه كالميت، فلمسني بيده اليمنى وقال: «لا تخف! أنا الأول والآخر،"]]}, {"l": "Rev 2:8", "n": "", "vs": [[8, "واكتب إلى ملاك الكنيسة في سميرنا: إليك ما يقوله الأول والآخر، الذي كان ميتا وعاد حيا:"]]}], "kwAr": "هو كائن قبل كل شيء", "noteAr": ""}, {"kw": "and by", "raw": "1Sa_2:8; Psa_75:3; Joh_5:17, Joh_5:18; Act_17:28; Heb_1:3", "note": "", "refs": [{"l": "1Sa 2:8", "n": "", "vs": [[8, "ينهض المسكين من التراب، ويرفع البائس من كومة الرماد، ليجلسه مع النبلاء، ويملكه عرش المجد، لأن للرب أساسات الأرض التي أرسى عليها المسكونة."]]}, {"l": "Psa 75:3", "n": "", "vs": [[3, "عندما تهتز الأرض وما فيها من أحياء، أنا من يوطد أركانها."]]}, {"l": "Joh 5:17", "n": "", "vs": [[17, "ولكن يسوع قال لهم: «ما زال أبي يعمل إلى الآن. وأنا أيضا أعمل!»"]]}, {"l": "Joh 5:18", "n": "", "vs": [[18, "لهذا ازداد سعي اليهود إلى قتله، ليس فقط لأنه خالف سنة السبت، بل أيضا لأنه قال إن الله أبوه، مساويا نفسه بالله."]]}, {"l": "Act 17:28", "n": "", "vs": [[28, "لأننا به نحيا ونتحرك ونوجد، أو كما قال بعض شعرائكم: نحن أيضا ذريته!"]]}, {"l": "Heb 1:3", "n": "", "vs": [[3, "إنه ضياء مجد الله وصورة جوهره. حافظ كل ما في الكون بكلمته القديرة. وهو الذي بعدما طهرنا بنفسه من خطايانا،"]]}], "kwAr": "وبه يدوم كل شيء", "noteAr": ""}], "arS": [["هو كائن ", []], ["قبل", ["G4253"]], [" ", []], ["كل شيء", ["G3956"]], ["، وبه ", []], ["يدوم", ["G4921"]], [" ", []], ["كل شيء", ["G3956"]], [".", []]]}, {"c": 1, "v": 18, "text": "وهو رأس الجسد، أي الكنيسة؛ هو البداءة وبكر القائمين من بين الأموات، ليكون له المقام الأول في كل شيء.", "groups": [{"kw": "he is", "raw": "Col_1:24, Col_2:10-14; 1Co_11:3; Eph_1:10,Eph_1:22, Eph_1:23, Eph_4:15, Eph_4:16, Eph_5:23", "note": "", "refs": [{"l": "Col 1:24", "n": "", "vs": [[24, "والآن أنا أفرح في الآلام التي أقاسيها لأجلكم، وأتمم في جسدي ما نقص من ضيقات المسيح لأجل جسده الذي هو الكنيسة،"]]}, {"l": "Col 2:10-14", "n": "", "vs": [[10, "وأنتم مكملون فيه. فهو رأس كل رئاسة وسلطة؛"], [11, "وفيه أيضا ختنتم أنتم ختانا لم تجره الأيدي، إذ نزع عنكم جسد الخطايا البشري وهذا هو ختان المسيح:"], [12, "فقد دفنتم معه في المعمودية، وفيها أيضا أقمتم معه، عن طريق إيمانكم بقدرة الله الذي أقامه من بين الأموات."], [13, "فأنتم، إذ كنتم أمواتا في الخطايا وعدم ختانكم الجسدي، أحياكم جميعا معه؛ مسامحا لنا جميعا بالخطايا كلها."], [14, "إذ قد محا صك الفرائض المكتوب علينا والمناقض لمصلحتنا، بل إنه قد أزاله من الوسط، مسمرا إياه على الصليب."]]}, {"l": "1Co 11:3", "n": "", "vs": [[3, "ولكني أريد أن تعلموا أن المسيح هو الرأس لكل رجل؛ أما رأس المرأة فهو الرجل، ورأس المسيح هو الله ."]]}, {"l": "Eph 1:10", "n": "", "vs": [[10, "لأجل تدبير تمام الأزمنة، حين يوحد كل شيء تحت رئاسة المسيح، سواء الأشياء التي في السماوات والتي على الأرض."]]}, {"l": "Eph 1:22", "n": "", "vs": [[22, "وأخضع كل شيء تحت قدميه، وإياه جعل فوق كل شيء رأسا للكنيسة"]]}, {"l": "Eph 1:23", "n": "", "vs": [[23, "التي هي جسده وكماله، هو الذي يكمل الكل في الكل."]]}, {"l": "Eph 4:15", "n": "", "vs": [[15, "بل نتمسك بالحق في المحبة، فننمو في كل شيء نحو من هو الرأس، أي المسيح."]]}, {"l": "Eph 4:16", "n": "", "vs": [[16, "فمنه يستمد الجسد كله تماسكه وترابطه بمساندة كل مفصل وفقا لمقدار العمل المخصص لكل جزء، لينشيء نموا يؤول إلى بنيان الجسد بنيانا ذاتيا في المحبة."]]}, {"l": "Eph 5:23", "n": "", "vs": [[23, "فإن الزوج هو رأس الزوجة كما أن المسيح أيضا هو رأس الكنيسة (جسده)، وهو نفسه مخلص الجسد."]]}], "kwAr": "وهو رأس الجسد", "noteAr": ""}, {"kw": "the beginning", "raw": "Joh_1:1; 1Jo_1:1; Rev_1:8, Rev_3:14, Rev_21:6, Rev_22:13", "note": "", "refs": [{"l": "Joh 1:1", "n": "", "vs": [[1, "ف
