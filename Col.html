ي البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."]]}, {"l": "1Jo 1:1", "n": "", "vs": [[1, "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."]]}, {"l": "Rev 1:8", "n": "", "vs": [[8, "«أنا الألف والياء» (البداية والنهاية). هذا يقوله الرب الإله الكائن والذي كان والذي سيأتي، القادر على كل شيء."]]}, {"l": "Rev 3:14", "n": "", "vs": [[14, "واكتب إلى ملاك الكنيسة في لاودكية: إليك ما يقوله الحق، الشاهد الأمين الصادق، رئيس خليقة الله:"]]}, {"l": "Rev 21:6", "n": "", "vs": [[6, "ثم قال: «قد تم. أنا الألف والياء (البداية والنهاية). أنا أسقي العطشان من ينبوع ماء الحياة مجانا."]]}, {"l": "Rev 22:13", "n": "", "vs": [[13, "أنا الألف والياء، الأول والآخر، البداية والنهاية."]]}], "kwAr": "هو البداءة", "noteAr": ""}, {"kw": "the firstborn", "raw": "Joh_11:25, Joh_11:26; Act_26:23; 1Co_15:20-23; Rev_1:5, Rev_1:18", "note": "", "refs": [{"l": "Joh 11:25", "n": "", "vs": [[25, "فرد يسوع: «أنا هو القيامة والحياة. من آمن بي، وإن مات فسيحيا."]]}, {"l": "Joh 11:26", "n": "", "vs": [[26, "ومن كان حيا وآمن بي فلن يموت إلى الأبد. أتؤمنين بهذا؟»"]]}, {"l": "Act 26:23", "n": "", "vs": [[23, "من أن المسيح سيتألم فيكون أول من يقوم من بين الأموات، ويبشر بالنور شعبنا والشعوب الأخرى»."]]}, {"l": "1Co 15:20-23", "n": "", "vs": [[20, "أما الآن فالمسيح قد قام من بين الأموات بكرا للراقدين."], [21, "فبما أن الموت كان بإنسان، فإن قيامة الأموات أيضا تكون بإنسان."], [22, "فإنه، كما يموت الجميع في آدم، فكذلك سيحيى الجميع في المسيح،"], [23, "على أن لكل واحد رتبته: فأولا المسيح بصفته البكر؛ وبعده خاصته لدى رجوعه،"]]}, {"l": "Rev 1:5", "n": "", "vs": [[5, "ومن يسوع المسيح الشاهد الأمين، بكر القائمين من بين الأموات، ملك ملوك الأرض، ذاك الذي بدافع محبته لنا مات لأجلنا فغسلنا بدمه من خطايانا،"]]}, {"l": "Rev 1:18", "n": "", "vs": [[18, "أنا الحي. كنت ميتا، ولكن ها أنا حي إلى أبد الآبدين. ولي مفاتيح الموت والهاوية."]]}], "kwAr": "وبكر القائمين من بين الأموات", "noteAr": ""}, {"kw": "in all", "raw": "or, among all, Psa_45:2-5, Psa_89:27; Son_5:10; Isa_52:13; Mat_23:8, Mat_28:18; Joh_1:16, Joh_1:27; Joh_3:29-31, Joh_3:34, Joh_3:35; Rom_8:29; 1Co_15:25; Heb_1:5, Heb_1:6; Rev_5:9-13, Rev_11:15; Rev_21:23, Rev_21:24", "note": "or, among all, Psa_45:2-5, Psa_89:27; Son_5:10; Isa_52:13; Mat_23:8, Mat_28:18; Joh_1:16, Joh_1:27; Joh_3:29-31, Joh_3:34, Joh_3:35; Rom_8:29; 1Co_15:25; Heb_1:5, Heb_1:6; Rev_5:9-13, Rev_11:15; Rev_21:23, Rev_21:24", "refs": [{"l": "Psa 45:2-5", "n": "", "vs": [[2, "أنت أبرع جمالا من كل بني البشر. انسكبت النعمة على شفتيك، لذلك باركك الله إلى الأبد."], [3, "في جلالك وبهائك تقلد سيفك على فخذك أيها المقتدر،"], [4, "وبجلالك اركب ظافرا لأجل الحق والوداعة والبر، فتقتحم يمينك الأهوال."], [5, "سهامك مسنونة تخترق أعماق قلوب أعداء الملك، وتسقط الشعوب صرعى تحت قدميك."]]}, {"l": "Psa 89:27", "n": "", "vs": [[27, "أقيمه بكرا يسمو على ملوك الأرض."]]}, {"l": "Son 5:10", "n": "", "vs": [[10, "(المحبوبة): حبيبي متألق وأحمر، علم بين عشرة آلاف."]]}, {"l": "Isa 52:13", "n": "", "vs": [[13, "ها هو عبدي يفلح، ويتعظم ويتعالى ويتسامى جدا."]]}, {"l": "Mat 23:8", "n": "", "vs": [[8, "أما أنتم، فلا تقبلوا أن يدعوكم أحد: يامعلم! لأن معلمكم واحد، وأنتم جميعا إخوة."]]}, {"l": "Mat 28:18", "n": "", "vs": [[18, "فتقدم يسوع وكلمهم قائلا: «دفع إلي كل سلطان في السماء وعلى الأرض."]]}, {"l": "Joh 1:16", "n": "", "vs": [[16, "فمن امتلائه أخذنا جميعنا ونلنا نعمة على نعمة،"]]}, {"l": "Joh 1:27", "n": "", "vs": [[27, "وهو الآتي بعدي، وأنا لا أستحق أن أحل رباط حذائه»."]]}, {"l": "Joh 3:29-31", "n": "", "vs": [[29, "ومن له العروس، يكون هو العريس! أما صديق العريس، الذي يقف قربه ويسمعه، فيبتهج لفرحه بصوت العريس. وها إن فرحي هذا قد تم."], [30, "فلابد أن يزيد هو وأنقص أنا»"], [31, "إنه هو الآتي من السماء، ولذلك فهو متقدم على الجميع. أما من كان من الأرض، فإنه أرضي ويتكلم كلاما أرضيا. الآتي من السماء متقدم على الجميع،"]]}, {"l": "Joh 3:34", "n": "", "vs": [[34, "لأن الذي أرسله الله يتكلم بكلام الله فإن الله يعطي الروح ليس بالمكيال."]]}, {"l": "Joh 3:35", "n": "", "vs": [[35, "فالآب يحب الابن، وقد جعل في يده كل شيء."]]}, {"l": "Rom 8:29", "n": "", "vs": [[29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."]]}, {"l": "1Co 15:25", "n": "", "vs": [[25, "فإنه لابد أن يملك «إلى أن يضع جميع الأعداء تحت قدميه»."]]}, {"l": "Heb 1:5", "n": "", "vs": [[5, "فلأي واحد من الملائكة قال الله مرة: «أنت ابني، أنا اليوم ولدتك!» أو قال أيضا: «أنا أكون له أبا، وهو يكون لي ابنا؟»"]]}, {"l": "Heb 1:6", "n": "", "vs": [[6, "وعندما يعيد الله ابنه البكر إلى العالم، يقول: «ولتسجد له ملائكة الله جميعا!»"]]}, {"l": "Rev 5:9-13", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"], [10, "وجعلتهم مملكة لإلهنا وكهنة له، وسيملكون على الأرض»."], [11, "ثم نظرت، فسمعت ترتيل الملايين من الملائكة وهي تحيط بالعرش وبالكائنات الحية والشيوخ،"], [12, "وهم يهتفون بصوت عال: «مستحق هو الحمل المذبوح أن ينال القدرة والغنى والحكمة والقوة والإجلال والمجد والبركة»."], [13, "ثم سمعت كل خليقة في السماء وعلى الأرض، وتحت الأرض، وعلى البحر، هاتفة مع كل ما فيها: «البركة والإجلال والمجد والسلطة للجالس على العرش وللحمل، إلى أبد الآبدين»."]]}, {"l": "Rev 11:15", "n": "", "vs": [[15, "ونفخ الملاك السابع في بوقه فسمعت أصوات عالية في السماء تقول: «قد صار ملك العالم لربنا ومسيحه. إنه يملك إلى أبد الآبدين»."]]}, {"l": "Rev 21:23", "n": "", "vs": [[23, "ولم تكن المدينة في حاجة إلى نور الشمس أو القمر، لأن مجد الله ينيرها، والحمل مصباحها."]]}, {"l": "Rev 21:24", "n": "", "vs": [[24, "ستسير بنورها الأمم، ويأتيها ملوك الأرض بكنوزهم."]]}], "kwAr": "في كل شيء", "noteAr": "أو: بين الجميع."}], "arS": [["وهو ", []], ["رأس", ["G2776"]], [" ", []], ["الجسد", ["G4983"]], ["، أي ", []], ["الكنيسة", ["G1577"]], ["؛ هو ", []], ["البداءة", ["G746"]], [" ", []], ["وبكر", ["G4416"]], [" القائمين من بين ", []], ["الأموات", ["G3498"]], ["، ليكون له ", []], ["المقام الأول", ["G4409"]], [" في ", []], ["كل", ["G3956"]], [" شيء.", []]]}, {"c": 1, "v": 19, "text": "فإنه فيه سر الله أن يحل بكل ملئه،", "groups": [{"kw": "", "raw": "Col_2:3, Col_2:9, Col_3:11; Mat_11:25-27; Luk_10:21; Joh_1:16, Joh_3:34; Eph_1:3, Eph_1:23, Eph_4:10", "note": "", "refs": [{"l": "Col 2:3", "n": "", "vs": [[3, "المخزونة فيه كنوز الحكمة والمعرفة كلها."]]}, {"l": "Col 2:9", "n": "", "vs": [[9, "فإنه فيه، جسديا، يحل الله بكل ملئه،"]]}, {"l": "Col 3:11", "n": "", "vs": [[11, "وفيه لا فرق بين يوناني ويهودي، أو مختون وغير مختون، أو متحضر ومتخلف، أو عبد وحر، بل المسيح هو الكل وفي الكل."]]}, {"l": "Mat 11:25-27", "n": "", "vs": [[25, "وفي ذلك الوقت، تكلم يسوع فقال: «أحمدك أيها الآب، رب السماء والأرض، لأنك حجبت هذه الأمور عن الحكماء والفهماء، وكشفتها للأطفال!"], [26, "نعم أيها الآب، لأنه هكذا حسن في نظرك."], [27, "كل شيء قد سلمه إلي أبي. ولا أحد يعرف الابن إلا الآب، ولا أحد يعرف الآب إلا الابن، ومن أراد الابن أن يعلنه له."]]}, {"l": "Luk 10:21", "n": "", "vs": [[21, "في تلك الساعة ابتهج يسوع بالروح وقال: «أحمدك أيها الآب، رب السماء والأرض، لأنك حجبت هذه الأمور عن الحكماء والفهماء، وكشفتها للأطفال. نعم، أيها الآب، لأنه هكذا حسن في نظرك!"]]}, {"l": "Joh 1:16", "n": "", "vs": [[16, "فمن امتلائه أخذنا جميعنا ونلنا نعمة على نعمة،"]]}, {"l": "Joh 3:34", "n": "", "vs": [[34, "لأن الذي أرسله الله يتكلم بكلام الله فإن الله يعطي الروح ليس بالمكيال."]]}, {"l": "Eph 1:3", "n": "", "vs": [[3, "تبارك الله ، أبو ربنا يسوع المسيح الذي باركنا بكل بركة روحية في الأماكن السماوية."]]}, {"l": "Eph 1:23", "n": "", "vs": [[23, "التي هي جسده وكماله، هو الذي يكمل الكل في الكل."]]}, {"l": "Eph 4:10", "n": "", "vs": [[10, "إن الذي نزل هو نفسه الذي صعد إلى ما فوق جميع السماوات لكي يملأ كل شيء."]]}], "kwAr": "", "noteAr": ""}], "arS": [["فإنه فيه ", []], ["سر", ["G2106"]], [" الله أن ", []], ["يحل", ["G2730"]], [" ", []], ["بكل", ["G3956"]], [" ", []], ["ملئه", ["G4138"]], ["،", []]]}, {"c": 1, "v": 20, "text": "وأن يصالح به كل شيء مع نفسه، إذ أحل السلام بدمه على الصليب، فبه يصالح كل شيء، سواء كان ما على الأرض أو ما في السماوات.", "groups": [{"kw": "having made peace", "raw": "or making peace, Col_1:21, Col_1:22; Lev_6:30; Psa_85:10,Psa_85:11; Isa_9:6, Isa_9:7; Eze_45:17-20; Dan_9:24-26; Mic_5:2, Mic_5:5; Zec_9:9, Zec_9:10; Luk_2:14; Act_10:30; Rom_5:1; 2Co_5:19-21; Eph_2:13-17; Heb_13:20,Heb_13:21; 1Jo_4:9, 1Jo_4:10", "note": "or making peace, Col_1:21, Col_1:22; Lev_6:30; Psa_85:10,Psa_85:11; Isa_9:6, Isa_9:7; Eze_45:17-20; Dan_9:24-26; Mic_5:2, Mic_5:5; Zec_9:9, Zec_9:10; Luk_2:14; Act_10:30; Rom_5:1; 2Co_5:19-21; Eph_2:13-17; Heb_13:20,Heb_13:21; 1Jo_4:9, 1Jo_4:10", "refs": [{"l": "Col 1:21", "n": "", "vs": [[21, "وأنتم، يامن كنتم في الماضي أجانب وأعداء في الفكر، بأعمالكم الشريرة،"]]}, {"l": "Col 1:22", "n": "", "vs": [[22, "قد صالحكم الآن في جسد بشرية (ابنه) بالموت. وذلك لكي يحضركم فتمثلوا أمامه وأنتم قديسون بلا ذنب ولا لوم."]]}, {"l": "Lev 6:30", "n": "", "vs": [[30, "كل ذبيحة يؤخذ من دمها إلى خيمة الاجتماع للتكفير في القدس لا يؤكل منها بل تحرق كلها بنار."]]}, {"l": "Psa 85:10", "n": "", "vs": [[10, "الرحمة والحق تلاقيا، البر والسلام تعانقا."]]}, {"l": "Psa 85:11", "n": "", "vs": [[11, "ينبت الحق من الأرض، ويشرف البر من السماء."]]}, {"l": "Isa 9:6", "n": "", "vs": [[6, "لأنه يولد لنا ولد ويعطى لنا ابن يحمل الرياسة على كتفه، ويدعى اسمه عجيبا، مشيرا، إلها قديرا، أبا أبديا، رئيس السلام."]]}, {"l": "Isa 9:7", "n": "", "vs": [[7, "ولا تكون نهاية لنمو رياسته وللسلام اللذين يسودان عرش داود ومملكته، ليثبتها ويعضدها بالحق والبر، من الآن وإلى الأبد. إن غيرة الرب القدير تتمم هذا."]]}, {"l": "Eze 45:17-20", "n": "", "vs": [[17, "وعلى الرئيس تكون قرابين المحرقات وتقدمات الدقيق وسكيب الخمر في الأعياد ورؤوس الشهور وأيام السبوت، وفي كل مواسم احتفالات شعب إسرائيل، إذ عليه أن يقدم ذبيحة الخطيئة وتقدمة الدقيق وذبيحة المحرقة وذبائح السلام للتكفير عن شعب إسرائيل."], [18, "وهذا ما يعلنه السيد الرب: في اليوم الأول من الشهر الأول تأخذ ثورا سليما وتطهر المقدس بدمه."], [19, "ويتناول الكاهن من دم ذبيحة الخطيئة، ويضع منه على قوائم الهيكل وعلى أربع زوايا رف المذبح، وعلى قوائم باب الساحة الداخلية."], [20, "وتقوم بمثل ذلك أيضا في اليوم السابع من الشهر، عن كل من ضل سهوا أو جهلا، فتكفرون عن الهيكل."]]}, {"l": "Dan 9:24-26", "n": "", "vs": [[24, "قد صدر القضاء أن يمضي سبعون أسبوعا على شعبك وعلى مدينة قدسك، للانتهاء من المعصية والقضاء على الخطيئة، وللتكفير عن الإثم، ولإشاعة البر الأبدي وختم الرؤيا والنبوءة ولمسح قدوس القدوسين."], [25, "لهذا فاعلم وافهم أن الحقبة الممتدة منذ صدور الأمر بإعادة بناء أورشليم إلى مجيء المسيح، سبعة أسابيع، ثم اثنان وستون أسبوعا يبنى في غضونها سوق وخليج. إنما تكون تلك أزمنة ضيق."], [26, "وبعد اثنين وستين أسبوعا يقتل المسيح، ولكن ليس من أجل نفسه، ويدمر شعب رئيس آت المدينة والقدس، وتقبل آخرتها كطوفان، وتستمر الحرب حتى النهاية، ويعم الخراب المقضي به."]]}, {"l": "Mic 5:2", "n": "", "vs": [[2, "أما أنت يابيت لحم أفراتة، مع أنك قرية صغيرة بين ألوف قرى يهوذا، إلا أن منك يخرج لي من يصبح ملكا في إسرائيل وأصله منذ القديم، منذ الأزل."]]}, {"l": "Mic 5:5", "n": "", "vs": [[5, "ويصبح الرب سلامهم، إذ حين يزحف الأشوريون إلى أرضنا ويطأون ترابنا، فإننا نثير عليهم سبعة رعاة وثمانية أمراء من الناس،"]]}, {"l": "Zec 9:9", "n": "", "vs": [[9, "»ابتهجي جدا ياابنة صهيون واهتفي ياابنة أورشليم، لأن هوذا ملكك مقبل إليك. هو عادل ظافر، ولكنه وديع راكب على أتان، على جحش ابن أتان."]]}, {"l": "Zec 9:10", "n": "", "vs": [[10, "وأستأصل المركبات الحربية من أفرايم، والخيل من أورشليم، وتبيد أقواس القتال، ويشيع السلام بين الأمم، ويمتد ملكه من البحر إلى البحر، ومن نهر الفرات إلى أقاصي الأرض."]]}, {"l": "Luk 2:14", "n": "", "vs": [[14, "«المجد لله في الأعالي، وعلى الأرض السلام؛ وبالناس المسرة! »"]]}, {"l": "Act 10:30", "n": "", "vs": [[30, "فأجاب كرنيليوس: «منذ أربعة أيام، في مثل هذه الساعة كنت أصلي في بيتي صلاة الساعة الثالثة بعد الظهر فظهر أمامي فجأة رجل يلبس ثوبا براقا"]]}, {"l": "Rom 5:1", "n": "", "vs": [[1, "فبما أننا قد تبررنا على أساس الإيمان، صرنا في سلام مع الله بربنا يسوع المسيح."]]}, {"l": "2Co 5:19-21", "n": "", "vs": [[19, "ذلك أن الله كان في المسيح مصالحا العالم مع نفسه، غير حاسب عليهم خطاياهم، وقد وضع بين أيدينا رسالة هذه المصالحة."], [20, "فنحن إذن سفراء المسيح، وكأن الله يعظ بنا نتوسل بالنيابة عن المسيح منادين: «تصالحوا مع الله!»"], [21, "فإن الذي لم يعرف خطيئة، جعله الله خطيئة لأجلنا، لنصير نحن بر الله فيه."]]}, {"l": "Eph 2:13-17", "n": "", "vs": [[13, "أما الآن، ففي المسيح يسوع، أنتم الذين كنتم من قبل بعيدين قد صرتم قريبين بدم المسيح."], [14, "فإنه هو سلامنا، ذاك الذي جعل الفريقين واحدا وهدم حائط الحاجز الفاصل بينهما،"], [15, "أي العداء: إذ أبطل بجسده شريعة الوصايا ذات الفرائض، لكي يكون من الفريقين إنسانا واحدا جديدا، إذ أحل السلام بينهما،"], [16, "ولكي يصالحهما معا في جسد واحد مع الله بالصليب الذي به قتل العداء."], [17, "ثم جاء وبشركم بالسلام أنتم البعيدين، (كما بشر بالسلام) أولئك القريبين."]]}, {"l": "Heb 13:20", "n": "", "vs": [[20, "وأسأل الله ، إله السلام الذي أقام من بين الأموات ربنا يسوع راعي الخراف العظيم بفضل دمه الذي ختم به العهد الأبدي"]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}, {"l": "1Jo 4:9", "n": "", "vs": [[9, "وقد أظهر الله محبته لنا إذ أرسل ابنه الأوحد إلى العالم لكي نحيا به."]]}, {"l": "1Jo 4:10", "n": "", "vs": [[10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."]]}], "kwAr": "إذ أحل السلام بدمه على الصليب", "noteAr": "أو: صانعًا السلام."}, {"kw": "reconcile", "raw": "2Co_5:18; Heb_2:17", "note": "", "refs": [{"l": "2Co 5:18", "n": "", "vs": [[18, "وكل شيء هو من عند الله الذي صالحنا مع نفسه بالمسيح، ثم سلمنا خدمة هذه المصالحة."]]}, {"l": "Heb 2:17", "n": "", "vs": [[17, "ولذلك كان لابد أن يشبه إخوته من جميع النواحي، ليكون هو رئيس الكهنة، الرحيم والأمين، الذي يقوم بعمله أمام الله نيابة عن الشعب، فيكفر عن خطاياهم."]]}], "kwAr": "وأن يصالح به كل شيء", "noteAr": ""}, {"kw": "things in earth", "raw": "Eph_1:10; Phi_2:10", "note": "", "refs": [{"l": "Eph 1:10", "n": "", "vs": [[10, "لأجل تدبير تمام الأزمنة، حين يوحد كل شيء تحت رئاسة المسيح، سواء الأشياء التي في السماوات والتي على الأرض."]]}, {"l": "Phi 2:10", "n": "", "vs": [[10, "لكي تنحني سجودا لاسم يسوع كل ركبة، سواء في السماء أم على الأرض أم تحت الأرض،"]]}], "kwAr": "ما على الأرض أو ما في السماوات", "noteAr": ""}], "arS": [["وأن ", []], ["يصالح", ["G604"]], [" به ", []], ["كل شيء", ["G3956"]], [" مع ", []], ["نفسه", ["G848"]], ["، إذ ", []], ["أحل السلام", ["G1517"]], [" ", []], ["بدمه", ["G129"]], [" على ", []], ["الصليب", ["G4716"]], ["، فبه ", []], ["يصالح", ["G604"]], [" كل شيء، سواء كان ما على ", []], ["الأرض", ["G1093"]], [" أو ما في ", []], ["السماوات", ["G3772"]], [".", []]]}, {"c": 1, "v": 21, "text": "وأنتم، يامن كنتم في الماضي أجانب وأعداء في الفكر، بأعمالكم الشريرة،", "groups": [{"kw": "sometime", "raw": "Rom_1:30, Rom_5:9, Rom_5:10, Rom_8:7, Rom_8:8; 1Co_6:9-11; Eph_2:1, Eph_2:2, Eph_2:12, Eph_2:19, Eph_4:18; Tit_3:3-7; Jam_4:4", "note": "", "refs": [{"l": "Rom 1:30", "n": "", "vs": [[30, "مغتابون، كارهون لله، شتامون، متكبرون، متفاخرون، مخترعون للشرور، غير طائعين للوالدين."]]}, {"l": "Rom 5:9", "n": "", "vs": [[9, "ومادمنا الآن قد تبررنا بدمه، فكم بالأحرى نخلص به من الغضب الآتي!"]]}, {"l": "Rom 5:10", "n": "", "vs": [[10, "فإن كنا، ونحن أعداء، قد تصالحنا مع الله بموت ابنه، فكم بالأحرى نخلص بحياته ونحن مصالحون!"]]}, {"l": "Rom 8:7", "n": "", "vs": [[7, "لأن اهتمام الجسد هو عداوة لله، إذ إنه لا يخضع لناموس الله، بل لا يستطيع ذلك."]]}, {"l": "Rom 8:8", "n": "", "vs": [[8, "فالذين هم تحت سلطة الجسد لا يستطيعون أن يرضوا الله ."]]}, {"l": "1Co 6:9-11", "n": "", "vs": [[9, "أما تعلمون أن الظالمين لن يرثوا ملكوت الله؟ لا تضلوا: فإن ملكوت الله لن يرثه الزناة ولا عابدو الأصنام ولا الفاسقون ولا المتخنثون ولا مضاجعو الذكور"], [10, "ولا السراقون ولا الطماعون ولا السكيرون ولا الشتامون ولا المغتصبون."], [11, "وهكذا كان بعضكم، إلا أنكم قد اغتسلتم، بل تقدستم، بل تبررتم، باسم الرب يسوع المسيح وبروح إلهنا."]]}, {"l": "Eph 2:1", "n": "", "vs": [[1, "وأنتم كنتم في السابق أمواتا بذنوبكم وخطاياكم،"]]}, {"l": "Eph 2:2", "n": "", "vs": [[2, "التي كنتم تسلكون فيها حسب مسرى هذا العالم، تابعين رئيس قوات الهواء، ذلك الروح العامل الآن في أبناء العصيان،"]]}, {"l": "Eph 2:12", "n": "", "vs": [[12, "أنكم كنتم في ذلك الحين بلا مسيح، أجانب عن جماعة إسرائيل، وغرباء عن العهود الموعودة، لا رجاء لكم، ومنكرين لله في العالم."]]}, {"l": "Eph 2:19", "n": "", "vs": [[19, "إذن، لستم غرباء وأجانب بعد الآن، بل أنتم رعية مع القديسين وأعضاء في عائلة الله،"]]}, {"l": "Eph 4:18", "n": "", "vs": [[18, "لكونهم مظلمي البصيرة ومتغربين عن حياة الله بسبب ما فيهم من جهل وقساوة قلب."]]}, {"l": "Tit 3:3-7", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."], [4, "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،"], [5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"], [6, "الذي سكبه علينا بغنى بيسوع المسيح مخلصنا."], [7, "حتى إذا تبررنا بنعمته، نصير ورثة، وفقا لرجائنا بالحياة الأبدية."]]}, {"l": "Jam 4:4", "n": "", "vs": [[4, "أيها الخونة! ألستم تعلمون أن مصادقة العالم هي معاداة لله؟ فالذي يريد أن يصادق العالم، يجعل نفسه عدوا لله."]]}], "kwAr": "في الماضي أجانب", "noteAr": ""}, {"kw": "in your mind by", "raw": "or, by your mind in, Tit_1:15, Tit_1:16", "note": "or, by your mind in, Tit_1:15, Tit_1:16", "refs": [{"l": "Tit 1:15", "n": "", "vs": [[15, "عند الطاهرين، كل شيء طاهر. أما عند النجسين وغير المؤمنين، فما من شيء طاهر، بل إن عقولهم وضمائرهم أيضا قد صارت نجسة."]]}, {"l": "Tit 1:16", "n": "", "vs": [[16, "يشهدون معترفين بأنهم يعرفون الله ، ولكنهم بأعمالهم ينكرونه، لأنهم مكروهون وغير طائعين، وقد تبين أنهم غير أهل لكل عمل صالح."]]}], "kwAr": "وأعداء في الفكر", "noteAr": "أو: بفكركم في (أعمالكم الشريرة)."}], "arS": [["وأنتم، يامن كنتم في ", []], ["الماضي", ["G4218"]], [" ", []], ["أجانب", ["G526"]], [" ", []], ["وأعداء", ["G2190"]], [" في ", []], ["الفكر", ["G1271"]], ["، ", []], ["بأعمالكم", ["G2041"]], [" ", []], ["الشريرة", ["G4190"]], ["،", []]]}, {"c": 1, "v": 22, "text": "قد صالحكم الآن في جسد بشرية (ابنه) بالموت. وذلك لكي يحضركم فتمثلوا أمامه وأنتم قديسون بلا ذنب ولا لوم.", "groups": [{"kw": "the body", "raw": "Rom_7:4; Eph_2:15, Eph_2:16; Heb_10:10,Heb_10:20", "note": "", "refs": [{"l": "Rom 7:4", "n": "", "vs": [[4, "وهكذا أنتم أيضا ياإخوتي، فإنكم بجسد المسيح الذي مات، قد صرتم أمواتا بالنسبة للشريعة، لكي تصيروا لآخر، إلى المسيح نفسه الذي أقيم من بين الأموات، من أجل أن نثمر لله."]]}, {"l": "Eph 2:15", "n": "", "vs": [[15, "أي العداء: إذ أبطل بجسده شريعة الوصايا ذات الفرائض، لكي يكون من الفريقين إنسانا واحدا جديدا، إذ أحل السلام بينهما،"]]}, {"l": "Eph 2:16", "n": "", "vs": [[16, "ولكي يصالحهما معا في جسد واحد مع الله بالصليب الذي به قتل العداء."]]}, {"l": "Heb 10:10", "n": "", "vs": [[10, "بموجب هذه الإرادة الإلهية، صرنا مقدسين إذ قرب يسوع المسيح، مرة واحدة، جسده عوضا عنا!"]]}, {"l": "Heb 10:20", "n": "", "vs": [[20, "وذلك بسلوك هذا الطريق الحي الجديد الذي شقه لنا المسيح بتمزيق الحجاب، أي جسده."]]}], "kwAr": "في جسد بشرية", "noteAr": ""}, {"kw": "to", "raw": "Luk_1:75; 2Co_11:2; Eph_1:4, Eph_5:27; 1Th_4:7; Tit_2:14; 2Pe_3:14; Jud_1:24", "note": "", "refs": [{"l": "Luk 1:75", "n": "", "vs": [[75, "بقداسة وبر أمامه، طوال حياتنا."]]}, {"l": "2Co 11:2", "n": "", "vs": [[2, "فإني أغار عليكم غيرة من عند الله لأني خطبتكم لرجل واحد هو المسيح، لأقدمكم إليه عذراء عفيفة."]]}, {"l": "Eph 1:4", "n": "", "vs": [[4, "كما كان قد اختارنا فيه قبل تأسيس العالم، لنكون قديسين بلا لوم أمامه."]]}, {"l": "Eph 5:27", "n": "", "vs": [[27, "حتى يزفها إلى نفسه كنيسة بهية لا يشوبها عيب أو تجعد أو أية نقيصة مشابهة بل تكون مقدسة خالية من العيوب."]]}, {"l": "1Th 4:7", "n": "", "vs": [[7, "فإن الله دعانا لا إلى النجاسة بل (إلى العيش( في القداسة."]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "2Pe 3:14", "n": "", "vs": [[14, "فبينما تنتظرون إتمام هذا الوعد، أيها الأحباء، اجتهدوا أن يجدكم الرب في سلام، خالين من الدنس والعيب."]]}, {"l": "Jud 1:24", "n": "", "vs": [[24, "وللقادر أن يحرسكم من السقوط حتى يوصلكم إلى المثول أمامه في المجد مبتهجين ولا عيب فيكم …"]]}], "kwAr": "لكي يحضركم", "noteAr": ""}, {"kw": "in his", "raw": "Job_15:15, Job_25:5; Psa_51:7; Heb_13:21", "note": "", "refs": [{"l": "Job 15:15", "n": "", "vs": [[15, "فإن كان الله لا يأتمن قديسيه، والسماوات غير طاهرة لديه،"]]}, {"l": "Job 25:5", "n": "", "vs": [[5, "فإن كان القمر لا يضيء، والكواكب غير نقية في عينيه،"]]}, {"l": "Psa 51:7", "n": "", "vs": [[7, "طهرني بالزوفا فأتنقى. اغسلني فأبيض أكثر من الثلج."]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}], "kwAr": "أمامه", "noteAr": ""}], "arS": [["قد ", []], ["صالحكم", ["G604"]], [" ", []], ["الآن", ["G3570"]], [" في ", []], ["جسد", ["G4983"]], [" ", []], ["بشرية", ["G4561"]], [" (ابنه) ", []], ["بالموت", ["G2288"]], [". وذلك لكي ", []], ["يحضركم", ["G3936"]], [" فتمثلوا ", []], ["أمامه", ["G2714", "G848"]], [" وأنتم ", []], ["قديسون", ["G40"]], [" ", []], ["بلا ذنب", ["G299"]], [" ", []], ["ولا لوم", ["G410"]], [".", []]]}, {"c": 1, "v": 23, "text": "على أن تثبتوا فعلا في الإيمان، مؤسسين وراسخين وغير متحولين عن رجاء الإنجيل الذي سمعتموه والذي بشر به للخليقة كلها تحت السماء، وله صرت أنا بولس خادما.", "groups": [{"kw": "ye continue", "raw": "Psa_92:13, Psa_92:14, Psa_125:5; Eze_18:26; Hos_6:3, Hos_6:4; Zep_1:6; Mat_24:13; Luk_8:13-15, Luk_22:32; Joh_8:30-32, Joh_15:9, Joh_15:10; Act_11:23, Act_14:22; Rom_2:7; Gal_4:11, Gal_5:7, Gal_6:9; 1Th_3:5; Heb_3:6, Heb_3:14, Heb_4:14, Heb_10:38; 1Pe_1:5; 2Pe_2:18-22; 1Jo_2:27; Rev_2:10", "note": "", "refs": [{"l": "Psa 92:13", "n": "", "vs": [[13, "لأن المغروسين في بيت الرب يزدهرون في ديار بيت إلهنا"]]}, {"l": "Psa 92:14", "n": "", "vs": [[14, "يثمرون أيضا في الشيخوخة، ويظلون موفوري العافية والنضرة"]]}, {"l": "Psa 125:5", "n": "", "vs": [[5, "أما الذين يحيدون إلى طرق ملتوية، فإن الرب يسوقهم إلى الهلاك مع فاعلي الإثم. ليكن السلام لشعب إسرائيل."]]}, {"l": "Eze 18:26", "n": "", "vs": [[26, "إذا تحول البار عن بره وارتكب إثما ومات بسببه، فهو بإثمه الذي جناه يموت."]]}, {"l": "Hos 6:3", "n": "", "vs": [[3, "لنعرف، بل لنجد حتى نعرف الرب، فمجيئه يقين كالفجر، يقبل إلينا كإقبال المطر وكغيوث الربيع التي تروي الأرض»."]]}, {"l": "Hos 6:4", "n": "", "vs": [[4, "ماذا أصنع بك ياإسرائيل، وأي شيء أفعله بك يايهوذا؟ إن حبكم يتلاشى كسحابة الصبح ويتبخر كالندى."]]}, {"l": "Zep 1:6", "n": "", "vs": [[6, "والذين ارتدوا عن اتباع الرب، والذين كفوا عن طلبه والتماسه."]]}, {"l": "Mat 24:13", "n": "", "vs": [[13, "ولكن الذي يثبت حتى النهاية، فهو يخلص."]]}, {"l": "Luk 8:13-15", "n": "", "vs": [[13, "وما وقع على الصخر هم الذين يقبلون الكلمة بفر ح لدى سماعها، وهؤلاء لا أصل لهم، فيؤمنون إلى حين، وفي وقت التجربة يتراجعون."], [14, "وما وقع حيث الأشواك هم الذين يسمعون ثم يمضون فتخنقهم هموم الحياة وغناها ولذاتها، فلا ينتجون ثمرا ناضجا."], [15, "وأما الذي وقع في الأرض الجيدة، فهم الذين يسمعون الكلمة ويحفظونها في قلب جيد مستقيم، وينتجون ثمرا بالصبر."]]}, {"l": "Luk 22:32", "n": "", "vs": [[32, "ولكني تضرعت لأجلك لكي لا يخيب إيمانك. وأنت، بعد أن تسترد، ثبت إخوتك»."]]}, {"l": "Joh 8:30-32", "n": "", "vs": [[30, "وبينما يسوع يتكلم بهذا، آمن به كثيرون."], [31, "فقال لليهود الذين آمنوا به: «إن ثبتم في كلمتي، كنتم حقا تلاميذي."], [32, "وتعرفون الحق، والحق يحرركم»."]]}, {"l": "Joh 15:9", "n": "", "vs": [[9, "مثلما أحبني الآب، أحببتكم أنا، فاثبتوا في محبتي."]]}, {"l": "Joh 15:10", "n": "", "vs": [[10, "إن عملتم بوصاياي، تثبتون في محبتي، كما عملت أنا بوصايا أبي وأثبت في محبته!"]]}, {"l": "Act 11:23", "n": "", "vs": [[23, "فلما وصل ورأى النعمة التي منحها الله ، امتلأ فرحا، وحث الجميع على الثبات في الرب بعزم القلب."]]}, {"l": "Act 14:22", "n": "", "vs": [[22, "وفي هذه الأماكن كلها كانا يشددان عزيمة التلاميذ، ويحثانهم على الثبات في الإيمان، مؤكدين لهم أن دخول ملكوت الله يقتضي أن نقاسي صعوبات كثيرة."]]}, {"l": "Rom 2:7", "n": "", "vs": [[7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"]]}, {"l": "Gal 4:11", "n": "", "vs": [[11, "أخاف عليكم، خشية أن أكون قد تعبت من أجلكم بلا جدوى."]]}, {"l": "Gal 5:7", "n": "", "vs": [[7, "كنتم تجرون جريا جيدا، فمن أعاقكم حتى لا تذعنوا للحق؟"]]}, {"l": "Gal 6:9", "n": "", "vs": [[9, "لأننا، متى حان الأوان، سنحصد، إن كنا لا نتراخى."]]}, {"l": "1Th 3:5", "n": "", "vs": [[5, "ولهذا أيضا، إذ صار الافتراق عنكم لا يحتمل، أرسلت أستخبر عن إيمانكم لئلا يكون المجرب قد جربكم فيذهب جهدنا سدى!"]]}, {"l": "Heb 3:6", "n": "", "vs": [[6, "أما المسيح، فهو أمين بصفته ابنا يترَأس على البيت. وهذا البيت هو نحن المؤمنين، على أن نتمسك بالثقة والافتخار برجائنا تمسكا ثابتا حتى النهاية."]]}, {"l": "Heb 3:14", "n": "", "vs": [[14, "فإن تمسكنا دائما بالثقة التي انطلقنا بها في البداية، وأبقيناها ثابتة إلى النهاية، نكون مشاركين للمسيح."]]}, {"l": "Heb 4:14", "n": "", "vs": [[14, "فمادام لنا رئيس كهنتنا العظيم الذي ارتفع مجتازا السماوات، وهو يسوع ابن الله، فلنتمسك دائما بالاعتراف به."]]}, {"l": "Heb 10:38", "n": "", "vs": [[38, "وأما من تبرر بالإيمان، فبالإيمان يحيا. ومن ارتد لا تسر به نفسي!"]]}, {"l": "1Pe 1:5", "n": "", "vs": [[5, "محفوظا لكم في السماوات. فإنكم محفوظون بقدرة الله العاملة من خلال إيمانكم، إلى أن تفوزوا بالخلاص النهائي المعد لكم والذي سوف يتجلى في الزمان الأخير."]]}, {"l": "2Pe 2:18-22", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."], [19, "يعدون هؤلاء بالحرية، وهم أنفسهم عبيد للفساد! لأن الإنسان يصير عبدا لكل ما يتسلط عليه ويغلبه."], [20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."], [21, "وبالحقيقة، كان أفضل لهم لو أنهم لم يتعرفوا بطريق البر، من أن يتعرفوا به ثم يرتدوا عن الوصية المقدسة التي تسلموها."], [22, "وينطبق على هؤلاء ما يقوله المثل الصادق: «عاد الكلب إلى تناول ما تقيأه، والخنزيرة المغتسلة إلى التمرغ في الوحل!»"]]}, {"l": "1Jo 2:27", "n": "", "vs": [[27, "أما أنتم فقد نلتم من الله مسحة تبقى فيكم دائما. ولذلك، لستم بحاجة إلى من يعلمكم الحق. فتلك المسحة عينها هي التي تعلمكم كل شيء. وهي حق وليست كذبا. فكما علمتكم اثبتوا في المسيح."]]}, {"l": "Rev 2:10", "n": "", "vs": [[10, "دع عنك الخوف مما ينتظرك من آلام، فإن إبليس سيزج ببعضكم في السجن لكي تمتحنوا، فتقاسون الاضطهاد عشرة أيام. فابق أمينا حتى الموت، فأمنحك إكليل الحياة."]]}], "kwAr": "على أن تثبتوا فعلا", "noteAr": ""}, {"kw": "grounded", "raw": "Col_2:7; Mat_7:24, Mat_7:25; Luk_6:48; Eph_2:21, Eph_3:17, Eph_4:16", "note": "", "refs": [{"l": "Col 2:7", "n": "", "vs": [[7, "وأنتم متأصلون ومبنيون فيه وراسخون في الإيمان الموافق لما تعلمتم وفائضون بالشكر."]]}, {"l": "Mat 7:24", "n": "", "vs": [[24, "فأي من يسمع أقوالي هذه ويعمل بها، أشبهه برجل حكيم بنى بيته على الصخر،"]]}, {"l": "Mat 7:25", "n": "", "vs": [[25, "فنزلت الأمطار، وجرت السيول، وهبت العواصف، فضربت ذلك البيت، فلم يسقط لأنه مؤسس على الصخر."]]}, {"l": "Luk 6:48", "n": "", "vs": [[48, "إنه يشبه إنسانا يبني بيتا، فحفر وعمق ووضع الأساس على الصخر. ثم هطل مطر غزير وصدم السيل ذلك البيت، فلم يقدر أن يزعزعه، لأنه كان مؤسسا على الصخر."]]}, {"l": "Eph 2:21", "n": "", "vs": [[21, "الذي فيه يتناسق البناء كله فيرتفع ليصير هيكلا مقدسا في الرب."]]}, {"l": "Eph 3:17", "n": "", "vs": [[17, "ليسكن المسيح في قلوبكم بالإيمان؛ حتى إذا تأصلتم وتأسستم في المحبة،"]]}, {"l": "Eph 4:16", "n": "", "vs": [[16, "فمنه يستمد الجسد كله تماسكه وترابطه بمساندة كل مفصل وفقا لمقدار العمل المخصص لكل جزء، لينشيء نموا يؤول إلى بنيان الجسد بنيانا ذاتيا في المحبة."]]}], "kwAr": "مؤسسين وراسخين", "noteAr": ""}, {"kw": "moved", "raw": "Joh_15:6; Act_20:24; 1Co_15:58; 1Th_3:3", "note": "", "refs": [{"l": "Joh 15:6", "n": "", "vs": [[6, "إن كان أحد لا يثبت في يطرح خارجا كالغصن فيجف؛ ثم تجمع الأغصان الجافة، وتطرح في النار فتحترق."]]}, {"l": "Act 20:24", "n": "", "vs": [[24, "ولكني لا أحسب لحياتي أية قيمة، ما دمت أسعى إلى بلوغ غايتي وإتمام الخدمة التي كلفني إياها الرب يسوع: أن أشهد ببشارة نعمة الله."]]}, {"l": "1Co 15:58", "n": "", "vs": [[58, "إذن، ياإخوتي الأحباء، كونوا راسخين غير متزحزحين، كثيري الاجتهاد في عمل الرب دائما، عالمين أن جهدكم في الرب ليس عبثا!"]]}, {"l": "1Th 3:3", "n": "", "vs": [[3, "حتى لا يتزعزع أحد منكم من جراء هذه الضيقات. فإنكم تعلمون أننا معينون لذلك؛"]]}], "kwAr": "وغير متحولين", "noteAr": ""}, {"kw": "the hope", "raw": "Col_1:5; Rom_5:5; Gal_5:5; Eph_1:18; 1Th_5:8; 2Th_2:16; Tit_3:7; Heb_6:19; 1Pe_1:3; 1Jo_3:1-3", "note": "", "refs": [{"l": "Col 1:5", "n": "", "vs": [[5, "بسبب الرجاء المحفوظ لكم في السماوات، الرجاء الذي سمعتم به سابقا في كلمة الحق التي في الإنجيل"]]}, {"l": "Rom 5:5", "n": "", "vs": [[5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."]]}, {"l": "Gal 5:5", "n": "", "vs": [[5, "فإننا، بالروح وعلى أساس الإيمان، ننتظر الرجاء الذي ينتجه البر."]]}, {"l": "Eph 1:18", "n": "", "vs": [[18, "إذ تستنير بصائر قلوبكم، فتعلموا ما في دعوته لكم من رجاء، وما هو غنى مجد ميراثه في القديسين،"]]}, {"l": "1Th 5:8", "n": "", "vs": [[8, "وأما نحن، أهل النهار، فلنظل صاحين، متخذين من الإيمان والمحبة درعا لصدورنا، ومن الرجاء بالخلاص خوذة لرؤوسنا."]]}, {"l": "2Th 2:16", "n": "", "vs": [[16, "وليت ربنا يسوع المسيح نفسه، والله أبانا، الذي أحبنا ووهبنا بنعمته راحة أبدية ورجاء صالحا،"]]}, {"l": "Tit 3:7", "n": "", "vs": [[7, "حتى إذا تبررنا بنعمته، نصير ورثة، وفقا لرجائنا بالحياة الأبدية."]]}, {"l": "Heb 6:19", "n": "", "vs": [[19, "هذا الرجاء هو لنا بمثابة مرساة أمينة ثابتة تشد نفوسنا إلى ما وراء الحجاب السماوي."]]}, {"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}, {"l": "1Jo 3:1-3", "n": "", "vs": [[1, "تأملوا ما أعظم المحبة التي أحبنا بها الآب حتى صرنا ندعى «أولاد الله»، ونحن أولاده حقا. ولكن، بما أن أهل العالم لا يعرفون الله، فهم لا يعرفوننا."], [2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"], [3, "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر."]]}], "kwAr": "عن رجاء الإنجيل", "noteAr": ""}, {"kw": "to", "raw": "Col_1:6; Mat_24:14; Mar_16:15; Rom_10:18", "note": "", "refs": [{"l": "Col 1:6", "n": "", "vs": [[6, "والتي وصلت إليكم كما تنتشر الآن في العالم أجمع، منتجة الثمر ونامية، مثلما يحدث بينكم أنتم منذ أن سمعتم بنعمة الله واختبرتموها بالحق،"]]}, {"l": "Mat 24:14", "n": "", "vs": [[14, "فسوف ينادى ببشارة الملكوت هذه في العالم كله، شهادة لي لدى الأمم جميعا. وبعد ذلك تأتي النهاية."]]}, {"l": "Mar 16:15", "n": "", "vs": [[15, "وقال لهم: «اذهبوا إلى العالم أجمع، وبشروا الخليقة كلها بالإنجيل:"]]}, {"l": "Rom 10:18", "n": "", "vs": [[18, "ولكني أقول: أما سمعوا؟ بلى، فإن المبشرين «انطلق صوتهم إلى الأرض كلها، وكلامهم إلى أقاصي العالم»."]]}], "kwAr": "بشر به للخليقة كلها", "noteAr": ""}, {"kw": "under", "raw": "Deu_2:25, Deu_4:19; Lam_3:66; Act_2:5, Act_4:12", "note": "", "refs": [{"l": "Deu 2:25", "n": "", "vs": [[25, "ففي هذا اليوم بالذات أجعل هيبتكم والخوف منكم يطغيان على شعوب الأرض. وكل الذين يسمعون أخباركم يرتعدون ويفزعون أمامكم."]]}, {"l": "Deu 4:19", "n": "", "vs": [[19, "أو لئلا تتطلعوا إلى السماء فتشاهدوا الشمس والقمر والنجوم والأجرام السماوية التي وزعها الرب إلهكم على جميع الأمم التي تحت السماء، فتغووا وتسجدوا لها وتعبدوها."]]}, {"l": "Lam 3:66", "n": "", "vs": [[66, "تعقبهم بسخط وأهلكهم من تحت سماواتك يارب."]]}, {"l": "Act 2:5", "n": "", "vs": [[5, "وكانت أورشليم في ذلك الوقت مزدحمة باليهود الأتقياء الذين جاءوا إليها من أمم العالم كلها."]]}, {"l": "Act 4:12", "n": "", "vs": [[12, "وليس بأحد غيره الخلاص، إذ ليس تحت السماء اسم آخر قدمه الله للبشر به يجب أن نخلص!»"]]}], "kwAr": "تحت السماء", "noteAr": ""}, {"kw": "whereof", "raw": "Col_1:25; Act_1:17, Act_1:25, Act_26:16; Rom_15:16; 1Co_4:1-3; 2Co_3:6, 2Co_4:1, 2Co_5:18-20; 2Co_6:1, 2Co_11:23; Eph_3:7, Eph_3:8; 1Ti_1:12, 1Ti_2:7; 2Ti_1:11, 2Ti_1:12, 2Ti_4:5, 2Ti_4:6", "note": "", "refs": [{"l": "Col 1:25", "n": "", "vs": [[25, "ولها قد صرت أنا خادما بموجب تدبير الله الموهوب لي من أجلكم، وهو أن أتمم كلمة الله، بإعلان"]]}, {"l": "Act 1:17", "n": "", "vs": [[17, "وكان يهوذا يعتبر واحدا منا، وقد شاركنا في خدمتنا."]]}, {"l": "Act 1:25", "n": "", "vs": [[25, "ليشاركنا في الخدمة والرسالة بدلا من يهوذا الذي ذهب إلى المكان الذي يستحقه»."]]}, {"l": "Act 26:16", "n": "", "vs": [[16, "انهض وقف على قدميك، فقد ظهرت لك لأعينك خادما لي وشاهدا بهذه الرؤيا التي تراني فيها الآن، وبالرؤى التي ستراني فيها بعد اليوم."]]}, {"l": "Rom 15:16", "n": "", "vs": [[16, "وبذلك أكون خادم المسيح يسوع، المرسل إلى الأمم، حاملا إنجيل الله وكأني أقوم بخدمة كهنوتية، بقصد أن ترفع لله من بين الأمم تقدمة تكون مقبولة ومقدسة بالروح القدس."]]}, {"l": "1Co 4:1-3", "n": "", "vs": [[1, "فلينظر إلينا الناس باعتبارنا خداما للمسيح ووكلاء على أسرار الله."], [2, "والمطلوب من الوكلاء، قبل كل شيء، أن يوجد كل منهم أمينا."], [3, "أما أنا، فأقل ما أهتم به هو أن يتم الحكم في من قبلكم أو من قبل محكمة بشرية. بل أنا بذاتي لست أحكم على نفسي."]]}, {"l": "2Co 3:6", "n": "", "vs": [[6, "الذي جعلنا أصحاب كفاءة لنكون خداما لعهد جديد قائم لا على الحرف بل على الروح. فالحرف يؤدي إلى الموت؛ أما الروح فيعطي الحياة."]]}, {"l": "2Co 4:1", "n": "", "vs": [[1, "فما دامت لنا إذن هذه الخدمة برحمة من الله، فلا تخور عزيمتنا."]]}, {"l": "2Co 5:18-20", "n": "", "vs": [[18, "وكل شيء هو من عند الله الذي صالحنا مع نفسه بالمسيح، ثم سلمنا خدمة هذه المصالحة."], [19, "ذلك أن الله كان في المسيح مصالحا العالم مع نفسه، غير حاسب عليهم خطاياهم، وقد وضع بين أيدينا رسالة هذه المصالحة."], [20, "فنحن إذن سفراء المسيح، وكأن الله يعظ بنا نتوسل بالنيابة عن المسيح منادين: «تصالحوا مع الله!»"]]}, {"l": "2Co 6:1", "n": "", "vs": [[1, "فبما أننا عاملون معا عند الله، نطلب ألا يكون قبولكم لنعمة الله عبثا."]]}, {"l": "2Co 11:23", "n": "", "vs": [[23, "وإن كانوا خدام المسيح، أتكلم كأني فقدت صوابي، فأنا متفوق عليهم: في الأتعاب أوفر منهم جدا، في الجلدات فوق الحد، في السجون أوفر جدا، في التعرض للموت أكثر مرارا."]]}, {"l": "Eph 3:7", "n": "", "vs": [[7, "الذي صرت أنا خادما له بحسب نعمة الله الموهوبة لي وفقا لعمل قدرته."]]}, {"l": "Eph 3:8", "n": "", "vs": [[8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "1Ti 1:12", "n": "", "vs": [[12, "وكم أشكر المسيح يسوع ربنا الذي أعطاني القدرة وعينني خادما له، إذ اعتبرني جديرا بثقته،"]]}, {"l": "1Ti 2:7", "n": "", "vs": [[7, "ولها قد عينت أنا مبشرا ورسولا، الحق أقول ولست أكذب، معلما للأمم في الإيمان والحق."]]}, {"l": "2Ti 1:11", "n": "", "vs": [[11, "الذي له عينت أنا مبشرا ورسولا ومعلما."]]}, {"l": "2Ti 1:12", "n": "", "vs": [[12, "من أجل ذلك أيضا أقاسي الآن هذه الآلام، ولكني لست أخجل، لأنني أعرف من أنا مؤمن به، ولي تمام الثقة بأنه قادر أن يحفظ لي الأمانة التي أودعتها عنده سالمة إلى ذلك اليوم."]]}, {"l": "2Ti 4:5", "n": "", "vs": [[5, "أما أنت، فكن بصيرا في كل أمر، وتحمل المشقات، واعمل عمل المبشر، وأكمل خدمتك إلى التمام!"]]}, {"l": "2Ti 4:6", "n": "", "vs": [[6, "وأما أنا، فها إن حياتي بدأت تسكب سكيبا، وموعد رحيلي قد اقترب."]]}], "kwAr": "صرت أنا بولس خادما", "noteAr": ""}], "arS": [["على أن ", []], ["تثبتوا", ["G1961"]], [" فعلا في ", []], ["الإيمان", ["G4102"]], ["، ", []], ["مؤسسين", ["G2311"]], [" ", []], ["وراسخين", ["G1476"]], [" وغير ", []], ["متحولين", ["G3334"]], [" عن ", []], ["رجاء", ["G1680"]], [" ", []], ["الإنجيل", ["G2098"]], [" الذي ", []], ["سمعتموه", ["G191"]], [" والذي ", []], ["بشر به", ["G2784"]], [" ", []], ["للخليقة", ["G2937"]], [" ", []], ["كلها", ["G3956"]], [" ", []], ["تحت", ["G5259"]], [" ", []], ["السماء", ["G3772"]], ["، وله صرت ", []], ["أنا", ["G1473"]], [" ", []], ["بولس", ["G3972"]], [" ", []], ["خادما", ["G1249"]], [".", []]]}, {"c": 1, "v": 24, "text": "والآن أنا أفرح في الآلام التي أقاسيها لأجلكم، وأتمم في جسدي ما نقص من ضيقات المسيح لأجل جسده الذي هو الكنيسة،", "groups": [{"kw": "rejoice", "raw": "Mat_5:11, Mat_5:12; Act_5:41; Rom_5:3; 2Co_7:4; Eph_3:1, Eph_3:13; Phi_2:17, Phi_2:18; Jam_1:2", "note": "", "refs": [{"l": "Mat 5:11", "n": "", "vs": [[11, "طوبى لكم متى أهانكم الناس واضطهدوكم، وقالوا فيكم من أجلي كل سوء كاذبين."]]}, {"l": "Mat 5:12", "n": "", "vs": [[12, "افرحوا وتهللوا، فإن مكافأتكم في السماوات عظيمة. فإنهم هكذا اضطهدوا الأنبياء من قبلكم!"]]}, {"l": "Act 5:41", "n": "", "vs": [[41, "ولكن الرسل خرجوا من المجلس فرحين، لأنهم اعتبروا أهلا لأن يلقوا الإهانة من أجل اسم يسوع."]]}, {"l": "Rom 5:3", "n": "", "vs": [[3, "ليس هذا فقط، بل نفتخر أيضا في وسط الضيقات، لعلمنا أن الضيق ينتج فينا الصبر،"]]}, {"l": "2Co 7:4", "n": "", "vs": [[4, "كبيرة ثقتي بكم، وعظيم افتخاري بكم. إني ممتليء تشجيعا وفائض فرحا في جميع ضيقاتنا."]]}, {"l": "Eph 3:1", "n": "", "vs": [[1, "لهذا السبب، أنا بولس سجين المسيح يسوع لأجلكم أنتم الأمم …"]]}, {"l": "Eph 3:13", "n": "", "vs": [[13, "فلذلك أطلب إليكم ألا يفتر عزمكم بسبب الضيقات التي أقاسيها لأجلكم، فهي مفخرة لكم."]]}, {"l": "Phi 2:17", "n": "", "vs": [[17, "حتى لو سفك دمي سكيبا فوق ذبيحة إيمانكم وخدمته، فإني أفرح وأبتهج معكم جميعا."]]}, {"l": "Phi 2:18", "n": "", "vs": [[18, "هكذا أيضا افرحوا أنتم، وابتهجوا معي."]]}, {"l": "Jam 1:2", "n": "", "vs": [[2, "ياإخوتي، عندما تنزل بكم التجارب والمحن المختلفة، اعتبروها سبيلا إلى الفرح الكلي."]]}], "kwAr": "أنا أفرح في الآلام", "noteAr": ""}, {"kw": "fill", "raw": "2Co_1:5-8, 2Co_4:8-12, 2Co_11:23-27; Phi_3:10; 2Ti_1:8, 2Ti_2:9, 2Ti_2:10", "note": "", "refs": [{"l": "2Co 1:5-8", "n": "", "vs": [[5, "فكما فاضت علينا آلام المسيح، يفيض علينا أيضا التشجيع بالمسيح."], [6, "فإن كنا في ضيقة، فذلك لأجل تشجيعكم وخلاصكم؛ وإن كنا متشجعين، فذلك لأجل تشجيعكم، مما يعمل فيكم على احتمال نفس الآلام التي نتألم بها نحن أيضا."], [7, "وإن رجاءنا من أجلكم هو رجاء وطيد، إذ نعلم أنكم كما تشتركون معنا في احتمال الآلام، ستشتركون أيضا في نوال التشجيع."], [8, "فيا أيها الإخوة، نريد أن لا يخفى عليكم أمر الضيقة التي مررنا بها في مقاطعة أسيا. فقد كانت وطأتها علينا شديدة جدا وفوق طاقتنا، حتى يئسنا من الحياة نفسها."]]}, {"l": "2Co 4:8-12", "n": "", "vs": [[8, "فالصعوبات تضيق علينا من كل جهة، ولكن لا ننهار. لا نجد حلا مناسبا، ولكن لا نيأس."], [9, "يطاردنا الاضطهاد، ولكن لا يتخلى الله عنا. نطرح أرضا، ولكن لا نموت."], [10, "وحيثما ذهبنا، نحمل موت يسوع دائما في أجسادنا لتظهر فيها أيضا حياة يسوع."], [11, "فمع أننا مازلنا أحياء، فإننا نسلم دائما إلى الموت من أجل يسوع، لتظهر في أجسادنا الفانية حياة يسوع أيضا."], [12, "وهكذا، فإن الموت فعال فينا؛ والحياة فعالة فيكم."]]}, {"l": "2Co 11:23-27", "n": "", "vs": [[23, "وإن كانوا خدام المسيح، أتكلم كأني فقدت صوابي، فأنا متفوق عليهم: في الأتعاب أوفر منهم جدا، في الجلدات فوق الحد، في السجون أوفر جدا، في التعرض للموت أكثر مرارا."], [24, "من اليهود تلقيت الجلد خمس مرات، كل مرة أربعين جلدة إلا واحدة."], [25, "ضربت بالعصي ثلاث مرات. رجمت بالحجارة مرة. تحطمت بي السفينة ثلاث مرات. قضيت في عرض البحر يوما بنهاره وليله."], [26, "سافرت أسفارا عديدة؛ وواجهتني أخطار السيول الجارفة، وأخطار قطاع الطرق، وأخطار من بني جنسي، وأخطار من الأمم، وأخطار في المدن، وأخطار في البراري، وأخطار في البحر، وأخطار بين إخوة دجالين."], [27, "وكم عانيت من التعب والكد والسهر الطويل، والجوع والعطش والصوم الكثير، والبرد والعري."]]}, {"l": "Phi 3:10", "n": "", "vs": [[10, "وغايتي أن أعرف المسيح وقوة قيامته والشركة في آلامه؛ والتشبه به في موته،"]]}, {"l": "2Ti 1:8", "n": "", "vs": [[8, "فلا تخجل إذن بالشهادة لربنا، ولا تخجل بي أنا السجين لأجله، بل شاركني في المشقات لأجل الإنجيل، متوكلا على قدرة الله."]]}, {"l": "2Ti 2:9", "n": "", "vs": [[9, "الذي لأجل التبشير به أقاسي حتى القيود كأني فاعل شر. إلا أن كلمة الله لا تكبلها القيود."]]}, {"l": "2Ti 2:10", "n": "", "vs": [[10, "لهذا السبب أحتمل كل شيء بصبر لأجل الذين اختارهم الله ، لكي يحصلوا، هم أيضا، على الخلاص الذي في المسيح يسوع مع المجد الأبدي."]]}], "kwAr": "وأتمم في جسدي ما نقص", "noteAr": ""}, {"kw": "for", "raw": "Col_1:18; Eph_1:23", "note": "", "refs": [{"l": "Col 1:18", "n": "", "vs": [[18, "وهو رأس الجسد، أي الكنيسة؛ هو البداءة وبكر القائمين من بين الأموات، ليكون له المقام الأول في كل شيء."]]}, {"l": "Eph 1:23", "n": "", "vs": [[23, "التي هي جسده وكماله، هو الذي يكمل الكل في الكل."]]}], "kwAr": "لأجل جسده الذي هو الكنيسة", "noteAr": ""}], "arS": [["والآن", ["G3568"]], [" أنا ", []], ["أفرح", ["G5463"]], [" في ", []], ["الآلام", ["G3804"]], [" التي أقاسيها لأجلكم، ", []], ["وأتمم", ["G466"]], [" في ", []], ["جسدي", ["G4561", "G3450"]], [" ما ", []], ["نقص", ["G5303"]], [" من ", []], ["ضيقات", ["G2347"]], [" ", []], ["المسيح", ["G5547"]], [" لأجل ", []], ["جسده", ["G4983"]], [" الذي هو ", []], ["الكنيسة", ["G1577"]], ["،", []]]}, {"c": 1, "v": 25, "text": "ولها قد صرت أنا خادما بموجب تدبير الله الموهوب لي من أجلكم، وهو أن أتمم كلمة الله، بإعلان", "groups": [{"kw": "I am", "raw": "Col_1:23; 1Th_3:2; 1Ti_4:6", "note": "", "refs": [{"l": "Col 1:23", "n": "", "vs": [[23, "على أن تثبتوا فعلا في الإيمان، مؤسسين وراسخين وغير متحولين عن رجاء الإنجيل الذي سمعتموه والذي بشر به للخليقة كلها تحت السماء، وله صرت أنا بولس خادما."]]}, {"l": "1Th 3:2", "n": "", "vs": [[2, "فبعثنا تيموثاوس، أخانا ومعاوننا في خدمة الله بنشر الإنجيل، لكي يشددكم ويشجعكم في إيمانكم،"]]}, {"l": "1Ti 4:6", "n": "", "vs": [[6, "إن بسطت هذه الأمور أمام الإخوة، كنت خادما صالحا للمسيح يسوع، متغذيا بكلام الإيمان والتعليم الصالح الذي اتبعته تماما."]]}], "kwAr": "صرت أنا خادما", "noteAr": ""}, {"kw": "according", "raw": "Rom_15:15-18; 1Co_9:17; Gal_2:7, Gal_2:8; Eph_3:2", "note": "", "refs": [{"l": "Rom 15:15-18", "n": "", "vs": [[15, "على أني كتبت إليكم بأوفر جرأة في بعض الأمور، مذكرا لكم، وذلك بالنعمة التي وهبها الله لي."], [16, "وبذلك أكون خادم المسيح يسوع، المرسل إلى الأمم، حاملا إنجيل الله وكأني أقوم بخدمة كهنوتية، بقصد أن ترفع لله من بين الأمم تقدمة تكون مقبولة ومقدسة بالروح القدس."], [17, "يحق لي إذن أن أفتخر في المسيح يسوع بما يعود لله من خدمتي."], [18, "فما كنت لأتجاسر أن أتكلم بشيء إلا على ما عمله المسيح على يدي لهداية الأمم إلى الطاعة، بالقول والفعل،"]]}, {"l": "1Co 9:17", "n": "", "vs": [[17, "فإن قمت بذلك متطوعا، كانت لي مكافأة. ولكن، إن كنت مرغما، فأنا مؤتمن على مسئولية،"]]}, {"l": "Gal 2:7", "n": "", "vs": [[7, "بل بالعكس، رأوا أنه عهد إلي بالإنجيل لأهل عدم الختان، كما عهد به إلى بطرس لأهل الختان."]]}, {"l": "Gal 2:8", "n": "", "vs": [[8, "لأن الذي استخدم بطرس في رسوليته إلى أهل الختان، استخدمني أيضا بالنسبة إلى الأمم."]]}, {"l": "Eph 3:2", "n": "", "vs": [[2, "على اعتبار أنكم قد سمعتم بتدبير نعمة الله الموهوبة لي لأجلكم:"]]}], "kwAr": "بموجب تدبير الله", "noteAr": ""}, {"kw": "to fulfil", "raw": "or, fully to preach, Rom_15:19; 2Ti_4:2-5", "note": "or, fully to preach, Rom_15:19; 2Ti_4:2-5", "refs": [{"l": "Rom 15:19", "n": "", "vs": [[19, "وبقوة الآيات والعجائب، وبقوة روح الله. حتى إنني، من أورشليم وما حولها حتى مقاطعة إليريكون، قد أكملت التبشير بإنجيل المسيح."]]}, {"l": "2Ti 4:2-5", "n": "", "vs": [[2, "أن تنادي بالكلمة منشغلا بها كليا، في الفرص المناسبة وغير المناسبة على السواء، وأن توبخ وتنذر وتشجع بكل صبر في التعليم."], [3, "فإنه سيأتي زمان لا يطيق الناس فيه التعليم الصحيح، بل تبعا لشهواتهم الخاصة يكدسون لأنفسهم معلمين (يقولون لهم كلاما) يداعب الآذان."], [4, "فيحولون آذانهم بعيدا عن الحق، منحرفين إلى الخرافات."], [5, "أما أنت، فكن بصيرا في كل أمر، وتحمل المشقات، واعمل عمل المبشر، وأكمل خدمتك إلى التمام!"]]}], "kwAr": "أن أتمم كلمة الله", "noteAr": "أو: أن أكمل التبشير بكلمة الله."}], "arS": [["ولها قد صرت ", []], ["أنا", ["G1473"]], [" ", []], ["خادما", ["G1249"]], [" ", []], ["بموجب", ["G2596"]], [" ", []], ["تدبير", ["G3622"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["الموهوب", ["G1325"]], [" لي من أجلكم، وهو أن ", []], ["أتمم", ["G4137"]], [" ", []], ["كلمة", ["G3056"]], [" ", []], ["الله", ["G2316"]], ["، بإعلان", []]]}, {"c": 1, "v": 26, "text": "السر الذي كان مكتوما طوال العصور والأجيال، ولكن كشف الآن لقديسيه،", "groups": [{"kw": "the mystery", "raw": "Rom_16:25, Rom_16:26; 1Co_2:7; Eph_3:3-10", "note": "", "refs": [{"l": "Rom 16:25", "n": "", "vs": [[25, "والمجد للقادر أن يثبتكم، وفقا لإنجيلي وللبشارة بيسوع المسيح، ووفقا لإعلان ما كان سرا ظل مكتوما مدى الأزمنة الأزلية،"]]}, {"l": "Rom 16:26", "n": "", "vs": [[26, "ولكن أذيع الآن، بأمر الله الأزلي في الكتابات النبوية، على جميع الأمم لأجل إطاعة الإيمان؛"]]}, {"l": "1Co 2:7", "n": "", "vs": [[7, "بل إننا نتكلم بحكمة الله المطوية في سر، تلك الحكمة المحجوبة التي سبق الله فأعدها قبل الدهور لأجل مجدنا"]]}, {"l": "Eph 3:3-10", "n": "", "vs": [[3, "كيف كشف لي السر عن طريق الوحي، كما كتبت قبلا بإيجاز،"], [4, "ويمكنكم، حينما تقرأون ما كتبته، أن تدركوا اطلاعي العميق على سر المسيح،"], [5, "ذلك السر الذي لم يطلع عليه بنو البشر في الأجيال الماضية مثلما أعلن الآن بوحي الروح لرسله القديسين وأنبيائه:"], [6, "وهو أن الأمم هم شركاء اليهود في الميراث، وأعضاء في الجسد معهم، ولهم أيضا حق الاستفادة من الوعد. وذلك في المسيح يسوع وبفضل الإنجيل"], [7, "الذي صرت أنا خادما له بحسب نعمة الله الموهوبة لي وفقا لعمل قدرته."], [8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"], [9, "وأنير الجميع بمعرفة ما هو تدبير السر الذي أبقاه الله ، خالق كل شيء، مكتوما مدى الأجيال."], [10, "والغاية أن يتجلى الآن أمام الرئاسات والسلطات في الأماكن السماوية ما يظهر في الكنيسة من حكمة الله المتعددة الوجوه،"]]}], "kwAr": "السر الذي كان مكتوما", "noteAr": ""}, {"kw": "now", "raw": "Psa_25:14; Mat_13:11; Mar_4:11; Luk_8:10; 2Ti_1:10", "note": "", "refs": [{"l": "Psa 25:14", "n": "", "vs": [[14, "يطلع الرب خائفيه على مقاصده الخفية، ويتعهد تعليمهم."]]}, {"l": "Mat 13:11", "n": "", "vs": [[11, "فأجاب: «لأنه قد أعطي لكم أن تعرفوا أسرار ملكوت السماوات؛ أما أولئك، فلم يعط لهم ذلك."]]}, {"l": "Mar 4:11", "n": "", "vs": [[11, "فقال لهم: «قد أعطي لكم أن تعرفوا سر ملكوت الله. أما الذين من خارج، فكل شيء يقدم لهم بالأمثال،"]]}, {"l": "Luk 8:10", "n": "", "vs": [[10, "فقال: «لكم قد أعطي أن تعرفوا أسرار ملكوت الله. أما الآخرون، فأكلمهم بأمثال، حتى إنهم: ينظرون ولا يبصرون، ويسمعون ولا يفهمون."]]}, {"l": "2Ti 1:10", "n": "", "vs": [[10, "والتي أعلنت الآن بظهور مخلصنا يسوع المسيح الذي سحق الموت وأنار الحياة والخلود بالإنجيل"]]}], "kwAr": "ولكن كشف الآن لقديسيه", "noteAr": ""}], "arS": [["السر", ["G3466"]], [" الذي كان ", []], ["مكتوما", ["G613"]], [" طوال ", []], ["العصور", ["G165"]], [" ", []], ["والأجيال", ["G1074"]], ["، ولكن ", []], ["كشف", ["G5319"]], [" ", []], ["الآن", ["G3570"]], [" ", []], ["لقديسيه", ["G40"]], ["،", []]]}, {"c": 1, "v": 27, "text": "الذين أراد الله أن يعلن لهم كم هو غني مجد هذا السر بين الأمم: إنه المسيح فيكم، وهو رجاء المجد؛", "groups": [{"kw": "whom", "raw": "1Co_2:12-14; 2Co_2:14, 2Co_4:6; Gal_1:15, Gal_1:16", "note": "", "refs": [{"l": "1Co 2:12-14", "n": "", "vs": [[12, "وأما نحن فقد نلنا لا روح العالم بل الروح الذي من الله، لنعرف الأمور التي وهبت لنا من قبل الله."], [13, "ونحن نتكلم بهذه الأمور لا في كلام تعلمه الحكمة البشرية، بل في كلام يعلمه الروح القدس، معبرين عن الحقائق الروحية بوسائل روحية."], [14, "غير أن الإنسان البشري لا يتقبل أمور روح الله إذ يعتبرها جهالة، ولا يستطيع أن يعرفها لأن تمييزها إنما يحتاج إلى حس روحي."]]}, {"l": "2Co 2:14", "n": "", "vs": [[14, "ولكن، شكرا لله الذي يقودنا دائما في موكب النصر في المسيح، وينشر بنا رائحة معرفته في كل مكان."]]}, {"l": "2Co 4:6", "n": "", "vs": [[6, "فإن الله ، الذي أمر أن يشرق نور من الظلام، هو الذي جعل النور يشرق في قلوبنا، لإشعاع معرفة مجد الله المتجلي في وجه المسيح."]]}, {"l": "Gal 1:15", "n": "", "vs": [[15, "ولكن، لما سر الله ، الذي كان قد أفرزني وأنا في بطن أمي ثم دعاني بنعمته،"]]}, {"l": "Gal 1:16", "n": "", "vs": [[16, "أن يعلن ابنه في لأبشر به بين الأمم، في الحال لم أستشر لحما ودما،"]]}], "kwAr": "الذين أراد الله أن يعلن لهم", "noteAr": ""}, {"kw": "the riches", "raw": "Col_2:3; Rom_9:23, Rom_11:33; Eph_1:7, Eph_1:17, Eph_1:18, Eph_3:8-10,Eph_3:16; Phi_4:19", "note": "", "refs": [{"l": "Col 2:3", "n": "", "vs": [[3, "المخزونة فيه كنوز الحكمة والمعرفة كلها."]]}, {"l": "Rom 9:23", "n": "", "vs": [[23, "وذلك بقصد أن يعلن غنى مجده في أوعية الرحمة التي سبق فأعدها للمجد،"]]}, {"l": "Rom 11:33", "n": "", "vs": [[33, "فما أعمق غنى الله وحكمته وعلمه! ما أبعد أحكامه عن الفحص وطرقه عن التتبع !"]]}, {"l": "Eph 1:7", "n": "", "vs": [[7, "ففيه لنا بدمه الفداء، أي غفران الخطايا؛ بحسب غنى نعمته"]]}, {"l": "Eph 1:17", "n": "", "vs": [[17, "حتى يهبكم إله ربنا يسوع المسيح، أبو المجد، روح حكمة وإلهام: لتعرفوه معرفة كاملة"]]}, {"l": "Eph 1:18", "n": "", "vs": [[18, "إذ تستنير بصائر قلوبكم، فتعلموا ما في دعوته لكم من رجاء، وما هو غنى مجد ميراثه في القديسين،"]]}, {"l": "Eph 3:8-10", "n": "", "vs": [[8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"], [9, "وأنير الجميع بمعرفة ما هو تدبير السر الذي أبقاه الله ، خالق كل شيء، مكتوما مدى الأجيال."], [10, "والغاية أن يتجلى الآن أمام الرئاسات والسلطات في الأماكن السماوية ما يظهر في الكنيسة من حكمة الله المتعددة الوجوه،"]]}, {"l": "Eph 3:16", "n": "", "vs": [[16, "لكي يمنحكم، وفقا لغنى مجده، أن يمد الروح الكيان الداخلي في كل منكم بالقوة المؤيدة،"]]}, {"l": "Phi 4:19", "n": "", "vs": [[19, "وإن إلهي سيسد حاجاتكم كلها إلى التمام، وفقا لغناه في المجد، في المسيح يسوع."]]}], "kwAr": "غني مجد هذا السر", "noteAr": ""}, {"kw": "Christ", "raw": "Col_3:11; Luk_17:21; Joh_6:56, Joh_14:17, Joh_14:20,Joh_14:23, Joh_15:2-5, Joh_17:22, Joh_17:23, Joh_17:26; Rom_8:10; 1Co_3:16; 2Co_6:16; Gal_2:20, Gal_4:19; Eph_2:22, Eph_3:17; 1Jo_4:4; Rev_3:20", "note": "", "refs": [{"l": "Col 3:11", "n": "", "vs": [[11, "وفيه لا فرق بين يوناني ويهودي، أو مختون وغير مختون، أو متحضر ومتخلف، أو عبد وحر، بل المسيح هو الكل وفي الكل."]]}, {"l": "Luk 17:21", "n": "", "vs": [[21, "ولا يقال: ها هو هنا، أو: ها هو هناك! فها إن ملكوت الله في داخلكم!»"]]}, {"l": "Joh 6:56", "n": "", "vs": [[56, "وكل من يأكل جسدي ويشرب دمي، يثبت في وأنا فيه."]]}, {"l": "Joh 14:17", "n": "", "vs": [[17, "وهو روح الحق، الذي لا يقدر العالم أن يتقبله لأنه لا يراه ولا يعرفه، وأما أنتم فتعرفونه لأنه في وسطكم، وسيكون في داخلكم."]]}, {"l": "Joh 14:20", "n": "", "vs": [[20, "في ذلك اليوم تعلمون أني أنا في أبي، وأنتم في، وأنا فيكم."]]}, {"l": "Joh 14:23", "n": "", "vs": [[23, "أجابه يسوع: «من يحبني يعمل بكلمتي، ويحبه أبي، وإليه نأتي، وعنده نجعل لنا منزلا."]]}, {"l": "Joh 15:2-5", "n": "", "vs": [[2, "كل غصن في لا ينتج ثمرا يقطعه؛ وكل غصن ينتج ثمرا ينقيه لينتج مزيدا من الثمر."], [3, "أنتم الآن أنقياء بسبب الكلمة التي خاطبتكم بها."], [4, "فاثبتوا في وأنا فيكم. كما أن الغصن لا يقدر أن ينتج ثمرا إلا إذا ثبت في الكرمة؛ فكذلك أنتم، إلا إذا ثبتم في."], [5, "أنا الكرمة وأنتم الأغصان. من يثبت في وأنا فيه، فذاك ينتج ثمرا كثيرا. فإنكم بمعزل عني لا تقدرون أن تفعلوا شيئا."]]}, {"l": "Joh 17:22", "n": "", "vs": [[22, "إني أعطيتهم المجد الذي أعطيتني، ليكونوا واحدا كما نحن واحد."]]}, {"l": "Joh 17:23", "n": "", "vs": [[23, "أنا فيهم، وأنت في، ليكتملوا فيصيروا واحدا، حتى يعرف العالم أنك أرسلتني وأنك أحببتهم كما أحببتني."]]}, {"l": "Joh 17:26", "n": "", "vs": [[26, "وقد عرفتهم اسمك، وسأعرفهم أيضا، لتكون فيهم المحبة التي أحببتني بها، وأكون أنا فيهم»."]]}, {"l": "Rom 8:10", "n": "", "vs": [[10, "وإذا كان المسيح فيكم، فمع أن الجسد مائت بسبب الخطيئة، فإن الروح حياة لكم بسبب البر."]]}, {"l": "1Co 3:16", "n": "", "vs": [[16, "ألا تعرفون أنكم هيكل الله وأن روح الله ساكن فيكم؟"]]}, {"l": "2Co 6:16", "n": "", "vs": [[16, "وأي وفاق لهيكل الله مع الأصنام؟ فإننا نحن هيكل الله الحي، وفقا لما قاله الله : «سأسكن في وسطهم، وأسير بينهم، وأكون إلههم وهم يكونون شعبا لي…"]]}, {"l": "Gal 2:20", "n": "", "vs": [[20, "مع المسيح صلبت، وفيما بعد لا أحيا أنا بل المسيح يحيا في. أما الحياة التي أحياها الآن في الجسد، فإنما أحياها بالإيمان في ابن الله، الذي أحبني وبذل نفسه عني."]]}, {"l": "Gal 4:19", "n": "", "vs": [[19, "ياأطفالي الذين أتمخض بكم مرة أخرى إلى أن تتشكل فيكم صورة المسيح."]]}, {"l": "Eph 2:22", "n": "", "vs": [[22, "وفيه أنتم أيضا قد بنيتم معا فصرتم مسكنا لله بوجود الروح."]]}, {"l": "Eph 3:17", "n": "", "vs": [[17, "ليسكن المسيح في قلوبكم بالإيمان؛ حتى إذا تأصلتم وتأسستم في المحبة،"]]}, {"l": "1Jo 4:4", "n": "", "vs": [[4, "أيها الأولاد الصغار، أنتم من الله، وقد غلبتم الذين يقاومون المسيح: لأن الروح القدس الساكن فيكم أقوى من الروح الشرير المنتشر في العالم."]]}, {"l": "Rev 3:20", "n": "", "vs": [[20, "ها أنا واقف خارج الباب أقرعه. إن سمع أحد صوتي وفتح الباب، أدخل إليه فأتعشى معه وهو معي."]]}], "kwAr": "إنه المسيح", "noteAr": ""}, {"kw": "in you", "raw": "or, among you", "note": "or, among you", "refs": [], "kwAr": "فيكم", "noteAr": "أو: بينكم."}, {"kw": "the hope", "raw": "Col_1:5; Psa_16:9-11; Rom_5:2, Rom_8:18, Rom_8:19; 2Co_4:17; 1Ti_1:1; 1Pe_1:3, 1Pe_1:4", "note": "", "refs": [{"l": "Col 1:5", "n": "", "vs": [[5, "بسبب الرجاء المحفوظ لكم في السماوات، الرجاء الذي سمعتم به سابقا في كلمة الحق التي في الإنجيل"]]}, {"l": "Psa 16:9-11", "n": "", "vs": [[9, "لذلك فرح قلبي وتهلل لساني حتى إن جسدي سيرقد على رجاء،"], [10, "لأنك لن تترك نفسي في هوة الأموات ولن تدع وحيدك القدوس ينال منه الفساد."], [11, "هديتني سبل الحياة: فإن ملء البهجة في حضرتك، وفي يمينك مسرات أبدية."]]}, {"l": "Rom 5:2", "n": "", "vs": [[2, "وبه أيضا تم لنا الدخول بالإيمان إلى هذه النعمة التي نقيم فيها الآن؛ ونحن نفتخر برجائنا في التمتع بمجد الله."]]}, {"l": "Rom 8:18", "n": "", "vs": [[18, "فإني مقتنع بأن آلام الزمان الحاضر ليست شيئا إذا قيست بالمجد الآتي الذي سيعلن فينا."]]}, {"l": "Rom 8:19", "n": "", "vs": [[19, "ذلك أن الخليقة تترقب بلهفة أن يعلن أبناء الله،"]]}, {"l": "2Co 4:17", "n": "", "vs": [[17, "ذلك لأن ما يضايقنا الآن من صعوبات بسيطة عابرة، ينتج لنا بمقدار لا يحد وزنة أبدية من المجد،"]]}, {"l": "1Ti 1:1", "n": "", "vs": [[1, "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"]]}, {"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}, {"l": "1Pe 1:4", "n": "", "vs": [[4, "وإرثا لا يفنى ولا يفسد ولا يزول،"]]}], "kwAr": "رجاء المجد", "noteAr": ""}], "arS": [["الذين ", []], ["أراد", ["G2309"]], [" ", []], ["الله", ["G2316"]], [" أن ", []], ["يعلن", ["G1107"]], [" لهم كم هو ", []], ["غني", ["G4149"]], [" ", []], ["مجد", ["G1391"]], [" هذا ", []], ["السر", ["G3466"]], [" بين ", []], ["الأمم", ["G1484"]], [": إنه ", []], ["المسيح", ["G5547"]], [" فيكم، وهو ", []], ["رجاء", ["G1680"]], [" ", []], ["المجد", ["G1391"]], ["؛", []]]}, {"c": 1, "v": 28, "text": "هذا السر نعلنه نحن، واعظين كل إنسان، ومعلمين كل إنسان، في كل حكمة، لكي نحضر كل إنسان كاملا في المسيح.", "groups": [{"kw": "Whom", "raw": "Act_3:20, Act_5:42, Act_8:5, Act_8:35, Act_9:20, Act_10:36, Act_11:20, Act_13:38, Act_17:3, Act_17:18; Rom_16:25; 1Co_1:23, 1Co_15:12; 2Co_4:5, 2Co_10:14; Eph_3:8; Phi_1:15-18; 1Ti_3:16", "note": "", "refs": [{"l": "Act 3:20", "n": "", "vs": [[20, "وتأتيكم أيام الفرج من قبل الرب، إذ يرسل إليكم يسوع المسيح ثانية، الذي سبق أن عينه لكم،"]]}, {"l": "Act 5:42", "n": "", "vs": [[42, "وكانوا كل يوم، في الهيكل وفي البيوت، يعلمون ويبشرون بالمسيح يسوع بلا انقطاع."]]}, {"l": "Act 8:5", "n": "", "vs": [[5, "فذهب فيلبس إلى مدينة في منطقة السامرة، وأخذ يبشر أهلها بالمسيح."]]}, {"l": "Act 8:35", "n": "", "vs": [[35, "فتكلم وأخذ يبشره بيسوع انطلاقا من كتاب النبي هذا."]]}, {"l": "Act 9:20", "n": "", "vs": [[20, "وفي الحال بدأ يبشر في المجامع بأن يسوع هو ابن الله."]]}, {"l": "Act 10:36", "n": "", "vs": [[36, "وقد أرسل كلمته إلى بني إسرائيل، وبشرهم بالسلام بواسطة يسوع المسيح، رب الجميع."]]}, {"l": "Act 11:20", "n": "", "vs": [[20, "غير أن بعضا منهم، وهم أصلا من قبرص والقيروان، وصلوا أنطاكية، وأخذوا يبشرون اليونانيين أيضا بالرب يسوع."]]}, {"l": "Act 13:38", "n": "", "vs": [[38, "فاعلموا، أيها الإخوة، أنه بيسوع تبشرون بغفران الخطايا ،"]]}, {"l": "Act 17:3", "n": "", "vs": [[3, "وشرح لهم مبينا أن المسيح كان لابد أن يتألم ويقوم من بين الأموات، وأن «المسيح الذي تنتظرونه هو يسوع الذي أبشركم به الآن!»"]]}, {"l": "Act 17:18", "n": "", "vs": [[18, "وجرت مناقشة بينه وبين بعض الفلاسفة الأبيقوريين والرواقيين. ولما وجدوا أنه يبشر بيسوع والقيامة من الموت قال بعضهم: «ماذا يعني هذا المدعي الأحمق بكلامه؟» وقال آخرون: «يبدو أنه ينادي بآلهة غريبة»."]]}, {"l": "Rom 16:25", "n": "", "vs": [[25, "والمجد للقادر أن يثبتكم، وفقا لإنجيلي وللبشارة بيسوع المسيح، ووفقا لإعلان ما كان سرا ظل مكتوما مدى الأزمنة الأزلية،"]]}, {"l": "1Co 1:23", "n": "", "vs": [[23, "ولكننا نحن نبشر بالمسيح مصلوبا، مما يشكل عائقا عند اليهود وجهالة عند الأمم؛"]]}, {"l": "1Co 15:12", "n": "", "vs": [[12, "والآن، مادام يبشر بأن المسيح قام من بين الأموات، فكيف يقول بعضكم إنه لا قيامة للأموات؟"]]}, {"l": "2Co 4:5", "n": "", "vs": [[5, "فإننا لا نبشر بأنفسنا، بل بالمسيح يسوع ربا، وما نحن إلا عبيد لكم من أجل يسوع."]]}, {"l": "2Co 10:14", "n": "", "vs": [[14, "فإننا لسنا نتعدى حدودنا وكأننا لم نصل إليكم، إذ قد وصلنا إليكم فعلا بإنجيل المسيح؛"]]}, {"l": "Eph 3:8", "n": "", "vs": [[8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "Phi 1:15-18", "n": "", "vs": [[15, "حقا أن بعضهم يبشرون بالمسيح عن حسد ونزاع؛ وأما الآخرون فعن حسن نية."], [16, "فهؤلاء تدفعهم المحبة، عالمين أني قد عينت للدفاع عن الإنجيل؛"], [17, "وأولئك يدفعهم التحزب، فينادون بالمسيح بغير إخلاص، ظنا منهم أنهم يثيرون علي الضيق إضافة إلى القيود."], [18, "فماذا إذن؟ مهما يكن، وفي أي حال، فإن المسيح ينادى به، سواء أكان بذريعة أم بحق. وبهذا أنا أفرح وسأفرح بعد!"]]}, {"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}], "kwAr": "هذا السر نعلنه نحن", "noteAr": ""}, {"kw": "warning", "raw": "Jer_6:10; Eze_3:17-21, Eze_33:4-9; Mat_3:7; Act_20:27, Act_20:28, Act_20:31; 1Co_4:14; 1Th_4:6, 1Th_5:12-14", "note": "", "refs": [{"l": "Jer 6:10", "n": "", "vs": [[10, "لمن أتحدث وأنذر حتى يسمعوا؟ انظر! إن آذانهم صماء فلا يسمعون، وكلمة الرب مثار خزي لهم فلا يسرون بها»."]]}, {"l": "Eze 3:17-21", "n": "", "vs": [[17, "«ياابن آدم، قد جعلتك رقيبا لشعب إسرائيل، فأصغ إلى كلمتي وأنذرهم بها على لساني."], [18, "فإذا قلت للشرير: أنت لابد مائت، وأنت لم تنذره ولم تحذره ليرجع عن طرقه الأثيمة فيحيا، فإن ذلك الشرير يموت بذنبه، أما دمه فمن يدك أطلبه."], [19, "لكن إن أنذرت الشرير ولم يرجع عن شره وعن طرقه الأثيمة، فإنه يموت بذنبه، وتنجو أنت بنفسك."], [20, "وكذلك إن حاد البار عن بره وارتكب الإثم، ونصبت أمامه معثرة، فإنه يموت. ولأنك لم تنذره فإنه يموت بذنبه ولا تذكر بعد أعماله الصالحة التي قام بها، أما دمه فمن يدك أطلبه."], [21, "أما إن كنت قد أنذرت البار حتى لا يخطيء، ولم يخطيء، فإنه حتما يحيا لأنه قبل الإنذار، وتنجو أنت بنفسك»."]]}, {"l": "Eze 33:4-9", "n": "", "vs": [[4, "فمن يسمع دوي البوق ولا يحترس، ثم أتى السيف وقتله، فدمه يقع على رأسه."], [5, "لأنه سمع دوي البوق ولم يحترس. لهذا يكون دمه على نفسه، إذ لو احترس لأنقذ نفسه."], [6, "ولكن إن رأى الرقيب العدو مقبلا ولم ينفخ بالبوق، فلم يحترس الشعب، فأقدم العدو وقتل نفسا منهم، فالقتيل قد لاقى حتفه جزاء ذنبه، أما دمه فمن يد الرقيب أطلبه."], [7, "وأنت ياابن آدم، قد أقمتك رقيبا لشعب إسرائيل، فتسمع قضائي، وتحذرهم من قبلي."], [8, "إن قلت للشرير: ياشر ير إنك حتما تموت من أجل شرك، ولم تعمد إلى تحذيره من طريقه، فإن ذلك الشرير يموت بذنبه، أما دمه فمن يدك أطلبه."], [9, "ولكن إن حذرت الشرير ليرتدع عن طريقه فأبى فهو يموت بذنبه، أما أنت فتكون قد خلصت نفسك."]]}, {"l": "Mat 3:7", "n": "", "vs": [[7, "ولما رأى يوحنا كثيرين من الفر يسيين والصدوقيين يأتون إليه ليتعمدوا، قال لهم: «ياأولاد الأفاعي، من أنذركم لتهربوا من الغضب الآتي؟"]]}, {"l": "Act 20:27", "n": "", "vs": [[27, "لأني لم أمتنع عن إبلاغكم جميع مقاصد الله."]]}, {"l": "Act 20:28", "n": "", "vs": [[28, "فاسهروا إذن على أنفسكم وعلى جميع القطيع الذي عينكم بينه الروح القدس نظارا، لترعوا كنيسة الله التي اشتراها بدمه."]]}, {"l": "Act 20:31", "n": "", "vs": [[31, "لذلك كونوا متيقظين، وتذكروا أني، مدة ثلاث سنين، لم أتوقف ليلا ونهارا عن نصح كل واحد منكم وأنا أذرف الدموع."]]}, {"l": "1Co 4:14", "n": "", "vs": [[14, "لا أكتب هذا تخجيلا لكم، بل أنبهكم باعتباركم أولادي الأحباء."]]}, {"l": "1Th 4:6", "n": "", "vs": [[6, "وألا يتعدى حقوق أخيه ويسيء إليه في هذا الأمر، لأن الرب هو المنتقم لجميع هذه الإساءات، كما أنذرناكم قبلا وشهدنا لكم بحق."]]}, {"l": "1Th 5:12-14", "n": "", "vs": [[12, "على أننا نرجو منكم، أيها الإخوة، أن تميزوا أولئك الذين يجتهدون بينكم، ويرعونكم كما يريد الرب، ويعظونكم،"], [13, "وأن تقدروهم تقديرا فائقا في المحبة، من أجل عملهم. عيشوا بسلام بعضكم مع بعض."], [14, "إلا أننا نناشدكم، أيها الإخوة، أن تعظوا الفوضويين، وتشددوا فاقدي العزم، وتساندوا الضعفاء، وتعاملوا الجميع بطول البال."]]}], "kwAr": "واعظين كل إنسان", "noteAr": ""}, {"kw": "teaching", "raw": "Deu_4:5; Eze_7:10; Ecc_12:9; Mat_28:20; Mar_6:34; Eph_4:11; 1Ti_3:2; 2Ti_2:24, 2Ti_2:25", "note": "", "refs": [{"l": "Deu 4:5", "n": "", "vs": [[5, "انظروا، ها أنا قد علمتكم شرائع وأحكاما كما أمرني الرب إلهي لتعملوا بموجبها في الأرض التي أنتم ماضون إليها لترثوها."]]}, {"l": "Eze 7:10", "n": "", "vs": [[10, "ها هو اليوم قد أقبل! قد أزف القضاء وأزهر الظلم وأفرخت الكبرياء"]]}, {"l": "Ecc 12:9", "n": "", "vs": [[9, "وفضلا عن كون الجامعة حكيما، فإنه علم الناس المعرفة أيضا، وقوم وبحث ونظم أمثالا كثيرة."]]}, {"l": "Mat 28:20", "n": "", "vs": [[20, "وعلموهم أن يعملوا بكل ما أوصيتكم به. وها أنا معكم كل الأيام إلى انتهاء الزمان! »."]]}, {"l": "Mar 6:34", "n": "", "vs": [[34, "فلما نزل يسوع من القارب، رأى الجمع الكثير وتحنن عليهم، لأنهم كانوا كغنم لا راعي لها. فأخذ يعلمهم أمورا كثيرة."]]}, {"l": "Eph 4:11", "n": "", "vs": [[11, "وهو قد وهب البعض أن يكونوا رسلا، والبعض أنبياء، والبعض مبشرين والبعض رعاة ومعلمين،"]]}, {"l": "1Ti 3:2", "n": "", "vs": [[2, "إذن، يجب أن يكون الراعي بلا عيب، زوجا لامرأة واحدة، نبيها عاقلا مهذبا مضيافا، قادرا على التعليم؛"]]}, {"l": "2Ti 2:24", "n": "", "vs": [[24, "وعبد الرب يجب ألا يتشاجر، بل أن يكون مترفقا تجاه الجميع، قادرا على التعليم، يتحمل المشقات بصبر،"]]}, {"l": "2Ti 2:25", "n": "", "vs": [[25, "ويؤدب بالوداعة مقاومي الإيمان، عسى أن يمنحهم الله التوبة، فيعرفوا الحق بالتمام،"]]}], "kwAr": "ومعلمين كل إنسان", "noteAr": ""}, {"kw": "in all", "raw": "Pro_8:5; Jer_3:15; Luk_21:15; 1Co_2:6, 1Co_2:15, 1Co_12:8; 2Pe_3:15", "note": "", "refs": [{"l": "Pro 8:5", "n": "", "vs": [[5, "أيها الحمقى، تعلموا الفطنة، وأيها الأغبياء اكتسبوا فهما."]]}, {"l": "Jer 3:15", "n": "", "vs": [[15, "وأقيم عليكم رعاة يحظون برضى قلبي، فيرعونكم بالمعرفة والفطنة."]]}, {"l": "Luk 21:15", "n": "", "vs": [[15, "لأني سوف أعطيكم كلاما وحكمة لا يقدر جميع مقاوميكم أن يردوها أو يناقضوها."]]}, {"l": "1Co 2:6", "n": "", "vs": [[6, "على أن لنا حكمة نتكلم بها بين البالغين. ولكنها حكمة ليست من هذا العالم ولا من رؤساء هذا العالم الزائلين."]]}, {"l": "1Co 2:15", "n": "", "vs": [[15, "أما الإنسان الروحي، فهو يميز كل شيء، ولا يحكم فيه من أحد."]]}, {"l": "1Co 12:8", "n": "", "vs": [[8, "فواحد يوهب، عن طريق الروح، كلام الحكمة، وآخر كلام المعرفة وفقا للروح نفسه،"]]}, {"l": "2Pe 3:15", "n": "", "vs": [[15, "وتأكدوا أن تأني ربنا في رجوعه، هو فرصة للخلاص."]]}], "kwAr": "في كل حكمة", "noteAr": ""}, {"kw": "we may", "raw": "Col_1:22; 2Co_11:2; Eph_5:27", "note": "", "refs": [{"l": "Col 1:22", "n": "", "vs": [[22, "قد صالحكم الآن في جسد بشرية (ابنه) بالموت. وذلك لكي يحضركم فتمثلوا أمامه وأنتم قديسون بلا ذنب ولا لوم."]]}, {"l": "2Co 11:2", "n": "", "vs": [[2, "فإني أغار عليكم غيرة من عند الله لأني خطبتكم لرجل واحد هو المسيح، لأقدمكم إليه عذراء عفيفة."]]}, {"l": "Eph 5:27", "n": "", "vs": [[27, "حتى يزفها إلى نفسه كنيسة بهية لا يشوبها عيب أو تجعد أو أية نقيصة مشابهة بل تكون مقدسة خالية من العيوب."]]}], "kwAr": "لكي نحضر", "noteAr": ""}, {"kw": "perfect", "raw": "Col_2:10; 1Co_1:30; Eph_4:12, Eph_4:13; Heb_10:14, Heb_13:21", "note": "", "refs": [{"l": "Col 2:10", "n": "", "vs": [[10, "وأنتم مكملون فيه. فهو رأس كل رئاسة وسلطة؛"]]}, {"l": "1Co 1:30", "n": "", "vs": [[30, "وبفضل الله صار لكم مقام في المسيح يسوع الذي جعل لنا حكمة من الله وبرا وقداسة وفداء،"]]}, {"l": "Eph 4:12", "n": "", "vs": [[12, "لتأهيل القديسين من جهة عمل الخدمة، لبنيان جسد المسيح،"]]}, {"l": "Eph 4:13", "n": "", "vs": [[13, "حتى نصل جميعا إلى وحدة الإيمان ووحدة المعرفة لابن الله، إلى إنسان تام البلوغ، إلى مقدار قامة ملء المسيح."]]}, {"l": "Heb 10:14", "n": "", "vs": [[14, "إذ إنه، بتقدمة وحيدة جعل أولئك الذين قدسهم كاملين إلى الأبد."]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}], "kwAr": "كل إنسان كاملا في المسيح", "noteAr": ""}], "arS": [["هذا السر ", []], ["نعلنه", ["G2605"]], [" نحن، ", []], ["واعظين", ["G3560"]], [" ", []], ["كل", ["G3956"]], [" ", []], ["إنسان", ["G444"]], ["، ", []], ["ومعلمين", ["G1321"]], [" كل ", []], ["إنسان", ["G444"]], ["، في كل ", []], ["حكمة", ["G4678"]], ["، لكي ", []], ["نحضر", ["G3936"]], [" كل ", []], ["إنسان", ["G444"]], [" ", []], ["كاملا", ["G5046"]], [" في ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 1, "v": 29, "text": "ولأجل هذا أتعب أنا أيضا وأجاهد، بفضل قدرته العاملة في بقوة.", "groups": [{"kw": "labour", "raw": "Col_4:12; 1Co_15:10; 2Co_5:9, 2Co_6:5, 2Co_11:23; Phi_2:16; 1Th_2:9; 2Th_3:8; 2Ti_2:10; Rev_2:3", "note": "", "refs": [{"l": "Col 4:12", "n": "", "vs": [[12, "يسلم عليكم أبفراس الذي هو منكم، وهو عبد للمسيح يسوع، يجاهد كل حين لأجلكم في الصلوات لتثبتوا كاملين ولكم تمام اليقين من جهة مشيئة الله كلها."]]}, {"l": "1Co 15:10", "n": "", "vs": [[10, "ولكن، بنعمة الله صرت على ما أنا عليه الآن، ونعمته الموهوبة لي لم تكن عبثا، إذ عملت جاهدا أكثر من الرسل الآخرين جميعا. إلا أني لم أكن أنا العامل، بل نعمة الله التي كانت معي."]]}, {"l": "2Co 5:9", "n": "", "vs": [[9, "ولذلك أيضا نحرص أن نرضيه، سواء أكنا مقيمين أم مغتربين."]]}, {"l": "2Co 6:5", "n": "", "vs": [[5, "والسجون والاضطرابات والأتعاب والسهر والصوم؛"]]}, {"l": "2Co 11:23", "n": "", "vs": [[23, "وإن كانوا خدام المسيح، أتكلم كأني فقدت صوابي، فأنا متفوق عليهم: في الأتعاب أوفر منهم جدا، في الجلدات فوق الحد، في السجون أوفر جدا، في التعرض للموت أكثر مرارا."]]}, {"l": "Phi 2:16", "n": "", "vs": [[16, "حاملين كلمة الحياة، لتكونوا في يوم المسيح موضع فخر بأني ما سعيت باطلا ولا اجتهدت عبثا."]]}, {"l": "1Th 2:9", "n": "", "vs": [[9, "فأنتم تذكرون، أيها الإخوة، جهدنا وكدنا، إذ بشرناكم بإنجيل الله ونحن نشتغل ليلا ونهارا لكي لا نكون عبئا ثقيلا على أحد منكم."]]}, {"l": "2Th 3:8", "n": "", "vs": [[8, "ولا أكلنا الخبز من عند أحد مجانا، بل كنا نشتغل بتعب وكد ليل نهار، لكي لا نكون عبئا ثقيلا على أي واحد منكم."]]}, {"l": "2Ti 2:10", "n": "", "vs": [[10, "لهذا السبب أحتمل كل شيء بصبر لأجل الذين اختارهم الله ، لكي يحصلوا، هم أيضا، على الخلاص الذي في المسيح يسوع مع المجد الأبدي."]]}, {"l": "Rev 2:3", "n": "", "vs": [[3, "وقد تألمت من أجل اسمي بصبر وبغير كلل."]]}], "kwAr": "أتعب أنا أيضا", "noteAr": ""}, {"kw": "striving", "raw": "Col_2:1; Luk_13:24; Rom_15:20,Rom_15:30; 1Co_9:25-27; Phi_1:27, Phi_1:30; Heb_12:4", "note": "", "refs": [{"l": "Col 2:1", "n": "", "vs": [[1, "فإني أريد أن تعلموا مقدار جهادي لأجلكم ولأجل الذين في مدينة لاودكية، ولأجل جميع الذين لا يعرفونني بالوجه،"]]}, {"l": "Luk 13:24", "n": "", "vs": [[24, "«ابذلوا الجهد للدخول من الباب الضيق، فإني أقول لكم إن كثيرين سيسعون إلى الدخول، فلا يتمكنون."]]}, {"l": "Rom 15:20", "n": "", "vs": [[20, "وكنت حريصا على التبشير حيث لم يكن قد عرف اسم المسيح، لكي لا أبني على أساس وضعه غيري،"]]}, {"l": "Rom 15:30", "n": "", "vs": [[30, "فأتوسل إليكم، أيها الإخوة، بربنا يسوع المسيح وبمحبة الروح، أن تجاهدوا معي في الصلوات إلى الله من أجلي،"]]}, {"l": "1Co 9:25-27", "n": "", "vs": [[25, "وكل متبار يفرض على نفسه تدريبا صارما في شتى المجالات. فهؤلاء المتبارون يفعلون ذلك ليفوزوا بإكليل فان، وأما نحن فلنفوز بإكليل غير فان."], [26, "إذن، أنا أركض هكذا، لا كمن لا هدف له، وهكذا ألاكم أيضا، لا كمن يلطم الهواء،"], [27, "بل أسدد اللكمات إلى جسدي وأسوقه أسيرا، مخافة أن يتبين أني غير مؤهل (للمجازاة) بعدما دعوت الآخرين إليها!"]]}, {"l": "Phi 1:27", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"]]}, {"l": "Phi 1:30", "n": "", "vs": [[30, "مجاهدين الجهاد عينه الذي رأيتموه في والذي تسمعون الآن أنه في."]]}, {"l": "Heb 12:4", "n": "", "vs": [[4, "لم تقاوموا بعد حتى بذل الدم في مجاهدتكم ضد الخطيئة."]]}], "kwAr": "وأجاهد", "noteAr": ""}, {"kw": "his", "raw": "1Co_12:6, 1Co_12:11; Eph_1:19, Eph_3:7, Eph_3:20; Phi_2:13; Heb_13:21", "note": "", "refs": [{"l": "1Co 12:6", "n": "", "vs": [[6, "وهناك أيضا أعمال مختلفة، ولكن الله واحد، وهو يعمل كل شيء في الجميع."]]}, {"l": "1Co 12:11", "n": "", "vs": [[11, "ولكن هذا كله يشغله الروح الواحد نفسه، موزعا المواهب، كما يشاء، على كل واحد."]]}, {"l": "Eph 1:19", "n": "", "vs": [[19, "وما هي عظمة قدرته الفائقة المعلنة لنا نحن المؤمنين، بحسب عمل اقتدار قوته"]]}, {"l": "Eph 3:7", "n": "", "vs": [[7, "الذي صرت أنا خادما له بحسب نعمة الله الموهوبة لي وفقا لعمل قدرته."]]}, {"l": "Eph 3:20", "n": "", "vs": [[20, "والقادر أن يفعل، وفقا للقدرة العاملة فينا، ما يفوق بلا حصر كل ما نطلب أو نتصور،"]]}, {"l": "Phi 2:13", "n": "", "vs": [[13, "لأن الله هو الذي ينشيء فيكم الإرادة والعمل لأجل مرضاته."]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}], "kwAr": "قدرته العاملة في", "noteAr": ""}, {"kw": "mightily", "raw": "2Co_12:9, 2Co_12:10, 2Co_13:3", "note": "", "refs": [{"l": "2Co 12:9", "n": "", "vs": [[9, "فقال لي: «نعمتي تكفيك، لأن قدرتي تكمل في الضعف!» فأنا أرضى بأن أفتخر مسرورا بالضعفات التي في، لكي تخيم علي قدرة المسيح."]]}, {"l": "2Co 12:10", "n": "", "vs": [[10, "فلأجل المسيح، تسرني الضعفات والإهانات والضيقات والاضطهادات والصعوبات، لأني حينما أكون ضعيفا، فحينئذ أكون قويا!"]]}, {"l": "2Co 13:3", "n": "", "vs": [[3, "مادمتم تطلبون برهانا على أن المسيح يتكلم في. وهو ليس ضعيفا تجاهكم، بل قوي في ما بينكم."]]}], "kwAr": "بقوة", "noteAr": ""}], "arS": [["ولأجل هذا ", []], ["أتعب", ["G2872"]], [" أنا أيضا ", []], ["وأجاهد", ["G75"]], ["، بفضل ", []], ["قدرته", ["G1753"]], [" ", []], ["العاملة", ["G1754"]], [" في ", []], ["بقوة", ["G1722", "G1411"]], [".", []]]}, {"c": 2, "v": 1, "text": "فإني أريد أن تعلموا مقدار جهادي لأجلكم ولأجل الذين في مدينة لاودكية، ولأجل جميع الذين لا يعرفونني بالوجه،", "groups": [{"kw": "what", "raw": "Col_1:24, Col_1:29, Col_4:12; Gen_30:8, Gen_32:24-30; Hos_12:3, Hos_12:4; Luk_22:44; Gal_4:19; Phi_1:30; 1Th_2:2; Heb_5:7", "note": "", "refs": [{"l": "Col 1:24", "n": "", "vs": [[24, "والآن أنا أفرح في الآلام التي أقاسيها لأجلكم، وأتمم في جسدي ما نقص من ضيقات المسيح لأجل جسده الذي هو الكنيسة،"]]}, {"l": "Col 1:29", "n": "", "vs": [[29, "ولأجل هذا أتعب أنا أيضا وأجاهد، بفضل قدرته العاملة في بقوة."]]}, {"l": "Col 4:12", "n": "", "vs": [[12, "يسلم عليكم أبفراس الذي هو منكم، وهو عبد للمسيح يسوع، يجاهد كل حين لأجلكم في الصلوات لتثبتوا كاملين ولكم تمام اليقين من جهة مشيئة الله كلها."]]}, {"l": "Gen 30:8", "n": "", "vs": [[8, "فقالت راحيل: «قد تصارعت مع أختي مصارعات عنيفة وظفرت». ودعته نفتالي (ومعناه: مصارعتي("]]}, {"l": "Gen 32:24-30", "n": "", "vs": [[24, "وبقي وحده، صارعه إنسان حتى مطلع الفجر."], [25, "وعندما رأى أنه لم يتغلب على يعقوب، ضربه على حق فخذه، فانخلع مفصل فخذ يعقوب في مصارعته معه."], [26, "وقال له: «أطلقني، فقد طلع الفجر». فأجابه يعقوب: «لا أطلقك حتى تباركني»."], [27, "فسأله: «ما اسمك؟» فأجاب: «يعقوب»."], [28, "فقال: «لا يدعى اسمك في ما بعد يعقوب، بل إسرائيل (ومعناه: يجاهد مع الله)، لأنك جاهدت مع الله والناس وقدرت»."], [29, "فسأله يعقوب: «أخبرني ما اسمك؟» فقال: «لماذا تسأل عن اسمي؟» وباركه هناك."], [30, "ودعا يعقوب اسم المكان فنيئيل (ومعناه: وجه الله) إذ قال: «لأني شاهدت الله وجها لوجه وبقيت حيا»."]]}, {"l": "Hos 12:3", "n": "", "vs": [[3, "(لكم طمع يعقوب في بركة الرب)، فقبض وهو ما برح في الرحم على عقب أخيه، وفي رجولته جاهد مع الله."]]}, {"l": "Hos 12:4", "n": "", "vs": [[4, "تصارع مع الملاك وغلب. بكى والتمس رضاه وبركته، التقاه الله في بيت إيل فخاطبه هناك."]]}, {"l": "Luk 22:44", "n": "", "vs": [[44, "وإذ كان في صراع، أخذ يصلي بأشد إلحاح؛ حتى إن عرقه صار كقطرات دم نازلة على الأرض."]]}, {"l": "Gal 4:19", "n": "", "vs": [[19, "ياأطفالي الذين أتمخض بكم مرة أخرى إلى أن تتشكل فيكم صورة المسيح."]]}, {"l": "Phi 1:30", "n": "", "vs": [[30, "مجاهدين الجهاد عينه الذي رأيتموه في والذي تسمعون الآن أنه في."]]}, {"l": "1Th 2:2", "n": "", "vs": [[2, "فمع أننا كنا قد قاسينا الألم والإهانة في مدينة فيلبي، كما تعلمون، فقد تجرأنا في إلهنا أن نكلمكم بإنجيل الله مجاهدين في وجه المعارضة الشديدة."]]}, {"l": "Heb 5:7", "n": "", "vs": [[7, "والمسيح، في أثناء حياته البشرية على الأرض، رفع أدعية وتضرعات مقترنة بصراخ شديد ودموع، إلى القادر أن يخلصه من الموت. وقد لبى الله طلبه إكراما لتقواه."]]}], "kwAr": "مقدار", "noteAr": ""}, {"kw": "conflict", "raw": "or, fear, or, care", "note": "or, fear, or, care", "refs": [], "kwAr": "جهادي لأجلكم", "noteAr": "أو: خوف، أو: همّ."}, {"kw": "at", "raw": "Col_4:13, Col_4:15, Col_4:16; Rev_1:11, Rev_3:14-22", "note": "", "refs": [{"l": "Col 4:13", "n": "", "vs": [[13, "فإني أشهد له بأنه يجتهد كثيرا لأجلكم ولأجل الذين في مدينة لاودكية والذين في مدينة هيرابوليس."]]}, {"l": "Col 4:15", "n": "", "vs": [[15, "سلموا على الإخوة الذين في لاودكية، وعلى نمفاس، وعلى الكنيسة التي في بيته."]]}, {"l": "Col 4:16", "n": "", "vs": [[16, "وبعد أن تقرأ هذه الرسالة عليكم، ابعثوا بها لتقرأ على كنيسة مؤمني لاودكية، وخذوا الرسالة التي عندهم لتقرأوها أنتم أيضا."]]}, {"l": "Rev 1:11", "n": "", "vs": [[11, "يقول: «دون ما تراه في كتاب، وابعث به إلى الكنائس السبع: في أفسس، وسميرنا، وبرغامس، وثياتيرا، وساردس، وفيلادلفيا، ولاودكية»."]]}, {"l": "Rev 3:14-22", "n": "", "vs": [[14, "واكتب إلى ملاك الكنيسة في لاودكية: إليك ما يقوله الحق، الشاهد الأمين الصادق، رئيس خليقة الله:"], [15, "إني عالم بأعمالك، وأعلم أنك لست باردا ولا حارا. وليتك كنت باردا أو حارا!"], [16, "فبما أنك فاتر، لا حار ولا بارد، سألفظك من فمي!"], [17, "تقول: أنا غني، قد اغتنيت ولا يعوزني شيء! ولكنك لا تعلم أنك شقي بائس فقير أعمى عريا ن."], [18, "نصيحتي لك أن تشتري مني ذهبا نقيا، صفته النار، فتغتني حقا، وثيابا بيضاء ترتديها فتستر عريك المعيب، وكحلا لشفاء عينيك فيعود إليك البصر."], [19, "إني أوبخ وأؤدب من أحبه، لذا كن حارا وتب!"], [20, "ها أنا واقف خارج الباب أقرعه. إن سمع أحد صوتي وفتح الباب، أدخل إليه فأتعشى معه وهو معي."], [21, "وكل من ينتصر سأجلسه معي على عرشي، كما انتصرت أنا أيضا فجلست مع أبي على عرشه؛"], [22, "من له أذن فليسمع ما يقوله الروح للكنائس!»"]]}], "kwAr": "مدينة لاودكية", "noteAr": ""}, {"kw": "not", "raw": "Col_2:5; Act_20:25, Act_20:38; 1Pe_1:8", "note": "", "refs": [{"l": "Col 2:5", "n": "", "vs": [[5, "فمع أني في الجسد غائب، إلا أني في الروح حاضر معكم، أفرح إذ أشاهد ترتيبكم وثباتكم في الإيمان بالمسيح."]]}, {"l": "Act 20:25", "n": "", "vs": [[25, "وأنا أعلم أنكم لن تروا وجهي بعد اليوم، أنتم الذين تجولت بينكم جميعا مبشرا بملكوت الله."]]}, {"l": "Act 20:38", "n": "", "vs": [[38, "وقد حزنوا كثيرا، خاصة لأنه قال لهم إنهم لن يروا وجهه مرة أخرى. ثم رافقوه إلى السفينة مودعين."]]}, {"l": "1Pe 1:8", "n": "", "vs": [[8, "أنتم لم تروا المسيح، ولكنكم تحبونه. ومع أنكم لا ترونه الآن، فأنتم تؤمنون به وتبتهجون بفرح مجيد يفوق الوصف."]]}], "kwAr": "الذين لا يعرفونني بالوجه", "noteAr": ""}], "arS": [["فإني ", []], ["أريد", ["G2309"]], [" أن ", []], ["تعلموا", ["G1492"]], [" ", []], ["مقدار", ["G2245"]], [" ", []], ["جهادي", ["G73"]], [" لأجلكم ولأجل الذين في مدينة ", []], ["لاودكية", ["G2993"]], ["، ولأجل ", []], ["جميع", ["G3745"]], [" الذين لا يعرفونني ", []], ["بالوجه", ["G4383"]], ["،", []]]}, {"c": 2, "v": 2, "text": "بغرض أن تتشجع قلوبهم وتكون كلها متحدة في المحبة، لبلوغ الإدراك التام بكل غناه، لمعرفة سر الله، أي المسيح،", "groups": [{"kw": "their", "raw": "Col_4:8; Isa_40:1; Rom_15:13; 2Co_1:4-6; 1Th_3:2, 1Th_5:14; 2Th_2:16, 2Th_2:17", "note": "", "refs": [{"l": "Col 4:8", "n": "", "vs": [[8, "فإياه قد أرسلت إليكم لهذا الغرض عينه، لتعرفوا أحوالنا ويشجع قلوبكم،"]]}, {"l": "Isa 40:1", "n": "", "vs": [[1, "يقول إلهكم: «واسوا، واسوا شعبي!"]]}, {"l": "Rom 15:13", "n": "", "vs": [[13, "فليملأكم إله الرجاء كل فرح وسلام في إيمانكم حتى تزدادوا رجاء بقوة الروح القدس."]]}, {"l": "2Co 1:4-6", "n": "", "vs": [[4, "هو الذي يشجعنا في كل ضيقة نمر بها، حتى نستطيع أن نشجع الذين يمرون بأية ضيقة، بالتشجيع الذي به يشجعنا الله ."], [5, "فكما فاضت علينا آلام المسيح، يفيض علينا أيضا التشجيع بالمسيح."], [6, "فإن كنا في ضيقة، فذلك لأجل تشجيعكم وخلاصكم؛ وإن كنا متشجعين، فذلك لأجل تشجيعكم، مما يعمل فيكم على احتمال نفس الآلام التي نتألم بها نحن أيضا."]]}, {"l": "1Th 3:2", "n": "", "vs": [[2, "فبعثنا تيموثاوس، أخانا ومعاوننا في خدمة الله بنشر الإنجيل، لكي يشددكم ويشجعكم في إيمانكم،"]]}, {"l": "1Th 5:14", "n": "", "vs": [[14, "إلا أننا نناشدكم، أيها الإخوة، أن تعظوا الفوضويين، وتشددوا فاقدي العزم، وتساندوا الضعفاء، وتعاملوا الجميع بطول البال."]]}, {"l": "2Th 2:16", "n": "", "vs": [[16, "وليت ربنا يسوع المسيح نفسه، والله أبانا، الذي أحبنا ووهبنا بنعمته راحة أبدية ورجاء صالحا،"]]}, {"l": "2Th 2:17", "n": "", "vs": [[17, "يشجع قلوبكم ويرسخكم في كل عمل صالح وقول حسن!"]]}], "kwAr": "أن تتشجع قلوبهم", "noteAr": ""}, {"kw": "being", "raw": "Col_3:14; Psa_133:1; Joh_17:21; Act_4:32; Gal_3:28; Phi_2:1; 1Jo_4:12, 1Jo_4:13", "note": "", "refs": [{"l": "Col 3:14", "n": "", "vs": [[14, "وفوق هذا كله البسوا المحبة، فهي رابطة الكمال."]]}, {"l": "Psa 133:1", "n": "", "vs": [[1, "ما أحسن وما أبهج أن يسكن الإخوة معا (بوئام)."]]}, {"l": "Joh 17:21", "n": "", "vs": [[21, "ليكون الجميع واحدا؛ أيها الآب، كما أنك أنت في وأنا فيك، ليكونوا هم أيضا واحدا فينا، لكي يؤمن العالم أنك أنت أرسلتني."]]}, {"l": "Act 4:32", "n": "", "vs": [[32, "وكانت جماعة المؤمنين قلبا واحدا ونفسا واحدة، ولم يكن أحد يقول إن شيئا مما عنده هو له وحده، بل كان كل شيء عندهم مشتركا."]]}, {"l": "Gal 3:28", "n": "", "vs": [[28, "لا فرق بعد الآن بين يهودي ويوناني، أو عبد وحر، أو ذكر وأنثى، لأنكم جميعا واحد في المسيح يسوع."]]}, {"l": "Phi 2:1", "n": "", "vs": [[1, "فما دام لنا التشجيع في المسيح، والتعزية في المحبة، والشركة في الروح، ولنا المراحم والحنو،"]]}, {"l": "1Jo 4:12", "n": "", "vs": [[12, "إن الله لم يره أحد من الناس قط. ولكن، حين نحب بعضنا بعضا، نبين أن الله يحيا في داخلنا، وأن محبته قد اكتملت في داخلنا."]]}, {"l": "1Jo 4:13", "n": "", "vs": [[13, "وما يؤكد لنا أننا نثبت في الله، وأنه يثبت فينا هو أنه وهب لنا من روحه."]]}], "kwAr": "متحدة في المحبة", "noteAr": ""}, {"kw": "all", "raw": "Col_1:27", "note": "", "refs": [{"l": "Col 1:27", "n": "", "vs": [[27, "الذين أراد الله أن يعلن لهم كم هو غني مجد هذا السر بين الأمم: إنه المسيح فيكم، وهو رجاء المجد؛"]]}], "kwAr": "بكل غناه", "noteAr": ""}, {"kw": "of the full", "raw": "Isa_32:17; 1Th_1:5; Heb_6:11, Heb_10:22; 2Pe_1:10; 1Jo_3:19", "note": "", "refs": [{"l": "Isa 32:17", "n": "", "vs": [[17, "فيكون ثمر البر سلاما، وفعل البر سكينة وطمأنينة إلى الأبد،"]]}, {"l": "1Th 1:5", "n": "", "vs": [[5, "لأن تبشيرنا لكم بالإنجيل لم يكن مجرد كلام، بل كان مصحوبا أيضا بالقوة وبالروح القدس وبتمام اليقين. كما أنكم تعلمون تماما ماذا كنا بينكم لأجل مصلحتكم،"]]}, {"l": "Heb 6:11", "n": "", "vs": [[11, "وإنما نتمنى أن يظهر كل واحد منكم اجتهادا مماثلا في المحافظة حتى النهاية على الثقة الكاملة بالرجاء."]]}, {"l": "Heb 10:22", "n": "", "vs": [[22, "فلنتقدم إلى حضرة الله بقلب صادق وبثقة الإيمان الكاملة، بعدما طهر رش الدم قلوبنا من كل شعور بالذنب، وغسل الماء النقي أجسادنا."]]}, {"l": "2Pe 1:10", "n": "", "vs": [[10, "فأحرى بكم إذن، أيها الإخوة، أن تجتهدوا لتثبتوا عمليا أن الله قد دعاكم واختاركم حقا. فإنكم، إن فعلتم هذا، لن تسقطوا أبدا!"]]}, {"l": "1Jo 3:19", "n": "", "vs": [[19, "عندئذ نتأكد أننا نتصرف بحسب الحق، وتطمئن نفوسنا في حضرة الله،"]]}], "kwAr": "الإدراك التام", "noteAr": ""}, {"kw": "understanding", "raw": "Joh_6:69, Joh_17:3; Rom_16:25; 1Co_2:12; Eph_1:17-19, Eph_3:9, Eph_3:10; Phi_3:8; 2Pe_1:3, 2Pe_3:18", "note": "", "refs": [{"l": "Joh 6:69", "n": "", "vs": [[69, "نحن آمنا وعرفنا أنك قدوس الله!»"]]}, {"l": "Joh 17:3", "n": "", "vs": [[3, "والحياة الأبدية هي أن يعرفوك أنت الإله الحق وحدك، والذي أرسلته: يسوع المسيح."]]}, {"l": "Rom 16:25", "n": "", "vs": [[25, "والمجد للقادر أن يثبتكم، وفقا لإنجيلي وللبشارة بيسوع المسيح، ووفقا لإعلان ما كان سرا ظل مكتوما مدى الأزمنة الأزلية،"]]}, {"l": "1Co 2:12", "n": "", "vs": [[12, "وأما نحن فقد نلنا لا روح العالم بل الروح الذي من الله، لنعرف الأمور التي وهبت لنا من قبل الله."]]}, {"l": "Eph 1:17-19", "n": "", "vs": [[17, "حتى يهبكم إله ربنا يسوع المسيح، أبو المجد، روح حكمة وإلهام: لتعرفوه معرفة كاملة"], [18, "إذ تستنير بصائر قلوبكم، فتعلموا ما في دعوته لكم من رجاء، وما هو غنى مجد ميراثه في القديسين،"], [19, "وما هي عظمة قدرته الفائقة المعلنة لنا نحن المؤمنين، بحسب عمل اقتدار قوته"]]}, {"l": "Eph 3:9", "n": "", "vs": [[9, "وأنير الجميع بمعرفة ما هو تدبير السر الذي أبقاه الله ، خالق كل شيء، مكتوما مدى الأجيال."]]}, {"l": "Eph 3:10", "n": "", "vs": [[10, "والغاية أن يتجلى الآن أمام الرئاسات والسلطات في الأماكن السماوية ما يظهر في الكنيسة من حكمة الله المتعددة الوجوه،"]]}, {"l": "Phi 3:8", "n": "", "vs": [[8, "بل إني أعتبر كل شيء خسارة، من أجل امتياز معرفة المسيح يسوع ربي؛ فمن أجله تحملت خسارة كل شيء، وأعتبر كل شيء نفاية، لكي أربح المسيح"]]}, {"l": "2Pe 1:3", "n": "", "vs": [[3, "إن الله، بقدرته الإلهية، قد زودنا بكل ما نحتاج إليه في الحيا ة الروحية المتصفة بالتقوى. ذلك أنه عرفنا بالمسيح الذي دعانا إلى مجده وفضيلته،"]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}], "kwAr": "الإدراك", "noteAr": ""}, {"kw": "to the", "raw": "Col_1:9; 1Jo_5:7", "note": "", "refs": [{"l": "Col 1:9", "n": "", "vs": [[9, "لذلك نحن أيضا، من اليوم الذي فيه سمعنا بأخباركم، مازلنا نصلي ونتضرع لأجلكم، لأن تمتلئوا من تمام المعرفة لمشيئة الله في كل حكمة وإدراك روحي،"]]}, {"l": "1Jo 5:7", "n": "", "vs": [[7, "فإن هنالك ثلاثة ش
