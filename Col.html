, {"l": "Act 20:4", "n": "", "vs": [[4, "ورافقه في السفر سوباترس بن برس من بيرية؛ وأرسترخس وسكوندس من تسالونيكي؛ وغايوس وتيموثاوس من دربة، وتيخيكس وتروفيمس من مقاطعة أسيا."]]}, {"l": "Act 27:2", "n": "", "vs": [[2, "فركبنا سفينة قادمة من أدراميت، متجهة إلى موانيء مقاطعة أسيا. ورافقنا في الرحلة أرسترخس من مدينة تسالونيكي في مقاطعة مقدونية."]]}, {"l": "Phm 1:24", "n": "", "vs": [[24, "وكذلك مرقس، وأرسترخس، وديماس، ولوقا زملائي في العمل."]]}], "kwAr": "أرسترخس", "noteAr": ""}, {"kw": "saluteth", "raw": "Rom_16:21-23", "note": "", "refs": [{"l": "Rom 16:21-23", "n": "", "vs": [[21, "يسلم عليكم تيموثاوس معاوني، ولوكيوس وياسون وسوسيباترس أقربائي."], [22, "وأنا، ترتيوس الذي أخط هذه الرسالة، أسلم عليكم في الرب."], [23, "يسلم عليكم غايوس، المضيف لي وللكنيسة كلها. يسلم عليكم أراستس، أمين صندوق المدينة، والأخ كوارتس."]]}], "kwAr": "يسلم عليكم", "noteAr": ""}, {"kw": "and Marcus", "raw": "Act_12:12, Act_13:5, Act_13:13, Act_15:37-39; 2Ti_4:11; 1Pe_5:13", "note": "", "refs": [{"l": "Act 12:12", "n": "", "vs": [[12, "وإذ أدرك ذلك، اتجه إلى بيت مريم أم يوحنا الملقب مرقس، حيث كان عدد كبير من المؤمنين مجتمعين يصلون."]]}, {"l": "Act 13:5", "n": "", "vs": [[5, "ولما وصلا الجزيرة نزلا في سلاميس، وأخذا يبشران بكلمة الله في مجامع اليهود، وكان يرافقهما يوحنا معاونا لهما."]]}, {"l": "Act 13:13", "n": "", "vs": [[13, "وأبحر بولس ورفيقاه من بافوس إلى برجة في بمفيلية. وهناك فارق يوحنا بولس وبرنابا ورجع إلى أورشليم."]]}, {"l": "Act 15:37-39", "n": "", "vs": [[37, "فاقترح برنابا أن يأخذا معهما يوحنا الملقب مرقس."], [38, "ولكن بولس رفض أن يأخذاه معهما، لأنه كان قد فارقهما في بمفيلية، ولم يرافقهما في الخدمة."], [39, "فوقعت بينهما مشاجرة حتى انفصل أحدهما عن الآخر. فأخذ برنابا مرقس وسافر بحرا إلى قبرص،"]]}, {"l": "2Ti 4:11", "n": "", "vs": [[11, "ولم يبق معي إلا لوقا وحده. مر بمرقس وأحضره معك، فهو ينفعني في الخدمة."]]}, {"l": "1Pe 5:13", "n": "", "vs": [[13, "ومن بابل، تسلم عليكم تلك التي اختارها الله معكم، وكذلك مرقس ابني."]]}], "kwAr": "ومرقس ابن أخت برنابا", "noteAr": ""}, {"kw": "receive", "raw": "Rom_16:2; 2Jo_1:8, 2Jo_1:9", "note": "", "refs": [{"l": "Rom 16:2", "n": "", "vs": [[2, "فاقبلوها في الرب قبولا يليق بالقديسين وقدموا لها أي عون تحتاج إليه منكم، لأنها هي كانت معينة لكثيرين ولي أنا أيضا."]]}, {"l": "2Jo 1:8", "n": "", "vs": [[8, "فانتبهوا لأنفسكم، لكي لا يضيع الجهد الذي بذلناه في سبيلكم، بل لتنالوا أجركم كاملا."]]}, {"l": "2Jo 1:9", "n": "", "vs": [[9, "لأن من تعدى تعليم المسيح ولم يثبت فيه، فليس الله من نصيبه. أما من يثبت في هذا التعليم، فله الآب والابن معا."]]}], "kwAr": "فرحبوا به", "noteAr": ""}], "arS": [["يسلم", ["G782"]], [" عليكم ", []], ["أرسترخس", ["G708"]], [" ", []], ["رفيقي في السجن", ["G4869", "G3450"]], ["؛ ", []], ["ومرقس", ["G3138"]], [" ", []], ["ابن أخت", ["G431"]], [" ", []], ["برنابا", ["G921"]], ["، وفي شأنه ", []], ["تلقيتم", ["G2983"]], [" بعض ", []], ["التوصيات", ["G1785"]], [": فإن ", []], ["جاء", ["G2064"]], [" إليكم، ", []], ["فرحبوا", ["G1209"]], [" به؛", []]]}, {"c": 4, "v": 11, "text": "ويسوع المعروف باسم يسطس. هؤلاء جميعا من أهل الختان، وهم وحدهم معاوني لأجل ملكوت الله، وقد كانوا لي عزاء.", "groups": [{"kw": "who", "raw": "Act_10:45, Act_11:2; Rom_4:12; Gal_2:7, Gal_2:8; Eph_2:11; Tit_1:10", "note": "", "refs": [{"l": "Act 10:45", "n": "", "vs": [[45, "فدهش المؤمنون اليهود الذين جاءوا برفقة بطرس، لأن هبة الروح القدس فاضت أيضا على غير اليهود،"]]}, {"l": "Act 11:2", "n": "", "vs": [[2, "فما إن عاد بطرس إلى أورشليم حتى جادله دعاة الختان، وعارضوه قائلين:"]]}, {"l": "Rom 4:12", "n": "", "vs": [[12, "وأبا للمختونين الذين ليسوا من أهل الختان وحسب بل الذين يسيرون في خطى الإيمان الذي كان لأبينا إبراهيم وهو بعد غير مختون."]]}, {"l": "Gal 2:7", "n": "", "vs": [[7, "بل بالعكس، رأوا أنه عهد إلي بالإنجيل لأهل عدم الختان، كما عهد به إلى بطرس لأهل الختان."]]}, {"l": "Gal 2:8", "n": "", "vs": [[8, "لأن الذي استخدم بطرس في رسوليته إلى أهل الختان، استخدمني أيضا بالنسبة إلى الأمم."]]}, {"l": "Eph 2:11", "n": "", "vs": [[11, "لذلك اذكروا، أنتم الأمم في الجسد سابقا، يامن تسمون أهل عدم الختان من قبل من يسمون أهل الختان الذي يجري في الجسد باليد،"]]}, {"l": "Tit 1:10", "n": "", "vs": [[10, "فإن هنالك كثيرين من معلمي الباطل المتمردين وخادعي عقول الناس، وبخاصة الذين من أهل الختان."]]}], "kwAr": "من أهل الختان", "noteAr": ""}, {"kw": "fellowworkers", "raw": "Col_4:7; 1Co_3:5-9; 2Co_6:1; Phi_4:3; 1Th_3:2; Phm_1:1, Phm_1:24", "note": "", "refs": [{"l": "Col 4:7", "n": "", "vs": [[7, "أما أحوالي كلها، فسيخبركم بها تيخيكس، الأخ الحبيب والخادم الأمين ورفيقنا العبد في الرب،"]]}, {"l": "1Co 3:5-9", "n": "", "vs": [[5, "فمن هو بولس؟ ومن هو أبلوس؟ إنهما فقط خادمان آمنتم على أيديهما، وكما أنعم الرب على كل منهما."], [6, "أنا غرست وأبلوس سقى؛ ولكن الله أنمى."], [7, "فليس الغارس شيئا ولا الساقي، بل الله الذي يعطي النمو."], [8, "فالغارس والساقي سواء. إلا أن كلا منهما سينال أجرته بالنسبة إلى تعبه."], [9, "فإننا نحن جميعا عاملون معا عند الله، وأنتم حقل الله وبناء الله."]]}, {"l": "2Co 6:1", "n": "", "vs": [[1, "فبما أننا عاملون معا عند الله، نطلب ألا يكون قبولكم لنعمة الله عبثا."]]}, {"l": "Phi 4:3", "n": "", "vs": [[3, "أجل، أطلب إليك أنت أيضا، أيها الزميل المخلص، أن تساعدهما، لأنهما جاهدتا معي في خدمة الإنجيل، هما وأكليمندس ومعاوني الآخرون، المكتوبة أسماؤهم في سجل الحياة."]]}, {"l": "1Th 3:2", "n": "", "vs": [[2, "فبعثنا تيموثاوس، أخانا ومعاوننا في خدمة الله بنشر الإنجيل، لكي يشددكم ويشجعكم في إيمانكم،"]]}, {"l": "Phm 1:1", "n": "", "vs": [[1, "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"]]}, {"l": "Phm 1:24", "n": "", "vs": [[24, "وكذلك مرقس، وأرسترخس، وديماس، ولوقا زملائي في العمل."]]}], "kwAr": "معاوني لأجل ملكوت الله", "noteAr": ""}, {"kw": "a comfort", "raw": "2Co_7:6, 2Co_7:7; 1Th_3:7", "note": "", "refs": [{"l": "2Co 7:6", "n": "", "vs": [[6, "إلا أن الله ، الذي يشجع المسحوقين، أمدنا بالتشجيع بمجيء تيطس إلينا،"]]}, {"l": "2Co 7:7", "n": "", "vs": [[7, "لا بمجيئه وحسب، بل بالتشجيع الذي لقيه عندكم. وقد أخبرنا بشوقكم، وحزنكم، وغيرتكم علي، فتضاعف فرحي."]]}, {"l": "1Th 3:7", "n": "", "vs": [[7, "فقد وجدنا بكم أيها الإخوة عزاء في وسط ضيقتنا وشدتنا من جهة إيمانكم."]]}], "kwAr": "وقد كانوا لي عزاء", "noteAr": ""}], "arS": [["ويسوع", ["G2424"]], [" المعروف باسم ", []], ["يسطس", ["G2459"]], [". هؤلاء جميعا من أهل ", []], ["الختان", ["G4061"]], ["، وهم ", []], ["وحدهم", ["G3441"]], [" ", []], ["معاوني", ["G4904"]], [" لأجل ", []], ["ملكوت", ["G932"]], [" ", []], ["الله", ["G2316"]], ["، وقد كانوا لي ", []], ["عزاء", ["G3931"]], [".", []]]}, {"c": 4, "v": 12, "text": "يسلم عليكم أبفراس الذي هو منكم، وهو عبد للمسيح يسوع، يجاهد كل حين لأجلكم في الصلوات لتثبتوا كاملين ولكم تمام اليقين من جهة مشيئة الله كلها.", "groups": [{"kw": "Epaphras", "raw": "Col_1:7; Phm_1:23", "note": "", "refs": [{"l": "Col 1:7", "n": "", "vs": [[7, "على حسب ما تعلمتم من أبفراس شريكنا العبد الحبيب، والخادم الأمين للمسيح عندكم"]]}, {"l": "Phm 1:23", "n": "", "vs": [[23, "يسلم عليك أبفراس، رفيق سجني في المسيح يسوع،"]]}], "kwAr": "أبفراس", "noteAr": ""}, {"kw": "a servant", "raw": "Joh_12:26; Gal_1:10; Jam_1:1; 2Pe_1:1", "note": "", "refs": [{"l": "Joh 12:26", "n": "", "vs": [[26, "من أراد أن يخدمني فليتبعني. وحيث أكون أنا يكون خادمي أيضا. وكل من يخدمني يكرمه أبي."]]}, {"l": "Gal 1:10", "n": "", "vs": [[10, "فهل أسعى الآن إلى كسب تأييد الناس أو الله؟ أم تراني أطلب أن أرضي الناس؟ لو كنت حتى الآن أرضي الناس، لما كنت عبدا للمسيح!"]]}, {"l": "Jam 1:1", "n": "", "vs": [[1, "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"]]}, {"l": "2Pe 1:1", "n": "", "vs": [[1, "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"]]}], "kwAr": "عبد للمسيح يسوع", "noteAr": ""}, {"kw": "always", "raw": "Col_4:2; Luk_22:44; Gal_4:19; Heb_5:7; Jam_5:16", "note": "", "refs": [{"l": "Col 4:2", "n": "", "vs": [[2, "داوموا على الصلاة، متيقظين فيها بالشكر،"]]}, {"l": "Luk 22:44", "n": "", "vs": [[44, "وإذ كان في صراع، أخذ يصلي بأشد إلحاح؛ حتى إن عرقه صار كقطرات دم نازلة على الأرض."]]}, {"l": "Gal 4:19", "n": "", "vs": [[19, "ياأطفالي الذين أتمخض بكم مرة أخرى إلى أن تتشكل فيكم صورة المسيح."]]}, {"l": "Heb 5:7", "n": "", "vs": [[7, "والمسيح، في أثناء حياته البشرية على الأرض، رفع أدعية وتضرعات مقترنة بصراخ شديد ودموع، إلى القادر أن يخلصه من الموت. وقد لبى الله طلبه إكراما لتقواه."]]}, {"l": "Jam 5:16", "n": "", "vs": [[16, "ليعترف كل واحد منكم لأخيه بزلاته، وصلوا بعضكم لأجل بعض، حتى تشفوا. إن الصلاة الحارة التي يرفعها البار لها فعالية عظيمة."]]}], "kwAr": "كل حين", "noteAr": ""}, {"kw": "labouring", "raw": "or, striving, Col. 2:1-23", "note": "or, striving, Col. 2:1-23", "refs": [{"l": "Col 2:1-23", "n": "", "vs": [[1, "فإني أريد أن تعلموا مقدار جهادي لأجلكم ولأجل الذين في مدينة لاودكية، ولأجل جميع الذين لا يعرفونني بالوجه،"], [2, "بغرض أن تتشجع قلوبهم وتكون كلها متحدة في المحبة، لبلوغ الإدراك التام بكل غناه، لمعرفة سر الله، أي المسيح،"], [3, "المخزونة فيه كنوز الحكمة والمعرفة كلها."], [4, "أقول هذا حتى لا يضللكم أحد بكلام خداع."], [5, "فمع أني في الجسد غائب، إلا أني في الروح حاضر معكم، أفرح إذ أشاهد ترتيبكم وثباتكم في الإيمان بالمسيح."], [6, "فمثلما قبلتم المسيح يسوع الرب، ففيه اسلكوا"], [7, "وأنتم متأصلون ومبنيون فيه وراسخون في الإيمان الموافق لما تعلمتم وفائضون بالشكر."], [8, "احذروا أن يوقعكم أحد فريسة بالفلسفة والغرور الباطل، عملا بتقاليد الناس ومباديء العالم؛ مما لا يوافق المسيح."], [9, "فإنه فيه، جسديا، يحل الله بكل ملئه،"], [10, "وأنتم مكملون فيه. فهو رأس كل رئاسة وسلطة؛"], [11, "وفيه أيضا ختنتم أنتم ختانا لم تجره الأيدي، إذ نزع عنكم جسد الخطايا البشري وهذا هو ختان المسيح:"], [12, "فقد دفنتم معه في المعمودية، وفيها أيضا أقمتم معه، عن طريق إيمانكم بقدرة الله الذي أقامه من بين الأموات."], [13, "فأنتم، إذ كنتم أمواتا في الخطايا وعدم ختانكم الجسدي، أحياكم جميعا معه؛ مسامحا لنا جميعا بالخطايا كلها."], [14, "إذ قد محا صك الفرائض المكتوب علينا والمناقض لمصلحتنا، بل إنه قد أزاله من الوسط، مسمرا إياه على الصليب."], [15, "وإذ نزع سلاح الرئاسات والسلطات، فضحهم جهارا فيه، وساقهم في موكبه ظافرا عليهم."], [16, "فلا يحكم عليكم أحد في قضية الأكل والشرب، أو في القضايا المتعلقة بالأعياد ورؤوس الشهور والسبوت؛"], [17, "فهذه كانت ظلالا لما سيأتي، أي للحقيقة التي هي المسيح."], [18, "لا يحرمكم أحد من جائزتكم، بحملكم على ما يرغب فيه من إظهار التواضع والتعبد للملائكة، داخلا في رؤى يتوهمها، وقد نفخه باطلا ذهنه الجسدي،"], [19, "وهو غير ممسك بالرأس الذي منه يتلقى الجسد كله غذاءه وتماسكه بالمفاصل والأوصال، فينمو النمو الذي يمنحه الله ."], [20, "فمادمتم قد متم مع المسيح بالنسبة لمباديء العالم، فلماذا، كما لو كنتم عائشين في العالم، تخضعون أنفسكم لفرائض مثل هذه:"], [21, "لا تمسك، لا تذق، لا تلمس"], [22, "وهذه أشياء تستهلك وتزول. فتلك الفرائض هي وصايا البشر وتعاليمهم."], [23, "لها مظاهر الحكمة لما فيها من إفراط في العبادة المصطنعة، وإذلال للذات، وقهر للجسد؛ أمور لا قيمة لها، وما هي إلا لإرضاء الميول البشرية."]]}], "kwAr": "يجاهد", "noteAr": "أو: مجاهدًا؛ انظر كو 2."}, {"kw": "that", "raw": "Col_4:1; Rom_15:30; see note on Col_1:9, Col_1:22, Col_1:28; Mat_5:48; 1Co_2:6, 1Co_14:20 *Gr: 2Co_13:11; Phi_3:12-15; 1Th_5:23; Heb_5:14 *Gr: Heb_6:1; Jud_1:24", "note": "Col_4:1; Rom_15:30; see note on Col_1:9, Col_1:22, Col_1:28; Mat_5:48; 1Co_2:6, 1Co_14:20 *Gr: 2Co_13:11; Phi_3:12-15; 1Th_5:23; Heb_5:14 *Gr: Heb_6:1; Jud_1:24", "refs": [{"l": "Col 4:1", "n": "", "vs": [[1, "أيها السادة، عاملوا عبيدكم بالعدل والإنصاف، عالمين أن لكم، أنتم أيضا، سيدا في السماء."]]}, {"l": "Rom 15:30", "n": "", "vs": [[30, "فأتوسل إليكم، أيها الإخوة، بربنا يسوع المسيح وبمحبة الروح، أن تجاهدوا معي في الصلوات إلى الله من أجلي،"]]}, {"l": "Col 1:9", "n": "", "vs": [[9, "لذلك نحن أيضا، من اليوم الذي فيه سمعنا بأخباركم، مازلنا نصلي ونتضرع لأجلكم، لأن تمتلئوا من تمام المعرفة لمشيئة الله في كل حكمة وإدراك روحي،"]]}, {"l": "Col 1:22", "n": "", "vs": [[22, "قد صالحكم الآن في جسد بشرية (ابنه) بالموت. وذلك لكي يحضركم فتمثلوا أمامه وأنتم قديسون بلا ذنب ولا لوم."]]}, {"l": "Col 1:28", "n": "", "vs": [[28, "هذا السر نعلنه نحن، واعظين كل إنسان، ومعلمين كل إنسان، في كل حكمة، لكي نحضر كل إنسان كاملا في المسيح."]]}, {"l": "Mat 5:48", "n": "", "vs": [[48, "فكونوا أنتم كاملين، كما أن أباكم السماوي هو كامل!"]]}, {"l": "1Co 2:6", "n": "", "vs": [[6, "على أن لنا حكمة نتكلم بها بين البالغين. ولكنها حكمة ليست من هذا العالم ولا من رؤساء هذا العالم الزائلين."]]}, {"l": "1Co 14:20", "n": "*Gr:", "vs": [[20, "أيها الإخوة، لا تكونوا أولادا في التفكير، بل كونوا أطفالا في الشر. وأما في التفكير، فكونوا راشدين."]]}, {"l": "2Co 13:11", "n": "", "vs": [[11, "وأخيرا، أيها الإخوة: افرحوا؛ تكملوا؛ تشجعوا؛ اتفقوا في الرأي؛ عيشوا بسلام. وإله المحبة والسلام سيكون معكم!"]]}, {"l": "Phi 3:12-15", "n": "", "vs": [[12, "لست أدعي أني قد نلت الجائزة أو بلغت الكمال. ولكني ماأزال أسعى لاقتنائها، كما أن المسيح يسوع قد اقتناني."], [13, "أيها الإخوة، أنا لا أعتبر نفسي قد نلت الجائزة، ولكني أفعل أمرا واحدا: أنسى ما هو وراء وأتقدم إلى ما هو أمام،"], [14, "إذ أسعى إلى الهدف، لنوال تلك الجائزة التي يدعونا الله إليها دعوة عليا في المسيح يسوع."], [15, "جميع البالغين فينا، ليكن فيهم هذا الفكر. وإن كان فيكم غير هذا الفكر، فذلك أيضا سيكشفه لكم الله ."]]}, {"l": "1Th 5:23", "n": "", "vs": [[23, "وإله السلام نفسه يقدسكم إلى التمام ويحفظكم سالمين، روحا ونفسا وجسدا، لتكونوا بلا لوم عند عودة ربنا يسوع المسيح."]]}, {"l": "Heb 5:14", "n": "*Gr:", "vs": [[14, "أما الناضجون روحيا، فهم قادرون على تناول الطعام القوي: لأن حواسهم قد تدربت، بالممارسة الصحيحة، على التمييز بين الخير والشر."]]}, {"l": "Heb 6:1", "n": "", "vs": [[1, "لذلك، فلنترك تلك المباديء الأولية عن المسيح، ونتقدم إلى النضوج الكامل. ولا نضع من جديد تلك الأسس التي تعلمناها سابقا، وهي: التوبة من الأعمال المميتة، والإيمان بالله،"]]}, {"l": "Jud 1:24", "n": "", "vs": [[24, "وللقادر أن يحرسكم من السقوط حتى يوصلكم إلى المثول أمامه في المجد مبتهجين ولا عيب فيكم …"]]}], "kwAr": "لتثبتوا كاملين", "noteAr": "انظر الملاحظة على كو 1: 9، 22، 28؛ مت 5: 48؛ في 3: 12-15؛ عب 5: 14."}, {"kw": "complete", "raw": "or, filled, Rom_15:14", "note": "or, filled, Rom_15:14", "refs": [{"l": "Rom 15:14", "n": "", "vs": [[14, "وأنا نفسي أيضا على يقين من جهتكم أيها الإخوة بأنكم مشحونون صلاحا، وممتلئون بكل معرفة، وقادرون أيضا على نصح بعضكم بعضا."]]}], "kwAr": "ولكم تمام اليقين", "noteAr": "أو: ممتلئين؛ انظر رو 15: 14."}], "arS": [["يسلم", ["G782"]], [" عليكم ", []], ["أبفراس", ["G1889"]], [" الذي هو منكم، وهو ", []], ["عبد", ["G1401"]], [" ", []], ["للمسيح", ["G5547"]], [" يسوع، ", []], ["يجاهد", ["G75"]], [" ", []], ["كل حين", ["G3842"]], [" لأجلكم في ", []], ["الصلوات", ["G4335"]], [" ", []], ["لتثبتوا", ["G2476"]], [" ", []], ["كاملين", ["G5046"]], [" ولكم ", []], ["تمام اليقين", ["G4137"]], [" من جهة ", []], ["مشيئة", ["G2307"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["كلها", ["G3956"]], [".", []]]}, {"c": 4, "v": 13, "text": "فإني أشهد له بأنه يجتهد كثيرا لأجلكم ولأجل الذين في مدينة لاودكية والذين في مدينة هيرابوليس.", "groups": [{"kw": "I bear", "raw": "Rom_10:2; 2Co_8:3", "note": "", "refs": [{"l": "Rom 10:2", "n": "", "vs": [[2, "فإني أشهد لهم أن عندهم غيرة لله، ولكنها ليست على أساس المعرفة."]]}, {"l": "2Co 8:3", "n": "", "vs": [[3, "فإني أشهد أنهم تبرعوا من تلقاء أنفسهم، لا على قدر طاقتهم وحسب، بل فوق طاقتهم."]]}], "kwAr": "فإني أشهد له", "noteAr": ""}, {"kw": "Laodicea", "raw": "Laodicea and Hierapolis were both cities of Phrygia in Asia Minor, between which, and equidistant from each, was situated Colosse. Laodicea was seated near the Lycus, about 63 miles east of Ephesus; and became one of the largest and richest towns in Phrygia, vying in power with the maritime cities. It is now called Eski-hissar, the old castle; and besides the whole surface within the citys wall being strewed with pedestals and fragments, the ruins of an amphitheatre, a magnificent odeum, and other public buildings, attest its former splendour and magnificence. But, when visited by Dr. Chandler, all was silence and solitude; and a fox, first discovered by his ears peeping over a brow, was the only inhabitant of Laodicea. Hierapolis, now Pambouk-Kaiesi, was situated, according to the Itinerary, six miles n of Laodicea; and its ruins are now about a mile and a half in circumference. Col_4:15, Col_4:16, Col_2:1; Rev_1:11, Rev_3:14-18", "note": "Laodicea and Hierapolis were both cities of Phrygia in Asia Minor, between which, and equidistant from each, was situated Colosse. Laodicea was seated near the Lycus, about 63 miles east of Ephesus; and became one of the largest and richest towns in Phrygia, vying in power with the maritime cities. It is now called Eski-hissar, the old castle; and besides the whole surface within the citys wall being strewed with pedestals and fragments, the ruins of an amphitheatre, a magnificent odeum, and other public buildings, attest its former splendour and magnificence. But, when visited by Dr. Chandler, all was silence and solitude; and a fox, first discovered by his ears peeping over a brow, was the only inhabitant of Laodicea. Hierapolis, now Pambouk-Kaiesi, was situated, according to the Itinerary, six miles n of Laodicea; and its ruins are now about a mile and a half in circumference. Col_4:15, Col_4:16, Col_2:1; Rev_1:11, Rev_3:14-18", "refs": [{"l": "Col 4:15", "n": "", "vs": [[15, "سلموا على الإخوة الذين في لاودكية، وعلى نمفاس، وعلى الكنيسة التي في بيته."]]}, {"l": "Col 4:16", "n": "", "vs": [[16, "وبعد أن تقرأ هذه الرسالة عليكم، ابعثوا بها لتقرأ على كنيسة مؤمني لاودكية، وخذوا الرسالة التي عندهم لتقرأوها أنتم أيضا."]]}, {"l": "Col 2:1", "n": "", "vs": [[1, "فإني أريد أن تعلموا مقدار جهادي لأجلكم ولأجل الذين في مدينة لاودكية، ولأجل جميع الذين لا يعرفونني بالوجه،"]]}, {"l": "Rev 1:11", "n": "", "vs": [[11, "يقول: «دون ما تراه في كتاب، وابعث به إلى الكنائس السبع: في أفسس، وسميرنا، وبرغامس، وثياتيرا، وساردس، وفيلادلفيا، ولاودكية»."]]}, {"l": "Rev 3:14-18", "n": "", "vs": [[14, "واكتب إلى ملاك الكنيسة في لاودكية: إليك ما يقوله الحق، الشاهد الأمين الصادق، رئيس خليقة الله:"], [15, "إني عالم بأعمالك، وأعلم أنك لست باردا ولا حارا. وليتك كنت باردا أو حارا!"], [16, "فبما أنك فاتر، لا حار ولا بارد، سألفظك من فمي!"], [17, "تقول: أنا غني، قد اغتنيت ولا يعوزني شيء! ولكنك لا تعلم أنك شقي بائس فقير أعمى عريا ن."], [18, "نصيحتي لك أن تشتري مني ذهبا نقيا، صفته النار، فتغتني حقا، وثيابا بيضاء ترتديها فتستر عريك المعيب، وكحلا لشفاء عينيك فيعود إليك البصر."]]}], "kwAr": "مدينة لاودكية", "noteAr": "كانت لاودكية وهيرابوليس مدينتين في فريجية بآسيا الصغرى، وتقع كولوسي بينهما على مسافة متساوية منهما. كانت لاودكية قرب نهر ليكوس، على نحو 63 ميلًا شرقي أفسس، وصارت من أكبر مدن فريجية وأغناها، تنافس المدن الساحلية قوة. وتُدعى اليوم «إسكي حصار» أي القلعة القديمة؛ وتشهد أطلالها من قواعد وأعمدة مكسورة وبقايا مدرّج ومسرح فخم ومبانٍ عامة أخرى على عظمتها السابقة. لكن حين زارها الدكتور تشاندلر كان كل شيء صمتًا ووحشة، ولم يكن من ساكن للاودكية إلا ثعلب. أما هيرابوليس، واسمها اليوم «بامبوك قلعة سي»، فكانت على بُعد ستة أميال شمال لاودكية، ويبلغ محيط أطلالها نحو ميل ونصف. انظر كو 4: 15، 16؛ 2: 1؛ رؤ 1: 11؛ 3: 14-18."}], "arS": [["فإني ", []], ["أشهد", ["G3140"]], [" له بأنه ", []], ["يجتهد", ["G2205"]], [" ", []], ["كثيرا", ["G4183"]], [" لأجلكم ولأجل الذين في مدينة ", []], ["لاودكية", ["G2993"]], [" والذين في مدينة ", []], ["هيرابوليس", ["G2404"]], [".", []]]}, {"c": 4, "v": 14, "text": "يسلم عليكم لوقا الطبيب الحبيب؛ وديماس.", "groups": [{"kw": "Luke", "raw": "2Ti_4:11; Phm_1:24", "note": "", "refs": [{"l": "2Ti 4:11", "n": "", "vs": [[11, "ولم يبق معي إلا لوقا وحده. مر بمرقس وأحضره معك، فهو ينفعني في الخدمة."]]}, {"l": "Phm 1:24", "n": "", "vs": [[24, "وكذلك مرقس، وأرسترخس، وديماس، ولوقا زملائي في العمل."]]}], "kwAr": "لوقا الطبيب الحبيب", "noteAr": ""}, {"kw": "Demas", "raw": "2Ti_4:10; Phm_1:24", "note": "", "refs": [{"l": "2Ti 4:10", "n": "", "vs": [[10, "لأن ديماس، إذ أحب الحياة الحاضرة، تركني وذهب إلى مدينة تسالونيكي. أما كريسكيس، فقد ذهب إلى مقاطعة غلاطية، وتيطس إلى دلماطية"]]}, {"l": "Phm 1:24", "n": "", "vs": [[24, "وكذلك مرقس، وأرسترخس، وديماس، ولوقا زملائي في العمل."]]}], "kwAr": "وديماس", "noteAr": ""}], "arS": [["يسلم", ["G782"]], [" عليكم ", []], ["لوقا", ["G3065"]], [" ", []], ["الطبيب", ["G2395"]], [" ", []], ["الحبيب", ["G27"]], ["؛ ", []], ["وديماس", ["G1214"]], [".", []]]}, {"c": 4, "v": 15, "text": "سلموا على الإخوة الذين في لاودكية، وعلى نمفاس، وعلى الكنيسة التي في بيته.", "groups": [{"kw": "Laodicea", "raw": "Col_4:13", "note": "", "refs": [{"l": "Col 4:13", "n": "", "vs": [[13, "فإني أشهد له بأنه يجتهد كثيرا لأجلكم ولأجل الذين في مدينة لاودكية والذين في مدينة هيرابوليس."]]}], "kwAr": "الإخوة الذين في لاودكية", "noteAr": ""}, {"kw": "the church", "raw": "Rom_16:5; 1Co_16:9; Phm_1:2", "note": "", "refs": [{"l": "Rom 16:5", "n": "", "vs": [[5, "وسلموا على الكنيسة في بيتهما. سلموا على أبينتوس، حبيبي الذي هو باكورة للمسيح من مقاطعة أسيا."]]}, {"l": "1Co 16:9", "n": "", "vs": [[9, "لأن بابا كبيرا وفعالا قد انفتح لي، والمقاومون كثيرون!"]]}, {"l": "Phm 1:2", "n": "", "vs": [[2, "وإلى أبفية الأخت، وأرخيبوس رفيقنا في التجند، وإلى الكنيسة التي في بيتك."]]}], "kwAr": "وعلى الكنيسة التي في بيته", "noteAr": ""}], "arS": [["سلموا", ["G782"]], [" على ", []], ["الإخوة", ["G80"]], [" الذين في ", []], ["لاودكية", ["G2993"]], ["، وعلى ", []], ["نمفاس", ["G3564"]], ["، وعلى ", []], ["الكنيسة", ["G1577"]], [" التي في ", []], ["بيته", ["G3624"]], [".", []]]}, {"c": 4, "v": 16, "text": "وبعد أن تقرأ هذه الرسالة عليكم، ابعثوا بها لتقرأ على كنيسة مؤمني لاودكية، وخذوا الرسالة التي عندهم لتقرأوها أنتم أيضا.", "groups": [{"kw": "", "raw": "1Th_5:27", "note": "", "refs": [{"l": "1Th 5:27", "n": "", "vs": [[27, "أناشدكم بالرب أن تقرأ هذه الرسالة على جميع الإخوة."]]}], "kwAr": "", "noteAr": ""}], "arS": [["وبعد أن ", []], ["تقرأ", ["G314"]], [" هذه ", []], ["الرسالة", ["G1992"]], [" عليكم، ابعثوا بها ", []], ["لتقرأ", ["G314"]], [" على ", []], ["كنيسة", ["G1577"]], [" مؤمني ", []], ["لاودكية", ["G2994"]], ["، وخذوا ", []], ["الرسالة", ["G1992"]], [" التي عندهم ", []], ["لتقرأوها", ["G314"]], [" أنتم أيضا.", []]]}, {"c": 4, "v": 17, "text": "وقولوا لأرخبس: «تنبه للخدمة التي تلقيتها في الرب، وقم بها كاملة!»", "groups": [{"kw": "Archippus", "raw": "Phm_1:2", "note": "", "refs": [{"l": "Phm 1:2", "n": "", "vs": [[2, "وإلى أبفية الأخت، وأرخيبوس رفيقنا في التجند، وإلى الكنيسة التي في بيتك."]]}], "kwAr": "لأرخبس", "noteAr": ""}, {"kw": "Take", "raw": "Lev_10:3; Num_18:5; 2Ch_29:11; Eze_44:23, Eze_44:24; Act_20:28; 1Ti_4:16; 1Ti_6:11-14, 1Ti_6:20; 2Ti_4:1-5", "note": "", "refs": [{"l": "Lev 10:3", "n": "", "vs": [[3, "فقال موسى لهرون: «إليك ما قاله الرب: في القريبين مني أظهر قداستي، وأعلن مجدي أمام جميع الشعب». فصمت هرون."]]}, {"l": "Num 18:5", "n": "", "vs": [[5, "فأنتم الكهنة الذين تقومون على خدمة المقدس والمذبح، لئلا ينصب السخط على بني إسرائيل."]]}, {"l": "2Ch 29:11", "n": "", "vs": [[11, "يابني لا تضلوا الآن، فقد اختاركم الرب لتمثلوا أمامه عابدين خادمين، وموقدين له»."]]}, {"l": "Eze 44:23", "n": "", "vs": [[23, "ويعلمون شعبي التمييز بين المقدس والمباح، ويعرفونهم النجس من الطاهر."]]}, {"l": "Eze 44:24", "n": "", "vs": [[24, "ويكونون قضاة في الخصام، فيحكمون بمقتضى أحكامي، ويمارسون شرائعي وفرائضي في كل مواسم أعيادي ويقدسون أيام سبوتي."]]}, {"l": "Act 20:28", "n": "", "vs": [[28, "فاسهروا إذن على أنفسكم وعلى جميع القطيع الذي عينكم بينه الروح القدس نظارا، لترعوا كنيسة الله التي اشتراها بدمه."]]}, {"l": "1Ti 4:16", "n": "", "vs": [[16, "انتبه جيدا لنفسك وللتعليم. فإنك إذ تواظب على ذلك، تنقذ نفسك وسامعيك أيضا."]]}, {"l": "1Ti 6:11-14", "n": "", "vs": [[11, "وأما أنت، ياإنسان الله، فاهرب من هذه الأمور، واسع في إثر البر والتقوى والإيمان والمحبة والصبر والوداعة."], [12, "أحسن الجهاد في معركة الإيمان الجميلة. تمسك بالحياة الأبدية، التي إليها قد دعيت، وقد اعترفت الاعتراف الحسن (بالإيمان) أمام شهود كثيرين."], [13, "وأوصيك، أمام الله الذي يحيي كل شيء، والمسيح يسوع الذي شهد أمام بيلاطس البنطي بالاعتراف الحسن،"], [14, "أن تحفظ الوصية خالية من العيب واللوم إلى يوم ظهور ربنا يسوع المسيح علنا."]]}, {"l": "1Ti 6:20", "n": "", "vs": [[20, "ياتيموثاوس، حافظ على الأمانة المودعة لديك. تجنب الكلام الدنس الباطل، ومناقضات ما يسمى زورا «معرفة»."]]}, {"l": "2Ti 4:1-5", "n": "", "vs": [[1, "أطلب منك في حضرة الله والمسيح الذي سيدين الأحياء والأموات، بعودته العلنية وملكوته،"], [2, "أن تنادي بالكلمة منشغلا بها كليا، في الفرص المناسبة وغير المناسبة على السواء، وأن توبخ وتنذر وتشجع بكل صبر في التعليم."], [3, "فإنه سيأتي زمان لا يطيق الناس فيه التعليم الصحيح، بل تبعا لشهواتهم الخاصة يكدسون لأنفسهم معلمين (ي
