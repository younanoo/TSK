أسلابهم، ويطأوهم كما يطأون الوحل."]]}, {"l": "Isa 13:3", "n": "", "vs": [[3, "إني أمرت مقدسي واستدعيت جبابرتي المفتخرين بعظمتي لينفذوا عقاب غضبي."]]}, {"l": "Isa 46:10", "n": "", "vs": [[10, "وقد أنبأت بالنهاية منذ البدء، وأخبرت من القدم بأمور لم تكن قد حدثت بعد، قائلا: مقاصدي لابد أن تتم، ومشيئتي لابد أن تتحقق."]]}, {"l": "Isa 46:11", "n": "", "vs": [[11, "أدعو من المشرق الطائر الجارح، ومن الأرض البعيدة رجل مشورتي. قد نطقت بقضائي ولابد أن أجريه، وما رسمته من خطة لابد أن أنفذه."]]}, {"l": "Isa 55:11", "n": "", "vs": [[11, "هكذا تكون كلمتي التي تصدر عني مثمرة دائما، وتحقق ما أرغب فيه وتفلح بما أعهد به إليها."]]}, {"l": "Eze 29:18-20", "n": "", "vs": [[18, "«ياابن آدم، إن نبوخذناصر ملك بابل قد سخر جيشه أشد تسخير ضد صور، فأصبحت كل رأس من رؤوس جنوده صلعاء، وكل كتف مجردة من الثياب. ولكن لم يغنم هو ولا جيشه شيئا من صور رغم ما كابده من جهد للاستيلاء عليها."], [19, "لذلك هذا ما يعلنه السيد الرب: ها أنا أبذل ديار مصر لنبوخذناصر ملك بابل فيستولي على ثروتها، ويسلبها غنائمها وينهبها، فتكون هذه أجرة لجيشه."], [20, "قد أعطيته أرض مصر لقاء تعبه، لأنه وجيشه قد عملوا في خدمتي، يقول السيد الرب."]]}, {"l": "Nah 1:14", "n": "", "vs": [[14, "وها الرب قد أصدر قضاءه بشأنك ياأشور: لن تبقى لك ذرية تحمل اسمك. وأستأصل من هيكل آلهتك منحوتاتك ومسبوكاتك، وأجعله قبرك، لأنك صرت نجسا."]]}], "kwAr": "الرب", "noteAr": ""}, {"kw": "he will", "raw": "Amo_6:8, Amo_3:15; 2Ki_25:9; Hos_13:16; Zec_14:2; Luk_19:44", "note": "", "refs": [{"l": "Amo 6:8", "n": "", "vs": [[8, "ويقول الرب القدير: قد أقسمت بذاتي، أن أمقت زهو يعقوب، وأبغض قصوره، فأسلم المدينة بكل ما فيها."]]}, {"l": "Amo 3:15", "n": "", "vs": [[15, "وأدمر البيوت التي يأوون إليها في الشتاء، وبيوت المنتجعات الصيفية، وتندك بيوت العاج وتزول من الوجود قصور كثيرة، يقول الرب."]]}, {"l": "2Ki 25:9", "n": "", "vs": [[9, "وأحرق الهيكل وقصر الملك وسائر بيوت أورشليم، وكل منازل العظماء."]]}, {"l": "Hos 13:16", "n": "", "vs": [[16, "لابد أن تتحمل السامرة وزر خطيئتها لأنها تمردت على إلهها، فيفنى أهلها بحد السيف، ويتمزق أطفالها أشلاء، وتشق بطون حواملها."]]}, {"l": "Zec 14:2", "n": "", "vs": [[2, "لأني أجمع جميع الأمم على أورشليم لتحاربها، فتؤخذ المدينة وتنهب البيوت وتغتصب النساء ويسبى نصف أهلها إلى المنفى. إنما لا ينقرض بقية الشعب من المدينة."]]}, {"l": "Luk 19:44", "n": "", "vs": [[44, "ويهدمونك على أبنائك الذين فيك، فلا يتركون فيك حجرا فوق حجر: لأنك لم تعرفي وقت افتقاد الله لك»."]]}], "kwAr": "فيهدم", "noteAr": ""}, {"kw": "breaches", "raw": "or, droppings, Ecc_10:18", "note": "or, droppings, Ecc_10:18", "refs": [{"l": "Ecc 10:18", "n": "", "vs": [[18, "من جراء الكسل ينهار السقف، وبتراخي اليدين يسقط البيت."]]}], "kwAr": "حطاما", "noteAr": "أو: «تقطّرات». انظر جا 10: 18"}], "arS": [["لأنه ها ", []], ["الرب", ["H3068"]], [" ", []], ["يأمر", ["H6680"]], ["، ", []], ["فيهدم", ["H5221"]], [" ", []], ["البيت", ["H1004"]], [" ", []], ["الكبير", ["H1419"]], [" ", []], ["فيصير", ["H7447"]], [" ركاما، والبيت ", []], ["الصغير", ["H6996"]], [" ", []], ["حطاما", ["H1233"]], [".", []]]}, {"c": 6, "v": 12, "text": "أتجري الخيول على الصخور؟ وهل يحرث البحر بثيران؟ لقد حولتم الحق سما زعافا، وثمار البر مرارة.", "groups": [{"kw": "horses", "raw": "Isa_48:4; Jer_5:3, Jer_6:29, Jer_6:30; Zec_7:11, Zec_7:12", "note": "", "refs": [{"l": "Isa 48:4", "n": "", "vs": [[4, "لأني عالم بعنادك، وأن رقبتك ذات عضل من حديد وجبهتك من نحاس."]]}, {"l": "Jer 5:3", "n": "", "vs": [[3, "أيها الرب، أليست عيناك تطلبان الحق؟ لقد عاقبتهم ولكنهم لم يتوجعوا. أهلكتهم ولكنهم أبوا التقويم. صلبوا وجوههم أكثر من الصخر، ورفضوا التوبة."]]}, {"l": "Jer 6:29", "n": "", "vs": [[29, "لشد ما تضرم ريح المنفاخ الشديدة النار فتلتهم الرصاص ولكن كما يتعذر تنقيته من الزغل كذلك يتعذر فصل الأشرار."]]}, {"l": "Jer 6:30", "n": "", "vs": [[30, "وهم يدعون حثالة الفضة المرذولة، لأن الرب قد رفضهم»."]]}, {"l": "Zec 7:11", "n": "", "vs": [[11, "ولكنهم أبوا أن يصغوا، واعتصموا بعنادهم غير عابئين، وأصموا آذانهم لئلا يسمعوا."]]}, {"l": "Zec 7:12", "n": "", "vs": [[12, "وقسوا قلوبهم كالصوان لئلا يسمعوا الشريعة التي أرسلها الرب القدير بروحه على لسان أنبيائه السابقين. فانصب غضب عظيم من لدن الرب القدير."]]}], "kwAr": "الخيول", "noteAr": ""}, {"kw": "for", "raw": "Amo_5:7, Amo_5:11, Amo_5:12; 1Ki_21:7-13; Psa_94:20,Psa_94:21; Isa_59:13, Isa_59:14; Hos_10:4, Hos_10:13; Mic_7:3; Hab_1:3, Hab_1:4; Act_7:51, Act_7:52", "note": "", "refs": [{"l": "Amo 5:7", "n": "", "vs": [[7, "إنكم تحولون العدل مرارة، وتطرحون الحق إلى الأرض."]]}, {"l": "Amo 5:11", "n": "", "vs": [[11, "فلأنكم تطأون المسكين وتبتزون منه رشوة قمح حتى تشيدوا بيوتا من حجارة منحوتة، فإنكم لن تسكنوا فيها، وتغرسوا كروما شهية ولكنكم لن تشربوا من خمرها."]]}, {"l": "Amo 5:12", "n": "", "vs": [[12, "لأنني عالم بكثرة معاصيكم وعظم خطاياكم، إذ أنكم تضايقون البار أيها المرتشون الذين تصدون المسكين عن حقه في ساحة القضاء."]]}, {"l": "1Ki 21:7-13", "n": "", "vs": [[7, "فقالت له إيزابل: «أهكذا تحكم كملك على إسرائيل؟ قم وتناول طعاما وطب نفسا، فأنا أحصل لك على كرم نابوت اليزرعيلي»."], [8, "ثم حررت رسائل باسم أخآب، وختمتها بخاتمه وبعثت بها إلى شيوخ ووجهاء يزرعيل حيث يقيم نابوت."], [9, "وقالت فيها: «ادعوا الشعب للصوم، وأجلسوا نابوت في مكان الصدارة،"], [10, "وأقيموا شاهدي زور ليشهدا أن نابوت جدف على الله وعلى الملك، ثم أخرجوه من المدينة وارجموه حتى يموت»."], [11, "فنفذ شيوخ مدينته ووجهاؤها أوامر إيزابل كما هي واردة في الرسائل التي بعثت بها إليهم."], [12, "فتداعوا للصوم، وأجلسوا نابوت في مكان الصدارة."], [13, "ثم أقبل شاهدا زور وجلسا تجاهه، وشهدا على نابوت أمام الشعب قائلين: «قد جدف نابوت على الله وعلى الملك». فجروه إلى خارج المدينة ورجموه بالحجارة حتى مات."]]}, {"l": "Psa 94:20", "n": "", "vs": [[20, "أيحالفك ملك الشر المختلق إثما ليجعل الظلم شريعة للقضاء؟"]]}, {"l": "Psa 94:21", "n": "", "vs": [[21, "يجتمعون معا للقضاء على حياة الصديق، ويحكمون على البريء بالموت."]]}, {"l": "Isa 59:13", "n": "", "vs": [[13, "تمردنا وتنكرنا للرب. ارتددنا عن اتباع طرق إلهنا، تفوهنا بالظلم والعصيان افتراء، وبكلام زور من القلب."]]}, {"l": "Isa 59:14", "n": "", "vs": [[14, "قد ارتد عنا الإنصاف، ووقف العدل بعيدا، إذ سقط الحق صريعا في الشوارع، والبر لم يستطع الدخول."]]}, {"l": "Hos 10:4", "n": "", "vs": [[4, "ينطقون بكلام لغو ويبرمون عهودا بأقسام باطلة، فيحل بهم القضاء كأعشاب سامة نبتت في أرض محروثة."]]}, {"l": "Hos 10:13", "n": "", "vs": [[13, "لكنكم زرعتم الشر فحصدتم الإثم، وأكلتم ثمار الكذب لأنكم اتكلتم على مركباتكم وعلى كثرة محاربيكم الجبابرة."]]}, {"l": "Mic 7:3", "n": "", "vs": [[3, "تجد أيديهم في ارتكاب الشر، ويسعى الرئيس والقاضي وراء الرشوة، ويملي العظيم عليهم أهواء نفسه، فيتآمرون جميعا على الحق."]]}, {"l": "Hab 1:3", "n": "", "vs": [[3, "لماذا تريني الإثم، وتتحمل رؤية الظلم؟ أينما تلفت أشهد أمامي جورا واغتصابا، ويثور حولي خصام ونزاع."]]}, {"l": "Hab 1:4", "n": "", "vs": [[4, "لذلك بطلت الشريعة، وباد العدل لأن الأشرار يحاصرون الصديق فيصدر الحكم منحرفا عن الحق."]]}, {"l": "Act 7:51", "n": "", "vs": [[51, "ثم قال استفانوس: «ياأصحاب الرقاب الصلبة والقلوب والآذان غير المختونة! إنكم دائما تقاومون الروح القدس. وكما فعل آباؤكم تفعلون!"]]}, {"l": "Act 7:52", "n": "", "vs": [[52, "فأي نبي نجا من اضطهادهم وقد قتلوا الذين أنبأوا بمجيء البار الذي سلمتموه أنتم وقتلتموه!"]]}], "kwAr": "لقد حولتم", "noteAr": ""}], "arS": [["أتجري", ["H7323"]], [" ", []], ["الخيول", ["H5483"]], [" على ", []], ["الصخور", ["H5553"]], ["؟ وهل ", []], ["يحرث", ["H2790"]], [" البحر ", []], ["بثيران", ["H1241"]], ["؟ لقد ", []], ["حولتم", ["H2015"]], [" ", []], ["الحق", ["H4941"]], [" ", []], ["سما", ["H7219"]], [" زعافا، ", []], ["وثمار", ["H6529"]], [" ", []], ["البر", ["H6666"]], [" ", []], ["مرارة", ["H3939"]], [".", []]]}, {"c": 6, "v": 13, "text": "أنتم أيها المبتهجون بالعدم القائلون: أليس بقوتنا ظفرنا؟", "groups": [{"kw": "which", "raw": "Exo_32:18, Exo_32:19; Jdg_9:19, Jdg_9:20,Jdg_9:27, Jdg_16:23-25; 1Sa_4:5; Job_31:25, Job_31:29; Ecc_11:9; Isa_8:6; Jer_9:23, Jer_50:11; Jon_4:6; Hab_1:15, Hab_1:16; Zep_3:11; Luk_12:19, Luk_12:20; Joh_16:20; Jam_4:16; Rev_11:10", "note": "", "refs": [{"l": "Exo 32:18", "n": "", "vs": [[18, "فأجابه موسى: «هذا ليس هتاف نصرة ولا صراخ هزيمة، لكن ما أسمعه هو صوت غناء»."]]}, {"l": "Exo 32:19", "n": "", "vs": [[19, "وما إن اقترب موسى من المخيم وشاهد العجل والرقص حتى احتدم غضبه وألقى باللوحين من يده وكسرهما عند سفح الجبل."]]}, {"l": "Jdg 9:19", "n": "", "vs": [[19, "فإن كنتم قد تصرفتم بحق وصواب مع يربعل وأهل بيته في هذا اليوم، فهنيئا لكم بأبيمالك وهنيئا له بكم."]]}, {"l": "Jdg 9:20", "n": "", "vs": [[20, "وإلا فلتندلع نار من أبيمالك وتلتهم أهل شكيم وسكان القلعة، ولتندلع نار من أهل شكيم ومن سكان القلعة وتلتهم أبيمالك»."]]}, {"l": "Jdg 9:27", "n": "", "vs": [[27, "ثم خرجوا إلى الحقول وجنوا غلات كرومهم وصنعوا منها خمرا، واحتفلوا ودخلوا إلى معبد إلههم وأكلوا وشربوا ولعنوا أبيمالك."]]}, {"l": "Jdg 16:23-25", "n": "", "vs": [[23, "واجتمع أقطاب الفلسطينيين ليحتفلوا بتقديم ذبيحة عظيمة لإلههم داجون قائلين: «إن إلهنا قد أظفرنا بشمشون عدونا»."], [24, "ولما شاهد الشعب شمشون في ذلة، مجدوا إلههم قائلين: «قد أظفرنا إلهنا بعدونا الذي خرب أرضنا، وأكثر من قتلانا»."], [25, "وإذ لعبت بهم النشوة هتفوا: «ادعوا شمشون ليسلينا». فجاءوا بشمشون من السجن فلعب أمامهم ثم أوقفوه بين الأعمدة."]]}, {"l": "1Sa 4:5", "n": "", "vs": [[5, "وما إن دخل تابوت عهد الرب إلى المعسكر حتى هتف جميع الجيش هتافا عظيما ارتجت له الأرض."]]}, {"l": "Job 31:25", "n": "", "vs": [[25, "إن كنت قد اغتبطت بعظم ثروتي، أو لأن يدي فاضتا بوفرة الكسب،"]]}, {"l": "Job 31:29", "n": "", "vs": [[29, "إن كنت قد فرحت بدمار مبغضي أو شمت حين أصابه شر،"]]}, {"l": "Ecc 11:9", "n": "", "vs": [[9, "افرح أيها الشاب في حداثتك، وليمتعك قلبك في أيام شبابك، واتبع أهواء قلبك، وكل ما تشهده عيناك. ولكن اعلم أنه بسبب هذه الأمور كلها يأتي الله بك إلى كرسي القضاء."]]}, {"l": "Isa 8:6", "n": "", "vs": [[6, "«من حيث أن هذا الشعب قد رفض مياه شيلوه الجارية الهادئة، وتهافتوا على رصين وفقح بن رمليا،"]]}, {"l": "Jer 9:23", "n": "", "vs": [[23, "«فلا يفتخرن الحكيم بحكمته، ولا يزهون الجبار بجبروته، ولا الغني بثروته."]]}, {"l": "Jer 50:11", "n": "", "vs": [[11, "لأنكم تبتهجون وتطفرون غبطة يا ناهبي شعبي، وتمرحون كعجلة فوق العشب وتصهلون كالخيل."]]}, {"l": "Jon 4:6", "n": "", "vs": [[6, "فأعد الرب الإله يقطينة نمت وارتفعت حتى ظللت رأس يونان لتقيه من شدة الحر فلا يؤذيه. فابتهج يونان باليقطينة ابتهاجا عظيما."]]}, {"l": "Hab 1:15", "n": "", "vs": [[15, "إن الكلدانيين يستخرجونهم بالشصوص، ويصطادونهم بالشبكة، ويجمعونهم في مصيدتهم متهللين فرحين."]]}, {"l": "Hab 1:16", "n": "", "vs": [[16, "لهذا هم يقربون ذبائح لشباكهم، ويحرقون بخورا لمصائدهم، لأنهم بفضلها يتمتعون بالرفاهية ويتلذذون بأطايب الطعام."]]}, {"l": "Zep 3:11", "n": "", "vs": [[11, "في ذلك اليوم لن يلحقكم العار من جراء ما ارتكبتم من أعمال تمردتم بها علي، لأني سأزيل آنئذ من وسطكم المستخفين المتكبرين، فلا يبقى متشامخ في جبلي المقدس."]]}, {"l": "Luk 12:19", "n": "", "vs": [[19, "وأقول لنفسي: يانفس، عندك خيرات كثيرة مخزونة لسنين عديدة، فاستريحي وكلي واشربي واطر بي!"]]}, {"l": "Luk 12:20", "n": "", "vs": [[20, "ولكن الله قال له: ياغبي، هذه الليلة تطلب نفسك منك، فلمن يبقى ما أعددته؟"]]}, {"l": "Joh 16:20", "n": "", "vs": [[20, "الحق الحق أقول لكم: إنكم ستبكون وتنوحون، أما العالم فيفرح. إنكم ستحزنون، ولكن حزنكم سيتحول إلى فرح."]]}, {"l": "Jam 4:16", "n": "", "vs": [[16, "وإلا، فإنكم تفتخرون متكبرين. وكل افتخار كهذا، هو افتخار رديء."]]}, {"l": "Rev 11:10", "n": "", "vs": [[10, "ويشمت بهما أهل الأرض، فيفرحون كأنهم في عيد، ويتبادلون الهدايا، لأن هذين النبيين كانا قد عذباهم كثيرا."]]}], "kwAr": "المبتهجون", "noteAr": ""}, {"kw": "Have", "raw": "2Ki_13:25, 2Ki_14:12-14, 2Ki_14:25; 2Ch_28:6-8; Isa_7:1, Isa_7:4, Isa_17:3, Isa_17:4, Isa_28:14, Isa_28:15; Dan_4:30", "note": "", "refs": [{"l": "2Ki 13:25", "n": "", "vs": [[25, "فاسترجع يهوآش بن يهوأحاز من يد بنهدد بن حزائيل المدن التي استولى عليها من أبيه يهوأحاز في الحرب، وهزمه يوآش ثلاث مرات، تمكن خلالها من استرداد مدن إسرائيل."]]}, {"l": "2Ki 14:12-14", "n": "", "vs": [[12, "فانهزم يهوذا أمام جيش إسرائيل وهربوا إلى منازلهم،"], [13, "ووقع أمصيا في أسر يهوآش في بيت شمس. وتوجه بجيشه نحو أورشليم وهدم سورها من باب أفرايم إلى باب الزاوية على امتداد أربع مئة ذراع (نحو مئتي متر)"], [14, "واستولى على كل الذهب والفضة، وجميع الآنية الموجودة في هيكل الرب وفي قصر الملك، وأخذ رهائن ثم عاد إلى السامرة."]]}, {"l": "2Ki 14:25", "n": "", "vs": [[25, "وهو الذي استرجع لإسرائيل أراضيها الممتدة من حماة إلى البحر الميت، تحقيقا لكلام الرب الذي نطق به على لسان عبده يونان بن أمتاي النبي من أهل جت حافر،"]]}, {"l": "2Ch 28:6-8", "n": "", "vs": [[6, "وقتل فقح بن رمليا مئة وعشرين ألفا من يهوذا في يوم واحد، وكلهم من المحاربين الأشداء، عقابا لهم، لأنهم تركوا الرب إله آبائهم."], [7, "وقضى زكري بطل أفرايم على معسيا ابن الملك وعزريقام مدير شؤون القصر الملكي، وألقانة التالي للملك في المقام."], [8, "وسبى بنو إسرائيل من أقربائهم بني يهوذا مئتي ألف من النساء والأبناء والبنات، ونهبوا منهم أسلابا وافرة حملوها إلى السامرة."]]}, {"l": "Isa 7:1", "n": "", "vs": [[1, "وفي أيام آحاز بن يوثام بن عزيا ملك يهوذا، صعد رصين ملك أرام مع فقح بن رمليا ملك إسرائيل على أورشليم لمحاربتها، فعجزا عن قهرها."]]}, {"l": "Isa 7:4", "n": "", "vs": [[4, "وقل له: احترس، وتمالك روعك؛ لا تخف ولا يهن قلبك من غضب رصين ملك أرام وابن رمليا المحتدم فإنهما كحطبتين مضطرمتين مدخنتين."]]}, {"l": "Isa 17:3", "n": "", "vs": [[3, "تزول المدينة المحصنة من أفرايم، والملك من دمشق، وتصبح بقية أرام مماثلة لمجد أبناء إسرائيل الزائل، هذا ما يقوله الرب القدير."]]}, {"l": "Isa 17:4", "n": "", "vs": [[4, "في ذلك اليوم يخبو مجد يعقوب وتذوب سمانة بدنه،"]]}, {"l": "Isa 28:14", "n": "", "vs": [[14, "لذلك اسمعوا كلمة الرب أيها المستهزئون المتحكمون في شعب أورشليم:"]]}, {"l": "Isa 28:15", "n": "", "vs": [[15, "لأنكم قلتم: «قد أبرمنا عهدا مع الموت، وعقدنا ميثاقا مع الهاوية، فإن الأشوريين المقتحمين أرضنا لن يسلخونا، لأن السوط الجارف إذا عبر لا يصيبنا لأننا اعتصمنا بالمراوغة ولجأنا إلي النفاق»."]]}, {"l": "Dan 4:30", "n": "", "vs": [[30, "قال: «أليست هذه هي بابل العظيمة التي بنيتها بقوة اقتداري لتكون عاصمة للمملكة، ولجلال مجدي؟»"]]}], "kwAr": "أليس", "noteAr": ""}], "arS": [["أنتم أيها ", []], ["المبتهجون", ["H8055"]], [" ", []], ["بالعدم", ["H1697", "H3808"]], [" ", []], ["القائلون", ["H559"]], [": ", []], ["أليس", ["H3808"]], [" ", []], ["بقوتنا", ["H2392"]], [" ", []], ["ظفرنا", ["H3947"]], ["؟", []]]}, {"c": 6, "v": 14, "text": "ها أنا أثير عليكم أمة يابيت إسرائيل، يقول السيد الرب القدير، فيسومونكم العذاب من مدخل حماة إلى وادي العربة».", "groups": [{"kw": "I will", "raw": "2Ki_15:29, 2Ki_17:6; Isa_7:20, Isa_8:4-8, Isa_10:5, Isa_10:6; Jer_5:15-17; Hos_10:5", "note": "", "refs": [{"l": "2Ki 15:29", "n": "", "vs": [[29, "وفي أيامه هاجم تغلث فلاسر ملك أشور البلاد، واستولى على مدن عيون، وآبل بيت معكة، ويانوح، وقادش، وحاصور، وجلعاد والجليل، وكل أرض نفتالي وسبى أهلها إلى أشور."]]}, {"l": "2Ki 17:6", "n": "", "vs": [[6, "وفي السنة التاسعة من حكم هوشع سقطت السامرة، فسبى ملك أشور الإسرائيليين إلى أشور وأسكنهم في مدينة حلح، وعلى ضفاف نهر خابور في منطقة جوزان، وفي مدن مادي."]]}, {"l": "Isa 7:20", "n": "", "vs": [[20, "في ذلك اليوم يستأجر الرب ملك أشور من عبر نهر الفرات، فيكون الموسى التي يحلق بها الرب شعر رؤوسكم وأرجلكم، وحتى لحاكم أيضا."]]}, {"l": "Isa 8:4-8", "n": "", "vs": [[4, "وقبل أن يعرف الصبي كيف ينادي: ياأبي أو ياأمي، تحمل ثروة دمشق وغنائم السامرة أمام ملك أشور»."], [5, "ثم كلمني الرب ثانية قائلا:"], [6, "«من حيث أن هذا الشعب قد رفض مياه شيلوه الجارية الهادئة، وتهافتوا على رصين وفقح بن رمليا،"], [7, "فإن الرب مزمع أن يغرقهم بمياه النهر الفياضة، أي ملك أشور بكل جبروته، فيكون (كنهر الفرات) يطغى جيشانه على أقنيته ويفيض على ضفافه"], [8, "فيكتسح أرض يهوذا، ويطفو مرتفعا إلى الأعناق، وتنتشر جيوشه في عرض أرضك ياعمانوئيل»."]]}, {"l": "Isa 10:5", "n": "", "vs": [[5, "ويل للأشوريين، قضيب غضبي، الحاملين في أيديهم عصا سخطي."]]}, {"l": "Isa 10:6", "n": "", "vs": [[6, "أرسلهم ضد أمة منافقة، وأوصيهم على شعبي الذي غضبت عليه، ليغنموا غنائمهم ويستولوا على أسلابهم، ويطأوهم كما يطأون الوحل."]]}, {"l": "Jer 5:15-17", "n": "", "vs": [[15, "ها أنا أجلب عليكم ياذرية إسرائيل، أمة قديمة قوية من أرض نائية، تجهلون لغة أهلها ولا تفهمون ما يقولون."], [16, "جعبتها كقبر مفتوح، وكل رجالها جبابرة،"], [17, "فيأكلون حصادكم وطعامكم، ويهلكون أبناءكم وبناتكم، ويلتهمون مواشيكم وقطعانكم، ويأكلون كرومكم وأشجار تينكم، ويدمرون بالسيف مدنكم الحصينة التي عليها تتوكلون."]]}, {"l": "Hos 10:5", "n": "", "vs": [[5, "يخشى أهل السامرة على عجل بيت آون، لأن شعبه يعولون عليه، وكذلك كهنته الخونة الذين ابتهجوا ببهائه الذي سلب منه."]]}], "kwAr": "أثير", "noteAr": ""}, {"kw": "from", "raw": "Num_34:8; 1Ki_8:65; Eze_47:15-17", "note": "", "refs": [{"l": "Num 34:8", "n": "", "vs": [[8, "ومن جبل هور إلى مدخل حماة، ثم تتجه نحو صدد،"]]}, {"l": "1Ki 8:65", "n": "", "vs": [[65, "واحتفل سليمان بالعيد في ذلك الوقت مع سائر إسرائيل وجمهور كبير توافد من مدخل حماة إلى وادي مصر، واستمر الاحتفال أمام الرب أربعة عشر يوما"]]}, {"l": "Eze 47:15-17", "n": "", "vs": [[15, "وهذه هي حدود الأرض نحو الشمال: من البحر الكبير مرورا بطريق حثلون حتى صدد."], [16, "ومن حماة وبيروثة وسبرائم الواقعة بين تخم دمشق وتخم حماة وحصر الوسطى التي على حدود حوران."], [17, "فتمتد الحدود الشمالية من البحر إلى حصر عينان التي على الحدود الشمالية مع حماة وإلى حدود دمشق جنوبا. فتكون هذه هي حدودكم الشمالية."]]}], "kwAr": "من مدخل", "noteAr": ""}, {"kw": "river", "raw": "or, valley", "note": "or, valley", "refs": [], "kwAr": "العربة", "noteAr": "أو: «وادي»."}], "arS": [["ها أنا ", []], ["أثير", ["H6965"]], [" عليكم ", []], ["أمة", ["H1471"]], [" ", []], ["يابيت", ["H1004"]], [" ", []], ["إسرائيل", ["H3478"]], ["، ", []], ["يقول", ["H5002"]], [" ", []], ["السيد", ["H136"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["القدير", ["H6635"]], ["، ", []], ["فيسومونكم", ["H3905"]], [" العذاب من ", []], ["مدخل", ["H4480", "H935"]], [" ", []], ["حماة", ["H2574"]], [" إلى ", []], ["وادي", ["H5158"]], [" ", []], ["العربة", ["H6160"]], ["».", []]]}, {"c": 7, "v": 1, "text": "وهذا ما أراني السيد الرب: ها هو يعد أسراب جراد في بدء نمو الأعشاب المتأخرة بعد أن تم جز نصيب الملك منها.", "groups": [{"kw": "showed", "raw": "Amo_7:4, Amo_7:7, Amo_8:1; Jer_1:11-16, Jer_24:1; Eze_11:25; Zec_1:20", "note": "", "refs": [{"l": "Amo 7:4", "n": "", "vs": [[4, "ثم هذا ما أراني السيد الرب: شاهدت السيد الرب يدعو للمحاكمة بالنار التي لعقت البحر العظيم فجف، وأكلت الحقول."]]}, {"l": "Amo 7:7", "n": "", "vs": [[7, "ثم رأيت، وإذا الرب واقف بجوار حائط مبني، وفي يده ميزان البناء."]]}, {"l": "Amo 8:1", "n": "", "vs": [[1, "ثم أراني السيد الرب في رؤيا سلة لقطاف الثمار."]]}, {"l": "Jer 1:11-16", "n": "", "vs": [[11, "وسألني الرب: «ماذا ترى ياإرميا ؟» فأجبت: «أرى غصن لوز»."], [12, "فقال لي الرب: «قد أحسنت الرؤية، لأني ساهر على كلمتي لأتممها»."], [13, "وعاد الرب يسألني مرة أخرى: «ماذا ترى؟» فأجبت: «أرى قدرا تغلي، ووجهها متحول عن الشمال نحو الجنوب»."], [14, "فقال لي الرب: «من الشمال يكون تدفق الشر على جميع سكان الأرض."], [15, "لأني ها أنا داع جميع عشائر الممالك الشمالية ليأتوا، فينصب كل واحد منهم عرشه عند مدخل بوابات مدينة أورشليم وعلى جميع أسوارها المحيطة بها وعلى جميع مدن يهوذا."], [16, "وأصدر عليهم حكم قضائي من أجل كل شرهم لأنهم تركوني، وأحرقوا بخورا لآلهة أخرى وعبدوا صنعة أيديهم."]]}, {"l": "Jer 24:1", "n": "", "vs": [[1, "وبعدما سبى نبوخذناصر ملك بابل، يكنيا بن يهوياقيم ملك يهوذا مع سائر رؤساء يهوذا، والنجارين والحدادين، من أورشليم، وأتى بهم إلى بابل، أراني الرب في رؤيا سلتي تين موضوعتين أمام هيكل الرب."]]}, {"l": "Eze 11:25", "n": "", "vs": [[25, "فأبلغت أهل السبي بجميع الوحي الذي أعلنه لي الرب."]]}, {"l": "Zec 1:20", "n": "", "vs": [[20, "وأراني الرب أربعة صناع،"]]}], "kwAr": "أراني", "noteAr": ""}, {"kw": "he", "raw": "Amo_4:9; Exo_10:12-16; Isa_33:4; Joe_1:4, Joe_2:25; Nah_3:15-17", "note": "", "refs": [{"l": "Amo 4:9", "n": "", "vs": [[9, "أرسلت الرياح اللافحة واليرقان لتجفف محاصيلكم، والتهم الجراد حدائقكم وكرومكم وأشجار تينكم وزيتونكم. وما رجعتم إلي!"]]}, {"l": "Exo 10:12-16", "n": "", "vs": [[12, "فقال الرب لموسى: «أبسط يدك على أرض مصر لتبتلى بالجراد، فيغطي بلاد مصر ويلتهم كل نبات الأرض المتخلف عن البرد»."], [13, "فمد موسى عصاه على أرض مصر، فأرسل الرب عليهم ريحا شرقية طوال ذلك النهار والليل، وما إن أقبل الصباح حتى حملت الريح الشرقية الجراد."], [14, "فانتشر الجراد في كل بلاد مصر، وحل في جميع تخومها بأسراب عظيمة، فلم يكن له نظير من قبل ولن يحدث مثله في ما بعد."], [15, "فقد غطى وجه كل الأرض حتى أظلمت، والتهم كل عشب فيها وكل أثمار الأشجار التي خلفها البرد، فلم يبق شيء أخضر لا على الأشجار ولا في حقول المزروعات في كل أرجاء مصر."], [16, "عندئذ أسرع فرعون فاستدعى موسى وهرون قائلا: «لقد أخطأت إلى الرب إلهكم وإليكما."]]}, {"l": "Isa 33:4", "n": "", "vs": [[4, "وكما يلتهم الجراد كل ما هو أخضر، هكذا يجمع سلبكم، ويتواثب الناس عليه كتواثب الجنادب."]]}, {"l": "Joe 1:4", "n": "", "vs": [[4, "إن ما تخلف من محصولكم عن هجمات الزحاف التهمته أسراب الجراد، وما تفضل عن أسراب الجراد أكلته الجنادب؛ وما بقي عن الجنادب قضى عليه الطيار."]]}, {"l": "Joe 2:25", "n": "", "vs": [[25, "وأعوضكم عن محاصيل السنين التي التهمها الجراد والجندب والطيار والقمص، جيشي العظيم الذي أطلقته عليكم."]]}, {"l": "Nah 3:15-17", "n": "", "vs": [[15, "هناك تلتهمك النار، ويستأصلك السيف، فيبيدك الأعداء كالجراد. تكاثري كالجراد وكالجنادب."], [16, "قد أضحى تجارك أكثر من كواكب السماء، ولكنهم تبددوا كجراد فرد أجنحته وطار."], [17, "أصبح رؤساؤك كالجنادب، وقادتك كأسراب الجراد المتكومة على سياج في يوم بارد. ما إن تشرق الشمس حتى تطير بعيدا إلى حيث لا يعلم أحد."]]}], "kwAr": "يعد", "noteAr": ""}, {"kw": "grasshoppers", "raw": "or, green worms, Govai in Arabic gabee locusts, probably in their caterpillar state, in which they are most destructive. This is supposed to have been an emblem of the first invasion of the Assyrians.", "note": "or, green worms, Govai in Arabic gabee locusts, probably in their caterpillar state, in which they are most destructive. This is supposed to have been an emblem of the first invasion of the Assyrians.", "refs": [], "kwAr": "جراد", "noteAr": "أو: «ديدان خضراء»؛ وهي «جوافي» أي «جُبي» بالعربية، أي جراد، على الأرجح في طور اليرقة الذي يكون فيه أشد إتلافا. ويُظن أنه كان رمزا للغزو الأول للأشوريين."}, {"kw": "mowings", "raw": "Or rather, feedings or grazings, as the people of the East make no hay. This was probably in the month of March, which is the only time of the year that the Arabs to this day feed their horses with grass.", "note": "Or rather, feedings or grazings, as the people of the East make no hay. This was probably in the month of March, which is the only time of the year that the Arabs to this day feed their horses with grass.", "refs": [], "kwAr": "جز", "noteAr": "أو بالأحرى: «مراعي» أو «رعي»، إذ لا يصنع أهل الشرق تبنا. وكان ذلك على الأرجح في شهر آذار، وهو الوقت الوحيد من السنة الذي يطعم فيه العرب خيولهم العشب با آخر ودون فيه ما ورد من كلام في الكتاب الأول الذي أحرقه يهوياقيم ملك يهوذا."], [29, "وقل فيه عن يهوياقيم ملك يهوذا: هذا ما يعلنه الرب: إنك قد أحرقت هذا الكتاب قائلا: لماذا دونت فيه أن ملك بابل سيزحف على هذه الأرض ويدمرها ويقضي على ما فيها من إنسان وحيوان؟"], [30, "لذلك هكذا يعلن الرب عن يهوياقيم ملك يهوذا: إنه لن يخلفه من ذريته من يجلس على عرش داود، وتطرح جثته خارجا لتكون عرضة للحر في النهار والبرد في الليل."], [31, "وأعاقبه وأعاقب ذريته وعبيده لإثمهم، وأوقع بهم وبجميع أهل أورشليم وبرجال يهوذا جميع ما قضيت به من شر عليهم إذ لم يسمعوا»."], [32, "فأخذ إرميا كتابا آخر وناوله لباروخ بن نيريا فدون فيه عن لسان إرميا كل ما ورد في الكتاب الذي أحرقه يهوياقيم ملك يهوذا بالنار من كلام، وأضاف إليه أيضا عبارات كثيرة مماثلة."]]}], "kwAr": "ويسبى إسرائيل", "noteAr": ""}], "arS": [["لهذا ", []], ["يقول", ["H559"]], [" ", []], ["الرب", ["H3068"]], [": ستصبح ", []], ["امرأتك", ["H802"]], [" ", []], ["عاهرة", ["H2181"]], [" في ", []], ["المدينة", ["H5892"]], ["، ويقتل ", []], ["أبناؤك", ["H1121"]], [" ", []], ["وبناتك", ["H1323"]], [" ", []], ["بالسيف", ["H2719"]], ["، ", []], ["وتقسم", ["H2505"]], [" ", []], ["أرضك", ["H127"]], [" ", []], ["بالحبل", ["H2256"]], [". أما أنت ", []], ["فتموت", ["H4191"]], [" في أرض ", []], ["الأمم", ["H127"]], [" ", []], ["الوثنية", ["H2931"]], ["، ", []], ["ويسبى", ["H1540", "H1540"]], [" ", []], ["إسرائيل", ["H3478"]], [" إلى أرض بعيدة عن دياره».", []]]}, {"c": 8, "v": 1, "text": "ثم أراني السيد الرب في رؤيا سلة لقطاف الثمار.", "groups": [{"kw": "", "raw": "Amo_7:1, Amo_7:4, Amo_7:7", "note": "", "refs": [{"l": "Amo 7:1", "n": "", "vs": [[1, "وهذا ما أراني السيد الرب: ها هو يعد أسراب جراد في بدء نمو الأعشاب المتأخرة بعد أن تم جز نصيب الملك منها."]]}, {"l": "Amo 7:4", "n": "", "vs": [[4, "ثم هذا ما أراني السيد الرب: شاهدت السيد الرب يدعو للمحاكمة بالنار التي لعقت البحر العظيم فجف، وأكلت الحقول."]]}, {"l": "Amo 7:7", "n": "", "vs": [[7, "ثم رأيت، وإذا الرب واقف بجوار حائط مبني، وفي يده ميزان البناء."]]}], "kwAr": "", "noteAr": ""}], "arS": [["ثم ", []], ["أراني", ["H7200"]], [" ", []], ["السيد", ["H136"]], [" ", []], ["الرب", ["H3069"]], [" في رؤيا ", []], ["سلة", ["H3619"]], [" ", []], ["لقطاف", ["H7019"]], [" الثمار.", []]]}, {"c": 8, "v": 2, "text": "وسألني: «ماذا ترى ياعاموس؟» فأجبت: «سلة مليئة بثمار الصيف الناضجة». فقال لي الرب: «لقد دنت نهاية شعبي إسرائيل ولن أعفو عنهم بعد.", "groups": [{"kw": "Amos", "raw": "Amo_7:8; Jer_1:11-14; Eze_8:6, Eze_8:12, Eze_8:17; Zec_1:18-21, Zec_5:2, Zec_5:5, Zec_5:6", "note": "", "refs": [{"l": "Amo 7:8", "n": "", "vs": [[8, "فقال لي الرب: «ياعاموس، ماذا ترى؟» فأجبت: «ميزان البناء». فقال الرب: «ها أنا أمد ميزان البناء في وسط شعبي إسرائيل، ولن أعفو عنهم."]]}, {"l": "Jer 1:11-14", "n": "", "vs": [[11, "وسألني الرب: «ماذا ترى ياإرميا ؟» فأجبت: «أرى غصن لوز»."], [12, "فقال لي الرب: «قد أحسنت الرؤية، لأني ساهر على كلمتي لأتممها»."], [13, "وعاد الرب يسألني مرة أخرى: «ماذا ترى؟» فأجبت: «أرى قدرا تغلي، ووجهها متحول عن الشمال نحو الجنوب»."], [14, "فقال لي الرب: «من الشمال يكون تدفق الشر على جميع سكان الأرض."]]}, {"l": "Eze 8:6", "n": "", "vs": [[6, "وقال لي: «ياابن آدم، هل شاهدت ما يرتكبون: هذه الرجاسات الفظيعة التي يقترفها شعب إسرائيل ليبعدوني عن مقدسي؟ ولكن انتظر، فلا تلبث أن تشهد أرجاسا أفظع»."]]}, {"l": "Eze 8:12", "n": "", "vs": [[12, "فقال لي: «أرأيت ياابن آدم ما يقترفه كل واحد من شيوخ شعب إسرائيل في محراب تماثيله المنحوتة قائلين: الرب لا يرانا! الرب قد هجر الأرض."]]}, {"l": "Eze 8:17", "n": "", "vs": [[17, "فقال لي: «أشهدت ياابن آدم؟ أقليل ما ارتكبه شعب يهوذا من رجاسات هنا؟ فقد عاثوا في الأرض فسادا، وثابروا على إغاظتي، وقربوا كل ما هو منتن في هيكلي"]]}, {"l": "Zec 1:18-21", "n": "", "vs": [[18, "ثم رفعت نظري وإذا بي أرى أربعة قرون."], [19, "فقلت للملاك: «ما هذه؟» فأجاب: «هذه هي القرون التي بددت أهل يهوذا وإسرائيل وأورشليم»."], [20, "وأراني الرب أربعة صناع،"], [21, "فسألت: «ما الذي جاء يفعله هؤلاء الرجال؟» فأجاب: «هذه هي القرون (أي الأمم) التي بددت أهل يهوذا حتى ذلت كل نفس. أما هؤلاء الصناع فقد أقبلوا ليوقعوا الرعب في نفوس الأمم التي هاجمت أرض يهوذا ليطردوا أهلها»."]]}, {"l": "Zec 5:2", "n": "", "vs": [[2, "فسألني الملاك: «ماذا ترى؟» فأجبت: «أرى درجا طائرا، طوله عشرون ذراعا (نحو عشرة أمتار) وعرضه عشر أذرع (نحو خمسة أمتار)»."]]}, {"l": "Zec 5:5", "n": "", "vs": [[5, "ثم قال لي الملاك الذي كلمني: «ارفع عينيك وانظر إلى هذا الشيء المقبل»."]]}, {"l": "Zec 5:6", "n": "", "vs": [[6, "فسألت: «ما هذا؟» فأجاب: «إنه مكيال، وهو رمز إثمهم في الأرض كلها»."]]}], "kwAr": "ياعاموس", "noteAr": ""}, {"kw": "A basket", "raw": "Deu_26:1-4; 2Sa_16:1, 2Sa_16:2; Isa_28:4; Jer_24:1-3, Jer_40:10; Mic_7:1", "note": "", "refs": [{"l": "Deu 26:1-4", "n": "", "vs": [[1, "ومتى بلغتم الأرض التي يهبها الرب إلهكم لكم ميراثا وامتلكتموها واستوطنتم فيها،"], [2, "فاجمعوا من أول كل ثمر تغله أرضكم التي يهبها الرب إلهكم لكم، وضعوه في سلال، وامضوا إلى الموضع الذي يختاره الرب إلهكم ليحل فيه اسمه."], [3, "ويأتي صاحب التقدمة إلى الكاهن المعين ويقول: أعترف اليوم للرب إلهك أني قد جئت إلى الأرض التي حلف الرب لآبائنا أن يهبها لنا."], [4, "فيتناول الكاهن السلة من يده ويضعها أمام مذبح الرب إلهكم،"]]}, {"l": "2Sa 16:1", "n": "", "vs": [[1, "وعندما عبر داود قمة الجبل لاقاه صيبا خادم مفيبوشث بحمارين محملين بمئتي رغيف خبز ومئة عنقود زبيب ومئة قرص تين وزق خمر."]]}, {"l": "2Sa 16:2", "n": "", "vs": [[2, "فقال الملك لصيبا: «لمن كل هذا؟» فأجاب صيبا: «الحماران لركوب عائلة الملك، والخبز والتين ليأكلها الرجال، والخمر لمن أعيا في الصحراء»."]]}, {"l": "Isa 28:4", "n": "", "vs": [[4, "وتضحى زهرة جمالها المجيد التي تكلل رأس الوادي الخصيب كباكورة التين قبل موسم الصيف التي يراها الناظر فيقتطفها ويبتلعها."]]}, {"l": "Jer 24:1-3", "n": "", "vs": [[1, "وبعدما سبى نبوخذناصر ملك بابل، يكنيا بن يهوياقيم ملك يهوذا مع سائر رؤساء يهوذا، والنجارين والحدادين، من أورشليم، وأتى بهم إلى بابل، أراني الرب في رؤيا سلتي تين موضوعتين أمام هيكل الرب."], [2, "وكان في إحدى السلتين تين جيد كالتين الباكوري، وفي الأخرى تين رديء تعاف النفس أكله من فرط رداءته."], [3, "فقال لي الرب: «ماذا ترى ياإرميا؟» فأجبت: «تينا: الجيد منه يمتاز بجودته، والرديء منه تعافه النفس لفرط رداءته»."]]}, {"l": "Jer 40:10", "n": "", "vs": [[10, "أما أنا فسأسكن في المصفاة، وأتولى الأمر عنكم لدى الكلدانيين الذين يفدون إلينا أما أنتم فاجمعوا خمرا وقطاف الصيف والزيت وادخروها في أوعيتكم وأقيموا في مدنكم التي أخذتموها»."]]}, {"l": "Mic 7:1", "n": "", "vs": [[1, "ويل لي، فقد صرت كرجل جائع جاء يبحث عن جني الصيف وبقايا قطاف العنب، فلم يجد عنقودا للأكل ولا شيئا من باكورة التين مما تشتهيه نفسي."]]}], "kwAr": "سلة", "noteAr": ""}, {"kw": "the end", "raw": "There is here not only an allusion to the nature of the summer fruit, which must be eaten as soon as gathered, but also a paronomasia upon the words kayitz summer fruit, and ketz an end. Jer_1:12, Jer_5:31; Lam_4:18; Eze_7:2, Eze_3:7, Eze_3:10, Eze_12:23, Eze_29:8", "note": "There is here not only an allusion to the nature of the summer fruit, which must be eaten as soon as gathered, but also a paronomasia upon the words kayitz summer fruit, and ketz an end. Jer_1:12, Jer_5:31; Lam_4:18; Eze_7:2, Eze_3:7, Eze_3:10, Eze_12:23, Eze_29:8", "refs": [{"l": "Jer 1:12", "n": "", "vs": [[12, "فقال لي الرب: «قد أحسنت الرؤية، لأني ساهر على كلمتي لأتممها»."]]}, {"l": "Jer 5:31", "n": "", "vs": [[31, "فالأنبياء يتنبأون زورا، والكهنة يتصرفون بمقتضى أحكامهم، وشعبي أحب مثل هذا. ولكن ماذا تصنعون في نهاية المطاف؟»"]]}, {"l": "Lam 4:18", "n": "", "vs": [[18, "تصيد الرجال خطواتنا حتى لا نخطو في شوارعنا. آذنت نهايتنا، وتمت أيامنا وأزفت خاتمتنا."]]}, {"l": "Eze 7:2", "n": "", "vs": [[2, "«ياابن آدم، هذا ما يعلنه الرب لأرض إسرائيل. النهاية قد أزفت على زوايا الأرض الأربع."]]}, {"l": "Eze 3:7", "n": "", "vs": [[7, "لكن شعب إسرائيل لا يودون الاستماع لك، لأنهم لا يودون الاستماع لي، لأنهم جميعا معاندون قساة القلوب."]]}, {"l": "Eze 3:10", "n": "", "vs": [[10, "ثم أردف قائلا: «ياابن آدم، استوعب في قلبك كل ما أحدثك به من كلام، واستمع إليه بأذنين مرهفتين."]]}, {"l": "Eze 12:23", "n": "", "vs": [[23, "لذلك قل لهم: هذا ما يعلنه السيد الرب: ها أنا قد أبطلت هذا المثل فلا يعودون يرددونه في إسرائيل، بل قل لهم: قد أزفت الأيام وحان تحقيق كلام كل رؤيا،"]]}, {"l": "Eze 29:8", "n": "", "vs": [[8, "لذلك ها أنا أجلب عليك سيفا وأستأصل منك الإنسان والحيوان،"]]}], "kwAr": "نهاية", "noteAr": "هنا لا إشارة إلى طبيعة ثمر الصيف الذي يجب أكله حال قطافه فحسب، بل تجنيس أيضا بين كلمتي «قيض» أي ثمر الصيف و«قيتس» أي نهاية. انظر إر 1: 12؛ 5: 31؛ مرا 4: 18؛ حز 7: 2، 3، 10؛ 12: 23؛ 29: 8"}, {"kw": "I will not", "raw": "Amo_7:8", "note": "", "refs": [{"l": "Amo 7:8", "n": "", "vs": [[8, "فقال لي الرب: «ياعاموس، ماذا ترى؟» فأجبت: «ميزان البناء». فقال الرب: «ها أنا أمد ميزان البناء في وسط شعبي إسرائيل، ولن أعفو عنهم."]]}], "kwAr": "ولن أعفو", "noteAr": ""}], "arS": [["وسألني: «", []], ["ماذا", ["H4100"]], [" ", []], ["ترى", ["H7200"]], [" ", []], ["ياعاموس", ["H5986"]], ["؟» فأجبت: «", []], ["سلة", ["H3619"]], [" مليئة بثمار ", []], ["الصيف", ["H7019"]], [" الناضجة». فقال لي ", []], ["الرب", ["H3068"]], [": «لقد ", []], ["دنت", ["H935"]], [" ", []], ["نهاية", ["H7093"]], [" ", []], ["شعبي", ["H5971"]], [" ", []], ["إسرائيل", ["H3478"]], [" ", []], ["ولن", ["H3254"]], [" ", []], ["أعفو", ["H5674"]], [" عنهم ", []], ["بعد", ["H5750"]], [".", []]]}, {"c": 8, "v": 3, "text": "فتتحول أغاني قصورهم إلى عويل في ذلك اليوم، وتكثر الجثث ويطرحونها في كل مكان بصمت».", "groups": [{"kw": "the songs", "raw": "Amo_8:10, Amo_5:23; Hos_10:5, Hos_10:6; Joe_1:5, Joe_1:11, Joe_1:13; Zec_11:1-3", "note": "", "refs": [{"l": "Amo 8:10", "n": "", "vs": [[10, "أحول أعيادكم إلى مآتم، وأغانيكم إلى مراث، وألبسكم المسوح على أحقائكم، وأفشي الصلع في كل رأس، فتصبح أعيادكم كمناحة على وحيد، ونهايتها كيوم مفعم بالمرارة."]]}, {"l": "Amo 5:23", "n": "", "vs": [[23, "أبعدوا عني جلبة أغانيكم لأني لن أصغي إلى نغمات رباباتكم."]]}, {"l": "Hos 10:5", "n": "", "vs": [[5, "يخشى أهل السامرة على عجل بيت آون، لأن شعبه يعولون عليه، وكذلك كهنته الخونة الذين ابتهجوا ببهائه الذي سلب منه."]]}, {"l": "Hos 10:6", "n": "", "vs": [[6, "سيحمل هذا العجل إلى أشور هدية للملك العظيم، فيخزى أفرايم ويعتري إسرائيل الخجل من اتكاله عليه."]]}, {"l": "Joe 1:5", "n": "", "vs": [[5, "اصحوا أيها السكارى، وابكوا ياجميع مدمني الخمر على العصير لأنه قد انقطع عن أفواهكم."]]}, {"l": "Joe 1:11", "n": "", "vs": [[11, "اخزوا أيها الحراثون وأعولوا أيها الكرامون على الحنطة والشعير، لأن حصاد الحقل قد تلف."]]}, {"l": "Joe 1:13", "n": "", "vs": [[13, "أيها الكهنة اتشحوا بالمسوح ونوحوا. ولولوا ياخدام المذبح. تعالوا وبيتوا ليلتكم بالمسوح ياخدام إلهي، لأن تقدمات الدقيق والخمر قد منعت عن هيكل الله."]]}, {"l": "Zec 11:1-3", "n": "", "vs": [[1, "افتح أبوابك يالبنان حتى تلتهم النار أرزك."], [2, "انتحب أيها السرو لأن الأرز قد تهاوى، والعظماء قد هلكوا. انتحب يابلوط باشان لأن الغابات الكثيفة دمرت."], [3, "استمعوا إلى نواح الرعاة (أي الحكام) لأن مرابعهم الثرية قد تلفت. أنصتوا إلى زمجرة الأسود لأن أجمات وادي الأردن قد صارت خرابا."]]}], "kwAr": "أغاني", "noteAr": ""}, {"kw": "shall be howlings", "raw": "Heb. shall howl", "note": "Heb. shall howl", "refs": [], "kwAr": "عويل", "noteAr": "بالعبرية: «تولول»."}, {"kw": "many", "raw": "Amo_4:10; Isa_37:36; Jer_9:21, Jer_9:22; Nah_3:3", "note": "", "refs": [{"l": "Amo 4:10", "n": "", "vs": [[10, "أصبتكم بالأوبئة التي أصيبت بها مصر، وقضيت على شبابكم بالسيف وسبيت خيولكم، وجعلت نتن معسكركم يزكم أنوفكم. ولكنكم لم ترجعوا إلي تائبين يقول الرب."]]}, {"l": "Isa 37:36", "n": "", "vs": [[36, "وحدث في تلك الليلة أن ملاك الرب قتل مئة وخمسة وثمانين ألفا من جيش الأشوريين، وما إن طلع الصباح حتى كانت جثث القتلى تملأ المكان"]]}, {"l": "Jer 9:21", "n": "", "vs": [[21, "فإن الموت قد تسلق إلى كوانا وتسلل إلى قصورنا، فاستأصل الأطفال من الشوارع والشبان من الساحات."]]}, {"l": "Jer 9:22", "n": "", "vs": [[22, "وهذا ما يعلنه الرب: «ستتهاوى جثث الناس مثل نفاية على وجه الحقل، وتتساقط كقبضات وراء الحاصد، وليس من يجمعها»."]]}, {"l": "Nah 3:3", "n": "", "vs": [[3, "وفرسان واثبة، وسيوف لامعة ورماح بارقة وكثرة قتلى وأكوام جثث لا نهاية لها، بها يتعثرون."]]}], "kwAr": "الجثث", "noteAr": ""}, {"kw": "they shall", "raw": "Amo_6:9, Amo_6:10; Jer_22:18", "note": "", "refs": [{"l": "Amo 6:9", "n": "", "vs": [[9, "فيكون إذا بقي عشرة رجال في بيت واحد، أنهم يلقون حتفهم."]]}, {"l": "Amo 6:10", "n": "", "vs": [[10, "وعندما يقبل عم الميت المشرف على إحراق الجثث 15", "n": "", "vs": [[15, "وأضاف إرميا النبي مخاطبا حننيا المتنبيء: «اسمع ياحننيا، هذا ما يعلنه الرب: إن الرب لم يبعثك، وأنت جعلت هذا الشعب يصدق كذبك."]]}], "kwAr": "استمعوا", "noteAr": ""}, {"kw": "swallow", "raw": "Amo_2:6, Amo_5:11; Psa_12:5, Psa_14:4, Psa_56:1, Psa_140:12; Pro_30:14; Isa_32:6, Isa_32:7; Mat_23:14; Jam_5:6", "note": "", "refs": [{"l": "Amo 2:6", "n": "", "vs": [[6, "هذا ما يقوله الرب: من أجل معاصي إسرائيل الثلاث والأربع لن أرد عنهم سخطي، لأنهم باعوا الصديق لقاء الفضة، والبائس مقابل نعلين."]]}, {"l": "Amo 5:11", "n": "", "vs": [[11, "فلأنكم تطأون المسكين وتبتزون منه رشوة قمح حتى تشيدوا بيوتا من حجارة منحوتة، فإنكم لن تسكنوا فيها، وتغرسوا كروما شهية ولكنكم لن تشربوا من خمرها."]]}, {"l": "Psa 12:5", "n": "", "vs": [[5, "ولكن الرب يقول: إنقاذا للمساكين، واستجابة لتنهدات المظلومين، أهب الآن لأفرج كربة المتضايقين."]]}, {"l": "Psa 14:4", "n": "", "vs": [[4, "أليس لدى جميع فاعلي الإثم معرفة؟ أولئك الذين يأكلون شعبي كما يأكلون خبزا، والرب لا يطلبون."]]}, {"l": "Psa 56:1", "n": "", "vs": [[1, "ارحمني يارب فإن الإنسان يجد في مطاردتي لاَفتراسي. يحاربني اليوم كله ويضايقني."]]}, {"l": "Psa 140:12", "n": "", "vs": [[12, "قد علمت أن الرب ينصف دعوى المساكين ويحكم بالحق للمحتاجين."]]}, {"l": "Pro 30:14", "n": "", "vs": [[14, "رب جيل أسنانه مرهفة كالسيوف، وأنيابه حادة كالسكاكين، ليفترس المساكين في الأرض والبائسين من بين أبناء البشر."]]}, {"l": "Isa 32:6", "n": "", "vs": [[6, "لأن اللئيم ينطق باللؤم، وقلبه يتآمر بالإثم ليرتكب شرا وليفتري على الرب، تاركا المتضور جوعا من غير شبع، وحارما الظاميء من الشرب."]]}, {"l": "Isa 32:7", "n": "", "vs": [[7, "إن أساليب الماكر شريرة، ومؤامراته خبيثة ليهلك البائسين بالأكاذيب، حتى لو كان المسكين ينطق بالحق."]]}, {"l": "Mat 23:14", "n": "", "vs": [[14, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تلتهمون بيوت الأرامل وتتذرعون بإطالة صلواتكم. لذلك ستنزل بكم دينونة أقسى!"]]}, {"l": "Jam 5:6", "n": "", "vs": [[6, "والبريء حكمتم عليه وقتلتموه، وهو لا يقاومكم!"]]}], "kwAr": "الدائسون", "noteAr": ""}], "arS": [["استمعوا", ["H8085"]], [" ", []], ["هذا", ["H2063"]], [" أيها ", []], ["الدائسون", ["H7602"]], [" على ", []], ["البائسين", ["H34"]], ["، يامن حاولتم أن ", []], ["تقضوا", ["H7673"]], [" على ", []], ["فقراء", ["H6041"]], [" ", []], ["الأرض", ["H776"]], ["،", []]]}, {"c": 8, "v": 5, "text": "قائلين: «متى ينقضي أول الشهر حتى نبيع الحنطة؟ متى يمضي السبت لنعرض القمح في السوق، فنعمد إلى تصغير حجم مكيال الإيفة ونرفع الأسعار، ونستعمل ميزانا مغشوشا.", "groups": [{"kw": "When", "raw": "Num_10:10, Num_28:11-15; 2Ki_4:23; Psa_81:3, Psa_81:4; Isa_1:13; Col_2:16", "note": "", "refs": [{"l": "Num 10:10", "n": "", "vs": [[10, "انفخوا في الأبواق أيضا في أيام فرحكم وفي أعيادكم ورؤوس شهوركم، وكذلك على محرقاتكم وذبائح سلامتكم، فتكون لكم تذكارا أمامي. أنا الرب إلهكم»."]]}, {"l": "Num 28:11-15", "n": "", "vs": [[11, "وتقربون أيضا في اليوم الأول من كل شهر محرقة للرب من ثورين وكبش واحد، وسبعة حملان حولية صحيحة."], [12, "وتقدمة من ثلاثة أعشار (نحو سبعة لترات ونصف اللتر) من دقيق معجون بزيت، لكل ثور، وتقدمة من عشرين (نحو خمسة لترات) من دقيق معجون بزيت للكبش الواحد."], [13, "وتقدمة من عشر واحد (نحو لتر ين ونصف اللتر) من دقيق معجون بزيت لكل حمل، فتكون محرقة رائحة رضى وقربانا للرب."], [14, "وتكون سكائب خمرها نصف الهين (نحو لترين) للثور، وثلث الهين (نحو لتر وثلث اللتر) للكبش، وربع الهين (نحو لتر) للحمل. هذه محرقة تقرب كل شهر من أشهر السنة."], [15, "كذلك تقدمون تيسا واحدا من المعز ذبيحة خطيئة للرب علاوة على المحرقة الدائمة المقربة مع سكيبها من الخمر."]]}, {"l": "2Ki 4:23", "n": "", "vs": [[23, "فسألها: «لماذا تذهبين إليه اليوم، مع أنه ليس رأس الشهر ولا سبتا؟» فأجابت: «للخير!»"]]}, {"l": "Psa 81:3", "n": "", "vs": [[3, "انفخوا بالبوق في أول الشهر، في الوقت المعين ليوم عيدنا،"]]}, {"l": "Psa 81:4", "n": "", "vs": [[4, "لأن هذا فريضة مرسومة على إسرائيل، وحكم يوجبه إله يعقوب."]]}, {"l": "Isa 1:13", "n": "", "vs": [[13, "كفوا عن تقديم قرابين باطلة، فالبخور رجس لي، وكذلك رأس الشهر والسبت والدعاء إلى المحفل، فأنا لا أطيق الاعتكاف مع ارتكاب الإثم."]]}, {"l": "Col 2:16", "n": "", "vs": [[16, "فلا يحكم عليكم أحد في قضية الأكل والشرب، أو في القضايا المتعلقة بالأعياد ورؤوس الشهور والسبوت؛"]]}], "kwAr": "متى ينقضي", "noteAr": ""}, {"kw": "new moon", "raw": "or, month", "note": "or, month", "refs": [], "kwAr": "أول الشهر", "noteAr": "أو: «شهر»."}, {"kw": "be gone", "raw": "Mal_1:13", "note": "", "refs": [{"l": "Mal 1:13", "n": "", "vs": [[13, "ثم قلتم: ما هذه المشقة التي نتكبدها؟ وتأففتم علي، يقول الرب القدير. وتقربون إلي ما استوليتم عليه ظلما وما هو أعرج أو مريض، فيكون هذا تقدمة قربانكم فهل أقبل هذا من أيديكم؟ يقول الرب."]]}], "kwAr": "يمضي", "noteAr": ""}, {"kw": "and the", "raw": "Exo_20:8-10; Neh_13:15-21; Isa_58:13; Rom_8:6, Rom_8:7", "note": "", "refs": [{"l": "Exo 20:8-10", "n": "", "vs": [[8, "اذكر يوم السبت لتقدسه،"], [9, "ستة أيام تعمل وتقوم بجميع مشاغلك،"], [10, "أما اليوم السابع فتجعله سبتا للرب إلهك، فلا تقم فيه بأي عمل أنت أو ابنك أو ابنتك أو عبدك أو أمتك أو بهيمتك أو النزيل المقيم داخل أبوابك."]]}, {"l": "Neh 13:15-21", "n": "", "vs": [[15, "وفي تلك الأيام شاهدت في أرض يهوذا قوما يدوسون المعاصر في يوم السبت، ويأتون بأكياس الحنطة ويحملونها على الحمير، وكذلك بأحمال العنب والتين وسواها من المحاصيل التي يجلبونها إلى أورشليم في يوم السبت، فحذرتهم من بيع الطعام في ذلك اليوم."], [16, "كما رأيت بعض أهل صور ممن يقيمون في أورشليم يأتون بالسمك وغيره من صنوف البضائع لبيعها إلى سكان يهوذا وأهل أورشليم في يوم السبت."], [17, "عندئذ خاصمت أشراف يهوذا وقلت لهم: «أي شر ترتكبونه إذ تدنسون يوم السبت؟"], [18, "ألم يتصرف آباؤكم هكذا؟ ألم يصب إلهنا كل غضبه علينا وعلى هذه المدينة؟ ومع ذلك فإنكم تجلبون مزيدا من السخط على إسرائيل إذ تدنسون يوم السبت»."], [19, "وعندما زحف الظلام على أبواب أورشليم عند حلول السبت، أمرت بإغلاق البوابات والامتناع عن فتحها حتى انقضاء يوم السبت وكلفت بعض رجالي بحراسة البوابات لئلا يتم إدخال بعض الأحمال في يوم السبت،"], [20, "فبات التجار وباعة مختلف البضائع خارج أورشليم مرة ومرتين،"], [21, "فأنذرتهم قائلا: «لماذا تبيتون أمام السور؟ إن عدتم إلى ذلك فإني ألقي القبض عليكم». ومنذ ذلك الحين كفوا عن المجيء في يوم السبت."]]}, {"l": "Isa 58:13", "n": "", "vs": [[13, "إن كففت قدمك عن نقض يوم السبت، وعن السعي وراء مرامك في يومي المقدس، ودعوت يوم السبت يوم مسرة للرب، وجعلته يوما مكرما لله. إن أكرمته ولم تسلك حسب أهوائك أو تلتمس قضاء مصالحك، أو تنفقه في لغو الكلام،"]]}, {"l": "Rom 8:6", "n": "", "vs": [[6, "فاهتمام الجسد هو موت؛ وأما اهتمام الروح فهو حياة وسلام."]]}, {"l": "Rom 8:7", "n": "", "vs": [[7, "لأن اهتمام الجسد هو عداوة لله، إذ إنه لا يخضع لناموس الله، بل لا يستطيع ذلك."]]}], "kwAr": "السبت", "noteAr": ""}, {"kw": "set forth", "raw": "Heb. open", "note": "Heb. open", "refs": [], "kwAr": "لنعرض", "noteAr": "بالعبرية: «نفتح»."}, {"kw": "making", "raw": "Lev_19:36; Deu_25:13-16; Pro_11:1, Pro_16:11, Pro_20:23; Eze_45:10-12; Mic_6:10,Mic_6:11", "note": "", "refs": [{"l": "Lev 19:36", "n": "", "vs": [[36, "بل استخدموا موازين عادلة وعيارات عادلة ومكاييل عادلة، فأنا الرب إلهكم الذي أخرجكم من ديار مصر."]]}, {"l": "Deu 25:13-16", "n": "", "vs": [[13, "لا تحتفظ في كيسك بمعيارين مختلفين كبير وصغير،"], [14, "ولا يكن لك في بيتك مكيالان مختلفان كبير وصغير،"], [15, "بل لتكن أوزانك ومكاييلك صحيحة لا غش فيها، لتطول أيامك على الأرض التي يهبها لك الرب إلهك،"], [16, "لأن كل من غش في المكاييل أو الأوزان يصبح مكروها لدى الرب إلهكم."]]}, {"l": "Pro 11:1", "n": "", "vs": [[1, "الميزان المغشوش رجس لدى الرب، والمكيال الوافي يحوز رضاه."]]}, {"l": "Pro 16:11", "n": "", "vs": [[11, "للرب ميزان العدل وقسطاسه، وجميع معايير كيس التاجر من صنعه."]]}, {"l": "Pro 20:23", "n": "", "vs": [[23, "التلاعب بالمعايير رجس عند الرب، وميزان الغش أمر رديء."]]}, {"l": "Eze 45:10-12", "n": "", "vs": [[10, "لتكن لكم موازين عادلة وإيفة حق وبث حق."], [11, "فتكون الإيفة والبث متساويتين في المقدار، وتسع كل منهما عشر الحومر. ويكون الحومر هو المكيال المعتمد."], [12, "ويكون الشاقل معادلا لعشرين جيرة، فتكون قيمة الخمسة شواقل خمسة شواقل، وقيمة العشرة شواقل عشرة شواقل، وقيمة المن خمسين شاقلا."]]}, {"l": "Mic 6:10", "n": "", "vs": [[10, "في بيوت الأشرار كنوز مسروقة وموازين مغشوشة."]]}, {"l": "Mic 6:11", "n": "", "vs": [[11, "فكيف أبرىء ذا المعايير المغشوشة، صاحب كيس الموازين الناقصة؟"]]}], "kwAr": "تصغي ": [[34, "أعطوا مجدا لله فهو بسط جلاله على إسرائيل، وقوته في الغمام."]]}, {"l": "Luk 2:32", "n": "", "vs": [[32, "نور هداية للأمم ومجدا لشعبك إسر ائيل»."]]}], "kwAr": "أقسم", "noteAr": ""}, {"kw": "I will", "raw": "Exo_17:16; 1Sa_15:2, 1Sa_15:3; Psa_10:11; Isa_43:25; Jer_17:1, Jer_31:34; Hos_7:2, Hos_8:13, Hos_9:9", "note": "", "refs": [{"l": "Exo 17:16", "n": "", "vs": [[16, "قائلا: «لأن يدا ارتفعت ضد عرش الرب، فإن الرب سيحارب العمالقة جيلا بعد جيل»."]]}, {"l": "1Sa 15:2", "n": "", "vs": [[2, "هذا ما يقوله رب الجنود: إني مزمع أن أعاقب عماليق جزاء ما ارتكبه في حق الإسرائيليين حين تصدى لهم في الطريق عند خروجهم من مصر."]]}, {"l": "1Sa 15:3", "n": "", "vs": [[3, "فاذهب الآن وهاجم عماليق واقض على كل ماله. لا تعف عن أحد منهم بل اقتلهم جميعا رجالا ونساء، وأطفالا ورضعا، بقرا وغنما، جمالا وحميرا»."]]}, {"l": "Psa 10:11", "n": "", "vs": [[11, "يقول في قلبه: الله غافل. قد حجب وجهه، ولن يرى ما يجري"]]}, {"l": "Isa 43:25", "n": "", "vs": [[25, "أنا، أنا هو الماحي ذنوبك من أجل ذاتي، وخطاياك لن أذكرها."]]}, {"l": "Jer 17:1", "n": "", "vs": [[1, "»قد دونت خطيئة يهوذا بقلم من حديد، ونقشت برأس من الماس على ألواح قلوبهم وعلى قرون المذابح،"]]}, {"l": "Jer 31:34", "n": "", "vs": [[34, "ولا يحض في ما بعد كل واحد قريبه قائلا: اعرف الرب إلهك لأنهم جميعا سيعرفونني، من صغيرهم إلى كبيرهم، لأني سأصفح عن إثمهم ولن أذكر خطاياهم من بعد»."]]}, {"l": "Hos 7:2", "n": "", "vs": [[2, "ولكنهم لا يدركون أني أتذكر سوء أعمالهم. ها هي أعمالهم تحدق بهم، وهي دائما ماثلة أمامي."]]}, {"l": "Hos 8:13", "n": "", "vs": [[13, "يذبحون الذبائح المقربة إلي ليأكلوا لحومها، لا ليقدموها إلي. ولكني لا أسر بها. والآن أذكر إثمهم وأعاقبهم على خطاياهم وإلى مصر يرجعون."]]}, {"l": "Hos 9:9", "n": "", "vs": [[9, "قد أوغلوا في الفساد كما حدث في أيام جبعة، لهذا سيذكر إثمهم ويعاقبهم على خطاياهم."]]}], "kwAr": "لن أنسى", "noteAr": ""}], "arS": [["قد ", []], ["أقسم", ["H7650"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["بعزة", ["H1347"]], [" ", []], ["يعقوب", ["H3290"]], [" قائلا: «", []], ["لن", ["H5331"]], [" ", []], ["أنسى", ["H7911"]], [" شيئا من ", []], ["مساوئهم", ["H4639"]], [".", []]]}, {"c": 8, "v": 8, "text": "ألا ترتعب الأرض من جراء ذلك، فينوح كل ساكن فيها، فتطمو كنهر، وترتفع وتنخفض كنيل مصر؟", "groups": [{"kw": "the land", "raw": "It is supposed that an earthquake is here intended; the rising and falling of the ground, with a wave-like motion, and its leaving its proper place and bounds, in consequence of an earthquake, being justly and beautifully compared to the swelling, overflowing, and subsiding of the Nile. Psa_18:7, Psa_60:2, Psa_60:3, Psa_114:3-7; Isa_5:25, Isa_24:19, Isa_24:20; Jer_4:24-26; Mic_1:3-5; Nah_1:5, Nah_1:6; Hab_3:5-8; Hag_2:6, Hag_2:7", "note": "It is supposed that an earthquake is here intended; the rising and falling of the ground, with a wave-like motion, and its leaving its proper place and bounds, in consequence of an earthquake, being justly and beautifully compared to the swelling, overflowing, and subsiding of the Nile. Psa_18:7, Psa_60:2, Psa_60:3, Psa_114:3-7; Isa_5:25, Isa_24:19, Isa_24:20; Jer_4:24-26; Mic_1:3-5; Nah_1:5, Nah_1:6; Hab_3:5-8; Hag_2:6, Hag_2:7", "refs": [{"l": "Psa 18:7", "n": "", "vs": [[7, "عندئذ ارتجت الأرض وتزلزلت. ارتجفت أساسات الجبال واهتزت، لأن الرب غضب."]]}, {"l": "Psa 60:2", "n": "", "vs": [[2, "زلزلت الأرض وصدعتها، فاجبر كسرها لأنها تهتز."]]}, {"l": "Psa 60:3", "n": "", "vs": [[3, "جعلت شعبك يعاني المشقات. وترنحنا تحت وقع ضرباتك كالسكارى."]]}, {"l": "Psa 114:3-7", "n": "", "vs": [[3, "رأى البحر الأحمر ذلك فهرب، وتراجع نهر الأردن إلى الوراء."], [4, "قفزت الجبال كأنها كباش، والتلال كأنها حملان."], [5, "ما لك يابحر قد هربت، وياأردن قد رجعت إلى الوراء؟"], [6, "مالك ياجبال تقفزين كالكباش، وياتلال كالحملان؟"], [7, "تزلزلي ياأرض في حضرة الرب إله يعقوب."]]}, {"l": "Isa 5:25", "n": "", "vs": [[25, "لذلك احتدم غضب الرب ضد شعبه، فمد يده عليهم وضربهم، فارتعشت الجبال، وأصبحت جثث موتاهم كالقاذورات في الشوارع. ومع ذلك كله لم يرتد غضبه ولم تبرح يده ممدودة بالعقاب."]]}, {"l": "Isa 24:19", "n": "", "vs": [[19, "فالأرض متصدعة، والمسكونة متشققة ومتزلزلة."]]}, {"l": "Isa 24:20", "n": "", "vs": [[20, "ترنحت الأرض كالسكارى، وتمايلت كخيمة الناطور وناءت تحت ثقل إثمها فتهاوت ولم تنهض."]]}, {"l": "Jer 4:24-26", "n": "", "vs": [[24, "نظرت إلى الجبال وإذا بها ترتجف، وإلى الآكام وإذا بها تتقلقل."], [25, "تلفت حولي فلم أجد إنسانا، وإذا كل الطيور قد هربت."], [26, "نظرت وإذا بالأرض الخصيبة قد تحولت إلى بر ية، وأصبحت جميع مدنها أطلالا أمام الرب وأمام غضبه المحتدم."]]}, {"l": "Mic 1:3-5", "n": "", "vs": [[3, "انظروا: ها هو الرب خارج من مقر سكناه. هوذا ينزل ليطأ مشارف الأرض،"], [4, "فتذوب الجبال من تحت قدميه، وتتصدع الوديان كالشمع أمام النار، كالمياه المنصبة في المنخفضات."], [5, "من أجل آثام يعقوب ومن أجل خطايا بيت إسرائيل. فما هو ذنب يعقوب؟ أليس هو أصنام السامرة؟ وما هي خطيئة يهوذا؟ أليست هي أوثان أورشليم؟"]]}, {"l": "Nah 1:5", "n": "", "vs": [[5, "تتزلزل الجبال أمامه، وتذوب التلال، وتتصدع الأرض في حضرته والمسكونة والساكنون فيها."]]}, {"l": "Nah 1:6", "n": "", "vs": [[6, "من يصمد أمام سخطه؟ من يتحمل فرط اضطرام غضبه؟ ينصب غضبه كالنار وتنحل تحت وطأته الصخور."]]}, {"l": "Hab 3:5-8", "n": "", "vs": [[5, "يتقدمه وبأ، والموت يقتفي خطاه."], [6, "وقف وزلزل الأرض، تفرس فأرعب الأمم، اندكت الجبال الأبدية وانهارت التلال القديمة، أما مسالكه فهي من الأزل."], [7, "لقد رأيت خيام كوشان تنوء بالبلية وشقق أخبية ديار مديان ترجف رعبا."], [8, "هل غضبك منصب على الأنهار يارب؟ أعلى الأنهار احتدم سخطك؟ أم على البحر سكبت جام غيظك، عندما ركبت خيولك ومركبات ظفرك؟"]]}, {"l": "Hag 2:6", "n": "", "vs": [[6, "لأنه هكذا يقول الرب القدير: ها أنا مزمع مرة أخرى، عما قليل، أن أزلزل السماء والأرض والبحر واليابسة."]]}, {"l": "Hag 2:7", "n": "", "vs": [[7, "وأزعزع أركان جميع الأمم فتجلب نفائسهم إلى هذا المكان وأملأ هذا الهيكل بالمجد."]]}], "kwAr": "الأرض", "noteAr": "يُظن أن المقصود هنا زلزال؛ فارتفاع الأرض وانخفاضها بحركة تشبه الموج، ومغادرتها موضعها وحدودها الصحيحة بسبب الزلزال، يُشبَّه بحق وجمال بانتفاخ النيل وفيضانه وانحساره. انظر مز 18: 7؛ 60: 2، 3؛ 114: 3-7؛ إش 5: 25؛ 24: 19، 20؛ إر 4: 24-26؛ مي 1: 3-5؛ نا 1: 5، 6؛ حب 3: 5-8؛ حج 2: 6، 7"}, {"kw": "every one", "raw": "Amo_8:10, Amo_9:5; Jer_12:4; Hos_4:3, Hos_10:5; Mat_24:30", "note": "", "refs": [{"l": "Amo 8:10", "n": "", "vs": [[10, "أحول أعيادكم إلى مآتم، وأغانيكم إلى مراث، وألبسكم المسوح على أحقائكم، وأفشي الصلع في كل رأس، فتصبح أعيادكم كمناحة على وحيد، ونهايتها كيوم مفعم بالمرارة."]]}, {"l": "Amo 9:5", "n": "", "vs": [[5, "إن الرب الإله القدير هو الذي يلمس الأرض فتذوب، وينوح كل المقيمين فيها، ويرتفع كل ما فيها وينخفض كنهر نيل مصر."]]}, {"l": "Jer 12:4", "n": "", "vs": [[4, "إلى متى تظل الأرض نائحة وعشب كل حقل ذاويا؟ هلكت البهائم والطيور من شر الساكنين فيها القائلين: «إنه لن يرى خاتمة مصيرنا»."]]}, {"l": "Hos 4:3", "n": "", "vs": [[3, "لذلك تنوح الأرض، ويذوي كل مقيم فيها، فضلاَ عن وحش البر وطير السماء، بل سمك البحر يستأصل أيضا."]]}, {"l": "Hos 10:5", "n": "", "vs": [[5, "يخشى أهل السامرة على عجل بيت آون، لأن شعبه يعولون عليه، وكذلك كهنته الخونة الذين ابتهجوا ببهائه الذي سلب منه."]]}, {"l": "Mat 24:30", "n": "", "vs": [[30, "وعندئذ تظهر آية ابن الإنسان في السماء، فتنتحب قبائل الأرض كلها، ويرون ابن الإنسان آتيا على سحب السماء بقدرة ومجد عظيم."]]}], "kwAr": "كل ساكن", "noteAr": ""}, {"kw": "rise", "raw": "Amo_9:5; Isa_8:7, Isa_8:8; Jer_46:8; Dan_9:26", "note": "", "refs": [{"l": "Amo 9:5", "n": "", "vs": [[5, "إن الرب الإله القدير هو الذي يلمس الأرض فتذوب، وينوح كل المقيمين فيها، ويرتفع كل ما فيها وينخفض كنهر نيل مصر."]]}, {"l": "Isa 8:7", "n": "", "vs": [[7, "فإن الرب مزمع أن يغرقهم بمياه النهر الفياضة، أي ملك أشور بكل جبروته، فيكون (كنهر الفرات) يطغى جيشانه على أقنيته ويفيض على ضفافه"]]}, {"l": "Isa 8:8", "n": "", "vs": [[8, "فيكتسح أرض يهوذا، ويطفو مرتفعا إلى الأعناق، وتنتشر جيوشه في عرض أرضك ياعمانوئيل»."]]}, {"l": "Jer 46:8", "n": "", "vs": [[8, "تتعالى مصر كفيضان النيل، كالأنهار المتلاطمة الأمواج. تقول: أفيض وأغمر الأرض، أهدم المدن وأهلك سكانها."]]}, {"l": "Dan 9:26", "n": "", "vs": [[26, "وبعد اثنين وستين أسبوعا يقتل المسيح، ولكن ليس من أجل نفسه، ويدمر شعب رئيس آت المدينة والقدس، وتقبل آخرتها كطوفان، وتستمر الحرب حتى النهاية، ويعم الخراب المقضي به."]]}], "kwAr": "وترتفع", "noteAr": ""}], "arS": [["ألا ", []], ["ترتعب", ["H7264"]], [" ", []], ["الأرض", ["H776"]], [" من جراء ", []], ["ذلك", ["H2063"]], ["، ", []], ["فينوح", ["H56"]], [" ", []], ["كل", ["H3605"]], [" ", []], ["ساكن", ["H3427"]], [" فيها، ", []], ["فتطمو", ["H5927"]], [" ", []], ["كنهر", ["H2975"]], ["، ", []], ["وترتفع", ["H1644"]], [" ", []], ["وتنخفض", ["H8257"]], [" ", []], ["كنيل", ["H2975"]], [" ", []], ["مصر", ["H4714"]], ["؟", []]]}, {"c": 8, "v": 9, "text": "ويقول الرب: في ذلك اليوم أجعل الشمس تغرب عند الظهيرة، وأغمر الأرض بالظلمة في رابعة النهار.", "groups": [{"kw": "that I", "raw": "This is supposed to refer to an eclipse; and Abp. Usher has shown that about eleven years after Amos prophesied there were two great eclipses of the sun, one at the feast of tabernacles, and the other some time before the passover. Amo_4:13, Amo_5:8; Job_5:14; Isa_13:10, Isa_29:9, Isa_29:10, Isa_59:9, Isa_59:10; Jer_15:9; Mic_3:6; Mat_24:29; Rev_6:12, Rev_8:12", "note": "This is supposed to refer to an eclipse; and Abp. Usher has shown that about eleven years after Amos prophesied there were two great eclipses of the sun, one at the feast of tabernacles, and the other some time before the passover. Amo_4:13, Amo_5:8; Job_5:14; Isa_13:10, Isa_29:9, Isa_29:10, Isa_59:9, Isa_59:10; Jer_15:9; Mic_3:6; Mat_24:29; Rev_6:12, Rev_8:12", "refs": [{"l": "Amo 4:13", "n": "", "vs": [[13, "فانظر إنه هو صانع الجبال وخالق الرياح، الذي أعلن فكره للبشر، وأحال النهار إلى ليل، ومشى فوق مشارف الأرض، الرب الإله القدير اسمه."]]}, {"l": "Amo 5:8", "n": "", "vs": [[8, "إنه هو الذي خلق الثريا والجبار، ويحول دياجير الظلمة إلى نهار، والنهار إلى ليل، ويستدعي مياه البحر ويفيضها على وجه الأرض، الرب اسمه."]]}, {"l": "Job 5:14", "n": "", "vs": [[14, "يكتنفهم ظلام في النهار، ويتحسسون طريقهم في الظهيرة، كمن يمشي في الليل."]]}, {"l": "Isa 13:10", "n": "", "vs": [[10, "فإن نجوم السماء وكواكبها لا تشرق بنورها، والشمس تظلم عند بزوغها، والقمر لا يشع بضوئه."]]}, {"l": "Isa 29:9", "n": "", "vs": [[9, "ابهتوا وتعجبوا. تعاموا واعموا. اسكروا ولكن من غير خمر. ترنحوا ولكن من غير مسكر،"]]}, {"l": "Isa 29:10", "n": "", "vs": [[10, "لأن الرب قد سكب عليكم روح سبات عميق، فأغلق عيون أنبيائكم وغطى رؤوس رائييكم."]]}, {"l": "Isa 59:9", "n": "", "vs": [[9, "الحق ابتعد عنا، ولم يدركنا العدل. نرتقب نورا، فيحدق بنا الظلام، وننشد ضوءا فنسلك في العتمة."]]}, {"l": "Isa 59:10", "n": "", "vs": [[10, "نتحسس الحائط كالأعمى، ونتلمس كالمكفوف، نتعثر في الظهيرة كما لو كنا نسير في عتمة الليل ونكون كالأموات بين المتدفقين بالحياة"]]}, {"l": "Jer 15:9", "n": "", "vs": [[9, "ذبلت والدة السبعة الأبناء. أسلمت روحها وغربت شمس حياتها والنهار لم يغب بعد. لحق بها الخزي والعار. أما بقيتهم فأدفعهم إلى حد السيف أمام أعدائهم»، يقول الرب."]]}, {"l": "Mic 3:6", "n": "", "vs": [[6, "لذلك يطغى عليكم ليل خال من الرؤيا، وظلام من غير عرافة، وتغرب الشمس عن الأنبياء ويظلم عليهم النهار."]]}, {"l": "Mat 24:29", "n": "", "vs": [[29, "وحالا بعد الضيقة في تلك الأيام، تظلم الشمس، ويحجب القمر ضوءه، وتتهاوى النجوم من السماء، وتتزعزع قوات السماوات."]]}, {"l": "Rev 6:12", "n": "", "vs": [[12, "ثم نظرت، فرأيت الحمل يفك الختم السادس، وإذا الأرض قد زلزلت زلزالا عظيما، والشمس اسودت فصارت كخرقة من شعر، وصار القمر أحمر كالدم،"]]}, {"l": "Rev 8:12", "n": "", "vs": [[12, "ولما نفخ الملاك الرابع في بوقه، حدثت ضربة لثلث الشمس وثلث القمر وثلث النجوم، فأظلم ثلثها وفقد النهار ثلث ضيائه، وكذلك الليل."]]}], "kwAr": "أجعل", "noteAr": "يُظن أن هذا يشير إلى كسوف؛ وقد بيّن رئيس الأساقفة أشر أنه بعد نحو إحدى عشرة سنة من نبوة عاموس وقع كسوفان عظيمان للشمس، أحدهما في عيد المظال والآخر قبل الفصح بزمن. انظر عا 4: 13؛ 5: 8؛ أي 5: 14؛ إش 13: 10؛ 29: 9، 10؛ 59: 9، 10؛ إر 15: 9؛ مي 3: 6؛ مت 24: 29؛ رؤ 6: 12؛ 8: 12"}, {"kw": "and I", "raw": "Exo_10:21-23; Mat_27:45; Mar_15:33; Luk_23:44", "note": "", "refs": [{"l": "Exo 10:21-23", "n": "", "vs": [[21, "فقال الرب لموسى: «أبسط يدك نحو السماء فيطغى ظلام على كل أرجاء مصر حتى يكاد يلمس لكثافته»."], [22, "فبسط موسى يده نحو السماء، فطغى ظلام كثيف على كل أرجاء أرض مصر لمدة ثلاثة أيام."], [23, "فلم يتمكن أحد من أن يرى أخاه، ولا غادر أحد مكانه طوال ثلاثة أيام. غير أن النور كان يغمر بني إسرائيل في أماكن إقامتهم."]]}, {"l": "Mat 27:45", "n": "", "vs": [[45, "ومن الساعة الثانية عشرة ظهرا إلى الساعة الثالثة بعد الظهر، حل الظلام على الأرض كلها."]]}, {"l": "Mar 15:33", "n": "", "vs": [[33, "ولما جاءت الساعة الثانية عشرة ظهرا، حل الظلام على الأرض كلها حتى الساعة الثالثة بعد الظهر."]]}, {"l": "Luk 23:44", "n": "", "vs": [[44, "ونحو الساعة السادسة (الثانية عشرة ظهرا)، حل الظلام على الأرض كلها حتى الساعة التاسعة (الثالثة بعد الظهر)."]]}], "kwAr": "وأغمر", "noteAr": ""}], "arS": [["ويقول", ["H559"]], [" ", []], ["الرب", ["H3068"]], [": في ذلك ", []], ["اليوم", ["H3117"]], [" أجعل ", []], ["الشمس", ["H8121"]], [" ", []], ["تغرب", ["H935"]], [" عند ", []], ["الظهيرة", ["H6672"]], ["، ", []], ["وأغمر", ["H2821"]], [" ", []], ["الأرض", ["H776"]], [" ", []], ["بالظلمة", ["H216"]], [" في رابعة ", []], ["النهار", ["H3117"]], [".", []]]}, {"c": 8, "v": 10, "text": "أحول أعيادكم إلى مآتم، وأغانيكم إلى مراث، وألبسكم المسوح على أحقائكم، وأفشي الصلع في كل رأس، فتصبح أعيادكم كمناحة على وحيد، ونهايتها كيوم مفعم بالمرارة.", "groups": [{"kw": "I will turn", "raw": "Amo_8:3, Amo_5:23, Amo_6:4-7; Deu_16:14; 1Sa_25:36-38; 2Sa_13:28-31; Job_20:23; Isa_21:3, Isa_21:4, Isa_22:12-14; Dan_5:4-6; Hos_2:11; Nah_1:10", "note": "", "refs": [{"l": "Amo 8:3", "n": "", "vs": [[3, "فتتحول أغاني قصورهم إلى عويل في ذلك اليوم، وتكثر الجثث ويطرحونها في كل مكان بصمت»."]]}, {"l": "Amo 5:23", "n": "", "vs": [[23, "أبعدوا عني جلبة أغانيكم لأني لن أصغي إلى نغمات رباباتكم."]]}, {"l": "Amo 6:4-7", "n": "", "vs": [[4, "ويل للراقدين فوق أسرة من عاج، المسترخين فوق الأرائك، الآكلين لحم خيرة الحملان والعجول المختارة من وسط المعلف."], [5, "المغنين على صوت الرباب، المخترعين لأنفسهم آلات غناء كداود."], [6, "الشاربين خمرا في كؤوس، المتطيبين بأفضل العطور، ولا يكتئبون على خراب يوسف."], [7, "لهذا سيكونون أول الذاهبين إلى السبي، ويزول ما أنتم عليه من لهو وعبث."]]}, {"l": "Deu 16:14", "n": "", "vs": [[14, "فتحتفلون بالعيد أنتم وأبناؤكم وبناتكم وإماؤكم واللاويون والغريب واليتيم والأرملة المقيمون في مدنكم،"]]}, {"l": "1Sa 25:36-38", "n": "", "vs": [[36, "فأقبلت أبيجايل إلى نابال، فوجدت أنه قد أقام مأدبة في بيته كمأدبة ملك، وقد أخذته النشوة بعد أن أكثر من احتساء الخمر حتى سكر، فلم تخبره بشيء إطلاقا حتى صباح اليوم التالي."], [37, "وفي الصباح، بعد أن صحا نابال من سكرته، أخبرته بما جرى، فأصابه الشلل وتجمد كحجر."], [38, "وبعد عشرة أيام ضربه الله فمات."]]}, {"l": "2Sa 13:28-31", "n": "", "vs": [[28, "وأوصى أبشالوم رجاله: «متى ذهبت الخمر بعقل أمنون وقلت لكم اضربوا أمنون واقتلوه، فلا تخافوا. ألست أنا الذي أمرتكم بذلك؟ تشجعوا وتصرفوا كأبطال»."], [29, "فنفذ رجال أبشالوم أوامره وقتلوا أمنون، فهب جميع أبناء الملك وامتطوا بغالهم وهربوا."], [30, "وفيما هم في الطريق بلغ الخبر داود وقيل له: «قتل أبشالوم جميع أبناء الملك ولم يسلم منهم أحد»."], [31, "فقام الملك ومزق ثيابه وانطرح على الأرض، يحيط به جميع رجال حاشيته ممزقي الثياب."]]}, {"l": "Job 20:23", "n": "", "vs": [[23, "وعندما يملأ بطنه ينفث عليه الله غضبه الحارق ويمطره عليه طعاما له."]]}, {"l": "Isa 21:3", "n": "", "vs": [[3, "لذلك امتلأت حقواى ألما، وانتابني مخاض كمخاض الوالدة. فقدت الوعي من جراء ما سمعت، وذهلت مما رأيت"]]}, {"l": "Isa 21:4", "n": "", "vs": [[4, "تحير قلبي، وأرعبني الفزع، فتحول ليلي الذي كنت أتوق إليه إلى رعدة."]]}, {"l": "Isa 22:12-14", "n": "", "vs": [[12, "في ذلك اليوم يدعوكم السيد الرب القدير للبكاء والنوح وحلق الشعر والتنطق بالمسوح."], [13, "ولكنكم انهمكتم بالفرح والسرور وذبح الثيران وتضحية الغنم وأكل اللحم وشرب الخمر قائلين: «لنأكل ونشرب لأننا غدا نموت»."], [14, "فقال لي القدير: «لن تغفر لكم آثامكم حتى تموتوا»."]]}, {"l": "Dan 5:4-6", "n": "", "vs": [[4, "وأخذوا يسبحون آلهة الذهب والفضة والنحاس والحديد والخشب والحجر."], [5, "فظهرت أصابع يد إنسان وخطت بإزاء المصباح على كلس جدار قصر الملك، والملك يشهد اليد الكاتبة."], [6, "عندئذ شحب وجه الملك وأفزعته أفكاره واصطكت ركبتاه واعتراه الانهيار،"]]}, {"l": "Hos 2:11", "n": "", "vs": [[11, "وأبطل كل أفراحها وأعيادها واحتفالات رؤوس شهورها وسبوتها وجميع مواسمها."]]}, {"l": "Nah 1:10", "n": "", "vs": [[10, دجال، ويقدمون آيات عظيمة وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."], [25, "ها أنا قد أخبرتكم بالأمر قبل حدوثه."], [26, "فإذا قال لكم الناس: ها هو المسيح في البرية! فلا تخرجوا إليها؛ أو: ها هو في الغرف الداخلية! فلا تصدقوا."]]}, {"l": "Rom 9:31-33", "n": "", "vs": [[31, "أما إسرائيل، وقد كانوا يسعون وراء شريعة تهدف إلى البر، فقد فشلوا حتى في بلوغ الشريعة."], [32, "ولأي سبب؟ لأن سعيهم لم يكن على أساس الإيمان، بل كان وكأن الأمر قائم على الأعمال. فقد تعثروا بحجر العثرة،"], [33, "كما كتب: «ها أنا واضع في صهيون حجر عثرة وصخرة سقوط. ومن يؤمن به لا يخيب»."]]}, {"l": "Rom 11:7-10", "n": "", "vs": [[7, "فما الخلاصة إذا؟ إن ما يسعى إليه إسرائيل لم ينالوه، بل ناله المختارون منهم، والباقون عميت بصائرهم،"], [8, "وفقا لما قد كتب: «ألقى الله عليهم روح خمول وأعطاهم عيونا لا يبصرون بها، وآذانا لا يسمعون بها، حتى هذا اليوم»."], [9, "كذلك يقول داود: «لتصر لهم مائدتهم فخا وشركا وعقبة وعقابا."], [10, "لتظلم عيونهم كي لا يبصروا، ولتكن ظهورهم منحنية دائما!»"]]}, {"l": "2Ti 3:6", "n": "", "vs": [[6, "فمن هؤلاء من يدخلون البيوت خلسة، ويوقعون في حبائلهم بعض النساء السخيفات المثقلات بالخطايا، اللواتي تجرفهن شهوات مختلفة،"]]}, {"l": "2Ti 3:7", "n": "", "vs": [[7, "يصغين للتعليم دائما، ولا يستطعن أبدا أن يبلغن معرفة الحق بالتمام!"]]}], "kwAr": "يذهبون ويجيئون", "noteAr": ""}], "arS": [["فيهيمون", ["H5128"]], [" من ", []], ["بحر", ["H4480", "H3220"]], [" إلى بحر، ومن ", []], ["الشمال", ["H4480", "H6828"]], [" إلى ", []], ["الشرق", ["H4217"]], [". ", []], ["يذهبون", ["H7751"]], [" ويجيئون ", []], ["بحثا", ["H1245"]], [" عن ", []], ["كلمة", ["H1697"]], [" ", []], ["الرب", ["H3068"]], [" ولا ", []], ["يحظون", ["H4672"]], [" بها.", []]]}, {"c": 8, "v": 13, "text": "في ذلك اليوم يغشى على العذارى الجميلات والفتيان من فرط الظمإ.", "groups": [{"kw": "", "raw": "Deu_32:25; Psa_63:1, Psa_144:12-15; Isa_40:30, Isa_41:17-20; Jer_48:18; Lam_1:18, Lam_2:10,Lam_2:21; Hos_2:3; Zec_9:17", "note": "", "refs": [{"l": "Deu 32:25", "n": "", "vs": [[25, "يثكلهم سيف العدو في الطريق، ويستولي عليهم الرعب داخل الخدور، فيهلك الفتى مع الفتاة، والرضيع مع الشيخ."]]}, {"l": "Psa 63:1", "n": "", "vs": [[1, "ياالله أنت إلهي وإياك أطلب باكرا. عطشت إليك نفسي ويشتاق إليك جسمي في أرض قاحلة يابسة لا ماء فيها."]]}, {"l": "Psa 144:12-15", "n": "", "vs": [[12, "حتى يكون أبناؤنا كأغراس نامية في حداثتها، وبناتنا مثل أعمدة زوايا القصور المنحوتة."], [13, "مخازننا ملآنة تفيض بشتى الأصناف، وأغنامنا تنتج ألوفا، وعشرات الألوف في مراعينا،"], [14, "وأبقارنا حاملة، ولا يكون هناك اقتحام غاز، ولا هجوم عدو، ولا شكوى خصم في شوارعنا."], [15, "طوبى لشعب هكذا حالته. طوبى لشعب إلهه الرب."]]}, {"l": "Isa 40:30", "n": "", "vs": [[30, "إن الشبيبة ينالها الإعياء والإرهاق، والفتيان يتعثرون أشد تعثر،"]]}, {"l": "Isa 41:17-20", "n": "", "vs": [[17, "وعندما يلتمس البائسون والمساكين ماء ولا يجدونه، وتتشقق ألسنتهم من العطش، أنا الرب أستجيب لهم، أنا إله إسرائيل لا أتخلى عنهم."], [18, "فأفجر أنهارا على الهضاب وينابيع في وسط الأودية، وأحول البرية إلى واحة ماء والأرض القاحلة إلى جداول."], [19, "وأنبت في الصحراء الأرز والسنط والآس وشجر الزيتون، وأنمي في البرية أشجار السرو والسنديان والشربين جميعا،"], [20, "حتى يرى الناس ويدركوا ويتأملوا ويفهموا معا أن يد الرب هي التي صنعت هذا، وأن قدوس إسرائيل هو الذي أبدعه."]]}, {"l": "Jer 48:18", "n": "", "vs": [[18, "اهبطي من المجد واجلسي على الأرض الظمأى أيتها الساكنة في ديبون، لأن مدمر موآب قد زحف عليك وهدم حصونك."]]}, {"l": "Lam 1:18", "n": "", "vs": [[18, "الرب حقا عادل، وأنا قد تمردت على أمره. فاستمعوا ياجميع الشعوب واشهدوا وجعي. قد ذهب عذاراي وشباني إلى السبي."]]}, {"l": "Lam 2:10", "n": "", "vs": [[10, "يجلس شيوخ ابنة صهيون على الأرض صامتين. عفروا بالرماد رؤوسهم، وارتدوا المسوح، وطأطأت عذارى أورشليم رؤوسهن إلى الأرض."]]}, {"l": "Lam 2:21", "n": "", "vs": [[21, "قد انطرح الصبي والشيوخ في غبار الطرقات. سقط عذاراي وشباني بالسيف. قد قتلتهم في يوم غضبك، ونحرتهم من غير رحمة."]]}, {"l": "Hos 2:3", "n": "", "vs": [[3, "لئلا أعريها وأردها كما كانت يوم مولدها، وأجعلها كالقفر أو كأرض جرداء، وأميتها ظمأ."]]}, {"l": "Zec 9:17", "n": "", "vs": [[17, "فما أجملهم وما أبهاهم! الحنطة تجعل الفتيان أكثر ازدهارا، والخمرة تجعل الفتيات أكثر نضرة»."]]}], "kwAr": "", "noteAr": ""}], "arS": [["في ذلك ", []], ["اليوم", ["H3117"]], [" ", []], ["يغشى", ["H5968"]], [" على ", []], ["العذارى", ["H1330"]], [" ", []], ["الجميلات", ["H3303"]], [" ", []], ["والفتيان", ["H970"]], [" من فرط ", []], ["الظمإ", ["H6772"]], [".", []]]}, {"c": 8, "v": 14, "text": "أما الذين يقسمون بأوثان السامرة قائلين: حي إلهك يادان، وحي معبود بئر سبع. هؤلاء يسقطون ولا ينهضون أبدا ثانية».", "groups": [{"kw": "swear", "raw": "Hos_4:15; Zep_1:5", "note": "", "refs": [{"l": "Hos 4:15", "n": "", "vs": [[15, "فإن كنت ياشعب إسرائيل زانيا، فلا تجعل يهوذا يأثم أو يذهب إلى الجلجال أو إلى بيت آون ولا يحلف قائلا: حي هو الرب."]]}, {"l": "Zep 1:5", "n": "", "vs": [[5, "والذين يصعدون إلى السطوح للسجود لكواكب السماء، والذين يجثون عابدين الرب حالفين باسمه، وباسم ملكوم أيضا."]]}], "kwAr": "يقسمون", "noteAr": ""}, {"kw": "sin", "raw": "Deu_9:21; 1Ki_12:28, 1Ki_12:29, 1Ki_12:32, 1Ki_13:22-34, 1Ki_14:16, 1Ki_16:24; 2Ki_10:29; Hos_8:5, Hos_8:6, Hos_10:5, Hos_13:2, Hos_13:16", "note": "", "refs": [{"l": "Deu 9:21", "n": "", "vs": [[21, "أما خطيئتكم، العجل الذي سبكتموه، فقد أخذته وأحرقته ودققته وطحنته جيدا، حتى استحال إلى غبار، ثم طرحت غباره في النهر المنحدر من الجبل."]]}, {"l": "1Ki 12:28", "n": "", "vs": [[28, "وبعد المشاورة سبك الملك عجلي ذهب، وقال للشعب: «إن الذهاب إلى أورشليم للعبادة يعرضكم لمشقة عظيمة، فها هي آلهتك ياإسرائيل التي أخرجتك من ديار مصر»."]]}, {"l": "1Ki 12:29", "n": "", "vs": [[29, "وأقام واحدا في بيت إيل والآخر في دان."]]}, {"l": "1Ki 12:32", "n": "", "vs": [[32, "واحتفل يربعام بعيد في اليوم الخامس عشر من الشهر الثامن (تشرين الثاني ; نوفمبر)، مثل العيد الذي يحتفل به في يهوذا، وقدم محرقات على المذبح. وقرب في بيت إيل ذبائح للعجلين اللذين سبكهما. كما نصب في بيت إيل كهنة للمرتفعات التي أقامها."]]}, {"l": "1Ki 13:22-34", "n": "", "vs": [[22, "فرجعت وأكلت طعاما وشربت ماء في الموضع الذي حذرك منه قائلا: لا تأكل فيه طعاما ولا تشرب ماء، فإن جثتك لن تدفن في قبر آبائك»."], [23, "وبعد أن تناول نبي يهوذا طعاما وشرب ماء، أسرج له مضيفه حماره."], [24, "وبينما هو منصرف في طريقه صادفه أسد وقتله، وظلت جثته مطروحة في الطريق، والحمار والأسد واقفان إلى جوار الجثة."], [25, "ومر قوم فشاهدوا الجثة مطروحة في الطريق والأسد واقف إلى جوارها فأتوا وأذاعوا الخبر في المدينة التي يقيم فيها النبي الشيخ."], [26, "وعندما سمع النبي الشيخ بالنبإ قال: «هو حتما رجل الله الذي خالف أمر الرب، فأوقعه الرب بين مخالب الأسد فافترسه وقتله تحقيقا لقضائه الذي نطق به»."], [27, "وقال لأبنائه: «أسرجوا لي الحمار». فأسرجوه،"], [28, "فانطلق إلى حيث عثر على الجثة مطروحة في الطريق، والأسد والحمار واقفين إلى جوارها، من غير أن يأكل الأسد الجثة أو يفترس الحمار،"], [29, "فوضع النبي جثة رجل الله على الحمار، ومضى بها إلى المدينة، ليندبه"], [30, "ثم دفنها في قبره وهو ينوح قائلا: «آه عليك ياأخي»."], [31, "وبعد أن تم دفن جثة رجل الله، قال النبي الشيخ لأبنائه: «عند وفاتي ادفنوني في القبر الذي دفن فيه رجل الله، وضعوا عظامي إلى جوار عظامه،"], [32, "لأن ما أنذر به من كلام الرب بشأن المذبح الذي في بيت إيل، وجميع معابد المرتفعات التي في مدن السامرة، لابد أن يتحقق»."], [33, "وعلى الرغم من تحذير النبي فإن يربعام لم يحد عن طريقه الأثيمة، بل عاد مرة أخرى فكرس كهنة لمعابد المرتفعات، اختارهم من عامة الشعب، فكان يكرس كل من يرغب أن يكون كاهنا لهذه المرتفعات."], [34, "فكانت هذه هي خطيئة بيت يربعام التي أفضت إلى سقوطه وانقراضه عن وجه الأرض."]]}, {"l": "1Ki 14:16", "n": "", "vs": [[16, "وينبذ إسرائيل من جراء خطايا يربعام التي ارتكبها واستغوى إسرائيل معه فأخطأوا»."]]}, {"l": "1Ki 16:24", "n": "", "vs": [[24, "ثم اشترى جبل السامرة من شامر بوزنتين من الفضة (نحو اثنين وسبعين كيلوجراما)، وبنى عليه مدينة دعاها السامرة، على اسم شامر صاحب الجبل."]]}, {"l": "2Ki 10:29", "n": "", "vs": [[29, "ولكنه لم يحد عن خطايا يربعام التي استغوى بها الإسرائيليين وجعلهم يخطئون، إذ أبقى على عجول الذهب التي في بيت إيل وفي دان."]]}, {"l": "Hos 8:5", "n": "", "vs": [[5, "لشد ما أزدري عجلك أيتها السامرة، وها غضبي قد احتدم عليهم فإلى متى يظلون عاجزين عن النقاوة؟"]]}, {"l": "Hos 8:6", "n": "", "vs": [[6, "إنه صنعة عامل إسرائيلي وليس إلها، ولابد أن يصير عجل السامرة حطاما."]]}, {"l": "Hos 10:5", "n": "", "vs": [[5, "يخشى أهل السامرة على عجل بيت آون، لأن شعبه يعولون عليه، وكذلك كهنته الخونة الذين ابتهجوا ببهائه الذي سلب منه."]]}, {"l": "Hos 13:2", "n": "", "vs": [[2, "وها هم يكثرون الآن معاصيهم، ويصوغون ببراعة لأنفسهم تماثيل وأصناما من فضتهم، كلها صنعة عمال حاذقين قائلين: «قبلوا تماثيل العجول هذه يامقربي الذبائح البشرية»."]]}, {"l": "Hos 13:16", "n": "", "vs": [[16, "لابد أن تتحمل السامرة وزر خطيئتها لأنها تمردت على إلهها، فيفنى أهلها بحد السيف، ويتمزق أطفالها أشلاء، وتشق بطون حواملها."]]}], "kwAr": "أوثان", "noteAr": ""}, {"kw": "manner", "raw": "Heb. way, Act_9:2, Act_18:25, Act_19:9, Act_19:23, Act_24:14", "note": "Heb. way, Act_9:2, Act_18:25, Act_19:9, Act_19:23, Act_24:14", "refs": [{"l": "Act 9:2", "n": "", "vs": [[2, "وطلب منه رسائل إلى مجامع اليهود في دمشق لتسهيل القبض على أتباع هذا الطريق من الرجال والنساء، حيثما يجدهم، ليسوقهم مقيدين إلى أورشليم."]]}, {"l": "Act 18:25", "n": "", "vs": [[25, "كان قد تلقن طريق الرب. فبدأ يخطب بحماسة شديدة، ويعلم الحقائق المختصة بيسوع تعليما صحيحا. ومع أنه لم يكن يعرف سوى معمودية يوحنا،"]]}, {"l": "Act 19:9", "n": "", "vs": [[9, "ولكن بعضهم عاندوا ولم يقتنعوا، وأخذوا يشتمون الطريق أمام المجتمعين. فانفصل بولس عنهم، وانفرد بالتلاميذ، وبدأ يعقد مناقشات كل يوم في مدرسة رجل اسمه تيرانوس،"]]}, {"l": "Act 19:23", "n": "", "vs": [[23, "في تلك المدة وقع اضطراب خطير في أفسس بسبب الطريق."]]}, {"l": "Act 24:14", "n": "", "vs": [[14, "ولكني أعترف أمامك بأني أعبد إله آبائي بحسب المذهب الذي يصفونه بأنه بدعة، وأومن بكل ما كتب في الشريعة وكتب الأنبياء،"]]}], "kwAr": "معبود", "noteAr": "بالعبرية: «طريق». انظر أع 9: 2؛ 18: 25؛ 19: 9، 23؛ 24: 14"}, {"kw": "Beersheba", "raw": "Amo_8:5", "note": "", "refs": [{"l": "Amo 8:5", "n": "", "vs": [[5, "قائلين: «متى ينقضي أول الشهر حتى نبيع الحنطة؟ متى يمضي السبت لنعرض القمح في السوق، فنعمد إلى تصغير حجم مكيال الإيفة ونرفع الأسعار، ونستعمل ميزانا مغشوشا."]]}], "kwAr": "بئر سبع", "noteAr": ""}, {"kw": "shall fall", "raw": "Deu_33:11; 2Ch_36:16; Psa_36:12, Psa_140:10; Pro_29:1; Isa_43:17; Jer_25:27, Jer_51:64", "note": "", "refs": [{"l": "Deu 33:11", "n": "", "vs": [[11, "بارك يارب مهاراتهم واغتبط بعمل أيديهم. حطم متون مقاوميهم ومبغضيهم فلا تقوم لهم قائمة»."]]}, {"l": "2Ch 36:16", "n": "", "vs": [[16, "فكانوا يهزأون برسل الله، ورفضوا كلامه، واستهانوا بأنبيائه، حتى ثار غضب الرب على شعبه وامتنع كل شفاء!"]]}, {"l": "Psa 36:12", "n": "", "vs": [[12, "هناك سقط فاعلو الإثم، طرحوا، عجزوا عن النهوض."]]}, {"l": "Psa 140:10", "n": "", "vs": [[10, "ليسقط عليهم جمر ملتهب، وليطرحوا إلى النار، وإلى غمرات اللجج، فلا ينهضوا أيضا."]]}, {"l": "Pro 29:1", "n": "", "vs": [[1, "من كثر توبيخه وظل معتصما بعناده، يتحطم فجأة ولا شفاء له."]]}, {"l": "Isa 43:17", "n": "", "vs": [[17, "الذي يستدرج المركبات والخيول والجيش والمقاتلين، فيسقطون صرعى جميعا ولا يقومون، ويخمدون كذبالة وينطفئون."]]}, {"l": "Jer 25:27", "n": "", "vs": [[27, "ثم قل لهم، هذا ما يعلنه الرب القدير إله إسر ائيل: اشربوا واثملوا وتقيأوا واسقطوا صرعى، ولا تقوموا من جراء السيف الذي أرسله في وسطكم."]]}, {"l": "Jer 51:64", "n": "", "vs": [[64, "وقل: كذلك تغرق بابل ولا تطفو بعد لما أوقعه عليها من عقاب فيعيا كل أهلها».إلى هنا تنتهي نبوءات إرميا."]]}], "kwAr": "يسقطون", "noteAr": ""}], "arS": [["أما الذين ", []], ["يقسمون", ["H7650"]], [" ", []], ["بأوثان", ["H819"]], [" ", []], ["السامرة", ["H8111"]], [" ", []], ["قائلين", ["H559"]], [": ", []], ["حي", ["H2416"]], [" ", []], ["إلهك", ["H430"]], [" ", []], ["يادان", ["H1835"]], ["، وحي ", []], ["معبود", ["H1870"]], [" بئر ", []], ["سبع", ["H884"]], [". هؤلاء ", []], ["يسقطون", ["H5307"]], [" ولا ", []], ["ينهضون", ["H6965"]], [" ", []], ["أبدا", ["H5750"]], [" ثانية».", []]]}, {"c": 9, "v": 1, "text": "ورأيت السيد واقفا إلى جوار المذبح قائلا: «اضرب تيجان الأعمدة حتى تهتز العتبات، وحطمها على رؤوس جميع الشعب. ومن ينجو منهم أهلكه بالسيف، فلا يهرب منهم أحد ولا يفلت منهم ناج.", "groups": [{"kw": "I saw", "raw": "2Ch_18:18; Isa_6:1; Eze_1:28; Joh_1:18, Joh_1:32; Act_26:13; Rev_1:17", "note": "", "refs": [{"l": "2Ch 18:18", "n": "", "vs": [[18, "فأجاب ميخا: «إذا فاسمع
