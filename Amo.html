", "refs": [{"l": "Amo 6:4", "n": "", "vs": [[4, "ويل للراقدين فوق أسرة من عاج، المسترخين فوق الأرائك، الآكلين لحم خيرة الحملان والعجول المختارة من وسط المعلف."]]}, {"l": "Isa 57:7", "n": "", "vs": [[7, "نصبتم مضاجع زناكم على جبل شامخ مرتفع، وإلى هناك صعدتم لتقربوا ذبائحكم،"]]}, {"l": "Eze 23:41", "n": "", "vs": [[41, "وتربعت على سرير فاخر، بسطت أمامه مائدة منضضة وضعت عليها بخوري وزيتي."]]}, {"l": "1Co 8:10", "n": "", "vs": [[10, "فياصاحب المعرفة، إن رآك أحد جالسا إلى الطعام في هيكل للأصنام، أفلا يتقوى ضميره، هو الضعيف، ليأكل من ذبائح الأصنام،"]]}, {"l": "1Co 10:7", "n": "", "vs": [[7, "فلا تكونوا عابدين للأصنام كما كان بعضهم، كما قد كتب: «جلس الشعب للأكل والشرب، ثم قاموا للرقص واللهو»."]]}, {"l": "1Co 10:21", "n": "", "vs": [[21, "فلا تستطيعون أن تشربوا كأس الرب وكأس الشياطين معا، ولا أن تشتركوا في مائدة الرب ومائدة الشياطين معا،"]]}], "kwAr": "إلى جوار", "noteAr": ""}, {"kw": "they drink", "raw": "Amo_6:6; Jdg_9:27; Hos_4:8", "note": "", "refs": [{"l": "Amo 6:6", "n": "", "vs": [[6, "الشاربين خمرا في كؤوس، المتطيبين بأفضل العطور، ولا يكتئبون على خراب يوسف."]]}, {"l": "Jdg 9:27", "n": "", "vs": [[27, "ثم خرجوا إلى الحقول وجنوا غلات كرومهم وصنعوا منها خمرا، واحتفلوا ودخلوا إلى معبد إلههم وأكلوا وشربوا ولعنوا أبيمالك."]]}, {"l": "Hos 4:8", "n": "", "vs": [[8, "يأكلون من ذبائح خطيئة شعبي ويفرحون لتماديهم في الإثم ليكثر نصيبهم منها."]]}], "kwAr": "ويشربون", "noteAr": ""}, {"kw": "the condemned", "raw": "or, such as have fined, or, mulcted", "note": "or, such as have fined, or, mulcted", "refs": [], "kwAr": "المغرمين", "noteAr": "أو: «الذين غرّموا» أو «فرضوا غرامة»."}], "arS": [["يرقدون", ["H5186"]], [" إلى ", []], ["جوار", ["H681"]], [" ", []], ["المذبح", ["H4196"]], [" فوق ", []], ["ثياب", ["H899"]], [" ", []], ["مرهونة", ["H2254"]], ["، ", []], ["ويشربون", ["H8354"]], [" في ", []], ["هيكل", ["H1004"]], [" ", []], ["إلههم", ["H430"]], [" ", []], ["خمر", ["H3196"]], [" ", []], ["المغرمين", ["H6064"]], [".", []]]}, {"c": 2, "v": 9, "text": "مع أني أهلكت من أمامهم الأموريين ذوي القامات الطويلة كأشجار الأرز، الأقوياء كأشجار البلوط، أتلفت أثمارهم على أغصانها، وجذور أشجارهم من تحت الأرض.", "groups": [{"kw": "I the", "raw": "Gen_15:16; Exo_3:8, Exo_34:11; Num_21:24; Deu_2:24-33; Jos_3:10, Jos_24:8-12; Jdg_11:21-23; Neh_9:22-24; Psa_135:10-12, Psa_136:17-22", "note": "", "refs": [{"l": "Gen 15:16", "n": "", "vs": [[16, "أما هم فسيرجعون بعد أربعة أجيال إلى هنا، لأن إثم الأموريين لم يكتمل بعد»."]]}, {"l": "Exo 3:8", "n": "", "vs": [[8, "فنزلت لأنقذهم من يد المصريين وأخرجهم من تلك الأرض إلى أرض طيبة رحيبة تفيض لبنا وعسلا، أرض الكنعانيين والحثيين والأموريين والفرزيين والحويين واليبوسيين."]]}, {"l": "Exo 34:11", "n": "", "vs": [[11, "ولكن أطع ما أوصيتك اليوم به. ها أنا طارد من أمامك الأموريين والكنعانيين والحثيين والفرزيين والحويين واليبوسيين."]]}, {"l": "Num 21:24", "n": "", "vs": [[24, "فهزمه الإسرائيليون بحد السيف، واستولوا على بلاده من أرنون إلى يبوق حتى حدود العمونيين ولم يتجاوزوها لمناعتها."]]}, {"l": "Deu 2:24-33", "n": "", "vs": [[24, "فقوموا وارتحلوا واعبروا وادي نهر أرنون، وانظروا لأنني قد نصرتك على سيحون ملك الأموريين وأرضه. فابتديء بتملك الأرض، وأثر عليه حربا."], [25, "ففي هذا اليوم بالذات أجعل هيبتكم والخوف منكم يطغيان على شعوب الأرض. وكل الذين يسمعون أخباركم يرتعدون ويفزعون أمامكم."], [26, "فأرسلت رسلا من صحراء قديموت إلى سيحون ملك حشبون، أعرض عليه سلاما قائلا:"], [27, "دعني أجتز بأرضك سالكا الطريق العامة، لا أحيد عنها يمينا أو شمالا."], [28, "وسأدفع ثمن ما تبيعني من طعام لآكل، وما تعطيني من ماء لأشرب، أمر راجلا فقط."], [29, "كما فعلت مع بني عيسو المستوطنين في سعير، والموآبيين المقيمين في عار."], [30, "لكن سيحون ملك حشبون رفض أن يدعنا نجتاز ببلاده، لأن الرب إلهكم قسى روحه وأغلظ قلبه لكي يهزمه على أيديكم كما فعل الآن."], [31, "وقال لي الرب: انظر، ها قد ابتدأت أدفع أمامك سيحون لتستولي على أرضه، فأسرع في تملكها حتى تتغلب عليها كلها."], [32, "فخرج سيحون بكامل جيشه إلى ياهص لمحاربتنا."], [33, "فأتانا النصر عليه من عند الرب إلهنا، فدحرناه وأبناءه وسائر جيشه."]]}, {"l": "Jos 3:10", "n": "", "vs": [[10, "بهذا تعرفون عن يقين أن الله الحي موجود بينكم، وأنه يطرد من أمامكم الكنعانيين والحثيين والحويين والفرزيين والجرجاشيين والأموريين واليبوسيين."]]}, {"l": "Jos 24:8-12", "n": "", "vs": [[8, "ثم أتيت بكم إلى أرض الأموريين المقيمين شرقي نهر الأردن فحاربوكم، غير أني أسلمتهم إليكم، فامتلكتم أرضهم، وأبدتهم من أمامكم."], [9, "وهب بالاق بن صفور ملك موآب لمحاربتكم، واستدعى إليه بلعام بن بعور لكي يلعنكم."], [10, "فلم أرد أن أستجيب لبلعام، فبارككم بركة بعد بركة، وأنقذتكم من يده."], [11, "ثم اجتزتم نهر الأردن وحاصرتم أريحا، فتصدى لكم أصحابها الأموريون والفرزيون والكنعانيون والحثيون والجرجاشيون والحويون واليبوسيون، فأسلمتهم إليكم."], [12, "وأرسلت أمامكم أسراب الزنابير وطردت ملكي الأموريين من وجهكم، فلم تكن سيوفكم ولا سهامكم هي التي نصرتكم."]]}, {"l": "Jdg 11:21-23", "n": "", "vs": [[21, "فنصر الرب إله إسرائيل شعبه على سيحون وجيشه، فهزموهم واستولوا على كل أرض الأموريين سكان تلك البلاد."], [22, "فامتلكوا كل بلاد الأموريين من أرنون في الجنوب إلى اليبوق في الشمال، ومن الصحراء في الشرق إلى نهر الأردن في الغرب."], [23, "والآن وقد طرد الرب إله إسرائيل الأموريين من أمام شعبه إسرائيل،"]]}, {"l": "Neh 9:22-24", "n": "", "vs": [[22, "ووهبت لهم ممالك وأمما، ووزعت عليهم أنصبة في أقصى البلاد فامتلكوا بلاد سيحون وأرض ملك حشبون وديار عوج ملك باشان،"], [23, "وأكثرت نسلهم فصاروا كنجوم السماء عددا، وأتيت بهم إلى الأرض التي وعدت آباءهم أن يدخلوها ويرثوها،"], [24, "فاستولى عليها الأبناء وورثوا الأرض بعد أن أخضعت لهم سكانها الكنعانيين، وأسلمتهم لهم مع ملوكهم وأمم البلاد ليصنعوا بهم حسب ما يطيب لهم."]]}, {"l": "Psa 135:10-12", "n": "", "vs": [[10, "ضرب أمما عظيمة، وقتل ملوكا مقتدرين:"], [11, "سيحون ملك الأموريين، وعوج ملك باشان، وجميع ممالك كنعان."], [12, "ووهب أرضهم ميراثا لإسرائيل شعبه."]]}, {"l": "Psa 136:17-22", "n": "", "vs": [[17, "الذي أطاح بملوك عظماء. لأن رحمته إلى الأبد تدوم."], [18, "وقتل ملوكا ذوي شهرة، لأن رحمته إلى الأبد تدوم."], [19, "كسيحون ملك الأموريين، لأن رحمته إلى الأبد تدوم."], [20, "وعوج ملك باشان، لأن رحمته إلى الأبد تدوم."], [21, "وأعطى أرضهم ميراثا، لأن رحمته إلى الأبد تدوم."], [22, "ميراثا لإسرائيل عبده، لأن رحمته إلى الأبد تدوم."]]}], "kwAr": "أهلكت", "noteAr": ""}, {"kw": "whose", "raw": "Num_13:28, Num_13:29, Num_13:32, Num_13:33; Deu_1:28, Deu_2:10,Deu_2:11, Deu_3:11, Deu_9:1-3", "note": "", "refs": [{"l": "Num 13:28", "n": "", "vs": [[28, "غير أن الشعب المستوطن فيها بالغ القوة ومدنه منيعة وعظيمة جدا. كما شاهدنا هناك بني عناق،"]]}, {"l": "Num 13:29", "n": "", "vs": [[29, "فالعمالقة مقيمون في أرض الجنوب، والحثيون واليبوسيون والأموريون متمنعون في الجبل، والكنعانيون مستوطنون عند البحر وعلى محاذاة الأردن»."]]}, {"l": "Num 13:32", "n": "", "vs": [[32, "وبذلك أشاعوا الذعر بين الإسرائيليين من البلاد التي تجسسوها قائلين: «ستفترسنا الأرض التي تجسسناها، وجميع من شاهدناهم من سكانها عمالقة."]]}, {"l": "Num 13:33", "n": "", "vs": [[33, "فقد رأينا هناك الجبابرة بني عناق، فبدونا في أعين أنفسنا كالجراد، وكذلك كنا في عيونهم»."]]}, {"l": "Deu 1:28", "n": "", "vs": [[28, "فإلى أين نذهب؟ لقد أوهن إخوتنا قلوبنا عندما أخبرونا أن أهل الأرض أعظم منا وأكثر طولا، ومدنهم عظيمة تبلغ حصونها عنان السماء، وقد شاهدنا هناك بني عناق أيضا."]]}, {"l": "Deu 2:10", "n": "", "vs": [[10, "فقد سكن فيها الإيميون قبلا، وهم شعب كثير وطوال القامة كالعناقيين،"]]}, {"l": "Deu 2:11", "n": "", "vs": [[11, "وهم يعتبرون رفائيين كالعناقيين. غير أن الموآبيين يدعونهم الإيميين."]]}, {"l": "Deu 3:11", "n": "", "vs": [[11, "وكان عوج آخر الجبابرة الرفائيين. وكان سريره مصنوعا من حديد، ولا يزال محفوظا في (متحف) ربة بني عمون. طوله تسع أذرع (نحو أربعة أمتار ونصف المتر) وعرضه أربع أذرع (نحو مترين)."]]}, {"l": "Deu 9:1-3", "n": "", "vs": [[1, "استمعوا يابني إسرائيل: أنتم على وشك عبور نهر الأردن لتدخلوا لطرد شعوب أكبر وأعظم منكم، وللاستيلاء على مدن عظيمة محصنة بأسوار تبلغ عنان السماء،"], [2, "يقيم فيها العناقيون الجبابرة العمالقة الذين عرفتم عنهم وسمعتم من يقول: من يستطيع أن يتحدى العناقيين؟"], [3, "فاعلموا اليوم أن الرب إلهكم يتقدمكم كنار آكلة، وهو الذي يستأصلهم ويذلهم أمامكم، فتطردونهم وتبيدونهم سريعا كما كلمكم الرب."]]}], "kwAr": "ذوي القامات", "noteAr": ""}, {"kw": "I destroyed", "raw": "Jos_11:21, Jos_11:22; 2Sa_23:16-22; Job_18:16; Isa_5:24; Mal_4:1", "note": "", "refs": [{"l": "Jos 11:21", "n": "", "vs": [[21, "وهاجم يشوع العناقيين أيضا وأبادهم من الجبل في حبرون ومن دبير ومن عناب ومن سائر جبل يهوذا ومن جبال إسرائيل، فقضى عليهم ودمر مدنهم."]]}, {"l": "Jos 11:22", "n": "", "vs": [[22, "فلم يبق منهم أحد في أرض بني إسرائيل سوى قلة لجأت إلى غزة وجت وأشدود،"]]}, {"l": "2Sa 23:16-22", "n": "", "vs": [[16, "فاقتحم الأبطال الثلاثة معسكر الفلسطينيين، وجلبوا ماء من بئر بيت لحم القائمة عند البوابة، وحملوه إلى داود. فلم يشأ أن يشربه بل سكبه للرب،"], [17, "قائلا: «معاذ الله أن أفعل هذا! إنه دم الرجال الذين جازفوا بأنفسهم». وهكذا أبى أن يشربه. هذا ما قام به هؤلاء الأبطال الثلاثة."], [18, "وكان أبيشاي أخو يوآب وابن صروية رئيس ثلاثة أيضا. هذا جابه برمحه ثلاث مئة وقتلهم، فذاعت شهرته بين الثلاثة،"], [19, "وارتفعت مكانته عليهم وصار لهم رئيسا، إلا أنه لم يصل إلى مرتبة الثلاثة الأول."], [20, "وكان بناياهو بن يهوياداع محاربا مجيدا من قبصئيل، هذا صرع بطلي موآب، ونزل إلى وسط جب في يوم مثلج وقتل أسدا،"], [21, "كما قضى على رجل مصري عملاق كان يحمل بيده رمحا، فتصدى له بعصا وخطف الرمح من يده وقتله به."], [22, "هذا ما صنعه بناياهو بن يهوياداع فذاعت شهرته بين الأبطال الثلاثة."]]}, {"l": "Job 18:16", "n": "", "vs": [[16, "تجف أصوله تحته، وتتبعثر فروعه من فوقه."]]}, {"l": "Isa 5:24", "n": "", "vs": [[24, "لهذا كما تلتهم النار القش، وكما يفنى الحشيش الجاف في اللهب، كذلك يصيب أصولهم العفن، ويتناثر زهرهم كالتراب، لأنهم نبذوا شريعة الله واستهانوا بكلمة قدوس إسرائيل"]]}, {"l": "Mal 4:1", "n": "", "vs": [[1, "«انظروا، ها يوم القضاء مقبل، لاهب كتنور يكون فيه جميع المستكبرين وفاعلي الإثم عصافة، فيحرقهم ذلك اليوم ولا يبقي لهم أصلا ولا فرعا، يقول الرب القدير."]]}], "kwAr": "أتلفت", "noteAr": ""}], "arS": [["مع أني ", []], ["أهلكت", ["H8045"]], [" من ", []], ["أمامهم", ["H4480", "H6440"]], [" ", []], ["الأموريين", ["H567"]], [" ذوي ", []], ["القامات", ["H1363"]], [" الطويلة ", []], ["كأشجار", ["H730"]], [" الأرز، ", []], ["الأقوياء", ["H2634"]], [" كأشجار ", []], ["البلوط", ["H437"]], ["، ", []], ["أتلفت", ["H8045"]], [" ", []], ["أثمارهم", ["H6529"]], [" على أغصانها، ", []], ["وجذور", ["H8328"]], [" أشجارهم من ", []], ["تحت", ["H4480", "H8478"]], [" الأرض.", []]]}, {"c": 2, "v": 10, "text": "كما أخرجتكم من ديار مصر وقدت طريقكم عبر الصحراء طوال أربعين سنة لترثوا أرض الأموريين.", "groups": [{"kw": "I brought", "raw": "Exo_12:51; Neh_9:8-12; Psa_105:42, Psa_105:43, Psa_136:10,Psa_136:11; Jer_32:20,Jer_32:21; Eze_20:10; Mic_6:4", "note": "", "refs": [{"l": "Exo 12:51", "n": "", "vs": [[51, "في ذلك اليوم عينه أخرج الرب بني إسرائيل من أرض مصر بحسب فرق عشائرهم."]]}, {"l": "Neh 9:8-12", "n": "", "vs": [[8, "وقد وجدت قلبه خالص الولاء لك، فقطعت له عهدا أن تهبه أرض الكنعانيين والحثيين والأموريين والفرزيين واليبوسيين والجرجاشيين فيرثها نسله. وقد حققت وعدك لأنك صادق."], [9, "أنت رأيت مذلة آبائنا في مصر واستجبت إلى صراخهم عند البحر الأحمر،"], [10, "فأجريت عجائب وآيات على فرعون وعلى سائر رجاله وعلى شعب أرضه كله، لأنك علمت أنهم تجبروا عليهم، فأشهرت بهذه العجائب اسمك إلى هذا اليوم،"], [11, "إذ فلقت البحر أمام آبائنا، فاجتازوا في وسطه على اليابسة، وطرحت مطارديهم في الأعماق كما يطرح حجر في مياه هائجة،"], [12, "وهديتهم بعمود سحاب نهارا، وبعمود نار ليلا، لتضيء لهم طريقهم التي هم فيها سالكون،"]]}, {"l": "Psa 105:42", "n": "", "vs": [[42, "لأنه ذكر كلمته المقدسة التي وعد بها إبراهيم عبده."]]}, {"l": "Psa 105:43", "n": "", "vs": [[43, "وهكذا أخرج شعبه من مصر بابتهاج ومختاريه بترانيم الظفر."]]}, {"l": "Psa 136:10", "n": "", "vs": [[10, "الذي ضرب مصر مع أبكارها، لأن رحمته إلى الأبد تدوم."]]}, {"l": "Psa 136:11", "n": "", "vs": [[11, "وأخرج بني إسرائيل من وسطهم، لأن رحمته إلى الأبد تدوم."]]}, {"l": "Jer 32:20", "n": "", "vs": [[20, "وقد أجريت آيات ومعجزات في ديار مصر، ومازلت تجريها إلى هذا اليوم في شعب إسرائيل وبين سائر البشر، وجعلت اسمك يطبق الآفاق كما هو جار في هذا اليوم،"]]}, {"l": "Jer 32:21", "n": "", "vs": [[21, "وأخرجت شعبك إسرائيل من ديار مصر بآيات ومعجزات، وبيد قديرة وذراع ممدودة، وما ألقيته من خوف شديد في قلوب أهلها،"]]}, {"l": "Eze 20:10", "n": "", "vs": [[10, "وهكذا أخرجتهم من ديار مصر، وأتيت إلى البرية،"]]}, {"l": "Mic 6:4", "n": "", "vs": [[4, "لقد أخرجتك من ديار مصر، وافتديتك من بيت العبودية، وأرسلت أمامك موسى وهرون ومريم"]]}], "kwAr": "أخرجتكم", "noteAr": ""}, {"kw": "and led", "raw": "Num_14:34; Deu_2:7, Deu_8:2-4; Neh_9:21; Psa_95:10; Act_7:42, Act_13:18", "note": "", "refs": [{"l": "Num 14:34", "n": "", "vs": [[34, "وتحملون أوزاركم أربعين سنة. كل يوم بسنة، على عدد الأيام الأربعين التي تجسستم فيها الأرض، فتدركون عاقبة ابتعادي عنكم."]]}, {"l": "Deu 2:7", "n": "", "vs": [[7, "لأن الرب إلهكم بارك كل عمل أيديكم، واعتنى بكم في أثناء رحلتكم في هذه الصحراء الشاسعة، وكان معكم طوال أربعين سنة، فلم يعوزكم شيء"]]}, {"l": "Deu 8:2-4", "n": "", "vs": [[2, "وتذكروا كيف قادكم الرب إلهكم في كل طريق الصحراء هذه الأربعين سنة ليذلكم ويمتحنكم، فيعرف ما في قلوبكم: إن كنتم تحفظون أوامره أم تعصونه."], [3, "فأذلكم ثم أجاعكم وأطعمكم المن الذي لم تكونوا تعرفونه، لا أنتم ولا آباؤكم ليعلمكم أنه ليس بالخبز وحده يحيا الإنسان، بل بكل كلمة ينطق بها فم الرب."], [4, "وفي غضون الأربعين سنة لم تبل ثيابكم عليكم، ولم تتورم أقدامكم."]]}, {"l": "Neh 9:21", "n": "", "vs": [[21, "وعلتهم طوال أربعين سنة في الصحراء، فلم يعوزهم شيء، ولم تبل ثيابهم ولا تورمت أقدامهم،"]]}, {"l": "Psa 95:10", "n": "", "vs": [[10, "أربعين سنة رفضت ذلك الجيل، وقلت: «هم شعب أضلتهم قلوبهم ولم يعرفوا قط طرقي»."]]}, {"l": "Act 7:42", "n": "", "vs": [[42, "فتحول الله عنهم وتركهم يعبدون كواكب السماء، كما جاء في كتاب الأنبياء:"]]}, {"l": "Act 13:18", "n": "", "vs": [[18, "وعالهم في الصحراء نحو أربعين سنة،"]]}], "kwAr": "وقدت", "noteAr": ""}, {"kw": "to possess", "raw": "Num_14:31-35; Deu_1:20,Deu_1:21, Deu_1:39", "note": "", "refs": [{"l": "Num 14:31-35", "n": "", "vs": [[31, "غير أني سأدخل إليها أولادكم الذين ادعيتم أنهم يصبحون أسرى، فيتمتعون بالأرض التي احتقرتموها."], [32, "أما أنتم فإن جثثكم تتساقط في هذا القفر،"], [33, "ويبقى بنوكم في الصحراء أربعين سنة، تعانون من فجوركم، حتى تبلى جثثكم فيها."], [34, "وتحملون أوزاركم أربعين سنة. كل يوم بسنة، على عدد الأيام الأربعين التي تجسستم فيها الأرض، فتدركون عاقبة ابتعادي عنكم."], [35, "أنا الرب قد تكلمت، وهذا ما سأعاقب به هذه الجماعة الشريرة المتآمرة علي: في هذه الصحراء يفنون ويموتون»."]]}, {"l": "Deu 1:20", "n": "", "vs": [[20, "فقلت لكم: ها قد جئتم إلى بلاد الأموريين الجبلية التي وهبها لنا الرب إلهنا،"]]}, {"l": "Deu 1:21", "n": "", "vs": [[21, "فانظروا لأن الرب إلهكم قد أعطاكم الأرض، فاصعدوا واستولوا عليها كما وعد الرب إله آبائكم. لا تخافوا ولا ترتعبوا."]]}, {"l": "Deu 1:39", "n": "", "vs": [[39, "أما أطفالكم الذين ادعيتم أنهم يصبحون غنيمة، وصغاركم الذين لا يميزون بعد الخير والشر، فهم يدخلون إلى هناك ولهم أهب الأرض وهم يرثونها."]]}], "kwAr": "لترثوا", "noteAr": ""}], "arS": [["كما ", []], ["أخرجتكم", ["H5927", "H853"]], [" من ", []], ["ديار", ["H4480", "H776"]], [" ", []], ["مصر", ["H4714"]], [" ", []], ["وقدت", ["H1980"]], [" طريقكم عبر ", []], ["الصحراء", ["H4057"]], [" طوال ", []], ["أربعين", ["H705"]], [" ", []], ["سنة", ["H8141"]], [" ", []], ["لترثوا", ["H3423"]], [" أرض ", []], ["الأموريين", ["H567"]], [".", []]]}, {"c": 2, "v": 11, "text": "وأقمت من بين أبنائكم أنبياء ومن فتيانكم نذيرين. أليس هذا صحيحا ياأبناء إسرائيل، يقول الرب؟", "groups": [{"kw": "I raised", "raw": "1Sa_3:20, 1Sa_19:20; 1Ki_17:1, 1Ki_18:4, 1Ki_19:16, 1Ki_20:13, 1Ki_20:35, 1Ki_20:41, 1Ki_22:8; 2Ki_2:2-5; 2Ki_6:1, 2Ki_17:13; 2Ch_36:15; 2Pe_1:20,2Pe_1:21", "note": "", "refs": [{"l": "1Sa 3:20", "n": "", "vs": [[20, "وعرف جميع بني إسرائيل من دان إلى بئر سبع أن الرب قد ائتمن صموئيل ليكون له نبيا."]]}, {"l": "1Sa 19:20", "n": "", "vs": [[20, "فبعث بجنود للقبض عليه. ولكن عندما شاهدوا جماعة الرب يتنبأون برئاسة صموئيل، حل روح الرب على الجنود فتنبأوا هم أيضا."]]}, {"l": "1Ki 17:1", "n": "", "vs": [[1, "وقال إيليا التشبي من أهل جلعاد لأخآب: «حي هو الرب إله إسرائيل الذي أخدمه، إنه لن يهطل ندى ولا مطر في هذه السنين، إلا حين أعلن ذلك»."]]}, {"l": "1Ki 18:4", "n": "", "vs": [[4, "فحين شرعت إيزابل في قتل أنبياء الرب، أخذ عوبديا مئة نبي وخبأهم خمسين خمسين في مغارتين، وتكفل بإعالتهم بالطعام والماء."]]}, {"l": "1Ki 19:16", "n": "", "vs": [[16, "ثم امسح ياهو بن نمشي ملكا على إسرائيل، وكذلك امسح أليشع بن شافاط من آبل محولة نبيا خلفا لك."]]}, {"l": "1Ki 20:13", "n": "", "vs": [[13, "وإذا بنبي يتقدم إلى أخآب قائلا: «هذا ما يقوله الرب: هل ترى هذا الجيش الغفير؟ ها أنا أنصرك عليه اليوم، فتعلم أني أنا الرب»."]]}, {"l": "1Ki 20:35", "n": "", "vs": [[35, "ونزولا عند أمر الرب، قال رجل من بني الأنبياء لصاحبه: «اضربني بسيفك». فأبى الرجل أن يضربه."]]}, {"l": "1Ki 20:41", "n": "", "vs": [[41, "عندئذ بادر النبي فرفع العصابة عن عينيه فأدرك الملك أنه من بني الأنبياء."]]}, {"l": "1Ki 22:8", "n": "", "vs": [[8, "فأجاب ملك إسرائيل: «يوجد بعد رجل واحد، يمكننا عن طريقه أن نطلب مشورة الرب، ولكني أمقته لأنه لا يتنبأ علي بغير الشر. إنه ميخا بن يملة». فقال يهوشافاط: «لا تقل هذا أيها الملك»."]]}, {"l": "2Ki 2:2-5", "n": "", "vs": [[2, "فقال إيليا لأليشع: «امكث هنا لأن الرب قد أوفدني إلى بيت إيل». فأجاب أليشع: «حي هو الرب، وحية هي نفسك إني لا أتركك». فانطلقا معا إلى بيت إيل."], [3, "فخرج بنو الأنبياء المقيمون في بيت إيل للقاء أليشع وقالوا له: «هل تعلم أن الرب سيأخذ اليوم منك سيدك إيليا؟» فأجاب: «نعم، إني أعلم، فاصمتوا»."], [4, "ثم قال له إيليا: «ياأليشع، امكث هنا لأن الرب قد أوفدني إلى أريحا». فأجابه: «حي هو الرب وحية هي نفسك إني لا أتركك». فتوجها نحو أريحا."], [5, "وعندما بلغاها تقدم بنو الأنبياء المقيمون في أريحا من أليشع قائلين: «أتعلم أن الرب سيأخذ اليوم منك سيدك إيليا؟» فقال: «نعم، إني أعلم فاصمتوا»."]]}, {"l": "2Ki 6:1", "n": "", "vs": [[1, "وقال بنو الأنبياء لأليشع: «ضاق بنا المكان الذي نحن ماكثون فيه للاجتماع بك."]]}, {"l": "2Ki 17:13", "n": "", "vs": [[13, "وقد أنذر الرب إسرائيل ويهوذا عن طريق أنبيائه ورائيه قائلا: «ارجعوا عن طرقكم الأثيمة، وأطيعوا وصاياي وفرائضي بمقتضى كل الشريعة التي أوصيت آباءكم بتطبيقها، والتي أعلنتها لكم على لسان عبيدي الأنبياء."]]}, {"l": "2Ch 36:15", "n": "", "vs": [[15, "وأرسل الرب إله آبائهم إليهم رسلا بصورة متوالية محذرا إياهم لأنه أشفق على شعبه وعلى مسكنه."]]}, {"l": "2Pe 1:20", "n": "", "vs": [[20, "ولكن، قبل كل شيء، اعلموا أن كل نبوءة واردة في الكتاب لا تفسر باجتهاد خاص."]]}, {"l": "2Pe 1:21", "n": "", "vs": [[21, "إذ لم تأت نبوءة قط بإرادة بشرية، بل تكلم بالنبوآت جميعا رجال الله غالقديسونف مدفوعين بوحي الروح القدس."]]}], "kwAr": "وأقمت", "noteAr": ""}, {"kw": "and", "raw": "Amo_7:12, Amo_7:13; Isa_30:10,Isa_30:11; Jer_11:21, Jer_26:11; Mic_2:6; Mat_21:34-38; Act_4:18, Act_5:28, Act_7:51; 1Th_2:15, 1Th_2:16", "note": "", "refs": [{"l": "Amo 7:12", "n": "", "vs": [[12, "ثم قال أمصيا لعاموس: «اهرب أيها الرائي إلى أرض يهوذا، وكل خبزا هناك وتنبأ فيها."]]}, {"l": "Amo 7:13", "n": "", "vs": [[13, "أما بيت إيل فلا تعد للتنبوء فيها، لأنها مقدس الملك ومقر المملكة»."]]}, {"l": "Isa 30:10", "n": "", "vs": [[10, "ويقولون للأنبياء: «لا تتنبأوا لنا بما هو حق، بل كلمونا بالكلام المداهن وتنبأوا بالمخادعات."]]}, {"l": "Isa 30:11", "n": "", "vs": [[11, "اعدلوا عن الطريق، حيدوا عن السبيل، وكفوا عن مجابهتنا بكلام قدوس إسرائيل»."]]}, {"l": "Jer 11:21", "n": "", "vs": [[21, "«لذلك، هكذا يقول الرب عن رجال عناثوث الذين يلتمسون نفسك قائلين: لا تتنبأ باسم الرب لئلا تموت بأيدينا."]]}, {"l": "Jer 26:11", "n": "", "vs": [[11, "ثم خاطب الكهنة والأنبياء رؤساء يهوذا وسائر الشعب: «هذا الرجل يستحق حكم الموت. لأنه تنبأ على هذه المدينة بالدمار كما سمعتم بآذانكم»."]]}, {"l": "Mic 2:6", "n": "", "vs": [[6, "يقول الشعب للأنبياء: لا تتنبأوا بمثل هذه الأمور، لأن العار لن يلحق بنا."]]}, {"l": "Mat 21:34-38", "n": "", "vs": [[34, "ولما حان أوان القطاف، أرسل عبيده إلى المزارعين ليتسلم ثمر الكرم."], [35, "فقبض المزارعون على العبيد، فضربوا أحدهم، وقتلوا غيره، ورجموا الآخر بالحجارة."], [36, "ثم أرسل رب البيت ثانية عبيدا آخرين أكثر عددا من الأولين. ففعل المزارعون بهؤلاء ما فعلوه بأولئك."], [37, "وأخيرا أرسل إليهم ابنه، قائلا: سيهابون ابني!"], [38, "فما إن رأى المزارعون الابن حتى قال بعضهم لبعض: هذا هو الوريث! تعالوا نقتله فنستولي على ميراثه."]]}, {"l": "Act 4:18", "n": "", "vs": [[18, "ثم أحضروهما وأمروهما ألا ينطقا باسم يسوع ولا يعلما الناس به."]]}, {"l": "Act 5:28", "n": "", "vs": [[28, "قائلا: «أمرناكم بشدة ألا تعلموا بهذا الاسم، ولكنكم قد ملأتم أورشليم بتعليمكم، وتريدون أن تحملونا مسئولية سفك دمه!»"]]}, {"l": "Act 7:51", "n": "", "vs": [[51, "ثم قال استفانوس: «ياأصحاب الرقاب الصلبة والقلوب والآذان غير المختونة! إنكم دائما تقاومون الروح القدس. وكما فعل آباؤكم تفعلون!"]]}, {"l": "1Th 2:15", "n": "", "vs": [[15, "الذين قتلوا الرب يسوع والأنبياء واضطهدونا نحن أيضا، وهم لا يرضون الله ويعادون الناس جميعا،"]]}, {"l": "1Th 2:16", "n": "", "vs": [[16, "إذ يمنعوننا من تبشير الأمم ليخلصوا، وبذلك يستكملون خطاياهم كل حين، ولكن الغضب قد حل عليهم إلى الغاية."]]}], "kwAr": "ومن فتيانكم", "noteAr": ""}, {"kw": "Nazarites", "raw": "Num_6:2; Jdg_13:4-7; Lam_4:7; Luk_1:3-17", "note": "", "refs": [{"l": "Num 6:2", "n": "", "vs": [[2, "«أوص بني إسرائيل وقل لهم: أي رجل أو امرأة تعهد بنذر خاص يتنسك فيه للرب،"]]}, {"l": "Jdg 13:4-7", "n": "", "vs": [[4, "إنما إياك أن تشربي خمرا أو مسكرا أو تأكلي شيئا محرما"], [5, "لأنك ستحملين وتنجبين ابنا. فلا تحلقي شعر رأسه لأن الصبي يكون نذيرا لله من مولده، وهو يشرع في إنقاذ إسرائيل من تسلط الفلسطينيين"], [6, "فأسرعت إلى زوجها وقالت: «ظهر لي رجل من عند الله، ومنظره كهيئة ملاك الرب مجلل بالرهبة. لم أسأله من أين جاء، ولا هو أخبرني عن اسمه،"], [7, "وقال لي: ها أنت ستحبلين وتلدين ابنا، فإياك أن تشربي خمرا ولا مسكرا، ولا تأكلي شيئا محرما، لأن الصبي يكون نذيرا للرب منذ مولده حتى يوم وفاته»."]]}, {"l": "Lam 4:7", "n": "", "vs": [[7, "كان نبلاؤها أنقى من الثلج وأنصع من اللبن. أجسادهم أكثر حمرة من المرجان، وقاماتاهم كالياقوت العأزرق،"]]}, {"l": "Luk 1:3-17", "n": "", "vs": [[3, "رأيت أنا أيضا، بعدما تفحصت كل شيء من أول الأمر تفحصا دقيقا، أن أكتبها إليك مرتبة ياصاحب السمو ثاوفيلس"], [4, "لتتأكد لك صحة الكلام الذي تلقيته."], [5, "كان في زمن هيرودس ملك اليهودية كاهن اسمه زكريا، من فرقة أبيا، وزوجته من نسل هارون، واسمها أليصابات."], [6, "وكان كلاهما بارين أمام الله، يسلكان وفقا لوصايا الرب وأحكامه كلها بغير لوم."], [7, "ولكن لم يكن لهما ولد، إذ كانت أليصابات عاقرا وكلاهما قد تقدما في السن كثيرا."], [8, "وبينما كان زكريا يؤدي خدمته الكهنوتية أمام الله في دور فرقته،"], [9, "وقعت عليه القرعة التي ألقيت حسب عادة الكهنوت ليدخل هيكل الرب ويحرق البخور."], [10, "وكان جمهور الشعب جميعا يصلون خارجا في وقت إحراق 781"]], [" في مواضعكم فتئنون كما ", []], ["تئن", ["H5781"]], [" ", []], ["عربة", ["H5699"]], [" ", []], ["تحت", ["H8478"]], [" وطأة ", []], ["ثقل", ["H4392"]], [" ", []], ["أكداسها", ["H5995"]], [".", []]]}, {"c": 2, "v": 14, "text": "فلا يتاح الهرب للسريع، وتتلاشى قوة الجبار، ويعجز القوي عن إنقاذ نفسه.", "groups": [{"kw": "the flight", "raw": "Amo_9:1-3; Job_11:20 *marg. Ecc_9:11; Isa_30:16; Jer_9:23", "note": "", "refs": [{"l": "Amo 9:1-3", "n": "", "vs": [[1, "ورأيت السيد واقفا إلى جوار المذبح قائلا: «اضرب تيجان الأعمدة حتى تهتز العتبات، وحطمها على رؤوس جميع الشعب. ومن ينجو منهم أهلكه بالسيف، فلا يهرب منهم أحد ولا يفلت منهم ناج."], [2, "وإن نقبوا لأنفسهم ملجأ في أعماق الهاوية، فإن يدي تطولهم هناك، وإن ارتقوا إلى السماوات فمن هناك أنزلهم."], [3, "وإن اختبأوا في أعالي الكرمل فهناك أبحث عنهم وأعتقلهم. وإن تواروا عني في أعماق البحر فإني آمر هناك الحية فتلدغهم."]]}, {"l": "Job 11:20", "n": "*marg.", "vs": [[20, "أما عيون الأشرار فيصيبها التلف، ومنافذ الهرب تختفي من أمامهم، ولا أمل لهم إلا في الموت»."]]}, {"l": "Ecc 9:11", "n": "", "vs": [[11, "وتطلعت فرأيت شيئا آخر تحت الشمس: إن الفوز في السباق ليس للسريع، والظفر في المعركة ليس للأقوياء، ولا الخبز من نصيب الحكماء، ولا الغنى لذوي الفهم، ولا الحظوة للعلماء، لأنهم كافة معرضون لتقلبات الأوقات والمفاجآت،"]]}, {"l": "Isa 30:16", "n": "", "vs": [[16, "وقلتم: لا بل نهرب على الخيل، أنتم حقا تهربون. وقلتم: سنركب على متون جياد سريعة، لهذا فإن مطارديكم يسرعون في تعقبكم."]]}, {"l": "Jer 9:23", "n": "", "vs": [[23, "«فلا يفتخرن الحكيم بحكمته، ولا يزهون الجبار بجبروته، ولا الغني بثروته."]]}], "kwAr": "الهرب", "noteAr": ""}, {"kw": "himself", "raw": "Heb. his soul, or life", "note": "Heb. his soul, or life", "refs": [], "kwAr": "نفسه", "noteAr": "بالعبرية: «نفسه»، أي حياته."}], "arS": [["فلا ", []], ["يتاح", ["H6"]], [" ", []], ["الهرب", ["H4498"]], [" ", []], ["للسريع", ["H4480", "H7031"]], ["، ", []], ["وتتلاشى", ["H553"]], [" ", []], ["قوة", ["H3581"]], [" ", []], ["الجبار", ["H1368"]], ["، ويعجز ", []], ["القوي", ["H2389"]], [" عن ", []], ["إنقاذ", ["H4422"]], [" ", []], ["نفسه", ["H5315"]], [".", []]]}, {"c": 2, "v": 15, "text": "ولا يصمد رامي القوس ولا يصيب الهدف، ولا يسلم سريع العدو، ولا ينجو راكب الفرس بحياته.", "groups": [{"kw": "neither", "raw": "Psa_33:16, Psa_33:17", "note": "", "refs": [{"l": "Psa 33:16", "n": "", "vs": [[16, "لا يخلص الملك بالجيش العظيم، ولا الجبار بشدة القوة."]]}, {"l": "Psa 33:17", "n": "", "vs": [[17, "باطلا يرجو النصر من يتكل على الخيل، فإنها لا تنجي رغم قوتها."]]}], "kwAr": "ولا", "noteAr": ""}, {"kw": "himself", "raw": "Heb. his soul, or life", "note": "Heb. his soul, or life", "refs": [], "kwAr": "بحياته", "noteAr": "بالعبرية: «نفسه»، أي حياته."}], "arS": [["ولا ", []], ["يصمد", ["H5975"]], [" ", []], ["رامي", ["H8610"]], [" ", []], ["القوس", ["H7198"]], [" ولا يصيب الهدف، ولا ", []], ["يسلم", ["H4422"]], [" ", []], ["سريع", ["H7031"]], [" ", []], ["العدو", ["H7272"]], ["، ولا ينجو ", []], ["راكب", ["H7392"]], [" ", []], ["الفرس", ["H5483"]], [" ", []], ["بحياته", ["H5315"]], [".", []]]}, {"c": 2, "v": 16, "text": "والثابت الجنان بين أقرانه الأبطال يفر عريانا في ذلك اليوم، يقول الرب.", "groups": [{"kw": "courageous", "raw": "Heb. strong of his heart, Jer_48:41", "note": "Heb. strong of his heart, Jer_48:41", "refs": [{"l": "Jer 48:41", "n": "", "vs": [[41, "فيستولي على المدن، وتسقط الحصون، وتصبح في ذلك اليوم قلوب محاربي موآب كقلب امرأة في مخاضها."]]}], "kwAr": "والثابت الجنان", "noteAr": "بالعبرية: «قوي قلبه». انظر إر 48: 41"}, {"kw": "flee", "raw": "Jdg_4:17; 2Ki_7:8-20; Mar_14:52", "note": "", "refs": [{"l": "Jdg 4:17", "n": "", "vs": [[17, "وأما سيسرا فهرب ماشيا إلى خيمة ياعيل امرأة حابر القيني الذي كان قد عقد اتفاق صلح بينه وبين يابين ملك حاصور."]]}, {"l": "2Ki 7:8-20", "n": "", "vs": [[8, "ودخل هؤلاء البرص إحدى الخيام في أطراف المعسكر، فأكلوا وشربوا واستولوا على ما فيها من فضة وذهب وثياب، ثم طمروها. ورجعوا ودخلوا إلى خيمة أخرى واستولوا على ما فيها أيضا وطمروه."], [9, "ثم قال بعضهم لبعض: «إننا نخطيء فيما نفعل. فاليوم يوم بشارة ونحن ساكتون، فإن انتظرنا طلوع الفجر ولم نخبر ينالنا العقاب. فلندخل المدينة ونخبر رجال قصر الملك»."], [10, "فرجعوا إلى المدينة وقالوا للبواب: «لقد دخلنا معسكر الأراميين فلم نجد فيه أحدا، ولم نسمع في أرجائه صوت إنسان. ولكننا رأينا خيلا وحميرا ما برحت معقولة في مرابضها، وخياما لا تزال منصوبة»."], [11, "فأذاع البوابون النبأ حتى بلغ قصر الملك."], [12, "فنهض الملك ليلا وقال لضباطه: «لأخبرنكم ما صنع الأراميون! لقد أدركوا أننا نتضور جوعا، فهجروا المعسكر ليختبئوا في الحقول، حتى إذا خرجنا من المدينة ينقضون علينا ويأسروننا أحياء ويستولون على المدينة»."], [13, "فأجاب واحد من الضباط وقال: «ليأخذ بعض منا خمسة من الخيل الباقية في المدينة. فإن أصابهم شر يكونون نظير بقية الإسرائيليين المعتصمين بالمدينة، أو نظير من هلكوا من الإسرائيليين. فلنرسل ونستطلع الأمر»."], [14, "فأعدوا مركبتي خيل انطلقتا بمن فيهما من رجال أرسلهم الملك خلف الأراميين."], [15, "فاقتفوا أثرهم إلى نهر الأردن، وإذا كل الطريق مملوءة ثيابا وأمتعة مما طرحها الأراميون عند فرارهم المفاجيء السريع. فرجع الرسل وأخبروا الملك."], [16, "فاندفع الشعب نحو معسكر الأراميين ونهبوه، وصارت كيلة الدقيق بشاقل، وكيلتا الشعير بشاقل(اثني عشر جراما)، حسب كلام الرب."], [17, "وعين الملك على مدخل بوابة المدينة الجندي الذي كان يتوكأ على ذراعه، فداسه الشعب في الزحام ومات عند الباب كما تنبأ أليشع في اليوم السابق عندما جاءه الملك ليقبض عليه."], [18, "فعندما قال رجل الله للملك: «غدا في مثل هذا الوقت تكون كيلتا الشعير بشاقل وكيلة الدقيق بشاقل في مدخل بوابة السامرة»."], [19, "ولكن الجندي قال لرجل الله: «حتى إن فتح الرب كوى في السماء فهل يمكن أن يحدث هذا الأمر؟» فقال له أليشع: «سترى ذلك بعينيك ولكنك لن تأكل منه»."], [20, "فتحققت النبوءة إذ داسه الشعب عند الباب فمات."]]}, {"l": "Mar 14:52", "n": "", "vs": [[52, "فترك الإزار وهرب منهم عريانا."]]}], "kwAr": "يفر", "noteAr": ""}], "arS": [["والثابت", ["H533", "H3820"]], [" الجنان بين أقرانه ", []], ["الأبطال", ["H1368"]], [" ", []], ["يفر", ["H5127"]], [" ", []], ["عريانا", ["H6174"]], [" في ذلك ", []], ["اليوم", ["H3117"]], ["، ", []], ["يقول", ["H5002"]], [" ", []], ["الرب", ["H3068"]], [".", []]]}, {"c": 3, "v": 1, "text": "اس ي سأرد سبيهم وأرحمهم»."]]}, {"l": "Eze 37:16", "n": "", "vs": [[16, "«وأنت ياابن آدم، خذ لك قضيبا واحدا واكتب عليه: هذا ليهوذا ولأبناء إسرائيل رفاقه، ثم خذ قضيبا آخر واكتب عليه: هذا ليوسف قضيب أفرايم وكل شعب إسرائيل رفاقه."]]}, {"l": "Eze 37:17", "n": "", "vs": [[17, "وضمهما معا كقضيب واحد فيصبحا في يدك قضيبا واحدا."]]}], "kwAr": "عليكم", "noteAr": ""}, {"kw": "which", "raw": "Amo_2:10", "note": "", "refs": [{"l": "Amo 2:10", "n": "", "vs": [[10, "كما أخرجتكم من ديار مصر وقدت طريقكم عبر الصحراء طوال أربعين سنة لترثوا أرض الأموريين."]]}], "kwAr": "التي أخرجتها", "noteAr": ""}], "arS": [["اسمعوا", ["H8085"]], [" ", []], ["يابني", ["H1121"]], [" ", []], ["إسرائيل", ["H3478"]], [" هذه ", []], ["الكلمة", ["H1697"]], [" التي ", []], ["قضى", ["H1696"]], [" بها ", []], ["الرب", ["H3068"]], [" عليكم، بل على كل ", []], ["القبيلة", ["H4940"]], [" التي ", []], ["أخرجتها", ["H5927"]], [" من ", []], ["ديار", ["H4480", "H776"]], [" ", []], ["مصر", ["H4714"]], [":", []]]}, {"c": 3, "v": 2, "text": "إياكم وحدكم اخترت من بين جميع قبائل الأرض، لهذا أعاقبكم على جميع آثامكم.", "groups": [{"kw": "only", "raw": "Exo_19:5, Exo_19:6; Deu_7:6, Deu_10:15, Deu_26:18, Deu_32:9; Psa_147:19; Isa_63:19", "note": "", "refs": [{"l": "Exo 19:5", "n": "", "vs": [[5, "لذلك إن أطعتم عهدي، تكونوا لي ملكا خاصا من بين جميع الشعوب، لأن لي كل الأرض."]]}, {"l": "Exo 19:6", "n": "", "vs": [[6, "وتكونون لي مملكة كهنة وأمة مقدسة. هذا هو الكلام الذي تخاطب به بني إسرائيل»."]]}, {"l": "Deu 7:6", "n": "", "vs": [[6, "لأنكم شعب مقدس للرب إلهكم. فإياكم قد اختار الرب إلهكم من بين جميع شعوب الأرض لتكونوا شعبه الخاص."]]}, {"l": "Deu 10:15", "n": "", "vs": [[15, "غير أن الرب فضل آباءكم واصطفى ذريتهم من بعدهم، التي هي أنتم، لتكونوا فوق جميع أمم الأرض، كما هو حادث اليوم."]]}, {"l": "Deu 26:18", "n": "", "vs": [[18, "كما أعلن الرب اليوم أنكم تكونون له شعبا خاصا، حسب وعده لكم، وأن عليكم طاعة وصاياه جميعها،"]]}, {"l": "Deu 32:9", "n": "", "vs": [[9, "لأن نصيب الرب هو شعبه، وأبناء يعقوب قرعة ميراثه."]]}, {"l": "Psa 147:19", "n" ض", ["H776"]], [" إذا لم يكن هناك فخ ", []], ["منصوب", ["H4170"]], ["؟ ", []], ["أينطبق", ["H5927"]], [" فخ على الأرض من غير أن يكون قد ", []], ["أمسك", ["H3920"]], [" شيئا؟", []]]}, {"c": 3, "v": 6, "text": "أيدوي بوق في المدينة ولا يعتري الشعب الخوف؟ أيقع بلاء في المدينة ما لم يكن الرب قد أرسله؟", "groups": [{"kw": "a trumpet", "raw": "Jer_4:5, Jer_6:1; Eze_33:3; Hos_5:8; Zep_1:16", "note": "", "refs": [{"l": "Jer 4:5", "n": "", "vs": [[5, "أذيعوا في يهوذا، وأعلنوا في أورشليم قائلين: انفخوا بالبوق في البلاد، ونادوا بصوت مرتفع، وقولوا: احتشدوا ولندخل المدن المحصنة،"]]}, {"l": "Jer 6:1", "n": "", "vs": [[1, "«لوذوا بالنجاة ياذرية بنيامين، واهربوا من وسط أورشليم. انفخوا بالبوق في تقوع، وأشعلوا علم نار على بيت هكاريم، لأن الشر قد أقبل من الشمال ليعيث في الأرض خرابا."]]}, {"l": "Eze 33:3", "n": "", "vs": [[3, "فإذا رأى الأعداء مقبلين لمهاجمة الأرض، فنفخ بالبوق تحذيرا للشعب،"]]}, {"l": "Hos 5:8", "n": "", "vs": [[8, "انفخوا في أبواق الحرب في جبعة وفي الرامة، وأطلقوا صيحة القتال في بيت آون: تقدم يابنيامين."]]}, {"l": "Zep 1:16", "n": "", "vs": [[16, "يوم دوي بوق وصيحة قتال ضد المدن الحصينة والبروج الشامخة."]]}], "kwAr": "بوق", "noteAr": ""}, {"kw": "and the people", "raw": "Jer_5:22, Jer_10:7; 2Co_5:11", "note": "", "refs": [{"l": "Jer 5:22", "n": "", "vs": [[22, "ألا تخشونني؟» يقول الرب، ألا ترتعدون في حضرتي؟ قد جعلت الرمل حدا لمياه البحر، حاجزا أبديا لا يتخطاه. تتلاطم أمواجه ولكنها تعجز عن تعديه، وتهدر ولكنها لا تتجاوزه."]]}, {"l": "Jer 10:7", "n": "", "vs": [[7, "من لا يتقيك ياملك الأمم؟ فالخوف منك يليق بك، إذ لا يوجد بين حكماء الشعوب وفي جميع ممالكهم من هو نظيرك."]]}, {"l": "2Co 5:11", "n": "", "vs": [[11, "فبدافع وعينا لرهبة الرب، نحاول إقناع الناس. ولكننا ظاهرون أمام الله، وأرجو أن نكون ظاهرين أيضا في ضمائركم."]]}], "kwAr": "ولا يعتري الشعب", "noteAr": ""}, {"kw": "be afraid", "raw": "or, run together", "note": "or, run together", "refs": [], "kwAr": "الخوف", "noteAr": "أو: «يركض معا»."}, {"kw": "shall there", "raw": "That is, Shall there be any evil, or calamity (not moral evil), inflicted on a wicked city, which does not proceed from me, as the effect of my wrath? These animated interrogatives were intended to convince the people that they had cause for alarm, as their monstrous iniquities called down the vengeance of God to punish them with these calamities. Gen_50:20; Isa_14:24-27, Isa_45:7; Act_2:23, Act_4:28", "note": "That is, Shall there be any evil, or calamity (not moral evil), inflicted on a wicked city, which does not proceed from me, as the effect of my wrath? These animated interrogatives were intended to convince the people that they had cause for alarm, as their monstrous iniquities called down the vengeance of God to punish them with these calamities. Gen_50:20; Isa_14:24-27, Isa_45:7; Act_2:23, Act_4:28", "refs": [{"l": "Gen 50:20", "n": "", "vs": [[20, "أنتم نويتم لي شرا، ولكن الله قصد بالشر خيرا، لينجز ما تم اليوم، لإحياء شعب كثير."]]}, {"l": "Isa 14:24-27", "n": "", "vs": [[24, "لقد أقسم الرب القدير قائلا: «حقا ما عزمت عليه لابد أن يتحقق، وما نويت عليه حتما يتم:"], [25, "أن أحطم أشور في أرضي وأطأه على جبالي، فيلقي عنهم نيره، ويزول عن كاهلهم حمله."], [26, "هذا هو القضاء الذي حكمت به على الأرض كلها، وهذه هي اليد التي امتدت على كل الأمم."], [27, "لأن الرب القدير قد قضى، فمن يبطل قضاءه؟ ويده قد امتدت فمن يردها؟»"]]}, {"l": "Isa 45:7", "n": "", "vs": [[7, "أنا مبدع النور وخالق الظلمة، أنا صانع الخير وخالق الضر، أنا هو الرب فاعل كل هذه."]]}, {"l": "Act 2:23", "n": "", "vs": [[23, "ومع ذلك فقد سمح الله ، وفقا لمشيئته المحتومة وعلمه السابق، أن تقبضوا عليه وتصلبوه وتقتلوه بأيدي الأثمة."]]}, {"l": "Act 4:28", "n": "", "vs": [[28, "وعملوا به كل ما سبق أن رسمت يدك وقضت مشيئتك أن يكون."]]}], "kwAr": "أيقع بلاء", "noteAr": "أي: هل يقع شر أو نكبة (لا شر أخلاقي) على مدينة شريرة دون أن يصدر مني، كأثر لغضبي؟ قُصد بهذه الأسئلة الحية إقناع الشعب بأن لديهم سببا للانزعاج، لأن آثامهم الفظيعة استدعت انتقام الله ليعاقبهم بهذه النكبات. انظر تك 50: 20؛ إش 14: 24-27؛ 45: 7؛ أع 2: 23؛ 4: 28"}, {"kw": "the Lord hath not done it", "raw": "or, and shall not the Lord do somewhat", "note": "or, and shall not the Lord do somewhat", "refs": [], "kwAr": "ما لم يكن الرب قد أرسله", "noteAr": "أو: «أفلا يفعل الرب شيئا»."}], "arS": [["أيدوي", ["H8628"]], [" ", []], ["بوق", ["H7782"]], [" في ", []], ["المدينة", ["H5892"]], [" ولا يعتري ", []], ["الشعب", ["H5971"]], [" ", []], ["الخوف", ["H2729"]], ["؟ أيقع ", []], ["بلاء", ["H7451"]], [" في المدينة ما لم يكن ", []], ["الرب", ["H3068"]], [" قد أرسله؟", []]]}, {"c": 3, "v": 7, "text": "إن السيد الرب لا يجري أمرا من غير أن يعلن سره لعبيده الأنبياء.", "groups": [{"kw": "but", "raw": "Gen_6:13, Gen_18:17; 1Ki_22:19-23; 2Ki_3:17-20, 2Ki_6:12, 2Ki_22:13, 2Ki_22:20; Psa_25:14; Dan_9:22-27, Dan_10:21, Dan_11:2; Joh_15:15; Rev_1:1, Rev_1:19, Rev_4:1; Rev. 6:1-20:15", "note": "", "refs": [{"l": "Gen 6:13", "n": "", "vs": [[13, "فقال الله لنوح: «قد أزفت نهاية البشر جميعا أمامي، لأنهم ملأوا الأرض ظلما. لذلك سأبيدهم مع الأرض."]]}, {"l": "Gen 18:17", "n": "", "vs": [[17, "فقال الرب: «أأكتم عن إبراهيم ما أنا فاعله؟"]]}, {"l": "1Ki 22:19-23", "n": "", "vs": [[19, "فأجاب ميخا: «إذا فاسمع كلام الرب: قد شاهدت الرب جالسا على كرسيه وكل أجناد السماء ماثلة عن يمينه وعن يساره."], [20, "فسأل الرب: من يغري أخآب ليخرج للحرب ويموت في راموت جلعاد؟ فأجاب كل منهم بشيء."], [21, "ثم تقدم روح الضلال وقال: أنا أغويه. فسأله الرب: بماذا؟"], [22, "فأجاب: أخرج، وأصبح روح ضلال في أفواه جميع أنبيائه. فقال الرب: إنك قادر على إغوائه وتفلح في ذلك، فامض ونفذ هذا الأمر."], [23, "وها الرب قد جعل الآن روح ضلال في أفواه جميع أنبيائك هؤلاء، وقد قضى عليك بالشر»."]]}, {"l": "2Ki 3:17-20", "n": "", "vs": [[17, "ومع أنكم لن تروا ريحا ولا مطرا فإن هذا الوادي سيفيض بالماء، فتشربون أنتم وماشيتكم وبهائمكم."], [18, "وهذا أمر يسير لدى الرب، وهو أيضا ينصركم على ملك موآب."], [19, "فتدمرون كل مدينة محصنة، وكل مدينة رئيسية، وتقطعون كل شجرة مثمرة، وتردمون كل عيون الماء، وتخربون كل حقل خصب بالحجارة»."], [20, "وفي الصباح، في ميعاد تقديم المحرقة دوى هدير مياه متدفقة من طريق أدوم، ففاضت الأرض بالمياه."]]}, {"l": "2Ki 6:12", "n": "", "vs": [[12, "فأجابه واحد من ضباطه: «لا يوجد من يتآمر عليك ياسيدي الملك، ولكن النبي أليشع المقيم في إسرائيل يبلغ ملك إسرائيل حتى بالأمور التي تهمس بها في مخدع نومك»."]]}, {"l": "2Ki 22:13", "n": "", "vs": [[13, "«اذهبوا واسألوا الرب عن مصيري ومصير شعب يهوذا بناء على ما ورد في هذا السفر الذي تم العثور عليه، إذ إن غضب الرب المحتدم علينا عظيم جدا، لأن آباءنا لم يطيعوا كلام هذا السفر، ولم يمارسوا كل ما ورد فيه»."]]}, {"l": "2Ki 22:20", "n": "", "vs": [[20, "لذلك ها أنا أتوفاك فتدفن في قبرك بسلام، ولا تشهد عيناك ما سأنزله بهذا الموضع من شر». فحمل الرجال ردها إلى الملك يوشيا."]]}, {"l": "Psa 25:14", "n": "", "vs": [[14, "يطلع الرب خائفيه على مقاصده الخفية، ويتعهد تعليمهم."]]}, {"l": "Dan 9:22-27", "n": "", "vs": [[22, "وأفهمني قائلا: يادانيآل قد جئت لأعلمك الفهم."], [23, "فمنذ أن شرعت في تضرعاتك صدر إلي الأمر لأجيء إليك وأطلعك على ما تبغي، لأنك محبوب جدا، لهذا تأمل ما أقول وافهم الرؤيا."], [24, "قد صدر القضاء أن يمضي سبعون أسبوعا على شعبك وعلى مدينة قدسك، للانتهاء من المعصية والقضاء على الخطيئة، وللتكفير عن الإثم، ولإشاعة البر الأبدي وختم الرؤيا والنبوءة ولمسح قدوس القدوسين."], [25, "لهذا فاعلم وافهم أن الحقبة الممتدة منذ صدور الأمر بإعادة بناء أورشليم إلى مجيء المسيح، سبعة أسابيع، ثم اثنان وستون أسبوعا يبنى في غضونها سوق وخليج. إنما تكون تلك أزمنة ضيق."], [26, "وبعد اثنين وستين أسبوعا يقتل المسيح، ولكن ليس من أجل نفسه، ويدمر شعب رئيس آت المدينة والقدس، وتقبل آخرتها كطوفان، وتستمر الحرب حتى النهاية، ويعم الخراب المقضي به."], [27, "ويبرم عهدا ثابتا مع كثيرين لمدة أسبوع واحد، ولكنه في وسط الأسبوع يبطل الذبيحة والتقدمة، ويقيم على جناح الهيكل رجاسة الخراب، إلى أن يتم القضاء، فينصب العقاب على المخرب»."]]}, {"l": "Dan 10:21", "n": "", "vs": [[21, "ولكني أطلعك على ما نص عليه في كتاب الحق، ولا أحد يؤازرني ضد هؤلاء سوى حارس شعبكم الملاك ميخائيل»."]]}, {"l": "Dan 11:2", "n": "", "vs": [[2, "والآن لأكشفن لك الحقيقة، فها ثلاثة ملوك يتولون حكم فارس، يعقبهم رابع يكون أوفرهم ثراء. وبفضل قوة غناه يثير الجميع على مملكة اليونان."]]}, {"l": "Joh 15:15", "n": "", "vs": [[15, "لا أسميكم عبيدا بعد، لأن العبد لا يطلعه سيده على ما يفعله. ولكني قد سميتكم أحباء لأني أطلعتكم على كل ما سمعته من أبي."]]}, {"l": "Rev 1:1", "n": "", "vs": [[1, "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."]]}, {"l": "Rev 1:19", "n": "", "vs": [[19, "دون ما رأيته، وما يحدث الآن، وما يوشك أن يحدث بعده."]]}, {"l": "Rev 4:1", "n": "", "vs": [[1, "بعد ذلك رأيت بابا مفتوحا في السماء، وإذا الصوت الذي سمعته من قبل يخاطبني كأنه بوق، ويقول: «اصعد إلى هنا فأريك ما لابد أن يحدث بعد هذا»."]]}, {"l": "Rev 6:1-20:15", "n": "", "vs": [[1, "ورأيت الحمل وهو يفك أول الختوم السبعة، وسمعت واحدا من الكائنات الحية الأربعة ينادي بصوت كالرعد: «تعال!»"], [2, "فنظرت وإذا أمامي حصان أبيض، يحمل راكبه قوسا، وعلى رأسه إكليل، وقد خرج منتصرا ولكي ينتصر."], [3, "ثم فك الحمل الختم الثاني، فسمعت الكائن الثاني ينادي: «تعال!»"], [4, "فخرج حصان أحمر، أعطي راكبه سيفا عظيما، ومنح سلطة نزع السلام من الأرض وجعل الناس يقتلون بعضهم بعضا."], [5, "وعندما فك الحمل الختم الثالث سمعت الكائن الثالث ينادي: «تعال!» فرأيت حصانا أسود، يحمل راكبه ميزانا بيده."], [6, "وسمعت صوتا من بين الكائنات الحية الأربعة يقول: «كيلة قمح بدينار، وثلاث كيلات شعير بدينار. أما الزيت والخمر فلا تمسهما»."], [7, "ثم فك الحمل الختم الرابع فسمعت الكائن الرابع ينادي: «تعال!»"], [8, "فرأيت حصانا لونه أخضر «باهت اللون»، اسم راكبه «الموت» يتبعه حصان آخر اسم راكبه «الهاوية»، وأعطيا سلطة إبادة ربع الأرض بالسيف والجوع والوباء ووحوش الأرض الضارية!"], [9, "ثم فك الحمل الختم الخامس، فرأيت مذبحا تحته أرواح الذين سفكت دماؤهم من أجل كلمة الله، ومن أجل الشهادة التي أدوها،"], [10, "وهم يصرخون للرب بأعلى صوتهم: «حتى متى، أيها السيد القدوس والحق، تؤخر معاقبة أهل الأرض على ما فعلوه بنا؟ متى تنتقم منهم لدمائنا؟»"], [11, "فأعطي كل منهم ثوبا أبيض، وقيل لهم أن يصبروا قليلا إلى أن يكمل عدد شركائهم العبيد وإخوتهم الذين سيقتلون مثلهم."], [12, "ثم نظرت، فرأيت الحمل يفك الختم السادس، وإذا الأرض قد زلزلت زلزالا عظيما، والشمس اسودت فصارت كخرقة من شعر، وصار القمر أحمر كالدم،"], [13, "وسقطت نجوم السماء على الأرض كما تطرح شجرة التين ثمارها الفجة، إذا هزتها ريح عاصفة."], [14, "وطويت السماء كما تطوى لفافة من ورق، فتزحزحت الجبال والجزر كلها من مواضعها."], [15, "وملوك الأرض والعظماء والقواد والأغنيا ء والأقوياء والعبيد والأحرار كلهم اختبأوا في المغاور وصخور الجبال،"], [16, "وهم يقولون للجبال والصخور: اسقطي علينا، وأخفينا من وجه الجالس على العرش ومن غضب الحمل!»"], [17, "فإن يوم الغضب العظيم قد جاءهم، ومن يقوى على الوقوف أمامه؟"], [1, "ورأيت بعد ذلك أربعة ملائكة واقفين على زوايا الأرض الأربع، يحبسون رياح الأرض الأربع، فلا تهب ريح على بر أو بحر أو شجر."], [2, "ثم رأيت ملاكا آخر قادما من الشرق يحمل ختم الله الحي، فنادى بصوت عال الملائكة الأربعة الذين عهد إليهم أن ينزلوا الضرر بالبر والبحر:"], [3, "«انتظروا! لا تضروا البر ولا البحر ولا الشجر، إلى أن نضع ختم إلهنا على جباه عبيده»."], [4, "وسمعت أن عدد المختومين، مئة وأربعة وأربعون ألفا، من جميع أسباط بني إسرائيل:"], [5, "من سبط يهوذا ختم اثنا عشر ألفا؛ ومن سبط رأوبين اثنا عشر ألفا؛ ومن سبط جاد اثنا عشر ألفا؛"], [6, "ومن سبط أشير اثنا عشر ألفا؛ ومن سبط نفتالي اثنا عشر ألفا؛ ومن سبط منسى اثنا عشر ألفا"], [7, "ومن سبط شمعون اثنا عشر ألفا؛ ومن سبط لاوي اثنا عشر ألفا؛ ومن سبط يساكر اثنا عشر ألفا؛"], [8, "ومن سبط زبولون اثنا عشر ألفا؛ ومن سبط يوسف اثنا عشر ألفا؛ ومن سبط بنيامين ختم اثنا عشر ألفا."], [9, "ثم نظرت، فرأيت جمعا كثيرا لا يحصى، من كل أمة وقبيلة وشعب ولغة، واقفين أمام العرش وأمام الحمل، وقد ارتدوا ثيا با بيضاء، وأمسكوا بأيديهم سعف النخل،"], [10, "وهم يهتفون بصوت عال: «الخلاص من عند إلهنا الجالس على العرش ومن عند الحمل!»"], [11, "واجتمع الملائكة جميعا حول العرش، ومعهم الشيوخ والكائنات الحية الأربعة، وخروا على وجوههم أمام العرش سجودا لله،"], [12, "قائلين: «آمين! لإلهنا البركة والمجد والحكمة والشكر والإجلال والقدرة والقوة إلى أبد الآبدين. آمين!»"], [13, "وسألني أحد الشيوخ: «أتعلم من هم هؤلاء الذين يرتدون الثياب البيضاء، وهل تعرف من أين أتوا؟»"], [14, "فأجبته: «أنت أعلم ياسيدي!» فقال: «هؤلاء هم الذين أتوا من الضيقة العظيمة، وقد غسلوا ثيابهم وبيضوها بدم الحمل."], [15, "لهذا هم أمام عرش الله يخدمونه في هيكله ليلا ونهارا والجالس على العرش يبسط خيمته عليهم،"], [16, "فلن يجوعوا ولن يعطشوا، ولن تضربهم الشمس ولا أي حر،"], [17, "لأن الحمل الذي في وسط العرش يرعاهم ويقودهم إلى ينابيع ماء الحياة، ويمسح الله كل دمعة من عيونهم»."], [1, "ولما فك الحمل الختم السابع ساد السماء سكوت نحو نصف ساعة،"], [2, "ورأيت الملائكة السبعة الواقفين أمام الله، وقد أعطوا سبعة أبواق."], [3, "ثم جاء ملاك آخر ومعه مبخرة من ذهب ووقف عند المذبح، وأعطي بخورا كثيرا ليقدمه مع صلوات القديسين على مذبح الذهب أمام العرش،"], [4, "فارتفع دخان البخور من يد الملاك مصحوبا بصلوات القديسين إلى حضرة الله."], [5, "ثم ملأ الملاك المبخرة من النار التي على المذبح وألقاها إلى الأرض، فحدثت رعود وأصوات وبروق وزلزلة."], [6, "واستعد الملائكة السبعة، أصحاب الأبواق السبعة، لينفخوا فيها."], [7, "ولما نفخ الملاك الأول في بوقه، إذا برد ونار يخالطهما الدم يسقطان إلى الأرض، فاحترق ثلث الأرض وثلث الأشجار مع كل عشب أخضر."], [8, "ولما نفخ الملاك الثاني في بوقه، ألقي في البحر ما يشبه جبلا عظيما مشتعلا، فصار ثلث البحر دما،"], [9, "فمات ثلث المخلوقات الحية التي فيه، وتحطم ثلث السفن."], [10, "ثم نفخ الملاك الثالث في بوقه، فهوى من السماء نجم عظيم كأنه شعلة من نار، وسقط على ثلث الأنهار وينابيع المياه."], [11, "واسم هذا النجم «العلقم». فصار ثلث المياه مرا كالعلقم، ومات كثيرون من الناس بسبب مرارة المياه."], [12, "ولما نفخ الملاك الرابع في بوقه، حدثت ضربة لثلث الشمس وثلث القمر وثلث النجوم، فأظلم ثلثها وفقد النهار ثلث ضيائه، وكذلك الليل."], [13, "ثم نظرت فرأيت نسرا يطير في وسط السماء وسمعته يصيح بصوت عال: «الويل الويل الويل لسكان الأرض مما سيحدث لهم عندما ينفخ الملائكة الثلاثة الباقون في أبواقهم!»"], [1, "ولما نفخ الملاك الخامس في بوقه، رأيت نجما قد هوى من السماء إلى الأرض، وأعطي مفتاح الهاوية السحيقة."], [2, "فلما فتحها اندفع الدخان كأنه من أتون عظيم، فأظلمت الشمس والجو من هذا الدخان."], [3, "وطلع من الدخان جراد على الأرض، وأعطي سلطة أن يلسع كالعقارب،"], [4, "وأمر ألا يضر عشب الأرض ولا مزروعاتها ولا أشجارها بل فقط جميع من ليس على جباههم ختم الله،"], [5, "فيعذبهم دون أن يقتلهم، مدة خمسة أشهر. والألم الذي يسببه يشبه ألم لدغة العقرب."], [6, "وفي أثناء تلك الشهور يحاول الناس أن يتخلصوا من حياتهم فلا يقدرون! ويتمنون أن يموتوا، لكن الموت يهرب منهم."], [7, "ويبدو هذا الجراد كأنه خيل مجهزة للقتال، على رؤوسه ما يشبه أكاليل الذهب، ووجوهه كوجوه البشر،"], [8, "وله شعر طويل كشعر النساء، وأسنانه كأسنان الأسود،"], [9, "وصدوره كدروع حديدية، وحفيف أجنحته كضجيج مركبات خيل تجري إلى القتال،"], [10, "وأذنابه ذات إبر كالعقارب. وله سلطة أن يؤذي البشر بأذنابه مدة خمسة أشهر."], [11, "أما ملكه فهو «ملاك الهاوية»، واسمه بالعبرية «أبدون»، وباليونانية «أبوليون»."], [12, "انقضى الويل الأول، وهناك ويلان آخران قادمان!"], [13, "وعندما نفخ الملاك السادس في بوقه، سمعت صوتا آتيا من القرون الأربعة لمذبح الذهب الموجود أمام الله،"], [14, "يقول للملاك السادس الذي يحمل البوق: «أطلق الملائكة الأربعة المقيدين عند نهر الفرات الكبير»."], [15, "وكان هؤلاء الملائكة الأربعة مجهزين استعدادا لهذه الساعة واليوم والشهر والسنة، فأطلقوا ليقتلوا ثلث البشر."], [16, "وسمعت أن جيشهم يبلغ مئتي مليون محارب!"], [17, "ور أيت في الرؤيا الخيول وعليها فرسان يلبسون دروعا بعضها أحمر ناري، وبعضها بنفسجي، وبعضها أصفر كبريتي. وكانت رؤوس الخيل مثل رؤوس الأسود، تلفظ من أفواهها نارا ودخانا وكبريتا."], [18, "فقتل ثلث الناس بهذه البلايا الثلاث، أي بالنار والدخان والكبريت الخارجة من أفواه الخيل."], [19, "وكانت قوة الخيل القاتلة تكمن في أفواهها وفي أذنابها أيضا، لأن أذنابها تشبه الحيات ذات الرؤوس المؤذية!"], [20, "ولكن الناس الذين نجوا من هذه البلايا، لم يتوبوا عن أعمالهم، وظلوا يسجدون للشياطين وللأصنام التي صنعوها من الذهب والفضة والنحاس والحجر والخشب، مع أنها لا ترى ولا تسمع ولا تتحرك!"], [21, "ولم يتوبوا عن القتل والسحر والزنى والسرقة!"], [1, "ثم رأيت ملاكا آخر قويا نازلا من السماء، لابسا سحابة، وعلى رأسه قوس قزح؛ وجهه كالشمس، ورجلاه كعمودين من نار،"], [2, "وبيده درج كتاب صغير مفتوح. فوضع رجله اليمنى على البحر واليسرى على الأرض،"], [3, "وصرخ صرخة عظيمة كزئير الأسد، دوت بعدها أصوات الرعود السبعة."], [4, "ولما تأهبت لكتابة ما تقوله الرعود، سمعت صوتا من السماء يقول لي: «لا تكتب، فما نطقت به الرعود يجب أن تبقيه مكتوما»."], [5, "ثم إن الملاك الذي رأيته واقفا على البحر والأرض رفع يده اليمنى نحو السماء،"], [6, "وأقسم بالحي إلى أبد الآبدين الذي خلق السماء وما فيها والأرض وما فيها والبحر وما فيه، إنه لن تكون مهلة بعد،"], [7, "فحالما ينفخ الملاك السابع في بوقه، تتم خطة الله الخفية، وفقا لما أعلنه لعبيده الأنبياء!"], [8, "ثم كلمني الصوت السماوي ثانية وقال لي: «اذهب، خذ الكتاب الصغير المفتوح في يد الملاك القوي الواقف على البحر والأرض»."], [9, "فذهبت إليه وطلبت الكتاب منه، فأجابني: «خذه والتهمه. ستجد طعمه في فمك حلوا كالعسل، ولكنه سيجعل بطنك مرا!»"], [10, "ولما أخذته من يده والتهمته، كان حلوا كالعسل في فمي، ولكن ما إن ابتلعته حتى ملأ بطني مرارة!"], [11, "وقيل لي: «عليك أن تتنبأ أيضا بشأن كثير من الشعوب والأمم واللغات والملوك»."], [1, "وأعطيت عصا قياس، وأمرت أن أقيس هيكل الله والمذبح، وأن أحصي عدد المتعبدين فيه."], [2, "وقيل لي: «لا تقس الساحة الخارجية لأنها خصصت للأمم، وسيدوسون المدينة المقدسة مدة اثنين وأربعين شهرا،"], [3, "ولكني سأمنح شاهدي أن يتنبآ مدة ألف ومئتين وستين يوما، وهما يلبسان ثوبين من الوبر»."], [4, "هذان الشاهدان هما شجرتا الزيتون والمنارتان القائمتان أمام رب الأرض."], [5, "فإذا حاول أحد أن يمسهما بسوء تخرج نار من فمهما وتلتهم أعداءهما. ذلك يجب أن يكون مصير من يحاول أن يؤذيهما."], [6, "وللشاهدين السلطة أن يغلقا السماء فلا تمطر طيلة مدة نبوءتهما، وأن يحولا مياه الأنهار والبحار دما، وأن ينزلا البلايا بالأرض، كلما أرادا."], [7, "وعندما يكملان شهادتهما يعلن الوحش الصاعد من الهاوية الحرب عليهما، ويهزمهما ويقتلهما"], [8, "وتبقى جثتاهما مطروحتين في ساحة المدينة العظمى التي ترمز إليها «سدوم» أو «مصر»، حيث صلب ربهما."], [9, "فيراهما أناس من مختلف الشعوب والقبائل واللغات والأمم، مدة ثلاثة أيام ونصف يوم، ولا يؤذن لأحد بدفنهما."], [10, "ويشمت بهما أهل الأرض، فيفرحون كأنهم في عيد، ويتبادلون الهدايا، لأن هذين النبيين كانا قد عذباهم كثيرا."], [11, "وبعد أن تمر الأيام الثلاثة ونصف اليوم يبعث الله في النبيين روح الحياة، فينهضان واقفين، ويستولي على الناظرين إليهما خوف شديد."], [12, "ويدعوهما صوت عال من السماء: «اصعدا إلى هنا»، فيصعدان إلى السماء في سحابة بمشهد من أعدائهما."], [13, "وفي الوقت ذاته يحدث زلزال عنيف يدمر عشر المدينة، ويهلك سبعة آلاف من ساكنيها. فيرتعب الناجون ويمجدون إله السماء."], [14, "انقضى الويل الثاني، وها هو الثالث يأتي سريعا!"], [15, "ونفخ الملاك السابع في بوقه فسمعت أصوات عالية في السماء تقول: «قد صار ملك العالم لربنا ومسيحه. إنه يملك إلى أبد الآبدين»."], [16, "فجثا الشيوخ الأربعة والعشرون الجالسون على عروشهم في حضر ة الله وخروا على وجوههم ساجدين لله."], [17, "وقالوا: «نحمدك أيها الإله القدير على كل شيء، الكائن والذي كان، لأنك الآن قد تقلدت قوتك العظمى وباشرت ملكك."], [18, "غضبت الشعوب عليك، فجاء دور غضبك عليهم. جاءت الساعة ليدان الأموات، وتكافيء عبيدك الأنبياء والقديسين والمتقين اسمك، صغارا وكبارا، وتهلك الذين كانوا يدمرون الأرض!»"], [19, "وانفتح هيكل الله في السماء، وظهر تابوت العهد في داخله. وحدثت بروق وأصوات ورعود وزلزلة، وسقط برد كبير."], [1, "وظهرت في السماء آية عظيمة: امرأة لابسة الشمس، والقمر تحت قدميها، وعلى رأسها تاج من اثني عشر نجما."], [2, "وكانت حبلى تصرخ من ألم الولادة وتتوجع وهي تلد."], [3, "وظهرت في السماء آية أخرى: تنين عظيم أحمر له سبعة رؤوس، على كل منها تاج، وله عشرة قرون،"], [4, "فسحب بذيله ثلث نجوم السماء وألقاها إلى الأرض. ثم وقف التنين أمام المرأة وهي تلد، ليبتلع طفلها بعد أن تلده!"], [5, "وولدت المرأة ابنا ذكرا، وهو الذي سيحكم الأمم كلها بعصا من حديد. ورفع الطفل إلى حضرة الله وإلى عرشه."], [6, "أما المرأة فهربت إلى البرية، حيث أعد الله لها مكانا تعال فيه مدة ألف ومئتين وستين يوما."], [7, "ونشبت حرب في السماء، إذ هاجم ميخائيل وملائكته التنين وملائكته،"], [8, "وحارب التنين وملائكته، لكنهم انهزموا ولم يبق لهم مكان في السماء،"], [9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."], [10, "ثم سمعت صوتا عاليا في السماء يقول: «الآن تم خلاص إلهنا، وآلت القدرة والملك إليه والسلطان إلى مسيحه! فإنه قد طرح من السماء إلى الأرض المشتكي الذي يتهم إخوتنا أمام إلهنا ليلا ونهارا."], [11, "وهم قد انتصروا عليه بدم الحمل وبالكلمة التي شهدوا لها، فلم تكن حياتهم عزيزة لديهم، حتى إنهم ماتوا."], [12, "افرحي أيتها السماوات، وافرحوا ياأهلها، الويل لكم ياأهل الأرض والبحر، لأن إبليس هبط عليكم وهو في شدة الغضب، عالما أن أيامه صارت معدودة»."], [13, "وعندما وجد التنين أنه طرح إلى الأرض، أخذ يطارد المرأة التي ولدت الطفل الذكر،"], [14, "فأعطيت المرأة جناحي النسر العظيم، لتطير بهما إلى البر ية، إلى المكان المجهز لها، حيث تعال بمأمن من الحية، مدة ثلاث سنوات ونصف سنة."], [15, "وأخرجت الحية من جوفها خلف المرأة ما يشبه النهر لتغرقها فيه،"], [16, "ولكن الأرض أعانت المرأة، ففتحت فمها وابتلعت النهر الذي أخرجه التنين من فمه!"], [17, "فاغتاظ التنين من المرأة وشن حربا على باقي أولادها الذين يعملون بوصايا الله وعندهم الشهادة ليسوع."], [1, "ثم رأيت نفسي واقفا على رمل البحر، وإذا وحش خارج من البحر، له سبعة رؤوس وعشرة قرون، على كل قرن منها تاج، وقد كتب على كل رأس اسم تجديف."], [2, "وبدا هذا الوحش مثل النمر وله قوائم كقوائم دب وفم كفم أسد! وأعطاه التنين قدرته وعرشه وسلطة عظيمة."], [3, "وبدا واحد من رؤوسه كأنه ذبح ذبحا مميتا، ولكن الجرح المميت شفي، فتعجب سكان الأرض لذلك، وتبعوا الوحش."], [4, "وسجد الناس للتنين لأنه وهب الوحش سلطته، وعبدوا الوحش وهم يقولون: «من مثل هذا الوحش؟ ومن يجرؤ على محاربته؟»"], [5, "وأعطى التنين الوحش فما ينطق بكلام الكبرياء والتجديف، وأعطاه سلطة العمل مدة اثنين وأربعين شهرا."], [6, "فأخذ الوحش يشتم اسم الله، ويشتم بيته وسكان السماء."], [7, "وأعطي الوحش قدرة على أن يحارب القديسين ويهزمهم وسلطة على كل قبيلة وشعب ولغة وأمة."], [8, "فيسجد للوحش جميع سكان الأرض الذين لم تكتب أسماؤهم منذ تأسيس العالم في سجل الحياة للحمل الذي ذبح."], [9, "من له أذن فليسمع:"], [10, "من ساق غيره إلى السبي، فإلى السبي سيساق؛ ومن قتل بالسيف، فبالسيف سيقتل! هنا يظهر صبر القديسين وإيمانهم."], [11, "ثم رأيت وحشا آخر خارجا من الأرض، له قرنان صغيران كقرني خروف، ولكن صوته كصوت تنين،"], [12, "وقد استمد سلطته من الوحش الأول الذي خرج من البحر ليعمل بها في حضوره، فجعل سكان الأرض يسجدون للوحش الأول الذي شفي من جرحه المميت."], [13, "وقام الوحش الثاني بآيات خارقة، حتى إنه أنزل من السماء نارا على الأرض بمشهد من الناس جميعا،"], [14, "فخدع سكان الأرض بالآيات التي كان يقوم بها في حضور الوحش الأول. وأمر سكان الأرض أن يقيموا تمثالا للوحش الأول الذي كان قد جرح جرحا مميتا ولكنه عاش!"], [15, "وأعطي سلطة على أن يبعث الروح في التمثال لينطق، وأن يمد يده فيقتل كل من يرفض السجود لتمثال الوحش،"], [16, "وأن يأمر الجميع، كبارا وصغارا، أغنياء وفقراء، أحرارا وعبيدا، أن يحملوا علامة على أيديهم اليمنى أو على جباههم،"], [17, "فلا يستطيع أحد أن يبيع أو يشتري إلا إذا كانت عليه علامة الوحش، أو الرقم الذي يرمز لاسمه!"], [18, "ولابد هنا من الفطنة: فعلى أهل المعرفة أن يحسبوا عدد اسم الوحش. إنه عدد لإنسان، وهو الرقم «ست مئة وستة وستون»."], [1, "ثم رأيت حملا واقفا على جبل صهيون ومعه مئة وأربعة وأربعون ألفا كتب على جباههم اسمه واسم أبيه."], [2, "وسمعت من السماء صوتا أشبه بصوت الشلال الغزير أو دوي الرعد الشديد. وكان الصوت الذي سمعته كأنه صوت منشدين على القيثارات يضربون بقيثاراتهم"], [3, "وكانوا ينشدون ترتيلة جديدة أمام عرش الله، وأمام الكائنات الحية الأربعة والشيوخ. ولم يستطع أحد أن يتعلم هذه الترتيلة إلا المئة والأربعة والأربعون ألفا المشترون من الأرض،"], [4, "فهؤلاء لم ينجسوا أنفسهم مع النساء لأنهم أطهار، وهم يتبعون الحمل حيثما ذهب، وقد تم شراؤهم من بين الناس باكورة لله، وللحمل،"], [5, "لم تنطق أفواههم بالكذب، ولا عيب فيهم."], [6, "ثم رأيت ملاكا آخر يطير في وسط السماء، معه بشارة أبدية يبشر بها أهل الأرض وكل أمة وقبيلة ولغة وشعب،"], [7, "وهو ينادي عاليا: «اتقوا الله ومجدوه، فقد حانت ساعة دينونته. اسجدوا لمن خلق السماء والأرض والبحر والينابيع»."], [8, "وتبعه ملاك ثان يقول: «سقطت، سقطت بابل العظمى التي سقت أمم العالم من خمر زناها الجالبة للغضب!»"], [9, "ثم تبعهما ملاك ثالث ينادي بصوت عال: «جميع الذين سجدوا للوحش ولتمثاله، وقبلوا علامته على أيديهم أو على جباههم،"], [10, "فلابد لهم، في حضرة الملائكة القديسين وفي حضرة الحمل، من أن يشربوا من خمر الغضب غير المخففة، المسكوبة في كأس غضب الله، فيكابدوا عذاب النار والكبريت المتقد،"], [11, "ويتصاعد دخان عذابهم إلى أبد الآبدين. لا راحة في النهار ولا في الليل للذين عبدوا الوحش وسجدوا لتمثاله وقبلوا علامة اسمه."], [12, "وهنا يظهر صبر القديسين الذين يحافظون على وصايا الله والإيمان بيسوع!»"], [13, "وسمعت صوتا من السماء يقول: «اكتب: طوبى للأموات الذين يموتون منذ الآن وهم في الرب! يقول الروح: نعم! فليستريحوا من متاعبهم، لأن أعمالهم ترافقهم»."], [14, "ثم نظرت، فرأيت سحابة بيضاء، يجلس عليها كائن يشبه ابن الإنسان، على رأسه إكليل من ذهب، وفي يده منجل حاد."], [15, "وخرج ملاك آخر من الهيكل يناديه بصوت عال: «أرسل منجلك ليحصد، فقد حلت ساعة الحصاد ونضج حصاد الأرض»."], [16, "فألقى الجالس على السحابة منجله على الأرض فحصدت الأرض."], [17, "ثم خرج ملاك آخر من الهيكل الذي في السماء، ومعه أيضا منجل حاد."], [18, "ومن المذبح خرج ملاك آخر له السلطة على النار، ونادى بصوت عظيم الملاك الذي يمسك المنجل الحاد: «أرسل منجلك الحاد واقطف عناقيد كرم الأرض لأن عنبها قد نضج»."], [19, "فألقى الملاك منجله إلى الأرض وقطف العناقيد وألقاها في معصرة غضب الله العظمى،"], [20, "فديست المعصرة بالأرجل خارج المدينة، فانبثق منها الدم وجرى أنهارا حتى إلى لجم الخيل، مسافة ثلثمائة وعشرين كيلومترا."], [1, "ثم رأيت في السماء آية أخرى عظيمة وعجيبة: سبعة ملائكة مكلفين أن ينزلوا بالأرض البلايا السبع الأخيرة التي بها يكتمل غضب الله."], [2, "ورأيت أيضا ما يشبه بحرا من زجاج تختلط به النار، وقد وقف عليه جميع الذين انتصروا على الوحش وتمثاله ورقم اسمه، وهم يحملون قيثارات الله،"], [3, "وينشدون ترتيلة موسى، عبد الله وترتيلة الحمل قائلين: «عظيمة وعجيبة أعمالك أيها الرب الإله القادر على كل شيء، عادلة ومستقيمة طرقك ياملك الدهور."], [4, "من لا يخافك يارب ولا يمجد اسمك؟ فأنت وحدك قدوس! والأمم جميعا سيأتون ويسجدون لك، لأن أحكامك قد ظهرت جلية»."], [5, "وبعد ذلك نظرت، فرأيت هيكل خيمة الشهادة في السماء وقد انفتح،"], [6, "وخرج منه الملائكة السبعة المكلفون بإنزال البلايا السبع الأخيرة بالأرض، وهم يرتدون ثيابا من كتان خالص براق، ويشدون صدورهم بأحزمة من ذهب."], [7, "وسلم واحد من الكائنات الحية الأربعة هؤلاء الملائكة السبعة سبع كؤوس من ذهب مملوءة بغضب الله الحي إلى أبد الآبدين."], [8, "وامتلأ الهيكل دخانا من مجد الله وقدرته، فلم يستطع أحد أن يدخل الهيكل، حتى ينتهي الملائكة السبعة من إنزال البلايا السبع بالأرض."], [1, "وسمعت صوتا عاليا صادرا من الهيكل يأمر الملائكة السبعة: «اذهبوا الآن واسكبوا على الأرض كؤوس غضب الله السبع»."], [2, "فذهب الملاك الأول وسكب كأسه على الأرض، فخرجت منها قروح خبيثة أصابت جميع الناس الذين عليهم علامة الوحش والذين يسجدون لتمثاله."], [3, "ثم سكب الملاك الثاني كأسه على البحر، فصار دما كدم الميت، وماتت جميع المخلوقات الحية التي فيه."], [4, "وسكب الملاك الثالث كأسه على الأنهار وينابيع المياه، فصار ت كلها دما."], [5, "وسمعت ملاك المياه يقول: «عادل أنت في أحكامك، أيها الإله القدوس، الكائن والذي كان،"], [6, "فقد سفك الناس دم قديسين وأنبياء، وها أنت تسقي قاتليهم دما! إنهم ينالون ما يستحقون!»"], [7, "وسمعت ملاك المذبح يقول: «إن أحكامك حق وعدل أيها الرب الإله القادر على كل شيء»."], [8, "وسكب الملاك الرابع كأسه على الشمس، فأعطيت الشمس أن تحرق الناس بنار،"], [9, "فاحترق الناس من الحر الشديد. ولكنهم لم يتوبوا ليمجدوا الله ، بل جدفوا على اسم الله صاحب السلطة على هذه البلايا."], [10, "ثم سكب الملاك الخامس كأسه على عرش الوحش، فحل بمملكته ظلام دامس، جعل أتباعه يعضون ألسنتهم من الألم."], [11, "غير أنهم لم يتوبوا عن أعمالهم الشريرة، بل جدفوا على إله السماء لما يعانون من آلام وقروح!"], [12, "وسكب الملاك السادس كأسه على نهر «الفرات» الكبير فجف ماؤه، ليصير ممرا للملوك القادمين من الشرق."], [13, "وعند هذا رأيت ثلاثة أرواح نجسة تشبه الضفادع تخرج من فم التنين، ومن فم الوحش، ومن فم النبي الدجال،"], [14, "وهي أرواح شيطانية قادرة على صنع المعجزات، تذهب إلى ملوك الأرض جميعا وتجمعهم للحرب في ذلك اليوم العظيم، يوم الله القادر على كل شيء."], [15, "»ها أنا آت كما يأتي اللص، طوبى لمن يكون بانتظاري، ساهرا وحارسا لثيابه، لئلا يمشي عريانا فيرى الناس عورته!«"], [16, "وجمعت الأرواح الشيطانية جيوش العالم كلها في مكان يسمى بالعبرية «هرمجدون»."], [17, "ثم سكب الملاك السابع كأسه على الهواء، فدوى صوت من العرش في الهيكل السماوي يقول: «قد تم!»"], [18, "فحدثت بروق وأصوات ورعود وزلزال عنيف لم تشهد الأرض له مثيلا منذ وجد الإنسان على الأرض، لأنه كان زلزالا عنيفا جدا!"], [19, "فانقسمت المدينة العظمى إلى ثلاثة أقسام، وحل الدمار بمدن الأمم. فقد ذكر الله بابل العظمى ليسقيها كأسا تفور بخمر غضبه."], [20, "وهربت الجزر كلها، واختفت الجبال."], [21, "وتساقط من السماء على الناس برد كبير، كل حبة منه بمقدار وزنة واحدة، فجدف الناس على الله بسبب هذه البلية الشديدة جدا."], [1, "وجاء واحد من الملائكة السبعة حاملي الكؤوس السبع وقال لي: «تعال فأريك عقاب الزانية الكبرى الجالسة على المياه الكثيرة،"], [2, "والتي زنى معها ملوك الأرض، وسكر أهل الأرض من خمر زناها»."], [3, "وحملني الملاك بالروح إلى البرية، فرأيت امرأة راكبة على وحش قرمزي له سبعة رؤوس وعشرة قرون، وقد كتبت على جسمه كله أسماء تجديف."], [4, "وكانت المرأة تلبس ملابس من أرجوان وقرمز، وتتحلى بالذهب والحجارة الكريمة واللؤلوء، وقد أمسكت كأس ذهب مملوءة بزناها المكروه النجس،"], [5, "وعلى جبينها اسم مكتوب: سر: «بابل العظمى، أم زانيات الأرض وأصنامها المكروهة»."], [6, "ورأيت المرأة سكرى لكثرة ما شربت من دم القديسين، ودم شهداء يسوع الذين قتلتهم. فتملكتني الدهشة لمنظرها،"], [7, "فسألني الملاك: «لماذا دهشت؟ سأطلعك على ما ترمز إليه المرأة والوحش الذي يحملها، صاحب الرؤوس السبعة والقرون العشرة:"], [8, "هذا الوحش كان موجودا، وهو غير موجود الآن، ولكنه على وشك أن يطلع من الهاوية ويمضي إلى الهلاك. وسيدهش سكان الأرض الذين لم تكتب أسماؤهم منذ تأسيس العالم في سجل الحياة، عندما يرون الوحش، لأنه كان موجودا، ثم أصبح غير موجود، وسيعود!"], [9, "«ولابد هنا من فطنة العقل: الرؤوس السبعة ترمز إلى التلال السبعة التي تجلس المرأة عليها وترمز أيضا إلى سبعة ملوك،"], [10, "خمسة منهم مضوا، والسادس يحكم الآن، والسابع سيأتي، ولكن مدة حكمه ستكون قصيرة."], [11, "أما الوحش الذي كان موجودا ثم أصبح غير موجود، فهو ملك ثامن سبق أن ملك كواحد من السبعة، سيمضي إلى الهلاك."], [12, "وأما القرون العشرة التي رأيت هي عشرة ملوك لم يتولوا الملك بعد، وسيتولون سلطة الملك مع الوحش لمدة ساعة واحدة،"], [13, "يتفقون فيها برأي واحد أن يعطوا الوحش قوتهم وسلطتهم."], [14, "ثم يحاربون الحمل، ولكن الحمل يهزمهم، لأنه رب الأرباب وملك الملوك، والذين معه هم المدعوون، المختارون، المؤمنون»."], [15, "ثم قال لي الملاك: «أما الميا ه التي رأيت حيث تجلس الزانية، فترمز إلى شعوب وجماهير وأمم ولغات."], [16, "وأما القرون العشرة التي رأيتها، والوحش، فسيبغضون الزانية ويجعلونها معزولة وعارية، ويأكلون لحمها ويحرقونها بالنار،"], [17, "لأن الله جعل في قلوبهم أن يعملوا وفق قصده، فيتفقوا على أن يعطوا الوحش ملكهم، حتى تتم كلمات الله."], [18, "أما هذه المرأة التي رأيتها، فإنها ترمز إلى المدينة العظمى التي تحكم ملوك الأرض»."], [1, "بعد هذا رأيت ملاكا آخر نازلا من السماء، له سلطان عظيم، أضاء بهاؤه الأرض."], [2, "وصاح بأعلى صوته: «سقطت، سقطت بابل العظمى، وصارت وكرا للشياطين ومأوى لكل روح نجس ولكل طائر نجس مكروه،"], [3, "لأن جميع الأمم شربت من خمر زناها، وملوك الأرض زنوا معها، وتجار الأرض اغتنوا من كثرة ترفها!»"], [4, "ثم سمعت صوتا آخر ينادي من السماء: «اخرجوا منها ياشعبي، لئلا تشتركوا في خطاياها، فتصابوا ببلاياها،"], [5, "فقد تراكمت خطاياها حتى بلغت السماء، وتذكر الله ما ارتكبته من آثام!"], [6, "افعلوا بها كما فعلت بكم، وضاعفوا لها جزاء ما اقترفت. في الكأس التي مزجت فيها للآخرين، امزجوا لها ضعفا."], [7, "أنزلوا بها من العذاب والشقاء على قدر ما عظمت نفسها وترفهت. فإنها تقول في نفسها: أنا ملكة على العرش، ولست أرملة، ولن أذوق طعم الحزن."], [8, "لذلك ستنقض عليها البلايا في يوم واحد، من موت وحزن وجوع، وستحترق بالنار، فإن الله الذي يدينها هو رب قدير."], [9, "وسيبكي عليها ملوك الأرض الذين زنوا وترفهوا معها، وسينوحون وهم ينظرون إلى دخان حريقها،"], [10, "فيقفون على بعد منها، خوفا من عذابها، وهم يصرخون: الويل، الويل، أيتها المدينة العظمى، بابل القوية! في ساعة واحدة حل بك العقاب!"], [11, "وسيبكي تجار الأرض ويحزنون عليها، لأنه لم يبق أحد ليشتري بضائعهم،"], [12, "فقد كانت هي تشتري منهم الذهب والفضة والحجارة الكريمة واللؤلؤ، والكتان والأرجوان والحرير والقرمز، وجميع الأخشاب العطرة وأدوات العاج والمصنوعات الخشبية الثمينة، والنحاس والحديد والرخام،"], [13, "والقرفة والبهار، والعطور والطيب والبخور، والخمر والزيت والدقيق والحبوب، والبهائم والغنم، والخيل والمركبات، والأجساد والنفوس البشرية"], [14, "وسيقولون: مضى عنك الثمر الذي كانت تشتهيه نفسك؛ وزالت عنك مظاهر الترف والعظمة كلها، ولن تعود!"], [15, "هؤلاء التجار الذين اغتنوا من التجارة معها، يقفون على بعد منها، خوفا من عذابها، يبكون وينتحبون"], [16, "قائلين: الويل، الويل على المدينة العظمى! كانت ترتدي أفضل الكتان والأرجوان والقرمز، وتتحلى بالذهب والأحجار الكريمة واللؤلوء،"], [17, "وقد زال هذا الغنى كله في ساعة واحدة!"], [18, "ينظرون إلى دخان حريقها، فيصرخون: أية مدينة مثل هذه المدينة العظمى؟"], [19, "ويذرون التراب على رؤوسهم وهم يصرخون باكين منتحبين: الويل، الويل على المدينة العظمى التي اغتنى أصحاب سفن البحر جميعا بفضل ثروتها! ها هي في ساعة واحدة قد زالت!"], [20, "اشمتي بها أيتها السماء! واشمتوا بها أيها القديسون والرسل والأنبياء، فقد أصدر الله حكمه عليها بعدما أصدرت أحكامها عليكم»."], [21, "وتناول ملاك قوي حجرا كأنه حجر طاحونة عظيم وألقاه في البحر قائلا: «هكذا تدفع وتطرح بابل المدينة العظمى، فتختفي إلى الأبد!"], [22, "لن يسمع فيك عزف موسيقى بعد، لا صوت قيثارة ولا مزمار ولا بوق، ولن تقوم فيك صناعة بعد الآن، ولن يسمع فيك صوت رحى"], [23, "ولن يضيء فيك نور مصباح. ولن يسمع فيك صوت عريس وعروس. فقد كان تجارك سادة الأرض، وبسحرك ضللت جميع الأمم."], [24, "وفيها وجدت دماء أنبياء وقديسين وجميع الذين قتلوا على الأرض»."], [1, "وبعد هذا سمعت صوتا عاليا كأنه صادر من جمع كبير في السماء يقول: «هللويا! الخلاص والمجد والكرامة والقدرة للرب إلهنا"], [2, "فإن أحكامه حق وعدل، لأنه عاقب الزانية الكبرى التي أفسدت الأرض، وانتقم لدم عبيده منها»."], [3, "وهتفوا ثانية: «هللويا! دخان حريقها يتصاعد إلى أبد الآبدين!»"], [4, "وجثا الشيوخ الأربعة والعشرون والكائنات الحية الأربعة سجودا لله الجالس على العرش، وهتفوا: «آمين! هللويا!»"], [5, "وخرج من العرش صوت يقول: «سبحوا إلهنا ياجميع عبيده الذين يتقونه صغارا وكبارا!»"], [6, "ثم سمعت صوتا كأنه صوت جمع كبير أو شلال غزير أو رعد شديد، يقول: «هللويا! فإن الرب الإله القادر على كل شيء قد ملك،"], [7, "لنفرح ونبتهج ونمجده، فإن عرس الحمل قد حان موعده، وعروسه قد هيأت نفسها،"], [8, "ووهب لها أن تلبس الكتان الأبيض الناصع!» والكتان يرمز إلى أعمال الصلاح التي قام بها القديسون."], [9, "وأملى علي الملاك أن أكتب: «طوبى للمدعوين إلى وليمة عرس الحمل». ثم قال: «الله نفسه يقول هذا القول الحق»."], [10, "فجثوت عند قدميه لأسجد له، فقال لي: «لا تفعل! إني عبد لله، مثلك ومثل إخوتك المؤمنين الذين لديهم الشهادة المختصة بيسوع: لله اسجد! فإن الشهادة المختصة بيسوع هي روح النبوءة»."], [11, "ثم رأيت السماء مفتوحة، وإذا حصان أبيض يسمى راكبه «الأمين الصادق» الذي يقضي ويحارب بالعدل."], [12, "عيناه كلهيب نار، وعلى رأسه أكاليل كثيرة، وقد كتب على جبهته اسم لا يعرفه أحد إلا هو."], [13, "وكان يرتدي ثوبا مغمسا بالدم؛ أما اسمه فهو «كلمة الله»"], [14, "وكان الأجناد الذين في السماء يتبعونه راكبين خيولا بيضاء، ولابسين كتانا نقيا ناصع البياض،"], [15, "وكان يخرج من فمه سيف حاد ليضرب به الأمم ويحكمهم بعصا من حديد، ويدوسهم في معصرة شدة غضب الله القادر على كل شيء."], [16, "وقد كتب على ثوبه وعلى فخذه «ملك الملوك ورب الأرباب»."], [17, "ثم رأيت ملاكا واقفا في الشمس، ينادي الطيور الطائرة في وسط السماء بصوت عال قائلا: «هلمي اجتمعي معا إلى وليمة الله الكبرى!"], [18, "تعالي والتهمي لحوم الملوك والقادة والأبطال، والخيول وفرسانها، ولحوم البشر جميعا من أحرار وعبيد، وصغار وكبار»."], [19, "ورأيت الوحش وملوك الأرض وجيوشهم وقد احتشدوا ليحاربوا هذا الفارس وجيشه."], [20, "فقبض على الوحش وعلى النبي الدجال الذي قام بالمعجزات في حضور الوحش وأضل بها الذين قبلوا علامة الوحش، وسجدوا لتمثاله. وطرح كلاهما حيا في بحيرة النار والكبريت المتقدة،"], [21, "وقتل السيف الخارج من فم الفارس جميع الباقين، وشبعت الطيور كلها من لحومهم."], [1, "ثم رأيت ملاكا نازلا من السماء، وبيده مفتاح الهاوية وسلسلة عظيمة"], [2, "قيد بها التنين، أي الحية القديمة، وهو إبليس أو الشيطان، وسجنه مدة ألف سنة،"], [3, "وطرحه في الهاوية وأغلقها عليه، وختمها، حتى يكف عن تضليل الأمم، إلى أن تنقضي الألف سنة. ولكن لابد من إطلاقه بعد ذلك لمدة قصيرة."], [4, "ثم رأيت عروشا منح الجالسون عليها حق القضاء. ورأيت نفوس الذين قتلوا في سبيل الشهادة ليسوع وفي سبيل كلمة الله، والذين رفضوا أن يسجدوا للوحش ولتمثاله، والذين رفضوا علامته على أيديهم وجباههم، وقد عادوا إلى الحياة، وملكوا مع المسيح ألف سنة."], [5, "هذه هي القيامة الأولى. أما بقية الأموات فلا يعودون إلى الحياة حتى تنقضي الألف سنة."], [6, "ما أسعد وأقدس من كان لهم نصيب في القيامة الأولى! لن يكون للموت الثاني سلطة عليهم، بل يكونون كهنة لله والمسيح، ويملكون معه ألف سنة."], [7, "فحين تنقضي الألف سنة، يطلق الشيطان من سجنه،"], [8, "فيخرج ليضلل الأمم في زوايا الأرض الأربع، جوج وماجوج، ويجمعهم للقتال، وعددهم كثير جدا كرمل البحر!"], [9, "فيصعدون على سهول الأرض العريضة، ويحاصرون من كل جانب معسكر القديسين والمدينة المحبوبة، ولكن نارا من السماء تنزل عليهم وتلتهمهم."], [10, "ثم يطرح إبليس الذي كان يضللهم، في بحيرة النار والكبريت، حيث الوحش والنبي الدجال. هناك سوف يعذبون نهارا وليلا، إلى أبد الآبدين."], [11, "ثم رأيت عرشا عظيما أبيض هربت السماء والأرض من أمام الجالس عليه، فلم يبق لهما مكان."], [12, "ورأيت الأموات، كبارا وصغارا، واقفين قدام العرش. وفتحت الكتب، ثم فتح كتاب آخر هو سجل الحياة، ودين الأموات بحسب ما هو مدون في تلك الكتب، كل واحد حسب أعماله."], [13, "وسلم البحر من فيه من الأموات، وسلم الموت وهاوية الموتى الأموات الذين فيهما، وحكم على كل واحد بحسب أعماله."], [14, "وطرح الموت وهاوية الموتى في بحيرة النار، الذي هو الموت الثاني."], [15, "وكل من لم يوجد اسمه مكتوبا في سجل الحياة طرح في بحيرة النار!"]]}], "kwAr": "من غير أن", "noteAr": ""}], "arS": [["إن ", []], ["السيد", ["H136"]], [" ", []], ["الرب", ["H3069"]], [" لا ", []], ["يجري", ["H6213"]], [" ", []], ["أمرا", ["H1697"]], [" من غير أن ", []], ["يعلن", ["H1540"]], [" ", []], ["سره", ["H5475"]], [" ", []], ["لعبيده", ["H5650"]], [" ", []], ["الأنبياء", ["H5030"]], [".", []]]}, {"c": 3, "v": 8, "text": "قد زأر الأسد فمن لا يخاف، وتكلم الرب فمن لا يتنبأ؟", "groups": [{"kw": "lion", "raw": "Amo_3:4, Amo_1:2; Rev_5:5", "note": "", "refs": [{"l": "Amo 3:4", "n": "", "vs": [[4, "أيزأر أسد في الغابة من غير أن يقع على فريسة؟ أيزمجر الشبل بصوته من عرينه ما لم يكن قد اقتنص شيئا؟"]]}, {"l": "Amo 1:2", "n": "", "vs": [[2, "قال: «يزأر الرب من صهيون ويدوي بصوته من أورشليم، فتنتحب مراعي الرعاة، وتذوي قمة الكرمل."]]}, {"l": "Rev 5:5", "n": "", "vs": [[5, "ولكن شيخا من الشيوخ قال لي: «لا تبك! قد انتصر الأسد الذي من سبط يهوذا، الذي هو أصل داود، وهو المستحق أن يفتح الكتاب ويفك ختومه السبعة»."]]}], "kwAr": "الأسد", "noteAr": ""}, {"kw": "who can", "raw": "Amo_2:12, Amo_7:12-17; Job_32:18, Job_32:19; Jer_20:9; Act_4:20, Act_5:20,Act_5:29; 1Co_9:16", "note": "", "refs": [{"l": "Amo 2:12", "n": "", "vs": [[12, "ولكنكم سقيتم النذيرين خمرا، وأمرتم الأنبياء قائلين: لا تتنبأوا."]]}, {"l": "Amo 7:12-17", "n": "", "vs": [[12, "ثم قال أمصيا لعاموس: «اهرب أيها الرائي إلى أرض يهوذا، وكل خبزا هناك وتنبأ فيها."], [13, "أما بيت إيل فلا تعد للتنبوء فيها، لأنها مقدس الملك ومقر المملكة»."], [14, "فأجاب عاموس: «أنا لم أكن نبيا ولا ابن نبي، إنما أنا راعي غنم وجاني جميز،"], [15, "فاصطفاني الرب من وراء الغنم وأمرني قائلا: اذهب تنبأ لشعبي إسرائيل."], [16, "لذلك اسمع الآن كلمة الرب: أنت تقول لا تتنبأ ضد إسرائيل ولا تهاجم بيت إسحاق."], [17, "لهذا يقول الرب: ستصبح امرأتك عاهرة في المدينة، ويقتل أبناؤك وبناتك بالسيف، وتقسم أرضك بالحبل. أما أنت فتموت في أرض الأمم الوثنية، ويسبى إسرائيل إلى أرض بعيدة عن دياره»."]]}, {"l": "Job 32:18", "n": "", "vs": [[18, "لأني أفيض كلاما، والروح في داخلي يحفزني."]]}, {"l": "Job 32:19", "n": "", "vs": [[19, "انظروا، إن قلبي في داخلي كخمر لم تفتح، وكزقاق جديدة تكاد تنشق!"]]}, {"l": "Jer 20:9", "n": "", "vs": [[9, "إن قلت: «سأكف عن ذكره ولا أتكلم باسمه بعد» صار كلامه في قلبي كنار محرقة محصورة في عظامي، فأعياني كتمانه وعجزت عن كبته."]]}, {"l": "Act 4:20", "n": "", "vs": [[20, "لا نستطيع أن نكف عن التحدث بما رأينا وسمعنا»."]]}, {"l": "Act 5:20", "n": "", "vs": [[20, "«اذهبوا إلى الهيكل، وقفوا معلنين للناس بشارة الحياة الجديدة كاملة!»"]]}, {"l": "Act 5:29", "n": "", "vs": [[29, "فأجاب بطرس والرسل: «ينبغي أن يطاع الله لا الناس!"]]}, {"l": "1Co 9:16", "n": "", "vs": [[16, "فمادمت أبشر بالإنجيل، فليس في ذلك فخر لي، لأنه واجب مفروض علي فالويل لي إن كنت لا أبشر!"]]}], "kwAr": "فمن لا يتنبأ", "noteAr": ""}], "arS": [["قد ", []], ["زأر", ["H7580"]], [" ", []], ["الأسد", ["H738"]], [" فمن لا ", []], ["يخاف", ["H3372"]], ["، ", []], ["وتكلم", ["H1696"]], [" ", []], ["الرب", ["H3069"]], [" فمن لا ", []], ["يتنبأ", ["H5012"]], ["؟", []]]}, {"c": 3, "v": 9, "text": "أذيعوا في حصون أشدود وفي حصون ديار مصر وقولوا: احتشدوا على جبال السامرة، واشهدوا ما في وسطها من جلبة، وانظروا إلى المظلومين في داخلها.", "groups": [{"kw": "Publish", "raw": "2Sa_1:20; Jer_2:10,Jer_2:11, Jer_31:7-9, Jer_46:14, Jer_50:2", "note": "", "refs": [{"l": "2Sa 1:20", "n": "", "vs": [[20, "لا تخبروا في جت، ولا تبشروا في شوارع أشقلون، لئلا تفرح بنات الفلسطينيين، لئلا تشمت بنات الغلف."]]}, {"l": "Jer 2:10", "n": "", "vs": [[10, "فاعبروا إلى جزيرة قبرص والسواحل الغربية، وأرسلوا إلى قيدار، وتفحصوا جيدا، وانظروا: هل جرى مثل هذا؟"]]}, {"l": "Jer 2:11", "n": "", "vs": [[11, "هل استبدلت أمة آلهتها مع أنها ليست حقا آل i 18:9-11", "n": "", "vs": [[9, "وفي السنة الرابعة لحكم الملك حزقيا، الموافقة للسنة السابعة لاعتلاء هوشع بن أيلة عرش إسرائيل، زحف شلمنأسر ملك أشور على السامرة وحاصرها،"], [10, "وتمكن من الاستيلاء عليها في نهاية ثلاث سنوات، أي في السنة السادسة لملك حزقيا، الموافقة للسنة التاسعة لحكم هوشع ملك إسرائيل."], [11, "وسبى ملك أشور سكان إسرائيل إلى أشور، وأسكنهم في مدينة حلح وعلى ضفاف نهر خابور في منطقة جوزان وفي مدن مادي،"]]}, {"l": "Isa 7:17-25", "n": "", "vs": [[17, "وسيجلب الرب عليك وعلى شعبك وعلى بيت أبيك أياما لم تمر بكم منذ انفصال أفرايم عن يهوذا، وذلك على يد ملك أشور."], [18, "في ذلك اليوم يصفر الرب للمصريين فيجيئون عليكم من كل أنهار مصر، وللأشوريين فيجيئون عليكم كأسراب النحل،"], [19, "فتقبل كلها وتنتشر في الأودية المقفرة، وفي شقوق الصخور وشجيرات الشوك المتكاثفة، وفي المراعي قاطبة."], [20, "في ذلك اليوم يستأجر الرب ملك أشور من عبر نهر الفرات، فيكون الموسى التي يحلق بها الرب شعر رؤوسكم وأرجلكم، وحتى لحاكم أيضا."], [21, "في ذلك اليوم يربي واحد عجلة بقر وشاتين."], [22, "ولوفرة ما تدر من حليب يأكل الزبد، لأن الزبد والعسل يأكلهما كل من يستبقى في الأرض."], [23, "في ذلك اليوم يصير كل موضع كان فيه ألف جفنة بألف شاقل (نحو اثني عشر كيلو جراما) من الفضة، منبتا للشوك والحسك."], [24, "ولا يقتحم الأرض إلا كل من يحمل سهاما وأقواسا، لأنها أرض مليئة بالشوك والحسك."], [25, "أما الجبال التي كانت تنقب بالمعول، فلا يصعد إليها أحد خوفا من الشوك والحسك، فتصبح مسرحا للثيران وموطئا للغنم»."]]}, {"l": "Isa 8:7", "n": "", "vs": [[7, "فإن الرب مزمع أن يغرقهم بمياه النهر الفياضة، أي ملك أشور بكل جبروته، فيكون (كنهر الفرات) يطغى جيشانه على أقنيته ويفيض على ضفافه"]]}, {"l": "Isa 8:8", "n": "", "vs": [[8, "فيكتسح أرض يهوذا، ويطفو مرتفعا إلى الأعناق، وتنتشر جيوشه في عرض أرضك ياعمانوئيل»."]]}, {"l": "Isa 10:5", "n": "", "vs": [[5, "ويل للأشوريين، قضيب غضبي، الحاملين في أيديهم عصا سخطي."]]}, {"l": "Isa 10:6", "n": "", "vs": [[6, "أرسلهم ضد أمة منافقة، وأوصيهم على شعبي الذي غضبت عليه، ليغنموا غنائمهم ويستولوا على أسلابهم، ويطأوهم كما يطأون الوحل."]]}, {"l": "Isa 10:9-11", "n": "", "vs": [[9, "أليس مصير كلنو كمصير كركميش؟ أو ليس مآل حماة كمآل أرفاد؟ أليست السامرة كدمشق؟"], [10, "لقد قضيت على ممالك وثنية أصنامها أعظم من أصنام أورشليم والسامرة!"], [11, "أفلا أقضي على أورشليم وأصنامها كما قضيت على السامرة وأصنامها؟"]]}, {"l": "Hos 11:5", "n": "", "vs": [[5, "ولكنهم رفضوا أن يتحولوا إلي تائبين، لذلك لن يرجعوا إلى مصر بل يصبح أشور ملكا عليهم."]]}, {"l": "Hos 11:6", "n": "", "vs": [[6, "يهجم السيف على مدنهم، ويلتهم أرتاج بواباتها، ويهلكهم لمشوراتهم الخاطئة."]]}], "kwAr": "", "noteAr": "عدو. انظر عا 6: 14؛ 2مل 15: 19، 29؛ 17: 3-6؛ 18: 9-11؛ إش 7: 17-25؛ 8: 7، 8؛ 10: 5، 6؛ 10: 9-11؛ هو 11: 5، 6"}, {"kw": "and thy", "raw": "Amo_3:10,Amo_3:15, Amo_2:5, Amo_6:8; 2Ch_36:19", "note": "", "refs": [{"l": "Amo 3:10", "n": "", "vs": [[10, "فهؤلاء الذين يكنزون الجور والنهب في قصورهم لا يعرفون التصرف باستقامة، يقول الرب."]]}, {"l": "Amo 3:15", "n": "", "vs": [[15, "وأدمر البيوت التي يأوون إليها في الشتاء، وبيوت المنتجعات الصيفية، وتندك بيوت العاج وتزول من الوجود قصور كثيرة، يقول الرب."]]}, {"l": "Amo 2:5", "n": "", "vs": [[5, "لهذا أرسل نارا على يهوذا فتلتهم حصون أورشليم."]]}, {"l": "Amo 6:8", "n": "", "vs": [[8, "ويقول الرب القدير: قد أقسمت بذاتي، أن أمقت زهو يعقوب، وأبغض قصوره، فأسلم المدينة بكل ما فيها."]]}, {"l": "2Ch 36:19", "n": "", "vs": [[19, "وأحرقوا الهيكل وهدموا سور أورشليم، وأشعلوا النار في جميع قصورها، ودمروا تحفها الثمينة."]]}], "kwAr": "وينهب", "noteAr": ""}], "arS": [["لذلك", ["H3651"]], [" ", []], ["يعلن", ["H559"]], [" ", []], ["الرب", ["H136"]], [" ", []], ["الإله", ["H3069"]], [": ", []], ["سيجتاح", ["H5439"]], [" ", []], ["العدو", ["H6862"]], [" ", []], ["البلاد", ["H776"]], ["، ", []], ["ويحيل", ["H3381"]], [" ", []], ["حصونكم", ["H5797"]], [" ", []], ["حطاما", ["H962"]], [" وينهب ", []], ["قصوركم", ["H759"]], [".", []]]}, {"c": 3, "v": 12, "text": "هذا ما يقوله الرب: كما يعجز الراعي أن ينتزع من فم الأسد سوى رجلي حمل، أو قطعة من أذن، هكذا لن ينجو سوى القليل من شعب إسرائيل المقيمين في السامرة، المتكئين على الأرائك الوثيرة والأسرة الناعمة.", "groups": [{"kw": "As the", "raw": "1Sa_17:34-37; Isa_31:4", "note": "", "refs": [{"l": "1Sa 17:34-37", "n": "", "vs": [[34, "فقال داود: «كان عبدك يرعى ذات يوم غنم أبيه، فجاء أسد ودب واختطف شاة من القطيع."], [35, "فسعيت وراءه وهاجمته وأنقذتها من أنيابه. وعندما انقض علي قبضت عليه من ذقنه وضربته فقتلته."], [36, "وهكذا قتل عبدك الأسد والدب كليهما، فليكن هذا الفلسطيني الأغلف كواحد منهما لأنه عير جيش الله الحي»."], [37, "واستطرد داود: «إن الرب الذي أنقذني من مخالب الأسد ومن مخالب الدب، ينقذني أيضا من قبضة هذا الفلسطيني». فقال شاول لداود: «امض وليكن الرب معك»."]]}, {"l": "Isa 31:4", "n": "", "vs": [[4, "لأنه هكذا قال الرب لي: «كما يزمجر الأسد أو الشبل على فريسته، من غير أن يخشى من صرخات جماعة الرعاة المتألبين عليه، أو يفزع من جلبتهم، هكذا يقبل الرب القدير ليحارب عن جبل صهيون."]]}], "kwAr": "كما يعجز الراعي", "noteAr": ""}, {"kw": "taketh", "raw": "Heb. delivereth", "note": "Heb. delivereth", "refs": [], "kwAr": "ينتزع", "noteAr": "بالعبرية: «ينقذ»."}, {"kw": "so shall", "raw": "Amo_9:2, Amo_9:3; 1Ki_20:30, 1Ki_22:25; Isa_8:4, Isa_17:1-4; Rom_11:4, Rom_11:5", "note": "", "refs": [{"l": "Amo 9:2", "n": "", "vs": [[2, "وإن نقبوا لأنفسهم ملجأ في أعماق الهاوية، فإن يدي تطولهم هناك، وإن ارتقوا إلى السماوات فمن هناك أنزلهم."]]}, {"l": "Amo 9:3", "n": "", "vs": [[3, "وإن اختبأوا في أعالي الكرمل فهناك أبحث عنهم وأعتقلهم. وإن تواروا عني في أعماق البحر فإني آمر هناك الحية فتلدغهم."]]}, {"l": "1Ki 20:30", "n": "", "vs": [[30, "وهرب الأحياء إلى داخل مدينة أفيق، فانهار السور على السبعة والعشرين ألف رجل الباقين. أما بنهدد فقد لجأ إلى المدينة واختبأ فيها في مخدع داخل مخدع."]]}, {"l": "1Ki 22:25", "n": "", "vs": [[25, "فأجابه ميخا: «ستعرف ذلك في اليوم الذي تلجأ فيه للاختباء من مخدع إلى مخدع»."]]}, {"l": "Isa 8:4", "n": "", "vs": [[4, "وقبل أن يعرف الصبي كيف ينادي: ياأبي أو ياأمي، تحمل ثروة دمشق وغنائم السامرة أمام ملك أشور»."]]}, {"l": "Isa 17:1-4", "n": "", "vs": [[1, "نبوءة بشأن دمشق: «انظروا ها دمشق تنقرض من بين المدن وتصبح كومة أنقاض."], [2, "تهجر مدن عروعير، وتصبح مراعي للقطعان تربض فيها ولا أحد يخيفها"], [3, "تزول المدينة المحصنة من أفرايم، والملك من دمشق، وتصبح بقية أرام مماثلة لمجد أبناء إسرائيل الزائل، هذا ما يقوله الرب القدير."], [4, "في ذلك اليوم يخبو مجد يعقوب وتذوب سمانة بدنه،"]]}, {"l": "Rom 11:4", "n": "", "vs": [[4, "ولكن، ماذا كان الجواب الإلهي له؟: «أبقيت لنفسي سبعة آلاف رجل لم يحنوا ركبة للبعل!»"]]}, {"l": "Rom 11:5", "n": "", "vs": [[5, "فكذلك، في الزمان الحاضر، ماتزال بقية اختارها الله بالنعمة."]]}], "kwAr": "هكذا لن ينجو", "noteAr": ""}, {"kw": "in Damascus in a couch", "raw": "or, on the beds feet, 1Ki_20:34; 2Ki_16:9", "note": "or, on the beds feet, 1Ki_20:34; 2Ki_16:9", "refs": [{"l": "1Ki 20:34", "n": "", "vs": [[34, "فقال بنهدد: «إني أرد المدن التي استولى عليها أبي من أبيك، وتقيم لنفسك أسواقا تجارية في دمشق مماثلة للأسواق التي أقامها أبي في السامرة». فأجابه الملك: «وبناء على هذا العهد فإنني أطلقك حرا». فقطع له بنهدد عهدا وأطلقه أخآب."]]}, {"l": "2Ki 16:9", "n": "", "vs": [[9, "فلبى ملك أشور طلبه، وزحف بجيشه إلى دمشق واستولى عليها، وسبى أهلها إلى قير، وقتل رصين."]]}], "kwAr": "الأرائك الوثيرة", "noteAr": "أو: «على قوائم الأسرّة». انظر 1مل 20: 34؛ 2مل 16: 9"}], "arS": [["هذا ما ", []], ["يقوله", ["H559"]], [" ", []], ["الرب", ["H3068"]], [": كما يعجز ", []], ["الراعي", ["H7462"]], [" أن ", []], ["ينتزع", ["H5337"]], [" من ", []], ["فم", ["H4480", "H6310"]], [" ", []], ["الأسد", ["H738"]], [" سوى ", []], ["رجلي", ["H3767"]], [" حمل، أو ", []], ["قطعة", ["H915"]], [" من ", []], ["أذن", ["H241"]], ["، ", []], ["هكذا", ["H3651"]], [" لن ", []], ["ينجو", ["H5337"]], [" سوى القليل من شعب ", []], ["إسرائيل", ["H3478"]], [" ", []], ["المقيمين", ["H3427"]], [" في ", []], ["السامرة", ["H8111"]], ["، المتكئين على ", []], ["الأرائك", ["H6285"]], [" ", []], ["الوثيرة", ["H6210"]], [" ", []], ["والأسرة", ["H4296"]], [" الناعمة.", []]]}, {"c": 3, "v": 13, "text": "اسمعوا واشهدوا على بيت يعقوب، يقول السيد الرب الإله القدير.", "groups": [{"kw": "and testify", "raw": "Deu_8:19, Deu_30:18, Deu_30:19; 2Ki_17:13, 2Ki_17:15; 2Ch_24:19; Act_2:40, Act_18:5, Act_18:6, Ac
