 ألم تبق في تيمان حكمة بعد؟ هل بادت المشورة من ذوي الفهم؟ هل تلاشت حكمتهم؟"]]}, {"l": "Jer 49:20", "n": "", "vs": [[20, "لذلك اسمعوا ما خططه الرب ضد أدوم، وما دبره ضد ساكني تيمان: ها صغار القوم يجرون، وتنهدم مساكنهم عليهم."]]}, {"l": "Oba 1:9", "n": "", "vs": [[9, "فيرتعب أبطالك ياتيمان حتى ينقرض قتلا كل رجل من جبل عيسو."]]}, {"l": "Oba 1:10", "n": "", "vs": [[10, "فمن أجل ما أنزلت بأخيك يعقوب من ظلم، يغشاك العار وتنقرض إلى الأبد."]]}], "kwAr": "تيمان", "noteAr": ""}, {"kw": "Bozrah", "raw": "Gen_36:33; Isa_34:6; Jer_49:13, Jer_49:22", "note": "", "refs": [{"l": "Gen 36:33", "n": "", "vs": [[33, "ومات بالع فخلفه يوباب بن زارح من بصرة."]]}, {"l": "Isa 34:6", "n": "", "vs": [[6, "للرب سيف مشبع بالدم، مطلي بالشحم، بدم حملان وتيوس، وبشحم كلى كباش، لأن للرب ذبيحة في بصرة، ومذبحة في أدوم."]]}, {"l": "Jer 49:13", "n": "", "vs": [[13, "ها أنا قد أقسمت بنفسي، يقول الرب، أن تصبح بصرة عرضة للرعب والعار والخراب واللعنة، وتغدو مدنها خرائب دائمة."]]}, {"l": "Jer 49:22", "n": "", "vs": [[22, "ها هو يحلق كالنسر، وينشر جناحيه على بصرة، فتصبح قلوب جبابرة أدوم كقلب امرأة ماخض»."]]}], "kwAr": "بصرة", "noteAr": ""}], "arS": [["فأرسل", ["H7971"]], [" ", []], ["نارا", ["H784"]], [" على ", []], ["تيمان", ["H8487"]], ["، ", []], ["فتلتهم", ["H398"]], [" ", []], ["حصون", ["H759"]], [" ", []], ["بصرة", ["H1224"]], [".", []]]}, {"c": 1, "v": 13, "text": "هذا ما يقوله الرب: من أجل معاصي العمونيين الثلاث والأربع لن أرد عنهم سخطي، لأنهم شقوا بطون الحوامل في جلعاد ليوسعوا تخمهم.", "groups": [{"kw": "the children", "raw": "Deu_2:19; Jer_49:1-6; Eze_25:2-7; Zep_2:8", "note": "", "refs": [{"l": "Deu 2:19", "n": "", "vs": [[19, "فمتى اقتربت من بني عمون، لا تعادهم ولا تهاجمهم، لأني لا أهبك من أرض بني عمون ميراثا، إذ وهبتها لبني لوط."]]}, {"l": "Jer 49:1-6", "n": "", "vs": [[1, "نبوءة عن بني عمون، هذا ما يعلنه الرب: «أليس لإسرائيل أبناء؟ أليس له وارث؟ فما بال ملك العمونيين قد استولى على ميراث سبط جاد وسكن شعبه في مدنه؟"], [2, "لذلك ها أيام مقبلة، يقول الرب، أجعل فيها هتاف القتال يتردد في ربة العمونيين، فتصير تلة أطلال، وتحرق قراها بالنار فيجلي الإسرائيليون الذين أجلوهم، يقول الرب."], [3, "أعولي ياحشبون لأن عاي قد خربت. ابكين يابنات ربة وتمنطقن بالمسوح. اندبن واذرعن الأرض بين السياجات فإن ملككن سيذهب إلى السبي مع كهنته ورؤسائه جميعا."], [4, "ما بالك تباهين بالأودية أيتها الابنة المخادعة التي اتكلت على نفائسها قائلة: من يهاجمني؟"], [5, "ها أنا أوقع بك الرعب من جميع المحيطين بك، فيتشرد كل واحد منكم مطرودا، وليس من يجمع شتات الهاربين."], [6, "ثم أعود فأرد سبي العمونيين، يقول الرب»."]]}, {"l": "Eze 25:2-7", "n": "", "vs": [[2, "«ياابن آدم، التفت بوجهك نحو بني عمون وتنبأ عليهم."], [3, "وقل لهم اسمعوا ما يعلنه السيد الرب من قضاء: لأنك شمت بمقدسي لأنه تدنس، وبأرض إسرائيل لأنها خربت وبشعب يهوذا لأنهم سيقوا إلى السبي،"], [4, "أسلمك للبدو وأبناء المشرق، فتصيرين ملكا لهم فينصبون مضاربهم فيك، ويقيمون مساكنهم فوق أرضك. هم يلتهمون غلتك، ويشربون لبنك."], [5, "وأجعل مدينة ربة مناخا للإبل، وسائر مدن بني عمون مرابض للغنم، فتدركون أني أنا الرب."], [6, "لأنك صفقت بكفيك طربا، وخبطت برجليك، وفرحت بكل ما فيك من لؤم لما حل بأرض إسرائيل."], [7, "لذلك ها أنا أثقل يدي عليك، وأسلمك غنيمة للأمم، وأستأصلك من بين الشعوب، وأفنيك من بين البلدان، وأدمرك، فتدرك أني أنا الرب."]]}, {"l": "Zep 2:8", "n": "", "vs": [[8, "قد سمعت تعيير موآب وتجاديف بني عمون، وكيف احتقروا شعبي وهددوا تخمهم."]]}], "kwAr": "العمونيين", "noteAr": ""}, {"kw": "and for", "raw": "Deu_23:3, Deu_23:4; Jdg_10:7-9, Jdg_11:15-28; 1Sa_11:1, 1Sa_11:2; 2Sa_10:1-8; 2Ki_24:2; 2Ch_20:1, 2Ch_20:10; Neh_2:19, 4:7-23; Psa_83:7", "note": "", "refs": [{"l": "Deu 23:3", "n": "", "vs": [[3, "لا يدخل عموني ولا موآبي في جماعة الرب، ولا أحد من ذريتهم حتى بعد الجيل العاشر في جماعة الرب وإلى الأبد،"]]}, {"l": "Deu 23:4", "n": "", "vs": [[4, "لأنهم لم يستقبلوكم بالخبز والماء في الطريق عند خروجكم من مصر، ولأنهم استأجروا بلعام بن بعور من فتور أرام النهرين ليلعنكم"]]}, {"l": "Jdg 10:7-9", "n": "", "vs": [[7, "واحتدم غضب الرب على إسرائيل وسلط عليهم الفلسطينيين وبني عمون،"], [8, "مدة ثماني عشرة سنة، فساموا الإسرائيليين المقيمين في أرض الأموريين في جلعاد. شرقي نهر الأردن، سوء العذاب"], [9, "وعبر العمونيون نهر الأردن لمحاربة أسباط يهوذا وبنيامين وأفرايم، فاعترى الإسرائيليين ضيق عظيم."]]}, {"l": "Jdg 11:15-28", "n": "", "vs": [[15, "قائلين له: «هذا ما يجيبك به يفتاح: إن بني إسرائيل لم يستولوا على أرض موآب ولا على أرض بني عمون،"], [16, "لأنه عند خروجهم من مصر ساروا في الصحراء حتى بلغوا البحر الأحمر وأتوا إلى قادش."], [17, "ثم بعث الإسرائيليون رسلا إلى ملك أدوم يقولون له: دعنا نجتاز في أرضك. فلم يأذن لهم ملك أدوم. ثم بعثوا رسلا أيضا إلى ملك موآب فرفض هو الآخر. فمكث الإسرائيليون في قادش."], [18, "ثم داروا في الصحراء ملتفين حول أرض أدوم وأرض موآب قادمين من الشرق إلى أرض موآب، وخيموا وراء حدود أرنون، ولم يعبروا إلى تخم موآب لأن أرنون هي حد موآب."], [19, "بعد ذلك بعث بنو إسرائيل رسلا إلى سيحون ملك الأموريين في عاصمته حشبون يقولون: دعنا نعبر في أرضك إلى حيث نحن متوجهون."], [20, "ولكن سيحون لم يأمن أن يعبر الإسرائيليون في أرضه، بل حشد كل جيشه وعسكر في ياهص وحارب بني إسرائيل."], [21, "فنصر الرب إله إسرائيل شعبه على سيحون وجيشه، فهزموهم واستولوا على كل أرض الأموريين سكان تلك البلاد."], [22, "فامتلكوا كل بلاد الأموريين من أرنون في الجنوب إلى اليبوق في الشمال، ومن الصحراء في الشرق إلى نهر الأردن في الغرب."], [23, "والآن وقد طرد الرب إله إسرائيل الأموريين من أمام شعبه إسرائيل،"], [24, "فبأي حق تريد أنت أن تستردها؟ ألست تحتفظ بما أعطاه لك كموش إلهك؟ ونحتفظ نحن أيضا بما أعطاه لنا الرب إلهنا؟"], [25, "ثم هل أنت أفضل من بالاق بن صفور ملك موآب؟ هل خاصم بني إسرائيل أو أثار عليهم حربا؟"], [26, "لقد أقام بنو إسرائيل في حشبون وقراها، وعروعير وقراها وكل المدن التي على محاذاة نهر أرنون ثلاث مئة سنة، فلماذا لم تستردها طوال تلك الحقبة؟"], [27, "إنني لم أسيء إليك، أما أنت فترتكب شرا في حقي بإثارتك الحرب علي. فليكن الرب اليوم قاضيا بين بني إسرائيل وبين بني عمون»."], [28, "فلم يأبه ملك بني عمون لرسالة يفتاح."]]}, {"l": "1Sa 11:1", "n": "", "vs": [[1, "وزحف ناحاش العموني على يابيش جلعاد وحاصرها، فقال أهل يابيش لناحاش: «وقع معنا معاهدة فنصبح عبيدا لك»"]]}, {"l": "1Sa 11:2", "n": "", "vs": [[2, "فأجابهم: «حسنا، ولكن بشرط أن أقلع العين اليمنى لكل واحد منكم، فيصبح ذلك عارا على كل إسرائيل»."]]}, {"l": "2Sa 10:1-8", "n": "", "vs": [[1, "ثم مات ملك بني عمون، واعتلى العرش ابنه حانون."], [2, "فقال داود في نفسه: «لأصنعن خيرا لحانون بن ناحاش كما صنع أبوه معي» فبعث داود وفدا ليعزيه في وفاة أبيه. وعندما بلغ وفد داود أرض بني عمون"], [3, "قال رؤساء بني عمون لسيدهم: «أتظن أن داود يستهدف إكرام أبيك في عينيك بإرساله هذا الوفد للتعزية؟ إنه لم يرسل هذا الوفد إلا لاستطلاع أحوال المدينة والتجسس عليها وقلبها»."], [4, "فقبض حانون على أعضاء وفد داود وحلق أنصاف لحاهم وقص ثيابهم إلى منتصف ظهورهم، ثم أطلقهم."], [5, "ولما علم داود بالأمر أرسل من استقبلهم، لأن أعضاء الوفد اعتراهم خجل شديد. وأمرهم الملك أن يمكثوا في أريحا ريثما تنبت لحاهم ثم يرجعون."], [6, "وعندما تبين العمونيون أن داود قد أضمر لهم البغضاء، استأجروا من أرام بيت رحوب وأرام صوبا عشرين ألف راجل، ومن ملك معكة ألف رجل، ومن رجال طوب اثني عشر ألف رجل."], [7, "فحين بلغ الخبر داود أرسل يوآب وسائر قواته الأبطال،"], [8, "فخرج بنو عمون واصطفوا للقتال عند مدخل باب المدينة، أما أراميو صوبا ورحوب ورجال طوب ومعكة فقد احتشدوا في الحقول."]]}, {"l": "2Ki 24:2", "n": "", "vs": [[2, "فأرسل الرب غزاة من كلدانيين وأراميين وموآبيين وعمونيين للإغارة على مملكة يهوذا وإبادتها، بموجب ما قضى به الرب على لسان عبيده الأنبياء."]]}, {"l": "2Ch 20:1", "n": "", "vs": [[1, "ثم اجتمع الموآبيون والمعونيون لمحاربة يهوشافاط،"]]}, {"l": "2Ch 20:10", "n": "", "vs": [[10, "والآن ها هي جيوش العمونيين والموآبيين وسكان جبل سعير الذين منعت إسرائيل من الدخول إلى أرضهم عند خروجهم من مصر فتحولوا عنهم ولم يهلكوهم."]]}, {"l": "Neh 2:19", "n": "", "vs": [[19, "وعندما عرف سنبلط الحوروني وطوبيا العبد العموني وجشم العربي بما ننوي عمله، سخروا بنا واحتقرونا قائلين: أي أمر أنتم عازمون عليه؟ أتتمردون على الملك؟"]]}, {"l": "Neh 4:7-23", "n": "", "vs": [[7, "ولما سمع سنبلط وطوبيا والعرب والعمونيون والأشدوديون أن أسوار أورشليم قد رممت، والثغرات قد سدت، احتدم غضبهم،"], [8, "وتآمروا جميعهم على مهاجمة أورشليم ومحاربتها لإيقاع الضرر بها."], [9, "فتضرعنا إلى إلهنا وأقمنا حراسا ضدهم نهارا وليلا حذرا منهم."], [10, "وقال أبناء يهوذا: «لقد وهنت قوى الحمالين، وأكوام الأنقاض كثيرة، ونحن لا يمكننا بناء السور."], [11, "وقد قال أعداؤنا: إننا سنفاجئهم فلا يدرون ولا يبصرون إلا ونحن قد أصبحنا في وسطهم، فنقتلهم ونعطل العمل!"], [12, "وعندما جاء اليهود الساكنون إلى جوارهم حذرونا عشر مرات قائلين: إنهم سيزحفون عليكم من جميع الأماكن التي يقيمون فيها»."], [13, "لذلك أقمت حراسا من الشعب حسب عشائرهم، متسلحين بالسيوف والرماح والقسي في المنخفضات وراء السور وعلى المرتفعات."], [14, "وتأملت حولي، ثم وقفت وقلت للعظماء والولاة وبقية الشعب: «لا تخافوهم، بل تذكروا السيد العظيم المرهوب، وحاربوا من أجل إخوتكم وأبنائكم وبناتكم ونسائكم وبيوتكم»."], [15, "وعندما أدرك أعداؤنا أننا كشفنا مؤامراتهم، وأحبط الله تدبيراتهم، رجع كل واحد منا إلى عمله في السور."], [16, "ومنذ ذلك الحين أخذ نصف رجالي يعملون، والنصف الآخر يمسكون بالرماح والأتراس والقسي والدروع. وآزر الرؤساء أبناء يهوذا"], [17, "الذين كانوا يبنون السور. أما حاملو الأحمال فكانوا يعملون باليد الواحدة ويمسكون السلاح باليد الأخرى."], [18, "وتقلد كل بان سيفا على جنبه، بينما وقف نافخ البوق إلى جواري."], [19, "فقلت للأشراف والولاة ولبقية الشعب: «العمل كثير ممتد في رقعة واسعة في الأرض، ونحن متفرقون على السور ومتباعدون عن بعضنا."], [20, "فعليكم أن تتجمعوا في المكان الذي يدوي منه نفير البوق، وليحارب إلهنا عنا»."], [21, "وهكذا كنا نحن نقوم بالعمل، بينما نصفنا الآخر يتقلد الرماح من طلوع الفجر حتى بزوغ النجوم."], [22, "وأمرت الشعب في ذلك الوقت: «ليبت كل واحد مع خادمه في أورشليم، فيكونوا لنا حراسا في الليل وعمالا في النهار»."], [23, "ولم أخلع ثيابي طوال تلك الفترة، لا أنا ولا إخوتي ولا خدامي ولا الحراس التابعون لي، بل ظل كل واحد منا متأهبا بسلاحه حتى عند ذهابه إلى الماء."]]}, {"l": "Psa 83:7", "n": "", "vs": [[7, "جبال وعمون وعماليق، الفلسطينيون وأهل صور،"]]}], "kwAr": "والأربع", "noteAr": ""}, {"kw": "because", "raw": "Hos_13:16", "note": "", "refs": [{"l": "Hos 13:16", "n": "", "vs": [[16, "لابد أن تتحمل السامرة وزر خطيئتها لأنها تمردت على إلهها، فيفنى أهلها بحد السيف، ويتمزق أطفالها أشلاء، وتشق بطون حواملها."]]}], "kwAr": "لأنهم", "noteAr": ""}, {"kw": "ripped up the women with child", "raw": "or, divided the mountains, enlarge. Isa_5:8; Jer_49:1; Eze_35:10; Hab_2:5, Hab_2:6", "note": "or, divided the mountains, enlarge. Isa_5:8; Jer_49:1; Eze_35:10; Hab_2:5, Hab_2:6", "refs": [{"l": "Isa 5:8", "n": "", "vs": [[8, "اشتريتم البيوت والحقول حتى لم يبق لأحد غيركم مكان يسكن فيه! صارت الأرض لكم وحدكم!"]]}, {"l": "Jer 49:1", "n": "", "vs": [[1, "نبوءة عن بني عمون، هذا ما يعلنه الرب: «أليس لإسرائيل أبناء؟ أليس له وارث؟ فما بال ملك العمونيين قد استولى على ميراث سبط جاد وسكن شعبه في مدنه؟"]]}, {"l": "Eze 35:10", "n": "", "vs": [[10, "لأنك قلت: إن هاتين الأمتين، وهاتين الأرضين تصبحان لي فأمتلكهما، ولو كان الرب هناك."]]}, {"l": "Hab 2:5", "n": "", "vs": [[5, "وكما أن الخمر غادرة، كذلك تأخذ المغتر نشوة الانتصار فلا يستكين، فإن جشعه في سعة الهاوية، وهو كالموت لا يشبع. لهذا يجمع لنفسه كل الأمم ويسبي جميع الشعوب."]]}, {"l": "Hab 2:6", "n": "", "vs": [[6, "ولكن لا يلبث أن يسخر منه سباياه قائلين: «ويل لمن يكوم لنفسه الأسلاب، ويثرى على حساب ما نهب. إنما إلى متى؟"]]}], "kwAr": "شقوا بطون الحوامل", "noteAr": "أو: «قسموا الجبال» ليوسعوا. انظر إش 5: 8؛ إر 49: 1؛ حز 35: 10؛ حب 2: 5، 6"}], "arS": [["هذا", ["H3541"]], [" ما ", []], ["يقوله", ["H559"]], [" ", []], ["الرب", ["H3068"]], [": ", []], ["من", ["H5921"]], [" أجل ", []], ["معاصي", ["H6588"]], [" ", []], ["العمونيين", ["H5983"]], [" ", []], ["الثلاث", ["H7969"]], [" ", []], ["والأربع", ["H702"]], [" لن ", []], ["أرد", ["H7725"]], [" عنهم سخطي، ", []], ["لأنهم", ["H5921"]], [" ", []], ["شقوا", ["H1234"]], [" بطون ", []], ["الحوامل", ["H2030"]], [" في ", []], ["جلعاد", ["H1568"]], [" ", []], ["ليوسعوا", ["H7337"]], [" ", []], ["تخمهم", ["H1366"]], [".", []]]}, {"c": 1, "v": 14, "text": "لهذا أضرم نارا في سور ربة فتلتهم حصونها في معترك جلبة يوم الحرب، وفي وسط عاصفة في يوم الزوبعة.", "groups": [{"kw": "Rabbah", "raw": "Deu_3:11; 2Sa_12:26; Jer_49:2; Eze_25:5", "note": "", "refs": [{"l": "Deu 3:11", "n": "", "vs": [[11, "وكان عوج آخر الجبابرة الرفائيين. وكان سريره مصنوعا من حديد، ولا يزال محفوظا في (متحف) ربة بني عمون. طوله تسع أذرع (نحو أربعة أمتار ونصف المتر) وعرضه أربع أذرع (نحو مترين)."]]}, {"l": "2Sa 12:26", "n": "", "vs": [[26, "وهاجم يوآب ربة عمون واستولى على عاصمة المملكة،"]]}, {"l": "Jer 49:2", "n": "", "vs": [[2, "لذلك ها أيام مقبلة، يقول الرب، أجعل فيها هتاف القتال يتردد في ربة العمونيين، فتصير تلة أطلال، وتحرق قراها بالنار فيجلي الإسرائيليون الذين أجلوهم، يقول الرب."]]}, {"l": "Eze 25:5", "n": "", "vs": [[5, "وأجعل مدينة ربة مناخا للإبل، وسائر مدن بني عمون مرابض للغنم، فتدركون أني أنا الرب."]]}], "kwAr": "ربة", "noteAr": ""}, {"kw": "with shouting", "raw": "Amo_2:2; Job_39:25; Isa_9:5", "note": "", "refs": [{"l": "Amo 2:2", "n": "", "vs": [[2, "لهذا أرسل نارا على موآب فتلتهم حصون قريوت، فيموت موآب في وسط الضجيج وصيحات المحاربين ودوي الأبواق."]]}, {"l": "Job 39:25", "n": "", "vs": [[25, "عندما يدوي صوت البوق يقول: هه هه! ويستروح المعركة عن بعد، ويسمع زئير القادة وهتافهم."]]}, {"l": "Isa 9:5", "n": "", "vs": [[5, "إذ كل سلاح المتسلح في الوغى، وكل رداء ملطخ بالدماء، يطرح وقودا للنار ويحرق."]]}], "kwAr": "جلبة", "noteAr": ""}, {"kw": "with a", "raw": "Psa_83:15; Isa_30:30; Dan_11:40; Zec_7:14", "note": "", "refs": [{"l": "Psa 83:15", "n": "", "vs": [[15, "هكذا طاردهم بعاصفتك، وأفزعهم بزوبعتك."]]}, {"l": "Isa 30:30", "n": "", "vs": [[30, "ويسمع الرب جلال صوته ويجعل الناس يعاينون امتداد ذراعه على الأرض بلهيب غضب ثائر ونار آكلة، وانفجار أمطار وعواصف وبرد."]]}, {"l": "Dan 11:40", "n": "", "vs": [[40, "وعندما تأزف النهاية يحاربه ملك الجنوب، فينقض عليه ملك الشمال كالزوبعة بمركبات وفرسان وسفن كثيرة، ويقتحم دياره كالطوفان الجارف."]]}, {"l": "Zec 7:14", "n": "", "vs": [[14, "فبددتهم بالزوبعة بين الأمم التي لم يعرفوها من قبل، فصارت الأرض التي نفوا منها خرابا لا يجتازها ذاهب أو راجع، وأضحت الأرض المبهجة قفرا»."]]}], "kwAr": "عاصفة", "noteAr": ""}], "arS": [["لهذا ", []], ["أضرم", ["H3341"]], [" ", []], ["نارا", ["H784"]], [" في ", []], ["سور", ["H2346"]], [" ", []], ["ربة", ["H7237"]], [" ", []], ["فتلتهم", ["H398"]], [" ", []], ["حصونها", ["H759"]], [" في معترك ", []], ["جلبة", ["H8643"]], [" ", []], ["يوم", ["H3117"]], [" ", []], ["الحرب", ["H4421"]], ["، وفي وسط ", []], ["عاصفة", ["H5591"]], [" في يوم ", []], ["الزوبعة", ["H5492"]], [".", []]]}, {"c": 1, "v": 15, "text": "ويساق ملكهم إلى السبي مع سائر رؤسائه يقول الرب.", "groups": [{"kw": "", "raw": "Jer_49:3", "note": "", "refs": [{"l": "Jer 49:3", "n": "", "vs": [[3, "أعولي ياحشبون لأن عاي قد خربت. ابكين يابنات ربة وتمنطقن بالمسوح. اندبن واذرعن الأرض بين السياجات فإن ملككن سيذهب إلى السبي مع كهنته ورؤسائه جميعا."]]}], "kwAr": "", "noteAr": ""}], "arS": [["ويساق", ["H1980"]], [" ", []], ["ملكهم", ["H4428"]], [" إلى ", []], ["السبي", ["H1473"]], [" ", []], ["مع", ["H3162"]], [" سائر ", []], ["رؤسائه", ["H8269"]], [" ", []], ["يقول", ["H559"]], [" ", []], ["الرب", ["H3068"]], [".", []]]}, {"c": 2, "v": 1, "text": "هذا ما يقوله الرب: من أجل معاصي موآب الثلاث والأربع لن أرد عنهم سخطي، لأن موآب أحرق عظام ملك أدوم حتى صارت كلسا.", "groups": [{"kw": "For three", "raw": "Amo_2:4, Amo_2:6, Amo_1:3, Amo_1:6, Amo_1:9, Amo_1:11, Amo_1:13; Num. 22:1-25:18; Deu_23:4, Deu_23:5; Psa_83:4-7; Mic_6:5", "note": "", "refs": [{"l": "Amo 2:4", "n": "", "vs": [[4, "هذا ما يقوله الرب: من أجل معاصي يهوذا الثلاث والأربع لن أرد عنهم سخطي، لأنهم رفضوا شريعة الرب ولم يطيعوا فرائضه، فأضلتهم أكاذيبهم التي غوى وراءها آباؤهم."]]}, {"l": "Amo 2:6", "n": "", "vs": [[6, "هذا ما يقوله الرب: من أجل معاصي إسرائيل الثلاث والأربع لن أرد عنهم سخطي، لأنهم باعوا الصديق لقاء الفضة، والبائس مقابل نعلين."]]}, {"l": "Amo 1:3", "n": "", "vs": [[3, "هذا ما يقوله الرب: من أجل معاصي دمشق الثلاث والأربع لن أرد عنها سخطي، لأن أهلها قد داسوا شعبي في جلعاد بنوارج من حديد."]]}, {"l": "Amo 1:6", "n": "", "vs": [[6, "هذا ما يقوله الرب: من أجل معاصي غزة الثلاث والأربع لن أرد عنها سخطي، لأن أهلها نفوا شعبا عن آخره ليسلموه إلى أدوم."]]}, {"l": "Amo 1:9", "n": "", "vs": [[9, "هذا ما يقوله الرب: من أجل معاصي صور الثلاث والأربع لن أرد عنها سخطي، لأن أهلها سلموا شعبا بكامله إلى أدوم، ونقضوا عهد الإخوة."]]}, {"l": "Amo 1:11", "n": "", "vs": [[11, "وهذا ما يقوله الرب: من أجل معاصي أدوم الثلاث والأربع لن أرد عنهم سخطي، لأنهم تعقبوا إخوتهم بالسيف، وتغاضوا عن كل رحمة، وجعلوا غضبهم يتأجج ملتهما باستمرار، وظلوا حاقدين على الدوام."]]}, {"l": "Amo 1:13", "n": "", "vs": [[13, "هذا ما يقوله الرب: من أجل معاصي العمونيين الثلاث والأربع لن أرد عنهم سخطي، لأنهم شقوا بطون الحوامل في جلعاد ليوسعوا تخمهم."]]}, {"l": "Num 22:1-25:18", "n": "", "vs": [[1, "وارتحل الإسرائيليون ونزلوا في سهول موآب، شرقي الأردن مقابل أريحا."], [2, "وإذ بلغ بالاق بن صفور ملك موآب جميع ما أنزله الإسرائيليون بالأموريين،"], [3, "اعتراه الفزع لكثرة عددهم، وملأ الخوف قلب شعبه من الإسرائيليين."], [4, "فقال بالاق لشيوخ مديان: «إن هذا الجمهور قادر على لحس كل ما حولنا كما يلحس الثور عشب الحقل»."], [5, "ثم بعث برسل يستدعي بلعام بن بعور، المقيم في موطنه في فتور، الواقعة على نهر الفرات قائلا: «ها قد خرج شعب من مصر يغشي وجه الأرض بكثرته، وهو منتشر أمامي."], [6, "فتعال الآن والعن لي هذا الشعب لأنه أعظم مني، لعلي أتمكن من دحره وطرده من الأرض، لأني عرفت أن من تباركه يكون مباركا ومن تلعنه يكون ملعونا»."], [7, "فمضى شيوخ موآب وشيوخ مديان حاملين معهم حلوان العرافة، وأقبلوا على بلعام وأبلغوه كلام بالاق."], [8, "فقال لهم: «بيتوا هنا الليلة، وغدا أرد عليكم جوابا كما يعلن لي الرب». فمكث رؤساء موآب عند بلعام."], [9, "فتجلى الله لبلعام وسأله: «من هم هؤلاء الرجال الذين عندك؟»"], [10, "فأجاب: «لقد أرسل بالاق بن صفور ملك موآب إلي قائلا:"], [11, "ها قد خرج شعب من مصر يغشي وجه الأرض. فتعال الآن والعنه لي، لعلي أقدر على محاربته وطرده»."], [12, "فقال الله لبلعام: «لا تمض معهم ولا تلعن الشعب لأنه مبارك»."], [13, "فنهض بلعام في الصباح وقال لرؤساء بالاق: «انطلقوا إلى دياركم، لأن الرب أبى أن يأذن لي بالذهاب معكم»."], [14, "فانطلق رؤساء موآب وأبلغوا بالاق أن بلعام رفض أن يحضر معهم."], [15, "فعاد بالاق وبعث أيضا عددا من الرؤساء أكبر، وعظماء أكثر من الرؤساء الأولين."], [16, "فقدموا على بلعام وقالوا: «هذا ما يقوله لك بالاق بن صفور:"], [17, "لا تتقاعس عن المجيء إلي، لأنني سأبالغ في إكرامك، وكل ما تطلبه أفعله، فتعال الآن والعن هذا الشعب»."], [18, "فأجاب بلعام رسل بالاق: «لا يمكنني أن أعصى أمر الرب إلهي في أي عمل صغير أو كبير، ولو أغدق علي بالاق ملء قصره فضة وذهبا."], [19, "فالآن، اقضوا هنا ليلتكم لأعلم بماذا يعود الرب فيوصيني به»."], [20, "فتراءى الله لبلعام ليلا وقال له: «إن جاء الرجال يستدعونك فقم وامض معهم، إنما لا تنطق إلا بما آمرك به فقط»."], [21, "فنهض بلعام صباحا وأسرج أتانه، وانطلق مع رؤساء موآب."], [22, "فاحتدم غضب الله لأنه مضى معهم، فاعترضه ملاك الرب في الطريق ليقاومه وهو راكب على أتانه وغلاماه معه."], [23, "فأبصرت الأتان ملاك الرب منتصبا في الطريق، وقد استل سيفه بيده، فحادت عن الطريق ومشت في الحقل. فضربها بلعام ليردها إلى الطريق."], [24, "ثم وقف ملاك الرب في ممر للكروم يقوم على جانبيه حائطان."], [25, "فلما شاهدت الأتان ملاك الرب زحمت جانب الحائط وضغطت رجل بلعام عليه، فضربها أيضا."], [26, "ثم اجتاز به ملاك الرب ووقف في موضع ضيق، لا سبيل فيه للتحول يمنة أو يسرة."], [27, "فلما رأت الأتان ملاك الرب ربضت تحت بلعام. فثار غضب بلعام وضرب الأتان بالقضيب."], [28, "عندئذ أنطق الرب الأتان، فقالت لبلعام: «ماذا جنيت حتى ضربتني الآن ثلاث دفعات؟»"], [29, "فقال بلعام: «لأنك سخرت مني. لو كان في يدي سيف لكنت قد قتلتك»."], [30, "فأجابته الأتان: «ألست أنا أتانك التي ركبت عليها دائما إلى هذا اليوم؟ وهل عودتك أن أصنع بك هكذا؟» فقال: «لا»."], [31, "عندئذ كشف الرب عن عيني بلعام، فشاهد ملاك الرب منتصبا في الطريق وسيفه مسلول في يده، فخر على وجهه ساجدا."], [32, "فقال له ملاك الرب: «لماذا ضربت الآن أتانك ثلاث مرات؟ فها أنا قد جئت لأعترضك، لأن طريقك ملتوية في نظري،"], [33, "فشاهدتني الأتان فحادت من أمامي ثلاث مرات. ولو لم تفعل لكنت قد قتلتك واستحييتها»."], [34, "فقال بلعام لملاك الرب: «لقد أخطأت، ولم أعلم أنك واقف لاعتراضي في الطريق. والآن إن ساء في عينيك فإني أرجع»."], [35, "فقال ملاك الرب لبلعام: «امض مع الرجال، ولكن عليك أن تنطق بما آمرك به فقط». فانطلق بلعام مع رؤساء بالاق."], [36, "فلما بلغ بالاق أن بلعام قد قدم أسرع لاستقباله إلى مدينة موآب الواقعة على حدود أرنون القصية."], [37, "فقال بالاق لبلعام: «ألم أبعث إليك أستدعيك؟ فلماذا لم تقدم علي؟ أحقا أعجز عن إكرامك؟»"], [38, "فأجاب بلعام: «ها أنا جئت إليك. أتظن أن في وسعي أن أتكلم الآن بما أريد؟ علي أن أنطق فقط بما يأمرني به الرب»."], [39, "فمضى بلعام مع بالاق حتى أقبلا إلى قرية حصوت."], [40, "فذبح بالاق بقرا وغنما وأرسلها إلى بلعام ومن معه من الرؤساء."], [41, "وفي الصباح التالي أخذ بالاق بلعام إلى مرتفعات بعل، فرأى من هناك بني إسرائيل كلهم."], [1, "فقال بلعام لبالاق: «ابن لي هنا سبعة مذابح، وأعد لي هنا سبعة ثيران وسبعة كباش»."], [2, "ففعل بالاق كما طلب بلعام. وقرب بالاق وبلعام ثورا وكبشا على كل مذبح."], [3, "ثم قال بلعام لبالاق: «قف هنا عند محرقاتك فأمضي أنا، لعل الرب يأتي للقائي، ومهما يعلن لي أبلغك به». ثم ارتقى بلعام رابية."], [4, "فوافى الله بلعام. فقال بلعام: «قد أعددت سبعة مذابح وقربت ثورا وكبشا على كل مذبح»."], [5, "فحمل الرب بلعام رسالة وقال: «ارجع إلى بالاق وبلغه إياها»."], [6, "فعاد إليه، وإذا به مازال واقفا عند محرقاته، ومعه جميع رؤساء موآب،"], [7, "فنطق بنبوءته قائلا: «أتى بي بالاق ملك موآب من بلاد أرام من الجبال الشرقية، وقال: تعال العن لي يعقوب، واشتم لي إسرائيل."], [8, "كيف ألعن من لم يلعنه الله؟ وكيف أشتم من لم يشتمه الرب؟"], [9, "ها أنا أراهم من قمم الصخور، ومن الآكام أبصرهم. هوذا شعب يسكن وحده. ولا يحسبون أنفسهم أمة من الأمم."], [10, "من يقدر أن يحصي تراب يعقوب أو يعد ربع إسرائيل؟ لتمت نفسي موت الأبرار، ولتكن آخرتي كآخرتهم»."], [11, "فقال بالاق لبلعام: «ماذا فعلت بي؟ لقد استدعيتك لتشتم أعدائي، وها أنت تباركهم»"], [12, "فأجابه: «إنني أحرص أن لا أتكلم إلا بما يضعه الرب على فمي»."], [13, "فقال له بالاق: «تعال معي إلى موضع آخر فلا ترى منه إلا طرف مخيم الشعب فقط، والعنه لي من هناك»."], [14, "فأخذه إلى حقل صوفيم المشرف على رأس الفسجة وهناك شيد سبعة مذابح، وقرب بلعام ثورا وكبشا على كل مذبح."], [15, "وقال لبالاق: «انتظرني هناك عند محرقاتك وأنا أمضي إلى هناك»."], [16, "فوافى الرب بلعام ولقنه رسالة وقال له: «ارجع إلى بالاق وبلغه إياها»."], [17, "فأقبل على بالاق، وإذا به منتظر عند محرقاته ومعه رؤساء موآب. فسأله بالاق: «ماذا تكلم به الرب؟»"], [18, "فضرب مثله قائلا: «انهض يابالاق واصغ، استمع إلي ياابن صفور"], [19, "ليس الله إنسانا فيكذب. ولا هو ابن آدم فيندم. هل يقول ولا يفعل أو يعد ولا يفي؟"], [20, "إني أمرت أن أبارك، وهو قد بارك ولا طاقة لي على رده."], [21, "لم يشهد إثما في يعقوب، ولم ير مشقة في إسرائيل. الرب إلههم معهم، وهتاف للملك فيهم."], [22, "الله أخرجهم من مصر، وقوتهم مثل قوة الثور الوحشي."], [23, "فلا عيافة تضر يعقوب، ولا عرافة تؤثر في إسرائيل. منذ الآن يقال عن يعقوب وعن إسرائيل: «انظر ماذا فعل الله!»"], [24, "هوذا شعب يتحفز كلبوة وينهض كأسد. لا ينام حتى يلتهم فريسة ويلغ في دم قتلى»."], [25, "فقال بالاق لبلعام: «إذن لا تلعنه ولا تباركه!»"], [26, "فأجاب بلعام: «ألم أخبرك أنني لن أنطق إلا بما يأمرني به الرب؟»"], [27, "فقال بالاق: «دعني آخذك إلى موضع آخر، فعسى أن يحسن في عيني الله أن تلعن لي الشعب من هناك»."], [28, "فأخذ بالاق بلعام إلى قمة جبل فغور المشرف على امتداد الصحراء،"], [29, "فقال بلعام لبالاق: «ابن لي هنا سبعة مذابح. وجهز لي هنا سبعة ثيران وسبعة كباش»."], [30, "فلبى بالاق طلب بلعام، وقرب ثورا وكبشا على كل مذبح."], [1, "ولما رأى بلعام أن الرب يسر بمباركة إسرائيل لم يمض كالمرتين السابقتين لملاقاة الرب، لكنه توجه بنظره نحو الصحراء،"], [2, "وهناك شاهد بني إسرائيل مخيمين حسب أسباطهم، فحل عليه روح الله،"], [3, "وتنبأ قائلا: «كلام بلعام بن بعور، كلام الرجل المفتوح العينين."], [4, "كلام من يسمع أقوال الله والذي يشاهد رؤيا القدير. الذي ينطرح فتنفتح عيناه."], [5, "ما أجمل خيامك يايعقوب، وما أبهى مساكنك ياإسرائيل!"], [6, "هي مثل أودية ممتدة، وكجنات على مجرى نهر، وكشجرات صبار غرسها الرب، ومثل أشجار الأرز النامية بجوار المياه."], [7, "تجري مياه من مساقيه، ولزرعه يتوافر ماء غزير. يكون ملكه أعظم شأنا من أجاج وتتسامى مملكته."], [8, "الله أخرجه من مصر، وقوته مثل الثور الوحشي. يفترس خصومه من الأمم، ويقضم عظامهم ويثخنهم بسهامه."], [9, "يجثم كأسد، ويربض كلبوة. فمن يجرؤ على إثارته؟ من يباركك يكون مباركا، ومن يلعنك يكون ملعونا»."], [10, "فاستشاط بالاق غضبا على بلعام، وضرب كفا على كف قائلا له: «دعوتك لتشتم أعدائي، وها أنت قد باركتهم ثلاث مرات!"], [11, "والآن اغرب عن وجهي وامض إلى بيتك، فقد كان في عزمي إكرامك ولكن الرب شاء أن لا تحظى به»."], [12, "فأجابه بلعام: «ألم أقل لرسلك الذين بعثتهم إلي"], [13, "إنه ولو أغدق علي بالاق ملء قصره ذهبا وفضة فلن أعصي أمر الرب، فأصنع خيرا أو شرا من نفسي؟ فإن ما يعلنه لي الرب فإياه أبلغ."], [14, "والآن أعود إلى شعبي، ولكن دعني أنبئك بما سينزله هذا الشعب بقومك في آخر الأيام»."], [15, "ثم تنبأ قائلا: «كلام بلعام بن بعور، كلام الرجل المفتوح العينين."], [16, "كلام من يسمع أقوال الله، ويتلقى المعرفة من العلي، الذي يشاهد رؤيا القدير، الذي ينطرح فتنفتح عيناه."], [17, "أراه ولكن ليس حاضرا، وأبصره ولكن ليس قريبا. يخرج نجم من يعقوب، ويظهر ملك من إسرائيل فيحطم طرفي موآب، ويهلك كل رجال الحرب."], [18, "ويرث أرض أدوم، ويتملك ديار سعير. أما إسرائيل فيزداد قوة."], [19, "ويبرز حاكم من يعقوب فيدمر ما تبقى من مدن (الأعداء)»."], [20, "ثم تطلع بلعام نحو مساكن أهل عماليق فتنبأ: «كان عماليق أول الشعوب، أما عاقبته فإلى الهلاك»."], [21, "ثم التفت نحو القينيين فأنبأ: «ليكن مسكنك منيعا، وعشك موضوعا في صخرة."], [22, "وإنما ستدمرون عندما يطردكم الأشوريون»."], [23, "ثم تنبأ قائلا: «من له طاقة على العيش حين يجري الرب ذلك؟"], [24, "تقبل سفن من كتيم، وتخضع أشور وتذل عابر، فهما أيضا يهلكان»."], [25, "ثم رجع بلعام إلى دياره، وأما بالاق فمضى في سبيله."], [1, "وأقام الإسرائيليون في شطيم، فشرع الرجال يرتكبون الزنى مع الموآبيات"], [2, "اللواتي أغوين الشعب لحضور ذبائح آلهتهن والأكل منها والسجود لها."], [3, "فاشترك الإسرائيليون في عبادة بعل فغور. فاحتدم غضب الرب عليهم."], [4, "فقال الرب لموسى: «خذ جميع قادة عبدة البعل واصلبهم، وعلقهم تحت وطأة حرارة الشمس أمام الرب، فترتد شدة غضبه عن بني إسرائيل»."], [5, "فقال موسى لقضاة إسرائيل: «اقتلوا كل واحد من قومكم من المتعلقين بعبادة بعل فغور»."], [6, "وإذ كان موسى وسائر جماعة إسرائيل يبكون عند مدخل خيمة الاجتماع، أقبل إسرائيلي وقدم إلى إخوته امرأة مديانية على مرأى منهم."], [7, "فلما رأى فينحاس بن ألعازار بن هرون ذلك، هب من بين الجماعة، وتناول رمحا بيده،"], [8, "وتبع الإسرائيلي إلى الخيمة حيث طعنهما. فاخترق الرمح الرجل الإسرائيلي وبطن المرأة، فكف الوبأ عن بني إسرائيل."], [9, "وكان عدد الذين ماتوا بالوبإ أربعة وعشرين ألفا."], [10, "فقال الرب لموسى:"], [11, "«إن فينحاس بن ألعازار بن هرون الكاهن قد رد غضبي عن بني إسرائيل، إذ غار غيرتي في وسطهم، فلم أفن بني إسرائيل بغيرتي."], [12, "لذلك قل له: هأنذا أقطع معه ميثاق سلام،"], [13, "فيكون له ولنسله من بعده ميثاق كهنوت أبدي، لأنه غار لله وكفر عن الإسرائيليين»."], [14, "وكان اسم الإسرائيلي الذي قتل مع المرأة المديانية زمري بن سالو، وهو أحد رؤساء عائلة من سبط شمعون."], [15, "أما المرأة المديانية المقتولة فكان اسمها كزبي بنت صور الذي كان رئيس قبيلة من قبائل مديان."], [16, "ثم قال الرب لموسى:"], [17, "«أسيئوا معاملة المديانيين وأهلكوهم،"], [18, "لأنهم ضايقوكم بمكايدهم التي احتالوا بها عليكم بشأن فغور، وأختهم كزبي ابنة رئيس لمديان، التي قتلت عندما تفشى الوبأ بسبب عبادة فغور»."]]}, {"l": "Deu 23:4", "n": "", "vs": [[4, "لأنهم لم يستقبلوكم بالخبز والماء في الطريق عند خروجكم من مصر، ولأنهم استأجروا بلعام بن بعور من فتور أرام النهرين ليلعنكم"]]}, {"l": "Deu 23:5", "n": "", "vs": [[5, "ولكن الرب إلهكم لم يشأ أن يستجيب لبلعام، بل حول لأجلكم اللعنة إلى بركة، لأن الرب إلهكم قد أحبكم."]]}, {"l": "Psa 83:4-7", "n": "", "vs": [[4, "يقولون: «هلم نستأصلهم من بين الأمم، فلا يذكر اسم إسرائيل فيما بعد»."], [5, "فإنهم قد تآمروا معا بقلب واحد، وعقدوا حلفا ضدك."], [6, "عشائر أدوم وبنو إسماعيل، نسل موآب وبنو هاجر."], [7, "جبال وعمون وعماليق، الفلسطينيون وأهل صور،"]]}, {"l": "Mic 6:5", "n": "", "vs": [[5, "اذكر ياشعبي ما تآمر به عليك بالاق ملك موآب، وما أجابه به بلعام بن بعور. واذكر ما أحسنت به إليك في رحلتك من شطيم إلى الجلجال لكي تدرك عدل الرب."]]}], "kwAr": "من أجل معاصي", "noteAr": ""}, {"kw": "of Moab", "raw": "Isa_11:14, 15:1-16:14, Isa_25:10; Jer. 48:1-47; Eze_25:8, Eze_25:9; Zep_2:8, Zep_2:9", "note": "", "refs": [{"l": "Isa 11:14", "n": "", "vs": [[14, "وينقضان على أكتاف الفلسطينيين غربا ويغزوان أبناء المشرق معا، ويستوليان على بلاد أدوم وموآب، ويخضع لهم بنو عمون."]]}, {"l": "Isa 15:1-16:14", "n": "", "vs": [[1, "رؤيا بشأن موآب: حقا في ليلة مباغتة تخرب عار موآب، حقا في ليلة مباغتة تدمر قير موآب."], [2, "ينطلق أهل ديبون إلى المعبد، وحتى إلى المرتفعات للبكاء؛ يولول شعب موآب على مصير نبو وميدبا برؤوس وذقون محلوقة."], [3, "يتلفعون بالمسوح في شوارعها، ويبكي كل واحد منهم على السطوح وفي الساحات."], [4, "تتعالى صرخات حشبون وألعالة حتى تتردد أصداؤها في ياهص، لذلك يندب جيش موآب بصوت مرتفع، وقلوبهم ترتعد في صدورهم."], [5, "قلبي يصرخ متوجعا على موآب وعلى عظمائها الهاربين إلى صوغر. كعجلة ثلاثية يصعدون إلى عقبة اللوحيث مولولين، ويجهرون بصراخ الهزيمة في طريق حورونايم."], [6, "غاضت مياه نهر نمريم، وجف العشب على ضفتيه، وذوى الكلأ وبادت الخضرة"], [7, "لذلك يحملون ما ادخروه من ثروة ونفائس، وينقلونها إلى عبر وادي الصفصاف،"], [8, "إذ يتجاوب صراخهم على طول تخوم موآب، وتبلغ ولولتهم إلى أجلايم وبئر إيليم."], [9, "تفيض مياه ديمون دما لأني أزيد من ويلاتها، فتهاجم الأسود الناجين من موآب، وتفترس الهاربين والماكثين فيها."], [1, "أيها الهاربون من موآب إلى سالع في الصحراء، أرسلوا حملانا إلى ملك يهوذا في أورشليم (طلبا للحماية قائلين):"], [2, "نساء موآب على ضفاف أرنون مثل الطيور التائهة أو الفراخ الشاردة."], [3, "فانصحنا، أنصفنا، ليكن ظلك علينا في الظهيرة كالليل فتستر منفيينا عن عيون أعدائنا ولا تشي باللاجئين منا."], [4, "لتمكث معكم فلول الهاربين منا واعصمهم من مدمرهم لأن الباغي يبيد والدمار يكف والظالم يفنى من الأرض."], [5, "ولا يلبث أن يثبت بالرحمة عرش في بيت داود يجلس عليه بأمانة ملك يقضي بالعدل والإنصاف."], [6, "قد سمعنا بكبرياء موآب، وبعجرفتها وغطرستها الطاغيتين، وبغرورها وصلفها، ولكن كل افتخارها باطل."], [7, "لذلك يولول الموآبيون على موآب، ويئنون على قير حارس المدمرة."], [8, "ذبلت حقول حشبون وكروم سبمة التي أتلف أمراء الأمم أفضلها، التي وصلت يوما إلى يعزير، وامتدت إلى القفر وبلغت فروعها إلى الصحراء."], [9, "لذلك أبكي كبكاء يعزير على جفنات سبمة وأرويكما بدموعي ياحشبون وياألعالة. لأن جلبة الدمار قد وقعت على حصادك وقطافك."], [10, "وانتزع الفرح والابتهاج من روضتك، فلم يبق أحد يرنم أو يهتف في كرومك، ولا يوجد من يدوس الخمر في معصرتك، لأني قد أخرست الهتاف."], [11, "لهذا تئن روحي على موآب كعود، وأحشائي تتلوى على قير حارس."], [12, "وعندما يحضر الموآبيون إلى المرتفعات المشرفة، يأخذهم الإعياء، وعندما يذهبون إلى مقادسهم ليصلوا، يجنون الباطل."], [13, "هذا ما تكلم الرب به على موآب منذ زمن."], [14, "وها هو يتكلم الآن قائلا: «في غضون ثلاث سنوات، كسنوات الأجير، يذل مجد موآب، ويحتقر جميع شعبها، والناجون منهم يكونون قلة ضعيفة»."]]}, {"l": "Isa 25:10", "n": "", "vs": [[10, "لأن يد الرب تستقر على هذا الجبل ويوطأ موآب في مكانه كما يوطأ التبن في الطين."]]}, {"l": "Jer 48:1-47", "n": "", "vs": [[1, "نبوءة عن الموآبيين: هذا ما يعلنه الرب القدير إله إسرائيل: «ويل لنبو لأنها أصبحت أطلالا. لحق العار بقريتايم وتم الاستيلاء عليها. خزي الحصن وارتعب."], [2, "زال فخر موآب وتآمروا في حشبون عليها شرا قائلين: هيا نهدمها فلا تكون أمة بعد. وأنت أيضا يامدمين، يهيمن عليك صمت الموت ويلاحقك السيف."], [3, "اسمعوا صوت صراخ من حورونايم: قد حل بنا هلاك ودمار عظيمان."], [4, "قد تحطمت موآب، وبلغ صراخها صوغر."], [5, "إذ على مرتفع لوحيت يصعدون باكين بمرارة، وعلى منحدر حورونايم يتردد صراخ الانكسار."], [6, "اهربوا وانجوا بأنفسكم. كونوا كعرعر في البرية."], [7, "لأنكم اتكلتم على أعمالكم وكنوزكم، ستسبون أيضا ويقع الصنم كموش أيضا أسيرا ويؤخذ إلى المنفى مع كهنته ورؤسائه."], [8, "ويزحف المدمر إلى كل مدينة، فلا تفلت منه إحداها، فيبيد الوادي، ويتلف السهل، لأن الرب قد قضى."], [9, "أعطوا موآب أجنحة، فيحلق طائرا. قد أصبحت مدنه أطلالا مهجورة من الناس."], [10, "ملعون من يقوم بعمل الرب متهاونا، وملعون من حظر على سيفه الدم."], [11, "قد قضى موآب حياة مترفة منذ حداثته، كالخمر المستقر على عكره. لم يفرغ من إناء إلى إناء، ولم يذهب إلى السبي قط لذلك ظل محتفظا بطعمه ولم تتغير رائحته."], [12, "ها هي أيام مقبلة، يقول الرب، أرسل فيها إليه عابري السبيل ساكبي الجرار، فيسكبونه ويفرغون جراره ويحطمون دنانه."], [13, "فيعتري الموآبيين الخجل من كموش، كما اعترى الخجل الإسرائيليين من بيت إيل، متكلهم."], [14, "كيف تقولون: إننا أبطال وجبابرة حرب؟"], [15, "إن موآب سيدمر، وتغزى مدنه، وتنزل نخبة شبانه للذبح، يقول الملك الذي اسمه الرب القدير."], [16, "قد أزفت بلية موآب ومحنته أقبلت مسرعة."], [17, "فارثوه ياجميع المحيطين به وسائر العارفين اسمه. قولوا انكسر صولجان العز وقضيب المجد."], [18, "اهبطي من المجد واجلسي على الأرض الظمأى أيتها الساكنة في ديبون، لأن مدمر موآب قد زحف عليك وهدم حصونك."], [19, "قفي على قارعة الطريق وراقبي ياساكنة عروعير. اسألي الهارب والناجية بنفسها: ماذا جرى؟"], [20, "فيأتي الجواب: قد لحق الخزي بموآب، لأنه صار أطلالا فولولوا وأعولوا. أذيعوا في أرنون أن موآب قد أصبح خرابا."], [21, "قد وقع القضاء على أرض السهل، وعلى حولون، وعلى يهصة، وعلى ميفعة،"], [22, "وعلى ديبون، وعلى نبو، وعلى بيت دبلتايم،"], [23, "وعلى قريتايم، وعلى بيت جامول، وعلى بيت معون،"], [24, "وعلى قريوت، وعلى بصرة، وعلى كافة مدن بلاد موآب البعيدة والقريبة."], [25, "قد كسر قرن موآب، وتحطمت ذراعه، يقول الرب."], [26, "أسكروه حتى يتمرغ في قيئه، ويصبح مهزأة، لأنه تغطرس على الرب."], [27, "ألم يصبح إسرائيل مهزأة لديك؟ أكان بين اللصوص حتى كنت تهز رأسك باحتقار كلما جاء ذكره على لسانك؟"], [28, "اهجروا المدن وأقيموا بين الصخور ياأهل موآب، وكونوا كالحمامة التي تعشش عند حافة فوهة الكهف."], [29, "قد سمعنا عن عجرفة موآب المفرطة. إنه شديد الكبرياء. سمعنا عن غطرسته وتشامخه وغروره، وعن ارتفاع قلبه."], [30, "قد عرفت كبرياءه يقول الرب، إنما زهوه باطل، وتفاخره عديم الجدوى."], [31, "لذلك أنوح على موآب وأعول على كل أهله، وأئن على رجال قير حارس."], [32, "أبكي عليك أكثر من البكاء على يعزير ياجفنة سبمة التي امتدت فروعها حتى البحر، بل بلغت بحر يعزير، فإن المدمر قد انقض على حصادك الناضج وقطافك."], [33, "قد تلاشى الفرح والغبطة من بساتين موآب ومن حقوله، وأوقف تدفق الخمر من المعاصر فلا يدوسها دائس بهتاف، بل تعلو صرخات لا هتاف فيها."], [34, "يرتفع الصراخ من حشبون إلى ألعالة فياهص. أطلقوا أصواتهم من صوغر إلى حورونايم حتى العجلة الثالثة، لأن مياه نمريم أيضا قد نضبت."], [35, "وأبيد من موآب، يقول الرب، من يقرب ذبيحة على مرتفعة، ومن يحرق بخورا لآلهة الوثن."], [36, "لذلك يئن قلبي على موآب كأنين مزمار، وينوح فؤادي على رجال قير حارس كنوح الناي، فإن ثروتهم التي اكتسبوها قد تبددت."], [37, "قد أصبح كل رأس أقرع، وكل لحية محلوقة، تجرحت الأيدي وتمنطقت الأحقاء بالمسوح."], [38, "شاع النوح على سطوح موآب وفي شوارعها كلها، لأني حطمت موآب كإناء ليس لأحد رغبة فيه، يقول الرب."], [39, "لشد ما تحطمت! لشد ما يولولون: كيف أدبر موآب مجللا بالخزي؟ قد صار مثار هزء ورعب لكل من حوله»."], [40, "لأن هذا ما يعلنه الرب: «انظروا، ها واحد يطير مسرعا كالنسر باسطا جناحيه ضد موآب."], [41, "فيستولي على المدن، وتسقط الحصون، وتصبح في ذلك اليوم قلوب محاربي موآب كقلب امرأة في مخاضها."], [42, "يهلك موآب ولا يبقى أمة، لأنه قد تغطرس على الرب."], [43, "يترصدكم الرعب والحفرة والفخ ياأهل موآب، يقول الرب."], [44, "من يهرب من الخوف يقع في الحفرة، ومن يصعد من الحفرة يعلق بالفخ، لأني أجلب على موآب هذه المحن في سنة عقابهم، يقول الرب."], [45, "في ظل حشبون وقف الهاربون خائري القوى، لأن نارا اندلعت من حشبون، وشعلة من سيحون، فالتهمت ركن موآب وهامة المتبجحين الغوغائيين."], [46, "ويل لك ياموآب! قد باد شعب كموش، لأن بنيك وبناتك أخذوا إلى السبي."], [47, "ولكني أرد سبي موآب في الأيام الآتية»، يقول الرب. إلى هنا ختام القضاء على موآب."]]}, {"l": "Eze 25:8", "n": "", "vs": [[8, "وهذا ما يعلنه السيد الرب: لأن الموآبيين وأهل سعير يقولون: هل شعب يهوذا كبقية الأمم."]]}, {"l": "Eze 25:9", "n": "", "vs": [[9, "لذلك ها أنا أقوض جبهتهم الشرقية، وأدمر مدن حدودهم، بيت بشيموت وبعل معون وقريتايم وهي مدن مفخرة موآب."]]}, {"l": "Zep 2:8", "n": "", "vs": [[8, "قد سمعت تعيير موآب وتجاديف بني عمون، وكيف احتقروا شعبي وهددوا تخمهم."]]}, {"l": "Zep 2:9", "n": "", "vs": [[9, "لذلك، كما أنا حي، يقول الرب القدير إله إسرائيل، ليصبحن أهل موآب كسدوم، والعمونيون كعمورة، منبتا للقريص وحفرة للملح وخرابا إلى الأبد، وتنهبهم بقية شعبي ويمتلكهم الناجون من أمتي."]]}], "kwAr": "موآب", "noteAr": ""}, {"kw": "because", "raw": "2Ki_3:9, 2Ki_3:26; Pro_15:3", "note": "", "refs": [{"l": "2Ki 3:9", "n": "", "vs": [[9, "فتوجه ملك إسرائيل برفقة حليفيه: ملك يهوذا وملك أدوم، وداروا في الصحراء مسيرة سبعة أيام. ولم يكن هناك ماء ليشرب الجيش والدواب التابعة لهم."]]}, {"l": "2Ki 3:26", "n": "", "vs": [[26, "فلما رأى ملك موآب أن المعركة اشتدت عليه اختار سبع مئة رجل من المحاربين بالسيوف ليقوم بمحاولة شق طريقه ليهاجم ملك أدوم، فلم يفلح."]]}, {"l": "Pro 15:3", "n": "", "vs": [[3, "عينا الرب في كل مكان تراقبان الأشرار والأخيار."]]}], "kwAr": "لأن موآب", "noteAr": ""}], "arS": [["هذا", ["H3541"]], [" ما ", []], ["يقوله", ["H559"]], [" ", []], ["الرب", ["H3068"]], [": ", []], ["من", ["H5921"]], [" أجل ", []], ["معاصي", ["H6588"]], [" ", []], ["موآب", ["H4124"]], [" ", []], ["الثلاث", ["H7969"]], [" ", []], ["والأربع", ["H702"]], [" لن ", []], ["أرد", ["H7725"]], [" عنهم سخطي، ", []], ["لأن", ["H5921"]], [" موآب ", []], ["أحرق", ["H8313"]], [" ", []], ["عظام", ["H6106"]], [" ", []], ["ملك", ["H4428"]], [" ", []], ["أدوم", ["H123"]], [" حتى صارت ", []], ["كلسا", ["H7875"]], [".", []]]}, {"c": 2, "v": 2, "text": "لهذا أرسل نارا على موآب فتلتهم حصون قريوت، فيموت موآب في وسط الضجيج وصيحات المحاربين ودوي الأبواق.", "groups": [{"kw": "Kirioth", "raw": "Jer_48:24, Jer_48:41", "note": "", "refs": [{"l": "Jer 48:24", "n": "", "vs": [[24, "وعلى قريوت، وعلى بصرة، وعلى كافة مدن بلاد موآب البعيدة والقريبة."]]}, {"l": "Jer 48:41", "n": "", "vs": [[41, "فيستولي على المدن، وتسقط الحصون، وتصبح في ذلك اليوم قلوب محاربي موآب كقلب امرأة في مخاضها."]]}], "kwAr": "قريوت", "noteAr": ""}, {"kw": "with tumult", "raw": "Amo_1:14; Isa_9:5; Jer_48:34", "note": "", "refs": [{"l": "Amo 1:14", "n": "", "vs": [[14, "لهذا أضرم نارا في سور ربة فتلتهم حصونها في معترك جلبة يوم الحرب، وفي وسط عاصفة في يوم الزوبعة."]]}, {"l": "Isa 9:5", "n": "", "vs": [[5, "إذ كل سلاح المتسلح في الوغى، وكل رداء ملطخ بالدماء، يطرح وقودا للنار ويحرق."]]}, {"l": "Jer 48:34", "n": "", "vs": [[34, "يرتفع الصراخ من حشبون إلى ألعالة فياهص. أطلقوا أصواتهم من صوغر إلى حورونايم حتى العجلة الثالثة، لأن مياه نمريم أيضا قد نضبت."]]}], "kwAr": "الضجيج", "noteAr": ""}], "arS": [["لهذا ", []], ["أرسل", ["H7971"]], [" ", []], ["نارا", ["H784"]], [" على ", []], ["موآب", ["H4124"]], [" ", []], ["فتلتهم", ["H398"]], [" ", []], ["حصون", ["H759"]], [" ", []], ["قريوت", ["H7152"]], ["، ", []], ["فيموت", ["H4191"]], [" موآب في وسط ", []], ["الضجيج", ["H7588"]], [" ", []], ["وصيحات", ["H8643"]], [" المحاربين ", []], ["ودوي", ["H6963"]], [" ", []], ["الأبواق", ["H7782"]], [".", []]]}, {"c": 2, "v": 3, "text": "وأستأصل الحاكم من بين الموآبيين، وأقضي على كل رؤسائهم، يقول الرب.", "groups": [{"kw": "", "raw": "Num_24:17; Jer_48:7, Jer_48:25", "note": "", "refs": [{"l": "Num 24:17", "n": "", "vs": [[17, "أراه ولكن ليس حاضرا، وأبصره ولكن ليس قريبا. يخرج نجم من يعقوب، ويظهر ملك من إسرائيل فيحطم طرفي موآب، ويهلك كل رجال الحرب."]]}, {"l": "Jer 48:7", "n": "", "vs": [[7, "لأنكم اتكلتم على أعمالكم وكنوزكم، ستسبون أيضا ويقع الصنم كموش أيضا أسيرا ويؤخذ إلى المنفى مع كهنته ورؤسائه."]]}, {"l": "Jer 48:25", "n": "", "vs": [[25, "قد كسر قرن موآب، وتحطمت ذراعه، يقول الرب."]]}], "kwAr": "", "noteAr": ""}], "arS": [["وأستأصل", ["H3772"]], [" ", []], ["الحاكم", ["H8199"]], [" من ", []], ["بين", ["H4480", "H7130"]], [" الموآبيين، ", []], ["وأقضي", ["H2026"]], [" على ", []], ["كل", ["H3605"]], [" ", []], ["رؤسائهم", ["H8269"]], ["، ", []], ["يقول", ["H559"]], [" ", []], ["الرب", ["H3068"]], [".", []]]}, {"c": 2, "v": 4, "text": "هذا ما يقوله الرب: من أجل معاصي يهوذا الثلاث والأربع لن أرد عنهم سخطي، لأنهم رفضوا شريعة الرب ولم يطيعوا فرائضه، فأضلتهم أكاذيبهم التي غوى وراءها آباؤهم.", "groups": [{"kw": "For", "raw": "Deu_31:16-18, Deu_32:15-27", "note": "", "refs": [{"l": "Deu 31:16-18", "n": "", "vs": [[16, "وقال الرب لموسى: «ما إن تموت وتلحق بآبائك حتى يسرع هذا الشعب ويفجر وراء آلهة الغرباء المقيمين في الأرض التي هو داخل إليها في وسطهم، ويتخلى عني وينكث عهدي الذي أبرمته معه،"], [17, "فيحتدم غضبي عليه في ذلك اليوم، وأنبذه وأحجب وجهي عنه، فيكون فريسة. وتلحق به شرور كثيرة ومصائب، حتى يقول: أليس لأن إلهي قد هجرني، قد أصابتني هذه الشرور؟"], [18, "وأحجب وجهي عنهم من أجل جميع ما ارتكبوه من شرور، إذ سعوا وراء آلهة أخرى."]]}, {"l": "Deu 32:15-27", "n": "", "vs": [[15, "فسمن بنو إسرائيل ورفسوا، سمنوا وغلظوا واكتسوا شحما، فرفضوا الإله صانعهم وتنكروا لصخرة خلاصهم."], [16, "أثاروا غيرته بآلهتهم الغريبة، وأغاظوه بأصنامهم الرجسة."], [17, "قدموا محرقات لأوثان ليست هي الله، لآلهة غريبة لم يعرفوها بل ظهرت حديثا، آلهة لم يرهبها آباؤهم من قبل."], [18, "لقد نبذتم الصخر الذي أنجبكم، ونسيتم الله الذي أنشأكم."], [19, "فرأى الرب ذلك ورذلهم، إذ أثار أبناؤه وبناته غيظه."], [20, "وقال: سأحجب وجهي عنهم، فأرى ماذا يكون مصيرهم؟ إنهم جيل متقلب وأولاد خونة،"], [21, "هيجوا غيرتي بعبادة أوثانهم، وأسخطوني بأصنامهم الباطلة. لذلك سأثير غيرتهم بشعب متوحش، وأغيظهم بأمة حمقاء."], [22, "فها قد أضرم غضبي نارا تحرق حتى الهاوية السفلى، وتأكل الأرض وغلاتها، وتشعل أسس الجبال."], [23, "أكوم عليهم شرورا وأنفذ سهامي فيهم."], [24, "وحين يكونون خائرين من الجوع، منهوكين من الحمى والداء السام، أجعل أنياب الوحوش مع سم زواحف الأرض تنشب فيهم."], [25, "يثكلهم سيف العدو في الطريق، ويستولي عليهم الرعب داخل الخدور، فيهلك الفتى مع الفتاة، والرضيع مع الشيخ."], [26, "قلت: أشتتهم في زوايا الأرض، وأمحو من بين الناس ذكرهم."], [27, "لولا خوفي من تبجح العدو، إذ يظنون قائلين: إن يدنا قد عظمت، وليس ما جرى هو من فعل الرب."]]}], "kwAr": "من أجل معاصي", "noteAr": ""}, {"kw": "Judah", "raw": "Amo_3:2; 2Ki_17:19; Jer_9:25, Jer_9:26; Hos_5:12, Hos_5:13, Hos_6:11, Hos_12:2", "note": "", "refs": [{"l": "Amo 3:2", "n": "", "vs": [[2, "إياكم وحدكم اخترت من بين جميع قبائل الأرض، لهذا أعاقبكم على جميع آثامكم."]]}, {"l": "2Ki 17:19", "n": "", "vs": [[19, "ولكن حتى سبط يهوذا لم يحفظ وصايا الرب إلهه بل نهج في طرق إسرائيل التي سلكتها."]]}, {"l": "Jer 9:25", "n": "", "vs": [[25, "«ها أيام مقبلة»، يقول الرب، «أعاقب فيها كل مختون وأغلف"]]}, {"l": "Jer 9:26", "n": "", "vs": [[26, "أهل مصر ويهوذا وأدوم وبني عمون وموآب، وسائر المقيمين في الصحراء ممن يقصون شعر أصداغهم، لأن جميع الشعوب غلف، أما كل بيت إسرائيل فإنهم ذوو قلوب غلفاء»."]]}, {"l": "Hos 5:12", "n": "", "vs": [[12, "لهذا أكون كالعث لإسرائيل، وكالسوس الناخر لشعب يهوذا."]]}, {"l": "Hos 5:13", "n": "", "vs": [[13, "عندما تبين إسرائيل داءه، ويهوذا جراحه، لجأ إسرائيل إلى أشور يلتمس معونة الملك العظيم، إلا أنه أخفق في علاجه أو في مداواة جراحه."]]}, {"l": "Hos 6:11", "n": "", "vs": [[11, "أما أنت يايهوذا فقد تحدد موعد عقابك عندما أرد سبي شعبي."]]}, {"l": "Hos 12:2", "n": "", "vs": [[2, "للرب دعوى على يهوذا، وسيعاقب إسرائيل بمقتضى طرقه ويجازيه بموجب أعماله."]]}], "kwAr": "يهوذا", "noteAr": ""}, {"kw": "because", "raw": "Lev_26:14, Lev_26:15; Jdg_2:17-20; 2Sa_12:9, 2Sa_12:10; 2Ki_22:11-17; 2Ch_36:14-17; Neh_1:7, Neh_9:26, Neh_9:29, Neh_9:30; Isa_5:24, Isa_5:25; Jer_8:9; Ezek. 16:1-63, Eze_20:13, Eze_20:16, Eze_20:24; Eze_22:8, Eze_23:11-21; Dan_9:5-12; 1Th_4:8", "note": "", "refs": [{"l": "Lev 26:14", "n": "", "vs": [[14, "ولكن إن عصيتموني ولم تعملوا بكل هذه الوصايا،"]]}, {"l": "Lev 26:15", "n": "", "vs": [[15, "وإن تنكرتم لفرائضي وكرهتم أحكامي ولم تعملوا بكل وصاياي، بل نكثتم ميثاقي،"]]}, {"l": "Jdg 2:17-20", "n": "", "vs": [[17, "غير أنهم عصوا قضاتهم أيضا، وخانوا الرب إذ عبدوا آلهة أخرى وسجدوا لها، وتحولوا سريعا عن الطريق التي سلكها آباؤهم إطاعة لوصايا الرب."], [18, "وفي كل مرة كان الرب يقيم قاضيا كان يؤيده بقوة طوال حياته فيخلص الشعب من عبودية أعدائه إذ يشفق الرب عليهم مما يسومهم مضايقوهم وظالموهم من عذاب؛ فكان الرب ينقذهم طوال حياة القاضي."], [19, "ولكن ما إن يموت القاضي حتى يرتدوا عن الرب ويتفاقم فسادهم أكثر من تفاقم فساد آبائهم بالسعي وراء آلهة أخرى ليعبدوها ويسجدوا لها. لم يرتدعوا عن أفعالهم وسلوكهم العنيد."], [20, "فاحتدم غضب الرب على إسرائيل وقال: «من حيث أن هذا الشعب قد نقض عهدي الذي عقدته مع آبائهم، وعصوني،"]]}, {"l": "2Sa 12:9", "n": "", "vs": [[9, "فلماذا احتقرت كلام الرب لتقترف الشر أمامه؟ قتلت أوريا الحثي بسيف العمونيين وتزوجت امرأته."]]}, {"l": "2Sa 12:10", "n": "", "vs": [[10, "لذلك لن يفارق السيف بيتك إلى الأبد، لأنك احتقرتني واغتصبت امرأة أوريا الحثي»."]]}, {"l": "2Ki 22:11-17", "n": "", "vs": [[11, "فلما سمع الملك ما ورد في سفر الشريعة مزق ثيابه،"], [12, "وأمر حلقيا الكاهن، وأخيقام بن شافان، وعكبور بن ميخا، وشافان الكاتب، وعسايا خادم الملك قائلا:"], [13, "«اذهبوا واسألوا الرب عن مصيري ومصير شعب يهوذا بناء على ما ورد في هذا السفر الذي تم العثور عليه، إذ إن غضب الرب المحتدم علينا عظيم جدا، لأن آباءنا لم يطيعوا كلام هذا السفر، ولم يمارسوا كل ما ورد فيه»."], [14, "فانطلق حلقيا الكاهن، وأخيقام، وعكبور، وشافان، وعسايا، واستشاروا النبية خلدة زوجة شلوم بن تقوة بن حرحس حارس الثياب الملكية، المقيمة في المنطقة الثانية من أورشليم."], [15, "فقالت لهم: «هذا ما يقوله الرب إله إسرائيل: قولوا للرجل الذي أرسلكم إلي:"], [16, "هكذا يقول الرب: ها أنا أجلب على هذا الموضع وعلى أهله كل الوعيد الوارد في السفر الذي قرأه ملك يهوذا،"], [17, "لأنهم نبذوني وأوقدوا لآلهة أخرى، ليثيروا سخطي بما تجنيه أيديهم من آثام، فاحتدم غضبي الذي لا ينطفيء على هذا الموضع."]]}, {"l": "2Ch 36:14-17", "n": "", "vs": [[14, "وأغوى معه رؤساء الكهنة والشعب الذين ازدادوا تورطا في خيانة الرب، مقترفين كل رجاسات الأمم، حتى إنهم نجسوا بيت الرب الذي قدسه في أورشليم."], [15, "وأرسل الرب إله آبائهم إليهم رسلا بصورة متوالية محذرا إياهم لأنه أشفق على شعبه وعلى مسكنه."], [16, "فكانوا يهزأون برسل الله، ورفضوا كلامه، واستهانوا بأنبيائه، حتى ثار غضب الرب على شعبه وامتنع كل شفاء!"], [17, "فأرسل إليهم ملك الكلدانيين، فقتل نخبتهم بالسيف في عقر الهيكل المقدس. ولم يرحم الرب فتى أو عذراء أو شيخا أو أشيب، بل أسلمهم جميعا ليد الكلدانيين،"]]}, {"l": "Neh 1:7", "n": "", "vs": [[7, "لقد اقترفنا الشر في حقك، ولم نطع الوصايا والفرائض والأحكام التي أمرت بها عبدك موسى."]]}, {"l": "Neh 9:26", "n": "", "vs": [[26, "ومع ذلك ثاروا عليك وتمردوا وطرحوا شريعتك خلف ظهورهم، وقتلوا أنبياءك الذين حذروهم وأنذروهم ليرتدوا إليك، وارتكبوا الشرور الفواحش."]]}, {"l": "Neh 9:29", "n": "", "vs": [[29, "وأنذرتهم لتردهم إلى شريعتك. غير أنهم طغوا وتمردوا على وصاياك وأخطأوا ضد أحكامك، التي إن مارسها إنسان يحيا بها، واعتصموا بعنادهم وأغلظوا قلوبهم ولم يطيعوا."]]}, {"l": "Neh 9:30", "n": "", "vs": [[30, "لقد تحملتهم سنين كثيرة، وحذرتهم بروحك على لسان أنبيائك فلم يصغوا، فأسلمتهم لعبودية أمم البلاد."]]}, {"l": "Isa 5:24", "n": "", "vs": [[24, "لهذا كما تلتهم النار القش، وكما يفنى الحشيش الجاف في اللهب، كذلك يصيب أصولهم العفن، ويتناثر زهرهم كالتراب، لأنهم نبذوا شريعة الله واستهانوا بكلمة قدوس إسرائيل"]]}, {"l": "Isa 5:25", "n": "", "vs": [[25, "لذلك احتدم غضب الرب ضد شعبه، فمد يده عليهم وضربهم، فارتعشت الجبال، وأصبحت جثث موتاهم كالقاذورات في الشوارع. ومع ذلك كله لم يرتد غضبه ولم تبرح يده ممدودة بالعقاب."]]}, {"l": "Jer 8:9", "n": "", "vs": [[9, "سيلحق الخزي بالحكماء ويعتريهم الفزع والذهول، لأنهم رفضوا كلمة الرب. إذا أية حكمة فيهم؟"]]}, {"l": "Eze 16:1-63", "n": "", "vs": [[1, "وأوحى إلي الرب بكلمته قائلا:"], [2, "«ياابن آدم، أطلع أهل أورشليم على أرجاسهم."], [3, "وقل هذا ما يعلنه السيد الرب لأورشليم: أصلك ومولدك من أرض الكنعانيين. أبوك أموري وأمك حثية."], [4, "في يوم مولدك لم يقطع حبل سرتك ولم تنظفي بماء ولم تدلكي بملح، ولم تقمطي. (إشارة إلى أن أحدا لم يكترث لها)."], [5, "لم ترأف بك عين أو تعطف عليك لتصنع لك شيئا من هذا. بل نبذت في الصحراء احتقارا لك يوم مولدك."], [6, "وحين مررت بك وشهدتك مازلت ملطخة بدمائك قلت لك: عيشي بدمك. نعم عيشي بدمك."], [7, "وكثرتك كنبت الحقل، فنميت وكبرت وبلغت عمرا صرت فيه أجمل الجميلات، فنهد ثدياك ونما شعرك، ولكنك كنت عارية متجردة."], [8, "فمررت بك ورأيتك وإذا بك قد بلغت سن الحب، فبسطت عليك أطراف ثوبي، وسترت عورتك وحلفت لك وأبرمت معك عهدا، فصرت لي، يقول السيد الرب."], [9, "ثم غسلتك بماء، ونظفتك من الدم وطيبتك بالدهن."], [10, "وكسوتك بثياب موشاة وحذوتك بنعلين من جلد الدلفين، ولفعتك بالكتان الفاخر، ودثرتك بالحرير،"], [11, "وزينتك بالحلي، إذ وضعت أساور في يديك وعقدا في عنقك."], [12, "وجعلت خزامة في أنفك وقرطين في أذنيك وإكليل جمال على رأسك"], [13, "فتزينت بالذهب والفضة، وكانت ثيابك من الكتان الفاخر والحرير وكل ما هو موشى. وأكلت السميذ والعسل والزيت، فتمتعت بأروع الجمال حتى صرت صالحة لتكوني زوجة ملك."], [14, "فذاع اسمك بين الأمم لفرط جمالك لأنه اكتمل بفضل بهائي الذي أضفيته عليك، يقول السيد الرب."], [15, "ولكنك اعتمدت على جمالك وزنيت اتكالا على شهرتك. أغدقت عهارتك على كل عابر سبيل راغب فيك"], [16, "وأخذت بعض ثيابك فصنعت لنفسك مشارف للأصنام ملونة زنيت عليها زنى لم يكن له مثيل ولن يكون."], [17, "وأحضرت ما وهبتك من حلي الجواهر، من ذهبي وفضتي، فصنعت منها تماثيل ذكور وزنيت بها (أي عبدتها)."], [18, "وأخذت ثيابك الموشاة فكسوتها بها، ووضعت أمامها دهني وبخوري،"], [19, "وخبزي الذي قدمته لك والسميذ والزيت والعسل الذي أطعمتك، وقربتها أمامها كتقدمة سرور، هكذا فعلت يقول السيد الرب."], [20, "ثم أخذت أبناءك وبناتك الذين أنجبتهم لي، فذبحتهم قرابين لها. فهل كان زناك أمرا يسيرا؟"], [21, "قد ذبحت أبنائي وسلمتهم للأوثان ليجوزوا في النار قربانا لها."], [22, "وفي جميع رجاساتك وزناك لم تذكري أيام حداثتك حين كنت عارية متجردة ملطخة بدمك."], [23, "ثم من بعد كل شرك ويل، ويل لك يقول السيد الرب"], [24, "شيدت لنفسك ماخورا وصنعت لك أنصابا في كل ساحة."], [25, "بنيت مرتفعتك عند ناصية كل طريق، ودنست جمالك ووهبت جسدك لكل عابر سبيل لتكثري من عهارتك."], [26, "وزنيت مع أبناء مصر، جيرانك الشهوانيين، وأكثرت فواحشك لإسخاطي."], [27, "ها أنا أعاقبك وأنقص من نصيبك وأسلمك لأهواء عدواتك بنات الفلسطينيين اللواتي يخجلن من تصرفك الفاجر."], [28, "وإذ لم تشبعي زنى ارتكبت الفواحش مع أبناء أشور من غير أن تكتفي."], [29, "ثم أكثرت من ارتكاب الفجور في أرض الكنعانيين حتى ديا ر الكلدانيين، ومع ذلك لم تكتفي."], [30, "ما أشر قلبك يقول السيد الرب إذ اقترفت هذه الموبقات كلها، فعل امرأة زانية صفيقة."], [31, "فشيدت ماخورك عند ناصية كل طريق، وأقمت مرتفعة صنمك في كل ساحة ولم تكوني كالزانية التي تقبض أجرة زناها، لأنك وهبت نفسك مجانا احتقارا لكل أجرة."], [32, "إذ كنت زوجة فاسقة أحلت الغرباء موضع زوجها."], [33, "كل الزانيات ينلن هدايا من الرجال، أما أنت فأعطيت هداياك لمحبيك، ورشوتهم كي يقبلوا إليك من كل صوب ليزنوا معك."], [34, "فأنت في زناك تختلفين عن بقية النساء الزانيات، إذ لا يسعى أحد وراءك ليزني معك بل على النقيض، أنت تعطينهم أجرة ليفسقوا معك ولا تقبضين منهم أجرة."], [35, "لذلك اسمعي أيتها الزانية قضاء الرب:"], [36, "من حيث أنك أنفقت مالك وكشفت عن عريك في فواحشك لعشاقك ولسائر أصنامك الممقوتة، ومن أجل دماء أبنائك الذين قربتهم لها،"], [37, "ها أنا أحشد جميع عشاقك الذين تلذذت بهم، وجميع من تدلهت بهم مع كل الذين أبغضتهم فأجمعهم عليك من كل ناحية، وأكشف عن عريك فيشاهدون عورتك كلها،"], [38, "وأدينك كما تدان الزانيات وسافكات الدماء، وأوقع بك عقاب دم سخطي وغيرتي،"], [39, "وأسلمك لأيديهم فيهدمون ماخورك ومرتفعة نصبك، ويسلبونك ثيابك ويستولون على جواهر زينتك ويتركونك عارية متجردة،"], [40, "ويثيرون عليك الجموع ويرجمونك بالحجارة ويمزقونك بسيوفهم."], [41, "ويحرقون بيوتك بالنار، وينفذون فيك أحكاما على مرأى نساء كثيرات. عندئذ أمنعك عن الزنى ولا تبذلين أجرة بعد للزناة معك."], [42, "حينئذ أسكن شدة غضبي عليك وأصرف عنك غيرتي فأهدأ ولا أسخط بعد."], [43, "ولأنك لم تذكري أيام حداثتك، وإنما أثرت حنقي بارتكاب جميع هذه الموبقات، ها أنا بدوري أعاقبك أشد العقاب، يقول السيد الرب، فلا تقترفين هذه الرذيلة فوق رجاساتك كلها."], [44, "ها إن كل متمثل يقتبس هذ المثل عليك قائلا: كما تكون الأم تكون ابنتها"], [45, "فأنت ابنة أمك التي كرهت زوجها وأبناءها، وأنت شقيقة أخواتك اللواتي عفن رجالهن وأبناءهن. فأمكن حثية وأبوكن أموري."], [46, "وأختك الكبرى هي السامرة المقيمة مع بناتها إلى الشمال منك، وأختك الصغرى هي سدوم المقيمة مع بناتها إلى الجنوب منك."], [47, "ولم تكتفي بالسلوك في طرق فجورهن وارتكاب مثل أرجاسهن وكأن ذلك قليل عليك بل تفوقت عليهن فسادا في جميع طرقك."], [48, "لذلك يقول السيد الرب حي أنا، إن سدوم أختك وبناتها لم يقترفن المفاسد التي اقترفتها أنت وبناتك."], [49, "أما إثم أختك سدوم، فإنها مع بناتها طغت عليها الغطرسة والتخمة وسلام الاطمئنان، ولم تغث الفقير والمسكين."], [50, "وتشامخن وارتكبن الرجس أمامي، فمحوتهن عندما شاهدت ذلك."], [51, "ولم تخطيء السامرة نصف خطاياك، بل كنت أكثر رجاسات منهن، فجعلت أختيك تبدوان أكثر صلاحا منك، من جراء جميع رجاساتك التي اقترفتها"], [52, "فاحملي أنت أيضا عارك، إذ جعلت القضاء في صالح أختيك لفرط معاصيك التي تفوقت بها على رجاستهن. قد أصبحن أكثر برا منك، فاخزي واحملي عارك إذ قد بررت أخواتك."], [53, "ولكني سأرد سبيهن: سبي سدوم وبناتها، وسبي السامرة وبناتها، وسبي مسبييك في جملتهم."], [54, "لكي تحملي عارك وتخجلي مما ارتكبت عندما أصبحت تعزية لهن."], [55, "فأخواتك: سدوم وبناتها، والسامرة وبناتها يعدن إلى سابق عهدهن، وكذلك أنت وبناتك أيضا."], [56, "إن اسم أختك سدوم لم يرد ذكره على فمك في يوم غطرستك،"], [57, "قبل انكشاف شرك. وها أنت قد صرت مثار تعيير بنات أرام وجميع المحيطين بها من بنات فلسطين وكل اللواتي حولك ممن احتقرنك."], [58, "لقد حملت عقاب فجورك ورجاساتك، يقول الرب."], [59, "لهذا سأصنع بك كما صنعت، إذ ازدريت بالقسم عندما نكثت العهد."], [60, "أما أنا فأذكر عهدي معك في أيام حداثتك، وأعقد معك عهدا أبديا،"], [61, "فتذكرين عندئذ طرقك حين تستقبلين أختيك: الكبرى والصغرى كلتيهما، وأجعلهما كبنتين لك، إنما ليس ذلك بفضل عهدك."], [62, "فأقيم عهدي معك فتدركين أني أنا الرب،"], [63, "لكي تتذكري فتخجلي ولا تفتحي فمك من بعد بسبب خزيك، حين أغفر لك كل ما ارتكبت من شر يقول السيد الرب»."]]}, {"l": "Eze 20:13", "n": "", "vs": [[13, "لكن شعب إسرائيل تمردوا علي في البرية ولم يمارسوا فرائضي، وتنكروا لأحكامي التي إن عمل بها إنسان يحيا، ونجسوا أيام سبوتي كثيرا. فقلت: سأسكب غضبي عليهم في البرية لأميتهم."]]}, {"l": "Eze 20:16", "n": "", "vs": [[16, "لأنهم تنكروا لأحكامي ولم يمارسوا فرائضي، بل دنسوا أيام سبوتي وضل قلبهم وراء أصنامهم."]]}, {"l": "Eze 20:24", "n": "", "vs": [[24, "لأنهم لم يطبقوا أحكامي بل تنكروا لفرائضي ودنسوا أيام سبوتي وتعلقت عيونهم بأصنام آبائهم."]]}, {"l": "Eze 22:8", "n": "", "vs": [[8, "احتقرت مقدساتي ونجست أيام سبوتي."]]}, {"l": "Eze 23:11-21", "n": "", "vs": [[11, "ومع أن أختها أهوليبة شهدت هذا، فإنها أوغلت أكثر منها في عشقها وزناها،"], [12, "إذ عشقت أبناء أشور من ولاة وقادة المرتدين أفخر اللباس، فرسان خيل وجميعهم شبان شهوة."], [13, "فرأيت أنها قد تنجست، وسلكتا كلتاهما في ذات الطريق."], [14, "غير أن أهوليبة تفوقت في زناها، إذ حين نظرت إلى صور رجال الكلدانيين المرسومة على الحائط بالمغرة،"], [15, "متحزمين بمناطق على خصورهم، وعمائمهم مسدولة على رؤوسهم، وكلهم بدوا كرؤساء مركبات مماثلين تماما لأبناء الكلدانيين في بابل أرض ميلادهم،"], [16, "عشقتهم وبعثت إليهم رسلا إلى أرض الكلدانيين."], [17, "فأقبل إليها أبناء بابل وعاشروها في مضجع الحب ونجسوها بزناهم. وبعد أن تنجست بهم كرهتهم."], [18, "وإذ واظبت على زناها علانية، وتباهت بعرض عريها، كرهتها كما كرهت أختها."], [19, "ومع ذلك أكثرت من فحشها، ذاكرة أيام حداثتها حيث زنت في ديار مصر."], [20, "فأولعت بعشاقها هناك، الذين عورتهم كعور ة الحمير ومنيهم كمني الخيل."], [21, "وتقت إلى فجور حداثتك حين كان المصريون يداعبون ترائب عذرتك طمعا في نهد حداثتك."]]}, {"l": "Dan 9:5-12", "n": "", "vs": [[5, "إننا أخطأنا وأثمنا وارتكبنا الشر، وتمردنا وانحرفنا عن وصاياك وأحكامك."], [6, "ولم نسمع لعبيدك الأنبياء الذين باسمك أنذروا ملوكنا ورؤساءنا وآباءنا وجميع شعب الأرض."], [7, "لك أيها السيد البر، ولنا الخزي، كما هو حادث اليوم لرجال يهوذا ولأهل أورشليم، ولسائر بني إسرائيل القريبين والبعيدين، المشتتين في كل البلدان التي أجليتهم إليها عقابا لهم على ما اقترفوه من خيانة في حقك."], [8, "فلنا أيها السيد الخزي، نحن وملوكنا ورؤسائنا وآبائنا، لأننا أخطأنا إليك."], [9, "إنما للرب إلهنا الرحمة والمغفرة لأننا عصيناك."], [10, "ولم نطع صوت الرب إلهنا لنسلك في شرائعه التي أعلنها لنا على لسان عبيده الأنبياء."], [11, "قد تعدى كل شعب إسرائيل على شريعتك، وانحرفوا فلم يسمعوا صوتك، فسكبت علينا اللعنة وما أقسمت أن توقعه بنا، كما نصت عليه شريعة موسى عبد الله، لأننا أخطأنا إليك."], [12, "وقد نفذت قضاءك الذي قضيت به علينا وعلى قضاتنا الذين تولوا أمرنا، جالبا علينا وعلى أورشليم شرا عظيما لم يحدث له مثيل تحت السماء."]]}, {"l": "1Th 4:8", "n": "", "vs": [[8, "إذن، من استخف بأخيه في هذا الأمر، يستخف لا بإنسان بل بالله، بذاك الذي وهبكم فعلا روحه القدوس."]]}], "kwAr": "لأنهم رفضوا", "noteAr": ""}, {"kw": "and their", "raw": "Isa_9:15, Isa_9:16, Isa_28:15, Isa_44:20; Jer_16:19, Jer_16:20, Jer_23:13-15, Jer_23:25-32, Jer_28:15, Jer_28:16; Eze_13:6-16, Eze_13:22, Eze_22:28; Hab_2:18; Rom_1:25", "note": "", "refs": [{"l": "Isa 9:15", "n": "", "vs": [[15, "إن الشيخ والوجيه هو الرأس، والنبي الذي يلقن الكذب هو الذنب"]]}, {"l": "Isa 9:16", "n": "", "vs": [[16, "فمرشدو هذا الشعب يضلونه، والمرشدون يبتلعون."]]}, {"l": "Isa 28:15", "n": "", "vs": [[15, "لأنكم قلتم: «قد أبرمنا عهدا مع الموت، وعقدنا ميثاقا مع الهاوية، فإن الأشوريين المقتحمين أرضنا لن يسلخونا، لأن السوط الجارف إذا عبر لا يصيبنا لأننا اعتصمنا بالمراوغة ولجأنا إلي النفاق»."]]}, {"l": "Isa 44:20", "n": "", "vs": [[20, "لكأنه يأكل الرماد! يجري وراء سراب ويعجز عن إنقاذ نفسه أو الاعتراف أن الصنم الذي يمسكه بيده هو محض ضلال!"]]}, {"l": "Jer 16:19", "n": "", "vs": [[19, "يارب أنت عزي وحصني وملاذي في يوم الضيق، إليك تقبل الأمم من أقاصي الأرض قائلة: «لم يرث آباؤنا سوى الباطل والأكاذيب وما لا جدوى منه."]]}, {"l": "Jer 16:20", "n": "", "vs": [[20, "هل في وسع المرء أن يصنع لنفسه إلها؟ إن هذه ليست آلهة."]]}, {"l": "Jer 23:13-15", "n": "", "vs": [[13, "في أوساط أنبيا ء السامرة شهدت أمورا كريهة، إذ تنبأوا باسم البعل، وأضلوا شعبي إسرائيل."], [14, "وفي أوساط أنبياء أورشليم رأيت أمورا مهولة: يرتكبون الفسق، ويسلكون في الأكاذيب، يشددون أيدي فاعلي الإثم لئلا يتوب أحد عن شره. صاروا جميعا كسكان سدوم وأصبح أهلها كأهل عمورة."], [15, "لذلك هذا ما يقوله الرب القدير عن الأنبياء: «ها أنا أطعمهم أفسنتينا وأسقيهم ماء مسموما، لأنه من أنبياء أورشليم شاع الكفر في كل أرجاء الأرض»."]]}, {"l": "Jer 23:25-32", "n": "", "vs": [[25, "قد سمعت ما نطق به المتنبئون باسمي زورا قائلين: قد حلمت، قد حلمت."], [26, "إلى متى يظل هذا الخداع مكنونا في قلوب المتنبئين زورا؟ إنهم حقا أنبياء خداع، يتنبأون بأوهام قلوبهم."], [27, "فينسون شعبي اسمي بما يقصه كل واحد منهم على صاحبه من أحلامه، كما نسي آباؤهم اسمي لأجل وثن البعل."], [28, "فليقص النبي الحالم حلمه. ولكن من لديه كلمتي فليعلنها بالحق، إذ ماذا يجمع بين التبن والحنطة؟"], [29, "أليست كلمتي كالنار، وكالمطرقة التي تحطم الصخور؟"], [30, "لذلك ها أنا أقاوم هؤلاء الأنبياء الذين ينتحل كل منهم كلام الآخر،"], [31, "وأقاوم الأنبياء الذين يسخرون ألسنتهم قائلين: الرب يقول هذا."], [32, "ها أنا أقاوم المتنبئين بأحلام كاذبة ويقصونها مضلين شعبي بأكاذيبهم واستخفافهم، مع أني لم أرسلهم ولم أكلفهم بشيء. ولا جدوى منهم لهذا الشعب."]]}, {"l": "Jer 28:15", "n": "", "vs": [[15, "وأضاف إرميا النبي مخاطبا حننيا المتنبيء: «اسمع ياحننيا، هذا ما يعلنه الرب: إن الرب لم يبعثك، وأنت جعلت هذا الشعب يصدق كذبك."]]}, {"l": "Jer 28:16", "n": "", "vs": [[16, "لذلك هكذا يعلن الرب: ها أنا أبيدك عن وجه الأرض فتموت في هذه السنة لأنك نطقت بالتمرد على الرب»."]]}, {"l": "Eze 13:6-16", "n": "", "vs": [[6, "إنما رؤياهم باطلة، وعرافتهم كاذبة. يقولون: يقول الرب، والرب لم يرسلهم، ومع ذلك يطمعون في تحقيق كلمتهم."], [7, "ألم تروا رؤيا باطلة، وتنطقوا بعرافة كاذبة قائلين: يقول الرب، وأنا لم أتكلم؟"], [8, "لذلك يعلن الرب: لأنكم تكلمتم باطلا وادعيتم رؤيا كاذبة، فها أنا أنقلب عليكم يقول السيد الرب."], [9, "فتكون يدي على الأنبياء ذوي الرؤيا الباطلة والعرافة الكاذبة، فلا يكون لهم مقام في جماعة شعبي، ولا تدون أسماؤهم في كتاب بيت إسرائيل، ولا يدخلون أرض إسرائيل، فتدركون أني أنا السيد الرب."], [10, "لأنهم حقا أضلوا شعبي قائلين: سيكون لكم سلام مع أنه ليس هناك سلام، فكان شعبي يبني حائطا وهم يطلونه بماء الكلس."], [11, "قل للطالين بماء الكلس: إن الحائط يتداعى، إذ ينهمر مطر جارف. وأنتن ياحجارة البر د تساقطن، ولتعصف به ريح جائحة."], [12, "فلا يلبث السور أن ينهار أفلا تسألون آنئذ: أين الطين الذي طينتم به؟"], [13, "لذلك، هذا ما يعلنه السيد الرب: ها أنا أجعل ريحا عاتية تخترق السور بفعل حنقي، ومطرا جارفا ينهمر في خضم غضبي، وحجارة برد تتساقط في أثناء سخطي لكي تهلك،"], [14, "فأهدم السور الذي طليتموه بماء الكلس وأسويه بالأرض فيتعرى أساسه وتتداعى المدينة وتفنون جميعا في وسطها فتدركون أني أنا الرب."], [15, "فأنفث غضبي بالسور وبمن يطلونه بماء الكلس وأقول لكم: قد تلاشى السور والذين يطلونه."], [16, "الذين هم أنبياء إسرائيل الأدعياء، المتنبئون لإسرائيل، الذين يرون لها رؤى سلام، مع أنه لا سلام هناك، يقول السيد الرب."]]}, {"l": "Eze 13:22", "n": "", "vs": [[22, "لأنكن أحزنتن قلب الصديق بأكاذيبكن، مع أنني لم أحزنه، وشددتن عزائم الشرير لئلا يرجع عن طريقه الأثيمة فيحيا."]]}, {"l": "Eze 22:28", "n": "", "vs": [[28, "وأنبياؤها قد طلوا لهم بماء الكلس، إذ يرون لهم رؤى باطلة، ويعرفون لهم عرافة كاذبة قائلين: هذا ما يعلنه السيد الرب، مع أن الرب لم يعلن شيئا."]]}, {"l": "Hab 2:18", "n": "", "vs": [[18, "أي جدوى من تمثال حتى يصوغه صانع، أو صنم يعلم الكذب لأن من يصنعه يتكل على ما صنعه، وهو لم يصنع سوى أصنام بكماء."]]}, {"l": "Rom 1:25", "n": "", "vs": [[25, "إذ قد استبدلوا بحق الله ما هو باطل، فاتقوا المخلوق وعبدوه بدل الخالق، المبارك إلى الأبد. آمين!"]]}], "kwAr": "فأضلتهم", "noteAr": ""}, {"kw": "after", "raw": "Jdg_2:11-17, Jdg_10:6; 2Ch_30:7; Jer_8:2, Jer_9:14; Eze_20:13, Eze_20:16, Eze_20:18, Eze_20:24, Eze_20:30; 1Pe_1:18", "note": "", "refs": [{"l": "Jdg 2:11-17", "n": "", "vs": [[11, "واقترف بنو إسرائيل الشر في عيني الرب وعبدوا البعليم،"], [12, "ونبذوا الرب إله آبائهم الذي أخرجهم من ديار مصر، وغووا وراء آلهة أخرى من أوثان الشعوب المحيطة بهم، وسجدوا لها، فأغاظوا الرب."], [13, "تركوا الرب وعبدوا البعل وعشتاروث."], [14, "فاحتدم غضب الرب على إسرائيل وتركهم تحت رحمة الناهبين الغزاة. وأسلمهم إلى أعدائهم المحيطين بهم فعجزوا عن مقاومتهم."], [15, "وحيثما خرجوا لخوض الحرب كان الرب ضدهم فينكسرون، تماما كما سبق وحذرهم، فاعتراهم ضيق عظيم جدا."], [16, "وأقام الرب من بينهم قضاة فأنقذوهم من أيدي غزاتهم."], [17, "غير أنهم عصوا قضاتهم أيضا، وخانوا الرب إذ عبدوا آلهة أخرى وسجدوا لها، وتحولوا سريعا عن الطريق التي سلكها آباؤهم إطاعة لوصايا الرب."]]}, {"l": "Jdg 10:6", "n": "", "vs": [[6, "وعاد بنو إسرائيل يرتكبون الإثم في عيني الرب، وعبدوا البعليم وعشتاروث وآلهة أرام وآلهة صيدون وآلهة بني عمون وآلهة الفلسطينيين وتركوا الرب ولم يعبدوه."]]}, {"l": "2Ch 30:7", "n": "", "vs": [[7, "ولا تخونوا الرب إله آبائكم كما خانه أباؤكم وإخوتكم، فجعلهم مثار دهشة كما ترون."]]}, {"l": "Jer 8:2", "n": "", "vs": [[2, "ويعرضونها أمام الشمس والقمر وكواكب السماء التي أحبوها وعبدوها وضلوا وراءها، واستشاروها وسجدوا لها، فلا تجمع ولا تدفن، بل تصير نفاية فوق وجه الأرض،"]]}, {"l": "Jer 9:14", "n": "", "vs": [[14, "بل ضلوا وراء عناد قلوبهم، وانساقوا خلف آلهة البعليم التي لقنهم آباؤهم عبادتها."]]}, {"l": "Eze 20:13", "n": "", "vs": [[13, "لكن شعب إسرائيل تمردوا علي في البرية ولم يمارسوا فرائضي، وتنكروا لأحكامي التي إن عمل بها إنسان يحيا، ونجسوا أيام سبوتي كثيرا. فقلت: سأسكب غضبي عليهم في البرية لأميتهم."]]}, {"l": "Eze 20:16", "n": "", "vs": [[16, "لأنهم تنكروا لأحكامي ولم يمارسوا فرائضي، بل دنسوا أيام سبوتي وضل قلبهم وراء أصنامهم."]]}, {"l": "Eze 20:18", "n": "", "vs": [[18, "وأوصيت أبناءهم في البرية ألا يسلكوا في طرق آبائهم ولا يمارسوا أعمالهم ولا يتنجسوا بأصنامهم."]]}, {"l": "Eze 20:24", "n": "", "vs": [[24, "لأنهم لم يطبقوا أحكامي بل تنكروا لفرائضي ودنسوا أيام سبوتي وتعلقت عيونهم بأصنام آبائهم."]]}, {"l": "Eze 20:30", "n": "", "vs": [[30, "لذلك قل لشعب إسرائيل هذا ما يعلنه السيد الرب: هل دنستم أنفسكم كما فعل آباؤكم وغويتم وراء أصنامكم الرجسة؟"]]}, {"l": "1Pe 1:18", "n": "", "vs": [[18, "واعلموا أنه قد دفع الفدية ليحرركم من سيرة حياتكم الباطلة التي أخذتموها بالتقليد عن آبائكم. وهذه الفدية لم تكن شيئا فانيا كالفضة أو الذهب،"]]}], "kwAr": "وراءها", "noteAr": ""}], "arS": [["هذا", ["H3541"]], [" ما ", []], ["يقوله", ["H559"]], [" ", []], ["الرب", ["H3068"]], [": ", []], ["من", ["H5921"]], [" أجل ", []], ["معاصي", ["H6588"]], [" ", []], ["يهوذا", ["H3063"]], [" ", []], ["الثلاث", ["H7969"]], [" ", []], ["والأربع", ["H702"]], [" لن ", []], ["أرد", ["H7725"]], [" عنهم سخطي، ", []], ["لأنهم", ["H5921"]], [" ", []], ["رفضوا", ["H3988"]], [" ", []], ["شريعة", ["H8451"]], [" الرب ولم ", []], ["يطيعوا", ["H8104"]], [" ", []], ["فرائضه", ["H2706"]], ["، ", []], ["فأضلتهم", ["H8582"]], [" ", []], ["أكاذيبهم", ["H3577"]], [" التي ", []], ["غوى", ["H1980"]], [" ", []], ["وراءها", ["H310"]], [" ", []], ["آباؤهم", ["H1"]], [".", []]]}, {"c": 2, "v": 5, "text": "لهذا أرسل نارا على يهوذا فتلتهم حصون أورشليم.", "groups": [{"kw": "I will", "raw": "Jer_17:27, Jer_21:10, Jer_37:8-10, Jer_39:8, Jer_52:13; Hos_8:14", "note": "", "refs": [{"l": "Jer 17:27", "n": "", "vs": [[27, "ولكن إن لم تستمعوا لي لتقدسوا يوم السبت، وثابرتم على حمل أثقال فيه لتدخلوها من بوابات أورشليم، فإني أضرم بواباتها بالنار فتلتهم قصور أورشليم، ولا تنطفيء»."]]}, {"l": "Jer 21:10", "n": "", "vs": [[10, "فإني قد قضيت على هذه المدينة بالشر لا بالخير يقول الرب، لهذا يستولي عليها ملك بابل فيحرقها بالنار»."]]}, {"l": "Jer 37:8-10", "n": "", "vs": [[8, "فيعود الكلدانيون ويحاربون هذه المدينة ويستولون عليها ويحرقونها بالنار."], [9, "لذلك يقول الرب لا تخدعوا أنفسكم قائلين: سينسحب عنا الكلدانيون، فإنهم لا ينسحبون."], [10, "وحتى لو قضيتم على محاربيكم من جيش الكلدانيين بأسره، ولم يبق منهم سوى الجرحى القابعين في خيامهم، فإنهم سيهبون ويحرقون هذه المدينة بالنار»."]]}, {"l": "Jer 39:8", "n": "", "vs": [[8, "وأحرق الكلدانيون قصر الملك وبيوت الشعب ونقضوا أسوار أورشليم."]]}, {"l": "Jer 52:13", "n": "", "vs": [[13, "وأحرق هيكل الرب وقصر الملك وجميع بيوت أورشليم، وأضرم النار في كل بيت من بيوت العظماء،"]]}, {"l": "Hos 8:14", "n": "", "vs": [[14, "لأن إسرائيل قد نسي خالقه، وشيد قصورا، وأكثر يهوذا من بناء المدن المحصنة، لهذا سأرسل نارا على هذه المدن فتلتهم حصونه."]]}], "kwAr": "أرسل", "noteAr": ""}], "arS": [["لهذا ", []], ["أرسل", ["H7971"]], [" ", []], ["نارا", ["H784"]], [" على ", []], ["يهوذا", ["H3063"]], [" ", []], ["فتلتهم", ["H398"]], [" ", []], ["حصون", ["H759"]], [" ", []], ["أورشليم", ["H3389"]], [".", []]]}, {"c": 2, "v": 6, "text": "هذا ما يقوله الرب: من أجل معاصي إسرائيل الثلاث والأربع لن أرد عنهم سخطي، لأنهم باعوا الصديق لقاء الفضة، والبائس مقابل نعلين.", "groups": [{"kw": "Thus saith", "raw": "Amos, says Abp. Newcome, first prophesies against the Syrians, Philistines, Tyrians, Edomites, Ammonites, and Moabites, who dwelt in the neighbourhood of the twelve tribes, and had occasionally become their enemies and persecutors. Having thus taught his countrymen that the providence of God extended to other nations, he briefly mentions the idolatrous practices and consequent destruction of Judah, and then passes on to his proper subject, which was to exhort and reprove the kingdom of Israel, and to denounce against it the Divine judgments.", "note": "Amos, says Abp. Newcome, first prophesies against the Syrians, Philistines, Tyrians, Edomites, Ammonites, and Moabites, who dwelt in the neighbourhood of the twelve tribes, and had occasionally become their enemies and persecutors. Having thus taught his countrymen that the providence of God extended to other nations, he briefly mentions the idolatrous practices and consequent destruction of Judah, and then passes on to his proper subject, which was to exhort and reprove the kingdom of Israel, and to denounce against it the Divine judgments.", "refs": [], "kwAr": "هذا ما يقوله", "noteAr": "يقول رئيس الأساقفة نيوكم إن عاموس يتنبأ أولا على السوريين والفلسطينيين والصوريين والأدوميين والعمونيين والموآبيين، الذين سكنوا بجوار الأسباط الاثني عشر وصاروا أحيانا أعداءهم ومضطهديهم. وبعد أن علّم بذلك أبناء وطنه أن عناية الله تمتد إلى سائر الأمم، ذكر بإيجاز الممارسات الوثنية ليهوذا وما نتج عنها من هلاك، ثم انتقل إلى موضوعه الأصلي، وهو حثّ مملكة إسرائيل وتوبيخها وإنذارها بالأحكام الإلهية."}, {"kw": "For three", "raw": "Amo_6:3-7; 2Ki_17:7-18, 2Ki_18:12; Eze_23:5-9; Hos_4:1, Hos_4:2, Hos_4:11-14, Hos_7:7-10, Hos_8:4-6; Hos_13:2, Hos_13:3; Mic_6:10-16", "note": "", "refs": [{"l": "Amo 6:3-7", "n": "", "vs": [[3, "أنتم يامن تتجاهلون يوم السوء وتقربون كرسي الظلم."], [4, "ويل للراقدين فوق أسرة من عاج، المسترخين فوق الأرائك، الآكلين لحم خيرة الحملان والعجول المختارة من وسط المعلف."], [5, "المغنين على صوت الرباب، المخترعين لأنفسهم آلات غناء كداود."], [6, "الشاربين خمرا في كؤوس، المتطيبين بأفضل العطور، ولا يكتئبون على خراب يوسف."], [7, "لهذا سيكونون أول الذاهبين إلى السبي، ويزول ما أنتم عليه من لهو وعبث."]]}, {"l": "2Ki 17:7-18", "n": "", "vs": [[7, "وقد حلت هذه النكبة ببني إسرائيل لأنهم أثموا في حق الرب إلههم الذي أخرجهم من ديار مصر، من تحت نير فرعون وعبدوا آلهة أخرى،"], [8, "سالكين حسب فرائض الأمم الذين طردهم الرب من أمامهم، ومن أمام ملوكهم الذين نصبوهم عليهم."], [9, "وارتكب بنو إسرائيل في الخفاء معاصي في حق الرب إلههم، وشيدوا لأنفسهم مرتفعات في جميع مدنهم من برج النواطير إلى المدينة المحصنة،"], [10, "وأقاموا لأنفسهم أنصابا وتماثيل لعشتاروث على كل تل مرتفع، وتحت كل شجرة خضراء،"], [11, "وقربوا محرقات على جميع المرتفعات كسائر الأمم الذين نفاهم الرب من أمامهم، واقترفوا الموبقات لإغاظة الرب،"], [12, "عابدين الأصنام التي حذرهم ونهاهم الرب عنها."], [13, "وقد أنذر الرب إسرائيل ويهوذا عن طريق أنبيائه ورائيه قائلا: «ارجعوا عن طرقكم الأثيمة، وأطيعوا وصاياي وفرائضي بمقتضى كل الشريعة التي أوصيت آباءكم بتطبيقها، والتي أعلنتها لكم على لسان عبيدي الأنبياء."], [14, "لكنهم أصموا أذانهم وأغلظوا قلوبهم كآبائهم الذين لم يثقوا بالرب إلههم،"], [15, "وتنكروا لفرائضه وعهده الذي أبرمه مع آبائهم، وتجاهلوا تحذيراته ونواهيه لهم، وضلوا وراء أصنام باطلة، فأصبحوا هم أنفسهم باطلين، وتمثلوا بالأمم الذين حولهم، مع أن الرب أمرهم ألا يفعلوا مثلهم، وارتكبوا أمورا نهاهم الرب عنها،"], [16, "ونبذوا جميع وصايا الرب إلههم، وصنعوا لأنفسهم عجلين مسبوكين، وأقاموا تماثيل لعشتاروث وسجدوا لجميع كواكب السماء وعبدوا البعل."], [17, "وأجازوا أبناءهم وبناتهم في النار، وتعاطوا العرافة والفأل وباعوا أنفسهم لارتكاب الشر في عيني الرب لإثارة غيظه."], [18, "فاحتدم غضب الرب على إسرائيل، وطردهم من حضرته، ولم يبق سوى سبط يهوذا."]]}, {"l": "2Ki 18:12", "n": "", "vs": [[12, "لأنهم أبوا الاستماع لصوت الرب إلههم، ونكثوا عهده وكل ما أمر به موسى عبد الرب، ولم يعملوا بها."]]}, {"l": "Eze 23:5-9", "n": "", "vs": [[5, "وزنت أهولة مع أنها كانت لي، وعشقت محبيها الأشوريين الأبطال."], [6, "اللابسين في الأردية الأرجوانية من ولاة وقادة. وكلهم شبان شهوة، وفرسان خيل."], [7, "فأغدقت على نخبة أبناء أشور زناها، وتنجست بكل من عشقتهم وبكل أصنامهم."], [8, "ولم تتخل عن زناها منذ أيام مصر لأنهم ضاجعوها منذ حداثتها، وعبثوا بترائب عذرتها وسكبوا عليها شهواتهم،"], [9, "لذلك سلمتها ليد عشاقها أبناء أشور الذين أولعت بهم."]]}, {"l": "Hos 4:1", "n": "", "vs": [[1, "اسمعوا كلمة الرب يابني إسرائيل، لأن للرب دعوى على أهل الأرض إذ خلت الأرض من الأمانة والإحسان ومعرفة الله."]]}, {"l": "Hos 4:2", "n": "", "vs": [[2, "وتفشت فيها اللعنة والكذب والقتل والسرقة والفسق. قد تخطوا كل حد، وسفك الدم يعقبه سفك دم."]]}, {"l": "Hos 4:11-14", "n": "", "vs": [[11, "قد سلبت الخمرة المعتقة والجديدة عقول شعبي"], [12, "فيطلبون مشورة قطعة خشب ويسألون عصا! لأن روح زنى قد أضلهم فنبذوا إلههم وزنوا وراء آخر."], [13, "ذبحوا على قمم الجبال وأصعدوا تقدماتهم على التلال وتحت شجر البلوط واللبنى والبطم لطيب ظلها. لذلك تزني بناتكم وتفسق كناتكم."], [14, "ولكني لن أعاقب بناتكم حين يزنين، ولا كناتكم حين يفسقن لأن الرجال أنفسهم قد تورطوا مع الزانيات، وذبحوا محرمات مع بغايا المعابد الوثنية، والشعب غير المتعقل يلحق به الدمار."]]}, {"l": "Hos 7:7-10", "n": "", "vs": [[7, "كلهم متأججون كأتون مشتعل. يفترسون حكامهم. هلك جميع ملوكهم، ولم يوجد بينهم من يطلبني."], [8, "قد اختلط أفرايم بالشعوب، صار كرغيف لم ينضج لأنه لم يقلب."], [9, "استنزف الغرباء قوته وهو لا يدري، وخط الشيب شعر رأسه وهو لا يعلم."], [10, "يشهد غرور إسرائيل عليه ولم يرجع إلى الرب إلهه، ولا التمسه."]]}, {"l": "Hos 8:4-6", "n": "", "vs": [[4, "قد نصبوا لهم ملوكا ولكن من غير رضاي، وأقاموا رؤساء من غير موافقتي، وصنعوا بذهبهم وفضتهم أصناما تؤول إلى هلاكهم."], [5, "لشد ما أزدري عجلك أيتها السامرة، وها غضبي قد احتدم عليهم فإلى متى يظلون عاجزين عن النقاوة؟"], [6, "إنه صنعة عامل إسرائيلي وليس إلها، ولابد أن يصير عجل السامرة حطاما."]]}, {"l": "Hos 13:2", "n": "", "vs": [[2, "وها هم يكثرون الآن معاصيهم، ويصوغون ببراعة لأنفسهم تماثيل وأصناما من فضتهم، كلها صنعة عمال حاذقين قائلين: «قبلوا تماثيل العجول هذه يامقربي الذبائح البشرية»."]]}, {"l": "Hos 13:3", "n": "", "vs": [[3, "لهذا يتلاشون كضباب الصباح وكالندى الذي يتبخر سريعا، أو كعصافة مذراة من البيدر، أو دخان متسرب من الكوة."]]}, {"l": "Mic 6:10-16", "n": "", "vs": [[10, "في بيوت الأشرار كنوز مسروقة وموازين مغشوشة."], [11, "فكيف أبرىء ذا المعايير المغشوشة، صاحب كيس الموازين الناقصة؟"], [12, "قد امتلأ أثرياء المدينة ظلما، ونطق سكانها بالكذب وألسنة الغش في أفواههم"], [13, "لذلك شرعت في تدميرك لأجعلك خرابا من أجل خطاياك."], [14, "ستأكلين ولا تشبعين، ويظل جوفك خاويا. وما تدخرينه تعجزين عن الاحتفاظ به. لأني أدفعه للسيف."], [15, "تزرعين ولا تحصدين. تعصرين الزيتون ولا تدهني بزيته، وتعصرين العنب ولا تشربين من خمره."], [16, "لأنك قد مارست فرائض عمري، ونهجت على غرار أخآب، وسلكت في مشوراتهم. لذلك أجعلك خرابا، وشعبك مثار سخرية، وتقاسون من احتقار الأمم."]]}], "kwAr": "الثلاث", "noteAr": ""}, {"kw": "because", "raw": "Amo_5:11, Amo_5:12, Amo_8:4-6; Isa_5:22, Isa_5:23, Isa_29:21; Joe_3:3, Joe_3:6; Mic_3:2, Mic_3:3", "note": "", "refs": [{"l": "Amo 5:11", "n": "", "vs": [[11, "فلأنكم تطأون المسكين وتبتزون منه رشوة قمح حتى تشيدوا بيوتا من حجارة منحوتة، فإنكم لن تسكنوا فيها، وتغرسوا كروما شهية ولكنكم لن تشربوا من خمرها."]]}, {"l": "Amo 5:12", "n": "", "vs": [[12, "لأنني عالم بكثرة معاصيكم وعظم خطاياكم، إذ أنكم تضايقون البار أيها المرتشون الذين تصدون المسكين عن حقه في ساحة القضاء."]]}, {"l": "Amo 8:4-6", "n": "", "vs": [[4, "استمعوا هذا أيها الدائسون على البائسين، يامن حاولتم أن تقضوا على فقراء الأرض،"], [5, "قائلين: «متى ينقضي أول الشهر حتى نبيع الحنطة؟ متى يمضي السبت لنعرض القمح في السوق، فنعمد إلى تصغير حجم مكيال الإيفة ونرفع الأسعار، ونستعمل ميزانا مغشوشا."], [6, "لنشتري المسكين بقطعة من الفضة، والبائس بنعلين، ونبيع نفاية القمح؟»"]]}, {"l": "Isa 5:22", "n": "", "vs": [[22, "ويل للعتاة في شرب الخمر والمتفوقين في مزج المسكر،"]]}, {"l": "Isa 5:23", "n": "", "vs": [[23, "الذين يبرئون المذنب بفضل الرشوة، وينكرون على البريء حقه."]]}, {"l": "Isa 29:21", "n": "", "vs": [[21, "الذين بكلمة جعلوا الإنسان يخطيء، ونصبوا فخا لمن يفحمهم في ساحة القضاء، وصدوا البار بادعاءاتهم الجوفاء."]]}, {"l": "Joe 3:3", "n": "", "vs": [[3, "وألقوا القرعة على شعبي فقايضوا الزانية بالصبي، وباعوا الصبية لقاء شربة خمر."]]}, {"l": "Joe 3:6", "n": "", "vs": [[6, "وبعتم يهوذا وأبناء أورشليم إلى الأغارقة لتبعدوهم عن تخوم أرضهم."]]}, {"l": "Mic 3:2", "n": "", "vs": [[2, "أنتم يامن تبغضون الخير وتحبون الشر، وتسلخون جلود شعبي وتجردون لحومهم عن عظامهم."]]}, {"l": "Mic 3:3", "n": "", "vs": [[3, "الذين تأكلون لحوم شعبي، وتسلخون جلودهم عنهم وتهشمون عظامهم، وتقطعونهم كما يقطع اللحم في القدر، أو كاللحم المعد للمقلى."]]}], "kwAr": "لأنهم باعوا", "noteAr": ""}], "arS": [["هذا", ["H3541"]], [" ما ", []], ["يقوله", ["H559"]], [" ", []], ["الرب", ["H3068"]], [": ", []], ["من", ["H5921"]], [" أجل ", []], ["معاصي", ["H6588"]], [" ", []], ["إسرائيل", ["H3478"]], [" ", []], ["الثلاث", ["H7969"]], [" ", []], ["والأربع", ["H702"]], [" لن ", []], ["أرد", ["H7725"]], [" عنهم سخطي، ", []], ["لأنهم", ["H5921"]], [" ", []], ["باعوا", ["H4376"]], [" ", []], ["الصديق", ["H6662"]], [" لقاء ", []], ["الفضة", ["H3701"]], ["، ", []], ["والبائس", ["H34"]], [" ", []], ["مقابل", ["H5668"]], [" ", []], ["نعلين", ["H5275"]], [".", []]]}, {"c": 2, "v": 7, "text": "الذين يسحقون رأس المسكين في التراب، ويجورون على البائسين، ويعاشر الرجل وابنه امرأة واحدة، فيتدنس بذلك اسمي المقدس.", "groups": [{"kw": "pant", "raw": "Amo_4:1; 1Ki_21:4; Pro_28:21; Mic_2:2, Mic_2:9, Mic_7:2, Mic_7:3; Zep_3:3", "note": "", "refs": [{"l": "Amo 4:1", "n": "", "vs": [[1, "اسمعي هذه الكلمة يانساء باشان، اللواتي يقمن في جبل السامرة، ممن يظلمن المسكين ويسحقن الفقراء واللواتي يقلن لأزواجهن: هاتوا مسكرا لنشرب."]]}, {"l": "1Ki 21:4", "n": "", "vs": [[4, "فدخل أخآب قصره مكتئبا مهموما متأثرا من قول نابوت اليزرعيلي: «لا أفرط في ميراث آبائي». واستلقى فوق سريره مشيحا بوجهه نحو الحائط عازفا عن الطعام."]]}, {"l": "Pro 28:21", "n": "", "vs": [[21, "المحاباة نقيصة، ومن أجل كسرة خبز يرتكب الإنسان الإساءة."]]}, {"l": "Mic 2:2", "n": "", "vs": [[2, "يشتهون حقولا ويغتصبونها، وبيوتا فيستولون عليها. يجورون على الرجل وعلى بيته والإنسان وميراثه."]]}, {"l": "Mic 2:9", "n": "", "vs": [[9, "تطردون أرامل شعبي من بيوتهن، وتجردون أطفال كل منهن من عطاياي إلى الأبد."]]}, {"l": "Mic 7:2", "n": "", "vs": [[2, "قد باد الصالح من الأرض واختفى المستقيم من بين الناس. جميعهم يكمنون لسفك الدماء، وكل واحد منهم يقتنص أخاه."]]}, {"l": "Mic 7:3", "n": ""
