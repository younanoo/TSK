"kwAr": "واشهدوا", "noteAr": ""}, {"kw": "the Lord", "raw": "Amo_5:27; Jos_22:22; Isa_1:24", "note": "", "refs": [{"l": "Amo 5:27", "n": "", "vs": [[27, "لذلك أسبيكم إلى ما وراء دمشق، يقول الرب الذي اسمه الإله القدير."]]}, {"l": "Jos 22:22", "n": "", "vs": [[22, "«إن الرب القدير هو إله كل الآلهة؛ إن الرب القدير هو إله كل الآلهة. هو يعلم، وعلى شعب إسرائيل أن يعلم أننا لم نبن المذبح تمردا عليه أو خيانة في حقه وإلا فليهلكنا هذا اليوم،"]]}, {"l": "Isa 1:24", "n": "", "vs": [[24, "لذلك يقول السيد رب الجنود، عزيز إسرائيل: «لأستريحن من مقاومي ولأنتقمن من أعدائي."]]}], "kwAr": "السيد الرب", "noteAr": ""}], "arS": [["اسمعوا", ["H8085"]], [" ", []], ["واشهدوا", ["H5749"]], [" على ", []], ["بيت", ["H1004"]], [" ", []], ["يعقوب", ["H3290"]], ["، ", []], ["يقول", ["H5002"]], [" ", []], ["السيد", ["H136"]], [" ", []], ["الرب", ["H3069"]], [" ", []], ["الإله", ["H430"]], [" ", []], ["القدير", ["H6635"]], [".", []]]}, {"c": 3, "v": 14, "text": "في ذلك اليوم الذي أعاقب فيه إسرائيل على تعدياته، أهدم أيضا مذابح بيت إيل، وتقطع قرون المذبح وتتهاوى على الأرض.", "groups": [{"kw": "in the", "raw": "Exo_32:34", "note": "", "refs": [{"l": "Exo 32:34", "n": "", "vs": [[34, "والآن اذهب، وقد الشعب إلى المكان الذي ذكرته لك. وها هو ملاكي يتقدمك، ولكن لابد من معاقبة الشعب على خطيئتهم في يوم قضائي»."]]}], "kwAr": "في ذلك اليوم", "noteAr": ""}, {"kw": "visit the transgressions of Israel upon him", "raw": "or, punish Israel for his transgressions", "note": "or, punish Israel for his transgressions", "refs": [], "kwAr": "أعاقب فيه إسرائيل على تعدياته", "noteAr": "أو: «أعاقب إسرائيل على تعدياته»."}, {"kw": "I will", "raw": "Amo_9:1; 1Ki_13:2-5; 2Ki_23:15; 2Ch_31:1, 2Ch_34:6, 2Ch_34:7; Hos_10:5-8, Hos_10:14, Hos_10:15; Mic_1:6, Mic_1:7", "note": "", "refs": [{"l": "Amo 9:1", "n": "", "vs": [[1, "ورأيت السيد واقفا إلى جوار المذبح قائلا: «اضرب تيجان الأعمدة حتى تهتز العتبات، وحطمها على رؤوس جميع الشعب. ومن ينجو منهم أهلكه بالسيف، فلا يهرب منهم أحد ولا يفلت منهم ناج."]]}, {"l": "1Ki 13:2-5", "n": "", "vs": [[2, "وهتف مخاطبا المذبح بقضاء الرب قائلا: «يامذبح، يامذبح، هذا ما يقوله الرب: سيولد لبيت داود ابن يدعى يوشيا، فيذبح عليك كهنة المرتفعات الذين يقربون عليك، وتحرق فوقك عظام الناس»."], [3, "وتأييدا لكلامه أعطى في ذلك اليوم علامة تؤكد أن الرب هو الذي تكلم، وقال: «هوذا المذبح ينشق ويذرى الرماد الذي عليه»."], [4, "فلما سمع الملك كلام رجل الله الذي خاطب به المذبح في بيت إيل، رفع يده من على المذبح، ومدها نحو النبي صارخا: «اقبضوا عليه» فيبست يده التي مدها وعجز عن ردها."], [5, "وانشق آنئذ المذبح وذري الرماد من عليه وفقا للعلامة التي أعطاها رجل الله بمقتضى أمر الرب."]]}, {"l": "2Ki 23:15", "n": "", "vs": [[15, "وكذلك هدم المذبح الذي شيده يربعام بن نباط في مرتفعة بيت إيل، واستغوى بذلك الإسرائيليين فأخطأوا. ثم أحرق المذبح وسحق المرتفعة، حتى تحولت إلى غبار، وأحرق عمود الصنم."]]}, {"l": "2Ch 31:1", "n": "", "vs": [[1, "وبعد أن تم الاحتفال، اندفع كل الإسرائيليين الحاضرين إلى مدن يهوذا وحطموا الأنصاب وقطعوا تماثيل عشتاروث، وهدموا المرتفعات والمذابح في كل يهوذا وبنيامين، وفي أرض أفرايم ومنسى حتى استأصلوها. ثم رجع كل واحد إلى بيته في مدينته."]]}, {"l": "2Ch 34:6", "n": "", "vs": [[6, "وكذلك فعل في مدن أسباط منسى وأفرايم وشمعون حتى نفتالي وخرائبها المحيطة بها،"]]}, {"l": "2Ch 34:7", "n": "", "vs": [[7, "فهدم السواري ودق الأصنام ناعما وحطم تماثيل الشمس في كل أرض إسرائيل ثم رجع إلى أورشليم."]]}, {"l": "Hos 10:5-8", "n": "", "vs": [[5, "يخشى أهل السامرة على عجل بيت آون، لأن شعبه يعولون عليه، وكذلك كهنته الخونة الذين ابتهجوا ببهائه الذي سلب منه."], [6, "سيحمل هذا العجل إلى أشور هدية للملك العظيم، فيخزى أفرايم ويعتري إسرائيل الخجل من اتكاله عليه."], [7, "يهلك ملك السامرة كقشة عائمة على وجه المياه."], [8, "وتدمر أماكن العبادة على مشارف آون التي أضحت خطيئة إسرائيل، وينمو الشوك والحسك على مذابحهم، فيقولون للجبال: غطينا، وللتلال: اسقطي علينا."]]}, {"l": "Hos 10:14", "n": "", "vs": [[14, "لذلك يدوي زئير المعركة بين شعبك، وتدمر جميع حصونك كما دمر شلمان بيت أربئيل في يوم القتال إذ أصبحت الأم مع أولادها حطاما."]]}, {"l": "Hos 10:15", "n": "", "vs": [[15, "هذا ما يجري عليكم يابيت إسرائيل عقابا لكم على إثمكم العظيم، ويتم القضاء على ملك إسرائيل عند انبلاج الفجر."]]}, {"l": "Mic 1:6", "n": "", "vs": [[6, "لذلك سأجعل السامرة كومة حجارة في الحقل ومغرسا للكروم، وأقذف بحجارتها إلى الوادي، وأعري أساساتها."]]}, {"l": "Mic 1:7", "n": "", "vs": [[7, "فتتحطم كل أصنامها، وتحرق كل تقدمات زناها بالنار، وأدمر جميع تماثيلها لأنها جمعتها من أجرة زانية، وإلى زانية يكون مآلها."]]}], "kwAr": "أهدم", "noteAr": ""}], "arS": [["في ذلك ", []], ["اليوم", ["H3117"]], [" الذي ", []], ["أعاقب", ["H6485"]], [" فيه ", []], ["إسرائيل", ["H3478"]], [" على ", []], ["تعدياته", ["H6588"]], ["، ", []], ["أهدم", ["H6485", "H5921"]], [" أيضا ", []], ["مذابح", ["H4196"]], [" بيت ", []], ["إيل", ["H1008"]], ["، ", []], ["وتقطع", ["H1438"]], [" ", []], ["قرون", ["H7161"]], [" ", []], ["المذبح", ["H4196"]], [" ", []], ["وتتهاوى", ["H5307"]], [" على ", []], ["الأرض", ["H776"]], [".", []]]}, {"c": 3, "v": 15, "text": "وأدمر البيوت التي يأوون إليها في الشتاء، وبيوت المنتجعات الصيفية، وتندك بيوت العاج وتزول من الوجود قصور كثيرة، يقول الرب.", "groups": [{"kw": "the winter", "raw": "Jer_36:22", "note": "", "refs": [{"l": "Jer 36:22", "n": "", "vs": [[22, "وكان ذلك في الشهر التاسع، والملك آنذاك جالس في حجر ته الشتوية يستدفيء على نار كانون متأجج أمامه."]]}], "kwAr": "الشتاء", "noteAr": ""}, {"kw": "the summer", "raw": "Jdg_3:20", "note": "", "refs": [{"l": "Jdg 3:20", "n": "", "vs": [[20, "«لدي كلام سر لأبلغك إياه أيها الملك». فصرف الملك كل الموجودين بمجلسه لينفرد بإهود"]]}], "kwAr": "الصيفية", "noteAr": ""}, {"kw": "the houses", "raw": "1Ki_22:39", "note": "", "refs": [{"l": "1Ki 22:39", "n": "", "vs": [[39, "أما بقية أخبار أخآب وإنجازاته وبيت العاج الذي بناه، وكل المدن التي عمرها، أليست هي مدونة في تاريخ أخبار أيام ملوك إسرائيل؟"]]}], "kwAr": "بيوت العاج", "noteAr": ""}, {"kw": "the great", "raw": "Amo_3:11, Amo_6:11; Isa_5:9", "note": "", "refs": [{"l": "Amo 3:11", "n": "", "vs": [[11, "لذلك يعلن الرب الإله: سيجتاح العدو البلاد، ويحيل حصونكم حطاما وينهب قصوركم."]]}, {"l": "Amo 6:11", "n": "", "vs": [[11, "لأنه ها الرب يأمر، فيهدم البيت الكبير فيصير ركاما، والبيت الصغير حطاما."]]}, {"l": "Isa 5:9", "n": "", "vs": [[9, "سمعت الرب القدير يقول: «البيوت العظيمة لابد أن تصبح خرابا، والمنازل الفخمة تغدو مهجورة."]]}], "kwAr": "كثيرة", "noteAr": ""}], "arS": [["وأدمر", ["H5221"]], [" ", []], ["البيوت", ["H1004"]], [" التي يأوون إليها في ", []], ["الشتاء", ["H2779"]], ["، وبيوت المنتجعات ", []], ["الصيفية", ["H7019"]], ["، ", []], ["وتندك", ["H6"]], [" ", []], ["بيوت", ["H1004"]], [" ", []], ["العاج", ["H8127"]], [" ", []], ["وتزول", ["H5486"]], [" من الوجود ", []], ["قصور", ["H1004"]], [" ", []], ["كثيرة", ["H7227"]], ["، ", []], ["يقول", ["H5002"]], [" ", []], ["الرب", ["H3068"]], [".", []]]}, {"c": 4, "v": 1, "text": "اسمعي هذه الكلمة يانساء باشان، اللواتي يقمن في جبل السامرة، ممن يظلمن المسكين ويسحقن الفقراء واللواتي يقلن لأزواجهن: هاتوا مسكرا لنشرب.", "groups": [{"kw": "ye kine", "raw": "By the kine of Bashan, some understand the proud, luxurious matrons of Israel; but it is probable the prophet speaks catachrestically, and means the wealthy, effeminate, and profligate rulers and nobles of Samaria. Deu_32:14, Deu_32:15; Psa_22:12; Jer_50:11, Jer_50:27; Eze_39:18", "note": "By the kine of Bashan, some understand the proud, luxurious matrons of Israel; but it is probable the prophet speaks catachrestically, and means the wealthy, effeminate, and profligate rulers and nobles of Samaria. Deu_32:14, Deu_32:15; Psa_22:12; Jer_50:11, Jer_50:27; Eze_39:18", "refs": [{"l": "Deu 32:14", "n": "", "vs": [[14, "وزبدة البقر ولبن الغنم وشحم خراف وتيوس وخيار كباش باشان، وأفضل لب الحنطة، وسقاهم دم العنب القاني."]]}, {"l": "Deu 32:15", "n": "", "vs": [[15, "فسمن بنو إسرائيل ورفسوا، سمنوا وغلظوا واكتسوا شحما، فرفضوا الإله صانعهم وتنكروا لصخرة خلاصهم."]]}, {"l": "Psa 22:12", "n": "", "vs": [[12, "حاصرني أعداء أقوياء، كأنهم ثيران باشان القوية."]]}, {"l": "Jer 50:11", "n": "", "vs": [[11, "لأنكم تبتهجون وتطفرون غبطة يا ناهبي شعبي، وتمرحون كعجلة فوق العشب وتصهلون كالخيل."]]}, {"l": "Jer 50:27", "n": "", "vs": [[27, "اذبحوا جميع ثيرانها، أحضروها للذبح. ويل لهم لأن يوم موعد عقابهم قد حان."]]}, {"l": "Eze 39:18", "n": "", "vs": [[18, "تأكلين لحم الجبابرة وترتوين من دماء رؤساء الأرض وكأنها كباش وحملان وتيوس وعجول كلها من قطعان باشان السمينة."]]}], "kwAr": "يانساء باشان", "noteAr": "يفهم بعضهم من «بقر باشان» سيدات إسرائيل المتكبرات المترفات، لكن الأرجح أن النبي يتكلم مجازا ويقصد الحكام والأشراف الأثرياء المخنثين الفاسدين في السامرة. انظر تث 32: 14، 15؛ مز 22: 12؛ إر 50: 11، 27؛ حز 39: 18"}, {"kw": "the mountain", "raw": "Amo_6:1; 1Ki_16:24", "note": "", "refs": [{"l": "Amo 6:1", "n": "", "vs": [[1, "ويل للمترفين في صهيون والمطمئنين في جبل السامرة، نبلاء طليعة الأمم الذين يتوافد إليهم شعب إسرائيل."]]}, {"l": "1Ki 16:24", "n": "", "vs": [[24, "ثم اشترى جبل السامرة من شامر بوزنتين من الفضة (نحو اثنين وسبعين كيلوجراما)، وبنى عليه مدينة دعاها السامرة، على اسم شامر صاحب الجبل."]]}], "kwAr": "جبل السامرة", "noteAr": ""}, {"kw": "which oppress", "raw": "Amo_2:6, Amo_2:7, Amo_3:9, Amo_3:10, Amo_5:11, Amo_8:4-6; Exo_22:21-25; Deu_15:9-11; Psa_12:5, Psa_140:12; Pro_22:22, Pro_22:23, Pro_23:10,Pro_23:11; Ecc_4:1, Ecc_5:8; Isa_1:17-24, Isa_5:8, Isa_58:6; Jer_5:26-29, Jer_6:6, Jer_7:6; Eze_22:7, Eze_22:12, Eze_22:27, Eze_22:29; Mic_2:1-3, Mic_3:1-3; Zec_7:10,Zec_7:11; Mal_3:5; Jam_5:1-6", "note": "", "refs": [{"l": "Amo 2:6", "n": "", "vs": [[6, "هذا ما يقوله الرب: من أجل معاصي إسرائيل الثلاث والأربع لن أرد عنهم سخطي، لأنهم باعوا الصديق لقاء الفضة، والبائس مقابل نعلين."]]}, {"l": "Amo 2:7", "n": "", "vs": [[7, "الذين يسحقون رأس المسكين في التراب، ويجورون على البائسين، ويعاشر الرجل وابنه امرأة واحدة، فيتدنس بذلك اسمي المقدس."]]}, {"l": "Amo 3:9", "n": "", "vs": [[9, "أذيعوا في حصون أشدود وفي حصون ديار مصر وقولوا: احتشدوا على جبال السامرة، واشهدوا ما في وسطها من جلبة، وانظروا إلى المظلومين في داخلها."]]}, {"l": "Amo 3:10", "n": "", "vs": [[10, "فهؤلاء الذين يكنزون الجور والنهب في قصورهم لا يعرفون التصرف باستقامة، يقول الرب."]]}, {"l": "Amo 5:11", "n": "", "vs": [[11, "فلأنكم تطأون المسكين وتبتزون منه رشوة قمح حتى تشيدوا بيوتا من حجارة منحوتة، فإنكم لن تسكنوا فيها، وتغرسوا كروما شهية ولكنكم لن تشربوا من خمرها."]]}, {"l": "Amo 8:4-6", "n": "", "vs": [[4, "استمعوا هذا أيها الدائسون على البائسين، يامن حاولتم أن تقضوا على فقراء الأرض،"], [5, "قائلين: «متى ينقضي أول الشهر حتى نبيع الحنطة؟ متى يمضي السبت لنعرض القمح في السوق، فنعمد إلى تصغير حجم مكيال الإيفة ونرفع الأسعار، ونستعمل ميزانا مغشوشا."], [6, "لنشتري المسكين بقطعة من الفضة، والبائس بنعلين، ونبيع نفاية القمح؟»"]]}, {"l": "Exo 22:21-25", "n": "", "vs": [[21, "لا تضطهد غريبا ولا تضايقه، فقد كنتم غرباء في ديار مصر."], [22, "لا تسيء إلى أرملة أو يتيم،"], [23, "لأ نك إن أسأت إليهما وصرخا إلي أسمع صراخهما،"], [24, "فيحتدم غضبي وأقتلكم بالسيف، فتصبح زوجاتكم أرامل وأولادكم يتامى."], [25, "إن أقرضت فقيرا من شعبي المقيم عندك فلا تعامله كالمرابي، ولا تتقاض منه فائدة."]]}, {"l": "Deu 15:9-11", "n": "", "vs": [[9, "إياكم أن تحدثوا قلوبكم بخبث قائلين: ها قد قربت السنة السابعة، سنة الإبراء من الديون فيسوء الأمر في أعينكم وتمتنعون عن إقراضه. فإن فعلتم هذا فإنه يستغيث بالرب عليكم، فتصبحون مذنبين في حكم الرب."], [10, "أقرضوه عن طيب خاطر، لأنه من أجل هذا يبارككم الرب إلهكم في كل أعمالكم وما تنتجه أيديكم،"], [11, "فالأرض لن تخلو أبدا من الفقراء، لهذا أوصيكم أن تسخوا على أخيكم المسكين والفقير المقيم في أرضكم."]]}, {"l": "Psa 12:5", "n": "", "vs": [[5, "ولكن الرب يقول: إنقاذا للمساكين، واستجابة لتنهدات المظلومين، أهب الآن لأفرج كربة المتضايقين."]]}, {"l": "Psa 140:12", "n": "", "vs": [[12, "قد علمت أن الرب ينصف دعوى المساكين ويحكم بالحق للمحتاجين."]]}, {"l": "Pro 22:22", "n": "", "vs": [[22, "لا تسلب الفقير لأنه فقير، ولا تسحق البائس الماثل عند الباب،"]]}, {"l": "Pro 22:23", "n": "", "vs": [[23, "لأن الرب يدافع عن دعواهم، ويهلك ناهبيهم."]]}, {"l": "Pro 23:10", "n": "", "vs": [[10, "لا تنقل معالم تخم قديم، ولا تدخل حقول الأيتام،"]]}, {"l": "Pro 23:11", "n": "", "vs": [[11, "لأن وليهم قادر، وهو يدافع عن دعواهم ضدك."]]}, {"l": "Ecc 4:1", "n": "", "vs": [[1, "ثم تأملت حولي فرأيت جميع المظالم التي ترتكب تحت الشمس. شهدت دموع المظلومين الذين لا معزي لهم، أما ظالموهم فيتمتعون بالقوة، غير أن المظلومين لا معزي لهم."]]}, {"l": "Ecc 5:8", "n": "", "vs": [[8, "إن شهدت في البلاد الفقير مظلوما، والحق والعدل مزهوقين فلا تعجب من الأمر، فإن فوق المسئول الكبير مسئولا أعلى منه رتبة يراقبه وفوقهما من هو أعظم مقاما منهما."]]}, {"l": "Isa 1:17-24", "n": "", "vs": [[17, "وتعلموا الإحسان، انشدوا الحق، انصفوا المظلوم، اقضوا لليتيم، ودافعوا عن الأرملة."], [18, "تعالوا نتحاجج يقول الرب، إن كانت خطاياكم كلطخات قرمزية فإنها تبيض كالثلج، وإن كانت حمراء كصبغ الدودي تصبح في نقاء الصوف!"], [19, "إن شئتم وأطعتم تتمتعون بخيرات الأرض،"], [20, "ولكن إن أبيتم وتمردتم فالسيف يلتهمكم، لأن فم الرب قد تكلم."], [21, "كيف صارت المدينة الأمينة عاهرة؟ كانت تفيض حقا، ويأوي إليها العدل، فأصبحت وكرا للمجرمين."], [22, "صارت فضتك مزيفة، وخمرك مغشوشة بماء."], [23, "أصبح رؤساؤك عصاة وشركاء لصوص، يولعون بالرشوة ويسعون وراء الهبات، لا يدافعون عن اليتيم، ولا ترفع إليهم دعوى الأرملة»."], [24, "لذلك يقول السيد رب الجنود، عزيز إسرائيل: «لأستريحن من مقاومي ولأنتقمن من أعدائي."]]}, {"l": "Isa 5:8", "n": "", "vs": [[8, "اشتريتم البيوت والحقول حتى لم يبق لأحد غيركم مكان يسكن فيه! صارت الأرض لكم وحدكم!"]]}, {"l": "Isa 58:6", "n": "", "vs": [[6, "أليس الصوم الذي أختاره يكون في فك قيود الشر، وحل عقد النير، وإطلاق سراح المتضايقين، وتحطيم كل نير؟"]]}, {"l": "Jer 5:26-29", "n": "", "vs": [[26, "ففي وسط شعبي قوم أشرار يكمنون كما يكمن القناصون للطيور، وينصبون الفخ لاقتناص الناس."], [27, "بيوتهم تكتظ بالخديعة كقفص مملوء طيورا، لذلك عظموا وأثروا."], [28, "ازدادوا سمنا ونعومة، وارتكبوا الشر متجاوزين كل حد. لم يحكموا بعدل في دعوى اليتيم حتى تنجح، ولم يدافعوا عن حقوق المساكين."], [29, "أفلا أعاقبهم على هذه الأمور؟» يقول الرب. ألا أنتقم لنفسي من أمة كهذه؟"]]}, {"l": "Jer 6:6", "n": "", "vs": [[6, "لأن هذا ما يعلنه الرب القدير: «اقطعوا الشجر، وأقيموا مترسة حول أورشليم، إذ يجب أن تعاقب هذه المدينة، لأن داخلها مفعم بالظلم."]]}, {"l": "Jer 7:6", "n": "", "vs": [[6, "إن لم تجوروا على الغريب واليتيم والأرملة، ولم تسفكوا دما بريئا في هذا الموضع، وإن لم تضلوا وراء الأوثان مسيئين بذلك لأنفسكم،"]]}, {"l": "Eze 22:7", "n": "", "vs": [[7, "فيك استخفوا بأب وأم وجاروا في وسطك على الغريب، واضطهدوا اليتيم والأرملة،"]]}, {"l": "Eze 22:12", "n": "", "vs": [[12, "فيك أخذوا الرشوة لقاء سفك الدماء. أخذت الربا ومال الحرام، وسلبت أقرباءك ظلما ونسيتني، يقول السيد الرب."]]}, {"l": "Eze 22:27", "n": "", "vs": [[27, "رؤساؤها فيها كذئاب خاطفة تمزق فرائسها إذ يسفكون دماء الناس في سبيل الربح الحرام."]]}, {"l": "Eze 22:29", "n": "", "vs": [[29, "أفرطوا في ظلم شعب الأرض واغتصبوا سالبين، واضطهدوا الفقير والمسكين، وظلموا الغريب جورا."]]}, {"l": "Mic 2:1-3", "n": "", "vs": [[1, "ويل للمتآمرين بالسوء، الذين يحوكون الشر وهم في مضاجعهم، الذين ينفذون عند طلوع الصباح ما خططوا له، لأن ذلك في متناول قدرتهم."], [2, "يشتهون حقولا ويغتصبونها، وبيوتا فيستولون عليها. يجورون على الرجل وعلى بيته والإنسان وميراثه."], [3, "لهذا، هكذا يقول الرب. ها أنا أدبر شرا لهذا الشعب تعجزون عن فك رقابكم منه، ولن تمشوا بعد متشامخين لأن الزمن يكون زمن سوء."]]}, {"l": "Mic 3:1-3", "n": "", "vs": [[1, "وقلت اسمعوا يارؤساء يعقوب وياقضاة شعب إسرائيل: ألا ينبغي لكم أن تعرفوا الحق؟"], [2, "أنتم يامن تبغضون الخير وتحبون الشر، وتسلخون جلود شعبي وتجردون لحومهم عن عظامهم."], [3, "الذين تأكلون لحوم شعبي، وتسلخون جلودهم عنهم وتهشمون عظامهم، وتقطعونهم كما يقطع اللحم في القدر، أو كاللحم المعد للمقلى."]]}, {"l": "Zec 7:10", "n": "", "vs": [[10, "ولا تجوروا على الأرملة واليتيم والغريب والمسكين، ولا يضمر أحدكم شرا في قلبه لأخيه."]]}, {"l": "Zec 7:11", "n": "", "vs": [[11, "ولكنهم أبوا أن يصغوا، واعتصموا بعنادهم غير عابئين، وأصموا آذانهم لئلا يسمعوا."]]}, {"l": "Mal 3:5", "n": "", "vs": [[5, "وأقترب منكم لأكون شاهدا سريعا ضد السحرة والزناة والحالفين بالزور والمستغلين لأجرة العامل ومضطهدي الأرامل والأيتام، والذين يظلمون الغرباء ولا يخافونني"]]}, {"l": "Jam 5:1-6", "n": "", "vs": [[1, "أيها الأغنياء، هيا الآن ابكوا مولولين بسبب ما ينتظركم من أهوال وشقاء."], [2, "إن ثرواتكم الكثيرة قد فسدت، وثيابكم الفاخرة قد أكلها العث"], [3, "ذهبكم وفضتكم قد تآكلا، وسيكون تآكلهما شاهدا ضدكم، ويأكل لحمكم كنار جمعتموها ثروة للأيام الأخيرة؟"], [4, "وهذه أجرة العمال الذين حصدوا حقولكم، تلك الأجرة التي مازلتم تحبسونها عنهم ظلما، إنها تصرخ، وصراخ أولئك العمال أنفسهم قد سمعه رب الجنود!"], [5, "أنتم تعيشون على الأرض عيشة رفاهية وانصراف إلى المباهج واللذات؛ وقد أصبحت قلوبكم سمينة كأنها جاهزة ليوم الذبح."], [6, "والبريء حكمتم عليه وقتلتموه، وهو لا يقاومكم!"]]}], "kwAr": "يظلمن", "noteAr": ""}, {"kw": "crush", "raw": "Deu_28:33; Job_20:19 *marg. Jer_51:34", "note": "", "refs": [{"l": "Deu 28:33", "n": "", "vs": [[33, "محصول أرضك وثمر تعبك يأكله شعب غريب عنك، ولا تكون سوى مظلوم مسحوق دائما."]]}, {"l": "Job 20:19", "n": "*marg.", "vs": [[19, "لأنه هضم حق الفقراء وخذلهم وسلب بيوتا لم يبنها."]]}, {"l": "Jer 51:34", "n": "", "vs": [[34, "«يقول المسبيون: قد افترسنا نبوخذناصر ملك بابل وسحقنا وجعلنا إناء فارغا. ابتلعنا كتنين، وملأ جوفه من أطايبنا، ثم لفظنا من فمه."]]}], "kwAr": "ويسحقن", "noteAr": ""}, {"kw": "Bring", "raw": "Amo_2:8; Joe_3:3", "note": "", "refs": [{"l": "Amo 2:8", "n": "", "vs": [[8, "يرقدون إلى جوار المذبح فوق ثياب مرهونة، ويشربون في هيكل إلههم خمر المغرمين."]]}, {"l": "Joe 3:3", "n": "", "vs": [[3, "وألقوا القرعة على شعبي فقايضوا الزانية بالصبي، وباعوا الصبية لقاء شربة خمر."]]}], "kwAr": "هاتوا", "noteAr": ""}], "arS": [["اسمعي", ["H8085"]], [" هذه ", []], ["الكلمة", ["H1697"]], [" ", []], ["يانساء", ["H6510"]], [" ", []], ["باشان", ["H1316"]], ["، اللواتي يقمن في ", []], ["جبل", ["H2022"]], [" ", []], ["السامرة", ["H8111"]], ["، ممن ", []], ["يظلمن", ["H6231"]], [" ", []], ["المسكين", ["H1800"]], [" ", []], ["ويسحقن", ["H7533"]], [" ", []], ["الفقراء", ["H34"]], [" واللواتي يقلن ", []], ["لأزواجهن", ["H113"]], [": ", []], ["هاتوا", ["H935"]], [" مسكرا ", []], ["لنشرب", ["H8354"]], [".", []]]}, {"c": 4, "v": 2, "text": "قد أقسم السيد الرب بقداسته قائلا: ها أيام تقبل عليكن، يجركن فيها العدو بالكلاليب وذريتكن بشصوص السمك.", "groups": [{"kw": "", "raw": "Psa_89:35", "note": "", "refs": [{"l": "Psa 89:35", "n": "", "vs": [[35, "فقد أقسمت بقداستي مرة، ولا أكذب على داود:"]]}], "kwAr": "", "noteAr": ""}, {"kw": "hath sworn", "raw": "Amo_6:8", "note": "", "refs": [{"l": "Amo 6:8", "n": "", "vs": [[8, "ويقول الرب القدير: قد أقسمت بذاتي، أن أمقت زهو يعقوب، وأبغض قصوره، فأسلم المدينة بكل ما فيها."]]}], "kwAr": "أقسم", "noteAr": ""}, {"kw": "he will", "raw": "Isa_37:29; Jer_16:16; Eze_39:4, Eze_39:5; Hab_1:15, Hab_1:16", "note": "", "refs": [{"l": "Isa 37:29", "n": "", "vs": [[29, "ولأن ثورتك علي وعجرفتك قد بلغتا مسامعي، فإني سأشكمك بخزامتي في أنفك، وأضع لجامي في فمك، وأعيدك في نفس الطريق الذي أقبلت منه."]]}, {"l": "Jer 16:16", "n": "", "vs": [[16, "ها أنا أرسل صيادين كثيرين، ليصطادوهم، ثم أبعث بقناصين كثيرين ليقتنصوهم من كل جبل ومن كل رابية ومن شقوق الصخور."]]}, {"l": "Eze 39:4", "n": "", "vs": [[4, "فتتهاوى أنت وجميع جيوشك وسائر حلفائك الذين معك على جبال إسرائيل، وأجعلك قوتا لكل أصناف الطيور الجارحة ولوحوش البرية."]]}, {"l": "Eze 39:5", "n": "", "vs": [[5, "فتصرع على وجه الصحراء، لأني قضيت يقول السيد الرب."]]}, {"l": "Hab 1:15", "n": "", "vs": [[15, "إن الكلدانيين يستخرجونهم بالشصوص، ويصطادونهم بالشبكة، ويجمعونهم في مصيدتهم متهللين فرحين."]]}, {"l": "Hab 1:16", "n": "", "vs": [[16, "لهذا هم يقربون ذبائح لشباكهم، ويحرقون بخورا لمصائدهم، لأنهم بفضلها يتمتعون بالرفاهية ويتلذذون بأطايب الطعام."]]}], "kwAr": "يجركن", "noteAr": ""}], "arS": [["قد ", []], ["أقسم", ["H7650"]], [" ", []], ["السيد", ["H136"]], [" ", []], ["الرب", ["H3069"]], [" ", []], ["بقداسته", ["H6944"]], [" قائلا: ها ", []], ["أيام", ["H3117"]], [" ", []], ["تقبل", ["H935"]], [" عليكن، ", []], ["يجركن", ["H5375", "H853"]], [" فيها العدو ", []], ["بالكلاليب", ["H6793"]], [" ", []], ["وذريتكن", ["H319"]], [" ", []], ["بشصوص", ["H5518", "H1729"]], [" السمك.", []]]}, {"c": 4, "v": 3, "text": "وتخرج كل واحدة منكن من شق، زاحفة على وجهها، وتطردن إلى هرمون، يقول الرب.", "groups": [{"kw": "ye shall go", "raw": "2Ki_25:4; Eze_12:5, Eze_12:12", "note": "", "refs": [{"l": "2Ki 25:4", "n": "", "vs": [[4, "وفي تلك الليلة فتح صدقيا ورجاله ثغرة في سور المدينة، وتسلل مع رجاله المحاربين من خلال البوابة القائمة بين السورين نحو حديقة الملك. وكان الكلدانيون محيطين بالمدينة. فتوجه صدقيا ومقاتلوه إلى طريق الصحراء."]]}, {"l": "Eze 12:5", "n": "", "vs": [[5, "انقب لك حائطا أمام عيونهم واخرج منه."]]}, {"l": "Eze 12:12", "n": "", "vs": [[12, "ويحمل الرئيس المتولي شؤونهم أحماله على كتفه في العتمة ويخرج. وتنقب له ثغرة في الحائط ليخرج منها وهو يغطي وجهه لئلا يرى الأرض بعينيه."]]}], "kwAr": "وتخرج", "noteAr": ""}, {"kw": "them into the palace", "raw": "or, away the things of the palace, 2Ki_7:7, 2Ki_7:8, 2Ki_7:15; Isa_2:20, Isa_31:7; Zep_1:18; Mat_16:26", "note": "or, away the things of the palace, 2Ki_7:7, 2Ki_7:8, 2Ki_7:15; Isa_2:20, Isa_31:7; Zep_1:18; Mat_16:26", "refs": [{"l": "2Ki 7:7", "n": "", "vs": [[7, "ففروا هاربين عند المساء، مخلفين وراءهم خيامهم وخيولهم وحميرهم، تاركين المعسكر على حاله، وفروا ناجين بأنفسهم."]]}, {"l": "2Ki 7:8", "n": "", "vs": [[8, "ودخل هؤلاء البرص إحدى الخيام في أطراف المعسكر، فأكلوا وشربوا واستولوا على ما فيها من فضة وذهب وثياب، ثم طمروها. ورجعوا ودخلوا إلى خيمة أخرى واستولوا على ما فيها أيضا وطمروه."]]}, {"l": "2Ki 7:15", "n": "", "vs": [[15, "فاقتفوا أثرهم إلى نهر الأردن، وإذا كل الطريق مملوءة ثيابا وأمتعة مما طرحها الأراميون عند فرارهم المفاجيء السريع. فرجع الرسل وأخبروا الملك."]]}, {"l": "Isa 2:20", "n": "", "vs": [[20, "في ذلك اليوم يطرح الناس للجرذان والخفافيش أوثانهم الفضية وأصنامهم الذهبية التي صنعوها ليعبدوها،"]]}, {"l": "Isa 31:7", "n": "", "vs": [[7, "لأنه في ذلك اليوم ينبذ كل واحد أصنامه الفضية وأوثانه الذهبية التي صنعها بيده الخاطئة."]]}, {"l": "Zep 1:18", "n": "", "vs": [[18, "لا ينقذهم ذهبهم ولا فضتهم في يوم غضب الرب، إذ بنار غيرته تلتهم كل الأرض، وفيه يضع نهاية مباغتة كاملة سريعة لكل سكان المعمورة»."]]}, {"l": "Mat 16:26", "n": "", "vs": [[26, "فماذا ينتفع الإنسان لو ربح العالم كله وخسر نفسه؟ أو ماذا يقدم الإنسان فداء عن نفسه؟"]]}], "kwAr": "وتطردن إلى هرمون", "noteAr": "أو: «ما في القصر بعيدا». انظر 2مل 7: 7، 8، 15؛ إش 2: 20؛ 31: 7؛ صف 1: 18؛ مت 16: 26"}], "arS": [["وتخرج", ["H3318"]], [" كل ", []], ["واحدة", ["H802"]], [" منكن من ", []], ["شق", ["H6556"]], ["، زاحفة على ", []], ["وجهها", ["H5048"]], ["، ", []], ["وتطردن", ["H7993"]], [" إلى ", []], ["هرمون", ["H2038"]], ["، ", []], ["يقول", ["H5002"]], [" ", []], ["الرب", ["H3068"]], [".", []]]}, {"c": 4, "v": 4, "text": "تعالوا إلى بيت إيل وارتكبوا المعاصي، وأقبلوا إلى الجلجال وكثروا ذنوبكم. قر بوا ذبائحكم في كل صباح، وعشوركم كل ثلاثة أيام.", "groups": [{"kw": "Come", "raw": "A bitter irony and sarcasm, addressed to the idolatrous Israelites. Amo_3:14; Ecc_11:9; Eze_20:39; Joe_3:9-12; Mat_23:32, Mat_26:45; Mar_14:41", "note": "A bitter irony and sarcasm, addressed to the idolatrous Israelites. Amo_3:14; Ecc_11:9; Eze_20:39; Joe_3:9-12; Mat_23:32, Mat_26:45; Mar_14:41", "refs": [{"l": "Amo 3:14", "n": "", "vs": [[14, "في ذلك اليوم الذي أعاقب فيه إسرائيل على تعدياته، أهدم أيضا مذابح بيت إيل، وتقطع قرون المذبح وتتهاوى على الأرض."]]}, {"l": "Ecc 11:9", "n": "", "vs": [[9, "افرح أيها الشاب في حداثتك، وليمتعك قلبك في أيام شبابك، واتبع أهواء قلبك، وكل ما تشهده عيناك. ولكن اعلم أنه بسبب هذه الأمور كلها يأتي الله بك إلى كرسي القضاء."]]}, {"l": "Eze 20:39", "n": "", "vs": [[39, "أما أنتم ياشعب إسرائيل فامضوا وليعبد كل إنسان أصنامه، ولكن فيما بعد، ستستمعون حتما لي، ولن تدنسوا اسمي القدوس بعد بعطاياكم وأوثانكم."]]}, {"l": "Joe 3:9-12", "n": "", "vs": [[9, "نادوا بهذا بين الأمم، وتأهبوا للحرب. احشدوا أبطالكم. ليتقدم ويصعد جميع رجال القتال."], [10, "أطرقوا سكك محاريثكم وحولوها إلى سيوف، ومناجلكم إلى رماح، وليقل الضعيف: إنني جبار قتال!"], [11, "أسرعوا وتعالوا من كل ناحية يا كل الأمم، واجتمعوا هناك، وأنزل يارب محاربيك."], [12, "لتنهض الأمم وتقبل إلى وادي القضاء لأنني هناك أجلس لأدين الشعوب المتوافدة من كل جهة."]]}, {"l": "Mat 23:32", "n": "", "vs": [[32, "فأكملوا ما بدأه آباؤكم ليطفح الكيل!"]]}, {"l": "Mat 26:45", "n": "", "vs": [[45, "ثم رجع إلى تلاميذه وقال: «ناموا الآن واستريحوا! حانت الساعة، وسوف يسلم ابن الإنسان إلى أيدي الخاطئين."]]}, {"l": "Mar 14:41", "n": "", "vs": [[41, "ثم رجع في المرة الثالثة وقال لهم: «ناموا الآن واستريحوا. يكفي! أقبلت الساعة. ها إن ابن الإنسان يسلم إلى أيدي الخاطئين."]]}], "kwAr": "تعالوا", "noteAr": "سخرية مرة موجهة إلى الإسرائيليين الوثنيين. انظر عا 3: 14؛ جا 11: 9؛ حز 20: 39؛ يوء 3: 9-12؛ مت 23: 32؛ 26: 45؛ مر 14: 41"}, {"kw": "at Gilgal", "raw": "Amo_5:5; Hos_4:15, Hos_9:15, Hos_12:11", "note": "", "refs": [{"l": "Amo 5:5", "n": "", "vs": [[5, "لا تسعوا وراء بيت إيل، ولا تدخلوا الجلجال، ولا تعبروا إلى بئر سبع، لأن أهل الجلجال لابد أن يتم سبيهم، وبيت إيل تصبح عدما."]]}, {"l": "Hos 4:15", "n": "", "vs": [[15, "فإن كنت ياشعب إسرائيل زانيا، فلا تجعل يهوذا يأثم أو يذهب إلى الجلجال أو إلى بيت آون ولا يحلف قائلا: حي هو الرب."]]}, {"l": "Hos 9:15", "n": "", "vs": [[15, "في الجلجال ارتكبوا جميع شرورهم، فكرهتهم هناك. لسوء أعمالهم أطردهم من بيتي ولا أعود أحبهم، فكل رؤسائهم متمردون."]]}, {"l": "Hos 12:11", "n": "", "vs": [[11, "أفي جلعاد إثم؟ حتما قد انتهوا إلى بطل. إن ذبحوا في الجلجال ثيرانا لوثن، فإن مذابحهم تصير كركام حجارة في حقل محروث."]]}], "kwAr": "الجلجال", "noteAr": ""}, {"kw": "and bring", "raw": "Num_28:3, Num_28:4", "note": "", "refs": [{"l": "Num 28:3", "n": "", "vs": [[3, "وقل لهم: هذا هو الوقود الذي تقدمونه للرب: حملان حوليان صحيحان، يوميا ليكونا محرقة دائمة."]]}, {"l": "Num 28:4", "n": "", "vs": [[4, "قدموا أحد الحملين صباحا، والحمل الآخر ما بين العشاءين،"]]}], "kwAr": "ذبائحكم", "noteAr": ""}, {"kw": "and your", "raw": "Deu_14:28, Deu_14:29, Deu_26:12", "note": "", "refs": [{"l": "Deu 14:28", "n": "", "vs": [[28, "وفي نهاية كل ثلاث سنين، أخرجوا عشور محصول السنة الثالثة واخزنوها في مدنكم،"]]}, {"l": "Deu 14:29", "n": "", "vs": [[29, "فيقبل اللاويون الذين لم يرثوا ملكا أو نصيبا معكم، والغريب واليتيم والأرملة، المقيمون في مدنكم فيأكلون ويشبعون ليبارككم الرب إلهكم في كل ما تنتجه أيديكم."]]}, {"l": "Deu 26:12", "n": "", "vs": [[12, "ومتى انتهيت من تقديم كل عشور غلاتك في السنة الثالثة، سنة العشور، وأعطيت اللاوي والغريب واليتيم والأرملة فأكلوا في مدينتك وشبعوا،"]]}], "kwAr": "وعشوركم", "noteAr": ""}, {"kw": "three years", "raw": "Heb. three years of days", "note": "Heb. three years of days", "refs": [], "kwAr": "ثلاثة أيام", "noteAr": "بالعبرية: «ثلاث سنين من الأيام»."}], "arS": [["تعالوا", ["H935"]], [" إلى ", []], ["بيت", ["H1008"]], [" ", []], ["إيل", ["H1008"]], [" ", []], ["وارتكبوا", ["H6586"]], [" ", []], ["المعاصي", ["H6586"]], ["، وأقبلوا إلى ", []], ["الجلجال", ["H1537"]], [" ", []], ["وكثروا", ["H7235"]], [" ", []], ["ذنوبكم", ["H6586"]], [". قر بوا ", []], ["ذبائحكم", ["H2077"]], [" في كل ", []], ["صباح", ["H1242"]], ["، ", []], ["وعشوركم", ["H4643"]], [" كل ", []], ["ثلاثة", ["H7969"]], [" ", []], ["أيام", ["H3117"]], [".", []]]}, {"c": 4, "v": 5, "text": "قدموا من الخمير قربان شكر، وأعلنوا متباهين عن تقدماتكم التطوعية، وتفاخروا بها، لأن هذا ما تحبون أن تفعلوه ياشعب إسرائيل، يقول السيد الرب.", "groups": [{"kw": "offer a sacrifice", "raw": "Heb. offer by burning, Lev_7:12, Lev_7:13, Lev_23:17", "note": "Heb. offer by burning, Lev_7:12, Lev_7:13, Lev_23:17", "refs": [{"l": "Lev 7:12", "n": "", "vs": [[12, "إن قربها أحد لأجل الشكر، فليقدم معها كعكا غير مختمر معجونا بزيت، ورقاق فطير مدهونة بالزيت ودقيقا ملتوتا بزيت."]]}, {"l": "Lev 7:13", "n": "", "vs": [[13, "فضلا عن أرغفة خبز مختمرة، يقربها مع ذبيحة شكر سلامته."]]}, {"l": "Lev 23:17", "n": "", "vs": [[17, "فتأتون من مساكنكم بخبز ترجيح، رغيفين مقدارهما عشرين (نحو خمسة لترات) من دقيق مخبوزين بخمير، فيكونان باكورة للرب."]]}], "kwAr": "قدموا من الخمير قربان شكر", "noteAr": "بالعبرية: «أوقدوا». انظر لا 7: 12، 13؛ 23: 17"}, {"kw": "proclaim", "raw": "Lev_22:18-21; Deu_12:6, Deu_12:7; Mat_6:2", "note": "", "refs": [{"l": "Lev 22:18-21", "n": "", "vs": [[18, "«قل لهرون وأبنائه وسائر إسرائيل: كل إسرائيلي، أو من الغرباء المقيمين في إسرائيل يقدم قربانا، سواء كان وفاء لنذر، أم تقدمة طوعية يقربونها محرقة للرب،"], [19, "تكون محرقة للرضى عنكم، ثورا أو كبشا أو تيسا سليما."], [20, "لا تقربوا تقدمة فيها عيب، لأنها لن تكون مقبولة للرضى عنكم."], [21, "وإذا أصعد أحدكم ذبيحة سلام للرب، وفاء لنذر، أو ذبيحة طوعية، فلتكن من البقر أو الغنم، سليمة خالية من كل عيب ليرضى الرب عنكم."]]}, {"l": "Deu 12:6", "n": "", "vs": [[6, "وتقدمون محرقاتكم وذبائحكم وعشوركم وتقدماتكم ونذوركم وقرابينكم الطوعية وأبكار بقركم وغنمكم،"]]}, {"l": "Deu 12:7", "n": "", "vs": [[7, "فتأكلون هناك أنتم وعائلاتكم لدى الرب، وتفرحون بكل ما تمتد إليه أيديكم، لأن الرب إلهكم قد بارككم."]]}, {"l": "Mat 6:2", "n": "", "vs": [[2, "فإذا تصدقت على أحد، فلا تنفخ أمامك في البوق، كما يفعل المراؤون في المجامع والشوارع، ليمدحهم الناس. الحق أقول لكم: إنهم قد نالوا مكافأتهم."]]}], "kwAr": "وأعلنوا", "noteAr": ""}, {"kw": "for", "raw": "Psa_81:12; Mat_15:9, Mat_15:13, Mat_15:14, Mat_23:23; Rom_1:28; 2Th_2:10-12", "note": "", "refs": [{"l": "Psa 81:12", "n": "", "vs": [[12, "لذلك أسلمتهم إلى عناد قلوبهم. وسلكوا وفقا لمشورات أنفسهم."]]}, {"l": "Mat 15:9", "n": "", "vs": [[9, "إنما باطلا يعبدونني وهم يعلمون تعاليم ليست إلا وصايا الناس.»"]]}, {"l": "Mat 15:13", "n": "", "vs": [[13, "فأجابهم: «كل غرسة لم يغرسها أبي السماوي، لابد أن تقلع."]]}, {"l": "Mat 15:14", "n": "", "vs": [[14, "دعوهم وشأنهم، فهم عميان يقودون عميانا. وإذا كان الأعمى يقود أعمى، يسقطان معا في حفرة»."]]}, {"l": "Mat 23:23", "n": "", "vs": [[23, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تؤدون حتى عشور النعنع والشبث والكمون، وقد أهملتم أهم ما في الشريعة: العدل والرحمة والأمانة. كان يجب أن تفعلوا هذه ولا تغفلوا تلك!"]]}, {"l": "Rom 1:28", "n": "", "vs": [[28, "وبما أنهم لم يتخيروا إبقاء الله ضمن معرفتهم، أسلمهم الله إلى ذهن عاطل عن التمييز دفعهم إلى ممارسة الأمور غير اللائقة."]]}, {"l": "2Th 2:10-12", "n": "", "vs": [[10, "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا."], [11, "ولهذا السبب، سيرسل الله إليهم طاقة الضلال حتى يصدقوا ما هو دجل،"], [12, "فتقع الدينونة على جميع الذين لم يؤمنوا بالحق بل سرهم الإثم."]]}], "kwAr": "لأن", "noteAr": ""}, {"kw": "this liketh you", "raw": "Heb. so ye love, Hos_9:1, Hos_9:10", "note": "Heb. so ye love, Hos_9:1, Hos_9:10", "refs": [{"l": "Hos 9:1", "n": "", "vs": [[1, "لا تبتهج ياإسرائيل ولا تطرب كبقية الشعوب، لأنك قد خنت إلهك وهجرته، وأحببت أجرة الزنى على كل بيادر الحنطة."]]}, {"l": "Hos 9:10", "n": "", "vs": [[10, "وجدت إسرائيل كعنب في البرية، ورأيت آباءهم كباكورة ثمر شجرة التين في أول موسمها. ولكنهم التصقوا ببعل فغور ونذروا أنفسهم للصنم المخزي، فأصبحوا رجسا نظير الشيء الذي أحبوه."]]}], "kwAr": "هذا ما تحبون", "noteAr": "بالعبرية: «هكذا أحببتم». انظر هو 9: 1، 10"}], "arS": [["قدموا", ["H6999"]], [" من ", []], ["الخمير", ["H2557"]], [" ", []], ["قربان", ["H6999"]], [" ", []], ["شكر", ["H8426"]], ["، ", []], ["وأعلنوا", ["H7121"]], [" متباهين عن ", []], ["تقدماتكم", ["H5071"]], [" ", []], ["التطوعية", ["H5071"]], ["، وتفاخروا بها، لأن ", []], ["هذا", ["H3651"]], [" ما ", []], ["تحبون", ["H157"]], [" أن تفعلوه ", []], ["ياشعب", ["H1121"]], [" ", []], ["إسرائيل", ["H3478"]], ["، ", []], ["يقول", ["H5002"]], [" ", []], ["السيد", ["H136"]], [" ", []], ["الرب", ["H3069"]], [".", []]]}, {"c": 4, "v": 6, "text": "قد جعلت الجوع يعم مدنكم، فلم تتسخ أسنانكم بالطعام! وأفقرتكم إلى الخبز في كل أماكن سكناكم، ولكنكم لم ترجعوا إلي تائبين، يقول الرب.", "groups": [{"kw": "cleanness", "raw": "From want of food, occasioned by severe famine.", "note": "From want of food, occasioned by severe famine.", "refs": [], "kwAr": "فلم تتسخ أسنانكم بالطعام", "noteAr": "من قلة الطعام بسبب مجاعة شديدة."}, {"kw": "and want", "raw": "Lev_26:26; Deu_28:38; 1Ki_17:1, 1Ki_18:2; 2Ki_4:38, 2Ki_6:25-29, 2Ki_8:1; Eze_16:27", "note": "", "refs": [{"l": "Lev 26:26", "n": "", "vs": [[26, "وحين أقطع عنكم مؤونة الدقيق، تخبز عشر نساء خبزكم في فرن واحد لقلة الدقيق، وتقسمون الخبز بالميزان فتأكلون ولا تشبعون."]]}, {"l": "Deu 28:38", "n": "", "vs": [[38, "تبذرون كثيرا من البذار في الحقول، ولا تحصدون إلا القليل، لأن الجراد يلتهمه."]]}, {"l": "1Ki 17:1", "n": "", "vs": [[1, "وقال إيليا التشبي من أهل جلعاد لأخآب: «حي هو الرب إله إسرائيل الذي أخدمه، إنه لن يهطل ندى ولا مطر في هذه السنين، إلا حين أعلن ذلك»."]]}, {"l": "1Ki 18:2", "n": "", "vs": [[2, "فمضى إيليا ليبلغ أخآب الرسالة، وكانت المجاعة الشديدة قد عمت السامرة."]]}, {"l": "2Ki 4:38", "n": "", "vs": [[38, "ورجع أليشع إلى الجلجال. بعد ذلك عمت المجاعة البلاد. وفيما كان بنو الأنبياء مجتمعين مع أليشع، قال لخادمه: «اسلق بعض السليقة في القدر الكبيرة لبني الأنبياء»."]]}, {"l": "2Ki 6:25-29", "n": "", "vs": [[25, "وإذ طال الحصار، عمت المجاعة السامرة حتى صار رأس الحمار يباع بثمانين قطعة من الفضة، وأوقية زبل الحمام بخمس قطع من الفضة."], [26, "وفيما كان ملك إسرائيل يتفقد سور المدينة استغاثت به امرأة قائلة: «أغث ياسيدي الملك»."], [27, "فقال لها: «إن لم يغثك الرب، فمن أين يمكنني أن أحصل لك على الغوث؟ أمن قمح البيدر أم من نبيذ المعصرة؟»"], [28, "ثم سألها الملك: «مالك؟» فأجابت: «لقد قالت لي هذه المرأة، هاتي ابنك فنأكله اليوم، ثم نأكل ابني في اليوم التالي."], [29, "فسلقنا ابني وأكلناه. وعندما قلت لها في اليوم التالي: هاتي ابنك لنأكله، خبأت ابنها»."]]}, {"l": "2Ki 8:1", "n": "", "vs": [[1, "وقال أليشع للمرأة التي أحيا ابنها: «اذهبي أنت وعائلتك وتغربي حيث تشائين، لأن الرب سيصيب البلاد بمجاعة تدوم سبع سنوات»."]]}, {"l": "Eze 16:27", "n": "", "vs": [[27, "ها أنا أعاقبك وأنقص من نصيبك وأسلمك لأهواء عدواتك بنات الفلسطينيين اللواتي يخجلن من تصرفك الفاجر."]]}], "kwAr": "وأفقرتكم", "noteAr": ""}, {"kw": "yet", "raw": "Amo_4:8, Amo_4:9; 2Ch_28:22; Isa_9:13, Isa_26:11; Jer_5:3, Jer_8:5-7; Hos_5:15, Hos_6:1; Hos_7:14-16; Joe_2:12-14; Hag_2:17; Zec_1:3-6; Rev_2:21, Rev_9:20,Rev_9:21; Rev_16:10,Rev_16:11", "note": "", "refs": [{"l": "Amo 4:8", "n": "", "vs": [[8, "فأقبلت مدينتان أو ثلاث على مدينة واحدة لتشرب ماء، ولكنها لم ترتو، ومع ذلك لم ترجعوا إلي تائبين، يقول الرب."]]}, {"l": "Amo 4:9", "n": "", "vs": [[9, "أرسلت الرياح اللافحة واليرقان لتجفف محاصيلكم، والتهم الجراد حدائقكم وكرومكم وأشجار تينكم وزيتونكم. وما رجعتم إلي!"]]}, {"l": "2Ch 28:22", "n": "", "vs": [[22, "وفي أثناء ضيقه ازداد الملك آحاز خيانة للرب."]]}, {"l": "Isa 9:13", "n": "", "vs": [[13, "إن الشعب لم يرجع تائبا إلى من عاقبه، ولا طلب الرب القدير."]]}, {"l": "Isa 26:11", "n": "", "vs": [[11, "يارب إن يدك مرتفعة وهم لا يرونها، فدعهم يشاهدون غيرتك على شعبك، ويخزون. لتلتهمهم النار التي ادخرتها لأعدائك."]]}, {"l": "Jer 5:3", "n": "", "vs": [[3, "أيها الرب، أليست عيناك تطلبان الحق؟ لقد عاقبتهم ولكنهم لم يتوجعوا. أهلكتهم ولكنهم أبوا التقويم. صلبوا وجوههم أكثر من الصخر، ورفضوا التوبة."]]}, {"l": "Jer 8:5-7", "n": "", "vs": [[5, "فما بال شعب أورشليم قد ارتدوا ارتدادا دائما متشبثين بالخديعة ورافضين الرجوع؟"], [6, "قد أصغيت وسمعت، وإذا بهم ينطقون بما ينافي الحق، وما من أحد يتوب عن شره قائلا: ما هذا الذي أرتكب؟ بل كل واحد مضى في طريقه كفرس مندفع لخوض معركة."], [7, "إن اللقلق في السماء يعرف ميعاد هجرته، وكذلك اليمامة والسنونة المغردة تحفظان أوان عودتهما من هجرتهما. أما شعبي فلا يعرف قضاء الرب!"]]}, {"l": "Hos 5:15", "n": "", "vs": [[15, "ثم أرجع إلى موضعي إلى أن يعترفوا بإثمهم ويطلبوا وجهي، وفي ضيقهم يلتمسونني (قائلين):"]]}, {"l": "Hos 6:1", "n": "", "vs": [[1, "«تعالوا نرجع إلى الرب. هو الذي مزقنا إربا إربا، وهو وحده يبرئنا. هو الذي ضربنا، وهو وحده الذي يجبرنا."]]}, {"l": "Hos 7:14-16", "n": "", "vs": [[14, "لم يستغيثوا بي من كل قلوبهم، بل أعولوا في مضاجعهم، وتألبوا حول أصنامهم يطلبون قمحا وخمرا، وارتدوا عني."], [15, "دربتهم على القتال وشددتهم، ومع ذلك ارتكبوا الشر ضدي."], [16, "لا يرجعون إلي، فهم كقوس ملتوية مخطئة. يهلك رؤساؤهم بالسيف لفرط سلاطة ألسنتهم، ويصبح مصيرهم مثار سخرية المصريين."]]}, {"l": "Joe 2:12-14", "n": "", "vs": [[12, "والآن، يقول الرب: ارجعوا إلي من كل قلوبكم بصوم وبكاء ونوح."], [13, "مزقوا قلوبكم لا ثيابكم. ارجعوا إلى الرب إلهكم لأنه رؤوف ورحيم بطيء الغضب وكثير الرأفة، ولا يسر بالعقاب."], [14, "لعله يرجع ويكف عن العقاب مخلفا وراءه بركة: تقدمة دقيق وتقدمة سكيب لتقربوهما للرب إلهكم."]]}, {"l": "Hag 2:17", "n": "", "vs": [[17, "إني ابتليت تعب أيديكم بالقحط والذبول والبرد، ولكنكم لم ترجعوا تائبين إلي، يقول الرب."]]}, {"l": "Zec 1:3-6", "n": "", "vs": [[3, "ولكن قل لهم، هذا ما يعلنه الرب القدير: ارجعوا إلي فأرجع إليكم، يقول الرب القدير."], [4, "ولا تكونوا كآبائكم الذين ناداهم الأنبياء السالفون قائلين: هكذا يقول الرب القدير، ارجعوا عن طرقكم الباطلة وأعمالكم الشريرة، ولكنهم لم يسمعوا ولم يصغوا إلي، يقول الرب."], [5, "أين هم آباؤكم؟ وهل يحيا الأنبياء إلى الأبد؟"], [6, "ولكن ألم تدرك أقوالي وفرائضي التي أمرت بها عبيدي الأنبياء آباءكم فتابوا قائلين: لقد نفذ الرب القدير ما عزم أن يعاقبنا بمقتضى ما ارتكبناه من أعمال باطلة؟»"]]}, {"l": "Rev 2:21", "n": "", "vs": [[21, "وقد أمهلتها مدة لتتوب تاركة زناها، ولكنها لم تتب."]]}, {"l": "Rev 9:20", "n": "", "vs": [[20, "ولكن الناس الذين نجوا من هذه البلايا، لم يتوبوا عن أعمالهم، وظلوا يسجدون للشياطين وللأصنام التي صنعوها من الذهب والفضة والنحاس والحجر والخشب، مع أنها لا ترى ولا تسمع ولا تتحرك!"]]}, {"l": "Rev 9:21", "n": "", "vs": [[21, "ولم يتوبوا عن القتل والسحر والزنى والسرقة!"]]}, {"l": "Rev 16:10", "n": "", "vs": [[10, "ثم سكب الملاك الخامس كأسه على عرش الوحش، فحل بمملكته ظلام دامس، جعل أتباعه يعضون ألسنتهم من الألم."]]}, {"l": "Rev 16:11", "n": "", "vs": [[11, "غير أنهم لم يتوبوا عن أعمالهم الشريرة، بل جدفوا على إله السماء لما يعانون من آلام وقروح!"]]}], "kwAr": "ولكنكم لم ترجعوا", "noteAr": ""}], "arS": [["قد ", []], ["جعلت", ["H5414"]], [" ", []], ["الجوع", ["H2640"]], [" يعم ", []], ["مدنكم", ["H5892"]], ["، فلم ", []], ["تتسخ", ["H5356"]], [" ", []], ["أسنانكم", ["H8127"]], [" بالطعام! ", []], ["وأفقرتكم", ["H2640"]], [" إلى ", []], ["الخبز", ["H3899"]], [" في كل ", []], ["أماكن", ["H4725"]], [" سكناكم، ولكنكم لم ", []], ["ترجعوا", ["H7725"]], [" إلي تائبين، ", []], ["يقول", ["H5002"]], [" ", []], ["الرب", ["H3068"]], [".", []]]}, {"c": 4, "v": 7, "text": "منعت عنكم المطر ولم يكن قد بقي للحصاد سوى ثلاثة أشهر، وأمطرت على مدينة دون مدينة، وعلى حقل دون الآخر، فجف الحقل الذي لم أمطر عليه.", "groups": [{"kw": "I have", "raw": "Lev_26:18-21, Lev_26:23, Lev_26:24, Lev_26:27, Lev_26:28; Deu_28:23, Deu_28:24; 1Ki_8:35, 1Ki_8:36; 2Ch_7:13, 2Ch_7:14; Isa_5:6; Jer_3:3, Jer_5:24, Jer_5:25, Jer_14:4, Jer_14:22; Hag_1:10,Hag_1:11; Zec_14:17; Jam_5:17; Rev_11:6", "note": "", "refs": [{"l": "Lev 26:18-21", "n": "", "vs": [[18, "وإن أمعنتم في عصيانكم أزيد من عقابكم سبع مرات وفقا لخطاياكم."], [19, "أذل غطرستكم، وأجعل سماءكم كالحديد لا تمطر وأرضكم كالنحاس لا تغل"], [20, "فيذهب جهدكم باطلا لأن أرضكم لن تعطي غلتها، وأشجار الأرض لن تعطي أثمارها."], [21, "وإن واظبتم على عصيانكم وأبيتم طاعتي، أضاعف عقابي لكم سبع مرات وفقا لخطاياكم."]]}, {"l": "Lev 26:23", "n": "", "vs": [[23, "وإن لم تتعظوا، وتماديتم في عصيانكم،"]]}, {"l": "Lev 26:24", "n": "", "vs": [[24, "أنقلب عليكم وأزيد في بلائكم سبع مرات وفقا لخطاياكم."]]}, {"l": "Lev 26:27", "n": "", "vs": [[27, "وإن لم يجد هذا العقاب في تأديبكم، فتماديتم في عصيانكم،"]]}, {"l": "Lev 26:28", "n": "", "vs": [[28, "فإني أزيد في احتدام غضبي، من عدائي لكم وأضاعف عقابي سبع مرات أخرى وفقا لخطاياكم،"]]}, {"l": "Deu 28:23", "n": "", "vs": [[23, "وتصبح السماء التي فوقكم كالنحاس والأرض تحتكم كالحديد."]]}, {"l": "Deu 28:24", "n": "", "vs": [[24, "ويحول الرب مطر أرضكم إلى غبار وعواصف ترابية تنهمر عليكم من السماء حتى تهلكوا."]]}, {"l": "1Ki 8:35", "n": "", "vs": [[35, "إذا أغلقت أبواب السماء وانحبس المطر لأن الشعب أخطأ إليك، ثم صلوا في هذا الهيكل معترفين باسمك، وتابوا عن خطيئتهم لأنك أنزلت بهم البلاء،"]]}, {"l": "1Ki 8:36", "n": "", "vs": [[36, "فاستجب أنت من السماء، واصفح عن خطيئة عبيدك وشعبك إسرائيل، وعلمهم سبيل العيش باستقامة، وأمطر غيثا على الأرض التي وهبتها ميراثا لشعبك.."]]}, {"l": "2Ch 7:13", "n": "", "vs": [[13, "فإن أغلقت السماء فانحبس المطر، وإن أمرت الجراد أن يلتهم عشب الأرض، وإن جعلت الوبأ يتفشى بين شعبي،"]]}, {"l": "2Ch 7:14", "n": "", "vs": [[14, "ثم اتضع شعبي الذي دعي اسمي عليهم، وتضرعوا طالبين وجهي، وتابوا عن غيهم، فإنني أستجيب من السماء وأصفح عن خطيئتهم وأخصب أرضهم."]]}, {"l": "Isa 5:6", "n": "", "vs": [[6, "وأجعله خرابا فلا يقلم ولا ينقب، فينبت فيه شوك وحسك. وأوصي السحاب أن لا يمطر عليه أبدا."]]}, {"l": "Jer 3:3", "n": "", "vs": [[3, "لذلك امتنع عنك الغيث، ولم تهطل أمطار الربيع، ومع ذلك صارت لك جبهة زانية تأبى أن تخجل."]]}, {"l": "Jer 5:24", "n": "", "vs": [[24, "ولم يتناجوا في قلوبهم قائلين: لنتق الرب إلهنا الذي يغدق المطر في مواعيده في موسمي الربيع والخريف، ويحفظ لنا أسابيع الحصاد حسب مواقيتها."]]}, {"l": "Jer 5:25", "n": "", "vs": [[25, "غير أن آثامكم قد حولت عنكم هذه البركات، وخطاياكم حرمتكم من الخير."]]}, {"l": "Jer 14:4", "n": "", "vs": [[4, "خزي الفلاحون وغطوا رؤوسهم لأن الأرض قد تشققت لانقطاع المطر عنها."]]}, {"l": "Jer 14:22", "n": "", "vs": [[22, "هل بين أصنام الأمم الباطلة من يمطر؟ أو هل تسكب السموات بنفسها وابل الغيث؟ ألست أنت الرب إلهنا؟ إننا إياك نرجو لأنك أنت صنعت هذه جميعها."]]}, {"l": "Hag 1:10", "n": "", "vs": [[10, "لذلك منعت السماء من فوق عنكم الندى، ومنعت الأرض غلتها."]]}, {"l": "Hag 1:11", "n": "", "vs": [[11, "وقضيت بالقحط على الأرض والتلال، وعلى حقول الحنطة والكروم، وأشجار الزيتون وعلى كل ما تنتجه الأرض، وعلى الناس والبهائم، وعلى كل تعب أيديكم»."]]}, {"l": "Zec 14:17", "n": "", "vs": [[17, "وإن تقاعست أية عشيرة من عشائر أمم الأرض عن الصعود إلى أورشليم لتسجد للملك الرب القدير، يمتنع المطر عن الهطول على ديارهم."]]}, {"l": "Jam 5:17", "n": "", "vs": [[17, "فقد كان إيليا بشرا مثلنا، وطلب من الله بالصلاة أن يحبس المطر. وهكذا كان، فلم تنزل على الأرض قطرة مطر لمدة ثلاث سنين وستة أشهر."]]}, {"l": "Rev 11:6", "n": "", "vs": [[6, "وللشاهدين السلطة أن يغلقا السماء فلا تمطر طيلة مدة نبوءتهما، وأن يحولا مياه الأنهار والبحار دما، وأن ينزلا البلايا بالأرض، كلما أرادا."]]}], "kwAr": "منعت", "noteAr": ""}, {"kw": "when", "raw": "Joe_2:23; Joh_4:35", "note": "", "refs": [{"l": "Joe 2:23", "n": "", "vs": [[23, "افرحوا ياأبناء صهيون، ابتهجوا بالرب إلهكم لأنه أنعم عليكم بفضل صلاحه بأمطار الخريف، وسكب عليكم الغيث المبكر والمتأخر بغزارة، كالسابق."]]}, {"l": "Joh 4:35", "n": "", "vs": [[35, "أما تقولون: بعد أربعة أشهر يأتي الحصاد! ولكني أقول لكم: انظروا مليا إلى الحقول، فهي قد نضجت وحان حصادها."]]}], "kwAr": "ولم يكن", "noteAr": ""}, {"kw": "and I", "raw": "Exo_8:22, Exo_9:4, Exo_9:26, Exo_10:23; Jdg_6:37-40; 1Co_4:7", "note": "", "refs": [{"l": "Exo 8:22", "n": "", "vs": [[22, "ولكني في ذلك اليوم أستثني أرض جاسان حيث يسكن شعبي فلا يغزوها الذباب، فتدرك أنني أنا الرب، كائن في هذه الأرض."]]}, {"l": "Exo 9:4", "n": "", "vs": [[4, "وأميز بين مواشي إسرائيل ومواشي المصريين. فلا يهلك شيء لبني إسرائيل»."]]}, {"l": "Exo 9:26", "n": "", "vs": [[26, "أما أرض جاسان حيث يقيم بنو إسرائيل، فإنها وحدها لم يسقط فيها برد."]]}, {"l": "Exo 10:23", "n": "", "vs": [[23, "فلم يتمكن أحد من أن يرى أخاه، ولا غادر أحد مكانه طوال ثلاثة أيام. غير أن النور كان يغمر بني إسرائيل في أماكن إقامتهم."]]}, {"l": "Jdg 6:37-40", "n": "", "vs": [[37, "سأضع الليلة جزة صوف في البيدر، فإن ابتلت الجزة وحدها بالندى، وبقيت الأرض كلها جافة، أدرك أنك تنقذ إسرائيل على يدي كما وعدتني»."], [38, "وهذا ما حدث: فعندما بكر جدعون في الصباح التالي أخذ جزة الصوف وضغطها وعصرها فقطر منها ملء قصعة من الماء."], [39, "فقال جدعون لله: «لا يحتدم غضبك علي ودعني أتقدم مرة أخرى فقط بطلب واحد. اسمح لي أن أجري اختبارا آخر على هذه الجزة. لتبق هذه الجزة وحدها جافة، أما بقية الأرض فليبللها الندى»."], [40, "فصنع الرب ذلك. في تلك الليلة ابتلت الأرض كلها بالندى وبقيت الجزة وحدها جافة."]]}, {"l": "1Co 4:7", "n": "", "vs": [[7, "فمن جعلك متميزا عن غيرك؟ وأي شيء مما لك لم تكن قد أخذته هبة؟ ومادمت قد أخذت، فلماذا تتباهى كأنك لم تأخذ؟"]]}], "kwAr": "وأمطرت", "noteAr": ""}, {"kw": "and the", "raw": "Joe_1:10-18", "note": "", "refs": [{"l": "Joe 1:10-18", "n": "", "vs": [[10, "قد خربت الحقول، وناحت الأرض لأن الحنطة تلفت والخمرة انقطعت، وافتقد زيت الزيتون."], [11, "اخزوا أيها الحراثون وأعولوا أيها الكرامون على الحنطة والشعير، لأن حصاد الحقل قد تلف."], [12, "قد ذوى الكرم وذبل التين والرمان والنخيل والتفاح ويبست سائر أشجار الحقل، وزالت البهجة من أبناء البشر."], [13, "أيها الكهنة اتشحوا بالمسوح ونوحوا. ولولوا ياخدام المذبح. تعالوا وبيتوا ليلتكم بالمسوح ياخدام إلهي، لأن تقدمات الدقيق والخمر قد منعت عن هيكل الله."], [14, "خصصوا صوما. نادوا بالاعتكاف. ادعوا الشيوخ وجميع سكان الأرض للاجتماع في هيكل الرب إلهكم وتضرعوا إليه."], [15, "يا له من يوم رهيب، لأن يوم الرب قريب يأتي حاملا معه الدمار من عند القدير."], [16, "ألم ينقطع الطعام أمام عيوننا، ألم يتلاش الفرح والغبطة من بيت إلهنا؟"], [17, "قد تعفنت الحبوب المزروعة في الأرض الجافة، وتهدمت المخازن وفرغت الأهراء من القمح، لأن الحبوب قد جفت."], [18, "لكم أنت البهائم، وشردت المواشي إذ افتقرت إلى المرعى. حتى قطعان الغنم هلكت أيضا."]]}], "kwAr": "وعلى حقل", "noteAr": ""}], "arS": [["منعت", ["H4513"]], [" عنكم ", []], ["المطر", ["H1653"]], [" ولم يكن قد بقي ", []], ["للحصاد", ["H7105"]], [" سوى ", []], ["ثلاثة", ["H7969"]], [" ", []], ["أشهر", ["H2320"]], ["، ", []], ["وأمطرت", ["H4305"]], [" على ", []], ["مدينة", ["H5892"]], [" دون مدينة، وعلى ", []], ["حقل", ["H2513"]], [" دون ", []], ["الآخر", ["H259"]], ["، ", []], ["فجف", ["H3001"]], [" الحقل الذي لم ", []], ["أمطر", ["H4305"]], [" عليه.", []]]}, {"c": 4, "v": 8, "text": "فأقبلت مدينتان أو ثلاث على مدينة واحدة لتشرب ماء، ولكنها لم ترتو، ومع ذلك لم ترجعوا إلي تائبين، يقول الرب.", "groups": [{"kw": "two", "raw": "1Ki_18:5; Isa_41:17, Isa_41:18; Jer_14:3", "note": "", "refs": [{"l": "1Ki 18:5", "n": "", "vs": [[5, "وكان أخآب قد قال لعوبديا: «طف في البلاد وابحث عن جميع عيون الماء وفي الأودية، لعلنا نجد عشبا فنحيي الخيل والبغال، فلا تهلك كل البهائم»."]]}, {"l": "Isa 41:17", "n": "", "vs": [[17, "وعندما يلتمس البائسون والمساكين ماء ولا يجدونه، وتتشقق ألسنتهم من العطش، أنا الرب أستجيب لهم، أنا إله إسرائيل لا أتخلى عنهم."]]}, {"l": "Isa 41:18", "n": "", "vs": [[18, "فأفجر أنهارا على الهضاب وينابيع في وسط الأودية، وأحول البرية إلى واحة ماء والأرض القاحلة إلى جداول."]]}, {"l": "Jer 14:3", "n": "", "vs": [[3, "أرسل أشرافهم خدامهم ليحملوا إليهم الماء، فأقبلوا إلى الجباب وإذا بها فارغة من الماء، فرجعوا بجرار خاوية وقد اعتراهم الخزي والخجل وغطوا رؤوسهم."]]}], "kwAr": "مدينتان", "noteAr": ""}, {"kw": "but", "raw": "Eze_4:16; Mic_6:14; Hag_1:6", "note": "", "refs": [{"l": "Eze 4:16", "n": "", "vs": [[16, "ياابن آدم، ها أنا أبيد مؤونة الخبز في أورشليم، فيأكلون الخبز بالوزن معجونا بالغم، ويشربون الماء بالكيل ممزوجا بالحيرة."]]}, {"l": "Mic 6:14", "n": "", "vs": [[14, "ستأكلين ولا تشبعين، ويظل جوفك خاويا. وما تدخرينه تعجزين عن الاحتفاظ به. لأني أدفعه للسيف."]]}, {"l": "Hag 1:6", "n": "", "vs": [[6, "لقد زرعتم كثيرا وحصدتم قليلا. أكلتم ولم تشبعوا. شربتم ولم ترتووا. اكتسيتم ولم تستدفئوا. ومن ينال أجرة سرعان ما تتبدد، وكأنها وضعت في صرة مثقوبة»."]]}], "kwAr": "ولكنها", "noteAr": ""}, {"kw": "yet", "raw": "Amo_4:6, Amo_4:9-11; Jer_23:14; Hos_7:10", "not لشقاء،"], [9, "عندئذ يبدي لهم أفعالهم وآثامهم إذ سلكوا بغرور."], [10, "يفتح آذانهم لتحذيراته، ويأمرهم بالتوبة عن إثمهم."], [11, "فإن أطاعوا وعبدوه، يقضون أيامهم برغد، وسنيهم بالنعم."], [12, "ولكن إن عصوا فبحد السيف يهلكون، ويموتون من غير فهم."], [13, "أما فجار القلوب فيذخرون لأنفسهم غضبا، ولا يستغيثون بالله حين يعاقبهم."]]}, {"l": "Isa 1:5", "n": "", "vs": [[5, "على أي موضع أضربكم بعد؟ لماذا تواظبون على التمرد؟ إن الرأس بجملته سقيم والقلب بكامله مريض."]]}, {"l": "Isa 42:24", "n": "", "vs": [[24, "من أسلم يعقوب للنهب، وإسرائيل للسالبين؟ أليس هو الله الذي أخطأنا في حقه؟ لأنهم أبوا أن يسلكوا في طرقه وأن يطيعوا شريعته."]]}, {"l": "Isa 42:25", "n": "", "vs": [[25, "لذلك صب عليهم جام غضبه في وطيس الحرب فاكتنفتهم بضرامها ولكنهم لم يفهموا، وأحرقتهم بنيرانها ولم يتعظوا."]]}, {"l": "Jer 5:3", "n": "", "vs": [[3, "أيها الرب، أليست عيناك تطلبان الحق؟ لقد عاقبتهم ولكنهم لم يتوجعوا. أهلكتهم ولكنهم أبوا التقويم. صلبوا وجوههم أكثر من الصخر، ورفضوا التوبة."]]}], "kwAr": "وما رجعتم", "noteAr": ""}], "arS": [["أرسلت", ["H5221"]], [" ", []], ["الرياح", ["H7711"]], [" اللافحة ", []], ["واليرقان", ["H3420"]], [" لتجفف محاصيلكم، ", []], ["والتهم", ["H398"]], [" ", []], ["الجراد", ["H1501"]], [" ", []], ["حدائقكم", ["H1593"]], [" ", []], ["وكرومكم", ["H3754"]], [" وأشجار ", []], ["تينكم", ["H8384"]], [" ", []], ["وزيتونكم", ["H2132"]], [". وما ", []], ["رجعتم", ["H7725"]], [" إلي!", []]]}, {"c": 4, "v": 10, "text": "أصبتكم بالأوبئة التي أصيبت بها مصر، وقضيت على شبابكم بالسيف وسبيت خيولكم، وجعلت نتن معسكركم يزكم أنوفكم. ولكنكم لم ترجعوا إلي تائبين يقول الرب.", "groups": [{"kw": "pestilence", "raw": "Exo_9:3-6, Exo_12:29, Exo_12:30, Exo_15:26; Lev_26:16, Lev_26:25; Deu_7:15, Deu_28:22, Deu_28:27, Deu_28:60; Psa_78:49, Psa_78:50", "note": "", "refs": [{"l": "Exo 9:3-6", "n": "", "vs": [[3, "فإن يد الرب ستهلك مواشيك التي في الحقول، والخيول، والحمير والجمال والثيران والغنم، بوبأ شديد جدا."], [4, "وأميز بين مواشي إسرائيل ومواشي المصريين. فلا يهلك شيء لبني إسرائيل»."], [5, "وعين الرب موعدا لذلك قائلا: «غدا يصنع الرب هذا في الأرض»."], [6, "وفي الغد صنع الرب هذا الأمر. فهلكت جميع مواشي المصريين، أما مواشي بني إسرائيل فلم يهلك منها واحد."]]}, {"l": "Exo 12:29", "n": "", "vs": [[29, "وفي منتصف الليل أهلك الرب كل بكر في بلاد مصر، من بكر فرعون المتربع على العرش إلى بكر الحبيس في السجن، وأبكار البهائم جميعا أيضا."]]}, {"l": "Exo 12:30", "n": "", "vs": [[30, "فاستيقظ فرعون وحاشيته وجميع المصريين وإذا عويل عظيم في أرض مصر، لأنه لم يوجد بيت ليس فيه ميت."]]}, {"l": "Exo 15:26", "n": "", "vs": [[26, "وقال: «إن كنت تحرص على سماع صوت الرب إلهك، وتفعل ما هو حق أمامه، وتطيع وصاياه وتحافظ على جميع فرائضه، فلن أدعك تقاسي من أي مرض من الأمراض التي ابتليت بها المصريين، فإني أنا الرب شافيك»."]]}, {"l": "Lev 26:16", "n": "", "vs": [[16, "فإني أبتليكم بالرعب المفاجيء وداء السل والحمى التي تفني العينين وتتلف النفس، وتزرعون على غير طائل، وينهب أعداؤكم زرعكم."]]}, {"l": "Lev 26:25", "n": "", "vs": [[25, "أسلط عليكم سيف العدو. فينتقم منكم لنقضكم ميثاقي، فتلوذون بمدنكم حيث أرسل عليكم الوباء وتسلمون إلى يد العدو"]]}, {"l": "Deu 7:15", "n": "", "vs": [[15, "ويقيكم الرب من كل علة، وكل أمراض مصر الخبيثة التي عاينتموها، ولا يصيبكم بها، بل يجعلها على مبغضيكم."]]}, {"l": "Deu 28:22", "n": "", "vs": [[22, "ويضربكم الرب بالسل والحمى والرعشة والالتهاب والجفاف واللفح والذبول، فتلازمكم حتى تفنوا."]]}, {"l": "Deu 28:27", "n": "", "vs": [[27, "ويصيبكم الرب بداء قرحة مصر وبالبواسير والجرب والحكة، ولا تجدون لها علاجا."]]}, {"l": "Deu 28:60", "n": "", "vs": [[60, "ويرسل عليكم كل أمراض مصر التي فزعتم منها فتلازمكم،"]]}, {"l": "Psa 78:49", "n": "", "vs": [[49, "أرسل عليهم حمم غضبه، وسخطه وغيظه، وأطلق عليهم حملة من ملائكة الهلاك."]]}, {"l": "Psa 78:50", "n": "", "vs": [[50, "أفلت عنان غضبه، ولم يحفظهم من الموت، بل أهلكهم بالوبإ،"]]}], "kwAr": "بالأوبئة", "noteAr": ""}, {"kw": "after the manner", "raw": "or, in the way", "note": "or, in the way", "refs": [], "kwAr": "التي أصيبت بها مصر", "noteAr": "أو: «في طريق»."}, {"kw": "your young", "raw": "Lev_26:25; 2Ki_8:12, 2Ki_10:32; Jer_6:11, Jer_11:22, Jer_18:21, Jer_48:15", "note": "", "refs": [{"l": "Lev 26:25", "n": "", "vs": [[25, "أسلط عليكم سيف العدو. فينتقم منكم لنقضكم ميثاقي، فتلوذون بمدنكم حيث أرسل عليكم الوباء وتسلمون إلى يد العدو"]]}, {"l": "2Ki 8:12", "n": "", "vs": [[12, "فسأله حزائيل: «لماذا يبكي سيدي؟» فأجابه: «لأني عرفت ما ستنزله ببني إسرائيل من شر، فإنك ستحرق حصونهم وتقتل شبانهم وتذبح أطفالهم وتشق بطون حواملهم»."]]}, {"l": "2Ki 10:32", "n": "", "vs": [[32, "وفي تلك الأيام بدأ الرب يخفض من مساحة أرض إسرائيل، فاستولى حزائيل على أجزاء كبيرة من مناطقهم."]]}, {"l": "Jer 6:11", "n": "", "vs": [[11, "لذلك امتلأت من سخط الرب وأعياني كظمه. أسكبه على الأولاد في الطريق وعلى الشبان المجتمعين في مجالسهم، فيصيب الرجل وزوجته والشيخ والطاعن في السن."]]}, {"l": "Jer 11:22", "n": "", "vs": [[22, "لهذا يعلن الرب القدير: ها أنا أعاقبهم فيموت شبابهم بحد السيف، ويهلك أبناؤهم وبناتهم جوعا."]]}, {"l": "Jer 18:21", "n": "", "vs": [[21, "لذلك أسلم بنيهم لأنياب الجوع، واعهد بهم إلى قبضة السيف فتصبح نساؤهم ثكالى وأرامل، وليمت رجالهم، وليلق شبانهم حتفهم في المعارك بحد السيف."]]}, {"l": "Jer 48:15", "n": "", "vs": [[15, "إن موآب سيدمر، وتغزى مدنه، وتنزل نخبة شبانه للذبح، يقول الملك الذي اسمه الرب القدير."]]}], "kwAr": "شبابكم", "noteAr": ""}, {"kw": "and have taken away your horses", "raw": "Heb. with the captivity of your horses, 2Ki_13:3, 2Ki_13:7", "note": "Heb. with the captivity of your horses, 2Ki_13:3, 2Ki_13:7", "refs": [{"l": "2Ki 13:3", "n": "", "vs": [[3, "فاحتدم غضب الرب على إسرائيل، وسلط عليهم حزائيل ملك أرام، ومن بعده ابنه بنهدد طوال حياته."]]}, {"l": "2Ki 13:7", "n": "", "vs": [[7, "ولم يكن قد بقي من جيش يهوأحاز سوى خمسين فارسا، وعشر مركبات، وعشرة آلاف رجل من المشاة، لأن ملك أرام أفناهم وداس عليهم كما يداس على التراب."]]}], "kwAr": "وسبيت خيولكم", "noteAr": "بالعبرية: «مع سبي خيولكم». انظر 2مل 13: 3، 7"}, {"kw": "the stink", "raw": "Amo_8:3; Deu_28:26; Jer_8:1, Jer_8:2, Jer_9:22, Jer_15:3, Jer_16:4; Joe_2:20", "note": "", "refs": [{"l": "Amo 8:3", "n": "", "vs": [[3, "فتتحول أغاني قصورهم إلى عويل في ذلك اليوم، وتكثر الجثث ويطرحونها في كل مكان بصمت»."]]}, {"l": "Deu 28:26", "n": "", "vs": [[26, "وتكون جثثكم طعاما لجميع طيور السماء ووحوش الأرض ولا يطردها أحد."]]}, {"l": "Jer 8:1", "n": "", "vs": [[1, "ويقول الرب: «في ذلك الحين ينبشون من القبور عظام ملوك يهوذا وعظام رؤسائهم وكهنتهم وأنبيائهم، وعظام سكان أورشليم."]]}, {"l": "Jer 8:2", "n": "", "vs": [[2, "ويعرضونها أمام الشمس والقمر وكواكب السماء التي أحبوها وعبدوها وضلوا وراءها، واستشاروها وسجدوا لها، فلا تجمع ولا تدفن، بل تصير نفاية فوق وجه الأرض،"]]}, {"l": "Jer 9:22", "n": "", "vs": [[22, "وهذا ما يعلنه الرب: «ستتهاوى جثث الناس مثل نفاية على وجه الحقل، وتتساقط كقبضات وراء الحاصد، وليس من يجمعها»."]]}, {"l": "Jer 15:3", "n": "", "vs": [[3, "وأعهد بهم إلى أربعة أصناف من الخراب يقول الرب: السيف للذبح، والكلاب للتمزيق، وطيور السماء ووحوش الأرض للافتراس والإهلاك."]]}, {"l": "Jer 16:4", "n": "", "vs": [[4, "«سيموتون بالأمراض، فلا يندبون، ولا يدفنون بل يصبحون نفاية مطروحة على وجه الأرض، ويفنون بالسيف والجوع، وتكون جثثهم طعاما لجوارح السماء ولوحوش الأرض."]]}, {"l": "Joe 2:20", "n": "", "vs": [[20, "سأطرد عنكم الشمالي، وأطوح به إلى أرض مقفرة موحشة فتكون طليعته في البحر الميت ومؤخرته في البحر الأبيض، فتملأ رائحة نتنه وعفونته الفضاء، لأنه قد ارتكب الكبائر."]]}], "kwAr": "نتن", "noteAr": ""}, {"kw": "yet", "raw": "Amo_4:6; Exo_8:19, Exo_9:12, Exo_9:17, Exo_9:34, Exo_9:35, Exo_10:3, Exo_10:27, Exo_14:4", "note": "", "refs": [{"l": "Amo 4:6", "n": "", "vs": [[6, "قد جعلت الجوع يعم مدنكم، فلم تتسخ أسنانكم بالطعام! وأفقرتكم إلى الخبز في كل أماكن سكناكم، ولكنكم لم ترجعوا إلي تائبين، يقول الرب."]]}, {"l": "Exo 8:19", "n": "", "vs": [[19, "فقال السحرة لفرعون «هو فعل الله». ولكن قلب فرعون ظل متصلبا فلم يسمع لهما، تماما كما قال الرب."]]}, {"l": "Exo 9:12", "n": "", "vs": [[12, "لكن الرب قسى قلب فرعون فلم يسمع لهما، تماما كما قال الرب لموسى."]]}, {"l": "Exo 9:17", "n": "", "vs": [[17, "وها أنت مازلت تقاوم شعبي ولا تطلقه."]]}, {"l": "Exo 9:34", "n": "", "vs": [[34, "وعندما رأى فرعون أن المطر والبرد والرعد قد توقفت أخطأ مرة أخرى وصلب قلبه هو وحاشيته."]]}, {"l": "Exo 9:35", "n": "", "vs": [[35, "وهكذا تقسى قلب فرعون، فلم يطلق سراح بني إسرائيل، تماما كما أنبأ الرب على لسان موسى."]]}, {"l": "Exo 10:3", "n": "", "vs": [[3, "فمثل موسى وهرون أمام فرعون وقالا له: «هذا ما يعلنه الرب إله العبرانيين: إلى متى تأبى أن تخضع لي؟ أطلق شعبي ليعبدني."]]}, {"l": "Exo 10:27", "n": "", "vs": [[27, "ولكن الرب صلب قلب فرعون فلم يطلق سراحهم."]]}, {"l": "Exo 14:4", "n": "", "vs": [[4, "فأقسي قلب فرعون حتى يسعى وراءكم فأتعظم آنئذ (بالقضاء) على فرعون وعلى جيشه، ويعرف المصريون أني أنا الرب». وهكذا فعل الإسرائيليون."]]}], "kwAr": "ولكنكم لم ترجعوا", "noteAr": ""}], "arS": [["أصبتكم", ["H7971"]], [" ", []], ["بالأوبئة", ["H1698"]], [" التي أصيبت بها ", []], ["مصر", ["H4714"]], ["، ", []], ["وقضيت", ["H2026"]], [" على ", []], ["شبابكم", ["H970"]], [" ", []], ["بالسيف", ["H2719"]], [" ", []], ["وسبيت", ["H7628"]], [" ", []], ["خيولكم", ["H5483"]], ["، وجعلت ", []], ["نتن", ["H889"]], [" ", []], ["معسكركم", ["H4264"]], [" يزكم ", []], ["أنوفكم", ["H639"]], [". ", []], ["ولكنكم", ["H3808"]], [" لم ", []], ["ترجعوا", ["H7725"]], [" إلي تائبين ", []], ["يقول", ["H5002"]], [" ", []], ["الرب", ["H3068"]], [".", []]]}, {"c": 4, "v": 11, "text": "دمرت بعض مدنكم كما دمر الله سدوم وعمورة، فكان من نجا منكم كشعلة منتشلة من النار. ولكنكم لم ترجعوا إلي تائبين.", "groups": [{"kw": "as God", "raw": "Gen_19:24, Gen_19:25; Isa_13:19; Jer_49:18; Hos_11:8; 2Pe_2:6; Jud_1:7", "note": "", "refs": [{"l": "Gen 19:24", "n": "", "vs": [[24, "فأمطر الرب على سدوم وعمورة كبريتا ونارا، من عنده من السماء."]]}, {"l": "Gen 19:25", "n": "", "vs": [[25, "وقلب تلك المدن والساكنين فيها، والسهل المحيط بها وكل مزروعات الأرض."]]}, {"l": "Isa 13:19", "n": "", "vs": [[19, "أما بابل، مجد الممالك وبهاء وفخر الكلدانيين، فتصبح كسدوم وعمورة اللتين قلبهما الله ."]]}, {"l": "Jer 49:18", "n": "", "vs": [[18, "ويصيبها ما أصاب سدوم وعمورة وما جاورهما، من انقلاب، يقول الرب، فلا يسكن هناك إنسان ولا يتغرب فيها أحد."]]}, {"l": "Hos 11:8", "n": "", "vs": [[8, "كيف أتخلى عنك ياأفرايم؟ وكيف أسلمك إلى العدو ياإسرائيل؟ كيف أعاملك كما عاملت أدمة؟ وكيف أجري عليك ما أجريته على صبوئيم؟ إن قلبي يتلوى أسى في داخلي وتضرم في مراحمي."]]}, {"l": "2Pe 2:6", "n": "", "vs": [[6, "وإذ حكم الله على مدينتي سدوم وعمورة بالخراب، حولهما إلى رماد، جاعلا منهما عبرة للذين يعيشون حياة فاجرة."]]}, {"l": "Jud 1:7", "n": "", "vs": [[7, "وتعرفون كذلك ما فعله الرب بمدينتي سدوم وعمورة وبالمدن التي حولهما. فقد كان أهل هذه المدن، مثل أولئك المعلمين، مندفعين وراء الزنى، ومنغمسين في شهوات مخالفة للطبيعة. لذلك عاقب الرب هذه المدن بالنار الأبدية، فدمرها. فكانت بذلك عبرة للآخرين."]]}], "kwAr": "كما دمر الله", "noteAr": ""}, {"kw": "as a", "raw": "Zec_3:2; 1Co_3:15; Jud_1:23", "note": "", "refs": [{"l": "Zec 3:2", "n": "", "vs": [[2, "فقال الرب للشيطان: «إن الرب ينتهرك ياشيطان، الرب الذي اصطفى أورشليم ينتهرك، أليس هذا الرجل كحطبة مشتعلة انتشلت من النار؟»"]]}, {"l": "1Co 3:15", "n": "", "vs": [[15, "ومن احترق عمله، يخسر، إلا أنه هو سيخلص؛ ولكن كمن يمر في النار."]]}, {"l": "Jud 1:23", "n": "", "vs": [[23, "وبعضهم يجب أن تنقذوهم من النار خطفا. وآخرون يجب أن تعالجوهم بشفقة وحذر، مبغضين حتى الثياب التي يلوثونها بأجسادهم."]]}], "kwAr": "كشعلة", "noteAr": ""}, {"kw": "yet", "raw": "Amo_4:6; Jer_6:28-30; Eze_22:17-22, Eze_24:13; Rev_9:20", "note": "", "refs": [{"l": "Amo 4:6", "n": "", "vs": [[6, "قد جعلت الجوع يعم مدنكم، فلم تتسخ أسنانكم بالطعام! وأفقرتكم إلى الخبز في كل أماكن سكناكم، ولكنكم لم ترجعوا إلي تائبين، يقول الرب."]]}, {"l": "Jer 6:28-30", "n": "", "vs": [[28, "فكلهم عصاة متمردون ساعون في النميمة. هم نحاس وحديد وكلهم فاسدون."], [29, "لشد ما تضرم ريح المنفاخ الشديدة النار فتلتهم الرصاص ولكن كما يتعذر تنقيته من الزغل كذلك يتعذر فصل الأشرار."], [30, "وهم يدعون حثالة الفضة المرذولة، لأن الرب قد رفضهم»."]]}, {"l": "Eze 22:17-22", "n": "", "vs": [[17, "وأوحى إلي الرب بكلمته قائلا:"], [18, "«ياابن آدم، قد أصبح شعب إسرائيل لي نفاية. كلهم مثل النحاس والقصدير والحديد والرصاص في كور. صاروا حثالة فضة."], [19, "لأجل ذلك هذا ما يعلنه السيد الرب: لأنكم كلكم قد صرتم نفاية، فها أنا أجمعكم في وسط أورشليم،"], [20, "كما تجمع الفضة والنحاس والحديد والرصاص والقصدير في الكور، لتنفخ عليها نار لتسبك. كذلك أجمعكم في غضبي وسخطي وأطرحكم وأسبككم."], [21, "أجمعكم وأنفخ عليكم في نار غضبي فتسبكون فيها"], [22, "كما تسبك الفضة في بوتقة النار، هكذا تسبكون فيها، فتدركون أني أنا الرب قد سكبت سخطي عليكم»."]]}, {"l": "Eze 24:13", "n": "", "vs": [[13, "في قذارتك رذيلة لأني سعيت لتطهيرك، فلم تطهري ولن تطهري من نجاستك حتى أصب عليك غضبي."]]}, {"l": "Rev 9:20", "n": "", "vs": [[20, "ولكن الناس الذين نجوا من هذه البلايا، لم يتوبوا عن أعمالهم، وظلوا يسجدون للشياطين وللأصنام التي صنعوها من الذهب والفضة والنحاس والحجر والخشب، مع أنها لا ترى ولا تسمع ولا تتحرك!"]]}], "kwAr": "ولكنكم لم ترجعوا", "noteAr": ""}], "arS": [["دمرت", ["H2015"]], [" بعض مدنكم كما ", []], ["دمر", ["H4114"]], [" ", []], ["الله", ["H430"]], [" ", []], ["سدوم", ["H5467"]], [" ", []], ["وعمورة", ["H6017"]], ["، فكان من نجا منكم ", []], ["كشعلة", ["H181"]], [" ", []], ["منتشلة", ["H5337"]], [" من ", []], ["النار", ["H4480", "H8316"]], [". ", []], ["ولكنكم", ["H3808"]], [" لم ", []], ["ترجعوا", ["H7725"]], [" إلي تائبين.", []]]}, {"c": 4, "v": 12, "text": "لذلك، هذا ما أجريه عليك ياإسرائيل. فمن أجل ما أصنعه بك تأهب للقاء إلهك.", "groups": [{"kw": "thus", "raw": "Amo_4:2, Amo_4:3, Amo_2:14, Amo_9:1-4", "note": "", "refs": [{"l": "Amo 4:2", "n": "", "vs": [[2, "قد أقسم السيد الرب بقداسته قائلا: ها أيام تقبل عليكن، يجركن فيها العدو بالكلاليب وذريتكن بشصوص السمك."]]}, {"l": "Amo 4:3", "n": "", "vs": [[3, "وتخرج كل واحدة منكن من شق، زاحفة على وجهها، وتطردن إلى هرمون، يقول الرب."]]}, {"l": "Amo 2:14", "n": "", "vs": [[14, "فلا يتاح الهرب للسريع، وتتلاشى قوة الجبار، ويعجز القوي عن إنقاذ نفسه."]]}, {"l": "Amo 9:1-4", "n": "", "vs": [[1, "ورأيت السيد واقفا إلى جوار المذبح قائلا: «اضرب تيجان الأعمدة حتى تهتز العتبات، وحطمها على رؤوس جميع الشعب. ومن ينجو منهم أهلكه بالسيف، فلا يهرب منهم أحد ولا يفلت منهم ناج."], [2, "وإن نقبوا لأنفسهم ملجأ في أعماق الهاوية، فإن يدي تطولهم هناك، وإن ارتقوا إلى السماوات فمن هناك أنزلهم."], [3, "وإن اختبأوا في أعالي الكرمل فهناك أبحث عنهم وأعتقلهم. وإن تواروا عني في أعماق البحر فإني آمر هناك الحية فتلدغهم."], [4, "وإن سيقوا إلى السبي أمام أعدائهم ألاحقهم بالسيف لأفنيهم، وأتعقبهم لأبتليهم بالشر لا بالخير»."]]}], "kwAr": "هذا ما أجريه", "noteAr": ""}, {"kw": "prepare", "raw": "Amo_5:4-15; Isa_47:3; Eze_13:5, Eze_22:30; Hos_13:8; Mat_5:25, Mat_24:44-51; Mat_25:1-13; Mar_13:32-37; Luk_14:31, Luk_14:32, 21:3-36; 1Th_5:2-4; Jam_4:1-10; Rev_3:3", "note": "", "refs": [{"l": "Amo 5:4-15", "n": "", "vs": [[4, "لأن هذا ما يقوله الرب لبيت إسرائيل: التمسوني فتحيوا."], [5, "لا تسعوا وراء بيت إيل، ولا تدخلوا الجلجال، ولا تعبروا إلى بئر سبع، لأن أهل الجلجال لابد أن يتم سبيهم، وبيت إيل تصبح عدما."], [6, "التمسوا الرب فتحيوا لئلا يندلع كنار تحرق بيت يوسف وتلتهم بيت إيل، وليس من يطفيء."], [7, "إنكم تحولون العدل مرارة، وتطرحون الحق إلى الأرض."], [8, "إنه هو الذي خلق الثريا والجبار، ويحول دياجير الظلمة إلى نهار، والنهار إلى ليل، ويستدعي مياه البحر ويفيضها على وجه الأرض، الرب اسمه."], [9, "الذي ينزل الخراب بالقوي، فيعصف الدمار بالحصون."], [10, "قد أبغضوا من يندد بالجور في ساحة القضاء، ويكرهون من ينطق بالحق."], [11, "فلأنكم تطأون المسكين وتبتزون منه رشوة قمح حتى تشيدوا بيوتا من حجارة منحوتة، فإنكم لن تسكنوا فيها، وتغرسوا كروما شهية ولكنكم لن تشربوا من خمرها."], [12, "لأنني عالم بكثرة معاصيكم وعظم خطاياكم، إذ أنكم تضايقون البار أيها المرتشون الذين تصدون المسكين عن حقه في ساحة القضاء."], [13, "لهذا يصمت العاقل في مثل هذا الزمان الرديء."], [14, "اطلبوا الخير لا الشر لتحيوا، فيكون الرب الإله القدير معكم كما تقولون."], [15, "امقتوا الشر وأحبوا الخير وأقيموا العدل في ساحة القضاء، لعل الرب الإله القدير يترفق على بقية بيت يوسف."]]}, {"l": "Isa 47:3", "n": "", "vs": [[3, "فيظل عريك مكشوفا وعارك ظاهرا، فإني أنتقم ولا أعفو عن أحد."]]}, {"l": "Eze 13:5", "n": "", "vs": [[5, "لم تبرزوا إلى الثغرات، ولم تشيدوا جدارا حول بيت إسرائيل لتصمدوا في القتال في يوم الرب،"]]}, {"l": "Eze 22:30", "n": "", "vs": [[30, "فالتمست من بينهم رجلا واحدا يبني جدارا ويقف في الثغرة أمامي مدافعا عن الأرض، حتى لا أخربها فلم أجد."]]}, {"l": "Hos 13:8", "n": "", "vs": [[8, "وأنقض عليهم كدبة ثاكل، وأمزق قلوبهم أشلاء وأفترسهم هناك كلبوءة، ووحش البر يقطعهم إربا إربا."]]}, {"l": "Mat 5:25", "n": "", "vs": [[25, "سارع إلى استرضاء خصمك وأنت معه في الطريق إلى المحكمة، قبل أن يسلمك الخصم إلى القاضي، فيسلمك القاضي إلى الشرطي، فيلقيك في السجن."]]}, {"l": "Mat 24:44-51", "n": "", "vs": [[44, "فكونوا أنتم أيضا على استعداد، لأن ابن الإنسان سيرجع في ساعة لا تتوقعونها!"], [45, "فمن هو إذن ذلك العبد الأمين والحكيم الذي أقامه سيده على أهل بيته ليقدم لهم الطعام في أوانه؟"], [46, "طوبى لذلك العبد الذي يأتي سيده فيجده يقوم بعمله."], [47, "الحق أقول لكم: إنه سيقيمه على ممتلكاته كلها."], [48, "ولكن إذا قال ذلك العبد الشرير في قلبه: سيتأخر سيدي في رجوعه!"], [49, "وبدأ يضرب زملاءه العبيد ويأكل ويشرب مع السكيرين،"], [50, "فإن سيد ذلك العبد لابد أن يرجع في يوم لا يتوقعه، وساعة لا يعرفها،"], [51, "فيفصله ويجعل نصيبه مع المرائين، هناك يكون البكاء وصرير الأسنان!"]]}, {"l": "Mat 25:1-13", "n": "", "vs": [[1, "حينئذ يشبه ملكوت السماوات بعشر عذارى أخذن مصابيحهن وانطلقن لملاقاة العريس."], [2, "وكانت خمس منهن حكيمات، وخمس جاهلات."], [3, "فأخذت الجاهلات مصابيحهن دون زيت."], [4, "وأما الحكيمات، فأخذن مع مصابيحهن زيتا وضعنه في أوعية."], [5, "وإذ أبطأ العريس، نعسن جميعا ونمن."], [6, "وفي منتصف الليل، دوى الهتاف: ها هو العريس آت؛ فانطلقن لملاقاته!"], [7, "فنهضت العذارى جميعا وجهزن مصابيحهن."], [8, "وقالت الجاهلات للحكيمات: أعطيننا بعض الزيت من عندكن، فإن مصابيحنا تنطفىء!،"], [9, "فأجابت الحكيمات: ربما لا يكفي لنا ولكن. فاذهبن بالأحرى إلى بائعي الزيت واشترين لكن!"], [10, "وبينما الجاهلات ذاهبات للشراء، وصل العريس، فدخلت المستعدات معه إلى قاعة العرس، وأغلق الباب."], [11, "وبعد حين، رجعت العذارى الأخريات، وقلن: ياسيد، ياسيد، افتح لنا!"], [12, "فأجاب العريس: الحق أقول لكن: إني لا أعرفكن!"], [13, "فاسهروا إذن، لأنكم لا تعرفون اليوم ولا الساعة!"]]}, {"l": "Mar 13:32-37", "n": "", "vs": [[32, "وأما ذلك اليوم وتلك الساعة فلا يعرفهما أحد، لا الملائكة الذين في السماء ولا الابن، إلا الآب."], [33, "فانتبهوا واسهروا لأنكم لا تعرفون متى يحين الوقت!"], [34, "فالأمر أشبه بإنسان مسافر، ترك بيته، وأعطى عبيده السلطة معينا لكل واحد عمله، وأوصى حارس الباب أن يسهر."], [35, "إذن اسهروا، لأنكم لا تعرفون متى يعود رب البيت: أمساء، أم في منتصف الليل، أم عند صياح الديك، أم صباحا،"], [36, "لئلا يعود فجأة ويجدكم نائمين."], [37, "وما أقوله لكم، أقوله للجميع: اسهروا! »"]]}, {"l": "Luk 14:31", "n": "", "vs": [[31, "أم أي ملك ذاهب لمحاربة آخر، لا يجلس أولا ويستشير ليرى هل يقدر أن يواجه بعشرة آلاف ذلك الزاحف عليه بعشرين ألفا."]]}, {"l": "Luk 14:32", "n": "", "vs": [[32, "وإلا فإنه، والعدو مازال بعيدا، يرسل إليه وفدا، طالبا ما يؤول إلى الصلح."]]}, {"l": "Luk 21:3-36", "n": "", "vs": [[3, "فقال: «الحق أقول لكم إن هذه الأرملة الفقيرة قد ألقت أكثر منهم جميعا."], [4, "لأن هؤلاء جميعا قد ألقوا في التقدمات من الفائض عنهم. وأما هي، فمن حاجتها ألقت كل ما تملكه لمعيشتها!»"], [5, "وإذ تحدث بعضهم عن الهيكل بأنه مزين بالحجارة الجميلة وتحف النذور،"], [6, "قال: «إن هذا الذي ترونه، ستأتي أيام لا يبقى فيها حجر منه فوق حجر إلا ويهدم»."], [7, "فسألوه قائلين: «يامعلم، متى يحدث هذا؟ وما هي العلامة التي تظهر حين يقترب وقوعه؟»"], [8, "فقال: «انتبهوا! لا تضلوا! فإن كثيرين سيأتون باسمي قائلين إني أنا هو وإن الزمان قد اقترب: فلا تتبعوهم!"], [9, "وعندما تسمعون بالحروب والاَضطرابات، فلا ترتعبوا، لأن هذه الأمور لابد من حدوثها أولا، ولكن النهاية لا تأتي حالا بعدها!»"], [10, "ثم قال لهم: «ستنقلب أمة على أمة ومملكة على مملكة،"], [11, "وتحدث في عدة أماكن زلازل شديدة ومجاعات وأوبئة، وتظهر علامات مخيفة وآيات عظيمة من السماء."], [12, "ولكن قبل هذه الأمور كلها يمد الناس أيديهم إليكم ويضطهدونكم، فيسلمونكم إلى المجامع والسجون، ويسوقونكم للمثول أمام الملوك والحكام، من أجل اسمي."], [13, "ولكن ذلك سيتيح لكم فرصة للشهادة."], [14, "فضعوا في قلوبكم ألا تعدوا دفاعكم مسبقا،"], [15, "لأني سوف أعطيكم كلاما وحكمة لا يقدر جميع مقاوميكم أن يردوها أو يناقضوها."], [16, "وسوف يسلمكم حتى الوالدون والإخوة والأقرباء والأصدقاء، ويقتلون بعضا منكم،"], [17, "وتكونون مكروهين لدى الجميع من أجل اسمي."], [18, "ولكن شعرة من رؤوسكم لا تهلك البتة."], [19, "فباحتمالكم تربحون أنفسكم!"], [20, "وعندما ترون أورشليم محاصرة بالجيوش، فاعلموا أن خرابها قد اقترب."], [21, "عندئذ، ليهرب الذين في منطقة اليهودية إلى الجبال، وليرحل من المدينة من هم فيها، ولا يدخلها من هم في الأرياف:"], [22, "فإن هذه الأيام أيام انتقام يتم فيها كل ما قد كتب."], [23, "ولكن الويل للحبالى والمرضعات في تلك الأيام، لأن ضيقة عظيمة سوف تقع على الأرض وغضبا شديدا سينزل بهذا الشعب،"], [24, "فيسقطون بحد السيف ويساقون أسرى إلى جميع الأمم، وتبقى أورشليم تدوسها الأمم إلى أن تكتمل أزمنة الأمم."], [25, "وستظهر علامات في الشمس والقمر والنجوم، وتكون على الأرض ضيقة على الأمم الواقعة في حيرة، لأن البحر والأمواج تعج وتجيش،"], [26, "ويغمى على الناس من الرعب ومن توقع ما سوف يجتاح المسكونة، إذ تتزعزع قوات السماوات."], [27, "عندئذ يرون ابن الإنسان آتيا في السحاب بقوة ومجد عظيم."], [28, "ولكن عندما تبدأ هذه الأمور تحدث، فانتصبوا وارفعوا رؤوسكم لأن فداءكم يقترب»."], [29, "وضرب لهم مثلا: «انظروا إلى التينة وباقي الأشجار!"], [30, "عندما ترونها قد أورقت تعلمون من تلقاء أنفسكم أن الصيف بات قريبا."], [31, "فهكذا أنتم أيضا، عندما ترون هذه الأمور حادثة، فاعلموا أن ملكوت الله بات قريبا."], [32, "الحق أقول لكم: لا يزول هذا الجيل أبدا حتى تحدث هذه كلها."], [33, "إن السماء والأرض تزولان، ولكن كلامي لا يزول أبدا."], [34, "ولكن احذروا لأنفسكم لئلا تتثقل قلوبكم بالانغماس في اللذات وبالسكر وهموم الحياة، فيدهمكم ذلك اليوم فجأة؛"], [35, "فإنه سوف يطبق كالفخ على جميع الساكنين على وجه الأرض كلها."], [36, "فاسهروا إذن وتضرعوا في كل حين، لكي تتمكنوا من أن تنجوا من جميع هذه الأمور التي هي على وشك أن تحدث، وتقفوا أمام ابن الإنسان»."]]}, {"l": "1Th 5:2-4", "n": "", "vs": [[2, "لأنكم تعلمون يقينا أن يوم الرب سيأتي كما يأتي اللص في الليل."], [3, "فبينما الناس يقولون: حل السلام والأمن! ينزل بهم الهلاك المفاجيء كالمخاض الذي يدهم الحبلى، فلا يستطيعون أبدا أن يفلتوا."], [4, "غير أنكم أنتم، أيها الإخوة، لستم في الظلام حتى يفاجئكم ذلك اليوم كأنه لص."]]}, {"l": "Jam 4:1-10", "n": "", "vs": [[1, "من أين النزاع والخصام بينكم؟ أليس من لذاتكم تلك المتصارعة في أعضائكم؟"], [2, "فأنتم ترغبون في امتلاك ما لا يخصكم، لكن ذلك لا يتحقق لكم، فتقتلون، وتحسدون، ولا تتمكنون من بلوغ غايتكم. وهكذا تتخاصمون وتتصارعون! إنكم لا تمتلكون ما تريدونه، لأنكم لا تطلبونه من الله."], [3, "وإذا طلبتم منه شيئا، فإنكم لا تحصلون عليه: لأنكم تطلبون بدافع شرير، إذ تنوون أن تستهلكوا ما تنالونه لإشباع شهواتكم فقط."], [4, "أيها الخونة! ألستم تعلمون أن مصادقة العالم هي معاداة لله؟ فالذي يريد أن يصادق العالم، يجعل نفسه عدوا لله."], [5, "أتظنون أن الكتاب يتكلم عبثا! هل الروح الذي حل في داخلنا يغار عن حسد؟"], [6, "لا، بل إنه يجود علينا بنعمة أعظم. لذلك يقول الكتاب: «إن الله يقاوم المتكبرين، ولكنه يعطي المتواضعين نعمة»."], [7, "إذن، كونوا خاضعين لله. وقاوموا إبليس فيهرب منكم."], [8, "اقتربوا إلى الله فيقترب إليكم. أيها الخاطئون نظفوا أيديكم، وياأصحاب الرأيين طهروا قلوبكم."], [9, "احزنوا مولولين ونائحين وباكين. ليتحول ضحككم إلى نواح، وفرحكم إلى كآبة."], [10, "تواضعوا في حضرة الرب فيرفعكم!"]]}, {"l": "Rev 3:3", "n": "", "vs": [[3, "تذكر ما سبق أن تقبلته وسمعته، وتمسك بما آمنت به، وتب! فإن كنت لا تتنبه، آتيك كما يأتي اللص، ولا تدري في أية ساعة أفاجئك!"]]}], "kwAr": "تأهب", "noteAr": ""}], "arS": [["لذلك", ["H3651"]], ["، ", []], ["هذا", ["H2063"]], [" ما ", []], ["أجريه", ["H6213"]], [" عليك ", []], ["ياإسرائيل", ["H3478"]], [". ", []], ["فمن", ["H6118", "H3588"]], [" أجل ما ", []], ["أصنعه", ["H6213"]], [" بك ", []], ["تأهب", ["H3559"]], [" ", []], ["للقاء", ["H7125"]], [" ", []], ["إلهك", ["H430"]], [".", []]]}, {"c": 4, "v": 13, "text": "فانظر إنه هو صانع الجبال وخالق الرياح، الذي أعلن فكره للبشر، وأحال النهار إلى ليل، ومشى فوق مشارف الأرض، الرب الإله القدير اسمه.", "groups": [{"kw": "he that", "raw": "This is a most powerful description of the majesty of Jehovah, the God of hosts. Job_38:4-11; Psa_65:6; Isa_40:12; Zec_12:1", "note": "This is a most powerful description of the majesty of Jehovah, the God of hosts. Job_38:4-11; Psa_65:6; Isa_40:12; Zec_12:1", "refs": [{"l": "Job 38:4-11", "n": "", "vs": [[4, "أين كنت عندما أسست الأرض؟ أخبرني إن كنت ذا حكمة."], [5, "من حدد مقاييسها، إن كنت حقا تعرف؟ أو من مد عليها خيط القياس؟"], [6, "على أي شيء استقرت قواعدها؟ ومن وضع حجر زاويتها؟"], [7, "بينما كانت كواكب السماء تترنم معا وملائكة الله تهتف بفرح."], [8, "من حجز البحر ببوابات، عندما اندفق من رحم الأرض،"], [9, "حين جعلت السحب لباسا له والظلمة قماطه،"], [10, "عندما عينت له حدودا، وأثبت بواباته ومغاليقه في مواضعها،"], [11, "وقلت له: إلى هنا تخومك فلا تتعداها، وهنا يتوقف عتو أمواجك؟"]]}, {"l": "Psa 65:6", "n": "", "vs": [[6, "المرسخ الجبال بقوته، والمتنطق بالقدرة."]]}, {"l": "Isa 40:12", "n": "", "vs": [[12, "من كال المياه بكفه وقاس السماوات بالشبر وكال تراب الأرض بالكيل ووزن الجبال بقبان، والتلال بميزان؟"]]}, {"l": "Zec 12:1", "n": "", "vs": [[1, "وحي كلمة الرب بشأن إسرائيل. يقول الرب باسط السماوات ومرسي الأرض، وجابل روح الإنسان فيه:"]]}], "kwAr": "صانع الجبال", "noteAr": "هذا وصف بالغ القوة لجلال يهوه إله الجنود. انظر أي 38: 4-11؛ مز 65: 6؛ إش 40: 12؛ زك 12: 1"}, {"kw": "and createth", "raw": "Psa_135:7, Psa_147:18; Jer_10:13, Jer_51:16", "note": "", "refs": [{"l": "Psa 135:7", "n": "", "vs": [[7, "يصعد الأبخرة من أقاصي الأرض، ويحدث بروقا للمطر، ويطلق الريح من خزائنه."]]}, {"l": "Psa 147:18", "n": "", "vs": [[18, "ثم يصدر أمره فيذيبها. يرسل ريحه فتسيل المياه."]]}, {"l": "Jer 10:13", "n": "", "vs": [[13, "ما إن ينطق بصوته حتى تتجمع غمار المياه في السماوات، وتصعد السحب من أقاصي الأرض. يجعل للمطر بروقا، ويطلق الريح من خزائنه."]]}, {"l": "Jer 51:16", "n": "", "vs": [[16, "ما إن ينطق بصوته حتى تتجمع غمار المياه في السماوات، وتصعد السحب من أقاصي الأرض، ويجعل للمطر بروقا، ويطلق الريح من خزائنه."]]}], "kwAr": "وخالق", "noteAr": ""}, {"kw": "wind", "raw": "or, spirit, Joh_3:8", "note": "or, spirit, Joh_3:8", "refs": [{"l": "Joh 3:8", "n": "", "vs": [[8, "الريح تهب حيث تشاء وتسمع صفيرها، ولكنك لا تعلم من أين تأتي ولا إلى أين تذهب. هكذا كل من ولد من الروح»."]]}], "kwAr": "الرياح", "noteAr": "أو: «روح». انظر يو 3: 8"}, {"kw": "and declareth", "raw": "Psa_139:2; Dan_2:28; Mat_9:4; Luk_7:39, Luk_7:40; Joh_2:25", "note": "", "refs": [{"l": "Psa 139:2", "n": "", "vs": [[2, "أنت عرفت قعودي ونهوضي. فهمت فكري من بعيد."]]}, {"l": "Dan 2:28", "n": "", "vs": [[28, "ولكن هناك إله في السماء يعلن الخفايا. وقد عرف الملك نبوخذناصر عما سيحدث في آخر الأيام. أما حلمك والرؤيا التي شهدتها في منامك فهي هذه:"]]}, {"l": "Mat 9:4", "n": "", "vs": [[4, "وأدرك يسوع ما يفكرون فيه، فسألهم: «لماذا تفكرون بالشر في قلوبكم؟"]]}, {"l": "Luk 7:39", "n": "", "vs": [[39, "فلما رأى الفريسي الذي دعاه ذلك، حدث نفسه قائلا: «لو كان هذا نبيا، لعلم من هي هذه المرأة التي تلمسه، وما حالها؛ فإنها خاطئة!»"]]}, {"l": "Luk 7:40", "n": "", "vs": [[40, "فرد عليه يسوع قائلا: «ياسمعان، عندي شيء أقوله لك». أجاب: «قل يامعلم!»"]]}, {"l": "Joh 2:25", "n": "", "vs": [[25, "ولم يكن بحاجة إلى من يشهد له عن الإنسان، لأنه يعرف دخيلة الإنسان."]]}], "kwAr": "الذي أعلن", "noteAr": ""}, {"kw": "that maketh", "raw": "Amo_5:8, Amo_8:9; Exo_10:22, Exo_14:20; Isa_5:30; Jer_13:16", "note": "", "refs": [{"l": "Amo 5:8", "n": "", "vs": [[8, "إنه هو الذي خلق الثريا والجبار، ويحول دياجير الظلمة إلى نهار، والنهار إلى ليل، ويستدعي مياه البحر ويفيضها على وجه الأرض، الرب اسمه."]]}, {"l": "Amo 8:9", "n": "", "vs": [[9, "ويقول الرب: في ذلك اليوم أجعل الشمس تغرب عند الظهيرة، وأغمر الأرض بالظلمة في رابعة النهار."]]}, {"l": "Exo 10:22", "n": "", "vs": [[22, "فبسط موسى يده نحو السماء، فطغى ظلام كثيف على كل أرجاء أرض مصر لمدة ثلاثة أيام."]]}, {"l": "Exo 14:20", "n": "", "vs": [[20, "فدخل بين عسكر المصريين وعسكر الإسرائيليين، وصار عمود السحاب ظلاما قاتما على المصريين، وضياء على بني إسرائيل، فلم يقترب أحدهما من الآخر طوال الليل."]]}, {"l": "Isa 5:30", "n": "", "vs": [[30, "يزمجرون عليها في ذلك اليوم كهدير البحر. وإن جاس أحد في البلاد متفرسا لا يرى سوى الظلمة والضيق، حتى (انفراجات) الضوء (أي ومضات الرجاء) قد احتجبت وراء سحبه."]]}, {"l": "Jer 13:16", "n": "", "vs": [[16, "مجدوا الرب إلهكم قبل أن يجعل الظلام يخيم عليكم، وقبل أن تتعثر أقدامكم على الجبال المعتمة. أنتم ترتقبون النور ولكنه يحوله إلى ظلام الموت ويجعله ليلا دامسا."]]}], "kwAr": "وأحال", "noteAr": ""}, {"kw": "and treadeth", "raw": "Deu_32:13, Deu_33:29; Mic_1:3; Hab_3:19", "note": "", "refs": [{"l": "Deu 32:13", "n": "", "vs":
