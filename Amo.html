ما أنت فاتل مرثاة على رؤساء إسرائيل:"]]}, {"l": "Eze 19:14", "n": "", "vs": [[14, "واندلعت نار من فرعها التهمت أغصانها وأثمارها، فلم يبق منها فرع متين يصلح لصولجان متسلط. هذه مرثية لتكون قصيدة رثاء»."]]}, {"l": "Eze 26:17", "n": "", "vs": [[17, "عندئذ ينوحون عليك بمرثاة قائلين: كيف تلاشيت من بين البحار أيتها المدينة العامرة الشهيرة، التي كانت مسيطرة هي وسكانها على البحر، فألقوا رعبهم على جميع جيرانها."]]}, {"l": "Eze 27:2", "n": "", "vs": [[2, "«وأما أنت ياابن آدم، فاندب صور بمرثاة،"]]}, {"l": "Eze 27:27-32", "n": "", "vs": [[27, "غرقت ثروتك وأسواقك وبضاعتك وملاحوك وربابينك وقلافوك والمتاجرون بمنتوجاتك في أعماق البحر في يوم سقوطك."], [28, "ترتعش مسارح القطعان من صوت صراخ ربابينك."], [29, "يهجر كل المجذفين والملاحين وربابنة البحر سفنهم ويقفون على البر."], [30, "يرفعون صوتهم بالنواح عليك ويصرخون بمرارة، ويذرون ترابا فوق رؤوسهم، ويتمرغون في الرماد."], [31, "يحلقون شعر رؤوسهم عليك، ويرتدون المسوح، ويندبونك بمرارة نفس ندبا أليما."], [32, "وفي ندبهم يقيمون عليك مناحة، ويرثونك قائلين: أية مدينة عمها الصمت مثل صور في قلب البحار؟"]]}, {"l": "Eze 28:12", "n": "", "vs": [[12, "«ياابن آدم، اندب ملك صور بمرثاة وقل له هذا ما يعلنه السيد الرب: كنت خاتم الكمال، مفعما بالحكمة وكامل الجمال."]]}, {"l": "Eze 32:2", "n": "", "vs": [[2, "«ياابن آدم، اندب فرعون ملك مصر بمرثاة وقل له: أنت شبهت نفسك بشبل بين الأمم، مع أنك مثل تمساح في البحار. اقتحمت أنهارك وكدرت الماء بقدميك وعكرت أنهارهم."]]}, {"l": "Eze 32:16", "n": "", "vs": [[16, "هذه هي المرثاة التي ترثو بها بنات الأمم مصر وكل جندها، يقول السيد الرب»."]]}, {"l": "Mic 2:4", "n": "", "vs": [[4, "في ذلك اليوم يسخر أعداؤكم منكم، وتنوحون بمثل هذا الرثاء: «قد تم تدميرنا واستبدل الرب نصيب شعبه. كيف أخذه منا وقسم حقولنا بين آسرينا؟»"]]}], "kwAr": "أرثيكم", "noteAr": ""}], "arS": [["اسمعوا", ["H8085"]], [" ", []], ["هذه", ["H2088"]], [" ", []], ["المرثية", ["H7015"]], [" التي ", []], ["أرثيكم", ["H5375"]], [" بها ", []], ["يابني", ["H1004"]], [" ", []], ["إسرائيل", ["H3478"]], [".", []]]}, {"c": 5, "v": 2, "text": "قد سقطت عذراء إسرائيل ولن تنهض بعد. صارت طريحة على أرضها وليس من يقيمها.", "groups": [{"kw": "virgin", "raw": "Isa_37:22; Jer_14:17, Jer_18:13, Jer_31:4; Lam_2:13", "note": "", "refs": [{"l": "Isa 37:22", "n": "", "vs": [[22, "وهذا هو رد الرب عليه: ها العذراء ابنة صهيون قد احتقرتك واستهزأت بك، وهزت ابنة أورشليم رأسها سخرية منك."]]}, {"l": "Jer 14:17", "n": "", "vs": [[17, "وقل لهم هذا الكلام: «لتذرف عيناي دموعا ليلا ونهارا، ولا تكفا أبدا لأن أورشليم سحقت سحقا عظيما بضربة أليمة جدا."]]}, {"l": "Jer 18:13", "n": "", "vs": [[13, "لذلك هكذا يقول الرب: «اسألوا بين الشعوب من سمع بمثل هذا؟ قد ارتكبت العذراء إسرائيل أمرا شديد الهول."]]}, {"l": "Jer 31:4", "n": "", "vs": [[4, "لهذا أبنيك ياعذراء إسرائيل (أي أورشليم) فتبنين، وتتزينين ثانية بدفوفك، وتبرزين في مراقص الطربين."]]}, {"l": "Lam 2:13", "n": "", "vs": [[13, "بماذا أنذرك وبأي شيء أشبهك ياابنة أورشليم؟ بماذا أقارنك فأعزيك أيتها العذراء ابنة صهيون؟ إن خرابك عظيم كالبحر، فمن ذا يبرئك؟"]]}], "kwAr": "عذراء", "noteAr": ""}, {"kw": "is fallen", "raw": "2Ki_15:29, 2Ki_17:16; Isa_3:8; Hos_14:1", "note": "", "refs": [{"l": "2Ki 15:29", "n": "", "vs": [[29, "وفي أيامه هاجم تغلث فلاسر ملك أشور البلاد، واستولى على مدن عيون، وآبل بيت معكة، ويانوح، وقادش، وحاصور، وجلعاد والجليل، وكل أرض نفتالي وسبى أهلها إلى أشور."]]}, {"l": "2Ki 17:16", "n": "", "vs": [[16, "ونبذوا جميع وصايا الرب إلههم، وصنعوا لأنفسهم عجلين مسبوكين، وأقاموا تماثيل لعشتاروث وسجدوا لجميع كواكب السماء وعبدوا البعل."]]}, {"l": "Isa 3:8", "n": "", "vs": [[8, "قد كبت أورشليم؛ انهارت يهوذا لأنهما أساءتا بالقول والفعل إلى الرب وتمردتا على سلطانه."]]}, {"l": "Hos 14:1", "n": "", "vs": [[1, "ارجع تائبا ياإسرائيل إلى الرب إلهك، لأنك قد تعثرت بخطيئتك."]]}], "kwAr": "سقطت", "noteAr": ""}, {"kw": "she shall", "raw": "Isa_14:21, Isa_24:20, Isa_43:17; Jer_51:64", "note": "", "refs": [{"l": "Isa 14:21", "n": "", "vs": [[21, "أعدوا مذبحة لأبنائه جزاء إثم آبائهم، لئلا يقوموا ويرثوا الأرض فيملأوا وجه البسيطة مدنا."]]}, {"l": "Isa 24:20", "n": "", "vs": [[20, "ترنحت الأرض كالسكارى، وتمايلت كخيمة الناطور وناءت تحت ثقل إثمها فتهاوت ولم تنهض."]]}, {"l": "Isa 43:17", "n": "", "vs": [[17, "الذي يستدرج المركبات والخيول والجيش والمقاتلين، فيسقطون صرعى جميعا ولا يقومون، ويخمدون كذبالة وينطفئون."]]}, {"l": "Jer 51:64", "n": "", "vs": [[64, "وقل: كذلك تغرق بابل ولا تطفو بعد لما أوقعه عليها من عقاب فيعيا كل أهلها».إلى هنا تنتهي نبوءات إرميا."]]}], "kwAr": "ولن تنهض", "noteAr": ""}, {"kw": "she is", "raw": "Jer_4:20", "note": "", "refs": [{"l": "Jer 4:20", "n": "", "vs": [[20, "كارثة في أعقاب كارثة، والأرض قاطبة قد استحالت خرابا، فتهدمت في لحظة خيامي، وبيوتي تدمرت بغتة."]]}], "kwAr": "طريحة", "noteAr": ""}, {"kw": "none", "raw": "Amo_7:2-5, Amo_9:11; Isa_51:17, Isa_51:18; Jer_2:27, Jer_30:12-14; Lam_1:16-19; Eze_16:36, Eze_16:37; Hos_6:2", "note": "", "refs": [{"l": "Amo 7:2-5", "n": "", "vs": [[2, "وبعد أن فرغ الجراد من التهام عشب الأرض، قلت: «أيها السيد الرب، اصفح عن شعبك. إذ كيف يمكن ليعقوب أن ينهض، فإنه صغير؟»"], [3, "فعفا الرب عن هذا وقال: «لن يحدث ما رأيته»."], [4, "ثم هذا ما أراني السيد الرب: شاهدت السيد الرب يدعو للمحاكمة بالنار التي لعقت البحر العظيم فجف، وأكلت الحقول."], [5, "عندئذ قلت: «أيها السيد الرب، كف عن هذا، إذ كيف يمكن ليعقوب أن ينهض، فإنه صغير؟»"]]}, {"l": "Amo 9:11", "n": "", "vs": [[11, "في ذلك اليوم أقيم مسكن داود الذي تهاوى، وأسد ثغراته وأعمر خرائبه وأعيد بناءه كالعهد به في الأيام الغابرة."]]}, {"l": "Isa 51:17", "n": "", "vs": [[17, "استيقظي، استيقظي، انهضي ياأورشليم، يامن تجرعت من يد الرب كأس غضبه، يامن شربت ثمالة كأس الترنح."]]}, {"l": "Isa 51:18", "n": "", "vs": [[18, "لم يكن بين أبنائها الذين أنجبتهم من يهديها، ولا من يأخذ بيدها من كل البنين الذين ربتهم."]]}, {"l": "Jer 2:27", "n": "", "vs": [[27, "إذ قالوا لنصب الخشب: أنت أبي، وللحجر المنحوت صنما: أنت أنجبتني. وولوا أدبارهم وليس وجوههم نحوي، وفي وقت بليتهم استغاثوا بي قائلين: قم وأنقذنا."]]}, {"l": "Jer 30:12-14", "n": "", "vs": [[12, "لأن هذا ما يعلنه الرب: «إن جرحك لا شفاء له وضربتك لا علاج لها."], [13, "إذ لا يوجد من يدافع عن دعواك، ولا عقار لجرحك، ولا دواء لك."], [14, "قد نسيك محبوك، وأهملوك إهمالا، لأني ضربتك كما يضرب عدو، وعاقبتك عقاب مبغض قاس، لأن إثمك عظيم وخطاياك متكاثرة."]]}, {"l": "Lam 1:16-19", "n": "", "vs": [[16, "على هذه كلها أبكي. عيناي، عيناي تفيضان بالدموع، إذ ابتعد عني كل معز ينعش نفسي. هلك أبنائي لأن العدو قد ظفر."], [17, "تمد صهيون يديها تلتمس معزيا، ولكن على غير طائل. قد أمر الرب أن يكون مضايقو يعقوب هم جيرانه الذين حوله. قد أصبحت أورشليم رجسا بينهم."], [18, "الرب حقا عادل، وأنا قد تمردت على أمره. فاستمعوا ياجميع الشعوب واشهدوا وجعي. قد ذهب عذاراي وشباني إلى السبي."], [19, "دعوت محبي فخدعوني. فني كهنتي وشيوخي في المدينة وهم ينشدون قوتا لإحيا ء نفوسهم."]]}, {"l": "Eze 16:36", "n": "", "vs": [[36, "من حيث أنك أنفقت مالك وكشفت عن عريك في فواحشك لعشاقك ولسائر أصنامك الممقوتة، ومن أجل دماء أبنائك الذين قربتهم لها،"]]}, {"l": "Eze 16:37", "n": "", "vs": [[37, "ها أنا أحشد جميع عشاقك الذين تلذذت بهم، وجميع من تدلهت بهم مع كل الذين أبغضتهم فأجمعهم عليك من كل ناحية، وأكشف عن عريك فيشاهدون عورتك كلها،"]]}, {"l": "Hos 6:2", "n": "", "vs": [[2, "بعد يومين يحيينا، وفي اليوم الثالث يقيمنا، لنحيا أمامه."]]}], "kwAr": "ليس من يقيمها", "noteAr": ""}], "arS": [["قد ", []], ["سقطت", ["H5307"]], [" ", []], ["عذراء", ["H1330"]], [" ", []], ["إسرائيل", ["H3478"]], [" ولن ", []], ["تنهض", ["H6965"]], [" ", []], ["بعد", ["H3254"]], [". صارت ", []], ["طريحة", ["H5203"]], [" على ", []], ["أرضها", ["H127"]], [" وليس من ", []], ["يقيمها", ["H6965"]], [".", []]]}, {"c": 5, "v": 3, "text": "لأنه هكذا يقول الرب: إن المدينة التي قدمت ألفا من رجالها للحرب، لا يبقى لها منهم سوى مئة. والتي قدمت مئة منهم للحرب لا يبقى لبيت إسرائيل منهم سوى عشرة.", "groups": [{"kw": "The city", "raw": "Deu_4:27, Deu_28:62; Isa_1:9, Isa_10:22; Eze_12:16; Rom_9:27", "note": "", "refs": [{"l": "Deu 4:27", "n": "", "vs": [[27, "ويشتتكم الرب بين الأمم فتصبحون أقلية بين الشعوب التي يسوقكم إليها."]]}, {"l": "Deu 28:62", "n": "", "vs": [[62, "فتصيرون قلة بعد أن كنتم في كثرة نجوم السماء، لأنكم لم تسمعوا صوت الرب إلهكم."]]}, {"l": "Isa 1:9", "n": "", "vs": [[9, "لولا أن الرب القدير حفظ لنا بقية يسيرة، لأصبحنا مثل سدوم وعمورة."]]}, {"l": "Isa 10:22", "n": "", "vs": [[22, "مع أن شعبك ياإسرائيل كرمل البحر، فإن بقية فقط ترجع، لأن الله قضى بفنائهم، وقضاؤه عادل."]]}, {"l": "Eze 12:16", "n": "", "vs": [[16, "وأبقي على فئة قليلة منهم أنجيها من السيف والجوع والوباء، لكي يحدثوا بكل رجاساتهم بين الأمم التي فرقتهم فيها فيدركون أني أنا الرب»."]]}, {"l": "Rom 9:27", "n": "", "vs": [[27, "أما إشعياء، فيهتف متكلما على إسرائيل: «ولو كان بنو إسرائيل كرمل البحر عددا، فإن بقية منهم ستخلص."]]}], "kwAr": "المدينة", "noteAr": ""}], "arS": [["لأنه ", []], ["هكذا", ["H3541"]], [" ", []], ["يقول", ["H559"]], [" ", []], ["الرب", ["H3069"]], [": إن ", []], ["المدينة", ["H5892"]], [" التي ", []], ["قدمت", ["H3318"]], [" ", []], ["ألفا", ["H505"]], [" من رجالها للحرب، لا ", []], ["يبقى", ["H7604"]], [" لها منهم سوى ", []], ["مئة", ["H3967"]], [". والتي قدمت مئة منهم للحرب لا يبقى ", []], ["لبيت", ["H1004"]], [" ", []], ["إسرائيل", ["H3478"]], [" منهم سوى ", []], ["عشرة", ["H6235"]], [".", []]]}, {"c": 5, "v": 4, "text": "لأن هذا ما يقوله الرب لبيت إسرائيل: التمسوني فتحيوا.", "groups": [{"kw": "Seek", "raw": "Amo_5:6; Deu_30:1-8; 1Ch_28:9; 2Ch_15:2, 2Ch_20:3, 2Ch_34:3; Psa_14:2, Psa_27:8; Isa_55:6, Isa_55:7; Jer_29:12, Jer_29:13; Lam_3:25, Lam_3:26; Zep_2:3; Mat_7:8", "note": "", "refs": [{"l": "Amo 5:6", "n": "", "vs": [[6, "التمسوا الرب فتحيوا لئلا يندلع كنار تحرق بيت يوسف وتلتهم بيت إيل، وليس من يطفيء."]]}, {"l": "Deu 30:1-8", "n": "", "vs": [[1, "وعندما تحل بكم هذه البركات واللعنات كلها التي وضعتها أمامكم، ورددتموها في قلوبكم بين الأمم حيث شتتكم الرب إلهكم،"], [2, "ورجعتم إلى الرب إلهكم أنتم وبنوكم، وسمعتم لصوته من كل قلوبكم ونفوسكم بحسب كل ما أنا أوصيكم به اليوم،"], [3, "فإن الرب إلهكم يرد سبيكم ويرحمكم، ويلم شتاتكم من بين جميع الشعوب الذين نفاكم الرب إلهكم إليهم."], [4, "فإن كان قد بددكم إلى أقصى السماوات فمن هناك يجمعكم ويرجع بكم،"], [5, "ويعيدكم إلى الأرض التي ورثها آباؤكم فتمتلكونها، ويحسن إليكم ويكثركم أكثر من آبائكم."], [6, "ويطهر الرب إلهكم قلوبكم وقلوب نسلكم لتحبوا الرب إلهكم من كل قلوبكم ومن كل نفوسكم لتحيوا مطمئنين"], [7, "ويحول الرب إلهكم كل هذه اللعنات لتنصب على أعدائكم وعلى مبغضيكم الذين طردوكم،"], [8, "وأما أنتم فتطيعون صوت الرب من جديد وتعملون بجميع وصاياه التي أنا أوصيكم بها الآن."]]}, {"l": "1Ch 28:9", "n": "", "vs": [[9, "أما أنت ياابني سليمان، فاعرف إله أبيك واعبده بكمال قلب، وبنفس راغبة، لأن الرب يتفحص جميع القلوب، ويفهم كل تصور وفكر. فإن طلبته تجده، وإن تركته ينبذك إلى الأبد."]]}, {"l": "2Ch 15:2", "n": "", "vs": [[2, "فتوجه للقاء آسا وقال له: «اسمع لي ياآسا وياجميع أبناء يهوذا وبنيامين: الرب معكم ما برحتم معه، فإن طلبتموه يوجد لكم، وإن تخليتم عنه ينبذكم."]]}, {"l": "2Ch 20:3", "n": "", "vs": [[3, "فاعتراه الخوف وعقد العزم على الاستغاثة بالرب ونادى بصوم في جميع يهوذا."]]}, {"l": "2Ch 34:3", "n": "", "vs": [[3, "وفي السنة الثامنة من ملكه، وهو بعد فتى، ابتدأ يعبد إله جده داود. وفي السنة الثانية عشرة شرع يطهر أرض يهوذا وأورشليم من المرتفعات وتماثيل عشتاروث والأصنام والمسبوكات."]]}, {"l": "Psa 14:2", "n": "", "vs": [[2, "أشرف الرب على بني آدم ليرى هل هناك أي فاهم يطلب الله ؟"]]}, {"l": "Psa 27:8", "n": "", "vs": [[8, "قلت: اطلبوا وجهي! فوجهك يارب أطلب."]]}, {"l": "Isa 55:6", "n": "", "vs": [[6, "اطلبوا الرب مادام موجودا، ادعوه وهو قريب."]]}, {"l": "Isa 55:7", "n": "", "vs": [[7, "ليترك الشرير طريقه والأثيم أفكاره، وليتب إلى الرب فيرحمه، وليرجع إلى إلهنا لأنه يكثر الغفران."]]}, {"l": "Jer 29:12", "n": "", "vs": [[12, "فتدعونني وتقبلون، وتصلون إلي فأستجيب لكم،"]]}, {"l": "Jer 29:13", "n": "", "vs": [[13, "وتلتمسونني فتجدونني إذ تطلبونني بكل قلوبكم."]]}, {"l": "Lam 3:25", "n": "", "vs": [[25, "الرب صالح لمن يرجونه وللنفس التي تلتمسه."]]}, {"l": "Lam 3:26", "n": "", "vs": [[26, "خير للمرء أن ينتظر بصمت خلاص الرب."]]}, {"l": "Zep 2:3", "n": "", "vs": [[3, "التمسوا الرب ياودعاء الأرض الراضخين لحكمه. اطلبوا البر والتواضع لعلكم تجدون ملاذا في يوم سخط الرب."]]}, {"l": "Mat 7:8", "n": "", "vs": [[8, "فكل من يسأل، ينل؛ ومن يطلب، يجد؛ ومن يقرع، يفتح له."]]}], "kwAr": "التمسوني", "noteAr": ""}, {"kw": "and", "raw": "Psa_22:26, Psa_69:32, Psa_105:3, Ps 15, "فإن كنت ياشعب إسرائيل زانيا، فلا تجعل يهوذا يأثم أو يذهب إلى الجلجال أو إلى بيت آون ولا يحلف قائلا: حي هو الرب."]]}, {"l": "Hos 10:8", "n": "", "vs": [[8, "وتدمر أماكن العبادة على مشارف آون التي أضحت خطيئة إسرائيل، وينمو الشوك والحسك على مذابحهم، فيقولون للجبال: غطينا، وللتلال: اسقطي علينا."]]}, {"l": "Hos 10:15", "n": "", "vs": [[15, "هذا ما يجري عليكم يابيت إسرائيل عقابا لكم على إثمكم العظيم، ويتم القضاء على ملك إسرائيل عند انبلاج الفجر."]]}], "kwAr": "وبيت إيل", "noteAr": ""}, {"kw": "come", "raw": "Job_8:22; Psa_33:10; Isa_8:10, Isa_29:20; 1Co_1:28, 1Co_2:6; Rev_18:17", "note": "", "refs": [{"l": "Job 8:22", "n": "", "vs": [[22, "عندئذ يرتدي مبغضوك الخزي، وبيت الأشرار ينهار»."]]}, {"l": "Psa 33:10", "n": "", "vs": [[10, "الرب أحبط مؤامرة الأمم. أبطل أفكار الشعوب."]]}, {"l": "Isa 8:10", "n": "", "vs": [[10, "تشاوروا معا ولكن على غير طائل، ارسموا الخطط فلا تتحقق لأن الله معنا."]]}, {"l": "Isa 29:20", "n": "", "vs": [[20, "لأن العاتي قد انقرض، وباد المستهزيء، واستؤصل جميع الساهرين لارتكاب الإثم،"]]}, {"l": "1Co 1:28", "n": "", "vs": [[28, "وقد اختار الله ما كان في العالم وضيعا ومحتقرا وعديم الشأن، ليزيل ما له شأن،"]]}, {"l": "1Co 2:6", "n": "", "vs": [[6, "على أن لنا حكمة نتكلم بها بين البالغين. ولكنها حكمة ليست من هذا العالم ولا من رؤساء هذا العالم الزائلين."]]}, {"l": "Rev 18:17", "n": "", "vs": [[17, "وقد زال هذا الغنى كله في ساعة واحدة!"]]}], "kwAr": "تصبح عدما", "noteAr": ""}], "arS": [["لا ", []], ["تسعوا", ["H1875"]], [" وراء ", []], ["بيت", ["H1008"]], [" ", []], ["إيل", ["H1008"]], ["، ولا ", []], ["تدخلوا", ["H935"]], [" ", []], ["الجلجال", ["H1537"]], ["، ولا ", []], ["تعبروا", ["H5674"]], [" إلى بئر ", []], ["سبع", ["H884"]], ["، لأن أهل الجلجال لابد أن يتم ", []], ["سبيهم", ["H1540", "H1540"]], ["، وبيت إيل ", []], ["تصبح", ["H1961"]], [" ", []], ["عدما", ["H205"]], [".", []]]}, {"c": 5, "v": 6, "text": "التمسوا الرب فتحيوا لئلا يندلع كنار تحرق بيت يوسف وتلتهم بيت إيل، وليس من يطفيء.", "groups": [{"kw": "Seek", "raw": "Amo_5:4; Eze_33:11", "note": "", "refs": [{"l": "Amo 5:4", "n": "", "vs": [[4, "لأن هذا ما يقوله الرب لبيت إسرائيل: التمسوني فتحيوا."]]}, {"l": "Eze 33:11", "n": "", "vs": [[11, "قل لهم: حي أنا يقول السيد الرب، إني لا أبتهج بموت الشرير بل بأن يرتدع عن غيه ويحيا. ارجعوا، ارجعوا عن طرقكم الرديئة! لماذا تموتون ياشعب إسرائيل؟"]]}], "kwAr": "التمسوا", "noteAr": ""}, {"kw": "lest", "raw": "Exo_22:6", "note": "", "refs": [{"l": "Exo 22:6", "n": "", "vs": [[6, "إذا اندلعت نار وامتدت من الشوك إلى أكداس القمح أو السنابل النامية أو مزروعات الحقول، فعلى من أوقد النار أن يعوض الخسارة."]]}], "kwAr": "لئلا", "noteAr": ""}, {"kw": "the house", "raw": "Amo_6:6; Gen_48:8-20; Jos_18:5; Jdg_1:22, Jdg_1:23; 2Sa_19:20; 1Ki_11:28; Eze_37:19; Zec_10:6", "note": "", "refs": [{"l": "Amo 6:6", "n": "", "vs": [[6, "الشاربين خمرا في كؤوس، المتطيبين بأفضل العطور، ولا يكتئبون على خراب يوسف."]]}, {"l": "Gen 48:8-20", "n": "", "vs": [[8, "وأبصر إسرائيل ابني يوسف فسأل: «من هذان؟»"], [9, "فأجابه يوسف: «هما ابناي اللذان رزقني إياهما الله هنا». فقال: «أدنهما مني فأباركهما»."], [10, "وكانت عينا إسرائيل قد كلتا من الشيخوخة، فلم يكن قادرا على النظر، فقربهما إليه فقبلهما واحتضنهما"], [11, "وقال إسرائيل ليوسف: «ما كنت أظن أنني أبصر وجهك، وهوذا الله قد أراني ذريتك أيضا»."], [12, "ثم أبعدهما يوسف عن حضن أبيه وسجد في حضرته إلى الأرض."], [13, "وأخذ يوسف أفرايم بيمينه وأوقفه إلى يسار إسرائيل، وأخذ منسى بيساره وأوقفه إلى يمينه،"], [14, "فمد إسرائيل يمينه، متعمدا، ووضعها على رأس أفرايم وهو الصغير، ويساره على رأس منسى مع أنه البكر."], [15, "وبارك يوسف قائلا: «إن الله الذي سلك أمامه أبواي إبراهيم وإسحق، الله الذي رعاني منذ وجودي إلى هذا اليوم،"], [16, "الملاك الذي أنقذني من كل شر، يبارك الغلامين، وليدع عليهما اسمي واسما أبوي إبراهيم وإسحق، وليكثرا كثيرا في الأرض»."], [17, "وعندما رأى يوسف أن أباه قد وضع يده اليمنى على رأس أفرايم ساءه ذلك، فأمسك بيد أبيه لينقلها من رأس أفرايم إلى رأس منسى."], [18, "وقال يوسف لأبيه: «ليس هكذا ياأبي. فهذا هو البكر، ضع يمينك على رأسه»."], [19, "فأبى أبوه وقال: «أنا أعرف هذا ياابني، أنا أعرف هذا، فإنه أيضا يصبح أمة عظيمة، ولكن أخاه الصغير يصبح أكبر منه، وذريته تصير جمهورا من الأمم»."], [20, "وباركهما في ذلك اليوم قائلا: «بك يبارك بنو إسرائيل قائلين: «ليجعلك الله مثل أفرايم ومثل منسى». وهكذا قدم أفرايم على منسى."]]}, {"l": "Jos 18:5", "n": "", "vs": [[5, "وليقسموها إلى سبعة أقسام، فيمكث سبط يهوذا ضمن حدوده من الجنوب، ويقيم بيت يوسف في مناطقهم المعينة شمالا."]]}, {"l": "Jdg 1:22", "n": "", "vs": [[22, "وهاجم أبناء سبط يوسف بيت إيل، فكان الرب معهم (ونصرهم)."]]}, {"l": "Jdg 1:23", "n": "", "vs": [[23, "وبينما كان فريق الاستكشاف يراقب بيت إيل، التي كانت تدعى قبلا لوز،"]]}, {"l": "2Sa 19:20", "n": "", "vs": [[20, "لأن عبدك قد أدرك أني قد أخطأت، ها أنا قد جئت اليوم في طليعة بيت يوسف لاستقبال سيدي الملك»."]]}, {"l": "1Ki 11:28", "n": "", "vs": [[28, "وكان يربعام رجلا شديد المراس. فلما رأى سليمان أن الشاب نشيط مجتهد، أقامه مشرفا على أعمال التسخير في أرض سبط يوسف."]]}, {"l": "Eze 37:19", "n": "", "vs": [[19, "فقل لهم: هذا ما يعلنه السيد الرب: ها أنا أتناول قضيب يوسف الذي في حوزة أفرايم وأسباط إسرائيل رفاقه، وأضم إليه قضيب يهوذا، وأجعلهم جميعا قضيبا واحدا فيصبحون واحدا في يدي."]]}, {"l": "Zec 10:6", "n": "", "vs": [[6, "إني أشدد شعب يهوذا وأخلص ذرية يوسف وأردهم إلى أرضهم لأني أكن لهم الرحمة، فيكونون كأني لم أنبذهم لأني أنا الرب إلههم فأستجيبهم."]]}], "kwAr": "بيت يوسف", "noteAr": ""}, {"kw": "there", "raw": "Isa_1:31; Jer_4:4, Jer_7:20; Eze_20:47, Eze_20:48; Mar_9:43-48", "note": "", "refs": [{"l": "Isa 1:31", "n": "", "vs": [[31, "فيصير القوي كنسالة وأعماله (الشريرة) شرارة لاهبة فيحترقان معا بنار لا يقوى أحد على إخمادها»."]]}, {"l": "Jer 4:4", "n": "", "vs": [[4, "اختتنوا للرب، وأزيلوا قلف قلوبكم (أي طهروا عقولكم وقلوبكم وليس أجسادكم فقط) لئلا يتفجر غضبي كنار فتحرق وليس من يخمدها، من جراء أعمالكم الشريرة."]]}, {"l": "Jer 7:20", "n": "", "vs": [[20, "لذلك يعلن السيد الرب: ها غضبي وسخطي ينصبان على هذا الموضع، وعلى البشر والبهائم والأشجار والحقول وأثمار الأرض، فيتقدان ولا يخمدان»."]]}, {"l": "Eze 20:47", "n": "", "vs": [[47, "وقل لغابات النقب: اسمعوا قضاء الرب، فهذا ما يعلنه السيد الرب: ه رة أو سبط مال قلبه عن الرب إلهنا، فغوى ليعبد آلهة تلك الأمم. فاحرصوا ألا يكون بينكم من تأصل فيه الشر، فيحمل ثمرا علقما ساما."]]}, {"l": "Isa 1:23", "n": "", "vs": [[23, "أصبح رؤساؤك عصاة وشركاء لصوص، يولعون بالرشوة ويسعون وراء الهبات، لا يدافعون عن اليتيم، ولا ترفع إليهم دعوى الأرملة»."]]}, {"l": "Isa 5:7", "n": "", "vs": [[7, "لأن كرم الرب القدير هو بيت إسرائيل، ورجال يهوذا هم غرس بهجته. ولكن عندما انتظر حقا وجد سفك دماء، وعندما التمس عدلا رأى صراخا."]]}, {"l": "Isa 10:1", "n": "", "vs": [[1, "ويل للذين يسنون شرائع ظلم، وللكتبة الذين يسجلون أحكام جور!"]]}, {"l": "Isa 59:13", "n": "", "vs": [[13, "تمردنا وتنكرنا للرب. ارتددنا عن اتباع طرق إلهنا، تفوهنا بالظلم والعصيان افتراء، وبكلام زور من القلب."]]}, {"l": "Isa 59:14", "n": "", "vs": [[14, "قد ارتد عنا الإنصاف، ووقف العدل بعيدا، إذ سقط الحق صريعا في الشوارع، والبر لم يستطع الدخول."]]}, {"l": "Hos 10:4", "n": "", "vs": [[4, "ينطقون بكلام لغو ويبرمون عهودا بأقسام باطلة، فيحل بهم القضاء كأعشاب سامة نبتت في أرض محروثة."]]}, {"l": "Hab 1:12-14", "n": "", "vs": [[12, "ألست أنت منذ الأزل أيها الرب إلهي، قدوسي؟ لهذا لن نفنى. لقد أقمت الكلدانيين لمقاضاتنا واخترتهم ياصخرتي لتعاقبنا."], [13, "إن عينيك أطهر من أن تشهدا الشر، وأنت لا تطيق رؤية الظلم، فكيف تحتمل مشاهدة الأثمة، وتصمت عندما يبتلع المنافقون من هم أبر منهم؟"], [14, "وكيف تجعل الناس كأسماك البحر، أو كأسراب الحشرات التي لا قائد لها؟"]]}], "kwAr": "تحولون", "noteAr": ""}, {"kw": "leave", "raw": "Psa_36:3, Psa_125:5; Eze_3:20, Eze_18:24, Eze_33:12, Eze_33:13, Eze_33:18; Zep_1:6", "note": "", "refs": [{"l": "Psa 36:3", "n": "", "vs": [[3, "كلام فمه إثم ونفاق، وقد كف عن التعقل لأجل عمل الخير."]]}, {"l": "Psa 125:5", "n": "", "vs": [[5, "أما الذين يحيدون إلى طرق ملتوية، فإن الرب يسوقهم إلى الهلاك مع فاعلي الإثم. ليكن السلام لشعب إسرائيل."]]}, {"l": "Eze 3:20", "n": "", "vs": [[20, "وكذلك إن حاد البار عن بره وارتكب الإثم، ونصبت أمامه معثرة، فإنه يموت. ولأنك لم تنذره فإنه يموت بذنبه ولا تذكر بعد أعماله الصالحة التي قام بها، أما دمه فمن يدك أطلبه."]]}, {"l": "Eze 18:24", "n": "", "vs": [[24, "وإذا تحول الصديق عن بره وارتكب إثما على غرار كل الرجاسات التي يرتكبها الشرير، أفيحيا؟ إن كل ما صنعه من بر لا يذكر له. إنما يموت بخيانته التي خانها، وما اقترفه من خطايا."]]}, {"l": "Eze 33:12", "n": "", "vs": [[12, "وأنت ياابن آدم، قل لأبناء شعبك: لا ينجو البار ببره في يوم معصيته، ولا يعثر الشرير بشره في يوم توبته. كذلك لا يستطيع البار أن يحيا ببره في يوم اقترافه لخطيئته."]]}, {"l": "Eze 33:13", "n": "", "vs": [[13, "وإن قلت للبار إنك لا محالة تحيا، فاعتمد على بره وأثم، فإن بره كله لا يذكر له، بل يموت بما ارتكب من إثم."]]}, {"l": "Eze 33:18", "n": "", "vs": [[18, "فعند ارتداد البار عن بره وارتكابه الإثم فإنه به يموت."]]}, {"l": "Zep 1:6", "n": "", "vs": [[6, "والذين ارتدوا عن اتباع الرب، والذين كفوا عن طلبه والتماسه."]]}], "kwAr": "وتطرحون", "noteAr": ""}], "arS": [["إنكم ", []], ["تحولون", ["H2015"]], [" ", []], ["العدل", ["H4941"]], [" ", []], ["مرارة", ["H3939"]], ["، ", []], ["وتطرحون", ["H5117"]], [" ", []], ["الحق", ["H6666"]], [" إلى ", []], ["الأرض", ["H776"]], [".", []]]}, {"c": 5, "v": 8, "text": "إنه هو الذي خلق الثريا والجبار، ويحول دياجير الظلمة إلى نهار، والنهار إلى ليل، ويستدعي مياه البحر ويفيضها على وجه الأرض، الرب اسمه.", "groups": [{"kw": "maketh", "raw": "Job_9:9, Job_38:31, Job_38:32", "note": "", "refs": [{"l": "Job 9:9", "n": "", "vs": [[9, "هو الذي صنع النعش والجبار والثريا ومخادع الجنوب،"]]}, {"l": "Job 38:31", "n": "", "vs": [[31, "هل تربط سلاسل الثريا، أم تفك عقد الجوزاء؟"]]}, {"l": "Job 38:32", "n": "", "vs": [[32, "هل تهدي كواكب المنازل في فصولها، أم تهدي النعش مع بناته؟"]]}], "kwAr": "خلق", "noteAr": ""}, {"kw": "and turneth", "raw": "Job_12:22, Job_38:12, Job_38:13; Psa_107:10-14; Mat_4:16; Luk_1:79", "note": "", "refs": [{"l": "Job 12:22", "n": "", "vs": [[22, "يكشف الأغوار في الظلام، ويبرز الظلمات المتكاثفة إلى النور،"]]}, {"l": "Job 38:12", "n": "", "vs": [[12, "هل أمرت مرة الصبح في أيامك، وأريت الفجر موضعه،"]]}, {"l": "Job 38:13", "n": "", "vs": [[13, "ليقبض على أكناف الأرض وينفض الأشرار منها؟"]]}, {"l": "Psa 107:10-14", "n": "", "vs": [[10, "كانوا جالسين كالأسرى في الظلام وظلال الموت، موثقين بالذل والحديد،"], [11, "لأنهم تمردوا على كلام الله، واستهانوا بمشورة العلي."], [12, "فأذل قلوبهم بالجهد المضني. تعثروا ولم يكن من معين."], [13, "ثم استغاثوا بالرب في ضيقهم فأنقذهم من مصائبهم."], [14, "أخرجهم من الظلام وظلال الموت وحطم أصفادهم."]]}, {"l": "Mat 4:16", "n": "", "vs": [[16, "الشعب الجالس في الظلمة، أبصر نورا عظيما، والجالسون في أرض الموت وظلاله، أشرق عليهم نور ! »"]]}, {"l": "Luk 1:79", "n": "", "vs": [[79, "ليضيء على القابعين في الظلام وظل الموت، ويهدي خطانا في طريق السلام»."]]}], "kwAr": "ويحول", "noteAr": ""}, {"kw": "maketh", "raw": "Amo_4:13, Amo_8:9; Exo_10:21-23, Exo_14:24-28; Psa_104:20, Psa_105:28; Isa_59:10", "note": "", "refs": [{"l": "Amo 4:13", "n": "", "vs": [[13, "فانظر إنه هو صانع الجبال وخالق الرياح، الذي أعلن فكره للبشر، وأحال النهار إلى ليل، ومشى فوق مشارف الأرض، الرب الإله القدير اسمه."]]}, {"l": "Amo 8:9", "n": "", "vs": [[9, "ويقول الرب: في ذلك اليوم أجعل الشمس تغرب عند الظهيرة، وأغمر الأرض بالظلمة في رابعة النهار."]]}, {"l": "Exo 10:21-23", "n": "", "vs": [[21, "فقال الرب لموسى: «أبسط يدك نحو السماء فيطغى ظلام على كل أرجاء مصر حتى يكاد يلمس لكثافته»."], [22, "فبسط موسى يده نحو السماء، فطغى ظلام كثيف على كل أرجاء أرض مصر لمدة ثلاثة أيام."], [23, "فلم يتمكن أحد من أن يرى أخاه، ولا غادر أحد مكانه طوال ثلاثة أيام. غير أن النور كان يغمر بني إسرائيل في أماكن إقامتهم."]]}, {"l": "Exo 14:24-28", "n": "", "vs": [[24, "وقبل طلوع الصباح أشرف الرب في عمود النار والسحاب على عسكر المصريين وأربكهم."], [25, "فجعل عجلات مركباتهم تتخلع. فطفقوا يجرونها بمشقة حتى قال المصريون: «لنهرب من الإسرائيليين، لأن الرب يحارب عنهم ضدنا»."], [26, "وقال الرب لموسى: «ابسط يدك فوق البحر ليرتد الماء على المصريين مع مركباتهم وفرسانهم»."], [27, "فبسط موسى يده فوق البحر عند انبثاق الصباح، فارتد البحر إلى موضعه على المصريين الهاربين في اتجاهه، فجرفهم الرب نحو وسط البحر."], [28, "وارتدت المياه وأغرقت المركبات والفرسان وكل جيش فرعون الذي لحق بهم إلى البحر، فلم يفلت منهم ناج واحد."]]}, {"l": "Psa 104:20", "n": "", "vs": [[20, "تحل الظلمة فيصير ليل يجوس فيه كل حيوان الغابة."]]}, {"l": "Psa 105:28", "n": "", "vs": [[28, "بعث ظلاما، تغشت به الأرض، ولكن المصريين عاندوا كلمته."]]}, {"l": "Isa 59:10", "n": "", "vs": [[10, "نتحسس الحائط كالأعمى، ونتلمس كالمكفوف، نتعثر في الظهيرة كما لو كنا نسير في عتمة الليل ونكون كالأموات بين المتدفقين بالحياة"]]}], "kwAr": "والنهار إلى ليل", "noteAr": ""}, {"kw": "that calleth", "raw": "Amo_9:6; Gen_7:11-20; 1Ki_18:44, 1Ki_18:45; Job_37:13, Job_38:34", "note": "", "refs": [{"l": "Amo 9:6", "n": "", "vs": [[6, "هو الذي يبني مخادعه العليا في السماوات ويؤسس قبته على الأرض، الذي يدعو مياه البحر ويسكبها على وجه الثرى، الرب اسمه."]]}, {"l": "Gen 7:11-20", "n": "", "vs": [[11, "ففي سنة ست مئة من عمر نوح، في الشهر الثاني، في اليوم السابع عشر منه، تفجرت المياه من اللجج العميقة في باطن الأرض، وهطلت أمطار السماء الغزيرة،"], [12, "واستمر هذا الطوفان على الأرض ليلا ونهارا مدة أربعين يوما."], [13, "في ذلك اليوم الذي بدأ فيه الطوفان دخل نوح وزوجته وأبناؤه سام وحام ويافث وزوجاتهم الثلاث إلى الفلك."], [14, "ودخل معهم أيضا من الوحوش والبهائم والزواحف والطيور وذوات الأجنحة كل حسب أصنافها؛"], [15, "من جميع المخلوقات الحية أقبلت إلى الفلك، ودخلت مع نوح زوجين زوجين"], [16, "ذكرا وأنثى دخلت، من كل ذي جسد، كما أمره الله. ثم أغلق الرب عليه باب الفلك."], [17, "ودام الطوفان أربعين يوما على الأرض، وطغت المياه ورفعت الفلك فوق الأرض،"], [18, "وتكاثرت المياه على الأرض وطغت جدا، فكان الفلك يطفو فوق المياه."], [19, "وتعاظمت المياه جدا فوق الأرض حتى أغرقت جميع الجبال العالية التي تحت السماء كلها."], [20, "وبلغ ارتفاعها خمس عشرة ذراعا (نحو سبعة أمتار) عن أعلى الجبال،"]]}, {"l": "1Ki 18:44", "n": "", "vs": [[44, "وفي المرة السابعة قال الغلام: «أرى غيمة صغيرة في حجم كف إنسان صاعدة من البحر». فقال إيليا: «انطلق وقل لأخآب أعد مركبتك وانزل من الجبل لئلا يعيقك المطر عن السفر»."]]}, {"l": "1Ki 18:45", "n": "", "vs": [[45, "وسرعان ما تلبدت السماء بالغيوم، وهبت ريح عاصفة، وهطل مطر غزير، فاندفع أخآب بمركبته نحو يزرعيل."]]}, {"l": "Job 37:13", "n": "", "vs": [[13, "يرسلها ن يملة». فقال يهوشافاط: «لا تقل هذا أيها الملك»."]]}, {"l": "2Ch 24:20-22", "n": "", "vs": [[20, "فحل روح الله على زكريا بن يهوياداع الكاهن، فوقف أمام الشعب وقال لهم: «هذا ما يقوله الله : لماذا تتعدون أوامر الرب فلا تفلحون؟ لقد نبذتم الرب فنبذكم الرب»."], [21, "فكادوا له حتى أمر الملك برجمه بالحجارة في ساحة الهيكل."], [22, "ولم يذكر الملك الفضل الذي أسداه إليه يهوياداع، بل قتل ابنه، وفيما هو يلفظ أنفاسه قال: «لينظر الرب ويجر قضاءه»."]]}, {"l": "2Ch 25:16", "n": "", "vs": [[16, "فقاطعه الملك وقال: «هل أقمناك أحد مشيري الملك؟ كف لئلا تقتل». فانصرف النبي وهو يقول: «قد أيقنت أن الله قضى بإهلاكك، لأنك ارتكبت هذا وأبيت أن تسمع لمشورتي»."]]}, {"l": "2Ch 36:16", "n": "", "vs": [[16, "فكانوا يهزأون برسل الله، ورفضوا كلامه، واستهانوا بأنبيائه، حتى ثار غضب الرب على شعبه وامتنع كل شفاء!"]]}, {"l": "Pro 9:7", "n": "", "vs": [[7, "من يسع لتقويم الساخر يلحقه الهوان، ومن يوبخ الشرير يعده عيبه."]]}, {"l": "Pro 9:8", "n": "", "vs": [[8, "لا تقرع الساخر لئلا يبغضك، ووبخ الحكيم فيحبك."]]}, {"l": "Isa 29:21", "n": "", "vs": [[21, "الذين بكلمة جعلوا الإنسان يخطيء، ونصبوا فخا لمن يفحمهم في ساحة القضاء، وصدوا البار بادعاءاتهم الجوفاء."]]}, {"l": "Jer 20:7-10", "n": "", "vs": [[7, "يارب قد أقنعتني فاقتنعت، أنت أقوى مني فغلبت، فأصبحت مثار سخرية طوال النهار. كل واحد يستهزيء بي."], [8, "لأني كلما تكلمت أصرخ منددا، وأنادي: «ظلم واغتصاب» فجلبت علي كلمة الرب الاحتقار والعار طوال النهار."], [9, "إن قلت: «سأكف عن ذكره ولا أتكلم باسمه بعد» صار كلامه في قلبي كنار محرقة محصورة في عظامي، فأعياني كتمانه وعجزت عن كبته."], [10, "لأني سمعت نفثات تهديد من كثيرين، وأحاط بي رعب من كل جانب. يقولون: «اشتكوا عليه فنشتكي عليه»، حتى جميع أصدقائي الحميمين يرقبون كبوتي قائلين: «لعله يتعثر فنتغلب عليه وننتقم منه»."]]}, {"l": "Joh 7:7", "n": "", "vs": [[7, "لا يقدر العالم أن يبغضكم، ولكنه يبغضني أنا، لأني أشهد عليه أن أعماله شريرة."]]}, {"l": "Joh 15:19", "n": "", "vs": [[19, "لو كنتم من أهل العالم، لكان العالم يحب أهله، ولكن لأنكم لستم من أهل العالم، بل إني اخترتكم من وسط العالم، لذلك يبغضكم العالم."]]}, {"l": "Joh 15:22-24", "n": "", "vs": [[22, "لو لم آت وأكلمهم، لما كانت لهم خطيئة؛ ولكن لا عذر لهم الآن في خطيئتهم."], [23, "الذي يبغضني، يبغض أبي أيضا."], [24, "ولو لم أعمل بينهم أعمالا لم يعملها أحد غيري، لما كانت لهم خطيئة. ولكنهم أبغضوني وأبغضوا أبي، مع أنهم رأوا تلك الأعمال."]]}, {"l": "Rev 11:10", "n": "", "vs": [[10, "ويشمت بهما أهل الأرض، فيفرحون كأنهم في عيد، ويتبادلون الهدايا، لأن هذين النبيين كانا قد عذباهم كثيرا."]]}], "kwAr": "أبغضوا", "noteAr": ""}, {"kw": "abhor", "raw": "Jer_17:16, Jer_17:17; Joh_3:20, Joh_8:45-47", "note": "", "refs": [{"l": "Jer 17:16", "n": "", "vs": [[16, "أما أنا فلم أتهرب من أن أكون راعيا لديك، وأنت تعرف أني لم أتمن مجيء يوم المحنة، وتعلم ما نطقت به شفتاي، لأن كل ما صدر عنهما كان في محضرك."]]}, {"l": "Jer 17:17", "n": "", "vs": [[17, "لا تكن مثار رعب لي، فأنت ملاذي في يوم الشر."]]}, {"l": "Joh 3:20", "n": "", "vs": [[20, "فكل من يعمل الشر يبغض النور، ولا يأتي إليه مخافة أن تفضح أعماله."]]}, {"l": "Joh 8:45-47", "n": "", "vs": [[45, "أما أنا فلأني أقول الحق، لستم تصدقونني."], [46, "من منكم يثبت علي خطيئة؟ فما دمت أقول الحق، فلماذا لا تصدقونني؟"], [47, "من كان من الله حقا، يسمع كلام الله. ولكنكم ترفضون كلام الله، لأنكم لستم من الله!»"]]}], "kwAr": "ويكرهون", "noteAr": ""}], "arS": [["قد ", []], ["أبغضوا", ["H8130"]], [" من ", []], ["يندد", ["H3198"]], [" بالجور في ", []], ["ساحة", ["H8179"]], [" القضاء، ", []], ["ويكرهون", ["H8581"]], [" من ", []], ["ينطق", ["H1696"]], [" ", []], ["بالحق", ["H8549"]], [".", []]]}, {"c": 5, "v": 11, "text": "فلأنكم تطأون المسكين وتبتزون منه رشوة قمح حتى تشيدوا بيوتا من حجارة منحوتة، فإنكم لن تسكنوا فيها، وتغرسوا كروما شهية ولكنكم لن تشربوا من خمرها.", "groups": [{"kw": "treading", "raw": "Amo_4:1; Isa_5:7, Isa_5:8, Isa_59:13, Isa_59:14; Mic_2:2, Mic_3:1-3; Jam_2:6; Rev_11:8-10", "note": "", "refs": [{"l": "Amo 4:1", "n": "", "vs": [[1, "اسمعي هذه الكلمة يانساء باشان، اللواتي يقمن في جبل السامرة، ممن يظلمن المسكين ويسحقن الفقراء واللواتي يقلن لأزواجهن: هاتوا مسكرا لنشرب."]]}, {"l": "Isa 5:7", "n": "", "vs": [[7, "لأن كرم الرب القدير هو بيت إسرائيل، ورجال يهوذا هم غرس بهجته. ولكن عندما انتظر حقا وجد سفك دماء، وعندما التمس عدلا رأى صراخا."]]}, {"l": "Isa 5:8", "n": "", "vs": [[8, "اشتريتم البيوت والحقول حتى لم يبق لأحد غيركم مكان يسكن فيه! صارت الأرض لكم وحدكم!"]]}, {"l": "Isa 59:13", "n": "", "vs": [[13, "تمردنا وتنكرنا للرب. ارتددنا عن اتباع طرق إلهنا، تفوهنا بالظلم والعصيان افتراء، وبكلام زور من القلب."]]}, {"l": "Isa 59:14", "n": "", "vs": [[14, "قد ارتد عنا الإنصاف، ووقف العدل بعيدا، إذ سقط الحق صريعا في الشوارع، والبر لم يستطع الدخول."]]}, {"l": "Mic 2:2", "n": "", "vs": [[2, "يشتهون حقولا ويغتصبونها، وبيوتا فيستولون عليها. يجورون على الرجل وعلى بيته والإنسان وميراثه."]]}, {"l": "Mic 3:1-3", "n": "", "vs": [[1, "وقلت اسمعوا يارؤساء يعقوب وياقضاة شعب إسرائيل: ألا ينبغي لكم أن تعرفوا الحق؟"], [2, "أنتم يامن تبغضون الخير وتحبون الشر، وتسلخون جلود شعبي وتجردون لحومهم عن عظامهم."], [3, "الذين تأكلون لحوم شعبي، وتسلخون جلودهم عنهم وتهشمون عظامهم، وتقطعونهم كما يقطع اللحم في القدر، أو كاللحم المعد للمقلى."]]}, {"l": "Jam 2:6", "n": "", "vs": [[6, "ولكنكم أنتم عاملتم الفقير معاملة مهينة. ألا تعرفون أن الأغنياء هم الذين يتسلطون عليكم ويجرونكم إلى المحاكم،"]]}, {"l": "Rev 11:8-10", "n": "", "vs": [[8, "وتبقى جثتاهما مطروحتين في ساحة المدينة العظمى التي ترمز إليها «سدوم» أو «مصر»، حيث صلب ربهما."], [9, "فيراهما أناس من مختلف الشعوب والقبائل واللغات والأمم، مدة ثلاثة أيام ونصف يوم، ولا يؤذن لأحد بدفنهما."], [10, "ويشمت بهما أهل الأرض، فيفرحون كأنهم في عيد، ويتبادلون الهدايا، لأن هذين النبيين كانا قد عذباهم كثيرا."]]}], "kwAr": "تطأون", "noteAr": ""}, {"kw": "ye have built", "raw": "Deu_28:30,Deu_28:38, Deu_28:39; Isa_65:21, Isa_65:22; Mic_6:15; Zep_1:13; Hag_1:6", "note": "", "refs": [{"l": "Deu 28:30", "n": "", "vs": [[30, "يخطب أحدكم امرأة ولكن آخر يتزوجها ويضاجعها. تبني بيتا ولا تسكن فيه، وتغرس كرما ولا تجنيه."]]}, {"l": "Deu 28:38", "n": "", "vs": [[38, "تبذرون كثيرا من البذار في الحقول، ولا تحصدون إلا القليل، لأن الجراد يلتهمه."]]}, {"l": "Deu 28:39", "n": "", "vs": [[39, "تكدحون في غرس كروم ومن خمرها لا تشربون، ومن ثمرها لا تجنون، لأن الدود ينخرها."]]}, {"l": "Isa 65:21", "n": "", "vs": [[21, "يغرس الناس كرومهم ويأكلون ثمارها، ويبنون بيوتهم ويقيمون فيها،"]]}, {"l": "Isa 65:22", "n": "", "vs": [[22, "لا يبنون ليأتي آخر فيسكن فيها، ولا يغرسون كروما ليجنيها آخر، لأن أيام شعبي تكون مديدة كأيام الشجر، ويتمتع مختاري بعمل أيديهم."]]}, {"l": "Mic 6:15", "n": "", "vs": [[15, "تزرعين ولا تحصدين. تعصرين الزيتون ولا تدهني بزيته، وتعصرين العنب ولا تشربين من خمره."]]}, {"l": "Zep 1:13", "n": "", "vs": [[13, "فتصبح ثروتهم غنيمة، وبيوتهم خرابا. يشيدون بيوتا ولا يسكنون فيها، ويغرسون كروما ولا يشربون من خمرها."]]}, {"l": "Hag 1:6", "n": "", "vs": [[6, "لقد زرعتم كثيرا وحصدتم قليلا. أكلتم ولم تشبعوا. شربتم ولم ترتووا. اكتسيتم ولم تستدفئوا. ومن ينال أجرة سرعان ما تتبدد، وكأنها وضعت في صرة مثقوبة»."]]}], "kwAr": "تشيدوا", "noteAr": ""}, {"kw": "pleasant vineyards", "raw": "Heb. vineyards of desire", "note": "Heb. vineyards of desire", "refs": [], "kwAr": "كروما شهية", "noteAr": "بالعبرية: «كروم اشتهاء»."}], "arS": [["فلأنكم ", []], ["تطأون", ["H1318"]], [" ", []], ["المسكين", ["H1800"]], [" ", []], ["وتبتزون", ["H3947"]], [" منه ", []], ["رشوة", ["H4864"]], [" ", []], ["قمح", ["H1250"]], [" حتى ", []], ["تشيدوا", ["H1129"]], [" ", []], ["بيوتا", ["H1004"]], [" من ", []], ["حجارة", ["H1496"]], [" ", []], ["منحوتة", ["H1496"]], ["، فإنكم لن ", []], ["تسكنوا", ["H3427"]], [" فيها، ", []], ["وتغرسوا", ["H5193"]], [" ", []], ["كروما", ["H3754"]], [" ", []], ["شهية", ["H2531"]], [" ولكنكم لن ", []], ["تشربوا", ["H8354"]], [" من ", []], ["خمرها", ["H3196"]], [".", []]]}, {"c": 5, "v": 12, "text": "لأنني عالم بكثرة معاصيكم وعظم خطاياكم، إذ أنكم تضايقون البار أيها المرتشون الذين تصدون المسكين عن حقه في ساحة القضاء.", "groups": [{"kw": "I know", "raw": "Deu_31:21; Isa_66:18; Jer_29:23; Heb_4:12, Heb_4:13", "note": "", "refs": [{"l": "Deu 31:21", "n": "", "vs": [[21, "فمتى حلت بهم شرور كثيرة ومصائب جمة، يشهد هذا النشيد عليهم، لأنه سيظل يتردد على أفواه ذريتهم، إذ إنني عالم بخواطرهم التي تدور بخلدهم الآن قبل أن أدخلهم إلى الأرض كما حلفت»."]]}, {"l": "Isa 66:18", "n": "", "vs": [[18, "ولأني عالم بأعمالهم وأفكارهم فأنا مزمع أن آتي لأجمع كل الأمم والألسنة، فيتوافدون ويرون مجدي"]]}, {"l": "Jer 29:23", "n": "", "vs": [[23, "لأنهما ارتكبا الفواحش في إسرائيل وزنيا مع نساء أصحابهما وتنبآ باسمي نبوءات كاذبة لم آمرهما بها. فأنا العارف والشاهد» يقول الرب."]]}, {"l": "Heb 4:12", "n": "", "vs": [[12, "ذلك لأن كلمة الله حية، وفعاله، وأمضى من كل سيف له حدان، وخارقة إلى مفترق النفس والروح والمفاصل ونخاع العظام، وقادرة أن تميز أفكار القلب ونياته."]]}, {"l": "Heb 4:13", "n": "", "vs": [[13, "وليس هنالك مخلوق واحد محجوب عن نظر الله، بل كل شيء عريان ومكشوف أمام عينيه، هو الذي سنؤدي له حسابا."]]}], "kwAr": "عالم", "noteAr": ""}, {"kw": "manifold", "raw": "2Ki_17:7-17; Isa_47:9", "note": "", "refs": [{"l": "2Ki 17:7-17", "n": "", "vs": [[7, "وقد حلت هذه النكبة ببني إسرائيل لأنهم أثموا في حق الرب إلههم الذي أخرجهم من ديار مصر، من تحت نير فرعون وعبدوا آلهة أخرى،"], [8, "سالكين حسب فرائض الأمم الذين طردهم الرب من أمامهم، ومن أمام ملوكهم الذين نصبوهم عليهم."], [9, "وارتكب بنو إسرائيل في الخفاء معاصي في حق الرب إلههم، وشيدوا لأنفسهم مرتفعات في جميع مدنهم من برج النواطير إلى المدينة المحصنة،"], [10, "وأقاموا لأنفسهم أنصابا وتماثيل لعشتاروث على كل تل مرتفع، وتحت كل شجرة خضراء،"], [11, "وقربوا محرقات على جميع المرتفعات كسائر الأمم الذين نفاهم الرب من أمامهم، واقترفوا الموبقات لإغاظة الرب،"], [12, "عابدين الأصنام التي حذرهم ونهاهم الرب عنها."], [13, "وقد أنذر الرب إسرائيل ويهوذا عن طريق أنبيائه ورائيه قائلا: «ارجعوا عن طرقكم الأثيمة، وأطيعوا وصاياي وفرائضي بمقتضى كل الشريعة التي أوصيت آباءكم بتطبيقها، والتي أعلنتها لكم على لسان عبيدي الأنبياء."], [14, "لكنهم أصموا أذانهم وأغلظوا قلوبهم كآبائهم الذين لم يثقوا بالرب إلههم،"], [15, "وتنكروا لفرائضه وعهده الذي أبرمه مع آبائهم، وتجاهلوا تحذيراته ونواهيه لهم، وضلوا وراء أصنام باطلة، فأصبحوا هم أنفسهم باطلين، وتمثلوا بالأمم الذين حولهم، مع أن الرب أمرهم ألا يفعلوا مثلهم، وارتكبوا أمورا نهاهم الرب عنها،"], [16, "ونبذوا جميع وصايا الرب إلههم، وصنعوا لأنفسهم عجلين مسبوكين، وأقاموا تماثيل لعشتاروث وسجدوا لجميع كواكب السماء وعبدوا البعل."], [17, "وأجازوا أبناءهم وبناتهم في النار، وتعاطوا العرافة والفأل وباعوا أنفسهم لارتكاب الشر في عيني الرب لإثارة غيظه."]]}, {"l": "Isa 47:9", "n": "", "vs": [[9, "لذلك ستبتلين بكلا الأمرين معا في لحظة، في يوم واحد، إذ تثكلين وتترملين حتى النهاية على الرغم من كثرة سحرك وقوة رقاك."]]}], "kwAr": "بكثرة معاصيكم", "noteAr": ""}, {"kw": "they afflict", "raw": "Amo_2:6, Amo_2:7, Amo_2:16; Act_3:13, Act_3:14, Act_7:52; Jam_5:4, Jam_5:6", "note": "", "refs": [{"l": "Amo 2:6", "n": "", "vs": [[6, "هذا ما يقوله الرب: من أجل معاصي إسرائيل الثلاث والأربع لن أرد عنهم سخطي، لأنهم باعوا الصديق لقاء الفضة، والبائس مقابل نعلين."]]}, {"l": "Amo 2:7", "n": "", "vs": [[7, "الذين يسحقون رأس المسكين في التراب، ويجورون على البائسين، ويعاشر الرجل وابنه امرأة واحدة، فيتدنس بذلك اسمي المقدس."]]}, {"l": "Amo 2:16", "n": "", "vs": [[16, "والثابت الجنان بين أقرانه الأبطال يفر عريانا في ذلك اليوم، يقول الرب."]]}, {"l": "Act 3:13", "n": "", "vs": [[13, "إن إله إبراهيم وإسحاق ويعقوب، إله آبائنا، قد مجد فتاه يسوع، الذي أسلمتموه أنتم للموت وأنكرتموه أمام بيلاطس، في حين كان يريد أن يطلقه."]]}, {"l": "Act 3:14", "n": "", "vs": [[14, "أنتم أنكرتم القدوس البار وطلبتم العفو عن رجل قاتل،"]]}, {"l": "Act 7:52", "n": "", "vs": [[52, "فأي نبي نجا من اضطهادهم وقد قتلوا الذين أنبأوا بمجيء البار الذي سلمتموه أنتم وقتلتموه!"]]}, {"l": "Jam 5:4", "n": "", "vs": [[4, "وهذه أجرة العمال الذين حصدوا حقولكم، تلك الأجرة التي مازلتم تحبسونها عنهم ظلما، إنها تصرخ، وصراخ أولئك العمال أنفسهم قد سمعه رب الجنود!"]]}, {"l": "Jam 5:6", "n": "", "vs": [[6, "والبريء حكمتم عليه وقتلتموه، وهو لا يقاومكم!"]]}], "kwAr": "تضايقون", "noteAr": ""}, {"kw": "take", "raw": "1Sa_8:3; Psa_26:9, Psa_26:10; Isa_1:23, Isa_33:15; Mic_3:11, Mic_7:3", "note": "", "refs": [{"l": "1Sa 8:3", "n": "", "vs": [[3, "غير أنهما لم يسلكا في طريقه، بل غويا وراء المكسب وقبلا الرشوة وحابيا في القضاء."]]}, {"l": "Psa 26:9", "n": "", "vs": [[9, "فلا تجمع نفسي مع الخاطئين، ولا حياتي مع سافكي الدم،"]]}, {"l": "Psa 26:10", "n": "", "vs": [[10, "الذين أيديهم ملوثة بالسوء، ويمينهم ملأى بالرشوة."]]}, {"l": "Isa 1:23", "n": "", "vs": [[23, "أصبح رؤساؤك عصاة وشركاء لصوص، يولعون بالرشوة ويسعون وراء الهبات، لا يدافعون عن اليتيم، ولا ترفع إليهم دعوى الأرملة»."]]}, {"l": "Isa 33:15", "n": "", "vs": [[15, "السالك في البر، والناطق بالحق، والنابذ ربح الظلم، والنافض يديه من قبض الرشوة، الصام أذنيه عن الاستماع إلى مؤامرات سفك الدماء، المغمض عينيه عن التأمل في الشر،"]]}, {"l": "Mic 3:11", "n": "", "vs": [[11, "إذ يحكم رؤساؤها بالرشوة، وكهنتها يعلمون بالأجرة ويتعاطى أنبياؤها العرافة لقاء المال، ومع ذلك يدعون الاتكال على الله قائلين: «أليس الرب في وسطنا؟ لذلك لن يصيبنا مكروه»."]]}, {"l": "Mic 7:3", "n": "", "vs": [[3, "تجد أيديهم في ارتكاب الشر، ويسعى الرئيس والقاضي وراء الرشوة، ويملي العظيم عليهم أهواء نفسه، فيتآمرون جميعا على الحق."]]}], "kwAr": "أيها", "noteAr": ""}, {"kw": "bribe", "raw": "or, ransom", "note": "or, ransom", "refs": [], "kwAr": "المرتشون", "noteAr": "أو: «فدية»."}, {"kw": "and they", "raw": "Amo_2:7; Isa_10:2, Isa_29:21; Lam_3:34; Mal_3:5", "note": "", "refs": [{"l": "Amo 2:7", "n": "", "vs": [[7, "الذين يسحقون رأس المسكين في التراب، ويجورون على البائسين، ويعاشر الرجل وابنه امرأة واحدة، فيتدنس بذلك اسمي المقدس."]]}, {"l": "Isa 10:2", "n": "", "vs": [[2, "ليصدوا البائسين عن العدل، ويسلبوا مساكين شعبي حقهم، لتكون الأرامل مغنما لهم، وينهبوا اليتامى."]]}, {"l": "Isa 29:21", "n": "", "vs": [[21, "الذين بكلمة جعلوا الإنسان يخطيء، ونصبوا فخا لمن يفحمهم في ساحة القضاء، وصدوا البار بادعاءاتهم الجوفاء."]]}, {"l": "Lam 3:34", "n": "", "vs": [[34, "ولا أن يسحق أسرى الأرض تحت الأقدام،"]]}, {"l": "Mal 3:5", "n": "", "vs": [[5, "وأقترب منكم لأكون شاهدا سريعا ضد السحرة والزناة والحالفين بالزور والمستغلين لأجرة العامل ومضطهدي الأرامل والأيتام، والذين يظلمون الغرباء ولا يخافونني"]]}], "kwAr": "الذين تصدون", "noteAr": ""}, {"kw": "in the", "raw": "Amo_5:10; Deu_16:18; Rth_4:1; Job 29:7-25, Job_31:21; Pro_22:22", "note": "", "refs": [{"l": "Amo 5:10", "n": "", "vs": [[10, "قد أبغضوا من يندد بالجور في ساحة القضاء، ويكرهون من ينطق بالحق."]]}, {"l": "Deu 16:18", "n": "", "vs": [[18, "وأقيموا لأنفسكم قضاة ومدبرين في جميع المدن التي يورثكم إياها الرب إلهكم بحسب أسباطكم فيقضوا بين الشعب بالعدل."]]}, {"l": "Rut 4:1", "n": "", "vs": [[1, "فانطلق بوعز إلى ساحة بوابة المدينة وجلس هناك. فلم يلبث أن مر القريب الولي الذي تحدث عنه بوعز، فقال له: «تعال هنا ياصديقي واجلس». فمال إليه وجلس."]]}, {"l": "Job 29:7-25", "n": "", "vs": [[7, "حين كنت أخرج إلى بوابة المدينة، وأحتل في الساحة مجلسي،"], [8, "فيراني الشبان ويتوارون، ويقف الشيوخ احتراما لي."], [9, "يمتنع العظماء عن الكلام ويضعون أيديهم على أفواههم."], [10, "يتلاشى صوت النبلاء، وتلتصق ألسنتهم بأحناكهم."], [11, "إذا سمعت لي الأذن تطوبني، وإذا شهدتني العين تثني علي،"], [12, "لأ ني أنقذت البائس المستغيث، وأجرت اليتيم طالب العون،"], [13, "فحلت علي بركة المشرف على الموت، وجعلت قلب الأرملة يتهلل فرحا."], [14, "ارتديت البر فكساني، وكجبة وعمامة كان عدلي."], [15, "كنت عيونا للأعمى، وأقداما للأعرج،"], [16, "وكنت أبا للمسكين، أتقصى دعوى من لم أعرفه."], [17, "هشمت أنياب الظالم ومن بين أسنانه نزعت الفريسة،"], [18, "ثم حدثت نفسي: إني سأموت في خيمتي وتتكاثر أيامي كحبات الرمل."], [19, "ستمتد أصولي إلى المياه، والطل يبيت على أغصاني."], [20, "يتجدد مجدي دائما، وقوسي أبدا جديدة في يدي."], [21, "يستمع الناس لي وينتظرون، ويصمتون منصتين لمشورتي."], [22, "بعد كلامي لا يثنون على أقوالي، وحديثي يقطر عليهم كالندى."], [23, "يترقبونني كالغيث، ويفتحون أفواههم كمن ينهل من مطر الربيع"], [24, "إن ابتسمت لهم لا يصدقون، ونور وجهي لم يطرحوه عنهم بعيدا."], [25, "أختار لهم طريقهم وأتصدر مجلسهم، وأكون بينهم كملك بين جيوشه، وكا لمعزي بين النائحين."]]}, {"l": "Job 31:21", "n": "", "vs": [[21, "إن كنت قد رفعت يدي ضد اليتيم، مستغلا نفوذي في القضاء،"]]}, {"l": "Pro 22:22", "n": "", "vs": [[22, "لا تسلب الفقير لأنه فقير، ولا تسحق البائس الماثل عند الباب،"]]}], "kwAr": "في ساحة القضاء", "noteAr": ""}], "arS": [["لأنني ", []], ["عالم", ["H3045"]], [" ", []], ["بكثرة", ["H7227"]], [" ", []], ["معاصيكم", ["H6588"]], [" ", []], ["وعظم", ["H6099"]], [" ", []], ["خطاياكم", ["H2403"]], ["، إذ أنكم ", []], ["تضايقون", ["H6887"]], [" ", []], ["البار", ["H6662"]], [" أيها ", []], ["المرتشون", ["H3724"]], [" الذين ", []], ["تصدون", ["H5186"]], [" ", []], ["المسكين", ["H34"]], [" عن حقه في ", []], ["ساحة", ["H8179"]], [" القضاء.", []]]}, {"c": 5, "v": 13, "text": "لهذا يصمت العاقل في مثل هذا الزمان الرديء.", "groups": [{"kw": "the prudent", "raw": "Amo_6:10; Ecc_3:7; Isa_36:21; Hos_4:4; Mic_7:5-7; Mat_27:12-14", "note": "", "refs": [{"l": "Amo 6:10", "n": "", "vs": [[10, "وعندما يقبل عم الميت المشرف على إحراق الجثث ليخرج عظامه من البيت، ويسأل من هو مختبيء في أقصى المنزل: أما بقي واحد معك؟ فيجيب: لا، ثم يضيف: اصمت ولا تذكر اسم الرب."]]}, {"l": "Ecc 3:7", "n": "", "vs": [[7, "للتمزيق وقت وللخياطة وقت. للصمت وقت وللإفصاح وقت."]]}, {"l": "Isa 36:21", "n": "", "vs": [[21, "فاعتصموا بالصمت ولم يجيبوا بكلمة، لأن الملك أمر بعدم الرد عليه."]]}, {"l": "Hos 4:4", "n": "", "vs": [[4, "ولكن لا يخاصم أحد أحدا، ولا يتهمه لأن دعواي هي ضدكم أيها الكهنة."]]}, {"l": "Mic 7:5-7", "n": "", "vs": [[5, "لا تأتمن جارك ولا تثق بصديق، واحترس مما تنطق به شفتاك ممن ترقد في حضنك."], [6, "فإن الابن يستخف بأبيه والابنة تتمرد على أمها، والكنة على حماتها، وأعداء الإنسان أهل بيته."], [7, "أما أنا فأرتقب الرب وأنتظر إله خلاصي فيسمعني إلهي."]]}, {"l": "Mat 27:12-14", "n": "", "vs": [[12, "وكان رؤساء الكهنة والشيوخ يوجهون ضده الاتهامات، وهو صامت لا يرد."], [13, "فقال له بيلاطس: «أما تسمع ما يشهدون به عليك؟»"], [14, "لكن يسوع لم يجب الحاكم ولو بكلمة، حتى تعجب الحاكم كثيرا."]]}], "kwAr": "العاقل", "noteAr": ""}, {"kw": "an evil", "raw": "Ecc_9:12; Isa_37:3; Mic_2:3; Hab_3:16; Zep_2:2, Zep_2:3; Eph_5:15, Eph_5:16, Eph_6:13; 2Ti_3:1", "note": "", "refs": [{"l": "Ecc 9:12", "n": "", "vs": [[12, "فالمرء لا يعلم متى يحين وقته، فكما تقع الأسماك في شبكة مهلكة، أو تعلق العصافير بالفخاخ، هكذا تقتنص الأيام الرديئة بني البشر، إذ تفاجئهم على حين غرة."]]}, {"l": "Isa 37:3", "n": "", "vs": [[3, "وقالوا له: يقول حزقيا: يسعى في الخير، يلتمس الرضى، ومن ينشد الشر يقبل إليه."]]}, {"l": "Isa 1:16", "n": "", "vs": [[16, "اغتسلوا، تطهروا، أزيلوا شر أعمالكم من أمام عيني. كفوا عن اقتراف الإثم،"]]}, {"l": "Isa 1:17", "n": "", "vs": [[17, "وتعلموا الإحسان، انشدوا الحق، انصفوا المظلوم، اقضوا لليتيم، ودافعوا عن الأرملة."]]}, {"l": "Isa 55:2", "n": "", "vs": [[2, "لماذا تنفقون الفضة على ما ليس بخبز، وتتعبون لغير شبع؟ أحسنوا الاستماع إلي، وكلوا الشهي ولتتمتع أنفسكم بالدسم."]]}, {"l": "Mic 6:8", "n": "", "vs": [[8, "لقد أوضح لك الرب أيها الإنسان ما هو صالح. وماذا يبتغي منك سوى أن تتوخى العدل، وتحب الرحمة، وتسلك متواضعا مع إلهك؟"]]}, {"l": "Mat 6:33", "n": "", "vs": [[33, "أما أنتم، فاطلبوا أولا ملكوت الله وبره، وهذه كلها تزاد لكم."]]}, {"l": "Rom 2:7-9", "n": "", "vs": [[7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"], [8, "ويكون الغضب والسخط للمخاصمين الذين يرفضون الطاعة للحق ولكنهم يخضعون للإثم."], [9, "فالشدة والضيق على نفس كل إنسان يعمل الشر اليهودي أولا ثم اليوناني؛"]]}], "kwAr": "اطلبوا", "noteAr": ""}, {"kw": "and so", "raw": "Amo_3:3; Gen_39:2, Gen_39:3, Gen_39:23; Exo_3:12; Jos_1:9; 1Ch_28:20; 2Ch_15:2; Psa_46:11; Isa_8:10; Mat_1:23, Mat_28:20; Phi_4:8, Phi_4:9; 2Ti_4:22", "note": "", "refs": [{"l": "Amo 3:3", "n": "", "vs": [[3, "هل يترافق اثنان معا ما لم يكونا على موعد؟"]]}, {"l": "Gen 39:2", "n": "", "vs": [[2, "وكان الرب مع يوسف، فأفلح في أعماله، وأقام في بيت سيده المصري."]]}, {"l": "Gen 39:3", "n": "", "vs": [[3, "ورأى مولاه أن الرب معه وأنه يكلل كل ما تصنعه يداه بالنجاح،"]]}, {"l": "Gen 39:23", "n": "", "vs": [[23, "ولم يحاسب رئيس السجن يوسف بأي شيء أوكله إليه، لأن الرب كان معه. ومهما فعل كان الرب يكلله بالنجاح."]]}, {"l": "Exo 3:12", "n": "", "vs": [[12, "فأجاب: «أنا أكون معك. ومتى أخرجت الشعب من مصر تعبدون الله على هذا الجبل، فتكون هذه لك العلامة أنني أنا أرسلتك»."]]}, {"l": "Jos 1:9", "n": "", "vs": [[9, "ألم آمرك؟ إذن تقو وتشجع، لا ترهب ولا تجزع لأن الرب إلهك معك حيثما تتوجه»."]]}, {"l": "1Ch 28:20", "n": "", "vs": [[20, "فتقو وتشجع واعمل. لا تجزع ولا ترتعب لأن الرب الإله إلهي معك، ولن يخذلك ولا يتركك حتى تستوفي كل عمل خدمة هيكل الرب."]]}, {"l": "2Ch 15:2", "n": "", "vs": [[2, "فتوجه للقاء آسا وقال له: «اسمع لي ياآسا وياجميع أبناء يهوذا وبنيامين: الرب معكم ما برحتم معه، فإن طلبتموه يوجد لكم، وإن تخليتم عنه ينبذكم."]]}, {"l": "Psa 46:11", "n": "", "vs": [[11, "رب الجنود معنا. ملجأنا إله يعقوب."]]}, {"l": "Isa 8:10", "n": "", "vs": [[10, "تشاوروا معا ولكن على غير طائل، ارسموا الخطط فلا تتحقق لأن الله معنا."]]}, {"l": "Mat 1:23", "n": "", "vs": [[23, "«ها إن العذراء تحبل، وتلد ابنا، ويدعى عمانوئيل!» أي «الله معنا»."]]}, {"l": "Mat 28:20", "n": "", "vs": [[20, "وعلموهم أن يعملوا بكل ما أوصيتكم به. وها أنا معكم كل الأيام إلى انتهاء الزمان! »."]]}, {"l": "Phi 4:8", "n": "", "vs": [[8, "وختاما، أيها الإخوة: كل ما كان حقا، وكل ما كان شريفا، وكل ما كان عادلا، وكل ما كان طاهرا وكل ما كان مستحبا، وكل ما كان حسن السمعة، وكل ما كان فيه فضيلة وخصلة حميدة، فاشغلوا أفكاركم به."]]}, {"l": "Phi 4:9", "n": "", "vs": [[9, "واعملوا بها ما تعلمتم وتلقيتم وسمعتم مني وما رأيتم في. وإله السلام يكون معكم."]]}, {"l": "2Ti 4:22", "n": "", "vs": [[22, "ليكن الرب مع روحك، ولتكن النعمة معكم!"]]}], "kwAr": "فيكون", "noteAr": ""}, {"kw": "as", "raw": "Num_16:3; Isa_48:1, Isa_48:2; Jer_7:3, Jer_7:4; Mic_3:11", "note": "", "refs": [{"l": "Num 16:3", "n": "", "vs": [[3, "هؤلاء تألبوا على موسى وهرون وقالوا: «حسبكما! إن كل الجماعة بأسرها مقدسة، وفي وسطها الرب. فما بالكما تترفعان على جماعة الرب؟»"]]}, {"l": "Isa 48:1", "n": "", "vs": [[1, "اسمعوا هذا يابيت يعقوب المدعوين باسم إسرائيل الخارجين من صلب يهوذا، الحالفين باسم الرب، المستشهدين بإله إسرائيل باطلا وكذبا"]]}, {"l": "Isa 48:2", "n": "", "vs": [[2, "الذين يدعون أنفسهم أهل المدينة المقدسة، ويعتمدون على إله إسرائيل، الرب القدير:"]]}, {"l": "Jer 7:3", "n": "", "vs": [[3, "هذ ما يعلنه الرب القدير إله إسرائيل: قوموا طرقكم وأعمالكم فأسكنكم في هذا الموضع."]]}, {"l": "Jer 7:4", "n": "", "vs": [[4, "لا تتكلوا على أقوال الكذب قائلين: هذا هيكل الرب: هذا هيكل الرب"]]}, {"l": "Mic 3:11", "n": "", "vs": [[11, "إذ يحكم رؤساؤها بالرشوة، وكهنتها يعلمون بالأجرة ويتعاطى أنبياؤها العرافة لقاء المال، ومع ذلك يدعون الاتكال على الله قائلين: «أليس الرب في وسطنا؟ لذلك لن يصيبنا مكروه»."]]}], "kwAr": "كما تقولون", "noteAr": ""}], "arS": [["اطلبوا", ["H1875"]], [" ", []], ["الخير", ["H2896"]], [" لا ", []], ["الشر", ["H7451"]], [" ", []], ["لتحيوا", ["H2421"]], ["، ", []], ["فيكون", ["H1961"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["الإله", ["H430"]], [" ", []], ["القدير", ["H6635"]], [" ", []], ["معكم", ["H854"]], [" كما ", []], ["تقولون", ["H559"]], [".", []]]}, {"c": 5, "v": 15, "text": "امقتوا الشر وأحبوا الخير وأقيموا العدل في ساحة القضاء، لعل الرب الإله القدير يترفق على بقية بيت يوسف.", "groups": [{"kw": "Hate", "raw": "Psa_34:14, Psa_36:4, Psa_37:27, Psa_97:10, Psa_119:104, Psa_139:21, Psa_139:22; Rom_7:15, Rom_7:16, Rom_7:22, Rom_8:7; Rom_12:9; 1Th_5:21, 1Th_5:22; 3Jo_1:11", "note": "", "refs": [{"l": "Psa 34:14", "n": "", "vs": [[14, "ليتحول عن الشر ويفعل الخير. ليطلب السلام ويسع للوصول إليه"]]}, {"l": "Psa 36:4", "n": "", "vs": [[4, "يتفكر في الباطل على سريره ليلا. ويسلك في سبيل السوء لا يستنكر الشر."]]}, {"l": "Psa 37:27", "n": "", "vs": [[27, "حد عن الشر واصنع الخير، فتسكن مطمئنا إلى الأبد."]]}, {"l": "Psa 97:10", "n": "", "vs": [[10, "يامحبي الرب، أبغضوا الشر. الرب حارس نفوس أتقيائه، وهو ينقذهم من أيدي الأشرار."]]}, {"l": "Psa 119:104", "n": "", "vs": [[104, "من وصاياك اكتسبت فطنة لذلك أبغضت كل طريق باطل."]]}, {"l": "Psa 139:21", "n": "", "vs": [[21, "يارب ألا أبغض مبغضيك، وأكره الثائرين عليك؟"]]}, {"l": "Psa 139:22", "n": "", "vs": [[22, "بغضا تاما أبغضهم، وأحسبهم أعداء لي."]]}, {"l": "Rom 7:15", "n": "", "vs": [[15, "فإن ما أفعله لا أملك السيطرة عليه: إذ لا أمارس ما أريده، وإن ما أبغضه فإياه أعمل."]]}, {"l": "Rom 7:16", "n": "", "vs": [[16, "فما دمت أعمل ما لا أريده، فإني أصادق على صواب الشريعة."]]}, {"l": "Rom 7:22", "n": "", "vs": [[22, "أن لدي الشر. فإنني، وفقا للإنسان الباطن في، أبتهج بشريعة الله."]]}, {"l": "Rom 8:7", "n": "", "vs": [[7, "لأن اهتمام الجسد هو عداوة لله، إذ إنه لا يخضع لناموس الله، بل لا يستطيع ذلك."]]}, {"l": "Rom 12:9", "n": "", "vs": [[9, "ولتكن المحبة بلا رياء. انفروا من الشر، والتصقوا بالخير."]]}, {"l": "1Th 5:21", "n": "", "vs": [[21, "امتحنوا كل شيء وتمسكوا بالحسن."]]}, {"l": "1Th 5:22", "n": "", "vs": [[22, "ترفعوا عن كل ما فيه شبهة شر."]]}, {"l": "3Jo 1:11", "n": "", "vs": [[11, "أيها الحبيب، لا تقتد بما هو شر، بل بما هو خير. فإن من يفعل الخير، يكون من الله. ومن يفعل الشر، يبين أنه لم يتعرف بالله قط."]]}], "kwAr": "امقتوا", "noteAr": ""}, {"kw": "establish", "raw": "Amo_5:10,Amo_5:24, Amo_6:12; 2Ch_19:6-11; Psa_82:2-4; Jer_7:5-7", "note": "", "refs": [{"l": "Amo 5:10", "n": "", "vs": [[10, "قد أبغضوا من يندد بالجور في ساحة القضاء، ويكرهون من ينطق بالحق."]]}, {"l": "Amo 5:24", "n": "", "vs": [[24, "إنما ليجر الحق متدفقا كالمياه والعدل كنهر سيال."]]}, {"l": "Amo 6:12", "n": "", "vs": [[12, "أتجري الخيول على الصخور؟ وهل يحرث البحر بثيران؟ لقد حولتم الحق سما زعافا، وثمار البر مرارة."]]}, {"l": "2Ch 19:6-11", "n": "", "vs": [[6, "وقال لهم: «توخوا الحيطة في كل حكم تصدرونه، لأنكم لا تقضون للإنسان بل للرب الحاضر معكم دائما عند إصدار أحكامكم."], [7, "ولتكن هيبة الرب عليكم. فاحرصوا على إقامة العدل لأنه ليس عند الرب إلهنا ظلم ولا محاباة ولا رشوة»."], [8, "كذلك عين يهوشافاط في أورشليم قضاة للرب من اللاويين والكهنة ورؤساء بيوتات الشعب لفض النزاعات. وكان مقر إقامتهم في أورشليم،"], [9, "وأوصاهم قائلا: «اقضوا بتقوى الرب بأمانة وقلب خالص النية."], [10, "وعليكم في كل دعوى يرفعها إليكم إخوتكم المقيمون في مدنهم، تتعلق بقضية قتل، أو بين شريعة ووصية لها مساس بالفرائض والأحكام، أن تحذروهم لئلا يأثموا إلى الرب فيحل عليكم وعلى إخوتكم غضبه. افعلوا هذا وتفادوا الإثم."], [11, "وقد خولت أمريا رئيس الكهنة سلطة الفصل في كل الأمور المتعلقة بالشؤون الدينية، كما فوضت إلى زبديا بن يشمعيئيل رئيس يهوذا أمر الشؤون المدنية (شؤون الملك). أما اللاويون فيتولون الإشراف على تنفيذ الأحكام، فتصرفوا بحزم وقوة وليكن الرب مع الصالح»."]]}, {"l": "Psa 82:2-4", "n": "", "vs": [[2, "حتى متى تقضون بالظلم وتنحازون إلى الأشرار؟"], [3, "احكموا للذليل واليتيم. وأنصفوا المسكين والبائس."], [4, "أنقذوا المسكين والفقير؛ أنقذوهما من قبضة الأشرار."]]}, {"l": "Jer 7:5-7", "n": "", "vs": [[5, "لكن إن قومتم حقا طرقكم وأعمالكم، وأجريتم قضاء عادلا فيما بينكم،"], [6, "إن لم تجوروا على الغريب واليتيم والأرملة، ولم تسفكوا دما بريئا في هذا الموضع، وإن لم تضلوا وراء الأوثان مسيئين بذلك لأنفسكم،"], [7, "عندئذ أسكنكم في هذا الموضع في الأرض التي وهبتها لآبائكم إلى الأبد."]]}], "kwAr": "وأقيموا", "noteAr": ""}, {"kw": "it may", "raw": "Exo_32:30; 2Sa_16:12; 1Ki_20:31; 2Ki_19:4; Joe_2:14; Jon_3:9", "note": "", "refs": [{"l": "Exo 32:30", "n": "", "vs": [[30, "وفي الغد قال موسى للشعب: «لقد ارتكبتم خطيئة عظيمة، وها أنا أعود إلى الجبل لأمثل أمام الرب، لعلي أحظى لكم بغفرانه»."]]}, {"l": "2Sa 16:12", "n": "", "vs": [[12, "لعل الرب ينظر إلى مذلتي، ويكافئني خيرا عوض شتائمه في هذا اليوم»."]]}, {"l": "1Ki 20:31", "n": "", "vs": [[31, "فقال له رجاله: «لقد سمعنا أن ملوك إسرائيل ملوك حليمون، فلنرتد مسوحا حول أحقائنا، ونضع حبالا على رؤوسنا، ونخرج إلى ملك إسرائيل، لعله يعفو عنك»."]]}, {"l": "2Ki 19:4", "n": "", "vs": [[4, "فلعل الرب إلهك يسمع وعيد القائد الأشوري الذي أوفده سيده ملك أشور، ليهين الإله الحي فيعاقبه الرب إلهك على ما صدر منه من تعيير، فصل من أجل البقية الناجية منا»."]]}, {"l": "Joe 2:14", "n": "", "vs": [[14, "لعله يرجع ويكف عن العقاب مخلفا وراءه بركة: تقدمة دقيق وتقدمة سكيب لتقربوهما للرب إلهكم."]]}, {"l": "Jon 3:9", "n": "", "vs": [[9, "لعل الرب يرجع فيعدل عن احتدام سخطه فلا نهلك»."]]}], "kwAr": "لعل", "noteAr": ""}, {"kw": "the remnant", "raw": "Amo_5:6; 2Ki_13:7, 2Ki_14:26, 2Ki_14:27, 2Ki_15:29; Jer_31:7; Mic_2:12, Mic_5:3, Mic_5:7, Mic_5:8", "note": "", "refs": [{"l": "Amo 5:6", "n": "", "vs": [[6, "التمسوا الرب فتحيوا لئلا يندلع كنار تحرق بيت يوسف وتلتهم بيت إيل، وليس من يطفيء."]]}, {"l": "2Ki 13:7", "n": "", "vs": [[7, "ولم يكن قد بقي من جيش يهوأحاز سوى خمسين فارسا، وعشر مركبات، وعشرة آلاف رجل من المشاة، لأن ملك أرام أفناهم وداس عليهم كما يداس على التراب."]]}, {"l": "2Ki 14:26", "n": "", "vs": [[26, "لأن الرب رأى ما يعانيه الإسرائيليون من عبيد وأحرار من ضيق أليم مرير. ولم يكن لهم من معين."]]}, {"l": "2Ki 14:27", "n": "", "vs": [[27, "وإذ لم يكن الرب قد قضى بمحو اسم إسرائيل من تحت السماء، أنقذهم على يد يربعام بن يوآش."]]}, {"l": "2Ki 15:29", "n": "", "vs": [[29, "وفي أيامه هاجم تغلث فلاسر ملك أشور البلاد، واستولى على مدن عيون، وآبل بيت معكة، ويانوح، وقادش، وحاصور، وجلعاد والجليل، وكل أرض نفتالي وسبى أهلها إلى أشور."]]}, {"l": "Jer 31:7", "n": "", "vs": [[7, "فإن هذا ما يعلنه الرب: «رنموا بهتاف ليعقوب، اهتفوا لرأس الأمم، أعلنوا وسبحوا وقولوا: أنقذ يارب شعبك، بقية إسرائيل»."]]}, {"l": "Mic 2:12", "n": "", "vs": [[12, "سأجمع شتاتك جميعا يايعقوب، وأجمع بقية إسرائيل وأضمهم معا كقطيع غنم في حظيرة، مثل قطيع محتشد في مرعى، فترتفع جلبة جمهورهم."]]}, {"l": "Mic 5:3", "n": "", "vs": [[3, "لذلك يسلم الرب شعبه إلى أعدائهم إلى أن تلد من تقاسي من المخاض، عندئذ ترجع بقية إخوته من السبي إلى شعب إسرائيل."]]}, {"l": "Mic 5:7", "n": "", "vs": [[7, "عندئذ تغدو بقية ذرية يعقوب بين الأمم الكثيرة كندى من لدن الرب، كالمطر الوابل على العشب الذي لا يتوانى من أجل الناس أو يرجو أبناء البشر."]]}, {"l": "Mic 5:8", "n": "", "vs": [[8, "وتكون بقية ذرية يعقوب بين الشعوب الكثيرة كأسد بين وحوش الغابة، أو كشبل بين قطعان الغنم، الذي إن اقتحم يدوس ويفترس وليس من منقذ."]]}], "kwAr": "بقية", "noteAr": ""}], "arS": [["امقتوا", ["H8130"]], [" ", []], ["الشر", ["H7451"]], [" ", []], ["وأحبوا", ["H157"]], [" ", []], ["الخير", ["H2896"]], [" ", []], ["وأقيموا", ["H3322"]], [" ", []], ["العدل", ["H4941"]], [" في ", []], ["ساحة", ["H8179"]], [" القضاء، ", []], ["لعل", ["H194"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["الإله", ["H430"]], [" ", []], ["القدير", ["H6635"]], [" ", []], ["يترفق", ["H2603"]], [" على ", []], ["بقية", ["H7611"]], [" بيت ", []], ["يوسف", ["H3130"]], [".", []]]}, {"c": 5, "v": 16, "text": "لذلك، هذا ما يقوله الرب الإله القدير، سيملأ النحيب أرجاء الساحات، ويرتفع عويلهم في الشوارع قائلين: آه! آه! ويدعون الفلاحين إلى البكاء، والنادبات إلى الرثاء،", "groups": [{"kw": "the Lord", "raw": "Amo_5:27, Amo_3:13", "note": "", "refs": [{"l": "Amo 5:27", "n": "", "vs": [[27, "لذلك أسبيكم إلى ما وراء دمشق، يقول الرب الذي اسمه الإله القدير."]]}, {"l": "Amo 3:13", "n": "", "vs": [[13, "اسمعوا واشهدوا على بيت يعقوب، يقول السيد الرب الإله القدير."]]}], "kwAr": "الرب الإله القدير", "noteAr": ""}, {"kw": "Wailing", "raw": "Amo_8:10; Isa_15:2-5, Isa_15:8, Isa_22:12; Jer_4:31, Jer_9:10,Jer_9:18-20; Joe_1:8, Joe_1:11, Joe_1:14; Mic_1:8, Mic_2:4; Rev_18:10,Rev_18:15, Rev_18:16, Rev_18:19", "note": "", "refs": [{"l": "Amo 8:10", "n": "", "vs": [[10, "أحول أعيادكم إلى مآتم، وأغانيكم إلى مراث، وألبسكم المسوح على أحقائكم، وأفشي الصلع في كل رأس، فتصبح أعيادكم كمناحة على وحيد، ونهايتها كيوم مفعم بالمرارة."]]}, {"l": "Isa 15:2-5", "n": "", "vs": [[2, "ينطلق أهل ديبون إلى المعبد، وحتى إلى المرتفعات للبكاء؛ يولول شعب موآب على مصير نبو وميدبا برؤوس وذقون محلوقة."], [3, "يتلفعون بالمسوح في شوارعها، ويبكي كل واحد منهم على السطوح وفي الساحات."], [4, "تتعالى صرخات حشبون وألعالة حتى تتردد أصداؤها في ياهص، لذلك يندب جيش موآب بصوت مرتفع، وقلوبهم ترتعد في صدورهم."], [5, "قلبي يصرخ متوجعا على موآب وعلى عظمائها الهاربين إلى صوغر. كعجلة ثلاثية يصعدون إلى عقبة اللوحيث مولولين، ويجهرون بصراخ الهزيمة في طريق حورونايم."]]}, {"l": "Isa 15:8", "n": "", "vs": [[8, "إذ يتجاوب صراخهم على طول تخوم موآب، وتبلغ ولولتهم إلى أجلايم وبئر إيليم."]]}, {"l": "Isa 22:12", "n": "", "vs": [[12, "في ذلك اليوم يدعوكم السيد الرب القدير للبكاء والنوح وحلق الشعر والتنطق بالمسوح."]]}, {"l": "Jer 4:31", "n": "", "vs": [[31, "لأني سمعت صرخة كصرخة امرأة في مخاض، وأنة عذاب كعذاب من تقاسي في ولادة بكرها. إنها صرخة ابنة صهيون التي تزفر لاهثة وتبسط يديها قائلة: «ويل لي! قد غشي علي أمام القتلة»."]]}, {"l": "Jer 9:10", "n": "", "vs": [[10, "سأنتحب وأنوح على الجبال وأندب على مراعي البرية لأنها احترقت وأوحشت، فلا يجتاز بها عابر ولا يتردد فيها صوت القطعان، وقد هجرتها طيور السماء والوحوش."]]}, {"l": "Jer 9:18-20", "n": "", "vs": [[18, "ليسرعن حتى يطلقن أصواتهن علينا بالندب فتذرف عيوننا دموعا، وتفيض أجفاننا ماء."], [19, "ها صوت رثاء قد تجاوب في صهيون: ما أشد دمارنا، وما أعظم عارنا، لأننا قد فارقنا أرضنا، ولأنهم قد هدموا مساكننا!»"], [20, "فاسمعن أيتها النساء قضاء الرب، ولتفهم آذانكن كلمة فمه: لقن بناتكن الر ثاء، ولتعلم كل منهن صاحبتها الندب،"]]}, {"l": "Joe 1:8", "n": "", "vs": [[8, "نوحوا كما تنوح صبية متشحة بالمسوح على زوجها الذي مات."]]}, {"l": "Joe 1:11", "n": "", "vs": [[11, "اخزوا أيها الحراثون وأعولوا أيها الكرامون على الحنطة والشعير، لأن حصاد الحقل قد تلف."]]}, {"l": "Joe 1:14", "n": "", "vs": [[14, "خصصوا صوما. نادوا بالاعتكاف. ادعوا الشيوخ وجميع سكان الأرض للاجتماع في هيكل الرب إلهكم وتضرعوا إليه."]]}, {"l": "Mic 1:8", "n": "", "vs": [[8, "لهذا أنوح وأولول وأمشي حافيا عريانا، وأعول كبنات آوى، وأنتحب كالنعام."]]}, {"l": "Mic 2:4", "n": "", "vs": [[4, "في ذلك اليوم يسخر أعداؤكم منكم، وتنوحون بمثل هذا الرثاء: «قد تم تدميرنا واستبدل الرب نصيب شعبه. كيف أخذه منا وقسم حقولنا بين آسرينا؟»"]]}, {"l": "Rev 18:10", "n": "", "vs": [[10, "فيقفون على بعد منها، خوفا من عذابها، وهم يصرخون: الويل، الويل، أيتها المدينة العظمى، بابل القوية! في ساعة واحدة حل بك العقاب!"]]}, {"l": "Rev 18:15", "n": "", "vs": [[15, "هؤلاء التجار الذين اغتنوا من التجارة معها، يقفون على بعد منها، خوفا من عذابها، يبكون وينتحبون"]]}, {"l": "Rev 18:16", "n": "", "vs": [[16, "قائلين: الويل، الويل على المدينة العظمى! كانت ترتدي أفضل الكتان والأرجوان والقرمز، وتتحلى بالذهب والأحجار الكريمة واللؤلوء،"]]}, {"l": "Rev 18:19", "n": "", "vs": [[19, "ويذرون التراب على رؤوسهم وهم يصرخون باكين منتحبين: الويل، الويل على المدينة العظمى التي اغتنى أصحاب سفن البحر جميعا بفضل ثروتها! ها هي في ساعة واحدة قد زالت!"]]}], "kwAr": "النحيب", "noteAr": ""}, {"kw": "such", "raw": "Jer_9:17-19", "note": "", "refs": [{"l": "Jer 9:17-19", "n": "", "vs": [[17, "وهذا ما يعلنه الرب القدير: «تأملوا واستدعوا النادبات ليأتين، وأرسلوا إلى الحكيمات فيقبلن."], [18, "ليسرعن حتى يطلقن أصواتهن علينا بالندب فتذرف عيوننا دموعا، وتفيض أجفاننا ماء."], [19, "ها صوت رثاء قد تجاوب في صهيون: ما أشد دمارنا، وما أعظم عارنا، لأننا قد فارقنا أرضنا، ولأنهم قد هدموا مساكننا!»"]]}], "kwAr": "ويدعون", "noteAr": ""}], "arS": [["لذلك، ", []], ["هذا", ["H3541"]], [" ما ", []], ["يقوله", ["H559"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["الإله", ["H430"]], [" ", []], ["القدير", ["H6635"]], ["، سيملأ ", []], ["النحيب", ["H4553"]], [" أرجاء ", []], ["الساحات", ["H7339"]], ["، ", []], ["ويرتفع", ["H559"]], [" عويلهم في ", []], ["الشوارع", ["H2351"]], [" قائلين: ", []], ["آه", ["H1930"]], ["! آه! ", []], ["ويدعون", ["H7121"]], [" ", []], ["الفلاحين", ["H406"]], [" إلى ", []], ["البكاء", ["H60"]], ["، ", []], ["والنادبات", ["H3045"]], [" إلى ", []], ["الرثاء", ["H5092"]], ["،", []]]}, {"c": 5, "v": 17, "text": "وتعلو الولولة في جوانب الكروم، لأني سأجتاز منتقما في وسطكم يقول الرب.", "groups": [{"kw": "in", "raw": "Isa_16:10, Isa_32:10-12; Jer_48:33; Hos_9:1, Hos_9:2", "note": "", "refs": [{"l": "Isa 16:10", "n": "", "vs": [[10, "وانتزع الفرح والابتهاج من روضتك، فلم يبق أحد يرنم أو يهتف في كرومك، ولا يوجد من يدوس الخمر في معصرتك، لأني قد أخرست الهتاف."]]}, {"l": "Isa 32:10-12", "n": "", "vs": [[10, "ما تكاد تنقضي أيام على سنة حتى تعتريكن رعدة أيتها الآمنات، لأن القطاف قد تلف، وموعد جني الأثمار قد أخلف."], [11, "ارتعدن أيتها النساء المطمئنات وارتجفن أيتها الفتيات الآمنات. تجردن من ثيابكن وتعرين ومنطقن أحقاءكن بالمسوح."], [12, "اضربن على صدوركن حسرة على المروج المبهجة والكروم المثمرة."]]}, {"l": "Jer 48:33", "n": "", "vs": [[33, "قد تلاشى الفرح والغبطة من بساتين موآب ومن حقوله، وأوقف تدفق الخمر من المعاصر فلا يدوسها دائس بهتاف، بل تعلو صرخات لا هتاف فيها."]]}, {"l": "Hos 9:1", "n": "", "vs": [[1, "لا تبتهج ياإسرائيل ولا تطرب كبقية الشعوب، لأنك قد خنت إلهك وهجرته، وأحببت أجرة الزنى على كل بيادر الحنطة."]]}, {"l": "Hos 9:2", "n": "", "vs": [[2, "لهذا فإن البيدر والمعصرة لا يطعمانكم، والخمرة الجديدة لا تلبي حاجتكم."]]}], "kwAr": "في جوانب", "noteAr": ""}, {"kw": "I will", "raw": "Exo_12:12, Exo_12:23; Joe_3:17; Nah_1:12, Nah_1:15; Zec_9:8", "note": "", "refs": [{"l": "Exo 12:12", "n": "", "vs": [[12, "ففي هذه الليلة أجتاز في بلاد مصر وأقتل كل بكر فيها من الناس والبهائم وأجري قضاء على كل آلهة المصريين. أنا هو الرب."]]}, {"l": "Exo 12:23", "n": "", "vs": [[23, "لأن الرب سيجتاز ليلاَ ليهلك المصريين. فحين يرى الدم على العتبة العليا والقائمتين يعبر عن الباب ولا يدع المهلك يدخل بيوتكم ليضربكم."]]}, {"l": "Joe 3:17", "n": "", "vs": [[17, "فتدركون أني أنا هو الرب إلهكم الساكن في صهيون جبلي المقدس، وتكون أورشليم مقدسة ولا يجتاز فيها الغرباء أبدا."]]}, {"l": "Nah 1:12", "n": "", "vs": [[12, "وهذا ما يقوله الرب: مع أنكم أقوياء وكثيرون فإنكم تستأصلون وتفنون. أما أنتم ياشعبي فقد عاقبتكم أشد عقاب ولن أنزل بكم الويلات ثانية."]]}, {"l": "Nah 1:15", "n": "", "vs": [[15, "هوذا على الجبال (تسير) قدما المبشر حامل الأخبار السارة، الذي يعلن السلام. فيايهوذا واظب على الاحتفال بأعيادك وأوف نذورك لأنه لن يهاجمك الشرير من بعد، إذ قد انقرض تماما."]]}, {"l": "Zec 9:8", "n": "", "vs": [[8, "ثم أعسكر حول شعبي لأحفظه من غزوات الجيوش في ذهابها وإيابها، فلا يذلهم مستعمر، لأني رأيت الآن بعيني معاناتهم»."]]}], "kwAr": "سأجتاز", "noteAr": ""}], "arS": [["وتعلو ", []], ["الولولة", ["H4553"]], [" في جوانب ", []], ["الكروم", ["H3754"]], ["، لأني ", []], ["سأجتاز", ["H5674"]], [" منتقما في ", []], ["وسطكم", ["H7130"]], [" ", []], ["يقول", ["H559"]], [" ", []], ["الرب", ["H3068"]], [".", []]]}, {"c": 5, "v": 18, "text": "ويل للذين يتشوقون ليوم الرب. لماذا تطلبون مجيء يوم الرب؟ فيوم الرب هو ظلمة لا نور.", "groups": [{"kw": "desire", "raw": "Isa_5:19, Isa_28:15-22; Jer_17:15; Eze_12:22, Eze_12:27; Mal_3:1, Mal_3:2; 2Pe_3:4", "note": "", "refs": [{"l": "Isa 5:19", "n": "", "vs": [[19, "ويقولون: ليسرع وليعجل بعقابه حتى نراه. لينفذ مقدس إسرائيل مأربه فينا فندرك حقيقة ما يفعله بنا."]]}, {"l": "Isa 28:15-22", "n": "", "vs": [[15, "لأنكم قلتم: «قد أبرمنا عهدا مع الموت، وعقدنا ميثاقا مع الهاوية، فإن الأشوريين المقتحمين أرضنا لن يسلخونا، لأن السوط الجارف إذا عبر لا يصيبنا لأننا اعتصمنا بالمراوغة ولجأنا إلي النفاق»."], [16, "لهذا يقول الرب: «ها أنا أضع حجر أساس في صهيون، حجر زاوية ثمينا ليكون أساسا راسخا وكل من يؤمن به لا يهرب."], [17, "وسأجعل العدل خيط قياس والحق مطمارا (لأكشف عن زيف أعمالكم) فيجرف البرد معتصم الكذب وتطفو المياه على المخابيء"], [18, "عندئد يبطل عهدكم مع الموت، ويلغى ميثاقكم مع الهاوية ويدوسكم أعداؤكم عند اقتحامهم بلادكم."], [19, "ويجتاحونكم مرة تلو مرة، في الليل والنهار وما إن تدركوا مغزى هذا العقاب حتى يطغى عليكم الرعب."], [20, "لأن السرير أقصر من أن تتمددوا عليه، والغطاء أضيق من أن تلتفوا به»."], [21, "وسيقبل الرب بسخط، كما أقبل في جبل فراصيم وفي وادي جبعون ليجري أفعاله الغريبة ويعاقب أشد عقاب."], [22, "لذلك لا تتهكموا لئلا يتفاقم عقابكم لأن رب كل الأرض القدير قد أبلغني قضاءه بهلاككم."]]}, {"l": "Jer 17:15", "n": "", "vs": [[15, "ها هم يقولون لي: «أين قضاء الرب؟ ليأت»."]]}, {"l": "Eze 12:22", "n": "", "vs": [[22, "«ياابن آدم، ما هذا المثل الشائع في أرض إسرائيل القائل: قد طالت الأيام وكذبت كل رؤيا؟."]]}, {"l": "Eze 12:27", "n": "", "vs": [[27, "«ياابن آدم، ها شعب إسرائيل يقولون: إن الرؤيا التي تراها لا تتم إلا بعد أيام كثيرة، ونبوءتك لا تتحقق إلا في أزمنة بعيدة"]]}, {"l": "Mal 3:1", "n": "", "vs": [[1, "«ها أنا أرسل رسولي فيمهد الطريق أمامي ويأتي الرب الذي تطلبونه فجأة إلى هيكله ويقبل أيضا ملاك العهد الذي تسرون به» يقول الرب القدير"]]}, {"l": "Mal 3:2", "n": "", "vs": [[2, "ولكن من يحتمل يوم مجيئه؟ ومن يثبت عند ظهوره؟ فإنه مثل نار الممحص أو أشنان القصارين."]]}, {"l": "2Pe 3:4", "n": "", "vs": [[4, "وسيقولون: «أين هو الوعد برجوع المسيح؟ فمنذ أن مات آباؤنا الأولون، بل منذ بدء الخليقة، مازال كل شيء على حاله!»"]]}], "kwAr": "يتشوقون", "noteAr": ""}, {"kw": "the day of the Lord is", "raw": "Isa_5:30, Isa_9:19, Isa_24:11, Isa_24:12; Jer_30:7; Joe_1:15, Joe_2:1, Joe_2:2, Joe_2:10,Joe_2:31; Zep_1:14, Zep_1:15; Mal_4:1; 2Pe_3:10", "note": "", "refs": [{"l": "Isa 5:30", "n": "", "vs": [[30, "يزمجرون عليها في ذلك اليوم كهدير البحر. وإن جاس أحد في البلاد متفرسا لا يرى سوى الظلمة والضيق، حتى (انفراجات) الضوء (أي ومضات الرجاء) قد احتجبت وراء سحبه."]]}, {"l": "Isa 9:19", "n": "", "vs": [[19, "إن الأرض تحترق بغضب الرب القدير، والشعب كوقود للنار. لا يرحم واحد أخاه."]]}, {"l": "Isa 24:11", "n": "", "vs": [[11, "ترتفع صرخة في الأزقة طلبا للخمرة المفقودة. زال كل فرح، وتلاشى السرور من الأرض"]]}, {"l": "Isa 24:12", "n": "", "vs": [[12, "بقي الخراب في المدينة، وتحطمت البوابات فأصبحت ردما."]]}, {"l": "Jer 30:7", "n": "", "vs": [[7, "ما أرهب ذلك اليوم إذ لا مثيل له! هو زمن ضيق على ذرية يعقوب، ولكنها ستنجو منه."]]}, {"l": "Joe 1:15", "n": "", "vs": [[15, "يا له من يوم رهيب، لأن يوم الرب قريب يأتي حاملا معه الدمار من عند القدير."]]}, {"l": "Joe 2:1", "n": "", "vs": [[1, "انفخوا بالبوق في صهيون، وأطلقوا نفير الإنذار في جبل قدسي، وليرتعد جميع سكان الأرض، لأن يوم الرب مقبل وقد بات وشيكا."]]}, {"l": "Joe 2:2", "n": "", "vs": [[2, "هو يوم ظلمة وتجهم، يوم غيوم مكفهرة وقتام دامس،فيه تزحف أمة قوية وعظيمة كما يزحف الظلام على الجبال، أمة لم يكن لها شبيه في سالف الزمان، ولن يكون لها نظير من بعدها عبر سني الأجيال."]]}, {"l": "Joe 2:10", "n": "", "vs": [[10, "ترتعد الأرض أمامهم وترجف السماء، تظلم الشمس والقمر، وتكف الكواكب عن الضياء."]]}, {"l": "Joe 2:31", "n": "", "vs": [[31, "وتتحول الشمس إلى ظلام، والقمر إلى دم، قبل مجيء يوم الرب العظيم المخيف."]]}, {"l": "Zep 1:14", "n": "", "vs": [[14, "إن يوم الرب العظيم قريب، وشيك وسريع جدا. دوي يوم الرب مخيف، فيه يصرخ الجبار مرتعبا."]]}, {"l": "Zep 1:15", "n": "", "vs": [[15, "يوم غضب هو ذلك اليوم، يوم ضيق وعذاب، يوم خراب ودمار، يوم ظلمة واكتئاب، يوم غيوم وقتام."]]}, {"l": "Mal 4:1", "n": "", "vs": [[1, "«انظروا، ها يوم القضاء مقبل، لاهب كتنور يكون فيه جميع المستكبرين وفاعلي الإثم عصافة، فيحرقهم ذلك اليوم ولا يبقي لهم أصلا ولا فرعا، يقول الرب القدير."]]}, {"l": "2Pe 3:10", "n": "", "vs": [[10, "إلا أن «يوم الرب» سيأتي كما يأتي اللص في الليل. في ذلك اليوم، تزول السماوات محدثة دويا هائلا وتنحل العناصر محترقة بنار شديدة، وتحترق الأرض وما فيها من منجزات."]]}], "kwAr": "فيوم الرب هو", "noteAr": ""}], "arS": [["ويل", ["H1945"]], [" للذين ", []], ["يتشوقون", ["H183"]], [" ", []], ["ليوم", ["H3117"]], [" ", []], ["الرب", ["H3068"]], [". ", []], ["لماذا", ["H4100"]], [" ", []], ["تطلبون", ["H2088"]], [" مجيء يوم الرب؟ فيوم الرب هو ", []], ["ظلمة", ["H2822"]], [" لا ", []], ["نور", ["H216"]], [".", []]]}, {"c": 5, "v": 19, "text": "فتكونون كرجل هرب من وجه أسد فلقيه دب، أو كمن دخل إلى بيت واتكأ بيده على حائط فلدغته أفعى.", "groups": [{"kw": "As if", "raw": "They should go from one evil to another. Amo_9:1, Amo_9:2; 1Ki_20:29, 1Ki_20:30; Job_20:24, Job_20:25; Isa_24:17, Isa_24:18; Jer_15:2, Jer_15:3; Jer_48:43, Jer_48:44; Act_28:4", "note": "They should go from one evil to another. Amo_9:1, Amo_9:2; 1Ki_20:29, 1Ki_20:30; Job_20:24, Job_20:25; Isa_24:17, Isa_24:18; Jer_15:2, Jer_15:3; Jer_48:43, Jer_48:44; Act_28:4", "refs": [{"l": "Amo 9:1", "n": "", "vs": [[1, "ورأيت السيد واقفا إلى جوار المذبح قائلا: «اضرب تيجان الأعمدة حتى تهتز العتبات، وحطمها على رؤوس جميع الشعب. ومن ينجو منهم أهلكه بالسيف، فلا يهرب منهم أحد ولا يفلت منهم ناج."]]}, {"l": "Amo 9:2", "n": "", "vs": [[2, "وإن نقبوا لأنفسهم ملجأ في أعماق الهاوية، فإن يدي تطولهم هناك، وإن ارتقوا إلى السماوات فمن هناك أنزلهم."]]}, {"l": "1Ki 20:29", "n": "", "vs": [[29, "وهكذا تواجه الطرفان سبعة أيام. وفي اليوم السابع دارت رحى الحرب، فقتل بنو إسرائيل في يوم واحد مئة ألف من مشاة أرام،"]]}, {"l": "1Ki 20:30", "n": "", "vs": [[30, "وهرب الأحياء إلى داخل مدينة أفيق، فانهار السور على السبعة والعشرين ألف رجل الباقين. أما بنهدد فقد لجأ إلى المدينة واختبأ فيها في مخدع داخل مخدع."]]}, {"l": "Job 20:24", "n": "", "vs": [[24, "إن فر من آلة حرب من حديد، تخترقه قوس النحاس."]]}, {"l": "Job 20:25", "n": "", "vs": [[25, "اخترقته عميقا وخرجت من جسده، ونفذ حدها اللامع من مرارته، وحل به رعب."]]}, {"l": "Isa 24:17", "n": "", "vs": [[17, "فالرعب والحفرة والفخ عليكم ياساكني الأرض."]]}, {"l": "Isa 24:18", "n": "", "vs": [[18, "وكل من يهرب من صوت الرعب يقع في الحفرة، ومن يتسلق الحفرة ناجيا يعلق بالفخ، لأن الهلاك يهبط عليكم من السماء، وتتزلزل الأرض تحت أقدامكم."]]}, {"l": "Jer 15:2", "n": "", "vs": [[2, "وعندما يسألونك: إلى أين نذهب؟ أجبهم: هذا ما يعلنه الرب: من هو للوبأ فبالوبأ يموت، ومن هو للسيف فبالسيف يقتل، ومن هو للمجاعة فبالمجاعة يفنى، ومن هو للسبي فإلى السبي يذهب."]]}, {"l": "Jer 15:3", "n": "", "vs": [[3, "وأعهد بهم إلى أربعة أصناف من الخراب يقول الرب: السيف للذبح، والكلاب للتمزيق، وطيور السماء ووحوش الأرض للافتراس والإهلاك."]]}, {"l": "Jer 48:43", "n": "", "vs": [[43, "يترصدكم الرعب والحفرة والفخ ياأهل موآب، يقول الرب."]]}, {"l": "Jer 48:44", "n": "", "vs": [[44, "من يهرب من الخوف يقع في الحفرة، ومن يصعد من الحفرة يعلق بالفخ، لأني أجلب على موآب هذه المحن في سنة عقابهم، يقول الرب."]]}, {"l": "Act 28:4", "n": "", "vs": [[4, "ورأى أهل مالطة الأفعى عالقة بيده، فقال بعضهم لبعض: «لابد أن هذا الرجل قاتل، فإن العدل لم يدعه يحيا بعدما نجا من البحر»."]]}], "kwAr": "فتكونون", "noteAr": "ينتقلون من شر إلى شر. انظر عا 9: 1، 2؛ 1مل 20: 29، 30؛ أي 20: 24، 25؛ إش 24: 17، 18؛ إر 15: 2، 3؛ 48: 43، 44؛ أع 28: 4"}], "arS": [["فتكونون", ["H834"]], [" ", []], ["كرجل", ["H376"]], [" ", []], ["هرب", ["H5127"]], [" من ", []], ["وجه", ["H4480", "H6440"]], [" ", []], ["أسد", ["H738"]], [" ", []], ["فلقيه", ["H6293"]], [" ", []], ["دب", ["H1677"]], ["، أو كمن ", []], ["دخل", ["H935"]], [" إلى ", []], ["بيت", ["H1004"]], [" ", []], ["واتكأ", ["H5564"]], [" ", []], ["بيده", ["H3027"]], [" على ", []], ["حائط", ["H7023"]], [" ", []], ["فلدغته", ["H5391"]], [" ", []], ["أفعى", ["H5175"]], [".", []]]}, {"c": 5, "v": 20, "text": "أو ليس يوم الرب ظلمة لا نورا، وقتاما خاليا من الضياء؟", "groups": [{"kw": "darkness", "raw": "Job_3:4-6, Job_10:21, Job_10:22; Isa_13:10; Eze_34:12; Nah_1:8; Mat_22:13; Jud_1:13; Rev_16:10", "note": "", "refs": [{"l": "Job 3:4-6", "n": "", "vs": [[4, "ليتحول ذلك اليوم إلى ظلام. لا يرعاه الله من فوق، ولا يشرق عليه نهار."], [5, "ليستول عليه الظلام وظل الموت. ليكتنفه سحاب ولتروعه ظلمات النهار."], [6, "أما ذلك الليل فليعتقله الدجى المتكاثف، ولا يبتهج مع سائر أيام السنة، ولا يحص في عدد الشهور."]]}, {"l": "Job 10:21", "n": "", "vs": [[21, "قبل أن أمضي إلى حيث لا أعود، إلى أرض الظلمة وظل الموت،"]]}, {"l": "Job 10:22", "n": "", "vs": [[22, "إلى أرض الظلمة المتكاثفة والفوضى، حيث الإشراق فيها كالليل البهيم»."]]}, {"l": "Isa 13:10", "n": "", "vs": [[10, "فإن نجوم السماء وكواكبها لا تشرق بنورها، والشمس تظلم عند بزوغها، والقمر لا يشع بضوئه."]]}, {"l": "Eze 34:12", "n": "", "vs": [[12, "وكما يتفقد الراعي قطيعه في اليوم الذي يكون فيه بين غنمه المشتتة، هكذا أتفقد قطيعي وأخلصه من كل الأماكن التي تفرق إليها في يوم غائم كئيب."]]}, {"l": "Nah 1:8", "n": "", "vs": [[8, "ولكنه بطوفان طام يخفي معالم نينوى، وتدرك الظلمة أعداءه."]]}, {"l": "Mat 22:13", "n": "", "vs": [[13, "فأمر الملك خدامه قائلا: قيدوا رجليه ويديه، واطرحوه في الظلام الخارجي، هنالك يكون البكاء وصرير الأسنان!"]]}, {"l": "Jud 1:13", "n": "", "vs": [[13, "وبأعمالهم المخجلة يفضحون أنفسهم كأمواج في البحر هائجة تقذف الأوساخ. وهم أشبه بنجوم تائهة في الفضاء، مصيرها الظلام الشديد إلى الأبد!"]]}, {"l": "Rev 16:10", "n": "", "vs": [[10, "ثم سكب الملاك الخامس كأسه على عرش الوحش، فحل بمملكته ظلام دامس، جعل أتباعه يعضون ألسنتهم من الألم."]]}], "kwAr": "ظلمة", "noteAr": ""}], "arS": [["أو ليس ", []], ["يوم", ["H3117"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["ظلمة", ["H2822"]], [" لا ", []], ["نورا", ["H216"]], ["، ", []], ["وقتاما", ["H651"]], [" خاليا من ", []], ["الضياء", ["H5051"]], ["؟", []]]}, {"c": 5, "v": 21, "text": "إني أمقت أعيادكم وأحتقرها، ولا أسر باحتفالاتكم.", "groups": [{"kw": "hate", "raw": "Pro_15:8, Pro_21:27, Pro_28:9; Isa_1:11-16, Isa_66:3; Jer_6:20, Jer_7:21-23; Hos_8:13; Mat_23:14", "note": "", "refs": [{"l": "Pro 15:8", "n": "", "vs": [[8, "قربان المنافقين مكرهة الرب، ومسرته صلاة المستقيمين."]]}, {"l": "Pro 21:27", "n": "", "vs": [[27, "ذبيحة الشرير رجس عند الرب، فكم بالحري إن قربها بنية أثيمة؟"]]}, {"l": "Pro 28:9", "n": "", "vs": [[9, "من يصرف أذنه عن الاستماع إلى الشريعة، تصير حتى صلاته رجاسة."]]}, {"l": "Isa 1:11-16", "n": "", "vs": [[11, "ماذا تجديني كثرة ذبائحكم، يقول الرب؟ اتخمت من محرقات كباش وشحم المسمنات، ولا أسر بدم عجول وخرفان وتيوس."], [12, "حين جئتم لتمثلوا أمامي، من طلب منكم أن تدوسوا دوري؟"], [13, "كفوا عن تقديم قرابين باطلة، فالبخور رجس لي، وكذلك رأس الشهر والسبت والدعاء إلى المحفل، فأنا لا أطيق الاعتكاف مع ارتكاب الإثم."], [14, "لشد ما تبغض نفسي احتفالات رؤوس شهوركم ومواسم أعيادكم! صارت علي عبئا، وسئمت حملها."], [15, "عندما تبسطون نحوي أيديكم أحجب وجهي عنكم، وإن أكثرتم الصلاة لا أستجيب، لأن أيديكم مملوءة دما."], [16, "اغتسلوا، تطهروا، أزيلوا شر أعمالكم من أمام عيني. كفوا عن اقتراف الإثم،"]]}, {"l": "Isa 66:3", "n": "", "vs": [[3, "إن من ينحر ثورا كمن يقتل إنسانا، ومن يقرب حملا كمن يكسر عنق كلب، ومن يصعد تقدمة حنطة كمن يقدم دم خنزير، ومن يحرق بخورا كمن يبارك وثنا، لأن هؤلاء آثروا طرقهم، واستطابت نفوسهم أرجاسهم."]]}, {"l": "Jer 6:20", "n": "", "vs": [[20, "لأي غرض يصعد إلي البخور من شبا، وقصب الذريرة من أرض نائية؟ محرقاتكم مرفوضة، وتقدماتكم لا تسرني»."]]}, {"l": "Jer 7:21-23", "n": "", "vs": [[21, "وهذا ما يعلنه الرب القدير إله إسرائيل: «أضيفوا محرقاتكم إلى ذبائحكم وكلوا لحمها."], [22, "فإني لم أكلم آباءكم ولم آمرهم يوم أخرجتهم من مصر بشأن محرقة أو ذبيحة"], [23, "إنما أوصيتهم أن يطيعوا صوتي فأكون لهم إلها، ويكونون لي شعبا وأن يسلكوا في كل الطريق الذي أوصيتهم به، فينالوا خيرا."]]}, {"l": "Hos 8:13", "n": "", "vs": [[13, "يذبحون الذبائح المقربة إلي ليأكلوا لحومها، لا ليقدموها إلي. ولكني لا أسر بها. والآن أذكر إثمهم وأعاقبهم على خطاياهم وإلى مصر يرجعون."]]}, {"l": "Mat 23:14", "n": "", "vs": [[14, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تلتهمون بيوت الأرامل وتتذرعون بإطالة صلواتكم. لذلك ستنزل بكم دينونة أقسى!"]]}], "kwAr": "أمقت", "noteAr": ""}, {"kw": "I will", "raw": "Gen_8:21; Lev_26:31; Eph_5:2; Phi_4:18", "note": "", "refs": [{"l": "Gen 8:21", "n": "", "vs": [[21, "فتقبلها الرب برضى، وقال في نفسه: «لن ألعن الأرض مرة أخرى من أجل الإنسان، لأن أهواء قلب الإنسان شريرة منذ حداثته ولن أقدم على إهلاك كل حي كما فعلت."]]}, {"l": "Lev 26:31", "n": "", "vs": [[31, "وأحول مدنكم إلى خرائب، وأجعل مقادسكم موحشة، ولا أبتهج برائحة تقدمات سروركم،"]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "Phi 4:18", "n": "", "vs": [[18, "فالآن عندي كل ما يسد حاجتي ويزيد عنها. أنا في بحبوحة إذ تسلمت من أبفروديتس ما بعثتم به إلي، عطرا طيب الرائحة، ذب
