<script>window.CATALOG=[{"id": 17, "abbr": "Est", "en": "Esther", "nc": 10, "nv": 167, "refs": 1266, "last": "10:3", "first": "وحدث في أيام أحشويروش، الذي امتد حكمه من الهند إلى كوش، فملك على مئة وسبعة وعشرين إقليما،"}, {"id": 18, "abbr": "Job", "en": "Job", "nc": 42, "nv": 1070, "refs": 10209, "last": "42:17", "first": "عاش في أرض عوص رجل اسمه أيوب، كان صالحا كاملا يتقي الله ويحيد عن الشر."}, {"id": 19, "abbr": "Psa", "en": "Psalms", "nc": 150, "nv": 2461, "refs": 33395, "last": "150:6", "first": "طوبى للإنسان الذي لا يتبع مشورة الأشرار، ولا يقف في طريق الخاطئين، ولا يجالس المستهزئين."}, {"id": 20, "abbr": "Pro", "en": "Proverbs", "nc": 31, "nv": 915, "refs": 10457, "last": "31:31", "first": "هذه هي أمثال سليمان بن داود ملك إسرائيل،"}, {"id": 21, "abbr": "Ecc", "en": "Ecclesiastes", "nc": 12, "nv": 222, "refs": 3186, "last": "12:14", "first": "هذه أقوال الجامعة ابن داود ملك أورشليم."}, {"id": 22, "abbr": "Son", "en": "Song of Solomon", "nc": 8, "nv": 117, "refs": 1802, "last": "8:14", "first": "هذا نشيد الأناشيد لسليمان."}, {"id": 23, "abbr": "Isa", "en": "Isaiah", "nc": 66, "nv": 1292, "refs": 21959, "last": "66:24", "first": "هذه هي رؤيا إشعياء بن آموص، التي أعلنت له بشأن يهوذا وأورشليم في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا."}, {"id": 24, "abbr": "Jer", "en": "Jeremiah", "nc": 52, "nv": 1364, "refs": 20659, "last": "52:34", "first": "هذه نبوءة إرميا بن حلقيا أحد الكهنة المقيمين في عناثوث بأرض سبط بنيامين."}, {"id": 25, "abbr": "Lam", "en": "Lamentations", "nc": 5, "nv": 154, "refs": 2238, "last": "5:22", "first": "كيف أصبحت المدينة الآهلة بالسكان مهجورة وحيدة؟ صارت كأرملة! هذه التي كانت عظيمة بين الأمم. السيدة بين المدن صارت تحت الجزية!"}, {"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 48, "nv": 1273, "refs": 15264, "last": "48:35", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 30, "abbr": "Amo", "en": "Amos", "verses": [{"c": 1, "v": 1, "text": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين.", "groups": [{"kw": "The words", "raw": "Jer_1:1, Jer_7:27", "note": "", "refs": [{"l": "Jer 1:1", "n": "", "vs": [[1, "هذه نبوءة إرميا بن حلقيا أحد الكهنة المقيمين في عناثوث بأرض سبط بنيامين."]]}, {"l": "Jer 7:27", "n": "", "vs": [[27, "ولكن عندما تكلمهم بهذه العبارات فإنهم لن يسمعوا، وتدعوهم فلا يجيبونك."]]}], "kwAr": "هذه كلمات", "noteAr": ""}, {"kw": "who", "raw": "Amo_7:14; Exo_3:1; 1Ki_19:19; Psa_78:70-72; Mat_4:18; 1Co_1:27", "note": "", "refs": [{"l": "Amo 7:14", "n": "", "vs": [[14, "فأجاب عاموس: «أنا لم أكن نبيا ولا ابن نبي، إنما أنا راعي غنم وجاني جميز،"]]}, {"l": "Exo 3:1", "n": "", "vs": [[1, "وأما موسى فكان يرعى غنم حميه يثرون كاهن مديان، فقاد الغنم إلى ما وراء الطرف الأقصى من الصحراء حتى جاء إلى حوريب جبل الله."]]}, {"l": "1Ki 19:19", "n": "", "vs": [[19, "فانطلق إيليا من هناك فوجد أليشع بن شافاط يحرث حقلا، وأمامه أحد عشر زوجا من البقر، وهو يسير خلف الزوج الثاني عشر. فمر به إيليا وطرح عليه رداءه،"]]}, {"l": "Psa 78:70-72", "n": "", "vs": [[70, "واصطفى داود عبده، وأخذه من بين حظائر الغنم."], [71, "من خلف النعاج المرضعة أتى به، ليرعى يعقوب شعبه وإسرائيل ميراثه."], [72, "فرعاهم بقلب مستقيم، وهداهم بيديه الماهرتين."]]}, {"l": "Mat 4:18", "n": "", "vs": [[18, "وبينما كان يسوع يمشي على شاطيء بحيرة الجليل، رأى أخوين، هما سمعان الذي يدعى بطرس وأندراوس أخوه، يلقيان الشبكة في البحيرة، إذ كانا صيادين."]]}, {"l": "1Co 1:27", "n": "", "vs": [[27, "بل إن الله قد اختار ما هو جاهل في العالم ليخجل الحكماء. وقد اختار الله ما هو ضعيف في العالم ليخجل المقتدرين."]]}], "kwAr": "الذي كان", "noteAr": ""}, {"kw": "Tekoa", "raw": "2Sa_14:2; 2Ch_11:6, 2Ch_20:20; Jer_6:1", "note": "", "refs": [{"l": "2Sa 14:2", "n": "", "vs": [[2, "فاستدعى يوآب من تقوع امرأة حكيمة وقال لها: «تظاهري بالحزن، وارتدي ثياب الحداد، ولا تتطيبي، وتصرفي كامرأة قضت أياما طويلة غارقة في أحزانها على فقيد."]]}, {"l": "2Ch 11:6", "n": "", "vs": [[6, "في بيت لحم وعيطام وتقوع،"]]}, {"l": "2Ch 20:20", "n": "", "vs": [[20, "وفي ساعة مبكرة من صباح اليوم التالي توجه جيش يهوذا إلى صحراء تقوع، فقال يهوشافاط لهم عند خروجهم: «اصغوا يارجال يهوذا وياسكان أورشليم. آمنوا بالرب إلهكم فتأمنوا. آمنوا بأنبيائه فتفلحوا»."]]}, {"l": "Jer 6:1", "n": "", "vs": [[1, "«لوذوا بالنجاة ياذرية بنيامين، واهربوا من وسط أورشليم. انفخوا بالبوق في تقوع، وأشعلوا علم نار على بيت هكاريم، لأن الشر قد أقبل من الشمال ليعيث في الأرض خرابا."]]}], "kwAr": "تقوع", "noteAr": ""}, {"kw": "he saw", "raw": "Isa_1:1; Mic_1:1", "note": "", "refs": [{"l": "Isa 1:1", "n": "", "vs": [[1, "هذه هي رؤيا إشعياء بن آموص، التي أعلنت له بشأن يهوذا وأورشليم في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا."]]}, {"l": "Mic 1:1", "n": "", "vs": [[1, "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."]]}], "kwAr": "رآه", "noteAr": ""}, {"kw": "in the", "raw": "2Ki_14:21, 2Ki_15:1, 2Ki_15:2, Azariah, 2Chr. 26:1-23; Hos_1:1; Mat_1:8, Mat_1:9", "note": "2Ki_14:21, 2Ki_15:1, 2Ki_15:2, Azariah, 2Chr. 26:1-23; Hos_1:1; Mat_1:8, Mat_1:9", "refs": [{"l": "2Ki 14:21", "n": "", "vs": [[21, "ونصب كل شعب يهوذا ابنه عزريا ملكا، وله من العمر ست عشرة سنة، فخلف أباه أمصيا على العرش."]]}, {"l": "2Ki 15:1", "n": "", "vs": [[1, "وفي السنة السابعة والعشرين من حكم يربعام ملك إسرائيل، تولى عزريا بن أمصيا عرش يهوذا."]]}, {"l": "2Ki 15:2", "n": "", "vs": [[2, "وكان عمره ست عشرة سنة حين ملك، ودام حكمه في أورشليم اثنتين وخمسين سنة، واسم أمه يكليا من أورشليم."]]}, {"l": "2Ch 26:1-23", "n": "", "vs": [[1, "ونصب كل شعب يهوذا ابنه عزيا ملكا، وله من العمر ست عشرة سنة، فخلف أباه أمصيا على العرش."], [2, "وهو الذي استرد أيلة ليهوذا ورممها."], [3, "ودام حكمه اثنتين وخمسين سنة في أورشليم، واسم أمه يكليا من أورشليم."], [4, "وصنع ما هو قويم في عيني الرب، حسب كل ما فعله أبوه أمصيا."], [5, "وكان يطلب الرب في حياة زكريا الذي لقنه مخافة الله، وفي الفترة التي واظب فيها على طلب الرب أنجح الله مساعيه."], [6, "وزحف على الفلسطينيين وحاربهم، وهدم سور جت وسور يبنة وسور أشدود، وبنى مدنا في أشدود وبقية أرض الفلسطينيين."], [7, "وأعانه الرب على الفلسطينيين وعلى العرب المقيمين في جور بعل وعلى المعونيين."], [8, "ودفع العمونيون له الجزية، وطبقت شهرته الآفاق حتى بلغت أطراف مصر، لأن شوكته قويت جدا."], [9, "وبنى عزيا أبراجا في أورشليم عند باب الزاوية وعند باب الوادي وعند الزاوية وحصنها."], [10, "كما شيد أبراجا في الصحراء، وحفر آبارا عديدة لأنه كان يملك ماشية كثيرة في الساحل والسهل، كذلك استخدم كرامين وفلاحين في الجبال والأراضي الخصيبة لأنه كان مولعا بالفلاحة."], [11, "وكان لعزيا جيش من المقاتلين يخرجون فرقا بموجب سجلات إحصائهم الذي أعده يعيئيل الكاتب ومعسيا العريف، بإشراف حننيا أحد قواد الملك."], [12, "فكانت جملة عدد زعماء العائلات المتولين قيادة المحاربين ألفين وست مئة،"], [13, "يشرفون على جيش من الجنود المدربين مؤلف من ثلاث مئة ألف وسبعة آلاف وخمس مئة، وجميعهم مقاتلون أشداء يدعمون الملك في حربه ضد أعدائه."], [14, "فزود عزيا كل جيشه بأتراس ورماح وخوذ ودروع وقسي وحجارة مقاليع."], [15, "وقام المخترعون من رجاله باختراع منجنيقات نصبها على أبراج أورشليم وعلى الزوايا لرمي السهام والحجارة الضخمة. وذاعت شهرته في الآفاق وآزره الله وأعانه وقواه بصورة مدهشة."], [16, "وعندما بلغت قوته أوجها امتلأ قلبه بكبرياء أدت إلى هلاكه، إذ خان الرب ودخل إلى هيكله ليوقد على مذبح البخور."], [17, "فتبعه عزريا الكاهن محاطا بثمانين كاهنا من كهنة الرب الجريئين."], [18, "وتحدوه قائلين: «لا يحل لك ياعزيا أن توقد للرب، فهذا من حق الكهنة بني هرون المفرزين وحدهم للإيقاد. اخرج من المكان المقدس لأنك خنت الرب ولن يكرمك الرب الإله»."], [19, "فاغتاظ عزيا ورفض أن يترك مجمرة البخور التي كان آنئذ يمسك بها. وإذا بمرض البرص يظهر على جبهته أمام الكهنة في هيكل الرب حيث كان واقفا إلى جوار مذبح البخور"], [20, "فتفرس به رئيس الكهنة عزريا وسائر الكهنة وإذا بهم يشاهدون أمارات البرص في جبهته فطردوه من الهيكل، بل إنه هو نفسه بادر إلى الخروج لأن الرب ابتلاه بالبرص."], [21, "وظل عزيا الملك أبرص إلى يوم وفاته، ولزم بيتا منعزلا لأنه منع عن بيت الرب. وتولى ابنه يوثام حكم الشعب نيابة عنه."], [22, "أما بقية أخبار عزيا من بدايتها إلى نهايتها فقد دونها إشعياء بن أموص النبي."], [23, "ثم مات عزيا فدفنوه مع آبائه في مدينة داود في حقل مقبرة الملوك، لأنهم قالوا: «إنه أبرص». وخلفه ابنه يوثام على الملك."]]}, {"l": "Hos 1:1", "n": "", "vs": [[1, "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."]]}, {"l": "Mat 1:8", "n": "", "vs": [[8, "وآسا أنجب يهوشافاط. ويهوشافاط أنجب يورام. ويورام أنجب عزيا."]]}, {"l": "Mat 1:9", "n": "", "vs": [[9, "وعزيا أنجب يوثام. ويوثام أنجب أحاز. وأحاز أنجب حزقيا."]]}], "kwAr": "في أيام عزيا", "noteAr": "انظر 2مل 14: 21؛ 15: 1، 2؛ 2أخ 26: 1-23؛ هو 1: 1؛ مت 1: 8، 9 (عزريا)"}, {"kw": "and in", "raw": "Amo_7:9-11; 2Ki_14:23-29", "note": "", "refs": [{"l": "Amo 7:9-11", "n": "", "vs": [[9, "فتقفر مرتفعات إسحاق ويعتري الخراب مقادس إسرائيل، وأثور على بيت يربعام بالسيف»."], [10, "فأرسل أمصيا كاهن بيت إيل إلى يربعام ملك إسرائيل قائلا: «قد تآمر عليك عاموس في وسط بيت إسرائيل، ولا تطيق الأرض تحمل كل تنبؤاته"], [11, "لأن هذا ما يقوله عاموس: إن يربعام يموت بحد السيف، ويسبى إسرائيل بعيدا عن دياره»."]]}, {"l": "2Ki 14:23-29", "n": "", "vs": [[23, "وفي السنة الخامسة عشرة من حكم أمصيا بن يوآش ملك يهوذا، تولى يربعام بن يوآش عرش إسرائيل في السامرة إحدى وأربعين سنة."], [24, "وارتكب الشر في عيني الرب، ولم يعدل عن أي من خطايا يربعام بن نباط التي استغوى بها الإسرائيليين فأخطأوا."], [25, "وهو الذي استرجع لإسرائيل أراضيها الممتدة من حماة إلى البحر الميت، تحقيقا لكلام الرب الذي نطق به على لسان عبده يونان بن أمتاي النبي من أهل جت حافر،"], [26, "لأن الرب رأى ما يعانيه الإسرائيليون من عبيد وأحرار من ضيق أليم مرير. ولم يكن لهم من معين."], [27, "وإذ لم يكن الرب قد قضى بمحو اسم إسرائيل من تحت السماء، أنقذهم على يد يربعام بن يوآش."], [28, "أما بقية أخبار يربعام وكل منجزاته وأعماله وكيف حارب واسترجع لإسرائيل كلا من دمشق وحماة التي استولى عليها يهوذا أليست هي مدونة في كتاب أخبار أيام ملوك إسرائيل؟"], [29, "ثم مات يربعام ودفن مع آبائه ملوك إسرائيل، وخلفه ابنه زكريا على الملك."]]}], "kwAr": "وفي أيام يربعام", "noteAr": ""}, {"kw": "the earthquake", "raw": "Zec_14:5", "note": "", "refs": [{"l": "Zec 14:5", "n": "", "vs": [[5, "ويهربون من خلال وادي جبالي الممتد إلى آصل. تهربون كما هربتم من الزلزلة في أيام حكم عزيا ملك يهوذا، ويأتي الرب إلهي في موكب من جميع قديسيه."]]}], "kwAr": "الزلزلة", "noteAr": ""}], "arS": [["هذه ", []], ["كلمات", ["H1697"]], [" ", []], ["عاموس", ["H5986"]], [" الذي ", []], ["كان", ["H1961"]], [" ", []], ["راعيا", ["H5349"]], [" من ", []], ["رعاة", ["H5349"]], [" ", []], ["تقوع", ["H4480", "H8620"]], ["، ينبيء فيها بما ", []], ["رآه", ["H2372"]], [" بشأن ", []], ["إسرائيل", ["H3478"]], [" في ", []], ["أيام", ["H3117"]], [" ", []], ["عزيا", ["H5818"]], [" ", []], ["ملك", ["H4428"]], [" ", []], ["يهوذا", ["H3063"]], ["، وفي أيام ", []], ["يربعام", ["H3379"]], [" ", []], ["بن", ["H1121"]], [" ", []], ["يوآش", ["H3101"]], [" ملك إسرائيل، ", []], ["قبل", ["H6440"]], [" وقوع ", []], ["الزلزلة", ["H7494"]], [" ", []], ["بسنتين", ["H8141"]], [".", []]]}, {"c": 1, "v": 2, "text": "قال: «يزأر الرب من صهيون ويدوي بصوته من أورشليم، فتنتحب مراعي الرعاة، وتذوي قمة الكرمل.", "groups": [{"kw": "The Lord", "raw": "Amo_3:7, Amo_3:8; Pro_20:2; Isa_42:13; Jer_25:30; Hos_13:8; Joe_2:11, Joe_3:16", "note": "", "refs": [{"l": "Amo 3:7", "n": "", "vs": [[7, "إن السيد الرب لا يجري أمرا من غير أن يعلن سره لعبيده الأنبياء."]]}, {"l": "Amo 3:8", "n": "", "vs": [[8, "قد زأر الأسد فمن لا يخاف، وتكلم الرب فمن لا يتنبأ؟"]]}, {"l": "Pro 20:2", "n": "", "vs": [[2, "سخط الملك مثل زمجرة الأسد، ومن يثير غيظه يسيء إلى نفسه."]]}, {"l": "Isa 42:13", "n": "", "vs": [[13, "يبرز الرب كجبار، يستثير حميته كما يستثيرها المحارب، ويطلق صرخة حرب داوية، يظهر جبروته أمام أعدائه."]]}, {"l": "Jer 25:30", "n": "", "vs": [[30, "أما أنت فتنبأ عليهم بكل هذا القضاء، وقل لهم: «الرب يزأر من العلاء، ومن مسكن قدسه يدوي صوته. يزأر زئيرا على مسكنه، ويجهر هاتفا على جميع سكان الأرض كما يجهر الدائسون على العنب»."]]}, {"l": "Hos 13:8", "n": "", "vs": [[8, "وأنقض عليهم كدبة ثاكل، وأمزق قلوبهم أشلاء وأفترسهم هناك كلبوءة، ووحش البر يقطعهم إربا إربا."]]}, {"l": "Joe 2:11", "n": "", "vs": [[11, "يجهر الرب بصوته في مقدمة جيشه لأن جنده لا يحصى لهم عدد، ومن ينفذ أمره يكون مقتدرا، لأن يوم الرب عظيم ومخيف جدا، فمن يتحمله؟"]]}, {"l": "Joe 3:16", "n": "", "vs": [[16, "يزأر الرب في صهيون، ويجلجل بصوته من أورشليم فترجف السماوات والأرض؛ لكن الرب يكون ملجأ لشعبه، وحصنا لبني إسرائيل."]]}], "kwAr": "الرب", "noteAr": ""}, {"kw": "the habitations", "raw": "Amo_4:7, Amo_4:8; Isa_33:9; Jer_12:4, Jer_14:2; Joe_1:9-13, Joe_1:16-18", "note": "", "refs": [{"l": "Amo 4:7", "n": "", "vs": [[7, "منعت عنكم المطر ولم يكن قد بقي للحصاد سوى ثلاثة أشهر، وأمطرت على مدينة دون مدينة، وعلى حقل دون الآخر، فجف الحقل الذي لم أمطر عليه."]]}, {"l": "Amo 4:8", "n": "", "vs": [[8, "فأقبلت مدينتان أو ثلاث على مدينة واحدة لتشرب ماء، ولكنها لم ترتو، ومع ذلك لم ترجعوا إلي تائبين، يقول الرب."]]}, {"l": "Isa 33:9", "n": "", "vs": [[9, "ناحت الأرض وذوت. خجل لبنان وذبل، وصار شارون كالبرية، ونفض باشان والكرمل عنهما أوراقهما."]]}, {"l": "Jer 12:4", "n": "", "vs": [[4, "إلى متى تظل الأرض نائحة وعشب كل حقل ذاويا؟ هلكت البهائم والطيور من شر الساكنين فيها القائلين: «إنه لن يرى خاتمة مصيرنا»."]]}, {"l": "Jer 14:2", "n": "", "vs": [[2, "«أرض يهوذا تنوح وأبوابها واهية. أهلها يندبون مطروحين إلى الأرض، وعويل أورشليم قد صعد إلى العلى."]]}, {"l": "Joe 1:9-13", "n": "", "vs": [[9, "لأن تقدمات الدقيق والخمر قد انقطعت عن بيت الرب، وانتحب الكهنة خدام الرب."], [10, "قد خربت الحقول، وناحت الأرض لأن الحنطة تلفت والخمرة انقطعت، وافتقد زيت الزيتون."], [11, "اخزوا أيها الحراثون وأعولوا أيها الكرامون على الحنطة والشعير، لأن حصاد الحقل قد تلف."], [12, "قد ذوى الكرم وذبل التين والرمان والنخيل والتفاح ويبست سائر أشجار الحقل، وزالت البهجة من أبناء البشر."], [13, "أيها الكهنة اتشحوا بالمسوح ونوحوا. ولولوا ياخدام المذبح. تعالوا وبيتوا ليلتكم بالمسوح ياخدام إلهي، لأن تقدمات الدقيق والخمر قد منعت عن هيكل الله."]]}, {"l": "Joe 1:16-18", "n": "", "vs": [[16, "ألم ينقطع الطعام أمام عيوننا، ألم يتلاش الفرح والغبطة من بيت إلهنا؟"], [ الهائج."], [24, "خارت قوى دمشق وأدبرت لتهرب، واستولى عليها الرعب، وأدركها الكرب والألم كامرأة ماخض."], [25, "كيف لم يبق على المدينة الشهيرة، مدينة مسرتي؟"], [26, "لذلك سيتساقط شبابها في ساحاتها، ويبيد جميع جنودها في ذلك اليوم، يقول الرب القدير."], [27, "سأضرم النار في سور دمشق فتلتهم قصور بنهدد»."]]}, {"l": "Zec 9:1", "n": "", "vs": [[1, "وحي قضاء الرب بعقاب أرض حدراخ ودمشق، لأن أعين الناس وسائر أسباط إسرائيل نحو الرب."]]}], "kwAr": "دمشق", "noteAr": ""}, {"kw": "and for four", "raw": "or, yea", "note": "or, yea", "refs": [], "kwAr": "والأربع", "noteAr": "أو: «بل»."}, {"kw": "for four", "raw": "turn away the punishment thereof, or, convert it, or, let it be quiet, and so, Amo_1:6, 9-2:16", "note": "turn away the punishment thereof, or, convert it, or, let it be quiet, and so, Amo_1:6, 9-2:16", "refs": [{"l": "Amo 1:6", "n": "", "vs": [[6, "هذا ما يقوله الرب: من أجل معاصي غزة الثلاث والأربع لن أرد عنها سخطي، لأن أهلها نفوا شعبا عن آخره ليسلموه إلى أدوم."]]}, {"l": "Amo 2:16", "n": "", "vs": [[16, "والثابت الجنان بين أقرانه الأبطال يفر عريانا في ذلك اليوم، يقول الرب."]]}], "kwAr": "لن أرد عنها", "noteAr": "«لن أرد عقوبتها»، أو «أحوّلها»، أو «تسكن»، وكذلك في انظر عا 1: 6، 9، 11، 13؛ 2: 1، 4، 6"}, {"kw": "because", "raw": "1Ki_19:17; 2Ki_8:12, 2Ki_10:32, 2Ki_10:33, 2Ki_13:3, 2Ki_13:7; Isa_41:15", "note": "", "refs": [{"l": "1Ki 19:17", "n": "", "vs": [[17, "فالذي ينجو من سيف حزائيل يقتله ياهو، والذي ينجو من سيف ياهو يقتله أليشع."]]}, {"l": "2Ki 8:12", "n": "", "vs": [[12, "فسأله حزائيل: «لماذا يبكي سيدي؟» فأجابه: «لأني عرفت ما ستنزله ببني إسرائيل من شر، فإنك ستحرق حصونهم وتقتل شبانهم وتذبح أطفالهم وتشق بطون حواملهم»."]]}, {"l": "2Ki 10:32", "n": "", "vs": [[32, "وفي تلك الأيام بدأ الرب يخفض من مساحة أرض إسرائيل، فاستولى حزائيل على أجزاء كبيرة من مناطقهم."]]}, {"l": "2Ki 10:33", "n": "", "vs": [[33, "ابتداء من شرقي نهر الأردن، بما في ذلك أرض جلعاد، أرض الجاديين والرأوبينيين، والمنسيين، من عروعير القائمة على وادي أرنون وجلعاد وباشان."]]}, {"l": "2Ki 13:3", "n": "", "vs": [[3, "فاحتدم غضب الرب على إسرائيل، وسلط عليهم حزائيل ملك أرام، ومن بعده ابنه بنهدد طوال حياته."]]}, {"l": "2Ki 13:7", "n": "", "vs": [[7, "ولم يكن قد بقي من جيش يهوأحاز سوى خمسين فارسا، وعشر مركبات، وعشرة آلاف رجل من المشاة، لأن ملك أرام أفناهم وداس عليهم كما يداس على التراب."]]}, {"l": "Isa 41:15", "n": "", "vs": [[15, "وها أنا أجعلك نورجا محددا جديدا مسننا، فتدرس الجبال وتجعل التلال كالعصافة،"]]}], "kwAr": "لأن أهلها", "noteAr": ""}], "arS": [["هذا", ["H3541"]], [" ما ", []], ["يقوله", ["H559"]], [" ", []], ["الرب", ["H3068"]], [": ", []], ["من", ["H5921"]], [" أجل ", []], ["معاصي", ["H6588"]], [" ", []], ["دمشق", ["H1834"]], [" ", []], ["الثلاث", ["H7969"]], [" ", []], ["والأربع", ["H702"]], [" لن ", []], ["أرد", ["H7725"]], [" عنها سخطي، ", []], ["لأن", ["H5921"]], [" أهلها قد ", []], ["داسوا", ["H1758"]], [" شعبي في ", []], ["جلعاد", ["H1568"]], [" ", []], ["بنوارج", ["H2742"]], [" من ", []], ["حديد", ["H1270"]], [".", []]]}, {"c": 1, "v": 4, "text": "لذلك أرسل نارا على بيت حزائيل فتلتهم حصون بنهدد.", "groups": [{"kw": "I will", "raw": "Amo_1:7, Amo_1:10,Amo_1:12, Amo_1:14, Amo_2:2, Amo_2:5; Jdg_9:19, Jdg_9:20,Jdg_9:57; Jer_17:27, Jer_49:27; Eze_30:8; Eze_39:6; Hos_8:14", "note": "", "refs": [{"l": "Amo 1:7", "n": "", "vs": [[7, "لذلك سأرسل نارا على أسوار غزة تلتهم حصونها."]]}, {"l": "Amo 1:10", "n": "", "vs": [[10, "لهذا أرسل نارا على أسوار صور فتلتهم حصونها."]]}, {"l": "Amo 1:12", "n": "", "vs": [[12, "فأرسل نارا على تيمان، فتلتهم حصون بصرة."]]}, {"l": "Amo 1:14", "n": "", "vs": [[14, "لهذا أضرم نارا في سور ربة فتلتهم حصونها في معترك جلبة يوم الحرب، وفي وسط عاصفة في يوم الزوبعة."]]}, {"l": "Amo 2:2", "n": "", "vs": [[2, "لهذا أرسل نارا على موآب فتلتهم حصون قريوت، فيموت موآب في وسط الضجيج وصيحات المحاربين ودوي الأبواق."]]}, {"l": "Amo 2:5", "n": "", "vs": [[5, "لهذا أرسل نارا على يهوذا فتلتهم حصون أورشليم."]]}, {"l": "Jdg 9:19", "n": "", "vs": [[19, "فإن كنتم قد تصرفتم بحق وصواب مع يربعل وأهل بيته في هذا اليوم، فهنيئا لكم بأبيمالك وهنيئا له بكم."]]}, {"l": "Jdg 9:20", "n": "", "vs": [[20, "وإلا فلتندلع نار من أبيمالك وتلتهم أهل شكيم وسكان القلعة، ولتندلع نار من أهل شكيم ومن سكان القلعة وتلتهم أبيمالك»."]]}, {"l": "Jdg 9:57", "n": "", "vs": [[57, "وكذلك رد الله شر أهل شكيم على رؤوسهم، وبذلك تحققت لعنة يوثام بن يربعل."]]}, {"l": "Jer 17:27", "n": "", "vs": [[27, "ولكن إن لم تستمعوا لي لتقدسوا يوم السبت، وثابرتم على حمل أثقال فيه لتدخلوها من بوابات أورشليم، فإني أضرم بواباتها بالنار فتلتهم قصور أورشليم، ولا تنطفيء»."]]}, {"l": "Jer 49:27", "n": "", "vs": [[27, "سأضرم النار في سور دمشق فتلتهم قصور بنهدد»."]]}, {"l": "Eze 30:8", "n": "", "vs": [[8, "فيدركون أني أنا الرب حين أضرم نارا في مصر وينهار جميع حلفائها."]]}, {"l": "Eze 39:6", "n": "", "vs": [[6, "وأصب نارا على ماجوج وعلى حلفائه الساكنين بأمان في الأرض الساحلية، فيدركون أني أنا الرب."]]}, {"l": "Hos 8:14", "n": "", "vs": [[14, "لأن إسرائيل قد نسي خالقه، وشيد قصورا، وأكثر يهوذا من بناء المدن المحصنة، لهذا سأرسل نارا على هذه المدن فتلتهم حصونه."]]}], "kwAr": "أرسل", "noteAr": ""}, {"kw": "Hazael", "raw": "1Ki_19:15; 2Ki_8:7-15", "note": "", "refs": [{"l": "1Ki 19:15", "n": "", "vs": [[15, "فقال له الرب: «اذهب راجعا في الطريق الصحراوية المفضية إلى دمشق، وهناك امسح حزائيل ملكا على أرام،"]]}, {"l": "2Ki 8:7-15", "n": "", "vs": [[7, "وذهب أليشع إلى دمشق. وكان بنهدد ملك أرام أيضا مريضا، فقيل له إن رجل الله جاء إلى هنا."], [8, "فقال الملك لحزائيل: «احمل معك هدية واذهب لاستقبال رجل الله، واسأل الرب عن طريقه إن كنت سأبرأ من مرضي»."], [9, "فمضى حزائيل لاستقباله آخذا معه هدية، حمل أربعين جملا من كل خيرات دمشق. وقال لأليشع: «ابنك بنهدد ملك أرام أرسلني إليك يسأل إن كان سيبرأ من مرضه»."], [10, "فقال له أليشع: «اذهب وقل له: إنه حتما يشفى. ولكن الرب أراني أنه لابد مائت»."], [11, "وتفرس أليشع في حزائيل طويلا حتى اعترى حزائيل الخجل، وبكى رجل الله."], [12, "فسأله حزائيل: «لماذا يبكي سيدي؟» فأجابه: «لأني عرفت ما ستنزله ببني إسرائيل من شر، فإنك ستحرق حصونهم وتقتل شبانهم وتذبح أطفالهم وتشق بطون حواملهم»."], [13, "فقال حزائيل: «كيف يمكن لمجرد كلب نظير عبدك أن يرتكب هذه الفظائع؟» فأجابه أليشع: «لقد كشف الرب لي أنك ستملك على أرام»."], [14, "فانصرف من عند أليشع ودخل إلى سيده فسأله: «ماذا قال لك أليشع؟» فأجابه: «قال لي إنك تبرأ»."], [15, "وفي صباح اليوم التالي أخذ حزائيل قطعة قماش سميكة، شبعها بالماء، وضغط بها على وجه الملك حتى أخمد أنفاسه وخلفه حزائيل على العرش."]]}], "kwAr": "حزائيل", "noteAr": ""}, {"kw": "Benhadad", "raw": "1Kings 20:1-22; 2Ki_6:24, 2Ki_13:3, 2Ki_13:25; 2Ch_16:2", "note": "", "refs": [{"l": "1Ki 20:1-22", "n": "", "vs": [[1, "وحشد بنهدد ملك أرام كل جيشه، بعد أن انضم إليه اثنان وثلاثون ملكا بخيلهم ومركباتهم، وحاصر السامرة عاصمة إسرائيل."], [2, "ثم بعث بنهدد رسالة إلى أخآب ملك إسرائيل في السامرة تقول:"], [3, "«لي كل فضتك وذهبك وأجمل نسائك وبنوك الحسان»."], [4, "فأجاب ملك إسرائيل: «لك ما طلبته ياسيدي الملك، فأنا وكل ما أملكه لك»."], [5, "فبعث بنهدد رسالة أخرى إلى أخآب تقول: «كنت قد أرسلت إليك طالبا أن تقدم لي كل فضتك وذهبك وأجمل نسائك وبنيك الحسان،"], [6, "ولكني أيضا في نحو هذا الوقت غدا أرسل رجالي إليك ليفتشوا قصرك وبيوت عبيدك، ليستولوا على كل ما هو نفيس»."], [7, "فاستدعى ملك إسرائيل جميع زعماء البلاد وقال: «اعلموا وانظروا أن بنهدد يبغي الشر، فقد بعث يطلب إلي تسليم نسائي وبني وفضتي وذهبي، فوافقت»."], [8, "فقال له كل زعماء البلاد وسائر الشعب: «لا تسمع له ولا تخضع لطلبه»."], [9, "فقال أخآب لرسل بنهدد: «قولوا لسيدي الملك إنني مستعد أن أنفذ جميع مطالبه الأولى، أما المطالب الثانية فلا أستطيع تلبيتها». فرجع الرسل بجوابه إلى بنهدد."], [10, "فبعث إليه بنهدد قائلا: «لتعاقبني الآلهة أشد عقاب وتزد، إن بقي من تراب السامرة ما يكفي لملء قبضة كل واحد من رجالي»."], [11, "فأجاب ملك إسرائيل: «قولوا له: لا يفتخر من يشد درعه كمن يحله» (أي الفخر يكون بعد المعركة لا قبلها)."], [12, "فلما سمع بنهدد هذا الكلام وهو يشرب الخمر في الخيام مع حلفائه الملوك، أمر رجاله أن يتأهبوا للقتال، فاستعدوا للهجوم على المدينة."], [13, "وإذا بنبي يتقدم إلى أخآب قائلا: «هذا ما يقوله الرب: هل ترى هذا الجيش الغفير؟ ها أنا أنصرك عليه اليوم، فتعلم أني أنا الرب»."], [14, "فسأل أخآب: «بمن يكون النصر؟» فأجاب: «هذا ما يقوله الرب: بقوات رؤساء المقاطعات» فعاد يسأل: «من يبتديء الحرب؟» فأجاب: «أنت»."], [15, "فأحصى أخآب رجال رؤساء المقاطعات، فبلغوا مئتين واثنين وثلاثين. ثم أحصى بعدهم بقية جيش إسرائيل فكانوا سبعة آلاف."], [16, "واندفعوا عند الظهر من المدينة وبنهدد منهمك في السكر في الخيام مع حلفائه الملوك الاثنين والثلاثين،"], [17, "وتقدمت قوات رؤساء المقاطعات أولا، فقال المراقبون لبنهدد: «رجال من السامرة قادمون علينا»"], [18, "فقال: «اقبضوا عليهم أحياء، سواء كان قدومهم للهدنة أو للحرب»."], [19, "وهكذا اندفعت قوات رؤساء المقاطعات من المدينة، وفي أعقابها تقدم الجيش الإسرائيلي"], [20, "وهاجم كل رجل منهم واحدا من جيش الأراميين، فهرب الأراميون، ولاحقهم الإسرائيليون. وتمكن بنهدد ملك أرام مع بعض فرسانه من النجاة على خيولهم."], [21, "وتقدم ملك إسرائيل واقتحم الخيل والمركبات، وأنزل بالأراميين هزيمة فادحة."], [22, "واقترب النبي من أخآب وقال له: «اذهب وتأهب، ودبر شؤونك، وفكر بما تفعل، لأنه في نهاية هذا العام يهاجمك ملك أرام،"]]}, {"l": "2Ki 6:24", "n": "", "vs": [[24, "وحشد بنهدد ملك أرام، بعد زمن، كل جيشه وحاصر السامرة."]]}, {"l": "2Ki 13:3", "n": "", "vs": [[3, "فاحتدم غضب الرب على إسرائيل، وسلط عليهم حزائيل ملك أرام، ومن بعده ابنه بنهدد طوال حياته."]]}, {"l": "2Ki 13:25", "n": "", "vs": [[25, "فاسترجع يهوآش بن يهوأحاز من يد بنهدد بن حزائيل المدن التي استولى عليها من أبيه يهوأحاز في الحرب، وهزمه يوآش ثلاث مرات، تمكن خلالها من استرداد مدن إسرائيل."]]}, {"l": "2Ch 16:2", "n": "", "vs": [[2, "فجمع آسا فضة وذهبا من خزائن هيكل الرب وقصر الملك، وأرسلها إلى بنهدد ملك أرام المقيم في دمشق قائلا:"]]}], "kwAr": "بنهدد", "noteAr": ""}], "arS": [["لذلك ", []], ["أرسل", ["H7971"]], [" ", []], ["نارا", ["H784"]], [" على ", []], ["بيت", ["H1004"]], [" ", []], ["حزائيل", ["H2371"]], [" ", []], ["فتلتهم", ["H398"]], [" ", []], ["حصون", ["H759"]], [" ", []], ["بنهدد", ["H1130"]], [".", []]]}, {"c": 1, "v": 5, "text": "وأحطم مزلاج دمشق وأستأصل أهل وادي آون، وأهلك حامل صولجان ملك بيت عدن، ويساق شعب أرام إلى السبي إلى أرض قير.", "groups": [{"kw": "break", "raw": "Isa_43:14; Jer_50:36, Jer_51:30; Lam_2:9; Nah_3:13", "note": "", "refs": [{"l": "Isa 43:14", "n": "", "vs": [[14, "هذا ما يقوله الرب فاديكم قدوس إسرائيل، ها أنا من أجلكم أرسلت إلى بابل لأحطم المغاليق، فيصبح البابليون في سفنهم التي يباهون بها مطرودين هاربين."]]}, {"l": "Jer 50:36", "n": "", "vs": [[36, "ها سيف على عرافيها، فيصبحون حمقى. وها سيف على محاربيها، فيمتلئون رعبا."]]}, {"l": "Jer 51:30", "n": "", "vs": [[30, "قد أحجم محاربو بابل الجبابرة عن القتال، واعتصموا في معاقلهم. خارت شجاعتهم، وصاروا كالنساء. احترقت مساكن بابل وتحطمت مزاليجها."]]}, {"l": "Lam 2:9", "n": "", "vs": [[9, "غاصت في الأرض بواباتها، دمر وحطم مزاليجها. نفى ملكها ورؤساءها بين الأمم. زالت الشريعة، ولم يعد أنبياؤها يحصلون على رؤيا من عند الرب."]]}, {"l": "Nah 3:13", "n": "", "vs": [[13, "انظري إلى جنودك مرتعبين كالنساء في وسطك. صارت أبواب أرضك مفتوحة أمام أعدائك. وشرعت النيران تلتهم مزاليجك."]]}], "kwAr": "وأحطم", "noteAr": ""}, {"kw": "the plain of Aven", "raw": "or, Bikath-aven, Probably Heliopolis, now Baalbek, situated between Libanus and Antilibanus, 56 miles nw of Damascus, according to Antoninus, and celebrated for its temple of the sun.", "note": "or, Bikath-aven, Probably Heliopolis, now Baalbek, situated between Libanus and Antilibanus, 56 miles nw of Damascus, according to Antoninus, and celebrated for its temple of the sun.", "refs": [], "kwAr": "وادي آون", "noteAr": "أو: «بقعة آون». ربما هي هليوبوليس، أي بعلبك اليوم، الواقعة بين لبنان وجبل الشيخ على بعد 56 ميلا شمال غربي دمشق بحسب أنطونينوس، وكانت مشهورة بهيكل الشمس."}, {"kw": "the house of Eden", "raw": "or, Beth-eden, Probably the village of Eden, in Mount Lebanon, marks the site of this place. It is delightfully situated by the side of a most rich and cultivated valley, contains about 400 or 500 families, and is, according to modern authorities, about 20 miles se of Tripoli, and five miles from the cedars.", "note": "or, Beth-eden, Probably the village of Eden, in Mount Lebanon, marks the site of this place. It is delightfully situated by the side of a most rich and cultivated valley, contains about 400 or 500 families, and is, according to modern authorities, about 20 miles se of Tripoli, and five miles from the cedars.", "refs": [], "kwAr": "بيت عدن", "noteAr": "أو: «بيت عدن». لعل قرية عدن في جبل لبنان تدل على موقع هذا المكان. وهي في موضع بالغ الجمال إلى جانب وادٍ غني مزروع، وتضم نحو 400 إلى 500 أسرة، وتبعد بحسب المراجع الحديثة نحو 20 ميلا جنوب شرقي طرابلس وخمسة أميال عن الأرز."}, {"kw": "the people", "raw": "Amo_9:7; 2Ki_16:9", "note": "", "refs": [{"l": "Amo 9:7", "n": "", "vs": [[7, "ألستم لي يابني إسرائيل مثل الكوشيين يقول الرب؟ ألم أخرج إسرائيل من ديار مصر والفلسطينيين من كفتور والأراميين من قير."]]}, {"l": "2Ki 16:9", "n": "", "vs": [[9, "فلبى ملك أشور طلبه، وزحف بجيشه إلى دمشق واستولى عليها، وسبى أهلها إلى قير، وقتل رصين."]]}], "kwAr": "شعب أرام", "noteAr": ""}], "arS": [["وأحطم", ["H7665"]], [" ", []], ["مزلاج", ["H1280"]], [" ", []], ["دمشق", ["H1834"]], [" ", []], ["وأستأصل", ["H3772"]], [" ", []], ["أهل", ["H3427"]], [" ", []], ["وادي", ["H4480", "H1237"]], [" ", []], ["آون", ["H206"]], ["، وأهلك ", []], ["حامل", ["H8551"]], [" ", []], ["صولجان", ["H7626"]], [" ملك ", []], ["بيت", ["H4480", "H1040"]], [" ", []], ["عدن", ["H1040"]], ["، ويساق ", []], ["شعب", ["H5971"]], [" ", []], ["أرام", ["H758"]], [" إلى ", []], ["السبي", ["H1540"]], [" إلى أرض ", []], ["قير", ["H7024"]], [".", []]]}, {"c": 1, "v": 6, "text": "هذا ما يقوله الرب: من أجل معاصي غزة الثلاث والأربع لن أرد عنها سخطي، لأن أهلها نفوا شعبا عن آخره ليسلموه إلى أدوم.", "groups": [{"kw": "three", "raw": "Amo_1:3, Amo_1:9, Amo_1:11", "note": "", "refs": [{"l": "Amo 1:3", "n": "", "vs": [[3, "هذا ما يقوله الرب: من أجل معاصي دمشق الثلاث والأربع لن أرد عنها سخطي، لأن أهلها قد داسوا شعبي في جلعاد بنوارج من حديد."]]}, {"l": "Amo 1:9", "n": "", "vs": [[9, "هذا ما يقوله الرب: من أجل معاصي صور الثلاث والأربع لن أرد عنها سخطي، لأن أهلها سلموا شعبا بكامله إلى أدوم، ونقضوا عهد الإخوة."]]}, {"l": "Amo 1:11", "n": "", "vs": [[11, "وهذا ما يقوله الرب: من أجل معاصي أدوم الثلاث والأربع لن أرد عنهم سخطي، لأنهم تعقبوا إخوتهم بالسيف، وتغاضوا عن كل رحمة، وجعلوا غضبهم يتأجج ملتهما باستمرار، وظلوا حاقدين على الدوام."]]}], "kwAr": "الثلاث", "noteAr": ""}, {"kw": "Gaza", "raw": "1Sa_6:17; 2Ch_28:18; Isa_14:29-31; Jer_47:4, Jer_47:5; Eze_25:15, Eze_25:16; Zep_2:4-7; Zec_9:5; Act_8:26", "note": "", "refs": [{"l": "1Sa 6:17", "n": "", "vs": [[17, "أما قرابين الإثم للرب التي ردها الفلسطينيون من نماذج بواسير الذهب، فكانت واحدا عن أشدود، وواحدا عن غزة، وواحدا عن أشقلون، وواحدا عن جت، وواحدا عن عقرون."]]}, {"l": "2Ch 28:18", "n": "", "vs": [[18, "واقتحم الفلسطينيون مدن السواحل وجنوبي يهوذا واستولوا على بيت شمس وأيلون وجديروت وسوكو وضياعها وتمنة وضياعها وجمزو وضياعها، واستوطنوا فيها،"]]}, {"l": "Isa 14:29-31", "n": "", "vs": [[29, "«لا تفرحي ياكل فلسطين، لأن القضيب الذي ضربك قد انكسر. فإن من أصل تلك الأفعى يخرج أفعوان، وذريته تكون ثعبانا ساما طيارا"], [30, "أما أبكار البائسين فيرعون، والمساكين يربضون آمنين. لكنني أهلك أصلك بالمجاعة وأقضي على بقيتك."], [31, "ولول أيها الباب ونوحي أيتها المدينة! ذوبي خوفا يافلسطين قاطبة لأن جيشا مدربا قد زحف نحوك من الشمال"]]}, {"l": "Jer 47:4", "n": "", "vs": [[4, "رعبا من اليوم المقبل لإبادة الفلسطينيين، ولاستئصال صور وصيدون وكل معين باق، لأن الرب يدمر الفلسطينيين بقية جزيرة كفتور."]]}, {"l": "Jer 47:5", "n": "", "vs": [[5, "قد أصبحت غزة جرداء، وساد أشقلون صمت الموت. يابقية العناقيين، إلى متى تظلون تجرحون أنفسكم حزنا؟"]]}, {"l": "Eze 25:15", "n": "", "vs": [[15, "وهذا أيضا ما يعلنه السيد الرب لأن الفلسطينيين قد أقدموا على الانتقام وأفرطوا فيه بكل لؤم قلوبهم، عامدين إلى الخراب بسبب عداوة أبدية،"]]}, {"l": "Eze 25:16", "n": "", "vs": [[16, "ها أنا أعاقب الفلسطينيين وأستأصل الكريتيين، وأبيد بقية سكان ساحل البحر،"]]}, {"l": "Zep 2:4-7", "n": "", "vs": [[4, "فإن غزة تصبح مهجورة، وأشقلون موحشة، وأهل أشدود يطردون عند الظهيرة، وعقرون تستأصل."], [5, "ويل لكم ياأهل ساحل البحر، أمة الكريتيين. إن قضاء الرب منصب عليكم ياسكان كنعان أرض الفلسطينيين. سأدمرك حتى لا يبقى فيك مقيم."], [6, "وأنت ياأرض ساحل البحر تصبحين مراعي ومروجا للرعاة وحظائر للمواشي."], [7, "ويصبح ساحل البحر ملكا لبقية بيت يهوذا فيرعون فيه قطعانهم، ويرقدون في المساء في بيوت أشقلون، لأن الرب إلههم يفتقدهم ويرد سبيهم."]]}, {"l": "Zec 9:5", "n": "", "vs": [[5, "فتشهد مدينة أشقلون هذا فتفزع، وتتلوى غزة ألما. تتوجع عقرون أيضا لأن رجاءها قد تبدد. يهلك ملك غزة وتصبح أشقلون موحشة."]]}, {"l": "Act 8:26", "n": "", "vs": [[26, "ثم إن ملاكا من عند الرب كلم فيلبس فقال له: «قم اذهب نحو الجنوب، ماشيا على الطريق البرية بين أورشليم وغزة»."]]}], "kwAr": "غزة", "noteAr": ""}, {"kw": "carried", "raw": "etc. or, carried them away with an entire captivity, 2Ch_21:16, 2Ch_21:17, 2Ch_28:18; Joe_3:6", "note": "etc. or, carried them away with an entire captivity, 2Ch_21:16, 2Ch_21:17, 2Ch_28:18; Joe_3:6", "refs": [{"l": "2Ch 21:16", "n": "", "vs": [[16, "وأثار الرب على يهورام عداء الفلسطينيين والعرب المستوطنين إلى جوار الكوشيين."]]}, {"l": "2Ch 21:17", "n": "", "vs": [[17, "فهاجموا يهوذا واستولوا عليها، ونهبوا كل الأموال المدخرة في قصر الملك، وسبوا أبناءه ونساءه. ولم يبق له ابن إلا يهوآحاز أصغر أولاده."]]}, {"l": "2Ch 28:18", "n": "", "vs": [[18, "واقتحم الفلسطينيون مدن السواحل وجنوبي يهوذا واستولوا على بيت شمس وأيلون وجديروت وسوكو وضياعها وتمنة وضياعها وجمزو وضياعها، واستوطنوا فيها،"]]}, {"l": "Joe 3:6", "n": "", "vs": [[6, "وبعتم يهوذا وأبناء أورشليم إلى الأغارقة لتبعدوهم عن تخوم أرضهم."]]}], "kwAr": "نفوا", "noteAr": "إلخ. أو: «سبوهم سبيا كاملا». انظر 2أخ 21: 16، 17؛ 28: 18؛ يوء 3: 6"}, {"kw": "to Edom", "raw": "Amo_1:9, Amo_1:11; Eze_35:5; Oba_1:11", "note": "", "refs": [{"l": "Amo 1:9", "n": "", "vs": [[9, "هذا ما يقوله الرب: من أجل معاصي صور الثلاث والأربع لن أرد عنها سخطي، لأن أهلها سلموا شعبا بكامله إلى أدوم، ونقضوا عهد الإخوة."]]}, {"l": "Amo 1:11", "n": "", "vs": [[11, "وهذا ما يقوله الرب: من أجل معاصي أدوم الثلاث والأربع لن أرد عنهم سخطي، لأنهم تعقبوا إخوتهم بالسيف، وتغاضوا عن كل رحمة، وجعلوا غضبهم يتأجج ملتهما باستمرار، وظلوا حاقدين على الدوام."]]}, {"l": "Eze 35:5", "n": "", "vs": [[5, "لأنك أضمرت في نفسك بغضة أبدية، وأسلمت بني إسرائيل إلى حد السيف في أثناء محنتهم، في ساعة دينونة إثمهم."]]}, {"l": "Oba 1:11", "n": "", "vs": [[11, "ففي ذلك اليوم الذي وقفت فيه بعيدا، يوم غنم الغرباء كنوزه، واقتحم الأجانب أبوابه وألقوا القرعة على أورشليم، كنت أنت أيضا كواحد منهم."]]}], "kwAr": "إلى أدوم", "noteAr": ""}], "arS": [["هذا", ["H3541"]], [" ما ", []], ["يقوله", ["H559"]], [" ", []], ["الرب", ["H3068"]], [": ", []], ["من", ["H5921"]], [" أجل ", []], ["معاصي", ["H6588"]], [" ", []], ["غزة", ["H5804"]], [" ", []], ["الثلاث", ["H7969"]], [" ", []], ["والأربع", ["H702"]], [" لن ", []], ["أرد", ["H7725"]], [" عنها سخطي، ", []], ["لأن", ["H5921"]], [" أهلها ", []], ["نفوا", ["H1540"]], [" ", []], ["شعبا", ["H8003"]], [" عن آخره ", []], ["ليسلموه", ["H5462"]], [" إلى ", []], ["أدوم", ["H123"]], [".", []]]}, {"c": 1, "v": 7, "text": "لذلك سأرسل نارا على أسوار غزة تلتهم حصونها.", "groups": [{"kw": "I will", "raw": "Deu_32:35, Deu_32:41-43; Psa_75:7, Psa_75:8, Psa_94:1-5; Zep_2:4; Rom_12:19", "note": "", "refs": [{"l": "Deu 32:35", "n": "", "vs": [[35, "لي النقمة وأنا أجازي. وفي الوقت المعين تزل أقدامهم فيوم هلاكهم بات وشيكا، ومصيرهم المحتوم يسرع إليهم،"]]}, {"l": "Deu 32:41-43", "n": "", "vs": [[41, "إذا سننت سيفي البارق وأمسكت به يدي للقضاء، فإني أنتقم من أعدائي، وأجازي مبغضي."], [42, "أسكر سهامي بالدم ويلتهم سيفي لحما، من دم القتلى والسبايا ورؤوس قادة العدو."], [43, "تهللي أيتها الأمم مع شعبه، لأنه سينتقم لدماء عبيده ويثأر من أعدائه ويصفح عن أرضه وعن شعبه»."]]}, {"l": "Psa 75:7", "n": "", "vs": [[7, "فالله هو الديان، يرفع واحدا ويخفض آخر."]]}, {"l": "Psa 75:8", "n": "", "vs": [[8, "في يد الرب كأس خمر مزبدة ممزوجة. يصبها فيشربها كل الأشرار حتى ثمالتها."]]}, {"l": "Psa 94:1-5", "n": "", "vs": [[1, "يارب أنت إله الانتقام، فتجل بغضبك."], [2, "قم ياديان الأرض وجاز المتكبرين على أعمالهم."], [3, "إلى متى يارب يشمت الأشرار فرحين؟"], [4, "إلى متى يهذر عمال الإثم ويتواقحون ويتباهون بأنفسهم؟"], [5, "يسحقون شعبك يارب ويضطهدونه،"]]}, {"l": "Zep 2:4", "n": "", "vs": [[4, "فإن غزة تصبح مهجورة، وأشقلون موحشة، وأهل أشدود يطردون عند الظهيرة، وعقرون تستأصل."]]}, {"l": "Rom 12:19", "n": "", "vs": [[19, "لا تنتقموا لأنفسكم، أيها الأحباء، بل دعوا الغضب لله، لأنه قد كتب: «لي الانتقام، أنا أجازي، يقول الرب»."]]}], "kwAr": "سأرسل", "noteAr": ""}, {"kw": "a fire", "raw": "Amo_1:4; 2Ki_18:8; 2Ch_26:6; Jer_25:18-20, Jer_47:1; Zec_9:5-7", "note": "", "refs": [{"l": "Amo 1:4", "n": "", "vs": [[4, "لذلك أرسل نارا على بيت حزائيل فتلتهم حصون بنهدد."]]}, {"l": "2Ki 18:8", "n": "", "vs": [[8, "ودحر الفلسطينيين من برج النواطير إلى المدينة المحصنة حتى بلغ غزة وضواحيها."]]}, {"l": "2Ch 26:6", "n": "", "vs": [[6, "وزحف على الفلسطينيين وحاربهم، وهدم سور جت وسور يبنة وسور أشدود، وبنى مدنا في أشدود وبقية أرض الفلسطينيين."]]}, {"l": "Jer 25:18-20", "n": "", "vs": [[18, "أورشليم ومدن يهوذا وملوكها وعظماءها، لأجعلها قفرا خرابا ومثار صفير ولعنة إلى هذا اليوم."], [19, "وسقيت منها كذلك فرعون ملك مصر وخدامه وعظماءه وكل شعبه،"], [20, "وكل الغرباء المقيمين في وسطهم، وجميع ملوك أرض عوص، وسائر ملوك الفلسطينيين: ملوك أشقلون، وغزة، وعقرون وبقية أشدود،"]]}, {"l": "Jer 47:1", "n": "", "vs": [[1, "هذه هي النبوءة التي أوحى بها الرب إلى إرميا عن الفلسطينيين قبل أن يهاجم فرعون غزة."]]}, {"l": "Zec 9:5-7", "n": "", "vs": [[5, "فتشهد مدينة أشقلون هذا فتفزع، وتتلوى غزة ألما. تتوجع عقرون أيضا لأن رجاءها قد تبدد. يهلك ملك غزة وتصبح أشقلون موحشة."], [6, "ويستوطن الزنيم في أشدود، ويستأصل الرب كبرياء الفلسطينيين."], [7, "لا يعودون يأكلون لحما بدمه أو طعاما نجسا ويصبحون هم أيضا بقية ناجية للرب، يصيرون كعشيرة في سبط يهوذا، وتغدو عقرون نظير اليبوسيين."]]}], "kwAr": "نارا", "noteAr": ""}], "arS": [["لذلك ", []], ["سأرسل", ["H7971"]], [" ", []], ["نارا", ["H784"]], [" على ", []], ["أسوار", ["H2346"]], [" ", []], ["غزة", ["H5804"]], [" ", []], ["تلتهم", ["H398"]], [" ", []], ["حصونها", ["H759"]], [".", []]]}, {"c": 1, "v": 8, "text": "وأستأصل أهل أشدود، وأهلك حامل صولجان ملك أشقلون، وأوجه ضرباتي ضد عقرون فيفنى من بقي من الفلسطينيين.", "groups": [{"kw": "I will cut", "raw": "Isa_20:1; Jer_47:5; Eze_25:16", "note": "", "refs": [{"l": "Isa 20:1", "n": "", "vs": [[1, "وفي السنة التي أوفد فيها سرجون ملك أشور ترتان رئيس جيشه إلى أشدود وحاربها وقهرها،"]]}, {"l": "Jer 47:5", "n": "", "vs": [[5, "قد أصبحت غزة جرداء، وساد أشقلون صمت الموت. يابقية العناقيين، إلى متى تظلون تجرحون أنفسكم حزنا؟"]]}, {"l": "Eze 25:16", "n": "", "vs": [[16, "ها أنا أعاقب الفلسطينيين وأستأصل الكريتيين، وأبيد بقية سكان ساحل البحر،"]]}], "kwAr": "وأستأصل", "noteAr": ""}, {"kw": "turn", "raw": "Psa_81:14; Isa_1:25; Zec_13:7", "note": "", "refs": [{"l": "Psa 81:14", "n": "", "vs": [[14, "لكنت أخضعت أعداءهم سريعا، وحولت يدي نحو خصومهم،"]]}, {"l": "Isa 1:25", "n": "", "vs": [[25, "لأعاقبنك وأنقينك من غشك كما تنقى المعادن بالبورق، وأصفينك من قصديرك،"]]}, {"l": "Zec 13:7", "n": "", "vs": [[7, "ويقول الرب القدير: «استيقظ أيها السيف وهاجم راعي ورجل رفقتي. اضرب الراعي فتتبدد الخراف. ولكني أرد يدي عن الصغار (أي القلة المؤمنة)."]]}], "kwAr": "وأوجه", "noteAr": ""}, {"kw": "and the", "raw": "Isa_14:29-31; Jer_47:4, Jer_47:5; Eze_25:16; Zep_2:4-7", "note": "", "refs": [{"l": "Isa 14:29-31", "n": "", "vs": [[29, "«لا تفرحي ياكل فلسطين، لأن القضيب الذي ضربك قد انكسر. فإن من أصل تلك الأفعى يخرج أفعوان، وذريته تكون ثعبانا ساما طيارا"], [30, "أما أبكار البائسين فيرعون، والمساكين يربضون آمنين. لكنني أهلك أصلك بالمجاعة وأقضي على بقيتك."], [31, "ولول أيها الباب ونوحي أيتها المدينة! ذوبي خوفا يافلسطين قاطبة لأن جيشا مدربا قد زحف نحوك من الشمال"]]}, {"l": "Jer 47:4", "n": "", "vs": [[4, "رعبا من اليوم المقبل لإبادة الفلسطينيين، ولاستئصال صور وصيدون وكل معين باق، لأن الرب يدمر الفلسطينيين بقية جزيرة كفتور."]]}, {"l": "Jer 47:5", "n": "", "vs": [[5, "قد أصبحت غزة جرداء، وساد أشقلون صمت الموت. يابقية العناقيين، إلى متى تظلون تجرحون أنفسكم حزنا؟"]]}, {"l": "Eze 25:16", "n": "", "vs": [[16, "ها أنا أعاقب الفلسطينيين وأستأصل الكريتيين، وأبيد بقية سكان ساحل البحر،"]]}, {"l": "Zep 2:4-7", "n": "", "vs": [[4, "فإن غزة تصبح مهجورة، وأشقلون موحشة، وأهل أشدود يطردون عند الظهيرة، وعقرون تستأصل."], [5, "ويل لكم ياأهل ساحل البحر، أمة الكريتيين. إن قضاء الرب منصب عليكم ياسكان كنعان أرض الفلسطينيين. سأدمرك حتى لا يبقى فيك مقيم."], [6, "وأنت ياأرض ساحل البحر تصبحين مراعي ومروجا للرعاة وحظائر للمواشي."], [7, "ويصبح ساحل البحر ملكا لبقية بيت يهوذا فيرعون فيه قطعانهم، ويرقدون في المساء في بيوت أشقلون، لأن الرب إلههم يفتقدهم ويرد سبيهم."]]}], "kwAr": "فيفنى", "noteAr": ""}], "arS": [["وأستأصل", ["H3772"]], [" ", []], ["أهل", ["H3427"]], [" ", []], ["أشدود", ["H4480", "H795"]], ["، وأهلك ", []], ["حامل", ["H8551"]], [" ", []], ["صولجان", ["H7626"]], [" ملك ", []], ["أشقلون", ["H4480", "H831"]], ["، ", []], ["وأوجه", ["H7725"]], [" ", []], ["ضرباتي", ["H3027"]], [" ضد ", []], ["عقرون", ["H6138"]], [" ", []], ["فيفنى", ["H6"]], [" من ", []], ["بقي", ["H7611"]], [" من ", []], ["الفلسطينيين", ["H6430"]], [".", []]]}, {"c": 1, "v": 9, "text": "هذا ما يقوله الرب: من أجل معاصي صور الثلاث والأربع لن أرد عنها سخطي، لأن أهلها سلموا شعبا بكامله إلى أدوم، ونقضوا عهد الإخوة.", "groups": [{"kw": "Tyrus", "raw": "Isa. 23:1-18; Jer_47:4; Ezek. 26:1-28:26; Joe_3:4-8; Zec_9:2-4", "note": "", "refs": [{"l": "Isa 23:1-18", "n": "", "vs": [[1, "نبوءة بشأن صور: ولولي ياسفن ترشيش، لأن صور قد هدمت، فلم يبق بيت ولا مرفأ. تماما كما بلغكم النبأ وأنتم في أرض قبرص."], [2, "اصمتوا ياأهل الساحل، ياتجار صيدون، عابري البحر الذين ملأتموها،"], [3, "فقد قدمت فوق المياه الكثيرة سفن محملة بقمح شيحور وحصاد النيل، فصارت هي متجرة الأمم."], [4, "فاخجلي ياصيدا لأن البحر وحصنه قد تكلما قائلين: لم أتمخض ولم ألد، لم أنشيء شبابا ولا ربيت عذارى."], [5, "عندما يذيع النبأ في مصر، يتوجعون لأخبار صور."], [6, "اعبروا إلى ترشيش، انتحبوا ياأهل الساحل."], [7, "أهذه هي مدينتكم المبتهجة التي نشأت منذ القدم، والتي تنقلها قدماها للتغرب في أرض بعيدة؟"], [8, "من قضى بهذا على صور واهبة التيجان، التي تجارها أمراء، ومتكسبوها شرفاء الأرض؟"], [9, "إن الرب القدير هو الذي قضى بذلك، ليحط من كبرياء كل مجد، وليذل كل شرفاء الأرض."], [10, "امخري عباب البحر ياابنة ترشيش كما يخترق النيل أرض مصر إذ زال مرفأك من الوجود."], [11, "بسط الرب يده على البحر، وزعزع ممالك، أصدر أمره على كنعان كي تدمر حصونها،"], [12, "وقال: «لن تعودي تعربدين أيتها العذراء التي فقدت شرفها، يا ابنة صيدون هبي واعبري إلى قبرص، ولكنك لن تجدي هناك راحة»."], [13, "تأملي في أرض الكلدانيين وانظري إلى شعبها، فهم وليس الأشوريون الذين سيجعلون صور مرتعا للوحوش، وسينصبون حولها أبراجهم، ويمسحون قصورها عن وجه الأرض، ويحولونها إلى خراب."], [14, "انتحبي يا سفن ترشيش لأن حصونك قد تهدمت."], [15, "وفي ذلك اليوم تظل صور منسية طوال سبعين سنة، كحقبة حياة ملك واحد، وفي نهاية السبعين سنة يصيب صور مثل ما جاء في أغنية العاهرة:"], [16, "«خذي عودا وطوفي في المدينة أيتها العاهرة المنسية. أتقني العزف على العود وأكثري الغناء لعلك تذكرين»."], [17, "وفى نهاية السبعين سنة يفتقد الرب صور، فترجع إلى عهدها، وتزني مع كل ممالك الأرض."], [18, "أما تجارتها وأجرتها فتصبح قدسا للرب. لا تخزن ولا تدخر لأن تجارتها توفر غذاء وفيرا، وثيابا فاخرة للساكنين أمام الرب."]]}, {"l": "Jer 47:4", "n": "", "vs": [[4, "رعبا من اليوم المقبل لإبادة الفلسطينيين، ولاستئصال صور وصيدون وكل معين باق، لأن الرب يدمر الفلسطينيين بقية جزيرة كفتور."]]}, {"l": "Eze 26:1-28:26", "n": "", "vs": [[1, "وفي السنة الحادية عشرة (من سبي الملك يهوياكين)، في اليوم الأول من الشهر، أوحى إلي الرب بكلمته قائلا:"], [2, "«ياابن آدم، لأن صور قد شمتت بأورشليم، وقالت: ها بوابة الشعوب قد انهارت، وتحولت القوافل إلي. ها أنا أزدهر إذ حل بها الدمار."], [3, "لذلك يعلن السيد الرب: ها أنا أعاقبك ياصور، فأجعل أمما كثيرة تهاجمك كما يهجم البحر بأمواجه."], [4, "فيهدمون أسوار صور وأبراجها، وأكشط ترابها عنها، وأحولها إلى صخرة جرداء."], [5, "فتصبح منشرا للشباك في وسط البحر لأني أنا قضيت، يقول السيد الرب، ثم تغدو غنيمة للأمم."], [6, "وتهلك ضواحيها الريفية بالسيف، فيدركون أني أنا الرب."], [7, "لأن هذا ما يعلنه السيد الرب: ها أنا آتي بملك الملوك، نبوخذناصر ملك بابل من الشمال بخيل وبمركبات وبفرسان وأقوام غفيرة،"], [8, "فيبيد بالسيف قرى ريفك ويشيد حولك سور حصار، ويبني عليك أبراجا، ويقيم مترسة، ويهاجمك بترس."], [9, "ويقذف أسوارك بمجانق، ويهدم أبراجك بعدة حربه."], [10, "ولكثرة خيله يحجبك غبار حوافرها، وتتزلزل أسوارك من صوت الفرسان والعربات والمركبات عند اقتحامه أبوابك كما تقتحم مدينة مثغورة،"], [11, "فيدوس بحوافر خيله كل شوارعك، ويقضي بالسيف على شعبك، فتتهاوى إلى الأرض أركان عزك،"], [12, "وينهبون ثروتك، ويستولون على تجارتك ويهدمون أسوارك وبيوتك المبهجة، ويطرحون حجارتك وخشبك وترابك إلى مياه البحر."], [13, "وأخرس أهازيج أغانيك، ولا تتردد بعد رنات أعوادك،"], [14, "وأجعلك كصخرة جرداء، فتكونين منشرا للشباك، ولا تعمرين في ما بعد. لأني أنا الرب قضيت يقول السيد الرب."], [15, "وهذا ما يعلنه السيد الرب عن مدينة صور: ألا ترتعد مدن السواحل لجلبة سقوطك، ولصراخ الجرحى، ولوقوع القتل فيك،"], [16, "فينزل جميع رؤساء المدن الساحلية عن عروشهم ويخلعون جببهم ويطرحون عنهم أرديتهم المزركشة، ويكتسون الرعب ثوبا، ويجلسون على الأرض مرتجفين في كل لحظة، مذعورين لما أصابك"], [17, "عندئذ ينوحون عليك بمرثاة قائلين: كيف تلاشيت من بين البحار أيتها المدينة العامرة الشهيرة، التي كانت مسيطرة هي وسكانها على البحر، فألقوا رعبهم على جميع جيرانها."], [18, "الآن ترتعد مدن السواحل في وقت سقوطك، وتضطرب الجزائر في وسط البحر لانهيارك،"], [19, "إذ أحولك إلى مدينة خربة كالمدن المقفرة. أطغي عليك لجج البحر وأغمرك بالمياه الكثيرة،"], [20, "وأحدرك مع الهابطين إلى الهاوية، إلى الشعب القديم، وأجعلك تقيمين في أسافل الأرض في الخرب الدائرة لتظلي مقفرة، فلا يكون لك مكان في أرض الأحياء،"], [21, "وأجلب الرعب عليك فلا يبقى منك أثر وإذ يبحث عنك لا يعثر عليك أبدا، يقول السيد الرب»."], [1, "وأوحى إلي الرب بكلمته قائلا:"], [2, "«وأما أنت ياابن آدم، فاندب صور بمرثاة،"], [3, "وقل لصور القائمة عند مداخل البحر، تاجرة الشعوب، القاطنة في مدن السواحل: ياصور أنت قلت: أنا كاملة الجمال."], [4, "تخومك في قلب البحار، وبناؤوك أكملوا جمالك،"], [5, "صنعوا كل ألواحك من سرو سنير، وأخذوا أرزا من لبنان ليعملوا لك سواري."], [6, "من بلوط باشان صنعوا مجاذيفك، وطعموا مقاعدك بالعاج المستجلب من سواحل قبرص."], [7, "نصبوا شراعك من كتان مطرز من مصر ليكون لك راية. وكانت مظلتك من قماش أزرق وأرجواني من جزائر أليشة."], [8, "كان أهل صيدون وإرواد ملاحيك، وحكماؤك المهرة ياصور الذين كانوا فيك هم ربابينك،"], [9, "شيوخ جبيل وصناعها المهرة الذين كانوا فيك هم قلافوك الذين يسدون شقوقك. جميع سفن البحر وملاحوها قدموا إليك للمتاجرة معك."], [10, "أقوام من فارس ولود وفوط انخرطوا في جيشك وكانوا من رجال حربك. علقوا على أسوارك أتراسا وخوذا، وخلعوا عليك بهاءك."], [11, "أبناء إرواد مع جيشك قائمون على أسوارك المحيطة بك، وتمنعت أبراجك برجال أبطال، علقوا أتراسهم على أسوارك المحيطة بك، وأكملوا جمالك."], [12, "ترشيش تاجرت معك لكثرة ما فيك من أنواع الغنى، فدفعت فضة وحديدا وقصديرا ورصاصا لقاء بضائعك."], [13, "تاجرت معك اليونان وتوبال وماشك، فقايضوا بضائعك بالرقيق وآنية النحاس،"], [14, "وقايض أهل بيت توجرمة بضائعك بالخيل والفرسان والبغال."], [15, "تاجر معك أهل رودس، ومدن ساحلية كثيرة كانت مراكز أسواقك، فدفعوا لك قرون العاج والآبنوس."], [16, "أدوم تاجرت معك، فقايضوا بضائعك في أسواقك بحجارة البهرمان والأرجوان، والقماش المطرز والبوص والمرجان والياقوت،"], [17, "وتاجرت معك أرض يهوذا وإسرائيل، فقايضوا بضائعك بالحنطة والزيتون وأوائل التين والعسل والزيت والبلسان."], [18, "دمشق تاجرت معك لكثرة بضائعك وفرط غناك، فقايضت بضائعك بخمرة حلبون والصوف الأبيض."], [19, "وقايض أهل دان واليونان بضائعك بخمرة أوزال والحديد المشغول والقرفة الصينية وقصب الذريرة."], [20, "وقايضت رودس بضائعك بأغطية السروج."], [21, "وتاجر معك العرب وكل رؤساء قيدار، فقايضوا بضائعك بالخرفان والكباش والأعتدة."], [22, "وتاجر معك أيضا تجار شبا ورعمة، فقايضوا بضائعك بأفخر أنواع الطيب والحجارة الكريمة والذهب."], [23, "ومن المتاجرين معك أيضا أهل حران وكنة وعدن وشبا، وأشور وكلمد."], [24, "هؤلاء قايضوا بضائعك بنفائس الأردية الأسمانجونية والمطرزة، وبسجاجيد ملونة مبرومة الخيطان ومضفورة بإحكام."], [25, "وكانت سفن ترشيش قوافلك البحرية المحملة بتجارتك، فامتلأت وتعظمت جدا في عرض البحار."], [26, "أبحر بك ملاحوك إلى لجج المياه حيث جعلتك الريح الشرقية حطاما في قلب البحار."], [27, "غرقت ثروتك وأسواقك وبضاعتك وملاحوك وربابينك وقلافوك والمتاجرون بمنتوجاتك في أعماق البحر في يوم سقوطك."], [28, "ترتعش مسارح القطعان من صوت صراخ ربابينك."], [29, "يهجر كل المجذفين والملاحين وربابنة البحر سفنهم ويقفون على البر."], [30, "يرفعون صوتهم بالنواح عليك ويصرخون بمرارة، ويذرون ترابا فوق رؤوسهم، ويتمرغون في الرماد."], [31, "يحلقون شعر رؤوسهم عليك، ويرتدون المسوح، ويندبونك بمرارة نفس ندبا أليما."], [32, "وفي ندبهم يقيمون عليك مناحة، ويرثونك قائلين: أية مدينة عمها الصمت مثل صور في قلب البحار؟"], [33, "عند وصول بضائعك عبر البحار أشبعت أمما كثيرة، وأغنيت ملوك الأرض بكثرة ثروتك وتجارتك."], [34, "ولكن حين أغرقتك العواصف في أعماق المياه، غرق معك ملاحوك وتجارتك."], [35, "فاعترى الذعر عليك كل سكان المدن الساحلية، واقشعر ملوكهم رعبا، واضطربت وجوههم."], [36, "يصفر تجار الشعوب دهشة عليك لما حل بك من مصير رهيب، ولن يبقى بعد منك أثر»."], [1, "وأوحى إلي الرب بكلمته قائلا:"], [2, "«ياابن آدم، قل لملك صور، هذا ما يعلنه السيد الرب: لأنك تكبرت وقلت: «أنا إله، وأتربع في مجلس الآلهة، في قلب البحار»؛ مع أنك إنسان ولست إلها، وإن ظننت أن لديك حكمة الآلهة!"], [3, "ها أنت أحكم من دانيآل ولا يخفى عليك سر."], [4, "قد استحوذت بحكمتك وفهمك على الذهب والفضة وادخرتها في خزائنك،"], [5, "وبمهارتك العظيمة في التجارة ضاعفت ثروتك، فتكبر قلبك لفرط غناك."], [6, "لذلك يقول السيد الرب: لأنك ظننت أن لديك حكمة الآلهة،"], [7, "ها أنا أثير عليك غرباء من أعتى الأمم، فيجردون سيوفهم على بهاء حكمتك، ويدنسون جمالك."], [8, "يطر حونك إلى الهاوية فتموت موت القتلى في أعماق البحار."], [9, "أتظل تقول أنئذ أمام قاتلك: أنا إله؟ أنت إنسان لا إله في قبضة ذابحيك."], [10, "فتلقى حتفك كالغلف بيد الغرباء، لأني أنا قضيت يقول السيد الرب»."], [11, "وأوحى إلي الرب بكلمته قائلا:"], [12, "«ياابن آدم، اندب ملك صور بمرثاة وقل له هذا ما يعلنه السيد الرب: كنت خاتم الكمال، مفعما بالحكمة وكامل الجمال."], [13, "كنت في جنة الله عدن، حجابك كل حجر كريم: عقيق أحمر وياقوت أصفر وعقيق أبيض وزبرجد وجزع ويشب وياقوت أزرق وبهرمان وزمرد وذهب. صاغوا منه بيوت حجارتك الكريمة وترصيعاتك يوم خلقت."], [14, "ومسحتك لتكون الكروبيم المظلل وأقمتك على جبل الله المقدس، وتمشيت بين حجار ة النار."], [15, "كنت كاملا في طرقك منذ يوم خلقت إلى أن وجد فيك إثم."], [16, "إنما بسبب كثرة تجارتك امتلأ داخلك ظلما، فأخطأت. لهذا أطرحك من جبل الله كشيء نجس، وأبيدك أيها الكروب المظلل من بين حجارة النار."], [17, "قد تكبر قلبك بسبب بهائك، وأفسدت حكمتك من جراء جلالك. سألقي بك إلى الأرض أمام الملوك لتكون عرضة لعيونهم الهازئة."], [18, "قد نجست مقادسك بفرط آثامك وتجارتك الظالمة. لذلك أجعل النار تندلع من وسطك فتلتهمك، وأحولك إلى رماد على الأرض أمام كل من يراك."], [19, "فيتحير لما أصابك جميع الذين يعرفونك بين الشعوب، إذ تحل بك الأهوال ولا يبقى منك أثر»."], [20, "وأوحى إلي الرب بكلمته قائلا:"], [21, "«ياابن آدم، التفت بوجهك نحو صيدون وتنبأ عليها."], [22, "وقل هذا ما يعلنه السيد الرب: ها أنا أنقلب عليك ياصيدون وأتجلى بمجدي فيك فيدرك سكانك أني أنا الرب حين أنفذ فيك أحكاما وأتقدس في وسطك."], [23, "أجعل الوبأ يتفشى فيك وتسفك دماء في أزقتك، ويتساقط في وسطك جرحى السيف الذي يحدق بك من كل ناحية، فيدركون أني أنا الرب."], [24, "فلا يتعرض شعب إسرائيل إلى وخزات العليق ولا إلى شوكة مؤذية من الأمم المحيطة بهم ممن تبغضهم، فيدركون أني أنا السيد الرب."], [25, "وهذا ما يعلنه السيد الرب: عندما أجمع شعب إسرائيل من بين الشعوب التي تفرقوا إليها، وتتجلى قداستي فيهم أمام عيون الأمم، عندما يعودون ويستوطنون في أرضهم التي وهبتها لعبدي يعقوب،"], [26, "ويقيمون فيها مطمئنين ويشيدون بيوتا ويغرسون كروما ويسكنون آمنين. وعندما أنفذ أحكاما في جميع أعدائهم المحيطين بهم، عندئذ يدركون أني أنا الرب إلههم»."]]}, {"l": "Joe 3:4-8", "n": "", "vs": [[4, "ماذا لديكم ضدي ياصور وصيدون وسائر أقاليم فلسطين؟ أتجازونني على أمر أتيته؟ أم تسعون لإيذائي؟ إني أنزل العقاب على رؤوسكم بغتة وسريعا."], [5, "لأنكم قد استوليتم على ذهبي وفضتي، ونقلتم نفائسي إلى هياكلكم."], [6, "وبعتم يهوذا وأبناء أورشليم إلى الأغارقة لتبعدوهم عن تخوم أرضهم."], [7, "وها أنا الآن أنهضهم من الموضع حيث بعتموهم، وأرد على رؤوسكم سوء أعمالكم."], [8, "وأبيع أبناءكم وبناتكم بأيدي أبناء يهوذا، فيبيعونهم بدورهم إلى السبئيين، إلى أمة بعيدة، لأن الرب قد أصدر قضاءه."]]}, {"l": "Zec 9:2-4", "n": "", "vs": [[2, "وكذلك قضاء الرب على حماة المتاخمة لدمشق، وعلى صور وصيدون المتصفتين بالحكمة:"], [3, "«قد بنت صور حصنا لنفسها وادخرت الفضة كالتراب والذهب كطين الشوارع."], [4, "ولكن ها الرب يجردها من ممتلكاتها، ويطرح عزتها إلى البحر، وتلتهمها النيران."]]}], "kwAr": "صور", "noteAr": ""}, {"kw": "because", "raw": "Amo_1:6, Amo_1:11", "note": "", "refs": [{"l": "Amo 1:6", "n": "", "vs": [[6, "هذا ما يقوله الرب: من أجل معاصي غزة الثلاث والأربع لن أرد عنها سخطي، لأن أهلها نفوا شعبا عن آخره ليسلموه إلى أدوم."]]}, {"l": "Amo 1:11", "n": "", "vs": [[11, "وهذا ما يقوله الرب: من أجل معاصي أدوم الثلاث والأربع لن أرد عنهم سخطي، لأنهم تعقبوا إخوتهم بالسيف، وتغاضوا عن كل رحمة، وجعلوا غضبهم يتأجج ملتهما باستمرار، وظلوا حاقدين على الدوام."]]}], "kwAr": "لأن أهلها", "noteAr": ""}, {"kw": "brotherly covenant", "raw": "Heb. covenant of brethren, 2Sa_5:11; 1Ki_5:1-11, 1Ki_9:11-14; 2Ch_2:8-16", "note": "Heb. covenant of brethren, 2Sa_5:11; 1Ki_5:1-11, 1Ki_9:11-14; 2Ch_2:8-16", "refs": [{"l": "2Sa 5:11", "n": "", "vs": [[11, "وأرسل حيرام ملك صور وفدا إلى داود محملا بخشب أرز ونجارين وبنائين، فشيدوا لداود قصرا."]]}, {"l": "1Ki 5:1-11", "n": "", "vs": [[1, "وأرسل حيرام ملك صور وفدا إلى سليمان بعد أن سمع أنه اعتلى العرش خلفا لأبيه، وكان حيرام صديقا محبا لداود."], [2, "فكتب سليمان رسالة إلى حيرام قائلا:"], [3, "«أنت تعلم أن أبي داود لم يستطع أن يبني بيتا لاسم الرب إلهه من جراء الحروب التي خاضها، حتى أظفره الرب بأعدائه وأخضعهم له."], [4, "أما الآن وقد أراحني الرب من كل جانب، فليس من ثائر أو حادثة شر."], [5, "وها أنا قد نويت أن أبني بيتا لاسم الرب إلهي، كما قال الرب لداود أبي: إن ابنك الذي يخلفك على عرشك هو يبني بيتا لاسمي العظيم."], [6, "فأرجو أن تأمر رجالك أن يقطعوا لي أرزا من لبنان، وسيعمل رجالي جنبا إلى جنب مع رجالك، وأقوم أنا بدفع أجرة رجالك بموجب ما تراه، لأنك تعلم أنه ليس بين قومي من يمهر في قطع الأخشاب مثل الصيدونيين»."], [7, "فلما سمع حيرام كلام سليمان، غمرته البهجة وقال: «مبارك اليوم الرب الذي رزق داود ابنا حكيما ليملك على هذا الشعب الغفير»."], [8, "وبعث حيرام إلى سليمان برسالة قائلا: «قد اطلعت على رسالتك وسأعمل على تلبية رغبتك بشأن خشب الأرز وخشب السرو."], [9, "سيقوم رجالي بنقل الخشب من جبل لبنان إلى البحر، ويربطون قطع الخشب إلى بعضها في حزم ضخمة، يعومها رجالي ويوجهونها إلى الموضع الذي تعينه، فيسلمونها لرجالك، وعليك لقاء ذلك، أن تمون قصري الملكي بما يحتاج إليه من طعام»."], [10, "فكان حيرام يوفر لسليمان ما يطلبه من خشب الأرز وخشب سرو،"], [11, "ويقدم سليمان لحيرام كل سنة لقاء ذلك، عشرين ألف كر حنطة (نحو أربعة آلاف وثماني مئة طن) طعاما لقصره، وعشرين ألف كر زيت نقي (نحو أربعة آلاف وثماني مئة لتر)."]]}, {"l": "1Ki 9:11-14", "n": "", "vs": [[11, "أعطى سليمان حيرام ملك صور عشرين مدينة في أرض الجليل، لأنه أمد سليمان بخشب أرز وخشب سرو وذهب على قدر طلبه."], [12, "فجاء حيرام من صور ليتفقد المدن التي أعطاها سليمان له، فلم ترق له،"], [13, "فتساءل: «ما هذه المدن التي أعطيتني إياها ياأخي؟» ودعاها «أرض كابول» (ومعناها الأرض غير المثمرة) إلى هذا اليوم."], [14, "وكان الذهب الذي أرسله حيرام إلى الملك سليمان مئة وعشرين وزنة ذهب (نحو أربعة آلاف وثلاث مئة وعشرين كيلوجراما)."]]}, {"l": "2Ch 2:8-16", "n": "", "vs": [[8, "وزودني بخشب أرز وسرو وصندل من لبنان، لأنني أعرف أن رجالك ماهرون في قطع خشب لبنان، فيتعاون رجالي مع رجالك."], [9, "وليجهزوا لي خشبا وفيرا، لأن الهيكل الذي عزمت على بنائه هو هيكل عظيم ومدهش،"], [10, "وأنا أدفع أجرة قاطعي الخشب: عشرين ألف كر من الحنطة، وعشرين ألف كيس من الشعير، وعشرين ألف بث خمر، وعشرين ألف برميل زيت»."], [11, "فأجابه حورام ملك صور في رسالة قائلا: «لأن الرب أحب حقا شعبه ولاك عليهم ملكا."], [12, "فتبارك الرب إله إسرائيل صانع السماوات والأرض الذي رزق داود الملك ابنا حكيما متميزا بالمعرفة والفهم ليبني هيكلا للرب وقصرا لنفسه."], [13, "وها أنا أرسل الآن رجلا حاذقا خبيرا هو حورام أبي،"], [14, "ابن امرأة من سبط دان، متزوجة من رجل صوري، بارع في صناعة الذهب والفضة والنحاس والحديد والحجارة والخشب والقماش الأزرق والبنفسجي والكتان والأحمر وسائر فنون النقش، وتنفيذ ما يعهد به إليه من رسومات، فيعمل حورام هذا جنبا إلى جنب مع صناعك وصناع سيدي داود أبيك."], [15, "أما الحنطة والشعير والزيت والخمر التي ذكرها سيدي، فليبعث بها مع رجاله."], [16, "ونحن نقوم بقطع الخشب من لبنان، على مقدار حاجتك، وننقله إليك أرماثا عائمة على البحر إلى ميناء يافا. ومن هناك يتم حمله إلى أورشليم»."]]}], "kwAr": "عهد الإخوة", "noteAr": "بالعبرية: «عهد الإخوة». انظر 2صم 5: 11؛ 1مل 5: 1-11؛ 9: 11-14؛ 2أخ 2: 8-16"}], "arS": [["هذا", ["H3541"]], [" ما ", []], ["يقوله", ["H559"]], [" ", []], ["الرب", ["H3068"]], [": ", []], ["من", ["H5921"]], [" أجل ", []], ["معاصي", ["H6588"]], [" ", []], ["صور", ["H6865"]], [" ", []], ["الثلاث", ["H7969"]], [" ", []], ["والأربع", ["H702"]], [" لن ", []], ["أرد", ["H7725"]], [" عنها سخطي، ", []], ["لأن", ["H5921"]], [" أهلها ", []], ["سلموا", ["H5462"]], [" ", []], ["شعبا", ["H8003"]], [" بكامله إلى ", []], ["أدوم", ["H123"]], ["، ", []], ["ونقضوا", ["H2142"]], [" ", []], ["عهد", ["H1285"]], [" ", []], ["الإخوة", ["H251"]], [".", []]]}, {"c": 1, "v": 10, "text": "لهذا أرسل نارا على أسوار صور فتلتهم حصونها.", "groups": [{"kw": "", "raw": "Amo_1:4, 7-2:16; Eze_26:12; Zec_9:4", "note": "", "refs": [{"l": "Amo 1:4", "n": "", "vs": [[4, "لذلك أرسل نارا على بيت حزائيل فتلتهم حصون بنهدد."]]}, {"l": "Amo 2:16", "n": "", "vs": [[16, "والثابت الجنان بين أقرانه الأبطال يفر عريانا في ذلك اليوم، يقول الرب."]]}, {"l": "Eze 26:12", "n": "", "vs": [[12, "وينهبون ثروتك، ويستولون على تجارتك ويهدمون أسوارك وبيوتك المبهجة، ويطرحون حجارتك وخشبك وترابك إلى مياه البحر."]]}, {"l": "Zec 9:4", "n": "", "vs": [[4, "ولكن ها الرب يجردها من ممتلكاتها، ويطرح عزتها إلى البحر، وتلتهمها النيران."]]}], "kwAr": "", "noteAr": ""}], "arS": [["لهذا ", []], ["أرسل", ["H7971"]], [" ", []], ["نارا", ["H784"]], [" على ", []], ["أسوار", ["H2346"]], [" ", []], ["صور", ["H6865"]], [" ", []], ["فتلتهم", ["H398"]], [" ", []], ["حصونها", ["H759"]], [".", []]]}, {"c": 1, "v": 11, "text": "وهذا ما يقوله الرب: من أجل معاصي أدوم الثلاث والأربع لن أرد عنهم سخطي، لأنهم تعقبوا إخوتهم بالسيف، وتغاضوا عن كل رحمة، وجعلوا غضبهم يتأجج ملتهما باستمرار، وظلوا حاقدين على الدوام.", "groups": [{"kw": "Edom", "raw": "Isa_21:11, Isa_21:12, 34:1-17, Isa_63:1-7; Jer. 49:7-22; Eze_25:12-14, Eze_35:1-15; Oba_1:1-14; Mal_1:4", "note": "", "refs": [{"l": "Isa 21:11", "n": "", "vs": [[11, "نبوءة بشأن أدوم: هتف صارخ من سعير: «يا رقيب، ماذا بقي من الليل؟ أما آن له أن ينتهي؟»"]]}, {"l": "Isa 21:12", "n": "", "vs": [[12, "فأجاب الرقيب: «أشرق الصبح ولكن الليل أقبل معه، فإن رغبتم في السؤال فاسألوا، ثم تعالوا وارجعوا إلى الله»."]]}, {"l": "Isa 34:1-17", "n": "", "vs": [[1, "اقتربوا أيها الأمم للاستماع، اصغوا أيها الشعوب. لتسمع الأرض وملؤها، المسكونة وكل ما يخرج منها،"], [2, "لأن الرب ساخط على كل الشعوب، وغضبه منصب على جميع أجنادهم. قضى عليهم بالفناء، وأسلمهم إلى الذبح،"], [3, "فتطرح قتلاهم وينتشر نتن جيفهم في الفضاء، وتفيض الجبال بدمائهم،"], [4, "وتنحل كل كواكب السماء، وتطوى السماوات كدرج، وتتساقط كل نجومها كتساقط أوراق الكرمة أو حبات التين المتغضنة."], [5, "لأن سيفي قد تشرب بالسخط في السماء، وها هو ينزل ليعاقب أدوم، وينتقم من الشعب الذي قضيت عليه بالفناء."], [6, "للرب سيف مشبع بالدم، مطلي بالشحم، بدم حملان وتيوس، وبشحم كلى كباش، لأن للرب ذبيحة في بصرة، ومذبحة في أدوم."], [7, "ويسقط معهم البقر الوحشي، والعجول والثيران القوية، فتتشبع أرضهم بالدماء، ويخصب ترابهم بالشحم،"], [8, "لأن للرب يوم انتقام، سنة ثأر لدعوى صهيون،"], [9, "فتنقلب أنهار أدوم إلى زفت، وترابهم إلى كبريت، وتصبح أرضها قارا مشتعلا."], [10, "فلا تنطفيء ليلا ونهارا، ويحلق دخانها إلى الفضاء مدى الدهر، وتظل خرابا جيلا بعد جيل، فلا يعبر بها أحد إلى الأبد،"], [11, "ولا يرثها سوى الصقور والقنافذ، ويسكن فيها البوم والغراب، ويمد الرب عليها خيط الدمار ومطمار الهلاك،"], [12, "ولا يجد فيها أشرافها أثرا للملك، وينقرض جميع رؤسائها."], [13, "ينمو الشوك في قصورها، ويزحف العوسج على حصونها، فتصبح مأوى لبنات آوى، ومسكنا للنعام."], [14, "وتجتمع فيها الوحوش البرية مع الذئاب، ووعل البر يدعو صاحبه، وهناك تستقر وحوش الليل وتجد لنفسها ملاذ راحة."], [15, "هناك تعيش البوم وتبيض وتفرخ وترعى صغارها تحت أجنحتها، وهناك أيضا تتلاقى الصقور بعضها ببعض."], [16, "ابحثوا في سفر الرب واقرأوا: فكلمة واحدة لا يمكن أن تسقط، إذ كل أليف سيجتمع بأليفه، لأن فم الرب قد أمر، وروحه يجمعها معا."], [17, "فهو قد ألقى عليها القرعة، ويده قد وزعتها بقسطاس، فترثها إلى الأبد وتقيم فيها جيلا بعد جيل."]]}, {"l": "Isa 63:1-7", "n": "", "vs": [[1, "من هذا المقبل من أدوم، بثياب حمراء من بصرة؛ هذا المتسربل بالبهاء. السائر بخيلاء قوته؟ إنه أنا الرب الناطق بالبر، العظيم للخلاص."], [2, "ما بال ردائك أحمر وثيابك كمن داس عنب المعصرة؟"], [3, "لقد دست المعصرة وحدي، ولم يكن معي أحد من الشعوب. قد دستهم في سخطي ووطئتهم في غيظي، فتناثر دمهم على ردائي ولطخت ثيابي."], [4, "لأن يوم الانتقام كان كامنا في قلبي، وسنة مفديي قد أتت."], [5, "تلفت فلم أعثر على معين، وعجبت إذ لم يكن من ناصر، فانتصرت بقوة ذراعي، وتأيدت بنجدة سخطي،"], [6, "فدست الشعوب في غيظي، وأسكرتهم في غضبي، وسكبت دماءهم فوق الأرض."], [7, "ألهج برأفات الرب وتسابيحه وإحساناته التي أغدقها على بيت إسرائيل بفضل خيره ورحمته."]]}, {"l": "Jer 49:7-22", "n": "", "vs": [[7, "نبوءة عن الأدوميين: «هذا ما يعلنه الرب القدير: ألم تبق في تيمان حكمة بعد؟ هل بادت المشورة من ذوي الفهم؟ هل تلاشت حكمتهم؟"], [8, "اهربوا: أدبروا، اختبئوا في الأعماق ياسكان ددان، لأني سأوقع البلية بذرية عيسو في أوان عقابها."], [9, "لو أقبل قاطفو العنب إليك، ألا يبقون خصاصة؟ ولو انسل اللصوص ليلا، ألا يقنعون بسلب ما يكفيهم؟"], [10, "أما أنا فقد جردت ذرية عيسو، وكشفت عن مخابئها السرية، وليس في وسعها الاختفاء. هلك أبناء عيسو وإخوته وجيرانه ولم يبق له أثر بعد."], [11, "اترك أيتامك فإني أحييهم، ولتتكل أراملك علي."], [12, "لأن هذا ما يعلنه الرب: إن كان الذين لا يستحقون تجرع كأس العقاب قد تجرعوه، أتفلت أنت من العقاب؟ إنك لن تفلت من العقاب، بل عليك أن تجرعه حتما."], [13, "ها أنا قد أقسمت بنفسي، يقول الرب، أن تصبح بصرة عرضة للرعب والعار والخراب واللعنة، وتغدو مدنها خرائب دائمة."], [14, "تبلغت رسالة من لدن الرب، أن سفيرا قد بعث إلى الأمم قائلا: «احشدوا أنفسكم لمهاجمتها. هبوا للقتال."], [15, "قد جعلتك صغيرا في الأمم، حقيرا بين الناس."], [16, "قد خدعك ما تثيره من رعب، وأغوتك كبرياء قلبك، يامن تقيم في شقوق الصخر وتعتصم بقمة التل. ولكنني سأطرحك من هناك ولو بنيت عشك عاليا كعش النسر، يقول الرب."], [17, "ستصبح أدوم مثار رعب، وكل من يمر بها تعتريه رعدة، ويصفر من جراء كل نكباتها،"], [18, "ويصيبها ما أصاب سدوم وعمورة وما جاورهما، من انقلاب، يقول الرب، فلا يسكن هناك إنسان ولا يتغرب فيها أحد."], [19, "ها هو ينقض على الأدوميين في مواطن صخورهم كما ينقض فجأة أسد من أجمات نهر الأردن؛ وفي لحظة أطردهم منها وأقيم عليها من أختاره، لأنه من هو مثلي؟ ومن يحاكمني؟ وأي راع يقوى على مواجهتي؟"], [20, "لذلك اسمعوا ما خططه الرب ضد أدوم، وما دبره ضد ساكني تيمان: ها صغار القوم يجرون، وتنهدم مساكنهم عليهم."], [21, "من صوت سقوطهم ترجف الأرض، وأصداء صراخهم تبلغ البحر الأحمر."], [22, "ها هو يحلق كالنسر، وينشر جناحيه على بصرة، فتصبح قلوب جبابرة أدوم كقلب امرأة ماخض»."]]}, {"l": "Eze 25:12-14", "n": "", "vs": [[12, "وهذا أيضا ما يعلنه السيد الرب: لأن الأدوميين أقدموا على الانتقام من شعب يهوذا، وأساءوا إليه أشد إساءة."], [13, "ها أنا أعاقب الأدوميين وأستأصل من أرضهم الإنسان والحيوان، وأحولها إلى أطلال دارسة من التيمن إلى ددان، إذ يقتل أهلها جميعا بالسيف."], [14, "وأعهد بنقمتي إلى شعبي إسرائيل، فيفعلون بالأدوميين بمقتضى غضبي وسخطي، فيدركون شدة نقمتي، يقول السيد الرب."]]}, {"l": "Eze 35:1-15", "n": "", "vs": [[1, "وأوحى إلي الرب بكلمته قائلا:"], [2, "«ياابن آدم، التفت بوجهك نحو جبل سعير وتنبأ عليه."], [3, "وقل لأهله: ها أنا أنقلب عليك ياجبل سعير وأعاقبك لأجعلك خرابا مقفرا."], [4, "أجعل مدنك أطلالا وتكون أنت مقفرا، فتدرك أني أنا الرب."], [5, "لأنك أضمرت في نفسك بغضة أبدية، وأسلمت بني إسرائيل إلى حد السيف في أثناء محنتهم، في ساعة دينونة إثمهم."], [6, "لذلك حي أنا يقول السيد الرب، إني أعدك لسفك الدم، والدم يتعقبك. لأنك لم تمقت سفك الدم فالدم يتعقبك."], [7, "فأحول جبل سعير إلى أطلال وأستأصل منه كل ذاهب وآيب."], [8, "وأجعل جباله تكتظ بقتلاه، فيتساقطون في تلالك وأوديتك وجميع أنهارك صرعى السيف."], [9, "وأحيلك إلى خرائب أبدية، فلا يبقى لمدنك أثر، فتدركون أني أنا الرب."], [10, "لأنك قلت: إن هاتين الأمتين، وهاتين الأرضين تصبحان لي فأمتلكهما، ولو كان الرب هناك."], [11, "لذلك حي أنا يقول السيد الرب: لأعاملنك بمقتضى غضبك وحسدك اللذين أبديتهما في بغضائك لهم، فأعلن ذاتي عندما أدينك."], [12, "فتدرك أني أنا الرب قد سمعت كل إهانتك التي عيرت بها جبال إسرائيل قائلا: قد أصبحت خرابا وصارت لنا مغنما."], [13, "قد تباهيتم علي بأفواهكم، وأكثرتم من لغوكم علي وأنا سمعت."], [14, "ففي موسم الربيع أجعلك مقفرا"], [15, "وكما فرحت لخراب ميراث شعب إسرائيل، كذلك أفعل بك، فتصير ياجبل سعير خرابا أنت وكل بلاد أدوم فتدركون أني أنا الرب»."]]}, {"l": "Oba 1:1-14", "n": "", "vs": [[1, "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."], [2, "ها أنا أجعلك صغيرا بين الأمم وأشدها احتقارا."], [3, "قد غرتك كبرياء قلبك أيها المقيم في شقوق الصخور، ومساكنه في القمم، القائل في قلبه: من يهوي بي إلى الأرض؟"], [4, "ولكن إن كنت تحلق كالنسر ومنازلك مبنية بين الكواكب، فإني سأهوي بك إلى الحضيض يقول الرب."], [5, "إن اقتحم اللصوص بيتك، وهاجمك الناهبون ليلا، ألا يسرقون ما يحتاجون إليه فقط؟ وإن أقبل إليك قاطفو العنب، ألا يبقون خصاصة؟ ولكن يالدمارك!"], [6, "إذ كيف تم تفتيش عيسو ونقبت مخابيء كنوزه؟"], [7, "جميع حلفائك طردوك إلى التخوم. خدعك مسالموك وأوقعوا بك الهزيمة، والذين أكلوا من خبزك كادوا لك وأنت لم تفهم."], [8, "ألا أستأصل في ذلك اليوم حكماء أدوم، يقول الرب، وأزيل الفهم من جبل عيسو؟"], [9, "فيرتعب أبطالك ياتيمان حتى ينقرض قتلا كل رجل من جبل عيسو."], [10, "فمن أجل ما أنزلت بأخيك يعقوب من ظلم، يغشاك العار وتنقرض إلى الأبد."], [11, "ففي ذلك اليوم الذي وقفت فيه بعيدا، يوم غنم الغرباء كنوزه، واقتحم الأجانب أبوابه وألقوا القرعة على أورشليم، كنت أنت أيضا كواحد منهم."], [12, "ما كان يجب أن تشمت بيوم مصير أخيك، في يوم فاجعته، وما كان يجب أن تبتهج في يوم دمار شعب يهوذا أو تتباهى في يوم الضيق."], [13, "وما كان يجب أن تقتحم أبواب شعبي في يوم كارثته، أو تشمت لمصيبته في يوم نكبته، أو تنهب ثروته في يوم بليته،"], [14, "أو تقف عند مفترق الطرق لتقضي على الناجين من قومه وتسلم الباقين الأحياء منهم في يوم الضيق."]]}, {"l": "Mal 1:4", "n": "", "vs": [[4, "وإن قال الأدوميون: مع إننا تحطمنا فإننا نبني الخرب، فإن الرب القدير يقول: هم يعمرون وأنا أهدم، ويدعو الناس بلادهم، «أرض النفاق»، وأهلها بالأمة التي سخط الرب عليها إلى الأبد."]]}], "kwAr": "أدوم", "noteAr": ""}, {"kw": "because", "raw": "Gen_27:40,Gen_27:41; Num_20:14-21; Deu_2:4-8, Deu_23:7; 2Ch_28:17; Psa_83:3-8; Psa_137:7; Lam_4:21, Lam_4:22; Eze_25:12, Eze_35:5, Eze_35:6, Eze_35:11; Joe_3:19; Oba_1:10-14; Mal_1:2", "note": "", "refs": [{"l": "Gen 27:40", "n": "", "vs": [[40, "بسيفك تعيش ولأخيك تكون عبدا، ولكن حين تجمح تحطم نيره عن عنقك»."]]}, {"l": "Gen 27:41", "n": "", "vs": [[41, "وحقد عيسو على يعقوب من أجل ما ناله من بركة أبيه. فناجى نفسه: «قريبا يموت أبي، وبعدئذ أقتل أخي يعقوب»."]]}, {"l": "Num 20:14-21", "n": "", "vs": [[14, "وبعث موسى رسلا من قادش إلى ملك أدوم يقولون له: «هذا ما يقوله لك أخوك إسرائيل: قد بلغك ما أصابنا من مشقة،"], [15, "فقد انحدر آباؤنا إلى مصر فمكثنا فيها أياما كثيرة، فسامنا المصريون، نحن وآباءنا سوء العذاب،"], [16, "فتضرعنا إلى الرب فاستجاب لصوتنا، وأرسل ملاكا أخرجنا من مصر. وها نحن نازلون في مدينة قادش في طرف تخومك."], [17, "فأذن لنا أن نمر في أرضك من غير أن ندوس في حقل أو كرم أو نشرب ماء بئر، بل نسير في الطريق العامة المخصصة للسفر. لا نميل يمينا أو شمالا حتى نتجاوز حدودك»."], [18, "فقال لهم ملك أدوم: «إياكم المرور بأرضي لئلا أجابهكم بالسيف»."], [19, "فأجابه بنو إسرائيل: «لن نسير إلا على طريق السفر، وإن استقينا نحن ومواشينا من مائك ندفع ثمنه. إننا لا نطلب أكثر من المرور راجلين»."], [20, "فقال: «لا تمروا». وعبأ ملك أدوم جيشا قويا وخرج للقاء إسرائيل."], [21, "وأبى ملك أدوم أن يأذن للإسرائيليين باجتياز أراضيه. فتحولوا عنه."]]}, {"l": "Deu 2:4-8", "n": "", "vs": [[4, "وأوص الشعب: ها أنتم عابرون بتخوم إخوتكم بني عيسو المستوطنين في سعير فيعتريهم الخوف منكم"], [5, "فاحذروا جدا أن تهاجموهم، لأنني لا أورثكم من أرضهم ولا وطأة قدم، لأني قد أعطيت جبل سعير ميراثا لعيسو."], [6, "تدفعون ثمن ما تشترونه من طعام لتأكلوا، وما تبتاعونه من ماء لتشربوا."], [7, "لأن الرب إلهكم بارك كل عمل أيديكم، واعتنى بكم في أثناء رحلتكم في هذه الصحراء الشاسعة، وكان معكم طوال أربعين سنة، فلم يعوزكم شيء"], [8, "فاجتزنا بإخوتنا بني عيسو المقيمين في سعير، متجهين في طريق وادي العربة جنوبا صوب إيلات وعصيون جابر، ثم انثنينا ومررنا في طريق صحراء موآب."]]}, {"l": "Deu 23:7", "n": "", "vs": [[7, "لا تمقتوا الأدوميين لأنهم إخوتكم، ولا تكرهوا المصريين لأنكم كنتم ضيوفا في ديارهم"]]}, {"l": "2Ch 28:17", "n": "", "vs": [[17, "لأن الأدوميين زحفوا على يهوذا وهاجموهم وأخذوا منهم أسرى."]]}, {"l": "Psa 83:3-8", "n": "", "vs": [[3, "يتآمرون بالمكر على شعبك، ويكيدون للإيقاع بمن تحميهم."], [4, "يقولون: «هلم نستأصلهم من بين الأمم، فلا يذكر اسم إسرائيل فيما بعد»."], [5, "فإنهم قد تآمروا معا بقلب واحد، وعقدوا حلفا ضدك."], [6, "عشائر أدوم وبنو إسماعيل، نسل موآب وبنو هاجر."], [7, "جبال وعمون وعماليق، الفلسطينيون وأهل صور،"], [8, "وقوم أشور أيضا انضموا إليهم، صاروا عونا لبني لوط."]]}, {"l": "Psa 137:7", "n": "", "vs": [[7, "اذكر يارب لبني أدوم ما فعلوه يوم خراب أورشليم، إذ قالوا: «اهدموا اهدموا حتى يتعرى أساسها»."]]}, {"l": "Lam 4:21", "n": "", "vs": [[21, "ابتهجي وافرحي ياابنة أدوم، ياساكنة عوص. إنما هذه الكأس ستجوز عليك أيضا فتسكرين وتتعرين."]]}, {"l": "Lam 4:22", "n": "", "vs": [[22, "قد تم إثمك ياابنة صهيون، ولن يطيل (الله ) من حقبة سبيك. أما أنت ياابنة أدوم فإنه يعاقبك ويفضح خطاياك."]]}, {"l": "Eze 25:12", "n": "", "vs": [[12, "وهذا أيضا ما يعلنه السيد الرب: لأن الأدوميين أقدموا على الانتقام من شعب يهوذا، وأساءوا إليه أشد إساءة."]]}, {"l": "Eze 35:5", "n": "", "vs": [[5, "لأنك أضمرت في نفسك بغضة أبدية، وأسلمت بني إسرائيل إلى حد السيف في أثناء محنتهم، في ساعة دينونة إثمهم."]]}, {"l": "Eze 35:6", "n": "", "vs": [[6, "لذلك حي أنا يقول السيد الرب، إني أعدك لسفك الدم، والدم يتعقبك. لأنك لم تمقت سفك الدم فالدم يتعقبك."]]}, {"l": "Eze 35:11", "n": "", "vs": [[11, "لذلك حي أنا يقول السيد الرب: لأعاملنك بمقتضى غضبك وحسدك اللذين أبديتهما في بغضائك لهم، فأعلن ذاتي عندما أدينك."]]}, {"l": "Joe 3:19", "n": "", "vs": [[19, "وتصبح مصر خرابا، وأدوم قفرا موحشا لفرط ما أنزلوه من ظلم بأبناء يهوذا، ولأنهم سفكوا دما بريئا في ديارهم."]]}, {"l": "Oba 1:10-14", "n": "", "vs": [[10, "فمن أجل ما أنزلت بأخيك يعقوب من ظلم، يغشاك العار وتنقرض إلى الأبد."], [11, "ففي ذلك اليوم الذي وقفت فيه بعيدا، يوم غنم الغرباء كنوزه، واقتحم الأجانب أبوابه وألقوا القرعة على أورشليم، كنت أنت أيضا كواحد منهم."], [12, "ما كان يجب أن تشمت بيوم مصير أخيك، في يوم فاجعته، وما كان يجب أن تبتهج في يوم دمار شعب يهوذا أو تتباهى في يوم الضيق."], [13, "وما كان يجب أن تقتحم أبواب شعبي في يوم كارثته، أو تشمت لمصيبته في يوم نكبته، أو تنهب ثروته في يوم بليته،"], [14, "أو تقف عند مفترق الطرق لتقضي على الناجين من قومه وتسلم الباقين الأحياء منهم في يوم الضيق."]]}, {"l": "Mal 1:2", "n": "", "vs": [[2, "«يقول الرب: إنني أحببتكم، ولكنكم تسألون: كيف أحببتنا؟ ويجيب الرب: أليس عيسو أخا ليعقوب؟ ومع ذلك أحببت يعقوب،"]]}], "kwAr": "لأنهم", "noteAr": ""}, {"kw": "did cast off all pity", "raw": "Heb. corrupted his compassions", "note": "Heb. corrupted his compassions", "refs": [], "kwAr": "وتغاضوا عن كل رحمة", "noteAr": "بالعبرية: «أفسد مراحمه»."}, {"kw": "kept", "raw": "Psa_85:5; Ecc_7:9; Isa_57:16; Mic_7:18; Eph_4:26, Eph_4:27, Eph_5:1", "note": "", "refs": [{"l": "Psa 85:5", "n": "", "vs": [[5, "أتسخط علينا إلى الأبد؟ أتطيل غضبك من جيل إلى جيل؟"]]}, {"l": "Ecc 7:9", "n": "", "vs": [[9, "لا يستسلم قلبك سريعا للغضب، لأن الغضب يستقر في صدور الجهال."]]}, {"l": "Isa 57:16", "n": "", "vs": [[16, "لأنني لا أخاصم إلى الأبد، ولا أظل على الدوام غاضبا، لئلا تبيد أمامي روح الإنسان التي خلقتها."]]}, {"l": "Mic 7:18", "n": "", "vs": [[18, "إي إله مثلك يصفح عن الإثم ويعفو عن معصية بقية ميراثه؟ لا يحتفظ إلى الأبد بغضبه لأنه يسر بالرحمة."]]}, {"l": "Eph 4:26", "n": "", "vs": [[26, "إن غضبتم، فلا تخطئوا؛ لا تدعوا الشمس تغيب وأنتم غاضبون،"]]}, {"l": "Eph 4:27", "n": "", "vs": [[27, "ولا تتيحوا فرصة لإبليس!"]]}, {"l": "Eph 5:1", "n": "", "vs": [[1, "فاقتدوا إذن بالله كأولاد أحباء،"]]}], "kwAr": "وظلوا", "noteAr": ""}], "arS": [["وهذا", ["H3541"]], [" ما ", []], ["يقوله", ["H559"]], [" ", []], ["الرب", ["H3068"]], [": ", []], ["من", ["H5921"]], [" أجل ", []], ["معاصي", ["H6588"]], [" ", []], ["أدوم", ["H123"]], [" ", []], ["الثلاث", ["H7969"]], [" ", []], ["والأربع", ["H702"]], [" لن ", []], ["أرد", ["H7725"]], [" عنهم سخطي، ", []], ["لأنهم", ["H5921"]], [" ", []], ["تعقبوا", ["H7291"]], [" ", []], ["إخوتهم", ["H251"]], [" ", []], ["بالسيف", ["H2719"]], ["، ", []], ["وتغاضوا", ["H7843"]], [" عن كل ", []], ["رحمة", ["H7356"]], ["، وجعلوا ", []], ["غضبهم", ["H639"]], [" ", []], ["يتأجج", ["H2963"]], [" ملتهما ", []], ["باستمرار", ["H5703"]], ["، ", []], ["وظلوا", ["H8104"]], [" ", []], ["حاقدين", ["H5678"]], [" على ", []], ["الدوام", ["H5331"]], [".", []]]}, {"c": 1, "v": 12, "text": "فأرسل نارا على تيمان، فتلتهم حصون بصرة.", "groups": [{"kw": "Teman", "raw": "Gen_36:11; Jer_49:7, Jer_49:20; Oba_1:9, Oba_1:10", "note": "", "refs": [{"l": "Gen 36:11", "n": "", "vs": [[11, "أما أبناء أليفاز فهم: تيمان وأومار وصفو وجعثام وقناز."]]}, {"l": "Jer 49:7", "n": "", "vs": [[7, "نبوءة عن الأدوميين: «هذا ما يعلنه الرب القدير:
