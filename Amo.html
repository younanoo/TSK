_27:7, Isa_27:8; Jer_5:10, Jer_30:11, Jer_31:35, Jer_31:36, Jer_33:24-26; Joe_2:32; Oba_1:16, Oba_1:17; Rom_11:1-7, Rom_11:28, Rom_11:29", "note": "", "refs": [{"l": "Deu 4:31", "n": "", "vs": [[31, "لأن الرب إلهكم إله رحيم لا ينبذكم ولا يفنيكم، ولا ينسى عهد آبائكم الذي أقسم لهم عليه."]]}, {"l": "Isa 27:7", "n": "", "vs": [[7, "هل ضربه الرب كما ضرب ضاربيه، أم هلك كما هلك قاتلوه؟"]]}, {"l": "Isa 27:8", "n": "", "vs": [[8, "عاقبته إذ خاصمته ونفيته بنفخة عاصفة في يوم هبوب ريح شرقية."]]}, {"l": "Jer 5:10", "n": "", "vs": [[10, "اذهبوا إلى أتلام كرومها ودمروها ولكن لا تفنوها. انزعوا أغصانها لأنها ليست للرب."]]}, {"l": "Jer 30:11", "n": "", "vs": [[11, "لأني معك لأخلصك، يقول الرب، فأبيد جميع الأمم التي شتتك بينها. أما أنت فلن أفنيك بل أؤدبك بالحق ولا أبرئك تبرئة كاملة»."]]}, {"l": "Jer 31:35", "n": "", "vs": [[35, "وهذا ما يعلنه الرب الذي جعل الشمس للإضاءة في النهار، وحكم على القمر والكواكب للإنارة ليلا، الذي يثير البحر فتصخب أمواجه، واسمه الرب القدير."]]}, {"l": "Jer 31:36", "n": "", "vs": [[36, "«إن كانت هذه الأحكام تزول من أمامي فإن ذرية إسرائيل تكف عن أن تكون لي أمة»."]]}, {"l": "Jer 33:24-26", "n": "", "vs": [[24, "«ألم تسمع ما قاله ذلك الشعب: قد نبذ الرب العشيرتين اللتين اختارهما؟ كذلك احتقروا شعبي وكأنهم لم يعودوا أمة."], [25, "وهذا ما يعلنه الرب: إن كنت لم أعقد ميثاقا مع النهار والليل، ولم أسن أحكاما للسماوات والأرض،"], [26, "فإني أرفض ذرية يعقوب وداود عبدي، فلا أصطفي من ذريته من يحكم على نسل إبراهيم وإسحق ويعقوب. ولكني سأرد سبيهم وأرحمهم»."]]}, {"l": "Joe 2:32", "n": "", "vs": [[32, "إنما كل من يدعو باسم الرب يخلص، لأن النجاة تكون في جبل صهيون وفي أورشليم، كما قال الرب، إذ يكون بين الناجين من يدعوه الرب."]]}, {"l": "Oba 1:16", "n": "", "vs": [[16, "فإنه كما شربت على جبل قدسي فإن جميع الأمم تشرب في كل حين. يشربون ويجرعون ويتلاشون كمن لم يكونوا."]]}, {"l": "Oba 1:17", "n": "", "vs": [[17, "أما جبل صهيون فيصبح ملاذ النجاة، ويكون قدسا، ويرث بيت يعقوب نصيبه."]]}, {"l": "Rom 11:1-7", "n": "", "vs": [[1, "وهنا أقول: هل رفض الله شعبه؟ حاشا! فأنا أيضا إسرائيلي، من نسل إبراهيم ومن سبط بنيامين."], [2, "إن الله لم يرفض شعبه الذي كان قد اختاره. أما تعلمون ما يقوله الكتاب في أمر إيليا لما رفع إلى الله شكوى على إسرائيل قائلا:"], [3, "«يارب؟ قتلوا أنبياءك، وهدموا مذابحك، وبقيت أنا وحدي، وهم يسعون إلى قتلي!»"], [4, "ولكن، ماذا كان الجواب الإلهي له؟: «أبقيت لنفسي سبعة آلاف رجل لم يحنوا ركبة للبعل!»"], [5, "فكذلك، في الزمان الحاضر، ماتزال بقية اختارها الله بالنعمة."], [6, "ولكن، بما أن ذلك قد تم بالنعمة، فليس بعد على أساس الأعمال، وإلا فليست النعمة نعمة بعد."], [7, "فما الخلاصة إذا؟ إن ما يسعى إليه إسرائيل لم ينالوه، بل ناله المختارون منهم، والباقون عميت بصائرهم،"]]}, {"l": "Rom 11:28", "n": "", "vs": [[28, "ففيما يتعلق بالإنجيل، هم أعداء الله من أجلكم. وأما فيما يتعلق بالاختيار الإلهي فهم محبوبون من أجل الآباء."]]}, {"l": "Rom 11:29", "n": "", "vs": [[29, "فإن الله لا يتراجع أبدا عن هباته ودعوته."]]}], "kwAr": "إلا أني", "noteAr": ""}], "arS": [["ها إن ", []], ["عيني", ["H5869"]], [" ", []], ["الرب", ["H136"]], [" مسلطتان على ", []], ["المملكة", ["H4467"]], [" ", []], ["الخاطئة", ["H2400"]], [" ", []], ["لأمحوها", ["H8045"]], [" عن ", []], ["وجه", ["H6440"]], [" ", []], ["الأرض", ["H127"]], ["، إلا أني لن ", []], ["أستأصل", ["H8045"]], [" ", []], ["بيت", ["H1004"]], [" ", []], ["يعقوب", ["H3290"]], [" قاطبة ", []], ["يقول", ["H5002"]], [" ", []], ["الرب", ["H3068"]], [".", []]]}, {"c": 9, "v": 9, "text": "أغربل بيت إسرائيل بين جميع الأمم كما تغربل الحنطة في غربال، فلا تسقط حبة على الأرض.", "groups": [{"kw": "and I", "raw": "Lev_26:33; Deu_28:64", "note": "", "refs": [{"l": "Lev 26:33", "n": "", "vs": [[33, "وأشتتكم بين الشعوب، وأجرد عليكم سيفي، وألاحقكم، وأحول أرضكم إلى قفر ومدنكم إلى خرائب."]]}, {"l": "Deu 28:64", "n": "", "vs": [[64, "ويشتتكم الرب بين جميع الأمم من أقصى الأرض إلى أقصاها، فتعبدون هناك آلهة أخرى من خشب أو حجر لم تعرفوها أنتم ولا آباؤكم،"]]}], "kwAr": "أغربل", "noteAr": ""}, {"kw": "sift", "raw": "Heb. cause to move", "note": "Heb. cause to move", "refs": [], "kwAr": "تغربل", "noteAr": "بالعبرية: «أحرك»."}, {"kw": "grain", "raw": "Heb. stone", "note": "Heb. stone", "refs": [], "kwAr": "حبة", "noteAr": "بالعبرية: «حجر»."}], "arS": [["أغربل", ["H5128"]], [" ", []], ["بيت", ["H1004"]], [" ", []], ["إسرائيل", ["H3478"]], [" بين ", []], ["جميع", ["H3605"]], [" ", []], ["الأمم", ["H1471"]], [" كما ", []], ["تغربل", ["H5128"]], [" الحنطة في ", []], ["غربال", ["H3531"]], ["، فلا ", []], ["تسقط", ["H5307"]], [" ", []], ["حبة", ["H6872"]], [" على ", []], ["الأرض", ["H776"]], [".", []]]}, {"c": 9, "v": 10, "text": "ويموت جميع خطاة شعبي بالسيف ممن يقولون: لن يدركنا الشر أو يلقانا.", "groups": [{"kw": "the sinners", "raw": "Isa_33:14; Eze_20:38, Eze_34:16, Eze_34:17; Zep_3:11-13; Zec_13:8, Zec_13:9; Mal_3:2-5; Mal_4:1; Mat_3:10-12, Mat_13:41, Mat_13:42, Mat_13:49, Mat_13:50", "note": "", "refs": [{"l": "Isa 33:14", "n": "", "vs": [[14, "قد ارتعب الخطاة في صهيون، واستولت الرعدة على الكافرين، فهتفوا: من منا يقدر أن يسكن مع نار آكلة؟ ومن منا يمكنه أن يقيم في وقائد أبدية؟"]]}, {"l": "Eze 20:38", "n": "", "vs": [[38, "وأعزل من بينكم المتمردين والعصاة علي، وأخرجهم من أرض غربتهم، ولكنهم لن يدخلوا أرض إسرائيل، فتدركون آنئذ أني أنا الرب."]]}, {"l": "Eze 34:16", "n": "", "vs": [[16, "وأطلب الضال وأسترجع المطرود وأجبر الكسير وأعصب الجريح وأستأصل السمين والقوي، وأرعاها بعدل."]]}, {"l": "Eze 34:17", "n": "", "vs": [[17, "أما أنتم ياغنمي فها أنا أقضي بين شاة وشاة، وبين كباش وتيوس."]]}, {"l": "Zep 3:11-13", "n": "", "vs": [[11, "في ذلك اليوم لن يلحقكم العار من جراء ما ارتكبتم من أعمال تمردتم بها علي، لأني سأزيل آنئذ من وسطكم المستخفين المتكبرين، فلا يبقى متشامخ في جبلي المقدس."], [12, "إنما أبقي بينكم شعبا متواضعا فقيرا يتوكلون على اسم الرب."], [13, "ولن يرتكب بقية إسرائيل الإثم، ولا ينطقون بالكذب، وليس في أفواههم غش، بل يعيشون آمنين من غير أن يهددهم أحد."]]}, {"l": "Zec 13:8", "n": "", "vs": [[8, "يقول الرب فيفنى ثلثا شعب أرضي ويبقى ثلثهم حيا فقط."]]}, {"l": "Zec 13:9", "n": "", "vs": [[9, "فأجيز هذا الثلث في النار لأنقيه تنقية الفضة، وأمحصه كما يمحص الذهب. هو يدعو باسمي وأنا أستجيبه. أنا أقول: هو شعبي، وهو يقول: الرب هو إلهي»."]]}, {"l": "Mal 3:2-5", "n": "", "vs": [[2, "ولكن من يحتمل يوم مجيئه؟ ومن يثبت عند ظهوره؟ فإنه مثل نار الممحص أو أشنان القصارين."], [3, "فيجلس ممحصا ومنقيا للفضة ليطهر أبناء لاوي ويمحصهم كالفضة والذهب، حتى يقربوا للرب تقدمات بقلوب طاهرة."], [4, "عندئذ تكون تقدمة يهوذا وشعب أورشليم مرضية عند الرب، كالعهد بها في سالف الأيام وفي السنين الغابرة."], [5, "وأقترب منكم لأكون شاهدا سريعا ضد السحرة والزناة والحالفين بالزور والمستغلين لأجرة العامل ومضطهدي الأرامل والأيتام، والذين يظلمون الغرباء ولا يخافونني"]]}, {"l": "Mal 4:1", "n": "", "vs": [[1, "«انظروا، ها يوم القضاء مقبل، لاهب كتنور يكون فيه جميع المستكبرين وفاعلي الإثم عصافة، فيحرقهم ذلك اليوم ولا يبقي لهم أصلا ولا فرعا، يقول الرب القدير."]]}, {"l": "Mat 3:10-12", "n": "", "vs": [[10, "وها إن الفأس قد ألقيت على أصل الشجر، فكل شجرة لا تثمر ثمرا جيدا تقطع وتطرح في النار."], [11, "أنا أعمدكم بالماء لأجل التوبة، ولكن الآتي بعدي هو أقدر مني، وأنا لا أستحق أن أحمل حذاءه. هو سيعمدكم بالروح القدس، وبالنار."], [12, "فهو يحمل المذرى بيده، وسينقي بيدره تماما: فيجمع قمحه إلى المخزن، وأما التبن فيحرقه بنار لا تطفأ! »"]]}, {"l": "Mat 13:41", "n": "", "vs": [[41, "يرسل ابن الإنسان ملائكته، فيخرجون من ملكوته جميع المفسدين ومرتكبي الإثم،"]]}, {"l": "Mat 13:42", "n": "", "vs": [[42, "ويطرحونهم في أتون النار، هناك يكون البكاء وصرير الأسنان."]]}, {"l": "Mat 13:49", "n": "", "vs": [[49, "هكذا يحدث في نهاية الزمان: يأتي الملائكة فيخرجون الأشرار من بين الأبرار،"]]}, {"l": "Mat 13:50", "n": "", "vs": [[50, "ويطرحونهم في أتون النار، هناك يكون البكاء وصرير الأسنان."]]}], "kwAr": "خطاة", "noteAr": ""}, {"kw": "The evil", "raw": "Amo_6:1, Amo_6:3; Psa_10:11; Ecc_8:11; Isa_5:19, Isa_28:14, Isa_28:15, Isa_56:12; Jer_18:18; Mal_3:15", "note": "", "refs": [{"l": "Amo 6:1", "n": "", "vs": [[1, "ويل للمترفين في صهيون والمطمئنين في جبل السامرة، نبلاء طليعة الأمم الذين يتوافد إليهم شعب إسرائيل."]]}, {"l": "Amo 6:3", "n": "", "vs": [[3, "أنتم يامن تتجاهلون يوم السوء وتقربون كرسي الظلم."]]}, {"l": "Psa 10:11", "n": "", "vs": [[11, "يقول في قلبه: الله غافل. قد حجب وجهه، ولن يرى ما يجري"]]}, {"l": "Ecc 8:11", "n": "", "vs": [[11, "ولأن القضاء لا ينفذ بسرعة على الشر المرتكب، فإن قلوب البشر تمتليء بالعزم على فعل الشر."]]}, {"l": "Isa 5:19", "n": "", "vs": [[19, "ويقولون: ليسرع وليعجل بعقابه حتى نراه. لينفذ مقدس إسرائيل مأربه فينا فندرك حقيقة ما يفعله بنا."]]}, {"l": "Isa 28:14", "n": "", "vs": [[14, "لذلك اسمعوا كلمة الرب أيها المستهزئون المتحكمون في شعب أورشليم:"]]}, {"l": "Isa 28:15", "n": "", "vs": [[15, "لأنكم قلتم: «قد أبرمنا عهدا مع الموت، وعقدنا ميثاقا مع الهاوية، فإن الأشوريين المقتحمين أرضنا لن يسلخونا، لأن السوط الجارف إذا عبر لا يصيبنا لأننا اعتصمنا بالمراوغة ولجأنا إلي النفاق»."]]}, {"l": "Isa 56:12", "n": "", "vs": [[12, "قائلين: تعالوا نأتي بالخمر، ونشرب مسكرا حتى الثمالة، فالغد يكون مماثلا لهذا اليوم، بل أعظم منه."]]}, {"l": "Jer 18:18", "n": "", "vs": [[18, "ثم قالوا: «تعالوا نتآمر على إرميا، لأن الشريعة لا تبيد عن الكاهن، ولا المشورة عن الحكيم، ولا الوحي عن النبي. تعالوا نلذعه بوخزات اللسان ونصم آذاننا عن كلامه»."]]}, {"l": "Mal 3:15", "n": "", "vs": [[15, "وها نحن الآن نغبط المستكبرين، ونرى فاعلي الشر يزدهرون، بل إنهم تحدوا الله ونجوا."]]}], "kwAr": "الشر", "noteAr": ""}], "arS": [["ويموت", ["H4191"]], [" ", []], ["جميع", ["H3605"]], [" ", []], ["خطاة", ["H2400"]], [" ", []], ["شعبي", ["H5971"]], [" ", []], ["بالسيف", ["H2719"]], [" ممن ", []], ["يقولون", ["H559"]], [": لن ", []], ["يدركنا", ["H5066"]], [" ", []], ["الشر", ["H7451"]], [" أو يلقانا.", []]]}, {"c": 9, "v": 11, "text": "في ذلك اليوم أقيم مسكن داود الذي تهاوى، وأسد ثغراته وأعمر خرائبه وأعيد بناءه كالعهد به في الأيام الغابرة.", "groups": [{"kw": "that day", "raw": "Act_15:15-17", "note": "", "refs": [{"l": "Act 15:15-17", "n": "", "vs": [[15, "وتوافق هذا أقوال الأنبياء، كما جاء في الكتاب."], [16, "سأعود من بعد هذا وأبني خيمة داود المنهدمة ثم أقيم أنقاضها وأبنيها من جديد،"], [17, "لكي يسعى إلى الرب باقي الناس وجميع الشعوب التي تحمل اسمي، يقول الرب، فاعل هذه الأمور"]]}], "kwAr": "في ذلك اليوم", "noteAr": ""}, {"kw": "raise", "raw": "Isa_9:6, Isa_9:7, Isa_11:1-10; Jer_23:5, Jer_23:6, Jer_30:9, Jer_33:14-16, Jer_33:20-26; Eze_17:24; Eze_34:23, Eze_34:24, Eze_37:24, Eze_37:25; Hos_3:5; Mic_5:2; Luk_1:31-33, Luk_1:69, Luk_1:70; Act_2:30-36", "note": "", "refs": [{"l": "Isa 9:6", "n": "", "vs": [[6, "لأنه يولد لنا ولد ويعطى لنا ابن يحمل الرياسة على كتفه، ويدعى اسمه عجيبا، مشيرا، إلها قديرا، أبا أبديا، رئيس السلام."]]}, {"l": "Isa 9:7", "n": "", "vs": [[7, "ولا تكون نهاية لنمو رياسته وللسلام اللذين يسودان عرش داود ومملكته، ليثبتها ويعضدها بالحق والبر، من الآن وإلى الأبد. إن غيرة الرب القدير تتمم هذا."]]}, {"l": "Isa 11:1-10", "n": "", "vs": [[1, "ويفرخ برعم من جذع يسى، وينبت غصن من جذوره،"], [2, "ويستقر عليه روح الرب، روح الحكمة والفطنة، روح المشورة والقوة، روح معرفة الرب ومخافته."], [3, "وتكون مسرته في تقوى الرب، ولا يقضي بحسب ما تشهد عيناه، ولا يحكم بمقتضى ما تسمع أذناه،"], [4, "إنما يقضي بعدل للمساكين، ويحكم بالإنصاف لبائسي الأرض، ويعاقب الأرض بقضيب فمه، ويميت المنافق بنفخة شفتيه،"], [5, "لأنه سيرتدي البر ويتمنطق بالأمانة."], [6, "فيسكن الذئب مع الحمل، ويربض النمر إلى جوار الجدي، ويتآلف العجل والأسد وكل حيوان معلوف معا، ويسوقها جميعا صبي صغير."], [7, "ترعى البقرة والدب معا، ويربض أولادهما متجاورين، ويأكل الأسد التبن كالثور،"], [8, "ويلعب الرضيع في (أمان) عند جحر الصل، ويمد الفطيم يده إلى وكر الأفعى (فلا يصيبه سوء)."], [9, "لا يؤذون ولا يسيئون في كل جبل قدسي، لأن الأرض تمتليء من معرفة الرب كما تغمر المياه البحر."], [10, "في ذلك اليوم ينتصب أصل يسى راية للأمم، وإليه تسعى جميع الشعوب، ويكون مسكنه مجيدا."]]}, {"l": "Jer 23:5", "n": "", "vs": [[5, "ها أيام مقبلة أقيم فيها لداود ذرية بر، ملكا يسود بحكمة، ويجري في الأرض عدلا وحقا."]]}, {"l": "Jer 23:6", "n": "", "vs": [[6, "في عهده يتم خلاص شعب يهوذا، ويسكن شعب إسرائيل آمنا. أما الاسم الذي سيدعى به فهو: الرب برنا."]]}, {"l": "Jer 30:9", "n": "", "vs": [[9, "بل يعبدون الرب إلههم، وداود (أي المسيا) ملكهم الذي أقيمه لهم."]]}, {"l": "Jer 33:14-16", "n": "", "vs": [[14, "«ها أيام مقبلة»، يقول الرب، «أتمم فيها الوعد الذي تعهدت به لذرية يهوذا ولذرية إسرائيل."], [15, "في تلك الأيام أنبت من نسل داود غصن بر يجري عدلا وبرا في الأرض."], [16, "في تلك الأيام يخلص يهوذا، وتسكن أورشليم آمنة، وهذا هو الاسم الذي تدعى به: الرب برنا."]]}, {"l": "Jer 33:20-26", "n": "", "vs": [[20, "«هذا ما يقوله الرب: إن استطعتم أن تنقضوا عهدي مع النهار، ومع الليل، بحيث لا يحل النهار والليل في أوانهما،"], [21, "يمكن أن تنقضوا عهدي مع عبدي داود، فلا يكون من ذريته ابن يملك على عرشه، ومع الكهنة واللاويين خدامي."], [22, "وأكثر ذرية داود عبدي وذر اري اللاويين خدامي، وأجعلها في كثرة نجوم السماء التي لا تحصى، وكرمل البحر الذي لا يعد»."], [23, "ثم أوحى الرب إلى إرميا بهذه النبوءة."], [24, "«ألم تسمع ما قاله ذلك الشعب: قد نبذ الرب العشيرتين اللتين اختارهما؟ كذلك احتقروا شعبي وكأنهم لم يعودوا أمة."], [25, "وهذا ما يعلنه الرب: إن كنت لم أعقد ميثاقا مع النهار والليل، ولم أسن أحكاما للسماوات والأرض،"], [26, "فإني أرفض ذرية يعقوب وداود عبدي، فلا أصطفي من ذريته من يحكم على نسل إبراهيم وإسحق ويعقوب. ولكني سأرد سبيهم وأرحمهم»."]]}, {"l": "Eze 17:24", "n": "", "vs": [[24, "فتدرك جميع أشجار الصحراء (أي جميع الأمم) أني أنا الرب، أذللت الأشجار المتعالية، وعظمت الأشجار الدنية. يبست الشجر النضر، وأنضرت الشجر المتيبس، أنا الرب قلت وأنجزت»."]]}, {"l": "Eze 34:23", "n": "", "vs": [[23, "وأنصب عليها راعيا واحدا عبدي داود (أي المسيح) يرعاها بنفسه ويكون لها راعيا أمينا."]]}, {"l": "Eze 34:24", "n": "", "vs": [[24, "وأنا الرب أكون لهم إلها، وعبدي داود يكون لهم رئيسا. أنا الرب تكلمت."]]}, {"l": "Eze 37:24", "n": "", "vs": [[24, "ويصبح داود عبدي (أي المسيح) ملكا عليهم، فيكون لهم جميعا راع واحد فيمارسون أحكامي ويطيعون فرائضي عاملين بها."]]}, {"l": "Eze 37:25", "n": "", "vs": [[25, "ويقيمون في الأرض التي وهبتها لعبدي يعقوب التي سكن فيها آباؤكم، فيستوطنون فيها هم وأبناؤهم وأحفادهم إلى الأبد. ويكون عبدي داود (أي المسيح) رئيسا عليهم مدى الدهر."]]}, {"l": "Hos 3:5", "n": "", "vs": [[5, "ثم يرجع أبناء إسرائيل ويطلبون الرب إلههم، وداود ملكهم (أي المسيح)، ويلتمسون برهبة الرب وجوده في آخر الأيام»."]]}, {"l": "Mic 5:2", "n": "", "vs": [[2, "أما أنت يابيت لحم أفراتة، مع أنك قرية صغيرة بين ألوف قرى يهوذا، إلا أن منك يخرج لي من يصبح ملكا في إسرائيل وأصله منذ القديم، منذ الأزل."]]}, {"l": "Luk 1:31-33", "n": "", "vs": [[31, "وها أنت ستحبلين وتلدين ابنا، وتسمينه يسوع."], [32, "إنه يكون عظيما، وابن العلي يدعى، ويمنحه الرب الإله عرش داود أبيه،"], [33, "فيملك على بيت يعقوب إلى الأبد، ولن يكون لملكه نهاية»."]]}, {"l": "Luk 1:69", "n": "", "vs": [[69, "وأقام لنا قرن خلاص في بيت داود فتاه،"]]}, {"l": "Luk 1:70", "n": "", "vs": [[70, "كما تكلم بلسان أنبيائه القديسين الذين جاءوا منذ القديم:"]]}, {"l": "Act 2:30-36", "n": "", "vs": [[30, "لأن داود كان نبيا، وعارفا أن الله أقسم له يمينا بأن يجيء المسيح من نسله ويجلس على عرشه،"], [31, "فقد تكلم عن قيامة المسيح كما رآها مسبقا، فقال إن نفسه لم تترك في هوة الأموات، ولم ينل من جسده الفساد."], [32, "فيسوع هذا أقامه الله من الموت، ونحن جميعا شهود لذلك."], [33, "وإذ رفع إلى يمين الله، وأخذ من الآب الروح القدس الموعود به، أفاضه علينا. وما ترونه الآن وتسمعونه هو نتيجة لذلك."], [34, "فإن داود لم يرتفع بجسده إلى السماء. ثم إنه هو نفسه يقول: قال الرب لربي: اجلس عن يميني"], [35, "حتى أجعل أعداءك موطئا لقدميك."], [36, "فليعلم يقينا بنو إسر ائيل جميعا، أن الله قد جعل يسوع، هذا الذي صلبتموه أنتم، ربا ومسيحا!»"]]}], "kwAr": "أقيم", "noteAr": ""}, {"kw": "the tabernacle", "raw": "Isa_16:5; Eze_21:25-27", "note": "", "refs": [{"l": "Isa 16:5", "n": "", "vs": [[5, "ولا يلبث أن يثبت بالرحمة عرش في بيت داود يجلس عليه بأمانة ملك يقضي بالعدل والإنصاف."]]}, {"l": "Eze 21:25-27", "n": "", "vs": [[25, "وأنت أيها المطعون الأثيم، ملك إسرائيل، يامن أزف يومه في ساعة العقاب النهائي"], [26, "اخلع العمامة، وانزع التاج، فلن يبقى الحال كسالف العهد به، ارفع الوضيع، وضع الرفيع."], [27, "ها أنا أقلبه، أقلبه، أقلبه، حتى لا يبقى منه أثر، إلى أن يأتي صاحب الحكم، فأعطيه إياه."]]}], "kwAr": "مسكن", "noteAr": ""}, {"kw": "close", "raw": "Heb. hedge, or wall, Job_1:10; Psa_80:12, Psa_89:40; Isa_5:5", "note": "Heb. hedge, or wall, Job_1:10; Psa_80:12, Psa_89:40; Isa_5:5", "refs": [{"l": "Job 1:10", "n": "", "vs": [[10, "ألم تسيج حوله وحول بيته وحول كل ما يملك. , ["الغابرة", ["H5769"]], [".", []]]}, {"c": 9, "v": 12, "text": "لكي يرث إسرائيل ما تبقى من أدوم وجميع الأمم التي دعي اسمي عليها، يقول الرب صانع هذه الأمور.", "groups": [{"kw": "possess", "raw": "Isa_11:14, Isa_14:1, Isa_14:2; Joe_3:8; Oba_1:18-21", "note": "", "refs": [{"l": "Isa 11:14", "n": "", "vs": [[14, "وينقضان على أكتاف الفلسطينيين غربا ويغزوان أبناء المشرق معا، ويستوليان على بلاد أدوم وموآب، ويخضع لهم بنو عمون."]]}, {"l": "Isa 14:1", "n": "", "vs": [[1, "ولكن الرب ينعم برحمته على ذرية يعقوب، ويصطفي شعب إسرائيل ثانية ويحلهم في أرضهم، فينضم الغرباء إليهم ويلحقون ببيت يعقوب."]]}, {"l": "Isa 14:2", "n": "", "vs": [[2, "وتمد شعوب الأرض إليهم يد العون ليساعدوا إسرائيل على العودة لدياره. ويصيرون عبيدا لبني إسرائيل، في أرض الرب، ويتسلطون على آسريهم وظالميهم."]]}, {"l": "Joe 3:8", "n": "", "vs": [[8, "وأبيع أبناءكم وبناتكم بأيدي أبناء يهوذا، فيبيعونهم بدورهم إلى السبئيين، إلى أمة بعيدة، لأن الرب قد أصدر قضاءه."]]}, {"l": "Oba 1:18-21", "n": "", "vs": [[18, "ويصير بيت يعقوب نارا، وبيت يوسف لهيبا، وبيت عيسو قشا فيوقدونهم ويلتهمونهم، ولا يفلت من بيت عيسو أحد، يقول الرب."], [19, "ويرث أهل النقب جبل عيسو، وسكان السهول أرض الفلسطينيين، ويملكون أرض أفرايم وبلاد السامرة، ويرث بنيامين جلعاد."], [20, "ويستولي جيش مسبيي بني إسرائيل على أرض الكنعانيين حتى صرفة، ويحتل مسبيو أورشليم في صفارد مدن جنوب يهوذا."], [21, "ويصعد المنقذون إلى جبل صهيون ليحكموا جبل عيسو، ويصبح الملك للرب."]]}], "kwAr": "يرث", "noteAr": ""}, {"kw": "Edom", "raw": "Gen_27:29, Gen_27:37; Num_24:17; Psa_60:8; Mal_1:4", "note": "", "refs": [{"l": "Gen 27:29", "n": "", "vs": [[29, "لتخدمك الشعوب، وتسجد لك القبائل، لتكن سيدا على إخوتك. وبنو أمك لك ينحنون. وليكن لاعنوك ملعونين، ومباركوك مباركين»."]]}, {"l": "Gen 27:37", "n": "", "vs": [[37, "فأجاب إسحق: «لقد جعلته سيدا لك، وصيرت جميع إخوته له خداما، وبالحنطة والخمر أمددته. فماذا أفعل لك الآن ياولدي؟»."]]}, {"l": "Num 24:17", "n": "", "vs": [[17, "أراه ولكن ليس حاضرا، وأبصره ولكن ليس قريبا. يخرج نجم من يعقوب، ويظهر ملك من إسرائيل فيحطم طرفي موآب، ويهلك كل رجال ال
