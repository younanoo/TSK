ر برجائنا في التمتع بمجد الله."], [3, "ليس هذا فقط، بل نفتخر أيضا في وسط الضيقات، لعلمنا أن الضيق ينتج فينا الصبر،"], [4, "والصبر يؤهلنا للفوز في الامتحان، والفوز يبعث فينا الرجاء،"], [5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."], [6, "فإنه ونحن بعد عاجزون، مات المسيح عن العصاة في الوقت المعين."], [7, "إذ قلما يموت أحد فدى إنسان بار، بل قد يتجرأ أحد أن يموت فدى إنسان صالح."], [8, "ولكن الله أثبت لنا محبته، إذ ونحن مازلنا خاطئين مات المسيح عوضا عنا."], [9, "ومادمنا الآن قد تبررنا بدمه، فكم بالأحرى نخلص به من الغضب الآتي!"], [10, "فإن كنا، ونحن أعداء، قد تصالحنا مع الله بموت ابنه، فكم بالأحرى نخلص بحياته ونحن مصالحون!"]]}], "kwAr": "كاملة", "noteAr": "بالعبرانية: سلاما. انظر رو 5: 1-10"}], "arS": [["(المحبوبة): ", []], ["أنا", ["H589"]], [" ", []], ["كسور", ["H2346"]], [" ", []], ["ونهداي", ["H7699"]], [" ", []], ["كبرجين", ["H4026"]], ["، ", []], ["حينئذ", ["H227"]], [" ", []], ["صرت", ["H1961", "H4672"]], [" في ", []], ["عينيه", ["H5869"]], [" ", []], ["كاملة", ["H7965"]], [".", []]]}, {"c": 8, "v": 11, "text": "كان لسليمان كرم في بعل هامون، فعهد بالكرم إلى النواطير على أن يؤدي كل واحد منهم ألفا من الفضة لقاء الثمر.", "groups": [{"kw": "Solomon", "raw": "Calmet thus translates these verses: Solomon has a vineyard at Baal-hamon; he has let it out to keepers, each of whom for the fruit of it was to bring a thousand pieces of silver. As for me, my vineyard is before me; keep thyself, O Solomon, thy thousand pieces of silver, etc.", "note": "Calmet thus translates these verses: Solomon has a vineyard at Baal-hamon; he has let it out to keepers, each of whom for the fruit of it was to bring a thousand pieces of silver. As for me, my vineyard is before me; keep thyself, O Solomon, thy thousand pieces of silver, etc.", "refs": [], "kwAr": "لسليمان", "noteAr": "يترجم كالميه هذه الآيات هكذا: لسليمان كرم في بعل هامون، وقد أجَّره للنواطير، على أن يؤدي كل واحد منهم عن ثمره ألفا من قطع الفضة. أما أنا فكرمي أمامي؛ احتفظ أنت ياسليمان بألفك من الفضة، إلخ."}, {"kw": "had a", "raw": "Son_7:12; Ecc_2:4; Isa_5:1-7; Mat_21:33-43; Mar_12:1", "note": "", "refs": [{"l": "Son 7:12", "n": "", "vs": [[12, "لنخرج مبكرين إلى الكروم، لنرى هل أفرخت الكرمة، وهل تفتحت براعمها، وهل نور الرمان؟ هناك أهبك حبي."]]}, {"l": "Ecc 2:4", "n": "", "vs": [[4, "فأنجزت أعمالا عظيمة، وشيدت لي بيوتا وغرست كروما."]]}, {"l": "Isa 5:1-7", "n": "", "vs": [[1, "سأشدو لحبيبي أغنية عن كرمه: كان لحبيبي كرم على تل خصيب،"], [2, "حرث أرضه ونقاه من الحجارة، وغرس فيه أفضل كرمة، وشيد في وسطه برجا، ونقر في الصخر معصرة. ثم انتظر أن يثمر له عنبا فأنتج له حصرما!"], [3, "والآن ياأهل أورشليم ورجال يهوذا، احكموا بيني وبين كرمي."], [4, "أي شيء يمكن أن يصنع لكرمي لم أصنعه؟ وعندما انتظرت منه أن يثمر لي عنبا، لماذا أنتج حصرما؟"], [5, "وا لآن أخبركم ما أصنع بكرمي: سأزيل سياجه فيصبح مرعى ماشية، وأهدم سوره فيضحى مداس أقدام،"], [6, "وأجعله خرابا فلا يقلم ولا ينقب، فينبت فيه شوك وحسك. وأوصي السحاب أن لا يمطر عليه أبدا."], [7, "لأن كرم الرب القدير هو بيت إسرائيل، ورجال يهوذا هم غرس بهجته. ولكن عندما انتظر حقا وجد سفك دماء، وعندما التمس عدلا رأى صراخا."]]}, {"l": "Mat 21:33-43", "n": "", "vs": [[33, "اسمعوا مثلا آخر: غرس إنسان رب بيت كرما، وأقام حوله سياجا، وحفر فيه معصرة، وبنى فيه برج حراسة. ثم سلم الكرم إلى مزارعين وسافر."], [34, "ولما حان أوان القطاف، أرسل عبيده إلى المزارعين ليتسلم ثمر الكرم."], [35, "فقبض المزارعون على العبيد، فضربوا أحدهم، وقتلوا غيره، ورجموا الآخر بالحجارة."], [36, "ثم أرسل رب البيت ثانية عبيدا آخرين أكثر عددا من الأولين. ففعل المزارعون بهؤلاء ما فعلوه بأولئك."], [37, "وأخيرا أرسل إليهم ابنه، قائلا: سيهابون ابني!"], [38, "فما إن رأى المزارعون الابن حتى قال بعضهم لبعض: هذا هو الوريث! تعالوا نقتله فنستولي على ميراثه."], [39, "ثم قبضوا عليه، وطرحوه خارج الكرم، وقتلوه!"], [40, "فعندما يعود رب الكرم، ماذا يفعل بأولئك المزارعين؟»"], [41, "أجابوه: «أولئك الأشرار، يهلكهم شر هلاك. ثم يسلم الكرم إلى مزارعين آخرين يؤدون له الثمر في أوانه»."], [42, "فقال لهم يسوع: «ألم تقرأوا في الكتاب: الحجر الذي رفضه البناة، هو نفسه صار حجر الزاوية الأساسي. من الرب كان هذا، وهو عجيب في أنظارنا!"], [43, "لذلك أقول لكم: إن ملكوت الله سينزع من أيديكم ويسلم إلى شعب يؤدي ثمره."]]}, {"l": "Mar 12:1", "n": "", "vs": [[1, "وأخذ يخاطبهم بأمثال، فقال: «غرس إنسان كرما، وأقام حوله سياجا، وحفر فيه حوض معصرة، وبنى فيه برج حراسة. ثم سلم الكرم إلى مزارعين، وسافر."]]}], "kwAr": "كرم", "noteAr": ""}, {"kw": "he let", "raw": "Luk_20:9-18", "note": "", "refs": [{"l": "Luk 20:9-18", "n": "", "vs": [[9, "وأخذ يكلم الشعب بهذا المثل: «غرس إنسان كرما وسلمه إلى مزارعين، وسافر مدة طويلة."], [10, "وفي موسم القطاف أرسل إلى المزارعين عبدا، لكي يعطوه من ثمر الكرم. ولكن المزارعين ضربوه وردوه فارغ اليدين."], [11, "فعاد وأرسل عبدا آخر. إلا أنهم ضربوه أيضا وأهانوه وردوه فارغ اليدين."], [12, "ثم عاد وأرسل عبدا ثالثا، فجرحوه وطرحوه خارج الكرم."], [13, "فقال رب الكرم: ماذا أفعل؟ سأرسل ابني الحبيب، لعلهم يهابونه!"], [14, "ولكن ما إن رآه المزارعون، حتى تشاوروا فيما بينهم قائلين: هذا هو الوريث. فلنقتله ليصير الميراث لنا."], [15, "فطرحوه خارج الكرم وقتلوه. فماذا إذن يفعل رب الكرم بهم؟"], [16, "إنه يأتي ويهلك أولئك المزارعين، ويسلم الكرم إلى غيرهم»."], [17, "ولكنه نظر إليهم وقال: «إذن ما معنى هذه الآية المكتوبة: الحجر الذي رفضه البناة، هو نفسه صار حجر الزاوية؟"], [18, "من يقع على هذا الحجر يتكسر، ومن يقع الحجر عليه يسحقه سحقا؟»"]]}], "kwAr": "عهد بالكرم", "noteAr": ""}, {"kw": "a thousand", "raw": "Gen_20:16; Isa_7:23", "note": "", "refs": [{"l": "Gen 20:16", "n": "", "vs": [[16, "وقال لسارة: «ها قد وهبت أخاك ألف قطعة من الفضة، تبرئة لك من كل إساءة أمام الذين معك، فأنت بريئة أمام كل واحد، وهكذا تكونين قد أنصفت»."]]}, {"l": "Isa 7:23", "n": "", "vs": [[23, "في ذلك اليوم يصير كل موضع كان فيه ألف جفنة بألف شاقل (نحو اثني عشر كيلو جراما) من الفضة، منبتا للشوك والحسك."]]}], "kwAr": "ألفا من الفضة", "noteAr": ""}], "arS": [["كان", ["H1961"]], [" ", []], ["لسليمان", ["H8010"]], [" ", []], ["كرم", ["H3754"]], [" في بعل ", []], ["هامون", ["H1174"]], ["، ", []], ["فعهد", ["H5414"]], [" بالكرم إلى ", []], ["النواطير", ["H5201"]], [" على أن ", []], ["يؤدي", ["H935"]], [" ", []], ["كل
