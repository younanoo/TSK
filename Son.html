<script>window.CATALOG=[{"id": 17, "abbr": "Est", "en": "Esther", "nc": 10, "nv": 167, "refs": 1266, "last": "10:3", "first": "وحدث في أيام أحشويروش، الذي امتد حكمه من الهند إلى كوش، فملك على مئة وسبعة وعشرين إقليما،"}, {"id": 18, "abbr": "Job", "en": "Job", "nc": 42, "nv": 1070, "refs": 10209, "last": "42:17", "first": "عاش في أرض عوص رجل اسمه أيوب، كان صالحا كاملا يتقي الله ويحيد عن الشر."}, {"id": 19, "abbr": "Psa", "en": "Psalms", "nc": 150, "nv": 2461, "refs": 33395, "last": "150:6", "first": "طوبى للإنسان الذي لا يتبع مشورة الأشرار، ولا يقف في طريق الخاطئين، ولا يجالس المستهزئين."}, {"id": 20, "abbr": "Pro", "en": "Proverbs", "nc": 31, "nv": 915, "refs": 10457, "last": "31:31", "first": "هذه هي أمثال سليمان بن داود ملك إسرائيل،"}, {"id": 21, "abbr": "Ecc", "en": "Ecclesiastes", "nc": 12, "nv": 222, "refs": 3186, "last": "12:14", "first": "هذه أقوال الجامعة ابن داود ملك أورشليم."}, {"id": 22, "abbr": "Son", "en": "Song of Solomon", "nc": 8, "nv": 117, "refs": 1802, "last": "8:14", "first": "هذا نشيد الأناشيد لسليمان."}, {"id": 23, "abbr": "Isa", "en": "Isaiah", "nc": 66, "nv": 1292, "refs": 21959, "last": "66:24", "first": "هذه هي رؤيا إشعياء بن آموص، التي أعلنت له بشأن يهوذا وأورشليم في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا."}, {"id": 24, "abbr": "Jer", "en": "Jeremiah", "nc": 52, "nv": 1364, "refs": 20659, "last": "52:34", "first": "هذه نبوءة إرميا بن حلقيا أحد الكهنة المقيمين في عناثوث بأرض سبط بنيامين."}, {"id": 25, "abbr": "Lam", "en": "Lamentations", "nc": 5, "nv": 154, "refs": 2238, "last": "5:22", "first": "كيف أصبحت المدينة الآهلة بالسكان مهجورة وحيدة؟ صارت كأرملة! هذه التي كانت عظيمة بين الأمم. السيدة بين المدن صارت تحت الجزية!"}, {"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 48, "nv": 1273, "refs": 15264, "last": "48:35", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 22, "abbr": "Son", "en": "Song of Solomon", "verses": [{"c": 1, "v": 1, "text": "هذا نشيد الأناشيد لسليمان.", "groups": [{"kw": "song", "raw": "Psa_14:1 *title Isa_5:1", "note": "Psa_14:1 *title Isa_5:1", "refs": [{"l": "Psa 14:1", "n": "", "vs": [[1, "قال الجاهل في قلبه: لا يوجد إله! قد فسد البشر وارتكبوا الموبقات، وليس بينهم من يعمل الصلاح."]]}, {"l": "Isa 5:1", "n": "", "vs": [[1, "سأشدو لحبيبي أغنية عن كرمه: كان لحبيبي كرم على تل خصيب،"]]}], "kwAr": "نشيد الأناشيد", "noteAr": "انظر مز 14: 1؛ إش 5: 1"}, {"kw": "Solomons", "raw": "1Ki_4:32", "note": "", "refs": [{"l": "1Ki 4:32", "n": "", "vs": [[32, "ونطق بثلاثة آلاف مثل، وبلغت أناشيده ألفا وخمس قصائد."]]}], "kwAr": "لسليمان", "noteAr": ""}], "arS": [["هذا ", []], ["نشيد", ["H7892"]], [" ", []], ["الأناشيد", ["H7892"]], [" ", []], ["لسليمان", ["H8010"]], [".", []]]}, {"c": 1, "v": 2, "text": "(المحبوبة): ليلثمني بقبلات فمه، لأن حبك ألذ من الخمر.", "groups": [{"kw": "him", "raw": "Son_5:16, Son_8:1; Gen_27:26, Gen_27:27, Gen_29:11, Gen_45:15; Psa_2:12; Luk_15:20; Act_21:7; 1Pe_5:14", "note": "", "refs": [{"l": "Son 5:16", "n": "", "vs": [[16, "فمه عذب، وكله مشتهيات. هذا هو حبيبي وهذا هو خليلي يابنات أورشليم!"]]}, {"l": "Son 8:1", "n": "", "vs": [[1, "(المحبوبة): ليتك كنت أخي الذي رضع ثدي أمي، حتى إذا التقيتك في الخارج أقبلك وليس من يلومني!"]]}, {"l": "Gen 27:26", "n": "", "vs": [[26, "فقال له إسحق أبوه: «تعال وقبلني ياولدي»."]]}, {"l": "Gen 27:27", "n": "", "vs": [[27, "فاقترب منه وقبله، فتنسم رائحة ثيابه وباركه قائلا: «ها إن رائحة ابني كرائحة حقل باركه الرب،"]]}, {"l": "Gen 29:11", "n": "", "vs": [[11, "وقبل يعقوب راحيل وأجهش بالبكاء،"]]}, {"l": "Gen 45:15", "n": "", "vs": [[15, "وقبل يوسف باقي إخوته وبكى معهم. وعندئذ فقط تجرأ إخوته على مخاطبته."]]}, {"l": "Psa 2:12", "n": "", "vs": [[12, "قبلوا الابن لئلا يغضب، فتهلكوا في الطريق، لئلا يتوهج غضبه سريعا. طوبى لجميع المتكلين عليه."]]}, {"l": "Luk 15:20", "n": "", "vs": [[20, "فقام ورجع إلى أبيه. ولكن أباه رآه وهو مازال بعيدا، فتحنن، وركض إليه وعانقه وقبله بحرارة."]]}, {"l": "Act 21:7", "n": "", "vs": [[7, "وتابعنا السفر بحرا من صور إلى بتولمايس، فسلمنا على الإخوة هناك وقضينا معهم يوما واحدا."]]}, {"l": "1Pe 5:14", "n": "", "vs": [[14, "سلموا بعضكم على بعض بقبلة المحبة."]]}], "kwAr": "ليلثمني", "noteAr": ""}, {"kw": "thy love", "raw": "Heb. thy loves, Son_1:4, Son_2:4, Son_4:10, Son_7:6, Son_7:9, Son_7:12, Son_8:2; Psa_36:7, Psa_63:3-5; Isa_25:6, Isa_55:1, Isa_55:2; Mat_26:26", "note": "Heb. thy loves, Son_1:4, Son_2:4, Son_4:10, Son_7:6, Son_7:9, Son_7:12, Son_8:2; Psa_36:7, Psa_63:3-5; Isa_25:6, Isa_55:1, Isa_55:2; Mat_26:26", "refs": [{"l": "Son 1:4", "n": "", "vs": [[4, "اجذبني وراءك فنجري، أدخلني الملك إلى مخادعه. نبتهج بك ونفرح، ونطري حبك أكثر من الخمر، فالذين أحبوك محقون."]]}, {"l": "Son 2:4", "n": "", "vs": [[4, "أتى بي إلى قاعة احتفاله، ورايته فوقي محبة."]]}, {"l": "Son 4:10", "n": "", "vs": [[10, "ما أعذب حبك ياأختي ياعروسي! لكم حبك ألذ من الخمر، وأريج أطيابك أزكى من كل العطور."]]}, {"l": "Son 7:6", "n": "", "vs": [[6, "ما أجملك أيتها الحبيبة وما ألذك بالمسرات!"]]}, {"l": "Son 7:9", "n": "", "vs": [[9, "فمك كأجود الخمر!(المحبوبة): لتكن سائغة لحبيبي، تسيل عذبة على شفاه النائمين."]]}, {"l": "Son 7:12", "n": "", "vs": [[12, "لنخرج مبكرين إلى الكروم، لنرى هل أفرخت الكرمة، وهل تفتحت براعمها، وهل نور الرمان؟ هناك أهبك حبي."]]}, {"l": "Son 8:2", "n": "", "vs": [[2, "ثم أقودك وأدخل بك بيت أمي التي تعلمني الحب، فأقدم لك خمرة ممزوجة من سلاف رماني."]]}, {"l": "Psa 36:7", "n": "", "vs": [[7, "اللهم، ما أثمن رحمتك، فإن بني البشر يحتمون في ظل جناحيك."]]}, {"l": "Psa 63:3-5", "n": "", "vs": [[3, "لأن رحمتك خير من الحياة، لذلك تسبحك شفتاي."], [4, "أحمدك على بركاتك مدى حياتي، وباسمك أرفع يدي مبتهلا."], [5, "تشبع نفسي كأنها أكلت من الشحم والدسم، ويسبحك فمي بشفتين مبتهجتين"]]}, {"l": "Isa 25:6", "n": "", "vs": [[6, "في هذا الجبل، في أورشليم، يقيم الرب القدير مأدبة مسمنات لجميع الشعوب، مأدبة خمر صافية معتقة، مأدبة لحوم وأمخاخ."]]}, {"l": "Isa 55:1", "n": "", "vs": [[1, "تعالوا أيها العطاش جميعا إلى المياه، وهلموا أيها المعدمون من الفضة، ابتاعوا وكلوا، ابتاعوا خمرا ولبنا مجانا من غير فضة."]]}, {"l": "Isa 55:2", "n": "", "vs": [[2, "لماذا تنفقون الفضة على ما ليس بخبز، وتتعبون لغير شبع؟ أحسنوا الاستماع إلي، وكلوا الشهي ولتتمتع أنفسكم بالدسم."]]}, {"l": "Mat 26:26", "n": "", "vs": [[26, "وبينما كانوا يأكلون، أخذ يسوع رغيفا، وبارك، وكسر وأعطى التلاميذ وقال: «خذوا، كلوا: هذا هو جسدي!»"]]}], "kwAr": "حبك", "noteAr": "بالعبرانية: حُبَّيك (بصيغة الجمع). انظر نش 1: 4؛ 2: 4؛ 4: 10؛ 7: 6، 9، 12؛ 8: 2؛ مز 36: 7؛ 63: 3-5؛ إش 25: 6؛ 55: 1، 2؛ مت 26: 26"}], "arS": [["(المحبوبة): ", []], ["ليلثمني", ["H5401"]], [" ", []], ["بقبلات", ["H4480", "H5390"]], [" ", []], ["فمه", ["H6310"]], ["، ", []], ["لأن", ["H3588"]], [" ", []], ["حبك", ["H1730"]], [" ", []], ["ألذ", ["H2896"]], [" ", []], ["من", ["H4480"]], [" ", []], ["الخمر", ["H3196"]], [".", []]]}, {"c": 1, "v": 3, "text": "رائحة عطورك شذية، واسمك أريج مسكوب؛ لذلك أحبتك العذارى.", "groups": [{"kw": "the savour", "raw": "Son_3:6, Son_4:10, Son_5:5, Son_5:13; Exo_30:23-28; Psa_45:7, Psa_45:8, Psa_133:2; Pro_27:9; Ecc_7:1; Isa_61:3; Joh_12:3; 2Co_2:14-16; Phi_4:18", "note": "", "refs": [{"l": "Son 3:6", "n": "", "vs": [[6, "(نشيد بنات أورشليم): من هذه الصاعدة من القفر كأعمدة من دخان معطرة بالمر واللبان وكل عطور التاجر؟"]]}, {"l": "Son 4:10", "n": "", "vs": [[10, "ما أعذب حبك ياأختي ياعروسي! لكم حبك ألذ من الخمر، وأريج أطيابك أزكى من كل العطور."]]}, {"l": "Son 5:5", "n": "", "vs": [[5, "فنهضت لأفتح له بيدين تقطران مرا، وأصابع تفيض عطرا على مزلاج الباب."]]}, {"l": "Son 5:13", "n": "", "vs": [[13, "خداه كخميلة طيب تفوحان عطرا، وشفتاه كالسوسن تقطران مرا شذيا."]]}, {"l": "Exo 30:23-28", "n": "", "vs": [[23, "خذ لك أطيب العطور: خمس مئة شاقل (نحو ستة كيلو جرامات) من المر النقي السائل، ومئتين وخمسين شاقلا (نحو ثلاثة كيلو جرامات) من القرفة، ومئتين وخمسين شاقلا (نحو ثلاثة كيلو جرامات) من قصب الذريرة."], [24, "وخمس مئة شاقل (نحو ستة كيلو جرامات) من السليخة وهينا (نحو ستة لترات) من زيت الزيتون النقي."], [25, "واصنع منها دهن مسحة مقدسا طيبا شذيا صنعة عطار ماهر، فيكون دهن مسحة مقدسا."], [26, "تمسح به خيمة الاجتماع، وتابوت الشهادة،"], [27, "والمائدة مع كل آنيتها، والمنارة وآنيتها، ومذبح البخور،"], [28, "ومذبح المحرقة وسائر آنيته، والحوض وقاعدته."]]}, {"l": "Psa 45:7", "n": "", "vs": [[7, "أحببت البر وأبغضت الإثم. من أجل ذلك مسحك الله (ملكا) بدهن الابتهاج أكثر من رفقائك (الملوك)."]]}, {"l": "Psa 45:8", "n": "", "vs": [[8, "ثيابك كلها معطرة بالمر ودهن اللبان. من قصور العاج صدحت موسيقى الآلات الوترية فأطربتك."]]}, {"l": "Psa 133:2", "n": "", "vs": [[2, "فذلك مثل زيت المسحة العطر المسكوب على الرأس، النازل على اللحية، على لحية هارون، الجاري إلى أطراف ثوبه،"]]}, {"l": "Pro 27:9", "n": "", "vs": [[9, "الطيب والبخور يفرحان القلب، ومسرة الصديق ناجمة عن المشورة المخلصة."]]}, {"l": "Ecc 7:1", "n": "", "vs": [[1, "الصيت الحسن خير من الطيب، ويوم الوفاة أفضل من يوم الولادة."]]}, {"l": "Isa 61:3", "n": "", "vs": [[3, "لأمنح نائحي صهيون تاج جمال بدل الرماد، ودهن السرور بدل النوح، ورداء تسبيح بدل الروح اليائسة، فيدعون أشجار البر وغرس الرب لكي يتمجد."]]}, {"l": "Joh 12:3", "n": "", "vs": [[3, "فأخذت مريم منا (أي ثلث لتر) من عطر الناردين الخالص الغالي الثمن، ودهنت به قدمي يسوع، ثم مسحتهما بشعرها، فملأت الرائحة الطيبة أرجاء البيت كله."]]}, {"l": "2Co 2:14-16", "n": "", "vs": [[14, "ولكن، شكرا لله الذي يقودنا دائما في موكب النصر في المسيح، وينشر بنا رائحة معرفته في كل مكان."], [15, "فإننا رائحة المسيح الطيبة المرتفعة إلى الله، المنتشرة على السواء عند الذين يخلصون وعند الذين يهلكون:"], [16, "هؤلاء يشمون فيها رائحة من الموت وإلى الموت، وأولئك رائحة من الحياة وإلى الحياة. ومن هو صاحب الكفاءة لتأدية هذه الأمور؟"]]}, {"l": "Phi 4:18", "n": "", "vs": [[18, "فالآن عندي كل ما يسد حاجتي ويزيد عنها. أنا في بحبوحة إذ تسلمت من أبفروديتس ما بعثتم به إلي، عطرا طيب الرائحة، ذبيحة يقبلها الله ويسر بها."]]}], "kwAr": "رائحة عطورك", "noteAr": ""}, {"kw": "thy name", "raw": "Exo_33:12, Exo_33:19, Exo_34:5-7; Psa_89:15, Psa_89:16; Isa_9:6, Isa_9:7; Jer_23:5, Jer_23:6; Mat_1:21-23; Phi_2:9, Phi_2:10", "note": "", "refs": [{"l": "Exo 33:12", "n": "", "vs": [[12, "وقال موسى للرب: «ها أنت قد قلت لي: قد هذا الشعب، ولكن لم تعلمني من سترسل معي. ثم قلت: إني عرفتك باسمك وحظيت برضاي."]]}, {"l": "Exo 33:19", "n": "", "vs": [[19, "فقال الرب: «أجيز إحساناتي أمامك، وأذيع اسمي (الرب) أمامك. أغدق رأفتي على من أشاء ورحمتي على من أريد»،"]]}, {"l": "Exo 34:5-7", "n": "", "vs": [[5, "فنزل بهيئة سحاب، ووقف معه هناك حيث أعلن له اسمه: «الرب»،"], [6, "وعبر من أمام موسى مناديا: «أنا الرب. الرب إله رؤوف رحيم، بطيء الغضب وكثير الإحسان والوفاء."], [7, "أدخر الإحسان وأغفر الإثم والمعصية والخطيئة. ولكني لا أعفي المذنب من العقاب، بل أفتقد إثم الآباء في الأبناء والأحفاد حتى الجيل الرابع»."]]}, {"l": "Psa 89:15", "n": "", "vs": [[15, "طوبى للشعب الذي يستجيب لهتاف البوق فيسلك في نور محياك أيها الرب."]]}, {"l": "Psa 89:16", "n": "", "vs": [[16, "باسمك يبتهجون طول النهار، وببرك يسمون."]]}, {"l": "Isa 9:6", "n": "", "vs": [[6, "لأنه يولد لنا ولد ويعطى لنا ابن يحمل الرياسة على كتفه، ويدعى اسمه عجيبا، مشيرا، إلها قديرا، أبا أبديا، رئيس السلام."]]}, {"l": "Isa 9:7", "n": "", "vs": [[7, "ولا تكون نهاية لنمو رياسته وللسلام اللذين يسودان عرش داود ومملكته، ليثبتها ويعضدها بالحق والبر، من الآن وإلى الأبد. إن غيرة الرب القدير تتمم هذا."]]}, {"l": "Jer 23:5", "n": "", "vs": [[5, "ها أيام مقبلة أقيم فيها لداود ذرية بر، ملكا يسود بحكمة، ويجري في الأرض عدلا وحقا."]]}, {"l": "Jer 23:6", "n": "", "vs": [[6, "في عهده يتم خلاص شعب يهوذا، ويسكن شعب إسرائيل آمنا. أما الاسم الذي سيدعى به فهو: الرب برنا."]]}, {"l": "Mat 1:21-23", "n": "", "vs": [[21, "فستلد ابنا، وأنت تسميه يسوع، لأنه هو الذي يخلص شعبه من خطاياهم»."], [22, "حدث هذا كله ليتم ما قاله الرب بلسان النبي القائل:"], [23, "«ها إن العذراء تحبل، وتلد ابنا، ويدعى عمانوئيل!» أي «الله معنا»."]]}, {"l": "Phi 2:9", "n": "", "vs": [[9, "لذلك أيضا رفعه الله عاليا، وأعطاه الاسم الذي يفوق كل اسم،"]]}, {"l": "Phi 2:10", "n": "", "vs": [[10, "لكي تنحني سجودا لاسم يسوع كل ركبة، سواء في السماء أم على الأرض أم تحت الأرض،"]]}], "kwAr": "اسمك", "noteAr": ""}, {"kw": "the virgins", "raw": "Son_6:8; Psa_45:14; Mat_25:1; 2Co_11:2; Rev_14:4", "note": "", "refs": [{"l": "Son 6:8", "n": "", "vs": [[8, "هناك ستون ملكة وثمانون سرية وعذارى لا يحصى لهن عدد."]]}, {"l": "Psa 45:14", "n": "", "vs": [[14, "تزف إلى الملك بحلل مطرزة، ووصيفاتها العذارى يتبعنها قادمات إليك في موكب حافل."]]}, {"l": "Mat 25:1", "n": "", "vs": [[1, "حينئذ يشبه ملكوت السماوات بعشر عذارى أخذن مصابيحهن وانطلقن لملاقاة العريس."]]}, {"l": "2Co 11:2", "n": "", "vs": [[2, "فإني أغار عليكم غيرة من عند الله لأني خطبتكم لرجل واحد هو المسيح، لأقدمكم إليه عذراء عفيفة."]]}, {"l": "Rev 14:4", "n": "", "vs": [[4, "فهؤلاء لم ينجسوا أنفسهم مع النساء لأنهم أطهار، وهم يتبعون الحمل حيثما ذهب، وقد تم شراؤهم من بين الناس باكورة لله، وللحمل،"]]}], "kwAr": "العذارى", "noteAr": ""}], "arS": [["رائحة", ["H7381"]], [" ", []], ["عطورك", ["H8081"]], [" ", []], ["شذية", ["H2896"]], ["، ", []], ["واسمك", ["H8034"]], [" ", []], ["أريج", ["H8081"]], [" ", []], ["مسكوب", ["H7324"]], ["؛ ", []], ["لذلك", ["H3651"]], [" ", []], ["أحبتك", ["H157"]], [" ", []], ["العذارى", ["H5959"]], [".", []]]}, {"c": 1, "v": 4, "text": "اجذبني وراءك فنجري، أدخلني الملك إلى مخادعه. نبتهج بك ونفرح، ونطري حبك أكثر من الخمر، فالذين أحبوك محقون.", "groups": [{"kw": "Draw", "raw": "Jer_31:3; Hos_11:4; Joh_6:44, Joh_12:32; Phi_2:12, Phi_2:13", "note": "", "refs": [{"l": "Jer 31:3", "n": "", "vs": [[3, "ظهر لي الرب قائلا: «أحببتكم حبا أبديا، لذلك اجتذبتكم إلي برحمة."]]}, {"l": "Hos 11:4", "n": "", "vs": [[4, "قدتهم بحبال اللطف البشرية وبربط المحبة، فكنت لهم كمن يرفع النير عن أعناقهم وينحني بنفسه ليطعمهم."]]}, {"l": "Joh 6:44", "n": "", "vs": [[44, "لا يقدر أحد أن يأتي إلي إلا إذا اجتذبه الآب الذي أرسلني. وأنا أقيمه في اليوم الأخير."]]}, {"l": "Joh 12:32", "n": "", "vs": [[32, "وحين أعلق مرفوعا عن الأرض أجذب إلي الجميع»."]]}, {"l": "Phi 2:12", "n": "", "vs": [[12, "إذن، ياأحبائي، كما كنتم تطيعون دائما، لا كما لو أنني حاضر وحسب، بل بالأحرى كثيرا الآن وأنا غائب، كذلك اسعوا لتحقيق خلاصكم عمليا بخوف وارتعاد،"]]}, {"l": "Phi 2:13", "n": "", "vs": [[13, "لأن الله هو الذي ينشيء فيكم الإرادة والع  "أنتم لم تروا المسيح، ولكنكم تحبونه. ومع أنكم لا ترونه الآن، فأنتم تؤمنون به وتبتهجون بفرح مجيد يفوق الوصف."]]}, {"l": "1Pe 2:7", "n": "", "vs": [[7, "فإن هذا الحجر هو ثمين في نظركم، أنتم المؤمنين به. أما بالنسبة إلى الذين لا يؤمنون، «فالحجر الذي رفضه البناؤون صار هو الحجر الأساسي رأس زاوية البيت»،"]]}], "kwAr": "يامن تحبه نفسي", "noteAr": ""}, {"kw": "thou feedest", "raw": "Gen_37:16; Psa_23:1, Psa_23:2, Psa_80:1; Isa_40:11; Mic_5:4; Joh_10:11, Joh_10:28, Joh_10:29; Rev_7:17", "note": "", "refs": [{"l": "Gen 37:16", "n": "", "vs": [[16, "فأجابه: «أبحث عن إخوتي. أرجوك أن تخبرني أين يرعون مواشيهم؟»"]]}, {"l": "Psa 23:1", "n": "", "vs": [[1, "الرب راعي فلست أحتاج إلى شيء."]]}, {"l": "Psa 23:2", "n": "", "vs": [[2, "في مراع خضراء يربضني، وإلى مياه هادئة يقودني."]]}, {"l": "Psa 80:1", "n": "", "vs": [[1, "اصغ ياراعي إسرائيل، يامن قدت (قوم) يوسف كالقطيع. تجل يامن بنعمتك تجلس على عرشك فوق الكروبيم"]]}, {"l": "Isa 40:11", "n": "", "vs": [[11, "يرعى قطيعه كراع، ويجمع الحملان بذراعه، وفي أحضانه يحملها ويقود المرضعات برفق."]]}, {"l": "Mic 5:4", "n": "", "vs": [[4, "فيقوم ويرعى شعبه بقوة الرب وبجلال اسم الرب إلهه، فيعيشون بأمن، لأن عظمته تمتد إلى أقاصي الأرض."]]}, {"l": "Joh 10:11", "n": "", "vs": [[11, "أنا الراعي الصالح، والراعي الصالح يبذل حياته فدى خرافه."]]}, {"l": "Joh 10:28", "n": "", "vs": [[28, "وأعطيها حياة أبدية، فلا تهلك إلى الأبد، ولا ينتزعها أحد من يدي."]]}, {"l": "Joh 10:29", "n": "", "vs": [[29, "إن الآب الذي أعطاني إياها هو أعظم من الجميع، ولا يقدر أحد أن ينتزع من يد الآب شيئا."]]}, {"l": "Rev 7:17", "n": "", "vs": [[17, "لأن الحمل الذي في وسط العرش يرعاهم ويقودهم إلى ينابيع ماء الحياة، ويمسح الله كل دمعة من عيونهم»."]]}], "kwAr": "ترعى", "noteAr": ""}, {"kw": "for", "raw": "1Sa_12:20, 1Sa_12:21; Psa_28:1; Joh_6:67-69; 1Jo_2:19", "note": "", "refs": [{"l": "1Sa 12:20", "n": "", "vs": [[20, "فقال صموئيل للشعب: «لا تخافوا، فأنتم حقا قد اقترفتم كل هذا الشر، ولكن إياكم أن تحيدوا عن الرب، بل اعبدوه من كل قلوبكم."]]}, {"l": "1Sa 12:21", "n": "", "vs": [[21, "ولا تضلوا وراء الأصنام الباطلة التي لا تفيد ولا تنقذ، لأنه لا طائل منها."]]}, {"l": "Psa 28:1", "n": "", "vs": [[1, "يارب إليك أصرخ، فلا تتصامم عني ياصخرتي، لئلا أكون، إذا سكت عني، مثل المنحدرين إلى الهاوية."]]}, {"l": "Joh 6:67-69", "n": "", "vs": [[67, "فقال للاثني عشر تلميذا: «وأنتم أتريدون أن تذهبوا مثلهم؟»"], [68, "فأجابه سمعان بطرس: «إلى من نذهب يار ب وعندك كلام الحياة الأبدية."], [69, "نحن آمنا وعرفنا أنك قدوس الله!»"]]}, {"l": "1Jo 2:19", "n": "", "vs": [[19, "هؤلاء الدجالون انفصلوا عنا، لكنهم في الواقع لم يكونوا منا. ولو كانوا منا لظلوا معنا. فانفصالهم عنا إذن برهان على أنهم جميعا ليسوا منا."]]}], "kwAr": "فلماذا", "noteAr": ""}, {"kw": "turneth aside", "raw": "or, is veiled, Col_3:14-18", "note": "or, is veiled, Col_3:14-18", "refs": [{"l": "Col 3:14-18", "n": "", "vs": [[14, "وفوق هذا كله البسوا المحبة، فهي رابطة الكمال."], [15, "وليملك في قلوبكم سلام المسيح، فإليه قد دعيتم في الجسد الواحد؛ وكونوا شاكرين!"], [16, "لتسكن كلمة المسيح في داخلكم بغنى، في كل حكمة، معلمين وواعظين بعضكم بعضا، مرنمين بمزامير وتسابيح وأناشيد روحية في قلوبكم لله، رافعين له الحمد."], [17, "ومهما كان ما تعملونه، بالقول أو بالفعل، فليجر كل شيء باسم الرب يسوع، رافعين به الشكر لله الآب."], [18, "أيتها الزوجات اخضعن لأزواجكن كما يليق (بالعيشة) في الرب."]]}], "kwAr": "كامرأة مقنعة", "noteAr": "أو: محجَّبة. انظر كو 3: 14-18"}], "arS": [["قل", ["H5046"]], [" لي يامن ", []], ["تحبه", ["H157"]], [" ", []], ["نفسي", ["H5315"]], ["، ", []], ["أين", ["H349"]], [" ", []], ["ترعى", ["H7462"]], [" قطعانك وأين ", []], ["تربض", ["H7257"]], [" ", []], ["بها", ["H5921"]], [" عند ", []], ["الظهيرة", ["H6672"]], ["؟ ", []], ["فلماذا", ["H4100"]], [" ", []], ["أكون", ["H1961"]], [" كامرأة ", []], ["مقنعة", ["H5844"]], ["، أتجول بجوار ", []], ["قطعان", ["H5739"]], [" ", []], ["أصحابك", ["H2270"]], ["؟", []]]}, {"c": 1, "v": 8, "text": "(المحب): إن كنت لا تعلمين ياأجمل النساء، فاقتفي أثر الغنم، وارعي جداءك عند مساكن الرعاة.", "groups": [{"kw": "O thou", "raw": "Son_1:15, Son_2:10, Son_4:1, Son_4:7, Son_4:10, Son_5:9, Son_6:1, Son_6:4-10, Son_7:1-13; Psa_16:3, Psa_45:11, Psa_45:13; Eph_5:27; Rev_19:7, Rev_19:8", "note": "", "refs": [{"l": "Son 1:15", "n": "", "vs": [[15, "(المحب): كم أنت جميلة ياحبيبتي، كم أنت جميلة! عيناك حمامتان!"]]}, {"l": "Son 2:10", "n": "", "vs": [[10, "خاطبني حبيبي وقال: انهضي ياحبيبتي ياجميلتي وتعالي معي،"]]}, {"l": "Son 4:1", "n": "", "vs": [[1, "(المحب): لشد ما أنت جميلة ياحبيبتي، لشد ما أنت جميلة! عيناك من وراء نقابك كحمامتين، وشعرك لسواده كقطيع معز منحدر من جبل جلعاد."]]}, {"l": "Son 4:7", "n": "", "vs": [[7, "كلك جميلة ياحبيبتي ولا عيب فيك."]]}, {"l": "Son 4:10", "n": "", "vs": [[10, "ما أعذب حبك ياأختي ياعروسي! لكم حبك ألذ من الخمر، وأريج أطيابك أزكى من كل العطور."]]}, {"l": "Son 5:9", "n": "", "vs": [[9, "(بنات أورشليم): بم يفوق حبيبك المحبين أيتها الجميلة بين النساء؟ بم يفوق حبيبك المحبين حتى تستحلفينا هكذا؟"]]}, {"l": "Son 6:1", "n": "", "vs": [[1, "(بنات أورشليم): أين ذهب حبيبك أيتها الجميلة بين النساء؟ إلى أين تحول حبيبك فنبحث عنه معك؟"]]}, {"l": "Son 6:4-10", "n": "", "vs": [[4, "(المحب): أنت جميلة ياحبيبتي كترصة، حسناء كأورشليم، وجليلة كجيش يرفع أعلامه."], [5, "أشيحي بعينيك عني فقد قهرتاني. شعرك كقطيع ماعز منحدر من جلعاد."], [6, "أسنانك في بياضها كقطيع غنم خارج من الاغتسال؛ كل واحدة منها ذات توأم وما فيها عقيم."], [7, "خداك تحت نقابك كفلقتي رمانة."], [8, "هناك ستون ملكة وثمانون سرية وعذارى لا يحصى لهن عدد."], [9, "لكنك ياحمامتي ياكاملتي فريدة، الابنة الوحيدة لأمها، الأعز على من أنجبتها. رأتها العذارى فطوبنها، وشاهدتها الملكات والسراري فأطرينها."], [10, "من هذه الطالعة كالفجر، الجميلة كالبدر، المشرقة كالشمس، الجليلة كجيش يرفع أعلامه؟"]]}, {"l": "Son 7:1-13", "n": "", "vs": [[1, "(المحب): ما أرشق خطوات قدميك بالحذاء يابنت الأمير! فخذاك المستدير تان كجوهرتين صاغتهما يد صانع حاذق."], [2, "سرتك كأس مدورة، لا تحتاج إلى خمرة ممزوجة، وبطنك كومة حنطة مسيجة بالسوسن."], [3, "نهداك كخشفتي ظبية توأمين."], [4, "عنقك (مصقول) كبرج من عاج. عيناك (عميقتان ساكنتان) كبركتي حشبون عند باب بث ربيم. أنفك (شامخ) كبرج لبنان المشرف على دمشق،"], [5, "رأسك كالكرمل، وغدائر شعرك المتهدلة كأرجوان، قد وقع الملك أسير هذه الخصل."], [6, "ما أجملك أيتها الحبيبة وما ألذك بالمسرات!"], [7, "قامتك هذه مثل النخلة، ونهداك مثل العناقيد."], [8, "قلت: لأصعدن إلى النخلة وأمسكن بعذوقها، فيكون لي نهداك كعناقيد الكرم، وعبير أنفاسك كأريج التفاح."], [9, "فمك كأجود الخمر!(المحبوبة): لتكن سائغة لحبيبي، تسيل عذبة على شفاه النائمين."], [10, "أنا لحبيبي، وإلي تشوقه."], [11, "تعال ياحبيبي لنمض إلى الحقل ولنبت في القرى."], [12, "لنخرج مبكرين إلى الكروم، لنرى هل أفرخت الكرمة، وهل تفتحت براعمها، وهل نور الرمان؟ هناك أهبك حبي."], [13, "قد نشر اللفاح أريجه، وتدلت فوق بابنا أفخر الثمار، قديمها وحديثها، التي ادخرتها لك ياحبيبي."]]}, {"l": "Psa 16:3", "n": "", "vs": [[3, "كل بهجتي في قديسي الأرض وأفاضلها."]]}, {"l": "Psa 45:11", "n": "", "vs": [[11, "فيشتهي الملك جمالك، لأنه هو سيدك فاسجدي له."]]}, {"l": "Psa 45:13", "n": "", "vs": [[13, "كلها مجد ابنة الملك في قصرها. ثيابها منسوجة بذهب."]]}, {"l": "Eph 5:27", "n": "", "vs": [[27, "حتى يزفها إلى نفسه كنيسة بهية لا يشوبها عيب أو تجعد أو أية نقيصة مشابهة بل تكون مقدسة خالية من العيوب."]]}, {"l": "Rev 19:7", "n": "", "vs": [[7, "لنفرح ونبتهج ونمجده، فإن عرس الحمل قد حان موعده، وعروسه قد هيأت نفسها،"]]}, {"l": "Rev 19:8", "n": "", "vs": [[8, "ووهب لها أن تلبس الكتان الأبيض الناصع!» والكتان يرمز إلى أعمال الصلاح التي قام بها القديسون."]]}], "kwAr": "ياأجمل النساء", "noteAr": ""}, {"kw": "go", "raw": "Pro_8:34; Jer_6:16; 1Co_11:1; Heb_6:12, 11:4-40, Heb_13:7; Jam_2:21, Jam_2:25; Jam_5:10; 1Pe_3:6", "note": "", "refs": [{"l": "Pro 8:34", "n": "", "vs": [[34, "طوبى للإنسان الذي يستمع إلي، الحريص على السهر عند أبوابي، حارسا قوائم مصاريعي،"]]}, {"l": "Jer 6:16", "n": "", "vs": [[16, "وهذا ما يعلنه الرب: «قفوا في الطرقات وانظروا، واسألوا عن المسالك الصالحة القديمة واطرقوها، فتجدوا راحة لنفوسكم. ولكنكم قلتم: لن نسير فيها."]]}, {"l": "1Co 11:1", "n": "", "vs": [[1, "فاقتدوا بي كما أقتدي أنا بالمسيح!"]]}, {"l": "Heb 6:12", "n": "", "vs": [[12, "وذلك حتى لا تتكاسلوا، بل تقتدوا بالذين يرثون ما وعد الله به، عن طريق الإيمان والصبر."]]}, {"l": "Heb 11:4-40", "n": "", "vs": [[4, "بالإيمان، قدم هابيل لله ذبيحة أفضل من تلك التي قدمها قايين. وعلى ذلك الأساس، شهد الله بأن هابيل بار، إذ قبل التقدمة التي قربها له. ومع أن هابيل مات قتلا، فإنه مازال الآن يلقننا العبر بإيمانه."], [5, "وبالإيمان، انتقل أخنوخ إلى حضرة الله دون أن يموت. وقد اختفى من على هذه الأرض لأن الله أخذه إليه. وقبل حدوث ذلك، شهد له بأنه قد أرضى الله ."], [6, "فمن المستحيل إرضاء الله بدون إيمان. إذ إن من يتقرب إلى الله، لابد له أن يؤمن بأنه موجود، وبأنه يكافيء الذين يسعون إليه."], [7, "وبالإيمان نوح، لما أنذره الله عن طريق الوحي بالطوفان الآتي، دفعه خوف الله إلى بناء سفينة ضخمة كانت وسيلة النجاة له ولعائلته، مع أنه لم يكن قد رأى طوفانا من قبل. وبعمله هذا، حكم على العالم وأصبح وارثا للبر القائم على أساس الإيمان."], [8, "وبالإيمان، لبى إبراهيم دعوة الله، فترك وطنه وانطلق إلى أرض أخرى وعده الله بأن يورثه إياها. ولما خرج من بيته، كان لا يعرف أين يتوجه."], [9, "وبالإيمان، كان يرحل كالغريب من مكان إلى آخر في الأرض التي وعده الله بها، وكأنها أرض غريبة. وكان يسكن في الخيام مع إسحاق ويعقوب، شريكيه في إرث الوعد عينه."], [10, "فإنه كان ينتظر الانتقال إلى المدينة السماوية ذات الأسس الثابتة، التي مهندسها وبانيها هو الله ."], [11, "وبالإيمان أيضا، نالت سارة زوجة إبراهيم قدرة على الإنجاب، فولدت ابنا مع أنها كانت قد جاوزت سن الحمل. وذلك لأنها آمنت بأن الله ، الذي وعدها بذلك، لابد أن يحقق وعده."], [12, "وهكذا ولد من إبراهيم، وقد كان ميتا من حيث القدرة على الإنجاب، شعب كبير «كنجوم الفضاء عددا، وكالرمل الذي على شط البحر، لا يحصى...»"], [13, "هؤلاء جميعا، حافظوا على إيمانهم إلى النهاية. وماتوا قبل أن تتحقق وعود الله لهم في أثناء حياتهم. ولكنهم رأوها من بعيد، وتوقعوا تحقيقها كاملة في المستقبل. وإذ آمنوا بتلك الوعود الإلهية اعترفوا بأنهم ليسوا إلا غرباء على الأرض يزورونها زيارة عابرة."], [14, "والذين يقولون ذلك، يوضحون أن عيونهم على وطنهم الحقيقي."], [15, "ولو كانوا يتذكرون الوطن الأرضي الذي هجروه، لاغتنموا الفرصة وعادوا إليه."], [16, "ولكن، لا ... فهم الآن يتطلعون إلى وطن أفضل، أي الوطن السماوي. بسبب إيمانهم هذا لا يستحي الله أن يدعى إلههم. فهو قد أعد لهم مدينة!"], [17, "وبالإيمان، إبراهيم أيضا، لما امتحنه الله ، قدم إسحاق ابنه. فإنه، إذ قبل وعود الله، قدم ابنه الوحيد ذبيحة،"], [18, "مع أن الله قال له: «بإسحاق سوف يكون لك نسل يحمل اسمك!»"], [19, "فقد آمن إبراهيم بأن الله قادر على إقامة إسحاق من الموت. والواقع أن إبراهيم استعاد ابنه من الموت، على سبيل المثال أو الرمز."], [20, "بالإيمان، بارك إسحاق يعقوب وعيسو."], [21, "وبالإيمان، بارك يعقوب، قبيل موته، كل واحد من ابني يوسف، وسجد متوكئا على رأس عصاه."], [22, "وبالإيمان، استند يوسف على وعد الله بإخراج بني إسرائيل من بلاد مصر، فترك وصية بأن ينقلوا رفاته معهم."], [23, "بالإيمان موسى خبأه والداه حتى صار عمره ثلاثة أشهر، لأنهما رأياه طفلا جميلا، ولم يخافا المرسوم الذي أصدره الملك."], [24, "وبالإيمان، موسى نفسه، لما كبر، رفض أن يدعى ابنا لابنة فرعون."], [25, "بل اختار أن يتحمل المذلة مع شعب الله، بدلا من التمتع الوقتي بلذات الخطيئة."], [26, "فقد اعتبر أن عار المسيح، هو ثروة أعظم من كنوز مصر، لأنه كان يتطلع إلى المكافأة."], [27, "بالإيمان، ترك أرض مصر وهو غير خائف من غضب الملك. فقد مضى في تنفيذ قراره، كأنه يرى بجانبه الله غير المنظور."], [28, "وبالإيمان، أقام الفصح ورش الدم، لكي لا يمس مهلك الأبكار أحدا من أبناء شعبه."], [29, "بالإيمان اجتاز الشعب في البحر الأحمر كأنه أرض يابسة. أما المصريون، فإذ حاولوا ذلك غرقوا!"], [30, "بالإيمان انهارت أسوار مدينة أريحا، بعدما دار الشعب حولها لمدة سبعة أيام."], [31, "وجزاء للإيمان، نجت راحاب الزانية من الموت المحتم مع المتمردين، بعدما استقبلت الجاسوسين بسلام."], [32, "وهل من حاجة بعد لمزيد من الأمثلة؟ إن الوقت لا يتسع لي حتى أسرد أخبار الإيمان عن: جدعون وباراق وشمشون ويفتاح وداود وصموئيل والأنبياء."], [33, "فبالإيمان، تغلب هؤلاء على ممالك الأعداء، وحكموا حكما عادلا ونالوا ما وعدهم به الله . وبه، أطبقوا أفواه الأسود،"], [34, "وأبطلوا قوة النار، ونجوا من الموت قتلا بالسيف. وبه أيضا نالوا القوة بعد ضعف، فصاروا أشداء في المعارك، وردوا جيوشا غريبة على أعقابها."], [35, "وبالإيمان، استرجعت بعض النساء أمواتهن بعدما أعيدوا إلى الحياة. وبه، تحمل كثيرون العذاب والضرب، وماتوا رافضين النجاة لعلمهم أنهم سوف يقومون إلى حياة أفضل."], [36, "وكثيرون غيرهم تحملوا المحاكمات الظالمة تحت الإهانة والجلد، والإلقاء في السجون مقيدين بالسلاسل."], [37, "ومنهم من حوكموا فماتوا رجما بالحجارة، أو نشرا بالمنشار، أو ذبحا بالسيف. وبعضهم، تشردوا متسترين بجلود الغنم والمعزى، يعانون من الحاجة والضيق والظلم،"], [38, "ولم يكن العالم يستحقهم، تائهين في البراري والجبال والمغاور والكهوف."], [39, "إن هؤلاء لم يحصلوا جميعا على تحقيق كل ما وعدهم الله به، مع أنهم حاصلون على شهادة حسنة من جهة الإيمان."], [40, "ولكن الله سبق فأعد لنا ما هو أفضل، وذلك حتى لا يكملوا بمعزل عنا."]]}, {"l": "Heb 13:7", "n": "", "vs": [[7, "اذكروا دائما مرشديكم الذين علموكم كلام الله. تأملوا سيرتهم حتى النهاية، واقتدوا بإيمانهم."]]}, {"l": "Jam 2:21", "n": "", "vs": [[21, "لنأخذ أبانا إبراهيم مثلا: كيف تبرر؟ أليس بأعماله، إذ أصعد ابنه إسحاق على المذبح"]]}, {"l": "Jam 2:25", "n": "", "vs": [[25, "على هذا الأساس أيضا، تبررت راحاب التي كانت زانية: فقد استقبلت الرجلين اللذين أرسلا إليها، وصرفتهما في طريق آخر."]]}, {"l": "Jam 5:10", "n": "", "vs": [[10, "واقتدوا، ياإخوتي، في احتمال الآلام والصبر عليها، بالأنبياء الذين تكلموا باسم الرب."]]}, {"l": "1Pe 3:6", "n": "", "vs": [[6, "فسارة، مثلا، كانت تطيع زوجها إبراهيم وتدعوه «سيدي». والمؤمنات اللواتي يقتدين بها، يثبتن أنهن بنات لها، إذ يتصرفن تصرفا صالحا، فلا يخفن أي تهديد."]]}], "kwAr": "فاقتفي", "noteAr": ""}, {"kw": "feed", "raw": "Joh_21:15", "note": "", "refs": [{"l": "Joh 21:15", "n": "", "vs": [[15, "وبعدما أكلوا سأل يسوع سمعان بطرس: «ياسمعان بن يونا، أتحبني أكثر مما يحبني هؤلاء؟» فأجابه «نعم يارب، أنت تعلم أني أحبك!» فقال له: «أطعم حملاني!»"]]}], "kwAr": "وارعي", "noteAr": ""}], "arS": [["(المحب): ", []], ["إن", ["H518"]], [" كنت ", []], ["لا", ["H3808"]], [" ", []], ["تعلمين", ["H3045"]], [" ", []], ["ياأجمل", ["H3303"]], [" ", []], ["النساء", ["H802"]], ["، ", []], ["فاقتفي", ["H3318"]], [" ", []], ["أثر", ["H6119"]], [" ", []], ["الغنم", ["H6629"]], ["، ", []], ["وارعي", ["H7462"]], [" ", []], ["جداءك", ["H1429"]], [" ", []], ["عند", ["H5921"]], [" ", []], ["مساكن", ["H4908"]], [" ", []], ["الرعاة", ["H7462"]], [".", []]]}, {"c": 1, "v": 9, "text": "إني أشبهك ياحبيبتي بفرس في مركبات فرعون.", "groups": [{"kw": "O my", "raw": "Son_2:2, Son_2:10, Son_2:13, Son_4:1, Son_4:7, Son_5:2, Son_6:4; Joh_15:14, Joh_15:15", "note": "", "refs": [{"l": "Son 2:2", "n": "", "vs": [[2, "(المحب): كسوسنة بين أشواك، هكذا حبيبتي بين البنات."]]}, {"l": "Son 2:10", "n": "", "vs": [[10, "خاطبني حبيبي وقال: انهضي ياحبيبتي ياجميلتي وتعالي معي،"]]}, {"l": "Son 2:13", "n": "", "vs": [[13, "قد أنبتت التينة فجها، ونشرت الكروم المزهرة أريجها، فانهضي ياحبيبتي ياجميلتي وتعالي."]]}, {"l": "Son 4:1", "n": "", "vs": [[1, "(المحب): لشد ما أنت جميلة ياحبيبتي، لشد ما أنت جميلة! عيناك من وراء نقابك كحمامتين، وشعرك لسواده كقطيع معز منحدر من جبل جلعاد."]]}, {"l": "Son 4:7", "n": "", "vs": [[7, "كلك جميلة ياحبيبتي ولا عيب فيك."]]}, {"l": "Son 5:2", "n": "", "vs": [[2, "(المحبوبة): قد نمت ولكن قلبي كان مستيقظا. آه، اسمعوا! ها صوت حبيبي قارعا قائلا: افتحي لي ياأختي، ياحبيبتي، ياحمامتي، ياكاملتي! فإن رأسي قد ابتل من الندى وخصائلي من طل الليل."]]}, {"l": "Son 6:4", "n": "", "vs": [[4, "(المحب): أنت جميلة ياحبيبتي كترصة، حسناء كأورشليم، وجليلة كجيش يرفع أعلامه."]]}, {"l": "Joh 15:14", "n": "", "vs": [[14, "وأنتم أحبائي إن عملتم بما أوصيكم به."]]}, {"l": "Joh 15:15", "n": "", "vs": [[15, "لا أسميكم عبيدا بعد، لأن العبد لا يطلعه سيده على ما يفعله. ولكني قد سميتكم أحباء لأني أطلعتكم على كل ما سمعته من أبي."]]}], "kwAr": "ياحبيبتي", "noteAr": ""}, {"kw": "to a", "raw": "1Ki_10:28; 2Ch_1:14-17; Isa_31:1", "note": "", "refs": [{"l": "1Ki 10:28", "n": "", "vs": [[28, "وقد استوردت خيل سليمان من مصر ومن تقوع، وكان تجار الملك يتسلمونها من تقوع بثمن معين."]]}, {"l": "2Ch 1:14-17", "n": "", "vs": [[14, "وبنى لنفسه قوة تتألف من ألف وأربع مئة مركبة، واثني عشر ألف فارس، وزعها على مدن المركبات، وأبقى بعضا منها معه في أورشليم."], [15, "ولفرط ما توافر من الفضة والذهب في أورشليم، جعل الملك قيمتها كقيمة الحجارة، وأصبح خشب الأرز في قيمة خشب الجميز الذي في الحقل لكثرته."], [16, "وقد استوردت خيول سليمان من مصر، ومن كوي، فكان تجار الملك يشترونها من  التي كان قد وعد بها. وبهذا صار بإمكانكم أن تتخلصوا من الفساد الذي تنشره الشهوة في العالم، وتشتركوا في الطبيعة الإلهية."]]}], "kwAr": "خديك", "noteAr": ""}, {"kw": "thy neck", "raw": "Son_4:9; Gen_41:42; Num_31:50; Pro_1:9; 1Pe_3:4", "note": "", "refs": [{"l": "Son 4:9", "n": "", "vs": [[9, "قد سلبت قلبي، ياأختي ياعروسي! قد سلبت قلبي بنظرة عينيك وقلادة عنقك."]]}, {"l": "Gen 41:42", "n": "", "vs": [[42, "ونزع فرعون خاتمه من يده ووضعه في يد يوسف، وألبسه ثياب كتان فاخرة وطوق عنقه بطوق من ذهب،"]]}, {"l": "Num 31:50", "n": "", "vs": [[50, "لذلك يقدم كل واحد منا قربان الرب في ما وجده من أمتعة ذهب: حجول وأساور وخواتم وأقراط وقلائد للتكفير عن أنفسنا أمام الرب»."]]}, {"l": "Pro 1:9", "n": "", "vs": [[9, "فإنهما إكليل نعمة يتوج رأسك، وقلائد تطوق عنقك."]]}, {"l": "1Pe 3:4", "n": "", "vs": [[4, "وإنما لتعتمد الزينة الداخلية، ليكون قلبها متزينا بروح الوداعة والهدوء. هذه هي الزينة التي لا تفنى، وهي غالية الثمن في نظر الله!"]]}], "kwAr": "عنقك", "noteAr": ""}], "arS": [["ما ", []], ["أجمل", ["H4998"]], [" ", []], ["خديك", ["H3895"]], [" ", []], ["بسموط", ["H8447"]], ["، ", []], ["وعنقك", ["H6677"]], [" ", []], ["بالقلائد", ["H2737"]], [" الذهبية.", []]]}, {"c": 1, "v": 11, "text": "سنصنع لك أقراطا من ذهب مع جمان من فضة.", "groups": [{"kw": "", "raw": "Son_8:9; Gen_1:26; Psa_149:4; Eph_5:25-27; Phi_3:21", "note": "", "refs": [{"l": "Son 8:9", "n": "", "vs": [[9, "لو كانت سورا لبنينا عليه صرحا من فضة، ولو كانت بابا لدعمناه بألواح من أرز."]]}, {"l": "Gen 1:26", "n": "", "vs": [[26, "ثم قال الله : «لنصنع الإنسان على صورتنا، كمثالنا، فيتسلط على سمك البحر، وعلى طير السماء، وعلى الأرض، وعلى كل زاحف يزحف عليها»."]]}, {"l": "Psa 149:4", "n": "", "vs": [[4, "لأن الرب يسر بشعبه، يجمل الودعاء بالخلاص."]]}, {"l": "Eph 5:25-27", "n": "", "vs": [[25, "أيها الأزواج، أحبوا زوجاتكم مثلما أحب المسيح الكنيسة وبذل نفسه لأجلها،"], [26, "لكي يقدسها مطهرا إياها بغسل الماء، بالكلمة،"], [27, "حتى يزفها إلى نفسه كنيسة بهية لا يشوبها عيب أو تجعد أو أية نقيصة مشابهة بل تكون مقدسة خالية من العيوب."]]}, {"l": " وحيد عند الآب، وهو ممتلىء بالنعمة والحق."], [15, "شهد له يوحنا فهتف قائلا: «هذا هو الذي قلت عنه: إن الآتي بعدي متقدم علي، لأنه كان قبل أن أوجد»."], [16, "فمن امتلائه أخذنا جميعنا ونلنا نعمة على نعمة،"], [17, "لأن الشريعة أعطيت على يد موسى، أما النعمة والحق فقد تواجدا بيسوع المسيح."], [18, "ما من أحد رأى الله قط. ولكن الابن الوحيد، الذي في حضن الآب، هو الذي كشف عنه."]]}, {"l": "Joh 3:29-31", "n": "", "vs": [[29, "ومن له العروس، يكون هو العريس! أما صديق العريس، الذي يقف قربه ويسمعه، فيبتهج لفرحه بصوت العريس. وها إن فرحي هذا قد تم."], [30, "فلابد أن يزيد هو وأنقص أنا»"], [31, "إنه هو الآتي من السماء، ولذلك فهو متقدم على الجميع. أما من كان من الأرض، فإنه أرضي ويتكلم كلاما أرضيا. الآتي من السماء متقدم على الجميع،"]]}, {"l": "Heb 1:1-6", "n": "", "vs": [[1, "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."], [2, "أما الآن، في هذا الزمن الأخير، فقد كلمنا بالابن، الذي جعله وارثا لكل شيء، وبه قد خلق الكون كله!"], [3, "إنه ضياء مجد الله وصورة جوهره. حافظ كل ما في الكون بكلمته القديرة. وهو الذي بعدما طهرنا بنفسه من خطايانا،"], [4, "جلس في الأعالي عن يمين الله العظيم. وهكذا، أخذ مكانا أعظم من الملائكة، بما أن الاسم الذي ورثه متفوق جدا على أسماء الملائكة جميعا!"], [5, "فلأي واحد من الملائكة قال الله مرة: «أنت ابني، أنا اليوم ولدتك!» أو قال أيضا: «أنا أكون له أبا، وهو يكون لي ابنا؟»"], [6, "وعندما يعيد الله ابنه البكر إلى العالم، يقول: «ولتسجد له ملائكة الله جميعا!»"]]}, {"l": "Heb 3:1-6", "n": "", "vs": [[1, "إذن، أيها الإخوة القديسون الذين اشتركتم في الدعوة السماوية، تأملوا يسوع: الرسول ورئيس الكهنة في الإيمان الذي نتمسك به."], [2, "فهو أمين لله في المهمة التي عينه لها، كما كان موسى أمينا في القيام بخدمته في بيت الله كله."], [3, "إلا أنه يستحق مجدا أعظم من مجد موسى، كما أن الذي يبني بيتا ينال إكراما ومدحا أكثر مما ينال البيت الذي بناه!"], [4, "طبعا، كل بيت لابد أن يكون له بان، والله نفسه هو باني كل شيء."], [5, "إن موسى كان أمينا في كل بيت الله، ولكن بصفته خادما. وكان ذلك شهادة لما أعلنه الله في ما بعد."], [6, "أما المسيح، فهو أمين بصفته ابنا يترَأس على البيت. وهذا البيت هو نحن المؤمنين، على أن نتمسك بالثقة والافتخار برجائنا تمسكا ثابتا حتى النهاية."]]}, {"l": "Heb 7:23-26", "n": "", "vs": [[23, "فضلا عن هذا، فالكهنة العاديون كانوا يتغيرون دائما، لأن الموت كان يمنع أي واحد منهم من البقاء."], [24, "وأما المسيح، فلأنه حي إلى الأبد، فهو يبقى صاحب كهنوت لا يزول!"], [25, "وهو لذلك قادر دائما أن يحقق الخلاص الكامل للذين يتقربون به إلى الله. فهو، في حضرة الله، حي على الدوام ليتضرع من أجلهم ويحامي عنهم!"], [26, "نعم، هذا هو رئيس الكهنة الذي كنا محتاجين إليه. إنه قدوس، لا عيبة فيه، ولا نجاسة، قد انفصل عن الخاطئين، وارتفع حتى صار أسمى من السماوات."]]}, {"l": "Heb 12:2", "n": "", "vs": [[2, "متطلعين دائما إلى يسوع: رائد إيماننا ومكمله. فهو قد تحمل الموت صلبا، هازئا بما في ذلك من عار، إذ كان ينظر إلى السرور الذي ينتظره، ثم جلس عن يمين عرش الله."]]}], "kwAr": "حبيبي", "noteAr": ""}, {"kw": "I sat", "raw": "etc. Heb. I delighted and sat down, etc. Jdg_9:15, Jdg_9:19, Jdg_9:20; Psa_57:1, Psa_91:1; Isa_4:6, Isa_25:4, Isa_32:2; 1Jo_1:3, 1Jo_1:4", "note": "etc. Heb. I delighted and sat down, etc. Jdg_9:15, Jdg_9:19, Jdg_9:20; Psa_57:1, Psa_91:1; Isa_4:6, Isa_25:4, Isa_32:2; 1Jo_1:3, 1Jo_1:4", "refs": [{"l": "Jdg 9:15", "n": "", "vs": [[15, "فقال العوسج: «إن كنتم حقا تنصبونني عليكم ملكا، فتعالوا واحتموا تحت ظلي، وإلا فإن نارا تندلع من العوسج وتلتهم أرز لبنان»."]]}, {"l": "Jdg 9:19", "n": "", "vs": [[19, "فإن كنتم قد تصرفتم بحق وصواب مع يربعل وأهل بيته في هذا اليوم، فهنيئا لكم بأبيمالك وهنيئا له بكم."]]}, {"l": "Jdg 9:20", "n": "", "vs": [[20, "وإلا فلتندلع نار من أبيمالك وتلتهم أهل شكيم وسكان القلعة، ولتندلع نار من أهل شكيم ومن سكان القلعة وتلتهم أبيمالك»."]]}, {"l": "Psa 57:1", "n": "", "vs": [[1, "ارحمني ياالله ارحمني، لأن بك لاذت نفسي، وبظل جناحيك أحتمي إلى أن تعبر المصائب."]]}, {"l": "Psa 91:1", "n": "", "vs": [[1, "المحتمي بقدس أقداس العلي، في ظل القدير يبيت،"]]}, {"l": "Isa 4:6", "n": "", "vs": [[6, "فتكون مظلة وفيئا تقيها حر النهار، ومعتصما ومخبأ من العاصفة والمطر."]]}, {"l": "Isa 25:4", "n": "", "vs": [[4, "لأنك كنت حصنا للبائس، وملاذا منيعا للمسكين في ضيقه، وملجأ له من العاصفة، وظلا تقيه وهج الحر، لأن نفخة العتاة كسيل يرتطم بحائط."]]}, {"l": "Isa 32:2", "n": "", "vs": [[2, "ويصبح كل إنسان كملاذ من الريح، وكملجاء من العاصفة، أو كجداول ميا ه في صحراء، أو كظل صخرة عظيمة في أرض جدباء."]]}, {"l": "1Jo 1:3", "n": "", "vs": [[3, "فنحن، إذن، نخبركم بما رأيناه وسمعناه، لكي تكونوا شركاءنا. كما أن شركتنا هي مع الآب ومع ابنه يسوع المسيح."]]}, {"l": "1Jo 1:4", "n": "", "vs": [[4, "ونكتب إليكم هذه الأمور لكي يكتمل فرحكم!"]]}], "kwAr": "اشتهيت أن أجلس", "noteAr": "إلخ. بالعبرانية: اشتهيت وجلست، إلخ. انظر قض 9: 15، 19، 20؛ مز 57: 1؛ 91: 1؛ إش 4: 6؛ 25: 4؛ 32: 2؛ 1يو 1: 3، 4"}, {"kw": "his fruit", "raw": "Son_2:5; Gen_3:22-24; Eze_47:12; Rev_22:1, Rev_22:2", "note": "", "refs": [{"l": "Son 2:5", "n": "", "vs": [[5, "أسندوني بأقراص الزبيب، أنعشوني بالتفاح، فإني مريضة حبا."]]}, {"l": "Gen 3:22-24", "n": "", "vs": [[22, "ثم قال الرب الإله: «ها الإنسان قد صار كواحد منا، يميز بين الخير والشر. وقد يمد يده ويتناول من شجرة الحياة ويأكل، فيحيا إلى الأبد»."], [23, "فأخرجه من جنة عدن ليفلح الأرض التي أخذ من ترابها."], [24, "وهكذا طرد الله الإنسان من جنة عدن، وأقام ملائكة الكروبيم وسيفا ناريا متقلبا شرقي الجنة لحراسة الطريق المفضية إلى «شجرة الحياة»."]]}, {"l": "Eze 47:12", "n": "", "vs": [[12, "وتنمو على ضفتيه كل أنواع أشجار الفاكهة التي تؤكل. لا يذبل ورقها ولا ينقطع ثمرها. تحمل أثمارها في كل شهر، لأن مياه النهر تنبع من المقدس، فتكون ثمار أشجاره للأكل وورقها عقاقير للمداواة."]]}, {"l": "Rev 22:1", "n": "", "vs": [[1, "ثم أراني الملاك نهر ماء الحياة صافيا كالبلور، ينبع من عرش الله والحمل"]]}, {"l": "Rev 22:2", "n": "", "vs": [[2, "ويخترق ساحة المدينة، وعلى ضفتيه شجرة الحياة تثمر اثنتي عشرة مرة، كل شهر مرة. وأوراقها دواء يشفي الأمم."]]}], "kwAr": "ثمره", "noteAr": ""}, {"kw": "taste", "raw": "Heb. palate", "note": "Heb. palate", "refs": [], "kwAr": "لحلقي", "noteAr": "بالعبرانية: حنك."}], "arS": [["(المحبوبة): ", []], ["حبيبي", ["H1730"]], [" ", []], ["بين", ["H996"]], [" ", []], ["الفتيان", ["H1121"]], [" ", []], ["كشجرة", ["H6086"]], [" ", []], ["تفاح", ["H8598"]], [" بين أشجار ", []], ["الوعر", ["H3293"]], ["، تحت ", []], ["ظله", ["H6738"]], [" ", []], ["اشتهيت", ["H2530"]], [" أن ", []], ["أجلس", ["H3427"]], ["، ", []], ["وثمره", ["H6529"]], [" ", []], ["حلو", ["H4966"]], [" ", []], ["لحلقي", ["H2441"]], [".", []]]}, {"c": 2, "v": 4, "text": "أتى بي إلى قاعة احتفاله، ورايته فوقي محبة.", "groups": [{"kw": "brought", "raw": "Son_1:4, Son_5:1; Psa_63:2-5, Psa_84:10; Joh_14:21-23; Rev_3:20", "note": "", "refs": [{"l": "Son 1:4", "n": "", "vs": [[4, "اجذبني وراءك فنجري، أدخلني الملك إلى مخادعه. نبتهج بك ونفرح، ونطري حبك أكثر من الخمر، فالذين أحبوك محقون."]]}, {"l": "Son 5:1", "n": "", "vs": [[1, "(المحب): قد جئت إلى جنتي ياأختي، ياعروسي، وقطفت مري مع أطيابي، وأكلت شهدي مع عسلي، وشربت خمري مع لبني.(بنات أورشليم): كلوا أيها الخلان. اشربوا حتى الانتشاء أيها المحبون."]]}, {"l": "Psa 63:2-5", "n": "", "vs": [[2, "حتى أعاين قدرتك ومجدك، مثلما رأيتك في موضعك المقدس."], [3, "لأن رحمتك خير من الحياة، لذلك تسبحك شفتاي."], [4, "أحمدك على بركاتك مدى حياتي، وباسمك أرفع يدي مبتهلا."], [5, "تشبع نفسي كأنها أكلت من الشحم والدسم، ويسبحك فمي بشفتين مبتهجتين"]]}, {"l": "Psa 84:10", "n": "", "vs": [[10, "إن يوما واحدا أقضيه داخل ديارك خير من ألف يوم خارجها. اخترت أن أكون بوابا في بيت إلهي على السكن في خيام الأشرار."]]}, {"l": "Joh 14:21-23", "n": "", "vs": [[21, "من كانت عنده وصاياي، ويعمل بها، فذاك يحبني. والذي يحبني، يحبه أبي، وأنا أحبه وأعلن له ذاتي»."], [22, "فسأله يهوذا، غير الإسخريوطي: «ياسيد، ماذا جرى حتى تعلن لنا ذاتك ولا تعلنها للعالم؟»"], [23, "أجابه يسوع: «من يحبني يعمل بكلمتي، ويحبه أبي، وإليه نأتي، وعنده نجعل لنا منزلا."]]}, {"l": "Rev 3:20", "n": "", "vs": [[20, "ها أنا واقف خارج الباب أقرعه. إن سمع أحد صوتي وفتح الباب، أدخل إليه فأتعشى معه وهو معي."]]}], "kwAr": "أتى بي", "noteAr": ""}, {"kw": "banqueting house", "raw": "Heb. house of wine, Son_1:1, Son_1:4; Est_7:7", "note": "Heb. house of wine, Son_1:1, Son_1:4; Est_7:7", "refs": [{"l": "Son 1:1", "n": "", "vs": [[1, "هذا نشيد الأناشيد لسليمان."]]}, {"l": "Son 1:4", "n": "", "vs": [[4, "اجذبني وراءك فنجري، أدخلني الملك إلى مخادعه. نبتهج بك ونفرح، ونطري حبك أكثر من الخمر، فالذين أحبوك محقون."]]}, {"l": "Est 7:7", "n": "", "vs": [[7, "فارتاع هامان أمام الملك والملكة. وانصرف الملك عن الشرب مغتاظا، ومضى إلى حديقة القصر. ووقف هامان يتوسل إلى أستير الملكة حفاظا على حياته، لأنه أدرك أن الملك قد قرر مصيره الرهيب."]]}], "kwAr": "قاعة احتفاله", "noteAr": "بالعبرانية: بيت الخمر. انظر نش 1: 1، 4؛ أس 7: 7"}, {"kw": "his banner", "raw": "Son_6:4; Job_1:10; Psa_60:4; Isa_11:10; Joh_15:9-15; Rom_5:8-10, Rom_8:28-39", "note": "", "refs": [{"l": "Son 6:4", "n": "", "vs": [[4, "(المحب): أنت جميلة ياحبيبتي كترصة، حسناء كأورشليم، وجليلة كجيش يرفع أعلامه."]]}, {"l": "Job 1:10", "n": "", "vs": [[10, "ألم تسيج حوله وحول بيته وحول كل ما يملك. لقد باركت كل ما يقوم به من أعمال، فملأت مواشيه الأرض."]]}, {"l": "Psa 60:4", "n": "", "vs": [[4, "أعطيت خائفيك راية ترفع لأجل الحق."]]}, {"l": "Isa 11:10", "n": "", "vs": [[10, "في ذلك اليوم ينتصب أصل يسى راية للأمم، وإليه تسعى جميع الشعوب، ويكون مسكنه مجيدا."]]}, {"l": "Joh 15:9-15", "n": "", "vs": [[9, "مثلما أحبني الآب، أحببتكم أنا، فاثبتوا في محبتي."], [10, "إن عملتم بوصاياي، تثبتون في محبتي، كما عملت أنا بوصايا أبي وأثبت في محبته!"], [11, "قلت لكم هذا ليكون فيكم فرحي، ويكون فرحكم كاملا."], [12, "وصيتي لكم هي هذه: أن يحب بعضكم بعضا كما أنا أحببتكم."], [13, "ليس لأحد محبة أعظم من هذه: أن يبذل أحد حياته فدى أحبائه."], [14, "وأنتم أحبائي إن عملتم بما أوصيكم به."], [15, "لا أسميكم عبيدا بعد، لأن العبد لا يطلعه سيده على ما يفعله. ولكني قد سميتكم أحباء لأني أطلعتكم على كل ما سمعته من أبي."]]}, {"l": "Rom 5:8-10", "n": "", "vs": [[8, "ولكن الله أثبت لنا محبته، إذ ونحن مازلنا خاطئين مات المسيح عوضا عنا."], [9, "ومادمنا الآن قد تبررنا بدمه، فكم بالأحرى نخلص به من الغضب الآتي!"], [10, "فإن كنا، ونحن أعداء، قد تصالحنا مع الله بموت ابنه، فكم بالأحرى نخلص بحياته ونحن مصالحون!"]]}, {"l": "Rom 8:28-39", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."], [29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."], [30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."], [31, "فبعد هذا، ماذا نقول؟ مادام الله معنا، فمن يكون علينا؟ ذاك الذي لم يمسك عنا ابنه،"], [32, "بل بذله لأجلنا جميعا، كيف لا يجود علينا معه بكل شيء أيضا؟"], [33, "ومن سيتهم مختاري الله؟ إن الله هو الذي يبرر،"], [34, "فمن ذا يدين؟ إنه المسيح يسوع هو الذي مات، بل بالأحرى قام، وهو أيضا عن يمين الله، وهو يشفع فينا أيضا."], [35, "فمن سيفصلنا عن محبة المسيح لنا؟ هل الشدة أم الضيق أم الاضطهاد أم الجوع أم العري أم الخطر أم السيف؟"], [36, "بل كما قد كتب: «إننا من أجلك نعاني الموت طول النهار. قد حسبنا كأننا غنم للذبح!»"], [37, "ولكننا، في جميع هذه الأمور، نحرز ما يفوق الانتصار على يد من أحبنا."], [38, "فإني لعلى يقين بأنه لا الموت ولا الحياة، ولا الملائكة ولا الرياسات، ولا الأمور الحاضرة ولا الآتية، ولا القوات،"], [39, "ولا الأعالي ولا الأعماق، ولا خليقة أخرى، تقدر أن تفصلنا عن محبة الله التي لنا في المسيح يسوع ربنا."]]}], "kwAr": "رايته", "noteAr": ""}], "arS": [["أتى", ["H935"]], [" ", []], ["بي", ["H413"]], [" ", []], ["إلى", ["H5921"]], [" ", []], ["قاعة", ["H1004"]], [" احتفاله، ", []], ["ورايته", ["H1714"]], [" فوقي ", []], ["محبة", ["H160"]], [".", []]]}, {"c": 2, "v": 5, "text": "أسندوني بأقراص الزبيب، أنعشوني بالتفاح، فإني مريضة حبا.", "groups": [{"kw": "Stay", "raw": "Psa_4:6, Psa_4:7, Psa_42:1, Psa_42:2, Psa_63:1-3, Psa_63:8; Isa_26:8, Isa_26:9; Luk_24:32; Phi_1:23", "note": "", "refs": [{"l": "Psa 4:6", "n": "", "vs": [[6, "ما أكثر المتسائلين: «من يرينا خيرا؟» أشرق علينا أيها الرب بنور وجهك."]]}, {"l": "Psa 4:7", "n": "", "vs": [[7, "غرست في قلبي فرحا أعظم من فرح من امتلأت بيوتهم وأجرانهم بالحنطة والخمر الجديدة."]]}, {"l": "Psa 42:1", "n": "", "vs": [[1, "مثلما تشتاق الغزلان إلى جداول المياه، هكذا تشتاق نفسي إليك ياالله ."]]}, {"l": "Psa 42:2", "n": "", "vs": [[2, "نفسي عطشى إلى الله الإله الحي، فمتى أجيء وأمثل أمام الله؟"]]}, {"l": "Psa 63:1-3", "n": "", "vs": [[1, "ياالله أنت إلهي وإياك أطلب باكرا. عطشت إليك نفسي ويشتاق إليك جسمي في أرض قاحلة يابسة لا ماء فيها."], [2, "حتى أعاين قدرتك ومجدك، مثلما رأيتك في موضعك المقدس."], [3, "لأن رحمتك خير من الحياة، لذلك تسبحك شفتاي."]]}, {"l": "Psa 63:8", "n": "", "vs": [[8, "تتعلق نفسي بك. يمينك تدعمني"]]}, {"l": "Isa 26:8", "n": "", "vs": [[8, "انتظرناك يارب بشوق في طريق أحكامك. تتوق النفس إلى اسمك وتشتهي ذكرك."]]}, {"l": "Isa 26:9", "n": "", "vs": [[9, "تتوق إليك نفسي في الليل، وفي الصباح تشتاق إليك روحي. عندما تسود أحكامك في الأرض يتعلم أهلها العدل."]]}, {"l": "Luk 24:32", "n": "", "vs": [[32, "فقال أحدهما للآخر: «أما كان قلبنا يلتهب في صدورنا فيما كان يحدثنا في الطريق ويشرح لنا الكتب؟»"]]}, {"l": "Phi 1:23", "n": "", "vs": [[23, "فأنا تحت ضغط من كليهما: إذ إني راغب في أن أرحل وأقيم مع المسيح، وهذا أفضل بكثير جدا؛"]]}], "kwAr": "أسندوني", "noteAr": ""}, {"kw": "flagons", "raw": "2Sa_6:19; Hos_3:1", "note": "", "refs": [{"l": "2Sa 6:19", "n": "", "vs": [[19, "ووزع على كل واحد من الإسرائيليين، رجالا ونساء، رغيف خبز وكأس خمر وقرص زبيب، ثم توجه كل واحد إلى بيته."]]}, {"l": "Hos 3:1", "n": "", "vs": [[1, "ثم قال لي الرب: «اذهب ثانية وأحبب امرأة عشيقة آخر، زانية، أحببها كمحبة الرب لشعبه إسرائيل، على الرغم من ضلالهم وراء آلهة أخرى، وولعهم بتقديم قرابين الزبيب لهم."]]}], "kwAr": "أقراص الزبيب", "noteAr": ""}, {"kw": "comfort me", "raw": "Heb. straw me", "note": "Heb. straw me", "refs": [], "kwAr": "أنعشوني", "noteAr": "بالعبرانية: افرشوا لي القش."}, {"kw": "for", "raw": "Son_5:8; 2Sa_13:1, 2Sa_13:2; Psa_119:130, Psa_119:131", "note": "", "refs": [{"l": "Son 5:8", "n": "", "vs": [[8, "أستحلفكن يابنات أورشليم إن وجدتن حبيبي أن تبلغنه أني مريضة حبا."]]}, {"l": "2Sa 13:1", "n": "", "vs": [[1, "وكان لأبشالوم بن داود أخت جميلة تدعى ثامار، فأحبها أخوها غير الشقيق أمنون."]]}, {"l": "2Sa 13:2", "n": "", "vs": [[2, "وعانى أمنون من سقم الحب، لأن ثامار أخته كانت عذراء وتعذر عليه تحقيق مأربه منها."]]}, {"l": "Psa 119:130", "n": "", "vs": [[130, "فتح كلامك ينير الذهن، ويهب البسطاء فهما."]]}, {"l": "Psa 119:131", "n": "", "vs": [[131, "فغرت فمي لاهثا اشتياقا إلى وصاياك."]]}], "kwAr": "فإني", "noteAr": ""}], "arS": [["أسندوني", ["H5564"]], [" ", []], ["بأقراص", ["H809"]], [" الزبيب، ", []], ["أنعشوني", ["H7502"]], [" ", []], ["بالتفاح", ["H8598"]], ["، ", []], ["فإني", ["H3588", "H589"]], [" ", []], ["مريضة", ["H2470"]], [" ", []], ["حبا", ["H160"]], [".", []]]}, {"c": 2, "v": 6, "text": "شماله تحت رأسي، ويمينه تعانقني.", "groups": [{"kw": "", "raw": "Son_8:3-5; Isa_54:5-10, Isa_62:4, Isa_62:5; Jer_32:41; Zep_3:17; Joh_3:29; Eph_5:25-29", "note": "", "refs": [{"l": "Son 8:3-5", "n": "", "vs": [[3, "شماله تحت رأسي، ويمينه تعانقني."], [4, "أستحلفكن يابنات أورشليم ألا توقظن ولا تنبهن الحبيب حتى يشاء."], [5, "(بنات أورشليم): من هذه الصاعدة من القفر متكئة على حبيبها؟(المحب): تحت شجرة التفاح حيث حبلت بك أمك، وحيث تمخضت بك وأنجبتك، أيقظت فيك أشواقك."]]}, {"l": "Isa 54:5-10", "n": "", "vs": [[5, "لأن صانعك هو بعلك، والرب القدير اسمه، وفاديك هو قدوس إسرائيل الذي يدعى إله كل الأرض."], [6, "قد دعاك الرب كزوجة مهجورة مكروبة الروح، كزوجة عهد الصبا المنبوذة، يقول الرب."], [7, "لقد هجرتك لحظة، ولكني بمراحم كثيرة أجمعك."], [8, "في لحظة غضب جامح حجبت وجهي عنك، ولكني بحب أبدي أرحمك، يقول الرب فاديك."], [9, "لأن هذا الأمر نظير أيام نوح، حين أقسمت أن لا تعود مياه طوفان تفيض على الأرض، كذلك أقسمت أن لا أغضب عليك أو أزجرك."], [10, "إن الجبال تزول والتلال تتزحزح، أما رحمتي الثابتة فلا تفارقك، وعهد سلامي لا يتزعزع، يقول الرب راحمك."]]}, {"l": "Isa 62:4", "n": "", "vs": [[4, "ولا تعودين تدعين بالمهجورة، ولا يقال لأرضك من بعد خربة، بل تدعين «حفصيبة» (أي مسرتي بها)، وأرضك تدعى ذات بعل، لأن الرب يسر بك، وأرضك تصبح ذات بعل."]]}, {"l": "Isa 62:5", "n": "", "vs": [[5, "فكما يتزوج الشاب عذراء هكذا يتزوجك أبناؤك، وكما يفرح العريس بعروسه هكذا يبتهج الرب بك."]]}, {"l": "Jer 32:41", "n": "", "vs": [[41, "وأسر بالإحسان إليهم، وأغرسهم في هذه الأرض بالحق من كل قلبي ونفسي."]]}, {"l": "Zep 3:17", "n": "", "vs": [[17, "فالرب إلهك في وسطك، جب  لإلهنا."]]}, {"l": "Isa 40:4", "n": "", "vs": [[4, "كل واد يرتفع، وكل تل ينخفض. وتمهد كل أرض معوجة وتعبد كل بقعة وعرة"]]}, {"l": "Isa 44:23", "n": "", "vs": [[23, "ترنمي أيتها السماوات لأن الرب قد أنجز فعله. اهتفي ياأعماق الأرض، وتفجري غناء ياجبال وياغابات وكل ما فيها من شجر، لأن الرب قد افتدى يعقوب وتمجد في إسرائيل."]]}, {"l": "Isa 49:11-13", "n": "", "vs": [[11, "وأجعل كل جبالي سبيلا، وطرقي ترتفع."], [12, "انظروا، ها هم يقبلون من ديار بعيدة، هؤلاء من الشمال والغرب، وهؤلاء من أرض سينيم."], [13, "فاهتفي فرحا أيتها السماوات، وابتهجي أيتها الأرض، وأشيدي بالترنيم أيتها الجبال، لأن الرب عزى شعبه ورأف ببائسيه."]]}, {"l": "Isa 55:12", "n": "", "vs": [[12, "لأنكم ستتركون بابل بفرح وسلام فتترنم الجبال والتلال أمامكم بهجة وتصفق أشجار الحقل بأيديها غبطة،"]]}, {"l": "Isa 55:13", "n": "", "vs": [[13, "وحيث كان الشوك والقراص، تنمو أشجار السرو والآس: فيكون ذلك تخليدا لاسم الرب وعلامة أبدية لا تمحى."]]}, {"l": "Luk 3:4-6", "n": "", "vs": [[4, "كما كتب في كتاب أقوال النبي إشعياء: «صوت مناد في البرية: أعدوا طريق الرب واجعلوا سبله مستقيمة."], [5, "كل واد سيردم، وكل جبل وتل سيخفض، وتصير الأماكن الملتوية مستقيمة والأماكن الوعرة طرقا مستوية،"], [6, "فيبصر كل بشر الخلاص الإلهي! »"]]}], "kwAr": "الجبال", "noteAr": ""}], "arS": [["هذا", ["H2088"]], [" ", []], ["صوت", ["H6963"]], [" ", []], ["حبيبي", ["H1730"]], ["! ", []], ["ها", ["H2009"]], [" هو ", []], ["آت", ["H935"]], [" ", []], ["طافرا", ["H1801"]], [" ", []], ["على", ["H5921"]], [" ", []], ["الجبال", ["H2022"]], [" ", []], ["واثبا", ["H7092"]], [" ", []], ["فوق", ["H5921"]], [" ", []], ["التلال", ["H1389"]], [".", []]]}, {"c": 2, "v": 9, "text": "حبيبي كظبي أو كالأيل الفتي. ها هو واقف وراء جدارنا يرنو من الكوى ويسترق النظر من خلال النوافذ المشبكة.", "groups": [{"kw": "like", "raw": "Son_2:17, Son_8:14", "note": "", "refs": [{"l": "Son 2:17", "n": "", "vs": [[17, "إلى أن ينبلج النهار وتنهزم الظلال، ارجع ياحبيبي وكن كالظبي أو الأيل الفتي على جبال الأطياب."]]}, {"l": "Son 8:14", "n": "", "vs": [[14, "(المحبوبة): أسرع إلي كالهارب ياحبيبي، وكن كالظبي أو الأيل الفتي على جبال الأطياب!"]]}], "kwAr": "كظبي", "noteAr": ""}, {"kw": "he standeth", "raw": "1Co_13:12; 2Co_3:13-18; Eph_2:14, Eph_2:15; Col_2:17; Heb_9:8, Heb_9:9; Heb_10:1, Heb_10:19, Heb_10:20", "note": "", "refs": [{"l": "1Co 13:12", "n": "", "vs": [[12, "ونحن الآن ننظر إلى الأمور من خلال زجاج قاتم فنراها بغموض. إلا أننا سنراها أخيرا مواجهة. الآن، أعرف معرفة جزئية. ولكني، عندئذ، سأعرف مثلما عرفت."]]}, {"l": "2Co 3:13-18", "n": "", "vs": [[13, "ولسنا كموسى الذي وضع حجابا على وجهه لكي لا يثبت بنو إسرائيل أنظارهم على نهاية الزائل."], [14, "ولكن أذهانهم قد أعميت، لأن ذلك الحجاب مازال مسدلا حتى اليوم عندما يقرأ العهد القديم، وهو لايزال إلا في المسيح"], [15, "غير أن ذلك الحجاب مازال حتى اليوم موضوعا على قلوبهم عندما يقرأ كتاب موسى."], [16, "ولكن عندما ترجع قلوبهم إلى الرب، ينزع الحجاب."], [17, "فإن الرب هو الروح، وحيث يكون روح الرب، فهناك الحرية."], [18, "ونحن جميعا فيما ننظر إلى مجد الرب بوجوه كالمرآة لا حجاب عليها، نتجلى من مجد إلى مجد لنشابه الصورة الواحدة عينها، وذلك بفعل الرب الروح."]]}, {"l": "Eph 2:14", "n": "", "vs": [[14, "فإنه هو سلامنا، ذاك الذي جعل الفريقين واحدا وهدم حائط الحاجز الفاصل بينهما،"]]}, {"l": "Eph 2:15", "n": "", "vs": [[15, "أي العداء: إذ أبطل بجسده شريعة الوصايا ذات الفرائض، لكي يكون من الفريقين إنسانا واحدا جديدا، إذ أحل السلام بينهما،"]]}, {"l": "Col 2:17", "n": "", "vs": [[17, "فهذه كانت ظلالا لما سيأتي، أي للحقيقة التي هي المسيح."]]}, {"l": "Heb 9:8", "n": "", "vs": [[8, "وبهذا، يشير الروح القدس إلى أن الطريق المؤدية إلى «قدس الأقداس» الحقيقي في السماء، كانت غير مفتوحة بعد. ذلك لأن المسكن الأول مازال قائما."]]}, {"l": "Heb 9:9", "n": "", "vs": [[9, "وما هذا إلا صورة للوقت الحاضر الذي فيه مازالت التقدمات والذبائح تقرب وفقا لنظام العهد العتيق. ولكنها لا تستطيع أن تطهر قلوب الذين يتقربون بها إلى الله، ولا أن توصلهم إلى الكمال فتريح ضمائرهم."]]}, {"l": "Heb 10:1", "n": "", "vs": [[1, "فقد كانت شريعة موسى تتضمن ظلا واهيا للخيرات التي سيأتي بها المسيح، ولم تكن لتصور الحقيقة كما هي. ولذلك، لم تكن قادرة أن توصل إلى الكمال أولئك الذين يتقربون بها إلى الله، مقدمين دائما الذبائح السنوية عينها،"]]}, {"l": "Heb 10:19", "n": "", "vs": [[19, "فلنا الآن، أيها الإخوة حق التقدم بثقة إلى «قدس الأقداس» (في السماء) بدم يسوع."]]}, {"l": "Heb 10:20", "n": "", "vs": [[20, "وذلك بسلوك هذا الطريق الحي الجديد الذي شقه لنا المسيح بتمزيق الحجاب، أي جسده."]]}], "kwAr": "واقف", "noteAr": ""}, {"kw": "showing", "raw": "Heb. flourishing, Luk_24:35; Joh_5:39, Joh_5:46, Joh_12:41; 1Pe_1:10-12; Rev_19:10", "note": "Heb. flourishing, Luk_24:35; Joh_5:39, Joh_5:46, Joh_12:41; 1Pe_1:10-12; Rev_19:10", "refs": [{"l": "Luk 24:35", "n": "", "vs": [[35, "فأخبراهم بما حدث في الطريق، وكيف عرفا الرب عند كسر الخبز."]]}, {"l": "Joh 5:39", "n": "", "vs": [[39, "أنتم تدرسون الكتب لأنكم تعتقدون أنها ستهديكم إلى الحياة الأبدية. هذه الكتب تشهد لي،"]]}, {"l": "Joh 5:46", "n": "", "vs": [[46, "فلو كنتم صدقتم موسى، لكنتم صدقتموني، لأنه هو كتب عني."]]}, {"l": "Joh 12:41", "n": "", "vs": [[41, "وقد قال إشعياء هذا عندما رأى مجد الرب فتحدث عنه."]]}, {"l": "1Pe 1:10-12", "n": "", "vs": [[10, "وكم فتش الأنبياء قديما وبحثوا عن هذا الخلاص! فهم تنبأوا عن نعمة الله التي كان قد أعدها لكم أنتم،"], [11, "واجتهدوا لمعرفة الزمان والأحوال التي كان يشير إليها روح المسيح الذي كان عاملا فيهم، عندما شهد لهم مسبقا بما ينتظر المسيح من آلام، وبما يأتي بعدها من أمجاد."], [12, "ولكن الله أوحى إليهم أن اجتهادهم لم يكن لمصلحتهم هم، بل لمصلحتكم أنتم. فقد كان ذلك من أجل البشارة التي نقلها إليكم في الزمان الحاضر مبشرون يؤيدهم الروح القدس المرسل من السماء. ويالها من أمور يتمنى حتى الملائكة أن يطلعوا عليها!"]]}, {"l": "Rev 19:10", "n": "", "vs": [[10, "فجثوت عند قدميه لأسجد له، فقال لي: «لا تفعل! إني عبد لله، مثلك ومثل إخوتك المؤمنين الذين لديهم الشهادة المختصة بيسوع: لله اسجد! فإن الشهادة المختصة بيسوع هي روح النبوءة»."]]}], "kwAr": "يسترق النظر", "noteAr": "بالعبرانية: مُزهِر. انظر لو 24: 35؛ يو 5: 39، 46؛ 12: 41؛ 1بط 1: 10-12؛ رؤ 19: 10"}], "arS": [["حبيبي", ["H1730"]], [" ", []], ["كظبي", ["H1819", "H6643"]], [" ", []], ["أو", ["H176"]], [" ", []], ["كالأيل",
