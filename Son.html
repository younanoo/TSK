raw": "Ecc_3:4, Ecc_3:11; Isa_12:1, Isa_12:2, Isa_40:2, Isa_54:6-8, Isa_60:1, Isa_60:2; Mat_5:4; Eph_5:8; Rev_11:14, Rev_11:15", "note": "", "refs": [{"l": "Ecc 3:4", "n": "", "vs": [[4, "للبكاء وقت وللضحك وقت. للنوح وقت وللرقص وقت."]]}, {"l": "Ecc 3:11", "n": "", "vs": [[11, "إذ صنع كل شيء حسنا في حينه وغرس الأبدية في قلوب البشر، ومع ذلك لم يدركوا أعمال الله من البداية إلى النهاية."]]}, {"l": "Isa 12:1", "n": "", "vs": [[1, "وتقول في ذلك اليوم: «أحمدك يارب، لأنك وإن غضبت علي، فإن غضبك يرتد عني وتعزيني."]]}, {"l": "Isa 12:2", "n": "", "vs": [[2, "ها إن الله خلاصي فأطمئن ولا أرتعد، لأن الرب الله هو قوتي وترنيمتي وقد أصبح لي خلاصا»."]]}, {"l": "Isa 40:2", "n": "", "vs": [[2, "طيبوا خاطر أورشليم وبلغوها أن أيام محنتها قد انتهت، وإثمها قد غفر، وتلقت من يد الرب ضعفين عن جميع ما ارتكبته من خطايا»."]]}, {"l": "Isa 54:6-8", "n": "", "vs": [[6, "قد دعاك الرب كزوجة مهجورة مكروبة الروح، كزوجة عهد الصبا المنبوذة، يقول الرب."], [7, "لقد هجرتك لحظة، ولكني بمراحم كثيرة أجمعك."], [8, "في لحظة غضب جامح حجبت وجهي عنك، ولكني بحب أبدي أرحمك، يقول الرب فاديك."]]}, {"l": "Isa 60:1", "n": "", "vs": [[1, "قومي استضيئي، فإن نورك قد جاء، ومجد الرب أشرق عليك."]]}, {"l": "Isa 60:2", "n": "", "vs": [[2, "ها إن الظلمة تغمر الأرض، والليل الدامس يكتنف الشعوب، ولكن الرب يشرق عليك، ويتجلى مجده حولك،"]]}, {"l": "Mat 5:4", "n": "", "vs": [[4, "طوبى للحزانى، فإنهم سيعزون."]]}, {"l": "Eph 5:8", "n": "", "vs": [[8, "فقد كنتم في الماضي ظلاما، ولكنكم الآن نور في الرب. فاسلكوا سلوك أولاد النور."]]}, {"l": "Rev 11:14", "n": "", "vs": [[14, "انقضى الويل الثاني، وها هو الثالث يأتي سريعا!"]]}, {"l": "Rev 11:15", "n": "", "vs": [[15, "ونفخ الملاك السابع في بوقه فسمعت أصوات عالية في السماء تقول: «قد صار ملك العالم لربنا ومسيحه. إنه يملك إلى أبد الآبدين»."]]}], "kwAr": "", "noteAr": ""}], "arS": [["فها", ["H2009", "H3588"]], [" ", []], ["الشتاء", ["H5638"]], [" قد ", []], ["انقضى", ["H5674", "H2498"]], ["، وكف ", []], ["المطر", ["H1653"]], [" ", []], ["وزال", ["H1980"]], [".", []]]}, {"c": 2, "v": 12, "text": "وأزهرت الأرض، وحل موسم التغريد، وتردد هديل اليمام في أرضنا.", "groups": [{"kw": "flowers", "raw": "Son_6:2, Son_6:11; Isa_35:1, Isa_35:2; Hos_14:5-7", "note": "", "refs": [{"l": "Son 6:2", "n": "", "vs": [[2, "(المحبوبة): قد انطلق حبيبي إلى جنته، إلى خمائل الأطياب ليرعى في الروضات ويقطف السوسن."]]}, {"l": "Son 6:11", "n": "", "vs": [[11, "(المحبوبة): نزلت إلى حديقة الجوز لأرى ثمر الوادي الجديد، وأنظر هل أزهر الكرم ونور الرمان؟"]]}, {"l": "Isa 35:1", "n": "", "vs": [[1, "ستفرح الصحراء والقفر الأجرد، وتبتهج البرية وتزهر كالورد."]]}, {"l": "Isa 35:2", "n": "", "vs": [[2, "تزدهر ازدهارا، وتبتهج أشد بهجة ويضفى عليها مجد لبنان وجلال الكرمل وشارون ويشهدون مجد الرب وبهاء إلهنا."]]}, {"l": "Hos 14:5-7", "n": "", "vs": [[5, "وأكون كالطل لإسرائيل، فيزهر كالسوسن، وتتأصل جذوره كأرز لبنان."], [6, "تمتد أغصانه ويصير جماله كشجرة الزيتون وشذاه كأرز لبنان."], [7, "ويعودون ويقيمون في ظله ويزدهرون كالحنطة، ويزهرون كالكرمة، ويذيع ذكرهم كخمر لبنان."]]}], "kwAr": "أزهرت الأرض", "noteAr": ""}, {"kw": "time", "raw": "Psa_40:1-3, Psa_89:15, Psa_148:7-13; Isa_42:10-12, Isa_55:12; Eph_5:18-20; Col_3:16", "note": "", "refs": [{"l": "Psa 40:1-3", "n": "", "vs": [[1, "انتظرت الرب صابرا، فالتفت إلي وسمع صراخ استغاثتي،"], [2, "وانتشلني من هوة الهلاك، من طين المستنقع. وأوقف قدمي على أرض صخرية، فصرت أمشي بخطوات ثابتة."], [3, "وضع في فمي ترنيمة جديدة، قصيدة تسبيح لإلهنا. يرى ذلك كثيرون فيخافون الرب."]]}, {"l": "Psa 89:15", "n": "", "vs": [[15, "طوبى للشعب الذي يستجيب لهتاف البوق فيسلك في نور محياك أيها الرب."]]}, {"l": "Psa 148:7-13", "n": "", "vs": [[7, "سبحي الرب من على الأرض ياوحوش البحر وياكل اللجج."], [8, "أيتها النار والبرد، والثلج والضباب، الريح العاصفة المنفذة لأمره،"], [9, "الجبال والتلال جميعا، الأشجار المثمرة والأرز كله،"], [10, "الحيوانات البرية والمواشي كلها، الزواحف والطيور."], [11, "ملوك الأرض وجميع الشعوب وحكام الأرض وجميع الرؤساء،"], [12, "الفتيان والفتيات والشيوخ والشبان،"], [13, "ليسبحوا اسم الرب، لأنه وحده متعال. مجده فوق الأرض والسماوات."]]}, {"l": "Isa 42:10-12", "n": "", "vs": [[10, "غنوا للرب أغنية جديدة، سبحوه من أقاصي الأرض أيها المسافرون في عباب البحر وكل ما فيه وياسكان الجزائر."], [11, "لتهتف الصحراء ومدنها، وديار قيدار المأهولة. ليتغن بفرح أهل سالع وليهتفوا من قمم الجبال."], [12, "وليمجدوا الرب ويذيعوا حمده في الجزائر."]]}, {"l": "Isa 55:12", "n": "", "vs": [[12, "لأنكم ستتركون بابل بفرح وسلام فتترنم الجبال والتلال أمامكم بهجة وتصفق أشجار الحقل بأيديها غبطة،"]]}, {"l": "Eph 5:18-20", "n": "", "vs": [[18, "لا تسكروا بالخمر، ففيها الخلاعة، وإنما امتلئوا بالروح،"], [19, "محدثين بعضكم بعضا بمزامير وتسابيح وأناشيد روحية، مرنمين ومرتلين بقلوبكم للرب؛"], [20, "رافعين الشكر كل حين وعلى كل شيء لله والآب، باسم ربنا يسوع المسيح؛"]]}, {"l": "Col 3:16", "n": "", "vs": [[16, "لتسكن كلمة المسيح في داخلكم بغنى، في كل حكمة، معلمين وواعظين بعضكم بعضا، مرنمين بمزامير وتسابيح وأناشيد روحية في قلوبكم لله، رافعين له الحمد."]]}], "kwAr": "موسم التغريد", "noteAr": ""}, {"kw": "of the turtle", "raw": "Rom_15:9-13; Eph_1:13, Eph_1:14", "note": "", "refs": [{"l": "Rom 15:9-13", "n": "", "vs": [[9, "وإن الأمم يمجدون الله على الرحمة، وفقا لما قد كتب: «لهذا أعترف لك بين الأمم وأرتل لاسمك!»"], [10, "وأيضا قيل: «افرحوا، أيها الأمم، مع شعبه»."], [11, "وأيضا: «سبحوا الرب ياجميع الأمم، ولتحمده جميع الشعوب»."], [12, "ويقول إشعياء أيضا: «سيطلع أصل يسى، والقائم، ليسود على الأمم: عليه تعلق الشعوب الرجاء»."], [13, "فليملأكم إله الرجاء كل فرح وسلام في إيمانكم حتى تزدادوا رجاء بقوة الروح القدس."]]}, {"l": "Eph 1:13", "n": "", "vs": [[13, "وفيه أنتم أيضا (وضعتم رجاءكم) إذ سمعتم كلمة الحق، أي الإنجيل الذي فيه خلاصكم؛ كذلك فيه أيضا ختمتم، إذ آمنتم، بالروح القدس الموعود،"]]}, {"l": "Eph 1:14", "n": "", "vs": [[14, "هذا الروح الذي هو عربون ميراثنا إلى أن يتم فداء ما قد اقتني: بغر ض مدح مجده."]]}], "kwAr": "هديل اليمام", "noteAr": ""}], "arS": [["وأزهرت", ["H5339"]], [" ", []], ["الأرض", ["H776"]], ["، ", []], ["وحل", ["H5060"]], [" ", []], ["موسم", ["H6256"]], [" ", []], ["التغريد", ["H2158"]], ["، ", []], ["وتردد", ["H8085"]], [" ", []], ["هديل", ["H6963"]], [" ", []], ["اليمام", ["H8449"]], [" في ", []], ["أرضنا", ["H776"]], [".", []]]}, {"c": 2, "v": 13, "text": "قد أنبتت التينة فجها، ونشرت الكروم المزهرة أريجها، فانهضي ياحبيبتي ياجميلتي وتعالي.", "groups": [{"kw": "fig tree", "raw": "Son_6:11, Son_7:8, Son_7:11-13; Isa_18:5, Isa_55:10, Isa_55:11, Isa_61:11; Hos_14:6; Hag_2:19; Luk_13:6, Luk_13:7", "note": "", "refs": [{"l": "Son 6:11", "n": "", "vs": [[11, "(المحبوبة): نزلت إلى حديقة الجوز لأرى ثمر الوادي الجديد، وأنظر هل أزهر الكرم ونور الرمان؟"]]}, {"l": "Son 7:8", "n": "", "vs": [[8, "قلت: لأصعدن إلى النخلة وأمسكن بعذوقها، فيكون لي نهداك كعناقيد الكرم، وعبير أنفاسك كأريج التفاح."]]}, {"l": "Son 7:11-13", "n": "", "vs": [[11, "تعال ياحبيبي لنمض إلى الحقل ولنبت في القرى."], [12, "لنخرج مبكرين إلى الكروم، لنرى هل أفرخت الكرمة، وهل تفتحت براعمها، وهل نور الرمان؟ هناك أهبك حبي."], [13, "قد نشر اللفاح أريجه، وتدلت فوق بابنا أفخر الثمار، قديمها وحديثها، التي ادخرتها لك ياحبيبي."]]}, {"l": "Isa 18:5", "n": "", "vs": [[5, "لأنه قبل الحصاد عندما يتم تفتح الزهر، ويتحول الزهر إلى عنب ناضج، فإنه يقطع الفروع بالمناجل، وينزع الأغصان الممتدة ويطرحها،"]]}, {"l": "Isa 55:10", "n": "", "vs": [[10, "وكما تهطل الأمطار وينهمر الثلج من السماء، ولا ترجع إلى هناك، بل تروي الحقول والأشجار، وتجعل البذور تنبت وتنمو وتثمر زرعا للفلاح وخبزا للجياع،"]]}, {"l": "Isa 55:11", "n": "", "vs": [[11, "هكذا تكون كلمتي التي تصدر عني مثمرة دائما، وتحقق ما أرغب فيه وتفلح بما أعهد به إليها."]]}, {"l": "Isa 61:11", "n": "", "vs": [[11, "لأنه كما تنبت الأرض مزروعاتها، والحديقة تخرج نباتاتها التي زرعت فيها، هكذا السيد الرب يجعل البر والتسبيح ينبتان أمام جميع الأمم."]]}, {"l": "Hos 14:6", "n": "", "vs": [[6, "تمتد أغصانه ويصير جماله كشجرة الزيتون وشذاه كأرز لبنان."]]}, {"l": "Hag 2:19", "n": "", "vs": [[19, "هل في الأهراء بذار بعد؟ حتى الكروم والتين والرمان والزيتون لم تثمر بعد. لكن منذ هذا اليوم أبارك فيها»."]]}, {"l": "Luk 13:6", "n": "", "vs": [[6, "ثم ضرب هذا المثل: «كان عند أحدهم شجرة تين مغروسة في كرمه. فجاءها طلبا للثمر، فما وجد شيئا."]]}, {"l": "Luk 13:7", "n": "", "vs": [[7, "فقال للمزارع: هذه ثلاث سنين وأنا أقصد هذه التينة طلبا للثمر فلا أجد شيئا: اقطعها، لماذا نتركها تعطل الأرض؟"]]}], "kwAr": "التينة", "noteAr": ""}, {"kw": "Arise", "raw": "Son_2:10; Luk_19:42; 2Co_5:20, 2Co_6:1, 2Co_6:2", "note": "", "refs": [{"l": "Son 2:10", "n": "", "vs": [[10, "خاطبني حبيبي وقال: انهضي ياحبيبتي ياجميلتي وتعالي معي،"]]}, {"l": "Luk 19:42", "n": "", "vs": [[42, "قائلا: «ليتك أنت أيضا، في يومك هذا، عرفت ما فيه سلامك! ولكن ذلك محجوب الآن عن عينيك."]]}, {"l": "2Co 5:20", "n": "", "vs": [[20, "فنحن إذن سفراء المسيح، وكأن الله يعظ بنا نتوسل بالنيابة عن المسيح منادين: «تصالحوا مع الله!»"]]}, {"l": "2Co 6:1", "n": "", "vs": [[1, "فبما أننا عاملون معا عند الله، نطلب ألا يكون قبولكم لنعمة الله عبثا."]]}, {"l": "2Co 6:2", "n": "", "vs": [[2, "فإنه يقول: «في وقت القبول استجبت لك، وفي يوم الخلاص أعنتك». والآن هو وقت القبول. اليوم يوم الخلاص!"]]}], "kwAr": "فانهضي", "noteAr": ""}], "arS": [["قد ", []], ["أنبتت", ["H2590"]], [" ", []], ["التينة", ["H8384"]], [" ", []], ["فجها", ["H6291"]], ["، ", []], ["ونشرت", ["H5414"]], [" ", []], ["الكروم", ["H1612", "H5563"]], [" المزهرة ", []], ["أريجها", ["H7381"]], ["، ", []], ["فانهضي", ["H6965"]], [" ", []], ["ياحبيبتي", ["H7474"]], [" ", []], ["ياجميلتي", ["H3303"]], [" ", []], ["وتعالي", ["H1980"]], [".", []]]}, {"c": 2, "v": 14, "text": "(المحب): ياحمامتي اللائذة بشقوق الصخر ومخابيء المعاقل، أريني وجهك وأسمعيني صوتك، لأن صوتك عذب ومحياك رائع.", "groups": [{"kw": "my dove", "raw": "Son_5:2, Son_6:9; Psa_68:13, Psa_74:19; Isa_60:8; Eze_7:16; Mat_3:16, Mat_10:16", "note": "", "refs": [{"l": "Son 5:2", "n": "", "vs": [[2, "(المحبوبة): قد نمت ولكن قلبي كان مستيقظا. آه، اسمعوا! ها صوت حبيبي قارعا قائلا: افتحي لي ياأختي، ياحبيبتي، ياحمامتي، ياكاملتي! فإن رأسي قد ابتل من الندى وخصائلي من طل الليل."]]}, {"l": "Son 6:9", "n": "", "vs": [[9, "لكنك ياحمامتي ياكاملتي فريدة، الابنة الوحيدة لأمها، الأعز على من أنجبتها. رأتها العذارى فطوبنها، وشاهدتها الملكات والسراري فأطرينها."]]}, {"l": "Psa 68:13", "n": "", "vs": [[13, "مع أنكم رقدتم بين الحظائر (كرعاة محتقرين في مصر) تكونون كحمامة أجنحتها مغشاة بالفضة، وريشها بالذهب الأصفر."]]}, {"l": "Psa 74:19", "n": "", "vs": [[19, "لا تسلم للوحش نفس شعبك الضعيف، ولا تنس إلى الأبد حياة جمهورك المضطهد."]]}, {"l": "Isa 60:8", "n": "", "vs": [[8, "من هؤلاء الطائرون كالسحاب وكالحمام إلى أعشاشها؟"]]}, {"l": "Eze 7:16", "n": "", "vs": [[16, "أما الناجون منهم فيلوذون بالجبال كحمام الأودية، يبكي كل واحد منهم على إثمه."]]}, {"l": "Mat 3:16", "n": "", "vs": [[16, "فلما تعمد يسوع، صعد من الماء في الحال، وإذا السماوات قد انفتحت له ورأى روح الله هابطا ونازلا عليه كأنه حمامة."]]}, {"l": "Mat 10:16", "n": "", "vs": [[16, "ها أنا أرسلكم مثل الخراف بين الذئاب، فكونوا متنبهين كالحيات ومسالمين كالحمام."]]}], "kwAr": "ياحمامتي", "noteAr": ""}, {"kw": "that art", "raw": "Exo_3:6, Exo_4:11-13; Ezr_9:5, Ezr_9:6; Job_9:16; Isa_6:5; Dan_9:7; Luk_8:47, Luk_8:48", "note": "", "refs": [{"l": "Exo 3:6", "n": "", "vs": [[6, "ثم قال: «أنا هو إله أبيك، إله إبراهيم، وإله إسحق، وإله يعقوب». عندئذ غطى موسى وجهه خوفا من أن يرى الله (فيموت)."]]}, {"l": "Exo 4:11-13", "n": "", "vs": [[11, "فقال الرب له: «من هو باريء فم الإنسان؟ أو من يجعله أخرس أو أصم أو بصيرا أو كفيفا؟ ألست أنا الرب؟"], [12, "فالآن انطلق فألقن فمك النطق، وأعلمك ماذا تقول»."], [13, "لكن موسى أجاب: «ياسيد، أتوسل إليك أن ترسل من تشاء غيري»."]]}, {"l": "Ezr 9:5", "n": "", "vs": [[5, "حينئذ قمت من تذللي، وأنا مازلت مرتديا ردائي وثيابي الممزقة، وجثوت على ركبتي وبسطت يدي إلى الرب إلهي،"]]}, {"l": "Ezr 9:6", "n": "", "vs": [[6, "قائلا: «اللهم، إني أخجل وأخزى من أن أرفع وجهي نحوك، لأن آثامنا قد تكاثرت فوق رؤوسنا، ومعاصينا قد تعاظمت فبلغت عنان السماء،"]]}, {"l": "Job 9:16", "n": "", "vs": [[16, "حتى لو دعوت واستجاب لي، فإني لا أصدق أنه قد استمع لي."]]}, {"l": "Isa 6:5", "n": "", "vs": [[5, "فقلت: «ويل لي لأني هلكت لأني إنسان نجس الشفتين، وأسكن وسط قوم دنسي الشفاه. فإن عيني قد أبصرتا الملك الرب القدير»."]]}, {"l": "Dan 9:7", "n": "", "vs": [[7, "لك أيها السيد البر، ولنا الخزي، كما هو حادث اليوم لرجال يهوذا ولأهل أورشليم، ولسائر بني إسرائيل القريبين والبعيدين، المشتتين في كل البلدان التي أجليتهم إليها عقابا لهم على ما اقترفوه من خيانة في حقك."]]}, {"l": "Luk 8:47", "n": "", "vs": [[47, "فلما رأت المرأة أن أمرها لم يكتم، تقدمت مرتجفة، وارتمت أمامه معلنة أمام جميع الناس لأي سبب لمسته، وكيف نالت الشفاء في الحال."]]}, {"l": "Luk 8:48", "n": "", "vs": [[48, "فقال لها: «ياابنة، إيمانك قد شفاك؛ اذهبي بسلام! »"]]}], "kwAr": "اللائذة", "noteAr": ""}, {"kw": "clefts", "raw": "Exo_33:22, Exo_33:23; Isa_2:21; Jer_49:16; Oba_1:3", "note": "", "refs": [{"l": "Exo 33:22", "n": "", "vs": [[22, "وعندما يعبر مجدي، أضعك في نقرة من الصخر، وأحجبك بيدي حتى أعبر،"]]}, {"l": "Exo 33:23", "n": "", "vs": [[23, "ثم أرفع يدي فتنظر ورائي، أما وجهي فيظل محجوبا عن العيان»."]]}, {"l": "Isa 2:21", "n": "", "vs": [[21, "ويدخلون في كهوف الصخر، وفي شقوق الجروف الجبلية هربا من هيبة الرب ومن مجد جلاله عندما يهب ليزلزل الأرض."]]}, {"l": "Jer 49:16", "n": "", "vs": [[16, "قد خدعك ما تثيره من رعب، وأغوتك كبرياء قلبك، يامن تقيم في شقوق الصخر وتعتصم بقمة التل. ولكنني سأطرحك من هناك ولو بنيت عشك عاليا كعش النسر، يقول الرب."]]}, {"l": "Oba 1:3", "n": "", "vs": [[3, "قد غرتك كبرياء قلبك أيها المقيم في شقوق الصخور، ومساكنه في القمم، القائل في قلبه: من يهوي بي إلى الأرض؟"]]}], "kwAr": "شقوق الصخر", "noteAr": ""}, {"kw": "let me hear", "raw": "Son_8:13; Psa_50:14, Psa_50:15; Pro_15:8; Heb_4:16, Heb_10:22", "note": "", "refs": [{"l": "Son 8:13", "n": "", "vs": [[13, "(المحب): أنت أيتها الجالسة في الجنات، إن مرافقي يصغون بانتباه إلى صوتك، فأسمعيني إياه."]]}, {"l": "Psa 50:14", "n": "", "vs": [[14, "قدم لله ذبائح الحمد وأوف العلي عهودك."]]}, {"l": "Psa 50:15", "n": "", "vs": [[15, "ادعني في يوم ضيقك أنقذك فتمجدني»."]]}, {"l": "Pro 15:8", "n": "", "vs": [[8, "قربان المنافقين مكرهة الرب، ومسرته صلاة المستقيمين."]]}, {"l": "Heb 4:16", "n": "", "vs": [[16, "فلنتقدم بثقة إلى عرش النعمة، لننال الرحمة ونجد نعمة تعيننا عند الحاجة."]]}, {"l": "Heb 10:22", "n": "", "vs": [[22, "فلنتقدم إلى حضرة الله بقلب صادق وبثقة الإيمان الكاملة، بعدما طهر رش الدم قلوبنا من كل شعور بالذنب، وغسل الماء النقي أجسادنا."]]}], "kwAr": "أسمعيني", "noteAr": ""}, {"kw": "for sweet", "raw": "Psa_22:3, Psa_50:23; Isa_51:3; Rev_4:8-10, Rev_5:8, Rev_7:9, Rev_7:10", "note": "", "refs": [{"l": "Psa 22:3", "n": "", "vs": [[3, "مع أنك أنت القدوس الذي أقمت عرشك في وسط شعبك الذي يسبحك."]]}, {"l": "Psa 50:23", "n": "", "vs": [[23, "أما من يقدم لي ذبيحة حمد فهو يمجدني، ومن يقوم طريقه أريه خلاص الله»."]]}, {"l": "Isa 51:3", "n": "", "vs": [[3, "الرب يعزي صهيون ويعزي خرائبها، ويحول قفرها إلى عدن وصحر اءها إلى جنة رائعة، فتفيض بالفر ح والغبطة والشكر وهتاف ترنيم."]]}, {"l": "Rev 4:8-10", "n": "", "vs": [[8, "وكان لكل كائن منها ستة أجنحة، تكسوها عيون من الداخل ومن الخارج. وهذه الكائنات الحية الأربعة تهتف ليلا ونهارا دون انقطاع قائلة: «قدوس قدوس قدوس، الرب الإله القادر على كل شيء، الذي كان والكائن والذي سيأتي»."], [9, "وكلما قدمت هذه الكائنات التمجيد والإجلال والحمد للجالس على العرش، الحي إلى أبد الآبدين،"], [10, "يجثو الشيوخ الأربعة والعشرون أمام الجالس على العرش ساجدين للحي إلى أبد الآبدين، ويلقون أكاليلهم أمام عرشه وهم يهتفون:"]]}, {"l": "Rev 5:8", "n": "", "vs": [[8, "فسجد الشيوخ الأربعة والعشرون والكائنات الحية الأربعة أمام الحمل، وكان بيد كل منهم قيثارة وكؤوس ذهب مملوءة بالبخور، الذي هو صلوات القديسين."]]}, {"l": "Rev 7:9", "n": "", "vs": [[9, "ثم نظرت، فرأيت جمعا كثيرا لا يحصى، من كل أمة وقبيلة وشعب ولغة، واقفين أمام العرش وأمام الحمل، وقد ارتدوا ثيا با بيضاء، وأمسكوا بأيديهم سعف النخل،"]]}, {"l": "Rev 7:10", "n": "", "vs": [[10, "وهم يهتفون بصوت عال: «الخلاص من عند إلهنا الجالس على العرش ومن عند الحمل!»"]]}], "kwAr": "لأن صوتك عذب", "noteAr": ""}, {"kw": "thy countenance", "raw": "Son_1:5, Son_1:8, Son_6:10; Psa_45:11, Psa_110:3; Eph_5:27; Col_1:22; 1Pe_3:4; Jud_1:24", "note": "", "refs": [{"l": "Son 1:5", "n": "", "vs": [[5, "سمراء أنا، ولكنني رائعة الجمال يابنات أورشليم. أنا سمراء كخيام قيدار. أو كسرادق سليمان."]]}, {"l": "Son 1:8", "n": "", "vs": [[8, "(المحب): إن كنت لا تعلمين ياأجمل النساء، فاقتفي أثر الغنم، وارعي جداءك عند مساكن الرعاة."]]}, {"l": "Son 6:10", "n": "", "vs": [[10, "من هذه الطالعة كالفجر، الجميلة كالبدر، المشرقة كالشمس، الجليلة كجيش يرفع أعلامه؟"]]}, {"l": "Psa 45:11", "n": "", "vs": [[11, "فيشتهي الملك جمالك، لأنه هو سيدك فاسجدي له."]]}, {"l": "Psa 110:3", "n": "", "vs": [[3, "في يوم محاربة أعدائك يتطوع شعبك. يجيء شبابك إلى التلال المقدسة كالندى في قلب الفجر."]]}, {"l": "Eph 5:27", "n": "", "vs": [[27, "حتى يزفها إلى نفسه كنيسة بهية لا يشوبها عيب أو تجعد أو أية نقيصة مشابهة بل تكون مقدسة خالية من العيوب."]]}, {"l": "Col 1:22", "n": "", "vs": [[22, "قد صالحكم الآن في جسد بشرية (ابنه) بالموت. وذلك لكي يحضركم فتمثلوا أمامه وأنتم قديسون بلا ذنب ولا لوم."]]}, {"l": "1Pe 3:4", "n": "", "vs": [[4, "وإنما لتعتمد الزينة الداخلية، ليكون قلبها متزينا بروح الوداعة والهدوء. هذه هي الزينة التي لا تفنى، وهي غالية الثمن في نظر الله!"]]}, {"l": "Jud 1:24", "n": "", "vs": [[24, "وللقادر أن يحرسكم من السقوط حتى يوصلكم إلى المثول أمامه في المجد مبتهجين ولا عيب فيكم …"]]}], "kwAr": "محياك", "noteAr": ""}], "arS": [["(المحب): ", []], ["ياحمامتي", ["H3123"]], [" اللائذة ", []], ["بشقوق", ["H2288"]], [" ", []], ["الصخر", ["H5553"]], [" ", []], ["ومخابيء", ["H5643"]], [" ", []], ["المعاقل", ["H4095"]], ["، ", []], ["أريني", ["H7200"]], [" ", []], ["وجهك", ["H4758"]], [" ", []], ["وأسمعيني", ["H8085"]], [" ", []], ["صوتك", ["H6963"]], ["، ", []], ["لأن", ["H3588"]], [" ", []], ["صوتك", ["H6963"]], [" ", []], ["عذب", ["H6156"]], [" ", []], ["ومحياك", ["H4758"]], [" ", []], ["رائع", ["H5000"]], [".", []]]}, {"c": 2, "v": 15, "text": "اقتنصوا لنا الثعالب الصغار التي تتلف الكروم، فإن كرومنا قد أزهر ت.", "groups": [{"kw": "the foxes", "raw": "Psa_80:13; Eze_13:4-16; Luk_13:32; 2Pe_2:1-3; Rev_2:2", "note": "", "refs": [{"l": "Psa 80:13", "n": "", "vs": [[13, "يتلفها الخنزير الطالع من الغابة، ويرعاها وحش البراري."]]}, {"l": "Eze 13:4-16", "n": "", "vs": [[4, "أنبياؤك ياإسرائيل هم كالثعالب في الخرائب."], [5, "لم تبرزوا إلى الثغرات، ولم تشيدوا جدارا حول بيت إسرائيل لتصمدوا في القتال في يوم الرب،"], [6, "إنما رؤياهم باطلة، وعرافتهم كاذبة. يقولون: يقول الرب، والرب لم يرسلهم، ومع ذلك يطمعون في تحقيق كلمتهم."], [7, "ألم تروا رؤيا باطلة، وتنطقوا بعرافة كاذبة قائلين: يقول الرب، وأنا لم أتكلم؟"], [8, "لذلك يعلن الرب: لأنكم تكلمتم باطلا وادعيتم رؤيا كاذبة، فها أنا أنقلب عليكم يقول السيد الرب."], [9, "فتكون يدي على الأنبياء ذوي الرؤيا الباطلة والعرافة الكاذبة، فلا يكون لهم مقام في جماعة شعبي، ولا تدون أسماؤهم في كتاب بيت إسرائيل، ولا يدخلون أرض إسرائيل، فتدركون أني أنا السيد الرب."], [10, "لأنهم حقا أضلوا شعبي قائلين: سيكون لكم سلام مع أنه ليس هناك سلام، فكان شعبي يبني حائطا وهم يطلونه بماء الكلس."], [11, "قل للطالين بماء الكلس: إن الحائط يتداعى، إذ ينهمر مطر جارف. وأنتن ياحجارة البر د تساقطن، ولتعصف به ريح جائحة."], [12, "فلا يلبث السور أن ينهار أفلا تسألون آنئذ: أين الطين الذي طينتم به؟"], [13, "لذلك، هذا ما يعلنه السيد الرب: ها أنا أجعل ريحا عاتية تخترق السور بفعل حنقي، ومطرا جارفا ينهمر في خضم غضبي، وحجارة برد تتساقط في أثناء سخطي لكي تهلك،"], [14, "فأهدم السور الذي طليتموه بماء الكلس وأسويه بالأرض فيتعرى أساسه وتتداعى المدينة وتفنون جميعا في وسطها فتدركون أني أنا الرب."], [15, "فأنفث غضبي بالسور وبمن يطلونه بماء الكلس وأقول لكم: قد تلاشى السور والذين يطلونه."], [16, "الذين هم أنبياء إسرائيل الأدعياء، المتنبئون لإسرائيل، الذين يرون لها رؤى سلام، مع أنه لا سلام هناك، يقول السيد الرب."]]}, {"l": "Luk 13:32", "n": "", "vs": [[32, "فقال لهم: «اذهبوا، قولوا لهذا الثعلب: ها أنا أطرد الشياطين وأشفي المرضى اليوم وغدا. وفي اليوم الثالث يتم بي كل شيء."]]}, {"l": "2Pe 2:1-3", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."], [2, "وكثيرون سيسيرون وراءهم في طرق الإباحية. وبسببهم توجه الإهانة إلى طريق الحق."], [3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "Rev 2:2", "n": "", "vs": [[2, "إني عالم بأعمالك، وجهدك، وصبرك، وأعلم أنك لا تستطيع احتمال الأشرار، وأنك دققت في فحص ادعاءات أولئك الذين يزعمون أنهم رسل، وما هم برسل، فتبين نوا الفضيلة بالتقدم في المعرفة،"], [6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"], [7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."], [8, "فحين تكون هذه الصفات الطيبة في داخلكم، وتزداد بوفرة، تجعلكم مجتهدين ومثمرين في معرفتكم لربنا يسوع المسيح."]]}], "kwAr": "أسنانك", "noteAr": ""}, {"kw": "and none", "raw": "Exo_23:26; Deu_7:13, Deu_7:14", "note": "", "refs": [{"l": "Exo 23:26", "n": "", "vs": [[26, "فلا تكون مجهضة ولا عاقر في أرضك. وأمتعك بكامل عمرك."]]}, {"l": "Deu 7:13", "n": "", "vs": [[13, "ويحبكم ويبارككم ويكثركم، ويبارك ثمرة أحشائكم وغلة أرضكم من قمح وزيت، ويزيد من إنتاج بقركم ونعاجكم على الأرض التي أقسم لآبائكم أن يهبها لكم."]]}, {"l": "Deu 7:14", "n": "", "vs": [[14, "وتكونون مباركين أكثر من جميع الشعوب، فلا يوجد عقيم ولا عاقر فيكم ولا في بهائمكم."]]}], "kwAr": "ما فيها عقيم", "noteAr": ""}], "arS": [["أسنانك", ["H8127"]], [" ", []], ["كقطيع", ["H5739"]], [" ", []], ["مجزوز", ["H7094"]], [" ", []], ["خارج", ["H4480", "H5927"]], [" من ", []], ["الاغتسال", ["H7367"]], ["، ", []], ["كل", ["H3605"]], [" واحدة ذات ", []], ["توأم", ["H8382"]], ["، وما فيها ", []], ["عقيم", ["H369", "H7909"]], [".", []]]}, {"c": 4, "v": 3, "text": "شفتاك كخيط من القرمز، وحديث فمك عذب، وخداك كفلقتي رمانة خلف نقابك.", "groups": [{"kw": "lips", "raw": "Son_4:11, Son_5:13, Son_5:16, Son_7:9; Psa_37:30, Psa_45:2, Psa_119:13; Pro_10:13, Pro_10:20, Pro_10:21, Pro_16:21-24; Mat_12:35; Luk_4:22; 2Co_5:18-21; Eph_4:29; Col_3:16, Col_3:17, Col_4:6", "note": "", "refs": [{"l": "Son 4:11", "n": "", "vs": [[11, "شفتاك تقطران شهدا أيتها العروس، وتحت لسانك عسل ولبن، ورائحة ثيابك كشذى لبنان."]]}, {"l": "Son 5:13", "n": "", "vs": [[13, "خداه كخميلة طيب تفوحان عطرا، وشفتاه كالسوسن تقطران مرا شذيا."]]}, {"l": "Son 5:16", "n": "", "vs": [[16, "فمه عذب، وكله مشتهيات. هذا هو حبيبي وهذا هو خليلي يابنات أورشليم!"]]}, {"l": "Son 7:9", "n": "", "vs": [[9, "فمك كأجود الخمر!(المحبوبة): لتكن سائغة لحبيبي، تسيل عذبة على شفاه النائمين."]]}, {"l": "Psa 37:30", "n": "", "vs": [[30, "فم الصديق ينطق دائما بالحكمة، ويتفوه بكلام الحق"]]}, {"l": "Psa 45:2", "n": "", "vs": [[2, "أنت أبرع جمالا من كل بني البشر. انسكبت النعمة على شفتيك، لذلك باركك الله إلى الأبد."]]}, {"l": "Psa 119:13", "n": "", "vs": [[13, "بشفتي أعلنت جميع الأحكام التي نطقت بها."]]}, {"l": "Pro 10:13", "n": "", "vs": [[13, "في شفتي العاقل تكمن حكمة أما العصا فمن نصيب ظهر الأحمق."]]}, {"l": "Pro 10:20", "n": "", "vs": [[20, "كلام الصديق كالفضة المصفاة، وقلب الشرير يخلو من كل قيمة."]]}, {"l": "Pro 10:21", "n": "", "vs": [[21, "كلام الصديق يفيد كثيرين، أما الحمقى فيموتون من سوء الفهم."]]}, {"l": "Pro 16:21-24", "n": "", "vs": [[21, "الحكيم القلب يدعى فهيما، وعذوبة المنطق تزيد من قوة الإقناع."], [22, "الفطنة ينبوع حياة لصاحبها، وعقاب الجاهل في حماقته."], [23, "عقل الحكيم يرشد فمه، ويزيد منطقه قوة إقناع."], [24, "عذوبة الكلام شهد عسل، حلو للنفس وعافية للجسد."]]}, {"l": "Mat 12:35", "n": "", "vs": [[35, "فالإنسان الصالح، من الكنز الصالح في قلبه، يصدر ما هو صالح. والإنسان الشرير، يصدر ما هو شرير."]]}, {"l": "Luk 4:22", "n": "", "vs": [[22, "وشهد له جميع الحاضرين، متعجبين من كلام النعمة الخارج من فمه، وتساءلوا: «أليس هذا ابن يوسف؟»"]]}, {"l": "2Co 5:18-21", "n": "", "vs": [[18, "وكل شيء هو من عند الله الذي صالحنا مع نفسه بالمسيح، ثم سلمنا خدمة هذه المصالحة."], [19, "ذلك أن الله كان في المسيح مصالحا العالم مع نفسه، غير حاسب عليهم خطاياهم، وقد وضع بين أيدينا رسالة هذه المصالحة."], [20, "فنحن إذن سفراء المسيح، وكأن الله يعظ بنا نتوسل بالنيابة عن المسيح منادين: «تصالحوا مع الله!»"], [21, "فإن الذي لم يعرف خطيئة، جعله الله خطيئة لأجلنا، لنصير نحن بر الله فيه."]]}, {"l": "Eph 4:29", "n": "", "vs": [[29, "لا تخرج من أفواهكم كلمة فاسدة، بل الكلام الصالح للبنيان الذي تدعو إليه الحاجة، كي يعطي السامعين نعمة."]]}, {"l": "Col 3:16", "n": "", "vs": [[16, "لتسكن كلمة المسيح في داخلكم بغنى، في كل حكمة، معلمين وواعظين بعضكم بعضا، مرنمين بمزامير وتسابيح وأناشيد روحية في قلوبكم لله، رافعين له الحمد."]]}, {"l": "Col 3:17", "n": "", "vs": [[17, "ومهما كان ما تعملونه، بالقول أو بالفعل، فليجر كل شيء باسم الرب يسوع، راف لبحر طريقا يعبر فوقه المفديون؟"], [11, "سيرجع الذين افتداهم الرب ويأتون إلى صهيون بترنم، يكلل رؤوسهم فرح أبدي، فتطغى عليهم بهجة وغبطة، أما الحزن والتنهد فيهربان بعيدا."]]}, {"l": "Isa 64:1", "n": "", "vs": [[1, "ليتك تشق السماوات وتنزل فتتزلزل الجبال من حضرتك!"]]}, {"l": "Eze 37:9", "n": "", "vs": [[9, "فقال لي: «تنبأ للروح ياابن آدم، وقل: هذا ما يأمر به السيد الرب: هيا ياروح أقبل من الرياح الأربع وهب على هؤلاء القتلى ليحيوا»."]]}, {"l": "Joh 3:8", "n": "", "vs": [[8, "الريح تهب حيث تشاء وتسمع صفيرها، ولكنك لا تعلم من أين تأتي ولا إلى أين تذهب. هكذا كل من ولد من الروح»."]]}, {"l": "Act 2:1", "n": "", "vs": [[1, "ولما جاء اليوم الخمسون، كان الإخوة مجتمعين معا في مكان واحد،"]]}, {"l": "Act 2:2", "n": "", "vs": [[2, "وفجأة حدث صوت من السماء كأنه دوي ريح عاصفة، فملأ البيت الذي كانوا جالسين فيه."]]}, {"l": "Act 4:31", "n": "", "vs": [[31, "وفيما هم يصلون ارتج المكان الذي كانوا مجتمعين فيه، وامتلأوا جميعا بالروح القدس، فأخذوا يعلنون كلمة الله بكل جرأة!"]]}], "kwAr": "استيقظي", "noteAr": ""}, {"kw": "the spices", "raw": "Son_4:13, Son_4:14, Son_7:12, Son_7:13; 2Co_9:10-15; Phi_1:9-11; Col_1:9-12; 1Th_2:12, 1Th_2:13; Heb_13:20, Heb_13:21; 2Pe_3:18", "note": "", "refs": [{"l": "Son 4:13", "n": "", "vs": [[13, "أغراسك فردوس رمان مع خيرة الأثمار والحناء والناردين."]]}, {"l": "Son 4:14", "n": "", "vs": [[14, "ناردين وزعفران، قصب الذريرة وقرفة مع كل أصناف اللبان والمر والعود مع أفخر العطور."]]}, {"l": "Son 7:12", "n": "", "vs": [[12, "لنخرج مبكرين إلى الكروم، لنرى هل أفرخت الكرمة، وهل تفتحت براعمها، وهل نور الرمان؟ هناك أهبك حبي."]]}, {"l": "Son 7:13", "n": "", "vs": [[13, "قد نشر اللفاح أريجه، وتدلت فوق بابنا أفخر الثمار، قديمها وحديثها، التي ادخرتها لك ياحبيبي."]]}, {"l": "2Co 9:10-15", "n": "", "vs": [[10, "والذي يقدم بذارا للزارع، وخبزا للأكل، سيقدم لكم بذاركم ويكثره ويزيد أثمار بركم:"], [11, "إذ تغتنون في كل شيء، لأجل كل سخاء طوعي ينتج بنا شكرا لله"], [12, "ذلك لأن خدمة الله بهذه الإعانة لا تسد حاجة القديسين وحسب، بل تفيض بشكر كثير لله."], [13, "فإن القديسين، إذ يختبرون هذه الخدمة، يمجدون الله على طاعتكم في الشهادة لإنجيل المسيح وعلى السخاء الطوعي في مشاركتكم لهم وللجميع."], [14, "كما يرفعون الدعاء لأجلكم، متشوقين إليكم، بسبب نعمة الله الفائقة التي ظهرت فيكم."], [15, "فشكرا لله على عطيته المجانية التي تفوق الوصف!"]]}, {"l": "Phi 1:9-11", "n": "", "vs": [[9, "وصلاتي لأجلكم هي هذه: أن تزداد محبتكم أكثر فأكثر في تمام المعرفة والإدراك،"], [10, "لكي تستحسنوا الأمور الممتازة، حتى تكونوا طاهرين وخالين من العثرات إلى يوم المسيح،"], [11, "كاملين في ثمار البر الآتية بيسوع المسيح، لمجد الله وحمده."]]}, {"l": "Col 1:9-12", "n": "", "vs": [[9, "لذلك نحن أيضا، من اليوم الذي فيه سمعنا بأخباركم، مازلنا نصلي ونتضرع لأجلكم، لأن تمتلئوا من تمام المعرفة لمشيئة الله في كل حكمة وإدراك روحي،"], [10, "لكي تسلكوا سلوكا لائقا بالرب ومرضيا في كل شيء، منتجين الثمر في كل عمل صالح ونامين في معرفة الله إلى التمام،"], [11, "متشددين بكل قوة موافقة لقدرة مجده، لتتمكنوا تماما من الاحتمال وطول البال،"], [12, "رافعين الشكر بفرح للآب الذي جعلكم أهلا للاشتراك في ميراث القديسين في (ملكوت) النور،"]]}, {"l": "1Th 2:12", "n": "", "vs": [[12, "ونحرضكم أن تسلكوا سلوكا يليق بالله، ذاك الذي يدعوكم إلى ملكوته ومجده."]]}, {"l": "1Th 2:13", "n": "", "vs": [[13, "ولذلك نحن أيضا نرفع الشكر لله بلا توقف، لأنكم لما تلقيتم منا كلمة البشارة من الله، قبلتموها لا كأنها كلمة بشر، بل كما هي في الحقيقة: باعتبارها كلمة الله العاملة أيضا فيكم أنتم المؤمنين."]]}, {"l": "Heb 13:20", "n": "", "vs": [[20, "وأسأل الله ، إله السلام الذي أقام من بين الأموات ربنا يسوع راعي الخراف العظيم بفضل دمه الذي ختم به العهد الأبدي"]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}], "kwAr": "عبيرها", "noteAr": ""}, {"kw": "Let", "raw": "Son_5:1, Son_8:12; Mat_26:10, Mat_26:12; Joh_5:8; Rom_15:16, Rom_15:28; 1Pe_2:5, 1Pe_2:9, 1Pe_2:10", "note": "", "refs": [{"l": "Son 5:1", "n": "", "vs": [[1, "(المحب): قد جئت إلى جنتي ياأختي، ياعروسي، وقطفت مري مع أطيابي، وأكلت شهدي مع عسلي، وشربت خمري مع لبني.(بنات أورشليم): كلوا أيها الخلان. اشربوا حتى الانتشاء أيها المحبون."]]}, {"l": "Son 8:12", "n": "", "vs": [[12, "لكن كرمي الذي لي هو أمامي. الألف لك ياسليمان، ومئتان من الفضة للنواطير."]]}, {"l": "Mat 26:10", "n": "", "vs": [[10, "وإذ علم يسوع بذلك، قال لهم: «لماذا تضايقون هذه المرأة؟ إنها عملت بي عملا حسنا."]]}, {"l": "Mat 26:12", "n": "", "vs": [[12, "فإنها إذ سكبت العطر على جسمي، فقد فعلت ذلك إعدادا لدفني."]]}, {"l": "Joh 5:8", "n": "", "vs": [[8, "فقال له يسوع: «قم احمل فراشك وامش»."]]}, {"l": "Rom 15:16", "n": "", "vs": [[16, "وبذلك أكون خادم المسيح يسوع، المرسل إلى الأمم، حاملا إنجيل الله وكأني أقوم بخدمة كهنوتية، بقصد أن ترفع لله من بين الأمم تقدمة تكون مقبولة ومقدسة بالروح القدس."]]}, {"l": "Rom 15:28", "n": "", "vs": [[28, "فبعد انتهائي من هذه المهمة، وتسليمي هذا الثمر للقديسين،"]]}, {"l": "1Pe 2:5", "n": "", "vs": [[5, "إذن اتحدوا به كحجارة حية، مبنيين بيتا روحيا، تكونون فيه كهنة مقدسين تقدمون لله ذبائح روحية مقبولة لديه بفضل يسوع المسيح."]]}, {"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}, {"l": "1Pe 2:10", "n": "", "vs": [[10, "فإنكم في الماضي لم تكونوا شعبا؛ أما الآن، فأنتم «شعب الله وقد كنتم سابقا لا تتمتعون برحمة الله، أما الآن، فإنكم تتمتعون بها!»"]]}], "kwAr": "ليقبل", "noteAr": ""}], "arS": [["(المحبوبة): ", []], ["استيقظي", ["H5782"]], [" ياريح ", []], ["الشمال", ["H6828"]], ["، ", []], ["وهبي", ["H6315"]], [" ياريح ", []], ["الجنوب", ["H8486"]], ["، هبي على ", []], ["جنتي", ["H1588"]], [" ", []], ["فينتشر", ["H5140"]], [" ", []], ["عبيرها", ["H1314"]], [". ", []], ["ليقبل", ["H935"]], [" ", []], ["حبيبي", ["H1730"]], [" إلى ", []], ["جنته", ["H1588"]], [" ", []], ["ويتذوق", ["H398"]], [" أطيب ", []], ["أثمارها", ["H6529", "H4022"]], [".", []]]}, {"c": 5, "v": 1, "text": "(المحب): قد جئت إلى جنتي ياأختي، ياعروسي، وقطفت مري مع أطيابي، وأكلت شهدي مع عسلي، وشربت خمري مع لبني.(بنات أورشليم): كلوا أيها الخلان. اشربوا حتى الانتشاء أيها المحبون.", "groups": [{"kw": "come", "raw": "Son_4:16, Son_6:2, Son_6:11, Son_8:13; Isa_5:1, Isa_51:3, Isa_58:11, Isa_61:11; Joh_14:21-23", "note": "", "refs": [{"l": "Son 4:16", "n": "", "vs": [[16, "(المحبوبة): استيقظي ياريح الشمال، وهبي ياريح الجنوب، هبي على جنتي فينتشر عبيرها. ليقبل حبيبي إلى جنته ويتذوق أطيب أثمارها."]]}, {"l": "Son 6:2", "n": "", "vs": [[2, "(المحبوبة): قد انطلق حبيبي إلى جنته، إلى خمائل الأطياب ليرعى في الروضات ويقطف السوسن."]]}, {"l": "Son 6:11", "n": "", "vs": [[11, "(المحبوبة): نزلت إلى حديقة الجوز لأرى ثمر الوادي الجديد، وأنظر هل أزهر الكرم ونور الرمان؟"]]}, {"l": "Son 8:13", "n": "", "vs": [[13, "(المحب): أنت أيتها الجالسة في الجنات، إن مرافقي يصغون بانتباه إلى صوتك، فأسمعيني إياه."]]}, {"l": "Isa 5:1", "n": "", "vs": [[1, "سأشدو لحبيبي أغنية عن كرمه: كان لحبيبي كرم على تل خصيب،"]]}, {"l": "Isa 51:3", "n": "", "vs": [[3, "الرب يعزي صهيون ويعزي خرائبها، ويحول قفرها إلى عدن وصحر اءها إلى جنة رائعة، فتفيض بالفر ح والغبطة والشكر وهتاف ترنيم."]]}, {"l": "Isa 58:11", "n": "", "vs": [[11, "ويهديك الرب دائما ويسد حاجتك حتى في زمن القحط والأرض المجدبة، فيقوي عظامك فتصبح كروضة مروية، وكجدول ماء لا ينقطع،"]]}, {"l": "Isa 61:11", "n": "", "vs": [[11, "لأنه كما تنبت الأرض مزروعاتها، والحديقة تخرج نباتاتها التي زرعت فيها، هكذا السيد الرب يجعل البر والتسبيح ينبتان أمام جميع الأمم."]]}, {"l": "Joh 14:21-23", "n": "", "vs": [[21, "من كانت عنده وصاياي، ويعمل بها، فذاك يحبني. والذي يحبني، يحبه أبي، وأنا أحبه وأعلن له ذاتي»."], [22, "فسأله يهوذا، غير الإسخريوطي: «ياسيد، ماذا جرى حتى تعلن لنا ذاتك ولا تعلنها للعالم؟»"], [23, "أجابه يسوع: «من يحبني يعمل بكلمتي، ويحبه أبي، وإليه نأتي، وعنده نجعل لنا منزلا."]]}], "kwAr": "جئت", "noteAr": ""}, {"kw": "my sister", "raw": "Son_4:9-12, Son_8:1; Heb_2:12-14", "note": "", "refs": [{"l": "Son 4:9-12", "n": "", "vs": [[9, "قد سلبت قلبي، ياأختي ياعروسي! قد سلبت قلبي بنظرة عينيك وقلادة عنقك."], [10, "ما أعذب حبك ياأختي ياعروسي! لكم حبك ألذ من الخمر، وأريج أطيابك أزكى من كل العطور."], [11, "شفتاك تقطران شهدا أيتها العروس، وتحت لسانك عسل ولبن، ورائحة ثيابك كشذى لبنان."], [12, "أنت جنة مغلقة ياأختي العروس. أنت عين مقفلة وينبوع مختوم!"]]}, {"l": "Son 8:1", "n": "", "vs": [[1, "(المحبوبة): ليتك كنت أخي الذي رضع ثدي أمي، حتى إذا التقيتك في الخارج أقبلك وليس من يلومني!"]]}, {"l": "Heb 2:12-14", "n": "", "vs": [[12, "إذ يقول الكتاب بلسانه: «أعلن اسمك لإخوتي. وأسبحك في وسط الجماعة!»"], [13, "ويقول أيضا: «وأنا أكون متوكلا عليه!» وأيضا: «ها أنا مع الأولاد الذين وهبهم الله لي!»"], [14, "إذن، بما أن هؤلاء الأولاد متشاركون في أجسام بشرية من لحم ودم، اشترك المسيح أيضا في اللحم والدم باتخاذه جسما بشريا. وهكذا تمكن أن يموت، ليقضي على من له سلطة الموت، أي إبليس،"]]}], "kwAr": "ياأختي", "noteAr": ""}, {"kw": "I have gathered", "raw": "Son_4:13, Son_4:14; Psa_147:11; Isa_53:11", "note": "", "refs": [{"l": "Son 4:13", "n": "", "vs": [[13, "أغراسك فردوس رمان مع خيرة الأثمار والحناء والناردين."]]}, {"l": "Son 4:14", "n": "", "vs": [[14, "ناردين وزعفران، قصب الذريرة وقرفة مع كل أصناف اللبان والمر والعود مع أفخر العطور."]]}, {"l": "Psa 147:11", "n": "", "vs": [[11, "إنما يرضى الرب بخائفيه، الراجين رحمته."]]}, {"l": "Isa 53:11", "n": "", "vs": [[11, "ويرى ثمار تعب نفسه ويشبع، وعبدي البار يبرر بمعرفته كثيرين ويحمل آثامهم."]]}], "kwAr": "قطفت", "noteAr": ""}, {"kw": "eat", "raw": "Deu_16:13-17, Deu_26:10-14; 2Ch_31:6-10; Psa_16:3; Isa_23:18, Isa_55:1, Isa_55:2; Isa_62:8, Isa_62:9, Isa_65:13, Isa_66:14; Mat_25:40; Act_11:29; 2Co_9:11-15; Eph_5:18; 1Th_3:8, 1Th_3:9", "note": "", "refs": [{"l": "Deu 16:13-17", "n": "", "vs": [[13, "واحتفلوا بعيد المظلات في نهاية موسم الحصاد، عند جمع غلات بيادركم ومعاصركم،"], [14, "فتحتفلون بالعيد أنتم وأبناؤكم وبناتكم وإماؤكم واللاويون والغريب واليتيم والأرملة المقيمون في مدنكم،"], [15, "فتعيدون للرب سبعة أيام في الموضع الذي يختاره الرب، لأن الرب إلهكم يبارك لكم محاصيلكم وكل ما تنتجه أيديكم، فيكمل بذلك فرحكم."], [16, "ويحضر جميع ذكوركم ثلاث مرات للمثول أمام الرب إلهكم في الموضع الذي يختاره الرب، وذلك في عيد الفطير وعيد الأسابيع وعيد المظال. وإياهم أن يمثلوا أمام الرب من غير تقدمات."], [17, "فيقدم كل واحد ما تسخو به نفسه حسبما باركه الرب إلهه."]]}, {"l": "Deu 26:10-14", "n": "", "vs": [[10, "فها أنا الآن قد أتيت بأول ثمر الأرض التي وهبتني يارب ثم يضعه أمام الرب إلهكم ويسجد في حضرته،"], [11, "ويحتفل بجميع الخير الذي أنعم به الرب إلهكم عليه وعلى أهل بيته، هو واللاوي والغريب المقيم بينكم."], [12, "ومتى انتهيت من تقديم كل عشور غلاتك في السنة الثالثة، سنة العشور، وأعطيت اللاوي والغريب واليتيم والأرملة فأكلوا في مدينتك وشبعوا،"], [13, "تقول في حضرة الرب إلهك: قد افرزت من بيتي العشور المقدسة وأعطيتها للاوي والغريب واليتيم والأرملة، طاعة لوصيتك التي أمرتني بها، فلم أتجاوز وصاياك ولا نسيتها."], [14, "لم أتناول منه في أثناء حزني، ولم آخذ منه وأنا في حالة نجاسة، ولا أعطيت منه لأجل ميت. بل أطعت صوت إلهي وعملت بموجب كل ما أوصيتني به."]]}, {"l": "2Ch 31:6-10", "n": "", "vs": [[6, "كما قدم بنو إسرائيل ويهوذا المقيمون في مدن يهوذا عشور البقر والضأن، وعشور الأقداس المخصصة للرب إلههم، وجعلوها أكواما أكواما."], [7, "وشرعوا في تكويمها في الشهر الثالث وفرغوا منها في الشهر السابع."], [8, "ثم جاء حزقيا ورؤساء الشعب وشاهدوا الأكوام فباركوا الرب وشعبه إسرائيل."], [9, "ولما سأل حزقيا الكهنة واللاويين عن هذه الأكوام،"], [10, "أجابه عزريا رئيس الكهنة من بيت صادوق: «منذ أن أخذ الشعب في التبرع بالتقدمات إلى هيكل الرب، أكلنا وشبعنا، وفضلت عنا هذه الكميات الوافرة، لأن الرب بارك شعبه. وهذه الوفرة قد فضلت عنا»."]]}, {"l": "Psa 16:3", "n": "", "vs": [[3, "كل بهجتي في قديسي الأرض وأفاضلها."]]}, {"l": "Isa 23:18", "n": "", "vs": [[18, "أما تجارتها وأجرتها فتصبح قدسا للرب. لا تخزن ولا تدخر لأن تجارتها توفر غذاء وفيرا، وثيابا فاخرة للساكنين أمام الرب."]]}, {"l": "Isa 55:1", "n": "", "vs": [[1, "تعالوا أيها العطاش جميعا إلى المياه، وهلموا أيها المعدمون من الفضة، ابتاعوا وكلوا، ابتاعوا خمرا ولبنا مجانا من غير فضة."]]}, {"l": "Isa 55:2", "n": "", "vs": [[2, "لماذا تنفقون الفضة على ما ليس بخبز، وتتعبون لغير شبع؟ أحسنوا الاستماع إلي، وكلوا الشهي ولتتمتع أنفسكم بالدسم."]]}, {"l": "Isa 62:8", "n": "", "vs": [[8, "قد أقسم الرب بيمينه وبذراعه القديرة قائلا: لن أعطي حنطتك من بعد طعاما لأعدائك، ولن يشرب الغرباء خمرك التي تعبت فيها،"]]}, {"l": "Isa 62:9", "n": "", "vs": [[9, "بل يأكلها الذين تكبدوا مشقة زرعها، ويحمدون الله . والذين جنوا الكرم يشربون الخمر في ساحات مقدسي."]]}, {"l": "Isa 65:13", "n": "", "vs": [[13, "لذلك هكذا يقول السيد الرب: ها عبيدي يأكلون وأنتم تجوعون، ويشربون وأنتم تظمأون، ويفرحون وأنتم تخزون،"]]}, {"l": "Isa 66:14", "n": "", "vs": [[14, "وتشهدون فتسر قلوبكم وتزدهر عظامكم كالعشب، فتصبح يد الرب معروفة عند عبيده، وينصب غضبه على أعدائه."]]}, {"l": "Mat 25:40", "n": "", "vs": [[40, "فيجيبهم الملك: الحق أقول لكم: بما أنكم فعلتم ذلك بأحد إخوتي هؤلاء الصغار، فبي فعلتم!"]]}, {"l": "Act 11:29", "n": "", "vs": [[29, "لذلك قرر التلاميذ في أنطاكية أن يتبرع كل منهم بما يتيسر له، ويرسلوا إعانة إلى الإخوة المقيمين في اليهودية."]]}, {"l": "2Co 9:11-15", "n": "", "vs": [[11, "إذ تغتنون في كل شيء، لأجل كل سخاء طوعي ينتج بنا شكرا لله"], [12, "ذلك لأن خدمة الله بهذه الإعانة لا تسد حاجة القديسين وحسب، بل تفيض بشكر كثير لله."], [13, "فإن القديسين، إذ يختبرون هذه الخدمة، يمجدون الله على طاعتكم في الشهادة لإنجيل المسيح وعلى السخاء الطوعي في مشاركتكم لهم وللجميع."], [14, "كما يرفعون الدعاء لأجلكم، متشوقين إليكم، بسبب نعمة الله الفائقة التي ظهرت فيكم."], [15, "فشكرا لله على عطيته المجانية التي تفوق الوصف!"]]}, {"l": "Eph 5:18", "n": "", "vs": [[18, "لا تسكروا بالخمر، ففيها الخلاعة، وإنما امتلئوا بالروح،"]]}, {"l": "1Th 3:8", "n": "", "vs": [[8, "فقد طابت لنا الحياة مادمتم ثابتين في الرب!"]]}, {"l": "1Th 3:9", "n": "", "vs": [[9, "فأي شكر نستطيع أن نؤديه إلى الله عوضا عنكم من أجل كل ما نبتهج به من الفرح بسببكم أمام إلهنا،"]]}], "kwAr": "كلوا", "noteAr": ""}, {"kw": "friends", "raw": "Luk_12:4, Luk_15:6, Luk_15:7, Luk_15:9, Luk_15:10; Joh_3:29, Joh_15:14, Joh_15:15", "note": "", "refs": [{"l": "Luk 12:4", "n": "", "vs": [[4, "على أني أقول لكم ياأحبائي: لا تخافوا من الذين يقتلون الجسد ثم لا يستطيعون أن يفعلوا أكثر من ذلك."]]}, {"l": "Luk 15:6", "n": "", "vs": [[6, "ثم يعود إلى البيت، ويدعو الأصدقاء والجيران، قائلا لهم: افرحوا معي، لأني وجدت خروفي الضائع !"]]}, {"l": "Luk 15:7", "n": "", "vs": [[7, "أقول لكم إنه هكذا يكون في السماء فرح بخاطيء واحد تائب أكثر من تسعة وتسعين بارا لا يحتاجون إلى توبة!"]]}, {"l": "Luk 15:9", "n": "", "vs": [[9, "وبعد أن تجده، تدعو الصديقات والجارات قائلة: افرحن معي، لأني وجدت الدرهم الذي أضعته."]]}, {"l": "Luk 15:10", "n": "", "vs": [[10, "أقول لكم: هكذا يكون بين ملائكة الله فرح بخاطيء واحد يتوب»."]]}, {"l": "Joh 3:29", "n": "", "vs": [[29, "ومن له العروس، يكون هو العريس! أما صديق العريس، الذي يقف قربه ويسمعه، فيبتهج لفرحه بصوت العريس. وها إن فرحي هذا قد تم."]]}, {"l": "Joh 15:14", "n": "", "vs": [[14, "وأنتم أحبائي إن عملتم بما أوصيكم به."]]}, {"l": "Joh 15:15", "n": "", "vs": [[15, "لا أسميكم عبيدا بعد، لأن العبد لا يطلعه سيده على ما يفعله. ولكني قد سميتكم أحباء لأني أطلعتكم على كل ما سمعته من أبي."]]}], "kwAr": "الخلان", "noteAr": ""}, {"kw": "yea, drink abundantly, O beloved", "raw": "or, and be drunken with loves, Zec_9:15-17; Rev_22:17", "note": "or, and be drunken with loves, Zec_9:15-17; Rev_22:17", "refs": [{"l": "Zec 9:15-17", "n": "", "vs": [[15, "يقيهم الرب القدير فلا تنالهم حجارة المقلاع، بل تقصر عنهم ويطأونها، ويشربون (من دماء أعدائهم) ويصخبون كالسكارى من الخمر ويمتلئون كمناضح المحرقات وزوايا المذبح."], [16, "في ذلك اليوم يخلصهم الرب إلههم لأنهم شعبه قطيعه، ويتألقون في أرضه كحجارة كريمة مرصعة في تاج."], [17, "فما أجملهم وما أبهاهم! الحنطة تجعل الفتيان أكثر ازدهارا، والخمرة تجعل الفتيات أكثر نضرة»."]]}, {"l": "Rev 22:17", "n": "", "vs": [[17, "الروح والعروس يقولان: «تعال!» ومن يسمع فليردد النداء: «تعال!»"]]}], "kwAr": "اشربوا حتى الانتشاء", "noteAr": "أو: واسكروا بالحُبَّيْن. انظر زك 9: 15-17؛ رؤ 22: 17"}], "arS": [["(المحب): قد ", []], ["جئت", ["H935"]], [" إلى ", []], ["جنتي", ["H1588"]], [" ", []], ["ياأختي", ["H269"]], ["، ", []], ["ياعروسي", ["H3618"]], ["، ", []], ["وقطفت", [[1, "(المحبوبة): طوال الليل على مضجعي طلبت بشوق من تحبه نفسي، فما وجدته."]]}, {"l": "Son 3:2", "n": "", "vs": [[2, "سأنهض الآن أطوف في المدينة وأتجول في شوارعها وساحاتها، ألتمس من تحبه نفسي. وهكذا رحت ألتمسه فما وجدته."]]}, {"l": "1Sa 28:6", "n": "", "vs": [[6, "فاستشار الرب فلم يجبه لا بأحلام ولا بالأوريم ولا عن طريق الأنبياء."]]}, {"l": "Psa 22:1", "n": "", "vs": [[1, "إلهي، إلهي، لماذا تركتني؟ لماذا تباعدت عن خلاصي وعن سماع صوت تنهداتي؟"]]}, {"l": "Psa 22:2", "n": "", "vs": [[2, "إلهي، أصرخ إليك مستغيثا في النهار فلا تجيبني، وفي الليل فلا راحة لي،"]]}, {"l": "Psa 28:1", "n": "", "vs": [[1, "يارب إليك أصرخ، فلا تتصامم عني ياصخرتي، لئلا أكون، إذا سكت عني، مثل المنحدرين إلى الهاوية."]]}, {"l": "Psa 80:4", "n": "", "vs": [[4, "يارب إله الجنود، إلى متى تظل غاضبا على صلاة شعبك."]]}, {"l": "Psa 88:9-14", "n": "", "vs": [[9, "كلت عيناي من فرط البكاء. إياك يارب دعوت كل يوم باسطا إليك يدي."], [10, "هل تصنع عجائب للأموات، أم تقوم أشباح الموتى فتمجدك؟"], [11, "أفي القبر تعلن رحمتك، وفي الهاوية أمانتك؟"], [12, "هل في الظلام تعرف عجائبك، وفي أرض النسيان يظهر برك؟"], [13, "أما أنا فإليك أصرخ مستغيثا يارب، وفي الصباح تمثل صلاتي أمامك."], [14, "لماذا يارب ترفض نفسي، وتحجب عني وجهك؟"]]}, {"l": "Isa 58:2-4", "n": "", "vs": [[2, "ومع ذلك، فإنهم يلتمسونني يوميا، ويسرون بمعرفة طرقي وكأنهم أمة تصنع برا، وكأنهم لم يهملوا أحكام إلههم، يطلبون مني أحكام بر، ويغتبطون بالتقرب من الله."], [3, "ويسألون: ما بالنا صمنا وأنت لم تلاحظ، وتذللنا ولم تحفل بذلك؟. إنكم في يوم صومكم تلتمسون مسرة أنفسكم وتسخرون جميع عمالكم."], [4, "وها أنتم تصومون لكي تتخاصموا وتتشاجروا فقط، وتتضاربوا بكلمات أثيمة. إن مثل صومكم اليوم لا يجعل أصواتكم مسموعة في العلاء."]]}, {"l": "Isa 58:7-9", "n": "", "vs": [[7, "ألا يكون في مشاطرة خبزك مع الجائع، وإيواء الفقير المتشرد في بيتك. وكسوة العريان الذي تلتقيه، وعدم التغاضي عن قريبك البائس؟"], [8, "عندئذ يشع نورك كالصباح، وتزهر عافيتك سريعا، ويتقدمك برك، ويحرس مجد الرب مؤخرة ساقتك."], [9, "عندئذ تدعو فيستجيب الرب. تستغيث فيقول ها أنا. إن أزلت من وسط بيتك النير، والإيماء بالأصبع لمزارعون على العبيد، فضربوا أحدهم، وقتلوا غيره، ورجموا الآخر بالحجارة."], [36, "ثم أرسل رب البيت ثانية عبيدا آخرين أكثر عددا من الأولين. ففعل المزارعون بهؤلاء ما فعلوه بأولئك."], [37, "وأخيرا أرسل إليهم ابنه، قائلا: سيهابون ابني!"], [38, "فما إن رأى المزارعون الابن حتى قال بعضهم لبعض: هذا هو الوريث! تعالوا نقتله فنستولي على ميراثه."], [39, "ثم قبضوا عليه، وطرحوه خارج الكرم، وقتلوه!"], [40, "فعندما يعود رب الكرم، ماذا يفعل بأولئك المزارعين؟»"], [41, "أجابوه: «أولئك الأشرار، يهلكهم شر هلاك. ثم يسلم الكرم إلى مزارعين آخرين يؤدون له الثمر في أوانه»."]]}, {"l": "Mat 23:2", "n": "", "vs": [[2, "وقال: «اعتلى الكتبة والفريسيون كرسي موسى:"]]}, {"l": "Mat 23:29-36", "n": "", "vs": [[29, "«الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تبنون قبور الأنبياء وتزينون مدافن الأبرار،"], [30, "وتقولون: لو عشنا في زمن آبائنا لما شاركناهم في سفك دم الأنبياء."], [31, "فبهذا تشهدون على أنفسكم بأنكم أبناء قاتلي الأنبياء!"], [32, "فأكملوا ما بدأه آباؤكم ليطفح الكيل!"], [33, "أيها الحيات، أولاد الأفاعي! كيف تفلتون من عقاب جهنم؟"], [34, "لذلك: ها أنا أرسل إليكم أنبياء وحكماء ومعلمين، فبعضهم تقتلون وتصلبون، وبعضهم تجلدون في مجامعكم، وتطاردونهم من مدينة إلى أخرى."], [35, "وبهذا يقع عليكم كل دم زكي سفك على الأرض: من دم هابيل البار إلى دم زكريا بن برخيا الذي قتلتموه بين الهيكل والمذبح."], [36, "الحق أقول لكم: إن عقاب ذلك كله سينزل بهذا الجيل."]]}], "kwAr": "حراس الأسوار", "noteAr": ""}, {"kw": "took", "raw": "Luk_6:22; Act_5:40, Act_5:41; 1Co_4:10-13; Heb_11:36, Heb_11:37, Heb_12:2; 1Pe_4:14-16", "note": "", "refs": [{"l": "Luk 6:22", "n": "", "vs": [[22, "طوبى لكم متى أبغضكم الناس، وعزلوكم، وأهانوا اسمكم ونبذوه كأنه شرير، من أجل ابن الإنسان."]]}, {"l": "Act 5:40", "n": "", "vs": [[40, "فعمل أعضاء المجلس بهذه النصيحة، واستدعوا الرسل، فجلدوهم وأمروهم ألا يعلموا باسم يسوع، ثم أطلقوهم."]]}, {"l": "Act 5:41", "n": "", "vs": [[41, "ولكن الرسل خرجوا من المجلس فرحين، لأنهم اعتبروا أهلا لأن يلقوا الإهانة من أجل اسم يسوع."]]}, {"l": "1Co 4:10-13", "n": "", "vs": [[10, "نحن جهلاء من أجل المسيح، وأنتم حك ضبي عنكم لأني رحيم، ولن أسخط عليكم إلى الأبد."], [13, "إنما اعترفي بإثمك وأقري أنك قد تمردت على الرب إلهك، وأغدقت غرامك على الغرباء تحت كل شجرة خضراء، وأنك أبيت طاعة صوتي."], [14, "فارجعوا أيها الأبناء الغادرون، لأني أنا سيدكم، فآخذكم واحدا من المدينة واثنين من العشيرة وآتي بكم إلى صهيون،"]]}, {"l": "Jer 3:22", "n": "", "vs": [[22, "«فارجعوا أيها الأبناء المرتدون فأشفي ارتدادكم». ويقولون: «ها نحن نقبل إليك لأنك أنت الرب إلهنا."]]}, {"l": "Hos 14:1-4", "n": "", "vs": [[1, "ارجع تائبا ياإسرائيل إلى الرب إلهك، لأنك قد تعثرت بخطيئتك."], [2, "احملوا معكم كلام ابتهال وارجعوا إلى الرب قائلين له: «انزع إثمنا، وتقبلنا بفائق رحمتك، فنزجي إليك حمد شفاهنا كالقرابين."], [3, "إن أشور لن تخلصنا، ولن نعتمد على خيول مصر لإنقاذنا، ولن نقول للأوثان صنعة أيدينا: «أنتم آلهتنا» لأن فيك وحدك يجد اليتيم رحمة»."], [4, "أنا أبريء ارتدادهم وأحبهم فضلا، لأن غضبي قد تحول عنهم."]]}], "kwAr": "ارجعي", "noteAr": ""}, {"kw": "What", "raw": "Son_1:6; Luk_7:44, Luk_15:10; 2Th_1:10", "note": "", "refs": [{"l": "Son 1:6", "n": "", "vs": [[6, "(المحبوبة): لا تحدقن إلي لأنني سمراء، فإن الشمس قد لوحتني. إخوتي قد غضبوا مني فأقاموني ناطورة للكروم، أما كرمي فلم أنطره."]]}, {"l": "Luk 7:44", "n": "", "vs": [[44, "ثم التفت إلى المرأة، وقال لسمعان: «أترى هذه المرأة؟ إني دخلت بيتك ولم تقدم لي ماء لغسل قدمي! أما هي، فقد غسلت قدمي بالدموع ومسحتهما بشعرها."]]}, {"l": "Luk 15:10", "n": "", "vs": [[10, "أقول لكم: هكذا يكون بين ملائكة الله فرح بخاطيء واحد يتوب»."]]}, {"l": "2Th 1:10", "n": "", "vs": [[10, "عندما يعود في ذلك اليوم ليتمجد في قديسيه ويكون موضع العجب عند جميع الذين آمنوا، وأنتم قد آمنتم بشهادتنا لكم!"]]}], "kwAr": "ماذا ترون", "noteAr": ""}, {"kw": "Shulamite", "raw": "Gen_49:10; Psa_76:2; Isa_8:6; Joh_9:7; Heb_7:2", "note": "", "refs": [{"l": "Gen 49:10", "n": "", "vs": [[10, "لا يزول صولجان الملك من يهوذا ولا مشترع من صلبه حتى يأتي شيلوه (ومعناه: من له الأمر) فتطيعه الشعوب."]]}, {"l": "Psa 76:2", "n": "", "vs": [[2, "خيمته في أورشليم ومسكنه في جبل صهيون."]]}, {"l": "Isa 8:6", "n": "", "vs": [[6, "«من حي للعيون التي ترى ما أنتم ترون."]]}, {"l": "Luk 10:24", "n": "", "vs": [[24, "فإني أقول لكم إن كثيرين من الأنبياء والملوك تمنوا أن يروا ما تبصرون ولكنهم لم يروا، وأن يسمعوا ما تسمعون ولكنهم لم يسمعوا»."]]}, {"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}, {"l": "Heb 2:11", "n": "", "vs": [[11, "فإن للمسيح الذي يقدس المؤمنين به، وللمقدسين أنفسهم، أبا واحدا. لهذا، لا يستحي المسيح أن يدعو المؤمنين به إخوة له."]]}, {"l": "Heb 2:12", "n": "", "vs": [[12, "إذ يقول الكتاب بلسانه: «أعلن اسمك لإخوتي. وأسبحك في وسط الجماعة!»"]]}], "kwAr": "ليتك", "noteAr": ""}, {"kw": "sucked", "raw": "Isa_66:11, Isa_66:12; Gal_4:26", "note": "", "refs": [{"l": "Isa 66:11", "n": "", "vs": [[11, "لكي ترضعوا وتشبعوا من ثدي تعزياتها، ولكي تحلبوا بوفرة وتتلذذوا من درة مجدها."]]}, {"l": "Isa 66:12", "n": "", "vs": [[12, "لأنه هكذا يقول الرب: ها أنا أسبغ عليها الخير كنهر، وأجري إليها ثروة الأمم كسيل متدفق، فترضعون، وتحملون في الحضن، وعلى ركبتيها تدللون."]]}, {"l": "Gal 4:26", "n": "", "vs": [[26, "أما الثاني، فرمزه الحرة التي تمثل أورشليم السماوية التي هي أمنا."]]}], "kwAr": "رضع", "noteAr": ""}, {"kw": "find thee", "raw": "Joh_1:14, Joh_3:13, Joh_8:42, Joh_13:3, Joh_16:28; Heb_2:9-14, Heb_9:26-28", "note": "", "refs": [{"l": "Joh 1:14", "n": "", "vs": [[14, "والكلمة صار بشرا، وخيم بيننا، ونحن رأينا مجده، مجد ابن وحيد عند الآب، وهو ممتلىء بالنعمة والحق."]]}, {"l": "Joh 3:13", "n": "", "vs": [[13, "وما صعد أحد إلى السماء إلا الذي نزل من السماء، وهو ابن الإنسان الذي هو في السماء."]]}, {"l": "Joh 8:42", "n": "", "vs": [[42, "فقال يسوع: «لو كان الله أباكم لكنتم تحبونني، لأني خرجت من الله وجئت. لم آت من نفسي، بل هو الذي أرسلني."]]}, {"l": "Joh 13:3", "n": "", "vs": [[3, "وكان يسوع عالما أن الآب قد جعل كل شيء في يديه وأنه من الله خرج وإلى الله سيعود،"]]}, {"l": "Joh 16:28", "n": "", "vs": [[28, "خرجت من عند الآب، وأتيت إلى العالم. وها أنا أترك العالم وأعود إلى الآب»."]]}, {"l": "Heb 2:9-14", "n": "", "vs": [[9, "إلا أننا نرى يسوع الآن مكللا بالمجد والكرامة، لأنه قاسى الموت. وذلك بعدما صار أدنى من الملائكة إلى حين، ليذوق بنعمة الله الموت عوضا عن كل واحد."], [10, "فلما قصد الله ، الذي من أجله كل شيء وبه كل شيء، أن يحضر إلى المجد أبناء كثيرين، كان من اللائق أن يجعل قائدهم إلى الخلاص مؤهلا لإكمال مهمته عن طريق الآلام."], [11, "فإن للمسيح الذي يقدس المؤمنين به، وللمقدسين أنفسهم، أبا واحدا. لهذا، لا يستحي المسيح أن يدعو المؤمنين به إخوة له."], [12, "إذ يقول الكتاب بلسانه: «أعلن اسمك لإخوتي. وأسبحك في وسط الجماعة!»"], [13, "ويقول أيضا: «وأنا أكون متوكلا عليه!» وأيضا: «ها أنا مع الأولاد الذين وهبهم الله لي!»"], [14, "إذن، بما أن هؤلاء الأولاد متشاركون في أجسام بشرية من لحم ودم، اشترك المسيح أيضا في اللحم والدم باتخاذه جسما بشريا. وهكذا تمكن أن يموت، ليقضي على من له سلطة الموت، أي إبليس،"]]}, {"l": "Heb 9:26-28", "n": "", "vs": [[26, "وإلا لكان يجب أن يموت المسيح متألما مرات كثيرة منذ تأسيس العالم! ولكنه الآن، عند انتهاء الأزمنة، ظهر مرة واحدة ليبطل قوة الخطيئة بتقديم نفسه ذبيحة لله."], [27, "فكما أن مصير الناس المحتوم، هو أن يموتوا مرة واحدة ثم تأتي الدينونة،"], [28, "كذلك المسيح أيضا: مات مرة واحدة حاملا خطايا كثيرين، مقربا نفسه (لله) عوضا عنهم. ولا بد أن يعود إلى الظهور. لا ليعالج الخطايا، بل ليحقق الخلاص النهائي لجميع منتظريه!"]]}], "kwAr": "التقيتك", "noteAr": ""}, {"kw": "I would", "raw": "Son_1:2; Psa_2:12, Psa_45:10, Psa_45:11; Luk_7:45-48, Luk_9:26, Luk_12:8; Joh_7:46-52; Joh_9:25-38; Gal_6:14; Phi_3:3, Phi_3:7, Phi_3:8", "note": "", "refs": [{"l": "Son 1:2", "n": "", "vs": [[2, "(المحبوبة): ليلثمني بقبلات فمه، لأن حبك ألذ من الخمر."]]}, {"l": "Psa 2:12", "n": "", "vs": [[12, "قبلوا الابن لئلا يغضب، فتهلكوا في الطريق، لئلا يتوهج غضبه سريعا. طوبى لجميع المتكلين عليه."]]}, {"l": "Psa 45:10", "n": "", "vs": [[10, "اسمعي يابنت وانظري، وأرهفي إلي أذنك، وانسي شعبك وبيت أبيك"]]}, {"l": "Psa 45:11", "n": "", "vs": [[11, "فيشتهي الملك جمالك، لأنه هو سيدك فاسجدي له."]]}, {"l": "Luk 7:45-48", "n": "", "vs": [[45, "أنت لم تقبلني قبلة واحدة! أما هي، فمنذ دخولي لم تتوقف عن تقبيل قدمي."], [46, "أنت لم تدهن رأسي بزيت! أما هي، فقد دهنت قدمي بالعطر."], [47, "لهذا السبب أقول لك: إن خطاياها الكثيرة قد غفرت، لهذا أحبت كثيرا. ولكن الذي يغفر له القليل، يحب قليلا!»"], [48, "ثم قال لها: «مغفورة لك خطاياك!»"]]}, {"l": "Luk 9:26", "n": "", "vs": [[26, "فإن من يستحي بي وبكلامي، فبه يستحي ابن الإنسان لدى عودته في مجده ومجد الآب والملائكة المقدسين."]]}, {"l": "Luk 12:8", "n": "", "vs": [[8, "«ولكن أقول لكم: كل من يعترف بي أمام الناس، يعترف به ابن الإنسان أيضا أمام ملائكة الله."]]}, {"l": "Joh 7:46-52", "n": "", "vs": [[46, "فأجابوا: «لم نسمع قط إنسانا يتكلم بمثل كلامه!»"], [47, "فردوا غاضبين: «وهل ضللتم أنتم أيضا؟"], [48, "أرأيتم أحدا من الرؤساء أو من الفريسيين آمن به؟"], [49, "أما عامة الشعب الذين يجهلون الشريعة، فاللعنة عليهم!»"], [50, "ولكن واحدا منهم، وهو نيقوديموس الذي كان قد جاء إلى يسوع ليلا،"], [51, "قال لهم: «أتسمح شريعتنا بأن يحكم على أحد دون سماع دفاعه أولا لمعرفة ذنبه؟»"], [52, "فأجابوه: «ألعلك أنت أيضا من الجليل؟ ادرس الكتاب تعلم أنه لم يطلع قط نبي من الجليل!»"]]}, {"l": "Joh 9:25-38", "n": "", "vs": [[25, "فأجاب: «أخاطيء هو، لست أعلم! إنما أعلم شيئا واحدا: أني كنت أعمى والآن أبصر!»"], [26, "فسألوه ثانية: «ماذا فعل بك؟ كيف فتح عينيك؟»"], [27, "أجابهم: «قد قلت لكم ولم تسمعوا لي، فلماذا تريدون أن تسمعوا مرة ثانية؟ ألعلكم تريدون أنتم أيضا أن تصيروا تلاميذ له؟»"], [28, "فشتموه وقالوا له: «بل أنت تلميذه ! أما نحن فتلاميذ موسى."], [29, "نحن نعلم أن موسى كلمه الله ؛ أما هذا، فلا نعلم له أصلا!»"], [30, "فأجابهم الرجل: «إن في ذلك عجبا! إنه فتح عيني، وتقولون إنكم لا تعلمون له أصلا!"], [31, "نحن نعلم أن الله لا يستجيب للخاطئين، ولكنه يستمع لمن يتقيه ويعمل بإرادته،"], [32, "ولم يسمع على مدى الأجيال أن أحدا فتح عيني مولود أعمى!"], [33, "فلو لم يكن هو من الله، لما استطاع أن يعمل شيئا»."], [34, "فصاحوا به: «أنت بكاملك ولدت في الخطيئة وتعلمنا؟!» ثم طردوه خارج المجمع."], [35, "وعرف يسوع بطرده خارجا، فقصد إليه وسأله: «أتؤمن بابن الله؟»"], [36, "أجاب: «من هو ياسيد حتى أومن به؟»"], [37, "فقال له يسوع: «الذي قد رأيته، والذي يكلمك، هو نفسه!»"], [38, "فقال: «أنا أومن ياسيد!» وسجد له."]]}, {"l": "Gal 6:14", "n": "", "vs": [[14, "أما أنا فحاشا لي أن أفتخر إلا بصليب ربنا يسوع المسيح، الذي به أصبح العالم بالنسبة لي مصلوبا، وأنا أصبحت بالنسبة له مصلوبا."]]}, {"l": "Phi 3:3", "n": "", "vs": [[3, "فإننا نحن أهل الختان الحق، لأننا إنما نعبد بروح الله ونفتخر في المسيح يسوع، ولا نعتمد على أمور الجسد،"]]}, {"l": "Phi 3:7", "n": "", "vs": [[7, "ولكن، ما كان لي من ربح، فقد اعتبرته خسارة، من أجل المسيح."]]}, {"l": "Phi 3:8", "n": "", "vs": [[8, "بل إني أعتبر كل شيء خسارة، من أجل امتياز معرفة المسيح يسوع ربي؛ فمن أجله تحملت خسارة كل شيء، وأعتبر كل شيء نفاية، لكي أربح المسيح"]]}], "kwAr": "أقبلك", "noteAr": ""}, {"kw": "yea", "raw": "Psa_51:17, Psa_102:16, Psa_102:17; Mar_12:42-44, Mar_14:6-9", "note": "", "refs": [{"l": "Psa 51:17", "n": "", "vs": [[17, "إن الذبائح التي يطلبها الله هي روح منكسرة. فلا تحتقرن القلب المنكسر والمنسحق ياالله ."]]}, {"l": "Psa 102:16", "n": "", "vs": [[16, "لأن الرب بنى صهيون وتجلى في مجده."]]}, {"l": "Psa 102:17", "n": "", "vs": [[17, "التفت إلى صلاة البائسين ولم يرفض دعاء المتضايقين."]]}, {"l": "Mar 12:42-44", "n": "", "vs": [[42, "ثم جاءت أرملة فقيرة وألقت فلسين يساويان ربعا واحدا."], [43, "فدعا تلاميذه وقال لهم: «الحق أقول لكم: إن هذه الأرملة الفقيرة قد ألقت أكثر من جميع الذين ألقوا في الصندوق:"], [44, "لأن جميعهم ألقوا من الفاضل عن حاجتهم، ولكنها هي ألقت من حاجتها كل ما عندها ألقت معيشتها كلها ! »"]]}, {"l": "Mar 14:6-9", "n": "", "vs": [[6, "غير أن يسوع قال: «اتركوها! لماذا تضايقونها؟ إنها عملت بي عملا حسنا."], [7, "فإن الفقراء عندكم في كل حين، ومتى شئتم تستطيعون أن تحسنوا إليهم. أما أنا فلن أكون عندكم في كل حين."], [8, "إنها عملت ما تقدر عليه. فقد سبقت فعطرت جسدي إعدادا للدفن."], [9, "والحق أقول لكم: إنه حيث يبشر بالإنجيل في العالم أجمع، يحدث أيضا بما عملته هذه المرأة، إحياء لذكرها! »"]]}], "kwAr": "وليس", "noteAr": ""}, {"kw": "I should not be despised", "raw": "Heb. they should not despise me, Isa_60:14; Luk_10:16, Luk_18:9; 1Co_1:28", "note": "Heb. they should not despi ات!»"]]}, {"l": "Joh 5:39", "n": "", "vs": [[39, "أنتم تدرسون الكتب لأنكم تعتقدون أنها ستهديكم إلى الحياة الأبدية. هذه الكتب تشهد لي،"]]}, {"l": "Joh 5:46", "n": "", "vs": [[46, "فلو كنتم صدقتم موسى، لكنتم صدقتموني، لأنه هو كتب عني."]]}, {"l": "Joh 5:47", "n": "", "vs": [[47, "وإذا كنتم لا تصدقون ما كتبه موسى، فكيف تصدقون كلامي؟»"]]}, {"l": "Act 17:11", "n": "", "vs": [[11, "وكان يهود بيرية أشرف من يهود تسالونيكي، فقبلوا كلمة الله برغبة شديدة، وأخذوا يدرسون الكتاب يوميا ليتأكدوا من صحة التعليم."]]}, {"l": "Act 17:12", "n": "", "vs": [[12, "فآمن عدد كبير منهم، كما آمن من اليونانيين نساء نبيلات وعدد كبير من الرجال."]]}, {"l": "2Ti 3:15", "n": "", "vs": [[15, "وتعلم أنك منذ حداثة سنك تعرف الكتب المقدسة، وهي القادرة أن تجعلك حكيما لبلوغ الخلاص عن طريق الإيمان في المسيح يسوع."]]}, {"l": "1Pe 1:10-12", "n": "", "vs": [[10, "وكم فتش الأنبياء قديما وبحثوا عن هذا الخلاص! فهم تنبأوا عن نعمة الله التي كان قد أعدها لكم أنتم،"], [11, "واجتهدوا لمعرفة الزمان والأحوال التي كان يشير إليها روح المسيح الذي كان عاملا فيهم، عندما شهد لهم مسبقا بما ينتظر المسيح من آلام، وبما يأتي بعدها من أمجاد."], [12, "ولكن الله أوحى إليهم أن اجتهادهم لم يكن لمصلحتهم هم، بل لمصلحتكم أنتم. فقد كان ذلك من أجل البشارة التي نقلها إليكم في الزمان الحاضر مبشرون يؤيدهم الروح القدس المرسل من السماء. ويالها من أمور يتمنى حتى الملائكة أن يطلعوا عليها!"]]}, {"l": "2Pe 1:19", "n": "", "vs": [[19, "وهكذا، صارت الكلمة النبوية أكثر ثباتا عندنا. فحسنا تفعلون إن انتبهتم إلى هذه الكلمة في قلوبكم. إذ إنها أشبه بمصباح يضيء في مكان مظلم، إلى أن يطلع النهار ويظهر كوكب الصبح."]]}, {"l": "Rev 19:10", "n": "", "vs": [[10, "فجثوت عند قدميه لأسجد له، فقال لي: «لا تفعل! إني عبد لله، مثلك ومثل إخوتك المؤمنين الذين لديهم الشهادة المختصة بيسوع: لله اسجد! فإن الشهادة المختصة بيسوع هي روح النبوءة»."]]}], "kwAr": "تعلمني", "noteAr": ""}, {"kw": "I would cause", "raw": "Son_4:10-16, Son_5:1, Son_7:9, Son_7:12", "note": "", "refs": [{"l": "Son 4:10-16", "n": "", "vs": [[10, "ما أعذب حبك ياأختي ياعروسي! لكم حبك ألذ من الخمر، وأريج أطيابك "n": "", "vs": [[3, "(المحبوبة): حبيبي بين الفتيان كشجرة تفاح بين أشجار الوعر، تحت ظله اشتهيت أن أجلس، وثمره حلو لحلقي."]]}, {"l": "Hos 12:4", "n": "", "vs": [[4, "تصارع مع الملاك وغلب. بكى والتمس رضاه وبركته، التقاه الله في بيت إيل فخاطبه هناك."]]}, {"l": "Joh 1:48-51", "n": "", "vs": [[48, "فسأله نثنائيل: «ومن أين تعرفني؟» فأجابه يسوع: «رأيتك تحت التينة قبل أن يدعوك فيلبس»."], [49, "فهتف نثنائيل قائلا: «يامعلم، أنت ابن الله! أنت ملك إسرائيل!»"], [50, "فقال له يسوع: «هل آمنت لأني قلت لك إني رأيتك تحت التينة؟ سوف ترى أعظم من هذا!»"], [51, "ثم قال له: «الحق الحق أقول لكم: إنكم سترون السماء مفتوحة، وملائكة الله يصعدون وينزلون على ابن الإنسان!»"]]}], "kwAr": "أيقظت", "noteAr": ""}, {"kw": "there she", "raw": "Son_8:1, Son_3:4, Son_3:11; Isa_49:20-23; Rom_7:4; Gal_4:19", "note": "", "refs": [{"l": "Son 8:1", "n": "", "vs": [[1, "(المحبوبة): ليتك كنت أخي الذي رضع ثدي أمي، حتى إذا التقيتك في الخارج أقبلك وليس من يلومني!"]]}, {"l": "Son 3:4", "n": "", "vs": [[4, "وما كدت أتجاوزهم حتى وجدت من تحبه نفسي، فتشبثت به ولم أطلقه حتى أدخلته بيت أمي ومخدع من حملت بي."]]}, {"l": "Son 3:11", "n": "", "vs": [[11, "(المحبوبة): اخرجن يابنات صهيون وانظرن الملك سليمان مكللا بالتاج الذي توجته به أمه في يوم عرسه، في يوم بهجة قلبه."]]}, {"l": "Isa 49:20-23", "n": "", "vs": [[20, "ويقول أيضا في مسامعك بنوك المولودون في أثناء ثكلك: إن المكان أضيق من أن يسعنا، فأفسحي لنا حتى نسكن."], [21, "فتسألين نفسك: من أنجب لي هؤلاء وأنا ثكلى وعاقر، منفية ومنبوذة؟ من ربى لي هؤلاء؟ فقد تركت وحدي، أما هؤلاء فمن أين جاءوا؟"], [22, "وهذا ما يقوله السيد الرب: ها أنا أرفع يدي إلى الأمم وأنصب رايتي إلى الشعوب، فيحملون أبناءك في أحضانهم وبناتك على أكتافهم."], [23, "يكون لك الملوك آباء مربين، وملكاتهم مرضعات، ينحنون أمامك بوجوه مطرقة إلى الأرض، ويلحسون تراب قدميك. عندئذ تدركين أنني أنا الرب، وكل من يتكل علي لا يخزى»."]]}, {"l": "Rom 7:4", "n": "", "vs": [[4, "وهكذا أنتم أيضا ياإخوتي، فإنكم بجسد المسيح الذي مات، قد صرتم أمواتا بالنسبة للشريعة، لكي تصيروا لآخر، إلى المسيح نفسه الذي أقيم من بين الأموات، من أجل أن نثمر لله."]]}, {"l": "Gal 4:19", "n": "", "vs": [[19, "ياأطفالي الذين أتمخض بكم مرة أخرى إلى أن تتشكل فيكم صورة المسيح."]]}], "kwAr": "تمخضت بك", "noteAr": ""}], "arS": [["(بنات أورشليم): ", []], ["من", ["H4480", "H4310"]], [" ", []], ["هذه", ["H2063"]], [" ", []], ["الصاعدة", ["H5927"]], [" ", []], ["من", ["H5921"]], [" ", []], ["القفر", ["H4057"]], [" ", []], ["متكئة", ["H7514"]], [" على ", []], ["حبيبها", ["H1730"]], ["؟(المحب): ", []], ["تحت", ["H8478"]], [" شجرة ", []], ["التفاح", ["H8598"]], [" ", []], ["حيث", ["H8033"]], [" ", []], ["حبلت", ["H2254"]], [" بك ", []], ["أمك", ["H517"]], ["، ", []], ["وحيث", ["H8033"]], [" ", []], ["تمخضت", ["H2254"]], [" بك ", []], ["وأنجبتك", ["H3205"]], ["، ", []], ["أيقظت", ["H5782"]], [" فيك أشواقك.", []]]}, {"c": 8, "v": 6, "text": "(المحبوبة): اجعلني كخاتم على قلبك، كوشم على ذراعك، فإن المحبة قوية كالموت، والغيرة قاسية كالهاوية. ولهيبها لهيب نار، كأنها نار الرب!", "groups": [{"kw": "as a seal", "raw": "Exo_28:9-12, Exo_28:21, Exo_28:29, Exo_28:30; Isa_49:16; Jer_22:24; Hag_2:23; Zec_3:9; 2Ti_2:19", "note": "", "refs": [{"l": "Exo 28:9-12", "n": "", "vs": [[9, "ثم خذ حجري جزع، وانقش عليهما أسماء رؤساء بني إسرائيل."], [10, "كل ستة أسماء على حجر واحد بحسب تاريخ مواليدهم."], [11, "انقش أسماء رؤساء أسباط بني إسرائيل على الحجرين تماما مثل حفر النقاش الماهر على الخاتم، وطوقهما بإطارين من ذهب."], [12, "وترصع كتفي الرداء بالحجرين، فيكونان حجري تذكار لبني إسرائيل، فيحمل هرون أسماءهم على كتفيه للتذكار أمام الرب."]]}, {"l": "Exo 28:21", "n": "", "vs": [[21, "وتنقش على كل حجر كريم اسم سبط من أسباط بني إسرائيل الاثني عشر على غرار نقش الخاتم المحفورة عليه أسماء الاثني عشر سبطا."]]}, {"l": "Exo 28:29", "n": "", "vs": [[29, "فيحمل هرون أسماء أسباط بني إسرائيل في «صدرة القضاء» على قلبه عندما يدخل إلى القدس، تذكارا دائما أمام الرب"]]}, {"l": "Exo 28:30", "n": "", "vs": [[30, "وتضع أيضا في صدرة القضاء «الأوريم والتميم» ليحملها هرون على قلبه عندما يمثل أمام الرب. وهكذا يحمل هرون على قلبه أمام الرب دائما رمز قضاء بني إسرائيل."]]}, {"l": "Isa 49:16", "n": "", "vs": [[16, "انظروا ها أنا قد نقشتك ياصهيون على كفي، وأسوارك لا تبرح من أمامي."]]}, {"l": "Jer 22:24", "n": "", "vs": [[24, "«حي أنا» يقول الرب، «لو كان كنياهو بن يهوياقيم ملك يهوذا خاتما في يدي اليمنى لنزعته منها."]]}, {"l": "Hag 2:23", "n": "", "vs": [[23, "في ذلك اليوم، يقول الرب القدير، أصطفيك يازربابل بن شألتيئيل عبدي، وأجعلك كخاتم في إصبعي (حاكما باسمي) لأني اخترتك يقول الرب القدير»."]]}, {"l": "Zec 3:9", "n": "", "vs": [[9, "ها هو الحجر الذي وضعته أمام يهوشع، تحرسه سبع أعين، قد شذبته تشذيبا وكتبت عليه، يقول الرب القدير: وأزيل إثم هذه الأرض في يوم واحد."]]}, {"l": "2Ti 2:19", "n": "", "vs": [[19, "إلا أن الأساس الراسخ الذي وضعه الله يظل ثابتا، وعليه هذا الختم: «الرب يعرف خاصته»، وأيضا: «لينفصل عن الإثم كل من يسمي اسم الرب!»"]]}], "kwAr": "كخاتم", "noteAr": ""}, {"kw": "love", "raw": "Son_5:8; Psa_42:1, Psa_42:2, Psa_63:1, Psa_84:2; Joh_21:15-19; Act_20:24, Act_21:13; 2Co_5:14, 2Co_5:15; Phi_1:20-23; Rev_12:11", "note": "", "refs": [{"l": "Son 5:8", "n": "", "vs": [[8, "أستحلفكن يابنات أورشليم إن وجدتن حبيبي أن تبلغنه أني مريضة حبا."]]}, {"l": "Psa 42:1", "n": "", "vs": [[1, "مثلما تشتاق الغزلان إلى جداول المياه، هكذا تشتاق نفسي إليك ياالله ."]]}, {"l": "Psa 42:2", "n": "", "vs": [[2, "نفسي عطشى إلى الله الإله الحي، فمتى أجيء وأمثل أمام الله؟"]]}, {"l": "Psa 63:1", "n": "", "vs": [[1, "ياالله أنت إلهي وإياك أطلب باكرا. عطشت إليك نفسي ويشتاق إليك جسمي في أرض قاحلة يابسة لا ماء فيها."]]}, {"l": "Psa 84:2", "n": "", "vs": [[2, "تتوق بل تحن نفسي إلى ديار الرب. قلبي وجسمي يرنمان بفرح للإله الحي."]]}, {"l": "Joh 21:15-19", "n": "", "vs": [[15, "وبعدما أكلوا سأل يسوع سمعان بطرس: «ياسمعان بن يونا، أتحبني أكثر مما يحبني هؤلاء؟» فأجابه «نعم يارب، أنت تعلم أني أحبك!» فقال له: «أطعم حملاني!»"], [16, "ثم سأله ثانية: «ياسمعان بن يونا، أتحبني؟» فأجابه: «نعم يارب. أنت تعلم أني أحبك!» قال له: «ارع خرافي»"], [17, "فسأله مرة ثالثة: «ياسمعان بن يونا، أتحبني؟» فحزن بطرس لأن يسوع قال له في المرة الثالثة: «أتحبني». وقال له: «يارب، أنت تعلم كل شيء. أنت تعلم أني أحبك!» فقال له يسوع: «أطعم خرافي!"], [18, "الحق الحق أقول لك: إنك لما كنت شابا كنت تربط حزامك على وسطك وتذهب حيث تريد. ولكن عندما تصير شيخا فإنك تمد يديك، وآخر يربط حزامك ويذهب بك حيث لا تريد!»"], [19, "وقد قال يسوع هذا إشارة إلى الميتة التي سوف يموتها بطرس فيمجد بها الله . ولما قال له ذلك، قال له: «اتبعني»."]]}, {"l": "Act 20:24", "n": "", "vs": [[24, "ولكني لا أحسب لحياتي أية قيمة، ما دمت أسعى إلى بلوغ غايتي وإتمام الخدمة التي كلفني إياها الرب يسوع: أن أشهد ببشارة نعمة الله."]]}, {"l": "Act 21:13", "n": "", "vs": [[13, "ولكنه قال لنا: «ما لكم تبكون وتحطمون قلبي؟ إني مستعد ليس فقط لأن أقيد في أورشليم، بل أيضا لأن أموت من أجل اسم الرب يسوع!»"]]}, {"l": "2Co 5:14", "n": "", "vs": [[14, "فإن محبة المسيح تسيطر علينا، وقد حكمنا بهذا: مادام واحد قد مات عوضا عن الجميع، فمعنى ذلك أن الجميع ماتوا؛"]]}, {"l": "2Co 5:15", "n": "", "vs": [[15, "وهو قد مات عوضا عن الجميع حتى لا يعيش الأحياء في ما بعد لأنفسهم بل للذي مات عوضا عنهم ثم قام."]]}, {"l": "Phi 1:20-23", "n": "", "vs": [[20, "وفقا لما أتوقعه وأرجوه: أني لن أفشل في شيء، بل في كل جرأة وكما في كل حين فكذلك الآن أيضا، يتعظم المسيح في جسدي، سواء أكان بالحياة أم بالموت."], [21, "فالحياة عندي هي المسيح، والموت ربح لي."], [22, "ولكن، إن كان لي أن أحيا في الجسد، فحياتي تهييء لي عملا مثمرا. ولست أدري أي الاثنين أختار!"], [23, "فأنا تحت ضغط من كليهما: إذ إني راغب في أن أرحل وأقيم مع المسيح، وهذا أفضل بكثير جدا؛"]]}, {"l": "Rev 12:11", "n": "", "vs": [[11, "وهم قد انتصروا عليه بدم الحمل وبالكلمة التي شهدوا لها، فلم تكن حياتهم عزيزة لديهم، حتى إنهم ماتوا."]]}], "kwAr": "المحبة", "noteAr": ""}, {"kw": "jealousy", "raw": "Num_5:14, Num_25:11; Deu_32:21; Pro_6:34; 2Co_11:2", "note": "", "refs": [{"l": "Num 5:14", "n": "", "vs": [[14, "وإذا اعترت زوجها الغيرة وارتاب بزوجته وكانت نجسة، أو غار على امرأته مع أنها طاهرة."]]}, {"l": "Num 25:11", "n": "", "vs": [[11, "«إن فينحاس بن ألعازار بن هرون الكاهن قد رد غضبي عن بني إسرائيل، إذ غار غيرتي في وسطهم، فلم أفن بني إسرائيل بغيرتي."]]}, {"l": "Deu 32:21", "n": "", "vs": [[21, "هيجوا غيرتي بعبادة أوثانهم،  ثم أقيم أنقاضها وأبنيها من جديد،"], [17, "لكي يسعى إلى الرب باقي الناس وجميع الشعوب التي تحمل اسمي، يقول الرب، فاعل هذه الأمور"]]}, {"l": "Rom 15:9-12", "n": "", "vs": [[9, "وإن الأمم يمجدون الله على الرحمة، وفقا لما قد كتب: «لهذا أعترف لك بين الأمم وأرتل لاسمك!»"], [10, "وأيضا قيل: «افرحوا، أيها الأمم، مع شعبه»."], [11, "وأيضا: «سبحوا الرب ياجميع الأمم، ولتحمده جميع الشعوب»."], [12, "ويقول إشعياء أيضا: «سيطلع أصل يسى، والقائم، ليسود على الأمم: عليه تعلق الشعوب الرجاء»."]]}], "kwAr": "صغيرة", "noteAr": ""}, {"kw": "she hath", "raw": "Son_8:10, Son_4:5, Son_7:3; Psa_147:19, Psa_147:20; Act_7:38; Rom_3:1, Rom_3:2; Eph_2:12", "note": "", "refs": [{"l": "Son 8:10", "n": "", "vs": [[10, "(المحبوبة): أنا كسور ونهداي كبرجين، حينئذ صرت في عينيه كاملة."]]}, {"l": "Son 4:5", "n": "", "vs": [[5, "نهداك كخشفتي ظبية توأمين يرعيان بين السوسن."]]}, {"l": "Son 7:3", "n": "", "vs": [[3, "نهداك كخشفتي ظبية توأمين."]]}, {"l": "Psa 147:19", "n": "", "vs": [[19, "يعلن ليعقوب كلمته ولإسرائيل فرائضه وأحكامه."]]}, {"l": "Psa 147:20", "n": "", "vs": [[20, "لم يعامل أمة أخرى هكذا، ولم يعرفها أحكامه هللويا."]]}, {"l": "Act 7:38", "n": "", "vs": [[38, "وهو الذي كان يقود جماعة الشعب في الصحراء، وقد قام بدور الوسيط بين الملاك الذي كلمه على جبل سيناء وآبائنا، فنقل إليكم وصايا الله الحية."]]}, {"l": "Rom 3:1", "n": "", "vs": [[1, "إذن، ما هو فضل اليهودي؟ بل ما هو نفع الختان؟"]]}, {"l": "Rom 3:2", "n": "", "vs": [[2, "إنه كثير من جميع الجهات، وأهمها فعلا أن أقوال الله وضعت أمانة بين أيديهم."]]}, {"l": "Eph 2:12", "n": "", "vs": [[12, "أنكم كنتم في ذلك الحين بلا مسيح، أجانب عن جماعة إسرائيل، وغرباء عن العهود الموعودة، لا رجاء لكم، ومنكرين لله في العالم."]]}], "kwAr": "لم ينم", "noteAr": ""}, {"kw": "what", "raw": "Psa_2:8, Psa_72:17-19; Isa_49:6, Isa_60:1-5, Isa_60:10, Isa_60:11; Acts 10:1-48, 11:1-18, Act_16:9; Act_22:21, Act_26:17, Act_26:18; Rom_10:12-15; Eph_2:13-15, Eph_2:19-22", "note": "", "refs": [{"l": "Psa 2:8", "n": "", "vs": [[8, "اطلب مني فأعطيك الأمم ميراثا، وأقاصي الأرض ملكا لك."]]}, {"l": "Psa 72:17-19", "n": "", "vs": [[17, "يخلد اسمه إلى الدهر، ويدوم اسمه كديمومة الشمس، ويتبارك الناس به، وتطوبه كل الأمم."], [18, "تبارك الرب إله إسرائيل، فهو وحده صانع العجائب."], [19, "تبارك اسمه المجيد إلى الأبد، ولتمتليء الأرض كلها من مجده. آمين ثم آمين."]]}, {"l": "Isa 49:6", "n": "", "vs": [[6, "لكم هو يسير أن تكون لي عبدا لتستنهض أسباط يعقوب، وترد من نجيت من إسرائيل، لذلك سأجعلك نورا للأمم لتكون خلاصي إلى أقصى الأرض."]]}, {"l": "Isa 60:1-5", "n": "", "vs": [[1, "قومي استضيئي، فإن نورك قد جاء، ومجد الرب أشرق عليك."], [2, "ها إن الظلمة تغمر الأرض، والليل الدامس يكتنف الشعوب، ولكن الرب يشرق عليك، ويتجلى مجده حولك،"], [3, "فتقبل الأمم إلى نورك، وتتوافد الملوك إلى إشراق ضيائك."], [4, "تأملي حولك وانظري، فها هم جميعا قد اجتمعوا، وأتوا إليك. يجيء أبناؤك من مكان بعيد، وتحمل بناتك على الأذرع."], [5, "عندئذ تنظرين وتتهللين، وتطغى الإثارة على قلبك، وتمتلئين فرحا لأن ثروات البحر تتحول إليك وغنى الأمم يتدفق عليك."]]}, {"l": "Isa 60:10", "n": "", "vs": [[10, "يعمر الغرباء أسوارك، ويخدمك ملوكهم، لأني في غضبي عاقبتك، وفي رضاي رحمتك."]]}, {"l": "Isa 60:11", "n": "", "vs": [[11, "تنفتح أبوابك دائما ولا توصد ليل نهار، ليحمل إليك الناس ثروة الأمم، وفي موكب يساق إليك ملوكهم،"]]}, {"l": "Act 10:1-48", "n": "", "vs": [[1, "وكان يسكن في قيصرية قائد مئة اسمه كرنيليوس، ينتمي إلى الكتيبة الإيطالية،"], [2, "وكان تقيا يخاف الله ، هو وأهل بيته جميعا، يتصدق على الشعب كثيرا، ويصلي إلى الله دائما."], [3, "وذات نهار نحو الساعة الثالثة بعد الظهر، رأى كرنيليوس في رؤيا واضحة ملاكا من عند الله يدخل إليه ويقول: «ياكرنيليوس!»"], [4, "فنظر إلى الملاك وقد استولى عليه الخوف، وسأل: «ماذا ياسيد؟» فأجابه: «صلواتك صعدت أمام الله تذكارا."], [5, "والآن أرسل بعض الرجال إلى يافا واستدع سمعان الملقب بطرس."], [6, "إنه يقيم في بيت سمعان الدباغ عند البحر»."], [7, "فما إن ذهب الملاك الذي كان يكلم كرنيليوس، حتى دعا اثنين من خدمه، وجنديا تقيا من مرافقيه الدائمين،"], [8, "وروى لهم الخبر كله، وأرسلهم إلى يافا."], [9, "وفي اليوم التالي، بينما كان الرجال الثلاثة يقتربون من مدينة يافا، صعد بطرس نحو الظهر إلى السطح ليصلي."], [10, "وأحس جوعا شديدا، فاشتهى أن يأكل. وبينما الطعام يعد له، وقعت عليه غيبوبة،"], [11, "فرأى رؤيا: السماء مفتوحة، ووعاء يشبه قطعة كبيرة من القماش مربوطة بأطرافها الأربعة يتدلى إلى الأرض،"], [12, "وهو مليء بأنواع الحيوانات الدابة على الأرض والوحوش والزواحف وطيور السماء جميعا."], [13, "وناداه صوت: «يابطرس، قم اذبح وكل!»"], [14, "ولكن بطرس أجاب: «كلا يارب، فأنا لم آكل قط شيئا محرما أو نجسا»."], [15, "فقال له الصوت أيضا: «ما طهره الله لا تحسبه أنت نجسا!»"], [16, "وتكرر هذا ثلاث مرات، ثم ارتفع الوعاء إلى السماء."], [17, "تحير بطرس وأخذ يسائل نفسه عن معنى الرؤيا التي رآها. وإذا الرجال الذين أرسلهم كرنيليوس قد سألوا عن بيت سمعان الدباغ ووقفوا بالباب"], [18, "يستخبرون: «هل سمعان الملقب بطرس مقيم هنا؟»"], [19, "في هذه الأثناء كان بطرس يواصل التفكير في معنى الرؤيا، فقال له الروح: «بالباب ثلاثة رجال يطلبونك"], [20, "فانزل إليهم ورافقهم بلا تردد، فإني أنا أرسلتهم»."], [21, "فنزل إليهم وقال: «أنا الذي تطلبون. فما سبب حضوركم؟»"], [22, "فأجابوه: «قائد المئة كرنيليوس رجل صالح يتقي الله ، ويشهد له بذلك شعب اليهود جميعا. وقد أوحى الله إليه بواسطة ملاك طاهر أن يستدعيك إلى بيته ليسمع ما عندك من كلام»."], [23, "فدعاهم بطرس ليمضوا الليلة ضيوفا بذلك البيت. وفي الصباح ذهب معهم، يرافقه بعض الإخوة من يافا،"], [24, "فوصلوا قيصرية في اليوم الثاني. وكان كرنيليوس ينتظر وصولهم، وقد دعا أقاربه وأصدقاءه المقربين."], [25, "فما إن دخل بطرس حتى استقبله كرنيليوس ساجدا له،"], [26, "فأنهضه بطرس وقال: «قم! ما أنا إلا إنسان مثلك!»"], [27, "ودخل بطرس وهو يحادثه، فرأى جمعا كبيرا من الناس،"], [28, "فقال لهم: «أنتم تعلمون أنه محرم على اليهودي أن يتعامل مع الأجنبي أو يزوره في بيته. غير أن الله أراني ألا أقول عن إنسان ما إنه دنس أو نجس."], [29, "فلذلك جئت من غير اعتراض، تلبية لدعوتكم. فما هو سبب دعوتكم لي؟»"], [30, "فأجاب كرنيليوس: «منذ أربعة أيام، في مثل هذه الساعة كنت أصلي في بيتي صلاة الساعة الثالثة بعد الظهر فظهر أمامي فجأة رجل يلبس ثوبا براقا"], [31, "وقال لي: ياكرنيليوس، سمع الله صلاتك وذكر صدقاتك."], [32, "والآن أرسل رجالا إلى يافا، واستدع سمعان الملقب بطرس. إنه يقيم في بيت سمعان الدباغ عند البحر."], [33, "فأرسلت حالا أدعوك، وقد أحسنت بمجيئك. ونحن الآن جميعا حاضرون أمام الله لنسمع كل ما أمرك به الرب»."], [34, "فبدأ بطرس كلامه قائلا: «تبين لي فعلا أن الله لا يفضل أحدا على أحد،"], [35, "بل يقبل من يتقيه ويعمل الصلاح مهما كانت جنسيته."], [36, "وقد أرسل كلمته إلى بني إسرائيل، وبشرهم بالسلام بواسطة يسوع المسيح، رب الجميع."], [37, "ولابد أنكم عرفتم بكل ما جرى في بلاد اليهود، وكان بدء الأمر في الجليل بعد المعمودية التي نادى بها يوحنا."], [38, "فقد مسح الله يسوع الناصري بالروح القدس وبالقدرة، فكان ينتقل من مكان إلى مكان يعمل الخير، ويشفي جميع الذين تسلط عليهم إبليس، لأن الله كان معه."], [39, "ونحن شهود على كل ما قام به في بلاد اليهود وفي أورشليم، وقد قتلوه حقا، معلقا على خشبة."], [40, "ولكن الله أقامه من الموت في اليوم الثالث، وجعله يظهر،"], [41, "لا للشعب كله، بل للشهود الذين اختارهم الله من قبل، لنا نحن الذين أكلنا وشربنا معه بعد قيامته من بين الأموات."], [42, "ثم أمرنا أن نبشر شعبنا به، ونشهد أنه هو الذي عينه الله ديانا للأحياء وللأموات."], [43, "له يشهد جميع الأنبياء أن كل من يؤمن به ينال باسمه غفران الخطايا»."], [44, "وبينما كان بطرس يتكلم بهذا الكلام، حل الروح القدس على جميع الذين كانوا يسمعون."], [45, "فدهش المؤمنون اليهود الذين جاءوا برفقة بطرس، لأن هبة الروح القدس فاضت أيضا على غير اليهود،"], [46, "إذ سمعوهم يتكلمون بلغات، ويسبحون الله . فقال بطرس:"], [47, "«أيستطيع أحد أن يمنع الماء فلا يتعمد أيضا هؤلاء الذين نالوا الروح القدس مثلنا؟»"], [48, "وأمر أن يتعمدوا باسم يسوع المسيح. ثم دعوه أن يقيم عندهم بضعة أيام."]]}, {"l": "Act 11:1-18", "n": "", "vs": [[1, "وسمع الرسل والإخوة في اليهودية أن غير اليهود أيضا قبلوا كلمة الله،"], [2, "فما إن عاد بطرس إلى أورشليم حتى جادله دعاة الختان، وعارضوه قائلين:"], [3, "«كيف دخلت بيت رجال غير مختونين، وأكلت معهم؟»"], [4, "فشرح لهم بطرس ما حدث على التوالي، وقال:"], [5, "«كنت أصلي في مدينة يافا، فوقعت علي غيبوبة، فرأيت في رؤيا وعاء يشبه قطعة كبيرة من القماش مربوطة بأطرافها الأربعة، وقد تدلى إلي من السماء."], [6, "وعندما تأملته مليا وجدت فيه أنواع الحيوانات الدابة على الأرض والوحوش والزواحف وطيور السماء جميعا،"], [7, "وسمعت صوتا يقول لي: يابطرس، قم اذبح وكل!"], [8, "فأجبت: كلا يارب، فلم يدخل فمي قط شيء محرم أو نجس."], [9, "فقال لي الصوت السماوي أيضا: ما طهره الله لا تحسبه أنت نجسا."], [10, "وتكرر هذا ثلاث مرات، ثم سحب الوعاء بما فيه إلى السماء."], [11, "وإذا ثلاثة رجال مرسلون إلي من قيصرية وصلوا إلى البيت الذي كنت مقيما فيه،"], [12, "فأمرني الروح أن أذهب معهم بلا تردد، فذهبت، ورافقني هؤلاء الإخوة الستة. وعند دخولنا بيت الرجل،"], [13, "أخبرنا كيف رأى الملاك في بيته واقفا وقائلا له: أرسل رجالا إلى يافا، واستدع سمعان الملقب بطرس،"], [14, "وهو يكلمك كلاما به تخلص أنت وأهل بيتك جميعا."], [15, "ولما ابتدأت أتكلم، حل الروح القدس عليهم كما حل علينا في البداية"], [16, "فتذكرت ما قاله الرب لنا: إن يوحنا عمد بالماء، وأما أنتم فستتعمدون بالروح القدس."], [17, "فإن كان الله قد ساواهم بنا فأعطاهم الهبة التي أعطانا، إذ آمنا بالرب يسوع المسيح، فمن أكون أنا حتى أعيق الله ؟»"], [18, "فلما سمع المعارضون هذا، سكتوا، ومجدوا الله قائلين: «إذن، قد أنعم الله أيضا على غير اليهود بالتوبة لنوال الحياة»."]]}, {"l": "Act 16:9", "n": "", "vs": [[9, "وفي تلك الليلة رأى بولس في رؤيا رجلا من أهل مقدونية يتوسل إليه ويقول: «اعبر إلى مقدونية وأنجدنا!»"]]}, {"l": "Act 22:21", "n": "", "vs": [[21, "ولكنه قال لي: اذهب ... سأرسلك بعيدا: إلى الأمم!»"]]}, {"l": "Act 26:17", "n": "", "vs": [[17, "وسأنقذك من شعبك ومن الأمم التي أرسلك إليها الآن،"]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "Rom 10:12-15", "n": "", "vs": [[12, "فلا فرق بين اليهودي واليوناني، لأن للجميع ربا واحدا، غنيا تجاه كل من يدعوه»."], [13, "«فإن كل من يدعو باسم الرب يخلص»."], [14, "ولكن، كيف يدعون من لم يؤمنوا به؟ وكيف يؤمنون بمن لم يسمعوا به؟ وكيف يسمعون بلا مبشر؟"], [15, "وكيف يبشر أحد إلا إذا كان قد أرسل؟ كما قد كتب: «ما أجمل أقدام المبشرين بالخيرات!»"]]}, {"l": "Eph 2:13-15", "n": "", "vs": [[13, "أما الآن، ففي المسيح يسوع، أنتم الذين كنتم من قبل بعيدين قد صرتم قريبين بدم المسيح."], [14, "فإنه هو سلامنا، ذاك الذي جعل الفريقين واحدا وهدم حائط الحاجز الفاصل بينهما،"], [15, "أي العداء: إذ أبطل بجسده شريعة الوصايا ذات الفرائض، لكي يكون من الفريقين إنسانا واحدا جديدا، إذ أحل السلام بينهما،"]]}, {"l": "Eph 2:19-22", "n": "", "vs": [[19, "إذن، لستم غرباء وأجانب بعد الآن، بل أنتم رعية مع القديسين وأعضاء في عائلة الله،"], [20, "وقد بنيتم على أساس الرسل والأنبياء، والمسيح يسوع نفسه هو حجر الزاوية الأساس،"], [21, "الذي فيه يتناسق البناء كله فيرتفع ليصير هيكلا مقدسا في الرب."], [22, "وفيه أنتم أيضا قد بنيتم معا فصرتم مسكنا لله بوجود الروح."]]}], "kwAr": "فماذا نصنع", "noteAr": ""}, {"kw": "in the day", "raw": "Luk_19:44; 1Pe_2:12", "note": "", "refs": [{"l": "Luk 19:44", "n": "", "vs": [[44, "ويهدمونك على أبنائك الذين فيك، فلا يتركون فيك حجرا فوق حجر: لأنك لم تعرفي وقت افتقاد الله لك»."]]}, {"l": "1Pe 2:12", "n": "", "vs": [[12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالحة يمجدون الله في يوم الافتقاد."]]}], "kwAr": "يوم خطبتها", "noteAr": ""}], "arS": [["لنا ", []], ["أخت", ["H269"]], [" ", []], ["صغيرة", ["H6996"]], [" ", []], ["لم", ["H369"]], [" ينم ", []], ["نهداها", ["H7699"]], [" بعد، ", []], ["فماذا", ["H4100"]], [" ", []], ["نصنع", ["H6213"]], [" ", []], ["لأختنا", ["H269"]], [" في ", []], ["يوم", ["H3117"]], [" ", []], ["خطبتها", ["H1696"]], ["؟", []]]}, {"c": 8, "v": 9, "text": "لو كانت سورا لبنينا عليه صرحا من فضة، ولو كانت بابا لدعمناه بألواح من أرز.", "groups": [{"kw": "a wall", "raw": "Son_2:9; Rev_21:12-19", "note": "", "refs": [{"l": "Son 2:9", "n": "", "vs": [[9, "حبيبي كظبي أو كالأيل الفتي. ها هو واقف وراء جدارنا يرنو من الكوى ويسترق النظر من خلال النوافذ المشبكة."]]}, {"l": "Rev 21:12-19", "n": "", "vs": [[12, "لها سور ضخم عال واثنا عشر بابا يحرسها اثنا عشر ملاكا، وقد كتبت عليها أسماء أسباط إسرائيل الاثني عشر؛"], [13, "إلى الشرق ثلاثة أبواب؛ وإلى الشمال ثلاثة أبواب، وإلى الجنوب ثلاثة أبواب؛ وإلى الغرب ثلاثة أبواب."], [14, "ويقوم سور المدينة على اثنتي عشرة دعامة كتبت عليها أسماء رسل الحمل الاثني عشر."], [15, "وكان الملاك الذي يكلمني يمسك قصبة من الذهب ليقيس بها المدينة وأبوابها وسورها."], [16, "وكانت أرض المدينة مربعة، طولها يساوي عرضها، فلما قاسها بالقصبة تبين أن ضلعها يساوي ألفين وأربعمئة كيلومتر، وهي متساوية الطول والعرض والارتفاع."], [17, "ثم قاس السور، فتبين أنه يساوي مئة وأربعا وأربعين ذراعا، وكان الملاك يستعمل قياسا يعادل ذراع إنسان."], [18, "كانت المدينة مبنية من ذهب خالص شفاف كالزجاج النقي. أما سورها فمن اليشب،"], [19, "وهو قائم على اثنتي عشرة دعامة مرصعة بالأحجار الكريمة: كانت الدعامة الأولى من اليشب؛ والثانية من الياقوت الأزرق؛ والثالثة من العقيق الأبيض؛ والرابعة من الزمرد الذبابي؛"]]}], "kwAr": "سورا", "noteAr": ""}, {"kw": "we will", "raw": "Isa_58:12, Isa_60:17, Isa_61:4; Zec_6:12-15; Mat_16:18; Act_15:16; 1Co_3:10-12; Eph_2:20-22", "note": "", "refs": [{"l": "Isa 58:12", "n": "", "vs": [[12, "ويبني أولادك الخرائب القديمة ويقيمون أساساتها، ويسمون بعد ذلك الشعب الذي بنى أسواره ورمم أحياء مدنه."]]}, {"l": "Isa 60:17", "n": "", "vs": [[17, "وعوضا عن النحاس أجلب لك الذهب، وبدل الحديد آتي لك بالفضة، وعوض الخشب نحاسا، وبدل الحجارة حديدا، وأجعل ولاتك مصدر سلام، ومسخريك يعاملونك بالعدل."]]}, {"l": "Isa 61:4", "n": "", "vs": [[4, "فيعمرون الخرائب القديمة، ويبنون الدمار الغابر، ويرممون المدن المتهدمة، والخرب التي انقضت عليها أجيال."]]}, {"l": "Zec 6:12-15", "n": "", "vs": [[12, "وقل له: هكذا يقول الرب القدير: ها هو الرجل الذي اسمه الغصن، الذي ينبت من ذاته ويبني هيكل الرب."], [13, "هو الذي يبني هيكل الرب ويتجلل بالمجد ويكون نفسه ملكا وكاهنا في آن واحد فيجلس ويحكم على عرشه ويعمل بفضل مشورة رتبتيه على إشاعة السلام بين قومه."], [14, "أما بقية التيجان، فتكون من نصيب حلداي وطوبيا ويدعيا ويوشيا بن صفنيا، وضعها تذكارا في هيكل الرب."], [15, "ويتوافد قوم من بعيد ليبنوا هيكل الرب، فتدركون أن الرب القدير قد أرسلني إليكم. ويتم هذا كله إن أطعتم صوت الرب إلهكم طاعة كاملة»."]]}, {"l": "Mat 16:18", "n": "", "vs": [[18, "وأنا أيضا أقول لك: أنت صخر. وعلى هذه الصخرة أبني كنيستي وأبواب الجحيم لن تقوى عليها!"]]}, {"l": "Act 15:16", "n": "", "vs": [[16, "سأعود من بعد هذا وأبني خيمة داود المنهدمة ثم أقيم أنقاضها وأبنيها من جديد،"]]}, {"l": "1Co 3:10-12", "n": "", "vs": [[10, "وبحسب نعمة الله الموهوبة لي، وضعت الأساس كما يفعل البناء الماهر، وغيري يبني عليه. ولكن، لينتبه كل واحد كيف يبني عليه."], [11, "فليس ممكنا أن يضع أحد أساسا آخر بالإضافة إلى الأساس الموضوع، وهو يسوع المسيح."], [12, "فإن بنى أحد على هذا الأساس ذهبا وفضة وحجارة كريمة، أو خشبا وعشبا وقشا،"]]}, {"l": "Eph 2:20-22", "n": "", "vs": [[20, "وقد بنيتم على أساس الرسل والأنبياء، والمسيح يسوع نفسه هو حجر الزاوية الأساس،"], [21, "الذي فيه يتناسق البناء كله فيرتفع ليصير هيكلا مقدسا في الرب."], [22, "وفيه أنتم أيضا قد بنيتم معا فصرتم مسكنا لله بوجود الروح."]]}], "kwAr": "لبنينا", "noteAr": ""}, {"kw": "a door", "raw": "Act_14:27", "note": "", "refs": [{"l": "Act 14:27", "n": "", "vs": [[27, "ولما وصلا، استدعيا الكنيسة إلى الاجتماع، وأخبرا بكل ما فعل الله بواسطتهما، وبأنه فتح باب الإيمان لغير اليهود."]]}], "kwAr": "بابا", "noteAr": ""}], "arS": [["لو", ["H518"]], [" ", []], ["كانت", ["H1931"]], [" ", []], ["سورا", ["H2346"]], [" ", []], ["لبنينا", ["H1129"]], [" ", []], ["عليه", ["H5921"]], [" ", []], ["صرحا", ["H2918"]], [" ", []], ["من", ["H5921"]], [" ", []], ["فضة", ["H3701"]], ["، ", []], ["ولو", ["H518"]], [" ", []], ["كانت", ["H1931"]], [" ", []], ["بابا", ["H1817"]], [" ", []], ["لدعمناه", ["H6696"]], [" ", []], ["بألواح", ["H3871"]], [" من ", []], ["أرز", ["H730"]], [".", []]]}, {"c": 8, "v": 10, "text": "(المحبوبة): أنا كسور ونهداي كبرجين، حينئذ صرت في عينيه كاملة.", "groups": [{"kw": "a wall", "raw": "Son_8:9", "note": "", "refs": [{"l": "Son 8:9", "n": "", "vs": [[9, "لو كانت سورا لبنينا عليه صرحا من فضة، ولو كانت بابا لدعمناه بألواح من أرز."]]}], "kwAr": "كسور", "noteAr": ""}, {"kw": "my", "raw": "Son_4:5, Son_7:3, Son_7:4, Son_7:7, Son_7:8; Eze_16:7", "note": "", "refs": [{"l": "Son 4:5", "n": "", "vs": [[5, "نهداك كخشفتي ظبية توأمين يرعيان بين السوسن."]]}, {"l": "Son 7:3", "n": "", "vs": [[3, "نهداك كخشفتي ظبية توأمين."]]}, {"l": "Son 7:4", "n": "", "vs": [[4, "عنقك (مصقول) كبرج من
