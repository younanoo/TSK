ية لكل من يؤمن به."]]}, {"l": "Joh 3:16", "n": "", "vs": [[16, "لأنه هكذا أحب الله العالم حتى بذل ابنه الوحيد، لكي لا يهلك كل من يؤمن به، بل تكون له الحياة الأبدية."]]}, {"l": "Joh 3:36", "n": "", "vs": [[36, "من يؤمن بالابن، فله الحياة الأبدية. ومن يرفض أن يؤمن بالابن، فلن يرى الحياة. بل يستقر عليه غضب الله»."]]}, {"l": "Joh 4:4", "n": "", "vs": [[4, "وكان لابد له أن يمر بمنطقة السامرة،"]]}, {"l": "Joh 4:36", "n": "", "vs": [[36, "والحاصد يأخذ أجرته، ويجمع الثمر للحياة الأبدية، فيفرح الزارع والحاصد معا،"]]}, {"l": "Joh 6:40", "n": "", "vs": [[40, "نعم! إن مشيئة أبي هي أن كل من يرى الابن ويؤمن به تكون له الحياة الأبدية، وسأقيمه أنا في اليوم الأخير»."]]}, {"l": "Joh 6:47", "n": "", "vs": [[47, "الحق الحق أقول لكم: إن الذي يؤمن بي فله حياة أبدية."]]}, {"l": "Joh 6:68", "n": "", "vs": [[68, "فأجابه سمعان بطرس: «إلى من نذهب يار ب وعندك كلام الحياة الأبدية."]]}, {"l": "Joh 10:28", "n": "", "vs": [[28, "وأعطيها حياة أبدية، فلا تهلك إلى الأبد، ولا ينتزعها أحد من يدي."]]}, {"l": "Joh 12:50", "n": "", "vs": [[50, "وأنا أعلم أن وصيته هي حياة أبدية: فإن ما أقوله من كلام، أقوله كما قاله لي الآب»."]]}, {"l": "Joh 17:2", "n": "", "vs": [[2, "فقد أوليته السلطة على جميع البشر، ليمنح جميع الذين قد وهبتهم له حياة أبدية."]]}, {"l": "Joh 17:3", "n": "", "vs": [[3, "والحياة الأبدية هي أن يعرفوك أنت الإله الحق وحدك، والذي أرسلته: يسوع المسيح."]]}, {"l": "Rom 5:21", "n": "", "vs": [[21, "حتى إنه كما ملكت الخطيئة بالموت، فكذلك أيضا تملك النعمة على أساس البر مؤدية إلى الحياة الأبدية بيسوع المسيح ربنا."]]}, {"l": "Rom 6:23", "n": "", "vs": [[23, "لأن أجرة الخطيئة هي الموت، وأما هبة الله فهي الحياة الأبدية في المسيح يسوع ربنا."]]}, {"l": "1Ti 1:16", "n": "", "vs": [[16, "ولكن لهذا السبب عوملت بالرحمة، ليجعل يسوع المسيح مني، أنا أولا، مثالا يظهر صبره الطويل، لجميع الذين سيؤمنون به لنوال الحياة الأبدية."]]}, {"l": "Tit 1:2", "n": "", "vs": [[2, "في رجاء الحياة الأبدية، التي وعد بها الله المنزه عن الكذب، من قبل أزمنة الأزل،"]]}, {"l": "Jud 1:21", "n": "", "vs": [[21, "واحفظوا أنفسكم في محبة الله n": "", "vs": [[1, "ثم أراني الملاك نهر ماء الحياة صافيا كالبلور، ينبع من عرش الله والحمل"]]}], "kwAr": "هذه الحياة هي في ابنه", "noteAr": ""}], "arS": [["وهذه ", []], ["الشهادة", ["G3141"]], [" هي أن ", []], ["الله", ["G2316"]], [" ", []], ["أعطانا", ["G1325"]], [" ", []], ["حياة", ["G2222"]], [" ", []], ["أبدية", ["G166"]], ["، وأن هذه ", []], ["الحياة", ["G2222"]], [" هي في ", []], ["ابنه", ["G5207"]], [".", []]]}, {"c": 5, "v": 12, "text": "فمن كان له ابن الله كانت له الحياة. ومن لم يكن له ابن الله، لم تكن له الحياة!", "groups": [{"kw": "that hath the", "raw": "1Jo_2:23, 1Jo_2:24; Joh_1:12, Joh_3:36, Joh_5:24; 1Co_1:30; Gal_2:20; Heb_3:14; 2Jo_1:9", "note": "", "refs": [{"l": "1Jo 2:23", "n": "", "vs": [[23, "وكل من ينكر الابن، لا يكون الآب أيضا من نصيبه. ومن يعترف بالابن، فله الآب أيضا."]]}, {"l": "1Jo 2:24", "n": "", "vs": [[24, "أما أنتم، فالكلام الذي سمعتموه منذ البداية، فليكن راسخا فيكم. فحين يترسخ ذلك الكلام في داخلكم، تتوطد صلتكم بالابن، وبالآب."]]}, {"l": "Joh 1:12", "n": "", "vs": [[12, "أما الذين قبلوه، أي الذين آمنوا باسمه، فقد منحهم الحق في أن يصيروا أولاد الله،"]]}, {"l": "Joh 3:36", "n": "", "vs": [[36, "من يؤمن بالابن، فله الحياة الأبدية. ومن يرفض أن يؤمن بالابن، فلن يرى الحياة. بل يستقر عليه غضب الله»."]]}, {"l": "Joh 5:24", "n": "", "vs": [[24, "الحق الحق أقول لكم إن من يسمع كلامي ويؤمن بالذي أرسلني تكون له الحياة الأبدية، ولا يحاكم في اليوم الأخير، لأنه قد انتقل من الموت إلى الحياة."]]}, {"l": "1Co 1:30", "n": "", "vs": [[30, "وبفضل الله صار لكم مقام في المسيح يسوع الذي جعل لنا حكمة من الله وبرا وقداسة وفداء،"]]}, {"l": "Gal 2:20", "n": "", "vs": [[20, "مع المسيح صلبت، وفيما بعد لا أحيا أنا بل المسيح يحيا في. أما الحياة التي أحياها الآن في الجسد، فإنما أحياها بالإيمان في ابن الله، الذي أحبني وبذل نفسه عني."]]}, {"l": "Heb 3:14", "n": "", "vs": [[14, "فإن تمسكنا دائما بالثقة التي انطلقنا بها في البداية، وأبقيناها ثابتة إلى النهاية، نكون مشاركين للمسيح."]]}, {"l": "2Jo 1:9", "n": "", "vs": [[9, "لأن من تعدى تعليم المسيح ولم يثبت فيه، فليس الله من تكون لكم حياة باسمه إذ تؤمنون."]]}, {"l": "Joh 21:24", "n": "", "vs": [[24, "هذا التلميذ هو الذي يشهد بهذه الأمور، وقد دونها هنا. ونحن نعلم أن شهادته حق."]]}, {"l": "1Pe 5:12", "n": "", "vs": [[12, "إني مرسل إليكم هذه الرسالة القصيرة بيد سلوانس الأخ الأمين. وغايتي أن أحرضكم وأشهد لكم أن النعمة التي تتمتعون بها هي نعمة الله الحقيقية التي أنتم فيها ثابتون."]]}], "kwAr": "إني كتبت هذا إليكم", "noteAr": ""}, {"kw": "believe", "raw": "1Jo_3:23; Joh_1:12, Joh_2:23, Joh_3:18; Act_3:16, Act_4:12; 1Ti_1:15, 1Ti_1:16", "note": "", "refs": [{"l": "1Jo 3:23", "n": "", "vs": [[23, "وأما وصيته فهي أن نؤمن باسم ابنه يسوع المسيح، وأن يحب بعضنا بعضا كما أوصانا."]]}, {"l": "Joh 1:12", "n": "", "vs": [[12, "أما الذين قبلوه، أي الذين آمنوا باسمه، فقد منحهم الحق في أن يصيروا أولاد الله،"]]}, {"l": "Joh 2:23", "n": "", "vs": [[23, "وبينما كان في أورشليم في عيد الفصح، آمن باسمه كثيرون إذ شهدوا الآيات التي أجراها."]]}, {"l": "Joh 3:18", "n": "", "vs": [[18, "فالذي يؤمن به لا يدان، أما الذي لا يؤمن به فقد صدر عليه حكم الدينونة، لأنه لم يؤمن باسم ابن الله الوحيد."]]}, {"l": "Act 3:16", "n": "", "vs": [[16, "وبفضل الإيمان باسمه، أعاد اسمه القوة إلى هذا الرجل الذي ترونه وتعرفونه. فالإيمان بيسوع هو الذي أعطاه هذه الصحة الكاملة بمشهد منكم جميعا."]]}, {"l": "Act 4:12", "n": "", "vs": [[12, "وليس بأحد غيره الخلاص، إذ ليس تحت السماء اسم آخر قدمه الله للبشر به يجب أن نخلص!»"]]}, {"l": "1Ti 1:15", "n": "", "vs": [[15, "ما أصدق هذا القول، وما أجدره بالتصديق الكلي: إن المسيح يسوع قد جاء إلى العالم ليخلص الخاطئين، وأنا أولهم!"]]}, {"l": "1Ti 1:16", "n": "", "vs": [[16, "ولكن لهذا السبب عوملت بالرحمة، ليجعل يسوع المسيح مني، أنا أولا، مثالا يظهر صبره الطويل، لجميع الذين سيؤمنون به لنوال الحياة الأبدية."]]}], "kwAr": "آمنتم باسم ابن الله", "noteAr": ""}, {"kw": "ye may know", "raw": "1Jo_5:10, 1Jo_1:1, 1Jo_1:2; Rom_8:15-17; 2Co_5:1; Gal_4:6; 2Pe_1:10,2Pe_1:11", "note": "", "refs": [{"l": "1Jo 5:10", "n": "", "vs": [[10, "فمن يؤمن بابن الله، يثق في قلبه بصحة هذه الشهادة. أما من لا يصدق الله ، إذ يرفض تصديق الشهادة التي شهد بها لابنه، فهو يتهم الله بالكذب."]]}, {"l": "1Jo 1:1", "n": "", "vs": [[1, "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."]]}, {"l": "1Jo 1:2", "n": "", "vs": [[2, "فإن «الحياة» تجلت أمامنا. وبعدما رأيناها فعلا، نشهد لها الآن. وها نحن ننقل إليكم خبر هذه الحياة الأبدية التي كانت عند الآب ثم تجلت أمامنا!"]]}, {"l": "Rom 8:15-17", "n": "", "vs": [[15, "إذ إنكم لم تنالوا روح عبودية يعيدكم إلى الخوف، بل نلتم روح بنوة به نصرخ: «أبا! أبانا!»"], [16, "فالروح نفسه يشهد مع أرواحنا بأننا أولاد الله."], [17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}, {"l": "2Co 5:1", "n": "", "vs": [[1, "فإننا نعلم أنه متى تهدمت خيمتنا الأرضية التي نسكنها الآن، يكون لنا بناء من الله: بيت لم تصنعه أيدي البشر، أبدي في السماوات."]]}, {"l": "Gal 4:6", "n": "", "vs": [[6, "وبما أنكم أبناء له، أرسل الله إلى قلوبنا روح ابنه، مناديا: «أبا، ياأبانا»."]]}, {"l": "2Pe 1:10", "n": "", "vs": [[10, "فأحرى بكم إذن، أيها الإخوة، أن تجتهدوا لتثبتوا عمليا أن الله قد دعاكم واختاركم حقا. فإنكم، إن فعلتم هذا، لن تسقطوا أبدا!"]]}, {"l": "2Pe 1:11", "n": "", "vs": [[11, "وهكذا يفتح الله لكم الباب واسعا للدخول إلى الملكوت الأبدي، ملكوت ربنا ومخلصنا يسوع المسيح."]]}], "kwAr": "لكي تعرفوا", "noteAr": ""}], "arS": [["يامن ", []], ["آمنتم", ["G4100"]], [" ", []], ["باسم", ["G3686"]], [" ", []], ["ابن", ["G5207"]], [" ", []], ["الله", ["G2316"]], ["، إني ", []], ["كتبت", ["G1125"]], [" هذا إليكم لكي ", []], ["تعرفوا", ["G1492"]], [" أن ", []], ["الحياة", ["G2222"]], [" ", []], ["الأبدية", ["G166"]], [" ملك لكم منذ الآن.", []]]}, {"c": 5, "v": 14, "text": "نحن نثق بالله ثقة عظيمة تؤكد لنا أنه يسمع لنا الطلبات التي نرفعها إليه، إن كانت منسجمة مع إرادته.", "groups": [{"kw": "this", "raw": "1Jo_3:21; Eph_3:12; Heb_3:6, Heb_3:14, Heb_10:35", "note": "", "refs": [{"l": "1Jo 3:21", "n": "", "vs": [[21, "أيها الأحباء، إذا كانت ضمائرنا لا تلومنا. فهذا دليل على أن لنا ثقة عظيمة من نحو الله."]]}, {"l": "Eph 3:12", "n": "", "vs": [[12, "الذي به لنا جرأة واقتراب واثق من جراء الإيمان به"]]}, {"l": "Heb 3:6", "n": "", "vs": [[6, "أما المسيح، فهو أمين بصفته ابنا يترَأس على البيت. وهذا البيت هو نحن المؤمنين، على أن نتمسك بالثقة والافتخار برجائنا تمسكا ثابتا حتى النهاية."]]}, {"l": "Heb 3:14", "n": "", "vs": [[14, "فإن تمسكنا دائما بالثقة التي انطلقنا بها في البداية، وأبقيناها ثابتة إلى النهاية، نكون مشاركين للمسيح."]]}, {"l": "Heb 10:35", "n": "", "vs": [[35, "إذن، لا تتخلوا عن ثقتكم بالرب. فإن لها مكافأة عظيمة."]]}], "kwAr": "نثق بالله ثقة عظيمة", "noteAr": ""}, {"kw": "in him", "raw": "or, concerning him", "note": "or, concerning him", "refs": [], "kwAr": "بالله", "noteAr": "أو: من جهته."}, {"kw": "if", "raw": "1Jo_3:22; Jer_29:12, Jer_29:13, Jer_33:3; Mat_7:7-11, Mat_21:22; Joh_14:13, Joh_15:7, Joh_16:24; Jam_1:5, Jam_1:6, Jam_4:3, Jam_5:16", "note": "", "refs": [{"l": "1Jo 3:22", "n": "", "vs": [[22, "ومهما نطلب منه بالصلاة، نحصل عليه: لأننا نطيع ما يوصينا به، ونمارس الأعمال التي ترضيه."]]}, {"l": "Jer 29:12", "n": "", "vs": [[12, "فتدعونني وتقبلون، وتصلون إلي فأستجيب لكم،"]]}, {"l": "Jer 29:13", "n": "", "vs": [[13, "وتلتمسونني فتجدونني إذ تطلبونني بكل قلوبكم."]]}, {"l": "Jer 33:3", "n": "", "vs": [[3, "ادعني فأجيبك وأطلعك على عظائم وغرائب لم تعرفها."]]}, {"l": "Mat 7:7-11", "n": "", "vs": [[7, "اسألوا، تعطوا. اطلبوا، تجدوا. اقرعوا، يفتح لكم."], [8, "فكل من يسأل، ينل؛ ومن يطلب، يجد؛ ومن يقرع، يفتح له."], [9, "وإلا، فأي إنسان منكم يطلب منه ابنه خبزا، فيعطيه حجرا،"], [10, "أو سمكة، فيعطيه حية؟"], [11, "فإن كنتم وأنتم أشرار، تعرفون أن تعطوا أولادكم عطايا جيدة، فكم بالأحرى جدا يعطي أبوكم السماوي عطايا جيدة للذين يطلبون منه؟"]]}, {"l": "Mat 21:22", "n": "", "vs": [[22, "وكل ما تطلبونه في الصلاة بإيمان، تنالونه»."]]}, {"l": "Joh 14:13", "n": "", "vs": [[13, "فأي شيء تطلبونه باسمي أفعله لكم، ليتمجد الآب في الابن."]]}, {"l": "Joh 15:7", "n": "", "vs": [[7, "ولكن، إن ثبتم في، وثبت كلامي فيكم، فاطلبوا ما تريدون يكن لكم."]]}, {"l": "Joh 16:24", "n": "", "vs": [[24, "حتى الآن لم تطلبوا باسمي شيئا. اطلبوا تنالوا، فيكون فرحكم كاملا."]]}, {"l": "Jam 1:5", "n": "", "vs": [[5, "وإن كان أحد منكم بحاجة إلى الحكمة، فليطلب من الله الذي يعطي الجميع بسخاء ولا يعير. فسيعطى له."]]}, {"l": "Jam 1:6", "n": "", "vs": [[6, "وإنما، عليه أن يطلب ذلك بإيمان، دون أي تردد أو شك. فإن المتردد كموجة البحر تتلاعب بها الرياح فتقذفها وتردها!"]]}, {"l": "Jam 4:3", "n": "", "vs": [[3, "وإذا طلبتم منه شيئا، فإنكم لا تحصلون عليه: لأنكم تطلبون بدافع شرير، إذ تنوون أن تستهلكوا ما تنالونه لإشباع شهواتكم فقط."]]}, {"l": "Jam 5:16", "n": "", "vs": [[16, "ليعترف كل واحد منكم لأخيه بزلاته، وصلوا بعضكم لأجل بعض، حتى تشفوا. إن الصلاة الحارة التي يرفعها البار لها فعالية عظيمة."]]}], "kwAr": "إن كانت منسجمة مع إرادته", "noteAr": ""}, {"kw": "he", "raw": "Job_34:28; Psa_31:22, Psa_34:17, Psa_69:33; Pro_15:29; Joh_9:31, Joh_11:42", "note": "", "refs": [{"l": "Job 34:28", "n": "", "vs": [[28, "فكانوا سببا في ارتفاع صراخ البائس إليه، والله يستجيب استغاثة المسكين."]]}, {"l": "Psa 31:22", "n": "", "vs": [[22, "تسرعت في رعبي وقلت: «قد تخلى الرب عني» ولكنك سمعت صوت تضرعي عندما استغثت بك."]]}, {"l": "Psa 34:17", "n": "", "vs": [[17, "يستغيث الأبرار، فيسمع لهم الرب وينقذهم من جميع ضيقاتهم."]]}, {"l": "Psa 69:33", "n": "", "vs": [[33, "لأن الرب يستجيب للمحتاجين ولا يحتقر شعبه الأسير."]]}, {"l": "Pro 15:29", "n": "", "vs": [[29, "الرب بعيد عن الأشرار، إنما يسمع صلاة الأبرار."]]}, {"l": "Joh 9:31", "n": "", "vs": [[31, "نحن نعلم أن الله لا يستجيب للخاطئين، ولكنه يستمع لمن يتقيه ويعمل بإرادته،"]]}, {"l": "Joh 11:42", "n": "", "vs": [[42, "وقد علمت أنك دوما تسمع لي. ولكني قلت هذا لأجل الجمع الواقف حولي ليؤمنوا أنك أنت أرسلتني»."]]}], "kwAr": "يسمع لنا", "noteAr": ""}], "arS": [["نحن ", []], ["نثق", ["G3954"]], [" بالله ثقة عظيمة تؤكد لنا أنه ", []], ["يسمع", ["G191"]], [" لنا ", []], ["الطلبات", ["G154"]], [" التي نرفعها إليه، إن كانت منسجمة مع ", []], ["إرادته", ["G2307"]], [".", []]]}, {"c": 5, "v": 15, "text": "ومادمنا واثقين بأنه يسمع لنا، مهما كانت طلباتنا، فلنا الثقة بأننا قد حصلنا منه على تلك الطلبات.", "groups": [{"kw": "if", "raw": "Pro_15:29; Jer_15:12, Jer_15:13", "note": "", "refs": [{"l": "Pro 15:29", "n": "", "vs": [[29, "الرب بعيد عن الأشرار، إنما يسمع صلاة الأبرار."]]}, {"l": "Jer 15:12", "n": "", "vs": [[12, "«أيمكن للمرء أن يكسر حديدا ونحاسا من الشمال؟"]]}, {"l": "Jer 15:13", "n": "", "vs": [[13, "سأجعل ثروتك وكنوزك نهبا بلا ثمن بسبب كل خطاياك في جميع أرضك."]]}], "kwAr": "ومادمنا واثقين", "noteAr": ""}, {"kw": "we know", "raw": "Mar_11:24; Luk_11:9, Luk_11:10", "note": "", "refs": [{"l": "Mar 11:24", "n": "", "vs": [[24, "لهذا السبب أقول لكم: إن ما تطلبونه وتصلون لأجله، فآمنوا أنكم قد نلتموه، فيتم لكم."]]}, {"l": "Luk 11:9", "n": "", "vs": [[9, "فإني أقول لكم: اطلبوا، تعطوا؛ اسعوا، تجدوا؛ اقرعوا، يفتح لكم:"]]}, {"l": "Luk 11:10", "n": "", "vs": [[10, "فإن كل من يطلب ينال، ومن يسعى يجد، ومن يقرع يفتح له."]]}], "kwAr": "لنا الثقة بأننا قد حصلنا", "noteAr": ""}], "arS": [["ومادمنا ", []], ["واثقين", ["G1492"]], [" بأنه ", []], ["يسمع", ["G191"]], [" لنا، مهما كانت ", []], ["طلباتنا", ["G154"]], ["، ", []], ["فلنا الثقة", ["G1492"]], [" بأننا قد ", []], ["حصلنا", ["G2192"]], [" منه على تلك ", []], ["الطلبات", ["G155"]], [".", []]]}, {"c": 5, "v": 16, "text": "إن رأى أحد منكم واحدا من إخوته يمارس خطيئة لا تنتهي به إلى الموت، فمن واجبه أن يصلي إلى الله من أجله، فيبقيه على قيد الحياة. هذا إذا كانت الخطيئة التي يمارسها لا تنتهي به إلى الموت. فهنالك خطيئة لابد أن تنتهي إلى الموت. وطبعا، أنا لا أقصد هذه الخطيئة هنا.", "groups": [{"kw": "he shall ask", "raw": "Gen_20:7, Gen_20:17; Exo_32:10-14, Exo_32:31, Exo_32:32, Exo_34:9; Num_12:13, Num_14:11-21; Deu_9:18-20; 2Ch_30:18-20; Job_42:7-9; Psa_106:23; Eze_22:30; Amo_7:1-3; Jam_5:14, Jam_5:15", "note": "", "refs": [{"l": "Gen 20:7", "n": "", "vs": [[7, "والآن، رد للرجل زوجته فإنه نبي، فيصلي من أجلك فتحيا. وإن لم تردها فإنك وكل من لك حتما تموتون»."]]}, {"l": "Gen 20:17", "n": "", "vs": [[17, "فابتهل إبراهيم إلى الله، فشفى أبيمالك وزوجته وجواريه فولدن."]]}, {"l": "Exo 32:10-14", "n": "", "vs": [[10, "والآن دعني وغضبي المحتدم فأفنيهم، ثم أجعلك أنت شعبا عظيما»."], [11, "فابتهل موسى إلى الرب وقال: «لماذا يحتدم غضبك على شعبك الذي أخرجته من ديار مصر بقوة عظيمة وذراع مقتدرة؟"], [12, "لماذا يشمت المصريون فينا قائلين: لقد احتال عليهم إلههم فأخرجهم من ههنا ليهلكهم في الجبال ويفنيهم عن وجه الأرض. ارجع عن حمو غضبك ولا توقع هذا العقاب بشعبك."], [13, "اذكر وعودك لعبيدك إبراهيم وإسحق وإسرائيل الذين أقسمت لهم بنفسك قائلا: أكثر نسلكم كنجوم السماء، وأهبكم جميع هذه الأرض التي وعدت بها فتملكونها إلى الأبد»."], [14, "فتراءف الرب ولم يوقع بشعبه العقاب الذي توعد به."]]}, {"l": "Exo 32:31", "n": "", "vs": [[31, "ورجع موسى إلى الرب وتضرع قائلا: «يارب لقد اقترف هذا الشعب خطيئة عظيمة، وصاغوا لأنفسهم إلها من ذهب."]]}, {"l": "Exo 32:32", "n": "", "vs": [[32, "والآن إن شئت، اغفر لهم، وإلا فامحني من كتابك الذي كتبت»."]]}, {"l": "Exo 34:9", "n": "", "vs": [[9, "وقال: «إن حظيت برضاك أيها السيد، فليرافقنا الرب في مسيرنا. ومع أن هذا الشعب متصلب القلب. لكن اصفح عن إثمنا وخطيئتنا واتخذنا خاصة لك»."]]}, {"l": "Num 12:13", "n": "", "vs": [[13, "فصرخ موسى إلى الرب قائلا: «اللهم اشفها»."]]}, {"l": "Num 14:11-21", "n": "", "vs": [[11, "وقال الرب لموسى: «إلى متى يمعن هذا الشعب في إهانتي، وإلى متى لا يصدقونني على الرغم من معجزاتي التي أجريتها في وسطهم؟"], [12, "سأبيدهم بالوبأ، وأجعلك شعبا أكبر وأعظم منهم»."], [13, "فقال موسى للرب: «عندئذ يسمع المصريون، الذين أخرجت هذا الشعب من بينهم بقدرتك، بهذا"], [14, "ويخبرون به أهل هذه الأرض، الذين قد سمعوا يارب أنك قائم في وسط هذا الشعب، وأنك قد ظهرت لهم وجها لوجه تظللهم بحمايتك، وتسير أمامهم في عمود سحاب نهارا وفي عمود نار ليلا."], [15, "فإن أهلكت هذا الشعب دفعة واحدة، فإن الأمم التي سمعت بخبرك تقول"], [16, "إنك قد عجزت عن أن تدخل هذا الشعب إلى الأرض التي وعدتهم بها، فأهلكتهم في الصحراء."], [17, "والآن لتتعظم قدرة سيدي كما نطقت قائلا:"], [18, "الرب طويل الأناة، وافر الرحمة، يغفر الذنب والسيئة. لكنه لا يبريء، بل يفتقد ذنب الآباء في الأبناء إلى الجيل الثالث والرابع."], [19, "فاصفح عن ذنب هذا الشعب بحسب نعمتك، واغفر له كما غفرت ذنوبه من مصر إلى ههنا»."], [20, "فأجاب الرب: «قد صفحت بحسب قولك."], [21, "ولكن كما أنا حقا حي، وكما أن مجد الرب حقا يملأ الأرض،"]]}, {"l": "Deu 9:18-20", "n": "", "vs": [[18, "ثم انطرحت بذل أمام الرب أربعين نهارا وأربعين ليلة، كما في السابق، لا آكل خبزا ولا أشرب ماء، من جراء كل خطاياكم التي ارتكبتموها في عيني الرب لتغيظوه،"], [19, "لأنني جزعت من غضب الرب واحتدام سخطه عليكم، حتى أوشك أن يبيدكم. فاستجاب لي الرب أيضا في تلك المرة."], [20, "كما غضب الرب على هرون أيضا حتى كاد أن يهلكه، فصليت من أجله حينئذ، فقبل الرب تضرعي."]]}, {"l": "2Ch 30:18-20", "n": "", "vs": [[18, "إذ أن جمعا غفيرا من أبناء أفرايم ومنسى ويساكر وزبولون لم يتطهروا، بل أكلوا من الفصح على خلاف ما هو منصوص عليه. إلا أن حزقيا ابتهل إلى الله عنهم قائلا: «الرب صالح يكفر"], [19, "عن كل من أعد قلبه لطلب الرب إله آبائه، حتى لو لم يكن طاهرا وفق فرائض التطهير التي نصت عليها أحكام الهيكل»."], [20, "فاستجاب الرب لحزقيا وأبرأ الشعب."]]}, {"l": "Job 42:7-9", "n": "", "vs": [[7, "وبعد أن انتهى الرب من مخاطبة أيوب، قال لأليفاز التيماني: «لقد احتدم غضبي عليك وعلى كلا صديقيك، لأنكم لم تنطقوا بالصواب عني كما نطق عبدي أيوب."], [8, "فخذوا الآن لكم سبعة ثيران وسبعة كباش، وامضوا إلى عبدي أيوب وقربوها ذبيحة محرقة عن أنفسكم، فيصلي من أجلكم، فأعفو عنكم إكراما له، لئلا أعاقبكم بمقتضى حماقتكم، لأنكم لم تنطقوا بالحق عني كعبدي أيوب»."], [9, "فذهب أليفاز التيماني وبلدد الشوحي وصوفر النعماتي وفعلوا كما أمر الرب. وأكرم الرب أيوب."]]}, {"l": "Psa 106:23", "n": "", "vs": [[23, "فأوشك أن يبيدهم كقوله، لولا أن موسى مختاره وقف في الثغرة أمامه يشفع فيهم ليرد غضبه فلا يهلكهم."]]}, {"l": "Eze 22:30", "n": "", "vs": [[30, "فالتمست من بينهم رجلا واحدا يبني جدارا ويقف في الثغرة أمامي مدافعا عن الأرض، حتى لا أخربها فلم أجد."]]}, {"l": "Amo 7:1-3", "n": "", "vs": [[1, "وهذا ما أراني السيد الرب: ها هو يعد أسراب جراد في بدء نمو الأعشاب المتأخرة بعد أن تم جز نصيب الملك منها."], [2, "وبعد أن فرغ الجراد من التهام عشب الأرض، قلت: «أيها السيد الرب، اصفح عن شعبك. إذ كيف يمكن ليعقوب أن ينهض، فإنه صغير؟»"], [3, "فعفا الرب عن هذا وقال: «لن يحدث ما رأيته»."]]}, {"l": "Jam 5:14", "n": "", "vs": [[14, "ومن كان منكم مريضا، فليستدع شيوخ الكنيسة ليصلوا من أجله ويدهنوه بزيت باسم الرب."]]}, {"l": "Jam 5:15", "n": "", "vs": [[15, "فالصلاة المرفوعة باءيمان تشفي المريض، إذ يعيد الرب إليه الصحة. وإن كان مرضه بسبب خطيئة ما، يغفرها الرب له."]]}], "kwAr": "يصلي إلى الله من أجله", "noteAr": ""}, {"kw": "There", "raw": "Num_15:30, Num_16:26-32; 1Sa_2:25; Jer_15:1, Jer_15:2; Mat_12:31, Mat_12:32; Mar_3:28-30; Luk_12:10; 2Ti_4:14; Heb_6:4-6, Heb_10:26-31; 2Pe_2:20-22", "note": "", "refs": [{"l": "Num 15:30", "n": "", "vs": [[30, "أما إن تعمد أحد الخطأ، سواء كان من الإسرائيليين أم من الغرباء، فهو يزدري بي ويجب أن يستأصل من بين شعبه،"]]}, {"l": "Num 16:26-32", "n": "", "vs": [[26, "وقال للجماعة كلها: «ابتعدوا عن خيام هؤلاء القوم الأشرار، ولا تلمسوا شيئا مما لهم لئلا تهلكوا من جراء خطاياهم»."], [27, "فابتعدوا من حوالي خيام قورح وداثان وأبيرام، وخرج داثان وأبيرام، ووقفا أمام خيمتيهما مع زوجاتهما وأولادهما صغارا وكبارا."], [28, "فقال موسى: «بهذا تعرفون أن الرب قد أرسلني لأجري كل هذه الأعمال، وأنها ليست صادرة عن نفسي:"], [29, "إن مات هؤلاء موتا طبيعيا، أو ابتلوا بما يبتلى به الناس عادة، فلا يكون الرب قد أرسلني."], [30, "ولكن إن أجرى الرب بدعة، وانشقت الأرض وابتلعتهم مع كل مالهم، ودفنوا في باطن الأرض أحياء، عندئذ تدركون أن هؤلاء القوم قد ازدروا بالرب»."], [31, "وحالما انتهى من كلامه انشقت الأرض تحتهم،"], [32, "وفتحت فاها وابتلعتهم مع بيوتهم، كما ابتلعت رجال قورح مع كل ما يملكون."]]}, {"l": "1Sa 2:25", "n": "", "vs": [[25, "فإن أخطأ إنسان نحو إنسان، فالله يدينه، ولكن إن أخطأ إلى الرب فمن يصلي من أجله؟» لكنهم لم يعيروا توبيخ أبيهم أي اهتمام لأن الرب شاء أن يميتهم."]]}, {"l": "Jer 15:1", "n": "", "vs": [[1, "ثم قال لي الرب: «وحتى لو مثل موسى وصموئيل أمامي، من أجل الشعب فإن قلبي لن يلتفت إلى هذا الشعب. اطرحهم من محضري فيخرجوا."]]}, {"l": "Jer 15:2", "n": "", "vs": [[2, "وعندما يسألونك: إلى أين نذهب؟ أجبهم: هذا ما يعلنه الرب: من هو للوبأ فبالوبأ يموت، ومن هو للسيف فبالسيف يقتل، ومن هو للمجاعة فبالمجاعة يفنى، ومن هو للسبي فإلى السبي يذهب."]]}, {"l": "Mat 12:31", "n": "", "vs": [[31, "لذلك أقول لكم: إن كل خطيئة وتجديف يغفر للناس."]]}, {"l": "Mat 12:32", "n": "", "vs": [[32, "وأما التجديف على الروح (القدس)، فلن يغفر. ومن قال كلمة ضد ابن الإنسان، يغفر له. وأما من قال كلمة ضد الروح القدس، فلن يغفر له، لا في هذا الزمان، ولا في الزمان الآتي."]]}, {"l": "Mar 3:28-30", "n": "", "vs": [[28, "الحق أقول لكم: إن جميع الخطايا تغفر لبني البشر، حتى التجاديف التي يجدفونها."], [29, "ولكن من يجدف على الروح القدس، فلا غفران له أبدا، بل إنه يقع تحت عقاب خطيئة أبدية»."], [30, "ذلك لأنهم قالوا: «إن روحا نجسا يسكنه!»"]]}, {"l": "Luk 12:10", "n": "", "vs": [[10, "ومن قال كلمة بحق ابن الإنسان، يغفر له. وأما من جدف على الروح القدس، فلن يغفر له!"]]}, {"l": "2Ti 4:14", "n": "", "vs": [[14, "إن إسكندر النحاس قد أساء إلي إساءات كثيرة، سيجازيه الرب حسب أعماله."]]}, {"l": "Heb 6:4-6", "n": "", "vs": [[4, "ذلك لأن الذين قد تعرضوا مرة لنور الإيمان بالمسيح، فذاقوا العطية السماوية، وصاروا (إلى حين) من شركاء الروح القدس،"], [5, "وذاقوا كلمة الله الطيبة، وشاهدوا المعجزات التي تظهر عظمة «العالم الآتي»،"], [6, "ثم ارتدوا إلى تلك الأسس القديمة، أولئك يستحيل عليهم أن يتجددوا ثانية فيعودوا إلى التوبة. فهم يجنون على أنفسهم إذ يصلبون ابن الله مرة ثانية ويجعلونه عرضة للعار."]]}, {"l": "Heb 10:26-31", "n": "", "vs": [[26, "فإن أخطأنا عمدا برفضنا للمسيح بعد حصولنا على معرفة الحق، لا تبقى هناك ذبيحة لغفران الخطايا،"], [27, "بل انتظار العقاب الأكيد في لهيب النار التي ستلتهم المتمردين. ويا له من انتظار مخيف!"], [28, "تعلمون أن من خالف شريعة موسى، كان عقابه الموت دون رحمة، على أن يؤيد مخالفته شاهدان أو ثلاثة."], [29, "ففي ظنكم، كم يكون أشد كثيرا ذلك العقاب الذي يستحقه من يدوس ابن الله، إذ يعتبر أن دم العهد، الذي يتقدس به، هو دم نجس، وبذلك يهين روح النعمة؟"], [30, "فنحن نعرف من قال: «لي الانتقام، أنا أجازي، يقول الرب!» وأيضا: «إن الرب سوف يحاكم شعبه!»"], [31, "حقا ما أرهب الوقوع في يدي الله الحي!"]]}, {"l": "2Pe 2:20-22", "n": "", "vs": [[20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."], [21, "وبالحقيقة، كان أفضل لهم لو أنهم لم يتعرفوا بطريق البر، من أن يتعرفوا به ثم يرتدوا عن الوصية المقدسة التي تسلموها."], [22, "وينطبق على هؤلاء ما يقوله المثل الصادق: «عاد الكلب إلى تناول ما تقيأه، والخنزيرة المغتسلة إلى التمرغ في الوحل!»"]]}], "kwAr": "هنالك خطيئة", "noteAr": ""}, {"kw": "I do not", "raw": "Jer_7:16, Jer_11:14, Jer_14:11, Jer_18:18-21; Joh_17:9", "note": "", "refs": [{"l": "Jer 7:16", "n": "", "vs": [[16, "أما أنت فلا تصل من أجل هذا الشعب ولا ترفع لأجلهم دعاء ولا ابتهالا، ولا تتشفع لهم لأني لن أستجيب لك."]]}, {"l": "Jer 11:14", "n": "", "vs": [[14, "فلا تبتهلن من أجل هذا الشعب، ولا ترفعن لأجلهم دعاء ولا صلاة، فإني لن أسمع لهم وقت استغاثتهم بي من محنتهم."]]}, {"l": "Jer 14:11", "n": "", "vs": [[11, "وقال لي الرب: «لا تصل لخير الشعب."]]}, {"l": "Jer 18:18-21", "n": "", "vs": [[18, "ثم قالوا: «تعالوا نتآمر على إرميا، لأن الشريعة لا تبيد عن الكاهن، ولا المشورة عن الحكيم، ولا الوحي عن النبي. تعالوا نلذعه بوخزات اللسان ونصم آذاننا عن كلامه»."], [19, "أصغ لي يارب، واستمع إلى اتهامات خصومي."], [20, "هل يجازى عن خير بشر؟ قد نقروا حفرة لنفسي. اذكر كيف وقفت أمامك أثني عليهم خيرا لأصرف غضبك عنهم."], [21, "لذلك أسلم بنيهم لأنياب الجوع، واعهد بهم إلى قبضة السيف فتصبح نساؤهم ثكالى وأرامل، وليمت رجالهم، وليلق شبانهم حتفهم في المعارك بحد السيف."]]}, {"l": "Joh 17:9", "n": "", "vs": [[9, "من أجل هؤلاء أصلي إليك. لست أصلي الآن من أجل العالم، بل من أجل الذين وهبتهم لي، لأنهم لك."]]}], "kwAr": "أنا لا أقصد", "noteAr": ""}], "arS": [["إن ", []], ["رأى", ["G1492"]], [" ", []], ["أحد", ["G5100"]], [" منكم واحدا من ", []], ["إخوته", ["G80"]], [" ", []], ["يمارس خطيئة", ["G264", "G266"]], [" لا تنتهي به إلى ", []], ["الموت", ["G2288"]], ["، فمن واجبه أن ", []], ["يصلي", ["G154"]], [" إلى الله من أجله، ", []], ["فيبقيه على قيد الحياة", ["G1325", "G2222"]], [". هذا إذا كانت الخطيئة التي ", []], ["يمارسها", ["G264"]], [" لا تنتهي به إلى ", []], ["الموت", ["G2288"]], [". فهنالك ", []], ["خطيئة", ["G266"]], [" لابد أن تنتهي إلى ", []], ["الموت", ["G2288"]], [". وطبعا، أنا لا ", []], ["أقصد", ["G3004"]], [" هذه الخطيئة هنا.", []]]}, {"c": 5, "v": 17, "text": "كل إثم هو خطيئة، ولا تنتهي كل خطيئة إلى الموت.", "groups": [{"kw": "all", "raw": "1Jo_3:4; Deu_5:32, Deu_12:32", "note": "", "refs": [{"l": "1Jo 3:4", "n": "", "vs": [[4, "أما الذي يمارس الخطيئة، فهو يخالف ناموس الله: لأن الخطيئة هي مخالفة الناموس."]]}, {"l": "Deu 5:32", "n": "", "vs": [[32, "فاحرصوا على العمل بكل ما أمركم به الرب إلهكم، لا تحيدوا يمينا أو شمالا."]]}, {"l": "Deu 12:32", "n": "", "vs": [[32, "فاحرصوا على طاعة كل ما أوصيكم به. لا تزيدوا عليه ولا تنقصوا منه."]]}], "kwAr": "كل إثم هو خطيئة", "noteAr": ""}, {"kw": "and", "raw": "1Jo_5:16; Isa_1:18; Eze_18:26-32; Rom_5:20,Rom_5:21; Jam_1:15, Jam_4:7-10", "note": "", "refs": [{"l": "1Jo 5:16", "n": "", "vs": [[16, "إن رأى أحد منكم واحدا من إخوته يمارس خطيئة لا تنتهي به إلى الموت، فمن واجبه أن يصلي إلى الله من أجله، فيبقيه على قيد الحياة. هذا إذا كانت الخطيئة التي يمارسها لا تنتهي به إلى الموت. فهنالك خطيئة لابد أن تنتهي إلى الموت. وطبعا، أنا لا أقصد هذه الخطيئة هنا."]]}, {"l": "Isa 1:18", "n": "", "vs": [[18, "تعالوا نتحاجج يقول الرب، إن كانت خطاياكم كلطخات قرمزية فإنها تبيض كالثلج، وإن كانت حمراء كصبغ الدودي تصبح في نقاء الصوف!"]]}, {"l": "Eze 18:26-32", "n": "", "vs": [[26, "إذا تحول البار عن بره وارتكب إثما ومات بسببه، فهو بإثمه الذي جناه يموت."], [27, "وإذا رجع الأثيم عن شره الذي اقترفه ومار س الحق والعدل، فهو يحيي نفسه،"], [28, "لأنه اعتبر وتاب عن كل ذنوبه التي ارتكبها. لذلك حتما يحيا. لا يموت."], [29, "ومع ذلك يقول شعب إسرائيل إن طريق الرب غير عادلة. أطرقي غير عادلة ياشعب إسرائيل؟ أليست طرقكم هي المعوجة؟"], [30, "لذلك أدينكم ياشعب إسرائيل، كل واحد بمقتضى طرقه، يقول السيد الرب. توبوا وارجعوا عن ذنوبكم كلها، فلا يكون لكم الإثم معثرة هلاك."], [31, "اطرحوا عنكم كل ذنوبكم التي ارتكبتموها، واحصلوا لأنفسكم على قلب جديد وروح جديدة. فلماذا تنقرضون ياشعب إسرائيل؟"], [32, "إذ لا أسر بموت أحد، يقول السيد الرب، فتوبوا واحيوا."]]}, {"l": "Rom 5:20", "n": "", "vs": [[20, "وأما الشريعة فقد أدخلت لتظهر كثرة المعصية. ولكن، حيث كثرت الخطيئة، تتوافر النعمة أكثر جدا،"]]}, {"l": "Rom 5:21", "n": "", "vs": [[21, "حتى إنه كما ملكت الخطيئة بالموت، فكذلك أيضا تملك النعمة على أساس البر مؤدية إلى الحياة الأبدية بيسوع المسيح ربنا."]]}, {"l": "Jam 1:15", "n": "", "vs": [[15, "فإذا ما حبلت الشهوة ولدت الخطيئة. ومتى نضجت الخطيئة، أنتجت الموت."]]}, {"l": "Jam 4:7-10", "n": "", "vs": [[7, "إذن، كونوا خاضعين لله. وقاوموا إبليس فيهرب منكم."], [8, "اقتربوا إلى الله فيقترب إليكم. أيها الخاطئون نظفوا أيديكم، وياأصحاب الرأيين طهروا قلوبكم."], [9, "احزنوا مولولين ونائحين وباكين. ليتحول ضحككم إلى نواح، وفرحكم إلى كآبة."], [10, "تواضعوا في حضرة الرب فيرفعكم!"]]}], "kwAr": "لا تنتهي كل خطيئة إلى الموت", "noteAr": ""}], "arS": [["كل", ["G3956"]], [" ", []], ["إثم", ["G93"]], [" هو ", []], ["خطيئة", ["G266"]], ["، ولا تنتهي كل ", []], ["خطيئة", ["G266"]], [" إلى ", []], ["الموت", ["G2288"]], [".", []]]}, {"c": 5, "v": 18, "text": "نحن واثقون بأن كل من ولد من الله لا يمارس الخطيئة، لأن ابن الله يحميه فلا يمسه إبليس الشرير.", "groups": [{"kw": "whosoever", "raw": "1Jo_5:1, 1Jo_5:4, 1Jo_2:29, 1Jo_3:9, 1Jo_4:6; Joh_1:13, Joh_3:2-5; Jam_1:18; 1Pe_1:23", "note": "", "refs": [{"l": "1Jo 5:1", "n": "", "vs": [[1, "كل من يؤمن حقا أن يسوع هو المسيح، فهو مولود من الله. ومن يحب الوالد، فلابد أن يحب المولودين منه أيضا."]]}, {"l": "1Jo 5:4", "n": "", "vs": [[4, "ذلك لأن المولود من الله ينتصر على العالم. فالإيمان هو الذي يجعلنا ننتصر على العالم."]]}, {"l": "1Jo 2:29", "n": "", "vs": [[29, "وما دمتم تعلمون أن الله بار، فاعلموا أن كل من يفعل الصلاح، يظهر أنه مولود من الله حقا."]]}, {"l": "1Jo 3:9", "n": "", "vs": [[9, "فكل مولود من الله، لا يمارس الخطيئة، لأن طبيعة الله صارت ثابتة فيه. بل إنه لا يستطيع أن يمارس الخطيئة، لأنه مولود من الله."]]}, {"l": "1Jo 4:6", "n": "", "vs": [[6, "أما نحن، فإننا من الله، ولذلك يصغي إلينا فقط من يعرف الله . أما الذي ليس من الله، فلا يصغي إلينا. وبهذا، نميز بين روح الحق وروح الضلال."]]}, {"l": "Joh 1:13", "n": "", "vs": [[13, "وهم الذين ولدوا ليس من دم، ولا من رغبة جسد، ولا من رغبة بشر، بل من الله."]]}, {"l": "Joh 3:2-5", "n": "", "vs": [[2, "جاء إلى يسوع ليلا وقال له: «يامعلم، نعلم أنك جئت من الله معلما، لأنه لا يقدر أحد أن يعمل ما تعمل من آيات إلا إذا كان الله معه»."], [3, "فأجابه يسوع: «الحق الحق أقول لك: لا أحد يمكنه أن يرى ملكوت الله إلا إذا ولد من جديد»."], [4, "فسأله نيقوديموس: «كيف يمكن الإنسان أن يولد وهو كبير السن؟ ألعله يستطيع أن يدخل بطن أمه ثانية ثم يولد؟»"], [5, "أجابه يسوع: «الحق الحق أقول لك: لا يمكن أن يدخل أحد ملكوت الله إلا إذا ولد من الماء والروح."]]}, {"l": "Jam 1:18", "n": "", "vs": [[18, "وهو قد شاء أن يجعلنا أولادا له، فولدنا بكلمته، كلمة الحق. وغايته أن نكون باكورة خليقته."]]}, {"l": "1Pe 1:23", "n": "", "vs": [[23, "فأنتم قد ولدتم ولادة ثانية لا من زرع بشري يفنى، بل مما لا يفنى: بكلمة الله الحية الباقية إلى الأبد."]]}], "kwAr": "كل من ولد من الله", "noteAr": ""}, {"kw": "keepeth", "raw": "1Jo_5:21, 1Jo_3:3; Psa_17:4, Psa_18:23, Psa_39:1, Psa_119:101; Pro_4:23; Joh_15:4, Joh_15:7, Joh_15:9; Act_11:23; Jam_1:27; Jud_1:21, Jud_1:24; Rev_2:13, Rev_3:8-10", "note": "", "refs": [{"l": "1Jo 5:21", "n": "", "vs": [[21, "أيها الأولاد الصغار، احفظوا أنفسكم من الأصنام!"]]}, {"l": "1Jo 3:3", "n": "", "vs": [[3, "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر."]]}, {"l": "Psa 17:4", "n": "", "vs": [[4, "ما شأني بأعمال الناس الشريرة؟ فبفضل كلام شفتيك تفاديت مسالك العنيف."]]}, {"l": "Psa 18:23", "n": "", "vs": [[23, "وأكون معه كاملا وأصون نفسي من إثمي."]]}, {"l": "Psa 39:1", "n": "", "vs": [[1, "قلت: «أحرص على حسن المسلك فلا يخطيء لساني القول. سأكم فمي عن الكلام مادام الشرير أمامي»."]]}, {"l": "Psa 119:101", "n": "", "vs": [[101, "منعت قدمي عن سلوك كل طريق شر، لكي أحفظ كلامك."]]}, {"l": "Pro 4:23", "n": "", "vs": [[23, "فوق كل حرص احفظ قلبك لأن منه تنبثق الحياة."]]}, {"l": "Joh 15:4", "n": "", "vs": [[4, "فاثبتوا في وأنا فيكم. كما أن الغصن لا يقدر أن ينتج ثمرا إلا إذا ثبت في الكرمة؛ فكذلك أنتم، إلا إذا ثبتم في."]]}, {"l": "Joh 15:7", "n": "", "vs": [[7, "ولكن، إن ثبتم في، وثبت كلامي فيكم، فاطلبوا ما تريدون يكن لكم."]]}, {"l": "Joh 15:9", "n": "", "vs": [[9, "مثلما أحبني الآب، أحببتكم أنا، فاثبتوا في محبتي."]]}, {"l": "Act 11:23", "n": "", "vs": [[23, "فلما وصل ورأى النعمة التي منحها الله ، امتلأ فرحا، وحث الجميع على الثبات في الرب بعزم القلب."]]}, {"l": "Jam 1:27", "n": "", "vs": [[27, "فالديانة الطاهرة النقية في نظر الله الآب، تظهر في زيارة الأيتام والأرامل لإعانتهم في ضيقهم، وفي صيانة النفس من التلوث بفساد العالم."]]}, {"l": "Jud 1:21", "n": "", "vs": [[21, "واحفظوا أنفسكم في محبة الله، منتظرين رحمة ربنا يسوع المسيح إذ يعود ويأخذكم لتحيوا معه إلى الأبد."]]}, {"l": "Jud 1:24", "n": "", "vs": [[24, "وللقادر أن يحرسكم من السقوط حتى يوصلكم إلى المثول أمامه في المجد مبتهجين ولا عيب فيكم …"]]}, {"l": "Rev 2:13", "n": "", "vs": [[13, "إني أعلم أين تسكن، حيث عرش الشيطان! ورغم ذلك تمسكت باسمي، ورفضت أن تنكر الإيمان بي، حتى في أيام أنتيباس شهيدي الأمين، الذي قتل عندكم حيث يسكن الشيطان!"]]}, {"l": "Rev 3:8-10", "n": "", "vs": [[8, "إني عالم بأعمالك. فمع أن لك قوة ضئيلة، فقد أطعت كلمتي ولم تنكر اسمي، ولذلك فتحت لك بابا لا يقدر أحد أن يغلقه."], [9, "أما الذين هم من مجمع الشيطان، ويدعون كذبا أنهم يهود، فسأجبرهم على أن يسجدوا عند قدميك، ويعترفوا بأني أحببتك."], [10, "ولأنك حفظت كلمتي وصبرت، فسأحفظك أنا أيضا من ساعة التجربة التي ستأتي على العالم أجمع لتجرب الساكنين على الأرض."]]}], "kwAr": "يحميه", "noteAr": ""}, {"kw": "wicked", "raw": "1Jo_2:13, 1Jo_2:14, 1Jo_3:12", "note": "", "refs": [{"l": "1Jo 2:13", "n": "", "vs": [[13, "أكتب إليكم أيها الآباء، لأنكم قد عرفتم المسيح الكائن منذ البداية. أكتب إليكم أيها الشباب، لأنكم قد غلبتم إبليس الشرير. كتبت إليكم أيها الأولاد الصغار، لأنكم قد عرفتم الآب."]]}, {"l": "1Jo 2:14", "n": "", "vs": [[14, "كتبت إليكم، أيها الآباء، لأنكم قد عرفتم المسيح الكائن منذ البداية. كتبت إليكم، أيها الشباب، لأنكم أقوياء، وقد ترسخت كلمة الله في قلوبكم، وغلبتم إبليس الشرير."]]}, {"l": "1Jo 3:12", "n": "", "vs": [[12, "لا أن نكون مثل قايين الذي قتل أخاه. فقايين كان من أولاد إبليس الشرير. ولماذا قتل أخاه؟ قتله لأن أعماله هو كانت شريرة، أما أعمال أخيه فكانت صالحة."]]}], "kwAr": "إبليس الشرير", "noteAr": ""}], "arS": [["نحن ", []], ["واثقون", ["G1492"]], [" بأن ", []], ["كل", ["G3956"]], [" من ", []], ["ولد", ["G1080"]], [" من ", []], ["الله", ["G2316"]], [" لا ", []], ["يمارس الخطيئة", ["G264"]], ["، لأن ", []], ["ابن", ["G1080"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["يحميه", ["G5083"]], [" فلا ", []], ["يمسه", ["G680"]], [" إبليس ", []], ["الشرير", ["G4190"]], [".", []]]}, {"c": 5, "v": 19, "text": "ونحن واثقون أيضا بأننا من الله، وأن العالم كله خاضع لسيطرة إبليس الشرير.", "groups": [{"kw": "we know", "raw": "1Jo_5:10,1Jo_5:13, 1Jo_5:20, 1Jo_3:14, 1Jo_3:24, 1Jo_4:4-6; Rom_8:16; 2Co_1:12, 2Co_5:1; 2Ti_1:12", "note": "", "refs": [{"l": "1Jo 5:10", "n": "", "vs": [[10, "فمن يؤمن بابن الله، يثق في قلبه بصحة هذه الشهادة. أما من لا يصدق الله ، إذ يرفض تصديق الشهادة التي شهد بها لابنه، فهو يتهم الله بالكذب."]]}, {"l": "1Jo 5:13", "n": "", "vs": [[13, "يامن آمنتم باسم ابن الله، إني كتبت هذا إليكم لكي تعرفوا أن الحياة الأبدية ملك لكم منذ الآن."]]}, {"l": "1Jo 5:20", "n": "", "vs": [[20, "وإننا نعلم أن ابن الله قد جاء إلى الأرض وأنار أذهاننا لنعرف الإله الحق. ونحن الآن نحيا فيه، لأننا في ابنه يسوع المسيح. هذا هو الإله الحق، والحياة الأبدية."]]}, {"l": "1Jo 3:14", "n": "", "vs": [[14, "إن محبتنا لإخوتنا تبين لنا أننا انتقلنا من الموت إلى الحياة. فالذي لا يحب إخوته، فهو باق في الموت."]]}, {"l": "1Jo 3:24", "n": "", "vs": [[24, "وكل من يطيع وصايا الله، فإنه يثبت في الله، والله يثبت فيه. والذي يؤكد لنا أن الله يثبت فينا، هو الروح القدس الذي وهبه لنا."]]}, {"l": "1Jo 4:4-6", "n": "", "vs": [[4, "أيها الأولاد الصغار، أنتم من الله، وقد غلبتم الذين يقاومون المسيح: لأن الروح القدس الساكن فيكم أقوى من الروح الشرير المنتشر في العالم."], [5, "هؤلاء المقاومون هم من العالم، ولذلك يستمدون كلامهم من العالم، فيصغي أهل العالم إليهم."], [6, "أما نحن، فإننا من الله، ولذلك يصغي إلينا فقط من يعرف الله . أما الذي ليس من الله، فلا يصغي إلينا. وبهذا، نميز بين روح الحق وروح الضلال."]]}, {"l": "Rom 8:16", "n": "", "vs": [[16, "فالروح نفسه يشهد مع أرواحنا بأننا أولاد الله."]]}, {"l": "2Co 1:12", "n": "", "vs": [[12, "فإن فخرنا هو هذا: شهادة ضميرنا بأننا، في قداسة الله وإخلاصه، قد سلكنا في العالم، وبخاصة تجاهكم؛ ولم يكن ذلك بحكمة بشرية بل بنعمة الله."]]}, {"l": "2Co 5:1", "n": "", "vs": [[1, "فإننا نعلم أنه متى تهدمت خيمتنا الأرضية التي نسكنها الآن، يكون لنا بناء من الله: بيت لم تصنعه أيدي البشر، أبدي في السماوات."]]}, {"l": "2Ti 1:12", "n": "", "vs": [[12, "من أجل ذلك أيضا أقاسي الآن هذه الآلام، ولكني لست أخجل، لأنني أعرف من أنا مؤمن به، ولي تمام الثقة بأنه قادر أن يحفظ لي الأمانة التي أودعتها عنده سالمة إلى ذلك اليوم."]]}], "kwAr": "واثقون بأننا من الله", "noteAr": ""}, {"kw": "and the", "raw": "1Jo_4:4, 1Jo_4:5; Joh_15:18, Joh_15:19; Rom_1:28-32, Rom_3:9-18; Gal_1:4; Tit_3:3; Jam_4:4", "note": "", "refs": [{"l": "1Jo 4:4", "n": "", "vs": [[4, "أيها الأولاد الصغار، أنتم من الله، وقد غلبتم الذين يقاومون المسيح: لأن الروح القدس الساكن فيكم أقوى من الروح الشرير المنتشر في العالم."]]}, {"l": "1Jo 4:5", "n": "", "vs": [[5, "هؤلاء المقاومون هم من العالم، ولذلك يستمدون كلامهم من العالم، فيصغي أهل العالم إليهم."]]}, {"l": "Joh 15:18", "n": "", "vs": [[18, "إن أبغضكم العالم، فاعلموا أنه قد أبغضني من قبلكم."]]}, {"l": "Joh 15:19", "n": "", "vs": [[19, "لو كنتم من أهل العالم، لكان العالم يحب أهله، ولكن لأنكم لستم من أهل العالم، بل إني اخترتكم من وسط العالم، لذلك يبغضكم العالم."]]}, {"l": "Rom 1:28-32", "n": "", "vs": [[28, "وبما أنهم لم يتخيروا إبقاء الله ضمن معرفتهم، أسلمهم الله إلى ذهن عاطل عن التمييز دفعهم إلى ممارسة الأمور غير اللائقة."], [29, "إذ قد امتلأوا من كل إثم وشر وجشع وخبث، وشحنوا حسدا وقتلا وخصاما ومكرا وسوءا. وهم ثرثارون،"], [30, "مغتابون، كارهون لله، شتامون، متكبرون، متفاخرون، مخترعون للشرور، غير طائعين للوالدين."], [31, "لا فهم عندهم، ولا أمانة، ولا حنان، ولا رحمة."], [32, "إنهم يعلمون حكم الله العادل: أن الذين يفعلون هذه الأمور يستوجبون الموت؛ ومع ذلك، لا يمارسونها وحسب، بل يسرون بفاعليها."]]}, {"l": "Rom 3:9-18", "n": "", "vs": [[9, "فماذا إذن؟ أنحن اليهود أفضل؟ لا، على الإطلاق! فإننا، في ما سبق، قد اتهمنا اليهود واليونانيين بكونهم جميعا تحت الخطيئة،"], [10, "كما قد كتب:"], [11, "ليس من يبحث عن الله."], [12, "جميع الناس قد ضلوا، وصاروا كلهم بلا نفع. ليس من يمارس الصلاح، لا ولا واحد."], [13, "حناجرهم قبور مفتوحة؛ ألسنتهم أدوات للمكر؛ شفاههم تخفي سم الأفاعي القاتلة؛"], [14, "أفواههم مملوءة لعنة ومرارة،"], [15, "أقدامهم سريعة إلى سفك الدماء؛"], [16, "في طرقهم الخراب والشقاء؛"], [17, "أما طريق السلام فلم يعرفوه؛"], [18, "ومخافة الله ليست نصب عيونهم»."]]}, {"l": "Gal 1:4", "n": "", "vs": [[4, "الذي بذل نفسه من أجل خطايانا لكي ينقذنا من العالم الحاضر الشرير، وفقا لمشيئة إلهنا وأبينا."]]}, {"l": "Tit 3:3", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."]]}, {"l": "Jam 4:4", "n": "", "vs": [[4, "أيها الخونة! ألستم تعلمون أن مصادقة العالم هي معاداة لله؟ فالذي يريد أن يصادق العالم، يجعل نفسه عدوا لله."]]}], "kwAr": "العالم كله", "noteAr": ""}, {"kw": "in wickedness", "raw": "1Jo_5:18; Joh_12:31, Joh_14:30, Joh_16:11; 2Co_4:4; Eph_2:2; Rev_12:9, Rev_13:7, Rev_13:8; Rev_20:3, Rev_20:7, Rev_20:8", "note": "", "refs": [{"l": "1Jo 5:18", "n": "", "vs": [[18, "نحن واثقون بأن كل من ولد من الله لا يمارس الخطيئة، لأن ابن الله يحميه فلا يمسه إبليس الشرير."]]}, {"l": "Joh 12:31", "n": "", "vs": [[31, "الآن وقت الحكم على هذا العالم! الآن يطرد سيد هذا العالم خارجا!"]]}, {"l": "Joh 14:30", "n": "", "vs": [[30, "لن أكلمكم كثيرا بعد، فإن سيد هذا العالم قادم علي، ولا شيء له في."]]}, {"l": "Joh 16:11", "n": "", "vs": [[11, "وأما على الدينونة، فلأن سيد هذا العالم قد صدر عليه حكم الدينونة."]]}, {"l": "2Co 4:4", "n": "", "vs": [[4, "الذين أعمى إله هذا العالم أذهانهم حتى لا يضيء لهم نور الإنجيل المختص بمجد المسيح الذي هو صورة الله."]]}, {"l": "Eph 2:2", "n": "", "vs": [[2, "التي كنتم تسلكون فيها حسب مسرى هذا العالم، تابعين رئيس قوات الهواء، ذلك الروح العامل الآن في أبناء العصيان،"]]}, {"l": "Rev 12:9", "n": "", "vs": [[9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."]]}, {"l": "Rev 13:7", "n": "", "vs": [[7, "وأعطي الوحش قدرة على أن يحارب القديسين ويهزمهم وسلطة على كل قبيلة وشعب ولغة وأمة."]]}, {"l": "Rev 13:8", "n": "", "vs": [[8, "فيسجد للوحش جميع سكان الأرض الذين لم تكتب أسماؤهم منذ تأسيس العالم في سجل الحياة للحمل الذي ذبح."]]}, {"l": "Rev 20:3", "n": "", "vs": [[3, "وطرحه في الهاوية وأغلقها عليه، وختمها، حتى يكف عن تضليل الأمم، إلى أن تنقضي الألف سنة. ولكن لابد من إطلاقه بعد ذلك لمدة قصيرة."]]}, {"l": "Rev 20:7", "n": "", "vs": [[7, "فحين تنقضي الألف سنة، يطلق الشيطان من سجنه،"]]}, {"l": "Rev 20:8", "n": "", "vs": [[8, "فيخرج ليضلل الأمم في زوايا الأرض الأربع، جوج وماجوج، ويجمعهم للقتال، وعددهم كثير جدا كرمل البحر!"]]}], "kwAr": "خاضع لسيطرة إبليس الشرير", "noteAr": ""}], "arS": [["ونحن ", []], ["واثقون", ["G1492"]], [" أيضا بأننا من ", []], ["الله", ["G2316"]], ["، وأن ", []], ["العالم", ["G2889"]], [" ", []], ["كله", ["G3650"]], [" ", []], ["خاضع", ["G2749"]], [" لسيطرة إبليس ", []], ["الشرير", ["G4190"]], [".", []]]}, {"c": 5, "v": 20, "text": "وإننا نعلم أن ابن الله قد جاء إلى الأرض وأنار أذهاننا لنعرف الإله الحق. ونحن الآن نحيا فيه، لأننا في ابنه يسوع المسيح. هذا هو الإله الحق، والحياة الأبدية.", "groups": [{"kw": "we know", "raw": "1Jo_5:1, 1Jo_4:2, 1Jo_4:14", "note": "", "refs": [{"l": "1Jo 5:1", "n": "", "vs": [[1, "كل من يؤمن حقا أن يسوع هو المسيح، فهو مولود من الله. ومن يحب الوالد، فلابد أن يحب المولودين منه أيضا."]]}, {"l": "1Jo 4:2", "n": "", "vs": [[2, "وهذه هي الطريقة التي تعرفون بها كون الروح من عند الله فعلا: إذا كان ذلك الروح يعترف بأن يسوع المسيح قد جاء إلى الأرض في الجسد، فهو من عند الله."]]}, {"l": "1Jo 4:14", "n": "", "vs": [[14, "ونحن أنفسنا نشهد أن الآب قد أرسل الابن مخلصا للعالم، لأننا رأيناه بعيوننا."]]}], "kwAr": "نعلم أن ابن الله قد جاء", "noteAr": ""}, {"kw": "and hath", "raw": "Mat_13:11; Luk_21:15, Luk_24:45; Joh_17:3, Joh_17:14, Joh_17:25; 1Co_1:30; 2Co_4:6; Eph_1:17-19, Eph_3:18; Col_2:2, Col_2:3", "note": "", "refs": [{"l": "Mat 13:11", "n": "", "vs": [[11, "فأجاب: «لأنه قد أعطي لكم أن تعرفوا أسرار ملكوت السماوات؛ أما أولئك، فلم يعط لهم ذلك."]]}, {"l": "Luk 21:15", "n": "", "vs": [[15, "لأني سوف أعطيكم كلاما وحكمة لا يقدر جميع مقاوميكم أن يردوها أو يناقضوها."]]}, {"l": "Luk 24:45", "n": "", "vs": [[45, "ثم فتح أذهانهم ليفهموا الكتب،"]]}, {"l": "Joh 17:3", "n": "", "vs": [[3, "والحياة الأبدية هي أن يعرفوك أنت الإله الحق وحدك، والذي أرسلته: يسوع المسيح."]]}, {"l": "Joh 17:14", "n": "", "vs": [[14, "أبلغتهم كلمتك، فأبغضهم العالم لأنهم ليسوا من العالم."]]}, {"l": "Joh 17:25", "n": "", "vs": [[25, "أيها الآب البار، إن العالم لم يعرفك، أما أنا فعرفتك، وهؤلاء عرفوا أنك أنت أرسلتني،"]]}, {"l": "1Co 1:30", "n": "", "vs": [[30, "وبفضل الله صار لكم مقام في المسيح يسوع الذي جعل لنا حكمة من الله وبرا وقداسة وفداء،"]]}, {"l": "2Co 4:6", "n": "", "vs": [[6, "فإن الله ، الذي أمر أن يشرق نور من الظلام، هو الذي جعل النور يشرق في قلوبنا، لإشعاع معرفة مجد الله المتجلي في وجه المسيح."]]}, {"l": "Eph 1:17-19", "n": "", "vs": [[17, "حتى يهبكم إله ربنا يسوع المسيح، أبو المجد، روح حكمة وإلهام: لتعرفوه معرفة كاملة"], [18, "إذ تستنير بصائر قلوبكم، فتعلموا ما في دعوته لكم من رجاء، وما هو غنى مجد ميراثه في القديسين،"], [19, "وما هي عظمة قدرته الفائقة المعلنة لنا نحن المؤمنين، بحسب عمل اقتدار قوته"]]}, {"l": "Eph 3:18", "n": "", "vs": [[18, "تصيرون قادرين تماما أن تدركوا، مع القديسين جميعا، ما هو العرض والطول والعلو والعمق،"]]}, {"l": "Col 2:2", "n": "", "vs": [[2, "بغرض أن تتشجع قلوبهم وتكون كلها متحدة في المحبة، لبلوغ الإدراك التام بكل غناه، لمعرفة سر الله، أي المسيح،"]]}, {"l": "Col 2:3", "n": "", "vs": [[3, "المخزونة فيه كنوز الحكمة والمعرفة كلها."]]}], "kwAr": "أنار أذهاننا", "noteAr": ""}, {"kw": "him that", "raw": "Joh_14:6, Joh_17:3; Rev_3:7, Rev_3:14, Rev_6:10, Rev_15:3, Rev_19:11", "note": "", "refs": [{"l": "Joh 14:6", "n": "", "vs": [[6, "فأجابه يسوع: «أنا هو الطريق والحق والحياة. لا يأتي أحد إلى الآب إلا بي."]]}, {"l": "Joh 17:3", "n": "", "vs": [[3, "والحياة الأبدية هي أن يعرفوك أنت الإله الحق وحدك، والذي أرسلته: يسوع المسيح."]]}, {"l": "Rev 3:7", "n": "", "vs": [[7, "واكتب إلى ملاك الكنيسة في فيلادلفيا: إليك ما يقوله القدوس الحق، الذي بيده مفتاح داود، يفتح ولا أحد يغلق، ويغلق ولا أحد يفتح."]]}, {"l": "Rev 3:14", "n": "", "vs": [[14, "واكتب إلى ملاك الكنيسة في لاودكية: إليك ما يقوله الحق، الشاهد الأمين الصادق، رئيس خليقة الله:"]]}, {"l": "Rev 6:10", "n": "", "vs": [[10, "وهم يصرخون للرب بأعلى صوتهم: «حتى متى، أيها السيد القدوس والحق، تؤخر معاقبة أهل الأرض على ما فعلوه بنا؟ متى تنتقم منهم لدمائنا؟»"]]}, {"l": "Rev 15:3", "n": "", "vs": [[3, "وينشدون ترتيلة موسى، عبد الله وترتيلة الحمل قائلين: «عظيمة وعجيبة أعمالك أيها الرب الإله القادر على كل شيء، عادلة ومستقيمة طرقك ياملك الدهور."]]}, {"l": "Rev 19:11", "n": "", "vs": [[11, "ثم رأيت السماء مفتوحة، وإذا حصان أبيض يسمى راكبه «الأمين الصادق» الذي يقضي ويحارب بالعدل."]]}], "kwAr": "الإله الحق", "noteAr": ""}, {"kw": "and we", "raw": "1Jo_2:6, 1Jo_2:24, 1Jo_4:16; Joh_10:30, Joh_14:20,Joh_14:23, Joh_15:4, Joh_17:20-23; 2Co_5:17; Phi_3:9", "note": "", "refs": [{"l": "1Jo 2:6", "n": "", "vs": [[6, "كل من يعترف أنه ثابت في المسيح، يلتزم أن يسلك كما سلك المسيح!"]]}, {"l": "1Jo 2:24", "n": "", "vs": [[24, "أما أنتم، فالكلام الذي سمعتموه منذ البداية، فليكن راسخا فيكم. فحين يترسخ ذلك الكلام في داخلكم، تتوطد صلتكم بالابن، وبالآب."]]}, {"l": "1Jo 4:16", "n": "", "vs": [[16, "ونحن أنفسنا اختبرنا المحبة التي خصنا الله بها، ووضعنا ثقتنا فيها. إن الله محبة. ومن يثبت في المحبة، فإنه يثبت في الله، والله يثبت فيه."]]}, {"l": "Joh 10:30", "n": "", "vs": [[30, "أنا والآب واحد!»"]]}, {"l": "Joh 14:20", "n": "", "vs": [[20, "في ذلك اليوم تعلمون أني أنا في أبي، وأنتم في، وأنا فيكم."]]}, {"l": "Joh 14:23", "n": "", "vs": [[23, "أجابه يسوع: «من يحبني يعمل بكلمتي، ويحبه أبي، وإليه نأتي، وعنده نجعل لنا منزلا."]]}, {"l": "Joh 15:4", "n": "", "vs": [[4, "فاثبتوا في وأنا فيكم. كما أن الغصن لا يقدر أن ينتج ثمرا إلا إذا ثبت في الكرمة؛ فكذلك أنتم، إلا إذا ثبتم في."]]}, {"l": "Joh 17:20-23", "n": "", "vs": [[20, "ولست أصلي من أجل هؤلاء فقط، بل أيضا من أجل الذين سوف يؤمنون بي بسبب كلمة هؤلاء،"], [21, "ليكون الجميع واحدا؛ أيها الآب، كما أنك أنت في وأنا فيك، ليكونوا هم أيضا واحدا فينا، لكي يؤمن العالم أنك أنت أرسلتني."], [22, "إني أعطيتهم المجد الذي أعطيتني، ليكونوا واحدا كما نحن واحد."], [23, "أنا فيهم، وأنت في، ليكتملوا فيصيروا واحدا، حتى يعرف العالم أنك أرسلتني وأنك أحببتهم كما أحببتني."]]}, {"l": "2Co 5:17", "n": "", "vs": [[17, "فإنه إذا كان أحد في المسيح، فهو خليقة جديدة: إن الأشياء القديمة قد زالت، وها كل شيء قد صار جديدا."]]}, {"l": "Phi 3:9", "n": "", "vs": [[9, "ويكون لي فيه مقام، إذ ليس لي بري الذاتي القائم على أساس الشريعة، بل البر الآتي من الإيمان بالمسيح، البر الذي من عند الله على أساس الإيمان."]]}], "kwAr": "نحيا فيه", "noteAr": ""}, {"kw": "This is", "raw": "1Jo_5:11-13, 1Jo_1:1-3; Isa_9:6, Isa_44:6, Isa_45:14, Isa_45:15, Isa_45:21-25, Isa_54:5; Jer_10:10, Jer_23:6; Joh_1:1-3, Joh_14:9, Joh_20:28; Act_20:28; Rom_9:5; 1Ti_3:16; Tit_2:13; Heb_1:8", "note": "", "refs": [{"l": "1Jo 5:11-13", "n": "", "vs": [[11, "وهذه الشهادة هي أن الله أعطانا حياة أبدية، وأن هذه الحياة هي في ابنه."], [12, "فمن كان له ابن الله كانت له الحياة. ومن لم يكن له ابن الله، لم تكن له الحياة!"], [13, "يامن آمنتم باسم ابن الله، إني كتبت هذا إليكم لكي تعرفوا أن الحياة الأبدية ملك لكم منذ الآن."]]}, {"l": "1Jo 1:1-3", "n": "", "vs": [[1, "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."], [2, "فإن «الحياة» تجلت أمامنا. وبعدما رأيناها فعلا، نشهد لها الآن. وها نحن ننقل إليكم خبر هذه الحياة الأبدية التي كانت عند الآب ثم تجلت أمامنا!"], [3, "فنحن، إذن، نخبركم بما رأيناه وسمعناه، لكي تكونوا شركاءنا. كما أن شركتنا هي مع الآب ومع ابنه يسوع المسيح."]]}, {"l": "Isa 9:6", "n": "", "vs": [[6, "لأنه يولد لنا ولد ويعطى لنا ابن يحمل الرياسة على كتفه، ويدعى اسمه عجيبا، مشيرا، إلها قديرا، أبا أبديا، رئيس السلام."]]}, {"l": "Isa 44:6", "n": "", "vs": [[6, "هذا ما يقوله الرب القدير ملك إسرائيل وفاديه: «أنا هو الأول والآخر، ولا إله غيري."]]}, {"l": "Isa 45:14", "n": "", "vs": [[14, "يقول الرب: يأتي إليكم المصريون والكوشيون والسبئيون بكل ما يملكونه من ثروات، ويضعونها عند أقدامكم، ويصيرون رعاياكم، يمشون خلفكم مصفدين بالأغلال، ويخرون ساجدين أمامكم قائلين: حقا إن الرب معكم ولا إله سوى إلهكم. هو وحده الإله لا غيره."]]}, {"l": "Isa 45:15", "n": "", "vs": [[15, "حقا أنت هو إله يحجب نفسه، إله إسرائيل المخلص."]]}, {"l": "Isa 45:21-25", "n": "", "vs": [[21, "أعلنوا، واعرضوا دعواكم. ليتشاوروا معا. من أنبأ بهذا منذ القدم، ومن أخبر به من زمن بعيد؟ ألست أنا الرب ولا إله غيري؟ بار ومخلص، وليس هناك آخر."], [22, "التفتوا إلي واخلصوا ياجميع أقاصي الأرض، لأني أنا الله وليس هناك آخر."], [23, "لقد أقسمت بذاتي، وخرجت من فمي، بكل صدق، كلمة لا تنقض: إنه ستجثو لي كل ركبة ويقسم بي كل لسان."], [24, "ويقولون عني: إنما بالرب وحده البر والقوة، وكل من يغتاظ منه يأتي إلى الرب ويخزى."], [25, "أما ذرية إسرائيل فبالرب يتبررون وبه يزهون."]]}, {"l": "Isa 54:5", "n": "", "vs": [[5, "لأن صانعك هو بعلك، والرب القدير اسمه، وفاديك هو قدوس إسرائيل الذي يدعى إله كل الأرض."]]}, {"l": "Jer 10:10", "n": "", "vs": [[10, "أما الرب فهو الإله الحق، الإله الحي والملك السرمدي. ترتعد الأرض أمام غضبه ولا تتحمل الأمم فرط سخطه."]]}, {"l": "Jer 23:6", "n": "", "vs": [[6, "في عهده يتم خلاص شعب يهوذا، ويسكن شعب إسرائيل آمنا. أما الاسم الذي سيدعى به فهو: الرب برنا."]]}, {"l": "Joh 1:1-3", "n": "", "vs": [[1, "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."], [2, "هو كان في البدء عند الله."], [3, "به تكون كل شيء، وبغيره لم يتكون أي شيء مما تكون."]]}, {"l": "Joh 14:9", "n": "", "vs": [[9, "فأجابه يسوع: «مضت هذه المدة الطويلة وأنا معكم ولم تعرفني يافيلبس؟ الذي رآني رأى الآب، فكيف تقول: أرنا الآب؟"]]}, {"l": "Joh 20:28", "n": "", "vs": [[28, "فهتف توما: «ربي وإلهي»."]]}, {"l": "Act 20:28", "n": "", "vs": [[28, "فاسهروا إذن على أنفسكم وعلى جميع القطيع الذي عينكم بينه الروح القدس نظارا، لترعوا كنيسة الله التي اشتراها بدمه."]]}, {"l": "Rom 9:5", "n": "", "vs": [[5, "ومنهم كان الآباء ومنهم جاء المسيح حسب الجسد، وهو فوق الجميع الله المبارك إلى الأبد. آمين."]]}, {"l": "1Ti 3:16", "n": "", "vs": [[16, "وبا
