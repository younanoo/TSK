sa 16:11", "n": "", "vs": [[11, "هديتني سبل الحياة: فإن ملء البهجة في حضرتك، وفي يمينك مسرات أبدية."]]}, {"l": "Mat 5:8", "n": "", "vs": [[8, "طوبى لأنقياء القلب، فإنهم سيرون الله ."]]}, {"l": "Joh 17:24", "n": "", "vs": [[24, "أيها الآب، أريد لهؤلاء الذين وهبتهم لي أن يكونوا معي حيث أكون أنا، فيشاهدوا مجدي الذي أعطيتني، لأنك أحببتني قبل إنشاء العالم."]]}, {"l": "1Co 13:12", "n": "", "vs": [[12, "ونحن الآن ننظر إلى الأمور من خلال زجاج قاتم فنراها بغموض. إلا أننا سنراها أخيرا مواجهة. الآن، أعرف معرفة جزئية. ولكني، عندئذ، سأعرف مثلما عرفت."]]}, {"l": "2Co 3:18", "n": "", "vs": [[18, "ونحن جميعا فيما ننظر إلى مجد الرب بوجوه كالمرآة لا حجاب عليها، نتجلى من مجد إلى مجد لنشابه الصورة الواحدة عينها، وذلك بفعل الرب الروح."]]}, {"l": "2Co 5:6-8", "n": "", "vs": [[6, "لذلك نحن واثقون دائما، وعالمون أننا مادمنا مقيمين في الجسد، نبقى مغتربين عن الرب،"], [7, "لأننا نسلك بالإيمان لا بالعيان."], [8, "فنحن واثقون إذن، وراضون بالأحرى أن نكون مغتربين عن الجسد ومقيمين عند الرب."]]}], "kwAr": "سنراه كما هو", "noteAr": ""}], "arS": [["أيها ", []], ["الأحباء", ["G27"]], ["، نحن ", []], ["الآن", ["G3568"]], [" ", []], ["أولاد", ["G5043"]], [" ", []], ["الله", ["G2316"]], [". ولا نعلم ", []], ["حتى الآن", ["G3768"]], [" ", []], ["ماذا", ["G5101"]], [" ", []], ["سنكون", ["G2071"]], ["، لكننا ", []], ["نعلم", ["G1492"]], [" أنه متى ", []], ["أظهر", ["G5319"]], [" المسيح، سنكون ", []], ["مثله", ["G3664"]], ["، لأننا ", []], ["سنراه", ["G3700"]], [" عندئذ كما هو!", []]]}, {"c": 3, "v": 3, "text": "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر.", "groups": [{"kw": "every", "raw": "Rom_5:4, Rom_5:5; Col_1:5; 2Th_2:16; Tit_3:7; Heb_6:18", "note": "", "refs": [{"l": "Rom 5:4", "n": "", "vs": [[4, "والصبر يؤهلنا للفوز في الامتحان، والفوز يبعث فينا الرجاء،"]]}, {"l": "Rom 5:5", "n": "", "vs": [[5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."]]}, {"l": "Col 1:5", "n": "", "vs": [[5, "بسبب الرجاء المحفوظ لكم في السماوات، الرجاء الذي سمعتم به سابقا في كلمة الحق التي في الإنجيل"]]}, {"l": "2Th 2:16", "n": "", "vs": [[16, "وليت ربنا يسوع المسيح نفسه، والله أبانا، الذي أحبنا ووهبنا بنعمته راحة أبدية ورجاء صالحا،"]]}, {"l": "Tit 3:7", "n": "", "vs": [[7, "حتى إذا تبررنا بنعمته، نصير ورثة، وفقا لرجائنا بالحياة الأبدية."]]}, {"l": "Heb 6:18", "n": "", "vs": [[18, "فاستنادا إلى وعد الله وقسمه، وهما أمران ثابتان لا يتغيران ويستحيل أن يكذب الله فيهما، نحصل على تشجيع قوي، بعدما التجأنا إلى التمسك بالرجاء الموضوع أمامنا."]]}], "kwAr": "كل من عنده هذا الرجاء", "noteAr": ""}, {"kw": "purifieth", "raw": "Act_15:9; 2Co_7:1; Heb_12:14; 2Pe_1:4, 2Pe_3:14", "note": "", "refs": [{"l": "Act 15:9", "n": "", "vs": [[9, "فهو لم يفرق بيننا وبينهم في شيء، إذ طهر بالإيمان قلوبهم."]]}, {"l": "2Co 7:1", "n": "", "vs": [[1, "فإذ نلنا هذه الوعود، أيها الأحباء، لنطهر أنفسنا من كل ما يدنس الجسد والروح، ونكمل القداسة في مخافة الله."]]}, {"l": "Heb 12:14", "n": "", "vs": [[14, "اجعلوا هدفكم أن تسالموا جميع الناس، وتعيشوا حياة مقدسة. فبغير قداسة، لا يقدر أحد أن يرى الرب."]]}, {"l": "2Pe 1:4", "n": "", "vs": [[4, "اللذين بهما أعطانا الله بركاته العظمى الثمينة التي كان قد وعد بها. وبهذا صار بإمكانكم أن تتخلصوا من الفساد الذي تنشره الشهوة في العالم، وتشتركوا في الطبيعة الإلهية."]]}, {"l": "2Pe 3:14", "n": "", "vs": [[14, "فبينما تنتظرون إتمام هذا الوعد، أيها الأحباء، اجتهدوا أن يجدكم الرب في سلام، خالين من الدنس والعيب."]]}], "kwAr": "يطهر نفسه", "noteAr": ""}, {"kw": "even", "raw": "1Jo_2:6, 1Jo_4:17; Mat_5:48; Luk_6:36; Heb_7:26", "note": "", "refs": [{"l": "1Jo 2:6", "n": "", "vs": [[6, "كل من يعترف أنه ثابت في المسيح، يلتزم أن يسلك كما سلك المسيح!"]]}, {"l": "1Jo 4:17", "n": "", "vs": [[17, "وتكون محبة الله قد اكتملت في داخلنا حين تولد فينا ثقة كاملة من جهة يوم الدينونة: لأنه كما المسيح، هكذا نحن أيضا في هذا العالم."]]}, {"l": "Mat 5:48", "n": "", "vs": [[48, "فكونوا أنتم كاملين، كما أن أباكم السماوي هو كامل!"]]}, {"l": "Luk 6:36", "n": "", "vs": [[36, "فكونوا أنتم رحماء، كما أن أباكم رحيم."]]}, {"l": "Heb 7:26", "n": "", "vs": [[26, "نعم، هذا هو رئيس الكهنة الذي كنا محتاجين إليه. إنه قدوس، لا عيبة فيه، ولا نجاسة، قد انفصل عن الخاطئين، وارتفع حتى صار أسمى من السماوات."]]}], "kwAr": "كما أن المسيح طاهر", "noteAr": ""}], "arS": [["وكل", ["G3956"]], [" من عنده هذا ", []], ["الرجاء", ["G1680"]], [" بالمسيح، ", []], ["يطهر", ["G48"]], [" ", []], ["نفسه", ["G1438"]], [" كما أن المسيح ", []], ["طاهر", ["G53"]], [".", []]]}, {"c": 3, "v": 4, "text": "أما الذي يمارس الخطيئة، فهو يخالف ناموس الله: لأن الخطيئة هي مخالفة الناموس.", "groups": [{"kw": "committeth", "raw": "1Jo_3:8, 1Jo_3:9; 1Ki_8:47; 1Ch_10:13; 2Co_12:21; Jam_5:15", "note": "", "refs": [{"l": "1Jo 3:8", "n": "", "vs": [[8, "ولكن من يمارس الخطيئة، يظهر أنه من أولاد إبليس، لأن إبليس يمارس الخطيئة منذ البداية. وقد جاء ابن الله إلى الأرض لكي يبطل أعمال إبليس."]]}, {"l": "1Jo 3:9", "n": "", "vs": [[9, "فكل مولود من الله، لا يمارس الخطيئة، لأن طبيعة الله صارت ثابتة فيه. بل إنه لا يستطيع أن يمارس الخطيئة، لأنه مولود من الله."]]}, {"l": "1Ki 8:47", "n": "", "vs": [[47, "فإن تابوا في أرض سبيهم ورجعوا متضرعين إليك قائلين: قد أخطأنا وانحرفنا وأذنبنا،"]]}, {"l": "1Ch 10:13", "n": "", "vs": [[13, "وهكذا مات شاول من جراء خيانته وعصيانه للرب، ولأنه لجأ إلى الجان طلبا للمشورة."]]}, {"l": "2Co 12:21", "n": "", "vs": [[21, "وأخشى أن يجعلني إلهي ذليلا بينكم عند مجيئي إليكم مرة أخرى، فيكون حزني شديدا على كثيرين من الذين أخطأوا قبلا ولم يتوبوا عما ارتكبوا من دنس وزنى وفسق!"]]}, {"l": "Jam 5:15", "n": "", "vs": [[15, "فالصلاة المرفوعة باءيمان تشفي المريض، إذ يعيد الرب إليه الصحة. وإن كان مرضه بسبب خطيئة ما، يغفرها الرب له."]]}], "kwAr": "الذي يمارس الخطيئة", "noteAr": ""}, {"kw": "transgresseth", "raw": "Num_15:31; 1Sa_15:24; 2Ch_24:20; Isa_53:8; Dan_9:11; Rom_3:20, Rom_4:15; Jam_2:9-11", "note": "", "refs": [{"l": "Num 15:31", "n": "", "vs": [[31, "لأنه احتقر كلامي ونقض وصيتي، لهذا يستأصل متحملا عقاب ذنبه»."]]}, {"l": "1Sa 15:24", "n": "", "vs": [[24, "فقال شاول: «لقد أخطأت لأني عصيت أمر الرب ووصيتك، إذ خشيت الشعب فسمعت لقولهم."]]}, {"l": "2Ch 24:20", "n": "", "vs": [[20, "فحل روح الله على زكريا بن يهوياداع الكاهن، فوقف أمام الشعب وقال لهم: «هذا ما يقوله الله : لماذا تتعدون أوامر الرب فلا تفلحون؟ لقد نبذتم الرب فنبذكم الرب»."]]}, {"l": "Isa 53:8", "n": "", "vs": [[8, "بالضيق والقضاء قبض عليه، وفي جيله من كان يظن أنه استؤصل من أرض الأحياء، وضرب من أجل إثم شعبي؟"]]}, {"l": "Dan 9:11", "n": "", "vs": [[11, "قد تعدى كل شعب إسرائيل على شريعتك، وانحرفوا فلم يسمعوا صوتك، فسكبت علينا اللعنة وما أقسمت أن توقعه بنا، كما نصت عليه شريعة موسى عبد الله، لأننا أخطأنا إليك."]]}, {"l": "Rom 3:20", "n": "", "vs": [[20, "فإن أحدا من البشر لا يتبرر أمامه بالأعمال المطلوبة في الشريعة. إذ إن الشريعة هي لإظهار الخطيئة."]]}, {"l": "Rom 4:15", "n": "", "vs": [[15, "لأن الشريعة إنما تنتج الغضب؛ فلولا الشريعة لما ظهرت المخالفة."]]}, {"l": "Jam 2:9-11", "n": "", "vs": [[9, "ولكن عندما تعاملون الناس بالانحياز والتمييز، ترتكبون خطيئة وتحكم عليكم الشريعة باعتباركم مخالفين لها."], [10, "فأنتم تعرفون أن من يطيع جميع الوصايا الواردة في شريعة موسى، ويخالف واحدة منها فقط، يصير مذنبا، تماما كالذي يخالف الوصايا كلها."], [11, "فإن الله ، مثلا، قال: «لا تزن» كما قال: «لا تقتل!» فإن لم تزن، ولكن قتلت، فقد خرقت الشريعة."]]}], "kwAr": "يخالف ناموس الله", "noteAr": ""}, {"kw": "for", "raw": "1Jo_5:17; Rom_7:7-13", "note": "", "refs": [{"l": "1Jo 5:17", "n": "", "vs": [[17, "كل إثم هو خطيئة، ولا تنتهي كل خطيئة إلى الموت."]]}, {"l": "Rom 7:7-13", "n": "", "vs": [[7, "إذن، ماذا نقول؟ هل الشريعة خطيئة؟ حاشا! ولكني ما عرفت الخطيئة إلا بالشريعة. فما كنت لأعرف الشهوة لولا قول الشريعة: «لا تشته!»"], [8, "ولكن الخطيئة استغلت هذه الوصية فأثارت في كل شهوة. فإن الخطيئة، لولا الشريعة، ميتة."], [9, "أما أنا فكنت من قبل عائشا بمعزل عن الشريعة؛ ولكن لما جاءت الشريعة عاشت الخطيئة،"], [10, "فمت أنا. والوصية الهادفة إلى الحياة، صارت لي مؤدية إلى الموت."], [11, "فإن الخطيئة، إذ استغلت الوصية، خدعتني وقتلتني بها."], [12, "فالشريعة إذن مقدسة، والوصية مقدسة وعادلة وصالحة."], [13, "فهل صار ما هو صالح موتا لي؟ حاشا! ولكن الخطيئة، لكي تظهر أنها خطيئة، أنتجت لي الموت بما هو صالح، حتى تصير الخطيئة خاطئة جدا بسبب الوصية."]]}], "kwAr": "الخطيئة هي مخالفة الناموس", "noteAr": ""}], "arS": [["أما الذي ", []], ["يمارس", ["G4160"]], [" ", []], ["الخطيئة", ["G266"]], ["، فهو ", []], ["يخالف ناموس", ["G458"]], [" الله: لأن ", []], ["الخطيئة", ["G266"]], [" هي ", []], ["مخالفة الناموس", ["G458"]], [".", []]]}, {"c": 3, "v": 5, "text": "وأنتم تعرفون أن المسيح جاء إلى هذه الأرض لكي يحمل الخطايا، مع كونه بلا خطيئة.", "groups": [{"kw": "he", "raw": "1Jo_1:2, 1Jo_4:9-14; Joh_1:31; 1Ti_3:16; 1Pe_1:20", "note": "", "refs": [{"l": "1Jo 1:2", "n": "", "vs": [[2, "فإن «الحياة» تجلت أمامنا. وبعدما رأيناها فعلا، نشهد لها الآن. وها نحن ننقل إليكم خبر هذه الحياة الأبدية التي كانت عند الآب ثم تجلت أمامنا!"]]}, {"l": "1Jo 4:9-14", "n": "", "vs": [[9, "وقد أظهر الله محبته لنا إذ أرسل ابنه الأوحد إلى العالم لكي نحيا به."], [10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."], [11, "ومادام الله قد أحبنا هذه المحبة العظيمة، أيها الأحباء، فعلينا نحن أيضا أن نحب بعضنا بعضا."], [12, "إن الله لم يره أحد من الناس قط. ولكن، حين نحب بعضنا بعضا، نبين أن الله يحيا في داخلنا، وأن محبته قد اكتملت في داخلنا."], [13, "وما يؤكد لنا أننا نثبت في الله، وأنه يثبت فينا هو أنه وهب لنا من روحه."], [14, "ونحن أنفسنا نشهد أن الآب قد أرسل الابن مخلصا للعالم، لأننا رأيناه بعيوننا."]]}, {"l": "Joh 1:31", "n": "", "vs": [[31, "ولم أكن أعرفه ولكني جئت أعمد بالماء لكي يعلن لإسرائيل»."]]}, {"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}, {"l": "1Pe 1:20", "n": "", "vs": [[20, "ومع أن الله كان قد عين المسيح لهذا الغرض قبل تأسيس العالم، فهو لم يعلنه إلا في هذا الزمن الأخير لفائدتكم"]]}], "kwAr": "المسيح جاء", "noteAr": ""}, {"kw": "to", "raw": "1Jo_1:7; Isa_53:4-12; Hos_14:2; Mat_1:21; Joh_1:29; Rom_3:24-26; Eph_5:25-27; 1Ti_1:15; Tit_2:14; Heb_1:3, Heb_9:26, Heb_9:28; 1Pe_2:24; Rev_1:5", "note": "", "refs": [{"l": "1Jo 1:7", "n": "", "vs": [[7, "ولكن، إن كنا فعلا نعيش في النور، كما هو في النور، تكون لنا حقا شركة بعضنا مع بعض، ودم ابنه يسوع يطهرنا من كل خطيئة."]]}, {"l": "Isa 53:4-12", "n": "", "vs": [[4, "لكنه حمل أحزاننا وتحمل أوجاعنا، ونحن حسبنا أن الرب قد عاقبه وأذله،"], [5, "إلا أنه كان مجروحا من أجل آثامنا ومسحوقا من أجل معاصينا، حل به تأديب سلامنا، وبجراحه برئنا."], [6, "كلنا كغنم شردنا ملنا كل واحد إلى سبيله، فأثقل الرب كاهله بإثم جميعنا."], [7, "ظلم وأذل، ولكنه لم يفتح فاه، بل كشاة سيق إلى الذبح، وكنعجة صامتة أمام جازيها لم يفتح فاه."], [8, "بالضيق والقضاء قبض عليه، وفي جيله من كان يظن أنه استؤصل من أرض الأحياء، وضرب من أجل إثم شعبي؟"], [9, "جعلوا قبره مع الأشرار، ومع ثري عند موته. مع أنه لم يرتكب جورا، ولم يكن في فمه غش."], [10, "ومع ذلك فقد سر الله أن يسحقه بالحزن. وحين يقدم نفسه ذبيحة إثم فإنه يرى نسله وتطول أيامه، وتفلح مسرة الرب على يده."], [11, "ويرى ثمار تعب نفسه ويشبع، وعبدي البار يبرر بمعرفته كثيرين ويحمل آثامهم."], [12, "لذلك أهبه نصيبا بين العظماء، فيقسم غنيمة مع الأعزاء، لأنه سكب للموت نفسه، وأحصي مع أثمة. وهو حمل خطيئة كثيرين، وشفع في المذنبين."]]}, {"l": "Hos 14:2", "n": "", "vs": [[2, "احملوا معكم كلام ابتهال وارجعوا إلى الرب قائلين له: «انزع إثمنا، وتقبلنا بفائق رحمتك، فنزجي إليك حمد شفاهنا كالقرابين."]]}, {"l": "Mat 1:21", "n": "", "vs": [[21, "فستلد ابنا، وأنت تسميه يسوع، لأنه هو الذي يخلص شعبه من خطاياهم»."]]}, {"l": "Joh 1:29", "n": "", "vs": [[29, "وفي اليوم التالي رأى يوحنا يسوع آتيا نحوه، فهتف قائلا: «هذا هو حمل الله الذي يزيل خطيئة العالم."]]}, {"l": "Rom 3:24-26", "n": "", "vs": [[24, "فهم يبررون مجانا، بنعمته، بالفداء بالمسيح يسوع"], [25, "الذي قدمه الله كفارة، عن طريق الإيمان، وذلك بدمه."], [26, "ليظهر بر الله إذ تغاضى، بإمهاله الإلهي، عن الخطايا التي حدثت في الماضي، ويظهر أيضا بره في الزمن الحاضر: فيتبين أنه بار وأنه يبرر من له الإيمان بيسوع."]]}, {"l": "Eph 5:25-27", "n": "", "vs": [[25, "أيها الأزواج، أحبوا زوجاتكم مثلما أحب المسيح الكنيسة وبذل نفسه لأجلها،"], [26, "لكي يقدسها مطهرا إياها بغسل الماء، بالكلمة،"], [27, "حتى يزفها إلى نفسه كنيسة بهية لا يشوبها عيب أو تجعد أو أية نقيصة مشابهة بل تكون مقدسة خالية من العيوب."]]}, {"l": "1Ti 1:15", "n": "", "vs": [[15, "ما أصدق هذا القول، وما أجدره بالتصديق الكلي: إن المسيح يسوع قد جاء إلى العالم ليخلص الخاطئين، وأنا أولهم!"]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Heb 1:3", "n": "", "vs": [[3, "إنه ضياء مجد الله وصورة جوهره. حافظ كل ما في الكون بكلمته القديرة. وهو الذي بعدما طهرنا بنفسه من خطايانا،"]]}, {"l": "Heb 9:26", "n": "", "vs": [[26, "وإلا لكان يجب أن يموت المسيح متألما مرات كثيرة منذ تأسيس العالم! ولكنه الآن، عند انتهاء الأزمنة، ظهر مرة واحدة ليبطل قوة الخطيئة بتقديم نفسه ذبيحة لله."]]}, {"l": "Heb 9:28", "n": "", "vs": [[28, "كذلك المسيح أيضا: مات مرة واحدة حاملا خطايا كثيرين، مقربا نفسه (لله) عوضا عنهم. ولا بد أن يعود إلى الظهور. لا ليعالج الخطايا، بل ليحقق الخلاص النهائي لجميع منتظريه!"]]}, {"l": "1Pe 2:24", "n": "", "vs": [[24, "وهو نفسه حمل خطايانا في جسده (عندما مات مصلوبا) على الخشبة، لكي نموت بالنسبة للخطايا فنحيا حياة البر. وبجراحه هو تم لكم الشفاء،"]]}, {"l": "Rev 1:5", "n": "", "vs": [[5, "ومن يسوع المسيح الشاهد الأمين، بكر القائمين من بين الأموات، ملك ملوك الأرض، ذاك الذي بدافع محبته لنا مات لأجلنا فغسلنا بدمه من خطايانا،"]]}], "kwAr": "لكي يحمل الخطايا", "noteAr": ""}, {"kw": "in", "raw": "1Jo_2:1; Luk_23:41, Luk_23:47; Joh_8:46, Joh_14:30; 2Co_5:21; Heb_4:15, Heb_7:26, Heb_9:28; 1Pe_2:22, 1Pe_3:18", "note": "", "refs": [{"l": "1Jo 2:1", "n": "", "vs": [[1, "ياأولادي الصغار، أكتب إليكم هذه الأمور لكي لا تخطئوا. ولكن، إن أخطأ أحدكم، فلنا عند الآب شفيع هو يسوع المسيح البار."]]}, {"l": "Luk 23:41", "n": "", "vs": [[41, "أما نحن فعقوبتنا عادلة لأننا ننال الجزاء العادل لقاء ما فعلنا. وأما هذا الإنسان، فلم يفعل شيئا في غير محله!»"]]}, {"l": "Luk 23:47", "n": "", "vs": [[47, "فلما رأى قائد المئة ما حدث، مجد الله قائلا: «بالحقيقة كان هذا الإنسان بارا»."]]}, {"l": "Joh 8:46", "n": "", "vs": [[46, "من منكم يثبت علي خطيئة؟ فما دمت أقول الحق، فلماذا لا تصدقونني؟"]]}, {"l": "Joh 14:30", "n": "", "vs": [[30, "لن أكلمكم كثيرا بعد، فإن سيد هذا العالم قادم علي، ولا شيء له في."]]}, {"l": "2Co 5:21", "n": "", "vs": [[21, "فإن الذي لم يعرف خطيئة، جعله الله خطيئة لأجلنا، لنصير نحن بر الله فيه."]]}, {"l": "Heb 4:15", "n": "", "vs": [[15, "ذلك لأن رئيس الكهنة الذي لنا، ليس عاجزا عن تفهم ضعفاتنا، بل إنه قد تعرض للتجارب التي نتعرض نحن لها، إلا أنه بلا خطية."]]}, {"l": "Heb 7:26", "n": "", "vs": [[26, "نعم، هذا هو رئيس الكهنة الذي كنا محتاجين إليه. إنه قدوس، لا عيبة فيه، ولا نجاسة، قد انفصل عن الخاطئين، وارتفع حتى صار أسمى من السماوات."]]}, {"l": "Heb 9:28", "n": "", "vs": [[28, "كذلك المسيح أيضا: مات مرة واحدة حاملا خطايا كثيرين، مقربا نفسه (لله) عوضا عنهم. ولا بد أن يعود إلى الظهور. لا ليعالج الخطايا، بل ليحقق الخلاص النهائي لجميع منتظريه!"]]}, {"l": "1Pe 2:22", "n": "", "vs": [[22, "إنه لم يفعل خطيئة واحدة، ولا كان في فمه مكر."]]}, {"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}], "kwAr": "بلا خطيئة", "noteAr": ""}], "arS": [["وأنتم ", []], ["تعرفون", ["G1492"]], [" أن المسيح ", []], ["جاء", ["G5319"]], [" إلى هذه الأرض لكي ", []], ["يحمل", ["G142"]], [" ", []], ["الخطايا", ["G266"]], ["، مع كونه بلا ", []], ["خطيئة", ["G266"]], [".", []]]}, {"c": 3, "v": 6, "text": "فكل من يثبت فيه، لا يمارس الخطيئة. أما الذين يمارسون الخطيئة، فهم لم يروه ولم يتعرفوا به قط.", "groups": [{"kw": "abideth", "raw": "1Jo_2:28; Joh_15:4-7", "note": "", "refs": [{"l": "1Jo 2:28", "n": "", "vs": [[28, "والآن، أيها الأولاد، كونوا ثابتين في المسيح، حتى تكون لنا نحن ثقة أمامه، ولا نخجل منه، عندما يعود."]]}, {"l": "Joh 15:4-7", "n": "", "vs": [[4, "فاثبتوا في وأنا فيكم. كما أن الغصن لا يقدر أن ينتج ثمرا إلا إذا ثبت في الكرمة؛ فكذلك أنتم، إلا إذا ثبتم في."], [5, "أنا الكرمة وأنتم الأغصان. من يثبت في وأنا فيه، فذاك ينتج ثمرا كثيرا. فإنكم بمعزل عني لا تقدرون أن تفعلوا شيئا."], [6, "إن كان أحد لا يثبت في يطرح خارجا كالغصن فيجف؛ ثم تجمع الأغصان الجافة، وتطرح في النار فتحترق."], [7, "ولكن، إن ثبتم في، وثبت كلامي فيكم، فاطلبوا ما تريدون يكن لكم."]]}], "kwAr": "من يثبت فيه", "noteAr": ""}, {"kw": "whosoever", "raw": "1Jo_3:2, 1Jo_3:9, 1Jo_2:4, 1Jo_4:8, 1Jo_5:18; 2Co_3:18, 2Co_4:6; 3Jo_1:11", "note": "", "refs": [{"l": "1Jo 3:2", "n": "", "vs": [[2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"]]}, {"l": "1Jo 3:9", "n": "", "vs": [[9, "فكل مولود من الله، لا يمارس الخطيئة، لأن طبيعة الله صارت ثابتة فيه. بل إنه لا يستطيع أن يمارس الخطيئة، لأنه مولود من الله."]]}, {"l": "1Jo 2:4", "n": "", "vs": [[4, "فالذي يدعي أنه قد عرفه، ولكنه لا يعمل بوصاياه، يكون كاذبا ولا يكون الحق في داخله."]]}, {"l": "1Jo 4:8", "n": "", "vs": [[8, "أما من لا يحب، فهو لم يتعرف بالله قط لأن الله محبة!"]]}, {"l": "1Jo 5:18", "n": "", "vs": [[18, "نحن واثقون بأن كل من ولد من الله لا يمارس الخطيئة، لأن ابن الله يحميه فلا يمسه إبليس الشرير."]]}, {"l": "2Co 3:18", "n": "", "vs": [[18, "ونحن جميعا فيما ننظر إلى مجد الرب بوجوه كالمرآة لا حجاب عليها، نتجلى من مجد إلى مجد لنشابه الصورة الواحدة عينها، وذلك بفعل الرب الروح."]]}, {"l": "2Co 4:6", "n": "", "vs": [[6, "فإن الله ، الذي أمر أن يشرق نور من الظلام، هو الذي جعل النور يشرق في قلوبنا، لإشعاع معرفة مجد الله المتجلي في وجه المسيح."]]}, {"l": "3Jo 1:11", "n": "", "vs": [[11, "أيها الحبيب، لا تقتد بما هو شر، بل بما هو خير. فإن من يفعل الخير، يكون من الله. ومن يفعل الشر، يبين أنه لم يتعرف بالله قط."]]}], "kwAr": "الذين يمارسون الخطيئة", "noteAr": ""}], "arS": [["فكل", ["G3956"]], [" من ", []], ["يثبت", ["G3306"]], [" فيه، لا ", []], ["يمارس الخطيئة", ["G264"]], [". أما الذين ", []], ["يمارسون الخطيئة", ["G264"]], ["، فهم لم ", []], ["يروه", ["G3708"]], [" ولم ", []], ["يتعرفوا", ["G1097"]], [" به قط.", []]]}, {"c": 3, "v": 7, "text": "أيها الأولاد الصغار، لا تدعوا أحدا يضللكم. تأكدوا أن من يمارس الصلاح، يظهر أنه بار كما أن المسيح بار.", "groups": [{"kw": "let", م يلتفت إلى أصنام شعب إسرائيل، ولم يزن مع امرأة جاره ولم يعاشر امرأة طامثا،"], [7, "ولم يظلم أحدا، بل رد للمديون رهنه، ولم يسلب قط، وأطعم الجائع خبزه وكسا العريان ثوبا،"], [8, "ولم يقرض بالربا ولم يأخذ حراما، وكف يده عن ارتكاب الإثم، وقضى بالإنصاف والحق بين إنسان وإنسان."], [9, "ومارس فرائضي، وأطاع أحكامي بأمانة، فهو صديق وحتما يحيا، يقول السيد الرب."]]}, {"l": "Mat 5:20", "n": "", "vs": [[20, "فإني أقول لكم: إن لم يزد بركم على بر الكتبة والفريسيين، لن تدخلوا ملكوت السماوات أبدا."]]}, {"l": "Luk 1:75", "n": "", "vs": [[75, "بقداسة وبر أمامه، طوال حياتنا."]]}, {"l": "Act 10:35", "n": "", "vs": [[35, "بل يقبل من يتقيه ويعمل الصلاح مهما كانت جنسيته."]]}, {"l": "Rom 2:6-8", "n": "", "vs": [[6, "فإنه سيجازي كل إنسان بحسب أعماله."], [7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"], [8, "ويكون الغضب والسخط للمخاصمين الذين يرفضون الطاعة للحق ولكنهم يخضعون للإثم."]]}, {"l": "Rom 2:13", "n": "", "vs": [[13, "فليس سامعو الشريعة هم الأبرار أمام الله؛ بل العاملون بالشريعة يبررون."]]}, {"l": "Rom 6:16-18", "n": "", "vs": [[16, "أما تعلمون أنكم عندما تقدمون أنفسكم عبيدا للطاعة، تكونون للذي تطيعونه عبيدا: إما للخطيئة فإلى الموت، وإما للطاعة فإلى البر؟"], [17, "إنما الشكر لله، لأنكم كنتم عبيدا للخطيئة ولكن أطعتم من القلب صيغة التعليم الذي وضعتم في عهدته."], [18, "والآن، إذ حررتم من الخطيئة، صرتم عبيدا للبر."]]}, {"l": "Eph 5:9", "n": "", "vs": [[9, "فإن ثمر النور يكون في كل صلاح واستقامة وحق."]]}, {"l": "Phi 1:11", "n": "", "vs": [[11, "كاملين في ثمار البر الآتية بيسوع المسيح، لمجد الله وحمده."]]}, {"l": "1Pe 2:24", "n": "", "vs": [[24, "وهو نفسه حمل خطايانا في جسده (عندما مات مصلوبا) على الخشبة، لكي نموت بالنسبة للخطايا فنحيا حياة البر. وبجراحه هو تم لكم الشفاء،"]]}], "kwAr": "من يمارس الصلاح", "noteAr": ""}, {"kw": "even", "raw": "1Jo_3:3, 1Jo_2:1; Psa_45:7, Psa_72:1-7; Heb_1:8, Heb_7:2; 1Pe_1:15, 1Pe_1:16", "note": "", "refs": [{"l": "1Jo 3:3", "n": "", "vs": [[3, "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر."]]}, {"l": طيئة", "noteAr": ""}], "arS": [["فكل", ["G3956"]], [" ", []], ["مولود", ["G1080"]], [" من ", []], ["الله", ["G2316"]], ["، لا ", []], ["يمارس", ["G4160"]], [" ", []], ["الخطيئة", ["G266"]], ["، لأن ", []], ["طبيعة", ["G4690"]], [" الله صارت ", []], ["ثابتة", ["G3306"]], [" فيه. بل إنه لا ", []], ["يستطيع", ["G1410"]], [" أن ", []], ["يمارس الخطيئة", ["G264"]], ["، لأنه ", []], ["مولود", ["G1080"]], [" من ", []], ["الله", ["G2316"]], [".", []]]}, {"c": 3, "v": 10, "text": "إذن، هذا هو المقياس الذي نميز به بين أولاد الله وأولاد إبليس. من لا يمارس الصلاح، فهو ليس من الله. وكذلك من لا يحب أخاه!", "groups": [{"kw": "the children of God", "raw": "1Jo_5:2; Luk_6:35; Rom_8:16, Rom_8:17; Eph_5:1", "note": "", "refs": [{"l": "1Jo 5:2", "n": "", "vs": [[2, "وما يثبت لنا محبتنا لأولاد الله هو أن نحب الله ونعمل بوصاياه."]]}, {"l": "Luk 6:35", "n": "", "vs": [[35, "ولكن، أحبوا أعداءكم، وأحسنوا المعاملة، وأقرضوا دون أن تأملوا استيفاء القرض، فتكون مكافأتكم عظيمة، وتكونوا أبناء العلي، لأنه ينعم على ناكري الجميل والأشرار."]]}, {"l": "Rom 8:16", "n": "", "vs": [[16, "فالروح نفسه يشهد مع أرواحنا بأننا أولاد الله."]]}, {"l": "Rom 8:17", "n": "", "vs": [[17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}, {"l": "Eph 5:1", "n": "", "vs": [[1, "فاقتدوا إذن بالله كأولاد أحباء،"]]}], "kwAr": "أولاد الله", "noteAr": ""}, {"kw": "and", "raw": "Mat_13:38; Joh_8:44; Act_13:10", "note": "", "refs": [{"l": "Mat 13:38", "n": "", "vs": [[38, "والحقل هو العالم. والزرع الجيد هو بنو الملكوت. والزوان هو بنو الشرير."]]}, {"l": "Joh 8:44", "n": "", "vs": [[44, "إنكم أولاد أبيكم إبليس، وترغبون أن تعملوا شهوات أبيكم. فهو من البدء كان قاتلا للناس، ولم يثبت في الحق لأنه خال من الحق! وعندما ينطق بالكذب فهو ينضح بما فيه، لأنه كذاب وأبو الكذب!"]]}, {"l": "Act 13:10", "n": "", "vs": [[10, "«أيها الممتليء غشا وخبثا! ياابن إبليس! ياعدو كل بر! أما تكف عن تعويج طرق الرب المستقيمة؟"]]}], "kwAr": "وأولاد إبليس", "noteAr": ""}, {"kw": "whosoever", "raw": "1Jo_3:7, 1Jo_3:8, 1Jo_2:29", "note": "", "refs": [{"l": "1Jo 3:7", "n": "", "vs": [[7, "أيها الأولاد الصغار، لا تدعوا أحدا يضللكم. تأكدوا أن من يمارس الصلاح، يظهر أنه بار كما أن المسيح بار."]]}, {"l": "1Jo 3:8", "n": "", "vs": [[8, "ولكن من يمارس الخطيئة، يظهر أنه من أولاد إبليس، لأن إبليس يمارس الخطيئة منذ البداية. وقد جاء ابن الله إلى الأرض لكي يبطل أعمال إبليس."]]}, {"l": "1Jo 2:29", "n": "", "vs": [[29, "وما دمتم تعلمون أن الله بار، فاعلموا أن كل من يفعل الصلاح، يظهر أنه مولود من الله حقا."]]}], "kwAr": "من لا يمارس الصلاح", "noteAr": ""}, {"kw": "is", "raw": "1Jo_4:3, 1Jo_4:4, 1Jo_4:6, 1Jo_5:19; Joh_8:47; 3Jo_1:11", "note": "", "refs": [{"l": "1Jo 4:3", "n": "", "vs": [[3, "وإن كان ينكر ذلك لا يكون من عند الله، بل من عند ضد المسيح الذي سمعتم أنه سوف يأتي، وهو الآن موجود في العالم."]]}, {"l": "1Jo 4:4", "n": "", "vs": [[4, "أيها الأولاد الصغار، أنتم من الله، وقد غلبتم الذين يقاومون المسيح: لأن الروح القدس الساكن فيكم أقوى من الروح الشرير المنتشر في العالم."]]}, {"l": "1Jo 4:6", "n": "", "vs": [[6, "أما نحن، فإننا من الله، ولذلك يصغي إلينا فقط من يعرف الله . أما الذي ليس من الله، فلا يصغي إلينا. وبهذا، نميز بين روح الحق وروح الضلال."]]}, {"l": "1Jo 5:19", "n": "", "vs": [[19, "ونحن واثقون أيضا بأننا من الله، وأن العالم كله خاضع لسيطرة إبليس الشرير."]]}, {"l": "Joh 8:47", "n": "", "vs": [[47, "من كان من الله حقا، يسمع كلام الله. ولكنكم ترفضون كلام الله، لأنكم لستم من الله!»"]]}, {"l": "3Jo 1:11", "n": "", "vs": [[11, "أيها الحبيب، لا تقتد بما هو شر، بل بما هو خير. فإن من يفعل الخير، يكون من الله. ومن يفعل الشر، يبين أنه لم يتعرف بالله قط."]]}], "kwAr": "ليس من الله", "noteAr": ""}, {"kw": "neither", "raw": "1Jo_3:14, 1Jo_3:15, 1Jo_2:9, 1Jo_2:10, 1Jo_4:8, 1Jo_4:21", "note": "", "refs": [{"l": "1Jo 3:14", "n": "", "vs": [[14, "إن محبتنا لإخوتنا تبين لنا أننا انتقلنا من الموت إلى الحياة. فالذي لا يحب إخوته، فهو باق في الموت."]]}, {"l": "1Jo 3:15", "n": "", "vs": [[15, "وكل من يبغض أخا له، فهو قاتل. وأنتم تعرفون أن القاتل لا تكون له حياة أبدية ثابتة فيه."]]}, {"l": "1Jo 2:9", "n": "", "vs": [[9, "من ادعى أنه يحيا في النور، ولكنه يبغض أحد إخوته، فهو مازال حتى الآن في الظلام."]]}, {"l": "1Jo 2:10", "n": "", "vs": [[10, "فالذي يحب إخوته، هو الذي يحيا في النور فعلا ولا شيء يسقطه."]]}, {"l": "1Jo 4:8", "n": "", "vs": [[8, "أما من لا يحب، فهو لم يتعرف بالله قط لأن الله محبة!"]]}, {"l": "1Jo 4:21", "n": "", "vs": [[21, "فهذه الوصية جاءتنا من المسيح نفسه: من يحب الله ، يحب أخاه!"]]}], "kwAr": "من لا يحب أخاه", "noteAr": ""}], "arS": [["إذن، هذا هو المقياس الذي ", []], ["نميز", ["G5318"]], [" به بين ", []], ["أولاد", ["G5043"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["وأولاد", ["G5043"]], [" ", []], ["إبليس", ["G1228"]], [". من لا ", []], ["يمارس", ["G4160"]], [" ", []], ["الصلاح", ["G1343"]], ["، فهو ليس من ", []], ["الله", ["G2316"]], [". وكذلك من لا ", []], ["يحب", ["G25"]], [" ", []], ["أخاه", ["G80"]], ["!", []]]}, {"c": 3, "v": 11, "text": "فالوصية التي سمعتموها منذ البداية، هي أن يحب بعضنا بعضا،", "groups": [{"kw": "this", "raw": "1Jo_1:5, 1Jo_2:7, 1Jo_2:8", "note": "", "refs": [{"l": "1Jo 1:5", "n": "", "vs": [[5, "وهذا هو الخبر الذي سمعناه من المسيح ونعلنه لكم: إن الله نور، وليس فيه ظلام البتة."]]}, {"l": "1Jo 2:7", "n": "", "vs": [[7, "أيها الأحباء، أنا لا أكتب إليكم هنا وصية جديدة، بل وصية قديمة كانت عندكم منذ البداية، وهي الكلمة التي سمعتموها قبلا."]]}, {"l": "1Jo 2:8", "n": "", "vs": [[8, "ومع ذلك فالوصية التي أكتبها إليكم، هي جديدة دائما، وتتضح حقيقتها في المسيح كما تتضح فيكم أنتم. ذلك لأن الظلام قد بدأ يزول منذ أن أشرق النور الحقيقي الذي مازال الآن مشرقا."]]}], "kwAr": "الوصية التي سمعتموها", "noteAr": ""}, {"kw": "message", "raw": "or, commandment, 1Ti_1:5 *Gr.", "note": "or, commandment, 1Ti_1:5 *Gr.", "refs": [{"l": "1Ti 1:5", "n": "*Gr.", "vs": [[5, "أما الغاية مما أوصيتك به، فهي المحبة النابعة من قلب طاهر وضمير صالح وإيمان خال من الرياء."]]}], "kwAr": "الوصية", "noteAr": "أو: وصية."}, {"kw": "that we", "raw": "1Jo_4:7, 1Jo_4:21; Joh_13:34, Joh_13:35, Joh_15:12; Gal_6:2; Eph_5:2; 1Th_4:9; 1Pe_1:22, 1Pe_3:8; 1Pe_4:8; 2Jo_1:5", "note": "", "refs": [{"l": "1Jo 4:7", "n": "", "vs": [[7, "أيها الأحباء، لنحب بعضنا بعضا: لأن المحبة تصدر من الله. إذن، كل من يحب، يكون مولودا من الله ويعرف الله ."]]}, {"l": "1Jo 4:21", "n": "", "vs": [[21, "فهذه الوصية جاءتنا من المسيح نفسه: من يحب الله ، يحب أخاه!"]]}, {"l": "Joh 13:34", "n": "", "vs": [[34, "وصية جديدة أنا أعطيكم: أحبوا بعضكم بعضا، كما أحببتكم أنا، تحبون بعضكم."]]}, {"l": "Joh 13:35", "n": "", "vs": [[35, "بهذا يعرف الجميع أنكم تلاميذي: إن كنتم تحبون بعضكم بعضا»."]]}, {"l": "Joh 15:12", "n": "", "vs": [[12, "وصيتي لكم هي هذه: أن يحب بعضكم بعضا كما أنا أحببتكم."]]}, {"l": "Gal 6:2", "n": "", "vs": [[2, "ليحمل الواحد منكم أثقال الآخر، وهكذا تتممون شريعة المسيح."]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "1Th 4:9", "n": "", "vs": [[9, "أما المحبة الأخوية، فلستم في حاجة لأن أكتب إليكم عنها، لأنكم بأنفسكم قد تعلمتم من الله أن تحبوا بعضكم بعضا،"]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}, {"l": "1Pe 3:8", "n": "", "vs": [[8, "والخلاصة، كونوا جميعا متحدين في الرأي، متعاطفين بعضكم مع بعض، مبادلين أحدكم الآخر المحبة الأخوية، شفوقين، متواضعين."]]}, {"l": "1Pe 4:8", "n": "", "vs": [[8, "لكن أهم شيء هو أن تبادلوا بعضكم بعضا المحبة الشديدة. لأن المحبة تستر إساءات كثيرة."]]}, {"l": "2Jo 1:5", "n": "", "vs": [[5, "وا لآن، أيتها السيدة، لي رجاء أطلبه منك، ولا تعتبريه وصية جديدة. وإنما هو تلك الوصية الموجودة عندنا منذ البداية،: أن يحب بعضنا بعضا."]]}], "kwAr": "أن يحب بعضنا بعضا", "noteAr": ""}], "arS": [["فالوصية", ["G31"]], [" التي ", []], ["سمعتموها", ["G191"]], [" منذ ", []], ["البداية", ["G746"]], ["، هي أن ", []], ["يحب", ["G25"]], [" ", []], ["بعضنا بعضا", ["G240"]], ["،", []]]}, {"c": 3, "v": 12, "text": "لا أن نكون مثل قايين الذي قتل أخاه. فقايين كان من أولاد إبليس الشرير. ولماذا قتل أخاه؟ قتله لأن أعماله هو كانت شريرة، أما أعمال أخيه فكانت صالحة.", "groups": [{"kw": "as", "raw": "Gen_4:4-15, Gen_4:25; Heb_11:4; Jud_1:11", "note": "", "refs": [{"l": "Gen 4:4-15", "n": "", "vs": [[4, "وقدم هابيل أيضا من خيرة أبكار غنمه وأسمنها. فتقبل الرب قربان هابيل ورضي عنه."], [5, "لكنه لم يتقبل قربان قايين ولم يرض عنه. فاغتاظ قايين جدا وتجهم وجهه كمدا."], [6, "فسأل الرب قايين: «لماذا اغتظت؟ لماذا تجهم وجهك؟"], [7, "لو أحسنت في تصرفك ألا يشرق وجهك فرحا؟ وإن لم تحسن التصرف، فعند الباب خطيئة تنتظرك، تتشوق أن تتسلط عليك، لكن يجب أن تتحكم فيها»"], [8, "وعاد قايين يتظاهر بالود لأخيه هابيل. وحدث إذ كانا معا في الحقل أن قايين هجم على أخيه هابيل وقتله."], [9, "وسأل الرب قايين: «أين أخوك هابيل؟» فأجاب: «لا أعرف. هل أنا حارس لأخي؟»"], [10, "فقال الرب له: «ماذا فعلت؟ إن صوت دم أخيك يصرخ إلي من الأرض."], [11, "فمنذ الآن، تحل عليك لعنة الأرض التي فتحت فاها وابتلعت دم أخيك الذي سفكته يدك."], [12, "عندما تفلحها لن تعطيك خيرها، وتكون شريدا وطريدا في الأرض»."], [13, "فقال قايين للرب: «عقوبتي أعظم من أن تحتمل."], [14, "ها أنت اليوم قد طردتني عن وجه الأرض، ومن أمام حضرتك أختفي، وأكون شريدا طريدا في الأرض، ويقتلني كل من يجدني»."], [15, "فقال الرب له: «سأعاقب كل من يقتلك بسبعة أضعاف العقوبة التي عاقبتك بها». ووسم الرب قايين بعلامة تحظر على من يلقاه اغتياله."]]}, {"l": "Gen 4:25", "n": "", "vs": [[25, "وعاشر آدم زوجته حواء مرة أخرى فأنجبت له ابنا أسمته «شيثا» إذ قالت: «قد عوضني الله نسلا آخر عوضا عن هابيل الذي قتله قايين»."]]}, {"l": "Heb 11:4", "n": "", "vs": [[4, "بالإيمان، قدم هابيل لله ذبيحة أفضل من تلك التي قدمها قايين. وعلى ذلك الأساس، شهد الله بأن هابيل بار، إذ قبل التقدمة التي قربها له. ومع أن هابيل مات قتلا، فإنه مازال الآن يلقننا العبر بإيمانه."]]}, {"l": "Jud 1:11", "n": "", "vs": [[11, "الويل لهم! لأنهم سلكوا طريق قايين، واندفعوا إلى ارتكاب خطيئة بلعام طلبا للمال، وتمردوا كما تمرد قورح، فدمروا أنفسهم."]]}], "kwAr": "مثل قايين", "noteAr": ""}, {"kw": "of", "raw": "1Jo_3:8, 1Jo_2:13, 1Jo_2:14; Mat_13:19, Mat_13:38", "note": "", "refs": [{"l": "1Jo 3:8", "n": "", "vs": [[8, "ولكن من يمارس الخطيئة، يظهر أنه من أولاد إبليس، لأن إبليس يمارس الخطيئة منذ البداية. وقد جاء ابن الله إلى الأرض لكي يبطل أعمال إبليس."]]}, {"l": "1Jo 2:13", "n": "", "vs": [[13, "أكتب إليكم أيها الآباء، لأنكم قد عرفتم المسيح الكائن منذ البداية. أكتب إليكم أيها الشباب، لأنكم قد غلبتم إبليس الشرير. كتبت إليكم أيها الأولاد الصغار، لأنكم قد عرفتم الآب."]]}, {"l": "1Jo 2:14", "n": "", "vs": [[14, "كتبت إليكم، أيها الآباء، لأنكم قد عرفتم المسيح الكائن منذ البداية. كتبت إليكم، أيها الشباب، لأنكم أقوياء، وقد ترسخت كلمة الله في قلوبكم، وغلبتم إبليس الشرير."]]}, {"l": "Mat 13:19", "n": "", "vs": [[19, "كل من يسمع كلمة الملكوت ولا يفهمها، يأتي الشرير ويخطف ما قد زرع في قلبه: هذا هو المزروع على الممرات."]]}, {"l": "Mat 13:38", "n": "", "vs": [[38, "والحقل هو العالم. والزرع الجيد هو بنو الملكوت. والزوان هو بنو الشرير."]]}], "kwAr": "من أولاد إبليس الشرير", "noteAr": ""}, {"kw": "And", "raw": "1Sa_18:14, 1Sa_18:15, 1Sa_19:4, 1Sa_19:5, 1Sa_22:14-16; Psa_37:12; Pro_29:27; Mat_27:23; Joh_10:32, Joh_15:19-25, Joh_18:38-40; Act_7:52; 1Th_2:14; 1Pe_4:4; Rev_17:6", "note": "", "refs": [{"l": "1Sa 18:14", "n": "", "vs": [[14, "وحالفه الفلاح في كل أعماله لأن الرب كان معه."]]}, {"l": "1Sa 18:15", "n": "", "vs": [[15, "وعندما رأى شاول ما يتمتع به داود من فطنة تفاقم فزعه منه."]]}, {"l": "1Sa 19:4", "n": "", "vs": [[4, "وراح يوناثان يثني على داود أمام أبيه وتساءل: «لماذا يسيء الملك إلى عبده داود، فإنه لم يخطيء إليك، ومآثره عظيمة جدا؟"]]}, {"l": "1Sa 19:5", "n": "", "vs": [[5, "لقد عرض حياته للخطر عندما قتل الفلسطيني، فأجرى الرب خلاصا عظيما لجميع إسرائيل. وقد شهدت ذلك وابتهجت به. فلماذا تقتل داود من غير داع وتسيء إلى دم بريء؟»"]]}, {"l": "1Sa 22:14-16", "n": "", "vs": [[14, "فأجاب أخيمالك: «أي واحد من بين جميع رجالك مثل داود أمين وصهر الملك وقائد حرسه وذو مكانة رفيعة في بيتك؟"], [15, "فهل هذه هي أول مرة أستشير له فيها الله ؟ معاذ الله أن يتهمني الملك أو يتهم جميع بيت أبي بارتكاب شيء»."], [16, "فقال الملك: «إنك لا محالة مائت يا أخيمالك، أنت وجميع بيت أبيك»."]]}, {"l": "Psa 37:12", "n": "", "vs": [[12, "يكيد الشرير كثيرا للصديق ويصر عليه بأسنانه."]]}, {"l": "Pro 29:27", "n": "", "vs": [[27, "الرجل الظالم مكرهة للصديق، وذو السبيل المستقيم رجس عند الشرير."]]}, {"l": "Mat 27:23", "n": "", "vs": [[23, "فسأل الحاكم: «وأي شر فعل؟» فازدادوا صراخا: «ليصلب!»"]]}, {"l": "Joh 10:32", "n": "", "vs": [[32, "فقال لهم يسوع: «أريتكم أعمالا صالحة كثيرة من عند أبي، فبسبب أي عمل منها ترجمونني؟»"]]}, {"l": "Joh 15:19-25", "n": "", "vs": [[19, "لو كنتم من أهل العالم، لكان العالم يحب أهله، ولكن لأنكم لستم من أهل العالم، بل إني اخترتكم من وسط العالم، لذلك يبغضكم العالم."], [20, "اذكروا الكلمة التي قلتها لكم: ليس عبد أعظم من سيده. فإن كان أهل العالم قد اضطهدوني، فسوف يضطهدونكم؛ وإن كانوا قد عملوا بكلمتي، فسوف يعملون بكلمتكم."], [21, "ولكنهم سيفعلون هذا كله بكم من أجل اسمي، لأنهم لا يعرفون الذي أرسلني."], [22, "لو لم آت وأكلمهم، لما كانت لهم خطيئة؛ ولكن لا عذر لهم الآن في خطيئتهم."], [23, "الذي يبغضني، يبغض أبي أيضا."], [24, "ولو لم أعمل بينهم أعمالا لم يعملها أحد غيري، لما كانت لهم خطيئة. ولكنهم أبغضوني وأبغضوا أبي، مع أنهم رأوا تلك الأعمال."], [25, "وقد صار ذلك لتتم الكلمة المكتوبة في شريعتهم: أبغضوني بلا سبب!"]]}, {"l": "Joh 18:38-40", "n": "", "vs": [[38, "فقال له بيلاطس: «ما هو الحق!» ثم خرج إلى اليهود وقال: «إني لا أجد فيه ذنبا!"], [39, "وقد جرت العادة عندكم أن أطلق لكم أحد السجناء في عيد الفصح. فهل تريدون أن أطلق لكم ملك اليهود؟»"], [40, "فصرخوا جميعا قائلين: «لا تطلق هذا، بل باراباس». وكان باراباس لصا!"]]}, {"l": "Act 7:52", "n": "", "vs": [[52, "فأي نبي نجا من اضطهادهم وقد قتلوا الذين أنبأوا بمجيء البار الذي سلمتموه أنتم وقتلتموه!"]]}, {"l": "1Th 2:14", "n": "", "vs": [[14, "فإنكم، أيها الإخوة، قد صرتم على مثال كنائس الله التي في منطقة اليهودية والتي هي في المسيح يسوع. فأنتم أيضا قاسيتم على أيدي بني جنسكم ما قاسوه هم على أيدي اليهود"]]}, {"l": "1Pe 4:4", "n": "", "vs": [[4, "ورفاقكم في تلك العيشة سابقا يستغربون أنكم لا تركضون معهم إلى فيض هذه الخلاعة، ويجرحون سمعتكم."]]}, {"l": "Rev 17:6", "n": "", "vs": [[6, "ورأيت المرأة سكرى لكثرة ما شربت من د  أو بتقوانا جعلنا هذا الرجل يمشي؟"]]}, {"l": "Rev 17:7", "n": "", "vs": [[7, "فسألني الملاك: «لماذا دهشت؟ سأطلعك على ما ترمز إليه المرأة والوحش الذي يحملها، صاحب الرؤوس السبعة والقرون العشرة:"]]}], "kwAr": "لا تتعجبوا", "noteAr": ""}, {"kw": "if", "raw": "Mat_10:22, Mat_24:9; Mar_13:13; Luk_6:22, Luk_21:17; Joh_7:7, Joh_15:18, Joh_15:19, Joh_16:2, Joh_16:33; Joh_17:14; Rom_8:7; 2Ti_3:12; Jam_4:4", "note": "", "refs": [{"l": "Mat 10:22", "n": "", "vs": [[22, "وتكونون مكروهين لدى الجميع من أجل اسمي. ولكن من يثبت إلى النهاية، هو الذي يخلص."]]}, {"l": "Mat 24:9", "n": "", "vs": [[9, "عندئذ يسلمكم الناس إلى العذاب، ويقتلونكم، وتكونون مكروهين لدى جميع الأمم من أجل اسمي؛"]]}, {"l": "Mar 13:13", "n": "", "vs": [[13, "وتكونون مكروهين لدى الجميع من أجل اسمي. ولكن الذي يثبت حتى النهاية، فهو يخلص."]]}, {"l": "Luk 6:22", "n": "", "vs": [[22, "طوبى لكم متى أبغضكم الناس، وعزلوكم، وأهانوا اسمكم ونبذوه كأنه شرير، من أجل ابن الإنسان."]]}, {"l": "Luk 21:17", "n": "", "vs": [[17, "وتكونون مكروهين لدى الجميع من أجل اسمي."]]}, {"l": "Joh 7:7", "n": "", "vs": [[7, "لا يقدر العالم أن يبغضكم، ولكنه يبغضني أنا، لأني أشهد عليه أن أعماله شريرة."]]}, {"l": "Joh 15:18", "n": "", "vs": [[18, "إن أبغضكم العالم، فاعلموا أنه قد أبغضني من قبلكم."]]}, {"l": "Joh 15:19", "n": "", "vs": [[19, "لو كنتم من أهل العالم، لكان العالم يحب أهله، ولكن لأنكم لستم من أهل العالم، بل إني اخترتكم من وسط العالم، لذلك يبغضكم العالم."]]}, {"l": "Joh 16:2", "n": "", "vs": [[2, "ستطردون خارج المجامع، بل سيأتي وقت يظن فيه من يقتلكم أنه يؤدي خدمة لله."]]}, {"l": "Joh 16:33", "n": "", "vs": [[33, "أخبرتكم بهذا كله ليكون لكم في سلام. فإنكم في العالم ستقاسون الضيق. ولكن تشجعوا، فأنا قد انتصرت على العالم!»"]]}, {"l": "Joh 17:14", "n": "", "vs": [[14, "أبلغتهم كلمتك، فأبغضهم العالم لأنهم ليسوا من العالم."]]}, {"l": "Rom 8:7", "n": "", "vs": [[7, "لأن اهتمام الجسد هو عداوة لله، إذ إنه لا يخضع لناموس الله، بل لا يستطيع ذلك."]]}, {"l": "2Ti 3:12", "n": "", "vs": [[12, "وحقا، إن جميع الذين يعزمون أن يعيشوا عيشة التقوى في المسيح يسوع يضطهدون."]]}, {"l": "Jam 4:4", "n": "", "vs": [[4, "أيها الخونة! ألستم تعلمون أن مصادقة العالم هي معاداة لله؟ فالذي يريد أن يصادق العالم، يجعل نفسه عدوا لله."]]}], "kwAr": "إن كان أهل العالم يبغضونكم", "noteAr": ""}], "arS": [["إذن، ", []], ["ياإخوتي", ["G3450", "G80"]], ["، لا ", []], ["تتعجبوا", ["G2296"]], [" إن كان أهل ", []], ["العالم", ["G2889"]], [" ", []], ["يبغضونكم", ["G3404"]], ["!", []]]}, {"c": 3, "v": 14, "text": "إن محبتنا لإخوتنا تبين لنا أننا انتقلنا من الموت إلى الحياة. فالذي لا يحب إخوته، فهو باق في الموت.", "groups": [{"kw": "We know", "raw": "1Jo_2:3, 1Jo_5:2, 1Jo_5:13, 1Jo_5:19, 1Jo_5:20; 2Co_5:1", "note": "", "refs": [{"l": "1Jo 2:3", "n": "", "vs": [[3, "وما يؤكد لنا أننا قد عرفنا المسيح حقا هو أن نعمل بوصاياه."]]}, {"l": "1Jo 5:2", "n": "", "vs": [[2, "وما يثبت لنا محبتنا لأولاد الله هو أن نحب الله ونعمل بوصاياه."]]}, {"l": "1Jo 5:13", "n": "", "vs": [[13, "يامن آمنتم باسم ابن الله، إني كتبت هذا إليكم لكي تعرفوا أن الحياة الأبدية ملك لكم منذ الآن."]]}, {"l": "1Jo 5:19", "n": "", "vs": [[19, "ونحن واثقون أيضا بأننا من الله، وأن العالم كله خاضع لسيطرة إبليس الشرير."]]}, {"l": "1Jo 5:20", "n": "", "vs": [[20, "وإننا نعلم أن ابن الله قد جاء إلى الأرض وأنار أذهاننا لنعرف الإله الحق. ونحن الآن نحيا فيه، لأننا في ابنه يسوع المسيح. هذا هو الإله الحق، والحياة الأبدية."]]}, {"l": "2Co 5:1", "n": "", "vs": [[1, "فإننا نعلم أنه متى تهدمت خيمتنا الأرضية التي نسكنها الآن، يكون لنا بناء من الله: بيت لم تصنعه أيدي البشر، أبدي في السماوات."]]}], "kwAr": "تبين لنا", "noteAr": ""}, {"kw": "we have", "raw": "Luk_15:24, Luk_15:32; Joh_5:24; Eph_2:1, Eph_2:5", "note": "", "refs": [{"l": "Luk 15:24", "n": "", "vs": [[24, "فإن ابني هذا كان ميتا فعاش، وكان ضائعا فوجد. فأخذوا يفرحون!"]]}, {"l": "Luk 15:32", "n": "", "vs": [[32, "ولكن كان من الصواب أن نفرح ونبتهج، لأن أخاك هذا كان ميتا فعاش، وكان ضالا فوجد!»"]]}, {"l": "Joh 5:24", "n": "", "vs": [[24, "الحق الحق أقول لكم إن من يسمع كلامي ويؤمن بالذي أرسلني تكون له الحياة الأبدية، ولا يحاكم في اليوم الأخير، لأنه قد انتقل من الموت إلى الحياة."]]}, {"l": "Eph 2:1", "n": "", "vs": [[1, "وأنتم كنتم في السابق أمواتا بذنوبكم وخطاياكم،"]]}, {"l": "Eph 2:5", "n": "", "vs": [[5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"]]}], "kwAr": "انتقلنا من الموت إلى الحياة", "noteAr": ""}, {"kw": "because", "raw": "1Jo_2:10, 1Jo_3:23, 1Jo_4:7, 1Jo_4:8, 1Jo_4:12, 1Jo_4:21, 1Jo_5:2; Psa_16:3; Mat_25:40; Joh_13:35, Joh_15:12, Joh_15:17; Gal_5:22; Eph_1:15; Col_1:4; 1Th_4:9; Heb_6:10,Heb_6:11, Heb_13:1; 1Pe_1:22; 1Pe_3:8; 2Pe_1:7", "note": "", "refs": [{"l": "1Jo 2:10", "n": "", "vs": [[10, "فالذي يحب إخوته، هو الذي يحيا في النور فعلا ولا شيء يسقطه."]]}, {"l": "1Jo 3:23", "n": "", "vs": [[23, "وأما وصيته فهي أن نؤمن باسم ابنه يسوع المسيح، وأن يحب بعضنا بعضا كما أوصانا."]]}, {"l": "1Jo 4:7", "n": "", "vs": [[7, "أيها الأحباء، لنحب بعضنا بعضا: لأن المحبة تصدر من الله. إذن، كل من يحب، يكون مولودا من الله ويعرف الله ."]]}, {"l": "1Jo 4:8", "n": "", "vs": [[8, "أما من لا يحب، فهو لم يتعرف بالله قط لأن الله محبة!"]]}, {"l": "1Jo 4:12", "n": "", "vs": [[12, "إن الله لم يره أحد من الناس قط. ولكن، حين نحب بعضنا بعضا، نبين أن الله يحيا في داخلنا، وأن محبته قد اكتملت في داخلنا."]]}, {"l": "1Jo 4:21", "n": "", "vs": [[21, "فهذه الوصية جاءتنا من المسيح نفسه: من يحب الله ، يحب أخاه!"]]}, {"l": "1Jo 5:2", "n": "", "vs": [[2, "وما يثبت لنا محبتنا لأولاد الله هو أن نحب الله ونعمل بوصاياه."]]}, {"l": "Psa 16:3", "n": "", "vs": [[3, "كل بهجتي في قديسي الأرض وأفاضلها."]]}, {"l": "Mat 25:40", "n": "", "vs": [[40, "فيجيبهم الملك: الحق أقول لكم: بما أنكم فعلتم ذلك بأحد إخوتي هؤلاء الصغار، فبي فعلتم!"]]}, {"l": "Joh 13:35", "n": "", "vs": [[35, "بهذا يعرف الجميع أنكم تلاميذي: إن كنتم تحبون بعضكم بعضا»."]]}, {"l": "Joh 15:12", "n": "", "vs": [[12, "وصيتي لكم هي هذه: أن يحب بعضكم بعضا كما أنا أحببتكم."]]}, {"l": "Joh 15:17", "n": "", "vs": [[17, "فبهذا أوصيكم إذن: أن تحبوا بعضكم بعضا."]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Eph 1:15", "n": "", "vs": [[15, "لذلك أنا أيضا، وقد سمعت بما فيكم من الإيمان بالرب يسوع والمحبة لجميع القديسين،"]]}, {"l": "Col 1:4", "n": "", "vs": [[4, "إذ بلغنا خبر إيمانكم بالمسيح يسوع والمحبة التي لكم نحو جميع القديسين،"]]}, {"l": "1Th 4:9", "n": "", "vs": [[9, "أما المحبة الأخوية، فلستم في حاجة لأن أكتب إليكم عنها، لأنكم بأنفسكم قد تعلمتم من الله أن تحبوا بعضكم بعضا،"]]}, {"l": "Heb 6:10", "n": "", "vs": [[10, "وليس الله بظالم حتى ينسى عملكم الجاد في إظهار محبتكم له عن طريق خدمتكم للقديسين إكراما لاسمه، الأمر الذي قمتم به قبلا، وتقومون به الآن!"]]}, {"l": "Heb 6:11", "n": "", "vs": [[11, "وإنما نتمنى أن يظهر كل واحد منكم اجتهادا مماثلا في المحافظة حتى النهاية على الثقة الكاملة بالرجاء."]]}, {"l": "Heb 13:1", "n": "", "vs": [[1, "اثبتوا على المحبة الأخوية."]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}, {"l": "1Pe 3:8", "n": "", "vs": [[8, "والخلاصة، كونوا جميعا متحدين في الرأي، متعاطفين بعضكم مع بعض، مبادلين أحدكم الآخر المحبة الأخوية، شفوقين، متواضعين."]]}, {"l": "2Pe 1:7", "n": "", "vs": [[7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."]]}], "kwAr": "محبتنا لإخوتنا", "noteAr": ""}, {"kw": "that loveth", "raw": "1Jo_2:9, 1Jo_2:11, 1Jo_4:20; Pro_21:16", "note": "", "refs": [{"l": "1Jo 2:9", "n": "", "vs": [[9, "من ادعى أنه يحيا في النور، ولكنه يبغض أحد إخوته، فهو مازال حتى الآن في الظلام."]]}, {"l": "1Jo 2:11", "n": "", "vs": [[11, "أما الذي يبغض أحد إخوته، فهو تائه في الظلام، يتلمس طريقه ولا يعرف أين يتجه، لأن الظلام قد أعمى عينيه!"]]}, {"l": "1Jo 4:20", "n": "", "vs": [[20, "فإن قال أحد: «أنا أحب الله !» ولكنه يبغض أخا له، فهو كاذب، لأنه إن كان لا يحب أخاه الذي يراه، فكيف يقدر أن يحب الله الذي لم يره قط؟"]]}, {"l": "Pro 21:16", "n": "", "vs": [[16, "الرجل الشارد عن طريق المعرفة يسكن بين جماعة الموتى."]]}], "kwAr": "الذي لا يحب إخوته", "noteAr": ""}], "arS": [["إن ", []], ["محبتنا", ["G25"]], [" ", []], ["لإخوتنا", ["G80"]], [" ", []], ["تبين", ["G1492"]], [" لنا أننا ", []], ["انتقلنا", ["G3327"]], [" من ", []], ["الموت", ["G2288"]], [" إلى ", []], ["الحياة", ["G2222"]], [". فالذي لا ", []], ["يحب", ["G25"]], [" ", []], ["إخوته", ["G80"]], ["، فهو ", []], ["باق", ["G3306"]], [" في ", []], ["الموت", ["G2288"]], [".", []]]}, {"c": 3, "v": 15, "text": "وكل من يبغض أخا له، فهو قاتل. وأنتم تعرفون أن القاتل لا تكون له حياة أبدية ثابتة فيه.", "groups": [{"kw": "hateth", "raw": "Gen_27:41; Lev_19:16-18; 2Sa_13:22-28; Pro_26:24-26; Mat_5:21, Mat_5:22, Mat_5:28; Mar_6:19; Act_23:12, Act_23:14; Jam_1:15, Jam_4:1, Jam_4:2", "note": "", "refs": [{"l": "Gen 27:41", "n": "", "vs": [[41, "وحقد عيسو على يعقوب من أجل ما ناله من بركة أبيه. فناجى نفسه: «قريبا يموت أبي، وبعدئذ أقتل أخي يعقوب»."]]}, {"l": "Lev 19:16-18", "n": "", "vs": [[16, "لا تسع في الوشاية بين شعبك، ولا ترتكب ما يعرض حياة جارك للخطر، فأنا الرب."], [17, "لا تبغض أخاك في قلبك، بل إنذارا تنذره لئلا تكون شريكا في ذنبه."], [18, "لا تنتقم ولا تحقد على أحد أبناء شعبك، ولكن تحب قريبك كما تحب نفسك، فأنا الرب."]]}, {"l": "2Sa 13:22-28", "n": "", "vs": [[22, "أما أبشالوم فلم يخاطب أمنون بخير أو شر، لكنه أضمر له بغضا شديدا لأنه انتهك حرمة أخته ثامار."], [23, "وبعد ذلك بعامين، وجه أبشالوم دعوة لجميع أبناء الملك لحضور جز غنمه في بعل حاصور عند أفرايم."], [24, "وعندما مثل أبشالوم في حضرة أبيه قال له: «هذا موسم جز غنم عبدك، فليذهب الملك مع رجال حاشيته برفقة عبده»."], [25, "فأجاب الملك أبشالوم: «لا ياابني. لا نذهب كلنا لئلا نكون عبئا عليك». ورغم إلحاح أبشالوم، اعتذر أبوه وباركه."], [26, "فقال أبشالوم: «إذا دع أخي أمنون يذهب معنا» فقال الملك: «ولماذا يذهب أمنون معك؟»"], [27, "فألح عليه أبشالوم حتى رضي أن يذهب أمنون وأبناء الملك مع أبشالوم."], [28, "وأوصى أبشالوم رجاله: «متى ذهبت الخمر بعقل أمنون وقلت لكم اضربوا أمنون واقتلوه، فلا تخافوا. ألست أنا الذي أمرتكم بذلك؟ تشجعوا وتصرفوا كأبطال»."]]}, {"l": "Pro 26:24-26", "n": "", "vs": [[24, "الرجل الماكر يطلي نواياه بمعسول الشفاه، ولكنه يراعي الحقد في قلبه،"], [25, "إن تملقك بعذوبة حديثه، فلا تأتمنه، لأن قلبه مفعم بسبعة صنوف من الرجاسات."], [26, "إن وارى حقده بمكر، فإن نفاقه يفتضح بين الجماعة."]]}, {"l": "Mat 5:21", "n": "", "vs": [[21, "سمعتم أنه قيل للأقدمين: لا تقتل! ومن قتل يستحق المحاكمة."]]}, {"l": "Mat 5:22", "n": "", "vs": [[22, "أما أنا فأقول لكم: كل من هو غاضب على أخيه، يستحق المحاكمة؛ ومن يقول لأخيه: ياتافه! يستحق المثول أمام المجلس الأعلى؛ ومن يقول: ياأحمق! يستحق نار جهنم!"]]}, {"l": "Mat 5:28", "n": "", "vs": [[28, "أما أنا فأقول لكم: كل من ينظر إلى امرأة بقصد أن يشتهيها، فقد زنى بها في قلبه!"]]}, {"l": "Mar 6:19", "n": "", "vs": [[19, "فكانت هيروديا ناقمة على يوحنا، وتتمنى أن تقتله، ولكنها لم تستطع."]]}, {"l": "Act 23:12", "n": "", "vs": [[12, "ولما طلع الصباح حاك بعض اليهود مؤامرة لقتل بولس، وحرموا على أنفسهم الطعام والشراب إلى أن يقتلوه."]]}, {"l": "Act 23:14", "n": "", "vs": [[14, "وذهبوا إلى رؤساء الكهنة والشيوخ وقالوا: «حرام علينا الطعام والشراب حتى نقتل بولس."]]}, {"l": "Jam 1:15", "n": "", "vs": [[15, "فإذا ما حبلت الشهوة ولدت الخطيئة. ومتى نضجت الخطيئة، أنتجت الموت."]]}, {"l": "Jam 4:1", "n": "", "vs": [[1, "من أين النزاع والخصام بينكم؟ أليس من لذاتكم تلك المتصارعة في أعضائكم؟"]]}, {"l": "Jam 4:2", "n": "", "vs": [[2, "فأنتم ترغبون في امتلاك ما لا يخصكم، لكن ذلك لا يتحقق لكم، فتقتلون، وتحسدون، ولا تتمكنون من بلوغ غايتكم. وهكذا تتخاصمون وتتصارعون! إنكم لا تمتلكون ما تريدونه، لأنكم لا تطلبونه من الله."]]}], "kwAr": "من يبغض أخا له", "noteAr": ""}, {"kw": "hath", "raw": "Joh_4:14; Gal_5:21; 1Pe_1:23; Rev_21:8", "note": "", "refs": [{"l": "Joh 4:14", "n": "", "vs": [[14, "ولكن الذي يشرب من الماء الذي أعطيه أنا، لن يعطش بعد ذلك أبدا، بل إن ما أعطيه من ماء يصبح في داخله نبعا يفيض فيعطي حياة أبدية»."]]}, {"l": "Gal 5:21", "n": "", "vs": [[21, "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!"]]}, {"l": "1Pe 1:23", "n": "", "vs": [[23, "فأنتم قد ولدتم ولادة ثانية لا من زرع بشري يفنى، بل مما لا يفنى: بكلمة الله الحية الباقية إلى الأبد."]]}, {"l": "Rev 21:8", "n": "", "vs": [[8, "أما الجبناء وغير المؤمنين، والفاسدون والقاتلون والزناة، والمتصلون بالشياطين وعبدة الأصنام وجميع الدجالين، فمصيرهم إلى البحيرة المتقدة بالنار والكبريت، الذي هو الموت الثاني»."]]}], "kwAr": "حياة أبدية ثابتة فيه", "noteAr": ""}], "arS": [["وكل", ["G3956"]], [" من ", []], ["يبغض", ["G3404"]], [" ", []], ["أخا", ["G80"]], [" له، فهو ", []], ["قاتل", ["G443"]], [". وأنتم ", []], ["تعرفون", ["G1492"]], [" أن ", []], ["القاتل", ["G443"]], [" لا تكون له ", []], ["حياة", ["G2222"]], [" ", []], ["أبدية", ["G166"]], [" ", []], ["ثابتة", ["G3306"]], [" فيه.", []]]}, {"c": 3, "v": 16, "text": "ومقياس المحبة هو العمل الذي قام به المسيح إذ بذل حياته لأجلنا. فعلينا نحن أيضا أن نبذل حياتنا لأجل إخوتنا.", "groups": [{"kw": "perceive", "raw": "1Jo_4:9, 1Jo_4:10; Mat_20:28; Joh_3:16, Joh_10:15, Joh_15:13; Act_20:28; Rom_5:8; Eph_5:2, Eph_5:25; Tit_2:13; 1Pe_1:18, 1Pe_2:24, 1Pe_3:18; Rev_1:5, Rev_5:9", "note": "", "refs": [{"l": "1Jo 4:9", "n": "", "vs": [[9, "وقد أظهر الله محبته لنا إذ أرسل ابنه الأوحد إلى العالم لكي نحيا به."]]}, {"l": "1Jo 4:10", "n": "", "vs": [[10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."]]}, {"l": "Mat 20:28", "n": "", "vs": [[28, "فهكذا ابن الإنسان: قد جاء لا ليخدم، بل ليخدم ويبذل نفسه فدية عن كثيرين. »"]]}, {"l": "Joh 3:16", "n": "", "vs": [[16, "لأنه هكذا أحب الله العالم حتى بذل ابنه الوحيد، لكي لا يهلك كل من يؤمن به، بل تكون له الحياة الأبدية."]]}, {"l": "Joh 10:15", "n": "", "vs": [[15, "مثلما يعرفني الآب وأنا أعرفه. وأنا أبذل حياتي فدى خرافي."]]}, {"l": "Joh 15:13", "n": "", "vs": [[13, "ليس لأحد محبة أعظم من هذه: أن يبذل أحد حياته فدى أحبائه."]]}, {"l": "Act 20:28", "n": "", "vs": [[28, "فاسهروا إذن على أنفسكم وعلى جميع القطيع الذي عينكم بينه الروح القدس نظارا، لترعوا كنيسة الله التي اشتراها بدمه."]]}, {"l": "Rom 5:8", "n": "", "vs": [[8, "ولكن الله أثبت لنا محبته، إذ ونحن مازلنا خاطئين مات المسيح عوضا عنا."]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "Eph 5:25", "n": "", "vs": [[25, "أيها الأزواج، أحبوا زوجاتكم مثلما أحب المسيح الكنيسة وبذل نفسه لأجلها،"]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "1Pe 1:18", "n": "", "vs": [[18, "واعلموا أنه قد دفع الفدية ليحرركم من سيرة حياتكم الباطلة التي أخذتموها بالتقليد عن آبائكم. وهذه الفدية لم تكن شيئا فانيا كالفضة أو الذهب،"]]}, {"l": "1Pe 2:24", "n": "", "vs": [[24, "وهو نفسه حمل خطايانا في جسده (عندما مات مصلوبا) على الخشبة، لكي نموت بالنسبة للخطايا فنحيا حياة البر. وبجراحه هو تم لكم الشفاء،"]]}, {"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}, {"l": "Rev 1:5", "n": "", "vs": [[5, "ومن يسوع المسيح الشاهد الأمين، بكر القائمين من بين الأموات، ملك ملوك الأرض، ذاك الذي بدافع محبته لنا مات لأجلنا فغسلنا بدمه من خطايانا،"]]}, {"l": "Rev 5:9", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"]]}], "kwAr": "مقياس المحبة", "noteAr": ""}, {"kw": "and we", "raw": "1Jo_2:6, 1Jo_4:11; Joh_13:34, Joh_15:12, Joh_15:13; Rom_16:4; Phi_2:17, Phi_2:30", "note": "", "refs": [{"l": "1Jo 2:6", "n": "", "vs": [[6, "كل من يعترف أنه ثابت في المسيح، يلتزم أن يسلك كما سلك المسيح!"]]}, {"l": "1Jo 4:11", "n": "", "vs": [[11, "ومادام الله قد أحبنا هذه المحبة العظيمة، أيها الأحباء، فعلينا نحن أيضا أن نحب بعضنا بعضا."]]}, {"l": "Joh 13:34", "n": "", "vs": [[34, "وصية جديدة أنا أعطيكم: أحبوا بعضكم بعضا، كما أحببتكم أنا، تحبون بعضكم."]]}, {"l": "Joh 15:12", "n": "", "vs": [[12, "وصيتي لكم هي هذه: أن يحب بعضكم بعضا كما أنا أحببتكم."]]}, {"l": "Joh 15:13", "n": "", "vs": [[13, "ليس لأحد محبة أعظم من هذه: أن يبذل أحد حياته فدى أحبائه."]]}, {"l": "Rom 16:4", "n": "", "vs": [[4, "اللذين عرضا عنقيهما للذبح إنقاذا لحياتي، ولست أنا وحدي شاكرا لهما بل جميع كنائس الأمم أيضا."]]}, {"l": "Phi 2:17", "n": "", "vs": [[17, "حتى لو سفك دمي سكيبا فوق ذبيحة إيمانكم وخدمته، فإني أفرح وأبتهج معكم جميعا."]]}, {"l": "Phi 2:30", "n": "", "vs": [[30, "فإنه من أجل عمل المسيح أشرف على الموت، مخاطرا بحياته ليسد ما نقص من خدمتكم لي."]]}], "kwAr": "علينا نحن أيضا أن نبذل حياتنا", "noteAr": ""}], "arS": [["ومقياس ", []], ["المحبة", ["G26"]], [" هو العمل الذي قام به المسيح إذ ", []], ["بذل", ["G5087"]], [" ", []], ["حياته", ["G5590"]], [" ", []], ["لأجلنا", ["G5228"]], [". ", []], ["فعلينا", ["G3784"]], [" نحن أيضا أن ", []], ["نبذل", ["G5087"]], [" ", []], ["حياتنا", ["G5590"]], [" لأجل ", []], ["إخوتنا", ["G80"]], [".", []]]}, {"c": 3, "v": 17, "text": "وأما الذي يملك مالا يمكنه من العيش في بحبوحة، ويقسي قلبه على أحد الإخوة المحتاجين، فكيف تكون محبة الله متأصلة فيه؟", "groups": [{"kw": "whoso", "raw": "Deu_15:7-11; Pro_19:17; Isa_58:7-10; Luk_3:11; 2Co_8:9, 2Co_8:14, 2Co_8:15, 2Co_9:5-9; 1Ti_6:17, 1Ti_6:18; Heb_13:16", "note": "", "refs": [{"l": "Deu 15:7-11", "n": "", "vs": [[7, "إن وجد بينكم إسرائيلي فقير مقيم في أي مدينة من مدن الأرض التي سيهبها لكم الرب إلهكم، فلا تقسوا قلوبكم وتمتنعوا عن إعانته،"], [8, "بل اسخوا عليه وأقرضوه مقدار ما يحتاج إليه."], [9, "إياكم أن تحدثوا قلوبكم بخبث قائلين: ها قد قربت السنة السابعة، سنة الإبراء من الديون فيسوء الأمر في أعينكم وتمتنعون عن إقراضه. فإن فعلتم هذا فإنه يستغيث بالرب عليكم، فتصبحون مذنبين في حكم الرب."], [10, "أقرضوه عن طيب خاطر، لأنه من أجل هذا يبارككم الرب إلهكم في كل أعمالكم وما تنتجه أيديكم،"], [11, "فالأرض لن تخلو أبدا من الفقراء، لهذا أوصيكم أن تسخوا على أخيكم المسكين والفقير المقيم في أرضكم."]]}, {"l": "Pro 19:17", "n": "", "vs": [[17, "من يرحم الفقير يقرض الرب، ويكافئه الرب على حسن صنيعه."]]}, {"l": "Isa 58:7-10", "n": "", "vs": [[7, "ألا يكون في مشاطرة خبزك مع الجائع، وإيواء الفقير المتشرد في بيتك. وكسوة العريان الذي تلتقيه، وعدم التغاضي عن قريبك البائس؟"], [8, "عندئذ يشع نورك كالصباح، وتزهر عافيتك سريعا، ويتقدمك برك، ويحرس مجد الرب مؤخرة ساقتك."], [9, "عندئذ تدعو فيستجيب الرب. تستغيث فيقول ها أنا. إن أزلت من وسط بيتك النير، والإيماء بالأصبع احتقارا، والنطق بالشر،"], [10, "إن بذلت نفسك للجائع، وأشبعت حاجة الذليل، فإن نورك يشرق في الظلمة، وليلك الدامس يصبح كالظهر،"]]}, {"l": "Luk 3:11", "n": "", "vs": [[11, "فأجابهم: «من كان عنده ثوبان، فليعط من لا ثوب عنده؛ ومن كان عنده طعام، فليعمل كذلك أيضا»."]]}, {"l": "2Co 8:9", "n": "", "vs": [[9, "فأنتم تعرفون نعمة ربنا يسوع المسيح: فمن أجلكم افتقر، وهو الغني لكي تغتنوا أنتم بفقره."]]}, {"l": "2Co 8:14", "n": "", "vs": [[14, "ففي الحالة الحاضرة، تسد وفرتكم حاجتهم، لكي تسد وفرتهم حاجتكم، فتتم المساواة،"]]}, {"l": "2Co 8:15", "n": "", "vs": [[15, "وفقا لما قد كتب: «المكثر لم يفضل عنه شيء، والمقلل لم ينقصه شيء»."]]}, {"l": "2Co 9:5-9", "n": "", "vs": [[5, "لذلك رأيت من اللازم أن ألتمس من الإخوة أن يسبقوني إليكم، لكي يعدوا أولا بركتكم التي سبق الإعلان عنها، فتكون جاهزة باعتبارها بركة، لا كأنها واجب ثقيل!"], [6, "فمن الحق أن من يزرع بالتقتير، يحصد أيضا بالتقتير، ومن يزرع بالبركات، يحصد أيضا بالبركات."], [7, "فليتبرع كل واحد بما نوى في قلبه، لا بأسف ولا عن اضطرار، لأن الله يحب المعطي المتهلل."], [8, "والله قادر أن يجعل كل نعمة تفيض عليكم، حتى يكون لكم اكتفاء كلي في كل شيء وكل حين، فتفيضوا في كل عمل صالح؛"], [9, "وفقا لما قد كتب: «وزع بسخاء، أعطى الفقراء، بره يدوم إلى الأبد!»"]]}, {"l": "1Ti 6:17", "n": "", "vs": [[17, "أوص أغنياء هذا الزمان بأن لا يتكبروا، ولا يتكلوا على الغنى غير الثابت، بل على الله الذي يمنحنا كل شيء بوفرة لنتمتع به،"]]}, {"l": "1Ti 6:18", "n": "", "vs": [[18, "وأن يفعلوا خيرا، ويكونوا أغنياء بالأعمال الصالحة، ويوزعوا بسخاء، ويكونوا على استعداد دائم لإشراك الآخرين في خيراتهم."]]}, {"l": "Heb 13:16", "n": "", "vs": [[16, "ولا تغفلوا أيضا عن عمل الخير وإعانة المحتاجين: لأن مثل هذه «الذبائح» تسر الله جدا!"]]}], "kwAr": "الذي يملك مالا", "noteAr": ""}, {"kw": "shutteth", "raw": "Pro_12:10 *marg. Pro_28:9", "note": "", "refs": [{"l": "Pro 12:10", "n": "*marg.", "vs": [[10, "الصديق يراعي نفس بهيمته، أما الشرير فأرق مراحمه تتسم بالقسوة."]]}, {"l": "Pro 28:9", "n": "", "vs": [[9, "من يصرف أذنه عن الاستماع إلى الشريعة، تصير حتى صلاته رجاسة."]]}], "kwAr": "يقسي قلبه", "noteAr": ""}, {"kw": "how", "raw": "1Jo_4:20, 1Jo_5:1", "note": "", "refs": [{"l": "1Jo 4:20", "n": "", "vs": [[20, "فإن قال أحد: «أنا أحب الله !» ولكنه يبغض أخا له، فهو كاذب، لأنه إن كان لا يحب أخاه الذي يراه، فكيف يقدر أن يحب الله الذي لم يره قط؟"]]}, {"l": "1Jo 5:1", "n": "", "vs": [[1, "كل من يؤمن حقا أن يسوع هو المسيح، فهو مولود من الله. ومن يحب الوالد، فلابد أن يحب المولودين منه أيضا."]]}], "kwAr": "فكيف تكون محبة الله متأصلة فيه", "noteAr": ""}], "arS": [["وأما الذي يملك ", []], ["مالا", ["G979"]], [" يمكنه من العيش في بحبوحة، ", []], ["ويقسي قلبه", ["G2808"]], [" على أحد ", []], ["الإخوة", ["G80"]], [" ", []], ["المحتاجين", ["G5532"]], ["، ", []], ["فكيف", ["G4459"]], [" تكون ", []], ["محبة", ["G26"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["متأصلة", ["G3306"]], [" فيه؟", []]]}, {"c": 3, "v": 18, "text": "أيها الأولاد الصغار، لا يجب أن تكون محبتنا مجرد ادعاء بالكلام واللسان، بل تكون محبة عملية حقة.", "groups": [{"kw": "My", "raw": "1Jo_2:1", "note": "", "refs": [{"l": "1Jo 2:1", "n": "", "vs": [[1, "ياأولادي الصغار، أكتب إليكم هذه الأمور لكي لا تخطئوا. ولكن، إن أخطأ أحدكم، فلنا عند الآب شفيع هو يسوع المسيح البار."]]}], "kwAr": "أيها الأولاد الصغار", "noteAr": ""}, {"kw": "let", "raw": "Exo_33:21; Mat_25:41-45; Rom_12:9; 1Co_13:4-7; Gal_5:13, Gal_6:1, Gal_6:2; Eph_4:1-3, Eph_4:15; 1Th_1:3; Jam_2:15, Jam_2:16; 1Pe_1:22", "note": "", "refs": [{"l": "Exo 33:21", "n": "", "vs": [[21, "ثم قال الرب: «لدي مكان قريب مني. فقف على الصخرة،"]]}, {"l": "Mat 25:41-45", "n": "", "vs": [[41, "ثم يقول للذين عن يساره: ابتعدوا عني ياملاعين إلى النار الأبدية المعدة لإبليس وأعوانه!"], [42, "لأني جعت فلم تطعموني، وعطشت فلم تسقوني،"], [43, "كنت غريبا فلم تأووني، عريانا فلم تكسوني، مريضا وسجينا فلم تزوروني!"], [44, "فيرد هؤلاء أيضا قائلين: يارب، متى رأيناك جائعا أو عطشانا أو غريبا أو عريانا أو مريضا أو سجينا، ولم نخدمك؟"], [45, "فيجيبهم: الحق أقول لكم: بما أنكم لم تفعلوا ذلك بأحد إخوتي هؤلاء الصغار، فبي لم تفعلوا!"]]}, {"l": "Rom 12:9", "n": "", "vs": [[9, "ولتكن المحبة بلا رياء. انفروا من الشر، والتصقوا بالخير."]]}, {"l": "1Co 13:4-7", "n": "", "vs": [[4, "المحبة تصبر طويلا؛ وهي لطيفة. المحبة لا تحسد. المحبة لا تتفاخر ولا تتكبر."], [5, "لا تتصرف بغير لياقة، ولا تسعى إلى مصلحتها الخاصة. لا تستفز سريعا، ولا تنسب الشر لأحد."], [6, "لا تفرح بالظلم، بل تفرح بالحق."], [7, "إنها تستر كل شيء، وتصدق كل شيء، وترجو كل شيء، وتتحمل كل شيء."]]}, {"l": "Gal 5:13", "n": "", "vs": [[13, "فإنما إلى الحرية قد دعيتم، أيها الإخوة؛ ولكن لا تتخذوا من الحرية ذريعة لإرضاء الجسد، بل بالمحبة كونوا عبيدا في خدمة أحدكم الآخر."]]}, {"l": "Gal 6:1", "n": "", "vs": [[1, "أيها الإخوة، إن سقط أحدكم في خطأ ما فمثل هذا أصلحوه أنتم الروحيين بروح وداعة. واحذر أنت لنفسك لئلا تجرب أيضا."]]}, {"l": "Gal 6:2", "n": "", "vs": [[2, "ليحمل الواحد منكم أثقال الآخر، وهكذا تتممون شريعة المسيح."]]}, {"l": "Eph 4:1-3", "n": "", "vs": [[1, "... إذن، أنا السجين في الرب، أناشدكم أن تسلكوا سلوكا يليق بالدعوة التي إليها دعيتم،"], [2, "بكل تواضع ووداعة وطول بال، محتملين بعضكم بعضا في المحبة،"], [3, "مجتهدين أن تحافظوا على وحدة الروح برابطة الوفاق. فإنما هناك جسد واحد وروح واحد،"]]}, {"l": "Eph 4:15", "n": "", "vs": [[15, "بل نتمسك بالحق في المحبة، فننمو في كل شيء نحو من هو الرأس، أي المسيح."]]}, {"l": "1Th 1:3", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"]]}, {"l": "Jam 2:15", "n": "", "vs": [[15, "لنفرض أن أخا أو أختا كانا بحاجة شديدة إلى الثياب والطعام اليومي،"]]}, {"l": "Jam 2:16", "n": "", "vs": [[16, "وقال لهما أحدكم: «أتمنى لكما كل خير. البسا ثيابا دافئة، وكلا طعاما جيدا!» دون أن يقدم لهما ما يحتاجان إليه من ثياب وطعام، فأي نفع في ذلك؟"]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}], "kwAr": "لا تكون محبتنا مجرد ادعاء", "noteAr": ""}], "arS": [["أيها ", []], ["الأولاد الصغار", ["G3450", "G5040"]], ["، لا يجب أن تكون محبتنا مجرد ادعاء ", []], ["بالكلام", ["G3056"]], [" ", []], ["واللسان", ["G1100"]], ["، بل تكون محبة ", []], ["عملية", ["G2041"]], [" ", []], ["حقة", ["G225"]], [".", []]]}, {"c": 3, "v": 19, "text": "عندئذ نتأكد أننا نتصرف بحسب الحق، وتطمئن نفوسنا في حضرة الله،", "groups": [{"kw": "hereby", "raw": "1Jo_3:14, 1Jo_1:8; Joh_13:35, Joh_18:37", "note": "", "refs": [{"l": "1Jo 3:14", "n": "", "vs": [[14, "إن محبتنا لإخوتنا تبين لنا أننا انتقلنا من الموت إلى الحياة. فالذي لا يحب إخوته، فهو باق في الموت."]]}, {"l": "1Jo 1:8", "n": "", "vs": [[8, "إن كنا ندعي أن لا خطيئة لنا، نخدع أنفسنا، ولا يكون الحق في داخلنا."]]}, {"l": "Joh 13:35", "n": "", "vs": [[35, "بهذا يعرف الجميع أنكم تلاميذي: إن كنتم تحبون بعضكم بعضا»."]]}, {"l": "Joh 18:37", "n": "", "vs": [[37, "فسأله بيلاطس: «فهل أنت ملك إذن؟» أجابه: «أنت قلت، إني ملك. ولهذا ولدت وجئت إلى العالم: لأشهد للحق، وكل من هو من الحق يصغي لصوتي»."]]}], "kwAr": "عندئذ نتأكد", "noteAr": ""}, {"kw": "shall", "raw": "1Jo_3:21; Isa_32:17; Heb_6:10,Heb_6:11, Heb_10:22", "note": "", "refs": [{"l": "1Jo 3:21", "n": "", "vs": [[21, "أيها الأحباء، إذا كانت ضمائرنا لا تلومنا. فهذا دليل على أن لنا ثقة عظيمة من نحو الله."]]}, {"l": "Isa 32:17", "n": "", "vs": [[17, "فيكون ثمر البر سلاما، وفعل البر سكينة وطمأنينة إلى الأبد،"]]}, {"l": "Heb 6:10", "n": "", "vs": [[10, "وليس الله بظالم حتى ينسى عملكم الجاد في إظهار محبتكم له عن طريق خدمتكم للقديسين إكراما لاسمه، الأمر الذي قمتم به قبلا، وتقومون به الآن!"]]}, {"l": "Heb 6:11", "n": "", "vs": [[11, "وإنما نتمنى أن يظهر كل واحد منكم اجتهادا مماثلا في المحافظة حتى النهاية على الثقة الكاملة بالرجاء."]]}, {"l": "Heb 10:22", "n": "", "vs": [[22, "فلنتقدم إلى حضرة الله بقلب صادق وبثقة الإيمان الكاملة، بعدما طهر رش الدم قلوبنا من كل شعور بالذنب، وغسل الماء النقي أجسادنا."]]}], "kwAr": "في حضرة الله", "noteAr": ""}, {"kw": "assure", "raw": "Gr. persuade, Rom_4:21, Rom_8:38; 2Ti_1:12; Heb_11:13", "note": "Gr. persuade, Rom_4:21, Rom_8:38; 2Ti_1:12; Heb_11:13", "refs": [{"l": "Rom 4:21", "n": "", "vs": [[21, "وإذ اقتنع تماما بأن ما وعده الله به هو قادر أن يفعله؛"]]}, {"l": "Rom 8:38", "n": "", "vs": [[38, "فإني لعلى يقين بأنه لا الموت ولا الحياة، ولا الملائكة ولا الرياسات، ولا الأمور الحاضرة ولا الآتية، ولا القوات،"]]}, {"l": "2Ti 1:12", "n": "", "vs": [[12, "من أجل ذلك أيضا أقاسي الآن هذه الآلام، ولكني لست أخجل، لأنني أعرف من أنا مؤمن به، ولي تمام الثقة بأنه قادر أن يحفظ لي الأمانة التي أودعتها عنده سالمة إلى ذلك اليوم."]]}, {"l": "Heb 11:13", "n": "", "vs": [[13, "هؤلاء جميعا، حافظوا على إيمانهم إلى النهاية. وماتوا قبل أن تتحقق وعود الله لهم في أثناء حياتهم. ولكنهم رأوها من بعيد، وتوقعوا تحقيقها كاملة في المستقبل. وإذ آمنوا بتلك الوعود الإلهية اعترفوا بأنهم ليسوا إلا غرباء على الأرض يزورونها زيارة عابرة."]]}], "kwAr": "تطمئن نفوسنا", "noteAr": "في اليونانية: نُقنع."}], "arS": [["عندئذ ", []], ["نتأكد", ["G1097"]], [" أننا نتصرف بحسب ", []], ["الحق", ["G225"]], ["، ", []], ["وتطمئن", ["G3982"]], [" ", []], ["نفوسنا", ["G2588"]], [" في ", []], ["حضرة", ["G1715"]], [" الله،", []]]}, {"c": 3, "v": 20, "text": "ولو لامتنا قلوبنا؛ فإن الله أعظم من قلوبنا، وهو العليم بكل شيء.", "groups": [{"kw": "if", "raw": "Job_27:6; Joh_8:9; Act_5:33; Rom_2:14, Rom_2:15; 1Co_4:4, 1Co_14:24, 1Co_14:25; Tit_3:11", "note": "", "refs": [{"l": "Job 27:6", "n": "", "vs": [[6, "أتشبث ببري ولن أرخيه، لأن ضميري لا يؤنبني على يوم من أيامي."]]}, {"l": "Joh 8:9", "n": "", "vs": [[9, "فلما سمعوا هذا الكلام انسحبوا جميعا واحدا تلو الآخر، ابتداء من الشيوخ. وبقي يسوع وحده، والمرأة واقفة في مكانها."]]}, {"l": "Act 5:33", "n": "", "vs": [[33, "ولما سمع المجتمعون هذا الكلام اشتد غضبهم، وقرروا أن يقتلوا الرسل."]]}, {"l": "Rom 2:14", "n": "", "vs": [[14, "إذن الأمم الذين بلا شريعة، عندما يمارسون بالطبيعة ما في الشريعة، يكونون شريعة لأنفسهم، مع أن الشريعة ليست لهم."]]}, {"l": "Rom 2:15", "n": "", "vs": [[15, "فهم يظهرون جوهر الشريعة مكتوبا في قلوبهم، ويشهد لذلك ضميرهم وأفكارهم في داخلهم، إذ تتهمهم تارة، وتارة تبرئهم."]]}, {"l": "1Co 4:4", "n": "", "vs": [[4, "فإن ضميري لا يؤنبني بشيء، ولكني لست أعتمد ذلك لتبرير نفسي. فإن الذي يحكم في هو الرب."]]}, {"l": "1Co 14:24", "n": "", "vs": [[24, "ولكن، إن كان الجميع يتنبأون، ثم دخل واحد من غير المؤمنين أو قليلي الخبرة، فإنه يقتنع من الجميع، ويحكم عليه من قبل الجميع،"]]}, {"l": "1Co 14:25", "n": "", "vs": [[25, "وإذ تنكشف خبايا قلبه، يخر على وجهه ساجدا لله، معترفا بأن الله فيكم حقا."]]}, {"l": "Tit 3:11", "n": "", "vs": [[11, "عالما أن مثل هذا هو منحرف يمضي في الخطيئة وقد حكم على نفسه بنفسه!"]]}], "kwAr": "لو لامتنا قلوبنا", "noteAr": ""}, {"kw": "God", "raw": "1Jo_4:4; Job_33:12; Joh_10:29, Joh_10:30; Heb_6:13", "note": "", "refs": [{"l": "1Jo 4:4", "n": "", "vs": [[4, "أيها الأولاد الصغار، أنتم من الله، وقد غلبتم الذين يقاومون المسيح: لأن الروح القدس الساكن فيكم أقوى من الروح الشرير المنتشر في العالم."]]}, {"l": "Job 33:12", "n": "", "vs": [[12, "ولكنك مخطيء في هذا، وأنا الذي أجيبك. إن الله أعظم من الإنسان،"]]}, {"l": "Joh 10:29", "n": "", "vs": [[29, "إن الآب الذي أعطاني إياها هو أعظم من الجميع، ولا يقدر أحد أن ينتزع من يد الآب شيئا."]]}, {"l": "Joh 10:30", "n": "", "vs": [[30, "أنا والآب واحد!»"]]}, {"l": "Heb 6:13", "n": "", "vs": [[13, "لنأخذ وعد الله لإبراهيم مثلا. فلما قطع له ذلك الوعد، أقسم بنفسه، إذ ليس هنالك من هو أعظم منه حتى يقسم به."]]}], "kwAr": "الله أعظم من قلوبنا", "noteAr": ""}, {"kw": "and", "raw": "Psa_44:20,Psa_44:21, Psa_90:8, Psa_139:1-4; Jer_17:10, Jer_23:24; Joh_2:24, Joh_2:25, Joh_21:17; Heb_4:13; Rev_2:23", "note": "", "refs": [{"l": "Psa 44:20", "n": "", "vs": [[20, "إن كنا قد نسينا اسم إلهنا، وصلينا إلى إله غريب،"]]}, {"l": "Psa 44:21", "n": "", "vs": [[21, "ألا يعرف الله ذلك وهو علام الغيوب؟"]]}, {"l": "Psa 90:8", "n": "", "vs": [[8, "جعلت آثامنا أمامك وخطايانا الخفية ظاهرة لديك."]]}, {"l": "Psa 139:1-4", "n": "", "vs": [[1, "يارب قد فحصتني وعرفتني."], [2, "أنت عرفت قعودي ونهوضي. فهمت فكري من بعيد."], [3, "أنت تقصيت مسلكي ومرقدي، وتعرف كل طرقي."], [4, "عرفت كل كلمة من قبل أن يتفوه بها لساني."]]}, {"l": "Jer 17:10", "n": "", "vs": [[10, "أنا الرب أفحص القلوب وأمتحن الأفكار، لأجازي كل واحد حسب طرقه، وبمقتضى أفعاله»."]]}, {"l": "Jer 23:24", "n": "", "vs": [[24, "أيمكن لأحد أن يتوارى في أماكن خفية فلا أراه؟ أما أملأ السماوات والأرض؟"]]}, {"l": "Joh 2:24", "n": "", "vs": [[24, "ولكنه هو لم يأتمنهم على نفسه، لأنه كان يعرف الجميع"]]}, {"l": "Joh 2:25", "n": "", "vs": [[25, "ولم يكن بحاجة إلى من يشهد له عن الإنسان، لأنه يعرف دخيلة الإنسان."]]}, {"l": "Joh 21:17", "n": "", "vs": [[17, "فسأله مرة ثالثة: «ياسمعان بن يونا، أتحبني؟» فحزن بطرس لأن يسوع قال له في المرة الثالثة: «أتحبني». وقال له: «يارب، أنت تعلم كل شيء. أنت تعلم أني أحبك!» فقال له يسوع: «أطعم خرافي!"]]}, {"l": "Heb 4:13", "n": "", "vs": [[13, "وليس هنالك مخلوق واحد محجوب عن نظر الله، بل كل شيء عريان ومكشوف أمام عينيه، هو الذي سنؤدي له حسابا."]]}, {"l": "Rev 2:23", "n": "", "vs": [[23, "سأبيد أولادها بالموت، فتعرف الكنائس كلها أنني أنا الذي أفحص الأفكار والقلوب، وأجازي كل واحد منكم بحسب أعماله."]]}], "kwAr": "العليم بكل شيء", "noteAr": ""}], "arS": [["ولو ", []], ["لامتنا", ["G2607"]], [" ", []], ["قلوبنا", ["G2588"]], ["؛ فإن ", []], ["الله", ["G2316"]], [" ", []], ["أعظم", ["G3187"]], [" من ", []], ["قلوبنا", ["G2588"]], ["، وهو ", []], ["العليم", ["G1097"]], [" ", []], ["بكل شيء", ["G3956"]], [".", []]]}, {"c": 3, "v": 21, "text": "أيها الأحباء، إذا كانت ضمائرنا لا تلومنا. فهذا دليل على أن لنا ثقة عظيمة من نحو الله.", "groups": [{"kw": "", "raw": "1Jo_2:28, 1Jo_4:17; Job_22:26, Job_27:6; Psa_7:3-5, Psa_101:2; 1Co_4:4; 2Co_1:12; 1Ti_2:8; Heb_4:16, Heb_10:22", "note": "", "refs": [{"l": "1Jo 2:28", "n": "", "vs": [[28, "والآن، أيها الأولاد، كونوا ثابتين في المسيح، حتى تكون لنا نحن ثقة أمامه، ولا نخجل منه، عندما يعود."]]}, {"l": "1Jo 4:17", "n": "", "vs": [[17, "وتكون محبة الله قد اكتملت في داخلنا حين تولد فينا ثقة كاملة من جهة يوم الدينونة: لأنه كما المسيح، هكذا نحن أيضا في هذا العالم."]]}, {"l": "Job 22:26", "n": "", "vs": [[26, "عندئذ تتلذذ نفسك بالقدير، ويرتفع وجهك نحو الله."]]}, {"l": "Job 27:6", "n": "", "vs": [[6, "أتشبث ببري ولن أرخيه، لأن ضميري لا يؤنبني على يوم من أيامي."]]}, {"l": "Psa 7:3-5", "n": "", "vs": [[3, "أيها الرب إلهي، إن كنت قد اقترفت هذه الإساءة، وكانت يداي قد ارتكبتا هذا الإثم،"], [4, "إن كنت قد أسأت لمن أحسن إلي وسلبت عدوي من غير سبب،"], [5, "إذن فليطارد العدو نفسي وينزعها مني، وليدس في الأرض حياتي، ويعفر في التراب شرفي."]]}, {"l": "Psa 101:2", "n": "", "vs": [[2, "أسلك بتعقل في طريق الكمال. متى تأتي يارب لمعونتي؟ أسلك في وسط بيتي باستقامة قلبي."]]}, {"l": "1Co 4:4", "n": "", "vs": [[4, "فإن ضميري لا يؤنبني بشيء، ولكني لست أعتمد ذلك لتبرير نفسي. فإن الذي يحكم في هو الرب."]]}, {"l": "2Co 1:12", "n": "", "vs": [[12, "فإن فخرنا هو هذا: شهادة ضميرنا بأننا، في قداسة الله وإخلاصه، قد سلكنا في العالم، وبخاصة تجاهكم؛ ولم يكن ذلك بحكمة بشرية بل بنعمة الله."]]}, {"l": "1Ti 2:8", "n": "", "vs": [[8, "فأريد إذن، أن يصلي الرجال في كل مكان، رافعين أيادي طاهرة، وهم لا يضمرون أي حقد أو شكوك."]]}, {"l": "Heb 4:16", "n": "", "vs": [[16, "فلنتقدم بثقة إلى عرش النعمة، لننال الرحمة ونجد نعمة تعيننا عند الحاجة."]]}, {"l": "Heb 10:22", "n": "", "vs": [[22, "فلنتقدم إلى حضرة الله بقلب صادق وبثقة الإيمان الكاملة، بعدما طهر رش الدم قلوبنا من كل شعور بالذنب، وغسل الماء النقي أجسادنا."]]}], "kwAr": "", "noteAr": ""}], "arS": [["أيها ", []], ["الأحباء", ["G27"]], ["، إذا كانت ", []], ["ضمائرنا", ["G2588"]], [" لا ", []], ["تلومنا", ["G2607"]], [". فهذا دليل على أن لنا ", []], ["ثقة", ["G3954"]], [" عظيمة من نحو ", []], ["الله", ["G2316"]], [".", []]]}, {"c": 3, "v": 22, "text": "ومهما نطلب منه بالصلاة، نحصل عليه: لأننا نطيع ما يوصينا به، ونمارس الأعمال التي ترضيه.", "groups": [{"kw": "whatsoever", "raw": "1Jo_5:14; Psa_10:17, Psa_34:4, Psa_34:15-17, Psa_50:15, Psa_66:18, Psa_66:19, Psa_145:18, Psa_145:19; Pro_15:29; Pro_28:9; Isa_1:15, Isa_55:6, Isa_55:7; Jer_29:12, Jer_29:13, Jer_33:3; Mat_7:7, Mat_7:8, Mat_21:22; Mar_11:24; Luk_11:9-13; Joh_9:31, Joh_14:13, Joh_15:7, Joh_16:23, Joh_16:24; Jam_1:5, Jam_5:16", "note": "", "refs": [{"l": "1Jo 5:14", "n": "", "vs": [[14, "نحن نثق بالله ثقة عظيمة تؤكد لنا أنه يسمع لنا الطلبات التي نرفعها إليه، إن كانت منسجمة مع إرادته."]]}, {"l": "Psa 10:17", "n": "", "vs": [[17, "أنت يارب تستجيب طلبة الودعاء، تشدد قلوبهم إذ تصغي (إلى تأوهاتهم)."]]}, {"l": "Psa 34:4", "n": "", "vs": [[4, "التمست الرب فأجابني، وأنقذني من كل مخاوفي."]]}, {"l": "Psa 34:15-17", "n": "", "vs": [[15, "لأن الرب يرعى الأبرار بعنايته ويستجيب إلى دعائهم."], [16, "ولكن يقف ضد الذين يعملون الشر ليستأصل من الأرض ذكرهم."], [17, "يستغيث الأبرار، فيسمع لهم الرب وينقذهم من جميع ضيقاتهم."]]}, {"l": "Psa 50:15", "n": "", "vs": [[15, "ادعني في يوم ضيقك أنقذك فتمجدني»."]]}, {"l": "Psa 66:18", "n": "", "vs": [[18, "إن تعهدت إثما في قلبي لا يستمع لي الرب."]]}, {"l": "Psa 66:19", "n": "", "vs": [[19, "ولكن الله قد استجاب لي. أصغى إلى صوت صلاتي."]]}, {"l": "Psa 145:18", "n": "", "vs": [[18, "الرب قريب من جميع الذين يدعونه بصدق،"]]}, {"l": "Psa 145:19", "n": "", "vs": [[19, "يجيب سؤل جميع خائفيه، ويسمع تضرعهم فيخلصهم."]]}, {"l": "Pro 15:29", "n": "", "vs": [[29, "الرب بعيد عن الأشرار، إنما يسمع صلاة الأبرار."]]}, {"l": "Pro 28:9", "n": "", "vs": [[9, "من يصرف أذنه عن الاستماع إلى الشريعة، تصير حتى صلاته رجاسة."]]}, {"l": "Isa 1:15", "n": "", "vs": [[15, "عندما تبسطون نحوي أيديكم أحجب وجهي عنكم، وإن أكثرتم الصلاة لا أستجيب، لأن أيديكم مملوءة دما."]]}, {"l": "Isa 55:6", "n": "", "vs": [[6, "اطلبوا الرب مادام موجودا، ادعوه وهو قريب."]]}, {"l": "Isa 55:7", "n": "", "vs": [[7, "ليترك الشرير طريقه والأثيم أفكاره، وليتب إلى الرب فيرحمه، وليرجع إلى إلهنا لأنه يكثر الغفران."]]}, {"l": "Jer 29:12", "n": "", "vs": [[12, "فتدعونني وتقبلون، وتصلون إلي فأستجيب لكم،"]]}, {"l": "Jer 29:13", "n": "", "vs": [[13, "وتلتمسونني فتجدونني إذ تطلبونني بكل قلوبكم."]]}, {"l": "Jer 33:3", "n": "", "vs": [[3, "ادعني فأجيبك وأطلعك على عظائم وغرائب لم تعرفها."]]}, {"l": "Mat 7:7", "n": "", "vs": [[7, "اسألوا، تعطوا. اطلبوا، تجدوا. اقرعوا، يفتح لكم."]]}, {"l": "Mat 7:8", "n": "", "vs": [[8, "فكل من يسأل، ينل؛ ومن يطلب، يجد؛ ومن يقرع، يفتح له."]]}, {"l": "Mat 21:22", "n": "", "vs": [[22, "وكل ما تطلبونه في الصلاة بإيمان، تنالونه»."]]}, {"l": "Mar 11:24", "n": "", "vs": [[24, "لهذا السبب أقول لكم: إن ما تطلبونه وتصلون لأجله، فآمنوا أنكم قد نلتموه، فيتم لكم."]]}, {"l": "Luk 11:9-13", "n": "", "vs": [[9, "فإني أقول لكم: اطلبوا، تعطوا؛ اسعوا، تجدوا؛ اقرعوا، يفتح لكم:"], [10, "فإن كل من يطلب ينال، ومن يسعى يجد، ومن يقرع يفتح له."], [11, "فأي أب منكم يطلب منه ابنه خبزا فيعطيه حجرا؟ أو يطلب سمكة فيعطيه بدل السمكة حية؟"], [12, "أو يطلب بيضة، فيعطيه عقربا؟"], [13, "فإن كنتم، أنتم الأشرار، تعرفون أن تعطوا أولادكم عطايا جيدة، فكم بالأحرى الآب، الذي من السماء يهب الروح القدس لمن يسألونه؟ »"]]}, {"l": "Joh 9:31", "n": "", "vs": [[31, "نحن نعلم أن الله لا يستجيب للخاطئين، ولكنه يستمع لمن يتقيه ويعمل بإرادته،"]]}, {"l": "Joh 14:13", "n": "", "vs": [[13, "فأي شيء تطلبونه باسمي أفعله لكم، ليتمجد الآب في الابن."]]}, {"l": "Joh 15:7", "n": "", "vs": [[7, "ولكن، إن ثبتم في، وثبت كلامي فيكم، فاطلبوا ما تريدون يكن لكم."]]}, {"l": "Joh 16:23", "n": "", "vs": [[23, "وفي ذلك اليوم لا تسألونني عن شيء. الحق الحق أقول لكم: إن الآب سيعطيكم كل ما تطلبون منه باسمي."]]}, {"l": "Joh 16:24", "n": "", "vs": [[24, "حتى الآن لم تطلبوا باسمي شيئا. اطلبوا تنالوا، فيكون فرحكم كاملا."]]}, {"l": "Jam 1:5", "n": "", "vs": [[5, "وإن كان أحد منكم بحاجة إلى الحكمة، فليطلب من الله الذي يعطي الجميع بسخاء ولا يعير. فسيعطى له."]]}, {"l": "Jam 5:16", "n": "", "vs": [[16, "ليعترف كل واحد منكم لأخيه بزلاته، وصلوا بعضكم لأجل بعض، حتى تشفوا. إن الصلاة الحارة التي يرفعها البار لها فعالية عظيمة."]]}], "kwAr": "مهما نطلب", "noteAr": ""}, {"kw": "because", "raw": "1Jo_3:23, 1Jo_3:24; Mat_7:24, Mat_7:25, Mat_17:5; Joh_15:10; Act_17:30, Act_20:21", "note": "", "refs": [{"l": "1Jo 3:23", "n": "", "vs": [[23, "وأما وصيته فهي أن نؤمن باسم ابنه يسوع المسيح، وأن يحب بعضنا بعضا كما أوصانا."]]}, {"l": "1Jo 3:24", "n": "", "vs": [[24, "وكل من يطيع وصايا الله، فإنه يثبت في الله، والله يثبت فيه. والذي يؤكد لنا أن الله يثبت فينا، هو الروح القدس الذي وهبه لنا."]]}, {"l": "Mat 7:24", "n": "", "
