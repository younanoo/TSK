<script>window.CATALOG=[{"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 5, "nv": 99, "refs": 1290, "last": "5:17", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 62, "abbr": "1Jo", "en": "1 John", "verses": [{"c": 1, "v": 1, "text": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا.", "groups": [{"kw": "That which", "raw": "1Jo_2:13; Pro_8:22-31; Isa_41:4; Mic_5:2; Joh_1:1, 2-18, Joh_8:58; Rev_1:8, Rev_1:11, Rev_1:17, Rev_1:18, Rev_2:8", "note": "", "refs": [{"l": "1Jo 2:13", "n": "", "vs": [[13, "أكتب إليكم أيها الآباء، لأنكم قد عرفتم المسيح الكائن منذ البداية. أكتب إليكم أيها الشباب، لأنكم قد غلبتم إبليس الشرير. كتبت إليكم أيها الأولاد الصغار، لأنكم قد عرفتم الآب."]]}, {"l": "Pro 8:22-31", "n": "", "vs": [[22, "اقتناني الرب منذ بدء خلقه، من قبل الشروع في أعماله القديمة."], [23, "منذ الأزل أنا هو، منذ البدء قبل أن توجد الأرض."], [24, "ولدت من قبل أن تتكون اللجج والينابيع الغزيرة المياه."], [25, "ولدت من قبل أن تقررت الجبال والتلال."], [26, "إذ لم يكن قد خلق الأرض بعد، ولا البراري ولا بداية أتربة المسكونة."], [27, "وعندما ثبت الرب السماء، وحين رسم دائرة الأفق حول وجه الغمر، كنت هناك."], [28, "عندما ثبت السحب في العلاء، ورسخ ينابيع اللجج."], [29, "عندما قرر للبحر تخوما لا تتجاوزها مياهه متعدية على أمر الرب، وحين رسم أسس الأرض،"], [30, "كنت عنده صانعا مبدعا، وكنت كل يوم لذته، أفيض بهجة دائما أمامه."], [31, "مغتبطة بعالمه المسكون، ومسراتي مع بني آدم."]]}, {"l": "Isa 41:4", "n": "", "vs": [[4, "من فعل هذا وأنجزه داعيا الأجيال منذ البدء؟ أنا الرب. أنا الأول والآخر."]]}, {"l": "Mic 5:2", "n": "", "vs": [[2, "أما أنت يابيت لحم أفراتة، مع أنك قرية صغيرة بين ألوف قرى يهوذا، إلا أن منك يخرج لي من يصبح ملكا في إسرائيل وأصله منذ القديم، منذ الأزل."]]}, {"l": "Joh 1:1", "n": "", "vs": [[1, "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."]]}, {"l": "Joh 8:58", "n": "", "vs": [[58, "أجابهم: الحق الحق أقول لكم: إنني كائن من قبل أن يكون إبراهيم»."]]}, {"l": "Rev 1:8", "n": "", "vs": [[8, "«أنا الألف والياء» (البداية والنهاية). هذا يقوله الرب الإله الكائن والذي كان والذي سيأتي، القادر على كل شيء."]]}, {"l": "Rev 1:11", "n": "", "vs": [[11, "يقول: «دون ما تراه في كتاب، وابعث به إلى الكنائس السبع: في أفسس، وسميرنا، وبرغامس، وثياتيرا، وساردس، وفيلادلفيا، ولاودكية»."]]}, {"l": "Rev 1:17", "n": "", "vs": [[17, "فلما رأيته ارتميت عند قدميه كالميت، فلمسني بيده اليمنى وقال: «لا تخف! أنا الأول والآخر،"]]}, {"l": "Rev 1:18", "n": "", "vs": [[18, "أنا الحي. كنت ميتا، ولكن ها أنا حي إلى أبد الآبدين. ولي مفاتيح الموت والهاوية."]]}, {"l": "Rev 2:8", "n": "", "vs": [[8, "واكتب إلى ملاك الكنيسة في سميرنا: إليك ما يقوله الأول والآخر، الذي كان ميتا وعاد حيا:"]]}], "kwAr": "عما كان من البداية", "noteAr": ""}, {"kw": "which we have heard", "raw": "1Jo_4:14; Luk_1:2; Joh_1:14; Act_1:3, Act_4:20; 2Pe_1:16-18", "note": "", "refs": [{"l": "1Jo 4:14", "n": "", "vs": [[14, "ونحن أنفسنا نشهد أن الآب قد أرسل الابن مخلصا للعالم، لأننا رأيناه بعيوننا."]]}, {"l": "Luk 1:2", "n": "", "vs": [[2, "كما سلمها إلينا أولئك الذين كانوا من البداية شهود عيان، ثم صاروا خداما للكلمة،"]]}, {"l": "Joh 1:14", "n": "", "vs": [[14, "والكلمة صار بشرا، وخيم بيننا، ونحن رأينا مجده، مجد ابن وحيد عند الآب، وهو ممتلىء بالنعمة والحق."]]}, {"l": "Act 1:3", "n": "", "vs": [[3, "وخلال فترة أربعين يوما بعد آلامه، ظهر لهم مرات عديدة، وأثبت لهم أنه حي ببراهين كثيرة قاطعة، وحدثهم عن ملكوت الله."]]}, {"l": "Act 4:20", "n": "", "vs": [[20, "لا نستطيع أن نكف عن التحدث بما رأينا وسمعنا»."]]}, {"l": "2Pe 1:16-18", "n": "", "vs": [[16, "فنحن، عندما أخبرناكم بقدرة ربنا يسوع المسيح، وبعودته المجيدة، لم نكن ننقل عن أساطير مختلقة بمهارة. وإنما، تكلمنا باعتبارنا شهود عيان لعظمة المسيح."], [17, "فإنه قد نال من الله الآب كرامة ومجدا، إذ جاءه من المجد الفائق صوت يقول: «هذا هو ابني الحبيب الذي به سررت كل سرور!»"], [18, "ونحن أنفسنا قد سمعنا هذا الصوت الصادر من السماء لما كنا معه على الجبل المقدس."]]}], "kwAr": "سمعناه ورأيناه بعيوننا", "noteAr": ""}, {"kw": "and our", "raw": "Luk_24:39; Joh_20:27", "note": "", "refs": [{"l": "Luk 24:39", "n": "", "vs": [[39, "انظروا يدي وقدمي، فأنا هو بنفسي. المسوني وتحققوا، فإن الشبح ليس له لحم وعظام كما ترون لي»."]]}, {"l": "Joh 20:27", "n": "", "vs": [[27, "ثم قال لتوما: «هات إصبعك إلى هنا، وانظر يدي، وهات يدك وضعها في جنبي. ولا تكن غير مؤمن بل كن مؤمنا!»"]]}], "kwAr": "لمسناه بأيدينا", "noteAr": ""}, {"kw": "the Word", "raw": "1Jo_5:7; Joh_1:14, Joh_5:26; Rev_19:13", "note": "", "refs": [{"l": "1Jo 5:7", "n": "", "vs": [[7, "فإن هنالك ثلاثة شهود غفي السماء، الآب والكلمة والروح القدس، وهؤلاء الثلاثة هم واحدف."]]}, {"l": "Joh 1:14", "n": "", "vs": [[14, "والكلمة صار بشرا، وخيم بيننا، ونحن رأينا مجده، مجد ابن وحيد عند الآب، وهو ممتلىء بالنعمة والحق."]]}, {"l": "Joh 5:26", "n": "", "vs": [[26, "لأنه كما أن للآب حياة في ذاته، فقد أعطى الابن أيضا أن تكون له حياة في ذاته،"]]}, {"l": "Rev 19:13", "n": "", "vs": [[13, "وكان يرتدي ثوبا مغمسا بالدم؛ أما اسمه فهو «كلمة الله»"]]}], "kwAr": "كلمة الحياة", "noteAr": ""}], "arS": [["نكتب إليكم عما كان من ", []], ["البداية", ["G746"]], [" بخصوص ", []], ["كلمة", ["G3056"]], [" ", []], ["الحياة", ["G2222"]], [": عما ", []], ["سمعناه", ["G191"]], ["، ", []], ["ورأيناه", ["G3708"]], [" ", []], ["بعيوننا", ["G3788"]], ["، ", []], ["وشاهدناه", ["G2300"]], ["، ", []], ["ولمسناه", ["G5584"]], [" ", []], ["بأيدينا", ["G5495"]], [".", []]]}, {"c": 1, "v": 2, "text": "فإن «الحياة» تجلت أمامنا. وبعدما رأيناها فعلا، نشهد لها الآن. وها نحن ننقل إليكم خبر هذه الحياة الأبدية التي كانت عند الآب ثم تجلت أمامنا!", "groups": [{"kw": "the life", "raw": "1Jo_5:11, 1Jo_5:20; Joh_1:4, Joh_11:25, Joh_11:26, Joh_14:6", "note": "", "refs": [{"l": "1Jo 5:11", "n": "", "vs": [[11, "وهذه الشهادة هي أن الله أعطانا حياة أبدية، وأن هذه الحياة هي في ابنه."]]}, {"l": "1Jo 5:20", "n": "", "vs": [[20, "وإننا نعلم أن ابن الله قد جاء إلى الأرض وأنار أذهاننا لنعرف الإله الحق. ونحن الآن نحيا فيه، لأننا في ابنه يسوع المسيح. هذا هو الإله الحق، والحياة الأبدية."]]}, {"l": "Joh 1:4", "n": "", "vs": [[4, "فيه كانت الحياة. والحياة هذه كانت نور الناس."]]}, {"l": "Joh 11:25", "n": "", "vs": [[25, "فرد يسوع: «أنا هو القيامة والحياة. من آمن بي، وإن مات فسيحيا."]]}, {"l": "Joh 11:26", "n": "", "vs": [[26, "ومن كان حيا وآمن بي فلن يموت إلى الأبد. أتؤمنين بهذا؟»"]]}, {"l": "Joh 14:6", "n": "", "vs": [[6, "فأجابه يسوع: «أنا هو الطريق والحق والحياة. لا يأتي أحد إلى الآب إلا بي."]]}], "kwAr": "«الحياة»", "noteAr": ""}, {"kw": "was manifested", "raw": "1Jo_3:5, 1Jo_3:8; Rom_16:25, Rom_16:26; 1Ti_3:16; 2Ti_1:10; Tit_1:2", "note": "", "refs": [{"l": "1Jo 3:5", "n": "", "vs": [[5, "وأنتم تعرفون أن المسيح جاء إلى هذه الأرض لكي يحمل الخطايا، مع كونه بلا خطيئة."]]}, {"l": "1Jo 3:8", "n": "", "vs": [[8, "ولكن من يمارس الخطيئة، يظهر أنه من أولاد إبليس، لأن إبليس يمارس الخطيئة منذ البداية. وقد جاء ابن الله إلى الأرض لكي يبطل أعمال إبليس."]]}, {"l": "Rom 16:25", "n": "", "vs": [[25, "والمجد للقادر أن يثبتكم، وفقا لإنجيلي وللبشارة بيسوع المسيح، ووفقا لإعلان ما كان سرا ظل مكتوما مدى الأزمنة الأزلية،"]]}, {"l": "Rom 16:26", "n": "", "vs": [[26, "ولكن أذيع الآن، بأمر الله الأزلي في الكتابات النبوية، على جميع الأمم لأجل إطاعة الإيمان؛"]]}, {"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}, {"l": "2Ti 1:10", "n": "", "vs": [[10, "والتي أعلنت الآن بظهور مخلصنا يسوع المسيح الذي سحق الموت وأنار الحياة والخلود بالإنجيل"]]}, {"l": "Tit 1:2", "n": "", "vs": [[2, "في رجاء الحياة الأبدية، التي وعد بها الله المنزه عن الكذب، من قبل أزمنة الأزل،"]]}], "kwAr": "تجلت أمامنا", "noteAr": ""}, {"kw": "and bear", "raw": "Joh_15:27, Joh_21:14; Act_1:22, Act_2:32, Act_3:15, Act_5:32, Act_10:41; 1Pe_5:1", "note": "", "refs": [{"l": "Joh 15:27", "n": "", "vs": [[27, "وتشهدون لي أنتم أيضا، لأنكم معي من البداية."]]}, {"l": "Joh 21:14", "n": "", "vs": [[14, "هذه هي المرة الثالثة التي أظهر فيها يسوع نفسه لتلاميذه بعدما قام من الأموات."]]}, {"l": "Act 1:22", "n": "", "vs": [[22, "منذ أن عمده يوحنا إلى يوم ارتفاعه عنا إلى السماء، ليكون معنا شاهدا بقيامة يسوع»."]]}, {"l": "Act 2:32", "n": "", "vs": [[32, "فيسوع هذا أقامه الله من الموت، ونحن جميعا شهود لذلك."]]}, {"l": "Act 3:15", "n": "", "vs": [[15, "وقتلتم واهب الحياة. ولكن الله أقامه من بين الأموات ونحن شهود لذلك."]]}, {"l": "Act 5:32", "n": "", "vs": [[32, "ونحن نشهد على هذا، وكذلك يشهد الروح القدس الذي وهبه الله للذين يطيعونه»."]]}, {"l": "Act 10:41", "n": "", "vs": [[41, "لا للشعب كله، بل للشهود الذين اختارهم الله من قبل، لنا نحن الذين أكلنا وشربنا معه بعد قيامته من بين الأموات."]]}, {"l": "1Pe 5:1", "n": "", "vs": [[1, "وهذه وصيتي إلى الشيوخ الذين بينكم، بصفتي شيخا رفيقا لهم، وشاهدا لآلام المسيح، وشريكا في المجد الذي سيتجلى:"]]}], "kwAr": "نشهد لها", "noteAr": ""}, {"kw": "show", "raw": "1Jo_5:20", "note": "", "refs": [{"l": "1Jo 5:20", "n": "", "vs": [[20, "وإننا نعلم أن ابن الله قد جاء إلى الأرض وأنار أذهاننا لنعرف الإله الحق. ونحن الآن نحيا فيه، لأننا في ابنه يسوع المسيح. هذا هو الإله الحق، والحياة الأبدية."]]}], "kwAr": "ننقل إليكم خبر", "noteAr": ""}, {"kw": "that eternal", "raw": "Joh_17:3", "note": "", "refs": [{"l": "Joh 17:3", "n": "", "vs": [[3, "والحياة الأبدية هي أن يعرفوك أنت الإله الحق وحدك، والذي أرسلته: يسوع المسيح."]]}], "kwAr": "الحياة الأبدية", "noteAr": ""}, {"kw": "which was", "raw": "Pro_8:22-30; Joh_1:1, Joh_1:2, Joh_1:18, Joh_3:13, Joh_7:29, Joh_8:38, Joh_16:28, Joh_17:5; Rom_8:3; Gal_4:4", "note": "", "refs": [{"l": "Pro 8:22-30", "n": "", "vs": [[22, "اقتناني الرب منذ بدء خلقه، من قبل الشروع في أعماله القديمة."], [23, "منذ الأزل أنا هو، منذ البدء قبل أن توجد الأرض."], [24, "ولدت من قبل أن تتكون اللجج والينابيع الغزيرة المياه."], [25, "ولدت من قبل أن تقررت الجبال والتلال."], [26, "إذ لم يكن قد خلق الأرض بعد، ولا البراري ولا بداية أتربة المسكونة."], [27, "وعندما ثبت الرب السماء، وحين رسم دائرة الأفق حول وجه الغمر، كنت هناك."], [28, "عندما ثبت السحب في العلاء، ورسخ ينابيع اللجج."], [29, "عندما قرر للبحر تخوما لا تتجاوزها مياهه متعدية على أمر الرب، وحين رسم أسس الأرض،"], [30, "كنت عنده صانعا مبدعا، وكنت كل يوم لذته، أفيض بهجة دائما أمامه."]]}, {"l": "Joh 1:1", "n": "", "vs": [[1, "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."]]}, {"l": "Joh 1:2", "n": "", "vs": [[2, "هو كان في البدء عند الله."]]}, {"l": "Joh 1:18", "n": "", "vs": [[18, "ما من أحد رأى الله قط. ولكن الابن الوحيد، الذي في حضن الآب، هو الذي كشف عنه."]]}, {"l": "Joh 3:13", "n": "", "vs": [[13, "وما صعد أحد إلى السماء إلا الذي نزل من السماء، وهو ابن الإنسان الذي هو في السماء."]]}, {"l": "Joh 7:29", "n": "", "vs": [[29, "أما أنا فأعرفه، لأني منه وهو الذي أرسلني»."]]}, {"l": "Joh 8:38", "n": "", "vs": [[38, "إني أتكلم بما رأيته عند الآب، وأنتم تعملون بما سمعتم من أبيكم»."]]}, {"l": "Joh 16:28", "n": "", "vs": [[28, "خرجت من عند الآب، وأتيت إلى العالم. وها أنا أترك العالم وأعود إلى الآب»."]]}, {"l": "Joh 17:5", "n": "", "vs": [[5, "فمجدني في حضرتك الآن، أيها الآب، بما كان لي من مجد عندك قبل تكوين العالم."]]}, {"l": "Rom 8:3", "n": "", "vs": [[3, "فإن ما عجزت الشريعة عنه، لكون الجسد قد جعلها قاصرة عن تحقيقه، أتمه الله إذ أرسل ابنه، متخذا ما يشبه جسد الخطيئة ومكفرا عن الخطيئة فدان الخطيئة في الجسد"]]}, {"l": "Gal 4:4", "n": "", "vs": [[4, "ولكن لما جاء تمام الزمان، أرسل الله ابنه، وقد ولد من امرأة وكان خاضعا للشريعة،"]]}], "kwAr": "التي كانت عند الآب", "noteAr": ""}], "arS": [["فإن «", []], ["الحياة", ["G2222"]], ["» ", []], ["تجلت", ["G5319"]], [" أمامنا. وبعدما ", []], ["رأيناها", ["G3708"]], [" فعلا، ", []], ["نشهد", ["G3140"]], [" لها الآن. وها نحن ", []], ["ننقل", ["G518"]], [" إليكم خبر هذه ", []], ["الحياة", ["G2222"]], [" ", []], ["الأبدية", ["G166"]], [" التي كانت عند ", []], ["الآب", ["G3962"]], [" ثم ", []], ["تجلت", ["G5319"]], [" أمامنا!", []]]}, {"c": 1, "v": 3, "text": "فنحن، إذن، نخبركم بما رأيناه وسمعناه، لكي تكونوا شركاءنا. كما أن شركتنا هي مع الآب ومع ابنه يسوع المسيح.", "groups": [{"kw": "which", "raw": "1Jo_1:1; Act_4:20", "note": "", "refs": [{"l": "1Jo 1:1", "n": "", "vs": [[1, "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."]]}, {"l": "Act 4:20", "n": "", "vs": [[20, "لا نستطيع أن نكف عن التحدث بما رأينا وسمعنا»."]]}], "kwAr": "بما رأيناه وسمعناه", "noteAr": ""}, {"kw": "declare", "raw وع وبفضل الإنجيل"]]}, {"l": "Phi 1:7", "n": "", "vs": [[7, "كما أن من الحق أن يكون لي هذا الشعور تجاهكم جميعا، لأني أحتفظ بكم في قلبي، لكونكم جميعا شركاء لي في النعمة، سواء أكان في قيودي أم في الدفاع عن الإنجيل وتثبيته."]]}, {"l": "Phi 2:1", "n": "", "vs": [[1, "فما دام لنا التشجيع في المسيح، والتعزية في المحبة، والشركة في الروح، ولنا المراحم والحنو،"]]}, {"l": "1Ti 6:2", "n": "", "vs": [[2, "وعلى الذين لهم سادة مؤمنون أن لا يستخفوا بهم لأنهم إخوة لهم، بل بالأحرى أن يخدموهم بخضوع، لأن المستفيدين من خدمتهم الصالحة هم مؤمنون محبوبون."]]}, {"l": "Heb 3:1", "n": "", "vs": [[1, "إذن، أيها الإخوة القديسون الذين اشتركتم في الدعوة السماوية، تأملوا يسوع: الرسول ورئيس الكهنة في الإيمان الذي نتمسك به."]]}, {"l": "1Pe 5:1", "n": "*Gr.", "vs": [[1, "وهذه وصيتي إلى الشيوخ الذين بينكم، بصفتي شيخا رفيقا لهم، وشاهدا لآلام المسيح، وشريكا في المجد الذي سيتجلى:"]]}], "kwAr": "لكي تكونوا شركاءنا", "noteAr": ""}, {"kw": "our fellowship", "raw": "1Jo_1:7, 1Jo_2:23, 1Jo_2:24; Joh_14:20-23, Joh_17:3, Joh_17:11, Joh_17:21; 1Co_1:9, 1Co_1:30; 2Co_13:14; Phi_2:1, Phi_3:10; Heb_3:14", "note": "", "refs": [{"l": "1Jo 1:7", "n": "", "vs": [[7, "ولكن، إن كنا فعلا نعيش في النور، كما هو في النور، تكون لنا حقا شركة بعضنا مع بعض، ودم ابنه يسوع يطهرنا من كل خطيئة."]]}, {"l": "1Jo 2:23", "n": "", "vs": [[23, "وكل من ينكر الابن، لا يكون الآب أيضا من نصيبه. ومن يعترف بالابن، فله الآب أيضا."]]}, {"l": "1Jo 2:24", "n": "", "vs": [[24, "أما أنتم، فالكلام الذي سمعتموه منذ البداية، فليكن راسخا فيكم. فحين يترسخ ذلك الكلام في داخلكم، تتوطد صلتكم بالابن، وبالآب."]]}, {"l": "Joh 14:20-23", "n": "", "vs": [[20, "في ذلك اليوم تعلمون أني أنا في أبي، وأنتم في، وأنا فيكم."], [21, "من كانت عنده وصاياي، ويعمل بها، فذاك يحبني. والذي يحبني، يحبه أبي، وأنا أحبه وأعلن له ذاتي»."], [22, "فسأله يهوذا، غير الإسخريوطي: «ياسيد، ماذا جرى حتى تعلن لنا ذاتك ولا تعلنها للعالم؟»"], [23, "أجابه يسوع: «من يحبني يعمل بكلمتي، ويحبه أبي، وإليه نأتي، وعنده نجعل لنا منزلا."]]}, {"l": "Joh 17:3", "n": "", "vs": [[3, "والحياة الأبدية هي أن يعر
