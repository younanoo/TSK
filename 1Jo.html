 "وربما قال أحدكم: «أنت لك إيمان وأنا لي أعمال». أرني كيف يكون إيمانك من غير أعمال، وأنا أريك كيف يكون إيماني بأعمالي."]]}, {"l": "Rev 3:17", "n": "", "vs": [[17, "تقول: أنا غني، قد اغتنيت ولا يعوزني شيء! ولكنك لا تعلم أنك شقي بائس فقير أعمى عريا ن."]]}, {"l": "Rev 3:18", "n": "", "vs": [[18, "نصيحتي لك أن تشتري مني ذهبا نقيا، صفته النار، فتغتني حقا، وثيابا بيضاء ترتديها فتستر عريك المعيب، وكحلا لشفاء عينيك فيعود إليك البصر."]]}], "kwAr": "فإن كنا ندعي", "noteAr": ""}, {"kw": "fellowship", "raw": "1Jo_1:3; Psa_5:4-6, Psa_94:20; 2Co_6:14-16", "note": "", "refs": [{"l": "1Jo 1:3", "n": "", "vs": [[3, "فنحن، إذن، نخبركم بما رأيناه وسمعناه، لكي تكونوا شركاءنا. كما أن شركتنا هي مع الآب ومع ابنه يسوع المسيح."]]}, {"l": "Psa 5:4-6", "n": "", "vs": [[4, "فإنك إله لا يسر بالشر. وليس للشرير أن يقيم في حضرتك."], [5, "لا يمثل المتغطرسون أمامك، فإنك تبغض جميع فاعلي الإثم،"], [6, "وتهلك الناطقين بالكذب، لأنك تمقت سافك الدماء والماكر"]]}, {"l": "Psa 94:20", "n": "", "vs": [[20, "أيحالفك ملك الشر المختلق إثما ليجعل الظلم شريعة للقضاء؟"]]}, {"l": "2Co 6:14-16", "n": "", "vs": [[14, "لا تدخلوا مع غير المؤمنين تحت نير واحد. فأي ارتباط بين البر والإثم؟ وأية شركة بين النور والظلام؟"], [15, "وأي تحالف للمسيح مع إبليس؟ وأي نصيب للمؤمن مع غير المؤمن؟"], [16, "وأي وفاق لهيكل الله مع الأصنام؟ فإننا نحن هيكل الله الحي، وفقا لما قاله الله : «سأسكن في وسطهم، وأسير بينهم، وأكون إلههم وهم يكونون شعبا لي…"]]}], "kwAr": "شركة معه", "noteAr": ""}, {"kw": "walk", "raw": "1Jo_2:9-11; Psa_82:5; Pro_2:13, Pro_4:18, Pro_4:19; Joh_3:19, Joh_3:20, Joh_11:10, Joh_12:35, Joh_12:46", "note": "", "refs": [{"l": "1Jo 2:9-11", "n": "", "vs": [[9, "من ادعى أنه يحيا في النور، ولكنه يبغض أحد إخوته، فهو مازال حتى الآن في الظلام."], [10, "فالذي يحب إخوته، هو الذي يحيا في النور فعلا ولا شيء يسقطه."], [11, "أما الذي يبغض أحد إخوته، فهو تائه في الظلام، يتلمس طريقه ولا يعرف أين يتجه، لأن الظلام قد أعمى عينيه!"]]}, {"l": "Psa 82:5", "n": "", "vs": [[5, "هم من غير معرفة وفهم، يتمشون في الظلمة وتتزعزع أسس الأرض من كثرة الجور."]]}, {"l": "Pro 2:13", "n": "", "vs": [[13, "من الذين يبتعدون عن سواء السبيل ويسلكون في طرق الظلمة،"]]}, {"l": "Pro 4:18", "n": "", "vs": [[18, "أما سبيل الأبرار فكنور متلأليء يتزايد إشراقه إلى أن يكتمل النهار،"]]}, {"l": "Pro 4:19", "n": "", "vs": [[19, "وطريق الأشرار كالظلمة الداجية لا يدركون ما يعثرون به."]]}, {"l": "Joh 3:19", "n": "", "vs": [[19, "وهذا هو الحكم: إن النور قد جاء إلى العالم، ولكن الناس أحبوا الظلمة أكثر من النور، لأن أعمالهم كانت شريرة."]]}, {"l": "Joh 3:20", "n": "", "vs": [[20, "فكل من يعمل الشر يبغض النور، ولا يأتي إليه مخافة أن تفضح أعماله."]]}, {"l": "Joh 11:10", "n": "", "vs": [[10, "أما الذي يمشي في الليل فإنه يتعثر، لأن النور ليس فيه»."]]}, {"l": "Joh 12:35", "n": "", "vs": [[35, "فقال لهم يسوع: «النور باق معكم وقتا قصيرا. فواصلوا سيركم مادام النور يشرق عليكم، لئلا يطبق عليكم الظلام، فإن الذي يمشي في الظلام لا يعلم أين يذهب."]]}, {"l": "Joh 12:46", "n": "", "vs": [[46, "جئت إلى العالم نورا، فمن آمن بي لا يبقى في الظلام."]]}], "kwAr": "نعيش في الظلام", "noteAr": ""}, {"kw": "we lie", "raw": "1Jo_1:10, 1Jo_4:20; Joh_8:44, Joh_8:45; 1Ti_4:2", "note": "", "refs": [{"l": "1Jo 1:10", "n": "", "vs": [[10, "فإن كنا ندعي أننا لم نرتكب خطيئة، نجعل الله كاذبا، ولا تكون كلمته في داخلنا!"]]}, {"l": "1Jo 4:20", "n": "", "vs": [[20, "فإن قال أحد: «أنا أحب الله !» ولكنه يبغض أخا له، فهو كاذب، لأنه إن كان لا يحب أخاه الذي يراه، فكيف يقدر أن يحب الله الذي لم يره قط؟"]]}, {"l": "Joh 8:44", "n": "", "vs": [[44, "إنكم أولاد أبيكم إبليس، وترغبون أن تعملوا شهوات أبيكم. فهو من البدء كان قاتلا للناس، ولم يثبت في الحق لأنه خال من الحق! وعندما ينطق بالكذب فهو ينضح بما فيه، لأنه كذاب وأبو الكذب!"]]}, {"l": "Joh 8:45", "n": "", "vs": [[45, "أما أنا فلأني أقول الحق، لستم تصدقونني."]]}, {"l": "1Ti 4:2", "n": "", "vs": [[2, "في موجة رياء ينشرها معلمون دجالون لهم ضمائر كويت بالنار."]]}], "kwAr": "نكون كاذبين", "noteAr": ""}, {"kw": "do not", "raw": "Joh_3:21", "note": "", "refs": [{"l": "Joh 3:21", "n": "", "vs": [[21, "وأما الذي يسلك في الحق فيأتي إلى النور لتظهر أعماله ويتبين أنها عملت بقوة الله»."]]}], "kwAr": "لا نمارس الحق", "noteAr": ""}], "arS": [["فإن كنا ", []], ["ندعي", ["G2036"]], [" أن لنا ", []], ["شركة", ["G2842"]], [" معه، ونحن ", []], ["نعيش", ["G4043"]], [" في ", []], ["الظلام", ["G4655"]], ["، نكون ", []], ["كاذبين", ["G5574"]], [" ولا ", []], ["نمارس", ["G4160"]], [" ", []], ["الحق", ["G225"]], [".", []]]}, {"c": 1, "v": 7, "text": "ولكن، إن كنا فعلا نعيش في النور، كما هو في النور، تكون لنا حقا شركة بعضنا مع بعض، ودم ابنه يسوع يطهرنا من كل خطيئة.", "groups": [{"kw": "If we", "raw": "1Jo_2:9, 1Jo_2:10; Psa_56:13, Psa_89:15, Psa_97:11; Isa_2:5; Joh_12:35; Rom_13:12; Eph_5:8; 2Jo_1:4; 3Jo_1:4", "note": "", "refs": [{"l": "1Jo 2:9", "n": "", "vs": [[9, "من ادعى أنه يحيا في النور، ولكنه يبغض أحد إخوته، فهو مازال حتى الآن في الظلام."]]}, {"l": "1Jo 2:10", "n": "", "vs": [[10, "فالذي يحب إخوته، هو الذي يحيا في النور فعلا ولا شيء يسقطه."]]}, {"l": "Psa 56:13", "n": "", "vs": [[13, "لأنك أنقذت نفسي من الموت، وحفظت رجلي من الزلق، لكي أسلك أمام الله في نور الحياة."]]}, {"l": "Psa 89:15", "n": "", "vs": [[15, "طوبى للشعب الذي يستجيب لهتاف البوق فيسلك في نور محياك أيها الرب."]]}, {"l": "Psa 97:11", "n": "", "vs": [[11, "قد زرع نور للصديق وفرح للمستقيمي القلب."]]}, {"l": "Isa 2:5", "n": "", "vs": [[5, "يابيت يعقوب، هيا لنسلك في نور الرب."]]}, {"l": "Joh 12:35", "n": "", "vs": [[35, "فقال لهم يسوع: «النور باق معكم وقتا قصيرا. فواصلوا سيركم مادام النور يشرق عليكم، لئلا يطبق عليكم الظلام، فإن الذي يمشي في الظلام لا يعلم أين يذهب."]]}, {"l": "Rom 13:12", "n": "", "vs": [[12, "كاد الليل أن ينتهي والنهار أن يطلع. فلنطرح أعمال الظلام، ونلبس سلاح النور"]]}, {"l": "Eph 5:8", "n": "", "vs": [[8, "فقد كنتم في الماضي ظلاما، ولكنكم الآن نور في الرب. فاسلكوا سلوك أولاد النور."]]}, {"l": "2Jo 1:4", "n": "", "vs": [[4, "فرحت جدا حين وجدت بعض أولادك يسلكون بحسب الحق، وفقا لما أوصانا به الآب."]]}, {"l": "3Jo 1:4", "n": "", "vs": [[4, "وما أعظم الفرح الذي يغمر قلبي حين أسمع الأخبار الطيبة التي تؤكد أن أولادي يسلكون بحسب الحق!"]]}], "kwAr": "إن كنا فعلا نعيش في النور", "noteAr": ""}, {"kw": "as", "raw": "1Jo_1:5; Psa_104:2; 1Ti_6:16; Jam_1:17", "note": "", "refs": [{"l": "1Jo 1:5", "n": "", "vs": [[5, "وهذا هو الخبر الذي سمعناه من المسيح ونعلنه لكم: إن الله نور، وليس فيه ظلام البتة."]]}, {"l": "Psa 104:2", "n": "", "vs": [[2, "أنت اللابس النور كثوب، والباسط السماوات كخيمة."]]}, {"l": "1Ti 6:16", "n": "", "vs": [[16, "الذي وحده لا فناء له، الساكن في نور لا يدنى منه، الذي لم يره أي إنسان ولا يقدر أن يراه. له الكرامة والقدرة الأبدية. آمين!"]]}, {"l": "Jam 1:17", "n": "", "vs": [[17, "إن كل عطية صالحة وهبة كاملة إنما تنزل من فوق، من لدن أبي الأنوار الذي ليس فيه تحول، ولا ظل لأنه لا يدور."]]}], "kwAr": "كما هو في النور", "noteAr": ""}, {"kw": "we have", "raw": "1Jo_1:3; Amo_3:3", "note": "", "refs": [{"l": "1Jo 1:3", "n": "", "vs": [[3, "فنحن، إذن، نخبركم بما رأيناه وسمعناه، لكي تكونوا شركاءنا. كما أن شركتنا هي مع الآب ومع ابنه يسوع المسيح."]]}, {"l": "Amo 3:3", "n": "", "vs": [[3, "هل يترافق اثنان معا ما لم يكونا على موعد؟"]]}], "kwAr": "تكون لنا حقا شركة", "noteAr": ""}, {"kw": "and the", "raw": "1Jo_2:1, 1Jo_2:2, 1Jo_5:6, 1Jo_5:8; Zec_13:1; Joh_1:29; 1Co_6:11; Eph_1:7; Heb_9:14; 1Pe_1:19; Rev_1:5, Rev_7:14", "note": "", "refs": [{"l": "1Jo 2:1", "n": "", "vs": [[1, "ياأولادي الصغار، أكتب إليكم هذه الأمور لكي لا تخطئوا. ولكن، إن أخطأ أحدكم، فلنا عند الآب شفيع هو يسوع المسيح البار."]]}, {"l": "1Jo 2:2", "n": "", "vs": [[2, "فهو كفارة لخطايانا، لا لخطايانا فقط، بل لخطايا العالم كله."]]}, {"l": "1Jo 5:6", "n": "", "vs": [[6, "فيسوع المسيح وحده جاءنا بالماء والدم. لا بالماء فقط، بل بالماء والدم معا. هذه الحقيقة، يشهد لها الروح القدس: لأنه هو الحق ذاته."]]}, {"l": "1Jo 5:8", "n": "", "vs": [[8, "والذين يشهدون في الأرض هم ثلاثة: الروح، والماء، والدم. وهؤلاء الثلاثة هم في الواحد."]]}, {"l": "Zec 13:1", "n": "", "vs": [[1, "»في ذلك اليوم يتفجر ينبوع ليطهر ذرية داود وسكان أورشليم من إثمهم ونجاستهم."]]}, {"l": "Joh 1:29", "n": "", "vs": [[29, "وفي اليوم التالي رأى يوحنا يسوع آتيا نحوه، فهتف قائلا: «هذا هو حمل الله الذي يزيل خطيئة العالم."]]}, {"l": "1Co 6:11", "n": "", "vs": [[11, "وهكذا كان بعضكم، إلا أنكم قد اغتسلتم، بل تقدستم، بل تبررتم، باسم الرب يسوع المسيح وبروح إلهنا."]]}, {"l": "Eph 1:7", "n": "", "vs": [[7, "ففيه لنا بدمه الفداء، أي غفران الخطايا؛ بحسب غنى نعمته"]]}, {"l": "Heb 9:14", "n": "", "vs": [[14, "فكم بالأحرى دم المسيح الذي قدم نفسه لله بروح أزلي ذبيحة لا عيب فيها، يطهر ضمائرنا من الأعمال الميتة لنعبد الله الحي."]]}, {"l": "1Pe 1:19", "n": "", "vs": [[19, "بل كانت دما ثمينا، دم المسيح، ذلك الحمل الطاهر الذي ليس فيه عيب ولا دنس!"]]}, {"l": "Rev 1:5", "n": "", "vs": [[5, "ومن يسوع المسيح الشاهد الأمين، بكر القائمين من بين الأموات، ملك ملوك الأرض، ذاك الذي بدافع محبته لنا مات لأجلنا فغسلنا بدمه من خطايانا،"]]}, {"l": "Rev 7:14", "n": "", "vs": [[14, "فأجبته: «أنت أعلم ياسيدي!» فقال: «هؤلاء هم الذين أتوا من الضيقة العظيمة، وقد غسلوا ثيابهم وبيضوها بدم الحمل."]]}], "kwAr": "ودم ابنه يسوع يطهرنا", "noteAr": ""}], "arS": [["ولكن، إن كنا فعلا ", []], ["نعيش", ["G4043"]], [" في ", []], ["النور", ["G5457"]], ["، كما هو في ", []], ["النور", ["G5457"]], ["، تكون لنا حقا ", []], ["شركة", ["G2842"]], [" ", []], ["بعضنا مع بعض", ["G240", "G3326"]], ["، ", []], ["ودم", ["G129"]], [" ", []], ["ابنه", ["G5207"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["يطهرنا", ["G2511"]], [" من ", []], ["كل", ["G3956"]], [" ", []], ["خطيئة", ["G266"]], [".", []]]}, {"c": 1, "v": 8, "text": "إن كنا ندعي أن لا خطيئة لنا، نخدع أنفسنا، ولا يكون الحق في داخلنا.", "groups": [{"kw": "say", "raw": "1Jo_1:6, 1Jo_1:10, 1Jo_3:5, 1Jo_3:6; 1Ki_8:46; 2Ch_6:36; Job_9:2, Job_14:4, Job_15:14, Job_25:4; Psa_143:2; Pro_20:9; Ecc_7:20; Isa_53:6, Isa_64:6; Jer_2:22, Jer_2:23; Rom_3:23; Jam_3:2", "note": "", "refs": [{"l": "1Jo 1:6", "n": "", "vs": [[6, "فإن كنا ندعي أن لنا شركة معه، ونحن نعيش في الظلام، نكون كاذبين ولا نمارس الحق."]]}, {"l": "1Jo 1:10", "n": "", "vs": [[10, "فإن كنا ندعي أننا لم نرتكب خطيئة، نجعل الله كاذبا، ولا تكون كلمته في داخلنا!"]]}, {"l": "1Jo 3:5", "n": "", "vs": [[5, "وأنتم تعرفون أن المسيح جاء إلى هذه الأرض لكي يحمل الخطايا، مع كونه بلا خطيئة."]]}, {"l": "1Jo 3:6", "n": "", "vs": [[6, "فكل من يثبت فيه، لا يمارس الخطيئة. أما الذين يمارسون الخطيئة، فهم لم يروه ولم يتعرفوا به قط."]]}, {"l": "1Ki 8:46", "n": "", "vs": [[46, "وإذا أخطأوا إليك، إذ ليس إنسان لا يأثم، وغضبت عليهم وأسلمتهم للعدو فسباهم آسروهم إلى ديار العدو، بعيدة أو قريبة."]]}, {"l": "2Ch 6:36", "n": "", "vs": [[36, "وإذا أخطأوا إليك، إذ ليس إنسان لا يأثم، وغضبت عليهم وأسلمتهم للعدو، فسباهم آسروهم إلى ديارهم، بعيدة كانت أم قريبة،"]]}, {"l": "Job 9:2", "n": "", "vs": [[2, "«قد علمت يقينا أن الأمر كذلك، ولكن كيف يتبرر الإنسان أمام الله؟"]]}, {"l": "Job 14:4", "n": "", "vs": [[4, "من يستولد الطاهر من النجس؟ لا أحد!"]]}, {"l": "Job 15:14", "n": "", "vs": [[14, "من هو الإنسان حتى يزكو أو مولود المرأة حتى يتبرر؟"]]}, {"l": "Job 25:4", "n": "", "vs": [[4, "فكيف يتبرر الإنسان عند الله، وكيف يزكو مولود المرأة؟"]]}, {"l": "Psa 143:2", "n": "", "vs": [[2, "لا تحاكم عبدك، فلن يتبرر أمامك إنسان."]]}, {"l": "Pro 20:9", "n": "", "vs": [[9, "من يدعي قائلا: إني نقيت قلبي، وتطهرت من خطيئتي؟"]]}, {"l": "Ecc 7:20", "n": "", "vs": [[20, "ليس من صديق على وجه الأرض يصنع خيرا ولا يخطيء."]]}, {"l": "Isa 53:6", "n": "", "vs": [[6, "كلنا كغنم شردنا ملنا كل واحد إلى سبيله، فأثقل الرب كاهله بإثم جميعنا."]]}, {"l": "Isa 64:6", "n": "", "vs": [[6, "كلنا أصبحنا كنجس، وأضحت جميع أعمال برنا كثوب قذر، فذبلنا كأوراق الشجر وعبثت بنا آثامنا كالريح."]]}, {"l": "Jer 2:22", "n": "", "vs": [[22, "وإن اغتسلت بالنطرون، وأكثرت من استعمال الإشنان (الصابون)، فإن لطخة إثمك تظل ماثلة أمامي."]]}, {"l": "Jer 2:23", "n": "", "vs": [[23, "كيف تقولين: لم أتدنس ولم أذهب وراء البعل؟ تأملي في طريقك في وادي هنوم، واعرفي ما ارتكبت أيتها الناقة الجامحة الهائمة في طرقها بحثا عن جمل."]]}, {"l": "Rom 3:23", "n": "", "vs": [[23, "لأن الجميع قد أخطأوا وهم عاجزون عن بلوغ ما يمجد الله ."]]}, {"l": "Jam 3:2", "n": "", "vs": [[2, "فإننا جميعا معرضون للوقوع في أخطاء كثيرة. ولكن من يلجم لسانه ولا يخطيء في كلامه هو ناضج يقدر أن يسيطر على طبيعته سيطرة تامة."]]}], "kwAr": "ندعي أن لا خطيئة لنا", "noteAr": ""}, {"kw": "we deceive", "raw": "1Co_3:18; Gal_6:3; 2Ti_3:13; Jam_1:22, Jam_1:26; 2Pe_2:13", "note": "", "refs": [{"l": "1Co 3:18", "n": "", "vs": [[18, "حذار أن يخدع أحد منكم نفسه! إن ظن أحد بينكم نفسه حكيما في هذا العالم، فليصر جاهلا ليصير حكيما حقا."]]}, {"l": "Gal 6:3", "n": "", "vs": [[3, "فإن ظن أحد أنه شيء، وهو في الواقع لا شيء، فإنما يخدع نفسه."]]}, {"l": "2Ti 3:13", "n": "", "vs": [[13, "أما الناس الأشرار والدجالون المحتالون، فيتقدمون في الشر، مضللين الآخرين وهم أنفسهم مضللون!"]]}, {"l": "Jam 1:22", "n": "", "vs": [[22, "لا تكتفوا فقط بسماعها، بل اعملوا بها، وإلا كنتم تغشون أنفسكم."]]}, {"l": "Jam 1:26", "n": "", "vs": [[26, "وإن ظن أحد أنه متدين، وهو لا يلجم لسانه، فإنه يغش قلبه، وديانته غير نافعة!"]]}, {"l": "2Pe 2:13", "n": "", "vs": [[13, "وبذلك ينالون أجرة إثمهم! إنهم يحسبون الانغماس في اللذات طول النهار بهجة عظيمة. فهم أوساخ وعيوب: يتلذذون بالنجاسة ويحاولون خداعكم، فيشتركون معكم في الولائم."]]}], "kwAr": "نخدع أنفسنا", "noteAr": ""}, {"kw": "the truth", "raw": "1Jo_2:4; 1Ti_6:5; 2Jo_1:2; 3Jo_1:3", "note": "", "refs": [{"l": "1Jo 2:4", "n": "", "vs": [[4, "فالذي يدعي أنه قد عرفه، ولكنه لا يعمل بوصاياه، يكون كاذبا ولا يكون الحق في داخله."]]}, {"l": "1Ti 6:5", "n": "", "vs": [[5, "وشتى أنواع النزاع بين أناس فاسدي العقول مجردين من الحق، يعتبرون التقوى تجارة."]]}, {"l": "2Jo 1:2", "n": "", "vs": [[2, "بما أن الحق ثابت في قلوبنا، ولابد أن يرافقنا إلى الأبد،"]]}, {"l": "3Jo 1:3", "n": "", "vs": [[3, "فكم كان فرحي عظيما عندما مر بي بعض الإخوة المسافرين وأخبروني أنك تسلك بحسب الحق، وشهدوا للحق الثابت فيك!"]]}], "kwAr": "الحق", "noteAr": ""}], "arS": [["إن كنا ", []], ["ندعي", ["G2036"]], [" أن لا ", []], ["خطيئة", ["G266"]], [" لنا، ", []], ["نخدع", ["G4105"]], [" ", []], ["أنفسنا", ["G1438"]], ["، ولا يكون ", []], ["الحق", ["G225"]], [" في داخلنا.", []]]}, {"c": 1, "v": 9, "text": "ولكن، إن اعترفنا لله بخطايانا، فهو جدير بالثقة وعادل، يغفر لنا خطايانا ويطهرنا من كل إثم.", "groups": [{"kw": "we confess", "raw": "Lev_26:40-42; 1Ki_8:47; 2Ch_6:37, 2Ch_6:38; Neh_1:6, 9:2-37; Job_33:27, Job_33:28; Psa_32:5, Psa_51:2-5; Pro_28:13; Dan. 9:4-20; Mat_3:6; Mar_1:5; Act_19:18", "note": "", "refs": [{"l": "Lev 26:40-42", "n": "", "vs": [[40, "ولكن إن اعترفوا بخطاياهم وخطايا آبائهم وبخيانتهم لي وعداوتهم،"], [41, "التي جعلتني أنقلب عليهم وأنفيهم إلى أرض أعدائهم، وإن خضعت قلوبهم النجسة بعد أن استوفوا عقاب خطاياهم،"], [42, "فإني أذكر ميثاقي مع يعقوب، وميثاقي مع إسحق، وميثاقي مع إبراهيم، وأذكر الأرض،"]]}, {"l": "1Ki 8:47", "n": "", "vs": [[47, "فإن تابوا في أرض سبيهم ورجعوا متضرعين إليك قائلين: قد أخطأنا وانحرفنا وأذنبنا،"]]}, {"l": "2Ch 6:37", "n": "", "vs": [[37, "فإن تابوا في أرض سبيهم، ورجعوا متضرعين إليك قائلين: قد أخطأنا وانحرفنا وأذنبنا،"]]}, {"l": "2Ch 6:38", "n": "", "vs": [[38, "وتابوا حقا من كل قلوبهم وأنفسهم وهم في ديار آسريهم، وصلوا إليك متوجهين نحو أرضهم التي وهبتها لآبائهم، نحو المدينة التي اخترتها والهيكل الذي بنيته لاسمك،"]]}, {"l": "Neh 1:6", "n": "", "vs": [[6, "أرهف أذنيك وافتح عينيك لتسمع صلاة عبدك الذي يبتهل إليك الآن نهارا وليلا، لأجل بني إسرائيل عبيدك، ويعترف بآثامهم التي ارتكبناها، نحن الإسرائيليين، بحقك، ومن جملتهم أنا وبيت أبي، إذ قد أخطأنا إليك."]]}, {"l": "Neh 9:2-37", "n": "", "vs": [[2, "وعزل الإسرائيليون أنفسهم عن الغرباء، ووقفوا معترفين بخطاياهم وخطايا آبائهم،"], [3, "ومكثوا في أماكنهم حيث تلي عليهم من سفر شريعة الرب إلههم ربع النهار، وحمدوا وسجدوا له في الربع الأخير."], [4, "ووقف يشوع وباني وقدميئيل وشبنيا وبني وشربيا وباني وكناني على درج اللاويين، وهتفوا بصوت عظيم إلى الرب إلههم."], [5, "ونادى اللاويون: يشوع وقدميئيل وباني وحشبنيا وشربيا وهوديا وشبنيا وفتحيا قائلين: «قوموا وباركوا الرب إلهكم من الأزل إلى الأبد، وليتبارك اسمك المجيد المتعالي فوق كل بركة وتسبيح."], [6, "أنت وحدك هو الرب. أنت صانع السماوات وسماء السماوات، وكل كواكبها، والأرض وجميع ما عليها، والبحار وكل ما فيها. أنت تحييها، وكل جند السماء يسجدون لك."], [7, "أنت هو الرب الإله الذي اخترت أبرام وأخرجته من أور الكلدانيين ودعوته إبراهيم،"], [8, "وقد وجدت قلبه خالص الولاء لك، فقطعت له عهدا أن تهبه أرض الكنعانيين والحثيين والأموريين والفرزيين واليبوسيين والجرجاشيين فيرثها نسله. وقد حققت وعدك لأنك صادق."], [9, "أنت رأيت مذلة آبائنا في مصر واستجبت إلى صراخهم عند البحر الأحمر،"], [10, "فأجريت عجائب وآيات على فرعون وعلى سائر رجاله وعلى شعب أرضه كله، لأنك علمت أنهم تجبروا عليهم، فأشهرت بهذه العجائب اسمك إلى هذا اليوم،"], [11, "إذ فلقت البحر أمام آبائنا، فاجتازوا في وسطه على اليابسة، وطرحت مطارديهم في الأعماق كما يطرح حجر في مياه هائجة،"], [12, "وهديتهم بعمود سحاب نهارا، وبعمود نار ليلا، لتضيء لهم طريقهم التي هم فيها سالكون،"], [13, "ونزلت على جبل سيناء وخاطبتهم من السماء، وأعطيتهم أحكاما مستقيمة وشرائع صادقة وفرائض ووصايا صالحة،"], [14, "ولقنتهم حفظ سبتك المقدس، وأمرتهم بممارسة وصايا وفرائض وشرائع على لسان موسى عبدك،"], [15, "وأشبعت جوعهم بخبز من السماء، وفجرت لهم ماء من الصخرة إرواء لعطشهم، وأمرتهم أن يدخلوا ويرثوا الأرض التي أقسمت أن تهبها لهم."], [16, "ولكن أسلافنا وآباءنا طغوا وقسوا قلوبهم ولم يطيعوا وصاياك،"], [17, "وأبوا أن يسمعوا، وتجاهلوا عجائبك التي أجريتها لهم، وأغلظوا قلوبهم، ثم تمردوا ونصبوا عليهم قائدا ليرجعوا إلى عبوديتهم، ولكنك إله غفور وحنان ورحيم وحكيم وكثير الإحسان، فلم تتخل عنهم،"], [18, "مع أنهم سبكوا لأنفسهم عجلا وقالوا: «هذا هو إلهكم الذي أخرجكم من مصر!» فاقترفوا بذلك إثما عظيما."], [19, "فأنت بفائق رحمتك لم تنبذهم في الصحراء، ولم يفارقهم عمود السحاب الذي هداهم في الطريق نهارا، ولا عمود النار الذي أضاء لهم مسالكهم التي يسيرون فيها ليلا."], [20, "وأنعمت عليهم بروحك الصالح ليلقنهم، ولم تمنع منك عن أفواههم، ووفرت لهم ماء لإرواء عطشهم."], [21, "وعلتهم طوال أربعين سنة في الصحراء، فلم يعوزهم شيء، ولم تبل ثيابهم ولا تورمت أقدامهم،"], [22, "ووهبت لهم ممالك وأمما، ووزعت عليهم أنصبة في أقصى البلاد فامتلكوا بلاد سيحون وأرض ملك حشبون وديار عوج ملك باشان،"], [23, "وأكثرت نسلهم فصاروا كنجوم السماء عددا، وأتيت بهم إلى الأرض التي وعدت آباءهم أن يدخلوها ويرثوها،"], [24, "فاستولى عليها الأبناء وورثوا الأرض بعد أن أخضعت لهم سكانها الكنعانيين، وأسلمتهم لهم مع ملوكهم وأمم البلاد ليصنعوا بهم حسب ما يطيب لهم."], [25, "فتملكوا مدنا حصينة وأرضا خصيبة، وورثوا بيوتا تفيض خيرا، وآبارا محفورة، وكروما وزيتونا وأشجارا مثمرة كثيرة، فأكلوا وشبعوا وسمنوا وتمتعوا بخيرك العميم."], [26, "ومع ذلك ثاروا عليك وتمردوا وطرحوا شريعتك خلف ظهورهم، وقتلوا أنبياءك الذين حذروهم وأنذروهم ليرتدوا إليك، وارتكبوا الشرور الفواحش."], [27, "عندئذ أسلمتهم لمضايقيهم، فساموهم سوء العذاب. وفي ضيقهم استغاثوا بك، فاستجبت من السماء. وبفضل مراحمك الغزيرة بعثت من أنقذهم من يد مضايقيهم."], [28, "ولكن ما إن استقر لهم الأمر حتى رجعوا يرتكبون الشر أمامك، فأسلمتهم إلى أعدائهم الذين تسلطوا عليهم، فعادوا يستغيثون بك، فاستمعت إليهم من السماء وأنقذتهم بفضل مراحمك الوفيرة، أحيانا كثيرة"], [29, "وأنذرتهم لتردهم إلى شريعتك. غير أنهم طغوا وتمردوا على وصاياك وأخطأوا ضد أحكامك، التي إن مارسها إنسان يحيا بها، واعتصموا بعنادهم وأغلظوا قلوبهم ولم يطيعوا."], [30, "لقد تحملتهم سنين كثيرة، وحذرتهم بروحك على لسان أنبيائك فلم يصغوا، فأسلمتهم لعبودية أمم البلاد."], [31, "ولكن من أجل مراحمك العميمة لم تبدهم، ولم تتخل عنهم، لأنك إله حنان رحيم."], [32, "والآن ياإلهنا، أيها الإله العظيم الجبار المرهوب حافظ العهد ومغدق الرحمة، لا تستصغر كل المشقات التي أصابتنا نحن وملوكنا ورؤساءنا وكهنتنا وأنبياءنا وآباءنا وكل شعبك، منذ أيام ملوك أشور إلى هذا اليوم،"], [33, "فقد كنت عادلا في كل ما حل بنا، لأنك عاقبتنا بالحق، ونحن الذين أذنبنا."], [34, "ولم يطع ملوكنا ورؤساؤنا وكهنتنا وآباؤنا شريعتك، ولا استمعوا إلى وصاياك وتحذيراتك التي أنذرتهم بها."], [35, "ولم يعبدوك في ملكهم، ولا حين كانوا يتمتعون بخيرك العميم الذي أنعمت به عليهم، ولا في أرضهم الشاسعة الخصيبة التي بسطتها أمامهم، ولم يرتدوا عن سيئات أعمالهم."], [36, "وها نحن اليوم مستعبدون في الأرض التي وهبتها لآبائنا ليأكلوا أثمارها وخيرها."], [37, "تذهب غلاتها الوفيرة إلى الملوك الذين سلطتهم علينا من جراء معاصينا، وهم يتحكمون في أجسادنا وبهائمنا كما يطيب لهم، بينما نحن في كرب شديد."]]}, {"l": "Job 33:27", "n": "", "vs": [[27, "ثم يرنم أمام الناس قائلا: لقد أخطأت وحرفت ما هو حق ولم أجاز عليه،"]]}, {"l": "Job 33:28", "n": "", "vs": [[28, "قد افتدى الله حياتي من الانحدار إلى الهاوية، فتنتعش حياتي لترى النور."]]}, {"l": "Psa 32:5", "n": "", "vs": [[5, "أعترف لك بخطيئتي، ولا أكتم إثمي. قلت: أعترف للرب بمعاصي، حقا صفحت عن إثم خطيئتي"]]}, {"l": "Psa 51:2-5", "n": "", "vs": [[2, "اغسلني كليا من إثمي، وطهرني من خطيئتي."], [3, "فإ نني أقر بمعاصي، وخطيئتي ماثلة أمامي دائما."], [4, "إليك وحدك أخطأت، والشر قدام عينيك صنعت. لكي تتبرر إذا حكمت وتزكو إذا قضيت."], [5, "ها إني بالإثم قد ولدت وفي الخطيئة حبلت بي أمي."]]}, {"l": "Pro 28:13", "n": "", "vs": [[13, "من يكتم آثامه لا يفلح، ومن يعترف بها ويقلع عنها يحظى بالرحمة."]]}, {"l": "Dan 9:4-20", "n": "", "vs": [[4, "وصليت إلى الرب إلهي واعترفت قائلا: «أيها الرب الإله العظيم المهوب، حافظ العهد والرحمة لمحبيه وعاملي وصاياه."], [5, "إننا أخطأنا وأثمنا وارتكبنا الشر، وتمردنا وانحرفنا عن وصاياك وأحكامك."], [6, "ولم نسمع لعبيدك الأنبياء الذين باسمك أنذروا ملوكنا ورؤساءنا وآباءنا وجميع شعب الأرض."], [7, "لك أيها السيد البر، ولنا الخزي، كما هو حادث اليوم لرجال يهوذا ولأهل أورشليم، ولسائر بني إسرائيل القريبين والبعيدين، المشتتين في كل البلدان التي أجليتهم إليها عقابا لهم على ما اقترفوه من خيانة في حقك."], [8, "فلنا أيها السيد الخزي، نحن وملوكنا ورؤسائنا وآبائنا، لأننا أخطأنا إليك."], [9, "إنما للرب إلهنا الرحمة والمغفرة لأننا عصيناك."], [10, "ولم نطع صوت الرب إلهنا لنسلك في شرائعه التي أعلنها لنا على لسان عبيده الأنبياء."], [11, "قد تعدى كل شعب إسرائيل على شريعتك، وانحرفوا فلم يسمعوا صوتك، فسكبت علينا اللعنة وما أقسمت أن توقعه بنا، كما نصت عليه شريعة موسى عبد الله، لأننا أخطأنا إليك."], [12, "وقد نفذت قضاءك الذي قضيت به علينا وعلى قضاتنا الذين تولوا أمرنا، جالبا علينا وعلى أورشليم شرا عظيما لم يحدث له مثيل تحت السماء."], [13, "وكما ورد في شريعة موسى، أصابنا جميع هذا البلاء، ولم نستعطف وجهك أيها الرب إلهنا تائبين عن آثامنا ومتنبهين لحقك."], [14, "فأضمرت لنا العقاب وأوقعته بنا لأنك إلهنا البار في كل أعمالك التي صنعتها لأننا لم نستمع إليك."], [15, "والآن أيها السيد إلهنا، يامن أخرجت شعبك من ديار مصر بقوة مقتدرة، وأشهرت اسمك كما هو حادث اليوم، قد أخطأنا وارتكبنا الشر."], [16, "فاصرف ياسيد، حسب رحمتك، سخطك وغضبك عن مدينتك أورشليم جبل قدسك إذ من جراء خطايانا وآثام آبائنا أصبحت أورشليم مثار عار لنا عند جميع المحيطين بنا."], [17, "فأنصت الآن ياإلهنا إلى صلاة عبدك وابتهالاته، وأضيء بوجهك على هيكلك المتهدم، من أجل ذاتك."], [18, "أرهف أذنك ياإلهي واستمع، وافتح عينيك وشاهد خرائبنا والمدينة التي دعي اسمك عليها، فإننا لا من أجل بر فينا نرفع تضرعاتنا إليك، بل بفضل مراحمك العظيمة."], [19, "فاستمع أيها السيد واغفر. أصغ أيها السيد وتصرف ولا تبطىء من أجل نفسك ياإلهي، لأن اسمك دعي على مدينتك وعلى شعبك»."], [20, "وبينما كنت أصلي وأعترف بخطيئتي وخطيئة شعبي إسرائيل، وأرفع تضرعاتي أمام الرب إلهي من أجل جبل قدس إلهي،"]]}, {"l": "Mat 3:6", "n": "", "vs": [[6, "فكانوا يتعمدون على يده في نهر الأردن معترفين بخطاياهم."]]}, {"l": "Mar 1:5", "n": "", "vs": [[5, "وخرج إليه أهل منطقة اليهودية وأهل أورشليم جميعا، فكانوا يتعمدون على يده في نهر الأردن معترفين بخطاياهم."]]}, {"l": "Act 19:18", "n": "", "vs": [[18, "فجاء كثيرون من الذين كانوا قد آمنوا يعترفون ويخبرون بما كانوا يعملون."]]}], "kwAr": "اعترفنا بخطايانا", "noteAr": ""}, {"kw": "he is", "raw": "Deu_7:9; Lam_3:23; 1Co_1:9; 1Ti_1:15; Heb_10:23, Heb_11:11", "note": "", "refs": [{"l": "Deu 7:9", "n": "", "vs": [[9, "فاعلموا أن الرب إلهكم هو الله ، الإله الأمين الوفي بالعهد والإحسان لمحبيه وحافظي وصاياه إلى ألف جيل."]]}, {"l": "Lam 3:23", "n": "", "vs": [[23, "تتجدد في كل صباح. فائقة أمانتك."]]}, {"l": "1Co 1:9", "n": "", "vs": [[9, "فإن الله أمين، وقد دعاكم إلى الشركة مع ابنه يسوع ربنا."]]}, {"l": "1Ti 1:15", "n": "", "vs": [[15, "ما أصدق هذا القول، وما أجدره بالتصديق الكلي: إن المسيح يسوع قد جاء إلى العالم ليخلص الخاطئين، وأنا أولهم!"]]}, {"l": "Heb 10:23", "n": "", "vs": [[23, "ولنتمسك دائما بالرجاء الذي نعترف به، دون أن نشك في أنه سيتحقق، لأن الذي وعدنا بتحقيقه، هو أمين وصادق."]]}, {"l": "Heb 11:11", "n": "", "vs": [[11, "وبالإيمان أيضا، نالت سارة زوجة إبراهيم قدرة على الإنجاب، فولدت ابنا مع أنها كانت قد جاوزت سن الحمل. وذلك لأنها آمنت بأن الله ، الذي وعدها بذلك، لابد أن يحقق وعده."]]}], "kwAr": "جدير بالثقة", "noteAr": ""}, {"kw": "just", "raw": "Isa_45:21; Zec_9:9; Rom_3:26; Heb_6:10; Rev_15:3", "note": "", "refs": [{"l": "Isa 45:21", "n": "", "vs": [[21, "أعلنوا، واعرضوا دعواكم. ليتشاوروا معا. من أنبأ بهذا منذ القدم، ومن أخبر به من زمن بعيد؟ ألست أنا الرب ولا إله غيري؟ بار ومخلص، وليس هناك آخر."]]}, {"l": "Zec 9:9", "n": "", "vs": [[9, "»ابتهجي جدا ياابنة صهيون واهتفي ياابنة أورشليم، لأن هوذا ملكك مقبل إليك. هو عادل ظافر، ولكنه وديع راكب على أتان، على جحش ابن أتان."]]}, {"l": "Rom 3:26", "n": "", "vs": [[26, "ليظهر بر الله إذ تغاضى، بإمهاله الإلهي، عن الخطايا التي حدثت في الماضي، ويظهر أيضا بره في الزمن الحاضر: فيتبين أنه بار وأنه يبرر من له الإيمان بيسوع."]]}, {"l": "Heb 6:10", "n": "", "vs": [[10, "وليس الله بظالم حتى ينسى عملكم الجاد في إظهار محبتكم له عن طريق خدمتكم للقديسين إكراما لاسمه، الأمر الذي قمتم به قبلا، وتقومون به الآن!"]]}, {"l": "Rev 15:3", "n": "", "vs": [[3, "وينشدون ترتيلة موسى، عبد الله وترتيلة الحمل قائلين: «عظيمة وعجيبة أعمالك أيها الرب الإله القادر على كل شيء، عادلة ومستقيمة طرقك ياملك الدهور."]]}], "kwAr": "وعادل", "noteAr": ""}, {"kw": "and to", "raw": "1Jo_1:7; Psa_19:12, Psa_51:2; Jer_33:8; Eze_36:25, Eze_37:23; 1Co_6:11; Eph_5:26; Tit_2:14", "note": "", "refs": [{"l": "1Jo 1:7", "n": "", "vs": [[7, "ولكن، إن كنا فعلا نعيش في النور، كما هو في النور، تكون لنا حقا شركة بعضنا مع بعض، ودم ابنه يسوع يطهرنا من كل خطيئة."]]}, {"l": "Psa 19:12", "n": "", "vs": [[12, "من يتنبه إلى سهواته؟ من الخطايا الخفية خلصني،"]]}, {"l": "Psa 51:2", "n": "", "vs": [[2, "اغسلني كليا من إثمي، وطهرني من خطيئتي."]]}, {"l": "Jer 33:8", "n": "", "vs": [[8, "وأطهرهم من كل إثمهم الذي اقترفوه في حقي، وأصفح عن ذنوبهم التي أخطأوا بها إلي، وعن جميع تعدياتهم علي."]]}, {"l": "Eze 36:25", "n": "", "vs": [[25, "وأرش عليكم ماء نقيا فتطهرون من كل نجاستكم ومن كل أصنامكم،"]]}, {"l": "Eze 37:23", "n": "", "vs": [[23, "ولا يتدنسون بعد بأصنامهم ورجاساتهم ولا بأي من معاصيهم، بل أخلصهم من مواطن إثمهم، وأطهرهم فيكونون لي شعبا وأنا أكون لهم إلها."]]}, {"l": "1Co 6:11", "n": "", "vs": [[11, "وهكذا كان بعضكم، إلا أنكم قد اغتسلتم، بل تقدستم، بل تبررتم، باسم الرب يسوع المسيح وبروح إلهنا."]]}, {"l": "Eph 5:26", "n": "", "vs": [[26, "لكي يقدسها مطهرا إياها بغسل الماء، بالكلمة،"]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}], "kwAr": "ويطهرنا من كل إثم", "noteAr": ""}], "arS": [["ولكن، إن ", []], ["اعترفنا", ["G3670"]], [" لله ", []], ["بخطايانا", ["G266", "G2257"]], ["، فهو ", []], ["جدير بالثقة", ["G4103"]], [" ", []], ["وعادل", ["G1342"]], ["، ", []], ["يغفر", ["G863"]], [" لنا ", []], ["خطايانا", ["G266"]], [" ", []], ["ويطهرنا", ["G2511"]], [" من ", []], ["كل", ["G3956"]], [" ", []], ["إثم", ["G93"]], [".", []]]}, {"c": 1, "v": 10, "text": "فإن كنا ندعي أننا لم نرتكب خطيئة، نجعل الله كاذبا، ولا تكون كلمته في داخلنا!", "groups": [{"kw": "we say", "raw": "1Jo_1:8; Psa_130:3", "note": "", "refs": [{"l": "1Jo 1:8", "n": "", "vs": [[8, "إن كنا ندعي أن لا خطيئة لنا، نخدع أنفسنا، ولا يكون الحق في داخلنا."]]}, {"l": "Psa 130:3", "n": "", "vs": [[3, "إن كنت يارب تترصد الآثام، فمن يستطيع الوقوف في محضرك؟"]]}], "kwAr": "ندعي أننا لم نرتكب خطيئة", "noteAr": ""}, {"kw": "we make", "raw": "1Jo_5:10; Job_24:25", "note": "", "refs": [{"l": "1Jo 5:10", "n": "", "vs": [[10, "فمن يؤمن بابن الله، يثق في قلبه بصحة هذه الشهادة. أما من لا يصدق الله ، إذ يرفض تصديق الشهادة التي شهد بها لابنه، فهو يتهم الله بالكذب."]]}, {"l": "Job 24:25", "n": "", "vs": [[25, "وإلا، من يقدر أن يكذبني ويجعل كلامي كالعدم؟»"]]}], "kwAr": "نجعل الله كاذبا", "noteAr": ""}, {"kw": "his word", "raw": "1Jo_1:8, 1Jo_2:4, 1Jo_4:4; Col_3:16; 2Jo_1:2", "note": "", "refs": [{"l": "1Jo 1:8", "n": "", "vs": [[8, "إن كنا ندعي أن لا خطيئة لنا، نخدع أنفسنا، ولا يكون الحق في داخلنا."]]}, {"l": "1Jo 2:4", "n": "", "vs": [[4, "فالذي يدعي أنه قد عرفه، ولكنه لا يعمل بوصاياه، يكون كاذبا ولا يكون الحق في داخله."]]}, {"l": "1Jo 4:4", "n": "", "vs": [[4, "أيها الأولاد الصغار، أنتم من الله، وقد غلبتم الذين يقاومون المسيح: لأن الروح القدس الساكن فيكم أقوى من الروح الشرير المنتشر في العالم."]]}, {"l": "Col 3:16", "n": "", "vs": [[16, "لتسكن كلمة المسيح في داخلكم بغنى، في كل حكمة، معلمين وواعظين بعضكم بعضا، مرنمين بمزامير وتسابيح وأناشيد روحية في قلوبكم لله، رافعين له الحمد."]]}, {"l": "2Jo 1:2", "n": "", "vs": [[2, "بما أن الحق ثابت في قلوبنا، ولابد أن يرافقنا إلى الأبد،"]]}], "kwAr": "كلمته", "noteAr": ""}], "arS": [["فإن كنا ", []], ["ندعي", ["G2036"]], [" أننا لم ", []], ["نرتكب خطيئة", ["G264"]], ["، ", []], ["نجعل", ["G4160"]], [" الله ", []], ["كاذبا", ["G5583"]], ["، ولا تكون ", []], ["كلمته", ["G3056"]], [" في داخلنا!", []]]}, {"c": 2, "v": 1, "text": "ياأولادي الصغار، أكتب إليكم هذه الأمور لكي لا تخطئوا. ولكن، إن أخطأ أحدكم، فلنا عند الآب شفيع هو يسوع المسيح البار.", "groups": [{"kw": "little", "raw": "1Jo_2:12, 1Jo_2:13, 1Jo_3:7, 1Jo_3:18, 1Jo_4:4, 1Jo_5:21; Joh_13:33, Joh_21:5; 1Co_4:14, 1Co_4:15; Gal_4:19", "note": "", "refs": [{"l": "1Jo 2:12", "n": "", "vs": [[12, "أكتب إليكم، أيها الأولاد، لأن الله قد غفر لكم خطاياكم إكراما لاسم المسيح."]]}, {"l": "1Jo 2:13", "n": "", "vs": [[13, "أكتب إليكم أيها الآباء، لأنكم قد عرفتم المسيح الكائن منذ البداية. أكتب إليكم أيها الشباب، لأنكم قد غلبتم إبليس الشرير. كتبت إليكم أيها الأولاد الصغار، لأنكم قد عرفتم الآب."]]}, {"l": "1Jo 3:7", "n": "", "vs": [[7, "أيها الأولاد الصغار، لا تدعوا أحدا يضللكم. تأكدوا أن من يمارس الصلاح، يظهر أنه بار كما أن المسيح بار."]]}, {"l": "1Jo 3:18", "n": "", "vs": [[18, "أيها الأولاد الصغار، لا يجب أن تكون محبتنا مجرد ادعاء بالكلام واللسان، بل تكون محبة عملية حقة."]]}, {"l": "1Jo 4:4", "n": "", "vs": [[4, "أيها الأولاد الصغار، أنتم من الله، وقد غلبتم الذين يقاومون المسيح: لأن الروح القدس الساكن فيكم أقوى من الروح الشرير المنتشر في العالم."]]}, {"l": "1Jo 5:21", "n": "", "vs": [[21, "أيها الأولاد الصغار، احفظوا أنفسكم من الأصنام!"]]}, {"l": "Joh 13:33", "n": "", "vs": [[33, "ياأولادي الصغار، سأبقى عندكم وقتا قصيرا بعد، ثم تطلبونني، ولكني أقول لكم ما سبق أن قلته لليهود: إنكم لا تقدرون أن تأتوا حيث أنا ذاهب."]]}, {"l": "Joh 21:5", "n": "", "vs": [[5, "فسألهم يسوع: «يافتيان، أما عندكم سمك؟» أجابوه: «لا!»"]]}, {"l": "1Co 4:14", "n": "", "vs": [[14, "لا أكتب هذا تخجيلا لكم، بل أنبهكم باعتباركم أولادي الأحباء."]]}, {"l": "1Co 4:15", "n": "", "vs": [[15, "فقد يكون لكم عشر ة آلاف من المرشدين في المسيح، ولكن ليس لكم آباء كثيرون! لأني أنا ولدتكم في المسيح يسوع بالإنجيل."]]}, {"l": "Gal 4:19", "n": "", "vs": [[19, "ياأطفالي الذين أتمخض بكم مرة أخرى إلى أن تتشكل فيكم صورة المسيح."]]}], "kwAr": "ياأولادي الصغار", "noteAr": ""}, {"kw": "these", "raw": "1Jo_1:3, 1Jo_1:4; 1Ti_3:14", "note": "", "refs": [{"l": "1Jo 1:3", "n": "", "vs": [[3, "فنحن، إذن، نخبركم بما رأيناه وسمعناه، لكي تكونوا شركاءنا. كما أن شركتنا هي مع الآب ومع ابنه يسوع المسيح."]]}, {"l": "1Jo 1:4", "n": "", "vs": [[4, "ونكتب إليكم هذه الأمور لكي يكتمل فرحكم!"]]}, {"l": "1Ti 3:14", "n": "", "vs": [[14, "هذه التوصيات أكتبها إليك، وأنا أرجو أن آتي إليك بأكثر سرعة،"]]}], "kwAr": "هذه الأمور", "noteAr": ""}, {"kw": "that", "raw": "Psa_4:4; Eze_3:21; Joh_5:14, Joh_8:11; Rom_6:1, Rom_6:2, Rom_6:15; 1Co_15:34; Eph_4:26; Tit_2:11-13; 1Pe_1:15-19, 1Pe_4:1-3", "note": "", "refs": [{"l": "Psa 4:4", "n": "", "vs": [[4, "ارتعدوا ولا تخطئوا. فكروا في قلوبكم على مضاجعكم معتصمين بالصمت."]]}, {"l": "Eze 3:21", "n": "", "vs": [[21, "أما إن كنت قد أنذرت البار حتى لا يخطيء، ولم يخطيء، فإنه حتما يحيا لأنه قبل الإنذار، وتنجو أنت بنفسك»."]]}, {"l": "Joh 5:14", "n": "", "vs": [[14, "وبعد ذلك وجده يسوع في الهيكل، فقال له: «ها أنت قد عدت صحيحا فلا ترجع إلى الخطيئة لئلا يصيبك ما هو أسوأ!»"]]}, {"l": "Joh 8:11", "n": "", "vs": [[11, "أجابت: «لا أحد ياسيد». فقال لها: «وأنا لا أحكم عليك. اذهبي ولا تعودي تخطئين!»"]]}, {"l": "Rom 6:1", "n": "", "vs": [[1, "إذن ماذا نقول؟ أنستمر في الخطيئة لكي تتوافر النعمة؟"]]}, {"l": "Rom 6:2", "n": "", "vs": [[2, "حاشا! فنحن الذين متنا بالنسبة للخطيئة، كيف نعيش بعد فيها؟"]]}, {"l": "Rom 6:15", "n": "", "vs": [[15, "فماذا إذن؟ أنخطيء لأننا لسنا خاضعين للشريعة بل للنعمة؟ حاشا!"]]}, {"l": "1Co 15:34", "n": "", "vs": [[34, "عودوا إلى الصواب كما يجب ولا تخطئوا، فإن بعضا منكم يجهلون الله تماما أقول هذا لكي تخجلوا!"]]}, {"l": "Eph 4:26", "n": "", "vs": [[26, "إن غضبتم، فلا تخطئوا؛ لا تدعوا الشمس تغيب وأنتم غاضبون،"]]}, {"l": "Tit 2:11-13", "n": "", "vs": [[11, "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت."], [12, "وهي تعلمنا أن نقطع علاقتنا بالإباحية والشهوات العالمية، وأن نحيا في العصر الحاضر حياة التعقل والبر والتقوى،"], [13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "1Pe 1:15-19", "n": "", "vs": [[15, "وإنما اسلكوا سلوكا مقدسا في كل أمر، مقتدين بالقدوس الذي دعاكم،"], [16, "لأنه قد كتب: «كونوا قديسين، لأني أنا قدوس!»"], [17, "وما دمتم تعترفون بالله أبا لكم، وهو يحكم على كل إنسان حسب أعماله دون انحياز، فاسلكوا في مخافته مدة إقامتكم المؤقتة على الأرض."], [18, "واعلموا أنه قد دفع الفدية ليحرركم من سيرة حياتكم الباطلة التي أخذتموها بالتقليد عن آبائكم. وهذه الفدية لم تكن شيئا فانيا كالفضة أو الذهب،"], [19, "بل كانت دما ثمينا، دم المسيح، ذلك الحمل الطاهر الذي ليس فيه عيب ولا دنس!"]]}, {"l": "1Pe 4:1-3", "n": "", "vs": [[1, "فبما أن المسيح قد تحمل الآلام الجسمية لأجلكم، سلحوا أنفسكم بالاستعداد دائما لتحمل الآلام. فإن من يتحمل الآلام الجسمية، يكون قد قاطع الخطيئة."], [2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."], [3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}], "kwAr": "لكي لا تخطئوا", "noteAr": ""}, {"kw": "And if", "raw": "1Jo_1:8-10", "note": "", "refs": [{"l": "1Jo 1:8-10", "n": "", "vs": [[8, "إن كنا ندعي أن لا خطيئة لنا، نخدع أنفسنا، ولا يكون الحق في داخلنا."], [9, "ولكن، إن اعترفنا لله بخطايانا، فهو جدير بالثقة وعادل، يغفر لنا خطايانا ويطهرنا من كل إثم."], [10, "فإن كنا ندعي أننا لم نرتكب خطيئة، نجعل الله كاذبا، ولا تكون كلمته في داخلنا!"]]}], "kwAr": "إن أخطأ أحدكم", "noteAr": ""}, {"kw": "we have", "raw": "Rom_8:34; 1Ti_2:5; Heb_7:24, Heb_7:25, Heb_9:24", "note": "", "refs": [{"l": "Rom 8:34", "n": "", "vs": [[34, "فمن ذا يدين؟ إنه المسيح يسوع هو الذي مات، بل بالأحرى قام، وهو أيضا عن يمين الله، وهو يشفع فينا أيضا."]]}, {"l": "1Ti 2:5", "n": "", "vs": [[5, "فإن الله واحد، والوسيط بين الله والناس واحد، وهو الإنسان المسيح يسوع،"]]}, {"l": "Heb 7:24", "n": "", "vs": [[24, "وأما المسيح، فلأنه حي إلى الأبد، فهو يبقى صاحب كهنوت لا يزول!"]]}, {"l": "Heb 7:25", "n": "", "vs": [[25, "وهو لذلك قادر دائما أن يحقق الخلاص الكامل للذين يتقربون به إلى الله. فهو، في حضرة الله، حي على الدوام ليتضرع من أجلهم ويحامي عنهم!"]]}, {"l": "Heb 9:24", "n": "", "vs": [[24, "فالمسيح، رئيس كهنتنا، لم يدخل إلى «قدس الأقداس» الأرضي، الذي صنعته يد بشرية وما هو إلا ظل للحقيقة، بل دخل إلى السماء عينها، حيث يقوم الآن بتمثيلنا في حضرة الله بالذات."]]}], "kwAr": "فلنا شفيع", "noteAr": ""}, {"kw": "Father", "raw": "Luk_10:22; Joh_5:19-26, Joh_5:36, Joh_6:27, Joh_10:15, Joh_14:6; Eph_2:18; Jam_1:27, Jam_3:9", "note": "", "refs": [{"l": "Luk 10:22", "n": "", "vs": [[22, "كل شيء قد سلم إلي من قبل أبي، ولا أحد يعرف من هو الابن إلا الآب، ولا من هو الآب إلا الابن ومن أراد الابن أن يعلنه له!»"]]}, {"l": "Joh 5:19-26", "n": "", "vs": [[19, "فقال لهم يسوع: «الحق الحق أقول لكم إن الابن لا يقدر أن يفعل شيئا من تلقاء نفسه، بل يفعل ما يرى الآب يفعله. فكل ما يعمله الآب، يعمله الابن كذلك،"], [20, "لأن الآب يحب الابن، ويريه جميع ما يفعله، وسيريه أيضا أعمالا أعظم من هذا العمل، فتدهشون."], [21, "فكما يقيم الآب الموتى ويحييهم، كذلك يحيي الابن من يشاء."], [22, "والآب لا يحاكم أحدا، بل أعطى الابن سلطة القضاء كلها،"], [23, "ليكرم الجميع الابن كما يكرمون الآب. ومن لا يكرم الابن لا يكرم الآب الذي أرسله."], [24, "الحق الحق أقول لكم إن من يسمع كلامي ويؤمن بالذي أرسلني تكون له الحياة الأبدية، ولا يحاكم في اليوم الأخير، لأنه قد انتقل من الموت إلى الحياة."], [25, "الحق الحق أقول لكم: إن الساعة التي يسمع فيها الأموات صوت ابن الله ستأتي بل هي الآن والذين يسمعونه يحيون."], [26, "لأنه كما أن للآب حياة في ذاته، فقد أعطى الابن أيضا أن تكون له حياة في ذاته،"]]}, {"l": "Joh 5:36", "n": "", "vs": [[36, "ولكن لي شهادة أعظم من شهادة يوحنا، وهي شهادة الأعمال التي كلفني الآب أن أنجزها والتي أعملها، فهي تشهد لي مبينة أن الآب أرسلني،"]]}, {"l": "Joh 6:27", "n": "", "vs": [[27, "لا تسعوا وراء الطعام الفاني، بل وراء الطعام الباقي إلى الحياة الأبدية، والذي يعطيكم إياه ابن الإنسان، لأن هذا الطعام قد وضع الله الآب ختمه عليه»."]]}, {"l": "Joh 10:15", "n": "", "vs": [[15, "مثلما يعرفني الآب وأنا أعرفه. وأنا أبذل حياتي فدى خرافي."]]}, {"l": "Joh 14:6", "n": "", "vs": [[6, "فأجابه يسوع: «أنا هو الطريق والحق والحياة. لا يأتي أحد إلى الآب إلا بي."]]}, {"l": "Eph 2:18", "n": "", "vs": [[18, "فبه لنا كلينا اقتراب إلى الآب بروح واحد."]]}, {"l": "Jam 1:27", "n": "", "vs": [[27, "فالديانة الطاهرة النقية في نظر الله الآب، تظهر في زيارة الأيتام والأرامل لإعانتهم في ضيقهم، وفي صيانة النفس من التلوث بفساد العالم."]]}, {"l": "Jam 3:9", "n": "", "vs": [[9, "به نرفع الحمد والشكر للرب والآب، وبه نوجه الشتائم إلى الناس الذين خلقهم الله على مثاله."]]}], "kwAr": "عند الآب", "noteAr": ""}, {"kw": "the righteous", "raw": "1Jo_2:29, 1Jo_3:5; Zec_9:9; 2Co_5:21; Heb_7:26; 1Pe_2:22, 1Pe_3:18", "note": "", "refs": [{"l": "1Jo 2:29", "n": "", "vs": [[29, "وما دمتم تعلمون أن الله بار، فاعلموا أن كل من يفعل الصلاح، يظهر أنه مولود من الله حقا."]]}, {"l": "1Jo 3:5", "n": "", "vs": [[5, "وأنتم تعرفون أن المسيح جاء إلى هذه الأرض لكي يحمل الخطايا، مع كونه بلا خطيئة."]]}, {"l": "Zec 9:9", "n": "", "vs": [[9, "»ابتهجي جدا ياابنة صهيون واهتفي ياابنة أورشليم، لأن هوذا ملكك مقبل إليك. هو عادل ظافر، ولكنه وديع راكب على أتان، على جحش ابن أتان."]]}, {"l": "2Co 5:21", "n": "", "vs": [[21, "فإن الذي لم يعرف خطيئة، جعله الله خطيئة لأجلنا، لنصير نحن بر الله فيه."]]}, {"l": "Heb 7:26", "n": "", "vs": [[26, "نعم، هذا هو رئيس الكهنة الذي كنا محتاجين إليه. إنه قدوس، لا عيبة فيه، ولا نجاسة، قد انفصل عن الخاطئين، وارتفع حتى صار أسمى من السماوات."]]}, {"l": "1Pe 2:22", "n": "", "vs": [[22, "إنه لم يفعل خطيئة واحدة، ولا كان في فمه مكر."]]}, {"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}], "kwAr": "يسوع المسيح البار", "noteAr": ""}], "arS": [["ياأولادي الصغار", ["G3450", "G5040"]], ["، ", []], ["أكتب", ["G1125"]], [" إليكم هذه ", []], ["الأمور", ["G5023"]], [" لكي لا ", []], ["تخطئوا", ["G264"]], [". ولكن، إن ", []], ["أخطأ", ["G264"]], [" ", []], ["أحدكم", ["G5100"]], ["، فلنا عند ", []], ["الآب", ["G3962"]], [" ", []], ["شفيع", ["G3875"]], [" هو ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [" ", []], ["البار", ["G1342"]], [".", []]]}, {"c": 2, "v": 2, "text": "فهو كفارة لخطايانا، لا لخطايانا فقط، بل لخطايا العالم كله.", "groups": [{"kw": "he is", "raw": "1Jo_1:7, 1Jo_4:10; Rom_3:25, Rom_3:26; 1Pe_2:24, 1Pe_3:18", "note": "", "refs": [{"l": "1Jo 1:7", "n": "", "vs": [[7, "ولكن، إن كنا فعلا نعيش في النور، كما هو في النور، تكون لنا حقا شركة بعضنا مع بعض، ودم ابنه يسوع يطهرنا من كل خطيئة."]]}, {"l": "1Jo 4:10", "n": "", "vs": [[10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."]]}, {"l": "Rom 3:25", "n": "", "vs": [[25, "الذي قدمه الله كفارة، عن طريق الإيمان، وذلك بدمه."]]}, {"l": "Rom 3:26", "n": "", "vs": [[26, "ليظهر بر الله إذ تغاضى، بإمهاله الإلهي، عن الخطايا التي حدثت في الماضي، ويظهر أيضا بره في الزمن الحاضر: فيتبين أنه بار وأنه يبرر من له الإيمان بيسوع."]]}, {"l": "1Pe 2:24", "n": "", "vs": [[24, "وهو نفسه حمل خطايانا في جسده (عندما مات مصلوبا) على الخشبة، لكي نموت بالنسبة للخطايا فنحيا حياة البر. وبجراحه هو تم لكم الشفاء،"]]}, {"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}], "kwAr": "كفارة لخطايانا", "noteAr": ""}, {"kw": "for the", "raw": "1Jo_4:14, 1Jo_5:19; Joh_1:29, Joh_4:42, Joh_11:51, Joh_11:52; 2Co_5:18-21; Rev_12:9", "note": "", "refs": [{"l": "1Jo 4:14", "n": "", "vs": [[14, "ونحن أنفسنا نشهد أن الآب قد أرسل الابن مخلصا للعالم، لأننا رأيناه بعيوننا."]]}, {"l": "1Jo 5:19", "n": "", "vs": [[19, "ونحن واثقون أيضا بأننا من الله، وأن العالم كله خاضع لسيطرة إبليس الشرير."]]}, {"l": "Joh 1:29", "n": "", "vs": [[29, "وفي اليوم التالي رأى يوحنا يسوع آتيا نحوه، فهتف قائلا: «هذا هو حمل الله الذي يزيل خطيئة العالم."]]}, {"l": "Joh 4:42", "n": "", "vs": [[42, "وقالوا للمرأة: «إننا لا نؤمن بعد الآن بسبب كلامك، بل نؤمن لأننا سمعناه بأنفسنا، وعرفنا أنه مخلص العالم حقا!»"]]}, {"l": "Joh 11:51", "n": "", "vs": [[51, "ولم يقل قيافا هذا الكلام من عنده، ولكن إذ كان رئيسا للكهنة في تلك السنة تنبأ أن يسوع سيموت فدى الأمة،"]]}, {"l": "Joh 11:52", "n": "", "vs": [[52, "وليس فدى الأمة وحسب بل أيضا ليجمع أبناء الله المشتتين فيجعلهم واحدا."]]}, {"l": "2Co 5:18-21", "n": "", "vs": [[18, "وكل شيء هو من عند الله الذي صالحنا مع نفسه بالمسيح، ثم سلمنا خدمة هذه المصالحة."], [19, "ذلك أن الله كان في المسيح مصالحا العالم مع نفسه، غير حاسب عليهم خطاياهم، وقد وضع بين أيدينا رسالة هذه المصالحة."], [20, "فنحن إذن سفراء المسيح، وكأن الله يعظ بنا نتوسل بالنيابة عن المسيح منادين: «تصالحوا مع الله!»"], [21, "فإن الذي لم يعرف خطيئة، جعله الله خطيئة لأجلنا، لنصير نحن بر الله فيه."]]}, {"l": "Rev 12:9", "n": "", "vs": [[9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."]]}], "kwAr": "لخطايا العالم كله", "noteAr": ""}], "arS": [["فهو ", []], ["كفارة", ["G2434"]], [" ", []], ["لخطايانا", ["G266"]], ["، لا لخطايانا ", []], ["فقط", ["G3440"]], ["، بل لخطايا ", []], ["العالم", ["G2889"]], [" ", []], ["كله", ["G3650"]], [".", []]]}, {"c": 2, "v": 3, "text": "وما يؤكد لنا أننا قد عرفنا المسيح حقا هو أن نعمل بوصاياه.", "groups": [{"kw": "hereby", "raw": "1Jo_2:4-6, 1Jo_3:14, 1Jo_3:19, 1Jo_4:13, 1Jo_5:19", "note": "", "refs": [{"l": "1Jo 2:4-6", "n": "", "vs": [[4, "فالذي يدعي أنه قد عرفه، ولكنه لا يعمل بوصاياه، يكون كاذبا ولا يكون الحق في داخله."], [5, "أما الذي يعمل بحسب كلمة المسيح، فإن محبة الله تكون قد اكتملت في داخله. بهذا نعرف أننا ننتمي إلى المسيحِ."], [6, "كل من يعترف أنه ثابت في المسيح، يلتزم أن يسلك كما سلك المسيح!"]]}, {"l": "1Jo 3:14", "n": "", "vs": [[14, "إن محبتنا لإخوتنا تبين لنا أننا انتقلنا من الموت إلى الحياة. فالذي لا يحب إخوته، فهو باق في الموت."]]}, {"l": "1Jo 3:19", "n": "", "vs": [[19, "عندئذ نتأكد أننا نتصرف بحسب الحق، وتطمئن نفوسنا في حضرة الله،"]]}, {"l": "1Jo 4:13", "n": "", "vs": [[13, "وما يؤكد لنا أننا نثبت في الله، وأنه يثبت فينا هو أنه وهب لنا من روحه."]]}, {"l": "1Jo 5:19", "n": "", "vs": [[19, "ونحن واثقون أيضا بأننا من الله، وأن العالم كله خاضع لسيطرة إبليس الشرير."]]}], "kwAr": "وما يؤكد لنا", "noteAr": ""}, {"kw": "we know", "raw": "Isa_53:11 *Heb: Joh_17:3; 2Co_4:6", "note": "", "refs": [{"l": "Isa 53:11", "n": "*Heb:", "vs": [[11, "ويرى ثمار تعب نفسه ويشبع، وعبدي البار يبرر بمعرفته كثيرين ويحمل آثامهم."]]}, {"l": "Joh 17:3", "n": "", "vs": [[3, "والحياة الأبدية هي أن يعرفوك أنت الإله الحق وحدك، والذي أرسلته: يسوع المسيح."]]}, {"l": "2Co 4:6", "n": "", "vs": [[6, "فإن الله ، الذي أمر أن يشرق نور من الظلام، هو الذي جعل النور يشرق في قلوبنا، لإشعاع معرفة مجد الله المتجلي في وجه المسيح."]]}], "kwAr": "عرفنا المسيح", "noteAr": ""}, {"kw": "if we", "raw": "1Jo_3:22, 1Jo_3:23, 1Jo_5:3; Psa_119:6, Psa_119:32; Luk_6:46; Joh_14:15, Joh_14:21-24, Joh_15:10,Joh_15:14; 1Th_4:1, 1Th_4:2; Heb_5:9; Rev_22:14", "note": "", "refs": [{"l": "1Jo 3:22", "n": "", "vs": [[22, "ومهما نطلب منه بالصلاة، نحصل عليه: لأننا نطيع ما يوصينا به، ونمارس الأعمال التي ترضيه."]]}, {"l": "1Jo 3:23", "n": "", "vs": [[23, "وأما وصيته فهي أن نؤمن باسم ابنه يسوع المسيح، وأن يحب بعضنا بعضا كما أوصانا."]]}, {"l": "1Jo 5:3", "n": "", "vs": [[3, "فالمحبة الحقيقية لله هي أن نعمل بما يوصينا به. وهو لا يوصينا وصية فوق طاقتنا."]]}, {"l": "Psa 119:6", "n": "", "vs": [[6, "عندئذ لا أخزى إذا تأملت في جميع وصاياك."]]}, {"l": "Psa 119:32", "n": "", "vs": [[32, "أجد مسرعا في طريق وصاياك، لأنك تشرح قلبي."]]}, {"l": "Luk 6:46", "n": "", "vs": [[46, "ولماذا تدعونني: يارب، يارب! ولا تعملون بما أقوله؟"]]}, {"l": "Joh 14:15", "n": "", "vs": [[15, "إن كنتم تحبونني فاعملوا بوصاياي."]]}, {"l": "Joh 14:21-24", "n": "", "vs": [[21, "من كانت عنده وصاياي، ويعمل بها، فذاك يحبني. والذي يحبني، يحبه أبي، وأنا أحبه وأعلن له ذاتي»."], [22, "فسأله يهوذا، غير الإسخريوطي: «ياسيد، ماذا جرى حتى تعلن لنا ذاتك ولا تعلنها للعالم؟»"], [23, "أجابه يسوع: «من يحبني يعمل بكلمتي، ويحبه أبي، وإليه نأتي، وعنده نجعل لنا منزلا."], [24, "والذي لا يحبني لا يعمل بكلامي. وليس هذا الكلام الذي تسمعونه من عندي، بل من الآب الذي أرسلني،"]]}, {"l": "Joh 15:10", "n": "", "vs": [[10, "إن عملتم بوصاياي، تثبتون في محبتي، كما عملت أنا بوصايا أبي وأثبت في محبته!"]]}, {"l": "Joh 15:14", "n": "", "vs": [[14, "وأنتم أحبائي إن عملتم بما أوصيكم به."]]}, {"l": "1Th 4:1", "n": "", "vs": [[1, "وبعد، أيها الإخوة، فمثلما تلقيتم منا كيف يجب أن تسلكوا سلوكا يرضي الله ، وكما أنتم فاعلون، نرجو منكم ونحرضكم في الرب يسوع أن تضاعفوا تقدمكم في ذلك أكثر فأكثر."]]}, {"l": "1Th 4:2", "n": "", "vs": [[2, "فإنكم تعرفون الوصايا التي لقناكم إياها من قبل الرب يسوع."]]}, {"l": "Heb 5:9", "n": "", "vs": [[9, "وبذلك، أصبح مؤهلا لمهمته، فصار لجميع الذين يطيعونه مصدرا للخلاص الأبدي."]]}, {"l": "Rev 22:14", "n": "", "vs": [[14, "طوبى للذين يغسلون ثيابهم، فلهم السلطة على شجرة الحياة، والحق في دخول المدينة من الأبواب!"]]}], "kwAr": "نعمل بوصاياه", "noteAr": ""}], "arS": [["وما يؤكد لنا أننا قد ", []], ["عرفنا", ["G1097"]], [" المسيح حقا هو أن ", []], ["نعمل", ["G5083"]], [" ", []], ["بوصاياه", ["G1785"]], [".", []]]}, {"c": 2, "v": 4, "text": "فالذي يدعي أنه قد عرفه، ولكنه لا يعمل بوصاياه، يكون كاذبا ولا يكون الحق في داخله.", "groups": [{"kw": "that saith", "raw": "1Jo_2:9, 1Jo_1:6, 1Jo_1:8, 1Jo_1:10, 1Jo_4:20; Jam_2:14-16", "note": "", "refs": [{"l": "1Jo 2:9", "n": "", "vs": [[9, "من ادعى أنه يحيا في النور، ولكنه يبغض أحد إخوته، فهو مازال حتى الآن في الظلام."]]}, {"l": "1Jo 1:6", "n": "", "vs": [[6, "فإن كنا ندعي أن لنا شركة معه، ونحن نعيش في الظلام، نكون كاذبين ولا نمارس الحق."]]}, {"l": "1Jo 1:8", "n": "", "vs": [[8, "إن كنا ندعي أن لا خطيئة لنا، نخدع أنفسنا، ولا يكون الحق في داخلنا."]]}, {"l": "1Jo 1:10", "n": "", "vs": [[10, "فإن كنا ندعي أننا لم نرتكب خطيئة، نجعل الله كاذبا، ولا تكون كلمته في داخلنا!"]]}, {"l": "1Jo 4:20", "n": "", "vs": [[20, "فإن قال أحد: «أنا أحب الله !» ولكنه يبغض أخا له، فهو كاذب، لأنه إن كان لا يحب أخاه الذي يراه، فكيف يقدر أن يحب الله الذي لم يره قط؟"]]}, {"l": "Jam 2:14-16", "n": "", "vs": [[14, "ياإخوتي، هل ينفع أحدا أن يدعي أنه مؤمن، وليس له أعمال تثبت ذلك، هل يقدر إيمان مثل هذا أن يخلصه؟"], [15, "لنفرض أن أخا أو أختا كانا بحاجة شديدة إلى الثياب والطعام اليومي،"], [16, "وقال لهما أحدكم: «أتمنى لكما كل خير. البسا ثيابا دافئة، وكلا طعاما جيدا!» دون أن يقدم لهما ما يحتاجان إليه من ثياب وطعام، فأي نفع في ذلك؟"]]}], "kwAr": "الذي يدعي", "noteAr": ""}, {"kw": "I know", "raw": "Hos_8:2, Hos_8:3; Tit_1:16", "note": "", "refs": [{"l": "Hos 8:2", "n": "", "vs": [[2, "يستغيثون بي قائلين: «ياإلهنا، إننا نعرفك، فنحن إسرائيل شعبك»."]]}, {"l": "Hos 8:3", "n": "", "vs": [[3, "غير أن إسرائيل قد مقت الخير، لهذا يطارده عدو."]]}, {"l": "Tit 1:16", "n": "", "vs": [[16, "يشهدون معترفين بأنهم يعرفون الله ، ولكنهم بأعمالهم ينكرونه، لأنهم مكروهون وغير طائعين، وقد تبين أنهم غير أهل لكل عمل صالح."]]}], "kwAr": "أنه قد عرفه", "noteAr": ""}, {"kw": "is a", "raw": "1Jo_1:6, 1Jo_1:8", "note": "", "refs": [{"l": "1Jo 1:6", "n": "", "vs": [[6, "فإن كنا ندعي أن لنا شركة معه، ونحن نعيش في الظلام، نكون كاذبين ولا نمارس الحق."]]}, {"l": "1Jo 1:8", "n": "", "vs": [[8, "إن كنا ندعي أن لا خطيئة لنا، نخدع أنفسنا، ولا يكون الحق في داخلنا."]]}], "kwAr": "يكون كاذبا", "noteAr": ""}], "arS": [["فالذي ", []], ["يدعي", ["G3004"]], [" أنه قد ", []], ["عرفه", ["G1097"]], ["، ولكنه لا ", []], ["يعمل", ["G5083"]], [" ", []], ["بوصاياه", ["G1785"]], ["، يكون ", []], ["كاذبا", ["G5583"]], [" ولا يكون ", []], ["الحق", ["G225"]], [" في داخله.", []]]}, {"c": 2, "v": 5, "text": "أما الذي يعمل بحسب كلمة المسيح، فإن محبة الله تكون قد اكتملت في داخله. بهذا نعرف أننا ننتمي إلى المسيحِ.", "groups": [{"kw": "whoso", "raw": "1Jo_2:3, 1Jo_2:4; Psa_105:45, Psa_106:3, Psa_119:2, Psa_119:4, Psa_119:146; Pro_8:32, Pro_28:7; Ecc_8:5; Eze_36:27; Luk_11:28; Joh_14:21, Joh_14:23; Rev_12:17, Rev_14:12", "note": "", "refs": [{"l": "1Jo 2:3", "n": "", "vs": [[3, "وما يؤكد لنا أننا قد عرفنا المسيح حقا هو أن نعمل بوصاياه."]]}, {"l": "1Jo 2:4", "n": "", "vs": [[4, "فالذي يدعي أنه قد عرفه، ولكنه لا يعمل بوصاياه، يكون كاذبا ولا يكون الحق في داخله."]]}, {"l": "Psa 105:45", "n": "", "vs": [[45, "ليمارسوا فرائضه ويطيعوا شرائعه. هللويا."]]}, {"l": "Psa 106:3", "n": "", "vs": [[3, "طوبى للعاملين بالعدل والبر في كل حين."]]}, {"l": "Psa 119:2", "n": "", "vs": [[2, "طوبى لمن يحفظون وصايا الرب، الذين يطلبونه بكل القلب،"]]}, {"l": "Psa 119:4", "n": "", "vs": [[4, "أنت أوصيت بحفظ وصاياك والعمل بها كلها."]]}, {"l": "Psa 119:146", "n": "", "vs": [[146, "إياك دعوت فخلصني لأطيع شهاداتك."]]}, {"l": "Pro 8:32", "n": "", "vs": [[32, "والآن أصغوا إلي أيها الأبناء، إذ طوبى لمن يمارسون طرقي."]]}, {"l": "Pro 28:7", "n": "", "vs": [[7, "من يحافظ على الشريعة هو ابن حكيم، أما عشير الجشعين فيخجل أباه."]]}, {"l": "Ecc 8:5", "n": "", "vs": [[5, "من يطع الأمر لا يلق أذى، وقلب الحكيم يدرك الوقت المناسب وأسلوب القضاء."]]}, {"l": "Eze 36:27", "n": "", "vs": [[27, "وأضع روحي في داخلكم فأجعلكم تمارسون فرائضي وتطيعون أحكامي عاملين بها،"]]}, {"l": "Luk 11:28", "n": "", "vs": [[28, "إلا أنه قال: «بل طوبى للذين يسمعون كلمة الله ويعملون بها»."]]}, {"l": "Joh 14:21", "n": "", "vs": [[21, "من كانت عنده وصاياي، ويعمل بها، فذاك يحبني. والذي يحبني، يحبه أبي، وأنا أحبه وأعلن له ذاتي»."]]}, {"l": "Joh 14:23", "n": "", "vs": [[23, "أجابه يسوع: «من يحبني يعمل بكلمتي، ويحبه أبي، وإليه نأتي، وعنده نجعل لنا منزلا."]]}, {"l": "Rev 12:17", "n": "", "vs": [[17, "فاغتاظ التنين من المرأة وشن حربا على باقي أولادها الذين يعملون بوصايا الله وعندهم الشهادة ليسوع."]]}, {"l": "Rev 14:12", "n": "", "vs": [[12, "وهنا يظهر صبر القديسين الذين يحافظون على وصايا الله والإيمان بيسوع!»"]]}], "kwAr": "الذي يعمل بحسب كلمة المسيح", "noteAr": ""}, {"kw": "in him", "raw": "1Jo_4:12, 1Jo_4:18; Jam_2:22", "note": "", "refs": [{"l": "1Jo 4:12", "n": "", "vs": [[12, "إن الله لم يره أحد من الناس قط. ولكن، حين نحب بعضنا بعضا، نبين أن الله يحيا في داخلنا، وأن محبته قد اكتملت في داخلنا."]]}, {"l": "1Jo 4:18", "n": "", "vs": [[18, "ليس في المحبة أي خوف. بل المحبة الكاملة تطرد الخوف خارجا. فإن الخوف يأتي من العقاب. والخائف لا تكون محبة الله قد اكتملت فيه."]]}, {"l": "Jam 2:22", "n": "", "vs": [[22, "فأنت ترى أن إيمان إبراهيم قد رافقته الأعمال. فبالأعمال قد اكتمل الإيمان."]]}], "kwAr": "محبة الله تكون قد اكتملت", "noteAr": ""}, {"kw": "hereby", "raw": "1Jo_2:27, 1Jo_2:28, 1Jo_3:24, 1Jo_4:13, 1Jo_4:15, 1Jo_4:16, 1Jo_5:20; Joh_6:56, Joh_15:5; Rom_8:1; 1Co_1:30; 2Co_5:17, 2Co_5:21; Col_2:9, Col_2:10", "note": "", "refs": [{"l": "1Jo 2:27", "n": "", "vs": [[27, "أما أنتم فقد نلتم من الله مسحة تبقى فيكم دائما. ولذلك، لستم بحاجة إلى من يعلمكم الحق. فتلك المسحة عينها هي التي تعلمكم كل شيء. وهي حق وليست كذبا. فكما علمتكم اثبتوا في المسيح."]]}, {"l": "1Jo 2:28", "n": "", "vs": [[28, "والآن، أيها الأولاد، كونوا ثابتين في المسيح، حتى تكون لنا نحن ثقة أمامه، ولا نخجل منه، عندما يعود."]]}, {"l": "1Jo 3:24", "n": "", "vs": [[24, "وكل من يطيع وصايا الله، فإنه يثبت في الله، والله يثبت فيه. والذي يؤكد لنا أن الله يثبت فينا، هو الروح القدس الذي وهبه لنا."]]}, {"l": "1Jo 4:13", "n": "", "vs": [[13, "وما يؤكد لنا أننا نثبت في الله، وأنه يثبت فينا هو أنه وهب لنا من روحه."]]}, {"l": "1Jo 4:15", "n": "", "vs": [[15, "من يعترف بأن يسوع هو ابن الله، فإن الله يثبت فيه، وهو يثبت في الله،"]]}, {"l": "1Jo 4:16", "n": "", "vs": [[16, "ونحن أنفسنا اختبرنا المحبة التي خصنا الله بها، ووضعنا ثقتنا فيها. إن الله محبة. ومن يثبت في المحبة، فإنه يثبت في الله، والله يثبت فيه."]]}, {"l": "1Jo 5:20", "n": "", "vs": [[20, "وإننا نعلم أن ابن الله قد جاء إلى الأرض وأنار أذهاننا لنعرف الإله الحق. ونحن الآن نحيا فيه، لأننا في ابنه يسوع المسيح. هذا هو الإله الحق، والحياة الأبدية."]]}, {"l": "Joh 6:56", "n": "", "vs": [[56, "وكل من يأكل جسدي ويشرب دمي، يثبت في وأنا فيه."]]}, {"l": "Joh 15:5", "n": "", "vs": [[5, "أنا الكرمة وأنتم الأغصان. من يثبت في وأنا فيه، فذاك ينتج ثمرا كثيرا. فإنكم بمعزل عني لا تقدرون أن تفعلوا شيئا."]]}, {"l": "Rom 8:1", "n": "", "vs": [[1, "فالآن إذا ليس على الذين في المسيح يسوع أية دينونة بعد."]]}, {"l": "1Co 1:30", "n": "", "vs": [[30, "وبفضل الله صار لكم مقام في المسيح يسوع الذي جعل لنا حكمة من الله وبرا وقداسة وفداء،"]]}, {"l": "2Co 5:17", "n": "", "vs": [[17, "فإنه إذا كان أحد في المسيح، فهو خليقة جديدة: إن الأشياء القديمة قد زالت، وها كل شيء قد صار جديدا."]]}, {"l": "2Co 5:21", "n": "", "vs": [[21, "فإن الذي لم يعرف خطيئة، جعله الله خطيئة لأجلنا، لنصير نحن بر الله فيه."]]}, {"l": "Col 2:9", "n": "", "vs": [[9, "فإنه فيه، جسديا، يحل الله بكل ملئه،"]]}, {"l": "Col 2:10", "n": "", "vs": [[10, "وأنتم مكملون فيه. فهو رأس كل رئاسة وسلطة؛"]]}], "kwAr": "بهذا نعرف", "noteAr": ""}], "arS": [["أما الذي ", []], ["يعمل", ["G5083"]], [" بحسب ", []], ["كلمة", ["G3056"]], [" المسيح، فإن ", []], ["محبة", ["G26"]], [" ", []], ["الله", ["G2316"]], [" تكون قد ", []], ["اكتملت", ["G5048"]], [" في داخله. بهذا ", []], ["نعرف", ["G1097"]], [" أننا ننتمي إلى المسيحِ.", []]]}, {"c": 2, "v": 6, "text": "كل من يعترف أنه ثابت في المسيح، يلتزم أن يسلك كما سلك المسيح!", "groups": [{"kw": "that saith", "raw": "1Jo_2:4, 1Jo_1:6", "note": "", "refs": [{"l": "1Jo 2:4", "n": "", "vs": [[4, "فالذي يدعي أنه قد عرفه، ولكنه لا يعمل بوصاياه، يكون كاذبا ولا يكون الحق في داخله."]]}, {"l": "1Jo 1:6", "n": "", "vs": [[6, "فإن كنا ندعي أن لنا شركة معه، ونحن نعيش في الظلام، نكون كاذبين ولا نمارس الحق."]]}], "kwAr": "كل من يعترف", "noteAr": ""}, {"kw": "he", "raw": "1Jo_2:28, 1Jo_3:6; Joh_15:4-6", "note": "", "refs": [{"l": "1Jo 2:28", "n": "", "vs": [[28, "والآن، أيها الأولاد، كونوا ثابتين في المسيح، حتى تكون لنا نحن ثقة أمامه، ولا نخجل منه، عندما يعود."]]}, {"l": "1Jo 3:6", "n": "", "vs": [[6, "فكل من يثبت فيه، لا يمارس الخطيئة. أما الذين يمارسون الخطيئة، فهم لم يروه ولم يتعرفوا به قط."]]}, {"l": "Joh 15:4-6", "n": "", "vs": [[4, "فاثبتوا في وأنا فيكم. كما أن الغصن لا يقدر أن ينتج ثمرا إلا إذا ثبت في الكرمة؛ فكذلك أنتم، إلا إذا ثبتم في."], [5, "أنا الكرمة وأنتم الأغصان. من يثبت في وأنا فيه، فذاك ينتج ثمرا كثيرا. فإنكم بمعزل عني لا تقدرون أن تفعلوا شيئا."], [6, "إن كان أحد لا يثبت في يطرح خارجا كالغصن فيجف؛ ثم تجمع الأغصان الجافة، وتطرح في النار فتحترق."]]}], "kwAr": "ثابت في المسيح", "noteAr": ""}, {"kw": "to walk", "raw": "1Jo_1:7; Psa_85:13; Mat_11:29; Joh_13:15; 1Co_11:1; Eph_5:2; 1Pe_2:21", "note": "", "refs": [{"l": "1Jo 1:7", "n": "", "vs": [[7, "ولكن، إن كنا فعلا نعيش في النور، كما هو في النور، تكون لنا حقا شركة بعضنا مع بعض، ودم ابنه يسوع يطهرنا من كل خطيئة."]]}, {"l": "Psa 85:13", "n": "", "vs": [[13, "يتقدمه البر، ويمهد الطريق لخطواته."]]}, {"l": "Mat 11:29", "n": "", "vs": [[29, "احملوا نيري عليكم، وتتلمذوا على يدي، لأني وديع ومتواضع القلب، فتجدوا الراحة لنفوسكم."]]}, {"l": "Joh 13:15", "n": "", "vs": [[15, "فقد قدمت لكم مثالا لكي تعملوا مثل ما عملت أنا لكم."]]}, {"l": "1Co 11:1", "n": "", "vs": [[1, "فاقتدوا بي كما أقتدي أنا بالمسيح!"]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "1Pe 2:21", "n": "", "vs": [[21, "لأن الله دعاكم إلى الاشتراك في هذا النوع من الآلام. فالمسيح، الذي تألم لأجلكم، هو القدوة التي تقتدون بها. فسيروا على آثار خطواته:"]]}], "kwAr": "يسلك كما سلك المسيح", "noteAr": ""}], "arS": [["كل من ", []], ["يعترف", ["G3004"]], [" أنه ", []], ["ثابت", ["G3306"]], [" في المسيح، ", []], ["يلتزم", ["G3784"]], [" أن ", []], ["يسلك", ["G4043"]], [" كما ", []], ["سلك", ["G4043"]], [" المسيح!", []]]}, {"c": 2, "v": 7, "text": "أيها الأحباء، أنا لا أكتب إليكم هنا وصية جديدة، بل وصية قديمة كانت عندكم منذ البداية، وهي الكلمة التي سمعتموها قبلا.", "groups": [{"kw": "I write", "raw": "1Jo_3:11; Act_17:19; 2Jo_1:5", "note": "", "refs": [{"l": "1Jo 3:11", "n": "", "vs": [[11, "فالوصية التي سمعتموها منذ البداية، هي أن يحب بعضنا بعضا،"]]}, {"l": "Act 17:19", "n": "", "vs": [[19, "ثم قادوه إلى تلة أريوباغوس (حيث مجلس المدينة) وسألوه: «هل لنا أن نعرف ما هو المذهب الجديد الذي تنادي به؟"]]}, {"l": "2Jo 1:5", "n": "", "vs": [[5, "وا لآن، أيتها السيدة، لي رجاء أطلبه منك، ولا تعتبريه وصية جديدة. وإنما هو تلك الوصية الموجودة عندنا منذ البداية،: أن يحب بعضنا بعضا."]]}], "kwAr": "لا أكتب إليكم وصية جديدة", "noteAr": ""}, {"kw": "but", "raw": "Lev_19:18, Lev_19:34; Deu_6:5; Mat_5:43, Mat_22:37-40; Mar_12:29-34; Rom_13:8-10; Gal_5:13, Gal_5:14; Jam_2:8-12", "note": "", "refs": [{"l": "Lev 19:18", "n": "", "vs": [[18, "لا تنتقم ولا تحقد على أحد أبناء شعبك، ولكن تحب قريبك كما تحب نفسك، فأنا الرب."]]}, {"l": "Lev 19:34", "n": "", "vs": [[34, "وليكن لكم الغريب المقيم عندكم كالمواطن. تحبه كما تحب نفسك، لأنكم كنتم غرباء في أرض مصر. فأنا الرب."]]}, {"l": "Deu 6:5", "n": "", "vs": [[5, "فأحبوا الرب إلهكم من كل قلوبكم ونفوسكم وقوتكم."]]}, {"l": "Mat 5:43", "n": "", "vs": [[43, "وسمعتم أنه قيل: تحب قريبك وتبغض عدوك."]]}, {"l": "Mat 22:37-40", "n": "", "vs": [[37, "فأجابه: «أحب الرب إلهك بكل قلبك وكل نفسك وكل فكرك!"], [38, "هذه هي الوصية العظمى الأولى."], [39, "والثانية مثلها: أحب قريبك كنفسك!"], [40, "بهاتين الوصيتين تتعلق الشريعة وكتب الأنبياء! »"]]}, {"l": "Mar 12:29-34", "n": "", "vs": [[29, "فأجابه يسوع: «أولى الوصايا جميعا هي: اسمع ياإسرائيل، الرب إلهنا رب واحد"], [30, "فأحب الرب إلهك بكل قلبك وبكل نفسك وبكل فكرك وبكل قوتك. هذه هي الوصية الأولى."], [31, "وهناك ثانية مثلها، وهي أن تحب قريبك كنفسك. فما من وصية أخرى أعظم من هاتين»."], [32, "فقال له الكاتب: «صحيح، يامعلم! حسب الحق تكلمت. فإن الله واحد وليس آخر سواه."], [33, "ومحبته بكل القلب وبكل الفهم وبكل القوة، ومحبة القريب كالنفس، أفضل من جميع المحرقات والذبائح!»"], [34, "فلما رأى يسوع أنه أجاب بحكمة، قال له: «لست بعيدا عن ملكوت الله!» ولم يجرؤ أحد بعد ذلك أن يوجه إليه أي سؤال."]]}, {"l": "Rom 13:8-10", "n": "", "vs": [[8, "لا تكونوا في دين لأحد، إلا بأن يحب بعضكم بعضا. فإن من يحب غيره، يكون قد تمم الشريعة،"], [9, "لأن الوصايا «لا تزن، لا تقتل، لا تسرق، لا تشهد زورا، لا تشته....» وباقي الوصايا، تتلخص في هذه الكلمة: «أحب قريبك كنفسك!»"], [10, "فالمحبة لا تعمل سوءا للقريب. وهكذا تكون المحبة إتماما للشريعة كلها."]]}, {"l": "Gal 5:13", "n": "", "vs": [[13, "فإنما إلى الحرية قد دعيتم، أيها الإخوة؛ ولكن لا تتخذوا من الحرية ذريعة لإرضاء الجسد، بل بالمحبة كونوا عبيدا في خدمة أحدكم الآخر."]]}, {"l": "Gal 5:14", "n": "", "vs": [[14, "فإن الشريعة كلها تتم في وصية واحدة: «أن تحب قريبك كنفسك»."]]}, {"l": "Jam 2:8-12", "n": "", "vs": [[8, "ما أحسن عملكم حين تطبقون تلك القاعدة الملوكية الواردة في الكتاب: «تحب قريبك كما تحب نفسك!»"], [9, "ولكن عندما تعاملون الناس بالانحياز والتمييز، ترتكبون خطيئة وتحكم عليكم الشريعة باعتباركم مخالفين لها."], [10, "فأنتم تعرفون أن من يطيع جميع الوصايا الواردة في شريعة موسى، ويخالف واحدة منها فقط، يصير مذنبا، تماما كالذي يخالف الوصايا كلها."], [11, "فإن الله ، مثلا، قال: «لا تزن» كما قال: «لا تقتل!» فإن لم تزن، ولكن قتلت، فقد خرقت الشريعة."], [12, "إذن، تصرفوا في القول والعمل بحسب قانون الحرية، كأنكم سوف تحاكمون وفقا له."]]}], "kwAr": "بل وصية قديمة", "noteAr": ""}], "arS": [["أيها ", []], ["الأحباء", ["G80"]], ["، أنا لا ", []], ["أكتب", ["G1125"]], [" إليكم هنا ", []], ["وصية", ["G1785"]], [" ", []], ["جديدة", ["G2537"]], ["، بل ", []], ["وصية", ["G1785"]], [" ", []], ["قديمة", ["G3820"]], [" كانت عندكم منذ ", []], ["البداية", ["G746"]], ["، وهي ", []], ["الكلمة", ["G3056"]], [" التي ", []], ["سمعتموها", ["G191"]], [" قبلا.", []]]}, {"c": 2, "v": 8, "text": "ومع ذلك فالوصية التي أكتبها إليكم، هي جديدة دائما، وتتضح حقيقتها في المسيح كما تتضح فيكم أنتم. ذلك لأن الظلام قد بدأ يزول منذ أن أشرق النور الحقيقي الذي مازال الآن مشرقا.", "groups": [{"kw": "a new", "raw": "1Jo_4:21; Joh_13:34, Joh_15:12", "note": "", "refs": [{"l": "1Jo 4:21", "n": "", "vs": [[21, "فهذه الوصية جاءتنا من المسيح نفسه: من يحب الله ، يحب أخاه!"]]}, {"l": "Joh 13:34", "n": "", "vs": [[34, "وصية جديدة أنا أعطيكم: أحبوا بعضكم بعضا، كما أحببتكم أنا، تحبون بعضكم."]]}, {"l": "Joh 15:12", "n": "", "vs": [[12, "وصيتي لكم هي هذه: أن يحب بعضكم بعضا كما أنا أحببتكم."]]}], "kwAr": "وصية جديدة", "noteAr": ""}, {"kw": "which", "raw": "1Jo_3:14-16, 1Jo_4:11; Joh_15:12-15; 2Co_8:9; Eph_5:1, Eph_5:2; 1Pe_1:21, 1Pe_4:1-3", "note": "", "refs": [{"l": "1Jo 3:14-16", "n": "", "vs": [[14, "إن فتم المسيح الكائن منذ البداية. كتبت إليكم، أيها الشباب، لأنكم أقوياء، وقد ترسخت كلمة الله في قلوبكم، وغلبتم إبليس الشرير."]]}, {"l": "Psa 148:12", "n": "", "vs": [[12, "الفتيان والفتيات والشيوخ والشبان،"]]}, {"l": "Pro 20:29", "n": "", "vs": [[29, "فخر الشبان في قوتهم، أما بهاء الشيوخ ففي مشييهم."]]}, {"l": "Joe 2:28", "n": "", "vs": [[28, "ثم أسكب روحي على كل بشر، فيتنبأ أبناؤكم وبناتكم، ويحلم شيوخكم أحلاما ويرى شبابكم رؤى."]]}, {"l": "Zec 9:17", "n": "", "vs": [[17, "فما أجملهم وما أبهاهم! الحنطة تجعل الفتيان أكثر ازدهارا، والخمرة تجعل الفتيات أكثر نضرة»."]]}, {"l": "Tit 2:6", "n": "", "vs": [[6, "كذلك عظ الشبان أن يكونوا متعقلين،"]]}], "kwAr": "أيها الشباب", "noteAr": ""}, {"kw": "because", "raw": "1Jo_4:4, 1Jo_5:4, 1Jo_5:5; Eph_6:10-12; 1Pe_5:8, 1Pe_5:9", "note": "", "refs": [{"l": "1Jo 4:4", "n": "", "vs": [[4, "أيها الأولاد الصغار، أنتم من الله، وقد غلبتم الذين يقاومون المسيح: لأن الروح القدس الساكن فيكم أقوى من الروح الشرير المنتشر في العالم."]]}, {"l": "1Jo 5:4", "n": "", "vs": [[4, "ذلك لأن المولود من الله ينتصر على العالم. فالإيمان هو الذي يجعلنا ننتصر على العالم."]]}, {"l": "1Jo 5:5", "n": "", "vs": [[5, "ومن ينتصر على العالم إلا الذي يؤمن أن يسوع هو ابن الله؟"]]}, {"l": "Eph 6:10-12", "n": "", "vs": [[10, "وختاما، تشددوا في الرب وفي قدرة قوته."], [11, "البسوا سلاح الله الكامل، لتتمكنوا من الصمود في وجه مكايد إبليس."], [12, "فإن حربنا ليست ضد ذوي اللحم والدم، بل ضد الرئاسات، ضد السلطات، ضد أسياد العالم حكام هذا الظلام، ضد قوى الشر الروحية في الأماكن السماوية."]]}, {"l": "1Pe 5:8", "n": "", "vs": [[8, "تعقلوا وتنبهوا. إن خصمكم إبليس كأسد يزأر، يجول باحثا عن فريسة يبتلعها."]]}, {"l": "1Pe 5:9", "n": "", "vs": [[9, "فقاوموه، ثابتين في الإيمان. واذكروا أن إخوتكم المنتشرين في العالم يجتازون وسط هذه الآلام عينها."]]}], "kwAr": "لأنكم قد غلبتم", "noteAr": ""}, {"kw": "the wicked", "raw": "1Jo_3:12, 1Jo_5:18; Mat_13:19, Mat_13:38", "note": "", "refs": [{"l": "1Jo 3:12", "n": "", "vs": [[12, "لا أن نكون مثل قايين الذي قتل أخاه. فقايين كان من أولاد إبليس الشرير. ولماذا قتل أخاه؟ قتله لأن أعماله هو كانت شريرة، أما أعمال أخيه فكانت صالحة."]]}, {"l": "1Jo 5:18", "n": "", "vs": [[18, "نحن واثقون بأن كل من ولد من الله لا يمارس الخطيئة، لأن ابن الله يحميه فلا يمسه إبليس الشرير."]]}, {"l": "Mat 13:19", "n": "", "vs": [[19, "كل من يسمع كلمة الملكوت ولا يفهمها، يأتي الشرير ويخطف ما قد زرع في قلبه: هذا هو المزروع على الممرات."]]}, {"l": "Mat 13:38", "n": "", "vs": [[38, "والحقل هو العالم. والزرع الجيد هو بنو الملكوت. والزوان هو بنو الشرير."]]}], "kwAr": "إبليس الشرير", "noteAr": ""}, {"kw": "little", "raw": "1Jo_2:1, 1Jo_2:12", "note": "", "refs": [{"l": "1Jo 2:1", "n": "", "vs": [[1, "ياأولادي الصغار، أكتب إليكم هذه الأمور لكي لا تخطئوا. ولكن، إن أخطأ أحدكم، فلنا عند الآب شفيع هو يسوع المسيح البار."]]}, {"l": "1Jo 2:12", "n": "", "vs": [[12, "أكتب إليكم، أيها الأولاد، لأن الله قد غفر لكم خطاياكم إكراما لاسم المسيح."]]}], "kwAr": "أيها الأولاد الصغار", "noteAr": ""}, {"kw": "ye have known", "raw": "Mat_11:27; Luk_10:22; Joh_8:54, Joh_8:55, Joh_14:7, Joh_14:9, Joh_16:3, Joh_17:21; 2Co_4:6", "note": "", "refs": [{"l": "Mat 11:27", "n": "", "vs": [[27, "كل شيء قد سلمه إلي أبي. ولا أحد يعرف الابن إلا الآب، ولا أحد يعرف الآب إلا الابن، ومن أراد الابن أن يعلنه له."]]}, {"l": "Luk 10:22", "n": "", "vs": [[22, "كل شيء قد سلم إلي من قبل أبي، ولا أحد يعرف من هو الابن إلا الآب، ولا من هو الآب إلا الابن ومن أراد الابن أن يعلنه له!»"]]}, {"l": "Joh 8:54", "n": "", "vs": [[54, "أجابهم: «إن كنت أمجد نفسي، فليس مجدي بشيء. لكن أبي هو الذي يمجدني. وأنتم تقولون إنه إلهكم،"]]}, {"l": "Joh 8:55", "n": "", "vs": [[55, "مع أنكم لا تعرفونه. أما أنا فأعرفه. ولو قلت لكم إني لا أعرفه لكنت مثلكم كاذبا. لكني أعرفه وأعمل بكلمته."]]}, {"l": "Joh 14:7", "n": "", "vs": [[7, "إن كنتم قد عرفتموني، فقد عرفتم أبي أيضا، ومنذ الآن تعرفونه وقد رأيتموه»."]]}, {"l": "Joh 14:9", "n": "", "vs": [[9, "فأجابه يسوع: «مضت هذه المدة الطويلة وأنا معكم ولم تعرفني يافيلبس؟ الذي رآني رأى الآب، فكيف تقول: أرنا الآب؟"]]}, {"l": "Joh 16:3", "n": "", "vs": [[3, "وهم يفعلون هذا بكم لأنهم لم يعرفوا أبي، ولا عرفوني."]]}, {"l": "Joh 17:21", "n": "", "vs": [[21, "ليكون الجميع واحدا؛ أيها الآب، كما أنك أنت في وأنا فيك، ليكونوا هم أيضا واحدا فينا، لكي يؤمن العالم أنك أنت أرسلتني."]]}, {"l": "2Co 4:6", "n": "", "vs": [[6, "فإن الله ، الذي أمر أن يشرق نور من الظلام، هو الذي جعل النور يشرق في قلوبنا، لإشعاع معرفة مجد الله المتجلي في وجه المسيح."]]}], "kwAr": "عرفتم الآب", "noteAr": ""}], "arS": [["أكتب", ["G1125"]], [" إليكم أيها ", []], ["الآباء", ["G3962"]], ["، لأنكم قد ", []], ["عرفتم", ["G1097"]], [" المسيح الكائن منذ ", []], ["البداية", ["G746"]], [". ", []], ["أكتب", ["G1125"]], [" إليكم أيها ", []], ["الشباب", ["G3495"]], ["، لأنكم قد ", []], ["غلبتم", ["G3528"]], [" إبليس ", []], ["الشرير", ["G4190"]], [". ", []], ["كتبت", ["G1125"]], [" إليكم أيها ", []], ["الأولاد الصغار", ["G3813"]], ["، لأنكم قد ", []], ["عرفتم", ["G1097"]], [" ", []], ["الآب", ["G3962"]], [".", []]]}, {"c": 2, "v": 14, "text": "كتبت إليكم، أيها الآباء، لأنكم قد عرفتم المسيح الكائن منذ البداية. كتبت إليكم، أيها الشباب، لأنكم أقوياء، وقد ترسخت كلمة الله في قلوبكم، وغلبتم إبليس الشرير.", "groups": [{"kw": "fathers", "raw": "1Jo_2:13", "note": "", "refs": [{"l": "1Jo 2:13", "n": "", "vs": [[13, "أكتب إليكم أيها الآباء، لأنكم قد عرفتم المسيح الكائن منذ البداية. أكتب إليكم أيها الشباب، لأنكم قد غلبتم إبليس الشرير. كتبت إليكم أيها الأولاد الصغار، لأنكم قد عرفتم الآب."]]}], "kwAr": "أيها الآباء", "noteAr": ""}, {"kw": "because ye are", "raw": "Eph_6:10; Phi_4:13; Col_1:11; 2Ti_2:1", "note": "", "refs": [{"l": "Eph 6:10", "n": "", "vs": [[10, "وختاما، تشددوا في الرب وفي قدرة قوته."]]}, {"l": "Phi 4:13", "n": "", "vs": [[13, "إني أستطيع كل شيء، في المسيح الذي يقويني."]]}, {"l": "Col 1:11", "n": "", "vs": [[11, "متشددين بكل قوة موافقة لقدرة مجده، لتتمكنوا تماما من الاحتمال وطول البال،"]]}, {"l": "2Ti 2:1", "n": "", "vs": [[1, "وأنت ياولدي، فكن قويا في النعمة التي في المسيح يسوع."]]}], "kwAr": "لأنكم أقوياء", "noteAr": ""}, {"kw": "the word", "raw": "Psa_119:11; Joh_5:38, Joh_8:31, Joh_15:7; Col_3:16; Heb_8:10; 2Jo_1:2; 3Jo_1:3", "note": "", "refs": [{"l": "Psa 119:11", "n": "", "vs": [[11, "خبأت كلامك في قلبي، لئلا أخطيء إليك."]]}, {"l": "Joh 5:38", "n": "", "vs": [[38, "ولا ثبتت كلمته في قلوبكم، بدليل أنكم لا تصدقون الذي أرسله."]]}, {"l": "Joh 8:31", "n": "", "vs": [[31, "فقال لليهود الذين آمنوا به: «إن ثبتم في كلمتي، كنتم حقا تلاميذي."]]}, {"l": "Joh 15:7", "n": "", "vs": [[7, "ولكن، إن ثبتم في، وثبت كلامي فيكم، فاطلبوا ما تريدون يكن لكم."]]}, {"l": "Col 3:16", "n": "", "vs": [[16, "لتسكن كلمة المسيح في داخلكم بغنى، في كل حكمة، معلمين وواعظين بعضكم بعضا، مرنمين بمزامير وتسابيح وأناشيد روحية في قلوبكم لله، رافعين له الحمد."]]}, {"l": "Heb 8:10", "n": "", "vs": [[10, "فهذا هو العهد الذي أبرمه مع بني إسرائيل، بعد تلك الأيام، يقول الرب: أضع شرائعي داخل ضمائرهم، وأكتبها على قلوبهم، وأكون لهم إلها، وهم يكونون لي شعبا."]]}, {"l": "2Jo 1:2", "n": "", "vs": [[2, "بما أن الحق ثابت في قلوبنا، ولابد أن يرافقنا إلى الأبد،"]]}, {"l": "3Jo 1:3", "n": "", "vs": [[3, "فكم كان فرحي عظيما عندما مر بي بعض الإخوة المسافرين وأخبروني أنك تسلك بحسب الحق، وشهدوا للحق الثابت فيك!"]]}], "kwAr": "كلمة الله", "noteAr": ""}, {"kw": "ye have overcome", "raw": "Rev. 2:7-3:22", "note": "", "refs": [{"l": "Rev 2:7-3:22", "n": "", "vs": [[7, "من له أذنان فليسمع ما يقوله الروح للكنائس! كل من ينتصر سأطعمه من ثمر شجرة الحياة في فردوس الله."], [8, "واكتب إلى ملاك الكنيسة في سميرنا: إليك ما يقوله الأول والآخر، الذي كان ميتا وعاد حيا:"], [9, "إني أعلم كم تقاسي من ضيق وفقر، رغم أنك غني. وأعلم تجريح الذين يدعون أنهم يهود ولكنهم ليسوا يهودا، بل هم مجمع للشيطان!"], [10, "دع عنك الخوف مما ينتظرك من آلام، فإن إبليس سيزج ببعضكم في السجن لكي تمتحنوا، فتقاسون الاضطهاد عشرة أيام. فابق أمينا حتى الموت، فأمنحك إكليل الحياة."], [11, "من له أذن فليسمع ما يقوله الروح للكنائس! كل من ينتصر لن يلحق به أذى الموت الثاني!"], [12, "واكتب إلى ملاك الكنيسة في برغامس: إليك ما يقوله صاحب السيف القاطع ذي الحدين."], [13, "إني أعلم أين تسكن، حيث عرش الشيطان! ورغم ذلك تمسكت باسمي، ورفضت أن تنكر الإيمان بي، حتى في أيام أنتيباس شهيدي الأمين، الذي قتل عندكم حيث يسكن الشيطان!"], [14, "ولكني عاتب عليك قليلا لأنك تتسامح مع القوم الذين يتمسكون بتعليم بلعام عندما علم الملك بالاق أن يدمر بني إسرائيل بتوريطهم في ارتكاب الزنى والأكل من الذبائح المقدمة للأصنام،"], [15, "هكذا عندك أنت أيضا قوم يتمسكون بتعاليم النيقولاويين!"], [16, "عليك أن تتوب، وإلا جئتك سريعا لأحارب هؤلاء الضالين بالسيف الذي في فمي."], [17, "من له أذن فليسمع ما يقوله الروح للكنائس! كل من سينتصر سأطعمه من المن الخفي، وأعطيه حجرا صغيرا أبيض حفر عليه اسم جديد لا يعرفه إلا الذي يأخذه!"], [18, "واكتب إلى ملاك الكنيسة في ثياتيرا: إليك ما يقوله ابن الله الذي عيناه كلهيب نار ورجلاه كالنحاس النقي:"], [19, "إني عالم بأعمالك، ومحبتك، وإيمانك، وتضحيتك، وصبرك؛ وأعلم أن أعمالك الأخيرة زادت عما كانت عليه قبلا!"], [20, "ولكن لي عليك أنك تتساهل مع هذه المرأة إيزابل، التي تدعي أنها نبية، فتعلم عبيدي وتغويهم أن يزنوا ويأكلوا من الذبائح المقدمة للأصنام."], [21, "وقد أمهلتها مدة لتتوب تاركة زناها، ولكنها لم تتب."], [22, "فإني سألقيها على فراش، وأبتلي الزانين معها بمحنة شديدة، إن كانوا لا يتوبون عن أعمالهم."], [23, "سأبيد أولادها بالموت، فتعرف الكنائس كلها أنني أنا الذي أفحص الأفكار والقلوب، وأجازي كل واحد منكم بحسب أعماله."], [24, "أما أنتم، الباقين من أهل ثياتيرا، الذين لم يتقبلوا هذا التعليم الفاسد، ولم يعرفوا ما يدعونه «أسرار الشيطان العميقة»، فلن أحملكم أي عبء جديد."], [25, "فقط تمسكوا بما لديكم إلى أن أجيء."], [26, "كل من ينتصر، ويستمر حتى النهاية في فعل ما يرضيني، فسوف أعطيه سلطانا على الأمم،"], [27, "فيحكمهم بعصا من حديد، مثلما أخذت أنا من أبي سلطانا أحكمهم به، فيتحطمون كما تتحطم أواني الخزف،"], [28, "وأمنحه كوكب الصبح!"], [29, "من له أذن فليسمع ما يقوله الروح للكنائس!"], [1, "واكتب إلى ملاك الكنيسة في ساردس: إليك ما يقوله من له أرواح الله السبعة والنجوم السبعة: إني عالم بأعمالك. فأنت حي بالاسم، ولكنك ميت فعلا."], [2, "تيقظ، وما تبقى لديك أنعشه قبل أن يموت، لأني وجدت أعمالك غير كاملة في نظر إلهي."], [3, "تذكر ما سبق أن تقبلته وسمعته، وتمسك بما آمنت به، وتب! فإن كنت لا تتنبه، آتيك كما يأتي اللص، ولا تدري في أية ساعة أفاجئك!"], [4, "إلا أن عندك في ساردس قليلين لم يلوثوا ثيابهم بالنجاسة. هؤلاء سيسيرون معي لابسين ثيابا بيضاء."], [5, "كل من ينتصر سيلبس ثوبا أبيض، ولن أمحو اسمه من سجل الحياة، وسأعترف باسمه أمام أبي وملائكته."], [6, "من له أذن فليسمع ما يقوله الروح للكنائس!"], [7, "واكتب إلى ملاك الكنيسة في فيلادلفيا: إليك ما يقوله القدوس الحق، الذي بيده مفتاح داود، يفتح ولا أحد يغلق، ويغلق ولا أحد يفتح."], [8, "إني عالم بأعمالك. فمع أن لك قوة ضئيلة، فقد أطعت كلمتي ولم تنكر اسمي، ولذلك فتحت لك بابا لا يقدر أحد أن يغلقه."], [9, "أما الذين هم من مجمع الشيطان، ويدعون كذبا أنهم يهود، فسأجبرهم على أن يسجدوا عند قدميك، ويعترفوا بأني أحببتك."], [10, "ولأنك حفظت كلمتي وصبرت، فسأحفظك أنا أيضا من ساعة التجربة التي ستأتي على العالم أجمع لتجرب الساكنين على الأرض."], [11, "إني آت سريعا، فتمسك بما عندك، لئلا يسلب أحد إكليلك."], [12, "كل من ينتصر سأجعله عمودا في هيكل إلهي، فلا يخرج منه أبدا، وسأكتب عليه اسم إلهي واسم مدينة إلهي أورشليم الجديدة، التي تنزل من السماء من عند إلهي، وأكتب عليه اسمي الجديد."], [13, "من له أذن فليسمع ما يقوله الروح للكنائس!"], [14, "واكتب إلى ملاك الكنيسة في لاودكية: إليك ما يقوله الحق، الشاهد الأمين الصادق، رئيس خليقة الله:"], [15, "إني عالم بأعمالك، وأعلم أنك لست باردا ولا حارا. وليتك كنت باردا أو حارا!"], [16, "فبما أنك فاتر، لا حار ولا بارد، سألفظك من فمي!"], [17, "تقول: أنا غني، قد اغتنيت ولا يعوزني شيء! ولكنك لا تعلم أنك شقي بائس فقير أعمى عريا ن."], [18, "نصيحتي لك أن تشتري مني ذهبا نقيا، صفته النار، فتغتني حقا، وثيابا بيضاء ترتديها فتستر عريك المعيب، وكحلا لشفاء عينيك فيعود إليك البصر."], [19, "إني أوبخ وأؤدب من أحبه، لذا كن حارا وتب!"], [20, "ها أنا واقف خارج الباب أقرعه. إن سمع أحد صوتي وفتح الباب، أدخل إليه فأتعشى معه وهو معي."], [21, "وكل من ينتصر سأجلسه معي على عرشي، كما انتصرت أنا أيضا فجلست مع أبي على عرشه؛"], [22, "من له أذن فليسمع ما يقوله الروح للكنائس!»"]]}], "kwAr": "غلبتم إبليس الشرير", "noteAr": ""}], "arS": [["كتبت", ["G1125"]], [" إليكم، أيها ", []], ["الآباء", ["G3962"]], ["، لأنكم قد ", []], ["عرفتم", ["G1097"]], [" المسيح الكائن منذ ", []], ["البداية", ["G746"]], [". ",
