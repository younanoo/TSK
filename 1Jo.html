]], ["ونمارس", ["G4160"]], [" الأعمال التي ", []], ["ترضيه", ["G701"]], [".", []]]}, {"c": 3, "v": 23, "text": "وأما وصيته فهي أن نؤمن باسم ابنه يسوع المسيح، وأن يحب بعضنا بعضا كما أوصانا.", "groups": [{"kw": "his commandment", "raw": "Deu_18:15-19; Psa_2:12; Mar_9:7; Joh_6:29, Joh_14:1, Joh_17:3; Act_16:31; 1Ti_1:15", "note": "", "refs": [{"l": "Deu 18:15-19", "n": "", "vs": [[15, "سيقيم الرب فيكم نبيا مثلي من بني إسرائيل، له تسمعون،"], [16, "فقد استجاب الرب إلهكم ما طلبتم منه في حوريب في يوم الاجتماع عندما قلتم: لا نعود نسمع صوت الرب إلهنا، ولا نرى النار العظيمة أيضا لئلا نموت"], [17, "فقال لي الرب: لقد أصابوا في ما تكلموا."], [18, "لهذا أقيم لهم نبيا من بين إخوتهم مثلك، وأضع كلامي في فمه، فيخاطبهم بكل ما آمره به."], [19, "فيكون أن كل من يعصى كلامي الذي يتكلم به باسمي، فأنا أحاسبه."]]}, {"l": "Psa 2:12", "n": "", "vs": [[12, "قبلوا الابن لئلا يغضب، فتهلكوا في الطريق، لئلا يتوهج غضبه سريعا. طوبى لجميع المتكلين عليه."]]}, {"l": "Mar 9:7", "n": "", "vs": [[7, "وجاءت سحابة فخيمت عليهم، وانطلق صوت من السحابة يقول: «هذا هو ابني الحبيب. له اسمعوا!»"]]}, {"l": "Joh 6:29", "n": "", "vs": [[29, "أجاب يسوع: «العمل الذي يطلبه الله هو أن تؤمنوا بمن أرسله»."]]}, {"l": "Joh 14:1", "n": "", "vs": [[1, "«لا تضطرب قلوبكم. أنتم تؤمنون بالله، فآمنوا بي أيضا."]]}, {"l": "Joh 17:3", "n": "", "vs": [[3, "والحياة الأبدية هي أن يعرفوك أنت الإله الحق وحدك، والذي أرسلته: يسوع المسيح."]]}, {"l": "Act 16:31", "n": "", "vs": [[31, "فأجاباه: «آمن بالرب يسوع فتخلص أنت وأهل بيتك!»"]]}, {"l": "1Ti 1:15", "n": "", "vs": [[15, "ما أصدق هذا القول، وما أجدره بالتصديق الكلي: إن المسيح يسوع قد جاء إلى العالم ليخلص الخاطئين، وأنا أولهم!"]]}], "kwAr": "وصيته", "noteAr": ""}, {"kw": "love", "raw": "1Jo_3:11, 1Jo_2:8-10, 1Jo_4:21; Mat_22:39; Joh_13:34, Joh_15:12; Eph_5:2; 1Th_4:9; 1Pe_1:22, 1Pe_4:8", "note": "", "refs": [{"l": "1Jo 3:11", "n": "", "vs": [[11, "فالوصية التي سمعتموها منذ البداية، هي أن يحب بعضنا بعضا،"]]}, {"l": "1Jo 2:8-10", "n": "", "vs": [[8, "ومع ذلك فالوصية التي أكتبها إليكم، هي جديدة دائما، وتتضح حقيقتها في المسيح كما تتضح فيكم أنتم. ذلك لأن الظلام قد بدأ يزول منذ أن أشرق النور الحقيقي الذي مازال الآن مشرقا."], [9, "من ادعى أنه يحيا في النور، ولكنه يبغض أحد إخوته، فهو مازال حتى الآن في الظلام."], [10, "فالذي يحب إخوته، هو الذي يحيا في النور فعلا ولا شيء يسقطه."]]}, {"l": "1Jo 4:21", "n": "", "vs": [[21, "فهذه الوصية جاءتنا من المسيح نفسه: من يحب الله ، يحب أخاه!"]]}, {"l": "Mat 22:39", "n": "", "vs": [[39, "والثانية مثلها: أحب قريبك كنفسك!"]]}, {"l": "Joh 13:34", "n": "", "vs": [[34, "وصية جديدة أنا أعطيكم: أحبوا بعضكم بعضا، كما أحببتكم أنا، تحبون بعضكم."]]}, {"l": "Joh 15:12", "n": "", "vs": [[12, "وصيتي لكم هي هذه: أن يحب بعضكم بعضا كما أنا أحببتكم."]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "1Th 4:9", "n": "", "vs": [[9, "أما المحبة الأخوية، فلستم في حاجة لأن أكتب إليكم عنها، لأنكم بأنفسكم قد تعلمتم من الله أن تحبوا بعضكم بعضا،"]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}, {"l": "1Pe 4:8", "n": "", "vs": [[8, "لكن أهم شيء هو أن تبادلوا بعضكم بعضا المحبة الشديدة. لأن المحبة تستر إساءات كثيرة."]]}], "kwAr": "أن يحب بعضنا بعضا", "noteAr": ""}], "arS": [["وأما ", []], ["وصيته", ["G1785"]], [" فهي أن ", []], ["نؤمن", ["G4100"]], [" ", []], ["باسم", ["G3686"]], [" ", []], ["ابنه", ["G5207"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], ["، وأن ", []], ["يحب", ["G25"]], [" ", []], ["بعضنا بعضا", ["G240"]], [" كما ", []], ["أوصانا", ["G1785"]], [".", []]]}, {"c": 3, "v": 24, "text": "وكل من يطيع وصايا الله، فإنه يثبت في الله، والله يثبت فيه. والذي يؤكد لنا أن الله يثبت فينا، هو الروح القدس الذي وهبه لنا.", "groups": [{"kw": "he that", "raw": "1Jo_3:22; Joh_14:21-23, Joh_15:7-10", "note": "", "refs": [{"l": "1Jo 3:22", "n": "", "vs": [[22, "ومهما نطلب منه بالصلاة، نحصل عليه: لأننا نطيع ما يوصينا به، ونمارس الأعمال التي ترضيه."]]}, {"l": "Joh 14:21-23", "n": "", "vs": [[21, "من كانت عنده وصاياي، ويعمل بها، فذاك يحبني. والذي يحبني، يحبه أبي، وأنا أحبه وأعلن له ذاتي»."], [22, "فسأله يهوذا، غير الإسخريوطي: «ياسيد، ماذا جرى حتى تعلن لنا ذاتك ولا تعلنها للعالم؟»"], [23, "أجابه يسوع: «من يحبني يعمل بكلمتي، ويحبه أبي، وإليه نأتي، وعنده نجعل لنا منزلا."]]}, {"l": "Joh 15:7-10", "n": "", "vs": [[7, "ولكن، إن ثبتم في، وثبت كلامي فيكم، فاطلبوا ما تريدون يكن لكم."], [8, "بهذا يتمجد أبي: أن تنتجوا ثمرا كثيرا فتكونون حقا تلاميذي."], [9, "مثلما أحبني الآب، أحببتكم أنا، فاثبتوا في محبتي."], [10, "إن عملتم بوصاياي، تثبتون في محبتي، كما عملت أنا بوصايا أبي وأثبت في محبته!"]]}], "kwAr": "من يطيع وصايا الله", "noteAr": ""}, {"kw": "dwelleth", "raw": "1Jo_4:7, 1Jo_4:12, 1Jo_4:15, 1Jo_4:16; Joh_6:54-56, Joh_17:21; 1Co_3:16, 1Co_6:19; 2Co_6:16; 2Ti_1:14", "note": "", "refs": [{"l": "1Jo 4:7", "n": "", "vs": [[7, "أيها الأحباء، لنحب بعضنا بعضا: لأن المحبة تصدر من الله. إذن، كل من يحب، يكون مولودا من الله ويعرف الله ."]]}, {"l": "1Jo 4:12", "n": "", "vs": [[12, "إن الله لم يره أحد من الناس قط. ولكن، حين نحب بعضنا بعضا، نبين أن الله يحيا في داخلنا، وأن محبته قد اكتملت في داخلنا."]]}, {"l": "1Jo 4:15", "n": "", "vs": [[15, "من يعترف بأن يسوع هو ابن الله، فإن الله يثبت فيه، وهو يثبت في الله،"]]}, {"l": "1Jo 4:16", "n": "", "vs": [[16, "ونحن أنفسنا اختبرنا المحبة التي خصنا الله بها، ووضعنا ثقتنا فيها. إن الله محبة. ومن يثبت في المحبة، فإنه يثبت في الله، والله يثبت فيه."]]}, {"l": "Joh 6:54-56", "n": "", "vs": [[54, "من يأكل جسدي ويشر ب دمي، فله حياة أبدية، وأنا أقيمه في اليوم الأخير،"], [55, "لأن جسدي هو الطعام الحقيقي، ودمي هو الشراب الحقيقي."], [56, "وكل من يأكل جسدي ويشرب دمي، يثبت في وأنا فيه."]]}, {"l": "Joh 17:21", "n": "", "vs": [[21, "ليكون الجميع واحدا؛ أيها الآب، كما أنك أنت في وأنا فيك، ليكونوا هم أيضا واحدا فينا، لكي يؤمن العالم أنك أنت أرسلتني."]]}, {"l": "1Co 3:16", "n": "", "vs": [[16, "ألا تعرفون أنكم هيكل الله وأن روح الله ساكن فيكم؟"]]}, {"l": "1Co 6:19", "n": "", "vs": [[19, "أما تعلمون أن جسدكم هو هيكل للروح القدس الساكن فيكم والذي هو لكم من الله، وأنكم أنتم لستم ملكا لأنفسكم؟"]]}, {"l": "2Co 6:16", "n": "", "vs": [[16, "وأي وفاق لهيكل الله مع الأصنام؟ فإننا نحن هيكل الله الحي، وفقا لما قاله الله : «سأسكن في وسطهم، وأسير بينهم، وأكون إلههم وهم يكونون شعبا لي…"]]}, {"l": "2Ti 1:14", "n": "", "vs": [[14, "وحافظ على الأمانة الكريمة المودعة لديك، بالروح القدس الحال فينا."]]}], "kwAr": "يثبت في الله", "noteAr": ""}, {"kw": "we", "raw": "1Jo_4:13; Rom_8:9-17; Gal_4:5, Gal_4:6", "note": "", "refs": [{"l": "1Jo 4:13", "n": "", "vs": [[13, "وما يؤكد لنا أننا نثبت في الله، وأنه يثبت فينا هو أنه وهب لنا من روحه."]]}, {"l": "Rom 8:9-17", "n": "", "vs": [[9, "وأما أنتم، فلستم تحت سلطة الجسد بل تحت سلطة الروح، إذا كان روح الله ساكنا في داخلكم حقا. ولكن، إن كان أحد ليس له روح المسيح، فهو ليس للمسيح."], [10, "وإذا كان المسيح فيكم، فمع أن الجسد مائت بسبب الخطيئة، فإن الروح حياة لكم بسبب البر."], [11, "وإذا كان روح الذي أقام يسوع من بين الأموات يسكن فيكم، فإن الذي أقام المسيح من بين الأموات سوف يحيي أيضا أجسادكم الفانية بسبب روحه الذي يسكن فيكم."], [12, "فليس علينا إذن، أيها الإخوة، أي التزام نحو الجسد لنعيش بحسب الجسد."], [13, "لأنه إن عشتم بحسب الجسد، فإنكم ستموتون، ولكن إن كنتم بالروح تميتون أعمال الجسد، فستحيون."], [14, "فإن جميع الخاضعين لقيادة روح الله، هم أبناء لله."], [15, "إذ إنكم لم تنالوا روح عبودية يعيدكم إلى الخوف، بل نلتم روح بنوة به نصرخ: «أبا! أبانا!»"], [16, "فالروح نفسه يشهد مع أرواحنا بأننا أولاد الله."], [17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}, {"l": "Gal 4:5", "n": "", "vs": [[5, "ليحرر بالفداء أولئك الخاضعين للشريعة، فننال جميعا مقام أبناء الله."]]}, {"l": "Gal 4:6", "n": "", "vs": [[6, "وبما أنكم أبناء له، أرسل الله إلى قلوبنا روح ابنه، مناديا: «أبا، ياأبانا»."]]}], "kwAr": "الروح القدس الذي وهبه لنا", "noteAr": ""}], "arS": [["وكل من ", []], ["يطيع", ["G5083"]], [" ", []], ["وصايا", ["G1785"]], [" الله، فإنه ", []], ["يثبت", ["G3306"]], [" في الله، والله يثبت فيه. والذي ", []], ["يؤكد", ["G1097"]], [" لنا أن الله ", []], ["يثبت", ["G3306"]], [" فينا، هو ", []], ["الروح", ["G4151"]], [" القدس الذي ", []], ["وهبه", ["G1325"]], [" لنا.", []]]}, {"c": 4, "v": 1, "text": "أيها الأحباء، لا تصدقوا كل روح، بل امتحنوا الأرواح لتعرفوا ما إذا كانت من عند الله أم لا، لأن عددا كبيرا من الأنبياء الدجالين قد انتشر في العالم.", "groups": [{"kw": "believe not", "raw": "Deu_13:1-5; Pro_14:15; Jer_5:31, Jer_29:8, Jer_29:9; Mat_7:15, Mat_7:16, Mat_24:4, Mat_24:5; Rom_16:18; 2Pe_2:1", "note": "", "refs": [{"l": "Deu 13:1-5", "n": "", "vs": [[1, "إذا ظهر بينكم نبي أو صاحب أحلام، وتنبأ بوقوع آية أو أعجوبة."], [2, "فتحققت تلك الآية أو الأعجوبة التي تنبأ بها، ثم قال: هلم نذهب وراء آلهة أخرى لم تعرفوها ونعبدها."], [3, "فلا تصغوا إلى كلام ذلك النبي أو صاحب الأحلام، لأن الرب إلهكم يجربكم ليرى إن كنتم تحبونه من كل قلوبكم ومن كل أنفسكم،"], [4, "فاتبعوا الرب إلهكم واتقوه، وأطيعوا وصاياه واسمعوا صوته، واعبدوه وتمسكوا به."], [5, "أما ذلك النبي أو الحالم فإنه يقتل، لأنه نطق بالبهتان ضد الرب إلهكم الذي أخرجكم من ديار مصر، وفداكم من نير العبودية، ليضلكم عن الطريق التي أمركم بسلوكها، فتستأصلون الشر من بينكم."]]}, {"l": "Pro 14:15", "n": "", "vs": [[15, "الغبي يصدق كل كلمة تقال له، والعاقل يتنبه إلى موقع خطواته."]]}, {"l": "Jer 5:31", "n": "", "vs": [[31, "فالأنبياء يتنبأون زورا، والكهنة يتصرفون بمقتضى أحكامهم، وشعبي أحب مثل هذا. ولكن ماذا تصنعون في نهاية المطاف؟»"]]}, {"l": "Jer 29:8", "n": "", "vs": [[8, "لأن هذا ما يعلنه الرب القدير إله إسرائيل: لا يخدعنكم أنبياؤكم الكذبة المقيمون في وسطكم، والعرافون. لا تستمعوا إلى أحلامهم التي توهمكم بالأمل،"]]}, {"l": "Jer 29:9", "n": "", "vs": [[9, "لأنهم يتنبأون لكم باسمي كذبا، وأنا لم أبعثهم»، يقول الرب."]]}, {"l": "Mat 7:15", "n": "", "vs": [[15, "احذروا الأنبياء الدجالين الذين يأتون إليكم لابسين ثياب الحملان، ولكنهم من الداخل ذئاب خاطفة!"]]}, {"l": "Mat 7:16", "n": "", "vs": [[16, "من ثمارهم تعرفونهم. هل يجنى من الشوك عنب، أو من العليق تين؟"]]}, {"l": "Mat 24:4", "n": "", "vs": [[4, "فأجاب يسوع: «انتبهوا! لا يضللكم أحد!"]]}, {"l": "Mat 24:5", "n": "", "vs": [[5, "فإن كثيرين سيأتون باسمي قائلين إني أنا هو المسيح، فيضللون كثيرين."]]}, {"l": "Rom 16:18", "n": "", "vs": [[18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."]]}, {"l": "2Pe 2:1", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."]]}], "kwAr": "لا تصدقوا كل روح", "noteAr": ""}, {"kw": "try", "raw": "Luk_12:57; Act_17:11; Rom_16:19; 1Co_14:29; 1Th_5:21; Rev_2:2", "note": "", "refs": [{"l": "Luk 12:57", "n": "", "vs": [[57, "ولماذا لا تميزون ما هو حق من تلقاء أنفسكم؟"]]}, {"l": "Act 17:11", "n": "", "vs": [[11, "وكان يهود بيرية أشرف من يهود تسالونيكي، فقبلوا كلمة الله برغبة شديدة، وأخذوا يدرسون الكتاب يوميا ليتأكدوا من صحة التعليم."]]}, {"l": "Rom 16:19", "n": "", "vs": [[19, "إن خبر طاعتكم قد بلغ الجميع. ولذلك أفرح بكم، ولكن أريد لكم أن تكونوا حكماء في ما هو خير، وبسطاء في ما هو شر."]]}, {"l": "1Co 14:29", "n": "", "vs": [[29, "وليتكلم أيضا اثنان أو ثلاثة من المتنبئين وليحكم الآخرون."]]}, {"l": "1Th 5:21", "n": "", "vs": [[21, "امتحنوا كل شيء وتمسكوا بالحسن."]]}, {"l": "Rev 2:2", "n": "", "vs": [[2, "إني عالم بأعمالك، وجهدك، وصبرك، وأعلم أنك لا تستطيع احتمال الأشرار، وأنك دققت في فحص ادعاءات أولئك الذين يزعمون أنهم رسل، وما هم برسل، فتبين لك أنهم دجالون!"]]}], "kwAr": "امتحنوا الأرواح", "noteAr": ""}, {"kw": "many", "raw": "1Jo_2:18; Mat_24:5, Mat_24:23-26; Mar_13:21; Luk_21:8; Act_20:29; 1Ti_4:1; 2Ti_3:13; 2Pe_2:1; 2Jo_1:7", "note": "", "refs": [{"l": "1Jo 2:18", "n": "", "vs": [[18, "أيها الأولاد، اعلموا أننا نعيش الآن في الزمن الأخير. وكما سمعتم أنه سوف يأتي أخيرا «مسيح دجال»، فقد ظهر حتى الآن كثيرون من الدجالين المقاومين للمسيح. من هنا نتأكد أننا نعيش في الزمن الأخير."]]}, {"l": "Mat 24:5", "n": "", "vs": [[5, "فإن كثيرين سيأتون باسمي قائلين إني أنا هو المسيح، فيضللون كثيرين."]]}, {"l": "Mat 24:23-26", "n": "", "vs": [[23, "فإن قال لكم أحد عندئذ: ها إن المسيح هنا، أو هناك، فلا تصدقوا!"], [24, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات عظيمة وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."], [25, "ها أنا قد أخبرتكم بالأمر قبل حدوثه."], [26, "فإذا قال لكم الناس: ها هو المسيح في البرية! فلا تخرجوا إليها؛ أو: ها هو في الغرف الداخلية! فلا تصدقوا."]]}, {"l": "Mar 13:21", "n": "", "vs": [[21, "فإن قال لكم أحد عندئذ: ها إن المسيح هنا! أو: ها هو هناك! فلا تصدقوا."]]}, {"l": "Luk 21:8", "n": "", "vs": [[8, "فقال: «انتبهوا! لا تضلوا! فإن كثيرين سيأتون باسمي قائلين إني أنا هو وإن الزمان قد اقترب: فلا تتبعوهم!"]]}, {"l": "Act 20:29", "n": "", "vs": [[29, "فإني أعلم أنه بعد رحيلي سيندس بينكم ذئاب خاطفة، لا تشفق على القطيع."]]}, {"l": "1Ti 4:1", "n": "", "vs": [[1, "إلا أن الروح يعلن صراحة أن قوما في الأزمنة الأخيرة سوف يرتدون عن الإيمان، منساقين وراء أرواح مضللة وتعاليم شيطانية،"]]}, {"l": "2Ti 3:13", "n": "", "vs": [[13, "أما الناس الأشرار والدجالون المحتالون، فيتقدمون في الشر، مضللين الآخرين وهم أنفسهم مضللون!"]]}, {"l": "2Pe 2:1", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."]]}, {"l": "2Jo 1:7", "n": "", "vs": [[7, "إن العالم أصبح يعج بالمضللين الذين لا يعترفون أن يسوع المسيح جاء إلى الأرض بجسم بشري. هذا هو روح المضل وضد المسيح!"]]}], "kwAr": "الأنبياء الدجالين", "noteAr": ""}], "arS": [["أيها ", []], ["الأحباء", ["G27"]], ["، لا ", []], ["تصدقوا", ["G4100"]], [" ", []], ["كل", ["G3956"]], [" ", []], ["روح", ["G4151"]], ["، بل ", []], ["امتحنوا", ["G1381"]], [" ", []], ["الأرواح", ["G4151"]], [" لتعرفوا ما إذا كانت من عند ", []], ["الله", ["G2316"]], [" أم لا، لأن عددا ", []], ["كبيرا", ["G4183"]], [" من ", []], ["الأنبياء الدجالين", ["G5578"]], [" قد ", []], ["انتشر", ["G1831"]], [" في ", []], ["العالم", ["G2889"]], [".", []]]}, {"c": 4, "v": 2, "text": "وهذه هي الطريقة التي تعرفون بها كون الروح من عند الله فعلا: إذا كان ذلك الروح يعترف بأن يسوع المسيح قد جاء إلى الأرض في الجسد، فهو من عند الله.", "groups": [{"kw": "Every", "raw": "1Jo_5:1; Joh_16:13-15; 1Co_12:3", "note": "", "refs": [{"l": "1Jo 5:1", "n": "", "vs": [[1, "كل من يؤمن حقا أن يسوع هو المسيح، فهو مولود من الله. ومن يحب الوالد، فلابد أن يحب المولودين منه أيضا."]]}, {"l": "Joh 16:13-15", "n": "", "vs": [[13, "ولكن، عندما يأتيكم روح الحق يرشدكم إلى الحق كله، لأنه لا يقول شيئا من عنده، بل يخبركم بما يسمعه، ويطلعكم على ما سوف يحدث."], [14, "وهو سيمجدني لأن كل ما سيحدثكم به صادر عني."], [15, "كل ما هو للآب، فهو لي. ولذلك قلت لكم إن ما سيحدثكم به صادر عني."]]}, {"l": "1Co 12:3", "n": "", "vs": [[3, "لذلك أقول لكم أن تعرفوا أنه لا أحد وهو يتكلم بروح الله يقول: «اللعنة على يسوع!» وكذلك لا يستطيع أحد أن يقول: «يسوع رب» إلا بالروح القدس."]]}], "kwAr": "كل روح يعترف", "noteAr": ""}, {"kw": "come", "raw": "1Jo_4:3; Joh_1:14; 1Ti_3:16", "note": "", "refs": [{"l": "1Jo 4:3", "n": "", "vs": [[3, "وإن كان ينكر ذلك لا يكون من عند الله، بل من عند ضد المسيح الذي سمعتم أنه سوف يأتي، وهو الآن موجود في العالم."]]}, {"l": "Joh 1:14", "n": "", "vs": [[14, "والكلمة صار بشرا، وخيم بيننا، ونحن رأينا مجده، مجد ابن وحيد عند الآب، وهو ممتلىء بالنعمة والحق."]]}, {"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}], "kwAr": "جاء إلى الأرض في الجسد", "noteAr": ""}], "arS": [["وهذه هي الطريقة التي ", []], ["تعرفون", ["G1097"]], [" بها كون ", []], ["الروح", ["G4151"]], [" من عند ", []], ["الله", ["G2316"]], [" فعلا: إذا كان ذلك الروح ", []], ["يعترف", ["G3670"]], [" بأن ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [" قد ", []], ["جاء", ["G2064"]], [" إلى الأرض في ", []], ["الجسد", ["G4561"]], ["، فهو من عند ", []], ["الله", ["G2316"]], [".", []]]}, {"c": 4, "v": 3, "text": "وإن كان ينكر ذلك لا يكون من عند الله، بل من عند ضد المسيح الذي سمعتم أنه سوف يأتي، وهو الآن موجود في العالم.", "groups": [{"kw": "and this", "raw": "1Jo_2:18, 1Jo_2:22; 2Th_2:7, 2Th_2:8; 2Jo_1:7", "note": "", "refs": [{"l": "1Jo 2:18", "n": "", "vs": [[18, "أيها الأولاد، اعلموا أننا نعيش الآن في الزمن الأخير. وكما سمعتم أنه سوف يأتي أخيرا «مسيح دجال»، فقد ظهر حتى الآن كثيرون من الدجالين المقاومين للمسيح. من هنا نتأكد أننا نعيش في الزمن الأخير."]]}, {"l": "1Jo 2:22", "n": "", "vs": [[22, "ومن هو الكذاب؟ إنه الذي ينكر أن يسوع هو المسيح حقا. إنه ضد للمسيح ينكر الآب والابن معا."]]}, {"l": "2Th 2:7", "n": "", "vs": [[7, "فإن التمرد الآن يعمل خفية كأنه سر. ولكن فقط إلى أن يرفع من الوسط ذاك الذي يحتجز المتمرد."]]}, {"l": "2Th 2:8", "n": "", "vs": [[8, "عندئذ سيظهر الإنسان المتمرد ظهورا جليا فيبيده الرب يسوع بنفخة فمه ويلاشيه ببهاء ظهوره عند عودته."]]}, {"l": "2Jo 1:7", "n": "", "vs": [[7, "إن العالم أصبح يعج بالمضللين الذين لا يعترفون أن يسوع المسيح جاء إلى الأرض بجسم بشري. هذا هو روح المضل وضد المسيح!"]]}], "kwAr": "ضد المسيح", "noteAr": ""}], "arS": [["وإن كان ", []], ["ينكر", ["G3670", "G3361"]], [" ذلك لا يكون من عند ", []], ["الله", ["G2316"]], ["، بل من عند ", []], ["ضد المسيح", ["G500"]], [" الذي ", []], ["سمعتم", ["G191"]], [" أنه سوف ", []], ["يأتي", ["G2064"]], ["، وهو ", []], ["الآن", ["G3568"]], [" موجود في ", []], ["العالم", ["G2889"]], [".", []]]}, {"c": 4, "v": 4, "text": "أيها الأولاد الصغار، أنتم من الله، وقد غلبتم الذين يقاومون المسيح: لأن الروح القدس الساكن فيكم أقوى من الروح الشرير المنتشر في العالم.", "groups": [{"kw": "are", "raw": "1Jo_4:6, 1Jo_4:16, 1Jo_3:9, 1Jo_3:10, 1Jo_5:19", "note": "", "refs": [{"l": "1Jo 4:6", "n": "", "vs": [[6, "أما نحن، فإننا من الله، ولذلك يصغي إلينا فقط من يعرف الله . أما الذي ليس من الله، فلا يصغي إلينا. وبهذا، نميز بين روح الحق وروح الضلال."]]}, {"l": "1Jo 4:16", "n": "", "vs": [[16, "ونحن أنفسنا اختبرنا المحبة التي خصنا الله بها، ووضعنا ثقتنا فيها. إن الله محبة. ومن يثبت في المحبة، فإنه يثبت في الله، والله يثبت فيه."]]}, {"l": "1Jo 3:9", "n": "", "vs": [[9, "فكل مولود من الله، لا يمارس الخطيئة، لأن طبيعة الله صارت ثابتة فيه. بل إنه لا يستطيع أن يمارس الخطيئة، لأنه مولود من الله."]]}, {"l": "1Jo 3:10", "n": "", "vs": [[10, "إذن، هذا هو المقياس الذي نميز به بين أولاد الله وأولاد إبليس. من لا يمارس الصلاح، فهو ليس من الله. وكذلك من لا يحب أخاه!"]]}, {"l": "1Jo 5:19", "n": "", "vs": [[19, "ونحن واثقون أيضا بأننا من الله، وأن العالم كله خاضع لسيطرة إبليس الشرير."]]}], "kwAr": "أنتم من الله", "noteAr": ""}, {"kw": "and have", "raw": "1Jo_2:13, 1Jo_5:4; Rom_8:37; Eph_6:10,Eph_6:13; Rev_12:11", "note": "", "refs": [{"l": "1Jo 2:13", "n": "", "vs": [[13, "أكتب إليكم أيها الآباء، لأنكم قد عرفتم المسيح الكائن منذ البداية. أكتب إليكم أيها الشباب، لأنكم قد غلبتم إبليس الشرير. كتبت إليكم أيها الأولاد الصغار، لأنكم قد عرفتم الآب."]]}, {"l": "1Jo 5:4", "n": "", "vs": [[4, "ذلك لأن المولود من الله ينتصر على العالم. فالإيمان هو الذي يجعلنا ننتصر على العالم."]]}, {"l": "Rom 8:37", "n": "", "vs": [[37, "ولكننا، في جميع هذه الأمور، نحرز ما يفوق الانتصار على يد من أحبنا."]]}, {"l": "Eph 6:10", "n": "", "vs": [[10, "وختاما، تشددوا في الرب وفي قدرة قوته."]]}, {"l": "Eph 6:13", "n": "", "vs": [[13, "لذلك اتخذوا سلاح الله الكامل، لتتمكنوا من المقاومة في يوم الشر، ومن الصمود أيضا بعد تحقيق كل هدف."]]}, {"l": "Rev 12:11", "n": "", "vs": [[11, "وهم قد انتصروا عليه بدم الحمل وبالكلمة التي شهدوا لها، فلم تكن حياتهم عزيزة لديهم، حتى إنهم ماتوا."]]}], "kwAr": "قد غلبتم", "noteAr": ""}, {"kw": "greater", "raw": "1Jo_4:13, 1Jo_4:16, 1Jo_3:24; Joh_10:28-30, Joh_14:17-23, Joh_17:23; Rom_8:10,Rom_8:11; 1Co_6:13; 2Co_6:16; Eph_3:17", "note": "", "refs": [{"l": "1Jo 4:13", "n": "", "vs": [[13, "وما يؤكد لنا أننا نثبت في الله، وأنه يثبت فينا هو أنه وهب لنا من روحه."]]}, {"l": "1Jo 4:16", "n": "", "vs": [[16, "ونحن أنفسنا اختبرنا المحبة التي خصنا الله بها، ووضعنا ثقتنا فيها. إن الله محبة. ومن يثبت في المحبة، فإنه يثبت في الله، والله يثبت فيه."]]}, {"l": "1Jo 3:24", "n": "", "vs": [[24, "وكل من يطيع وصايا الله، فإنه يثبت في الله، والله يثبت فيه. والذي يؤكد لنا أن الله يثبت فينا، هو الروح القدس الذي وهبه لنا."]]}, {"l": "Joh 10:28-30", "n": "", "vs": [[28, "وأعطيها حياة أبدية، فلا تهلك إلى الأبد، ولا ينتزعها أحد من يدي."], [29, "إن الآب الذي أعطاني إياها هو أعظم من الجميع، ولا يقدر أحد أن ينتزع من يد الآب شيئا."], [30, "أنا والآب واحد!»"]]}, {"l": "Joh 14:17-23", "n": "", "vs": [[17, "وهو روح الحق، الذي لا يقدر العالم أن يتقبله لأنه لا يراه ولا يعرفه، وأما أنتم فتعرفونه لأنه في وسطكم، وسيكون في داخلكم."], [18, "لن أترككم يتامى، بل سأعود إليكم."], [19, "بعد قليل لا يراني العالم. أما أنتم فسوف ترونني. ولأني أنا حي، فأنتم أيضا ستحيون."], [20, "في ذلك اليوم تعلمون أني أنا في أبي، وأنتم في، وأنا فيكم."], [21, "من كانت عنده وصاياي، ويعمل بها، فذاك يحبني. والذي يحبني، يحبه أبي، وأنا أحبه وأعلن له ذاتي»."], [22, "فسأله يهوذا، غير الإسخريوطي: «ياسيد، ماذا جرى حتى تعلن لنا ذاتك ولا تعلنها للعالم؟»"], [23, "أجابه يسوع: «من يحبني يعمل بكلمتي، ويحبه أبي، وإليه نأتي، وعنده نجعل لنا منزلا."]]}, {"l": "Joh 17:23", "n": "", "vs": [[23, "أنا فيهم، وأنت في، ليكتملوا فيصيروا واحدا، حتى يعرف العالم أنك أرسلتني وأنك أحببتهم كما أحببتني."]]}, {"l": "Rom 8:10", "n": "", "vs": [[10, "وإذا كان المسيح فيكم، فمع أن الجسد مائت بسبب الخطيئة، فإن الروح حياة لكم بسبب البر."]]}, {"l": "Rom 8:11", "n": "", "vs": [[11, "وإذا كان روح الذي أقام يسوع من بين الأموات يسكن فيكم، فإن الذي أقام المسيح من بين الأموات سوف يحيي أيضا أجسادكم الفانية بسبب روحه الذي يسكن فيكم."]]}, {"l": "1Co 6:13", "n": "", "vs": [[13, "الطعام للبطن، والبطن للطعام؛ ولكن الله سيبيد هذا وذاك. غير أن الجسد ليس للزنى، بل للرب؛ والرب للجسد."]]}, {"l": "2Co 6:16", "n": "", "vs": [[16, "وأي وفاق لهيكل الله مع الأصنام؟ فإننا نحن هيكل الله الحي، وفقا لما قاله الله : «سأسكن في وسطهم، وأسير بينهم، وأكون إلههم وهم يكونون شعبا لي…"]]}, {"l": "Eph 3:17", "n": "", "vs": [[17, "ليسكن المسيح في قلوبكم بالإيمان؛ حتى إذا تأصلتم وتأسستم في المحبة،"]]}], "kwAr": "أقوى", "noteAr": ""}, {"kw": "than", "raw": "1Jo_5:19 *Gr: Joh_12:31, Joh_14:30, Joh_16:11; 1Co_2:12; 2Co_4:4; Eph_2:2, Eph_6:12", "note": "", "refs": [{"l": "1Jo 5:19", "n": "*Gr:", "vs": [[19, "ونحن واثقون أيضا بأننا من الله، وأن العالم كله خاضع لسيطرة إبليس الشرير."]]}, {"l": "Joh 12:31", "n": "", "vs": [[31, "الآن وقت الحكم على هذا العالم! الآن يطرد سيد هذا العالم خارجا!"]]}, {"l": "Joh 14:30", "n": "", "vs": [[30, "لن أكلمكم كثيرا بعد، فإن سيد هذا العالم قادم علي، ولا شيء له في."]]}, {"l": "Joh 16:11", "n": "", "vs": [[11, "وأما على الدينونة، فلأن سيد هذا العالم قد صدر عليه حكم الدينونة."]]}, {"l": "1Co 2:12", "n": "", "vs": [[12, "وأما نحن فقد نلنا لا روح العالم بل الروح الذي من الله، لنعرف الأمور التي وهبت لنا من قبل الله."]]}, {"l": "2Co 4:4", "n": "", "vs": [[4, "الذين أعمى إله هذا العالم أذهانهم حتى لا يضيء لهم نور الإنجيل المختص بمجد المسيح الذي هو صورة الله."]]}, {"l": "Eph 2:2", "n": "", "vs": [[2, "التي كنتم تسلكون فيها حسب مسرى هذا العالم، تابعين رئيس قوات الهواء، ذلك الروح العامل الآن في أبناء العصيان،"]]}, {"l": "Eph 6:12", "n": "", "vs": [[12, "فإن حربنا ليست ضد ذوي اللحم والدم، بل ضد الرئاسات، ضد السلطات، ضد أسياد العالم حكام هذا الظلام، ضد قوى الشر الروحية في الأماكن السماوية."]]}], "kwAr": "من الروح الشرير المنتشر في العالم", "noteAr": ""}], "arS": [["أيها ", []], ["الأولاد الصغار", ["G5040"]], ["، أنتم من ", []], ["الله", ["G2316"]], ["، وقد ", []], ["غلبتم", ["G3528"]], [" الذين يقاومون المسيح: لأن الروح القدس الساكن فيكم ", []], ["أقوى", ["G3187"]], [" من الروح الشرير المنتشر في ", []], ["العالم", ["G2889"]], [".", []]]}, {"c": 4, "v": 5, "text": "هؤلاء المقاومون هم من العالم، ولذلك يستمدون كلامهم من العالم، فيصغي أهل العالم إليهم.", "groups": [{"kw": "are", "raw": "Psa_17:4; Luk_16:8; Joh_3:31, Joh_7:6, Joh_7:7, Joh_8:23, Joh_15:19, Joh_15:20, Joh_17:14, Joh_17:16; Rev_12:9", "note": "", "refs": [{"l": "Psa 17:4", "n": "", "vs": [[4, "ما شأني بأعمال الناس الشريرة؟ فبفضل كلام شفتيك تفاديت مسالك العنيف."]]}, {"l": "Luk 16:8", "n": "", "vs": [[8, "فامتدح السيد وكيله الخائن لأنه تصرف بحكمة. فإن أبناء هذا العالم أحكم مع أهل جيلهم من أبناء النور."]]}, {"l": "Joh 3:31", "n": "", "vs": [[31, "إنه هو الآتي من السماء، ولذلك فهو متقدم على الجميع. أما من كان من الأرض، فإنه أرضي ويتكلم كلاما أرضيا. الآتي من السماء متقدم على الجميع،"]]}, {"l": "Joh 7:6", "n": "", "vs": [[6, "فأجابهم يسوع: «ما حان وقتي بعد، أما وقتكم فهو مناسب كل حين."]]}, {"l": "Joh 7:7", "n": "", "vs": [[7, "لا يقدر العالم أن يبغضكم، ولكنه يبغضني أنا، لأني أشهد عليه أن أعماله شريرة."]]}, {"l": "Joh 8:23", "n": "", "vs": [[23, "فكان رده: «أنتم من تحت. أما أنا فمن فوق. أنتم من هذا العالم. وأنا لست منه."]]}, {"l": "Joh 15:19", "n": "", "vs": [[19, "لو كنتم من أهل العالم، لكان العالم يحب أهله، ولكن لأنكم لستم من أهل العالم، بل إني اخترتكم من وسط العالم، لذلك يبغضكم العالم."]]}, {"l": "Joh 15:20", "n": "", "vs": [[20, "اذكروا الكلمة التي قلتها لكم: ليس عبد أعظم من سيده. فإن كان أهل العالم قد اضطهدوني، فسوف يضطهدونكم؛ وإن كانوا قد عملوا بكلمتي، فسوف يعملون بكلمتكم."]]}, {"l": "Joh 17:14", "n": "", "vs": [[14, "أبلغتهم كلمتك، فأبغضهم العالم لأنهم ليسوا من العالم."]]}, {"l": "Joh 17:16", "n": "", "vs": [[16, "فهم ليسوا من أهل العالم كما أني لست من العالم."]]}, {"l": "Rev 12:9", "n": "", "vs": [[9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."]]}], "kwAr": "هم من العالم", "noteAr": ""}, {"kw": "and", "raw": "Isa_30:10,Isa_30:11; Jer_5:31, Jer_29:8; Mic_2:11; Joh_15:19, Joh_17:14; 2Ti_4:3; 2Pe_2:2, 2Pe_2:3", "note": "", "refs": [{"l": "Isa 30:10", "n": "", "vs": [[10, "ويقولون للأنبياء: «لا تتنبأوا لنا بما هو حق، بل كلمونا بالكلام المداهن وتنبأوا بالمخادعات."]]}, {"l": "Isa 30:11", "n": "", "vs": [[11, "اعدلوا عن الطريق، حيدوا عن السبيل، وكفوا عن مجابهتنا بكلام قدوس إسرائيل»."]]}, {"l": "Jer 5:31", "n": "", "vs": [[31, "فالأنبياء يتنبأون زورا، والكهنة يتصرفون بمقتضى أحكامهم، وشعبي أحب مثل هذا. ولكن ماذا تصنعون في نهاية المطاف؟»"]]}, {"l": "Jer 29:8", "n": "", "vs": [[8, "لأن هذا ما يعلنه الرب القدير إله إسرائيل: لا يخدعنكم أنبياؤكم الكذبة المقيمون في وسطكم، والعرافون. لا تستمعوا إلى أحلامهم التي توهمكم بالأمل،"]]}, {"l": "Mic 2:11", "n": "", "vs": [[11, "إن جال رجل يتنبأ بينكم بالكذب وباللغو الباطل قائلا: إنني أتنبأ لكم بالخمر الوفير والمسكر، فإنه يصبح نبي هذا الشعب."]]}, {"l": "Joh 15:19", "n": "", "vs": [[19, "لو كنتم من أهل العالم، لكان العالم يحب أهله، ولكن لأنكم لستم من أهل العالم، بل إني اخترتكم من وسط العالم، لذلك يبغضكم العالم."]]}, {"l": "Joh 17:14", "n": "", "vs": [[14, "أبلغتهم كلمتك، فأبغضهم العالم لأنهم ليسوا من العالم."]]}, {"l": "2Ti 4:3", "n": "", "vs": [[3, "فإنه سيأتي زمان لا يطيق الناس فيه التعليم الصحيح، بل تبعا لشهواتهم الخاصة يكدسون لأنفسهم معلمين (يقولون لهم كلاما) يداعب الآذان."]]}, {"l": "2Pe 2:2", "n": "", "vs": [[2, "وكثيرون سيسيرون وراءهم في طرق الإباحية. وبسببهم توجه الإهانة إلى طريق الحق."]]}, {"l": "2Pe 2:3", "n": "", "vs": [[3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}], "kwAr": "فيصغي أهل العالم إليهم", "noteAr": ""}], "arS": [["هؤلاء المقاومون هم من ", []], ["العالم", ["G2889"]], ["، ولذلك ", []], ["يستمدون كلامهم", ["G2980"]], [" من ", []], ["العالم", ["G2889"]], ["، ", []], ["فيصغي", ["G191"]], [" أهل ", []], ["العالم", ["G2889"]], [" إليهم.", []]]}, {"c": 4, "v": 6, "text": "أما نحن، فإننا من الله، ولذلك يصغي إلينا فقط من يعرف الله . أما الذي ليس من الله، فلا يصغي إلينا. وبهذا، نميز بين روح الحق وروح الضلال.", "groups": [{"kw": "We are", "raw": "1Jo_4:4; Mic_3:8; Rom_1:1; 1Co_2:12-14; 2Pe_3:2; Jud_1:17", "note": "", "refs": [{"l": "1Jo 4:4", "n": "", "vs": [[4, "أيها الأولاد الصغار، أنتم من الله، وقد غلبتم الذين يقاومون المسيح: لأن الروح القدس الساكن فيكم أقوى من الروح الشرير المنتشر في العالم."]]}, {"l": "Mic 3:8", "n": "", "vs": [[8, "أما أنا، فإني ممتليء بقوة روح الرب وبالحق والعزة، لأعلن لنسل يعقوب معاصيه ولإسرائيل خطيئته."]]}, {"l": "Rom 1:1", "n": "", "vs": [[1, "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"]]}, {"l": "1Co 2:12-14", "n": "", "vs": [[12, "وأما نحن فقد نلنا لا روح العالم بل الروح الذي من الله، لنعرف الأمور التي وهبت لنا من قبل الله."], [13, "ونحن نتكلم بهذه الأمور لا في كلام تعلمه الحكمة البشرية، بل في كلام يعلمه الروح القدس، معبرين عن الحقائق الروحية بوسائل روحية."], [14, "غير أن الإنسان البشري لا يتقبل أمور روح الله إذ يعتبرها جهالة، ولا يستطيع أن يعرفها لأن تمييزها إنما يحتاج إلى حس روحي."]]}, {"l": "2Pe 3:2", "n": "", "vs": [[2, "وغايتي أن تتذكروا الأقوال التي أعلنها الأنبيا ء القديسون قديما، وكذلك وصية الرب والمخلص، تلك الوصية التي نقلها إليكم الرسل."]]}, {"l": "Jud 1:17", "n": "", "vs": [[17, "أما أنتم أيها الأحباء، فاذكروا دائما ما قاله رسل ربنا يسوع المسيح."]]}], "kwAr": "نحن من الله", "noteAr": ""}, {"kw": "he that knoweth", "raw": "1Jo_4:8; Luk_10:22; Joh_8:19, Joh_8:45-50, Joh_10:27, Joh_13:20, Joh_18:37, Joh_20:21; 1Co_14:37; 2Co_10:7; 2Th_1:8", "note": "", "refs": [{"l": "1Jo 4:8", "n": "", "vs": [[8, "أما من لا يحب، فهو لم يتعرف بالله قط لأن الله محبة!"]]}, {"l": "Luk 10:22", "n": "", "vs": [[22, "كل شيء قد سلم إلي من قبل أبي، ولا أحد يعرف من هو الابن إلا الآب، ولا من هو الآب إلا الابن ومن أراد الابن أن يعلنه له!»"]]}, {"l": "Joh 8:19", "n": "", "vs": [[19, "فسألوه: «أين أبوك؟» فأجاب: «أنتم لا تعرفونني، ولا تعرفون أبي. ولو عرفتموني لعرفتم أبي أيضا»."]]}, {"l": "Joh 8:45-50", "n": "", "vs": [[45, "أما أنا فلأني أقول الحق، لستم تصدقونني."], [46, "من منكم يثبت علي خطيئة؟ فما دمت أقول الحق، فلماذا لا تصدقونني؟"], [47, "من كان من الله حقا، يسمع كلام الله. ولكنكم ترفضون كلام الله، لأنكم لستم من الله!»"], [48, "فقال اليهود: «ألسنا نقول الحق عندما نقول إنك سامري وإن فيك شيطانا؟»"], [49, "أجابهم: «لا شيطان في، لكني أكرم أبي وأنتم تهينونني."], [50, "أنا لا أطلب مجد نفسي، فهناك من يطالب ويقضي لي."]]}, {"l": "Joh 10:27", "n": "", "vs": [[27, "فخرافي تصغي لصوتي، وأنا أعرفها وهي تتبعني،"]]}, {"l": "Joh 13:20", "n": "", "vs": [[20, "الحق الحق أقول لكم: من يقبل الذي أرسله، يقبلني؛ ومن يقبلني، يقبل الذي أرسلني»."]]}, {"l": "Joh 18:37", "n": "", "vs": [[37, "فسأله بيلاطس: «فهل أنت ملك إذن؟» أجابه: «أنت قلت، إني ملك. ولهذا ولدت وجئت إلى العالم: لأشهد للحق، وكل من هو من الحق يصغي لصوتي»."]]}, {"l": "Joh 20:21", "n": "", "vs": [[21, "فقال لهم يسوع: «سلام لكم. كما أن الآب أرسلني، أرسلكم أنا»."]]}, {"l": "1Co 14:37", "n": "", "vs": [[37, "فإن اعتبر أحد نفسه نبيا أو صاحب موهبة روحية، فليدرك أن ما أكتبه إليكم إنما هو وصية الرب."]]}, {"l": "2Co 10:7", "n": "", "vs": [[7, "أتحكمون على الأمور بحسب ظواهرها؟ إن كانت لأحد ثقة في نفسه بأنه يخص المسيح، فليفكر أيضا في نفسه بأنه كما يخص هو المسيح، كذلك نخصه نحن أيضا."]]}, {"l": "2Th 1:8", "n": "", "vs": [[8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."]]}], "kwAr": "من يعرف الله", "noteAr": ""}, {"kw": "Hereby", "raw": "1Jo_4:1; Isa_8:20", "note": "", "refs": [{"l": "1Jo 4:1", "n": "", "vs": [[1, "أيها الأحباء، لا تصدقوا كل روح، بل امتحنوا الأرواح لتعرفوا ما إذا كانت من عند الله أم لا، لأن عددا كبيرا من الأنبياء الدجالين قد انتشر في العالم."]]}, {"l": "Isa 8:20", "n": "", "vs": [[20, "فإلى الشريعة وإلى الشهادة: ومن لا ينطق بمثل هذا القول، فلا فجر له."]]}], "kwAr": "وبهذا", "noteAr": ""}, {"kw": "the spirit of truth", "raw": "Joh_14:17, Joh_15:26", "note": "", "refs": [{"l": "Joh 14:17", "n": "", "vs": [[17, "وهو روح الحق، الذي لا يقدر العالم أن يتقبله لأنه لا يراه ولا يعرفه، وأما أنتم فتعرفونه لأنه في وسطكم، وسيكون في داخلكم."]]}, {"l": "Joh 15:26", "n": "", "vs": [[26, "وعندما يأتي المعين، الذي سأرسله لكم من عند الآب، روح الحق الذي ينبثق من الآب، فهو يشهد لي،"]]}], "kwAr": "روح الحق", "noteAr": ""}, {"kw": "and", "raw": "Isa_29:10; Hos_4:12; Mic_2:11; Rom_11:8; 2Th_2:9-11", "note": "", "refs": [{"l": "Isa 29:10", "n": "", "vs": [[10, "لأن الرب قد سكب عليكم روح سبات عميق، فأغلق عيون أنبيائكم وغطى رؤوس رائييكم."]]}, {"l": "Hos 4:12", "n": "", "vs": [[12, "فيطلبون مشورة قطعة خشب ويسألون عصا! لأن روح زنى قد أضلهم فنبذوا إلههم وزنوا وراء آخر."]]}, {"l": "Mic 2:11", "n": "", "vs": [[11, "إن جال رجل يتنبأ بينكم بالكذب وباللغو الباطل قائلا: إنني أتنبأ لكم بالخمر الوفير والمسكر، فإنه يصبح نبي هذا الشعب."]]}, {"l": "Rom 11:8", "n": "", "vs": [[8, "وفقا لما قد كتب: «ألقى الله عليهم روح خمول وأعطاهم عيونا لا يبصرون بها، وآذانا لا يسمعون بها، حتى هذا اليوم»."]]}, {"l": "2Th 2:9-11", "n": "", "vs": [[9, "أما بروز المتمرد، فسوف يكون بقدر طاقة الشيطان على المعجزات والعلامات والعجائب المزيفة كلها،"], [10, "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا."], [11, "ولهذا السبب، سيرسل الله إليهم طاقة الضلال حتى يصدقوا ما هو دجل،"]]}], "kwAr": "وروح الضلال", "noteAr": ""}], "arS": [["أما نحن، فإننا من ", []], ["الله", ["G2316"]], ["، ولذلك ", []], ["يصغي", ["G191"]], [" إلينا فقط من ", []], ["يعرف", ["G1097"]], [" ", []], ["الله", ["G2316"]], [" . أما الذي ليس من ", []], ["الله", ["G2316"]], ["، فلا ", []], ["يصغي", ["G191"]], [" إلينا. وبهذا، ", []], ["نميز", ["G1097"]], [" بين ", []], ["روح", ["G4151"]], [" ", []], ["الحق", ["G225"]], [" ", []], ["وروح", ["G4151"]], [" ", []], ["الضلال", ["G4106"]], [".", []]]}, {"c": 4, "v": 7, "text": "أيها الأحباء، لنحب بعضنا بعضا: لأن المحبة تصدر من الله. إذن، كل من يحب، يكون مولودا من الله ويعرف الله .", "groups": [{"kw": "let", "raw": "1Jo_4:20,1Jo_4:21, 1Jo_2:10, 1Jo_3:10-23, 1Jo_5:1", "note": "", "refs": [{"l": "1Jo 4:20", "n": "", "vs": [[20, "فإن قال أحد: «أنا أحب الله !» ولكنه يبغض أخا له، فهو كاذب، لأنه إن كان لا يحب أخاه الذي يراه، فكيف يقدر أن يحب الله الذي لم يره قط؟"]]}, {"l": "1Jo 4:21", "n": "", "vs": [[21, "فهذه الوصية جاءتنا من المسيح نفسه: من يحب الله ، يحب أخاه!"]]}, {"l": "1Jo 2:10", "n": "", "vs": [[10, "فالذي يحب إخوته، هو الذي يحيا في النور فعلا ولا شيء يسقطه."]]}, {"l": "1Jo 3:10-23", "n": "", "vs": [[10, "إذن، هذا هو المقياس الذي نميز به بين أولاد الله وأولاد إبليس. من لا يمارس الصلاح، فهو ليس من الله. وكذلك من لا يحب أخاه!"], [11, "فالوصية التي سمعتموها منذ البداية، هي أن يحب بعضنا بعضا،"], [12, "لا أن نكون مثل قايين الذي قتل أخاه. فقايين كان من أولاد إبليس الشرير. ولماذا قتل أخاه؟ قتله لأن أعماله هو كانت شريرة، أما أعمال أخيه فكانت صالحة."], [13, "إذن، ياإخوتي، لا تتعجبوا إن كان أهل العالم يبغضونكم!"], [14, "إن محبتنا لإخوتنا تبين لنا أننا انتقلنا من الموت إلى الحياة. فالذي لا يحب إخوته، فهو باق في الموت."], [15, "وكل من يبغض أخا له، فهو قاتل. وأنتم تعرفون أن القاتل لا تكون له حياة أبدية ثابتة فيه."], [16, "ومقياس المحبة هو العمل الذي قام به المسيح إذ بذل حياته لأجلنا. فعلينا نحن أيضا أن نبذل حياتنا لأجل إخوتنا."], [17, "وأما الذي يملك مالا يمكنه من العيش في بحبوحة، ويقسي قلبه على أحد الإخوة المحتاجين، فكيف تكون محبة الله متأصلة فيه؟"], [18, "أيها الأولاد الصغار، لا يجب أن تكون محبتنا مجرد ادعاء بالكلام واللسان، بل تكون محبة عملية حقة."], [19, "عندئذ نتأكد أننا نتصرف بحسب الحق، وتطمئن نفوسنا في حضرة الله،"], [20, "ولو لامتنا قلوبنا؛ فإن الله أعظم من قلوبنا، وهو العليم بكل شيء."], [21, "أيها الأحباء، إذا كانت ضمائرنا لا تلومنا. فهذا دليل على أن لنا ثقة عظيمة من نحو الله."], [22, "ومهما نطلب منه بالصلاة، نحصل عليه: لأننا نطيع ما يوصينا به، ونمارس الأعمال التي ترضيه."], [23, "وأما وصيته فهي أن نؤمن باسم ابنه يسوع المسيح، وأن يحب بعضنا بعضا كما أوصانا."]]}, {"l": "1Jo 5:1", "n": "", "vs": [[1, "كل من يؤمن حقا أن يسوع هو المسيح، فهو مولود من الله. ومن يحب الوالد، فلابد أن يحب المولودين منه أيضا."]]}], "kwAr": "لنحب بعضنا بعضا", "noteAr": ""}, {"kw": "love is", "raw": "1Jo_4:8; Deu_30:6; Gal_5:22; 1Th_4:9, 1Th_4:10; 2Ti_1:7; 1Pe_1:22", "note": "", "refs": [{"l": "1Jo 4:8", "n": "", "vs": [[8, "أما من لا يحب، فهو لم يتعرف بالله قط لأن الله محبة!"]]}, {"l": "Deu 30:6", "n": "", "vs": [[6, "ويطهر الرب إلهكم قلوبكم وقلوب نسلكم لتحبوا الرب إلهكم من كل قلوبكم ومن كل نفوسكم لتحيوا مطمئنين"]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "1Th 4:9", "n": "", "vs": [[9, "أما المحبة الأخوية، فلستم في حاجة لأن أكتب إليكم عنها، لأنكم بأنفسكم قد تعلمتم من الله أن تحبوا بعضكم بعضا،"]]}, {"l": "1Th 4:10", "n": "", "vs": [[10, "ولأنكم أيضا هكذا تعاملون جميع الإخوة في مقاطعة مقدونية كلها. وإنما نحرضكم، أيها الإخوة، أن تضاعفوا ذلك أكثر فأكثر،"]]}, {"l": "2Ti 1:7", "n": "", "vs": [[7, "فإن الله قد أعطانا لا روح الجبن بل روح القوة والمحبة والبصيرة."]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محب , ["G2316"]], [" ", []], ["محبة", ["G26"]], ["!", []]]}, {"c": 4, "v": 9, "text": "وقد أظهر الله محبته لنا إذ أرسل ابنه الأوحد إلى العالم لكي نحيا به.", "groups": [{"kw": "was", "raw": "1Jo_3:16; Joh_3:16; Rom_5:8-10, Rom_8:32", "note": "", "refs": [{"l": "1Jo 3:16", "n": "", "vs": [[16, "ومقياس المحبة هو العمل الذي قام به المسيح إذ بذل حياته لأجلنا. فعلينا نحن أيضا أن نبذل حياتنا لأجل إخوتنا."]]}, {"l": "Joh 3:16", "n": "", "vs": [[16, "لأنه هكذا أحب الله العالم حتى بذل ابنه الوحيد، لكي لا يهلك كل من يؤمن به، بل تكون له الحياة الأبدية."]]}, {"l": "Rom 5:8-10", "n": "", "vs": [[8, "ولكن الله أثبت لنا محبته، إذ ونحن مازلنا خاطئين مات المسيح عوضا عنا."], [9, "ومادمنا الآن قد تبررنا بدمه، فكم بالأحرى نخلص به من الغضب الآتي!"], [10, "فإن كنا، ونحن أعداء، قد تصالحنا مع الله بموت ابنه، فكم بالأحرى نخلص بحياته ونحن مصالحون!"]]}, {"l": "Rom 8:32", "n": "", "vs": [[32, "بل بذله لأجلنا جميعا، كيف لا يجود علينا معه بكل شيء أيضا؟"]]}], "kwAr": "أظهر الله محبته", "noteAr": ""}, {"kw": "God sent", "raw": "1Jo_4:10; Luk_4:18; Joh_5:23, Joh_6:29, Joh_8:29, Joh_8:42", "note": "", "refs": [{"l": "1Jo 4:10", "n": "", "vs": [[10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."]]}, {"l": "Luk 4:18", "n": "", "vs": [[18, "«روح الرب علي، لأنه مسحني لأبشر الفقراء؛ أرسلني لأنادي للمأسورين بالإطلاق وللعميان بالبصر، لأطلق المسحوقين أحرارا،"]]}, {"l": "Joh 5:23", "n": "", "vs": [[23, "ليكرم الجميع الابن كما يكرمون الآب. ومن لا يكرم الابن لا يكرم الآب الذي أرسله."]]}, {"l": "Joh 6:29", "n": "", "vs": [[29, "أجاب يسوع: «العمل الذي يطلبه الله هو أن تؤمنوا بمن أرسله»."]]}, {"l": "Joh 8:29", "n": "", "vs": [[29, "إن الذي أرسلني هو معي، ولم يتركني وحدي، لأني دوما أعمل ما يرضيه»."]]}, {"l": "Joh 8:42", "n": "", "vs": [[42, "فقال يسوع: «لو كان الله أباكم لكنتم تحبونني، لأني خرجت من الله وجئت. لم آت من نفسي، بل هو الذي أرسلني."]]}], "kwAr": "أرسل ابنه", "noteAr": ""}, {"kw": "only", "raw": "Psa_2:7; Mar_12:6; Joh_1:14-18, Joh_3:18; Heb_1:5", "note": "", "refs": [{"l": "Psa 2:7", "n": "", "vs": [[7, "وها أنا أعلن ما قضى به الرب: قال لي الرب: «أنت ابني، أنا اليوم ولدتك."]]}, {"l": "Mar 12:6", "n": "", "vs": [[6, "وإذ كان له بعد ابن وحيد حبيب، أرسله أيضا إليهم أخيرا، قائلا: إنهم سيهابون ابني!"]]}, {"l": "Joh 1:14-18", "n": "", "vs": [[14, "والكلمة صار بشرا، وخيم بيننا، ونحن رأينا مجده، مجد ابن وحيد عند الآب، وهو ممتلىء بالنعمة والحق."], [15, "شهد له يوحنا فهتف قائلا: «هذا هو الذي قلت عنه: إن الآتي بعدي متقدم علي، لأنه كان قبل أن أوجد»."], [16, "فمن امتلائه أخذنا جميعنا ونلنا نعمة على نعمة،"], [17, "لأن الشريعة أعطيت على يد موسى، أما النعمة والحق فقد تواجدا بيسوع المسيح."], [18, "ما من أحد رأى الله قط. ولكن الابن الوحيد، الذي في حضن الآب، هو الذي كشف عنه."]]}, {"l": "Joh 3:18", "n": "", "vs": [[18, "فالذي يؤمن به لا يدان، أما الذي لا يؤمن به فقد صدر عليه حكم الدينونة، لأنه لم يؤمن باسم ابن الله الوحيد."]]}, {"l": "Heb 1:5", "n": "", "vs": [[5, "فلأي واحد من الملائكة قال الله مرة: «أنت ابني، أنا اليوم ولدتك!» أو قال أيضا: «أنا أكون له أبا، وهو يكون لي ابنا؟»"]]}], "kwAr": "الأوحد", "noteAr": ""}, {"kw": "we", "raw": "1Jo_5:11; Joh_6:51, Joh_6:57, Joh_10:10,Joh_10:28-30, Joh_11:25, Joh_11:26, Joh_14:6; Col_3:3, Col_3:4", "note": "", "refs": [{"l": "1Jo 5:11", "n": "", "vs": [[11, "وهذه الشهادة هي أن الله أعطانا حياة أبدية، وأن هذه الحياة هي في ابنه."]]}, {"l": "Joh 6:51", "n": "", "vs": [[51, "أنا الخبز الحي الذي نزل من السماء. إن أكل أحد من هذا الخبز يحيا إلى الأبد. والخبز الذي أقدمه أنا، هو جسدي، أبذله من أجل أن يحيا العالم»."]]}, {"l": "Joh 6:57", "n": "", "vs": [[57, "وكما أني أحيا بالآب الحي الذي أرسلني، فكذلك يحيا بي من يأكلني."]]}, {"l": "Joh 10:10", "n": "", "vs": [[10, "السارق لا يأتي إلا ليسرق ويذبح ويهلك. أما أنا فقد أتيت لتكون لهم حياة، بل ملء الحياة!"]]}, {"l": "Joh 10:28-30", "n": "", "vs": [[28, "وأعطيها حياة أبدية، فلا تهلك إلى الأبد، ولا ينتزعها أحد من يدي."], [29, "إن الآب الذي أعطاني إياها هو أعظم من الجميع، ولا يقدر أحد أن ينتزع من يد الآب شيئا."], [30, "أنا والآب واحد!»"]]}, {"l": "Joh 11:2 ": [[24, "قد صدر القضاء أن يمضي سبعون أسبوعا على شعبك وعلى مدينة قدسك، للانتهاء من المعصية والقضاء على الخطيئة، وللتكفير عن الإثم، ولإشاعة البر الأبدي وختم الرؤيا والنبوءة ولمسح قدوس القدوسين."]]}, {"l": "Rom 3:25", "n": "", "vs": [[25, "الذي قدمه الله كفارة، عن طريق الإيمان، وذلك بدمه."]]}, {"l": "Rom 3:26", "n": "", "vs": [[26, "ليظهر بر الله إذ تغاضى، بإمهاله الإلهي، عن الخطايا التي حدثت في الماضي، ويظهر أيضا بره في الزمن الحاضر: فيتبين أنه بار وأنه يبرر من له الإيمان بيسوع."]]}, {"l": "1Pe 2:24", "n": "", "vs": [[24, "وهو نفسه حمل خطايانا في جسده (عندما مات مصلوبا) على الخشبة، لكي نموت بالنسبة للخطايا فنحيا حياة البر. وبجراحه هو تم لكم الشفاء،"]]}, {"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}], "kwAr": "أرسل ابنه كفارة", "noteAr": ""}], "arS": [["وفي هذا نرى ", []], ["المحبة", ["G26"]], [" الحقيقية، لا ", []], ["محبتنا", ["G25"]], [" نحن ", []], ["لله", ["G2316"]], ["، بل ", []], ["محبته", ["G25"]], [" هو لنا. فبدافع محبته، ", []], ["أرسل", ["G649"]], [" ", []], ["ابنه", ["G5207"]], [" ", []], ["كفارة", ["G2434"]], [" ", []], ["لخطايانا", ["G266"]], [".", []]]}, {"c": 4, "v": 11, "text": "ومادام الله قد أحبنا هذه المحبة العظيمة، أيها الأحباء، فعلينا نحن أيضا أن نحب بعضنا بعضا.", "groups": [{"kw": "", "raw": "1Jo_3:16, 1Jo_3:17, 1Jo_3:23; Mat_18:32, Mat_18:33; Luk_10:37; Joh_13:34, Joh_15:12, Joh_15:13; 2Co_8:8, 2Co_8:9; Eph_4:31, Eph_4:32, Eph_5:1, Eph_5:2; Col_3:13", "note": "", "refs": [{"l": "1Jo 3:16", "n": "", "vs": [[16, "ومقياس المحبة هو العمل الذي قام به المسيح إذ بذل حياته لأجلنا. فعلينا نحن أيضا أن نبذل حياتنا لأجل إخوتنا."]]}, {"l": "1Jo 3:17", "n": "", "vs": [[17, "وأما الذي يملك مالا يمكنه من العيش في بحبوحة، ويقسي قلبه على أحد الإخوة المحتاجين، فكيف تكون محبة الله متأصلة فيه؟"]]}, {"l": "1Jo 3:23", "n": "", "vs": [[23, "وأما وصيته فهي أن نؤمن باسم ابنه يسوع المسيح، وأن يحب بعضنا بعضا كما أوصانا."]]}, {"l": "Mat 18:32", "n": "", "vs": [[32, "فاستدعاه سيده وقال له: أيها العبد الشرير، ذلك الدين كله سامحتك به لأنك توسلت إلي."]]}, {"l": "Mat 18:33", "n": "", "vs": [[33, "أفما كان يجب أن ترحم زميلك العبد كما رحمتك أنا؟"]]}, {"l": "Luk 10:37", "n": "", "vs": [[37, "فأجاب: «إنه الذي عامله بالرحمة!» فقال له يسوع: «اذهب، واعمل أنت هكذا! »"]]}, {"l": "Joh 13:34", "n": "", "vs": [[34, "وصية جديدة أنا أعطيكم: أحبوا بعضكم بعضا، كما أحببتكم أنا، تحبون بعضكم."]]}, {"l": "Joh 15:12", "n": "", "vs": [[12, "وصيتي لكم هي هذه: أن يحب بعضكم بعضا كما أنا أحببتكم."]]}, {"l": "Joh 15:13", "n": "", "vs": [[13, "ليس لأحد محبة أعظم من هذه: أن يبذل أحد حياته فدى أحبائه."]]}, {"l": "2Co 8:8", "n": "", "vs": [[8, "لا أقول هذا على سبيل الأمر، بل اختبارا لصدق محبتكم بحماسة الآخرين."]]}, {"l": "2Co 8:9", "n": "", "vs": [[9, "فأنتم تعرفون نعمة ربنا يسوع المسيح: فمن أجلكم افتقر، وهو الغني لكي تغتنوا أنتم بفقره."]]}, {"l": "Eph 4:31", "n": "", "vs": [[31, "انزعوا عنكم كل حقد ونقمة وغضب وصخب وسباب وكل شر."]]}, {"l": "Eph 4:32", "n": "", "vs": [[32, "وكونوا لطفاء بعضكم نحو بعض، شفوقين، مسامحين بعضكم بعضا كما سامحكم الله في المسيح."]]}, {"l": "Eph 5:1", "n": "", "vs": [[1, "فاقتدوا إذن بالله كأولاد أحباء،"]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "Col 3:13", "n": "", "vs": [[13, "محتملين بعضكم بعضا، ومسامحين بعضكم بعضا. إن كان لأحدكم شكوى على آخر، كما سامحكم الرب، هكذا افعلوا أنتم أيضا."]]}], "kwAr": "", "noteAr": ""}], "arS": [["ومادام ", []], ["الله", ["G2316"]], [" قد ", []], ["أحبنا", ["G25"]], [" هذه المحبة العظيمة، أيها ", []], ["الأحباء", ["G27"]], ["، ", []], ["فعلينا", ["G3784"]], [" نحن أيضا أن ", []], ["نحب", ["G25"]], [" ", []], ["بعضنا بعضا", ["G240"]], [".", []]]}, {"c": 4, "v": 12, "text": "إن الله لم يره أحد من الناس قط. ولكن، حين نحب بعضنا بعضا، نبين أن الله يحيا في داخلنا، وأن محبته قد اكتملت في داخلنا.", "groups": [{"kw": "seen", "raw": "1Jo_4:20; Gen_32:30; Exo_33:20; Num_12:8; Joh_1:18; 1Ti_1:17, 1Ti_6:16; Heb_11:27", "note": "", "refs": [{"l": "1Jo 4:20", "n": "", "vs": [[20, "فإن قال أحد: «أنا أحب الله !» ولكنه يبغض أخا له، فهو كاذب، لأنه إن كان لا يحب أخاه الذي يراه، فكيف يقدر أن يحب الله الذي لم يره قط؟"]]}, {"l": "Gen 32:30", "n": "", "vs": [[30, "ودعا يعقوب اسم المكان فنيئيل (ومعناه: وجه الله) إذ قال: «لأني شاهدت الله وجها لوجه وبقيت حيا»."]]}, {"l": "Exo 33:20", "n": "", "vs": [[20, "وأضاف:«ولكنك لن ترى وجهي، لأن الإنسان الذي يراني لا يعيش»."]]}, {"l": "Num 12:8", "n": "", "vs": [[8, "لذلك أكلمه وجها لوجه، وبوضوح من غير ألغاز، ويعاين صورة الرب. فلماذا جرؤتما على انتقاد عبدي موسى؟»"]]}, {"l": "Joh 1:18", "n": "", "vs": [[18, "ما من أحد رأى الله قط. ولكن الابن الوحيد، الذي في حضن الآب، هو الذي كشف عنه."]]}, {"l": "1Ti 1:17", "n": "", "vs": [[17, "فللملك الأزلي، الله الواحد غير المنظور وغير الفاني، الكرامة والمجد إلى أبد الآبدين. آمين!"]]}, {"l": "1Ti 6:16", "n": "", "vs": [[16, "الذي وحده لا فناء له، الساكن في نور لا يدنى منه، الذي لم يره أي إنسان ولا يقدر أن يراه. له الكرامة والقدرة الأبدية. آمين!"]]}, {"l": "Heb 11:27", "n": "", "vs": [[27, "بالإيمان، ترك أرض مصر وهو غير خائف من غضب الملك. فقد مضى في تنفيذ قراره، كأنه يرى بجانبه الله غير المنظور."]]}], "kwAr": "لم يره أحد", "noteAr": ""}, {"kw": "love one", "raw": "1Jo_4:6, 1Jo_3:24", "note": "", "refs": [{"l": "1Jo 4:6", "n": "", "vs": [[6, "أما نحن، فإننا من الله، ولذلك يصغي إلينا فقط من يعرف الله . أما الذي ليس من الله، فلا يصغي إلينا. وبهذا، نميز بين روح الحق وروح الضلال."]]}, {"l": "1Jo 3:24", "n": "", "vs": [[24, "وكل من يطيع وصايا الله، فإنه يثبت في الله، والله يثبت فيه. والذي يؤكد لنا أن الله يثبت فينا، هو الروح القدس الذي وهبه لنا."]]}], "kwAr": "نحب بعضنا بعضا", "noteAr": ""}, {"kw": "and his", "raw": "1Jo_4:17, 1Jo_4:18, 1Jo_2:5; 1Co_13:13", "note": "", "refs": [{"l": "1Jo 4:17", "n": "", "vs": [[17, "وتكون محبة الله قد اكتملت في داخلنا حين تولد فينا ثقة كاملة من جهة يوم الدينونة: لأنه كما المسيح، هكذا نحن أيضا في هذا العالم."]]}, {"l": "1Jo 4:18", "n": "", "vs": [[18, "ليس في المحبة أي خوف. بل المحبة الكاملة تطرد الخوف خارجا. فإن الخوف يأتي من العقاب. والخائف لا تكون محبة الله قد اكتملت فيه."]]}, {"l": "1Jo 2:5", "n": "", "vs": [[5, "أما الذي يعمل بحسب كلمة المسيح، فإن محبة الله تكون قد اكتملت في داخله. بهذا نعرف أننا ننتمي إلى المسيحِ."]]}, {"l": "1Co 13:13", "n": "", "vs": [[13, "أما الآن، فهذه الثلاثة باقية: الإيمان، والرجاء، والمحبة. ولكن أعظمها هي المحبة!"]]}], "kwAr": "محبته قد اكتملت", "noteAr": ""}], "arS": [["إن ", []], ["الله", ["G2316"]], [" لم ", []], ["يره", ["G2300"]], [" ", []], ["أحد", ["G3762"]], [" من الناس ", []], ["قط", ["G4455"]], [". ولكن، حين ", []], ["نحب", ["G25"]], [" ", []], ["بعضنا بعضا", ["G240"]], ["، نبين أن ", []], ["الله", ["G2316"]], [" ", []], ["يحيا", ["G3306"]], [" في داخلنا، وأن ", []], ["محبته", ["G26"]], [" قد ", []], ["اكتملت", ["G5048"]], [" في داخلنا.", []]]}, {"c": 4, "v": 13, "text": "وما يؤكد لنا أننا نثبت في الله، وأنه يثبت فينا هو أنه وهب لنا من روحه.", "groups": [{"kw": "", "raw": "1Jo_4:15, 1Jo_4:16, 1Jo_3:24; Joh_14:20-26; Rom_8:9-17; 1Co_2:12, 1Co_3:16, 1Co_3:17, 1Co_6:19; Gal_5:22-25; Eph_2:20-22", "note": "", "refs": [{"l": "1Jo 4:15", "n": "", "vs": [[15, "من يعترف بأن يسوع هو ابن الله، فإن الله يثبت فيه، وهو يثبت في الله،"]]}, {"l": "1Jo 4:16", "n": "", "vs": [[16, "ونحن أنفسنا اختبرنا المحبة التي خصنا الله بها، ووضعنا ثقتنا فيها. إن الله محبة. ومن يثبت في المحبة، فإنه يثبت في الله، والله يثبت فيه."]]}, {"l": "1Jo 3:24", "n": "", "vs": [[24, "وكل من يطيع وصايا الله، فإنه يثبت في الله، والله يثبت فيه. والذي يؤكد لنا أن الله يثبت فينا، هو الروح القدس الذي وهبه لنا."]]}, {"l": "Joh 14:20-26", "n": "", "vs": [[20, "في ذلك اليوم تعلمون أني أنا في أبي، وأنتم في، وأنا فيكم."], [21, "من كانت عنده وصاياي، ويعمل بها، فذاك يحبني. والذي يحبني، يحبه أبي، وأنا أحبه وأعلن له ذاتي»."], [22, "فسأله يهوذا، غير الإسخريوطي: «ياسيد، ماذا جرى حتى تعلن لنا ذاتك ولا تعلنها للعالم؟»"], [23, "أجابه يسوع: «من يحبني يعمل بكلمتي، ويحبه أبي، وإليه نأتي، وعنده نجعل لنا منزلا."], [24, "والذي لا يحبني لا يعمل بكلامي. وليس هذا الكلام الذي تسمعونه من عندي، بل من الآب الذي أرسلني،"], [25, "وقد قلت لكم هذه الأمور وأنا مازلت عندكم."], [26, "وأما الروح القدس، المعين الذي سيرسله الآب باسمي، فإنه يعلمكم كل شيء، ويذكركم بكل ما قلته لكم."]]}, {"l": "Rom 8:9-17", "n": "", "vs": [[9, "وأما أنتم، فلستم تحت سلطة الجسد بل تحت سلطة الروح، إذا كان روح الله ساكنا في داخلكم حقا. ولكن، إن كان أحد ليس له روح المسيح، فهو ليس للمسيح."], [10, "وإذا كان المسيح فيكم، فمع أن الجسد مائت بسبب الخطيئة، فإن الروح حياة لكم بسبب البر."], [11, "وإذا كان روح الذي أقام يسوع من بين الأموات يسكن فيكم، فإن الذي أقام المسيح من بين الأموات سوف يحيي أيضا أجسادكم الفانية بسبب روحه الذي يسكن فيكم."], [12, "فليس علينا إذن، أيها الإخوة، أي التزام نحو الجسد لنعيش بحسب الجسد."], [13, "لأنه إن عشتم بحسب الجسد، فإنكم ستموتون، ولكن إن كنتم بالروح تميتون أعمال الجسد، فستحيون."], [14, "فإن جميع الخاضعين لقيادة روح الله، هم أبناء لله."], [15, "إذ إنكم لم تنالوا روح عبودية يعيدكم إلى الخوف، بل نلتم روح بنوة به نصرخ: «أبا! أبانا!»"], [16, "فالروح نفسه يشهد مع أرواحنا بأننا أولاد الله."], [17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}, {"l": "1Co 2:12", "n": "", "vs": [[12, "وأما نحن فقد نلنا لا روح العالم بل الروح الذي من الله، لنعرف الأمور التي وهبت لنا من قبل الله."]]}, {"l": "1Co 3:16", "n": "", "vs": [[16, "ألا تعرفون أنكم هيكل الله وأن روح الله ساكن فيكم؟"]]}, {"l": "1Co 3:17", "n": "", "vs": [[17, "فإن دمر أحد هيكل الله، يدمره الله ، لأن هيكل الله مقدس، وهو أنتم"]]}, {"l": "1Co 6:19", "n": "", "vs": [[19, "أما تعلمون أن جسدكم هو هيكل للروح القدس الساكن فيكم والذي هو لكم من الله، وأنكم أنتم لستم ملكا لأنفسكم؟"]]}, {"l": "Gal 5:22-25", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"], [23, "والوداعة وضبط النفس. وليس من قانون يمنع مثل هذه الفضائل."], [24, "ولكن الذين صاروا خاصة للمسيح، قد صلبوا الجسد مع الأهواء والشهوات."], [25, "إذا كنا نحيا بالروح، فلنسلك أيضا بالروح."]]}, {"l": "Eph 2:20-22", "n": "", "vs": [[20, "وقد بنيتم على أساس الرسل والأنبياء، والمسيح يسوع نفسه هو حجر الزاوية الأساس،"], [21, "الذي فيه يتناسق البناء كله فيرتفع ليصير هيكلا مقدسا في الرب."], [22, "وفيه أنتم أيضا قد بنيتم معا فصرتم مسكنا لله بوجود الروح."]]}], "kwAr": "", "noteAr": ""}], "arS": [["وما ", []], ["يؤكد", ["G1097"]], [" لنا أننا ", []], ["نثبت", ["G3306"]], [" في الله، وأنه ", []], ["يثبت", ["G3306"]], [" فينا هو أنه ", []], ["وهب", ["G1325"]], [" لنا من ", []], ["روحه", ["G4151"]], [".", []]]}, {"c": 4, "v": 14, "text": "ونحن أنفسنا نشهد أن الآب قد أرسل الابن مخلصا للعالم، لأننا رأيناه بعيوننا.", "groups": [{"kw": "we have", "raw": "1Jo_1:1-3, 1Jo_5:9; Joh_1:14, Joh_3:11, Joh_3:32, Joh_5:39, Joh_15:26, Joh_15:27; Act_18:5; 1Pe_5:12", "note": "", "refs": [{"l": "1Jo 1:1-3", "n": "", "vs": [[1, "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."], [2, "فإن «الحياة» تجلت أمامنا. وبعدما رأيناها فعلا، نشهد لها الآن. وها نحن ننقل إليكم خبر هذه الحياة الأبدية التي كانت عند الآب ثم تجلت أمامنا!"], [3, "فنحن، إذن، نخبركم بما رأيناه وسمعناه، لكي تكونوا شركاءنا. كما أن شركتنا هي مع الآب ومع ابنه يسوع المسيح."]]}, {"l": "1Jo 5:9", "n": "", "vs": [[9, "إن كنا نصدق الشهادة التي يقدمها الناس، فالشهادة التي يقدمها الله أعظم، لأنها شهادة إلهية شهد الله بها لابنه."]]}, {"l": "Joh 1:14", "n": "", "vs": [[14, "والكلمة صار بشرا، وخيم بيننا، ونحن رأينا مجده، مجد ابن وحيد عند الآب، وهو ممتلىء بالنعمة والحق."]]}, {"l": "Joh 3:11", "n": "", "vs": [[11, "الحق الحق أقول لك: إننا نتكلم بما نعلم ونشهد بما رأينا، ومع ذلك لا تقبلون شهادتنا."]]}, {"l": "Joh 3:32", "n": "", "vs": [[32, "وهو يشهد بما سمع ورأى، ولا أحد يقبل شهادته!"]]}, {"l": "Joh 5:39", "n": "", "vs": [[39, "أنتم تدرسون الكتب لأنكم تعتقدون أنها ستهديكم إلى الحياة الأبدية. هذه الكتب تشهد لي،"]]}, {"l": "Joh 15:26", "n": "", "vs": [[26, "وعندما يأتي المعين، الذي سأرسله لكم من عند الآب، روح الحق الذي ينبثق من الآب، فهو يشهد لي،"]]}, {"l": " l": "1Pe 4:1-3", "n": "", "vs": [[1, "فبما أن المسيح قد تحمل الآلام الجسمية لأجلكم، سلحوا أنفسكم بالاستعداد دائما لتحمل الآلام. فإن من يتحمل الآلام الجسمية، يكون قد قاطع الخطيئة."], [2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."], [3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}, {"l": "1Pe 4:13", "n": "", "vs": [[13, "وإنما افرحوا: لأنكم كما تشاركون المسيح في الآلام الآن، لابد أن تفرحوا بمشاركته في الابتهاج عند ظهور مجده."]]}, {"l": "1Pe 4:14", "n": "", "vs": [[14, "فإذا لحقتكم الإهانة لأنكم تحملون اسم المسيح، فطوبى لكم! لأن روح المجد، أي روح الله، يستقر عليكم."]]}], "kwAr": "كما المسيح هكذا نحن", "noteAr": ""}], "arS": [["وتكون ", []], ["محبة", ["G26"]], [" الله قد ", []], ["اكتملت", ["G5048"]], [" في داخلنا حين تولد فينا ", []], ["ثقة", ["G3954"]], [" كاملة من جهة ", []], ["يوم", ["G2250"]], [" ", []], ["الدينونة", ["G2920"]], [": لأنه كما المسيح، هكذا نحن أيضا في هذا ", []], ["العالم", ["G2889"]], [".", []]]}, {"c": 4, "v": 18, "text": "ليس في المحبة أي خوف. بل المحبة الكاملة تطرد الخوف خارجا. فإن الخوف يأتي من العقاب. والخائف لا تكون محبة الله قد اكتملت فيه.", "groups": [{"kw": "is no", "raw": "Luk_1:74, Luk_1:75; Rom_8:15; 2Ti_1:7; Heb_12:28", "note": "", "refs": [{"l": "Luk 1:74", "n": "", "vs": [[74, "بعد تخليصنا من أيدي أعدائنا، أن نعبده بلا خوف،"]]}, {"l": "Luk 1:75", "n": "", "vs": [[75, "بقداسة وبر أمامه، طوال حياتنا."]]}, {"l": "Rom 8:15", "n": "", "vs": [[15, "إذ إنكم لم تنالوا روح عبودية يعيدكم إلى الخوف، بل نلتم روح بنوة به نصرخ: «أبا! أبانا!»"]]}, {"l": "2Ti 1:7", "n": "", "vs": [[7, "فإن الله قد أعطانا لا روح الجبن بل روح القوة والمحبة والبصيرة."]]}, {"l": "Heb 12:28", "n": "", "vs": [[28, "فبما أننا قد حصلنا على مملكة ثابتة لا تتزلزل، لنعبد الله ونخدمه شاكرين، بصورة ترضيه، بكل احترام ومخافة،"]]}], "kwAr": "ليس في المحبة أي خوف", "noteAr": ""}, {"kw": "fear hath", "raw": "Job_15:21; Psa_73:19, 2:37-39", "n": "", "vs": [[37, "فأجابه: «أحب الرب إلهك بكل قلبك وكل نفسك وكل فكرك!"], [38, "هذه هي الوصية العظمى الأولى."], [39, "والثانية مثلها: أحب قريبك كنفسك!"]]}, {"l": "Mar 12:29-33", "n": "", "vs": [[29, "فأجابه يسوع: «أولى الوصايا جميعا هي: اسمع ياإسرائيل، الرب إلهنا رب واحد"], [30, "فأحب الرب إلهك بكل قلبك وبكل نفسك وبكل فكرك وبكل قوتك. هذه هي الوصية الأولى."], [31, "وهناك ثانية مثلها، وهي أن تحب قريبك كنفسك. فما من وصية أخرى أعظم من هاتين»."], [32, "فقال له الكاتب: «صحيح، يامعلم! حسب الحق تكلمت. فإن الله واحد وليس آخر سواه."], [33, "ومحبته بكل القلب وبكل الفهم وبكل القوة، ومحبة القريب كالنفس، أفضل من جميع المحرقات والذبائح!»"]]}, {"l": "Luk 10:37", "n": "", "vs": [[37, "فأجاب: «إنه الذي عامله بالرحمة!» فقال له يسوع: «اذهب، واعمل أنت هكذا! »"]]}, {"l": "Joh 13:34", "n": "", "vs": [[34, "وصية جديدة أنا أعطيكم: أحبوا بعضكم بعضا، كما أحببتكم أنا، تحبون بعضكم."]]}, {"l": "Joh 13:35", "n": "", "vs": [[35, "بهذا يعرف الجميع أنكم تلاميذي: إن كنتم تحبون بعضكم بعضا»."]]}, {"l": "Joh 15:12", "n": "", "vs": [[12, "وصيتي لكم هي هذه: أن يحب بعضكم بعضا كما أنا أحببتكم."]]}, {"l": "Rom 12:9", "n": "", "vs": [[9, "ولتكن المحبة بلا رياء. انفروا من الشر، والتصقوا بالخير."]]}, {"l": "Rom 12:10", "n": "", "vs": [[10, "أحبوا بعضكم بعضا محبة أخوية، مفضلين بعضكم على بعض في الكرامة."]]}, {"l": "Rom 13:9", "n": "", "vs": [[9, "لأن الوصايا «لا تزن، لا تقتل، لا تسرق، لا تشهد زورا، لا تشته....» وباقي الوصايا، تتلخص في هذه الكلمة: «أحب قريبك كنفسك!»"]]}, {"l": "Rom 13:10", "n": "", "vs": [[10, "فالمحبة لا تعمل سوءا للقريب. وهكذا تكون المحبة إتماما للشريعة كلها."]]}, {"l": "Gal 5:6", "n": "", "vs": [[6, "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة."]]}, {"l": "Gal 5:14", "n": "", "vs": [[14, "فإن الشريعة كلها تتم في وصية واحدة: «أن تحب قريبك كنفسك»."]]}, {"l": "1Th 4:9", "n": "", "vs": [[9, "أما المحبة الأخوية، فلستم في حاجة لأن أكتب إليكم عنها، لأنكم بأنفسكم قد تعلمتم من الله أن تحبوا بعضكم بعضا،"]]}, {"l": "1Pe 3:8", "n": "", "vs": [[8, "والخلاصة، كونوا جميعا متحدين في الرأي، متعاطفين بعضكم مع بعض، مبادلين أحدكم الآخر المحبة الأخوية، شفوقين، متواضعين."]]}, {"l": "1Pe 4:8", "n": "", "vs": [[8, "لكن أهم شيء هو أن تبادلوا بعضكم بعضا المحبة الشديدة. لأن المحبة تستر إساءات كثيرة."]]}], "kwAr": "", "noteAr": ""}], "arS": [["فهذه ", []], ["الوصية", ["G1785"]], [" جاءتنا من المسيح نفسه: من ", []], ["يحب", ["G25"]], [" ", []], ["الله", ["G2316"]], [" ، ", []], ["يحب", ["G25"]], [" ", []], ["أخاه", ["G80"]], ["!", []]]}, {"c": 5, "v": 1, "text": "كل من يؤمن حقا أن يسوع هو المسيح، فهو مولود من الله. ومن يحب الوالد، فلابد أن يحب المولودين منه أيضا.", "groups": [{"kw": "believeth", "raw": "1Jo_2:22, 1Jo_2:23, 1Jo_4:2, 1Jo_4:14, 1Jo_4:15; Mat_16:16; Joh_1:12, Joh_1:13, Joh_6:69; Act_8:37; Rom_10:9, Rom_10:10", "note": "", "refs": [{"l": "1Jo 2:22", "n": "", "vs": [[22, "ومن هو الكذاب؟ إنه الذي ينكر أن يسوع هو المسيح حقا. إنه ضد للمسيح ينكر الآب والابن معا."]]}, {"l": "1Jo 2:23", "n": "", "vs": [[23, "وكل من ينكر الابن، لا يكون الآب أيضا من نصيبه. ومن يعترف بالابن، فله الآب أيضا."]]}, {"l": "1Jo 4:2", "n": "", "vs": [[2, "وهذه هي الطريقة التي تعرفون بها كون الروح من عند الله فعلا: إذا كان ذلك الروح يعترف بأن يسوع المسيح قد جاء إلى الأرض في الجسد، فهو من عند الله."]]}, {"l": "1Jo 4:14", "n": "", "vs": [[14, "ونحن أنفسنا نشهد أن الآب قد أرسل الابن مخلصا للعالم، لأننا رأيناه بعيوننا."]]}, {"l": "1Jo 4:15", "n": "", "vs": [[15, "من يعترف بأن يسوع هو ابن الله، فإن الله يثبت فيه، وهو يثبت في الله،"]]}, {"l": "Mat 16:16", "n": "", "vs": [[16, "فأجاب سمعان بطرس قائلا: «أنت هو المسيح ابن الله الحي!»"]]}, {"l": "Joh 1:12", "n": "", "vs": [[12, "أما الذين قبلوه، أي الذين آمنوا باسمه، فقد منحهم الحق في أن يصيروا أولاد الله،"]]}, {"l": "Joh 1:13", "n": "", "vs": [[13, "وهم الذين ولدوا ليس من دم، ولا من رغبة جسد، ولا من رغبة بشر، بل من الله."]]}, {"l": "Joh 6:69", "n": "", "vs": [[69, "نحن آمنا وعرفنا أنك قدوس الله!»"]]}, {"l": "Act 8:37", "n": "", "vs": [[37, "فأجابه فيلبس: «هذا جائز إن كنت تؤمن من كل قلبك». فقال الخصي: «إني أومن بأن يسوع المسيح هو ابن الله»."]]}, {"l": "Rom 10:9", "n": "", "vs": [[9, "أنك إن اعترفت بفمك بيسوع ربا، وآمنت في قلبك بأن الله أقامه من الأموات، نلت الخلاص."]]}, {"l": "Rom 10:10", "n": "", "vs": [[10, "فإن الإيمان في القلب يؤدي إلى البر، والاعتراف بالفم يؤيد الخلاص،"]]}], "kwAr": "من يؤمن", "noteAr": ""}, {"kw": "is born", "raw": "1Jo_5:4, 1Jo_2:29, 1Jo_3:9, 1Jo_4:7", "note": "", "refs": [{"l": "1Jo 5:4", "n": "", "vs": [[4, "ذلك لأن المولود من الله ينتصر على العالم. فالإيمان هو الذي يجعلنا ننتصر على العالم."]]}, {"l": "1Jo 2:29", "n": "", "vs": [[29, "وما دمتم تعلمون أن الله بار، فاعلموا أن كل من يفعل الصلاح، يظهر أنه مولود من الله حقا."]]}, {"l": "1Jo 3:9", "n": "", "vs": [[9, "فكل مولود من الله، لا يمارس الخطيئة، لأن طبيعة الله صارت ثابتة فيه. بل إنه لا يستطيع أن يمارس الخطيئة، لأنه مولود من الله."]]}, {"l": "1Jo 4:7", "n": "", "vs": [[7, "أيها الأحباء، لنحب بعضنا بعضا: لأن المحبة تصدر من الله. إذن، كل من يحب، يكون مولودا من الله ويعرف الله ."]]}], "kwAr": "مولود من الله", "noteAr": ""}, {"kw": "and every", "raw": "1Jo_2:10, 1Jo_3:14, 1Jo_3:17, 1Jo_4:20; Joh_15:23; Jam_1:18; 1Pe_1:3, 1Pe_1:22, 1Pe_1:23", "note": "", "refs": [{"l": "1Jo 2:10", "n": "", "vs": [[10, "فالذي يحب إخوته، هو الذي يحيا في النور فعلا ولا شيء يسقطه."]]}, {"l": "1Jo 3:14", "n": "", "vs": [[14, "إن محبتنا لإخوتنا تبين لنا أننا انتقلنا من الموت إلى الحياة. فالذي لا يحب إخوته، فهو باق في الموت."]]}, {"l": "1Jo 3:17", "n": "", "vs": [[17, "وأما الذي يملك مالا يمكنه من العيش في بحبوحة، ويقسي قلبه على أحد الإخوة المحتاجين، فكيف تكون محبة الله متأصلة فيه؟"]]}, {"l": "1Jo 4:20", "n": "", "vs": [[20, "فإن قال أحد: «أنا أحب الله !» ولكنه يبغض أخا له، فهو كاذب، لأنه إن كان لا يحب أخاه الذي يراه، فكيف يقدر أن يحب الله الذي لم يره قط؟"]]}, {"l": "Joh 15:23", "n": "", "vs": [[23, "الذي يبغضني، يبغض أبي أيضا."]]}, {"l": "Jam 1:18", "n": "", "vs": [[18, "وهو قد شاء أن يجعلنا أولادا له، فولدنا بكلمته، كلمة الحق. وغايته أن نكون باكورة خليقته."]]}, {"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}, {"l": "1Pe 1:23", "n": "", "vs": [[23, "فأنتم قد ولدتم ولادة ثانية لا من زرع بشري يفنى، بل مما لا يفنى: بكلمة الله الحية الباقية إلى الأبد."]]}], "kwAr": "من يحب الوالد", "noteAr": ""}], "arS": [["كل", ["G3956"]], [" من ", []], ["يؤمن", ["G4100"]], [" حقا أن ", []], ["يسوع", ["G2424"]], [" هو ", []], ["المسيح", ["G5547"]], ["، فهو ", []], ["مولود", ["G1080"]], [" من ", []], ["الله", ["G2316"]], [". ومن ", []], ["يحب", ["G25"]], [" ", []], ["الوالد", ["G1080"]], ["، فلابد أن ", []], ["يحب", ["G25"]], [" ", []], ["المولودين", ["G1080"]], [" منه أيضا.", []]]}, {"c": 5, "v": 2, "text": "وما يثبت لنا محبتنا لأولاد الله هو أن نحب الله ونعمل بوصاياه.", "groups": [{"kw": "", "raw": "1Jo_3:22-24, 1Jo_4:21; Joh_13:34, Joh_13:35, Joh_15:17", "note": "", "refs": [{"l": "1Jo 3:22-24", "n": "", "vs": [[22, "ومهما نطلب منه بالصلاة، نحصل عليه: لأننا نطيع ما يوصينا به، ونمارس الأعمال التي ترضيه."], [23, "وأما وصيته فهي أن نؤمن باسم ابنه يسوع المسيح، وأن يحب بعضنا بعضا كما أوصانا."], [24, "وكل من يطيع وصايا الله، فإنه يثبت في الله، والله يثبت فيه. والذي يؤكد لنا أن الله يثبت فينا، هو الروح القدس الذي وهبه لنا."]]}, {"l": "1Jo 4:21", "n": "", "vs": [[21, "فهذه الوصية جاءتنا من المسيح نفسه: من يحب الله ، يحب أخاه!"]]}, {"l": "Joh 13:34", "n": "", "vs": [[34, "وصية جديدة أنا أعطيكم: أحبوا بعضكم بعضا، كما أحببتكم أنا، تحبون بعضكم."]]}, {"l": "Joh 13:35", "n": "", "vs": [[35, "بهذا يعرف الجميع أنكم تلاميذي: إن كنتم تحبون بعضكم بعضا»."]]}, {"l": "Joh 15:17", "n": "", "vs": [[17, "فبهذا أوصيكم إذن: أن تحبوا بعضكم بعضا."]]}], "kwAr": "", "noteAr": ""}], "arS": [["وما ", []], ["يثبت", ["G1097"]], [" لنا ", []], ["محبتنا", ["G25"]], [" ", []], ["لأولاد", ["G5043"]], [" ", []], ["الله", ["G2316"]], [" هو أن ", []], ["نحب", ["G25"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["ونعمل", ["G5083"]], [" ", []], ["بوصاياه", ["G1785"]], [".", []]]}, {"c": 5, "v": 3, "text": "فالمحبة الحقيقية لله هي أن نعمل بما يوصينا به. وهو لا يوصينا وصية فوق طاقتنا.", "groups": [{"kw": "this", "raw": "Exo_20:6; Deu_5:10, Deu_7:9, Deu_10:12, Deu_10:13; Dan_9:4; Mat_12:47-50; Joh_14:15; Joh_14:21-24, Joh_15:10,Joh_15:14; 2Jo_1:6", "note": "", "refs": [{"l": "Exo 20:6", "n": "", "vs": [[6, "وأبدي إحسانا نحو ألوف من محبي الذين يطيعون وصاياي."]]}, {"l": "Deu 5:10", "n": "", "vs": [[10, "وأحسن إلى ألوف من محبي وطائعي وصاياي."]]}, {"l": "Deu 7:9", "n": "", "vs": [[9, "فاعلموا أن الرب إلهكم هو الله ، الإله الأمين الوفي بالعهد والإحسان لمحبيه وحافظي وصاياه إلى ألف جيل."]]}, {"l": "Deu 10:12", "n": "", "vs": [[12, "فالآن أيها الإسرائيليون ماذا يطلب منكم الرب إلهكم سوى أن تتقوه وتسلكوا في كل طرقه، وتحبوه وتعبدوه من كل قلوبكم ومن كل نفوسكم،"]]}, {"l": "Deu 10:13", "n": "", "vs": [[13, "وتطيعوا وصاياه وفرائضه، التي أنا أوصيكم بها اليوم لخيركم؟"]]}, {"l": "Dan 9:4", "n": "", "vs": [[4, "وصليت إلى الرب إلهي واعترفت قائلا: «أيها الرب الإله العظيم المهوب، حافظ العهد والرحمة لمحبيه وعاملي وصاياه."]]}, {"l": "Mat 12:47-50", "n": "", "vs": [[47, "فقال له واحد من الحاضرين: «ها إن أمك وإخوتك واقفون خارجا يطلبون أن يكلموك!»"], [48, "فأجاب قائلا للذي أخبره: «من هي أمي؟ ومن هم إخوتي؟»"], [49, "ثم أشار بيده إلى تلاميذه، وقال: «هؤلاء هم أمي وإخوتي:"], [50, "لأن كل من يعمل بإرادة أبي الذي في السماوات هو أخي وأختي وأمي ! »"]]}, {"l": "Joh 14:15", "n": "", "vs": [[15, "إن كنتم تحبونني فاعملوا بوصاياي."]]}, {"l": "Joh 14:21-24", "n": "", "vs": [[21, "من كانت عنده وصاياي، ويعمل بها، فذاك يحبني. والذي يحبني، يحبه أبي، وأنا أحبه وأعلن له ذاتي»."], [22, "فسأله يهوذا، غير الإسخريوطي: «ياسيد، ماذا جرى حتى تعلن لنا ذاتك ولا تعلنها للعالم؟»"], [23, "أجابه يسوع: «من يحبني يعمل بكلمتي، ويحبه أبي، وإليه نأتي، وعنده نجعل لنا منزلا."], [24, "والذي لا يحبني لا يعمل بكلامي. وليس هذا الكلام الذي تسمعونه من عندي، بل من الآب الذي أرسلني،"]]}, {"l": "Joh 15:10", "n": "", "vs": [[10, "إن عملتم بوصاياي، تثبتون في محبتي، كما عملت أنا بوصايا أبي وأثبت في محبته!"]]}, {"l": "Joh 15:14", "n": "", "vs": [[14, "وأنتم أحبائي إن عملتم بما أوصيكم به."]]}, {"l": "2Jo 1:6", "n": "", "vs": [[6, "هذه هي المحبة: أن نسلك وفقا لوصاياه. وهذه هي الوصية، كما سمعتم منذ البداية: أن تسلكوا في المحبة!"]]}], "kwAr": "المحبة الحقيقية لله", "noteAr": ""}, {"kw": "and", "raw": "Psa_19:7-11, Psa_119:45, Psa_119:47, Psa_119:48, Psa_119:103, Psa_119:104, Psa_119:127, Psa_119:128, Psa_119:140; Pro_3:17; Mic_6:8; Mat_11:28-30; Rom_7:12, Rom_7:22; Heb_8:10", "note": "", "refs": [{"l": "Psa 19:7-11", "n": "", "vs": [[7, "شريعة الرب كاملة تنعش النفس. شهادة الرب صادقة تجعل الجاهل حكيما."], [8, "وصايا الرب مستقيمة تفرح القلب. أمر الرب نقي ينير العينين."], [9, "مخافة الرب طاهرة ثابتة إلى الأبد، وأحكام الرب حق وعادلة كلها."], [10, "إنها أشهى من الذهب النقي، وهي أحلى من العسل بل القطر السائل من أقراص الشهد."], [11, "عبدك يهتدي بها، وفي صونها ثواب عظيم."]]}, {"l": "Psa 119:45", "n": "", "vs": [[45, "وأسلك في رحابة الحرية، لأني التمست أوامرك."]]}, {"l": "Psa 119:47", "n": "", "vs": [[47, "وأتلذذ بوصاياك التي أحببتها،"]]}, {"l": "Psa 119:48", "n": "", "vs": [[48, "وأرفع كفي إلى وصاياك التي أحببتها وأتأمل في فرائضك."]]}, {"l": "Psa 119:103", "n": "", "vs": [[103, "ما أحلى أقوالك لمذاقي. إنها أحلى من العسل في فمي."]]}, {"l": "Psa 119:104", "n": "", "vs": [[104, "من وصاياك اكتسبت فطنة لذلك أبغضت كل طريق باطل."]]}, {"l": "Psa 119:127", "n": "", "vs": [[127, "لذلك أحب وصاياك أكثر من الذهب الخالص،"]]}, {"l": "Psa 119:128", "n": "", "vs": [[128, "ولأني أحسب كل فرائضك مستقيمة في كل شيء، أبغض كل طريق باطل."]]}, {"l": "Psa 119:140", "n": "", "vs": [[140, "أقوالك ممحصة نقية، وعبدك أحبها."]]}, {"l": "Pro 3:17", "n": "", "vs": [[17, "طرقها طرق نعم، ودروبها دروب سلام."]]}, {"l": "Mic 6:8", "n": "", "vs": [[8, "لقد أوضح لك الرب أيها الإنسان ما هو صالح. وماذا يبتغي منك سوى أن تتوخى العدل، وتحب الرحمة، وتسلك متواضعا مع إلهك؟"]]}, {"l": "Mat 11:28-30", "n": "", "vs": [[28, "تعالوا إلي ياجميع المتعبين والرازحين تحت الأحمال الثقيلة، وأنا أريحكم."], [29, "احملوا نيري عليكم، وتتلمذوا على يدي، لأني وديع ومتواضع القلب، فتجدوا الراحة لنفوسكم."], [30, "فإن نيري هين، وحملي خفيف!»"]]}, {"l": "Rom 7:12", "n": "", "vs": [[12, "فالشريعة إذن مقدسة، والوصية مقدسة وعادلة وصالحة."]]}, {"l": "Rom 7:22", "n": "", "vs": [[22, "أن لدي الشر. فإنني، وفقا للإنسان الباطن في، أبتهج بشريعة الله."]]}, {"l": "Heb 8:10", "n": "", "vs": [[10, "فهذا هو العهد الذي أبرمه مع بني إسرائيل، بعد تلك الأيام، يقول الرب: أضع شرائعي داخل ضمائرهم، وأكتبها على قلوبهم، وأكون لهم إلها، وهم يكونون لي شعبا."]]}], "kwAr": "لا يوصينا وصية فوق طاقتنا", "noteAr": ""}], "arS": [["فالمحبة", ["G26"]], [" الحقيقية ", []], ["لله", ["G2316"]], [" هي أن ", []], ["نعمل", ["G5083"]], [" بما ", []], ["يوصينا", ["G1785"]], [" به. وهو لا يوصينا ", []], ["وصية", ["G1785"]], [" ", []], ["فوق طاقتنا", ["G926"]], [".", []]]}, {"c": 5, "v": 4, "text": "ذلك لأن المولود من الله ينتصر على العالم. فالإيمان هو الذي يجعلنا ننتصر على العالم.", "groups": [{"kw": "whatsoever", "raw": "1Jo_5:1, 1Jo_3:9", "note": "", "refs": [{"l": "1Jo 5:1", "n": "", "vs": [[1, "كل من يؤمن حقا أن يسوع هو المسيح، فهو مولود من الله. ومن يحب الوالد، فلابد أن يحب المولودين منه أيضا."]]}, {"l": "1Jo 3:9", "n": "", "vs": [[9, "فكل مولود من الله، لا يمارس الخطيئة، لأن طبيعة الله صارت ثابتة فيه. بل إنه لا يستطيع أن يمارس الخطيئة، لأنه مولود من الله."]]}], "kwAr": "المولود من الله", "noteAr": ""}, {"kw": "overcometh", "raw": "1Jo_5:5, 1Jo_2:13-17, 1Jo_4:4; Joh_16:33; Rom_8:35-37; 1Co_15:57; Rev_2:7, Rev_2:11, Rev_2:17, Rev_2:26; Rev_3:5, Rev_3:12, Rev_3:21, Rev_12:11, Rev_15:2", "note": "", "refs": [{"l": "1Jo 5:5", "n": "", "vs": [[5, "ومن ينتصر على العالم إلا الذي يؤمن أن يسوع هو ابن الله؟"]]}, {"l": "1Jo 2:13-17", "n": "", "vs": [[13, "أكتب إليكم أيها الآباء، لأنكم قد عرفتم المسيح الكائن منذ البداية. أكتب إليكم أيها الشباب، لأنكم قد غلبتم إبليس الشرير. كتبت إليكم أيها الأولاد الصغار، لأنكم قد عرفتم الآب."], [14, "كتبت إليكم، أيها الآباء، لأنكم قد عرفتم المسيح الكائن منذ البداية. كتبت إليكم، أيها الشباب، لأنكم أقوياء، وقد ترسخت كلمة الله في قلوبكم، وغلبتم إبليس الشرير."], [15, "لا تحبوا العالم، ولا الأشياء التي في العالم. فالذي يحب العالم، لا تكون محبة الآب في قلبه."], [16, "لأن كل ما في العالم، من شهوات الجسد وشهوات العين وترف المعيشة، ليس من الآب، بل من العالم."], [17, "وسوف يزول العالم، وما فيه من شهوات أما الذي يعمل بإرادة الله، فيبقى إلى الأبد!"]]}, {"l": "1Jo 4:4", "n": "", "vs": [[4, "أيها الأولاد الصغار، أنتم من الله، وقد غلبتم الذين يقاومون المسيح: لأن الروح القدس الساكن فيكم أقوى من الروح الشرير المنتشر في العالم."]]}, {"l": "Joh 16:33", "n": "", "vs": [[33, "أخبرتكم بهذا كله ليكون لكم في سلام. فإنكم في العالم ستقاسون الضيق. ولكن تشجعوا، فأنا قد انتصرت على العالم!»"]]}, {"l": "Rom 8:35-37", "n": "", "vs": [[35, "فمن سيفصلنا عن محبة المسيح لنا؟ هل الشدة أم الضيق أم الاضطهاد أم الجوع أم العري أم الخطر أم السيف؟"], [36, "بل كما قد كتب: «إننا من أجلك نعاني الموت طول النهار. قد حسبنا كأننا غنم للذبح!»"], [37, "ولكننا، في جميع هذه الأمور، نحرز ما يفوق الانتصار على يد من أحبنا."]]}, {"l": "1Co 15:57", "n": "", "vs": [[57, "ولكن الشكر لله الذي يمنحنا النصر بربنا يسوع المسيح!"]]}, {"l": "Rev 2:7", "n": "", "vs": [[7, "من له أذنان فليسمع ما يقوله الروح للكنائس! كل من ينتصر سأطعمه من ثمر شجرة الحياة في فردوس الله."]]}, {"l": "Rev 2:11", "n": "", "vs": [[11, "من له أذن فليسمع ما يقوله الروح للكنائس! كل من ينتصر لن يلحق به أذى الموت الثاني!"]]}, {"l": "Rev 2:17", "n": "", "vs": [[17, "من له أذن فليسمع ما يقوله الروح للكنائس! كل من سينتصر سأطعمه من المن الخفي، وأعطيه حجرا صغيرا أبيض حفر عليه اسم جديد لا يعرفه إلا الذي يأخذه!"]]}, {"l": "Rev 2:26", "n": "", "vs": [[26, "كل من ينتصر، ويستمر حتى النهاية في فعل ما يرضيني، فسوف أعطيه سلطانا على الأمم،"]]}, {"l": "Rev 3:5", "n": "", "vs": [[5, "كل من ينتصر سيلبس ثوبا أبيض، ولن أمحو اسمه من سجل الحياة، وسأعترف باسمه أمام أبي وملائكته."]]}, {"l": "Rev 3:12", "n": "", "vs": [[12, "كل من ينتصر سأجعله عمودا في هيكل إلهي، فلا يخرج منه أبدا، وسأكتب عليه اسم إلهي واسم مدينة إلهي أورشليم الجديدة، التي تنزل من السماء من عند إلهي، وأكتب عليه اسمي الجديد."]]}, {"l": "Rev 3:21", "n": "", "vs": [[21, "وكل من ينتصر سأجلسه معي على عرشي، كما انتصرت أنا أيضا فجلست مع أبي على عرشه؛"]]}, {"l": "Rev 12:11", "n": "", "vs": [[11, "وهم قد انتصروا عليه بدم الحمل وبالكلمة التي شهدوا لها، فلم تكن حياتهم عزيزة لديهم، حتى إنهم ماتوا."]]}, {"l": "Rev 15:2", "n": "", "vs": [[2, "ورأيت أيضا ما يشبه بحرا من زجاج تختلط به النار، وقد وقف عليه جميع الذين انتصروا على الوحش وتمثاله ورقم اسمه، وهم يحملون قيثارات الله،"]]}], "kwAr": "ينتصر على العالم", "noteAr": ""}], "arS": [["ذلك لأن ", []], ["المولود", ["G1080"]], [" من ", []], ["الله", ["G2316"]], [" ", []], ["ينتصر", ["G3528"]], [" على ", []], ["العالم", ["G2889"]], [". ", []], ["فالإيمان", ["G4102"]], [" هو الذي يجعلنا ", []], ["ننتصر", ["G3528"]], [" على ", []], ["العالم", ["G2889"]], [".", []]]}, {"c": 5, "v": 5, "text": "ومن ينتصر على العالم إلا الذي يؤمن أن يسوع هو ابن الله؟", "groups": [{"kw": "but", "raw": "1Jo_5:1, 1Jo_4:15", "note": "", "refs": [{"l": "1Jo 5:1", "n": "", "vs": [[1, "كل من يؤمن حقا أن يسوع هو المسيح، فهو مولود من الله. ومن يحب الوالد، فلابد أن يحب المولودين منه أيضا."]]}, {"l": "1Jo 4:15", "n": "", "vs": [[15, "من يعترف بأن يسوع هو ابن الله، فإن الله يثبت فيه، وهو يثبت في الله،"]]}], "kwAr": "إلا الذي يؤمن أن يسوع هو ابن الله", "noteAr": ""}], "arS": [["ومن ", []], ["ينتصر", ["G3528"]], [" على ", []], ["العالم", ["G2889"]], [" إلا الذي ", []], ["يؤمن", ["G4100"]], [" أن ", []], ["يسوع", ["G2424"]], [" هو ", []], ["ابن", ["G5207"]], [" ", []], ["الله", ["G2316"]], ["؟", []]]}, {"c": 5, "v": 6, "text": "فيسوع المسيح وحده جاءنا بالماء والدم. لا بالماء فقط، بل بالماء والدم معا. هذه الحقيقة، يشهد لها الروح القدس: لأنه هو الحق ذاته.", "groups": [{"kw": "is he", "raw": "Joh_19:34, Joh_19:35", "note": "", "refs": [{"l": "Joh 19:34", "n": "", "vs": [[34, "وإنما طعنه أحد الجنود بحربة في جنبه، فخرج في الحال دم وماء."]]}, {"l": "Joh 19:35", "n": "", "vs": [[35, "والذي رأى هذا هو يشهد، وشهادته حق وهو يعلم تماما أنه يقول الحق، لكي تؤمنوا أنتم أيضا."]]}], "kwAr": "يسوع المسيح وحده", "noteAr": ""}, {"kw": "by water and", "raw": "Isa_45:3, Isa_45:4; Eze_36:25; Joh_1:31-33, Joh_3:5, Joh_4:10,Joh_4:14, Joh_7:38, Joh_7:39; Act_8:36; Eph_5:25-27; Tit_3:5; 1Pe_3:21", "note": "", "refs": [{"l": "Isa 45:3", "n": "", "vs": [[3, "وأهبك كنوز الأقبية المظلمة وذخائر المخابيء، لتعرف أني أنا هو الرب إله إسرائيل الذي دعاك باسمك."]]}, {"l": "Isa 45:4", "n": "", "vs": [[4, "لأجل عبدي يعقوب، وإسرائيل مختاري دعوتك باسمك، لقبتك من غير أن تعرفني."]]}, {"l": "Eze 36:25", "n": "", "vs": [[25, "وأرش عليكم ماء نقيا فتطهرون من كل نجاستكم ومن كل أصنامكم،"]]}, {"l": "Joh 1:31-33", "n": "", "vs": [[31, "ولم أكن أعرفه ولكني جئت أعمد بالماء لكي يعلن لإسرائيل»."], [32, "ثم شهد يوحنا فقال: «رأيت الروح ينزل من السماء بهيئة حمامة ويستقر عليه."], [33, "ولم أكن أعرفه، ولكن الذي أرسلني لأعمد بالماء هو قال لي: الذي ترى الروح ينزل ويستقر عليه هو الذي سيعمد بالروح القدس."]]}, {"l": "Joh 3:5", "n": "", "vs": [[5, "أجابه يسوع: «الحق الحق أقول لك: لا يمكن أن يدخل أحد ملكوت الله إلا إذا ولد من الماء والروح."]]}, {"l": "Joh 4:10", "n": "", "vs": [[10, "فأجابها يسوع: «لو كنت تعرفين عطية الله، ومن هو الذي يقول لك: اسقيني، لطلبت أنت منه فأعطاك ماء حيا!»"]]}, {"l": "Joh 4:14", "n": "", "vs": [[14, "ولكن الذي يشرب من الماء الذي أعطيه أنا، لن يعطش بعد ذلك أبدا، بل إن ما أعطيه من ماء يصبح في داخله نبعا يفيض فيعطي حياة أبدية»."]]}, {"l": "Joh 7:38", "n": "", "vs": [[38, "وكما قال الكتاب، فمن آمن بي تجري من داخله أنهار ماء حي»."]]}, {"l": "Joh 7:39", "n": "", "vs": [[39, "قال يسوع هذا عن الروح القدس الذي كان المؤمنون به سيقبلونه. ولم يكن الروح قد أعطي بعد لأن يسوع لم يكن قد تمجد بعد."]]}, {"l": "Act 8:36", "n": "", "vs": [[36, "وبينما كانت العربة تسير بهما، وصلا إلى مكان فيه ماء، فقال الخصي: «ها هو الماء، فماذا يمنع أن أتعمد؟»"]]}, {"l": "Eph 5:25-27", "n": "", "vs": [[25, "أيها الأزواج، أحبوا زوجاتكم مثلما أحب المسيح الكنيسة وبذل نفسه لأجلها،"], [26, "لكي يقدسها مطهرا إياها بغسل الماء، بالكلمة،"], [27, "حتى يزفها إلى نفسه كنيسة بهية لا يشوبها عيب أو تجعد أو أية نقيصة مشابهة بل تكون مقدسة خالية من العيوب."]]}, {"l": "Tit 3:5", "n": "", "vs": [[5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"]]}, {"l": "1Pe 3:21", "n": "", "vs": [[21, "وعملية النجاة هذه مصورة في المعمودية التي لا نقصد بها أن نغتسل من أوساخ أجسامنا، بل هي تعهد ضمير صالح أمام الله بفضل قيامة يسوع المسيح،"]]}], "kwAr": "بالماء", "noteAr": ""}, {"kw": "blood", "raw": "1Jo_1:7, 1Jo_4:10; Lev_17:11; Zec_9:11; Mat_26:28; Mar_14:24; Luk_22:20; Joh_6:55; Rom_3:25; Eph_1:7; Col_1:4; Heb_9:7, Heb_9:14, Heb_10:29, Heb_12:24, Heb_13:20; 1Pe_1:2; Rev_1:5, Rev_5:9, Rev_7:14", "note": "", "refs": [{"l": "1Jo 1:7", "n": "", "vs": [[7, "ولكن، إن كنا فعلا نعيش في النور، كما هو في النور، تكون لنا حقا شركة بعضنا مع بعض، ودم ابنه يسوع يطهرنا من كل خطيئة."]]}, {"l": "1Jo 4:10", "n": "", "vs": [[10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."]]}, {"l": "Lev 17:11", "n": "", "vs": [[11, "لأن حياة الجسد هي في الدم. لهذا وهبتكم إياه لتكفروا عن نفوسكم، لأن الدم يكفر عن النفس."]]}, {"l": "Zec 9:11", "n": "", "vs": [[11, "أما أنتم فبفضل دم عهدي معكم أطلق أسراكم من الجب الذي لا ماء فيه."]]}, {"l": "Mat 26:28", "n": "", "vs": [[28, "فإن هذا هو دمي الذي للعهد الجديد والذي يسفك من أجل كثيرين لمغفرة الخطايا."]]}, {"l": "Mar 14:24", "n": "", "vs": [[24, "وقال لهم: «هذا هو دمي الذي للعهد الجديد والذي يسفك من أجل كثيرين."]]}, {"l": "Luk 22:20", "n": "", "vs": [[20, "وكذلك أخذ الكأس أيضا بعد العشاء، وقال: «هذه الكأس هي العهد الجديد بدمي الذي يسفك لأجلكم."]]}, {"l": "Joh 6:55", "n": "", "vs": [[55, "لأن جسدي هو الطعام الحقيقي، ودمي هو الشراب الحقيقي."]]}, {"l": "Rom 3:25", "n": "", "vs": [[25, "الذي قدمه الله كفارة، عن طريق الإيمان، وذلك بدمه."]]}, {"l": "Eph 1:7", "n": "", "vs": [[7, "ففيه لنا بدمه الفداء، أي غفران الخطايا؛ بحسب غنى نعمته"]]}, {"l": "Col 1:4", "n": "", "vs": [[4, "إذ بلغنا خبر إيمانكم بالمسيح يسوع والمحبة التي لكم نحو جميع القديسين،"]]}, {"l": "Heb 9:7", "n": "", "vs": [[7, "أما الغرفة الثانية، فلم يكن يدخلها إلا رئيس الكهنة وحده، مرة واحدة كل سنة. وكان من الواجب عليه أن يحمل دما يرشه على «كرسي الرحمة» تكفيرا عن نفسه وعن الخطايا التي ارتكبها الشعب عن جهل."]]}, {"l": "Heb 9:14", "n": "", "vs": [[14, "فكم بالأحرى دم المسيح الذي قدم نفسه لله بروح أزلي ذبيحة لا عيب فيها، يطهر ضمائرنا من الأعمال الميتة لنعبد الله الحي."]]}, {"l": "Heb 10:29", "n": "", "vs": [[29, "ففي ظنكم، كم يكون أشد كثيرا ذلك العقاب الذي يستحقه من يدوس ابن الله، إذ يعتبر أن دم العهد، الذي يتقدس به، هو دم نجس، وبذلك يهين روح النعمة؟"]]}, {"l": "Heb 12:24", "n": "", "vs": [[24, "كذلك، تقدمتم إلى يسوع، وسيط العهد الجديد، وإلى دمه المرشوش الذي يتكلم مطالبا بأفضل مما طالب به دم هابيل."]]}, {"l": "Heb 13:20", "n": "", "vs": [[20, "وأسأل الله ، إله السلام الذي أقام من بين الأموات ربنا يسوع راعي الخراف العظيم بفضل دمه الذي ختم به العهد الأبدي"]]}, {"l": "1Pe 1:2", "n": "", "vs": [[2, "بحسب علمه السابق ثم قدسهم بالروح ليطيعوا يسوع المسيح ويطهروا برش دمه عليهم."]]}, {"l": "Rev 1:5", "n": "", "vs": [[5, "ومن يسوع المسيح الشاهد الأمين، بكر القائمين من بين الأموات، ملك ملوك الأرض، ذاك الذي بدافع محبته لنا مات لأجلنا فغسلنا بدمه من خطايانا،"]]}, {"l": "Rev 5:9", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"]]}, {"l": "Rev 7:14", "n": "", "vs": [[14, "فأجبته: «أنت أعلم ياسيدي!» فقال: «هؤلاء هم الذين أتوا من الضيقة العظيمة، وقد غسلوا ثيابهم وبيضوها بدم الحمل."]]}], "kwAr": "والدم", "noteAr": ""}, {"kw": "the Spirit that", "raw": "1Jo_5:7, 1Jo_5:8; Joh_14:17, Joh_15:26; 1Ti_3:16", "note": "", "refs": [{"l": "1Jo 5:7", "n": "", "vs": [[7, "فإن هنالك ثلاثة شهود غفي السماء، الآب والكلمة والروح القدس، وهؤلاء الثلاثة هم واحدف."]]}, {"l": "1Jo 5:8", "n": "", "vs": [[8, "والذين يشهدون في الأرض هم ثلاثة: الروح، والماء، والدم. وهؤلاء الثلاثة هم في الواحد."]]}, {"l": "Joh 14:17", "n": "", "vs": [[17, "وهو روح الحق، الذي لا يقدر العالم أن يتقبله لأنه لا يراه ولا يعرفه، وأما أنتم فتعرفونه لأنه في وسطكم، وسيكون في داخلكم."]]}, {"l": "Joh 15:26", "n": "", "vs": [[26, "وعندما يأتي المعين، الذي سأرسله لكم من عند الآب، روح الحق الذي ينبثق من الآب، فهو يشهد لي،"]]}, {"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}], "kwAr": "يشهد لها الروح القدس", "noteAr": ""}, {"kw": "is truth", "raw": "Joh_14:6, Joh_16:13", "note": "", "refs": [{"l": "Joh 14:6", "n": "", "vs": [[6, "فأجابه يسوع: «أنا هو الطريق والحق والحياة. لا يأتي أحد إلى الآب إلا بي."]]}, {"l": "Joh 16:13", "n": "", "vs": [[13, "ولكن، عندما يأتيكم روح الحق يرشدكم إلى الحق كله، لأنه لا يقول شيئا من عنده، بل يخبركم بما يسمعه، ويطلعكم على ما سوف يحدث."]]}], "kwAr": "هو الحق ذاته", "noteAr": ""}], "arS": [["فيسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [" وحده ", []], ["جاءنا", ["G2064"]], [" ", []], ["بالماء", ["G5204"]], [" ", []], ["والدم", ["G129"]], [". لا ", []], ["بالماء", ["G5204"]], [" ", []], ["فقط", ["G3440"]], ["، بل ", []], ["بالماء", ["G5204"]], [" ", []], ["والدم", ["G129"]], [" معا. هذه الحقيقة، ", []], ["يشهد", ["G3140"]], [" لها ", []], ["الروح", ["G4151"]], [" القدس: لأنه هو ", []], ["الحق", ["G225"]], [" ذاته.", []]]}, {"c": 5, "v": 7, "text": "فإن هنالك ثلاثة شهود غفي السماء، الآب والكلمة والروح القدس، وهؤلاء الثلاثة هم واحدف.", "groups": [{"kw": "bear", "raw": "1Jo_5:10,1Jo_5:11; Joh_8:13, Joh_8:14", "note": "", "refs": [{"l": "1Jo 5:10", "n": "", "vs": [[10, "فمن يؤمن بابن الله، يثق في قلبه بصحة هذه الشهادة. أما من لا يصدق الله ، إذ يرفض تصديق الشهادة التي شهد بها لابنه، فهو يتهم الله بالكذب."]]}, {"l": "1Jo 5:11", "n": "", "vs": [[11, "وهذه الشهادة هي أن الله أعطانا حياة أبدية، وأن هذه الحياة هي في ابنه."]]}, {"l": "Joh 8:13", "n": "", "vs": [[13, "فاعترضه الفريسيون قائلين: «أنت الآن تشهد لنفسك، فشهادتك لا تصح».
