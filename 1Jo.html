"]]}, {"l": "1Ti 6:10", "n": "", "vs": [[10, "فإن حب المال أصل لكل شر؛ وإذ سعى بعضهم إليه، ضلوا عن الإيمان، وطعنوا أنفسهم بأوجاع كثيرة."]]}], "kwAr": "لا تحبوا العالم", "noteAr": ""}, {"kw": "If", "raw": "Mat_6:24; Luk_16:13; Jam_4:4", "note": "", "refs": [{"l": "Mat 6:24", "n": "", "vs": [[24, "لا يمكن لأحد أن يكون عبدا لسيدين: لأنه إما أن يبغض أحدهما فيحب الآخر، وإما أن يلزم أحدهما فيهجر الآخر. لا يمكنكم أن تكونوا عبيدا لله والمال معا."]]}, {"l": "Luk 16:13", "n": "", "vs": [[13, "ما من خادم يقدر أن يكون عبدا لسيدين: فإنه إما أن يبغض أحدهما، فيحب الآخر؛ وإما أن يلتحق بأحدهما، فيهجر الآخر. لا تستطيعون أن تكونوا عبيدا لله والمال معا»."]]}, {"l": "Jam 4:4", "n": "", "vs": [[4, "أيها الخونة! ألستم تعلمون أن مصادقة العالم هي معاداة لله؟ فالذي يريد أن يصادق العالم، يجعل نفسه عدوا لله."]]}], "kwAr": "فالذي يحب العالم", "noteAr": ""}, {"kw": "the love", "raw": "1Jo_3:17", "note": "", "refs": [{"l": "1Jo 3:17", "n": "", "vs": [[17, "وأما الذي يملك مالا يمكنه من العيش في بحبوحة، ويقسي قلبه على أحد الإخوة المحتاجين، فكيف تكون محبة الله متأصلة فيه؟"]]}], "kwAr": "محبة الآب", "noteAr": ""}], "arS": [["لا ", []], ["تحبوا", ["G25"]], [" ", []], ["العالم", ["G2889"]], ["، ولا الأشياء التي في ", []], ["العالم", ["G2889"]], [". فالذي ", []], ["يحب", ["G25"]], [" ", []], ["العالم", ["G2889"]], ["، لا تكون ", []], ["محبة", ["G26"]], [" ", []], ["الآب", ["G3962"]], [" في قلبه.", []]]}, {"c": 2, "v": 16, "text": "لأن كل ما في العالم، من شهوات الجسد وشهوات العين وترف المعيشة، ليس من الآب، بل من العالم.", "groups": [{"kw": "the lust of the flesh", "raw": "Num_11:4, Num_11:34; Psa_78:18, Psa_78:30; Pro_6:25; Mat_5:28; Rom_13:14; 1Co_10:6; Gal_5:17, Gal_5:24; Eph_2:3; Tit_2:12, Tit_3:3; 1Pe_1:14, 1Pe_2:11, 1Pe_4:2, 1Pe_4:3, 1Pe_4:2, 1Pe_4:3; 2Pe_2:10,2Pe_2:18; Jud_1:16-18", "note": "", "refs": [{"l": "Num 11:4", "n": "", "vs": [[4, "واشتهى أخلاط الأمم المقيمين بين بني إسرائيل، ممن خرجوا معهم من مصر، طعام مصر، فعاد بنو إسرائيل يبكون قائلين: «من يطعمنا لحما؟"]]}, {"l": "Num 11:34", "n": "", "vs": [[34, "فدعوا المكان «قبروت هتأوة» (ومعناه قبور الشهوة) لأنهم هناك دفنوا القوم المشتهين."]]}, {"l": "Psa 78:18", "n": "", "vs": [[18, "وجربوا الله في قلوبهم، طالبين طعاما اشتهته نفوسهم"]]}, {"l": "Psa 78:30", "n": "", "vs": [[30, "وقبل أن يفرغوا من الطعام الذي اشتهوه، وهو بعد في أفواههم،"]]}, {"l": "Pro 6:25", "n": "", "vs": [[25, "لا تشته جمالها في قلبك ولا تأسر لبك بأهدابها."]]}, {"l": "Mat 5:28", "n": "", "vs": [[28, "أما أنا فأقول لكم: كل من ينظر إلى امرأة بقصد أن يشتهيها، فقد زنى بها في قلبه!"]]}, {"l": "Rom 13:14", "n": "", "vs": [[14, "وإنما البسوا الرب يسوع المسيح (تمثلوا به)، ولا تنشغلوا بالتدبير للجسد لقضاء شهواته."]]}, {"l": "1Co 10:6", "n": "", "vs": [[6, "وإنما حدثت هذه الأمور لتكون مثالا لنا، حتى لا نشتهي أمورا شريرة كما اشتهى أولئك."]]}, {"l": "Gal 5:17", "n": "", "vs": [[17, "فإن الجسد يشتهي بعكس الروح، والروح بعكس الجسد؛ وهذان يقاوم أحدهما الآخر حتى إنكم لا تفعلون ما ترغبون فيه."]]}, {"l": "Gal 5:24", "n": "", "vs": [[24, "ولكن الذين صاروا خاصة للمسيح، قد صلبوا الجسد مع الأهواء والشهوات."]]}, {"l": "Eph 2:3", "n": "", "vs": [[3, "الذين بينهم نحن أيضا كنا نسلك سابقا في شهوات جسدنا، عاملين ما يريده الجسد والأفكار، وكنا بالطبيعة أولاد الغضب كالآخرين أيضا."]]}, {"l": "Tit 2:12", "n": "", "vs": [[12, "وهي تعلمنا أن نقطع علاقتنا بالإباحية والشهوات العالمية، وأن نحيا في العصر الحاضر حياة التعقل والبر والتقوى،"]]}, {"l": "Tit 3:3", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."]]}, {"l": "1Pe 1:14", "n": "", "vs": [[14, "وبما أنكم صرتم أولادا لله مطيعين له، فلا تعودوا إلى مجاراة الشهوات التي كانت تسيطر عليكم سابقا في أيام جهلكم."]]}, {"l": "1Pe 2:11", "n": "", "vs": [[11, "أيها الأحباء، ما أنتم إلا غرباء تزورون الأرض زيارة عابرة. لذلك أطلب إليكم أن تبتعدوا عن الشهوات الجسدية التي تصارع النفس."]]}, {"l": "1Pe 4:2", "n": "", "vs": [[2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."]]}, {"l": "1Pe 4:3", "n": "", "vs": [[3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}, {"l": "1Pe 4:2", "n": "", "vs": [[2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."]]}, {"l": "1Pe 4:3", "n": "", "vs": [[3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}, {"l": "2Pe 2:10", "n": "", "vs": [[10, "وما أشد العقاب، وبخاصة على الذين ينجرفون وراء الميول الجسدية، مستجيبين لشهوة النجاسة، ومحتقرين سيادة الله! ثم إنهم وقحون، معجبون بأنفسهم، لا يخافون أن يتكلموا بالشتم والإهانة على أصحاب الأمجاد."]]}, {"l": "2Pe 2:18", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."]]}, {"l": "Jud 1:16-18", "n": "", "vs": [[16, "وهؤلاء المعلمون يتذمرون ويشكون دائما وفيما هم يندفعون وراء شهواتهم، يطلقون ألسنتهم متحدثين بأمور طنانة، ويمدحون من يعجبهم طلبا للمنفعة!"], [17, "أما أنتم أيها الأحباء، فاذكروا دائما ما قاله رسل ربنا يسوع المسيح."], [18, "فقد سبق أن نبهوكم إلى أنه، في نهاية الزمان، سيطلع مستهزئون يعيشون منغمسين في شهواتهم الفاسقة."]]}], "kwAr": "شهوات الجسد", "noteAr": ""}, {"kw": "and the lust", "raw": "Gen_3:6, Gen_6:2; Jos_7:21; Job_31:1; Psa_119:36, Psa_119:37; Ecc_5:10,Ecc_5:11; Mat_4:8; Luk_4:5", "note": "", "refs": [{"l": "Gen 3:6", "n": "", "vs": [[6, "وعندما شاهدت المرأة أن الشجرة لذيذة للمأكل وشهية للعيون، ومثيرة للنظر قطفت من ثمرها وأكلت، ثم أعطت زوجها أيضا فأكل معها،"]]}, {"l": "Gen 6:2", "n": "", "vs": [[2, "انجذبت أنظار أبناء الله إلى بنات الناس فرأوا أنهن جميلات فاتخذوا لأنفسهم منهن زوجات حسب ما طاب لهم."]]}, {"l": "Jos 7:21", "n": "", "vs": [[21, "رأيت بين الغنائم رداء شنعاريا نفيسا، ومئتي شاقل فضة (نحو كيلوجرامين ونصف)، وسبيكة من ذهب وزنها خمسون شاقلا (نحو ست مئة جرام)، فاشتهيتها وأخذتها. وها هي مطمورة في الأرض في وسط خيمتي، والفضة تحتها»."]]}, {"l": "Job 31:1", "n": "", "vs": [[1, "أبرمت عهدا مع عيني، فكيف أرنو إلى عذراء؟"]]}, {"l": "Psa 119:36", "n": "", "vs": [[36, "اجتذب قلبي نحو شهاداتك بعيدا عن مطامع المال."]]}, {"l": "Psa 119:37", "n": "", "vs": [[37, "حول عيني عن رؤية الباطل، وفي طريقك أحيني."]]}, {"l": "Ecc 5:10", "n": "", "vs": [[10, "من يحب الفضة لا يشبع منها، والمولع بالغنى لا يشبع من ربح. وهذا أيضا باطل."]]}, {"l": "Ecc 5:11", "n": "", "vs": [[11, "إن كثرت الخيرات كثر آكلوها أيضا، وأي جدوى لمالكها إلا أن تكتحل عيناه برؤيتها."]]}, {"l": "Mat 4:8", "n": "", "vs": [[8, "ثم أخذه إبليس أيضا إلى قمة جبل عال جدا، وأراه جميع ممالك العالم وعظمتها،"]]}, {"l": "Luk 4:5", "n": "", "vs": [[5, "ثم أصعده إبليس إلى جبل عال، وأراه ممالك العالم كلها في لحظة من الزمن،"]]}], "kwAr": "وشهوات العين", "noteAr": ""}, {"kw": "and the pride", "raw": "Est_1:3-7; Psa_73:6; Dan_4:30; Rev_18:11-17", "note": "", "refs": [{"l": "Est 1:3-7", "n": "", "vs": [[3, "في السنة الثالثة من عهده، وأقام مأدبة لجميع رؤساء جيش مادي وفارس وقادته، ومثل أمامه نبلاء المملكة وعظماؤها."], [4, "وظلت الولائم قائمة طوال مئة وثمانين يوما، أظهر فيها الملك كل بذخ من غنى ملكه وعزة جلال عظمته."], [5, "وبعد أن انقضت هذه الأيام، صنع الملك وليمة لجميع الشعب المقيم في شوشن العاصمة، كبارهم وصغارهم، استمرت سبعة أيام في دار حديقة القصر."], [6, "التي زينت بأنسجة بيضاء وخضراء وزرقاء، علقت بحبال كتانية ملونة في حلقات فضية وأعمدة رخامية وأرائك ذهبية وفضية، على أرضية مرصوفة بجزع من بهت ومرمر ودر ورخام أسود."], [7, "وكانت الأقداح التي تقدم فيها الخمور من ذهب، وآنية الموائد مختلفة الأشكال، أما الخمور الملكية فكانت وفيرة بفضل كرم الملك."]]}, {"l": "Psa 73:6", "n": "", "vs": [[6, "لذلك لبسوا الكبرياء كقلادة، وارتدوا الظلم كثوب."]]}, {"l": "Dan 4:30", "n": "", "vs": [[30, "قال: «أليست هذه هي بابل العظيمة التي بنيتها بقوة اقتداري لتكون عاصمة للمملكة، ولجلال مجدي؟»"]]}, {"l": "Rev 18:11-17", "n": "", "vs": [[11, "وسيبكي تجار الأرض ويحزنون عليها، لأنه لم يبق أحد ليشتري بضائعهم،"], [12, "فقد كانت هي تشتري منهم الذهب والفضة والحجارة الكريمة واللؤلؤ، والكتان والأرجوان والحرير والقرمز، وجميع الأخشاب العطرة وأدوات العاج والمصنوعات الخشبية الثمينة، والنحاس والحديد والرخام،"], [13, "والقرفة والبهار، والعطور والطيب والبخور، والخمر والزيت والدقيق والحبوب، والبهائم والغنم، والخيل والمركبات، والأجساد والنفوس البشرية"], [14, "وسيقولون: مضى عنك الثمر الذي كانت تشتهيه نفسك؛ وزالت عنك مظاهر الترف والعظمة كلها، ولن تعود!"], [15, "هؤلاء التجار الذين اغتنوا من التجارة معها، يقفون على بعد منها، خوفا من عذابها، يبكون وينتحبون"], [16, "قائلين: الويل، الويل على المدينة العظمى! كانت ترتدي أفضل الكتان والأرجوان والقرمز، وتتحلى بالذهب والأحجار الكريمة واللؤلوء،"], [17, "وقد زال هذا الغنى كله في ساعة واحدة!"]]}], "kwAr": "وترف المعيشة", "noteAr": ""}, {"kw": "is not", "raw": "Jam_3:15", "note": "", "refs": [{"l": "Jam 3:15", "n": "", "vs": [[15, "إن هذه الحكمة التي تدعونها ليست نازلة من عند الله، بل هي «حكمة» أرضية بشرية شيطانية."]]}], "kwAr": "ليس من الآب", "noteAr": ""}], "arS": [["لأن ", []], ["كل", ["G3956"]], [" ما في ", []], ["العالم", ["G2889"]], ["، من ", []], ["شهوات", ["G1939"]], [" ", []], ["الجسد", ["G4561"]], [" ", []], ["وشهوات", ["G1939"]], [" ", []], ["العين", ["G3788"]], [" ", []], ["وترف", ["G212"]], [" ", []], ["المعيشة", ["G979"]], ["، ليس من ", []], ["الآب", ["G3962"]], ["، بل من ", []], ["العالم", ["G2889"]], [".", []]]}, {"c": 2, "v": 17, "text": "وسوف يزول العالم، وما فيه من شهوات أما الذي يعمل بإرادة الله، فيبقى إلى الأبد!", "groups": [{"kw": "the world", "raw": "Psa_39:6, Psa_73:18-20, Psa_90:9, Psa_102:26; Isa_40:6-8; Mat_24:35; 1Co_7:31; Jam_1:10,Jam_1:11, Jam_4:14; 1Pe_1:24", "note": "", "refs": [{"l": "Psa 39:6", "n": "", "vs": [[6, "إنما كخيال يتمشى الإنسان، فعبثا يكافح الناس. يجمع الواحد منهم ثروة ولا يدري من يرثها من بعده."]]}, {"l": "Psa 73:18-20", "n": "", "vs": [[18, "حقا إنك أوقفتهم في أماكن زلقة، وأوقعتهم في التهلكات."], [19, "كيف صاروا للخر اب فجأة؟ انقرضوا وأفنتهم الدواهي."], [20, "كحلم يتلاشى عند اليقظة هكذا تختفي صورتهم عندما تنهض يارب لمعاقبتهم."]]}, {"l": "Psa 90:9", "n": "", "vs": [[9, "لأن أيامنا كلها تنقضي في غضبك الشديد، وأعوامنا تتلاشى كزفرة."]]}, {"l": "Psa 102:26", "n": "", "vs": [[26, "هي زائلة أما أنت فباق. تبلى كلها كالثوب. وتستبدلها كما يستبدل الرداء القديم بالجديد."]]}, {"l": "Isa 40:6-8", "n": "", "vs": [[6, "وعندئذ قال صوت: «ناد برسالة». فأجبت: «أية رسالة؟» فقال: «كل ذي جسد عشب، وكل بهائه كزهر الصحراء."], [7, "يذبل العشب ويذوي الزهر لأن نفخة الرب تهب عليه. حقا إن الشعب عشب."], [8, "يذبل العشب ويذوي الزهر، أما كلمة إلهنا فتثبت إلى الأبد»."]]}, {"l": "Mat 24:35", "n": "", "vs": [[35, "إن السماء والأرض تزولان؛ ولكن كلامي لا يزول أبدا."]]}, {"l": "1Co 7:31", "n": "", "vs": [[31, "والذين يستغلون هذا العالم كأنهم لا يستغلونه. ذلك لأن طراز هذا العالم زائل."]]}, {"l": "Jam 1:10", "n": "", "vs": [[10, "وأما الغني، فعليه أن يسر بأن ما له لا يغنيه عن الله: لأن نهايته ستكون كنهاية الأعشاب المزهرة."]]}, {"l": "Jam 1:11", "n": "", "vs": [[11, "فعندما تشرق الشمس بحرها المحرق، تيبس تلك الأعشاب، فيسقط زهرها، ويتلاشى جمال منظرها. هكذا يذبل الغني في طرقه!"]]}, {"l": "Jam 4:14", "n": "", "vs": [[14, "مهلا! فأنتم لا تعرفون ماذا يحدث غدا! وما هي حياتكم؟ إنها بخار، يظهر فترة قصيرة ثم يتلاشى!"]]}, {"l": "1Pe 1:24", "n": "", "vs": [[24, "فإن الحياة البشرية كالعشب، ومجدها كله كزهر العشب. ولابد أن تفنى كما ييبس العشب ويسقط زهره!"]]}], "kwAr": "سوف يزول العالم", "noteAr": ""}, {"kw": "but", "raw": "Psa_143:10; Mat_7:21, Mat_21:31; Mar_3:35; Joh_7:17; Rom_12:2; Col_1:9, Col_4:12; 1Th_4:3, 1Th_5:18; Heb_10:36; 1Pe_4:2", "note": "", "refs": [{"l": "Psa 143:10", "n": "", "vs": [[10, "علمني أن أعمل ما يرضيك لأنك أنت إلهي، وليهدني روحك الصالح إلى أرض مستوية."]]}, {"l": "Mat 7:21", "n": "", "vs": [[21, "ليس كل من يقول لي: يارب، يارب! يدخل ملكوت السماوات، بل من يعمل بإرادة أبي الذي في السماوات."]]}, {"l": "Mat 21:31", "n": "", "vs": [[31, "فأي الاثنين عمل بإرادة الأب؟» فقالوا: «الأول!» فقال لهم يسوع: «الحق أقول لكم: إن جباة الضرائب والزانيات سيسبقونكم في الدخول إلى ملكوت الله."]]}, {"l": "Mar 3:35", "n": "", "vs": [[35, "لأن من يعمل بإرادة الله هو أخي وأختي وأمي! »"]]}, {"l": "Joh 7:17", "n": "", "vs": [[17, "ومن أراد أن يعمل مشيئة الله يعرف ما إذا كان تعليمي من عند الله، أو أنني أتكلم من عندي."]]}, {"l": "Rom 12:2", "n": "", "vs": [[2, "ولا تتكيفوا مع هذا العالم، بل تغيروا بتجديد الذهن، لتميزوا ما هي إرادة الله الصالحة المقبولة الكاملة."]]}, {"l": "Col 1:9", "n": "", "vs": [[9, "لذلك نحن أيضا، من اليوم الذي فيه سمعنا بأخباركم، مازلنا نصلي ونتضرع لأجلكم، لأن تمتلئوا من تمام المعرفة لمشيئة الله في كل حكمة وإدراك روحي،"]]}, {"l": "Col 4:12", "n": "", "vs": [[12, "يسلم عليكم أبفراس الذي هو منكم، وهو عبد للمسيح يسوع، يجاهد كل حين لأجلكم في الصلوات لتثبتوا كاملين ولكم تمام اليقين من جهة مشيئة الله كلها."]]}, {"l": "1Th 4:3", "n": "", "vs": [[3, "فإن مشيئة الله هي هذه: قداستكم. وذلك بأن تمتنعوا عن الزنى،"]]}, {"l": "1Th 5:18", "n": "", "vs": [[18, "ارفعوا الشكر في كل حال: فهذه هي مشيئة الله لكم في المسيح يسوع."]]}, {"l": "Heb 10:36", "n": "", "vs": [[36, "إنكم تحتاجون إلى الصبر لتعملوا إرادة الله، فتنالوا البركة التي وعدتم بها."]]}, {"l": "1Pe 4:2", "n": "", "vs": [[2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."]]}], "kwAr": "أما الذي يعمل بإرادة الله", "noteAr": ""}, {"kw": "abideth", "raw": "Psa_125:1, Psa_125:2; Pro_10:25; Joh_4:14, Joh_6:58, Joh_10:28-30; 1Pe_1:5, 1Pe_1:25", "note": "", "refs": [{"l": "Psa 125:1", "n": "", "vs": [[1, "الواثقون بالرب هم مثل جبل صهيون الراسخ الذي لا يتزعزع إلى الأبد."]]}, {"l": "Psa 125:2", "n": "", "vs": [[2, "كما تحيط الجبال بأورشليم، كذلك يحيط الرب بشعبه من الآن وإلى الأبد،"]]}, {"l": "Pro 10:25", "n": "", "vs": [[25, "يتلاشى الشرير كما تتلاشى الزوبعة، أما الصديق فيخلد إلى الأبد."]]}, {"l": "Joh 4:14", "n": "", "vs": [[14, "ولكن الذي يشرب من الماء الذي أعطيه أنا، لن يعطش بعد ذلك أبدا، بل إن ما أعطيه من ماء يصبح في داخله نبعا يفيض فيعطي حياة أبدية»."]]}, {"l": "Joh 6:58", "n": "", "vs": [[58, "هذا هو الخبز الذي نزل من السماء، وهو ليس كالمن الذي أكله أباؤكم ثم ماتوا. فالذي يأكل هذا الخبز يحيا إلى الأبد»."]]}, {"l": "Joh 10:28-30", "n": "", "vs": [[28, "وأعطيها حياة أبدية، فلا تهلك إلى الأبد، ولا ينتزعها أحد من يدي."], [29, "إن الآب الذي أعطاني إياها هو أعظم من الجميع، ولا يقدر أحد أن ينتزع من يد الآب شيئا."], [30, "أنا والآب واحد!»"]]}, {"l": "1Pe 1:5", "n": "", "vs": [[5, "محفوظا لكم في السماوات. فإنكم محفوظون بقدرة الله العاملة من خلال إيمانكم، إلى أن تفوزوا بالخلاص النهائي المعد لكم والذي سوف يتجلى في الزمان الأخير."]]}, {"l": "1Pe 1:25", "n": "", "vs": [[25, "أما كلمة الرب فتبقى ثابتة إلى الأبد، وهي الكلمة التي وصلت بشارتها إليكم!"]]}], "kwAr": "فيبقى إلى الأبد", "noteAr": ""}], "arS": [["وسوف ", []], ["يزول", ["G3855"]], [" ", []], ["العالم", ["G2889"]], ["، وما فيه من ", []], ["شهوات", ["G1939"]], [" أما الذي ", []], ["يعمل", ["G4160"]], [" ", []], ["بإرادة", ["G2307"]], [" ", []], ["الله", ["G2316"]], ["، ", []], ["فيبقى", ["G3306"]], [" إلى ", []], ["الأبد", ["G165"]], ["!", []]]}, {"c": 2, "v": 18, "text": "أيها الأولاد، اعلموا أننا نعيش الآن في الزمن الأخير. وكما سمعتم أنه سوف يأتي أخيرا «مسيح دجال»، فقد ظهر حتى الآن كثيرون من الدجالين المقاومين للمسيح. من هنا نتأكد أننا نعيش في الزمن الأخير.", "groups": [{"kw": "Little", "raw": "1Jo_2:1; Joh_21:5", "note": "", "refs": [{"l": "1Jo 2:1", "n": "", "vs": [[1, "ياأولادي الصغار، أكتب إليكم هذه الأمور لكي لا تخطئوا. ولكن، إن أخطأ أحدكم، فلنا عند الآب شفيع هو يسوع المسيح البار."]]}, {"l": "Joh 21:5", "n": "", "vs": [[5, "فسألهم يسوع: «يافتيان، أما عندكم سمك؟» أجابوه: «لا!»"]]}], "kwAr": "أيها الأولاد", "noteAr": ""}, {"kw": "it is", "raw": "2Ti_3:1; Heb_1:2; 1Pe_1:5, 1Pe_1:20; 2Pe_3:3; Jud_1:18", "note": "", "refs": [{"l": "2Ti 3:1", "n": "", "vs": [[1, "واعلم هذا الأمر: أن أزمنة صعبة ستعم في الأيام الأخيرة؛"]]}, {"l": "Heb 1:2", "n": "", "vs": [[2, "أما الآن، في هذا الزمن الأخير، فقد كلمنا بالابن، الذي جعله وارثا لكل شيء، وبه قد خلق الكون كله!"]]}, {"l": "1Pe 1:5", "n": "", "vs": [[5, "محفوظا لكم في السماوات. فإنكم محفوظون بقدرة الله العاملة من خلال إيمانكم، إلى أن تفوزوا بالخلاص النهائي المعد لكم والذي سوف يتجلى في الزمان الأخير."]]}, {"l": "1Pe 1:20", "n": "", "vs": [[20, "ومع أن الله كان قد عين المسيح لهذا الغرض قبل تأسيس العالم، فهو لم يعلنه إلا في هذا الزمن الأخير لفائدتكم"]]}, {"l": "2Pe 3:3", "n": "", "vs": [[3, "فاعلموا، قبل كل شيء أنه سيأتي في آخر الأيام أناس مستهزئون يسخرون بالحق، ويسلكون منجرفين وراء شهواتهم الخاصة."]]}, {"l": "Jud 1:18", "n": "", "vs": [[18, "فقد سبق أن نبهوكم إلى أنه، في نهاية الزمان، سيطلع مستهزئون يعيشون منغمسين في شهواتهم الفاسقة."]]}], "kwAr": "الزمن الأخير", "noteAr": ""}, {"kw": "ye have", "raw": "1Jo_4:3; Mat_24:5, Mat_24:11, Mat_24:24; Mar_13:6, Mar_13:21, Mar_13:22; Act_20:29, Act_20:30; 2Th_2:3-12; 1Ti_4:1-3; 2Ti_3:1-6, 2Ti_4:3, 2Ti_4:4; 2Pe_2:1", "note": "", "refs": [{"l": "1Jo 4:3", "n": "", "vs": [[3, "وإن كان ينكر ذلك لا يكون من عند الله، بل من عند ضد المسيح الذي سمعتم أنه سوف يأتي، وهو الآن موجود في العالم."]]}, {"l": "Mat 24:5", "n": "", "vs": [[5, "فإن كثيرين سيأتون باسمي قائلين إني أنا هو المسيح، فيضللون كثيرين."]]}, {"l": "Mat 24:11", "n": "", "vs": [[11, "ويظهر كثيرون من الأنبياء الدجالين ويضللون كثيرين."]]}, {"l": "Mat 24:24", "n": "", "vs": [[24, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات عظيمة وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Mar 13:6", "n": "", "vs": [[6, "فإن كثيرين سيأتون باسمي قائلين، إني أنا هو ويضللون كثيرين."]]}, {"l": "Mar 13:21", "n": "", "vs": [[21, "فإن قال لكم أحد عندئذ: ها إن المسيح هنا! أو: ها هو هناك! فلا تصدقوا."]]}, {"l": "Mar 13:22", "n": "", "vs": [[22, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Act 20:29", "n": "", "vs": [[29, "فإني أعلم أنه بعد رحيلي سيندس بينكم ذئاب خاطفة، لا تشفق على القطيع."]]}, {"l": "Act 20:30", "n": "", "vs": [[30, "بل إن قوما منكم أنتم سيقومون ويعلمون تعاليم منحرفة، ليجروا التلاميذ وراءهم."]]}, {"l": "2Th 2:3-12", "n": "", "vs": [[3, "لا تدعوا أحدا يخدعكم بأية وسيلة! فإن ذلك اليوم لا يأتي دون أن يسبقه انتشار العصيان وظهور الإنسان المتمرد، ابن الهلاك،"], [4, "الذي يتحدى كل ما يدعى إلها أو معبودا، ويعاديه مترفعا عليه. بل إنه أيضا يتخذ من هيكل الله مقرا له، محاولا أن يبرهن أنه إله."], [5, "ألا تذكرون أني كثيرا ما قلت لكم هذا عندما كنت عندكم؟"], [6, "وأنتم الآن تعرفون ما الذي يحتجزه حتى لا يظهر إلا في الوقت المعين له."], [7, "فإن التمرد الآن يعمل خفية كأنه سر. ولكن فقط إلى أن يرفع من الوسط ذاك الذي يحتجز المتمرد."], [8, "عندئذ سيظهر الإنسان المتمرد ظهورا جليا فيبيده الرب يسوع بنفخة فمه ويلاشيه ببهاء ظهوره عند عودته."], [9, "أما بروز المتمرد، فسوف يكون بقدر طاقة الشيطان على المعجزات والعلامات والعجائب المزيفة كلها،"], [10, "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا."], [11, "ولهذا السبب، سيرسل الله إليهم طاقة الضلال حتى يصدقوا ما هو دجل،"], [12, "فتقع الدينونة على جميع الذين لم يؤمنوا بالحق بل سرهم الإثم."]]}, {"l": "1Ti 4:1-3", "n": "", "vs": [[1, "إلا أن الروح يعلن صراحة أن قوما في الأزمنة الأخيرة سوف يرتدون عن الإيمان، منساقين وراء أرواح مضللة وتعاليم شيطانية،"], [2, "في موجة رياء ينشرها معلمون دجالون لهم ضمائر كويت بالنار."], [3, "يحرمون الزواج، ويأمرون بالامتناع عن أطعمة خلقها الله ليتناولها المؤمنون وعارفو الحق شاكرين."]]}, {"l": "2Ti 3:1-6", "n": "", "vs": [[1, "واعلم هذا الأمر: أن أزمنة صعبة ستعم في الأيام الأخيرة؛"], [2, "إذ يكون الناس محبين لأنفسهم، محبين للمال، متكبرين، مباهين بأنفسهم، شتامين، غير مطيعين لوالديهم، ناكرين للجميل، دنسين،"], [3, "متحجري العواطف، غير صفوحين، نمامين، جامحي الأهواء، شرسين غير محبين للصلاح،"], [4, "خائنين، وقحين، مدعين، محبين للذات أكثر من محبتهم لله،"], [5, "لهم من التقوى مظهرها ولكنهم لقوتها منكرون، فعن هؤلاء الناس ابتعد!"], [6, "فمن هؤلاء من يدخلون البيوت خلسة، ويوقعون في حبائلهم بعض النساء السخيفات المثقلات بالخطايا، اللواتي تجرفهن شهوات مختلفة،"]]}, {"l": "2Ti 4:3", "n": "", "vs": [[3, "فإنه سيأتي زمان لا يطيق الناس فيه التعليم الصحيح، بل تبعا لشهواتهم الخاصة يكدسون لأنفسهم معلمين (يقولون لهم كلاما) يداعب الآذان."]]}, {"l": "2Ti 4:4", "n": "", "vs": [[4, "فيحولون آذانهم بعيدا عن الحق، منحرفين إلى الخرافات."]]}, {"l": "2Pe 2:1", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما ": "Deu 13:13", "n": "", "vs": [[13, "أن بعض الفاسقين قد خرجوا من بينكم وضللوا سكان مدينتهم قائلين: لنذهب ونعبد آلهة أخرى غريبة عنكم"]]}, {"l": "Psa 41:9", "n": "", "vs": [[9, "حتى صديقي الملازم لي الذي وثقت به، الآكل من طعامي قد انقلب علي، ورفع علي عقبه."]]}, {"l": "Mat 13:20", "n": "", "vs": [[20, "أما المزروع على أرض صخرية، فهو الذي يسمع الكلمة ويقبلها بفرح في الحال،"]]}, {"l": "Mat 13:21", "n": "", "vs": [[21, "ولكنه لا أصل له في ذاته، وإنما يبقى إلى حين: فحالما يحدث ضيق أو اضطهاد من أجل الكلمة، يتعثر."]]}, {"l": "Mar 4:5", "n": "", "vs": [[5, "ووقع بعضه على أرض صخرية رقيقة التربة، فنما سريعا لأن تربته لم تكن عميقة."]]}, {"l": "Mar 4:6", "n": "", "vs": [[6, "ولكن لما أشرقت الشمس، احتر ق ويبس لأنه كان بلا أصل."]]}, {"l": "Mar 4:16", "n": "", "vs": [[16, "وكذلك هؤلاء الذين تزرع فيهم الكلمة على أرض صخرية، وهم الذين حالما يسمعون الكلمة يقبلونها بفرح،"]]}, {"l": "Mar 4:17", "n": "", "vs": [[17, "ولا أصل لهم في ذواتهم، وإنما هم إلى حين. فحالما يحدث ضيق أو اضطهاد من أجل الكلمة، يتعثرون."]]}, {"l": "Luk 8:13", "n": "", "vs": [[13, "وما وقع على الصخر هم الذين يقبلون الكلمة بفر ح لدى سماعها، وهؤلاء لا أصل لهم، فيؤمنون إلى حين، وفي وقت التجربة يتراجعون."]]}, {"l": "Joh 15:2", "n": "", "vs": [[2, "كل غصن في لا ينتج ثمرا يقطعه؛ وكل غصن ينتج ثمرا ينقيه لينتج مزيدا من الثمر."]]}, {"l": "Act 15:24", "n": "", "vs": [[24, "علمنا أن بعض الأشخاص ذهبوا من عندنا إليكم، دون تفويض منا فأثاروا بكلامهم الاضطراب بينكم وأقلقوا أفكاركم."]]}, {"l": "Act 20:30", "n": "", "vs": [[30, "بل إن قوما منكم أنتم سيقومون ويعلمون تعاليم منحرفة، ليجروا التلاميذ وراءهم."]]}, {"l": "2Pe 2:20", "n": "", "vs": [[20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."]]}, {"l": "2Pe 2:21", "n": "", "vs": [[21, "وبالحقيقة، كان أفضل لهم لو أنهم لم يتعرفوا بطريق البر، من أن يتعرفوا به ثم يرتدوا عن الوصية المقدسة التي تسلموها."]]}, {"l": "Jud 1:19", "n": "", "vs": [[19, "هؤلاء هم الذين يسببون الانشقاق، وينساقون وراء غرائزهم الحيوانية، وليس الروح القدس فيهم!"]]}], "kwAr": "انفصلوا عنا", "noteAr": ""}, {"kw": "for", "raw": "Job_17:9; Psa_37:28, Psa_125:1, Psa_125:2; Jer_32:38-40; Mat_24:24; Mar_13:22; Joh_4:14, Joh_6:37-39, Joh_10:28-30; 2Ti_2:10,2Ti_2:19; 1Pe_1:2-5; Jud_1:1", "note": "", "refs": [{"l": "Job 17:9", "n": "", "vs": [[9, "أما الصديق فيتمسك بطريقه، ويزداد الطاهر اليدين قوة."]]}, {"l": "Psa 37:28", "n": "", "vs": [[28, "لأن الرب يحب العدل، ولا يتخلى عن أتقيائه، بل يحفظهم إلى الأبد. أما ذرية الأشرار فتفنى."]]}, {"l": "Psa 125:1", "n": "", "vs": [[1, "الواثقون بالرب هم مثل جبل صهيون الراسخ الذي لا يتزعزع إلى الأبد."]]}, {"l": "Psa 125:2", "n": "", "vs": [[2, "كما تحيط الجبال بأورشليم، كذلك يحيط الرب بشعبه من الآن وإلى الأبد،"]]}, {"l": "Jer 32:38-40", "n": "", "vs": [[38, "فيكونون لي شعبا وأكون لهم إلها."], [39, "وأعطيهم قلبا واحدا وطريقا واحدا ليتقوني كل الأيام، وذلك لخيرهم وخير أولادهم من بعدهم."], [40, "وأبرم معهم عهدا أبديا أن لا أكف عن الإحسان إليهم، وأضع تقواي في قلوبهم لئلا يرتدوا عني،"]]}, {"l": "Mat 24:24", "n": "", "vs": [[24, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات عظيمة وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Mar 13:22", "n": "", "vs": [[22, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Joh 4:14", "n": "", "vs": [[14, "ولكن الذي يشرب من الماء الذي أعطيه أنا، لن يعطش بعد ذلك أبدا، بل إن ما أعطيه من ماء يصبح في داخله نبعا يفيض فيعطي حياة أبدية»."]]}, {"l": "Joh 6:37-39", "n": "", "vs": [[37, "ولكن كل ما يهبه الآب لي سيأتي إلي، ومن يأت إلي لا أطرحه إلى الخارج أبدا،"], [38, "فقد نزلت من السماء، لا لأتم مشيئتي، بل مشيئة الذي أرسلني."], [39, "ومشيئته هي أن لا أدع أحدا ممن وهبهم لي يهلك، بل أقيمه في اليوم الأخير."]]}, {"l": "Joh 10:28-30", "n": "", "vs": [[28, "وأعطيها حياة أبدية، فلا تهلك إلى الأبد، ولا ينتزعها أحد من يدي."], [29, "إن الآب الذي أعطاني إياها هو أعظم من الجميع، ولا يقدر أحد أن ينتزع من يد الآب شيئا."], [30, "أنا والآب واحد!»"]]}, {"l": "2Ti 2:10", "n": "", "vs": [[10, "لهذا السبب أحتمل كل شيء بصبر لأجل الذين اختارهم الله ، لكي يحصلوا، هم أيضا، على الخلاص الذي في المسيح يسوع مع المجد الأبدي."]]}, {"l": "2Ti 2:19", "n": "", "vs": [[19, "إلا أن الأساس الراسخ الذي وضعه الله يظل ثابتا، وعليه هذا الختم: «الرب يعرف خاصته»، وأيضا: «لينفصل عن الإثم كل من يسمي اسم الرب!»"]]}, {"l": "1Pe 1:2-5", "n": "", "vs": [[2, "بحسب علمه السابق ثم قدسهم بالروح ليطيعوا يسوع المسيح ويطهروا برش دمه عليهم."], [3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"], [4, "وإرثا لا يفنى ولا يفسد ولا يزول،"], [5, "محفوظا لكم في السماوات. فإنكم محفوظون بقدرة الله العاملة من خلال إيمانكم، إلى أن تفوزوا بالخلاص النهائي المعد لكم والذي سوف يتجلى في الزمان الأخير."]]}, {"l": "Jud 1:1", "n": "", "vs": [[1, "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."]]}], "kwAr": "لو كانوا منا لظلوا معنا", "noteAr": ""}, {"kw": "they might", "raw": "Rom_9:6, Rom_11:5, Rom_11:6; 1Co_11:19; 2Ti_3:9; Heb_10:39", "note": "", "refs": [{"l": "Rom 9:6", "n": "", "vs": [[6, "لست أعني أن كلمة الله قد خابت. إذ ليس جميع بني إسرائيل هم إسرائيل؛"]]}, {"l": "Rom 11:5", "n": "", "vs": [[5, "فكذلك، في الزمان الحاضر، ماتزال بقية اختارها الله بالنعمة."]]}, {"l": "Rom 11:6", "n": "", "vs": [[6, "ولكن، بما أن ذلك قد تم بالنعمة، فليس بعد على أساس الأعمال، وإلا فليست النعمة نعمة بعد."]]}, {"l": "1Co 11:19", "n": "", "vs": [[19, "لأنه لابد من وجود المذاهب بينكم، حتى يبرز الفاضلون فيكم."]]}, {"l": "2Ti 3:9", "n": "", "vs": [[9, "ولكنهم لن يزدادوا تقدما، لأن حماقتهم ستنكشف للجميع، مثلما انكشفت حماقة الرجلين المذكورين."]]}, {"l": "Heb 10:39", "n": "", "vs": [[39, "ولكننا نحن لسنا من أهل الارتداد المؤدي إلى الهلاك، بل من أهل الإيمان المؤدي إلى خلاص نفوسنا!"]]}], "kwAr": "برهان على أنهم ليسوا منا", "noteAr": ""}], "arS": [["هؤلاء الدجالون ", []], ["انفصلوا", ["G1831"]], [" عنا، لكنهم في الواقع لم يكونوا منا. ولو كانوا منا ", []], ["لظلوا", ["G3306", "G302"]], [" معنا. فانفصالهم عنا إذن ", []], ["برهان", ["G5319"]], [" على أنهم ", []], ["جميعا", ["G3956"]], [" ليسوا منا.", []]]}, {"c": 2, "v": 20, "text": "أما أنتم فلكم مسحة من القدوس، وجميعكم تعرفون الحق.", "groups": [{"kw": "ye have", "raw": "1Jo_2:27, 1Jo_4:13; Psa_23:5, Psa_45:7, Psa_92:10; Isa_61:1; Luk_4:18; Act_10:38; 2Co_1:21, 2Co_1:22; Heb_1:9", "note": "", "refs": [{"l": "1Jo 2:27", "n": "", "vs": [[27, "أما أنتم فقد نلتم من الله مسحة تبقى فيكم دائما. ولذلك، لستم بحاجة إلى من يعلمكم الحق. فتلك المسحة عينها هي التي تعلمكم كل شيء. وهي حق وليست كذبا. فكما علمتكم اثبتوا في المسيح."]]}, {"l": "1Jo 4:13", "n": "", "vs": [[13, "وما يؤكد لنا أننا نثبت في الله، وأنه يثبت فينا هو أنه وهب لنا من روحه."]]}, {"l": "Psa 23:5", "n": "", "vs": [[5, "تبسط أمامي مأدبة على مرأى من أعدائي. مسحت بالزيت رأسي، وأفضت كأسي."]]}, {"l": "Psa 45:7", "n": "", "vs": [[7, "أحببت البر وأبغضت الإثم. من أجل ذلك مسحك الله (ملكا) بدهن الابتهاج أكثر من رفقائك (الملوك)."]]}, {"l": "Psa 92:10", "n": "", "vs": [[10, "أما أنا فترفع شأني كما يرتفع قرن الثور الوحشي، وأنتعش كمن تدهن بزيت جديد"]]}, {"l": "Isa 61:1", "n": "", "vs": [[1, "روح السيد الرب علي، لأن الرب مسحني لأبشر المساكين، أرسلني لأضمد جراح المنكسري القلوب، لأنادي للمسبيين بالعتق وللمأسورين بالحرية،"]]}, {"l": "Luk 4:18", "n": "", "vs": [[18, "«روح الرب علي، لأنه مسحني لأبشر الفقراء؛ أرسلني لأنادي للمأسورين بالإطلاق وللعميان بالبصر، لأطلق المسحوقين أحرارا،"]]}, {"l": "Act 10:38", "n": "", "vs": [[38, "فقد مسح الله يسوع الناصري بالروح القدس وبالقدرة، فكان ينتقل من مكان إلى مكان يعمل الخير، ويشفي جميع الذين تسلط عليهم إبليس، لأن الله كان معه."]]}, {"l": "2Co 1:21", "n": "", "vs": [[21, "ولكن الذي يرسخنا وإياكم في المسيح، والذي قد مسحنا، إنما هو الله ،"]]}, {"l": "2Co 1:22", "n": "", "vs": [[22, "وهو أيضا قد وضع ختمه علينا، ووهبنا الروح القدس عربونا في قلوبنا."]]}, {"l": "Heb 1:9", "n": "", "vs": [[9, "إنك أحببت البر وأبغضت الإثم. لذلك مسحك الله إلهك ملكا، إذ صب عليك زيت البهجة أكثر من رفقائك!»"]]}], "kwAr": "لكم مسحة", "noteAr": ""}, {"kw": "the Holy", "raw": "Psa_16:10, Psa_71:22; Isa_43:3; Mar_1:24; Luk_4:34; Act_3:14; Rev_3:7, Rev_4:8", "note": "", "refs": [{"l": "Psa 16:10", "n": "", "vs": [[10, "لأنك لن تترك نفسي في هوة الأموات ولن تدع وحيدك القدوس ينال منه الفساد."]]}, {"l": "Psa 71:22", "n": "", "vs": [[22, "سأحمدك وأشيد بحقك على الرباب ياإلهي. أشدو لك على العود ياقدوس إسرائيل."]]}, {"l": "Isa 43:3", "n": "", "vs": [[3, "لأني أنا هو الرب إلهك، قدوس إسرائيل مخلصك، قد جعلت مصر فدية عنك وكوش وسبا عوضا عنك."]]}, {"l": "Mar 1:24", "n": "", "vs": [[24, "وقال: «ما شأنك بنا يايسوع الناصري؟ أجئت لتهلكنا؟ أنا أعرف من أنت. أنت قدوس الله!»"]]}, {"l": "Luk 4:34", "n": "", "vs": [[34, "«آه! ما شأنك بنا يايسوع الناصري؟ أجئت لتهلكنا؟ أنا أعرف من أنت: أنت قدوس الله»."]]}, {"l": "Act 3:14", "n": "", "vs": [[14, "أنتم أنكرتم القدوس البار وطلبتم العفو عن رجل قاتل،"]]}, {"l": "Rev 3:7", "n": "", "vs": [[7, "واكتب إلى ملاك الكنيسة في فيلادلفيا: إليك ما يقوله القدوس الحق، الذي بيده مفتاح داود، يفتح ولا أحد يغلق، ويغلق ولا أحد يفتح."]]}, {"l": "Rev 4:8", "n": "", "vs": [[8, "وكان لكل كائن منها ستة أجنحة، تكسوها عيون من الداخل ومن الخارج. وهذه الكائنات الحية الأربعة تهتف ليلا ونهارا دون انقطاع قائلة: «قدوس قدوس قدوس، الرب الإله القادر على كل شيء، الذي كان والكائن والذي سيأتي»."]]}], "kwAr": "القدوس", "noteAr": ""}, {"kw": "and ye", "raw": "Pro_28:5; Joh_10:4, Joh_10:5, Joh_14:26, Joh_16:13; 1Co_2:15; Heb_8:11", "note": "", "refs": [{"l": "Pro 28:5", "n": "", "vs": [[5, "لا يفهم الأشرار العدل، أما ملتمسو الرب فيدركونه تماما."]]}, {"l": "Joh 10:4", "n": "", "vs": [[4, "ومتى أخرجها كلها، يسير أمامها وهي تتبعه، لأنها تعرف صوته."]]}, {"l": "Joh 10:5", "n": "", "vs": [[5, "وهي لا تتبع من كان غريبا، بل تهرب منه، لأنها لا تعرف صوت الغرباء»."]]}, {"l": "Joh 14:26", "n": "", "vs": [[26, "وأما الروح القدس، المعين الذي سيرسله الآب باسمي، فإنه يعلمكم كل شيء، ويذكركم بكل ما قلته لكم."]]}, {"l": "Joh 16:13", "n": "", "vs": [[13, "ولكن، عندما يأتيكم روح الحق يرشدكم إلى الحق كله، لأنه لا يقول شيئا من عنده، بل يخبركم بما يسمعه، ويطلعكم على ما سوف يحدث."]]}, {"l": "1Co 2:15", "n": "", "vs": [[15, "أما الإنسان الروحي، فهو يميز كل شيء، ولا يحكم فيه من أحد."]]}, {"l": "Heb 8:11", "n": "", "vs": [[11, "بعد ذلك، لا يعلم أحد منهم ابن وطنه ولا أخاه قائلا: تعرف بالرب! ذلك لأن الجميع سوف يعرفونني حق المعرفة، من الصغير فيهم إلى العظيم."]]}], "kwAr": "تعرفون الحق", "noteAr": ""}], "arS": [["أما أنتم فلكم ", []], ["مسحة", ["G5545"]], [" من ", []], ["القدوس", ["G40"]], ["، وجميعكم ", []], ["تعرفون", ["G1492"]], [" الحق.", []]]}, {"c": 2, "v": 21, "text": "فأنا أكتب إليكم ليس لأنكم لا تعرفون الحق، بل لأنكم تعرفونه وتدركون أن كل ما هو كذب لا يأتي من الحق.", "groups": [{"kw": "because ye know not", "raw": "Pro_1:5, Pro_9:8, Pro_9:9; Rom_15:14, Rom_15:15; 2Pe_1:12", "note": "", "refs": [{"l": "Pro 1:5", "n": "", "vs": [[5, "يستمع إليها الحكيم فيزداد حكمة، ويكتسب الفهيم مهارة،"]]}, {"l": "Pro 9:8", "n": "", "vs": [[8, "لا تقرع الساخر لئلا يبغضك، ووبخ الحكيم فيحبك."]]}, {"l": "Pro 9:9", "n": "", "vs": [[9, "اسد الإرشاد إلى الحكيم فيضحى أوفر حكمة، علم الصديق فيزداد معرفة."]]}, {"l": "Rom 15:14", "n": "", "vs": [[14, "وأنا نفسي أيضا على يقين من جهتكم أيها الإخوة بأنكم مشحونون صلاحا، وممتلئون بكل معرفة، وقادرون أيضا على نصح بعضكم بعضا."]]}, {"l": "Rom 15:15", "n": "", "vs": [[15, "على أني كتبت إليكم بأوفر جرأة في بعض الأمور، مذكرا لكم، وذلك بالنعمة التي وهبها الله لي."]]}, {"l": "2Pe 1:12", "n": "", "vs": [[12, "لذلك أنوي أن أذكركم دائما بهذه الأمور، وإن كنتم عالمين بها، وراسخين في الحق الذي عندكم."]]}], "kwAr": "ليس لأنكم لا تعرفون الحق", "noteAr": ""}], "arS": [["فأنا ", []], ["أكتب", ["G1125"]], [" إليكم ليس لأنكم لا ", []], ["تعرفون", ["G1492"]], [" ", []], ["الحق", ["G225"]], ["، بل لأنكم ", []], ["تعرفونه", ["G1492"]], [" وتدركون أن كل ما هو ", []], ["كذب", ["G5579"]], [" لا يأتي من ", []], ["الحق", ["G225"]], [".", []]]}, {"c": 2, "v": 22, "text": "ومن هو الكذاب؟ إنه الذي ينكر أن يسوع هو المسيح حقا. إنه ضد للمسيح ينكر الآب والابن معا.", "groups": [{"kw": "Who", "raw": "1Jo_2:4, 1Jo_1:6, 1Jo_4:20; Joh_8:44; Rev_3:9", "note": "", "refs": [{"l": "1Jo 2:4", "n": "", "vs": [[4, "فالذي يدعي أنه قد عرفه، ولكنه لا يعمل بوصاياه، يكون كاذبا ولا يكون الحق في داخله."]]}, {"l": "1Jo 1:6", "n": "", "vs": [[6, "فإن كنا ندعي أن لنا شركة معه، ونحن نعيش في الظلام، نكون كاذبين ولا نمارس الحق."]]}, {"l": "1Jo 4:20", "n": "", "vs": [[20, "فإن قال أحد: «أنا أحب الله !» ولكنه يبغض أخا له، فهو كاذب، لأنه إن كان لا يحب أخاه الذي يراه، فكيف يقدر أن يحب الله الذي لم يره قط؟"]]}, {"l": "Joh 8:44", "n": "", "vs": [[44, "إنكم أولاد أبيكم إبليس، وترغبون أن تعملوا شهوات أبيكم. فهو من البدء كان قاتلا للناس، ولم يثبت في الحق لأنه خال من الحق! وعندما ينطق بالكذب فهو ينضح بما فيه، لأنه كذاب وأبو الكذب!"]]}, {"l": "Rev 3:9", "n": "", "vs": [[9, "أما الذين هم من مجمع الشيطان، ويدعون كذبا أنهم يهود، فسأجبرهم على أن يسجدوا عند قدميك، ويعترفوا بأني أحببتك."]]}], "kwAr": "من هو الكذاب؟", "noteAr": ""}, {"kw": "he that", "raw": "1Jo_2:23, 1Jo_4:3; 1Co_12:2, 1Co_12:3; 2Jo_1:7; Jud_1:4", "note": "", "refs": [{"l": "1Jo 2:23", "n": "", "vs": [[23, "وكل من ينكر الابن، لا يكون الآب أيضا من نصيبه. ومن يعترف بالابن، فله الآب أيضا."]]}, {"l": "1Jo 4:3", "n": "", "vs": [[3, "وإن كان ينكر ذلك لا يكون من عند الله، بل من عند ضد المسيح الذي سمعتم أنه سوف يأتي، وهو الآن موجود في العالم."]]}, {"l": "1Co 12:2", "n": "", "vs": [[2, "تعلمون أنكم، عندما كنتم من الأمم، كنتم تنجرفون إلى الأصنام الخرساء أيما انجراف."]]}, {"l": "1Co 12:3", "n": "", "vs": [[3, "لذلك أقول لكم أن تعرفوا أنه لا أحد وهو يتكلم بروح الله يقول: «اللعنة على يسوع!» وكذلك لا يستطيع أحد أن يقول: «يسوع رب» إلا بالروح القدس."]]}, {"l": "2Jo 1:7", "n": "", "vs": [[7, "إن العالم أصبح يعج بالمضللين الذين لا يعترفون أن يسوع المسيح جاء إلى الأرض بجسم بشري. هذا هو روح المضل وضد المسيح!"]]}, {"l": "Jud 1:4", "n": "", "vs": [[4, "لأنه قد تسلل إلى ما بينكم معلمون لابد أن يلاقوا الحكم بالعقاب الأبدي، كما هو مكتوب لهم منذ القديم. فهم أشرار لا يهابون الله ، يتخذون من نعمة إلهنا فرصة لإباحة الرذائل، وينكرون سيدنا وربنا الوحيد يسوع المسيح."]]}], "kwAr": "الذي ينكر", "noteAr": ""}, {"kw": "He is", "raw": "1Jo_2:18", "note": "", "refs": [{"l": "1Jo 2:18", "n": "", "vs": [[18, "أيها الأولاد، اعلموا أننا نعيش الآن في الزمن الأخير. وكما سمعتم أنه سوف يأتي أخيرا «مسيح دجال»، فقد ظهر حتى الآن كثيرون من الدجالين المقاومين للمسيح. من هنا نتأكد أننا نعيش في الزمن الأخير."]]}], "kwAr": "ضد للمسيح", "noteAr": ""}], "arS": [["ومن هو ", []], ["الكذاب", ["G5583"]], ["؟ إنه الذي ", []], ["ينكر", ["G720"]], [" أن ", []], ["يسوع", ["G2424"]], [" هو ", []], ["المسيح", ["G5547"]], [" حقا. إنه ", []], ["ضد للمسيح", ["G500"]], [" ", []], ["ينكر", ["G720"]], [" ", []], ["الآب", ["G3962"]], [" ", []], ["والابن", ["G5207"]], [" معا.", []]]}, {"c": 2, "v": 23, "text": "وكل من ينكر الابن، لا يكون الآب أيضا من نصيبه. ومن يعترف بالابن، فله الآب أيضا.", "groups": [{"kw": "denieth", "raw": "1Jo_2:22, 1Jo_4:15; Mat_11:27; Luk_10:22; Joh_5:23, Joh_8:19, Joh_10:30, Joh_14:9, Joh_14:10, Joh_15:23, Joh_15:24; 2Jo_1:9-11", "note": "", "refs": [{"l": "1Jo 2:22", "n": "", "vs": [[22, "ومن هو الكذاب؟ إنه الذي ينكر أن يسوع هو المسيح حقا. إنه ضد للمسيح ينكر الآب والابن معا."]]}, {"l": "1Jo 4:15", "n": "", "vs": [[15, "من يعترف بأن يسوع هو ابن الله، فإن الله يثبت فيه، وهو يثبت في الله،"]]}, {"l": "Mat 11:27", "n": "", "vs": [[27, "كل شيء قد سلمه إلي أبي. ولا أحد يعرف الابن إلا الآب، ولا أحد يعرف الآب إلا الابن، ومن أراد الابن أن يعلنه له."]]}, {"l": "Luk 10:22", "n": "", "vs": [[22, "كل شيء قد سلم إلي من قبل أبي، ولا أحد يعرف من هو الابن إلا الآب، ولا من هو الآب إلا الابن ومن أراد الابن أن يعلنه له!»"]]}, {"l": "Joh 5:23", "n": "", "vs": [[23, "ليكرم الجميع الابن كما يكرمون الآب. ومن لا يكرم الابن لا يكرم الآب الذي أرسله."]]}, {"l": "Joh 8:19", "n": "", "vs": [[19, "فسألوه: «أين أبوك؟» فأجاب: «أنتم لا تعرفونني، ولا تعرفون أبي. ولو عرفتموني لعرفتم أبي أيضا»."]]}, {"l": "Joh 10:30", "n": "", "vs": [[30, "أنا والآب واحد!»"]]}, {"l": "Joh 14:9", "n": "", "vs": [[9, "فأجابه يسوع: «مضت هذه المدة الطويلة وأنا معكم ولم تعرفني يافيلبس؟ الذي رآني رأى الآب، فكيف تقول: أرنا الآب؟"]]}, {"l": "Joh 14:10", "n": "", "vs": [[10, "ألا تؤمن أني أنا في الآب، وأن الآب في؟ الكلام الذي أقوله لا أقوله من عندي، وإنما الآب الحال في هو يعمل أعماله هذه."]]}, {"l": "Joh 15:23", "n": "", "vs": [[23, "الذي يبغضني، يبغض أبي أيضا."]]}, {"l": "Joh 15:24", "n": "", "vs": [[24, "ولو لم أعمل بينهم أعمالا لم يعملها أحد غيري، لما كانت لهم خطيئة. ولكنهم أبغضوني وأبغضوا أبي، مع أنهم رأوا تلك الأعمال."]]}, {"l": "2Jo 1:9-11", "n": "", "vs": [[9, "لأن من تعدى تعليم المسيح ولم يثبت فيه، فليس الله من نصيبه. أما من يثبت في هذا التعليم، فله الآب والابن معا."], [10, "إن جاءكم أحد بغير هذا التعليم، فلا تستقبلوه في بيتكم، ولا تبادلوه التحية."], [11, "لأن من يسلم عليه، يشاركه في أعماله الشريرة."]]}], "kwAr": "من ينكر الابن", "noteAr": ""}], "arS": [["وكل", ["G3956"]], [" من ", []], ["ينكر", ["G720"]], [" ", []], ["الابن", ["G5207"]], ["، لا يكون ", []], ["الآب", ["G3962"]], [" أيضا من نصيبه. ومن ", []], ["يعترف", ["G3670"]], [" ", []], ["بالابن", ["G5207"]], ["، فله ", []], ["الآب", ["G3962"]], [" أيضا.", []]]}, {"c": 2, "v": 24, "text": "أما أنتم، فالكلام الذي سمعتموه منذ البداية، فليكن راسخا فيكم. فحين يترسخ ذلك الكلام في داخلكم، تتوطد صلتكم بالابن، وبالآب.", "groups": [{"kw": "abide", "raw": "Psa_119:11; Pro_23:23; Luk_9:44; Joh_15:7; Col_3:16; Heb_2:1, Heb_3:14; 2Jo_1:2; 3Jo_1:3; Rev_3:3, Rev_3:11", "note": "", "refs": [{"l": "Psa 119:11", "n": "", "vs": [[11, "خبأت كلامك في قلبي، لئلا أخطيء إليك."]]}, {"l": "Pro 23:23", "n": "", "vs": [[23, "اقتن الحق ولا تبعه، وكذا الحكمة والتأديب والفطنة."]]}, {"l": "Luk 9:44", "n": "", "vs": [[44, "«لتدخل هذه الكلمات آذانكم: إن ابن الإنسان على وشك أن يسلم إلى أيدي الناس!»"]]}, {"l": "Joh 15:7", "n": "", "vs": [[7, "ولكن، إن ثبتم في، وثبت كلامي فيكم، فاطلبوا ما تريدون يكن لكم."]]}, {"l": "Col 3:16", "n": "", "vs": [[16, "لتسكن كلمة المسيح في داخلكم بغنى، في كل حكمة، معلمين وواعظين بعضكم بعضا، مرنمين بمزامير وتسابيح وأناشيد روحية في قلوبكم لله، رافعين له الحمد."]]}, {"l": "Heb 2:1", "n": "", "vs": [[1, "لذلك، يجب علينا أن نهتم أشد الاهتمام بالكلام الذي سمعناه، متنبهين ألا ننحرف عنه."]]}, {"l": "Heb 3:14", "n": "", "vs": [[14, "فإن تمسكنا دائما بالثقة التي انطلقنا بها في البداية، وأبقيناها ثابتة إلى النهاية، نكون مشاركين للمسيح."]]}, {"l": "2Jo 1:2", "n": "", "vs": [[2, "بما أن الحق ثابت في قلوبنا، ولابد أن يرافقنا إلى الأبد،"]]}, {"l": "3Jo 1:3", "n": "", "vs": [[3, "فكم كان فرحي عظيما عندما مر بي بعض الإخوة المسافرين وأخبروني أنك تسلك بحسب الحق، وشهدوا للحق الثابت فيك!"]]}, {"l": "Rev 3:3", "n": "", "vs": [[3, "تذكر ما سبق أن تقبلته وسمعته، وتمسك بما آمنت به، وتب! فإن كنت لا تتنبه، آتيك كما يأتي اللص، ولا تدري في أية ساعة أفاجئك!"]]}, {"l": "Rev 3:11", "n": "", "vs": [[11, "إني آت سريعا، فتمسك بما عندك، لئلا يسلب أحد إكليلك."]]}], "kwAr": "فليكن راسخا فيكم", "noteAr": ""}, {"kw": "which", "raw": "1Jo_2:7; Luk_1:2; Joh_8:25; Phi_4:15; 2Jo_1:5, 2Jo_1:6", "note": "", "refs": [{"l": "1Jo 2:7", "n": "", "vs": [[7, "أيها الأحباء، أنا لا أكتب إليكم هنا وصية جديدة، بل وصية قديمة كانت عندكم منذ البداية، وهي الكلمة التي سمعتموها قبلا."]]}, {"l": "Luk 1:2", "n": "", "vs": [[2, "كما سلمها إلينا أولئك الذين كانوا من البداية شهود عيان، ثم صاروا خداما للكلمة،"]]}, {"l": "Joh 8:25", "n": "", "vs": [[25, "فسألوه: «من أنت؟» أجاب يسوع: «قلت لكم من البداية!"]]}, {"l": "Phi 4:15", "n": "", "vs": [[15, "وتعرفون أيضا، يامؤمني فيلبي، أنه عند ابتداء خدمتي للإنجيل، إذ انطلقت من مقاطعة مقدونية، ما من كنيسة ساهمت معي في حساب العطاء والأخذ إلا أنتم وحدكم."]]}, {"l": "2Jo 1:5", "n": "", "vs": [[5, "وا لآن، أيتها السيدة، لي رجاء أطلبه منك، ولا تعتبريه وصية جديدة. وإنما هو تلك الوصية الموجودة عندنا منذ البداية،: أن يحب بعضنا بعضا."]]}, {"l": "2Jo 1:6", "n": "", "vs": [[6, "هذه هي المحبة: أن نسلك وفقا لوصاياه. وهذه هي الوصية، كما سمعتم منذ البداية: أن تسلكوا في المحبة!"]]}], "kwAr": "الكلام الذي سمعتموه منذ البداية", "noteAr": ""}, {"kw": "ye also", "raw": "1Jo_1:3, 1Jo_1:7, 1Jo_4:13, 1Jo_4:16; Joh_14:23, Joh_15:9, Joh_15:10, Joh_17:21-24", "note": "", "refs": [{"l": "1Jo 1:3", "n": "", "vs": [[3, "فنحن، إذن، نخبركم بما رأيناه وسمعناه، لكي تكونوا شركاءنا. كما أن شركتنا هي مع الآب ومع ابنه يسوع المسيح."]]}, {"l": "1Jo 1:7", "n": "", "vs": [[7, "ولكن، إن كنا فعلا نعيش في النور، كما هو في النور، تكون لنا حقا شركة بعضنا مع بعض، ودم ابنه يسوع يطهرنا من كل خطيئة."]]}, {"l": "1Jo 4:13", "n": "", "vs": [[13, "وما يؤكد لنا أننا نثبت في الله، وأنه يثبت فينا هو أنه وهب لنا من روحه."]]}, {"l": "1Jo 4:16", "n": "", "vs": [[16, "ونحن أنفسنا اختبرنا المحبة التي خصنا الله بها، ووضعنا ثقتنا فيها. إن الله محبة. ومن يثبت في المحبة، فإنه يثبت في الله، والله يثبت فيه."]]}, {"l": "Joh 14:23", "n": "", "vs": [[23, "أجابه يسوع: «من يحبني يعمل بكلمتي، ويحبه أبي، وإليه نأتي، وعنده نجعل لنا منزلا."]]}, {"l": "Joh 15:9", "n": "", "vs": [[9, "مثلما أحبني الآب، أحببتكم أنا، فاثبتوا في محبتي."]]}, {"l": "Joh 15:10", "n": "", "vs": [[10, "إن عملتم بوصاياي، تثبتون في محبتي، كما عملت أنا بوصايا أبي وأثبت في محبته!"]]}, {"l": "Joh 17:21-24", "n": "", "vs": [[21, "ليكون الجميع واحدا؛ أيها الآب، كما أنك أنت في وأنا فيك، ليكونوا هم أيضا واحدا فينا، لكي يؤمن العالم أنك أنت أرسلتني."], [22, "إني أعطيتهم المجد الذي أعطيتني، ليكونوا واحدا كما نحن واحد."], [23, "أنا فيهم، وأنت في، ليكتملوا فيصيروا واحدا، حتى يعرف العالم أنك أرسلتني وأنك أحببتهم كما أحببتني."], [24, "أيها الآب، أريد لهؤلاء الذين وهبتهم لي أن يكونوا معي حيث أكون أنا، فيشاهدوا مجدي الذي أعطيتني، لأنك أحببتني قبل إنشاء العالم."]]}], "kwAr": "تتوطد صلتكم بالابن وبالآب", "noteAr": ""}], "arS": [["أما أنتم، فالكلام الذي ", []], ["سمعتموه", ["G191"]], [" منذ ", []], ["البداية", ["G746"]], ["، فليكن ", []], ["راسخا", ["G3306"]], [" فيكم. فحين ", []], ["يترسخ", ["G3306"]], [" ذلك الكلام في داخلكم، ", []], ["تتوطد", ["G3306"]], [" صلتكم ", []], ["بالابن", ["G5207"]], ["، ", []], ["وبالآب", ["G3962"]], [".", []]]}, {"c": 2, "v": 25, "text": "فإن الله نفسه قد وعدنا بالحياة الأبدية.", "groups": [{"kw": "", "raw": "1Jo_1:2, 1Jo_5:11-13, 1Jo_5:20; Dan_12:2; Luk_18:30; Joh_5:39, Joh_6:27, Joh_6:47, Joh_6:54, Joh_6:68, Joh_10:28; Joh_12:50, Joh_17:2, Joh_17:3; Rom_2:7, Rom_5:21, Rom_6:23; Gal_6:8; 1Ti_1:16, 1Ti_6:12, 1Ti_6:19; Tit_1:2, Tit_3:7; Jud_1:21", "note": "", "refs": [{"l": "1Jo 1:2", "n": "", "vs": [[2, "فإن «الحياة» تجلت أمامنا. وبعدما رأيناها فعلا، نشهد لها الآن. وها نحن ننقل إليكم خبر هذه الحياة الأبدية التي كانت عند الآب ثم تجلت أمامنا!"]]}, {"l": "1Jo 5:11-13", "n": "", "vs": [[11, "وهذه الشهادة هي أن الله أعطانا حياة أبدية، وأن هذه الحياة هي في ابنه."], [12, "فمن كان له ابن الله كانت له الحياة. ومن لم يكن له ابن الله، لم تكن له الحياة!"], [13, "يامن آمنتم باسم ابن الله، إني كتبت هذا إليكم لكي تعرفوا أن الحياة الأبدية ملك لكم منذ الآن."]]}, {"l": "1Jo 5:20", "n": "", "vs": [[20, "وإننا نعلم أن ابن الله قد جاء إلى الأرض وأنار أذهاننا لنعرف الإله الحق. ونحن الآن نحيا فيه، لأننا في ابنه يسوع المسيح. هذا هو الإله الحق، والحياة الأبدية."]]}, {"l": "Dan 12:2", "n": "", "vs": [[2, "ويستيقظ كثيرون من الأموات المدفونين في تراب الأرض، بعضهم ليثابوا بالحياة الأبدية وبعضهم ليساموا ذل العار والازدراء إلى الأبد."]]}, {"l": "Luk 18:30", "n": "", "vs": [[30, "إلا وينال أضعاف ذلك في هذا الزمان، وينال في الزمان الآتي الحياة الأبدية!»"]]}, {"l": "Joh 5:39", "n": "", "vs": [[39, "أنتم تدرسون الكتب لأنكم تعتقدون أنها ستهديكم إلى الحياة الأبدية. هذه الكتب تشهد لي،"]]}, {"l": "Joh 6:27", "n": "", "vs": [[27, "لا تسعوا وراء الطعام الفاني، بل وراء الطعام الباقي إلى الحياة الأبدية، والذي يعطيكم إياه ابن الإنسان، لأن هذا الطعام قد وضع الله الآب ختمه عليه»."]]}, {"l": "Joh 6:47", "n": "", "vs": [[47, "الحق الحق أقول لكم: إن الذي يؤمن بي فله حياة أبدية."]]}, {"l": "Joh 6:54", "n": "", "vs": [[54, "من يأكل جسدي ويشر ب دمي، فله حياة أبدية، وأنا أقيمه في اليوم الأخير،"]]}, {"l": "Joh 6:68", "n": "", "vs": [[68, "فأجابه سمعان بطرس: «إلى من نذهب يار ب وعندك كلام الحياة الأبدية."]]}, {"l": "Joh 10:28", "n": "", "vs": [[28, "وأعطيها حياة أبدية، فلا تهلك إلى الأبد، ولا ينتزعها أحد من يدي."]]}, {"l": "Joh 12:50", "n": "", "vs": [[50, "وأنا أعلم أن وصيته هي حياة أبدية: فإن ما أقوله من كلام، أقوله كما قاله لي الآب»."]]}, {"l": "Joh 17:2", "n": "", "vs": [[2, "فقد أوليته السلطة على جميع البشر، ليمنح جميع الذين قد وهبتهم له حياة أبدية."]]}, {"l": "Joh 17:3", "n": "", "vs": [[3, "والحياة الأبدية هي أن يعرفوك أنت الإله الحق وحدك، والذي أرسلته: يسوع المسيح."]]}, {"l": "Rom 2:7", "n": "", "vs": [[7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"]]}, {"l": "Rom 5:21", "n": "", "vs": [[21, "حتى إنه كما ملكت الخطيئة بالموت، فكذلك أيضا تملك النعمة على أساس البر مؤدية إلى الحياة الأبدية بيسوع المسيح ربنا."]]}, {"l": "Rom 6:23", "n": "", "vs": [[23, "لأن أجرة الخطيئة هي الموت، وأما هبة الله فهي الحياة الأبدية في المسيح يسوع ربنا."]]}, {"l": "Gal 6:8", "n": "", "vs": [[8, "فإن من يزرع لجسده، فمن الجسد يحصد فسادا. ومن يزرع للروح، فمن الروح يحصد حياة أبدية. فلا نفشل في عمل الخير،"]]}, {"l": "1Ti 1:16", "n": "", "vs": [[16, "ولكن لهذا السبب عوملت بالرحمة، ليجعل يسوع المسيح مني، أنا أولا، مثالا يظهر صبره الطويل، لجميع الذين سيؤمنون به لنوال الحياة الأبدية."]]}, {"l": "1Ti 6:12", "n": "", "vs": [[12, "أحسن الجهاد في معركة الإيمان الجميلة. تمسك بالحياة الأبدية، التي إليها قد دعيت، وقد اعترفت الاعتراف الحسن (بالإيمان) أمام شهود كثيرين."]]}, {"l": "1Ti 6:19", "n": "", "vs": [[19, "وبذلك يوفرون لأنفسهم رأس مال للمستقبل، حتى يمسكوا بالحياة الحقيقية."]]}, {"l": "Tit 1:2", "n": "", "vs": [[2, "في رجاء الحياة الأبدية، التي وعد بها الله المنزه عن الكذب، من قبل أزمنة الأزل،"]]}, {"l": "Tit 3:7", "n": "", "vs": [[7, "حتى إذا تبررنا بنعمته، نصير ورثة، وفقا لرجائنا بالحياة الأبدية."]]}, {"l": "Jud 1:21", "n": "", "vs": [[21, "واحفظوا أنفسكم في محبة الله، منتظرين رحمة ربنا يسوع المسيح إذ يعود ويأخذكم لتحيوا معه إلى الأبد."]]}], "kwAr": "", "noteAr": ""}], "arS": [["فإن الله نفسه قد ", []], ["وعدنا", ["G1861"]], [" ", []], ["بالحياة", ["G2222"]], [" ", []], ["الأبدية", ["G166"]], [".", []]]}, {"c": 2, "v": 26, "text": "كتبت إليكم هذا مشيرا إلى الذين يحاولون أن يضللوكم.", "groups": [{"kw": "concerning", "raw": "1Jo_3:7; Pro_12:26; Eze_13:10; Mar_13:22; Act_20:29, Act_20:30; 2Co_11:13-15; Col_2:8, Col_2:18; 1Ti_4:1; 2Ti_3:13; 2Pe_2:1-3; 2Jo_1:7", "note": "", "refs": [{"l": "1Jo 3:7", "n": "", "vs": [[7, "أيها الأولاد الصغار، لا تدعوا أحدا يضللكم. تأكدوا أن من يمارس الصلاح، يظهر أنه بار كما أن المسيح بار."]]}, {"l": "Pro 12:26", "n": "", "vs": [[26, "الصديق يهدي صاحبه، أما طريق الأشرار فتضله."]]}, {"l": "Eze 13:10", "n": "", "vs": [[10, "لأنهم حقا أضلوا شعبي قائلين: سيكون لكم سلام مع أنه ليس هناك سلام، فكان شعبي يبني حائطا وهم يطلونه بماء الكلس."]]}, {"l": "Mar 13:22", "n": "", "vs": [[22, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Act 20:29", "n": "", "vs": [[29, "فإني أعلم أنه بعد رحيلي سيندس بينكم ذئاب خاطفة، لا تشفق على القطيع."]]}, {"l": "Act 20:30", "n": "", "vs": [[30, "بل إن قوما منكم أنتم سيقومون ويعلمون تعاليم منحرفة، ليجروا التلاميذ وراءهم."]]}, {"l": "2Co 11:13-15", "n": "", "vs": [[13, "فإن أمثال هؤلاء هم رسل دجالون، عمال ماكرون، يظهرون أنفسهم بمظهر رسل المسيح."], [14, "ولا عجب! فالشيطان نفسه يظهر نفسه بمظهر ملاك نور."], [15, "فليس كثيرا إذن أن يظهر خدامه أنفسهم بمظهر خدام البر. وإن عاقبتهم ستكون على حسب أعمالهم."]]}, {"l": "Col 2:8", "n": "", "vs": [[8, "احذروا أن يوقعكم أحد فريسة بالفلسفة والغرور الباطل، عملا بتقاليد الناس ومباديء العالم؛ مما لا يوافق المسيح."]]}, {"l": "Col 2:18", "n": "", "vs": [[18, "لا يحرمكم أحد من جائزتكم، بحملكم على ما يرغب فيه من إظهار التواضع والتعبد للملائكة، داخلا في رؤى يتوهمها، وقد نفخه باطلا ذهنه الجسدي،"]]}, {"l": "1Ti 4:1", "n": "", "vs": [[1, "إلا أن الروح يعلن صراحة أن قوما في الأزمنة الأخيرة سوف يرتدون عن الإيمان، منساقين وراء أرواح مضللة وتعاليم شيطانية،"]]}, {"l": "2Ti 3:13", "n": "", "vs": [[13, "أما الناس الأشرار والدجالون المحتالون، فيتقدمون في الشر، مضللين الآخرين وهم أنفسهم مضللون!"]]}, {"l": "2Pe 2:1-3", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."], [2, "وكثيرون سيسيرون وراءهم في طرق الإباحية. وبسببهم توجه الإهانة إلى طريق الحق."], [3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "2Jo 1:7", "n": "", "vs": [[7, "إن العالم أصبح يعج بالمضللين الذين لا يعترفون أن يسوع المسيح جاء إلى الأرض بجسم بشري. هذا هو روح المضل وضد المسيح!"]]}], "kwAr": "الذين يحاولون أن يضللوكم", "noteAr": ""}], "arS": [["كتبت", ["G1125"]], [" إليكم هذا مشيرا إلى الذين يحاولون أن ", []], ["يضللوكم", ["G4105"]], [".", []]]}, {"c": 2, "v": 27, "text": "أما أنتم فقد نلتم من الله مسحة تبقى فيكم دائما. ولذلك، لستم بحاجة إلى من يعلمكم الحق. فتلك المسحة عينها هي التي تعلمكم كل شيء. وهي حق وليست كذبا. فكما علمتكم اثبتوا في المسيح.", "groups": [{"kw": "the anointing", "raw": "1Jo_2:20, 1Jo_3:24; Joh_4:14; 1Pe_1:23; 2Jo_1:2", "note": "", "refs": [{"l": "1Jo 2:20", "n": "", "vs": [[20, "أما أنتم فلكم مسحة من القدوس، وجميعكم تعرفون الحق."]]}, {"l": "1Jo 3:24", "n": "", "vs": [[24, "وكل من يطيع وصايا الله، فإنه يثبت في الله، والله يثبت فيه. والذي يؤكد لنا أن الله يثبت فينا، هو الروح القدس الذي وهبه لنا."]]}, {"l": "Joh 4:14", "n": "", "vs": [[14, "ولكن الذي يشرب من الماء الذي أعطيه أنا، لن يعطش بعد ذلك أبدا، بل إن ما أعطيه من ماء يصبح في داخله نبعا يفيض فيعطي حياة أبدية»."]]}, {"l": "1Pe 1:23", "n": "", "vs": [[23, "فأنتم قد ولدتم ولادة ثانية لا من زرع بشري يفنى، بل مما لا يفنى: بكلمة الله الحية الباقية إلى الأبد."]]}, {"l": "2Jo 1:2", "n": "", "vs": [[2, "بما أن الحق ثابت في قلوبنا، ولابد أن يرافقنا إلى الأبد،"]]}], "kwAr": "مسحة", "noteAr": ""}, {"kw": "and ye", "raw": "1Jo_2:20,1Jo_2:21; Jer_31:33, Jer_31:34; Joh_14:26, Joh_16:13; Heb_8:10,Heb_8:11", "note": "", "refs": [{"l": "1Jo 2:20", "n": "", "vs": [[20, "أما أنتم فلكم مسحة من القدوس، وجميعكم تعرفون الحق."]]}, {"l": "1Jo 2:21", "n": "", "vs": [[21, "فأنا أكتب إليكم ليس لأنكم لا تعرفون الحق، بل لأنكم تعرفونه وتدركون أن كل ما هو كذب لا يأتي من الحق."]]}, {"l": "Jer 31:33", "n": "", "vs": [[33, "ولكن هذا هو العهد الذي أبرمه مع ذرية إسرائيل بعد تلك الأيام»، يقول الرب: «سأجعل شريعتي في دواخلهم، وأدونها على قلوبهم وأكون لهم إلها وهم يكونون لي شعبا."]]}, {"l": "Jer 31:34", "n": "", "vs": [[34, "ولا يحض في ما بعد كل واحد قريبه قائلا: اعرف الرب إلهك لأنهم جميعا سيعرفونني، من صغيرهم إلى كبيرهم، لأني سأصفح عن إثمهم ولن أذكر خطاياهم من بعد»."]]}, {"l": "Joh 14:26", "n": "", "vs": [[26, "وأما الروح القدس، المعين الذي سيرسله الآب باسمي، فإنه يعلمكم كل شيء، ويذكركم بكل ما قلته لكم."]]}, {"l": "Joh 16:13", "n": "", "vs": [[13, "ولكن، عندما يأتيكم روح الحق يرشدكم إلى الحق كله، لأنه لا يقول شيئا من عنده، بل يخبركم بما يسمعه، ويطلعكم على ما سوف يحدث."]]}, {"l": "Heb 8:10", "n": "", "vs": [[10, "فهذا هو العهد الذي أبرمه مع بني إسرائيل، بعد تلك الأيام، يقول الرب: أضع شرائعي داخل ضمائرهم، وأكتبها على قلوبهم، وأكون لهم إلها، وهم يكونون لي شعبا."]]}, {"l": "Heb 8:11", "n": "", "vs": [[11, "بعد ذلك، لا يعلم أحد منهم ابن وطنه ولا أخاه قائلا: تعرف بالرب! ذلك لأن الجميع سوف يعرفونني حق المعرفة، من الصغير فيهم إلى العظيم."]]}], "kwAr": "لستم بحاجة إلى من يعلمكم", "noteAr": ""}, {"kw": "but", "raw": "1Co_2:13; Eph_4:21; 1Th_2:13; 1Ti_2:7; 2Pe_1:16, 2Pe_1:17", "note": "", "refs": [{"l": "1Co 2:13", "n": "", "vs": [[13, "ونحن نتكلم بهذه الأمور لا في كلام تعلمه الحكمة البشرية، بل في كلام يعلمه الروح القدس، معبرين عن الحقائق الروحية بوسائل روحية."]]}, {"l": "Eph 4:21", "n": "", "vs": [[21, "إذا كنتم قد سمعتموه حقا وتلقيتم فيه التعليم الموافق للحق الذي في يسوع!"]]}, {"l": "1Th 2:13", "n": "", "vs": [[13, "ولذلك نحن أيضا نرفع الشكر لله بلا توقف، لأنكم لما تلقيتم منا كلمة البشارة من الله، قبلتموها لا كأنها كلمة بشر، بل كما هي في الحقيقة: باعتبارها كلمة الله العاملة أيضا فيكم أنتم المؤمنين."]]}, {"l": "1Ti 2:7", "n": "", "vs": [[7, "ولها قد عينت أنا مبشرا ورسولا، الحق أقول ولست أكذب، معلما للأمم في الإيمان والحق."]]}, {"l": "2Pe 1:16", "n": "", "vs": [[16, "فنحن، عندما أخبرناكم بقدرة ربنا يسوع المسيح، وبعودته المجيدة، لم نكن ننقل عن أساطير مختلقة بمهارة. وإنما، تكلمنا باعتبارنا شهود عيان لعظمة المسيح."]]}, {"l": "2Pe 1:17", "n": "", "vs": [[17, "فإنه قد نال من الله الآب كرامة ومجدا، إذ جاءه من المجد الفائق صوت يقول: «هذا هو ابني الحبيب الذي به سررت كل سرور!»"]]}], "kwAr": "تعلمكم كل شيء", "noteAr": ""}, {"kw": "ye shall", "raw": "1Jo_2:28; Joh_8:31, Joh_8:32, Joh_15:4-7; Col_2:6", "note": "", "refs": [{"l": "1Jo 2:28", "n": "", "vs": [[28, "والآن، أيها الأولاد، كونوا ثابتين في المسيح، حتى تكون لنا نحن ثقة أمامه، ولا نخجل منه، عندما يعود."]]}, {"l": "Joh 8:31", "n": "", "vs": [[31, "فقال لليهود الذين آمنوا به: «إن ثبتم في كلمتي، كنتم حقا تلاميذي."]]}, {"l": "Joh 8:32", "n": "", "vs": [[32, "وتعرفون الحق، والحق يحرركم»."]]}, {"l": "Joh 15:4-7", "n": "", "vs": [[4, "فاثبتوا في وأنا فيكم. كما أن الغصن لا يقدر أن ينتج ثمرا إلا إذا ثبت في الكرمة؛ فكذلك أنتم، إلا إذا ثبتم في."], [5, "أنا الكرمة وأنتم الأغصان. من يثبت في وأنا فيه، فذاك ينتج ثمرا كثيرا. فإنكم بمعزل عني لا تقدرون أن تفعلوا شيئا."], [6, "إن كان أحد لا يثبت في يطرح خارجا كالغصن فيجف؛ ثم تجمع الأغصان الجافة، وتطرح في النار فتحترق."], [7, "ولكن، إن ثبتم في، وثبت كلامي فيكم، فاطلبوا ما تريدون يكن لكم."]]}, {"l": "Col 2:6", "n": "", "vs": [[6, "فمثلما قبلتم المسيح يسوع الرب، ففيه اسلكوا"]]}], "kwAr": "اثبتوا", "noteAr": ""}, {"kw": "him", "raw": "or, it", "note": "or, it", "refs": [], "kwAr": "في المسيح", "noteAr": "أو: فيها."}], "arS": [["أما أنتم فقد ", []], ["نلتم", ["G2983"]], [" من الله ", []], ["مسحة", ["G5545"]], [" ", []], ["تبقى", ["G3306"]], [" فيكم دائما. ولذلك، لستم ", []], ["بحاجة", ["G2192", "G5532"]], [" إلى من ", []], ["يعلمكم", ["G1321"]], [" الحق. فتلك ", []], ["المسحة", ["G5545"]], [" ", []], ["عينها", ["G846"]], [" هي التي ", []], ["تعلمكم", ["G1321"]], [" ", []], ["كل شيء", ["G3956"]], [". وهي ", []], ["حق", ["G227"]], [" وليست ", []], ["كذبا", ["G5579"]], [". فكما ", []], ["علمتكم", ["G1321"]], [" ", []], ["اثبتوا", ["G3306"]], [" في المسيح.", []]]}, {"c": 2, "v": 28, "text": "والآن، أيها الأولاد، كونوا ثابتين في المسيح، حتى تكون لنا نحن ثقة أمامه، ولا نخجل منه، عندما يعود.", "groups": [{"kw": "little", "raw": "1Jo_2:1", "note": "", "refs": [{"l": "1Jo 2:1", "n": "", "vs": [[1, "ياأولادي الصغار، أكتب إليكم هذه الأمور لكي لا تخطئوا. ولكن، إن أخطأ أحدكم، فلنا عند الآب شفيع هو يسوع المسيح البار."]]}], "kwAr": "أيها الأولاد", "noteAr": ""}, {"kw": "when", "raw": "1Jo_3:2; Mar_8:38; Col_3:4; 1Ti_6:14; 2Ti_4:8; Tit_2:13; Heb_9:28; 1Pe_1:7, 1Pe_5:4; Rev_1:7", "note": "", "refs": [{"l": "1Jo 3:2", "n": "", "vs": [[2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"]]}, {"l": "Mar 8:38", "n": "", "vs": [[38, "فإن أي من يستحي بي وبكلامي في هذا الجيل الفاسق الخاطيء، به يستحي ابن الإنسان عندما يعود في مجد أبيه مع الملائكة المقدسين»."]]}, {"l": "Col 3:4", "n": "", "vs": [[4, "فعندما يظهر المسيح، وهو حياتنا، عندئذ تظهرون أنتم أيضا معه في المجد."]]}, {"l": "1Ti 6:14", "n": "", "vs": [[14, "أن تحفظ الوصية خالية من العيب واللوم إلى يوم ظهور ربنا يسوع المسيح علنا."]]}, {"l": "2Ti 4:8", "n": "", "vs": [[8, "إنما ينتظرني الآن إكليل البر المحفوظ لي، والذي سيهبه لي الرب الديان العادل في ذلك اليوم؛ ولن يوهب لي وحدي، بل أيضا لجميع الذين يحبون ظهوره."]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "Heb 9:28", "n": "", "vs": [[28, "كذلك المسيح أيضا: مات مرة واحدة حاملا خطايا كثيرين، مقربا نفسه (لله) عوضا عنهم. ولا بد أن يعود إلى الظهور. لا ليعالج الخطايا، بل ليحقق الخلاص النهائي لجميع منتظريه!"]]}, {"l": "1Pe 1:7", "n": "", "vs": [[7, "إلا أن غاية هذه التجارب هي اختبار حقيقة إيمانكم. فكما تختبر النار الذهب وتنقيه، تختبر التجارب حقيقة إيمانكم، وهو أثمن جدا من الذهب الفاني. وهكذا، يكون إيمانكم مدعاة مدح وإكرام وتمجيد لكم، عندما يعود يسوع المسيح ظاهرا بمجده."]]}, {"l": "1Pe 5:4", "n": "", "vs": [[4, "وعندما يظهر رئيس الرعاة، تنالون إكليل المجد الذي لا يفنى."]]}, {"l": "Rev 1:7", "n": "", "vs": [[7, "ها هو آت مع السحاب! ستراه عيون الجميع، حتى أولئك الذين طعنوه، وتنوح بسببه قبائل الأرض كلها! نعم، آمين!"]]}], "kwAr": "عندما يعود", "noteAr": ""}, {"kw": "have", "raw": "1Jo_3:21, 1Jo_4:17; Isa_25:9, Isa_45:17; Rom_9:33", "note": "", "refs": [{"l": "1Jo 3:21", "n": "", "vs": [[21, "أيها الأحباء، إذا كانت ضمائرنا لا تلومنا. فهذا دليل على أن لنا ثقة عظيمة من نحو الله."]]}, {"l": "1Jo 4:17", "n": "", "vs": [[17, "وتكون محبة الله قد اكتملت في داخلنا حين تولد فينا ثقة كاملة من جهة يوم الدينونة: لأنه كما المسيح، هكذا نحن أيضا في هذا العالم."]]}, {"l": "Isa 25:9", "n": "", "vs": [[9, "ويقولون في ذلك اليوم: «ها هو إلهنا الذي انتظرناه فخلصنا. هذا هو الرب الذي انتظرناه نبتهج ونفرح بخلاصه»."]]}, {"l": "Isa 45:17", "n": "", "vs": [[17, "أما إسرائيل فقد خلصه الرب بخلاص أبدي، ولن يلحقكم عار أو خزي مدى الدهور،"]]}, {"l": "Rom 9:33", "n": "", "vs": [[33, "كما كتب: «ها أنا واضع في صهيون حجر عثرة وصخرة سقوط. ومن يؤمن به لا يخيب»."]]}], "kwAr": "تكون لنا ثقة", "noteAr": ""}, {"kw": "at his", "raw": "Mal_3:2, Mal_4:5; 1Co_1:7, 1Co_15:23; 1Th_3:13, 1Th_5:23; 2Pe_3:4-12", "note": "", "refs": [{"l": "Mal 3:2", "n": "", "vs": [[2, "ولكن من يحتمل يوم مجيئه؟ ومن يثبت عند ظهوره؟ فإنه مثل نار الممحص أو أشنان القصارين."]]}, {"l": "Mal 4:5", "n": "", "vs": [[5, "ها أنا أرسل إليكم إيليا النبي قبل أن يجيء يوم قضاء الرب الرهيب العظيم"]]}, {"l": "1Co 1:7", "n": "", "vs": [[7, "حتى إنكم لا تحتاجون بعد إلى أية موهبة فيما تتوقعون ظهور ربنا يسوع المسيح علنا."]]}, {"l": "1Co 15:23", "n": "", "vs": [[23, "على أن لكل واحد رتبته: فأولا المسيح بصفته البكر؛ وبعده خاصته لدى رجوعه،"]]}, {"l": "1Th 3:13", "n": "", "vs": [[13, "حتى تتثبت قلوبكم بغير لوم في القداسة أمام إلهنا وأبينا عندما يظهر ربنا يسوع عائدا مع جميع قديسيه."]]}, {"l": "1Th 5:23", "n": "", "vs": [[23, "وإله السلام نفسه يقدسكم إلى التمام ويحفظكم سالمين، روحا ونفسا وجسدا، لتكونوا بلا لوم عند عودة ربنا يسوع المسيح."]]}, {"l": "2Pe 3:4-12", "n": "", "vs": [[4, "وسيقولون: «أين هو الوعد برجوع المسيح؟ فمنذ أن مات آباؤنا الأولون، بل منذ بدء الخليقة، مازال كل شيء على حاله!»"], [5, "إنهم يتناسون، عمدا، أنه بكلمة أمر من الله وجدت السماوات منذ القديم وتكونت الأرض من الماء وبالماء."], [6, "وبكلمة منه أيضا، دمر العالم الذي كان موجودا في ذلك الزمان، إذ فاض الماء عليه."], [7, "أما السماوات والأرض الحالية، فستبقى مخزونة ومحفوظة للنار بتلك الكلمة عينها إلى يوم الدينونة وهلاك الفاجرين!"], [8, "ولكن، أيها الأحباء، عليكم ألا تنسوا هذه الحقيقة: أن يوما واحدا في نظر الرب هو كألف سنة، وألف سنة كيوم واحد."], [9, "فالرب، إذن، لا يبطيء في إتمام وعده، كما يظن بعض الناس، ولكنه يتأنى عليكم، فهو لا يريد لأحد من الناس أن يهلك، بل يريد لجميع الناس أن يرجعوا إليه تائبين."], [10, "إلا أن «يوم الرب» سيأتي كما يأتي اللص في الليل. في ذلك اليوم، تزول السماوات محدثة دويا هائلا وتنحل العناصر محترقة بنار شديدة، وتحترق الأرض وما فيها من منجزات."], [11, "ومادامت هذه الأشياء جميعا ستنحل، فكيف يجب أن تكونوا أنتم أصحاب سلوك مقدس يتصف بالتقوى،"], [12, "منتظرين «يوم الله» الأبدي وطالبين حلوله بسرعة. ففي ذلك اليوم، تنحل السماوات ملتهبة، وتذوب العناصر محترقة."]]}], "kwAr": "لا نخجل منه", "noteAr": ""}], "arS": [["والآن", ["G3568"]], ["، أيها ", []], ["الأولاد", ["G5040"]], ["، كونوا ", []], ["ثابتين", ["G3306"]], [" في المسيح، حتى تكون لنا نحن ", []], ["ثقة", ["G3954"]], [" أمامه، ولا ", []], ["نخجل", ["G153"]], [" منه، عندما ", []], ["يعود", ["G3952"]], [".", []]]}, {"c": 2, "v": 29, "text": "وما دمتم تعلمون أن الله بار، فاعلموا أن كل من يفعل الصلاح، يظهر أنه مولود من الله حقا.", "groups": [{"kw": "he is", "raw": "1Jo_2:1, 1Jo_3:5; Zec_9:9; Act_3:14, Act_22:14; 2Co_5:21; Heb_1:8, Heb_1:9, Heb_7:2, Heb_7:26; 1Pe_3:18", "note": "", "refs": [{"l": "1Jo 2:1", "n": "", "vs": [[1, "ياأولادي الصغار، أكتب إليكم هذه الأمور لكي لا تخطئوا. ولكن، إن أخطأ أحدكم، فلنا عند الآب شفيع هو يسوع المسيح البار."]]}, {"l": "1Jo 3:5", "n": "", "vs": [[5, "وأنتم تعرفون أن المسيح جاء إلى هذه الأرض لكي يحمل الخطايا، مع كونه بلا خطيئة."]]}, {"l": "Zec 9:9", "n": "", "vs": [[9, "»ابتهجي جدا ياابنة صهيون واهتفي ياابنة أورشليم، لأن هوذا ملكك مقبل إليك. هو عادل ظافر، ولكنه وديع راكب على أتان، على جحش ابن أتان."]]}, {"l": "Act 3:14", "n": "", "vs": [[14, "أنتم أنكرتم القدوس البار وطلبتم العفو عن رجل قاتل،"]]}, {"l": "Act 22:14", "n": "", "vs": [[14, "فقال: إله آبائنا اختارك مسبقا لتعرف إرادته، وترى البار وتسمع صوتا من فمه."]]}, {"l": "2Co 5:21", "n": "", "vs": [[21, "فإن الذي لم يعرف خطيئة، جعله الله خطيئة لأجلنا، لنصير نحن بر الله فيه."]]}, {"l": "Heb 1:8", "n": "", "vs": [[8, "ولكنه يخاطب الابن قائلا: «إن عرشك، ياالله، ثابت إلى أبد الآبدين، وصولجان حكمك عادل ومستقيم."]]}, {"l": "Heb 1:9", "n": "", "vs": [[9, "إنك أحببت البر وأبغضت الإثم. لذلك مسحك الله إلهك ملكا، إذ صب عليك زيت البهجة أكثر من رفقائك!»"]]}, {"l": "Heb 7:2", "n": "", "vs": [[2, "وأدى له إبراهيم عشرا من كل ما غنمه في المعركة. فمن جهة، يعني اسم ملكيصادق «ملك العدل». ومن جهة أخرى، كان لقبه «ملك ساليم» أي «ملك السلام»."]]}, {"l": "Heb 7:26", "n": "", "vs": [[26, "نعم، هذا هو رئيس الكهنة الذي كنا محتاجين إليه. إنه قدوس، لا عيبة فيه، ولا نجاسة، قد انفصل عن الخاطئين، وارتفع حتى صار أسمى من السماوات."]]}, {"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}], "kwAr": "الله بار", "noteAr": ""}, {"kw": "ye know", "raw": "or, know ye", "note": "or, know ye", "refs": [], "kwAr": "فاعلموا", "noteAr": "أو: اعلموا."}, {"kw": "that every", "raw": "1Jo_3:7, 1Jo_3:10; Jer_13:23; Mat_7:16-18; Act_10:35; Tit_2:12-14", "note": "", "refs": [{"l": "1Jo 3:7", "n": "", "vs": [[7, "أيها الأولاد الصغار، لا تدعوا أحدا يضللكم. تأكدوا أن من يمارس الصلاح، يظهر أنه بار كما أن المسيح بار."]]}, {"l": "1Jo 3:10", "n": "", "vs": [[10, "إذن، هذا هو المقياس الذي نميز به بين أولاد الله وأولاد إبليس. من لا يمارس الصلاح، فهو ليس من الله. وكذلك من لا يحب أخاه!"]]}, {"l": "Jer 13:23", "n": "", "vs": [[23, "هل يمكن للإثيوبي أن يغير جلده، أو للنمر رقطه؟ كذلك أنتم لا تقدرون أن تصنعوا خيرا بعد أن ألفتم ارتكاب الشر."]]}, {"l": "Mat 7:16-18", "n": "", "vs": [[16, "من ثمارهم تعرفونهم. هل يجنى من الشوك عنب، أو من العليق تين؟"], [17, "هكذا، كل شجرة جيدة تثمر ثمرا جيدا. أما الشجرة الرديئة، فإنها تثمر ثمرا رديئا."], [18, "لا يمكن أن تثمر الشجرة الجيدة ثمرا رديئا، ولا الشجرة الرديئة ثمرا جيدا."]]}, {"l": "Act 10:35", "n": "", "vs": [[35, "بل يقبل من يتقيه ويعمل الصلاح مهما كانت جنسيته."]]}, {"l": "Tit 2:12-14", "n": "", "vs": [[12, "وهي تعلمنا أن نقطع علاقتنا بالإباحية والشهوات العالمية، وأن نحيا في العصر الحاضر حياة التعقل والبر والتقوى،"], [13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"], [14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}], "kwAr": "كل من يفعل الصلاح", "noteAr": ""}, {"kw": "is born", "raw": "1Jo_3:9, 1Jo_4:7, 1Jo_5:1; Joh_1:13, Joh_3:3-5; Jam_1:18; 1Pe_1:3, 1Pe_1:23; 2Pe_1:4", "note": "", "refs": [{"l": "1Jo 3:9", "n": "", "vs": [[9, "فكل مولود من الله، لا يمارس الخطيئة، لأن طبيعة الله صارت ثابتة فيه. بل إنه لا يستطيع أن يمارس الخطيئة، لأنه مولود من الله."]]}, {"l": "1Jo 4:7", "n": "", "vs": [[7, "أيها الأحباء، لنحب بعضنا بعضا: لأن المحبة تصدر من الله. إذن، كل من يحب، يكون مولودا من الله ويعرف الله ."]]}, {"l": "1Jo 5:1", "n": "", "vs": [[1, "كل من يؤمن حقا أن يسوع هو المسيح، فهو مولود من الله. ومن يحب الوالد، فلابد أن يحب المولودين منه أيضا."]]}, {"l": "Joh 1:13", "n": "", "vs": [[13, "وهم الذين ولدوا ليس من دم، ولا من رغبة جسد، ولا من رغبة بشر، بل من الله."]]}, {"l": "Joh 3:3-5", "n": "", "vs": [[3, "فأجابه يسوع: «الحق الحق أقول لك: لا أحد يمكنه أن يرى ملكوت الله إلا إذا ولد من جديد»."], [4, "فسأله نيقوديموس: «كيف يمكن الإنسان أن يولد وهو كبير السن؟ ألعله يستطيع أن يدخل بطن أمه ثانية ثم يولد؟»"], [5, "أجابه يسوع: «الحق الحق أقول لك: لا يمكن أن يدخل أحد ملكوت الله إلا إذا ولد من الماء والروح."]]}, {"l": "Jam 1:18", "n": "", "vs": [[18, "وهو قد شاء أن يجعلنا أولادا له، فولدنا بكلمته، كلمة الحق. وغايته أن نكون باكورة خليقته."]]}, {"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}, {"l": "1Pe 1:23", "n": "", "vs": [[23, "فأنتم قد ولدتم ولادة ثانية لا من زرع بشري يفنى، بل مما لا يفنى: بكلمة الله الحية الباقية إلى الأبد."]]}, {"l": "2Pe 1:4", "n": "", "vs": [[4, "اللذين بهما أعطانا الله بركاته العظمى الثمينة التي كان قد وعد بها. وبهذا صار بإمكانكم أن تتخلصوا من الفساد الذي تنشره الشهوة في العالم، وتشتركوا في الطبيعة الإلهية."]]}], "kwAr": "مولود من الله", "noteAr": ""}], "arS": [["وما دمتم ", []], ["تعلمون", ["G1492"]], [" أن الله ", []], ["بار", ["G1342"]], ["، ", []], ["فاعلموا", ["G1097"]], [" أن ", []], ["كل", ["G3956"]], [" من ", []], ["يفعل", ["G4160"]], [" ", []], ["الصلاح", ["G1343"]], ["، يظهر أنه ", []], ["مولود", ["G1080"]], [" من الله حقا.", []]]}, {"c": 3, "v": 1, "text": "تأملوا ما أعظم المحبة التي أحبنا بها الآب حتى صرنا ندعى «أولاد الله»، ونحن أولاده حقا. ولكن، بما أن أهل العالم لا يعرفون الله، فهم لا يعرفوننا.", "groups": [{"kw": "what", "raw": "1Jo_4:9, 1Jo_4:10; 2Sa_7:19; Psa_31:19, Psa_36:7-9, Psa_89:1, Psa_89:2; Joh_3:16; Rom_5:8, Rom_8:32; Eph_2:4, Eph_2:5, Eph_3:18, Eph_3:19", "note": "", "refs": [{"l": "1Jo 4:9", "n": "", "vs": [[9, "وقد أظهر الله محبته لنا إذ أرسل ابنه الأوحد إلى العالم لكي نحيا به."]]}, {"l": "1Jo 4:10", "n": "", "vs": [[10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."]]}, {"l": "2Sa 7:19", "n": "", "vs": [[19, "وكأن هذا الأمر صغر في عينيك ياسيدي الرب، فرحت تتعهد بالحفاظ على ذرية عبدك إلى زمن طويل. وهذا ما يتوق إليه قلب الإنسان؟"]]}, {"l": "Psa 31:19", "n": "", "vs": [[19, "يارب، ما أعظم صلاحك الذي ذخرته لخائفيك، وأظهرته للواثقين بك على مرأى جميع البشر،"]]}, {"l": "Psa 36:7-9", "n": "", "vs": [[7, "اللهم، ما أثمن رحمتك، فإن بني البشر يحتمون في ظل جناحيك."], [8, "يرتوون من خيرات بيتك، ومن نهر نعمك تسقيهم."], [9, "لأن عندك نبع الحياة، وبنورك نرى النور."]]}, {"l": "Psa 89:1", "n": "", "vs": [[1, "أترنم بمراحم الرب إلى الأبد، وأعلن بفمي أمانتك من جيل إلى جيل،"]]}, {"l": "Psa 89:2", "n": "", "vs": [[2, "لأني قلت إن مراحمك ثابتة إلى الأبد، وقد ثبت في السماوات أمانتك."]]}, {"l": "Joh 3:16", "n": "", "vs": [[16, "لأنه هكذا أحب الله العالم حتى بذل ابنه الوحيد، لكي لا يهلك كل من يؤمن به، بل تكون له الحياة الأبدية."]]}, {"l": "Rom 5:8", "n": "", "vs": [[8, "ولكن الله أثبت لنا محبته، إذ ونحن مازلنا خاطئين مات المسيح عوضا عنا."]]}, {"l": "Rom 8:32", "n": "", "vs": [[32, "بل بذله لأجلنا جميعا، كيف لا يجود علينا معه بكل شيء أيضا؟"]]}, {"l": "Eph 2:4", "n": "", "vs": [[4, "أما الله ، وهو غني في الرحمة، فبسبب محبته العظيمة التي أحبنا بها،"]]}, {"l": "Eph 2:5", "n": "", "vs": [[5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"]]}, {"l": "Eph 3:18", "n": "", "vs": [[18, "تصيرون قادرين تماما أن تدركوا، مع القديسين جميعا، ما هو العرض والطول والعلو والعمق،"]]}, {"l": "Eph 3:19", "n": "", "vs": [[19, "وتعرفوا محبة المسيح التي تفوق المعرفة، فتمتلئوا حتى تبلغوا ملء الله كله."]]}], "kwAr": "ما أعظم المحبة", "noteAr": ""}, {"kw": "that", "raw": "Jer_3:19; Hos_1:10; Joh_1:12; Rom_8:14-17, Rom_8:21, Rom_9:25, Rom_9:26; 2Co_6:18; Gal_3:26, Gal_3:29, Gal_4:5, Gal_4:6; Rev_21:7", "note": "", "refs": [{"l": "Jer 3:19", "n": "", "vs": [[19, "ولكني قلت في نفسي: لشد ما يسعدني أن أقيمك بين الأبناء وأورثك أرضا شهية هي أجمل ميراث بين الأمم. وفكرت أنك تدعينني ياأبي، ولن ترتدي عن اتباعي."]]}, {"l": "Hos 1:10", "n": "", "vs": [[10, "ومع ذلك فإن عدد بني إسرائيل يكون كرمل البحر الذي لا يكال ولا يحصى. وفي الموضع الذي قيل لهم فيه: أنتم لستم شعبي، يقال لهم: أنتم أبناء الله الحي."]]}, {"l": "Joh 1:12", "n": "", "vs": [[12, "أما الذين قبلوه، أي الذين آمنوا باسمه، فقد منحهم الحق في أن يصيروا أولاد الله،"]]}, {"l": "Rom 8:14-17", "n": "", "vs": [[14, "فإن جميع الخاضعين لقيادة روح الله، هم أبناء لله."], [15, "إذ إنكم لم تنالوا روح عبودية يعيدكم إلى الخوف، بل نلتم روح بنوة به نصرخ: «أبا! أبانا!»"], [16, "فالروح نفسه يشهد مع أرواحنا بأننا أولاد الله."], [17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}, {"l": "Rom 8:21", "n": "", "vs": [[21, "تحرر هي أيضا من عبودية الفساد إلى حرية المجد التي لأولاد الله."]]}, {"l": "Rom 9:2
