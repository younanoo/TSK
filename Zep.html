اروا زبلا للأرض."]]}, {"l": "Jer 9:21", "n": "", "vs": [[21, "فإن الموت قد تسلق إلى كوانا وتسلل إلى قصورنا، فاستأصل الأطفال من الشوارع والشبان من الساحات."]]}, {"l": "Jer 9:22", "n": "", "vs": [[22, "وهذا ما يعلنه الرب: «ستتهاوى جثث الناس مثل نفاية على وجه الحقل، وتتساقط كقبضات وراء الحاصد، وليس من يجمعها»."]]}, {"l": "Jer 15:3", "n": "", "vs": [[3, "وأعهد بهم إلى أربعة أصناف من الخراب يقول الرب: السيف للذبح، والكلاب للتمزيق، وطيور السماء ووحوش الأرض للافتراس والإهلاك."]]}, {"l": "Jer 16:4-6", "n": "", "vs": [[4, "«سيموتون بالأمراض، فلا يندبون، ولا يدفنون بل يصبحون نفاية مطروحة على وجه الأرض، ويفنون بالسيف والجوع، وتكون جثثهم طعاما لجوارح السماء ولوحوش الأرض."], [5, "لا تدخل إلى بيت فيه مأتم، ولا تذهب لتندب أحدا أو للتعزية، لأني قد نزعت سلامي وإحساني ومراحمي من هذا الشعب،"], [6, "فيموت الصغير والكبير في هذه الأرض فلا يدفنون ولا يندبون أو يخدش أحد نفسه أو يحلق شعره حدادا عليهم."]]}, {"l": "Jer 18:21", "n": "", "vs": [[21, "لذلك أسلم بنيهم لأنياب الجوع، واعهد بهم إلى قبضة السيف فتصبح نساؤهم ثكالى وأرامل، وليمت رجالهم، وليلق شبانهم حتفهم في المعارك بحد السيف."]]}, {"l": "Lam 2:21", "n": "", "vs": [[21, "قد انطرح الصبي والشيوخ في غبار الطرقات. سقط عذاراي وشباني بالسيف. قد قتلتهم في يوم غضبك، ونحرتهم من غير رحمة."]]}, {"l": "Lam 4:14", "n": "", "vs": [[14, "تاهوا كعمي في الشوارع، ملطخين بالدم حتى لم يقدر أحد أن يلمس ثيابهم."]]}, {"l": "Amo 4:10", "n": "", "vs": [[10, "أصبتكم بالأوبئة التي أصيبت بها مصر، وقضيت على شبابكم بالسيف وسبيت خيولكم، وجعلت نتن معسكركم يزكم أنوفكم. ولكنكم لم ترجعوا إلي تائبين يقول الرب."]]}], "kwAr": "فتنسكب دماؤهم", "noteAr": ""}], "arS": [["فيه ", []], ["أضايق", ["H6887"]], [" ", []], ["الناس", ["H120"]], [" ", []], ["فيمشون", ["H1980"]], [" ", []], ["كالعمي", ["H5787"]], ["، ", []], ["لأنهم", ["H3588"]], [" ", []], ["أخطأوا", ["H2398"]], [" بحق ", []], ["الرب", ["H3068"]], ["، ", []], ["فتنسكب", ["H8210"]], [" ", []], ["دماؤهم", ["H1818"]], [" ", []], ["كالتراب", ["H6083"]], ["، ", []], ["ولحمهم", ["H3894"]], [" يتناثر ", []], ["كالجلة", ["H1561"]], [".", []]]}, {"c": 1, "v": 18, "text": "لا ينقذهم ذهبهم ولا فضتهم في يوم غضب الرب، إذ بنار غيرته تلتهم كل الأرض، وفيه يضع نهاية مباغتة كاملة سريعة لكل سكان المعمورة».", "groups": [{"kw": "their silver", "raw": "Zep_1:11; Psa_49:6-9, Psa_52:5-7; Pro_11:4, Pro_18:11; Isa_2:20,Isa_2:21; Jer_9:23, Jer_9:24; Eze_7:19; Mat_16:26; Luk_12:19-21, Luk_16:22, Luk_16:23", "note": "", "refs": [{"l": "Zep 1:11", "n": "", "vs": [[11, "ولولوا ياسكان دائرة السوق، لأن تجاركم يبيدون، وكل المتاجرين بالفضة قد استؤصلوا."]]}, {"l": "Psa 49:6-9", "n": "", "vs": [[6, "أولئك المتكلون على ثروتهم، وبوفرة غناهم يفتخرون."], [7, "لا يقدر أحد أبدا أن يفتدي أخاه أو يقدم لله كفارة عنه."], [8, "لأن فدية النفوس باهظة يتعذر دفعها مدى الحياة"], [9, "طلبا للخلود على الأرض وتفاديا لرؤية القبر."]]}, {"l": "Psa 52:5-7", "n": "", "vs": [[5, "حقا سيدمرك الله إلى الأبد، ويختطفك ويقتلعك من خيمتك، ويستأصلك من أرض الأحياء."], [6, "فيرى الأبرار ذلك ويخافون؛ يضحكون عليك قائلين:"], [7, "هذا هو الرجل الذي لم يتخذ الله حصنا له، بل اتكل على وفرة غناه واعتز بغوايته."]]}, {"l": "Pro 11:4", "n": "", "vs": [[4, "لا يجدي الغنى في يوم قضاء الرب، أما البر فينجي من الموت."]]}, {"l": "Pro 18:11", "n": "", "vs": [[11, "ثروة الغني مدينته الحصينة، وهي في وهمه سور شامخ."]]}, {"l": "Isa 2:20", "n": "", "vs": [[20, "في ذلك اليوم يطرح الناس للجرذان والخفافيش أوثانهم الفضية وأصنامهم الذهبية التي صنعوها ليعبدوها،"]]}, {"l": "Isa 2:21", "n": "", "vs": [[21, "ويدخلون في كهوف الصخر، وفي شقوق الجروف الجبلية هربا من هيبة الرب ومن مجد جلاله عندما يهب ليزلزل الأرض."]]}, {"l": "Jer 9:23", "n": "", "vs": [[23, "«فلا يفتخرن الحكيم بحكمته، ولا يزهون الجبار بجبروته، ولا الغني بثروته."]]}, {"l": "Jer 9:24", "n": "", "vs": [[24, "بل ليفتخر المفتخر بأنه يدرك ويعرفني أني أنا الرب الذي يمارس الرحمة والعدل والبر في الأرض لأني أسر بها»."]]}, {"l": "Eze 7:19", "n": "", "vs": [[19, "يطرحون فضتهم في الشوارع، ويضحى ذهبهم نجاسة، وتعجز فضتهم وذهبهم عن إنقاذهم في يوم غضب الرب. لا يشبعون منهما جوعهم، ولا يملأون منهما أجوافهم لأنهما كانا معثرة إثم لهم."]]}, {"l": "Mat 16:26", "n": "", "vs": [[26, "فماذا ينتفع الإنسان لو ربح العالم كله وخسر نفسه؟ أو ماذا يقدم الإنسان فداء عن نفسه؟"]]}, {"l": "Luk 12:19-21", "n": "", "vs": [[19, "وأقول لنفسي: يانفس، عندك خيرات كثيرة مخزونة لسنين عديدة، فاستريحي وكلي واشربي واطر بي!"], [20, "ولكن الله قال له: ياغبي، هذه الليلة تطلب نفسك منك، فلمن يبقى ما أعددته؟"], [21, "هذه هي حالة من يخزن الكنوز لنفسه ولا يكون غنيا عند الله!»"]]}, {"l": "Luk 16:22", "n": "", "vs": [[22, "ومات المسكين، وحملته الملائكة إلى حضن إبراهيم. ثم مات الغني أيضا ودفن."]]}, {"l": "Luk 16:23", "n": "", "vs": [[23, "وإذ رفع عينيه وهو في الهاوية يتعذب، رأى إبراهيم من بعيد ولعازر في حضنه."]]}], "kwAr": "ولا فضتهم", "noteAr": ""}, {"kw": "in the day", "raw": "Zep_1:15; Job_21:30", "note": "", "refs": [{"l": "Zep 1:15", "n": "", "vs": [[15, "يوم غضب هو ذلك اليوم، يوم ضيق وعذاب، يوم خراب ودمار، يوم ظلمة واكتئاب، يوم غيوم وقتام."]]}, {"l": "Job 21:30", "n": "", "vs": [[30, "إن الشرير قد أفلت من يوم البوار، ونجا من العقاب في يوم الغضب."]]}], "kwAr": "في يوم غضب الرب", "noteAr": ""}, {"kw": "but", "raw": "Zep_3:8; Lev_26:33-35; Deu_29:20-28, Deu_31:17; Isa_24:1-12; Jer_4:26-29, Jer_7:20,Jer_7:34, Jer_9:11", "note": "", "refs": [{"l": "Zep 3:8", "n": "", "vs": [[8, "لذلك يقول الرب: انتظروني لأني عزمت في اليوم الذي أقوم فيه كشاهد أن أجمع الأمم وأحشد الممالك لأسكب عليهم سخطي واحتدام غضبي، لأن الأرض بكاملها ستؤكل بنار غيرة غيظي."]]}, {"l": "Lev 26:33-35", "n": "", "vs": [[33, "وأشتتكم بين الشعوب، وأجرد عليكم سيفي، وألاحقكم، وأحول أرضكم إلى قفر ومدنكم إلى خرائب."], [34, "عندئذ تستوفي الأرض راحة سبوتها طوال سني وحشتها وأنتم مشتتون في ديار أعدائكم. حينئذ ترتاح الأرض وتستوفي سني سبوتها."], [35, "فتعوض في أيام وحشتها عن راحتها التي لم تنعم بها في سنوات سبوتكم عندما كنتم تقيمون عليها."]]}, {"l": "Deu 29:20-28", "n": "", "vs": [[20, "إن الرب لا يشاء الرفق بمثل هذا الإنسان، بل يحتدم غضبه وغيرته عليه، فتنزل به كل اللعنات المدونة في هذا الكتاب، ويمحو اسمه من تحت السماء."], [21, "ويفرزه الرب من بين أسباط إسرائيل ليهلكه بمقتضى جميع لعنات العهد المدونة في كتاب الشريعة هذا."], [22, "فيشاهد أبناؤكم من الأجيال القادمة، والغرباء الوافدون من أرض بعيدة بلايا تلك الأرض وما يصيبها الرب به من أمراض،"], [23, "إذ تصبح جميع الأرض كبريتا، محترقة لا زرع فيها ولا نبات ولا عشب، وكأنها انقلبت كما جرى لسدوم وعمورة وأدمة وصبوييم، التي قلبها الرب من جراء غضبه وسخطه."], [24, "فتقول جميع الأمم: لماذا فعل الرب هذا كله بهذه الأرض؟ ولماذا احتدام هذا الغضب العظيم؟"], [25, "فيكون الجواب: لأن هذا الشعب نقض عهد الرب إله آبائهم الذي قطعه معهم حين أخرجهم من ديار مصر،"], [26, "وغووا وعبدوا آلهة أخرى وسجدوا لها، آلهة غريبة لم يعرفوها ولم يعطها الرب لهم،"], [27, "فالتهب غضب الرب على تلك الأرض، فصب عليها كل اللعنات المدونة فى هذا الكتاب"], [28, "واجتثهم من أرضهم بغضب وسخط وغيظ عظيم، وطوح بهم إلى أرض أخرى كما هو حادث اليوم."]]}, {"l": "Deu 31:17", "n": "", "vs": [[17, "فيحتدم غضبي عليه في ذلك اليوم، وأنبذه وأحجب وجهي عنه، فيكون فريسة. وتلحق به شرور كثيرة ومصائب، حتى يقول: أليس لأن إلهي قد هجرني، قد أصابتني هذه الشرور؟"]]}, {"l": "Isa 24:1-12", "n": "", "vs": [[1, "ها إن الرب يخرب أرض يهوذا ويقفرها ويقلب وجهها ويشتت سكانها."], [2, "وما يقع على الشعب يقع على الكاهن أيضا، والسيد كالعبد والسيدة كأمتها والبائع كالمشتري، والمقترض كالمقرض، والدائن كالمديون."], [3, "ويحل الخراب بالأرض وتنهب نهبا، لأن الرب قد تكلم بهذا القضاء."], [4, "وتنوح الأرض وتذوي، وتضنى المسكونة وتذبل، ويحزن معها عظماؤها."], [5, "تدنست الأرض تحت سكانها، لأنهم تعدوا على الشريعة، ونقضوا الفرائض ونكثوا العهد الأبدي،"], [6, "لذلك التهمت اللعنة الأرض، وعوقب أهلها بإثمهم، فاحترق سكان الأرض ولم يبق منهم سوى قلة."], [7, "قد انتحبت الخمرة، وذبلت الكرمة، وأن جميع ذوي القلوب الطربة."], [8, "خرس طرب الدفوف، كف ضجيج المبتهجين، وصمت مرح العود."], [9, "لا يعودون يشربون الخمر مع الغناء، ويكون المسكر مرا لشاربيه."], [10, "قد تدمرت مدينة الفوضى، وأغلق كل بيت، فلا يقدر أحد على الدخول."], [11, "ترتفع صرخة في الأزقة طلبا للخمرة المفقودة. زال كل فرح، وتلاشى السرور من الأرض"], [12, "بقي الخراب في المدينة، وتحطمت البوابات فأصبحت ردما."]]}, {"l": "Jer 4:26-29", "n": "", "vs": [[26, "نظرت وإذا بالأرض الخصيبة قد تحولت إلى بر ية، وأصبحت جميع مدنها أطلالا أمام الرب وأمام غضبه المحتدم."], [27, "وهذا ما يقوله الرب: «ستحيق الوحشة بكل الأرض، ولكني لن أفنيها."], [28, "فمن أجل هذا تنوح الأرض وتظلم السماوات من فوق، لأني قد نطقت بقضائي. وهكذا قررت، لذلك لا أندم ولا أرجع عن عزمي."], [29, "من جلبة الفارس ورامي السهام يهرب أهل المدن، ويوغلون في الغابات ويتسلقون الصخور. قد أصبحت المدن جميعها مهجورة لا يقيم فيها إنسان."]]}, {"l": "Jer 7:20", "n": "", "vs": [[20, "لذلك يعلن السيد الرب: ها غضبي وسخطي ينصبان على هذا الموضع، وعلى البشر والبهائم والأشجار والحقول وأثمار الأرض، فيتقدان ولا يخمدان»."]]}, {"l": "Jer 7:34", "n": "", "vs": [[34, "وألاشي من مدن يهوذا ومن شوارع أورشليم أهازيج الطرب وأصداء الفرح، وأصوات بهجة العريس والعروس، لأن الأرض يعمها الخراب»."]]}, {"l": "Jer 9:11", "n": "", "vs": [[11, "«سأجعل أورشليم رجمة خراب، ومأوى لبنات آوى، وأحول مدن يهوذا إلى قفر مهجور»."]]}], "kwAr": "إذ", "noteAr": ""}, {"kw": "the fire", "raw": "Zep_3:8; Deu_32:21-25; 1Ki_14:22; Psa_78:58, Psa_79:5; Eze_8:3-5, Eze_16:38; Eze_36:5, Eze_36:6; 1Co_10:22", "note": "", "refs": [{"l": "Zep 3:8", "n": "", "vs": [[8, "لذلك يقول الرب: انتظروني لأني عزمت في اليوم الذي أقوم فيه كشاهد أن أجمع الأمم وأحشد الممالك لأسكب عليهم سخطي واحتدام غضبي، لأن الأرض بكاملها ستؤكل بنار غيرة غيظي."]]}, {"l": "Deu 32:21-25", "n": "", "vs": [[21, "هيجوا غيرتي بعبادة أوثانهم، وأسخطوني بأصنامهم الباطلة. لذلك سأثير غيرتهم بشعب متوحش، وأغيظهم بأمة حمقاء."], [22, "فها قد أضرم غضبي نارا تحرق حتى الهاوية السفلى، وتأكل الأرض وغلاتها، وتشعل أسس الجبال."], [23, "أكوم عليهم شرورا وأنفذ سهامي فيهم."], [24, "وحين يكونون خائرين من الجوع، منهوكين من الحمى والداء السام، أجعل أنياب الوحوش مع سم زواحف الأرض تنشب فيهم."], [25, "يثكلهم سيف العدو في الطريق، ويستولي عليهم الرعب داخل الخدور، فيهلك الفتى مع الفتاة، والرضيع مع الشيخ."]]}, {"l": "1Ki 14:22", "n": "", "vs": [[22, "وارتكب شعب يهوذا الشر في عيني الرب، فاستثاروا غيظه كما لم تستثره خطايا آبائهم التي ارتكبوها."]]}, {"l": "Psa 78:58", "n": "", "vs": [[58, "وأغاظوه بمعابد مرتفعاتهم وأثاروا غيرته بأصنامهم."]]}, {"l": "Psa 79:5", "n": "", "vs": [[5, "إلى متى يدوم هذا يارب؟ أتبقى غاضبا تتقد غيرتك كالنار إلى الأبد؟"]]}, {"l": "Eze 8:3-5", "n": "", "vs": [[3, "ثم مد شبه يد وقبض علي بناصية رأسي، وحلق بي روح بين الأرض والسماء وأحضرني في رؤى الله إلى أورشليم، إلى مدخل البوابة الشمالية للساحة الداخلية، حيث ينتصب التمثال المثير للغيرة."], [4, "فإذا بمجد إله إسرائيل حال هناك كما كان حالا في الرؤيا التي شاهدتها في السهل."], [5, "ثم خاطبني: «ياابن آدم، التفت الآن نحو الشمال». فالتفت وإذا بي أرى من شمالي باب المذبح تمثال الغيرة هذا منتصبا في المدخل."]]}, {"l": "Eze 16:38", "n": "", "vs": [[38, "وأدينك كما تدان الزانيات وسافكات الدماء، وأوقع بك عقاب دم سخطي وغيرتي،"]]}, {"l": "Eze 36:5", "n": "", "vs": [[5, "ها أنا في أثناء احتدام نار غيرتي أصدرت قضائي على بقية الأمم وعلى أدوم قاطبة، الذين اغتصبوا أرضي ميراثا لهم، بقلوب مغتبطة ونفوس حاقدة لتكون لهم نهبا وغنيمة."]]}, {"l": "Eze 36:6", "n": "", "vs": [[6, "لذلك تنبأ عن أرض إسرائيل وقل للجبال والتلال والأودية: هذا ما يعلنه السيد الرب: ها أنا في غيرتي وسخطي قد أصدرت قضائي لأنكم قد تحملتم تعيير الأمم،"]]}, {"l": "1Co 10:22", "n": "", "vs": [[22, "أم نحاول إثارة غيرة الرب؟ أو نحن أقوى منه؟"]]}], "kwAr": "بنار غيرته", "noteAr": ""}, {"kw": "he shall", "raw": "Zep_1:2, Zep_1:3; Isa_1:24", "note": "", "refs": [{"l": "Zep 1:2", "n": "", "vs": [[2, "يقول الرب: «سأمحو محوا كل شيء عن وجه الأرض."]]}, {"l": "Zep 1:3", "n": "", "vs": [[3, "أبيد الإنسان والحيوان وطيور السماء وسمك البحر، وأقضي على الأشرار ومعاثرهم، وأستأصل البشر عن وجه الأرض، يقول الرب."]]}, {"l": "Isa 1:24", "n": "", "vs": [[24, "لذلك يقول السيد رب الجنود، عزيز إسرائيل: «لأستريحن من مقاومي ولأنتقمن من أعدائي."]]}], "kwAr": "يضع نهاية", "noteAr": ""}], "arS": [["لا", ["H3808", "H1571"]], [" ", []], ["ينقذهم", ["H3201", "H5337"]], [" ", []], ["ذهبهم", ["H2091"]], [" ", []], ["ولا", ["H1571"]], [" ", []], ["فضتهم", ["H3701"]], [" في ", []], ["يوم", ["H3117"]], [" ", []], ["غضب", ["H5678"]], [" ", []], ["الرب", ["H3068"]], ["، ", []], ["إذ", ["H3588"]], [" ", []], ["بنار", ["H784"]], [" ", []], ["غيرته", ["H7068"]], [" ", []], ["تلتهم", ["H398"]], [" ", []], ["كل", ["H3605"]], [" ", []], ["الأرض", ["H776"]], ["، وفيه ", []], ["يضع", ["H6213"]], [" نهاية ", []], ["مباغتة", ["H389"]], [" ", []], ["كاملة", ["H3617"]], [" ", []], ["سريعة", ["H926"]], [" ", []], ["لكل", ["H3605"]], [" ", []], ["سكان", ["H3427"]], [" ", []], ["المعمورة", ["H776"]], ["».", []]]}, {"c": 2, "v": 1, "text": "«اجتمعي، احتشدي أيتها الأمة الوقحة.", "groups": [{"kw": "gather together", "raw": "2Ch_20:4; Neh_8:1, Neh_9:1; Est_4:16; Joe_1:14, Joe_2:12-18; Mat_18:20", "note": "", "refs": [{"l": "2Ch 20:4", "n": "", "vs": [[4, "فاحتشد بنو يهوذا قادمين من كل مدن يهوذا ليطلبوا عون الرب."]]}, {"l": "Neh 8:1", "n": "", "vs": [[1, "ثم اجتمع بنو إسرائيل كرجل واحد في الساحة الواقعة أمام بوابة الماء، وطلبوا من عزرا الكاتب أن يأتي بسفر شريعة موسى التي أمر بها الرب إسرائيل."]]}, {"l": "Neh 9:1", "n": "", "vs": [[1, "وفي اليوم الرابع والعشرين من الشهر ذاته، اجتمع بنو إسرائيل صائمين ومرتدين المسوح ومعفري الرؤوس بالتراب."]]}, {"l": "Est 4:16", "n": "", "vs": [[16, "«امض اجمع كل اليهود المقيمين في شوشن، وصوموا من أجلي ولا تأكلوا ولا تشربوا ثلاثة أيام ليلا ونهارا، وسأصوم أنا ووصيفاتي أيضا مثلكم. ثم أدخل إلى الملك مخالفة العرف المتبع، فإذا هلكت، هلكت»."]]}, {"l": "Joe 1:14", "n": "", "vs": [[14, "خصصوا صوما. نادوا بالاعتكاف. ادعوا الشيوخ وجميع سكان الأرض للاجتماع في هيكل الرب إلهكم وتضرعوا إليه."]]}, {"l": "Joe 2:12-18", "n": "", "vs": [[12, "والآن، يقول الرب: ارجعوا إلي من كل قلوبكم بصوم وبكاء ونوح."], [13, "مزقوا قلوبكم لا ثيابكم. ارجعوا إلى الرب إلهكم لأنه رؤوف ورحيم بطيء الغضب وكثير الرأفة، ولا يسر بالعقاب."], [14, "لعله يرجع ويكف عن العقاب مخلفا وراءه بركة: تقدمة دقيق وتقدمة سكيب لتقربوهما للرب إلهكم."], [15, "انفخوا بالبوق في صهيون، وقدسوا صوما، ونادوا لمحفل مقدس."], [16, "اجمعوا الشعب، قدسوا الجماعة، احشدوا الشيوخ والأولاد والرضع. ليغادر العريس مخدعه والعروس حجرتها."], [17, "ليبك الكهنة خدام الرب بين الرواق والمذبح قائلين: «اعف عن شعبك يارب ولا تجعل ميراثك مثار احتقار وهزء بين الأمم، فيقولوا بين الشعوب: أين إلههم؟»"], [18, "عندئذ يغار الرب على أرضه ويرق لشعبه."]]}, {"l": "Mat 18:20", "n": "", "vs": [[20, "فإنه حيثما اجتمع اثنان أو ثلاثة باسمي، فأنا أكون في وسطهم»."]]}], "kwAr": "اجتمعي، احتشدي", "noteAr": ""}, {"kw": "O nation", "raw": "Isa_1:4-6, Isa_1:10-15; Jer_12:7-9; Zec_11:8", "note": "", "refs": [{"l": "Isa 1:4-6", "n": "", "vs": [[4, "ويل للأمة الخاطئة، الشعب المثقل بالإثم، ذرية مرتكبي الشر، أبناء الفساد. لقد تركوا الرب واستهانوا بقدوس إسرائيل وداروا على أعقابهم."], [5, "على أي موضع أضربكم بعد؟ لماذا تواظبون على التمرد؟ إن الرأس بجملته سقيم والقلب بكامله مريض."], [6, "من أخمص القدم إلى قمة الرأس ليس فيه عافية. كله جروح وأحباط وقروح لم تنظف، ولم تضمد، ولم تلين بالزيت."]]}, {"l": "Isa 1:10-15", "n": "", "vs": [[10, "اسمعوا كلمة الرب ياحكام سدوم. أصغوا إلى شريعة إلهنا ياأهل عمورة:"], [11, "ماذا تجديني كثرة ذبائحكم، يقول الرب؟ اتخمت من محرقات كباش وشحم المسمنات، ولا أسر بدم عجول وخرفان وتيوس."], [12, "حين جئتم لتمثلوا أمامي، من طلب منكم أن تدوسوا دوري؟"], [13, "كفوا عن تقديم قرابين باطلة، فالبخور رجس لي، وكذلك رأس الشهر والسبت والدعاء إلى المحفل، فأنا لا أطيق الاعتكاف مع ارتكاب الإثم."], [14, "لشد ما تبغض نفسي احتفالات رؤوس شهوركم ومواسم أعيادكم! صارت علي عبئا، وسئمت حملها."], [15, "عندما تبسطون نحوي أيديكم أحجب وجهي عنكم، وإن أكثرتم الصلاة لا أستجيب، لأن أيديكم مملوءة دما."]]}, {"l": "Jer 12:7-9", "n": "", "vs": [[7, "قد نبذت هيكلي وهجرت ميراثي، وسلمت حبيبة نفسي إلى أيدي أعدائها."], [8, "قد زمجر علي شعبي كأسد في غابة. رفع علي صوته، لهذا مقته."], [9, "هل صار شعبي لي كطير جارح منقض؟ وهل تألبت عليه الجوارح من كل جهة؟ هلم احشد جميع وحوش البر، وادعها للأكل."]]}, {"l": "Zec 11:8", "n": "", "vs": [[8, "وفي غضون شهر واحد أفنيت الرعاة الثلاثة. ولكن صبري نفد على الأغنام، كما أضمروا هم أيضا لي الكراهية."]]}], "kwAr": "أيتها الأمة", "noteAr": ""}, {"kw": "desired", "raw": "or, desirous, Isa_26:8, Isa_26:9", "note": "or, desirous, Isa_26:8, Isa_26:9", "refs": [{"l": "Isa 26:8", "n": "", "vs": [[8, "انتظرناك يارب بشوق في طريق أحكامك. تتوق النفس إلى اسمك وتشتهي ذكرك."]]}, {"l": "Isa 26:9", "n": "", "vs": [[9, "تتوق إليك نفسي في الليل، وفي الصباح تشتاق إليك روحي. عندما تسود أحكامك في الأرض يتعلم أهلها العدل."]]}], "kwAr": "الوقحة", "noteAr": "أو: «مشتهية». انظر إش 26: 8، 9"}], "arS": [["«", []], ["اجتمعي", ["H7197"]], ["، ", []], ["احتشدي", ["H7197"]], [" أيتها ", []], ["الأمة", ["H1471"]], [" ", []], ["الوقحة", ["H3808", "H3700"]], [".", []]]}, {"c": 2, "v": 2, "text": "قبل أن يحين القضاء، فيطوح بك كالعصافة أمام الريح، قبل أن يحل بك غضب الرب الماحق، قبل أن ينصب عليك سخط الرب.", "groups": [{"kw": "the decree", "raw": "Zep_3:8; 2Ki_22:16, 2Ki_22:17, 2Ki_23:26, 2Ki_23:27; Eze_12:25; Mat_24:35; 2Pe_3:4-10", "note": "", "refs": [{"l": "Zep 3:8", "n": "", "vs": [[8, "لذلك يقول الرب: انتظروني لأني عزمت في اليوم الذي أقوم فيه كشاهد أن أجمع الأمم وأحشد الممالك لأسكب عليهم سخطي واحتدام غضبي، لأن الأرض بكاملها ستؤكل بنار غيرة غيظي."]]}, {"l": "2Ki 22:16", "n": "", "vs": [[16, "هكذا يقول الرب: ها أنا أجلب على هذا الموضع وعلى أهله كل الوعيد الوارد في السفر الذي قرأه ملك يهوذا،"]]}, {"l": "2Ki 22:17", "n": "", "vs": [[17, "لأنهم نبذوني وأوقدوا لآلهة أخرى، ليثيروا سخطي بما تجنيه أيديهم من آثام، فاحتدم غضبي الذي لا ينطفيء على هذا الموضع."]]}, {"l": "2Ki 23:26", "n": "", "vs": [[26, "غير أن الرب لم يرجع عن شدة غضبه، لأن غضبه احتدم على يهوذا لفرط ما أثار منسى من سخطه."]]}, {"l": "2Ki 23:27", "n": "", "vs": [[27, "فقال الرب: «سأستأصل يهوذا من أمامي كما استأصلت إسرائيل، وأتنكر لأورشليم، المدينة التي اخترتها، وللهيكل الذي قلت يكون اسمي فيه»."]]}, {"l": "Eze 12:25", "n": "", "vs": [[25, "لأني أنا الرب أتكلم، والكلمة التي أقضي بها تتم، من غير مماطلة، بل ها أنا أنطق بقضائي في أيامكم أيها الشعب المتمرد وأنفذه في حينه، يقول السيد الرب»."]]}, {"l": "Mat 24:35", "n": "", "vs": [[35, "إن السماء والأرض تزولان؛ ولكن كلامي لا يزول أبدا."]]}, {"l": "2Pe 3:4-10", "n": "", "vs": [[4, "وسيقولون: «أين هو الوعد برجوع المسيح؟ فمنذ أن مات آباؤنا الأولون، بل منذ بدء الخليقة، مازال كل شيء على حاله!»"], [5, "إنهم يتناسون، عمدا، أنه بكلمة أمر من الله وجدت السماوات منذ القديم وتكونت الأرض من الماء وبالماء."], [6, "وبكلمة منه أيضا، دمر العالم الذي كان موجودا في ذلك الزمان، إذ فاض الماء عليه."], [7, "أما السماوات والأرض الحالية، فستبقى مخزونة ومحفوظة للنار بتلك الكلمة عينها إلى يوم الدينونة وهلاك الفاجرين!"], [8, "ولكن، أيها الأحباء، عليكم ألا تنسوا هذه الحقيقة: أن يوما واحدا في نظر الرب هو كألف سنة، وألف سنة كيوم واحد."], [9, "فالرب، إذن، لا يبطيء في إتمام وعده، كما يظن بعض الناس، ولكنه يتأنى عليكم، فهو لا يريد لأحد من الناس أن يهلك، بل يريد لجميع الناس أن يرجعوا إليه تائبين."], [10, "إلا أن «يوم الرب» سيأتي كما يأتي اللص في الليل. في ذلك اليوم، تزول السماوات محدثة دويا هائلا وتنحل العناصر محترقة بنار شديدة، وتحترق الأرض وما فيها من منجزات."]]}], "kwAr": "قبل أن يحين القضاء", "noteAr": ""}, {"kw": "as", "raw": "Job_21:18; Psa_1:4; Isa_17:13, Isa_41:15, Isa_41:16; Hos_13:3", "note": "", "refs": [{"l": "Job 21:18", "n": "", "vs": [[18, "يصبحون كالتبن في وجه الريح، وكالعصافة التي تطوح بها الزوبعة."]]}, {"l": "Psa 1:4", "n": "", "vs": [[4, "ليس كذلك حال الأشرار، بل إنهم مثل ذرات التبن التي تبددها الريح."]]}, {"l": "Isa 17:13", "n": "", "vs": [[13, "أمم تهدر كهدير المياه، ولكن حالما يزجرها الرب تهرب بعيدا، وتتطاير كما تتطاير عصافة الجبال أمام الريح، أو كالهباء أمام العاصفة."]]}, {"l": "Isa 41:15", "n": "", "vs": [[15, "وها أنا أجعلك نورجا محددا جديدا مسننا، فتدرس الجبال وتجعل التلال كالعصافة،"]]}, {"l": "Isa 41:16", "n": "", "vs": [[16, "فتذريها، وتحملها الريح بعيدا، وتبددها الزوبعة. أما أنت فتبتهج بالرب وتمجد قدوس إسرائيل."]]}, {"l": "Hos 13:3", "n": "", "vs": [[3, "لهذا يتلاشون كضباب الصباح وكالندى الذي يتبخر سريعا، أو كعصافة مذراة من البيدر، أو دخان متسرب من الكوة."]]}], "kwAr": "كالعصافة", "noteAr": ""}, {"kw": "before the fierce", "raw": "Zep_1:18; 2Ch_36:16, 2Ch_36:17; Psa_2:12, Psa_50:22; Jer_23:20; Lam_4:11; Nah_1:6; Mal_4:1, Mal_4:2; Luk_13:24-28", "note": "", "refs": [{"l": "Zep 1:18", "n": "", "vs": [[18, "لا ينقذهم ذهبهم ولا فضتهم في يوم غضب الرب، إذ بنار غيرته تلتهم كل الأرض، وفيه يضع نهاية مباغتة كاملة سريعة لكل سكان المعمورة»."]]}, {"l": "2Ch 36:16", "n": "", "vs": [[16, "فكانوا يهزأون برسل الله، ورفضوا كلامه، واستهانوا بأنبيائه، حتى ثار غضب الرب على شعبه وامتنع كل شفاء!"]]}, {"l": "2Ch 36:17", "n": "", "vs": [[17, "فأرسل إليهم ملك الكلدانيين، فقتل نخبتهم بالسيف في عقر الهيكل المقدس. ولم يرحم الرب فتى أو عذراء أو شيخا أو أشيب، بل أسلمهم جميعا ليد الكلدانيين،"]]}, {"l": "Psa 2:12", "n": "", "vs": [[12, "قبلوا الابن لئلا يغضب، فتهلكوا في الطريق، لئلا يتوهج غضبه سريعا. طوبى لجميع المتكلين عليه."]]}, {"l": "Psa 50:22", "n": "", "vs": [[22, "والآن تنبهوا أيها الناسون الله ، لئلا أمزقكم وليس من ينقذكم."]]}, {"l": "Jer 23:20", "n": "", "vs": [[20, "فغضب الرب لن يرتد حتى ينجز مقاصد قلبه التي ستدركونها بوضوح في آخر الأيام."]]}, {"l": "Lam 4:11", "n": "", "vs": [[11, "نفث الرب كامل سخطه وصب حمو غضبه، وأضرم نارا في صهيون فالتهمت أسسها."]]}, {"l": "Nah 1:6", "n": "", "vs": [[6, "من يصمد أمام سخطه؟ من يتحمل فرط اضطرام غضبه؟ ينصب غضبه كالنار وتنحل تحت وطأته الصخور."]]}, {"l": "Mal 4:1", "n": "", "vs": [[1, "«انظروا، ها يوم القضاء مقبل، لاهب كتنور يكون فيه جميع المستكبرين وفاعلي الإثم عصافة، فيحرقهم ذلك اليوم ولا يبقي لهم أصلا ولا فرعا، يقول الرب القدير."]]}, {"l": "Mal 4:2", "n": "", "vs": [[2, "أما أنتم أيها المتقون اسمي فتشرق عليكم شمس البر حاملة في أجنحتها الشفاء فتنطلقون متواثبين كعجول المعلف،"]]}, {"l": "Luk 13:24-28", "n": "", "vs": [[24, "«ابذلوا الجهد للدخول من الباب الضيق، فإني أقول لكم إن كثيرين سيسعون إلى الدخول، فلا يتمكنون."], [25, "فمن بعد ما يكون رب البيت قد قام وأغلق الباب، وتبدأون بالوقوف خارجا تقرعون الباب قائلين: يارب افتح لنا! فيجيبكم قائلا: لا أعرف من أين أنتم!"], [26, "عندئذ تبدأون تقولون: أكلنا وشربنا بحضورك، وعلمت في شوارعنا!"], [27, "وسوف يقول: أقول لكم، لا أعرف من أين أنتم؛ اغربوا من أمامي ياجميع فاعلي الإثم!"], [28, "هناك سيكون البكاء وصرير الأسنان، عندما ترون إبراهيم وإسحاق ويعقوب وجميع الأنبياء في ملكوت الله وأنتم مطروحون خارجا."]]}], "kwAr": "قبل أن يحل بك غضب الرب الماحق", "noteAr": ""}, {"kw": "before the day of", "raw": "Psa_95:7, Psa_95:8", "note": "", "refs": [{"l": "Psa 95:7", "n": "", "vs": [[7, "فإنه هو إلهنا، ونحن رعيته وقطيعه الذي يقوده بيده. اليوم إن سمعتم صوته،"]]}, {"l": "Psa 95:8", "n": "", "vs": [[8, "فلا تقسوا قلوبكم، كما حدث في يوم مسة (أي الامتحان) في الصحراء،"]]}], "kwAr": "قبل أن ينصب عليك سخط الرب", "noteAr": ""}], "arS": [["قبل", ["H2962"]], [" أن ", []], ["يحين", ["H3205"]], [" ", []], ["القضاء", ["H2706"]], ["، ", []], ["فيطوح", ["H5674"]], [" بك ", []], ["كالعصافة", ["H4671"]], [" أمام الريح، ", []], ["قبل", ["H2962"]], [" أن ", []], ["يحل", ["H935"]], [" ", []], ["بك", ["H5921"]], [" ", []], ["غضب", ["H639"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["الماحق", ["H2740"]], ["، ", []], ["قبل", ["H2962"]], [" أن ", []], ["ينصب", ["H935"]], [" ", []], ["عليك", ["H5921"]], [" ", []], ["سخط", ["H639"]], [" ", []], ["الرب", ["H3068"]], [".", []]]}, {"c": 2, "v": 3, "text": "التمسوا الرب ياودعاء الأرض الراضخين لحكمه. اطلبوا البر والتواضع لعلكم تجدون ملاذا في يوم سخط الرب.", "groups": [{"kw": "Seek ye", "raw": "Psa_105:4; Isa_55:6, Isa_55:7; Jer_3:13, Jer_3:14, Jer_4:1, Jer_4:2, Jer_29:12, Jer_29:13; Hos_7:10, Hos_10:12; Amo_5:4-6, Amo_5:14, Amo_5:15; Mat_7:7, Mat_7:8", "note": "", "refs": [{"l": "Psa 105:4", "n": "", "vs": [[4, "اطلبوا الرب وقوته، التمسوا وجهه دائما."]]}, {"l": "Isa 55:6", "n": "", "vs": [[6, "اطلبوا الرب مادام موجودا، ادعوه وهو قريب."]]}, {"l": "Isa 55:7", "n": "", "vs": [[7, "ليترك الشرير طريقه والأثيم أفكاره، وليتب إلى الرب فيرحمه، وليرجع إلى إلهنا لأنه يكثر الغفران."]]}, {"l": "Jer 3:13", "n": "", "vs": [[13, "إنما اعترفي بإثمك وأقري أنك قد تمردت على الرب إلهك، وأغدقت غرامك على الغرباء تحت كل شجرة خضراء، وأنك أبيت طاعة صوتي."]]}, {"l": "Jer 3:14", "n": "", "vs": [[14, "فارجعوا أيها الأبناء الغادرون، لأني أنا سيدكم، فآخذكم واحدا من المدينة واثنين من العشيرة وآتي بكم إلى صهيون،"]]}, {"l": "Jer 4:1", "n": "", "vs": [[1, "ويقول الرب: «إن رجعت إلي ياشعب إسرائيل، وأزلت أصنامك المقيتة من أمامي، وكففت عن الضلال،"]]}, {"l": "Jer 4:2", "n": "", "vs": [[2, "وإن حلفت بالحق والعدل والبر قائلا: حي هو الرب، عندئذ تتبارك به الأمم، وتفتخر."]]}, {"l": "Jer 29:12", "n": "", "vs": [[12, "فتدعونني وتقبلون، وتصلون إلي فأستجيب لكم،"]]}, {"l": "Jer 29:13", "n": "", "vs": [[13, "وتلتمسونني فتجدونني إذ تطلبونني بكل قلوبكم."]]}, {"l": "Hos 7:10", "n": "", "vs": [[10, "يشهد غرور إسرائيل عليه ولم يرجع إلى الرب إلهه، ولا التمسه."]]}, {"l": "Hos 10:12", "n": "", "vs": [[12, "ازرعوا لأنفسكم بذار البر، فتحصدوا بمقتضاه ثمار الرحمة، احرثوا لكم حرثا لأن هذا أوان التماس الرب، حتى يأتي ويمطر عليكم غيوث صلاحه."]]}, {"l": "Amo 5:4-6", "n": "", "vs": [[4, "لأن هذا ما يقوله الرب لبيت إسرائيل: التمسوني فتحيوا."], [5, "لا تسعوا وراء بيت إيل، ولا تدخلوا الجلجال، ولا تعبروا إلى بئر سبع، لأن أهل الجلجال لابد أن يتم سبيهم، وبيت إيل تصبح عدما."], [6, "التمسوا الرب فتحيوا لئلا يندلع كنار تحرق بيت يوسف وتلتهم بيت إيل، وليس من يطفيء."]]}, {"l": "Amo 5:14", "n": "", "vs": [[14, "اطلبوا الخير لا الشر لتحيوا، فيكون الرب الإله القدير معكم كما تقولون."]]}, {"l": "Amo 5:15", "n": "", "vs": [[15, "امقتوا الشر وأحبوا الخير وأقيموا العدل في ساحة القضاء، لعل الرب الإله القدير يترفق على بقية بيت يوسف."]]}, {"l": "Mat 7:7", "n": "", "vs": [[7, "اسألوا، تعطوا. اطلبوا، تجدوا. اقرعوا، يفتح لكم."]]}, {"l": "Mat 7:8", "n": "", "vs": [[8, "فكل من يسأل، ينل؛ ومن يطلب، يجد؛ ومن يقرع، يفتح له."]]}], "kwAr": "التمسوا الرب", "noteAr": ""}, {"kw": "all", "raw": "2Ch_34:27, 2Ch_34:28; Psa_22:26, Psa_25:8, Psa_25:9, Psa_76:9, Psa_149:4; Isa_61:1; Jer_22:15, Jer_22:16; Zec_8:19; Mat_5:5; Jam_1:21, Jam_1:22; 1Pe_3:4", "note": "", "refs": [{"l": "2Ch 34:27", "n": "", "vs": [[27, "من حيث أن قلبك قد رق، وتذللت أمام الله لدى سماعك ما قضت به الشريعة على هذا الموضع وعلى أهله، وتواضعت أمامي ومزقت ثيابك وبكيت في حضرتي، فإنني قد استجبت لك أنا أيضا، يقول الرب."]]}, {"l": "2Ch 34:28", "n": "", "vs": [[28, "لذلك ها أنا أتوفاك فتدفن في قبرك بسلام، ولا تشهد عيناك ما سأنزل بهذا الموضع وأهله من شر». فحمل الرجال ردها إلى الملك."]]}, {"l": "Psa 22:26", "n": "", "vs": [[26, "يأكل الودعاء ويشبعون، وطالبو الرب يسبحونه. تحيا قلوبكم إلى الأبد."]]}, {"l": "Psa 25:8", "n": "", "vs": [[8, "الرب صالح ومستقيم لذلك يهدي الضالين الطريق."]]}, {"l": "Psa 25:9", "n": "", "vs": [[9, "يدرب الودعاء في سبل الحق ويعلمهم طريقه."]]}, {"l": "Psa 76:9", "n": "", "vs": [[9, "كان ذلك عندما قمت للقضاء لتخلص ودعاء الأرض كلهم."]]}, {"l": "Psa 149:4", "n": "", "vs": [[4, "لأن الرب يسر بشعبه، يجمل الودعاء بالخلاص."]]}, {"l": "Isa 61:1", "n": "", "vs": [[1, "روح السيد الرب علي، لأن الرب مسحني لأبشر المساكين، أرسلني لأضمد جراح المنكسري القلوب، لأنادي للمسبيين بالعتق وللمأسورين بالحرية،"]]}, {"l": "Jer 22:15", "n": "", "vs": [[15, "أتظن أنك صرت ملكا لأنك بنيت بيتك من الأرز؟ أما أكل أبوك وشرب وأجرى عدلا وحقا، فتمتع بالخيرات؟"]]}, {"l": "Jer 22:16", "n": "", "vs": [[16, "قد قضى بالعدل للبائس والمسكين فأحرز خيرا. أليست هذه هي معرفتي؟» يقول الرب"]]}, {"l": "Zec 8:19", "n": "", "vs": [[19, "«هذا ما يقوله الرب القدير: إن أصوامكم في الشهور الرابع والخامس والسابع والعاشر ستكون مواسم ابتهاج وفرح وأعياد سعيدة يتمتع بها شعب يهوذا، لهذا أحبوا الحق والسلام."]]}, {"l": "Mat 5:5", "n": "", "vs": [[5, "طوبى للودعاء، فإنهم سيرثون الأرض."]]}, {"l": "Jam 1:21", "n": "", "vs": [[21, "إذن، تخلصوا من كل ما في حياتكم من نجاسة وشر متزايد. وليكن قبولكم لتلك الكلمة التي غرسها الله في قلوبكم، قبولا وديعا. فهي القادرة أن تخلص نفوسكم."]]}, {"l": "Jam 1:22", "n": "", "vs": [[22, "لا تكتفوا فقط بسماعها، بل اعملوا بها، وإلا كنتم تغشون أنفسكم."]]}, {"l": "1Pe 3:4", "n": "", "vs": [[4, "وإنما لتعتمد الزينة الداخلية، ليكون قلبها متزينا بروح الوداعة والهدوء. هذه هي الزينة التي لا تفنى، وهي غالية الثمن في نظر الله!"]]}], "kwAr": "ياودعاء الأرض", "noteAr": ""}, {"kw": "seek righteousness", "raw": "Phi_3:13, Phi_3:14; 1Th_4:1, 1Th_4:10; 1Pe_1:22; 2Pe_3:18", "note": "", "refs": [{"l": "Phi 3:13", "n": "", "vs": [[13, "أيها الإخوة، أنا لا أعتبر نفسي قد نلت الجائزة، ولكني أفعل أمرا واحدا: أنسى ما هو وراء وأتقدم إلى ما هو أمام،"]]}, {"l": "Phi 3:14", "n": "", "vs": [[14, "إذ أسعى إلى الهدف، لنوال تلك الجائزة التي يدعونا الله إليها دعوة عليا في المسيح يسوع."]]}, {"l": "1Th 4:1", "n": "", "vs": [[1, "وبعد، أيها الإخوة، فمثلما تلقيتم منا كيف يجب أن تسلكوا سلوكا يرضي الله ، وكما أنتم فاعلون، نرجو منكم ونحرضكم في الرب يسوع أن تضاعفوا تقدمكم في ذلك أكثر فأكثر."]]}, {"l": "1Th 4:10", "n": "", "vs": [[10, "ولأنكم أيضا هكذا تعاملون جميع الإخوة في مقاطعة مقدونية كلها. وإنما نحرضكم، أيها الإخوة، أن تضاعفوا ذلك أكثر فأكثر،"]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}], "kwAr": "اطلبوا البر والتواضع", "noteAr": ""}, {"kw": "it may", "raw": "2Sa_12:22; Joe_2:13, Joe_2:14; Amo_5:15; Jon_3:9", "note": "", "refs": [{"l": "2Sa 12:22", "n": "", "vs": [[22, "فأجاب: «حين كان الطفل حيا صمت وبكيت لأني حدثت نفسي: من يعلم؟ ربما يرحمني الرب ويحيا الولد."]]}, {"l": "Joe 2:13", "n": "", "vs": [[13, "مزقوا قلوبكم لا ثيابكم. ارجعوا إلى الرب إلهكم لأنه رؤوف ورحيم بطيء الغضب وكثير الرأفة، ولا يسر بالعقاب."]]}, {"l": "Joe 2:14", "n": "", "vs": [[14, "لعله يرجع ويكف عن العقاب مخلفا وراءه بركة: تقدمة دقيق وتقدمة سكيب لتقربوهما للرب إلهكم."]]}, {"l": "Amo 5:15", "n": "", "vs": [[15, "امقتوا الشر وأحبوا الخير وأقيموا العدل في ساحة القضاء، لعل الرب الإله القدير يترفق على بقية بيت يوسف."]]}, {"l": "Jon 3:9", "n": "", "vs": [[9, "لعل الرب يرجع فيعدل عن احتدام سخطه فلا نهلك»."]]}], "kwAr": "لعلكم", "noteAr": ""}, {"kw": "hid", "raw": "Gen_7:15, Gen_7:16; Exo_12:27; Psa_31:20, Psa_32:6, Psa_32:7, Psa_57:1, Psa_91:1; Pro_18:10; Isa_26:20,Isa_26:21; Jer_39:18, Jer_45:5; Col_3:2-4", "note": "", "refs": [{"l": "Gen 7:15", "n": "", "vs": [[15, "من جميع المخلوقات الحية أقبلت إلى الفلك، ودخلت مع نوح زوجين زوجين"]]}, {"l": "Gen 7:16", "n": "", "vs": [[16, "ذكرا وأنثى دخلت، من كل ذي جسد، كما أمره الله. ثم أغلق الرب عليه باب الفلك."]]}, {"l": "Exo 12:27", "n": "", "vs": [[27, "تجيبونهم آنئذ: إنها ذبيحة فصح للرب الذي عبر عن بيوت بني إسرائيل في مصر عندما أهلك المصريين، وأنقذ بيوتنا». فحنى الشعب رؤوسهم ساجدين."]]}, {"l": "Psa 31:20", "n": "", "vs": [[20, "فإنك تصونهم في خباء حضرتك، في مأمن من مؤامرات الناس. في خيمة واقية تحرسهم من لدغات ألسن خصومهم."]]}, {"l": "Psa 32:6", "n": "", "vs": [[6, "لهذا ليعترف لك كل تقي بخطاياه وقتما يجدك فلاَ تبلغ إليه سيول التجارب الطامية."]]}, {"l": "Psa 32:7", "n": "", "vs": [[7, "أنت ستر لي، في الضيق تحرسني. بترانيم بهجة النجاة تطوقني."]]}, {"l": "Psa 57:1", "n": "", "vs": [[1, "ارحمني ياالله ارحمني، لأن بك لاذت نفسي، وبظل جناحيك أحتمي إلى أن تعبر المصائب."]]}, {"l": "Psa 91:1", "n": "", "vs": [[1, "المحتمي بقدس أقداس العلي، في ظل القدير يبيت،"]]}, {"l": "Pro 18:10", "n": "", "vs": [[10, "اسم الرب برج منيع يهرع إليه الصديق وينجو من الخطر."]]}, {"l": "Isa 26:20", "n": "", "vs": [[20, "تعالوا يا شعبي وادخلوا إلى مخادعكم، وأوصدوا أبوابكم خلفكم. تواروا قليلا حتى يعبر السخط."]]}, {"l": "Isa 26:21", "n": "", "vs": [[21, "وانظروا فإن الرب خارج من مكانه ليعاقب سكان الأرض على آثامهم، فتكشف الأرض عما سفك عليها من دماء ولا تغطي قتلاها فيما بعد."]]}, {"l": "Jer 39:18", "n": "", "vs": [[18, "إنما أنجيك فلا تسقط بالسيف، بل تسلم بحياتك، فتكون لك غنيمة، لأنك اتكلت علي، يقول الرب»."]]}, {"l": "Jer 45:5", "n": "", "vs": [[5, "وأنت، هل تلتمس لنفسك عظائم الأمور؟ لا تلتمس، فها أنا جالب بلاء على كل بشر يقول الرب. أما أنت فأهب لك النجاة، فتكون لك نفسك غنيمة في جميع الأماكن التي تذهب إليها»."]]}, {"l": "Col 3:2-4", "n": "", "vs": [[2, "احصروا اهتمامكم بالأمور التي في العلى، لا بالأمور الأرضية."], [3, "فإنكم قد متم، وحياتكم مستورة مع المسيح في الله."], [4, "فعندما يظهر المسيح، وهو حياتنا، عندئذ تظهرون أنتم أيضا معه في المجد."]]}], "kwAr": "تجدون ملاذا", "noteAr": ""}], "arS": [["التمسوا", ["H1245"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["ياودعاء", ["H6035"]], [" ", []], ["الأرض", ["H776"]], [" ", []], ["الراضخين", ["H6466"]], [" ", []], ["لحكمه", ["H4941"]], [". ", []], ["اطلبوا", ["H1245"]], [" ", []], ["البر", ["H6664"]], [" ", []], ["والتواضع", ["H6038"]], [" ", []], ["لعلكم", ["H194"]], [" ", []], ["تجدون", ["H5641"]], [" ملاذا في ", []], ["يوم", ["H3117"]], [" ", []], ["سخط", ["H639"]], [" ", []], ["الرب", ["H3068"]], [".", []]]}, {"c": 2, "v": 4, "text": "فإن غزة تصبح مهجورة، وأشقلون موحشة، وأهل أشدود يطردون عند الظهيرة، وعقرون تستأصل.", "groups": [{"kw": "Gaza", "raw": "Jer_25:20, Jer_47:1-7; Eze_25:15-17; Amo_1:6-8; Zec_9:5-7", "note": "", "refs": [{"l": "Jer 25:20", "n": "", "vs": [[20, "وكل الغرباء المقيمين في وسطهم، وجميع ملوك أرض عوص، وسائر ملوك الفلسطينيين: ملوك أشقلون، وغزة، وعقرون وبقية أشدود،"]]}, {"l": "Jer 47:1-7", "n": "", "vs": [[1, "هذه هي النبوءة التي أوحى بها الرب إلى إرميا عن الفلسطينيين قبل أن يهاجم فرعون غزة."], [2, "هذا ما يعلنه الرب: «ها هي مياه تطغى من الشمال، فتصبح سيلا جارفا، فتغمر الأرض ومن عليها، المدينة والساكنين فيها. فيستغيث الناس ويولول كل أهل البلاد،"], [3, "من صوت وقع حوافر خيله، ومن جلبة مركباته، ومن صرير عجلاتها، فلا يلتفت الآباء إلى الأبناء من فرط ما يعتريهم من وهن."], [4, "رعبا من اليوم المقبل لإبادة الفلسطينيين، ولاستئصال صور وصيدون وكل معين باق، لأن الرب يدمر الفلسطينيين بقية جزيرة كفتور."], [5, "قد أصبحت غزة جرداء، وساد أشقلون صمت الموت. يابقية العناقيين، إلى متى تظلون تجرحون أنفسكم حزنا؟"], [6, "ياسيف الرب، متى تستكين؟ استقر في غمدك واهدأ واسترح."], [7, "كيف يمكن له أن يستكين، وقد أصدر الرب له أمره ليضرب أشقلون ومدن ساحل البحر، هناك واعده الرب على اللقاء»."]]}, {"l": "Eze 25:15-17", "n": "", "vs": [[15, "وهذا أيضا ما يعلنه السيد الرب لأن الفلسطينيين قد أقدموا على الانتقام وأفرطوا فيه بكل لؤم قلوبهم، عامدين إلى الخراب بسبب عداوة أبدية،"], [16, "ها أنا أعاقب الفلسطينيين وأستأصل الكريتيين، وأبيد بقية سكان ساحل البحر،"], [17, "وأنفذ فيهم انتقامي العظيم بتأديب مفعم بالسخط، فيدركون أني أنا الرب، إذ أصب نقمتي عليهم»."]]}, {"l": "Amo 1:6-8", "n": "", "vs": [[6, "هذا ما يقوله الرب: من أجل معاصي غزة الثلاث والأربع لن أرد عنها سخطي، لأن أهلها نفوا شعبا عن آخره ليسلموه إلى أدوم."], [7, "لذلك سأرسل نارا على أسوار غزة تلتهم حصونها."], [8, "وأستأصل أهل أشدود، وأهلك حامل صولجان ملك أشقلون، وأوجه ضرباتي ضد عقرون فيفنى من بقي من الفلسطينيين."]]}, {"l": "Zec 9:5-7", "n": "", "vs": [[5, "فتشهد مدينة أشقلون هذا فتفزع، وتتلوى غزة ألما. تتوجع عقرون أيضا لأن رجاءها قد تبدد. يهلك ملك غزة وتصبح أشقلون موحشة."], [6, "ويستوطن الزنيم في أشدود، ويستأصل الرب كبرياء الفلسطينيين."], [7, "لا يعودون يأكلون لحما بدمه أو طعاما نجسا ويصبحون هم أيضا بقية ناجية للرب، يصيرون كعشيرة في سبط يهوذا، وتغدو عقرون نظير اليبوسيين."]]}], "kwAr": "غزة", "noteAr": ""}, {"kw": "at", "raw": "Psa_91:6; Jer_6:4, Jer_15:8", "note": "", "refs": [{"l": "Psa 91:6", "n": "", "vs": [[6, "ولا من وباء يسري في الظلام، ولا من هلاك يفسد في الظهيرة."]]}, {"l": "Jer 6:4", "n": "", "vs": [[4, "أعدوا عليها حربا. قوموا نهاجمها عند الظهيرة. ويل لنا فقد مال النهار وانتشرت ظلال المساء."]]}, {"l": "Jer 15:8", "n": "", "vs": [[8, "وأجعل عدد أراملهم أكثر من عدد رمل البحر، وأجلب في رابعة النهار مهلكا على أمهات الشبان، وأوقع عليهم الرعب والهول بغتة."]]}], "kwAr": "عند الظهيرة", "noteAr": ""}], "arS": [["فإن", ["H3588"]], [" ", []], ["غزة", ["H5804"]], [" ", []], ["تصبح", ["H1961"]], [" ", []], ["مهجورة", ["H5800"]], ["، ", []], ["وأشقلون", ["H831"]], [" ", []], ["موحشة", ["H8077"]], ["، وأهل ", []], ["أشدود", ["H795"]], [" ", []], ["يطردون", ["H1644"]], [" عند ", []], ["الظهيرة", ["H6672"]], ["، ", []], ["وعقرون", ["H6138"]], [" ", []], ["تستأصل", ["H6131"]], [".", []]]}, {"c": 2, "v": 5, "text": "ويل لكم ياأهل ساحل البحر، أمة الكريتيين. إن قضاء الرب منصب عليكم ياسكان كنعان أرض الفلسطينيين. سأدمرك حتى لا يبقى فيك مقيم.", "groups": [{"kw": "Cherethites", "raw": "Jer_47:7; Eze_25:16, Cherethims", "note": "Jer_47:7; Eze_25:16, Cherethims", "refs": [{"l": "Jer 47:7", "n": "", "vs": [[7, "كيف يمكن له أن يستكين، وقد أصدر الرب له أمره ليضرب أشقلون ومدن ساحل البحر، هناك واعده الرب على اللقاء»."]]}, {"l": "Eze 25:16", "n": "", "vs": [[16, "ها أنا أعاقب الفلسطينيين وأستأصل الكريتيين، وأبيد بقية سكان ساحل البحر،"]]}], "kwAr": "الكريتيين", "noteAr": "انظر إر 47: 7؛ حز 25: 16 (الكريتيون)"}, {"kw": "the word", "raw": "Amo_3:1, Amo_5:1; Zec_1:6; Mar_12:12", "note": "", "refs": [{"l": "Amo 3:1", "n": "", "vs": [[1, "اسمعوا يابني إسرائيل هذه الكلمة التي قضى بها الرب عليكم، بل على كل القبيلة التي أخرجتها من ديار مصر:"]]}, {"l": "Amo 5:1", "n": "", "vs": [[1, "اسمعوا هذه المرثية التي أرثيكم بها يابني إسرائيل."]]}, {"l": "Zec 1:6", "n": "", "vs": [[6, "ولكن ألم تدرك أقوالي وفرائضي التي أمرت بها عبيدي الأنبياء آباءكم فتابوا قائلين: لقد نفذ الرب القدير ما عزم أن يعاقبنا بمقتضى ما ارتكبناه من أعمال باطلة؟»"]]}, {"l": "Mar 12:12", "n": "", "vs": [[12, "فسعوا إلى القبض عليه، ولكنهم خافوا الجمع، لأنهم أدركوا أنه كان يعنيهم بهذا المثل. فتركوه وانصرفوا."]]}], "kwAr": "قضاء الرب", "noteAr": ""}, {"kw": "O Canaan", "raw": "Jos_13:3; Jdg_3:3", "note": "", "refs": [{"l": "Jos 13:3", "n": "", "vs": [[3, "الممتدة من نهر شيحور شرقي مصر حتى إقليم عقرون شمالا، وجميعها تعتبر ملكا للكنعانيين. وهي مناطق للحكام الفلسطينيين الخمسة المقيمين في غزة وأشدود وأشقلون وجت وعقرون والعويين،"]]}, {"l": "Jdg 3:3", "n": "", "vs": [[3, "وهؤلاء الأمم هم: أقطاب الفلسطينيين الخمسة، وجميع الكنعانيين والصيدونيين والحويين سكان جبل لبنان، من جبل بعل حرمون إلى مدخل حماة."]]}], "kwAr": "ياسكان كنعان", "noteAr": ""}], "arS": [["ويل", ["H1945"]], [" لكم ", []], ["ياأهل", ["H3427"]], [" ", []], ["ساحل", ["H2256"]], [" ", []], ["البحر", ["H3220"]], ["، ", []], ["أمة", ["H1471"]], [" ", []], ["الكريتيين", ["H3774"]], [". إن ", []], ["قضاء", ["H1697"]], [" ", []], ["الرب", ["H3068"]], [" منصب ", []], ["عليكم", ["H5921"]], [" ياسكان ", []], ["كنعان", ["H3667"]], [" ", []], ["أرض", ["H776"]], [" ", []], ["الفلسطينيين", ["H6430"]], [". ", []], ["سأدمرك", ["H6"]], [" حتى ", []], ["لا", ["H4480", "H369"]], [" يبقى فيك ", []], ["مقيم", ["H3427"]], [".", []]]}, {"c": 2, "v": 6, "text": "وأنت ياأرض ساحل البحر تصبحين مراعي ومروجا للرعاة وحظائر للمواشي.", "groups": [{"kw": "the sea", "raw": "Zep_2:14, Zep_2:15; Isa_17:2; Eze_25:5", "note": "", "refs": [{"l": "Zep 2:14", "n": "", "vs": [[14, "تربض في وسطها القطعان وسائر وحوش البر، ويأوي إلى تيجان أعمدتها القوق والقنفذ وينعب الغراب على عتباتها، لأن أرزها قد تعرى."]]}, {"l": "Zep 2:15", "n": "", "vs": [[15, "هذه هي المدينة الطروب التي سكنت آمنة قائلة لنفسها: أنا وليس لي نظير! كيف صارت أطلالا، ومأوى للوحوش البرية؟ كل من يجتاز بها يصفر دهشة ويهز يده»."]]}, {"l": "Isa 17:2", "n": "", "vs": [[2, "تهجر مدن عروعير، وتصبح مراعي للقطعان تربض فيها ولا أحد يخيفها"]]}, {"l": "Eze 25:5", "n": "", "vs": [[5, "وأجعل مدينة ربة مناخا للإبل، وسائر مدن بني عمون مرابض للغنم، فتدركون أني أنا الرب."]]}], "kwAr": "ساحل البحر", "noteAr": ""}], "arS": [["وأنت ياأرض ", []], ["ساحل", ["H2256"]], [" ", []], ["البحر", ["H3220"]], [" ", []], ["تصبحين", ["H1961"]], [" ", []], ["مراعي", ["H5116"]], [" ", []], ["ومروجا", ["H3741"]], [" ", []], ["للرعاة", ["H7462"]], [" ", []], ["وحظائر", ["H1448"]], [" ", []], ["للمواشي", ["H6629"]], [".", []]]}, {"c": 2, "v": 7, "text": "ويصبح ساحل البحر ملكا لبقية بيت يهوذا فيرعون فيه قطعانهم، ويرقدون في المساء في بيوت أشقلون، لأن الرب إلههم يفتقدهم ويرد سبيهم.", "groups": [{"kw": "the coast", "raw": "Isa_14:29-32; Oba_1:19; Zec_9:6, Zec_9:7; Act_8:26, Act_8:40", "note": "", "refs": [{"l": "Isa 14:29-32", "n": "", "vs": [[29, "«لا تفرحي ياكل فلسطين، لأن القضيب الذي ضربك قد انكسر. فإن من أصل تلك الأفعى يخرج أفعوان، وذريته تكون ثعبانا ساما طيارا"], [30, "أما أبكار البائسين فيرعون، والمساكين يربضون آمنين. لكنني أهلك أصلك بالمجاعة وأقضي على بقيتك."], [31, "ولول أيها الباب ونوحي أيتها المدينة! ذوبي خوفا يافلسطين قاطبة لأن جيشا مدربا قد زحف نحوك من الشمال"], [32, "فبماذا نجيب رسل الأمة؟ لتقل لهم: قد أسس الرب أورشليم ليلوذ بها منكوبو شعبه»."]]}, {"l": "Oba 1:19", "n": "", "vs": [[19, "ويرث أهل النقب جبل عيسو، وسكان السهول أرض الفلسطينيين، ويملكون أرض أفرايم وبلاد السامرة، ويرث بنيامين جلعاد."]]}, {"l": "Zec 9:6", "n": "", "vs": [[6, "ويستوطن الزنيم في أشدود، ويستأصل الرب كبرياء الفلسطينيين."]]}, {"l": "Zec 9:7", "n": "", "vs": [[7, "لا يعودون يأكلون لحما بدمه أو طعاما نجسا ويصبحون هم أيضا بقية ناجية للرب، يصيرون كعشيرة في سبط يهوذا، وتغدو عقرون نظير اليبوسيين."]]}, {"l": "Act 8:26", "n": "", "vs": [[26, "ثم إن ملاكا من عند الرب كلم فيلبس فقال له: «قم اذهب نحو الجنوب، ماشيا على الطريق البرية بين أورشليم وغزة»."]]}, {"l": "Act 8:40", "n": "", "vs": [[40, "أما فيلبس فقد شوهد في أشدود، ثم سار يبشر كل مدينة حتى وصل إلى قيصرية."]]}], "kwAr": "ساحل البحر", "noteAr": ""}, {"kw": "the remnant", "raw": "Zep_2:9; Isa_11:11; Jer_31:7; Mic_2:12, Mic_4:7, Mic_5:3-8; Hag_1:12, Hag_2:2; Rom_11:5", "note": "", "refs": [{"l": "Zep 2:9", "n": "", "vs": [[9, "لذلك، كما أنا حي، يقول الرب القدير إله إسرائيل، ليصبحن أهل موآب كسدوم، والعمونيون كعمورة، منبتا للقريص وحفرة للملح وخرابا إلى الأبد، وتنهبهم بقية شعبي ويمتلكهم الناجون من أمتي."]]}, {"l": "Isa 11:11", "n": "", "vs": [[11, "فيعود الرب ليمد يده ثانية ليسترد البقية الباقية من شعبه، من أشور ومصر وفتروس وكوش وعيلام وشنعار وحماة، ومن جزائر البحر،"]]}, {"l": "Jer 31:7", "n": "", "vs": [[7, "فإن هذا ما يعلنه الرب: «رنموا بهتاف ليعقوب، اهتفوا لرأس الأمم، أعلنوا وسبحوا وقولوا: أنقذ يارب شعبك، بقية إسرائيل»."]]}, {"l": "Mic 2:12", "n": "", "vs": [[12, "سأجمع شتاتك جميعا يايعقوب، وأجمع بقية إسرائيل وأضمهم معا كقطيع غنم في حظيرة، مثل قطيع محتشد في مرعى، فترتفع جلبة جمهورهم."]]}, {"l": "Mic 4:7", "n": "", "vs": [[7, "فأجعل من العرج بقية، ومن المنبوذين أمة قوية، فيملك الرب عليهم في جبل صهيون من الآن وإلى الأبد."]]}, {"l": "Mic 5:3-8", "n": "", "vs": [[3, "لذلك يسلم الرب شعبه إلى أعدائهم إلى أن تلد من تقاسي من المخاض، عندئذ ترجع بقية إخوته من السبي إلى شعب إسرائيل."], [4, "فيقوم ويرعى شعبه بقوة الرب وبجلال اسم الرب إلهه، فيعيشون بأمن، لأن عظمته تمتد إلى أقاصي الأرض."], [5, "ويصبح الرب سلامهم، إذ حين يزحف الأشوريون إلى أرضنا ويطأون ترابنا، فإننا نثير عليهم سبعة رعاة وثمانية أمراء من الناس،"], [6, "فيحكمون بلاد أشور بقوة السيف، ويقتحمون بوابات أرض نمرود، وينقذنا ( الله ) من الأشوريين عندما يزحفون إلى أرضنا ويطأون تخومنا."], [7, "عندئذ تغدو بقية ذرية يعقوب بين الأمم الكثيرة كندى من لدن الرب، كالمطر الوابل على العشب الذي لا يتوانى من أجل الناس أو يرجو أبناء البشر."], [8, "وتكون بقية ذرية يعقوب بين الشعوب الكثيرة كأسد بين وحوش الغابة، أو كشبل بين قطعان الغنم، الذي إن اقتحم يدوس ويفترس وليس من منقذ."]]}, {"l": "Hag 1:12", "n": "", "vs": [[12, "حينئذ أطاع زربابل بن شألتيئيل ويهوشع بن يهوصادق رئيس الكهنة، وسائر بقية شعب إسرائيل صوت الرب إلههم، واستمعوا إلى كلمات حجي النبي، كما بعثه الرب إلههم إليهم، فاعترى الخوف الشعب في محضر الله."]]}, {"l": "Hag 2:2", "n": "", "vs": [[2, "«خاطب زربابل بن شألتيئيل حاكم يهوذا، ويهوشع بن يهوصادق رئيس الكهنة وجميع البقية الناجية من الشعب قائلا:"]]}, {"l": "Rom 11:5", "n": "", "vs": [[5, "فكذلك، في الزمان الحاضر، ماتزال بقية اختارها الله بالنعمة."]]}], "kwAr": "لبقية بيت يهوذا", "noteAr": ""}, {"kw": "for", "raw": "or, when, etc", "note": "or, when, etc", "refs": [], "kwAr": "لأن الرب", "noteAr": "أو: «حين»، إلخ."}, {"kw": "shall visit", "raw": "Gen_50:24; Exo_4:31; Luk_1:68, Luk_7:16", "note": "", "refs": [{"l": "Gen 50:24", "n": "", "vs": [[24, "ثم قال يوسف لإخوته: «أنا موشك على الموت، ولكن الله سيفتقدكم ويخرجكم من هذه الأرض ويردكم إلى الأرض التي وعد بها بقسم لإبراهيم وإسحق ويعقوب»."]]}, {"l": "Exo 4:31", "n": "", "vs": [[31, "فآمن الشعب. وعندما سمعوا أن الله قد افتقدهم ونظر إلى مذلتهم انحنوا ساجدين."]]}, {"l": "Luk 1:68", "n": "", "vs": [[68, "«تبارك الرب إله إسرائيل، لأنه تفقد شعبه وعمل له فداء،"]]}, {"l": "Luk 7:16", "n": "", "vs": [[16, "فاستولى الخوف على الجميع، ومجدوا الله، قائلين: «قد قام فينا نبي عظيم وتفقد الله شعبه !»"]]}], "kwAr": "يفتقدهم", "noteAr": ""}, {"kw": "turn", "raw": "Zep_3:20; Psa_85:1, Psa_126:1-4; Isa_14:1; Jer_3:18, Jer_23:3, Jer_29:14, Jer_30:3, Jer_30:18, Jer_30:19; Jer_33:7; Eze_39:25; Amo_9:14, Amo_9:15; Mic_4:10", "note": "", "refs": [{"l": "Zep 3:20", "n": "", "vs": [[20, "في ذلك الوقت أجمعكم من الشتات وأعيدكم إلى موطنكم، وأجعل لكم مقاما شريفا محمودا بين جميع شعوب الأرض، حين أرد لكم ازدهاركم. هكذا قال الرب."]]}, {"l": "Psa 85:1", "n": "", "vs": [[1, "يارب، قد رضيت عن أرضك، وأرجعت سبي يعقوب."]]}, {"l": "Psa 126:1-4", "n": "", "vs": [[1, "عندما أرجع الرب أهل أورشليم من السبي، صرنا كمن يرى حلما."], [2, "عندئذ امتلأت أفواهنا ضحكا، وألسنتنا ترنما. عندئذ قالت الأمم: إن الرب قد أجرى أمورا عظيمة مع هؤلاء."], [3, "نعم، إن الرب قد صنع أمورا عظيمة لنا، ففرحنا."], [4, "أرجعنا يارب من سبينا، كما ترجع السيول إلى النقب."]]}, {"l": "Isa 14:1", "n": "", "vs": [[1, "ولكن الرب ينعم برحمته على ذرية يعقوب، ويصطفي شعب إسرائيل ثانية ويحلهم في أرضهم، فينضم الغرباء إليهم ويلحقون ببيت يعقوب."]]}, {"l": "Jer 3:18", "n": "", "vs": [[18, "وتنضم في تلك الأيام ذرية يهوذا إلى ذرية إسرائيل ويأتون معا من أرض الشمال إلى الديار التي أورثتها لآبائهم."]]}, {"l": "Jer 23:3", "n": "", "vs": [[3, "وأجمع شتات غنمي من جميع الأراضي التي أجليتها إليها، وأردها إلى مراعيها فتنمو وتتكاثر،"]]}, {"l": "Jer 29:14", "n": "", "vs": [[14, "وحين تجدونني أرد سبيكم، وأجمعكم من بين جميع الأمم ومن جميع الأماكن التي شتتكم إليها."]]}, {"l": "Jer 30:3", "n": "", "vs": [[3, "ها أيام مقبلة أرد فيها سبي شعبي إسرائيل ويهوذا، وأعيدهم إلى الأرض التي أعطيتها لآبائهم فيرثونها»."]]}, {"l": "Jer 30:18", "n": "", "vs": [[18, "وهذا ما يعلنه الرب: «ها أنا أرد سبي ذرية يعقوب إلى منازلهم، وأرحم مساكنهم، فتبنى المدينة على رابيتها، وينتصب القصر كالعهد به."]]}, {"l": "Jer 30:19", "n": "", "vs": [[19, "وتصدر عنهم ترانيم الشكر مع أهازيج أصوات المطربين، وأكثرهم فلا يكونون قلة، وأكرمهم فلا يستذلون."]]}, {"l": "Jer 33:7", "n": "", "vs": [[7, "وأرد سبي يهوذا وإسرائيل، وأبنيهم كما في العهد السابق."]]}, {"l": "Eze 39:25", "n": "", "vs": [[25, "أما الآن فها أنا أرد سبي ذرية يعقوب وأرحم كل شعب إسرائيل وأغار على اسمي القدوس،"]]}, {"l": "Amo 9:14", "n": "", "vs": [[14, "وأرد سبي شعبي إسرائيل فيعيدون بناء المدن الخربة ويسكنونها، ويزرعون كروما ويشربون من خمرها، ويغرسون جنات ويأكلون من ثمارها."]]}, {"l": "Amo 9:15", "n": "", "vs": [[15, "وأغرس شعبي في أرضهم فلا يستأصلون ثانية أبدا من الأرض التي وهبتها لهم، يقول الرب إلهكم."]]}, {"l": "Mic 4:10", "n": "", "vs": [[10, "تلوي وجعا وتأوهي ياابنة صهيون كامرأة تعاني من المخاض، لأنك الآن تخرجين من المدينة لتقيمي في الصحراء. ستذهبين إلى بابل، وهناك يتم إنقاذك لأن الرب يفتديك هناك من أيدي أعدائك."]]}], "kwAr": "ويرد سبيهم", "noteAr": ""}], "arS": [["ويصبح", ["H1961"]], [" ", []], ["ساحل", ["H2256"]], [" البحر ملكا ", []], ["لبقية", ["H7611"]], [" ", []], ["بيت", ["H1004"]], [" ", []], ["يهوذا", ["H3063"]], [" ", []], ["فيرعون", ["H7462"]], [" ", []], ["فيه", ["H5921"]], [" قطعانهم، ", []], ["ويرقدون", ["H7257"]], [" في ", []], ["المساء", ["H6153"]], [" في ", []], ["بيوت", ["H1004"]], [" ", []], ["أشقلون", ["H831"]], ["، ", []], ["لأن", ["H3588"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["إلههم", ["H430"]], [" ", []], ["يفتقدهم", ["H6485"]], [" ", []], ["ويرد", ["H7725"]], [" ", []], ["سبيهم", ["H7622"]], [".", []]]}, {"c": 2, "v": 8, "text": "قد سمعت تعيير موآب وتجاديف بني عمون، وكيف احتقروا شعبي وهددوا تخمهم.", "groups": [{"kw": "heard", "raw": "Jer_48:27-29; Eze_25:8-11", "note": "", "refs": [{"l": "Jer 48:27-29", "n": "", "vs": [[27, "ألم يصبح إسرائيل مهزأة لديك؟ أكان بين اللصوص حتى كنت تهز رأسك باحتقار كلما جاء ذكره على لسانك؟"], [28, "اهجروا المدن وأقيموا بين الصخور ياأهل موآب، وكونوا كالحمامة التي تعشش عند حافة فوهة الكهف."], [29, "قد سمعنا عن عجرفة موآب المفرطة. إنه شديد الكبرياء. سمعنا عن غطرسته وتشامخه وغروره، وعن ارتفاع قلبه."]]}, {"l": "Eze 25:8-11", "n": "", "vs": [[8, "وهذا ما يعلنه السيد الرب: لأن الموآبيين وأهل سعير يقولون: هل شعب يهوذا كبقية الأمم."], [9, "لذلك ها أنا أقوض جبهتهم الشرقية، وأدمر مدن حدودهم، بيت بشيموت وبعل معون وقريتايم وهي مدن مفخرة موآب."], [10, "فيستولى قبائل البدو عليها، ويصير بنو عمون ملكا لهم فلا يعود لهم ذكر بين الأمم."], [11, "وأنفذ في الموآبيين أحكاما، فيدركون أني أنا الرب."]]}], "kwAr": "سمعت", "noteAr": ""}, {"kw": "the revilings", "raw": "Psa_83:4-7; Jer_49:1; Eze_25:3-7, Eze_36:2; Amo_1:13", "note": "", "refs": [{"l": "Psa 83:4-7", "n": "", "vs": [[4, "يقولون: «هلم نستأصلهم من بين الأمم، فلا يذكر اسم إسرائيل فيما بعد»."], [5, "فإنهم قد تآمروا معا بقلب واحد، وعقدوا حلفا ضدك."], [6, "عشائر أدوم وبنو إسماعيل، نسل موآب وبنو هاجر."], [7, "جبال وعمون وعماليق، الفلسطينيون وأهل صور،"]]}, {"l": "Jer 49:1", "n": "", "vs": [[1, "نبوءة عن بني عمون، هذا ما يعلنه الرب: «أليس لإسرائيل أبناء؟ أليس له وارث؟ فما بال ملك العمونيين قد استولى على ميراث سبط جاد وسكن شعبه في مدنه؟"]]}, {"l": "Eze 25:3-7", "n": "", "vs": [[3, "وقل لهم اسمعوا ما يعلنه السيد الرب من قضاء: لأنك شمت بمقدسي لأنه تدنس، وبأرض إسرائيل لأنها خربت وبشعب يهوذا لأنهم سيقوا إلى السبي،"], [4, "أسلمك للبدو وأبناء المشرق، فتصيرين ملكا لهم فينصبون مضاربهم فيك، ويقيمون مساكنهم فوق أرضك. هم يلتهمون غلتك، ويشربون لبنك."], [5, "وأجعل مدينة ربة مناخا للإبل، وسائر مدن بني عمون مرابض للغنم، فتدركون أني أنا الرب."], [6, "لأنك صفقت بكفيك طربا، وخبطت برجليك، وفرحت بكل ما فيك من لؤم لما حل بأرض إسرائيل."], [7, "لذلك ها أنا أثقل يدي عليك، وأسلمك غنيمة للأمم، وأستأصلك من بين الشعوب، وأفنيك من بين البلدان، وأدمرك، فتدرك أني أنا الرب."]]}, {"l": "Eze 36:2", "n": "", "vs": [[2, "هذا ما يعلنه السيد الرب: لأن العدو قد تهكم عليكم قائلا: هه. قد صار ت المرتفعات القديمة ميراثا لنا."]]}, {"l": "Amo 1:13", "n": "", "vs": [[13, "هذا ما يقوله الرب: من أجل معاصي العمونيين الثلاث والأربع لن أرد عنهم سخطي، لأنهم شقوا بطون الحوامل في جلعاد ليوسعوا تخمهم."]]}], "kwAr": "وتجاديف بني عمون", "noteAr": ""}], "arS": [["قد ", []], ["سمعت", ["H8085"]], [" ", []], ["تعيير", ["H2781"]], [" ", []], ["موآب", ["H4124"]], [" ", []], ["وتجاديف", ["H1421"]], [" ", []], ["بني", ["H1121"]], [" ", []], ["عمون", ["H5983"]], ["، ", []], ["وكيف", ["H834"]], [" ", []], ["احتقروا", ["H2778"]], [" ", []], ["شعبي", ["H5971"]], [" ", []], ["وهددوا", ["H1431"]], [" ", []], ["تخمهم", ["H1366"]], [".", []]]}, {"c": 2, "v": 9, "text": "لذلك، كما أنا حي، يقول الرب القدير إله إسرائيل، ليصبحن أهل موآب كسدوم، والعمونيون كعمورة، منبتا للقريص وحفرة للملح وخرابا إلى الأبد، وتنهبهم بقية شعبي ويمتلكهم الناجون من أمتي.", "groups": [{"kw": "as I", "raw": "Num_14:21; Isa_49:18; Jer_46:18; Rom_14:11", "note": "", "refs": [{"l": "Num 14:21", "n": "", "vs": [[21, "ولكن كما أنا حقا حي، وكما أن مجد الرب حقا يملأ الأرض،"]]}, {"l": "Isa 49:18", "n": "", "vs": [[18, "ارفعي عينيك وتلفتي حولك وانظري، فقد اجتمع أبناؤك وتوافدوا إليك. حي أنا يقول الرب، فإنك ستتزينين بهم كالحلي وتتقلدينهم كعروس"]]}, {"l": "Jer 46:18", "n": "", "vs": [[18, "حي أنا يقول الملك الذي اسمه الرب القدير، سيقبل نبوخذناصر كجبل تابور بين الجبال وكالكرمل عند البحر."]]}, {"l": "Rom 14:11", "n": "", "vs": [[11, "فإنه قد كتب: «أنا حي، يقول الرب، لي ستنحني كل ركبة، وسيعترف كل لسان لله!»"]]}], "kwAr": "كما أنا حي", "noteAr": ""}, {"kw": "Surely", "raw": "Isa_11:14, 15:1-16:14, Isa_25:10; Jer. 48:1-49:7; Ezek. 25:1-26:21; Amo_1:13-15, Amo_2:1-3", "note": "", "refs": [{"l": "Isa 11:14", "n": "", "vs": [[14, "وينقضان على أكتاف الفلسطينيين غربا ويغزوان أبناء المشرق معا، ويستوليان على بلاد أدوم وموآب، ويخضع لهم بنو عمون."]]}, {"l": "Isa 15:1-16:14", "n": "", "vs": [[1, "رؤيا بشأن موآب: حقا في ليلة مباغتة تخرب عار موآب، حقا في ليلة مباغتة تدمر قير موآب."], [2, "ينطلق أهل ديبون إلى المعبد، وحتى إلى المرتفعات للبكاء؛ يولول شعب موآب على مصير نبو وميدبا برؤوس وذقون محلوقة."], [3, "يتلفعون بالمسوح في شوارعها، ويبكي كل واحد منهم على السطوح وفي الساحات."], [4, "تتعالى صرخات حشبون وألعالة حتى تتردد أصداؤها في ياهص، لذلك يندب جيش موآب بصوت مرتفع، وقلوبهم ترتعد في صدورهم."], [5, "قلبي يصرخ متوجعا على موآب وعلى عظمائها الهاربين إلى صوغر. كعجلة ثلاثية يصعدون إلى عقبة اللوحيث مولولين، ويجهرون بصراخ الهزيمة في طريق حورونايم."], [6, "غاضت مياه نهر نمريم، وجف العشب على ضفتيه، وذوى الكلأ وبادت الخضرة"], [7, "لذلك يحملون ما ادخروه من ثروة ونفائس، وينقلونها إلى عبر وادي الصفصاف،"], [8, "إذ يتجاوب صراخهم على طول تخوم موآب، وتبلغ ولولتهم إلى أجلايم وبئر إيليم."], [9, "تفيض مياه ديمون دما لأني أزيد من ويلاتها، فتهاجم الأسود الناجين من موآب، وتفترس الهاربين والماكثين فيها."], [1, "أيها الهاربون من موآب إلى سالع في الصحراء، أرسلوا حملانا إلى ملك يهوذا في أورشليم (طلبا للحماية قائلين):"], [2, "نساء موآب على ضفاف أرنون مثل الطيور التائهة أو الفراخ الشاردة."], [3, "فانصحنا، أنصفنا، ليكن ظلك علينا في الظهيرة كالليل فتستر منفيينا عن عيون أعدائنا ولا تشي باللاجئين منا."], [4, "لتمكث معكم فلول الهاربين منا واعصمهم من مدمرهم لأن الباغي يبيد والدمار يكف والظالم يفنى من الأرض."], [5, "ولا يلبث أن يثبت بالرحمة عرش في بيت داود يجلس عليه بأمانة ملك يقضي بالعدل والإنصاف."], [6, "قد سمعنا بكبرياء موآب، وبعجرفتها وغطرستها الطاغيتين، وبغرورها وصلفها، ولكن كل افتخارها باطل."], [7, "لذلك يولول الموآبيون على موآب، ويئنون على قير حارس المدمرة."], [8, "ذبلت حقول حشبون وكروم سبمة التي أتلف أمراء الأمم أفضلها، التي وصلت يوما إلى يعزير، وامتدت إلى القفر وبلغت فروعها إلى الصحراء."], [9, "لذلك أبكي كبكاء يعزير على جفنات سبمة وأرويكما بدموعي ياحشبون وياألعالة. لأن جلبة الدمار قد وقعت على حصادك وقطافك."], [10, "وانتزع الفرح والابتهاج من روضتك، فلم يبق أحد يرنم أو يهتف في كرومك، ولا يوجد من يدوس الخمر في معصرتك، لأني قد أخرست الهتاف."], [11, "لهذا تئن روحي على موآب كعود، وأحشائي تتلوى على قير حارس."], [12, "وعندما يحضر الموآبيون إلى المرتفعات المشرفة، يأخذهم الإعياء، وعندما يذهبون إلى مقادسهم ليصلوا، يجنون الباطل."], [13, "هذا ما تكلم الرب به على موآب منذ زمن."], [14, "وها هو يتكلم الآن قائلا: «في غضون ثلاث سنوات، كسنوات الأجير، يذل مجد موآب، ويحتقر جميع شعبها، والناجون منهم يكونون قلة ضعيفة»."]]}, {"l": "Isa 25:10", "n": "", "vs": [[10, "لأن يد الرب تستقر على هذا الجبل ويوطأ موآب في مكانه كما يوطأ التبن في الطين."]]}, {"l": "Jer 48:1-49:7", "n": "", "vs": [[1, "نبوءة عن الموآبيين: هذا ما يعلنه الرب القدير إله إسرائيل: «ويل لنبو لأنها أصبحت أطلالا. لحق العار بقريتايم وتم الاستيلاء عليها. خزي الحصن وارتعب."], [2, "زال فخر موآب وتآمروا في حشبون عليها شرا قائلين: هيا نهدمها فلا تكون أمة بعد. وأنت أيضا يامدمين، يهيمن عليك صمت الموت ويلاحقك السيف."], [3, "اسمعوا صوت صراخ من حورونايم: قد حل بنا هلاك ودمار عظيمان."], [4, "قد تحطمت موآب، وبلغ صراخها صوغر."], [5, "إذ على مرتفع لوحيت يصعدون باكين بمرارة، وعلى منحدر حورونايم يتردد صراخ الانكسار."], [6, "اهربوا وانجوا بأنفسكم. كونوا كعرعر في البرية."], [7, "لأنكم اتكلتم على أعمالكم وكنوزكم، ستسبون أيضا ويقع الصنم كموش أيضا أسيرا ويؤخذ إلى المنفى مع كهنته ورؤسائه."], [8, "ويزحف المدمر إلى كل مدينة، فلا تفلت منه إحداها، فيبيد الوادي، ويتلف السهل، لأن الرب قد قضى."], [9, "أعطوا موآب أجنحة، فيحلق طائرا. قد أصبحت مدنه أطلالا مهجورة من الناس."], [10, "ملعون من يقوم بعمل الرب متهاونا، وملعون من حظر على سيفه الدم."], [11, "قد قضى موآب حياة مترفة منذ حداثته، كالخمر المستقر على عكره. لم يفرغ من إناء إلى إناء، ولم يذهب إلى السبي قط لذلك ظل محتفظا بطعمه ولم تتغير رائحته."], [12, "ها هي أيام مقبلة، يقول الرب، أرسل فيها إليه عابري السبيل ساكبي الجرار، فيسكبونه ويفرغون جراره ويحطمون دنانه."], [13, "فيعتري الموآبيين الخجل من كموش، كما اعترى الخجل الإسرائيليين من بيت إيل، متكلهم."], [14, "كيف تقولون: إننا أبطال وجبابرة حرب؟"], [15, "إن موآب سيدمر، وتغزى مدنه، وتنزل نخبة شبانه للذبح، يقول الملك الذي اسمه الرب القدير."], [16, "قد أزفت بلية موآب ومحنته أقبلت مسرعة."], [17, "فارثوه ياجميع المحيطين به وسائر العارفين اسمه. قولوا انكسر صولجان العز وقضيب المجد."], [18, "اهبطي من المجد واجلسي على الأرض الظمأى أيتها الساكنة في ديبون، لأن مدمر موآب قد زحف عليك وهدم حصونك."], [19, "قفي على قارعة الطريق وراقبي ياساكنة عروعير. اسألي الهارب والناجية بنفسها: ماذا جرى؟"], [20, "فيأتي الجواب: قد لحق الخزي بموآب، لأنه صار أطلالا فولولوا وأعولوا. أذيعوا في أرنون أن موآب قد أصبح خرابا."], [21, "قد وقع القضاء على أرض السهل، وعلى حولون، وعلى يهصة، وعلى ميفعة،"], [22, "وعلى ديبون، وعلى نبو، وعلى بيت دبلتايم،"], [23, "وعلى قريتايم، وعلى بيت جامول، وعلى بيت معون،"], [24, "وعلى قريوت، وعلى بصرة، وعلى كافة مدن بلاد موآب البعيدة والقريبة."], [25, "قد كسر قرن موآب، وتحطمت ذراعه، يقول الرب."], [26, "أسكروه حتى يتمرغ في قيئه، ويصبح مهزأة، لأنه تغطرس على الرب."], [27, "ألم يصبح إسرائيل مهزأة لديك؟ أكان بين اللصوص حتى كنت تهز رأسك باحتقار كلما جاء ذكره على لسانك؟"], [28, "اهجروا المدن وأقيموا بين الصخور ياأهل موآب، وكونوا كالحمامة التي تعشش عند حافة فوهة الكهف."], [29, "قد سمعنا عن عجرفة موآب المفرطة. إنه شديد الكبرياء. سمعنا عن غطرسته وتشامخه وغروره، وعن ارتفاع قلبه."], [30, "قد عرفت كبرياءه يقول الرب، إنما زهوه باطل، وتفاخره عديم الجدوى."], [31, "لذلك أنوح على موآب وأعول على كل أهله، وأئن على رجال قير حارس."], [32, "أبكي عليك أكثر من البكاء على يعزير ياجفنة سبمة التي امتدت فروعها حتى البحر، بل بلغت بحر يعزير، فإن المدمر قد انقض على حصادك الناضج وقطافك."], [33, "قد تلاشى الفرح والغبطة من بساتين موآب ومن حقوله، وأوقف تدفق الخمر من المعاصر فلا يدوسها دائس بهتاف، بل تعلو صرخات لا هتاف فيها."], [34, "يرتفع الصراخ من حشبون إلى ألعالة فياهص. أطلقوا أصواتهم من صوغر إلى حورونايم حتى العجلة الثالثة، لأن مياه نمريم أيضا قد نضبت."], [35, "وأبيد من موآب، يقول الرب، من يقرب ذبيحة على مرتفعة، ومن يحرق بخورا لآلهة الوثن."], [36, "لذلك يئن قلبي على موآب كأنين مزمار، وينوح فؤادي على رجال قير حارس كنوح الناي، فإن ثروتهم التي اكتسبوها قد تبددت."], [37, "قد أصبح كل رأس أقرع، وكل لحية محلوقة، تجرحت الأيدي وتمنطقت الأحقاء بالمسوح."], [38, "شاع النوح على سطوح موآب وفي شوارعها كلها، لأني حطمت موآب كإناء ليس لأحد رغبة فيه، يقول الرب."], [39, "لشد ما تحطمت! لشد ما يولولون: كيف أدبر موآب مجللا بالخزي؟ قد صار مثار هزء ورعب لكل من حوله»."], [40, "لأن هذا ما يعلنه الرب: «انظروا، ها واحد يطير مسرعا كالنسر باسطا جناحيه ضد موآب."], [41, "فيستولي على المدن، وتسقط الحصون، وتصبح في ذلك اليوم قلوب محاربي موآب كقلب امرأة في مخاضها."], [42, "يهلك موآب ولا يبقى أمة، لأنه قد تغطرس على الرب."], [43, "يترصدكم الرعب والحفرة والفخ ياأهل موآب، يقول الرب."], [44, "من يهرب من الخوف يقع في الحفرة، ومن يصعد من الحفرة يعلق بالفخ، لأني أجلب على موآب هذه المحن في سنة عقابهم، يقول الرب."], [45, "في ظل حشبون وقف الهاربون خائري القوى، لأن نارا اندلعت من حشبون، وشعلة من سيحون، فالتهمت ركن موآب وهامة المتبجحين الغوغائيين."], [46, "ويل لك ياموآب! قد باد شعب كموش، لأن بنيك وبناتك أخذوا إلى السبي."], [47, "ولكني أرد سبي موآب في الأيام الآتية»، يقول الرب. إلى هنا ختام القضاء على موآب."], [1, "نبوءة عن بني عمون، هذا ما يعلنه الرب: «أليس لإسرائيل أبناء؟ أليس له وارث؟ فما بال ملك العمونيين قد استولى على ميراث سبط جاد وسكن شعبه في مدنه؟"], [2, "لذلك ها أيام مقبلة، يقول الرب، أجعل فيها هتاف القتال يتردد في ربة العمونيين، فتصير تلة أطلال، وتحرق قراها بالنار فيجلي الإسرائيليون الذين أجلوهم، يقول الرب."], [3, "أعولي ياحشبون لأن عاي قد خربت. ابكين يابنات ربة وتمنطقن بالمسوح. اندبن واذرعن الأرض بين السياجات فإن ملككن سيذهب إلى السبي مع كهنته ورؤسائه جميعا."], [4, "ما بالك تباهين بالأودية أيتها الابنة المخادعة التي اتكلت على نفائسها قائلة: من يهاجمني؟"], [5, "ها أنا أوقع بك الرعب من جميع المحيطين بك، فيتشرد كل واحد منكم مطرودا، وليس من يجمع شتات الهاربين."], [6, "ثم أعود فأرد سبي العمونيين، يقول الرب»."], [7, "نبوءة عن الأدوميين: «هذا ما يعلنه الرب القدير: ألم تبق في تيمان حكمة بعد؟ هل بادت المشورة من ذوي الفهم؟ هل تلاشت حكمتهم؟"]]}, {"l": "Eze 25:1-26:21", "n": "", "vs": [[1, "وأوحى إلي الرب بكلمته قائلا:"], [2, "«ياابن آدم، التفت بوجهك نحو بني عمون وتنبأ عليهم."], [3, "وقل لهم اسمعوا ما يعلنه السيد الرب من قضاء: لأنك شمت بمقدسي لأنه تدنس، وبأرض إسرائيل لأنها خربت وبشعب يهوذا لأنهم سيقوا إلى السبي،"], [4, "أسلمك للبدو وأبناء المشرق، فتصيرين ملكا لهم فينصبون مضاربهم فيك، ويقيمون مساكنهم فوق أرضك. هم يلتهمون غلتك، ويشربون لبنك."], [5, "وأجعل مدينة ربة مناخا للإبل، وسائر مدن بني عمون مرابض للغنم، فتدركون أني أنا الرب."], [6, "لأنك صفقت بكفيك طربا، وخبطت برجليك، وفرحت بكل ما فيك من لؤم لما حل بأرض إسرائيل."], [7, "لذلك ها أنا أثقل يدي عليك، وأسلمك غنيمة للأمم، وأستأصلك من بين الشعوب، وأفنيك من بين البلدان، وأدمرك، فتدرك أني أنا الرب."], [8, "وهذا ما يعلنه السيد الرب: لأن الموآبيين وأهل سعير يقولون: هل شعب يهوذا كبقية الأمم."], [9, "لذلك ها أنا أقوض جبهتهم الشرقية، وأدمر مدن حدودهم، بيت بشيموت وبعل معون وقريتايم وهي مدن مفخرة موآب."], [10, "فيستولى قبائل البدو عليها، ويصير بنو عمون ملكا لهم فلا يعود لهم ذكر بين الأمم."], [11, "وأنفذ في الموآبيين أحكاما، فيدركون أني أنا الرب."], [12, "وهذا أيضا ما يعلنه السيد الرب: لأن الأدوميين أقدموا على الانتقام من شعب يهوذا، وأساءوا إليه أشد إساءة."], [13, "ها أنا أعاقب الأدوميين وأستأصل من أرضهم الإنسان والحيوان، وأحولها إلى أطلال دارسة من التيمن إلى ددان، إذ يقتل أهلها جميعا بالسيف."], [14, "وأعهد بنقمتي إلى شعبي إسرائيل، فيفعلون بالأدوميين بمقتضى غضبي وسخطي، فيدركون شدة نقمتي، يقول السيد الرب."], [15, "وهذا أيضا ما يعلنه السيد الرب لأن الفلسطينيين قد أقدموا على الانتقام وأفرطوا فيه بكل لؤم قلوبهم، عامدين إلى الخراب بسبب عداوة أبدية،"], [16, "ها أنا أعاقب الفلسطينيين وأستأصل الكريتيين، وأبيد بقية سكان ساحل البحر،"], [17, "وأنفذ فيهم انتقامي العظيم بتأديب مفعم بالسخط، فيدركون أني أنا الرب، إذ أصب نقمتي عليهم»."], [1, "وفي السنة الحادية عشرة (من سبي الملك يهوياكين)، في اليوم الأول من الشهر، أوحى إلي الرب بكلمته قائلا:"], [2, "«ياابن آدم، لأن صور قد شمتت بأورشليم، وقالت: ها بوابة الشعوب قد انهارت، وتحولت القوافل إلي. ها أنا أزدهر إذ حل بها الدمار."], [3, "لذلك يعلن السيد الرب: ها أنا أعاقبك ياصور، فأجعل أمما كثيرة تهاجمك كما يهجم البحر بأمواجه."], [4, "فيهدمون أسوار صور وأبراجها، وأكشط ترابها عنها، وأحولها إلى صخرة جرداء."], [5, "فتصبح منشرا للشباك في وسط البحر لأني أنا قضيت، يقول السيد الرب، ثم تغدو غنيمة للأمم."], [6, "وتهلك ضواحيها الريفية بالسيف، فيدركون أني أنا الرب."], [7, "لأن هذا ما يعلنه السيد الرب: ها أنا آتي بملك الملوك، نبوخذناصر ملك بابل من الشمال بخيل وبمركبات وبفرسان وأقوام غفيرة،"], [8, "فيبيد بالسيف قرى ريفك ويشيد حولك سور حصار، ويبني عليك أبراجا، ويقيم مترسة، ويهاجمك بترس."], [9, "ويقذف أسوارك بمجانق، ويهدم أبراجك بعدة حربه."], [10, "ولكثرة خيله يحجبك غبار حوافرها، وتتزلزل أسوارك من صوت الفرسان والعربات والمركبات عند اقتحامه أبوابك كما تقتحم مدينة مثغورة،"], [11, "فيدوس بحوافر خيله كل شوارعك، ويقضي بالسيف على شعبك، فتتهاوى إلى الأرض أركان عزك،"], [12, "وينهبون ثروتك، ويستولون على تجارتك ويهدمون أسوارك وبيوتك المبهجة، ويطرحون حجارتك وخشبك وترابك إلى مياه البحر."], [13, "وأخرس أهازيج أغانيك، ولا تتردد بعد رنات أعوادك،"], [14, "وأجعلك كصخرة جرداء، فتكونين منشرا للشباك، ولا تعمرين في ما بعد. لأني أنا الرب قضيت يقول السيد الرب."], [15, "وهذا ما يعلنه السيد الرب عن مدينة صور: ألا ترتعد مدن السواحل لجلبة سقوطك، ولصراخ الجرحى، ولوقوع القتل فيك،"], [16, "فينزل جميع رؤساء المدن الساحلية عن عروشهم ويخلعون جببهم ويطرحون عنهم أرديتهم المزركشة، ويكتسون الرعب ثوبا، ويجلسون على الأرض مرتجفين في كل لحظة، مذعورين لما أصابك"], [17, "عندئذ ينوحون عليك بمرثاة قائلين: كيف تلاشيت من بين البحار أيتها المدينة العامرة الشهيرة، التي كانت مسيطرة هي وسكانها على البحر، فألقوا رعبهم على جميع جيرانها."], [18, "الآن ترتعد مدن السواحل في وقت سقوطك، وتضطرب الجزائر في وسط البحر لانهيارك،"], [19, "إذ أحولك إلى مدينة خربة كالمدن المقفرة. أطغي عليك لجج البحر وأغمرك بالمياه الكثيرة،"], [20, "وأحدرك مع الهابطين إلى الهاوية، إلى الشعب القديم، وأجعلك تقيمين في أسافل الأرض في الخرب الدائرة لتظلي مقفرة، فلا يكون لك مكان في أرض الأحياء،"], [21, "وأجلب الرعب عليك فلا يبقى منك أثر وإذ يبحث عنك لا يعثر عليك أبدا، يقول السيد الرب»."]]}, {"l": "Amo 1:13-15", "n": "", "vs": [[13, "هذا ما يقوله الرب: من أجل معاصي العمونيين الثلاث والأربع لن أرد عنهم سخطي، لأنهم شقوا بطون الحوامل في جلعاد ليوسعوا تخمهم."], [14, "لهذا أضرم نارا في سور ربة فتلتهم حصونها في معترك جلبة يوم الحرب، وفي وسط عاصفة في يوم الزوبعة."], [15, "ويساق ملكهم إلى السبي مع سائر رؤسائه يقول الرب."]]}, {"l": "Amo 2:1-3", "n": "", "vs": [[1, "هذا ما يقوله الرب: من أجل معاصي موآب الثلاث والأربع لن أرد عنهم سخطي، لأن موآب أحرق عظام ملك أدوم حتى صارت كلسا."], [2, "لهذا أرسل نارا على موآب فتلتهم حصون قريوت، فيموت موآب في وسط الضجيج وصيحات المحاربين ودوي الأبواق."], [3, "وأستأصل الحاكم من بين الموآبيين، وأقضي على كل رؤسائهم، يقول الرب."]]}], "kwAr": "ليصبحن", "noteAr": ""}, {"kw": "as Gomorrah", "raw": "Zep_2:14; Gen_19:24, Gen_19:25; Deu_29:23; Isa_13:19, Isa_13:20, Isa_34:9-13; Jer_49:18, Jer_50:40", "note": "", "refs": [{"l": "Zep 2:14", "n": "", "vs": [[14, "تربض في وسطها القطعان وسائر وحوش البر، ويأوي إلى تيجان أعمدتها القوق والقنفذ وينعب الغراب على عتباتها، لأن أرزها قد تعرى."]]}, {"l": "Gen 19:24", "n": "", "vs": [[24, "فأمطر الرب على سدوم وعمورة كبريتا ونارا، من عنده من السماء."]]}, {"l": "Gen 19:25", "n": "", "vs": [[25, "وقلب تلك المدن والساكنين فيها، والسهل المحيط بها وكل مزروعات الأرض."]]}, {"l": "Deu 29:23", "n": "", "vs": [[23, "إذ تصبح جميع الأرض كبريتا، محترقة لا زرع فيها ولا نبات ولا عشب، وكأنها انقلبت كما جرى لسدوم وعمورة وأدمة وصبوييم، التي قلبها الرب من جراء غضبه وسخطه."]]}, {"l": "Isa 13:19", "n": "", "vs": [[19, "أما بابل، مجد الممالك وبهاء وفخر الكلدانيين، فتصبح كسدوم وعمورة اللتين قلبهما الله ."]]}, {"l": "Isa 13:20", "n": "", "vs": [[20, "لا يسكن فيها، ولا تعمر من جيل إلى جيل، لا ينصب فيها بدوي خيمته، ولا يربض فيها راع قطعانه."]]}, {"l": "Isa 34:9-13", "n": "", "vs": [[9, "فتنقلب أنهار أدوم إلى زفت، وترابهم إلى كبريت، وتصبح أرضها قارا مشتعلا."], [10, "فلا تنطفيء ليلا ونهارا، ويحلق دخانها إلى الفضاء مدى الدهر، وتظل خرابا جيلا بعد جيل، فلا يعبر بها أحد إلى الأبد،"], [11, "ولا يرثها سوى الصقور والقنافذ، ويسكن فيها البوم والغراب، ويمد الرب عليها خيط الدمار ومطمار الهلاك،"], [12, "ولا يجد فيها أشرافها أثرا للملك، وينقرض جميع رؤسائها."], [13, "ينمو الشوك في قصورها، ويزحف العوسج على حصونها، فتصبح مأوى لبنات آوى، ومسكنا للنعام."]]}, {"l": "Jer 49:18", "n": "", "vs": [[18, "ويصيبها ما أصاب سدوم وعمورة وما جاورهما، من انقلاب، يقول الرب، فلا يسكن هناك إنسان ولا يتغرب فيها أحد."]]}, {"l": "Jer 50:40", "n": "", "vs": [[40, "وكما قلب الله سدوم وعمورة وما جاورهما، هكذا لن يسكن فيها أحد أو يقيم فيها إنسان."]]}], "kwAr": "والعمونيون كعمورة", "noteAr": ""}, {"kw": "the residue", "raw": "Zep_2:7, Zep_3:13; Joe_3:19, Joe_3:20; Mic_5:7, Mic_5:8", "note": "", "refs": [{"l": "Zep 2:7", "n": "", "vs": [[7, "ويصبح ساحل البحر ملكا لبقية بيت يهوذا فيرعون فيه قطعانهم، ويرقدون في المساء في بيوت أشقلون، لأن الرب إلههم يفتقدهم ويرد سبيهم."]]}, {"l": "Zep 3:13", "n": "", "vs": [[13, "ولن يرتكب بقية إسرائيل الإثم، ولا ينطقون بالكذب، وليس في أفواههم غش، بل يعيشون آمنين من غير أن يهددهم أحد."]]}, {"l": "Joe 3:19", "n": "", "vs": [[19, "وتصبح مصر خرابا، وأدوم قفرا موحشا لفرط ما أنزلوه من ظلم بأبناء يهوذا، ولأنهم سفكوا دما بريئا في ديارهم."]]}, {"l": "Joe 3:20", "n": "", "vs": [[20, "أما يهوذا فإنه يسكن الأرض إلى الأبد، وتعمر أورشليم مدى الأجيال."]]}, {"l": "Mic 5:7", "n": "", "vs": [[7, "عندئذ تغدو بقية ذرية يعقوب بين الأمم الكثيرة كندى من لدن الرب، كالمطر الوابل على العشب الذي لا يتوانى من أجل الناس أو يرجو أبناء البشر."]]}, {"l": "Mic 5:8", "n": "", "vs": [[8, "وتكون بقية ذرية يعقوب بين الشعوب الكثيرة كأسد بين وحوش الغابة، أو كشبل بين قطعان الغنم، الذي إن اقتحم يدوس ويفترس وليس من منقذ."]]}], "kwAr": "وتنهبهم بقية شعبي", "noteAr": ""}], "arS": [["لذلك", ["H3651"]], ["، كما ", []], ["أنا", ["H589"]], [" ", []], ["حي", ["H2416"]], ["، ", []], ["يقول", ["H5002"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["القدير", ["H6635"]], [" ", []], ["إله", ["H430"]], [" ", []], ["إسرائيل", ["H3478"]], ["، ", []], ["ليصبحن", ["H3588", "H1961"]], [" أهل ", []], ["موآب", ["H4124"]], [" ", []], ["كسدوم", ["H5467"]], ["، ", []], ["والعمونيون", ["H5983"]], [" ", []], ["كعمورة", ["H6017"]], ["، ", []], ["منبتا", ["H4476"]], [" ", []], ["للقريص", ["H2738"]], [" ", []], ["وحفرة", ["H4417"]], [" ", []], ["للملح", ["H4379"]], [" ", []], ["وخرابا", ["H8077"]], [" إلى ", []], ["الأبد", ["H5704", "H5769"]], ["، ", []], ["وتنهبهم", ["H962"]], [" ", []], ["بقية", ["H7611"]], [" ", []], ["شعبي", ["H5971"]], [" ", []], ["ويمتلكهم", ["H5157"]], [" ", []], ["الناجون", ["H3499"]], [" من ", []], ["أمتي", ["H1471"]], [".", []]]}, {"c": 2, "v": 10, "text": "هذا ما يجنونه لقاء تشامخهم، لأنهم احتقروا وتباهوا على شعب الرب القدير.", "groups": [{"kw": "for", "raw": "Zep_2:8; Isa_16:6; Jer_48:29; Dan_4:37, Dan_5:20-23; Oba_1:3; 1Pe_5:5", "note": "", "refs": [{"l": "Zep 2:8", "n": "", "vs": [[8, "قد سمعت تعيير موآب وتجاديف بني عمون، وكيف احتقروا شعبي وهددوا تخمهم."]]}, {"l": "Isa 16:6", "n": "", "vs": [[6, "قد سمعنا بكبرياء موآب، وبعجرفتها وغطرستها الطاغيتين، وبغرورها وصلفها، ولكن كل افتخارها باطل."]]}, {"l": "Jer 48:29", "n": "", "vs": [[29, "قد سمعنا عن عجرفة موآب المفرطة. إنه شديد الكبرياء. سمعنا عن غطرسته وتشامخه وغروره، وعن ارتفاع قلبه."]]}, {"l": "Dan 4:37", "n": "", "vs": [[37, "فالآن، أنا نبوخذناصر، أسبح وأمجد وأحمد ملك السماء الذي جميع أعماله حق، وطرقه عادلة وقادر على إذلال كل من يسلك بالكبرياء."]]}, {"l": "Dan 5:20-23", "n": "", "vs": [[20, "وعندما شمخ قلبه وقست روحه تعنتا، عزل عن عرش ملكه وجرد من جلاله،"], [21, "وطرد من بين الناس، وماثل عقله الحيوانات، وصار مأواه مع الحمير الوحشية، فأطعموه العشب كالثيران، وابتل جسمه بندى السماء، حتى علم أن الله العلي هو المتسلط في مملكة الناس، وأنه يولي عليها من يشاء."], [22, "وأنت يابيلشاصر ابنه لم يتواضع قلبك، مع علمك بكل هذا،"], [23, "بل تغطرست على رب السماء، فأحضروا أمامك آنية هيكله لتشرب بها الخمر، أنت ونبَلاء دولتك وزوجاتك ومحظياتك، وسبحت آلهة الفضة والذهب والنحاس والحديد والخشب والحجر التي لا تبصر ولا تسمع ولا تدرك، أما الله الذي بيده روحك وله كل طرقك، فلم تمجده."]]}, {"l": "Oba 1:3", "n": "", "vs": [[3, "قد غرتك كبرياء قلبك أيها المقيم في شقوق الصخور، ومساكنه في القمم، القائل في قلبه: من يهوي بي إلى الأرض؟"]]}, {"l": "1Pe 5:5", "n": "", "vs": [[5, "كذلك، أيها الشباب، اخضعوا للشيوخ. البسوا جميعا ثوب التواضع في معاملتكم بعضكم لبعض. لأن الله يقاوم المتكبرين، ولكنه يعطي المتواضعين نعمة."]]}], "kwAr": "لقاء تشامخهم", "noteAr": ""}, {"kw": "and magnified", "raw": "Exo_9:17, Exo_10:3; Isa_10:12-15, Isa_37:22-29; Eze_38:14-18", "note": "", "refs": [{"l": "Exo 9:17", "n": "", "vs": [[17, "وها أنت مازلت تقاوم شعبي ولا تطلقه."]]}, {"l": "Exo 10:3", "n": "", "vs": [[3, "فمثل موسى وهرون أمام فرعون وقالا له: «هذا ما يعلنه الرب إله العبرانيين: إلى متى تأبى أن تخضع لي؟ أطلق شعبي ليعبدني."]]}, {"l": "Isa 10:12-15", "n": "", "vs": [[12, "ولكن حالما ينتهي الرب من عمله بجبل صهيون، فإنه سيعاقب ملك أشور على غرور قلبه وتشامخ عينيه،"], [13, "لأنه يقول: بقوة ذراعي قد صنعت هذا، وبحكمتي، لأنني فهيم! قد نقلت تخوم الأمم، ونهبت كنوزهم، وعزلت الجالسين على العروش كما يفعل ذو البطش."], [14, "وكما تستحوذ يد الإنسان على العش، هكذا استحوذت يدي على ثروات الشعوب. وكما يجمع الإنسان البيض المهجور، هكذا جمعت الأرض بأسرها، فلم يجرؤ أحد أن يحرك جناحا أو يفتح فاها أو ينبس بهمسة."], [15, "أتزهو الفأس على من يقطع بها، أم يتعظم المنشار على من ينشر به، وكأن القضيب يحرك رافعه، أو كأن العصا ترفع ما ليس خشبا؟!"]]}, {"l": "Isa 37:22-29", "n": "", "vs": [[22, "وهذا هو رد الرب عليه: ها العذراء ابنة صهيون قد احتقرتك واستهزأت بك، وهزت ابنة أورشليم رأسها سخرية منك."], [23, "من عيرت وجدفت؟ وعلى من رفعت صوتك وشمخت بعينيك زهوا؟ أعلى قدوس إسرائيل؟"], [24, "لقد عيرت السيد على لسان رسلك، وقلت: بكثرة مركباتي قد صعدت إلى أعالي الجبال، وبلغت أقاصي لبنان قاطعا أطول أرزه وخيار سروه واخترقت أبعد ربوعه وأفضل غاباته."], [25, "قد حفرت آبارا وشربت مياها، وبباطن قدمي جففت جميع خلجان مصر."], [26, "ألم تسمع؟ منذ زمن طويل قد قدرت ذلك. منذ الأيام القديمة قررته وها أنا الآن أحققه، إذ أقمتك لتدمير مدن محصنة فتحولها إلى روابي خربة."], [27, "خارت قوى أهلها فأصبحوا مرتاعين خجلين، صاروا كعشب الحقل، كالنبات الأخضر وكحشيش السطوح الذاوي قبل نموه."], [28, "ولكني مطلع على حركاتك وسكناتك وهيجانك علي."], [29, "ولأن ثورتك علي وعجرفتك قد بلغتا مسامعي، فإني سأشكمك بخزامتي في أنفك، وأضع لجامي في فمك، وأعيدك في نفس الطريق الذي أقبلت منه."]]}, {"l": "Eze 38:14-18", "n": "", "vs": [[14, "لذلك تنبأ ياابن آدم، وقل لجوج هذا ما يعلنه السيد الرب: في ذلك اليوم عندما يسكن شعبي إسرائيل آمنا، ألا تعلم ذلك؟"], [15, "وتقبل أنت من مقرك في أقاصي الشمال مع جيوش غفيرة، تغشي الأرض؛ كلهم راكبو خيل وجمع عظيم وجيش كثير."], [16, "وتزحف على شعبي إسرائيل كسحابة تغطي الأرض، أني في الأيام الأخيرة آتي بك إلى أرضي لكي تعرفني الشعوب عندما تتجلى قداستي حين أدمرك ياجوج أمام عيونهم.هذا ما يقوله السيد الرب:"], [17, "ألست أنت الذي تحدثت عنه في الأيام الغابرة على ألسنة عبيدي أنبياء إسرائيل الذين تنبأوا في تلك الأيام لسنين كثيرة بأني سآتي بك عليهم؟"], [18, "ويقول السيد الرب: في ذلك اليوم عندما يزحف جوج على أرض إسرائيل يحتدم غضبي في وجهي."]]}], "kwAr": "وتباهوا", "noteAr": ""}], "arS": [["هذا", ["H2063"]], [" ما يجنونه ", []], ["لقاء", ["H8478"]], [" ", []], ["تشامخهم", ["H1347"]], ["، ", []], ["لأنهم", ["H3588"]], [" ", []], ["احتقروا", ["H2778"]], [" ", []], ["وتباهوا", ["H1431"]], [" ", []], ["على", ["H5921"]], [" ", []], ["شعب", ["H5971"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["القدير", ["H6635"]], [".", []]]}, {"c": 2, "v": 11, "text": "سيكون الرب مثار رعبهم حين يحطم جميع آلهة الأرض، فيسجد له آنئذ جميع الناس، كل في موضعه، في كل ديار المسكونة.", "groups": [{"kw": "for", "raw": "Deu_32:38; Hos_2:17; Zec_13:2", "note": "", "refs": [{"l": "Deu 32:38", "n": "", "vs": [[38, "التي كانت تلتهم شحم ذبائحهم وتشرب خمر سكائبهم؟ لتهب لمساعدتهم وتبسط عليهم حمايتها."]]}, {"l": "Hos 2:17", "n": "", "vs": [[17, "لأني أنزع أسماء البعل من فمك، ولا يرد ذكرها بأسمائها من بعد."]]}, {"l": "Zec 13:2", "n": "", "vs": [[2, "ويقول الرب القدير: في ذلك اليوم أستأصل أسماء الأصنام من الأرض فلا يعود لها ذكر، وألاشي الأنبياء الكذبة والروح النجس من الأرض."]]}], "kwAr": "حين", "noteAr": ""}, {"kw": "famish", "raw": "Heb. make lean", "note": "Heb. make lean", "refs": [], "kwAr": "يحطم", "noteAr": "بالعبرية: «يهزل»."}, {"kw": "and men", "raw": "Psa_2:8-12, Psa_22:27-30, Psa_72:8-11, Psa_72:17, Psa_86:9, Psa_97:6-8, Psa_117:1, Psa_117:2, Psa_138:4; Isa_2:2-4, Isa_11:9, Isa_11:10; Mic_4:1-3; Zec_2:11, Zec_8:20,Zec_8:23, Zec_14:9-21; Mal_1:11; Joh_4:21-23; 1Ti_2:8; Rev_11:15", "note": "", "refs": [{"l": "Psa 2:8-12", "n": "", "vs": [[8, "اطلب مني فأعطيك الأمم ميراثا، وأقاصي الأرض ملكا لك."], [9, "فتكسرهم بقضيب من حديد، وتحطمهم كآنية الفخار»."], [10, "والآن تعقلوا أيها الملوك، واحذروا ياحكام الأرض."], [11, "اعبدوا الرب بخوف، وابتهجوا برعدة."], [12, "قبلوا الابن لئلا يغضب، فتهلكوا في الطريق، لئلا يتوهج غضبه سريعا. طوبى لجميع المتكلين عليه."]]}, {"l": "Psa 22:27-30", "n": "", "vs": [[27, "تتذكر جميع أقاصي الأرض وترجع إلى الرب، وتتعبد أمامك جميع قبائل الأمم."], [28, "لأن الملك للرب، وهو يتسلط على الأمم."], [29, "جميع عظماء الأرض يحتفلون ويسجدون. ينحني أمامه الهابطون إلى التراب والفانون،"], [30, "يتعبد نسلهم لله، ويتحدثون عن الرب للجيل الآتي."]]}, {"l": "Psa 72:8-11", "n": "", "vs": [[8, "ولتمتد مملكته من البحر إلى البحر، ومن النهر إلى أقاصي الأرض."], [9, "أمامه يركع أهل البادية، وأعداؤه يلحسون التراب."], [10, "ملوك ترشيش والجزر يحملون إليه الهدايا. ملوك شبا وسبَإ يقدمون عطايا."], [11, "ينحني أمامه جميع الملوك. وتتعبد له كل الأمم."]]}, {"l": "Psa 72:17", "n": "", "vs": [[17, "يخلد اسمه إلى الدهر، ويدوم اسمه كديمومة الشمس، ويتبارك الناس به، وتطوبه كل الأمم."]]}, {"l": "Psa 86:9", "n": "", "vs": [[9, "تقبل جميع الأمم التي صنعتها لتسجد أمامك يارب وتمجد اسمك."]]}, {"l": "Psa 97:6-8", "n": "", "vs": [[6, "أذاعت السماوات عدله ويرى جميع الشعوب مجده."], [7, "يخزى كل عابدي التماثيل المنحوتة، المفتخرين بالأصنام. اسجدوا له ياجميع الآلهة."], [8, "سمعت صهيون ففرحت، وابتهجت بنات يهوذا بأحكامك يارب."]]}, {"l": "Psa 117:1", "n": "", "vs": [[1, "سبحوا الرب يا جميع الأمم، ومجدوه يا كل الشعوب."]]}, {"l": "Psa 117:2", "n": "", "vs": [[2, "لأن رحمته غلبت علينا، وأمانة الرب إلى الأبد تدوم. هللويا!"]]}, {"l": "Psa 138:4", "n": "", "vs": [[4, "يحمدك جميع ملوك الأرض يارب، متى سمعوا وعودك."]]}, {"l": "Isa 2:2-4", "n": "", "vs": [[2, "ويحدث في آخر الأيام، أن جبل هيكل الرب يصبح أسمى من كل الجبال، ويعلو فوق كل التلال، فتتوافد إليه جميع الأمم."], [3, "وتقبل شعوب كثيرة وتقول: تعالوا لنذهب إلى جبل الرب، إلى بيت إله يعقوب، فيعلمنا طرقه، ونسلك في سبله، لأن من صهيون تخرج الشريعة، ومن أورشليم تعلن كلمة الرب."], [4, "فيقضي بين الأمم ويحكم بين الشعوب الكثيرة، فيطبعون سيوفهم محاريث ورماحهم مناجل، ولا ترفع أمة على أمة سيفا، ولا يتدربون على الحرب فيما بعد."]]}, {"l": "Isa 11:9", "n": "", "vs": [[9, "لا يؤذون ولا يسيئون في كل جبل قدسي، لأن الأرض تمتليء من معرفة الرب كما تغمر المياه البحر."]]}, {"l": "Isa 11:10", "n": "", "vs": [[10, "في ذلك اليوم ينتصب أصل يسى راية للأمم، وإليه تسعى جميع الشعوب، ويكون مسكنه مجيدا."]]}, {"l": "Mic 4:1-3", "n": "", "vs": [[1, "ويكون في آخر الأيام أن جبل هيكل الرب يصبح أشهر الجبال، ويعلو فوق كل التلال، فتتقاطر إليه شعوب عديدة،"], [2, "وتقبل إليه أمم كثيرة قائلة: «تعالوا لنصعد إلى جبل الرب، إلى هيكل يعقوب ليعلمنا طرقه فنسلك في سبله، لأن من صهيون تخرج الشريعة ومن أورشليم تذاع كلمة الرب»."], [3, "فيقضي بين الأمم الكثيرة ويملي أحكامه بعدل على أمم قوية بعيدة، فيصنعون من سيوفهم أسنة محاريث، ومن رماحهم مناجل حصاد، فلا ترفع أمة على أمة سيفا ولا يتلقنون فنون الحرب بعد."]]}, {"l": "Zec 2:11", "n": "", "vs": [[11, "فتنضم أمم كثيرة في ذلك اليوم إلى الرب ويكونون لي شعبا، فأقيم في وسطك، فتدركين أن الرب القدير قد أرسلني إليك."]]}, {"l": "Zec 8:20", "n": "", "vs": [[20, "وستأتي شعوب أيضا وأفواج من سكان مدن كثيرة إلى أورشليم."]]}, {"l": "Zec 8:23", "n": "", "vs": [[23, "في تلك الأيام يتشبث عشرة رجال من أبناء الأمم بثوب رجل يهودي قائلين: دعنا نذهب معكم، لأننا سمعنا أن الرب معكم»."]]}, {"l": "Zec 14:9-21", "n": "", "vs": [[9, "ويملك الرب على الأرض كلها، فيكون في ذلك اليوم رب واحد لا يذكر سوى اسمه."], [10, "وتتحول الأرض كلها من جبع شمالا إلى رمون جنوبا، إلى سهل كسهل عربة. أما أورشليم فلا تبرح شامخة في موقعها الممتد من بوابة بنيامين حتى البوابة الأولى وإلى بوابة الزوايا، ومن برج حننئيل إلى معاصر خمر الملك."], [11, "وتصبح آهلة إذ لن يحل بها دمار ثانية، وتكون أورشليم آمنة."], [12, "وهذا هو البلاء الذي يعاقب به الرب جميع الشعوب الذين اجتمعوا على أورشليم: تتهرأ لحومهم وهم واقفون على أرجلهم، وتتآكل عيونهم في أوقابها، وتتلف ألسنتهم في أفواههم."], [13, "في ذلك اليوم يلقي الرب الرعب في قلوبهم حتى ترتفع يد الرجل ضد يد رفيقه في آن واحد ويهلكان معا."], [14, "ويحارب أبناء يهوذا أيضا دفاعا عن أورشليم، ويغنمون ثروات من الأمم المحيطة بها من ذهب وفضة وأثواب، بوفرة عظيمة."], [15, "ويصيب بلاء مماثل الخيول والبغال والجمال والحمير وسائر البهائم الموجودة داخل هذه المعسكرات."], [16, "فيصعد الناجون من الأمم التي تألبت على أورشليم، سنة بعد سنة ليعبدوا الملك الرب القدير ويحتفلوا بعيد المظال."], [17, "وإن تقاعست أية عشيرة من عشائر أمم الأرض عن الصعود إلى أورشليم لتسجد للملك الرب القدير، يمتنع المطر عن الهطول على ديارهم."], [18, "وإن أبى أهل مصر الصعود للاشتراك في الاحتفال، يحل بهم البلاء الذي يعاقب به الرب الأمم التي لا تجيء للاحتفال بعيد المظال."], [19, "هذا هو عقاب مصر وعقاب سائر الشعوب التي تأبى المجيء للاحتفال بعيد المظال."], [20, "وينقش في ذلك اليوم على أجراس الخيل: «قدس للرب». وتكون القدور في الهيكل مقدسة كالمناضح التي أمام المذبح."], [21, "بل يكون كل قدر في أورشليم وفي يهوذا مقدسا للرب القدير، فيصبح في وسع المقربين أن يأتوا ويستخدموا ما يشاؤون منها، ليطبخوا فيها لحم الذبيحة. ولا يبقى في هيكل الرب القدير تجار في ذلك اليوم."]]}, {"l": "Mal 1:11", "n": "", "vs": [[11, "لأنه من مشرق الشمس إلى مغربها اسمي عظيم بين الأمم، وفي كل مكان يحرق لاسمي بخور وذبائح طاهرة، لأن اسمي عظيم بين الأمم، يقول الرب القدير."]]}, {"l": "Joh 4:21-23", "n": "", "vs": [[21, "فأجابها يسوع: «صدقيني ياامرأة، ستأتي الساعة التي فيها تعبدون الآب لا في هذا الجبل ولا في أورشليم."], [22, "أنتم تعبدون ما تجهلون، ونحن نعبد ما نعلم، لأن الخلاص هو من عند اليهود."], [23, "فستأتي ساعة، لا بل هي الآن، حين يعبد العابدون الصادقون الآب بالروح وبالحق. لأن الآب يبتغي مثل هؤلاء العابدين."]]}, {"l": "1Ti 2:8", "n": "", "vs": [[8, "فأريد إذن، أن يصلي الرجال في كل مكان، رافعين أيادي طاهرة، وهم لا يضمرون أي حقد أو شكوك."]]}, {"l": "Rev 11:15", "n": "", "vs": [[15, "ونفخ الملاك السابع في بوقه فسمعت أصوات عالية في السماء تقول: «قد صار ملك العالم لربنا ومسيحه. إنه يملك إلى أبد الآبدين»."]]}], "kwAr": "فيسجد له", "noteAr": ""}, {"kw": "the isles", "raw": "Gen_10:5; Isa_24:14-16, Isa_42:4, Isa_42:10, Isa_49:1", "note": "", "refs": [{"l": "Gen 10:5", "n": "", "vs": [[5, "وتفرع من هؤلاء سكان الجزائر وتفرقوا في مناطقهم حسب قبائلهم وأممهم، ولغاتهم."]]}, {"l": "Isa 24:14-16", "n": "", "vs": [[14, "هؤلاء الباقون يرفعون أصواتهم ويهتفون بفرح، ويشدون من الغرب بجلال الرب."], [15, "لذلك مجدوا الرب في المشرق، مجدوا اسم الرب إله إسرائيل في جزائر البحر."], [16, "من أقاصي المعمورة سمعنا تسابيح مجد قائلة: «المجد للبار». ولكني قلت: أنا هالك! أنا هالك ويل لي لأن الخونة يمارسون الخيانة. الخونة يمارسون الخيانة."]]}, {"l": "Isa 42:4", "n": "", "vs": [[4, "لا يكل ولا تثبط له همة حتى يرسخ العدل في الأرض، وتنتظر الجزائر شريعته."]]}, {"l": "Isa 42:10", "n": "", "vs": [[10, "غنوا للرب أغنية جديدة، سبحوه من أقاصي الأرض أيها المسافرون في عباب البحر وكل ما فيه وياسكان الجزائر."]]}, {"l": "Isa 49:1", "n": "", "vs": [[1, "أنصتي إلي أيتها الجزائر، واصغوا ياشعوب البلاد البعيدة: قد دعاني الرب وأنا مازلت جنينا، وذكر اسمي وأنا ما برحت في رحم أمي."]]}], "kwAr": "في كل ديار المسكونة", "noteAr": ""}], "arS": [["سيكون ", []], ["الرب", ["H3068"]], [" مثار ", []], ["رعبهم", ["H3372"]], [" ", []], ["حين", ["H3588"]], [" ", []], ["يحطم", ["H7329"]], [" ", []], ["جميع", ["H3605"]], [" ", []], ["آلهة", ["H430"]], [" ", []], ["الأرض", ["H776"]], ["، ", []], ["فيسجد", ["H7812"]], [" له آنئذ جميع الناس، ", []], ["كل", ["H376"]], [" في ", []], ["موضعه", ["H4480", "H4725"]], ["، في ", []], ["كل", ["H3605"]], [" ", []], ["ديار", ["H339"]], [" ", []], ["المسكونة", ["H1471"]], [".",
