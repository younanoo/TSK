 "فاستجب أنت من السماء مقر سكناك، وافعل كل ما يناشدك به الغريب، فيدعى باسمك بين كل أمم الأرض، فيخافوك كما يخافك شعبك إسرائيل، ويدركوا أن اسمك قد دعي على هذا الهيكل الذي بنيته."]]}, {"l": "Psa 22:27", "n": "", "vs": [[27, "تتذكر جميع أقاصي الأرض وترجع إلى الرب، وتتعبد أمامك جميع قبائل الأمم."]]}, {"l": "Psa 86:9", "n": "", "vs": [[9, "تقبل جميع الأمم التي صنعتها لتسجد أمامك يارب وتمجد اسمك."]]}, {"l": "Psa 86:10", "n": "", "vs": [[10, "فإنك عظيم وصانع عجائب. أنت الله وحدك."]]}, {"l": "Psa 113:3", "n": "", "vs": [[3, "ليسبح باسم الرب من مشرق الشمس إلى مغربها."]]}, {"l": "Jer 16:19", "n": "", "vs": [[19, "يارب أنت عزي وحصني وملاذي في يوم الضيق، إليك تقبل الأمم من أقاصي الأرض قائلة: «لم يرث آباؤنا سوى الباطل والأكاذيب وما لا جدوى منه."]]}, {"l": "Hab 2:14", "n": "", "vs": [[14, "لأن الأرض ستمتليء من معرفة مجد الرب كما تغمر المياه البحر."]]}, {"l": "Zec 2:11", "n": "", "vs": [[11, "فتنضم أمم كثيرة في ذلك اليوم إلى الرب ويكونون لي شعبا، فأقيم في وسطك، فتدركين أن الرب القدير قد أرسلني إليك."]]}, {"l": "Zec 8:20-23", "n": "", "vs": [[20, "وستأتي شعوب أيضا وأفواج من سكان مدن كثيرة إلى أورشليم."], [21, "ويمضي أهل المدينة الواحدة إلى المدينة الأخرى قائلين: هيا نذهب على الفور لنطلب رضى وجه الرب القدير ونلتمس بركته، لأننا على أي حال منطلقون إلى هناك."], [22, "فتتوافد أمم كثيرة وشعوب قوية ليلتمسوا وجه الرب القدير في أورشليم وليحظوا برضاه."], [23, "في تلك الأيام يتشبث عشرة رجال من أبناء الأمم بثوب رجل يهودي قائلين: دعنا نذهب معكم، لأننا سمعنا أن الرب معكم»."]]}, {"l": "Zec 14:9", "n": "", "vs": [[9, "ويملك الرب على الأرض كلها، فيكون في ذلك اليوم رب واحد لا يذكر سوى اسمه."]]}, {"l": "Act 2:4-13", "n": "", "vs": [[4, "فامتلأوا جميعا من الروح القدس، وأخذوا يتكلمون بلغات أخرى، مثلما منحهم الروح أن ينطقوا."], [5, "وكانت أورشليم في ذلك الوقت مزدحمة باليهود الأتقياء الذين جاءوا إليها من أمم العالم كلها."], [6, "فلما دوى الصوت، توافدت إليهم الجموع، وقد أخذتهم الحيرة لأن كل واحد كان يسمعهم يتكلمون بلغته."], [7, "واستولت الدهشة عليهم. فأخذوا يتساءلون: «أليس هؤلاء المتكلمون جميعا من أهل الجليل؟"], [8, "فكيف يسمع كل واحد منا لغة البلد الذي ولد فيه؟"], [9, "فبعضنا فرتيون، وماديون، وعيلاميون. وبعضنا من سكان ما بين النهرين واليهودية، وكبدوكية، وبنتس، وأسيا،"], [10, "وفريجية، وبمفيلية، ومصر، ونواحي ليبيا المواجهة للقيروان. وبيننا كثيرون من الرومانيين الزائرين،"], [11, "يهودا ومتهودين، وبعض الكريتيين والعرب. وها نحن نسمعهم يكلموننا بلغاتنا عن أعمال الله العظيمة»."], [12, "وأخذ الجميع يسألون بعضهم بعضا في دهشة وحيرة: «ما معنى هذا كله؟»"], [13, "أما بعضهم فقالوا ساخرين: «ما هم إلا سكارى!»"]]}, {"l": "Rom 15:6-11", "n": "", "vs": [[6, "لكي تمجدوا الله أبا ربنا يسوع المسيح بنفس واحدة وفم واحد."], [7, "لذلك اقبلوا بعضكم بعضا، كما أن المسيح أيضا قبلنا لمجد الله."], [8, "فإني أقول إن المسيح صار خادم أهل الختان إظهارا لصدق الله وتوطيدا لوعوده للآباء،"], [9, "وإن الأمم يمجدون الله على الرحمة، وفقا لما قد كتب: «لهذا أعترف لك بين الأمم وأرتل لاسمك!»"], [10, "وأيضا قيل: «افرحوا، أيها الأمم، مع شعبه»."], [11, "وأيضا: «سبحوا الرب ياجميع الأمم، ولتحمده جميع الشعوب»."]]}, {"l": "Rev 11:15", "n": "", "vs": [[15, "ونفخ الملاك السابع في بوقه فسمعت أصوات عالية في السماء تقول: «قد صار ملك العالم لربنا ومسيحه. إنه يملك إلى أبد الآبدين»."]]}], "kwAr": "ليدعوا", "noteAr": ""}, {"kw": "consent", "raw": "Heb. shoulder", "note": "Heb. shoulder", "refs": [], "kwAr": "جنبا إلى جنب", "noteAr": "بالعبرية: «كتف»."}], "arS": [["عندئذ", ["H227"]], [" ", []], ["أنقي", ["H2015", "H1305"]], [" ", []], ["شفاه", ["H8193"]], [" ", []], ["الشعب", ["H5971"]], [" ", []], ["ليدعوا", ["H7121"]], [" ", []], ["جميعهم", ["H3605"]], [" ", []], ["باسم", ["H8034"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["ويعبدوه", ["H5647"]], [" ", []], ["جنبا", ["H259"]], [" إلى ", []], ["جنب", ["H7926"]], [".", []]]}, {"c": 3, "v": 10, "text": "فيقرب إلي شعبي المشتت ذبيحة من وراء أنهار كوش حيث يقيم المتضرعون إلي.", "groups": [{"kw": "", "raw": "Psa_68:31, Psa_72:8-11; Isa_11:11, Isa_18:1, 7-19:15, Isa_27:12, Isa_27:13, Isa_49:20-23; Isa_60:4-12, Isa_66:18-21; Mal_1:11; Act_8:27, Act_24:17; Rom_11:11, Rom_11:12, Rom_15:16; 1Pe_1:1", "note": "", "refs": [{"l": "Psa 68:31", "n": "", "vs": [[31, "يفد إليك شرفاء من مصر (ليقدموا الولاء) وتبسط الحبشة يديها مسرعة إعرابا عن خضوعها لله."]]}, {"l": "Psa 72:8-11", "n": "", "vs": [[8, "ولتمتد مملكته من البحر إلى البحر، ومن النهر إلى أقاصي الأرض."], [9, "أمامه يركع أهل البادية، وأعداؤه يلحسون التراب."], [10, "ملوك ترشيش والجزر يحملون إليه الهدايا. ملوك شبا وسبَإ يقدمون عطايا."], [11, "ينحني أمامه جميع الملوك. وتتعبد له كل الأمم."]]}, {"l": "Isa 11:11", "n": "", "vs": [[11, "فيعود الرب ليمد يده ثانية ليسترد البقية الباقية من شعبه، من أشور ومصر وفتروس وكوش وعيلام وشنعار وحماة، ومن جزائر البحر،"]]}, {"l": "Isa 18:1", "n": "", "vs": [[1, "ويل لأرض حفيف الأجنحة في عبر أنهار كوش،"]]}, {"l": "Isa 19:15", "n": "", "vs": [[15, "فلم يبق لعظمائها أو أدنيائها ما يفعلونه فيها."]]}, {"l": "Isa 27:12", "n": "", "vs": [[12, "في ذلك اليوم ينتقيكم الرب من مجرى الفرات إلى وادي النيل، كما ينتقى القمح، ويجمعكم واحدا فواحدا يا بني إسرائيل."]]}, {"l": "Isa 27:13", "n": "", "vs": [[13, "في ذلك اليوم ينفخ في بوق عظيم فيأتي التائهون في أرض أشور، والمنفيون إلى ديار مصر، ليسجدوا للرب في جبل قدسه، في أورشليم."]]}, {"l": "Isa 49:20-23", "n": "", "vs": [[20, "ويقول أيضا في مسامعك بنوك المولودون في أثناء ثكلك: إن المكان أضيق من أن يسعنا، فأفسحي لنا حتى نسكن."], [21, "فتسألين نفسك: من أنجب لي هؤلاء وأنا ثكلى وعاقر، منفية ومنبوذة؟ من ربى لي هؤلاء؟ فقد تركت وحدي، أما هؤلاء فمن أين جاءوا؟"], [22, "وهذا ما يقوله السيد الرب: ها أنا أرفع يدي إلى الأمم وأنصب رايتي إلى الشعوب، فيحملون أبناءك في أحضانهم وبناتك على أكتافهم."], [23, "يكون لك الملوك آباء مربين، وملكاتهم مرضعات، ينحنون أمامك بوجوه مطرقة إلى الأرض، ويلحسون تراب قدميك. عندئذ تدركين أنني أنا الرب، وكل من يتكل علي لا يخزى»."]]}, {"l": "Isa 60:4-12", "n": "", "vs": [[4, "تأملي حولك وانظري، فها هم جميعا قد اجتمعوا، وأتوا إليك. يجيء أبناؤك من مكان بعيد، وتحمل بناتك على الأذرع."], [5, "عندئذ تنظرين وتتهللين، وتطغى الإثارة على قلبك، وتمتلئين فرحا لأن ثروات البحر تتحول إليك وغنى الأمم يتدفق عليك."], [6, "تكتظ أرضك بكثرة الإبل. من أرض مديان وعيفة تغشاك بكران، تتقاطر إليك من شبا محملة بالذهب واللبان وتذيع تسبيح الرب."], [7, "جميع قطعان قيدار تجتمع إليك، وكباش نبايوت تخدمك، تقدم قرابين مقبولة على مذبحي، وأمجد بيتي البهي."], [8, "من هؤلاء الطائرون كالسحاب وكالحمام إلى أعشاشها؟"], [9, "فالجزائر تنتظرني، وفي الطليعة سفن ترشيش حاملة أبناءك لتأتي بهم من أرض بعيدة، ومعهم فضتهم وذهبهم، تكريما لاسم الرب إلهك ولقدوس إسرائيل لأنه قد مجدك."], [10, "يعمر الغرباء أسوارك، ويخدمك ملوكهم، لأني في غضبي عاقبتك، وفي رضاي رحمتك."], [11, "تنفتح أبوابك دائما ولا توصد ليل نهار، ليحمل إليك الناس ثروة الأمم، وفي موكب يساق إليك ملوكهم،"], [12, "لأن الأمة والمملكة التي لا تخضع لك تهلك، وهذه الشعوب تتعرض للخراب الساحق."]]}, {"l": "Isa 66:18-21", "n": "", "vs": [[18, "ولأني عالم بأعمالهم وأفكارهم فأنا مزمع أن آتي لأجمع كل الأمم والألسنة، فيتوافدون ويرون مجدي"], [19, "وأجعل بينهم آية وأبعث بعض الناجين منهم إلى الأمم: إلى ترشيش، وفول، ولود، المهرة في رمي السهام، وإلى توبال وياوان وإلى الجزائر البعيدة ممن لم يسمعوا بشهرتي أو يروا مجدي، فيذيعون مجدي بين الأمم."], [20, "ويحضرون جميع إخوتكم من سائر الأمم، تقدمة للرب، على متون الجياد، وفي المركبات والهوادج، وعلى ظهور البغال وأسنمة الجمال، إلى أورشليم جبل قدسي، كما يحضر الإسرائيليون تقدمة الحنطة في آنية طاهرة إلى بيت الرب"], [21, "ومنهم أصطفي كهنة ولاويين يقول الرب."]]}, {"l": "Mal 1:11", "n": "", "vs": [[11, "لأنه من مشرق الشمس إلى مغربها اسمي عظيم بين الأمم، وفي كل مكان يحرق لاسمي بخور وذبائح طاهرة، لأن اسمي عظيم بين الأمم، يقول الرب القدير."]]}, {"l": "Act 8:27", "n": "", "vs": [[27, "فقام وذهب. وإذا رجل حبشي، خصي، يعمل وزيرا للشؤون المالية عند كنداكة ملكة الحبشة، كان قد حج إلى أورشليم للسجود فيها،"]]}, {"l": "Act 24:17", "n": "", "vs": [[17, "وبعد غياب عدة سنوات عن أورشليم، رجعت إليها أحمل بعض التبرعات إلى شعبي، وأقرب تقدمات."]]}, {"l": "Rom 11:11", "n": "", "vs": [[11, "فأقول إذا: هل تعثروا لكي يسقطوا أبدا؟ حاشا! بل بسقطتهم توفر الخلاص للأمم، لعل ذلك يثير غيرتهم."]]}, {"l": "Rom 11:12", "n": "", "vs": [[12, "فإذا كانت سقطتهم غنى للعالم، وخسارتهم غنى للأمم، فكم بالأحرى يكون اكتمالهم...؟"]]}, {"l": "Rom 15:16", "n": "", "vs": [[16, "وبذلك أكون خادم المسيح يسوع، المرسل إلى الأمم، حاملا إنجيل الله وكأني أقوم بخدمة كهنوتية، بقصد أن ترفع لله من بين الأمم تقدمة تكون مقبولة ومقدسة بالروح القدس."]]}, {"l": "1Pe 1:1", "n": "", "vs": [[1, "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"]]}], "kwAr": "", "noteAr": ""}], "arS": [["فيقرب", ["H2986"]], [" إلي ", []], ["شعبي", ["H1323"]], [" ", []], ["المشتت", ["H6327"]], [" ", []], ["ذبيحة", ["H4503"]], [" من ", []], ["وراء", ["H4480", "H5676"]], [" ", []], ["أنهار", ["H5104"]], [" ", []], ["كوش", ["H3568"]], [" حيث يقيم ", []], ["المتضرعون", ["H6282"]], [" إلي.", []]]}, {"c": 3, "v": 11, "text": "في ذلك اليوم لن يلحقكم العار من جراء ما ارتكبتم من أعمال تمردتم بها علي، لأني سأزيل آنئذ من وسطكم المستخفين المتكبرين، فلا يبقى متشامخ في جبلي المقدس.", "groups": [{"kw": "shalt thou", "raw": "Zep_3:19, Zep_3:20; Psa_49:5; Isa_45:17, Isa_54:4, Isa_61:7, Isa_65:13, Isa_65:14; Joe_2:26, Joe_2:27; Rom_9:33; 1Pe_2:6", "note": "", "refs": [{"l": "Zep 3:19", "n": "", "vs": [[19, "في ذلك الوقت أعاقب الذين ضايقوك، وأخلص الأعرج، وأعيد المسبي، وأغدق عليهم مدحا وشرفا في كل أرض تعرضوا فيها للخزي."]]}, {"l": "Zep 3:20", "n": "", "vs": [[20, "في ذلك الوقت أجمعكم من الشتات وأعيدكم إلى موطنكم، وأجعل لكم مقاما شريفا محمودا بين جميع شعوب الأرض، حين أرد لكم ازدهاركم. هكذا قال الرب."]]}, {"l": "Psa 49:5", "n": "", "vs": [[5, "لماذا أخاف في أيام الخطر عندما يحيط بي شر مطاردي؟"]]}, {"l": "Isa 45:17", "n": "", "vs": [[17, "أما إسرائيل فقد خلصه الرب بخلاص أبدي، ولن يلحقكم عار أو خزي مدى الدهور،"]]}, {"l": "Isa 54:4", "n": "", "vs": [[4, "لا تجزعي لأنك لن تخزي، ولا تخجلي لأنه لن يلحق بك عار، فأنت ستنسين خزي صباك، ولن تذكري من بعد عار ترملك."]]}, {"l": "Isa 61:7", "n": "", "vs": [[7, "وعوضا عن عاركم تنالون ضعفين من الميراث، وعوضا عن الهوان تبتهجون بنصيبكم، لهذا تملكون في أرضكم نصيبين، ويكون فرحكم أبديا."]]}, {"l": "Isa 65:13", "n": "", "vs": [[13, "لذلك هكذا يقول السيد الرب: ها عبيدي يأكلون وأنتم تجوعون، ويشربون وأنتم تظمأون، ويفرحون وأنتم تخزون،"]]}, {"l": "Isa 65:14", "n": "", "vs": [[14, "ويترنمون في غبطة القلب وأنتم تعولون من أسى القلب، وتولولون من انكسار الروح،"]]}, {"l": "Joe 2:26", "n": "", "vs": [[26, "فتأكلون بوفرة وتشبعون وتسبحون اسم الرب إلهكم الذي أجرى لكم العجائب، ولن يخزى شعبي ثانية."]]}, {"l": "Joe 2:27", "n": "", "vs": [[27, "فتدركون أني في وسط إسرائيل، وأني أنا هو الرب إلهكم وليس غيري، ولن يخزى شعبي ثانية."]]}, {"l": "Rom 9:33", "n": "", "vs": [[33, "كما كتب: «ها أنا واضع في صهيون حجر عثرة وصخرة سقوط. ومن يؤمن به لا يخيب»."]]}, {"l": "1Pe 2:6", "n": "", "vs": [[6, "وكما يقول الكتاب: «ها أنا أضع في صهيون حجر زاوية، مختارا وثمينا. والذي يؤمن به، لا يخيب!»"]]}], "kwAr": "لن يلحقكم العار", "noteAr": ""}, {"kw": "that rejoice", "raw": "Num_16:3; Isa_48:1, Isa_48:2; Jer_7:4, Jer_7:9-12; Eze_7:20-24, Eze_24:21; Mic_3:11; Mat_3:9; Rom_2:17", "note": "", "refs": [{"l": "Num 16:3", "n": "", "vs": [[3, "هؤلاء تألبوا على موسى وهرون وقالوا: «حسبكما! إن كل الجماعة بأسرها مقدسة، وفي وسطها الرب. فما بالكما تترفعان على جماعة الرب؟»"]]}, {"l": "Isa 48:1", "n": "", "vs": [[1, "اسمعوا هذا يابيت يعقوب المدعوين باسم إسرائيل الخارجين من صلب يهوذا، الحالفين باسم الرب، المستشهدين بإله إسرائيل باطلا وكذبا"]]}, {"l": "Isa 48:2", "n": "", "vs": [[2, "الذين يدعون أنفسهم أهل المدينة المقدسة، ويعتمدون على إله إسرائيل، الرب القدير:"]]}, {"l": "Jer 7:4", "n": "", "vs": [[4, "لا تتكلوا على أقوال الكذب قائلين: هذا هيكل الرب: هذا هيكل الرب"]]}, {"l": "Jer 7:9-12", "n": "", "vs": [[9, "أتسرقون وتقتلون وتزنون وتحلفون زورا وتبخرون للبعل، وتضلون وراء الأوثان التي لم تعرفوها،"], [10, "ثم تمثلون في حضرتي في هذا الهيكل الذي دعي باسمي قائلين: «قد نجونا»؛ ثم ترتكبون جميع هذه الرجاسات؟"], [11, "هل أصبح هذا الهيكل الذي دعي باسمي، مغارة لصوص في أعينكم؟ ها أنا قد رأيت كل هذا الشر، يقول الرب."], [12, "لكن امضوا إلى موضعي في شيلوه، حيث جعلت فيه مقرا لاسمي أولا، وشاهدوا ما فعلت به من جراء شر شعبي إسرائيل."]]}, {"l": "Eze 7:20-24", "n": "", "vs": [[20, "حولوا جمال زينة هيكل الرب إلى زهو، وصنعوا من الذهب والفضة تماثيل أرجاسهم وأصنامهم المكروهة، لذلك جعلتها رجاسة لهم."], [21, "أسلمها إلى أيدي الغرباء نهبا، ولأشرار الأرض سلبا فينجسونها."], [22, "وأشيح بوجهي عنهم فيدنسون هيكلي، ويدخل إليه الناهبون وينجسونه."], [23, "اصنع السلسلة لشعبي لأن الأرض قد عمها سفك الدماء، وساد المدينة الجور."], [24, "لذلك، أجلب أشر الأمم فيرثون بيوتهم، وأقضي على كبرياء الأقوياء فتتنجس مقادسهم."]]}, {"l": "Eze 24:21", "n": "", "vs": [[21, "أبلغ شعب إسرائيل: ها أنا مزمع على تنجيس مقدسي فخر عزكم ومشتهى أعينكم، وبهجة نفوسكم، فيتهاوى أبناؤكم وبناتكم الذين خلفتهم وراءكم صرعى بالسيف."]]}, {"l": "Mic 3:11", "n": "", "vs": [[11, "إذ يحكم رؤساؤها بالرشوة، وكهنتها يعلمون بالأجرة ويتعاطى أنبياؤها العرافة لقاء المال، ومع ذلك يدعون الاتكال على الله قائلين: «أليس الرب في وسطنا؟ لذلك لن يصيبنا مكروه»."]]}, {"l": "Mat 3:9", "n": "", "vs": [[9, "ولا تعللوا أنفسكم قائلين: لنا إبراهيم أبا! فإني أقول لكم: إن الله قادر أن يطلع من هذه الحجارة أولادا لإبراهيم."]]}, {"l": "Rom 2:17", "n": "", "vs": [[17, "ولكن، إن كنت تدعى يهوديا؛ وتتكل على الشريعة؛ وتفتخر بالله؛"]]}], "kwAr": "المستخفين المتكبرين", "noteAr": ""}, {"kw": "because of my holy", "raw": "or, in my holy, Psa_87:1, Psa_87:2; Isa_11:9; Dan_9:16, Dan_9:20", "note": "or, in my holy, Psa_87:1, Psa_87:2; Isa_11:9; Dan_9:16, Dan_9:20", "refs": [{"l": "Psa 87:1", "n": "", "vs": [[1, "أسس الله المدينة على الجبال المقدسة."]]}, {"l": "Psa 87:2", "n": "", "vs": [[2, "أحب الرب أبواب صهيون أكثر من جميع مساكن بني يعقوب."]]}, {"l": "Isa 11:9", "n": "", "vs": [[9, "لا يؤذون ولا يسيئون في كل جبل قدسي، لأن الأرض تمتليء من معرفة الرب كما تغمر المياه البحر."]]}, {"l": "Dan 9:16", "n": "", "vs": [[16, "فاصرف ياسيد، حسب رحمتك، سخطك وغضبك عن مدينتك أورشليم جبل قدسك إذ من جراء خطايانا وآثام آبائنا أصبحت أورشليم مثار عار لنا عند جميع المحيطين بنا."]]}, {"l": "Dan 9:20", "n": "", "vs": [[20, "وبينما كنت أصلي وأعترف بخطيئتي وخطيئة شعبي إسرائيل، وأرفع تضرعاتي أمام الرب إلهي من أجل جبل قدس إلهي،"]]}], "kwAr": "في جبلي المقدس", "noteA H8034"]], [" ", []], ["الرب", ["H3068"]], [".", []]]}, {"c": 3, "v": 13, "text": "ولن يرتكب بقية إسرائيل الإثم، ولا ينطقون بالكذب، وليس في أفواههم غش، بل يعيشون آمنين من غير أن يهددهم أحد.", "groups": [{"kw": "remnant", "raw": "Zep_2:7; Isa_6:13, Isa_10:20-22; Mic_4:7; Rom_11:4-7", "note": "", "refs": [{"l": "Zep 2:7", "n": "", "vs": [[7, "ويصبح ساحل البحر ملكا لبقية بيت يهوذا فيرعون فيه قطعانهم، ويرقدون في المساء في بيوت أشقلون، لأن الرب إلههم يفتقدهم ويرد سبيهم."]]}, {"l": "Isa 6:13", "n": "", "vs": [[13, "وحتى لو بقي بعد ذلك عشر أهلها، فإنها ستحرق ثانية، ولكنها تكون كالبطمة والبلوطة، التي وإن قطعت يبقى ساقها قائما: هكذا يبقى ساقها زرعا مقدسا»."]]}, {"l": "Isa 10:20-22", "n": "", "vs": [[20, "في ذلك اليوم لا تعود بقية إسرائيل والناجون منهم يتوكلون على من ضربهم، بل يعتمدون على الرب قدوس إسرائيل بالحق."], [21, "وترجع بقية ذرية يعقوب إلى الرب القدير."], [22, "مع أن شعبك ياإسرائيل كرمل البحر، فإن بقية فقط ترجع، لأن الله قضى بفنائهم، وقضاؤه عادل."]]}, {"l": "Mic 4:7", "n": "", "vs": [[7, "فأجعل من العرج بقية، ومن المنبوذين أمة قوية، فيملك الرب عليهم في جبل صهيون من الآن وإلى الأبد."]]}, {"l": "Rom 11:4-7", "n": "", "vs": [[4, "ولكن، ماذا كان الجواب الإلهي له؟: «أبقيت لنفسي سبعة آلاف رجل لم يحنوا ركبة للبعل!»"], [5, "فكذلك، في الزمان الحاضر، ماتزال بقية اختارها الله بالنعمة."], [6, "ولكن، بما أن ذلك قد تم بالنعمة، فليس بعد على أساس الأعمال، وإلا فليست النعمة نعمة بعد."], [7, "فما الخلاصة إذا؟ إن ما يسعى إليه إسرائيل لم ينالوه، بل ناله المختارون منهم، والباقون عميت بصائرهم،"]]}], "kwAr": "بقية إسرائيل", "noteAr": ""}, {"kw": "not", "raw": "Isa_11:6-9, Isa_35:8, Isa_60:21; Jer_31:33; Eze_36:25-27; Joe_3:17, Joe_3:21; Zec_14:20,Zec_14:21; Mat_13:41; 1Jo_3:9, 1Jo_3:10, 1Jo_5:18", "note": "", "refs": [{"l": "Isa 11:6-9", "n": "", "vs": [[6, "فيسكن الذئب مع الحمل، ويربض النمر إلى جوار الجدي، ويتآلف العجل والأسد وكل حيوان معلوف معا، ويسوقها جميعا صبي صغير."], [7, "ترعى البقرة والدب معا، ويربض أولادهما متجاورين، ويأكل الأسد التبن كالثور،"], [8, "ويلعب الرضيع في (أمان) عند جحر الصل، ويمد الفطيم يده إلى وكر الأفعى (فلا يصيبه سوء)."], [9, "لا يؤذون ولا يسيئون في كل جبل قدسي، لأن الأرض تمتليء من معرفة الرب كما تغمر المياه البحر."]]}, {"l": "Isa 35:8", "n": "", "vs": [[8, "وتكون هناك طريق تدعى طريق القداسة، لا يسلك فيها من هو دنس، إنما تكون من نصيب السالكين في تلك الطريق، ولا يضل فيها حتى الجهال."]]}, {"l": "Isa 60:21", "n": "", "vs": [[21, "ويكون شعبك جميعا أبرارا ويرثون الأرض إلى الأبد، فهم غصن غرسي وعمل يدي لأتمجد."]]}, {"l": "Jer 31:33", "n": "", "vs": [[33, "ولكن هذا هو العهد الذي أبرمه مع ذرية إسرائيل بعد تلك الأيام»، يقول الرب: «سأجعل شريعتي في دواخلهم، وأدونها على قلوبهم وأكون لهم إلها وهم يكونون لي شعبا."]]}, {"l": "Eze 36:25-27", "n": "", "vs": [[25, "وأرش عليكم ماء نقيا فتطهرون من كل نجاستكم ومن كل أصنامكم،"], [26, "وأهبكم قلبا جديدا، وأضع في داخلكم روحا جديدة، وأنتزع من لحمكم قلب الحجر وأعطيكم عوضا عنه قلب لحم."], [27, "وأضع روحي في داخلكم فأجعلكم تمارسون فرائضي وتطيعون أحكامي عاملين بها،"]]}, {"l": "Joe 3:17", "n": "", "vs": [[17, "فتدركون أني أنا هو الرب إلهكم الساكن في صهيون جبلي المقدس، وتكون أورشليم مقدسة ولا يجتاز فيها الغرباء أبدا."]]}, {"l": "Joe 3:21", "n": "", "vs": [[21, "وأزكي دمهم الذي لم أبرئه، لأن الرب يسكن في صهيون."]]}, {"l": "Zec 14:20", "n": "", "vs": [[20, "وينقش في ذلك اليوم على أجراس الخيل: «قدس للرب». وتكون القدور في الهيكل مقدسة كالمناضح التي أمام المذبح."]]}, {"l": "Zec 14:21", "n": "", "vs": [[21, "بل يكون كل قدر في أورشليم وفي يهوذا مقدسا للرب القدير، فيصبح في وسع المقربين أن يأتوا ويستخدموا ما يشاؤون منها، ليطبخوا فيها لحم الذبيحة. ولا يبقى في هيكل الرب القدير تجار في ذلك اليوم."]]}, {"l": "Mat 13:41", "n": "", "vs": [[41, "يرسل ابن الإنسان ملائكته، فيخرجون من ملكوته جميع المفسدين ومرتكبي الإثم،"]]}, {"l": "1Jo 3:9", "n": "", "vs": [[9, "فكل مولود من الله، لا يمارس الخطيئة، لأن طبيعة الله صارت ثابتة فيه. بل إنه لا يستطيع أن يمارس الخطيئة، لأنه مولود من الله."]]}, {"l": "1Jo 3:10", "n": "", "vs": [[10, "إذن، هذا هو المقياس الذي نميز به بين أولاد الله وأولاد إبليس. من لا يمارس الصلاح، فهو ليس من الله. وكذلك من لا يحب أخاه!"]]}, {"l": "1Jo 5:18", "n": "", "vs": [[18, "نحن واثقون بأن كل من ولد من الله لا يمارس الخطيئة، لأن ابن الله يحميه فلا يمسه إبليس الشرير."]]}], "kwAr": "ولن يرتكب", "noteAr": ""}, {"kw": "nor", "raw": "Isa_63:8; Joh_1:47; Col_3:9; Rev_14:5, Rev_21:8, Rev_21:27", "note": "", "refs": [{"l": "Isa 63:8", "n": "", "vs": [[8, "لأنه قال: إنهم حقا شعبي وأبناء أوفياء، لن يعودوا للباطل. فخلصهم."]]}, {"l": "Joh 1:47", "n": "", "vs": [[47, "ورأى يسوع نثنائيل قادما نحوه فقال عنه: «هذا إسرائيلي أصيل لا شك فيه!»"]]}, {"l": "Col 3:9", "n": "", "vs": [[9, "لا يكذب أحدكم على الآخر، إذ قد نزعتم الإنسان العتيق وأعماله"]]}, {"l": "Rev 14:5", "n": "", "vs": [[5, "لم تنطق أفواههم بالكذب، ولا عيب فيهم."]]}, {"l": "Rev 21:8", "n": "", "vs": [[8, "أما الجبناء وغير المؤمنين، والفاسدون والقاتلون والزناة، والمتصلون بالشياطين وعبدة الأصنام وجميع الدجالين، فمصيرهم إلى البحيرة المتقدة بالنار والكبريت، الذي هو الموت الثاني»."]]}, {"l": "Rev 21:27", "n": "", "vs": [[27, "ولن يدخلها شيء نجس، ولا الذين يعملون القبائح ويدجلون، بل فقط الذين كتبت أسماؤهم في سجل الحياة للحمل!"]]}], "kwAr": "ولا ينطقون", "noteAr": ""}, {"kw": "they", "raw": "Psa_23:2; Isa_65:10; Jer_23:4; Eze_34:13-15, Eze_34:23-28; Mic_4:4, Mic_5:4, Mic_5:5; Mic_7:14; Rev_7:15-17", "note": "", "refs": [{"l": "Psa 23:2", "n": "", "vs": [[2, "في مراع خضراء يربضني، وإلى مياه هادئة يقودني."]]}, {"l": "Isa 65:10", "n": "", "vs": [[10, "وتصبح أرض شارون مرعى للقطعان، ووادي عخور مربض بقر لشعبي الذي طلبني."]]}, {"l": "Jer 23:4", "n": "", "vs": [[4, "وأقيم عليها رعاة يتعهدونها فلا يعتريها خوف من بعد ولا ترتعد ولا تضل."]]}, {"l": "Eze 34:13-15", "n": "", "vs": [[13, "وأخرجه من بين الشعوب وأجمعه من البلدان، وأرده إلى أرضه، حيث أرعاه على جبال إسرائيل وفي الأودية وفي جميع أماكن الأرض الآهلة."], [14, "وأرعاه في مروج خصيبة، وتكون جبال إسرائيل الشاهقة مراعي رائعة يربضون في مراحها الطيب، ويرعون في مراع خصيبة على جبال إسرائيل."], [15, "أنا أرعى غنمي وأربضها يقول السيد الرب،"]]}, {"l": "Eze 34:23-28", "n": "", "vs": [[23, "وأنصب عليها راعيا واحدا عبدي داود (أي المسيح) يرعاها بنفسه ويكون لها راعيا أمينا."], [24, "وأنا الرب أكون لهم إلها، وعبدي داود يكون لهم رئيسا. أنا الرب تكلمت."], [25, "وأبرم معهم ميثاق سلام، وأقضي على الوحوش الضارية في الأرض فيقيمون في الصحراء آمنين، وينامون في الغابات مطمئنين."], [26, "وأجعلهم مع ما يحيط بأكمتي بركة، وأسكب عليهم المطر في أوانه، فتكون أمطار بركة."], [27, "وتثمر شجرة الحقل، وتنتج الأرض غلتها، ويكونون آمنين في ديا رهم، ويدركون عندما أحطم نيرهم وأنقذهم من قبضة مستعبديهم أني أنا الرب."], [28, "فلا يكونون بعد غنيمة للأمم، ولا يفترسهم وحش الأرض، بل يسكنون آمنين لا يفزعهم أحد."]]}, {"l": "Mic 4:4", "n": "", "vs": [[4, "بل يجلس كل رجل تحت كرمه وتحت شجرة تينته ولا يرعبهم شيء من بعد، لأن هذا ما تكلم به الرب القدير."]]}, {"l": "Mic 5:4", "n": "", "vs": [[4, "فيقوم ويرعى شعبه بقوة الرب وبجلال اسم الرب إلهه، فيعيشون بأمن، لأن عظمته تمتد إلى أقاصي الأرض."]]}, {"l": "Mic 5:5", "n": "", "vs": [[5, "ويصبح الرب سلامهم، إذ حين يزحف الأشوريون إلى أرضنا ويطأون ترابنا، فإننا نثير عليهم سبعة رعاة وثمانية أمراء من الناس،"]]}, {"l": "Mic 7:14", "n": "", "vs": [[14, "ارع يارب شعبك بعصاك، فهم قطيع ميراثك الرابضون وحدهم في الغابة في وسط الكرمل. قدهم إلى باشان وجلعاد ليتمتعوا بخصب أرضهما كالعهد بهم في أيام القدم."]]}, {"l": "Rev 7:15-17", "n": "", "vs": [[15, "لهذا هم أمام عرش الله يخدمونه في هيكله ليلا ونهارا والجالس على العرش يبسط خيمته عليهم،"], [16, "فلن يجوعوا ولن يعطشوا، ولن تضربهم الشمس ولا أي حر،"], [17, "لأن الحمل الذي في وسط العرش يرعاهم ويقودهم إلى ينابيع ماء الحياة، ويمسح الله كل دمعة من عيونهم»."]]}], "kwAr": "يعيشون", "noteAr": ""}, {"kw": "and", "raw": "Isa_17:2, Isa_54:14; Jer_30:10; Eze_39:26; 1Pe_3:14", "note": "", "refs": [{"l": "Isa 17:2", "n": "", "vs": [[2, "تهجر مدن عروعير، وتصبح مراعي للقطعان تربض فيها ولا أحد يخيفها"]]}, {"l": "Isa 54:14", "n": "", "vs": [[14, "بالبر يتم ترسيخك، وتكونين بعيدة عن كل ضيق فلن تخافي، ونائية عن الرعب لأنه لن يقترب منك."]]}, {"l": "Jer 30:10", "n": "", "vs": [[10, "فلا تفزع يا(نسل) عبدي يعقوب، ولا تجزع ياإسرائيل، فإني أخلصك من الغربة، وأنقذ ذريتك من أرض سبيهم، فيرجع نسل إسرائيل ويطمئن ويستريح من غير أن يضايقه أحد."]]}, {"l": "Eze 39:26", "n": "", "vs": [[26, "فينسون عارهم وخيانتهم التي ارتكبوها بحقي بعد أن أسكنهم في أرضهم مطمئنين لا يفزعهم أحد."]]}, {"l": "1Pe 3:14", "n": "", "vs": [[14, "وإن كان لابد أن تتألموا في سبيل البر، فطوبى لكم! لا تخافوا من تهديد الذين يضطهدونكم، ولا تقلقوا."]]}], "kwAr": "من غير أن يهددهم أحد", "noteAr": ""}], "arS": [["ولن", ["H3808"]], [" ", []], ["يرتكب", ["H6213"]], [" ", []], ["بقية", ["H7611"]], [" ", []], ["إسرائيل", ["H3478"]], [" ", []], ["الإثم", ["H5766"]], ["، ", []], ["ولا", ["H3808"]], [" ", []], ["ينطقون", ["H1696"]], [" ", []], ["بالكذب", ["H3577"]], ["، ", []], ["وليس", ["H3808"]], [" في ", []], ["أفواههم", ["H6310"]], [" ", []], ["غش", ["H8649"]], ["، بل ", []], ["يعيشون", ["H7462"]], [" ", []], ["آمنين", ["H7257"]], [" من غير أن ", []], ["يهددهم", ["H2729"]], [" ", []], ["أحد", ["H369"]], [".", []]]}, {"c": 3, "v": 14, "text": "اشدي ياابنة صهيون واهتف ياإسرائيل، ابتهجي وتهللي ياابنة أورشليم.", "groups": [{"kw": "shout", "raw": "Ezr_3:11-13; Neh_12:43; Psa_14:7, Psa_47:5-7, Psa_81:1-3, Psa_95:1, Psa_95:2, Psa_100:1, Psa_100:2; Psa_126:2, Psa_126:3; Isa_12:6, Isa_24:14-16, Isa_35:2, Isa_40:9, Isa_42:10-12, Isa_51:11, Isa_54:1; Isa_65:13, Isa_65:14, Isa_65:18, Isa_65:19; Jer_30:19, Jer_31:13, Jer_33:11; Zec_2:10,Zec_2:11, Zec_9:9, Zec_9:10; Zec_9:15-17; Mat_21:9; Luk_2:10-14; Rev_19:1-6", "note": "", "refs": [{"l": "Ezr 3:11-13", "n": "", "vs": [[11, "وترنموا بالتسبيح والحمد للرب، لأنه صالح ولأن رحمته إلى الأبد تدوم على إسرائيل. وهتف الشعب كله هتافا عظيما، تسبيحا للرب من أجل إرساء أساس بيت الرب."], [12, "ولكن كثيرين من الكهنة واللاويين وكبار الرؤساء، الذين شاهدوا الهيكل الأول الذي بناه سليمان، رفعوا أصواتهم بالبكاء عند إرساء أساس هذا الهيكل بينما راح بقية الشعب يطلقون هتافات البهجة والفرح"], [13, "ولم يستطع الشعب أن يميز هتاف الفرح من صوت البكاء، لأن هتاف الشعب كان مدويا، حتى كان يسمع من بعيد."]]}, {"l": "Neh 12:43", "n": "", "vs": [[43, "وذبحوا في ذلك اليوم قرابين كثيرة وفرحوا لأن الله ملأهم بغبطة عظيمة، وابتهج الأولاد والنساء أيضا حتى ترددت أصداء فرح أورشليم عن بعد."]]}, {"l": "Psa 14:7", "n": "", "vs": [[7, "ليت من صهيون خلاص إسرائيل. عندما يرد الرب سبي شعبه، يبتهج يعقوب، ويفرح بنو إسرائيل."]]}, {"l": "Psa 47:5-7", "n": "", "vs": [[5, "ارتفع الله وسط الهتاف، ارتفع الرب وسط دوي نفخ البوق."], [6, "رنموا لله، رنموا. رنموا لملكنا، رنموا."], [7, "لأن الله هو ملك الأرض كلها. رنموا له قصيدة حمد."]]}, {"l": "Psa 81:1-3", "n": "", "vs": [[1, "رنموا بفرح لله قوتنا، اهتفوا عاليا لإله يعقوب."], [2, "أنشدوا نشيدا، وانقروا على الدف واعزفوا على العود المطرب، وعلى الرباب."], [3, "انفخوا بالبوق في أول الشهر، في الوقت المعين ليوم عيدنا،"]]}, {"l": "Psa 95:1", "n": "", "vs": [[1, "هيا نرنم عاليا للرب، ونهتف فرحا لصخرة خلاصنا."]]}, {"l": "Psa 95:2", "n": "", "vs": [[2, "لنتقدم أمام حضرته بالشكر، ونهتف له بالترنيم."]]}, {"l": "Psa 100:1", "n": "", "vs": [[1, "اهتفوا للرب ياسكان الأرض جميعا."]]}, {"l": "Psa 100:2", "n": "", "vs": [[2, "اعبدوا الرب ببهجة، وامثلوا أمامه مترنمين."]]}, {"l": "Psa 126:2", "n": "", "vs": [[2, "عندئذ امتلأت أفواهنا ضحكا، وألسنتنا ترنما. عندئذ قالت الأمم: إن الرب قد أجرى أمورا عظيمة مع هؤلاء."]]}, {"l": "Psa 126:3", "n": "", "vs": [[3, "نعم، إن الرب قد صنع أمورا عظيمة لنا، ففرحنا."]]}, {"l": "Isa 12:6", "n": "", "vs": [[6, "اهتفوا وتغنوا ياأهل صهيون، لأن قدوس إسرائيل عظيم بينكم»."]]}, {"l": "Isa 24:14-16", "n": "", "vs": [[14, "هؤلاء الباقون يرفعون أصواتهم ويهتفون بفرح، ويشدون من الغرب بجلال الرب."], [15, "لذلك مجدوا الرب في المشرق، مجدوا اسم الرب إله إسرائيل في جزائر البحر."], [16, "من أقاصي المعمورة سمعنا تسابيح مجد قائلة: «المجد للبار». ولكني قلت: أنا هالك! أنا هالك ويل لي لأن الخونة يمارسون الخيانة. الخونة يمارسون الخيانة."]]}, {"l": "Isa 35:2", "n": "", "vs": [[2, "تزدهر ازدهارا، وتبتهج أشد بهجة ويضفى عليها مجد لبنان وجلال الكرمل وشارون ويشهدون مجد الرب وبهاء إلهنا."]]}, {"l": "Isa 40:9", "n": "", "vs": [[9, "اصعدي إلى جبل شامخ ياحاملة البشارة إلى صهيون. ارفعي صوتك بقوة يامبشرة أورشليم. اهتفي ولا تجزعي. قولي لمدن يهوذا: ها إلهكم قادم"]]}, {"l": "Isa 42:10-12", "n": "", "vs": [[10, "غنوا للرب أغنية جديدة، سبحوه من أقاصي الأرض أيها المسافرون في عباب البحر وكل ما فيه وياسكان الجزائر."], [11, "لتهتف الصحراء ومدنها، وديار قيدار المأهولة. ليتغن بفرح أهل سالع وليهتفوا من قمم الجبال."], [12, "وليمجدوا الرب ويذيعوا حمده في الجزائر."]]}, {"l": "Isa 51:11", "n": "", "vs": [[11, "سيرجع الذين افتداهم الرب ويأتون إلى صهيون بترنم، يكلل رؤوسهم فرح أبدي، فتطغى عليهم بهجة وغبطة، أما الحزن والتنهد فيهربان بعيدا."]]}, {"l": "Isa 54:1", "n": "", "vs": [[1, "ترنمي أيتها العاقر التي لم تنجب، أشيدي بالترنم والهتاف يامن لم تقاسي من المخاض، لأن أبناء المستوحشة أكثر من أبناء ذات الزوج، يقول الرب."]]}, {"l": "Isa 65:13", "n": "", "vs": [[13, "لذلك هكذا يقول السيد الرب: ها عبيدي يأكلون وأنتم تجوعون، ويشربون وأنتم تظمأون، ويفرحون وأنتم تخزون،"]]}, {"l": "Isa 65:14", "n": "", "vs": [[14, "ويترنمون في غبطة القلب وأنتم تعولون من أسى القلب، وتولولون من انكسار الروح،"]]}, {"l": "Isa 65:18", "n": "", "vs": [[18, "إنما افرحوا وابتهجوا إلى الأبد بما أنا خالقه، فها أنا أخلق أورشليم بهجة، وشعبها فرحا."]]}, {"l": "Isa 65:19", "n": "", "vs": [[19, "وأبتهج بأورشليم وأغتبط بشعبي، ولا يعود يسمع فيها صوت بكاء أو نحيب،"]]}, {"l": "Jer 30:19", "n": "", "vs": [[19, "وتصدر عنهم ترانيم الشكر مع أهازيج أصوات المطربين، وأكثرهم فلا يكونون قلة، وأكرمهم فلا يستذلون."]]}, {"l": "Jer 31:13", "n": "", "vs": [[13, "حينئذ تبتهج العذارى بالرقص، ويطر ب الشيوخ والشبان على حد سواء. أحول نوحهم إلى سرور وأستبدل حزنهم بالفرح والطمأنينة."]]}, {"l": "Jer 33:11", "n": "", "vs": [[11, "أصوات الطرب والسرور، وهتاف العريس والعروس، وأصوات المقبلين إلى هيكل الرب بقرابين الشكر القائلين: احمدوا الرب القدير، لأن الرب صالح ورحمته إلى الأبد تدوم، لأني أرد سبي الأرض فتصبح آهلة كالأيام الخوالي."]]}, {"l": "Zec 2:10", "n": "", "vs": [[10, "رنمي وابتهجي ياأورشليم، لأني قادم لأقيم في وسطك، يقول الرب."]]}, {"l": "Zec 2:11", "n": "", "vs": [[11, "فتنضم أمم كثيرة في ذلك اليوم إلى الرب ويكونون لي شعبا، فأقيم في وسطك، فتدركين أن الرب القدير قد أرسلني إليك."]]}, {"l": "Zec 9:9", "n": "", "vs": [[9, "»ابتهجي جدا ياابنة صهيون واهتفي ياابنة أورشليم، لأن هوذا ملكك مقبل إليك. هو عادل ظافر، ولكنه وديع راكب على أتان، على جحش ابن أتان."]]}, {"l": "Zec 9:10", "n": "", "vs": [[10, "وأستأصل المركبات الحربية من أفرايم، والخيل من أورشليم، وتبيد أقواس القتال، ويشيع السلام بين الأمم، ويمتد ملكه من البحر إلى البحر، ومن نهر الفرات إلى أقاصي الأرض."]]}, {"l": "Zec 9:15-17", "n": "", "vs": [[15, "يقيهم الرب القدير فلا تنالهم حجارة المقلاع، بل تقصر عنهم ويطأونها، ويشربون (من دماء أعدائهم) ويصخبون كالسكارى من الخمر ويمتلئون كمناضح المحرقات وزوايا المذبح."], [16, "في ذلك اليوم يخلصهم الرب إلههم لأنهم شعبه قطيعه، ويتألقون في أرضه كحجارة كريمة مرصعة في تاج."], [17, "فما أجملهم وما أبهاهم! الحنطة تجعل الفتيان أكثر ازدهارا، والخمرة تجعل الفتيات أكثر نضرة»."]]}, {"l": "Mat 21:9", "n": "", "vs": [[9, "وكانت الجموع التي تقدمت يسوع والتي مشت خلفه تهتف قائلة: «أوصنا لابن داود! مبارك الآتي باسم الرب! أوصنا في الأعالي!»"]]}, {"l": "Luk 2:10-14", "n": "", "vs": [[10, "فقال لهم الملاك: «لا تخافوا! فها أنا أبشركم بفرح عظيم يعم الشعب كله:"], [11, "فقد ولد لكم اليوم في مدينة داود مخلص هو المسيح الرب."], [12, "وهذه هي العلامة لكم. تجدون طفلا ملفوفا بقماط ونائما في مذود»."], [13, "وفجأة ظهر مع الملاك جمهور من الجند السماوي، يسبحون الله قائلين:"], [14, "«المجد لله في الأعالي، وعلى الأرض السلام؛ وبالناس المسرة! »"]]}, {"l": "Rev 19:1-6", "n": "", "vs": [[1, "وبعد هذا سمعت صوتا عاليا كأنه صادر من جمع كبير في السماء يقول: «هللويا! الخلاص والمجد والكرامة والقدرة للرب إلهنا"], [2, "فإن أحكامه حق وعدل، لأنه عاقب الزانية الكبرى التي أفسدت الأرض، وانتقم لدم عبيده منها»."], [3, "وهتفوا ثانية: «هللويا! دخان حريقها يتصاعد إلى أبد الآبدين!»"], [4, "وجثا الشيوخ الأربعة والعشرون والكائنات الحية الأربعة سجودا لله الجالس على العرش، وهتفوا: «آمين! هللويا!»"], [5, "وخرج من العرش صوت يقول: «سبحوا إلهنا ياجميع عبيده الذين يتقونه صغارا وكبارا!»"], [6, "ثم سمعت صوتا كأنه صوت جمع كبير أو شلال غزير أو رعد شديد، يقول: «هللويا! فإن الرب الإله القادر على كل شيء قد ملك،"]]}], "kwAr": "واهتف", "noteAr": ""}, {"kw": "O daughter of Jerusalem", "raw": "Mic_4:8", "note": "", "refs": [{"l": "Mic 4:8", "n": "", "vs": [[8, "أما أنت يابرج القطيع، ياتلة ابنة صهيون، إليك يعود الحكم الأول، ملك ابنة أورشليم."]]}], "kwAr": "ياابنة أورشليم", "noteAr": ""}], "arS": [["اشدي", ["H7442"]], [" ", []], ["ياابنة", ["H1323"]], [" ", []], ["صهيون", ["H6726"]], [" ", []], ["واهتف", ["H7321"]], [" ", []], ["ياإسرائيل", ["H3478"]], ["، ", []], ["ابتهجي", ["H8055"]], [" ", []], ["وتهللي", ["H5937"]], [" ", []], ["ياابنة", ["H1323"]], [" ", []], ["أورشليم", ["H3389"]], [".", []]]}, {"c": 3, "v": 15, "text": "لأن الرب قد رفع عنك حكم قضائه ورد عنك أعداءك. إن الرب ملك إسرائيل هو في وسطك، فلا تخشي شرا في ما بعد.", "groups": [{"kw": "hath taken", "raw": "Gen_30:23; Psa_85:3; Isa_25:8, Isa_40:1, Isa_40:2, Isa_51:22; Mic_7:18-20; Zec_1:14-16; Zec_8:13-15, Zec_10:6, Zec_10:7", "note": "", "refs": [{"l": "Gen 30:23", "n": "", "vs": [[23, "فحملت وأنجبت ابنا وقالت: «قد نزع الله عني عاري»."]]}, {"l": "Psa 85:3", "n": "", "vs": [[3, "سكنت كل سخطك. رجعت عن غضبك الرهيب."]]}, {"l": "Isa 25:8", "n": "", "vs": [[8, "ويبتلع الموت إلى الأبد، ويمسح السيد الرب الدموع المنهمرة على الوجوه، ويزيل عار شعبه من كل الأرض. هذا ما تكلم به الرب."]]}, {"l": "Isa 40:1", "n": "", "vs": [[1, "يقول إلهكم: «واسوا، واسوا شعبي!"]]}, {"l": "Isa 40:2", "n": "", "vs": [[2, "طيبوا خاطر أورشليم وبلغوها أن أيام محنتها قد انتهت، وإثمها قد غفر، وتلقت من يد الرب ضعفين عن جميع ما ارتكبته من خطايا»."]]}, {"l": "Isa 51:22", "n": "", "vs": [[22, "هذا ما يقوله سيدك الرب، إلهك الذي يدافع عن دعوى شعبه: ها أنا قد أخذت من يدك كأس الترنح، ولن تجرعي من كأس غضبي بعد."]]}, {"l": "Mic 7:18-20", "n": "", "vs": [[18, "إي إله مثلك يصفح عن الإثم ويعفو عن معصية بقية ميراثه؟ لا يحتفظ إلى الأبد بغضبه لأنه يسر بالرحمة."], [19, "يعود يرحمنا ويطأ ذنوبنا بقدميه، ويطرح معاصينا إلى أعماق البحر."], [20, "أنت تبدي أمانة لذرية يعقوب، ورحمة لنسل إبراهيم، كما حلفت لأجدادنا منذ القدم."]]}, {"l": "Zec 1:14-16", "n": "", "vs": [[14, "ثم خاطبني الملاك قائلا: «ناد، هذا ما يقوله الرب القدير: إني قد غرت على أورشليم وعلى صهيون غيرة عظيمة."], [15, "ولكن غضبي متأجج على الأمم المتنعمة. لقد اغتظت قليلا من شعبي إلا أنهم زادوا من فواجعهم."], [16, "لذلك يقول الرب سأرجع إلى أورشليم بفيض من المراحم، فيبنى هيكلي فيها وتعمر أورشليم، يقول الرب القدير."]]}, {"l": "Zec 8:13-15", "n": "", "vs": [[13, "وكما كنتم لعنة بين الأمم ياأ بناء يهوذا وإسرائيل، فإنني أخلصكم فتصبحون بركة. لا تجزعوا، بل تشجعوا."], [14, "لأنه هكذا يقول الرب القدير، كما وطدت العزم أن أعاقبكم بالشر عندما أثار آباؤكم سخطي، ولم أرجع عن عزمي، يقول الرب القدير،"], [15, "فإني عدت أيضا فقضيت في هذه الأيام أن أحسن إلى أورشليم وإلى شعب يهوذا. فلا تجزعوا."]]}, {"l": "Zec 10:6", "n": "", "vs": [[6, "إني أشدد شعب يهوذا وأخلص ذرية يوسف وأردهم إلى أرضهم لأني أكن لهم الرحمة، فيكونون كأني لم أنبذهم لأني أنا الرب إلههم فأستجيبهم."]]}, {"l": "Zec 10:7", "n": "", "vs": [[7, "ويصبح شعب إسرائيل كجبابرة الحرب، وتنتشي قلوبهم كمن شرب خمرة، ويشهد أبناؤهم هذا ويفرحون، وتبتهج نفوسهم بالرب."]]}], "kwAr": "قد رفع", "noteAr": ""}, {"kw": "he hath", "raw": "Isa. 13:1-14:32; Jer. 50:1-51:64; Mic_7:10,Mic_7:16, Mic_7:17; Hab_2:8, Hab_2:17; Zec_2:8, Zec_2:9, Zec_12:3; Rom_8:33, Rom_8:34; Rev_12:10", "note": "", "refs": [{"l": "Isa 13:1-14:32", "n": "", "vs": [[1, "رؤيا إشعياء بن آموص بشأن بابل:"], [2, "انصبوا راية فوق جبل أجرد. اصرخوا فيهم لوحوا بأيديكم حتى يدخلوا أبواب العظماء."], [3, "إني أمرت مقدسي واستدعيت جبابرتي المفتخرين بعظمتي لينفذوا عقاب غضبي."], [4, "ها جلبة على الجبال مثل صوت أقوام غفيرة. صوت صخب ممالك أمم مجتمعة، لأن الرب القدير يستعرض جنود القتال."], [5, "يقبلون من أرض نائية، من أقصى السماوات هم جنود الرب وأسلحة سخطه لتدمير الأرض كلها."], [6, "ولولوا، فإن يوم الرب بات وشيكا قادما من عند الرب محملا بالدمار."], [7, "لذلك ترتخي كل يد، ويذوب قلب كل إنسان."], [8, "ينتابهم الفزع، وتأخذهم أوجاع ومخاض، يتلوون كوالدة تقاسي من آلآم المخاض. ويحملق بعضهم ببعض مبهوتين بوجوه ملتهبة."], [9, "ها هو يوم الرب آت مفعما بالقسوة والسخط والغضب العنيف، ليجعل الأرض خرابا ويبيد منها الخطاة."], [10, "فإن نجوم السماء وكواكبها لا تشرق بنورها، والشمس تظلم عند بزوغها، والقمر لا يشع بضوئه."], [11, "وأعاقب العالم على شره والمنافقين على آثامهم، وأضع حدا لصلف المتغطرسين وأذل كبرياء العتاة،"], [12, "فيصبح الرجال لقلة عددهم أندر من الذهب النقي وأعز من ذهب أوفير."], [13, "وأزلزل السماوات فتتزعزع الأرض في موضعها من غضب الرب القدير في يوم احتدام سخطه."], [14, "وتولي جيوش بابل الأدبار حتى ينهكها التعب، عائدين إلى أرضهم كأنهم غزال مطارد أو غنم لا راعي لها."], [15, "كل من يؤسر يطعن، ومن يقبض عليه يصرع بالسيف،"], [16, "ويمزق أطفالهم على مرأى منهم، وتنهب بيوتهم، وتغتصب نساؤهم."], [17, "ها أنا أثير عليهم الماديين الذين لا يكترثون للفضة ولا يسرون بالذهب،"], [18, "تمزق قسيهم الفتيان ولا يرحمون الأولاد أو الرضع."], [19, "أما بابل، مجد الممالك وبهاء وفخر الكلدانيين، فتصبح كسدوم وعمورة اللتين قلبهما الله ."], [20, "لا يسكن فيها، ولا تعمر من جيل إلى جيل، لا ينصب فيها بدوي خيمته، ولا يربض فيها راع قطعانه."], [21, "إنما تأوي إليها وحوش القفر وتعج بيوت خرائبها بالبوم، وتلجأ إليها بنات النعام، وتتواثب فيها الماعز البرية،"], [22, "وتتعاوى الضباع بين أبراجها، وبنات آوى بين قصورها الفخمة. إن وقت عقابها بات وشيكا، وأيامها لن تطول!"], [1, "ولكن الرب ينعم برحمته على ذرية يعقوب، ويصطفي شعب إسرائيل ثانية ويحلهم في أرضهم، فينضم الغرباء إليهم ويلحقون ببيت يعقوب."], [2, "وتمد شعوب الأرض إليهم يد العون ليساعدوا إسرائيل على العودة لدياره. ويصيرون عبيدا لبني إسرائيل، في أرض الرب، ويتسلطون على آسريهم وظالميهم."], [3, "في ذلك اليوم يريحكم الرب من عنائكم وشقائكم وعبوديتكم القاسية،"], [4, "فتسخرون من ملك بابل قائلين: كيف استكان الظالم، وكيف خمدت غضبته المتعجرفة؟"], [5, "قد حطم الرب عصا المنافق وصولجان المتسلطين،"], [6, "الذين انهالوا على الناس ضربا بسخط لا يتوقف؛ الذين تسلطوا على الأمم بغضب واضطهاد شديد."], [7, "فاستراحت الأرض كلها وسادها الهدوء، فتغنت شعوبها ترنما."], [8, "حتى شجر السرو وأرز لبنان عمها الفرح فقالت: «منذ أن انكسرت شوكتك لم يصعد إلينا قاطع حطب»"], [9, "ثارت الهاوية من أسفل لاَستقبالك عند قدومك وحشدت الأخيلة، من كل العظماء، لتحيتك؛ أنهضت كل ملوك الأمم عن عروشهم"], [10, "كلهم يخاطبونك قائلين: لقد صرت ضعيفا مثلنا، أصبحت مماثلا لنا!"], [11, "طرحت كل عظمتك في الهاوية مع رنة عيدانك، وأصبحت الرمم فراشك والدود غطاء لك!"], [12, "كيف هويت من السماء يازهرة بنت الصبح؟ كيف قطعت وطرحت إلى الأرض ياقاهر الأمم؟"], [13, "قد قلت في قلبك: إني أرتقي إلى السماء وأرفع عرشي فوق كواكب الله، وأجلس على جبل الاجتماع في أقصى الشمال"], [14, "أرتقي فوق أعالي السحاب، وأصبح مثل العلي."], [15, "ولكنك طرحت إلى الهاوية، إلى أعماق الجب."], [16, "والذين يرونك يحملقون فيك ويتأملون متسائلين: أهذا هو الإنسان الذي زعزع الأرض وهز الممالك؟"], [17, "الذي حول المسكونة إلى مثل القفر، وقلب مدنها، ولم يطلق أسراه ليرجعوا إلى بيوتهم؟"], [18, "لقد رقد كل ملوك الأمم بكرامة، كل في ضريحه،"], [19, "أما أنت فقد طرحت بعيدا عن قبرك كغصن مكسور تغطيك رمم قتلى المعارك الذين انحدروا إلى مقر الموتى، وصرت كجنة داستها حوافر الخيل"], [20, "لا تنضم إليهم في مدفن، لأنك خربت أرضك، وذبحت شعبك، فذرية فاعلي الإثم يبيد ذكرها إلى الأبد."], [21, "أعدوا مذبحة لأبنائه جزاء إثم آبائهم، لئلا يقوموا ويرثوا الأرض فيملأوا وجه البسيطة مدنا."], [22, "إني أهب ضدهم، يقول الرب القدير، وأمحو من بابل اسما وبقية ونسلا وذرية،"], [23, "وأجعلها ميراثا للقنافذ، ومستنقعات للمياه، وأكنسها بمكنسة الدمار»."], [24, "لقد أقسم الرب القدير قائلا: «حقا ما عزمت عليه لابد أن يتحقق، وما نويت عليه حتما يتم:"], [25, "أن أحطم أشور في أرضي وأطأه على جبالي، فيلقي عنهم نيره، ويزول عن كاهلهم حمله."], [26, "هذا هو القضاء الذي حكمت به على الأرض كلها، وهذه هي اليد التي امتدت على كل الأمم."], [27, "لأن الرب القدير قد قضى، فمن يبطل قضاءه؟ ويده قد امتدت فمن يردها؟»"], [28, "وفي السنة التي توفي فيها الملك آحاز أوحى الرب لإشعياء:"], [29, "«لا تفرحي ياكل فلسطين، لأن القضيب الذي ضربك قد انكسر. فإن من أصل تلك الأفعى يخرج أفعوان، وذريته تكون ثعبانا ساما طيارا"], [30, "أما أبكار البائسين فيرعون، والمساكين يربضون آمنين. لكنني أهلك أصلك بالمجاعة وأقضي على بقيتك."], [31, "ولول أيها الباب ونوحي أيتها المدينة! ذوبي خوفا يافلسطين قاطبة لأن جيشا مدربا قد زحف نحوك من الشمال"], [32, "فبماذا نجيب رسل الأمة؟ لتقل لهم: قد أسس الرب أورشليم ليلوذ بها منكوبو شعبه»."]]}, {"l": "Jer 50:1-51:64", "n": "", "vs": [[1, "النبوءة التي قضى بها الرب على بابل وعلى بلاد الكلدانيين على لسان إرميا النبي:"], [2, "«أذيعوا بين الأمم، وأعلنوا. انصبوا الراية وخبروا. لا تكتموا. قولوا: قد تم الاستيلاء على بابل ولحق ببيل العار وتحطم مرودخ. خربت أصنامها وانسحقت أوثانها."], [3, "لأن أمة من الشمال قد زحفت عليها لتجعل أرضها مهجورة. شرد منها الناس والبهائم جميعا."], [4, "وفي تلك الأيام، يقول الرب، يتوافد أبناء إسرائيل وأبناء يهوذا معا. يبكون في سيرهم ويلتمسون الرب إلههم."], [5, "يسألون عن الطريق إلى صهيون، ويتوجهون إليها قائلين: هلم ننضم إلى الرب بعهد أبدي لا ينسى."], [6, "إن شعبي كغنم ضالة، أضلهم رعاتهم، وشردوهم على الجبال، فتاهوا ما بين الجبل والتل ونسوا مربضهم."], [7, "كل من وجدهم افترسهم، وقال أعداؤهم: لا ذنب علينا لأنهم هم الذين أخطأوا في حق الرب الذي هو ملاذهم الحق، ورجاء آبائهم."], [8, "اهربوا من وسط بابل واخرجوا من ديار الكلدانيين وكونوا كالتيوس أمام قطيع الغنم."], [9, "فها أنا أثير وأجلب على بابل حشود أمم عظيمة من أرض الشمال فيتألبون عليها، ويستولون عليها من الشمال، وتكون سهامهم كجبار متمرس لا يرجع فارغا،"], [10, "فتصبح أرض الكلدانيين غنيمة، وكل من يسلبها يتخم، يقول الرب."], [11, "لأنكم تبتهجون وتطفرون غبطة يا ناهبي شعبي، وتمرحون كعجلة فوق العشب وتصهلون كالخيل."], [12, "فإن أمكم قد لحقها الخزي الشديد وانتابها الخجل. ها هي تضحي أقل الشعوب، وأرضها تصير قفرا جافا وصحراء."], [13, "وتظل بأسرها مهجورة وخربة، كل من يمر ببابل يصيبه الذعر ويصفر دهشة لما ابتليت به من نكبات، لأنها أثارت غضب الرب."], [14, "اصطفوا على بابل من كل ناحية ياجميع موتري الأقواس. ارموا السهام ولا تبقوا منها سهما واحدا، لأنها قد أخطأت في حق الرب."], [15, "أطلقوا هتاف الحرب عليها من كل جانب، فقد استسلمت وانهارت أسسها، وتقوضت أسوارها، لأن هذا هو انتقام الرب، فاثأروا منها، وعاملوها بمثل ما عاملتكم."], [16, "استأصلوا الزارع من بابل والحاصد بالمنجل في موسم الحصاد إذ يرجع كل واحد إلى قومه، ويهرب إلى أرضه فرارا من سيف العاتي."], [17, "إسرائيل قطيع غنم متشتت، طردته الأسود. كان ملك أشور أول من افترسه، ونبوخذناصر آخر من هشم عظامه."], [18, "لذلك هذا ما يعلنه الرب القدير إله إسرائيل: ها أنا أعاقب ملك بابل وأرضه. كما عاقبت ملك أشور من قبل."], [19, "وأرد إسرائيل إلى مرتعه، فيرعى في الكرمل وفي باشان، وتشبع نفسه في جبل أفرايم وجلعاد."], [20, "وفي ذلك الزمان والأوان، يقول الرب، يلتمس إثم إسرائيل فلا يوجد، وخطيئة يهوذا فلا تكون، لأني أعفو عمن أبقيته منهما."], [21, "ازحف على أرض ميراثايم (ومعناه: المفرط في التمرد)، وعلى المقيمين في فقود (ومعناه: العقاب). خرب، ودمر وراءهم، يقول الرب وافعل كل ما آمرك به."], [22, "قد علت جلبة القتال في الأرض. صوت تحطيم عظيم."], [23, "كيف تكسرت وتحطمت بابل، مطرقة الأرض كلها؟ كيف أصبحت بابل مثار دهشة عند الأمم؟"], [24, "قد نصبت الشرك فوقعت فيه، يابابل، من غير أن تشعري به. قد وجدت وقبض عليك، لأنك خاصمت الرب."], [25, "قد فتح الرب مخزن سلاحه، وأخرج آلات سخطه، لأنه ما برح للسيد الرب القدير عمل ينجزه في ديار الكلدانيين."], [26, "ازحفوا عليها من أقاصي الأرض، وافتحوا أهراءها، وكوموها أعراما واقضوا عليها قاطبة ولا تتركوا منها بقية."], [27, "اذبحوا جميع ثيرانها، أحضروها للذبح. ويل لهم لأن يوم موعد عقابهم قد حان."], [28, "اسمعوا! ها جلبة الفارين الناجين من ديار بابل لكي يذيعوا في صهيون أنباء انتقام الرب إلهنا والثأر لهيكله."], [29, "استدعوا إلى بابل رماة السهام، جميع موتري القسي. عسكروا حولها فلا يفلت منها أحد. جازوها بمقتضى أعمالها، واصنعوا بها كما صنعت بكم، لأنها بغت على الرب قدوس إسرائيل."], [30, "لذلك يصرع شبانها في ساحاتها، ويبيد في ذلك اليوم جميع جنودها، يقول الرب."], [31, "ها أنا أقاومك أيتها المتغطرسة، يقول الرب القدير، لأن يوم إدانتك وتنفيذ العقاب فيك قد حان،"], [32, "فيتعثر المتغطرس ويكبو ولا يوجد من ينهضه، وأضرم نارا في مدنه فتلتهم ما حوله»."], [33, "وهذا ما يعلنه الرب القدير: «قد وقع الظلم على شعب إسرائيل وعلى شعب يهوذا، وجميع الذين سبوهم تشبثوا بهم وأبوا أن يطلقوهم."], [34, "غير أن فاديهم قوي، الرب القدير اسمه، وهو حتما يدافع عن قضيتهم لكي يشيع راحة في الأرض ويقلق أهل بابل."], [35, "ها سيف على الكلدانيين، يقول الرب، وعلى أهل بابل، وعلى أشرافها، وعلى حكمائها."], [36, "ها سيف على عرافيها، فيصبحون حمقى. وها سيف على محاربيها، فيمتلئون رعبا."], [37, "ها سيف على خيلها، وعلى مركباتها، وعلى فرق مرتزقتها، فيصيرون كالنساء. ها سيف على كنوزها فتنهب."], [38, "ها الحر على مياهها فيصيبها الجفاف لأنها أرض أصنام، وقد أولع أهلها بالأوثان."], [39, "لذلك يسكنها وحش القفر مع بنات آوى، وتأوي إليها رعال النعام، وتظل مهجورة إلى الأبد، غير آهلة بالسكان إلى مدى الدهر."], [40, "وكما قلب الله سدوم وعمورة وما جاورهما، هكذا لن يسكن فيها أحد أو يقيم فيها إنسان."], [41, "ها شعب مقبل من الشمال، أمة عظيمة ولفيف من الملوك قد هبوا من أقاصي الأرض."], [42, "يمسكون بالقسي ويتقلدون بالرماح. قساة لا يعرفون الرحمة، جلبتهم كهدير البحر، يمتطون الخيل وقد اصطفوا كرجل واحد لمحاربتك يابنت بابل."], [43, "قد بلغ خبرهم ملك بابل فاسترخت يده وانتابته الضيقة ووجع امرأة في مخاضها."], [44, "انظر، ها هو كما ينقض عليها كما ينقض أسد من أجمات نهر الأردن، هكذا وفي لحظة أطردهم منها، وأولي عليها من أختاره لأنه من هو نظيري؟ ومن يحاكمني؟ وأي راع يقوى على مواجهتي؟"], [45, "لذلك اسمعوا ما خططه الرب ضد بابل، وما دبره ضد ديار الكلدانيين. ها صغارهم يجرون جرا، ويخرب مساكنهم عليهم."], [46, "من دوي أصداء سقوط بابل ترجف الأرض، ويتردد صراخها بين الأمم."], [1, "وهذا ما يعلنه الرب: ها أنا أثير على بابل وعلى المقيمين في ديار الكلدانيين ريحا مهلكة."], [2, "وأبعث إلى بابل مذرين يذرونها، ويجعلون أرضها قفرا، ويهاجمونها من كل جانب في يوم بليتها."], [3, "ليوتر الرامي قوسه وليتدجج بسلاحه. لا تعفوا عن شبانها، بل أبيدوا كل جيشها إبادة."], [4, "يتساقط القتلى في أرض الكلدانيين، والجرحى في شوارعها،"], [5, "لأن إسرائيل ويهوذا لم يهملهما الرب القدير وإن تكن أرضهما تفيض بالإثم ضد قدوس إسرائيل."], [6, "اهربوا من وسط بابل، ولينج كل واحد بحياته. لا تبيدوا من جراء إثمها، لأن هذا هو وقت انتقام الرب، وموعد مجازاتها."], [7, "كانت بابل كأس ذهب في يد الله، فسكر ت الأرض قاطبة. تجرعت الأمم من خمرها، لذلك جنت الشعوب."], [8, "فجأة سقطت بابل وتحطمت، فولولوا عليها، خذوا بلسانا لجرحها لعلها تبرأ."], [9, "قمنا بمداواة بابل، ولكن لم ينجع فيها علاج. اهجروها وليمض كل واحد منا إلى أرضه، لأن قضاءها قد بلغ عنان السماء، وتصاعد حتى ارتفع إلى الغيوم."], [10, "قد أظهر الرب برنا، فتعالوا لنذيع في صهيون ما صنعه الرب إلهنا."], [11, "سنوا السهام، وتقلدوا الأتراس، لأن الرب قد أثار روح ملوك الماديين، إذ وطد العزم على إهلاك بابل، لأن هذا هو انتقام الرب، والثأر لهيكله."], [12, "انصبوا راية على أسوار بابل. شددوا الحراسة. أقيموا الأرصاد. أعدوا الكمائن، لأن الرب قد خطط وأنجز ما قضى به على أهل بابل."], [13, "أيتها الساكنة إلى جوار المياه الغزيرة، ذات الكنوز الوفيرة، إن نهايتك قد أزفت، وحان موعد اقتلاعك."], [14, "قد أقسم الرب القدير بذاته قائلا: لأملأنك أناسا كالغوغاء فتعلو جلبتهم عليك."], [15, "هو الذي صنع الأرض بقدرته، وأسس الدنيا بحكمته، ومد السماوات بفطنته."], [16, "ما إن ينطق بصوته حتى تتجمع غمار المياه في السماوات، وتصعد السحب من أقاصي الأرض، ويجعل للمطر بروقا، ويطلق الريح من خزائنه."], [17, "كل امريء خامل وعديم المعرفة، وكل صائغ خزي من تمثاله، لأن صنمه المسبوك كاذب ولا حياة فيه."], [18, "جميع الأصنام باطلة وصنعة ضلال، وفي زمن عقابها تبيد."], [19, "أما نصيب يعقوب فليس مثل هذه الأوثان، بل هو جابل كل الأشياء. وشعب إسرائيل هو سبط ميراثه، واسمه الرب القدير."], [20, "أنت فأس معركتي وآلة حربي. بك أمزق الأمم إربا وأحطم ممالك."], [21, "بك أجعل الفرس وفارسها أشلاء، وأهشم المركبة وراكبها."], [22, "بك أحطم الرجل والمرأة، والشيخ والفتى، والشاب والعذراء."], [23, "بك أسحق الراعي وقطيعه، والحارث وفدانه، والحكام والولاة."], [24, "سأجازي بابل وسائر الكلدانيين على كل شرهم الذي ارتكبوه في حق صهيون، على مرأى منكم، يقول الرب."], [25, "ها أنا أنقلب عليك أيها الجبل المخرب، يقول الرب. أنت تفسد كل الأرض، لذلك أمد يدي عليك وأدحرجك من بين الصخور، وأجعلك جبلا محترقا."], [26, "فلا يقطع منك حجر لزاوية، ولا حجر يوضع كأساس، بل تكون خرابا أبديا، يقول الرب."], [27, "انصبوا راية في الأرض. انفخوا في البوق بين الأمم. أثيروا عليها الأمم لقتالها، وألبوا عليها ممالك أراراط ومني وأشكناز. أقيموا عليها قائدا. اجعلوا الخيل تزحف عليها كجحافل الجنادب الشرسة."], [28, "أثيروا عليها الأمم وملوك الماديين وكل حكامهم وولاتهم وسائر الديار التي يحكمونها."], [29, "الأرض ترجف وتقشعر، لأن قضاء الرب على بابل يتم، ليجعل أرض بابل خرابا وقفرا."], [30, "قد أحجم محاربو بابل الجبابرة عن القتال، واعتصموا في معاقلهم. خارت شجاعتهم، وصاروا كالنساء. احترقت مساكن بابل وتحطمت مزاليجها."], [31, "يركض عداء لملاقاة عداء آخر. ويسرع مخبر للقاء مخبر ليبلغ ملك بابل أن مدينته قد تم الاستيلاء عليها من كل جانب."], [32, "قد سقطت المعابر وأحرقت أجمات القصب بالنار واعترى الذعر المحاربين،"], [33, "لأن هذا ما يعلنه الرب القدير إله إسرائيل: إن أهل بابل كالبيدر، وقد حان أوان درس حنطته. وبعد قليل يأزف موعد حصادهم."], [34, "«يقول المسبيون: قد افترسنا نبوخذناصر ملك بابل وسحقنا وجعلنا إناء فارغا. ابتلعنا كتنين، وملأ جوفه من أطايبنا، ثم لفظنا من فمه."], [35, "يقول أهل أورشليم: ليحل ببابل ما أصابنا وأصاب لحومنا من ظلم. وتقول أورشليم: دمي على أهل أرض الكلدانيين."], [36, "لذلك هذا ما يعلنه الرب: ها أنا أدافع عن دعواك وأنتقم لك، فأجفف بحر بابل وينابيعها،"], [37, "فتصير بابل ركاما ومأوى لبنات آوى، ومثار دهشة وصفير وأرضا موحشة."], [38, "إنهم يزأرون كالأسود ويزمجرون كالأشبال."], [39, "عند شبعهم أعد لهم مأدبة وأسكرهم حتى تأخذهم النشوة فينامون نوما أبديا لا يقظة منه، يقول الرب."], [40, "وأحضرهم كالحملان للذبح وكالكباش والتيوس."], [41, "كيف استولي على بابل! كيف سقطت فخر كل الأرض! كيف صارت بابل مثار دهشة بين الأمم!"], [42, "قد طغى البحر على بابل فغمرها بأمواجه الهائجة،"], [43, "وأصبحت مدنها موحشة وأرض قفر وصحراء، أرضا لا يأوي إليها أحد ولا يجتاز بها إنسان."], [44, "وأعاقب الصنم: بيل في بابل، وأستخرج من فمه ما ابتلعه، فتكف الأمم عن التوافد إليه، وينهدم أيضا سور بابل."], [45, "اخرجوا من وسطها ياشعبي ولينج كل واحد بحياته هربا من احتدام غضب الرب."], [46, "لا يخر قلبكم ولا تفزعوا مما يشيع في الديار من أنباء، إذ تروج شائعة في هذه السنة وأخرى في السنة التالية، ويسود العنف الأرض، ويقوم متسلط على متسلط."], [47, "لذلك ها أيام مقبلة أعاقب فيها أصنام بابل ويلحق العار بأرضها كلها، ويتساقط قتلاها في وسطها."], [48, "عندئذ تتغنى بسقوط بابل السماوات والأرض وكل ما فيها، لأن المدمرين يتقاطرون عليها من الشمال، يقول الرب."], [49, "كما صرعت بابل قتلى إسرائيل، هكذا يصرع قتلى بابل في كل الأرض."], [50, "ياأيها الناجون من السيف، اهربوا ولا تقفوا، اذكروا الرب في مكانكم البعيد، ولا تبرح أورشليم من خواطركم."], [51, "قد لحقنا الخزي لأننا استمعنا للإهانة، فكسا الخجل وجوهنا، إذ انتهك الغرباء مقادس هيكل الرب."], [52, "لذلك ها أيام مقبلة، يقول الرب، أنفذ فيها قضائي على أصنام بابل، ويئن جرحاها في كل ديارها."], [53, "وحتى لو ارتفعت بابل فبلغت السماء، وحتى لو حصنت معاقلها الشامخة، فإن المدمرين ينقضون عليها من عندي، يقول الرب."], [54, "ها صوت صراخ يتردد في بابل، صوت جلبة دمار عظيم من أرض الكلدانيين،"], [55, "لأن الرب قد خرب بابل، وأخرس جلبتها العظيمة، إذ طغت عليها جحافل أعدائها كمياه عجاجة، وعلا ضجيج أصواتهم."], [56, "لأن المدمر قد انقض على بابل وأسر محاربيها، وتكسرت كل قسيها، لأن الرب إله مجازاة، وهو حتما يحاسبها."], [57, "إني أسكر رؤساءها وحكماءها ومحاربيها، فينامون نوما أبديا لا يقظة منه، يقول الملك، الرب القدير اسمه."], [58, "وهذا ما يعلنه الرب القدير: إن سور بابل العريض يقوض ويسوى بالأرض، وبواباتها العالية تحترق بالنار، ويذهب تعب الشعوب باطلا، ويكون مصير جهد الأمم للنار»."], [59, "هذه هي النبوءة التي أودعها إرميا النبي سرايا بن نيريا بن محسيا، عندما رافق صدقيا ملك يهوذا إلى بابل في السنة الرابعة لحكمه. وكان سرايا آنئذ رئيس المعسكر."], [60, "وكان إرميا قد دون في كتاب واحد جميع الكوارث التي ستبتلى بها بابل، أي جميع النبوءات المدونة عن بابل."], [61, "وقال إرميا لسرايا: «حالما تصل إلى بابل، اعمل على تلاوة جميع هذه النبوءات."], [62, "وقل: أيها الرب قد قضيت على هذا الموضع بالانقراض، فلا يسكن فيه أحد من الناس والبهائم، بل يصبح خرابا أبديا."], [63, "ومتى فرغت من تلاوة هذا الكتاب، اربط به حجرا واطرحه في وسط الفرات."], [64, "وقل: كذلك تغرق بابل ولا تطفو بعد لما أوقعه عليها من عقاب فيعيا كل أهلها».إلى هنا تنتهي نبوءات إرميا."]]}, {"l": "Mic 7:10", "n": "", "vs": [[10, "عندئذ ترى ذلك عدوتي فيعتريها الخزي إذ قالت لي: «أين هو الرب إلهك؟» ستشهدها عيناي تداس كطين الشوارع والأزقة."]]}, {"l": "Mic 7:16", "n": "", "vs": [[16, "فترى الأمم ويخزون من قوتهم ويضعون أيديهم على أفواههم وتصاب آذانهم بالصمم."]]}, {"l": "Mic 7:17", "n": "", "vs": [[17, "ويلحسون التراب كالحية وينسلون من حصونهم مرتعبين كزواحف الأرض، ويرجعون بخوف إلى الرب إلهنا مرتعبين منك."]]}, {"l": "Hab 2:8", "n": "", "vs": [[8, "لأنك سلبت أمما كثيرة فإن بقية الشعوب ينهبونك ثأرا لما سفكت من دماء وارتكبت من جور في الأرض، فدمرت مدنا وأهلكت الساكنين فيها."]]}, {"l": "Hab 2:17", "n": "", "vs": [[17, "لأن ما ارتكبته من ظلم في حق لبنان يغطيك، وما أهلكته من بهائم يروعك. من أجل ما سفكته من دماء واقترفته من جور في الأرض والمدن والساكنين فيها."]]}, {"l": "Zec 2:8", "n": "", "vs": [[8, "فإن الرب القدير يقول إنه أرسلني إلى الأمم التي سلبتكم إعلاء لمجده، لأن من يمسكم يمس حدقة عينه."]]}, {"l": "Zec 2:9", "n": "", "vs": [[9, "ها أنا أضربهم بيدي فيصيرون نهبا لعبيدهم، فتدركون أن الرب القدير قد أرسلني حقا."]]}, {"l": "Zec 12:3", "n": "", "vs": [[3, "في ذلك اليوم أجعل أورشليم كصخرة ثقيلة تعجز عن حملها جميع الشعوب. وكل من يحاول حملها ينشق شقا، ويتألب عليها جميع شعوب الأرض."]]}, {"l": "Rom 8:33", "n": "", "vs": [[33, "ومن سيتهم مختاري الله؟ إن الله هو الذي يبرر،"]]}, {"l": "Rom 8:34", "n": "", "vs": [[34, "فمن ذا يدين؟ إنه المسيح يسوع هو الذي مات، بل بالأحرى قام، وهو أيضا عن يمين الله، وهو يشفع فينا أيضا."]]}, {"l": "Rev 12:10", "n": "", "vs": [[10, "ثم سمعت صوتا عاليا في السماء يقول: «الآن تم خلاص إلهنا، وآلت القدرة والملك إليه والسلطان إلى مسيحه! فإنه قد طرح من السماء إلى الأرض المشتكي الذي يتهم إخوتنا أمام إلهنا ليلا ونهارا."]]}], "kwAr": "ورد", "noteAr": ""}, {"kw": "the king", "raw": "Isa_33:22; Eze_37:24, Eze_37:25; Zec_9:9; Joh_1:49, Joh_12:15, Joh_19:19; Rev_19:16", "note": "", "refs": [{"l": "Isa 33:22", "n": "", "vs": [[22, "لأن الرب هو قاضينا، الرب هو مشترعنا، هو ملكنا وسيخلصنا"]]}, {"l": "Eze 37:24", "n": "", "vs": [[24, "ويصبح داود عبدي (أي المسيح) ملكا عليهم، فيكون لهم جميعا راع واحد فيمارسون أحكامي ويطيعون فرائضي عاملين بها."]]}, {"l": "Eze 37:25", "n": "", "vs": [[25, "ويقيمون في الأرض التي وهبتها لعبدي يعقوب التي سكن فيها آباؤكم، فيستوطنون فيها هم وأبناؤهم وأحفادهم إلى الأبد. ويكون عبدي داود (أي المسيح) رئيسا عليهم مدى الدهر."]]}, {"l": "Zec 9:9", "n": "", "vs": [[9, "»ابتهجي جدا ياابنة صهيون واهتفي ياابنة أورشليم، لأن هوذا ملكك مقبل إليك. هو عادل ظافر، ولكنه وديع راكب على أتان، على جحش ابن أتان."]]}, {"l": "Joh 1:49", "n": "", "vs": [[49, "فهتف نثنائيل قائلا: «يامعلم، أنت ابن الله! أنت ملك إسرائيل!»"]]}, {"l": "Joh 12:15", "n": "", "vs": [[15, "«لا تخافي يابنت صهيون، فإن ملكك قادم إليك راكبا على جحش أتان»."]]}, {"l": "Joh 19:19", "n": "", "vs": [[19, "وعلق بيلاطس لافتة على الصليب مكتوبا عليها: «يسوع الناصري ملك اليهود»."]]}, {"l": "Rev 19:16", "n": "", "vs": [[16, "وقد كتب على ثوبه وعلى فخذه «ملك الملوك ورب الأرباب»."]]}], "kwAr": "ملك إسرائيل", "noteAr": ""}, {"kw": "is in", "raw": "Zep_3:5, Zep_3:17; Eze_37:26-28, Eze_48:35; Joe_3:20,Joe_3:21; Rev_7:15, Rev_21:3, Rev_21:4", "note": "", "refs": [{"l": "Zep 3:5", "n": "", "vs": [[5, "ولكن الرب ما برح صديقا في وسطها، لا يرتكب خطأ، ويبدي في كل صباح عدله وفي كل فجر حقه. لا يخفق قط؛ أما الأثيم فلا يعرف ما هو الخزي."]]}, {"l": "Zep 3:17", "n": "", "vs": [[17, "فالرب إلهك في وسطك، جبار يخلص. يسر فرحا بك، ويجدد بمحبته حياتك، ويبتهج بك مترنما."]]}, {"l": "Eze 37:26-28", "n": "", "vs": [[26, "وأبرم معهم ميثاق سلام، فيكون معهم عهدا أبديا، وأوطنهم وأكثرهم وأقيم مقدسي في وسطهم إلى الأبد."], [27, "ويكون مسكني معهم، فأكون لهم إلها ويكونون لي شعبا."], [28, "فتدرك الأمم أني أنا الرب مقدس إسرائيل، حين يكون مقدسي قائما في وسطهم إلى الأبد»."]]}, {"l": "Eze 48:35", "n": "", "vs": [[35, "أما محيط المدينة فهو ثمانية عشر ألف ذراع (نحو تسعة كيلومترات)، ويكون اسم المدينة من ذلك اليوم «يهوه شمة» ومعناه: «الرب هناك»."]]}, {"l": "Joe 3:20", "n": "", "vs": [[20, "أما يهوذا فإنه يسكن الأرض إلى الأبد، وتعمر أورشليم مدى الأجيال."]]}, {"l": "Joe 3:21", "n": "", "vs": [[21, "وأزكي دمهم الذي لم أبرئه، لأن الرب يسكن في صهيون."]]}, {"l": "Rev 7:15", "n": "", "vs": [[15, "لهذا هم أمام عرش الله يخدمونه في هيكله ليلا ونهارا والجالس على العرش يبسط خيمته عليهم،"]]}, {"l": "Rev 21:3", "n": "", "vs": [[3, "وسمعت صوتا هاتفا من العرش: «الآن صار مسكن الله مع الناس، هو يسكن بينهم، وهم يصيرون شعبا له. الله نفسه يكون معهم إلها لهم!"]]}, {"l": "Rev 21:4", "n": "", "vs": [[4, "وسيمسح كل دمعة من عيونهم. إذ يزول الموت والحزن والصراخ والألم، لأن الأمور القديمة كلها قد زالت!»"]]}], "kwAr": "هو في وسطك", "noteAr": ""}, {"kw": "thou", "raw": "Isa_35:10, Isa_51:22, Isa_60:18, Isa_65:19; Eze_39:29; Joe_3:17; Amo_9:15; Zec_14:11", "note": "", "refs": [{"l": "Isa 35:10", "n": "", "vs": [[10, "ويرجع إليها مفديو الرب ويقبلون إلى صهيون مترنمين يكلل رؤوسهم فرح أبدي، وتغمرهم الغبطة والسرور، ويهرب الحزن والأنين."]]}, {"l": "Isa 51:22", "n": "", "vs": [[22, "هذا ما يقوله سيدك الرب، إلهك الذي يدافع عن دعوى شعبه: ها أنا قد أخذت من يدك كأس الترنح، ولن تجرعي من كأس غضبي بعد."]]}, {"l": "Isa 60:18", "n": "", "vs": [[18, "ولا يسمع بظلم في أرضك، ولا بدمار أو خراب داخل تخومك، وتدعين أسوارك خلاصا، وبواباتك تسابيح."]]}, {"l": "Isa 65:19", "n": "", "vs": [[19, "وأبتهج بأورشليم وأغتبط بشعبي، ولا يعود يسمع فيها صوت بكاء أو نحيب،"]]}, {"l": "Eze 39:29", "n": "", "vs": [[29, "ولا أعود أحجب وجهي عنهم لأني أسكب روحي على شعب إسرائيل يقول السيد الرب»."]]}, {"l": "Joe 3:17", "n": "", "vs": [[17, "فتدركون أني أنا هو الرب إلهكم الساكن في صهيون جبلي المقدس، وتكون أورشليم مقدسة ولا يجتاز فيها الغرباء أبدا."]]}, {"l": "Amo 9:15", "n": "", "vs": [[15, "وأغرس شعبي في أرضهم فلا يستأصلون ثانية أبدا من الأرض التي وهبتها لهم، يقول الرب إلهكم."]]}, {"l": "Zec 14:11", "n": "", "vs": [[11, "وتصبح آهلة إذ لن يحل بها دمار ثانية، وتكون أورشليم آمنة."]]}], "kwAr": "فلا تخشي", "noteAr": ""}], "arS": [["لأن ", []], ["الرب", ["H3068"]], [" قد ", []], ["رفع", ["H5493"]], [" عنك ", []], ["حكم", ["H4941"]], [" قضائه ", []], ["ورد", ["H6437"]], [" عنك ", []], ["أعداءك", ["H341"]], [". إن ", []], ["الرب", ["H3068"]], [" ", []], ["ملك", ["H4428"]], [" ", []], ["إسرائيل", ["H3478"]], [" هو في ", []], ["وسطك", ["H7130"]], ["، ", []], ["فلا", ["H3808"]], [" ", []], ["تخشي", ["H7200"]], [" ", []], ["شرا", ["H7451"]], [" في ما ", []], ["بعد", ["H5750"]], [".", []]]}, {"c": 3, "v": 16, "text": "ويقال في ذلك اليوم لأورشليم: لا تخافي ياصهيون، ولا ترتخ يداك.", "groups": [{"kw": "be said", "raw": "Isa_35:3, Isa_35:4, Isa_40:9, Isa_41:10,Isa_41:13, Isa_41:14, Isa_43:1, Isa_43:2, Isa_44:2, Isa_54:4; Jer_46:27, Jer_46:28; Hag_2:4, Hag_2:5; Zec_8:15; Joh_12:12; Heb_12:12", "note": "", "refs": [{"l": "Isa 35:3", "n": "", "vs": [[3, "شددوا الأيدي المسترخية، وثبتوا الركب المرتعشة."]]}, {"l": "Isa 35:4", "n": "", "vs": [[4, "قولوا لذوي القلوب الخائرة: «تقووا ولا تفزعوا، فها هو إلهكم قادم، مقبل بالنقمة، حامل جزاءه. سيأتي ويخلصكم»."]]}, {"l": "Isa 40:9", "n": "", "vs": [[9, "اصعدي إلى جبل شامخ ياحاملة البشارة إلى صهيون. ارفعي صوتك بقوة يامبشرة أورشليم. اهتفي ولا تجزعي. قولي لمدن يهوذا: ها إلهكم قادم"]]}, {"l": "Isa 41:10", "n": "", "vs": [[10, "لا تخف لأني معك. لا تتلفت حولك جزعا، لأني إلهك، أشددك وأعينك وأعضدك بيمين بري"]]}, {"l": "Isa 41:13", "n": "", "vs": [[13, "لأني أنا الرب إلهك الذي يمسك بيمينك قائلا لك: لا تخف. سأعينك."]]}, {"l": "Isa 41:14", "n": "", "vs": [[14, "لا تخف يايعقوب الضعيف كالحشرة، وياإسرائيل العليل كالشرذمة، لأني سأعينك، يقول الرب فاديك قدوس إسرائيل."]]}, {"l": "Isa 43:1", "n": "", "vs": [[1, "أما الآن، فهذا ما يقوله الرب خالقك يايعقوب وجابلك ياإسرائيل: «لا تجزع لأني افتديتك، دعوتك باسمك. أنت لي."]]}, {"l": "Isa 43:2", "n": "", "vs": [[2, "إذا اجتزت في وسط المياه أكون معك، وإن خضت الأنهار لا تغمرك. إن عبرت في النار لا تلذعك. واللهيب لا يحرقك."]]}, {"l": "Isa 44:2", "n": "", "vs": [[2, "أنا خالقكم من الرحم ومعينكم، لا تخف يا عبدي يعقوب ولا تجزعي يا أورشليم التي اخترتها."]]}, {"l": "Isa 54:4", "n": "", "vs": [[4, "لا تجزعي لأنك لن تخزي، ولا تخجلي لأنه لن يلحق بك عار، فأنت ستنسين خزي صباك، ولن تذكري من بعد عار ترملك."]]}, {"l": "Jer 46:27", "n": "", "vs": [[27, "ولكن لا تخافوا ياذرية عبدي يعقوب، ولا تفزع ياإسرائيل، لأني سأنقذكم من الغربة وأخلص نسلكم من أرض السبي، فترجع ذرية يعقوب وتتمتع بالدعة والطمأنينة من غير أن يرعبها أحد."]]}, {"l": "Jer 46:28", "n": "", "vs": [[28, "لا تخافوا ياذرية عبدي يعقوب، يقول الرب، لأني معكم وأفني جميع الأمم التي شتتكم إليها. أما أنتم فلا أفنيكم بل أؤدبكم بالحق، إنما لا أبرئكم جميعا»."]]}, {"l": "Hag 2:4", "n": "", "vs": [[4, "والآن تشجع يازربابل، يقول الرب، وتشدد يايهوشع بن يهوصادق رئيس الكهنة، وأنتم كذلك ياجميع سكان الأرض. تشجعوا واعملوا بجد لأني معكم، يقول الرب القدير."]]}, {"l": "Hag 2:5", "n": "", "vs": [[5, "بمقتضى عهدي الذي أبرمته معكم عندما خرجتم من ديار مصر. إن روحي ماكث معكم، فلا تفزعوا."]]}, {"l": "Zec 8:15", "n": "", "vs": [[15, "فإني عدت أيضا فقضيت في هذه الأيام أن أحسن إلى أورشليم وإلى شعب يهوذا. فلا تجزعوا."]]}, {"l": "Joh 12:12", "n": "", "vs": [[12, "وفي اليوم التالي، عرف الجمهور الكبير الذي جاء إلى العيد أن يسوع قادم إلى أورشليم."]]}, {"l": "Heb 12:12", "n": "", "vs": [[12, "لذلك، شددوا أيديكم المرتخية، وركبكم المنحلة."]]}], "kwAr": "ويقال", "noteAr": ""}, {"kw": "slack", "raw": "or, faint, 2Co_4:1; Gal_6:9; Eph_3:13; Heb_12:3-5; Rev_2:3", "note": "or, faint, 2Co_4:1; Gal_6:9; Eph_3:13; Heb_12:3-5; Rev_2:3", "refs": [{"l": "2Co 4:1", "n": "", "vs": [[1, "فما دامت لنا إذن هذه الخدمة برحمة من الله، فلا تخور عزيمتنا."]]}, {"l": "Gal 6:9", "n": "", "vs": [[9, "لأننا، متى حان الأوان، سنحصد، إن كنا لا نتراخى."]]}, {"l": "Eph 3:13", "n": "", "vs": [[13, "فلذلك أطلب إليكم ألا يفتر عزمكم بسبب الضيقات التي أقاسيها لأجلكم، فهي مفخرة لكم."]]}, {"l": "Heb 12:3-5", "n": "", "vs": [[3, "فتأملوا مليا ما قاساه بتحمله تلك المعاملة العنيفة التي عامله بها الخاطئون، لكي لا تتعبوا وتنهاروا!"], [4, "لم تقاوموا بعد حتى بذل الدم في مجاهدتكم ضد الخطيئة."], [5, "فهل نسيتم الوعظ الذي يخاطبكم به الله بوصفكم أبناء له؟ إذ يقول: «ياابني، لا تستخف بتأديب الرب. ولا تفقد العزيمة حين يوبخك على الخطأ."]]}, {"l": "Rev 2:3", "n": "", "vs": [[3, "وقد تألمت من أجل اسمي بصبر وبغير كلل."]]}], "kwAr": "ولا ترتخ يداك", "noteAr": "أو: «تضعف». انظر 2كو 4: 1؛ غل 6: 9؛ أف 3: 13؛ عب 12: 3-5؛ رؤ 2: 3"}], "arS": [["ويقال", ["H559"]], [" في ", []], ["ذلك", ["H1931"]], [" ", []], ["اليوم", ["H3117"]], [" ", []], ["لأورشليم", ["H3389"]], [": ", []], ["لا", ["H408"]], [" ", []], ["تخافي", ["H3372"]], [" ", []], ["ياصهيون", ["H6726"]], ["، ", []], ["ولا", ["H408"]], [" ", []], ["ترتخ", ["H7503"]], [" ", []], ["يداك", ["H3027"]], [".", []]]}, {"c": 3, "v": 17, "text": "فالرب إلهك في وسطك، جبار يخلص. يسر فرحا بك، ويجدد بمحبته حياتك، ويبتهج بك مترنما.", "groups": [{"kw": "in the", "raw": "Zep_3:5, Zep_3:15", "note": "", "refs": [{"l": "Zep 3:5", "n": "", "vs": [[5, "ولكن الرب ما برح صديقا في وسطها، لا يرتكب خطأ، ويبدي في ضكم،"]]}, {"l": "Hos 1:11", "n": "", "vs": [[11, "ويجتمع أبناء يهوذا وأبناء إسرائيل معا وينصبون عليهم قائدا واحدا، ويرجعون من أرض السبي، لأن يوم يزرعيل عظيم»."]]}, {"l": "Rom 11:25", "n": "", "vs": [[25, "فإني لا أريد، أيها الإخوة، أن يخفى عليكم هذا السر، لكي لا تكونوا حكماء في نظر أنفسكم، وهو أن العمى قد أصاب إسرائيل جزئيا إلى أن يتم دخول الأمم كليا."]]}, {"l": "Rom 11:26", "n": "", "vs": [[26, "وهكذا، سوف يخلص جميع إسرائيل، وفقا لما قد كتب: «إن المنقذ سيطلع من صهيون ويرد الإثم عن يعقوب."]]}], "kwAr": "أزيل", "noteAr": ""}, {"kw": "sorrowful", "raw": "Psa_42:2-4, Psa_43:3, Psa_63:1, Psa_63:2, Psa_84:1, Psa_84:2, Psa_137:3-6; Lam_1:4, Lam_1:7, Lam_2:6, Lam_2:7; Hos_9:5", "note": "", "refs": [{"l": "Psa 42:2-4", "n": "", "vs": [[2, "نفسي عطشى إلى الله الإله الحي، فمتى أجيء وأمثل أمام الله؟"], [3, "قد صارت دموعي طعامي الوحيد نهارا وليلا، إذ قيل لي كل يوم: «أين إلهك»؟"], [4, "حين أتأمل في نفسي تعاودني هذه الذكرى: كيف كنت أرافق حشود العابدين المحتفلين بالعيد وأقودهم في الحضور إلى بيت الله، هاتفا معهم فرحا وحمدا."]]}, {"l": "Psa 43:3", "n": "", "vs": [[3, "أرسل نورك وحقك فيرشداني، ويأتيا بي إلى جبلك المقدس وإلى مساكنك،"]]}, {"l": "Psa 63:1", "n": "", "vs": [[1, "ياالله أنت إلهي وإياك أطلب باكرا. عطشت إليك نفسي ويشتاق إليك جسمي في أرض قاحلة يابسة لا ماء فيها."]]}, {"l": "Psa 63:2", "n": "", "vs": [[2, "حتى أعاين قدرتك ومجدك، مثلما رأيتك في موضعك المقدس."]]}, {"l": "Psa 84:1", "n": "", "vs": [[1, "ما أحلى مساكنك يارب الجنود!"]]}, {"l": "Psa 84:2", "n": "", "vs": [[2, "تتوق بل تحن نفسي إلى ديار الرب. قلبي وجسمي يرنمان بفرح للإله الحي."]]}, {"l": "Psa 137:3-6", "n": "", "vs": [[3, "هناك طلب منا الذين سبونا أن نشدو بترنيمة، والذين عذبونا أن نطربهم قائلين: «أنشدوا لنا من ترانيم صهيون»."], [4, "كيف نشدو بترنيمة الرب في أرض غريبة؟"], [5, "إن نسيتك ياأورشليم، فلتنس يميني مهارتها."], [6, "ليلتصق لساني بحنكي إن لم أذكرك ولم أفضلك على ذروة أفراحي."]]}, {"l": "Lam 1:4", "n": "", "vs": [[4, "تنوح الطرق المفضية إلى صهيون، لأنها أقفرت من القادمين إلى الأعيا د! تهدمت بواباتها جميعا. كهنتها يتنهدون؛ عذاراها متحسرات وهي تقاسي مر العذاب."]]}, {"l": "Lam 1:7", "n": "", "vs": [[7, "تذكرت أورشليم في أيام شقائها ومحنتها جميع ما كانت تتمتع به من مشتهيات في حقبها الغابرة. عندما وقع شعبها في قبضة العدو لم يكن لها مسعف، رآها العدو صريعة وسخر لهلاكها."]]}, {"l": "Lam 2:6", "n": "", "vs": [[6, "نقض مظلته كما ينقض كوخ من الأغصان في حديقة، وردم مقر مجتمعه. جعل الرب صهيون تنسى مواسم أعيادها وسبوتها. ونبذ باحتدام سخطه الملك والكاهن."]]}, {"l": "Lam 2:7", "n": "", "vs": [[7, "كره الرب مذبحه، وتبرأ من مقدسه، وسلم أسوار قصورها إلى يد الأعداء الذين علا هتافهم في بيت الرب كما كان يعلو هتافنا في الأعياد."]]}, {"l": "Hos 9:5", "n": "", "vs": [[5, "ماذا تفعلون في يوم الاحتفال وفي يوم عيد الرب؟"]]}], "kwAr": "يوم موسم عيد", "noteAr": ""}, {"kw": "the reproach of it was a burden", "raw": "Heb. the burden upon it was reproach.", "note": "Heb. the burden upon it was reproach.", "refs": [], "kwAr": "فلا تتحملين من أجلها أي عار", "noteAr": "بالعبرية: «العبء عليها عار»."}], "arS": [["وكما في يوم ", []], ["موسم", ["H4150"]], [" عيد، ", []], ["أزيل", ["H622", "H3013"]], [" عنك بلاياك، ", []], ["فلا", ["H1961"]], [" ", []], ["تتحملين", ["H4864"]], [" من ", []], ["أجلها", ["H5921"]], [" أي ", []], ["عار", ["H2781"]], [".", []]]}, {"c": 3, "v": 19, "text": "في ذلك الوقت أعاقب الذين ضايقوك، وأخلص الأعرج، وأعيد المسبي، وأغدق عليهم مدحا وشرفا في كل أرض تعرضوا فيها للخزي.", "groups": [{"kw": "I will undo", "raw": "Zep_3:15; Isa_25:9-12, Isa_26:11, Isa_41:11-16, Isa_43:14-17, Isa_49:25, Isa_49:26, Isa_51:22, Isa_51:23; Isa_66:14-16; Jer_30:16, Jer_46:28, Jer_51:35, Jer_51:36; Eze_39:17-22; Joe_3:2-9; Mic_7:10; Nah_1:11-14; Zec_2:8, Zec_2:9, Zec_12:3, Zec_12:4, Zec_14:2, Zec_14:3; Rev_19:17-21, Rev_20:9", "note": "", "refs": [{"l": "Zep 3:15", "n": "", "vs": [[15, "لأن الرب قد رفع عنك حكم قضائه ورد عنك أعداءك. إن الرب ملك إسرائيل هو في وسطك، فلا تخشي شرا في ما بعد."]]}, {"l": "Isa 25:9-12", "n": "", "vs": [[9, "ويقولون في ذلك اليوم: «ها هو إلهنا الذي انتظرناه فخلصنا. هذا هو الرب الذي انتظرناه نبتهج ونفرح بخلاصه»."], [10, "لأن يد الرب تستقر على هذا الجبل ويوطأ موآب في مكانه كما يوطأ التبن في الطين."], [11, "ويبسط يديه في وسط موآب كما يبسط السابح يديه ليسبح، ويخفض الرب من كبريائه ومن مكايد يديه،"], [12, "ويهدم أسواره الحصينة الشامخة، ويخفضها حتى تتساوى مع التراب."]]}, {"l": "Isa 26:11", "n": "", "vs": [[11, "يارب إن يدك مرتفعة وهم لا يرونها، فدعهم يشاهدون غيرتك على شعبك، ويخزون. لتلتهمهم النار التي ادخرتها لأعدائك."]]}, {"l": "Isa 41:11-16", "n": "", "vs": [[11, "يعتري الخزي والعار كل من يغتاظ منك، ويتلاشى مقاوموك كالعدم."], [12, "تبحث عن خصومك فلا تجد أحدا منهم، ويصبح محاربوك كلا شيء،"], [13, "لأني أنا الرب إلهك الذي يمسك بيمينك قائلا لك: لا تخف. سأعينك."], [14, "لا تخف يايعقوب الضعيف كالحشرة، وياإسرائيل العليل كالشرذمة، لأني سأعينك، يقول الرب فاديك قدوس إسرائيل."], [15, "وها أنا أجعلك نورجا محددا جديدا مسننا، فتدرس الجبال وتجعل التلال كالعصافة،"], [16, "فتذريها، وتحملها الريح بعيدا، وتبددها الزوبعة. أما أنت فتبتهج بالرب وتمجد قدوس إسرائيل."]]}, {"l": "Isa 43:14-17", "n": "", "vs": [[14, "هذا ما يقوله الرب فاديكم قدوس إسرائيل، ها أنا من أجلكم أرسلت إلى بابل لأحطم المغاليق، فيصبح البابليون في سفنهم التي يباهون بها مطرودين هاربين."], [15, "أنا هو الرب قدوسكم خالق إسرائيل وملككم."], [16, "هذا ما يقوله الرب الصانع في البحر طريقا، وممرا في اللجج العميقة،"], [17, "الذي يستدرج المركبات والخيول والجيش والمقاتلين، فيسقطون صرعى جميعا ولا يقومون، ويخمدون كذبالة وينطفئون."]]}, {"l": "Isa 49:25", "n": "", "vs": [[25, "نعم سبي الجبار يسلب منه، وتسترد الغنيمة من الغالب، لأنني أخاصم مخاصميك وأنقذ أبناءك،"]]}, {"l": "Isa 49:26", "n": "", "vs": [[26, "وأجعل مضطهديك يلتهمون لحوم أجسادهم، ويسكرون بدمهم كمن يشرب خمرا. عندئذ يدرك كل ذي جسد أنني أنا الرب مخلصك وفاديك إله يعقوب القدير."]]}, {"l": "Isa 51:22", "n": "", "vs": [[22, "هذا ما يقوله سيدك الرب، إلهك الذي يدافع عن دعوى شعبه: ها أنا قد أخذت من يدك كأس الترنح، ولن تجرعي من كأس غضبي بعد."]]}, {"l": "Isa 51:23", "n": "", "vs": [[23, "وأضعها في يد معذبيك الذين قالوا لك: انحني حتى ندوس عليك عابرين. فجعلت ظهرك لهم أرضا، وطريقا لهم يمرون عليه."]]}, {"l": "Isa 66:14-16", "n": "", "vs": [[14, "وتشهدون فتسر قلوبكم وتزدهر عظامكم كالعشب، فتصبح يد الرب معروفة عند عبيده، وينصب غضبه على أعدائه."], [15, "لأنه ها هو الرب مقبل بنار، ومركباته كالعاصفة، ليسكب غضبه بسخط، وزجره بلهيب نار."], [16, "لأن الرب يعاقب أهل الأرض بناره وسيفه، ويكثر قتلى الرب."]]}, {"l": "Jer 30:16", "n": "", "vs": [[16, "ولكن سيأتي يوم يفترس فيه جميع مفترسيك ويذهب جميع مضايقيك إلى السبي، ويصبح ناهبوك منهوبين،"]]}, {"l": "Jer 46:28", "n": "", "vs": [[28, "لا تخافوا ياذرية عبدي يعقوب، يقول الرب، لأني معكم وأفني جميع الأمم التي شتتكم إليها. أما أنتم فلا أفنيكم بل أؤدبكم بالحق، إنما لا أبرئكم جميعا»."]]}, {"l": "Jer 51:35", "n": "", "vs": [[35, "يقول أهل أورشليم: ليحل ببابل ما أصابنا وأصاب لحومنا من ظلم. وتقول أورشليم: دمي على أهل أرض الكلدانيين."]]}, {"l": "Jer 51:36", "n": "", "vs": [[36, "لذلك هذا ما يعلنه الرب: ها أنا أدافع عن دعواك وأنتقم لك، فأجفف بحر بابل وينابيعها،"]]}, {"l": "Eze 39:17-22", "n": "", "vs": [[17, "أما أنت ياابن آدم، فهذا ما يعلنه السيد الرب: قل لكل أصناف الطيور ولجميع وحوش البرية اجتمعي وتعالي، احتشدي من كل جهة حول ذبيحتي التي أعدها لك، ذبيحة عظيمة أقيمها على جبال إسرائيل فتأكلين لحما وتشربين دما."], [18, "تأكلين لحم الجبابرة وترتوين من دماء رؤساء الأرض وكأنها كباش وحملان وتيوس وعجول كلها من قطعان باشان السمينة."], [19, "فتأكلين شحما حتى الشبع، وتشربين دما حتى السكر من ذبيحتي التي أعددتها لك."], [20, "فتشبعين على مائدتي من الخيل وفرسانها، من الجبابرة وكل المحاربين، يقول السيد الرب."], [21, "وأجعل مجدي يتجلى بين الأمم فتشهد دينونتي التي أنزلتها بهم، وقدرة يدي التي مددتها عليهم."], [22, "فيدرك شعب إسرائيل أني أنا الرب إلههم من ذلك اليوم فصاعدا."]]}, {"l": "Joe 3:2-9", "n": "", "vs": [[2, "أجمع الأمم كلها وأحضرهم إلى وادي يهوشافاط، وأحاكمهم هناك من أجل شعبي وميراثي إسرائيل، لأنهم شتتوهم بين الشعوب واقتسموا أرضي."], [3, "وألقوا القرعة على شعبي فقايضوا الزانية بالصبي، وباعوا الصبية لقاء شربة خمر."], [4, "ماذا لديكم ضدي ياصور وصيدون وسائر أقاليم فلسطين؟ أتجازونني على أمر أتيته؟ أم تسعون لإيذائي؟ إني أنزل العقاب على رؤوسكم بغتة وسريعا."], [5, "لأنكم قد استوليتم على ذهبي وفضتي، ونقلتم نفائسي إلى هياكلكم."], [6, "وبعتم يهوذا وأبناء أورشليم إلى الأغارقة لتبعدوهم عن تخوم أرضهم."], [7, "وها أنا الآن أنهضهم من الموضع حيث بعتموهم، وأرد على رؤوسكم سوء أعمالكم."], [8, "وأبيع أبناءكم وبناتكم بأيدي أبناء يهوذا، فيبيعونهم بدورهم إلى السبئيين، إلى أمة بعيدة، لأن الرب قد أصدر قضاءه."], [9, "نادوا بهذا بين الأمم، وتأهبوا للحرب. احشدوا أبطالكم. ليتقدم ويصعد جميع رجال القتال."]]}, {"l": "Mic 7:10", "n": "", "vs": [[10, "عندئذ ترى ذلك عدوتي فيعتريها الخزي إذ قالت لي: «أين هو الرب إلهك؟» ستشهدها عيناي تداس كطين الشوارع والأزقة."]]}, {"l": "Nah 1:11-14", "n": "", "vs": [[11, "منك خرج يانينوى من تآمر بالشر على الرب، والمشير بالسوء."], [12, "وهذا ما يقوله الرب: مع أنكم أقوياء وكثيرون فإنكم تستأصلون وتفنون. أما أنتم ياشعبي فقد عاقبتكم أشد عقاب ولن أنزل بكم الويلات ثانية."], [13, "بل أحطم الآن نير أشور عنكم، وأكسر أغلالكم."], [14, "وها الرب قد أصدر قضاءه بشأنك ياأشور: لن تبقى لك ذرية تحمل اسمك. وأستأصل من هيكل آلهتك منحوتاتك ومسبوكاتك، وأجعله قبرك، لأنك صرت نجسا."]]}, {"l": "Zec 2:8", "n": "", "vs": [[8, "فإن الرب القدير يقول إنه أرسلني إلى الأمم التي سلبتكم إعلاء لمجده، لأن من يمسكم يمس حدقة عينه."]]}, {"l": "Zec 2:9", "n": "", "vs": [[9, "ها أنا أضربهم بيدي فيصيرون نهبا لعبيدهم، فتدركون أن الرب القدير قد أرسلني حقا."]]}, {"l": "Zec 12:3", "n": "", "vs": [[3, "في ذلك اليوم أجعل أورشليم كصخرة ثقيلة تعجز عن حملها جميع الشعوب. وكل من يحاول حملها ينشق شقا، ويتألب عليها جميع شعوب الأرض."]]}, {"l": "Zec 12:4", "n": "", "vs": [[4, "في ذلك اليوم، يقول الرب: أصيب كل فرس من جيوش الأعداء بالرعب، وفارسه بالجنون، وأرعى برضاي شعب يهوذا، وأبتلي جميع خيول الأمم بالعمى."]]}, {"l": "Zec 14:2", "n": "", "vs": [[2, "لأني أجمع جميع الأمم على أورشليم لتحاربها، فتؤخذ المدينة وتنهب البيوت وتغتصب النساء ويسبى نصف أهلها إلى المنفى. إنما لا ينقرض بقية الشعب من المدينة."]]}, {"l": "Zec 14:3", "n": "", "vs": [[3, "ولا يلبث أن يهب الرب ليحارب تلك الأمم، كما كان يحارب في يوم القتال."]]}, {"l": "Rev 19:17-21", "n": "", "vs": [[17, "ثم رأيت ملاكا واقفا في الشمس، ينادي الطيور الطائرة في وسط السماء بصوت عال قائلا: «هلمي اجتمعي معا إلى وليمة الله الكبرى!"], [18, "تعالي والتهمي لحوم الملوك والقادة والأبطال، والخيول وفرسانها، ولحوم البشر جميعا من أحرار وعبيد، وصغار وكبار»."], [19, "ورأيت الوحش وملوك الأرض وجيوشهم وقد احتشدوا ليحاربوا هذا الفارس وجيشه."], [20, "فقبض على الوحش وعلى النبي الدجال الذي قام بالمعجزات في حضور الوحش وأضل بها الذين قبلوا علامة الوحش، وسجدوا لتمثاله. وطرح كلاهما حيا في بحيرة النار والكبريت المتقدة،"], [21, "وقتل السيف الخارج من فم الفارس جميع الباقين، وشبعت الطيور كلها من لحومهم."]]}, {"l": "Rev 20:9", "n": "", "vs": [[9, "فيصعدون على سهول الأرض العريضة، ويحاصرون من كل جانب معسكر القديسين والمدينة المحبوبة، ولكن نارا من السماء تنزل عليهم وتلتهمهم."]]}], "kwAr": "أعاقب الذين ضايقوك", "noteAr": ""}, {"kw": "and I will save", "raw": "Jer_31:8; Eze_34:16; Mic_4:6, Mic_4:7; Heb_12:13", "note": "", "refs": [{"l": "Jer 31:8", "n": "", "vs": [[8, "ها أنا آتي بهم من بلاد الشمال، وأجمعهم من أقصى أطراف الأرض، وفيهم الأعمى والأعرج، الحبلى والماخض، فيرجع حشد عظيم إلى هنا."]]}, {"l": "Eze 34:16", "n": "", "vs": [[16, "وأطلب الضال وأسترجع المطرود وأجبر الكسير وأعصب الجريح وأستأصل السمين والقوي، وأرعاها بعدل."]]}, {"l": "Mic 4:6", "n": "", "vs": [[6, "في ذلك اليوم، يقول الرب، أجمع العرج، وأضم المطرودين وكل الذين أنزلت بهم البلاء."]]}, {"l": "Mic 4:7", "n": "", "vs": [[7, "فأجعل من العرج بقية، ومن المنبوذين أمة قوية، فيملك الرب عليهم في جبل صهيون من الآن وإلى الأبد."]]}, {"l": "Heb 12:13", "n": "", "vs": [[13, "ومهدوا لأقدامكم طرقا مستقيمة، حتى لا تنحرف أرجل العرج، بل تشفى!"]]}], "kwAr": "وأخلص", "noteAr": ""}, {"kw": "and I will", "raw": "Isa_60:14, Isa_61:7, Isa_62:7; Jer_33:9; Eze_39:26", "note": "", "refs": [{"l": "Isa 60:14", "n": "", "vs": [[14, "ويقبل إليك أبناء مضايقيك خاضعين، وكل الذين احتقروك ينحنون عند قدميك، ويدعونك مدينة الرب، صهيون قدوس إسرائيل."]]}, {"l": "Isa 61:7", "n": "", "vs": [[7, "وعوضا عن عاركم تنالون ضعفين من الميراث، وعوضا عن الهوان تبتهجون بنصيبكم، لهذا تملكون في أرضكم نصيبين، ويكون فرحكم أبديا."]]}, {"l": "Isa 62:7", "n": "", "vs": [[7, "ولا تدعوه يستكين حتى يعيد تأسيس أورشليم ويجعلها مفخرة الأرض."]]}, {"l": "Jer 33:9", "n": "", "vs": [[9, "وتصبح هذه المدينة مبعث سرور لي، وتسبحة وافتخارا لدى جميع أمم الأرض التي يبلغها كل ما أسديته من خير إليها، فتخاف وترتعد بفضل ما أغدقته عليها من إحسان وازدهار."]]}, {"l": "Eze 39:26", "n": "", "vs": [[26, "فينسون عارهم وخيانتهم التي ارتكبوها بحقي بعد أن أسكنهم في أرضهم مطمئنين لا يفزعهم أحد."]]}], "kwAr": "وأعيد", "noteAr": ""}, {"kw": "get them praise", "raw": "Heb. set them for a praise", "note": "Heb. set them for a praise", "refs": [], "kwAr": "مدحا وشرفا", "noteAr": "بالعبرية: «أجعلهم تسبيحة»."}, {"kw": "where they have been put to shame", "raw": "Heb. of their shame", "note": "Heb. of their shame", "refs": [], "kwAr": "تعرضوا فيها للخزي", "noteAr": "بالعبرية: «من خزيهم»."}], "arS": [["في ", []], ["ذلك", ["H1931"]], [" ", []], ["الوقت", ["H6256"]], [" ", []], ["أعاقب", ["H6213"]], [" الذين ", []], ["ضايقوك", ["H6031"]], ["، ", []], ["وأخلص", ["H3467"]], [" ", []], ["الأعرج", ["H6760"]], ["، ", []], ["وأعيد", ["H6908"]], [" ", []], ["المسبي", ["H5080"]], ["، ", []], ["وأغدق", ["H7760"]], [" عليهم ", []], ["مدحا", ["H8416"]], [" ", []], ["وشرفا", ["H8034"]], [" في ", []], ["كل", ["H3605"]], [" ", []], ["أرض", ["H776"]], [" تعرضوا فيها ", []], ["للخزي", ["H1322"]], [".", []]]}, {"c": 3, "v": 20, "text": "في ذلك الوقت أجمعكم من الشتات وأعيدكم إلى موطنكم، وأجعل لكم مقاما شريفا محمودا بين جميع شعوب الأرض، حين أرد لكم ازدهاركم. هكذا قال الرب.", "groups": [{"kw": "even", "raw": "Isa_11:11, Isa_11:12, Isa_27:12, Isa_27:13, Isa_56:8; Eze_28:25, Eze_34:16, Eze_37:21, Eze_39:28; Amo_9:14", "note": "", "refs": [{"l": "Isa 11:11", "n": "", "vs": [[11, "فيعود الرب ليمد يده ثانية ليسترد البقية الباقية من شعبه، من أشور ومصر وفتروس وكوش وعيلام وشنعار وحماة، ومن جزائر البحر،"]]}, {"l": "Isa 11:12", "n": "", "vs": [[12, "وينصب راية للأمم ويجمع منفيي إسرائيل ومشتتي يهوذا من أربعة أطراف الأرض،"]]}, {"l": "Isa 27:12", "n": "", "vs": [[12, "في ذلك اليوم ينتقيكم الرب من مجرى الفرات إلى وادي النيل، كما ينتقى القمح، ويجمعكم واحدا فواحدا يا بني إسرائيل."]]}, {"l": "Isa 27:13", "n": "", "vs": [[13, "في ذلك اليوم ينفخ في بوق عظيم فيأتي التائهون في أرض أشور، والمنفيون إلى ديار مصر، ليسجدوا للرب في جبل قدسه، في أورشليم."]]}, {"l": "Isa 56:8", "n": "", "vs": [[8, "وهذا ما يقوله السيد الرب الذي يلم شتات إسرائيل: سأجمع إليه آخرين بعد، فضلا عن الذين جمعتهم."]]}, {"l": "Eze 28:25", "n": "", "vs": [[25, "وهذا ما يعلنه السيد الرب: عندما أجمع شعب إسرائيل من بين الشعوب التي تفرقوا إليها، وتتجلى قداستي فيهم أمام عيون الأمم، عندما يعودون ويستوطنون في أرضهم التي وهبتها لعبدي يعقوب،"]]}, {"l": "Eze 34:16", "n": "", "vs": [[16, "وأطلب الضال وأسترجع المطرود وأجبر الكسير وأعصب الجريح وأستأصل السمين والقوي، وأرعاها بعدل."]]}, {"l": "Eze 37:21", "n": "", "vs": [[21, "وها أنا أحشد أبناء إسرائيل من بين الأمم التي تفرقوا فيها وأجمعهم من كل جهة وأحضرهم إلى أرضهم."]]}, {"l": "Eze 39:28", "n": "", "vs": [[28, "فيدركون أني أنا الرب إلههم، إذ نفيتهم إلى الأمم، ثم عدت وجمعتهم إلى أرضهم، من غير أن أبقي هناك منهم أحدا من بعد."]]}, {"l": "Amo 9:14", "n": "", "vs": [[14, "وأرد سبي شعبي إسرائيل فيعيدون بناء المدن الخربة ويسكنونها، ويزرعون كروما ويشربون من خمرها، ويغرسون جنات ويأكلون من ثمارها."]]}], "kwAr": "أجمعكم", "noteAr": ""}, {"kw": "for", "raw": "Zep_3:19; Isa_60:15, Isa_61:9, Isa_62:7, Isa_62:12; Mal_3:12", "note": "", "refs": [{"l": "Zep 3:19", "n": "", "vs": [[19, "في ذلك الوقت أعاقب الذين ضايقوك، وأخلص الأعرج، وأعيد المسبي، وأغدق عليهم مدحا وشرفا في كل أرض تعرضوا فيها للخزي."]]}, {"l": "Isa 60:15", "n": "", "vs": [[15, "وبعد أن كنت مهجورة ممقوتة لا يعبر بك أحد، سأجعلك بهية إلى الأبد، وفرح كل الأجيال،"]]}, {"l": "Isa 61:9", "n": "", "vs": [[9, "وتشتهر ذريتهم بين الأمم، ونسلهم وسط الشعوب، وكل من يراهم يعرفهم، ويقر أنهم شعب باركه الرب."]]}, {"l": "Isa 62:7", "n": "", "vs": [[7, "ولا تدعوه يستكين حتى يعيد تأسيس أورشليم ويجعلها مفخرة الأرض."]]}, {"l": "Isa 62:12", "n": "", "vs": [[12, "ويدعونه شعبا
