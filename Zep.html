<script>window.CATALOG=[{"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 20, "nv": 480, "refs": 6756, "last": "20:49", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 36, "abbr": "Zep", "en": "Zephaniah", "verses": [{"c": 1, "v": 1, "text": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا.", "groups": [{"kw": "word", "raw": "Eze_1:3; Hos_1:1; 2Ti_3:16; 2Pe_1:19", "note": "", "refs": [{"l": "Eze 1:3", "n": "", "vs": [[3, "أوحى الرب إلى حزقيال الكاهن ابن بوزي عند جوار نهر خابور، في ديار الكلدانيين، إذ كانت علي يد الرب،"]]}, {"l": "Hos 1:1", "n": "", "vs": [[1, "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."]]}, {"l": "2Ti 3:16", "n": "", "vs": [[16, "إن الكتاب بكل ما فيه، قد أوحى به الله؛ وهو مفيد للتعليم والتوبيخ والتقويم وتهذيب الإنسان في البر،"]]}, {"l": "2Pe 1:19", "n": "", "vs": [[19, "وهكذا، صارت الكلمة النبوية أكثر ثباتا عندنا. فحسنا تفعلون إن انتبهتم إلى هذه الكلمة في قلوبكم. إذ إنها أشبه بمصباح يضيء في مكان مظلم، إلى أن يطلع النهار ويظهر كوكب الصبح."]]}], "kwAr": "كلمة الرب", "noteAr": ""}, {"kw": "in the days", "raw": "2Kings 22:1-23:37; 2Chr. 34:1-35:27; Jer_1:2, Jer_25:3", "note": "", "refs": [{"l": "2Ki 22:1-23:37", "n": "", "vs": [[1, "كان يوشيا بن آمون في الثامنة من عمره حين ملك. ودام حكمه إحدى وثلاثين سنة في أورشليم، واسم أمه يديدة بنت عداية من بصقة."], [2, "وعمل ما هو صالح في عيني الرب، وسار في نهج جده داود ولم يحد عن طريقه يمينا أو شمالا."], [3, "وفي السنة الثامنة عشرة لحكم الملك يوشيا، بعث الملك الكاتب شافان بن أصليا بن مشلام إلى هيكل الرب قائلا:"], [4, "«اذهب إلى حلقيا رئيس الكهنة، واطلب إليه أن يحسب قيمة الفضة التي تبرع بها أبناء الشعب وجمعها منهم حراس الباب،"], [5, "فيعطيها للموكلين على الإشراف على العمل في هيكل الرب، فيدفعها هؤلاء إلى القائمين بالعمل في بيت الرب لترميم ثغرات الهيكل،"], [6, "من بنائين ونجارين، ولشراء الأخشاب والحجارة المنحوتة لترميم الهيكل»."], [7, "ولم يطلب من هؤلاء الموكلين على العمل تقديم أي حساب عن الفضة المدفوعة لهم لنزاهتهم."], [8, "ثم قال حلقيا رئيس الكهنة لشافان الكاتب: «لقد عثرت على سفر الشريعة في الهيكل». وسلم حلقيا السفر لشافان فقرأه."], [9, "وحمله إلى الملك، بعد أن قدم له تقريرا قائلا: «قد حسب عبيدك الفضة الموجودة في الهيكل وأودعوها لدى الموكلين على الإشراف على العمل في الهيكل»."], [10, "ثم أطلع شافان الكاتب الملك على السفر قائلا: «قد أعطاني حلقيا سفرا». وقرأه شافان أمام الملك"], [11, "فلما سمع الملك ما ورد في سفر الشريعة مزق ثيابه،"], [12, "وأمر حلقيا الكاهن، وأخيقام بن شافان، وعكبور بن ميخا، وشافان الكاتب، وعسايا خادم الملك قائلا:"], [13, "«اذهبوا واسألوا الرب عن مصيري ومصير شعب يهوذا بناء على ما ورد في هذا السفر الذي تم العثور عليه، إذ إن غضب الرب المحتدم علينا عظيم جدا، لأن آباءنا لم يطيعوا كلام هذا السفر، ولم يمارسوا كل ما ورد فيه»."], [14, "فانطلق حلقيا الكاهن، وأخيقام، وعكبور، وشافان، وعسايا، واستشاروا النبية خلدة زوجة شلوم بن تقوة بن حرحس حارس الثياب الملكية، المقيمة في المنطقة الثانية من أورشليم."], [15, "فقالت لهم: «هذا ما يقوله الرب إله إسرائيل: قولوا للرجل الذي أرسلكم إلي:"], [16, "هكذا يقول الرب: ها أنا أجلب على هذا الموضع وعلى أهله كل الوعيد الوارد في السفر الذي قرأه ملك يهوذا،"], [17, "لأنهم نبذوني وأوقدوا لآلهة أخرى، ليثيروا سخطي بما تجنيه أيديهم من آثام، فاحتدم غضبي الذي لا ينطفيء على هذا الموضع."], [18, "أما ملك يهوذا الذي أرسلكم لتستشيروا الرب، فهذا ما تقولون له: إليك ما يقول الرب إله إسرائيل بشأن ما سمعت من كلام:"], [19, "من حيث أن قلبك قد رق، وتواضعت أمام الرب لدى سماعك ما قضيت به على هذا الموضع وعلى أهله، بأن يصيروا مثار دهشة ولعنة، ومزقت ثيابك وبكيت أمامي، فإنني قد استجبت أنا أيضا رجاءك."], [20, "لذلك ها أنا أتوفاك فتدفن في قبرك بسلام، ولا تشهد عيناك ما سأنزله بهذا الموضع من شر». فحمل الرجال ردها إلى الملك يوشيا."], [1, "عندئذ أرسل الملك فاستدعى إليه كل شيوخ يهوذا وأورشليم،"], [2, "وتوجه معهم إلى هيكل الرب، يرافقه جميع شيوخ يهوذا وكل سكان أورشليم والكهنة والأنبياء وجميع أبناء الشعب من صغار وكبار، فقرأ في مسامعهم كل كلام سفر الشريعة الذي تم العثور عليه في بيت الرب."], [3, "ووقف الملك على المنبر وقطع عهدا أمام الرب أن يتبع الرب، حافظا وصاياه وشهاداته وفرائضه من كل القلب والنفس، لتطبيق كلام هذا العهد المدون في هذا السفر. فوعد الشعب بالوفاء بهذا العهد."], [4, "وأمر الملك حلقيا رئيس الكهنة، وكهنة الفرقة الثانية، وحراس الباب، أن يطرحوا من هيكل الرب جميع الآنية المصنوعة للبعل ولعشتاروث ولكل كواكب السماء. وأحرقها خارج أورشليم في حقول وادي قدرون، وحمل رمادها إلى بيت إيل."], [5, "وأباد كهنة الأصنام الذين أقامهم ملوك يهوذا ليوقدوا على مذابح المرتفعات في مدن يهوذا وضواحي أورشليم، وكذلك قضى على الكهنة الذين يحرقون للبعل وللشمس والقمر وللأبراج الفلكية ولسائر الكواكب."], [6, "وأخرج تمثال عشتاروث من هيكل الرب إلى خارج أورشليم إلى وادي قدرون، وأحرقه وسحقه إلى أن أصبح غبارا، وذرى الغبار على قبور عامة الشعب."], [7, "وهدم بيوت ذوي الشذوذ الجنسي القائمة حوالي هيكل الرب، حيث كانت النساء ينسجن ثيابا لتمثال عشتاروث."], [8, "واستدعى يوشيا جميع الكهنة من مدن يهوذا، ودنس كل أماكن العبادة الوثنية في التلال، حيث كان الكهنة يوقدون من جبع إلى بئر سبع، وهدم المرتفعات التي كانت قائمة عند مدخل قصر يشوع محافظ المدينة، إلى الجانب الأيسر من باب المدينة."], [9, "ولم يدع كهنة المرتفعات يستخدمون مذبح الرب في أورشليم وإن شاركوا بقية إخوتهم الكهنة في أكل خبز الفطير،"], [10, "ودنس الملك أيضا مذبح توفة في وادي بني هنوم، لكي لا يجيز أحد ابنه أو ابنته في النار للصنم مولك."], [11, "وأباد الخيل التي كرسها ملوك يهوذا لإله الشمس عند مدخل بيت الرب بجوار حجرة نثنملك مدير شؤون القصر، وأحرق المركبات المكرسة لعبادة الشمس."], [12, "وهدم الملك المذابح التي على سطح علية آحاز التي أقامها ملوك يهوذا، وأيضا المذابح التي بناها منسى في ساحتي الهيكل، وسحق حجارتها هناك ثم ذراها في وادي قدرون"], [13, "ونجس الملك جميع المرتفعات المواجهة لأورشليم، القائمة عن يمين جبل الهلاك، التي بناها سليمان ملك إسرائيل لعشتاروث إلهة صيدون الرجسة، ولكموش إله موآب النجس، ولملكوم إله بني عمون المقيت."], [14, "وحطم التماثيل، وقطع أعمدة الأصنام، وملأ مكانها من عظام الناس."], [15, "وكذلك هدم المذبح الذي شيده يربعام بن نباط في مرتفعة بيت إيل، واستغوى بذلك الإسرائيليين فأخطأوا. ثم أحرق المذبح وسحق المرتفعة، حتى تحولت إلى غبار، وأحرق عمود الصنم."], [16, "وتلفت الملك يوشيا حوله فشاهد مقابر منتشرة على الجبل، فأرسل وجمع عظامها وأحرقها على المذبح، ونجسه تتميما لقضاء الرب الذي نطق به رجل الله بشأن مذبح يربعام."], [17, "وسأل الملك: «ما هذا النصب الذي أراه؟» فأجابه رجال المدينة: «هو قبر رجل الله الذي جاء من يهوذا وأنبأ بكل ما أجريته على بيت إيل»."], [18, "فقال: «دعوه. لا يحرك أحد عظامه». فتركوا عظامه وعظام نبي السامرة."], [19, "وأزال يوشيا جميع معابد المرتفعات المنتشرة في مدن السامرة، التي بناها ملوك إسرائيل لإثارة سخط الرب، وأجرى عليها ما أجراه على بيت إيل."], [20, "وقتل جميع كهنة المرتفعات التي هناك على المذابح، وأحرق عظام الناس عليها. ثم عاد إلى أورشليم."], [21, "وأمر الملك جميع الشعب قائلا: «احتفلوا بفصح الرب إلهكم كما هو مدون في سفر العهد هذا»."], [22, "إذ لم يكن قد احتفل بعيد الفصح هذا منذ أيام القضاة الذين حكموا على إسرائيل، ولا في كل حقبة ملوك إسرائيل وملوك يهوذا."], [23, "ولكن في السنة الثامنة عشرة لحكم الملك يوشيا احتفل بهذا الفصح للرب في أورشليم"], [24, "وأباد يوشيا أيضا السحرة والعرافين وأصنام الآلهة التي يتعبد لها الناس في منازلهم، والأوثان وجميع الرجاسات التي استشرت في أرض يهوذا وفي أورشليم، وذلك ليطبق ما ورد في الشريعة المدونة في السفر الذي عثر عليه حلقيا رئيس الكهنة في الهيكل."], [25, "ولم يقم ملك مثله من قبل ولا من بعد، رجع إلى الرب بكل قلبه ونفسه وقوته بمقتضى شريعة موسى."], [26, "غير أن الرب لم يرجع عن شدة غضبه، لأن غضبه احتدم على يهوذا لفرط ما أثار منسى من سخطه."], [27, "فقال الرب: «سأستأصل يهوذا من أمامي كما استأصلت إسرائيل، وأتنكر لأورشليم، المدينة التي اخترتها، وللهيكل الذي قلت يكون اسمي فيه»."], [28, "أما بقية أخبار يوشيا وكل منجزاته أليست هي مدونه في كتاب أخبار أيام ملوك يهوذا؟"], [29, "وفي أيام حكم يوشيا زحف فرعون نخو ملك مصر نحو نهر الفرات لمحاربة ملك أشور، فهب يوشيا لمساعدة ملك أشور عند مجدو، فقتله ملك مصر، في أثناء المعركة."], [30, "فحمله رجاله في مركبة وعادوا به من مجدو لأورشليم، حيث دفنوه في قبره. فولى الشعب يهوآحاز بن يوشيا ملكا عليهم خلفا لأبيه."], [31, "وكان يهوآحاز في الثالثة والعشرين من عمره حين ملك، ودام حكمه ثلاثة أشهر في أورشليم، واسم أمه حموطل بنت إرميا من لبنة."], [32, "وارتكب الشر في عيني الرب على غرار ما فعل آباؤه."], [33, "واعتقل فرعون نخو يهوآحاز وقيده في ربلة في أرض حماة لئلا يملك في أورشليم، وفرض جزية على البلاد: مئة وزنة من الفضة (نحو ثلاث مئة وستين كيلو جراما)، ووزنة من الذهب (نحو ثلاثة كيلوجرامات)."], [34, "ونصب فرعون نخو ألياقيم بن يوشيا خلفا ليوشيا أبيه، وغير اسمه إلى يهوياقيم. ثم ساق يهوآحاز أسيرا إلى مصر حيث مات."], [35, "وأدى يهوياقيم جزية الفضة والذهب لفرعون، إلا أنه فرض ضرائب على أهل البلاد ليتمكن من دفعها، بحسب ما يمتلكون."], [36, "وكان يهوياقيم في الخامسة والعشرين من عمره حين ملك، ودام حكمه إحدى عشرة سنة في أورشليم، واسم أمه زبيدة بنت فداية من رومة."], [37, "وارتكب الشر في عيني الرب على غرار ما فعل آباؤه."]]}, {"l": "2Ch 34:1-35:27", "n": "", "vs": [[1, "كان يوشيا في الثامنة من عمره حين ملك، ودام حكمه إحدى وثلاثين سنة في أورشليم."], [2, "وكان ملكا صالحا سار في طريق جده داود من غير أن يحيد عنه يمينا أو شمالا."], [3, "وفي السنة الثامنة من ملكه، وهو بعد فتى، ابتدأ يعبد إله جده داود. وفي السنة الثانية عشرة شرع يطهر أرض يهوذا وأورشليم من المرتفعات وتماثيل عشتاروث والأصنام والمسبوكات."], [4, "وهدم رجاله مذابح البعل وحطموا تماثيل عبادة الشمس القائمة فوقها، وكسروا السواري والتماثيل والمسبوكات ودقوها وذروها على قبور الذين قربوا لها."], [5, "وأحرقوا عظام كهنة الأوثان على مذابحهم وطهروا أرض يهوذا وأورشليم."], [6, "وكذلك فعل في مدن أسباط منسى وأفرايم وشمعون حتى نفتالي وخرائبها المحيطة بها،"], [7, "فهدم السواري ودق الأصنام ناعما وحطم تماثيل الشمس في كل أرض إسرائيل ثم رجع إلى أورشليم."], [8, "وفي السنة الثامنة عشرة لملكه، بعد أن قام بتطهير البلاد والهيكل بعث شافان بن أصليا، ومعسيا محافظ المدينة ويوآخ بن يوآحاز المسجل ليرمموا هيكل الله إلهه."], [9, "فجاءوا إلى حلقيا رئيس الكهنة، وأعطوه الفضة التي تم تقديمها إلى هيكل الله التي جمعها اللاويون حراس باب الهيكل من أسباط منسى وأفرايم وسائر إسرائيل ويهوذا وبنيامين وأهالي أورشليم،"], [10, "ثم أودعوها عند الموكلين على الإشراف على العمل في هيكل الرب، الذين دفعوها بدورهم للعاملين على إصلاح الهيكل وترميمه."], [11, "وكذلك أعطوا منها للنجارين والبنائين ليشتروا حجارة منحوتة، وأخشابا للوصلات، وعوارض لسقوف البيوت التي تركها ملوك يهوذا تتداعى."], [12, "فقام الرجال بعملهم بكل أمانة، تحت إشراف يحث وعوبديا اللاويين من ذرية مراري، وزكريا ومشلام من ذرية القهاتيين. كما أشرف اللاويون الماهرون على العزف على الآلات الموسيقية،"], [13, "وعلى أعمال الحمالين، وعلى سائر العمال القائمين بمختلف أنواع الخدمة، كما كان بعض اللاويين كتابا، وعرفاء وحراسا على الأبواب."], [14, "وفيما كانوا يخرجون الفضة التي تم إدخالها في مخازن هيكل الرب، عثر حلقيا الكاهن على سفر شريعة الرب الذي أوصى به على لسان موسى."], [15, "فقال حلقيا لشافان الكاتب: «قد عثرت على سفر الشريعة في هيكل الرب». وسلم حلقيا السفر إلى شافان."], [16, "فحمله شافان إلى الملك. وقدم له تقريرا قائلا: «إن عبيدك ينفذون كل شيء عهدت به إليهم،"], [17, "وقد أفرغوا الفضة الموجودة في الهيكل وأودعوها عند الموكلين بالإشراف على العمل، وعند العمال»."], [18, "ثم أطلع شافان الكاتب الملك على السفر قائلا: «قد أعطاني حلقيا الكاهن سفرا». وقرأه شافان أمام الملك."], [19, "فلما سمع الملك نص الشريعة مزق ثيابه،"], [20, "وأمر حلقيا وأخيقام بن شافان وعبدون بن ميخا وشافان الكاتب وعسايا خادم الملك:"], [21, "«اذهبوا واسألوا الرب عما يكون مصيري ومصير من بقي من إسرائيل ويهوذا، بناء على ما ورد في نص هذا السفر الذي تم العثور عليه، إذ إن غضب الرب المنسكب علينا عظيم، لأن آباءنا لم يطيعوا كلام هذا السفر ولم يمارسوا كل ما ورد فيه»."], [22, "فانطلق حلقيا ومن أرسلهم معه الملك، إلى خلدة النبية، زوجة شلوم بن توقهة بن حسرة، حارس الثياب الملكية، المقيمة في المنطقة الثانية من أورشليم، وخاطبوها (بما أوصاهم به الملك)."], [23, "فقالت: «هذا ما يقوله الرب إله إسرائيل: قولوا للرجل الذي أرسلكم إلي:"], [24, "هكذا يقول الرب: ها أنا جالب على هذا الموضع وعلى أهله كل اللعنات الواردة في السفر الذي قريء أمام ملك يهوذا،"], [25, "لأنهم نبذوني وأوقدوا لآلهة أخرى، ليثيروا سخطي بما تجنيه أيديهم من آثام، فينسكب غضبي الذي لا ينطفيء على هذا الموضع."], [26, "أما ملك يهوذا الذي أرسلكم لتستشيروا الرب، فهذا ما تقولون له: إليك ما يقوله الرب إله إسرائيل: بشأن ما سمعت من كلام:"], [27, "من حيث أن قلبك قد رق، وتذللت أمام الله لدى سماعك ما قضت به الشريعة على هذا الموضع وعلى أهله، وتواضعت أمامي ومزقت ثيابك وبكيت في حضرتي، فإنني قد استجبت لك أنا أيضا، يقول الرب."], [28, "لذلك ها أنا أتوفاك فتدفن في قبرك بسلام، ولا تشهد عيناك ما سأنزل بهذا الموضع وأهله من شر». فحمل الرجال ردها إلى الملك."], [29, "عندئذ استدعى الملك إليه كل شيوخ يهوذا وأورشليم،"], [30, "وتوجه إلى هيكل الرب، يرافقه كل رجال يهوذا وسكان أورشليم، والكهنة واللاويون وسائر الشعب من صغار وكبار، وقرأ في مسامعهم كل كلام سفر الشريعة الذي تم العثور عليه في بيت الرب."], [31, "ووقف الملك على منبره وقطع عهدا أمام الرب أن يتبع الرب ويحفظ وصاياه وشهاداته وفرائضه من كل القلب والنفس، ويطبق كلام هذا العهد المدون في هذا السفر."], [32, "ثم أخذ الملك عهدا على كل الموجودين من أهل أورشليم ومن رجال بنيامين أن يسلكوا حسب عهد الله إله آبائهم."], [33, "وأزال يوشيا جميع الرجاسات من كل أراضي بني إسرائيل، وطالب جميع الموجودين في أورشليم أن يعبدوا الرب إلههم، فلم يزغ الشعب عن عبادة الرب طوال أيام حياته."], [1, "واحتفل يوشيا في أورشليم بفصح الرب في اليوم الرابع عشر من الشهر الأول."], [2, "وعين الكهنة في وظائفهم وحضهم على القيام بخدمة هيكل الرب،"], [3, "وقال للاويين الذين كانوا يعلمون إسرائيل ممن تقدسوا للرب: «ضعوا تابوت القدس في الهيكل الذي بناه سليمان بن داود ملك إسرائيل، وكفوا عن حمله على الأكتاف، واعملوا على خدمة الرب إلهكم وخدمة شعبه إسرائيل."], [4, "وأحصوا بيوت آبائكم، وقسموا أنفسكم حسب فرقكم بموجب تعليمات داود ملك إسرائيل، وبمقتضى ما نص عليه سليمان ابنه."], [5, "وقفوا في القدس بحسب أقسام بيوت آباء إخوتكم من أبناء الشعب، وبحسب فرق بيوت آباء اللاويين."], [6, "واذبحوا حمل الفصح وتقدسوا. وهيئوا إخوتكم ليعملوا وفق شريعة الرب التي أعطاها لموسى»."], [7, "وتبرع يوشيا من ماله لأبناء الشعب الموجودين للاحتفال بالفصح بثلاثين ألفا من الحملان وثلاثة آلاف من البقر."], [8, "كما قدم رجال دولته تبرعات للشعب والكهنة واللاويين، فقدم حلقيا وزكريا ويحيئيل رؤساء بيت الله للكهنة ألفين وست مئة بقرة."], [9, "كما تبرع رؤساء اللاويين كوننيا وأخواه شمعيا ونثنيئيل، وحشبيا ويعيئيل ويوزاباد للاويين بخمسة آلاف حمل للفصح وخمس مئة بقرة."], [10, "وهكذا تم إعداد كل شيء للخدمة، فاحتل الكهنة مقامهم، وتوزع اللاويون في فرقهم حسب أمر الملك."], [11, "وذبحوا حملان الفصح. ورش الكهنة الدم بأيديهم، أما اللاويون فكانوا يسلخون الحملان."], [12, "ثم أفرزوا المحرقات ليوزعوها على أبناء الشعب حسب أقسام بيوتات الآباء، ليقربوها للرب كما هو منصوص عليه في سفر موسى. وفعلوا الشيء نفسه بالبقر."], [13, "وشووا حملان الفصح بالنار بمقتضى الشريعة، أما التقدمات المقدسة فقد طبخوها في القدور والمراجل والصحاف وفرقوها على الشعب."], [14, "ثم أعد اللاويون اللحم لأنفسهم وللكهنة أبناء هرون، الذين انهمكوا طوال النهار حتى حلول الليل في تقريب المحرقات وإحراق الشحم."], [15, "واتخذ المغنون من ذرية آساف أماكنهم، حسب النظام الذي عمله داود وآساف وهيمان ويدوثون نبي الملك. وقام الحراس بالوقوف عند كل باب من أبواب الهيكل، ولم يهجروا مواقعهم، لأن إخوتهم اللاويين قد جهزوا لهم طعامهم."], [16, "وهكذا تمت كل إجراءات خدمة الرب في ذلك اليوم للاحتفال بالفصح وتقريب المحرقات على مذبح الرب بموجب أمر الملك يوشيا."], [17, "واحتفل بنو إسرائيل الحاضرون في ذلك الوقت بالفصح وبعيد الفطير سبعة أيام."], [18, "ولم يجر احتفال مثله في إسرائيل منذ أيام صموئيل النبي. ولم يحتفل أحد ملوك إسرائيل بالفصح بمثل ما احتفل به يوشيا والكهنة واللاويون وكل يهوذا وإسرائيل الحاضرون، وأهل أورشليم."], [19, "وقد جرى الاحتفال بالفصح في السنة الثامنة عشرة من ملك يوشيا."], [20, "وبعد أن نظم يوشيا خدمة الهيكل، زحف فرعون نخو ملك مصر إلى كركميش، لخوض حرب عند الفرات، فتأهب يوشيا لقتاله."], [21, "فبعث إليه نخو رسلا يقول: «أي نزاع بيني وبينك ياملك يهوذا؟ أنا لست أبغي أن أهاجمك في هذا الوقت. إنما جئت لأحارب أعدائي. وقد أمرني الله بالإسراع. فكف عن مقاومة الله عاضدي لئلا يهلكك»."], [22, "فلم يرجع يوشيا عن قتاله، بل تنكر ليحاربه. ولم يصغ لتحذير الله على فم نخو، بل جد في محاربته في سهل مجدو."], [23, "فأصاب رماة نخو الملك يوشيا، فقال لرجاله: «انقلوني، لأنني أصبت بجرح بليغ»."], [24, "فنقله رجاله من المركبة إلى مركبته الثانية، وأعادوه إلى أورشليم، حيث مات ودفن في مقابر آبائه. فناحت عليه كل مملكة يهوذا وأورشليم."], [25, "ورثى النبي إرميا يوشيا، وظل جميع المغنين والمغنيات يندبون يوشيا في مراثيهم إلى هذا اليوم، فأصبحت هذه المرثاة التي تم تدوينها في مجموعة المراثي فريضة على إسرائيل."], [26, "أما بقية أخبار يوشيا وأعماله الصالحة المتوافقة مع ما نصت عليه شريعة الرب،"], [27, "ومنجزاته من بدايتها إلى نهايتها فهي مدونة في كتاب تاريخ ملوك إسرائيل ويهوذا."]]}, {"l": "Jer 1:2", "n": "", "vs": [[2, "وقد أعلن الرب له هذه النبوءة في عهد يوشيا بن آمون ملك يهوذا، في السنة الثالثة عشرة من ملكه."]]}, {"l": "Jer 25:3", "n": "", "vs": [[3, "«على مدى ثلاث وعشرين سنة، أي مند السنة الثالثة عشرة من حكم يوشيا بن آمون ملك يهوذا، وحتى هذا اليوم، والرب يوحي إلي بكلمته، فخاطبتكم بها تكرارا منذ البدء ولكنكم لم تسمعوا."]]}], "kwAr": "في عهد", "noteAr": ""}], "arS": [["هذه ", []], ["كلمة", ["H1697"]], [" ", []], ["الرب", ["H3068"]], [" التي ", []], ["أوحى", ["H1961"]], [" بها إلى ", []], ["صفنيا", ["H6846"]], [" ", []], ["بن", ["H1121"]], [" ", []], ["كوشي", ["H3570"]], [" ", []], ["بن", ["H1121"]], [" ", []], ["جدليا", ["H1436"]], [" ", []], ["بن", ["H1121"]], [" ", []], ["أمريا", ["H568"]], [" ", []], ["بن", ["H1121"]], [" ", []], ["حزقيا", ["H2396"]], ["، في ", []], ["عهد", ["H3117"]], [" حكم ", []], ["يوشيا", ["H2977"]], [" ", []], ["بن", ["H1121"]], [" ", []], ["آمون", ["H526"]], [" ", []], ["ملك", ["H4428"]], [" ", []], ["يهوذا", ["H3063"]], [".", []]]}, {"c": 1, "v": 2, "text": "يقول الرب: «سأمحو محوا كل شيء عن وجه الأرض.", "groups": [{"kw": "I will", "raw": "etc. Heb. By taking away I will make an end, utterly. 2Ki_22:16, 2Ki_22:17; 2Ch_36:21; Isa_6:11; Jer_6:8, Jer_6:9, Jer_24:8-10, Jer_34:22, Jer_36:29; Eze_33:27-29; Mic_7:13", "note": "etc. Heb. By taking away I will make an end, utterly. 2Ki_22:16, 2Ki_22:17; 2Ch_36:21; Isa_6:11; Jer_6:8, Jer_6:9, Jer_24:8-10, Jer_34:22, Jer_36:29; Eze_33:27-29; Mic_7:13", "refs": [{"l": "2Ki 22:16", "n": "", "vs": [[16, "هكذا يقول الرب: ها أنا أجلب على هذا الموضع وعلى أهله كل الوعيد الوارد في السفر الذي قرأه ملك يهوذا،"]]}, {"l": "2Ki 22:17", "n": "", "vs": [[17, "لأنهم نبذوني وأوقدوا لآلهة أخرى، ليثيروا سخطي بما تجنيه أيديهم من آثام، فاحتدم غضبي الذي لا ينطفيء على هذا الموضع."]]}, {"l": "2Ch 36:21", "n": "", "vs": [[21, "وذلك لكي يتم كلام الرب الذي نطق به على لسان إرميا، حتى تستوفي الأرض سبوتها، إذ أنها بقيت من غير إنتاج كل أيام خرابها حتى انقضاء سبعين سنة."]]}, {"l": "Isa 6:11", "n": "", "vs": [[11, "ثم قلت: «إلى متى يارب؟» فأجاب: «إلى أن تصبح المدن خربة مهجورة، والبيوت خالية من الرجال، والحقول خرابا مقفرا."]]}, {"l": "Jer 6:8", "n": "", "vs": [[8, "فاحذري ياأورشليم لئلا أجفوك وأجعلك موحشة وأرضا مهجورة»."]]}, {"l": "Jer 6:9", "n": "", "vs": [[9, "وهذا ما يعلنه الرب القدير: «ليجمعوا بدقة لقاط بقية إسرائيل كما يجمعون لقاط كرمة. رد يدك إلى الأغصان ثانية كلاقط العنب»."]]}, {"l": "Jer 24:8-10", "n": "", "vs": [[8, "أما صدقيا ملك يهوذا وعظماؤه وسائر أهل أورشليم الذين مكثوا في هذه الأرض والذين نزحوا إلى ديار مصر، فإني أجعلهم مثل هذا التين الرديء الذي تعاف النفس أكله لفرط رداءته."], [9, "وأوقعهم في الضيق والشر في جميع ممالك الأرض، وأجعلهم عارا وعبرة وأحدوثة ولعنة في جميع الأماكن التي أجليهم إليها."], [10, "وأعرضهم للسيف والجوع والوباء حتى يفنوا في الأرض التي وهبتها لهم ولآبائهم»."]]}, {"l": "Jer 34:22", "n": "", "vs": [[22, "ها أنا آمرهم، يقول الرب، فيرجعون لمحاربة هذه المدينة ويستولون عليها ويحرقونها بالنار، وأجعل مدن يهوذا أطلالا خاوية»."]]}, {"l": "Jer 36:29", "n": "", "vs": [[29, "وقل فيه عن يهوياقيم ملك يهوذا: هذا ما يعلنه الرب: إنك قد أحرقت هذا الكتاب قائلا: لماذا دونت فيه أن ملك بابل سيزحف على هذه الأرض ويدمرها ويقضي على ما فيها من إنسان وحيوان؟"]]}, {"l": "Eze 33:27-29", "n": "", "vs": [[27, "قل لهم، هذا ما يعلنه السيد الرب: حي أنا، إن الذين يقيمون في الخرائب يقتلون بالسيف، والذين يسكنون في العراء أبذلهم قوتا للوحوش، والمتمنعون في الحصون والمغاور يموتون بالوباء."], [28, "فأجعل الأرض أطلالا مقفرة وتبطل كبرياء عزتها، وتصبح جبال إسرائيل جرداء لا يجتاز بها عابر."], [29, "فيدركون أني أنا الرب حين أجعل الأرض خربة مقفرة من جراء ما ارتكبوه من رجاسات."]]}, {"l": "Mic 7:13", "n": "", "vs": [[13, "غير أن الأرض تكون موحشة بسبب سيئات سكانها."]]}], "kwAr": "سأمحو محوا", "noteAr": "بالعبرية: «بالإزالة أنهي إنهاء». انظر 2مل 22: 16، 17؛ 2أخ 36: 21؛ إش 6: 11؛ إر 6: 8، 9؛ 24: 8-10؛ 34: 22؛ 36: 29؛ حز 33: 27-29؛ مي 7: 13"}, {"kw": "land", "raw": "Heb. face of the land", "note": "Heb. face of the land", "refs": [], "kwAr": "وجه الأرض", "noteAr": "بالعبرية: «وجه الأرض»."}], "arS": [["يقول", ["H5002"]], [" ", []], ["الرب", ["H3068"]], [": «", []], ["سأمحو", ["H622", "H5486"]], [" محوا ", []], ["كل", ["H3605"]], [" شيء ", []], ["عن", ["H4480", "H5921"]], [" ", []], ["وجه", ["H6440"]], [" ", []], ["الأرض", ["H127"]], [".", []]]}, {"c": 1, "v": 3, "text": "أبيد الإنسان والحيوان وطيور السماء وسمك البحر، وأقضي على الأشرار ومعاثرهم، وأستأصل البشر عن وجه الأرض، يقول الرب.", "groups": [{"kw": "consume man", "raw": "Jer_4:23-29, Jer_12:4; Hos_4:3", "note": "", "refs": [{"l": "Jer 4:23-29", "n": "", "vs": [[23, "تأملت الأرض فإذا هي خربة خاوية، وتطلعت إلى السماء فإذا هي مظلمة."], [24, "نظرت إلى الجبال وإذا بها ترتجف، وإلى الآكام وإذا بها تتقلقل."], [25, "تلفت حولي فلم أجد إنسانا، وإذا كل الطيور قد هربت."], [26, "نظرت وإذا بالأرض الخصيبة قد تحولت إلى بر ية، وأصبحت جميع مدنها أطلالا أمام الرب وأمام غضبه المحتدم."], [27, "وهذا ما يقوله الرب: «ستحيق الوحشة بكل الأرض، ولكني لن أفنيها."], [28, "فمن أجل هذا تنوح الأرض وتظلم السماوات من فوق، لأني قد نطقت بقضائي. وهكذا قررت، لذلك لا أندم ولا أرجع عن عزمي."], [29, "من جلبة الفارس ورامي السهام يهرب أهل المدن، ويوغلون في الغابات ويتسلقون الصخور. قد أصبحت المدن جميعها مهجورة لا يقيم فيها إنسان."]]}, {"l": "Jer 12:4", "n": "", "vs": [[4, "إلى متى تظل الأرض نائحة وعشب كل حقل ذاويا؟ هلكت البهائم والطيور من شر الساكنين فيها القائلين: «إنه لن يرى خاتمة مصيرنا»."]]}, {"l": "Hos 4:3", "n": "", "vs": [[3, "لذلك تنوح الأرض، ويذوي كل مقيم فيها، فضلاَ عن وحش البر وطير السماء، بل سمك البحر يستأصل أيضا."]]}], "kwAr": "أبيد الإنسان", "noteAr": ""}, {"kw": "stumblingblocks", "raw": "or, idols, Isa_27:9; Eze_7:19, Eze_14:3-7, Eze_44:12; Hos_14:3, Hos_14:8; Mic_5:11-14; Zec_13:2; Mat_23:39; Rev_2:14", "note": "or, idols, Isa_27:9; Eze_7:19, Eze_14:3-7, Eze_44:12; Hos_14:3, Hos_14:8; Mic_5:11-14; Zec_13:2; Mat_23:39; Rev_2:14", "refs": [{"l": "Isa 27:9", "n": "", "vs": [[9, "لهذا يكفر عن إثم يعقوب، ويكون هذا هو كل ثمر محو خطيئته، عندما يجعل جميع حجارة المذبح كحجارة الكلس المسحوقة، ولا يبقى تمثال لعشتاروث أو مذبح قائما."]]}, {"l": "Eze 7:19", "n": "", "vs": [[19, "يطرحون فضتهم في الشوارع، ويضحى ذهبهم نجاسة، وتعجز فضتهم وذهبهم عن إنقاذهم في يوم غضب الرب. لا يشبعون منهما جوعهم، ولا يملأون منهما أجوافهم لأنهما كانا معثرة إثم لهم."]]}, {"l": "Eze 14:3-7", "n": "", "vs": [[3, "ياابن آدم، إن هؤلاء الرجال قد نصبوا أصنامهم في قلوبهم، وأقاموا معثرة إثمهم تلقاء وجوههم، أفأجيب عن سؤالهم؟"], [4, "لذلك قل لهم: هذا ما يعلنه السيد الرب: كل رجل من شعب إسرائيل نصب أصنامه في قلبه وأقام معثرة إثمه تلقاء وجهه، ثم أقبل إلى النبي، فإني أنا الرب أجيب ذلك الوافد على كثرة أصنامه،"], [5, "لكي أستأسر قلوب شعب إسرائيل ثانية، لأنهم ارتدوا عني بالغواية وراء أصنامهم."], [6, "لذلك قل لشعب إسرائيل، هذا ما يعلنه السيد الرب: توبوا وارجعوا عن أصنامكم واصرفوا وجوهكم عن كل رجاستكم."], [7, "لأن كل رجل من شعب إسرائيل ومن الغرباء الدخلاء القاطنين في إسرائيل، إذا ارتد عني ونصب أصنامه في قلبه وأقام معثرة إثمه تلقاء وجهه، ثم حضر إلى النبي ليسأله عني، فإني أنا الرب أجيبه بذاتي."]]}, {"l": "Eze 44:12", "n": "", "vs": [[12, "لأنهم قاموا على خدمة عبادة أصنامهم، وكانوا عثرة إثم لشعب إسرائيل، لذلك أقسمت يقول السيد الرب أن أحملهم عقاب إثمهم،"]]}, {"l": "Hos 14:3", "n": "", "vs": [[3, "إن أشور لن تخلصنا، ولن نعتمد على خيول مصر لإنقاذنا، ولن نقول للأوثان صنعة أيدينا: «أنتم آلهتنا» لأن فيك وحدك يجد اليتيم رحمة»."]]}, {"l": "Hos 14:8", "n": "", "vs": [[8, "يقول أفرايم تائبا: «مالي وللأصنام!» فيجيب الرب: «قد استمعت وأنا رعيتك بعين الرضى وصرت لك كشجرة سرو خضراء، ومني أمدك بثمرك»."]]}, {"l": "Mic 5:11-14", "n": "", "vs": [[11, "وأخرب مدنكم وأهدم جميع حصونكم،"], [12, "وأقضي على السحر في دياركم ولا يبقى لكم عرافون،"], [13, "وأنتزع تماثيلكم وأنصابكم من وسطكم، فلا تعودون تسجدون لأصنام من صنع أيديكم."], [14, "وأفني عشتاروث من بينكم، وأهدم مدنكم،"]]}, {"l": "Zec 13:2", "n": "", "vs": [[2, "ويقول الرب القدير: في ذلك اليوم أستأصل أسماء الأصنام من الأرض فلا يعود لها ذكر، وألاشي الأنبياء الكذبة والروح النجس من الأرض."]]}, {"l": "Mat 23:39", "n": "", "vs": [[39, "فإني أقول لكم إنكم لن تروني من الآن، حتى تقولوا: مبارك الآتي باسم الرب! »"]]}, {"l": "Rev 2:14", "n": "", "vs": [[14, "ولكني وا يتقون الرب من ناحية، ويعبدون آلهتهم التي حملوها معهم من بين الأمم التي سبوا منها من ناحية أخرى."]]}, {"l": "2Ki 17:41", "n": "", "vs": [[41, "فكانوا يتقون الرب من ناحية، ويعبدون أوثانهم من ناحية أخرى. واقتفى بنوهم خطاهم في ممارساتهم إلى هذا اليوم."]]}, {"l": "Mat 6:24", "n": "", "vs": [[24, "لا يمكن لأحد أن يكون عبدا لسيدين: لأنه إما أن يبغض أحدهما فيحب الآخر، وإما أن يلزم أحدهما فيهجر الآخر. لا يمكنكم أن تكونوا عبيدا لله والمال معا."]]}], "kwAr": "والذين يجثون", "noteAr": ""}, {"kw": "and that", "raw": "Deu_10:20; Isa_48:1; Jer_4:2; Hos_4:15", "note": "", "refs": [{"l": "Deu 10:20", "n": "", "vs": [[20, "اتقوا الرب إلهكم وإياه اعبدوا وبه اعتصموا وباسمه احلفوا،"]]}, {"l": "Isa 48:1", "n": "", "vs": [[1, "اسمعوا هذا يابيت يعقوب المدعوين باسم إسرائيل الخارجين من صلب يهوذا، الحالفين باسم الرب، المستشهدين بإله إسرائيل باطلا وكذبا"]]}, {"l": "Jer 4:2", "n": "", "vs": [[2, "وإن حلفت بالحق والعدل والبر قائلا: حي هو الرب، عندئذ تتبارك به الأمم، وتفتخر."]]}, {"l": "Hos 4:15", "n": "", "vs": [[15, "فإن كنت ياشعب إسرائيل زانيا، فلا تجعل يهوذا يأثم أو يذهب إلى الجلجال أو إلى بيت آون ولا يحلف قائلا: حي هو الرب."]]}], "kwAr": "عابدين", "noteAr": ""}, {"kw": "by the Lord", "raw": "or, to the Lord, Isa_44:5, Isa_45:23; Rom_14:11", "note": "or, to the Lord, Isa_44:5, Isa_45:23; Rom_14:11", "refs": [{"l": "Isa 44:5", "n": "", "vs": [[5, "ويقولون بملء أفواههم: «أنا عبد الرب. أنا ابن يعقوب». ويكتب على يده اسم الله، وباسم إسرائيل يلقب."]]}, {"l": "Isa 45:23", "n": "", "vs": [[23, "لقد أقسمت بذاتي، وخرجت من فمي، بكل صدق، كلمة لا تنقض: إنه ستجثو لي كل ركبة ويقسم بي كل لسان."]]}, {"l": "Rom 14:11", "n": "", "vs": [[11, "فإنه قد كتب: «أنا حي، يقول الرب، لي ستنحني كل ركبة، وسيعترف كل لسان لله!»"]]}], "kwAr": "الرب", "noteAr": "أو: «للرب». انظر إش 44: 5؛ 45: 23؛ رو 14: 11"}, {"kw": "swear by", "raw": "Jos_23:7", "note": "", "refs": [{"l": "Jos 23:7", "n": "", "vs": [[7, "لكي لا تختلطوا بهؤلاء الأمم الباقية معكم، ولا تذكروا اسم آلهتها ولا تقسموا بها ولا تعبدوها ولا تسجدوا لها."]]}], "kwAr": "حالفين", "noteAr": ""}, {"kw": "Malcham", "raw": "1Ki_11:33, Milcom, Amo_5:26, Moloch.", "note": "1Ki_11:33, Milcom, Amo_5:26, Moloch.", "refs": [{"l": "1Ki 11:33", "n": "", "vs": [[33, "لأنه تخلى عني وسجد لعشتاروث إلاهة الصيدونيين، ولكموش إله الموآبيين، ولملكوم إله بني عمون، ولم يسلك في سبلي، ويصنع ما هو مستقيم في عيني، ولم يطع فرائضي وأحكامي كداود أبيه."]]}, {"l": "Amo 5:26", "n": "", "vs": [[26, "بل إن الملك الذي حملتم خيمته ونصب تماثيله لم يكن سوى نجم صنعتموه لأنفسكم وعبدتموه كإله."]]}], "kwAr": "ملكوم", "noteAr": "انظر 1مل 11: 33؛ عا 5: 26 (ملكوم أو مولك)"}], "arS": [["والذين ", []], ["يصعدون", ["H5921"]], [" إلى ", []], ["السطوح", ["H1406"]], [" ", []], ["للسجود", ["H7812"]], [" ", []], ["لكواكب", ["H6635"]], [" ", []], ["السماء", ["H8064"]], ["، والذين ", []], ["يجثون", ["H7812"]], [" عابدين ", []], ["الرب", ["H3068"]], [" ", []], ["حالفين", ["H7650"]], [" باسمه، ", []], ["وباسم", ["H7650"]], [" ", []], ["ملكوم", ["H4445"]], [" أيضا.", []]]}, {"c": 1, "v": 6, "text": "والذين ارتدوا عن اتباع الرب، والذين كفوا عن طلبه والتماسه.", "groups": [{"kw": "turned", "raw": "1Sa_15:11; Psa_36:3, Psa_125:5; Isa_1:4; Jer_2:13, Jer_2:17, Jer_3:10, Jer_15:6; Eze_3:20; Hos_4:15, Hos_4:16, Hos_11:7; Heb_10:38, Heb_10:39; 2Pe_2:18-22", "note": "", "refs": [{"l": "1Sa 15:11", "n": "", "vs": [[11, "«لقد ندمت لأني جعلت شاول ملكا، فقد ارتد عن اتباعي ولم يطع أمري». فحزن صموئيل وصلى إلى الرب الليل كله."]]}, {"l": "Psa 36:3", "n": "", "vs": [[3, "كلام فمه إثم ونفاق، وقد كف عن التعقل لأجل عمل الخير."]]}, {"l": "Psa 125:5", "n": "", "vs": [[5, "أما الذين يحيدون إلى طرق ملتوية، فإن الرب يسوقهم إلى الهلاك مع فاعلي الإثم. ليكن السلام لشعب إسرائيل."]]}, {"l": "Isa 1:4", "n": "", "vs": [[4, "ويل للأمة الخاطئة، الشعب المثقل بالإثم، ذرية مرتكبي الشر، أبناء الفساد. لقد تركوا الرب واستهانوا بقدوس إسرائيل وداروا على أعقابهم."]]}, {"l": "Jer 2:13", "n": "", "vs": [[13, "قد ارتكب شعبي شرين: نبذوني أنا ينبوع الحياة، وحفروا لأنفسهم آبارا متصدعة لا تضبط ماء."]]}, {"l": "Jer 2:17", "n": "", "vs": [[17, "ألست أنت التي جلبت هذا الدمار على نفسك، لأنك تناسيت الرب إلهك حين قادك في الطريق؟"]]}, {"l": "Jer 3:10", "n": "", "vs": [[10, "ومع هذا كله لم ترجع إلي أختها الخائنة يهوذا من كل قلبها، إنما تظاهرت بذلك»، يقول الرب."]]}, {"l": "Jer 15:6", "n": "", "vs": [[6, "قد رفضتني» يقول الرب، «وواظبت على الارتداد، لذلك مددت يدي ضدك ودمرتك، إذ سئمت من كثرة الصفح عنك."]]}, {"l": "Eze 3:20", "n": "", "vs": [[20, "وكذلك إن حاد البار عن بره وارتكب الإثم، ونصبت أمامه معثرة، فإنه يموت. ولأنك لم تنذره فإنه يموت بذنبه ولا تذكر بعد أعماله الصالحة التي قام بها، أما دمه فمن يدك أطلبه."]]}, {"l": "Hos 4:15", "n": "", "vs": [[15, "فإن كنت ياشعب إسرائيل زانيا، فلا تجعل يهوذا يأثم أو يذهب إلى الجلجال أو إلى بيت آون ولا يحلف قائلا: حي هو الرب."]]}, {"l": "Hos 4:16", "n": "", "vs": [[16, "إن إسرائيل شعب عنيد كعجلة جامحة، فكيف يرعاهم الرب كحمل في مرج رحب؟"]]}, {"l": "Hos 11:7", "n": "", "vs": [[7, "قد وطد شعبي العزم على الارتداد عني، لهذا ولو استغاثوا بالعلي، فإنهم لا يجدون من يرفع النير عنهم."]]}, {"l": "Heb 10:38", "n": "", "vs": [[38, "وأما من تبرر بالإيمان، فبالإيمان يحيا. ومن ارتد لا تسر به نفسي!"]]}, {"l": "Heb 10:39", "n": "", "vs": [[39, "ولكننا نحن لسنا من أهل الارتداد المؤدي إلى الهلاك، بل من أهل الإيمان المؤدي إلى خلاص نفوسنا!"]]}, {"l": "2Pe 2:18-22", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."], [19, "يعدون هؤلاء بالحرية، وهم أنفسهم عبيد للفساد! لأن الإنسان يصير عبدا لكل ما يتسلط عليه ويغلبه."], [20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."], [21, "وبالحقيقة، كان أفضل لهم لو أنهم لم يتعرفوا بطريق البر، من أن يتعرفوا به ثم يرتدوا عن الوصية المقدسة التي تسلموها."], [22, "وينطبق على هؤلاء ما يقوله المثل الصادق: «عاد الكلب إلى تناول ما تقيأه، والخنزيرة المغتسلة إلى التمرغ في الوحل!»"]]}], "kwAr": "ارتدوا", "noteAr": ""}, {"kw": "and those", "raw": "Psa_10:4, Psa_14:2, Psa_14:3; Isa_43:22; Hos_7:7; Rom_3:11; Heb_2:3", "note": "", "refs": [{"l": "Psa 10:4", "n": "", "vs": [[4, "في تكبره وتشامخه لا يلتمس الله ، ولا مكان لله في أفكاره كلها،"]]}, {"l": "Psa 14:2", "n": "", "vs": [[2, "أشرف الرب على بني آدم ليرى هل هناك أي فاهم يطلب الله ؟"]]}, {"l": "Psa 14:3", "n": "", "vs": [[3, "فإذا الجميع قد ضلوا على السواء. كلهم فسدوا، وليس بينهم من يعمل الصلاح، ولا واحد."]]}, {"l": "Isa 43:22", "n": "", "vs": [[22, "ولكنك لم تلتمسني يايعقوب، بل سئمت مني ياإسرائيل."]]}, {"l": "Hos 7:7", "n": "", "vs": [[7, "كلهم متأججون كأتون مشتعل. يفترسون حكامهم. هلك جميع ملوكهم، ولم يوجد بينهم من يطلبني."]]}, {"l": "Rom 3:11", "n": "", "vs": [[11, "ليس من يبحث عن الله."]]}, {"l": "Heb 2:3", "n": "", "vs": [[3, "فكيف نفلت نحن إن أهملنا هذا الخلاص العظيم جدا؟ فإن الرب يسوع نفسه قد أعلنه أولا، ثم تثبت لنا من الذين سمعوه مباشرة."]]}], "kwAr": "والذين كفوا", "noteAr": ""}], "arS": [["والذين ", []], ["ارتدوا", ["H5472"]], [" ", []], ["عن", ["H4480", "H310"]], [" اتباع ", []], ["الرب", ["H3068"]], ["، ", []], ["والذين", ["H834"]], [" ", []], ["كفوا", ["H3808"]], [" عن ", []], ["طلبه", ["H1245"]], [" ", []], ["والتماسه", ["H1875"]], [".", []]]}, {"c": 1, "v": 7, "text": "اصمتوا في محضر السيد الرب لأن يوم الرب بات وشيكا. قد أعد الرب ذبيحة وقدس مدعويه.", "groups": [{"kw": "thy", "raw": "1Sa_2:9, 1Sa_2:10; Job_40:4, Job_40:5; Psa_46:10, Psa_76:8, Psa_76:9; Isa_6:5; Amo_6:10; Hab_2:20; Zec_2:13; Rom_3:19, Rom_9:20", "note": "", "refs": [{"l": "1Sa 2:9", "n": "", "vs": [[9, "هو يحفظ أقدام أتقيائه، أما الأشرار فينطوون في الظلام، لأنه ليس بالقوة يتغلب الإنسان."]]}, {"l": "1Sa 2:10", "n": "", "vs": [[10, "مخاصمو الرب يتحطمون، ومن السماء يقذف رعوده عليهم؛ يدين الرب أقاصي الأرض، ويمنح عزة لمن يختاره ملكا ويمجد مسيحه»."]]}, {"l": "Job 40:4", "n": "", "vs": [[4, "«انظر، أنا حقير فبماذا أجيبك؟ ها أنا أضع يدي على فمي"]]}, {"l": "Job 40:5", "n": "", "vs": [[5, "لقد تكلمت مرة ولن أجيب، ومرتين ولن أضيف»."]]}, {"l": "Psa 46:10", "n": "", "vs": [[10, "استكينوا واعلموا أني أنا الله ، أتعالى بين الأمم وأتعالى في الأرض."]]}, {"l": "Psa 76:8", "n": "", "vs": [[8, "من السماء أصدرت حكما فلما سمعته الأرض فزعت وصمتت."]]}, {"l": "Psa 76:9", "n": "", "vs": [[9, "كان ذلك عندما قمت للقضاء لتخلص ودعاء الأرض كلهم."]]}, {"l": "Isa 6:5", "n": "", "vs": [[5, "فقلت: «ويل لي لأني هلكت لأني إنسان نجس الشفتين، وأسكن وسط قوم دنسي الشفاه. فإن عيني قد أبصرتا الملك الرب القدير»."]]}, {"l": "Amo 6:10", "n": "", "vs": [[10, "وعندما يقبل عم الميت المشرف على إحراق الجثث ليخرج عظامه من البيت، ويسأل من هو مختبيء في أقصى المنزل: أما بقي واحد معك؟ فيجيب: لا، ثم يضيف: اصمت ولا تذكر اسم الرب."]]}, {"l": "Hab 2:20", "n": "", "vs": [[20, "أما الرب ففي هيكله المقدس، فلتصمت الأرض كلها في محضره»."]]}, {"l": "Zec 2:13", "n": "", "vs": [[13, "ليصمت كل بشر في حضرة الرب لأنه قد هب من مسكن قدسه."]]}, {"l": "Rom 3:19", "n": "", "vs": [[19, "ونحن نعلم أن كل ما تقوله الشريعة إنما تخاطب به الذين هم تحت الشريعة، لكي يسد كل فم ويقع العالم كله تحت دينونة من الله."]]}, {"l": "Rom 9:20", "n": "", "vs": [[20, "فأقول: من أنت أيها الإنسان حتى ترد جوابا على الله؟ أيقول الشيء المصنوع لصانعه: لماذا صنعتني هكذا؟"]]}], "kwAr": "اصمتوا", "noteAr": ""}, {"kw": "for the day", "raw": "Zep_1:14; Isa_2:12, Isa_13:6; Eze_7:7, Eze_7:10; Joe_2:1, Joe_2:2, Joe_2:11, Joe_2:31; Amo_5:18-20; Mal_4:1; Phi_4:5; 2Pe_3:10-12", "note": "", "refs": [{"l": "Zep 1:14", "n": "", "vs": [[14, "إن يوم الرب العظيم قريب، وشيك وسريع جدا. دوي يوم الرب مخيف، فيه يصرخ الجبار مرتعبا."]]}, {"l": "Isa 2:12", "n": "", "vs": [[12, "فإن للرب القدير يوما فيه يوضع كل متعظم ومتكبر ومتغطرس."]]}, {"l": "Isa 13:6", "n": "", "vs": [[6, "ولولوا، فإن يوم الرب بات وشيكا قادما من عند الرب محملا بالدمار."]]}, {"l": "Eze 7:7", "n": "", "vs": [[7, "قد حل بك القضاء ياساكن الأرض، وأزف الموعد، اقترب يوم الاضطراب لا يوم الهتاف في الجبال."]]}, {"l": "Eze 7:10", "n": "", "vs": [[10, "ها هو اليوم قد أقبل! قد أزف القضاء وأزهر الظلم وأفرخت الكبرياء"]]}, {"l": "Joe 2:1", "n": "", "vs": [[1, "انفخوا بالبوق في صهيون، وأطلقوا نفير الإنذار في جبل قدسي، وليرتعد جميع سكان الأرض، لأن يوم الرب مقبل وقد بات وشيكا."]]}, {"l": "Joe 2:2", "n": "", "vs": [[2, "هو يوم ظلمة وتجهم، يوم غيوم مكفهرة وقتام دامس،فيه تزحف أمة قوية وعظيمة كما يزحف الظلام على الجبال، أمة لم يكن لها شبيه في سالف الزمان، ولن يكون لها نظير من بعدها عبر سني الأجيال."]]}, {"l": "Joe 2:11", "n": "", "vs": [[11, "يجهر الرب بصوته في مقدمة جيشه لأن جنده لا يحصى لهم عدد، ومن ينفذ أمره يكون مقتدرا، لأن يوم الرب عظيم ومخيف جدا، فمن يتحمله؟"]]}, {"l": "Joe 2:31", "n": "", "vs": [[31, "وتتحول الشمس إلى ظلام، والقمر إلى دم، قبل مجيء يوم الرب العظيم المخيف."]]}, {"l": "Amo 5:18-20", "n": "", "vs": [[18, "ويل للذين يتشوقون ليوم الرب. لماذا تطلبون مجيء يوم الرب؟ فيوم الرب هو ظلمة لا نور."], [19, "فتكونون كرجل هرب من وجه أسد فلقيه دب، أو كمن دخل إلى بيت واتكأ بيده على حائط فلدغته أفعى."], [20, "أو ليس يوم الرب ظلمة لا نورا، وقتاما خاليا من الضياء؟"]]}, {"l": "Mal 4:1", "n": "", "vs": [[1, "«انظروا، ها يوم القضاء مقبل، لاهب كتنور يكون فيه جميع المستكبرين وفاعلي الإثم عصافة، فيحرقهم ذلك اليوم ولا يبقي لهم أصلا ولا فرعا، يقول الرب القدير."]]}, {"l": "Phi 4:5", "n": "", "vs": [[5, "ليكن طول بالكم معروفا لدى الناس جميعا. إن الرب قريب."]]}, {"l": "2Pe 3:10-12", "n": "", "vs": [[10, "إلا أن «يوم الرب» سيأتي كما يأتي اللص في الليل. في ذلك اليوم، تزول السماوات محدثة دويا هائلا وتنحل العناصر محترقة بنار شديدة، وتحترق الأرض وما فيها من منجزات."], [11, "ومادامت هذه الأشياء جميعا ستنحل، فكيف يجب أن تكونوا أنتم أصحاب سلوك مقدس يتصف بالتقوى،"], [12, "منتظرين «يوم الله» الأبدي وطالبين حلوله بسرعة. ففي ذلك اليوم، تنحل السماوات ملتهبة، وتذوب العناصر محترقة."]]}], "kwAr": "لأن يوم الرب", "noteAr": ""}, {"kw": "for the Lord", "raw": "Isa_34:6; Jer_46:10; Eze_39:17-20; Rev_19:17, Rev_19:18", "note": "", "refs": [{"l": "Isa 34:6", "n": "", "vs": [[6, "للرب سيف مشبع بالدم، مطلي بالشحم، بدم حملان وتيوس، وبشحم كلى كباش، لأن للرب ذبيحة في بصرة، ومذبحة في أدوم."]]}, {"l": "Jer 46:10", "n": "", "vs": [[10, "فهذا اليوم هو يوم قضاء السيد الرب القدير، يوم الانتقام. فيه يثأر لنفسه من أعدائه، فيلتهم السيف ويشبع، ويرتوي من دمائهم، لأن للسيد الرب القدير ذبيحة في أرض الشمال إلى جوار نهر الفرات."]]}, {"l": "Eze 39:17-20", "n": "", "vs": [[17, "أما أنت ياابن آدم، فهذا ما يعلنه السيد الرب: قل لكل أصناف الطيور ولجميع وحوش البرية اجتمعي وتعالي، احتشدي من كل جهة حول ذبيحتي التي أعدها لك، ذبيحة عظيمة أقيمها على جبال إسرائيل فتأكلين لحما وتشربين دما."], [18, "تأكلين لحم الجبابرة وترتوين من دماء رؤساء الأرض وكأنها كباش وحملان وتيوس وعجول كلها من قطعان باشان السمينة."], [19, "فتأكلين شحما حتى الشبع، وتشربين دما حتى السكر من ذبيحتي التي أعددتها لك."], [20, "فتشبعين على مائدتي من الخيل وفرسانها، من الجبابرة وكل المحاربين، يقول السيد الرب."]]}, {"l": "Rev 19:17", "n": "", "vs": [[17, "ثم رأيت ملاكا واقفا في الشمس، ينادي الطيور الطائرة في وسط السماء بصوت عال قائلا: «هلمي اجتمعي معا إلى وليمة الله الكبرى!"]]}, {"l": "Rev 19:18", "n": "", "vs": [[18, "تعالي والتهمي لحوم الملوك والقادة والأبطال، والخيول وفرسانها، ولحوم البشر جميعا من أحرار وعبيد، وصغار وكبار»."]]}], "kwAr": "قد أعد الرب", "noteAr": ""}, {"kw": "he hath", "raw": "Pro_9:1-6; Mat_22:4; Luk_14:16, Luk_14:17", "note": "", "refs": [{"l": "Pro 9:1-6", "n": "", "vs": [[1, "الحكمة شيدت بيتها، ونحتت أعمدتها السبعة"], [2, "ذبحت ذبائحها، ومزجت خمرها، وأعدت مأدبتها."], [3, "أرسلت جواريها لينادين من أعلى مشارف المدينة قائلات:"], [4, "«كل من هو ساذج فليمل إلى هنا». وتدعو كل غبي قائلة:"], [5, "«تعالوا كلوا من خبزي واشربوا من الخمر التي مزجت."], [6, "انبذوا الجهالة فتحيوا، واسلكوا سبيل الفهم»."]]}, {"l": "Mat 22:4", "n": "", "vs": [[4, "فأرسل الملك ثانية عبيدا آخرين قائلا لهم: قولوا للمدعوين: ها أنا قد أعددت وليمتي؛ ثيراني وعجولي المسمنة قد ذبحت وكل شيء جاهز، فتعالوا إلى العرس!"]]}, {"l": "Luk 14:16", "n": "", "vs": [[16, "فقال له: «أقام إنسان عشاء عظيما، ودعا كثيرين."]]}, {"l": "Luk 14:17", "n": "", "vs": [[17, "ثم أرسل عبده ساعة العشاء ليقول للمدعوين: تعالوا، فكل شيء جاهز!"]]}], "kwAr": "وقدس", "noteAr": ""}, {"kw": "bid", "raw": "Heb. sanctified, or prepared, 1Sa_16:5, 1Sa_20:26; Col_1:12", "note": "Heb. sanctified, or prepared, 1Sa_16:5, 1Sa_20:26; Col_1:12", "refs": [{"l": "1Sa 16:5", "n": "", "vs": [[5, "فأجاب: «نعم، للسلام. لقد حضرت لأقرب للرب. طهروا أنفسكم وتعالوا معي إلى الذبيحة». وقدس يسى أبناءه ودعاهم للذبيحة."]]}, {"l": "1Sa 20:26", "n": "", "vs": [[26, "ولم يعلق شاول في ذلك اليوم على غياب داود، ظنا منه أن عارضا قد ألم به وأنه غير طاهر طبقا للشريعة."]]}, {"l": "Col 1:12", "n": "", "vs": [[12, "رافعين الشكر بفرح للآب الذي جعلكم أهلا للاشتراك في ميراث القديسين في (ملكوت) النور،"]]}], "kwAr": "مدعويه", "noteAr": "بالعبرية: «قدس»، أو: «أعد». انظر 1صم 16: 5؛ 20: 26؛ كو 1: 12"}], "arS": [["اصمتوا", ["H2013"]], [" في ", []], ["محضر", ["H4480", "H6440"]], [" ", []], ["السيد", ["H136"]], [" ", []], ["الرب", ["H3069"]], [" ", []], ["لأن", ["H3588"]], [" ", []], ["يوم", ["H3117"]], [" ", []], ["الرب", ["H3068"]], [" بات ", []], ["وشيكا", ["H7138"]], [". قد ", []], ["أعد", ["H3559"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["ذبيحة", ["H2077"]], [" ", []], ["وقدس", ["H6942"]], [" ", []], ["مدعويه", ["H7121"]], [".", []]]}, {"c": 1, "v": 8, "text": "فيكون في يوم ذبيحة الرب أني أعاقب الرؤساء وأبناء الملك وكل من يرتدي ثيابا غريبة وثنية.", "groups": [{"kw": "punish", "raw": "Heb. visit upon, Isa_10:12, Isa_24:21 *marg.", "note": "Heb. visit upon, Isa_10:12, Isa_24:21 *marg.", "refs": [{"l": "Isa 10:12", "n": "", "vs": [[12, "ولكن حالما ينتهي الرب من عمله بجبل صهيون، فإنه سيعاقب ملك أشور على غرور قلبه وتشامخ عينيه،"]]}, {"l": "Isa 24:21", "n": "*marg.", "vs": [[21, "في ذلك اليوم يعاقب الرب الملائكة الساقطين في السماوات، والملوك المتغطرسين على الأرض،"]]}], "kwAr": "أعاقب", "noteAr": "بالعبرية: «أفتقد على». انظر إش 10: 12؛ 24: 21"}, {"kw": "the princes", "raw": "2Ki_23:30-34, 2Ki_24:12, 2Ki_24:13, 2Ki_25:6, 2Ki_25:7, 2Ki_25:19-21; Isa_39:7; Jer_22:11-19, Jer_22:24-30; Jer_39:6, Jer_39:7", "note": "", "refs": [{"l": "2Ki 23:30-34", "n": "", "vs": [[30, "فحمله رجاله في مركبة وعادوا به من مجدو لأورشليم، حيث دفنوه في قبره. فولى الشعب يهوآحاز بن يوشيا ملكا عليهم خلفا لأبيه."], [31, "وكان يهوآحاز في الثالثة والعشرين من عمره حين ملك، ودام حكمه ثلاثة أشهر في أورشليم، واسم أمه حموطل بنت إرميا من لبنة."], [32, "وارتكب الشر في عيني الرب على غرار ما فعل آباؤه."], [33, "واعتقل فرعون نخو يهوآحاز وقيده في ربلة في أرض حماة لئلا يملك في أورشليم، وفرض جزية على البلاد: مئة وزنة من الفضة (نحو ثلاث مئة وستين كيلو جراما)، ووزنة من الذهب (نحو ثلاثة كيلوجرامات)."], [34, "ونصب فرعون نخو ألياقيم بن يوشيا خلفا ليوشيا أبيه، وغير اسمه إلى يهوياقيم. ثم ساق يهوآحاز أسيرا إلى مصر حيث مات."]]}, {"l": "2Ki 24:12", "n": "", "vs": [[12, "فاستسلم يهوياكين ملك يهوذا وأمه ورجاله وقادته وخصيانه إلى ملك بابل، فقبض عليه نبوخذناصر. وكان ذلك في السنة الثامنة لملكه."]]}, {"l": "2Ki 24:13", "n": "", "vs": [[13, "واستولى على جميع ما في خزائن الهيكل وخزائن القصر، وحطم كل آنية الذهب التي صنعها سليمان ملك إسرائيل لهيكل الرب، تماما كما قضى الرب."]]}, {"l": "2Ki 25:6", "n": "", "vs": [[6, "فأسروا الملك واقتادوه إلى ملك بابل المقيم في ربلة، وحرضوه على القضاء عليه."]]}, {"l": "2Ki 25:7", "n": "", "vs": [[7, "ثم قتلوا أبناء صدقيا على مرأى منه، وقلعوا عينيه، وقيدوه بسلسلتين من نحاس، وساقوه إلى بابل."]]}, {"l": "2Ki 25:19-21", "n": "", "vs": [[19, "وقبض على خصي واحد من أهل المدينة، كان قائدا للجيش، وعلى خمسة رجال من ندماء الملك الذين تم العثور عليهم في المدينة، وكاتب قائد الجيش المسئول عن التجنيد، وستين رجلا من الفلاحين أهل المدينة."], [20, "واقتادهم نبوزرادان رئيس الحرس إلى ملك بابل المعسكر في ربلة،"], [21, "فقتلهم ملك بابل في ربلة في أرض حماة. وهكذا سبي شعب يهوذا من أرضه."]]}, {"l": "Isa 39:7", "n": "", "vs": [[7, "ويسبى بعض أبنائك الخارجين من صلبك ليكونوا خصيانا في قصر ملك بابل»."]]}, {"l": "Jer 22:11-19", "n": "", "vs": [[11, "لأنه هذا ما يعلنه الرب عن شلوم بن يوشيا ملك يهوذا، الذي تولى العرش عوض أبيه، والذي خرج منفيا من هذا المكان: «إنه لن يرجع إلى هنا بعد."], [12, "بل يموت في منفاه الذي سبوه إليه ولن يرجع ليرى هذه الأرض ثانية»."], [13, "«ويل لمن يبني بيته على الظلم ومخادعه العالية على الجور، الذي يستخدم جاره مجانا ولا يوفيه أجرة عمله،"], [14, "الذي يقول: «سأبني لنفسي بيتا رحبا وغرفا عالية فسيحة. وأفتح له كوى وأغشيه بألواح الأرز وأدهنه بألوان حمراء."], [15, "أتظن أنك صرت ملكا لأنك بنيت بيتك من الأرز؟ أما أكل أبوك وشرب وأجرى عدلا وحقا، فتمتع بالخيرات؟"], [16, "قد قضى بالعدل للبائس والمسكين فأحرز خيرا. أليست هذه هي معرفتي؟» يقول الرب"], [17, "«أما أنت فعيناك وقلبك متهافتة على الربح الحرام، وعلى سفك الدم البريء، وعلى الظلم والابتزاز»."], [18, "لذلك هذا ما يقوله الرب عن يهوياقيم بن يوشيا، ملك يهوذا: «لن يندبك أحد قائلا: آه ياأخي أو آه ياأختي، أو يندبون عليه قائلين: آواه ياسيدي، أو آه على جلاله."], [19, "بل يدفن دفن حمار، مجرورا ومطروحا خارج بوابات أورشليم»."]]}, {"l": "Jer 22:24-30", "n": "", "vs": [[24, "«حي أنا» يقول الرب، «لو كان كنياهو بن يهوياقيم ملك يهوذا خاتما في يدي اليمنى لنزعته منها."], [25, "وأسلمته لطالبي نفسه، إلى أيدي من يفزع منهم، وإلى قبضة نبوخذناصر ملك بابل، وإلى أيدي الكلدانيين."], [26, "سأطوح به وبأمه التي حملته إلى أرض أخرى، لم يولدا فيها، وهناك يموتان."], [27, "ولن يعودا قط إلى الأرض التي يتوقان إلى الرجوع إليها»."], [28, "هذا الرجل كنياهو وعاء منبوذ محطم، وإناء لا يحفل به أحد. لماذا طوح به وبأبنائه إلى أرض لا يعرفونها؟"], [29, "ياأرض! ياأرض! ياأرض! اسمعي كلمة الرب:"], [30, "«سجلوا أن هذا الإنسان عقيم، رجل لن يفلح في حياته، ولن ينجح أحد من ذريته في الجلوس على عرش داود وتولي ملك يهوذا»."]]}, {"l": "Jer 39:6", "n": "", "vs": [[6, "وقتل ملك بابل أبناء صدقيا في ربلة على مرأى منه كما قتل سائر أشراف يهوذا."]]}, {"l": "Jer 39:7", "n": "", "vs": [[7, "وفقأ عيني صدقيا وقيده بسلاسل من نحاس ليأخذه أسيرا إلى بابل."]]}], "kwAr": "الرؤساء", "noteAr": ""}, {"kw": "strange", "raw": "Deu_22:5; 2Ki_10:22; Isa_3:18-24", "note": "", "refs": [{"l": "Deu 22:5", "n": "", "vs": [[5, "يحظر على المرأة ارتداء ثياب الرجال، كما يحظر على الرجل ارتداء ثياب النساء، لأن كل من يفعل ذلك يصبح مكروها لدى الرب إلهكم."]]}, {"l": "2Ki 10:22", "n": "", "vs": [[22, "فقال للمشرف على الملابس: «وزع ملابس على كل عبدة البعل». فأخرجها ووزعها عليهم."]]}, {"l": "Isa 3:18-24", "n": "", "vs": [[18, "في ذلك اليوم ينزع الرب زينة الخلاخيل، وعصابات رؤوسهن والأهلة،"], [19, "والأقراط والأساور والبراقع،"], [20, "والعصائب والسلاسل والأحزمة، وآنية الطيب والتعاويذ"], [21, "والخواتم وخزائم الأنف،"], [22, "والثيا ب المزخرفة والعباءات والمعاطف والأكياس"], [23, "والمرايا والأردية الكتانية، والعصائب المزينة وأغطية الرؤوس"], [24, "فتحل العفونة محل الطيب، والحبل عوض الحزام، والصلع بدل الشعر المنسق، وحزام المسح في موضع الثوب الفاخر، والعار عوض الجمال،"]]}], "kwAr": "ثيابا غريبة", "noteAr": ""}], "arS": [["فيكون", ["H1961"]], [" في ", []], ["يوم", ["H3117"]], [" ", []], ["ذبيحة", ["H2077"]], [" ", []], ["الرب", ["H3068"]], [" أني ", []], ["أعاقب", ["H6485", "H5921"]], [" ", []], ["الرؤساء", ["H8269"]], [" ", []], ["وأبناء", ["H1121"]], [" ", []], ["الملك", ["H4428"]], [" ", []], ["وكل", ["H3605"]], [" من ", []], ["يرتدي", ["H3847"]], [" ", []], ["ثيابا", ["H4403"]], [" ", []], ["غريبة", ["H5237"]], [" وثنية.", []]]}, {"c": 1, "v": 9, "text": "وأعاقب في ذلك اليوم كل الذين يقفزون من فوق عتبة الهيكل (على غرار كهنة داجون)، الذين يملأون بيت سيدهم جورا ونهبا.", "groups": [{"kw": "those", "raw": "Or, that leap over the threshold, by which is probably meant the Philistines, who, after the time that Dagon fell before the ark and was broken on the threshold, leaped over it when entering his temple.", "note": "Or, that leap over the threshold, by which is probably meant the Philistines, who, after the time that Dagon fell before the ark and was broken on the threshold, leaped over it when entering his temple.", "refs": [], "kwAr": "كل الذين", "noteAr": "أو: «القافزين فوق العتبة»، ويُقصد بهم على الأرجح الفلسطينيون الذين كانوا، منذ سقط داجون أمام التابوت وانكسر على العتبة، يقفزون فوقها عند دخول هيكله."}, {"kw": "leap", "raw": "1Sa_5:5", "note": "", "refs": [{"l": "1Sa 5:5", "n": "", "vs": [[5, "لذلك لا يطأ كهنة داجون وسائر الداخلين إلى معبد داجون على عتبة المعبد في أشدود إلَى هذا اليوم."]]}], "kwAr": "يقفزون", "noteAr": ""}, {"kw": "which", "raw": "1Sa_2:15, 1Sa_2:16; 2Ki_5:20-27; Neh_5:15; Pro_29:12; Act_16:19", "note": "", "refs": [{"l": "1Sa 2:15", "n": "", "vs": [[15, "كذلك كان خادم الكاهن يأتي إلى ذابح القربان ويقول له قبل إحراق الشحم: «أعط لحما للكاهن حتى يشوى، فإنه لا يقبل منك لحما مطبوخا بل نيئا»."]]}, {"l": "1Sa 2:16", "n": "", "vs": [[16, "فيجيبه الرجل: «ليحرقوا أولا شحم الذبيحة، ثم خذ ما تشتهيه نفسك». فيقول الخادم: «لا، بل أعطني الآن اللحم وإلا آخذه بالرغم عنك»."]]}, {"l": "2Ki 5:20-27", "n": "", "vs": [[20, "حتى حدث جيحزي خادم أليشع نفسه: «سيدي امتنع عن قبول ما أحضره نعمان من هدايا. حي هو الرب لأسرعن وراءه وآخذ منه شيئا»."], [21, "فلحق جيحزي بنعمان. ولما أبصره نعمان راكضا نحوه، ترجل عن المركبة للقائه سائلا: «أللخير جئت؟»"], [22, "فأجاب: «للخير. إن سيدي قد أرسلني قائلا: إن رجلين من جبل أفرايم من بني الأنبياء جاءاه، فأرجوك أن تعطيهما وزنة من الفضة وحلتي ثياب»."], [23, "فقال نعمان: «أرجوك أن تأخذ وزنتين» وألح عليه، وصرهما في كيسين وحلتي ثياب، وأعطاهما لرجلين من رجاله، فحملاهما وانطلقا أمام جيحزي."], [24, "وعندما وصل إلى الأكمة حيث يقيم أليشع أخذها منهما وأخفاها في البيت، وصرف الرجلين."], [25, "ثم دخل إلى أليشع، فسأله: «من أين جئت ياجيحزي؟» فأجاب: «لم يذهب عبدك إلى أي مكان»."], [26, "فقال له: «ألا تعرف أن قلبي كان حاضرا هناك حين ترجل الرجل من مركبته للقائك؟ أهذا وقت الحصول على فضة أو أخذ ثياب وزيتون وكروم وغنم وبقر وعبيد وجوار؟"], [27, "فليحل برص نعمان بك وبنسلك إلى الأبد». فخرج من أمامه وجلده أبرص في لون الثلج."]]}, {"l": "Neh 5:15", "n": "", "vs": [[15, "على نقيض الولاة السابقين الذين ثقلوا الضرائب على الشعب، وابتزوا منهم خبزا وخمرا، فضلا عن أربعين شاقلا (نحو أربع مئة وثمانين جراما من الفضة). كما تسلط رجالهم على الشعب. أما أنا فلم أفعل هكذا من خوف الله،"]]}, {"l": "Pro 29:12", "n": "", "vs": [[12, "إن أصغى الحاكم إلى الأكاذيب، يكون جميع رجال حاشيته أشرارا لأنهم يتملقونه."]]}, {"l": "Act 16:19", "n": "", "vs": [[19, "ولما رأى سادتها أن مورد رزقهم قد انقطع، قبضوا على بولس وسيلا، وجروهما إلى ساحة المدينة للمحاكمة،"]]}], "kwAr": "الذين يملأون", "noteAr": ""}], "arS": [["وأعاقب", ["H6485", "H5921"]], [" في ", []], ["ذلك", ["H1931"]], [" ", []], ["اليوم", ["H3117"]], [" ", []], ["كل", ["H3605"]], [" الذين ", []], ["يقفزون", ["H1801"]], [" من ", []], ["فوق", ["H5921"]], [" ", []], ["عتبة", ["H4670"]], [" الهيكل (على غرار كهنة داجون)، الذين ", []], ["يملأون", ["H4390"]], [" ", []], ["بيت", ["H1004"]], [" ", []], ["سيدهم", ["H113"]], [" ", []], ["جورا", ["H2555"]], [" ", []], ["ونهبا", ["H4820"]], [".", []]]}, {"c": 1, "v": 10, "text": "ويقول الرب: في ذلك اليوم تتردد صرخة من باب السمك وولولة من الحي الثاني، ويدوي صوت تحطيم في التلال.", "groups": [{"kw": "in", "raw": "Zep_1:7, Zep_1:15; Jer_39:2", "note": "", "refs": [{"l": "Zep 1:7", "n": "", "vs": [[7, "اصمتوا في محضر السيد الرب لأن يوم الرب بات وشيكا. قد أعد الرب ذبيحة وقدس مدعويه."]]}, {"l": "Zep 1:15", "n": "", "vs": [[15, "يوم غضب هو ذلك اليوم، يوم ضيق وعذاب، يوم خراب ودمار، يوم ظلمة واكتئاب، يوم غيوم وقتام."]]}, {"l": "Jer 39:2", "n": "", "vs": [[2, "وفي اليوم التاسع من الشهر الرابع من السنة الحادية عشرة من حكم صدقيا فتحت ثغرة في سور المدينة."]]}], "kwAr": "في ذلك اليوم", "noteAr": ""}, {"kw": "the noise", "raw": "Isa_22:4, Isa_22:5, Isa_59:11; Jer_4:19-21, Jer_4:31; Amo_8:3", "note": "", "refs": [{"l": "Isa 22:4", "n": "", "vs": [[4, "لذلك أقول: «ابتعدوا عني لأبكي بمرارة، لا تتكبدوا جهدا في تعزيتي من أجل دمار ابنة شعبي،"]]}, {"l": "Isa 22:5", "n": "", "vs": [[5, "لأن للسيد الرب القدير في أورشليم يوما يبث فيه الرعب، والذلة، والفوضى. فيه ينقب أهلها الأسوار ويستجيرون بالجبال."]]}, {"l": "Isa 59:11", "n": "", "vs": [[11, "كلنا نزمجر كالدببة، وننوح كالحمام. نبحث عن العدل فلا نجده، وعن الخلاص وإذا به قد ابتعد عنا،"]]}, {"l": "Jer 4:19-21", "n": "", "vs": [[19, "لشد ما أتعذب! لشد ما أتعذب! قلبي يتلوى ألما. فؤادي يئن في داخلي فلا أستطيع الصمت، لأني سمعت دوي البوق وصيحات القتال."], [20, "كارثة في أعقاب كارثة، والأرض قاطبة قد استحالت خرابا، فتهدمت في لحظة خيامي، وبيوتي تدمرت بغتة."], [21, "إلى متى أظل أرى راية المعركة، وأسمع دوي البوق؟"]]}, {"l": "Jer 4:31", "n": "", "vs": [[31, "لأني سمعت صرخة كصرخة امرأة في مخاض، وأنة عذاب كعذاب من تقاسي في ولادة بكرها. إنها صرخة ابنة صهيون التي تزفر لاهثة وتبسط يديها قائلة: «ويل لي! قد غشي علي أمام القتلة»."]]}, {"l": "Amo 8:3", "n": "", "vs": [[3, "فتتحول أغاني قصورهم إلى عويل في ذلك اليوم، وتكثر الجثث ويطرحونها في كل مكان بصمت»."]]}], "kwAr": "تتردد صرخة", "noteAr": ""}, {"kw": "the fish gate", "raw": "2Ch_33:14; Neh_3:3", "note": "", "refs": [{"l": "2Ch 33:14", "n": "", "vs": [[14, "وما لبث أن أعاد بناء سور خارج مدينة داود، غربي نهر جيحون في الوادي، حتى مدخل باب السمك، وأحاط قلعة الأكمة بسور مرتفع جدا، وأقام قادة جيوشه في جميع مدن يهوذا الحصينة."]]}, {"l": "Neh 3:3", "n": "", "vs": [[3, "وبنى بنو هسناءة باب السمك، وسقفوه ونصبوا مصاريعه وأقفاله وعوارضه."]]}], "kwAr": "باب السمك", "noteAr": ""}, {"kw": "the second", "raw": "2Ki_22:14; 2Ch_32:22", "note": "", "refs": [{"l": "2Ki 22:14", "n": "", "vs": [[14, "فانطلق حلقيا الكاهن، وأخيقام، وعكبور، وشافان، وعسايا، واستشاروا النبية خلدة زوجة شلوم بن تقوة بن حرحس حارس الثياب الملكية، المقيمة في المنطقة الثانية من أورشليم."]]}, {"l": "2Ch 32:22", "n": "", "vs": [[22, "وهكذا أنقذ الرب حزقيا وسكان أورشليم من سنحاريب ملك أشور ومن أيدي سواه من الأعداء، ووقاهم من كل ناحية."]]}], "kwAr": "الحي الثاني", "noteAr": ""}, {"kw": "from", "raw": "2Sa_5:7, 2Sa_5:9; 2Ch_3:1", "note": "", "refs": [{"l": "2Sa 5:7", "n": "", "vs": [[7, "غير أن داود استولى على حصن صهيون المعروف الآن بمدينة داود."]]}, {"l": "2Sa 5:9", "n": "", "vs": [[9, "وأقام داود في الحصن ودعاه مدينة داود."]]}, {"l": "2Ch 3:1", "n": "", "vs": [[1, "وأخذ سليمان في بناء هيكل الرب في بيدر أرنان اليبوسي في أورشليم على جبل المريا، حيث تراءى الرب لداود أبيه، وحيث وقع اختيار داود على مكان الهيكل."]]}], "kwAr": "في التلال", "noteAr": ""}], "arS": [["ويقول", ["H5002"]], [" ", []], ["الرب", ["H3068"]], [": في ", []], ["ذلك", ["H1931"]], [" ", []], ["اليوم", ["H3117"]], [" ", []], ["تتردد", ["H1961"]], [" ", []], ["صرخة", ["H6963", "H6818"]], [" ", []], ["من", ["H4480"]], [" ", []], ["باب", ["H8179"]], [" ", []], ["السمك", ["H1709"]], [" ", []], ["وولولة", ["H3215"]], [" ", []], ["من", ["H4480"]], [" الحي ", []], ["الثاني", ["H4932"]], ["، ويدوي ", []], ["صوت", ["H1419"]], [" ", []], ["تحطيم", [ Jer 25:36", "n": "", "vs": [[36, "اسمعوا صوت الرعاة وولولة قادة الشعب، لأن الرب يتلف مراعيهم."]]}, {"l": "Joe 2:11", "n": "", "vs": [[11, "يجهر الرب بصوته في مقدمة جيشه لأن جنده لا يحصى لهم عدد، ومن ينفذ أمره يكون مقتدرا، لأن يوم الرب عظيم ومخيف جدا، فمن يتحمله؟"]]}, {"l": "Joe 3:16", "n": "", "vs": [[16, "يزأر الرب في صهيون، ويجلجل بصوته من أورشليم فترجف السماوات والأرض؛ لكن الرب يكون ملجأ لشعبه، وحصنا لبني إسرائيل."]]}, {"l": "1Th 4:16", "n": "", "vs": [[16, "لأن الرب نفسه سينزل من السماء حالما يدوي أمر بالتجمع، وينادي رئيس ملائكة، ويبوق في بوق إلهي، عندئذ يقوم الأموات في المسيح أولا."]]}, {"l": "Heb 12:26", "n": "", "vs": [[26, "وإذ تكلم الله قديما، زلزل صوته الأرض، أما الآن، فيعد قائلا: «إني مرة أخرى، سوف أزلزل لا الأرض وحدها، بل السماء أيضا!»"]]}], "kwAr": "دوي", "noteAr": ""}, {"kw": "the mighty", "raw": "Isa_15:4, Isa_33:7; Jer_48:41; Rev_6:15-17", "note": "", "refs": [{"l": "Isa 15:4", "n": "", "vs": [[4, "تتعالى صرخات حشبون وألعالة حتى تتردد أصداؤها في ياهص، لذلك يندب جيش موآب بصوت مرتفع، وقلوبهم ترتعد في صدورهم."]]}, {"l": "Isa 33:7", "n": "", "vs": [[7, "ها رسلكم ينوحون خارجا، وممثلو السلام يبكون بمرارة."]]}, {"l": "Jer 48:41", "n": "", "vs": [[41, "فيستولي على المدن، وتسقط الحصون، وتصبح في ذلك اليوم قلوب محاربي موآب كقلب امرأة في مخاضها."]]}, {"l": "Rev 6:15-17", "n": "", "vs": [[15, "وملوك الأرض والعظماء والقواد والأغنيا ء والأقوياء والعبيد والأحرار كلهم اختبأوا في المغاور وصخور الجبال،"], [16, "وهم يقولون للجبال والصخور: اسقطي علينا، وأخفينا من وجه الجالس على العرش ومن غضب الحمل!»"], [17, "فإن يوم الغضب العظيم قد جاءهم، ومن يقوى على الوقوف أمامه؟"]]}], "kwAr": "الجبار", "noteAr": ""}], "arS": [["إن ", []], ["يوم", ["H3117"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["العظيم", ["H1419"]], [" ", []], ["قريب", ["H7138"]], ["، ", []], ["وشيك", ["H7138"]], [" ", []], ["وسريع", ["H4118"]], [" ", []], ["جدا", ["H3966"]], [". ", []], ["دوي", ["H6963"]], [" ", []], ["يوم", ["H3117"]], [" ", []], ["الرب", ["H3068"]], [" مخيف، ", []], ["فيه", ["H8033"]], [" ", []], ["يصرخ", ["H6873"]], [" ", []], ["الجبار", ["H1368"]], [" ", []], ["مرتعبا", ["H4751"]], [".", []]]}, {"c": 1, "v": 15, "text": "يوم غضب هو ذلك اليوم، يوم ضيق وعذاب، يوم خراب ودمار، يوم ظلمة واكتئاب، يوم غيوم وقتام.", "groups": [{"kw": "is", "raw": "Zep_1:18, Zep_2:2; Isa_22:5; Jer_30:7; Amo_5:18-20; Luk_21:22, Luk_21:23; Rom_2:5; 2Pe_3:7; Rev_6:17", "note": "", "refs": [{"l": "Zep 1:18", "n": "", "vs": [[18, "لا ينقذهم ذهبهم ولا فضتهم في يوم غضب الرب، إذ بنار غيرته تلتهم كل الأرض، وفيه يضع نهاية مباغتة كاملة سريعة لكل سكان المعمورة»."]]}, {"l": "Zep 2:2", "n": "", "vs": [[2, "قبل أن يحين القضاء، فيطوح بك كالعصافة أمام الريح، قبل أن يحل بك غضب الرب الماحق، قبل أن ينصب عليك سخط الرب."]]}, {"l": "Isa 22:5", "n": "", "vs": [[5, "لأن للسيد الرب القدير في أورشليم يوما يبث فيه الرعب، والذلة، والفوضى. فيه ينقب أهلها الأسوار ويستجيرون بالجبال."]]}, {"l": "Jer 30:7", "n": "", "vs": [[7, "ما أرهب ذلك اليوم إذ لا مثيل له! هو زمن ضيق على ذرية يعقوب، ولكنها ستنجو منه."]]}, {"l": "Amo 5:18-20", "n": "", "vs": [[18, "ويل للذين يتشوقون ليوم الرب. لماذا تطلبون مجيء يوم الرب؟ فيوم الرب هو ظلمة لا نور."], [19, "فتكونون كرجل هرب من وجه أسد فلقيه دب، أو كمن دخل إلى بيت واتكأ بيده على حائط فلدغته أفعى."], [20, "أو ليس يوم الرب ظلمة لا نورا، وقتاما خاليا من الضياء؟"]]}, {"l": "Luk 21:22", "n": "", "vs": [[22, "فإن هذه الأيام أيام انتقام يتم فيها كل ما قد كتب."]]}, {"l": "Luk 21:23", "n": "", "vs": [[23, "ولكن الويل للحبالى والمرضعات في تلك الأيام، لأن ضيقة عظيمة سوف تقع على الأرض وغضبا شديدا سينزل بهذا الشعب،"]]}, {"l": "Rom 2:5", "n": "", "vs": [[5, "ولكنك بسبب قساوتك وقلبك غير التائب، تخزن لنفسك غضبا ليوم الغضب، يوم تعلن دينونة الله العادلة."]]}, {"l": "2Pe 3:7", "n": "", "vs": [[7, "أما السماوات والأرض الحالية، فستبقى مخزونة ومحفوظة للنار بتلك الكلمة عينها إلى يوم الدينونة وهلاك الفاجرين!"]]}, {"l": "Rev 6:17", "n": "", "vs": [[17, "فإن يوم الغضب العظيم قد جاءهم، ومن يقوى على الوقوف أمامه؟"]]}], "kwAr": "هو ذلك اليوم", "noteAr": ""}, {"kw": "a day of darkness", "raw": "Job_3:4-8; Joe_2:2, Joe_2:11", "note": "", "refs": [{"l": "Job 3:4-8", "n": "", "vs": [[4, "ليتحول ذلك اليوم إلى ظلام. لا يرعاه الله من فوق، ولا يشرق عليه نهار."], [5, "ليستول عليه الظلام وظل الموت. ليكتنفه سحاب ولتروعه ظلمات النهار."], [6, "أما ذلك الليل فليعتقله الدجى المتكاثف، ولا يبتهج مع سائر أيام السنة، ولا يحص في عدد الشهور."], [7, "ليكن ذلك الليل عاقرا، لا يتردد فيه هتاف."], [8, "ليلعنه السحرة الحاذقون في إيقاظ التنين!"]]}, {"l": "Joe 2:2", "n": "", "vs": [[2, "هو يوم ظلمة وتجهم، يوم غيوم مكفهرة وقتام دامس،فيه تزحف أمة قوية وعظيمة كما يزحف الظلام على الجبال، أمة لم يكن لها شبيه في سالف الزمان، ولن يكون لها نظير من بعدها عبر سني الأجيال."]]}, {"l": "Joe 2:11", "n": "", "vs": [[11, "يجهر الرب بصوته في مقدمة جيشه لأن جنده لا يحصى لهم عدد، ومن ينفذ أمره يكون مقتدرا، لأن يوم الرب عظيم ومخيف جدا، فمن يتحمله؟"]]}], "kwAr": "يوم ظلمة", "noteAr": ""}], "arS": [["يوم", ["H3117"]], [" ", []], ["غضب", ["H5678"]], [" هو ", []], ["ذلك", ["H1931"]], [" ", []], ["اليوم", ["H3117"]], ["، ", []], ["يوم", ["H3117"]], [" ", []], ["ضيق", ["H6869"]], [" ", []], ["وعذاب", ["H4691"]], ["، ", []], ["يوم", ["H3117"]], [" ", []], ["خراب", ["H7722"]], [" ", []], ["ودمار", ["H4875"]], ["، ", []], ["يوم", ["H3117"]], [" ", []], ["ظلمة", ["H2822"]], [" ", []], ["واكتئاب", ["H653"]], ["، ", []], ["يوم", ["H3117"]], [" ", []], ["غيوم", ["H6051"]], [" ", []], ["وقتام", ["H6205"]], [".", []]]}, {"c": 1, "v": 16, "text": "يوم دوي بوق وصيحة قتال ضد المدن الحصينة والبروج الشامخة.", "groups": [{"kw": "day", "raw": "Isa_59:10; Jer_4:19, Jer_4:20, Jer_6:1, Jer_8:16; Hos_5:8, Hos_8:1; Amo_3:6; Hab_1:6-10; Hab_3:6", "note": "", "refs": [{"l": "Isa 59:10", "n": "", "vs": [[10, "نتحسس الحائط كالأعمى، ونتلمس كالمكفوف، نتعثر في الظهيرة كما لو كنا نسير في عتمة الليل ونكون كالأموات بين المتدفقين بالحياة"]]}, {"l": "Jer 4:19", "n": "", "vs": [[19, "لشد ما أتعذب! لشد ما أتعذب! قلبي يتلوى ألما. فؤادي يئن في داخلي فلا أستطيع الصمت، لأني سمعت دوي البوق وصيحات القتال."]]}, {"l": "Jer 4:20", "n": "", "vs": [[20, "كارثة في أعقاب كارثة، والأرض قاطبة قد استحالت خرابا، فتهدمت في لحظة خيامي، وبيوتي تدمرت بغتة."]]}, {"l": "Jer 6:1", "n": "", "vs": [[1, "«لوذوا بالنجاة ياذرية بنيامين، واهربوا من وسط أورشليم. انفخوا بالبوق في تقوع، وأشعلوا علم نار على بيت هكاريم، لأن الشر قد أقبل من الشمال ليعيث في الأرض خرابا."]]}, {"l": "Jer 8:16", "n": "", "vs": [[16, "قد ترددت حمحمة خيلهم من أرض دان، وارتعدت الأرض من صهيل جيادهم. قد أقبلوا واكتسحوا الأرض وكل ما فيها، والمدينة وأهلها."]]}, {"l": "Hos 5:8", "n": "", "vs": [[8, "انفخوا في أبواق الحرب في جبعة وفي الرامة، وأطلقوا صيحة القتال في بيت آون: تقدم يابنيامين."]]}, {"l": "Hos 8:1", "n": "", "vs": [[1, "ضع البوق بين شفتيك لتنفخ فيه، لأن نسرا ينقض على بيت الرب، فإن الشعب قد نقضوا عهدي وتعدوا على شريعتي."]]}, {"l": "Amo 3:6", "n": "", "vs": [[6, "أيدوي بوق في المدينة ولا يعتري الشعب الخوف؟ أيقع بلاء في المدينة ما لم يكن الرب قد أرسله؟"]]}, {"l": "Hab 1:6-10", "n": "", "vs": [[6, "فها أنا أثير الكلدانيين، هذه الأمة الحانقة المندفعة الزاحفة في رحاب الأرض، لتستولي على مساكن ليست لها."], [7, "أمة مخيفة مرعبة، تستمد حكمها وعظمتها من ذاتها."], [8, "خيولها أسرع من النمور، وأكثر ضراوة من ذئاب المساء. فرسانها يندفعون بكبرياء قادمين من أماكن بعيدة، متسابقين كالنسر المسرع للانقضاض على فريسته."], [9, "يقبلون جميعهم ليعيثوا فسادا، ويطغى الرعب منهم على قلوب الناس قبل وصولهم، فيجمعون أسرى كالرمل."], [10, "يهزأون بالملوك ويعبثون بالحكام. يسخرون من الحصون، يكومون حولها تلالا من التراب، ويستولون عليها."]]}, {"l": "Hab 3:6", "n": "", "vs": [[6, "وقف وزلزل الأرض، تفرس فأرعب الأمم، اندكت الجبال الأبدية وانهارت التلال القديمة، أما مسالكه فهي من الأزل."]]}], "kwAr": "يوم دوي بوق", "noteAr": ""}, {"kw": "and against", "raw": "Psa_48:12, Psa_48:13; Isa_2:12-15, Isa_32:14", "note": "", "refs": [{"l": "Psa 48:12", "n": "", "vs": [[12, "جولوا في صهيون ودوروا حولها. عدوا أبراجها."]]}, {"l": "Psa 48:13", "n": "", "vs": [[13, "تفرسوا في متاريسها وتأملوا قصور ها لتخبروا بها الأجيال القادمة."]]}, {"l": "Isa 2:12-15", "n": "", "vs": [[12, "فإن للرب القدير يوما فيه يوضع كل متعظم ومتكبر ومتغطرس."], [13, "ويسمو على أرز لبنان المتعالي الشامخ، وعلى كل بلوط باشان،"], [14, "وعلى كل جبل أشم، وعلى التلال المرتفعة،"], [15, "وعلى كل برج عال، وسور حصين،"]]}, {"l": "Isa 32:14", "n": "", "vs": [[14, "لأن القصر يصبح مهجورا، والمدن العامرة خالية، والتلال والبروج مغاور إلى الأبد، ومراحا للحمير الوحشية ومرعى للقطعان،"]]}], "kwAr": "والبروج الشامخة", "noteAr": ""}], "arS": [["يوم", ["H3117"]], [" دوي ", []], ["بوق", ["H7782"]], [" ", []], ["وصيحة", ["H8643"]], [" قتال ", []], ["ضد", ["H5921"]], [" ", []], ["المدن", ["H5892"]], [" ", []], ["الحصينة", ["H1219"]], [" ", []], ["والبروج", ["H6438"]], [" ", []], ["الشامخة", ["H1364"]], [".", []]]}, {"c": 1, "v": 17, "text": "فيه أضايق الناس فيمشون كالعمي، لأنهم أخطأوا بحق الرب، فتنسكب دماؤهم كالتراب، ولحمهم يتناثر كالجلة.", "groups": [{"kw": "they shall", "raw": "Deu_28:28, Deu_28:29; Psa_79:3; Isa_29:10, Isa_59:9, Isa_59:10; Lam_4:14; Mat_15:14; Joh_9:40,Joh_9:41; Rom_11:7, Rom_11:25; 2Co_4:4; 2Pe_1:9; 1Jo_2:11; Rev_3:17", "note": "", "refs": [{"l": "Deu 28:28", "n": "", "vs": [[28, "ويبتليكم الرب بالجنون والعمى وارتباك الفكر،"]]}, {"l": "Deu 28:29", "n": "", "vs": [[29, "فتتحسسون طرقكم في الظهر كما يتحسس الأعمى طريقه في الظلام، وتبوء طرقكم بالإخفاق، ولا تكونون إلا مظلومين مغصوبين كل الأيام، وليس من منقذ."]]}, {"l": "Psa 79:3", "n": "", "vs": [[3, "سفكوا دماءهم كالماء حول أورشليم، وليس هناك من يدفنهم."]]}, {"l": "Isa 29:10", "n": "", "vs": [[10, "لأن الرب قد سكب عليكم روح سبات عميق، فأغلق عيون أنبيائكم وغطى رؤوس رائييكم."]]}, {"l": "Isa 59:9", "n": "", "vs": [[9, "الحق ابتعد عنا، ولم يدركنا العدل. نرتقب نورا، فيحدق بنا الظلام، وننشد ضوءا فنسلك في العتمة."]]}, {"l": "Isa 59:10", "n": "", "vs": [[10, "نتحسس الحائط كالأعمى، ونتلمس كالمكفوف، نتعثر في الظهيرة كما لو كنا نسير في عتمة الليل ونكون كالأموات بين المتدفقين بالحياة"]]}, {"l": "Lam 4:14", "n": "", "vs": [[14, "تاهوا كعمي في الشوارع، ملطخين بالدم حتى لم يقدر أحد أن يلمس ثيابهم."]]}, {"l": "Mat 15:14", "n": "", "vs": [[14, "دعوهم وشأنهم، فهم عميان يقودون عميانا. وإذا كان الأعمى يقود أعمى، يسقطان معا في حفرة»."]]}, {"l": "Joh 9:40", "n": "", "vs": [[40, "فسمع ذلك بعض الفريسيين الذين كانوا معه فسألوه: «وهل نحن أيضا عميان؟»"]]}, {"l": "Joh 9:41", "n": "", "vs": [[41, "فأجابهم يسوع: «لو كنتم عميانا بالفعل، لما كانت عليكم خطيئة. ولكنكم تدعون أنكم تبصرون، ولذلك فإن خطيئتكم باقية...»"]]}, {"l": "Rom 11:7", "n": "", "vs": [[7, "فما الخلاصة إذا؟ إن ما يسعى إليه إسرائيل لم ينالوه، بل ناله المختارون منهم، والباقون عميت بصائرهم،"]]}, {"l": "Rom 11:25", "n": "", "vs": [[25, "فإني لا أريد، أيها الإخوة، أن يخفى عليكم هذا السر، لكي لا تكونوا حكماء في نظر أنفسكم، وهو أن العمى قد أصاب إسرائيل جزئيا إلى أن يتم دخول الأمم كليا."]]}, {"l": "2Co 4:4", "n": "", "vs": [[4, "الذين أعمى إله هذا العالم أذهانهم حتى لا يضيء لهم نور الإنجيل المختص بمجد المسيح الذي هو صورة الله."]]}, {"l": "2Pe 1:9", "n": "", "vs": [[9, "أما الذي لا يملك هذه الصفات، فهو أعمى روحيا. إنه قصير البصر، قد نسي أنه تطهر من خطاياه القديمة!"]]}, {"l": "1Jo 2:11", "n": "", "vs": [[11, "أما الذي يبغض أحد إخوته، فهو تائه في الظلام، يتلمس طريقه ولا يعرف أين يتجه، لأن الظلام قد أعمى عينيه!"]]}, {"l": "Rev 3:17", "n": "", "vs": [[17, "تقول: أنا غني، قد اغتنيت ولا يعوزني شيء! ولكنك لا تعلم أنك شقي بائس فقير أعمى عريا ن."]]}], "kwAr": "فيمشون", "noteAr": ""}, {"kw": "because", "raw": "Isa_24:5, Isa_24:6, Isa_50:1, Isa_59:12-15; Jer_2:17, Jer_2:19, Jer_4:18; Lam_1:8, Lam_1:14, Lam_1:18, Lam_4:13-15; Lam_5:16, Lam_5:17; Eze_22:25-31; Dan_9:5-19; Mic_3:9-12, Mic_7:13", "note": "", "refs": [{"l": "Isa 24:5", "n": "", "vs": [[5, "تدنست الأرض تحت سكانها، لأنهم تعدوا على الشريعة، ونقضوا الفرائض ونكثوا العهد الأبدي،"]]}, {"l": "Isa 24:6", "n": "", "vs": [[6, "لذلك التهمت اللعنة الأرض، وعوقب أهلها بإثمهم، فاحترق سكان الأرض ولم يبق منهم سوى قلة."]]}, {"l": "Isa 50:1", "n": "", "vs": [[1, "هذا ما يقوله الرب: أين كتاب طلاق أمكم الذي طلقتها به؟ لمن من دائني بعتكم؟ إنما من أجل ذنوبكم قد تم بيعكم، ومن جراء خطاياكم قد طلقت أمكم."]]}, {"l": "Isa 59:12-15", "n": "", "vs": [[12, "لأن معاصينا كثرت أمامك، وآثامنا تشهد علينا. فمعاصينا معنا، وذنوبنا نعرفها."], [13, "تمردنا وتنكرنا للرب. ارتددنا عن اتباع طرق إلهنا، تفوهنا بالظلم والعصيان افتراء، وبكلام زور من القلب."], [14, "قد ارتد عنا الإنصاف، ووقف العدل بعيدا، إذ سقط الحق صريعا في الشوارع، والبر لم يستطع الدخول."], [15, "أضحى الحق مفقودا، والحائد عن الشر ضحية. رأى الرب ذلك فأسخطه فقدان الإنصاف."]]}, {"l": "Jer 2:17", "n": "", "vs": [[17, "ألست أنت التي جلبت هذا الدمار على نفسك، لأنك تناسيت الرب إلهك حين قادك في الطريق؟"]]}, {"l": "Jer 2:19", "n": "", "vs": [[19, "إن شرك يقرعك، وارتدادك يؤنبك. فتبيني واعلمي أن نبذك للرب إلهك شر ومرارة، وأنك تجردت من مهابتي."]]}, {"l": "Jer 4:18", "n": "", "vs": [[18, "«طرقك وأعمالك جرت عليك هذا العقاب، هذا قصاصك وما أمره من قصاص، لأنه يخترق ذات قلبك."]]}, {"l": "Lam 1:8", "n": "", "vs": [[8, "ارتكبت أورشليم خطيئة نكراء فأصبحت رجسة. جميع مكرميها يحتقرونها لأنهم شهدوا عريها، أما هي فتنهدت وتراجعت القهقرى."]]}, {"l": "Lam 1:14", "n": "", "vs": [[14, "شد معاصي إلى نير، وبيده حبكها، فناء بها عنقي. أوهن الرب قواي وأسلمني إلى يد لا طاقة لي على مقاومتها."]]}, {"l": "Lam 1:18", "n": "", "vs": [[18, "الرب حقا عادل، وأنا قد تمردت على أمره. فاستمعوا ياجميع الشعوب واشهدوا وجعي. قد ذهب عذاراي وشباني إلى السبي."]]}, {"l": "Lam 4:13-15", "n": "", "vs": [[13, "عقابا لها على خطايا أنبيائها وآثام كهنتها، الذين سفكوا في وسطها دم الصديقين."], [14, "تاهوا كعمي في الشوارع، ملطخين بالدم حتى لم يقدر أحد أن يلمس ثيابهم."], [15, "هتفوا بهم: «ابتعدوا: تنحوا لا تلمسوا شيئا». فهربوا وتشردوا! غير أن أهل الأمم قالوا: لا يمكن أن يسكنوا معنا!"]]}, {"l": "Lam 5:16", "n": "", "vs": [[16, "تهاوى إكليل رأسنا، فويل لنا لأننا قد أخطأنا."]]}, {"l": "Lam 5:17", "n": "", "vs": [[17, "لهذا غشي على قلوبنا، وأظلمت عيوننا."]]}, {"l": "Eze 22:25-31", "n": "", "vs": [[25, "تواطأ أنبياؤها الكذبة فيها مثل أسد مزمجر يمزق الفريسة. التهموا نفوسا، واستولوا على نفائس الناس وكنوزهم، وكثروا أراملها فيها."], [26, "خالف كهنتها شريعتي ونجسوا مقادسي. لم يميزوا بين المقدس والرجس، ولم يعلموا الفرق بين الطاهر والنجس، وحجبوا عيونهم عن أيام سبوتي فصرت مدنسا في وسطهم."], [27, "رؤساؤها فيها كذئاب خاطفة تمزق فرائسها إذ يسفكون دماء الناس في سبيل الربح الحرام."], [28, "وأنبياؤها قد طلوا لهم بماء الكلس، إذ يرون لهم رؤى باطلة، ويعرفون لهم عرافة كاذبة قائلين: هذا ما يعلنه السيد الرب، مع أن الرب لم يعلن شيئا."], [29, "أفرطوا في ظلم شعب الأرض واغتصبوا سالبين، واضطهدوا الفقير والمسكين، وظلموا الغريب جورا."], [30, "فالتمست من بينهم رجلا واحدا يبني جدارا ويقف في الثغرة أمامي مدافعا عن الأرض، حتى لا أخربها فلم أجد."], [31, "فصببت سخطي عليهم، التهمتهم بنار غضبي، جازيتهم بحسب طرقهم، يقول السيد الرب»."]]}, {"l": "Dan 9:5-19", "n": "", "vs": [[5, "إننا أخطأنا وأثمنا وارتكبنا الشر، وتمردنا وانحرفنا عن وصاياك وأحكامك."], [6, "ولم نسمع لعبيدك الأنبياء الذين باسمك أنذروا ملوكنا ورؤساءنا وآباءنا وجميع شعب الأرض."], [7, "لك أيها السيد البر، ولنا الخزي، كما هو حادث اليوم لرجال يهوذا ولأهل أورشليم، ولسائر بني إسرائيل القريبين والبعيدين، المشتتين في كل البلدان التي أجليتهم إليها عقابا لهم على ما اقترفوه من خيانة في حقك."], [8, "فلنا أيها السيد الخزي، نحن وملوكنا ورؤسائنا وآبائنا، لأننا أخطأنا إليك."], [9, "إنما للرب إلهنا الرحمة والمغفرة لأننا عصيناك."], [10, "ولم نطع صوت الرب إلهنا لنسلك في شرائعه التي أعلنها لنا على لسان عبيده الأنبياء."], [11, "قد تعدى كل شعب إسرائيل على شريعتك، وانحرفوا فلم يسمعوا صوتك، فسكبت علينا اللعنة وما أقسمت أن توقعه بنا، كما نصت عليه شريعة موسى عبد الله، لأننا أخطأنا إليك."], [12, "وقد نفذت قضاءك الذي قضيت به علينا وعلى قضاتنا الذين تولوا أمرنا، جالبا علينا وعلى أورشليم شرا عظيما لم يحدث له مثيل تحت السماء."], [13, "وكما ورد في شريعة موسى، أصابنا جميع هذا البلاء، ولم نستعطف وجهك أيها الرب إلهنا تائبين عن آثامنا ومتنبهين لحقك."], [14, "فأضمرت لنا العقاب وأوقعته بنا لأنك إلهنا البار في كل أعمالك التي صنعتها لأننا لم نستمع إليك."], [15, "والآن أيها السيد إلهنا، يامن أخرجت شعبك من ديار مصر بقوة مقتدرة، وأشهرت اسمك كما هو حادث اليوم، قد أخطأنا وارتكبنا الشر."], [16, "فاصرف ياسيد، حسب رحمتك، سخطك وغضبك عن مدينتك أورشليم جبل قدسك إذ من جراء خطايانا وآثام آبائنا أصبحت أورشليم مثار عار لنا عند جميع المحيطين بنا."], [17, "فأنصت الآن ياإلهنا إلى صلاة عبدك وابتهالاته، وأضيء بوجهك على هيكلك المتهدم، من أجل ذاتك."], [18, "أرهف أذنك ياإلهي واستمع، وافتح عينيك وشاهد خرائبنا والمدينة التي دعي اسمك عليها، فإننا لا من أجل بر فينا نرفع تضرعاتنا إليك، بل بفضل مراحمك العظيمة."], [19, "فاستمع أيها السيد واغفر. أصغ أيها السيد وتصرف ولا تبطىء من أجل نفسك ياإلهي، لأن اسمك دعي على مدينتك وعلى شعبك»."]]}, {"l": "Mic 3:9-12", "n": "", "vs": [[9, "استمعوا هذا يارؤساء بيت يعقوب وقضاة شعب إسرائيل الذين يكرهون العدل ويحرفون الحق."], [10, "الذين يبنون صهيون بالدم وأورشليم بالظلم."], [11, "إذ يحكم رؤساؤها بالرشوة، وكهنتها يعلمون بالأجرة ويتعاطى أنبياؤها العرافة لقاء المال، ومع ذلك يدعون الاتكال على الله قائلين: «أليس الرب في وسطنا؟ لذلك لن يصيبنا مكروه»."], [12, "لهذا من جراء أعمالكم ستحرث صهيون كالحقل وتصبح أورشليم كومة من الخرائب، وجبل الهيكل مرتفعا تنمو عليه أشجار الغاب."]]}, {"l": "Mic 7:13", "n": "", "vs": [[13, "غير أن الأرض تكون موحشة بسبب سيئات سكانها."]]}], "kwAr": "لأنهم أخطأوا", "noteAr": ""}, {"kw": "and their blood", "raw": "2Ki_9:33-37; Psa_79:2, Psa_79:3, Psa_83:10; Jer_9:21, Jer_9:22, Jer_15:3, Jer_16:4-6, Jer_18:21; Lam_2:21, Lam_4:14; Amo_4:10", "note": "", "refs": [{"l": "2Ki 9:33-37", "n": "", "vs": [[33, "فقال: «اطرحوها». فألقوا بها من الكوة فتناثر بعض دمها على الجدار وعلى الخيل التي داستها بحوافرها."], [34, "ودخل بعد ذلك إلى القصر حيث أكل وشرب ثم قال: «اذهبوا وافتقدوا هذه المرأة الملعونة وادفنوها، لأنها بنت ملك»."], [35, "وعندما خرجوا ليدفنوها لم يجدوا من أشلائها سوى الجمجمة والرجلين وكفي اليدين،"], [36, "فرجعوا وأخبروه، فقال: «هذا إتمام لقضاء الرب الذي نطق به على لسان إيليا التشبي قائلا: إن الكلاب ستلتهم لحم إيزابل في حقل يزرعيل."], [37, "وتصبح جثة إيزابل كالزبل على وجه حقل يزرعيل بحيث لا يتعرف عليها أحد فيقول: هذه إيزابل»."]]}, {"l": "Psa 79:2", "n": "", "vs": [[2, "جعلوا جثث عبيدك مأكلا لطيور السماء، ولحوم قديسيك لوحوش الأرض."]]}, {"l": "Psa 79:3", "n": "", "vs": [[3, "سفكوا دماءهم كالماء حول أورشليم، وليس هناك من يدفنهم."]]}, {"l": "Psa 83:10", "n": "", "vs": [[10, "بادوا في عين دور، وص
