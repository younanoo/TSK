 []]]}, {"c": 2, "v": 12, "text": "وأنتم أيضا أيها الكوشيون ستسقطون صرعى سيفي.", "groups": [{"kw": "Ethiopians", "raw": "Isa_18:1-7, Isa_20:4, Isa_20:5, Isa_43:3; Jer_46:9, Jer_46:10; Eze_30:4-9", "note": "", "refs": [{"l": "Isa 18:1-7", "n": "", "vs": [[1, "ويل لأرض حفيف الأجنحة في عبر أنهار كوش،"], [2, "التي تبعث رسلا في البحر في قوارب البردي السابحة فوق المياه، امضوا أيها الرسل المسرعون إلى شعب طوال القامة جرد، إلى شعب بث الرعب في القاصي والداني، إلى قوم أقوياء وقاهرين تشطر الأنهار أرضهم."], [3, "ياجميع أهل الأرض والساكنين فيها، عندما ترتفع راية على الجبال فانظروا، وعندما يدوي نفير بوق فاسمعوا."], [4, "لأنه هكذا قال الرب لي: سأمكث هادئا ناظرا من مقر سكناي، كحر صاف تحت أشعة الشمس أو كسحاب الطل في حر الحصاد"], [5, "لأنه قبل الحصاد عندما يتم تفتح الزهر، ويتحول الزهر إلى عنب ناضج، فإنه يقطع الفروع بالمناجل، وينزع الأغصان الممتدة ويطرحها،"], [6, "وتترك كلها لجوارح الجبال ووحوش الأرض، فتلتهمها الجوارح في الصيف، وتتغذى بها الوحوش في الشتاء»."], [7, "في ذلك الوقت يقدم الشعب الطويل القامة الأجرد، الذي بث الرعب في القاصي والداني، الأمة القوية القاهرة التي تشطر الأنهار أرضها، هدايا إلى الرب القدير في جبل صهيون، موضع اسم الرب القدير."]]}, {"l": "Isa 20:4", "n": "", "vs": [[4, "هكذا يقود ملك أشور أسرى مصر وكوش صغارا وكبارا، عراة حفاة بأقفية مكشوفة، عارا لمصر."]]}, {"l": "Isa 20:5", "n": "", "vs": [[5, "عندئذ يفزع الفلسطينيون الذين اعتمدوا على كوش رجائهم ومصر فخرهم."]]}, {"l": "Isa 43:3", "n": "", "vs": [[3, "لأني أنا هو الرب إلهك، قدوس إسرائيل مخلصك، قد جعلت مصر فدية عنك وكوش وسبا عوضا عنك."]]}, {"l": "Jer 46:9", "n": "", "vs": [[9, "اقتحمي أيتها الخيل، وثوري يامركبات، وليبرز المحاربون من رجال كوش وفوط، الحاملين التروس، ومن رجال لوديم رماة السهام بالقسي."]]}, {"l": "Jer 46:10", "n": "", "vs": [[10, "فهذا اليوم هو يوم قضاء السيد الرب القدير، يوم الانتقام. فيه يثأر لنفسه من أعدائه، فيلتهم السيف ويشبع، ويرتوي من دمائهم، لأن للسيد الرب القدير ذبيحة في أرض الشمال إلى جوار نهر الفرات."]]}, {"l": "Eze 30:4-9", "n": "", "vs": [[4, "إذ يجرد سيف على مصر، فيعم الذعر الشديد إثيوبيا، عندما يتهاوى قتلى مصر ويستولى على ثروتها، وتنقض أسسها."], [5, "ثم تسقط معهم بالسيف إثيوبيا وفوط ولود وشبه الجزيرة العربية وليبيا وشعوب الأرض المتحالفة معهم."], [6, "حقا يسقط مناصر مصر وتذل كبرياء عزتها، فيتهاوى بالسيف سكانها من مجدل إلى أسوان، يقول السيد الرب."], [7, "فتصبح أكثر الأراضي المقفرة وحشة، وتضحى مدنها أكثر المدن خرابا!"], [8, "فيدركون أني أنا الرب حين أضرم نارا في مصر وينهار جميع حلفائها."], [9, "في ذلك اليوم يسرع رسلي إلى إثيوبيا المطمئنة ليثيروا فيها الرعب في يوم هلاك مصر، الذي لابد أن يتحقق."]]}], "kwAr": "الكوشيون", "noteAr": ""}, {"kw": "my", "raw": "Psa_17:13; Isa_10:5, Isa_13:5; Jer_47:6, Jer_47:7, Jer_51:20-23", "note": "", "refs": [{"l": "Psa 17:13", "n": "", "vs": [[13, "قم يارب تصد له. اصرعه. وبسيفك نج نفسي من الشرير."]]}, {"l": "Isa 10:5", "n": "", "vs": [[5, "ويل للأشوريين، قضيب غضبي، الحاملين في أيديهم عصا سخطي."]]}, {"l": "Isa 13:5", "n": "", "vs": [[5, "يقبلون من أرض نائية، من أقصى السماوات هم جنود الرب وأسلحة سخطه لتدمير الأرض كلها."]]}, {"l": "Jer 47:6", "n": "", "vs": [[6, "ياسيف الرب، متى تستكين؟ استقر في غمدك واهدأ واسترح."]]}, {"l": "Jer 47:7", "n": "", "vs": [[7, "كيف يمكن له أن يستكين، وقد أصدر الرب له أمره ليضرب أشقلون ومدن ساحل البحر، هناك واعده الرب على اللقاء»."]]}, {"l": "Jer 51:20-23", "n": "", "vs": [[20, "أنت فأس معركتي وآلة حربي. بك أمزق الأمم إربا وأحطم ممالك."], [21, "بك أجعل الفرس وفارسها أشلاء، وأهشم المركبة وراكبها."], [22, "بك أحطم الرجل والمرأة، والشيخ والفتى، والشاب والعذراء."], [23, "بك أسحق الراعي وقطيعه، والحارث وفدانه، والحكام والولاة."]]}], "kwAr": "سيفي", "noteAr": ""}], "arS": [["وأنتم", ["H859"]], [" ", []], ["أيضا", ["H1571"]], [" أيها ", []], ["الكوشيون", ["H3569"]], [" ", []], ["ستسقطون", ["H2491"]], [" ", []], ["صرعى", ["H1992"]], [" ", []], ["سيفي", ["H2719"]], [".", []]]}, {"c": 2, "v": 13, "text": "ثم يبسط يده نحو الشمال ويبيد أشور ويجعل نينوى قفرا موحشا، أرضا قاحلة كالصحراء.", "groups": [{"kw": "he will", "raw": "Psa_83:8, Psa_83:9; Isa_10:12, Isa_10:16, Isa_11:11; Ezek. 31:3-18", "note": "", "refs": [{"l": "Psa 83:8", "n": "", "vs": [[8, "وقوم أشور أيضا انضموا إليهم، صاروا عونا لبني لوط."]]}, {"l": "Psa 83:9", "n": "", "vs": [[9, "افعل بهم كما فعلت بمديان وسيسرا ويابين في نهر قيشون."]]}, {"l": "Isa 10:12", "n": "", "vs": [[12, "ولكن حالما ينتهي الرب من عمله بجبل صهيون، فإنه سيعاقب ملك أشور على غرور قلبه وتشامخ عينيه،"]]}, {"l": "Isa 10:16", "n": "", "vs": [[16, "لذلك فإن الرب القدير سيفشي وبأ مهلكا بين محاربيه الشجعان، ويوقد تحت مجده وقيدا كاشتعال النار،"]]}, {"l": "Isa 11:11", "n": "", "vs": [[11, "فيعود الرب ليمد يده ثانية ليسترد البقية الباقية من شعبه، من أشور ومصر وفتروس وكوش وعيلام وشنعار وحماة، ومن جزائر البحر،"]]}, {"l": "Eze 31:3-18", "n": "", "vs": [[3, "إنني أشبهك بشجرة أرز في لبنان، بهية الأغصان، وارفة الظل، شامخة تطاول قمتها الغيوم،"], [4, "ترويها المياه، وتنميها اللجج. تجري أنهارها حول مغرسها، وتنساب جداولها إلى كل أشجار الحقل."], [5, "لهذا طاولت قامتها خميع أشجار الحقل وتكاثرت أغصانها، وامتدت فروعها التي نبتت لغزارة مياهها."], [6, "وعششت في أغصانها كل طيور السماء، وتحت فروعها ولدت كل حيوان البر، وأوت تحت ظلها كل أمم الأرض العظيمة."], [7, "فكانت رائعة في عظمتها وفي شموخ قامتها لأن جذورها كانت مغروسة في مياه غريرة."], [8, "لم يضاهها الأرز في جنة الله، ولم يعادل السرو أغصانها، ولم يماثل الدلب فروعها. كل الأشجار في جنة الله لم تشبهها في حسنها."], [9, "جعلتها بهية لكثرة أغصانها حتى حسدتها كل أشجار عدن التي في جنة الله."], [10, "لذلك يقول السيد الرب: لأنك يافرعون شمخت بقامتك وطاولت بهامتك الغيوم، تكبر قلبك من جراء عظمتك."], [11, "أسلمتك إلى يد المتسلط على الأمم فيعاملك أقسى معاملة. إني نبذتك لفرط شرك."], [12, "ويستأصله الغرباء عتاة الأمم، ويتركونه، فتتهاوى أغصانه على الجبال وفي جميع الوهاد، وتتحطم فروعه إلى جوار كل أنهار الأرض، ويهجر ظله كل شعوب الأرض وينبذونه."], [13, "وتجثم على حطامه طيور السماء جميعها، وتربض فوق قضبانه كل حيوان البر"], [14, "لئلا تشمخ شجرة ما مغروسة على المياه لاَرتفاع قامتها، ولا تطاول بهامتها الغيوم، ولكي لا تبلغ أية شجرة ترويها المياه مثل هذا العلو، لأنها جميعها مآلها الموت، حيث تمضي إلى الأرض السفلى بين الفانين من بني آدم، مع الهابطين إلى الهاوية."], [15, "وهذا ما يعلنه السيد الرب: وفي يوم هبوطه إلى الهاوية يعم النواح الطبيعة، فأكسو الغمر ثياب الحداد عليه، وأكبح جريان أنهاره، وتكف مياهه عن التدفق وأجعل لبنان ينوح عليه، وتذبل كل أشجار الحقل حزنا على هلاكه."], [16, "من جلبة سقوطه حين أنزلته إلى الهاوية مع الهابطين إليها ارتعدت الأمم، فتتعزى في الأرض السفلى كل أشجار عدن ونخبة أشجار لبنان، وكل مرتوية من ماء."], [17, "هم أيضا ينحدرون معه إلى الهاوية لينضموا إلى قتلى السيف، وكذلك يهلك حلفاؤه من الأمم المقيمين تحت ظله."], [18, "من ماثلت بين أشجار عدن في المجد والعظمة؟ ستنحدر إلى الأرض السفلى مع أشجار عدن، وترقد مع الغلف، مع المقتولين بالسيف. هذا هو مصير فرعون وكل شعبه، يقول السيد الرب»."]]}], "kwAr": "ثم يبسط يده", "noteAr": ""}, {"kw": "will make", "raw": "Nah_1:1, Nah_2:10,Nah_2:11, Nah_3:7, Nah_3:15, Nah_3:18, Nah_3:19; Zec_10:10,Zec_10:11", "note": "", "refs": [{"l": "Nah 1:1", "n": "", "vs": [[1, "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."]]}, {"l": "Nah 2:10", "n": "", "vs": [[10, "أضحت موحشة خاوية جرداء، ذابت منها القلوب رعبا وانحلت منها الركب، طغى عليها الألم وعلا وجوه أهلها الشحوب."]]}, {"l": "Nah 2:11", "n": "", "vs": [[11, "أين نينوى عرين الأسود ومرتع الأشبال حيث يسرح الأسد واللبوءة والأشبال من غير إزعاج؟"]]}, {"l": "Nah 3:7", "n": "", "vs": [[7, "وكل من يراك يعرض عنك قائلا: «قد خربت نينوى فمن ينوح عليها؟ أين أجد لها معزين؟»"]]}, {"l": "Nah 3:15", "n": "", "vs": [[15, "هناك تلتهمك النار، ويستأصلك السيف، فيبيدك الأعداء كالجراد. تكاثري كالجراد وكالجنادب."]]}, {"l": "Nah 3:18", "n": "", "vs": [[18, "قد نام رعاتك ياملك أشور، وغرق عظماؤك في سبات عميق، تشتت شعبك على الجبال ولا يوجد من يجمعهم."]]}, {"l": "Nah 3:19", "n": "", "vs": [[19, "لا جبر لكسرك، وجرحك مميت. وكل من يسمع بما جرى لك يصفق ابتهاجا لما أصابك، فمن لم يعان من شرك المتمادي؟"]]}, {"l": "Zec 10:10", "n": "", "vs": [[10, "سأردهم إلى موطنهم من ديار مصر، وأجمع شتاتهم من أشور، وآتي بهم إلى أرض جلعاد ولبنان حتى لا يبقى متسع لهم بعد."]]}, {"l": "Zec 10:11", "n": "", "vs": [[11, "يجتازون عبر بحر المشقات، فتنحسر الأمواج وتجف لجج النيل. تذل كبرياء أشور ويزول صولجان مصر."]]}], "kwAr": "ويجعل نينوى", "noteAr": ""}], "arS": [["ثم ", []], ["يبسط", ["H5186"]], [" ", []], ["يده", ["H3027"]], [" ", []], ["نحو", ["H5921"]], [" ", []], ["الشمال", ["H6828"]], [" ", []], ["ويبيد", ["H6"]], [" ", []], ["أشور", ["H804"]], [" ", []], ["ويجعل", ["H7760"]], [" ", []], ["نينوى", ["H5210"]], [" قفرا ", []], ["موحشا", ["H8077"]], ["، أرضا ", []], ["قاحلة", ["H6723"]], [" ", []], ["كالصحراء", ["H4057"]], [".", []]]}, {"c": 2, "v": 14, "text": "تربض في وسطها القطعان وسائر وحوش البر، ويأوي إلى تيجان أعمدتها القوق والقنفذ وينعب الغراب على عتباتها، لأن أرزها قد تعرى.", "groups": [{"kw": "flocks", "raw": "Zep_2:6; Isa_13:19-22, Isa_34:11-17; Rev_18:2", "note": "", "refs": [{"l": "Zep 2:6", "n": "", "vs": [[6, "وأنت ياأرض ساحل البحر تصبحين مراعي ومروجا للرعاة وحظائر للمواشي."]]}, {"l": "Isa 13:19-22", "n": "", "vs": [[19, "أما بابل، مجد الممالك وبهاء وفخر الكلدانيين، فتصبح كسدوم وعمورة اللتين قلبهما الله ."], [20, "لا يسكن فيها، ولا تعمر من جيل إلى جيل، لا ينصب فيها بدوي خيمته، ولا يربض فيها راع قطعانه."], [21, "إنما تأوي إليها وحوش القفر وتعج بيوت خرائبها بالبوم، وتلجأ إليها بنات النعام، وتتواثب فيها الماعز البرية،"], [22, "وتتعاوى الضباع بين أبراجها، وبنات آوى بين قصورها الفخمة. إن وقت عقابها بات وشيكا، وأيامها لن تطول!"]]}, {"l": "Isa 34:11-17", "n": "", "vs": [[11, "ولا يرثها سوى الصقور والقنافذ، ويسكن فيها البوم والغراب، ويمد الرب عليها خيط الدمار ومطمار الهلاك،"], [12, "ولا يجد فيها أشرافها أثرا للملك، وينقرض جميع رؤسائها."], [13, "ينمو الشوك في قصورها، ويزحف العوسج على حصونها، فتصبح مأوى لبنات آوى، ومسكنا للنعام."], [14, "وتجتمع فيها الوحوش البرية مع الذئاب، ووعل البر يدعو صاحبه، وهناك تستقر وحوش الليل وتجد لنفسها ملاذ راحة."], [15, "هناك تعيش البوم وتبيض وتفرخ وترعى صغارها تحت أجنحتها، وهناك أيضا تتلاقى الصقور بعضها ببعض."], [16, "ابحثوا في سفر الرب واقرأوا: فكلمة واحدة لا يمكن أن تسقط، إذ كل أليف سيجتمع بأليفه، لأن فم الرب قد أمر، وروحه يجمعها معا."], [17, "فهو قد ألقى عليها القرعة، ويده قد وزعتها بقسطاس، فترثها إلى الأبد وتقيم فيها جيلا بعد جيل."]]}, {"l": "Rev 18:2", "n": "", "vs": [[2, "وصاح بأعلى صوته: «سقطت، سقطت بابل العظمى، وصارت وكرا للشياطين ومأوى لكل روح نجس ولكل طائر نجس مكروه،"]]}], "kwAr": "القطعان", "noteAr": ""}, {"kw": "cormorant", "raw": "or, pelican", "note": "or, pelican", "refs": [], "kwAr": "القوق", "noteAr": "أو: «البجع»."}, {"kw": "upper lintels", "raw": "or, knops, or chapiters, Amo_9:1", "note": "or, knops, or chapiters, Amo_9:1", "refs": [{"l": "Amo 9:1", "n": "", "vs": [[1, "ورأيت السيد واقفا إلى جوار المذبح قائلا: «اضرب تيجان الأعمدة حتى تهتز العتبات، وحطمها على رؤوس جميع الشعب. ومن ينجو منهم أهلكه بالسيف، فلا يهرب منهم أحد ولا يفلت منهم ناج."]]}], "kwAr": "تيجان أعمدتها", "noteAr": "أو: «تيجان الأعمدة». انظر عا 9: 1"}, {"kw": "for he shall uncover", "raw": "or, when he hath uncovered", "note": "or, when he hath uncovered", "refs": [], "kwAr": "قد تعرى", "noteAr": "أو: «حين يكشف»."}, {"kw": "the cedar", "raw": "Jer_22:14", "note": "", "refs": [{"l": "Jer 22:14", "n": "", "vs": [[14, "الذي يقول: «سأبني لنفسي بيتا رحبا وغرفا عالية فسيحة. وأفتح له كوى وأغشيه بألواح الأرز وأدهنه بألوان حمراء."]]}], "kwAr": "أرزها", "noteAr": ""}], "arS": [["تربض", ["H7257"]], [" في ", []], ["وسطها", ["H8432"]], [" ", []], ["القطعان", ["H5739"]], [" وسائر ", []], ["وحوش", ["H2416"]], [" ", []], ["البر", ["H1471"]], ["، ", []], ["ويأوي", ["H3885"]], [" إلى ", []], ["تيجان", ["H3730"]], [" أعمدتها ", []], ["القوق", ["H6893"]], [" ", []], ["والقنفذ", ["H7090"]], [" ", []], ["وينعب", ["H7891"]], [" ", []], ["الغراب", ["H6963"]], [" على ", []], ["عتباتها", ["H5592"]], ["، ", []], ["لأن", ["H3588"]], [" ", []], ["أرزها", ["H731"]], [" قد ", []], ["تعرى", ["H6168"]], [".", []]]}, {"c": 2, "v": 15, "text": "هذه هي المدينة الطروب التي سكنت آمنة قائلة لنفسها: أنا وليس لي نظير! كيف صارت أطلالا، ومأوى للوحوش البرية؟ كل من يجتاز بها يصفر دهشة ويهز يده».", "groups": [{"kw": "the rejoicing", "raw": "Isa_10:12-14, Isa_22:2, Isa_47:7; Rev_18:7-10", "note": "", "refs": [{"l": "Isa 10:12-14", "n": "", "vs": [[12, "ولكن حالما ينتهي الرب من عمله بجبل صهيون، فإنه سيعاقب ملك أشور على غرور قلبه وتشامخ عينيه،"], [13, "لأنه يقول: بقوة ذراعي قد صنعت هذا، وبحكمتي، لأنني فهيم! قد نقلت تخوم الأمم، ونهبت كنوزهم، وعزلت الجالسين على العروش كما يفعل ذو البطش."], [14, "وكما تستحوذ يد الإنسان على العش، هكذا استحوذت يدي على ثروات الشعوب. وكما يجمع الإنسان البيض المهجور، هكذا جمعت الأرض بأسرها، فلم يجرؤ أحد أن يحرك جناحا أو يفتح فاها أو ينبس بهمسة."]]}, {"l": "Isa 22:2", "n": "", "vs": [[2, "أيتها المدينة الممتلئة جلبة، العجاجة المرحة، إن قتلاك ليسوا قتلى سيف أو صرعى حرب."]]}, {"l": "Isa 47:7", "n": "", "vs": [[7, "وقلت: سأظل السيدة إلى الأبد. لذلك لم تفكري بهذه الأمور في نفسك ولا تأملت بما تؤول إليه."]]}, {"l": "Rev 18:7-10", "n": "", "vs": [[7, "أنزلوا بها من العذاب والشقاء على قدر ما عظمت نفسها وترفهت. فإنها تقول في نفسها: أنا ملكة على العرش، ولست أرملة، ولن أذوق طعم الحزن."], [8, "لذلك ستنقض عليها البلايا في يوم واحد، من موت وحزن وجوع، وستحترق بالنار، فإن الله الذي يدينها هو رب قدير."], [9, "وسيبكي عليها ملوك الأرض الذين زنوا وترفهوا معها، وسينوحون وهم ينظرون إلى دخان حريقها،"], [10, "فيقفون على بعد منها، خوفا من عذابها، وهم يصرخون: الويل، الويل، أيتها المدينة العظمى، بابل القوية! في ساعة واحدة حل بك العقاب!"]]}], "kwAr": "المدينة الطروب", "noteAr": ""}, {"kw": "I am", "raw": "Isa_47:8; Eze_28:2, Eze_28:9, Eze_29:3", "note": "", "refs": [{"l": "Isa 47:8", "n": "", "vs": [[8, "فالآن اسمعي هذا أيتها المترفهة المتنعمة المطمئنة، القائلة في قلبها: أنا وحدي وليس هناك غيري، لن أعرف الترمل ولن أثكل"]]}, {"l": "Eze 28:2", "n": "", "vs": [[2, "«ياابن آدم، قل لملك صور، هذا ما يعلنه السيد الرب: لأنك تكبرت وقلت: «أنا إله، وأتربع في مجلس الآلهة، في قلب البحار»؛ مع أنك إنسان ولست إلها، وإن ظننت أن لديك حكمة الآلهة!"]]}, {"l": "Eze 28:9", "n": "", "vs": [[9, "أتظل تقول أنئذ أمام قاتلك: أنا إله؟ أنت إنسان لا إله في قبضة ذابحيك."]]}, {"l": "Eze 29:3", "n": "", "vs": [[3, "وقل هذا ما يعلنه السيد الرب: ها أنا أنقلب عليك يافرعون ملك مصر، أيها التمساح الكامن في وسط أنهاره، القائل: النهر لي وقد صنعته لنفسي."]]}], "kwAr": "أنا وليس لي نظير", "noteAr": ""}, {"kw": "how is", "raw": "Isa_14:4, Isa_14:5; Lam_1:1, Lam_2:1; Rev_18:10-19", "note": "", "refs": [{"l": "Isa 14:4", "n": "", "vs": [[4, "فتسخرون من ملك بابل قائلين: كيف استكان الظالم، وكيف خمدت غضبته المتعجرفة؟"]]}, {"l": "Isa 14:5", "n": "", "vs": [[5, "قد حطم الرب عصا المنافق وصولجان المتسلطين،"]]}, {"l": "Lam 1:1", "n": "", "vs": [[1, "كيف أصبحت المدينة الآهلة بالسكان مهجورة وحيدة؟ صارت كأرملة! هذه التي كانت عظيمة بين الأمم. السيدة بين المدن صارت تحت الجزية!"]]}, {"l": "Lam 2:1", "n": "", "vs": [[1, "كيف خيم الرب في غضبه بالظلام على ابنة صهيون، وطرح من السماء إلى الأرض جلال إسرائيل، ولم يذكر موطيء قدميه في يوم سخطه؟"]]}, {"l": "Rev 18:10-19", "n": "", "vs": [[10, "فيقفون على بعد منها، خوفا من عذابها، وهم يصرخون: الويل، الويل، أيتها المدينة العظمى، بابل القوية! في ساعة واحدة حل بك العقاب!"], [11, "وسيبكي تجار الأرض ويحزنون عليها، لأنه لم يبق أحد ليشتري بضائعهم،"], [12, "فقد كانت هي تشتري منهم الذهب والفضة والحجارة الكريمة واللؤلؤ، والكتان والأرجوان والحرير والقرمز، وجميع الأخشاب العطرة وأدوات العاج والمصنوعات الخشبية الثمينة، والنحاس والحديد والرخام،"], [13, "والقرفة والبهار، والعطور والطيب والبخور، والخمر والزيت والدقيق والحبوب، والبهائم والغنم، والخيل والمركبات، والأجساد والنفوس البشرية"], [14, "وسيقولون: مضى عنك الثمر الذي كانت تشتهيه نفسك؛ وزالت عنك مظاهر الترف والعظمة كلها، ولن تعود!"], [15, "هؤلاء التجار الذين اغتنوا من التجارة معها، يقفون على بعد منها، خوفا من عذابها، يبكون وينتحبون"], [16, "قائلين: الويل، الويل على المدينة العظمى! كانت ترتدي أفضل الكتان والأرجوان والقرمز، وتتحلى بالذهب والأحجار الكريمة واللؤلوء،"], [17, "وقد زال هذا الغنى كله في ساعة واحدة!"], [18, "ينظرون إلى دخان حريقها، فيصرخون: أية مدينة مثل هذه المدينة العظمى؟"], [19, "ويذرون التراب على رؤوسهم وهم يصرخون باكين منتحبين: الويل، الويل على المدينة العظمى التي اغتنى أصحاب سفن البحر جميعا بفضل ثروتها! ها هي في ساعة واحدة قد زالت!"]]}], "kwAr": "كيف صارت", "noteAr": ""}, {"kw": "every", "raw": "1Ki_9:7, 1Ki_9:8; Job_27:23; Psa_52:6, Psa_52:7; Lam_2:15; Eze_27:36; Nah_3:19; Mat_27:39", "note": "", "refs": [{"l": "1Ki 9:7", "n": "", "vs": [[7, "فإني أبيد إسرائيل عن وجه الأرض التي وهبتها لهم، وأنبذ الهيكل الذي قدسته لاسمي، فيصبح إسرائيل مثلا ومثار هزء لجميع الأمم."]]}, {"l": "1Ki 9:8", "n": "", "vs": [[8, "ويصبح هذا الهيكل عبرة يثير عجب كل من يمر به، فيصفر ويتساءل: لماذا صنع الرب هكذا بهذه الأرض وبهذا الهيكل؟"]]}, {"l": "Job 27:23", "n": "", "vs": [[23, "تصفر الريح عليه، وترعبه بقوتها المدمرة."]]}, {"l": "Psa 52:6", "n": "", "vs": [[6, "فيرى الأبرار ذلك ويخافون؛ يضحكون عليك قائلين:"]]}, {"l": "Psa 52:7", "n": "", "vs": [[7, "هذا هو الرجل الذي لم يتخذ الله حصنا له، بل اتكل على وفرة غناه واعتز بغوايته."]]}, {"l": "Lam 2:15", "n": "", "vs": [[15, "كل عابري السبيل صفقوا عليك بالأيادي فرحا. صفروا وهزوا رؤوسهم على ابنة أورشليم وتساءلوا: أهذه هي المدينة التي تدعى كاملة الجمال وبهجة الأرض بأسرها؟"]]}, {"l": "Eze 27:36", "n": "", "vs": [[36, "يصفر تجار الشعوب دهشة عليك لما حل بك من مصير رهيب، ولن يبقى بعد منك أثر»."]]}, {"l": "Nah 3:19", "n": "", "vs": [[19, "لا جبر لكسرك، وجرحك مميت. وكل من يسمع بما جرى لك يصفق ابتهاجا لما أصابك، فمن لم يعان من شرك المتمادي؟"]]}, {"l": "Mat 27:39", "n": "", "vs": [[39, "وكان المارة يشتمونه، وهم يهزون رؤوسهم"]]}], "kwAr": "كل من يجتاز", "noteAr": ""}], "arS": [["هذه", ["H2063"]], [" هي ", []], ["المدينة", ["H5892"]], [" ", []], ["الطروب", ["H5947"]], [" التي ", []], ["سكنت", ["H3427"]], [" ", []], ["آمنة", ["H983"]], [" ", []], ["قائلة", ["H559"]], [" ", []], ["لنفسها", ["H3824"]], [": ", []], ["أنا", ["H589"]], [" ", []], ["وليس", ["H657"]], [" لي ", []], ["نظير", ["H5750"]], ["! ", []], ["كيف", ["H349"]], [" ", []], ["صارت", ["H1961"]], [" ", []], ["أطلالا", ["H8047"]], ["، ", []], ["ومأوى", ["H4769"]], [" ", []], ["للوحوش", ["H2416"]], [" البرية؟ ", []], ["كل", ["H3605"]], [" من ", []], ["يجتاز", ["H5674"]], [" ", []], ["بها", ["H5921"]], [" ", []], ["يصفر", ["H8319"]], [" دهشة ", []], ["ويهز", ["H5128"]], [" ", []], ["يده", ["H3027"]], ["».", []]]}, {"c": 3, "v": 1, "text": "ويل للمدينة الظالمة المتمردة الدنسة،", "groups": [{"kw": "her that is filthy", "raw": "or, gluttonous, Heb. craw, Lev_1:16", "note": "or, gluttonous, Heb. craw, Lev_1:16", "refs": [{"l": "Lev 1:16", "n": "", "vs": [[16, "وينزع حوصلته مع نثرياتها ويطرحهما إلى جانب المذبح الشرقي، حيث يجمع الرماد."]]}], "kwAr": "المتمردة الدنسة", "noteAr": "أو: «النهمة»؛ بالعبرية: «الحوصلة». انظر لا 1: 16"}, {"kw": "to the", "raw": "Isa_5:7, Isa_30:12, Isa_59:13; Jer_6:6, Jer_22:17; Eze_22:7, Eze_22:29; Amo_3:9, Amo_4:1; Mic_2:2; Zec_7:10; Mal_3:5", "note": "", "refs": [{"l": "Isa 5:7", "n": "", "vs": [[7, "لأن كرم الرب القدير هو بيت إسرائيل، ورجال يهوذا هم غرس بهجته. ولكن عندما انتظر حقا وجد سفك دماء، وعندما التمس عدلا رأى صراخا."]]}, {"l": "Isa 30:12", "n": "", "vs": [[12, "لذلك هكذا يقول قدوس إسرائيل: «لأنكم ازدريتم بهذه الكلمة واتكلتم على الجور والانحراف واعتمدتم عليهما،"]]}, {"l": "Isa 59:13", "n": "", "vs": [[13, "تمردنا وتنكرنا للرب. ارتددنا عن اتباع طرق إلهنا، تفوهنا بالظلم والعصيان افتراء، وبكلام زور من القلب."]]}, {"l": "Jer 6:6", "n": "", "vs": [[6, "لأن هذا ما يعلنه الرب القدير: «اقطعوا الشجر، وأقيموا مترسة حول أورشليم، إذ يجب أن تعاقب هذه المدينة، لأن داخلها مفعم بالظلم."]]}, {"l": "Jer 22:17", "n": "", "vs": [[17, "«أما أنت فعيناك وقلبك متهافتة على الربح الحرام، وعلى سفك الدم البريء، وعلى الظلم والابتزاز»."]]}, {"l": "Eze 22:7", "n": "", "vs": [[7, "فيك استخفوا بأب وأم وجاروا في وسطك على الغريب، واضطهدوا اليتيم والأرملة،"]]}, {"l": "Eze 22:29", "n": "", "vs": [[29, "أفرطوا في ظلم شعب الأرض واغتصبوا سالبين، واضطهدوا الفقير والمسكين، وظلموا الغريب جورا."]]}, {"l": "Amo 3:9", "n": "", "vs": [[9, "أذيعوا في حصون أشدود وفي حصون ديار مصر وقولوا: احتشدوا على جبال السامرة، واشهدوا ما في وسطها من جلبة، وانظروا إلى المظلومين في داخلها."]]}, {"l": "Amo 4:1", "n": "", "vs": [[1, "اسمعي هذه الكلمة يانساء باشان، اللواتي يقمن في جبل السامرة، ممن يظلمن المسكين ويسحقن الفقراء واللواتي يقلن لأزواجهن: هاتوا مسكرا لنشرب."]]}, {"l": "Mic 2:2", "n": "", "vs": [[2, "يشتهون حقولا ويغتصبونها، وبيوتا فيستولون عليها. يجورون على الرجل وعلى بيته والإنسان وميراثه."]]}, {"l": "Zec 7:10", "n": "", "vs": [[10, "ولا تجوروا على الأرملة واليتيم والغريب والمسكين، ولا يضمر أحدكم شرا في قلبه لأخيه."]]}, {"l": "Mal 3:5", "n": "", "vs": [[5, "وأقترب منكم لأكون شاهدا سريعا ضد السحرة والزناة والحالفين بالزور والمستغلين لأجرة العامل ومضطهدي الأرامل والأيتام، والذين يظلمون الغرباء ولا يخافونني"]]}], "kwAr": "للمدينة الظالمة", "noteAr": ""}], "arS": [["ويل", ["H1945"]], [" ", []], ["للمدينة", ["H5892"]], [" ", []], ["الظالمة", ["H3238"]], [" ", []], ["المتمردة", ["H4784"]], [" ", []], ["الدنسة", ["H1351"]], ["،", []]]}, {"c": 3, "v": 2, "text": "التي لا تصغي لصوت أحد، وتأبى التقويم، ولا تتكل على الرب، ولا تتقرب من إلهها.", "groups": [{"kw": "obeyed", "raw": "Deut. 28:15-68; Neh_9:26; Jer_7:23-28, Jer_22:21; Zec_7:11-14", "note": "", "refs": [{"l": "Deu 28:15-68", "n": "", "vs": [[15, "ولكن إن عصيتم صوت الرب إلهكم ولم تحرصوا على العمل بجميع وصاياه وفرائضه التي أنا آمركم اليوم بها، فإن جميع هذه اللعنات تحل بكم وتلازمكم."], [16, "تكونون ملعونين في المدينة وملعونين في الحقول."], [17, "وتكون سلالكم ومعاجنكم ملعونة."], [18, "وتحل اللعنة بأبنائكم وغلات أرضكم ونتاج بقركم ونعاجكم،"], [19, "وتكونون ملعونين في ذهابكم وإيابكم،"], [20, "ويصب الرب عليكم اللعنة والفوضى والفشل في كل ما تنتجه أيديكم، حتى تهلكوا وتفنوا سريعا لسوء أفعالكم، إذ تركتموني."], [21, "ويتفشى بينكم الوباء حتى يبيدكم عن الأرض التي أنتم ماضون إليها لامتلاكها،"], [22, "ويضربكم الرب بالسل والحمى والرعشة والالتهاب والجفاف واللفح والذبول، فتلازمكم حتى تفنوا."], [23, "وتصبح السماء التي فوقكم كالنحاس والأرض تحتكم كالحديد."], [24, "ويحول الرب مطر أرضكم إلى غبار وعواصف ترابية تنهمر عليكم من السماء حتى تهلكوا."], [25, "ويهزمكم الرب أمام أعدائكم فتقبلون عليهم في طريق واحدة وتولون الأدبار أمامهم متفرقين في سبع طرق، وتصبحون عبرة لجميع ممالك الأرض."], [26, "وتكون جثثكم طعاما لجميع طيور السماء ووحوش الأرض ولا يطردها أحد."], [27, "ويصيبكم الرب بداء قرحة مصر وبالبواسير والجرب والحكة، ولا تجدون لها علاجا."], [28, "ويبتليكم الرب بالجنون والعمى وارتباك الفكر،"], [29, "فتتحسسون طرقكم في الظهر كما يتحسس الأعمى طريقه في الظلام، وتبوء طرقكم بالإخفاق، ولا تكونون إلا مظلومين مغصوبين كل الأيام، وليس من منقذ."], [30, "يخطب أحدكم امرأة ولكن آخر يتزوجها ويضاجعها. تبني بيتا ولا تسكن فيه، وتغرس كرما ولا تجنيه."], [31, "يذبح ثورك أمام عينيك ولا تأكل منه، ويغتصب حمارك على مرأى منك ولا يرد إليك، ويستولي أعداؤك على ماشيتك وليس من منقذ."], [32, "يساق أولادك وبناتك إلى أمة أخرى وعيناك تراقبانهم طوال النهار، حتى تكلا، وما في يدك حيلة."], [33, "محصول أرضك وثمر تعبك يأكله شعب غريب عنك، ولا تكون سوى مظلوم مسحوق دائما."], [34, "ويصيبك الجنون من هول ما ترى."], [35, "ويبتليك الرب بقروح خبيثة تغطي الركبتين والساقين، حتى لا تجد لها شفاء من قمة الرأس إلى أخمص القدم."], [36, "ينفيكم الرب أنتم وملككم الذي تختارونه إلى أمة لا تعرفونها أنتم ولا آباؤكم، حيث تعبدون هناك آلهة أخرى من خشب وحجر،"], [37, "وتصبحون مثار دهشة وسخرية وعبرة في نظر جميع الشعوب التي ينفيكم الرب إليهم"], [38, "تبذرون كثيرا من البذار في الحقول، ولا تحصدون إلا القليل، لأن الجراد يلتهمه."], [39, "تكدحون في غرس كروم ومن خمرها لا تشربون، ومن ثمرها لا تجنون، لأن الدود ينخرها."], [40, "تكتظ أراضيكم بأشجار الزيتون، ولكن من زيتها لا تدهنون، لأن زيتونكم ينتثر على الأرض قبل نضجه."], [41, "تنجبون بنين وبنات ولا يكونون لكم، لأنهم يسبون."], [42, "تلتهم أسراب الجراد أشجاركم وغلات أرضكم."], [43, "يعظم شأن الغرباء المقيمين بينكم، ويتفاقم انحطاط شأنكم."], [44, "هم يقرضونكم وأنتم لا تقرضونهم، وهم يكونون رأسا وأنتم تكونون ذنبا،"], [45, "وتحل بكم هذه اللعنات وتلازمكم وتلاحقكم حتى تهلكوا، لأنكم لم تطيعوا صوت الرب إلهكم لتحفظوا وصاياه وفرائضه التي أمركم بها،"], [46, "فتكون فيكم وفي ذريتكم عبرة ونذيرا إلى الأبد."], [47, "ولأنكم لم تعبدوا الرب إلهكم بفرح وغبطة في زمن الازدهار والوفرة،"], [48, "فإنكم تصبحون عبيدا لأعدائكم الذين يرسلهم الرب عليكم في أحوال الجوع والعطش والعري والفاقة، ويضع نير حديد على أعناقكم حتى يهلككم."], [49, "ويجلب الرب عليكم من بعيد، من أقصى الأرض، أمة لا تفهمون لغتها، فتنقض عليكم كالنسر."], [50, "أمة يثير منظرها الرعب، لا تهاب الشيخ ولا ترأف بالطفل،"], [51, "فتستولي على نتاج بهائمكم، وتلتهم غلات أرضكم حتى تفنوا، ولا تبقي لكم قمحا ولا خمرا ولا زيتا ولا نتاج بقركم ونعاجكم حتى تهلككم."], [52, "وتحاصركم في جميع مدنكم حتى تتهدم أسواركم الشامخة الحصينة التي وثقتم بمناعتها في كل مدنكم. فتحاصركم في جميع مدنكم في كل أرضكم التي يهبها الرب إلهكم لكم."], [53, "فتأكلون في أثناء الحصار والضيقة التي يضايقكم بها عدوكم ثمار بطونكم، لحم أبنائكم وبناتكم الذين رزقكم بهم الرب إلهكم."], [54, "فيقسو قلب أكثركم رقة ورأفة على أخيه وامرأته التي في حضنه وسائر أبنائه الأحياء."], [55, "فلا يعطي أحدهم من لحم أبنائه، الذي يأكله، لأنه لم يبق لديه شيء سواه في الحصار والضيقة التي يضايقكم بها عدوكم في جميع مدنكم."], [56, "وكذلك فإن أكثر النساء رقة ورأفة، والتي لنعومتها وترفهها لا تجرؤ على لمس الأرض بباطن قدمها، تبخل على زوجها رجل حضنها وعلى ابنها وابنتها"], [57, "بمشيمتها الساقطة منها، وبأولادها الذين تلدهم، لأنها تنوي أن تأكلهم سرا في أثناء الحصار، في الضيقة التي يضايقكم بها عدوكم في كل مدنكم."], [58, "فإن لم تحرصوا على العمل بجميع كلمات هذه الشريعة المكتوبة في هذا الكتاب، لتهابوا اسم الرب إلهكم الجليل المرهوب،"], [59, "فإن الرب يجعل الضربات النازلة بكم وبذريتكم ضربات مخيفة وكوارث رهيبة دائمة وأمراضا خبيثة مزمنة،"], [60, "ويرسل عليكم كل أمراض مصر التي فزعتم منها فتلازمكم،"], [61, "ويسلط الرب عليكم أيضا كل داء وكل بلية لم ترد في كتاب الشريعة هذا، حتى تهلكوا."], [62, "فتصيرون قلة بعد أن كنتم في كثرة نجوم السماء، لأنكم لم تسمعوا صوت الرب إلهكم."], [63, "وكما سر الرب بكم فأحسن إليكم وكثركم، فإنه سيسر بأن يفنيكم ويهلككم فتنقرضون من الأرض التي أنتم ماضون إليها لامتلاكها."], [64, "ويشتتكم الرب بين جميع الأمم من أقصى الأرض إلى أقصاها، فتعبدون هناك آلهة أخرى من خشب أو حجر لم تعرفوها أنتم ولا آباؤكم،"], [65, "ولا تجدون بين تلك الأمم اطمئنانا ولا مقرا لقدم، بل يعطيكم الرب قلبا هلعا، وعيونا أوهنها الترقب، ونفوسا يائسة."], [66, "وتعيشون حياة مفعمة دائما بالتوتر، مليئة بالرعب ليلا ونهارا."], [67, "وتقولون في الصباح: يا ليته المساء، وفي المساء: يا ليته الصباح، من فرط ارتعاب قلوبكم وما تشهده عيونكم من هول."], [68, "ويردكم الرب إلى ديار مصر في سفن في طريق وعدكم ألا تعودوا ترونها، فتباعون هناك لأعدائكم عبيدا وإماء، وليس من يشتري»."]]}, {"l": "Neh 9:26", "n": "", "vs": [[26, "ومع ذلك ثاروا عليك وتمردوا وطرحوا شريعتك خلف ظهورهم، وقتلوا أنبياءك الذين حذروهم وأنذروهم ليرتدوا إليك، وارتكبوا الشرور الفواحش."]]}, {"l": "Jer 7:23-28", "n": "", "vs": [[23, "إنما أوصيتهم أن يطيعوا صوتي فأكون لهم إلها، ويكونون لي شعبا وأن يسلكوا في كل الطريق الذي أوصيتهم به، فينالوا خيرا."], [24, "إلا أنهم لم يطيعوا ولم يسمعوا، بل سلكوا بمقتضى مشورات قلوبهم الشريرة وعنادهم، وأداروا لي ظهورهم بدل وجوههم."], [25, "فمنذ أن خرج آباؤكم من مصر إلى هذا اليوم، ثابرت على إرسال جميع عبيدي الأنبياء لينذروهم كل يوم."], [26, "ومع ذلك لم يطيعوني أو يسمعوني، ولكنهم قسوا قلوبهم، فكانوا في تصرفهم أشر من آبائهم."], [27, "ولكن عندما تكلمهم بهذه العبارات فإنهم لن يسمعوا، وتدعوهم فلا يجيبونك."], [28, "فتقول لهم: هذه هي الأمة التي تعصى صوت الرب إلهها، ولا تقبل التأديب. لقد تلاشى الحق وانقطع عن أفواههم."]]}, {"l": "Jer 22:21", "n": "", "vs": [[21, "حذرتك في أثناء عزك فقلت: لن أصغي. أنت متمردة منذ صباك لا تسمعين لصوتي."]]}, {"l": "Zec 7:11-14", "n": "", "vs": [[11, "ولكنهم أبوا أن يصغوا، واعتصموا بعنادهم غير عابئين، وأصموا آذانهم لئلا يسمعوا."], [12, "وقسوا قلوبهم كالصوان لئلا يسمعوا الشريعة التي أرسلها الرب القدير بروحه على لسان أنبيائه السابقين. فانصب غضب عظيم من لدن الرب القدير."], [13, "وكما ناديت فلم يسمعوا فإني أنا أيضا لا أسمع، يقول الرب القدير."], [14, "فبددتهم بالزوبعة بين الأمم التي لم يعرفوها من قبل، فصارت الأرض التي نفوا منها خرابا لا يجتازها ذاهب أو راجع، وأضحت الأرض المبهجة قفرا»."]]}], "kwAr": "لا تصغي", "noteAr": ""}, {"kw": "she received", "raw": "Isa_1:5; Jer_2:30, Jer_5:3; Eze_24:13", "note": "", "refs": [{"l": "Isa 1:5", "n": "", "vs": [[5, "على أي موضع أضربكم بعد؟ لماذا تواظبون على التمرد؟ إن الرأس بجملته سقيم والقلب بكامله مريض."]]}, {"l": "Jer 2:30", "n": "", "vs": [[30, "عبثا عاقبت بنيكم، فهم أبوا التقويم وافترست سيوفكم أنبياءكم كأسد كاسر."]]}, {"l": "Jer 5:3", "n": "", "vs": [[3, "أيها الرب، أليست عيناك تطلبان الحق؟ لقد عاقبتهم ولكنهم لم يتوجعوا. أهلكتهم ولكنهم أبوا التقويم. صلبوا وجوههم أكثر من الصخر، ورفضوا التوبة."]]}, {"l": "Eze 24:13", "n": "", "vs": [[13, "في قذارتك رذيلة لأني سعيت لتطهيرك، فلم تطهري ولن تطهري من نجاستك حتى أصب عليك غضبي."]]}], "kwAr": "وتأبى", "noteAr": ""}, {"kw": "correction", "raw": "or, instruction, Psa_50:17; Pro_1:7, Pro_5:12; Jer_32:33, Jer_35:13, Jer_35:17; Joh_3:18, Joh_3:19", "note": "or, instruction, Psa_50:17; Pro_1:7, Pro_5:12; Jer_32:33, Jer_35:13, Jer_35:17; Joh_3:18, Joh_3:19", "refs": [{"l": "Psa 50:17", "n": "", "vs": [[17, "وأنت تمقت التأديب ولا تكترث لكلامي؟"]]}, {"l": "Pro 1:7", "n": "", "vs": [[7, "فإن مخافة الرب هي رأس المعرفة، أما الحمقى فيستهينون بالحكمة والتأديب."]]}, {"l": "Pro 5:12", "n": "", "vs": [[12, "وتقول: «كيف مقت التأديب، واستخف قلبي بالتوبيخ،"]]}, {"l": "Jer 32:33", "n": "", "vs": [[33, "وأولوني ظهورهم وليس وجوههم. ومع أني علمتهم منذ البدء مرة تلو الأخرى، إلا أنهم لم يسمعوا ليقبلوا تأديبي."]]}, {"l": "Jer 35:13", "n": "", "vs": [[13, "«هذا ما يعلنه الرب القدير إله إسر ائيل: انطلق وقل لرجال يهوذا ولأهل أورشليم: ألا تقبلون تأديبا فتسمعوا كلامي؟"]]}, {"l": "Jer 35:17", "n": "", "vs": [[17, "لذلك هكذا يقول الرب القدير إله إسرائيل: سأوقع على شعب يهوذا وعلى جميع أهل أورشليم كل ما قضيت به عليهم من عقاب، لأني أنذرتهم فلم يسمعوا، ودعوتهم فلم يجيبوا»."]]}, {"l": "Joh 3:18", "n": "", "vs": [[18, "فالذي يؤمن به لا يدان، أما الذي لا يؤمن به فقد صدر عليه حكم الدينونة، لأنه لم يؤمن باسم ابن الله الوحيد."]]}, {"l": "Joh 3:19", "n": "", "vs": [[19, "وهذا هو الحكم: إن النور قد جاء إلى العالم، ولكن الناس أحبوا الظلمة أكثر من النور، لأن أعمالهم كانت شريرة."]]}], "kwAr": "التقويم", "noteAr": "أو: «تأديب». انظر مز 50: 17؛ أم 1: 7؛ 5: 12؛ إر 32: 33؛ 35: 13، 17؛ يو 3: 18، 19"}, {"kw": "she trusted", "raw": "Psa_78:22; Isa_30:1-3, Isa_31:1; Jer_17:5, Jer_17:6", "note": "", "refs": [{"l": "Psa 78:22", "n": "", "vs": [[22, "لأنهم لم يؤمنوا بالله ولم يتكلوا على خلاصه."]]}, {"l": "Isa 30:1-3", "n": "", "vs": [[1, "يقول الرب: «ويل للبنين المتمردين الذين ينصاعون لمشورة لم تصدر عني، ويبرمون عهدا ليس من روحي، ليضيفوا خطيئة إلى خطيئة."], [2, "الذين يتأهبون للانحدار إلى مصر من غير أن يلجأوا إلى مشورتي، ليلوذوا بحمى فرعون ويعتصموا بظل مصر،"], [3, "لذلك يصير لكم حصن فرعون عارا، والاحتماء بظل مصر خزيا،"]]}, {"l": "Isa 31:1", "n": "", "vs": [[1, "ويل للمنحدرين إلى مصر طلبا للعون، المتوكلين على الخيل، الواثقين بكثرة المركبات وببأس الفرسان، من غير أن يلتفتوا إلى قدوس إسرائيل، أو يطلبوا مشورة الرب."]]}, {"l": "Jer 17:5", "n": "", "vs": [[5, "وهذا ما يقوله الرب: «ليكن ملعونا كل من يتوكل على بشر، ويتخذ من الناس ذراع قوة له، ويحول قلبه عن الرب."]]}, {"l": "Jer 17:6", "n": "", "vs": [[6, "فيكون كالأثل في البادية، لا يرى الفلاح عندما يقبل. يقيم في حر الصحراء الشديد، في الأرض المهجورة من الناس لملوحتها."]]}], "kwAr": "لا تتكل", "noteAr": ""}, {"kw": "she drew", "raw": "Psa_10:4; Isa_29:13, Isa_43:22; Heb_10:22", "note": "", "refs": [{"l": "Psa 10:4", "n": "", "vs": [[4, "في تكبره وتشامخه لا يلتمس الله ، ولا مكان لله في أفكاره كلها،"]]}, {"l": "Isa 29:13", "n": "", "vs": [[13, "لذلك يقول الرب: لأن هذا الشعب يقترب مني بفمه ويكرمني بشفتيه، بينما قلبه بعيد عنى. وما مخافتهم مني سوى تقليد تلقنوه من الناس."]]}, {"l": "Isa 43:22", "n": "", "vs": [[22, "ولكنك لم تلتمسني يايعقوب، بل سئمت مني ياإسرائيل."]]}, {"l": "Heb 10:22", "n": "", "vs": [[22, "فلنتقدم إلى حضرة الله بقلب صادق وبثقة الإيمان الكاملة، بعدما طهر رش الدم قلوبنا من كل شعور بالذنب، وغسل الماء النقي أجسادنا."]]}], "kwAr": "ولا تتقرب", "noteAr": ""}], "arS": [["التي ", []], ["لا", ["H3808"]], [" ", []], ["تصغي", ["H8085"]], [" ", []], ["لصوت", ["H6963"]], [" أحد، ", []], ["وتأبى", ["H3947"]], [" ", []], ["التقويم", ["H4148"]], ["، ", []], ["ولا", ["H3808"]], [" ", []], ["تتكل", ["H982"]], [" على ", []], ["الرب", ["H3068"]], ["، ", []], ["ولا", ["H3808"]], [" ", []], ["تتقرب", ["H7126"]], [" من ", []], ["إلهها", ["H430"]], [".", []]]}, {"c": 3, "v": 3, "text": "رؤساؤها في داخلها أسود زائرة، وقضاتها كذئاب المساء الجائعة التي لا تبقي شيئا من فرائسها إلى الصباح.", "groups": [{"kw": "princes", "raw": "Job_4:8-11; Psa_10:8-10; Pro_28:15; Isa_1:23; Jer_22:17; Eze_22:6, Eze_22:25-27; Mic_3:1-4, Mic_3:9-11", "note": "", "refs": [{"l": "Job 4:8-11", "n": "", "vs": [[8, "بل كما شاهدت فإن الحارثين إثما، والزارعين شقاوة، هم يحصدونهما،"], [9, "وبنسمة الله يفنون وبعاصفة غضبه يهلكون."], [10, "قد يزأر الأسد ويزمجر الليث، ولكن أنياب الأشبال تهشمت."], [11, "يهلك الليث لتعذر وجود الفريسة، وتتشتت أشبال اللبؤة."]]}, {"l": "Psa 10:8-10", "n": "", "vs": [[8, "يتربص في كمائن الديار ليقتل البريء. عيناه تترصدان المسكين."], [9, "يكمن في الخفاء، كأسد في عرينه ليخطف المسكين ويجره في شبكته."], [10, "يسحق المساكين ويدوسهم حين يسقطون بين مخالبه القوية."]]}, {"l": "Pro 28:15", "n": "", "vs": [[15, "الحاكم العاتي المتسلط على الضعفاء، مثل أسد زائر أو دب ثائر."]]}, {"l": "Isa 1:23", "n": "", "vs": [[23, "أصبح رؤساؤك عصاة وشركاء لصوص، يولعون بالرشوة ويسعون وراء الهبات، لا يدافعون عن اليتيم، ولا ترفع إليهم دعوى الأرملة»."]]}, {"l": "Jer 22:17", "n": "", "vs": [[17, "«أما أنت فعيناك وقلبك متهافتة على الربح الحرام، وعلى سفك الدم البريء، وعلى الظلم والابتزاز»."]]}, {"l": "Eze 22:6", "n": "", "vs": [[6, "هوذا كل واحد من رؤساء إسرائيل ممن كانوا فيك انهمك في سفك الدماء على قدر طاقته."]]}, {"l": "Eze 22:25-27", "n": "", "vs": [[25, "تواطأ أنبياؤها الكذبة فيها مثل أسد مزمجر يمزق الفريسة. التهموا نفوسا، واستولوا على نفائس الناس وكنوزهم، وكثروا أراملها فيها."], [26, "خالف كهنتها شريعتي ونجسوا مقادسي. لم يميزوا بين المقدس والرجس، ولم يعلموا الفرق بين الطاهر والنجس، وحجبوا عيونهم عن أيام سبوتي فصرت مدنسا في وسطهم."], [27, "رؤساؤها فيها كذئاب خاطفة تمزق فرائسها إذ يسفكون دماء الناس في سبيل الربح الحرام."]]}, {"l": "Mic 3:1-4", "n": "", "vs": [[1, "وقلت اسمعوا يارؤساء يعقوب وياقضاة شعب إسرائيل: ألا ينبغي لكم أن تعرفوا الحق؟"], [2, "أنتم يامن تبغضون الخير وتحبون الشر، وتسلخون جلود شعبي وتجردون لحومهم عن عظامهم."], [3, "الذين تأكلون لحوم شعبي، وتسلخون جلودهم عنهم وتهشمون عظامهم، وتقطعونهم كما يقطع اللحم في القدر، أو كاللحم المعد للمقلى."], [4, "ثم حين تستغيثون بالرب لا يستجيب ويحجب وجهه عنكم في ذلك الوقت بسبب ما ارتكبتموه من أعمال شريرة."]]}, {"l": "Mic 3:9-11", "n": "", "vs": [[9, "استمعوا هذا يارؤساء بيت يعقوب وقضاة شعب إسرائيل الذين يكرهون العدل ويحرفون الحق."], [10, "الذين يبنون صهيون بالدم وأورشليم بالظلم."], [11, "إذ يحكم رؤساؤها بالرشوة، وكهنتها يعلمون بالأجرة ويتعاطى أنبياؤها العرافة لقاء المال، ومع ذلك يدعون الاتكال على الله قائلين: «أليس الرب في وسطنا؟ لذلك لن يصيبنا مكروه»."]]}], "kwAr": "رؤساؤها", "noteAr": ""}, {"kw": "evening", "raw": "Jer_5:6; Hab_1:8", "note": "", "refs": [{"l": "Jer 5:6", "n": "", "vs": [[6, "لذلك ينقض عليهم أسد من الغاب ويقتلهم، ويفترسهم ذئب من الصحراء، ويكمن النمر حول مدنهم، فيمزق إربا كل من يخرج منهم، لأن آثامهم كثيرة، وارتداداتهم متعاظمة."]]}, {"l": "Hab 1:8", "n": "", "vs": [[8, "خيولها أسرع من النمور، وأكثر ضراوة من ذئاب المساء. فرسانها يندفعون بكبرياء قادمين من أماكن بعيدة، متسابقين كالنسر المسرع للانقضاض على فريسته."]]}], "kwAr": "كذئاب المساء", "noteAr": ""}], "arS": [["رؤساؤها", ["H8269"]], [" في ", []], ["داخلها", ["H7130"]], [" ", []], ["أسود", ["H738"]], [" ", []], ["زائرة", ["H7580"]], ["، ", []], ["وقضاتها", ["H8199"]], [" ", []], ["كذئاب", ["H2061"]], [" ", []], ["المساء", ["H6153"]], [" الجائعة التي ", []], ["لا", ["H3808"]], [" ", []], ["تبقي", ["H1633"]], [" شيئا من فرائسها إلى ", []], ["الصباح", ["H1242"]], [".", []]]}, {"c": 3, "v": 4, "text": "أنبياؤها مغرورون وخونة، وكهنتها يدنسون المقدس ويتعدون على الشريعة.", "groups": [{"kw": "light", "raw": "Isa_9:15, Isa_56:10-12; Jer_5:31, Jer_6:13, Jer_6:14, Jer_8:10, Jer_14:13-15, Jer_23:9-17, Jer_23:25-27; Jer_23:32, Jer_27:14, Jer_27:15; Lam_2:14; Eze_13:3-16; Hos_9:7; Mic_2:11, Mic_3:5, Mic_3:6; Mat_7:15; 2Co_11:13; 2Pe_2:1-3; 1Jo_4:1; Rev_19:20", "note": "", "refs": [{"l": "Isa 9:15", "n": "", "vs": [[15, "إن الشيخ والوجيه هو الرأس، والنبي الذي يلقن الكذب هو الذنب"]]}, {"l": "Isa 56:10-12", "n": "", "vs": [[10, "فإن رقباءهم عمي، وكلهم جهال، وكلاب بكم عاجزون عن النباح، حالمون راقدون مولعون بالنوم."], [11, "هم كلاب نهمة لا تعرف الشبع، ورعاة أيضا مجردون من الفهم، كل مال إلى طريقه طمعا في الربح،"], [12, "قائلين: تعالوا نأتي بالخمر، ونشرب مسكرا حتى الثمالة، فالغد يكون مماثلا لهذا اليوم، بل أعظم منه."]]}, {"l": "Jer 5:31", "n": "", "vs": [[31, "فالأنبياء يتنبأون زورا، والكهنة يتصرفون بمقتضى أحكامهم، وشعبي أحب مثل هذا. ولكن ماذا تصنعون في نهاية المطاف؟»"]]}, {"l": "Jer 6:13", "n": "", "vs": [[13, "لأنهم جميعا، صغارهم وكبارهم، مولعون بالربح الحرام. حتى النبي والكاهن يرتكبان الزور في أعمالهما."]]}, {"l": "Jer 6:14", "n": "", "vs": [[14, "يعالجون جراح شعبي باستخفاف قائلين: سلام، سلام. في حين لا يوجد سلام."]]}, {"l": "Jer 8:10", "n": "", "vs": [[10, "لذلك أعطي نساءهم لآخرين وحقولهم للوارثين القاهرين، لأنهم جميعا من صغيرهم إلى كبيرهم مولعون بالربح. حتى النبي والكاهن يرتكبان الزور في أعمالهما،"]]}, {"l": "Jer 14:13-15", "n": "", "vs": [[13, "ثم قلت: «آه أيها السيد الرب، ها الأنبياء الكذبة يقولون لهم: لن تتعرضوا للسيف ولا للجوع، بل أنعم عليكم بسلام محقق في هذا الموضع»."], [14, "وقال لي الرب: «إن الأنبياء يتنبأون زورا باسمي وأنا لم أرسلهم ولم آمرهم، ولم أكلمهم، إنما هم يتنبأون لكم برؤيا كاذبة وعرافة باطلة مستوحاة من ضلال قلوبهم."], [15, "لذلك هكذا يقول الرب عن هؤلاء الأنبياء المتنبئين باسمي: مع أني لم أرسلهم فإنهم يقولون: لن تبتلى هذه الأرض بسيف ولا مجاعة، لهذا فإن هولاء الأنبياء يفنون بالسيف والمجاعة."]]}, {"l": "Jer 23:9-17", "n": "", "vs": [[9, "ثم تكلم إرميا عن الأنبياء الكذبة فقال: «إن قلبي منكسر في داخلي، وجميع عظامي ترتجف، فأنا بتأثير الرب وبفعل كلامه المقدس كرجل سكران غلبت عليه الخمر"], [10, "لأن الأرض قد اكتظت بالفاسقين، وناحت من عاقبة لعنة الله، فجفت مراعي الحقول لأن مساعيهم باتت شريرة، وجبروتهم مسخر للباطل»."], [11, "ويقول الرب: «النبي والكاهن كافران، وفي بيتي وجدت شرهما."], [12, "لذلك يضحي طريقهما مزالق لهما، تفضي بهما إلى الظلمات التي يطردون إليها، ويهويان فيها لأني أجلب عليهما شرا في سنة عقابهما»."], [13, "في أوساط أنبيا ء السامرة شهدت أمورا كريهة، إذ تنبأوا باسم البعل، وأضلوا شعبي إسرائيل."], [14, "وفي أوساط أنبياء أورشليم رأيت أمورا مهولة: يرتكبون الفسق، ويسلكون في الأكاذيب، يشددون أيدي فاعلي الإثم لئلا يتوب أحد عن شره. صاروا جميعا كسكان سدوم وأصبح أهلها كأهل عمورة."], [15, "لذلك هذا ما يقوله الرب القدير عن الأنبياء: «ها أنا أطعمهم أفسنتينا وأسقيهم ماء مسموما، لأنه من أنبياء أورشليم شاع الكفر في كل أرجاء الأرض»."], [16, "«لا تسمعوا لأقوال الأنبياء الذين يتنبأون لكم ويخدعونكم بالأوهام، لأنهم ينطقون برؤى مخيلاتهم، ولا يتكلمون بما أوحى به فمي."], [17, "قائلين بإصرار لمن يحتقرونني: قد أعلن الرب أن السلام يسودكم ويرددون لكل من يجري وراء أهواء قلبه: لن يصيبكم ضر."]]}, {"l": "Jer 23:25-27", "n": "", "vs": [[25, "قد سمعت ما نطق به المتنبئون باسمي زورا قائلين: قد حلمت، قد حلمت."], [26, "إلى متى يظل هذا الخداع مكنونا في قلوب المتنبئين زورا؟ إنهم حقا أنبياء خداع، يتنبأون بأوهام قلوبهم."], [27, "فينسون شعبي اسمي بما يقصه كل واحد منهم على صاحبه من أحلامه، كما نسي آباؤهم اسمي لأجل وثن البعل."]]}, {"l": "Jer 23:32", "n": "", "vs": [[32, "ها أنا أقاوم المتنبئين بأحلام كاذبة ويقصونها مضلين شعبي بأكاذيبهم واستخفافهم، مع أني لم أرسلهم ولم أكلفهم بشيء. ولا جدوى منهم لهذا الشعب."]]}, {"l": "Jer 27:14", "n": "", "vs": [[14, "لا تستمعوا لكلام الأنبياء الكذبة الذين يقولون لكم: لا تستعبدوا لملك بابل لأنهم يتنبأون لكم كذبا،"]]}, {"l": "Jer 27:15", "n": "", "vs": [[15, "فأنا لم أرسلهم، يقول الرب، إنما هم يتنبأون باسمي كذبا لأجلكم فتطردون أنتم وأنبياؤكم المتنبئون لكم»."]]}, {"l": "Lam 2:14", "n": "", "vs": [[14, "رأى لك أنبياؤك رؤى باطلة خادعة. لم يفضحوا إثمك ليردوا سبيك. إنما رأوا لك وحيا كاذبا مضلا."]]}, {"l": "Eze 13:3-16", "n": "", "vs": [[3, "ويل للأنبياء الحمقى الضالين وراء أرواحهم من غير أن يروا شيئا."], [4, "أنبياؤك ياإسرائيل هم كالثعالب في الخرائب."], [5, "لم تبرزوا إلى الثغرات، ولم تشيدوا جدارا حول بيت إسرائيل لتصمدوا في القتال في يوم الرب،"], [6, "إنما رؤياهم باطلة، وعرافتهم كاذبة. يقولون: يقول الرب، والرب لم يرسلهم، ومع ذلك يطمعون في تحقيق كلمتهم."], [7, "ألم تروا رؤيا باطلة، وتنطقوا بعرافة كاذبة قائلين: يقول الرب، وأنا لم أتكلم؟"], [8, "لذلك يعلن الرب: لأنكم تكلمتم باطلا وادعيتم رؤيا كاذبة، فها أنا أنقلب عليكم يقول السيد الرب."], [9, "فتكون يدي على الأنبياء ذوي الرؤيا الباطلة والعرافة الكاذبة، فلا يكون لهم مقام في جماعة شعبي، ولا تدون أسماؤهم في كتاب بيت إسرائيل، ولا يدخلون أرض إسرائيل، فتدركون أني أنا السيد الرب."], [10, "لأنهم حقا أضلوا شعبي قائلين: سيكون لكم سلام مع أنه ليس هناك سلام، فكان شعبي يبني حائطا وهم يطلونه بماء الكلس."], [11, "قل للطالين بماء الكلس: إن الحائط يتداعى، إذ ينهمر مطر جارف. وأنتن ياحجارة البر د تساقطن، ولتعصف به ريح جائحة."], [12, "فلا يلبث السور أن ينهار أفلا تسألون آنئذ: أين الطين الذي طينتم به؟"], [13, "لذلك، هذا ما يعلنه السيد الرب: ها أنا أجعل ريحا عاتية تخترق السور بفعل حنقي، ومطرا جارفا ينهمر في خضم غضبي، وحجارة برد تتساقط في أثناء سخطي لكي تهلك،"], [14, "فأهدم السور الذي طليتموه بماء الكلس وأسويه بالأرض فيتعرى أساسه وتتداعى المدينة وتفنون جميعا في وسطها فتدركون أني أنا الرب."], [15, "فأنفث غضبي بالسور وبمن يطلونه بماء الكلس وأقول لكم: قد تلاشى السور والذين يطلونه."], [16, "الذين هم أنبياء إسرائيل الأدعياء، المتنبئون لإسرائيل، الذين يرون لها رؤى سلام، مع أنه لا سلام هناك، يقول السيد الرب."]]}, {"l": "Hos 9:7", "n": "", "vs": [[7, "لقد أزفت أيام العقاب وحان يوم الحساب، فليعلم إسرائيل هذا. لكثرة إثمك وفرط حقدك حسب النبي أحمق، ورجل الروح مجنونا."]]}, {"l": "Mic 2:11", "n": "", "vs": [[11, "إن جال رجل يتنبأ بينكم بالكذب وباللغو الباطل قائلا: إنني أتنبأ لكم بالخمر الوفير والمسكر، فإنه يصبح نبي هذا الشعب."]]}, {"l": "Mic 3:5", "n": "", "vs": [[5, "وهذا ما يقوله الرب بشأن الأنبياء الذين يضلون شعبه، الذين ينادون قائلين: «سلام» لمن يعطيهم طعاما، ويعلنون الحرب على من لا يلقم أفواههم."]]}, {"l": "Mic 3:6", "n": "", "vs": [[6, "لذلك يطغى عليكم ليل خال من الرؤيا، وظلام من غير عرافة، وتغرب الشمس عن الأنبياء ويظلم عليهم النهار."]]}, {"l": "Mat 7:15", "n": "", "vs": [[15, "احذروا الأنبياء الدجالين الذين يأتون إليكم لابسين ثياب الحملان، ولكنهم من الداخل ذئاب خاطفة!"]]}, {"l": "2Co 11:13", "n": "", "vs": [[13, "فإن أمثال هؤلاء هم رسل دجالون، عمال ماكرون، يظهرون أنفسهم بمظهر رسل المسيح."]]}, {"l": "2Pe 2:1-3", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."], [2, "وكثيرون سيسيرون وراءهم في طرق الإباحية. وبسببهم توجه الإهانة إلى طريق الحق."], [3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "1Jo 4:1", "n": "", "vs": [[1, "أيها الأحباء، لا تصدقوا كل روح، بل امتحنوا الأرواح لتعرفوا ما إذا كانت من عند الله أم لا، لأن عددا كبيرا من الأنبياء الدجالين قد انتشر في العالم."]]}, {"l": "Rev 19:20", "n": "", "vs": [[20, "فقبض على الوحش وعلى النبي الدجال الذي قام بالمعجزات في حضور الوحش وأضل بها الذين قبلوا علامة الوحش، وسجدوا لتمثاله. وطرح كلاهما حيا في بحيرة النار والكبريت المتقدة،"]]}], "kwAr": "مغرورون", "noteAr": ""}, {"kw": "her priests", "raw": "1Sa_2:12-17, 1Sa_2:22; Eze_22:26, Eze_44:7, Eze_44:8; Hos_4:6-8; Mal_2:8", "note": "", "refs": [{"l": "1Sa 2:12-17", "n": "", "vs": [[12, "أما ابنا عالي فكانا متورطين في الشر لا يعرفان الرب"], [13, "ولا حق الكهنة المتوجب على الشعب. فكان كلما قدم رجل ذبيحة يأتي غلام الكاهن عند طبخ اللحم حاملا بيده خطافا ذا ثلاث شعب."], [14, "فيغرزه في اللحم الذي في المرحضة أو المرجل أو المقلى أو القدر، ويأخذ الكاهن كل ما يعلق بشعب الخطاف. هكذا كانا يعاملان جميع الإسرائيليين القادمين إلى شيلوه."], [15, "كذلك كان خادم الكاهن يأتي إلى ذابح القربان ويقول له قبل إحراق الشحم: «أعط لحما للكاهن حتى يشوى، فإنه لا يقبل منك لحما مطبوخا بل نيئا»."], [16, "فيجيبه الرجل: «ليحرقوا أولا شحم الذبيحة، ثم خذ ما تشتهيه نفسك». فيقول الخادم: «لا، بل أعطني الآن اللحم وإلا آخذه بالرغم عنك»."], [17, "فعظمت خطيئة أبناء عالي أمام الرب، لأن الشعب استهان بذبيحة الرب من جراء تصرفاتهما."]]}, {"l": "1Sa 2:22", "n": "", "vs": [[22, "وطعن عالي في السن. وبلغه ما ارتكبه بنوه من مساويء بحق جميع الإسرائيليين، وأنهم كانوا يضاجعون النساء المجتمعات عند مدخل خيمة الاجتماع."]]}, {"l": "Eze 22:26", "n": "", "vs": [[26, "خالف كهنتها شريعتي ونجسوا مقادسي. لم يميزوا بين المقدس والرجس، ولم يعلموا الفرق بين الطاهر والنجس، وحجبوا عيونهم عن أيام سبوتي فصرت مدنسا في وسطهم."]]}, {"l": "Eze 44:7", "n": "", "vs": [[7, "إذ أدخلتم الغرباء غير المختوني القلوب واللحم إلى مقدسي، فدنستموه حين قربتم طعامي من شحم ودم، فنقضتم عهدي، فضلا عن كل رجاساتكم."]]}, {"l": "Eze 44:8", "n": "", "vs": [[8, "ولم تتولوا بأنفسكم حراسة مقدساتي، بل عهدتم بها إلى غرباء بدلا عنكم ليحرسوا مقدسي."]]}, {"l": "Hos 4:6-8", "n": "", "vs": [[6, "قد هلك شعبي لافتقاره إلى المعرفة، ولأنك رفضت المعرفة فأنا أرفضك فلا تكون لي كاهنا، أنت تجاهلت شريعتي لذلك أنا أنسى أبناءك."], [7, "وبقدر ما تكاثروا تفاقمت خطيئتهم، لذلك أحول مجدهم إلى عار."], [8, "يأكلون من ذبائح خطيئة شعبي ويفرحون لتماديهم في الإثم ليكثر نصيبهم منها."]]}, {"l": "Mal 2:8", "n": "", "vs": [[8, "ولكنكم انحرفتم عن الطريق المستقيم، وأعثرتم بتعاليمكم كثيرين، ونقضتم عهدي مع النسل الكهنوتي، يقول الرب القدير."]]}], "kwAr": "وكهنتها", "noteAr": ""}], "arS": [["أنبياؤها", ["H5030"]], [" ", []], ["مغرورون", ["H6348"]], [" ", []], ["وخونة", ["H900"]], ["، ", []], ["وكهنتها", ["H3548"]], [" ", []], ["يدنسون", ["H2490"]], [" ", []], ["المقدس", ["H6944"]], [" ", []], ["ويتعدون", ["H2554"]], [" على ", []], ["الشريعة", ["H8451"]], [".", []]]}, {"c": 3, "v": 5, "text": "ولكن الرب ما برح صديقا في وسطها، لا يرتكب خطأ، ويبدي في كل صباح عدله وفي كل فجر حقه. لا يخفق قط؛ أما الأثيم فلا يعرف ما هو الخزي.", "groups": [{"kw": "just", "raw": "Deu_32:4; Psa_99:3, Psa_99:4, Psa_145:17; Ecc_3:16, Ecc_3:17; Isa_45:21; Hab_1:3; Zec_9:9; Rom_3:26; 1Pe_1:17", "note": "", "refs": [{"l": "Deu 32:4", "n": "", "vs": [[4, "هو الصخر، وصنائعه كلها كاملة، سبله جميعها عدل. هو إله أمانة لا يرتكب جورا، صديق وعادل هو."]]}, {"l": "Psa 99:3", "n": "", "vs": [[3, "يحمدون اسمك العظيم المرهوب لأنه قدوس!"]]}, {"l": "Psa 99:4", "n": "", "vs": [[4, "قوة الملك في حب الحق. وأنت يارب ثبت الإنصاف وأجريت الحق والعدل في إسرائيل."]]}, {"l": "Psa 145:17", "n": "", "vs": [[17, "الرب عادل في جميع طرقه، ورحيم في كل أعماله."]]}, {"l": "Ecc 3:16", "n": "", "vs": [[16, "ورأيت أيضا تحت الشمس: الجور في موضع العدل، والظلم في موضع الحق."]]}, {"l": "Ecc 3:17", "n": "", "vs": [[17, "فقلت في نفسي: إن الله سيحكم على الصديق وعلى الشرير، لأن لكل عمل ولكل أمر وقتا هناك."]]}, {"l": "Isa 45:21", "n": "", "vs": [[21, "أعلنوا، واعرضوا دعواكم. ليتشاوروا معا. من أنبأ بهذا منذ القدم، ومن أخبر به من زمن بعيد؟ ألست أنا الرب ولا إله غيري؟ بار ومخلص، وليس هناك آخر."]]}, {"l": "Hab 1:3", "n": "", "vs": [[3, "لماذا تريني الإثم، وتتحمل رؤية الظلم؟ أينما تلفت أشهد أمامي جورا واغتصابا، ويثور حولي خصام ونزاع."]]}, {"l": "Zec 9:9", "n": "", "vs": [[9, "»ابتهجي جدا ياابنة صهيون واهتفي ياابنة أورشليم، لأن هوذا ملكك مقبل إليك. هو عادل ظافر، ولكنه وديع راكب على أتان، على جحش ابن أتان."]]}, {"l": "Rom 3:26", "n": "", "vs": [[26, "ليظهر بر الله إذ تغاضى، بإمهاله الإلهي، عن الخطايا التي حدثت في الماضي، ويظهر أيضا بره في الزمن الحاضر: فيتبين أنه بار وأنه يبرر من له الإيمان بيسوع."]]}, {"l": "1Pe 1:17", "n": "", "vs": [[17, "وما دمتم تعترفون بالله أبا لكم، وهو يحكم على كل إنسان حسب أعماله دون انحياز، فاسلكوا في مخافته مدة إقامتكم المؤقتة على الأرض."]]}], "kwAr": "صديقا", "noteAr": ""}, {"kw": "is in", "raw": "Zep_3:15, Zep_3:17; Deu_23:14; Isa_12:6; Eze_48:35; Mic_3:11; Zec_2:5", "note": "", "refs": [{"l": "Zep 3:15", "n": "", "vs": [[15, "لأن الرب قد رفع عنك حكم قضائه ورد عنك أعداءك. إن الرب ملك إسرائيل هو في وسطك، فلا تخشي شرا في ما بعد."]]}, {"l": "Zep 3:17", "n": "", "vs": [[17, "فالرب إلهك في وسطك، جبار يخلص. يسر فرحا بك، ويجدد بمحبته حياتك، ويبتهج بك مترنما."]]}, {"l": "Deu 23:14", "n": "", "vs": [[14, "لأن الرب إلهكم سائر في وسط معسكركم لينقذكم ويظفركم بأعدائكم. فليكن معسكركم مقدسا لئلا يشهد فيه أقذارا فيتحول عنكم."]]}, {"l": "Isa 12:6", "n": "", "vs": [[6, "اهتفوا وتغنوا ياأهل صهيون، لأن قدوس إسرائيل عظيم بينكم»."]]}, {"l": "Eze 48:35", "n": "", "vs": [[35, "أما محيط المدينة فهو ثمانية عشر ألف ذراع (نحو تسعة كيلومترات)، ويكون اسم المدينة من ذلك اليوم «يهوه شمة» ومعناه: «الرب هناك»."]]}, {"l": "Mic 3:11", "n": "", "vs": [[11, "إذ يحكم رؤساؤها بالرشوة، وكهنتها يعلمون بالأجرة ويتعاطى أنبياؤها العرافة لقاء المال، ومع ذلك يدعون الاتكال على الله قائلين: «أليس الرب في وسطنا؟ لذلك لن يصيبنا مكروه»."]]}, {"l": "Zec 2:5", "n": "", "vs": [[5, "لأني سأكون لها سورا محيطا من نار، يقول الرب، ومجدا في داخلها»."]]}], "kwAr": "في وسطها", "noteAr": ""}, {"kw": "he will", "raw": "Gen_18:25; Job_8:3, Job_34:10,Job_34:17-19", "note": "", "refs": [{"l": "Gen 18:25", "n": "", "vs": [[25, "تنزهت عن أن تهلك البار مع الأثيم، فيكون البار كالأثيم؛ حاشا لك. أديان الأرض كلها لا يجري عدلا؟»"]]}, {"l": "Job 8:3", "n": "", "vs": [[3, "أيحرف الله القضاء، أم يعكس القدير ما هو حق؟"]]}, {"l": "Job 34:10", "n": "", "vs": [[10, "لذلك أصغوا إلي ياذوي الفهم: حاشا لله أن يرتكب شرا أو للقدير أن يقترف خطأ،"]]}, {"l": "Job 34:17-19", "n": "", "vs": [[17, "أيمكن لمبغض العدل أن يحكم؟ أتدين البار القدير؟"], [18, "الذي يقول للملك: أنت عديم القيمة، وللنبلاء: أنتم أشرار؟"], [19, "الذي لا يحابي الأمراء، ولا يؤثر الأغنياء على الفقراء، لأنهم جميعا عمل يديه."]]}], "kwAr": "لا يرتكب خطأ", "noteAr": ""}, {"kw": "every morning", "raw": "Heb. morning by morning, Isa_28:19, Isa_33:2, Isa_50:4; Jer_21:12; Lam_3:23", "note": "Heb. morning by morning, Isa_28:19, Isa_33:2, Isa_50:4; Jer_21:12; Lam_3:23", "refs": [{"l": "Isa 28:19", "n": "", "vs": [[19, "ويجتاحونكم مرة تلو مرة، في الليل والنهار وما إن تدركوا مغزى هذا العقاب حتى يطغى عليكم الرعب."]]}, {"l": "Isa 33:2", "n": "", "vs": [[2, "يارب ارحمنا. إياك انتظرنا، كن عضدنا في الصباح، وخلاصنا في أثناء المحنة."]]}, {"l": "Isa 50:4", "n": "", "vs": [[4, "السيد الرب وهبني منطق العلماء لأعرف كيف أغيث المتعب بكلمة، ينبهني في كل صباح، ويرهف أذني حتى أسمع بانتباه المتعلمين."]]}, {"l": "Jer 21:12", "n": "", "vs": [[12, "ياذرية داود، هذا ما يعلنه الرب: أجروا العدل في الصباح، وأنقذوا المغتصب من يد المغتصب لئلا ينصب غضبي كنار، فيحرق وليس من يخمده لفرط ما ارتكبتم من أعمال شريرة."]]}, {"l": "Lam 3:23", "n": "", "vs": [[23, "تتجدد في كل صباح. فائقة أمانتك."]]}], "kwAr": "في كل صباح", "noteAr": "بالعبرية: «صباحا فصباحا». انظر إش 28: 19؛ 33: 2؛ 50: 4؛ إر 21: 12؛ مرا 3: 23"}, {"kw": "bring", "raw": "Psa_37:6; Isa_42:3, Isa_42:4; Mic_7:9; Luk_12:2; Rom_2:5; 1Co_4:5", "note": "", "refs": [{"l": "Psa 37:6", "n": "", "vs": [[6, "يظهر براءتك كالنور، وحقك ظاهرا كشمس الظهيرة."]]}, {"l": "Isa 42:3", "n": "", "vs": [[3, "لا يكسر قصبة مرضوضة، وفتيلة مدخنة لا يطفيء. إنما بأمانة يجري عدلا."]]}, {"l": "Isa 42:4", "n": "", "vs": [[4, "لا يكل ولا تثبط له همة حتى يرسخ العدل في الأرض، وتنتظر الجزائر شريعته."]]}, {"l": "Mic 7:9", "n": "", "vs": [[9, "إني أخطأت إلى الرب لذلك أتحمل غضبه، إلى أن يدافع عني ويثبت استقامتي، فيخرجني إلى النور لأشاهد عدله."]]}, {"l": "Luk 12:2", "n": "", "vs": [[2, "فما من مستور لن يكشف، ولا من سر لن يعرف."]]}, {"l": "Rom 2:5", "n": "", "vs": [[5, "ولكنك بسبب قساوتك وقلبك غير التائب، تخزن لنفسك غضبا ليوم الغضب، يوم تعلن دينونة الله العادلة."]]}, {"l": "1Co 4:5", "n": "", "vs": [[5, "إذن، لا تحكموا في شيء قبل الأوان، ريثما يرجع الرب الذي سيسلط النور على الأشياء التي يحجبها الظلام الآن، ويكشف نيات القلوب، عندئذ ينال كل واحد حقه من المدح من عند الله!"]]}], "kwAr": "ويبدي", "noteAr": ""}, {"kw": "but", "raw": "Jer_3:3, Jer_6:15, Jer_8:12", "note": "", "refs": [{"l": "Jer 3:3", "n": "", "vs": [[3, "لذلك امتنع عنك الغيث، ولم تهطل أمطار الربيع، ومع ذلك صارت لك جبهة زانية تأبى أن تخجل."]]}, {"l": "Jer 6:15", "n": "", "vs": [[15, "هل خجلوا لأنهم اقترفوا الرجس؟ كلا! لم يخزوا قط ولم يعرفوا الخجل، لذلك سيسقطون بين الساقطين، وحين أعاقبهم يطوح بهم»."]]}, {"l": "Jer 8:12", "n": "", "vs": [[12, "هل خجلوا عندما اقترفوا الرجس؟ كلا! لم يخزوا قط ولم يعرفوا الخجل. لذلك سيسقطون بين الساقطين، وحين أعاقبهم يطوح بهم»، يقول الرب."]]}], "kwAr": "أما الأثيم", "noteAr": ""}], "arS": [["ولكن ", []], ["الرب", ["H3068"]], [" ما برح ", []], ["صديقا", ["H6662"]], [" في ", []], ["وسطها", ["H7130"]], ["، ", []], ["لا", ["H3808"]], [" ", []], ["يرتكب", ["H6213"]], [" ", []], ["خطأ", ["H5766"]], ["، ", []], ["ويبدي", ["H5414"]], [" في كل ", []], ["صباح", ["H1242"]], [" ", []], ["عدله", ["H4941"]], [" وفي كل ", []], ["فجر", ["H1242"]], [" ", []], ["حقه", ["H216"]], [". ", []], ["لا", ["H3808"]], [" ", []], ["يخفق", ["H5737"]], [" قط؛ أما ", []], ["الأثيم", ["H5767"]], [" ", []], ["فلا", ["H3808"]], [" ", []], ["يعرف", ["H3045"]], [" ما هو ", []], ["الخزي", ["H1322"]], [".", []]]}, {"c": 3, "v": 6, "text": "استأصلت أمما فغدت بروجهم أطلالا. أقفرت شوارعهم فلا يعبر بها أحد. صارت مدنهم خرابا لا يقيم فيها إنسان أو ساكن.", "groups": [{"kw": "cut", "raw": "Isa. 10:1-34, 15:1-16:14, 19:1-25, Isa_37:11-13, Isa_37:24-26, Isa_37:36; Jer_25:9-11; Jer_25:18-26; Nahum 2:1-3:19; 1Co_10:6, 1Co_10:11", "note": "", "refs": [{"l": "Isa 10:1-34", "n": "", "vs": [[1, "ويل للذين يسنون شرائع ظلم، وللكتبة الذين يسجلون أحكام جور!"], [2, "ليصدوا البائسين عن العدل، ويسلبوا مساكين شعبي حقهم، لتكون الأرامل مغنما لهم، وينهبوا اليتامى."], [3, "فماذا تصنعون في يوم العقاب عندما تقبل الكارثة من بعيد؟ إلى من تلجأون طلبا للعون، وأين تودعون ثروتكم؟"], [4, "لا يبقى شيء سوى أن تجثوا بين الأسرى، وتسقطوا بين القتلى. من أجل ذلك كله لم يرتد غضبه وما برحت يده ممدودة للعقاب."], [5, "ويل للأشوريين، قضيب غضبي، الحاملين في أيديهم عصا سخطي."], [6, "أرسلهم ضد أمة منافقة، وأوصيهم على شعبي الذي غضبت عليه، ليغنموا غنائمهم ويستولوا على أسلابهم، ويطأوهم كما يطأون الوحل."], [7, "ولكن ملك أشور لا يعرف أنني أنا الذي أرسلته، ويظن أنه بقدرته قد هاجم شعبي، وفي نيته أن يدمر ويجتاح أمما كثيرة."], [8, "لأنه يقول: أليس كل قوادي ملوكا؟"], [9, "أليس مصير كلنو كمصير كركميش؟ أو ليس مآل حماة كمآل أرفاد؟ أليست السامرة كدمشق؟"], [10, "لقد قضيت على ممالك وثنية أصنامها أعظم من أصنام أورشليم والسامرة!"], [11, "أفلا أقضي على أورشليم وأصنامها كما قضيت على السامرة وأصنامها؟"], [12, "ولكن حالما ينتهي الرب من عمله بجبل صهيون، فإنه سيعاقب ملك أشور على غرور قلبه وتشامخ عينيه،"], [13, "لأنه يقول: بقوة ذراعي قد صنعت هذا، وبحكمتي، لأنني فهيم! قد نقلت تخوم الأمم، ونهبت كنوزهم، وعزلت الجالسين على العروش كما يفعل ذو البطش."], [14, "وكما تستحوذ يد الإنسان على العش، هكذا استحوذت يدي على ثروات الشعوب. وكما يجمع الإنسان البيض المهجور، هكذا جمعت الأرض بأسرها، فلم يجرؤ أحد أن يحرك جناحا أو يفتح فاها أو ينبس بهمسة."], [15, "أتزهو الفأس على من يقطع بها، أم يتعظم المنشار على من ينشر به، وكأن القضيب يحرك رافعه، أو كأن العصا ترفع ما ليس خشبا؟!"], [16, "لذلك فإن الرب القدير سيفشي وبأ مهلكا بين محاربيه الشجعان، ويوقد تحت مجده وقيدا كاشتعال النار،"], [17, "فيصبح نور إسرائيل نارا، وقدوسه لهيبا، فتشتعل وتلتهم شوكه وحسكه في يوم واحد،"], [18, "فيدمر الرب مجد غاباته وأرضه الخصيبة، الروح والجسد معا، فتكون كمريض تذوي حياته،"], [19, "ولا يتبقى من أشجار الغابة إلا قلة يحصيها صبي."], [20, "في ذلك اليوم لا تعود بقية إسرائيل والناجون منهم يتوكلون على من ضربهم، بل يعتمدون على الرب قدوس إسرائيل بالحق."], [21, "وترجع بقية ذرية يعقوب إلى الرب القدير."], [22, "مع أن شعبك ياإسرائيل كرمل البحر، فإن بقية فقط ترجع، لأن الله قضى بفنائهم، وقضاؤه عادل."], [23, "فالرب القدير يجري الفناء والقضاء في وسط كل الأرض."], [24, "لذلك هكذا يقول الرب القدير: «ياشعبي المقيم في صهيون، لا تخف من أشور عندما يضربك بقضيب، ويرفع عليك عصاه كما فعل المصريون،"], [25, "فإنه عما قليل يكتمل سخطي، وينصب غضبي لإبادتهم»."], [26, "ولا يلبث الرب القدير أن يهز عليه سوطا كما ضرب المديانيين عند صخرة غراب، ويرفع قضيبه فوق البحر مثلما فعل في مصر."], [27, "في ذلك اليوم يتدحرج حمله عن كتفك، ويتحطم نيره عن عنقك لأن عنقك أصبح غليظا."], [28, "ها هو جيش أشور مقبل؛ قد وصل إلى عياث، واجتاز بمجرون. وضع مؤونته في مخماش."], [29, "قطعوا المعبر، وباتوا في جبع. ارتعد أهل الرامة، وهرب سكان جبعة شاول."], [30, "اصرخي يابنت جليم، واسمعي ياليشة، وأجيبي يامدينة عناثوث."], [31, "هرب أهل مدمنة. فر سكان جيبيم طلبا للنجاة."], [32, "اليوم يتوقف في نوب ويهز قبضته على جبل بنت صهيون، أكمة أورشليم."], [33, "لكن الرب القدير يحطم الأغصان بعنفوان. فكل متطاول يقطع، وكل متشامخ يذل."], [34, "تستأصل أجمات الغابة بفأس، ويسقط لبنان أمام جبار مهوب."]]}, {"l": "Isa 15:1-16:14", "n": "", "vs": [[1, "رؤيا بشأن موآب: حقا في ليلة مباغتة تخرب عار موآب، حقا في ليلة مباغتة تدمر قير موآب."], [2, "ينطلق أهل ديبون إلى المعبد، وحتى إلى المرتفعات للبكاء؛ يولول شعب موآب على مصير نبو وميدبا برؤوس وذقون محلوقة."], [3, "يتلفعون بالمسوح في شوارعها، ويبكي كل واحد منهم على السطوح وفي الساحات."], [4, "تتعالى صرخات حشبون وألعالة حتى تتردد أصداؤها في ياهص، لذلك يندب جيش موآب بصوت مرتفع، وقلوبهم ترتعد في صدورهم."], [5, "قلبي يصرخ متوجعا على موآب وعلى عظمائها الهاربين إلى صوغر. كعجلة ثلاثية يصعدون إلى عقبة اللوحيث مولولين، ويجهرون بصراخ الهزيمة في طريق حورونايم."], [6, "غاضت مياه نهر نمريم، وجف العشب على ضفتيه، وذوى الكلأ وبادت الخضرة"], [7, "لذلك يحملون ما ادخروه من ثروة ونفائس، وينقلونها إلى عبر وادي الصفصاف،"], [8, "إذ يتجاوب صراخهم على طول تخوم موآب، وتبلغ ولولتهم إلى أجلايم وبئر إيليم."], [9, "تفيض مياه ديمون دما لأني أزيد من ويلاتها، فتهاجم الأسود الناجين من موآب، وتفترس الهاربين والماكثين فيها."], [1, "أيها الهاربون من موآب إلى سالع في الصحراء، أرسلوا حملانا إلى ملك يهوذا في أورشليم (طلبا للحماية قائلين):"], [2, "نساء موآب على ضفاف أرنون مثل الطيور التائهة أو الفراخ الشاردة."], [3, "فانصحنا، أنصفنا، ليكن ظلك علينا في الظهيرة كالليل فتستر منفيينا عن عيون أعدائنا ولا تشي باللاجئين منا."], [4, "لتمكث معكم فلول الهاربين منا واعصمهم من مدمرهم لأن الباغي يبيد والدمار يكف والظالم يفنى من الأرض."], [5, "ولا يلبث أن يثبت بالرحمة عرش في بيت داود يجلس عليه بأمانة ملك يقضي بالعدل والإنصاف."], [6, "قد سمعنا بكبرياء موآب، وبعجرفتها وغطرستها الطاغيتين، وبغرورها وصلفها، ولكن كل افتخارها باطل."], [7, "لذلك يولول الموآبيون على موآب، ويئنون على قير حارس المدمرة."], [8, "ذبلت حقول حشبون وكروم سبمة التي أتلف أمراء الأمم أفضلها، التي وصلت يوما إلى يعزير، وامتدت إلى القفر وبلغت فروعها إلى الصحراء."], [9, "لذلك أبكي كبكاء يعزير على جفنات سبمة وأرويكما بدموعي ياحشبون وياألعالة. لأن جلبة الدمار قد وقعت على حصادك وقطافك."], [10, "وانتزع الفرح والابتهاج من روضتك، فلم يبق أحد يرنم أو يهتف في كرومك، ولا يوجد من يدوس الخمر في معصرتك، لأني قد أخرست الهتاف."], [11, "لهذا تئن روحي على موآب كعود، وأحشائي تتلوى على قير حارس."], [12, "وعندما يحضر الموآبيون إلى المرتفعات المشرفة، يأخذهم الإعياء، وعندما يذهبون إلى مقادسهم ليصلوا، يجنون الباطل."], [13, "هذا ما تكلم الرب به على موآب منذ زمن."], [14, "وها هو يتكلم الآن قائلا: «في غضون ثلاث سنوات، كسنوات الأجير، يذل مجد موآب، ويحتقر جميع شعبها، والناجون منهم يكونون قلة ضعيفة»."]]}, {"l": "Isa 19:1-25", "n": "", "vs": [[1, "نبوءة بشأن مصر: ها هو الرب قادم إلى مصر يركب سحابة سريعة، فترتجف أوثان مصر في حضرته، وتذوب قلوب المصريين في داخلهم."], [2, "وأثير مصريين على مصريين فيتحاربون، ويقوم الواحد على أخيه، والمدينة على المدينة والمملكة على المملكة،"], [3, "فتذوب أرواح المصريين في داخلهم، وأبطل مشورتهم، فيسألون الأوثان والسحرة وأصحاب التوابع والعرافين."], [4, "وأسلط على المصريين مولى قاس، فيسود ملك عنيف عليهم. هذا ما يقوله الرب القدير."], [5, "وتنضب مياه النيل وتجف الأحواض وتيبس."], [6, "تنتن القنوات، وتتناقص تفرعات النيل وتجف، ويتلف القصب والأسل."], [7, "وتذبل النباتات على ضفاف نهر النيل، والحقول والمزروعات كلها تجف، وكأنها لم تكن مخضرة."], [8, "فيئن الصيادون وطارحو الشصوص في النيل وينوحون ويتحسر الذين يلقون شباكهم في المياه."], [9, "ويتولى اليأس قلوب الذين يصنعون الكتان الممشط، ويفقد حائكو الكتان الفاخر كل أمل."], [10, "ويسحق الرجال، أعمدة الأرض، ويكتئب كل عامل أجير."], [11, "رؤساء صوعن حمقى، ومشورات أحكم حكماء فرعون غبية. كيف تقولون لفرعون نحن من نسل حكماء، وأبناء ملوك قدامى؟"], [12, "أين حكماؤك يا فرعون ليطلعوك على ما قضى به الرب القدير على مصر؟"], [13, "قد حمق رؤساء صوعن وانخدع أمراء نوف وأضل مصر شرفاء قبائلها"], [14, "جعل الرب فيها روح فوضى، فأضلوا مصر فى كل تصرفاتها، حتى ترنحت كترنح السكران في قيئه."], [15, "فلم يبق لعظمائها أو أدنيائها ما يفعلونه فيها."], [16, "في ذلك اليوم يرتعد المصريون كالنساء خوفا من يد الرب القدير التي يهزها فوقهم."], [17, "وتغدو أرض يهوذا مثار رعب للمصريين فيعتريها الفزع من ذِكرها لأن الرب القدير قد قضى قضاءه على مصر."], [18, "في ذلك اليوم يكون في ديار مصر خمس مدن تنطق بلغة كنعان، وتحلف بالولاء للرب القدير، وتدعى إحداها مدينة الشمس."], [19, "في ذلك اليوم يقام مذبح للرب في وسط ديار مصر، ويرتفع نصب للرب عند تخومها،"], [20, "فيكون علامة وشهادة للرب القدير في ديار مصر، لأنهم يستغيثون بالرب من مضايقيهم، فيبعث إليهم مخلصا ومدافعا ينقذهم."], [21, "فيعلن الرب نفسه للمصريين. وفي ذلك اليوم يعبدونه ويقدمون ذبيحة وقرابين وينذرون للرب نذورا ويوفون بها."], [22, "ويضرب الرب مصر؛ يضربها ويبرئها، فيرجع أهلها تائبين إلى الرب فيستجيب دعاءهم ويشفيهم."], [23, "في ذلك اليوم يمتد طريق من مصر إلى أشور، ومن أشور إلى مصر، فيعبد المصريون والأشوريون الرب معا."], [24, "في ذلك اليوم يكون إسرائيل ثالث ثلاثة مع مصر وأشور، وبركة في وسط الأرض،"], [25, "فيباركهم الرب القدير قائلا: «مبارك شعبي مصر، وصنعة يدي أشور، وميراثي إسرائيل»."]]}, {"l": "Isa 37:11-13", "n": "", "vs": [[11, "فها أنت قد علمت بما ألحقه ملوك أشور بكل البلدان من تدمير كامل، فهل يمكن أن تنجو أنت؟"], [12, "هل أنقذت آلهة الأمم الأخرى أهل جوزان وحاران ورصف وأبناء عدن في تلسار الذين أفناهم آبائي؟"], [13, "أين ملك حماة، وملك أرفاد، وملك مدينة سفروايم، وهينع وعوا؟»"]]}, {"l": "Isa 37:24-26", "n": "", "vs": [[24, "لقد عيرت السيد على لسان رسلك، وقلت: بكثرة مركباتي قد صعدت إلى أعالي الجبال، وبلغت أقاصي لبنان قاطعا أطول أرزه وخيار سروه واخترقت أبعد ربوعه وأفضل غاباته."], [25, "قد حفرت آبارا وشربت مياها، وبباطن قدمي جففت جميع خلجان مصر."], [26, "ألم تسمع؟ منذ زمن طويل قد قدرت ذلك. منذ الأيام القديمة قررته وها أنا الآن أحققه، إذ أقمتك لتدمير مدن محصنة فتحولها إلى روابي خربة."]]}, {"l": "Isa 37:36", "n": "", "vs": [[36, "وحدث في تلك الليلة أن ملاك الرب قتل مئة وخمسة وثمانين ألفا من جيش الأشوريين، وما إن طلع الصباح حتى كانت جثث القتلى تملأ المكان"]]}, {"l": "Jer 25:9-11", "n": "", "vs": [[9, "فها أنا أجند جميع قبائل الشمال بقيادة نبوخذناصر عبدي، وآتي بها إلى هذه الأرض فيجتاحونها ويهلكون جميع سكانها مع سائر الأمم المحيطة بها، وأجعلهم مثار دهشة وصفير، وخرائب أبدية."], [10, "وأبيد من بينهم أهازيج الفرح والطرب وصوت غناء العريس والعروس، وضجيج الرحى ونور السراج."], [11, "فتصبح هذه الأرض بأسرها قفرا خرابا، وتستعبد جميع هذه الأمم لملك بابل طوال سبعين سنة."]]}, {"l": "Jer 25:18-26", "n": "", "vs": [[18, "أورشليم ومدن يهوذا وملوكها وعظماءها، لأجعلها قفرا خرابا ومثار صفير ولعنة إلى هذا اليوم."], [19, "وسقيت منها كذلك فرعون ملك مصر وخدامه وعظماءه وكل شعبه،"], [20, "وكل الغرباء المقيمين في وسطهم، وجميع ملوك أرض عوص، وسائر ملوك الفلسطينيين: ملوك أشقلون، وغزة، وعقرون وبقية أشدود،"], [21, "وآدوم، وموآب، وبني عمون،"], [22, "وكل ملوك صور وصيدون وملوك الجزائر عبر البحر،"], [23, "وددان وتيماء وبوز، وكل ذوي الشعر المقصوص الزوايا،"], [24, "وكل ملوك العرب، وسائر ملوك القبائل المنضمة إليهم المقيمين في الصحراء،"], [25, "وكل ملوك زمري، وعيلام، وجميع ملوك مادي."], [26, "وكل ملوك الشمال، القريبين والبعيدين، الواحد تلو الآخر، وكل الممالك المنتشرة على وجه الأرض. ثم بعد ذلك يشرب منها ملك بابل."]]}, {"l": "1Co 10:6", "n": "", "vs": [[6, "وإنما حدثت هذه الأمور لتكون مثالا لنا، حتى لا نشتهي أمورا شريرة كما اشتهى أولئك."]]}, {"l": "1Co 10:11", "n": "", "vs": [[11, "فهذه الأمور كلها حدثت لهم لتكون مثالا، وقد كتبت إنذارا لنا، نحن الذين تناهت إلينا أواخر الأزمنة."]]}], "kwAr": "استأصلت", "noteAr": ""}, {"kw": "towers", "raw": "or, corners", "note": "or, corners", "refs": [], "kwAr": "بروجهم", "noteAr": "أو: «زوايا»."}], "arS": [["استأصلت", ["H3772"]], [" ", []], ["أمما", ["H1471"]], [" فغدت ", []], ["بروجهم", ["H6438"]], [" ", []], ["أطلالا", ["H8074"]], [". ", []], ["أقفرت", ["H2717"]], [" ", []], ["شوارعهم", ["H2351"]], [" ", []], ["فلا", ["H4480", "H1097"]], [" ", []], ["يعبر", ["H5674"]], [" بها أحد. صارت ", []], ["مدنهم", ["H5892"]], [" ", []], ["خرابا", ["H6658"]], [" لا يقيم فيها ", []], ["إنسان", ["H376"]], [" ", []], ["أو", ["H4480", "H369"]], [" ", []], ["ساكن", ["H3427"]], [".", []]]}, {"c": 3, "v": 7, "text": "فقلت: لو إن أهلها يخافونني ويقبلون تقويمي، فلا تستأصل مساكنهم ولا ينصب عليهم كل غضبي. ولكنهم جدوا مبكرين بارتكاب الفساد في كل عمل أقدموا عليه.", "groups": [{"kw": "Surely", "raw": "Zep_3:2; Isa_5:4, Isa_63:8; Jer_8:6, Jer_36:3; Luk_19:42-44; 2Pe_3:9", "note": "", "refs": [{"l": "Zep 3:2", "n": "", "vs": [[2, "التي لا تصغي لصوت أحد، وتأبى التقويم، ولا تتكل على الرب، ولا تتقرب من إلهها."]]}, {"l": "Isa 5:4", "n": "", "vs": [[4, "أي شيء يمكن أن يصنع لكرمي لم أصنعه؟ وعندما انتظرت منه أن يثمر لي عنبا، لماذا أنتج حصرما؟"]]}, {"l": "Isa 63:8", "n": "", "vs": [[8, "لأنه قال: إنهم حقا شعبي وأبناء أوفياء، لن يعودوا للباطل. فخلصهم."]]}, {"l": "Jer 8:6", "n": "", "vs": [[6, "قد أصغيت وسمعت، وإذا بهم ينطقون بما ينافي الحق، وما من أحد يتوب عن شره قائلا: ما هذا الذي أرتكب؟ بل كل واحد مضى في طريقه كفرس مندفع لخوض معركة."]]}, {"l": "Jer 36:3", "n": "", "vs": [[3, "لعل شعب يهوذا يسمعون عن جميع الشر الذي عزمت أن أوقعه بهم، فيتوب كل واحد عن غيه، فأعفو عن إثمهم وخطيئتهم»."]]}, {"l": "Luk 19:42-44", "n": "", "vs": [[42, "قائلا: «ليتك أنت أيضا، في يومك هذا، عرفت ما فيه سلامك! ولكن ذلك محجوب الآن عن عينيك."], [43, "فستأتي عليك أيام يحاصرك فيها أعداؤك بالمتاريس، ويطبقون عليك، ويشددون عليك الحصار من كل جهة،"], [44, "ويهدمونك على أبنائك الذين فيك، فلا يتركون فيك حجرا فوق حجر: لأنك لم تعرفي وقت افتقاد الله لك»."]]}, {"l": "2Pe 3:9", "n": "", "vs": [[9, "فالرب، إذن، لا يبطيء في إتمام وعده، كما يظن بعض الناس، ولكنه يتأنى عليكم، فهو لا يريد لأحد من الناس أن يهلك، بل يريد لجميع الناس أن يرجعوا إليه تائبين."]]}], "kwAr": "لو إن", "noteAr": ""}, {"kw": "so", "raw": "Jer_7:7, Jer_17:25-27, Jer_25:5, Jer_38:17", "note": "", "refs": [{"l": "Jer 7:7", "n": "", "vs": [[7, "عندئذ أسكنكم في هذا الموضع في الأرض التي وهبتها لآبائكم إلى الأبد."]]}, {"l": "Jer 17:25-27", "n": "", "vs": [[25, "عندئذ يدخل من بوابات هذه المدينة ملوك ورؤساء ممن يجلسون على عرش داود، راكبين في عربات وعلى صهوات الجياد مع رؤسائهم، يواكبهم سكان يهوذا وأهل أورشليم، وتعمر هذه المدينة إلى الأبد بالسكان."], [26, "ويقبل الناس من مدن يهوذا ومن حول أورشليم، ومن أرض بنيامين ومن السهل والجبل، ومن النقب، حاملين محرقات وذبائح وتقدمات وبخورا معطرا، وقرابين شكر إلى هيكل الرب."], [27, "ولكن إن لم تستمعوا لي لتقدسوا يوم السبت، وثابرتم على حمل أثقال فيه لتدخلوها من بوابات أورشليم، فإني أضرم بواباتها بالنار فتلتهم قصور أورشليم، ولا تنطفيء»."]]}, {"l": "Jer 25:5", "n": "", "vs": [[5, "وقد قالوا لكم: توبوا الآن. ليرجع كل واحد منكم عن طرقه الشريرة وممارساته الأثيمة فتقيموا في الأرض التي وهبها لكم الرب على مدى الدهور،"]]}, {"l": "Jer 38:17", "n": "", "vs": [[17, "عندئذ قال إرميا لصدقيا: «هذا ما يعلنه الرب القدير إله إسرائيل: إن استسلمت إلى قواد ملك بابل تنجو بنفسك من الموت، ولا تحرق هذه المدينة بالنار بل تحيا أنت وأهل بيتك."]]}], "kwAr": "فلا تستأصل", "noteAr": ""}, {"kw": "howsoever", "raw": "2Ch_28:6-8, 2Ch_32:1, 2Ch_32:2, 2Ch_33:11, 2Ch_36:3-10", "note": "", "refs": [{"l": "2Ch 28:6-8", "n": "", "vs": [[6, "وقتل فقح بن رمليا مئة وعشرين ألفا من يهوذا في يوم واحد، وكلهم من المحاربين الأشداء، عقابا لهم، لأنهم تركوا الرب إله آبائهم."], [7, "وقضى زكري بطل أفرايم على معسيا ابن الملك وعزريقام مدير شؤون القصر الملكي، وألقانة التالي للملك في المقام."], [8, "وسبى بنو إسرائيل من أقربائهم بني يهوذا مئتي ألف من النساء والأبناء والبنات، ونهبوا منهم أسلابا وافرة حملوها إلى السامرة."]]}, {"l": "2Ch 32:1", "n": "", "vs": [[1, "وبعد كل ما قام به حزقيا بأمانة، زحف سنحاريب على أرض يهوذا ودخلها، وحاصر المدن الحصينة طمعا في الاستيلاء عليها."]]}, {"l": "2Ch 32:2", "n": "", "vs": [[2, "وعندما رأى حزقيا أن سنحاريب قد وطد العزم على محاربة أورشليم،"]]}, {"l": "2Ch 33:11", "n": "", "vs": [[11, "لهذا أرسل الرب عليهم قادة جند ملك أشور، فقبضوا على منسى ووضعوا خزامة في أنفه، وقادوه مغلولا بسلاسل نحاس إلى بابل."]]}, {"l": "2Ch 36:3-10", "n": "", "vs": [[3, "ثم عزله ملك مصر وفرض جزية على البلاد: مئة وزنة من الفضة (نحو ثلاثة آلاف وست مئة كيلوجرام) ووزنة من الذهب (نحو ستة وثلاثين كيلوجراما)."], [4, "ونصب ملك مصر ألياقيم أخاه ملكا على يهوذا وأورشليم، وغير اسمه إلى يهوياقيم. أما يوآحاز أخوه فاعتقله وساقه أسيرا إلى مصر."], [5, "وكان يهوياقيم في الخامسة والعشرين من عمره حين ملك، ودام حكمه إحدى عشرة سنة في أورشليم، وارتكب الشر في عيني الرب."], [6, "ثم هاجمه نبوخذناصر ملك بابل وأخذه أسيرا مقيدا إلى بابل."], [7, "واستولى نبوخذناصر على بعض آنية هيكل الرب، وأخذها معه إلى بابل، حيث وضعها في هيكله هناك."], [8, "أما بقية أخبار يهوياقيم وشروره التي اقترفها فهي مدونة في كتاب تاريخ ملوك إسرائيل ويهوذا. ثم خلفه ابنه يهوياكين على الملك."], [9, "وكان يهوياكين في الثامنة عشرة من عمره حين ملك، ودام حكمه ثلاثة أشهر وعشرة أيام في أورشليم، وارتكب الشر في عيني الرب."], [10, "وفي مطلع السنة الجديدة، أرسل الملك نبوخذناصر فقبض عليه ونقله إلى بابل مع آنية بيت الرب الثمينة، وولى أخاه صدقيا خلفا له على يهوذا وأورشليم."]]}], "kwAr": "ولا ينصب عليهم", "noteAr": ""}, {"kw": "they", "raw": "Mic_2:1, Mic_2:2", "note": "", "refs": [{"l": "Mic 2:1", "n": "", "vs": [[1, "ويل للمتآمرين بالسوء، الذين يحوكون الشر وهم في مضاجعهم، الذين ينفذون عند طلوع الصباح ما خططوا له، لأن ذلك في متناول قدرتهم."]]}, {"l": "Mic 2:2", "n": "", "vs": [[2, "يشتهون حقولا ويغتصبونها، وبيوتا فيستولون عليها. يجورون على الرجل وعلى بيته والإنسان وميراثه."]]}], "kwAr": "ولكنهم", "noteAr": ""}, {"kw": "corrupted", "raw": "Gen_6:12; Deu_4:16; Hos_9:9", "note": "", "refs": [{"l": "Gen 6:12", "n": "", "vs": [[12, "نظر الله وإذا بها فاسدة لأن كل بشر على الأرض قد سلك في طريق الإثم."]]}, {"l": "Deu 4:16", "n": "", "vs": [[16, "لئلا تفسدوا فتنحتوا لكم تمثالا لصورة ما لمثال رجل أو امرأة."]]}, {"l": "Hos 9:9", "n": "", "vs": [[9, "قد أوغلوا في الفساد كما حدث في أيام جبعة، لهذا سيذكر إثمهم ويعاقبهم على خطاياهم."]]}], "kwAr": "الفساد", "noteAr": ""}], "arS": [["فقلت", ["H559"]], [": ", []], ["لو", ["H389"]], [" إن أهلها ", []], ["يخافونني", ["H3372"]], [" ", []], ["ويقبلون", ["H3947"]], [" ", []], ["تقويمي", ["H4148"]], ["، ", []], ["فلا", ["H3808"]], [" ", []], ["تستأصل", ["H3772"]], [" ", []], ["مساكنهم", ["H4583"]], [" ولا ", []], ["ينصب", ["H6485"]], [" ", []], ["عليهم", ["H5921"]], [" ", []], ["كل", ["H3605", "H834"]], [" غضبي. ", []], ["ولكنهم", ["H403"]], [" جدوا ", []], ["مبكرين", ["H7925"]], [" بارتكاب ", []], ["الفساد", ["H7843"]], [" في ", []], ["كل", ["H3605"]], [" ", []], ["عمل", ["H5949"]], [" أقدموا عليه.", []]]}, {"c": 3, "v": 8, "text": "لذلك يقول الرب: انتظروني لأني عزمت في اليوم الذي أقوم فيه كشاهد أن أجمع الأمم وأحشد الممالك لأسكب عليهم سخطي واحتدام غضبي، لأن الأرض بكاملها ستؤكل بنار غيرة غيظي.", "groups": [{"kw": "wait", "raw": "Psa_27:14, Psa_37:7, Psa_37:34, Psa_62:1, Psa_62:5, Psa_123:2, Psa_130:5, Psa_130:6; Pro_20:22; Isa_30:18; Lam_3:25, Lam_3:26; Hos_12:6; Mic_7:7; Jam_5:7, Jam_5:8", "note": "", "refs": [{"l": "Psa 27:14", "n": "", "vs": [[14, "انتظر الرب. تقو وليتشجع قلبك. وانتظر الرب دائما."]]}, {"l": "Psa 37:7", "n": "", "vs": [[7, "اسكن أمام الرب وانتظره بصبر، ولا تغر من الذي ينجح في مسعاه، بفضل مكائده."]]}, {"l": "Psa 37:34", "n": "", "vs": [[34, "انتظر الرب واسلك دائما في طريقه، فيرفعك لتمتلك الأرض، وتشهد انقراض الأشرار."]]}, {"l": "Psa 62:1", "n": "", "vs": [[1, "انتظرت نفسي الله وحده. من لدنه يأتي خلاصي."]]}, {"l": "Psa 62:5", "n": "", "vs": [[5, "انتظرت نفسي الله وحده؛ من لدنه يأتي خلاصي."]]}, {"l": "Psa 123:2", "n": "", "vs": [[2, "كما تتعلق عيون العبيد بأيدي سادتهم، وعينا الجارية بيد سيدتها، هكذا تتعلق أنظارنا بالرب إلهنا حتى يتحنن علينا."]]}, {"l": "Psa 130:5", "n": "", "vs": [[5, "انتظرتك يارب. نفسي تنتظرك، وفي كلمتك رجائي."]]}, {"l": "Psa 130:6", "n": "", "vs": [[6, "نفسي تنتظر الرب بلهفة أكثر من لهفة الحراس مترقبي الصبح."]]}, {"l": "Pro 20:22", "n": "", "vs": [[22, "لا تقل: لأجازين من أساء إلي شرا. انتظر، فالرب يعينك."]]}, {"l": "Isa 30:18", "n": "", "vs": [[18, "ومع ذلك فإن الرب ينتطر حتى يبدي نحوكم عطفه، لهذا يقوم ليرحمكم، لأن الرب هو إله عدل، فطوبى لجميع الذين ينتظرونه."]]}, {"l": "Lam 3:25", "n": "", "vs": [[25, "الرب صالح لمن يرجونه وللنفس التي تلتمسه."]]}, {"l": "Lam 3:26", "n": "", "vs": [[26, "خير للمرء أن ينتظر بصمت خلاص الرب."]]}, {"l": "Hos 12:6", "n": "", "vs": [[6, "أما أنتم فارجعوا إلى إلهكم تائبين. تمسكوا برحمته وعدله، وداوموا على الا تكال عليه."]]}, {"l": "Mic 7:7", "n": "", "vs": [[7, "أما أنا فأرتقب الرب وأنتظر إله خلاصي فيسمعني إلهي."]]}, {"l": "Jam 5:7", "n": "", "vs": [[7, "وأما أنتم، ياإخوتي، فاصبروا منتظرين عودة الرب. خذوا العبرة من الفلاح: فهو ينتظر أن تعطيه الأرض غلالا ثمينة، صابرا على الزرع حتى يشرب من مطر الخريف ومطر الربيع."]]}, {"l": "Jam 5:8", "n": "", "vs": [[8, "فاصبروا أنتم إذن، وشددوا قلوبكم لأن عودة الرب قد صارت قريبة."]]}], "kwAr": "انتظروني", "noteAr": ""}, {"kw": "rise", "raw": "Psa_12:5, Psa_78:65, Psa_78:66; Isa_42:13, Isa_42:14, Isa_59:16-18", "note": "", "refs": [{"l": "Psa 12:5", "n": "", "vs": [[5, "ولكن الرب يقول: إنقاذا للمساكين، واستجابة لتنهدات المظلومين، أهب الآن لأفرج كربة المتضايقين."]]}, {"l": "Psa 78:65", "n": "", "vs": [[65, "ثم استيقظ الرب كما يستيقظ النائم، مثل جبار يصرخ عاليا من الخمر."]]}, {"l": "Psa 78:66", "n": "", "vs": [[66, "فضرب أعداءه وقهرهم، وجعلهم عارا مدى الدهر."]]}, {"l": "Isa 42:13", "n": "", "vs": [[13, "يبرز الرب كجبار، يستثير حميته كما يستثيرها المحارب، ويطلق صرخة حرب داوية، يظهر جبروته أمام أعدائه."]]}, {"l": "Isa 42:14", "n": "", "vs": [[14, "لكم اعتصمت بالصمت، ولزمت السكينة ولجمت نفسي. أما الآن فأنا أصيح وأزفر كامرأة تقاسي من المخاض."]]}, {"l": "Isa 59:16-18", "n": "", "vs": [[16, "وإذ لم يجد إنسانا ينتصر للحق، وأدهشه أن لا يرى شفيعا، أحرزت له ذراعه انتصارا، وعضده بره."], [17, "فتدرع بالبر وارتدى على رأسه خوذة الخلاص، واكتسى بثياب الانتقام، والتف بعباءة الغضب."], [18, "فهو يجازيهم بمقتضى أعمالهم. يجازي أعداءه، ويعاقب خصومه، وينزل القصاص بالجزائر،"]]}], "kwAr": "أقوم", "noteAr": ""}, {"kw": "to gather", "raw": "Eze_38:14-23; Joe_3:2, Joe_3:9-16; Mic_4:11-13; Zec_14:2, Zec_14:3; Mat_25:32; Rev_16:14, Rev_19:17-19", "note": "", "refs": [{"l": "Eze 38:14-23", "n": "", "vs": [[14, "لذلك تنبأ ياابن آدم، وقل لجوج هذا ما يعلنه السيد الرب: في ذلك اليوم عندما يسكن شعبي إسرائيل آمنا، ألا تعلم ذلك؟"], [15, "وتقبل أنت من مقرك في أقاصي الشمال مع جيوش غفيرة، تغشي الأرض؛ كلهم راكبو خيل وجمع عظيم وجيش كثير."], [16, "وتزحف على شعبي إسرائيل كسحابة تغطي الأرض، أني في الأيام الأخيرة آتي بك إلى أرضي لكي تعرفني الشعوب عندما تتجلى قداستي حين أدمرك ياجوج أمام عيونهم.هذا ما يقوله السيد الرب:"], [17, "ألست أنت الذي تحدثت عنه في الأيام الغابرة على ألسنة عبيدي أنبياء إسرائيل الذين تنبأوا في تلك الأيام لسنين كثيرة بأني سآتي بك عليهم؟"], [18, "ويقول السيد الرب: في ذلك اليوم عندما يزحف جوج على أرض إسرائيل يحتدم غضبي في وجهي."], [19, "وفي خضم غيرتي واتقاد سخطي أقول إنه في ذلك اليوم تحدث هزة عظيمة في أرض إسرائيل،"], [20, "فيرتعش من حضرتي سمك البحر وطيور السماء ووحوش البرية وجميع الحيوانات الدابة على الأرض، وكل الناس الذين على وجه المسكونة، وتندك الجبال وتسقط المعاقل وتنهار كل الأسوار إلى الأرض."], [21, "وأسلط عليه السيف في كل جبالي يقول السيد الرب، فيكون سيف كل رجل ضد أخيه."], [22, "وأدينه بالوباء وبالدم، وأمطر عليه وعلى جيوشه وعلى جموع حلفائه الغفيرة مطرا جارفا وبردا عظيما ونارا وكبريتا."], [23, "فأعظم نفسي وأقدسها، وأعلن ذاتي على مرأى من كل الأمم، فيدركون أني أنا الرب»."]]}, {"l": "Joe 3:2", "n": "", "vs": [[2, "أجمع الأمم كلها وأحضرهم إلى وادي يهوشافاط، وأحاكمهم هناك من أجل شعبي وميراثي إسرائيل، لأنهم شتتوهم بين الشعوب واقتسموا أرضي."]]}, {"l": "Joe 3:9-16", "n": "", "vs": [[9, "نادوا بهذا بين الأمم، وتأهبوا للحرب. احشدوا أبطالكم. ليتقدم ويصعد جميع رجال القتال."], [10, "أطرقوا سكك محاريثكم وحولوها إلى سيوف، ومناجلكم إلى رماح، وليقل الضعيف: إنني جبار قتال!"], [11, "أسرعوا وتعالوا من كل ناحية يا كل الأمم، واجتمعوا هناك، وأنزل يارب محاربيك."], [12, "لتنهض الأمم وتقبل إلى وادي القضاء لأنني هناك أجلس لأدين الشعوب المتوافدة من كل جهة."], [13, "احملوا المنجل لأن الحصيد قد نضج. تعالوا ودوسوا فإن معصرة الخمر قد امتلأت، والحياض فاضت بكثرة شرهم."], [14, "جماهير جماهير متزاحمة في وادي القضاء، لأن يوم الرب قريب في وادي القضاء."], [15, "قد أظلمت الشمس والقمر، وكفت الكواكب عن الضياء."], [16, "يزأر الرب في صهيون، ويجلجل بصوته من أورشليم فترجف السماوات والأرض؛ لكن الرب يكون ملجأ لشعبه، وحصنا لبني إسرائيل."]]}, {"l": "Mic 4:11-13", "n": "", "vs": [[11, "والآن ها أمم غفيرة قد اجتمعت عليك قائلة «لتتدنس أورشليم حتى تتفرس عيوننا في خرابها»."], [12, "لكنهم لم يعرفوا نوايا الرب، ولم يفهموا مقاصده، فإنه قد جمعهم كأكداس إلى البيدر ليعاقبهم."], [13, "فانهضي ياابنة صهيون وادرسي أعداءك، لأني سأجعل لك قرنا من حديد وأظلافا من نحاس فتسحقين أمما كثيرة، وتكرسين كل ما تغنمينه منهم للرب، وتقدمين ثروتهم لسيد الأرض كلها."]]}, {"l": "Zec 14:2", "n": "", "vs": [[2, "لأني أجمع جميع الأمم على أورشليم لتحاربها، فتؤخذ المدينة وتنهب البيوت وتغتصب النساء ويسبى نصف أهلها إلى المنفى. إنما لا ينقرض بقية الشعب من المدينة."]]}, {"l": "Zec 14:3", "n": "", "vs": [[3, "ولا يلبث أن يهب الرب ليحارب تلك الأمم، كما كان يحارب في يوم القتال."]]}, {"l": "Mat 25:32", "n": "", "vs": [[32, "وتجتمع أمامه الشعوب كلها، فيفصل بعضهم عن بعض كما يفصل الراعي الغنم عن المعاز،"]]}, {"l": "Rev 16:14", "n": "", "vs": [[14, "وهي أرواح شيطانية قادرة على صنع المعجزات، تذهب إلى ملوك الأرض جميعا وتجمعهم للحرب في ذلك اليوم العظيم، يوم الله القادر على كل شيء."]]}, {"l": "Rev 19:17-19", "n": "", "vs": [[17, "ثم رأيت ملاكا واقفا في الشمس، ينادي الطيور الطائرة في وسط السماء بصوت عال قائلا: «هلمي اجتمعي معا إلى وليمة الله الكبرى!"], [18, "تعالي والتهمي لحوم الملوك والقادة والأبطال، والخيول وفرسانها، ولحوم البشر جميعا من أحرار وعبيد، وصغار وكبار»."], [19, "ورأيت الوحش وملوك الأرض وجيوشهم وقد احتشدوا ليحاربوا هذا الفارس وجيشه."]]}], "kwAr": "أن أجمع الأمم", "noteAr": ""}, {"kw": "for all", "raw": "Zep_1:18; Deu_32:21, Deu_32:22; Son_8:6; Eze_36:5, Eze_36:6, Eze_38:19; 2Pe_3:10", "note": "", "refs": [{"l": "Zep 1:18", "n": "", "vs": [[18, "لا ينقذهم ذهبهم ولا فضتهم في يوم غضب الرب، إذ بنار غيرته تلتهم كل الأرض، وفيه يضع نهاية مباغتة كاملة سريعة لكل سكان المعمورة»."]]}, {"l": "Deu 32:21", "n": "", "vs": [[21, "هيجوا غيرتي بعبادة أوثانهم، وأسخطوني بأصنامهم الباطلة. لذلك سأثير غيرتهم بشعب متوحش، وأغيظهم بأمة حمقاء."]]}, {"l": "Deu 32:22", "n": "", "vs": [[22, "فها قد أضرم غضبي نارا تحرق حتى الهاوية السفلى، وتأكل الأرض وغلاتها، وتشعل أسس الجبال."]]}, {"l": "Son 8:6", "n": "", "vs": [[6, "(المحبوبة): اجعلني كخاتم على قلبك، كوشم على ذراعك، فإن المحبة قوية كالموت، والغيرة قاسية كالهاوية. ولهيبها لهيب نار، كأنها نار الرب!"]]}, {"l": "Eze 36:5", "n": "", "vs": [[5, "ها أنا في أثناء احتدام نار غيرتي أصدرت قضائي على بقية الأمم وعلى أدوم قاطبة، الذين اغتصبوا أرضي ميراثا لهم، بقلوب مغتبطة ونفوس حاقدة لتكون لهم نهبا وغنيمة."]]}, {"l": "Eze 36:6", "n": "", "vs": [[6, "لذلك تنبأ عن أرض إسرائيل وقل للجبال والتلال والأودية: هذا ما يعلنه السيد الرب: ها أنا في غيرتي وسخطي قد أصدرت قضائي لأنكم قد تحملتم تعيير الأمم،"]]}, {"l": "Eze 38:19", "n": "", "vs": [[19, "وفي خضم غيرتي واتقاد سخطي أقول إنه في ذلك اليوم تحدث هزة عظيمة في أرض إسرائيل،"]]}, {"l": "2Pe 3:10", "n": "", "vs": [[10, "إلا أن «يوم الرب» سيأتي كما يأتي اللص في الليل. في ذلك اليوم، تزول السماوات محدثة دويا هائلا وتنحل العناصر محترقة بنار شديدة، وتحترق الأرض وما فيها من منجزات."]]}], "kwAr": "لأن الأرض بكاملها", "noteAr": ""}], "arS": [["لذلك", ["H3651"]], [" ", []], ["يقول", ["H5002"]], [" ", []], ["الرب", ["H3068"]], [": ", []], ["انتظروني", ["H2442"]], [" ", []], ["لأني", ["H3588"]], [" ", []], ["عزمت", ["H4941"]], [" في ", []], ["اليوم", ["H3117"]], [" الذي ", []], ["أقوم", ["H6965"]], [" فيه ", []], ["كشاهد", ["H5706"]], [" أن ", []], ["أجمع", ["H622"]], [" ", []], ["الأمم", ["H1471"]], [" ", []], ["وأحشد", ["H6908"]], [" ", []], ["الممالك", ["H4467"]], [" ", []], ["لأسكب", ["H8210"]], [" ", []], ["عليهم", ["H5921"]], [" ", []], ["سخطي", ["H2195"]], [" ", []], ["واحتدام", ["H2740"]], [" ", []], ["غضبي", ["H639"]], ["، ", []], ["لأن", ["H3588"]], [" ", []], ["الأرض", ["H776"]], [" ", []], ["بكاملها", ["H3605"]], [" ", []], ["ستؤكل", ["H398"]], [" ", []], ["بنار", ["H784"]], [" ", []], ["غيرة", ["H7068"]], [" غيظي.", []]]}, {"c": 3, "v": 9, "text": "عندئذ أنقي شفاه الشعب ليدعوا جميعهم باسم الرب ويعبدوه جنبا إلى جنب.", "groups": [{"kw": "will", "raw": "Isa_19:18; Mat_12:35; Eph_4:29", "note": "", "refs": [{"l": "Isa 19:18", "n": "", "vs": [[18, "في ذلك اليوم يكون في ديار مصر خمس مدن تنطق بلغة كنعان، وتحلف بالولاء للرب القدير، وتدعى إحداها مدينة الشمس."]]}, {"l": "Mat 12:35", "n": "", "vs": [[35, "فالإنسان الصالح، من الكنز الصالح في قلبه، يصدر ما هو صالح. والإنسان الشرير، يصدر ما هو شرير."]]}, {"l": "Eph 4:29", "n": "", "vs": [[29, "لا تخرج من أفواهكم كلمة فاسدة، بل الكلام الصالح للبنيان الذي تدعو إليه الحاجة، كي يعطي السامعين نعمة."]]}], "kwAr": "أنقي", "noteAr": ""}, {"kw": "language", "raw": "Heb. lip, Gen_11:1 *marg.", "note": "Heb. lip, Gen_11:1 *marg.", "refs": [{"l": "Gen 11:1", "n": "*marg.", "vs": [[1, "وكان أهل الأرض جميعا يتكلمون أولا بلسان واحد ولغة واحدة."]]}], "kwAr": "شفاه", "noteAr": "بالعبرية: «شفة». انظر تك 11: 1"}, {"kw": "that", "raw": "1Ki_8:41-43; Psa_22:27, Psa_86:9, Psa_86:10, Psa_113:3; Jer_16:19; Hab_2:14; Zec_2:11; Zec_8:20-23, Zec_14:9; Act_2:4-13; Rom_15:6-11; Rev_11:15", "note": "", "refs": [{"l": "1Ki 8:41-43", "n": "", "vs": [[41, "أما الغريب الذي لا ينتمي إلى شعبك إسرائيل، والذي يقبل من أرض بعيدة من أجل اسمك،"], [42, "لأن الغرباء يسمعون باسمك العظيم، وبما أجرته يدك القوية وذراعك المقتدرة، فيحضرون ويصلون في هذا الهيكل،"], [43,
