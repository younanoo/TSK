اومك. يقول الرب القدير. فأحرق مركباتك فتصبح دخانا، ويلتهم السيف لحوم أبنائك، وأستأصل من الأرض غنائمك ولن يتردد في ما بعد صوت مندوبيك."]]}], "kwAr": "لا نهاية لكنوزها", "noteAr": "أو: «ولا نهاية لذخائرها» إلخ. انظر نا 2: 12، 13"}, {"kw": "pleasant furniture", "raw": "Heb. vessels of desire, 2Ch_36:10; Jer_25:34; Eze_26:12; Dan_11:8 *marg.", "note": "Heb. vessels of desire, 2Ch_36:10; Jer_25:34; Eze_26:12; Dan_11:8 *marg.", "refs": [{"l": "2Ch 36:10", "n": "", "vs": [[10, "وفي مطلع السنة الجديدة، أرسل الملك نبوخذناصر فقبض عليه ونقله إلى بابل مع آنية بيت الرب الثمينة، وولى أخاه صدقيا خلفا له على يهوذا وأورشليم."]]}, {"l": "Jer 25:34", "n": "", "vs": [[34, "أعولوا أيها الرعاة وابكوا، تمرغوا في الرماد ياقادة الشعب، لأن أوان ذبحكم قد حان، فأشتتكم فتسقطون (وتتناثرون) كإناء فاخر."]]}, {"l": "Eze 26:12", "n": "", "vs": [[12, "وينهبون ثروتك، ويستولون على تجارتك ويهدمون أسوارك وبيوتك المبهجة، ويطرحون حجارتك وخشبك وترابك إلى مياه البحر."]]}, {"l": "Dan 11:8", "n": "*marg.", "vs": [[8, "ويسبي إلى مصر آلهتهم مع أصنامهم والآنية النفيسة من الفضة والذهب. ثم يتوقف عن محاربة ملك الشمال لعدة سنوات."]]}], "kwAr": "نفائس ثروتها", "noteAr": "بالعبرية: «آنية اشتهاء». انظر 2أخ 36: 10؛ إر 25: 34؛ حز 26: 12؛ دا 11: 8"}], "arS": [["انهبوا", ["H962"]], [" ", []], ["الفضة", ["H3701"]], ["، ", []], ["انهبوا", ["H962"]], [" ", []], ["الذهب", ["H2091"]], [". ", []], ["لا", ["H369"]], [" ", []], ["نهاية", ["H7097"]], [" ", []], ["لكنوزها", ["H8498"]], [" أو ", []], ["لنفائس", ["H2532", "H3627"]], [" ", []], ["ثروتها", ["H3519"]], [".", []]]}, {"c": 2, "v": 10, "text": "أضحت موحشة خاوية جرداء، ذابت منها القلوب رعبا وانحلت منها الركب، طغى عليها الألم وعلا وجوه أهلها الشحوب.", "groups": [{"kw": "She is", "raw": "Nineveh was taken and utterly ruined by Assuerus, or Cyaxares, king of Media, and Nabuchodonosor, or Nabopolassar, king of Babylon, bc 606, or 612. Diodorus, who with others ascribes the taking of it to Arbaces the Mede and Belesis the Babylonian, says that he dispersed the citizens in the villages, levelled the city with the ground, transferred the gold and silver, of which there were many talents, to Ecbatana the metropolis of the Medes, and this subverted the empire of the Assyrians.", "note": "Nineveh was taken and utterly ruined by Assuerus, or Cyaxares, king of Media, and Nabuchodonosor, or Nabopolassar, king of Babylon, bc 606, or 612. Diodorus, who with others ascribes the taking of it to Arbaces the Mede and Belesis the Babylonian, says that he dispersed the citizens in the villages, levelled the city with the ground, transferred the gold and silver, of which there were many talents, to Ecbatana the metropolis of the Medes, and this subverted the empire of the Assyrians.", "refs": [], "kwAr": "أضحت", "noteAr": "خُربت نينوى تماما على يد أسويروس، أو كياخسار، ملك مادي، ونبوخذنصر، أو نبوبلاسر، ملك بابل، سنة 606 أو 612 ق.م. ويقول ديودورس، الذي ينسب مع غيره فتحها إلى أرباكس المادي وبليسيس البابلي، إنه شتت المواطنين في القرى وسوّى المدينة بالأرض ونقل الذهب والفضة، وكانا وزنات كثيرة، إلى إكباتانا عاصمة المادين، وبذلك قوّض إمبراطورية الآشوريين."}, {"kw": "empty", "raw": "Nah_3:7; Gen_1:2; Isa_13:19-22, Isa_14:23, Isa_24:1, Isa_34:10-15; Jer_4:23-26; Jer_51:62; Zep_2:13-15, Zep_3:6; Rev_18:21-23", "note": "", "refs": [{"l": "Nah 3:7", "n": "", "vs": [[7, "وكل من يراك يعرض عنك قائلا: «قد خربت نينوى فمن ينوح عليها؟ أين أجد لها معزين؟»"]]}, {"l": "Gen 1:2", "n": "", "vs": [[2, "وإذ كانت الأرض مشوشة ومقفرة وتكتنف الظلمة وجه المياه، وإذ كان روح الله يرفرف على سطح المياه،"]]}, {"l": "Isa 13:19-22", "n": "", "vs": [[19, "أما بابل، مجد الممالك وبهاء وفخر الكلدانيين، فتصبح كسدوم وعمورة اللتين قلبهما الله ."], [20, "لا يسكن فيها، ولا تعمر من جيل إلى جيل، لا ينصب فيها بدوي خيمته، ولا يربض فيها راع قطعانه."], [21, "إنما تأوي إليها وحوش القفر وتعج بيوت خرائبها بالبوم، وتلجأ إليها بنات النعام، وتتواثب فيها الماعز البرية،"], [22, "وتتعاوى الضباع بين أبراجها، وبنات آوى بين قصورها الفخمة. إن وقت عقابها بات وشيكا، وأيامها لن تطول!"]]}, {"l": "Isa 14:23", "n": "", "vs": [[23, "وأجعلها ميراثا للقنافذ، ومستنقعات للمياه، وأكنسها بمكنسة الدمار»."]]}, {"l": "Isa 24:1", "n": "", "vs": [[1, "ها إن الرب يخرب أرض يهوذا ويقفرها ويقلب وجهها ويشتت سكانها."]]}, {"l": "Isa 34:10-15", "n": "", "vs": [[10, "فلا تنطفيء ليلا ونهارا، ويحلق دخانها إلى الفضاء مدى الدهر، وتظل خرابا جيلا بعد جيل، فلا يعبر بها أحد إلى الأبد،"], [11, "ولا يرثها سوى الصقور والقنافذ، ويسكن فيها البوم والغراب، ويمد الرب عليها خيط الدمار ومطمار الهلاك،"], [12, "ولا يجد فيها أشرافها أثرا للملك، وينقرض جميع رؤسائها."], [13, "ينمو الشوك في قصورها، ويزحف العوسج على حصونها، فتصبح مأوى لبنات آوى، ومسكنا للنعام."], [14, "وتجتمع فيها الوحوش البرية مع الذئاب، ووعل البر يدعو صاحبه، وهناك تستقر وحوش الليل وتجد لنفسها ملاذ راحة."], [15, "هناك تعيش البوم وتبيض وتفرخ وترعى صغارها تحت أجنحتها، وهناك أيضا تتلاقى الصقور بعضها ببعض."]]}, {"l": "Jer 4:23-26", "n": "", "vs": [[23, "تأملت الأرض فإذا هي خربة خاوية، وتطلعت إلى السماء فإذا هي مظلمة."], [24, "نظرت إلى الجبال وإذا بها ترتجف، وإلى الآكام وإذا بها تتقلقل."], [25, "تلفت حولي فلم أجد إنسانا، وإذا كل الطيور قد هربت."], [26, "نظرت وإذا بالأرض الخصيبة قد تحولت إلى بر ية، وأصبحت جميع مدنها أطلالا أمام الرب وأمام غضبه المحتدم."]]}, {"l": "Jer 51:62", "n": "", "vs": [[62, "وقل: أيها الرب قد قضيت على هذا الموضع بالانقراض، فلا يسكن فيه أحد من الناس والبهائم، بل يصبح خرابا أبديا."]]}, {"l": "Zep 2:13-15", "n": "", "vs": [[13, "ثم يبسط يده نحو الشمال ويبيد أشور ويجعل نينوى قفرا موحشا، أرضا قاحلة كالصحراء."], [14, "تربض في وسطها القطعان وسائر وحوش البر، ويأوي إلى تيجان أعمدتها القوق والقنفذ وينعب الغراب على عتباتها، لأن أرزها قد تعرى."], [15, "هذه هي المدينة الطروب التي سكنت آمنة قائلة لنفسها: أنا وليس لي نظير! كيف صارت أطلالا، ومأوى للوحوش البرية؟ كل من يجتاز بها يصفر دهشة ويهز يده»."]]}, {"l": "Zep 3:6", "n": "", "vs": [[6, "استأصلت أمما فغدت بروجهم أطلالا. أقفرت شوارعهم فلا يعبر بها أحد. صارت مدنهم خرابا لا يقيم فيها إنسان أو ساكن."]]}, {"l": "Rev 18:21-23", "n": "", "vs": [[21, "وتناول ملاك قوي حجرا كأنه حجر طاحونة عظيم وألقاه في البحر قائلا: «هكذا تدفع وتطرح بابل المدينة العظمى، فتختفي إلى الأبد!"], [22, "لن يسمع فيك عزف موسيقى بعد، لا صوت قيثارة ولا مزمار ولا بوق، ولن تقوم فيك صناعة بعد الآن، ولن يسمع فيك صوت رحى"], [23, "ولن يضيء فيك نور مصباح. ولن يسمع فيك صوت عريس وعروس. فقد كان تجارك سادة الأرض، وبسحرك ضللت جميع الأمم."]]}], "kwAr": "خاوية", "noteAr": ""}, {"kw": "the heart", "raw": "Jos_2:11; Psa_22:14; Isa_13:7, Isa_13:8", "note": "", "refs": [{"l": "Jos 2:11", "n": "", "vs": [[11, "لقد بلغتنا هذه الأخبار فذابت قلوبنا من الخوف ولم تبق بعد روح في إنسان رعبا منكم، لأن الرب إلهكم هو رب السماء والأرض."]]}, {"l": "Psa 22:14", "n": "", "vs": [[14, "صارت قوتي كالماء، وانحلت عظامي. صار قلبي كالشمع، وذاب في داخلي."]]}, {"l": "Isa 13:7", "n": "", "vs": [[7, "لذلك ترتخي كل يد، ويذوب قلب كل إنسان."]]}, {"l": "Isa 13:8", "n": "", "vs": [[8, "ينتابهم الفزع، وتأخذهم أوجاع ومخاض، يتلوون كوالدة تقاسي من آلآم المخاض. ويحملق بعضهم ببعض مبهوتين بوجوه ملتهبة."]]}], "kwAr": "القلوب", "noteAr": ""}, {"kw": "the knees", "raw": "Dan_5:6", "note": "", "refs": [{"l": "Dan 5:6", "n": "", "vs": [[6, "عندئذ شحب وجه الملك وأفزعته أفكاره واصطكت ركبتاه واعتراه الانهيار،"]]}], "kwAr": "الركب", "noteAr": ""}, {"kw": "and much", "raw": "Isa_21:3; Jer_30:6", "note": "", "refs": [{"l": "Isa 21:3", "n": "", "vs": [[3, "لذلك امتلأت حقواى ألما، وانتابني مخاض كمخاض الوالدة. فقدت الوعي من جراء ما سمعت، وذهلت مما رأيت"]]}, {"l": "Jer 30:6", "n": "", "vs": [[6, "اسألوا وتأملوا: أيمكن للرجل أن يحمل؟ إذا ما لي أرى كل رجل يضع يديه على حقويه كامرأة تقاسي من المخاض، وقد اكتسى كل وجه بالشحوب؟"]]}], "kwAr": "الألم", "noteAr": ""}, {"kw": "and the faces", "raw": "Joe_2:6", "note": "", "refs": [{"l": "Joe 2:6", "n": "", "vs": [[6, "تنتاب الرعدة منهم جميع الشعوب وتشحب كل الوجوه."]]}], "kwAr": "وجوه", "noteAr": ""}], "arS": [["أضحت", ["H1961"]], [" ", []], ["موحشة", ["H950"]], [" ", []], ["خاوية", ["H4003"]], [" ", []], ["جرداء", ["H1110"]], ["، ", []], ["ذابت", ["H4549"]], [" منها ", []], ["القلوب", ["H3820"]], [" رعبا ", []], ["وانحلت", ["H6375"]], [" منها ", []], ["الركب", ["H1290"]], ["، طغى عليها ", []], ["الألم", ["H2479"]], [" ", []], ["وعلا", ["H6908"]], [" ", []], ["وجوه", ["H6440"]], [" أهلها ", []], ["الشحوب", ["H6289"]], [".", []]]}, {"c": 2, "v": 11, "text": "أين نينوى عرين الأسود ومرتع الأشبال حيث يسرح الأسد واللبوءة والأشبال من غير إزعاج؟", "groups": [{"kw": "the dwelling", "raw": "Nah_3:1; Job_4:10,Job_4:11; Isa_5:29; Jer_2:15, Jer_4:7, Jer_50:17, Jer_50:44; Eze_19:2-8; Zep_3:3", "note": "", "refs": [{"l": "Nah 3:1", "n": "", "vs": [[1, "ويل للمدينة السافكة الدماء الممتلئة كذبا، المكتظة بالغنائم المنهوبة، التي لا تخلو أبدا من الضحايا."]]}, {"l": "Job 4:10", "n": "", "vs": [[10, "قد يزأر الأسد ويزمجر الليث، ولكن أنياب الأشبال تهشمت."]]}, {"l": "Job 4:11", "n": "", "vs": [[11, "يهلك الليث لتعذر وجود الفريسة، وتتشتت أشبال اللبؤة."]]}, {"l": "Isa 5:29", "n": "", "vs": [[29, "زئيرهم كأنه زئير أسد يزمجر وينقض على فريسته ويحملها وليس من منقذ."]]}, {"l": "Jer 2:15", "n": "", "vs": [[15, "قد زأرت الأسود عليه زئيرا مدويا، وجعلت أرضه خربة. أحرقت مدنه فأصبحت مهجورة."]]}, {"l": "Jer 4:7", "n": "", "vs": [[7, "قد برز أسد من أجمته، وزحف مدمر الشعوب. قد أقبل من خدره ليخرب أرضكم، فتصبح مدنكم أطلالا مهجورة من السكان."]]}, {"l": "Jer 50:17", "n": "", "vs": [[17, "إسرائيل قطيع غنم متشتت، طردته الأسود. كان ملك أشور أول من افترسه، ونبوخذناصر آخر من هشم عظامه."]]}, {"l": "Jer 50:44", "n": "", "vs": [[44, "انظر، ها هو كما ينقض عليها كما ينقض أسد من أجمات نهر الأردن، هكذا وفي لحظة أطردهم منها، وأولي عليها من أختاره لأنه من هو نظيري؟ ومن يحاكمني؟ وأي راع يقوى على مواجهتي؟"]]}, {"l": "Eze 19:2-8", "n": "", "vs": [[2, "وقل: ماذا كانت أمك؟ لبوة ربضت بين الأسود وربت جراءها بين الأشبال."], [3, "حتى إذا كبر أحد جرائها وصار شبلا، وتعلم الصيد، أكل الناس."], [4, "وعندما بلغ أمره الأمم وقع في حفرتهم، فأخذوه مسوقا بخزائمه إلى ديار مصر."], [5, "وعندما أدركت في أثناء انتظارها أن رجاءها قد هلك، أخذت جروا آخر وجعلته شبلا."], [6, "فتمشى بين الأسود وصار شبلا وتعلم الصيد، وأكل الناس،"], [7, "وهدم قصور هم وخرب مدنهم، فارتعبت الأرض ومن فيها من زمجرة زئيره،"], [8, "فاجتمعت عليه الأمم من كل صوب، وألقوا عليه شبكتهم فوقع في حفرتهم،"]]}, {"l": "Zep 3:3", "n": "", "vs": [[3, "رؤساؤها في داخلها أسود زائرة، وقضاتها كذئاب المساء الجائعة التي لا تبقي شيئا من فرائسها إلى الصباح."]]}], "kwAr": "عرين", "noteAr": ""}, {"kw": "none", "raw": "Gen_49:9; Isa_31:4", "note": "", "refs": [{"l": "Gen 49:9", "n": "", "vs": [[9, "يهوذا شبل أسد، عن فريسة قمت ياابني. ثم جثا وربض كأسد أو كلبوة، فمن يجرؤ على إثارته؟"]]}, {"l": "Isa 31:4", "n": "", "vs": [[4, "لأنه هكذا قال الرب لي: «كما يزمجر الأسد أو الشبل على فريسته، من غير أن يخشى من صرخات جماعة الرعاة المتألبين عليه، أو يفزع من جلبتهم، هكذا يقبل الرب القدير ليحارب عن جبل صهيون."]]}], "kwAr": "من غير إزعاج", "noteAr": ""}], "arS": [["أين", ["H346"]], [" نينوى ", []], ["عرين", ["H4583"]], [" ", []], ["الأسود", ["H738"]], [" ", []], ["ومرتع", ["H4829"]], [" ", []], ["الأشبال", ["H3715"]], [" ", []], ["حيث", ["H834", "H8033"]], [" ", []], ["يسرح", ["H1980"]], [" ", []], ["الأسد", ["H738"]], [" ", []], ["واللبوءة", ["H3833"]], [" ", []], ["والأشبال", ["H1482"]], [" من ", []], ["غير", ["H369"]], [" ", []], ["إزعاج", ["H2729"]], ["؟", []]]}, {"c": 2, "v": 12, "text": "قد افترس الأسد ما يكفي لإعالة أشباله وخنق فريسة للبوءاته. قد ملأ عرينه بقنائصه وكهفه بأشلائهم.", "groups": [{"kw": "and filled", "raw": "Psa_17:12; Isa_10:6-14; Jer_51:34", "note": "", "refs": [{"l": "Psa 17:12", "n": "", "vs": [[12, "الشرير كأسد متلهف للافتراس، وكالشبل الكامن في مخبئه."]]}, {"l": "Isa 10:6-14", "n": "", "vs": [[6, "أرسلهم ضد أمة منافقة، وأوصيهم على شعبي الذي غضبت عليه، ليغنموا غنائمهم ويستولوا على أسلابهم، ويطأوهم كما يطأون الوحل."], [7, "ولكن ملك أشور لا يعرف أنني أنا الذي أرسلته، ويظن أنه بقدرته قد هاجم شعبي، وفي نيته أن يدمر ويجتاح أمما كثيرة."], [8, "لأنه يقول: أليس كل قوادي ملوكا؟"], [9, "أليس مصير كلنو كمصير كركميش؟ أو ليس مآل حماة كمآل أرفاد؟ أليست السامرة كدمشق؟"], [10, "لقد قضيت على ممالك وثنية أصنامها أعظم من أصنام أورشليم والسامرة!"], [11, "أفلا أقضي على أورشليم وأصنامها كما قضيت على السامرة وأصنامها؟"], [12, "ولكن حالما ينتهي الرب من عمله بجبل صهيون، فإنه سيعاقب ملك أشور على غرور قلبه وتشامخ عينيه،"], [13, "لأنه يقول: بقوة ذراعي قد صنعت هذا، وبحكمتي، لأنني فهيم! قد نقلت تخوم الأمم، ونهبت كنوزهم، وعزلت الجالسين على العروش كما يفعل ذو البطش."], [14, "وكما تستحوذ يد الإنسان على العش، هكذا استحوذت يدي على ثروات الشعوب. وكما يجمع الإنسان البيض المهجور، هكذا جمعت الأرض بأسرها، فلم يجرؤ أحد أن يحرك جناحا أو يفتح فاها أو ينبس بهمسة."]]}, {"l": "Jer 51:34", "n": "", "vs": [[34, "«يقول المسبيون: قد افترسنا نبوخذناصر ملك بابل وسحقنا وجعلنا إناء فارغا. ابتلعنا كتنين، وملأ جوفه من أطايبنا، ثم لفظنا من فمه."]]}], "kwAr": "قد ملأ", "noteAr": ""}], "arS": [["قد ", []], ["افترس", ["H2963"]], [" ", []], ["الأسد", ["H738"]], [" ما ", []], ["يكفي", ["H1767"]], [" لإعالة ", []], ["أشباله", ["H1484"]], [" ", []], ["وخنق", ["H2614"]], [" ", []], ["فريسة", ["H2964"]], [" ", []], ["للبوءاته", ["H3833"]], [". قد ", []], ["ملأ", ["H4390"]], [" ", []], ["عرينه", ["H2356"]], [" ", []], ["بقنائصه", ["H2964"]], [" ", []], ["وكهفه", ["H4585"]], [" ", []], ["بأشلائهم", ["H2966"]], [".", []]]}, {"c": 2, "v": 13, "text": "ها أنا أقاومك. يقول الرب القدير. فأحرق مركباتك فتصبح دخانا، ويلتهم السيف لحوم أبنائك، وأستأصل من الأرض غنائمك ولن يتردد في ما بعد صوت مندوبيك.", "groups": [{"kw": "I am", "raw": "Nah_3:5; Jer_21:13, Jer_50:31, Jer_51:25; Eze_5:8, Eze_26:3, Eze_28:22, Eze_29:3, Eze_29:10; Eze_35:3, Eze_38:3, Eze_39:1", "note": "", "refs": [{"l": "Nah 3:5", "n": "", "vs": [[5, "ها أنا أقاومك، يقول الرب القدير، فأكشف عارك لأطلع الأمم على عورتك والممالك على خزيك."]]}, {"l": "Jer 21:13", "n": "", "vs": [[13, "ياأورشليم ياساكنة الوادي، ياصخرة السهل، ها أنا أقف ضدك يقول الرب، وأنتم يامن تقولون: «من يهاجمنا؟ ومن يقتحم منازلنا؟»"]]}, {"l": "Jer 50:31", "n": "", "vs": [[31, "ها أنا أقاومك أيتها المتغطرسة، يقول الرب القدير، لأن يوم إدانتك وتنفيذ العقاب فيك قد حان،"]]}, {"l": "Jer 51:25", "n": "", "vs": [[25, "ها أنا أنقلب عليك أيها الجبل المخرب، يقول الرب. أنت تفسد كل الأرض، لذلك أمد يدي عليك وأدحرجك من بين الصخور، وأجعلك جبلا محترقا."]]}, {"l": "Eze 5:8", "n": "", "vs": [[8, "ها أنا أيضا أنقلب عليك ياأورشليم، وأجري عليك قضاء على مشهد من الأمم،"]]}, {"l": "Eze 26:3", "n": "", "vs": [[3, "لذلك يعلن السيد الرب: ها أنا أعاقبك ياصور، فأجعل أمما كثيرة تهاجمك كما يهجم البحر بأمواجه."]]}, {"l": "Eze 28:22", "n": "", "vs": [[22, "وقل هذا ما يعلنه السيد الرب: ها أنا أنقلب عليك ياصيدون وأتجلى بمجدي فيك فيدرك سكانك أني أنا الرب حين أنفذ فيك أحكاما وأتقدس في وسطك."]]}, {"l": "Eze 29:3", "n": "", "vs": [[3, "وقل هذا ما يعلنه السيد الرب: ها أنا أنقلب عليك يافرعون ملك مصر، أيها التمساح الكامن في وسط أنهاره، القائل: النهر لي وقد صنعته لنفسي."]]}, {"l": "Eze 29:10", "n": "", "vs": [[10, "لذلك ها أنا أنقلب عليك وعلى أنهارك، وأجعل أراضي مصر خرائب متردمة مقفرة، من مجدل إلى أسوان حتى تخوم إثيوبيا."]]}, {"l": "Eze 35:3", "n": "", "vs": [[3, "وقل لأهله: ها أنا أنقلب عليك ياجبل سعير وأعاقبك لأجعلك خرابا مقفرا."]]}, {"l": "Eze 38:3", "n": "", "vs": [[3, "وقل، هذا ما يعلنه السيد الرب: ها أنا أنقلب عليك ياجوج رئيس روش ماشك وتوبال،"]]}, {"l": "Eze 39:1", "n": "", "vs": [[1, "»وتنبأ أنت ياابن آدم على جوج وقل: هذا ما يعلنه السيد الرب:"]]}], "kwAr": "ها أنا أقاومك", "noteAr": ""}, {"kw": "I will burn", "raw": "Jos_11:9; 2Ki_19:23; Psa_46:9", "note": "", "refs": [{"l": "Jos 11:9", "n": "", "vs": [[9, "وفعل بهم يشوع كما أمره الرب، فعرقب خيولهم وأحرق مركباتهم بالنار."]]}, {"l": "2Ki 19:23", "n": "", "vs": [[23, "لقد عيرت السيد على لسان رسلك، وقلت: بكثرة مركباتي قد صعدت إلى أعالي الجبال، وبلغت أقاصي لبنان قاطعا أطول أرزه وخيار سروه واخترقت أبعد ربوعه وأفضل غاباته."]]}, {"l": "Psa 46:9", "n": "", "vs": [[9, "يقضي على الحروب في الأرض كلها. يكسر القوس ويشق الرمح، ويحرق المركبات الحربية بالنار."]]}], "kwAr": "فأحرق", "noteAr": ""}, {"kw": "and the sword", "raw": "Isa_31:8, Isa_31:9, Isa_37:36-38", "note": "", "refs": [{"l": "Isa 31:8", "n": "", "vs": [[8, "ويصرع الأشوريون ويلتهمون، ولكن ليس بسيف بشر، ويفرون من أمام السيف، ويساق فتيانهم إلى الأعمال الشاقة،"]]}, {"l": "Isa 31:9", "n": "", "vs": [[9, "وتفنى صخورهم من الفزع، ويولي قادتهم الأدبار عندما يرون علم إسرائيل». هذا ما يقوله الرب الذي ناره في صهيون، وتنوره في أورشليم."]]}, {"l": "Isa 37:36-38", "n": "", "vs": [[36, "وحدث في تلك الليلة أن ملاك الرب قتل مئة وخمسة وثمانين ألفا من جيش الأشوريين، وما إن طلع الصباح حتى كانت جثث القتلى تملأ المكان"], [37, "فانسحب سنحاريب ملك أشور وارتد إلى بلاده ومكث في نينوى"], [38, "وفيما هو يتعبد في هيكل إلهه نسروخ اغتاله ابناه أدرملك وشرآصر وفرا إلى أرض أراراط، فخلفه ابنه آسرحدون على العرش."]]}], "kwAr": "ويلتهم السيف", "noteAr": ""}, {"kw": "I will cut", "raw": "Nah_3:1, Nah_3:12; Isa_33:1-4, Isa_49:24, Isa_49:25", "note": "", "refs": [{"l": "Nah 3:1", "n": "", "vs": [[1, "ويل للمدينة السافكة الدماء الممتلئة كذبا، المكتظة بالغنائم المنهوبة، التي لا تخلو أبدا من الضحايا."]]}, {"l": "Nah 3:12", "n": "", "vs": [[12, "وتتساقط جميع حصونك كتساقط بواكير أثمار أشجار التين الناضجة في أفواه من يهزونها."]]}, {"l": "Isa 33:1-4", "n": "", "vs": [[1, "ويل لك أيها المدمر الذي لم تدمر بعد، والناهب الذي لم ينهبوك، فعندما تكف عن التدمير تدمر، وحين تمتنع عن النهب ينهبونك."], [2, "يارب ارحمنا. إياك انتظرنا، كن عضدنا في الصباح، وخلاصنا في أثناء المحنة."], [3, "من صوت ضجيجك هربت الشعوب، ومن ارتفاعك تبددت الأمم،"], [4, "وكما يلتهم الجراد كل ما هو أخضر، هكذا يجمع سلبكم، ويتواثب الناس عليه كتواثب الجنادب."]]}, {"l": "Isa 49:24", "n": "", "vs": [[24, "هل تسلب الغنيمة من المحارب الجبار؟ أو يفلت الأسرى من قبضة الغالب؟"]]}, {"l": "Isa 49:25", "n": "", "vs": [[25, "نعم سبي الجبار يسلب منه، وتسترد الغنيمة من الغالب، لأنني أخاصم مخاصميك وأنقذ أبناءك،"]]}], "kwAr": "وأستأصل", "noteAr": ""}, {"kw": "the voice", "raw": "2Ki_18:17, 2Ki_18:19, 2Ki_18:27-35, 2Ki_19:9, 2Ki_19:23; 2Ch_32:9-16, 2Ch_32:19", "note": "", "refs": [{"l": "2Ki 18:17", "n": "", "vs": [[17, "ورغم ذلك أرسل ملك أشور إلى حزقيا قائد جيشه ووزير خزائنه ورئيس أركان قواته من لخيش، على رأس جيش جرار لمحاصرة أورشليم. فزحفوا عليها، وأحاطوا بها وعسكروا عند قناة البركة العليا في طريق حقل القصار."]]}, {"l": "2Ki 18:19", "n": "", "vs": [[19, "فقال لهم قائد جيش أشور: «بلغوا حزقيا أن هذا ما يقوله الملك العظيم، ملك أشور: على ماذا تتكل؟"]]}, {"l": "2Ki 18:27-35", "n": "", "vs": [[27, "فأجابهم قائد الجيش: «أتظن أن سيدي قد أرسلنا لنتحدث إليكم وإلى ملككم فقط بهذا الكلام؟ أليس هذا الكلام موجها إلى الرجال المتجمعين على السور الذين سيأكلون مثلكم برازهم ويشربون بولهم؟»"], [28, "ثم وقف قائد الجيش ونادى بأعلى صوته قائلا باليهودية: «اسمعوا كلام الملك العظيم ملك أشور."], [29, "لا يخدعكم حزقيا لأنه عاجز عن إنقاذكم"], [30, "ولا يقنعكم حزقيا بالاتكال على الرب قائلا: إنه حتما ينقذنا ولن يستولي ملك أشور على هذه المدينة."], [31, "لا تصغوا إليه لأنه هكذا يقول ملك أشور: اعقدوا معي صلحا، واستسلموا إلي، فيأكل عندئذ كل واحد من كرمه ومن تينته ويشرب من بئره."], [32, "إلى أن آتي وأنقلكم إلى أرض كأرضكم، أرض حنطة وخمر وخبز وكروم وزيتون وعسل. فاحيوا ولا تموتوا. لا تصغوا إلى حزقيا لأنه يغريكم بقوله إن الرب لابد أن ينقذنا."], [33, "فهل أنقذت آلهة الأمم أراضيها من ملك أشور؟"], [34, "أين آلهة حماة وأرفاد؟ أين آلهة سفروايم وهينع وعوا؟ هل أنقذت السامرة من يدي؟"], [35, "من من كل آلهة البلاد التي استوليت عليها أنقذ أرضه من يدي، حتى ينقذ الرب أورشليم مني؟»"]]}, {"l": "2Ki 19:9", "n": "", "vs": [[9, "وبلغ ملك أشور أن ترهاقة ملك كوش قد خرج لمحاربته، فبعث مرة أخرى رسلا إلى حزقيا قائلا:"]]}, {"l": "2Ki 19:23", "n": "", "vs": [[23, "لقد عيرت السيد على لسان رسلك، وقلت: بكثرة مركباتي قد صعدت إلى أعالي الجبال، وبلغت أقاصي لبنان قاطعا أطول أرزه وخيار سروه واخترقت أبعد ربوعه وأفضل غاباته."]]}, {"l": "2Ch 32:9-16", "n": "", "vs": [[9, "وفيما كان سنحاريب وجيشه يحاصرون لخيش، أرسل رجاله إلى أورشليم إلى حزقيا ملك يهوذا وإلى أهل أورشليم قائلين:"], [10, "«هذا ما يقوله سنحاريب ملك أشور: على ماذا تتكلون فتقيموا في أورشليم تحت الحصار؟"], [11, "ألا يغويكم حزقيا لكي تموتوا جوعا وعطشا، عندما يقول لكم: الرب إلهنا ينقذنا من يد ملك أشور؟"], [12, "أليس حزقيا هو الذي أزال مرتفعاته ومذابحه، وأمر يهوذا وأورشليم قائلا: أمام مذبح واحد تسجدون وعليه توقدون؟"], [13, "أما تعرفون ما أجريته أنا وآبائي على جميع أمم الأراضي، فهل استطاعت آلهتها أن تنقذ أرضها من يدي؟"], [14, "من من بين جميع آلهة هؤلاء الأمم الذين دمرهم آبائي استطاع أن ينقذ شعبه مني؟ فكيف يستطيع إلهكم أن ينقذكم من يدي؟"], [15, "لذلك لا يخدعنكم حزقيا ولا يغوينكم. لا تصدقوه لأنه لم يقدر إله أي أمة أو مملكة أن ينجي شعبه من يدي ومن يد آبائي، فكيف يمكن لإلهكم أن ينجيكم؟»"], [16, "وأكثر الضباط الأشوريون من التهجم على الرب وعلى عبده حزقيا."]]}, {"l": "2Ch 32:19", "n": "", "vs": [[19, "وكان تهجمهم على الرب إله أورشليم مماثلا لتهجمهم على أصنام الشعوب الأخرى التي صنعتها أيدي الناس."]]}], "kwAr": "صوت", "noteAr": ""}], "arS": [["ها", ["H2009"]], [" أنا ", []], ["أقاومك", ["H413"]], [". ", []], ["يقول", ["H5002"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["القدير", ["H6635"]], [". ", []], ["فأحرق", ["H1197"]], [" ", []], ["مركباتك", ["H7393"]], [" فتصبح ", []], ["دخانا", ["H6227"]], ["، ", []], ["ويلتهم", ["H398"]], [" ", []], ["السيف", ["H2719"]], [" لحوم ", []], ["أبنائك", ["H3715"]], ["، ", []], ["وأستأصل", ["H3772"]], [" من ", []], ["الأرض", ["H4480", "H776"]], [" ", []], ["غنائمك", ["H2964"]], [" ", []], ["ولن", ["H3808"]], [" ", []], ["يتردد", ["H8085"]], [" في ما ", []], ["بعد", ["H5750"]], [" ", []], ["صوت", ["H6963"]], [" ", []], ["مندوبيك", ["H4397"]], [".", []]]}, {"c": 3, "v": 1, "text": "ويل للمدينة السافكة الدماء الممتلئة كذبا، المكتظة بالغنائم المنهوبة، التي لا تخلو أبدا من الضحايا.", "groups": [{"kw": "to", "raw": "Isa_24:9; Eze_22:2, Eze_22:3, Eze_24:6-9; Hab_2:12; Zep_3:1-3", "note": "", "refs": [{"l": "Isa 24:9", "n": "", "vs": [[9, "لا يعودون يشربون الخمر مع الغناء، ويكون المسكر مرا لشاربيه."]]}, {"l": "Eze 22:2", "n": "", "vs": [[2, "«وأنت ياابن آدم، أتدين المدينة السافكة الدماء؟ إذا عرفها بكل رجاساتها،"]]}, {"l": "Eze 22:3", "n": "", "vs": [[3, "وقل: هذا ما يعلنه السيد الرب: أيتها المدينة التي تسفك الدماء في وسطها لتستجلب العقاب على نفسها، التي تصنع لنفسها أصناما تتنجس بها."]]}, {"l": "Eze 24:6-9", "n": "", "vs": [[6, "لأن هذا ما يعلنه السيد الرب: ويل للمدينة سافكة الدماء، وللقدر المغشاة بزنجارها الذي لا يخرج منها. فرغوها قطعة قطعة من غير اقتراع عليها."], [7, "لأن دمها ما برح فيها، قد وضعته على صخرة جرداء، لم ترقه على الأرض لتواريه بالتراب"], [8, "وحتى تثير الغضب المفضي إلى الانتقام وضعت دمها على صخرة جرداء لئلا يوارى."], [9, "لذلك ويل للمدينة سافكة الدماء، فإني أنا أجعل كومة حطبها عظيمة."]]}, {"l": "Hab 2:12", "n": "", "vs": [[12, "ويل لمن يبني مدينة بالدماء، ويؤسس قرية بالإثم."]]}, {"l": "Zep 3:1-3", "n": "", "vs": [[1, "ويل للمدينة الظالمة المتمردة الدنسة،"], [2, "التي لا تصغي لصوت أحد، وتأبى التقويم، ولا تتكل على الرب، ولا تتقرب من إلهها."], [3, "رؤساؤها في داخلها أسود زائرة، وقضاتها كذئاب المساء الجائعة التي لا تبقي شيئا من فرائسها إلى الصباح."]]}], "kwAr": "ويل", "noteAr": ""}, {"kw": "bloody city", "raw": "Heb. city of bloods", "note": "Heb. city of bloods", "refs": [], "kwAr": "السافكة الدماء", "noteAr": "بالعبرية: «مدينة دماء»."}, {"kw": "full", "raw": "Nah_2:12; Isa_17:14, Isa_42:24; Hos_4:2", "note": "", "refs": [{"l": "Nah 2:12", "n": "", "vs": [[12, "قد افترس الأسد ما يكفي لإعالة أشباله وخنق فريسة للبوءاته. قد ملأ عرينه بقنائصه وكهفه بأشلائهم."]]}, {"l": "Isa 17:14", "n": "", "vs": [[14, "في المساء يطغى عليهم رعب، وفي الصباح يتلاشون. هذا هو نصيب ناهبينا وحظ سالبينا."]]}, {"l": "Isa 42:24", "n": "", "vs": [[24, "من أسلم يعقوب للنهب، وإسرائيل للسالبين؟ أليس هو الله الذي أخطأنا في حقه؟ لأنهم أبوا أن يسلكوا في طرقه وأن يطيعوا شريعته."]]}, {"l": "Hos 4:2", "n": "", "vs": [[2, "وتفشت فيها اللعنة والكذب والقتل والسرقة والفسق. قد تخطوا كل حد، وسفك الدم يعقبه سفك دم."]]}], "kwAr": "الممتلئة", "noteAr": ""}], "arS": [["ويل", ["H1945"]], [" ", []], ["للمدينة", ["H5892"]], [" السافكة ", []], ["الدماء", ["H1818"]], [" ", []], ["الممتلئة", ["H4392"]], [" ", []], ["كذبا", ["H3585"]], ["، المكتظة ", []], ["بالغنائم", ["H6563"]], [" ", []], ["المنهوبة", ["H2964"]], ["، التي ", []], ["لا", ["H3808"]], [" ", []], ["تخلو", ["H4185"]], [" أبدا من الضحايا.", []]]}, {"c": 3, "v": 2, "text": "ها فرقعة السياط وقعقعة العجلاتِ وجلبة حوافر الخيول وصلصلة المركبات.", "groups": [{"kw": "noise", "raw": "Nah_2:3, Nah_2:4; Jdg_5:22; Job_39:22-25; Isa_9:5; Jer_47:3", "note": "", "refs": [{"l": "Nah 2:3", "n": "", "vs": [[3, "تروس أبطاله مخضبة بالاحمرار، وجنوده المحاربون مسربلون بالقرمز. يبرق فولاذ المركبات في يوم تأهبها، وتتبختر جيادها."]]}, {"l": "Nah 2:4", "n": "", "vs": [[4, "تتراكض المركبات بعنف في الشوارع، وعبر الساحات تمرق كالبرق ومنظرها كالمشاعل المتوهجة."]]}, {"l": "Jdg 5:22", "n": "", "vs": [[22, "ثم تردد وقع حوافر خيل العدو، من عدو الجياد الضخمة."]]}, {"l": "Job 39:22-25", "n": "", "vs": [[22, "يسخر من الخوف ولا يرتاع، ولا يتراجع أمام السيف."], [23, "تصلصل عليه جعبة السهام، وأيضا بريق الرماح والحراب."], [24, "في جريه ينهب الأرض بعنفوان وغضب ولا يستقر في مكانه عند نفخ بوق الحرب."], [25, "عندما يدوي صوت البوق يقول: هه هه! ويستروح المعركة عن بعد، ويسمع زئير القادة وهتافهم."]]}, {"l": "Isa 9:5", "n": "", "vs": [[5, "إذ كل سلاح المتسلح في الوغى، وكل رداء ملطخ بالدماء، يطرح وقودا للنار ويحرق."]]}, {"l": "Jer 47:3", "n": "", "vs": [[3, "من صوت وقع حوافر خيله، ومن جلبة مركباته، ومن صرير عجلاتها، فلا يلتفت الآباء إلى الأبناء من فرط ما يعتريهم من وهن."]]}], "kwAr": "فرقعة", "noteAr": ""}], "arS": [["ها ", []], ["فرقعة", ["H6963"]], [" ", []], ["السياط", ["H7752"]], [" ", []], ["وقعقعة", ["H6963", "H7494"]], [" ", []], ["العجلات", ["H212"]], ["ِ ", []], ["وجلبة", ["H1725"]], [" حوافر ", []], ["الخيول", ["H5483"]], [" ", []], ["وصلصلة", ["H7540"]], [" ", []], ["المركبات", ["H4818"]], [".", []]]}, {"c": 3, "v": 3, "text": "وفرسان واثبة، وسيوف لامعة ورماح بارقة وكثرة قتلى وأكوام جثث لا نهاية لها، بها يتعثرون.", "groups": [{"kw": "bright sword and the glittering spear", "raw": "Heb. flame of the sword, and lightning of the spear, Nah_2:4; Gen_3:24; Hab_3:11", "note": "Heb. flame of the sword, and lightning of the spear, Nah_2:4; Gen_3:24; Hab_3:11", "refs": [{"l": "Nah 2:4", "n": "", "vs": [[4, "تتراكض المركبات بعنف في الشوارع، وعبر الساحات تمرق كالبرق ومنظرها كالمشاعل المتوهجة."]]}, {"l": "Gen 3:24", "n": "", "vs": [[24, "وهكذا طرد الله الإنسان من جنة عدن، وأقام ملائكة الكروبيم وسيفا ناريا متقلبا شرقي الجنة لحراسة الطريق المفضية إلى «شجرة الحياة»."]]}, {"l": "Hab 3:11", "n": "", "vs": [[11, "القمر والشمس توقفا في منازلهما أمام وميض سهامك المندفعة وبريق رمحك المتلأليء."]]}], "kwAr": "سيوف لامعة ورماح بارقة", "noteAr": "بالعبرية: «لهيب السيف وبرق الرمح». انظر نا 2: 4؛ تك 3: 24؛ حب 3: 11"}, {"kw": "and there", "raw": "Isa_37:36; Eze_31:3-13, Eze_39:4", "note": "", "refs": [{"l": "Isa 37:36", "n": "", "vs": [[36, "وحدث في تلك الليلة أن ملاك الرب قتل مئة وخمسة وثمانين ألفا من جيش الأشوريين، وما إن طلع الصباح حتى كانت جثث القتلى تملأ المكان"]]}, {"l": "Eze 31:3-13", "n": "", "vs": [[3, "إنني أشبهك بشجرة أرز في لبنان، بهية الأغصان، وارفة الظل، شامخة تطاول قمتها الغيوم،"], [4, "ترويها المياه، وتنميها اللجج. تجري أنهارها حول مغرسها، وتنساب جداولها إلى كل أشجار الحقل."], [5, "لهذا طاولت قامتها خميع أشجار الحقل وتكاثرت أغصانها، وامتدت فروعها التي نبتت لغزارة مياهها."], [6, "وعششت في أغصانها كل طيور السماء، وتحت فروعها ولدت كل حيوان البر، وأوت تحت ظلها كل أمم الأرض العظيمة."], [7, "فكانت رائعة في عظمتها وفي شموخ قامتها لأن جذورها كانت مغروسة في مياه غريرة."], [8, "لم يضاهها الأرز في جنة الله، ولم يعادل السرو أغصانها، ولم يماثل الدلب فروعها. كل الأشجار في جنة الله لم تشبهها في حسنها."], [9, "جعلتها بهية لكثرة أغصانها حتى حسدتها كل أشجار عدن التي في جنة الله."], [10, "لذلك يقول السيد الرب: لأنك يافرعون شمخت بقامتك وطاولت بهامتك الغيوم، تكبر قلبك من جراء عظمتك."], [11, "أسلمتك إلى يد المتسلط على الأمم فيعاملك أقسى معاملة. إني نبذتك لفرط شرك."], [12, "ويستأصله الغرباء عتاة الأمم، ويتركونه، فتتهاوى أغصانه على الجبال وفي جميع الوهاد، وتتحطم فروعه إلى جوار كل أنهار الأرض، ويهجر ظله كل شعوب الأرض وينبذونه."], [13, "وتجثم على حطامه طيور السماء جميعها، وتربض فوق قضبانه كل حيوان البر"]]}, {"l": "Eze 39:4", "n": "", "vs": [[4, "فتتهاوى أنت وجميع جيوشك وسائر حلفائك الذين معك على جبال إسرائيل، وأجعلك قوتا لكل أصناف الطيور الجارحة ولوحوش البرية."]]}], "kwAr": "وكثرة قتلى", "noteAr": ""}], "arS": [["وفرسان", ["H6571"]], [" ", []], ["واثبة", ["H5927"]], ["، ", []], ["وسيوف", ["H2719"]], [" ", []], ["لامعة", ["H3851"]], [" ", []], ["ورماح", ["H2595"]], [" ", []], ["بارقة", ["H1300"]], [" ", []], ["وكثرة", ["H7230"]], [" ", []], ["قتلى", ["H2491"]], [" ", []], ["وأكوام", ["H3514"]], [" ", []], ["جثث", ["H6297", "H1472"]], [" ", []], ["لا", ["H369"]], [" ", []], ["نهاية", ["H7097"]], [" لها، بها ", []], ["يتعثرون", ["H3782"]], [".", []]]}, {"c": 3, "v": 4, "text": "كل هذا من أجل كثرة زنى نينوى الفاتنة الآسرة ومن أجل سحرها القاتل. لقد استعبدت الشعوب بعهرها والأمم بشعوذتها.", "groups": [{"kw": "the mistress", "raw": "Isa_23:15-17, Isa_47:9, Isa_47:12, Isa_47:13; Rev_17:1-5, Rev_18:2, Rev_18:3, Rev_18:9, Rev_18:23", "note": "", "refs": [{"l": "Isa 23:15-17", "n": "", "vs": [[15, "وفي ذلك اليوم تظل صور منسية طوال سبعين سنة، كحقبة حياة ملك واحد، وفي نهاية السبعين سنة يصيب صور مثل ما جاء في أغنية العاهرة:"], [16, "«خذي عودا وطوفي في المدينة أيتها العاهرة المنسية. أتقني العزف على العود وأكثري الغناء لعلك تذكرين»."], [17, "وفى نهاية السبعين سنة يفتقد الرب صور، فترجع إلى عهدها، وتزني مع كل ممالك الأرض."]]}, {"l": "Isa 47:9", "n": "", "vs": [[9, "لذلك ستبتلين بكلا الأمرين معا في لحظة، في يوم واحد، إذ تثكلين وتترملين حتى النهاية على الرغم من كثرة سحرك وقوة رقاك."]]}, {"l": "Isa 47:12", "n": "", "vs": [[12, "تشبثي برقاك وكثرة سحرك التي تعبت فيها منذ صباك، فقد يحالفك النجاح أو تثيرين الرعب."]]}, {"l": "Isa 47:13", "n": "", "vs": [[13, "لقد ضعفت من كثرة طلب المشورة، فادعي المنجمين والفلكيين ليكشفوا لك طوالع المستقبل وينقذوك مما يأتي عليك."]]}, {"l": "Rev 17:1-5", "n": "", "vs": [[1, "وجاء واحد من الملائكة السبعة حاملي الكؤوس السبع وقال لي: «تعال فأريك عقاب الزانية الكبرى الجالسة على المياه الكثيرة،"], [2, "والتي زنى معها ملوك الأرض، وسكر أهل الأرض من خمر زناها»."], [3, "وحملني الملاك بالروح إلى البرية، فرأيت امرأة راكبة على وحش قرمزي له سبعة رؤوس وعشرة قرون، وقد كتبت على جسمه كله أسماء تجديف."], [4, "وكانت المرأة تلبس ملابس من أرجوان وقرمز، وتتحلى بالذهب والحجارة الكريمة واللؤلوء، وقد أمسكت كأس ذهب مملوءة بزناها المكروه النجس،"], [5, "وعلى جبينها اسم مكتوب: سر: «بابل العظمى، أم زانيات الأرض وأصنامها المكروهة»."]]}, {"l": "Rev 18:2", "n": "", "vs": [[2, "وصاح بأعلى صوته: «سقطت، سقطت بابل العظمى، وصارت وكرا للشياطين ومأوى لكل روح نجس ولكل طائر نجس مكروه،"]]}, {"l": "Rev 18:3", "n": "", "vs": [[3, "لأن جميع الأمم شربت من خمر زناها، وملوك الأرض زنوا معها، وتجار الأرض اغتنوا من كثرة ترفها!»"]]}, {"l": "Rev 18:9", "n": "", "vs": [[9, "وسيبكي عليها ملوك الأرض الذين زنوا وترفهوا معها، وسينوحون وهم ينظرون إلى دخان حريقها،"]]}, {"l": "Rev 18:23", "n": "", "vs": [[23, "ولن يضيء فيك نور مصباح. ولن يسمع فيك صوت عريس وعروس. فقد كان تجارك سادة الأرض، وبسحرك ضللت جميع الأمم."]]}], "kwAr": "سحرها القاتل", "noteAr": ""}], "arS": [["كل هذا ", []], ["من أجل", ["H4480"]], [" ", []], ["كثرة", ["H7230"]], [" ", []], ["زنى", ["H2183"]], [" نينوى ", []], ["الفاتنة", ["H2896", "H2580"]], [" ", []], ["الآسرة", ["H1172"]], [" ومن أجل ", []], ["سحرها", ["H3785"]], [" القاتل. لقد ", []], ["استعبدت", ["H4376"]], [" ", []], ["الشعوب", ["H1471"]], [" ", []], ["بعهرها", ["H2183"]], [" ", []], ["والأمم", ["H4940"]], [" ", []], ["بشعوذتها", ["H3785"]], [".", []]]}, {"c": 3, "v": 5, "text": "ها أنا أقاومك، يقول الرب القدير، فأكشف عارك لأطلع الأمم على عورتك والممالك على خزيك.", "groups": [{"kw": "I am", "raw": "See note on Nah_2:13, and see note on Eze_23:25.", "note": "See note on Nah_2:13, and see note on Eze_23:25.", "refs": [{"l": "Nah 2:13", "n": "", "vs": [[13, "ها أنا أقاومك. يقول الرب القدير. فأحرق مركباتك فتصبح دخانا، ويلتهم السيف لحوم أبنائك، وأستأصل من الأرض غنائمك ولن يتردد في ما بعد صوت مندوبيك."]]}, {"l": "Eze 23:25", "n": "", "vs": [[25, "وأصب سخطي عليك فيعاملونك بغيظ. يجدعون أنفك وأذنيك، وتقتل بقيتك بالسيف. يأسرون أبناءك وبناتك، وتلتهم النار بقيتك،"]]}], "kwAr": "ها أنا أقاومك", "noteAr": "انظر الملاحظة على ناحوم 2: 13، والملاحظة على حزقيال 23: 25."}, {"kw": "I will discover", "raw": "Isa_47:2, Isa_47:3; Jer_13:22, Jer_13:26; Eze_16:37, Eze_23:29; Mic_1:11; Hab_2:16", "note": "", "refs": [{"l": "Isa 47:2", "n": "", "vs": [[2, "خذي حجري الرحى واطحني الدقيق. اكشفي نقابك، وشمري عن الذيل، واكشفي عن الساق، واعبري الأنهار،"]]}, {"l": "Isa 47:3", "n": "", "vs": [[3, "فيظل عريك مكشوفا وعارك ظاهرا، فإني أنتقم ولا أعفو عن أحد."]]}, {"l": "Jer 13:22", "n": "", "vs": [[22, "وإن تساءلت في نفسك: «لماذا ابتليت بهذه الأمور؟» إنها عاقبة كثرة آثامك. قد هتكت أذيالك، واغتصب جسدك."]]}, {"l": "Jer 13:26", "n": "", "vs": [[26, "فأنا أيضا أرفع أذيالك على وجهك لينكشف عارك."]]}, {"l": "Eze 16:37", "n": "", "vs": [[37, "ها أنا أحشد جميع عشاقك الذين تلذذت بهم، وجميع من تدلهت بهم مع كل الذين أبغضتهم فأجمعهم عليك من كل ناحية، وأكشف عن عريك فيشاهدون عورتك كلها،"]]}, {"l": "Eze 23:29", "n": "", "vs": [[29, "فيعاملونك ببغض ويستولون على كل ثمار تعبك، ويتركونك متجردة عارية، فتنفضح عورة زناك وعهرك."]]}, {"l": "Mic 1:11", "n": "", "vs": [[11, "اخرجوا ياأهل شافير عرايا مجللين بالعار، وليمكث سكان صانان في منازلهم خجلا. وعندما تسمعون عويل أهل هأيصل تدركون أنها قد سقطت ولا ملجأ لكم فيها."]]}, {"l": "Hab 2:16", "n": "", "vs": [[16, "فأنت تشبع خزيا عوض المجد، فاشرب أنت، وترنح، فإن كأس يمين الرب تدور عليك ويجلل العار مجدك."]]}], "kwAr": "فأكشف عارك", "noteAr": ""}], "arS": [["ها", ["H2009"]], [" أنا ", []], ["أقاومك", ["H413"]], ["، ", []], ["يقول", ["H5002"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["القدير", ["H6635"]], ["، ", []], ["فأكشف", ["H1540"]], [" ", []], ["عارك", ["H7757"]], [" ", []], ["لأطلع", ["H7200"]], [" ", []], ["الأمم", ["H1471"]], [" على ", []], ["عورتك", ["H4626"]], [" ", []], ["والممالك", ["H4467"]], [" على ", []], ["خزيك", ["H7036"]], [".", []]]}, {"c": 3, "v": 6, "text": "وألوثك بالأوساخ وأحقرك وأجعلك عبرة.", "groups": [{"kw": "I will cast", "raw": "Job_9:31, Job_30:19; Psa_38:5-7; Lam_3:16; Mal_2:2; 1Co_4:13", "note": "", "refs": [{"l": "Job 9:31", "n": "", "vs": [[31, "فإنك تطرحني في مستنقع نتن حتى تكرهني ثيابي"]]}, {"l": "Job 30:19", "n": "", "vs": [[19, "قد طرحني الله في الحمأة فأشبهت التراب والرماد."]]}, {"l": "Psa 38:5-7", "n": "", "vs": [[5, "أنتنت جراحي وسال صديدها بسبب جهالتي."], [6, "انحنيت والتويت. ودام نحيبي طول النهار."], [7, "امتلأ داخلي  "n": "", "vs": [[10, "فإن رقباءهم عمي، وكلهم جهال، وكلاب بكم عاجزون عن النباح، حالمون راقدون مولعون بالنوم."]]}, {"l": "Jer 51:39", "n": "", "vs": [[39, "عند شبعهم أعد لهم مأدبة وأسكرهم حتى تأخذهم النشوة فينامون نوما أبديا لا يقظة منه، يقول الرب."]]}, {"l": "Jer 51:57", "n": "", "vs": [[57, "إني أسكر رؤساءها وحكماءها ومحاربيها، فينامون نوما أبديا لا يقظة منه، يقول الملك، الرب القدير اسمه."]]}], "kwAr": "رعاتك", "noteAr": "أي الحكام والأمراء التابعون الذين تخلوا، كما يخبرنا هيرودوتس، عن نينوى في يوم ضيقها ولم يأتوا لنجدتها. ويقول ديودورس أيضا إنه لما حبس العدو الملك في المدينة ثارت أمم كثيرة، وانحاز كل منها إلى المحاصرين طلبا لحريته؛ وإن الملك أرسل رسلا إلى جميع رعاياه يطلب منهم قوة لنجدته، وظن أنه قادر على تحمل الحصار، وبقي ينتظر جيوشا تُجمع من أنحاء إمبراطوريته، معتمدا على نبوءة تقول إن المدينة لن تؤخذ ما لم يصر النهر عدوا لها. انظر نا 2: 6؛ خر 15: 16؛ مز 76: 5، 6؛ إش 56: 9"}, {"kw": "O King", "raw": "Jer_50:18; Ezek. 31:3-18, Eze_32:22, Eze_32:23", "note": "", "refs": [{"l": "Jer 50:18", "n": "", "vs": [[18, "لذلك هذا ما يعلنه الرب القدير إله إسرائيل: ها أنا أعاقب ملك بابل وأرضه. كما عاقبت ملك أشور من قبل."]]}, {"l": "Eze 31:3-18", "n": "", "vs": [[3, "إنني أشبهك بشجرة أرز في لبنان، بهية الأغصان، وارفة الظل، شامخة تطاول قمتها الغيوم،"], [4, "ترويها المياه، وتنميها اللجج. تجري أنهارها حول مغرسها، وتنساب جداولها إلى كل أشجار الحقل."], [5, "لهذا طاولت قامتها خميع أشجار الحقل وتكاثرت أغصانها، وامتدت فروعها التي نبتت لغزارة مياهها."], [6, "وعششت في أغصانها كل طيور السماء، وتحت فروعها ولدت كل حيوان البر، وأوت تحت ظلها كل أمم الأرض العظيمة."], [7, "فكانت رائعة في عظمتها وفي شموخ قامتها لأن جذورها كانت مغروسة في مياه غريرة."], [8, "لم يضاهها الأرز في جنة الله، ولم يعادل السرو أغصانها، ولم يماثل الدلب فروعها. كل الأشجار في جنة الله لم تشبهها في حسنها."], [9, "جعلتها بهية لكثرة أغصانها حتى حسدتها كل أشجار عدن التي في جنة الله."], [10, "لذلك يقول السيد الرب: لأنك يافرعون شمخت بقامتك وطاولت بهامتك الغيوم، تكبر قلبك من جراء عظمتك."], [11, "أسلمتك إلى يد المتسلط على الأمم فيعاملك أقسى معاملة. إني نبذتك لفرط شرك."], [12, "ويستأصله الغرباء عتاة الأمم، ويتركونه، فتتهاوى أغصانه على الجبال وفي جميع الوهاد، وتتحطم فروعه إلى جوار كل أنهار الأرض، ويهجر ظله كل شعوب الأرض وينبذونه."], [13, "وتجثم على حطامه طيور السماء جميعها، وتربض فوق قضبانه كل حيوان البر"], [14, "لئلا تشمخ شجرة ما مغروسة على المياه لاَرتفاع قامتها، ولا تطاول بهامتها الغيوم، ولكي لا تبلغ أية شجرة ترويها المياه مثل هذا العلو، لأنها جميعها مآلها الموت، حيث تمضي إلى الأرض السفلى بين الفانين من بني آدم، مع الهابطين إلى الهاوية."], [15, "وهذا ما يعلنه السيد الرب: وفي يوم هبوطه إلى الهاوية يعم النواح الطبيعة، فأكسو الغمر ثياب الحداد عليه، وأكبح جريان أنهاره، وتكف مياهه عن التدفق وأجعل لبنان ينوح عليه، وتذبل كل أشجار الحقل حزنا على هلاكه."], [16, "من جلبة سقوطه حين أنزلته إلى الهاوية مع الهابطين إليها ارتعدت الأمم، فتتعزى في الأرض السفلى كل أشجار عدن ونخبة أشجار لبنان، وكل مرتوية من ماء."], [17, "هم أيضا ينحدرون معه إلى الهاوية لينضموا إلى قتلى السيف، وكذلك يهلك حلفاؤه من الأمم المقيمين تحت ظله."], [18, "من ماثلت بين أشجار عدن في المجد والعظمة؟ ستنحدر إلى الأرض السفلى مع أشجار عدن، وترقد مع الغلف، مع المقتولين بالسيف. هذا هو مصير فرعون وكل شعبه، يقول السيد الرب»."]]}, {"l": "Eze 32:22", "n": "", "vs": [[22, "هناك أشور وقومه جميعا قد أحاطت به قبورهم. كلهم صرعى السيف."]]}, {"l": "Eze 32:23", "n": "", "vs": [[23, "الذين صارت قبورهم في أسافل الجب، وحوله قبور حلفائه، كلهم قتلى، صرعى السيف. أولئك الذين أشاعوا الرعب في أرض الأحياء."]]}], "kwAr": "ياملك أشور", "noteAr": ""}, {"kw": "nobles", "raw": "or, valiant ones, Isa_47:1; Rev_6:15", "note": "or, valiant ones, Isa_47:1; Rev_6:15", "refs": [{"l": "Isa 47:1", "n": "", "vs": [[1, "انزلي واجلسي على التراب أيتها العذراء ابنة بابل. اجلسي على الأرض لا على العرش ياابنة الكلدانيين، لأنك لن تدعي من بعد الناعمة المترفهة."]]}, {"l": "Rev 6:15", "n": "", "vs": [[15, "وملوك الأرض والعظماء والقواد والأغنيا ء والأقوياء والعبيد والأحرار كلهم اختبأوا في المغاور وصخور الجبال،"]]}], "kwAr": "عظماؤك", "noteAr": "أو: «الأبطال». انظر إش 47: 1؛ رؤ 6: 15"}, {"kw": "thy people", "raw": "1Ki_22:17; Isa_13:14", "note": "", "refs": [{"l": "1Ki 22:17", "n": "", "vs": [[17, "عندئذ قال ميخا: «رأيت كل إسرائيل مبددين على الجبال كخراف بلا راع. فقال الرب: ليس لهؤلاء قائد، فليرجع كل واحد منهم إلى بيته بسلام»."]]}, {"l": "Isa 13:14", "n": "", "vs": [[14, "وتولي جيوش بابل الأدبار حتى ينهكها التعب، عائدين إلى أرضهم كأنهم غزال مطارد أو غنم لا راعي لها."]]}], "kwAr": "شعبك", "noteAr": ""}], "arS": [["قد ", []], ["نام", ["H5123"]], [" ", []], ["رعاتك", ["H7462"]], [" ", []], ["ياملك", ["H4428"]], [" ", []], ["أشور", ["H804"]], ["، ", []], ["وغرق", ["H7931"]], [" ", []], ["عظماؤك", ["H117"]], [" في سبات عميق، ", []], ["تشتت", ["H6335"]], [" ", []], ["شعبك", ["H5971"]], [" ", []], ["على", ["H5921"]], [" ", []], ["الجبال", ["H2022"]], [" ", []], ["ولا", ["H369"]], [" يوجد من ", []], ["يجمعهم", ["H6908"]], [".", []]]}, {"c": 3, "v": 19, "text": "لا جبر لكسرك، وجرحك مميت. وكل من يسمع بما جرى لك يصفق ابتهاجا لما أصابك، فمن لم يعان من شرك المتمادي؟", "groups": [{"kw": "no", "raw": "Jer_30:13-15, Jer_46:11; Eze_30:21, Eze_30:22; Mic_1:9; Zep_2:13-15", "note": "", "refs": [{"l": "Jer 30:13-15", "n": "", "vs": [[13, "إذ لا يوجد من يدافع عن دعواك، ولا عقار لجرحك، ولا دواء لك."], [14, "قد نسيك محبوك، وأهملوك إهمالا، لأني ضربتك كما يضرب عدو، وعاقبتك عقاب مبغض قاس، لأن إثمك عظيم وخطاياك متكاثرة."], [15, "لماذا تنوحين من ضربتك؟ إن جرحك مستعص من جراء إثمك العظيم وخطاياك المتكاثرة، لهذا أوقعت بك المحن."]]}, {"l": "Jer 46:11", "n": "", "vs": [[11, "اصعدي إلى جلعاد وخذي بلسانا ياعذراء ابنة مصر. ولكن باطلا تكثرين من العقاقير، إذ لا شفاء لك."]]}, {"l": "Eze 30:21", "n": "", "vs": [[21, "«ياابن آدم، إني حطمت ذراع فرعون ملك مصر، ولن تجبر بالرفائد أو العصائب، فتجرد سيفا،"]]}, {"l": "Eze 30:22", "n": "", "vs": [[22, "وها أنا أنقلب على فرعون ملك مصر وأحطم ذراعيه، السليمة والمكسورة، وأسقط السيف من يده."]]}, {"l": "Mic 1:9", "n": "", "vs": [[9, "لأن جروح السامرة لن تندمل، وهي لابد أن تصيب يهوذا، ها هي قد بلغت أبواب شعبي أهل أورشليم."]]}, {"l": "Zep 2:13-15", "n": "", "vs": [[13, "ثم يبسط يده نحو الشمال ويبيد أشور ويجعل نينوى قفرا موحشا، أرضا قاحلة كالصحراء."], [14, "تربض في وسطها القطعان وسائر وحوش البر، ويأوي إلى تيجان أعمدتها القوق والقنفذ وينعب الغراب على عتباتها، لأن أرزها قد تعرى."], [15, "هذه هي المدينة الطروب التي سكنت آمنة قائلة لنفسها: أنا وليس لي نظير! كيف صارت أطلالا، ومأوى للوحوش البرية؟ كل من يجتاز بها يصفر دهشة ويهز يده»."]]}], "kwAr": "لا", "noteAr": ""}, {"kw": "healing", "raw": "Heb. wrinkling", "note": "Heb. wrinkling", "refs": [], "kwAr": "جبر", "noteAr": "بالعبرية: «تجعد»."}, {"kw": "the bruit", "raw": "Jer_10:22", "note": "", "refs": [{"l": "Jer 10:22", "n": "", "vs": [[22, "اسمعوا، ها أخبار تتواتر عن جيش عظيم مقبل من الشمال ليحول مدن يهوذا إلى خرائب ومأوى لبنات آوى."]]}], "kwAr": "يسمع", "noteAr": ""}, {"kw": "shall", "raw": "Job_27:23; Isa_14:8-21; Lam_2:15; Eze_25:6; Rev_18:20", "note": "", "refs": [{"l": "Job 27:23", "n": "", "vs": [[23, "تصفر الريح عليه، وترعبه بقوتها المدمرة."]]}, {"l": "Isa 14:8-21", "n": "", "vs": [[8, "حتى شجر السرو وأرز لبنان عمها الفرح فقالت: «منذ أن انكسرت شوكتك لم يصعد إلينا قاطع حطب»"], [9, "ثارت الهاوية من أسفل لاَستقبالك عند قدومك وحشدت الأخيلة، من كل العظماء، لتحيتك؛ أنهضت كل ملوك الأمم عن عروشهم"], [10, "كلهم يخاطبونك قائلين: لقد صرت ضعيفا مثلنا، أصبحت مماثلا لنا!"], [11, "طرحت كل عظمتك في الهاوية مع رنة عيدانك، وأصبحت الرمم فراشك والدود غطاء لك!"], [12, "كيف هويت من السماء يازهرة بنت الصبح؟ كيف قطعت وطرحت إلى الأرض ياقاهر الأمم؟"], [13, "قد قلت في قلبك: إني أرتقي إلى السماء وأرفع عرشي فوق كواكب الله، وأجلس على جبل الاجتماع في أقصى الشمال"], [14, "أرتقي فوق أعالي السحاب، وأصبح مثل العلي."], [15, "ولكنك طرحت إلى الهاوية، إلى أعماق الجب."], [16, "والذين يرونك يحملقون فيك ويتأملون متسائلين: أهذا هو الإنسان الذي زعزع الأرض وهز الممالك؟"], [17, "الذي حول المسكونة إلى مثل القفر، وقلب مدنها، ولم يطلق أسراه ليرجعوا إلى بيوتهم؟"], [18, "لقد رقد كل ملوك الأمم بكرامة، كل في ضريحه،"], [19, "أما أنت فقد طرحت بعيدا عن قبرك كغصن مكسور تغطيك رمم قتلى المعارك الذين انحدروا إلى مقر الموتى، وصرت كجنة داستها حوافر الخيل"], [20, "لا تنضم إليهم في مدفن، لأنك خربت أرضك، وذبحت شعبك، فذرية فاعلي الإثم يبيد ذكرها إلى الأبد."], [21, "أعدوا مذبحة لأبنائه جزاء إثم آبائهم، لئلا يقوموا ويرثوا الأرض فيملأوا وجه البسيطة مدنا."]]}, {"l": "Lam 2:15", "n": "", "vs": [[15, "كل عابري السبيل صفقوا عليك بالأيادي فرحا. صفروا وهزوا رؤوسهم على ابنة أورشليم وتساءلوا: أهذه هي المدينة التي تدعى كاملة الجمال وبهجة الأرض بأسرها؟"]]}, {"l": "Eze 25:6", "n": "", "vs": [[6, "لأنك صفقت بكفيك طربا، وخبطت برجليك، وفرحت بكل ما فيك من لؤم لما حل بأرض إسرائيل."]]}, {"l": "Rev 18:20", "n": "", "vs": [[20, "اشمتي بها أيتها السماء! واشمتوا بها أيها القديسون والرسل والأنبياء، فقد أصدر الله حكمه عليها بعدما أصدرت أحكامها عليكم»."]]}], "kwAr": "يصفق", "noteAr": ""}, {"kw": "upon", "raw": "Nah_2:11, Nah_2:12; Isa_10:6-14, Isa_37:18; Rev_13:7, Rev_17:2, Rev_18:2, Rev_18:3", "note": "", "refs": [{"l": "Nah 2:11", "n": "", "vs": [[11, "أين نينوى عرين الأسود ومرتع الأشبال حيث يسرح الأسد واللبوءة والأشبال من غير إزعاج؟"]]}, {"l": "Nah 2:12", "n": "", "vs": [[12, "قد افترس الأسد ما يكفي لإعالة أشباله وخنق فريسة للبوءاته. قد ملأ عرينه بقنائصه وكهفه بأشلائهم."]]}, {"l": "Isa 10:6-14", "n": "", "vs": [[6, "أرسلهم ضد أمة منافقة، وأوصيهم على شعبي الذي غضبت عليه، ليغنموا غنائمهم ويستولوا على أسلابهم، ويطأوهم كما يطأون الوحل."], [7, "ولكن ملك أشور لا يعرف أنني أنا الذي أرسلته، ويظن أنه بقدرته قد هاجم شعبي، وفي نيته أن يدمر ويجتاح أمما كثيرة."], [8, "لأنه يقول: أليس كل قوادي ملوكا؟"], [9, "أليس مصير كلنو كمصير كركميش؟ أو ليس مآل حماة كمآل أرفاد؟ أليست السامرة كدمشق؟"], [10, "لقد قضيت على ممالك وثنية أصنامها أعظم من أصنام أورشليم والسامرة!"], [11, "أفلا أقضي على أورشليم وأصنامها كما قضيت على السامرة وأصنامها؟"], [12, "ولكن حالما ينتهي الرب من عمله بجبل صهيون، فإنه سيعاقب ملك أشور على غرور قلبه وتشامخ عينيه،"], [13, "لأنه يقول: بقوة ذراعي قد صنعت هذا، وبحكمتي، لأنني فهيم! قد نقلت تخوم الأمم، ونهبت كنوزهم، وعزلت الجالسين على العروش كما يفعل ذو البطش."], [14, "وكما تستحوذ يد الإنسان على العش، هكذا استحوذت يدي على ثروات الشعوب. وكما يجمع الإنسان البيض المهجور، هكذا جمعت الأرض بأسرها، فلم يجرؤ أحد أن يحرك جناحا أو يفتح فاها أو ينبس بهمسة."]]}, {"l": "Isa 37:18", "n": "", "vs": [[18, "حقا يارب، إن ملوك أشور قد أبادوا الأمم ودمروا ديارهم"]]}, {"l": "Rev 13:7", "n": "", "vs": [[7, "وأعطي الوحش قدرة على أن يحارب القديسين ويهزمهم وسلطة على كل قبيلة وشعب ولغة وأمة."]]}, {"l": "Rev 17:2", "n": "", "vs": [[2, "والتي زنى معها ملوك الأرض، وسكر أهل الأرض من خمر زناها»."]]}, {"l": "Rev 18:2", "n": "", "vs": [[2, "وصاح بأعلى صوته: «سقطت، سقطت بابل العظمى، وصارت وكرا للشياطين ومأوى لكل روح نجس ولكل طائر نجس مكروه،"]]}, {"l": "Rev 18:3", "n": "", "vs": [[3, "لأن جميع الأمم شربت من خمر زناها، وملوك الأرض زنوا معها، وتجار الأرض اغتنوا من كثرة ترفها!»"]]}], "kwAr": "لما أصابك", "noteAr": ""}], "arS": [["لا", ["H369"]], [" ", []], ["جبر", ["H3545"]], [" ", []], ["لكسرك", ["H7667"]], ["، ", []], ["وجرحك", ["H4347"]], [" ", []], ["مميت", ["H2470"]], [". ", []], ["وكل", ["H3605"]], [" من ", []], ["يسمع", ["H8085"]], [" ", []], ["بما", ["H8088"]], [" جرى لك ", []], ["يصفق", ["H8628"]], [" ", []], ["ابتهاجا", ["H3709"]], [" ", []], ["لما", ["H5921"]], [" أصابك، ", []], ["فمن", ["H5921", "H4310"]], [" ", []], ["لم", ["H3808"]], [" يعان من ", []], ["شرك", ["H7451"]], [" ", []], ["المتمادي", ["H5674", "H8548"]], ["؟", []]]}], "strong": true}];</script>
