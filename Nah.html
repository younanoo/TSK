<script>window.CATALOG=[{"id": 17, "abbr": "Est", "en": "Esther", "nc": 10, "nv": 167, "refs": 1266, "last": "10:3", "first": "وحدث في أيام أحشويروش، الذي امتد حكمه من الهند إلى كوش، فملك على مئة وسبعة وعشرين إقليما،"}, {"id": 18, "abbr": "Job", "en": "Job", "nc": 42, "nv": 1070, "refs": 10209, "last": "42:17", "first": "عاش في أرض عوص رجل اسمه أيوب، كان صالحا كاملا يتقي الله ويحيد عن الشر."}, {"id": 19, "abbr": "Psa", "en": "Psalms", "nc": 150, "nv": 2461, "refs": 33395, "last": "150:6", "first": "طوبى للإنسان الذي لا يتبع مشورة الأشرار، ولا يقف في طريق الخاطئين، ولا يجالس المستهزئين."}, {"id": 20, "abbr": "Pro", "en": "Proverbs", "nc": 31, "nv": 915, "refs": 10457, "last": "31:31", "first": "هذه هي أمثال سليمان بن داود ملك إسرائيل،"}, {"id": 21, "abbr": "Ecc", "en": "Ecclesiastes", "nc": 12, "nv": 222, "refs": 3186, "last": "12:14", "first": "هذه أقوال الجامعة ابن داود ملك أورشليم."}, {"id": 22, "abbr": "Son", "en": "Song of Solomon", "nc": 8, "nv": 117, "refs": 1802, "last": "8:14", "first": "هذا نشيد الأناشيد لسليمان."}, {"id": 23, "abbr": "Isa", "en": "Isaiah", "nc": 66, "nv": 1292, "refs": 21959, "last": "66:24", "first": "هذه هي رؤيا إشعياء بن آموص، التي أعلنت له بشأن يهوذا وأورشليم في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا."}, {"id": 24, "abbr": "Jer", "en": "Jeremiah", "nc": 52, "nv": 1364, "refs": 20659, "last": "52:34", "first": "هذه نبوءة إرميا بن حلقيا أحد الكهنة المقيمين في عناثوث بأرض سبط بنيامين."}, {"id": 25, "abbr": "Lam", "en": "Lamentations", "nc": 5, "nv": 154, "refs": 2238, "last": "5:22", "first": "كيف أصبحت المدينة الآهلة بالسكان مهجورة وحيدة؟ صارت كأرملة! هذه التي كانت عظيمة بين الأمم. السيدة بين المدن صارت تحت الجزية!"}, {"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 48, "nv": 1273, "refs": 15264, "last": "48:35", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 34, "abbr": "Nah", "en": "Nahum", "verses": [{"c": 1, "v": 1, "text": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي.", "groups": [{"kw": "burden", "raw": "Isa_13:1, Isa_14:28, Isa_15:1, Isa_21:1, Isa_22:1, Isa_23:1; Jer_23:33-37; Zec_9:1", "note": "", "refs": [{"l": "Isa 13:1", "n": "", "vs": [[1, "رؤيا إشعياء بن آموص بشأن بابل:"]]}, {"l": "Isa 14:28", "n": "", "vs": [[28, "وفي السنة التي توفي فيها الملك آحاز أوحى الرب لإشعياء:"]]}, {"l": "Isa 15:1", "n": "", "vs": [[1, "رؤيا بشأن موآب: حقا في ليلة مباغتة تخرب عار موآب، حقا في ليلة مباغتة تدمر قير موآب."]]}, {"l": "Isa 21:1", "n": "", "vs": [[1, "نبوءة بشأن بابل: كما تعبر الزوابع في النقب، هكذا يقبل الغازي من الصحراء، من أرض الرعب."]]}, {"l": "Isa 22:1", "n": "", "vs": [[1, "نبوءة بشأن أورشليم: ماذا حدث حتى إنكم جميعا صعدتم إلى سطوح المنازل؟"]]}, {"l": "Isa 23:1", "n": "", "vs": [[1, "نبوءة بشأن صور: ولولي ياسفن ترشيش، لأن صور قد هدمت، فلم يبق بيت ولا مرفأ. تماما كما بلغكم النبأ وأنتم في أرض قبرص."]]}, {"l": "Jer 23:33-37", "n": "", "vs": [[33, "إذا سألك أحد من هذا الشعب أو نبي أو كاهن: ما هو وحي قضاء الرب؟ فأجبهم: أنتم وحي قضائه. وسأطرحكم، يقول الرب."], [34, "أما النبي أو الكاهن أو أي واحد من الشعب يدعي قائلا: هذا وحي الرب، فإني سأعاقبه مع أهل بيته."], [35, "لذلك هكذا يواظب كل واحد على القول لصاحبه، وكل جار لجاره: ما هو جواب الرب؟ أو بماذا تكلم الرب؟"], [36, "أما ادعاء وحي الرب فلا تذكروه من بعد، فإن كلمة المرء تغدو وحي قضائه، إذ قد حرفتم كلام الإله الحي، الرب القدير، إلهنا."], [37, "لذلك هذا ما تسأل به النبي: بماذا أجاب الرب، وبماذا تكلم؟»"]]}, {"l": "Zec 9:1", "n": "", "vs": [[1, "وحي قضاء الرب بعقاب أرض حدراخ ودمشق، لأن أعين الناس وسائر أسباط إسرائيل نحو الرب."]]}], "kwAr": "وحي", "noteAr": ""}, {"kw": "Nineveh", "raw": "Gen_10:11; Jon_3:3, Jon_3:4; Zep_2:13", "note": "", "refs": [{"l": "Gen 10:11", "n": "", "vs": [[11, "ومن تلك الأرض خرج أشور وبنى مدن نينوى ورحبوت عير وكالح،"]]}, {"l": "Jon 3:3", "n": "", "vs": [[3, "فهب يونان وتوجه إلى نينوى بموجب أمر الرب. وكانت نينوى مدينة بالغة العظمة يستغرق اجتيازها ثلاثة أيام."]]}, {"l": "Jon 3:4", "n": "", "vs": [[4, "فدخل يونان المدينة واجتاز فيها مسيرة يوم واحد، وابتدأ ينادي قائلا: «بعد أربعين يوما تتدمر المدينة»."]]}, {"l": "Zep 2:13", "n": "", "vs": [[13, "ثم يبسط يده نحو الشمال ويبيد أشور ويجعل نينوى قفرا موحشا، أرضا قاحلة كالصحراء."]]}], "kwAr": "نينوى", "noteAr": ""}], "arS": [["وحي", ["H4853"]], [" بشأن ", []], ["نينوى", ["H5210"]], ["، كما ورد في ", []], ["كتاب", ["H5612"]], [" ", []], ["رؤيا", ["H2377"]], [" ", []], ["ناحوم", ["H5151"]], [" ", []], ["الألقوشي", ["H512"]], [".", []]]}, {"c": 1, "v": 2, "text": "الرب إله غيور ومنتقم. الرب منتقم وساخط ينتقم من أعدائه، ويضمر الغضب لخصومه.", "groups": [{"kw": "God is jealous, and the Lord revengeth", "raw": "or, The Lord is a jealous God, and a revenger, Exo_20:5, Exo_34:14; Deu_4:24; Jos_24:19; Isa_42:13; Eze_38:18, Eze_39:25; Joe_2:18; Zec_1:14, Zec_8:2", "note": "or, The Lord is a jealous God, and a revenger, Exo_20:5, Exo_34:14; Deu_4:24; Jos_24:19; Isa_42:13; Eze_38:18, Eze_39:25; Joe_2:18; Zec_1:14, Zec_8:2", "refs": [{"l": "Exo 20:5", "n": "", "vs": [[5, "لا تسجد لهن ولا تعبدهن، لأني أنا الرب إلهك، إله غيور، أفتقد آثام الآباء في البنين حتى الجيل الثالث والرابع من مبغضي،"]]}, {"l": "Exo 34:14", "n": "", "vs": [[14, "إياكم أن تعبدوا إلها آخر غيري، لأن الرب اسمه غيور جدا."]]}, {"l": "Deu 4:24", "n": "", "vs": [[24, "لأن الرب إلهكم هو نار آكلة وإله غيور."]]}, {"l": "Jos 24:19", "n": "", "vs": [[19, "فقال لهم يشوع: «لن تقدروا أن تعبدوا الرب حق العبادة لأنه إله قدوس وغيور ولن يغفر لكم خطاياكم وذنوبكم."]]}, {"l": "Isa 42:13", "n": "", "vs": [[13, "يبرز الرب كجبار، يستثير حميته كما يستثيرها المحارب، ويطلق صرخة حرب داوية، يظهر جبروته أمام أعدائه."]]}, {"l": "Eze 38:18", "n": "", "vs": [[18, "ويقول السيد الرب: في ذلك اليوم عندما يزحف جوج على أرض إسرائيل يحتدم غضبي في وجهي."]]}, {"l": "Eze 39:25", "n": "", "vs": [[25, "أما الآن فها أنا أرد سبي ذرية يعقوب وأرحم كل شعب إسرائيل وأغار على اسمي القدوس،"]]}, {"l": "Joe 2:18", "n": "", "vs": [[18, "عندئذ يغار الرب على أرضه ويرق لشعبه."]]}, {"l": "Zec 1:14", "n": "", "vs": [[14, "ثم خاطبني الملاك قائلا: «ناد، هذا ما يقوله الرب القدير: إني قد غرت على أورشليم وعلى صهيون غيرة عظيمة."]]}, {"l": "Zec 8:2", "n": "", "vs": [[2, "«هذا ما يقوله الرب القدير: إني أغار على صهيون غيرة عظيمة مفعمة بغضب شديد على أعدائها."]]}], "kwAr": "إله غيور ومنتقم", "noteAr": "أو: «الرب إله غيور ومنتقم». انظر خر 20: 5؛ 34: 14؛ تث 4: 24؛ يش 24: 19؛ إش 42: 13؛ حز 38: 18؛ 39: 25؛ يوء 2: 18؛ زك 1: 14؛ 8: 2"}, {"kw": "revengeth", "raw": "Deu_32:35, Deu_32:42; Psa_94:1; Isa_59:17, Isa_59:18; Rom_12:19, Rom_13:4; Heb_10:30", "note": "", "refs": [{"l": "Deu 32:35", "n": "", "vs": [[35, "لي النقمة وأنا أجازي. وفي الوقت المعين تزل أقدامهم فيوم هلاكهم بات وشيكا، ومصيرهم المحتوم يسرع إليهم،"]]}, {"l": "Deu 32:42", "n": "", "vs": [[42, "أسكر سهامي بالدم ويلتهم سيفي لحما، من دم القتلى والسبايا ورؤوس قادة العدو."]]}, {"l": "Psa 94:1", "n": "", "vs": [[1, "يارب أنت إله الانتقام، فتجل بغضبك."]]}, {"l": "Isa 59:17", "n": "", "vs": [[17, "فتدرع بالبر وارتدى على رأسه خوذة الخلاص، واكتسى بثياب الانتقام، والتف بعباءة الغضب."]]}, {"l": "Isa 59:18", "n": "", "vs": [[18, "فهو يجازيهم بمقتضى أعمالهم. يجازي أعداءه، ويعاقب خصومه، وينزل القصاص بالجزائر،"]]}, {"l": "Rom 12:19", "n": "", "vs": [[19, "لا تنتقموا لأنفسكم، أيها الأحباء، بل دعوا الغضب لله، لأنه قد كتب: «لي الانتقام، أنا أجازي، يقول الرب»."]]}, {"l": "Rom 13:4", "n": "", "vs": [[4, "لأنها خادمة الله لك لأجل الخير. أما إن كنت تعمل الشر فخف، لأن السلطة لا تحمل السيف عبثا، إذ إنها خادمة الله، وهي التي تنتقم لغضبه ممن يفعل الشر."]]}, {"l": "Heb 10:30", "n": "", "vs": [[30, "فنحن نعرف من قال: «لي الانتقام، أنا أجازي، يقول الرب!» وأيضا: «إن الرب سوف يحاكم شعبه!»"]]}], "kwAr": "منتقم", "noteAr": ""}, {"kw": "is furious", "raw": "Heb. that hath fury, Lev_26:28; Job_20:23; Isa_51:17, Isa_51:20, Isa_59:18, Isa_63:3-6, Isa_66:15; Jer_4:4, Jer_25:15, Jer_36:7; Lam_4:11; Eze_5:13, Eze_6:12, Eze_8:18, Eze_36:6; Mic_5:15; Zec_8:2", "note": "Heb. that hath fury, Lev_26:28; Job_20:23; Isa_51:17, Isa_51:20, Isa_59:18, Isa_63:3-6, Isa_66:15; Jer_4:4, Jer_25:15, Jer_36:7; Lam_4:11; Eze_5:13, Eze_6:12, Eze_8:18, Eze_36:6; Mic_5:15; Zec_8:2", "refs": [{"l": "Lev 26:28", "n": "", "vs": [[28, "فإني أزيد في احتدام غضبي، من عدائي لكم وأضاعف عقابي سبع مرات أخرى وفقا لخطاياكم،"]]}, {"l": "Job 20:23", "n": "", "vs": [[23, "وعندما يملأ بطنه ينفث عليه الله غضبه الحارق ويمطره عليه طعاما له."]]}, {"l": "Isa 51:17", "n": "", "vs": [[17, "استيقظي، استيقظي، انهضي ياأورشليم، يامن تجرعت من يد الرب كأس غضبه، يامن شربت ثمالة كأس الترنح."]]}, {"l": "Isa 51:20", "n": "", "vs": [[20, "قد أعيا أبناؤك وانطرحوا عند رأس كل شارع كوعل وقع في شبكة. امتلأوا من غضب الرب ومن زجر إلهك."]]}, {"l": "Isa 59:18", "n": "", "vs": [[18, "فهو يجازيهم بمقتضى أعمالهم. يجازي أعداءه، ويعاقب خصومه، وينزل القصاص بالجزائر،"]]}, {"l": "Isa 63:3-6", "n": "", "vs": [[3, "لقد دست المعصرة وحدي، ولم يكن معي أحد من الشعوب. قد دستهم في سخطي ووطئتهم في غيظي، فتناثر دمهم على ردائي ولطخت ثيابي."], [4, "لأن يوم الانتقام كان كامنا في قلبي، وسنة مفديي قد أتت."], [5, "تلفت فلم أعثر على معين، وعجبت إذ لم يكن من ناصر، فانتصرت بقوة ذراعي، وتأيدت بنجدة سخطي،"], [6, "فدست الشعوب في غيظي، وأسكرتهم في غضبي، وسكبت دماءهم فوق الأرض."]]}, {"l": "Isa 66:15", "n": "", "vs": [[15, "لأنه ها هو الرب مقبل بنار، ومركباته كالعاصفة، ليسكب غضبه بسخط، وزجره بلهيب نار."]]}, {"l": "Jer 4:4", "n": "", "vs": [[4, "اختتنوا للرب، وأزيلوا قلف قلوبكم (أي طهروا عقولكم وقلوبكم وليس أجسادكم فقط) لئلا يتفجر غضبي كنار فتحرق وليس من يخمدها، من جراء أعمالكم الشريرة."]]}, {"l": "Jer 25:15", "n": "", "vs": [[15, "وهذا ما أعلنه لي الرب إله إسرائيل: «خذ كأس خمر غضبي من يدي، واسق منها جميع الأمم التي أرسلك إليها،"]]}, {"l": "Jer 36:7", "n": "", "vs": [[7, "لعل تضرعهم يرتفع أمام الرب، فيرجع كل واحد منهم عن غوايته لأن غضب الرب وسخطه الذين قضى بهما على هذا الشعب هائلان»."]]}, {"l": "Lam 4:11", "n": "", "vs": [[11, "نفث الرب كامل سخطه وصب حمو غضبه، وأضرم نارا في صهيون فالتهمت أسسها."]]}, {"l": "Eze 5:13", "n": "", "vs": [[13, "وهكذا أنفس عن غضبي ويخمد سخطي إذ أكون قد انتقمت. وحين يستكين حنقي عليهم يدركون أني أنا الرب الذي أصدرت قضائي في احتدام غيرتي."]]}, {"l": "Eze 6:12", "n": "", "vs": [[12, "يموت البعيد بالوباء، والقريب يصرعه السيف، والباقي منهم والمحاصر تقضي عليهم المجاعة. وهكذا أنفث فيهم حنقي."]]}, {"l": "Eze 8:18", "n": "", "vs": [[18, "لذلك أعاقبهم بالغضب، ولا تترَأف عيني عليهم، ولا أعفو، وإن استغاثوا بصوت عال لا أستجيب لهم»."]]}, {"l": "Eze 36:6", "n": "", "vs": [[6, "لذلك تنبأ عن أرض إسرائيل وقل للجبال والتلال والأودية: هذا ما يعلنه السيد الرب: ها أنا في غيرتي وسخطي قد أصدرت قضائي لأنكم قد تحملتم تعيير الأمم،"]]}, {"l": "Mic 5:15", "n": "", "vs": [[15, "وبغضب وسخط أنتقم من الأمم التي لم تطعني."]]}, {"l": "Zec 8:2", "n": "", "vs": [[2, "«هذا ما يقوله الرب القدير: إني أغار على صهيون غيرة عظيمة مفعمة بغضب شديد على أعدائها."]]}], "kwAr": "وساخط", "noteAr": "بالعبرية: «صاحب غيظ». انظر لا 26: 28؛ أي 20: 23؛ إش 51: 17، 20؛ 59: 18؛ 63: 3-6؛ 66: 15؛ إر 4: 4؛ 25: 15؛ 36: 7؛ مرا 4: 11؛ حز 5: 13؛ 6: 12؛ 8: 18؛ 36: 6؛ مي 5: 15؛ زك 8: 2"}, {"kw": "reserveth", "raw": "Deu_32:34, Deu_32:35, Deu_32:41-43; Jer_3:5; Mic_7:18; Rom_2:5, Rom_2:6; 2Pe_2:9", "note": "", "refs": [{"l": "Deu 32:34", "n": "", "vs": [[34, "أليس هذا مدخرا عندي مختوما عليه في خزائني؟"]]}, {"l": "Deu 32:35", "n": "", "vs": [[35, "لي النقمة وأنا أجازي. وفي الوقت المعين تزل أقدامهم فيوم هلاكهم بات وشيكا، ومصيرهم المحتوم يسرع إليهم،"]]}, {"l": "Deu 32:41-43", "n": "", "vs": [[41, "إذا سننت سيفي البارق وأمسكت به يدي للقضاء، فإني أنتقم من أعدائي، وأجازي مبغضي."], [42, "أسكر سهامي بالدم ويلتهم سيفي لحما، من دم القتلى والسبايا ورؤوس قادة العدو."], [43, "تهللي أيتها الأمم مع شعبه، لأنه سينتقم لدماء عبيده ويثأر من أعدائه ويصفح عن أرضه وعن شعبه»."]]}, {"l": "Jer 3:5", "n": "", "vs": [[5, "أيظل غاضبا دائما؟ أيبقى ساخطا إلى الأبد؟ انظري، هذا ما نطقت به، ولكنك ارتكبت كل ما استطعت من شر»."]]}, {"l": "Mic 7:18", "n": "", "vs": [[18, "إي إله مثلك يصفح عن الإثم ويعفو عن معصية بقية ميراثه؟ لا يحتفظ إلى الأبد بغضبه لأنه يسر بالرحمة."]]}, {"l": "Rom 2:5", "n": "", "vs": [[5, "ولكنك بسبب قساوتك وقلبك غير التائب، تخزن لنفسك غضبا ليوم الغضب، يوم تعلن دينونة الله العادلة."]]}, {"l": "Rom 2:6", "n": "", "vs": [[6, "فإنه سيجازي كل إنسان بحسب أعماله."]]}, {"l": "2Pe 2:9", "n": "", "vs": [[9, "وهكذا نرى أن الرب يعرف أن ينقذ الأتقياء من المحنة، ويحفظ الأشرار محبوسين ليحكم عليهم بالعقاب في يوم الدينونة."]]}], "kwAr": "ويضمر", "noteAr": ""}], "arS": [["الرب", ["H3068"]], [" ", []], ["إله", ["H410"]], [" ", []], ["غيور", ["H7072"]], [" ", []], ["ومنتقم", ["H5358"]], [". ", []], ["الرب", ["H3068"]], [" ", []], ["منتقم", ["H5358"]], [" ", []], ["وساخط", ["H1167", "H2534"]], [" ", []], ["ينتقم", ["H5358"]], [" من ", []], ["أعدائه", ["H6862"]], ["، ", []], ["ويضمر", ["H5201"]], [" الغضب ", []], ["لخصومه", ["H341"]], [".", []]]}, {"c": 1, "v": 3, "text": "الرب بطيء في غضبه وعظيم العزة، إنما لا يبريء الخاطيء البتة. طريق الرب في الزوبعة والعاصفة، والغمام غبار قدميه.", "groups": [{"kw": "slow", "raw": "Exo_34:6, Exo_34:7; Neh_9:17; Psa_103:8, Psa_145:8; Joe_2:13; Jon_4:2; Jam_1:19", "note": "", "refs": [{"l": "Exo 34:6", "n": "", "vs": [[6, "وعبر من أمام موسى مناديا: «أنا الرب. الرب إله رؤوف رحيم، بطيء الغضب وكثير الإحسان والوفاء."]]}, {"l": "Exo 34:7", "n": "", "vs": [[7, "أدخر الإحسان وأغفر الإثم والمعصية والخطيئة. ولكني لا أعفي المذنب من العقاب، بل أفتقد إثم الآباء في الأبناء والأحفاد حتى الجيل الرابع»."]]}, {"l": "Neh 9:17", "n": "", "vs": [[17, "وأبوا أن يسمعوا، وتجاهلوا عجائبك التي أجريتها لهم، وأغلظوا قلوبهم، ثم تمردوا ونصبوا عليهم قائدا ليرجعوا إلى عبوديتهم، ولكنك إله غفور وحنان ورحيم وحكيم وكثير الإحسان، فلم تتخل عنهم،"]]}, {"l": "Psa 103:8", "n": "", "vs": [[8, "الرب رحيم ورؤوف، بطيء الغضب ووافر الرحمة."]]}, {"l": "Psa 145:8", "n": "", "vs": [[8, "الرب حنان ورحيم، بطيء الغضب ووافر الرأفة."]]}, {"l": "Joe 2:13", "n": "", "vs": [[13, "مزقوا قلوبكم لا ثيابكم. ارجعوا إلى الرب إلهكم لأنه رؤوف ورحيم بطيء الغضب وكثير الرأفة، ولا يسر بالعقاب."]]}, {"l": "Jon 4:2", "n": "", "vs": [[2, "وصلى إلى الرب قائلا: «أيها الرب، أليس هذا ما قلته عندما كنت في ]]}, {"l": "Deu 5:22-24", "n": "", "vs": [[22, "إن الرب قد أعلن بصوت عظيم هذه الكلمات لكل جماعتكم في الجبل من وسط النار والسحاب ولم يزد. ونقشها على لوحين من حجر وأعطاني إياها."], [23, "فلما سمعتم الصوت من وسط الظلام، والجبل يشتعل بالنار، أقبل علي جميع قادة أسباطكم وشيوخكم،"], [24, "وقالوا: قد أظهر الرب لنا مجده وعظمته، وسمعنا صوته من وسط النار، ورأينا في هذا اليوم أن الله يخاطب الإنسان فلا يموت."]]}, {"l": "1Ki 19:11-13", "n": "", "vs": [[11, "فقال له: «اخرج وقف على الجبل أمامي، لأني مزمع أن أعبر». ثم هبت ريح عاتية شقت الجبال وحطمت الصخور، ولكن الرب لم يكن في الريح. ثم حدثت زلزلة، ولم يكن الرب في الزلزلة."], [12, "وبعد الزلزلة اجتازت به نار، ولم يكن الرب في النار. وبعد النار رف في مسامع إيليا صوت منخفض هامس."], [13, "فلما سمع إيليا الصوت، لف وجهه بردائه، وخرج ووقف في باب الكهف. وإذا بصوت يخاطبه: «ماذا تفعل هنا ياإيليا؟»"]]}, {"l": "Job 38:1", "n": "", "vs": [[1, "ثم قال الرب لأيوب من العاصفة:"]]}, {"l": "Psa 18:7-15", "n": "", "vs": [[7, "عندئذ ارتجت الأرض وتزلزلت. ارتجفت أساسات الجبال واهتزت، لأن الرب غضب."], [8, "نفث أنفه دخانا، وانقذفت نار آكلة من فمه، وكأنها جمر ملتهب."], [9, "طأطأ السماوات ونزل، فكانت الغيوم المتجهمة تحت قدميه."], [10, "امتطى مركبة من ملائكة الكروبيم، وطار مسرعا على أجنحة الرياح."], [11, "جعل الظلمة ستارا له، وصار ضباب المياه وسحب السماء الداكنة مظلته المحيطة به."], [12, "من بهاء طلعته عبرت السحب أمامه. حدثت عاصفة برد وبرق كالجمر الملتهب."], [13, "أرعد الرب في السماوات، أطلق العلي صوته فانهمر برد، واندلعت نار!"], [14, "أطلق سهامه فبدد أعدائي، وأرسل بروقه فأزعجهم."], [15, "ظهرت مجاري المياه العميقة، وانكشفت أسس المسكونة من زجرك يارب، ومن أنفك اللافحة."]]}, {"l": "Psa 50:3", "n": "", "vs": [[3, "يأتي إلهنا ولا يصمت، تحيط به النار الآكلة والعواصف الثائرة."]]}, {"l": "Psa 97:2-5", "n": "", "vs": [[2, "حوله الغيوم والضباب، والعدل والحق قاعدة عرشه."], [3, "تخرج منه نار وتحرق خصومه المحيطين به."], [4, "أنارت بروقه المسكونة. رأت الأرض ذلك فارتجفت."], [5, "ذابت الجبال كالشمع من نظرة الرب سيد الأرض كلها."]]}, {"l": "Psa 104:3", "n": "", "vs": [[3, "المقي  الآلهة، لأن رحمته إلى الأبد تدوم."], [3, "ارفعوا الشكر لرب الأرباب، لأن رحمته إلى الأبد تدوم."], [4, "الصانع العجائب العظام وحده، لأن رحمته إلى الأبد تدوم."], [5, "الصانع السماوات بحكمة، لأن رحمته إلى الأبد تدوم."], [6, "الباسط الأرض فوق المياه، لأن رحمته إلى الأبد تدوم."], [7, "الصانع الأنوار العظيمة لأن رحمته إلى الأبد تدوم."], [8, "الشمس لتضيء نهارا، لأن رحمته إلى الأبد تدوم."], [9, "والقمر والكواكب لتنير ليلا، لأن رحمته إلى الأبد تدوم."], [10, "الذي ضرب مصر مع أبكارها، لأن رحمته إلى الأبد تدوم."], [11, "وأخرج بني إسرائيل من وسطهم، لأن رحمته إلى الأبد تدوم."], [12, "بيد شديدة وذراع قديرة، لأن رحمته إلى الأبد تدوم."], [13, "الذي فلق البحر الأحمر إلى شطرين، لأن رحمته إلى الأبد تدوم."], [14, "وأجاز الإسرائيليين في وسطه، لأن رحمته إلى الأبد تدوم."], [15, "ودفع فرعون وجيشه إلى البحر، لأن رحمته إلى الأبد تدوم."], [16, "الذي قاد شعبه في البرية، لأن رحمته إلى الأبد تدوم."], [17, "الذي أطاح بملوك عظماء. لأن رحمته إلى الأبد تدوم."], [18, "وقتل ملوكا ذوي شهرة، لأن رحمته إلى الأبد تدوم."], [19, "كسيحون ملك الأموريين، لأن رحمته إلى الأبد تدوم."], [20, "وعوج ملك باشان، لأن رحمته إلى الأبد تدوم."], [21, "وأعطى أرضهم ميراثا، لأن رحمته إلى الأبد تدوم."], [22, "ميراثا لإسرائيل عبده، لأن رحمته إلى الأبد تدوم."], [23, "الذي ذكرنا في مذلتنا، لأن رحمته إلى الأبد تدوم."], [24, "وخلصنا من أعدائنا، لأن رحمته إلى الأبد تدوم."], [25, "الذي يرزق خبزا كل بشر لأن رحمته إلى الأبد تدوم."], [26, "ارفعوا الشكر لإله السماوات، لأن رحمته إلى الأبد تدوم."]]}, {"l": "Psa 145:6-10", "n": "", "vs": [[6, "هم يخبرون بجبروت أفعالك الرهيبة، وأنا أذيع أعمالك العظيمة."], [7, "يفيضون بذكر صلاحك العميم وبعدلك يترنمون."], [8, "الرب حنان ورحيم، بطيء الغضب ووافر الرأفة."], [9, "الرب يغمر الجميع بصلاحه، ومراحمه تعم كل أعماله."], [10, "كل أعمالك تسبح بحمدك يارب، وأتقياؤك يباركونك،"]]}, {"l": "Jer 33:11", "n": "", "vs": [[11, "أصوات الطرب والسرور، وهتاف العريس والعروس، وأصوات المقبلين إلى هيكل الرب بقرابين الشكر القائلين: احمدوا الرب القدير، لأن الرب صالح ورحمته إلى الأبد تدوم، لأني أرد سبي الأرض فتصبح آهلة كالأيام الخوالي."]]}, {"l": "Lam 3:25", "n": "", "vs": [[25, "الرب صالح لمن يرجونه وللنفس التي تلتمسه."]]}, {"l": "Rom 11:22", "n": "", "vs": [[22, "فتأمل إذا لطف الله وشدته: أما الشدة، فعلى الذين سقطوا؛ وأما لطف الله فمن نحوك مادمت تثبت في اللطف. ولو لم تكن ثابتا، لكنت أنت أيضا تقطع."]]}, {"l": "1Jo 4:8-10", "n": "", "vs": [[8, "أما من لا يحب، فهو لم يتعرف بالله قط لأن الله محبة!"], [9, "وقد أظهر الله محبته لنا إذ أرسل ابنه الأوحد إلى العالم لكي نحيا به."], [10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."]]}], "kwAr": "الرب", "noteAr": ""}, {"kw": "strong hold", "raw": "or, strength, Psa_18:1, Psa_18:2, Psa_27:5, Psa_62:6-8, Psa_71:3, Psa_84:11, Psa_91:1, Psa_91:2, Psa_144:1, Psa_144:2; Pro_18:10; Isa_25:4, Isa_26:1-4, Isa_32:2", "note": "or, strength, Psa_18:1, Psa_18:2, Psa_27:5, Psa_62:6-8, Psa_71:3, Psa_84:11, Psa_91:1, Psa_91:2, Psa_144:1, Psa_144:2; Pro_18:10; Isa_25:4, Isa_26:1-4, Isa_32:2", "refs": [{"l": "Psa 18:1", "n": "", "vs": [[1, "أحبك يارب، يا قوتي."]]}, {"l": "Psa 18:2", "n": "", "vs": [[2, "الرب صخرتي وحصني ومنقذي. إلهي صخرتي به أحتمي. ترسي وركن خلاصي، وقلعتي الحصينة."]]}, {"l": "Psa 27:5", "n": "", "vs": [[5, "لأنه يحميني في يوم الشر تحت سقف بيته ويحرسني آمنا في خباء خيمته. إذ على صخرة عالية يرفعني."]]}, {"l": "Psa 62:6-8", "n": "", "vs": [[6, "هو وحده صخرتي وخلاصي وحصني المنيع، لذلك لا أتزعزع أبدا."], [7, "في الله خلاصي ومجدي. والله هو صخرة قوتي وملجإي."], [8, "ثقوا به في كل حين أيها الشعب. اسكبوا أمامه قلوبكم، الله ملجأنا."]]}, {"l": "Psa 71:3", "n": "", "vs": [[3, "كن لي صخرة ملجأ ألوذ بها دائما. أنت أمرت بخلاصي لأنك صخرتي ومعقلي."]]}, {"l": "Psa 84:11", "n": "", "vs": [[11, "لأن الرب الإله شمس وترس. الرب يعطي نعمة ومجدا؛ لا يمنع أي خير عن السالكين بالاستقامة."]]}, {"l": "Psa 91:1", "n": "", "vs": [[1, "المحتمي بقدس أقداس العلي، في ظل القدير يبيت،"]]}, {"l": "Psa 91:2", "n": "", "vs": [[2, "أقول للرب: أنت ملجإي وحصني، إلهي الذي به وثقت"]]}, {"l": "Psa 144:1", "n": "", "vs": [[1, "مبارك الرب صخرتي، الذي يدرب يدي على القتال وأصابعي على الحرب."]]}, {"l": "Psa 144:2", "n": "", "vs": [[2, "هو رحمتي ومعقلي، حصني ومنقذي، ترسي ومتكلي، والمخضع شعبي لي."]]}, {"l": "Pro 18:10", "n": "", "vs": [[10, "اسم الرب برج منيع يهرع إليه الصديق وينجو من الخطر."]]}, {"l": "Isa 25:4", "n": "", "vs": [[4, "لأنك كنت حصنا للبائس، وملاذا منيعا للمسكين في ضيقه، وملجأ له من العاصفة، وظلا تقيه وهج الحر، لأن نفخة العتاة كسيل يرتطم بحائط."]]}, {"l": "Isa 26:1-4", "n": "", "vs": [[1, "في ذلك اليوم يتردد هذا النشيد في أرض يهوذا: «لنا مدينة منيعة، يجعل الرب الخلاص أسوارا ومترسة."], [2, "افتحوا الأبواب لتدخل الأمة البارة التي حافظت على الأمانة."], [3, "أنت تحفظ ذا الرأي الثابت سالما لأنه عليك توكل."], [4, "اتكلوا على الرب إلى الأبد، لأن الرب الله هو صخر الدهور."]]}, {"l": "Isa 32:2", "n": "", "vs": [[2, "ويصبح كل إنسان كملاذ من الريح، وكملجاء من العاصفة، أو كجداول ميا ه في صحراء، أو كظل صخرة عظيمة في أرض جدباء."]]}], "kwAr": "حصن", "noteAr": "أو: «قوة». انظر مز 18: 1، 2؛ 27: 5؛ 62: 6-8؛ 71: 3؛ 84: 11؛ 91: 1، 2؛ 144: 1، 2؛ أم 18: 10؛ إش 25: 4؛ 26: 1-4؛ 32: 2"}, {"kw": "in the", "raw": "Psa_20:1, Psa_50:15, Psa_59:16, Psa_86:7, Psa_91:15; Isa_37:3, Isa_37:4", "note": "", "refs": [{"l": "Psa 20:1", "n": "", "vs": [[1, "ليستجب لك الرب في يوم ضيقك. ليحرسك اسم إله يعقوب."]]}, {"l": "Psa 50:15", "n": "", "vs": [[15, "ادعني في يوم ضيقك أنقذك فتمجدني»."]]}, {"l": "Psa 59:16", "n": "", "vs": [[16, "أما أنا فأترنم بقوتك. أتهلل في الصباح لرحمتك لأنك كنت لي حصنا منيعا وملجأ في يوم ضيقي."]]}, {"l": "Psa 86:7", "n": "", "vs": [[7, "في يوم ضيقي أدعوك لأنك تستجيبني."]]}, {"l": "Psa 91:15", "n": "", "vs": [[15, "يدعوني فأستجيب له، أرافقه في الضيق، أنقذه وأكرمه"]]}, {"l": "Isa 37:3", "n": "", "vs": [[3, "وقالوا له: يقول حزقيا: «هذا اليوم يوم ضيق وإهانة وكرب، صرنا فيه كامرأة تقاسي المخاض وهي عاجزة عن الولادة."]]}, {"l": "Isa 37:4", "n": "", "vs": [[4, "لعل الرب إلهك قد سمع وعيد ربشاقى الذي أوفده سيده ملك أشور ليهين الإله الحي، فيعاقبه الرب إلهك على ما صدر منه من تعيير، فصل من أجل البقية الناجية»."]]}], "kwAr": "في يوم", "noteAr": ""}, {"kw": "and he", "raw": "Psa_1:6; Mat_7:23; Joh_10:27; Gal_4:9; 2Ti_2:19", "note": "", "refs": [{"l": "Psa 1:6", "n": "", "vs": [[6, "لأن الرب يحفظ طريق الأبرار، أما طريق الأشرار فمصيرها الهلاك."]]}, {"l": "Mat 7:23", "n": "", "vs": [[23, "ولكني عندئذ أصرح لهم: إني لم أعرفكم قط! ابتعدوا عني يافاعلي الإثم!"]]}, {"l": "Joh 10:27", "n": "", "vs": [[27, "فخرافي تصغي لصوتي، وأنا أعرفها وهي تتبعني،"]]}, {"l": "Gal 4:9", "n": "", "vs": [[9, "أما الآن وقد عرفتم الله ، بل بالأحرى عرفكم الله ، فكيف ترتدون أيضا إلى تلك المباديء العاجزة الفقيرة التي ترغبون في الرجوع إلى العبودية لها من جديد؟"]]}, {"l": "2Ti 2:19", "n": "", "vs": [[19, "إلا أن الأساس الراسخ الذي وضعه الله يظل ثابتا، وعليه هذا الختم: «الرب يعرف خاصته»، وأيضا: «لينفصل عن الإثم كل من يسمي اسم الرب!»"]]}], "kwAr": "ويعرف", "noteAr": ""}, {"kw": "that", "raw": "1Ch_5:20; 2Ch_16:8, 2Ch_16:9, 2Ch_32:8, 2Ch_32:11, 2Ch_32:21; Psa_84:12; Jer_17:7, Jer_17:8; Dan_3:28; Dan_6:23; Mat_27:43", "note": "", "refs": [{"l": "1Ch 5:20", "n": "", "vs": [[20, "فانتصروا عليهم وظفروا بالهاجريين وحلفائهم، لأنهم استعانوا بالرب في أثناء القتال واتكلوا عليه فاستجاب لهم."]]}, {"l": "2Ch 16:8", "n": "", "vs": [[8, "ألم يزحف عليك الكوشيون واللوبيون بجيش عظيم ومركبات وفرسان، فأظفرك الرب بهم لأنك اتكلت عليه؟"]]}, {"l": "2Ch 16:9", "n": "", "vs": [[9, "إن عيني الرب تجولان في الأرض قاطبة ليقوي ذوي القلوب الخالصة له، أما أنت فقد تصرفت بحماقة في هذا الأمر لهذا تثور ضدك حروب»."]]}, {"l": "2Ch 32:8", "n": "", "vs": [[8, "فمعه قوى بشرية، ومعنا الرب إلهنا لينجدنا ويحارب حروبنا». فبث كلام حزقيا الشجاعة في قلوب الشعب."]]}, {"l": "2Ch 32:11", "n": "", "vs": [[11, "ألا يغويكم حزقيا لكي تموتوا جوعا وعطشا، عندما يقول لكم: الرب إلهنا ينقذنا من يد ملك أشور؟"]]}, {"l": "2Ch 32:21", "n": "", "vs": [[21, "فأرسل الرب ملاكا فأباد كل بطل صنديد ورئيس وقائد في معسكر ملك أشور، فرجع إلى أرضه مخذولا. وعندما دخل معبد إلهه اغتاله هناك أولاده بالسيف"]]}, {"l": "Psa 84:12", "n": "", "vs": [[12, "يارب الجنود، طوبى للإنسان المتكل عليك."]]}, {"l": "Jer 17:7", "n": "", "vs": [[7, "ولكن مبارك الرجل الذي يتكل على الرب، ويتخذه معتمدا له،"]]}, {"l": "Jer 17:8", "n": "", "vs": [[8, "فيكون كشجرة مغروسة عند الميا ه، تمد جذورها إلى الجدول، ولا تخشى اشتداد الحر المقبل، إذ تظل أوراقها خضراء، ولا يفزعها القحط لأنها لا تكف عن الإثمار."]]}, {"l": "Dan 3:28", "n": "", "vs": [[28, "فقال نبوخذناصر: «تبارك إله شدرخ وميشخ وعبدنغو الذي أرسل ملاكه وأنقذ عبيده الذين اتكلوا عليه وخالفوا أمر الملك وبذلوا أجسادهم كيلا يعبدوا أو يسجدوا لإله غير إلههم."]]}, {"l": "Dan 6:23", "n": "", "vs": [[23, "حينئذ فرح الملك جدا وأمر أن يخرج دانيآل من الجب، فأصعدوه ولم يكن قد ناله أي أذى، لأنه آمن بإلهه."]]}, {"l": "Mat 27:43", "n": "", "vs": [[43, "توكل على الله، فليخلصه الآن إن كان يريده! فهو قد قال: أنا ابن الله!»"]]}], "kwAr": "المعتصمين", "noteAr": ""}], "arS": [["الرب", ["H3068"]], [" ", []], ["صالح", ["H2896"]], ["، ", []], ["حصن", ["H4581"]], [" في ", []], ["يوم", ["H3117"]], [" ", []], ["الضيق", ["H6869"]], ["، ", []], ["ويعرف", ["H3045"]], [" ", []], ["المعتصمين", ["H2620"]], [" به.", []]]}, {"c": 1, "v": 8, "text": "ولكنه بطوفان طام يخفي معالم نينوى، وتدرك الظلمة أعداءه.", "groups": [{"kw": "with", "raw": "Isa_8:7, Isa_8:8, Isa_28:17; Eze_13:13; Dan_9:26, Dan_11:10,Dan_11:22, Dan_11:40; Amo_8:8, Amo_9:5, Amo_9:6; Mat_7:27; 2Pe_3:6, 2Pe_3:7", "note": "", "refs": [{"l": "Isa 8:7", "n": "", "vs": [[7, "فإن الرب مزمع أن يغرقهم بمياه النهر الفياضة، أي ملك أشور بكل جبروته، فيكون (كنهر الفرات) يطغى جيشانه على أقنيته ويفيض على ضفافه"]]}, {"l": "Isa 8:8", "n": "", "vs": [[8, "فيكتسح أرض يهوذا، ويطفو مرتفعا إلى الأعناق، وتنتشر جيوشه في عرض أرضك ياعمانوئيل»."]]}, {"l": "Isa 28:17", "n": "", "vs": [[17, "وسأجعل العدل خيط قياس والحق مطمارا (لأكشف عن زيف أعمالكم) فيجرف البرد معتصم الكذب وتطفو المياه على المخابيء"]]}, {"l": "Eze 13:13", "n": "", "vs": [[13, "لذلك، هذا ما يعلنه السيد الرب: ها أنا أجعل ريحا عاتية تخترق السور بفعل حنقي، ومطرا جارفا ينهمر في خضم غضبي، وحجارة برد تتساقط في أثناء سخطي لكي تهلك،"]]}, {"l": "Dan 9:26", "n": "", "vs": [[26, "وبعد اثنين وستين أسبوعا يقتل المسيح، ولكن ليس من أجل نفسه، ويدمر شعب رئيس آت المدينة والقدس، وتقبل آخرتها كطوفان، وتستمر الحرب حتى النهاية، ويعم الخراب المقضي به."]]}, {"l": "Dan 11:10", "n": "", "vs": [[10, "إلا أن بني ملك الشمال يثورون ويحشدون جيوشا عظيمة، تتقدم كالطوفان عبر أرض إسرائيل، وتهجم على أرض ملك الجنوب حتى تبلغ العاصمة."]]}, {"l": "Dan 11:22", "n": "", "vs": [[22, "ويمحق جيوشا بأسرها فتندحر أمامه، ومن جملتهم رئيس الكهنة."]]}, {"l": "Dan 11:40", "n": "", "vs": [[40, "وعندما تأزف النهاية يحاربه ملك الجنوب، فينقض عليه ملك الشمال كالزوبعة بمركبات وفرسان وسفن كثيرة، ويقتحم دياره كالطوفان الجارف."]]}, {"l": "Amo 8:8", "n": "", "vs": [[8, "ألا ترتعب الأرض من جراء ذلك، فينوح كل ساكن فيها، فتطمو كنهر، وترتفع وتنخفض كنيل مصر؟"]]}, {"l": "Amo 9:5", "n": "", "vs": [[5, "إن الرب الإله القدير هو الذي يلمس الأرض فتذوب، وينوح كل المقيمين فيها، ويرتفع كل ما فيها وينخفض كنهر نيل مصر."]]}, {"l": "Amo 9:6", "n": "", "vs": [[6, "هو الذي يبني مخادعه العليا في السماوات ويؤسس قبته على الأرض، الذي يدعو مياه البحر ويسكبها على وجه الثرى، الرب اسمه."]]}, {"l": "Mat 7:27", "n": "", "vs": [[27, "فنزلت الأمطار، وجرت السيول، وهبت العواصف، فضربت ذلك البيت، فسقط، وكان سقوطه عظيما»"]]}, {"l": "2Pe 3:6", "n": "", "vs": [[6, "وبكلمة منه أيضا، دمر العالم الذي كان موجودا في ذلك الزمان، إذ فاض الماء عليه."]]}, {"l": "2Pe 3:7", "n": "", "vs": [[7, "أما السماوات والأرض الحالية، فستبقى مخزونة ومحفوظة للنار بتلك الكلمة عينها إلى يوم الدينونة وهلاك الفاجرين!"]]}], "kwAr": "بطوفان", "noteAr": ""}, {"kw": "the place", "raw": "Nah_1:1, Nah_2:8; Zep_2:13", "note": "", "refs": [{"l": "Nah 1:1", "n": "", "vs": [[1, "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."]]}, {"l": "Nah 2:8", "n": "", "vs": [[8, "نينوى كبركة نضبت مياهها، إذ فر أهلها. وتعلو الصرخة: «قفوا، قفوا». ولا من مجيب يلتفت."]]}, {"l": "Zep 2:13", "n": "", "vs": [[13, "ثم يبسط يده نحو الشمال ويبيد أشور ويجعل نينوى قفرا موحشا، أرضا قاحلة كالصحراء."]]}], "kwAr": "معالم", "noteAr": ""}, {"kw": "darkness", "raw": "Job_30:15; Pro_4:19; Isa_8:22; Jer_13:16; Mat_8:12", "note": "", "refs": [{"l": "Job 30:15", "n": "", "vs": [[15, "طغت علي الأهوال، فتطايرت كرامتي كورقة أمام الريح، ومضى رغدي كالسحاب."]]}, {"l": "Pro 4:19", "n": "", "vs": [[19, "وطريق الأشرار كالظلمة الداجية لا يدركون ما يعثرون به."]]}, {"l": "Isa 8:22", "n": "", "vs": [[22, "ثم ينظرون إلى الأرض فلا يجدون سوى الكرب والظلمة والضنك والعذاب، ويطردون إلى دياجير الظلام."]]}, {"l": "Jer 13:16", "n": "", "vs": [[16, "مجدوا الرب إلهكم قبل أن يجعل الظلام يخيم عليكم، وقبل أن تتعثر أقدامكم على الجبال المعتمة. أنتم ترتقبون النور ولكنه يحوله إلى ظلام الموت ويجعله ليلا دامسا."]]}, {"l": "Mat 8:12", "n": "", "vs": [[12, "أما بنو الملكوت، فيطرحون في الظلمة الخارجية، هناك يكون البكاء وصرير الأسنان!»"]]}], "kwAr": "الظلمة", "noteAr": ""}], "arS": [["ولكنه ", []], ["بطوفان", ["H7858"]], [" ", []], ["طام", ["H5674"]], [" ", []], ["يخفي", ["H6213", "H3617"]], [" ", []], ["معالم", ["H4725"]], [" نينوى، ", []], ["وتدرك", ["H7291"]], [" ", []], ["الظلمة", ["H2822"]], [" ", []], ["أعداءه", ["H341"]], [".", []]]}, {"c": 1, "v": 9, "text": "لماذا تتآمرون على الرب؟ إنه يقضي على مؤامرتكم، ويفنيكم بضربة واحدة.", "groups": [{"kw": "do", "raw": "Nah_1:11; Psa_2:1-4, Psa_21:11, Psa_33:10; Pro_21:30; Isa_8:9, Isa_8:10; Eze_38:10,Eze_38:11; Act_4:25-28; 2Co_10:5", "note": "", "refs": [{"l": "Nah 1:11", "n": "", "vs": [[11, "منك خرج يانينوى من تآمر بالشر على الرب، والمشير بالسوء."]]}, {"l": "Psa 2:1-4", "n": "", "vs": [[1, "لماذا ضجت الأمم؟ ولماذا تتآمر الشعوب باطلاَ؟"], [2, "اجتمع ملوك الأرض ورؤساؤها، وتحالفوا ليقاوموا الرب ومسيحه، قائلين:"], [3, "«لنحطم عنا قيودهما، ونتحرر من نير عبوديتهما»."], [4, "لكن الجالس على عرشه في السماوات يضحك. الرب يستهزيء بهم."]]}, {"l": "Psa 21:11", "n": "", "vs": [[11, "لقد تآمروا للإساءة إليك، ودبروا مكيدة شريرة لم يفلحوا فيها."]]}, {"l": "Psa 33:10", "n": "", "vs": [[10, "الرب أحبط مؤامرة الأمم. أبطل أفكار الشعوب."]]}, {"l": "Pro 21:30", "n": "", "vs": [[30, "ليس من حكمة، ولا من مشورة، ولا من فطنة بقادر ة على مقاومة الله."]]}, {"l": "Isa 8:9", [[18, "لأن الفجور يحرق كالنار فتلتهم الشوك والحسك بل تشعل أجمات الغابة فتتصاعد منها سحب الدخان."]]}, {"l": "Isa 10:17-19", "n": "", "vs": [[17, "فيصبح نور إسرائيل نارا، وقدوسه لهيبا، فتشتعل وتلتهم شوكه وحسكه في يوم واحد،"], [18, "فيدمر الرب مجد غاباته وأرضه الخصيبة، الروح والجسد معا، فتكون كمريض تذوي حياته،"], [19, "ولا يتبقى من أشجار الغابة إلا قلة يحصيها صبي."]]}, {"l": "Isa 27:4", "n": "", "vs": [[4, "لست أضمر غيظا، ومن قاومني بالشوك والحسك فإنني أهجم عليهم جميعا وأحرقهم."]]}, {"l": "Mal 4:1", "n": "", "vs": [[1, "«انظروا، ها يوم القضاء مقبل، لاهب كتنور يكون فيه جميع المستكبرين وفاعلي الإثم عصافة، فيحرقهم ذلك اليوم ولا يبقي لهم أصلا ولا فرعا، يقول الرب القدير."]]}], "kwAr": "وتلتهمهم", "noteAr": ""}], "arS": [["وتلتهمهم", ["H398"]], [" النار كما تلتهم شجرة ", []], ["عليق", ["H5518"]], [" ", []], ["كثيفة", ["H5440"]], [" أو ", []], ["سكارى", ["H5433"]], [" ", []], ["مترنحين", ["H5435"]], [" من خمرهم أو حزمة ", []], ["قش", ["H7179"]], [" ", []], ["جافة", ["H4390", "H3002"]], [".", []]]}, {"c": 1, "v": 11, "text": "منك خرج يانينوى من تآمر بالشر على الرب، والمشير بالسوء.", "groups": [{"kw": "one", "raw": "Nah_1:9; 2Ki_18:13, 2Ki_18:14, 2Ki_18:30, 2Ki_19:22-25; 2Ch_32:15-19; Isa_10:7-15", "note": "", "refs": [{"l": "Nah 1:9", "n": "", "vs": [[9, "لماذا تتآمرون على الرب؟ إنه يقضي على مؤامرتكم، ويفنيكم بضربة واحدة."]]}, {"l": "2Ki 18:13", "n": "", "vs": [[13, "وفي السنة الرابعة عشرة من حكم الملك حزقيا اجتاح سنحاريب ملك أشور جميع مدن يهوذا الحصينة واستولى عليها."]]}, {"l": "2Ki 18:14", "n": "", "vs": [[14, "وأرسل حزقيا ملك يهوذا يقول لملك أشور في لخيش: «أخطأت، فارتحل عني، وأنا أدفع ما تفرضه علي من جزية». ففرض ملك أشور على حزقيا ملك يهوذا ثلاث مئة وزنة (نحو ألف وثمانين كيلوجراما من الفضة)، وثلاثين وزنة (نحو مائة وثمانية كيلوجرامات من الذهب)."]]}, {"l": "2Ki 18:30", "n": "", "vs": [[30, "ولا يقنعكم حزقيا بالاتكال على الرب قائلا: إنه حتما ينقذنا ولن يستولي ملك أشور على هذه المدينة."]]}, {"l": "2Ki 19:22-25", "n": "", "vs": [[22, "من عيرت وجدفت عليه؟ وعلى من رفعت صوتا وشمخت بعينيك زهوا؟ أعلى قدوس إسرائيل؟"], [23, "لقد عيرت السيد على لسان رسلك، وقلت: بكثرة مركباتي قد صعدت إلى أعالي الجبال، وبلغت أقاصي لبنان قاطعا أطول أرزه وخيار سروه واخترقت أبعد ربوعه وأفضل غاباته."], [24, "قد حفرت آبارا في أرض غريبة وشربت مياها، وبباطن قدمي جففت جميع خلجان مصر."], [25, "ألم تسمع؟ منذ زمن طويل قدرت ذلك. منذ الأيام القديمة قررته وها أنا الآن أحققه، إذ أقمتك لتدمير مدن محصنة فتحولها إلى روابي خربة."]]}, {"l": "2Ch 32:15-19", "n": "", "vs": [[15, "لذلك لا يخدعنكم حزقيا ولا يغوينكم. لا تصدقوه لأنه لم يقدر إله أي أمة أو مملكة أن ينجي شعبه من يدي ومن يد آبائي، فكيف يمكن لإلهكم أن ينجيكم؟»"], [16, "وأكثر الضباط الأشوريون من التهجم على الرب وعلى عبده حزقيا."], [17, "وكتب الملك الأشوري رسائل عير فيها الرب إله إسرائيل، جاء فيها: «كما أن آلهة أمم الأرض عجزت عن إنقاذ شعوبها من يدي، كذلك لا ينقذ إله حزقيا شعبه من يدي»."], [18, "وهتف رجال سنحاريب باليهودية مخاطبين أهل أورشليم الواقفين على السور، ليوقعوا فيهم الرعب والخوف، تمهيدا للاستيلاء على المدينة،"], [19, "وكان تهجمهم على الرب إله أورشليم مماثلا لتهجمهم على أصنام الشعوب الأخرى التي صنعتها أيدي الناس."]]}, {"l": "Isa 10:7-15", "n": "", "vs": [[7, "ولكن ملك أشور لا يعرف أنني أنا الذي أرسلته، ويظن أنه بقدرته قد هاجم شعبي، وفي نيته أن يدمر ويجتاح أمما كثيرة."], [8, "لأنه يقول: أليس كل قوادي ملوكا؟"], [9, "أليس مصير كلنو كمصير كركميش؟ أو ليس مآل حماة كمآل أرفاد؟ أليست السامرة كدمشق؟"], [10, "لقد قضيت على ممالك وثنية أصنامها أعظم من أصنام أورشليم والسامرة!"], [11, "أفلا أقضي على أورشليم وأصنامها كما قضيت على السامرة وأصنامها؟"], [12, "ولكن حالما ينتهي الرب من عمله بجبل صهيون، فإنه سيعاقب ملك أشور على غرور قلبه وتشامخ عينيه،"], [13, "لأنه يقول: بقوة ذراعي قد صنعت هذا، وبحكمتي، لأنني فهيم! قد نقلت تخوم الأمم، ونهبت كنوزهم، وعزلت الجالسين على العروش كما يفعل ذو البطش."], [14, "وكما تستحوذ يد الإنسان على العش، هكذا استحوذت يدي على ثروات الشعوب. وكما يجمع الإنسان البيض المهجور، هكذا جمعت الأرض بأسرها، فلم يجرؤ أحد أن يحرك جناحا أو يفتح فاها أو ينبس بهمسة."], [15, "أتزهو الفأس على من يقطع بها، أم يتعظم المنشار على من ينشر به، وكأن القضيب يحرك رافعه، أو كأن العصا ترفع ما ليس خشبا؟!"]]}], "kwAr": "خرج", "noteAr": ""}, {"kw": "wicked counsellor", "raw": "Heb. counsellor of Belial, 1Sa_2:12; 2Sa_20:1; 2Ch_13:7", "note": "Heb. counsellor of Belial, 1Sa_2:12; 2Sa_20:1; 2Ch_13:7", "refs": [{"l": "1Sa 2:12", "n": "", "vs": [[12, "أما ابنا عالي فكانا متورطين في الشر لا يعرفان الرب"]]}, {"l": "2Sa 20:1", "n": "", "vs": [[1, "وحدث أن كان هناك رجل لئيم يدعى شبع بن بكري من سبط بنيامين، فنفخ هذا بالبوق وقال: «ليس لنا نصيب في داود ولا قسم في ابن يسى، فليرجع كل رجل إلى خيمته ياإسرائيل»."]]}, {"l": "2Ch 13:7", "n": "", "vs": [[7, "فالتف حوله رجال بطالون أشرار، وثاروا على رحبعام بن سليمان، فلم يثبت رحبعام أمامهم لحداثته وقلة خبرته."]]}], "kwAr": "والمشير بالسوء", "noteAr": "بالعبرية: «مشير بليعال». انظر 1صم 2: 12؛ 2صم 20: 1؛ 2أخ 13: 7"}], "arS": [["منك", ["H4480"]], [" ", []], ["خرج", ["H3318"]], [" يانينوى من ", []], ["تآمر", ["H2803"]], [" ", []], ["بالشر", ["H7451"]], [" ", []], ["على", ["H5921"]], [" ", []], ["الرب", ["H3068"]], ["، ", []], ["والمشير", ["H3289"]], [" ", []], ["بالسوء", ["H1100"]], [".", []]]}, {"c": 1, "v": 12, "text": "وهذا ما يقوله الرب: مع أنكم أقوياء وكثيرون فإنكم تستأصلون وتفنون. أما أنتم ياشعبي فقد عاقبتكم أشد عقاب ولن أنزل بكم الويلات ثانية.", "groups": [{"kw": "cut down", "raw": "Heb. shorn, Isa_7:20", "note": "Heb. shorn, Isa_7:20", "refs": [{"l": "Isa 7:20", "n": "", "vs": [[20, "في ذلك اليوم يستأجر الرب ملك أشور من عبر نهر الفرات، فيكون الموسى التي يحلق بها الرب شعر رؤوسكم وأرجلكم، وحتى لحاكم أيضا."]]}], "kwAr": "تستأصلون", "noteAr": "بالعبرية: «جُزّوا». انظر إش 7: 20"}, {"kw": "pass", "raw": "Nah_1:15; Exo_12:12; Isa_8:8; Dan_11:10", "note": "", "refs": [{"l": "Nah 1:15", "n": "", "vs": [[15, "هوذا على الجبال (تسير) قدما المبشر حامل الأخبار السارة، الذي يعلن السلام. فيايهوذا واظب على الاحتفال بأعيادك وأوف نذورك لأنه لن يهاجمك الشرير من بعد، إذ قد انقرض تماما."]]}, {"l": "Exo 12:12", "n": "", "vs": [[12, "ففي هذه الليلة أجتاز في بلاد مصر وأقتل كل بكر فيها من الناس والبهائم وأجري قضاء على كل آلهة المصريين. أنا هو الرب."]]}, {"l": "Isa 8:8", "n": "", "vs": [[8, "فيكتسح أرض يهوذا، ويطفو مرتفعا إلى الأعناق، وتنتشر جيوشه في عرض أرضك ياعمانوئيل»."]]}, {"l": "Dan 11:10", "n": "", "vs": [[10, "إلا أن بني ملك الشمال يثورون ويحشدون جيوشا عظيمة، تتقدم كالطوفان عبر أرض إسرائيل، وتهجم على أرض ملك الجنوب حتى تبلغ العاصمة."]]}], "kwAr": "وتفنون", "noteAr": ""}, {"kw": "Through", "raw": "etc. or, If they would have been at peace, so should they have been many, and so should they have been shorn, and he should have passed away. yet. 2Ki_19:35, 2Ki_19:37; Isa_10:32-34, Isa_14:24-27, Isa_17:14, Isa_30:28-33, Isa_31:8, Isa_37:36", "note": "etc. or, If they would have been at peace, so should they have been many, and so should they have been shorn, and he should have passed away. yet. 2Ki_19:35, 2Ki_19:37; Isa_10:32-34, Isa_14:24-27, Isa_17:14, Isa_30:28-33, Isa_31:8, Isa_37:36", "refs": [{"l": "2Ki 19:35", "n": "", "vs": [[35, "وحدث في تلك الليلة أن ملاك الرب قتل مئة وخمسة وثمانين ألفا من جيش الأشوريين، فما إن طلع الصباح حتى كانت الجثث الميتة تملأ المكان."]]}, {"l": "2Ki 19:37", "n": "", "vs": [[37, "وفيما هو يتعبد في هيكل إلهه نسروخ، اغتاله ابناه، أدرملك وشرآصر، وفرا إلى أرض أراراط، فخلفه ابنه آسرحدون على العرش."]]}, {"l": "Isa 10:32-34", "n": "", "vs": [[32, "اليوم يتوقف في نوب ويهز قبضته على جبل بنت صهيون، أكمة أورشليم."], [33, "لكن الرب القدير يحطم الأغصان بعنفوان. فكل متطاول يقطع، وكل متشامخ يذل."], [34, "تستأصل أجمات الغابة بفأس، ويسقط لبنان أمام جبار مهوب."]]}, {"l": "Isa 14:24-27", "n": "", "vs": [[24, "لقد أقسم الرب القدير قائلا: «حقا ما عزمت عليه لابد أن يتحقق، وما نويت عليه حتما يتم:"], [25, "أن أحطم أشور في أرضي وأطأه على جبالي، فيلقي عنهم نيره، ويزول عن كاهلهم حمله."], [26, "هذا هو القضاء الذي حكمت به على الأرض كلها، وهذه هي اليد التي امتدت على كل الأمم."], [27, "لأن الرب القدير قد قضى، فمن يبطل قضاءه؟ ويده قد امتدت فمن يردها؟»"]]}, {"l": "Isa 17:14", "n": "", "vs": [[14, "في المساء يطغى عليهم رعب، وفي الصباح يتلاشون. هذا هو نصيب ناهبينا وحظ سالبينا."]]}, {"l": "Isa 30:28-33", "n": "", "vs": [[28, "ونفخته كسيل جارف يبلغ إلى العنق، ليغربل الأمم بغربال الهلاك، وليضع لجاما في فكوك الشعوب إضلالا لهم."], [29, "أما أنتم فتشدون كما في ليلة الاحتفال بعيد مقدس، وتبتهج قلوبكم كقلب من يسير على ألحان ناي، آتيا إلى جبل الرب وإلى صخر إسرائيل."], [30, "ويسمع الرب جلال صوته ويجعل الناس يعاينون امتداد ذراعه على الأرض بلهيب غضب ثائر ونار آكلة، وانفجار أمطار وعواصف وبرد."], [31, "فيرتاع أشور من زئير صوته، ويضربه بقضيبه."], [32, "ويوقع الرب كل ضربة عليه بقضيب عقابه على أنغام الدفوف والعيدان، ويحارب أشور بحروب ثائرة."], [33, "لأن محرقة الموت جاهزة منذ زمن بعيد وحفرتها واسعة، تكومت فيها الأخشاب ليلقى فيها مولك إله الأشوريين، فتضرمها نفخة الرب كسيل من كبريت."]]}, {"l": "Isa 31:8", "n": "", "vs": [[8, "ويصرع الأشوريون ويلتهمون، ولكن ليس بسيف بشر، ويفرون من أمام السيف، ويساق فتيانهم إلى الأعمال الشاقة،"]]}, {"l": "Isa 37:36", "n": "", "vs": [[36, "وحدث في تلك الليلة أن ملاك الرب قتل مئة وخمسة وثمانين ألفا من جيش الأشوريين، وما إن طلع الصباح حتى كانت جثث القتلى تملأ المكان"]]}], "kwAr": "مع أنكم", "noteAr": "إلخ. أو: «لو كانوا في سلام لكانوا هكذا كثيرين، وهكذا كانوا يُجزّون، ويعبر. ومع ذلك…» انظر 2مل 19: 35، 37؛ إش 10: 32-34؛ 14: 24-27؛ 17: 14؛ 30: 28-33؛ 31: 8؛ 37: 36"}, {"kw": "I will", "raw": "Isa_30:19, Isa_51:22, Isa_60:18-20; Joe_2:19; Rev_7:16", "note": "", "refs": [{"l": "Isa 30:19", "n": "", "vs": [[19, "ياشعب صهيون المقيم في أورشليم، لن تبكي في ما بعد، لأن الرب يرحمك عند ارتفاع صوت بكائك، وحالما يسمع يستجيب لك."]]}, {"l": "Isa 51:22", "n": "", "vs": [[22, "هذا ما يقوله سيدك الرب، إلهك الذي يدافع عن دعوى شعبه: ها أنا قد أخذت من يدك كأس الترنح، ولن تجرعي من كأس غضبي بعد."]]}, {"l": "Isa 60:18-20", "n": "", "vs": [[18, "ولا يسمع بظلم في أرضك، ولا بدمار أو خراب داخل تخومك، وتدعين أسوارك خلاصا، وبواباتك تسابيح."], [19, "ولا تعود الشمس نورا لك في النهار ولا يشرق ضوء القمر عليك لأن الرب يكون نورك الأبدي، وإلهك يكون مجدك."], [20, "ولا تغرب شمسك من بعد، ولا يتضاءل قمرك، لأن الرب يكون نورك الأبدي، وتنقضي أيام مناحتك."]]}, {"l": "Joe 2:19", "n": "", "vs": [[19, "ويجيبهم قائلا: ها أنا أنعم عليكم بالحنطة والخمرة والزيت فتشبعون منها، ولا أجعلكم من بعد عارا بين الأمم."]]}, {"l": "Rev 7:16", "n": "", "vs": [[16, "فلن يجوعوا ولن يعطشوا، ولن تضربهم الشمس ولا أي حر،"]]}], "kwAr": "ولن أنزل", "noteAr": ""}], "arS": [["وهذا", ["H3541"]], [" ما ", []], ["يقوله", ["H559"]], [" ", []], ["الرب", ["H3068"]], [": ", []], ["مع", ["H518"]], [" أنكم أقوياء ", []], ["وكثيرون", ["H7227"]], [" ", []], ["فإنكم", ["H3651"]], [" ", []], ["تستأصلون", ["H1494"]], [" ", []], ["وتفنون", ["H5674"]], [". أما أنتم ياشعبي فقد ", []], ["عاقبتكم", ["H6031"]], [" أشد عقاب ", []], ["ولن", ["H3808"]], [" أنزل بكم ", []], ["الويلات", ["H6031"]], [" ", []], ["ثانية", ["H5750"]], [".", []]]}, {"c": 1, "v": 13, "text": "بل أحطم الآن نير أشور عنكم، وأكسر أغلالكم.", "groups": [{"kw": "will I", "raw": "Isa_9:4, Isa_10:27, Isa_14:25; Jer_2:20; Mic_5:5, Mic_5:6", "note": "", "refs": [{"l": "Isa 9:4", "n": "", "vs": [[4, "لأنك قد حطمت، كما في يوم مديان، نير ثقله وعصا كتفه وقضيب مسخره."]]}, {"l": "Isa 10:27", "n": "", "vs": [[27, "في ذلك اليوم يتدحرج حمله عن كتفك، ويتحطم نيره عن عنقك لأن عنقك أصبح غليظا."]]}, {"l": "Isa 14:25", "n": "", "vs": [[25, "أن أحطم أشور في أرضي وأطأه على جبالي، فيلقي عنهم نيره، ويزول عن كاهلهم حمله."]]}, {"l": "Jer 2:20", "n": "", "vs": [[20, "قد حطمت نيري من زمن بعيد، وقطعت قيودك وقلت: لن أتعبد لك، وصرت تضطجعين كزانية فوق كل أكمة مرتفعة وتحت كل شجرة خضراء (أي عبدت الأوثان)."]]}, {"l": "Mic 5:5", "n": "", "vs": [[5, "ويصبح الرب سلامهم، إذ حين يزحف الأشوريون إلى أرضنا ويطأون ترابنا، فإننا نثير عليهم سبعة رعاة وثمانية أمراء من الناس،"]]}, {"l": "Mic 5:6", "n": "", "vs": [[6, "فيحكمون بلاد أشور بقوة السيف، ويقتحمون بوابات أرض نمرود، وينقذنا ( الله ) من الأشوريين عندما يزحفون إلى أرضنا ويطأون تخومنا."]]}], "kwAr": "أحطم", "noteAr": ""}, {"kw": "will burst", "raw": "Psa_107:14; Jer_5:5", "note": "", "refs": [{"l": "Psa 107:14", "n": "", "vs": [[14, "أخرجهم من الظلام وظلال الموت وحطم أصفادهم."]]}, {"l": "Jer 5:5", kw": "keep", "raw": "Nah_3:14, Nah_3:15; 2Ch_25:8; Jer_46:3-10, Jer_51:11, Jer_51:12; Joe_3:9-11", "note": "", "refs": [{"l": "Nah 3:14", "n": "", "vs": [[14, "خز ني ماء تأهبا للحصار، حصني قلاعك. دوسي أكوام الطين لتجهزي الطوب؛ أصلحي قوالب الطين."]]}, {"l": "Nah 3:15", "n": "", "vs": [[15, "هناك تلتهمك النار، ويستأصلك السيف، فيبيدك الأعداء كالجراد. تكاثري كالجراد وكالجنادب."]]}, {"l": "2Ch 25:8", "n": "", "vs": [[8, "وحتى لو خضت المعركة وحاربت بإقدام وشجاعة فإنه يهزمك أمام أعدائك لأن لله وحده أن يؤتيك النصر أو الهزيمة»."]]}, {"l": "Jer 46:3-10", "n": "", "vs": [[3, "«أعدوا المجن والترس وازحفوا للقتال."], [4, "أسرجوا الخيل وامتطوها أيها الفرسان، وانتصبوا بالخوذ. اصقلوا الرماح والبسوا الدروع."], [5, "ولكن مالي أراهم يولون الأدبار مرتعبين؟ قد دحر محاربوهم وفروا مسرعين. لم يلتفتوا إلى الوراء، قد حاصرهم الهول من كل جانب»، يقول الرب."], [6, "«عجز الخفيف عن الجري للفرار، وليس في وسع المحارب الهرب. في الشمال عثروا وسقطوا إلى جوار نهر الفرات."], [7, "من هذا الطاغي كالنيل، كالأنهار المتلاطمة الأمواج؟"], [8, "تتعالى مصر كفيضان النيل، كالأنهار المتلاطمة الأمواج. تقول: أفيض وأغمر الأرض، أهدم المدن وأهلك سكانها."], [9, "اقتحمي أيتها الخيل، وثوري يامركبات، وليبرز المحاربون من رجال كوش وفوط، الحاملين التروس، ومن رجال لوديم رماة السهام بالقسي."], [10, "فهذا اليوم هو يوم قضاء السيد الرب القدير، يوم الانتقام. فيه يثأر لنفسه من أعدائه، فيلتهم السيف ويشبع، ويرتوي من دمائهم، لأن للسيد الرب القدير ذبيحة في أرض الشمال إلى جوار نهر الفرات."]]}, {"l": "Jer 51:11", "n": "", "vs": [[11, "سنوا السهام، وتقلدوا الأتراس، لأن الرب قد أثار روح ملوك الماديين، إذ وطد العزم على إهلاك بابل، لأن هذا هو انتقام الرب، والثأر لهيكله."]]}, {"l": "Jer 51:12", "n": "", "vs": [[12, "انصبوا راية على أسوار بابل. شددوا الحراسة. أقيموا الأرصاد. أعدوا الكمائن، لأن الرب قد خطط وأنجز ما قضى به على أهل بابل."]]}, {"l": "Joe 3:9-11", "n": "", "vs": [[9, "نادوا بهذا بين الأمم، وتأهبوا للحرب. احشدوا أبطالكم. ليتقدم ويصعد جميع رجال القتال."], [10, "أطرقوا سكك محاريثكم وحولوها إلى سيوف، ومناجلكم إلى رماح، وليقل الضعيف: إنني ج
