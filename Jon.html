<script>window.CATALOG=[{"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 5, "nv": 99, "refs": 1290, "last": "5:17", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 32, "abbr": "Jon", "en": "Jonah", "verses": [{"c": 1, "v": 1, "text": "وأمر الرب يونان بن أمتاي:", "groups": [{"kw": "Jonah", "raw": "2Ki_14:25; Mat_12:39, Mat_16:4; Luk_11:29, Luk_11:30,Luk_11:32, Jonas", "note": "2Ki_14:25; Mat_12:39, Mat_16:4; Luk_11:29, Luk_11:30,Luk_11:32, Jonas", "refs": [{"l": "2Ki 14:25", "n": "", "vs": [[25, "وهو الذي استرجع لإسرائيل أراضيها الممتدة من حماة إلى البحر الميت، تحقيقا لكلام الرب الذي نطق به على لسان عبده يونان بن أمتاي النبي من أهل جت حافر،"]]}, {"l": "Mat 12:39", "n": "", "vs": [[39, "فأجابهم: «جيل شرير خائن يطلب آية؛ ولن يعطى آية إلا آية يونان النبي."]]}, {"l": "Mat 16:4", "n": "", "vs": [[4, "جيل شرير خائن يطلب آية، ولن يعطى آية إلا ما حدث للنبي يونان». ثم فارقهم ومضى."]]}, {"l": "Luk 11:29", "n": "", "vs": [[29, "وإذ كانت الجموع تزدحم عليه، أخذ يقول: «هذا الجيل جيل شرير، يطلب آية ولن يعطى آية إلا آية يونان."]]}, {"l": "Luk 11:30", "n": "", "vs": [[30, "فإنه كما كان يونان آية لأهل نينوى، فهكذا أيضا يكون ابن الإنسان لهذا الجيل."]]}, {"l": "Luk 11:32", "n": "", "vs": [[32, "وأهل نينوى سيقفون في الدينونة مع هذا الجيل ويدينونه: لأنهم تابوا لدى وعظ يونان لهم. وها هنا أعظم من يونان."]]}], "kwAr": "يونان", "noteAr": "انظر 2مل 14: 25؛ مت 12: 39؛ 16: 4؛ لو 11: 29، 30، 32"}], "arS": [["وأمر", ["H1697", "H1961"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["يونان", ["H3124"]], [" ", []], ["بن", ["H1121"]], [" ", []], ["أمتاي", ["H573"]], [":", []]]}, {"c": 1, "v": 2, "text": "«هيا امض إلى نينوى المدينة العظيمة وبلغ أهلها قضائي، لأن إثمهم قد صعد إلي».", "groups": [{"kw": "Nineveh", "raw": "Jon_3:2, Jon_4:11; Gen_10:11; 2Ki_19:36; Nah_1:1, 2:1-3:19; Zep_2:13-15", "note": "", "refs": [{"l": "Jon 3:2", "n": "", "vs": [[2, "«قم امض إلى نينوى المدينة العظيمة، وأعلن لهم الرسالة التي أبلغك إياها»."]]}, {"l": "Jon 4:11", "n": "", "vs": [[11, "أفلا أشفق أنا على نينوى المدينة العظيمة التي يقيم فيها أكثر من مئة وعشرين ألف شخص ممن لا يفرقون بين يمينهم وشمالهم، فضلا عما فيها من بهائم كثيرة؟»."]]}, {"l": "Gen 10:11", "n": "", "vs": [[11, "ومن تلك الأرض خرج أشور وبنى مدن نينوى ورحبوت عير وكالح،"]]}, {"l": "2Ki 19:36", "n": "", "vs": [[36, "فانسحب سنحاريب ملك أشور وارتد إلى بلاده ومكث في نينوى."]]}, {"l": "Nah 1:1", "n": "", "vs": [[1, "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."]]}, {"l": "Nah 2:1-3:19", "n": "", "vs": [[1, "قد زحف عليك المهاجم يانينوى، فاحرسي الحصن وراقبي الطريق، منعي أسوارك، وجندي كل قوتك."], [2, "لأن الرب يعيد بهاء يعقوب ومجد إسرائيل، لأن الناهبين سلبوهم وأتلفوا كرومهم."], [3, "تروس أبطاله مخضبة بالاحمرار، وجنوده المحاربون مسربلون بالقرمز. يبرق فولاذ المركبات في يوم تأهبها، وتتبختر جيادها."], [4, "تتراكض المركبات بعنف في الشوارع، وعبر الساحات تمرق كالبرق ومنظرها كالمشاعل المتوهجة."], [5, "يستدعي الملك ضباطه، فيسرعون إليه متعثرين في خطاهم، يهرولون إلى سور المدينة وقد أقيمت المتاريس."], [6, "قد انفتحت بوابات الأنهار، وانهار القصر أمام جحافل الأعداء."], [7, "أصبحت سيدة القصر عارية مسوقة إلى الأسر، وشرعت جواريها ينحن كنوح الحمام ويضربن صدورهن."], [8, "نينوى كبركة نضبت مياهها، إذ فر أهلها. وتعلو الصرخة: «قفوا، قفوا». ولا من مجيب يلتفت."], [9, "انهبوا الفضة، انهبوا الذهب. لا نهاية لكنوزها أو لنفائس ثروتها."], [10, "أضحت موحشة خاوية جرداء، ذابت منها القلوب رعبا وانحلت منها الركب، طغى عليها الألم وعلا وجوه أهلها الشحوب."], [11, "أين نينوى عرين الأسود ومرتع الأشبال حيث يسرح الأسد واللبوءة والأشبال من غير إزعاج؟"], [12, "قد افترس الأسد ما يكفي لإعالة أشباله وخنق فريسة للبوءاته. قد ملأ عرينه بقنائصه وكهفه بأشلائهم."], [13, "ها أنا أقاومك. يقول الرب القدير. فأحرق مركباتك فتصبح دخانا، ويلتهم السيف لحوم أبنائك، وأستأصل من الأرض غنائمك ولن يتردد في ما بعد صوت مندوبيك."], [1, "ويل للمدينة السافكة الدماء الممتلئة كذبا، المكتظة بالغنائم المنهوبة، التي لا تخلو أبدا من الضحايا."], [2, "ها فرقعة السياط وقعقعة العجلاتِ وجلبة حوافر الخيول وصلصلة المركبات."], [3, "وفرسان واثبة، وسيوف لامعة ورماح بارقة وكثرة قتلى وأكوام جثث لا نهاية لها، بها يتعثرون."], [4, "كل هذا من أجل كثرة زنى نينوى الفاتنة الآسرة ومن أجل سحرها القاتل. لقد استعبدت الشعوب بعهرها والأمم بشعوذتها."], [5, "ها أنا أقاومك، يقول الرب القدير، فأكشف عارك لأطلع الأمم على عورتك والممالك على خزيك."], [6, "وألوثك بالأوساخ وأحقرك وأجعلك عبرة."], [7, "وكل من يراك يعرض عنك قائلا: «قد خربت نينوى فمن ينوح عليها؟ أين أجد لها معزين؟»"], [8, "هل أنت أفضل من طيبة الجاثمة إلى جوار النيل المحاطة بالمياه، المتمنعة بالبحر وبأسوار من المياه."], [9, "كوش ومصر كانتا قوتها اللامتناهية، وفوط وليبيا من حلفائها."], [10, "ومع ذلك فقد وقعت أسيرة واقتيدت إلى السبي، وتمزق أطفالها أشلاء في زاوية كل شارع، واقترع على عظمائها، وصفد نبلاؤها بالأغلال."], [11, "وأنت أيضا تسكرين وتترنحين، وتلتمسين ملجأ من الأعداء"], [12, "وتتساقط جميع حصونك كتساقط بواكير أثمار أشجار التين الناضجة في أفواه من يهزونها."], [13, "انظري إلى جنودك مرتعبين كالنساء في وسطك. صارت أبواب أرضك مفتوحة أمام أعدائك. وشرعت النيران تلتهم مزاليجك."], [14, "خز ني ماء تأهبا للحصار، حصني قلاعك. دوسي أكوام الطين لتجهزي الطوب؛ أصلحي قوالب الطين."], [15, "هناك تلتهمك النار، ويستأصلك السيف، فيبيدك الأعداء كالجراد. تكاثري كالجراد وكالجنادب."], [16, "قد أضحى تجارك أكثر من كواكب السماء، ولكنهم تبددوا كجراد فرد أجنحته وطار."], [17, "أصبح رؤساؤك كالجنادب، وقادتك كأسراب الجراد المتكومة على سياج في يوم بارد. ما إن تشرق الشمس حتى تطير بعيدا إلى حيث لا يعلم أحد."], [18, "قد نام رعاتك ياملك أشور، وغرق عظماؤك في سبات عميق، تشتت شعبك على الجبال ولا يوجد من يجمعهم."], [19, "لا جبر لكسرك، وجرحك مميت. وكل من يسمع بما جرى لك يصفق ابتهاجا لما أصابك، فمن لم يعان من شرك المتمادي؟"]]}, {"l": "Zep 2:13-15", "n": "", "vs": [[13, "ثم يبسط يده نحو الشمال ويبيد أشور ويجعل نينوى قفرا موحشا، أرضا قاحلة كالصحراء."], [14, "تربض في وسطها القطعان وسائر وحوش البر، ويأوي إلى تيجان أعمدتها القوق والقنفذ وينعب الغراب على عتباتها، لأن أرزها قد تعرى."], [15, "هذه هي المدينة الطروب التي سكنت آمنة قائلة لنفسها: أنا وليس لي نظير! كيف صارت أطلالا، ومأوى للوحوش البرية؟ كل من يجتاز بها يصفر دهشة ويهز يده»."]]}], "kwAr": "نينوى", "noteAr": ""}, {"kw": "cry", "raw": "Jon_3:2; Isa_58:1; Jer_1:7-10; Eze_2:7, Eze_3:5-9; Mic_3:8; Mat_10:18", "note": "", "refs": [{"l": "Jon 3:2", "n": "", "vs": [[2, "«قم امض إلى نينوى المدينة العظيمة، وأعلن لهم الرسالة التي أبلغك إياها»."]]}, {"l": "Isa 58:1", "n": "", "vs": [[1, "ناد بأعلى صوتك، لا تصمت. اهتف بصوتك كنفير بوق، وأخبر شعبي بإثمهم، وذرية يعقوب بخطاياهم."]]}, {"l": "Jer 1:7-10", "n": "", "vs": [[7, "ولكن الرب أجابني: «لا تقل إني لست سوى ولد، لأنك ستذهب إلى كل من أبعث بك إليه، وتنطق بكل ما آمرك به."], [8, "لا تخف من حضرتهم لأني أنا معك لأنقذك»."], [9, "ثم مد الرب يده ولمس فمي وقال: «ها أنا أضع كلماتي في فمك."], [10, "انظر. ها أنا قد وليتك على أمم وشعوب لتستأصل وتهدم وتبدد وتقلب وتبني وتغرس»."]]}, {"l": "Eze 2:7", "n": "", "vs": [[7, "إنما عليك أن تبلغهم كلامي سواء سمعوا أو أبوا، لأنهم شعب متمرد."]]}, {"l": "Eze 3:5-9", "n": "", "vs": [[5, "فإنك لست مرسلا إلى أمة ذات لهجة غريبة ولغة مبهمة، بل إلى شعب إسرائيل،"], [6, "ولا إلى شعوب كثيرة غريبة اللهجات ومبهمة اللغات لا تفهم كلامهم. حقا لو أرسلتك إلى هؤلاء لسمعوا لك!"], [7, "لكن شعب إسرائيل لا يودون الاستماع لك، لأنهم لا يودون الاستماع لي، لأنهم جميعا معاندون قساة القلوب."], [8, "ها أنا قد جعلت وجهك صلبا مثل وجوههم، وجبهتك قاسية مثل جباههم."], [9, "قد جعلت جبهتك في صلابة الماس، أقسى من الصوان، فلا تخف منهم ولا ترتعب من مرآهم لأنهم شعب متمرد»."]]}, {"l": "Mic 3:8", "n": "", "vs": [[8, "أما أنا، فإني ممتليء بقوة روح الرب وبالحق والعزة، لأعلن لنسل يعقوب معاصيه ولإسرائيل خطيئته."]]}, {"l": "Mat 10:18", "n": "", "vs": [[18, "وتساقون للمثول أمام الحكام والملوك من أجلي: فيكون ذلك شهادة لي لدى اليهود والأمم على السواء."]]}], "kwAr": "وبلغ", "noteAr": ""}, {"kw": "for", "raw": "Gen_18:20,Gen_18:21; Ezr_9:6; Jam_5:4; Rev_18:5", "note": "", "refs": [{"l": "Gen 18:20", "n": "", "vs": [[20, "وقال الرب: «لأن الشكوى ضد مظالم سدوم وعمورة قد كثرت وخطيئتهم قد عظمت جدا"]]}, {"l": "Gen 18:21", "n": "", "vs": [[21, "أنزل لأرى إن كانت أعمالهم مطابقة للشكوى ضدهم وإلا فأعلم»."]]}, {"l": "Ezr 9:6", "n": "", "vs": [[6, "قائلا: «اللهم، إني أخجل وأخزى من أن أرفع وجهي نحوك، لأن آثامنا قد تكاثرت فوق رؤوسنا، ومعاصينا قد تعاظمت فبلغت عنان السماء،"]]}, {"l": "Jam 5:4", "n": "", "vs": [[4, "وهذه أجرة العمال الذين حصدوا حقولكم، تلك الأجرة التي مازلتم تحبسونها عنهم ظلما، إنها تصرخ، وصراخ أولئك العمال أنفسهم قد سمعه رب الجنود!"]]}, {"l": "Rev 18:5", "n": "", "vs": [[5, "فقد تراكمت خطاياها حتى بلغت السماء، وتذكر الله ما ارتكبته من آثام!"]]}], "kwAr": "لأن", "noteAr": ""}], "arS": [["«", []], ["هيا", ["H6965"]], [" ", []], ["امض", ["H1980"]], [" ", []], ["إلى", ["H413"]], [" ", []], ["نينوى", ["H5210"]], [" ", []], ["المدينة", ["H5892"]], [" ", []], ["العظيمة", ["H1419"]], [" ", []], ["وبلغ", ["H7121"]], [" أهلها قضائي، ", []], ["لأن", ["H3588"]], [" ", []], ["إثمهم", ["H7451"]], [" قد ", []], ["صعد", ["H5927"]], [" ", []], ["إلي", ["H6440"]], ["».", []]]}, {"c": 1, "v": 3, "text": "غير أن يونان تأهب ليهرب من الرب إلى ترشيش، فانحدر إلى مدينة يافا حيث عثر على سفينة مبحرة إلى ترشيش، فدفع أجرتها وصعد إليها ليتوجه مع بحارتها إلى ترشيش هربا من الرب.", "groups": [{"kw": "to flee", "raw": "Jon_4:2; Exo_4:13, Exo_4:14; 1Ki_19:3, 1Ki_19:9; Jer_20:7-9; Eze_3:14; Luk_9:62; Act_15:38, Act_26:19; 1Co_9:16", "note": "", "refs": [{"l": "Jon 4:2", "n": "", "vs": [[2, "وصلى إلى الرب قائلا: «أيها الرب، أليس هذا ما قلته عندما كنت في بلادي؟ لهذا أسرعت إلى الهرب إلى ترشيش، لأني عرفت أنك إله رحيم رؤوف بطيء الغضب كثير الإحسان، ترجع عن العقاب."]]}, {"l": "Exo 4:13", "n": "", "vs": [[13, "لكن موسى أجاب: «ياسيد، أتوسل إليك أن ترسل من تشاء غيري»."]]}, {"l": "Exo 4:14", "n": "", "vs": [[14, "فاحتدم غضب الرب على موسى وقال: «أليس هرون اللاوي أخاك؟ أنا أعلم أنه يحسن الكلام، وها هو أيضا قادم للقائك. وحالما يراك يبتهج قلبه."]]}, {"l": "1Ki 19:3", "n": "", "vs": [[3, "فلما سمع إيليا ذلك هرب لينجو بنفسه، ووصل إلى بئر سبع التابعة ليهوذا، حيث ترك خادمه."]]}, {"l": "1Ki 19:9", "n": "", "vs": [[9, "فدخل مغارة هناك وبات فيها وقال الرب لإيليا: «ماذا تفعل هنا ياإيليا؟»"]]}, {"l": "Jer 20:7-9", "n": "", "vs": [[7, "يارب قد أقنعتني فاقتنعت، أنت أقوى مني فغلبت، فأصبحت مثار سخرية طوال النهار. كل واحد يستهزيء بي."], [8, "لأني كلما تكلمت أصرخ منددا، وأنادي: «ظلم واغتصاب» فجلبت علي كلمة الرب الاحتقار والعار طوال النهار."], [9, "إن قلت: «سأكف عن ذكره ولا أتكلم باسمه بعد» صار كلامه في قلبي كنار محرقة محصورة في عظامي، فأعياني كتمانه وعجزت عن كبته."]]}, {"l": "Eze 3:14", "n": "", "vs": [[14, "وهكذا حلق بي روح الرب وحملني بعيدا، وقد جاشت حرارة روحي بمرارة نفسي، ولكن كانت يد الرب علي شديدة."]]}, {"l": "Luk 9:62", "n": "", "vs": [[62, "فقال له يسوع: «ما من أحد يضع يده على المحراث ويلتفت إلى الوراء، يصلح لملكوت الله»."]]}, {"l": "Act 15:38", "n": "", "vs": [[38, "ولكن بولس رفض أن يأخذاه معهما، لأنه كان قد فارقهما في بمفيلية، ولم يرافقهما في الخدمة."]]}, {"l": "Act 26:19", "n": "", "vs": [[19, "ومن ذلك الحين لم أعاند الرؤيا السماوية، أيها الملك أغريباس."]]}, {"l": "1Co 9:16", "n": "", "vs": [[16, "فمادمت أبشر بالإنجيل، فليس في ذلك فخر لي، لأنه واجب مفروض علي فالويل لي إن كنت لا أبشر!"]]}], "kwAr": "ليهرب", "noteAr": ""}, {"kw": "from", "raw": "Gen_3:8, Gen_4:16; Job_1:12, Job_2:7; Psa_139:7-12; 2Th_1:9", "note": "", "refs": [{"l": "Gen 3:8", "n": "", "vs": [[8, "ثم سمع الزوجان صوت الرب الإله ماشيا في الجنة عند هبوب ريح النهار، فاختبآ من حضرة الرب الإله بين شجر الجنة."]]}, {"l": "Gen 4:16", "n": "", "vs": [[16, "وهكذا خرج قايين من حضرة الرب وسكن في أرض نود شرقي عدن."]]}, {"l": "Job 1:12", "n": "", "vs": [[12, "فقال الرب للشيطان: «ها أنا أسلمك كل ما يملك. إنما لا تمد يدك إليه لتؤذيه». ثم انصرف الشيطان من حضرة الرب."]]}, {"l": "Job 2:7", "n": "", "vs": [[7, "فانصرف الشيطان من حضرة الرب، وابتلى أيوب بقروح انتشرت في بدنه كله، من قمة الرأس إلى أخمص القدم،"]]}, {"l": "Psa 139:7-12", "n": "", "vs": [[7, "أين المهرب من روحك؟ أين المفر من حضرتك؟"], [8, "إن صعدت إلى السماوات فأنت هناك، وإن جعلت فراشي في عالم الأموات فهناك أنت أيضا."], [9, "إن استعرت أجنحة الفجر وطرت، وسكنت في أقصى أطراف البحر"], [10, "فهناك أيضا يدك تهديني ويمناك تمسكني."], [11, "إن قلت في نفسي: ربما الظلمة تحجبني والضوء حولي يصير ليلا،"], [12, "فحتى الظلمة لا تخفي عنك شيئا، والليل كالنهار يضيء، فسيان عندك الظلام والضوء."]]}, {"l": "2Th 1:9", "n": "", "vs": [[9, "فهؤلاء سيكابدون عقاب الهلاك الأبدي، بعيدا من حضرة الرب ومن مجد قوته،"]]}], "kwAr": "من الرب", "noteAr": ""}, {"kw": "Joppa", "raw": "Jos_19:46; 2Ch_2:16; Act_9:36", "note": "", "refs": [{"l": "Jos 19:46", "n": "", "vs": [[46, "ومياه اليرقون والرقون مع الحدود المقابلة ليافا."]]}, {"l": "2Ch 2:16", "n": "", "vs": [[16, "ونحن نقوم بقطع الخشب من لبنان، على مقدار حاجتك، وننقله إليك أرماثا عائمة على البحر إلى ميناء يافا. ومن هناك يتم حمله إلى أورشليم»."]]}, {"l": "Act 9:36", "n": "", "vs": [[36, "وكان في مدينة يافا تلميذة اسمها طابيثا، ومعنى اسمها: غزالة، كان يشغلها دائما فعل الخير ومساعدة الفقراء."]]}], "kwAr": "يافا", "noteAr": ""}, {"kw": "Tarshish", "raw": "As Jonah embarked at Joppa, a seaport on the Mediterranean, it was probably either Tarsus in Cilicia, or rather Tartessus in Spain, to which he intended to flee. When we reflect how such a message would be received in the streets of London at this day, we shall not wonder at the prophets reluctance to announce the destruction of the proud and idolatrous Nineveh. Isa_2:16, Isa_23:1, Isa_23:6, Isa_23:10, Isa_60:9; Eze_27:12", "note": "As Jonah embarked at Joppa, a seaport on the Mediterranean, it was probably either Tarsus in Cilicia, or rather Tartessus in Spain, to which he intended to flee. When we reflect how such a message would be received in the streets of London at this day, we shall not wonder at the prophets reluctance to announce the destruction of the proud and idolatrous Nineveh. Isa_2:16, Isa_23:1, Isa_23:6, Isa_23:10, Isa_60:9; Eze_27:12", "refs": [{"l": "Isa 2:16", "n": "", "vs": [[16, "وعلى كل سفن ترشيش، وعلى كل صنعة جميلة،"]]}, {"l": "Isa 23:1", "n": "", "vs": [[1, "نبوءة بشأن صور: ولولي ياسفن ترشيش، لأن صور قد هدمت، فلم يبق بيت ولا مرفأ. تماما كما بلغكم النبأ وأنتم في أرض قبرص."]]}, {"l": "Isa 23:6", "n": "", "vs": [[6, "اعبروا إلى ترشيش، انتحبوا ياأهل الساحل."]]}, {"l": "Isa 23:10", "n": "", "vs": [[10, "امخري عباب البحر ياابنة ترشيش كما يخترق النيل أرض مصر إذ زال مرفأك من الوجود."]]}, {"l": "Isa 60:9", "n": "", "vs": [[9, "فالجزائر تنتظرني، وفي الطليعة سفن ترشيش حاملة أبناءك لتأتي بهم من أرض بعيدة، ومعهم فضتهم وذهبهم، تكريما لاسم الرب إلهك ولقدوس إسرائيل لأنه قد مجدك."]]}, {"l": "Eze 27:12", "n": "", "vs": [[12, "ترشيش تاجرت معك لكثرة ما فيك من أنواع الغنى، فدفعت فضة وحديدا وقصديرا ورصاصا لقاء بضائعك."]]}], "kwAr": "ترشيش", "noteAr": "لما كان يونان قد ركب البحر من يافا، ميناء على البحر المتوسط، فالأرجح أن ترشيش هي إما طرسوس في كيليكية أو بالأحرى ترتيسوس في إسبانيا، حيث نوى الهرب. وإذا تأملنا كيف تُستقبل مثل هذه الرسالة في شوارع لندن اليوم، فلن نعجب من تردد النبي في إعلان هلاك نينوى المتكبرة الوثنية. انظر إش 2: 16؛ 23: 1، 6، 10؛ 60: 9؛ حز 27: 12"}], "arS": [["غير أن ", []], ["يونان", ["H3124"]], [" ", []], ["تأهب", ["H6965"]], [" ", []], ["ليهرب", ["H1272"]], [" ", []], ["من", ["H4480", "H6440"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["إلى", ["H413"]], [" ", []], ["ترشيش", ["H8659"]], ["، ", []], ["فانحدر", ["H3381"]], [" إلى مدينة ", []], ["يافا", ["H3305"]], [" حيث ", []], ["عثر", ["H4672"]], [" على ", []], ["سفينة", ["H591"]], [" ", []], ["مبحرة", ["H935"]], [" إلى ", []], ["ترشيش", ["H8659"]], ["، ", []], ["فدفع", ["H5414"]], [" ", []], ["أجرتها", ["H7939"]], [" ", []], ["وصعد", ["H3381"]], [" إليها ", []], ["ليتوجه", ["H935"]], [" ", []], ["مع", ["H5973"]], [" بحارتها إلى ", []], ["ترشيش", ["H8659"]], [" هربا ", []], ["من", ["H4480", "H6440"]], [" ", []], ["الرب", ["H3068"]], [".", []]]}, {"c": 1, "v": 4, "text": "فأرسل الرب ريحا عاتية على البحر أثارت إعصارا بحريا، حتى أشرفت السفينة على الانكسار.", "groups": [{"kw": "the Lord", "raw": "Exo_10:13, Exo_10:19, Exo_14:21, Exo_15:10; Num_11:31; Psa_107:24-31, Psa_135:7; Amo_4:13; Mat_8:24-27; Act_27:13-20", "note": "", "refs": [{"l": "Exo 10:13", "n": "", "vs": [[13, "فمد موسى عصاه على أرض مصر، فأرسل الرب عليهم ريحا شرقية طوال ذلك النهار والليل، وما إن أقبل الصباح حتى حملت الريح الشرقية الجراد."]]}, {"l": "Exo 10:19", "n": "", "vs": [[19, "فأرسل الرب ريحا غربية عاصفة حملت الجراد وطرحته في البحر الأحمر، فلم تبق جرادة واحدة في جميع أرجاء مصر."]]}, {"l": "Exo 14:21", "n": "", 2197"]], [".", []]]}, {"c": 1, "v": 16, "text": "فانتاب الرجال خوف عظيم من الرب، وقربوا له ذبيحة ونذروا نذورا.", "groups": [{"kw": "feared", "raw": "Jon_1:10; Isa_26:9; Dan_4:34-37, Dan_6:26; Mar_4:31; Act_5:11", "note": "", "refs": [{"l": "Jon 1:10", "n": "", "vs": [[10, "فاعترى البحارة خوف عظيم وقالوا له بعد أن أخبرهم أنه هارب من الرب: «لماذا صنعت هذا؟»"]]}, {"l": "Isa 26:9", "n": "", "vs": [[9, "تتوق إليك نفسي في الليل، وفي الصباح تشتاق إليك روحي. عندما تسود أحكامك في الأرض يتعلم أهلها العدل."]]}, {"l": "Dan 4:34-37", "n": "", "vs": [[34, "وفي ختام السبعة الأزمنة، أنا نبوخذناصر، التفت نحو السماء، فرجع إلي عقلي، وباركت العلي وسبحت وحمدت الحي الأبدي ذا السلطان السرمدي، والذي ملكه على مدى الأجيال."], [35, "وعرفت أن كل أهل الأرض لا يحسبون شيئا، وأنه يفعل ما يشاء في جند السماء وسكان الأرض، وليس من يكف يده أو يقول له: ماذا تفعل؟"], [36, "في ذلك الحين ثاب إلي عقلي، وعاد إلي جلال مملكتي ومجدي وبهائي، وطلبني مشيري ونبلاء دولتي، وتثبت على عرش مملكتي وازدادت عظمتي جدا."], [37, "فالآن، أنا نبوخذناصر، أسبح وأمجد وأحمد ملك السماء الذي جميع أعماله حق، وطرقه عادلة وقادر على إذلال كل من يسلك بالكبرياء."]]}, {"l": "Dan 6:26", "n": "", "vs": [[26, "قد صدر مني أمر أن يرتعد كل من يقيم في تخوم مملكتي ويخاف أمام إله دانيآل، لأنه هو الإله الحي القيوم إلى الأبد، لا يزول له ملكوت وسلطانه إلى المنتهى."]]}, {"l": "Mar 4:31", "n": "", "vs": [[31, "إنه يشبه ببزرة خردل، تكون عند بذرها على الأرض أصغر من كل ما على الأرض من بزور،"]]}, {"l": "Act 5:11", "n": "", "vs": [[11, "فاستولت الرهبة الشديدة على الكنيسة كلها، وعلى كل من سمعوا ذلك الخبر."]]}], "kwAr": "فانتاب", "noteAr": ""}, {"kw": "offered", "raw": "etc. Heb. sacrificed a sacrifice unto the Lord, and vowed vows, Gen_8:20; Jdg_13:16; 2Ki_5:17; Psa_107:22; Isa_60:5-7", "note": "etc. Heb. sacrificed a sacrifice unto the Lord, and vowed vows, Gen_8:20; Jdg_13:16; 2Ki_5:17; Psa_107:22; Isa_60:5-7", "refs": [{"l": "Gen 8:20", "n": "", "vs": [[20, "وبنى نوح مذبحا للرب ثم اختار بعضا من جميع البهائم والطيور الطاهرة وقربها محرقات على المذبح."]]}, {"l": "Jdg 13:16", "n": "", "vs": [[16, "فأجاب ملاك الرب: «ولو أعقتني لن آكل من خبزك، وإن قربت محرقة فللرب قدمها». ولم يكن منوح يدرك أن الرجل هو ملاك الرب."]]}, {"l": "2Ki 5:17", "n": "", "vs": [[17, "عندئذ قال نعمان: «إذا، أرجو أن يعطى عبدك حمل بغلين من التراب، لأنه لن يقرب بعد اليوم محرقة ولا ذبيحة لآلهة أخرى، بل للرب وحده."]]}, {"l": "Psa 107:22", "n": "", "vs": [[22, "وليقربوا له ذبائح الشكر، ويحدثوا بأعماله بترانيم الفرح."]]}, {"l": "Isa 60:5-7", "n": "", "vs": [[5, "عندئذ تنظرين وتتهللين، وتطغى الإثارة على قلبك، وتمتلئين فرحا لأن ثروات البحر تتحول إليك وغنى الأمم يتدفق عليك."], [6, "تكتظ أرضك بكثرة الإبل. من أرض مديان وعيفة تغشاك بكران، تتقاطر إليك من شبا محملة بالذهب واللبان وتذيع تسبيح الرب."], [7, "جميع قطعان قيدار تجتمع إليك، وكباش نبايوت تخدمك، تقدم قرابين مقبولة على مذبحي، وأمجد بيتي البهي."]]}], "kwAr": "وقربوا", "noteAr": "إلخ. بالعبرية: «ذبحوا ذبيحة للرب ونذروا نذورا». انظر تك 8: 20؛ قض 13: 16؛ 2مل 5: 17؛ مز 107: 22؛ إش 60: 5-7"}, {"kw": "made", "raw": "Gen_28:20; Psa_50:14, Psa_66:13-16, Psa_116:14; Ecc_5:4", "note": "", "refs": [{"l": "Gen 28:20", "n": "", "vs": [[20, "ونذر يعقوب نذرا قائلا: «إن كان الله معي، ورعاني في هذه الطريق التي أنا أسير فيها ووفر لي طعاما لآكل وثيابا لألبس،"]]}, {"l": "Psa 50:14", "n": "", "vs": [[14, "قدم لله ذبائح الحمد وأوف العلي عهودك."]]}, {"l": "Psa 66:13-16", "n": "", "vs": [[13, "أدخل إلى بيتك بمحرقات وأوفيك نذوري"], [14, "التي نطقت بها شفتاي في وقت ضيقي، وتكلم بها فمي في بليتي."], [15, "أقرب لك محرقات سمينة من كباش مع بخور. أقدم بقرا مع تيوس."], [16, "تعالوا اسمعوا ياجميع خائفي الله، فأحدثكم بما فعل لنفسي."]]}, {"l": "Psa 116:14", "n": "", "vs": [[14, "أوفي نذوري للرب أمام كل شعبه."]]}, {"l": "Ecc 5:4", "n": "", "vs": [[4, "عندما تنذر نذرا لله لا تماطل في الوفاء به، لأنه لا يرضى عن الجهال، لذلك أوف نذورك،"]]}], "kwAr": "ونذروا", "noteAr": ""}], "arS": [["فانتاب", ["H3372", "H3374"]], [" ", []], ["الرجال", ["H376"]], [" خوف ", []], ["عظيم", ["H1419"]], [" من ", []], ["الرب", ["H3068"]], ["، ", []], ["وقربوا", ["H2076"]], [" له ", []], ["ذبيحة", ["H2077"]], [" ", []], ["ونذروا", ["H5087"]], [" ", []], ["نذورا", ["H5088"]], [".", []]]}, {"c": 1, "v": 17, "text": "وأما الرب فأعد حوتا عظيما ابتلع يونان. فمكث يونان في جوف الحوت ثلاثة أيام وثلاث ليال.", "groups": [{"kw": "the Lord", "raw": "Jon_4:6; Gen_1:21; Psa_104:25, Psa_104:26; Hab_3:2", "note": "", "refs": [{"l": "Jon 4:6", "n": "", "vs": [[6, "فأعد الرب الإله يقطينة نمت وارتفعت حتى ظللت رأس يونان لتقيه من شدة الحر فلا يؤذيه. فابتهج يونان باليقطينة ابتهاجا عظيما."]]}, {"l": "Gen 1:21", "n": "", "vs": [[21, "وهكذا خلق الله الحيوانات المائية الضخمة، والكائنات الحية التي اكتظت بها المياه، كلا حسب أجناسها، وأيضا الطيور وفقا لأنواعها. ورأى الله ذلك فاستحسنه."]]}, {"l": "Psa 104:25", "n": "", "vs": [[25, "هذا البحر الكبير الواسع، الذي يعج بمخلوقات لا تحصى من حيوانات مائية صغيرة وكبيرة"]]}, {"l": "Psa 104:26", "n": "", "vs": [[26, "تجري فيه السفن، تمرح فيه الحيتان التي خلقتها."]]}, {"l": "Hab 3:2", "n": "", "vs": [[2, "«يارب قد بلغني ما فعلت فخفت يارب، عملك في وسط السنين أحيه، وعرف به على مر الأيام، واذكر الرحمة في الغضب."]]}], "kwAr": "الرب", "noteAr": ""}, {"kw": "in", "raw": "Mat_12:40, Mat_16:4; Luk_11:30", "note": "", "refs": [{"l": "Mat 12:40", "n": "", "vs": [[40, "فكما بقي يونان في جوف الحوت ثلاثة أيام وثلاث ليال، هكذا سيبقى ابن الإنسان في جوف الأرض ثلاثة أيام وثلاث ليال."]]}, {"l": "Mat 16:4", "n": "", "vs": [[4, "جيل شرير خائن يطلب آية، ولن يعطى آية إلا ما حدث للنبي يونان». ثم فارقهم ومضى."]]}, {"l": "Luk 11:30", "n": "", "vs": [[30, "فإنه كما كان يونان آية لأهل نينوى، فهكذا أيضا يكون ابن الإنسان لهذا الجيل."]]}], "kwAr": "فمكث", "noteAr": ""}, {"kw": "belly", "raw": "Heb. bowels", "note": "Heb. bowels", "refs": [], "kwAr": "جوف الحوت", "noteAr": "بالعبرية: «أحشاء»."}], "arS": [["وأما ", []], ["الرب", ["H3068"]], [" ", []], ["فأعد", ["H4487"]], [" ", []], ["حوتا", ["H1709"]], [" ", []], ["عظيما", ["H1419"]], [" ", []], ["ابتلع", ["H1104"]], [" ", []], ["يونان", ["H3124"]], [". ", []], ["فمكث", ["H1961"]], [" ", []], ["يونان", ["H3124"]], [" في ", []], ["جوف", ["H4578"]], [" ", []], ["الحوت", ["H1709"]], [" ", []], ["ثلاثة", ["H7969"]], [" ", []], ["أيام", ["H3117"]], [" ", []], ["وثلاث", ["H7969"]], [" ", []], ["ليال", ["H3915"]], [".", []]]}, {"c": 2, "v": 1, "text": "ثم صلى يونان إلى الرب إلهه من جوف الحوت،", "groups": [{"kw": "prayed", "raw": "2Ch_33:11-13; Psa_50:15, Psa_91:15; Isa_26:16; Hos_5:15, Hos_6:1-3; Jam_5:13", "note": "", "refs": [{"l": "2Ch 33:11-13", "n": "", "vs": [[11, "لهذا أرسل الرب عليهم قادة جند ملك أشور، فقبضوا على منسى ووضعوا خزامة في أنفه، وقادوه مغلولا بسلاسل نحاس إلى بابل."], [12, "وفي ضيقه استغاث بالرب إلهه وتذلل جدا أمام إله آبائه،"], [13, "وابتهل إليه فاستجاب له، وسمع تضرعه ورده إلى أورشليم وإلى مملكته. فعلم منسى أن الرب هو الله ."]]}, {"l": "Psa 50:15", "n": "", "vs": [[15, "ادعني في يوم ضيقك أنقذك فتمجدني»."]]}, {"l": "Psa 91:15", "n": "", "vs": [[15, "يدعوني فأستجيب له، أرافقه في الضيق، أنقذه وأكرمه"]]}, {"l": "Isa 26:16", "n": "", "vs": [[16, "يارب قد طلبوك في المحنة، وسكبوا دعاءهم عند تأديبك لهم،"]]}, {"l": "Hos 5:15", "n": "", "vs": [[15, "ثم أرجع إلى موضعي إلى أن يعترفوا بإثمهم ويطلبوا وجهي، وفي ضيقهم يلتمسونني (قائلين):"]]}, {"l": "Hos 6:1-3", "n": "", "vs": [[1, "«تعالوا نرجع إلى الرب. هو الذي مزقنا إربا إربا، وهو وحده يبرئنا. هو الذي ضربنا، وهو وحده الذي يجبرنا."], [2, "بعد يومين يحيينا، وفي اليوم الثالث يقيمنا، لنحيا أمامه."], [3, "لنعرف، بل لنجد حتى نعرف الرب، فمجيئه يقين كالفجر، يقبل إلينا كإقبال المطر وكغيوث الربيع التي تروي الأرض»."]]}, {"l": "Jam 5:13", "n": "", "vs": [[13, "هل بينكم من يتألم؟ فليصل! وهل بينكم من هو سعيد؟ فليرتل!"]]}], "kwAr": "صلى", "noteAr": ""}, {"kw": "out", "raw": "Job_13:15; Psa_130:1, Psa_130:2; Lam_3:53-56; Act_16:24, Act_16:25", "note": "", "refs": [{"l": "Job 13:15", "n": "", "vs": [[15, "فها هو حتما يقضي علي ولا أمل لي. ومع ذلك فإني أبسط حجتي لأزكي طريقي أمامه."]]}, {"l": "Psa 130:1", "n": "", "vs": [[1, "أيها الرب إياك أدعو من الأعماق."]]}, {"l": "Psa 130:2", "n": "", "vs": [[2, "فاسمع يارب صوتي، ولتكن أذناك مرهفتين  فأجاب: «يعقوب»."], [28, "فقال: «لا يدعى اسمك في ما بعد يعقوب، بل إسرائيل (ومعناه: يجاهد مع الله)، لأنك جاهدت مع الله والناس وقدرت»."]]}, {"l": "1Sa 30:6", "n": "", "vs": [[6, "وتفاقم ضيق داود لأن الرجال، من فرط ما حل بهم من مرارة وأسى على أبنائهم وبناتهم، طالبوا برجمه، غير أن داود تشبث وتقوى بالرب إلهه."]]}, {"l": "Psa 4:1", "n": "", "vs": [[1, "استجب لي عندما أدعوك ياإله بري، فقد أفرجت لي دوما في الضيق، فأنعم علي وأصغ إلى صلاتي."]]}, {"l": "Psa 18:4-6", "n": "", "vs": [[4, "قد أحدقت بي حبال الموت، وأفزعتني سيول الهلاك."], [5, "حاقت بي حبال الهاوية، وأطبقت علي فخاخ الموت."], [6, "في ضيقي دعوت الرب وصرخت إلى إلهي، فسمع صوتي من هيكله، وصعد صراخي أمامه، بل دخل أذنيه."]]}, {"l": "Psa 22:24", "n": "", "vs": [[24, "فإنه لم يحتقر بؤس المسكين، ولا حجب عنه وجهه، بل استجاب له عندما صرخ إليه."]]}, {"l": "Psa 34:6", "n": "", "vs": [[6, "هذا المسكين استغاث، فسمعه الرب وأنقذه من جميع ضيقاته."]]}, {"l": "Psa 65:2", "n": "", "vs": [[2, "ياسامع الصلاة إليك يقبل كل إنسان."]]}, {"l": "Psa 120:1", "n": "", "vs": [[1, "صرخت إلى الرب في ضيقي فاستجاب لي."]]}, {"l": "Psa 142:1-3", "n": "", "vs": [[1, "بصوتي إلى الرب أصرخ. بصوتي إلى الرب أتضرع."], [2, "أبثه شكواي وأحدثه بضيقي."], [3, "عندما غشي على روحي في داخلي كنت أنت عالما بمسلكي. في الطريق التي سلكتها نصبوا لي فخا."]]}, {"l": "Luk 22:44", "n": "", "vs": [[44, "وإذ كان في صراع، أخذ يصلي بأشد إلحاح؛ حتى إن عرقه صار كقطرات دم نازلة على الأرض."]]}, {"l": "Heb 5:7", "n": "", "vs": [[7, "والمسيح، في أثناء حياته البشرية على الأرض، رفع أدعية وتضرعات مقترنة بصراخ شديد ودموع، إلى القادر أن يخلصه من الموت. وقد لبى الله طلبه إكراما لتقواه."]]}], "kwAr": "استغثت", "noteAr": ""}, {"kw": "by reason of mine", "raw": "or, out of mine, 1Sa_1:16", "note": "or, out of mine, 1Sa_1:16", "refs": [{"l": "1Sa 1:16", "n": "", "vs": [[16, "لا تظن أمتك ابنة بليعال، فإنني من فرط كربتي وغيظي قد أطلت صلاتي إلى الآن»."]]}], "kwAr": "في ضيقي", "noteAr": "أو: «من ضيقي». انظر 1صم 1: 16"}, {"kw": "out", "raw": "Psa_18:5, Psa_18:6, Psa_61:2, Psa_86:13, Psa_88:1-7, Psa_116:3", "note": "", "refs": [{"l": "Psa 18:5", "n": "", "vs": [[5, "حاقت بي حبال الهاوية، وأطبقت علي فخاخ الموت."]]}, {"l": "Psa 18:6", "n": "", "vs": [[6, "في ضيقي دعوت الرب وصرخت إلى إلهي، فسمع صوتي من هيكله، وصعد صراخي أمامه، بل دخل أذنيه."]]}, {"l": "Psa 61:2", "n": "", "vs": [[2, "من أقصى الأرض أدعوك إذا غشي على قلبي، فتهديني إلى صخرة عالية يتعذر ارتقاؤها."]]}, {"l": "Psa 86:13", "n": "", "vs": [[13, "لأن رحمتك عظيمة نحوي، وقد نجيت نفسي من الهاوية السفلى."]]}, {"l": "Psa 88:1-7", "n": "", "vs": [[1, "يارب إله خلاصي، أمامك أصرخ نهارا وليلا."], [2, "لتأت صلاتي أمامك، أمل أذنك إلى صرختي،"], [3, "فإن نفسي شبعت مصائب، وحياتي تقترب من الموت."], [4, "حسبت في عداد الهابطين إلى قعر هوة الموت، وكرجل لا قوة له."], [5, "تركوني أموت كقتلى الحرب الممددين في القبر، الذين لا تعود تذكرهم وتكف يدك عن إغاثتهم."], [6, "قد طرحتني في الهوة السفلى، في الأماكن المظلمة والعميقة."], [7, "استقر علي غضبك، وبأمواجك الطامية ذللتني."]]}, {"l": "Psa 116:3", "n": "", "vs": [[3, "طوقتني حبال الموت. أطبق علي رعب الهاوية. قاسيت ضيقا وحزنا."]]}], "kwAr": "ومن جوف", "noteAr": ""}, {"kw": "hell", "raw": "or, the grave, Psa_16:10; Isa_14:9; Mat_12:40; Act_2:27", "note": "or, the grave, Psa_16:10; Isa_14:9; Mat_12:40; Act_2:27", "refs": [{"l": "Psa 16:10", "n": "", "vs": [[10, "لأنك لن تترك نفسي في هوة الأموات ولن تدع وحيدك القدوس ينال منه الفساد."]]}, {"l": "Isa 14:9", "n": "", "vs": [[9, "ثارت الهاوية من أسفل لاَستقبالك عند قدومك وحشدت الأخيلة، من كل العظماء، لتحيتك؛ أنهضت كل ملوك الأمم عن عروشهم"]]}, {"l": "Mat 12:40", "n": "", "vs": [[40, "فكما بقي يونان في جوف الحوت ثلاثة أيام وثلاث ليال، هكذا سيبقى ابن الإنسان في جوف الأرض ثلاثة أيام وثلاث ليال."]]}, {"l": "Act 2:27", "n": "", "vs": [[27, "لأنك لن تترك نفسي في هوة الأموات، ولن تدع وحيدك القدوس يرى فسادا،"]]}], "kwAr": "الهاوية", "noteAr": "أو: «القبر». انظر مز 16: 10؛ إش 14: 9؛ مت 12: 40؛ أع 2: 27"}, {"kw": "and thou", "raw": "Psa_34:6, Psa_65:2", "note": "", "refs": [{"l": "Psa 34:6", "n": "", "vs": [[6, "هذا المسكين استغاث، فسمعه الرب وأنقذه من ج , {"l": "Isa 38:17", "n": "", "vs": [[17, "حقا إن ما قاسيته من مرارة كان من أجل خيري، فقد حفظتني بحبك من حفرة الهلاك، وألقيت جميع خطاياي خلف ظهرك."]]}, {"l": "Act 13:33-37", "n": "", "vs": [[33, "قد أتمه لنا نحن أبناءهم، إذ أقام يسوع من الموت وفقا لما كتب في المزمور الثاني: أنت ابني؛ أنا اليوم ولدتك."], [34, "وأما أن الله قد أقام يسوع من بين الأموات ولن يدع الفساد ينال منه فيما بعد، فقد ورد في قوله: سأمنحكم البركات المقدسة الصادقة التي وعدت بها داود."], [35, "ويقول داود في مزمور آخر: لن تدع وحيدك القدوس يرى فسادا."], [36, "وقد مات داود بعدما خدم شعبه في عصره وفقا لمشيئة الله، ودفن فلحق بآبائه، ونال منه الفساد."], [37, "أما الذي أقامه الله فلم ينل منه الفساد قط."]]}], "kwAr": "ولكنك", "noteAr": ""}, {"kw": "corruption", "raw": "or, the pit, Job_33:24, Job_33:28; Psa_30:3, Psa_30:9, Psa_55:23, Psa_143:7", "note": "or, the pit, Job_33:24, Job_33:28; Psa_30:3, Psa_30:9, Psa_55:23, Psa_143:7", "refs": [{"l": "Job 33:24", "n": "", "vs": [[24, "يترَأف عليه قائلا: أنقذه يارب من الانحدار إلى الهاوية، فقد وجدت له فدية."]]}, {"l": "Job 33:28", "n": "", "vs": [[28, "قد افتدى الله حياتي من الانحدار إلى الهاوية، فتنتعش حياتي لترى النور."]]}, {"l": "Psa 30:3", "n": "", "vs": [[3, "يارب، أنت انتشلت نفسي من شفا الهاوية. وأنقذتني من بين المنحدرين إلى عالم الأموات."]]}, {"l": "Psa 30:9", "n": "", "vs": [[9, "ماذا يجديك موتي ونزولي إلى القبر؟ أيستطيع ترابي أن يحمدك أو يحدث بأمانتك؟"]]}, {"l": "Psa 55:23", "n": "", "vs": [[23, "وأنت ياالله تطرح الأشرار إلى هوة الهلاك وتقصر أعمار سافكي الدماء والغشاشين. أما أنا فأتكل عليك."]]}, {"l": "Psa 143:7", "n": "", "vs": [[7, "أجبني مسرعا يارب. وهنت روحي فلا تحجب وجهك عني، لئلا أصير كالمنحدرين إلى القبر."]]}], "kwAr": "الهاوية", "noteAr": "أو: «الجب». انظر أي 33: 24، 28؛ مز 30: 3، 9؛ 55: 23؛ 143: 7"}], "arS": [["انحدرت", ["H3381"]], [" إلى ", []], ["أسس", ["H7095"]], [" ", []], ["الجبال", ["H2022"]], [" وهبطت إلى أعماق ", []], ["الأرض", ["H776"]], [" حيث أغلقت ", []], ["علي", ["H1157"]], [" ", []], ["مزاليجها", ["H1280"]], [" إلى ", []], ["الأبد", ["H5769"]], [". ولكنك ", []], ["تصعد", ["H5927"]], [" ", []], ["حياتي", ["H2416"]], [" من ", []], ["الهاوية", ["H4480", "H7845"]], [" أيها ", []], ["الرب", ["H3068"]], [" ", []], ["إلهي", ["H430"]], [".", []]]}, {"c": 2, "v": 7, "text": "عندما وهنت نفسي في داخلي، تذكرت إلهي، فحلقت صلاتي إليك، إلى هيكلك المقدس.", "groups": [{"kw": "my soul", "raw": "Psa_22:14, Psa_27:13, Psa_119:81-83; Heb_12:3", "note": "", "refs": [{"l": "Psa 22:14", "n": "", "vs": [[14, "صارت قوتي كالماء، وانحلت عظامي. صار قلبي كالشمع، وذاب في داخلي."]]}, {"l": "Psa 27:13", "n": "", "vs": [[13, "غير أني قد آمنت بأن أرى جود الرب في أرض الأحياء."]]}, {"l": "Psa 119:81-83", "n": "", "vs": [[81, "تتلهف نفسي إلى خلاصك. رجائي هو كلمتك."], [82, "كلت عيناي في انتظار كلامك، وأنا أقول: متى تعزيني؟"], [83, "أصبحت متغضنا كزق خمر من الحرارة والدخان، ولكني لم أنس فرائضك."]]}, {"l": "Heb 12:3", "n": "", "vs": [[3, "فتأملوا مليا ما قاساه بتحمله تلك المعاملة العنيفة التي عامله بها الخاطئون، لكي لا تتعبوا وتنهاروا!"]]}], "kwAr": "نفسي", "noteAr": ""}, {"kw": "I remembered", "raw": "1Sa_30:6; Psa_20:7, Psa_42:5, Psa_42:11, Psa_43:5, Psa_77:10,Psa_77:11, Psa_143:5; Isa_50:10; Lam_3:21-26; 2Co_1:9, 2Co_1:10", "note": "", "refs": [{"l": "1Sa 30:6", "n": "", "vs": [[6, "وتفاقم ضيق داود لأن الرجال، من فرط ما حل بهم من مرارة وأسى على أبنائهم وبناتهم، طالبوا برجمه، غير أن داود تشبث وتقوى بالرب إلهه."]]}, {"l": "Psa 20:7", "n": "", "vs": [[7, "يتكل هؤلاء على مركبات الحرب، وأولئك على الخيل. أما نحن فنتكل على اسم الرب إلهنا."]]}, {"l": "Psa 42:5", "n": "", "vs": [[5, "لماذا أنت مكتئبة يانفسي؟ ولماذا أنت قلقة في داخلي؟ ترجي الله، فإني سأظل أحمده، لأنه عوني وإلهي."]]}, {"l": "Psa 42:11", "n": "", "vs": [[11, "لماذا أنت مكتئبة يانفسي، ولماذا أنت قلقة؟ ترجي الله ، فإني سأظل أحمده، لأنه عوني وإلهي."]]}, {"l": "Psa 43:5", "n": "", "vs": [[5, "لماذا أنت مكتئبة يانفسي؟ لماذا أنت قلقة في داخلي؟ ترجي الله فإني سأظل أحمده، لأنه عوني وإلهي."]]}, {"l": "Psa 77:10", "n": "", "vs": [[10, "ثم قلت: «هذا يسقمني: أن يمين الله العلي قد تحولت (عنا)»"]]}, {"l": "Psa 77:11", "n": "", "vs": [[11, "أذكر أعمالك يارب. أذكر عجائبك التي عملتها في القديم،"]]}, {"l": "Psa 143:5", "n": "", "vs": [[5, "تذكرت الأيام السالفة متأملا في جميع أعمالك، متفكرا في صنيع يديك."]]}, {"l": "Isa 50:10", "n": "", "vs": [[10, "من منكم يتقي الرب ويطيع صوت خادمه؟ من الذي يسلك في الظلمة من غير نور؟ فليتكل على اسم الرب ويعتمد على إلهه."]]}, {"l": "Lam 3:21-26", "n": "", "vs": [[21, "ولكن هذا ما أناجي به نفسي، لذلك يغمرني الرجاء:"], [22, "من إحسانات الرب أننا لم نفن، لأن مراحمه لا تزول."], [23, "تتجدد في كل صباح. فائقة أمانتك."], [24, "تقول نفسي: «الرب هو نصيبي فلذلك أرجوه»."], [25, "الرب صالح لمن يرجونه وللنفس التي تلتمسه."], [26, "خير للمرء أن ينتظر بصمت خلاص الرب."]]}, {"l": "2Co 1:9", "n": "", "vs": [[9, "ولكننا شعرنا، في قرارة أنفسنا، أنه محكوم علينا بالموت، حتى نكون متكلين لا على أنفسنا بل على الله الذي يقيم الأموات؛"]]}, {"l": "2Co 1:10", "n": "", "vs": [[10, "وقد أنقذنا من هذا الموت الشنيع، ومازال ينقذنا حتى الآن، ولنا ملء الثقة بأنه حقا سينقذنا فيما بعد؛"]]}], "kwAr": "تذكرت", "noteAr": ""}, {"kw": "my prayer", "raw": "2Ch_30:27; Psa_18:6", "note": "", "refs": [{"l": "2Ch 30:27", "n": "", "vs": [[27, "ووقف الكهنة واللاويون وطلبوا البركة على الشعب فاستجاب الرب صلاتهم التي صعدت إلى مسكن قدسه في السماء."]]}, {"l": "Psa 18:6", "n": "", "vs": [[6, "في ضيقي دعوت الرب وصرخت إلى إلهي، فسمع صوتي من هيكله، وصعد صراخي أمامه، بل دخل أذنيه."]]}], "kwAr": "صلاتي", "noteAr": ""}, {"kw": "holy", "raw": "Jon_2:4; Psa_11:4, Psa_65:4; Mic_1:2; Hab_2:20", "note": "", "refs": [{"l": "Jon 2:4", "n": "", "vs": [[4, "فقلت: قد طردت من حضرتك، ولن أعود أتفرس في هيكلك المقدس."]]}, {"l": "Psa 11:4", "n": "", "vs": [[4, "مازال الرب في هيكله المقدس. الرب في السماء عرشه. تبصر عيناه بني آدم، وتتقصاهم أجفانه."]]}, {"l": "Psa 65:4", "n": "", "vs": [[4, "طوبى لمن تختاره وتقربه ليسكن في ديارك. فنشبع من خيرات بيتك، خيرات هيكلك المقدس."]]}, {"l": "Mic 1:2", "n": "", "vs": [[2, "اسمعوا ياجميع الشعوب، وأصغي أيتها الأرض وكل من فيها، وليكن السيد الرب من هيكله المقدس شاهدا صنع سوى أصنام بكماء."], [19, "ويل لمن يقول لمنحوت خشبي: «استيقظ» أو لحجر أبكم: «انهض». أيمكن أن يهدي؟ إنما هو مغشى بالذهب والفضة وخال من كل حياة."], [20, "أما الرب ففي هيكله المقدس، فلتصمت الأرض كلها في محضره»."]]}], "kwAr": "", "noteAr": ""}], "arS": [["إن الذين ", []], ["يبجلون", ["H8104"]], [" ", []], ["الأصنام", ["H1892"]], [" ", []], ["الباطلة", ["H7723"]], [" ", []], ["يتخلون", ["H5800"]], [" عن مصدر ", []], ["نعمتهم", ["H2617"]], [".", []]]}, {"c": 2, "v": 9, "text": "أما أنا فبهتاف الحمد أذبح لك، وما نذرته أوفي به، لأن للرب الخلاص».", "groups": [{"kw": "I will sacrifice", "raw": "Gen_35:3; Psa_50:14, Psa_50:23, Psa_66:13-15, Psa_107:22, Psa_116:17, Psa_116:18; Jer_33:11; Hos_14:2; Rom_12:1; Heb_13:15", "note": "", "refs": [{"l": "Gen 35:3", "n": "", "vs": [[3, "ثم تعالوا لنذهب إلى بيت إيل لأشيد هناك مذبحا لله الذي استجاب لي في يوم ضيقتي، ورافقني في الطريق التي سلكتها»."]]}, {"l": "Psa 50:14", "n": "", "vs": [[14, "قدم لله ذبائح الحمد وأوف العلي عهودك."]]}, {"l": "Psa 50:23", "n": "", "vs": [[23, "أما من يقدم لي ذبيحة حمد فهو يمجدني، ومن يقوم طريقه أريه خلاص الله»."]]}, {"l": "Psa 66:13-15", "n": "", "vs": [[13, "أدخل إلى بيتك بمحرقات وأوفيك نذوري"], [14, "التي نطقت بها شفتاي في وقت ضيقي، وتكلم بها فمي في بليتي."], [15, "أقرب لك محرقات سمينة من كباش مع بخور. أقدم بقرا مع تيوس."]]}, {"l": "Psa 107:22", "n": "", "vs": [[22, "وليقربوا له ذبائح الشكر، ويحدثوا بأعماله بترانيم الفرح."]]}, {"l": "Psa 116:17", "n": "", "vs": [[17, "لك أقدم ذبائح الشكر، وأدعو باسمك."]]}, {"l": "Psa 116:18", "n": "", "vs": [[18, "أوفي نذوري للرب أمام كل شعبه."]]}, {"l": "Jer 33:11", "n": "", "vs": [[11, "أصوات الطرب والسرور، وهتاف العريس والعروس، وأصوات المقبلين إلى هيكل الرب بقرابين الشكر القائلين: احمدوا الرب القدير، لأن الرب صالح ورحمته إلى الأبد تدوم، لأني أرد سبي الأرض فتصبح آهلة كالأيام الخوالي."]]}, {"l": "Hos 14:2", "n": "", "vs": [[2, "احملوا معكم كلام ابتهال وارجعوا إلى الرب قائلين له: «انزع إثمنا، وتقبلنا بفائق رحمتك، فنزجي إليك حمد شفاهنا كالقرابين."]]}, {"l": "Rom 12:1", "n": "", "vs": [[1, "لذلك أتوسل إليكم أيها الإخوة، نظرا لمراحم الله، أن تقدموا له أجسادكم ذبيحة مقدسة مقبولة عنده، وهي عبادتكم بعقل."]]}, {"l": "Heb 13:15", "n": "", "vs": [[15, "فبالمسيح، رئيس كهنتنا، لنقرب لله دائما ذبيحة الحمد والتسبيح، أي الثمار التي تنتجها أفواهنا المعترفة باسمه."]]}], "kwAr": "أذبح لك", "noteAr": ""}, {"kw": "I will pay", "raw": "Deu_23:18; 2Sa_15:7; Job_22:27; Ecc_5:4, Ecc_5:5", "note": "", "refs": [{"l": "Deu 23:18", "n": "", "vs": [[18, "لا تأتوا بتقدمة نذر ما إلى بيت الرب إلهكم من مكسب زانية أو مأبون، لأن كليهما رجس أمام الرب."]]}, {"l": "2Sa 15:7", "n": "", "vs": [[7, "وبعد انقضاء أربع سنوات قال أبشالوم للملك: «دعني أنطلق إلى حبرون لأوفي نذري الذي نذرته للرب."]]}, {"l": "Job 22:27", "n": "", "vs": [[27, "تصلي إليه فيستجيب، وتوفي نذورك،"]]}, {"l": "Ecc 5:4", "n": "", "vs": [[4, "عندما تنذر نذرا لله لا تماطل في الوفاء به، لأنه لا يرضى عن الجهال، لذلك أوف نذورك،"]]}, {"l": "Ecc 5:5", "n": "", "vs": [[5, "لأنه خير أن لا تنذر من أن تنذر ولا تفي."]]}], "kwAr": "أوفي به", "noteAr": ""}, {"kw": "Salvation", "raw": "Psa_3:8, Psa_37:39, Psa_37:40, Psa_68:20; Isa_45:17; Joh_4:22; Act_4:12; Rev_7:10", "note": "", "refs": [{"l": "Psa 3:8", "n": "", "vs": [[8, "أنت وحدك المخلص يارب. فلتفض بركتك على شعبك."]]}, {"l": "Psa 37:39", "n": "", "vs": [[39, "لكن خلاص الأبرار من عند الرب، فهو حصنهم في زمان الضيق."]]}, {"l": "Psa 37:40", "n": "", "vs": [[40, "يعينهم الرب حقا، وينقذهم من الأشرار، ويخلصهم لأنهم احتموا به."]]}, {"l": "Psa 68:20", "n": "", "vs": [[20, "إلهنا هو إله الخلاص، وعند الرب السيد منافذ من الموت."]]}, {"l": "Isa 45:17", "n": "", "vs": [[17, "أما إسرائيل فقد خلصه الرب بخلاص أبدي، ولن يلحقكم عار أو خزي مدى الدهور،"]]}, {"l": "Joh 4:22", "n": "", "vs": [[22, "أنتم تعبدون ما تجهلون، ونحن نعبد ما نعلم، لأن الخلاص هو من عند اليهود."]]}, {"l": "Act 4:12", "n": "", "vs": [[12, "وليس بأحد غيره الخلاص، إذ ليس تحت السماء اسم آخر قدمه الله للبشر به يجب أن نخلص!»"]]}, {"l": "Rev 7:10", "n": "", "vs": [[10, "وهم يهتفون بصوت عال: «الخلاص من عند إلهنا الجالس على العرش ومن عند الحمل!»"]]}], "kwAr": "الخلاص", "noteAr": ""}], "arS": [["أما ", []], ["أنا", ["H589"]], [" ", []], ["فبهتاف", ["H6963"]], [" ", []], ["الحمد", ["H8426"]], [" ", []], ["أذبح", ["H2076"]], [" لك، وما ", []], ["نذرته", ["H5087"]], [" ", []], ["أوفي", ["H7999"]], [" به، لأن ", []], ["للرب", ["H3068"]], [" ", []], ["الخلاص", ["H3444"]], ["».", []]]}, {"c": 2, "v": 10, "text": "فأمر الرب الحوت فقذف بيونان إلى الشاطيء.", "groups": [{"kw": "", "raw": "Jon_1:17; Gen_1:3, Gen_1:7, Gen_1:9, Gen_1:11, Gen_1:14; Psa_33:9, Psa_105:31, Psa_105:34; Isa_50:2; Mat_8:8, Mat_8:9, Mat_8:26, Mat_8:27", "note": "", "refs": [{"l": "Jon 1:17", "n": "", "vs": [[17, "وأما الرب فأعد حوتا عظيما ابتلع يونان. فمكث يونان في جوف الحوت ثلاثة أيام وثلاث ليال."]]}, {"l": "Gen 1:3", "n": "", "vs": [[3, "أمر الله : «ليكن نور». فصار نور،"]]}, {"l": "Gen 1:7", "n": "", "vs": [[7, "فخلق الله الجلد، وفرق بين المياه التي تحملها السحب والمياه التي تغمر الأرض. وهكذا كان."]]}, {"l": "Gen 1:9", "n": "", "vs": [[9, "ثم أمر الله : «لتتجمع المياه التي تحت السماء إلى موضع واحد، ولتظهر اليابسة». وهكذا كان."]]}, {"l": "Gen 1:11", "n": "", "vs": [[11, "وأمر الله : «لتنبت الأرض عشبا وبقلا مبزرا، وشجرا مثمرا فيه بزره الذي ينتج ثمرا كجنسه في الأرض». وهكذا كان."]]}, {"l": "Gen 1:14", "n": "", "vs": [[14, "ثم أمر الله : «لتكن أنوار في جلد السماء لتفرق بين النهار والليل، فتكون علامات لتحديد أزمنة وأيام وسنين."]]}, {"l": "Psa 33:9", "n": "", "vs": [[9, "قال كلمة فكان. وأمر فصار!"]]}, {"l": "Psa 105:31", "n": "", "vs": [[31, "أمر فأقبل الذباب والبعوض فانتشر في كل أرضهم"]]}, {"l": "Psa 105:34", "n": "", "vs": [[34, "أمر، فتوافد الجراد الطيار والزحاف بأعداد لا تحصى،"]]}, {"l": "Isa 50:2", "n": "", "vs": [[2, "فمالي إذا حين أتيت لم أجد أحدا؟ ناديت ولا من مجيب؟ هل قصرت يدي عن الفداء؟ أم لم تعد لي طاقة على الإنقاذ؟ ها أنا بزجرتي أجفف البحر وأحول الأنهار إلى صحراء ينتن سمكها لخلوها من الماء، فيموت من العطش."]]}, {"l": "Mat 8:8", "n": "", "vs": [[8, "فأجاب قائد المئة: «ياسيد، أنا لا أستحق أن تدخل تحت سقف بيتي. إنما  10 minutes e. It was not only a very ancient (Gen_10:11), but also a very great city. Strabo says that it was much larger than Babylon, the circuit of which he estimates at 385 furlongs; and, according to Diodorus Siculus, it was an oblong parallelogram, extending 150 furlongs in length, 90 in breadth, and 480 in circumference, i.e., about 20 miles long, 12 broad, and 60 in compass. This agrees with the account given here of its being an exceeding great city of three days journey, i.e., in circuit; for 20 miles a day was the common computation for a pedestrian. It was surrounded by large walls 100 feet high, so broad that three chariots could drive abreast on them, and defended by 1,500 towers 200 feet in height. See notes on Nahum. Jon_3:3, Jon_1:2; Zep_2:13-15", "note": "Nineveh, the capital of Assyria, was situated on the eastern bank of the river Tigris, opposite the present Mosul, about 280 miles north of Babylon, 400 ne of Damascus, in latitude 36 degrees 20 minutes n longitude 73 degrees 10 minutes e. It was not only a very ancient (Gen_10:11), but also a very great city. Strabo says that it was much larger than Babylon, the circuit of which he estimates at 385 furlongs; and, according to Diodorus Siculus, it was an oblong parallelogram, extending 150 furlongs in length, 90 in breadth, and 480 in circumference, i.e., about 20 miles long, 12 broad, and 60 in compass. This agrees with the account given here of its being an exceeding great city of three days journey, i.e., in circuit; for 20 miles a day was the common computation for a pedestrian. It was surrounded by large walls 100 feet high, so broad that three chariots could drive abreast on them, and defended by 1,500 towers 200 feet in height. See notes on Nahum. Jon_3:3, Jon_1:2; Zep_2:13-15", "refs": [{"l": "Gen 10:11", "n": "", "vs": [[11, "ومن تلك الأرض خرج أشور وبنى مدن نينوى ورحبوت عير وكالح،"]]}, {"l": "Jon 3:3", "n": "", "vs": [[3, "فهب يونان وتوجه إلى نينوى بموجب أمر الرب. وكانت نينوى مدينة بالغة العظمة يستغرق اجتيازها ثلاثة أيام."]]}, {"l": "Jon 1:2", "n": "", "vs": [[2, "«هيا امض إلى نينوى المدينة العظيمة وبلغ أهلها قضائي، لأن إثمهم قد صعد إلي»."]]}, {"l": "Zep 2:13-15", "n": "", "vs": [[13, "ثم يبسط يده نحو الشمال ويبيد أشور ويجعل نينوى قفرا موحشا، أرضا قاحلة كالصحراء."], [14, "تربض في وسطها القطعان وسائر وحوش البر، ويأوي إلى تيجان أعمدتها القوق والقنفذ وينعب الغراب على عتباتها، لأن أرزها قد تعرى."], [15, "هذه هي المدينة الطروب التي سكنت آمنة قائلة لنفسها: أنا وليس لي نظير! كيف صارت أطلالا، ومأوى للوحوش البرية؟ كل من يجتاز بها يصفر دهشة ويهز يده»."]]}], "kwAr": "نينوى", "noteAr": "نينوى، عاصمة آشور، كانت على الضفة الشرقية لنهر دجلة، قبالة الموصل الحالية، على بعد نحو 280 ميلا شمالي بابل و400 ميل شمال شرقي دمشق. وكانت مدينة قديمة جدا (انظر تك 10: 11) وعظيمة جدا أيضا. يقول سترابون إنها كانت أكبر بكثير من بابل التي قدّر محيطها بـ385 غلوة، وعند ديودورس الصقلي أنها متوازي أضلاع مستطيل طوله 150 غلوة وعرضه 90 ومحيطه 480، أي نحو 20 ميلا طولا و12 عرضا و60 محيطا. وهذا يوافق وصفها هنا بأنها مدينة بالغة العظمة مسيرة ثلاثة أيام، أي في محيطها؛ إذ كان المعتاد أن يقطع الماشي 20 ميلا في اليوم. وكانت محاطة بأسوار عالية ارتفاعها 100 قدم، عريضة بحيث تسير عليها ثلاث مركبات جنبا إلى جنب، وتحميها 1500 برج ارتفاع كل منها 200 قدم. انظر الملاحظات على سفر ناحوم. انظر يون 3: 3؛ 1: 2؛ صف 2: 13-15"}, {"kw": "preach", "raw": "Jer_1:17, Jer_15:19-21; Eze_2:7, Eze_3:17; Mat_3:8; Joh_5:14", "note": "", "refs": [{"l": "Jer 1:17", "n": "", "vs": [[17, "أما أنت فتأهب، وقم وكلمهم بكل ما آمرك به. لا تخف من حضرتهم لئلا أفزعك أمامهم."]]}, {"l": "Jer 15:19-21", "n": "", "vs": [[19, "لذلك، هكذا قال الرب: «إن رجعت أستردك فتمثل أمامي. إن نطقت بالقول السديد ونبذت الكلام الغث، أجعلك المتحدث بفمي، فيقبلون إليك مسترشدين، وأنت لا تلجأ إليهم طالبا نصيحة."], [20, "وأجعلك سورا نحاسيا منيعا لهذا الشعب، فيحاربونك ولكنهم يخفقون، لأني أنا معك لأنقذك وأخلصك."], [21, "أنقذك من قبضة الأشرار، وأفديك من أكف العتاة»."]]}, {"l": "Eze 2:7", "n": "", "vs": [[7, "إنما عليك أن تبلغهم كلامي سواء سمعوا أو أبوا، لأنهم شعب مت 24", "n": "", "vs": [[21, "ولكن إن رجع الشرير عن خطاياه كلها التي ارتكبها، ومارس جميع فرائضي وصنع ما هو عدل وحق فإنه حتما يحيا، لا يموت."], [22, "ولا تذكر له جميع آثامه التي ارتكبها. إنما يحيا ببره الذي عمله."], [23, "أحقا أسر بموت الشرير يقول السيد الرب؟ أليس برجوعه عن طرقه الآثمة فيحيا؟"], [24, "وإذا تحول الصديق عن بره وارتكب إثما على غرار كل الرجاسات التي يرتكبها الشرير، أفيحيا؟ إن كل ما صنعه من بر لا يذكر له. إنما يموت بخيانته التي خانها، وما اقترفه من خطايا."]]}, {"l": "Eze 18:27", "n": "", "vs": [[27, "وإذا رجع الأثيم عن شره الذي اقترفه ومار س الحق والعدل، فهو يحيي نفسه،"]]}, {"l": "Eze 18:28", "n": "", "vs": [[28, "لأنه اعتبر وتاب عن كل ذنوبه التي ارتكبها. لذلك حتما يحيا. لا يموت."]]}, {"l": "Eze 18:30-32", "n": "", "vs": [[30, "لذلك أدينكم ياشعب إسرائيل، كل واحد بمقتضى طرقه، يقول السيد الرب. توبوا وارجعوا عن ذنوبكم كلها، فلا يكون لكم الإثم معثرة هلاك."], [31, "اطرحوا عنكم كل ذنوبكم التي ارتكبتموها، واحصلوا لأنفسكم على قلب جديد وروح جديدة. فلماذا تنقرضون ياشعب إسرائيل؟"], [32, "إذ لا أسر بموت أحد، يقول السيد الرب، فتوبوا واحيوا."]]}, {"l": "Eze 33:11", "n": "", "vs": [[11, "قل لهم: حي أنا يقول السيد الرب، إني لا أبتهج بموت الشرير بل بأن يرتدع عن غيه ويحيا. ارجعوا، ارجعوا عن طرقكم الرديئة! لماذا تموتون ياشعب إسرائيل؟"]]}, {"l": "Dan 4:27", "n": "", "vs": [[27, "لذلك أيها الملك، تقبل مشورتي وتخل عن خطاياك بالبر وآثامك بممارسة الرحمة مع البائسين، عسى أن يطول فلاحك»."]]}, {"l": "Mat 3:8", "n": "", "vs": [[8, "فأثمروا ثمرا يليق بالتوبة."]]}, {"l": "Act 3:19", "n": "", "vs": [[19, "فتوبوا وارجعوا ليمحو الله خطاياكم،"]]}, {"l": "Act 26:20", "n": "", "vs": [[20, "فبشرت أهل دمشق أولا، ثم أهل أورشليم ومنطقة اليهودية كلها، ثم الأجانب. فدعوت الجميع إلى التوبة والرجوع إلى الله، والقيام بأعمال تليق بالتوبة."]]}], "kwAr": "وعلى جميع", "noteAr": ""}, {"kw": "the violence", "raw": "Isa_59:6", "note": "", "refs": [{"l": "Isa 59:6", "n": "", "vs": [[6, "لا تصلح خيوطهم لنسيج الثياب، ولا يكتسون بأعمالهم، لأن أعمالهم هي أعمال إثم، وأفعال الظلم قد ارتكبتها أيديهم."]]}], "kwAr": "ظل
