 الزنى، ولا تشبع من الخطيئة. وكم من نفوس ضعيفة تقع في فخاخهم! أما قلوبهم، فقد تدربت على الشهوة والطمع. إنهم حقا أبناء اللعنة!", "groups": [{"kw": "eyes", "raw": "2Sa_11:2-4; Job_31:7, Job_31:9; Pro_6:25; Mat_5:28; 1Jo_2:16", "note": "", "refs": [{"l": "2Sa 11:2-4", "n": "", "vs": [[2, "وفي إحدى الأمسيات نهض داود عن سريره وأخذ يتمشى على سطح قصره، فشاهد امرأة ذات جمال أخاذ تستحم."], [3, "فأرسل داود من يتحرى عنها. فأبلغه أحدهم: «هذه بثشبع بنت أليعام زوجة أوريا الحثي»،"], [4, "فبعث داود يستدعيها. فأقبلت إليه وضاجعها إذ كانت قد تطهرت من طمثها، ثم رجعت إلى بيتها."]]}, {"l": "Job 31:7", "n": "", "vs": [[7, "إن حادت خطواتي عن الطريق، وغوى قلبي وراء عيني، وعلقت بيدي لطخة عار،"]]}, {"l": "Job 31:9", "n": "", "vs": [[9, "إن هام قلبي وراء امرأة، أو طفت عند باب جاري،"]]}, {"l": "Pro 6:25", "n": "", "vs": [[25, "لا تشته جمالها في قلبك ولا تأسر لبك بأهدابها."]]}, {"l": "Mat 5:28", "n": "", "vs": [[28, "أما أنا فأقول لكم: كل من ينظر إلى امرأة بقصد أن يشتهيها، فقد زنى بها في قلبه!"]]}, {"l": "1Jo 2:16", "n": "", "vs": [[16, "لأن كل ما في العالم، من شهوات الجسد وشهوات العين وترف المعيشة، ليس من الآب، بل من العالم."]]}], "kwAr": "عيونهم", "noteAr": ""}, {"kw": "adultery", "raw": "Gr. an adulteress", "note": "Gr. an adulteress", "refs": [], "kwAr": "الزنى", "noteAr": "في اليونانية: زانية."}, {"kw": "that cannot", "raw": "Isa_1:16; Jer_13:23; Mat_12:34; Joh_5:44", "note": "", "refs": [{"l": "Isa 1:16", "n": "", "vs": [[16, "اغتسلوا، تطهروا، أزيلوا شر أعمالكم من أمام عيني. كفوا عن اقتراف الإثم،"]]}, {"l": "Jer 13:23", "n": "", "vs": [[23, "هل يمكن للإثيوبي أن يغير جلده، أو للنمر رقطه؟ كذلك أنتم لا تقدرون أن تصنعوا خيرا بعد أن ألفتم ارتكاب الشر."]]}, {"l": "Mat 12:34", "n": "", "vs": [[34, "ياأولاد الأفاعي، كيف تقدرون، وأنتم أشرار، أن تتكلموا كلاما صالحا؟ لأن الفم يتكلم بما يفيض به القلب."]]}, {"l": "Joh 5:44", "n": "", "vs": [[44, "من أين لكم أن تؤمنوا بي وأنتم تقبلون المجد بعضكم من بعض، دون أن تسعوا في طلب المجد الذي لا يمنحه إلا الله !"]]}], "kwAr": "لا تشبع من الخطيئة", "noteAr": ""}, {"kw": "beguiling", "raw": "2Pe_2:18, 2Pe_3:16; Mar_13:22; Rom_16:18; 1Co_11:19; Eph_4:14; Col_2:18; Jam_1:8; Rev_12:9", "note": "", "refs": [{"l": "2Pe 2:18", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."]]}, {"l": "2Pe 3:16", "n": "", "vs": [[16, "وما كتبه في رسالته إليكم، يوافق ما كتبه في باقي رسائله. وفي تلك الرسائل كلها أمور صعبة الفهم، يحرفها الجهال وغير الراسخين في الحق، كما يحرفون غيرها أيضا من الكتابات الموحى بها، فيجلبون الهلاك على أنفسهم."]]}, {"l": "Mar 13:22", "n": "", "vs": [[22, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Rom 16:18", "n": "", "vs": [[18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."]]}, {"l": "1Co 11:19", "n": "", "vs": [[19, "لأنه لابد من وجود المذاهب بينكم، حتى يبرز الفاضلون فيكم."]]}, {"l": "Eph 4:14", "n": "", "vs": [[14, "وذلك حتى لا نكون فيما بعد أطفالا تتقاذفنا وتحملنا كل ريح تعليم يقوم على خداع الناس والمكر بهم لجرهم إلى الضلال الملفق،"]]}, {"l": "Col 2:18", "n": "", "vs": [[18, "لا يحرمكم أحد من جائزتكم، بحملكم على ما يرغب فيه من إظهار التواضع والتعبد للملائكة، داخلا في رؤى يتوهمها، وقد نفخه باطلا ذهنه الجسدي،"]]}, {"l": "Jam 1:8", "n": "", "vs": [[8, "فعندما يكون الإنسان برأيين، لا يثبت على قرار في جميع أموره."]]}, {"l": "Rev 12:9", "n": "", "vs": [[9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."]]}], "kwAr": "تقع في فخاخهم", "noteAr": ""}, {"kw": "an heart", "raw": "2Pe_2:3; Jud_1:11", "note": "", "refs": [{"l": "2Pe 2:3", "n": "", "vs": [[3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "Jud 1:11", "n": "", "vs": [[11, "الويل لهم! لأنهم سلكوا طريق قايين، واندفعوا إلى ارتكاب خطيئة بلعام طلبا للمال، وتمردوا كما تمرد قورح، فدمروا أنفسهم."]]}], "kwAr": "قلوبهم قد تدربت", "noteAr": "" "n": "", "vs": [[10, "لذلك أنا أيضا لا تترَأف عيني ولا أعفو، إنما أوقع ذنب تصرفاتهم على رؤوسهم»."]]}, {"l": "Pro 28:4", "n": "", "vs": [[4, "من يهمل الشريعة يحمد الشرير، والذي يحافظ عليها يخاصمه."]]}, {"l": "Hos 14:8", "n": "", "vs": [[8, "يقول أفرايم تائبا: «مالي وللأصنام!» فيجيب الرب: «قد استمعت وأنا رعيتك بعين الرضى وصرت لك كشجرة سرو خضراء، ومني أمدك بثمرك»."]]}, {"l": "Act 13:10", "n": "", "vs": [[10, "«أيها الممتليء غشا وخبثا! ياابن إبليس! ياعدو كل بر! أما تكف عن تعويج طرق الرب المستقيمة؟"]]}], "kwAr": "خرجوا عن الطريق المستقيم", "noteAr": ""}, {"kw": "Balaam", "raw": "Num_22:5-7", "note": "", "refs": [{"l": "Num 22:5-7", "n": "", "vs": [[5, "ثم بعث برسل يستدعي بلعام بن بعور، المقيم في موطنه في فتور، الواقعة على نهر الفرات قائلا: «ها قد خرج شعب من مصر يغشي وجه الأرض بكثرته، وهو منتشر أمامي."], [6, "فتعال الآن والعن لي هذا الشعب لأنه أعظم مني، لعلي أتمكن من دحره وطرده من الأرض، لأني عرفت أن من تباركه يكون مباركا ومن تلعنه يكون ملعونا»."], [7, "فمضى شيوخ موآب وشيوخ مديان حاملين معهم حلوان العرافة، وأقبلوا على بلعام وأبلغوه كلام بالاق."]]}], "kwAr": "بلعام بن بعور", "noteAr": ""}, {"kw": "who", "raw": "Num_22:18-21, Num_22:23, Num_22:28, Num_31:16; Deu_23:4, Deu_23:5; Mic_6:5; Jud_1:11; Rev_2:14", "note": "", "refs": [{"l": "Num 22:18-21", "n": "", "vs": [[18, "فأجاب بلعام رسل بالاق: «لا يمكنني أن أعصى أمر الرب إلهي في أي عمل صغير أو كبير، ولو أغدق علي بالاق ملء قصره فضة وذهبا."], [19, "فالآن، اقضوا هنا ليلتكم لأعلم بماذا يعود الرب فيوصيني به»."], [20, "فتراءى الله لبلعام ليلا وقال له: «إن جاء الرجال يستدعونك فقم وامض معهم، إنما لا تنطق إلا بما آمرك به فقط»."], [21, "فنهض بلعام صباحا وأسرج أتانه، وانطلق مع رؤساء موآب."]]}, {"l": "Num 22:23", "n": "", "vs": [[23, "فأبصرت الأتان ملاك الرب منتصبا في الطريق، وقد استل سيفه بيده، فحادت عن الطريق ومشت في الحقل. فضربها بلعام ليردها إلى الطريق."]]}, {"l": "Num 22:28", "n": "", "vs": [[28, "عندئذ أنطق الرب الأتان، فقالت لبلعام: «ماذا جنيت حتى ضربتني الآن ثلاث دفعات؟»"]]}, {"l": "Num 31:16", "n": "", "vs": [[16, "إنهن باتباع أتانه وغلاماه معه."], [23, "فأبصرت الأتان ملاك الرب منتصبا في الطريق، وقد استل سيفه بيده، فحادت عن الطريق ومشت في الحقل. فضربها بلعام ليردها إلى الطريق."], [24, "ثم وقف ملاك الرب في ممر للكروم يقوم على جانبيه حائطان."], [25, "فلما شاهدت الأتان ملاك الرب زحمت جانب الحائط وضغطت رجل بلعام عليه، فضربها أيضا."], [26, "ثم اجتاز به ملاك الرب ووقف في موضع ضيق، لا سبيل فيه للتحول يمنة أو يسرة."], [27, "فلما رأت الأتان ملاك الرب ربضت تحت بلعام. فثار غضب بلعام وضرب الأتان بالقضيب."], [28, "عندئذ أنطق الرب الأتان، فقالت لبلعام: «ماذا جنيت حتى ضربتني الآن ثلاث دفعات؟»"], [29, "فقال بلعام: «لأنك سخرت مني. لو كان في يدي سيف لكنت قد قتلتك»."], [30, "فأجابته الأتان: «ألست أنا أتانك التي ركبت عليها دائما إلى هذا اليوم؟ وهل عودتك أن أصنع بك هكذا؟» فقال: «لا»."], [31, "عندئذ كشف الرب عن عيني بلعام، فشاهد ملاك الرب منتصبا في الطريق وسيفه مسلول في يده، فخر على وجهه ساجدا."], [32, "فقال له ملاك الرب: «لماذا ضربت الآن أتانك ثلاث مرات؟ فها أنا قد جئت لأعترضك، لأن طريقك ملتوية في نظري،"], [33, "فشاهدتني الأتان فحادت من أمامي ثلاث مرات. ولو لم تفعل لكنت قد قتلتك واستحييتها»."]]}], "kwAr": "الحمار الأبكم", "noteAr": ""}, {"kw": "the madness", "raw": "Ecc_7:25, Ecc_9:3; Hos_9:7; Luk_16:11; Act_26:11, Act_26:24, Act_26:25", "note": "", "refs": [{"l": "Ecc 7:25", "n": "", "vs": [[25, "فتفحصت قلبي لأعلم وأبحث وأنشد الحكمة وألتمس جواهر الأشياء وأعرف جهالة الشر، وحماقة الجنون."]]}, {"l": "Ecc 9:3", "n": "", "vs": [[3, "وأشر ما يجري تحت الشمس أن الجميع يلقون نفس المصير، وأن قلوب بني البشر مفعمة بالشر، وفي حياتهم تمتليء صدورهم بالحماقة، ثم يموتون!"]]}, {"l": "Hos 9:7", "n": "", "vs": [[7, "لقد أزفت أيام العقاب وحان يوم الحساب، فليعلم إسرائيل هذا. لكثرة إثمك وفرط حقدك حسب النبي أحمق، ورجل الروح مجنونا."]]}, {"l": "Luk 16:11", "n": "", "vs": [[11, "فإن لم تكونوا أمناء في مال الظلم، فمن يأتمنكم على مال الحق؟"]]}, {"l": "Act 26:11", "n": "", "vs": [[11, "وكم عذبتهم في المجامع كلها لأجبرهم على التجديف. وقد بلغ حقدي عليهم درجة جعلتني أطاردهم في المدن التي في خارج البلاد."]]}, {"l": "Act 26:24", "n": "", "vs": [[24, "وما إن وصل بولس في دفاعه إلى هذا الحد، حتى قاطعه فستوس قائلا بصوت عال: «جننت يابولس! إن تبحرك في العلم أصابك بالجنون!»"]]}, {"l": "Act 26:25", "n": "", "vs": [[25, "فقال بولس: «لست مجنونا ياسمو الحاكم فستوس، فأنا أنطق بكلام الحق والصواب."]]}], "kwAr": "حماقة ذلك النبي", "noteAr": ""}], "arS": [["ولكنه ", []], ["توبخ", ["G2192", "G1649"]], [" على هذه ", []], ["المخالفة", ["G3892"]], [" التي ارتكبها. إذ إن ", []], ["الحمار", ["G5268"]], [" ", []], ["الأبكم", ["G880"]], [" ", []], ["نطق", ["G5350"]], [" ", []], ["بصوت", ["G5456"]], [" ", []], ["بشري", ["G444"]], ["، ", []], ["فوضع حدا", ["G2967"]], [" ", []], ["لحماقة", ["G3913"]], [" ذلك ", []], ["النبي", ["G4396"]], ["!", []]]}, {"c": 2, "v": 17, "text": "فليس هؤلاء إلا آبارا لا ماء فيها، وغيوما تسوقها الريح العاصفة. ويا له من مصير مرعب محجوز لهم في الظلام الأبدي القاتم!", "groups": [{"kw": "are wells", "raw": "Job_6:14-17; Jer_14:3; Hos_6:4; Jud_1:12, Jud_1:13", "note": "", "refs": [{"l": "Job 6:14-17", "n": "", "vs": [[14, "الإنسان المكروب يحتاج إلى وفاء أصدقائه، حتى لو تخلى عن خشية القدير."], [15, "قد غدر بي إخواني كسيل انقطع ماؤه، وكمياه الأودية العابرة،"], [16, "التي عكرها البرد حيث يختفي فيها الجليد،"], [17, "فتتلاشى في فصل الجفاف، وتختفي من مكانها عند اشتداد الحر،"]]}, {"l": "Jer 14:3", "n": "", "vs": [[3, "أرسل أشرافهم خدامهم ليحملوا إليهم الماء، فأقبلوا إلى الجباب وإذا بها فارغة من الماء، فرجعوا بجرار خاوية وقد اعتراهم الخزي والخجل وغطوا رؤوسهم."]]}, {"l": "Hos 6:4", "n": "", "vs": [[4, "ماذا أصنع بك ياإسرائيل، وأي شيء أفعله بك يايهوذا؟ إن حبكم يتلاشى كسحابة الصبح ويتبخر كالندى."]]}, {"l": "Jud 1:12", "n": "", "vs": [[12, "إنهم يشتركون معكم في ولائم المحبة دون خجل، ولكنهم كصخور تعيقكم. لا هم لهم سوى تعليف أنفسهم! إنهم يشبهون غيوما بلا مطر تسوقها الرياح، وأشجارا خريفية بلا ثمر، يقتلعها أصحابها، فتكون قد ماتت مرتين."]]}, {"l": "Jud 1:13", "n": "", "vs": [[13, "وبأعمالهم المخجلة يفضحون أنفسهم كأمواج في البحر هائجة تقذف الأوساخ. وهم أشبه بنجوم تائهة في الفضاء، مصيرها الظلام الشديد إلى الأبد!"]]}], "kwAr": "آبارا لا ماء فيها", "noteAr": ""}, {"kw": "clouds", "raw": "Eph_4:14", "note": "", "refs": [{"l": "Eph 4:14", "n": "", "vs": [[14, "وذلك حتى لا نكون فيما بعد أطفالا تتقاذفنا وتحملنا كل ريح تعليم يقوم على خداع الناس والمكر بهم لجرهم إلى الضلال الملفق،"]]}], "kwAr": "غيوما تسوقها الريح", "noteAr": ""}, {"kw": "mist", "raw": "The blackness, ζοφος [Strongs G2217], of darkness, darkness itself, says Leigh.", "note": "The blackness, ζοφος [Strongs G2217], of darkness, darkness itself, says Leigh.", "refs": [], "kwAr": "القاتم", "noteAr": "قتام، ζοφος [Strongs G2217]: قتام الظلمة، أي الظلمة نفسها، كما يقول لِي."}, {"kw": "darkness", "raw": "2Pe_2:4; Mat_8:12, Mat_22:13, Mat_25:30; Jud_1:6, Jud_1:13", "note": "", "refs": [{"l": "2Pe 2:4", "n": "", "vs": [[4, "فإن الله لم يشفق على الملائكة الذين أخطأوا، بل طرحهم في أعماق هاوية الظلام مقيدين بالسلاسل، حيث يظلون محبوسين إلى يوم الحساب."]]}, {"l": "Mat 8:12", "n": "", "vs": [[12, "أما بنو الملكوت، فيطرحون في الظلمة الخارجية، هناك يكون البكاء وصرير الأسنان!»"]]}, {"l": "Mat 22:13", "n": "", "vs": [[13, "فأمر الملك خدامه قائلا: قيدوا رجليه ويديه، واطرحوه في الظلام الخارجي، هنالك يكون البكاء وصرير الأسنان!"]]}, {"l": "Mat 25:30", "n": "", "vs": [[30, "أما هذا العبد الذي لا نفع منه، فاطرحوه في الظلمة الخارجية، هناك يكون البكاء وصرير الأسنان!"]]}, {"l": "Jud 1:6", "n": "", "vs": [[6, "وأما الملائكة الذين لم يحافظوا على مقامهم الرفيع، بل تركوا مركزهم، فمازال الرب يحفظهم مقيدين بسلاسل أبدية في أعماق الظلام، بانتظار دينونة ذلك اليوم العظيم."]]}, {"l": "Jud 1:13", "n": "", "vs": [[13, "وبأعمالهم المخجلة يفضحون أنفسهم كأمواج في البحر هائجة تقذف الأوساخ. وهم أشبه بنجوم تائهة في الفضاء، مصيرها الظلام الشديد إلى الأبد!"]]}], "kwAr": "الظلام الأبدي", "noteAr": ""}], "arS": [["فليس هؤلاء إلا ", []], ["آبارا", ["G4077"]], [" ", []], ["لا ماء فيها", ["G504"]], ["، ", []], ["وغيوما", ["G3507"]], [" ", []], ["تسوقها", ["G1643"]], [" ", []], ["الريح العاصفة", ["G2978"]], [". ويا له من مصير مرعب ", []], ["محجوز", ["G5083"]], [" لهم في ", []], ["الظلام", ["G4655"]], [" ", []], ["الأبدي", ["G1519", "G165"]], [" ", []], ["القاتم", ["G2217"]], ["!", []]]}, {"c": 2, "v": 18, "text": "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال.", "groups": [{"kw": "they speak", "raw": "Psa_52:1-3, Psa_73:8, Psa_73:9; Dan_4:30, Dan_11:36; Act_8:9; 2Th_2:4; Jud_1:13, Jud_1:15, Jud_1:16; Rev_13:5, Rev_13:6, Rev_13:11", "note": "", "refs": [{"l": "Psa 52:1-3", "n": "", "vs": [[1, "لماذا تتفاخر بالشر أيها الجبار؟ إن رحمة الله تدوم اليوم كله"], [2, "لسانك يخترع المساويء، ويمارس الغش ويجرح كالموسى المسنونة."], [3, "أحببت الشر أكثر من الخير، والكذب أكثر من الصدق."]]}, {"l": "Psa 73:8", "n": "", "vs": [[8, "يستهزئون ويتكلمون بالظلم خبثا، وبكبرياء ينطقون."]]}, {"l": "Psa 73:9", "n": "", "vs": [[9, "جدفوا على السماء بأفواههم، ولوثوا الأرض بخبث ألسنتهم."]]}, {"l": "Dan 4:30", "n": "", "vs": [[30, "قال: «أليست هذه هي بابل العظيمة التي بنيتها بقوة اقتداري لتكون عاصمة للمملكة، ولجلال مجدي؟»"]]}, {"l": "Dan 11:36", "n": "", "vs": [[36, "ويصنع الملك ما يطيب له، ويتعظم على كل إله، ويجدف بالعظائم على إله الآلهة، ويفلح، إلى أن يحين اكتمال الغضب إذ لابد أن يتم ما قضى الله به."]]}, {"l": "Act 8:9", "n": "", "vs": [[9, "وكان قبل ذلك في تلك المدينة ساحر اسمه سيمون، يمارس السحر فيذهل أهل السامرة ويدعي أنه رجل عظيم."]]}, {"l": "2Th 2:4", "n": "", "vs": [[4, "الذي يتحدى كل ما يدعى إلها أو معبودا، ويعاديه مترفعا عليه. بل إنه أيضا يتخذ من هيكل الله مقرا له، محاولا أن يبرهن أنه إله."]]}, {"l": "Jud 1:13", "n": "", "vs": [[13, "وبأعمالهم المخجلة يفضحون أنفسهم كأمواج في البحر هائجة تقذف الأوساخ. وهم أشبه بنجوم تائهة في الفضاء، مصيرها الظلام الشديد إلى الأبد!"]]}, {"l": "Jud 1:15", "n": "", "vs": [[15, "ليدين جميع الناس، ويوبخ جميع الأشرار الذين لا يهابون الله ، بسبب جميع أعمالهم الشريرة التي ارتكبوها وجميع أقوالهم القاسية التي أهانوه بها والتي لا تصدر إلا عن الخاطئين الأشرار غير الأتقياء!»"]]}, {"l": "Jud 1:16", "n": "", "vs": [[16, "وهؤلاء المعلمون يتذمرون ويشكون دائما وفيما هم يندفعون وراء شهواتهم، يطلقون ألسنتهم متحدثين بأمور طنانة، ويمدحون من يعجبهم طلبا للمنفعة!"]]}, {"l": "Rev 13:5", "n": "", "vs": [[5, "وأعطى التنين الوحش فما ينطق بكلام الكبرياء والتجديف، وأعطاه سلطة العمل مدة اثنين وأربعين شهرا."]]}, {"l": "Rev 13:6", "n": "", "vs": [[6, "فأخذ الوحش يشتم اسم الله، ويشتم بيته وسكان السماء."]]}, {"l": "Rev 13:11", "n": "", "vs": [[11, "ثم رأيت وحشا آخر خارجا من الأرض، له قرنان صغيران كقرني خروف، ولكن صوته كصوت تنين،"]]}], "kwAr": "ينطقون", "noteAr": ""}, {"kw": "great swelling", "raw": "Υπερογκα [Strongs G5246], things puffed up with the wind.", "note": "Υπερογκα [Strongs G5246], things puffed up with the wind.", "refs": [], "kwAr": "بأقوال طنانة فارغة", "noteAr": "Υπερογκα [Strongs G5246]: أمور منتفخة بالريح."}, {"kw": "wantonness", "raw": "Rom_13:13; Jam_5:5", "note": "", "refs": [{"l": "Rom 13:13", "n": "", "vs": [[13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."]]}, {"l": "Jam 5:5", "n": "", "vs": [[5, "أنتم تعيشون على الأرض عيشة رفاهية وانصراف إلى المباهج واللذات؛ وقد أصبحت قلوبكم سمينة كأنها جاهزة ليوم الذبح."]]}], "kwAr": "الدعارة", "noteAr": ""}, {"kw": "that were", "raw": "2Pe_2:20, 2Pe_1:4; Act_2:40", "note": "", "refs": [{"l": "2Pe 2:20", "n": "", "vs": [[20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."]]}, {"l": "2Pe 1:4", "n": "", "vs": [[4, "اللذين بهما أعطانا الله بركاته العظمى الثمينة التي كان قد وعد بها. وبهذا صار بإمكانكم أن تتخلصوا من الفساد الذي تنشره الشهوة في العالم، وتشتركوا في الطبيعة الإلهية."]]}, {"l": "Act 2:40", "n": "", "vs": [[40, "ثم شهد بطرس للحاضرين ووعظهم بكلام كثير آخر، قائلا: «اخلصوا من هذا الجيل المنحرف!»"]]}], "kwAr": "فيصطادون من كانوا", "noteAr": ""}, {"kw": "clean", "raw": "or, for a little, or, a while, as some read", "note": "or, for a little, or, a while, as some read", "refs": [], "kwAr": "بدأوا ينفصلون", "noteAr": "أو: قليلًا، أو: لفترة، كما تقرأ بعض النسخ."}], "arS": [["ينطقون", ["G5350"]], [" بأقوال ", []], ["طنانة", ["G5246"]], [" ", []], ["فارغة", ["G3153"]], ["، مشجعين على الانغماس في ", []], ["الشهوات", ["G1939"]], [" ", []], ["الجسدية", ["G4561"]], [" بممارسة ", []], ["الدعارة", ["G766"]], ["، ", []], ["فيصطادون", ["G1185"]], [" من كانوا قد بدأوا ", []], ["ينفصلون", ["G668", "G3689"]], [" عن رفاق السوء الذين ", []], ["يسلكون", ["G390"]], [" في ", []], ["الضلال", ["G4106"]], [".", []]]}, {"c": 2, "v": 19, "text": "يعدون هؤلاء بالحرية، وهم أنفسهم عبيد للفساد! لأن الإنسان يصير عبدا لكل ما يتسلط عليه ويغلبه.", "groups": [{"kw": "they promise", "raw": "Gal_5:1, Gal_5:13; 1Pe_2:16", "note": "", "refs": [{"l": "Gal 5:1", "n": "", "vs": [[1, "إن المسيح قد حررنا وأطلقنا في سبيل الحرية. فاثبتوا إذن، ولا تعودوا إلى الارتباك بنير العبودية."]]}, {"l": "Gal 5:13", "n": "", "vs": [[13, "فإنما إلى الحرية قد دعيتم، أيها الإخوة؛ ولكن لا تتخذوا من الحرية ذريعة لإرضاء الجسد، بل بالمحبة كونوا عبيدا في خدمة أحدكم الآخر."]]}, {"l": "1Pe 2:16", "n": "", "vs": [[16, "تصرفوا كأحرار حقا، لا كالذين يتخذون من الحرية ستارا لارتكاب الشر بل باعتبار أنكم عبيد لله."]]}], "kwAr": "يعدون بالحرية", "noteAr": ""}, {"kw": "they themselves", "raw": "Joh_8:34; Rom_6:12-14, Rom_6:16-22; Tit_3:3", "note": "", "refs": [{"l": "Joh 8:34", "n": "", "vs": [[34, "أجابهم يسوع: «الحق الحق أقول لكم: إن من يرتكب الخطيئة يكون عبدا لها."]]}, {"l": "Rom 6:12-14", "n": "", "vs": [[12, "إذن، لا تملكن الخطيئة في جسدكم المائت فتنقادوا لها في شهواته."], [13, "ولا تقدموا أعضاءكم للخطيئة أسلحة للإثم، بل قدموا أنفسكم لله باعتباركم أقمتم من بين الأموات أحياء، وأعضاءكم لله أسلحة للبر."], [14, "فلن يكون للخطيئة سيادة عليكم، إذ لستم خاضعين للشريعة بل للنعمة."]]}, {"l": "Rom 6:16-22", "n": "", "vs": [[16, "أما تعلمون أنكم عندما تقدمون أنفسكم عبيدا للطاعة، تكونون للذي تطيعونه عبيدا: إما للخطيئة فإلى الموت، وإما للطاعة فإلى البر؟"], [17, "إنما الشكر لله، لأنكم كنتم عبيدا للخطيئة ولكن أطعتم من القلب صيغة التعليم الذي وضعتم في عهدته."], [18, "والآن، إذ حررتم من الخطيئة، صرتم عبيدا للبر."], [19, "أتكلم بشريا هنا بسبب ضعفكم البشري. فكما قدمتم سابقا أعضاءكم عبيدا للنجاسة والإثم في خدمة الإثم، كذلك قدموا الآن أعضاءكم عبيدا للبر في خدمة القداسة."], [20, "فإنكم، لما كنتم عبيدا للخطيئة، كنتم أحرارا من البر."], [21, "ولكن أي ثمر أنتجتم حينذاك من الأمور التي تخجلون بها الآن، وما عاقبتها إلا الموت؟"], [22, "أما الآن، وقد حررتم من الخطيئة وصرتم عبيدا لله، فإن لكم ثمركم للقداسة، والعاقبة هي الحياة الأبدية."]]}, {"l": "Tit 3:3", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."]]}], "kwAr": "وهم أنفسهم عبيد للفساد", "noteAr": ""}, {"kw": "overcome", "raw": "2Pe_2:20; Isa_28:1; Jer_23:9; 2Ti_2:26", "note": "", "refs": [{"l": "2Pe 2:20", "n": "", "vs": [[20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."]]}, {"l": "Isa 28:1", "n": "", "vs": [[1, "ويل (لمدينة السامرة) تاج فخر سكارى أفرايم، ولزهرة جمالها المجيدة الذابلة التي تتوج رأس وادي خصب المخمورين."]]}, {"l": "Jer 23:9", "n": "", "vs": [[9, "ثم تكلم إرميا عن الأنبياء الكذبة فقال: «إن قلبي منكسر في داخلي، وجميع عظامي ترتجف، فأنا بتأثير الرب وبفعل كلامه المقدس كرجل سكران غلبت عليه الخمر"]]}, {"l": "2Ti 2:26", "n": "", "vs": [[26, "فيعودوا إلى الصواب ناجين من فخ إبليس الذي أطبق عليهم، ليعملوا إرادته."]]}], "kwAr": "يتسلط عليه ويغلبه", "noteAr": ""}], "arS": [["يعدون", ["G1861"]], [" هؤلاء ", []], ["بالحرية", ["G1657"]], ["، وهم أنفسهم ", []], ["عبيد", ["G1401"]], [" ", []], ["للفساد", ["G5356"]], ["! لأن ", []], ["الإنسان", ["G5100"]], [" يصير ", []], ["عبدا", ["G1402"]], [" لكل ما يتسلط عليه ", []], ["ويغلبه", ["G2274"]], [".", []]]}, {"c": 2, "v": 20, "text": "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم.", "groups": [{"kw": "after", "raw": "Mat_12:43-45; Luk_11:24-26; Heb_6:4-8, Heb_10:26, Heb_10:27", "note": "", "refs": [{"l": "Mat 12:43-45", "n": "", "vs": [[43, "ولكن متى خرج الروح النجس من إنسان يسكنه، يهيم في الأماكن القاحلة طالبا الراحة، فلا يجد."], [44, "فيقول: أرجع إلى مسكني الذي فارقته! ويرجع، فيجده فارغا مكنوسا مزينا."], [45, "فيذهب، ويحضر معه سبعة أرواح أخرى أكثر منه شرا، فتدخل جميعا وتسكن ذلك الإنسان، فتكون آخرته أسوأ من حالته الأولى. هكذا تكون حال هذا الجيل الشرير! »"]]}, {"l": "Luk 11:24-26", "n": "", "vs": [[24, "بعد أن يخرج الروح النجس من الإنسان، يهيم في الأماكن القاحلة طلبا للراحة، وإذ لا يجد، يقول: سأرجع إلى بيتي الذي غادرته!"], [25, "وعندما يأتي، يجده مكنوسا مزينا."], [26, "فيذهب ويصطحب سبعة أرواح أخر أردأ منه، فتدخل ذلك الإنسان وتسكنه، فتصير الحالة الأخيرة لذلك الإنسان أردأ من الأولى! »"]]}, {"l": "Heb 6:4-8", "n": "", "vs": [[4, "ذلك لأن الذين قد تعرضوا مرة لنور الإيمان بالمسيح، فذاقوا العطية السماوية، وصاروا (إلى حين) من شركاء الروح القدس،"], [5, "وذاقوا كلمة الله الطيبة، وشاهدوا المعجزات التي تظهر عظمة «العالم الآتي»،"], [6, "ثم ارتدوا إلى تلك الأسس القديمة، أولئك يستحيل عليهم أن يتجددوا ثانية فيعودوا إلى التوبة. فهم يجنون على أنفسهم إذ يصلبون ابن الله مرة ثانية ويجعلونه عرضة للعار."], [7, "ولا عجب، فالتربة التي تشرب الأمطار النازلة عليها مرارا كثيرة، ثم تنتج نباتا ينفع الذين حرثوها، تنال البركة من الله!"], [8, "ولكنها، إن أخرجت الشوك والعشب البري، تكون مرفوضة وتستحق اللعنة، وما نهايتها إلا الحريق."]]}, {"l": "Heb 10:26", "n": "", "vs": [[26, "فإن أخطأنا عمدا برفضنا للمسيح بعد حصولنا على معرفة الحق، لا تبقى هناك ذبيحة لغفران الخطايا،"]]}, {"l": "Heb 10:27", "n": "", "vs": [[27, "بل انتظار العقاب الأكيد في لهيب النار التي ستلتهم المتمردين. ويا له من انتظار مخيف!"]]}], "kwAr": "بعد أن يتعرفوا", "noteAr": ""}, {"kw": "escaped", "raw": "2Pe_2:18, 2Pe_1:4", "note": "", "refs": [{"l": "2Pe 2:18", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون مساء شارحا لهم أمور ملكوت الله ومحاولا إقناعهم بالأمور المختصة بيسوع استنادا إلى شريعة موسى وكتب الأنبياء."]]}, {"l": "1Pe 1:10-12", "n": "", "vs": [[10, "وكم فتش الأنبياء قديما وبحثوا عن هذا الخلاص! فهم تنبأوا عن نعمة الله التي كان قد أعدها لكم أنتم،"], [11, "واجتهدوا لمعرفة الزمان والأحوال التي كان يشير إليها روح المسيح الذي كان عاملا فيهم، عندما شهد لهم مسبقا بما ينتظر المسيح من آلام، وبما يأتي بعدها من أمجاد."], [12, "ولكن الله أوحى إليهم أن اجتهادهم لم يكن لمصلحتهم هم، بل لمصلحتكم أنتم. فقد كان ذلك من أجل البشارة التي نقلها إليكم في الزمان الحاضر مبشرون يؤيدهم الروح القدس المرسل من السماء. ويالها من أمور يتمنى حتى الملائكة أن يطلعوا عليها!"]]}, {"l": "Rev 19:10", "n": "", "vs": [[10, "فجثوت عند قدميه لأسجد له، فقال لي: «لا تفعل! إني عبد لله، مثلك ومثل إخوتك المؤمنين الذين لديهم الشهادة المختصة بيسوع: لله اسجد! فإن الشهادة المختصة بيسوع هي روح النبوءة»."]]}], "kwAr": "تتذكروا الأقوال", "noteAr": ""}, {"kw": "and of", "raw": "2Pe_3:15, 2Pe_2:21; Eph_2:20; 1Jo_4:6; Jud_1:17", "note": "", "refs": [{"l": "2Pe 3:15", "n": "", "vs": [[15, "وتأكدوا أن تأني ربنا في رجوعه، هو فرصة للخلاص."]]}, {"l": "2Pe 2:21", "n": "", "vs": [[21, "وبالحقيقة، كان أفضل لهم لو أنهم لم يتعرفوا بطريق البر، من أن يتعرفوا به ثم يرتدوا عن الوصية المقدسة التي تسلموها."]]}, {"l": "Eph 2:20", "n": "", "vs": [[20, "وقد بنيتم على أساس الرسل والأنبياء، والمسيح يسوع نفسه هو حجر الزاوية الأساس،"]]}, {"l": "1Jo 4:6", "n": "", "vs": [[6, "أما نحن، فإننا من الله، ولذلك يصغي إلينا فقط من يعرف الله . أما الذي ليس من الله، فلا يصغي إلينا. وبهذا، نميز بين روح الحق وروح الضلال."]]}, {"l": "Jud 1:17", "n": "", "vs": [[17, "أما أنتم أيها الأحباء، فاذكروا دائما ما قاله رسل ربنا يسوع المسيح."]]}], "kwAr": "وصية الرب والمخلص", "noteAr": ""}], "arS": [["وغايتي أن ", []], ["تتذكروا", ["G3415"]], [" ", []], ["الأقوال", ["G4487"]], [" التي ", []], ["أعلنها", ["G4280"]], [" ", []], ["الأنبيا ء", ["G4396"]], [" ", []], ["القديسون", ["G40"]], [" قديما، وكذلك ", []], ["وصية", ["G1785"]], [" ", []], ["الرب", ["G2962"]], [" ", []], ["والمخلص", ["G4990"]], ["، تلك الوصية التي نقلها إليكم ", []], ["الرسل", ["G652"]], [".", []]]}, {"c": 3, "v": 3, "text": "فاعلموا، قبل كل شيء أنه سيأتي في آخر الأيام أناس مستهزئون يسخرون بالحق، ويسلكون منجرفين وراء شهواتهم الخاصة.", "groups": [{"kw": "that there", "raw": "1Ti_4:1, 1Ti_4:2; 2Ti_3:1; 1Jo_2:18; Jud_1:18", "note": "", "refs": [{"l": "1Ti 4:1", "n": "", "vs": [[1, "إلا أن الروح يعلن صراحة أن قوما في الأزمنة الأخيرة سوف يرتدون عن الإيمان، منساقين وراء أرواح مضللة وتعاليم شيطانية،"]]}, {"l": "1Ti 4:2", "n": "", "vs": [[2, "في موجة رياء ينشرها معلمون دجالون لهم ضمائر كويت بالنار."]]}, {"l": "2Ti 3:1", "n": "", "vs": [[1, "واعلم هذا الأمر: أن أزمنة صعبة ستعم في الأيام الأخيرة؛"]]}, {"l": "1Jo 2:18", "n": "", "vs": [[18, "أيها الأولاد، اعلموا أننا نعيش الآن في الزمن الأخير. وكما سمعتم أنه سوف يأتي أخيرا «مسيح دجال»، فقد ظهر حتى الآن كثيرون من الدجالين المقاومين للمسيح. من هنا نتأكد أننا نعيش في الزمن الأخير."]]}, {"l": "Jud 1:18", "n": "", "vs": [[18, "فقد سبق أن نبهوكم إلى أنه، في نهاية الزمان، سيطلع مستهزئون يعيشون منغمسين في شهواتهم الفاسقة."]]}], "kwAr": "سيأتي في آخر الأيام", "noteAr": ""}, {"kw": "scoffers", "raw": "Pro_1:22, Pro_3:34, Pro_14:6; Isa_5:19, Isa_28:14, Isa_29:20; Hos_7:5", "note": "", "refs": [{"l": "Pro 1:22", "n": "", "vs": [[22, "«إلى متى أيها الجهال تظلون مولعين بالسذاجة، والساخرون تسرون بالسخرية، والحمقى بكراهية المعرفة؟"]]}, {"l": "Pro 3:34", "n": "", "vs": [[34, "يسخر من المستكبرين الساخرين، ويغدق رضاه على المتواضعين"]]}, {"l": "Pro 14:6", "n": "", "vs": [[6, "عبثا يلتمس الأحمق حكمة، أما العلم فمتيسر للفطن."]]}, {"l": "Isa 5:19", "n": "", "vs": [[19, "ويقولون: ليسرع وليعجل بعقابه حتى نراه. لينفذ مقدس إسرائيل مأربه فينا فندرك حقيقة ما يفعله بنا."]]}, {"l": "Isa 28:14", "n": "", "vs": [[14, "لذلك اسمعوا كلمة الرب أيها المستهزئون المتحكمون في شعب أورشليم:"]]}, {"l": "Isa 29:20", "n": "", "vs": [[20, "لأن العاتي قد انقرض، وباد المستهزيء، واستؤصل جميع الساهرين لارتكاب الإثم،"]]}, {"l": "Hos 7:5", "n": "", "vs": [[5, "في يوم اح ذي بدأ فيه الطوفان دخل نوح وزوجته وأبناؤه سام وحام ويافث وزوجاتهم الثلاث إلى الفلك."], [14, "ودخل معهم أيضا من الوحوش والبهائم والزواحف والطيور وذوات الأجنحة كل حسب أصنافها؛"], [15, "من جميع المخلوقات الحية أقبلت إلى الفلك، ودخلت مع نوح زوجين زوجين"], [16, "ذكرا وأنثى دخلت، من كل ذي جسد، كما أمره الله. ثم أغلق الرب عليه باب الفلك."], [17, "ودام الطوفان أربعين يوما على الأرض، وطغت المياه ورفعت الفلك فوق الأرض،"], [18, "وتكاثرت المياه على الأرض وطغت جدا، فكان الفلك يطفو فوق المياه."], [19, "وتعاظمت المياه جدا فوق الأرض حتى أغرقت جميع الجبال العالية التي تحت السماء كلها."], [20, "وبلغ ارتفاعها خمس عشرة ذراعا (نحو سبعة أمتار) عن أعلى الجبال،"], [21, "فمات كل كائن حي يتحرك على الأرض من طيور وبهائم ووحوش وزواحف وكل بشر"], [22, "مات كل ما يحيا ويتنفس على اليابسة."], [23, "وباد من على سطح الأرض كل كائن حي سواء من الناس أم البهائم أم الزواحف أم الطيور، كلها أبيدت من الأرض، ولم يبق سوى نوح ومن معه في الفلك."]]}, {"l": "Gen 9:15", "n": "", "vs": [[15, "أني أذكر ميثاقي الذي بيني وبينكم وبين كل المخلوقات الحية من ذوات الجسد، فلا تتحول المياه إلى طوفان يبيد كل حياة."]]}, {"l": "Job 12:15", "n": "", "vs": [[15, "إن حبس المياه تجف الأرض، وإن أطلقها تغرقها."]]}, {"l": "Mat 24:38", "n": "", "vs": [[38, "فقد كان الناس في الأيام السابقة للطوفان يأكلون ويشربون ويتزوجون ويزوجون، حتى فاجأهم اليوم الذي دخل فيه نوح السفينة،"]]}, {"l": "Mat 24:39", "n": "", "vs": [[39, "ونزل الطوفان وهم لاهون فأخذ الجميع. هكذا ستكون الحال عند رجوع ابن الإنسان:"]]}, {"l": "Luk 17:27", "n": "", "vs": [[27, "كان الناس يأكلون ويشربون ويتزوجون ويزوجون، إلى اليوم الذي فيه دخل نوح السفينة وجاء الطوفان فأهلك الجميع."]]}], "kwAr": "", "noteAr": ""}], "arS": [["وبكلمة منه أيضا، ", []], ["دمر", ["G622"]], [" ", []], ["العالم", ["G2889"]], [" الذي كان موجودا في ذلك ", []], ["الزمان", ["G5119"]], ["، إذ ", []], ["فاض", ["G2626"]], [" ", []], ["الماء", ["G5204"]], [" عليه.", []]]}, {"c": 3, "v": 7, "text": "أما السماوات والأرض الحالية، فستبقى مخزونة ومحفوظة للنار بتلك الكلمة عينها إلى يوم الدينونة وهلاك الفاجرين!", "groups": [{"kw": "the heavens", "raw": "2Pe_3:10; Psa_50:3, Psa_102:26; Isa_51:6; Zep_3:8; Mat_24:35, Mat_25:41; 2Th_1:8; Rev_20:11, Rev_21:1", "note": "", "refs": [{"l": "2Pe 3:10", "n": "", "vs": [[10, "إلا أن «يوم الرب» سيأتي كما يأتي اللص في الليل. في ذلك اليوم، تزول السماوات محدثة دويا هائلا وتنحل العناصر محترقة بنار شديدة، وتحترق الأرض وما فيها من منجزات."]]}, {"l": "Psa 50:3", "n": "", "vs": [[3, "يأتي إلهنا ولا يصمت، تحيط به النار الآكلة والعواصف الثائرة."]]}, {"l": "Psa 102:26", "n": "", "vs": [[26, "هي زائلة أما أنت فباق. تبلى كلها كالثوب. وتستبدلها كما يستبدل الرداء القديم بالجديد."]]}, {"l": "Isa 51:6", "n": "", "vs": [[6, "ارفعوا عيونكم إلى السماوات وتفرسوا في الأرض من تحت، فإن السماوات كدخان تضمحل، والأرض كثوب تبلى، ويبيد سكانها كالذباب. أما خلاصي فيبقى إلى الأبد، وبري يثبت مدى الدهر."]]}, {"l": "Zep 3:8", "n": "", "vs": [[8, "لذلك يقول الرب: انتظروني لأني عزمت في اليوم الذي أقوم فيه كشاهد أن أجمع الأمم وأحشد الممالك لأسكب عليهم سخطي واحتدام غضبي، لأن الأرض بكاملها ستؤكل بنار غيرة غيظي."]]}, {"l": "Mat 24:35", "n": "", "vs": [[35, "إن السماء والأرض تزولان؛ ولكن كلامي لا يزول أبدا."]]}, {"l": "Mat 25:41", "n": "", "vs": [[41, "ثم يقول للذين عن يساره: ابتعدوا عني ياملاعين إلى النار الأبدية المعدة لإبليس وأعوانه!"]]}, {"l": "2Th 1:8", "n": "", "vs": [[8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."]]}, {"l": "Rev 20:11", "n": "", "vs": [[11, "ثم رأيت عرشا عظيما أبيض هربت السماء والأرض من أمام الجالس عليه، فلم يبق لهما مكان."]]}, {"l": "Rev 21:1", "n": "", "vs": [[1, "ثم رأيت سماء جديدة وأرضا جديدة لا بحر فيها، لأن السماء والأرض القديمتين قد زالتا."]]}], "kwAr": "السماوات والأرض الحالية", "noteAr": ""}, {"kw": "against", "raw": "2Pe_2:9; Mat_10:15, Mat_11:22, Mat_11:24, Mat_12:36; Mar_6:11; 1Jo_4:17", "note": "", "refs": [{"l": "2Pe 2:9", "n": "", "vs": [[9, "وهكذا نرى أن الرب يعرف أن ينقذ الأتقياء من المحنة، ويحفظ الأشرار محبوسين ليحكم عليهم بالعقاب في يوم الدينونة."]]}, {"l": "Mat 10:15", "n": "", "vs": [[15, "الحق أ  الكرمة أو حبات التين المتغضنة."]]}], "kwAr": "هذه الأشياء جميعا", "noteAr": ""}, {"kw": "what", "raw": "Mat_8:27; 1Th_1:5; Jam_1:24", "note": "", "refs": [{"l": "Mat 8:27", "n": "", "vs": [[27, "فتعجب الناس وقالوا: «ترى، من هذا حتى إن الريح والبحر يطيعانه؟ »"]]}, {"l": "1Th 1:5", "n": "", "vs": [[5, "لأن تبشيرنا لكم بالإنجيل لم يكن مجرد كلام، بل كان مصحوبا أيضا بالقوة وبالروح القدس وبتمام اليقين. كما أنكم تعلمون تماما ماذا كنا بينكم لأجل مصلحتكم،"]]}, {"l": "Jam 1:24", "n": "", "vs": [[24, "وبعد أن يرى نفسه، يذهب فينسى صورته حالا."]]}], "kwAr": "فكيف يجب أن تكونوا", "noteAr": ""}, {"kw": "in all", "raw": "Psa_37:14, Psa_50:23; 2Co_1:12; Phi_1:27, Phi_3:20; 1Ti_4:12; Heb_13:5; Jam_3:13; 1Pe_1:15, 1Pe_2:12", "note": "", "refs": [{"l": "Psa 37:14", "n": "", "vs": [[14, "قد سل الأشرار سيوفهم ووتروا أقواسهم ليصرعوا المسكين والفقير، ليقتلوا السالكين طريقا مستقيمة."]]}, {"l": "Psa 50:23", "n": "", "vs": [[23, "أما من يقدم لي ذبيحة حمد فهو يمجدني، ومن يقوم طريقه أريه خلاص الله»."]]}, {"l": "2Co 1:12", "n": "", "vs": [[12, "فإن فخرنا هو هذا: شهادة ضميرنا بأننا، في قداسة الله وإخلاصه، قد سلكنا في العالم، وبخاصة تجاهكم؛ ولم يكن ذلك بحكمة بشرية بل بنعمة الله."]]}, {"l": "Phi 1:27", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"]]}, {"l": "Phi 3:20", "n": "", "vs": [[20, "أما نحن، فإن وطننا في السماوات التي منها ننتظر عودة مخلصنا الرب يسوع المسيح،"]]}, {"l": "1Ti 4:12", "n": "", "vs": [[12, "لا يستخف أحد بحداثة سنك. وإنما كن قدوة للمؤمنين، في الكلام والسلوك والمحبة والإيمان والطهارة."]]}, {"l": "Heb 13:5", "n": "", "vs": [[5, "اجعلوا سيرتكم مترفعة عن حب المال، واقنعوا بما عندكم، لأن الله يقول: «لا أتركك، ولا أتخلى عنك أبدا!»"]]}, {"l": "Jam 3:13", "n": "", "vs": [[13, "أبينكم بعض الحكماء والفهماء؟ إذن، على هؤلاء أن يسلكوا سلوكا حسنا، مظهرين بأعمالهم تلك الوداعة التي تتصف بها الحكمة (الحقيقية)."]]}, {"l": "1Pe 1:15", "n": "", "vs": [[15, "وإنما اسلكوا سلوكا مقدسا في كل أمر، مقتدين بالقدوس الذي دعاكم،"]]}, {"l": "1Pe 2:12", "n": "", "vs": [[12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالحة يمجدون الله في يوم الافتقاد."]]}], "kwAr": "سلوك مقدس", "noteAr": ""}, {"kw": "godliness", "raw": "2Pe_1:3, 2Pe_1:6; 1Ti_3:16, 1Ti_6:3, 1Ti_6:6, 1Ti_6:11", "note": "", "refs": [{"l": "2Pe 1:3", "n": "", "vs": [[3, "إن الله، بقدرته الإلهية، قد زودنا بكل ما نحتاج إليه في الحيا ة الروحية المتصفة بالتقوى. ذلك أنه عرفنا بالمسيح الذي دعانا إلى مجده وفضيلته،"]]}, {"l": "2Pe 1:6", "n": "", "vs": [[6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"]]}, {"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}, {"l": "1Ti 6:3", "n": "", "vs": [[3, "أما إذا كان أحد يعلم ما يخالفها ولا يذعن للكلام الصحيح، كلام ربنا يسوع المسيح، وللتعليم الموافق للتقوى،"]]}, {"l": "1Ti 6:6", "n": "", "vs": [[6, "أما التقوى مع القناعة فهي تجارة عظيمة."]]}, {"l": "1Ti 6:11", "n": "", "vs": [[11, "وأما أنت، ياإنسان الله، فاهرب من هذه الأمور، واسع في إثر البر والتقوى والإيمان والمحبة والصبر والوداعة."]]}], "kwAr": "التقوى", "noteAr": ""}], "arS": [["ومادامت هذه ", []], ["الأشياء", ["G5130"]], [" ", []], ["جميعا", ["G3956"]], [" ", []], ["ستنحل", ["G3089"]], ["، ", []], ["فكيف", ["G4217"]], [" ", []], ["يجب", ["G1163"]], [" أن تكونوا أنتم أصحاب ", []], ["سلوك", ["G391"]], [" ", []], ["مقدس", ["G40"]], [" يتصف ", []], ["بالتقوى", ["G2150"]], ["،", []]]}, {"c": 3, "v": 12, "text": "منتظرين «يوم الله» الأبدي وطالبين حلوله بسرعة. ففي ذلك اليوم، تنحل السماوات ملتهبة، وتذوب العناصر محترقة.", "groups": [{"kw": "Looking", "raw": "1Co_1:7; Tit_2:13; Jud_1:21", "note": "", "refs": [{"l": "1Co 1:7", "n": "", "vs": [[7, "حتى إنكم لا تحتاجون بعد إلى أية موهبة فيما تتوقعون ظهور ربنا يسوع المسيح علنا."]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "Jud 1:21", "n": "", "vs": [[21, "واحفظوا أنفسكم في محبة الله، منتظرين رحمة ربنا يسوع المسيح إذ يعود ويأخذكم لتحيوا معه إلى الأبد."]]}], "kwAr": "منتظرين", "noteAr": ""}, {"kw": "hasting unto the coming", "raw": "or, hasting the coming, 2Pe_3:10; 1Co_1:8; Phi_1:6", "note": "or, hasting the coming, 2Pe_3:10; 1Co_1:8; Phi_1:6", "refs": [{"l": "2Pe 3:10", "n": "", "vs": [[10, "إلا أن «يوم الرب» سيأتي كما يأتي اللص في الليل. في ذلك اليوم، تزول السماوات محدثة دويا هائلا وتنحل العناصر محترقة بنار شديدة، وتحترق الأرض وما فيها من منجزات."]]}, {"l": "1Co 1:8", "n": "", "vs": [[8, "وهو نفسه سيحفظكم ثابتين إلى النهاية حتى تكونوا بلا عيب في يوم ربنا يسوع المسيح."]]}, {"l": "Phi 1:6", "n": "", "vs": [[6, "ولي ثقة في هذا الأمر بالذات: أن الذي بدأ فيكم عملا صالحا سوف يتممه إلى يوم المسيح يسوع."]]}], "kwAr": "طالبين حلوله بسرعة", "noteAr": "أو: مسرعين مجيء (اليوم)."}, {"kw": "the heavens", "raw": "2Pe_3:10; Psa_50:3; Isa_34:4; Rev_6:13, Rev_6:14", "note": "", "refs": [{"l": "2Pe 3:10", "n": "", "vs": [[10, "إلا أن «يوم الرب» سيأتي كما يأتي اللص في الليل. في ذلك اليوم، تزول السماوات محدثة دويا هائلا وتنحل العناصر محترقة بنار شديدة، وتحترق الأرض وما فيها من منجزات."]]}, {"l": "Psa 50:3", "n": "", "vs": [[3, "يأتي إلهنا ولا يصمت، تحيط به النار الآكلة والعواصف الثائرة."]]}, {"l": "Isa 34:4", "n": "", "vs": [[4, "وتنحل كل كواكب السماء، وتطوى السماوات كدرج، وتتساقط كل نجومها كتساقط أوراق الكرمة أو حبات التين المتغضنة."]]}, {"l": "Rev 6:13", "n": "", "vs": [[13, "وسقطت نجوم السماء على الأرض كما تطرح شجرة التين ثمارها الفجة، إذا هزتها ريح عاصفة."]]}, {"l": "Rev 6:14", "n": "", "vs": [[14, "وطويت السماء كما تطوى لفافة من ورق، فتزحزحت الجبال والجزر كلها من مواضعها."]]}], "kwAr": "تنحل السماوات ملتهبة", "noteAr": ""}, {"kw": "melt", "raw": "2Pe_3:10; Isa. 2:1-22, Isa_64:1-12; Mic_1:4", "note": "", "refs": [{"l": "2Pe 3:10", "n": "", "vs": [[10, "إلا أن «يوم الرب» سيأتي كما يأتي اللص في الليل. في ذلك اليوم، تزول السماوات محدثة دويا هائلا وتنحل العناصر محترقة بنار شديدة، وتحترق الأرض وما فيها من منجزات."]]}, {"l": "Isa 2:1-22", "n": "", "vs": [[1, "الإعلان الذي رآه إشعياء بن آموص بشأن يهوذا وأورشليم:"], [2, "ويحدث في آخر الأيام، أن جبل هيكل الرب يصبح أسمى من كل الجبال، ويعلو فوق كل التلال، فتتوافد إليه جميع الأمم."], [3, "وتقبل شعوب كثيرة وتقول: تعالوا لنذهب إلى جبل الرب، إلى بيت إله يعقوب، فيعلمنا طرقه، ونسلك في سبله، لأن من صهيون تخرج الشريعة، ومن أورشليم تعلن كلمة الرب."], [4, "فيقضي بين الأمم ويحكم بين الشعوب الكثيرة، فيطبعون سيوفهم محاريث ورماحهم مناجل، ولا ترفع أمة على أمة سيفا، ولا يتدربون على الحرب فيما بعد."], [5, "يابيت يعقوب، هيا لنسلك في نور الرب."], [6, "فأنت يارب قد نبذت شعبك، بيت يعقوب، فكثر بينهم العرافون من أبناء المشرق والمتنبئون، كالفلسطينيين، وتعاهدوا مع الغرباء."], [7, "امتلأت أرضهم فضة وذهبا، وكنوزهم لا نهاية لها، واكتظت بلادهم بالخيل، ومركباتهم لا تحصى."], [8, "غصت أرضهم بالأصنام، وعبدوا صنعة أيديهم، وسجدوا لعمل أصابعهم."], [9, "لذلك ينحط الإنسان، ويذل البشر، ولا تصفح عنهم."], [10, "اختف في مغاور الجبال، واختبيء في حفر الأرض خشية من هيبة الرب ومن جلال مجده."], [11, "فعيون البشر المتشامخة تخفض، وكبرياؤهم تذل، ويتعظم الرب وحده في ذلك اليوم."], [12, "فإن للرب القدير يوما فيه يوضع كل متعظم ومتكبر ومتغطرس."], [13, "ويسمو على أرز لبنان المتعالي الشامخ، وعلى كل بلوط باشان،"], [14, "وعلى كل جبل أشم، وعلى التلال المرتفعة،"], [15, "وعلى كل برج عال، وسور حصين،"], [16, "وعلى كل سفن ترشيش، وعلى كل صنعة جميلة،"], [17, "فيعتري الهوان غطرسة كل إنسان، ويذل تشامخ البشر، ويتعظم الرب وحده في ذلك اليوم،"], [18, "وتباد الأصنام كلها،"], [19, "ويلجأ الناس إلى مغاور الجبال، وإلى حفائر الأرض، متوارين من هيبة الرب ومن مجد جلاله، عندما يهب ليزلزل الأرض."], [20, "في ذلك اليوم يطرح الناس للجرذان والخفافيش أوثانهم الفضية وأصنامهم الذهبية التي صنعوها ليعبدوها،"], [21, "ويدخلون في كهوف الصخر، وفي شقوق الجروف الجبلية هربا من هيبة الرب ومن مجد جلاله عندما يهب ليزلزل الأرض."], [22, "كفوا عن الاتكال على الإنسان المعرض للموت؛ فأي قيمة له؟"]]}, {"l": "Isa 64:1-12", "n": "", "vs": [[1, "ليتك تشق السماوات وتنزل فتتزلزل الجبال من حضرتك!"], [2, "فتكون كالنار التي تضرم الهشيم، وتجعل المياه تغلي لكي تعرف أعداءك اسمك، فترتعب الأمم من حضرتك."], [3, "عندما أجريت أعمالا مخيفة لم نتوقعها، نزلت فتزلزلت الجبال من حضرتك."], [4, "منذ الأزل لم يسمع أحد ولم تصغ أذن ولم تر عين إلها سواك يجري ما تصنعه للذين ينتظرونك."], [5, "أنت تلاقي من يفرح بعمل البر ومن يسلك دائما في طرقك. لكم سخطت علينا لأننا واظبنا على ارتكاب الآثام زمانا طويلا، فكيف لمثلنا أن يخلص؟"], [6, "كلنا أصبحنا كنجس، وأضحت جميع أعمال برنا كثوب قذر، فذبلنا كأوراق الشجر وعبثت بنا آثامنا كالريح."], [7, "ليس هناك من ينادي باسمك، ويحرص على التمسك بك لأنك حجبت وجهك عنا ولاشيتنا بسبب معاصينا."], [8, "ومع ذلك فأنت أيها الرب أبونا، نحن الطين وأنت الخزاف، وكلنا عمل يديك."], [9, "لا توغل في غضبك علينا يارب، ولا تذكر الإثم إلى الأبد. إنما انظر إلينا، فكلنا شعبك."], [10, "قد استحالت مدينتك المقدسة إلى قفر، وأصبحت صهيون برية وأورشليم موحشة،"], [11, "واحترق بالنار هيكلنا المقدس البهي، الذي شدا آباؤنا فيه بتسبيحك، وصار كل ما هو أثير لدينا خرابا."], [12, "هل بعد هذا كله تسكت يارب، وتعتصم بالصمت وتنزل بنا أشد البلاء؟"]]}, {"l": "Mic 1:4", "n": "", "vs": [[4, "فتذوب الجبال من تحت قدميه، وتتصدع الوديان كالشمع أمام النار، كالمياه المنصبة في المنخفضات."]]}], "kwAr": "تذوب العناصر", "noteAr": ""}], "arS": [["منتظرين", ["G4328"]], [" «", []], ["يوم", ["G2250"]], [" ", []], ["الله", ["G2316"]], ["» الأبدي ", []], ["وطالبين حلوله بسرعة", ["G4692"]], [". ففي ذلك اليوم، ", []], ["تنحل", ["G3089"]], [" ", []], ["السماوات", ["G3772"]], [" ", []], ["ملتهبة", ["G4448"]], ["، ", []], ["وتذوب", ["G5080"]], [" ", []], ["العناصر", ["G4747"]], [" ", []], ["محترقة", ["G2741"]], [".", []]]}, {"c": 3, "v": 13, "text": "إلا أننا، وفقا لوعد الرب، ننتظر سماوات جديدة وأرضا جديدة، حيث يسكن البر.", "groups": [{"kw": "according", "raw": "Isa_65:17, Isa_66:22; Rev_21:1, Rev_21:27", "note": "", "refs": [{"l": "Isa 65:17", "n": "", "vs": [[17, "لأنني ها أنا أخلق سماوات جديدة وأرضا جديدة، تمحو ذكر الأولى فلا تعود تخطر على بال"]]}, {"l": "Isa 66:22",  قد دعاكم واختاركم حقا. فإنكم، إن فعلتم هذا، لن تسقطوا أبدا!"]]}, {"l": "1Jo 3:3", "n": "", "vs": [[3, "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر."]]}], "kwAr": "اجتهدوا", "noteAr": ""}, {"kw": "in peace", "raw": "Mat_24:26; Luk_2:29, Luk_12:43; 1Co_1:8, 1Co_15:58; Phi_1:10; 1Th_3:13, 1Th_5:23", "note": "", "refs": [{"l": "Mat 24:26", "n": "", "vs": [[26, "فإذا قال لكم الناس: ها هو المسيح في البرية! فلا تخرجوا إليها؛ أو: ها هو في الغرف الداخلية! فلا تصدقوا."]]}, {"l": "Luk 2:29", "n": "", "vs": [[29, "«أيها السيد، الآن تطلق عبدك بسلام حسب وعدك!"]]}, {"l": "Luk 12:43", "n": "", "vs": [[43, "طوبى لذلك العبد الذي يجده سيده ، لدى رجوعه ، يقوم بهذا العمل."]]}, {"l": "1Co 1:8", "n": "", "vs": [[8, "وهو نفسه سيحفظكم ثابتين إلى النهاية حتى تكونوا بلا عيب في يوم ربنا يسوع المسيح."]]}, {"l": "1Co 15:58", "n": "", "vs": [[58, "إذن، ياإخوتي الأحباء، كونوا راسخين غير متزحزحين، كثيري الاجتهاد في عمل الرب دائما، عالمين أن جهدكم في الرب ليس عبثا!"]]}, {"l": "Phi 1:10", "n": "", "vs": [[10, "لكي تستحسنوا الأمور الممتازة، حتى تكونوا طاهرين وخالين من العثرات إلى يوم المسيح،"]]}, {"l": "1Th 3:13", "n": "", "vs": [[13, "حتى تتثبت قلوبكم بغير لوم في القداسة أمام إلهنا وأبينا عندما يظهر ربنا يسوع عائدا مع جميع قديسيه."]]}, {"l": "1Th 5:23", "n": "", "vs": [[23, "وإله السلام نفسه يقدسكم إلى التمام ويحفظكم سالمين، روحا ونفسا وجسدا، لتكونوا بلا لوم عند عودة ربنا يسوع المسيح."]]}], "kwAr": "في سلام", "noteAr": ""}], "arS": [["فبينما ", []], ["تنتظرون", ["G4328"]], [" إتمام هذا الوعد، أيها ", []], ["الأحباء", ["G27"]], ["، ", []], ["اجتهدوا", ["G4704"]], [" أن ", []], ["يجدكم", ["G2147"]], [" الرب في ", []], ["سلام", ["G1515"]], ["، خالين من ", []], ["الدنس", ["G784"]], [" ", []], ["والعيب", ["G298"]], [".", []]]}, {"c": 3, "v": 15, "text": "وتأكدوا أن تأني ربنا في رجوعه، هو فرصة للخلاص.", "groups": [{"kw": "account", "raw": "2Pe_3:9; Rom_2:4; 1Ti_1:16; 1Pe_3:20", "note": "", "refs": [{"l": "2Pe 3:9", "n": "", "vs": [[9, "فالرب، إذن، لا يبطيء في إتمام وعده، كما يظن بعض الناس، ولكنه يتأنى عليكم، فهو لا يريد لأحد من الناس أن يهلك، بل يريد لجميع الناس أن يرجعوا إليه تائبين."]]}, {"l": "Rom 2:4", "n": "", "vs": [[4, "أم أنك تحتقر غنى لطفه وصبره وطول أناته وأنت لا تعرف أن لطف الله يدفعك إلى التوبة؟"]]}, {"l": "1Ti 1:16", "n": "", "vs": [[16, "ولكن لهذا السبب عوملت بالرحمة، ليجعل يسوع المسيح مني، أنا أولا، مثالا يظهر صبره الطويل، لجميع الذين سيؤمنون به لنوال الحياة الأبدية."]]}, {"l": "1Pe 3:20", "n": "", "vs": [[20, "وذلك بعدما رفضوا البشارة في أيام نوح، عندما كان الله يتأنى صابرا طوال المدة التي كان نوح يبني فيها السفينة، التي نجا بها عدد قليل من الناس عبر الماء، ثمانية أشخاص فقط!"]]}], "kwAr": "تأكدوا", "noteAr": ""}, {"kw": "our beloved", "raw": "Act_15:25", "note": "", "refs": [{"l": "Act 15:25", "n": "", "vs": [[25, "،"]]}], "kwAr": "أخونا الحبيب بولس", "noteAr": ""}, {"kw": "according", "raw": "Exo_31:3, Exo_31:6, Exo_35:31, Exo_35:35; 1Ki_3:12, 1Ki_3:28, 1Ki_4:29; Ezr_7:25; Pro_2:6, Pro_2:7; Ecc_2:26; Dan_2:20,Dan_2:21; Luk_21:15; Act_7:10; 1Co_2:13, 1Co_12:8; Jam_1:5, Jam_3:17", "note": "", "refs": [{"l": "Exo 31:3", "n": "", "vs": [[3, "وملأته من روح الله ووهبته حكمة ومهارة ومقدرة ومعرفة في كل أنواع الحرف،"]]}, {"l": "Exo 31:6", "n": "", "vs": [[6, "كما اخترت أهوليآب بن أخيساماك من سبط دان، ليكون مساعدا له. وكذلك وهبت جميع الصناع مهارة خاصة ليقوموا بكل ما أمرتك به."]]}, {"l": "Exo 35:31", "n": "", "vs": [[31, "وملأه من روح الله ووهبه الحكمة والمهارة والمعرفة في كل أنواع الحرف،"]]}, {"l": "Exo 35:35", "n": "", "vs": [[35, "وجعلهما حاذقين متفوقين في صناعة نقش الجواهر والنجارة والحياكة، وتطريز المنسوجات الزرقاء والبنفسجية والحمراء والمنسوجات الكتانية، وسائر حرف النسيج، وفي كل حرفة صانع ومبتكر تصميم»."]]}, {"l": "1Ki 3:12", "n": "", "vs": [[12, "فإنني سألبي طلبك، فأهبك قلبا حكيما مميزا، فلا يضاهيك أحد من قبل ولا من بعد."]]}, {"l": "1Ki 3:28", "n": "", "vs": [[28, "ولما سرى نبأ هذا الحكم الذي صدر عن الملك بين شعب إسرائيل، امتلأوا توقيرا له، لأنهم رأوا فيه حكمة الله لإجراء العدل."]]}, {"l": "1Ki 4:29", "n": "", "vs": [[29, "ووهب الله سليمان حكمة وفهما فائقين، ورحابة صدر غير متناهية."]]}, {"l": "Ezr 7:25", "n": "", "vs": [[25, "أما أنت ياعزرا فبمقتضى ما تتمتع به من حكمة إلهك، عين حكاما وقضاة من العارفين بشرائع إلهك، يقضون بين الشعب المقيم في عبر نهر الفرات، وليعلموا الجاهلين بها."]]}, {"l": "Pro 2:6", "n": "", "vs": [[6, "لأن الرب يهب الحكمة، ومن فمه تتدفق المعرفة والفهم."]]}, {"l": "Pro 2:7", "n": "", "vs": [[7, "يذخر للمستقيمين فطنة، وهو ترس للسالكين بالكمال."]]}, {"l": "Ecc 2:26", "n": "", "vs": [[26, "لأن المرء الذي يحظى برضى الله ينعم الله عليه بالحكمة والمعرفة والفرح. أما الخاطيء فيفرض عليه عناء الجمع والادخار، ليكون ذلك من نصيب من يرضي الله . وهذا أيضا باطل كملاحقة الريح."]]}, {"l": "Dan 2:20", "n": "", "vs": [[20, "قائلا: «ليكن اسم الله مباركا من الأزل وإلى الأبد لأن له الحكمة والقدرة."]]}, {"l": "Dan 2:21", "n": "", "vs": [[21, "هو يغير الأوقات والفصول. يعزل ملوكا وينصب ملوكا. يهب الحكماء حكمة وذوي الفطنة معرفة."]]}, {"l": "Luk 21:15", "n": "", "vs": [[15, "لأني سوف أعطيكم كلاما وحكمة لا يقدر جميع مقاوميكم أن يردوها أو يناقضوها."]]}, {"l": "Act 7:10", "n": "", "vs": [[10, "وأنقذه من جميع المحن التي مر بها، ووهبه نعمة وحكمة عند فرعون ملك مصر، فولاه على مصر، وعلى شؤون بيته."]]}, {"l": "1Co 2:13", "n": "", "vs": [[13, "ونحن نتكلم بهذه الأمور لا في كلام تعلمه الحكمة البشرية، بل في كلام يعلمه الروح القدس، معبرين عن الحقائق الروحية بوسائل روحية."]]}, {"l": "1Co 12:8", "n": "", "vs": [[8, "فواحد يوهب، عن طريق الروح، كلام الحكمة، وآخر كلام المعرفة وفقا للروح نفسه،"]]}, {"l": "Jam 1:5", "n": "", "vs": [[5, "وإن كان أحد منكم بحاجة إلى الحكمة، فليطلب من الله الذي يعطي الجميع بسخاء ولا يعير. فسيعطى له."]]}, {"l": "Jam 3:17", "n": "", "vs": [[17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}], "kwAr": "بحسب الحكمة المعطاة له", "noteAr": ""}], "arS": [["وتأكدوا", ["G2233"]], [" أن ", []], ["تأني", ["G3115"]], [" ", []], ["ربنا", ["G2962", "G2257"]], [" في رجوعه، هو فرصة ", []], ["للخلاص", ["G4991"]], [".", []]]}, {"c": 3, "v": 16, "text": "وما كتبه في رسالته إليكم، يوافق ما كتبه في باقي رسائله. وفي تلك الرسائل كلها أمور صعبة الفهم، يحرفها الجهال وغير الراسخين في الحق، كما يحرفون غيرها أيضا من الكتابات الموحى بها، فيجلبون الهلاك على أنفسهم.", "groups": [{"kw": "in all", "raw": "1Pe_1:1", "note": "", "refs": [{"l": "1Pe 1:1", "n": "", "vs": [[1, "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"]]}], "kwAr": "باقي رسائله", "noteAr": ""}, {"kw": "speaking", "raw": "Rom. 8:1-39; 1Cor. 15:1-58; 1Thes. 4:1-5:28; 2Kings 1:1-18", "note": "", "refs": [{"l": "Rom 8:1-39", "n": "", "vs": [[1, "فالآن إذا ليس على الذين في المسيح يسوع أية دينونة بعد."], [2, "لأن ناموس روح الحياة في المسيح يسوع قد حررني من ناموس الخطيئة ومن الموت."], [3, "فإن ما عجزت الشريعة عنه، لكون الجسد قد جعلها قاصرة عن تحقيقه، أتمه الله إذ أرسل ابنه، متخذا ما يشبه جسد الخطيئة ومكفرا عن الخطيئة فدان الخطيئة في الجسد"], [4, "حتى يتم فينا البر الذي تسعى إليه الشريعة، فينا نحن السالكين لا بحسب الجسد بل بحسب الروح."], [5, "فإن الذين هم بحسب الجسد يهتمون بأمور الجسد، والذين هم بحسب الروح يهتمون بأمور الروح."], [6, "فاهتمام الجسد هو موت؛ وأما اهتمام الروح فهو حياة وسلام."], [7, "لأن اهتمام الجسد هو عداوة لله، إذ إنه لا يخضع لناموس الله، بل لا يستطيع ذلك."], [8, "فالذين هم تحت سلطة الجسد لا يستطيعون أن يرضوا الله ."], [9, "وأما أنتم، فلستم تحت سلطة الجسد بل تحت سلطة الروح، إذا كان روح الله ساكنا في داخلكم حقا. ولكن، إن كان أحد ليس له روح المسيح، فهو ليس للمسيح."], [10, "وإذا كان المسيح فيكم، فمع أن الجسد مائت بسبب الخطيئة، فإن الروح حياة لكم بسبب البر."], [11, "وإذا كان روح الذي أقام يسوع من بين الأموات يسكن فيكم، فإن الذي أقام المسيح من بين الأموات سوف يحيي أيضا أجسادكم الفانية بسبب روحه الذي يسكن فيكم."], [12, "فليس علينا إذن، أيها الإخوة، أي التزام نحو الجسد لنعيش بحسب الجسد."], [13, "لأنه إن عشتم بحسب الجسد، فإنكم ستموتون، ولكن إن كنتم بالروح تميتون أعمال الجسد، فستحيون."], [14, "فإن جميع الخاضعين لقيادة روح الله، هم أبناء لله."], [15, "إذ إنكم لم تنالوا روح عبودية يعيدكم إلى الخوف، بل نلتم روح بنوة به نصرخ: «أبا! أبانا!»"], [16, "فالروح نفسه يشهد مع أرواحنا بأننا أولاد الله."], [17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."], [18, "فإني مقتنع بأن آلام الزمان الحاضر ليست شيئا إذا قيست بالمجد الآتي الذي سيعلن فينا."], [19, "ذلك أن الخليقة تترقب بلهفة أن يعلن أبناء الله،"], [20, "لأن الخليقة قد أخضعت للباطل، لا باختيارها بل من قبل الذي أخضعها، على رجاء أن"], [21, "تحرر هي أيضا من عبودية الفساد إلى حرية المجد التي لأولاد الله."], [22, "فإننا نعلم أن الخليقة كلها تئن وتتمخض معا حتى الآن."], [23, "وليس هي وحدها، بل أيضا نحن الذين لنا باكورة الروح، نحن أنفسنا نئن في قرارة نفوسنا مترقبين إعلان بنوتنا بافتداء أجسادنا."], [24, "فإننا قد خلصنا، إنما بالرجاء؛ ولكن الرجاء متى رأيناه لا يكون رجاء؛ فما يراه الإنسان لماذا يرجوه بعد؟"], [25, "ولكن، إن كنا نرجو ما لا نراه، فبالصبر نتوقعه."], [26, "وكذلك الروح أيضا يمدنا بالعون لنقهر ضعفنا. فإننا لا نعلم ما يجب أن نصلي لأجله كما يليق، ولكن الروح نفسه يؤدي الشفاعة عنا بأنات تفوق التعبير."], [27, "على أن فاحص القلوب يعلم قصد الروح، لأن الروح يشفع في القديسين بما يوافق الله ."], [28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."], [29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."], [30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."], [31, "فبعد هذا، ماذا نقول؟ مادام الله معنا، فمن يكون علينا؟ ذاك الذي لم يمسك عنا ابنه،"], [32, "بل بذله لأجلنا جميعا، كيف لا يجود علينا معه بكل شيء أيضا؟"], [33, "ومن سيتهم مختاري الله؟ إن الله هو الذي يبرر،"], [34, "فمن ذا يدين؟ إنه المسيح يسوع هو الذي مات، بل بالأحرى قام، وهو أيضا عن يمين الله، وهو يشفع فينا أيضا."], [35, "فمن سيفصلنا عن محبة المسيح لنا؟ هل الشدة أم الضيق أم الاضطهاد أم الجوع أم العري أم الخطر أم السيف؟"], [36, "بل كما قد كتب: «إننا من أجلك نعاني الموت طول النهار. قد حسبنا كأننا غنم للذبح!»"], [37, "ولكننا، في جميع هذه الأمور، نحرز ما يفوق الانتصار على يد من أحبنا."], [38, "فإني لعلى يقين بأنه لا الموت ولا الحياة، ولا الملائكة ولا الرياسات، ولا الأمور الحاضرة ولا الآتية، ولا القوات،"], [39, "ولا الأعالي ولا الأعماق، ولا خليقة أخرى، تقدر أن تفصلنا عن محبة الله التي لنا في المسيح يسوع ربنا."]]}, {"l": "1Co 15:1-58", "n": "", "vs": [[1, "على أني أذكركم، أيها الإخوة بالإنجيل الذي بشرتكم به، وقبلتموه ومازلتم قائمين فيه،"], [2, "وبه أيضا أنتم مخلصون، إن كنتم تتمسكون بالكلمة التي بشرتكم بها، إلا إذا كنتم قد آمنتم عبثا."], [3, "فالواقع أني سلمتكم، في أول الأمر، ما كنت قد تسلمته، وهو أن المسيح مات من أجل خطايانا وفقا لما في الكتاب،"], [4, "وأنه دفن، وأنه قام في اليوم الثالث وفقا لما في الكتاب،"], [5, "وأنه ظهر لبطرس، ثم للاثني عشر."], [6, "وبعد ذلك ظهر لأكثر من خمس مئة أخ معا مازال معظمهم حيا، في حين رقد الآخرون."], [7, "ثم ظهر ليعقوب، وبعد ذلك للرسل جميعا."], [8, "وآخر الجميع، ظهر لي أنا أيضا، وكأني طفل ولد في غير أوانه!"], [9, "فإني أنا أصغر الرسل شأنا، ولست أهلا لأن أدعى رسولا لأني اضطهدت كنيسة الله."], [10, "ولكن، بنعمة الله صرت على ما أنا عليه الآن، ونعمته الموهوبة لي لم تكن عبثا، إذ عملت جاهدا أكثر من الرسل الآخرين جميعا. إلا أني لم أكن أنا العامل، بل نعمة الله التي كانت معي."], [11, "وسواء أكنت أنا أم كانوا هم، فهكذا نبشر، وهكذا آمنتم."], [12, "والآن، مادام يبشر بأن المسيح قام من بين الأموات، فكيف يقول بعضكم إنه لا قيامة للأموات؟"], [13, "فإن كانت قيامة الأموات غير موجودة، فمعنى ذلك أن المسيح لم يقم أيضا!"], [14, "ولو لم يكن المسيح قد قام، لكان تبشيرنا عبثا وإيمانكم عبثا،"], [15, "ولكان تبين عندئذ أننا شهود زور على الله، إذ إننا شهدنا على الله أنه أقام المسيح، وهو لم يقمه لو صح أن الأموات لا يقامون."], [16, "إذن، لو كان الأموات لا يقامون، لكان المسيح لم يقم أيضا."], [17, "ولو لم يكن المسيح قد قام، لكان إيمانكم عبثا، ولكنتم بعد في خطاياكم،"], [18, "ولكان الذين رقدوا في المسيح قد هلكوا!"], [19, "ولو كان رجاؤنا في المسيح يقتصر على هذه الحياة، لكنا أشقى الناس جميعا!"], [20, "أما الآن فالمسيح قد قام من بين الأموات بكرا للراقدين."], [21, "فبما أن الموت كان بإنسان، فإن قيامة الأموات أيضا تكون بإنسان."], [22, "فإنه، كما يموت الجميع في آدم، فكذلك سيحيى الجميع في المسيح،"], [23, "على أن لكل واحد رتبته: فأولا المسيح بصفته البكر؛ وبعده خاصته لدى رجوعه،"], [24, "وبعد ذلك الآخرة حين يسلم المسيح الملك لله الآب بعد أن يكون قد أباد كل رئاسة وكل سلطة وكل قوة."], [25, "فإنه لابد أن يملك «إلى أن يضع جميع الأعداء تحت قدميه»."], [26, "وآخر عدو يباد هو الموت. ذلك بأنه قد «أخضع كل شيء تحت قدميه»."], [27, "ولكن، في قوله إن كل شيء قد أخضع، فمن الواضح أنه يستثني الله الذي جعل كل شيء خاضعا للابن."], [28, "وعندما يتم إخضاع كل شيء للابن، فإن الابن نفسه سيخضع للذي أخضع له كل شيء، لكي يكون الله هو كل شيء في كل شيء!"], [29, "والآن، إن صح أن الأموات لا يقومون أبدا، فما معنى ما يفعله الذين يعتمدون بدل الذين يموتون؟ لماذا إذن يعتمدون بدلا منهم؟"], [30, "ولماذا نعرض نحن أنفسنا للخطر كل ساعة؟"], [31, "فبحسب افتخاري بكم في المسيح يسوع ربنا، أشهد أيها الإخوة أني أموت كل يوم!"], [32, "ولو كنت بمنطق البشر قد تعرضت للموت في أفسس بين مخالب الوحوش، فأي نفع يعود علي إن كان الذين يموتون لا يقومون؟ ولم لا «نأكل ونشرب، لأننا غدا نموت؟»"], [33, "لا تنقادوا إلى الضلال: إن المعاشرات الرديئة تفسد الأخلاق الجيدة!"], [34, "عودوا إلى الصواب كما يجب ولا تخطئوا، فإن بعضا منكم يجهلون الله تماما أقول هذا لكي تخجلوا!"], [35, "ولكن أحدا قد يقول: كيف يقام الأموات؟ وبأي جسم يعودون؟»"], [36, "ياغافل! إن ما تزرعه لا يحيا إلا بعد أن يموت."], [37, "وما تزرعه ليس هو الجسم الذي سيطلع بل مجرد حبة من الحنطة مثلا أو غيرها من البزور."], [38, "ثم يعطيها الله الجسم الذي يريد، كما يعطي كل نوع من البزور جسمه الخاص."], [39, "وليس للأجساد كلها شكل واحد بل للناس جسد وللحيوانات جسد آخر وللسمك آخر وللطير آخر."], [40, "ثم إن هناك أجساما سماوية وأجساما أرضية. ولكن الأجسام السماوية لها بهاء، والأرضية لها بهاء مختلف."], [41, "فالشمس لها بهاء، والقمر له بهاء آخر، والنجوم لها بهاء مختلف، لأن كل نجم يختلف عن الآخر ببهائه."], [42, "وهكذا الحال في قيامة الأموات: يزرع الجسد منحلا، ويقام غير منحل،"], [43, "يزرع مهانا، ويقام مجيدا، يزرع ضعيفا، ويقام قويا،"], [44, "يزرع جسما ماديا، ويقام جسما روحيا. فبما أن هناك جسما ماديا، فهناك أيضا جسم روحي."], [45, "فهكذا أيضا قد كتب: «صار الإنسان الأول، آدم، نفسا حية» وأما آدم الأخير فهو روح باعث للحياة."], [46, "على أن الروحي لم يكن أولا، بل جاء المادي أولا ثم الروحي:"], [47, "الإنسان الأول من الأرض وقد صنع من التراب؛ أما الإنسان الثاني فهو من السماء."], [48, "فعلى مثال المصنوع من التراب، سيكون المصنوعون من التراب، وعلى مثال السماوي سيكون السماويون."], [49, "ومثلما حملنا صورة المصنوع من التراب، سنحمل أيضا صورة السماوي."], [50, "ثم إني، أيها الإخوة، أؤكد لكم أن الأجسام ذات اللحم والدم لا يمكنها أن ترث ملكوت الله، كما لا يمكن للمنحل أن يرث غير المنحل."], [51, "وها أنا أكشف لكم سرا: إننا لن نرقد جميعا، ولكننا سنتغير جميعا،"], [52, "في لحظة، بل في طرفة عين عندما ينفخ في البوق الأخير. فإنه سوف ينفخ في البوق، فيقوم الأموات بلا انحلال. وأما نحن، فسنتغير."], [53, "فلابد لهذا الجسم القابل للانحلال أن يلبس عدم انحلال، ولهذا الفاني أن يلبس خلودا."], [54, "وبعد أن يلبس هذا المنحل عدم انحلال، وهذا الفاني خلودا، تتم الكلمة التي قد كتبت: «ابتلع الموت في النصر!»"], [55, "فأين، ياموت، شوكتك؟ وأين، ياموت نصرك؟"], [56, "وشوكة الموت إنما هي الخطيئة، وقوة الخطيئة إنما هي الشريعة."], [57, "ولكن الشكر لله الذي يمنحنا النصر بربنا يسوع المسيح!"], [58, "إذن، ياإخوتي الأحباء، كونوا راسخين غير متزحزحين، كثيري الاجتهاد في عمل الرب دائما، عالمين أن جهدكم في الرب ليس عبثا!"]]}, {"l": "1Th 4:1-5:28", "n": "", "vs": [[1, "وبعد، أيها الإخوة، فمثلما تلقيتم منا كيف يجب أن تسلكوا سلوكا يرضي الله ، وكما أنتم فاعلون، نرجو منكم ونحرضكم في الرب يسوع أن تضاعفوا تقدمكم في ذلك أكثر فأكثر."], [2, "فإنكم تعرفون الوصايا التي لقناكم إياها من قبل الرب يسوع."], [3, "فإن مشيئة الله هي هذه: قداستكم. وذلك بأن تمتنعوا عن الزنى،"], [4, "وأن يعرف كل واحد منكم كيف يحفظ جسده في الطهارة والكرامة"], [5, "غير منساق للشهوة الجامحة كالوثنيين الذين لا يعرفون الله ،"], [6, "وألا يتعدى حقوق أخيه ويسيء إليه في هذا الأمر، لأن الرب هو المنتقم لجميع هذه الإساءات، كما أنذرناكم قبلا وشهدنا لكم بحق."], [7, "فإن الله دعانا لا إلى النجاسة بل (إلى العيش( في القداسة."], [8, "إذن، من استخف بأخيه في هذا الأمر، يستخف لا بإنسان بل بالله، بذاك الذي وهبكم فعلا روحه القدوس."], [9, "أما المحبة الأخوية، فلستم في حاجة لأن أكتب إليكم عنها، لأنكم بأنفسكم قد تعلمتم من الله أن تحبوا بعضكم بعضا،"], [10, "ولأنكم أيضا هكذا تعاملون جميع الإخوة في مقاطعة مقدونية كلها. وإنما نحرضكم، أيها الإخوة، أن تضاعفوا ذلك أكثر فأكثر،"], [11, "وأن تسعوا بجد إلى العيش بهدوء، مهتمين بممارسة شؤونكم الخاصة، ومحصلين معيشتكم بعمل أيديكم، كما أوصيناكم."], [12, "عندئذ تكون سيرتكم حسنة السمعة تجاه الذين من خارج الكنيسة، ولا تكونون في حاجة إلى شيء."], [13, "على أننا نريد، أيها الإخوة، ألا يخفى عليكم أمر الراقدين، حتى لا يصيبكم الحزن كغيركم من الناس الذين لا رجاء لهم."], [14, "فمادمنا نؤمن أن يسوع مات ثم قام، فمعه كذلك سيحضر الله أيضا الراقدين بيسوع."], [15, "فهذا نقوله لكم بكلمة من عند الرب: إننا نحن الباقين أحياء إلى حين عودة الرب، لن نسبق الراقدين."], [16, "لأن الرب نفسه سينزل من السماء حالما يدوي أمر بالتجمع، وينادي رئيس ملائكة، ويبوق في بوق إلهي، عندئذ يقوم الأموات في المسيح أولا."], [17, "ثم إننا، نحن الباقين أحياء، نختطف جميعا في السحب للاجتماع بالرب في الهواء. وهكذا نبقى مع الرب على الدوام."], [18, "لذلك عزوا بعضكم بعضا بهذا الكلام!"], [1, "أما مسألة الأزمنة والأوقات المحددة، فلستم في حاجة لأن يكتب إليكم فيها."], [2, "لأنكم تعلمون يقينا أن يوم الرب سيأتي كما يأتي اللص في الليل."], [3, "فبينما الناس يقولون: حل السلام والأمن! ينزل بهم الهلاك المفاجيء كالمخاض الذي يدهم الحبلى، فلا يستطيعون أبدا أن يفلتوا."], [4, "غير أنكم أنتم، أيها الإخوة، لستم في الظلام حتى يفاجئكم ذلك اليوم كأنه لص."], [5, "فأنتم جميعا أبناء النور وأبناء النهار. إننا لسنا أهل الليل ولا أهل الظلام."], [6, "إذن، لا ننم كما ينام الآخرون، بل لنظل ساهرين وصاحين،"], [7, "فإنه في الليل ينام الذين ينامون، وفي الليل يسكر الذين يسكرون"], [8, "وأما نحن، أهل النهار، فلنظل صاحين، متخذين من الإيمان والمحبة درعا لصدورنا، ومن الرجاء بالخلاص خوذة لرؤوسنا."], [9, "فإن الله عيننا لا لينزل علينا الغضب بل لننال الخلاص بربنا يسوع المسيح،"], [10, "الذي مات عنا لكي نحيا جميعا معه، سواء كنا في سهر الحياة أم في رقاد الموت!"], [11, "لذلك عزوا بعضكم بعضا وشددوا أحدكم الآخر، كما أنتم فاعلون."], [12, "على أننا نرجو منكم، أيها الإخوة، أن تميزوا أولئك الذين يجتهدون بينكم، ويرعونكم كما يريد الرب، ويعظونكم،"], [13, "وأن تقدروهم تقديرا فائقا في المحبة، من أجل عملهم. عيشوا بسلام بعضكم مع بعض."], [14, "إلا أننا نناشدكم، أيها الإخوة، أن تعظوا الفوضويين، وتشددوا فاقدي العزم، وتساندوا الضعفاء، وتعاملوا الجميع بطول البال."], [15, "حذار أن يبادل أحدكم شر غيره بشر مثله بل اسعوا دائما إلى الخير في معاملتكم بعضكم لبعض وللآخرين جميعا."], [16, "افرحوا على الدوام؛"], [17, "صلوا دون انقطاع؛"], [18, "ارفعوا الشكر في كل حال: فهذه هي مشيئة الله لكم في المسيح يسوع."], [19, "لا تخمدوا الروح،"], [20, "لا تحتقروا النبوءات؛"], [21, "امتحنوا كل شيء وتمسكوا بالحسن."], [22, "ترفعوا عن كل ما فيه شبهة شر."], [23, "وإله السلام نفسه يقدسكم إلى التمام ويحفظكم سالمين، روحا ونفسا وجسدا، لتكونوا بلا لوم عند عودة ربنا يسوع المسيح."], [24, "فإن الله الذي يدعوكم صادق، وسوف يتم ذلك."], [25, "أيها الإخوة، صلوا لأجلنا."], [26, "سلموا على جميع الإخوة بقبلة طاهرة!"], [27, "أناشدكم بالرب أن تقرأ هذه الرسالة على جميع الإخوة."], [28, "ولتكن معكم نعمة ربنا يسوع المسيح."]]}, {"l": "2Ki 1:1-18", "n": "", "vs": [[1, "وتمرد الموآبيون على إسرائيل بعد وفاة أخآب،"], [2, "وسقط أخزيا من كوة في علية قصره في السامرة، فأصيب بجرح قاتل. وبعث رسلا إلى معبد بعل زبوب إله عقرون قائلا: «امضوا واسألوه إن كنت أبرأ من جرحي؟»"], [3, "فقال ملاك الرب لإيليا التشبي: «قم واذهب للقاء رسل ملك السامرة وقل لهم: هل لأنه لا يوجد إله في إسرائيل تذهبون لسؤال بعل زبوب إله عقرون؟"], [4, "لذلك هذا ما يقوله الرب: إن السرير الذي رقدت عليه لن تنهض عنه، بل حتما تموت». وانصرف إيليا."], [5, "ورجع الرسل إلى أخزيا فسألهم: «لماذا رجعتم؟»"], [6, "فأجابوه: «اعترضنا رجل وأمرنا أن نرجع إليك لنخبرك أن الله يقول: هل لأنه لا يوجد إله في إسرائيل ترسل لتسأل بعل زبوب إله عقرون؟ لذلك فإن السرير الذي رقدت عليه لن تنهض عنه بل حتما تموت»."], [7, "فسألهم: «ما هي أوصاف الرجل الذي اعترضكم وبلغكم هذا الكلام؟»"], [8, "فأجابوه: «إنه رجل كثيف الشعر متنطق بحزام من جلد حول حقويه». فقال: «إنه حتما إيليا التشبي»."], [9, "فأرسل أحد قادته على رأس خمسين جنديا إلى إيليا، الذي كان جالسا آنئذ على قمة جبل. فقال له: «يارجل الله، إن الملك يأمرك بمرافقتنا»."], [10, "فأجاب إيليا: «إن كنت أنا رجل الله، فلتنزل نار من السماء وتلتهمك أنت ورجالك الخمسين». فنزلت نار من السماء والتهمته مع رجاله الخمسين."], [11, "فعاد أخزيا وأرسل إليه قائدا آخر على رأس خمسين جنديا، فقال لإيليا: «يارجل الله، الملك يأمرك أن تسرع وتنزل»."], [12, "فأجابه إيليا: «إن كنت أنا رجل الله، فلتنزل نار من السماء وتلتهمك أنت ورجالك الخمسين». فنزلت نار من السماء والتهمته مع رجاله الخمسين."], [13, "ثم أرسل أخزيا للمرة الثالثة قائدا آخر على رأس خمسين جنديا. فأقبل هذا إلى إيليا وجثا أمامه وتوسل إليه قائلا: «يارجل الله، لتكن نفسي ونفوس عبيدك هؤلاء عزيزة في عينيك."], [14, "لقد نزلت نار من السماء التهمت القائدين السابقين مع رجالهما المئة، فأرجوك لتكن نفسي عزيزة في عينيك (ولا تقض علينا(»."], [15, "فقال ملاك الرب لإيليا: «امض معه ولا تخف منه». فقام وانطلق معه لمقابلة الملك."], [16, "وقال إيليا للملك: «هذا ما يقوله الرب: من حيث أنك أرسلت مبعوثين لتستشير بعل زبوب إله عقرون وكأنه لا يوجد إله في إسرائيل لتسأله، فإن السرير الذي رقدت عليه لن تنهض عنه، بل حتما تموت»."], [17, "فمات أخزيا بموجب كلام الرب الذي نطق به على لسان إيليا. وإذ لم يكن له ابن، خلفه أخوه يهورام، وذلك في السنة الثانية لحكم يهورام بن يهوشافاط ملك يهوذا."], [18, "أما بقية أخبار أخزيا وأعماله أليست هي مدونة في كتاب أخبار ملوك إسرائيل؟"]]}], "kwAr": "يوافق ما كتبه", "noteAr": ""}, {"kw": "hard", "raw": "1Ki_10:1; Heb_5:11", "note": "", "refs": [{"l": "1Ki 10:1", "n": "", "vs": [[1, "وعندما بلغت أخبار سليمان وإعلائه لاسم الرب مسامع ملكة سبأ، قدمت لتلقي عليه أسئلة عسيرة،"]]}, {"l": "Heb 5:11", "n": "", "vs": [[11, "بخصوص رئيس الكهنة هذا، عندي كلام كثير، ولكنه صعب التفسير! إذ يبدو أنكم تعانون بلادة في الفهم."]]}], "kwAr": "صعبة الفهم", "noteAr": ""}, {"kw": "unstable", "raw": "2Pe_2:14; Gen_49:4; 2Ti_3:5-7; Jam_1:8", "note": "", "refs": [{"l": "2Pe 2:14", "n": "", "vs": [[14, "عيونهم لا تنظر إلا نظرات الزنى، ولا تشبع من الخطيئة. وكم من نفوس ضعيفة تقع في فخاخهم! أما قلوبهم، فقد تدربت على الشهوة والطمع. إنهم حقا أبناء اللعنة!"]]}, {"l": "Gen 49:4", "n": "", "vs": [[4, "لكنك فائر كالماء لذلك لن تظل متفوقا، لأنك اضطجعت في فراش أبيك. صعدت على سريري فدنسته."]]}, {"l": "2Ti 3:5-7", "n": "", "vs": [[5, "لهم من التقوى مظهرها ولكنهم لقوتها منكرون، فعن هؤلاء الناس ابتعد!"], [6, "فمن هؤلاء من يدخلون البيوت خلسة، ويوقعون في حبائلهم بعض النساء السخيفات المثقلات بالخطايا، اللواتي تجرفهن شهوات مختلفة،"], [7, "يصغين للتعليم دائما، ولا يستطعن أبدا أن يبلغن معرفة الحق بالتمام!"]]}, {"l": "Jam 1:8", "n": "", "vs": [[8, "فعندما يكون الإنسان برأيين، لا يثبت على قرار في جميع أموره."]]}], "kwAr": "غير الراسخين", "noteAr": ""}, {"kw": "wrest", "raw": "Exo_23:2, Exo_23:6; Deu_16:19; Psa_56:5; Hab_1:4", "note": "", "refs": [{"l": "Exo 23:2", "n": "", "vs": [[2, "لا تنسق وراء الأغلبية لارتكاب الشر، ولا تحرف شهادتك في دعوى انجرافا مع الأكثرية،"]]}, {"l": "Exo 23:6", "n": "", "vs": [[6, "لا تحرف حق فقيرك في دعواه لكونه فقيرا."]]}, {"l": "Deu 16:19", "n": "", "vs": [[19, "لا تعوجوا القضاء ولا تحابوا، ولا تقبلوا رشوة، لأن الرشوة تعمي أبصار الحكماء، وتعوج أقوال الصديقين."]]}, {"l": "Psa 56:5", "n": "", "vs": [[5, "يحرف أعدائي طوال اليوم كلامي. كل أفكارهم تتآمر بالشر علي."]]}, {"l": "Hab 1:4", "n": "", "vs": [[4, "لذلك بطلت الشريعة، وباد العدل لأن الأشرار يحاصرون الصديق فيصدر الحكم منحرفا عن الحق."]]}], "kwAr": "يحرفها", "noteAr": ""}, {"kw": "the other", "raw": "Jer_23:36; Mat_15:3, Mat_15:6, Mat_22:29", "note": "", "refs": [{"l": "Jer 23:36", "n": "", "vs": [[36, "أما ادعاء وحي الرب فلا تذكروه من بعد، فإن كلمة المرء تغدو وحي قضائه، إذ قد حرفتم كلام الإله الحي، الرب القدير، إلهنا."]]}, {"l": "Mat 15:3", "n": "", "vs": [[3, "فأجابهم «ولماذا تخالفون أنتم وصية الله من أجل المحافظة على تقاليدكم؟"]]}, {"l": "Mat 15:6", "n": "", "vs": [[6, "فهو في حل من إكرام أبيه وأمه. وأنتم، بهذا، تلغون ما أوصى به الله ، محافظة على تقاليدكم."]]}, {"l": "Mat 22:29", "n": "", "vs": [[29, "فرد عليهم يسوع قائلا: «أنتم في ضلال لأنكم لا تفهمون الكتاب ولا 24:24", "n": "", "vs": [[24, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات عظيمة وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Mar 13:22", "n": "", "vs": [[22, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Rom 16:18", "n": "", "vs": [[18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."]]}, {"l": "2Co 11:3", "n": "", "vs": [[3, "غير أني أخشى أن تضلل عقولكم عن الإخلاص والطهارة تجاه المسيح مثلما أغوت الحية بمكرها حواء."]]}, {"l": "2Co 11:13-15", "n": "", "vs": [[13, "فإن أمثال هؤلاء هم رسل دجالون، عمال ماكرون، يظهرون أنفسهم بمظهر رسل المسيح."], [14, "ولا عجب! فالشيطان نفسه يظهر نفسه بمظهر ملاك نور."], [15, "فليس كثيرا إذن أن يظهر خدامه أنفسهم بمظهر خدام البر. وإن عاقبتهم ستكون على حسب أعمالهم."]]}], "kwAr": "بالانجراف وراء ضلال الأشرار", "noteAr": ""}, {"kw": "from", "raw": "2Pe_1:10,2Pe_1:11, 2Pe_2:18-22; Act_2:42; 1Co_15:58; Eph_4:14; Col_2:5; Heb_3:14; 1Pe_5:9", "note": "", "refs": [{"l": "2Pe 1:10", "n": "", "vs": [[10, "فأحرى بكم إذن، أيها الإخوة، أن تجتهدوا لتثبتوا عمليا أن الله قد دعاكم واختاركم حقا. فإنكم، إن فعلتم هذا، لن تسقطوا أبدا!"]]}, {"l": "2Pe 1:11", "n": "", "vs": [[11, "وهكذا يفتح الله لكم الباب واسعا للدخول إلى الملكوت الأبدي، ملكوت ربنا ومخلصنا يسوع المسيح."]]}, {"l": "2Pe 2:18-22", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."], [19, "يعدون هؤلاء بالحرية، وهم أنفسهم عبيد للفساد! لأن الإنسان يصير عبدا لكل ما يتسلط عليه ويغلبه."], [20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."], [21, "وبالحقيقة، كان أفضل لهم لو أنهم لم يتعرفوا بطريق البر، من أن يتعرفوا به ثم يرتدوا عن الوصية المقدسة التي تسلموها."], [22, "وينطبق على هؤلاء ما يقوله المثل الصادق: «عاد الكلب إلى تناول ما تقيأه، والخنزيرة المغتسلة إلى التمرغ في الوحل!»"]]}, {"l": "Act 2:42", "n": "", "vs": [[42, "وكان الجميع يداومون على تلقي تعليم الرسل، وعلى حياة الشركة، وكسر الخبز، والصلوات."]]}, {"l": "1Co 15:58", "n": "", "vs": [[58, "إذن، ياإخوتي الأحباء، كونوا راسخين غير متزحزحين، كثيري الاجتهاد في عمل الرب دائما، عالمين أن جهدكم في الرب ليس عبثا!"]]}, {"l": "Eph 4:14", "n": "", "vs": [[14, "وذلك حتى لا نكون فيما بعد أطفالا تتقاذفنا وتحملنا كل ريح تعليم يقوم على خداع الناس والمكر بهم لجرهم إلى الضلال الملفق،"]]}, {"l": "Col 2:5", "n": "", "vs": [[5, "فمع أني في الجسد غائب، إلا أني في الروح حاضر معكم، أفرح إذ أشاهد ترتيبكم وثباتكم في الإيمان بالمسيح."]]}, {"l": "Heb 3:14", "n": "", "vs": [[14, "فإن تمسكنا دائما بالثقة التي انطلقنا بها في البداية، وأبقيناها ثابتة إلى النهاية، نكون مشاركين للمسيح."]]}, {"l": "1Pe 5:9", "n": "", "vs": [[9, "فقاوموه، ثابتين في الإيمان. واذكروا أن إخوتكم المنتشرين في العالم يجتازون وسط هذه الآلام عينها."]]}], "kwAr": "تسقطوا عن ثباتكم", "noteAr": ""}], "arS": [["أما أنتم أيها ", []], ["الأحباء", ["G27"]], ["، فإذ قد ", []], ["تنبهتم", ["G4267"]], [" إلى الخطر قبل حدوثه، ", []], ["احذروا", ["G5442"]], [" أن ", []], ["تسقطوا", ["G1601"]], [" عن ", []], ["ثباتكم", ["G4740"]], [" ", []], ["بالانجراف", ["G4879"]], [" وراء ", []], ["ضلال", ["G4106"]], [" ", []], ["الأشرار", ["G113"]], [".", []]]}, {"c": 3, "v": 18, "text": "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي.", "groups": [{"kw": "grow", "raw": "Psa_92:12; Hos_14:5; Mal_4:2; Eph_4:15; Col_1:10; 2Th_1:3; 1Pe_2:2", "note": "", "refs": [{"l": "Psa 92:12", "n": "", "vs": [[12, "الصديق يزهو كالنخلة وينمو كالأرز في لبنان."]]}, {"l": "Hos 14:5", "n": "", "vs": [[5, "وأكون كالطل لإسرائيل، فيزهر كالسوسن، وتتأصل جذوره كأرز لبنان."]]}, {"l": "Mal 4:2", "n": "", "vs": [[2, "أما أنتم أيها المتقون اسمي فتشرق عليكم شمس البر حاملة في أجنحتها الشفاء فتنطلقون متواثبين كعجول المعلف،"]]}, {"l": "Eph 4:15", "n": "", "vs": [[15, "بل نتمسك بالحق في المحبة، فننمو في كل شيء نحو من هو الرأس، أي المسيح."]]}, {"l": "Col 1:10", "n": "", "vs": [[10, "لكي تسلكوا سلوكا لائقا بالرب ومرضيا في كل شيء، منتجين الثمر في كل عمل صالح ونامين في معرفة الله إلى التمام،"]]}, {"l": "2Th 1:3", "n": "", "vs": [[3, "من واجبنا أن نشكر الله على الدوام لأجلكم أيها الإخوة. كما أن هذا حق: لأن إيمانكم ينمو نموا فائقا، ومحبة أحدكم للآخر تفيض بينكم جميعا."]]}, {"l": "1Pe 2:2", "n": "", "vs": [[2, "وكأطفال مولودين حديثا، تشوقوا إلى اللبن الروحي النقي لكي تنموا به إلى أن تبلغوا الخلاص،"]]}], "kwAr": "ازدادوا نموا", "noteAr": ""}, {"kw": "knowledge", "raw": "2Pe_1:3, 2Pe_1:8, 2Pe_2:20; Joh_17:3; 2Co_4:6; Eph_1:17; Phi_3:8; Col_1:10, Col_3:10", "note": "", "refs": [{"l": "2Pe 1:3", "n": "", "vs": [[3, "إن الله، بقدرته الإلهية، قد زودنا بكل ما نحتاج إليه في الحيا ة الروحية المتصفة بالتقوى. ذلك أنه عرفنا بالمسيح الذي دعانا إلى مجده وفضيلته،"]]}, {"l": "2Pe 1:8", "n": "", "vs": [[8, "فحين تكون هذه الصفات الطيبة في داخلكم، وتزداد بوفرة، تجعلكم مجتهدين ومثمرين في معرفتكم لربنا يسوع المسيح."]]}, {"l": "2Pe 2:20", "n": "", "vs": [[20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."]]}, {"l": "Joh 17:3", "n": "", "vs": [[3, "والحياة الأبدية هي أن يعرفوك أنت الإله الحق وحدك، والذي أرسلته: يسوع المسيح."]]}, {"l": "2Co 4:6", "n": "", "vs": [[6, "فإن الله ، الذي أمر أن يشرق نور من الظلام، هو الذي جعل النور يشرق في قلوبنا، لإشعاع معرفة مجد الله المتجلي في وجه المسيح."]]}, {"l": "Eph 1:17", "n": "", "vs": [[17, "حتى يهبكم إله ربنا يسوع المسيح، أبو المجد، روح حكمة وإلهام: لتعرفوه معرفة كاملة"]]}, {"l": "Phi 3:8", "n": "", "vs": [[8, "بل إني أعتبر كل شيء خسارة، من أجل امتياز معرفة المسيح يسوع ربي؛ فمن أجله تحملت خسارة كل شيء، وأعتبر كل شيء نفاية، لكي أربح المسيح"]]}, {"l": "Col 1:10", "n": "", "vs": [[10, "لكي تسلكوا سلوكا لائقا بالرب ومرضيا في كل شيء، منتجين الثمر في كل عمل صالح ونامين في معرفة الله إلى التمام،"]]}, {"l": "Col 3:10", "n": "", "vs": [[10, "ولبستم الجديد الذي يتجدد لبلوغ تمام المعرفة وفقا لصورة خالقه،"]]}], "kwAr": "معرفة ربنا", "noteAr": ""}, {"kw": "To him", "raw": "Joh_5:23; 2Ti_4:18; 1Pe_5:10,1Pe_5:11; Jud_1:25; Rev_1:6, Rev_5:9-14", "note": "", "refs": [{"l": "Joh 5:23", "n": "", "vs": [[23, "ليكرم الجميع الابن كما يكرمون الآب. ومن لا يكرم الابن لا يكرم الآب الذي أرسله."]]}, {"l": "2Ti 4:18", "n": "", "vs": [[18, "وسينجيني الرب من كل عمل شرير ويحفظني سالما لملكوته السماوي. فله المجد إلى أبد الآبدين آمين!"]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}, {"l": "1Pe 5:11", "n": "", "vs": [[11, "له المجد والسلطة إلى أبد الآبدين. آمين!"]]}, {"l": "Jud 1:25", "n": "", "vs": [[25, "لله الواحد، مخلصنا بيسوع المسيح ربنا ... المجد والجلال والقدرة والسلطة، من قبل أن كان الزمان، والآن وطوال الأزمان آمين!"]]}, {"l": "Rev 1:6", "n": "", "vs": [[6, "وجعل منا مملكة، وكهنة لله أبيه، له المجد والسلطان إلى أبد الآبدين. آمين!"]]}, {"l": "Rev 5:9-14", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"], [10, "وجعلتهم مملكة لإلهنا وكهنة له، وسيملكون على الأرض»."], [11, "ثم نظرت، فسمعت ترتيل الملايين من الملائكة وهي تحيط بالعرش وبالكائنات الحية والشيوخ،"], [12, "وهم يهتفون بصوت عال: «مستحق هو الحمل المذبوح أن ينال القدرة والغنى والحكمة والقوة والإجلال والمجد والبركة»."], [13, "ثم سمعت كل خليقة في السماء وعلى الأرض، وتحت الأرض، وعلى البحر، هاتفة مع كل ما فيها: «البركة والإجلال والمجد والسلطة للجالس على العرش وللحمل، إلى أبد الآبدين»."], [14, "فردت الكائنات الحية الأربعة: «آمين!» وجثا الشيوخ ساجدين."]]}], "kwAr": "له المجد", "noteAr": ""}, {"kw": "Amen", "raw": "Mat_6:13, Mat_28:20", "note": "", "refs": [{"l": "Mat 6:13", "n": "", "vs": [[13, "ولا تدخلنا في تجربة، لكن نجنا من الشرير، لأن لك الملك والقوة والمجد إلى الأبد. آمين."]]}, {"l": "Mat 28:20", "n": "
