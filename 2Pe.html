], [" واردة في ", []], ["الكتاب", ["G1124"]], [" لا ", []], ["تفسر", ["G1955"]], [" باجتهاد ", []], ["خاص", ["G2398"]], [".", []]]}, {"c": 1, "v": 21, "text": "إذ لم تأت نبوءة قط بإرادة بشرية، بل تكلم بالنبوآت جميعا رجال الله غالقديسونف مدفوعين بوحي الروح القدس.", "groups": [{"kw": "the prophecy", "raw": "Luk_1:70; 2Ti_3:16; 1Pe_1:11", "note": "", "refs": [{"l": "Luk 1:70", "n": "", "vs": [[70, "كما تكلم بلسان أنبيائه القديسين الذين جاءوا منذ القديم:"]]}, {"l": "2Ti 3:16", "n": "", "vs": [[16, "إن الكتاب بكل ما فيه، قد أوحى به الله؛ وهو مفيد للتعليم والتوبيخ والتقويم وتهذيب الإنسان في البر،"]]}, {"l": "1Pe 1:11", "n": "", "vs": [[11, "واجتهدوا لمعرفة الزمان والأحوال التي كان يشير إليها روح المسيح الذي كان عاملا فيهم، عندما شهد لهم مسبقا بما ينتظر المسيح من آلام، وبما يأتي بعدها من أمجاد."]]}], "kwAr": "لم تأت نبوءة", "noteAr": ""}, {"kw": "in old time", "raw": "or, at any time holy, Deu_33:1; Jos_14:6; 1Ki_13:1, 1Ki_17:18, 1Ki_17:24; 2Ki_4:7, 2Ki_4:9, 2Ki_4:22, 2Ki_6:10,2Ki_6:15; 1Ch_23:14; 2Ch_8:14", "note": "or, at any time holy, Deu_33:1; Jos_14:6; 1Ki_13:1, 1Ki_17:18, 1Ki_17:24; 2Ki_4:7, 2Ki_4:9, 2Ki_4:22, 2Ki_6:10,2Ki_6:15; 1Ch_23:14; 2Ch_8:14", "refs": [{"l": "Deu 33:1", "n": "", "vs": [[1, "وهذه هي البركة التي بارك بها موسى، رجل الله، بني إسرائيل قبل موته،"]]}, {"l": "Jos 14:6", "n": "", "vs": [[6, "وأقبل وفد من سبط يهوذا على يشوع في الجلجال، وقال له كالب بن يفنة القنزي: «أنت تذكر ما خاطب به الرب موسى رجل الله بشأني وشأنك في قادش برنيع،"]]}, {"l": "1Ki 13:1", "n": "", "vs": [[1, "وبينما كان يربعام واقفا عند المذبح ليوقد عليه، أقبل رجل الله من يهوذا إلى بيت إيل حاملا رسالة من الرب."]]}, {"l": "1Ki 17:18", "n": "", "vs": [[18, "فقالت لإيليا: «أي ذنب جنيته بحقك يارجل الله؟ هل جئت إلي لتذكرني بإثمي وتميت ابني؟»"]]}, {"l": "1Ki 17:24", "n": "", "vs": [[24, "فقالت المرأة لإيليا: «الآن علمت أنك رجل الله، وأن الله ينطق على لسانك بالحق»."]]}, {"l": "2Ki 4:7", "n": "", "vs": [[7, "فجاءت إلى رجل الله وأخبرته. فقال لها: «اذهبي وبيعي الزيت وأوفي دينك، وعيشي أنت وأبناؤك بما يتبقى من مال»."]]}, {"l": "2Ki 4:9", "n": "", "vs": [[9, "فقالت لزوجها: «لقد أدركت أن الرجل الذي نستضيفه دائما هو رجل مقدس لله،"]]}, {"l": "2Ki 4:22", "n": "", "vs": [[22, "وقالت لزوجها: «ابعث لي بأحد رجالك مع أتان لأهرع إلى رجل الله ثم أرجع»."]]}, {"l": "2Ki 6:10", "n": "", "vs": [[10, "فأرسل ملك إسرائيل مراقبيه إلى الموضع الذي أخبره عنه رجل الله وحذره منه، فتأكد من صحة النبأ. وتكررت تحذيرات أليشع للملك مرات عديدة، فكان الملك يتحفظ دائما لنفسه."]]}, {"l": "2Ki 6:15", "n": "", "vs": [[15, "فنهض خادم رجل الله مبكرا وخرج، وإذا به يجد جيشا مجهزا بخيول ومركبات يحاصر المدينة. فقال الخادم: «آه ياسيدي، ما العمل؟»"]]}, {"l": "1Ch 23:14", "n": "", "vs": [[14, "أما أبناء موسى رجل الله فأحصوا مع سبط لاوي."]]}, {"l": "2Ch 8:14", "n": "", "vs": [[14, "ونظم خدمات وواجبات فرق الكهنة واللاويين بمقتضى ما رتبه أبوه داود، فكان اللاويون يقومون بالتسبيح والخدمة تحت إشراف الكهنة، وحراسة الأبواب حسب فرقهم كل يوم بيومه، تنفيذا لأوامر داود رجل الله."]]}], "kwAr": "قط", "noteAr": "أو: في أي وقت. رجال الله القديسون."}, {"kw": "spake", "raw": "Num_16:28; 2Sa_23:2; Mic_3:7; Luk_1:70; 2Ti_3:15-17; 1Pe_1:11; Rev_19:10", "note": "", "refs": [{"l": "Num 16:28", "n": "", "vs": [[28, "فقال موسى: «بهذا تعرفون أن الرب قد أرسلني لأجري كل هذه الأعمال، وأنها ليست صادرة عن نفسي:"]]}, {"l": "2Sa 23:2", "n": "", "vs": [[2, "«تكلم روح الرب بفمي، وكلمته نطق بها لساني."]]}, {"l": "Mic 3:7", "n": "", "vs": [[7, "يعتري الرائين الخزي وينتاب العرافين الخجل، ويغطون جميعهم شفاههم لأنهم لا ينالون جوابا من الرب."]]}, {"l": "Luk 1:70", "n": "", "vs": [[70, "كما تكلم بلسان أنبيائه القديسين الذين جاءوا منذ القديم:"]]}, {"l": "2Ti 3:15-17", "n": "", "vs": [[15, "وتعلم أنك منذ حداثة سنك تعرف الكتب المقدسة، وهي القادرة أن تجعلك حكيما لبلوغ الخلاص عن طريق الإيمان في المسيح يسوع."], [16, "إن الكتاب بكل ما فيه، قد أوحى به الله؛ وهو مفيد للتعليم والتوبيخ والتقويم وتهذيب الإنسان في البر،"], [17, "لكي يجعل إنسان الله مؤهلا تأهيلا كاملا، ومجهزا لكل عمل صالح."]]}, {"l": "1Pe 1:11", "n": "", "vs": [[11, "واجتهدوا لمعرفة الزمان والأحوال التي كان يشير إليها روح المسيح الذي كان عاملا فيهم، عندما شهد لهم مسبقا بما ينتظر المسيح من آلام، وبما يأتي بعدها من أمجاد."]]}, {"l": "Rev 19:10", "n": "", "vs": [[10, "فجثوت عند قدميه لأسجد له، فقال لي: «لا تفعل! إني عبد لله، مثلك ومثل إخوتك المؤمنين الذين لديهم الشهادة المختصة بيسوع: لله اسجد! فإن الشهادة المختصة بيسوع هي روح النبوءة»."]]}], "kwAr": "تكلم", "noteAr": ""}, {"kw": "by the Holy", "raw": "Mar_12:36; Act_1:16, Act_3:18, Act_28:25; Heb_3:7, Heb_9:8, Heb_10:15", "note": "", "refs": [{"l": "Mar 12:36", "n": "", "vs": [[36, "فإن داود نفسه قال بالروح القدس: قال الرب لربي: اجلس عن يميني حتى أضع أعداءك موطئا لقدميك!"]]}, {"l": "Act 1:16", "n": "", "vs": [[16, "«أيها الإخوة، كان لابد من أن تتم النبوءة التي قالها الروح القدس بلسان النبي داود، عن يهوذا الذي انقلب دليلا للذين قبضوا على يسوع."]]}, {"l": "Act 3:18", "n": "", "vs": [[18, "ولكن الله أتم بذلك ما كان قد أوحى به إلى جميع أنبيائه من أن المسيح سيلاقي الآلام."]]}, {"l": "Act 28:25", "n": "", "vs": [[25, "فاختلفوا فيما بينهم، وانصرفوا بعدما قال لهم: «صدق الروح القدس إذ قال لآبائكم بلسان النبي إشعياء:"]]}, {"l": "Heb 3:7", "n": "", "vs": [[7, "لهذا، ينبهنا الروح القدس إذ يقول: «اليوم، إن سمعتم صوته،"]]}, {"l": "Heb 9:8", "n": "", "vs": [[8, "وبهذا، يشير الروح القدس إلى أن الطريق المؤدية إلى «قدس الأقداس» الحقيقي في السماء، كانت غير مفتوحة بعد. ذلك لأن المسكن الأول مازال قائما."]]}, {"l": "Heb 10:15", "n": "", "vs": [[15, "والروح القدس نفسه يشهد لنا بهذه الحقيقة. إذ قال أولا:"]]}], "kwAr": "مدفوعين بوحي الروح القدس", "noteAr": ""}], "arS": [["إذ لم تأت ", []], ["نبوءة", ["G4394"]], [" قط ", []], ["بإرادة", ["G2307"]], [" ", []], ["بشرية", ["G444"]], ["، بل ", []], ["تكلم", ["G2980"]], [" بالنبوآت جميعا ", []], ["رجال", ["G444"]], [" ", []], ["الله", ["G2316"]], [" غالقديسونف ", []], ["مدفوعين", ["G5342"]], [" بوحي ", []], ["الروح", ["G4151"]], [" ", []], ["القدس", ["G40"]], [".", []]]}, {"c": 2, "v": 1, "text": "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا.", "groups": [{"kw": "there were", "raw": "Deu_13:1-3; 1Ki_18:19-22, 1Ki_22:6; Neh_6:12-14; Isa_9:15, Isa_56:10,Isa_56:11; Jer_14:13-15, Jer_23:16, Jer_23:17, Jer_23:25-32, Jer_27:14, Jer_27:15, Jer_28:15-17, Jer_29:8, Jer_29:9, Jer_29:31, Jer_29:32; Jer_37:19; Lam_2:14; Ezek. 13:3-18; Hos_9:8; Mic_2:11, Mic_3:5, Mic_3:11; Zec_13:3, Zec_13:4; Mat_7:15; Luk_6:26; Rom_16:18", "note": "", "refs": [{"l": "Deu 13:1-3", "n": "", "vs": [[1, "إذا ظهر بينكم نبي أو صاحب أحلام، وتنبأ بوقوع آية أو أعجوبة."], [2, "فتحققت تلك الآية أو الأعجوبة التي تنبأ بها، ثم قال: هلم نذهب وراء آلهة أخرى لم تعرفوها ونعبدها."], [3, "فلا تصغوا إلى كلام ذلك النبي أو صاحب الأحلام، لأن الرب إلهكم يجربكم ليرى إن كنتم تحبونه من كل قلوبكم ومن كل أنفسكم،"]]}, {"l": "1Ki 18:19-22", "n": "", "vs": [[19, "فالآن أرسل واستدع لي كل بني إسرائيل إلى جبل الكرمل، وكذلك أنبياء البعل الأربع مئة والخمسين، وأنبياء عشتاروث الأربع مئة الآكلين على مائدة إيزابل»."], [20, "فاستدعى أخآب جميع بني إسرائيل، وجمع الأنبياء إلى جبل الكرمل،"], [21, "فخاطب إيليا الشعب: «حتى متى تظلون تعرجون بين الفرقتين؟ إن كان الرب هو الله فاتبعوه، وإن كان البعل هو الله فاتبعوه». فلم يجبه الشعب بكلمة."], [22, "ثم قال إيليا للشعب: «أنا بقيت وحدي نبيا للرب، وأنبياء البعل أربع مئة وخمسون."]]}, {"l": "1Ki 22:6", "n": "", "vs": [[6, "فجمع ملك إسرائيل نحو أربع مئة من أنبياء الأصنام وسألهم: «هل أذهب للحرب إلى راموت جلعاد أم أمتنع؟» فأجابوه: «اذهب، فإن الرب سينصرك ويسلمها لك»."]]}, {"l": "Neh 6:12-14", "n": "", "vs": [[12, "وأدركت أنه لم يكن مرسلا من الله، وإنما تنبأ كذبا علي، لأن طوبيا وسنبلط دفعا له رشوة،"], [13, "ليبث الرعب في، فأخطىء إذ أفعل وفق رأيه، فتشيع عني سمعة سيئة يعيرانني بها."], [14, "فاذكر ياإلهي ما يقوم به طوبيا وسنبلط من أعمال، وكذلك نوعدية النبية وسائر الأنبياء الذين يعملون على إرهابي."]]}, {"l": "Isa 9:15", "n": "", "vs": [[15, "إن الشيخ والوجيه هو الرأس، والنبي الذي يلقن الكذب هو الذنب"]]}, {"l": "Isa 56:10", "n": "", "vs": [[10, "فإن رقباءهم عمي، وكلهم جهال، وكلاب بكم عاجزون عن النباح، حالمون راقدون مولعون بالنوم."]]}, {"l": "Isa 56:11", "n": "", "vs": [[11, "هم كلاب نهمة لا تعرف الشبع، ورعاة أيضا مجردون من الفهم، كل مال إلى طريقه طمعا في الربح،"]]}, {"l": "Jer 14:13-15", "n": "", "vs": [[13, "ثم قلت: «آه أيها السيد الرب، ها الأنبياء الكذبة يقولون لهم: لن تتعرضوا للسيف ولا للجوع، بل أنعم عليكم بسلام محقق في هذا الموضع»."], [14, "وقال لي الرب: «إن الأنبياء يتنبأون زورا باسمي وأنا لم أرسلهم ولم آمرهم، ولم أكلمهم، إنما هم يتنبأون لكم برؤيا كاذبة وعرافة باطلة مستوحاة من ضلال قلوبهم."], [15, "لذلك هكذا يقول الرب عن هؤلاء الأنبياء المتنبئين باسمي: مع أني لم أرسلهم فإنهم يقولون: لن تبتلى هذه الأرض بسيف ولا مجاعة، لهذا فإن هولاء الأنبياء يفنون بالسيف والمجاعة."]]}, {"l": "Jer 23:16", "n": "", "vs": [[16, "«لا تسمعوا لأقوال الأنبياء الذين يتنبأون لكم ويخدعونكم بالأوهام، لأنهم ينطقون برؤى مخيلاتهم، ولا يتكلمون بما أوحى به فمي."]]}, {"l": "Jer 23:17", "n": "", "vs": [[17, "قائلين بإصرار لمن يحتقرونني: قد أعلن الرب أن السلام يسودكم ويرددون لكل من يجري وراء أهواء قلبه: لن يصيبكم ضر."]]}, {"l": "Jer 23:25-32", "n": "", "vs": [[25, "قد سمعت ما نطق به المتنبئون باسمي زورا قائلين: قد حلمت، قد حلمت."], [26, "إلى متى يظل هذا الخداع مكنونا في قلوب المتنبئين زورا؟ إنهم حقا أنبياء خداع، يتنبأون بأوهام قلوبهم."], [27, "فينسون شعبي اسمي بما يقصه كل واحد منهم على صاحبه من أحلامه، كما نسي آباؤهم اسمي لأجل وثن البعل."], [28, "فليقص النبي الحالم حلمه. ولكن من لديه كلمتي فليعلنها بالحق، إذ ماذا يجمع بين التبن والحنطة؟"], [29, "أليست كلمتي كالنار، وكالمطرقة التي تحطم الصخور؟"], [30, "لذلك ها أنا أقاوم هؤلاء الأنبياء الذين ينتحل كل منهم كلام الآخر،"], [31, "وأقاوم الأنبياء الذين يسخرون ألسنتهم قائلين: الرب يقول هذا."], [32, "ها أنا أقاوم المتنبئين بأحلام كاذبة ويقصونها مضلين شعبي بأكاذيبهم واستخفافهم، مع أني لم أرسلهم ولم أكلفهم بشيء. ولا جدوى منهم لهذا الشعب."]]}, {"l": "Jer 27:14", "n": "", "vs": [[14, "لا تستمعوا لكلام الأنبياء الكذبة الذين يقولون لكم: لا تستعبدوا لملك بابل لأنهم يتنبأون لكم كذبا،"]]}, {"l": "Jer 27:15", "n": "", "vs": [[15, "فأنا لم أرسلهم، يقول الرب، إنما هم يتنبأون باسمي كذبا لأجلكم فتطردون أنتم وأنبياؤكم المتنبئون لكم»."]]}, {"l": "Jer 28:15-17", "n": "", "vs": [[15, "وأضاف إرميا النبي مخاطبا حننيا المتنبيء: «اسمع ياحننيا، هذا ما يعلنه الرب: إن الرب لم يبعثك، وأنت جعلت هذا الشعب يصدق كذبك."], [16, "لذلك هكذا يعلن الرب: ها أنا أبيدك عن وجه الأرض فتموت في هذه السنة لأنك نطقت بالتمرد على الرب»."], [17, "وفي الشهر السابع من تلك السنة عينها مات حننيا."]]}, {"l": "Jer 29:8", "n": "", "vs": [[8, "لأن هذا ما يعلنه الرب القدير إله إسرائيل: لا يخدعنكم أنبياؤكم الكذبة المقيمون في وسطكم، والعرافون. لا تستمعوا إلى أحلامهم التي توهمكم بالأمل،"]]}, {"l": "Jer 29:9", "n": "", "vs": [[9, "لأنهم يتنبأون لكم باسمي كذبا، وأنا لم أبعثهم»، يقول الرب."]]}, {"l": "Jer 29:31", "n": "", "vs": [[31, "«ابعث إلى جميع المسبيين قائلا: هذا ما يعلنه الرب عن شمعيا النحلامي: بما أن شمعيا قد تنبأ لكم مع أني لم أرسله وجعلكم تصدقون الكذب،"]]}, {"l": "Jer 29:32", "n": "", "vs": [[32, "فلذلك يقول الرب: ها أنا أعاقب شمعيا وذريته فلا يمتد العمر بأحد منهم بين هذا الشعب ليشهد الخير الذي سأجريه على شعبي، لأنه نطق بالتمرد علي»."]]}, {"l": "Jer 37:19", "n": "", "vs": [[19, "وأين أنبياؤكم الذين تنبأوا لكم قائلين: إن ملك بابل لن يزحف عليكم وعلى هذه الأرض؟"]]}, {"l": "Lam 2:14", "n": "", "vs": [[14, "رأى لك أنبياؤك رؤى باطلة خادعة. لم يفضحوا إثمك ليردوا سبيك. إنما رأوا لك وحيا كاذبا مضلا."]]}, {"l": "Eze 13:3-18", "n": "", "vs": [[3, "ويل للأنبياء الحمقى الضالين وراء أرواحهم من غير أن يروا شيئا."], [4, "أنبياؤك ياإسرائيل هم كالثعالب في الخرائب."], [5, "لم تبرزوا إلى الثغرات، ولم تشيدوا جدارا حول بيت إسرائيل لتصمدوا في القتال في يوم الرب،"], [6, "إنما رؤياهم باطلة، وعرافتهم كاذبة. يقولون: يقول الرب، والرب لم يرسلهم، ومع ذلك يطمعون في تحقيق كلمتهم."], [7, "ألم تروا رؤيا باطلة، وتنطقوا بعرافة كاذبة قائلين: يقول الرب، وأنا لم أتكلم؟"], [8, "لذلك يعلن الرب: لأنكم تكلمتم باطلا وادعيتم رؤيا كاذبة، فها أنا أنقلب عليكم يقول السيد الرب."], [9, "فتكون يدي على الأنبياء ذوي الرؤيا الباطلة والعرافة الكاذبة، فلا يكون لهم مقام في جماعة شعبي، ولا تدون أسماؤهم في كتاب بيت إسرائيل، ولا يدخلون أرض إسرائيل، فتدركون أني أنا السيد الرب."], [10, "لأنهم حقا أضلوا شعبي قائلين: سيكون لكم سلام مع أنه ليس هناك سلام، فكان شعبي يبني حائطا وهم يطلونه بماء الكلس."], [11, "قل للطالين بماء الكلس: إن الحائط يتداعى، إذ ينهمر مطر جارف. وأنتن ياحجارة البر د تساقطن، ولتعصف به ريح جائحة."], [12, "فلا يلبث السور أن ينهار أفلا تسألون آنئذ: أين الطين الذي طينتم به؟"], [13, "لذلك، هذا ما يعلنه السيد الرب: ها أنا أجعل ريحا عاتية تخترق السور بفعل حنقي، ومطرا جارفا ينهمر في خضم غضبي، وحجارة برد تتساقط في أثناء سخطي لكي تهلك،"], [14, "فأهدم السور الذي طليتموه بماء الكلس وأسويه بالأرض فيتعرى أساسه وتتداعى المدينة وتفنون جميعا في وسطها فتدركون أني أنا الرب."], [15, "فأنفث غضبي بالسور وبمن يطلونه بماء الكلس وأقول لكم: قد تلاشى السور والذين يطلونه."], [16, "الذين هم أنبياء إسرائيل الأدعياء، المتنبئون لإسرائيل، الذين يرون لها رؤى سلام، مع أنه لا سلام هناك، يقول السيد الرب."], [17, "أما أنت ياابن آدم، فالتفت نحو بنات شعبك المتنبئات من عند أنفسهن وتنبأ عليهن،"], [18, "وقل هذا ما يعلنه السيد الرب: ويل للخائطات العصائب السحرية لكل معاصم الأيدي والأنقاب لرأس كل قامة لاصطياد النفوس. أنتن تصطدن نفوس شعبي وتستحيين نفوسكن"]]}, {"l": "Hos 9:8", "n": "", "vs": [[8, "إن النبي هو رقيب أفرايم شعب إلهي، غير أن فخ صياد قد نصب في كل طرقه، وطغى الحقد على بيت إلهي."]]}, {"l": "Mic 2:11", "n": "", "vs": [[11, "إن جال رجل يتنبأ بينكم بالكذب وباللغو الباطل قائلا: إنني أتنبأ لكم بالخمر الوفير والمسكر، فإنه يصبح نبي هذا الشعب."]]}, {"l": "Mic 3:5", "n": "", "vs": [[5, "وهذا ما يقوله الرب بشأن الأنبياء الذين يضلون شعبه، الذين ينادون قائلين: «سلام» لمن يعطيهم طعاما، ويعلنون الحرب على من لا يلقم أفواههم."]]}, {"l": "Mic 3:11", "n": "", "vs": [[11, "إذ يحكم رؤساؤها بالرشوة، وكهنتها يعلمون بالأجرة ويتعاطى أنبياؤها العرافة لقاء المال، ومع ذلك يدعون الاتكال على الله قائلين: «أليس الرب في وسطنا؟ لذلك لن يصيبنا مكروه»."]]}, {"l": "Zec 13:3", "n": "", "vs": [[3, "وإن تنبأ أحد فيما بعد، يطعنه أبوه وأمه اللذان أنجباه قائلين: لابد أن تموت لأنك نطقت بالزور باسم الرب."]]}, {"l": "Zec 13:4", "n": "", "vs": [[4, "في ذلك اليوم يعتري الخزي كل نبي كاذب يتنبأ من رؤياه، ولا يرتدي مسوح الشعر ليكذب."]]}, {"l": "Mat 7:15", "n": "", "vs": [[15, "احذروا الأنبياء الدجالين الذين يأتون إليكم لابسين ثياب الحملان، ولكنهم من الداخل ذئاب خاطفة!"]]}, {"l": "Luk 6:26", "n": "", "vs": [[26, "الويل لكم إذا امتدحكم جميع الناس، فإنه هكذا عامل آباؤهم الأنبياء الدجالين."]]}, {"l": "Rom 16:18", "n": "", "vs": [[18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."]]}], "kwAr": "أنبياء دجالون", "noteAr": ""}, {"kw": "even", "raw": "Mat_24:5, Mat_24:11, Mat_24:24; Mar_13:22; Luk_21:8; Act_20:29, Act_20:30; 1Co_11:19; 2Co_11:13-15; Gal_4:17; Eph_4:14; Col_2:8, Col_2:18; 2Th_2:3-12; 1Ti_4:1-3; 2Ti_3:1-9, 2Ti_4:3; Tit_1:11; 1Jo_2:18, 1Jo_2:19, 1Jo_2:26, 1Jo_4:1; Jud_1:18; Rev_2:9, Rev_13:14", "note": "", "refs": [{"l": "Mat 24:5", "n": "", "vs": [[5, "فإن كثيرين سيأتون باسمي قائلين إني أنا هو المسيح، فيضللون كثيرين."]]}, {"l": "Mat 24:11", "n": "", "vs": [[11, "ويظهر كثيرون من الأنبياء الدجالين ويضللون كثيرين."]]}, {"l": "Mat 24:24", "n": "", "vs": [[24, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات عظيمة وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Mar 13:22", "n": "", "vs": [[22, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Luk 21:8", "n": "", "vs": [[8, "فقال: «انتبهوا! لا تضلوا! فإن كثيرين سيأتون باسمي قائلين إني أنا هو وإن الزمان قد اقترب: فلا تتبعوهم!"]]}, {"l": "Act 20:29", "n": "", "vs": [[29, "فإني أعلم أنه بعد رحيلي سيندس بينكم ذئاب خاطفة، لا تشفق على القطيع."]]}, {"l": "Act 20:30", "n": "", "vs": [[30, "بل إن قوما منكم أنتم سيقومون ويعلمون تعاليم منحرفة، ليجروا التلاميذ وراءهم."]]}, {"l": "1Co 11:19", "n": "", "vs": [[19, "لأنه لابد من وجود المذاهب بينكم، حتى يبرز الفاضلون فيكم."]]}, {"l": "2Co 11:13-15", "n": "", "vs": [[13, "فإن أمثال هؤلاء هم رسل دجالون، عمال ماكرون، يظهرون أنفسهم بمظهر رسل المسيح."], [14, "ولا عجب! فالشيطان نفسه يظهر نفسه بمظهر ملاك نور."], [15, "فليس كثيرا إذن أن يظهر خدامه أنفسهم بمظهر خدام البر. وإن عاقبتهم ستكون على حسب أعمالهم."]]}, {"l": "Gal 4:17", "n": "", "vs": [[17, "إن أولئك (المعلمين) يظهرون من نحوكم حماسة، ولكنها غير صادقة، بل هم يرغبون في عزلكم عنا،"]]}, {"l": "Eph 4:14", "n": "", "vs": [[14, "وذلك حتى لا نكون فيما بعد أطفالا تتقاذفنا وتحملنا كل ريح تعليم يقوم على خداع الناس والمكر بهم لجرهم إلى الضلال الملفق،"]]}, {"l": "Col 2:8", "n": "", "vs": [[8, "احذروا أن يوقعكم أحد فريسة بالفلسفة والغرور الباطل، عملا بتقاليد الناس ومباديء العالم؛ مما لا يوافق المسيح."]]}, {"l": "Col 2:18", "n": "", "vs": [[18, "لا يحرمكم أحد من جائزتكم، بحملكم على ما يرغب فيه من إظهار التواضع والتعبد للملائكة، داخلا في رؤى يتوهمها، وقد نفخه باطلا ذهنه الجسدي،"]]}, {"l": "2Th 2:3-12", "n": "", "vs": [[3, "لا تدعوا أحدا يخدعكم بأية وسيلة! فإن ذلك اليوم لا يأتي دون أن يسبقه انتشار العصيان وظهور الإنسان المتمرد، ابن الهلاك،"], [4, "الذي يتحدى كل ما يدعى إلها أو معبودا، ويعاديه مترفعا عليه. بل إنه أيضا يتخذ من هيكل الله مقرا له، محاولا أن يبرهن أنه إله."], [5, "ألا تذكرون أني كثيرا ما قلت لكم هذا عندما كنت عندكم؟"], [6, "وأنتم الآن تعرفون ما الذي يحتجزه حتى لا يظهر إلا في الوقت المعين له."], [7, "فإن التمرد الآن يعمل خفية كأنه سر. ولكن فقط إلى أن يرفع من الوسط ذاك الذي يحتجز المتمرد."], [8, "عندئذ سيظهر الإنسان المتمرد ظهورا جليا فيبيده الرب يسوع بنفخة فمه ويلاشيه ببهاء ظهوره عند عودته."], [9, "أما بروز المتمرد، فسوف يكون بقدر طاقة الشيطان على المعجزات والعلامات والعجائب المزيفة كلها،"], [10, "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا."], [11, "ولهذا السبب، سيرسل الله إليهم طاقة الضلال حتى يصدقوا ما هو دجل،"], [12, "فتقع الدينونة على جميع الذين لم يؤمنوا بالحق بل سرهم الإثم."]]}, {"l": "1Ti 4:1-3", "n": "", "vs": [[1, "إلا أن الروح يعلن صراحة أن قوما في الأزمنة الأخيرة سوف يرتدون عن الإيمان، منساقين وراء أرواح مضللة وتعاليم شيطانية،"], [2, "في موجة رياء ينشرها معلمون دجالون لهم ضمائر كويت بالنار."], [3, "يحرمون الزواج، ويأمرون بالامتناع عن أطعمة خلقها الله ليتناولها المؤمنون وعارفو الحق شاكرين."]]}, {"l": "2Ti 3:1-9", "n": "", "vs": [[1, "واعلم هذا الأمر: أن أزمنة صعبة ستعم في الأيام الأخيرة؛"], [2, "إذ يكون الناس محبين لأنفسهم، محبين للمال، متكبرين، مباهين بأنفسهم، شتامين، غير مطيعين لوالديهم، ناكرين للجميل، دنسين،"], [3, "متحجري العواطف، غير صفوحين، نمامين، جامحي الأهواء، شرسين غير محبين للصلاح،"], [4, "خائنين، وقحين، مدعين، محبين للذات أكثر من محبتهم لله،"], [5, "لهم من التقوى مظهرها ولكنهم لقوتها منكرون، فعن هؤلاء الناس ابتعد!"], [6, "فمن هؤلاء من يدخلون البيوت خلسة، ويوقعون في حبائلهم بعض النساء السخيفات المثقلات بالخطايا، اللواتي تجرفهن شهوات مختلفة،"], [7, "يصغين للتعليم دائما، ولا يستطعن أبدا أن يبلغن معرفة الحق بالتمام!"], [8, "ومثلما قاوم (الساحران) ينيس ويمبريس موسى، كذلك أيضا يقاوم هؤلاء الحق؛ أناس عقولهم فاسدة، وقد تبين أنهم غير أهل للإيمان."], [9, "ولكنهم لن يزدادوا تقدما، لأن حماقتهم ستنكشف للجميع، مثلما انكشفت حماقة الرجلين المذكورين."]]}, {"l": "2Ti 4:3", "n": "", "vs": [[3, "فإنه سيأتي زمان لا يطيق الناس فيه التعليم الصحيح، بل تبعا لشهواتهم الخاصة يكدسون لأنفسهم معلمين (يقولون لهم كلاما) يداعب الآذان."]]}, {"l": "Tit 1:11", "n": "", "vs": [[11, "هؤلاء يجب أن تسد أفواههم: فهم يخربون بيوتا بجملتها، إذ يعلمون تعاليم يجب ألا تعلم، في سبيل مكسب خسيس."]]}, {"l": "1Jo 2:18", "n": "", "vs": [[18, "أيها الأولاد، اعلموا أننا نعيش الآن في الزمن الأخير. وكما سمعتم أنه سوف يأتي أخيرا «مسيح دجال»، فقد ظهر حتى الآن كثيرون من الدجالين المقاومين للمسيح. من هنا نتأكد أننا نعيش في الزمن الأخير."]]}, {"l": "1Jo 2:19", "n": "", "vs": [[19, "هؤلاء الدجالون انفصلوا عنا، لكنهم في الواقع لم يكونوا منا. ولو كانوا منا لظلوا معنا. فانفصالهم عنا إذن برهان على أنهم جميعا ليسوا منا."]]}, {"l": "1Jo 2:26", "n": "", "vs": [[26, "كتبت إليكم هذا مشيرا إلى الذين يحاولون أن يضللوكم."]]}, {"l": "1Jo 4:1", "n": "", "vs": [[1, "أيها الأحباء، لا تصدقوا كل روح، بل امتحنوا الأرواح لتعرفوا ما إذا كانت من عند الله أم لا، لأن عددا كبيرا من الأنبياء الدجالين قد انتشر في العالم."]]}, {"l": "Jud 1:18", "n": "", "vs": [[18, "فقد سبق أن نبهوكم إلى أنه، في نهاية الزمان، سيطلع مستهزئون يعيشون منغمسين في شهواتهم الفاسقة."]]}, {"l": "Rev 2:9", "n": "", "vs": [[9, "إني أعلم كم تقاسي من ضيق وفقر، رغم أنك غني. وأعلم تجريح الذين يدعون أنهم يهود ولكنهم ليسوا يهودا، بل هم مجمع للشيطان!"]]}, {"l": "Rev 13:14", "n": "", "vs": [[14, "فخدع سكان الأرض بالآيات التي كان يقوم بها في حضور الوحش الأول. وأمر سكان الأرض أن يقيموا تمثالا للوحش الأول الذي كان قد جرح جرحا مميتا ولكنه عاش!"]]}], "kwAr": "معلمون دجالون", "noteAr": ""}, {"kw": "privily", "raw": "2Pe_2:3; Gal_2:4", "note": "", "refs": [{"l": "2Pe 2:3", "n": "", "vs": [[3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "Gal 2:4", "n": "", "vs": [[4, "إنما أثير الأمر بسبب الإخوة الدجالين الذين أدخلوا بيننا خلسة، فاندسوا ليتجسسوا حريتنا التي لنا في المسيح يسوع، لعلهم يعيدوننا إلى العبودية؛"]]}], "kwAr": "سيدسون", "noteAr": ""}, {"kw": "damnable", "raw": "2Pe_2:3; Gal_5:20; Tit_3:10", "note": "", "refs": [{"l": "2Pe 2:3", "n": "", "vs": [[3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "Gal 5:20", "n": "", "vs": [[20, "وعبادة الأصنام والسحر، والعداوة والنزاع والغيرة والغضب، والتحزب والانقسام والتعصب،"]]}, {"l": "Tit 3:10", "n": "", "vs": [[10, "وصاحب الهرطقة اقطع العلاقة به بعد إنذاره أولا وثانيا،"]]}], "kwAr": "بدعا مهلكة", "noteAr": ""}, {"kw": "denying", "raw": "Mat_10:33; Luk_12:9; Act_3:13, Act_3:14; 2Ti_2:12, 2Ti_2:13; Jud_1:4; Rev_2:13, Rev_3:8", "note": "", "refs": [{"l": "Mat 10:33", "n": "", "vs": [[33, "وكل من ينكرني أمام الناس، أنكره أنا أيضا أمام أبي الذي في السماوات."]]}, {"l": "Luk 12:9", "n": "", "vs": [[9, "ومن أنكرني أمام الناس، ينكر أمام ملائكة الله."]]}, {"l": "Act 3:13", "n": "", "vs": [[13, "إن إله إبراهيم وإسحاق ويعقوب، إله آبائنا، قد مجد فتاه يسوع، الذي أسلمتموه أنتم للموت وأنكرتموه أمام بيلاطس، في حين كان يريد أن يطلقه."]]}, {"l": "Act 3:14", "n": "", "vs": [[14, "أنتم أنكرتم القدوس البار وطلبتم العفو عن رجل قاتل،"]]}, {"l": "2Ti 2:12", "n": "", "vs": [[12, "إن تحملنا الآلام، فسوف نملك أيضا معه؛ إن أنكرناه، فسوف ينكرنا أيضا؛"]]}, {"l": "2Ti 2:13", "n": "", "vs": [[13, "إن تخلينا عن أمانتنا، فهو يبقى على أمانته، إذ لا يمكن أن يتنكر لذاته!»"]]}, {"l": "Jud 1:4", "n": "", "vs": [[4, "لأنه قد تسلل إلى ما بينكم معلمون لابد أن يلاقوا الحكم بالعقاب الأبدي، كما هو مكتوب لهم منذ القديم. فهم أشرار لا يهابون الله ، يتخذون من نعمة إلهنا فرصة لإباحة الرذائل، وينكرون سيدنا وربنا الوحيد يسوع المسيح."]]}, {"l": "Rev 2:13", "n": "", "vs": [[13, "إني أعلم أين تسكن، حيث عرش الشيطان! ورغم ذلك تمسكت باسمي، ورفضت أن تنكر الإيمان بي، حتى في أيام أنتيباس شهيدي الأمين، الذي قتل عندكم حيث يسكن الشيطان!"]]}, {"l": "Rev 3:8", "n": "", "vs": [[8, "إني عالم بأعمالك. فمع أن لك قوة ضئيلة، فقد أطعت كلمتي ولم تنكر اسمي، ولذلك فتحت لك بابا لا يقدر أحد أن يغلقه."]]}], "kwAr": "ينكرون السيد", "noteAr": ""}, {"kw": "bought", "raw": "Deu_32:6; Act_20:28; 1Co_6:20, 1Co_7:23; Gal_3:13; Eph_1:7; Heb_10:29; 1Pe_1:8; Rev_5:9", "note": "", "refs": [{"l": "Deu 32:6", "n": "", "vs": [[6, "أبهذا تكافئون الرب أيها الشعب الأحمق الغبي؟ أليس هو أباكم وخالقكم الذي عملكم وكونكم؟"]]}, {"l": "Act 20:28", "n": "", "vs": [[28, "فاسهروا إذن على أنفسكم وعلى جميع القطيع الذي عينكم بينه الروح القدس نظارا، لترعوا كنيسة الله التي اشتراها بدمه."]]}, {"l": "1Co 6:20", "n": "", "vs": [[20, "لأنكم قد اشتريتم بفدية. إذن، مجدوا الله في أجسادكم."]]}, {"l": "1Co 7:23", "n": "", "vs": [[23, "قد اشتريتم بفدية، فلا تصيروا عبيدا للبشر."]]}, {"l": "Gal 3:13", "n": "", "vs": [[13, "إن المسيح حررنا بالفداء من لعنة الشريعة، إذ صار لعنة عوضا عنا، لأنه قد كتب: «ملعون كل من علق على خشبة»،"]]}, {"l": "Eph 1:7", "n": "", "vs": [[7, "ففيه لنا بدمه الفداء، أي غفران الخطايا؛ بحسب غنى نعمته"]]}, {"l": "Heb 10:29", "n": "", "vs": [[29, "ففي ظنكم، كم يكون أشد كثيرا ذلك العقاب الذي يستحقه من يدوس ابن الله، إذ يعتبر أن دم العهد، الذي يتقدس به، هو دم نجس، وبذلك يهين روح النعمة؟"]]}, {"l": "1Pe 1:8", "n": "", "vs": [[8, "أنتم لم تروا المسيح، ولكنكم تحبونه. ومع أنكم لا ترونه الآن، فأنتم تؤمنون به وتبتهجون بفرح مجيد يفوق الوصف."]]}, {"l": "Rev 5:9", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"]]}], "kwAr": "الذي اشتراهم", "noteAr": ""}, {"kw": "and bring", "raw": "2Pe_2:3; Mal_3:5; Phi_3:19", "note": "", "refs": [{"l": "2Pe 2:3", "n": "", "vs": [[3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "Mal 3:5", "n": "", "vs": [[5, "وأقترب منكم لأكون شاهدا سريعا ضد السحرة والزناة والحالفين بالزور والمستغلين لأجرة العامل ومضطهدي الأرامل والأيتام، والذين يظلمون الغرباء ولا يخافونني"]]}, {"l": "Phi 3:19", "n": "", "vs": [[19, "الذين مصيرهم الهلاك، وإلههم بطونهم، ومفخرتهم في عيبتهم، وفكرهم منصرف إلى الأمور الأرضية."]]}], "kwAr": "يجلبون على أنفسهم دمارا سريعا", "noteAr": ""}], "arS": [["ولكن، كما كان في ", []], ["الشعب", ["G2992"]], [" قديما ", []], ["أنبياء دجالون", ["G5578"]], ["، كذلك سيكون بينكم أنتم أيضا ", []], ["معلمون دجالون", ["G5572"]], [". هؤلاء ", []], ["سيدسون", ["G3919"]], [" ", []], ["بدعا", ["G139"]], [" ", []], ["مهلكة", ["G684"]], ["، ", []], ["وينكرون", ["G720"]], [" ", []], ["السيد", ["G1203"]], [" الذي ", []], ["اشتراهم", ["G59"]], [" لنفسه. وبذلك ", []], ["يجلبون", ["G1863"]], [" على ", []], ["أنفسهم", ["G1438"]], [" ", []], ["دمارا", ["G684"]], [" ", []], ["سريعا", ["G5031"]], [".", []]]}, {"c": 2, "v": 2, "text": "وكثيرون سيسيرون وراءهم في طرق الإباحية. وبسببهم توجه الإهانة إلى طريق الحق.", "groups": [{"kw": "many", "raw": "Mat_24:10-13, Mat_24:24; Mar_13:22; 1Jo_2:18, 1Jo_2:19; Rev_12:9, Rev_13:8, Rev_13:14", "note": "", "refs": [{"l": "Mat 24:10-13", "n": "", "vs": [[10, "فيرتد كثيرون ويسلمون بعضهم بعضا ويبغضون بعضهم بعضا،"], [11, "ويظهر كثيرون من الأنبياء الدجالين ويضللون كثيرين."], [12, "وإذ يعم الإثم، تبرد المحبة لدى الكثيرين."], [13, "ولكن الذي يثبت حتى النهاية، فهو يخلص."]]}, {"l": "Mat 24:24", "n": "", "vs": [[24, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات عظيمة وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Mar 13:22", "n": "", "vs": [[22, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "1Jo 2:18", "n": "", "vs": [[18, "أيها الأولاد، اعلموا أننا نعيش الآن في الزمن الأخير. وكما سمعتم أنه سوف يأتي أخيرا «مسيح دجال»، فقد ظهر حتى الآن كثيرون من الدجالين المقاومين للمسيح. من هنا نتأكد أننا نعيش في الزمن الأخير."]]}, {"l": "1Jo 2:19", "n": "", "vs": [[19, "هؤلاء الدجالون انفصلوا عنا، لكنهم في الواقع لم يكونوا منا. ولو كانوا منا لظلوا معنا. فانفصالهم عنا إذن برهان على أنهم جميعا ليسوا منا."]]}, {"l": "Rev 12:9", "n": "", "vs": [[9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."]]}, {"l": "Rev 13:8", "n": "", "vs": [[8, "فيسجد للوحش جميع سكان الأرض الذين لم تكتب أسماؤهم منذ تأسيس العالم في سجل الحياة للحمل الذي ذبح."]]}, {"l": "Rev 13:14", "n": "", "vs": [[14, "فخدع سكان الأرض بالآيات التي كان يقوم بها في حضور الوحش الأول. وأمر سكان الأرض أن يقيموا تمثالا للوحش الأول الذي كان قد جرح جرحا مميتا ولكنه عاش!"]]}], "kwAr": "وكثيرون", "noteAr": ""}, {"kw": "pernicious ways", "raw": "or, lascivious ways, as some copies read, by reason. Rom_2:24; 1Ti_5:14; Tit_2:5, Tit_2:8", "note": "or, lascivious ways, as some copies read, by reason. Rom_2:24; 1Ti_5:14; Tit_2:5, Tit_2:8", "refs": [{"l": "Rom 2:24", "n": "", "vs": [[24, "فإن «اسم الله يجدف عليه بين الأمم بسببكم»، كما هو مكتوب."]]}, {"l": "1Ti 5:14", "n": "", "vs": [[14, "فأريد إذن أن تتزوج الأرامل الشابات، فيلدن الأولاد، ويدبرن بيوتهن، ولا يفسحن للمقاوم في المجال للطعن في سلوكهن."]]}, {"l": "Tit 2:5", "n": "", "vs": [[5, "متعقلات، عفيفات، مهتمات بشؤون بيوتهن صالحات، خاضعات لأزواجهن، حتى لا يتكلم أحد بالسوء على كلمة الله."]]}, {"l": "Tit 2:8", "n": "", "vs": [[8, "والكلمة الصحيحة التي لا تلام، لكي يخجل المقاوم حين لا يجد أمرا سيئا يقوله فينا."]]}], "kwAr": "طرق الإباحية", "noteAr": "أو: طرق الإباحية، كما تقرأ بعض النسخ."}, {"kw": "ways", "raw": "2Pe_2:15, 2Pe_2:21; Psa_18:21; Isa_35:8; Jer_6:16; Mat_7:14, Mat_22:16; Mar_12:14; Joh_14:6; Act_13:10, Act_16:17, Act_18:26, Act_19:9, Act_24:14", "note": "", "refs": [{"l": "2Pe 2:15", "n": "", "vs": [[15, "وإذ خرجوا عن الطريق المستقيم، ضلوا. فهم سائرون في طريق بلعام بن بعور، الذي أحب الحصول على المال أجرة لإثمه."]]}, {"l": "2Pe 2:21", "n": "", "vs": [[21, "وبالحقيقة، كان أفضل لهم لو أنهم لم يتعرفوا بطريق البر، من أن يتعرفوا به ثم يرتدوا عن الوصية المقدسة التي تسلموها."]]}, {"l": "Psa 18:21", "n": "", "vs": [[21, "لأني سلكت دائما في طرق الرب ولم أعص إلهي."]]}, {"l": "Isa 35:8", "n": "", "vs": [[8, "وتكون هناك طريق تدعى طريق القداسة، لا يسلك فيها من هو دنس، إنما تكون من نصيب السالكين في تلك الطريق، ولا يضل فيها حتى الجهال."]]}, {"l": "Jer 6:16", "n": "", "vs": [[16, "وهذا ما يعلنه الرب: «قفوا في الطرقات وانظروا، واسألوا عن المسالك الصالحة القديمة واطرقوها، فتجدوا راحة لنفوسكم. ولكنكم قلتم: لن نسير فيها."]]}, {"l": "Mat 7:14", "n": "", "vs": [[14, "ما أضيق الباب وأعسر الطريق المؤدي إلى الحياة! وقليلون هم الذين يهتدون إليه."]]}, {"l": "Mat 22:16", "n": "", "vs": [[16, "فأرسلوا إليه بعض تلاميذهم مع أعضاء حزب هيرودس، يقولون له: «يامعلم، نعلم أنك صادق وتعلم الناس طريق الله في الحق، ولا تبالي بأحد لأنك لا تراعي مقامات الناس،"]]}, {"l": "Mar 12:14", "n": "", "vs": [[14, "فجاءوا وقالوا له: «يامعلم، نحن نعلم أنك صادق، ولا تبالي بأحد، لأنك لا تراعي مقامات الناس، بل تعلم طريق الله بالحق: أيحل أن تدفع الجزية للقيصر أم لا؟ أندفعها أم لا ندفع؟»"]]}, {"l": "Joh 14:6", "n": "", "vs": [[6, "فأجابه يسوع: «أنا هو الطريق والحق والحياة. لا يأتي أحد إلى الآب إلا بي."]]}, {"l": "Act 13:10", "n": "", "vs": [[10, "«أيها الممتليء غشا وخبثا! ياابن إبليس! ياعدو كل بر! أما تكف عن تعويج طرق الرب المستقيمة؟"]]}, {"l": "Act 16:17", "n": "", "vs": [[17, "فأخذت تسير وراء بولس ووراءنا صارخة: «هؤلاء الناس هم عبيد الله العلي، يعلنون لكم طريق الخلاص»."]]}, {"l": "Act 18:26", "n": "", "vs": [[26, "فقد أخذ يتكلم في المجمع بجرأة. فسمعه أكيلا وبريسكلا، فأخذاه إليهما وأوضحا له طريق الله بأكثر دقة."]]}, {"l": "Act 19:9", "n": "", "vs": [[9, "ولكن بعضهم عاندوا ولم يقتنعوا، وأخذوا يشتمون الطريق أمام المجتمعين. فانفصل بولس عنهم، وانفرد بالتلاميذ، وبدأ يعقد مناقشات كل يوم في مدرسة رجل اسمه تيرانوس،"]]}, {"l": "Act 24:14", "n": "", "vs": [[14, "ولكني أعترف أمامك بأني أعبد إله آبائي بحسب المذهب الذي يصفونه بأنه بدعة، وأومن بكل ما كتب في الشريعة وكتب الأنبياء،"]]}], "kwAr": "طرقهم", "noteAr": ""}, {"kw": "evil", "raw": "2Pe_2:12; Act_14:2; 1Pe_2:12; Jud_1:10,Jud_1:15", "note": "", "refs": [{"l": "2Pe 2:12", "n": "", "vs": [[12, "حقا إن هؤلاء المعلمين الدجالين الذين يتكلمون كلاما مهينا في أمور يجهلونها، يشبهون الحيوانات المفترسة غير العاقلة، المولودة ليصطادها الناس ويقتلوها. فلابد أن يهلكوا مثلها."]]}, {"l": "Act 14:2", "n": "", "vs": [[2, "ولكن اليهود الذين لم يؤمنوا أثاروا غير اليهود على الإخوة، وأفسدوا عقولهم."]]}, {"l": "1Pe 2:12", "n": "", "vs": [[12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالحة يمجدون الله في يوم الافتقاد."]]}, {"l": "Jud 1:10", "n": "", "vs": [[10, "ولكن هؤلاء المعلمين يتكلمون كلاما مهينا على أمور لا يعرفونها. وأما ما يفهمونه بالغريزة، كالحيوانات غير العاقلة، فإنهم به يدمرون أنفسهم."]]}, {"l": "Jud 1:15", "n": "", "vs": [[15, "ليدين جميع الناس، ويوبخ جميع الأشرار الذين لا يهابون الله ، بسبب جميع أعمالهم الشريرة التي ارتكبوها وجميع أقوالهم القاسية التي أهانوه بها والتي لا تصدر إلا عن الخاطئين الأشرار غير الأتقياء!»"]]}], "kwAr": "توجه الإهانة إلى طريق الحق", "noteAr": ""}], "arS": [["وكثيرون", ["G4183"]], [" ", []], ["سيسيرون وراءهم", ["G1811"]], [" في طرق ", []], ["الإباحية", ["G684"]], [". وبسببهم ", []], ["توجه الإهانة", ["G987"]], [" إلى ", []], ["طريق", ["G3598"]], [" ", []], ["الحق", ["G225"]], [".", []]]}, {"c": 2, "v": 3, "text": "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة.", "groups": [{"kw": "through", "raw": "2Pe_2:14, 2Pe_2:15; Isa_56:11; Jer_6:13, Jer_8:10; Eze_13:19; Mic_3:11; Mal_1:10; Rom_16:18; 2Co_12:17, 2Co_12:18; 1Ti_3:3, 1Ti_3:8, 1Ti_6:5; Tit_1:7, Tit_1:11; 1Pe_5:2; Jud_1:11", "note": "", "refs": [{"l": "2Pe 2:14", "n": "", "vs": [[14, "عيونهم لا تنظر إلا نظرات الزنى، ولا تشبع من الخطيئة. وكم من نفوس ضعيفة تقع في فخاخهم! أما قلوبهم، فقد تدربت على الشهوة والطمع. إنهم حقا أبناء اللعنة!"]]}, {"l": "2Pe 2:15", "n": "", "vs": [[15, "وإذ خرجوا عن الطريق المستقيم، ضلوا. فهم سائرون في طريق بلعام بن بعور، الذي أحب الحصول على المال أجرة لإثمه."]]}, {"l": "Isa 56:11", "n": "", "vs": [[11, "هم كلاب نهمة لا تعرف الشبع، ورعاة أيضا مجردون من الفهم، كل مال إلى طريقه طمعا في الربح،"]]}, {"l": "Jer 6:13", "n": "", "vs": [[13, "لأنهم جميعا، صغارهم وكبارهم، مولعون بالربح الحرام. حتى النبي والكاهن يرتكبان الزور في أعمالهما."]]}, {"l": "Jer 8:10", "n": "", "vs": [[10, "لذلك أعطي نساءهم لآخرين وحقولهم للوارثين القاهرين، لأنهم جميعا من صغيرهم إلى كبيرهم مولعون بالربح. حتى النبي والكاهن يرتكبان الزور في أعمالهما،"]]}, {"l": "Eze 13:19", "n": "", "vs": [[19, "فتدنسنني عند شعبي لقاء حفنة شعير وفتات خبز حتى تمتن نفوسا ما كان يجب أن تموت، ولكي تستحيين نفوسا أخرى لم يكن لها أن تحيا من جراء كذبكن على شعبي السامع للكذب."]]}, {"l": "Mic 3:11", "n": "", "vs": [[11, "إذ يحكم رؤساؤها بالرشوة، وكهنتها يعلمون بالأجرة ويتعاطى أنبياؤها العرافة لقاء المال، ومع ذلك يدعون الاتكال على الله قائلين: «أليس الرب في وسطنا؟ لذلك لن يصيبنا مكروه»."]]}, {"l": "Mal 1:10", "n": "", "vs": [[10, "آه، ياليت بينكم من يغلق أبواب الهيكل لئلا توقدوا نارا باطلة على مذبحي، يقول الرب القدير: إذ لا مسرة لي بكم ولا أرضى بتقدمة من أيديكم."]]}, {"l": "Rom 16:18", "n": "", "vs": [[18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."]]}, {"l": "2Co 12:17", "n": "", "vs": [[17, "هل كسبت منكم شيئا بأحد من الذين أرسلتهم إليكم؟"]]}, {"l": "2Co 12:18", "n": "", "vs": [[18, "التمست من تيطس أن يتوجه إليكم، وأرسلت معه ذلك الأخ، فهل غنم منكم تيطس شيئا؟ ألم نتصرف معكم، أنا وتيطس، بروح واحد وخطوات واحدة؟"]]}, {"l": "1Ti 3:3", "n": "", "vs": [[3, "لا مدمنا للخمر ولا عنيفا؛ بل لطيفا، غير متعود الخصام، غير مولع بالمال،"]]}, {"l": "1Ti 3:8", "n": "", "vs": [[8, "أما المدبرون، فيجب أن يكونوا أيضا ذوي رصانة، لا ذوي لسانين، ولا مدمنين للخمر، لا ساعين إلى المكسب الخسيس."]]}, {"l": "1Ti 6:5", "n": "", "vs": [[5, "وشتى أنواع النزاع بين أناس فاسدي العقول مجردين من الحق، يعتبرون التقوى تجارة."]]}, {"l": "Tit 1:7", "n": "", "vs": [[7, "وذلك لأن الناظر يجب أن يكون بريئا من كل تهمة باعتباره وكيلا لله، لا معجبا بنفسه ولا حاد الطبع، ولا مدمن الخمر، ولا عنيفا، ولا ساعيا إلى المكسب الخسيس؛"]]}, {"l": "Tit 1:11", "n": "", "vs": [[11, "هؤلاء يجب أن تسد أفواههم: فهم يخربون بيوتا بجملتها، إذ يعلمون تعاليم يجب ألا تعلم، في سبيل مكسب خسيس."]]}, {"l": "1Pe 5:2", "n": "", "vs": [[2, "ارعوا قطيع الله الذي بينكم، كحراس له، لا بدافع الواجب، بل بدافع التطوع، كما يريد الله ، ولا رغبة في الربح الدنيء، بل رغبة في الخدمة بنشاط."]]}, {"l": "Jud 1:11", "n": "", "vs": [[11, "الويل لهم! لأنهم سلكوا طريق قايين، واندفعوا إلى ارتكاب خطيئة بلعام طلبا للمال، وتمردوا كما تمرد قورح، فدمروا أنفسهم."]]}], "kwAr": "بدافع الطمع", "noteAr": ""}, {"kw": "with", "raw": "2Pe_1:16; Psa_18:44, Psa_66:3, Psa_81:15 *marg. Luk_20:20, Luk_22:47; 1Th_2:5", "note": "", "refs": [{"l": "2Pe 1:16", "n": "", "vs": [[16, "فنحن، عندما أخبرناكم بقدرة ربنا يسوع المسيح، وبعودته المجيدة، لم نكن ننقل عن أساطير مختلقة بمهارة. وإنما، تكلمنا باعتبارنا شهود عيان لعظمة المسيح."]]}, {"l": "Psa 18:44", "n": "", "vs": [[44, "فما إن يسمعوا أمري حتى يلبوه. الغرباء يتذللون لي"]]}, {"l": "Psa 66:3", "n": "", "vs": [[3, "قولوا لله: «ما أروع أعمالك». يتملقك أعداؤك لأن قوتك عظيمة."]]}, {"l": "Psa 81:15", "n": "*marg.", "vs": [[15, "ولكان مبغضي يتملقونني، ولطالت حقبة عقابهم إلى الأبد."]]}, {"l": "Luk 20:20", "n": "", "vs": [[20, "فجعلوا يراقبونه، وبثوا حوله جواسيس يتظاهرون أنهم أبرار، لكي يمسكوه بكلمة يقولها، فيسلموه إلى قضاء الحاكم وسلطته."]]}, {"l": "Luk 22:47", "n": "", "vs": [[47, "وفيما هو يتكلم، إذا جمع يتقدمهم المدعو يهوذا، وهو واحد من الاثني عشر. فتقدم إلى يسوع ليقبله."]]}, {"l": "1Th 2:5", "n": "", "vs": [[5, "وكما تعلمون أيضا، فإننا لم نستعمل معكم قط كلام التملق، ولا اتخذنا ذريعة للطمع إنما الله شاهد"]]}], "kwAr": "بالأقوال المحرفة", "noteAr": ""}, {"kw": "make", "raw": "Deu_24:17; Joh_2:16; 2Co_2:17; Rev_18:11-13", "note": "", "refs": [{"l": "Deu 24:17", "n": "", "vs": [[17, "لا تحرفوا حكم العدالة فتظلموا الغريب واليتيم، ولا تسترهنوا ثوب الأرملة،"]]}, {"l": "Joh 2:16", "n": "", "vs": [[16, "وقال لبائعي الحمام: «أخرجوا هذه من هنا. لا تجعلوا بيت أبي بيتا للتجارة!»"]]}, {"l": "2Co 2:17", "n": "", "vs": [[17, "فإننا لا نتاجر بكلمة الله كما يفعل الكثيرون، وإنما بإخلاص ومن قبل الله، وأمام الله، نتكلم في المسيح."]]}, {"l": "Rev 18:11-13", "n": "", "vs": [[11, "وسيبكي تجار الأرض ويحزنون عليها، لأنه لم يبق أحد ليشتري بضائعهم،"], [12, "فقد كانت هي تشتري منهم الذهب والفضة والحجارة الكريمة واللؤلؤ، والكتان والأرجوان والحرير والقرمز، وجميع الأخشاب العطرة وأدوات العاج والمصنوعات الخشبية الثمينة، والنحاس والحديد والرخام،"], [13, "والقرفة والبهار، والعطور والطيب والبخور، والخمر والزيت والدقيق والحبوب، والبهائم والغنم، والخيل والمركبات، والأجساد والنفوس البشرية"]]}], "kwAr": "يتاجرون بكم", "noteAr": ""}, {"kw": "whose", "raw": "2Pe_2:1, 2Pe_2:9; Deu_32:35; Isa_5:19, Isa_30:13, Isa_30:14, Isa_60:22; Hab_3:3; Luk_18:8; 1Th_5:3; 1Pe_2:8; Jud_1:4, Jud_1:7, Jud_1:15", "note": "", "refs": [{"l": "2Pe 2:1", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."]]}, {"l": "2Pe 2:9", "n": "", "vs": [[9, "وهكذا نرى أن الرب يعرف أن ينقذ الأتقياء من المحنة، ويحفظ الأشرار محبوسين ليحكم عليهم بالعقاب في يوم الدينونة."]]}, {"l": "Deu 32:35", "n": "", "vs": [[35, "لي النقمة وأنا أجازي. وفي الوقت المعين تزل أقدامهم فيوم هلاكهم بات وشيكا، ومصيرهم المحتوم يسرع إليهم،"]]}, {"l": "Isa 5:19", "n": "", "vs": [[19, "ويقولون: ليسرع وليعجل بعقابه حتى نراه. لينفذ مقدس إسرائيل مأربه فينا فندرك حقيقة ما يفعله بنا."]]}, {"l": "Isa 30:13", "n": "", "vs": [[13, "لذلك يصبح هذا الذنب لكم كصدع ناتيء في سور عال مشرف على الانهيار الذي يحدث بغتة وفى لحظة"]]}, {"l": "Isa 30:14", "n": "", "vs": [[14, "ويكون انهياره ككسر إناء خزاف تم سحقه بقسوة، فلم تبق منه شقفة لالتقاط نار من الموقد أو لغرف ماء من الجب."]]}, {"l": "Isa 60:22", "n": "", "vs": [[22, "ويضحى أقلهم ألفا، وأصغرهم أمة قوية، أنا الرب أسرع في تحقيق ذلك في حينه."]]}, {"l": "Hab 3:3", "n": "", "vs": [[3, "قد أقبل الله من أدوم، وجاء القدوس من جبل فاران. غمر جلاله السماوات وامتلأت الأرض من تسبيحه."]]}, {"l": "Luk 18:8", "n": "", "vs": [[8, "أقول لكم: إنه ينصفهم سريعا. ولكن، عندما يعود ابن الإنسان، أيجد إيمانا على الأرض؟»"]]}, {"l": "1Th 5:3", "n": "", "vs": [[3, "فبينما الناس يقولون: حل السلام والأمن! ينزل بهم الهلاك المفاجيء كالمخاض الذي يدهم الحبلى، فلا يستطيعون أبدا أن يفلتوا."]]}, {"l": "1Pe 2:8", "n": "", "vs": [[8, "كما أنه هو «الحجر الذي يصطدمون به، والصخرة التي يسقطون عليها»! وهم يسقطون لأنهم يرفضون أن يؤمنوا بالكلمة."]]}, {"l": "Jud 1:4", "n": "", "vs": [[4, "لأنه قد تسلل إلى ما بينكم معلمون لابد أن يلاقوا الحكم بالعقاب الأبدي، كما هو مكتوب لهم منذ القديم. فهم أشرار لا يهابون الله ، يتخذون من نعمة إلهنا فرصة لإباحة الرذائل، وينكرون سيدنا وربنا الوحيد يسوع المسيح."]]}, {"l": "Jud 1:7", "n": "", "vs": [[7, "وتعرفون كذلك ما فعله الرب بمدينتي سدوم وعمورة وبالمدن التي حولهما. فقد كان أهل هذه المدن، مثل أولئك المعلمين، مندفعين وراء الزنى، ومنغمسين في شهوات مخالفة للطبيعة. لذلك عاقب الرب هذه المدن بالنار الأبدية، فدمرها. فكانت بذلك عبرة للآخرين."]]}, {"l": "Jud 1:15", "n": "", "vs": [[15, "ليدين جميع الناس، ويوبخ جميع الأشرار الذين لا يهابون الله ، بسبب جميع أعمالهم الشريرة التي ارتكبوها وجميع أقوالهم القاسية التي أهانوه بها والتي لا تصدر إلا عن الخاطئين الأشرار غير الأتقياء!»"]]}], "kwAr": "دينونتهم لا تتوانى", "noteAr": ""}], "arS": [["وبدافع ", []], ["الطمع", ["G4124"]], ["، ", []], ["يتاجرون", ["G1710"]], [" بكم ", []], ["بالأقوال", ["G3056"]], [" ", []], ["المحرفة المزخرفة", ["G4112"]], [".", []]]}, {"c": 2, "v": 4, "text": "فإن الله لم يشفق على الملائكة الذين أخطأوا، بل طرحهم في أعماق هاوية الظلام مقيدين بالسلاسل، حيث يظلون محبوسين إلى يوم الحساب.", "groups": [{"kw": "spared", "raw": "2Pe_2:5; Deu_29:20; Psa_78:50; Eze_5:11, Eze_7:4, Eze_7:9; Rom_8:32, Rom_11:21", "note": "", "refs": [{"l": "2Pe 2:5", "n": "", "vs": [[5, "كذلك لم يشفق على العالم القديم عندما أحدث الطوفان على عالم الفاجرين، إلا أنه حفظ نوحا المنادي ببر الله وعدله. وكان نوح واحدا من ثمانية أشخاص نجوا من الطوفان."]]}, {"l": "Deu 29:20", "n": "", "vs": [[20, "إن الرب لا يشاء الرفق بمثل هذا الإنسان، بل يحتدم غضبه وغيرته عليه، فتنزل به كل اللعنات المدونة في هذا الكتاب، ويمحو اسمه من تحت السماء."]]}, {"l": "Psa 78:50", "n": "", "vs": [[50, "أفلت عنان غضبه، ولم يحفظهم من الموت، بل أهلكهم بالوبإ،"]]}, {"l": "Eze 5:11", "n": "", "vs": [[11, "لهذا حي أنا يقول السيد الرب، لأنك قد دنست مقدسي بكل أصنامك المكروهة، وبجميع رجاساتك، فأنا أيضا أستأصل، ولا تترَأف عليك عيني ولا أعفو."]]}, {"l": "Eze 7:4", "n": "", "vs": [[4, "فلا تتر أف عليك عيني، ولا أعفو، بل أجازيك بمقتضى طرقك، وتكون رجاساتك في وسطك. عندئذ تدركون أني أنا الرب»."]]}, {"l": "Eze 7:9", "n": "", "vs": [[9, "فلا تترَأف عليك عيني ولا أعفو، بل أجازيك بمقتضى طرقك، وتكون رجاساتك في وسطك. وعندئذ تدركون أني أنا الضارب."]]}, {"l": "Rom 8:32", "n": "", "vs": [[32, "بل بذله لأجلنا جميعا، كيف لا يجود علينا معه بكل شيء أيضا؟"]]}, {"l": "Rom 11:21", "n": "", "vs": [[21, "إن الله ربما لا يبقي عليك مادام لم يبق على الأغصان الأصلية."]]}], "kwAr": "لم يشفق", "noteAr": ""}, {"kw": "the angels", "raw": "Job_4:18; Luk_10:18; Joh_8:44; 1Jo_3:8; Jud_1:6", "note": "", "refs": [{"l": "Job 4:18", "n": "", "vs": [[18, "ها إنه لا يأتمن عبيده، وإلى ملائكته ينسب حماقة،"]]}, {"l": "Luk 10:18", "n": "", "vs": [[18, "فقال لهم: «قد رأيت الشيطان وهو يهوي من السماء مثل البرق."]]}, {"l": "Joh 8:44", "n": "", "vs": [[44, "إنكم أولاد أبيكم إبليس، وترغبون أن تعملوا شهوات أبيكم. فهو من البدء كان قاتلا للناس، ولم يثبت في الحق لأنه خال من الحق! وعندما ينطق بالكذب فهو ينضح بما فيه، لأنه كذاب وأبو الكذب!"]]}, {"l": "1Jo 3:8", "n": "", "vs": [[8, "ولكن من يمارس الخطيئة، يظهر أنه من أولاد إبليس، لأن إبليس يمارس الخطيئة منذ البداية. وقد جاء ابن الله إلى الأرض لكي يبطل أعمال إبليس."]]}, {"l": "Jud 1:6", "n": "", "vs": [[6, "وأما الملائكة الذين لم يحافظوا على مقامهم الرفيع، بل تركوا مركزهم، فمازال الرب يحفظهم مقيدين بسلاسل أبدية في أعماق الظلام، بانتظار دينونة ذلك اليوم العظيم."]]}], "kwAr": "الملائكة الذين أخطأوا", "noteAr": ""}, {"kw": "but", "raw": "Isa_14:12; Mat_8:29, Mat_25:41; Mar_5:7; Luk_8:31; Rev_12:7-9, Rev_20:2, Rev_20:3, Rev_20:10", "note": "", "refs": [{"l": "Isa 14:12", "n": "", "vs": [[12, "كيف هويت من السماء يازهرة بنت الصبح؟ كيف قطعت وطرحت إلى الأرض ياقاهر الأمم؟"]]}, {"l": "Mat 8:29", "n": "", "vs": [[29, "وفجأة صرخا قائلين: «ما شأنك بنا يايسوع ابن الله؟ أجئت إلى هنا قبل الأوان لتعذبنا؟»"]]}, {"l": "Mat 25:41", "n": "", "vs": [[41, "ثم يقول للذين عن يساره: ابتعدوا عني ياملاعين إلى النار الأبدية المعدة لإبليس وأعوانه!"]]}, {"l": "Mar 5:7", "n": "", "vs": [[7, "وصرخ بأعلى صوته: «ما شأنك بي يايسوع ابن الله العلي؟ أستحلفك بالله ألا تعذبني!»"]]}, {"l": "Luk 8:31", "n": "", "vs": [[31, "وقد توسلوا إليه ألا يأمرهم بالذهاب إلى الهاوية."]]}, {"l": "Rev 12:7-9", "n": "", "vs": [[7, "ونشبت حرب في السماء، إذ هاجم ميخائيل وملائكته التنين وملائكته،"], [8, "وحارب التنين وملائكته، لكنهم انهزموا ولم يبق لهم مكان في السماء،"], [9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."]]}, {"l": "Rev 20:2", "n": "", "vs": [[2, "قيد بها التنين، أي الحية القديمة، وهو إبليس أو الشيطان، وسجنه مدة ألف سنة،"]]}, {"l": "Rev 20:3", "n": "", "vs": [[3, "وطرحه في الهاوية وأغلقها عليه، وختمها، حتى يكف عن تضليل الأمم، إلى أن تنقضي الألف سنة. ولكن لابد من إطلاقه بعد ذلك لمدة قصيرة."]]}, {"l": "Rev 20:10", "n": "", "vs": [[10, "ثم يطرح إبليس الذي كان يضللهم، في بحيرة النار والكبريت، حيث الوحش والنبي الدجال. هناك سوف يعذبون نهارا وليلا، إلى أبد الآبدين."]]}], "kwAr": "طرحهم", "noteAr": ""}, {"kw": "into", "raw": "2Pe_2:11; Jud_1:6", "note": "", "refs": [{"l": "2Pe 2:11", "n": "", "vs": [[11, "ومع ذلك، فحتى الملائكة، وهم يتفوقون عليهم في القوة والقدرة، لا يقدمون عليهم أمام الرب أية تهمة مهينة.."]]}, {"l": "Jud 1:6", "n": "", "vs": [[6, "وأما الملائكة الذين لم يحافظوا على مقامهم الرفيع، بل تركوا مركزهم، فمازال الرب يحفظهم مقيدين بسلاسل أبدية في أعماق الظلام، بانتظار دينونة ذلك اليوم العظيم."]]}], "kwAr": "مقيدين بالسلاسل", "noteAr": ""}, {"kw": "to be", "raw": "2Pe_2:9; Job_21:30; Jud_1:13", "note": "", "refs": [{"l": "2Pe 2:9", "n": "", "vs": [[9, "وهكذا نرى أن الرب يعرف أن ينقذ الأتقياء من المحنة، ويحفظ الأشرار محبوسين ليحكم عليهم بالعقاب في يوم الدينونة."]]}, {"l": "Job 21:30", "n": "", "vs": [[30, "إن الشرير قد أفلت من يوم البوار، ونجا من العقاب في يوم الغضب."]]}, {"l": "Jud 1:13", "n": "", "vs": [[13, "وبأعمالهم المخجلة يفضحون أنفسهم كأمواج في البحر هائجة تقذف الأوساخ. وهم أشبه بنجوم تائهة في الفضاء، مصيرها الظلام الشديد إلى الأبد!"]]}], "kwAr": "محبوسين إلى يوم الحساب", "noteAr": ""}], "arS": [["فإن ", []], ["الله", ["G2316"]], [" لم ", []], ["يشفق", ["G5339"]], [" على ", []], ["الملائكة", ["G32"]], [" الذين ", []], ["أخطأوا", ["G264"]], ["، بل ", []], ["طرحهم في أعماق هاوية", ["G5020"]], [" ", []], ["الظلام", ["G2217"]], [" مقيدين ", []], ["بالسلاسل", ["G4577"]], ["، حيث يظلون ", []], ["محبوسين", ["G5083"]], [" إلى يوم ", []], ["الحساب", ["G2920"]], [".", []]]}, {"c": 2, "v": 5, "text": "كذلك لم يشفق على العالم القديم عندما أحدث الطوفان على عالم الفاجرين، إلا أنه حفظ نوحا المنادي ببر الله وعدله. وكان نوح واحدا من ثمانية أشخاص نجوا من الطوفان.", "groups": [{"kw": "spared", "raw": "Gen. 6:1-8:22; Job_22:15, Job_22:16; Mat_24:37-39; Luk_17:26, Luk_17:27; Heb_11:7", "note": "", "refs": [{"l": "Gen 6:1-8:22", "n": "", "vs": [[1, "وحدث لما ابتدأ الناس يتكاثرون على سطح الأرض وولد لهم بنات،"], [2, "انجذبت أنظار أبناء الله إلى بنات الناس فرأوا أنهن جميلات فاتخذوا لأنفسهم منهن زوجات حسب ما طاب لهم."], [3, "فقال الرب: «لن يمكث روحي مجاهدا في الإنسان إلى الأبد. هو بشري زائغ، لذلك لن تطول أيامه أكثر من مئة وعشرين سنة فقط»."], [4, "وفي تلك الحقب، كان في الأرض جبابرة، وبعد أن دخل أبناء الله على بنات الناس ولدن لهم أبناء، صار هؤلاء الأبناء أنفسهم الجبابرة المشهورين منذ القدم."], [5, "ورأى الرب أن شر الإنسان قد كثر في الأرض، وأن كل تصور فكر قلبه يتسم دائما بالإثم،"], [6, "فملأ قلبه الأسف والحزن لأنه خلق الإنسان."], [7, "وقال الرب: «أمحو الإنسان الذي خلقته عن وجه الأرض مع سائر الناس والحيوانات والزواحف وطيور السماء، لأني حزنت أني خلقته»."], [8, "أما نوح فقد حظي برضى الرب."], [9, "وهذا سجل مواليد نوح: كان نوح صالحا كاملا في زمانه، وسار نوح مع الله."], [10, "وأنجب نوح ثلاثة أبناء هم سام وحام ويافث."], [11, "وإذ ساد الشر الأرض أمام الله وعمها الظلم،"], [12, "نظر الله وإذا بها فاسدة لأن كل بشر على الأرض قد سلك في طريق الإثم."], [13, "فقال الله لنوح: «قد أزفت نهاية البشر جميعا أمامي، لأنهم ملأوا الأرض ظلما. لذلك سأبيدهم مع الأرض."], [14, "ابن لك فلكا من خشب السرو، واجعل فيه غرفا تطليها بالزفت من الداخل والخارج."], [15, "اصنعه على هذا المثال: ليكن طوله ثلاث مئة ذراع (نحو مئة وخمسة وثلاثين مترا)، وعرضه خمسين ذراعا (نحو اثنين وعشرين مترا ونصف المتر) وارتفاعه ثلاثين ذراعا (نحو ثلاثة عشر مترا ونصف المتر)."], [16, "واجعل له نافذة على انخفاض ذراع (نحو خمسة وأربعين سنتمترا) من السقف، وبابا تقيمه في جانبه. وليكن للفلك طوابق سفلية ومتوسطة وعلوية."], [17, "فها أنا أغرق الأرض بطوفان من المياه لأبيد كل كائن حي فيها ممن تحت السماء. كل ما على الأرض لابد أن يموت."], [18, "ولكني سأقيم معك عهدا، فتدخل أنت مع بنيك وامرأتك ونساء بنيك إلى الفلك."], [19, "وتأخذ معك في الفلك زوجين، ذكرا وأنثى، من كل كائن حي ذي جسد، لاستبقائها معك."], [20, "تدخل معك اثنين من كل صنف من أصناف الطيور والبهائم والزواحف على الأرض، حفاظا على استمرار بقائها."], [21, "وتدخر لنفسك من كل طعام يؤكل وتخزنه عندك ليكون لك ولها غذاء»."], [22, "وفعل نوح تماما بمقتضى كل ما أمر الرب به."], [1, "وقال الرب لنوح: «هيا ادخل أنت وأهل بيتك جميعا إلى الفلك لأني وجدتك وحدك صالحا أمامي في هذا الجيل."], [2, "خذ معك من كل نوع من الحيوانات الطاهرة سبعة ذكور وسبع إناث، وزوجين ذكرا وأنثى من كل نوع من الحيوانات الأخرى غير الطاهرة."], [3, "وخذ معك أيضا من كل نوع من الطيور سبعة ذكور وسبع إناث لاستبقاء نسلها على وجه كل الأرض."], [4, "فإني بعد سبعة أيام أمطر على الأرض أربعين يوما، ليلا ونهارا، فأمحو عن وجه الأرض كل مخلوق حي»."], [5, "وفعل نوح بموجب كل ما أمره الرب به."], [6, "وكان عمر نوح ست مئة سنة عندما حدث طوفان الماء على الأرض."], [7, "فدخل نوح إلى الفلك مع زوجته وأبنائه وزوجاتهم (لينجوا) من مياه الطوفان."], [8, "وكذلك الحيوانات الطاهرة وغير الطاهرة، والطيور والزواحف،"], [9, "دخلت مع نوح إلى الفلك زوجين زوجين، ذكرا وأنثى، كما أمر الله نوحا."], [10, "وما إن انقضت الأيام السبعة حتى فاضت المياه على الأرض"], [11, "ففي سنة ست مئة من عمر نوح، في الشهر الثاني، في اليوم السابع عشر منه، تفجرت المياه من اللجج العميقة في باطن الأرض، وهطلت أمطار السماء الغزيرة،"], [12, "واستمر هذا الطوفان على الأرض ليلا ونهارا مدة أربعين يوما."], [13, "في ذلك اليوم الذي بدأ فيه الطوفان دخل نوح وزوجته وأبناؤه سام وحام ويافث وزوجاتهم الثلاث إلى الفلك."], [14, "ودخل معهم أيضا من الوحوش والبهائم والزواحف والطيور وذوات الأجنحة كل حسب أصنافها؛"], [15, "من جميع المخلوقات الحية أقبلت إلى الفلك، ودخلت مع نوح زوجين زوجين"], [16, "ذكرا وأنثى دخلت، من كل ذي جسد، كما أمره الله. ثم أغلق الرب عليه باب الفلك."], [17, "ودام الطوفان أربعين يوما على الأرض، وطغت المياه ورفعت الفلك فوق الأرض،"], [18, "وتكاثرت المياه على الأرض وطغت جدا، فكان الفلك يطفو فوق المياه."], [19, "وتعاظمت المياه جدا فوق الأرض حتى أغرقت جميع الجبال العالية التي تحت السماء كلها."], [20, "وبلغ ارتفاعها خمس عشرة ذراعا (نحو سبعة أمتار) عن أعلى الجبال،"], [21, "فمات كل كائن حي يتحرك على الأرض من طيور وبهائم ووحوش وزواحف وكل بشر"], [22, "مات كل ما يحيا ويتنفس على اليابسة."], [23, "وباد من على سطح الأرض كل كائن حي سواء من الناس أم البهائم أم الزواحف أم الطيور، كلها أبيدت من الأرض، ولم يبق سوى نوح ومن معه في الفلك."], [24, "وظلت المياه طامية على الأرض مدة مئة وخمسين يوما."], [1, "ثم افتقد الله نوحا وما معه في الفلك من وحوش وبهائم، فأرسل ريحا على الأرض فتقلصت المياه"], [2, "وانسدت ينابيع اللجج وميازيب السماء، واحتبس المطر."], [3, "وتراجعت المياه عن الأرض تدريجيا. وبعد مئة وخمسين يوما نقصت المياه."], [4, "واستقر الفلك على جبال أراراط في اليوم السابع عشر من الشهر السابع للطوفان."], [5, "وظلت المياه تتناقص تدريجيا حتى الشهر العاشر. وفي اليوم الأول من الشهر العاشر بدت قمم الجبال."], [6, "وبعد أربعين يوما أخرى فتح نوح النافذة التي كان قد عملها في الفلك."], [7, "وأطلق غرابا، فخرج وظل يحوم مترددا إلى الفلك حتى جفت المياه عن الأرض."], [8, "ثم أطلق نوح حمامة من الفلك ليرى إن كانت المياه قد تقلصت عن وجه الأرض،"], [9, "ولكن الحمامة لم تجد موضعا تستقر عليه رجلها فرجعت إليه في الفلك، لأن المياه كانت مازالت تغمر سطح الأرض، فمد يده وأخذها، وأدخلها عنده إلى الفلك."], [10, "وانتظر سبعة أيام أخرى ثم عاد فأطلق الحمامة من الفلك،"], [11, "فرجعت إليه عند المساء تحمل في منقارها ورقة زيتون خضراء، فأدرك نوح أن المياه قد تناقصت عن الأرض."], [12, "فمكث سبعة أيام أخرى ثم أطلق الحمامة فلم ترجع إليه هذه المرة."], [13, "وفي اليوم الأول من الشهر الأول من السنة الواحدة والست مئة من عمر نوح، جفت المياه عن الأرض، فرفع نوح سقف الفلك وتطلع حوله، فرأى أن سطح الأرض قد أخذ في الجفاف."], [14, "ولكن الأرض لم تجف تماما إلا في اليوم السابع والعشرين من الشهر الثاني."], [15, "وخاطب الله نوحا قائلا:"], [16, "«اخرج من الفلك أنت وامرأتك وبنوك ونساء بنيك معك،"], [17, "وأخرج كل ما معك من الكائنات الحية، من طيور وبهائم وكل ما يزحف على الأرض لتتوالد وتتكاثر على الأرض»."], [18, "وخرج نوح وبنوه وامرأته وزوجات بنيه معه."], [19, "وكذلك خرجت معه كل الحيوانات، والزواحف والطيور، وكل ما يدب على الأرض، كل منها كجنسها."], [20, "وبنى نوح مذبحا للرب ثم اختار بعضا من جميع البهائم والطيور الطاهرة وقربها محرقات على المذبح."], [21, "فتقبلها الرب برضى، وقال في نفسه: «لن ألعن الأرض مرة أخرى من أجل الإنسان، لأن أهواء قلب الإنسان شريرة منذ حداثته ولن أقدم على إهلاك كل حي كما فعلت."], [22, "وتكون كل أيام الأرض مواسم زرع وحصاد وبرد وحر وصيف وشتاء ونهار وليل، لن تبطل أبدا»."]]}, {"l": "Job 22:15", "n": "", "vs": [[15, "هل تظل ملتزما بالسير في الطريق التي سلكها الأشرار؟"]]}, {"l": "Job 22:16", "n": "", "vs": [[16, "الذين قرضوا قبل أوانهم، وجرفوا من أساسهم،"]]}, {"l": "Mat 24:37-39", "n": "", "vs": [[37, "وكما كانت الحال في زمن نوح، كذلك ستكون عند رجوع ابن الإنسان:"], [38, "فقد كان الناس في الأيام السابقة للطوفان يأكلون ويشربون ويتزوجون ويزوجون، حتى فاجأهم اليوم الذي دخل فيه نوح السفينة،"], [39, "ونزل الطوفان وهم لاهون فأخذ الجميع. هكذا ستكون الحال عند رجوع ابن الإنسان:"]]}, {"l": "Luk 17:26", "n": "", "vs": [[26, "وكما حدث في زمان نوح، هكذا أيضا سوف يحدث في زمان ابن الإنسان:"]]}, {"l": "Luk 17:27", "n": "", "vs": [[27, "كان الناس يأكلون ويشربون ويتزوجون ويزوجون، إلى اليوم الذي فيه دخل نوح السفينة وجاء الطوفان فأهلك الجميع."]]}, {"l": "Heb 11:7", "n": "", "vs": [[7, "وبالإيمان نوح، لما أنذره الله عن طريق الوحي بالطوفان الآتي، دفعه خوف الله إلى بناء سفينة ضخمة كانت وسيلة النجاة له ولعائلته، مع أنه لم يكن قد رأى طوفانا من قبل. وبعمله هذا، حكم على العالم وأصبح وارثا للبر القائم على أساس الإيمان."]]}], "kwAr": "لم يشفق على العالم القديم", "noteAr": ""}, {"kw": "the eighth", "raw": "Gen. 7:1-24; 1Pe_3:20", "note": "", "refs": [{"l": "Gen 7:1-24", "n": "", "vs": [[1, "وقال الرب لنوح: «هيا ادخل أنت وأهل بيتك جميعا إلى الفلك لأني وجدتك وحدك صالحا أمامي في هذا الجيل."], [2, "خذ معك من كل نوع من الحيوانات الطاهرة سبعة ذكور وسبع إناث، وزوجين ذكرا وأنثى من كل نوع من الحيوانات الأخرى غير الطاهرة."], [3, "وخذ معك أيضا من كل نوع من الطيور سبعة ذكور وسبع إناث لاستبقاء نسلها على وجه كل الأرض."], [4, "فإني بعد سبعة أيام أمطر على الأرض أربعين يوما، ليلا ونهارا، فأمحو عن وجه الأرض كل مخلوق حي»."], [5, "وفعل نوح بموجب كل ما أمره الرب به."], [6, "وكان عمر نوح ست مئة سنة عندما حدث طوفان الماء على الأرض."], [7, "فدخل نوح إلى الفلك مع زوجته وأبنائه وزوجاتهم (لينجوا) من مياه الطوفان."], [8, "وكذلك الحيوانات الطاهرة وغير الطاهرة، والطيور والزواحف،"], [9, "دخلت مع نوح إلى الفلك زوجين زوجين، ذكرا وأنثى، كما أمر الله نوحا."], [10, "وما إن انقضت الأيام السبعة حتى فاضت المياه على الأرض"], [11, "ففي سنة ست مئة من عمر نوح، في الشهر الثاني، في اليوم السابع عشر منه، تفجرت المياه من اللجج العميقة في باطن الأرض، وهطلت أمطار السماء الغزيرة،"], [12, "واستمر هذا الطوفان على الأرض ليلا ونهارا مدة أربعين يوما."], [13, "في ذلك اليوم الذي بدأ فيه الطوفان دخل نوح وزوجته وأبناؤه سام وحام ويافث وزوجاتهم الثلاث إلى الفلك."], [14, "ودخل معهم أيضا من الوحوش والبهائم والزواحف والطيور وذوات الأجنحة كل حسب أصنافها؛"], [15, "من جميع المخلوقات الحية أقبلت إلى الفلك، ودخلت مع نوح زوجين زوجين"], [16, "ذكرا وأنثى دخلت، من كل ذي جسد، كما أمره الله. ثم أغلق الرب عليه باب الفلك."], [17, "ودام الطوفان أربعين يوما على الأرض، وطغت المياه ورفعت الفلك فوق الأرض،"], [18, "وتكاثرت المياه على الأرض وطغت جدا، فكان الفلك يطفو فوق المياه."], [19, "وتعاظمت المياه جدا فوق الأرض حتى أغرقت جميع الجبال العالية التي تحت السماء كلها."], [20, "وبلغ ارتفاعها خمس عشرة ذراعا (نحو سبعة أمتار) عن أعلى الجبال،"], [21, "فمات كل كائن حي يتحرك على الأرض من طيور وبهائم ووحوش وزواحف وكل بشر"], [22, "مات كل ما يحيا ويتنفس على اليابسة."], [23, "وباد من على سطح الأرض كل كائن حي سواء من الناس أم البهائم أم الزواحف أم الطيور، كلها أبيدت من الأرض، ولم يبق سوى نوح ومن معه في الفلك."], [24, "وظلت المياه طامية على الأرض مدة مئة وخمسين يوما."]]}, {"l": "1Pe 3:20", "n": "", "vs": [[20, "وذلك بعدما رفضوا البشارة في أيام نوح، عندما كان الله يتأنى صابرا طوال المدة التي كان نوح يبني فيها السفينة، التي نجا بها عدد قليل من الناس عبر الماء، ثمانية أشخاص فقط!"]]}], "kwAr": "واحدا من ثمانية", "noteAr": ""}, {"kw": "a preacher", "raw": "1Pe_3:19; Jud_1:14, Jud_1:15", "note": "", "refs": [{"l": "1Pe 3:19", "n": "", "vs": [[19, "بهذا الروح نفسه، ذهب قديما وبشر الناس الذين أصبحت أرواحهم الآن في السجن."]]}, {"l": "Jud 1:14", "n": "", "vs": [[14, "عن هؤلاء وأمثالهم، تنبأ أخنوخ السابع بعد آدم، فقال: «انظروا إن الرب آت بصحبة عشرات الألوف من قديسيه،"]]}, {"l": "Jud 1:15", "n": "", "vs": [[15, "ليدين جميع الناس، ويوبخ جميع الأشرار الذين لا يهابون الله ، بسبب جميع أعمالهم الشريرة التي ارتكبوها وجميع أقوالهم القاسية التي أهانوه بها والتي لا تصدر إلا عن الخاطئين الأشرار غير الأتقياء!»"]]}], "kwAr": "المنادي ببر الله", "noteAr": ""}, {"kw": "bringing", "raw": "2Pe_3:6", "note": "", "refs": [{"l": "2Pe 3:6", "n": "", "vs": [[6, "وبكلمة منه أيضا، دمر العالم الذي كان موجودا في ذلك الزمان، إذ فاض الماء عليه."]]}], "kwAr": "أحدث الطوفان", "noteAr": ""}], "arS": [["كذلك لم ", []], ["يشفق", ["G5339"]], [" على ", []], ["العالم", ["G2889"]], [" ", []], ["القديم", ["G744"]], [" عندما أحدث ", []], ["الطوفان", ["G2627"]], [" على عالم ", []], ["الفاجرين", ["G765"]], ["، إلا أنه ", []], ["حفظ", ["G5442"]], [" ", []], ["نوحا", ["G3575"]], [" ", []], ["المنادي", ["G2783"]], [" ", []], ["ببر", ["G1343"]], [" الله وعدله. وكان نوح واحدا من ", []], ["ثمانية", ["G3590"]], [" أشخاص نجوا من الطوفان.", []]]}, {"c": 2, "v": 6, "text": "وإذ حكم الله على مدينتي سدوم وعمورة بالخراب، حولهما إلى رماد، جاعلا منهما عبرة للذين يعيشون حياة فاجرة.", "groups": [{"kw": "turning", "raw": "Gen_19:24, Gen_19:25, Gen_19:28; Deu_29:23; Isa_13:19; Jer_50:40; Eze_16:49-56; Hos_11:8; Amo_4:11; Zep_2:9; Luk_17:28-30; Jud_1:7", "note": "", "refs": [{"l": "Gen 19:24", "n": "", "vs": [[24, "فأمطر الرب على سدوم وعمورة كبريتا ونارا، من عنده من السماء."]]}, {"l": "Gen 19:25", "n": "", "vs": [[25, "وقلب تلك المدن والساكنين فيها، والسهل المحيط بها وكل مزروعات الأرض."]]}, {"l": "Gen 19:28", "n": "", "vs": [[28, "وتطلع نحو سدوم وعمورة ولسائر أرض السهل، فأبصر الدخان يتصاعد منها كالأتون."]]}, {"l": "Deu 29:23", "n": "", "vs": [[23, "إذ تصبح جميع الأرض كبريتا، محترقة لا زرع فيها ولا نبات ولا عشب، وكأنها انقلبت كما جرى لسدوم وعمورة وأدمة وصبوييم، التي قلبها الرب من جراء غضبه وسخطه."]]}, {"l": "Isa 13:19", "n": "", "vs": [[19, "أما بابل، مجد الممالك وبهاء وفخر الكلدانيين، فتصبح كسدوم وعمورة اللتين قلبهما الله ."]]}, {"l": "Jer 50:40", "n": "", "vs": [[40, "وكما قلب الله سدوم وعمورة وما جاورهما، هكذا لن يسكن فيها أحد أو يقيم فيها إنسان."]]}, {"l": "Eze 16:49-56", "n": "", "vs": [[49, "أما إثم أختك سدوم، فإنها مع بناتها طغت عليها الغطرسة والتخمة وسلام الاطمئنان، ولم تغث الفقير والمسكين."], [50, "وتشامخن وارتكبن الرجس أمامي، فمحوتهن عندما شاهدت ذلك."], [51, "ولم تخطيء السامرة نصف خطاياك، بل كنت أكثر رجاسات منهن، فجعلت أختيك تبدوان أكثر صلاحا منك، من جراء جميع رجاساتك التي اقترفتها"], [52, "فاحملي أنت أيضا عارك، إذ جعلت القضاء في صالح أختيك لفرط معاصيك التي تفوقت بها على رجاستهن. قد أصبحن أكثر برا منك، فاخزي واحملي عارك إذ قد بررت أخواتك."], [53, "ولكني سأرد سبيهن: سبي سدوم وبناتها، وسبي السامرة وبناتها، وسبي مسبي اعلا منهما عبرة", "noteAr": ""}], "arS": [["وإذ ", []], ["حكم", ["G2632"]], [" الله على ", []], ["مدينتي", ["G4172"]], [" ", []], ["سدوم", ["G4670"]], [" ", []], ["وعمورة", ["G1116"]], [" ", []], ["بالخراب", ["G2692"]], ["، حولهما إلى ", []], ["رماد", ["G5077"]], ["، ", []], ["جاعلا", ["G5087"]], [" منهما ", []], ["عبرة", ["G5262"]], [" للذين ", []], ["يعيشون حياة فاجرة", ["G764"]], [".", []]]}, {"c": 2, "v": 7, "text": "ولكنه أنقذ لوطا البار، الذي كان متضايقا جدا من سلوك أشرار زمانه في الدعارة.", "groups": [{"kw": "delivered", "raw": "Gen_19:16, Gen_19:22, Gen_19:29; 1Co_10:13", "note": "", "refs": [{"l": "Gen 19:16", "n": "", "vs": [[16, "وإذ توانى لوط، أمسك الرجلان بيده وأيدي زوجته وابنتيه وقاداهم إلى خارج المدينة، لأن الرب أشفق عليهم."]]}, {"l": "Gen 19:22", "n": "", "vs": [[22, "أسرع، واهرب إليها، لأنني لا أستطيع أن أصنع شيئا إلى أن تبلغها». لذلك دعي اسم تلك المدينة صوغر (ومعناها صغير ة)."]]}, {"l": "Gen 19:29", "n": "", "vs": [[29, "وهكذا عندما دمر الله مدن السهل ذكر إبراهيم، فأخرج لوطا قبيل وقوع الكارثة حين قلب المدن التي قطن فيها لوط."]]}, {"l": "1Co 10:13", "n": "", "vs": [[13, "لم يصبكم من التجارب إلا ما هو بشري. ولكن الله أمين وجدير بالثقة، فلا يدعكم تجربون فوق ما تطيقون، بل يدبر لكم مع التجربة سبيل الخروج منها لتطيقوا احتمالها."]]}], "kwAr": "أنقذ لوطا البار", "noteAr": ""}, {"kw": "vexed", "raw": "Gen_13:13, Gen_19:7, Gen_19:8; Psa_120:5; Jer_9:1-6, Jer_23:9", "note": "", "refs": [{"l": "Gen 13:13", "n": "", "vs": [[13, "وكان أهل سدوم متورطين في الشر وخاطئين جدا لدى الرب."]]}, {"l": "Gen 19:7", "n": "", "vs": [[7, "وقال: «لا ترتكبوا شرا ياإخوتي."]]}, {"l": "Gen 19:8", "n": "", "vs": [[8, "هوذا لي ابنتان عذراوان أخرجهما إليكم فافعلوا بهما ما يحلو لكم، أما هذان الرجلان فلا تسيئوا إليهما لأنهما لجآ إلى حمى منزلي»."]]}, {"l": "Psa 120:5", "n": "", "vs": [[5, "ويلي لأني تغربت في ماشك، وسكنت في خيام قيدار."]]}, {"l": "Jer 9:1-6", "n": "", "vs": [[1, "ياليت رأسي فيض مياه، وعيني ينبوع دموع، فأبكي نهارا وليلا قتلى بنت شعبي"], [2, "ياليت لي في الصحراء مبيت عابر سبيل، فأهجر شعبي وأنطلق بعيدا عنهم، لأنهم جميعا زناة وجماعة خونة."], [3, "«قد وتروا ألسنتهم كقسي جاهزة ليطلقوا الأكاذيب التي تقولوا بها في الأرض من دون الحق، إذ أنهم انتهوا من شر إلى شر، وإياي لم يعرفوا» يقول الرب."], [4, "«ليحترس كل واحد من جاره، ولا يثق بأحد من أقربائه، لأن كل قريب مخادع، وكل صاحب واش."], [5, "كل واحد منهم يخدع جاره ولا ينطقون بالصدق. دربوا ألسنتهم على قول الكذب، وأرهقوا أنفسهم في ارتكاب الإثم."], [6, "يجمعون ظلما فوق ظلم، وخداعا على خداع، وأبوا أن يعرفوني»."]]}, {"l": "Jer 23:9", "n": "", "vs": [[9, "ثم تكلم إرميا عن الأنبياء الكذبة فقال: «إن قلبي منكسر في داخلي، وجميع عظامي ترتجف، فأنا بتأثير الرب وبفعل كلامه المقدس كرجل سكران غلبت عليه الخمر"]]}], "kwAr": "متضايقا جدا", "noteAr": ""}], "arS": [["ولكنه ", []], ["أنقذ", ["G4506"]], [" ", []], ["لوطا", ["G3091"]], [" ", []], ["البار", ["G1342"]], ["، الذي كان ", []], ["متضايقا", ["G2669"]], [" جدا من ", []], ["سلوك", ["G391"]], [" ", []], ["أشرار", ["G113"]], [" زمانه في ", []], ["الدعارة", ["G766"]], [".", []]]}, {"c": 2, "v": 8, "text": "فإذ كان ساكنا بينهم، وهو رجل بار، كانت نفسه الزكية تتألم يوميا من جرائمهم التي كان يراها أو يسمع بها.", "groups": [{"kw": "that", "raw": "Pro_25:26, Pro_28:12; 1Ti_1:9; Jam_5:16", "note": "", "refs": [{"l": "Pro 25:26", "n": "", "vs": [[26, "الصديق المتخاذل أمام الشرير هو عين عكرة وينبوع فاسد."]]}, {"l": "Pro 28:12", "n": "", "vs": [[12, "عندما يظفر الصديق يشيع الفخر العظيم، لكن حين يتسلط الأشرار يتوارى الناس."]]}, {"l": "1Ti 1:9", "n": "", "vs": [[9, "إذ ندرك أن الشريعة لا تطبق على من كان بارا، بل على الأشرار والمتمردين، على الفاجرين والخاطئين، والنجسين والدنسين، وقاتلي آبائهم وأمهاتهم، وقاتلي الناس،"]]}, {"l": "Jam 5:16", "n": "", "vs": [[16, "ليعترف كل واحد منكم لأخيه بزلاته، وصلوا بعضكم لأجل بعض، حتى تشفوا. إن الصلاة الحارة التي يرفعها البار لها فعالية عظيمة."]]}], "kwAr": "رجل بار", "noteAr": ""}, {"kw": "in seeing", "raw": "Psa_119:136, Psa_119:139, Psa_119:158; Eze_9:4, Eze_9:6; Mal_3:15-17", "note": "", "refs": [{"l": "Psa 119:136", "n": "", "vs": [[136, "فاضت من عيني ينابيع دمع، لأنهم لم يراعوا شريعتك."]]}, {"l": "Psa 119:139", "n": "", "vs": [[139, "أتميز غيرة في داخلي، لأن أعدائي تغاضوا عن كلامك."]]}, {"l": "Psa 119:158", "n": "", "vs": [[158, "نظرت إلى الغادرين شزرا، لأنهم لم يطيعوا كلمتك."]]}, {"l": "Eze 9:4", "n": "", "vs": [[4, "وقال له الرب: «اجتز وسط مدينة أورشليم وارسم سمة على جباه الرجال الذين يئنون ويزفرون على كل ما ارتكب من أرجاس فيها»."]]}, {"l": "Eze 9:6", "n": "", "vs": [[6, "أهلكوا الشيخ والشاب والعذراء والطفل والنساء. ولكن لا تقربوا من أي إنسان عليه السمة، وابتدئوا من مقدسي». فابتدأوا يهلكون الرجال والشيوخ الموجودين أمام الهيكل."]]}, {"l": "Mal 3:15-17", "n": "", "vs": [[15, "وها نحن الآن نغبط المستكبرين، ونرى فاعلي الشر يزدهرون، بل إنهم تحدوا الله ونجوا."], [16, "ثم حدث خائفو الرب بعضهم بعضا. فأصغى الرب إلى كلامهم وسمعهم، فتم تدوين أسماء متقي الرب والمتأملين باسمه أمامه في كتاب تذكرة، ورد فيه:"], [17, "سيكونون لي، يقول الرب القدير، في اليوم الذي أصنع فيه نفائسي، وأحافظ عليهم كما يحافظ الوالد على ابنه الذي يخدمه."]]}], "kwAr": "يراها أو يسمع بها", "noteAr": ""}], "arS": [["فإذ كان ", []], ["ساكنا", ["G1460"]], [" بينهم، وهو رجل ", []], ["بار", ["G1342"]], ["، كانت ", []], ["نفسه", ["G5590"]], [" ", []], ["الزكية", ["G1342"]], [" ", []], ["تتألم", ["G928"]], [" ", []], ["يوميا", ["G2250"]], [" من ", []], ["جرائمهم", ["G459"]], [" التي كان ", []], ["يراها", ["G990"]], [" أو ", []], ["يسمع", ["G189"]], [" بها.", []]]}, {"c": 2, "v": 9, "text": "وهكذا نرى أن الرب يعرف أن ينقذ الأتقياء من المحنة، ويحفظ الأشرار محبوسين ليحكم عليهم بالعقاب في يوم الدينونة.", "groups": [{"kw": "knoweth", "raw": "Job_5:19; Psa_34:15-19; 1Co_10:13", "note": "", "refs": [{"l": "Job 5:19", "n": "", "vs": [[19, "من ست بلايا ينجيك، وفي سبع لا يقع بك أذى."]]}, {"l": "Psa 34:15-19", "n": "", "vs": [[15, "لأن الرب يرعى الأبرار بعنايته ويستجيب إلى دعائهم."], [16, "ولكن يقف ضد الذين يعملون الشر ليستأصل من الأرض ذكرهم."], [17, "يستغيث الأبرار، فيسمع لهم الرب وينقذهم من جميع ضيقاتهم."], [18, "الرب قريب من كسيري القلب، ويخلص مسحوقي الروح."], [19, "ما أكثر مصائب الصديق، ولكن من جميعها ينقذه الرب."]]}, {"l": "1Co 10:13", "n": "", "vs": [[13, "لم يصبكم من التجارب إلا ما هو بشري. ولكن الله أمين وجدير بالثقة، فلا يدعكم تجربون فوق ما تطيقون، بل يدبر لكم مع التجربة سبيل الخروج منها لتطيقوا احتمالها."]]}], "kwAr": "يعرف أن ينقذ", "noteAr": ""}, {"kw": "the godly", "raw": "Psa_4:3, Psa_12:1, Psa_32:6; 2Ti_3:12; Tit_2:14", "note": "", "refs": [{"l": "Psa 4:3", "n": "", "vs": [[3, "اعلموا أن الرب قد ميز لنفسه تقيه؛ الرب يسمع عندما أدعوه."]]}, {"l": "Psa 12:1", "n": "", "vs": [[1, "أغث يارب لأنه قد انقرض التقي، واختفى الأمناء من بين بني البشر."]]}, {"l": "Psa 32:6", "n": "", "vs": [[6, "لهذا ليعترف لك كل تقي بخطاياه وقتما يجدك فلاَ تبلغ إليه سيول التجارب الطامية."]]}, {"l": "2Ti 3:12", "n": "", "vs": [[12, "وحقا، إن جميع الذين يعزمون أن يعيشوا عيشة التقوى في المسيح يسوع يضطهدون."]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}], "kwAr": "الأتقياء", "noteAr": ""}, {"kw": "and", "raw": "2Pe_2:4; Job_21:30; Pro_16:4; Jud_1:14, Jud_1:15", "note": "", "refs": [{"l": "2Pe 2:4", "n": "", "vs": [[4, "فإن الله لم يشفق على الملائكة الذين أخطأوا، بل طرحهم في أعماق هاوية الظلام مقيدين بالسلاسل، حيث يظلون محبوسين إلى يوم الحساب."]]}, {"l": "Job 21:30", "n": "", "vs": [[30, "إن الشرير قد أفلت من يوم البوار، ونجا من العقاب في يوم الغضب."]]}, {"l": "Pro 16:4", "n": "", "vs": [[4, "لكل شيء صنعه الرب غرض في ذاته، حتى الشرير ليوم الضيق."]]}, {"l": "Jud 1:14", "n": "", "vs": [[14, "عن هؤلاء وأمثالهم، تنبأ أخنوخ السابع بعد آدم، فقال: «انظروا إن الرب آت بصحبة عشرات الألوف من قديسيه،"]]}, {"l": "Jud 1:15", "n": "", "vs": [[15, "ليدين جميع الناس، ويوبخ جميع الأشرار الذين لا يهابون الله ، بسبب جميع أعمالهم الشريرة التي ارتكبوها وجميع أقوالهم القاسية التي أهانوه بها والتي لا تصدر إلا عن الخاطئين الأشرار غير الأتقياء!»"]]}], "kwAr": "ويحفظ الأشرار", "noteAr": ""}, {"kw": "unto", "raw": "2Pe_3:7; Rom_2:5; 2Co_5:10,2Co_5:11", "note": "", "refs": [{"l": "2Pe 3:7", "n": "", "vs": [[7, "أما السماوات والأرض الحالية، فستبقى مخزونة ومحفوظة للنار بتلك الكلمة عينها إلى يوم الدينونة وهلاك الفاجرين!"]]}, {"l": "Rom 2:5", "n": "", "vs": [[5, "ولكنك بسبب قساوتك وقلبك غير التائب، تخزن لنفسك غضبا ليوم الغضب، يوم تعلن دينونة الله العادلة."]]}, {"l": "2Co 5:10", "n": "", "vs": [[10, "إذ لابد أن نقف جميعا مكشوفين أمام عرش المسيح، لينال كل واحد منا استحقاق ما عمله حين كان في الجسد، أصالحا كان أم رديئا!"]]}, {"l": "2Co 5:11", "n": "", "vs": [[11, "فبدافع وعينا لرهبة الرب، نحاول إقناع الناس. ولكننا ظاهرون أمام الله، وأرجو أن نكون ظاهرين أيضا في ضمائركم."]]}], "kwAr": "يوم الدينونة", "noteAr": ""}], "arS": [["وهكذا نرى أن ", []], ["الرب", ["G2962"]], [" ", []], ["يعرف", ["G1492"]], [" أن ", []], ["ينقذ", ["G4506"]], [" ", []], ["الأتقياء", ["G2152"]], [" من ", []], ["المحنة", ["G3986"]], ["، ", []], ["ويحفظ", ["G5083"]], [" ", []], ["الأشرار", ["G94"]], [" محبوسين ليحكم عليهم ", []], ["بالعقاب", ["G2849"]], [" في ", []], ["يوم", ["G2250"]], [" ", []], ["الدينونة", ["G2920"]], [".", []]]}, {"c": 2, "v": 10, "text": "وما أشد العقاب، وبخاصة على الذين ينجرفون وراء الميول الجسدية، مستجيبين لشهوة النجاسة، ومحتقرين سيادة الله! ثم إنهم وقحون، معجبون بأنفسهم، لا يخافون أن يتكلموا بالشتم والإهانة على أصحاب الأمجاد.", "groups": [{"kw": "that", "raw": "Rom_8:1, Rom_8:4, Rom_8:5, Rom_8:12, Rom_8:13; 2Co_10:3; Heb_13:4", "note": "", "refs": [{"l": "Rom 8:1", "n": "", "vs": [[1, "فالآن إذا ليس على الذين في المسيح يسوع أية دينونة بعد."]]}, {"l": "Rom 8:4", "n": "", "vs": [[4, "حتى يتم فينا البر الذي تسعى إليه الشريعة، فينا نحن السالكين لا بحسب الجسد بل بحسب الروح."]]}, {"l": "Rom 8:5", "n": "", "vs": [[5, "فإن الذين هم بحسب الجسد يهتمون بأمور الجسد، والذين هم بحسب الروح يهتمون بأمور الروح."]]}, {"l": "Rom 8:12", "n": "", "vs": [[12, "فليس علينا إذن، أيها الإخوة، أي التزام نحو الجسد لنعيش بحسب الجسد."]]}, {"l": "Rom 8:13", "n": "", "vs": [[13, "لأنه إن عشتم بحسب الجسد، فإنكم ستموتون، ولكن إن كنتم بالروح تميتون أعمال الجسد، فستحيون."]]}, {"l": "2Co 10:3", "n": "", "vs": [[3, "فمع أننا نعيش في الجسد، فإننا لا نحارب وفقا للجسد."]]}, {"l": "Heb 13:4", "n": "", "vs": [[4, "حافظوا جميعا على كرامة الزواج، مبعدين النجاسة عن الفراش. فإن الله سوف يعاقب الذين ينغمسون في خطايا الدعارة والزنى."]]}], "kwAr": "الذين ينجرفون", "noteAr": ""}, {"kw": "in the", "raw": "Rom_1:24-27; 1Co_6:9; Eph_4:19, Eph_5:5; Col_3:5; 1Th_4:7; Jud_1:4, Jud_1:6-8, Jud_1:10,Jud_1:16", "note": "", "refs": [{"l": "Rom 1:24-27", "n": "", "vs": [[24, "لذلك أسلمهم الله ، في شهوات قلوبهم، إلى النجاسة، ليهينوا أجسادهم فيما بينهم."], [25, "إذ قد استبدلوا بحق الله ما هو باطل، فاتقوا المخلوق وعبدوه بدل الخالق، المبارك إلى الأبد. آمين!"], [26, "لهذا السبب أسلمهم الله إلى الشهوات المخزية. فإن إناثهم تحولن عن استعمال أجسادهن بالطريقة الطبيعية إلى استعمالها بطريقة مخالفة للطبيعة."], [27, "وكذلك تحول الذكور أيضا عن استعمال الأنثى بالطريقة الطبيعية، والتهبوا شهوة بعضهم لبعض، مرتكبين الفحشاء ذكورا بذكور، فاستحقوا أن ينالوا في أنفسهم الجزاء العادل على ضلالهم."]]}, {"l": "1Co 6:9", "n": "", "vs": [[9, "أما تعلمون أن الظالمين لن يرثوا ملكوت الله؟ لا تضلوا: فإن ملكوت الله لن يرثه الزناة ولا عابدو الأصنام ولا الفاسقون ولا المتخنثون ولا مضاجعو الذكور"]]}, {"l": "Eph 4:19", "n": "", "vs": [[19, "فهؤلاء، إذ طرحوا جانبا كل إحساس، استسلموا للإباحية ليرتكبوا كل نجاسة بشهوة نهمة لا ترتوي."]]}, {"l": "Eph 5:5", "n": "", "vs": [[5, "فإنكم تعلمون هذا جيدا: أن كل زان أو نجس أو صاحب شهوة نهمة، ما هو إلا عابد أصنام، ليس له ميراث في ملكوت المسيح والله."]]}, {"l": "Col 3:5", "n": "", "vs": [[5, "فأميتوا إذن أعضاءكم الأرضية: الزنى، النجاسة، جموح العاطفة، الشهوة الرديئة، والاشتهاء النهم الذي هو عبادة أصنام."]]}, {"l": "1Th 4:7", "n": "", "vs": [[7, "فإن الله دعانا لا إلى النجاسة بل (إلى العيش( في القداسة."]]}, {"l": "Jud 1:4", "n": "", "vs": [[4, "لأنه قد تسلل إلى ما بينكم معلمون لابد أن يلاقوا الحكم بالعقاب الأبدي، كما هو مكتوب لهم منذ القديم. فهم أشرار لا يهابون الله ، يتخذون من نعمة إلهنا فرصة لإباحة الرذائل، وينكرون سيدنا وربنا الوحيد يسوع المسيح."]]}, {"l": "Jud 1:6-8", "n": "", "vs": [[6, "وأما الملائكة الذين لم يحافظوا على مقامهم الرفيع، بل تركوا مركزهم، فمازال الرب يحفظهم مقيدين بسلاسل أبدية في أعماق الظلام، بانتظار دينونة ذلك اليوم العظيم."], [7, "وتعرفون كذلك ما فعله الرب بمدينتي سدوم وعمورة وبالمدن التي حولهما. فقد كان أهل هذه المدن، مثل أولئك المعلمين، مندفعين وراء الزنى، ومنغمسين في شهوات مخالفة للطبيعة. لذلك عاقب الرب هذه المدن بالنار الأبدية، فدمرها. فكانت بذلك عبرة للآخرين."], [8, "ومع ذلك، فإن أولئك المعلمين المتوهمين يسيرون في الطريق التي سار فيها أهل تلك المدن. إذ يلوثون أجسادهم بالنجاسة، ويحتقرون السيادة الإلهية، ويتكلمون بالإهانة على الكائنات المجيدة!"]]}, {"l": "Jud 1:10", "n": "", "vs": [[10, "ولكن هؤلاء المعلمين يتكلمون كلاما مهينا على أمور لا يعرفونها. وأما ما يفهمونه بالغريزة، كالحيوانات غير العاقلة، فإنهم به يدمرون أنفسهم."]]}, {"l": "Jud 1:16", "n": "", "vs": [[16, "وهؤلاء المعلمون يتذمرون ويشكون دائما وفيما هم يندفعون وراء شهواتهم، يطلقون ألسنتهم متحدثين بأمور طنانة، ويمدحون من يعجبهم طلبا للمنفعة!"]]}], "kwAr": "لشهوة النجاسة", "noteAr": ""}, {"kw": "despise", "raw": "Num_16:12-15; Deu_17:12, Deu_17:13, Deu_21:20,Deu_21:21; 1Sa_10:27; 2Sa_20:1; 1Ki_12:16; Psa_2:1-5, Psa_12:4; Jer_2:31; Luk_19:14; Rom_13:1-5; 1Pe_2:13, 1Pe_2:14", "note": "", "refs": [{"l": "Num 16:12-15", "n": "", "vs": [[12, "فأرسل موسى يستدعي داثان وأبيرام ابني أليآب، فردا: «لن نحضر!"], [13, "ألم يكفك أنك أخرجتنا من أرض تدر لبنا وعسلا لتهلكنا في الصحراء، ثم تترَأس علينا؟"], [14, "فأنت لم تقدنا إلى أرض تفيض خيرات، ولا أورثتنا حقولا وكروما. فمن تحاول أن تخدع؟ إننا لن نحضر!»"], [15, "فاحتدم غيظ موسى وقال للرب: «لا تقبل تقدمتهما، فأنا لم آخذ حتى حمارا واحدا منهما، ولم أسيء إلى أحد منهما»."]]}, {"l": "Deu 17:12", "n": "", "vs": [[12, "ومن يرفض متمردا تنفيذ حكم الكاهن الماثل هناك لخدمة الرب إلهكم، أو القاضي، فإنه يقتل. وبذلك يستأصل الشر من إسرائيل."]]}, {"l": "Deu 17:13", "n": "", "vs": [[13, "فيشيع الخبر بين جميع الشعب فيخافون ولا يتمردون بعد."]]}, {"l": "Deu 21:20", "n": "", "vs": [[20, "ويقولان للشيوخ: ابننا هذا عنيد متمرد، لا يطيع قولنا، وهو مبذر سكير."]]}, {"l": "Deu 21:21", "n": "", "vs": [[21, "فيرجمه رجال المدينة جميعهم بالحجارة حتى يموت. وهكذا تستأصلون الشر من بينكم ويشيع الخبر بين الشعب كله فيخاف."]]}, {"l": "1Sa 10:27", "n": "", "vs": [[27, "غير أن فئة من الغوغاء قالوا: «كيف ينقذنا هذا؟» فاحتقروه ولم يقدموا له هدايا. أما شاول فاعتصم بالصمت."]]}, {"l": "2Sa 20:1", "n": "", "vs": [[1, "وحدث أن كان هناك رجل لئيم يدعى شبع بن بكري من سبط بنيامين، فنفخ هذا بالبوق وقال: «ليس لنا نصيب في داود ولا قسم في ابن يسى، فليرجع كل رجل إلى خيمته ياإسرائيل»."]]}, {"l": "1Ki 12:16", "n": "", "vs": [[16, "فلما رأى كل بني إسرائيل أن الملك لم يستجب لمطالبهم، أجابوه: «أي نصيب لنا في داود، وأي حظ لنا بابن يسى؟ فإلى بيوتك ياإسرائيل. وليملك رحبعام على أهله وعشيرته». وانصرف الإسرائيليون عنه إلى منازلهم."]]}, {"l": "Psa 2:1-5", "n": "", "vs": [[1, "لماذا ضجت الأمم؟ ولماذا تتآمر الشعوب باطلاَ؟"], [2, "اجتمع ملوك الأرض ورؤساؤها، وتحالفوا ليقاوموا الرب ومسيحه، قائلين:"], [3, "«لنحطم عنا قيودهما، ونتحرر من نير عبوديتهما»."], [4, "لكن الجالس على عرشه في السماوات يضحك. الرب يستهزيء بهم."], [5, "عندئذ ينذرهم في حمو غضبه، ويروعهم بشدة سخطه،"]]}, {"l": "Psa 12:4", "n": "", "vs": [[4, "الذين قالوا: ألسنتنا لنا وبها نسود. فمن يتحكم فينا؟"]]}, {"l": "Jer 2:31", "n": "", "vs": [[31, "وأنت أيها الجيل، اسمع قضاء الرب: أكنت صحراء لإسرائيل أو أرض ظلام دامس؟ إذا لماذا يقول شعبي: نحن طليقون نسعى حيث شئنا، ولن نقبل إليك بعد؟"]]}, {"l": "Luk 19:14", "n": "", "vs": [[14, "ولكن أهل بلده كانوا يبغضونه، فأرسلوا في إثره وفدا، قائلين: لا نريد أن يملك هذا علينا!"]]}, {"l": "Rom 13:1-5", "n": "", "vs": [[1, "على كل نفس أن تخضع للسلطات الحاكمة. فلا سلطة إلا من عند الله، والسلطات القائمة مرتبة من قبل الله."], [2, "حتى إن من يقاوم السلطة، يقاوم ترتيب الله، والمقاومون سيجلبون العقاب على أنفسهم."], [3, "فإن الحكام لا يخافهم من يفعل الصلاح بل من يفعل الشر. أفترغب إذن في أن تكون غير خائف من السلطة؟ اعمل ما هو صالح، فتكون ممدوحا عندها،"], [4, "لأنها خادمة الله لك لأجل الخير. أما إن كنت تعمل الشر فخف، لأن السلطة لا تحمل السيف عبثا، إذ إنها خادمة الله، وهي التي تنتقم لغضبه ممن يفعل الشر."], [5, "ولذلك، فمن الضروري أن تخضعوا، لا اتقاء للغضب فقط، بل مراعاة للضمير أيضا."]]}, {"l": "1Pe 2:13", "n": "", "vs": [[13, "فإكراما للرب، اخضعوا لكل نظام يدير شؤون الناس: للملك، باعتباره صاحب السلطة العليا،"]]}, {"l": "1Pe 2:14", "n": "", "vs": [[14, "وللحكام، باعتبارهم ممثلي الملك الذين يعاقبون المذنبين ويمدحون الصالحين."]]}], "kwAr": "محتقرين", "noteAr": ""}, {"kw": "government", "raw": "or, dominion", "note": "or, dominion", "refs": [], "kwAr": "سيادة", "noteAr": "أو: سيادة."}, {"kw": "Presumptuous", "raw": "Num_15:30; Jud_1:8", "note": "", "refs": [{"l": "Num 15:30", "n": "", "vs": [[30, "أما إن تعمد أحد الخطأ، سواء كان من الإسرائيليين أم من الغرباء، فهو يزدري بي ويجب أن يستأصل من بين شعبه،"]]}, {"l": "Jud 1:8", "n": "", "vs": [[8, "ومع ذلك، فإن أولئك المعلمين المتوهمين يسيرون في الطريق التي سار فيها أهل تلك المدن. إذ يلوثون أجسادهم بالنجاسة، ويحتقرون السيادة الإلهية، ويتكلمون بالإهانة على الكائنات المجيدة!"]]}], "kwAr": "وقحون", "noteAr": ""}, {"kw": "selfwilled", "raw": "Gen_49:6; Tit_1:7", "note": "", "refs": [{"l": "Gen 49:6", "n": "", "vs": [[6, "فيانفسي لا تدخلي في مجلسهما، وياروحي لا تنضمي إلى مجمعهما."]]}, {"l": "Tit 1:7", "n": "", "vs": [[7, "وذلك لأن الناظر يجب أن يكون بريئا من كل تهمة باعتباره وكيلا لله، لا معجبا بنفسه ولا حاد الطبع، ولا مدمن الخمر، ولا عنيفا، ولا ساعيا إلى المكسب الخسيس؛"]]}], "kwAr": "معجبون بأنفسهم", "noteAr": ""}, {"kw": "to speak", "raw": "Exo_22:28; Ecc_10:6, Ecc_10:7, Ecc_10:20; Act_23:5; Jud_1:8, Jud_1:10", "note": "", "refs": [{"l": "Exo 22:28", "n": "", "vs": [[28, "لا تشتم القضاة ولا تلعن رؤساء شعبك."]]}, {"l": "Ecc 10:6", "n": "", "vs": [[6, "فقد تبوأت الحماقة مراتب عالية، أما الأغنياء فقد احتلوا مقامات دنية."]]}, {"l": "Ecc 10:7", "n": "", "vs": [[7, "وشاهدت عبيدا يمتطون صهوات الجياد، وأمراء يسيرون على الأقدام كالعبيد."]]}, {"l": "Ecc 10:20", "n": "", "vs": [[20, "لا تلعن الملك حتى في فكرك، ولا تشتم الغني في مخدعك، لأن طير السماء ينقل صوتك، وذا الجناح يبلغ الأمر."]]}, {"l": "Act 23:5", "n": "", "vs": [[5, "فأجاب بولس: «لم أكن أعرف أيها الإخوة أنه رئيس كهنة فقد جاء في الكتاب: لا تشتم رئيس شعبك!»"]]}, {"l": "Jud 1:8", "n": "", "vs": [[8, "ومع ذلك، فإن أولئك المعلمين المتوهمين يسيرون في الطريق التي سار فيها أهل تلك المدن. إذ يلوثون أجسادهم بالنجاسة، ويحتقرون السيادة الإلهية، ويتكلمون بالإهانة على الكائنات المجيدة!"]]}, {"l": "Jud 1:10", "n": "", "vs": [[10, "ولكن هؤلاء المعلمين يتكلمون كلاما مهينا على أمور لا يعرفونها. وأما ما يفهمونه بالغريزة، كالحيوانات غير العاقلة، فإنهم به يدمرون أنفسهم."]]}], "kwAr": "يتكلموا بالشتم", "noteAr": ""}], "arS": [["وما أشد العقاب، ", []], ["وبخاصة", ["G3122"]], [" على الذين ", []], ["ينجرفون", ["G4198"]], [" وراء ", []], ["الميول الجسدية", ["G4561"]], ["، مستجيبين ", []], ["لشهوة", ["G1939"]], [" ", []], ["النجاسة", ["G3394"]], ["، ", []], ["ومحتقرين", ["G2706"]], [" ", []], ["سيادة", ["G2963"]], [" الله! ثم إنهم ", []], ["وقحون", ["G5113"]], ["، ", []], ["معجبون بأنفسهم", ["G829"]], ["، لا ", []], ["يخافون", ["G5141"]], [" أن يتكلموا ", []], ["بالشتم", ["G987"]], [" والإهانة على أصحاب ", []], ["الأمجاد", ["G1391"]], [".", []]]}, {"c": 2, "v": 11, "text": "ومع ذلك، فحتى الملائكة، وهم يتفوقون عليهم في القوة والقدرة، لا يقدمون عليهم أمام الرب أية تهمة مهينة..", "groups": [{"kw": "angels", "raw": "Psa_103:20, Psa_104:4; Dan_6:22; 2Th_1:7; Jud_1:9", "note": "", "refs": [{"l": "Psa 103:20", "n": "", "vs": [[20, "باركوا الرب ياملائكته المقتدرين قوة، الفاعلين أمره فور صدور كلمته."]]}, {"l": "Psa 104:4", "n": "", "vs": [[4, "الصانع ملائكتك رياحا وخدامك لهيب نار."]]}, {"l": "Dan 6:22", "n": "", "vs": [[22, "قد أرسل إلهي ملاكه فسد أفواه الأسود فلم تؤذني، لأني وجدت بريئا أمامه، ولم أرتكب سوءا أمامك أيضا أيها الملك»."]]}, {"l": "2Th 1:7", "n": "", "vs": [[7, "وأن يكافئكم، أنتم الذين تتضايقون، كما يكافئنا نحن، بالراحة لدى ظهور الرب يسوع علنا من السماء، ومعه ملائكة قدرته،"]]}, {"l": "Jud 1:9", "n": "", "vs": [[9, "فحتى ميخائيل، وهو رئيس ملائكة، لم يجرؤ أن يحكم على إبليس بكلام مهين عندما خاصمه وتجادل معه بخصوص جثمان موسى، وإنما اكتفى بالقول له: «ليزجرك الرب!»"]]}], "kwAr": "الملائكة", "noteAr": ""}, {"kw": "against them", "raw": "Some read against themselves.", "note": "Some read against themselves.", "refs": [], "kwAr": "عليهم أية تهمة مهينة", "noteAr": "بعض النسخ تقرأ: على أنفسهم."}], "arS": [["ومع ذلك، فحتى ", []], ["الملائكة", ["G32"]], ["، وهم ", []], ["يتفوقون", ["G3187"]], [" عليهم في ", []], ["القوة", ["G2479"]], [" ", []], ["والقدرة", ["G1411"]], ["، لا ", []], ["يقدمون", ["G5342"]], [" عليهم أمام ", []], ["الرب", ["G2962"]], [" أية ", []], ["تهمة", ["G2920"]], [" ", []], ["مهينة", ["G989"]], ["..", []]]}, {"c": 2, "v": 12, "text": "حقا إن هؤلاء المعلمين الدجالين الذين يتكلمون كلاما مهينا في أمور يجهلونها، يشبهون الحيوانات المفترسة غير العاقلة، المولودة ليصطادها الناس ويقتلوها. فلابد أن يهلكوا مثلها.", "groups": [{"kw": "as natural", "raw": "Psa_49:10, Psa_92:6, Psa_94:8; Jer_4:22, Jer_5:4, Jer_10:8, Jer_10:21, Jer_12:3; Eze_21:31; Jud_1:10", "note": "", "refs": [{"l": "Psa 49:10", "n": "", "vs": [[10, "لكن الحكماء يموتون كما يموت الجاهل والغبي، تاركين ثروتهم لغيرهم."]]}, {"l": "Psa 92:6", "n": "", "vs": [[6, "لا يعرفها الغبي ولا يفهمها الجاهل."]]}, {"l": "Psa 94:8", "n": "", "vs": [[8, "افهموا ياأغبياء الشعب! ياجهال متى تتعقلون؟"]]}, {"l": "Jer 4:22", "n": "", "vs": [[22, "إن قومي حمقى لا يعرفونني. هم أبناء أغبياء مجردون من الفهم، حاذقون في ارتكاب الشر، وجهلاء في صنع الخير»."]]}, {"l": "Jer 5:4", "n": "", "vs": [[4, "فقلت في نفسي: «إنما هم مساكين حمقى، يجهلون طريق الرب وقضاء إلههم."]]}, {"l": "Jer 10:8", "n": "", "vs": [[8, "جميعهم بلداء وحمقى، يتلقفون العلم من أصنام خشبية."]]}, {"l": "Jer 10:21", "n": "", "vs": [[21, "فرعاة شعبي بلداء لم يلتمسوا الرب، لذلك لم يفلحوا وتشتتت جميع رعيتهم."]]}, {"l": "Jer 12:3", "n": "", "vs": [[3, "أنت قد عرفتني ورأيتني وامتحنت قلبي من نحوك. افرزهم كغنم للذبح واعزلهم ليوم النحر."]]}, {"l": "Eze 21:31", "n": "", "vs": [[31, "وأصب عليك غضبي، وأنفخ عليك بنار غيظي وأسلمك لقبضة رجال أفظاظ متمرسين في التدمير."]]}, {"l": "Jud 1:10", "n": "", "vs": [[10, "ولكن هؤل
