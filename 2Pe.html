<script>window.CATALOG=[{"id": 17, "abbr": "Est", "en": "Esther", "nc": 10, "nv": 167, "refs": 1266, "last": "10:3", "first": "وحدث في أيام أحشويروش، الذي امتد حكمه من الهند إلى كوش، فملك على مئة وسبعة وعشرين إقليما،"}, {"id": 18, "abbr": "Job", "en": "Job", "nc": 42, "nv": 1070, "refs": 10209, "last": "42:17", "first": "عاش في أرض عوص رجل اسمه أيوب، كان صالحا كاملا يتقي الله ويحيد عن الشر."}, {"id": 19, "abbr": "Psa", "en": "Psalms", "nc": 150, "nv": 2461, "refs": 33395, "last": "150:6", "first": "طوبى للإنسان الذي لا يتبع مشورة الأشرار، ولا يقف في طريق الخاطئين، ولا يجالس المستهزئين."}, {"id": 20, "abbr": "Pro", "en": "Proverbs", "nc": 31, "nv": 915, "refs": 10457, "last": "31:31", "first": "هذه هي أمثال سليمان بن داود ملك إسرائيل،"}, {"id": 21, "abbr": "Ecc", "en": "Ecclesiastes", "nc": 12, "nv": 222, "refs": 3186, "last": "12:14", "first": "هذه أقوال الجامعة ابن داود ملك أورشليم."}, {"id": 22, "abbr": "Son", "en": "Song of Solomon", "nc": 8, "nv": 117, "refs": 1802, "last": "8:14", "first": "هذا نشيد الأناشيد لسليمان."}, {"id": 23, "abbr": "Isa", "en": "Isaiah", "nc": 66, "nv": 1292, "refs": 21959, "last": "66:24", "first": "هذه هي رؤيا إشعياء بن آموص، التي أعلنت له بشأن يهوذا وأورشليم في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا."}, {"id": 24, "abbr": "Jer", "en": "Jeremiah", "nc": 52, "nv": 1364, "refs": 20659, "last": "52:34", "first": "هذه نبوءة إرميا بن حلقيا أحد الكهنة المقيمين في عناثوث بأرض سبط بنيامين."}, {"id": 25, "abbr": "Lam", "en": "Lamentations", "nc": 5, "nv": 154, "refs": 2238, "last": "5:22", "first": "كيف أصبحت المدينة الآهلة بالسكان مهجورة وحيدة؟ صارت كأرملة! هذه التي كانت عظيمة بين الأمم. السيدة بين المدن صارت تحت الجزية!"}, {"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 48, "nv": 1273, "refs": 15264, "last": "48:35", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 61, "abbr": "2Pe", "en": "2 Peter", "verses": [{"c": 1, "v": 1, "text": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!", "groups": [{"kw": "Simon", "raw": "or, Symeon, Act_15:14", "note": "or, Symeon, Act_15:14", "refs": [{"l": "Act 15:14", "n": "", "vs": [[14, "»استمعوا لي أيها الإخوة: أخبر كم سمعان كيف تفقد الله منذ البداية غير اليهود ليتخذ من بينهم شعبا يحمل اسمه؛"]]}], "kwAr": "سمعان", "noteAr": "أو: سمعان (سِمعون)."}, {"kw": "Peter", "raw": "Mat_4:18, Mat_10:2; Luk_22:31-34; Joh_1:42, Joh_21:15-17; 1Pe_1:1", "note": "", "refs": [{"l": "Mat 4:18", "n": "", "vs": [[18, "وبينما كان يسوع يمشي على شاطيء بحيرة الجليل، رأى أخوين، هما سمعان الذي يدعى بطرس وأندراوس أخوه، يلقيان الشبكة في البحيرة، إذ كانا صيادين."]]}, {"l": "Mat 10:2", "n": "", "vs": [[2, "وهذه أسماء الاثني عشر رسولا: سمعان الذي دعي بطرس، وأندراوس أخوه، ويعقوب بن زبدي، ويوحنا أخوه؛"]]}, {"l": "Luk 22:31-34", "n": "", "vs": [[31, "وقال الرب «سمعان، سمعان! ها إن الشيطان قد طلبكم لكي يغربلكم كما يغربل القمح،"], [32, "ولكني تضرعت لأجلك لكي لا يخيب إيمانك. وأنت، بعد أن تسترد، ثبت إخوتك»."], [33, "فقال له: «يارب، إني مستعد أن أذهب معك إلى السجن وإلى الموت معا!»"], [34, "فقال: «إني أقول لك يابطرس إن الديك لا يصيح اليوم حتى تكون قد أنكرت ثلاث مرات أنك تعرفني!»"]]}, {"l": "Joh 1:42", "n": "", "vs": [[42, "واقتاده إلى يسوع. فنظر يسوع مليا إلى سمعان وقال: «أنت سمعان بن يونا، ولكني سأدعوك: صفا» أي صخرا."]]}, {"l": "Joh 21:15-17", "n": "", "vs": [[15, "وبعدما أكلوا سأل يسوع سمعان بطرس: «ياسمعان بن يونا، أتحبني أكثر مما يحبني هؤلاء؟» فأجابه «نعم يارب، أنت تعلم أني أحبك!» فقال له: «أطعم حملاني!»"], [16, "ثم سأله ثانية: «ياسمعان بن يونا، أتحبني؟» فأجابه: «نعم يارب. أنت تعلم أني أحبك!» قال له: «ارع خرافي»"], [17, "فسأله مرة ثالثة: «ياسمعان بن يونا، أتحبني؟» فحزن بطرس لأن يسوع قال له في المرة الثالثة: «أتحبني». وقال له: «يارب، أنت تعلم كل شيء. أنت تعلم أني أحبك!» فقال له يسوع: «أطعم خرافي!"]]}, {"l": "1Pe 1:1", "n": "", "vs": [[1, "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"]]}], "kwAr": "بطرس", "noteAr": ""}, {"kw": "a servant", "raw": "Joh_12:26; Rom_1:1", "note": "", "refs": [{"l": "Joh 12:26", "n": "", "vs": [[26, "من أراد أن يخدمني فليتبعني. وحيث أكون أنا يكون خادمي أيضا. وكل من يخدمني يكرمه أبي."]]}, {"l": "Rom 1:1", "n": "", "vs": [[1, "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"]]}], "kwAr": "عبد يسوع المسيح", "noteAr": ""}, {"kw": "an apostle", "raw": "Luk_11:49; Joh_20:21; 1Co_9:1, 1Co_15:9; Gal_2:8; Eph_3:5, Eph_4:11; 1Pe_5:1", "note": "", "refs": [{"l": "Luk 11:49", "n": "", "vs": [[49, "لهذا السبب أيضا قالت حكمة الله: سأرسل إليهم أنبياء ورسلا، فيقتلون منهم ويضطهدون،"]]}, {"l": "Joh 20:21", "n": "", "vs": [[21, "فقال لهم يسوع: «سلام لكم. كما أن الآب أرسلني، أرسلكم أنا»."]]}, {"l": "1Co 9:1", "n": "", "vs": [[1, "ألست أنا حرا؟ أولست رسولا؟ أما رأيت يسوع ربنا؟ ألستم أنتم عمل يدي في الرب؟"]]}, {"l": "1Co 15:9", "n": "", "vs": [[9, "فإني أنا أصغر الرسل شأنا، ولست أهلا لأن أدعى رسولا لأني اضطهدت كنيسة الله."]]}, {"l": "Gal 2:8", "n": "", "vs": [[8, "لأن الذي استخدم بطرس في رسوليته إلى أهل الختان، استخدمني أيضا بالنسبة إلى الأمم."]]}, {"l": "Eph 3:5", "n": "", "vs": [[5, "ذلك السر الذي لم يطلع عليه بنو البشر في الأجيال الماضية مثلما أعلن الآن بوحي الروح لرسله القديسين وأنبيائه:"]]}, {"l": "Eph 4:11", "n": "", "vs": [[11, "وهو قد وهب البعض أن يكونوا رسلا، والبعض أنبياء، والبعض مبشرين والبعض رعاة ومعلمين،"]]}, {"l": "1Pe 5:1", "n": "", "vs": [[1, "وهذه وصيتي إلى الشيوخ الذين بينكم، بصفتي شيخا رفيقا لهم، وشاهدا لآلام المسيح، وشريكا في المجد الذي سيتجلى:"]]}], "kwAr": "ورسوله", "noteAr": ""}, {"kw": "have", "raw": "2Pe_1:4; Act_15:8, Act_15:9; Rom_1:12; 2Co_4:13; Eph_4:5; Phi_1:29; 2Ti_1:5; Tit_1:1, Tit_1:4; 1Pe_1:7, 1Pe_2:7", "note": "", "refs": [{"l": "2Pe 1:4", "n": "", "vs": [[4, "اللذين بهما أعطانا الله بركاته العظمى الثمينة التي كان قد وعد بها. وبهذا صار بإمكانكم أن تتخلصوا من الفساد الذي تنشره الشهوة في العالم، وتشتركوا في الطبيعة الإلهية."]]}, {"l": "Act 15:8", "n": "", "vs": [[8, "وقد شهد الله العليم بما في القلوب على قبوله لهم إذ وهبهم الروح القدس كما وهبنا إياه."]]}, {"l": "Act 15:9", "n": "", "vs": [[9, "فهو لم يفرق بيننا وبينهم في شيء، إذ طهر بالإيمان قلوبهم."]]}, {"l": "Rom 1:12", "n": "", "vs": [[12, "أي ليشجع بعضنا بعضا بالإيمان المشترك، إيمانكم وإيماني."]]}, {"l": "2Co 4:13", "n": "", "vs": [[13, "وبما أن لنا روح الإيمان عينه، هذا الذي كتب بخصوصه: «آمنت، لذلك تكلمت»، فنحن أيضا نؤمن، ولذلك نتكلم،"]]}, {"l": "Eph 4:5", "n": "", "vs": [[5, "ولكم رب واحد، وإيمان واحد، ومعمودية واحدة،"]]}, {"l": "Phi 1:29", "n": "", "vs": [[29, "فقد وهب لكم، لأجل المسيح، لا أن تؤمنوا به وحسب، بل أيضا أن تتألموا لأجله،"]]}, {"l": "2Ti 1:5", "n": "", "vs": [[5, "كما أستذكر إيمانك الخالي من الرياء، هذا الإيمان الذي فيك والذي حل أولا في جدتك لوئيس ثم في أمك أفنيكي، وأنا متأكد أنه حال فيك أيضا."]]}, {"l": "Tit 1:1", "n": "", "vs": [[1, "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"]]}, {"l": "Tit 1:4", "n": "", "vs": [[4, "إلى تيطس، ولدي الحقيقي بالنسبة إلى الإيمان المشترك بيننا."]]}, {"l": "1Pe 1:7", "n": "", "vs": [[7, "إلا أن غاية هذه التجارب هي اختبار حقيقة إيمانكم. فكما تختبر النار الذهب وتنقيه، تختبر التجارب حقيقة إيمانكم، وهو أثمن جدا من الذهب الفاني. وهكذا، يكون إيمانكم مدعاة مدح وإكرام وتمجيد لكم، عندما يعود يسوع المسيح ظاهرا بمجده."]]}, {"l": "1Pe 2:7", "n": "", "vs": [[7, "فإن هذا الحجر هو ثمين في نظركم، أنتم المؤمنين به. أما بالنسبة إلى الذين لا يؤمنون، «فالحجر الذي رفضه البناؤون صار هو الحجر الأساسي رأس زاوية البيت»،"]]}], "kwAr": "يشاركوننا في الإيمان الواحد الثمين", "noteAr": ""}, {"kw": "through", "raw": "Jer_33:16; Rom_1:17, Rom_3:21-26; 1Co_1:30; 2Co_5:21; Phi_3:9", "note": "", "refs": [{"l": "Jer 33:16", "n": "", "vs": [[16, "في تلك الأيام يخلص يهوذا، وتسكن أورشليم آمنة، وهذا هو الاسم الذي تدعى به: الرب برنا."]]}, {"l": "Rom 1:17", "n": "", "vs": [[17, "ففيه قد أعلن البر الذي يمنحه الله على أساس الإيمان والذي يؤدي إلى الإيمان، على حد ما قد كتب: «أما من تبرر بالإيمان، فبالإيمان يحيا»."]]}, {"l": "Rom 3:21-26", "n": "", "vs": [[21, "أما الآن، فقد أعلن البر الذي يمنحه الله ، مستقلا عن الشريعة، ومشهودا له من الشريعة والأنبياء،"], [22, "ذلك البر الذي يمنحه الله على أساس الإيمان بيسوع المسيح لجميع الذين يؤمنون. إذ لا فرق،"], [23, "لأن الجميع قد أخطأوا وهم عاجزون عن بلوغ ما يمجد الله ."], [24, "فهم يبررون مجانا، بنعمته، بالفداء بالمسيح يسوع"], [25, "الذي قدمه الله كفارة، عن طريق الإيمان، وذلك بدمه."], [26, "ليظهر بر الله إذ تغاضى، بإمهاله الإلهي، عن الخطايا التي حدثت في الماضي، ويظهر أيضا بره في الزمن الحاضر: فيتبين أنه بار وأنه يبرر من له الإيمان بيسوع."]]}, {"l": "1Co 1:30", "n": "", "vs": [[30, "وبفضل الله صار لكم مقام في المسيح يسوع الذي جعل لنا حكمة من الله وبرا وقداسة وفداء،"]]}, {"l": "2Co 5:21", "n": "", "vs": [[21, "فإن الذي لم يعرف خطيئة، جعله الله خطيئة لأجلنا، لنصير نحن بر الله فيه."]]}, {"l": "Phi 3:9", "n": "", "vs": [[9, "ويكون لي فيه مقام، إذ ليس لي بري الذاتي القائم على أساس الشريعة، بل البر الآتي من الإيمان بالمسيح، البر الذي من عند الله على أساس الإيمان."]]}], "kwAr": "ببر", "noteAr": ""}, {"kw": "of God and our Saviour", "raw": "Gr. of our God and Saviour, Isa_12:2; Luk_1:47; Tit_2:13", "note": "Gr. of our God and Saviour, Isa_12:2; Luk_1:47; Tit_2:13", "refs": [{"l": "Isa 12:2", "n": "", "vs": [[2, "ها إن الله خلاصي فأطمئن ولا أرتعد، لأن الرب الله هو قوتي وترنيمتي وقد أصبح لي خلاصا»."]]}, {"l": "Luk 1:47", "n": "", "vs": [[47, "وتبتهج روحي بالله مخلصي."]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}], "kwAr": "إلهنا ومخلصنا يسوع المسيح", "noteAr": "في اليونانية: إلهنا ومخلصنا."}], "arS": [["من ", []], ["سمعان", ["G4826"]], [" ", []], ["بطرس", ["G4074"]], ["، ", []], ["عبد", ["G1401"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [" ", []], ["ورسوله", ["G652"]], ["، إلى الذين يشاركوننا في ", []], ["الإيمان", ["G4102"]], [" الواحد ", []], ["الثمين", ["G2472"]], [" الذي نتساوى جميعا في ", []], ["الحصول", ["G2975"]], [" عليه ", []], ["ببر", ["G1343"]], [" ", []], ["إلهنا", ["G2316"]], [" ", []], ["ومخلصنا", ["G4990"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], ["!", []]]}, {"c": 1, "v": 2, "text": "ليكن لكم المزيد من النعمة والسلام بفضل معرفة الله ويسوع ربنا!", "groups": [{"kw": "Grace", "raw": "Num_6:24-26; Dan_4:1, Dan_6:25; Rom_1:7; 1Pe_1:2; Jud_1:2; Rev_1:4", "note": "", "refs": [{"l": "Num 6:24-26", "n": "", "vs": [[24, "يباركك الرب ويحرسك."], [25, "يضيء الرب بوجهه عليك ويرحمك."], [26, "يلتفت الرب بوجهه إليك ويمنحك سلاما."]]}, {"l": "Dan 4:1", "n": "", "vs": [[1, "من نبوخذناصر الملك إلى جميع الشعوب والأمم والأقوام من كل لسان المقيمين في كل الأرض: ليكثر سلامكم."]]}, {"l": "Dan 6:25", "n": "", "vs": [[25, "ثم بعث الملك داريوس إلى كل الشعوب والأمم من كل لسان من الساكنين في مملكته برسائل قائلا: «ليكثر سلامكم."]]}, {"l": "Rom 1:7", "n": "", "vs": [[7, "إلى جميع من هم في روما من أحباء الله القديسين المدعوين. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}, {"l": "1Pe 1:2", "n": "", "vs": [[2, "بحسب علمه السابق ثم قدسهم بالروح ليطيعوا يسوع المسيح ويطهروا برش دمه عليهم."]]}, {"l": "Jud 1:2", "n": "", "vs": [[2, "لتكن لكم الرحمة والسلام والمحبة في وفرة وازدياد!"]]}, {"l": "Rev 1:4", "n": "", "vs": [[4, "من يوحنا، إلى الكنائس السبع في مقاطعة آسيا: لكم النعمة والسلام من الكائن والذي كان والذي سيأتي، ومن الأرواح السبعة الماثلة أمام عرشه،"]]}], "kwAr": "النعمة والسلام", "noteAr": ""}, {"kw": "the knowledge", "raw": "2Pe_3:18; Isa_53:11; Luk_10:22; Joh_17:3; 2Co_4:6; 1Jo_5:20,1Jo_5:21", "note": "", "refs": [{"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}, {"l": "Isa 53:11", "n": "", "vs": [[11, "ويرى ثمار تعب نفسه ويشبع، وعبدي البار يبرر بمعرفته كثيرين ويحمل آثامهم."]]}, {"l": "Luk 10:22", "n": "", "vs": [[22, "كل شيء قد سلم إلي من قبل أبي، ولا أحد يعرف من هو الابن إلا الآب، ولا من هو الآب إلا الابن ومن أراد الابن أن يعلنه له!»"]]}, {"l": "Joh 17:3", "n": "", "vs": [[3, "والحياة الأبدية هي أن يعرفوك أنت الإله الحق وحدك، والذي أرسلته: يسوع المسيح."]]}, {"l": "2Co 4:6", "n": "", "vs": [[6, "فإن الله ، الذي أمر أن يشرق نور من الظلام، هو الذي جعل النور يشرق في قلوبنا، لإشعاع معرفة مجد الله المتجلي في وجه المسيح."]]}, {"l": "1Jo 5:20", "n": "", "vs": [[20, "وإننا نعلم أن ابن الله قد جاء إلى الأرض وأنار أذهاننا لنعرف الإله الحق. ونحن الآن نحيا فيه، لأننا في ابنه يسوع المسيح. هذا هو الإله الحق، والحياة الأبدية."]]}, {"l": "1Jo 5:21", "n": "", "vs": [[21, "أيها الأولاد الصغار، احفظوا أنفسكم من الأصنام!"]]}], "kwAr": "معرفة الله", "noteAr": ""}], "arS": [["ليكن لكم ", []], ["المزيد", ["G4129"]], [" من ", []], ["النعمة", ["G5485"]], [" ", []], ["والسلام", ["G1515"]], [" بفضل ", []], ["معرفة", ["G1922"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["ويسوع", ["G2424"]], [" ", []], ["ربنا", ["G2962", "G2257"]], ["!", []]]}, {"c": 1, "v": 3, "text": "إن الله، بقدرته الإلهية، قد زودنا بكل ما نحتاج إليه في الحيا ة الروحية المتصفة بالتقوى. ذلك أنه عرفنا بالمسيح الذي دعانا إلى مجده وفضيلته،", "groups": [{"kw": "his", "raw": "Psa_110:3; Mat_28:18; Joh_17:2; 2Co_12:9; Eph_1:19-21; Col_1:16; Heb_1:3", "note": "", "refs": [{"l": "Psa 110:3", "n": "", "vs": [[3, "في يوم محاربة أعدائك يتطوع شعبك. يجيء شبابك إلى التلال المقدسة كالندى في قلب الفجر."]]}, {"l": "Mat 28:18", "n": "", "vs": [[18, "فتقدم يسوع وكلمهم قائلا: «دفع إلي كل سلطان في السماء وعلى الأرض."]]}, {"l": "Joh 17:2", "n": "", "vs": [[2, "فقد أوليته السلطة على جميع البشر، ليمنح جميع الذين قد وهبتهم له حياة أبدية."]]}, {"l": "2Co 12:9", "n": "", "vs": [[9, "فقال لي: «نعمتي تكفيك، لأن قدرتي تكمل في الضعف!» فأنا أرضى بأن أفتخر مسرورا بالضعفات التي في، لكي تخيم علي قدرة المسيح."]]}, {"l": "Eph 1:19-21", "n": "", "vs": [[19, "وما هي عظمة قدرته الفائقة المعلنة لنا نحن المؤمنين، بحسب عمل اقتدار قوته"], [20, "الذي عمله في المسيح، بإقامته له من بين الأموات. وقد أجلسه عن يمينه في الأماكن السماوية،"], [21, "أرفع جدا من كل رئاسة وسلطة وقوة وسيا دة، ومن كل اسم يسمى، لا في هذا العالم وحسب، بل في ذلك الآتي أيضا."]]}, {"l": "Col 1:16", "n": "", "vs": [[16, "إذ به خلقت جميع الأشياء: ما في السماوات وما على الأرض، ما يرى وما لا يرى، أعروشا كانت أم سيادات أم رئاسات أم سلطات. كل ما في الكون قد خلق به ولأجله."]]}, {"l": "Heb 1:3", "n": "", "vs": [[3, "إنه ضياء مجد الله وصورة جوهره. حافظ كل ما في الكون بكلمته القديرة. وهو الذي بعدما طهرنا بنفسه من خطايانا،"]]}], "kwAr": "بقدرته الإلهية", "noteAr": ""}, {"kw": "all", "raw": "Psa_84:11; Rom_8:32; 1Co_3:21-23; 1Ti_4:8", "note": "", "refs": [{"l": "Psa 84:11", "n": "", "vs": [[11, "لأن الرب الإله شمس وترس. الرب يعطي نعمة ومجدا؛ لا يمنع أي خير عن السالكين بالاستقامة."]]}, {"l": "Rom 8:32", "n": "", "vs": [[32, "بل بذله لأجلنا جميعا، كيف لا يجود علينا معه بكل شيء أيضا؟"]]}, {"l": "1Co 3:21-23", "n": "", "vs": [[21, "إذن، لا يفتخر أحد بالبشر، لأن كل شيء هو لكم،"], [22, "أبولس أم أبلوس أم بطرس أم العالم أم الحيا ة أم الموت أم الحاضر أم المستقبل: هذه الأمور كلها لكم،"], [23, "وأنتم للمسيح، والمسيح لله."]]}, {"l": "1Ti 4:8", "n": "", "vs": [[8, "فالرياضة البدنية نافعة بعض الشيء. أما التقوى فنافعة لكل شيء، لأن فيها وعدا بالحياة الحاضرة والآتية."]]}], "kwAr": "بكل ما نحتاج إليه", "noteAr": ""}, {"kw": "through", "raw": "2Pe_1:2; Joh_17:3", "note": "", "refs": [{"l": "2Pe 1:2", "n": "", "vs": [[2, "ليكن لكم المزيد من النعمة والسلام بفضل معرفة الله ويسوع ربنا!"]]}, {"l": "Joh 17:3", "n": "", "vs": [[3, "والحياة الأبدية هي أن يعرفوك أنت الإله الحق وحدك، والذي أرسلته: يسوع المسيح."]]}], "kwAr": "عرفنا بالمسيح", "noteAr": ""}, {"kw": "called", "raw": "Rom_8:28-30, Rom_9:24; 1Co_1:9; Eph_4:1, Eph_4:4; 1Th_2:12, 1Th_4:7; 2Th_2:14; 2Ti_1:9; 1Pe_1:15, 1Pe_2:9, 1Pe_2:21, 1Pe_3:9, 1Pe_5:10", "note": "", "refs": [{"l": "Rom 8:28-30", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."], [29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."], [30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."]]}, {"l": "Rom 9:24", "n": "", "vs": [[24, "فينا نحن الذين دعاهم لا من بين اليهود فقط بل من بين الأمم أيضا؟"]]}, {"l": "1Co 1:9", "n": "", "vs": [[9, "فإن الله أمين، وقد دعاكم إلى الشركة مع ابنه يسوع ربنا."]]}, {"l": "Eph 4:1", "n": "", "vs": [[1, "... إذن، أنا السجين في الرب، أناشدكم أن تسلكوا سلوكا يليق بالدعوة التي إليها دعيتم،"]]}, {"l": "Eph 4:4", "n": "", "vs": [[4, "مثلما دعيتم، جميعكم، دعوة لها رجاء واحد."]]}, {"l": "1Th 2:12", "n": "", "vs": [[12, "ونحرضكم أن تسلكوا سلوكا يليق بالله، ذاك الذي يدعوكم إلى ملكوته ومجده."]]}, {"l": "1Th 4:7", "n": "", "vs": [[7, "فإن الله دعانا لا إلى النجاسة بل (إلى العيش( في القداسة."]]}, {"l": "2Th 2:14", "n": "", "vs": [[14, "فإلى هذا الأمر قد دعاكم ببشارتنا لكم، لنوال مجد ربنا يسوع المسيح."]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،"]]}, {"l": "1Pe 1:15", "n": "", "vs": [[15, "وإنما اسلكوا سلوكا مقدسا في كل أمر، مقتدين بالقدوس الذي دعاكم،"]]}, {"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}, {"l": "1Pe 2:21", "n": "", "vs": [[21, "لأن الله دعاكم إلى الاشتراك في هذا النوع من الآلام. فالمسيح، الذي تألم لأجلكم، هو القدوة التي تقتدون بها. فسيروا على آثار خطواته:"]]}, {"l": "1Pe 3:9", "n": "", "vs": [[9, "لا تبادلوا الشر بشر، ولا الشتيمة بشتيمة. بل بالعكس: باركوا، فترثوا البركة، لأنه لهذا دعاكم الله ."]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}], "kwAr": "دعانا", "noteAr": ""}, {"kw": "to", "raw": "or, by", "note": "or, by", "refs": [], "kwAr": "إلى مجده", "noteAr": "أو: بواسطة."}, {"kw": "virtue", "raw": "2Pe_1:5; Rth_3:11; Pro_12:4, Pro_31:10,Pro_31:29; Phi_4:8", "note": "", "refs": [{"l": "2Pe 1:5", "n": "", "vs": [[5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"]]}, {"l": "Rut 3:11", "n": "", "vs": [[11, "والآن لا تخافي ياابنتي، سأفعل كل ما تطلبين، فأهل مدينتي كلهم يعلمون أنك امرأة فاضلة."]]}, {"l": "Pro 12:4", "n": "", "vs": [[4, "المرأة الفاضلة تاج لزوجها، أما جالبة الخزي فكنخر في عظامه."]]}, {"l": "Pro 31:10", "n": "", "vs": [[10, "من يعثر على المرأة الفاضلة؟ إن قيمتها تفوق اللآليء."]]}, {"l": "Pro 31:29", "n": "", "vs": [[29, "«نساء كثيرات قمن بأعمال جليلة، ولكنك تفوقت عليهن جميعا»."]]}, {"l": "Phi 4:8", "n": "", "vs": [[8, "وختاما، أيها الإخوة: كل ما كان حقا، وكل ما كان شريفا، وكل ما كان عادلا، وكل ما كان طاهرا وكل ما كان مستحبا، وكل ما كان حسن السمعة، وكل ما كان فيه فضيلة وخصلة حميدة، فاشغلوا أفكاركم به."]]}], "kwAr": "وفضيلته", "noteAr": ""}], "arS": [["إن الله، ", []], ["بقدرته", ["G1411"]], [" ", []], ["الإلهية", ["G2304"]], ["، قد ", []], ["زودنا", ["G1433"]], [" ", []], ["بكل", ["G3956"]], [" ما نحتاج إليه في ", []], ["الحيا ة", ["G2222"]], [" الروحية المتصفة ", []], ["بالتقوى", ["G2150"]], [". ذلك أنه ", []], ["عرفنا", ["G1922"]], [" بالمسيح الذي ", []], ["دعانا", ["G2564"]], [" إلى ", []], ["مجده", ["G1391"]], [" ", []], ["وفضيلته", ["G703"]], ["،", []]]}, {"c": 1, "v": 4, "text": "اللذين بهما أعطانا الله بركاته العظمى الثمينة التي كان قد وعد بها. وبهذا صار بإمكانكم أن تتخلصوا من الفساد الذي تنشره الشهوة في العالم، وتشتركوا في الطبيعة الإلهية.", "groups": [{"kw": "are given", "raw": "2Pe_1:1; Eze_36:25-27; Rom_9:4; 2Co_1:20, 2Co_6:17, 2Co_6:18, 2Co_7:1; Gal_3:16; Heb_8:6-12, Heb_9:15; 1Jo_2:25", "note": "", "refs": [{"l": "2Pe 1:1", "n": "", "vs": [[1, "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"]]}, {"l": "Eze 36:25-27", "n": "", "vs": [[25, "وأرش عليكم ماء نقيا فتطهرون من كل نجاستكم ومن كل أصنامكم،"], [26, "وأهبكم قلبا جديدا، وأضع في داخلكم روحا جديدة، وأنتزع من لحمكم قلب الحجر وأعطيكم عوضا عنه قلب لحم."], [27, "وأضع روحي في داخلكم فأجعلكم تمارسون فرائضي وتطيعون أحكامي عاملين بها،"]]}, {"l": "Rom 9:4", "n": "", "vs": [[4, "فإنهم إسرائيليون، وقد منحوا التبني والمجد والعهود والتشريع والعبادة والمواعيد،"]]}, {"l": "2Co 1:20", "n": "", "vs": [[20, "فمهما كانت وعود الله، فإن فيه النعم لها كلها، وفيه الآمين بنا لأجل مجد الله."]]}, {"l": "2Co 6:17", "n": "", "vs": [[17, "لذلك اخرجوا من وسطهم، وكونوا منفصلين، يقول الرب، ولا تلمسوا ما هو نجس،"]]}, {"l": "2Co 6:18", "n": "", "vs": [[18, "فأقبلكم، وأكون لكم أبا، وتكونوا لي بنين وبنات»، هذا يقوله الرب القادر على كل شيء."]]}, {"l": "2Co 7:1", "n": "", "vs": [[1, "فإذ نلنا هذه الوعود، أيها الأحباء، لنطهر أنفسنا من كل ما يدنس الجسد والروح، ونكمل القداسة في مخافة الله."]]}, {"l": "Gal 3:16", "n": "", "vs": [[16, "وقد وجهت الوعود لإبراهيم ونسله، ولا يقول «وللأنسال» كأنه يشير إلى كثيرين، بل يشير إلى واحد، إذ يقول «ولنسلك»، يعني المسيح."]]}, {"l": "Heb 8:6-12", "n": "", "vs": [[6, "فرئيس كهنتنا، إذن، قد حصل على خدمة أفضل من خدمة الكهنوت الأرضي، لكونه الوسيط الذي أعلن لنا قيام عهد جديد أفضل من العهد السابق، ولكون هذا العهد الجديد ينطوي على وعود أفضل."], [7, "فلو كان العهد السابق بلا عيب، لما ظهرت الحاجة إلى عهد آخر يحل محله."], [8, "والواقع أن الله نفسه يعبر عن عجز العهد السابق. وهذا واضح في قول أحد الأنبياء قديما:"], [9, "هذا العهد الجديد ليس كالعهد الذي أبرمته مع آبائهم، حين أمسكت بأيديهم وأخرجتهم من أرض مصر. فبما أنهم خرقوا ذلك العهد، يقول الرب، أصبح من حقي أن ألغيه!"], [10, "فهذا هو العهد الذي أبرمه مع بني إسرائيل، بعد تلك الأيام، يقول الرب: أضع شرائعي داخل ضمائرهم، وأكتبها على قلوبهم، وأكون لهم إلها، وهم يكونون لي شعبا."], [11, "بعد ذلك، لا يعلم أحد منهم ابن وطنه ولا أخاه قائلا: تعرف بالرب! ذلك لأن الجميع سوف يعرفونني حق المعرفة، من الصغير فيهم إلى العظيم."], [12, "لأني سأصفح عن آثامهم، ولا أعود أبدا إلى تذكر خطاياهم ومخالفاتهم!»"]]}, {"l": "Heb 9:15", "n": "", "vs": [[15, "ولذلك، فالمسيح هو الوسيط لهذا العهد الجديد. فبما أنه قد تم الموت فداء للمخالفات الحاصلة تحت العهد الأول، ينال المدعوون الوعد بالإرث الأبدي."]]}, {"l": "1Jo 2:25", "n": "", "vs": [[25, "فإن الله نفسه قد وعدنا بالحياة الأبدية."]]}], "kwAr": "أعطانا الله", "noteAr": ""}, {"kw": "ye might", "raw": "Joh_1:12, Joh_1:13; 2Co_3:18; Eph_4:23, Eph_4:24; Col_3:10; Heb_12:10; 1Jo_3:2", "note": "", "refs": [{"l": "Joh 1:12", "n": "", "vs": [[12, "أما الذين قبلوه، أي الذين آمنوا باسمه، فقد منحهم الحق في أن يصيروا أولاد الله،"]]}, {"l": "Joh 1:13", "n": "", "vs": [[13, "وهم الذين ولدوا ليس من دم، ولا من رغبة جسد، ولا من رغبة بشر، بل من الله."]]}, {"l": "2Co 3:18", "n": "", "vs": [[18, "ونحن جميعا فيما ننظر إلى مجد الرب بوجوه كالمرآة لا حجاب عليها، نتجلى من مجد إلى مجد لنشابه الصورة الواحدة عينها، وذلك بفعل الرب الروح."]]}, {"l": "Eph 4:23", "n": "", "vs": [[23, "وتتجددوا في روح ذهنكم؛"]]}, {"l": "Eph 4:24", "n": "", "vs": [[24, "وتلبسوا الإنسان الجديد المخلوق على مثال الله في البر والقداسة بالحق."]]}, {"l": "Col 3:10", "n": "", "vs": [[10, "ولبستم الجديد الذي يتجدد لبلوغ تمام المعرفة وفقا لصورة خالقه،"]]}, {"l": "Heb 12:10", "n": "", "vs": [[10, "وقد أدبنا آباؤنا فترة من الزمان، حسب ما رأوه مناسبا. أما الله ، فيؤدبنا دائما من أجل منفعتنا: لكي نشترك في قداسته."]]}, {"l": "1Jo 3:2", "n": "", "vs": [[2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"]]}], "kwAr": "تشتركوا في الطبيعة الإلهية", "noteAr": ""}, {"kw": "having", "raw": "2Pe_2:18-20; Gal_6:8; Jam_4:1-3; 1Pe_4:2, 1Pe_4:3; 1Jo_2:15, 1Jo_2:16", "note": "", "refs": [{"l": "2Pe 2:18-20", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."], [19, "يعدون هؤلاء بالحرية، وهم أنفسهم عبيد للفساد! لأن الإنسان يصير عبدا لكل ما يتسلط عليه ويغلبه."], [20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."]]}, {"l": "Gal 6:8", "n": "", "vs": [[8, "فإن من يزرع لجسده، فمن الجسد يحصد فسادا. ومن يزرع للروح، فمن الروح يحصد حياة أبدية. فلا نفشل في عمل الخير،"]]}, {"l": "Jam 4:1-3", "n": "", "vs": [[1, "من أين النزاع والخصام بينكم؟ أليس من لذاتكم تلك المتصارعة في أعضائكم؟"], [2, "فأنتم ترغبون في امتلاك ما لا يخصكم، لكن ذلك لا يتحقق لكم، فتقتلون، وتحسدون، ولا تتمكنون من بلوغ غايتكم. وهكذا تتخاصمون وتتصارعون! إنكم لا تمتلكون ما تريدونه، لأنكم لا تطلبونه من الله."], [3, "وإذا طلبتم منه شيئا، فإنكم لا تحصلون عليه: لأنكم تطلبون بدافع شرير، إذ تنوون أن تستهلكوا ما تنالونه لإشباع شهواتكم فقط."]]}, {"l": "1Pe 4:2", "n": "", "vs": [[2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."]]}, {"l": "1Pe 4:3", "n": "", "vs": [[3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}, {"l": "1Jo 2:15", "n": "", "vs": [[15, "لا تحبوا العالم، ولا الأشياء التي في العالم. فالذي يحب العالم، لا تكون محبة الآب في قلبه."]]}, {"l": "1Jo 2:16", "n": "", "vs": [[16, "لأن كل ما في العالم، من شهوات الجسد وشهوات العين وترف المعيشة، ليس من الآب، بل من العالم."]]}], "kwAr": "تتخلصوا من الفساد", "noteAr": ""}], "arS": [["اللذين بهما ", []], ["أعطانا", ["G1433"]], [" الله بركاته ", []], ["العظمى", ["G3176"]], [" ", []], ["الثمينة", ["G5093"]], [" التي كان قد ", []], ["وعد بها", ["G1862"]], [". وبهذا صار بإمكانكم أن ", []], ["تتخلصوا", ["G668"]], [" من ", []], ["الفساد", ["G5356"]], [" الذي تنشره ", []], ["الشهوة", ["G1939"]], [" في ", []], ["العالم", ["G2889"]], ["، ", []], ["وتشتركوا", ["G2844"]], [" في ", []], ["الطبيعة", ["G5449"]], [" ", []], ["الإلهية", ["G2304"]], [".", []]]}, {"c": 1, "v": 5, "text": "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،", "groups": [{"kw": "beside", "raw": "Luk_16:26, Luk_24:21", "note": "", "refs": [{"l": "Luk 16:26", "n": "", "vs": [[26, "وفضلا عن هذا كله، فإن بيننا وبينكم هوة عظيمة قد أثبتت، حتى إن الذين يريدون العبور من هنا لا يقدرون، ولا الذين من هناك يستطيعون العبور إلينا!"]]}, {"l": "Luk 24:21", "n": "", "vs": [[21, "ولكننا كنا نرجو أنه الموشك أن يفدي إسرائيل. ومع هذا كله، فاليوم هو اليوم الثالث منذ حدوث ذلك."]]}], "kwAr": "من أجل ذلك", "noteAr": ""}, {"kw": "giving", "raw": "2Pe_1:10, 2Pe_3:14, 2Pe_3:18; Psa_119:4; Pro_4:23; Isa_55:2; Zec_6:15; Joh_6:27; Phi_2:12; Heb_6:11, Heb_11:6, Heb_12:15", "note": "", "refs": [{"l": "2Pe 1:10", "n": "", "vs": [[10, "فأحرى بكم إذن، أيها الإخوة، أن تجتهدوا لتثبتوا عمليا أن الله قد دعاكم واختاركم حقا. فإنكم، إن فعلتم هذا، لن تسقطوا أبدا!"]]}, {"l": "2Pe 3:14", "n": "", "vs": [[14, "فبينما تنتظرون إتمام هذا الوعد، أيها الأحباء، اجتهدوا أن يجدكم الرب في سلام، خالين من الدنس والعيب."]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}, {"l": "Psa 119:4", "n": "", "vs": [[4, "أنت أوصيت بحفظ وصاياك والعمل بها كلها."]]}, {"l": "Pro 4:23", "n": "", "vs": [[23, "فوق كل حرص احفظ قلبك لأن منه تنبثق الحياة."]]}, {"l": "Isa 55:2", "n": "", "vs": [[2, "لماذا تنفقون الفضة على ما ليس بخبز، وتتعبون لغير شبع؟ أحسنوا الاستماع إلي، وكلوا الشهي ولتتمتع أنفسكم بالدسم."]]}, {"l": "Zec 6:15", "n": "", "vs": [[15, "ويتوافد قوم من بعيد ليبنوا هيكل الرب، فتدركون أن الرب القدير قد أرسلني إليكم. ويتم هذا كله إن أطعتم صوت الرب إلهكم طاعة كاملة»."]]}, {"l": "Joh 6:27", "n": "", "vs": [[27, "لا تسعوا وراء الطعام الفاني، بل وراء الطعام الباقي إلى الحياة الأبدية، والذي يعطيكم إياه ابن الإنسان، لأن هذا الطعام قد وضع الله الآب ختمه عليه»."]]}, {"l": "Phi 2:12", "n": "", "vs": [[12, "إذن، ياأحبائي، كما كنتم تطيعون دائما، لا كما لو أنني حاضر وحسب، بل بالأحرى كثيرا الآن وأنا غائب، كذلك اسعوا لتحقيق خلاصكم عمليا بخوف وارتعاد،"]]}, {"l": "Heb 6:11", "n": "", "vs": [[11, "وإنما نتمنى أن يظهر كل واحد منكم اجتهادا مماثلا في المحافظة حتى النهاية على الثقة الكاملة بالرجاء."]]}, {"l": "Heb 11:6", "n": "", "vs": [[6, "فمن المستحيل إرضاء الله بدون إيمان. إذ إن من يتقرب إلى الله، لابد له أن يؤمن بأنه موجود، وبأنه يكافيء الذين يسعون إليه."]]}, {"l": "Heb 12:15", "n": "", "vs": [[15, "انتبهوا ألا يسقط أحدكم من نعمة الله، حتى لا يتأصل بينكم جذر مرارة، فيسبب بلبلة، وينجس كثيرين منكم."]]}], "kwAr": "تبذلوا كل اجتهاد", "noteAr": ""}, {"kw": "virtue", "raw": "2Pe_1:3; Phi_4:8", "note": "", "refs": [{"l": "2Pe 1:3", "n": "", "vs": [[3, "إن الله، بقدرته الإلهية، قد زودنا بكل ما نحتاج إليه في الحيا ة الروحية المتصفة بالتقوى. ذلك أنه عرفنا بالمسيح الذي دعانا إلى مجده وفضيلته،"]]}, {"l": "Phi 4:8", "n": "", "vs": [[8, "وختاما، أيها الإخوة: كل ما كان حقا، وكل ما كان شريفا، وكل ما كان عادلا، وكل ما كان طاهرا وكل ما كان مستحبا، وكل ما كان حسن السمعة، وكل ما كان فيه فضيلة وخصلة حميدة، فاشغلوا أفكاركم به."]]}], "kwAr": "الفضيلة", "noteAr": ""}, {"kw": "knowledge", "raw": "2Pe_1:2, 2Pe_3:18; 1Co_14:20; Eph_1:17, Eph_1:18, Eph_5:17; Phi_1:9; Col_1:9; 1Pe_3:7", "note": "", "refs": [{"l": "2Pe 1:2", "n": "", "vs": [[2, "ليكن لكم المزيد من النعمة والسلام بفضل معرفة الله ويسوع ربنا!"]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}, {"l": "1Co 14:20", "n": "", "vs": [[20, "أيها الإخوة، لا تكونوا أولادا في التفكير، بل كونوا أطفالا في الشر. وأما في التفكير، فكونوا راشدين."]]}, {"l": "Eph 1:17", "n": "", "vs": [[17, "حتى يهبكم إله ربنا يسوع المسيح، أبو المجد، روح حكمة وإلهام: لتعرفوه معرفة كاملة"]]}, {"l": "Eph 1:18", "n": "", "vs": [[18, "إذ تستنير بصائر قلوبكم، فتعلموا ما في دعوته لكم من رجاء، وما هو غنى مجد ميراثه في القديسين،"]]}, {"l": "Eph 5:17", "n": "", "vs": [[17, "لذلك لا تكونوا أغبياء، بل افهموا ما هي مشيئة الرب."]]}, {"l": "Phi 1:9", "n": "", "vs": [[9, "وصلاتي لأجلكم هي هذه: أن تزداد محبتكم أكثر فأكثر في تمام المعرفة والإدراك،"]]}, {"l": "Col 1:9", "n": "", "vs": [[9, "لذلك نحن أيضا، من اليوم الذي فيه سمعنا بأخباركم، مازلنا نصلي ونتضرع لأجلكم، لأن تمتلئوا من تمام المعرفة لمشيئة الله في كل حكمة وإدراك روحي،"]]}, {"l": "1Pe 3:7", "n": "", "vs": [[7, "وأنتم، أيها الأزواج، إذ تساكنون زوجاتكم عالمين بأنهن أضعف منكم، أكرموهن باعتبارهن شريكات لكم في وراثة نعمة الحياة، لكي لا يعوق صلواتكم شيء."]]}], "kwAr": "المعرفة", "noteAr": ""}], "arS": [["فمن أجل ذلك، عليكم أن ", []], ["تبذلوا", ["G3923"]], [" ", []], ["كل", ["G3956"]], [" ", []], ["اجتهاد", ["G4710"]], [" ونشاط في ممارسة ", []], ["إيمانكم", ["G4102"]], [" حتى يؤدي بكم إلى ", []], ["الفضيلة", ["G703"]], [". ", []], ["واقرنوا", ["G2023"]], [" ", []], ["الفضيلة", ["G703"]], [" بالتقدم في ", []], ["المعرفة", ["G1108"]], ["،", []]]}, {"c": 1, "v": 6, "text": "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،", "groups": [{"kw": "temperance", "raw": "Act_24:25; 1Co_9:25; Gal_5:23; Tit_1:8, Tit_2:2", "note": "", "refs": [{"l": "Act 24:25", "n": "", "vs": [[25, "ولما تحدث بولس عن البر وضبط النفس والدينونة الآتية ارتعب فيلكس، وقال لبولس: «اذهب الآن، ومتى توفر لي الوقت أستدعيك ثانية»."]]}, {"l": "1Co 9:25", "n": "", "vs": [[25, "وكل متبار يفرض على نفسه تدريبا صارما في شتى المجالات. فهؤلاء المتبارون يفعلون ذلك ليفوزوا بإكليل فان، وأما نحن فلنفوز بإكليل غير فان."]]}, {"l": "Gal 5:23", "n": "", "vs": [[23, "والوداعة وضبط النفس. وليس من قانون يمنع مثل هذه الفضائل."]]}, {"l": "Tit 1:8", "n": "", "vs": [[8, "بل مضيافا، محبا للصلاح، رزينا، بارا، تقيا، مالكا لطبعه،"]]}, {"l": "Tit 2:2", "n": "", "vs": [[2, "أن يكون الشيوخ ذوي رزانة ووقار، متعقلين، صحيحي الإيمان والمحبة والصبر."]]}], "kwAr": "ضبط النفس", "noteAr": ""}, {"kw": "patience", "raw": "Psa_37:7; Luk_8:15, Luk_21:19; Rom_2:7, Rom_5:3, Rom_5:4, Rom_8:25, Rom_15:4; 2Co_6:4; Col_1:11; 1Th_1:3; 2Th_1:4, 2Th_3:5; Heb_6:12, Heb_6:15, Heb_10:36, Heb_12:1; Jam_1:3, Jam_1:4, Jam_5:7-10; Rev_1:9, Rev_2:2, Rev_13:10, Rev_14:12", "note": "", "refs": [{"l": "Psa 37:7", "n": "", "vs": [[7, "اسكن أمام الرب وانتظره بصبر، ولا تغر من الذي ينجح في مسعاه، بفضل مكائده."]]}, {"l": "Luk 8:15", "n": "", "vs": [[15, "وأما الذي وقع في الأرض الجيدة، فهم الذين يسمعون الكلمة ويحفظونها في قلب جيد مستقيم، وينتجون ثمرا بالصبر."]]}, {"l": "Luk 21:19", "n": "", "vs": [[19, "فباحتمالكم تربحون أنفسكم!"]]}, {"l": "Rom 2:7", "n": "", "vs": [[7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"]]}, {"l": "Rom 5:3", "n": "", "vs": [[3, "ليس هذا فقط، بل نفتخر أيضا في وسط الضيقات، لعلمنا أن الضيق ينتج فينا الصبر،"]]}, {"l": "Rom 5:4", "n": "", "vs": [[4, "والصبر يؤهلنا للفوز في الامتحان، والفوز يبعث فينا الرجاء،"]]}, {"l": "Rom 8:25", "n": "", "vs": [[25, "ولكن، إن كنا نرجو ما لا نراه، فبالصبر نتوقعه."]]}, {"l": "Rom 15:4", "n": "", "vs": [[4, "فإن كل ما سبق أن كتب فإنما كتب لتعليمنا، حتى يكون لنا رجاء بما في الكتاب من الصبر والعزاء."]]}, {"l": "2Co 6:4", "n": "", "vs": [[4, "وإنما نتصرف في كل شيء بما يبين أننا فعلا خدام الله: في تحمل الكثير؛ في الشدائد والحاجات والضيقات والجلدات"]]}, {"l": "Col 1:11", "n": "", "vs": [[11, "متشددين بكل قوة موافقة لقدرة مجده، لتتمكنوا تماما من الاحتمال وطول البال،"]]}, {"l": "1Th 1:3", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"]]}, {"l": "2Th 1:4", "n": "", "vs": [[4, "حتى إننا، نحن أنفسنا، نفتخر بكم في كنائس الله بسبب ثباتكم وإيمانكم في وسط كل ما تحتملونه من اضطهادات وضيقات."]]}, {"l": "2Th 3:5", "n": "", "vs": [[5, "وليهد الله قلوبكم إلى ما لدى الله من المحبة ولدى المسيح من الصبر!"]]}, {"l": "Heb 6:12", "n": "", "vs": [[12, "وذلك حتى لا تتكاسلوا، بل تقتدوا بالذين يرثون ما وعد الله به، عن طريق الإيمان والصبر."]]}, {"l": "Heb 6:15", "n": "", "vs": [[15, "وهكذا، انتظر إبراهيم بصبر فنال ما وعد به."]]}, {"l": "Heb 10:36", "n": "", "vs": [[36, "إنكم تحتاجون إلى الصبر لتعملوا إرادة الله، فتنالوا البركة التي وعدتم بها."]]}, {"l": "Heb 12:1", "n": "", "vs": [[1, "فبما أن هذا العدد الكبير من الشاهدين للإيمان، يتجمع حولنا كأنه سحابة عظيمة، فلنطرح جانبا كل ثقل يعيقنا عن التقدم، ونتخلص من تلك الخطيئة التي نتعرض للسقوط في فخها بسهولة، لكي نتمكن، نحن أيضا، أن نركض باجتهاد في السباق الممتد أمامنا،"]]}, {"l": "Jam 1:3", "n": "", "vs": [[3, "وكونوا على ثقة بأن امتحان إيمانكم هذا ينتج صبرا."]]}, {"l": "Jam 1:4", "n": "", "vs": [[4, "ودعوا الصبر يعمل عمله الكامل فيكم، لكي يكتمل نضوجكم وتصيروا أقوياء قادرين على مواجهة جميع الأحوال."]]}, {"l": "Jam 5:7-10", "n": "", "vs": [[7, "وأما أنتم، ياإخوتي، فاصبروا منتظرين عودة الرب. خذوا العبرة من الفلاح: فهو ينتظر أن تعطيه الأرض غلالا ثمينة، صابرا على الزرع حتى يشرب من مطر الخريف ومطر الربيع."], [8, "فاصبروا أنتم إذن، وشددوا قلوبكم لأن عودة الرب قد صارت قريبة."], [9, "أيها الإخوة، لا تتذمروا بعضكم على بعض، لكي لا يصدر الحكم ضدكم. تذكروا دائما أن الديان قريب جدا، إنه أمام الباب."], [10, "واقتدوا، ياإخوتي، في احتمال الآلام والصبر عليها، بالأنبياء الذين تكلموا باسم الرب."]]}, {"l": "Rev 1:9", "n": "", "vs": [[9, "أنا، يوحنا أخاكم وشريككم في الضيقة والملكوت والصبر في يسوع، كنت منفيا في الجزيرة التي تسمى بطمس، لأجل كلمة الله وشهادة يسوع."]]}, {"l": "Rev 2:2", "n": "", "vs": [[2, "إني عالم بأعمالك، وجهدك، وصبرك، وأعلم أنك لا تستطيع احتمال الأشرار، وأنك دققت في فحص ادعاءات أولئك الذين يزعمون أنهم رسل، وما هم برسل، فتبين لك أنهم دجالون!"]]}, {"l": "Rev 13:10", "n": "", "vs": [[10, "من ساق غيره إلى السبي، فإلى السبي سيساق؛ ومن قتل بالسيف، فبالسيف سيقتل! هنا يظهر صبر القديسين وإيمانهم."]]}, {"l": "Rev 14:12", "n": "", "vs": [[12, "وهنا يظهر صبر القديسين الذين يحافظون على وصايا الله والإيمان بيسوع!»"]]}], "kwAr": "الصبر", "noteAr": ""}, {"kw": "godliness", "raw": "2Pe_1:3, 2Pe_3:11; Gen_5:24; Isa_57:1; 1Ti_2:2, 1Ti_2:10, 1Ti_3:16, 1Ti_4:7, 1Ti_4:8, 1Ti_6:3, 1Ti_6:6, 1Ti_6:11; 2Ti_3:5; Tit_1:1", "note": "", "refs": [{"l": "2Pe 1:3", "n": "", "vs": [[3, "إن الله، بقدرته الإلهية، قد زودنا بكل ما نحتاج إليه في الحيا ة الروحية المتصفة بالتقوى. ذلك أنه عرفنا بالمسيح الذي دعانا إلى مجده وفضيلته،"]]}, {"l": "2Pe 3:11", "n": "", "vs": [[11, "ومادامت هذه الأشياء جميعا ستنحل، فكيف يجب أن تكونوا أنتم أصحاب سلوك مقدس يتصف بالتقوى،"]]}, {"l": "Gen 5:24", "n": "", "vs": [[24, "وسار أخنوخ مع الله، ثم توارى من الوجود، لأن الله نقله إليه."]]}, {"l": "Isa 57:1", "n": "", "vs": [[1, "هلك الصديق فلم يتأمل أحد في نفسه ويعتبر، ومات الأتقياء ولم يدرك أحد أن الصديق قد أخذ تفاديا للكارثة."]]}, {"l": "1Ti 2:2", "n": "", "vs": [[2, "ولأجل الملوك وأصحاب السلطة، لكي نعيش حياة مطمئنة هادئة كلية التقوى والرصانة."]]}, {"l": "1Ti 2:10", "n": "", "vs": [[10, "بل بما يليق بنساء يعترفن علنا بأنهن يعشن في تقوى الله، بالأعمال الصالحة!"]]}, {"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}, {"l": "1Ti 4:7", "n": "", "vs": [[7, "أما أساطير العجائز المبتذلة، فتجنبها. إنما مرن نفسك في طريق التقوى."]]}, {"l": "1Ti 4:8", "n": "", "vs": [[8, "فالرياضة البدنية نافعة بعض الشيء. أما التقوى فنافعة لكل شيء، لأن فيها وعدا بالحياة الحاضرة والآتية."]]}, {"l": "1Ti 6:3", "n": "", "vs": [[3, "أما إذا كان أحد يعلم ما يخالفها ولا يذعن للكلام الصحيح، كلام ربنا يسوع المسيح، وللتعليم الموافق للتقوى،"]]}, {"l": "1Ti 6:6", "n": "", "vs": [[6, "أما التقوى مع القناعة فهي تجارة عظيمة."]]}, {"l": "1Ti 6:11", "n": "", "vs": [[11, "وأما أنت، ياإنسان الله، فاهرب من هذه الأمور، واسع في إثر البر والتقوى والإيمان والمحبة والصبر والوداعة."]]}, {"l": "2Ti 3:5", "n": "", "vs": [[5, "لهم من التقوى مظهرها ولكنهم لقوتها منكرون، فعن هؤلاء الناس ابتعد!"]]}, {"l": "Tit 1:1", "n": "", "vs": [[1, "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"]]}], "kwAr": "التقوى", "noteAr": ""}], "arS": [["والمعرفة", ["G1108"]], [" ", []], ["بضبط النفس", ["G1466"]], ["، ", []], ["وضبط النفس", ["G1466"]], [" ", []], ["بالصبر", ["G5281"]], ["، ", []], ["والصبر", ["G5281"]], [" ", []], ["بالتقوى", ["G2150"]], ["،", []]]}, {"c": 1, "v": 7, "text": "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة.", "groups": [{"kw": "brotherly", "raw": "Joh_13:34, Joh_13:35; Rom_12:10; 1Th_3:12, 1Th_4:9, 1Th_4:10; Heb_13:1; 1Pe_1:22, 1Pe_2:17; 1Jo_3:14, 1Jo_3:16", "note": "", "refs": [{"l": "Joh 13:34", "n": "", "vs": [[34, "وصية جديدة أنا أعطيكم: أحبوا بعضكم بعضا، كما أحببتكم أنا، تحبون بعضكم."]]}, {"l": "Joh 13:35", "n": "", "vs": [[35, "بهذا يعرف الجميع أنكم تلاميذي: إن كنتم تحبون بعضكم بعضا»."]]}, {"l": "Rom 12:10", "n": "", "vs": [[10, "أحبوا بعضكم بعضا محبة أخوية، مفضلين بعضكم على بعض في الكرامة."]]}, {"l": "1Th 3:12", "n": "", "vs": [[12, "وليجعلكم الرب تنمون وتفيضون في المحبة لتحبوا بعضكم بعضا وجميع الناس كمحبتنا لكم،"]]}, {"l": "1Th 4:9", "n": "", "vs": [[9, "أما المحبة الأخوية، فلستم في حاجة لأن أكتب إليكم عنها، لأنكم بأنفسكم قد تعلمتم من الله أن تحبوا بعضكم بعضا،"]]}, {"l": "1Th 4:10", "n": "", "vs": [[10, "ولأنكم أيضا هكذا تعاملون جميع الإخوة في مقاطعة مقدونية كلها. وإنما نحرضكم، أيها الإخوة، أن تضاعفوا ذلك أكثر فأكثر،"]]}, {"l": "Heb 13:1", "n": "", "vs": [[1, "اثبتوا على المحبة الأخوية."]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}, {"l": "1Pe 2:17", "n": "", "vs": [[17, "أكرموا جميع الناس. أحبوا الإخوة. خافوا الله . أكرموا الملك."]]}, {"l": "1Jo 3:14", "n": "", "vs": [[14, "إن محبتنا لإخوتنا تبين لنا أننا انتقلنا من الموت إلى الحياة. فالذي لا يحب إخوته، فهو باق في الموت."]]}, {"l": "1Jo 3:16", "n": "", "vs": [[16, "ومقياس المحبة هو العمل الذي قام به المسيح إذ بذل حياته لأجلنا. فعلينا نحن أيضا أن نبذل حياتنا لأجل إخوتنا."]]}], "kwAr": "المودة الأخوية", "noteAr": ""}, {"kw": "charity", "raw": "1Co_13:1-8; Gal_6:10; Col_3:14; 1Th_5:15; 1Pe_3:8; 1Jo_4:21", "note": "", "refs": [{"l": "1Co 13:1-8", "n": "", "vs": [[1, "... لو كنت أتكلم بلغات الناس والملائكة وليس عندي محبة، لما كنت إلا نحاسا يطن وصنجا يرن!"], [2, "ولو كانت لي موهبة النبوءة، وكنت عالما بجميع الأسرار والعلم كله، وكان عندي الإيمان كله حتى أنقل الجبال، وليس عندي محبة، فلست شيئا!"], [3, "ولو قدمت أموالي كلها للإطعام، وسلمت جسدي لأحرق، وليس عندي محبة، لما كنت أنتفع شيئا."], [4, "المحبة تصبر طويلا؛ وهي لطيفة. المحبة لا تحسد. المحبة لا تتفاخر ولا تتكبر."], [5, "لا تتصرف بغير لياقة، ولا تسعى إلى مصلحتها الخاصة. لا تستفز سريعا، ولا تنسب الشر لأحد."], [6, "لا تفرح بالظلم، بل تفرح بالحق."], [7, "إنها تستر كل شيء، وتصدق كل شيء، وترجو كل شيء، وتتحمل كل شيء."], [8, "المحبة لا تزول أبدا. أما مواهب النبوآت فستزال، ومواهب اللغات ستنقطع، والمعرفة ستزال."]]}, {"l": "Gal 6:10", "n": "", "vs": [[10, "فمادامت لنا الفرصة إذن، فلنعمل الخير للجميع، وخصوصا لأهل الإيمان."]]}, {"l": "Col 3:14", "n": "", "vs": [[14, "وفوق هذا كله البسوا المحبة، فهي رابطة الكمال."]]}, {"l": "1Th 5:15", "n": "", "vs": [[15, "حذار أن يبادل أحدكم شر غيره بشر مثله بل اسعوا دائما إلى الخير في معاملتكم بعضكم لبعض وللآخرين جميعا."]]}, {"l": "1Pe 3:8", "n": "", "vs": [[8, "والخلاصة، كونوا جميعا متحدين في الرأي، متعاطفين بعضكم مع بعض، مبادلين أحدكم الآخر المحبة الأخوية، شفوقين، متواضعين."]]}, {"l": "1Jo 4:21", "n": "", "vs": [[21, "فهذه الوصية جاءتنا من المسيح نفسه: من يحب الله ، يحب أخاه!"]]}], "kwAr": "المحبة", "noteAr": ""}], "arS": [["والتقوى", ["G2150"]], [" ", []], ["بالمودة الأخوية", ["G5360"]], ["، ", []], ["والمودة الأخوية", ["G5360"]], [" ", []], ["بالمحبة", ["G26"]], [".", []]]}, {"c": 1, "v": 8, "text": "فحين تكون هذه الصفات الطيبة في داخلكم، وتزداد بوفرة، تجعلكم مجتهدين ومثمرين في معرفتكم لربنا يسوع المسيح.", "groups": [{"kw": "in you", "raw": "Joh_5:42; 2Co_9:14, 2Co_13:5; Phi_2:5; Col_3:16; Phm_1:6", "note": "", "refs": [{"l": "Joh 5:42", "n": "", "vs": [[42, "ولكني أعرفكم، وأعرف أن محبة الله ليست في نفوسكم."]]}, {"l": "2Co 9:14", "n": "", "vs": [[14, "كما يرفعون الدعاء لأجلكم، متشوقين إليكم، بسبب نعمة الله الفائقة التي ظهرت فيكم."]]}, {"l": "2Co 13:5", "n": "", "vs": [[5, "لذلك امتحنوا أنفسكم لتروا هل أنتم في الإيمان. اختبروا أنفسكم. ألستم تعرفون أنفسكم، أن يسوع المسيح فيكم، إلا إذا تبين أنكم فاشلون؟"]]}, {"l": "Phi 2:5", "n": "", "vs": [[5, "فليكن فيكم هذا الفكر الذي هو أيضا في المسيح يسوع."]]}, {"l": "Col 3:16", "n": "", "vs": [[16, "لتسكن كلمة المسيح في داخلكم بغنى، في كل حكمة، معلمين وواعظين بعضكم بعضا، مرنمين بمزامير وتسابيح وأناشيد روحية في قلوبكم لله، رافعين له الحمد."]]}, {"l": "Phm 1:6", "n": "", "vs": [[6, "طالبا أن يكون اشتراكك معنا في الإيمان فعالا، فتدرك إلى التمام ما فينا من كل صلاح لأجل المسيح."]]}], "kwAr": "في داخلكم", "noteAr": ""}, {"kw": "and abound", "raw": "1Co_15:58; 2Co_8:2, 2Co_8:7; Phi_1:9; Col_2:7, Col_3:16; 1Th_3:12, 1Th_4:1; 2Th_1:3", "note": "", "refs": [{"l": "1Co 15:58", "n": "", "vs": [[58, "إذن، ياإخوتي الأحباء، كونوا راسخين غير متزحزحين، كثيري الاجتهاد في عمل الرب دائما، عالمين أن جهدكم في الرب ليس عبثا!"]]}, {"l": "2Co 8:2", "n": "", "vs": [[2, "فمع أنهم كانوا في تجربة ضيقة شديدة، فإن فرحهم الوافر مع فقرهم الشديد فاضا فأنتجا منهم سخاء غنيا."]]}, {"l": "2Co 8:7", "n": "", "vs": [[7, "ولكن، كما أنكم في وفرة من كل شيء: من الإيمان، والكلمة، والمعرفة، والاجتهاد في كل أمر، ومحبتكم لنا، ليتكم تكونون أيضا في وفرة من نعمة العطاء هذه."]]}, {"l": "Phi 1:9", "n": "", "vs": [[9, "وصلاتي لأجلكم هي هذه: أن تزداد محبتكم أكثر فأكثر في تمام المعرفة والإدراك،"]]}, {"l": "Col 2:7", "n": "", "vs": [[7, "وأنتم متأصلون ومبنيون فيه وراسخون في الإيمان الموافق لما تعلمتم وفائضون بالشكر."]]}, {"l": "Col 3:16", "n": "", "vs": [[16, "لتسكن كلمة المسيح في داخلكم بغنى، في كل حكمة، معلمين وواعظين بعضكم بعضا، مرنمين بمزامير وتسابيح وأناشيد روحية في قلوبكم لله، رافعين له الحمد."]]}, {"l": "1Th 3:12", "n": "", "vs": [[12, "وليجعلكم الرب تنمون وتفيضون في المحبة لتحبوا بعضكم بعضا وجميع الناس كمحبتنا لكم،"]]}, {"l": "1Th 4:1", "n": "", "vs": [[1, "وبعد، أيها الإخوة، فمثلما تلقيتم منا كيف يجب أن تسلكوا سلوكا يرضي الله ، وكما أنتم فاعلون، نرجو منكم ونحرضكم في الرب يسوع أن تضاعفوا تقدمكم في ذلك أكثر فأكثر."]]}, {"l": "2Th 1:3", "n": "", "vs": [[3, "من واجبنا أن نشكر الله على الدوام لأجلكم أيها الإخوة. كما أن هذا حق: لأن إيمانكم ينمو نموا فائقا، ومحبة أحدكم للآخر تفيض بينكم جميعا."]]}], "kwAr": "وتزداد بوفرة", "noteAr": ""}, {"kw": "they", "raw": "Joh_15:7, Joh_15:8; 2Co_5:13-17", "note": "", "refs": [{"l": "Joh 15:7", "n": "", "vs": [[7, "ولكن، إن ثبتم في، وثبت كلامي فيكم، فاطلبوا ما تريدون يكن لكم."]]}, {"l": "Joh 15:8", "n": "", "vs": [[8, "بهذا يتمجد أبي: أن تنتجوا ثمرا كثيرا فتكونون حقا تلاميذي."]]}, {"l": "2Co 5:13-17", "n": "", "vs": [[13, "أترانا فقدنا صوابنا؟ إن ذلك لأجل الله. أم ترانا متعقلين؟ إن ذلك لأجلكم."], [14, "فإن محبة المسيح تسيطر علينا، وقد حكمنا بهذا: مادام واحد قد مات عوضا عن الجميع، فمعنى ذلك أن الجميع ماتوا؛"], [15, "وهو قد مات عوضا عن الجميع حتى لا يعيش الأحياء في ما بعد لأنفسهم بل للذي مات عوضا عنهم ثم قام."], [16, "إذن، نحن منذ الآن لا نعرف أحدا معرفة بشرية. ولكن إن كنا قد عرفنا المسيح معرفة بشرية، فنحن الآن لا نعرفه هكذا بعد."], [17, "فإنه إذا كان أحد في المسيح، فهو خليقة جديدة: إن الأشياء القديمة قد زالت، وها كل شيء قد صار جديدا."]]}], "kwAr": "تجعلكم", "noteAr": ""}, {"kw": "barren", "raw": "or, idle, Pro_19:15; Mat_20:3, Mat_20:6, Mat_25:26; Rom_12:11; 1Ti_5:13; Heb_6:12", "note": "or, idle, Pro_19:15; Mat_20:3, Mat_20:6, Mat_25:26; Rom_12:11; 1Ti_5:13; Heb_6:12", "refs": [{"l": "Pro 19:15", "n": "", "vs": [[15, "الكسل يغرق في سبات عميق، والنفس المتقاعسة تقاسي من الجوع."]]}, {"l": "Mat 20:3", "n": "", "vs": [[3, "ثم خرج نحو الساعة التاسعة صباحا، فلقي في ساحة المدينة عمالا آخرين بلا عمل،"]]}, {"l": "Mat 20:6", "n": "", "vs": [[6, "ونحو الساعة الخامسة بعد الظهر، خرج أيضا فلقي عمالا آخرين بلا عمل، فسألهم: لماذا تقفون هنا طول النهار بلا عمل؟"]]}, {"l": "Mat 25:26", "n": "", "vs": [[26, "فأجابه سيده: أيها العبد الشرير الكسول! عرفت أني أحصد من حيث لم أزرع، وأجمع من حيث لم أبذر،"]]}, {"l": "Rom 12:11", "n": "", "vs": [[11, "لا تتكاسلوا في الاجتهاد، بل كونوا ملتهبين في الروح، عبيدا خادمين للرب،"]]}, {"l": "1Ti 5:13", "n": "", "vs": [[13, "وفي الوقت نفسه يتعودن البطالة والتنقل من بيت إلى بيت. ولا تكفيهن البطالة، بل ينصرفن أيضا إلى الثرثرة والتشاغل بما لا يعنيهن والتحدث بأمور غير لائقة."]]}, {"l": "Heb 6:12", "n": "", "vs": [[12, "وذلك حتى لا تتكاسلوا، بل تقتدوا بالذين يرثون ما وعد الله به، عن طريق الإيمان والصبر."]]}], "kwAr": "مجتهدين", "noteAr": "أو: متكاسلين."}, {"kw": "unfruitful", "raw": "Mat_13:22; Joh_15:2, Joh_15:6; Tit_3:14", "note": "", "refs": [{"l": "Mat 13:22", "n": "", "vs": [[22, "أما المزروع بين الأشواك، فهو الذي يسمع الكلمة، ولكن هم الزمان الحاضر وخداع الغنى يخنقان الكلمة، فلا يعطي ثمرا."]]}, {"l": "Joh 15:2", "n": "", "vs": [[2, "كل غصن في لا ينتج ثمرا يقطعه؛ وكل غصن ينتج ثمرا ينقيه لينتج مزيدا من الثمر."]]}, {"l": "Joh 15:6", "n": "", "vs": [[6, "إن كان أحد لا يثبت في يطرح خارجا كالغصن فيجف؛ ثم تجمع الأغصان الجافة، وتطرح في النار فتحترق."]]}, {"l": "Tit 3:14", "n": "", "vs": [[14, "وليتعلم ذوونا أيضا أن يمارسوا أعمالا حسنة، لسد الحاجات الضرورية، لكي لا يكونوا عديمي الثمر."]]}], "kwAr": "مثمرين", "noteAr": ""}, {"kw": "in", "raw": "2Pe_1:2", "note": "", "refs": [{"l": "2Pe 1:2", "n": "", "vs": [[2, "ليكن لكم المزيد من النعمة والسلام بفضل معرفة الله ويسوع ربنا!"]]}], "kwAr": "في معرفتكم لربنا", "noteAr": ""}], "arS": [["فحين تكون هذه ", []], ["الصفات", ["G5023"]], [" الطيبة في داخلكم، ", []], ["وتزداد بوفرة", ["G4121"]], ["، ", []], ["تجعلكم", ["G2525"]], [" ", []], ["مجتهدين", ["G692"]], [" ", []], ["ومثمرين", ["G175"]], [" في ", []], ["معرفتكم", ["G1922"]], [" ", []], ["لربنا", ["G2962", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 1, "v": 9, "text": "أما الذي لا يملك هذه الصفات، فهو أعمى روحيا. إنه قصير البصر، قد نسي أنه تطهر من خطاياه القديمة!", "groups": [{"kw": "lacketh", "raw": "2Pe_1:5-7; Mar_10:21; Luk_18:22; Gal_5:6, Gal_5:13; Jam_2:14-26", "note": "", "refs": [{"l": "2Pe 1:5-7", "n": "", "vs": [[5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"], [6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"], [7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."]]}, {"l": "Mar 10:21", "n": "", "vs": [[21, "وإذ نظر يسوع إليه، أحبه، وقال له: «ينقصك شيء واحد: اذهب، بع كل ما عندك، ووزع على الفقراء، فيكون لك كنز في السماء، ثم تعال اتبعني»."]]}, {"l": "Luk 18:22", "n": "", "vs": [[22, "فلما سمع يسوع هذا، قال له: «ينقصك شيء واحد: بع كل ما عندك، ووزع على الفقراء، فيكون لك كنز في السماوات. ثم تعال اتبعني!»"]]}, {"l": "Gal 5:6", "n": "", "vs": [[6, "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة."]]}, {"l": "Gal 5:13", "n": "", "vs": [[13, "فإنما إلى الحرية قد دعيتم، أيها الإخوة؛ ولكن لا تتخذوا من الحرية ذريعة لإرضاء الجسد، بل بالمحبة كونوا عبيدا في خدمة أحدكم الآخر."]]}, {"l": "Jam 2:14-26", "n": "", "vs": [[14, "ياإخوتي، هل ينفع أحدا أن يدعي أنه مؤمن، وليس له أعمال تثبت ذلك، هل يقدر إيمان مثل هذا أن يخلصه؟"], [15, "لنفرض أن أخا أو أختا كانا بحاجة شديدة إلى الثياب والطعام اليومي،"], [16, "وقال لهما أحدكم: «أتمنى لكما كل خير. البسا ثيابا دافئة، وكلا طعاما جيدا!» دون أن يقدم لهما ما يحتاجان إليه من ثياب وطعام، فأي نفع في ذلك؟"], [17, "هكذا نرى أن الإيمان وحده ميت ما لم تنتج عنه أعمال."], [18, "وربما قال أحدكم: «أنت لك إيمان وأنا لي أعمال». أرني كيف يكون إيمانك من غير أعمال، وأنا أريك كيف يكون إيماني بأعمالي."], [19, "أنت تؤمن أن الله واحد؟ حسنا تفعل ! والشياطين أيضا تؤمن بهذه الحقيقة، ولكنها ترتعد خوفا."], [20, "وهذا يؤكد لك، أيها الإنسان الغبي، أن الإيمان الذي لا تنتج عنه أعمال هو إيمان ميت!"], [21, "لنأخذ أبانا إبراهيم مثلا: كيف تبرر؟ أليس بأعماله، إذ أصعد ابنه إسحاق على المذبح"], [22, "فأنت ترى أن إيمان إبراهيم قد رافقته الأعمال. فبالأعمال قد اكتمل الإيمان."], [23, "وهكذا، تم ما قاله الكتاب: «آمن إبراهيم بالله، فحسب له ذلك برا»، حتى إنه دعي «خليل الله»."], [24, "فترون إذن أن الإنسان لا يتبرر بإيمانه فقط، بل بأعماله أيضا."], [25, "على هذا الأساس أيضا، تبررت راحاب التي كانت زانية: فقد استقبلت الرجلين اللذين أرسلا إليها، وصرفتهما في طريق آخر."], [26, "فكما أن جسم الإنسان يكون ميتا إذا فارقته الروح، كذلك يكون الإيمان ميتا إذا لم ترافقه الأعمال!"]]}], "kwAr": "لا يملك هذه الصفات", "noteAr": ""}, {"kw": "blind", "raw": "Joh_9:40,Joh_9:41; 2Co_4:3, 2Co_4:4; 1Jo_2:9-11; Rev_3:17", "note": "", "refs": [{"l": "Joh 9:40", "n": "", "vs": [[40, "فسمع ذلك بعض الفريسيين الذين كانوا معه فسألوه: «وهل نحن أيضا عميان؟»"]]}, {"l": "Joh 9:41", "n": "", "vs": [[41, "فأجابهم يسوع: «لو كنتم عميانا بالفعل، لما كانت عليكم خطيئة. ولكنكم تدعون أنكم تبصرون، ولذلك فإن خطيئتكم باقية...»"]]}, {"l": "2Co 4:3", "n": "", "vs": [[3, "ولكن إن كان إنجيلنا محجوبا، فإنما هو محجوب لدى الهالكين، لدى غير المؤمنين"]]}, {"l": "2Co 4:4", "n": "", "vs": [[4, "الذين أعمى إله هذا العالم أذهانهم حتى لا يضيء لهم نور الإنجيل المختص بمجد المسيح الذي هو صورة الله."]]}, {"l": "1Jo 2:9-11", "n": "", "vs": [[9, "من ادعى أنه يحيا في النور، ولكنه يبغض أحد إخوته، فهو مازال حتى الآن في الظلام."], [10, "فالذي يحب إخوته، هو الذي يحيا في النور فعلا ولا شيء يسقطه."], [11, "أما الذي يبغض أحد إخوته، فهو تائه في الظلام، يتلمس طريقه ولا يعرف أين يتجه، لأن الظلام قد أعمى عينيه!"]]}, {"l": "Rev 3:17", "n": "", "vs": [[17, "تقول: أنا غني، قد اغتنيت ولا يعوزني شيء! ولكنك لا تعلم أنك شقي بائس فقير أعمى عريا ن."]]}], "kwAr": "أعمى روحيا", "noteAr": ""}, {"kw": "that he", "raw": "2Pe_1:4, 2Pe_2:18-20; Rom_6:1-4, Rom_6:11; Eph_5:26; Heb_9:14; 1Pe_3:21; 1Jo_1:7", "note": "", "refs": [{"l": "2Pe 1:4", "n": "", "vs": [[4, "اللذين بهما أعطانا الله بركاته العظمى الثمينة التي كان قد وعد بها. وبهذا صار بإمكانكم أن تتخلصوا من الفساد الذي تنشره الشهوة في العالم، وتشتركوا في الطبيعة الإلهية."]]}, {"l": "2Pe 2:18-20", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."], [19, "يعدون هؤلاء بالحرية، وهم أنفسهم عبيد للفساد! لأن الإنسان يصير عبدا لكل ما يتسلط عليه ويغلبه."], [20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."]]}, {"l": "Rom 6:1-4", "n": "", "vs": [[1, "إذن ماذا نقول؟ أنستمر في الخطيئة لكي تتوافر النعمة؟"], [2, "حاشا! فنحن الذين متنا بالنسبة للخطيئة، كيف نعيش بعد فيها؟"], [3, "أم يخفى عليكم أننا جميعا، نحن الذين تعمدنا اتحادا بالمسيح يسوع، قد تعمدنا اتحادا بموته؟"], [4, "وبسبب ذلك دفنا معه بالمعمودية للموت، حتى كما أقيم المسيح من الأموات بمجد الآب، كذلك نسلك نحن أيضا في حياة جديدة."]]}, {"l": "Rom 6:11", "n": "", "vs": [[11, "فكذلك أنتم أيضا، احسبوا أنفسكم أمواتا بالنسبة للخطيئة وأحياء لله في المسيح يسوع."]]}, {"l": "Eph 5:26", "n": "", "vs": [[26, "لكي يقدسها مطهرا إياها بغسل الماء، بالكلمة،"]]}, {"l": "Heb 9:14", "n": "", "vs": [[14, "فكم بالأحرى دم المسيح الذي قدم نفسه لله بروح أزلي ذبيحة لا عيب فيها، يطهر ضمائرنا من الأعمال الميتة لنعبد الله الحي."]]}, {"l": "1Pe 3:21", "n": "", "vs": [[21, "وعملية النجاة هذه مصورة في المعمودية التي لا نقصد بها أن نغتسل من أوساخ أجسامنا، بل هي تعهد ضمير صالح أمام الله بفضل قيامة يسوع المسيح،"]]}, {"l": "1Jo 1:7", "n": "", "vs": [[7, "ولكن، إن كنا فعلا نعيش في النور، كما هو في النور، تكون لنا حقا شركة بعضنا مع بعض، ودم ابنه يسوع يطهرنا من كل خطيئة."]]}], "kwAr": "تطهر من خطاياه القديمة", "noteAr": ""}], "arS": [["أما الذي ", []], ["لا يملك", ["G3918", "G3361"]], [" هذه ", []], ["الصفات", ["G5023"]], ["، فهو ", []], ["أعمى", ["G5185"]], [" روحيا. إنه ", []], ["قصير البصر", ["G3467"]], ["، قد ", []], ["نسي", ["G2983", "G3024"]], [" أنه ", []], ["تطهر", ["G2512"]], [" من ", []], ["خطاياه", ["G266"]], [" ", []], ["القديمة", ["G3819"]], ["!", []]]}, {"c": 1, "v": 10, "text": "فأحرى بكم إذن، أيها الإخوة، أن تجتهدوا لتثبتوا عمليا أن الله قد دعاكم واختاركم حقا. فإنكم، إن فعلتم هذا، لن تسقطوا أبدا!", "groups": [{"kw": "give", "raw": "2Pe_1:5, 2Pe_3:17", "note": "", "refs": [{"l": "2Pe 1:5", "n": "", "vs": [[5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"]]}, {"l": "2Pe 3:17", "n": "", "vs": [[17, "أما أنتم أيها الأحباء، فإذ قد تنبهتم إلى الخطر قبل حدوثه، احذروا أن تسقطوا عن ثباتكم بالانجراف وراء ضلال الأشرار."]]}], "kwAr": "تجتهدوا", "noteAr": ""}, {"kw": "to make", "raw": "2Ti_2:19; Heb_6:11, Heb_6:19; 1Jo_3:19-21", "note": "", "refs": [{"l": "2Ti 2:19", "n": "", "vs": [[19, "إلا أن الأساس الراسخ الذي وضعه الله يظل ثابتا، وعليه هذا الختم: «الرب يعرف خاصته»، وأيضا: «لينفصل عن الإثم كل من يسمي اسم الرب!»"]]}, {"l": "Heb 6:11", "n": "", "vs": [[11, "وإنما نتمنى أن يظهر كل واحد منكم اجتهادا مماثلا في المحافظة حتى النهاية على الثقة الكاملة بالرجاء."]]}, {"l": "Heb 6:19", "n": "", "vs": [[19, "هذا الرجاء هو لنا بمثابة مرساة أمينة ثابتة تشد نفوسنا إلى ما وراء الحجاب السماوي."]]}, {"l": "1Jo 3:19-21", "n": "", "vs": [[19, "عندئذ نتأكد أننا نتصرف بحسب الحق، وتطمئن نفوسنا في حضرة الله،"], [20, "ولو لامتنا قلوبنا؛ فإن الله أعظم من قلوبنا، وهو العليم بكل شيء."], [21, "أيها الأحباء، إذا كانت ضمائرنا لا تلومنا. فهذا دليل على أن لنا ثقة عظيمة من نحو الله."]]}], "kwAr": "لتثبتوا", "noteAr": ""}, {"kw": "election", "raw": "Rom_8:28-31; 1Th_1:3, 1Th_1:4; 2Th_2:13, 2Th_2:14; 1Pe_1:2", "note": "", "refs": [{"l": "Rom 8:28-31", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."], [29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."], [30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."], [31, "فبعد هذا، ماذا نقول؟ مادام الله معنا، فمن يكون علينا؟ ذاك الذي لم يمسك عنا ابنه،"]]}, {"l": "1Th 1:3", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"]]}, {"l": "1Th 1:4", "n": "", "vs": [[4, "ونحن عالمون، أيها الإخوة أحباء الله، حقيقة اختياركم من قبل الله:"]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "2Th 2:14", "n": "", "vs": [[14, "فإلى هذا الأمر قد دعاكم ببشارتنا لكم، لنوال مجد ربنا يسوع المسيح."]]}, {"l": "1Pe 1:2", "n": "", "vs": [[2, "بحسب علمه السابق ثم قدسهم بالروح ليطيعوا يسوع المسيح ويطهروا برش دمه عليهم."]]}], "kwAr": "دعاكم واختاركم", "noteAr": ""}, {"kw": "if", "raw": "Psa_15:5; Isa_56:2; Mat_7:24, Mat_7:25; Luk_6:47-49; 1Jo_3:19; Rev_22:14", "note": "", "refs": [{"l": "Psa 15:5", "n": "", "vs": [[5, "لا يستثمر ماله بالربا، ولا يقبض رشوة للإيقاع بالبريء. الذي يصنع هذا لا يتزعزع أبدا."]]}, {"l": "Isa 56:2", "n": "", "vs": [[2, "طوبى لمن يمارس هذه ويعمل بها ويكرم سبوتي؛ وطوبى لمن يصون يده عن ارتكاب الشر."]]}, {"l": "Mat 7:24", "n": "", "vs": [[24, "فأي من يسمع أقوالي هذه ويعمل بها، أشبهه برجل حكيم بنى بيته على الصخر،"]]}, {"l": "Mat 7:25", "n": "", "vs": [[25, "فنزلت الأمطار، وجرت السيول، وهبت العواصف، فضربت ذلك البيت، فلم يسقط لأنه مؤسس على الصخر."]]}, {"l": "Luk 6:47-49", "n": "", "vs": [[47, "كل من يأتي إلي، فيسمع كلامي ويعمل به، أريكم من يشبه."], [48, "إنه يشبه إنسانا يبني بيتا، فحفر وعمق ووضع الأساس على الصخر. ثم هطل مطر غزير وصدم السيل ذلك البيت، فلم يقدر أن يزعزعه، لأنه كان مؤسسا على الصخر."], [49, "وأما من سمع ولم يعمل، فهو يشبه إنسانا بنى بيتا على الأرض دون أساس. فلما صدمه السيل، انهار في الحال؛ وكان خراب ذلك البيت جسيما! »"]]}, {"l": "1Jo 3:19", "n": "", "vs": [[19, "عندئذ نتأكد أننا نتصرف بحسب الحق، وتطمئن نفوسنا في حضرة الله،"]]}, {"l": "Rev 22:14", "n": "", "vs": [[14, "طوبى للذين يغسلون ثيابهم، فلهم السلطة على شجرة الحياة، والحق في دخول المدينة من الأبواب!"]]}], "kwAr": "إن فعلتم هذا", "noteAr": ""}, {"kw": "never", "raw": "2Pe_3:17; Psa_37:24, Psa_62:2, Psa_62:6, Psa_112:6, Psa_121:3; Mic_7:8; Act_20:24, Act_20:25; 1Pe_1:5; Rev_3:10,Rev_3:11", "note": "", "refs": [{"l": "2Pe 3:17", "n": "", "vs": [[17, "أما أنتم أيها الأحباء، فإذ قد تنبهتم إلى الخطر قبل حدوثه، احذروا أن تسقطوا عن ثباتكم بالانجراف وراء ضلال الأشرار."]]}, {"l": "Psa 37:24", "n": "", "vs": [[24, "إن تعثر لا يسقط، لأن الرب يسنده بيده."]]}, {"l": "Psa 62:2", "n": "", "vs": [[2, "هو وحده صخرتي وخلاصي وحصني المنيع، لذلك لا أتزعزع أبدا."]]}, {"l": "Psa 62:6", "n": "", "vs": [[6, "هو وحده صخرتي وخلاصي وحصني المنيع، لذلك لا أتزعزع أبدا."]]}, {"l": "Psa 112:6", "n": "", "vs": [[6, "فإنه لن يتزعزع أبدا. ذكر الصديق يخلد إلى الأبد."]]}, {"l": "Psa 121:3", "n": "", "vs": [[3, "لا يدع قدمك تزل. لا ينعس حافظك."]]}, {"l": "Mic 7:8", "n": "", "vs": [[8, "لا تشمتي بي ياعدوتي،
