eAr": ""}], "arS": [["لذلك", ["G1352"]], [" أنوي أن ", []], ["أذكركم", ["G5279"]], [" ", []], ["دائما", ["G104"]], [" بهذه الأمور، وإن كنتم ", []], ["عالمين", ["G1492"]], [" بها، ", []], ["وراسخين", ["G4741"]], [" في ", []], ["الحق", ["G225"]], [" الذي عندكم.", []]]}, {"c": 1, "v": 13, "text": "فمادمت في خيمة جسمي هذه، أرى من واجبي أن أنبهكم مذكرا.", "groups": [{"kw": "as long", "raw": "2Pe_1:14; 2Co_5:1-4, 2Co_5:8; Heb_13:3", "note": "", "refs": [{"l": "2Pe 1:14", "n": "", "vs": [[14, "فأنا أعلم أن خيمتي ستطوى بعد وقت قصير، كما سبق أن أعلن لي ربنا يسوع المسيح."]]}, {"l": "2Co 5:1-4", "n": "", "vs": [[1, "فإننا نعلم أنه متى تهدمت خيمتنا الأرضية التي نسكنها الآن، يكون لنا بناء من الله: بيت لم تصنعه أيدي البشر، أبدي في السماوات."], [2, "فالواقع أننا، ونحن في هذا المسكن، نئن متشوقين أن نلبس بدلا منه بيتنا السماوي،"], [3, "حتى إذا لبسناه لا نوجد عراة."], [4, "ذلك أننا، نحن الساكنين في هذه الخيمة، نئن كمن يحمل ثقلا، فنحن لا نريد أن نخلعها، بل أن نلبس فوقها مسكننا السماوي، فتبتلع الحياة ما هو مائت فينا."]]}, {"l": "2Co 5:8", "n": "", "vs": [[8, "فنحن واثقون إذن، وراضون بالأحرى أن نكون مغتربين عن الجسد ومقيمين عند الرب."]]}, {"l": "Heb 13:3", "n": "", "vs": [[3, "اهتموا دائما بالمسجونين، كأنكم مسجونون معهم. وتعاطفوا مع المظلومين، كأنكم مظلومون معهم."]]}], "kwAr": "فمادمت", "noteAr": ""}, {"kw": "to stir", "raw": "2Pe_3:1; Hag_1:14; 2Ti_1:6", "note": "", "refs": [{"l": "2Pe 3:1", "n": "", "vs": [[1, "أيها الأحباء، أنا الآن أكتب إليكم رسالتي الثانية. وفي كلتا الرسالتين، أقصد أن أنبه أذهانكم الصافية، مذكرا إياكم بحقائق تعرفونها."]]}, {"l": "Hag 1:14", "n": "", "vs": [[14, "وبث الرب الهمة في نفس زربابل بن شألتيئيل حاكم يهوذا ونفس يهوشع بن يهوصادق رئيس الكهنة ونفوس سائر بقية الشعب، فتوافدوا وباشروا العمل في هيكل الرب القدير إلههم."]]}, {"l": "2Ti 1:6", "n": "", "vs": [[6, "لهذا السبب أنبهك أن تلهب نار موهبة الله التي فيك بوضع يدي عليك."]]}], "kwAr": "أنبهكم", "noteAr": ""}, {"kw": "by", "raw": "2Pe_1:12", "note": "", "refs": [{"l": "2Pe 1:12", "n": "", "vs": [[12, "لذلك أنوي أن أذكركم دائما بهذه الأمور، وإن كنتم عالمين بها، وراسخين في الحق الذي عندكم."]]}], "kwAr": "مذكرا", "noteAr": ""}], "arS": [["فمادمت في ", []], ["خيمة", ["G4638"]], [" جسمي هذه، ", []], ["أرى", ["G2233"]], [" من ", []], ["واجبي", ["G1342"]], [" أن ", []], ["أنبهكم", ["G1326"]], [" ", []], ["مذكرا", ["G5280"]], [".", []]]}, {"c": 1, "v": 14, "text": "فأنا أعلم أن خيمتي ستطوى بعد وقت قصير، كما سبق أن أعلن لي ربنا يسوع المسيح.", "groups": [{"kw": "shortly", "raw": "Deu_4:21, Deu_4:22, Deu_31:14; Jos_23:14; 1Ki_2:2, 1Ki_2:3; Act_20:25; 2Ti_4:6", "note": "", "refs": [{"l": "Deu 4:21", "n": "", "vs": [[21, "ولكن الرب غضب علي من أجلكم وأقسم ألا أعبر نهر الأردن ولا أطأ الأرض الخصيبة التي وهبكم إياها الرب إلهكم نصيبا."]]}, {"l": "Deu 4:22", "n": "", "vs": [[22, "كذلك فأنا أموت في هذه الأرض من غير أن أجتاز نهر الأردن. وأما أنتم فتعبرونه وترثون تلك الأرض الخصيبة."]]}, {"l": "Deu 31:14", "n": "", "vs": [[14, "وكان الرب قد قال لموسى: «ها أنت قد أوشكت على الموت، وأيام حياتك باتت معدودة. فادع يشوع، وقفا كلاكما عند خيمة الاجتماع لكي أوصيه». فمضى موسى ويشوع ومثلا عند خيمة الاجتماع."]]}, {"l": "Jos 23:14", "n": "", "vs": [[14, "وها أنا اليوم ماض في الطريق التي يمضي إليها أحياء الأرض كلهم، ولكنكم تعلمون حق العلم من كل قلوبكم ومن كل نفوسكم أن جميع وعود الرب الصالحة التي وعدكم بها قد تحققت. الكل صار لكم. لم تسقط منه كلمة واحدة."]]}, {"l": "1Ki 2:2", "n": "", "vs": [[2, "«أنا ماض إلى مصير كل أهل الأرض، فتشجع وكن رجلا."]]}, {"l": "1Ki 2:3", "n": "", "vs": [[3, "احفظ شرائع إلهك. سر في سبله وأطع فرائضه ووصاياه وأحكامه وشهاداته، كما هي مدونة في شريعة موسى، ليحالفك النجاح في كل ما تفعل وحيثما تتوجه،"]]}, {"l": "Act 20:25", "n": "", "vs": [[25, "وأنا أعلم أنكم لن تروا وجهي بعد اليوم، أنتم الذين تجولت بينكم جميعا مبشرا بملكوت الله."]]}, {"l": "2Ti 4:6", "n": "", "vs": [[6, "وأما أنا، فها إن حياتي بدأت تسكب سكيبا، وموعد رحيلي قد اقترب."]]}], "kwAr": "بعد وقت قصير", "noteAr": ""}, {"kw": "even", "raw": "Joh_21:18, Joh_21:19", "note": "", "refs": [{"l": "Joh 21:18", "n": "", "vs": [[18, "الحق الحق أقول لك: إنك لما كنت شابا كنت تربط حزامك على وسطك وتذهب حيث تريد. ولكن عندما تصير شيخا فإنك تمد يديك، وآخر يربط حزامك ويذهب بك حيث لا تريد!»"]]}, {"l": "Joh 21:19", "n": "", "vs": [[19, "وقد قال يسوع هذا إشارة إلى الميتة التي سوف يموتها بطرس فيمجد بها الله . ولما قال له ذلك، قال له: «اتبعني»."]]}], "kwAr": "كما سبق أن أعلن لي ربنا", "noteAr": ""}], "arS": [["فأنا ", []], ["أعلم", ["G1492"]], [" أن ", []], ["خيمتي", ["G4638", "G3450"]], [" ", []], ["ستطوى", ["G595"]], [" ", []], ["بعد وقت قصير", ["G5031"]], ["، كما سبق أن ", []], ["أعلن", ["G1213"]], [" لي ", []], ["ربنا", ["G2962", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 1, "v": 15, "text": "ولهذا، أجتهد الآن في تذكيركم بهذه الأمور، حتى تستطيعوا أن تتذكروها دائما بعد رحيلي.", "groups": [{"kw": "I will", "raw": "Deu_31:19-29; Jos_24:24-29; 1Chr. 29:1-20; Psa_71:18; 2Ti_2:2; Heb_11:4", "note": "", "refs": [{"l": "Deu 31:19-29", "n": "", "vs": [[19, "فالآن دونوا لأنفسكم هذا النشيد وعلموه لبني إسرائيل. ضعوه في أفواههم ليكون هذا النشيد شهادة عليهم."], [20, "لأني حالما أدخلهم إلى الأرض التي تفيض لبنا وعسلا، هذه الأرض التي حلفت أن تكون لآبائهم، فيأكلون ويشبعون ويسمنون، فإنهم يسعون وراء آلهة أخرى ويعبدونها ويزدرون بي ناقضين عهدي."], [21, "فمتى حلت بهم شرور كثيرة ومصائب جمة، يشهد هذا النشيد عليهم، لأنه سيظل يتردد على أفواه ذريتهم، إذ إنني عالم بخواطرهم التي تدور بخلدهم الآن قبل أن أدخلهم إلى الأرض كما حلفت»."], [22, "فكتب موسى هذا النشيد في ذلك اليوم، وعلمه لبني إسرائيل."], [23, "وأوصى الرب يشوع بن نون قائلا: «تقو وتشجع، لأنك أنت تدخل بني إسرائيل إلى الأرض التي أقسمت لهم عليها، وأنا أكون معك»."], [24, "وعندما أتم موسى تدوين نصوص هذه التوراة كاملة في كتاب،"], [25, "أمر اللاويين حاملي تابوت عهد الرب قائلا:"], [26, "«خذوا كتاب التوراة هذا وضعوه إلى جوار تابوت عهد الرب إلهكم، ليكون هناك شاهدا عليكم،"], [27, "لأني أعرف تمردكم وقساوة قلوبكم. إذ وأنا مازلت حيا معكم اليوم أخذتم في مقاومة الرب. فكم بالأحرى تتمردون بعد موتي؟"], [28, "اجمعوا إلي جميع شيوخ أسباطكم وعرفاءكم، لأتلو على مسامعهم هذه الكلمات، وأشهد عليهم السماء والأرض."], [29, "لأنني واثق أنكم بعد موتي تفسدون وتضلون عن الطريق التي أوصيتكم بها، فيصيبكم الشر في آخر الأيام، لأنكم تقترفون الشر أمام الرب حتى تثيروا غيظه بما تجنيه أيديكم»."]]}, {"l": "Jos 24:24-29", "n": "", "vs": [[24, "فأجابوا: «الرب إلهنا نعبد، وأمره نطيع»."], [25, "في ذلك اليوم قطع يشوع عهدا للشعب وسن لهم في شكيم شرائع وأحكاما."], [26, "ودون يشوع هذا الكلام في كتاب شريعة الله، وتناول حجرا كبيرا ونصبه هناك تحت البلوطة التي عند بيت الرب."], [27, "ثم قال للشعب جميعه: «إن هذا الحجر شاهد عليكم لئلا تجحدوا إلهكم»."], [28, "ثم صرف يشوع كل واحد إلى مسكنه."], [29, "وما لبث بعد ذلك أن مات يشوع بن نون عبد الرب، وقد بلغ من العمر مئة وعشر سنوات،"]]}, {"l": "1Ch 29:1-20", "n": "", "vs": [[1, "وقال داود الملك لكل الجمع الحاضر: «إن ابني سليمان الذي اصطفاه الله وحده لايزال صغيرا غضا، والعمل المطلوب ضخم، لأن الهيكل ليس لإنسان بل للرب الإله."], [2, "وقد بذلت كل جهدي لتجهيز ما يتطلبه بناء هيكل إلهي من مواد، فوفرت الذهب لما يصنع من ذهب، والفضة لما يصنع من فضة، والنحاس لما يصنع من نحاس، والحديد لما يصنع من حديد، والخشب لما يصنع من خشب، وحجارة الجزع وجواهر ثمينة للترصيع، وحجارة ذات ألوان مختلفة، وحجارة كريمة ورخاما كثيرا."], [3, "ولفرط سروري ببيت إلهي، فقد قدمت من مالي الخاص ذهبا وفضة، بالإضافة إلى كل ما أعددته للهيكل."], [4, "وهي في جملتها ثلاثة آلاف وزنة (نحو مئة وثمانية آلاف كيلوجرام) من ذهب أوفير، وسبعة آلاف وزنة (نحو مئتين واثنين وخمسين ألف كيلوجرام) من الفضة النقية لتغشية جدران البيوت."], [5, "فالذهب لما يصنع من ذهب، والفضة لما يصنع من فضة. فمن يرغب اليوم في التبرع لخدمة الرب؟»"], [6, "فتبرع زعماء عائلات إسرائيل ورؤساء أسباطهم، وقادة الألوف والمئات ومديرو أعمال الملك،"], [7, "وقدموا لخدمة هيكل الرب خمسة آلاف وزنة وعشرة آلاف درهم (نحو مئة وثمانين ألف كيلوجرام) من الذهب، وعشرة آلاف وزنة (نحو ثلاث مئة وستين ألف كيلوجرام) من الفضة، وثمانية عشر ألف وزنة (نحو ست مئة طن) من النحاس، ومئة ألف وزنة (نحو ثلاثة آلاف وستمائة طن) من الحديد."], [8, "وكل من وجدت لديه حجارة كريمة قدمها لخزينة الهيكل التي يشرف عليها يحيئيل الجرشوني."], [9, "واغتبط الشعب بما قدمه عن رضى لأنهم تبرعوا للرب بقلب كامل، وابتهج الملك أيضا ابتهاجا شديدا."], [10, "وسبح داود الرب أمام الجمع المحتشد قائلا: «لك الحمد أيها الرب إله أبينا إسرائيل، من الأزل وإلى الأبد."], [11, "لك يارب العظمة والسطوة والجلال والبهاء والمجد، لأن لك كل ما في السماء والأرض. أنت يارب صاحب الملك وقد تعاليت فوق رؤوس الجميع."], [12, "أنت مصدر كل غنى وكرامة، وأنت المتسلط على الجميع، والمالك للقوة والسطوة، وأنت القادر على تعظيم الجميع وتقوية عزيمتهم."], [13, "والآن، نحمدك ياإلهنا ونسبح اسمك الجليل."], [14, "ولكن من أنا، ومن هو شعبي حتى نقدر أن نتبرع بسخاء وعن رضى؟ لأن منك الجميع ومن يدك نقدم لك."], [15, "فنحن مثل آبائنا، غرباء ونزلاء أمامك، وأيامنا كالظل على الأرض، خالية من الرجاء."], [16, "فيا أيها الرب إلهنا، إن كل هذه الثروة التي وفرناها لنشيد لك هيكلا لاسم قدسك إنما هي من نعم يدك وأنت مالك الكل."], [17, "وأنا أعلم ياإلهي أنك تفحص القلوب وتسر بالاستقامة، وأنا قدمت إليك كل هذه بقلب مستقيم، كذلك رأيت شعبك الماثل هنا يتبرع عن رضى بابتهاج."], [18, "فيارب إله آبائنا إبراهيم وإسحق وإسرائيل، اجعل هذه الرغبة أن تظل حية إلى الأبد في قلوب شعبك، واحفظ قلوبهم لتبقى مخلصة لك."], [19, "أما سليمان ابني، فهبه قلبا كاملا ليطيع وصاياك وشهاداتك وفرائضك، ويعمل بها كلها وليبني الهيكل الذي أعددت له»."], [20, "ثم قال داود للجمع الحاضر: «باركوا الرب إلهكم». فسبح كل الجمع الرب إله آبائهم وسجدوا للرب وللملك."]]}, {"l": "Psa 71:18", "n": "", "vs": [[18, "لا تتركني في الشيخوخة والشيب ياالله ، حتى أخبر هذا الجيل بأعمال قدرتك، وبقوتك (الجيل) الآتي."]]}, {"l": "2Ti 2:2", "n": "", "vs": [[2, "والتعاليم التي سمعتها مني بحضور شهود عديدين، أودعها أمانة بين أيدي أناس جديرين بالثقة، يكونون قادرين على تعليم الآخرين."]]}, {"l": "Heb 11:4", "n": "", "vs": [[4, "بالإيمان، قدم هابيل لله ذبيحة أفضل من تلك التي قدمها قايين. وعلى ذلك الأساس، شهد الله بأن هابيل بار، إذ قبل التقدمة التي قربها له. ومع أن هابيل مات قتلا، فإنه مازال الآن يلقننا العبر بإيمانه."]]}], "kwAr": "أجتهد", "noteAr": ""}, {"kw": "these", "raw": "2Pe_1:4-7, 2Pe_1:12", "note": "", "refs": [{"l": "2Pe 1:4-7", "n": "", "vs": [[4, "اللذين بهما أعطانا الله بركاته العظمى الثمينة التي كان قد وعد بها. وبهذا صار بإمكانكم أن تتخلصوا من الفساد الذي تنشره الشهوة في العالم، وتشتركوا في الطبيعة الإلهية."], [5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"], [6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"], [7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."]]}, {"l": "2Pe 1:12", "n": "", "vs": [[12, "لذلك أنوي أن أذكركم دائما بهذه الأمور، وإن كنتم عالمين بها، وراسخين في الحق الذي عندكم."]]}], "kwAr": "هذه الأمور", "noteAr": ""}], "arS": [["ولهذا، ", []], ["أجتهد", ["G4704"]], [" الآن في تذكيركم بهذه الأمور، حتى تستطيعوا أن ", []], ["تتذكروها", ["G3420"]], [" ", []], ["دائما", ["G1539"]], [" بعد ", []], ["رحيلي", ["G1841"]], [".", []]]}, {"c": 1, "v": 16, "text": "فنحن، عندما أخبرناكم بقدرة ربنا يسوع المسيح، وبعودته المجيدة، لم نكن ننقل عن أساطير مختلقة بمهارة. وإنما، تكلمنا باعتبارنا شهود عيان لعظمة المسيح.", "groups": [{"kw": "we have", "raw": "2Pe_3:3, 2Pe_3:4; 1Co_1:17, 1Co_1:23, 1Co_2:1, 1Co_2:4; 2Co_2:17, 2Co_4:2, 2Co_12:16, 2Co_12:17; Eph_4:14; 2Th_2:9; 1Ti_1:4, 1Ti_4:7; Tit_1:14", "note": "", "refs": [{"l": "2Pe 3:3", "n": "", "vs": [[3, "فاعلموا، قبل كل شيء أنه سيأتي في آخر الأيام أناس مستهزئون يسخرون بالحق، ويسلكون منجرفين وراء شهواتهم الخاصة."]]}, {"l": "2Pe 3:4", "n": "", "vs": [[4, "وسيقولون: «أين هو الوعد برجوع المسيح؟ فمنذ أن مات آباؤنا الأولون، بل منذ بدء الخليقة، مازال كل شيء على حاله!»"]]}, {"l": "1Co 1:17", "n": "", "vs": [[17, "فإن المسيح قد أرسلني لا لأعمد، بل لأبشر بالإنجيل، غير معتمد على حكمة الكلام، لئلا يصير صليب المسيح كأنه بلا نفع."]]}, {"l": "1Co 1:23", "n": "", "vs": [[23, "ولكننا نحن نبشر بالمسيح مصلوبا، مما يشكل عائقا عند اليهود وجهالة عند الأمم؛"]]}, {"l": "1Co 2:1", "n": "", "vs": [[1, "وأنا، أيها الإخوة، لما جئت إليكم لأعلن لكم شهادة الله، ما جئت بالكلام البليغ أو الحكمة."]]}, {"l": "1Co 2:4", "n": "", "vs": [[4, "ولم يقم كلامي وتبشيري على الإقناع بكلام الحكمة، بل على ما يعلنه الروح والقدرة."]]}, {"l": "2Co 2:17", "n": "", "vs": [[17, "فإننا لا نتاجر بكلمة الله كما يفعل الكثيرون، وإنما بإخلاص ومن قبل الله، وأمام الله، نتكلم في المسيح."]]}, {"l": "2Co 4:2", "n": "", "vs": [[2, "ولكننا قد رفضنا الأساليب الخفية المخجلة، إذ لا نسلك في المكر، ولا نزور كلمة الله، بل بإعلاننا للحق نمدح أنفسنا لدى ضمير كل إنسان، أمام الله."]]}, {"l": "2Co 12:16", "n": "", "vs": [[16, "ولكن، ليكن كذلك. (تقولون) إني لم أثقل عليكم بنفسي، ولكني كنت محتالا فسلبتكم بمكر."]]}, {"l": "2Co 12:17", "n": "", "vs": [[17, "هل كسبت منكم شيئا بأحد من الذين أرسلتهم إليكم؟"]]}, {"l": "Eph 4:14", "n": "", "vs": [[14, "وذلك حتى لا نكون فيما بعد أطفالا تتقاذفنا وتحملنا كل ريح تعليم يقوم على خداع الناس والمكر بهم لجرهم إلى الضلال الملفق،"]]}, {"l": "2Th 2:9", "n": "", "vs": [[9, "أما بروز المتمرد، فسوف يكون بقدر طاقة الشيطان على المعجزات والعلامات والعجائب المزيفة كلها،"]]}, {"l": "1Ti 1:4", "n": "", "vs": [[4, "وتوصي المؤمنين ألا ينشغلوا بالأساطير وسلاسل النسب المتشابكة. فتلك الأمور تثير المجادلات ولا تعمل على تقدم تدبير الله القائم على الإيمان."]]}, {"l": "1Ti 4:7", "n": "", "vs": [[7, "أما أساطير العجائز المبتذلة، فتجنبها. إنما مرن نفسك في طريق التقوى."]]}, {"l": "Tit 1:14", "n": "", "vs": [[14, "لا يديرون عقولهم إلى خرافات يهودية ووصايا أناس تحولوا عن الحق بعيدا."]]}], "kwAr": "لم نكن ننقل عن أساطير مختلقة", "noteAr": ""}, {"kw": "the power", "raw": "Mat_28:18; Mar_9:1; Joh_17:2; Rom_1:4; 1Co_5:4; Phi_3:21", "note": "", "refs": [{"l": "Mat 28:18", "n": "", "vs": [[18, "فتقدم يسوع وكلمهم قائلا: «دفع إلي كل سلطان في السماء وعلى الأرض."]]}, {"l": "Mar 9:1", "n": "", "vs": [[1, "وقال لهم: «الحق أقول لكم: إن بعضا من الواقفين هنا، لن يذوقوا الموت إلا بعد أن يروا ملكوت الله وقد أتى بقدرة. »"]]}, {"l": "Joh 17:2", "n": "", "vs": [[2, "فقد أوليته السلطة على جميع البشر، ليمنح جميع الذين قد وهبتهم له حياة أبدية."]]}, {"l": "Rom 1:4", "n": "", "vs": [[4, "ومن ناحية روح القداسة، تبين بقوة أنه ابن الله بالقيامة من بين الأموات. إنه يسوع المسيح ربنا"]]}, {"l": "1Co 5:4", "n": "", "vs": [[4, "باسم ربنا يسوع المسيح، إذ تجتمعون معا، وروحي معكم، فبسلطة ربنا يسوع المسيح،"]]}, {"l": "Phi 3:21", "n": "", "vs": [[21, "الذي سيحول جسدنا الوضيع إلى صورة مطابقة لجسده المجيد، وفقا لعمل قدرته على إخضاع كل شيء لنفسه."]]}], "kwAr": "بقدرة ربنا", "noteAr": ""}, {"kw": "coming", "raw": "Mal_3:2, Mal_4:5; Mat_16:28, Mat_24:3, Mat_24:27; 1Co_1:7; Jud_1:14; Rev_1:7", "note": "", "refs": [{"l": "Mal 3:2", "n": "", "vs": [[2, "ولكن من يحتمل يوم مجيئه؟ ومن يثبت عند ظهوره؟ فإنه مثل نار الممحص أو أشنان القصارين."]]}, {"l": "Mal 4:5", "n": "", "vs": [[5, "ها أنا أرسل إليكم إيليا النبي قبل أن يجيء يوم قضاء الرب الرهيب العظيم"]]}, {"l": "Mat 16:28", "n": "", "vs": [[28, "الحق أقول لكم: إن بعضا من الواقفين هنا لن يذوقوا الموت، قبل أن يروا ابن الإنسان آتيا في ملكوته»."]]}, {"l": "Mat 24:3", "n": "", "vs": [[3, "وبينما كان جالسا على جبل الزيتون، تقدم إليه التلاميذ على انفراد وقالوا له: «أخبرنا متى يحدث هذا. وما هي علامة رجوعك وانتهاء الزمان؟»"]]}, {"l": "Mat 24:27", "n": "", "vs": [[27, "فكما أن البرق يومض من الشرق فيضيء في الغرب، هكذا يكون رجوع ابن الإنسان."]]}, {"l": "1Co 1:7", "n": "", "vs": [[7, "حتى إنكم لا تحتاجون بعد إلى أية موهبة فيما تتوقعون ظهور ربنا يسوع المسيح علنا."]]}, {"l": "Jud 1:14", "n": "", "vs": [[14, "عن هؤلاء وأمثالهم، تنبأ أخنوخ السابع بعد آدم، فقال: «انظروا إن الرب آت بصحبة عشرات الألوف من قديسيه،"]]}, {"l": "Rev 1:7", "n": "", "vs": [[7, "ها هو آت مع السحاب! ستراه عيون الجميع، حتى أولئك الذين طعنوه، وتنوح بسببه قبائل الأرض كلها! نعم، آمين!"]]}], "kwAr": "وبعودته المجيدة", "noteAr": ""}, {"kw": "were", "raw": "Mat_17:1-5; Mar_9:2; Luk_9:28-32; Joh_1:14; 1Jo_1:1-3, 1Jo_4:14", "note": "", "refs": [{"l": "Mat 17:1-5", "n": "", "vs": [[1, "وبعد ستة أيام، أخذ يسوع بطرس ويعقوب ويوحنا أخاه، وصعد بهم على انفراد إلى جبل عال،"], [2, "وتجلى أمامهم، فشع وجهه كالشمس، وصارت ثيابه بيضاء كالنور."], [3, "وإذا موسى وإيليا قد ظهرا لهم يتحدثان معه."], [4, "فبدأ بطرس يقول ليسوع: «يارب، ما أحسن أن نبقى هنا! فإذا شئت، أنصب هنا ثلاث خيام: واحدة لك، وواحدة لموسى، وواحدة لإيليا»."], [5, "وبينما كان يتكلم، إذا سحابة منيرة قد خيمت عليهم، وصوت من السحابة يهتف: «هذا هو ابني الحبيب الذي سررت به كل سرور. له اسمعوا!»"]]}, {"l": "Mar 9:2", "n": "", "vs": [[2, "وبعد ستة أيام، أخذ يسوع بطرس ويعقوب ويوحنا وحدهم، وصعد بهم على انفراد إلى جبل عال، حيث تجلى أمامهم،"]]}, {"l": "Luk 9:28-32", "n": "", "vs": [[28, "وحدث بعد هذا الكلام بثمانية أيام تقريبا أن أخذ يسوع بطرس ويوحنا ويعقوب، وصعد إلى جبل ليصلي."], [29, "وبينما هو يصلي، تجلت هيئة وجهه وصارت ثيابه بيضاء لماعة."], [30, "وإذا رجلان يتحدثان معه، وهما موسى وإيليا،"], [31, "وقد ظهرا بمجد وتكلما عن رحيله الذي كان على وشك إتمامه في أورشليم."], [32, "ومع أن بطرس ورفيقيه قد غالبهم النوم، فإنهم حين استيقظوا تماما، شاهدوا مجده والرجلين الواقفين معه."]]}, {"l": "Joh 1:14", "n": "", "vs": [[14, "والكلمة صار بشرا، وخيم بيننا، ونحن رأينا مجده، مجد ابن وحيد عند الآب، وهو ممتلىء بالنعمة والحق."]]}, {"l": "1Jo 1:1-3", "n": "", "vs": [[1, "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."], [2, "فإن «الحياة» تجلت أمامنا. وبعدما رأيناها فعلا، نشهد لها الآن. وها نحن ننقل إليكم خبر هذه الحياة الأبدية التي كانت عند الآب ثم تجلت أمامنا!"], [3, "فنحن، إذن، نخبركم بما رأيناه وسمعناه، لكي تكونوا شركاءنا. كما أن شركتنا هي مع الآب ومع ابنه يسوع المسيح."]]}, {"l": "1Jo 4:14", "n": "", "vs": [[14, "ونحن أنفسنا نشهد أن الآب قد أرسل الابن مخلصا للعالم، لأننا رأيناه بعيوننا."]]}], "kwAr": "شهود عيان", "noteAr": ""}], "arS": [["فنحن، عندما ", []], ["أخبرناكم", ["G1107"]], [" ", []], ["بقدرة", ["G1411"]], [" ", []], ["ربنا", ["G2962", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], ["، ", []], ["وبعودته", ["G3952"]], [" المجيدة، لم نكن ", []], ["ننقل", ["G1811"]], [" عن ", []], ["أساطير", ["G3454"]], [" ", []], ["مختلقة بمهارة", ["G4679"]], [". وإنما، تكلمنا باعتبارنا ", []], ["شهود عيان", ["G2030"]], [" ", []], ["لعظمة", ["G3168"]], [" المسيح.", []]]}, {"c": 1, "v": 17, "text": "فإنه قد نال من الله الآب كرامة ومجدا، إذ جاءه من المجد الفائق صوت يقول: «هذا هو ابني الحبيب الذي به سررت كل سرور!»", "groups": [{"kw": "God", "raw": "Mat_11:25-27, Mat_28:19; Luk_10:22; Joh_3:35, Joh_5:21-23, Joh_5:26, Joh_5:36, Joh_5:37; Joh_6:27, Joh_6:37, Joh_6:39, Joh_10:15, Joh_10:36, Joh_13:1-3, Joh_14:6, Joh_14:8, Joh_14:9, Joh_14:11, Joh_17:21, Joh_20:17; Rom_15:6; 2Co_1:3, 2Co_11:31; 2Jo_1:3; Jud_1:1", "note": "", "refs": [{"l": "Mat 11:25-27", "n": "", "vs": [[25, "وفي ذلك الوقت، تكلم يسوع فقال: «أحمدك أيها الآب، رب السماء والأرض، لأنك حجبت هذه الأمور عن الحكماء والفهماء، وكشفتها للأطفال!"], [26, "نعم أيها الآب، لأنه هكذا حسن في نظرك."], [27, "كل شيء قد سلمه إلي أبي. ولا أحد يعرف الابن إلا الآب، ولا أحد يعرف الآب إلا الابن، ومن أراد الابن أن يعلنه له."]]}, {"l": "Mat 28:19", "n": "", "vs": [[19, "فاذهبوا إذن، وتلمذوا جميع الأمم، وعمدوهم باسم الآب والابن والروح القدس؛"]]}, {"l": "Luk 10:22", "n": "", "vs": [[22, "كل شيء قد سلم إلي من قبل أبي، ولا أحد يعرف من هو الابن إلا الآب، ولا من هو الآب إلا الابن ومن أراد الابن أن يعلنه له!»"]]}, {"l": "Joh 3:35", "n": "", "vs": [[35, "فالآب يحب الابن، وقد جعل في يده كل شيء."]]}, {"l": "Joh 5:21-23", "n": "", "vs": [[21, "فكما يقيم الآب الموتى ويحييهم، كذلك يحيي الابن من يشاء."], [22, "والآب لا يحاكم أحدا، بل أعطى الابن سلطة القضاء كلها،"], [23, "ليكرم الجميع الابن كما يكرمون الآب. ومن لا يكرم الابن لا يكرم الآب الذي أرسله."]]}, {"l": "Joh 5:26", "n": "", "vs": [[26, "لأنه كما أن للآب حياة في ذاته، فقد أعطى الابن أيضا أن تكون له حياة في ذاته،"]]}, {"l": "Joh 5:36", "n": "", "vs": [[36, "ولكن لي شهادة أعظم من شهادة يوحنا، وهي شهادة الأعمال التي كلفني الآب أن أنجزها والتي أعملها، فهي تشهد لي مبينة أن الآب أرسلني،"]]}, {"l": "Joh 5:37", "n": "", "vs": [[37, "والآب الذي أرسلني هو نفسه أيضا يشهد لي. وأنتم لم تسمعوا صوته قط، ولا رأيتم هيئته،"]]}, {"l": "Joh 6:27", "n": "", "vs": [[27, "لا تسعوا وراء الطعام الفاني، بل وراء الطعام الباقي إلى الحياة الأبدية، والذي يعطيكم إياه ابن الإنسان، لأن هذا الطعام قد وضع الله الآب ختمه عليه»."]]}, {"l": "Joh 6:37", "n": "", "vs": [[37, "ولكن كل ما يهبه الآب لي سيأتي إلي، ومن ي : "", "refs": [{"l": "Isa 42:1", "n": "", "vs": [[1, "هوذا عبدي الذي أعضده، مختاري الذي ابتهجت به نفسي. وضعت روحي عليه ليسوس الأمم بالعدل."]]}, {"l": "Isa 53:10", "n": "", "vs": [[10, "ومع ذلك فقد سر الله أن يسحقه بالحزن. وحين يقدم نفسه ذبيحة إثم فإنه يرى نسله وتطول أيامه، وتفلح مسرة الرب على يده."]]}, {"l": "Mat 12:18", "n": "", "vs": [[18, "«ها هو فتاي الذي اخترته، حبيبي الذي سرت به نفسي! سأضع روحي عليه، فيعلن العدل للأمم."]]}], "kwAr": "الذي به سررت", "noteAr": ""}], "arS": [["فإنه قد ", []], ["نال", ["G2983"]], [" من ", []], ["الله", ["G2316"]], [" ", []], ["الآب", ["G3962"]], [" ", []], ["كرامة", ["G5092"]], [" ", []], ["ومجدا", ["G1391"]], ["، إذ ", []], ["جاءه", ["G5342"]], [" من ", []], ["المجد", ["G1391"]], [" ", []], ["الفائق", ["G3169"]], [" ", []], ["صوت", ["G5456"]], [" يقول: «هذا هو ", []], ["ابني", ["G5207", "G3450"]], [" ", []], ["الحبيب", ["G27"]], [" الذي به ", []], ["سررت", ["G2106"]], [" كل سرور!»", []]]}, {"c": 1, "v": 18, "text": "ونحن أنفسنا قد سمعنا هذا الصوت الصادر من السماء لما كنا معه على الجبل المقدس.", "groups": [{"kw": "this", "raw": "Mat_17:6", "note": "", "refs": [{"l": "Mat 17:6", "n": "", "vs": [[6, "فلما سمع التلاميذ الصوت، وقعوا على وجوههم مرتعبين جدا."]]}], "kwAr": "هذا الصوت", "noteAr": ""}, {"kw": "the holy", "raw": "Gen_28:16, Gen_28:17; Exo_3:1, Exo_3:5; Jos_5:15; Isa_11:9, Isa_56:7; Zec_8:3; Mat_17:6", "note": "", "refs": [{"l": "Gen 28:16", "n": "", "vs": [[16, "ثم أفاق يعقوب من نومه وقال: «حقا إن الرب في هذا الموضع وأنا لم أعلم!»"]]}, {"l": "Gen 28:17", "n": "", "vs": [[17, "واعتراه خوف وقال: «ما أرهب هذا المكان! ما هذا سوى بيت الله وهذا هو باب السماء»."]]}, {"l": "Exo 3:1", "n": "", "vs": [[1, "وأما موسى فكان يرعى غنم حميه يثرون كاهن مديان، فقاد الغنم إلى ما وراء الطرف الأقصى من الصحراء حتى جاء إلى حوريب جبل الله."]]}, {"l": "Exo 3:5", "n": "", "vs": [[5, "فقال: «لا تقترب إلى هنا: اخلع حذاءك من رجليك، لأن المكان الذي أنت واقف عليه أرض مقدسة»."]]}, {"l": "Jos 5:15", "n": "", "vs": [[15, "فقال رئيس جند الرب ليشوع: «اخلع نعل ن حدوثه حتى نقول: هو صادق. لم يوجد منبيء أو معلن، ولم يسمع أحد كلمة منكم."]]}, {"l": "Luk 16:29-31", "n": "", "vs": [[29, "ولكن إبراهيم قال له: عندهم موسى والأنبياء: فليسمعوا لهم!"], [30, "فقال له: لا ياأبي إبراهيم، بل إذا ذهب إليهم واحد من بين الأموات يتوبون!"], [31, "فقال له: إن كانوا لا يسمعون لموسى والأنبياء، فلا يقتنعون حتى لو قام واحد من بين الأموات!»"]]}, {"l": "Joh 5:39", "n": "", "vs": [[39, "أنتم تدرسون الكتب لأنكم تعتقدون أنها ستهديكم إلى الحياة الأبدية. هذه الكتب تشهد لي،"]]}, {"l": "Act 17:11", "n": "", "vs": [[11, "وكان يهود بيرية أشرف من يهود تسالونيكي، فقبلوا كلمة الله برغبة شديدة، وأخذوا يدرسون الكتاب يوميا ليتأكدوا من صحة التعليم."]]}], "kwAr": "الكلمة النبوية أكثر ثباتا", "noteAr": ""}, {"kw": "ye do", "raw": "Act_15:29; Jam_2:8; 3Jo_1:6", "note": "", "refs": [{"l": "Act 15:29", "n": "", "vs": [[29, "إنما عليكم أن تمتنعوا عن الأكل من الذبائح المقربة للأصنام، وعن تناول الدم ولحوم الحيوانات المخنوقة، وعن ارتكاب الزنى. وتحسنون عملا إن حفظتم أنفسكم من هذه الأمور. عافاكم الله !»"]]}, {"l": "Jam 2:8", "n": "", "vs": [[8, "ما أحسن عملكم حين تطبقون تلك القاعدة الملوكية الواردة في الكتاب: «تحب قريبك كما تحب نفسك!»"]]}, {"l": "3Jo 1:6", "n": "", "vs": [[6, "وقد شهد هؤلاء الإخوة، أمام الكنيسة، شهادة جميلة لمحبتك. فإنك تفعل حسنا إذا زودتهم بما يحتاجون إليه في السفر. فأنت تعرف أن هذا يرضي الله ،"]]}], "kwAr": "فحسنا تفعلون", "noteAr": ""}, {"kw": "a light", "raw": "Psa_119:105; Pro_6:23; Isa_9:2, Isa_60:1, Isa_60:2; Mat_4:16; Luk_1:78, Luk_1:79; Joh_1:7-9, Joh_5:35, Joh_8:12; Eph_5:7, Eph_5:8", "note": "", "refs": [{"l": "Psa 119:105", "n": "", "vs": [[105, "سراج لرجلي كلامك ونور لسبيلي."]]}, {"l": "Pro 6:23", "n": "", "vs": [[23, "فالوصية مصباح والشريعة نور، والتوبيخ في سبيل التأديب هو طريق حياة،"]]}, {"l": "Isa 9:2", "n": "", "vs": [[2, "الشعب السالك في الظلمة أبصر نورا عظيما، والمقيمون في أرض ظلال الموت أضاء عليهم نور."]]}, {"l": "Isa 60:1", "n": "", "vs": [[1, "قومي استضيئي، فإن نورك قد جاء، ومجد الرب أشرق عليك."]]}, {"l": "Isa 60:2", "n": "", "vs": [[2, "
