<script>window.CATALOG=[{"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 20, "nv": 480, "refs": 6756, "last": "20:49", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "verses": [{"c": 1, "v": 1, "text": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح.", "groups": [{"kw": "", "raw": "2Co_1:19; 1Th_1:1-10", "note": "", "refs": [{"l": "2Co 1:19", "n": "", "vs": [[19, "فإن ابن الله، المسيح يسوع، الذي بشرنا به فيما بينكم، أنا وسلوانس وتيموثاوس، لم يكن نعم ولا معا، وإنما فيه نعم."]]}, {"l": "1Th 1:1-10", "n": "", "vs": [[1, "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."], [2, "إننا نشكر الله دائما من أجلكم جميعا، إذ نذكركم في صلواتنا دون توقف؛"], [3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"], [4, "ونحن عالمون، أيها الإخوة أحباء الله، حقيقة اختياركم من قبل الله:"], [5, "لأن تبشيرنا لكم بالإنجيل لم يكن مجرد كلام، بل كان مصحوبا أيضا بالقوة وبالروح القدس وبتمام اليقين. كما أنكم تعلمون تماما ماذا كنا بينكم لأجل مصلحتكم،"], [6, "وقد صرتم مقتدين بنا وبالرب، إذ تقبلتم كلمة الله في وسط ضيقة شديدة بفرح الروح القدس."], [7, "حتى إنكم صرتم مثالا لجميع المؤمنين المقيمين في مقاطعتي مقدونية وأخائية."], [8, "فمن عندكم دوت كلمة الرب، منتشرة لا في مقدونية وأخائية فقط، بل إن إيمانكم بالله ذاع في كل مكان، حتى ليس لنا حاجة لأن نقول شيئا بعد."], [9, "فإن أولئك المؤمنين أنفسهم يخبرون عنا كيف كان قدومنا إليكم أول مرة، وكيف تحولتم إلى الله عن الأصنام، لتصيروا عبيدا يخدمون الله الحي الحق،"], [10, "وتنتظروا من السماوات ابنه الذي أقامه من بين الأموات، يسوع مخلصنا من الغضب الآتي."]]}], "kwAr": "", "noteAr": ""}], "arS": [["من ", []], ["بولس", ["G3972"]], [" ", []], ["وسلوانس", ["G4610"]], [" ", []], ["وتيموثاوس", ["G5095"]], ["، إلى ", []], ["كنيسة", ["G1577"]], [" مؤمني ", []], ["تسالونيكي", ["G2331"]], [" الذين هم في ", []], ["الله", ["G2316"]], [" ", []], ["أبينا", ["G3962", "G2257"]], [" ", []], ["والرب", ["G2962"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 1, "v": 2, "text": "لتكن لكم النعمة والسلام من الله الآب والرب يسوع المسيح.", "groups": [{"kw": "", "raw": "Rom_1:7; 1Co_1:3, 1Co_1:8", "note": "", "refs": [{"l": "Rom 1:7", "n": "", "vs": [[7, "إلى جميع من هم في روما من أحباء الله القديسين المدعوين. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}, {"l": "1Co 1:3", "n": "", "vs": [[3, "لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}, {"l": "1Co 1:8", "n": "", "vs": [[8, "وهو نفسه سيحفظكم ثابتين إلى النهاية حتى تكونوا بلا عيب في يوم ربنا يسوع المسيح."]]}], "kwAr": "", "noteAr": ""}], "arS": [["لتكن لكم ", []], ["النعمة", ["G5485"]], [" ", []], ["والسلام", ["G1515"]], [" ", []], ["من", ["G575"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["الآب", ["G3962"]], [" ", []], ["والرب", ["G2962"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 1, "v": 3, "text": "من واجبنا أن نشكر الله على الدوام لأجلكم أيها الإخوة. كما أن هذا حق: لأن إيمانكم ينمو نموا فائقا، ومحبة أحدكم للآخر تفيض بينكم جميعا.", "groups": [{"kw": "are", "raw": "2Th_2:13; Rom_1:8; 1Co_1:4; 1Th_1:2, 1Th_1:3, 1Th_3:6, 1Th_3:9, as is, Luk_15:32; Phi_1:7; 2Pe_1:13", "note": "2Th_2:13; Rom_1:8; 1Co_1:4; 1Th_1:2, 1Th_1:3, 1Th_3:6, 1Th_3:9, as is, Luk_15:32; Phi_1:7; 2Pe_1:13", "refs": [{"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "Rom 1:8", "n": "", "vs": [[8, "بادىء بدء، أشكر إلهي بيسوع المسيح من أجلكم جميعا، لأن إيمانكم يذاع خبره في العالم كله."]]}, {"l": "1Co 1:4", "n": "", "vs": [[4, "إني أشكر الله من أجلكم دائما، وعلى نعمة الله الموهوبة لكم في المسيح يسوع."]]}, {"l": "1Th 1:2", "n": "", "vs": [[2, "إننا نشكر الله دائما من أجلكم جميعا، إذ نذكركم في صلواتنا دون توقف؛"]]}, {"l": "1Th 1:3", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"]]}, {"l": "1Th 3:6", "n": "", "vs": [[6, "أما الآن، وقد عاد تيموثاوس إلينا من عندكم وبشرنا بما لكم من إيمان ومحبة، وبأنكم تذكروننا ذكرا حسنا في كل حين، وتشتاقون كثيرا لرؤيتنا كما نشتاق نحن لرؤيتكم،"]]}, {"l": "1Th 3:9", "n": "", "vs": [[9, "فأي شكر نستطيع أن نؤديه إلى الله عوضا عنكم من أجل كل ما نبتهج به من الفرح بسببكم أمام إلهنا،"]]}, {"l": "Luk 15:32", "n": "", "vs": [[32, "ولكن كان من الصواب أن نفرح ونبتهج، لأن أخاك هذا كان ميتا فعاش، وكان ضالا فوجد!»"]]}, {"l": "Phi 1:7", "n": "", "vs": [[7, "كما أن من الحق أن يكون لي هذا الشعور تجاهكم جميعا، لأني أحتفظ بكم في قلبي، لكونكم جميعا شركاء لي في النعمة، سواء أكان في قيودي أم في الدفاع عن الإنجيل وتثبيته."]]}, {"l": "2Pe 1:13", "n": "", "vs": [[13, "فمادمت في خيمة جسمي هذه، أرى من واجبي أن أنبهكم مذكرا."]]}], "kwAr": "من واجبنا أن نشكر الله", "noteAr": "كما يحق؛ انظر لو 15: 32؛ في 1: 7؛ 2بط 1: 13."}, {"kw": "your", "raw": "Job_17:9; Psa_84:7, Psa_92:13; Pro_4:18; Isa_40:29-31; Luk_17:5; Joh_15:2; Phi_1:9; 1Th_4:1, 1Th_4:9, 1Th_4:10; 1Pe_1:22; 2Pe_1:5-10, 2Pe_3:18", "note": "", "refs": [{"l": "Job 17:9", "n": "", "vs": [[9, "أما الصديق فيتمسك بطريقه، ويزداد الطاهر اليدين قوة."]]}, {"l": "Psa 84:7", "n": "", "vs": [[7, "ينمون من قوة إلى قوة، إذ يمثل كل واحد أمام الله في صهيون."]]}, {"l": "Psa 92:13", "n": "", "vs": [[13, "لأن المغروسين في بيت الرب يزدهرون في ديار بيت إلهنا"]]}, {"l": "Pro 4:18", "n": "", "vs": [[18, "أما سبيل الأبرار فكنور متلأليء يتزايد إشراقه إلى أن يكتمل النهار،"]]}, {"l": "Isa 40:29-31", "n": "", "vs": [[29, "يهب المنهوك قوة ويمنح الضعيف قدرة عظيمة."], [30, "إن الشبيبة ينالها الإعياء والإرهاق، والفتيان يتعثرون أشد تعثر،"], [31, "أما الراجون الرب فإنهم يجددون قوتهم، ويحلقون بأجنحة النسور. يركضون ولا يعيون. يمشون ولا يتعبون."]]}, {"l": "Luk 17:5", "n": "", "vs": [[5, "وقال الرسل للرب: «زدنا إيمانا!»"]]}, {"l": "Joh 15:2", "n": "", "vs": [[2, "كل غصن في لا ينتج ثمرا يقطعه؛ وكل غصن ينتج ثمرا ينقيه لينتج مزيدا من الثمر."]]}, {"l": "Phi 1:9", "n": "", "vs": [[9, "وصلاتي لأجلكم هي هذه: أن تزداد محبتكم أكثر فأكثر في تمام المعرفة والإدراك،"]]}, {"l": "1Th 4:1", "n": "", "vs": [[1, "وبعد، أيها الإخوة، فمثلما تلقيتم منا كيف يجب أن تسلكوا سلوكا يرضي الله ، وكما أنتم فاعلون، نرجو منكم ونحرضكم في الرب يسوع أن تضاعفوا تقدمكم في ذلك أكثر فأكثر."]]}, {"l": "1Th 4:9", "n": "", "vs": [[9, "أما المحبة الأخوية، فلستم في حاجة لأن أكتب إليكم عنها، لأنكم بأنفسكم قد تعلمتم من الله أن تحبوا بعضكم بعضا،"]]}, {"l": "1Th 4:10", "n": "", "vs": [[10, "ولأنكم أيضا هكذا تعاملون جميع الإخوة في مقاطعة مقدونية كلها. وإنما نحرضكم، أيها الإخوة، أن تضاعفوا ذلك أكثر فأكثر،"]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}, {"l": "2Pe 1:5-10", "n": "", "vs": [[5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"], [6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"], [7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."], [8, "فحين تكون هذه الصفات الطيبة في داخلكم، وتزداد بوفرة، تجعلكم مجتهدين ومثمرين في معرفتكم لربنا يسوع المسيح."], [9, "أما الذي لا يملك هذه الصفات، فهو أعمى روحيا. إنه قصير البصر، قد نسي أنه تطهر من خطاياه القديمة!"], [10, "فأحرى بكم إذن، أيها الإخوة، أن تجتهدوا لتثبتوا عمليا أن الله قد دعاكم واختاركم حقا. فإنكم، إن فعلتم هذا، لن تسقطوا أبدا!"]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}], "kwAr": "إيمانكم", "noteAr": ""}, {"kw": "groweth", "raw": "The word, υπεραυξανω [Strongs G5232], from υπερ [Strongs G5228], intensive, and αυξανω [Strongs G837], to grow, increase, signifies, as Dr. Clarke remarks, to grow luxuriantly, as a good and healthy tree in a good soil; and, if a fruit tree, bearing an abundance of fruit to compensate the labour of the husbandman. Faith is one of the seeds of the kingdom. this the Apostle had sowed and watered, and God gave an abundant increase. Their faith was multiplied, and their love abounded, and this was not the case with some distinguished characters only; it was the case with every one of them. For this the apostle felt himself bound to give continual thanks to God on their behalf, as it was meet and right.", "note": "The word, υπεραυξανω [Strongs G5232], from υπερ [Strongs G5228], intensive, and αυξανω [Strongs G837], to grow, increase, signifies, as Dr. Clarke remarks, to grow luxuriantly, as a good and healthy tree in a good soil; and, if a fruit tree, bearing an abundance of fruit to compensate the labour of the husbandman. Faith is one of the seeds of the kingdom. this the Apostle had sowed and watered, and God gave an abundant increase. Their faith was multiplied, and their love abounded, and this was not the case with some distinguished characters only; it was the case with every one of them. For this the apostle felt himself bound to give continual thanks to God on their behalf, as it was meet and right.", "refs": [], "kwAr": "ينمو نموا فائقا", "noteAr": "الكلمة اليونانية «هيبيراوكسانو» (G5232) مركبة من «هيبير» (G5228) للتكثيف و«أوكسانو» (G837) أي ينمو؛ ومعناها النمو الوافر كشجرة صحيحة في تربة جيدة تحمل ثمرًا كثيرًا يكافئ تعب الفلاح. فالإيمان من بذار الملكوت، زرعه الرسول وسقاه، والله أعطى النمو الوافر؛ فتضاعف إيمانهم وفاضت محبتهم، لا عند قلة مميزة فحسب بل عند كل واحد منهم، ولذلك شعر الرسول بأنه ملزم أن يشكر الله عنهم دائمًا كما يحق."}], "arS": [["من ", []], ["واجبنا", ["G3784"]], [" أن ", []], ["نشكر", ["G2168"]], [" ", []], ["الله", ["G2316"]], [" على ", []], ["الدوام", ["G3842"]], [" لأجلكم أيها ", []], ["الإخوة", ["G80"]], [". ", []], ["كما", ["G2531"]], [" أن هذا ", []], ["حق", ["G514"]], [": لأن ", []], ["إيمانكم", ["G4102", "G5216"]], [" ", []], ["ينمو نموا فائقا", ["G5232"]], ["، ", []], ["ومحبة", ["G26"]], [" ", []], ["أحدكم", ["G1538", "G1520"]], [" ", []], ["للآخر", ["G240"]], [" ", []], ["تفيض", ["G4121"]], [" بينكم ", []], ["جميعا", ["G3956"]], [".", []]]}, {"c": 1, "v": 4, "text": "حتى إننا، نحن أنفسنا، نفتخر بكم في كنائس الله بسبب ثباتكم وإيمانكم في وسط كل ما تحتملونه من اضطهادات وضيقات.", "groups": [{"kw": "glory", "raw": "2Co_7:14, 2Co_9:2, 2Co_9:4; 1Th_2:19", "note": "", "refs": [{"l": "2Co 7:14", "n": "", "vs": [[14, "فإذا كنت قد افتخرت له بشيء فيما يتعلق بكم، فإني لم أخجل؛ وإنما كما كلمناكم في كل شيء بالصدق، كذلك كان افتخارنا بكم لتيطس صادقا أيضا."]]}, {"l": "2Co 9:2", "n": "", "vs": [[2, "مادمت أعرف استعدادكم الذي أفتخر به من جهتكم عند المقدونيين فأقول: إن مقاطعة أخائية جاهزة للإعانة منذ السنة الماضية. وحماستكم كانت دافعا لأكثر الإخوة."]]}, {"l": "2Co 9:4", "n": "", "vs": [[4, "لئلا نضطر نحن، ولا أقول أنتم، إلى الخجل بهذه الثقة العظيمة إذا ما رافقني بعض المقدونيين ووجدوكم غير جاهزين."]]}, {"l": "1Th 2:19", "n": "", "vs": [[19, "فما هو رجاؤنا أو فرحنا أو إكليل افتخارنا أمام ربنا يسوع عند عودته؟ أليس أنتم؟ بلى،"]]}], "kwAr": "نفتخر بكم", "noteAr": ""}, {"kw": "your patience", "raw": "2Th_3:5; Rom_2:7, Rom_5:3-5, Rom_8:25, Rom_12:12; 1Th_1:3, 1Th_3:2-8; Heb_6:15, Heb_10:36; Heb_12:1-3; Jam_1:3, Jam_1:4, Jam_5:7, Jam_5:8; 2Pe_1:6; Rev_14:12", "note": "", "refs": [{"l": "2Th 3:5", "n": "", "vs": [[5, "وليهد الله قلوبكم إلى ما لدى الله من المحبة ولدى المسيح من الصبر!"]]}, {"l": "Rom 2:7", "n": "", "vs": [[7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"]]}, {"l": "Rom 5:3-5", "n": "", "vs": [[3, "ليس هذا فقط، بل نفتخر أيضا في وسط الضيقات، لعلمنا أن الضيق ينتج فينا الصبر،"], [4, "والصبر يؤهلنا للفوز في الامتحان، والفوز يبعث فينا الرجاء،"], [5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."]]}, {"l": "Rom 8:25", "n": "", "vs": [[25, "ولكن، إن كنا نرجو ما لا نراه، فبالصبر نتوقعه."]]}, {"l": "Rom 12:12", "n": "", "vs": [[12, "فرحين بالرجاء، صابرين في الضيق، مواظبين على الصلاة،"]]}, {"l": "1Th 1:3", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"]]}, {"l": "1Th 3:2-8", "n": "", "vs": [[2, "فبعثنا تيموثاوس، أخانا ومعاوننا في خدمة الله بنشر الإنجيل، لكي يشددكم ويشجعكم في إيمانكم،"], [3, "حتى لا يتزعزع أحد منكم من جراء هذه الضيقات. فإنكم تعلمون أننا معينون لذلك؛"], [4, "وقد سبق لنا، لما كنا عندكم أن أخبرناكم أننا سنقاسي الضيقات، الأمر الذي حدث بعد ذلك كما تعلمون."], [5, "ولهذا أيضا، إذ صار الافتراق عنكم لا يحتمل، أرسلت أستخبر عن إيمانكم لئلا يكون المجرب قد جربكم فيذهب جهدنا سدى!"], [6, "أما الآن، وقد عاد تيموثاوس إلينا من عندكم وبشرنا بما لكم من إيمان ومحبة، وبأنكم تذكروننا ذكرا حسنا في كل حين، وتشتاقون كثيرا لرؤيتنا كما نشتاق نحن لرؤيتكم،"], [7, "فقد وجدنا بكم أيها الإخوة عزاء في وسط ضيقتنا وشدتنا من جهة إيمانكم."], [8, "فقد طابت لنا الحياة مادمتم ثابتين في الرب!"]]}, {"l": "Heb 6:15", "n": "", "vs": [[15, "وهكذا، انتظر إبراهيم بصبر فنال ما وعد به."]]}, {"l": "Heb 10:36", "n": "", "vs": [[36, "إنكم تحتاجون إلى الصبر لتعملوا إرادة الله، فتنالوا البركة التي وعدتم بها."]]}, {"l": "Heb 12:1-3", "n": "", "vs": [[1, "فبما أن هذا العدد الكبير من الشاهدين للإيمان، يتجمع حولنا كأنه سحابة عظيمة، فلنطرح جانبا كل ثقل يعيقنا عن التقدم، ونتخلص من تلك الخطيئة التي نتعرض للسقوط في فخها بسهولة، لكي نتمكن، نحن أيضا، أن نركض باجتهاد في السباق الممتد أمامنا،"], [2, "متطلعين دائما إلى يسوع: رائد إيماننا ومكمله. فهو قد تحمل الموت صلبا، هازئا بما في ذلك من عار، إذ كان ينظر إلى السرور الذي ينتظره، ثم جلس عن يمين عرش الله."], [3, "فتأملوا مليا ما قاساه بتحمله تلك المعاملة العنيفة التي عامله بها الخاطئون، لكي لا تتعبوا وتنهاروا!"]]}, {"l": "Jam 1:3", "n": "", "vs": [[3, "وكونوا على ثقة بأن امتحان إيمانكم هذا ينتج صبرا."]]}, {"l": "Jam 1:4", "n": "", "vs": [[4, "ودعوا الصبر يعمل عمله الكامل فيكم، لكي يكتمل نضوجكم وتصيروا أقوياء قادرين على مواجهة جميع الأحوال."]]}, {"l": "Jam 5:7", "n": "", "vs": [[7, "وأما أنتم، ياإخوتي، فاصبروا منتظرين عودة الرب. خذوا العبرة من الفلاح: فهو ينتظر أن تعطيه الأرض غلالا ثمينة، صابرا على الزرع حتى يشرب من مطر الخريف ومطر الربيع."]]}, {"l": "Jam 5:8", "n": "", "vs": [[8, "فاصبروا أنتم إذن، وشددوا قلوبكم لأن عودة الرب قد صارت قريبة."]]}, {"l": "2Pe 1:6", "n": "", "vs": [[6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"]]}, {"l": "Rev 14:12", "n": "", "vs": [[12, "وهنا يظهر صبر القديسين الذين يحافظون على وصايا الله والإيمان بيسوع!»"]]}], "kwAr": "ثباتكم وإيمانكم", "noteAr": ""}, {"kw": "your persecutions", "raw": "1Th_2:14, 1Th_3:3, 1Th_3:4; Jam_5:11", "note": "", "refs": [{"l": "1Th 2:14", "n": "", "vs": [[14, "فإنكم، أيها الإخوة، قد صرتم على مثال كنائس الله التي في منطقة اليهودية والتي هي في المسيح يسوع. فأنتم أيضا قاسيتم على أيدي بني جنسكم ما قاسوه هم على أيدي اليهود"]]}, {"l": "1Th 3:3", "n": "", "vs": [[3, "حتى لا يتزعزع أحد منكم من جراء هذه الضيقات. فإنكم تعلمون أننا معينون لذلك؛"]]}, {"l": "1Th 3:4", "n": "", "vs": [[4, "وقد سبق لنا، لما كنا عندكم أن أخبرناكم أننا سنقاسي الضيقات، الأمر الذي حدث بعد ذلك كما تعلمون."]]}, {"l": "Jam 5:11", "n": "", "vs": [[11, "فنحن نقول عن الصابرين على الألم: «طوبى لهم!» وقد سمعتم بصبر أيوب، ورأيتم كيف عامله الرب في النهاية. وهذا يبين أن الرب كثير الرحمة والشفقة."]]}], "kwAr": "اضطهادات وضيقات", "noteAr": ""}], "arS": [["حتى إننا، نحن أنفسنا، ", []], ["نفتخر", ["G2744"]], [" بكم في ", []], ["كنائس", ["G1577"]], [" ", []], ["الله", ["G2316"]], [" بسبب ", []], ["ثباتكم", ["G5281", "G5216"]], [" ", []], ["وإيمانكم", ["G4102"]], [" في وسط ", []], ["كل", ["G3956"]], [" ما ", []], ["تحتملونه", ["G430"]], [" من ", []], ["اضطهادات", ["G1375"]], [" ", []], ["وضيقات", ["G2347"]], [".", []]]}, {"c": 1, "v": 5, "text": "وفي هذا دليل على حكم الله العادل، بقصد أن تعتبروا مؤهلين لملكوت الله الذي من أجله تلاقون الآلام.", "groups": [{"kw": "manifest", "raw": "2Th_1:6; Phi_1:28; 1Pe_4:14-18", "note": "", "refs": [{"l": "2Th 1:6", "n": "", "vs": [[6, "فمن العدل عند الله حقا أن يجازي بالضيقة أولئك الذين يضايقونكم،"]]}, {"l": "Phi 1:28", "n": "", "vs": [[28, "غير مرتعبين في شيء من الذين يقاومونكم، فإن في مقاومتهم دليلا على هلاكهم هم وعلى خلاصكم أنتم، وذلك من عند الله."]]}, {"l": "1Pe 4:14-18", "n": "", "vs": [[14, "فإذا لحقتكم الإهانة لأنكم تحملون اسم المسيح، فطوبى لكم! لأن روح المجد، أي روح الله، يستقر عليكم."], [15, "لا يكن بينكم من يتأ لم عقابا على شر ارتكبه: كالقتل أو السرقة، أو غيرهما من الجرائم، أو التدخل في شؤون الآخرين."], [16, "ولكن إن تألم أحدكم لأنه «مسيحي»، فعليه ألا يخجل، بل أن يمجد الله لأجل هذا الاسم!"], [17, "حقا إن الوقت قد حان ليبتديء القضاء بأهل بيت الله. فإن كان القضاء يبدأ بنا أولا، فما هو مصير الذين لا يؤمنون بإنجيل الله؟"], [18, "وإن كان البار يخلص بجهد، فماذا يحدث للشرير والخاطيء؟"]]}], "kwAr": "دليل", "noteAr": ""}, {"kw": "righteous", "raw": "Job_8:3; Psa_9:7, Psa_9:8, Psa_33:5, Psa_50:6, Psa_72:2, Psa_99:4, Psa_111:7; Jer_9:24; Dan_4:37; Rom_2:5; Rev_15:4, Rev_16:7, Rev_19:2", "note": "", "refs": [{"l": "Job 8:3", "n": "", "vs": [[3, "أيحرف الله القضاء، أم يعكس القدير ما هو حق؟"]]}, {"l": "Psa 9:7", "n": "", "vs": [[7, "أما الرب فإلى الأبد يملك. ثبت عرشه للقضاء."]]}, {"l": "Psa 9:8", "n": "", "vs": [[8, "يدين العالم بالعدل ويقضي بين الشعوب بالإنصاف."]]}, {"l": "Psa 33:5", "n": "", "vs": [[5, "يحب البر والعدل. ورحمته تغمر الأرض."]]}, {"l": "Psa 50:6", "n": "", "vs": [[6, "فتذيع السماوات عدله لأن الله هو الديان."]]}, {"l": "Psa 72:2", "n": "", "vs": [[2, "فيقضي لشعبك بالعدل ومساكينك بالإنصاف."]]}, {"l": "Psa 99:4", "n": "", "vs": [[4, "قوة الملك في حب الحق. وأنت يارب ثبت الإنصاف وأجريت الحق والعدل في إسرائيل."]]}, {"l": "Psa 111:7", "n": "", "vs": [[7, "أعمال يديه حق وعدل. وكل وصاياه أمينة."]]}, {"l": "Jer 9:24", "n": "", "vs": [[24, "بل ليفتخر المفتخر بأنه يدرك ويعرفني أني أنا الرب الذي يمارس الرحمة والعدل والبر في الأرض لأني أسر بها»."]]}, {"l": "Dan 4:37", "n": "", "vs": [[37, "فالآن، أنا نبوخذناصر، أسبح وأمجد وأحمد ملك السماء الذي جميع أعماله حق، وطرقه عادلة وقادر على إذلال كل من يسلك بالكبرياء."]]}, {"l": "Rom 2:5", "n": "", "vs": [[5, "ولكنك بسبب قساوتك وقلبك غير التائب، تخزن لنفسك غضبا ليوم الغضب، يوم تعلن دينونة الله العادلة."]]}, {"l": "Rev 15:4", "n": "", "vs": [[4, "من لا يخافك يارب ولا يمجد اسمك؟ فأنت وحدك قدوس! والأمم جميعا سيأتون ويسجدون لك، لأن أحكامك قد ظهرت جلية»."]]}, {"l": "Rev 16:7", "n": "", "vs": [[7, "وسمعت ملاك المذبح يقول: «إن أحكامك حق وعدل أيها الرب الإله القادر على كل شيء»."]]}, {"l": "Rev 19:2", "n": "", "vs": [[2, "فإن أحكامه حق وعدل، لأنه عاقب الزانية الكبرى التي أفسدت الأرض، وانتقم لدم عبيده منها»."]]}], "kwAr": "حكم الله العادل", "noteAr": ""}, {"kw": "may", "raw": "2Th_1:11; Luk_20:35, Luk_21:36; Act_13:46; Eph_4:1; Col_1:12; Rev_3:4", "note": "", "refs": [{"l": "2Th 1:11", "n": "", "vs": [[11, "لأجل ذلك أيضا نصلي من أجلكم على الدوام، لكي يجعلكم إلهنا مؤهلين للدعوة الإلهية ويتم فيكم، بقدرته، كل ما يسره من الصلاح وفعالية الإيمان،"]]}, {"l": "Luk 20:35", "n": "", "vs": [[35, "أما الذين حسبوا أهلا للمشاركة في الزمان الآتي والقيامة من بين الأموات، فلا يزوجون ولا يزوجون."]]}, {"l": "Luk 21:36", "n": "", "vs": [[36, "فاسهروا إذن وتضرعوا في كل حين، لكي تتمكنوا من أن تنجوا من جميع هذه الأمور التي هي على وشك أن تحدث، وتقفوا أمام ابن الإنسان»."]]}, {"l": "Act 13:46", "n": "", "vs": [[46, "فخاطبهم بولس وبرنابا بجرأة قائلين: «كان يجب أن نبلغكم أنتم أولا كلمة الله، ولكنكم رفضتموها فأظهرتم أنكم لا تستحقون الحياة الأبدية. وها نحن نتوجه إلى غير اليهود!"]]}, {"l": "Eph 4:1", "n": "", "vs": [[1, "... إذن، أنا السجين في الرب، أناشدكم أن تسلكوا سلوكا يليق بالدعوة التي إليها دعيتم،"]]}, {"l": "Col 1:12", "n": "", "vs": [[12, "رافعين الشكر بفرح للآب الذي جعلكم أهلا للاشتراك في ميراث القديسين في (ملكوت) النور،"]]}, {"l": "Rev 3:4", "n": "", "vs": [[4, "إلا أن عندك في ساردس قليلين لم يلوثوا ثيابهم بالنجاسة. هؤلاء سيسيرون معي لابسين ثيابا بيضاء."]]}], "kwAr": "أن تعتبروا مؤهلين", "noteAr": ""}, {"kw": "for", "raw": "2Th_1:7; Act_14:22; Rom_8:17; 1Th_2:14; 2Ti_2:12; Heb_10:32, Heb_10:33", "note": "", "refs": [{"l": "2Th 1:7", "n": "", "vs": [[7, "وأن يكافئكم، أنتم الذين تتضايقون، كما يكافئنا نحن، بالراحة لدى ظهور الرب يسوع علنا من السماء، ومعه ملائكة قدرته،"]]}, {"l": "Act 14:22", "n": "", "vs": [[22, "وفي هذه الأماكن كلها كانا يشددان عزيمة التلاميذ، ويحثانهم على الثبات في الإيمان، مؤكدين لهم أن دخول ملكوت الله يقتضي أن نقاسي صعوبات كثيرة."]]}, {"l": "Rom 8:17", "n": "", "vs": [[17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}, {"l": "1Th 2:14", "n": "", "vs": [[14, "فإنكم، أيها الإخوة، قد صرتم على مثال كنائس الله التي في منطقة اليهودية والتي هي في المسيح يسوع. فأنتم أيضا قاسيتم على أيدي بني جنسكم ما قاسوه هم على أيدي اليهود"]]}, {"l": "2Ti 2:12", "n": "", "vs": [[12, "إن تحملنا الآلام، فسوف نملك أيضا معه؛ إن أنكرناه، فسوف ينكرنا أيضا؛"]]}, {"l": "Heb 10:32", "n": "", "vs": [[32, "لا تنسوا أبدا تلك الأيام الماضية التي فيها، بعدما أشرق عليكم نور الإيمان بالمسيح، صبرتم على جهاد مرير طويل، إذ قاسيتم كثيرا من الآلام."]]}, {"l": "Heb 10:33", "n": "", "vs": [[33, "وذلك عندما تعرضتم للإهانات والمضايقات من جهة، وعندما شاركتم الذين عوملوا مثل هذه المعاملة من جهة أخرى."]]}], "kwAr": "الذي من أجله تلاقون الآلام", "noteAr": ""}], "arS": [["وفي هذا ", []], ["دليل", ["G1730"]], [" على ", []], ["حكم", ["G2920"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["العادل", ["G1342"]], ["، بقصد أن ", []], ["تعتبروا مؤهلين", ["G2661"]], [" ", []], ["لملكوت", ["G932"]], [" ", []], ["الله", ["G2316"]], [" الذي من أجله ", []], ["تلاقون الآلام", ["G3958"]], [".", []]]}, {"c": 1, "v": 6, "text": "فمن العدل عند الله حقا أن يجازي بالضيقة أولئك الذين يضايقونكم،", "groups": [{"kw": "", "raw": "Deu_32:41-43; Psa_74:22, Psa_74:23, Psa_79:10-12, Psa_94:20-23; Isa_49:26; Zec_2:8; Rev_6:10, Rev_11:18, Rev_15:4, Rev_16:5, Rev_16:6, Rev_18:20,Rev_18:24, Rev_19:2", "note": "", "refs": [{"l": "Deu 32:41-43", "n": "", "vs": [[41, "إذا سننت سيفي البارق وأمسكت به يدي للقضاء، فإني أنتقم من أعدائي، وأجازي مبغضي."], [42, "أسكر سهامي بالدم ويلتهم سيفي لحما، من دم القتلى والسبايا ورؤوس قادة العدو."], [43, "تهللي أيتها الأمم مع شعبه، لأنه سينتقم لدماء عبيده ويثأر من أعدائه ويصفح عن أرضه وعن شعبه»."]]}, {"l": "Psa 74:22", "n": "", "vs": [[22, "قم ياالله ودافع عن دعواك. اذكر كيف يعيرك الجاهل طول النهار."]]}, {"l": "Psa 74:23", "n": "", "vs": [[23, "لا تنس أصوات خصومك، فإن ضجيج الثائرين عليك يتصاعد دائما."]]}, {"l": "Psa 79:10-12", "n": "", "vs": [[10, "لماذا تسألنا الأمم: أين إلهكم؟ دعنا نرى كيف يذيع بين الأمم خبر انتقامك لدماء عبيدك المسفوكة."], [11, "ليتصاعد أمامك أنين المأسور. حافظ بعظمة قوتك على المحكوم عليهم بالموت."], [12, "رد يارب على الأمم سبع مرات ما عيروك وأهانوك به،"]]}, {"l": "Psa 94:20-23", "n": "", "vs": [[20, "أيحالفك ملك الشر المختلق إثما ليجعل الظلم شريعة للقضاء؟"], [21, "يجتمعون معا للقضاء على حياة الصديق، ويحكمون على البريء بالموت."], [22, "ولكن الرب هو حصني المنيع؛ إلهي هو الصخرة التي بها أحتمي."], [23, "غير أن الرب إلهنا يعاقبهم على إثمهم، ويبيدهم بشرهم."]]}, {"l": "Isa 49:26", "n": "", "vs": [[26, "وأجعل مضطهديك يلتهمون لحوم أجسادهم، ويسكرون بدمهم كمن يشرب خمرا. عندئذ يدرك كل ذي جسد أنني أنا الرب مخلصك وفاديك إله يعقوب القدير."]]}, {"l": "Zec 2:8", "n": "", "vs": [[8, "فإن الرب القدير يقول إنه أرسلني إلى الأمم التي سلبتكم إعلاء لمجده، لأن من يمسكم يمس حدقة عينه."]]}, {"l": "Rev 6:10", "n": "", "vs": [[10, "وهم يصرخون للرب بأعلى صوتهم: «حتى متى، أيها السيد القدوس والحق، تؤخر معاقبة أهل الأرض على ما فعلوه بنا؟ متى تنتقم منهم لدمائنا؟»"]]}, {"l": "Rev 11:18", "n": "", "vs": [[18, "غضبت الشعوب عليك، فجاء دور غضبك عليهم. جاءت الساعة ليدان الأموات، وتكافيء عبيدك الأنبياء والقديسين والمتقين اسمك، صغارا وكبارا، وتهلك الذين كانوا يدمرون الأرض!»"]]}, {"l": "Rev 15:4", "n": "", "vs": [[4, "من لا يخافك يارب ولا يمجد اسمك؟ فأنت وحدك قدوس! والأمم جميعا سيأتون ويسجدون لك، لأن أحكامك قد ظهرت جلية»."]]}, {"l": "Rev 16:5", "n": "", "vs": [[5, "وسمعت ملاك المياه يقول: «عادل أنت في أحكامك، أيها الإله القدوس، الكائن والذي كان،"]]}, {"l": "Rev 16:6", "n": "", "vs": [[6, "فقد سفك الناس دم قديسين وأنبياء، وها أنت تسقي قاتليهم دما! إنهم ينالون ما يستحقون!»"]]}, {"l": "Rev 18:20", "n": "", "vs": [[20, "اشمتي بها أيتها السماء! واشمتوا بها أيها القديسون والرسل والأنبياء، فقد أصدر الله حكمه عليها بعدما أصدرت أحكامها عليكم»."]]}, {"l": "Rev 18:24", "n": "", "vs": [[24, "وفيها وجدت دماء أنبياء وقديسين وجميع الذين قتلوا على الأرض»."]]}, {"l": "Rev 19:2", "n": "", "vs": [[2, "فإن أحكامه حق وعدل، لأنه عاقب الزانية الكبرى التي أفسدت الأرض، وانتقم لدم عبيده منها»."]]}], "kwAr": "", "noteAr": ""}], "arS": [["فمن ", []], ["العدل", ["G1342"]], [" عند ", []], ["الله", ["G2316"]], [" حقا أن ", []], ["يجازي", ["G467"]], [" ", []], ["بالضيقة", ["G2347"]], [" أولئك الذين ", []], ["يضايقونكم", ["G2346", "G5209"]], ["،", []]]}, {"c": 1, "v": 7, "text": "وأن يكافئكم، أنتم الذين تتضايقون، كما يكافئنا نحن، بالراحة لدى ظهور الرب يسوع علنا من السماء، ومعه ملائكة قدرته،", "groups": [{"kw": "who", "raw": "Isa_57:2; Mat_5:10-12; Luk_16:25; Rom_8:17; 2Co_4:17; 2Ti_2:12; Heb_4:1, Heb_4:9, Heb_4:11; 1Pe_4:1; Rev_7:14-17, Rev_14:13, Rev_21:4", "note": "", "refs": [{"l": "Isa 57:2", "n": "", "vs": [[2, "والسالكون بالاستقامة ينعمون بالسلام، وفي مضاجعهم يستريحون."]]}, {"l": "Mat 5:10-12", "n": "", "vs": [[10, "طوبى للمضطهدين من أجل البر، فإن لهم ملكوت السماوات."], [11, "طوبى لكم متى أهانكم الناس واضطهدوكم، وقالوا فيكم من أجلي كل سوء كاذبين."], [12, "افرحوا وتهللوا، فإن مكافأتكم في السماوات عظيمة. فإنهم هكذا اضطهدوا الأنبياء من قبلكم!"]]}, {"l": "Luk 16:25", "n": "", "vs": [[25, "ولكن إبراهيم قال: يابني، تذكر أنك نلت خيراتك كاملة في أثناء حياتك، ولعازر نال البلايا. ولكنه الآن يتعزى هنا، وأنت هناك تتعذب."]]}, {"l": "Rom 8:17", "n": "", "vs": [[17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}, {"l": "2Co 4:17", "n": "", "vs": [[17, "ذلك لأن ما يضايقنا الآن من صعوبات بسيطة عابرة، ينتج لنا بمقدار لا يحد وزنة أبدية من المجد،"]]}, {"l": "2Ti 2:12", "n": "", "vs": [[12, "إن تحملنا الآلام، فسوف نملك أيضا معه؛ إن أنكرناه، فسوف ينكرنا أيضا؛"]]}, {"l": "Heb 4:1", "n": "", "vs": [[1, "ومادام الوعد بالدخول إلى الراحة الإلهية قائما حتى الآن، فلنخف: فربما تبين أن بعضا منكم قد فشلوا في الدخول."]]}, {"l": "Heb 4:9", "n": "", "vs": [[9, "إذن، مازالت الراحة الحقيقية الكاملة محفوظة لشعب الله."]]}, {"l": "Heb 4:11", "n": "", "vs": [[11, "لذلك، لنجتهد جميعا للدخول إلى تلك الراحة، لكي لا يسقط أحد منا كما سقط أولئك الذين عصوا أمر الله."]]}, {"l": "1Pe 4:1", "n": "", "vs": [[1, "فبما أن المسيح قد تحمل الآلام الجسمية لأجلكم، سلحوا أنفسكم بالاستعداد دائما لتحمل الآلام. فإن من يتحمل الآلام الجسمية، يكون قد قاطع الخطيئة."]]}, {"l": "Rev 7:14-17", "n": "", "vs": [[14, "فأجبته: «أنت أعلم ياسيدي!» فقال: «هؤلاء هم الذين أتوا من الضيقة العظيمة، وقد غسلوا ثيابهم وبيضوها بدم الحمل."], [15, "لهذا هم أمام عرش الله يخدمونه في هيكله ليلا ونهارا والجالس على العرش يبسط خيمته عليهم،"], [16, "فلن يجوعوا ولن يعطشوا، ولن تضربهم الشمس ولا أي حر،"], [17, "لأن الحمل الذي في وسط العرش يرعاهم ويقودهم إلى ينابيع ماء الحياة، ويمسح الله كل دمعة من عيونهم»."]]}, {"l": "Rev 14:13", "n": "", "vs": [[13, "وسمعت صوتا من السماء يقول: «اكتب: طوبى للأموات الذين يموتون منذ الآن وهم في الرب! يقول الروح: نعم! فليستريحوا من متاعبهم، لأن أعمالهم ترافقهم»."]]}, {"l": "Rev 21:4", "n": "", "vs": [[4, "وسيمسح كل دمعة من عيونهم. إذ يزول الموت والحزن والصراخ والألم، لأن الأمور القديمة كلها قد زالت!»"]]}], "kwAr": "أنتم الذين تتضايقون", "noteAr": ""}, {"kw": "when", "raw": "Mat_13:39-43, Mat_16:27, Mat_25:31, Mat_26:64; Mar_8:38, Mar_14:62; Joh_1:51; Act_1:11; 1Th_4:16, 1Th_4:17; Tit_2:13; Heb_9:28; Jud_1:14, Jud_1:15; Rev_1:7, Rev_20:11", "note": "", "refs": [{"l": "Mat 13:39-43", "n": "", "vs": [[39, "أما العدو الذي زرع الزوان فهو إبليس. والحصاد هو نهاية الزمان. والحصادون هم الملائكة."], [40, "وكما يجمع الزوان ويحرق بالنار، هكذا يحدث في نهاية الزمان:"], [41, "يرسل ابن الإنسان ملائكته، فيخرجون من ملكوته جميع المفسدين ومرتكبي الإثم،"], [42, "ويطرحونهم في أتون النار، هناك يكون البكاء وصرير الأسنان."], [43, "عندئذ يضيء الأبرار كالشمس في ملكوت أبيهم. من له أذنان، فليسمع!"]]}, {"l": "Mat 16:27", "n": "", "vs": [[27, "فإن ابن الإنسان سوف يعود في مجد أبيه مع ملائكته، فيجازي كل واحد حسب أعماله."]]}, {"l": "Mat 25:31", "n": "", "vs": [[31, "وعندما يعود ابن الإنسان في مجده ومعه جميع ملائكته، فإنه يجلس على عرش مجده،"]]}, {"l": "Mat 26:64", "n": "", "vs": [[64, "فأجابه يسوع: «أنت قلت! وأقول لكم أيضا إنكم منذ الآن سوف ترون ابن الإنسان جالسا عن يمين القدرة ثم آتيا على سحب السماء!»"]]}, {"l": "Mar 8:38", "n": "", "vs": [[38, "فإن أي من يستحي بي وبكلامي في هذا الجيل الفاسق الخاطيء، به يستحي ابن الإنسان عندما يعود في مجد أبيه مع الملائكة المقدسين»."]]}, {"l": "Mar 14:62", "n": "", "vs": [[62, "فقال يسوع: «أنا هو. وسوف ترون ابن الإنسان جالسا عن يمين القدرة، ثم آتيا على سحب السماء! »"]]}, {"l": "Joh 1:51", "n": "", "vs": [[51, "ثم قال له: «الحق الحق أقول لكم: إنكم سترون السماء مفتوحة، وملائكة الله يصعدون وينزلون على ابن الإنسان!»"]]}, {"l": "Act 1:11", "n": "", "vs": [[11, "وقالا لهم: «أيها الجليليون، لماذا تقفون ناظرين إلى السماء؟ إن يسوع، هذا الذي ارتفع عنكم إلى السماء، سيعود منها مثلما رأيتموه منطلقا إليها!»"]]}, {"l": "1Th 4:16", "n": "", "vs": [[16, "لأن الرب نفسه سينزل من السماء حالما يدوي أمر بالتجمع، وينادي رئيس ملائكة، ويبوق في بوق إلهي، عندئذ يقوم الأموات في المسيح أولا."]]}, {"l": "1Th 4:17", "n": "", "vs": [[17, "ثم إننا، نحن الباقين أحياء، نختطف جميعا في السحب للاجتماع بالرب في الهواء. وهكذا نبقى مع الرب على الدوام."]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "Heb 9:28", "n": "", "vs": [[28, "كذلك المسيح أيضا: مات مرة واحدة حاملا خطايا كثيرين، مقربا نفسه (لله) عوضا عنهم. ولا بد أن يعود إلى الظهور. لا ليعالج الخطايا، بل ليحقق الخلاص النهائي لجميع منتظريه!"]]}, {"l": "Jud 1:14", "n": "", "vs": [[14, "عن هؤلاء وأمثالهم، تنبأ أخنوخ السابع بعد آدم، فقال: «انظروا إن الرب آت بصحبة عشرات الألوف من قديسيه،"]]}, {"l": "Jud 1:15", "n": "", "vs": [[15, "ليدين جميع الناس، ويوبخ جميع الأشرار الذين لا يهابون الله ، بسبب جميع أعمالهم الشريرة التي ارتكبوها وجميع أقوالهم القاسية التي أهانوه بها والتي لا تصدر إلا عن الخاطئين الأشرار غير الأتقياء!»"]]}, {"l": "Rev 1:7", "n": "", "vs": [[7, "ها هو آت مع السحاب! ستراه عيون الجميع، حتى أولئك الذين طعنوه، وتنوح بسببه قبائل الأرض كلها! نعم، آمين!"]]}, {"l": "Rev 20:11", "n": "", "vs": [[11, "ثم رأيت عرشا عظيما أبيض هربت السماء والأرض من أمام الجالس عليه، فلم يبق لهما مكان."]]}], "kwAr": "لدى ظهور الرب يسوع", "noteAr": ""}, {"kw": "his mighty angels", "raw": "Gr. the angels of his power, Joh_1:3; Eph_1:2; Col_1:16; 1Pe_3:22; Rev_22:6, Rev_22:9, Rev_22:16", "note": "Gr. the angels of his power, Joh_1:3; Eph_1:2; Col_1:16; 1Pe_3:22; Rev_22:6, Rev_22:9, Rev_22:16", "refs": [{"l": "Joh 1:3", "n": "", "vs": [[3, "به تكون كل شيء، وبغيره لم يتكون أي شيء مما تكون."]]}, {"l": "Eph 1:2", "n": "", "vs": [[2, "لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."]]}, {"l": "Col 1:16", "n": "", "vs": [[16, "إذ به خلقت جميع الأشياء: ما في السماوات وما على الأرض، ما يرى وما لا يرى، أعروشا كانت أم سيادات أم رئاسات أم سلطات. كل ما في الكون قد خلق به ولأجله."]]}, {"l": "1Pe 3:22", "n": "", "vs": [[22, "الذي انطلق إلى السماء، وهو الآن جالس عن يمين الله؛ وقد جعلت الملائكة والسلطات والقوات (الروحية) خاضعة له!"]]}, {"l": "Rev 22:6", "n": "", "vs": [[6, "وقال لي الملاك: «هذا الكلام صدق وحق. إن الرب إله أرواح الأنبياء أرسل ملاكه ليخبر عبيده بما لا بد أن يحدث سريعا"]]}, {"l": "Rev 22:9", "n": "", "vs": [[9, "فقال لي: «لا تفعل! إنني عبد مثلك ومثل إخوتك الأنبياء، ومثل الذين يراعون ما جاء في هذا الكتاب. لله اسجد!»"]]}, {"l": "Rev 22:16", "n": "", "vs": [[16, "أنا يسوع أرسلت ملاكي لأشهد لكم بهذه الأمور في الكنائس. أنا أصل داود ونسله. أنا كوكب الصبح المنير»."]]}], "kwAr": "ملائكة قدرته", "noteAr": "في اليونانية: ملائكة قوته."}], "arS": [["وأن يكافئكم، أنتم الذين ", []], ["تتضايقون", ["G2346"]], ["، كما يكافئنا نحن، ", []], ["بالراحة", ["G425"]], [" لدى ", []], ["ظهور", ["G602"]], [" ", []], ["الرب", ["G2962"]], [" ", []], ["يسوع", ["G2424"]], [" علنا من ", []], ["السماء", ["G3772"]], ["، ومعه ", []], ["ملائكة", ["G32"]], [" ", []], ["قدرته", ["G1411"]], ["،", []]]}, {"c": 1, "v": 8, "text": "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع.", "groups": [{"kw": "flaming", "raw": "Gen_3:24; Deu_4:11, Deu_5:5; Psa_21:8, Psa_21:9, Psa_50:2-6; Dan_7:10; Mat_25:41, Mat_25:46; Heb_10:27, Heb_12:29; 2Pe_3:7, 2Pe_3:10-12; Rev_20:10,Rev_20:14, Rev_20:15, Rev_21:8", "note": "", "refs": [{"l": "Gen 3:24", "n": "", "vs": [[24, "وهكذا طرد الله الإنسان من جنة عدن، وأقام ملائكة الكروبيم وسيفا ناريا متقلبا شرقي الجنة لحراسة الطريق المفضية إلى «شجرة الحياة»."]]}, {"l": "Deu 4:11", "n": "", "vs": [[11, "فتقدمتم ووقفتم عند سفح الجبل المشتعل بنار امتدت ألسنة لهبها إلى كبد السماء، وتلفعت بسحب داكنة وضباب."]]}, {"l": "Deu 5:5", "n": "", "vs": [[5, "وكنت أنا واقفا بين الرب وبينكم، لأنكم خفتم من النار، فلم تصعدوا إلى الجبل. فقال الرب:"]]}, {"l": "Psa 21:8", "n": "", "vs": [[8, "يدك حتما تنال جميع أعدائك، ويمناك حقا تظفر بمبغضيك."]]}, {"l": "Psa 21:9", "n": "", "vs": [[9, "حين يتجلى وجهك تحرقهم كما بتنور مشتعل. تلتهمهم في غضبك فتأكلهم النار."]]}, {"l": "Psa 50:2-6", "n": "", "vs": [[2, "من صهيون الكاملة الجمال أشرق مجد الله."], [3, "يأتي إلهنا ولا يصمت، تحيط به النار الآكلة والعواصف الثائرة."], [4, "ينادي السماوات من العلى، والأرض أيضا من تحت لكي يدين شعبه، قائلا:"], [5, "«اجمعوا إلي أتقيائي الذين قطعوا معي عهدا على ذبيحة»."], [6, "فتذيع السماوات عدله لأن الله هو الديان."]]}, {"l": "Dan 7:10", "n": "", "vs": [[10, "ومن أمامه يتدفق ويجري نهر من نار، وتخدمه ألوف ألوف الملائكة، ويمثل في حضرته عشرات الألوف. فانعقد مجلس القضاء وفتحت الأسفار."]]}, {"l": "Mat 25:41", "n": "", "vs": [[41, "ثم يقول للذين عن يساره: ابتعدوا عني ياملاعين إلى النار الأبدية المعدة لإبليس وأعوانه!"]]}, {"l": "Mat 25:46", "n": "", "vs": [[46, "فيذهب هؤلاء إلى العقاب الأبدي، والأبرار إلى الحياة الأبدية! »"]]}, {"l": "Heb 10:27", "n": "", "vs": [[27, "بل انتظار العقاب الأكيد في لهيب النار التي ستلتهم المتمردين. ويا له من انتظار مخيف!"]]}, {"l": "Heb 12:29", "n": "", "vs": [[29, "متذكرين أن «إلهنا نار آكلة!»"]]}, {"l": "2Pe 3:7", "n": "", "vs": [[7, "أما السماوات والأرض الحالية، فستبقى مخزونة ومحفوظة للنار بتلك الكلمة عينها إلى يوم الدينونة وهلاك الفاجرين!"]]}, {"l": "2Pe 3:10-12", "n": "", "vs": [[10, "إلا أن «يوم الرب» سيأتي كما يأتي اللص في الليل. في ذلك اليوم، تزول السماوات محدثة دويا هائلا وتنحل العناصر محترقة بنار شديدة، وتحترق الأرض وما فيها من منجزات."], [11, "ومادامت هذه الأشياء جميعا ستنحل، فكيف يجب أن تكونوا أنتم أصحاب سلوك مقدس يتصف بالتقوى،"], [12, "منتظرين «يوم الله» الأبدي وطالبين حلوله بسرعة. ففي ذلك اليوم، تنحل السماوات ملتهبة، وتذوب العناصر محترقة."]]}, {"l": "Rev 20:10", "n": "", "vs": [[10, "ثم يطرح إبليس الذي كان يضللهم، في بحيرة النار والكبريت، حيث الوحش والنبي الدجال. هناك سوف يعذبون نهارا وليلا، إلى أبد الآبدين."]]}, {"l": "Rev 20:14", "n": "", "vs": [[14, "وطرح الموت وهاوية الموتى في بحيرة النار، الذي هو الموت الثاني."]]}, {"l": "Rev 20:15", "n": "", "vs": [[15, "وكل من لم يوجد اسمه مكتوبا في سجل الحياة طرح في بحيرة النار!"]]}, {"l": "Rev 21:8", "n": "", "vs": [[8, "أما الجبناء وغير المؤمنين، والفاسدون والقاتلون والزناة، والمتصلون بالشياطين وعبدة الأصنام وجميع الدجالين، فمصيرهم إلى البحيرة المتقدة بالنار والكبريت، الذي هو الموت الثاني»."]]}], "kwAr": "نار ملتهبة", "noteAr": ""}, {"kw": "taking", "raw": "or, yielding vengeance, Deu_32:35, Deu_32:41, Deu_32:42; Psa_2:9-12, Psa_94:1; Isa_61:2, Isa_63:4-6; Heb_10:30; Rev_6:10,Rev_6:16, Rev_6:17", "note": "or, yielding vengeance, Deu_32:35, Deu_32:41, Deu_32:42; Psa_2:9-12, Psa_94:1; Isa_61:2, Isa_63:4-6; Heb_10:30; Rev_6:10,Rev_6:16, Rev_6:17", "refs": [{"l": "Deu 32:35", "n": "", "vs": [[35, "لي النقمة وأنا أجازي. وفي الوقت المعين تزل أقدامهم فيوم هلاكهم بات وشيكا، ومصيرهم المحتوم يسرع إليهم،"]]}, {"l": "Deu 32:41", "n": "", "vs": [[41, "إذا سننت سيفي البارق وأمسكت به يدي للقضاء، فإني أنتقم من أعدائي، وأجازي مبغضي."]]}, {"l": "Deu 32:42", "n": "", "vs": [[42, "أسكر سهامي بالدم ويلتهم سيفي لحما، من دم القتلى والسبايا ورؤوس قادة العدو."]]}, {"l": "Psa 2:9-12", "n": "", "vs": [[9, "فتكسرهم بقضيب من حديد، وتحطمهم كآنية الفخار»."], [10, "والآن تعقلوا أيها الملوك، واحذروا ياحكام الأرض."], [11, "اعبدوا الرب بخوف، وابتهجوا برعدة."], [12, "قبلوا الابن لئلا يغضب، فتهلكوا في الطريق، لئلا يتوهج غضبه سريعا. طوبى لجميع المتكلين عليه."]]}, {"l": "Psa 94:1", "n": "", "vs": [[1, "يارب أنت إله الانتقام، فتجل بغضبك."]]}, {"l": "Isa 61:2", "n": "", "vs": [[2, "لأعلن سنة الرب المقبولة، ويوم انتقام لإلهنا، لأعزي جميع النائحين."]]}, {"l": "Isa 63:4-6", "n": "", "vs": [[4, "لأن يوم الانتقام كان كامنا في قلبي، وسنة مفديي قد أتت."], [5, "تلفت فلم أعثر على معين، وعجبت إذ لم يكن من ناصر، فانتصرت بقوة ذراعي، وتأيدت بنجدة سخطي،"], [6, "فدست الشعوب في غيظي، وأسكرتهم في غضبي، وسكبت دماءهم فوق الأرض."]]}, {"l": "Heb 10:30", "n": "", "vs": [[30, "فنحن نعرف من قال: «لي الانتقام، أنا أجازي، يقول الرب!» وأيضا: «إن الرب سوف يحاكم شعبه!»"]]}, {"l": "Rev 6:10", "n": "", "vs": [[10, "وهم يصرخون للرب بأعلى صوتهم: «حتى متى، أيها السيد القدوس والحق، تؤخر معاقبة أهل الأرض على ما فعلوه بنا؟ متى تنتقم منهم لدمائنا؟»"]]}, {"l": "Rev 6:16", "n": "", "vs": [[16, "وهم يقولون للجبال والصخور: اسقطي علينا، وأخفينا من وجه الجالس على العرش ومن غضب الحمل!»"]]}, {"l": "Rev 6:17", "n": "", "vs": [[17, "فإن يوم الغضب العظيم قد جاءهم، ومن يقوى على الوقوف أمامه؟"]]}], "kwAr": "منتقما", "noteAr": "أو: مُوقعًا الانتقام."}, {"kw": "that know", "raw": "Exo_5:2; 1Sa_2:12; Psa_9:10, Psa_79:6; Isa_27:11; Jer_9:6; Zep_1:6; Joh_3:19, Joh_8:19; Rom_1:28; 1Co_15:34; 1Th_4:5", "note": "", "refs": [{"l": "Exo 5:2", "n": "", "vs": [[2, "فقال فرعون: «من هو الرب حتى أطيع أمره وأطلق إسرائيل؟ أنا لا أعرف الرب ولن أطلق بني إسرائيل»."]]}, {"l": "1Sa 2:12", "n": "", "vs": [[12, "أما ابنا عالي فكانا متورطين في الشر لا يعرفان الرب"]]}, {"l": "Psa 9:10", "n": "", "vs": [[10, "ويتكل عليك الذين يعرفون اسمك، لأنك يارب لم تخذل طالبيك."]]}, {"l": "Psa 79:6", "n": "", "vs": [[6, "صب غضبك على الأمم الذين لم يعرفوك، وعلى الممالك التي لم تدع باسمك،"]]}, {"l": "Isa 27:11", "n": "", "vs": [[11, "ومتى يبست فروعها تتكسر، فتقبل النساء ويستخدمنها وقودا للنار. لأن هذا شعب جاهل، لذلك لا يرحمه صانعه ولا يرفق به خالقه."]]}, {"l": "Jer 9:6", "n": "", "vs": [[6, "يجمعون ظلما فوق ظلم، وخداعا على خداع، وأبوا أن يعرفوني»."]]}, {"l": "Zep 1:6", "n": "", "vs": [[6, "والذين ارتدوا عن اتباع الرب، والذين كفوا عن طلبه والتماسه."]]}, {"l": "Joh 3:19", "n": "", "vs": [[19, "وهذا هو الحكم: إن النور قد جاء إلى العالم، ولكن الناس أحبوا الظلمة أكثر من النور، لأن أعمالهم كانت شريرة."]]}, {"l": "Joh 8:19", "n": "", "vs": [[19, "فسألوه: «أين أبوك؟» فأجاب: «أنتم لا تعرفونني، ولا تعرفون أبي. ولو عرفتموني لعرفتم أبي أيضا»."]]}, {"l": "Rom 1:28", "n": "", "vs": [[28, "وبما أنهم لم يتخيروا إبقاء الله ضمن معرفتهم، أسلمهم الله إلى ذهن عاطل عن التمييز دفعهم إلى ممارسة الأمور غير اللائقة."]]}, {"l": "1Co 15:34", "n": "", "vs": [[34, "عودوا إلى الصواب كما يجب ولا تخطئوا، فإن بعضا منكم يجهلون الله تماما أقول هذا لكي تخجلوا!"]]}, {"l": "1Th 4:5", "n": "", "vs": [[5, "غير منساق للشهوة الجامحة كالوثنيين الذين لا يعرفون الله ،"]]}], "kwAr": "غير العارفين لله", "noteAr": ""}, {"kw": "and that", "raw": "Deu_4:30; Psa_18:44; Isa_1:19; Act_6:7; Rom_1:5, Rom_2:7, Rom_2:8, Rom_6:16, Rom_10:16, Rom_15:18; Rom_16:26; 2Co_10:5; Gal_3:1; Heb_2:3, Heb_5:9, Heb_11:8; 1Pe_1:2, 1Pe_3:6, 1Pe_4:17", "note": "", "refs": [{"l": "Deu 4:30", "n": "", "vs": [[30, "فعندما يكتنفكم الضيق وتصيبكم في آخر الأيام جميع هذه الأمور، عندئذ ترجعون إلى الرب إلهكم وتطيعون أوامره."]]}, {"l": "Psa 18:44", "n": "", "vs": [[44, "فما إن يسمعوا أمري حتى يلبوه. الغرباء يتذللون لي"]]}, {"l": "Isa 1:19", "n": "", "vs": [[19, "إن شئتم وأطعتم تتمتعون بخيرات الأرض،"]]}, {"l": "Act 6:7", "n": "", "vs": [[7, "فزادت كلمة الله انتشارا، وتكاثر عدد التلاميذ في أورشليم، وأذعن للإيمان مجموعة كبيرة من الكهنة."]]}, {"l": "Rom 1:5", "n": "", "vs": [[5, "الذي به ولأجل اسمه نلنا نعمة ورسالة لإطاعة الإيمان بين جميع الأمم،"]]}, {"l": "Rom 2:7", "n": "", "vs": [[7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"]]}, {"l": "Rom 2:8", "n": "", "vs": [[8, "ويكون الغضب والسخط للمخاصمين الذين يرفضون الطاعة للحق ولكنهم يخضعون للإثم."]]}, {"l": "Rom 6:16", "n": "", "vs": [[16, "أما تعلمون أنكم عندما تقدمون أنفسكم عبيدا للطاعة، تكونون للذي تطيعونه عبيدا: إما للخطيئة فإلى الموت، وإما للطاعة فإلى البر؟"]]}, {"l": "Rom 10:16", "n": "", "vs": [[16, "ولكن، ليس كلهم أطاعوا الإنجيل. فإن إشعياء يقول: «يارب! من صدق ما أسمعناه إياه؟»"]]}, {"l": "Rom 15:18", "n": "", "vs": [[18, "فما كنت لأتجاسر أن أتكلم بشيء إلا على ما عمله المسيح على يدي لهداية الأمم إلى الطاعة، بالقول والفعل،"]]}, {"l": "Rom 16:26", "n": "", "vs": [[26, "ولكن أذيع الآن، بأمر الله الأزلي في الكتابات النبوية، على جميع الأمم لأجل إطاعة الإيمان؛"]]}, {"l": "2Co 10:5", "n": "", "vs": [[5, "وكل ما يعلو مرتفعا لمقاومة معرفة الله، ونأسر كل فكر إلى طاعة المسيح."]]}, {"l": "Gal 3:1", "n": "", "vs": [[1, "ياأهل غلاطية الأغبياء! من سحر عقولكم، أنتم الذين قد رسم أمام أعينكم يسوع المسيح وهو مصلوب؟"]]}, {"l": "Heb 2:3", "n": "", "vs": [[3, "فكيف نفلت نحن إن أهملنا هذا الخلاص العظيم جدا؟ فإن الرب يسوع نفسه قد أعلنه أولا، ثم تثبت لنا من الذين سمعوه مباشرة."]]}, {"l": "Heb 5:9", "n": "", "vs": [[9, "وبذلك، أصبح مؤهلا لمهمته، فصار لجميع الذين يطيعونه مصدرا للخلاص الأبدي."]]}, {"l": "Heb 11:8", "n": "", "vs": [[8, "وبالإيمان، لبى إبراهيم دعوة الله، فترك وطنه وانطلق إلى أرض أخرى وعده الله بأن يورثه إياها. ولما خرج من بيته، كان لا يعرف أين يتوجه."]]}, {"l": "1Pe 1:2", "n": "", "vs": [[2, "بحسب علمه السابق ثم قدسهم بالروح ليطيعوا يسوع المسيح ويطهروا برش دمه عليهم."]]}, {"l": "1Pe 3:6", "n": "", "vs": [[6, "فسارة، مثلا، كانت تطيع زوجها إبراهيم وتدعوه «سيدي». والمؤمنات اللواتي يقتدين بها، يثبتن أنهن بنات لها، إذ يتصرفن تصرفا صالحا، فلا يخفن أي تهديد."]]}, {"l": "1Pe 4:17", "n": "", "vs": [[17, "حقا إن الوقت قد حان ليبتديء القضاء بأهل بيت الله. فإن كان القضاء يبدأ بنا أولا، فما هو مصير الذين لا يؤمنون بإنجيل الله؟"]]}], "kwAr": "وغير المطيعين لإنجيل", "noteAr": ""}], "arS": [["وسط ", []], ["نار", ["G4442"]], [" ", []], ["ملتهبة", ["G5395"]], ["، ", []], ["منتقما", ["G1325", "G1557"]], [" إلى التمام من غير ", []], ["العارفين", ["G1492"]], [" ", []], ["لله", ["G2316"]], [" وغير ", []], ["المطيعين", ["G5219"]], [" ", []], ["لإنجيل", ["G2098"]], [" ", []], ["ربنا", ["G2962", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [".", []]]}, {"c": 1, "v": 9, "text": "فهؤلاء سيكابدون عقاب الهلاك الأبدي، بعيدا من حضرة الرب ومن مجد قوته،", "groups": [{"kw": "be", "raw": "Isa_33:14, Isa_66:24; Dan_12:2; Mat_25:41, Mat_25:46, Mat_26:24; Mar_9:43-49; Luk_16:25, Luk_16:26; Joh_5:14; Phi_3:19; Heb_10:29; 2Pe_2:17, 2Pe_3:7; Jud_1:13; Rev_14:10,Rev_14:11, Rev_20:14, Rev_21:8, Rev_22:15", "note": "", "refs": [{"l": "Isa 33:14", "n": "", "vs": [[14, "قد ارتعب الخطاة في صهيون، واستولت الرعدة على الكافرين، فهتفوا: من منا يقدر أن يسكن مع نار آكلة؟ ومن منا يمكنه أن يقيم في وقائد أبدية؟"]]}, {"l": "Isa 66:24", "n": "", "vs": [[24, "ثم يمضون لمشاهدة جثث الرجال الذين تمردوا علي، لأن دودهم لا يموت ونارهم لا تخمد. ويكونون مثار اشمئزاز جميع الناس."]]}, {"l": "Dan 12:2", "n": "", "vs": [[2, "ويستيقظ كثيرون من الأموات المدفونين في تراب الأرض، بعضهم ليثابوا بالحياة الأبدية وبعضهم ليساموا ذل العار والازدراء إلى الأبد."]]}, {"l": "Mat 25:41", "n": "", "vs": [[41, "ثم يقول للذين عن يساره: ابتعدوا عني ياملاعين إلى النار الأبدية المعدة لإبليس وأعوانه!"]]}, {"l": "Mat 25:46", "n": "", "vs": [[46, "فيذهب هؤلاء إلى العقاب الأبدي، والأبرار إلى الحياة الأبدية! »"]]}, {"l": "Mat 26:24", "n": "", "vs": [[24, "إن ابن الإنسان لابد أن يمضي كما قد كتب عنه، ولكن الويل لذلك الرجل الذي على يده يسلم ابن الإنسان. كان خيرا لذلك الرجل لو لم يولد!»"]]}, {"l": "Mar 9:43-49", "n": "", "vs": [[43, "فإن كانت يدك فخا لك، فاقطعها: أفضل لك أن تدخل الحياة ويدك مقطوعة من أن تكون لك يدان وتذهب إلى جهنم، إلى النار التي لا تطفأ"], [44, "حيث دودهم لا يموت، والنار لا تطفأ"], [45, "وإن كانت رجلك فخا لك، فاقطعها: أفضل لك أن تدخل الحياة ورجلك مقطوعة من أن تكون لك رجلان وتطرح في جهنم، في النار التي لا تطفأ."], [46, "حيث دودهم لا يموت، والنار لا تطفأ."], [47, "وإن كانت عينك فخا لك، فاقلعها: أفضل لك أن تدخل ملكوت الله وعينك مقلوعة من أن تكون لك عينان وتطرح في جهنم النار."], [48, "حيث دودهم لا يموت، والنار لا تطفأ."], [49, "فإن كل واحد سوف تملحه النار."]]}, {"l": "Luk 16:25", "n": "", "vs": [[25, "ولكن إبراهيم قال: يابني، تذكر أنك نلت خيراتك كاملة في أثناء حياتك، ولعازر نال البلايا. ولكنه الآن يتعزى هنا، وأنت هناك تتعذب."]]}, {"l": "Luk 16:26", "n": "", "vs": [[26, "وفضلا عن هذا كله، فإن بيننا وبينكم هوة عظيمة قد أثبتت، حتى إن الذين يريدون العبور من هنا لا يقدرون، ولا الذين من هناك يستطيعون العبور إلينا!"]]}, {"l": "Joh 5:14", "n": "", "vs": [[14, "وبعد ذلك وجده يسوع في الهيكل، فقال له: «ها أنت قد عدت صحيحا فلا ترجع إلى الخطيئة لئلا يصيبك ما هو أسوأ!»"]]}, {"l": "Phi 3:19", "n": "", "vs": [[19, "الذين مصيرهم الهلاك، وإلههم بطونهم، ومفخرتهم في عيبتهم، وفكرهم منصرف إلى الأمور الأرضية."]]}, {"l": "Heb 10:29", "n": "", "vs": [[29, "ففي ظنكم، كم يكون أشد كثيرا ذلك العقاب الذي يستحقه من يدوس ابن الله، إذ يعتبر أن دم العهد، الذي يتقدس به، هو دم نجس، وبذلك يهين روح النعمة؟"]]}, {"l": "2Pe 2:17", "n": "", "vs": [[17, "فليس هؤلاء إلا آبارا لا ماء فيها، وغيوما تسوقها الريح العاصفة. ويا له من مصير مرعب محجوز لهم في الظلام الأبدي القاتم!"]]}, {"l": "2Pe 3:7", "n": "", "vs": [[7, "أما السماوات والأرض الحالية، فستبقى مخزونة ومحفوظة للنار بتلك الكلمة عينها إلى يوم الدينونة وهلاك الفاجرين!"]]}, {"l": "Jud 1:13", "n": "", "vs": [[13, "وبأعمالهم المخجلة يفضحون أنفسهم كأمواج في البحر هائجة تقذف الأوساخ. وهم أشبه بنجوم تائهة في الفضاء، مصيرها الظلام الشديد إلى الأبد!"]]}, {"l": "Rev 14:10", "n": "", "vs": [[10, "فلابد لهم، في حضرة الملائكة القديسين وفي حضرة الحمل، من أن يشربوا من خمر الغضب غير المخففة، المسكوبة في كأس غضب الله، فيكابدوا عذاب النار والكبريت المتقد،"]]}, {"l": "Rev 14:11", "n": "", "vs": [[11, "ويتصاعد دخان عذابهم إلى أبد الآبدين. لا راحة في النهار ولا في الليل للذين عبدوا الوحش وسجدوا لتمثاله وقبلوا علامة اسمه."]]}, {"l": "Rev 20:14", "n": "", "vs": [[14, "وطرح الموت وهاوية الموتى في بحيرة النار، الذي هو الموت الثاني."]]}, {"l": "Rev 21:8", "n": "", "vs": [[8, "أما الجبناء وغير المؤمنين، والفاسدون والقاتلون والزناة، والمتصلون بالشياطين وعبدة الأصنام وجميع الدجالين، فمصيرهم إلى البحيرة المتقدة بالنار والكبريت، الذي هو الموت الثاني»."]]}, {"l": "Rev 22:15", "n": "", "vs": [[15, "أما في خارج المدينة، فهنالك الكلاب والمتصلون بالشياطين، والزناة والقتلة، وعبدة الأصنام والدجالون ومحبو التدجيل!"]]}], "kwAr": "سيكابدون عقاب الهلاك الأبدي", "noteAr": ""}, {"kw": "from the presence", "raw": "Gen_3:8, Gen_4:16; Job_21:14, Job_22:17; Psa_16:11, Psa_51:11; Mat_7:23, Mat_22:13, Mat_25:41; Luk_13:27", "note": "", "refs": [{"l": "Gen 3:8", "n": "", "vs": [[8, "ثم سمع الزوجان صوت الرب الإله ماشيا في الجنة عند هبوب ريح النهار، فاختبآ من حضرة الرب الإله بين شجر الجنة."]]}, {"l": "Gen 4:16", "n": "", "vs": [[16, "وهكذا خرج قايين من حضرة الرب وسكن في أرض نود شرقي عدن."]]}, {"l": "Job 21:14", "n": "", "vs": [[14, "يقولون للرب: فارقنا فإننا لا نعبأ بمعرفة طرقك."]]}, {"l": "Job 22:17", "n": "", "vs": [[17, "قائلين لله: فارقنا. وماذا في وسع الله أن يفعل بهم؟"]]}, {"l": "Psa 16:11", "n": "", "vs": [[11, "هديتني سبل الحياة: فإن ملء البهجة في حضرتك، وفي يمينك مسرات أبدية."]]}, {"l": "Psa 51:11", "n": "", "vs": [[11, "لا تطردني من حضرتك، ولا تنزع مني روحك القدوس."]]}, {"l": "Mat 7:23", "n": "", "vs": [[23, "ولكني عندئذ أصرح لهم: إني لم أعرفكم قط! ابتعدوا عني يافاعلي الإثم!"]]}, {"l": "Mat 22:13", "n": "", "vs": [[13, "فأمر الملك خدامه قائلا: قيدوا رجليه ويديه، واطرحوه في الظلام الخارجي، هنالك يكون البكاء وصرير الأسنان!"]]}, {"l": "Mat 25:41", "n": "", "vs": [[41, "ثم يقول للذين عن يساره: ابتعدوا عني ياملاعين إلى النار الأبدية المعدة لإبليس وأعوانه!"]]}, {"l": "Luk 13:27", "n": "", "vs": [[27, "وسوف يقول: أقول لكم، لا أعرف من أين أنتم؛ اغربوا من أمامي ياجميع فاعلي الإثم!"]]}], "kwAr": "بعيدا من حضرة الرب", "noteAr": ""}, {"kw": "the glory", "raw": "2Th_2:8; Deu_33:2; Isa_2:10,Isa_2:19, Isa_2:21; Mat_16:27, Mat_24:30; Tit_2:13 *Gr: Rev_20:11", "note": "", "refs": [{"l": "2Th 2:8", "n": "", "vs": [[8, "عندئذ سيظهر الإنسان المتمرد ظهورا جليا فيبيده الرب يسوع بنفخة فمه ويلاشيه ببهاء ظهوره عند عودته."]]}, {"l": "Deu 33:2", "n": "", "vs": [[2, "فقال: «أقبل الرب من سيناء، وأشرف عليهم من سعير، وتألق في جبل فاران؛ جاء محاطا بعشرات الألوف من الملائكة وعن يمينه يومض برق عليهم."]]}, {"l": "Isa 2:10", "n": "", "vs": [[10, "اختف في مغاور الجبال، واختبيء في حفر الأرض خشية من هيبة الرب ومن جلال مجده."]]}, {"l": "Isa 2:19", "n": "", "vs": [[19, "ويلجأ الناس إلى مغاور الجبال، وإلى حفائر الأرض، متوارين من هيبة الرب ومن مجد جلاله، عندما يهب ليزلزل الأرض."]]}, {"l": "Isa 2:21", "n": "", "vs": [[21, "ويدخلون في كهوف الصخر، وفي شقوق الجروف الجبلية هربا من هيبة الرب ومن مجد جلاله عندما يهب ليزلزل الأرض."]]}, {"l": "Mat 16:27", "n": "", "vs": [[27, "فإن ابن الإنسان سوف يعود في مجد أبيه مع ملائكته، فيجازي كل واحد حسب أعماله."]]}, {"l": "Mat 24:30", "n": "", "vs": [[30, "وعندئذ تظهر آية ابن الإنسان في السماء، فتنتحب قبائل الأرض كلها، ويرون ابن الإنسان آتيا على سحب السماء بقدرة ومجد عظيم."]]}, {"l": "Tit 2:13", "n": "*Gr:", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "Rev 20:11", "n": "", "vs": [[11, "ثم رأيت عرشا عظيما أبيض هربت السماء والأرض من أمام الجالس عليه، فلم يبق لهما مكان."]]}], "kwAr": "ومن مجد قوته", "noteAr": ""}], "arS": [["فهؤلاء ", []], ["سيكابدون عقاب", ["G5099", "G1349"]], [" ", []], ["الهلاك", ["G3639"]], [" ", []], ["الأبدي", ["G166"]], ["، بعيدا من ", []], ["حضرة", ["G4383"]], [" ", []], ["الرب", ["G2962"]], [" ومن ", []], ["مجد", ["G1391"]], [" ", []], ["قوته", ["G2479"]], ["،", []]]}, {"c": 1, "v": 10, "text": "عندما يعود في ذلك اليوم ليتمجد في قديسيه ويكون موضع العجب عند جميع الذين آمنوا، وأنتم قد آمنتم بشهادتنا لكم!", "groups": [{"kw": "to be glorified", "raw": "2Th_1:12; Num_23:23; Psa_89:7; Isa_43:21, Isa_44:23, Isa_49:3, Isa_60:21; Jer_33:9; Mat_25:31; Joh_11:4, Joh_17:10; Gal_1:24; Eph_1:6, Eph_1:12, Eph_1:14, Eph_1:18, Eph_2:7, Eph_3:10,Eph_3:16; 1Pe_2:9; Rev_7:11, Rev_7:12", "note": "", "refs": [{"l": "2Th 1:12", "n": "", "vs": [[12, "حتى يتمجد اسم ربنا يسوع فيكم وتتمجدوا أنتم فيه وفقا لنعمة إلهنا وربنا يسوع المسيح."]]}, {"l": "Num 23:23", "n": "", "vs": [[23, "فلا عيافة تضر يعقوب، ولا عرافة تؤثر في إسرائيل. منذ الآن يقال عن يعقوب وعن إسرائيل: «انظر ماذا فعل الله!»"]]}, {"l": "Psa 89:7", "n": "", "vs": [[7, "إنه إله مهوب جدا في محفل الملائكة القديسين، ومخوف كثيرا عند جميع المحيطين به."]]}, {"l": "Isa 43:21", "n": "", "vs": [[21, "وجبلته لنفسي ليذيع حمدي."]]}, {"l": "Isa 44:23", "n": "", "vs": [[23, "ترنمي أيتها السماوات لأن الرب قد أنجز فعله. اهتفي ياأعماق الأرض، وتفجري غناء ياجبال وياغابات وكل ما فيها من شجر، لأن الرب قد افتدى يعقوب وتمجد في إسرائيل."]]}, {"l": "Isa 49:3", "n": "", "vs": [[3, "وقال لي: «أنت عبدي إسرائيل الذي به أتمجد"]]}, {"l": "Isa 60:21", "n": "", "vs": [[21, "ويكون شعبك جميعا أبرارا ويرثون الأرض إلى الأبد، فهم غصن غرسي وعمل يدي لأتمجد."]]}, {"l": "Jer 33:9", "n": "", "vs": [[9, "وتصبح هذه المدينة مبعث سرور لي، وتسبحة وافتخارا لدى جميع أمم الأرض التي يبلغها كل ما أسديته من خير إليها، فتخاف وترتعد بفضل ما أغدقته عليها من إحسان وازدهار."]]}, {"l": "Mat 25:31", "n": "", "vs": [[31, "وعندما يعود ابن الإنسان في مجده ومعه جميع ملائكته، فإنه يجلس على عرش مجده،"]]}, {"l": "Joh 11:4", "n": "", "vs": [[4, "فلما سمع بذلك قال: «لن ينتهي هذا المرض بالموت، بل سيؤدي إلى تمجيد الله، إذ به سيتمجد ابن الله»."]]}, {"l": "Joh 17:10", "n": "", "vs": [[10, "وكل ما هو لي فهو لك، وكل ما هو لك فهو لي؛ وأنا قد تمجدت فيهم."]]}, {"l": "Gal 1:24", "n": "", "vs": [[24, "فكانوا يمجدون الله بسببي."]]}, {"l": "Eph 1:6", "n": "", "vs": [[6, "بغرض مدح مجد نعمته التي بها أعطانا حظوة لديه في المحبوب:"]]}, {"l": "Eph 1:12", "n": "", "vs": [[12, "والغاية أن نكون سببا لمدح مجده بعدما سبق لنا أن وضعنا رجاءنا في المسيح."]]}, {"l": "Eph 1:14", "n": "", "vs": [[14, "هذا الروح الذي هو عربون ميراثنا إلى أن يتم فداء ما قد اقتني: بغر ض مدح مجده."]]}, {"l": "Eph 1:18", "n": "", "vs": [[18, "إذ تستنير بصائر قلوبكم، فتعلموا ما في دعوته لكم من رجاء، وما هو غنى مجد ميراثه في القديسين،"]]}, {"l": "Eph 2:7", "n": "", "vs": [[7, "وذلك كي يعرض في الدهور القادمة غنى نعمته الفائق في لطفه علينا في المسيح يسوع."]]}, {"l": "Eph 3:10", "n": "", "vs": [[10, "والغاية أن يتجلى الآن أمام الرئاسات والسلطات في الأماكن السماوية ما يظهر في الكنيسة من حكمة الله المتعددة الوجوه،"]]}, {"l": "Eph 3:16", "n": "", "vs": [[16, "لكي يمنحكم، وفقا لغنى مجده، أن يمد الروح الكيان الداخلي في كل منكم بالقوة المؤيدة،"]]}, {"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}, {"l": "Rev 7:11", "n": "", "vs": [[11, "واجتمع الملائكة جميعا حول العرش، ومعهم الشيوخ والكائنات الحية الأربعة، وخروا على وجوههم أمام العرش سجودا لله،"]]}, {"l": "Rev 7:12", "n": "", "vs": [[12, "قائلين: «آمين! لإلهنا البركة والمجد والحكمة والشكر والإجلال والقدرة والقوة إلى أبد الآبدين. آمين!»"]]}], "kwAr": "ليتمجد في قديسيه", "noteAr": ""}, {"kw": "to be admired", "raw": "Psa_68:35", "note": "", "refs": [{"l": "Psa 68:35", "n": "", "vs": [[35, "أنت مرهب ياالله من مقادسك. إله إسرائيل نفسه هو الذي يمد شعبه قوة وشدة. تبارك الله ."]]}], "kwAr": "ويكون موضع العجب", "noteAr": ""}, {"kw": "our", "raw": "2Th_2:13; 1Th_1:5, 1Th_2:13", "note": "", "refs": [{"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "1Th 1:5", "n": "", "vs": [[5, "لأن تبشيرنا لكم بالإنجيل لم يكن مجرد كلام، بل كان مصحوبا أيضا بالقوة وبالروح القدس وبتمام اليقين. كما أنكم تعلمون تماما ماذا كنا بينكم لأجل مصلحتكم،"]]}, {"l": "1Th 2:13", "n": "", "vs": [[13, "ولذلك نحن أيضا نرفع الشكر لله بلا توقف، لأنكم لما تلقيتم منا كلمة البشارة من الله، قبلتموها لا كأنها كلمة بشر، بل كما هي في الحقيقة: باعتبارها كلمة الله العاملة أيضا فيكم أنتم المؤمنين."]]}], "kwAr": "بشهادتنا لكم", "noteAr": ""}, {"kw": "in that", "raw": "Mal_3:17; Mat_7:22, Mat_24:36; Luk_10:12; 2Ti_1:12, 2Ti_1:18, 2Ti_4:8", "note": "", "refs": [{"l": "Mal 3:17", "n": "", "vs": [[17, "سيكونون لي، يقول الرب القدير، في اليوم الذي أصنع فيه نفائسي، وأحافظ عليهم كما يحافظ الوالد على ابنه الذي يخدمه."]]}, {"l": "Mat 7:22", "n": "", "vs": [[22, "في ذلك اليوم سيقول لي كثيرون: يارب، يارب، أليس باسمك تنبأنا، وباسمك طردنا الشياطين، وباسمك عملنا معجزات كثيرة؟"]]}, {"l": "Mat 24:36", "n": "", "vs": [[36, "أما ذلك اليوم وتلك الساعة، فلا يعرفهما أحد، ولا ملائكة السماوات، إلا الآب وحده."]]}, {"l": "Luk 10:12", "n": "", "vs": [[12, "أقول لكم: إن سدوم ستكون حالتها في ذلك اليوم أخف وطأة من حالة تلك المدينة…"]]}, {"l": "2Ti 1:12", "n": "", "vs": [[12, "من أجل ذلك أيضا أقاسي الآن هذه الآلام، ولكني لست أخجل، لأنني أعرف من أنا مؤمن به، ولي تمام الثقة بأنه قادر أن يحفظ لي الأمانة التي أودعتها عنده سالمة إلى ذلك اليوم."]]}, {"l": "2Ti 1:18", "n": "", "vs": [[18, "لينعم عليه الرب بأن يلقى الرحمة من الرب في ذلك اليوم! أما كل ما خدمني به في مدينة أفسس، فأنت تعرفه جيدا."]]}, {"l": "2Ti 4:8", "n": "", "vs": [[8, "إنما ينتظرني الآن إكليل البر المحفوظ لي، والذي سيهبه لي الرب الديان العادل في ذلك اليوم؛ ولن يوهب لي وحدي، بل أيضا لجميع الذين يحبون ظهوره."]]}], "kwAr": "في ذلك اليوم", "noteAr": ""}], "arS": [["عندما ", []], ["يعود", ["G2064"]], [" في ", []], ["ذلك", ["G1565"]], [" ", []], ["اليوم", ["G2250"]], [" ", []], ["ليتمجد", ["G1740"]], [" في ", []], ["قديسيه", ["G40"]], [" ويكون ", []], ["موضع العجب", ["G2296"]], [" عند ", []], ["جميع", ["G3956"]], [" الذين ", []], ["آمنوا", ["G4100"]], ["، وأنتم قد ", []], ["آمنتم", ["G4100"]], [" ", []], ["بشهادتنا", ["G3142", "G2257"]], [" لكم!", []]]}, {"c": 1, "v": 11, "text": "لأجل ذلك أيضا نصلي من أجلكم على الدوام، لكي يجعلكم إلهنا مؤهلين للدعوة الإلهية ويتم فيكم، بقدرته، كل ما يسره من الصلاح وفعالية الإيمان،", "groups": [{"kw": "we pray", "raw": "Rom_1:9; Eph_1:16, Eph_3:14-21; Phi_1:9-11; Col_1:9-13; 1Th_3:9-13", "note": "", "refs": [{"l": "Rom 1:9", "n": "", "vs": [[9, "فإن الله الذي أخدمه بروحي في التبشير بإنجيل ابنه، هو شاهد لي كيف لا أتوقف عن ذكركم"]]}, {"l": "Eph 1:16", "n": "", "vs": [[16, "لا أنقطع عن شكر الله لأجلكم وعن ذكركم في صلواتي،"]]}, {"l": "Eph 3:14-21", "n": "", "vs": [[14, "ولهذا السبب أحني ركبتي للآب"], [15, "الذي هو أصل كل أبوة في السماوات وعلى الأرض،"], [16, "لكي يمنحكم، وفقا لغنى مجده، أن يمد الروح الكيان الداخلي في كل منكم بالقوة المؤيدة،"], [17, "ليسكن المسيح في قلوبكم بالإيمان؛ حتى إذا تأصلتم وتأسستم في المحبة،"], [18, "تصيرون قادرين تماما أن تدركوا، مع القديسين جميعا، ما هو العرض والطول والعلو والعمق،"], [19, "وتعرفوا محبة المسيح التي تفوق المعرفة، فتمتلئوا حتى تبلغوا ملء الله كله."], [20, "والقادر أن يفعل، وفقا للقدرة العاملة فينا، ما يفوق بلا حصر كل ما نطلب أو نتصور،"], [21, "له المجد في الكنيسة، في المسيح يسوع، مدى الأجيال والدهور! آمين …"]]}, {"l": "Phi 1:9-11", "n": "", "vs": [[9, "وصلاتي لأجلكم هي هذه: أن تزداد محبتكم أكثر فأكثر في تمام المعرفة والإدراك،"], [10, "لكي تستحسنوا الأمور الممتازة، حتى تكونوا طاهرين وخالين من العثرات إلى يوم المسيح،"], [11, "كاملين في ثمار البر الآتية بيسوع المسيح، لمجد الله وحمده."]]}, {"l": "Col 1:9-13", "n": "", "vs": [[9, "لذلك نحن أيضا، من اليوم الذي فيه سمعنا بأخباركم، مازلنا نصلي ونتضرع لأجلكم، لأن تمتلئوا من تمام المعرفة لمشيئة الله في كل حكمة وإدراك روحي،"], [10, "لكي تسلكوا سلوكا لائقا بالرب ومرضيا في كل شيء، منتجين الثمر في كل عمل صالح ونامين في معرفة الله إلى التمام،"], [11, "متشددين بكل قوة موافقة لقدرة مجده، لتتمكنوا تماما من الاحتمال وطول البال،"], [12, "رافعين الشكر بفرح للآب الذي جعلكم أهلا للاشتراك في ميراث القديسين في (ملكوت) النور،"], [13, "هو الذي أنقذنا من سلطة الظلام ونقلنا إلى ملكوت ابن محبته"]]}, {"l": "1Th 3:9-13", "n": "", "vs": [[9, "فأي شكر نستطيع أن نؤديه إلى الله عوضا عنكم من أجل كل ما نبتهج به من الفرح بسببكم أمام إلهنا،"], [10, "ونحن نتضرع ليل نهار متوسلين أن نرى وجوهكم ونكمل ما كان ناقصا في إيمانكم؟"], [11, "ليت الله أبانا نفسه، وربنا يسوع المسيح، يسهل أمامنا الطريق إليكم."], [12, "وليجعلكم الرب تنمون وتفيضون في المحبة لتحبوا بعضكم بعضا وجميع الناس كمحبتنا لكم،"], [13, "حتى تتثبت قلوبكم بغير لوم في القداسة أمام إلهنا وأبينا عندما يظهر ربنا يسوع عائدا مع جميع قديسيه."]]}], "kwAr": "نصلي من أجلكم", "noteAr": ""}, {"kw": "our God", "raw": "Psa_48:14, Psa_68:20; Isa_25:9, Isa_55:7; Dan_3:17; Rev_5:10", "note": "", "refs": [{"l": "Psa 48:14", "n": "", "vs": [[14, "لأن الله هذا هو إلهنا إلى الدهر والأبد، وهو هادينا حتى الموت."]]}, {"l": "Psa 68:20", "n": "", "vs": [[20, "إلهنا هو إله الخلاص، وعند
