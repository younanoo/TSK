, "vs": [[37, "فإن اعتبر أحد نفسه نبيا أو صاحب موهبة روحية، فليدرك أن ما أكتبه إليكم إنما هو وصية الرب."]]}, {"l": "2Co 2:9", "n": "", "vs": [[9, "وقد كان ما كتبته إليكم بهدف اختباركم أيضا، لأعرف مدى طاعتكم في كل شيء."]]}, {"l": "2Co 7:15", "n": "", "vs": [[15, "وإن عواطفه تزداد نحوكم أكثر جدا عندما يتذكر طاعتكم جميعا وكيف استقبلتموه بخوف وارتعاد."]]}, {"l": "Phi 2:12", "n": "", "vs": [[12, "إذن، ياأحبائي، كما كنتم تطيعون دائما، لا كما لو أنني حاضر وحسب، بل بالأحرى كثيرا الآن وأنا غائب، كذلك اسعوا لتحقيق خلاصكم عمليا بخوف وارتعاد،"]]}, {"l": "1Th 4:1", "n": "", "vs": [[1, "وبعد، أيها الإخوة، فمثلما تلقيتم منا كيف يجب أن تسلكوا سلوكا يرضي الله ، وكما أنتم فاعلون، نرجو منكم ونحرضكم في الرب يسوع أن تضاعفوا تقدمكم في ذلك أكثر فأكثر."]]}, {"l": "1Th 4:2", "n": "", "vs": [[2, "فإنكم تعرفون الوصايا التي لقناكم إياها من قبل الرب يسوع."]]}, {"l": "1Th 4:10", "n": "", "vs": [[10, "ولأنكم أيضا هكذا تعاملون جميع الإخوة في مقاطعة مقدونية كلها. وإنما نحرضكم، أيها الإخوة، أن تضاعفوا ذلك أكثر فأكثر،"]]}], "kwAr": "بأنكم عاملون بما نوصيكم به", "noteAr": ""}], "arS": [["ولنا في ", []], ["الرب", ["G2962"]], [" ملء ", []], ["الثقة", ["G3982"]], [" من جهتكم بأنكم ", []], ["عاملون", ["G4160"]], [" بما ", []], ["نوصيكم", ["G3853"]], [" به، ", []], ["وستعملون", ["G4160"]], [" به أيضا.", []]]}, {"c": 3, "v": 5, "text": "وليهد الله قلوبكم إلى ما لدى الله من المحبة ولدى المسيح من الصبر!", "groups": [{"kw": "the Lord", "raw": "1Ki_8:58; 1Ch_29:18; Psa_119:5, Psa_119:36; Pro_3:6; Jer_10:23; Jam_1:16-18", "note": "", "refs": [{"l": "1Ki 8:58", "n": "", "vs": [[58, "بل ليجتذب قلوبنا إليه لنسلك في سبله ونطيع وصاياه وفرائضه وأحكامه التي أمر بها آباءنا،"]]}, {"l": "1Ch 29:18", "n": "", "vs": [[18, "فيارب إله آبائنا إبراهيم وإسحق وإسرائيل، اجعل هذه الرغبة أن تظل حية إلى الأبد في قلوب شعبك، واحفظ قلوبهم لتبقى مخلصة لك."]]}, {"l": "Psa 119:5", "n": "", "vs": [[5, "ليتك توجه طرقي لممارسة فرائضك."]]}, {"l": "Psa 119:36", "n": "", "vs": [[36, "اجتذب قلبي نحو شهاداتك بعيدا عن مطامع المال."]]}, {"l": "Pro 3:6", "n": "", "vs": [[6, "اعرف الرب في كل طرقك وهو يقوم سبلك."]]}, {"l": "Jer 10:23", "n": "", "vs": [[23, "أدركت يارب أن الإنسان لا يملك زمام طريقه، وليس في وسع الإنسان أن يوجه خطى نفسه."]]}, {"l": "Jam 1:16-18", "n": "", "vs": [[16, "فيا إخوتي الأحباء، لا تضلوا:"], [17, "إن كل عطية صالحة وهبة كاملة إنما تنزل من فوق، من لدن أبي الأنوار الذي ليس فيه تحول، ولا ظل لأنه لا يدور."], [18, "وهو قد شاء أن يجعلنا أولادا له، فولدنا بكلمته، كلمة الحق. وغايته أن نكون باكورة خليقته."]]}], "kwAr": "وليهد الله قلوبكم", "noteAr": ""}, {"kw": "into", "raw": "Deu_30:6; Jer_31:33; Rom_5:5, Rom_8:28; 1Co_8:3; Gal_5:22; Jam_2:5; 1Jo_4:19", "note": "", "refs": [{"l": "Deu 30:6", "n": "", "vs": [[6, "ويطهر الرب إلهكم قلوبكم وقلوب نسلكم لتحبوا الرب إلهكم من كل قلوبكم ومن كل نفوسكم لتحيوا مطمئنين"]]}, {"l": "Jer 31:33", "n": "", "vs": [[33, "ولكن هذا هو العهد الذي أبرمه مع ذرية إسرائيل بعد تلك الأيام»، يقول الرب: «سأجعل شريعتي في دواخلهم، وأدونها على قلوبهم وأكون لهم إلها وهم يكونون لي شعبا."]]}, {"l": "Rom 5:5", "n": "", "vs": [[5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."]]}, {"l": "Rom 8:28", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."]]}, {"l": "1Co 8:3", "n": "", "vs": [[3, "أما الذي يحب الله ، فإن الله يعرفه."]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Jam 2:5", "n": "", "vs": [[5, "فياإخوتي الأحباء، أما اختار الله الفقراء في نظر الناس ليجعلهم أغنياء في الإيمان، ويعطيهم حق الإرث في الملكوت الذي وعد به محبيه؟"]]}, {"l": "1Jo 4:19", "n": "", "vs": [[19, "ونحن نحب، لأن الله أحبنا أولا."]]}], "kwAr": "إلى ما لدى الله من المحبة", "noteAr": ""}, {"kw": "and into", "raw": "Psa_40:1, Psa_130:5, Psa_130:6; Lam_3:26; Luk_12:36, Luk_12:37; Rom_8:25; Phi_3:20,Phi_3:21; 1Th_1:3, 1Th_1:10; 2Ti_4:8; Tit_2:13; Heb_9:28; 2Pe_3:12; Rev_3:10,Rev_3:11, Rev_13:10", "note": "", "refs": [{"l": "Psa 40:1", "n": "", "vs": [[1, "انتظرت الرب صابرا، فالتفت إلي وسمع صراخ استغاثتي،"]]}, {"l": "Psa 130:5", "n": "", "vs": [[5, "انتظرتك يارب. نفسي تنتظرك، وفي كلمتك رجائي."]]}, {"l": "Psa 130:6", "n": "", "vs": [[6, "نفسي تنتظر الرب بلهفة أكثر من لهفة الحراس مترقبي الصبح."]]}, {"l": "Lam 3:26", "n": "", "vs": [[26, "خير للمرء أن ينتظر بصمت خلاص الرب."]]}, {"l": "Luk 12:36", "n": "", "vs": [[36, "وكونوا مثل أناس ينتظرون رجوع سيدهم من وليمة العرس، حتى إذا وصل وقرع الباب يفتحون له حالا."]]}, {"l": "Luk 12:37", "n": "", "vs": [[37, "طوبى لأولئك العبيد الذين يجدهم سيدهم لدى عودته ساهرين. الحق أقول لكم: إنه يشد وسطه بالحزام ويجعلهم يتكئون ويقوم يخدمهم."]]}, {"l": "Rom 8:25", "n": "", "vs": [[25, "ولكن، إن كنا نرجو ما لا نراه، فبالصبر نتوقعه."]]}, {"l": "Phi 3:20", "n": "", "vs": [[20, "أما نحن، فإن وطننا في السماوات التي منها ننتظر عودة مخلصنا الرب يسوع المسيح،"]]}, {"l": "Phi 3:21", "n": "", "vs": [[21, "الذي سيحول جسدنا الوضيع إلى صورة مطابقة لجسده المجيد، وفقا لعمل قدرته على إخضاع كل شيء لنفسه."]]}, {"l": "1Th 1:3", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"]]}, {"l": "1Th 1:10", "n": "", "vs": [[10, "وتنتظروا من السماوات ابنه الذي أقامه من بين الأموات، يسوع مخلصنا من الغضب الآتي."]]}, {"l": "2Ti 4:8", "n": "", "vs": [[8, "إنما ينتظرني الآن إكليل البر المحفوظ لي، والذي سيهبه لي الرب الديان العادل في ذلك اليوم؛ ولن يوهب لي وحدي، بل أيضا لجميع الذين يحبون ظهوره."]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "Heb 9:28", "n": "", "vs": [[28, "كذلك المسيح أيضا: مات مرة واحدة حاملا خطايا كثيرين، مقربا نفسه (لله) عوضا عنهم. ولا بد أن يعود إلى الظهور. لا ليعالج الخطايا، بل ليحقق الخلاص النهائي لجميع منتظريه!"]]}, {"l": "2Pe 3:12", "n": "", "vs": [[12, "منتظرين «يوم الله» الأبدي وطالبين حلوله بسرعة. ففي ذلك اليوم، تنحل السماوات ملتهبة، وتذوب العناصر محترقة."]]}, {"l": "Rev 3:10", "n": "", "vs": [[10, "ولأنك حفظت كلمتي وصبرت، فسأحفظك أنا أيضا من ساعة التجربة التي ستأتي على العالم أجمع لتجرب الساكنين على الأرض."]]}, {"l": "Rev 3:11", "n": "", "vs": [[11, "إني آت سريعا، فتمسك بما عندك، لئلا يسلب أحد إكليلك."]]}, {"l": "Rev 13:10", "n": "", "vs": [[10, "من ساق غيره إلى السبي، فإلى السبي سيساق؛ ومن قتل بالسيف، فبالسيف سيقتل! هنا يظهر صبر القديسين وإيمانهم."]]}], "kwAr": "ولدى المسيح", "noteAr": ""}, {"kw": "the patient waiting for Christ", "raw": "or, the patience of Christ, Heb_12:2, Heb_12:3; 1Pe_4:1", "note": "or, the patience of Christ, Heb_12:2, Heb_12:3; 1Pe_4:1", "refs": [{"l": "Heb 12:2", "n": "", "vs": [[2, "متطلعين دائما إلى يسوع: رائد إيماننا ومكمله. فهو قد تحمل الموت صلبا، هازئا بما في ذلك من عار، إذ كان ينظر إلى السرور الذي ينتظره، ثم جلس عن يمين عرش الله."]]}, {"l": "Heb 12:3", "n": "", "vs": [[3, "فتأملوا مليا ما قاساه بتحمله تلك المعاملة العنيفة التي عامله بها الخاطئون، لكي لا تتعبوا وتنهاروا!"]]}, {"l": "1Pe 4:1", "n": "", "vs": [[1, "فبما أن المسيح قد تحمل الآلام الجسمية لأجلكم، سلحوا أنفسكم بالاستعداد دائما لتحمل الآلام. فإن من يتحمل الآلام الجسمية، يكون قد قاطع الخطيئة."]]}], "kwAr": "من الصبر", "noteAr": "أو: صبر المسيح."}], "arS": [["وليهد", ["G2720"]], [" الله ", []], ["قلوبكم", ["G2588", "G5216"]], [" إلى ما لدى الله من ", []], ["المحبة", ["G26"]], [" ولدى ", []], ["المسيح", ["G5547"]], [" من ", []], ["الصبر", ["G5281"]], ["!", []]]}, {"c": 3, "v": 6, "text": "ثم نوصيكم، أيها الإخوة، باسم ربنا يسوع المسيح، أن تعتزلوا عن كل أخ يسلك سلوكا فوضويا، لا يوافق التعليم الذي تلقيتم منا.", "groups": [{"kw": "in the", "raw": "1Co_5:4; 2Co_2:10; Eph_4:17; Col_3:17; 1Th_4:1; 1Ti_5:21, 1Ti_6:13, 1Ti_6:14; 2Ti_4:1", "note": "", "refs": [{"l": "1Co 5:4", "n": "", "vs": [[4, "باسم ربنا يسوع المسيح، إذ تجتمعون معا، وروحي معكم، فبسلطة ربنا يسوع المسيح،"]]}, {"l": "2Co 2:10", "n": "", "vs": [[10, "فمن تسامحونه بشيء، أسامحه أنا أيضا. وإذا كنت أنا أيضا قد سامحت ذلك الرجل بشيء، فقد سامحته من أجلكم في حضرة المسيح،"]]}, {"l": "Eph 4:17", "n": "", "vs": [[17, "أقول هذا إذن، وأشهد في الرب، راجي  لتدفعوه إلى الخجل.", "groups": [{"kw": "obey", "raw": "Deu_16:12; Pro_5:13; Zep_3:2; 2Co_2:9, 2Co_7:15, 2Co_10:6; Phi_2:12; 1Th_4:8; Phm_1:21; Heb_13:17", "note": "", "refs": [{"l": "Deu 16:12", "n": "", "vs": [[12, "وتذكروا أنكم كنتم عبيدا في مصر، فأطيعوا هذه الفرائض واعملوا بها."]]}, {"l": "Pro 5:13", "n": "", "vs": [[13, "فلم أصغ إلى توجيه مرشدي، ولا استمعت إلى معلمي."]]}, {"l": "Zep 3:2", "n": "", "vs": [[2, "التي لا تصغي لصوت أحد، وتأبى التقويم، ولا تتكل على الرب، ولا تتقرب من إلهها."]]}, {"l": "2Co 2:9", "n": "", "vs": [[9, "وقد كان ما كتبته إليكم بهدف اختباركم أيضا، لأعرف مدى طاعتكم في كل شيء."]]}, {"l": "2Co 7:15", "n": "", "vs": [[15, "وإن عواطفه تزداد نحوكم أكثر جدا عندما يتذكر طاعتكم جميعا وكيف استقبلتموه بخوف وارتعاد."]]}, {"l": "2Co 10:6", "n": "", "vs": [[6, "ونحن على استعداد لمعاقبة كل عصيان، بعد أن تكون طاعتكم قد اكتملت."]]}, {"l": "Phi 2:12", "n": "", "vs": [[12, "إذن، ياأحبائي، كما كنتم تطيعون دائما، لا كما لو أنني حاضر وحسب، بل بالأحرى كثيرا الآن وأنا غائب، كذلك اسعوا لتحقيق خلاصكم عمليا بخوف وارتعاد،"]]}, {"l": "1Th 4:8", "n": "", "vs": [[8, "إذن، من استخف بأخيه في هذا الأمر، يستخف لا بإنسان بل بالله، بذاك الذي وهبكم فعلا روحه القدوس."]]}, {"l": "Phm 1:21", "n": "", "vs": [[21, "لما كنت واثقا بإطاعتك، كتبت هذه الرسالة إليك، عالما أنك ستفعل أيضا فوق ما أطلب."]]}, {"l": "Heb 13:17", "n": "", "vs": [[17, "أطيعوا مرشديكم، واخضعوا لهم، لأنهم يسهرون على مصلحتكم الروحية، كما يسهر الذي يحمل مسئولية سوف يقدم حسابا عن قيامه بها. وعندئذ، يؤدون مهمتهم بفرح دون تذمر. فلن يكون في تذمرهم نفع لكم!"]]}], "kwAr": "لا يطيع كلمتنا", "noteAr": ""}, {"kw": "by this epistle, note that man", "raw": "or, signify that man by an epistle, 2Th_3:6; Mat_18:17; Rom_16:17; 1Co_5:9, 1Co_5:11; Tit_3:10", "note": "or, signify that man by an epistle, 2Th_3:6; Mat_18:17; Rom_16:17; 1Co_5:9, 1Co_5:11; Tit_3:10", "refs": [{"l": "2Th 3:6", "n": "", "vs": [[6, "ثم نوصيكم، أيها الإخوة، باسم ربنا يسوع المسيح، أن تعتزلوا عن كل أخ يسلك سلوكا فوضويا، لا يوافق التعليم الذي تلقيتم منا."]]}, {"l": "Mat 18:17", "n": "", "vs": [[17, "فإذا لم يسمع لهما، فاعرض الأمر على الكنيسة. فإذا لم يسمع للكنيسة أيضا، فليكن عندك كالوثني وجابي الضرائب."]]}, {"l": "Rom 16:17", "n": "", "vs": [[17, "ولكن، أتوسل إليكم، أيها الإخوة، أن تنتبهوا إلى مثيري الانقسامات والعثرات، خلافا للتعليم الذي تعلمتم، وأن تبتعدوا عنهم."]]}, {"l": "1Co 5:9", "n": "", "vs": [[9, "كتبت إليكم في رسالتي أن لا تعاشروا الزناة."]]}, {"l": "1Co 5:11", "n": "", "vs": [[11, "أما الآن فقد كتبت إليكم بأن لا تعاشروا من يسمى أخا إن كان زانيا أو طماعا أو عابد أصنام أو شتاما أو سكيرا أو سراقا. فمثل هذا لا تعاشروه ولا تجلسوا معه لتناول الطعام."]]}, {"l": "Tit 3:10", "n": "", "vs": [[10, "وصاحب الهرطقة اقطع العلاقة به بعد إنذاره أولا وثانيا،"]]}], "kwAr": "فميزوه", "noteAr": "أو: أعلِموني عن ذلك الإنسان برسالة."}, {"kw": "that he", "raw": "Num_12:14; Ezr_9:6; Psa_83:16; Jer_3:3, Jer_6:15, Jer_31:18-20; Eze_16:61-63; Eze_36:31, Eze_36:32; Luk_15:18-21", "note": "", "refs": [{"l": "Num 12:14", "n": "", "vs": [[14, "فأجابه الرب: «لو أن أباها بصق في وجهها، أما كانت تمكث خجلة سبعة أيام؟ فلتحجز خارج المخيم سبعة أيام وبعد ذلك ترجع»."]]}, {"l": "Ezr 9:6", "n": "", "vs": [[6, "قائلا: «اللهم، إني أخجل وأخزى من أن أرفع وجهي نحوك، لأن آثامنا قد تكاثرت فوق رؤوسنا، ومعاصينا قد تعاظمت فبلغت عنان السماء،"]]}, {"l": "Psa 83:16", "n": "", "vs": [[16, "املاء وجوههم خزيا فيلتمسوا اسمك يارب."]]}, {"l": "Jer 3:3", "n": "", "vs": [[3, "لذلك امتنع عنك الغيث، ولم تهطل أمطار الربيع، ومع ذلك صارت لك جبهة زانية تأبى أن تخجل."]]}, {"l": "Jer 6:15", "n": "", "vs": [[15, "هل خجلوا لأنهم اقترفوا الرجس؟ كلا! لم يخزوا قط ولم يعرفوا الخجل، لذلك سيسقطون بين الساقطين، وحين أعاقبهم يطوح بهم»."]]}, {"l": "Jer 31:18-20", "n": "", "vs": [[18, "قد سمعت أفرايم ينتحب قائلا: أدبتني فتأدبت كعجل غير مروض. أرجعني فأرجع لأنك أنت الرب إلهي."], [19, "فقد تبت بعد أن غويت، وبعد أن تعلمت صفقت على فخذي ندما. خجلت وخزيت لأني حملت عار حداثتي."], [20, "هل أفرايم ابن أثير لدي؟ أليس هو ابنا مسرا؟ لأني مع كثرة تنديدي به فإني مازلت أذكره، لذلك يشتاق قلبي إليه، وأكن له الرحمة»، يقول الرب."]]}, {"l": "Eze 16:61-63", "n": "", "vs": [[61, "فتذكرين عندئذ طرقك حين تستقبلين أختيك: الكبرى والصغرى كلتيهما، وأجعلهما كبنتين لك، إنما ليس ذلك بفضل عهدك."], [62, "فأقيم عهدي معك فتدركين أني أنا الرب،"], [63, "لكي تتذكري فتخجلي ولا تفتحي فمك من بعد بسبب خزيك، حين أغفر لك كل ما ارتكبت من شر يقول السيد الرب»."]]}, {"l": "Eze 36:31", "n": "", "vs": [[31, "فتذكرون طرقكم الأثيمة وتصرفاتكم الطالحة، وتمقتون أنفسكم في أعينكم لما ارتكبتم من آثام ورجاسات."]]}, {"l": "Eze 36:32", "n": "", "vs": [[32, "لهذا اعلموا أنه ليس من أجلكم أنا أفعل هذا، يقول السيد الرب، فاخجلوا واخزوا من طرقكم ياشعب إسرائيل."]]}, {"l": "Luk 15:18-21", "n": "", "vs": [[18, "سأقوم وأرجع إلى أبي، وأقول له: ياأبي، أخطأت إلى السماء وأمامك؛"], [19, "ولا أستحق بعد أن أدعى ابنا لك: اجعلني كواحد من خدامك المأجورين!"], [20, "فقام ورجع إلى أبيه. ولكن أباه رآه وهو مازال بعيدا، فتحنن، وركض إليه وعانقه وقبله بحرارة."], [21, "فقال له الابن. ياأبي، أخطأت إلى السماء وأمامك، ولا أستحق بعد أن أدعى ابنا لك…"]]}], "kwAr": "لتدفعوه إلى الخجل", "noteAr": ""}], "arS": [["وإن كان ", []], ["أحد", ["G5100"]], [" لا ", []], ["يطيع", ["G5219"]], [" ", []], ["كلمتنا", ["G3056", "G2257"]], [" في هذه ", []], ["الرسالة", ["G1992"]], ["، ", []], ["فميزوه", ["G4593"]], [" ولا ", []], ["تتعاملوا", ["G4874"]], [" معه، لتدفعوه إلى ", []], ["الخجل", ["G1788"]], [".", []]]}, {"c": 3, "v": 15, "text": "ولكن، لا تعتبروه عدوا لكم، بل أرشدوه باعتباره أخا.", "groups": [{"kw": "count", "raw": "Lev_19:17, Lev_19:18; 1Co_5:5; 2Co_2:6-10, 2Co_10:8, 2Co_13:10; Gal_6:1; 1Th_5:14; Jud_1:22, Jud_1:23", "note": "", "refs": [{"l": "Lev 19:17", "n": "", "vs": [[17, "لا تبغض أخاك في قلبك، بل إنذارا تنذره لئلا تكون شريكا في ذنبه."]]}, {"l": "Lev 19:18", "n": "", "vs": [[18, "لا تنتقم ولا تحقد على أحد أبناء شعبك، ولكن تحب قريبك كما تحب نفسك، فأنا الرب."]]}, {"l": "1Co 5:5", "n": "", "vs": [[5, "تقررون تسليم مرتكب هذا الفعل إلى الشيطان، ليهلك جسده؛ أما روحه فتخلص في يوم الرب يسوع."]]}, {"l": "2Co 2:6-10", "n": "", "vs": [[6, "والآن، يكفي ذلك الرجل المذنب القصاص الذي أنزله به أكثركم."], [7, "وعلى نقيض ذلك، فأحرى بكم الآن أن تسامحوه وتشجعوه، وإلا فإنه قد يبتلع في غمرة الحزن الشديد."], [8, "لذلك أتوسل إليكم أن تؤكدوا له محبتكم."], [9, "وقد كان ما كتبته إليكم بهدف اختباركم أيضا، لأعرف مدى طاعتكم في كل شيء."], [10, "فمن تسامحونه بشيء، أسامحه أنا أيضا. وإذا كنت أنا أيضا قد سامحت ذلك الرجل بشيء، فقد سامحته من أجلكم في حضرة المسيح،"]]}, {"l": "2Co 10:8", "n": "", "vs": [[8, "فإني، وإن كنت أفتخر ولو قليلا أكثر مما يجب، بسلطتنا التي أعطانا إياها الرب لبنيانكم لا لهدمكم، لن أضطر إلى الخجل،"]]}, {"l": "2Co 13:10", "n": "", "vs": [[10, "لهذا أكتب إليكم بهذه الأمور وأنا غائب، حتى إذا حضرت لا ألجأ إلى الحزم بحسب السلطة التي منحني إياها الرب للبنيان لا للهدم."]]}, {"l": "Gal 6:1", "n": "", "vs": [[1, "أيها الإخوة، إن سقط أحدكم في خطأ ما فمثل هذا أصلحوه أنتم الروحيين بروح وداعة. واحذر أنت لنفسك لئلا تجرب أيضا."]]}, {"l": "1Th 5:14", "n": "", "vs": [[14, "إلا أننا نناشدكم، أيها الإخوة، أن تعظوا الفوضويين، وتشددوا فاقدي العزم، وتساندوا الضعفاء، وتعاملوا الجميع بطول البال."]]}, {"l": "Jud 1:22", "n": "", "vs": [[22, "بعض الناس يجب أن تعاملوهم بشفقة بسبب شكوكهم."]]}, {"l": "Jud 1:23", "n": "", "vs": [[23, "وبعضهم يجب أن تنقذوهم من النار خطفا. وآخرون يجب أن تعالجوهم بشفقة وحذر، مبغضين حتى الثياب التي يلوثونها بأجسادهم."]]}], "kwAr": "لا تعتبروه عدوا لكم", "noteAr": ""}, {"kw": "admonish", "raw": "Psa_141:5; Pro_9:9, Pro_25:12; Mat_18:15; 1Co_4:14; Tit_3:10; Jam_5:19, Jam_5:20", "note": "", "refs": [{"l": "Psa 141:5", "n": "", "vs": [[5, "ليضربني الصديق فذلك رحمة، وليوبخني فذلك زيت عاطر لرأسي. أما الأشرار فإني أصلي دائما (كي تحفظني من أفعالهم الأثيمة)."]]}, {"l": "Pro 9:9", "n": "", "vs": [[9, "اسد الإرشاد إلى الحكيم فيضحى أوفر حكمة، علم الصديق فيزداد معرفة."]]}, {"l": "Pro 25:12", "n": "", "vs": [[12, "الموبخ الحكيم لأذن صاغية مثل قرط من ذهب وحلي من إبريز."]]}, {"l": "Mat 18:15", "n": "", "vs": [[15, "إن أخطأ إليك أخوك، فاذهب إليه وعاتبه بينك وبينه على انفراد. فإذا سمع لك، تكون قد ربحت أخاك."]]}, {"l": "1Co 4:14", "n": "", "vs" ]}, {"l": "Rom 16:20", "n": "", "vs": [[20, "وإله السلام سيسحق الشيطان تحت أقدامكم سريعا. لتكن نعمة ربنا يسوع المسيح معكم."]]}, {"l": "1Co 14:33", "n": "", "vs": [[33, "فليس الله إله فوضى بل إله سلام، كما هي الحال في كنائس القديسين كلها."]]}, {"l": "2Co 5:19-21", "n": "", "vs": [[19, "ذلك أن الله كان في المسيح مصالحا العالم مع نفسه، غير حاسب عليهم خطاياهم، وقد وضع بين أيدينا رسالة هذه المصالحة."], [20, "فنحن إذن سفراء المسيح، وكأن الله يعظ بنا نتوسل بالنيابة عن المسيح منادين: «تصالحوا مع الله!»"], [21, "فإن الذي لم يعرف خطيئة، جعله الله خطيئة لأجلنا، لنصير نحن بر الله فيه."]]}, {"l": "2Co 13:11", "n": "", "vs": [[11, "وأخيرا، أيها الإخوة: افرحوا؛ تكملوا؛ تشجعوا؛ اتفقوا في الرأي؛ عيشوا بسلام. وإله المحبة والسلام سيكون معكم!"]]}, {"l": "Eph 2:14-17", "n": "", "vs": [[14, "فإنه هو سلامنا، ذاك الذي جعل الفريقين واحدا وهدم حائط الحاجز الفاصل بينهما،"], [15, "أي العداء: إذ أبطل بجسده شريعة الوصايا ذات الفرائض، لكي يكون من الفريقين إنسانا واحدا جديدا، إذ أحل السلام بينهما،"], [16, "ولكي يصالحهما معا في جسد واحد مع الله بالصليب الذي به قتل العداء."], [17, "ثم جاء وبشركم بالسلام أنتم البعيدين، (كما بشر بالسلام) أولئك القريبين."]]}, {"l": "1Th 5:23", "n": "", "vs": [[23, "وإله السلام نفسه يقدسكم إلى التمام ويحفظكم سالمين، روحا ونفسا وجسدا، لتكونوا بلا لوم عند عودة ربنا يسوع المسيح."]]}, {"l": "Heb 7:2", "n": "", "vs": [[2, "وأدى له إبراهيم عشرا من كل ما غنمه في المعركة. فمن جهة، يعني اسم ملكيصادق «ملك العدل». ومن جهة أخرى، كان لقبه «ملك ساليم» أي «ملك السلام»."]]}, {"l": "Heb 13:20", "n": "", "vs": [[20, "وأسأل الله ، إله السلام الذي أقام من بين الأموات ربنا يسوع راعي الخراف العظيم بفضل دمه الذي ختم به العهد الأبدي"]]}], "kwAr": "رب السلام نفسه", "noteAr": ""}, {"kw": "give", "raw": "Num_6:26; Jdg_6:24 *marg. Psa_29:11, Psa_85:8-10; Isa_26:12, Isa_45:7, Isa_54:10, Isa_66:12; Hag_2:9; Joh_16:33; Rom_1:7; Phi_4:7-9", "note": "", "refs": [{"l": "Num 6:26", "n": "", "vs": [[26, "يلتفت الرب بوجهه إليك ويمنحك سلاما."]]}, {"l": "Jdg 6:24", "n": "*marg.", "vs": [[24, "فبنى جدعون هناك
