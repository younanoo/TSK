, "vs": [[12, "ونحرضكم أن تسلكوا سلوكا يليق بالله، ذاك الذي يدعوكم إلى ملكوته ومجده."]]}, {"l": "Heb 3:1", "n": "", "vs": [[1, "إذن، أيها الإخوة القديسون الذين اشتركتم في الدعوة السماوية، تأملوا يسوع: الرسول ورئيس الكهنة في الإيمان الذي نتمسك به."]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}], "kwAr": "للدعوة الإلهية", "noteAr": ""}, {"kw": "fulfil", "raw": "Psa_138:8; Pro_4:18; Isa_66:9; Hos_6:3; Zec_4:7; Mar_4:28; 1Co_1:8; Phi_1:6", "note": "", "refs": [{"l": "Psa 138:8", "n": "", "vs": [[8, "الرب ينجز مقاصده لي. رحمتك يارب إلى الأبد تدوم، فلا تتخل عني لأني صنع يديك."]]}, {"l": "Pro 4:18", "n": "", "vs": [[18, "أما سبيل الأبرار فكنور متلأليء يتزايد إشراقه إلى أن يكتمل النهار،"]]}, {"l": "Isa 66:9", "n": "", "vs": [[9, "يقول الرب: هل أمخض ولا أولد؟ هل أغلق الرحم وأنا المولد؟"]]}, {"l": "Hos 6:3", "n": "", "vs": [[3, "لنعرف، بل لنجد حتى نعرف الرب، فمجيئه يقين كالفجر، يقبل إلينا كإقبال المطر وكغيوث الربيع التي تروي الأرض»."]]}, {"l": "Zec 4:7", "n": "", "vs": [[7, "أي شيء أنت أيها الجبل العظيم؟ أنت سهل أمام زربابل، وسيضع زربابل حجر الزاوية في خضم هتاف القائلين: ليباركه، ليباركه الرب»."]]}, {"l": "Mar 4:28", "n": "", "vs": [[28, "فالأرض من ذاتها تعطي الثمر، فتطلع أولا عشبة، ثم سنبلة، ثم قمحا ملء السنبلة."]]}, {"l": "1Co 1:8", "n": "", "vs": [[8, "وهو نفسه سيحفظكم ثابتين إلى النهاية حتى تكونوا بلا عيب في يوم ربنا يسوع المسيح."]]}, {"l": "Phi 1:6", "n": "", "vs": [[6, "ولي ثقة في هذا الأمر بالذات: أن الذي بدأ فيكم عملا صالحا سوف يتممه إلى يوم المسيح يسوع."]]}], "kwAr": "ويتم فيكم", "noteAr": ""}, {"kw": "the good", "raw": "Psa_51:18; Luk_12:32; Eph_1:5, Eph_1:9; Phi_2:13; Tit_3:4-7", "note": "", "refs": [{"l": "Psa 51:18", "n": "", "vs": [[18, "أحسن إلى صهيون بمقتضى مسرتك. وابن أسوار أورشليم."]]}, {"l": "Luk 12:32", "n": "", "vs": [[32, "لا تخافوا، أيها القطيع الصغير، لأن أباكم قد سر أن يعطيكم الملكوت."]]}, {"l": "Eph 1:5", "n": "", "vs": [[5, "إذ سبق فعيننا في المحبة ليتخذنا أبناء له بيسوع المسيح. وذلك موافق للقصد الذي سرت به مشيئته،"]]}, {"l": "Eph 1:9", "n": "", "vs": [[9, "إذ كشف لنا سر مشيئته بحسب مرضاته التي قصدها في نفسه،"]]}, {"l": "Phi 2:13", "n": "", "vs": [[13, "لأن الله هو الذي ينشيء فيكم الإرادة والعمل لأجل مرضاته."]]}, {"l": "Tit 3:4-7", "n": "", "vs": [[4, "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،"], [5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"], [6, "الذي سكبه علينا بغنى بيسوع المسيح مخلصنا."], [7, "حتى إذا تبررنا بنعمته، نصير ورثة، وفقا لرجائنا بالحياة الأبدية."]]}], "kwAr": "كل ما يسره من الصلاح", "noteAr": ""}, {"kw": "the work", "raw": "Joh_6:27-29; Eph_1:19, Eph_1:20; 1Th_1:3, 1Th_2:13; Heb_12:2", "note": "", "refs": [{"l": "Joh 6:27-29", "n": "", "vs": [[27, "لا تسعوا وراء الطعام الفاني، بل وراء الطعام الباقي إلى الحياة الأبدية، والذي يعطيكم إياه ابن الإنسان، لأن هذا الطعام قد وضع الله الآب ختمه عليه»."], [28, "فسألوه: «ماذا نفعل لنعمل ما يطلبه الله ؟»"], [29, "أجاب يسوع: «العمل الذي يطلبه الله هو أن تؤمنوا بمن أرسله»."]]}, {"l": "Eph 1:19", "n": "", "vs": [[19, "وما هي عظمة قدرته الفائقة المعلنة لنا نحن المؤمنين، بحسب عمل اقتدار قوته"]]}, {"l": "Eph 1:20", "n": "", "vs": [[20, "الذي عمله في المسيح، بإقامته له من بين الأموات. وقد أجلسه عن يمينه في الأماكن السماوية،"]]}, {"l": "1Th 1:3", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"]]}, {"l": "1Th 2:13", "n": "", "vs": [[13, "ولذلك نحن أيضا نرفع الشكر لله بلا توقف، لأنكم لما تلقيتم منا كلمة البشارة من الله، قبلتموها لا كأنها كلمة بشر، بل كما هي في الحقيقة: باعتبارها كلمة الله العاملة أيضا فيكم أنتم المؤمنين."]]}, {"l": "Heb 12:2", "n": "", "vs": [[2, "متطلعين دائما إلى يسوع: رائد إيماننا ومكمله. فهو قد تحمل الموت صلبا، هازئا بما في ذلك من عار، إذ كان ينظر إلى السرور الذي ينتظره، ثم جلس عن يمين عرش الله."]]}], "kwAr": "وفعالية الإيمان", "noteAr": ""}], "arS": [["لأجل ذلك أيضا ", []], ["نصلي", ["G4336"]], [" من أجلكم على ", []], ["الدوام", ["G3842"]], ["، لكي يجعلكم ", []], ["إلهنا", ["G2316", "G2257"]], [" ", []], ["مؤهلين", ["G515"]], [" ", []], ["للدعوة", ["G2821"]], [" الإلهية ", []], ["ويتم", ["G4137"]], [" فيكم، ", []], ["بقدرته", ["G1411"]], ["، ", []], ["كل", ["G3956"]], [" ما ", []], ["يسره", ["G2107"]], [" من ", []], ["الصلاح", ["G19"]], [" ", []], ["وفعالية", ["G2041"]], [" ", []], ["الإيمان", ["G4102"]], ["،", []]]}, {"c": 1, "v": 12, "text": "حتى يتمجد اسم ربنا يسوع فيكم وتتمجدوا أنتم فيه وفقا لنعمة إلهنا وربنا يسوع المسيح.", "groups": [{"kw": "the name", "raw": "2Th_1:10; Joh_17:10; 1Pe_4:14", "note": "", "refs": [{"l": "2Th 1:10", "n": "", "vs": [[10, "عندما يعود في ذلك اليوم ليتمجد في قديسيه ويكون موضع العجب عند جميع الذين آمنوا، وأنتم قد آمنتم بشهادتنا لكم!"]]}, {"l": "Joh 17:10", "n": "", "vs": [[10, "وكل ما هو لي فهو لك، وكل ما هو لك فهو لي؛ وأنا قد تمجدت فيهم."]]}, {"l": "1Pe 4:14", "n": "", "vs": [[14, "فإذا لحقتكم الإهانة لأنكم تحملون اسم المسيح، فطوبى لكم! لأن روح المجد، أي روح الله، يستقر عليكم."]]}], "kwAr": "حتى يتمجد اسم ربنا", "noteAr": ""}, {"kw": "and ye", "raw": "Gen_18:18; Psa_72:17; Isa_45:17, Isa_45:25; Joh_17:21-26; Phi_3:9; Col_2:9, Col_2:10; 1Pe_1:7, 1Pe_1:8", "note": "", "refs": [{"l": "Gen 18:18", "n": "", "vs": [[18, "وإبراهيم لابد أن يصبح أمة كبيرة وقوية، وبه تتبارك شعوب الأرض جميعا،"]]}, {"l": "Psa 72:17", "n": "", "vs": [[17, "يخلد اسمه إلى الدهر، ويدوم اسمه كديمومة الشمس، ويتبارك الناس به، وتطوبه كل الأمم."]]}, {"l": "Isa 45:17", "n": "", "vs": [[17, "أما إسرائيل فقد خلصه الرب بخلاص أبدي، ولن يلحقكم عار أو خزي مدى الدهور،"]]}, {"l": "Isa 45:25", "n": "", "vs": [[25, "أما ذرية إسرائيل فبالرب يتبررون وبه يزهون."]]}, {"l": "Joh 17:21-26", "n": "", "vs": [[21, "ليكون الجميع واحدا؛ أيها الآب، كما أنك أنت في وأنا فيك، ليكونوا هم أيضا واحدا فينا، لكي يؤمن العالم أنك أنت أرسلتني."], [22, "إني أعطيتهم المجد الذي أعطيتني، ليكونوا واحدا كما نحن واحد."], [23, "أنا فيهم، وأنت في، ليكتملوا فيصيروا واحدا، حتى يعرف العالم أنك أرسلتني وأنك أحببتهم كما أحببتني."], [24, "أيها الآب، أريد لهؤلاء الذين وهبتهم لي أن يكونوا معي حيث أكون أنا، فيشاهدوا مجدي الذي أعطيتني، لأنك أحببتني قبل إنشاء العالم."], [25, "أيها الآب البار، إن العالم لم يعرفك، أما أنا فعرفتك، وهؤلاء عرفوا أنك أنت أرسلتني،"], [26, "وقد عرفتهم اسمك، وسأعرفهم أيضا، لتكون فيهم المحبة التي أحببتني بها، وأكون أنا فيهم»."]]}, {"l": "Phi 3:9", "n": "", "vs": [[9, "ويكون لي فيه مقام، إذ ليس لي بري الذاتي القائم على أساس الشريعة، بل البر الآتي من الإيمان بالمسيح، البر الذي من عند الله على أساس الإيمان."]]}, {"l": "Col 2:9", "n": "", "vs": [[9, "فإنه فيه، جسديا، يحل الله بكل ملئه،"]]}, {"l": "Col 2:10", "n": "", "vs": [[10, "وأنتم مكملون فيه. فهو رأس كل رئاسة وسلطة؛"]]}, {"l": "1Pe 1:7", "n": "", "vs": [[7, "إلا أن غاية هذه التجارب هي اختبار حقيقة إيمانكم. فكما تختبر النار الذهب وتنقيه، تختبر التجارب حقيقة إيمانكم، وهو أثمن جدا من الذهب الفاني. وهكذا، يكون إيمانكم مدعاة مدح وإكرام وتمجيد لكم، عندما يعود يسوع المسيح ظاهرا بمجده."]]}, {"l": "1Pe 1:8", "n": "", "vs": [[8, "أنتم لم تروا المسيح، ولكنكم تحبونه. ومع أنكم لا ترونه الآن، فأنتم تؤمنون به وتبتهجون بفرح مجيد يفوق الوصف."]]}], "kwAr": "وتتمجدوا أنتم فيه", "noteAr": ""}, {"kw": "the grace", "raw": "Rom_1:7; 1Co_1:4; 2Co_8:9, 2Co_13:4; Tit_2:11; Rev_1:4", "note": "", "refs": [{"l": "Rom 1:7", "n": "", "vs": [[7, "إلى جميع من هم في روما من أحباء الله القديسين المدعوين. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}, {"l": "1Co 1:4", "n": "", "vs": [[4, "إني أشكر الله من أجلكم دائما، وعلى نعمة الله الموهوبة لكم في المسيح يسوع."]]}, {"l": "2Co 8:9", "n": "", "vs": [[9, "فأنتم تعرفون نعمة ربنا يسوع المسيح: فمن أجلكم افتقر، وهو الغني لكي تغتنوا أنتم بفقره."]]}, {"l": "2Co 13:4", "n": "", "vs": [[4, "فمع أنه قد صلب في ضعف، فهو الآن حي بقدرة الله. ونحن أيضا ضعفاء فيه، ولكننا، بتصرفنا معكم، سنكون أحياء معه بقدرة الله."]]}, {"l": "Tit 2:11", "n": "", "vs": [[11, "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت."]]}, {"l": "Rev 1:4", "n": "", "vs": [[4, "من يوحنا، إلى الكنائس السبع في مقاطعة آسيا: لكم النعمة والسلام من الكائن والذي كان والذي سيأتي، ومن الأرواح السبعة الماثلة أمام عرشه،"]]}], "kwAr": "وفقا لنعمة إلهنا", "noteAr": ""}], "arS": [["حتى ", []], ["يتمجد", ["G1740"]], [" ", []], ["اسم", ["G3686"]], [" ", []], ["ربنا", ["G2962", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [" فيكم ", []], ["وتتمجدوا", ["G1740"]], [" ", []], ["أنتم", ["G5210"]], [" فيه ", []], ["وفقا", ["G2596"]], [" ", []], ["لنعمة", ["G5485"]], [" ", []], ["إلهنا", ["G2316", "G2257"]], [" ", []], ["وربنا", ["G2962"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 2, "v": 1, "text": "ولكن بالنسبة إلى رجوع ربنا يسوع المسيح واجتماعنا إليه معا، نرجو منكم أيها الإخوة", "groups": [{"kw": "we", "raw": "Rom_12:1", "note": "", "refs": [{"l": "Rom 12:1", "n": "", "vs": [[1, "لذلك أتوسل إليكم أيها الإخوة، نظرا لمراحم الله، أن تقدموا له أجسادكم ذبيحة مقدسة مقبولة عنده، وهي عبادتكم بعقل."]]}], "kwAr": "نرجو منكم", "noteAr": ""}, {"kw": "by the", "raw": "1Th_4:14-16", "note": "", "refs": [{"l": "1Th 4:14-16", "n": "", "vs": [[14, "فمادمنا نؤمن أن يسوع مات ثم قام، فمعه كذلك سيحضر الله أيضا الراقدين بيسوع."], [15, "فهذا نقوله لكم بكلمة من عند الرب: إننا نحن الباقين أحياء إلى حين عودة الرب، لن نسبق الراقدين."], [16, "لأن الرب نفسه سينزل من السماء حالما يدوي أمر بالتجمع، وينادي رئيس ملائكة، ويبوق في بوق إلهي، عندئذ يقوم الأموات في المسيح أولا."]]}], "kwAr": "رجوع ربنا يسوع المسيح", "noteAr": ""}, {"kw": "and by", "raw": "Gen_49:10; Mat_24:31, Mat_25:32; Mar_13:27; Eph_1:10; 1Th_3:13, 1Th_4:17; 2Ti_4:1", "note": "", "refs": [{"l": "Gen 49:10", "n": "", "vs": [[10, "لا يزول صولجان الملك من يهوذا ولا مشترع من صلبه حتى يأتي شيلوه (ومعناه: من له الأمر) فتطيعه الشعوب."]]}, {"l": "Mat 24:31", "n": "", "vs": [[31, "ويرسل ملائكته بصوت بوق عظيم ليجمعوا مختاريه من الجهات الأربع، من أقاصي السماوات إلى أقاصيها."]]}, {"l": "Mat 25:32", "n": "", "vs": [[32, "وتجتمع أمامه الشعوب كلها، فيفصل بعضهم عن بعض كما يفصل الراعي الغنم عن المعاز،"]]}, {"l": "Mar 13:27", "n": "", "vs": [[27, "فيرسل عندئذ ملائكته ويجمع مختاريه من الجهات الأربع، من أقصى الأرض إلى أقصى السماء."]]}, {"l": "Eph 1:10", "n": "", "vs": [[10, "لأجل تدبير تمام الأزمنة، حين يوحد كل شيء تحت رئاسة المسيح، سواء الأشياء التي في السماوات والتي على الأرض."]]}, {"l": "1Th 3:13", "n": "", "vs": [[13, "حتى تتثبت قلوبكم بغير لوم في القداسة أمام إلهنا وأبينا عندما يظهر ربنا يسوع عائدا مع جميع قديسيه."]]}, {"l": "1Th 4:17", "n": "", "vs": [[17, "ثم إننا، نحن الباقين أحياء، نختطف جميعا في السحب للاجتماع بالرب في الهواء. وهكذا نبقى مع الرب على الدوام."]]}, {"l": "2Ti 4:1", "n": "", "vs": [[1, "أطلب منك في حضرة الله والمسيح الذي سيدين الأحياء والأموات، بعودته العلنية وملكوته،"]]}], "kwAr": "واجتماعنا إليه معا", "noteAr": ""}], "arS": [["ولكن بالنسبة إلى ", []], ["رجوع", ["G3952"]], [" ", []], ["ربنا", ["G2962", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [" ", []], ["واجتماعنا", ["G1997"]], [" إليه معا، ", []], ["نرجو", ["G2065"]], [" منكم أيها ", []], ["الإخوة", ["G80"]]]}, {"c": 2, "v": 2, "text": "ألا تضطرب أفكاركم سريعا ولا تقلقوا، لا من إيحاء ولا من خبر ولا من رسالة منسوبة إلينا زورا، يزعم فيها أن يوم الرب قد حل فعلا.", "groups": [{"kw": "shaken", "raw": "Isa_7:2, Isa_8:12, Isa_8:13, Isa_26:3; Mat_24:6; Mar_13:7; Luk_21:9, Luk_21:19; Joh_14:1, Joh_14:27; Act_20:23, Act_20:24; Eph_5:6; 1Th_3:3", "note": "", "refs": [{"l": "Isa 7:2", "n": "", "vs": [[2, "ولما قيل لملك يهوذا إن الأراميين تحالفوا مع الإسرائيليين، اعترى قلبه وقلوب شعبه الاضطراب، كأشجار الغابة تهزها ريح عاصفة."]]}, {"l": "Isa 8:12", "n": "", "vs": [[12, "«لا تقل إنها مؤامرة لكل ما يدعي هذا الشعب أنه مؤامرة. لا تخش ما يخشون ولا تخف."]]}, {"l": "Isa 8:13", "n": "", "vs": [[13, "قدسوا الرب القدير لأنه هو خوفكم ورهبتكم،"]]}, {"l": "Isa 26:3", "n": "", "vs": [[3, "أنت تحفظ ذا الرأي الثابت سالما لأنه عليك توكل."]]}, {"l": "Mat 24:6", "n": "", "vs": [[6, "وسوف تسمعون بحروب وأخبار حروب. فإياكم أن ترتعبوا! فلابد أن يحدث هذا كله، ولكن ليست النهاية بعد."]]}, {"l": "Mar 13:7", "n": "", "vs": [[7, "ولكن، عندما تسمعون بالحروب وأخبار الحروب لا ترتعبوا؛ فإن ذلك لابد أن يحدث، ولكن ليست النهاية بعد."]]}, {"l": "Luk 21:9", "n": "", "vs": [[9, "وعندما تسمعون بالحروب والاَضطرابات، فلا ترتعبوا، لأن هذه الأمور لابد من حدوثها أولا، ولكن النهاية لا تأتي حالا بعدها!»"]]}, {"l": "Luk 21:19", "n": "", "vs": [[19, "فباحتمالكم تربحون أنفسكم!"]]}, {"l": "Joh 14:1", "n": "", "vs": [[1, "«لا تضطرب قلوبكم. أنتم تؤمنون بالله، فآمنوا بي أيضا."]]}, {"l": "Joh 14:27", "n": "", "vs": [[27, "سلاما أترك لكم. سلامي أعطيكم. ليس كما يعطي العالم أعطيكم أنا. فلا تضطرب قلوبكم، ولا ترتعب."]]}, {"l": "Act 20:23", "n": "", "vs": [[23, "إلا أن الروح القدس كان يعلن لي في كل مدينة أذهب إليها أن السجن والمصاعب تنتظرني"]]}, {"l": "Act 20:24", "n": "", "vs": [[24, "ولكني لا أحسب لحياتي أية قيمة، ما دمت أسعى إلى بلوغ غايتي وإتمام الخدمة التي كلفني إياها الرب يسوع: أن أشهد ببشارة نعمة الله."]]}, {"l": "Eph 5:6", "n": "", "vs": [[6, "لا يخدعكم أحد بكلام باطل! فبسبب هذه الأمور يحل غضب الله على أبناء العصيان."]]}, {"l": "1Th 3:3", "n": "", "vs": [[3, "حتى لا يتزعزع أحد منكم من جراء هذه الضيقات. فإنكم تعلمون أننا معينون لذلك؛"]]}], "kwAr": "ألا تضطرب أفكاركم سريعا", "noteAr": ""}, {"kw": "by spirit", "raw": "Deu_13:1-5; Jer_23:25-27; Mic_2:11; Mat_24:4, Mat_24:5, Mat_24:24; 2Pe_2:1-3; 1Jo_4:1, 1Jo_4:2; Rev_19:20", "note": "", "refs": [{"l": "Deu 13:1-5", "n": "", "vs": [[1, "إذا ظهر بينكم نبي أو صاحب أحلام، وتنبأ بوقوع آية أو أعجوبة."], [2, "فتحققت تلك الآية أو الأعجوبة التي تنبأ بها، ثم قال: هلم نذهب وراء آلهة أخرى لم تعرفوها ونعبدها."], [3, "فلا تصغوا إلى كلام ذلك النبي أو صاحب الأحلام، لأن الرب إلهكم يجربكم ليرى إن كنتم تحبونه من كل قلوبكم ومن كل أنفسكم،"], [4, "فاتبعوا الرب إلهكم واتقوه، وأطيعوا وصاياه واسمعوا صوته، واعبدوه وتمسكوا به."], [5, "أما ذلك النبي أو الحالم فإنه يقتل، لأنه نطق بالبهتان ضد الرب إلهكم الذي أخرجكم من ديار مصر، وفداكم من نير العبودية، ليضلكم عن الطريق التي أمركم بسلوكها، فتستأصلون الشر من بينكم."]]}, {"l": "Jer 23:25-27", "n": "", "vs": [[25, "قد سمعت ما نطق به المتنبئون باسمي زورا قائلين: قد حلمت، قد حلمت."], [26, "إلى متى يظل هذا الخداع مكنونا في قلوب المتنبئين زورا؟ إنهم حقا أنبياء خداع، يتنبأون بأوهام قلوبهم."], [27, "فينسون شعبي اسمي بما يقصه كل واحد منهم على صاحبه من أحلامه، كما نسي آباؤهم اسمي لأجل وثن البعل."]]}, {"l": "Mic 2:11", "n": "", "vs": [[11, "إن جال رجل يتنبأ بينكم بالكذب وباللغو الباطل قائلا: إنني أتنبأ لكم بالخمر الوفير والمسكر، فإنه يصبح نبي هذا الشعب."]]}, {"l": "Mat 24:4", "n": "", "vs": [[4, "فأجاب يسوع: «انتبهوا! لا يضللكم أحد!"]]}, {"l": "Mat 24:5", "n": "", "vs": [[5, "فإن كثيرين سيأتون باسمي قائلين إني أنا هو المسيح، فيضللون كثيرين."]]}, {"l": "Mat 24:24", "n": "", "vs": [[24, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات عظيمة وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "2Pe 2:1-3", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."], [2, "وكثيرون سيسيرون وراءهم في طرق الإباحية. وبسببهم توجه الإهانة إلى طريق الحق."], [3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "1Jo 4:1", "n": "", "vs": [[1, "أيها الأحباء، لا تصدقوا كل روح، بل امتحنوا الأرواح لتعرفوا ما إذا كانت من عند الله أم لا، لأن عددا كبيرا من الأنبياء الدجالين قد انتشر في العالم."]]}, {"l": "1Jo 4:2", "n": "", "vs": [[2, "وهذه هي الطريقة التي تعرفون بها كون الروح من عند الله فعلا: إذا كان ذلك الروح يعترف بأن يسوع المسيح قد جاء إلى الأرض في الجسد، فهو من عند الله."]]}, {"l": "Rev 19:20", "n": "", "vs": [[20, "فقبض على الوحش وعلى النبي الدجال الذي قام بالمعجزات في حضور الوحش وأضل بها الذين قبلوا علامة الوحش، وسجدوا لتمثاله. وطرح كلاهما حيا في بحيرة النار والكبريت المتقدة،"]]}], "kwAr": "لا من إيحاء", "noteAr": ""}, {"kw": "nor by letter", "raw": "1Th_4:15; 2Pe_3:4-8", "note": "", "refs": [{"l": "1Th 4:15", "n": "", "vs": [[15, "فهذا نقوله لكم بكلمة من عند الرب: إننا نحن الباقين أحياء إلى حين عودة الرب، لن نسبق الراقدين."]]}, {"l": "2Pe 3:4-8", "n": "", "vs": [[4, "وسيقولون: «أين هو الوعد برجوع المسيح؟ فمنذ أن مات آباؤنا الأولون، بل منذ بدء الخليقة، مازال كل شيء على حاله!»"], [5, "إنهم يتناسون، عمدا، أنه بكلمة أمر من الله وجدت السماوات منذ القديم وتكونت الأرض من الماء وبالماء."], [6, "وبكلمة منه أيضا، دمر العالم الذي كان موجودا في ذلك الزمان، إذ فاض الماء عليه."], [7, "أما السماوات والأرض الحالية، فستبقى مخزونة ومحفوظة للنار بتلك الكلمة عينها إلى يوم الدينونة وهلاك الفاجرين!"], [8, "ولكن، أيها الأحباء، عليكم ألا تنسوا هذه الحقيقة: أن يوما واحدا في نظر الرب هو كألف سنة، وألف سنة كيوم واحد."]]}], "kwAr": "ولا من رسالة منسوبة إلينا", "noteAr": ""}], "arS": [["ألا ", []], ["تضطرب", ["G4531"]], [" ", []], ["أفكاركم", ["G3563"]], [" ", []], ["سريعا", ["G5030"]], [" ولا ", []], ["تقلقوا", ["G2360"]], ["، لا من ", []], ["إيحاء", ["G4151"]], [" ولا من ", []], ["خبر", ["G3056"]], [" ولا من ", []], ["رسالة", ["G1992"]], [" منسوبة إلينا زورا، يزعم فيها أن ", []], ["يوم", ["G2250"]], [" الرب قد ", []], ["حل", ["G1764"]], [" فعلا.", []]]}, {"c": 2, "v": 3, "text": "لا تدعوا أحدا يخدعكم بأية وسيلة! فإن ذلك اليوم لا يأتي دون أن يسبقه انتشار العصيان وظهور الإنسان المتمرد، ابن الهلاك،", "groups": [{"kw": "no man", "raw": "Mat_24:4-6; 1Co_6:9; Eph_5:6", "note": "", "refs": [{"l": "Mat 24:4-6", "n": "", "vs": [[4, "فأجاب يسوع: «انتبهوا! لا يضللكم أحد!"], [5, "فإن كثيرين سيأتون باسمي قائلين إني أنا هو المسيح، فيضللون كثيرين."], [6, "وسوف تسمعون بحروب وأخبار حروب. فإياكم أن ترتعبوا! فلابد أن يحدث هذا كله، ولكن ليست النهاية بعد."]]}, {"l": "1Co 6:9", "n": "", "vs": [[9, "أما تعلمون أن الظالمين لن يرثوا ملكوت الله؟ لا تضلوا: فإن ملكوت الله لن يرثه الزناة ولا عابدو الأصنام ولا الفاسقون ولا المتخنثون ولا مضاجعو الذكور"]]}, {"l": "Eph 5:6", "n": "", "vs": [[6, "لا يخدعكم أحد بكلام باطل! فبسبب هذه الأمور يحل غضب الله على أبناء العصيان."]]}], "kwAr": "لا تدعوا أحدا يخدعكم", "noteAr": ""}, {"kw": "except", "raw": "1Ti_4:1-3; 2Ti_3:1-3, 2Ti_4:3, 2Ti_4:4", "note": "", "refs": [{"l": "1Ti 4:1-3", "n": "", "vs": [[1, "إلا أن الروح يعلن صراحة أن قوما في الأزمنة الأخيرة سوف يرتدون عن الإيمان، منساقين وراء أرواح مضللة وتعاليم شيطانية،"], [2, "في موجة رياء ينشرها معلمون دجالون لهم ضمائر كويت بالنار."], [3, "يحرمون الزواج، ويأمرون بالامتناع عن أطعمة خلقها الله ليتناولها المؤمنون وعارفو الحق شاكرين."]]}, {"l": "2Ti 3:1-3", "n": "", "vs": [[1, "واعلم هذا الأمر: أن أزمنة صعبة ستعم في الأيام الأخيرة؛"], [2, "إذ يكون الناس محبين لأنفسهم، محبين للمال، متكبرين، مباهين بأنفسهم، شتامين، غير مطيعين لوالديهم، ناكرين للجميل، دنسين،"], [3, "متحجري العواطف، غير صفوحين، نمامين، جامحي الأهواء، شرسين غير محبين للصلاح،"]]}, {"l": "2Ti 4:3", "n": "", "vs": [[3, "فإنه سيأتي زمان لا يطيق الناس فيه التعليم الصحيح، بل تبعا لشهواتهم الخاصة يكدسون لأنفسهم معلمين (يقولون لهم كلاما) يداعب الآذان."]]}, {"l": "2Ti 4:4", "n": "", "vs": [[4, "فيحولون آذانهم بعيدا عن الحق، منحرفين إلى الخرافات."]]}], "kwAr": "دون أن يسبقه انتشار العصيان", "noteAr": ""}, {"kw": "man", "raw": "2Th_2:8-10; Dan_7:25; 1Jo_2:18; Rev_13:11-18", "note": "", "refs": [{"l": "2Th 2:8-10", "n": "", "vs": [[8, "عندئذ سيظهر الإنسان المتمرد ظهورا جليا فيبيده الرب يسوع بنفخة فمه ويلاشيه ببهاء ظهوره عند عودته."], [9, "أما بروز المتمرد، فسوف يكون بقدر طاقة الشيطان على المعجزات والعلامات والعجائب المزيفة كلها،"], [10, "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا."]]}, {"l": "Dan 7:25", "n": "", "vs": [[25, "ويعير العلي وينكل بقديسيه، ويحاول أن يغير الأوقات والقوانين، فيذل القديسين ثلاث سنوات ونصف السنة."]]}, {"l": "1Jo 2:18", "n": "", "vs": [[18, "أيها الأولاد، اعلموا أننا نعيش الآن في الزمن الأخير. وكما سمعتم أنه سوف يأتي أخيرا «مسيح دجال»، فقد ظهر حتى الآن كثيرون من الدجالين المقاومين للمسيح. من هنا نتأكد أننا نعيش في الزمن الأخير."]]}, {"l": "Rev 13:11-18", "n": "", "vs": [[11, "ثم رأيت وحشا آخر خارجا من الأرض، له قرنان صغيران كقرني خروف، ولكن صوته كصوت تنين،"], [12, "وقد استمد سلطته من الوحش الأول الذي خرج من البحر ليعمل بها في حضوره، فجعل سكان الأرض يسجدون للوحش الأول الذي شفي من جرحه المميت."], [13, "وقام الوحش الثاني بآيات خارقة، حتى إنه أنزل من السماء نارا على الأرض بمشهد من الناس جميعا،"], [14, "فخدع سكان الأرض بالآيات التي كان يقوم بها في حضور الوحش الأول. وأمر سكان الأرض أن يقيموا تمثالا للوحش الأول الذي كان قد جرح جرحا مميتا ولكنه عاش!"], [15, "وأعطي سلطة على أن يبعث الروح في التمثال لينطق، وأن يمد يده فيقتل كل من يرفض السجود لتمثال الوحش،"], [16, "وأن يأمر الجميع، كبارا وصغارا، أغنياء وفقراء، أحرارا وعبيدا، أن يحملوا علامة على أيديهم اليمنى أو على جباههم،"], [17, "فلا يستطيع أحد أن يبيع أو يشتري إلا إذا كانت عليه علامة الوحش، أو الرقم الذي يرمز لاسمه!"], [18, "ولابد هنا من الفطنة: فعلى أهل المعرفة أن يحسبوا عدد اسم الوحش. إنه عدد لإنسان، وهو الرقم «ست مئة وستة وستون»."]]}], "kwAr": "الإنسان المتمرد", "noteAr": ""}, {"kw": "the son", "raw": "Joh_17:12; Rev_17:8, Rev_17:11", "note": "", "refs": [{"l": "Joh 17:12", "n": "", "vs": [[12, "حين كنت معهم، كنت أحفظهم في اسمك. فالذين وهبتهم لي، رعيتهم، ولم يهلك منهم أحد إلا ابن الهلاك، ليتم الكتاب."]]}, {"l": "Rev 17:8", "n": "", "vs": [[8, "هذا الوحش كان موجودا، وهو غير موجود الآن، ولكنه على وشك أن يطلع من الهاوية ويمضي إلى الهلاك. وسيدهش سكان الأرض الذين لم تكتب أسماؤهم منذ تأسيس العالم في سجل الحياة، عندما يرون الوحش، لأنه كان موجودا، ثم أصبح غير موجود، وسيعود!"]]}, {"l": "Rev 17:11", "n": "", "vs": [[11, "أما الوحش الذي كان موجودا ثم أصبح غير موجود، فهو ملك ثامن سبق أن ملك كواحد من السبعة، سيمضي إلى الهلاك."]]}], "kwAr": "ابن الهلاك", "noteAr": ""}], "arS": [["لا تدعوا ", []], ["أحدا", ["G5100"]], [" ", []], ["يخدعكم", ["G1818"]], [" بأية ", []], ["وسيلة", ["G5158"]], ["! فإن ذلك اليوم لا ", []], ["يأتي", ["G2064"]], [" دون أن ", []], ["يسبقه", ["G4412"]], [" انتشار ", []], ["العصيان", ["G646"]], [" ", []], ["وظهور", ["G601"]], [" ", []], ["الإنسان", ["G444"]], [" ", []], ["المتمرد", ["G266"]], ["، ", []], ["ابن", ["G5207"]], [" ", []], ["الهلاك", ["G684"]], ["،", []]]}, {"c": 2, "v": 4, "text": "الذي يتحدى كل ما يدعى إلها أو معبودا، ويعاديه مترفعا عليه. بل إنه أيضا يتخذ من هيكل الله مقرا له، محاولا أن يبرهن أنه إله.", "groups": [{"kw": "and exalteth", "raw": "Isa_14:13; Eze_28:2, Eze_28:6, Eze_28:9; Dan_7:8, Dan_7:25, Dan_8:9-11, Dan_11:36; Rev_13:6", "note": "", "refs": [{"l": "Isa 14:13", "n": "", "vs": [[13, "قد قلت في قلبك: إني أرتقي إلى السماء وأرفع عرشي فوق كواكب الله، وأجلس على جبل الاجتماع في أقصى الشمال"]]}, {"l": "Eze 28:2", "n": "", "vs": [[2, "«ياابن آدم، قل لملك صور، هذا ما يعلنه السيد الرب: لأنك تكبرت وقلت: «أنا إله، وأتربع في مجلس الآلهة، في قلب البحار»؛ مع أنك إنسان ولست إلها، وإن ظننت أن لديك حكمة الآلهة!"]]}, {"l": "Eze 28:6", "n": "", "vs": [[6, "لذلك يقول السيد الرب: لأنك ظننت أن لديك حكمة الآلهة،"]]}, {"l": "Eze 28:9", "n": "", "vs": [[9, "أتظل تقول أنئذ أمام قاتلك: أنا إله؟ أنت إنسان لا إله في قبضة ذابحيك."]]}, {"l": "Dan 7:8", "n": "", "vs": [[8, "وفيما كنت أتأمل القرون إذا بقرن آخر صغير نبت بينها، واقتلعت ثلاثة قرون من أمامه، وكان في هذا القرن عيون كعيون الإنسان وفم ينطق بعظائم."]]}, {"l": "Dan 7:25", "n": "", "vs": [[25, "ويعير العلي وينكل بقديسيه، ويحاول أن يغير الأوقات والقوانين، فيذل القديسين ثلاث سنوات ونصف السنة."]]}, {"l": "Dan 8:9-11", "n": "", "vs": [[9, "ونما من واحد منها قرن صغير عظم أمره، وامتد جنوبا وشرقا ونحو أرض إسرائيل،"], [10, "وبلغ من عظمته أنه تطاول على ملوك الأرض وقضى على بعضهم وداس عليهم،"], [11, "وتحدى حتى رئيس الجند (أي الله)، وتكبر عليه، وألغى المحرقة الدائمة وهدم الهيكل."]]}, {"l": "Dan 11:36", "n": "", "vs": [[36, "ويصنع الملك ما يطيب له، ويتعظم على كل إله، ويجدف بالعظائم على إله الآلهة، ويفلح، إلى أن يحين اكتمال الغضب إذ لابد أن يتم ما قضى الله به."]]}, {"l": "Rev 13:6", "n": "", "vs": [[6, "فأخذ الوحش يشتم اسم الله، ويشتم بيته وسكان السماء."]]}], "kwAr": "ويعاديه مترفعا عليه", "noteAr": ""}, {"kw": "called", "raw": "1Co_8:5", "note": "", "refs": [{"l": "1Co 8:5", "n": "", "vs": [[5, "حتى لو كانت الآلهة المزعومة موجودة في السماء أو على الأرض وما أكثر تلك الآلهة والأرباب!"]]}], "kwAr": "كل ما يدعى إلها", "noteAr": ""}, {"kw": "sitteth", "raw": "Dan_8:12-14, Dan_11:45; Rev_13:6, Rev_13:7", "note": "", "refs": [{"l": "Dan 8:12-14", "n": "", "vs": [[12, "وبسبب المعصية سلط على جند القديسين وعلى المحرقة اليومية. وحالفه التوفيق في كل ما صنع فطرح الحق على الأرض."], [13, "فسمعت قدوسا يتكلم، فيرد عليه قدوس آخر: «كم يطول زمن الرؤيا بشأن المحرقة الدائمة اليومية، ومعصية الخراب، وتسليم الهيكل والجند ليكونوا مدوسين؟»"], [14, "فأجابه: «إلى ألفين وثلاث مئة يوم ثم يتطهر الهيكل»."]]}, {"l": "Dan 11:45", "n": "", "vs": [[45, "وينصب خيمته الملكية بين البحر وأورشليم، ويبلغ نهاية مصيره وليس له من نصير»."]]}, {"l": "Rev 13:6", "n": "", "vs": [[6, "فأخذ الوحش يشتم اسم الله، ويشتم بيته وسكان السماء."]]}, {"l": "Rev 13:7", "n": "", "vs": [[7, "وأعطي الوحش قدرة على أن يحارب القديسين ويهزمهم وسلطة على كل قبيلة وشعب ولغة وأمة."]]}], "kwAr": "يتخذ من هيكل الله مقرا له", "noteAr": ""}], "arS": [["الذي ", []], ["يتحدى", ["G480"]], [" كل ما ", []], ["يدعى", ["G3004"]], [" ", []], ["إلها", ["G2316"]], [" أو ", []], ["معبودا", ["G4574"]], ["، ", []], ["ويعاديه مترفعا", ["G5229"]], [" عليه. بل إنه أيضا ", []], ["يتخذ", ["G2523"]], [" من ", []], ["هيكل", ["G3485"]], [" ", []], ["الله", ["G2316"]], [" مقرا له، محاولا أن ", []], ["يبرهن", ["G584"]], [" أنه ", []], ["إله", ["G2316"]], [".", []]]}, {"c": 2, "v": 5, "text": "ألا تذكرون أني كثيرا ما قلت لكم هذا عندما كنت عندكم؟", "groups": [{"kw": "Remember", "raw": "Mat_16:9; Mar_8:18; Luk_24:6, Luk_24:7; Act_20:31", "note": "", "refs": [{"l": "Mat 16:9", "n": "", "vs": [[9, "ألا تفهمون بعد؟ أم نسيتم الأرغفة الخمسة التي أشبعت الخمسة الآلاف، وكم قفة رفعتم منها؟"]]}, {"l": "Mar 8:18", "n": "", "vs": [[18, "لكم عيون، ألا تبصرون؟ لكم آذان، ألا تسمعون؟ أولستم تذكرون؟"]]}, {"l": "Luk 24:6", "n": "", "vs": [[6, "إنه ليس هنا، ولكنه قد قام! اذكرن ما كلمكم به إذ كان بعد في الجليل"]]}, {"l": "Luk 24:7", "n": "", "vs": [[7, "فقال: إن ابن الإنسان لابد أن يسلم إلى أيدي أناس خاطئين، فيصلب، وفي اليوم الثالث يقوم»."]]}, {"l": "Act 20:31", "n": "", "vs": [[31, "لذلك كونوا متيقظين، وتذكروا أني، مدة ثلاث سنين، لم أتوقف ليلا ونهارا عن نصح كل واحد منكم وأنا أذرف  ["G2722"]], [" حتى لا ", []], ["يظهر", ["G601"]], [" إلا في ", []], ["الوقت", ["G2540"]], [" المعين له.", []]]}, {"c": 2, "v": 7, "text": "فإن التمرد الآن يعمل خفية كأنه سر. ولكن فقط إلى أن يرفع من الوسط ذاك الذي يحتجز المتمرد.", "groups": [{"kw": "the mystery", "raw": "1Ti_3:16; Rev_17:5, Rev_17:7", "note": "", "refs": [{"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}, {"l": "Rev 17:5", "n": "", "vs": [[5, "وعلى جبينها اسم مكتوب: سر: «بابل العظمى، أم زانيات الأرض وأصنامها المكروهة»."]]}, {"l": "Rev 17:7", "n": "", "vs": [[7, "فسألني الملاك: «لماذا دهشت؟ سأطلعك على ما ترمز إليه المرأة والوحش الذي يحملها، صاحب الرؤوس السبعة والقرون العشرة:"]]}], "kwAr": "التمرد الآن يعمل خفية كأنه سر", "noteAr": ""}, {"kw": "doth", "raw": "Act_20:29; Col_2:18-23; 2Ti_2:17, 2Ti_2:18; 1Jo_2:18, 1Jo_4:3", "note": "", "refs": [{"l": "Act 20:29", "n": "", "vs": [[29, "فإني أعلم أنه بعد رحيلي سيندس بينكم ذئاب خاطفة، لا تشفق على القطيع."]]}, {"l": "Col 2:18-23", "n": "", "vs": [[18, "لا يحرمكم أحد من جائزتكم، بحملكم على ما يرغب فيه من إظهار التواضع والتعبد للملائكة، داخلا في رؤى يتوهمها، وقد نفخه باطلا ذهنه الجسدي،"], [19, "وهو غير ممسك بالرأس الذي منه يتلقى الجسد كله غذاءه وتماسكه بالمفاصل والأوصال، فينمو النمو الذي يمنحه الله ."], [20, "فمادمتم قد متم مع المسيح بالنسبة لمباديء العالم، فلماذا، كما لو كنتم عائشين في العالم، تخضعون أنفسكم لفرائض مثل هذه:"], [21, "لا تمسك، لا تذق، لا تلمس"], [22, "وهذه أشياء تستهلك وتزول. فتلك الفرائض هي وصايا البشر وتعاليمهم."], [23, "لها مظاهر الحكمة لما فيها من إفراط في العبادة المصطنعة، وإذلال للذات، وقهر للجسد؛ أمور لا قيمة لها، وما هي إلا لإرضاء الميول البشرية."]]}, {"l": "2Ti 2:17", "n": "", "vs": [[17, "وكلامهم ينهش كالآكلة، ومنهم هيمنايوس وفيليتوس،"]]}, {"l": "2Ti 2:18", "n": "", "vs": [[18, "اللذان زاغا عن الحق؛ إذ يزعمان أن القيامة قد حدثت، ويهدمان إيمان بعض الناس."]]}, {"l": "1Jo 2:18", "n": "", "vs": [[18, "أيها الأولاد، اعلموا أننا نعيش الآن في الزمن الأخير. وكما سمعتم أنه سوف يأتي أخيرا «مسيح دجال»، فقد ظهر حتى الآن كثيرون من الدجالين المقاومين للمسيح. من هنا نتأكد أننا نعيش في الزمن الأخير."]]}, {"l": "1Jo 4:3", "n": "", "vs": [[3, "وإن كان ينكر ذلك لا يكون من عند الله، بل من عند ضد المسيح الذي سمعتم أنه سوف يأتي، وهو الآن موجود في العالم."]]}], "kwAr": "يعمل", "noteAr": ""}, {"kw": "he who", "raw": "2Th_2:6", "note": "", "refs": [{"l": "2Th 2:6", "n": "", "vs": [[6, "وأنتم الآن تعرفون ما الذي يحتجزه حتى لا يظهر إلا في الوقت المعين له."]]}], "kwAr": "ذاك الذي يحتجز", "noteAr": ""}], "arS": [["فإن ", []], ["التمرد", ["G458"]], [" الآن ", []], ["يعمل", ["G1754"]], [" خفية كأنه ", []], ["سر", ["G3466"]], [". ولكن ", []], ["فقط", ["G3440"]], [" إلى أن ", []], ["يرفع", ["G1096"]], [" من ", []], ["الوسط", ["G3319"]], [" ذاك الذي ", []], ["يحتجز", ["G2722"]], [" المتمرد.", []]]}, {"c": 2, "v": 8, "text": "عندئذ سيظهر الإنسان المتمرد ظهورا جليا فيبيده الرب يسوع بنفخة فمه ويلاشيه ببهاء ظهوره عند عودته.", "groups": [{"kw": "that", "raw": "2Th_2:3; Mat_13:19, Mat_13:38; 1Jo_2:13, 1Jo_3:12, 1Jo_5:18", "note": "", "refs": [{"l": "2Th 2:3", "n": "", "vs": [[3, "لا تدعوا أحدا يخدعكم بأية وسيلة! فإن ذلك اليوم لا يأتي دون أن يسبقه انتشار العصيان وظهور الإنسان المتمرد، ابن الهلاك،"]]}, {"l": "Mat 13:19", "n": "", "vs": [[19, "كل من يسمع كلمة الملكوت ولا يفهمها، يأتي الشرير ويخطف ما قد زرع في قلبه: هذا هو المزروع على الممرات."]]}, {"l": "Mat 13:38", "n": "", "vs": [[38, "والحقل هو العالم. والزرع الجيد هو بنو الملكوت. والزوان هو بنو الشرير."]]}, {"l": "1Jo 2:13", "n": "", "vs": [[13, "أكتب إليكم أيها الآباء، لأنكم قد عرفتم المسيح الكائن منذ البداية. أكتب إليكم أيها الشباب، لأنكم قد غلبتم إبليس الشرير. كتبت إليكم أيها الأولاد الصغار، لأنكم قد عرفتم الآب."]]}, {"l": "1Jo 3:12", "n": "", "vs": [[12, "لا أن نكون مثل قايين الذي قتل أخاه. فقايين كان من أولاد إبليس الشرير. ولماذا قتل أخاه؟ قتله لأن أعماله هو كانت شريرة، أما أعمال أخيه فكانت صالحة."]]}, {"l": "1Jo 5:18", "n": "", "vs": [[18, "نحن واثقون بأن كل من ولد من الله لا يمارس الخطيئة، لأن ابن الله يحميه فلا يمسه إبليس الشرير."]]}], "kwAr": "سيظهر الإنسان المتمرد", "noteAr": ""}, {"kw": "whom", "raw": "Dan_7:10,Dan_7:11, Dan_7:26; Rev_18:8-10, Rev_19:20, Rev_20:10", "note": "", "refs": [{"l": "Dan 7:10", "n": "", "vs": [[10, "ومن أمامه يتدفق ويجري نهر من نار، وتخدمه ألوف ألوف الملائكة، ويمثل في حضرته عشرات الألوف. فانعقد مجلس القضاء وفتحت الأسفار."]]}, {"l": "Dan 7:11", "n": "", "vs": [[11, "وبقيت أراقب القرن من جراء ما تفوه به من عظائم، حتى قتل الحيوان وتلف جسمه وطرح وقودا للنار."]]}, {"l": "Dan 7:26", "n": "", "vs": [[26, "ولكن ينعقد مجلس القضاء، فيجرد من سلطانه فيدمر ويفنى إلى المنتهى."]]}, {"l": "Rev 18:8-10", "n": "", "vs": [[8, "لذلك ستنقض عليها البلايا في يوم واحد، من موت وحزن وجوع، وستحترق بالنار، فإن الله الذي يدينها هو رب قدير."], [9, "وسيبكي عليها ملوك الأرض الذين زنوا وترفهوا معها، وسينوحون وهم ينظرون إلى دخان حريقها،"], [10, "فيقفون على بعد منها، خوفا من عذابها، وهم يصرخون: الويل، الويل، أيتها المدينة العظمى، بابل القوية! في ساعة واحدة حل بك العقاب!"]]}, {"l": "Rev 19:20", "n": "", "vs": [[20, "فقبض على الوحش وعلى النبي الدجال الذي قام بالمعجزات في حضور الوحش وأضل بها الذين قبلوا علامة الوحش، وسجدوا لتمثاله. وطرح كلاهما حيا في بحيرة النار والكبريت المتقدة،"]]}, {"l": "Rev 20:10", "n": "", "vs": [[10, "ثم يطرح إبليس الذي كان يضللهم، في بحيرة النار والكبريت، حيث الوحش والنبي الدجال. هناك سوف يعذبون نهارا وليلا، إلى أبد الآبدين."]]}], "kwAr": "فيبيده الرب يسوع", "noteAr": ""}, {"kw": "the spirit", "raw": "Job_4:9; Psa_18:15; Isa_11:4; Hos_6:5; Rev_1:16, Rev_2:16, Rev_19:15, Rev_19:20,Rev_19:21", "note": "", "refs": [{"l": "Job 4:9", "n": "", "vs": [[9, "وبنسمة الله يفنون وبعاصفة غضبه يهلكون."]]}, {"l": "Psa 18:15", "n": "", "vs": [[15, "ظهرت مجاري المياه العميقة، وانكشفت أسس المسكونة من زجرك يارب، ومن أنفك اللافحة."]]}, {"l": "Isa 11:4", "n": "", "vs": [[4, "إنما يقضي بعدل للمساكين، ويحكم بالإنصاف لبائسي الأرض، ويعاقب الأرض بقضيب فمه، ويميت المنافق بنفخة شفتيه،"]]}, {"l": "Hos 6:5", "n": "", "vs": [[5, "لذلك مزقتكم بإنذارات الأنبياء، وقضيت عليكم بأحكامي، فقضائي عليكم يشع كالنور."]]}, {"l": "Rev 1:16", "n": "", "vs": [[16, "ووجهه يتوهج بالنور كشمس الظهيرة. وكان في يده اليمنى سبعة نجوم، ومن فمه يخرج سيف قاطع ذو حدين."]]}, {"l": "Rev 2:16", "n": "", "vs": [[16, "عليك أن تتوب، وإلا جئتك سريعا لأحارب هؤلاء الضالين بالسيف الذي في فمي."]]}, {"l": "Rev 19:15", "n": "", "vs": [[15, "وكان يخرج من فمه سيف حاد ليضرب به الأمم ويحكمهم بعصا من حديد، ويدوسهم في معصرة شدة غضب الله القادر على كل شيء."]]}, {"l": "Rev 19:20", "n": "", "vs": [[20, "فقبض على الوحش وعلى النبي الدجال الذي قام بالمعجزات في حضور الوحش وأضل بها الذين قبلوا علامة الوحش، وسجدوا لتمثاله. وطرح كلاهما حيا في بحيرة النار والكبريت المتقدة،"]]}, {"l": "Rev 19:21", "n": "", "vs": [[21, "وقتل السيف الخارج من فم الفارس جميع الباقين، وشبعت الطيور كلها من لحومهم."]]}], "kwAr": "بنفخة فمه", "noteAr": ""}, {"kw": "with the brightness", "raw": "2Th_1:8, 2Th_1:9; Heb_10:27", "note": "", "refs": [{"l": "2Th 1:8", "n": "", "vs": [[8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."]]}, {"l": "2Th 1:9", "n": "", "vs": [[9, "فهؤلاء سيكابدون عقاب الهلاك الأبدي، بعيدا من حضرة الرب ومن مجد قوته،"]]}, {"l": "Heb 10:27", "n": "", "vs": [[27, "بل انتظار العقاب الأكيد في لهيب النار التي ستلتهم المتمردين. ويا له من انتظار مخيف!"]]}], "kwAr": "ببهاء ظهوره", "noteAr": ""}], "arS": [["عندئذ ", []], ["سيظهر", ["G601"]], [" الإنسان ", []], ["المتمرد", ["G459"]], [" ظهورا جليا ", []], ["فيبيده", ["G355"]], [" ", []], ["الرب", ["G2962"]], [" يسوع ", []], ["بنفخة", ["G4151"]], [" ", []], ["فمه", ["G4750"]], [" ", []], ["ويلاشيه", ["G2673"]], [" ", []], ["ببهاء", ["G2015"]], [" ظهوره عند ", []], ["عودته", ["G3952"]], [".", []]]}, {"c": 2, "v": 9, "text": "أما بروز المتمرد، فسوف يكون بقدر طاقة الشيطان على المعجزات والعلامات والعجائب المزيفة كلها،", "groups": [{"kw": "is", "raw": "Joh_8:41, Joh_8:44; Act_8:9-11, Act_13:10; 2Co_4:4, 2Co_11:3, 2Co_11:14; Eph_2:2; Rev_9:11; Rev_12:9, Rev_12:17, Rev_13:1-5, Rev_18:23, Rev_19:20, Rev_20:10", "note": "", "refs": [{"l": "Joh 8:41", "n": "", "vs": [[41, "أنتم تعملون أعمال أبيكم!» فقالوا له: «نحن لم نولد من زنا! لنا أب واحد هو الله »."]]}, {"l": "Joh 8:44", "n": "", "vs": [[44, "إنكم أولاد أبيكم إبليس، وترغبون أن تعملوا شهوات أبيكم. فهو من البدء كان قاتلا للناس، ولم يثبت في الحق لأنه خال من الحق! وعندما ينطق بالكذب فهو ينضح بما فيه، لأنه كذاب وأبو الكذب!"]]}, {"l": "Act 8:9-11", "n": "", "vs": [[9, "وكان قبل ذلك في تلك المدينة ساحر اسمه سيمون، يمارس السحر فيذهل أهل السامرة ويدعي أنه رجل عظيم."], [10, "فأصغى إليه الجميع من الصغير إلى الكبير، قائلين: «هذا الرجل هو قدرة الله العظمى!»"], [11, "وإنما أصغوا إليه لأنهم كانوا قد انخدعوا مدة طويلة بحيله السحرية!"]]}, {"l": "Act 13:10", "n": "", "vs": [[10, "«أيها الممتليء غشا وخبثا! ياابن إبليس! ياعدو كل بر! أما تكف عن تعويج طرق الرب المستقيمة؟"]]}, {"l": "2Co 4:4", "n": "", "vs": [[4, "الذين أعمى إله هذا العالم أذهانهم حتى لا يضيء لهم نور الإنجيل المختص بمجد المسيح الذي هو صورة الله."]]}, {"l": "2Co 11:3", "n": "", "vs": [[3, "غير أني أخشى أن تضلل عقولكم عن الإخلاص والطهارة تجاه المسيح مثلما أغوت الحية بمكرها حواء."]]}, {"l": "2Co 11:14", "n": "", "vs": [[14, "ولا عجب! فالشيطان نفسه يظهر نفسه بمظهر ملاك نور."]]}, {"l": "Eph 2:2", "n": "", "vs": [[2, "التي كنتم تسلكون فيها حسب مسرى هذا العالم، تابعين رئيس قوات الهواء، ذلك الروح العامل الآن في أبناء العصيان،"]]}, {"l": "Rev 9:11", "n": "", "vs": [[11, "أما ملكه فهو «ملاك الهاوية»، واسمه بالعبرية «أبدون»، وباليونانية «أبوليون»."]]}, {"l": "Rev 12:9", "n": "", "vs": [[9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."]]}, {"l": "Rev 12:17", "n": "", "vs": [[17, "فاغتاظ التنين من المرأة وشن حربا على باقي أولادها الذين يعملون بوصايا الله وعندهم الشهادة ليسوع."]]}, {"l": "Rev 13:1-5", "n": "", "vs": [[1, "ثم رأيت نفسي واقفا على رمل البحر، وإذا وحش خارج من البحر، له سبعة رؤوس وعشرة قرون، على كل قرن منها تاج، وقد كتب على كل رأس اسم تجديف."], [2, "وبدا هذا الوحش مثل النمر وله قوائم كقوائم دب وفم كفم أسد! وأعطاه التنين قدرته وعرشه وسلطة عظيمة."], [3, "وبدا واحد من رؤوسه كأنه ذبح ذبحا مميتا، ولكن الجرح المميت شفي، فتعجب سكان الأرض لذلك، وتبعوا الوحش."], [4, "وسجد الناس للتنين لأنه وهب الوحش سلطته، وعبدوا الوحش وهم يقولون: «من مثل هذا الوحش؟ ومن يجرؤ على محاربته؟»"], [5, "وأعطى التنين الوحش فما ينطق بكلام الكبرياء والتجديف، وأعطاه سلطة العمل مدة اثنين وأربعين شهرا."]]}, {"l": "Rev 18:23", "n": "", "vs": [[23, "ولن يضيء فيك نور مصباح. ولن يسمع فيك صوت عريس وعروس. فقد كان تجارك سادة الأرض، وبسحرك ضللت جميع الأمم."]]}, {"l": "Rev 19:20", "n": "", "vs": [[20, "فقبض على الوحش وعلى النبي الدجال الذي قام بالمعجزات في حضور الوحش وأضل بها الذين قبلوا علامة الوحش، وسجدوا لتمثاله. وطرح كلاهما حيا في بحيرة النار والكبريت المتقدة،"]]}, {"l": "Rev 20:10", "n": "", "vs": [[10, "ثم يطرح إبليس الذي كان يضللهم، في بحيرة النار والكبريت، حيث الوحش والنبي الدجال. هناك سوف يعذبون نهارا وليلا، إلى أبد الآبدين."]]}], "kwAr": "بقدر طاقة الشيطان", "noteAr": ""}, {"kw": "and signs", "raw": "Exo_7:22, Exo_8:7, Exo_8:18; Deu_13:1, Deu_13:2; Mat_24:24; Mar_13:22; 2Ti_3:8; Rev_13:11-15; Rev_18:23, Rev_19:20", "note": "", "refs": [{"l": "Exo 7:22", "n": "", "vs": [[22, "وكذلك فعل سحرة مصر بسحرهم، فتصلب قلب فرعون فلم يستمع إليهما، تماما حسب قول الرب."]]}, {"l": "Exo 8:7", "n": "", "vs": [[7, "وكذلك فعل السحرة بسحرهم فأصعدوا ضفادع على أرض مصر."]]}, {"l": "Exo 8:18", "n": "", "vs": [[18, "وكذلك حاول السحرة بسحرهم ليخرجوا البعوض فأخفقوا. وكان البعوض منتشرا على الناس والبهائم."]]}, {"l": "Deu 13:1", "n": "", "vs": [[1, "إذا ظهر بينكم نبي أو صاحب أحلام، وتنبأ بوقوع آية أو أعجوبة."]]}, {"l": "Deu 13:2", "n": "", "vs": [[2, "فتحققت تلك الآية أو الأعجوبة التي تنبأ بها، ثم قال: هلم نذهب وراء آلهة أخرى لم تعرفوها ونعبدها."]]}, {"l": "Mat 24:24", "n": "", "vs": [[24, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات عظيمة وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Mar 13:22", "n": "", "vs": [[22, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "2Ti 3:8", "n": "", "vs": [[8, "ومثلما قاوم (الساحران) ينيس ويمبريس موسى، كذلك أيضا يقاوم هؤلاء الحق؛ أناس عقولهم فاسدة، وقد تبين أنهم غير أهل للإيمان."]]}, {"l": "Rev 13:11-15", "n": "", "vs": [[11, "ثم رأيت وحشا آخر خارجا من الأرض، له قرنان صغيران كقرني خروف، ولكن صوته كصوت تنين،"], [12, "وقد استمد سلطته من الوحش الأول الذي خرج من البحر ليعمل بها في حضوره، فجعل سكان الأرض يسجدون للوحش الأول الذي شفي من جرحه المميت."], [13, "وقام الوحش الثاني بآيات خارقة، حتى إنه أنزل من السماء نارا على الأرض بمشهد من الناس جميعا،"], [14, "فخدع سكان الأرض بالآيات التي كان يقوم بها في حضور الوحش الأول. وأمر سكان الأرض أن يقيموا تمثالا للوحش الأول الذي كان قد جرح جرحا مميتا ولكنه عاش!"], [15, "وأعطي سلطة على أن يبعث الروح في التمثال لينطق، وأن يمد يده فيقتل كل من يرفض السجود لتمثال الوحش،"]]}, {"l": "Rev 18:23", "n": "", "vs": [[23, "ولن يضيء فيك نور مصباح. ولن يسمع فيك صوت عريس وعروس. فقد كان تجارك سادة الأرض، وبسحرك ضللت جميع الأمم."]]}, {"l": "Rev 19:20", "n": "", "vs": [[20, "فقبض على الوحش وعلى النبي الدجال الذي قام بالمعجزات في حضور الوحش وأضل بها الذين قبلوا علامة الوحش، وسجدوا لتمثاله. وطرح كلاهما حيا في بحيرة النار والكبريت المتقدة،"]]}], "kwAr": "والعلامات والعجائب المزيفة", "noteAr": ""}], "arS": [["أما ", []], ["بروز", ["G3952"]], [" المتمرد، فسوف يكون بقدر ", []], ["طاقة", ["G1753"]], [" ", []], ["الشيطان", ["G4567"]], [" على ", []], ["المعجزات", ["G1411"]], [" ", []], ["والعلامات", ["G4592"]], [" ", []], ["والعجائب", ["G5059"]], [" ", []], ["المزيفة", ["G5579"]], [" ", []], ["كلها", ["G3956"]], ["،", []]]}, {"c": 2, "v": 10, "text": "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا.", "groups": [{"kw": "deceivableness", "raw": "Rom_16:18; 2Co_2:17, 2Co_4:2, 2Co_11:13, 2Co_11:15; Eph_4:14; 2Pe_2:18; Heb_3:13", "note": "", "refs": [{"l": "Rom 16:18", "n": "", "vs": [[18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."]]}, {"l": "2Co 2:17", "n": "", "vs": [[17, "فإننا لا نتاجر بكلمة الله كما يفعل الكثيرون، وإنما بإخلاص ومن قبل الله، وأمام الله، نتكلم في المسيح."]]}, {"l": "2Co 4:2", "n": "", "vs": [[2, "ولكننا قد رفضنا الأساليب الخفية المخجلة، إذ لا نسلك في المكر، ولا نزور كلمة الله، بل بإعلاننا للحق نمدح أنفسنا لدى ضمير كل إنسان، أمام الله."]]}, {"l": "2Co 11:13", "n": "", "vs": [[13, "فإن أمثال هؤلاء هم رسل دجالون، عمال ماكرون، يظهرون أنفسهم بمظهر رسل المسيح."]]}, {"l": "2Co 11:15", "n": "", "vs": [[15, "فليس كثيرا إذن أن يظهر خدامه أنفسهم بمظهر خدام البر. وإن عاقبتهم ستكون على حسب أعمالهم."]]}, {"l": "Eph 4:14", "n": "", "vs": [[14, "وذلك حتى لا نكون فيما بعد أطفالا تتقاذفنا وتحملنا كل ريح تعليم يقوم على خداع الناس والمكر بهم لجرهم إلى الضلال الملفق،"]]}, {"l": "2Pe 2:18", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."]]}, {"l": "Heb 3:13", "n": "", "vs": [[13, "وإنما، شجعوا بعضكم بعضا كل يوم، مادمنا نقول: «اليوم...». وذلك لكي لا تقسي الخطيئة قلب أحد منكم بخداعها."]]}], "kwAr": "التضليل", "noteAr": ""}, {"kw": "in them", "raw": "1Co_1:18; 2Co_2:15, 2Co_4:3; 2Pe_2:12", "note": "", "refs": [{"l": "1Co 1:18", "n": "", "vs": [[18, "لأن البشارة بالصليب جهالة عند الهالكين؛ وأما عندنا، نحن المخلصين، فهي قدرة الله."]]}, {"l": "2Co 2:15", "n": "", "vs": [[15, "فإننا رائحة المسيح الطيبة المرتفعة إلى الله، المنتشرة على السواء عند الذين يخلصون وعند الذين يهلكون:"]]}, {"l": "2Co 4:3", "n": "", "vs": [[3, "ولكن إن كان إنجيلنا محجوبا، فإنما هو محجوب لدى الهالكين، لدى غير المؤمنين"]]}, {"l": "2Pe 2:12", "n": "", "vs": [[12, "حقا إن هؤلاء المعلمين الدجالين الذين يتكلمون كلاما مهينا في أمور يجهلونها، يشبهون الحيوانات المفترسة غير العاقلة، المولودة ليصطادها الناس ويقتلوها. فلابد أن يهلكوا مثلها."]]}], "kwAr": "الهالكين", "noteAr": ""}, {"kw": "they received", "raw": "Pro_1:7, Pro_2:1-6, Pro_4:5, Pro_4:6, Pro_8:17; Mat_13:11; Joh_3:19-21, Joh_8:45-47; Rom_2:7, Rom_2:8; Rom_6:17; 1Co_16:22; Jam_1:16-18", "note": "", "refs": [{"l": "Pro 1:7", "n": "", "vs": [[7, "فإن مخافة الرب هي رأس المعرفة، أما الحمقى فيستهينون بالحكمة والتأديب."]]}, {"l": "Pro 2:1-6", "n": "", "vs": [[1, "ياابني إن قبلت كلامي، وادخرت وصاياي في قلبك،"], [2, "وأرهفت أذنك إلى الحكمة، وأملت قلبك نحو الفهم،"], [3, "وإن نشدت الفطنة، وهتفت داعيا الفهم."], [4, "إن التمسته كما تلتمس الفضة، وبحثت عنه كما يبحث عن الكنوز الدفينة،"], [5, "عندئذ تدرك مخافة الرب وتعثر على معرفة الله،"], [6, "لأن الرب يهب الحكمة، ومن فمه تتدفق المعرفة والفهم."]]}, {"l": "Pro 4:5", "n": "", "vs": [[5, "لا تنس ولا تعرض عن أقوال فمي، بل تلقن الحكمة واقتن الفطنة."]]}, {"l": "Pro 4:6", "n": "", "vs": [[6, "لا تنبذها فتحفظك. أحببها فتصونك."]]}, {"l": "Pro 8:17", "n": "", "vs": [[17, "أحب من يحبونني، ومن يجد في البحث عني يعثر علي."]]}, {"l": "Mat 13:11", "n": "", "vs": [[11, "فأجاب: «لأنه قد أعطي لكم أن تعرفوا أسرار ملكوت السماوات؛ أما أولئك، فلم يعط لهم ذلك."]]}, {"l": "Joh 3:19-21", "n": "", "vs": [[19, "وهذا هو الحكم: إن النور قد جاء إلى العالم، ولكن الناس أحبوا الظلمة أكثر من النور، لأن أعمالهم كانت شريرة."], [20, "فكل من يعمل الشر يبغض النور، ولا يأتي إليه مخافة أن تفضح أعماله."], [21, "وأما الذي يسلك في الحق فيأتي إلى النور لتظهر أعماله ويتبين أنها عملت بقوة الله»."]]}, {"l": "Joh 8:45-47", "n": "", "vs": [[45, "أما أنا فلأني أقول الحق، لستم تصدقونني."], [46, "من منكم يثبت علي خطيئة؟ فما دمت أقول الحق، فلماذا لا تصدقونني؟"], [47, "من كان من الله حقا، يسمع كلام الله. ولكنكم ترفضون كلام الله، لأنكم لستم من الله!»"]]}, {"l": "Rom 2:7", "n": "", "vs": [[7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"]]}, {"l": "Rom 2:8", "n": "", "vs": [[8, "ويكون الغضب والسخط للمخاصمين الذين يرفضون الطاعة للحق ولكنهم يخضعون للإثم."]]}, {"l": "Rom 6:17", "n": "", "vs": [[17, "إنما الشكر لله، لأنكم كنتم عبيدا للخطيئة ولكن أطعتم من القلب صيغة التعليم الذي وضعتم في عهدته."]]}, {"l": "1Co 16:22", "n": "", "vs": [[22, "إن كان أحد لا يحب الرب فليكن «أناثيما» (أي ملعونا)!"]]}, {"l": نحوا ولكن من غير مسكر،"], [10, "لأن الرب قد سكب عليكم روح سبات عميق، فأغلق عيون أنبيائكم وغطى رؤوس رائييكم."], [11, "وصارت لكم هذه الرؤيا جميعها ككلمات كتاب مختوم، حين يناولونه لمن يتقن القراءة قائلين: اقرأ هذا، يجيب: لا أستطيع لأنه مختوم."], [12, "وعندما يناولونه لمن يجهل القراءة قائلين: اقرأ هذا، يجيب: لا أستطيع القراءة."], [13, "لذلك يقول الرب: لأن هذا الشعب يقترب مني بفمه ويكرمني بشفتيه، بينما قلبه بعيد عنى. وما مخافتهم مني سوى تقليد تلقنوه من الناس."], [14, "لذلك سأنتقم من هؤلاء المنافقين، فتبيد حكمة حكمائه وتتلاشى فطنة فهمائه."]]}, {"l": "Joh 12:39-43", "n": "", "vs": [[39, "فلم يستطيعوا أن يؤمنوا، لأن إشعياء قال أيضا:"], [40, "«أعمى عيونهم وقسى قلوبهم، لئلا يبصروا بعيونهم ويفهموا بقلوبهم، ويتوبوا فأشفيهم»."], [41, "وقد قال إشعياء هذا عندما رأى مجد الرب فتحدث عنه."], [42, "ومع ذلك فإن كثيرين من الرؤساء آمنوا بيسوع، دون أن يجاهروا بإيمانهم، مخافة أن يحكم عليهم بالطرد من المجمع،"], [43, "مفضلين المجد الآتي من الناس على المجد الآتي من الله."]]}, {"l": "Rom 1:21-25", "n": "", "vs": [[21, "فمع أنهم عرفوا الله ، لم يمجدوه باعتباره الله ، ولا شكروه، بل انحطوا بتفكيرهم إلى الحماقة وصار قلبهم لغباوته مظلما."], [22, "وفيما يدعون أنهم حكماء، صاروا جهالا،"], [23, "واستبدلوا بمجد الله الخالد تماثيل لصور الإنسان الفاني والطيور وذوات الأربع والزواحف."], [24, "لذلك أسلمهم الله ، في شهوات قلوبهم، إلى النجاسة، ليهينوا أجسادهم فيما بينهم."], [25, "إذ قد استبدلوا بحق الله ما هو باطل، فاتقوا المخلوق وعبدوه بدل الخالق، المبارك إلى الأبد. آمين!"]]}, {"l": "Rom 1:28", "n": "", "vs": [[28, "وبما أنهم لم يتخيروا إبقاء الله ضمن معرفتهم، أسلمهم الله إلى ذهن عاطل عن التمييز دفعهم إلى ممارسة الأمور غير اللائقة."]]}], "kwAr": "ولهذا السبب", "noteAr": ""}, {"kw": "God", "raw": "1Ki_22:18-22; 2Ch_18:18-22; Isa_6:9, Isa_6:10; Eze_14:9", "note": "", "refs": [{"l": "1Ki 22:18-22", "n": "", "vs": [[18, "فقال ملك إسرائيل ليهوشافاط: «ألم أقل لك إنه لا يتنبأ علي بغير الشر؟»"], [19, "فأجاب ميخا: «إذا فاسمع كلام الرب: قد شاهدت الرب جالسا على كرسيه وكل أجناد السماء ماثلة عن يمينه وعن يساره."], [20, "فسأل الرب: من يغري أخآب ليخرج للحرب ويموت في راموت جلعاد؟ فأجاب كل منهم بشيء."], [21, "ثم تقدم روح الضلال وقال: أنا أغويه. فسأله الرب: بماذا؟"], [22, "فأجاب: أخرج، وأصبح روح ضلال في أفواه جميع أنبيائه. فقال الرب: إنك قادر على إغوائه وتفلح في ذلك، فامض ونفذ هذا الأمر."]]}, {"l": "2Ch 18:18-22", "n": "", "vs": [[18, "فأجاب ميخا: «إذا فاسمع كلام الرب. قد شاهدت الرب جالسا على كرسيه، وكل أجناد السماء وقوف عن يمينه وعن يساره."], [19, "فسأل الرب: من يغوي أخآب ليخرج إلى الحرب ويموت في راموت جلعاد؟ فأجاب كل منهم بشيء."], [20, "ثم برز روح ووقف أمام الرب وقال: أنا أغويه. فسأله الرب: بماذا؟"], [21, "فأجاب: أخرج وأصبح روح ضلال في أفواه جميع أنبيائه. فقال الرب: إنك قادر على إغوائه وتفلح في ذلك، فامض ونفذ الأمر."], [22, "وها الرب قد جعل الآن روح ضلال في أفواه جميع أنبيائك هؤلاء، وقد قضى عليك بالشر»."]]}, {"l": "Isa 6:9", "n": "", "vs": [[9, "فقال: «امض وقل لهذا الشعب: اسمعوا سمعا ولكن لا تفهموا. انظروا نظرا و لكن لا تدركوا."]]}, {"l": "Isa 6:10", "n": "", "vs": [[10, "قس قلب هذا الشعب، وثقل أذنيه وأغمض عينيه لئلا يرى بعينيه ويسمع بأذنيه ويفهم بقلبه، فيرجع عن غيه ويبرأ»."]]}, {"l": "Eze 14:9", "n": "", "vs": [[9, "فإذا ضل النبي ونطق بنبوءة باطلة، فإني أنا الرب قد أغويت ذلك النبي، لأنه تصرف من نفسه. فأعاقبه وأبيده من بين شعبي إسرائيل."]]}], "kwAr": "سيرسل الله إليهم طاقة الضلال", "noteAr": ""}, {"kw": "that", "raw": "Isa_44:20, Isa_66:4; Jer_27:10; Eze_21:29; Mat_24:5, Mat_24:11; 1Ti_4:1", "note": "", "refs": [{"l": "Isa 44:20", "n": "", "vs": [[20, "لكأنه يأكل الرماد! يجري وراء سراب ويعجز عن إنقاذ نفسه أو الاعتراف أن الصنم الذي يمسكه بيده هو محض ضلال!"]]}, {"l": "Isa 66:4", "n": "", "vs": [[4, "لهذا أنا أيضا أختار بلاياهم لهم وأوقع بهم المخاوف، لأني عندما دعوت لم يستجيبوا، وحين تكلمت لم يصغوا، إنما ارتكبوا الشر في عيني واختاروا ما لا أسر به."]]}, {"l": "Jer 27:10", "n": "", "vs": [[10, "لأنهم إنما يتنبأون لكم بالباطل ليبعدوكم عن أرضكم ولأجليكم عنها فتهلكوا"]]}, {"l": "Eze 21:29", "n": "", "vs": [[29, "فبينما يرون لك رؤى باطلة، وينطقون لك بعرافة كاذبة يطر حك (السيف) كي تلقى حتفك فوق ج noteAr": ""}, {"kw": "but", "raw": "Psa_11:5, Psa_50:16-21, Psa_52:3, Psa_52:4; Hos_7:3; Mic_3:2; Mar_14:11; Joh_3:19-21; Rom_1:32, Rom_2:8, Rom_8:7, Rom_8:8, Rom_12:9; 2Pe_2:13-15; 3Jo_1:11", "note": "", "refs": [{"l": "Psa 11:5", "n": "", "vs": [[5, "يمتحن الرب الصديق، ولكن نفسه تمقت الشرير ومحب الظلم."]]}, {"l": "Psa 50:16-21", "n": "", "vs": [[16, "وقال الله للشرير: «بأي حق تحدث بأحكامي، ولماذا تتكلم عن عهدي،"], [17, "وأنت تمقت التأديب ولا تكترث لكلامي؟"], [18, "ترى سارقا فتوافقه، ومع الزناة نصيبك."], [19, "أطلقت فمك بالشر ولسانك يخترع غشا."], [20, "تجلس تشهر بأخيك، وعلى ابن أمك تفتري."], [21, "هذه كلها فعلت وأنا سكت، فظننت أني مثلك. غير أني أوبخك وأصف إثمك أمام عينيك."]]}, {"l": "Psa 52:3", "n": "", "vs": [[3, "أحببت الشر أكثر من الخير، والكذب أكثر من الصدق."]]}, {"l": "Psa 52:4", "n": "", "vs": [[4, "أحببت كل كلام مهلك أيها اللسان المنافق."]]}, {"l": "Hos 7:3", "n": "", "vs": [[3, "بشرهم يبهجون الملك، وبخيانتهم الرؤساء."]]}, {"l": "Mic 3:2", "n": "", "vs": [[2, "أنتم يامن تبغضون الخير وتحبون الشر، وتسلخون جلود شعبي وتجردون لحومهم عن عظامهم."]]}, {"l": "Mar 14:11", "n": "", "vs": [[11, "فلما سمعوا بذلك، فرحوا، ووعدوه أن يعطوه مالا. فأخذ يتحين تسليمه في فرصة مناسبة."]]}, {"l": "Joh 3:19-21", "n": "", "vs": [[19, "وهذا هو الحكم: إن النور قد جاء إلى العالم، ولكن الناس أحبوا الظلمة أكثر من النور، لأن أعمالهم كانت شريرة."], [20, "فكل من يعمل الشر يبغض النور، ولا يأتي إليه مخافة أن تفضح أعماله."], [21, "وأما الذي يسلك في الحق فيأتي إلى النور لتظهر أعماله ويتبين أنها عملت بقوة الله»."]]}, {"l": "Rom 1:32", "n": "", "vs": [[32, "إنهم يعلمون حكم الله العادل: أن الذين يفعلون هذه الأمور يستوجبون الموت؛ ومع ذلك، لا يمارسونها وحسب، بل يسرون بفاعليها."]]}, {"l": "Rom 2:8", "n": "", "vs": [[8, "ويكون الغضب والسخط للمخاصمين الذين يرفضون الطاعة للحق ولكنهم يخضعون للإثم."]]}, {"l": "Rom 8:7", "n": "", "vs": [[7, "لأن اهتمام الجسد هو عداوة لله، إذ إنه لا يخضع لناموس الله، بل لا يستطيع ذلك."]]}, {"l": "Rom 8:8", "n": "", "vs": [[8, "فالذين هم تحت سلطة الجسد لا يستطيعون أن يرضوا الله ."]]}, {"l": "Rom 12:9", "n": "", "vs": [[9, "ولتكن المحبة بلا رياء. انفروا من الشر، والتصقوا بالخير."]]}, {"l": "2Pe 2:13-15", "n": "", "vs": [[13, "وبذلك ينالون أجرة إثمهم! إنهم يحسبون الانغماس في اللذات طول النهار بهجة عظيمة. فهم أوساخ وعيوب: يتلذذون بالنجاسة ويحاولون خداعكم، فيشتركون معكم في الولائم."], [14, "عيونهم لا تنظر إلا نظرات الزنى، ولا تشبع من الخطيئة. وكم من نفوس ضعيفة تقع في فخاخهم! أما قلوبهم، فقد تدربت على الشهوة والطمع. إنهم حقا أبناء اللعنة!"], [15, "وإذ خرجوا عن الطريق المستقيم، ضلوا. فهم سائرون في طريق بلعام بن بعور، الذي أحب الحصول على المال أجرة لإثمه."]]}, {"l": "3Jo 1:11", "n": "", "vs": [[11, "أيها الحبيب، لا تقتد بما هو شر، بل بما هو خير. فإن من يفعل الخير، يكون من الله. ومن يفعل الشر، يبين أنه لم يتعرف بالله قط."]]}], "kwAr": "بل سرهم الإثم", "noteAr": ""}], "arS": [["فتقع الدينونة", ["G2919"]], [" على ", []], ["جميع", ["G3956"]], [" الذين لم ", []], ["يؤمنوا", ["G4100"]], [" ", []], ["بالحق", ["G225"]], [" بل ", []], ["سرهم", ["G2106"]], [" ", []], ["الإثم", ["G93"]], [".", []]]}, {"c": 2, "v": 13, "text": "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق.", "groups": [{"kw": "we", "raw": "2Th_1:3; Rom_1:8, Rom_6:17", "note": "", "refs": [{"l": "2Th 1:3", "n": "", "vs": [[3, "من واجبنا أن نشكر الله على الدوام لأجلكم أيها الإخوة. كما أن هذا حق: لأن إيمانكم ينمو نموا فائقا، ومحبة أحدكم للآخر تفيض بينكم جميعا."]]}, {"l": "Rom 1:8", "n": "", "vs": [[8, "بادىء بدء، أشكر إلهي بيسوع المسيح من أجلكم جميعا، لأن إيمانكم يذاع خبره في العالم كله."]]}, {"l": "Rom 6:17", "n": "", "vs": [[17, "إنما الشكر لله، لأنكم كنتم عبيدا للخطيئة ولكن أطعتم من القلب صيغة التعليم الذي وضعتم في عهدته."]]}], "kwAr": "أما نحن", "noteAr": ""}, {"kw": "beloved", "raw": "2Th_2:16; Deu_33:12; 2Sa_12:25 *marg. Jer_31:3; Eze_16:8; Dan_9:23, Dan_10:11, Dan_10:19; Rom_1:7; Col_3:12; 1Jo_4:10,1Jo_4:19", "note": "", "refs": [{"l": "2Th 2:16", "n": "", "vs": [[16, "وليت ربنا يسوع المسيح نفسه، والله أبانا، الذي أحبنا ووهبنا بنعمته راحة أبدية ورجاء صالحا،"]]}, {"l": "Deu 33:12", "n": "", "vs": [[12, "وقال عن سبط بنيامين: «إنه حبيب الرب، يسكن لديه آمنا، يصونه طول النهار، وبين منكبيه يسكن مطمئنا»."]]}, {"l": "2Sa 12:25", "n": "*marg.", "vs": [[25, "وأمر النبي ناثان أن يسمى الولد يديديا (ومعناه محبوب الرب) لأن الرب أحبه."]]}, {"l": "Jer 31:3", "n": "", "vs": [[3, "ظهر لي الرب قائلا: «أحببتكم حبا أبديا، لذلك اجتذبتكم إلي برحمة."]]}, {"l": "Eze 16:8", "n": "", "vs": [[8, "فمررت بك ورأيتك وإذا بك قد بلغت سن الحب، فبسطت عليك أطراف ثوبي، وسترت عورتك وحلفت لك وأبرمت معك عهدا، فصرت لي، يقول السيد الرب."]]}, {"l": "Dan 9:23", "n": "", "vs": [[23, "فمنذ أن شرعت في تضرعاتك صدر إلي الأمر لأجيء إليك وأطلعك على ما تبغي، لأنك محبوب جدا، لهذا تأمل ما أقول وافهم الرؤيا."]]}, {"l": "Dan 10:11", "n": "", "vs": [[11, "وقال لي: «يادانيآل، أيها الرجل المحبوب، افهم الكلام الذي أخاطبك به، وقف على رجليك لأنني قد أرسلت إليك». وعندما قال لي هذا الكلام نهضت مرتعدا."]]}, {"l": "Dan 10:19", "n": "", "vs": [[19, "وقال: «لا تخف أيها الرجل المحبوب؛ سلام لك. تقو وتشجع». وحالما كلمني دبت في القوة وقلت: «ليتكلم سيدي لأنك شددتني»."]]}, {"l": "Rom 1:7", "n": "", "vs": [[7, "إلى جميع من هم في روما من أحباء الله القديسين المدعوين. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}, {"l": "Col 3:12", "n": "", "vs": [[12, "فباعتباركم جماعة مختارة من الله، قديسين محبوبين، البسوا دائما عواطف الحنان واللطف والتواضع والوداعة وطول البال،"]]}, {"l": "1Jo 4:10", "n": "", "vs": [[10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."]]}, {"l": "1Jo 4:19", "n": "", "vs": [[19, "ونحن نحب، لأن الله أحبنا أولا."]]}], "kwAr": "الذين يحبهم الرب", "noteAr": ""}, {"kw": "from", "raw": "Gen_1:1; Pro_8:23; Isa_46:10; Joh_1:1, Joh_8:44; Heb_1:10", "note": "", "refs": [{"l": "Gen 1:1", "n": "", "vs": [[1, "في البدء خلق الله السماوات والأرض،"]]}, {"l": "Pro 8:23", "n": "", "vs": [[23, "منذ الأزل أنا هو، منذ البدء قبل أن توجد الأرض."]]}, {"l": "Isa 46:10", "n": "", "vs": [[10, "وقد أنبأت بالنهاية منذ البدء، وأخبرت من القدم بأمور لم تكن قد حدثت بعد، قائلا: مقاصدي لابد أن تتم، ومشيئتي لابد أن تتحقق."]]}, {"l": "Joh 1:1", "n": "", "vs": [[1, "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."]]}, {"l": "Joh 8:44", "n": "", "vs": [[44, "إنكم أولاد أبيكم إبليس، وترغبون أن تعملوا شهوات أبيكم. فهو من البدء كان قاتلا للناس، ولم يثبت في الحق لأنه خال من الحق! وعندما ينطق بالكذب فهو ينضح بما فيه، لأنه كذاب وأبو الكذب!"]]}, {"l": "Heb 1:10", "n": "", "vs": [[10, "كما يخاطب الابن أيضا بقوله: «أنت، يارب، وضعت أساس الأرض في البداية. والسماوات هي صنع يديك."]]}], "kwAr": "من البدء", "noteAr": ""}, {"kw": "chosen", "raw": "Rom_8:33, Rom_9:11; Eph_1:4, Eph_1:5; 1Th_1:4; 2Ti_1:9; 1Pe_1:2", "note": "", "refs": [{"l": "Rom 8:33", "n": "", "vs": [[33, "ومن سيتهم مختاري الله؟ إن الله هو الذي يبرر،"]]}, {"l": "Rom 9:11", "n": "", "vs": [[11, "ولم يكن الولدان قد ولدا بعد ولا فعلا خيرا أو شرا، وذلك كي يبقى قصد الله من جهة الاختيار"]]}, {"l": "Eph 1:4", "n": "", "vs": [[4, "كما كان قد اختارنا فيه قبل تأسيس العالم، لنكون قديسين بلا لوم أمامه."]]}, {"l": "Eph 1:5", "n": "", "vs": [[5, "إذ سبق فعيننا في المحبة ليتخذنا أبناء له بيسوع المسيح. وذلك موافق للقصد الذي سرت به مشيئته،"]]}, {"l": "1Th 1:4", "n": "", "vs": [[4, "ونحن عالمون، أيها الإخوة أحباء الله، حقيقة اختياركم من قبل الله:"]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،"]]}, {"l": "1Pe 1:2", "n": "", "vs": [[2, "بحسب علمه السابق ثم قدسهم بالروح ليطيعوا يسوع المسيح ويطهروا برش دمه عليهم."]]}], "kwAr": "اختاركم", "noteAr": ""}, {"kw": "through", "raw": "2Th_2:10,2Th_2:12; Luk_1:75; 1Pe_1:2-5", "note": "", "refs": [{"l": "2Th 2:10", "n": "", "vs": [[10, "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا."]]}, {"l": "2Th 2:12", "n": "", "vs": [[12, "فتقع الدينونة على جميع الذين لم يؤمنوا بالحق بل سرهم الإثم."]]}, {"l": "Luk 1:75", "n": "", "vs": [[75, "بقداسة وبر أمامه، طوال حياتنا."]]}, {"l": "1Pe 1:2-5", "n": "", "vs": [[2, "بحسب علمه السابق ثم قدسهم بالروح ليطيعوا يسوع المسيح ويطهروا برش دمه عليهم."], [3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"], [4, "وإرثا لا يفنى ولا يفسد ولا يزول،"], [5, "محفوظا لكم في السماوات. فإنكم محفوظون بقدرة الله العاملة من خلال إيمانكم، إلى أن تفوزوا بالخلاص النهائي المعد لكم والذي سوف يتجلى في الزمان الأخير."]]}], "kwAr": "بتقديس الروح لكم", "noteAr": ""}, {"kw": "belief", "raw": "Joh_8:45, Joh_8:46, Joh_14:6; Act_13:48, Act_15:9; Gal_3:1; Eph_2:8; Col_1:5; 2Ti_2:15; 2Ti_3:15; Jam_1:18", "note": "", "refs": [{"l": "Joh 8:45", "n": "", "vs": [[45, "أما أنا فلأني أقول الحق، لستم تصدقونني."]]}, {"l": "Joh 8:46", "n": "", "vs": [[46, "من منكم يثبت علي خطيئة؟ فما دمت أقول الحق، فلماذا لا تصدقونني؟"]]}, {"l": "Joh 14:6", "n": "", "vs": [[6, "فأجابه يسوع: «أنا هو الطريق والحق والحياة. لا يأتي أحد إلى الآب إلا بي."]]}, {"l": "Act 13:48", "n": "", "vs": [[48, "فلما سمع غير اليهود ذلك، فرحوا جدا، ومجدوا كلمة الرب. وآمن جميع من أعدهم الله للحياة الأبدية."]]}, {"l": "Act 15:9", "n": "", "vs": [[9, "فهو لم يفرق بيننا وبينهم في شيء، إذ طهر بالإيمان قلوبهم."]]}, {"l": "Gal 3:1", "n": "", "vs": [[1, "ياأهل غلاطية الأغبياء! من سحر عقولكم، أنتم الذين قد رسم أمام أعينكم يسوع المسيح وهو مصلوب؟"]]}, {"l": "Eph 2:8", "n": "", "vs": [[8, "فإنكم بالنعمة مخلصون، بالإيمان، وهذا ليس منكم. إنه هبة من الله،"]]}, {"l": "Col 1:5", "n": "", "vs": [[5, "بسبب الرجاء المحفوظ لكم في السماوات، الرجاء الذي سمعتم به سابقا في كلمة الحق التي في الإنجيل"]]}, {"l": "2Ti 2:15", "n": "", "vs": [[15, "اجتهد أن تقدم نفسك لله فائزا في الامتحان، عاملا ليس عليه ما يدعو للخجل، مفصلا كلمة الحق باستقامة."]]}, {"l": "2Ti 3:15", "n": "", "vs": [[15, "وتعلم أنك منذ حداثة سنك تعرف الكتب المقدسة، وهي القادرة أن تجعلك حكيما لبلوغ الخلاص عن طريق الإيمان في المسيح يسوع."]] مانكم، إلى أن تفوزوا بالخلاص النهائي المعد لكم والذي سوف يتجلى في الزمان الأخير."]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}, {"l": "Rev 3:21", "n": "", "vs": [[21, "وكل من ينتصر سأجلسه معي على عرشي، كما انتصرت أنا أيضا فجلست مع أبي على عرشه؛"]]}, {"l": "Rev 21:23", "n": "", "vs": [[23, "ولم تكن المدينة في حاجة إلى نور الشمس أو القمر، لأن مجد الله ينيرها، والحمل مصباحها."]]}, {"l": "Rev 22:3-5", "n": "", "vs": [[3, "لن تكون فيما بعد لعنة أبدا. لأن عرش الله والحمل قائم في المدينة، حيث يخدمه عبيده"], [4, "ويرون وجهه، وقد كتب اسمه على جباههم."], [5, "ولن يكون هنالك ليل، فلا يحتاجون إلى نور مصباح أو شمس، لأن الرب الإله ينير عليهم، وهم سيملكون إلى أبد الآبدين!"]]}], "kwAr": "لنوال مجد ربنا", "noteAr": ""}], "arS": [["فإلى هذا الأمر قد ", []], ["دعاكم", ["G2564"]], [" ", []], ["ببشارتنا", ["G2098", "G2257"]], [" لكم، ", []], ["لنوال", ["G4047"]], [" ", []], ["مجد", ["G1391"]], [" ", []], ["ربنا", ["G2962", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 2, "v": 15, "text": "فاثبتوا إذن، أيها الإخوة، وتمسكوا بالتعاليم التي تلقيتم منا، سواء كان بالكلام أم برسالتنا.", "groups": [{"kw": "stand", "raw": "1Co_15:58, 1Co_16:13; Phi_4:1", "note": "", "refs": [{"l": "1Co 15:58", "n": "", "vs": [[58, "إذن، ياإخوتي الأحباء، كونوا راسخين غير متزحزحين، كثيري الاجتهاد في عمل الرب دائما، عالمين أن جهدكم في الرب ليس عبثا!"]]}, {"l": "1Co 16:13", "n": "", "vs": [[13, "كونوا متيقظين حذرين. اثبتوا في الإيمان. كونوا رجالا. كونوا أقوياء."]]}, {"l": "Phi 4:1", "n": "", "vs": [[1, "إذن، ياإخوتي الأحباء والمشتاق إليهم، يافرحي وإكليلي، هكذا اثبتوا في الرب أيها الأحباء."]]}], "kwAr": "فاثبتوا", "noteAr": ""}, {"kw": "hold", "raw": "2Th_3:6; 1Co_11:2", "note": "", "refs": [{"l": "2Th 3:6", "n": "", "vs": [[6, "ثم نوصيكم، أيها الإخوة، باسم ربنا يسوع المسيح، أن تعتزلوا عن كل أخ يسلك سلوكا فوضويا، لا يوافق التعليم الذي تلقيتم منا."]]}, {"l": "1Co 11:2", "n": "", "vs": [[2, "إني أمدحكم لأنكم تذكرونني في كل أمر وتحافظون على التعاليم كما سلمتها إليكم."]]}], "kwAr": "وتمسكوا", "noteAr": ""}, {"kw": "the traditions", "raw": "Rom_16:17; Jud_1:3 *Gr.", "note": "", "refs": [{"l": "Rom 16:17", "n": "", "vs": [[17, "ولكن، أتوسل إليكم، أيها الإخوة، أن تنتبهوا إلى مثيري الانقسامات والعثرات، خلافا للتعليم الذي تعلمتم، وأن تبتعدوا عنهم."]]}, {"l": "Jud 1:3", "n": "*Gr.", "vs": [[3, "أيها الأحباء، كنت قد نويت أن أكتب إليكم في موضوع الخلاص الذي نشترك فيه جميعا. ولكن، أراني الآن مضطرا لأن أكتب لأشجعكم على الجهاد في سبيل الإيمان الذي سلم مرة واحدة للقديسين."]]}], "kwAr": "بالتعاليم التي تلقيتم منا", "noteAr": ""}, {"kw": "whether", "raw": "2Th_2:2, 2Th_3:14", "note": "", "refs": [{"l": "2Th 2:2", "n": "", "vs": [[2, "ألا تضطرب أفكاركم سريعا ولا تقلقوا، لا من إيحاء ولا من خبر ولا من رسالة منسوبة إلينا زورا، يزعم فيها أن يوم الرب قد حل فعلا."]]}, {"l": "2Th 3:14", "n": "", "vs": [[14, "وإن كان أحد لا يطيع كلمتنا في هذه الرسالة، فميزوه ولا تتعاملوا معه، لتدفعوه إلى الخجل."]]}], "kwAr": "سواء كان بالكلام أم برسالتنا", "noteAr": ""}], "arS": [["فاثبتوا", ["G4739"]], [" ", []], ["إذن", ["G686", "G3767"]], ["، أيها ", []], ["الإخوة", ["G80"]], ["، ", []], ["وتمسكوا", ["G2902"]], [" ", []], ["بالتعاليم", ["G3862"]], [" التي ", []], ["تلقيتم", ["G1321"]], [" منا، سواء كان ", []], ["بالكلام", ["G3056"]], [" أم ", []], ["برسالتنا", ["G1992", "G2257"]], [".", []]]}, {"c": 2, "v": 16, "text": "وليت ربنا يسوع المسيح نفسه، والله أبانا، الذي أحبنا ووهبنا بنعمته راحة أبدية ورجاء صالحا،", "groups": [{"kw": "our Lord", "raw": "2Th_1:1, 2Th_1:2; Rom_1:7; 1Th_3:11", "note": "", "refs": [{"l": "2Th 1:1", "n": "", "vs": [[1, "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."]]}, {"l": "2Th 1:2", "n": "", "vs": [[2, "لتكن لكم النعمة والسلام من الله الآب والرب يسوع المسيح."]]}, {"l": "Rom 1:7", "n": "", "vs": [[7, "إلى جميع من هم في روما من أحباء الله القديسين المدعوين. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}, {"l": "1Th 3:11", "n": "", "vs": [[11, "ليت الله أبانا نفسه، وربنا يسوع المسيح، يسهل أمامنا الطريق إليكم."]]}], "kwAr": "ربنا يسوع المسيح نفسه", "noteAr": ""}, {"kw": "which", "raw": "2Th_2:13; Joh_3:16, Joh_13:1, Joh_15:9, Joh_15:13; Rom_5:8; Eph_2:4, Eph_2:5, Eph_5:2, Eph_5:25; Tit_3:4-7; 1Jo_3:16, 1Jo_4:9, 1Jo_4:10; Rev_1:5, Rev_3:9", "note": "", "refs": [{"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "Joh 3:16", "n": "", "vs": [[16, "لأنه هكذا أحب الله العالم حتى بذل ابنه الوحيد، لكي لا يهلك كل من يؤمن به، بل تكون له الحياة الأبدية."]]}, {"l": "Joh 13:1", "n": "", "vs": [[1, "وقبيل عيد الفصح، ويسوع عالم أن ساعته قد حانت ليرحل من هذا العالم إلى الآب، فإذ كان قد أحب خاصته الذين في العالم، أحبهم الآن أقصى المحبة:"]]}, {"l": "Joh 15:9", "n": "", "vs": [[9, "مثلما أحبني الآب، أحببتكم أنا، فاثبتوا في محبتي."]]}, {"l": "Joh 15:13", "n": "", "vs": [[13, "ليس لأحد محبة أعظم من هذه: أن يبذل أحد حياته فدى أحبائه."]]}, {"l": "Rom 5:8", "n": "", "vs": [[8, "ولكن الله أثبت لنا محبته، إذ ونحن مازلنا خاطئين مات المسيح عوضا عنا."]]}, {"l": "Eph 2:4", "n": "", "vs": [[4, "أما الله ، وهو غني في الرحمة، فبسبب محبته العظيمة التي أحبنا بها،"]]}, {"l": "Eph 2:5", "n": "", "vs": [[5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "Eph 5:25", "n": "", "vs": [[25, "أيها الأزواج، أحبوا زوجاتكم مثلما أحب المسيح الكنيسة وبذل نفسه لأجلها،"]]}, {"l": "Tit 3:4-7", "n": "", "vs": [[4, "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،"], [5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"], [6, "الذي سكبه علينا بغنى بيسوع المسيح مخلصنا."], [7, "حتى إذا تبررنا بنعمته، نصير ورثة، وفقا لرجائنا بالحياة الأبدية."]]}, {"l": "1Jo 3:16", "n": "", "vs": [[16, "ومقياس المحبة هو العمل الذي قام به المسيح إذ بذل حياته لأجلنا. فعلينا نحن أيضا أن نبذل حياتنا لأجل إخوتنا."]]}, {"l": "1Jo 4:9", "n": "", "vs": [[9, "وقد أظهر الله محبته لنا إذ أرسل ابنه الأوحد إلى العالم لكي نحيا به."]]}, {"l": "1Jo 4:10", "n": "", "vs": [[10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."]]}, {"l": "Rev 1:5", "n": "", "vs": [[5, "ومن يسوع المسيح الشاهد الأمين، بكر القائمين من بين الأموات، ملك ملوك الأرض، ذاك الذي بدافع محبته لنا مات لأجلنا فغسلنا بدمه من خطايانا،"]]}, {"l": "Rev 3:9", "n": "", "vs": [[9, "أما الذين هم من مجمع الشيطان، ويدعون كذبا أنهم يهود، فسأجبرهم على أن يسجدوا عند قدميك، ويعترفوا بأني أحببتك."]]}], "kwAr": "الذي أحبنا", "noteAr": ""}, {"kw": "everlasting", "raw": "Psa_103:17; Isa_35:10, Isa_51:11, Isa_60:19, Isa_60:20, Isa_61:7; Luk_16:25; Joh_4:14; Joh_14:16-18, Joh_16:22; 2Co_4:17, 2Co_4:18; Heb_6:18; 1Pe_1:5-8; Rev_7:16, Rev_7:17; Rev_22:5", "note": "", "refs": [{"l": "Psa 103:17", "n": "", "vs": [[17, "أما رحمة الرب فهي من الأزل وإلى الأبد على متقيه، وعدله يمتد إلى بني البنين،"]]}, {"l": "Isa 35:10", "n": "", "vs": [[10, "ويرجع إليها مفديو الرب ويقبلون إلى صهيون مترنمين يكلل رؤوسهم فرح أبدي، وتغمرهم الغبطة والسرور، ويهرب الحزن والأنين."]]}, {"l": "Isa 51:11", "n": "", "vs": [[11, "سيرجع الذين افتداهم الرب ويأتون إلى صهيون بترنم، يكلل رؤوسهم فرح أبدي، فتطغى عليهم بهجة وغبطة، أما الحزن والتنهد فيهربان بعيدا."]]}, {"l": "Isa 60:19", "n": "", "vs": [[19, "ولا تعود الشمس نورا لك في النهار ولا يشرق ضوء القمر عليك لأن الرب يكون نورك الأبدي، وإلهك يكون مجدك."]]}, {"l": "Isa 60:20", "n": "", "vs": [[20, "ولا تغرب شمسك من بعد، ولا يتضاءل قمرك، لأن الرب يكون نورك الأبدي، وتنقضي أيام مناحتك."]]}, {"l": "Isa 61:7", "n": "", "vs": [[7, "وعوضا عن عاركم تنالون ضعفين من الميراث، وعوضا عن الهوان تبتهجون بنصيبكم، لهذا تملكون في أرضكم نصيبين، ويكون فرحكم أبديا."]]}, {"l": "Luk 16:25", "n": "", "vs": [[25, "ولكن إبراهيم قال: يابني، تذكر أنك نلت خيراتك كاملة في أثناء حياتك، ولعازر نال البلايا. ولكنه الآن يتعزى هنا، وأنت هناك تتعذب."]]}, {"l": "Joh 4:14", "n": "", "vs": [[14, "ولكن الذي يشرب من الماء الذي أعطيه أنا، لن يعطش بعد ذلك أبدا، بل إن ما أعطيه من ماء يصبح في داخله نبعا يفيض فيعطي حياة أبدية»."]]}, {"l": "Joh 14:16-18", "n": "", "vs": [[16, "وسوف أطلب من الآب أن يعطيكم معينا آخر يبقى معكم إلى الأبد،"], [17, "وهو روح الحق، الذي لا يقدر العالم أن يتقبله لأنه لا يراه ولا يعرفه، وأما أنتم فتعرفونه لأنه في وسطكم، وسيكون في داخلكم."], [18, "لن أترككم يتامى، بل سأعود إليكم."]]}, {"l": "Joh 16:22", "n": "", "vs": [[22, "فكذلك أنتم، تحزنون الآن؛ ولكن عندما أعود للقائكم، تبتهج قلوبكم، ولا أحد يسلبكم فرحكم."]]}, {"l": "2Co 4:17", "n": "", "vs": [[17, "ذلك لأن ما يضايقنا الآن من صعوبات بسيطة عابرة، ينتج لنا بمقدار لا يحد وزنة أبدية من المجد،"]]}, {"l": "2Co 4:18", "n": "", "vs": [[18, "إذ نرفع أنظارنا عن الأمور المنظورة ونثبتها على الأمور غير المنظورة. فإن الأمور المنظورة إنما هي إلى حين؛ وأما غير المنظورة فهي أبدية."]]}, {"l": "Heb 6:18", "n": "", "vs": [[18, "فاستنادا إلى وعد الله وقسمه، وهما أمران ثابتان لا يتغيران ويستحيل أن يكذب الله فيهما، نحصل على تشجيع قوي، بعدما التجأنا إلى التمسك بالرجاء الموضوع أمامنا."]]}, {"l": "1Pe 1:5-8", "n": "", "vs": [[5, "محفوظا لكم في السماوات. فإنكم محفوظون بقدرة الله العاملة من خلال إيمانكم، إلى أن تفوزوا بالخلاص النهائي المعد لكم والذي سوف يتجلى في الزمان الأخير."], [6, "وهذا يدعوكم إلى الابتهاج، مع أنه لابد لكم الآن من الحزن فترة قصيرة تحت وطأة التجارب المتنوعة!"], [7, "إلا أن غاية هذه التجارب هي اختبار حقيقة إيمانكم. فكما تختبر النار الذهب وتنقيه، تختبر التجارب حقيقة إيمانكم، وهو أثمن جدا من الذهب الفاني. وهكذا، يكون إيمانكم مدعاة مدح وإكرام وتمجيد لكم، عندما يعود يسوع المسيح ظاهرا بمجده."], [8, "أنتم لم تروا المسيح، ولكنكم تحبونه. ومع أنكم لا ترونه الآن، فأنتم تؤمنون به وتبتهجون بفرح مجيد يفوق الوصف."]]}, {"l": "Rev 7:16", "n": "", "vs": [[16, "فلن يجوعوا ولن يعطشوا، ولن تضربهم الشمس ولا أي حر،"]]}, {"l": "Rev 7:17", "n": "", "vs": [[17, "لأن الحمل الذي في وسط العرش يرعاهم ويقودهم إلى ينابيع ماء الحياة، ويمسح الله كل دمعة من عيونهم»."]]}, {"l": "Rev 22:5", "n": "", "vs": [[5, "ولن يكون هنالك ليل، فلا يحتاجون إلى نور مصباح أو شمس، لأن الرب الإله ينير عليهم، وهم سيملكون إلى أبد الآبدين!"]]}], "kwAr": "راحة أبدية", "noteAr": ""}, {"kw": "good", "raw": "Rom_5:2-5, Rom_8:24, Rom_8:25; Col_1:5, Col_1:23; 1Th_1:3; Tit_1:2, Tit_2:13; Heb_6:11; Heb_6:12, Heb_6:19, Heb_7:19; 1Pe_1:3-5; 1Jo_3:2, 1Jo_3:3", "note": "", "refs": [{"l": "Rom 5:2-5", "n": "", "vs": [[2, "وبه أيضا تم لنا الدخول بالإيمان إلى هذه النعمة التي نقيم فيها الآن؛ ونحن نفتخر برجائنا في التمتع بمجد الله."], [3, "ليس هذا فقط، بل نفتخر أيضا في وسط الضيقات، لعلمنا أن الضيق ينتج فينا الصبر،"], [4, "والصبر يؤهلنا للفوز في الامتحان، والفوز يبعث فينا الرجاء،"], [5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."]]}, {"l": "Rom 8:24", "n": "", "vs": [[24, "فإننا قد خلصنا، إنما بالرجاء؛ ولكن الرجاء متى رأيناه لا يكون رجاء؛ فما يراه الإنسان لماذا يرجوه بعد؟"]]}, {"l": "Rom 8:25", "n": "", "vs": [[25, "ولكن، إن كنا نرجو ما لا نراه، فبالصبر نتوقعه."]]}, {"l": "Col 1:5", "n": "", "vs": [[5, "بسبب الرجاء المحفوظ لكم في السماوات، الرجاء الذي سمعتم به سابقا في كلمة الحق التي في الإنجيل"]]}, {"l": "Col 1:23", "n": "", "vs": [[23, "على أن تثبتوا فعلا في الإيمان، مؤسسين وراسخين وغير متحولين عن رجاء الإنجيل الذي سمعتموه والذي بشر به للخليقة كلها تحت السماء، وله صرت أنا بولس خادما."]]}, {"l": "1Th 1:3", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"]]}, {"l": "Tit 1:2", "n": "", "vs": [[2, "في رجاء الحياة الأبدية، التي وعد بها الله المنزه عن الكذب، من قبل أزمنة الأزل،"]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "Heb 6:11", "n": "", "vs": [[11, "وإنما نتمنى أن يظهر كل واحد منكم اجتهادا مماثلا في المحافظة حتى النهاية على الثقة الكاملة بالرجاء."]]}, {"l": "Heb 6:12", "n": "", "vs": [[12, "وذلك حتى لا تتكاسلوا، بل تقتدوا بالذين يرثون ما وعد الله به، عن طريق الإيمان والصبر."]]}, {"l": "Heb 6:19", "n": "", "vs": [[19, "هذا الرجاء هو لنا بمثابة مرساة أمينة ثابتة تشد نفوسنا إلى ما وراء الحجاب السماوي."]]}, {"l": "Heb 7:19", "n": "", "vs": [[19, "فالشريعة لم توصل الذين كانوا يعبدون الله بحسبها ولو إلى أدنى درجات الكمال. ولذلك، وضع الله أساسا جديدا للاقتراب إليه، مقدما لنا رجاء أفضل."]]}, {"l": "1Pe 1:3-5", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"], [4, "وإرثا لا يفنى ولا يفسد ولا يزول،"], [5, "محفوظا لكم في السماوات. فإنكم محفوظون بقدرة الله العاملة من خلال إيمانكم، إلى أن تفوزوا بالخلاص النهائي المعد لكم والذي سوف يتجلى في الزمان الأخير."]]}, {"l": "1Jo 3:2", "n": "", "vs": [[2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"]]}, {"l": "1Jo 3:3", "n": "", "vs": [[3, "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر."]]}], "kwAr": "ورجاء صالحا", "noteAr": ""}, {"kw": "through", "raw": "Act_15:11, Act_18:27; Rom_4:4, Rom_4:16, Rom_5:2, Rom_11:5, Rom_11:6", "note": "", "refs": [{"l": "Act 15:11", "n": "", "vs": [[11, "فنحن نؤمن بأننا نخلص، كما يخلصون هم، بنعمة الرب يسوع."]]}, {"l": "Act 18:27", "n": "", "vs": [[27, "وقرر أبلوس أن يسافر إلى بلاد أخائية فشجعه الإخوة وكتبوا إلى التلاميذ هناك أن يرحبوا به. ولما وصل إلى هناك أعان الذين كانوا قد آمنوا إعانة كبرى بما له من النعمة:"]]}, {"l": "Rom 4:4", "n": "", "vs": [[4, "إن الذي يعمل، لا تحسب له الأجرة من قبيل النعمة بل من قبيل الدين. أما الذي لا يعمل"]]}, {"l": "Rom 4:16", "n": "", "vs": [[16, "لذلك، فإن الوعد هو على أساس الإيمان ليكون بحسب النعمة، بقصد أن يكون مضمونا للنسل كله: ليس لأهل الشريعة وحدهم، بل أيضا لأهل الإيمان الذي كان لإبراهيم. فإنه أب لنا جميعا،"]]}, {"l": "Rom 5:2", "n": "", "vs": [[2, "وبه أيضا تم لنا الدخول بالإيمان إلى هذه النعمة التي نقيم فيها الآن؛ ونحن نفتخر برجائنا في التمتع بمجد الله."]]}, {"l": "Rom 11:5", "n": "", "vs": [[5, "فكذلك، في الزمان الحاضر، ماتزال بقية اختارها الله بالنعمة."]]}, {"l": "Rom 11:6", "n": "", "vs": [[6, "ولكن، بما أن ذلك قد تم بالنعمة، فليس بعد على أساس الأعمال، وإلا فليست النعمة نعمة بعد."]]}], "kwAr": "بنعمته", "noteAr": ""}], "arS": [["وليت ", []], ["ربنا", ["G2962", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [" ", []], ["نفسه", ["G846"]], ["، ", []], ["والله", ["G2316"]], [" ", []], ["أبانا", ["G3962", "G2257"]], ["، الذي ", []], ["أحبنا", ["G25", "G2248"]], [" ", []], ["ووهبنا", ["G1325"]], [" ", []], ["بنعمته", ["G5485"]], [" ", []], ["راحة", ["G3874"]], [" ", []], ["أبدية", ["G166"]], [" ", []], ["ورجاء", ["G1680"]], [" ", []], ["صالحا", ["G18"]], ["،", []]]}, {"c": 2, "v": 17, "text": "يشجع قلوبكم ويرسخكم في كل عمل صالح وقول حسن!", "groups": [{"kw": "Comfort", "raw": "2Th_2:16; Isa_51:3, Isa_51:12, Isa_57:15, Isa_61:1, Isa_61:2, Isa_66:13; Rom_15:13; 2Co_1:3-6", "note": "", "refs": [{"l": "2Th 2:16", "n": "", "vs": [[16, "وليت ربنا يسوع المسيح نفسه، والله أبانا، الذي أحبنا ووهبنا بنعمته راحة أبدية ورجاء صالحا،"]]}, {"l": "Isa 51:3", "n": "", "vs": [[3, "الرب يعزي صهيون ويعزي خرائبها، ويحول قفرها إلى عدن وصحر اءها إلى جنة رائعة، فتفيض بالفر ح والغبطة والشكر وهتاف ترنيم."]]}, {"l": "Isa 51:12", "n": "", "vs": [[12, "أنا، أنا هو معزيكم، فمن أنت حتى تخشي إنسانا فانيا أو بشرا يبيدون كالعشب؟"]]}, {"l": "Isa 57:15", "n": "", "vs": [[15, "لأنه هكذا يقول العلي السامي، المقيم في الأبد، الذي يدعى اسمه القدوس: إنني أسكن في العلى وفي الموضع المقدس، وأقيم مع المنسحق، وذوي الروح المتواضعة، لأحيي أرواح المتواضعين، وأنعش قلوب المنسحقين."]]}, {"l": "Isa 61:1", "n": "", "vs": [[1, "روح السيد الرب علي، لأن الرب مسحني لأبشر المساكين، أرسلني لأضمد جراح المنكسري القلوب، لأنادي للمسبيين بالعتق وللمأسورين بالحرية،"]]}, {"l": "Isa 61:2", "n": "", "vs": [[2, "لأعلن سنة الرب المقبولة، ويوم انتقام لإلهنا، لأعزي جميع النائحين."]]}, {"l": "Isa 66:13", "n": "", "vs": [[13, "وأعزيكم كمن تعزيه أمه، وفي أورشليم تعزون."]]}, {"l": "Rom 15:13", "n": "", "vs": [[13, "فليملأكم إله الرجاء كل فرح وسلام في إيمانكم حتى تزدادوا رجاء بقوة الروح القدس."]]}, {"l": "2Co 1:3-6", "n": "", "vs": [[3, "تبارك الله ، أبو ربنا يسوع المسيح، أبو المراحم وإله كل تعزية،"], [4, "هو الذي يشجعنا في كل ضيقة نمر بها، حتى نستطيع أن نشجع الذين يمرون بأية ضيقة، بالتشجيع الذي به يشجعنا الله ."], [5, "فكما فاضت علينا آلام المسيح، يفيض علينا أيضا التشجيع بالمسيح."], [6, "فإن كنا في ضيقة، فذلك لأجل تشجيعكم وخلاصكم؛ وإن كنا متشجعين، فذلك لأجل تشجيعكم، مما يعمل فيكم على احتمال نفس الآلام التي نتألم بها نحن أيضا."]]}], "kwAr": "يشجع قلوبكم", "noteAr": ""}, {"kw": "stablish", "raw": "2Th_3:3; Isa_62:7; Rom_1:11, Rom_16:25; 1Co_1:8; 2Co_1:21; Col_2:7; 1Th_3:2, 1Th_3:13; Heb_13:9; 1Pe_5:10; Jud_1:24", "note": "", "refs": [{"l": "2Th 3:3", "n": "", "vs": [[3, "إلا أن الرب جدير بالثقة؛ فهو سيثبتكم ويحميكم من الشر."]]}, {"l": "Isa 62:7", "n": "", "vs": [[7, "ولا تدعوه يستكين حتى يعيد تأسيس أورشليم ويجعلها مفخرة الأرض."]]}, {"l": "Rom 1:11", "n": "", "vs": [[11, "فإني أشتاق أن أراكم لأحمل إليكم موهبة روحية لتثبيتكم،"]]}, {"l": "Rom 16:25", "n": "", "vs": [[25, "والمجد للقادر أن يثبتكم، وفقا لإنجيلي وللبشارة بيسوع المسيح، ووفقا لإعلان ما كان سرا ظل مكتوما مدى الأزمنة الأزلية،"]]}, {"l": "1Co 1:8", "n": "", "vs": [[8, "وهو نفسه سيحفظكم ثابتين إلى النهاية حتى تكونوا بلا عيب في يوم ربنا يسوع المسيح."]]}, {"l": "2Co 1:21", "n": "", "vs": [[21, "ولكن الذي يرسخنا وإياكم في المسيح، والذي قد مسحنا، إنما هو الله ،"]]}, {"l": "Col 2:7", "n": "", "vs": [[7, "وأنتم متأصلون ومبنيون فيه وراسخون في الإيمان الموافق لما تعلمتم وفائضون بالشكر."]]}, {"l": "1Th 3:2", "n": "", "vs": [[2, "فبعثنا تيموثاوس، أخانا ومعاوننا في خدمة الله بنشر الإنجيل، لكي يشددكم ويشجعكم في إيمانكم،"]]}, {"l": "1Th 3:13", "n": "", "vs": [[13, "حتى تتثبت قلوبكم بغير لوم في القداسة أمام إلهنا وأبينا عندما يظهر ربنا يسوع عائدا مع جميع قديسيه."]]}, {"l": "Heb 13:9", "n": "", "vs": [[9, "فلا تنخدعوا وتتبعوا تلك التعاليم الغريبة المتنوعة ... فمن الأفضل أن يثبت القلب بالنعمة لا بنظم الأطعمة التي لم تنفع المتقيدين بها."]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}, {"l": "Jud 1:24", "n": "", "vs": [[24, "وللقادر أن يحرسكم من السقوط حتى يوصلكم إلى المثول أمامه في المجد مبتهجين ولا عيب فيكم …"]]}], "kwAr": "ويرسخكم", "noteAr": ""}, {"kw": "in", "raw": "Jam_1:21, Jam_1:22; 1Jo_3:18", "note": "", "refs": [{"l": "Jam 1:21", "n": "", "vs": [[21, "إذن، تخلصوا من كل ما في حياتكم من نجاسة وشر متزايد. وليكن قبولكم لتلك الكلمة التي غرسها الله في قلوبكم، قبولا وديعا. فهي القادرة أن تخلص نفوسكم."]]}, {"l": "Jam 1:22", "n": "", "vs": [[22, "لا تكتفوا فقط بسماعها، بل اعملوا بها، وإلا كنتم تغشون أنفسكم."]]}, {"l": "1Jo 3:18", "n": "", "vs": [[18, "أيها الأولاد الصغار، لا يجب أن تكون محبتنا مجرد ادعاء بالكلام واللسان، بل تكون محبة عملية حقة."]]}], "kwAr": "في كل عمل صالح وقول حسن", "noteAr": ""}], "arS": [["يشجع", ["G3870"]], [" ", []], ["قلوبكم", ["G2588", "G5216"]], [" ", []], ["ويرسخكم", ["G4741"]], [" في ", []], ["كل", ["G3956"]], [" ", []], ["عمل", ["G2041"]], [" ", []], ["صالح", ["G18"]], [" ", []], ["وقول", ["G3056"]], [" حسن!", []]]}, {"c": 3, "v": 1, "text": "وبعد، أيها الإخوة، صلوا لأجلنا، لتنتشر كلمة الرب بسرعة وتتمجد كما هي الحال عندكم،", "groups": [{"kw": "pray", "raw": "Mat_9:38; Luk_10:2; Rom_15:30; 2Co_1:11; Eph_6:19, Eph_6:20; Col_4:3; 1Th_5:17, 1Th_5:25; Heb_13:18, Heb_13:19", "note": "", "refs": [{"l": "Mat 9:38", "n": "", "vs": [[38, "فاطلبوا من رب الحصاد أن يرسل عمالا إلى حصاده! »"]]}, {"l": "Luk 10:2", "n": "", "vs": [[2, "وقال لهم: «إن الحصاد كثير، ولكن العمال قليلون، فتضرعوا إلى رب الحصاد أن يبعث عمالا إلى حصاده."]]}, {"l": "Rom 15:30", "n": "", "vs": [[30, "فأتوسل إليكم، أيها الإخوة، بربنا يسوع المسيح وبمحبة الروح، أن تجاهدوا معي في الصلوات 1:7; Mat_6:13; Luk_11:4; Joh_17:15; 2Ti_4:18; 2Pe_2:9; Jud_1:24", "note": "", "refs": [{"l": "Gen 48:16", "n": "", "vs": [[16, "الملاك الذي أنقذني من كل شر، يبارك الغلامين، وليدع عليهما اسمي واسما أبوي إبراهيم وإسحق، وليكثرا كثيرا في الأرض»."]]}, {"l": "1Ch 4:10", "n": "", "vs": [[10, "وتضرع يعبيص لإله إسرائيل قائلا: «ليتك تباركني وتوسع من حدود أرضي، وتعضدني، وتقيني من الشر فلا يشقيني». فاستجاب الله دعاءه."]]}, {"l": "Psa 19:13", "n": "", "vs": [[13, "ومن الكبائر أيضا احفظ عبدك، ولا تدعها تتسلط علي. عندئذ أكون كاملا وأتبرأ من ذنب عظيم."]]}, {"l": "Psa 121:7", "n": "", "vs": [[7, "يقيك الرب من كل شر. يقي نفسك."]]}, {"l": "Mat 6:13", "n": "", "vs": [[13, "ولا تدخلنا في تجربة، لكن نجنا من الشرير، لأن لك الملك والقوة والمجد إلى الأبد. آمين."]]}, {"l": "Luk 11:4", "n": "", "vs": [[4, "واغفر لنا خطايانا، لأننا نحن أيضا نغفر لكل من يذنب إلينا؛ ولا تدخلنا في تجربة لكن نجنا من الشرير! »"]]}, {"l": "Joh 17:15", "n": "", "vs": [[15, "وأنا لا أطلب أن تأخذهم من العالم، بل أن تحفظهم من الشرير."]]}, {"l": "2Ti 4:18", "n": "", "vs": [[18, "وسينجيني الرب من كل عمل شرير ويحفظني سالما لملكوته السماوي. فله المجد إلى أبد الآبدين آمين!"]]}, {"l": "2Pe 2:9", "n": "", "vs": [[9, "وهكذا نرى أن الرب يعرف أن ينقذ الأتقياء من المحنة، ويحفظ الأشرار محبوسين ليحكم عليهم بالعقاب في يوم الدينونة."]]}, {"l": "Jud 1:24", "n": "", "vs": [[24, "وللقادر أن يحرسكم من السقوط حتى يوصلكم إلى المثول أمامه في المجد مبتهجين ولا عيب فيكم …"]]}], "kwAr": "ويحميكم من الشر", "noteAr": ""}], "arS": [["إلا أن ", []], ["الرب", ["G2962"]], [" ", []], ["جدير بالثقة", ["G4103"]], ["؛ فهو ", []], ["سيثبتكم", ["G4741"]], [" ", []], ["ويحميكم", ["G5442"]], [" من ", []], ["الشر", ["G4190"]], [".", []]]}, {"c": 3, "v": 4, "text": "ولنا في الرب ملء الثقة من جهتكم بأنكم عاملون بما نوصيكم به، وستعملون به أيضا.", "groups": [{"kw": "we have", "raw": "Rom_15:14; 2Co_2:3, 2Co_7:16, 2Co_8:22; Gal_5:10; Phi_1:6; Phm_1:21", "note": "", "refs": [{"l": "Rom 15:14", "n": "", "vs": [[14, "وأنا نفسي أيضا على يقين من جهتكم أيها الإخوة بأنكم
