<script>window.CATALOG=[{"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 20, "nv": 480, "refs": 6756, "last": "20:49", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 54, "abbr": "1Ti", "en": "1 Timothy", "verses": [{"c": 1, "v": 1, "text": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،", "groups": [{"kw": "an apostle", "raw": "Rom_1:1; 1Co_1:1", "note": "", "refs": [{"l": "Rom 1:1", "n": "", "vs": [[1, "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"]]}, {"l": "1Co 1:1", "n": "", "vs": [[1, "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"]]}], "kwAr": "رسول المسيح يسوع", "noteAr": ""}, {"kw": "by", "raw": "1Ti_2:7; Act_9:15, Act_26:16-18; 1Co_9:17; Gal_1:1, Gal_1:11; 2Ti_1:11; Tit_1:3", "note": "", "refs": [{"l": "1Ti 2:7", "n": "", "vs": [[7, "ولها قد عينت أنا مبشرا ورسولا، الحق أقول ولست أكذب، معلما للأمم في الإيمان والحق."]]}, {"l": "Act 9:15", "n": "", "vs": [[15, "فأمره الرب: «اذهب! فقد اخترت هذا الرجل ليكون إناء يحمل اسمي إلى الأمم والملوك وبني إسرائيل."]]}, {"l": "Act 26:16-18", "n": "", "vs": [[16, "انهض وقف على قدميك، فقد ظهرت لك لأعينك خادما لي وشاهدا بهذه الرؤيا التي تراني فيها الآن، وبالرؤى التي ستراني فيها بعد اليوم."], [17, "وسأنقذك من شعبك ومن الأمم التي أرسلك إليها الآن،"], [18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "1Co 9:17", "n": "", "vs": [[17, "فإن قمت بذلك متطوعا، كانت لي مكافأة. ولكن، إن كنت مرغما، فأنا مؤتمن على مسئولية،"]]}, {"l": "Gal 1:1", "n": "", "vs": [[1, "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"]]}, {"l": "Gal 1:11", "n": "", "vs": [[11, "وأعلمكم، أيها الإخوة، أن الإنجيل الذي بشرتكم به ليس إنجيلا بشريا."]]}, {"l": "2Ti 1:11", "n": "", "vs": [[11, "الذي له عينت أنا مبشرا ورسولا ومعلما."]]}, {"l": "Tit 1:3", "n": "", "vs": [[3, "ثم بين كلمته في أوانها المعين: بالبشارة التي وضعت أمانة بين يدي بموجب أمر مخلصنا الله …"]]}], "kwAr": "وفقا لأمر الله", "noteAr": ""}, {"kw": "God", "raw": "1Ti_2:3, 1Ti_4:10; Psa_106:21; Isa_12:2, Isa_43:3, Isa_43:11, Isa_45:15, Isa_45:21, Isa_49:26, Isa_60:16, Isa_63:8; Hos_13:4; Luk_1:47, Luk_2:11; 2Ti_1:10; Tit_1:3, Tit_2:10,Tit_2:13, Tit_3:4, Tit_3:6; 2Pe_1:1; 1Jo_4:14; Jud_1:25", "note": "", "refs": [{"l": "1Ti 2:3", "n": "", "vs": [[3, "فإن هذا الأمر جيد ومقبول في نظر الله مخلصنا،"]]}, {"l": "1Ti 4:10", "n": "", "vs": [[10, "فإننا لأجل هذا نعمل باجتهاد ونقاسي التعيير، لأننا وضعنا رجاءنا في الله الحي، حافظ جميع الناس، وبالأخص المؤمنين."]]}, {"l": "Psa 106:21", "n": "", "vs": [[21, "نسوا الله مخلصهم الذي صنع العظائم في مصر،"]]}, {"l": "Isa 12:2", "n": "", "vs": [[2, "ها إن الله خلاصي فأطمئن ولا أرتعد، لأن الرب الله هو قوتي وترنيمتي وقد أصبح لي خلاصا»."]]}, {"l": "Isa 43:3", "n": "", "vs": [[3, "لأني أنا هو الرب إلهك، قدوس إسرائيل مخلصك، قد جعلت مصر فدية عنك وكوش وسبا عوضا عنك."]]}, {"l": "Isa 43:11", "n": "", "vs": [[11, "أنا هو الرب، ولا مخلص غيري."]]}, {"l": "Isa 45:15", "n": "", "vs": [[15, "حقا أنت هو إله يحجب نفسه، إله إسرائيل المخلص."]]}, {"l": "Isa 45:21", "n": "", "vs": [[21, "أعلنوا، واعرضوا دعواكم. ليتشاوروا معا. من أنبأ بهذا منذ القدم، ومن أخبر به من زمن بعيد؟ ألست أنا الرب ولا إله غيري؟ بار ومخلص، وليس هناك آخر."]]}, {"l": "Isa 49:26", "n": "", "vs": [[26, "وأجعل مضطهديك يلتهمون لحوم أجسادهم، ويسكرون بدمهم كمن يشرب خمرا. عندئذ يدرك كل ذي جسد أنني أنا الرب مخلصك وفاديك إله يعقوب القدير."]]}, {"l": "Isa 60:16", "n": "", "vs": [[16, "وتشربين لبن الأمم، وترضعين ثدي الملوك، وتدركين أني أنا الرب مخلصك وفاديك عزيز يعقوب."]]}, {"l": "Isa 63:8", "n": "", "vs": [[8, "لأنه قال: إنهم حقا شعبي وأبناء أوفياء، لن يعودوا للباطل. فخلصهم."]]}, {"l": "Hos 13:4", "n": "", "vs": [[4, "أنا هو الرب إلهك منذ أن كنت في ديار مصر، ولست تعرف إلها غيري، ولا منقذ لك سواي."]]}, {"l": "Luk 1:47", "n": "", "vs": [[47, "وتبتهج روحي بالله مخلصي."]]}, {"l": "Luk 2:11", "n": "", "vs": [[11, "فقد ولد لكم اليوم في مدينة داود مخلص هو المسيح الرب."]]}, {"l": "2Ti 1:10", "n": "", "vs": [[10, "والتي أعلنت الآن بظهور مخلصنا يسوع المسيح الذي سحق الموت وأنار الحياة والخلود بالإنجيل"]]}, {"l": "Tit 1:3", "n": "", "vs": [[3, "ثم بين كلمته في أوانها المعين: بالبشارة التي وضعت أمانة بين يدي بموجب أمر مخلصنا الله …"]]}, {"l": "Tit 2:10", "n": "", "vs": [[10, "ولا سارقين، بل مظهرين أمانة كلية صالحة، لكي يزينوا في كل شيء تعليم مخلصنا الله."]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "Tit 3:4", "n": "", "vs": [[4, "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،"]]}, {"l": "Tit 3:6", "n": "", "vs": [[6, "الذي سكبه علينا بغنى بيسوع المسيح مخلصنا."]]}, {"l": "2Pe 1:1", "n": "", "vs": [[1, "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"]]}, {"l": "1Jo 4:14", "n": "", "vs": [[14, "ونحن أنفسنا نشهد أن الآب قد أرسل الابن مخلصا للعالم، لأننا رأيناه بعيوننا."]]}, {"l": "Jud 1:25", "n": "", "vs": [[25, "لله الواحد، مخلصنا بيسوع المسيح ربنا ... المجد والجلال والقدرة والسلطة، من قبل أن كان الزمان، والآن وطوال الأزمان آمين!"]]}], "kwAr": "الله مخلصنا", "noteAr": ""}, {"kw": "is", "raw": "Rom_15:12, Rom_15:13; Col_1:27; 2Th_2:16; 1Pe_1:3, 1Pe_1:21", "note": "", "refs": [{"l": "Rom 15:12", "n": "", "vs": [[12, "ويقول إشعياء أيضا: «سيطلع أصل يسى، والقائم، ليسود على الأمم: عليه تعلق الشعوب الرجاء»."]]}, {"l": "Rom 15:13", "n": "", "vs": [[13, "فليملأكم إله الرجاء كل فرح وسلام في إيمانكم حتى تزدادوا رجاء بقوة الروح القدس."]]}, {"l": "Col 1:27", "n": "", "vs": [[27, "الذين أراد الله أن يعلن لهم كم هو غني مجد هذا السر بين الأمم: إنه المسيح فيكم، وهو رجاء المجد؛"]]}, {"l": "2Th 2:16", "n": "", "vs": [[16, "وليت ربنا يسوع المسيح نفسه، والله أبانا، الذي أحبنا ووهبنا بنعمته راحة أبدية ورجاء صالحا،"]]}, {"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}, {"l": "1Pe 1:21", "n": "", "vs": [[21, "أنتم الذين تؤمنون بالله بالمسيح الذي أقامه من الموت وأعطاه المجد، حتى يكون الله غاية إيمانكم ورجائكم."]]}], "kwAr": "رجائنا", "noteAr": ""}], "arS": [["من ", []], ["بولس", ["G3972"]], ["، ", []], ["رسول", ["G652"]], [" ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["وفقا", ["G2596"]], [" ", []], ["لأمر", ["G2003"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["مخلصنا", ["G4990", "G2257"]], [" ", []], ["والمسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["رجائنا", ["G1680", "G2257"]], ["،", []]]}, {"c": 1, "v": 2, "text": "إلى تيموثاوس ولدي الحقيقي في الإيمان. لتكن لك النعمة والرحمة والسلام من الله أبينا والمسيح يسوع ربنا!", "groups": [{"kw": "Timothy", "raw": "Act_16:1-3; 1Th_3:2", "note": "", "refs": [{"l": "Act 16:1-3", "n": "", "vs": [[1, "ووصل بولس إلى دربة، ثم إلى لسترة، وكان فيها تلميذ اسمه تيموثاوس، أمه يهودية كانت قد آمنت بالمسيح، وأبوه يوناني."], [2, "وكان الإخوة في لسترة وإيقونية يشهدون لتيموثاوس شهادة حسنة."], [3, "فأحب بولس أن يصحبه في التبشير. ولأن يهود تلك المنطقة كانوا يعرفون أن أباه يوناني، فقد أخذه بولس وختنه."]]}, {"l": "1Th 3:2", "n": "", "vs": [[2, "فبعثنا تيموثاوس، أخانا ومعاوننا في خدمة الله بنشر الإنجيل، لكي يشددكم ويشجعكم في إيمانكم،"]]}], "kwAr": "تيموثاوس", "noteAr": ""}, {"kw": "my", "raw": "1Ti_1:18; 1Co_4:14-17; Phi_2:19-22; 2Ti_1:2, 2Ti_2:1; Tit_1:4", "note": "", "refs": [{"l": "1Ti 1:18", "n": "", "vs": [[18, "هذه التوصيات، ياتيموثاوس ولدي، أسلمها لك، بمقتضى النبوآت السابقة المختصة بك، وغايتي أن تحسن الجهاد في حربك الروحية،"]]}, {"l": "1Co 4:14-17", "n": "", "vs": [[14, "لا أكتب هذا تخجيلا لكم، بل أنبهكم باعتباركم أولادي الأحباء."], [15, "فقد يكون لكم عشر ة آلاف من المرشدين في المسيح، ولكن ليس لكم آباء كثيرون! لأني أنا ولدتكم في المسيح يسوع بالإنجيل."], [16, "فأدعوكم إذن إلى الاقتداء بي."], [17, "لهذا السبب عينه أرسلت إليكم تيموثاوس، ابني الحبيب الأمين في الرب، فهو يذكركم بطرقي في السلوك في المسيح كما أعلم بها في كل مكان في جميع الكنائس."]]}, {"l": "Phi 2:19-22", "n": "", "vs": [[19, "غير أني أرجو في الرب يسوع أن أرسل إليكم تيموثاوس عن قريب، لكي تطيب نفسي بمعرفة أحوالكم."], [20, "فليس عندي أحد غيره يهتم مثلي بأحوالكم بإخلاص."], [21, "فإن الجميع يسعون وراء مصالحهم الخاصة، لا لأجل المسيح يسوع."], [22, "أما تيموثاوس، فأنتم تعرفون أنه مختبر، إذ خدم معي في التبشير بالإنجيل كأنه ولد يعاون أباه."]]}, {"l": "2Ti 1:2", "n": "", "vs": [[2, "إلى تيموثاوس، ولدي الحبيب لتكن لك النعمة والرحمة والسلام من الله الآب والمسيح يسوع ربنا."]]}, {"l": "2Ti 2:1", "n": "", "vs": [[1, "وأنت ياولدي، فكن قويا في النعمة التي في المسيح يسوع."]]}, {"l": "Tit 1:4", "n": "", "vs": [[4, "إلى تيطس، ولدي الحقيقي بالنسبة إلى الإيمان المشترك بيننا."]]}], "kwAr": "ولدي الحقيقي", "noteAr": ""}, {"kw": "Grace", "raw": "Rom_1:7; Gal_1:3; 2Ti_1:2; Tit_1:4; 1Pe_1:2", "note": "", "refs": [{"l": "Rom 1:7", "n": "", "vs": [[7, "إلى جميع من هم في روما من أحباء الله القديسين المدعوين. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}, {"l": "Gal 1:3", "n": "", "vs": [[3, "لتكن لكم النعمة والسلام من الله الآب وربنا يسوع المسيح،"]]}, {"l": "2Ti 1:2", "n": "", "vs": [[2, "إلى تيموثاوس، ولدي الحبيب لتكن لك النعمة والرحمة والسلام من الله الآب والمسيح يسوع ربنا."]]}, {"l": "Tit 1:4", "n": "", "vs": [[4, "إلى تيطس، ولدي الحقيقي بالنسبة إلى الإيمان المشترك بيننا."]]}, {"l": "1Pe 1:2", "n": "", "vs": [[2, "بحسب علمه السابق ثم قدسهم بالروح ليطيعوا يسوع المسيح ويطهروا برش دمه عليهم."]]}], "kwAr": "النعمة", "noteAr": ""}], "arS": [["إلى ", []], ["تيموثاوس", ["G5095"]], [" ", []], ["ولدي", ["G5043"]], [" ", []], ["الحقيقي", ["G1103"]], [" في ", []], ["الإيمان", ["G4102"]], [". لتكن لك ", []], ["النعمة", ["G5485"]], [" ", []], ["والرحمة", ["G1656"]], [" ", []], ["والسلام", ["G1515"]], [" ", []], ["من", ["G575"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["أبينا", ["G3962", "G2257"]], [" ", []], ["والمسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["ربنا", ["G2962", "G2257"]], ["!", []]]}, {"c": 1, "v": 3, "text": "كما أوصيتك لما كنت منطلقا إلى مقاطعة مقدونية، (أطلب إليك) أن تبقى في مدينة أفسس، لكي تمنع بعض المعلمين من نشر التعاليم المخالفة للتعليم الصحيح،", "groups": [{"kw": "at", "raw": "Act_19:1-10", "note": "", "refs": [{"l": "Act 19:1-10", "n": "", "vs": [[1, "وبينما كان أبلوس في كورنثوس وصل بولس إلى أفسس، بعدما مر بالمناطق الداخلية من البلاد. وهناك وجد بعض التلاميذ،"], [2, "فسألهم: «هل نلتم الروح القدس عندما آمنتم؟» أجابوه: «لا! حتى إننا لم نسمع بوجود الروح القدس!»"], [3, "فسأل: «إذن على أي أساس قد تعمدتم؟» أجابوا: «على أساس معمودية يوحنا!»"], [4, "فقال بولس: «كان يوحنا يعمد بمعمودية التوبة، ويدعو الشعب إلى الإيمان بالآتي بعده، أي بيسوع»."], [5, "فلما سمعوا هذا تعمدوا باسم الرب يسوع."], [6, "وما إن وضع بولس يديه عليهم حتى حل عليهم الروح القدس، وأخذوا يتكلمون بلغات أخرى ويتنبأون."], [7, "وكان عددهم نحو اثني عشر رجلا."], [8, "وأخذ بولس يداوم على الذهاب إلى المجمع مدة ثلاثة أشهر، يتكلم بجرأة فيناقش الحاضرين ويحاول إقناعهم بالحقائق المختصة بملكوت الله."], [9, "ولكن بعضهم عاندوا ولم يقتنعوا، وأخذوا يشتمون الطريق أمام المجتمعين. فانفصل بولس عنهم، وانفرد بالتلاميذ، وبدأ يعقد مناقشات كل يوم في مدرسة رجل اسمه تيرانوس،"], [10, "وداوم على ذلك مدة سنتين. وهكذا وصلت كلمة الرب إلى جميع سكان مقاطعة أسيا من اليهود واليونانيين."]]}], "kwAr": "مدينة أفسس", "noteAr": ""}, {"kw": "when", "raw": "Act_20:1-3; Phi_2:24", "note": "", "refs": [{"l": "Act 20:1-3", "n": "", "vs": [[1, "بعدما انتهى الاضطراب، دعا بولس التلاميذ وشجعهم، ثم ودعهم وسافر إلى مقاطعة مقدونية،"], [2, "وتجول فيها يعظ ويشجع التلاميذ في كل مكان. وأخيرا وصل إلى اليونان،"], [3, "وقضى فيها ثلاثة أشهر. وبينما كان يستعد للسفر بحرا إلى سورية، عرف أن اليهود يدبرون مؤامرة لقتله. فقرر أن يعود بطريق مقدونية."]]}, {"l": "Phi 2:24", "n": "", "vs": [[24, "ولكن لي ثقة في الرب بأني، أنا نفسي، سآتي إليكم عن قريب."]]}], "kwAr": "منطلقا إلى مقاطعة مقدونية", "noteAr": ""}, {"kw": "charge", "raw": "1Ti_4:6, 1Ti_4:11, 1Ti_5:7, 1Ti_6:3, 1Ti_6:10,1Ti_6:17; Gal_1:6, Gal_1:7; Eph_4:14; Col_2:6-11; Tit_1:9-11; 2Jo_1:7, 2Jo_1:9, 2Jo_1:10; Rev_2:1, Rev_2:2, Rev_2:14, Rev_2:20", "note": "", "refs": [{"l": "1Ti 4:6", "n": "", "vs": [[6, "إن بسطت هذه الأمور أمام الإخوة، كنت خادما صالحا للمسيح يسوع، متغذيا بكلام الإيمان والتعليم الصالح الذي اتبعته تماما."]]}, {"l": "1Ti 4:11", "n": "", "vs": [[11, "أوص بهذه الأمور وعلم!"]]}, {"l": "1Ti 5:7", "n": "", "vs": [[7, "وعليك أن توصي بهذه الأمور، لكي يكون الجميع بلا لوم."]]}, {"l": "1Ti 6:3", "n": "", "vs": [[3, "أما إذا كان أحد يعلم ما يخالفها ولا يذعن للكلام الصحيح، كلام ربنا يسوع المسيح، وللتعليم الموافق للتقوى،"]]}, {"l": "1Ti 6:10", "n": "", "vs": [[10, "فإن حب المال أصل لكل شر؛ وإذ سعى بعضهم إليه، ضلوا عن الإيمان، وطعنوا أنفسهم بأوجاع كثيرة."]]}, {"l": "1Ti 6:17", "n": "", "vs": [[17, "أوص أغنياء هذا الزمان بأن لا يتكبروا، ولا يتكلوا على الغنى غير الثابت، بل على الله الذي يمنحنا كل شيء بوفرة لنتمتع به،"]]}, {"l": "Gal 1:6", "n": "", "vs": [[6, "عجبا! كيف تتحولون بمثل هذه السرعة عن الذي دعاكم بنعمة المسيح، وتنصرفون إلى إنجيل غريب؟"]]}, {"l": "Gal 1:7", "n": "", "vs": [[7, "لا أعني أن هنالك إنجيلا آخر، بل إنما هنالك بعض (المعلمين) الذين يثيرون البلبلة بينكم، راغبين في تحوير إنجيل المسيح."]]}, {"l": "Eph 4:14", "n": "", "vs": [[14, "وذلك حتى لا نكون فيما بعد أطفالا تتقاذفنا وتحملنا كل ريح تعليم يقوم على خداع الناس والمكر بهم لجرهم إلى الضلال الملفق،"]]}, {"l": "Col 2:6-11", "n": "", "vs": [[6, "فمثلما قبلتم المسيح يسوع الرب، ففيه اسلكوا"], [7, "وأنتم متأصلون ومبنيون فيه وراسخون في الإيمان الموافق لما تعلمتم وفائضون بالشكر."], [8, "احذروا أن يوقعكم أحد فريسة بالفلسفة والغرور الباطل، عملا بتقاليد الناس ومباديء العالم؛ مما لا يوافق المسيح."], [9, "فإنه فيه، جسديا، يحل الله بكل ملئه،"], [10, "وأنتم مكملون فيه. فهو رأس كل رئاسة وسلطة؛"], [11, "وفيه أيضا ختنتم أنتم ختانا لم تجره الأيدي، إذ نزع عنكم جسد الخطايا البشري وهذا هو ختان المسيح:"]]}, {"l": "Tit 1:9-11", "n": "", "vs": [[9, "ملتصقا بالكلمة الصادقة الموافقة للتعليم، ليكون قادرا على تشجيع المؤمنين بالتعليم الصحيح وعلى إفحام المعارضين."], [10, "فإن هنالك كثيرين من معلمي الباطل المتمردين وخادعي عقول الناس، وبخاصة الذين من أهل الختان."], [11, "هؤلاء يجب أن تسد أفواههم: فهم يخربون بيوتا بجملتها، إذ يعلمون تعاليم يجب ألا تعلم، في سبيل مكسب خسيس."]]}, {"l": "2Jo 1:7", "n": "", "vs": [[7, "إن العالم أصبح يعج بالمضللين الذين لا يعترفون أن يسوع المسيح جاء إلى الأرض بجسم بشري. هذا هو روح المضل وضد المسيح!"]]}, {"l": "2Jo 1:9", "n": "", "vs": [[9, "لأن من تعدى تعليم المسيح ولم يثبت فيه، فليس الله من نصيبه. أما من يثبت في هذا التعليم، فله الآب والابن معا."]]}, {"l": "2Jo 1:10", "n": "", "vs": [[10, "إن جاءكم أحد بغير هذا التعليم، فلا تستقبلوه في بيتكم، ولا تبادلوه التحية."]]}, {"l": "Rev 2:1", "n": "", "vs": [[1, "اكتب إلى ملاك الكنيسة في أفسس: إليك ما يقوله الذي يمسك النجوم السبع بيمينه ويمشي بين منائر الذهب السبع:"]]}, {"l": "Rev 2:2", "n": "", "vs": [[2, "إني عالم بأعمالك، وجهدك، وصبرك، وأعلم أنك لا تستطيع احتمال الأشرار، وأنك دققت في فحص ادعاءات أولئك الذين يزعمون أنهم رسل، وما هم برسل، فتبين لك أنهم دجالون!"]]}, {"l": "Rev 2:14", "n": "", "vs": [[14, "ولكني عاتب عليك قليلا لأنك تتسامح مع القوم الذين يتمسكون بتعليم بلعام عندما علم الملك بالاق أن يدمر بني إسرائيل بتوريطهم في ارتكاب الزنى والأكل من الذبائح المقدمة للأصنام،"]]}, {"l": "Rev 2:20", "n": "", "vs": [[20, "ولكن لي عليك أنك تتساهل مع هذه المرأة إيزابل، التي تدعي أنها نبية، فتعلم عبيدي وتغويهم أن يزنوا ويأكلوا من الذبائح المقدمة للأصنام."]]}], "kwAr": "لكي تمنع بعض المعلمين", "noteAr": ""}], "arS": [["كما", ["G2531"]], [" ", []], ["أوصيتك", ["G3870", "G4571"]], [" لما كنت ", []], ["منطلقا", ["G4198"]], [" إلى مقاطعة ", []], ["مقدونية", ["G3109"]], ["، (أطلب إليك) أن ", []], ["تبقى", ["G4357"]], [" في مدينة ", []], ["أفسس", ["G2181"]], ["، لكي ", []], ["تمنع", ["G3853"]], [" ", []], ["بعض", ["G5100"]], [" المعلمين من نشر ", []], ["التعاليم المخالفة", ["G2085"]], [" للتعليم الصحيح،", []]]}, {"c": 1, "v": 4, "text": "وتوصي المؤمنين ألا ينشغلوا بالأساطير وسلاسل النسب المتشابكة. فتلك الأمور تثير المجادلات ولا تعمل على تقدم تدبير الله القائم على الإيمان.", "groups": [{"kw": "to", "raw": "1Ti_4:7, 1Ti_6:4, 1Ti_6:20; 2Ti_2:14, 2Ti_2:16-18, 2Ti_4:4; Tit_1:14; 2Pe_1:16", "note": "", "refs": [{"l": "1Ti 4:7", "n": "", "vs": [[7, "أما أساطير العجائز المبتذلة، فتجنبها. إنما مرن نفسك في طريق التقوى."]]}, {"l": "1Ti 6:4", "n": "", "vs": [[4, "فهو قد انتفخ تكبرا، ولا يعرف شيئا، وإنما هو مهووس بالمجادلات والمنازعات الكلامية، ومنها ينشأ الحسد والخصام والتجريح والنيات السيئة،"]]}, {"l": "1Ti 6:20", "n": "", "vs": [[20, "ياتيموثاوس، حافظ على الأمانة المودعة لديك. تجنب الكلام الدنس الباطل، ومناقضات ما يسمى زورا «معرفة»."]]}, {"l": "2Ti 2:14", "n": "", "vs": [[14, "بهذه الأمور ذكر، شاهدا في حضرة الله أن لا تنشأ المجادلات الكلامية، وهي لا تنفع شيئا، غير تخريب سامعيها."]]}, {"l": "2Ti 2:16-18", "n": "", "vs": [[16, "أما الأحاديث الباطلة الدنسة، فتجنبها؛ فإن المنصرفين إليها يتقدمون إلى فجور أفظع،"], [17, "وكلامهم ينهش كالآكلة، ومنهم هيمنايوس وفيليتوس،"], [18, "اللذان زاغا عن الحق؛ إذ يزعمان أن القيامة قد حدثت، ويهدمان إيمان بعض الناس."]]}, {"l": "2Ti 4:4", "n": "", "vs": [[4, "فيحولون آذانهم بعيدا عن الحق، منحرفين إلى الخرافات."]]}, {"l": "Tit 1:14", "n": "", "vs": [[14, "لا يديرون عقولهم إلى خرافات يهودية ووصايا أناس تحولوا عن الحق بعيدا."]]}, {"l": "2Pe 1:16", "n": "", "vs": [[16, "فنحن، عندما أخبرناكم بقدرة ربنا يسوع المسيح، وبعودته المجيدة، لم نكن ننقل عن أساطير مختلقة بمهارة. وإنما، تكلمنا باعتبارنا شهود عيان لعظمة المسيح."]]}], "kwAr": "ألا ينشغلوا بالأساطير", "noteAr": ""}, {"kw": "endless", "raw": "Tit_3:9", "note": "", "refs": [{"l": "Tit 3:9", "n": "", "vs": [[9, "أما المسائل السخيفة، وسلاسل النسب، والمخاصمات، والمنازعات حول الشريعة، فتجنبها، لأنها غير نافعة، وباطلة."]]}], "kwAr": "سلاسل النسب المتشابكة", "noteAr": ""}, {"kw": "questions", "raw": "1Ti_6:4, 1Ti_6:5; 2Ti_2:22", "note": "", "refs": [{"l": "1Ti 6:4", "n": "", "vs": [[4, "فهو قد انتفخ تكبرا، ولا يعرف شيئا، وإنما هو مهووس بالمجادلات والمنازعات الكلامية، ومنها ينشأ الحسد والخصام والتجريح والنيات السيئة،"]]}, {"l": "1Ti 6:5", "n": "", "vs": [[5, "وشتى أنواع النزاع بين أناس فاسدي العقول مجردين من الحق، يعتبرون التقوى تجارة."]]}, {"l": "2Ti 2:22", "n": "", "vs": [[22, "إنما اهرب من الشهوات الشبابية، واسع وراء البر والإيمان والمحبة والسلام، مشاركا الذين يدعون الرب من قلب نقي."]]}], "kwAr": "تثير المجادلات", "noteAr": ""}, {"kw": "godly", "raw": "1Ti_3:16, 1Ti_6:3, 1Ti_6:11; 2Co_1:12, 2Co_7:9, 2Co_7:10; Eph_4:12-16; Tit_1:1; Heb_13:9", "note": "", "refs": [{"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}, {"l": "1Ti 6:3", "n": "", "vs": [[3, "أما إذا كان أحد يعلم ما يخالفها ولا يذعن للكلام الصحيح، كلام ربنا يسوع المسيح، وللتعليم الموافق للتقوى،"]]}, {"l": "1Ti 6:11", "n": "", "vs": [[11, "وأما أنت، ياإنسان الله، فاهرب من هذه الأمور، واسع في إثر البر والتقوى والإيمان والمحبة والصبر والوداعة."]]}, {"l": "2Co 1:12", "n": "", "vs": [[12, "فإن فخرنا هو هذا: شهادة ضميرنا بأننا، في قداسة الله وإخلاصه، قد سلكنا في العالم، وبخاصة تجاهكم؛ ولم يكن ذلك بحكمة بشرية بل بنعمة الله."]]}, {"l": "2Co 7:9", "n": "", "vs": [[9, "وأنا الآن أفرح، لا لأنكم قد أحزنتم، بل لأن حزنكم أدى بكم إلى التوبة. فإنكم قد أحزنتم بما يوافق مشيئة الله، حتى لا تتأذوا منا في أي شيء."]]}, {"l": "2Co 7:10", "n": "", "vs": [[10, "فإن الحزن الذي يوافق مشيئة الله ينتج توبة تؤدي إلى الخلاص، وليس عليه ندم. وأما حزن العالم فينتج موتا."]]}, {"l": "Eph 4:12-16", "n": "", "vs": [[12, "لتأهيل القديسين من جهة عمل الخدمة، لبنيان جسد المسيح،"], [13, "حتى نصل جميعا إلى وحدة الإيمان ووحدة المعرفة لابن الله، إلى إنسان تام البلوغ، إلى مقدار قامة ملء المسيح."], [14, "وذلك حتى لا نكون فيما بعد أطفالا تتقاذفنا وتحملنا كل ريح تعليم يقوم على خداع الناس والمكر بهم لجرهم إلى الضلال الملفق،"], [15, "بل نتمسك بالحق في المحبة، فننمو في كل شيء نحو من هو الرأس، أي المسيح."], [16, "فمنه يستمد الجسد كله تماسكه وترابطه بمساندة كل مفصل وفقا لمقدار العمل المخصص لكل جزء، لينشيء نموا يؤول إلى بنيان الجسد بنيانا ذاتيا في المحبة."]]}, {"l": "Tit 1:1", "n": "", "vs": [[1, "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"]]}, {"l": "Heb 13:9", "n": "", "vs": [[9, "فلا تنخدعوا وتتبعوا تلك التعاليم الغريبة المتنوعة ... فمن الأفضل أن يثبت القلب بالنعمة لا بنظم الأطعمة التي لم تنفع المتقيدين بها."]]}], "kwAr": "تدبير الله", "noteAr": ""}], "arS": [["وتوصي المؤمنين ألا ", []], ["ينشغلوا", ["G4337"]], [" ", []], ["بالأساطير", ["G3454"]], [" ", []], ["وسلاسل النسب", ["G1076"]], [" ", []], ["المتشابكة", ["G562"]], [". فتلك الأمور ", []], ["تثير", ["G3930"]], [" ", []], ["المجادلات", ["G2214"]], [" ولا تعمل على تقدم ", []], ["تدبير", ["G3622"]], [" ", []], ["الله", ["G2316"]], [" القائم على ", []], ["الإيمان", ["G4102"]], [".", []]]}, {"c": 1, "v": 5, "text": "أما الغاية مما أوصيتك به، فهي المحبة النابعة من قلب طاهر وضمير صالح وإيمان خال من الرياء.", "groups": [{"kw": "the end", "raw": "Rom_10:4, Rom_13:8-10; Gal_5:13, Gal_5:14, Gal_5:22; 1Jo_4:7-14", "note": "", "refs": [{"l": "Rom 10:4", "n": "", "vs": [[4, "فإن غاية الشريعة هي المسيح لتبرير كل من يؤمن."]]}, {"l": "Rom 13:8-10", "n": "", "vs": [[8, "لا تكونوا في دين لأحد، إلا بأن يحب بعضكم بعضا. فإن من يحب غيره، يكون قد تمم الشريعة،"], [9, "لأن الوصايا «لا تزن، لا تقتل، لا تسرق، لا تشهد زورا، لا تشته....» وباقي الوصايا، تتلخص في هذه الكلمة: «أحب قريبك كنفسك!»"], [10, "فالمحبة لا تعمل سوءا للقريب. وهكذا تكون المحبة إتماما للشريعة كلها."]]}, {"l": "Gal 5:13", "n": "", "vs": [[13, "فإنما إلى الحرية قد دعيتم، أيها الإخوة؛ ولكن لا تتخذوا من الحرية ذريعة لإرضاء الجسد، بل بالمحبة كونوا عبيدا في خدمة أحدكم الآخر."]]}, {"l": "Gal 5:14", "n": "", "vs": [[14, "فإن الشريعة كلها تتم في وصية واحدة: «أن تحب قريبك كنفسك»."]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "1Jo 4:7-14", "n": "", "vs": [[7, "أيها الأحباء، لنحب بعضنا بعضا: لأن المحبة تصدر من الله. إذن، كل من يحب، يكون مولودا من الله ويعرف الله ."], [8, "أما من لا يحب، فهو لم يتعرف بالله قط لأن الله محبة!"], [9, "وقد أظهر الله محبته لنا إذ أرسل ابنه الأوحد إلى العالم لكي نحيا به."], [10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."], [11, "ومادام الله قد أحبنا هذه المحبة العظيمة، أيها الأحباء، فعلينا نحن أيضا أن نحب بعضنا بعضا."], [12, "إن الله لم يره أحد من الناس قط. ولكن، حين نحب بعضنا بعضا، نبين أن الله يحيا في داخلنا، وأن محبته قد اكتملت في داخلنا."], [13, "وما يؤكد لنا أننا نثبت في الله، وأنه يثبت فينا هو أنه وهب لنا من روحه."], [14, "ونحن أنفسنا نشهد أن الآب قد أرسل الابن مخلصا للعالم، لأننا رأيناه بعيوننا."]]}], "kwAr": "الغاية", "noteAr": ""}, {"kw": "charity", "raw": "Mar_12:28-34; Rom_14:15; 1Co_8:1-3, 1Co_13:1-13, 1Co_14:1; 1Pe_4:8; 2Pe_1:7", "note": "", "refs": [{"l": "Mar 12:28-34", "n": "", "vs": [[28, "وتقدم إليه واحد من الكتبة كان قد سمعهم يتجادلون، ورأى أنه أحسن الرد عليهم، فسأله: «أية وصية هي أولى الوصايا جميعا؟»"], [29, "فأجابه يسوع: «أولى الوصايا جميعا هي: اسمع ياإسرائيل، الرب إلهنا رب واحد"], [30, "فأحب الرب إلهك بكل قلبك وبكل نفسك وبكل فكرك وبكل قوتك. هذه هي الوصية الأولى."], [31, "وهناك ثانية مثلها، وهي أن تحب قريبك كنفسك. فما من وصية أخرى أعظم من هاتين»."], [32, "فقال له الكاتب: «صحيح، يامعلم! حسب الحق تكلمت. فإن الله واحد وليس آخر سواه."], [33, "ومحبته بكل القلب وبكل الفهم وبكل القوة، ومحبة القريب كالنفس، أفضل من جميع المحرقات والذبائح!»"], [34, "فلما رأى يسوع أنه أجاب بحكمة، قال له: «لست بعيدا عن ملكوت الله!» ولم يجرؤ أحد بعد ذلك أن يوجه إليه أي سؤال."]]}, {"l": "Rom 14:15", "n": "", "vs": [[15, "فإن كنت بطعامك تسبب الحزن لأخيك، فلست تسلك بعد بما يتفق مع المحبة. لا تدمر بطعامك من لأجله مات المسيح."]]}, {"l": "1Co 8:1-3", "n": "", "vs": [[1, "وأما فيما يتعلق بالذبائح المقدمة للأصنام، فنعلم أن المعرفة لجميعنا. غير أن المعرفة تنفخ تكبرا، ولكن المحبة تبني. فمن ظن أنه يعرف شيئا،"], [2, "فهو لا يعرف شيئا بعد حق المعرفة."], [3, "أما الذي يحب الله ، فإن الله يعرفه."]]}, {"l": "1Co 13:1-13", "n": "", "vs": [[1, "... لو كنت أتكلم بلغات الناس والملائكة وليس عندي محبة، لما كنت إلا نحاسا يطن وصنجا يرن!"], [2, "ولو كانت لي موهبة النبوءة، وكنت عالما بجميع الأسرار والعلم كله، وكان عندي الإيمان كله حتى أنقل الجبال، وليس عندي محبة، فلست شيئا!"], [3, "ولو قدمت أموالي كلها للإطعام، وسلمت جسدي لأحرق، وليس عندي محبة، لما كنت أنتفع شيئا."], [4, "المحبة تصبر طويلا؛ وهي لطيفة. المحبة لا تحسد. المحبة لا تتفاخر ولا تتكبر."], [5, "لا تتصرف بغير لياقة، ولا تسعى إلى مصلحتها الخاصة. لا تستفز سريعا، ولا تنسب الشر لأحد."], [6, "لا تفرح بالظلم، بل تفرح بالحق."], [7, "إنها تستر كل شيء، وتصدق كل شيء، وترجو كل شيء، وتتحمل كل شيء."], [8, "المحبة لا تزول أبدا. أما مواهب النبوآت فستزال، ومواهب اللغات ستنقطع، والمعرفة ستزال."], [9, "فإن معرفتنا جزئية ونبوءتنا جزئية."], [10, "ولكن، عندما يأتي ما هو كامل، يزال ما هو جزئي."], [11, "فلما كنت طفلا، كنت أتكلم كالطفل، وأشعر كالطفل، وأفكر كالطفل. ولكن، لما صرت رجلا، أبطلت ما يخص الطفل."], [12, "ونحن الآن ننظر إلى الأمور من خلال زجاج قاتم فنراها بغموض. إلا أننا سنراها أخيرا مواجهة. الآن، أعرف معرفة جزئية. ولكني، عندئذ، سأعرف مثلما عرفت."], [13, "أما الآن، فهذه الثلاثة باقية: الإيمان، والرجاء، والمحبة. ولكن أعظمها هي المحبة!"]]}, {"l": "1Co 14:1", "n": "", "vs": [[1, "اسعوا وراء المحبة، وتشوقوا إلى المواهب الروحية، بل بالأحرى موهبة التنبوء."]]}, {"l": "1Pe 4:8", "n": "", "vs": [[8, "لكن أهم شيء هو أن تبادلوا بعضكم بعضا المحبة الشديدة. لأن المحبة تستر إساءات كثيرة."]]}, {"l": "2Pe 1:7", "n": "", "vs": [[7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."]]}], "kwAr": "المحبة", "noteAr": ""}, {"kw": "a pure", "raw": "Psa_24:4, Psa_51:10; Jer_4:14; Mat_5:8, Mat_12:35; Act_15:9; 2Ti_2:22; Jam_4:8; 1Pe_1:22; 1Jo_3:3", "note": "", "refs": [{"l": "Psa 24:4", "n": "", "vs": [[4, "إنه صاحب اليدين الطاهرتين والقلب النقي. ذاك الذي لا يحمل نفسه على الباطل، ولا يحلف منافقا."]]}, {"l": "Psa 51:10", "n": "", "vs": [[10, "قلبا نقيا اخلق في ياالله وروحا مستقيما جدد في داخلي."]]}, {"l": "Jer 4:14", "n": "", "vs": [[14, "ياأورشليم، اغسلي من الشر قلبك فتخلصي. إلى متى تظل أفكارك الباطلة مترعرعة في وسطك؟"]]}, {"l": "Mat 5:8", "n": "", "vs": [[8, "طوبى لأنقياء القلب، فإنهم سيرون الله ."]]}, {"l": "Mat 12:35", "n": "", "vs": [[35, "فالإنسان الصالح، من الكنز الصالح في قلبه، يصدر ما هو صالح. والإنسان الشرير، يصدر ما هو شرير."]]}, {"l": "Act 15:9", "n": "", "vs": [[9, "فهو لم يفرق بيننا وبينهم في شيء، إذ طهر بالإيمان قلوبهم."]]}, {"l": "2Ti 2:22", "n": "", "vs": [[22, "إنما اهرب من الشهوات الشبابية، واسع وراء البر والإيمان والمحبة والسلام، مشاركا الذين يدعون الرب من قلب نقي."]]}, {"l": "Jam 4:8", "n": "", "vs": [[8, "اقتربوا إلى الله فيقترب إليكم. أيها الخاطئون نظفوا أيديكم، وياأصحاب الرأيين طهروا قلوبكم."]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}, {"l": "1Jo 3:3", "n": "", "vs": [[3, "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر."]]}], "kwAr": "قلب طاهر", "noteAr": ""}, {"kw": "a good", "raw": "1Ti_1:19, 1Ti_3:9; Act_23:1, Act_24:16; Rom_9:1; 2Co_1:12; 2Ti_1:3; Tit_1:15; Heb_9:14; Heb_10:22, Heb_13:18; 1Pe_3:16, 1Pe_3:21", "note": "", "refs": [{"l": "1Ti 1:19", "n": "", "vs": [[19, "متمسكا بالإيمان، وبالضمير الصالح، هذا الضمير الذي تخلى عنه بعضهم، فانكسرت بهم سفينة الإيمان."]]}, {"l": "1Ti 3:9", "n": "", "vs": [[9, "يتمسكون بحقائق الإيمان الخفية بضمير نقي."]]}, {"l": "Act 23:1", "n": "", "vs": [[1, "فحدق بولس إلى المجلس، وقال: «أيها الإخوة، إني عشت لله بضمير صالح حتى هذا اليوم»."]]}, {"l": "Act 24:16", "n": "", "vs": [[16, "لذلك أنا أيضا أدرب نفسي لكي أحيا دائما بضمير نقي أمام الله والناس."]]}, {"l": "Rom 9:1", "n": "", "vs": [[1, "أقول الحق في المسيح، لست أكذب، وضميري شاهد لي في الروح القدس،"]]}, {"l": "2Co 1:12", "n": "", "vs": [[12, "فإن فخرنا هو هذا: شهادة ضميرنا بأننا، في قداسة الله وإخلاصه، قد سلكنا في العالم، وبخاصة تجاهكم؛ ولم يكن ذلك بحكمة بشرية بل بنعمة الله."]]}, {"l": "2Ti 1:3", "n": "", "vs": [[3, "كم أشكر الله ، الذي أعبده بضمير طاهر كما أخذت عن أجدادي، إذ مازلت أذكرك دائما في تضرعاتي ليلا ونهارا؛"]]}, {"l": "Tit 1:15", "n": "", "vs": [[15, "عند الطاهرين، كل شيء طاهر. أما عند النجسين وغير المؤمنين، فما من شيء طاهر، بل إن عقولهم وضمائرهم أيضا قد صارت نجسة."]]}, {"l": "Heb 9:14", "n": "", "vs": [[14, "فكم بالأحرى دم المسيح الذي قدم نفسه لله بروح أزلي ذبيحة لا عيب فيها، يطهر ضمائرنا من الأعمال الميتة لنعبد الله الحي."]]}, {"l": "Heb 10:22", "n": "", "vs": [[22, "فلنتقدم إلى حضرة الله بقلب صادق وبثقة الإيمان الكاملة، بعدما طهر رش الدم قلوبنا من كل شعور بالذنب، وغسل الماء النقي أجسادنا."]]}, {"l": "Heb 13:18", "n": "", "vs": [[18, "صلوا لأجلنا، فنحن مقتنعون بأن لنا ضميرا صالحا وراغبون في أن نحسن التصرف في كل شيء."]]}, {"l": "1Pe 3:16", "n": "", "vs": [[16, "على أن تفعلوا ذلك بوداعة واحترام، محافظين على طهارة ضمائركم، سالكين في المسيح سلوكا صالحا، وعندئذ يخيب الذين يوجهون إليكم التهم الكاذبة ويشتمونكم كأنكم تفعلون شرا."]]}, {"l": "1Pe 3:21", "n": "", "vs": [[21, "وعملية النجاة هذه مصورة في المعمودية التي لا نقصد بها أن نغتسل من أوساخ أجسامنا، بل هي تعهد ضمير صالح أمام الله بفضل قيامة يسوع المسيح،"]]}], "kwAr": "وضمير صالح", "noteAr": ""}, {"kw": "faith", "raw": "Gal_5:6; 2Ti_1:5; Heb_11:5, Heb_11:6; 1Jo_3:23", "note": "", "refs": [{"l": "Gal 5:6", "n": "", "vs": [[6, "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة."]]}, {"l": "2Ti 1:5", "n": "", "vs": [[5, "كما أستذكر إيمانك الخالي من الرياء، هذا الإيمان الذي فيك والذي حل أولا في جدتك لوئيس ثم في أمك أفنيكي، وأنا متأكد أنه حال فيك أيضا."]]}, {"l": "Heb 11:5", "n": "", "vs": [[5, "وبالإيمان، انتقل أخنوخ إلى حضرة الله دون أن يموت. وقد اختفى من على هذه الأرض لأن الله أخذه إليه. وقبل حدوث ذلك، شهد له بأنه قد أرضى الله ."]]}, {"l": "Heb 11:6", "n": "", "vs": [[6, "فمن المستحيل إرضاء الله بدون إيمان. إذ إن من يتقرب إلى الله، لابد له أن يؤمن بأنه موجود، وبأنه يكافيء الذين يسعون إليه."]]}, {"l": "1Jo 3:23", "n": "", "vs": [[23, "وأما وصيته فهي أن نؤمن باسم ابنه يسوع المسيح، وأن يحب بعضنا بعضا كما أوصانا."]]}], "kwAr": "وإيمان خال من الرياء", "noteAr": ""}], "arS": [["أما ", []], ["الغاية", ["G5056"]], [" مما ", []], ["أوصيتك به", ["G3852"]], ["، فهي ", []], ["المحبة", ["G26"]], [" النابعة من ", []], ["قلب", ["G2588"]], [" ", []], ["طاهر", ["G2513"]], [" ", []], ["وضمير", ["G4893"]], [" ", []], ["صالح", ["G18"]], [" ", []], ["وإيمان", ["G4102"]], [" ", []], ["خال من الرياء", ["G505"]], [".", []]]}, {"c": 1, "v": 6, "text": "هذه الفضائل قد زاغ عنها بعضهم، فانحرفوا إلى المجادلات الباطلة،", "groups": [{"kw": "From which some having swerved", "raw": "or, Which some not aiming at, 1Ti_6:21; 2Ti_2:18 *Gr: 1Ti_4:10", "note": "or, Which some not aiming at, 1Ti_6:21; 2Ti_2:18 *Gr: 1Ti_4:10", "refs": [{"l": "1Ti 6:21", "n": "", "vs": [[21, "وإذ ادعى بعضهم هذه المعرفة المزعومة، زاغوا عن الإيمان. لتكن النعمة معك!"]]}, {"l": "2Ti 2:18", "n": "*Gr:", "vs": [[18, "اللذان زاغا عن الحق؛ إذ يزعمان أن القيامة قد حدثت، ويهدمان إيمان بعض الناس."]]}, {"l": "1Ti 4:10", "n": "", "vs": [[10, "فإننا لأجل هذا نعمل باجتهاد ونقاسي التعيير، لأننا وضعنا رجاءنا في الله الحي، حافظ جميع الناس، وبالأخص المؤمنين."]]}], "kwAr": "قد زاغ عنها بعضهم", "noteAr": "أو: التي لم يصوِّب إليها بعضهم (أخطأوا الهدف)."}, {"kw": "turned", "raw": "1Ti_5:15, 1Ti_6:4, 1Ti_6:5, 1Ti_6:20; 2Ti_2:23, 2Ti_2:24; Tit_1:10, Tit_3:9", "note": "", "refs": [{"l": "1Ti 5:15", "n": "", "vs": [[15, "ذلك لأن بعضا منهن قد انحرفن وراء الشيطان فعلا."]]}, {"l": "1Ti 6:4", "n": "", "vs": [[4, "فهو قد انتفخ تكبرا، ولا يعرف شيئا، وإنما هو مهووس بالمجادلات والمنازعات الكلامية، ومنها ينشأ الحسد والخصام والتجريح والنيات السيئة،"]]}, {"l": "1Ti 6:5", "n": "", "vs": [[5, "وشتى أنواع النزاع بين أناس فاسدي العقول مجردين من الحق، يعتبرون التقوى تجارة."]]}, {"l": "1Ti 6:20", "n": "", "vs": [[20, "ياتيموثاوس، حافظ على الأمانة المودعة لديك. تجنب الكلام الدنس الباطل، ومناقضات ما يسمى زورا «معرفة»."]]}, {"l": "2Ti 2:23", "n": "", "vs": [[23, "أما المجادلات الغبية الحمقاء، فتجنبها، عالما أنها تولد المشاجرات."]]}, {"l": "2Ti 2:24", "n": "", "vs": [[24, "وعبد الرب يجب ألا يتشاجر، بل أن يكون مترفقا تجاه الجميع، قادرا على التعليم، يتحمل المشقات بصبر،"]]}, {"l": "Tit 1:10", "n": "", "vs": [[10, "فإن هنالك كثيرين من معلمي الباطل المتمردين وخادعي عقول الناس، وبخاصة الذين من أهل الختان."]]}, {"l": "Tit 3:9", "n": "", "vs": [[9, "أما المسائل السخيفة، وسلاسل النسب، والمخاصمات، والمنازعات حول الشريعة، فتجنبها، لأنها غير نافعة، وباطلة."]]}], "kwAr": "فانحرفوا", "noteAr": ""}], "arS": [["هذه الفضائل قد ", []], ["زاغ", ["G795"]], [" عنها ", []], ["بعضهم", ["G5100"]], ["، ", []], ["فانحرفوا", ["G1624"]], [" إلى ", []], ["المجادلات الباطلة", ["G3150"]], ["،", []]]}, {"c": 1, "v": 7, "text": "راغبين في أن يكونوا أساتذة في الشريعة، وهم لا يفهمون ما يقولون ولا ما يقررون!", "groups": [{"kw": "to", "raw": "Act_15:1; Rom_2:19-21; Gal_3:2, Gal_3:5, Gal_4:21, Gal_5:3, Gal_5:4; Tit_1:10,Tit_1:11", "note": "", "refs": [{"l": "Act 15:1", "n": "", "vs": [[1, "وجاء بعض اليهود (الذين كانوا قد آمنوا بالمسيح) من منطقة اليهودية إلى أنطاكية، وأخذوا يعلمون الإخوة قائلين: «لا يمكنكم أن تخلصوا ما لم تختنوا حسب شريعة موسى»"]]}, {"l": "Rom 2:19-21", "n": "", "vs": [[19, "ولك ثقة في نفسك بأنك قائد للعميان، ونور للذين في الظلام،"], [20, "ومؤدب للجهال، ومعلم للأطفال؛ ولك في الشريعة صورة المعرفة والحق؛"], [21, "فأنت إذن، يامن تعلم غيرك، أما تعلم نفسك؟ أنت يامن تعظ أن لا يسرق، أتسرق؟"]]}, {"l": "Gal 3:2", "n": "", "vs": [[2, "أريد أن أستعلم منكم هذا الأمر فقط: أعلى أساس العمل بما في الشريعة نلتم الروح، أم على أساس الإيمان بالبشارة؟"]]}, {"l": "Gal 3:5", "n": "", "vs": [[5, "فذاك الذي يهبكم الروح، ويجري معجزات في ما بينكم، أيفعل ذلك على أساس أعمال الشريعة أم على أساس الإيمان بالبشارة؟"]]}, {"l": "Gal 4:21", "n": "", "vs": [[21, "قولوا لي، يامن ترغبون في الرجوع إلى العبودية للشريعة، ألستم تسمعون ما جاء في الشريعة؟"]]}, {"l": "Gal 5:3", "n": "", "vs": [[3, "وأشهد مرة أخرى لكل مختون بأنه ملتزم أن يعمل بالشريعة كلها."]]}, {"l": "Gal 5:4", "n": "", "vs": [[4, "يامن تريدون التبرير عن طريق الشريعة، قد حرمتم المسيح وسقطتم من النعمة!"]]}, {"l": "Tit 1:10", "n": "", "vs": [[10, "فإن هنالك كثيرين من معلمي الباطل المتمردين وخادعي عقول الناس، وبخاصة الذين من أهل الختان."]]}, {"l": "Tit 1:11", "n": "", "vs": [[11, "هؤلاء يجب أن تسد أفواههم: فهم يخربون بيوتا بجملتها، إذ يعلمون تعاليم يجب ألا تعلم، في سبيل مكسب خسيس."]]}], "kwAr": "أساتذة في الشريعة", "noteAr": ""}, {"kw": "understanding", "raw": "1Ti_6:4; Isa_29:13, Isa_29:14; Jer_8:8, Jer_8:9; Mat_15:14, Mat_21:27, Mat_23:16-24; Joh_3:9, Joh_3:10; Joh_9:40,Joh_9:41; Rom_1:22; 2Ti_3:7; 2Pe_2:12", "note": "", "refs": [{"l": "1Ti 6:4", "n": "", "vs": [[4, "فهو قد انتفخ تكبرا، ولا يعرف شيئا، وإنما هو مهووس بالمجادلات والمنازعات الكلامية، ومنها ينشأ الحسد والخصام والتجريح والنيات السيئة،"]]}, {"l": "Isa 29:13", "n": "", "vs": [[13, "لذلك يقول الرب: لأن هذا الشعب يقترب مني بفمه ويكرمني بشفتيه، بينما قلبه بعيد عنى. وما مخافتهم مني سوى تقليد تلقنوه من الناس."]]}, {"l": "Isa 29:14", "n": "", "vs": [[14, "لذلك سأنتقم من هؤلاء المنافقين، فتبيد حكمة حكمائه وتتلاشى فطنة فهمائه."]]}, {"l": "Jer 8:8", "n": "", "vs": [[8, "كيف تدعون أنكم حكماء ولديكم شريعة الرب بينما حولها قلم الكتبة المخادع إلى أكذوبة؟"]]}, {"l": "Jer 8:9", "n": "", "vs": [[9, "سيلحق الخزي بالحكماء ويعتريهم الفزع والذهول، لأنهم رفضوا كلمة الرب. إذا أية حكمة فيهم؟"]]}, {"l": "Mat 15:14", "n": "", "vs": [[14, "دعوهم وشأنهم، فهم عميان يقودون عميانا. وإذا كان الأعمى يقود أعمى، يسقطان معا في حفرة»."]]}, {"l": "Mat 21:27", "n": "", "vs": [[27, "فأجابوه: «لا ندري!» فرد قائلا: «ولا أنا أقول لكم بأية سلطة أفعل ما أفعله…"]]}, {"l": "Mat 23:16-24", "n": "", "vs": [[16, "الويل لكم أيها القادة العميان! تقولون: من أقسم بالهيكل، فقسمه غير ملزم؛ أما من أقسم بذهب الهيكل، فقسمه ملزم!"], [17, "أيها الجهال والعميان! أي الاثنين أعظم: الذهب أم الهيكل الذي يجعل الذهب مقدسا؟"], [18, "وتقولون: من أقسم بالمذبح، فقسمه غير ملزم؛ أما من أقسم بالقربان الذي على المذبح، فقسمه ملزم!"], [19, "أيها العميان! أي الاثنين أعظم: القربان أم المذبح الذي يجعل القربان مقدسا؟"], [20, "فإن من أقسم بالمذبح، فقد أقسم به وبكل ما عليه؛"], [21, "ومن أقسم بالهيكل، فقد أقسم به وبالساكن فيه؛"], [22, "ومن أقسم بالسماء، فقد أقسم بعرش الله وبالجالس عليه!"], [23, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تؤدون حتى عشور النعنع والشبث والكمون، وقد أهملتم أهم ما في الشريعة: العدل والرحمة والأمانة. كان يجب أن تفعلوا هذه ولا تغفلوا تلك!"], [24, "أيها القادة العميان! إنكم تصفون الماء من البعوضة، ولكنكم تبلعون الجمل!"]]}, {"l": "Joh 3:9", "n": "", "vs": [[9, "فعاد نيقوديموس يسأل: «كيف يمكن أن يتم هذا؟»"]]}, {"l": "Joh 3:10", "n": "", "vs": [[10, "أجابه يسوع: «أنت معلم إسرائيل ولا تعلم هذا!"]]}, {"l": "Joh 9:40", "n": "", "vs": [[40, "فسمع ذلك بعض الفريسيين الذين كانوا معه فسألوه: «وهل نحن أيضا عميان؟»"]]}, {"l": "Joh 9:41", "n": "", "vs": [[41, "فأجابهم يسوع: «لو كنتم عميانا بالفعل، لما كانت عليكم خطيئة. ولكنكم تدعون أنكم تبصرون، ولذلك فإن خطيئتكم باقية...»"]]}, {"l": "Rom 1:22", "n": "", "vs": [[22, "وفيما يدعون أنهم حكماء، صاروا جهالا،"]]}, {"l": "2Ti 3:7", "n": "", "vs": [[7, "يصغين للتعليم دائما، ولا يستطعن أبدا أن يبلغن معرفة الحق بالتمام!"]]}, {"l": "2Pe 2:12", "n": "", "vs": [[12, "حقا إن هؤلاء المعلمين الدجالين الذين يتكلمون كلاما مهينا في أمور يجهلونها، يشبهون الحيوانات المفترسة غير العاقلة، المولودة ليصطادها الناس ويقتلوها. فلابد أن يهلكوا مثلها."]]}], "kwAr": "لا يفهمون", "noteAr": ""}], "arS": [["راغبين", ["G2309"]], [" في أن يكونوا ", []], ["أساتذة في الشريعة", ["G3547"]], ["، وهم لا يفهمون ما ", []], ["يقولون", ["G3004"]], [" ولا ما ", []], ["يقررون", ["G1226"]], ["!", []]]}, {"c": 1, "v": 8, "text": "إننا نعلم أن الشريعة جيدة في ذاتها، إذا استعملت استعمالا شرعيا.", "groups": [{"kw": "the law", "raw": "Deu_4:6-8; Neh_9:13; Psa_19:7-10, Psa_119:96-105, Psa_119:127, Psa_119:128; Rom_7:12, Rom_7:13, Rom_7:16; Rom_7:18, Rom_7:22, Rom_12:2; Gal_3:21", "note": "", "refs": [{"l": "Deu 4:6-8", "n": "", "vs": [[6, "فاحفظوها وطبقوها، لأنها هي حكمتكم وفطنتكم لدى الشعوب الذين يسمعون عن هذه الشرائع، فيقولون: إن هذا الشعب العظيم هو حقا شعب حكيم فطن."], [7, "لأنه أي شعب، مهما عظم، له آلهة قريبة منه مثل الرب إلهنا في كل ما ندعوه؟"], [8, "وأي شعب، مهما عظم، لديه شرائع وأحكام عادلة نظير هذه الشرائع التي أضعها اليوم أمامكم؟"]]}, {"l": "Neh 9:13", "n": "", "vs": [[13, "ونزلت على جبل سيناء وخاطبتهم من السماء، وأعطيتهم أحكاما مستقيمة وشرائع صادقة وفرائض ووصايا صالحة،"]]}, {"l": "Psa 19:7-10", "n": "", "vs": [[7, "شريعة الرب كاملة تنعش النفس. شهادة الرب صادقة تجعل الجاهل حكيما."], [8, "وصايا الرب مستقيمة تفرح القلب. أمر الرب نقي ينير العينين."], [9, "مخافة الرب طاهرة ثابتة إلى الأبد، وأحكام الرب حق وعادلة كلها."], [10, "إنها أشهى من الذهب النقي، وهي أحلى من العسل بل القطر السائل من أقراص الشهد."]]}, {"l": "Psa 119:96-105", "n": "", "vs": [[96, "رأيت لكل كمال حدا، أما وصيتك فلا حد لها."], [97, "كم أحببت شريعتك، إنها موضوع تأملي طول النهار."], [98, "وصيتك جعلتني أحكم من أعدائي، لأنها نصيبي إلى الأبد."], [99, "صرت أكثر فهما من معلمي، لأن شهاداتك هي موضوع تأملي."], [100, "صرت أكثر فطنة من الشيوخ، لأني راعيت وصاياك."], [101, "منعت قدمي عن سلوك كل طريق شر، لكي أحفظ كلامك."], [102, "لم أبتعد عن أحكامك لأنك هكذا علمتني."], [103, "ما أحلى أقوالك لمذاقي. إنها أحلى من العسل في فمي."], [104, "من وصاياك اكتسبت فطنة لذلك أبغضت كل طريق باطل."], [105, "سراج لرجلي كلامك ونور لسبيلي."]]}, {"l": "Psa 119:127", "n": "", "vs": [[127, "لذلك أحب وصاياك أكثر من الذهب الخالص،"]]}, {"l": "Psa 119:128", "n": "", "vs": [[128, "ولأني أحسب كل فرائضك مستقيمة في كل شيء، أبغض كل طريق باطل."]]}, {"l": "Rom 7:12", "n": "", "vs": [[12, "فالشريعة إذن مقدسة، والوصية مقدسة وعادلة وصالحة."]]}, {"l": "Rom 7:13", "n": "", "vs": [[13, "فهل صار ما هو صالح موتا لي؟ حاشا! ولكن الخطيئة، لكي تظهر أنها خطيئة، أنتجت لي الموت بما هو صالح، حتى تصير الخطيئة خاطئة جدا بسبب الوصية."]]}, {"l": "Rom 7:16", "n": "", "vs": [[16, "فما دمت أعمل ما لا أريده، فإني أصادق على صواب الشريعة."]]}, {"l": "Rom 7:18", "n": "", "vs": [[18, "لأنني أعلم أنه في، أي في جسدي، لا يسكن الصلاح: فأن أريد الصلاح ذلك متوفر لدي؛ وأما أن أفعله، فذلك لا أستطيعه."]]}, {"l": "Rom 7:22", "n": "", "vs": [[22, "أن لدي الشر. فإنني، وفقا للإنسان الباطن في، أبتهج بشريعة الله."]]}, {"l": "Rom 12:2", "n": "", "vs": [[2, "ولا تتكيفوا مع هذا العالم، بل تغيروا بتجديد الذهن، لتميزوا ما هي إرادة الله الصالحة المقبولة الكاملة."]]}, {"l": "Gal 3:21", "n": "", "vs": [[21, "فهل تناقض الشريعة وعود الله؟ حاشا! فلو أعطيت شريعة قادرة أن تحيي، لكان البر بالحقيقة على مبدأ الشريعة."]]}], "kwAr": "الشريعة جيدة", "noteAr": ""}, {"kw": "lawfully", "raw": "2Ti_2:5", "note": "", "refs": [{"l": "2Ti 2:5", "n": "", "vs": [[5, "كما أن المصارع لا يفوز بالإكليل إلا إذا صارع بحسب القوانين."]]}], "kwAr": "استعمالا شرعيا", "noteAr": ""}], "arS": [["إننا ", []], ["نعلم", ["G1492"]], [" أن ", []], ["الشريعة", ["G3551"]], [" ", []], ["جيدة", ["G2570"]], [" في ذاتها، إذا ", []], ["استعملت", ["G5530"]], [" استعمالا ", []], ["شرعيا", ["G3545"]], [".", []]]}, {"c": 1, "v": 9, "text": "إذ ندرك أن الشريعة لا تطبق على من كان بارا، بل على الأشرار والمتمردين، على الفاجرين والخاطئين، والنجسين والدنسين، وقاتلي آبائهم وأمهاتهم، وقاتلي الناس،", "groups": [{"kw": "the law", "raw": "Rom_4:13, Rom_5:20, Rom_6:14; Gal_3:10-14, Gal_3:19, Gal_5:23", "note": "", "refs": [{"l": "Rom 4:13", "n": "", "vs": [[13, "فليس على أساس الشريعة كان الوعد لإبراهيم، أو لنسله، بأن يكون وارثا للعالم، وإنما على أساس البر الذي بالإيمان."]]}, {"l": "Rom 5:20", "n": "", "vs": [[20, "وأما الشريعة فقد أدخلت لتظهر كثرة المعصية. ولكن، حيث كثرت الخطيئة، تتوافر النعمة أكثر جدا،"]]}, {"l": "Rom 6:14", "n": "", "vs": [[14, "فلن يكون للخطيئة سيادة عليكم، إذ لستم خاضعين للشريعة بل للنعمة."]]}, {"l": "Gal 3:10-14", "n": "", "vs": [[10, "أما جميع الذين على مبدأ أعمال الشريعة، فإنهم تحت اللعنة، لأنه قد كتب: «ملعون كل من لا يثبت على العمل بكل ما هو مكتوب في كتاب الشريعة!»"], [11, "أما أن أحدا لا يتبر ر عند الله بفضل الشريعة، فذلك واضح، لأن «من تبرر بالإيمان فبالإيمان يحيا»."], [12, "ولكن الشريعة لا تراعي مبدأ الإيمان، بل «من عمل بهذه الوصايا، يحيا بها»."], [13, "إن المسيح حررنا بالفداء من لعنة الشريعة، إذ صار لعنة عوضا عنا، لأنه قد كتب: «ملعون كل من علق على خشبة»،"], [14, "لكي تصل بركة إبراهيم إلى الأمم في المسيح يسوع، فننال عن طريق الإيمان الروح الموعود."]]}, {"l": "Gal 3:19", "n": "", "vs": [[19, "فلماذا الشريعة إذن؟ إنها فقط أضيفت إظهارا للمعاصي، إلى أن يجيء «النسل» الذي قطع له الوعد، وقد رتبت بملائكة وعلى يد وسيط."]]}, {"l": "Gal 5:23", "n": "", "vs": [[23, "والوداعة وضبط النفس. وليس من قانون يمنع مثل هذه الفضائل."]]}], "kwAr": "الشريعة", "noteAr": ""}, {"kw": "the lawless", "raw": "2Th_2:8 *Gr.", "note": "", "refs": [{"l": "2Th 2:8", "n": "*Gr.", "vs": [[8, "عندئذ سيظهر الإنسان المتمرد ظهورا جليا فيبيده الرب يسوع بنفخة فمه ويلاشيه ببهاء ظهوره عند عودته."]]}], "kwAr": "الأشرار", "noteAr": ""}, {"kw": "disobedient", "raw": "Rom_1:30; Tit_1:16, Tit_3:3; Heb_11:31; 1Pe_2:7, 1Pe_3:20", "note": "", "refs": [{"l": "Rom 1:30", "n": "", "vs": [[30, "مغتابون، كارهون لله، شتامون، متكبرون، متفاخرون، مخترعون للشرور، غير طائعين للوالدين."]]}, {"l": "Tit 1:16", "n": "", "vs": [[16, "يشهدون معترفين بأنهم يعرفون الله ، ولكنهم بأعمالهم ينكرونه، لأنهم مكروهون وغير طائعين، وقد تبين أنهم غير أهل لكل عمل صالح."]]}, {"l": "Tit 3:3", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."]]}, {"l": "Heb 11:31", "n": "", "vs": [[31, "وجزاء للإيمان، نجت راحاب الزانية من الموت المحتم مع المتمردين، بعدما استقبلت الجاسوسين بسلام."]]}, {"l": "1Pe 2:7", "n": "", "vs": [[7, "فإن هذا الحجر هو ثمين في نظركم، أنتم المؤمنين به. أما بالنسبة إلى الذين لا يؤمنون، «فالحجر الذي رفضه البناؤون صار هو الحجر الأساسي رأس زاوية البيت»،"]]}, {"l": "1Pe 3:20", "n": "", "vs": [[20, "وذلك بعدما رفضوا البشارة في أيام نوح، عندما كان الله يتأنى صابرا طوال المدة التي كان نوح يبني فيها السفينة، التي نجا بها عدد قليل من الناس عبر الماء، ثمانية أشخاص فقط!"]]}], "kwAr": "والمتمردين", "noteAr": ""}, {"kw": "the ungodly", "raw": "1Pe_4:18", "note": "", "refs": [{"l": "1Pe 4:18", "n": "", "vs": [[18, "وإن كان البار يخلص بجهد، فماذا يحدث للشرير والخاطيء؟"]]}], "kwAr": "الفاجرين", "noteAr": ""}, {"kw": "profane", "raw": "Jer_23:11; Eze_21:25; Heb_12:16", "note": "", "refs": [{"l": "Jer 23:11", "n": "", "vs": [[11, "ويقول الرب: «النبي والكاهن كافران، وفي بيتي وجدت شرهما."]]}, {"l": "Eze 21:25", "n": "", "vs": [[25, "وأنت أيها المطعون الأثيم، ملك إسرائيل، يامن أزف يومه في ساعة العقاب النهائي"]]}, {"l": "Heb 12:16", "n": "", "vs": [[16, "وحذار أن يكون بينكم زان أو مستهتر مثل عيسو الذي باع حقوقه بوصفه الابن البكر، لقاء أكلة واحدة."]]}], "kwAr": "والدنسين", "noteAr": ""}, {"kw": "murderers", "raw": "Lev_20:9; Deu_27:16; 2Sa_16:11, 2Sa_17:1-4; 2Ki_19:37; 2Ch_32:21; Pro_20:20; Pro_28:24, Pro_30:11, Pro_30:17; Mat_10:21", "note": "", "refs": [{"l": "Lev 20:9", "n": "", "vs": [[9, "كل من شتم أباه أو أمه يقتل لأنه شتم أباه أو أمه، لذلك دمه عليه."]]}, {"l": "Deu 27:16", "n": "", "vs": [[16, "ملعون كل من يستخف بأبيه وأمه. ويقول جميع الشعب: آمين."]]}, {"l": "2Sa 16:11", "n": "", "vs": [[11, "وقال الملك لأبيشاي وسائر رجاله: «هوذا ابني الذي خرج من صلبي يسعى لقتلي، فكم بالحري هذا البنياميني. دعوه يشتم لأن الرب أمره بشتمي."]]}, {"l": "2Sa 17:1-4", "n": "", "vs": [[1, "وقال أخيتوفل لأبشالوم: «دعني أختار اثني عشر ألف رجل لأقوم وأتعقب بهم داود هذه الليلة،"], [2, "فأهاجمه وهو متعب خائر القوى، فأثير الذعر بين رجاله، فينفضون من حوله، وأقتل الملك وحده."], [3, "وأرد جميع الشعب إليك، لأن موت الرجل الذي تطلبه معناه رجوع الجميع للالتفاف حولك، ولا ينال الأذى أي واحد من الناس»."], [4, "فاستحسن أبشالوم وقادة بني إسرائيل هذا الرأي."]]}, {"l": "2Ki 19:37", "n": "", "vs": [[37, "وفيما هو يتعبد في هيكل إلهه نسروخ، اغتاله ابناه، أدرملك وشرآصر، وفرا إلى أرض أراراط، فخلفه ابنه آسرحدون على العرش."]]}, {"l": "2Ch 32:21", "n": "", "vs": [[21, "فأرسل الرب ملاكا فأباد كل بطل صنديد ورئيس وقائد في معسكر ملك أشور، فرجع إلى أرضه مخذولا. وعندما دخل معبد إلهه اغتاله هناك أولاده بالسيف"]]}, {"l": "Pro 20:20", "n": "", "vs": [[20, "من يشتم أباه أو أمه يطفيء الرب سراج حياته في الظلمة الحالكة."]]}, {"l": "Pro 28:24", "n": "", "vs": [[24, "من يسلب أباه وأمه قائلا: ليس في هذا إثم، هو شريك الهادم."]]}, {"l": "Pro 30:11", "n": "", "vs": [[11, "رب جيل يشتم أباه ولا يبارك أمه."]]}, {"l": "Pro 30:17", "n": "", "vs": [[17, "العين الساخرة بالأب، والتي تحتقر طاعة أمها، تقتلعها غربان الوادي، وتلتهمها فراخ النسور."]]}, {"l": "Mat 10:21", "n": "", "vs": [[21, "وسوف يسلم الأخ أخاه إلى الموت، والأب ولده. ويتمرد الأولاد على والديهم، ويقتلونهم!"]]}], "kwAr": "وقاتلي آبائهم وأمهاتهم", "noteAr": ""}, {"kw": "manslayers", "raw": "Gen_9:5, Gen_9:6; Exo_20:13, Exo_21:14; Num_35:30-33; Deu_21:6-9; Pro_28:17; Gal_5:21; Rev_21:8, Rev_22:15", "note": "", "refs": [{"l": "Gen 9:5", "n": "", "vs": [[5, "وأطالب أنا بدمكم لأنفسكم. من يد كل حيوان أطالب به، ومن يد الإنسان أيضا أطالب الأخ بنفس أخيه الإنسان."]]}, {"l": "Gen 9:6", "n": "", "vs": [[6, "فسافك دم الإنسان يحكم عليه بسفك دمه لأن الله خلق الإنسان على صورته."]]}, {"l": "Exo 20:13", "n": "", "vs": [[13, "لا تقتل."]]}, {"l": "Exo 21:14", "n": "", "vs": [[14, "ولكن إذا تآمر أحد على آخر وتعمد قتله، فسقه للموت حتى ولو احتمى بمذبحي"]]}, {"l": "Num 35:30-33", "n": "", "vs": [[30, "كل من يقتل نفسا يحكم عليه بالموت بشهادة شهود، ولكن لا يحكم على أحد بالموت بشهادة شاهد واحد فقط."], [31, "لا تقبلوا فدية عن نفس القاتل الذي وجب عليه الحكم بالموت، بل يجب أن يقتل."], [32, "ولا تقبلوا فدية من القاتل غير المتعمد الذي لاذ بمدينة ملجئه ليرجع للإقامة في أرضه قبل وفاة رئيس الكهنة."], [33, "لا تدنسوا الأرض التي أنتم فيها، لأن سفك الدم يدنس الأرض، ولا يكفر عن الأرض التي سفك عليها الدم إلا بدم السافك."]]}, {"l": "Deu 21:6-9", "n": "", "vs": [[6, "فيغسل جميع شيوخ تلك المدينة القريبة من الجثة أيديهم فوق العجلة المكسورة العنق في الوادي."], [7, "ويقولون: أيدينا لم تسفك هذا الدم، وأعيننا لم تشهده."], [8, "اغفر يارب لشعبك إسرائيل الذي افتديته، ولا تطالبنا بدم بريء سفك في وسط شعبك إسرائيل. فيصفح الرب عن سفك هذا الدم."], [9, "وهكذا تبرأون من سفك الدم البريء في وسطكم، إذا صنعتم ما هو صالح في عيني الرب."]]}, {"l": "Pro 28:17", "n": "", "vs": [[17, "من هو مثقل بارتكاب سفك دم، يظل طريدا حتى وفاته، ولا يعينه أحد."]]}, {"l": "Gal 5:21", "n": "", "vs": [[21, "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!"]]}, {"l": "Rev 21:8", "n": "", "vs": [[8, "أما الجبناء وغير المؤمنين، والفاسدون والقاتلون والزناة، والمتصلون بالشياطين وعبدة الأصنام وجميع الدجالين، فمصيرهم إلى البحيرة المتقدة بالنار والكبريت، الذي هو الموت الثاني»."]]}, {"l": "Rev 22:15", "n": "", "vs": [[15, "أما في خارج المدينة، فهنالك الكلاب والمتصلون بالشياطين، والزناة والقتلة، وعبدة الأصنام والدجالون ومحبو التدجيل!"]]}], "kwAr": "وقاتلي الناس", "noteAr": ""}], "arS": [["إذ ", []], ["ندرك", ["G1492"]], [" أن ", []], ["الشريعة", ["G3551"]], [" لا ", []], ["تطبق", ["G2749"]], [" على من كان ", []], ["بارا", ["G1342"]], ["، بل على ", []], ["الأشرار", ["G459"]], [" ", []], ["والمتمردين", ["G506"]], ["، على ", []], ["الفاجرين", ["G765"]], [" ", []], ["والخاطئين", ["G268"]], ["، ", []], ["والنجسين", ["G462"]], [" ", []], ["والدنسين", ["G952"]], ["، ", []], ["وقاتلي آبائهم", ["G3964"]], [" ", []], ["وأمهاتهم", ["G3389"]], ["، ", []], ["وقاتلي الناس", ["G409"]], ["،", []]]}, {"c": 1, "v": 10, "text": "والزناة ومضاجعي الذكور، وخطافي الناس والكذابين وشاهدي الزور. وذوي كل شر آخر يخالف التعليم الصحيح", "groups": [{"kw": "whoremongers", "raw": "Mar_7:21, Mar_7:22; 1Co_6:9, 1Co_6:10; Gal_5:19-21; Eph_5:3-6; Heb_13:4", "note": "", "refs": [{"l": "Mar 7:21", "n": "", "vs": [[21, "فإنه من الداخل، من قلوب الناس، تنبع الأفكار الشريرة، الفسق، السرقة، القتل،"]]}, {"l": "Mar 7:22", "n": "", "vs": [[22, "الزنى، الطمع، الخبث، الخداع، العهارة، العين الشريرة، التجديف، الكبرياء، الحماقة"]]}, {"l": "1Co 6:9", "n": "", "vs": [[9, "أما تعلمون أن الظالمين لن يرثوا ملكوت الله؟ لا تضلوا: فإن ملكوت الله لن يرثه الزناة ولا عابدو الأصنام ولا الفاسقون ولا المتخنثون ولا مضاجعو الذكور"]]}, {"l": "1Co 6:10", "n": "", "vs": [[10, "ولا السراقون ولا الطماعون ولا السكيرون ولا الشتامون ولا المغتصبون."]]}, {"l": "Gal 5:19-21", "n": "", "vs": [[19, "أما أعمال الجسد فظاهرة، وهي: الزنى والنجاسة والدعارة،"], [20, "وعبادة الأصنام والسحر، والعداوة والنزاع والغيرة والغضب، والتحزب والانقسام والتعصب،"], [21, "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!"]]}, {"l": "Eph 5:3-6", "n": "", "vs": [[3, "أما الزنى، وكل نجاسة أو شهوة نهمة، فلا يذكر بينكم حتى اسمها، كما يليق بالقديسين."], [4, "وكذلك البذاءة والكلام السفيه والهزل، فهي غير لائقة. وإنما أحرى بكم أن تلهجوا بالشكر لله!"], [5, "فإنكم تعلمون هذا جيدا: أن كل زان أو نجس أو صاحب شهوة نهمة، ما هو إلا عابد أصنام، ليس له ميراث في ملكوت المسيح والله."], [6, "لا يخدعكم أحد بكلام باطل! فبسبب هذه الأمور يحل غضب الله على أبناء العصيان."]]}, {"l": "Heb 13:4", "n": "", "vs": [[4, "حافظوا جميعا على كرامة الزواج، مبعدين النجاسة عن الفراش. فإن الله سوف يعاقب الذين ينغمسون في خطايا الدعارة والزنى."]]}], "kwAr": "والزناة", "noteAr": ""}, {"kw": "defile", "raw": "Gen_19:5; Lev_18:22, Lev_20:13; Rom_1:26; Jud_1:7", "note": "", "refs": [{"l": "Gen 19:5", "n": "", "vs": [[5, "ونادوا لوطا: «أين الرجلان اللذان استضفتهما الليلة؟ أخرجهما إلينا لنضاجعهما»."]]}, {"l": "Lev 18:22", "n": "", "vs": [[22, "لا تضاجع ذكرا مضاجعة امرأة. إنها رجاسة،"]]}, {"l": "Lev 20:13", "n": "", "vs": [[13, "وإذا ضاجع رجل ذكرا مضاجعة امرأة، فكلاهما يقتلان لأنهما ارتكبا رجسا. ويكون دمهما على رأسيهما."]]}, {"l": "Rom 1:26", "n": "", "vs": [[26, "لهذا السبب أسلمهم الله إلى الشهوات المخزية. فإن إناثهم تحولن عن استعمال أجسادهن بالطريقة الطبيعية إلى استعمالها بطريقة مخالفة للطبيعة."]]}, {"l": "Jud 1:7", "n": "", "vs": [[7, "وتعرفون كذلك ما فعله الرب بمدينتي سدوم وعمورة وبالمدن التي حولهما. فقد كان أهل هذه المدن، مثل أولئك المعلمين، مندفعين وراء الزنى، ومنغمسين في شهوات مخالفة للطبيعة. لذلك عاقب الرب هذه المدن بالنار الأبدية، فدمرها. فكانت بذلك عبرة للآخرين."]]}], "kwAr": "ومضاجعي الذكور", "noteAr": ""}, {"kw": "menstealers", "raw": "Gen_37:27, Gen_40:15; Exo_21:16; Deu_24:7; Rev_18:13", "note": "", "refs": [{"l": "Gen 37:27", "n": "", "vs": [[27, "تعالوا نبيعه إلى الإسماعيليين ونبرىء أيدينا من دمه لأنه أخونا ومن لحمنا». فوافق إخوته على رأيه."]]}, {"l": "Gen 40:15", "n": "", "vs": [[15, "لأنني حملت عنوة من أرض العبرانيين، وهنا أيضا لم أجن شيئا ليزجوا بي في هذا السجن»."]]}, {"l": "Exo 21:16", "n": "", "vs": [[16, "من يخطف إنسانا ويبعه أو يسترقه عنده حتما يمت."]]}, {"l": "Deu 24:7", "n": "", "vs": [[7, "إذا خطف رجل أحدا من بني إسرائيل إخوته واسترقه وباعه، يموت الخاطف. فتجتثون الشر من بينكم."]]}, {"l": "Rev 18:13", "n": "", "vs": [[13, "والقرفة والبهار، والعطور والطيب والبخور، والخمر والزيت والدقيق والحبوب، والبهائم والغنم، والخيل والمركبات، والأجساد والنفوس البشرية"]]}], "kwAr": "وخطافي الناس", "noteAr": ""}, {"kw": "for liars", "raw": "Joh_8:44; Rev_21:8, Rev_21:27, Rev_22:15", "note": "", "refs": [{"l": "Joh 8:44", "n": "", "vs": [[44, "إنكم أولاد أبيكم إبليس، وترغبون أن تعملوا شهوات أبيكم. فهو من البدء كان قاتلا للناس، ولم يثبت في الحق لأنه خال من الحق! وعندما ينطق بالكذب فهو ينضح بما فيه، لأنه كذاب وأبو الكذب!"]]}, {"l": "Rev 21:8", "n": "", "vs": [[8, "أما الجبناء وغير المؤمنين، والفاسدون والقاتلون والزناة، والمتصلون بالشياطين وعبدة الأصنام وجميع الدجالين، فمصيرهم إلى البحيرة المتقدة بالنار والكبريت، الذي هو الموت الثاني»."]]}, {"l": "Rev 21:27", "n": "", "vs": [[27, "ولن يدخلها شيء نجس، ولا الذين يعملون القبائح ويدجلون، بل فقط الذين كتبت أسماؤهم في سجل الحياة للحمل!"]]}, {"l": "Rev 22:15", "n": "", "vs": [[15, "أما في خارج المدينة، فهنالك الكلاب والمتصلون بالشياطين، والزناة والقتلة، وعبدة الأصنام والدجالون ومحبو التدجيل!"]]}], "kwAr": "والكذابين", "noteAr": ""}, {"kw": "perjured", "raw": "Exo_20:7; Eze_17:16-19; Hos_4:1, Hos_4:2, Hos_10:4; Zec_5:4, Zec_8:17; Mal_3:5; Mat_5:33-37", "note": "", "refs": [{"l": "Exo 20:7", "n": "", "vs": [[7, "لا تنطق باسم الرب إلهك باطلا، لأن الرب يعاقب من نطق باسمه باطلا."]]}, {"l": "Eze 17:16-19", "n": "", "vs": [[16, "حي أنا يقول السيد الرب، إنه يموت عنده في بابل، مدينة الملك الذي نصبه ملكا، فازدرى هو حلفه، ونكث عهده."], [17, "ولن يغيثه فرعون بجيوشه العظيمة وجموعه الغفيرة في القتال، حين تقام المتاريس وتبنى بروج الحصار للقضاء على نفوس كثيرة."], [18, "لقد ازدرى الحلف حين نكث العهد، وها هو قد مد يد الولاء إلى مصر. ولكنه وإن فعل هذا كله لن يفلت."], [19, "لذلك، هذا ما يقوله السيد الرب: حي أنا؛ إن حلفي الذي ازدراه، وعهدي الذي نكثه لابد أن يقعا على رأسه."]]}, {"l": "Hos 4:1", "n": "", "vs": [[1, "اسمعوا كلمة الرب يابني إسرائيل، لأن للرب دعوى على أهل الأرض إذ خلت الأرض من الأمانة والإحسان ومعرفة الله."]]}, {"l": "Hos 4:2", "n": "", "vs": [[2, "وتفشت فيها اللعنة والكذب والقتل والسرقة والفسق. قد تخطوا كل حد، وسفك الدم يعقبه سفك دم."]]}, {"l": "Hos 10:4", "n": "", "vs": [[4, "ينطقون بكلام لغو ويبرمون عهودا بأقسام باطلة، فيحل بهم القضاء كأعشاب سامة نبتت في أرض محروثة."]]}, {"l": "Zec 5:4", "n": "", "vs": [[4, "ويقول الرب القدير: «إني أصب هذه اللعنة على بيت كل سارق أو حالف باسمي زورا، فتحل في وسط بيته وتبيده مع خشبه وحجره»."]]}, {"l": "Zec 8:17", "n": "", "vs": [[17, "لا يضمر أحدكم شرا في قلبه لقريبه، ولا تحلفوا يمين زور، فإن هذه جميعها مقتها، يقول الرب»."]]}, {"l": "Mal 3:5", "n": "", "vs": [[5, "وأقترب منكم لأكون شاهدا سريعا ضد السحرة والزناة والحالفين بالزور والمستغلين لأجرة العامل ومضطهدي الأرامل والأيتام، والذين يظلمون الغرباء ولا يخافونني"]]}, {"l": "Mat 5:33-37", "n": "", "vs": [[33, "وسمعتم أنه قيل للأقدمين: لا تخالف قسمك، بل أوف للرب ما نذرته له."], [34, "أما أنا فأقول لكم: لا تحلفوا أبدا، لا بالسماء لأنها عرش الله،"], [35, "ولا بالأرض لأنها موطيء قدميه، ولا بأورشليم لأنها مدينة الملك الأعظم."], [36, "ولا تحلف برأسك لأنك لا تقدر أن تجعل شعرة واحدة فيها بيضاء أو سوداء."], [37, "ليكن كلامكم: نعم، إن كان نعم؛ أو: لا، إن كان لا. وما زاد على ذلك فهو من الشرير."]]}], "kwAr": "وشاهدي الزور", "noteAr": ""}, {"kw": "contrary", "raw": "1Ti_6:3; 2Ti_1:13, 2Ti_4:3; Tit_1:9, Tit_2:1", "note": "", "refs": [{"l": "1Ti 6:3", "n": "", "vs": [[3, "أما إذا كان أحد يعلم ما يخالفها ولا يذعن للكلام الصحيح، كلام ربنا يسوع المسيح، وللتعليم الموافق للتقوى،"]]}, {"l": "2Ti 1:13", "n": "", "vs": [[13, "اتخذ من الكلام الصحيح الذي سمعته مني مثالا في الإيمان والمحبة اللذين في المسيح يسوع."]]}, {"l": "2Ti 4:3", "n": "", "vs": [[3, "فإنه سيأتي زمان لا يطيق الناس فيه التعليم الصحيح، بل تبعا لشهواتهم الخاصة يكدسون لأنفسهم معلمين (يقولون لهم كلاما) يداعب الآذان."]]}, {"l": "Tit 1:9", "n": "", "vs": [[9, "ملتصقا بالكلمة الصادقة الموافقة للتعليم، ليكون قادرا على تشجيع المؤمنين بالتعليم الصحيح وعلى إفحام المعارضين."]]}, {"l": "Tit 2:1", "n": "", "vs": [[1, "أما أنت، فعلم بما يوافق التعليم الصحيح:"]]}], "kwAr": "يخالف التعليم الصحيح", "noteAr": ""}], "arS": [["والزناة", ["G4205"]], [" ", []], ["ومضاجعي الذكور", ["G733"]], ["، ", []], ["وخطافي الناس", ["G405"]], [" ", []], ["والكذابين", ["G5583"]], [" ", []], ["وشاهدي الزور", ["G1965"]], [". وذوي كل شر ", []], ["آخر", ["G2087"]], [" ", []], ["يخالف", ["G480"]], [" ", []], ["التعليم", ["G1319"]], [" ", []], ["الصحيح", ["G5198"]]]}, {"c": 1, "v": 11, "text": "الموافق لإنجيل مجد الله المبارك، ذلك الإنجيل الذي وضع أمانة بين يدي.", "groups": [{"kw": "According", "raw": "Rom_2:16", "note": "", "refs": [{"l": "Rom 2:16", "n": "", "vs": [[16, "(وتكون الدينونة) يوم يدين الله خفايا الناس، وفقا لإنجيلي، على يد يسوع المسيح."]]}], "kwAr": "الموافق", "noteAr": ""}, {"kw": "glorious", "raw": "Psa_138:2; Luk_2:10,Luk_2:11, Luk_2:14; 2Co_3:8-11, 2Co_4:4, 2Co_4:6; Eph_1:6, Eph_1:12, Eph_2:7, Eph_3:10; 1Pe_1:11, 1Pe_1:12", "note": "", "refs": [{"l": "Psa 138:2", "n": "", "vs": [[2, "أسجد في هيكل قدسك، وأحمد اسمك من أجل رحمتك وحقك، لأنك عظمت كلمتك واسمك فوق كل شيء"]]}, {"l": "Luk 2:10", "n": "", "vs": [[10, "فقال لهم الملاك: «لا تخافوا! فها أنا أبشركم بفرح عظيم يعم الشعب كله:"]]}, {"l": "Luk 2:11", "n": "", "vs": [[11, "فقد ولد لكم اليوم في مدينة داود مخلص هو المسيح الرب."]]}, {"l": "Luk 2:14", "n": "", "vs": [[14, "«المجد لله في الأعالي، وعلى الأرض السلام؛ وبالناس المسرة! »"]]}, {"l": "2Co 3:8-11", "n": "", "vs": [[8, "أفليس أحرى أن تكون خدمة الروح راسخة في المجد؟"], [9, "فبما أن خدمة الدينونة كانت مجدا، فأحرى كثيرا أن تفوقها في المجد خدمة البر."], [10, "حتى إن ما قد مجد سابقا لا يكون قد مجد على هذا النحو بالنظر إلى المجد الفائق."], [11, "فإذا كان الزائل قد صاحبه المجد، فأحرى كثيرا أن يصاحب المجد ما هو باق دائما."]]}, {"l": "2Co 4:4", "n": "", "vs": [[4, "الذين أعمى إله هذا العالم أذهانهم حتى لا يضيء لهم نور الإنجيل المختص بمجد المسيح الذي هو صورة الله."]]}, {"l": "2Co 4:6", "n": "", "vs": [[6, "فإن الله ، الذي أمر أن يشرق نور من الظلام، هو الذي جعل النور يشرق في قلوبنا، لإشعاع معرفة مجد الله المتجلي في وجه المسيح."]]}, {"l": "Eph 1:6", "n": "", "vs": [[6, "بغرض مدح مجد نعمته التي بها أعطانا حظوة لديه في المحبوب:"]]}, {"l": "Eph 1:12", "n": "", "vs": [[12, "والغاية أن نكون سببا لمدح مجده بعدما سبق لنا أن وضعنا رجاءنا في المسيح."]]}, {"l": "Eph 2:7", "n": "", "vs": [[7, "وذلك كي يعرض في الدهور القادمة غنى نعمته الفائق في لطفه علينا في المسيح يسوع."]]}, {"l": "Eph 3:10", "n": "", "vs": [[10, "والغاية أن يتجلى الآن أمام الرئاسات والسلطات في الأماكن السماوية ما يظهر في الكنيسة من حكمة الله المتعددة الوجوه،"]]}, {"l": "1Pe 1:11", "n": "", "vs": [[11, "واجتهدوا لمعرفة الزمان والأحوال التي كان يشير إليها روح المسيح الذي كان عاملا فيهم، عندما شهد لهم مسبقا بما ينتظر المسيح من آلام، وبما يأتي بعدها من أمجاد."]]}, {"l": "1Pe 1:12", "n": "", "vs": [[12, "ولكن الله أوحى إليهم أن اجتهادهم لم يكن لمصلحتهم هم، بل لمصلحتكم أنتم. فقد كان ذلك من أجل البشارة التي نقلها إليكم في الزمان الحاضر مبشرون يؤيدهم الروح القدس المرسل من السماء. ويالها من أمور يتمنى حتى الملائكة أن يطلعوا عليها!"]]}], "kwAr": "لإنجيل مجد الله", "noteAr": ""}, {"kw": "the blessed", "raw": "1Ti_6:15", "note": "", "refs": [{"l": "1Ti 6:15", "n": "", "vs": [[15, "هذا الظهور سوف يتممه الله في وقته الخاص، هو السيد المبارك الأوحد، ملك الملوك ورب الأرباب،"]]}], "kwAr": "المبارك", "noteAr": ""}, {"kw": "which", "raw": "1Ti_2:7, 1Ti_6:20; 1Co_4:1, 1Co_4:2, 1Co_9:17; 2Co_5:18-20; Gal_2:7; Col_1:25; 1Th_2:4; 2Ti_1:11, 2Ti_1:14, 2Ti_2:2; Tit_1:3", "note": "", "refs": [{"l": "1Ti 2:7", "n": "", "vs": [[7, "ولها قد عينت أنا مبشرا ورسولا، الحق أقول ولست أكذب، معلما للأمم في الإيمان والحق."]]}, {"l": "1Ti 6:20", "n": "", "vs": [[20, "ياتيموثاوس، حافظ على الأمانة المودعة لديك. تجنب الكلام الدنس الباطل، ومناقضات ما يسمى زورا «معرفة»."]]}, {"l": "1Co 4:1", "n": "", "vs": [[1, "فلينظر إلينا الناس باعتبارنا خداما للمسيح ووكلاء على أسرار الله."]]}, {"l": "1Co 4:2", "n": "", "vs": [[2, "والمطلوب من الوكلاء، قبل كل شيء، أن يوجد كل منهم أمينا."]]}, {"l": "1Co 9:17", "n": "", "vs": [[17, "فإن قمت بذلك متطوعا، كانت لي مكافأة. ولكن، إن كنت مرغما، فأنا مؤتمن على مسئولية،"]]}, {"l": "2Co 5:18-20", "n": "", "vs": [[18, "وكل شيء هو من عند الله الذي صالحنا مع نفسه بالمسيح، ثم سلمنا خدمة هذه المصالحة."], [19, "ذلك أن الله كان في المسيح مصالحا العالم مع نفسه، غير حاسب عليهم خطاياهم، وقد وضع بين أيدينا رسالة هذه المصالحة."], [20, "فنحن إذن سفراء المسيح، وكأن الله يعظ بنا نتوسل بالنيابة عن المسيح منادين: «تصالحوا مع الله!»"]]}, {"l": "Gal 2:7", "n": "", "vs": [[7, "بل بالعكس، رأوا أنه عهد إلي بالإنجيل لأهل عدم الختان، كما عهد به إلى بطرس لأهل الختان."]]}, {"l": "Col 1:25", "n": "", "vs": [[25, "ولها قد صرت أنا خادما بموجب تدبير الله الموهوب لي من أجلكم، وهو أن أتمم كلمة الله، بإعلان"]]}, {"l": "1Th 2:4", "n": "", "vs": [[4, "بل إننا نتكلم كمن تبين من اختبار الله لهم أنهم أهل لأن يؤتمنوا على الإنجيل، لنرضي لا الناس بل الله الذي يختبر قلوبنا."]]}, {"l": "2Ti 1:11", "n": "", "vs": [[11, "الذي له عينت أنا مبشرا ورسولا ومعلما."]]}, {"l": "2Ti 1:14", "n": "", "vs": [[14, "وحافظ على الأمانة الكريمة المودعة لديك، بالروح القدس الحال فينا."]]}, {"l": "2Ti 2:2", "n": "", "vs": [[2, "والتعاليم التي سمعتها مني بحضور شهود عديدين، أودعها أمانة بين أيدي أناس جديرين بالثقة، يكونون قادرين على تعليم الآخرين."]]}, {"l": "Tit 1:3", "n": "", "vs": [[3, "ثم بين كلمته في أوانها المعين: بالبشارة التي وضعت أمانة بين يدي بموجب أمر مخلصنا الله …"]]}], "kwAr": "وضع أمانة بين يدي", "noteAr": ""}], "arS": [["الموافق", ["G2596"]], [" ", []], ["لإنجيل", ["G2098"]], [" ", []], ["مجد", ["G1391"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["المبارك", ["G3107"]], ["، ذلك الإنجيل الذي ", []], ["وضع أمانة", ["G4100"]], [" بين يدي.", []]]}, {"c": 1, "v": 12, "text": "وكم أشكر المسيح يسوع ربنا الذي أعطاني القدرة وعينني خادما له، إذ اعتبرني جديرا بثقته،", "groups": [{"kw": "I thank", "raw": "Joh_5:23; Phi_2:11; Rev_5:9-14, Rev_7:10-12", "note": "", "refs": [{"l": "Joh 5:23", "n": "", "vs": [[23, "ليكرم الجميع الابن كما يكرمون الآب. ومن لا يكرم الابن لا يكرم الآب الذي أرسله."]]}, {"l": "Phi 2:11", "n": "", "vs": [[11, "ولكي يعترف كل لسان بأن يسوع المسيح هو الرب، لمجد الله الآب."]]}, {"l": "Rev 5:9-14", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"], [10, "وجعلتهم مملكة لإلهنا وكهنة له، وسيملكون على الأرض»."], [11, "ثم نظرت، فسمعت ترتيل الملايين من الملائكة وهي تحيط بالعرش وبالكائنات الحية والشيوخ،"], [12, "وهم يهتفون بصوت عال: «مستحق هو الحمل المذبوح أن ينال القدرة والغنى والحكمة والقوة والإجلال والمجد والبركة»."], [13, "ثم سمعت كل خليقة في السماء وعلى الأرض، وتحت الأرض، وعلى البحر، هاتفة مع كل ما فيها: «البركة والإجلال والمجد والسلطة للجالس على العرش وللحمل، إلى أبد الآبدين»."], [14, "فردت الكائنات الحية الأربعة: «آمين!» وجثا الشيوخ ساجدين."]]}, {"l": "Rev 7:10-12", "n": "", "vs": [[10, "وهم يهتفون بصوت عال: «الخلاص من عند إلهنا الجالس على العرش ومن عند الحمل!»"], [11, "واجتمع الملائكة جميعا حول العرش، ومعهم الشيوخ والكائنات الحية الأربعة، وخروا على وجوههم أمام العرش سجودا لله،"], [12, "قائلين: «آمين! لإلهنا البركة والمجد والحكمة والشكر والإجلال والقدرة والقوة إلى أبد الآبدين. آمين!»"]]}], "kwAr": "كم أشكر", "noteAr": ""}, {"kw": "who", "raw": "1Co_15:10; 2Co_3:5, 2Co_3:6, 2Co_4:1, 2Co_12:9, 2Co_12:10; Phi_4:13; 2Ti_4:17", "note": "", "refs": [{"l": "1Co 15:10", "n": "", "vs": [[10, "ولكن، بنعمة الله صرت على ما أنا عليه الآن، ونعمته الموهوبة لي لم تكن عبثا، إذ عملت جاهدا أكثر من الرسل الآخرين جميعا. إلا أني لم أكن أنا العامل، بل نعمة الله التي كانت معي."]]}, {"l": "2Co 3:5", "n": "", "vs": [[5, "ليس أننا أصحاب كفاءة ذاتية لندعي شيئا لأنفسنا، بل إن كفاءتنا من الله،"]]}, {"l": "2Co 3:6", "n": "", "vs": [[6, "الذي جعلنا أصحاب كفاءة لنكون خداما لعهد جديد قائم لا على الحرف بل على الروح. فالحرف يؤدي إلى الموت؛ أما الروح فيعطي الحياة."]]}, {"l": "2Co 4:1", "n": "", "vs": [[1, "فما دامت لنا إذن هذه الخدمة برحمة من الله، فلا تخور عزيمتنا."]]}, {"l": "2Co 12:9", "n": "", "vs": [[9, "فقال لي: «نعمتي تكفيك، لأن قدرتي تكمل في الضعف!» فأنا أرضى بأن أفتخر مسرورا بالضعفات التي في، لكي تخيم علي قدرة المسيح."]]}, {"l": "2Co 12:10", "n": "", "vs": [[10, "فلأجل المسيح، تسرني الضعفات والإهانات والضيقات والاضطهادات والصعوبات، لأني حينما أكون ضعيفا، فحينئذ أكون قويا!"]]}, {"l": "Phi 4:13", "n": "", "vs": [[13, "إني أستطيع كل شيء، في المسيح الذي يقويني."]]}, {"l": "2Ti 4:17", "n": "", "vs": [[17, "إلا أن الرب وقف بجانبي وأمدني بالقوة، لكي تتم بي المناداة بالبشارة، فيسمعها جميع من هم من الأمم؛ وقد نجوت من فم الأسد."]]}], "kwAr": "الذي أعطاني القدرة", "noteAr": ""}, {"kw": "counted", "raw": "Act_16:15; 1Co_7:25", "note": "", "refs": [{"l": "Act 16:15", "n": "", "vs": [[15, "فلما تعمدت هي وأهل بيتها، دعتنا بإلحاح لقبول ضيافتها قائلة: «إن كنتم قد حكمتم أني مؤمنة بالرب، فانزلوا ضيوفا ببيتي». فاضطرتنا إلى قبول دعوتها."]]}, {"l": "1Co 7:25", "n": "", "vs": [[25, "وأما العزاب، فليس عندي لهم وصية خاصة من الرب، ولكني أعطي رأيا باعتباري نلت رحمة من الرب لأكون جديرا بالثقة."]]}], "kwAr": "اعتبرني جديرا بثقته", "noteAr": ""}, {"kw": "putting", "raw": "1Ti_1:11; Act_9:15; Col_1:25", "note": "", "refs": [{"l": "1Ti 1:11", "n": "", "vs": [[11, "الموافق لإنجيل مجد الله المبارك، ذلك الإنجيل الذي وضع أمانة بين يدي."]]}, {"l": "Act 9:15", "n": "", "vs": [[15, "فأمره الرب: «اذهب! فقد اخترت هذا الرجل ليكون إناء يحمل اسمي إلى الأمم والملوك وبني إسرائيل."]]}, {"l": "Col 1:25", "n": "", "vs": [[25, "ولها قد صرت أنا خادما بموجب تدبير الله الموهوب لي من أجلكم، وهو أن أتمم كلمة الله، بإعلان"]]}], "kwAr": "وعينني خادما", "noteAr": ""}], "arS": [["وكم ", []], ["أشكر", ["G2192", "G5485"]], [" ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["ربنا", ["G2962", "G2257"]], [" الذي ", []], ["أعطاني القدرة", ["G1743"]], [" ", []], ["وعينني", ["G5087"]], [" ", []], ["خادما", ["G1248"]], [" له، إذ ", []], ["اعتبرني", ["G2233"]], [" ", []], ["جديرا بثقته", ["G4103"]], ["،", []]]}, {"c": 1, "v": 13, "text": "مع أني كنت في الماضي مجدفا عليه، ومضطهدا ومهينا له! ولكني عوملت بالرحمة، لأني عملت ما عملته عن جهل وفي عدم إيمان.", "groups": [{"kw": "was", "raw": "Act_8:3, Act_9:1, Act_9:5, Act_9:13, Act_22:4, Act_26:9-11; 1Co_15:9; Gal_1:13; Phi_3:6", "note": "", "refs": [{"l": "Act 8:3", "n": "", "vs": [[3, "أما شاول فكان يحاول إبادة الكنيسة، فيذهب من بيت إلى بيت ويجر الرجال والنساء ويلقيهم في السجن."]]}, {"l": "Act 9:1", "n": "", "vs": [[1, "أما شاول فكان لايزال يفور بالتهديد والقتل على تلاميذ الرب. فذهب إلى رئيس الكهنة،"]]}, {"l": "Act 9:5", "n": "", "vs": [[5, "فسأل: «من أنت ياسيد؟» فجاءه الجواب: «أنا يسوع الذي أنت تضطهده، صعب عليك أن ترفس المناخس»."]]}, {"l": "Act 9:13", "n": "", "vs": [[13, "فقال حنانيا للرب: «ولكني، يارب، قد سمعت من كثيرين بالفظائع التي ارتكبها هذا الرجل بقديسيك في أورشليم،"]]}, {"l": "Act 22:4", "n": "", "vs": [[4, "فاضطهدت هذا الطريق حتى الموت، فكنت أعتقل أتباعه من الرجال والنساء، وأزج بهم في السجون."]]}, {"l": "Act 26:9-11", "n": "", "vs": [[9, "وكنت أعتقد أنه يجب أن أبذل غاية جهدي لأقاوم اسم يسوع الناصري."], [10, "وقد عملت على تنفيذ خطتي في أورشليم بتفويض خاص من رؤساء الكهنة، فألقيت في السجن عددا كبيرا من القديسين. وكنت أعطي صوتي بالموافقة عندما كان المجلس يحكم بإعدامهم."], [11, "وكم عذبتهم في المجامع كلها لأجبرهم على التجديف. وقد بلغ حقدي عليهم درجة جعلتني أطاردهم في المدن التي في خارج البلاد."]]}, {"l": "1Co 15:9", "n": "", "vs": [[9, "فإني أنا أصغر الرسل شأنا، ولست أهلا لأن أدعى رسولا لأني اضطهدت كنيسة الله."]]}, {"l": "Gal 1:13", "n": "", "vs": [[13, "فإنكم قد سمعتم بسيرتي الماضية في الديانة اليهودية، كيف كنت أضطهد كنيسة الله متطرفا إلى أقصى حد، ساعيا إلى تخريبها،"]]}, {"l": "Phi 3:6", "n": "", "vs": [[6, "ومن جهة الحماسة، مضطهد للكنيسة؛ ومن جهة البر المطلوب في الشريعة، كنت بلا لوم."]]}], "kwAr": "كنت في الماضي مجدفا", "noteAr": ""}, {"kw": "but", "raw": "1Ti_1:16; Hos_2:23; Rom_5:20,Rom_5:21, Rom_11:30,Rom_11:31; Heb_4:16; 1Pe_2:10", "note": "", "refs": [{"l": "1Ti 1:16", "n": "", "vs": [[16, "ولكن لهذا السبب عوملت بالرحمة، ليجعل يسوع المسيح مني، أنا أولا، مثالا يظهر صبره الطويل، لجميع الذين سيؤمنون به لنوال الحياة الأبدية."]]}, {"l": "Hos 2:23", "n": "", "vs": [[23, "وأزرع شعبي في الأرض لنفسي، وأرحم لورحامة (أي: لا رحمة)، وأقول: للوعمي (أي: ليس شعبي) أنت شعبي، فيقول: أنت إلهي»."]]}, {"l": "Rom 5:20", "n": "", "vs": [[20, "وأما الشريعة فقد أدخلت لتظهر كثرة المعصية. ولكن، حيث كثرت الخطيئة، تتوافر النعمة أكثر جدا،"]]}, {"l": "Rom 5:21", "n": "", "vs": [[21, "حتى إنه كما ملكت الخطيئة بالموت، فكذلك أيضا تملك النعمة على أساس البر مؤدية إلى الحياة الأبدية بيسوع المسيح ربنا."]]}, {"l": "Rom 11:30", "n": "", "vs": [[30, "والواقع أنه كما كنتم أنتم في الماضي غير مطيعين لله، ولكنكم الآن نلتم الرحمة من جراء عدم طاعتهم هم،"]]}, {"l": "Rom 11:31", "n": "", "vs": [[31, "فكذلك الآن هم غير مطيعين لله. لينالوا هم أيضا الرحمة، من جراء الرحمة التي نلتموها أنتم."]]}, {"l": "Heb 4:16", "n": "", "vs": [[16, "فلنتقدم بثقة إلى عرش النعمة، لننال الرحمة ونجد نعمة تعيننا عند الحاجة."]]}, {"l": "1Pe 2:10", "n": "", "vs": [[10, "فإنكم في الماضي لم تكونوا شعبا؛ أما الآن، فأنتم «شعب الله وقد كنتم سابقا لا تتمتعون برحمة الله، أما الآن، فإنكم تتمتعون بها!»"]]}], "kwAr": "ولكني عوملت بالرحمة", "noteAr": ""}, {"kw": "because", "raw": "Num_15:30; Luk_12:47, Luk_23:34; Joh_9:39-41; Act_3:17, Act_26:9; Heb_6:4-8; Heb_10:26-29; 2Pe_2:21, 2Pe_2:22", "note": "", "refs": [{"l": "Num 15:30", "n": "", "vs": [[30, "أما إن تعمد أحد الخطأ، سواء كان من الإسرائيليين أم من الغرباء، فهو يزدري بي ويجب أن يستأصل من بين شعبه،"]]}, {"l": "Luk 12:47", "n": "", "vs": [[47, "وأما ذلك العبد الذي يعمل بإرادة سيده، فإنه سيضرب كثيرا."]]}, {"l": "Luk 23:34", "n": "", "vs": [[34, "وقال يسوع: «ياأبي، اغفر لهم، لأنهم لا يدرون ما يفعلون!» واقتسموا ثيابه مقترعين عليها."]]}, {"l": "Joh 9:39-41", "n": "", "vs": [[39, "فقال يسوع: «لدينونة أتيت إلى هذا العالم: ليبصر العميان، ويعمى المبصرون!»"], [40, "فسمع ذلك بعض الفريسيين الذين كانوا معه فسألوه: «وهل نحن أيضا عميان؟»"], [41, "فأجابهم يسوع: «لو كنتم عميانا بالفعل، لما كانت عليكم خطيئة. ولكنكم تدعون أنكم تبصرون، ولذلك فإن خطيئتكم باقية...»"]]}, {"l": "Act 3:17", "n": "", "vs": [[17, "إني أعلم أيها الإخوة أنكم ورؤساءكم عاملتم المسيح بجهل،"]]}, {"l": "Act 26:9", "n": "", "vs": [[9, "وكنت أعتقد أنه يجب أن أبذل غاية جهدي لأقاوم اسم يسوع الناصري."]]}, {"l": "Heb 6:4-8", "n": "", "vs": [[4, "ذلك لأن الذين قد تعرضوا مرة لنور الإيمان بالمسيح، فذاقوا العطية السماوية،
