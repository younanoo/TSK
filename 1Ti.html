"Col 1:22", "n": "", "vs": [[22, "قد صالحكم الآن في جسد بشرية (ابنه) بالموت. وذلك لكي يحضركم فتمثلوا أمامه وأنتم قديسون بلا ذنب ولا لوم."]]}, {"l": "Jud 1:24", "n": "", "vs": [[24, "وللقادر أن يحرسكم من السقوط حتى يوصلكم إلى المثول أمامه في المجد مبتهجين ولا عيب فيكم …"]]}], "kwAr": "واللوم", "noteAr": ""}, {"kw": "until", "raw": "1Co_1:8; Phi_1:6, Phi_1:10; 1Th_3:13, 1Th_5:23; 2Th_2:1; 2Ti_4:1; Tit_2:13; Heb_9:28; 1Pe_1:7; 1Jo_3:2; Rev_1:7", "note": "", "refs": [{"l": "1Co 1:8", "n": "", "vs": [[8, "وهو نفسه سيحفظكم ثابتين إلى النهاية حتى تكونوا بلا عيب في يوم ربنا يسوع المسيح."]]}, {"l": "Phi 1:6", "n": "", "vs": [[6, "ولي ثقة في هذا الأمر بالذات: أن الذي بدأ فيكم عملا صالحا سوف يتممه إلى يوم المسيح يسوع."]]}, {"l": "Phi 1:10", "n": "", "vs": [[10, "لكي تستحسنوا الأمور الممتازة، حتى تكونوا طاهرين وخالين من العثرات إلى يوم المسيح،"]]}, {"l": "1Th 3:13", "n": "", "vs": [[13, "حتى تتثبت قلوبكم بغير لوم في القداسة أمام إلهنا وأبينا عندما يظهر ربنا يسوع عائدا مع جميع قديسيه."]]}, {"l": "1Th 5:23", "n": "", "vs": [[23, "وإله السلام نفسه يقدسكم إلى التمام ويحفظكم سالمين، روحا ونفسا وجسدا، لتكونوا بلا لوم عند عودة ربنا يسوع المسيح."]]}, {"l": "2Th 2:1", "n": "", "vs": [[1, "ولكن بالنسبة إلى رجوع ربنا يسوع المسيح واجتماعنا إليه معا، نرجو منكم أيها الإخوة"]]}, {"l": "2Ti 4:1", "n": "", "vs": [[1, "أطلب منك في حضرة الله والمسيح الذي سيدين الأحياء والأموات، بعودته العلنية وملكوته،"]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "Heb 9:28", "n": "", "vs": [[28, "كذلك المسيح أيضا: مات مرة واحدة حاملا خطايا كثيرين، مقربا نفسه (لله) عوضا عنهم. ولا بد أن يعود إلى الظهور. لا ليعالج الخطايا، بل ليحقق الخلاص النهائي لجميع منتظريه!"]]}, {"l": "1Pe 1:7", "n": "", "vs": [[7, "إلا أن غاية هذه التجارب هي اختبار حقيقة إيمانكم. فكما تختبر النار الذهب وتنقيه، تختبر التجارب حقيقة إيمانكم، وهو أثمن جدا من الذهب الفاني. وهكذا، يكون إيمانكم مدعاة مدح وإكرام وتمجيد لكم، عندما يعود يسوع المسيح ظاهرا بمجده."]]}, {"l": "1Jo 3:2", "n": "", "vs": [[2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"]]}, {"l": "Rev 1:7", "n": "", "vs": [[7, "ها هو آت مع السحاب! ستراه عيون الجميع، حتى أولئك الذين طعنوه، وتنوح بسببه قبائل الأرض كلها! نعم، آمين!"]]}], "kwAr": "إلى يوم ظهور ربنا", "noteAr": ""}], "arS": [["أن ", []], ["تحفظ", ["G5083"]], [" ", []], ["الوصية", ["G1785"]], [" خالية من ", []], ["العيب", ["G784"]], [" ", []], ["واللوم", ["G423"]], [" ", []], ["إلى", ["G3360"]], [" يوم ", []], ["ظهور", ["G2015"]], [" ", []], ["ربنا", ["G2962", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [" علنا.", []]]}, {"c": 6, "v": 15, "text": "هذا الظهور سوف يتممه الله في وقته الخاص، هو السيد المبارك الأوحد، ملك الملوك ورب الأرباب،", "groups": [{"kw": "who", "raw": "1Ti_1:11, 1Ti_1:17; Psa_47:2, Psa_83:18; Jer_10:10, Jer_46:18; Dan_2:44-47, Dan_4:34; Mat_6:13", "note": "", "refs": [{"l": "1Ti 1:11", "n": "", "vs": [[11, "الموافق لإنجيل مجد الله المبارك، ذلك الإنجيل الذي وضع أمانة بين يدي."]]}, {"l": "1Ti 1:17", "n": "", "vs": [[17, "فللملك الأزلي، الله الواحد غير المنظور وغير الفاني، الكرامة والمجد إلى أبد الآبدين. آمين!"]]}, {"l": "Psa 47:2", "n": "", "vs": [[2, "لأن الرب علي مخوف، ملك عظيم على كل الأرض."]]}, {"l": "Psa 83:18", "n": "", "vs": [[18, "ويعلموا أنك أنت وحدك، يهوه العلي على الأرض كلها."]]}, {"l": "Jer 10:10", "n": "", "vs": [[10, "أما الرب فهو الإله الحق، الإله الحي والملك السرمدي. ترتعد الأرض أمام غضبه ولا تتحمل الأمم فرط سخطه."]]}, {"l": "Jer 46:18", "n": "", "vs": [[18, "حي أنا يقول الملك الذي اسمه الرب القدير، سيقبل نبوخذناصر كجبل تابور بين الجبال وكالكرمل عند البحر."]]}, {"l": "Dan 2:44-47", "n": "", "vs": [[44, "وفي عهد هؤلاء الملوك يقيم إله السماوات مملكة لا تنقرض إلى الأبد، ولا يترك ملكها لشعب آخر، وتسحق وتبيد جميع هذه الممالك. أما هي فتخلد إلى الأبد."], [45, "لأنك رأيت أن الحجر المنقض الذي لم يقطع من الجبل بيدين، قد سحق الحديد والنحاس والخزف والفضة والذهب. إن الله العظيم قد أطلع الملك عما سيحدث في الأيام الآتية؛ فالحلم حقيقة وتفسيره صدق»."], [46, "حينئذ انطرح نبوخذناصر على وجهه وسجد لدانيآل، وأمر أن يقدموا له تقدمة ورائحة رضى"], [47, "وقال الملك لدانيآل: «حقا إن إلهكم هو إله الآلهة ورب الملوك وكاشف الأسرار، لأنك استطعت إعلان هذا السر»."]]}, {"l": "Dan 4:34", "n": "", "vs": [[34, "وفي ختام السبعة الأزمنة، أنا نبوخذناصر، التفت نحو السماء، فرجع إلي عقلي، وباركت العلي وسبحت وحمدت الحي الأبدي ذا السلطان السرمدي، والذي ملكه على مدى الأجيال."]]}, {"l": "Mat 6:13", "n": "", "vs": [[13, "ولا تدخلنا في تجربة، لكن نجنا من الشرير، لأن لك الملك والقوة والمجد إلى الأبد. آمين."]]}], "kwAr": "السيد المبارك الأوحد", "noteAr": ""}, {"kw": "the King", "raw": "Ezr_7:12; Pro_8:15; Rev_17:14, Rev_19:16", "note": "", "refs": [{"l": "Ezr 7:12", "n": "", "vs": [[12, "»من أرتحششتا ملك الملوك إلى عزرا الكاهن كاتب شريعة إله السماء، (سلام) كامل، وبعد."]]}, {"l": "Pro 8:15", "n": "", "vs": [[15, "بمعونتي يحكم الملوك، ويشترع الحكام ما هو عدل."]]}, {"l": "Rev 17:14", "n": "", "vs": [[14, "ثم يحاربون الحمل، ولكن الحمل يهزمهم، لأنه رب الأرباب وملك الملوك، والذين معه هم المدعوون، المختارون، المؤمنون»."]]}, {"l": "Rev 19:16", "n": "", "vs": [[16, "وقد كتب على ثوبه وعلى فخذه «ملك الملوك ورب الأرباب»."]]}], "kwAr": "ملك الملوك ورب الأرباب", "noteAr": ""}], "arS": [["هذا الظهور سوف ", []], ["يتممه", ["G1166"]], [" الله في ", []], ["وقته", ["G2540"]], [" ", []], ["الخاص", ["G2398"]], ["، هو ", []], ["السيد", ["G1413"]], [" ", []], ["المبارك", ["G3107"]], [" ", []], ["الأوحد", ["G3441"]], ["، ", []], ["ملك", ["G935"]], [" ", []], ["الملوك", ["G936"]], [" ", []], ["ورب", ["G2962"]], [" ", []], ["الأرباب", ["G2961"]], ["،", []]]}, {"c": 6, "v": 16, "text": "الذي وحده لا فناء له، الساكن في نور لا يدنى منه، الذي لم يره أي إنسان ولا يقدر أن يراه. له الكرامة والقدرة الأبدية. آمين!", "groups": [{"kw": "only", "raw": "1Ti_1:17; Exo_3:14; Deu_32:40; Psa_90:2; Isa_57:15; Joh_8:58; Heb_13:8; Rev_1:8, Rev_1:17, Rev_1:18", "note": "", "refs": [{"l": "1Ti 1:17", "n": "", "vs": [[17, "فللملك الأزلي، الله الواحد غير المنظور وغير الفاني، الكرامة والمجد إلى أبد الآبدين. آمين!"]]}, {"l": "Exo 3:14", "n": "", "vs": [[14, "فأجابه الله : «أهيه الذي أهيه» (ومعناه أنا الكائن الدائم). وأضاف: «هكذا تقول لبني إسرائيل: «أهيه (أنا الكائن)، هو الذي أرسلني إليكم»."]]}, {"l": "Deu 32:40", "n": "", "vs": [[40, "أبسط يدي نحو السماء قائلا: حي أنا إلى الأبد."]]}, {"l": "Psa 90:2", "n": "", "vs": [[2, "قبل أن أوجدت الجبال أو كونت المسكونة، أنت الله من الأزل وإلى الأبد."]]}, {"l": "Isa 57:15", "n": "", "vs": [[15, "لأنه هكذا يقول العلي السامي، المقيم في الأبد، الذي يدعى اسمه القدوس: إنني أسكن في العلى وفي الموضع المقدس، وأقيم مع المنسحق، وذوي الروح المتواضعة، لأحيي أرواح المتواضعين، وأنعش قلوب المنسحقين."]]}, {"l": "Joh 8:58", "n": "", "vs": [[58, "أجابهم: الحق الحق أقول لكم: إنني كائن من قبل أن يكون إبراهيم»."]]}, {"l": "Heb 13:8", "n": "", "vs": [[8, "يسوع المسيح هو هو أمسا واليوم وإلى الأبد."]]}, {"l": "Rev 1:8", "n": "", "vs": [[8, "«أنا الألف والياء» (البداية والنهاية). هذا يقوله الرب الإله الكائن والذي كان والذي سيأتي، القادر على كل شيء."]]}, {"l": "Rev 1:17", "n": "", "vs": [[17, "فلما رأيته ارتميت عند قدميه كالميت، فلمسني بيده اليمنى وقال: «لا تخف! أنا الأول والآخر،"]]}, {"l": "Rev 1:18", "n": "", "vs": [[18, "أنا الحي. كنت ميتا، ولكن ها أنا حي إلى أبد الآبدين. ولي مفاتيح الموت والهاوية."]]}], "kwAr": "الذي وحده لا فناء له", "noteAr": ""}, {"kw": "dwelling", "raw": "Psa_104:2; Hab_3:4; 1Jo_1:5; Rev_1:16, Rev_1:17, Rev_21:3, Rev_22:5", "note": "", "refs": [{"l": "Psa 104:2", "n": "", "vs": [[2, "أنت اللابس النور كثوب، والباسط السماوات كخيمة."]]}, {"l": "Hab 3:4", "n": "", "vs": [[4, "إن بهاءه كالنور، ومن يده يومض شعاع، وهناك يحجب قوته."]]}, {"l": "1Jo 1:5", "n": "", "vs": [[5, "وهذا هو الخبر الذي سمعناه من المسيح ونعلنه لكم: إن الله نور، وليس فيه ظلام البتة."]]}, {"l": "Rev 1:16", "n": "", "vs": [[16, "ووجهه يتوهج بالنور كشمس الظهيرة. وكان في يده اليمنى سبعة نجوم، ومن فمه يخرج سيف قاطع ذو حدين."]]}, {"l": "Rev 1:17", "n": "", "vs": [[17, "فلما رأيته ارتميت عند قدميه كالميت، فلمسني بيده اليمنى وقال: «لا تخف! أنا الأول والآخر،"]]}, {"l": "Rev 21:3", "n": "", "vs": [[3, "وسمعت صوتا هاتفا من العرش: «الآن صار مسكن الله مع الناس، هو يسكن بينهم، وهم يصيرون شعبا له. الله نفسه يكون معهم إلها لهم!"]]}, {"l": "Rev 22:5", "n": "", "vs": [[5, "ولن يكون هنالك ليل، فلا يحتاجون إلى نور مصباح أو شمس، لأن الرب الإله ينير عليهم، وهم سيملكون إلى أبد الآبدين!"]]}], "kwAr": "الساكن في نور لا يدنى منه", "noteAr": ""}, {"kw": "whom", "raw": "Exo_33:20; Joh_1:18, Joh_6:46, Joh_14:9; Col_1:15", "note": "", "refs": [{"l": "Exo 33:20", "n": "", "vs": [[20, "وأضاف:«ولكنك لن ترى وجهي، لأن الإنسان الذي يراني لا يعيش»."]]}, {"l": "Joh 1:18", "n": "", "vs": [[18, "ما من أحد رأى الله قط. ولكن الابن الوحيد، الذي في حضن الآب، هو الذي كشف عنه."]]}, {"l": "Joh 6:46", "n": "", "vs": [[46, "وليس معنى هذا أن أحدا رأى الآب: فما رآه إلا الذي كان مع الله. هو وحده رأى الآب."]]}, {"l": "Joh 14:9", "n": "", "vs": [[9, "فأجابه يسوع: «مضت هذه المدة الطويلة وأنا معكم ولم تعرفني يافيلبس؟ الذي رآني رأى الآب، فكيف تقول: أرنا الآب؟"]]}, {"l": "Col 1:15", "n": "", "vs": [[15, "هو صورة الله الذي لا يرى، والبكر على كل ما قد خلق،"]]}], "kwAr": "الذي لم يره أي إنسان", "noteAr": ""}, {"kw": "to whom", "raw": "1Ti_1:17; Rom_16:25-27; Eph_3:21; Phi_4:20; Jud_1:25; Rev_1:6, Rev_4:11, Rev_7:12", "note": "", "refs": [{"l": "1Ti 1:17", "n": "", "vs": [[17, "فللملك الأزلي، الله الواحد غير المنظور وغير الفاني، الكرامة والمجد إلى أبد الآبدين. آمين!"]]}, {"l": "Rom 16:25-27", "n": "", "vs": [[25, "والمجد للقادر أن يثبتكم، وفقا لإنجيلي وللبشارة بيسوع المسيح، ووفقا لإعلان ما كان سرا ظل مكتوما مدى الأزمنة الأزلية،"], [26, "ولكن أذيع الآن، بأمر الله الأزلي في الكتابات النبوية، على جميع الأمم لأجل إطاعة الإيمان؛"], [27, "المجد لله إلى الأبد، الحكيم وحده، بيسوع المسيح. آمين!"]]}, {"l": "Eph 3:21", "n": "", "vs": [[21, "له المجد في الكنيسة، في المسيح يسوع، مدى الأجيال والدهور! آمين …"]]}, {"l": "Phi 4:20", "n": "", "vs": [[20, "فلإلهنا وأبينا، المجد إلى دهر الدهور. آمين!"]]}, {"l": "Jud 1:25", "n": "", "vs": [[25, "لله الواحد، مخلصنا بيسوع المسيح ربنا ... المجد والجلال والقدرة والسلطة، من قبل أن كان الزمان، والآن وطوال الأزمان آمين!"]]}, {"l": "Rev 1:6", "n": "", "vs": [[6, "وجعل منا مملكة، وكهنة لله أبيه، له المجد والسلطان إلى أبد الآبدين. آمين!"]]}, {"l": "Rev 4:11", "n": "", "vs": [[11, "«مستحق أنت ياربنا وإلهنا المجد والإجلال والقدرة، لأنك خلقت الأشياء كلها، وهي بإرادتك كائنة وقد خلقت!»"]]}, {"l": "Rev 7:12", "n": "", "vs": [[12, "قائلين: «آمين! لإلهنا البركة والمجد والحكمة والشكر والإجلال والقدرة والقوة إلى أبد الآبدين. آمين!»"]]}], "kwAr": "له الكرامة والقدرة الأبدية", "noteAr": ""}], "arS": [["الذي ", []], ["وحده", ["G3441"]], [" لا ", []], ["فناء", ["G110"]], [" له، ", []], ["الساكن", ["G3611"]], [" في ", []], ["نور", ["G5457"]], [" لا ", []], ["يدنى منه", ["G676"]], ["، الذي لم ", []], ["يره", ["G1492"]], [" أي ", []], ["إنسان", ["G444"]], [" ولا ", []], ["يقدر", ["G1410"]], [" أن ", []], ["يراه", ["G1492"]], [". له ", []], ["الكرامة", ["G5092"]], [" ", []], ["والقدرة", ["G2904"]], [" ", []], ["الأبدية", ["G166"]], [". ", []], ["آمين", ["G281"]], ["!", []]]}, {"c": 6, "v": 17, "text": "أوص أغنياء هذا الزمان بأن لا يتكبروا، ولا يتكلوا على الغنى غير الثابت، بل على الله الذي يمنحنا كل شيء بوفرة لنتمتع به،", "groups": [{"kw": "Charge", "raw": "1Ti_6:13, 1Ti_1:3, 1Ti_5:21", "note": "", "refs": [{"l": "1Ti 6:13", "n": "", "vs": [[13, "وأوصيك، أمام الله الذي يحيي كل شيء، والمسيح يسوع الذي شهد أمام بيلاطس البنطي بالاعتراف الحسن،"]]}, {"l": "1Ti 1:3", "n": "", "vs": [[3, "كما أوصيتك لما كنت منطلقا إلى مقاطعة مقدونية، (أطلب إليك) أن تبقى في مدينة أفسس، لكي تمنع بعض المعلمين من نشر التعاليم المخالفة للتعليم الصحيح،"]]}, {"l": "1Ti 5:21", "n": "", "vs": [[21, "أطلب منك أمام الله والمسيح والملائكة المختارين أن تعمل بهذه التوصيات دون مراعاة أشخاص، فلا تعمل شيئا بتحيز."]]}], "kwAr": "أوص", "noteAr": ""}, {"kw": "rich", "raw": "Gen_13:2; Job_1:1-3; Mat_19:23, Mat_27:57; Luk_19:2, Luk_19:9, Luk_19:10", "note": "", "refs": [{"l": "Gen 13:2", "n": "", "vs": [[2, "وكان أبرام يملك ثروة طائلة من المواشي والفضة والذهب."]]}, {"l": "Job 1:1-3", "n": "", "vs": [[1, "عاش في أرض عوص رجل اسمه أيوب، كان صالحا كاملا يتقي الله ويحيد عن الشر."], [2, "وأنجب أيوب سبعة أبناء وثلاث بنات."], [3, "وبلغت مواشيه سبعة آلاف من الغنم، وثلاثة آلاف جمل، وخمس مئة زوج من البقر، وخمس مئة أتان. أما خدمه فكانوا كثيرين جدا. وكان هذا الرجل أعظم أبناء المشرق قاطبة."]]}, {"l": "Mat 19:23", "n": "", "vs": [[23, "فقال يسوع لتلاميذه: «الحق أقول لكم: إنه من الصعب على الغني أن يدخل ملكوت السماوات."]]}, {"l": "Mat 27:57", "n": "", "vs": [[57, "ولما حل المساء، جاء رجل غني من بلدة الرامة، اسمه يوسف، وكان أيضا تلميذا ليسوع."]]}, {"l": "Luk 19:2", "n": "", "vs": [[2, "وإذا هناك رجل اسمه زكا، رئيس لجباة الضرائب، وكان غنيا."]]}, {"l": "Luk 19:9", "n": "", "vs": [[9, "فقال له يسوع: «اليوم تم الخلاص لهذا البيت، إذ هو أيضا ابن إبراهيم."]]}, {"l": "Luk 19:10", "n": "", "vs": [[10, "فإن ابن الإنسان قد جاء ليبحث عن الهالكين ويخلصهم»."]]}], "kwAr": "أغنياء هذا الزمان", "noteAr": ""}, {"kw": "that they", "raw": "Deu_6:10-12, Deu_8:17, Deu_33:15; 2Ch_26:16, 2Ch_32:25, 2Ch_32:26; Psa_10:3, Psa_10:4, Psa_73:5-9; Pro_30:9; Jer_2:31; Eze_16:49, Eze_16:50,Eze_16:56; Dan_4:30, Dan_5:19-23; Hos_13:6; Hab_1:15, Hab_1:16; Rom_11:20; Jam_1:9, Jam_1:10; Rev_18:6, Rev_18:7", "note": "", "refs": [{"l": "Deu 6:10-12", "n": "", "vs": [[10, "ومتى أدخلكم الرب إلهكم إلى الأرض التي أقسم لآبائكم إبراهيم وإسحق ويعقوب أن يهبها لكم، حيث تنتشر مدن عظيمة لم تبنوها،"], [11, "وبيوت عامرة بخيرات لم تخزنوها، وآبار محفورة لم تحفروها، وأشجار كروم وزيتون لم تغرسوها، فأكلتم وشبعتم،"], [12, "فإياكم أن تنسوا الرب إلهكم الذي أطلقكم من عبودية ديار مصر."]]}, {"l": "Deu 8:17", "n": "", "vs": [[17, "خوفا من أن تقولوا في قلوبكم: لقد أحرزنا هذا الثراء بفضل قوتنا وقدرة أيدينا."]]}, {"l": "Deu 33:15", "n": "", "vs": [[15, "وبأنفس ما تدخره الجبال القديمة، وبأثمن كنوز التلال الأبدية،"]]}, {"l": "2Ch 26:16", "n": "", "vs": [[16, "وعندما بلغت قوته أوجها امتلأ قلبه بكبرياء أدت إلى هلاكه، إذ خان الرب ودخل إلى هيكله ليوقد على مذبح البخور."]]}, {"l": "2Ch 32:25", "n": "", "vs": [[25, "ولكن حزقيا لم يتجاوب مع ما أبداه الله نحوه من نعم، إذ امتلأ قلبه كبرياء، فغضب الرب عليه وعلى يهوذا وأورشليم."]]}, {"l": "2Ch 32:26", "n": "", "vs": [[26, "ثم اتضع حزقيا بعد كبريائه، هو وأهل أورشليم، فلم يحل بهم غضب الرب في أيام حزقيا."]]}, {"l": "Psa 10:3", "n": "", "vs": [[3, "الشرير يفتخر بشهوات نفسه، والرجل الطماع يلعن ويجدف على الله."]]}, {"l": "Psa 10:4", "n": "", "vs": [[4, "في تكبره وتشامخه لا يلتمس الله ، ولا مكان لله في أفكاره كلها،"]]}, {"l": "Psa 73:5-9", "n": "", "vs": [[5, "لا يقاسون من أتعاب البشر، ولا يعانون من المصائب كالناس."], [6, "لذلك لبسوا الكبرياء كقلادة، وارتدوا الظلم كثوب."], [7, "عيونهم جاحظة من كثرة شحم طمعهم. وشرهم تجاوز ما يتصوره القلب."], [8, "يستهزئون ويتكلمون بالظلم خبثا، وبكبرياء ينطقون."], [9, "جدفوا على السماء بأفواههم، ولوثوا الأرض بخبث ألسنتهم."]]}, {"l": "Pro 30:9", "n": "", "vs": [[9, "لئلا أشبع فأجحدك قائلا: من هو الرب؟ أو أفتقر فأسرق وألطخ اسم إلهي بالعار."]]}, {"l": "Jer 2:31", "n": "", "vs": [[31, "وأنت أيها الجيل، اسمع قضاء الرب: أكنت صحراء لإسرائيل أو أرض ظلام دامس؟ إذا لماذا يقول شعبي: نحن طليقون نسعى حيث شئنا، ولن نقبل إليك بعد؟"]]}, {"l": "Eze 16:49", "n": "", "vs": [[49, "أما إثم أختك سدوم، فإنها مع بناتها طغت عليها الغطرسة والتخمة وسلام الاطمئنان، ولم تغث الفقير والمسكين."]]}, {"l": "Eze 16:50", "n": "", "vs": [[50, "وتشامخن وارتكبن الرجس أمامي، فمحوتهن عندما شاهدت ذلك."]]}, {"l": "Eze 16:56", "n": "", "vs": [[56, "إن اسم أختك سدوم لم يرد ذكره على فمك في يوم غطرستك،"]]}, {"l": "Dan 4:30", "n": "", "vs": [[30, "قال: «أليست هذه هي بابل العظيمة التي بنيتها بقوة اقتداري لتكون عاصمة للمملكة، ولجلال مجدي؟»"]]}, {"l": "Dan 5:19-23", "n": "", "vs": [[19, "ولفرط عظمته التي أنعم الله بها عليه، كانت جميع الأمم والشعوب من كل لسان ترتعد أمامه وتفزع، فكان يقتل من يشاء، ويستحيي من يشاء، يرفع من يشاء ويضع من يشاء."], [20, "وعندما شمخ قلبه وقست روحه تعنتا، عزل عن عرش ملكه وجرد من جلاله،"], [21, "وطرد من بين الناس، وماثل عقله الحيوانات، وصار مأواه مع الحمير الوحشية، فأطعموه العشب كالثيران، وابتل جسمه بندى السماء، حتى علم أن الله العلي هو المتسلط في مملكة الناس، وأنه يولي عليها من يشاء."], [22, "وأنت يابيلشاصر ابنه لم يتواضع قلبك، مع علمك بكل هذا،"], [23, "بل تغطرست على رب السماء، فأحضروا أمامك آنية هيكله لتشرب بها الخمر، أنت ونبَلاء دولتك وزوجاتك ومحظياتك، وسبحت آلهة الفضة والذهب والنحاس والحديد والخشب والحجر التي لا تبصر ولا تسمع ولا تدرك، أما الله الذي بيده روحك وله كل طرقك، فلم تمجده."]]}, {"l": "Hos 13:6", "n": "", "vs": [[6, "ولكن عندما رعوا وشبعوا خامرت قلوبهم الكبرياء، لذلك نسوني."]]}, {"l": "Hab 1:15", "n": "", "vs": [[15, "إن الكلدانيين يستخرجونهم بالشصوص، ويصطادونهم بالشبكة، ويجمعونهم في مصيدتهم متهللين فرحين."]]}, {"l": "Hab 1:16", "n": "", "vs": [[16, "لهذا هم يقربون ذبائح لشباكهم، ويحرقون بخورا لمصائدهم، لأنهم بفضلها يتمتعون بالرفاهية ويتلذذون بأطايب الطعام."]]}, {"l": "Rom 11:20", "n": "", "vs": [[20, "صحيح! فهي قطعت لسبب عدم الإيمان، وأنت إنما تثبت بسبب الإيمان. فلا يأخذك الغرور، بل خف"]]}, {"l": "Jam 1:9", "n": "", "vs": [[9, "من كان فقيرا وأخا مؤمنا، فليسر بمقامه الذي رفعه الله إليه."]]}, {"l": "Jam 1:10", "n": "", "vs": [[10, "وأما الغني، فعليه أن يسر بأن ما له لا يغنيه عن الله: لأن نهايته ستكون كنهاية الأعشاب المزهرة."]]}, {"l": "Rev 18:6", "n": "", "vs": [[6, "افعلوا بها كما فعلت بكم، وضاعفوا لها جزاء ما اقترفت. في الكأس التي مزجت فيها للآخرين، امزجوا لها ضعفا."]]}, {"l": "Rev 18:7", "n": "", "vs": [[7, "أنزلوا بها من العذاب والشقاء على قدر ما عظمت نفسها وترفهت. فإنها تقول في نفسها: أنا ملكة على العرش، ولست أرملة، ولن أذوق طعم الحزن."]]}], "kwAr": "بأن لا يتكبروا", "noteAr": ""}, {"kw": "trust", "raw": "Job_31:24, Job_31:25; Psa_52:7, Psa_62:10; Pro_11:28; Jer_9:23, Jer_9:24; Mar_10:24; Luk_12:15-21; Eph_5:5", "note": "", "refs": [{"l": "Job 31:24", "n": "", "vs": [[24, "إن كنت قد جعلت الذهب متكلي، أو قلت للإبريز أنت معتمدي،"]]}, {"l": "Job 31:25", "n": "", "vs": [[25, "إن كنت قد اغتبطت بعظم ثروتي، أو لأن يدي فاضتا بوفرة الكسب،"]]}, {"l": "Psa 52:7", "n": "", "vs": [[7, "هذا هو الرجل الذي لم يتخذ الله حصنا له، بل اتكل على وفرة غناه واعتز بغوايته."]]}, {"l": "Psa 62:10", "n": "", "vs": [[10, "لا تتكلوا على الظلم ولا تتفاخروا بالسرقة. إن كثر الغنى فلا تعتمدوا عليه،"]]}, {"l": "Pro 11:28", "n": "", "vs": [[28, "من يتكل على غناه يسقط، أما الصديقون فيزهون كأوراق الشجر الخضراء."]]}, {"l": "Jer 9:23", "n": "", "vs": [[23, "«فلا يفتخرن الحكيم بحكمته، ولا يزهون الجبار بجبروته، ولا الغني بثروته."]]}, {"l": "Jer 9:24", "n": "", "vs": [[24, "بل ليفتخر المفتخر بأنه يدرك ويعرفني أني أنا الرب الذي يمارس الرحمة والعدل والبر في الأرض لأني أسر بها»."]]}, {"l": "Mar 10:24", "n": "", "vs": [[24, "فدهش التلاميذ لهذا الكلام. فعاد يسوع يقول لهم: «يابني، ما أصعب دخول المتكلين على المال إلى ملكوت الله!»"]]}, {"l": "Luk 12:15-21", "n": "", "vs": [[15, "وقال للجمع: «احذروا وتحفظوا من الطمع. فمتى كان الإنسان في سعة، لا تكون حياته في أمواله»."], [16, "وضرب لهم مثلا، قال «إنسان غني غلت له أرضه محاصيل وافرة."], [17, "ففكر في نفسه قائلا: ماذا أعمل وليس عندي مكان أخزن فيه محاصيلي؟"], [18, "وقال: أعمل هذا: أهدم مخازني وأبني أعظم منها، وهناك أخزن جميع غلالي وخيراتي."], [19, "وأقول لنفسي: يانفس، عندك خيرات كثيرة مخزونة لسنين عديدة، فاستريحي وكلي واشربي واطر بي!"], [20, "ولكن الله قال له: ياغبي، هذه الليلة تطلب نفسك منك، فلمن يبقى ما أعددته؟"], [21, "هذه هي حالة من يخزن الكنوز لنفسه ولا يكون غنيا عند الله!»"]]}, {"l": "Eph 5:5", "n": "", "vs": [[5, "فإنكم تعلمون هذا جيدا: أن كل زان أو نجس أو صاحب شهوة نهمة، ما هو إلا عابد أصنام، ليس له ميراث في ملكوت المسيح والله."]]}], "kwAr": "ولا يتكلوا", "noteAr": ""}, {"kw": "uncertain riches", "raw": "Gr. the uncertainty of riches, Pro_23:5, Pro_27:24; Ecc_5:13, Ecc_5:14", "note": "Gr. the uncertainty of riches, Pro_23:5, Pro_27:24; Ecc_5:13, Ecc_5:14", "refs": [{"l": "Pro 23:5", "n": "", "vs": [[5, "ما تكاد تتألق عيناك حبورا به حتى يتبدد، إذ فجأة يصنع لنفسه أجنحة ويطير كالنسر محلقا نحو السماء."]]}, {"l": "Pro 27:24", "n": "", "vs": [[24, "لأن الغنى لا يدوم إلى الأبد، ولا يخلد التاج مدى الدهور."]]}, {"l": "Ecc 5:13", "n": "", "vs": [[13, "قد رأيت شرا مقيتا تحت الشمس: ثروة مدخرة لغير صاحبها."]]}, {"l": "Ecc 5:14", "n": "", "vs": [[14, "أو ثروة تلفت في مشروع خاسر، ولم يبق (صاحبها) لابنه الذي أنجبه شيئا."]]}], "kwAr": "الغنى غير الثابت", "noteAr": "في اليونانية: عدم ثبات الغنى."}, {"kw": "but", "raw": "Psa_62:8, Psa_84:11, Psa_84:12, Psa_118:8, Psa_118:9; Jer_17:7, Jer_17:8", "note": "", "refs": [{"l": "Psa 62:8", "n": "", "vs": [[8, "ثقوا به في كل حين أيها الشعب. اسكبوا أمامه قلوبكم، الله ملجأنا."]]}, {"l": "Psa 84:11", "n": "", "vs": [[11, "لأن الرب الإله شمس وترس. الرب يعطي نعمة ومجدا؛ لا يمنع أي خير عن السالكين بالاستقامة."]]}, {"l": "Psa 84:12", "n": "", "vs": [[12, "يارب الجنود، طوبى للإنسان المتكل عليك."]]}, {"l": "Psa 118:8", "n": "", "vs": [[8, "اللجوء إلى الرب خير من الاعتماد على البشر."]]}, {"l": "Psa 118:9", "n": "", "vs": [[9, "اللجوء إلى الرب خير من الاعتماد على العظماء."]]}, {"l": "Jer 17:7", "n": "", "vs": [[7, "ولكن مبارك الرجل الذي يتكل على الرب، ويتخذه معتمدا له،"]]}, {"l": "Jer 17:8", "n": "", "vs": [[8, "فيكون كشجرة مغروسة عند الميا ه، تمد جذورها إلى الجدول، ولا تخشى اشتداد الحر المقبل، إذ تظل أوراقها خضراء، ولا يفزعها القحط لأنها لا تكف عن الإثمار."]]}], "kwAr": "بل على الله", "noteAr": ""}, {"kw": "the living", "raw": "1Ti_3:15, 1Ti_4:10; 1Th_1:9", "note": "", "refs": [{"l": "1Ti 3:15", "n": "", "vs": [[15, "حتى إذا تأخرت تعلم كيف يجب التصرف في بيت الله، أي كنيسة الله الحي، ركن الحق ودعامته."]]}, {"l": "1Ti 4:10", "n": "", "vs": [[10, "فإننا لأجل هذا نعمل باجتهاد ونقاسي التعيير، لأننا وضعنا رجاءنا في الله الحي، حافظ جميع الناس، وبالأخص المؤمنين."]]}, {"l": "1Th 1:9", "n": "", "vs": [[9, "فإن أولئك المؤمنين أنفسهم يخبرون عنا كيف كان قدومنا إليكم أول مرة، وكيف تحولتم إلى الله عن الأصنام، لتصيروا عبيدا يخدمون الله الحي الحق،"]]}], "kwAr": "الله", "noteAr": ""}, {"kw": "who", "raw": "Psa_104:28; Mat_6:32; Act_14:27, Act_17:25", "note": "", "refs": [{"l": "Psa 104:28", "n": "", "vs": [[28, "أنت تعطيها وهي تلتقط، تبسط يدك لها فتشبع خيرا."]]}, {"l": "Mat 6:32", "n": "", "vs": [[32, "فهذه الحاجات كلها تسعى إليها الأمم. فإن أباكم السماوي يعلم حاجتكم إلى هذه كلها."]]}, {"l": "Act 14:27", "n": "", "vs": [[27, "ولما وصلا، استدعيا الكنيسة إلى الاجتماع، وأخبرا بكل ما فعل الله بواسطتهما، وبأنه فتح باب الإيمان لغير اليهود."]]}, {"l": "Act 17:25", "n": "", "vs": [[25, "وليس بحاجة إلى خدمة يقدمها له الناس. فإنه يهب جميع الخلق الحياة والنفس وكل شيء."]]}], "kwAr": "الذي يمنحنا", "noteAr": ""}, {"kw": "richly", "raw": "Ecc_5:18, Ecc_5:19; Col_3:16; Tit_3:6 *marg.", "note": "", "refs": [{"l": "Ecc 5:18", "n": "", "vs": [[18, "فتأمل ما وجدت: من الأفضل والأليق أن يأكل الإنسان ويشرب ويستمتع بما تكبده من عناء تحت الشمس طوال أيام حياته القليلة التي وهبها الله له، لأن هذا هو حظه."]]}, {"l": "Ecc 5:19", "n": "", "vs": [[19, "وكل إنسان حباه الله بالثروة، جعله يستمتع بها، ويتنعم بنصيبه منها ليفرح بتعبه. فهذا أيضا عطية الله له."]]}, {"l": "Col 3:16", "n": "", "vs": [[16, "لتسكن كلمة المسيح في داخلكم بغنى، في كل حكمة، معلمين وواعظين بعضكم بعضا، مرنمين بمزامير وتسابيح وأناشيد روحية في قلوبكم لله، رافعين له الحمد."]]}, {"l": "Tit 3:6", "n": "*marg.", "vs": [[6, "الذي سكبه علينا بغنى بيسوع المسيح مخلصنا."]]}], "kwAr": "بوفرة", "noteAr": ""}], "arS": [["أوص", ["G3853"]], [" ", []], ["أغنياء", ["G4145"]], [" هذا ", []], ["الزمان", ["G3568", "G165"]], [" بأن لا ", []], ["يتكبروا", ["G5309"]], ["، ولا ", []], ["يتكلوا", ["G1679"]], [" على ", []], ["الغنى", ["G4149"]], [" ", []], ["غير الثابت", ["G83"]], ["، بل على ", []], ["الله", ["G2316"]], [" الذي ", []], ["يمنحنا", ["G3930", "G2254"]], [" ", []], ["كل شيء", ["G3956"]], [" ", []], ["بوفرة", ["G4146"]], [" ", []], ["لنتمتع", ["G619"]], [" به،", []]]}, {"c": 6, "v": 18, "text": "وأن يفعلوا خيرا، ويكونوا أغنياء بالأعمال الصالحة، ويوزعوا بسخاء، ويكونوا على استعداد دائم لإشراك الآخرين في خيراتهم.", "groups": [{"kw": "they do", "raw": "2Ch_24:16; Psa_37:3; Ecc_3:12; Luk_6:33-35; Act_10:38; Gal_6:10; Heb_13:16; 1Pe_3:11; 3Jo_1:11", "note": "", "refs": [{"l": "2Ch 24:16", "n": "", "vs": [[16, "فدفنوه في مدينة داود في مقابر الملوك، اعترافا بفضله على إسرائيل وما بذله من خير في خدمة الله وهيكله."]]}, {"l": "Psa 37:3", "n": "", "vs": [[3, "توكل على الرب واصنع الخير. اسكن في الأرض (مطمئنا) وراع الأمانة."]]}, {"l": "Ecc 3:12", "n": "", "vs": [[12, "فأيقنت أنه ليس أفضل لهم من أن يفرحوا ويمتعوا أنفسهم وهم مازالوا على قيد الحياة."]]}, {"l": "Luk 6:33-35", "n": "", "vs": [[33, "وإن أحسنتم معاملة الذين يحسنون معاملتكم، فأي فضل لكم؟ فحتى الخاطئون يفعلون هكذا!"], [34, "وإن أقرضتم الذين تأملون أن تستوفوا منهم، فأي فضل لكم؟ فحتى الخاطئون يقرضون الخاطئين لكي يستوفوا منهم ما يساوي قرضهم."], [35, "ولكن، أحبوا أعداءكم، وأحسنوا المعاملة، وأقرضوا دون أن تأملوا استيفاء القرض، فتكون مكافأتكم عظيمة، وتكونوا أبناء العلي، لأنه ينعم على ناكري الجميل والأشرار."]]}, {"l": "Act 10:38", "n": "", "vs": [[38, "فقد مسح الله يسوع الناصري بالروح القدس وبالقدرة، فكان ينتقل من مكان إلى مكان يعمل الخير، ويشفي جميع الذين تسلط عليهم إبليس، لأن الله كان معه."]]}, {"l": "Gal 6:10", "n": "", "vs": [[10, "فمادامت لنا الفرصة إذن، فلنعمل الخير للجميع، وخصوصا لأهل الإيمان."]]}, {"l": "Heb 13:16", "n": "", "vs": [[16, "ولا تغفلوا أيضا عن عمل الخير وإعانة المحتاجين: لأن مثل هذه «الذبائح» تسر الله جدا!"]]}, {"l": "1Pe 3:11", "n": "", "vs": [[11, "ليتحول عن الشر ويفعل الخير. ليطلب السلام ويسع للوصول إليه."]]}, {"l": "3Jo 1:11", "n": "", "vs": [[11, "أيها الحبيب، لا تقتد بما هو شر، بل بما هو خير. فإن من يفعل الخير، يكون من الله. ومن يفعل الشر، يبين أنه لم يتعرف بالله قط."]]}], "kwAr": "وأن يفعلوا خيرا", "noteAr": ""}, {"kw": "rich", "raw": "1Ti_5:10; Luk_12:21; Act_9:36; Tit_2:14, Tit_3:8; Jam_2:5", "note": "", "refs": [{"l": "1Ti 5:10", "n": "", "vs": [[10, "ويكون مشهودا لها بالأعمال الصالحة، كأن تكون قد ربت الأولاد، وأضافت الغرباء، وغسلت أقدام القديسين، وأسعفت المتضايقين، ومارست كل عمل صالح!"]]}, {"l": "Luk 12:21", "n": "", "vs": [[21, "هذه هي حالة من يخزن الكنوز لنفسه ولا يكون غنيا عند الله!»"]]}, {"l": "Act 9:36", "n": "", "vs": [[36, "وكان في مدينة يافا تلميذة اسمها طابيثا، ومعنى اسمها: غزالة، كان يشغلها دائما فعل الخير ومساعدة الفقراء."]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Tit 3:8", "n": "", "vs": [[8, "صادق هذا القول! وأريد أن تقرر هذه الأمور قرارا حاسما، حتى يهتم الذين آمنوا بالله بأن يجتهدوا في الأعمال الصالحة. هذه الأمور حسنة ونافعة للناس."]]}, {"l": "Jam 2:5", "n": "", "vs": [[5, "فياإخوتي الأحباء، أما اختار الله الفقراء في نظر الناس ليجعلهم أغنياء في الإيمان، ويعطيهم حق الإرث في الملكوت الذي وعد به محبيه؟"]]}], "kwAr": "أغنياء بالأعمال الصالحة", "noteAr": ""}, {"kw": "ready", "raw": "Deu_15:7-11; Psa_112:9; Pro_11:24, Pro_11:25; Ecc_11:1, Ecc_11:2, Ecc_11:6; Isa_32:8, Isa_58:7; Luk_6:35, Luk_14:12-14; Act_2:44, Act_2:45, Act_4:34-37, Act_11:29; Rom_12:8, Rom_12:13; 1Co_16:2; 2Co_8:1, 2Co_8:2, 2Co_8:9, 2Co_8:12, 2Co_9:6-15; Phi_4:18, Phi_4:19; Heb_13:16; 1Jo_3:17", "note": "", "refs": [{"l": "Deu 15:7-11", "n": "", "vs": [[7, "إن وجد بينكم إسرائيلي فقير مقيم في أي مدينة من مدن الأرض التي سيهبها لكم الرب إلهكم، فلا تقسوا قلوبكم وتمتنعوا عن إعانته،"], [8, "بل اسخوا عليه وأقرضوه مقدار ما يحتاج إليه."], [9, "إياكم أن تحدثوا قلوبكم بخبث قائلين: ها قد قربت السنة السابعة، سنة الإبراء من الديون فيسوء الأمر في أعينكم وتمتنعون عن إقراضه. فإن فعلتم هذا فإنه يستغيث بالرب عليكم، فتصبحون مذنبين في حكم الرب."], [10, "أقرضوه عن طيب خاطر، لأنه من أجل هذا يبارككم الرب إلهكم في كل أعمالكم وما تنتجه أيديكم،"], [11, "فالأرض لن تخلو أبدا من الفقراء، لهذا أوصيكم أن تسخوا على أخيكم المسكين والفقير المقيم في أرضكم."]]}, {"l": "Psa 112:9", "n": "", "vs": [[9, "يوزع بسخاء ويعطي الفقراء، وبره يدوم إلى الأبد، فيرتفع رأسه باعتزاز."]]}, {"l": "Pro 11:24", "n": "", "vs": [[24, "قد يسخو المرء بما عنده فيزداد غنى ويبخل آخر بما عليه أن يسخو به فيفتقر."]]}, {"l": "Pro 11:25", "n": "", "vs": [[25, "النفس السخية تزداد ثراء، والمروي يروى أيضا."]]}, {"l": "Ecc 11:1", "n": "", "vs": [[1, "اطرح خبزك على وجه المياه، فإنك تجده بعد أيام كثيرة."]]}, {"l": "Ecc 11:2", "n": "", "vs": [[2, "وزع أنصبة على سبعة بل على ثمانية، لأنك لا تدري أية بلية تحل على الأرض."]]}, {"l": "Ecc 11:6", "n": "", "vs": [[6, "ازرع زرعك في الصباح، ولا تكف يدك عن العمل في المساء، لأنك لا تدري أيهما يفلح: أهذا المزروع في الصباح أم ذاك الذي في المساء، أم كلاهما على حد سواء؟"]]}, {"l": "Isa 32:8", "n": "", "vs": [[8, "أما الكريم فبالمآثر يفتكر وبالمكارم يشتهر."]]}, {"l": "Isa 58:7", "n": "", "vs": [[7, "ألا يكون في مشاطرة خبزك مع الجائع، وإيواء الفقير المتشرد في بيتك. وكسوة العريان الذي تلتقيه، وعدم التغاضي عن قريبك البائس؟"]]}, {"l": "Luk 6:35", "n": "", "vs": [[35, "ولكن، أحبوا أعداءكم، وأحسنوا المعاملة، وأقرضوا دون أن تأملوا استيفاء القرض، فتكون مكافأتكم عظيمة، وتكونوا أبناء العلي، لأنه ينعم على ناكري الجميل والأشرار."]]}, {"l": "Luk 14:12-14", "n": "", "vs": [[12, "وقال أيضا للذي دعاه: «عندما تقيم غداء أو عشاء، فلا تدع أصدقاءك ولا إخوتك ولا أقرباءك ولا جيرانك الأغنياء، لئلا يدعوك هم أيضا بالمقابل، فتكون قد كوفئت."], [13, "ولكن، عندما تقيم وليمة ادع الفقراء والمعاقين والعرج والعمي؛"], [14, "فتكون مباركا لأن هؤلاء لا يملكون ما يكافئونك به، فإنك تكافأ في قيامة الأبرار»."]]}, {"l": "Act 2:44", "n": "", "vs": [[44, "وكان المؤمنون كلهم متحدين معا، فكانوا يتشاركون في كل ما يملكون،"]]}, {"l": "Act 2:45", "n": "", "vs": [[45, "ويبيعون أملاكهم ومقتنياتهم ويتقاسمون الثمن على قدر احتياج كل منهم،"]]}, {"l": "Act 4:34-37", "n": "", "vs": [[34, "فلم يكن فيهم محتاج، لأن جميع من كان لهم حقول أو بيوت كانوا يبيعونها ويأتون بثمنها،"], [35, "فيضعونه عند أقدام الرسل، وهم يوزعونه على كل محتاج بقدر حاجته."], [36, "ومن هؤلاء يوسف، الذي دعاه الرسل برنابا أي ابن التشجيع، وهو من سبط لاوي، ويحمل الجنسية القبرصية."], [37, "فإنه كان يملك حقلا، فباعه وجاء بثمنه ووضعه عند أقدام الرسل!"]]}, {"l": "Act 11:29", "n": "", "vs": [[29, "لذلك قرر التلاميذ في أنطاكية أن يتبرع كل منهم بما يتيسر له، ويرسلوا إعانة إلى الإخوة المقيمين في اليهودية."]]}, {"l": "Rom 12:8", "n": "", "vs": [[8, "أو الوعظ، ففي الوعظ؛ أو العطاء، فليعط بسخاء؛ أو القيادة، فليقد باجتهاد؛ أو إظهار الرحمة، فليرحم بسرور."]]}, {"l": "Rom 12:13", "n": "", "vs": [[13, "متعاونين على سد حاجات القديسين، مداومين على إضافة الغرباء."]]}, {"l": "1Co 16:2", "n": "", "vs": [[2, "ففي أول يوم من الأسبوع، ليضع كل منكم جانبا ما يتيسر له مما يكسبه؛ وليحتفظ به، حتى لا يحصل الجمع عندما أذهب إليكم."]]}, {"l": "2Co 8:1", "n": "", "vs": [[1, "والآن، نعرفكم، أيها الإخوة، بنعمة الله الموهوبة في كنائس مقاطعة مقدونية."]]}, {"l": "2Co 8:2", "n": "", "vs": [[2, "فمع أنهم كانوا في تجربة ضيقة شديدة، فإن فرحهم الوافر مع فقرهم الشديد فاضا فأنتجا منهم سخاء غنيا."]]}, {"l": "2Co 8:9", "n": "", "vs": [[9, "فأنتم تعرفون نعمة ربنا يسوع المسيح: فمن أجلكم افتقر، وهو الغني لكي تغتنوا أنتم بفقره."]]}, {"l": "2Co 8:12", "n": "", "vs": [[12, "فمتى وجد الاستعداد، يقبل العطاء على قدر ما يملك الإنسان، لا على قدر ما لا يملك."]]}, {"l": "2Co 9:6-15", "n": "", "vs": [[6, "فمن الحق أن من يزرع بالتقتير، يحصد أيضا بالتقتير، ومن يزرع بالبركات، يحصد أيضا بالبركات."], [7, "فليتبرع كل واحد بما نوى في قلبه، لا بأسف ولا عن اضطرار، لأن الله يحب المعطي المتهلل."], [8, "والله قادر أن يجعل كل نعمة تفيض عليكم، حتى يكون لكم اكتفاء كلي في كل شيء وكل حين، فتفيضوا في كل عمل صالح؛"], [9, "وفقا لما قد كتب: «وزع بسخاء، أعطى الفقراء، بره يدوم إلى الأبد!»"], [10, "والذي يقدم بذارا للزارع، وخبزا للأكل، سيقدم لكم بذاركم ويكثره ويزيد أثمار بركم:"], [11, "إذ تغتنون في كل شيء، لأجل كل سخاء طوعي ينتج بنا شكرا لله"], [12, "ذلك لأن خدمة الله بهذه الإعانة لا تسد حاجة القديسين وحسب، بل تفيض بشكر كثير لله."], [13, "فإن القديسين، إذ يختبرون هذه الخدمة، يمجدون الله على طاعتكم في الشهادة لإنجيل المسيح وعلى السخاء الطوعي في مشاركتكم لهم وللجميع."], [14, "كما يرفعون الدعاء لأجلكم، متشوقين إليكم، بسبب نعمة الله الفائقة التي ظهرت فيكم."], [15, "فشكرا لله على عطيته المجانية التي تفوق الوصف!"]]}, {"l": "Phi 4:18", "n": "", "vs": [[18, "فالآن عندي كل ما يسد حاجتي ويزيد عنها. أنا في بحبوحة إذ تسلمت من أبفروديتس ما بعثتم به إلي، عطرا طيب الرائحة، ذبيحة يقبلها الله ويسر بها."]]}, {"l": "Phi 4:19", "n": "", "vs": [[19, "وإن إلهي سيسد حاجاتكم كلها إلى التمام، وفقا لغناه في المجد، في المسيح يسوع."]]}, {"l": "Heb 13:16", "n": "", "vs": [[16, "ولا تغفلوا أيضا عن عمل الخير وإعانة المحتاجين: لأن مثل هذه «الذبائح» تسر الله جدا!"]]}, {"l": "1Jo 3:17", "n": "", "vs": [[17, "وأما الذي يملك مالا يمكنه من العيش في بحبوحة، ويقسي قلبه على أحد الإخوة المحتاجين، فكيف تكون محبة الله متأصلة فيه؟"]]}], "kwAr": "ويوزعوا بسخاء", "noteAr": ""}, {"kw": "willing to communicate", "raw": "or, sociable", "note": "or, sociable", "refs": [], "kwAr": "لإشراك الآخرين في خيراتهم", "noteAr": "أو: اجتماعيين (أهل مشاركة)."}], "arS": [["وأن ", []], ["يفعلوا خيرا", ["G14"]], ["، ويكونوا ", []], ["أغنياء", ["G4147"]], [" ", []], ["بالأعمال", ["G2041"]], [" ", []], ["الصالحة", ["G2570"]], ["، ", []], ["ويوزعوا بسخاء", ["G2130"]], ["، ويكونوا على استعداد دائم ", []], ["لإشراك", ["G2843"]], [" الآخرين في خيراتهم.", []]]}, {"c": 6, "v": 19, "text": "وبذلك يوفرون لأنفسهم رأس مال للمستقبل، حتى يمسكوا بالحياة الحقيقية.", "groups": [{"kw": "Laying", "raw": "Psa_17:14; Mat_6:19-21, Mat_10:41, Mat_10:42, Mat_19:21, Mat_25:34-40; Luk_12:33, Luk_16:9; Luk_18:2, Luk_18:22; Gal_6:8, Gal_6:9", "note": "", "refs": [{"l": "Psa 17:14", "n": "", "vs": [[14, "أنقذني بيدك يارب من الناس. من أهل الدنيا الذين نصيبهم هو في هذه الحياة. أنت تملأ بطونهم من خيراتك المخزونة، فيشبع أبناؤهم، ويورثون أولادهم ما يفضل عنهم."]]}, {"l": "Mat 6:19-21", "n": "", "vs": [[19, "لا تكنزوا لكم كنوزا على الأرض، حيث يفسدها السوس والصدأ، وينقب عنها اللصوص ويسرقون."], [20, "بل اكنزوا لكم كنوزا في السماء، حيث لا يفسدها سوس ولا ينقب عنها لصوص ولا يسرقون."], [21, "فحيث يكون كنزك، هناك أيضا يكون قلبك !"]]}, {"l": "Mat 10:41", "n": "", "vs": [[41, "من يرحب بنبي لكونه نبيا، فإنه ينال مكافأة نبي؛ ومن يرحب برجل بار لكونه بارا، فإنه ينال مكافأة بار."]]}, {"l": "Mat 10:42", "n": "", "vs": [[42, "وأي من سقى واحدا من هؤلاء الصغار ولو كأس ماء بارد، فقط لأنه تلميذ لي، فالحق أقول لكم: إن مكافأته لن تضيع أبدا»."]]}, {"l": "Mat 19:21", "n": "", "vs": [[21, "فأجابه يسوع: «إن أردت أن تكون كاملا، فاذهب وبع كل ما تملك، ووزع على الفقراء، فيكون لك كنز في السماوات. وتعال اتبعني!»"]]}, {"l": "Mat 25:34-40", "n": "", "vs": [[34, "ثم يقول الملك للذين عن يمينه: تعالوا يامن باركهم أبي، رثوا الملكوت الذي أعد لكم منذ إنشاء العالم:"], [35, "لأني جعت فأطعمتموني، عطشت فسقيتموني، كنت غريبا فآويتموني،"], [36, "عريانا فكسوتموني، مريضا فزرتموني، سجينا فأتيتم إلي!"], [37, "فيرد الأبرار قائلين: يارب، متى رأيناك جائعا فأطعمناك، أو عطشانا فسقيناك؟"], [38, "ومتى رأيناك غريبا فآويناك، أو عريانا فكسوناك؟"], [39, "ومتى رأيناك مريضا أو سجينا فزرناك؟"], [40, "فيجيبهم الملك: الحق أقول لكم: بما أنكم فعلتم ذلك بأحد إخوتي هؤلاء الصغار، فبي فعلتم!"]]}, {"l": "Luk 12:33", "n": "", "vs": [[33, "بيعوا ما تملكون وأعطوا صدقة، واجعلوا لكم أكياسا لا تبلى، كنزا في السماوات لا ينفد، حيث لا يقترب لص ولا يفسد سوس."]]}, {"l": "Luk 16:9", "n": "", "vs": [[9, "وأقول لكم: اكسبوا لكم أصدقاء بمال الظلم، حتى إذا فني مالكم، تقبلون في المنازل الأبدية!"]]}, {"l": "Luk 18:2", "n": "", "vs": [[2, "قال: «كان في مدينة قاض لا يخاف الله ولا يحترم إنسانا."]]}, {"l": "Luk 18:22", "n": "", "vs": [[22, "فلما سمع يسوع هذا، قال له: «ينقصك شيء واحد: بع كل ما عندك، ووزع على الفقراء، فيكون لك كنز في السماوات. ثم تعال اتبعني!»"]]}, {"l": "Gal 6:8", "n": "", "vs": [[8, "فإن من يزرع لجسده، فمن الجسد يحصد فسادا. ومن يزرع للروح، فمن الروح يحصد حياة أبدية. فلا نفشل في عمل الخير،"]]}, {"l": "Gal 6:9", "n": "", "vs": [[9, "لأننا، متى حان الأوان، سنحصد، إن كنا لا نتراخى."]]}], "kwAr": "يوفرون لأنفسهم", "noteAr": ""}, {"kw": "foundation", "raw": "Pro_10:25; Luk_6:48, Luk_6:49; Gal_5:6; Eph_3:17; 2Ti_2:19", "note": "", "refs": [{"l": "Pro 10:25", "n": "", "vs": [[25, "يتلاشى الشرير كما تتلاشى الزوبعة، أما الصديق فيخلد إلى الأبد."]]}, {"l": "Luk 6:48", "n": "", "vs": [[48, "إنه يشبه إنسانا يبني بيتا، فحفر وعمق ووضع الأساس على الصخر. ثم هطل مطر غزير وصدم السيل ذلك البيت، فلم يقدر أن يزعزعه، لأنه كان مؤسسا على الصخر."]]}, {"l": "Luk 6:49", "n": "", "vs": [[49, "وأما من سمع ولم يعمل، فهو يشبه إنسانا بنى بيتا على الأرض دون أساس. فلما صدمه السيل، انهار في الحال؛ وكان خراب ذلك البيت جسيما! »"]]}, {"l": "Gal 5:6", "n": "", "vs": [[6, "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة."]]}, {"l": "Eph 3:17", "n": "", "vs": [[17, "ليسكن المسيح في قلوبكم بالإيمان؛ حتى إذا تأصلتم وتأسستم في المحبة،"]]}, {"l": "2Ti 2:19", "n": "", "vs": [[19, "إلا أن الأساس الراسخ الذي وضعه الله يظل ثابتا، وعليه هذا الختم: «الرب يعرف خاصته»، وأيضا: «لينفصل عن الإثم كل من يسمي اسم الرب!»"]]}], "kwAr": "رأس مال", "noteAr": ""}, {"kw": "the time", "raw": "Pro_31:25; Luk_16:9, Luk_16:25", "note": "", "refs": [{"l": "Pro 31:25", "n": "", "vs": [[25, "كساؤها العزة والشرف، وتبتهج بالأيام المقبلة."]]}, {"l": "Luk 16:9", "n": "", "vs": [[9, "وأقول لكم: اكسبوا لكم أصدقاء بمال الظلم، حتى إذا فني مالكم، تقبلون في المنازل الأبدية!"]]}, {"l": "Luk 16:25", "n": "", "vs": [[25, "ولكن إبراهيم قال: يابني، تذكر أنك نلت خيراتك كاملة في أثناء حياتك، ولعازر نال البلايا. ولكنه الآن يتعزى هنا، وأنت هناك تتعذب."]]}], "kwAr": "للمستقبل", "noteAr": ""}, {"kw": "lay", "raw": "1Ti_6:12; Phi_3:14; 1Pe_1:4", "note": "", "refs": [{"l": "1Ti 6:12", "n": "", "vs": [[12, "أحسن الجهاد في معركة الإيمان الجميلة. تمسك بالحياة الأبدية، التي إليها قد دعيت، وقد اعترفت الاعتراف الحسن (بالإيمان) أمام شهود كثيرين."]]}, {"l": "Phi 3:14", "n": "", "vs": [[14, "إذ أسعى إلى الهدف، لنوال تلك الجائزة التي يدعونا الله إليها دعوة عليا في المسيح يسوع."]]}, {"l": "1Pe 1:4", "n": "", "vs": [[4, "وإرثا لا يفنى ولا يفسد ولا يزول،"]]}], "kwAr": "حتى يمسكوا بالحياة", "noteAr": ""}], "arS": [["وبذلك ", []], ["يوفرون", ["G597"]], [" ", []], ["لأنفسهم", ["G1438"]], [" ", []], ["رأس مال", ["G2310"]], [" ", []], ["للمستقبل", ["G3195"]], ["، حتى ", []], ["يمسكوا", ["G1949"]], [" ", []], ["بالحياة", ["G2222"]], [" الحقيقية.", []]]}, {"c": 6, "v": 20, "text": "ياتيموثاوس، حافظ على الأمانة المودعة لديك. تجنب الكلام الدنس الباطل، ومناقضات ما يسمى زورا «معرفة».", "groups": [{"kw": "O Timothy", "raw": "1Ti_6:11; 2Ti_2:1", "note": "", "refs": [{"l": "1Ti 6:11", "n": "", "vs": [[11, "وأما أنت، ياإنسان الله، فاهرب من هذه الأمور، واسع في إثر البر والتقوى والإيمان والمحبة والصبر والوداعة."]]}, {"l": "2Ti 2:1", "n": "", "vs": [[1, "وأنت ياولدي، فكن قويا في النعمة التي في المسيح يسوع."]]}], "kwAr": "ياتيموثاوس", "noteAr": ""}, {"kw": "keep", "raw": "1Ti_6:14, 1Ti_1:11; Rom_3:2; 2Th_1:4, 2Th_2:15; 2Ti_1:13, 2Ti_1:14, 2Ti_3:14; Tit_1:9; Rev_3:3", "note": "", "refs": [{"l": "1Ti 6:14", "n": "", "vs": [[14, "أن تحفظ الوصية خالية من العيب واللوم إلى يوم ظهور ربنا يسوع المسيح علنا."]]}, {"l": "1Ti 1:11", "n": "", "vs": [[11, "الموافق لإنجيل مجد الله المبارك، ذلك الإنجيل الذي وضع أمانة بين يدي."]]}, {"l": "Rom 3:2", "n": "", "vs": [[2, "إنه كثير من جميع الجهات، وأهمها فعلا أن أقوال الله وضعت أمانة بين أيديهم."]]}, {"l": "2Th 1:4", "n": "", "vs": [[4, "حتى إننا، نحن أنفسنا، نفتخر بكم في كنائس الله بسبب ثباتكم وإيمانكم في وسط كل ما تحتملونه من اضطهادات وضيقات."]]}, {"l": "2Th 2:15", "n": "", "vs": [[15, "فاثبتوا إذن، أيها الإخوة، وتمسكوا بالتعاليم التي تلقيتم منا، سواء كان بالكلام أم برسالتنا."]]}, {"l": "2Ti 1:13", "n": "", "vs": [[13, "اتخذ من الكلام الصحيح الذي سمعته مني مثالا في الإيمان والمحبة اللذين في المسيح يسوع."]]}, {"l": "2Ti 1:14", "n": "", "vs": [[14, "وحافظ على الأمانة الكريمة المودعة لديك، بالروح القدس الحال فينا."]]}, {"l": "2Ti 3:14", "n": "", "vs": [[14, "إنما أنت فاثبت على ما تعلمته وتيقنته بالتمام، إذ تعرف على يد من تعلمت ذلك."]]}, {"l": "Tit 1:9", "n": "", "vs": [[9, "ملتصقا بالكلمة الصادقة الموافقة للتعليم، ليكون قادرا على تشجيع المؤمنين بالتعليم الصحيح وعلى إفحام المعارضين."]]}, {"l": "Rev 3:3", "n": "", "vs": [[3, "تذكر ما سبق أن تقبلته وسمعته، وتمسك بما آمنت به، وتب! فإن كنت لا تتنبه، آتيك كما يأتي اللص، ولا تدري في أية ساعة أفاجئك!"]]}], "kwAr": "حافظ على الأمانة المودعة لديك", "noteAr": ""}, {"kw": "avoiding", "raw": "1Ti_6:4, 1Ti_6:5, 1Ti_1:4, 1Ti_1:6, 1Ti_4:7; 2Ti_3:14-16; Tit_1:4, Tit_1:14, Tit_3:9", "note": "", "refs": [{"l": "1Ti 6:4", "n": "", "vs": [[4, "فهو قد انتفخ تكبرا، ولا يعرف شيئا، وإنما هو مهووس بالمجادلات والمنازعات الكلامية، ومنها ينشأ الحسد والخصام والتجريح والنيات السيئة،"]]}, {"l": "1Ti 6:5", "n": "", "vs": [[5, "وشتى أنواع النزاع بين أناس فاسدي العقول مجردين من الحق، يعتبرون التقوى تجارة."]]}, {"l": "1Ti 1:4", "n": "", "vs": [[4, "وتوصي المؤمنين ألا ينشغلوا بالأساطير وسلاسل النسب المتشابكة. فتلك الأمور تثير المجادلات ولا تعمل على تقدم تدبير الله القائم على الإيمان."]]}, {"l": "1Ti 1:6", "n": "", "vs": [[6, "هذه الفضائل قد زاغ عنها بعضهم، فانحرفوا إلى المجادلات الباطلة،"]]}, {"l": "1Ti 4:7", "n": "", "vs": [[7, "أما أساطير العجائز المبتذلة، فتجنبها. إنما مرن نفسك في طريق التقوى."]]}, {"l": "2Ti 3:14-16", "n": "", "vs": [[14, "إنما أنت فاثبت على ما تعلمته وتيقنته بالتمام، إذ تعرف على يد من تعلمت ذلك."], [15, "وتعلم أنك منذ حداثة سنك تعرف الكتب المقدسة، وهي القادرة أن تجعلك حكيما لبلوغ الخلاص عن طريق الإيمان في المسيح يسوع."], [16, "إن الكتاب بكل ما فيه، قد أوحى به الله؛ وهو مفيد للتعليم والتوبيخ والتقويم وتهذيب الإنسان في البر،"]]}, {"l": "Tit 1:4", "n": "", "vs": [[4, "إلى تيطس، ولدي الحقيقي بالنسبة إلى الإيمان المشترك بيننا."]]}, {"l": "Tit 1:14", "n": "", "vs": [[14, "لا يديرون عقولهم إلى خرافات يهودية ووصايا أناس تحولوا عن الحق بعيدا."]]}, {"l": "Tit 3:9", "n": "", "vs": [[9, "أما المسائل السخيفة، وسلاسل النسب، والمخاصمات، والمنازعات حول الشريعة، فتجنبها، لأنها غير نافعة، وباطلة."]]}], "kwAr": "تجنب الكلام الدنس الباطل", "noteAr": ""}, {"kw": "oppositions", "raw": "Act_17:18, Act_17:21; Rom_1:22; 1Co_1:19-23, 1Co_2:6, 1Co_3:19; Col_2:8, Col_2:18", "note": "", "refs": [{"l": "Act 17:18", "n": "", "vs": [[18, "وجرت مناقشة بينه وبين بعض الفلاسفة الأبيقوريين والرواقيين. ولما وجدوا أنه يبشر بيسوع والقيامة من الموت قال بعضهم: «ماذا يعني هذا المدعي الأحمق بكلامه؟» وقال آخرون: «يبدو أنه ينادي بآلهة غريبة»."]]}, {"l": "Act 17:21", "n": "", "vs": [[21, "وكان أهل أثينا والأجانب الساكنون فيها لا يمضون أوقات فراغهم إلا في مناقشة الأفكار الجديدة."]]}, {"l": "Rom 1:22", "n": "", "vs": [[22, "وفيما يدعون أنهم حكماء، صاروا جهالا،"]]}, {"l": "1Co 1:19-23", "n": "", "vs": [[19, "فإنه قد كتب: «سأبيد حكمة الحكماء وأزيل فهم الفهماء!»"], [20, "إذن، أين الحكيم؟ وأين الكاتب؟ وأين المجادل في هذا الزمان؟ ألم يقلب الله حكمة هذا العالم جهالة؟"], [21, "فبما أن العالم، في حكمة الله، لم يعرف الله عن طريق الحكمة، فقد سر الله أن يخلص بجهالة البشارة الذين يؤمنون."], [22, "إذ إن اليهود يطلبون آيات، واليونانيين يبحثون عن الحكمة."], [23, "ولكننا نحن نبشر بالمسيح مصلوبا، مما يشكل عائقا عند اليهود وجهالة عند الأمم؛"]]}, {"l": "1Co 2:6", "n": "", "vs": [[6, "على أن لنا حكمة نتكلم بها بين البالغين. ولكنها حكمة ليست من هذا العالم ولا من رؤساء هذا العالم الزائلين."]]}, {"l": "1Co 3:19", "n": "", "vs": [[19, "فإن حكمة هذا العالم هي جهالة في نظر الله. فإنه قد كتب: «إنه يمسك الحكماء بمكرهم»"]]}, {"l": "Col 2:8", "n": "", "vs": [[8, "احذروا أن يوقعكم أحد فريسة بالفلسفة والغرور الباطل، عملا بتقاليد الناس ومباديء العالم؛ مما لا يوافق المسيح."]]}, {"l": "Col 2:18", "n": "", "vs": [[18, "لا يحرمكم أحد من جائزتكم، بحملكم على ما يرغب فيه من إظهار التواضع والتعبد للملائكة، داخلا في رؤى يتوهمها، وقد نفخه باطلا ذهنه الجسدي،"]]}], "kwAr": "ومناقضات", "noteAr": ""}], "arS": [["ياتيموثاوس", ["G5599", "G5095"]], ["، ", []], ["حافظ", ["G5442"]], [" على ", []], ["الأمانة المودعة لديك", ["G3872"]], [". ", []], ["تجنب", ["G1624"]], [" ", []], ["الكلام الدنس", ["G952"]], [" ", []], ["الباطل", ["G2757"]], ["، ", []], ["ومناقضات", ["G477"]], [" ما يسمى ", []], ["زورا", ["G5581"]], [" «", []], ["معرفة", ["G1108"]], ["».", []]]}, {"c": 6, "v": 21, "text": "وإذ ادعى بعضهم هذه المعرفة المزعومة، زاغوا عن الإيمان. لتكن النعمة معك!", "groups": [{"kw": "have", "raw": "1Ti_6:10, 1Ti_1:6, 1Ti_1:19; 2Ti_2:18; Heb. 10:1-12:29", "note": "", "refs": [{"l": "1Ti 6:10", "n": "", "vs": [[10, "فإن حب المال أصل لكل شر؛ وإذ سعى بعضهم إليه، ضلوا عن الإيمان، وطعنوا أنفسهم بأوجاع كثيرة."]]}, {"l": "1Ti 1:6", "n": "", "vs": [[6, "هذه الفضائل قد زاغ عنها بعضهم، فانحرفوا إلى المجادلات الباطلة،"]]}, {"l": "1Ti 1:19", "n": "", "vs": [[19, "متمسكا بالإيمان، وبالضمير الصالح، هذا الضمير الذي تخلى عنه بعضهم، فانكسرت بهم سفينة الإيمان."]]}, {"l": "2Ti 2:18", "n": "", "vs": [[18, "اللذان زاغا عن الحق؛ إذ يزعمان أن القيامة قد حدثت، ويهدمان إيمان بعض الناس."]]}, {"l": "Heb 10:1-12:29", "n": "", "vs": [[1, "فقد كانت شريعة موسى تتضمن ظلا واهيا للخيرات التي سيأتي بها المسيح، ولم تكن لتصور الحقيقة كما هي. ولذلك، لم تكن قادرة أن توصل إلى الكمال أولئك الذين يتقربون بها إلى الله، مقدمين دائما الذبائح السنوية عينها،"], [2, "وإلا، لما كان هنالك داع للاستمرار في تقديمها! لأن ضمائر العابدين، متى تطهرت مرة واحدة إلى التمام، لا تعود بحاجة إلى التطهير مرة ثانية: إذ يكون الشعور بالذنب قد زال."], [3, "ولكن في عملية تقديم الذبائح المتكررة كل سنة، تذكيرا للعابدين بخطاياهم."], [4, "فمن المستحيل أن يزيل دم الثيران والتيوس خطايا الناس."], [5, "لذلك قال المسيح، عند مجيئه إلى هذه الأرض: «إن الذبائح والتقدمات ما أردتها. لكنك أعددت لي جسدا بشريا."], [6, "فالحيوانات التي كانت تذبح وتحرق أمامك تكفيرا عن الخطيئة، لم ترض بها."], [7, "عندئذ قلت لك: ها أنا آتي لأعمل إرادتك، ياالله . هذا هو المكتوب عني في صفحة الكتاب !»"], [8, "فبعد أن عبر المسيح عن عدم رضى الله بجميع التقدمات والذبائح التي كانت تقرب مع أنها كانت تقدم وفقا للشريعة،"], [9, "أضاف قائلا: «ها أنا آتي لأعمل إرادتك!» فهو، إذن، يلغي النظام السابق، ليضع محله نظاما جديدا ينسجم مع إرادة الله."], [10, "بموجب هذه الإرادة الإلهية، صرنا مقدسين إذ قرب يسوع المسيح، مرة واحدة، جسده عوضا عنا!"], [11, "وقديما، كان كل كاهن يقف يوميا أمام المذبح ليقوم بمهمته، فيقدم لله تلك الذبائح عينها، مع أنها لم تكن قادرة على إزالة الخطايا إطلاقا."], [12, "ولكن المسيح، رئيس كهنتنا، قدم ذبيحة واحدة عن الخطايا، ثم جلس إلى الأبد عن يمين الله،"], [13, "منتظرا أن يوضع أعداؤه موطئا لقدميه."], [14, "إذ إنه، بتقدمة وحيدة جعل أولئك الذين قدسهم كاملين إلى الأبد."], [15, "والروح القدس نفسه يشهد لنا بهذه الحقيقة. إذ قال أولا:"], [16, "«هذا هو العهد الذي أبرمه معهم بعد تلك الأيام، يقول الرب: أضع شرائعي في داخل قلوبهم، وأكتبها في عقولهم»."], [17, "ثم أضاف: «ولا أعود أبدا إلى تذكر خطاياهم ومخالفاتهم»."], [18, "فحينما يتحقق غفر ان الخطايا، لا تبقى حاجة بعد إلى تقريب التقدمات عنها!"], [19, "فلنا الآن، أيها الإخوة حق التقدم بثقة إلى «قدس الأقداس» (في السماء) بدم يسوع."], [20, "وذلك بسلوك هذا الطريق الحي الجديد الذي شقه لنا المسيح بتمزيق الحجاب، أي جسده."], [21, "ولنا أيضا كاهن عظيم يمارس سلطته على بيت الله."], [22, "فلنتقدم إلى حضرة الله بقلب صادق وبثقة الإيمان الكاملة، بعدما طهر رش الدم قلوبنا من كل شعور بالذنب، وغسل الماء النقي أجسادنا."], [23, "ولنتمسك دائما بالرجاء الذي نعترف به، دون أن نشك في أنه سيتحقق، لأن الذي وعدنا بتحقيقه، هو أمين وصادق."], [24, "وعلى كل واحد منا أن ينتبه للآخرين، لنحث بعضنا بعضا على المحبة والأعمال الصالحة."], [25, "وعلينا ألا ننقطع عن الاجتماع معا، كما تعود بعضكم أن يفعل. إنما، يجدر بكم أن تحثوا وتشجعوا بعضكم بعضا، وتواظبوا على هذا بقدر ما ترون ذلك اليوم يقترب."], [26, "فإن أخطأنا عمدا برفضنا للمسيح بعد حصولنا على معرفة الحق، لا تبقى هناك ذبيحة لغفران الخطايا،"], [27, "بل انتظار العقاب الأكيد في لهيب النار التي ستلتهم المتمردين. ويا له من انتظار مخيف!"], [28, "تعلمون أن من خالف شريعة موسى، كان عقابه الموت دون رحمة، على أن يؤيد مخالفته شاهدان أو ثلاثة."], [29, "ففي ظنكم، كم يكون أشد كثيرا ذلك العقاب الذي يستحقه من يدوس ابن الله، إذ يعتبر أن دم العهد، الذي يتقدس به، هو دم نجس، وبذلك يهين روح النعمة؟"], [30, "فنحن نعرف من قال: «لي الانتقام، أنا أجازي، يقول الرب!» وأيضا: «إن الرب سوف يحاكم شعبه!»"], [31, "حقا ما أرهب الوقوع في يدي الله الحي!"], [32, "لا تنسوا أبدا تلك الأيام الماضية التي فيها، بعدما أشرق عليكم نور الإيمان بالمسيح، صبرتم على جهاد مرير طويل، إذ قاسيتم كثيرا من الآلام."], [33, "وذلك عندما تعرضتم للإهانات والمضايقات من جهة، وعندما شاركتم الذين عوملوا مثل هذه المعاملة من جهة أخرى."], [34, "فقد تعاطفتم مع المسجونين، كما تقبلتم نهب ممتلكاتكم بفرح، علما منكم بأن لكم في السماء ثروة أفضل وأبقى."], [35, "إذن، لا تتخلوا عن ثقتكم بالرب. فإن لها مكافأة عظيمة."], [36, "إنكم تحتاجون إلى الصبر لتعملوا إرادة الله، فتنالوا البركة التي وعدتم بها."], [37, "فقريبا جدا، سيأتي الآتي ولا يتمهل."], [38, "وأما من تبرر بالإيمان، فبالإيمان يحيا. ومن ارتد لا تسر به نفسي!"], [39, "ولكننا نحن لسنا من أهل الارتداد المؤدي إلى الهلاك، بل من أهل الإيمان المؤدي إلى خلاص نفوسنا!"], [1, "أما الإيمان، فهو الثقة بأن ما نرجوه لابد أن يتحقق، والاقتناع بأن ما لا نراه موجود حقا."], [2, "بهذا الإيمان، كسب رجال الله قديما شهادة حسنة أمام الله والناس."], [3, "وعن طريق الإيمان، ندرك أن الكون كله قد خرج إلى الوجود بكلمة أمر من الله. حتى إن عالمنا المنظور، قد تكون من أمور غير منظورة!"], [4, "بالإيمان، قدم هابيل لله ذبيحة أفضل من تلك التي قدمها قايين. وعلى ذلك الأساس، شهد الله بأن هابيل بار، إذ قبل التقدمة التي قربها له. ومع أن هابيل مات قتلا، فإنه مازال الآن يلقننا العبر بإيمانه."], [5, "وبالإيمان، انتقل أخنوخ إلى حضرة الله دون أن يموت. وقد اختفى من على هذه الأرض لأن الله أخذه إليه. وقبل حدوث ذلك، شهد له بأنه قد أرضى الله ."], [6, "فمن المستحيل إرضاء الله بدون إيمان. إذ إن من يتقرب إلى الله، لابد له أن يؤمن بأنه موجود، وبأنه يكافيء الذين يسعون إليه."], [7, "وبالإيمان نوح، لما أنذره الله عن طريق الوحي بالطوفان الآتي، دفعه خوف الله إلى بناء سفينة ضخمة كانت وسيلة النجاة له ولعائلته، مع أنه لم يكن قد رأى طوفانا من قبل. وبعمله هذا، حكم على العالم وأصبح وارثا للبر القائم على أساس الإيمان."], [8, "وبالإيمان، لبى إبراهيم دعوة الله، فترك وطنه وانطلق إلى أرض أخرى وعده الله بأن يورثه إياها. ولما خرج من بيته، كان لا يعرف أين يتوجه."], [9, "وبالإيمان، كان يرحل كالغريب من مكان إلى آخر في الأرض التي وعده الله بها، وكأنها أرض غريبة. وكان يسكن في الخيام مع إسحاق ويعقوب، شريكيه في إرث الوعد عينه."], [10, "فإنه كان ينتظر الانتقال إلى المدينة السماوية ذات الأسس الثابتة، التي مهندسها وبانيها هو الله ."], [11, "وبالإيمان أيضا، نالت سارة زوجة إبراهيم قدرة على الإنجاب، فولدت ابنا مع أنها كانت قد جاوزت سن الحمل. وذلك لأنها آمنت بأن الله ، الذي وعدها بذلك، لابد أن يحقق وعده."], [12, "وهكذا ولد من إبراهيم، وقد كان ميتا من حيث القدرة على الإنجاب، شعب كبير «كنجوم الفضاء عددا، وكالرمل الذي على شط البحر، لا يحصى...»"], [13, "هؤلاء جميعا، حافظوا على إيمانهم إلى النهاية. وماتوا قبل أن تتحقق وعود الله لهم في أثناء حياتهم. ولكنهم رأوها من بعيد، وتوقعوا تحقيقها كاملة في المستقبل. وإذ آمنوا بتلك الوعود الإلهية اعترفوا بأنهم ليسوا إلا غرباء على الأرض يزورونها زيارة عابرة."], [14, "والذين يقولون ذلك، يوضحون أن عيونهم على وطنهم الحقيقي."], [15, "ولو كانوا يتذكرون الوطن الأرضي الذي هجروه، لاغتنموا الفرصة وعادوا إليه."], [16, "ولكن، لا ... فهم الآن يتطلعون إلى وطن أفضل، أي الوطن السماوي. بسبب إيمانهم هذا لا يستحي الله أن يدعى إلههم. فهو قد أعد لهم مدينة!"], [17, "وبالإيمان، إبراهيم أيضا، لما امتحنه الله ، قدم إسحاق ابنه. فإنه، إذ قبل وعود الله، قدم ابنه الوحيد ذبيحة،"], [18, "مع أن الله قال له: «بإسحاق سوف يكون لك نسل يحمل اسمك!»"], [19, "فقد آمن إبراهيم بأن الله قادر على إقامة إسحاق من الموت. والواقع أن إبراهيم استعاد ابنه من الموت، على سبيل المثال أو الرمز."], [20, "بالإيمان، بارك إسحاق يعقوب وعيسو."], [21, "وبالإيمان، بارك يعقوب، قبيل موته، كل واحد من ابني يوسف، وسجد متوكئا على رأس عصاه."], [22, "وبالإيمان، استند يوسف على وعد الله بإخراج بني إسرائيل من بلاد مصر، فترك وصية بأن ينقلوا رفاته معهم."], [23, "بالإيمان موسى خبأه والداه حتى صار عمره ثلاثة أشهر، لأنهما رأياه طفلا جميلا، ولم يخافا المرسوم الذي أصدره الملك."], [24, "وبالإيمان، موسى نفسه، لما كبر، رفض أن يدعى ابنا لابنة فرعون."], [25, "بل اختار أن يتحمل المذلة مع شعب الله، بدلا من التمتع الوقتي بلذات الخطيئة."], [26, "فقد اعتبر أن عار المسيح، هو ثروة أعظم من كنوز مصر، لأنه كان يتطلع إلى المكافأة."], [27, "بالإيمان، ترك أرض مصر وهو غير خائف من غضب الملك. فقد مضى في تنفيذ قراره، كأنه يرى بجانبه الله غير المنظور."], [28, "وبالإيمان، أقام الفصح ورش الدم، لكي لا يمس مهلك الأبكار أحدا من أبناء شعبه."], [29, "بالإيمان اجتاز الشعب في البحر الأحمر كأنه أرض يابسة. أما المصريون، فإذ حاولوا ذلك غرقوا!"], [30, "بالإيمان انهارت أسوار مدينة أريحا، بعدما دار الشعب حولها لمدة سبعة أيام."], [31, "وجزاء للإيمان، نجت راحاب الزانية من الموت المحتم مع المتمردين، بعدما استقبلت الجاسوسين بسلام."], [32, "وهل من حاجة بعد لمزيد من الأمثلة؟ إن الوقت لا يتسع لي حتى أسرد أخبار الإيمان عن: جدعون وباراق وشمشون ويفتاح وداود وصموئيل والأنبياء."], [33, "فبالإيمان، تغلب هؤلاء على ممالك الأعداء، وحكموا حكما عادلا ونالوا ما وعدهم به الله . وبه، أطبقوا أفواه الأسود،"], [34, "وأبطلوا قوة النار، ونجوا من الموت قتلا بالسيف. وبه أيضا نالوا القوة بعد ضعف، فصاروا أشداء في المعارك، وردوا جيوشا غريبة على أعقابها."], [35, "وبالإيمان، استرجعت بعض النساء أمواتهن بعدما أعيدوا إلى الحياة. وبه، تحمل كثيرون العذاب والضرب، وماتوا رافضين النجاة لعلمهم أنهم سوف يقومون إلى حياة أفضل."], [36, "وكثيرون غيرهم تحملوا المحاكمات الظالمة تحت الإهانة والجلد، والإلقاء في السجون مقيدين بالسلاسل."], [37, "ومنهم من حوكموا فماتوا رجما بالحجارة، أو نشرا بالمنشار، أو ذبحا بالسيف. وبعضهم، تشردوا متسترين بجلود الغنم والمعزى، يعانون من الحاجة والضيق والظلم،"], [38, "ولم يكن العالم يستحقهم، تائهين في البراري والجبال والمغاور والكهوف."], [39, "إن هؤلاء لم يحصلوا جميعا على تحقيق كل ما وعدهم الله به، مع أنهم حاصلون على شهادة حسنة من جهة الإيمان."], [40, "ولكن الله سبق فأعد لنا ما هو أفضل، وذلك حتى لا يكملوا بمعزل عنا."], [1, "فبما أن هذا العدد الكبير من الشاهدين للإيمان، يتجمع حولنا كأنه سحابة عظيمة، فلنطرح جانبا كل ثقل يعيقنا عن التقدم، ونتخلص من تلك الخطيئة التي نتعرض للسقوط في فخها بسهولة، لكي نتمكن، نحن أيضا، أن نركض باجتهاد في السباق الممتد أمامنا،"], [2, "متطلعين دائما إلى يسوع: رائد إيماننا ومكمله. فهو قد تحمل الموت صلبا، هازئا بما في ذلك من عار، إذ كان ينظر إلى السرور الذي ينتظره، ثم جلس عن يمين عرش الله."], [3, "فتأملوا مليا ما قاساه بتحمله تلك المعاملة العنيفة التي عامله بها الخاطئون، لكي لا تتعبوا وتنهاروا!"], [4, "لم تقاوموا بعد حتى بذل الدم في مجاهدتكم ضد الخطيئة."], [5, "فهل نسيتم الوعظ الذي يخاطبكم به الله بوصفكم أبناء له؟ إذ يقول: «ياابني، لا تستخف بتأديب الرب. ولا تفقد العزيمة حين يوبخك على الخطأ."], [6, "فإن الذي يحبه الرب يؤدبه. وهو يجلد كل من يتخذه له ابنا!»"], [7, "إذن، تحملوا تأديب الرب. فهو يعاملكم معاملة الأبناء: وأي ابن لا يؤدبه أبوه؟"], [8, "فإن كنتم لا تتلقون التأديب الذي يشترك فيه أبناء الله جميعا، فمعنى ذلك أنكم لستم أبناء شرعيين له."], [9, "إن آباءنا الأرضيين كانوا يؤدبوننا ونحن أولاد، وكنا نحترمهم. أفلا يجدر بنا الآن أن نخضع خضوعا تاما لتأديب أبي الأرواح، لنحيا حياة فضلى؟"], [10, "وقد أدبنا آباؤنا فترة من الزمان، حسب ما رأوه مناسبا. أما الله ، فيؤدبنا دائما من أجل منفعتنا: لكي نشترك في قداسته."], [11, "وطبعا، كل تأديب لا يبدو في الحال باعثا على الفرح، بل على الحزن. ولكنه فيما بعد، ينتج بسلام في الذين يتلقونه ثمر البر."], [12, "لذلك، شددوا أيديكم المرتخية، وركبكم المنحلة."], [13, "ومهدوا لأقدامكم طرقا مستقيمة، حتى لا تنحرف أرجل العرج، بل تشفى!"], [14, "اجعلوا هدفكم أن تسالموا جميع الناس، وتعيشوا حياة مقدسة. فبغير قداسة، لا يقدر أحد أن يرى الرب."], [15, "انتبهوا ألا يسقط أحدكم من نعمة الله، حتى لا يتأصل بينكم جذر مرارة، فيسبب بلبلة، وينجس كثيرين منكم."], [16, "وحذار أن يكون بينكم زان أو مستهتر مثل عيسو الذي باع حقوقه بوصفه الابن البكر، لقاء أكلة واحدة."], [17, "فأنتم تعلمون جيدا أنه لما أراد استعادة البركة من أبيه، بعدما كان قد استخف بها، رفض لأنه لم يجد مجالا للتوبة، مع أنه طلب البركة وهو يذرف الدموع."], [18, "إنكم لم تقتربوا إلى جبل ملموس، مشتعل بالنار، ولا ضباب وظلام وريح عاصفة،"], [19, "حيث انطلق صوت بوق هاتفا بكلمات واضحة، وقد كان مرعبا حتى إن سامعيه التمسوا أن يتوقف عن الكلام."], [20, "فإنهم لم يطيقوا احتمال هذا الأمر الصادر إليهم: «حتى الحيوان الذي يمس الجبل، يجب أن تقتلوه رجما!»"], [21, "والواقع أن ذلك المشهد كان مرعبا إلى درجة جعلت موسى يقول: «أنا خائف جدا بل مرتجف خوفا!»"], [22, "ولكنكم قد اقتربتم إلى جبل صهيون، إلى مدينة الله الحي، أورشليم السماوية. بل تقدمتم إلى حفلة يجتمع فيها عدد لا يحصى من الملائكة،"], [23, "إلى كنيسة تجمع أبناء لله أبكارا، أسماؤهم مكتوبة في السماء. بل إلى الله نفسه، ديان الجميع، وإلى أرواح أناس بررهم الله وجعلهم كاملين."], [24, "كذلك، تقدمتم إلى يسوع، وسيط العهد الجديد، وإلى دمه المرشوش الذي يتكلم مطالبا بأفضل مما طالب به دم هابيل."], [25, "إذن حذار أن ترفضوا الذي يتكلم! فمادام أولئك الذين رفضوا الاستماع لمن كلمهم على هذه الأرض، لم يفلتوا (من العقاب) قط، فكم بالأحرى لا نفلت نحن أبدا إن تحولنا عن الذي يتكلم إلينا من السماء عينها!"], [26, "وإذ تكلم الله قديما، زلزل صوته الأرض، أما الآن، فيعد قائلا: «إني مرة أخرى، سوف أزلزل لا الأرض وحدها، بل السماء أيضا!»"], [27, "وبقوله: «مرة أخرى»، يشير إلى أنه سوف يزيل كل ما ليس له أساس متين باعتباره مخلوقا، حتى لا تبقى إلا تلك الأشياء الثابتة الأساس."], [28, "فبما أننا قد حصلنا على مملكة ثابتة لا تتزلزل، لنعبد الله ونخدمه شاكرين، بصورة ترضيه، بكل احترام ومخافة،"], [29, "متذكرين أن «إلهنا نار آكلة!»"]]}], "kwAr": "زاغوا عن الإيمان", "noteAr": ""}, {"kw": "Grace", "raw": "Rom_1:7, Rom_16:20,Rom_16:24; 2Ti_4:22; Tit_3:15; Heb_13:25", "note": "", "refs": [{"l": "Rom 1:7", "n": "", "vs": [[7, "إلى جميع من هم في روما من أحباء الله القديسين المدعوين. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}, {"l": "Rom 16:20", "n": "", "vs": [[20, "وإله السلام سيسحق الشيطان تحت أقدامكم سريعا. لتكن نعمة ربنا يسوع المسيح معكم."]]}, {"l": "Rom 16:24", "n": "", "vs": [[24, "«لتكن نعمة ربنا يسوع المسيح معكم. آمين!»"]]}, {"l": "2Ti 4:22", "n": "", "vs": [[22, "ليكن الرب مع روحك، ولتكن النعمة معكم!"]]}, {"l": "Tit 3:15", "n": "", "vs": [[15, "جميع الذين معي يسلمون عليك. سلم على محبينا في الإيمان. لتكن النعمة معكم جميعا!"]]}, {"l": "Heb 13:25", "n": "", "vs": [[25, "لتكن النعمة معكم جميعا!"]]}], "kwAr": "لتكن النعمة معك", "noteAr": ""}, {"kw": "Amen", "raw": "Mat_6:13", "note": "", "refs": [{"l": "Mat 6:13", "n": "", "vs": [[13, "ولا تدخلنا في تجربة، لكن نجنا من الشرير، لأن لك الملك والقوة والمجد إلى الأبد. آمين."]]}], "kwAr": "آمين", "noteAr": ""}], "arS": [["وإذ ", []], ["ادعى", ["G1861"]], [" ", []], ["بعضهم", ["G5100"]], [" هذه المعرفة المزعومة، ", []], ["زاغوا", ["G795"]], [" عن ", []], ["الإيمان", ["G4102"]], [". لتكن ", []], ["النعمة", ["G5485"]], [" معك!", []]]}], "strong": true}];</script>
