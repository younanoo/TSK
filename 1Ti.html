الكم الصالحة يمجدون الله في يوم الافتقاد."]]}, {"l": "1Pe 3:16", "n": "", "vs": [[16, "على أن تفعلوا ذلك بوداعة واحترام، محافظين على طهارة ضمائركم، سالكين في المسيح سلوكا صالحا، وعندئذ يخيب الذين يوجهون إليكم التهم الكاذبة ويشتمونكم كأنكم تفعلون شرا."]]}], "kwAr": "لكي لا يجلبوا التجديف", "noteAr": ""}], "arS": [["على ", []], ["جميع", ["G3745"]], [" من هم تحت ", []], ["نير", ["G2218"]], [" العبودية أن ", []], ["يعتبروا", ["G2233"]], [" ", []], ["سادتهم", ["G1203"]], [" ", []], ["أهلا", ["G514"]], [" ", []], ["لكل", ["G3956"]], [" ", []], ["إكرام", ["G5092"]], ["، لكي لا يجلبوا ", []], ["التجديف", ["G987"]], [" على ", []], ["اسم", ["G3686"]], [" ", []], ["الله", ["G2316"]], [" وعلى ", []], ["التعليم", ["G1319"]], [".", []]]}, {"c": 6, "v": 2, "text": "وعلى الذين لهم سادة مؤمنون أن لا يستخفوا بهم لأنهم إخوة لهم، بل بالأحرى أن يخدموهم بخضوع، لأن المستفيدين من خدمتهم الصالحة هم مؤمنون محبوبون.", "groups": [{"kw": "believing", "raw": "Col_4:1; Phm_1:10-16", "note": "", "refs": [{"l": "Col 4:1", "n": "", "vs": [[1, "أيها السادة، عاملوا عبيدكم بالعدل والإنصاف، عالمين أن لكم، أنتم أيضا، سيدا في السماء."]]}, {"l": "Phm 1:10-16", "n": "", "vs": [[10, "فألتمس منك لأجل ولدي الذي ولدته وأنا مكبل بالقيود، أونسيموس،"], [11, "الذي كان في الماضي غير نافع لك، ولكنه الآن نافع لك ولي."], [12, "فإياه أرد إليك، فاقبله كأنه فلذة من كبدي!"], [13, "وكنت راغبا في الاحتفاظ به لنفسي، لكي يخدمني نيابة عنك في قيود الإنجيل."], [14, "ولكني لم أرد أن أفعل شيئا من دون رأيك، ليكون معروفك لا كأنه عن اضطرار بل عن اختيار."], [15, "فربما لهذا السبب قد أبعد إلى حين: كي تمتلكه إلى الأبد،"], [16, "لا كعبد في ما بعد، بل أفضل من عبد، أخا حبيبا، إلي بخاصة، فكم بالأحرى إليك، في الجسد وفي الرب معا؟"]]}], "kwAr": "سادة مؤمنون", "noteAr": ""}, {"kw": "let", "raw": "Gen_16:4, Gen_16:5; Num_16:3; Mat_6:24; 2Pe_2:10; Jud_1:8", "note": "", "refs": [{"l": "Gen 16:4", "n": "", "vs": [[4, "فعاشر هاجر فحبلت منه. ولما أدركت أنها حامل هانت مولاتها في عينيها،"]]}, {"l": "Gen 16:5", "n": "", "vs": [[5, "فقالت ساراي لأبرام: «ليقع ظلمي عليك، فأنا قد زوجتك من جاريتي وحين أدر كت أنها حامل هنت في عينيها. ليقض الرب بيني وبينك»."]]}, {"l": "Num 16:3", "n": "", "vs": [[3, "هؤلاء تألبوا على موسى وهرون وقالوا: «حسبكما! إن كل الجماعة بأسرها مقدسة، وفي وسطها الرب. فما بالكما تترفعان على جماعة الرب؟»"]]}, {"l": "Mat 6:24", "n": "", "vs": [[24, "لا يمكن لأحد أن يكون عبدا لسيدين: لأنه إما أن يبغض أحدهما فيحب الآخر، وإما أن يلزم أحدهما فيهجر الآخر. لا يمكنكم أن تكونوا عبيدا لله والمال معا."]]}, {"l": "2Pe 2:10", "n": "", "vs": [[10, "وما أشد العقاب، وبخاصة على الذين ينجرفون وراء الميول الجسدية، مستجيبين لشهوة النجاسة، ومحتقرين سيادة الله! ثم إنهم وقحون، معجبون بأنفسهم، لا يخافون أن يتكلموا بالشتم والإهانة على أصحاب الأمجاد."]]}, {"l": "Jud 1:8", "n": "", "vs": [[8, "ومع ذلك، فإن أولئك المعلمين المتوهمين يسيرون في الطريق التي سار فيها أهل تلك المدن. إذ يلوثون أجسادهم بالنجاسة، ويحتقرون السيادة الإلهية، ويتكلمون بالإهانة على الكائنات المجيدة!"]]}], "kwAr": "أن لا يستخفوا بهم", "noteAr": ""}, {"kw": "because they are brethren", "raw": "1Ti_5:1; Mat_23:8, Mat_25:40; Rom_8:29; Gal_3:26-29; Col_3:11", "note": "", "refs": [{"l": "1Ti 5:1", "n": "", "vs": [[1, "لا توبخ شيخا توبيخا قاسيا، بل عظه كأنه أب لك. وعامل الشبان كأنهم إخوة لك؛"]]}, {"l": "Mat 23:8", "n": "", "vs": [[8, "أما أنتم، فلا تقبلوا أن يدعوكم أحد: يامعلم! لأن معلمكم واحد، وأنتم جميعا إخوة."]]}, {"l": "Mat 25:40", "n": "", "vs": [[40, "فيجيبهم الملك: الحق أقول لكم: بما أنكم فعلتم ذلك بأحد إخوتي هؤلاء الصغار، فبي فعلتم!"]]}, {"l": "Rom 8:29", "n": "", "vs": [[29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."]]}, {"l": "Gal 3:26-29", "n": "", "vs": [[26, "فإنكم جميعا أبناء الله بالإيمان بالمسيح يسوع."], [27, "لأنكم، جميع الذين تعمدتم في المسيح، قد لبستم المسيح."], [28, "لا فرق بعد الآن بين يهودي ويوناني، أو عبد وحر، أو ذكر وأنثى، لأنكم جميعا واحد في المسيح يسوع."], [29, "فإذا كنتم للمسيح، فأنتم إذن نسل إبراهيم وحسب الوعد وارثون."]]}, {"l": "Col 3:11", "n": "", "vs": [[11, "وفيه لا فرق بين يوناني ويهودي، أو مختون وغير مختون، أو متحضر ومتخلف، أو عبد وحر، بل المسيح هو الكل وفي الكل."]]}], "kwAr": "لأنهم إخوة لهم", "noteAr": ""}, {"kw": "because they are", "raw": "Gal_5:6; Eph_1:1, Eph_1:15; Col_1:2, Col_1:4, Col_3:12; 2Th_1:3; Phm_1:5-7", "note": "", "refs": [{"l": "Gal 5:6", "n": "", "vs": [[6, "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة."]]}, {"l": "Eph 1:1", "n": "", "vs": [[1, "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."]]}, {"l": "Eph 1:15", "n": "", "vs": [[15, "لذلك أنا أيضا، وقد سمعت بما فيكم من الإيمان بالرب يسوع والمحبة لجميع القديسين،"]]}, {"l": "Col 1:2", "n": "", "vs": [[2, "إلى الإخوة القديسين والأمناء في المسيح، المقيمين في مدينة كولوسي. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."]]}, {"l": "Col 1:4", "n": "", "vs": [[4, "إذ بلغنا خبر إيمانكم بالمسيح يسوع والمحبة التي لكم نحو جميع القديسين،"]]}, {"l": "Col 3:12", "n": "", "vs": [[12, "فباعتباركم جماعة مختارة من الله، قديسين محبوبين، البسوا دائما عواطف الحنان واللطف والتواضع والوداعة وطول البال،"]]}, {"l": "2Th 1:3", "n": "", "vs": [[3, "من واجبنا أن نشكر الله على الدوام لأجلكم أيها الإخوة. كما أن هذا حق: لأن إيمانكم ينمو نموا فائقا، ومحبة أحدكم للآخر تفيض بينكم جميعا."]]}, {"l": "Phm 1:5-7", "n": "", "vs": [[5, "وقد سمعت بما لك من محبة وأمانة من نحو الرب يسوع، ومن نحو جميع القديسين،"], [6, "طالبا أن يكون اشتراكك معنا في الإيمان فعالا، فتدرك إلى التمام ما فينا من كل صلاح لأجل المسيح."], [7, "فقد كان لي أيها الأخ، سرور عظيم وتشجيع، بفضل محبتك، لأن عواطف القديسين قد انتعشت بفضلك!"]]}], "kwAr": "بل بالأحرى أن يخدموهم", "noteAr": ""}, {"kw": "faithful", "raw": "or, believing", "note": "or, believing", "refs": [], "kwAr": "مؤمنون محبوبون", "noteAr": "أو: مؤمنون."}, {"kw": "partakers", "raw": "Joe_2:28; Rom_11:17; Eph_3:6; Heb_3:1, Heb_3:14; 1Pe_5:1", "note": "", "refs": [{"l": "Joe 2:28", "n": "", "vs": [[28, "ثم أسكب روحي على كل بشر، فيتنبأ أبناؤكم وبناتكم، ويحلم شيوخكم أحلاما ويرى شبابكم رؤى."]]}, {"l": "Rom 11:17", "n": "", "vs": [[17, "فإذا كانت بعض أغصان الزيتونة قد قطعت، ثم طعمت فيها وأنت من زيتونة برية، فصرت بذلك شريكا في أصل الزيتونة وغذائها،"]]}, {"l": "Eph 3:6", "n": "", "vs": [[6, "وهو أن الأمم هم شركاء اليهود في الميراث، وأعضاء في الجسد معهم، ولهم أيضا حق الاستفادة من الوعد. وذلك في المسيح يسوع وبفضل الإنجيل"]]}, {"l": "Heb 3:1", "n": "", "vs": [[1, "إذن، أيها الإخوة القديسون الذين اشتركتم في الدعوة السماوية، تأملوا يسوع: الرسول ورئيس الكهنة في الإيمان الذي نتمسك به."]]}, {"l": "Heb 3:14", "n": "", "vs": [[14, "فإن تمسكنا دائما بالثقة التي انطلقنا بها في البداية، وأبقيناها ثابتة إلى النهاية، نكون مشاركين للمسيح."]]}, {"l": "1Pe 5:1", "n": "", "vs": [[1, "وهذه وصيتي إلى الشيوخ الذين بينكم، بصفتي شيخا رفيقا لهم، وشاهدا لآلام المسيح، وشريكا في المجد الذي سيتجلى:"]]}], "kwAr": "المستفيدين", "noteAr": ""}, {"kw": "These", "raw": "1Ti_4:11; Tit_2:1, Tit_2:15, Tit_3:8", "note": "", "refs": [{"l": "1Ti 4:11", "n": "", "vs": [[11, "أوص بهذه الأمور وعلم!"]]}, {"l": "Tit 2:1", "n": "", "vs": [[1, "أما أنت، فعلم بما يوافق التعليم الصحيح:"]]}, {"l": "Tit 2:15", "n": "", "vs": [[15, "بهذه الأمور تكلم، وعظ، ووبخ بكل سلطان، ولا تدع أحدا يستخف بك!"]]}, {"l": "Tit 3:8", "n": "", "vs": [[8, "صادق هذا القول! وأريد أن تقرر هذه الأمور قرارا حاسما، حتى يهتم الذين آمنوا بالله بأن يجتهدوا في الأعمال الصالحة. هذه الأمور حسنة ونافعة للناس."]]}], "kwAr": "وعلى الذين", "noteAr": ""}], "arS": [["وعلى الذين لهم ", []], ["سادة", ["G1203"]], [" ", []], ["مؤمنون", ["G4103"]], [" أن لا ", []], ["يستخفوا", ["G2706"]], [" بهم لأنهم ", []], ["إخوة", ["G80"]], [" لهم، بل ", []], ["بالأحرى", ["G3123"]], [" أن ", []], ["يخدموهم", ["G1398"]], [" بخضوع، لأن ", []], ["المستفيدين", ["G482"]], [" من ", []], ["خدمتهم الصالحة", ["G2108"]], [" هم ", []], ["مؤمنون", ["G4103"]], [" ", []], ["محبوبون", ["G27"]], [".", []]]}, {"c": 6, "v": 3, "text": "أما إذا كان أحد يعلم ما يخالفها ولا يذعن للكلام الصحيح، كلام ربنا يسوع المسيح، وللتعليم الموافق للتقوى،", "groups": [{"kw": "any", "raw": "1Ti_1:3, 1Ti_1:6; Rom_16:17; Gal_1:6, Gal_1:7", "note": "", "refs": [{"l": "1Ti 1:3", "n": "", "vs": [[3, "كما أوصيتك لما كنت منطلقا إلى مقاطعة مقدونية، (أطلب إليك) أن تبقى في مدينة أفسس، لكي تمنع بعض المعلمين من نشر التعاليم المخالفة للتعليم الصحيح،"]]}, {"l": "1Ti 1:6", "n": "", "vs": [[6, "هذه الفضائل قد زاغ عنها بعضهم، فانحرفوا إلى المجادلات الباطلة،"]]}, {"l": "Rom 16:17", "n": "", "vs": [[17, "ولكن، أتوسل إليكم، أيها الإخوة، أن تنتبهوا إلى مثيري الانقسامات والعثرات، خلافا للتعليم الذي تعلمتم، وأن تبتعدوا عنهم."]]}, {"l": "Gal 1:6", "n": "", "vs": [[6, "عجبا! كيف تتحولون بمثل هذه السرعة عن الذي دعاكم بنعمة المسيح، وتنصرفون إلى إنجيل غريب؟"]]}, {"l": "Gal 1:7", "n": "", "vs": [[7, "لا أعني أن هنالك إنجيلا آخر، بل إنما هنالك بعض (المعلمين) الذين يثيرون البلبلة بينكم، راغبين في تحوير إنجيل المسيح."]]}], "kwAr": "إذا كان أحد يعلم ما يخالفها", "noteAr": ""}, {"kw": "to wholesome", "raw": "1Ti_1:10; 2Ti_1:13, 2Ti_4:3; Tit_1:9, Tit_2:1, Tit_2:2 *Gr: Pro_15:4; Tit_1:9, Tit_3:8", "note": "", "refs": [{"l": "1Ti 1:10", "n": "", "vs": [[10, "والزناة ومضاجعي الذكور، وخطافي الناس والكذابين وشاهدي الزور. وذوي كل شر آخر يخالف التعليم الصحيح"]]}, {"l": "2Ti 1:13", "n": "", "vs": [[13, "اتخذ من الكلام الصحيح الذي سمعته مني مثالا في الإيمان والمحبة اللذين في المسيح يسوع."]]}, {"l": "2Ti 4:3", "n": "", "vs": [[3, "فإنه سيأتي زمان لا يطيق الناس فيه التعليم الصحيح، بل تبعا لشهواتهم الخاصة يكدسون لأنفسهم معلمين (يقولون لهم كلاما) يداعب الآذان."]]}, {"l": "Tit 1:9", "n": "", "vs": [[9, "ملتصقا بالكلمة الصادقة الموافقة للتعليم، ليكون قادرا على تشجيع المؤمنين بالتعليم الصحيح وعلى إفحام المعارضين."]]}, {"l": "Tit 2:1", "n": "", "vs": [[1, "أما أنت، فعلم بما يوافق التعليم الصحيح:"]]}, {"l": "Tit 2:2", "n": "*Gr:", "vs": [[2, "أن يكون الشيوخ ذوي رزانة ووقار، متعقلين، صحيحي الإيمان والمحبة والصبر."]]}, {"l": "Pro 15:4", "n": "", "vs": [[4, "اللسان السليم ينعش كشجرة حياة، واعوجاجه يؤدي إلى انكسار الروح."]]}, {"l": "Tit 1:9", "n": "", "vs": [[9, "ملتصقا بالكلمة الصادقة الموافقة للتعليم، ليكون قادرا على تشجيع المؤمنين بالتعليم الصحيح وعلى إفحام المعارضين."]]}, {"l": "Tit 3:8", "n": "", "vs": [[8, "صادق هذا القول! وأريد أن تقرر هذه الأمور قرارا حاسما، حتى يهتم الذين آمنوا بالله بأن يجتهدوا في الأعمال الصالحة. هذه الأمور حسنة ونافعة للناس."]]}], "kwAr": "للكلام الصحيح", "noteAr": ""}, {"kw": "the words", "raw": "Mat_22:21, Mat_28:20; 1Th_4:1, 1Th_4:2, 1Th_4:8", "note": "", "refs": [{"l": "Mat 22:21", "n": "", "vs": [[21, "أجابوه: «للقيصر!» فقال لهم: «إذن، أعطوا ما للقيصر للقيصر، وما لله لله»"]]}, {"l": "Mat 28:20", "n": "", "vs": [[20, "وعلموهم أن يعملوا بكل ما أوصيتكم به. وها أنا معكم كل الأيام إلى انتهاء الزمان! »."]]}, {"l": "1Th 4:1", "n": "", "vs": [[1, "وبعد، أيها الإخوة، فمثلما تلقيتم منا كيف يجب أن تسلكوا سلوكا يرضي الله ، وكما أنتم فاعلون، نرجو منكم ونحرضكم في الرب يسوع أن تضاعفوا تقدمكم في ذلك أكثر فأكثر."]]}, {"l": "1Th 4:2", "n": "", "vs": [[2, "فإنكم تعرفون الوصايا التي لقناكم إياها من قبل الرب يسوع."]]}, {"l": "1Th 4:8", "n": "", "vs": [[8, "إذن، من استخف بأخيه في هذا الأمر، يستخف لا بإنسان بل بالله، بذاك الذي وهبكم فعلا روحه القدوس."]]}], "kwAr": "كلام ربنا يسوع المسيح", "noteAr": ""}, {"kw": "the doctrine", "raw": "1Ti_4:7, 1Ti_4:8; Tit_1:1, Tit_2:11-14; 2Pe_1:3-7", "note": "", "refs": [{"l": "1Ti 4:7", "n": "", "vs": [[7, "أما أساطير العجائز المبتذلة، فتجنبها. إنما مرن نفسك في طريق التقوى."]]}, {"l": "1Ti 4:8", "n": "", "vs": [[8, "فالرياضة البدنية نافعة بعض الشيء. أما التقوى فنافعة لكل شيء، لأن فيها وعدا بالحياة الحاضرة والآتية."]]}, {"l": "Tit 1:1", "n": "", "vs": [[1, "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"]]}, {"l": "Tit 2:11-14", "n": "", "vs": [[11, "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت."], [12, "وهي تعلمنا أن نقطع علاقتنا بالإباحية والشهوات العالمية، وأن نحيا في العصر الحاضر حياة التعقل والبر والتقوى،"], [13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"], [14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "2Pe 1:3-7", "n": "", "vs": [[3, "إن الله، بقدرته الإلهية، قد زودنا بكل ما نحتاج إليه في الحيا ة الروحية المتصفة بالتقوى. ذلك أنه عرفنا بالمسيح الذي دعانا إلى مجده وفضيلته،"], [4, "اللذين بهما أعطانا الله بركاته العظمى الثمينة التي كان قد وعد بها. وبهذا صار بإمكانكم أن تتخلصوا من الفساد الذي تنشره الشهوة في العالم، وتشتركوا في الطبيعة الإلهية."], [5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"], [6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"], [7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."]]}], "kwAr": "وللتعليم الموافق للتقوى", "noteAr": ""}], "arS": [["أما إذا كان ", []], ["أحد", ["G1536"]], [" ", []], ["يعلم ما يخالفها", ["G2085"]], [" ولا ", []], ["يذعن", ["G4334"]], [" ", []], ["للكلام", ["G3056"]], [" ", []], ["الصحيح", ["G5198"]], ["، كلام ", []], ["ربنا", ["G2962", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], ["، ", []], ["وللتعليم", ["G1319"]], [" ", []], ["الموافق", ["G2596"]], [" ", []], ["للتقوى", ["G2150"]], ["،", []]]}, {"c": 6, "v": 4, "text": "فهو قد انتفخ تكبرا، ولا يعرف شيئا، وإنما هو مهووس بالمجادلات والمنازعات الكلامية، ومنها ينشأ الحسد والخصام والتجريح والنيات السيئة،", "groups": [{"kw": "He", "raw": "1Ti_1:7, 1Ti_3:6; Pro_13:7, Pro_25:14, Pro_26:12; Act_8:9, Act_8:21-23; Rom_12:16; 1Co_3:18; 1Co_8:1, 1Co_8:2; Gal_6:3; Col_2:18; 2Th_2:4; 2Ti_3:4; 2Pe_2:12, 2Pe_2:18; Jud_1:10,Jud_1:16; Rev_3:17", "note": "", "refs": [{"l": "1Ti 1:7", "n": "", "vs": [[7, "راغبين في أن يكونوا أساتذة في الشريعة، وهم لا يفهمون ما يقولون ولا ما يقررون!"]]}, {"l": "1Ti 3:6", "n": "", "vs": [[6, "ويجب أيضا أن لا يكون مبتدئا في الإيمان، لئلا ينتفخ تكبرا، فيقع في جريمة إبليس!"]]}, {"l": "Pro 13:7", "n": "", "vs": [[7, "رب فقير معدم يتظاهر بالغنى، وكثير الغنى يتظاهر بالفقر."]]}, {"l": "Pro 25:14", "n": "", "vs": [[14, "المتفاخر بإغداق هدايا كاذبة هو كالسحاب والريح بلا مطر."]]}, {"l": "Pro 26:12", "n": "", "vs": [[12, "أشاهدت رجلا معتزا بحكمته؟ إن للجاهل رجاء في الإصلاح أكثر منه."]]}, {"l": "Act 8:9", "n": "", "vs": [[9, "وكان قبل ذلك في تلك المدينة ساحر اسمه سيمون، يمارس السحر فيذهل أهل السامرة ويدعي أنه رجل عظيم."]]}, {"l": "Act 8:21-23", "n": "", "vs": [[21, "لا قسمة لك في هذا الأمر ولا نصيب، لأن قلبك ليس مخلصا تجاه الله."], [22, "فتب عن شرك هذا واطلب إلى الله، عسى أن يغفر لك نية قلبك،"], [23, "لأني أراك تتخبط في مرارة العلقم وقيود الخطيئة!»"]]}, {"l": "Rom 12:16", "n": "", "vs": [[16, "كونوا متوافقين بعضكم مع بعض، غير مهتمين بالأمور العالية، بل مسايرين ذوي المراكز الوضيعة. لا تكونوا حكماء في نظر أنفسكم."]]}, {"l": "1Co 3:18", "n": "", "vs": [[18, "حذار أن يخدع أحد منكم نفسه! إن ظن أحد بينكم نفسه حكيما في هذا العالم، فليصر جاهلا ليصير حكيما حقا."]]}, {"l": "1Co 8:1", "n": "", "vs": [[1, "وأما فيما يتعلق بالذبائح المقدمة للأصنام، فنعلم أن المعرفة لجميعنا. غير أن المعرفة تنفخ تكبرا، ولكن المحبة تبني. فمن ظن أنه يعرف شيئا،"]]}, {"l": "1Co 8:2", "n": "", "vs": [[2, "فهو لا يعرف شيئا بعد حق المعرفة."]]}, {"l": "Gal 6:3", "n": "", "vs": [[3, "فإن ظن أحد أنه شيء، وهو في الواقع لا شيء، فإنما يخدع نفسه."]]}, {"l": "Col 2:18", "n": "", "vs": [[18, "لا يحرمكم أحد من جائزتكم، بحملكم على ما يرغب فيه من إظهار التواضع والتعبد للملائكة، داخلا في رؤى يتوهمها، وقد نفخه باطلا ذهنه الجسدي،"]]}, {"l": "2Th 2:4", "n": "", "vs": [[4, "الذي يتحدى كل ما يدعى إلها أو معبودا، ويعاديه مترفعا عليه. بل إنه أيضا يتخذ من هيكل الله مقرا له، محاولا أن يبرهن أنه إله."]]}, {"l": "2Ti 3:4", "n": "", "vs": [[4, "خائنين، وقحين، مدعين، محبين للذات أكثر من محبتهم لله،"]]}, {"l": "2Pe 2:12", "n": "", "vs": [[12, "حقا إن هؤلاء المعلمين الدجالين الذين يتكلمون كلاما مهينا في أمور يجهلونها، يشبهون الحيوانات المفترسة غير العاقلة، المولودة ليصطادها الناس ويقتلوها. فلابد أن يهلكوا مثلها."]]}, {"l": "2Pe 2:18", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."]]}, {"l": "Jud 1:10", "n": "", "vs": [[10, "ولكن هؤلاء المعلمين يتكلمون كلاما مهينا على أمور لا يعرفونها. وأما ما يفهمونه بالغريزة، كالحيوانات غير العاقلة، فإنهم به يدمرون أنفسهم."]]}, {"l": "Jud 1:16", "n": "", "vs": [[16, "وهؤلاء المعلمون يتذمرون ويشكون دائما وفيما هم يندفعون وراء شهواتهم، يطلقون ألسنتهم متحدثين بأمور طنانة، ويمدحون من يعجبهم طلبا للمنفعة!"]]}, {"l": "Rev 3:17", "n": "", "vs": [[17, "تقول: أنا غني، قد اغتنيت ولا يعوزني شيء! ولكنك لا تعلم أنك شقي بائس فقير أعمى عريا ن."]]}], "kwAr": "فهو", "noteAr": ""}, {"kw": "proud", "raw": "or, a fool", "note": "or, a fool", "refs": [], "kwAr": "قد انتفخ تكبرا", "noteAr": "أو: أحمق."}, {"kw": "doting", "raw": "or, sick", "note": "or, sick", "refs": [], "kwAr": "مهووس", "noteAr": "أو: مريض (سقيم)."}, {"kw": "about", "raw": "1Ti_1:4; 2Ti_2:23", "note": "", "refs": [{"l": "1Ti 1:4", "n": "", "vs": [[4, "وتوصي المؤمنين ألا ينشغلوا بالأساطير وسلاسل النسب المتشابكة. فتلك الأمور تثير المجادلات ولا تعمل على تقدم تدبير الله القائم على الإيمان."]]}, {"l": "2Ti 2:23", "n": "", "vs": [[23, "أما المجادلات الغبية الحمقاء، فتجنبها، عالما أنها تولد المشاجرات."]]}], "kwAr": "بالمجادلات", "noteAr": ""}, {"kw": "words", "raw": "Isa_58:4; Act_15:2; Rom_2:8, Rom_13:13, Rom_14:1; 1Co_3:3, 1Co_11:16, 1Co_11:18; 2Co_11:20; Gal_5:15, Gal_5:20,Gal_5:21, Gal_5:26; Phi_1:15, Phi_2:3, Phi_2:14; Tit_3:9; Jam_1:19, Jam_2:14-18; Jam_4:1, Jam_4:2, Jam_4:5, Jam_4:6; 1Pe_2:1, 1Pe_2:2", "note": "", "refs": [{"l": "Isa 58:4", "n": "", "vs": [[4, "وها أنتم تصومون لكي تتخاصموا وتتشاجروا فقط، وتتضاربوا بكلمات أثيمة. إن مثل صومكم اليوم لا يجعل أصواتكم مسموعة في العلاء."]]}, {"l": "Act 15:2", "n": "", "vs": [[2, "فجادلهم بولس وبرنابا جدالا عنيفا. وبعد المناقشة قرر مؤمنو أنطاكية أن يذهب بولس وبرنابا مع بعض المؤمنين ليقابلوا الرسل والشيوخ في أورشليم، ويبحثوا معهم في هذه القضية."]]}, {"l": "Rom 2:8", "n": "", "vs": [[8, "ويكون الغضب والسخط للمخاصمين الذين يرفضون الطاعة للحق ولكنهم يخضعون للإثم."]]}, {"l": "Rom 13:13", "n": "", "vs": [[13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."]]}, {"l": "Rom 14:1", "n": "", "vs": [[1, "ومن كان ضعيفا في الإيمان، فاقبلوه بينكم دون أن تحاكموه على أرائه."]]}, {"l": "1Co 3:3", "n": "", "vs": [[3, "فإنكم مازلتم جسديين. فمادام بينكم حسد وخصام (وانقسام)، أفلا تكونون جسديين وتسلكون وفقا للبشر؟"]]}, {"l": "1Co 11:16", "n": "", "vs": [[16, "أما إذا رغب أحد في إظهار المشاكسة، فليس لنا نحن مثل هذه العادة ولا لكنائس الله!"]]}, {"l": "1Co 11:18", "n": "", "vs": [[18, "فأولا، سمعت أنكم، حين تجتمع جماعتكم، يكون بينكم شقاق. وأكاد أصدق ذلك،"]]}, {"l": "2Co 11:20", "n": "", "vs": [[20, "فإنكم تحتملون كل من يستعبدكم، ويفترسكم، ويستغلكم، ويتكبر عليكم، ويلطمكم على وجوهكم."]]}, {"l": "Gal 5:15", "n": "", "vs": [[15, "فإذا كنتم تنهشون وتفترسون بعضكم بعضا، فاحذروا أن يفني أحدكم الآخر!"]]}, {"l": "Gal 5:20", "n": "", "vs": [[20, "وعبادة الأصنام والسحر، والعداوة والنزاع والغيرة والغضب، والتحزب والانقسام والتعصب،"]]}, {"l": "Gal 5:21", "n": "", "vs": [[21, "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!"]]}, {"l": "Gal 5:26", "n": "", "vs": [[26, "لا نكن طامحين إلى المجد الباطل، يستفز بعضنا بعضا، ويحسد أحدنا الآخر!"]]}, {"l": "Phi 1:15", "n": "", "vs": [[15, "حقا أن بعضهم يبشرون بالمسيح عن حسد ونزاع؛ وأما الآخرون فعن حسن نية."]]}, {"l": "Phi 2:3", "n": "", "vs": [[3, "لا يكن بينكم شيء بروح التحزب والافتخار الباطل، بل بالتواضع ليعتبر كل واحد منكم غيره أفضل كثيرا من نفسه،"]]}, {"l": "Phi 2:14", "n": "", "vs": [[14, "فافعلوا كل شيء دون تذمر أو جدال،"]]}, {"l": "Tit 3:9", "n": "", "vs": [[9, "أما المسائل السخيفة، وسلاسل النسب، والمخاصمات، والمنازعات حول الشريعة، فتجنبها، لأنها غير نافعة، وباطلة."]]}, {"l": "Jam 1:19", "n": "", "vs": [[19, "لذلك، ياإخوتي الأحباء، على كل واحد منكم أن يكون مسرعا إلى الإصغاء، غير متسرع في الكلام، بطيء الغضب."]]}, {"l": "Jam 2:14-18", "n": "", "vs": [[14, "ياإخوتي، هل ينفع أحدا أن يدعي أنه مؤمن، وليس له أعمال تثبت ذلك، هل يقدر إيمان مثل هذا أن يخلصه؟"], [15, "لنفرض أن أخا أو أختا كانا بحاجة شديدة إلى الثياب والطعام اليومي،"], [16, "وقال لهما أحدكم: «أتمنى لكما كل خير. البسا ثيابا دافئة، وكلا طعاما جيدا!» دون أن يقدم لهما ما يحتاجان إليه من ثياب وطعام، فأي نفع في ذلك؟"], [17, "هكذا نرى أن الإيمان وحده ميت ما لم تنتج عنه أعمال."], [18, "وربما قال أحدكم: «أنت لك إيمان وأنا لي أعمال». أرني كيف يكون إيمانك من غير أعمال، وأنا أريك كيف يكون إيماني بأعمالي."]]}, {"l": "Jam 4:1", "n": "", "vs": [[1, "من أين النزاع والخصام بينكم؟ أليس من لذاتكم تلك المتصارعة في أعضائكم؟"]]}, {"l": "Jam 4:2", "n": "", "vs": [[2, "فأنتم ترغبون في امتلاك ما لا يخصكم، لكن ذلك لا يتحقق لكم، فتقتلون، وتحسدون، ولا تتمكنون من بلوغ غايتكم. وهكذا تتخاصمون وتتصارعون! إنكم لا تمتلكون ما تريدونه، لأنكم لا تطلبونه من الله."]]}, {"l": "Jam 4:5", "n": "", "vs": [[5, "أتظنون أن الكتاب يتكلم عبثا! هل الروح الذي حل في داخلنا يغار عن حسد؟"]]}, {"l": "Jam 4:6", "n": "", "vs": [[6, "لا، بل إنه يجود علينا بنعمة أعظم. لذلك يقول الكتاب: «إن الله يقاوم المتكبرين، ولكنه يعطي المتواضعين نعمة»."]]}, {"l": "1Pe 2:1", "n": "", "vs": [[1, "لذلك، تخلصوا من كل أثر للشر والخداع والرياء والحسد والذم."]]}, {"l": "1Pe 2:2", "n": "", "vs": [[2, "وكأطفال مولودين حديثا، تشوقوا إلى اللبن الروحي النقي لكي تنموا به إلى أن تبلغوا الخلاص،"]]}], "kwAr": "والمنازعات الكلامية", "noteAr": ""}], "arS": [["فهو قد ", []], ["انتفخ تكبرا", ["G5187"]], ["، ولا ", []], ["يعرف", ["G1987"]], [" ", []], ["شيئا", ["G3367"]], ["، وإنما هو ", []], ["مهووس", ["G3552"]], [" ", []], ["بالمجادلات", ["G2214"]], [" ", []], ["والمنازعات الكلامية", ["G3055"]], ["، ومنها ", []], ["ينشأ", ["G1096"]], [" ", []], ["الحسد", ["G5355"]], [" ", []], ["والخصام", ["G2054"]], [" ", []], ["والتجريح", ["G988"]], [" ", []], ["والنيات السيئة", ["G5283"]], ["،", []]]}, {"c": 6, "v": 5, "text": "وشتى أنواع النزاع بين أناس فاسدي العقول مجردين من الحق، يعتبرون التقوى تجارة.", "groups": [{"kw": "Perverse", "raw": "etc. or, Gallings one of another, 1Ti_1:6; 1Co_11:16", "note": "etc. or, Gallings one of another, 1Ti_1:6; 1Co_11:16", "refs": [{"l": "1Ti 1:6", "n": "", "vs": [[6, "هذه الفضائل قد زاغ عنها بعضهم، فانحرفوا إلى المجادلات الباطلة،"]]}, {"l": "1Co 11:16", "n": "", "vs": [[16, "أما إذا رغب أحد في إظهار المشاكسة، فليس لنا نحن مثل هذه العادة ولا لكنائس الله!"]]}], "kwAr": "وشتى أنواع النزاع", "noteAr": "أو: احتكاكات بعضهم ببعض (مشاحنات)."}, {"kw": "men", "raw": "Mat_7:17-20, Mat_12:33; Joh_3:19-21; Eph_4:17-19; 2Th_2:8-11; 2Ti_3:8; Tit_1:15, Tit_1:16; Heb_3:12, Heb_3:13; 2Jo_1:8-10", "note": "", "refs": [{"l": "Mat 7:17-20", "n": "", "vs": [[17, "هكذا، كل شجرة جيدة تثمر ثمرا جيدا. أما الشجرة الرديئة، فإنها تثمر ثمرا رديئا."], [18, "لا يمكن أن تثمر الشجرة الجيدة ثمرا رديئا، ولا الشجرة الرديئة ثمرا جيدا."], [19, "وكل شجرة لا تثمر ثمرا جيدا، تقطع وتطرح في النار."], [20, "إذن من ثمارهم تعرفونهم."]]}, {"l": "Mat 12:33", "n": "", "vs": [[33, "لتكن الشجرة جيدة، فتنتج ثمرا جيدا؛ ولتكن الشجرة رديئة، فتنتج ثمرا رديئا! فمن الثمر، تعرف الشجرة."]]}, {"l": "Joh 3:19-21", "n": "", "vs": [[19, "وهذا هو الحكم: إن النور قد جاء إلى العالم، ولكن الناس أحبوا الظلمة أكثر من النور، لأن أعمالهم كانت شريرة."], [20, "فكل من يعمل الشر يبغض النور، ولا يأتي إليه مخافة أن تفضح أعماله."], [21, "وأما الذي يسلك في الحق فيأتي إلى النور لتظهر أعماله ويتبين أنها عملت بقوة الله»."]]}, {"l": "Eph 4:17-19", "n": "", "vs": [[17, "أقول هذا إذن، وأشهد في الرب، راجيا ألا تسلكوا فيما بعد كما يسلك الأمم في عقم ذهنهم،"], [18, "لكونهم مظلمي البصيرة ومتغربين عن حياة الله بسبب ما فيهم من جهل وقساوة قلب."], [19, "فهؤلاء، إذ طرحوا جانبا كل إحساس، استسلموا للإباحية ليرتكبوا كل نجاسة بشهوة نهمة لا ترتوي."]]}, {"l": "2Th 2:8-11", "n": "", "vs": [[8, "عندئذ سيظهر الإنسان المتمرد ظهورا جليا فيبيده الرب يسوع بنفخة فمه ويلاشيه ببهاء ظهوره عند عودته."], [9, "أما بروز المتمرد، فسوف يكون بقدر طاقة الشيطان على المعجزات والعلامات والعجائب المزيفة كلها،"], [10, "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا."], [11, "ولهذا السبب، سيرسل الله إليهم طاقة الضلال حتى يصدقوا ما هو دجل،"]]}, {"l": "2Ti 3:8", "n": "", "vs": [[8, "ومثلما قاوم (الساحران) ينيس ويمبريس موسى، كذلك أيضا يقاوم هؤلاء الحق؛ أناس عقولهم فاسدة، وقد تبين أنهم غير أهل للإيمان."]]}, {"l": "Tit 1:15", "n": "", "vs": [[15, "عند الطاهرين، كل شيء طاهر. أما عند النجسين وغير المؤمنين، فما من شيء طاهر، بل إن عقولهم وضمائرهم أيضا قد صارت نجسة."]]}, {"l": "Tit 1:16", "n": "", "vs": [[16, "يشهدون معترفين بأنهم يعرفون الله ، ولكنهم بأعمالهم ينكرونه، لأنهم مكروهون وغير طائعين، وقد تبين أنهم غير أهل لكل عمل صالح."]]}, {"l": "Heb 3:12", "n": "", "vs": [[12, "فعليكم، أيها الإخوة، أن تأخذوا حذركم جيدا، حتى لا يكون قلب أي واحد منكم شريرا لا إيمان فيه، مما يؤدي به إلى الارتداد عن الله الحي."]]}, {"l": "Heb 3:13", "n": "", "vs": [[13, "وإنما، شجعوا بعضكم بعضا كل يوم، مادمنا نقول: «اليوم...». وذلك لكي لا تقسي الخطيئة قلب أحد منكم بخداعها."]]}, {"l": "2Jo 1:8-10", "n": "", "vs": [[8, "فانتبهوا لأنفسكم، لكي لا يضيع الجهد الذي بذلناه في سبيلكم، بل لتنالوا أجركم كاملا."], [9, "لأن من تعدى تعليم المسيح ولم يثبت فيه، فليس الله من نصيبه. أما من يثبت في هذا التعليم، فله الآب والابن معا."], [10, "إن جاءكم أحد بغير هذا التعليم، فلا تستقبلوه في بيتكم، ولا تبادلوه التحية."]]}], "kwAr": "أناس فاسدي العقول", "noteAr": ""}, {"kw": "supposing", "raw": "1Ti_6:6, 1Ti_3:3, 1Ti_3:8; 2Ki_5:20-27; Isa_56:11; Jer_6:13, Jer_8:10; Eze_33:31; Mat_21:13; Mat_23:14; Act_8:18-20, Act_19:24-28; Tit_1:11; 2Pe_2:3, 2Pe_2:15; Jud_1:11; Rev_18:3, Rev_18:13", "note": "", "refs": [{"l": "1Ti 6:6", "n": "", "vs": [[6, "أما التقوى مع القناعة فهي تجارة عظيمة."]]}, {"l": "1Ti 3:3", "n": "", "vs": [[3, "لا مدمنا للخمر ولا عنيفا؛ بل لطيفا، غير متعود الخصام، غير مولع بالمال،"]]}, {"l": "1Ti 3:8", "n": "", "vs": [[8, "أما المدبرون، فيجب أن يكونوا أيضا ذوي رصانة، لا ذوي لسانين، ولا مدمنين للخمر، لا ساعين إلى المكسب الخسيس."]]}, {"l": "2Ki 5:20-27", "n": "", "vs": [[20, "حتى حدث جيحزي خادم أليشع نفسه: «سيدي امتنع عن قبول ما أحضره نعمان من هدايا. حي هو الرب لأسرعن وراءه وآخذ منه شيئا»."], [21, "فلحق جيحزي بنعمان. ولما أبصره نعمان راكضا نحوه، ترجل عن المركبة للقائه سائلا: «أللخير جئت؟»"], [22, "فأجاب: «للخير. إن سيدي قد أرسلني قائلا: إن رجلين من جبل أفرايم من بني الأنبياء جاءاه، فأرجوك أن تعطيهما وزنة من الفضة وحلتي ثياب»."], [23, "فقال نعمان: «أرجوك أن تأخذ وزنتين» وألح عليه، وصرهما في كيسين وحلتي ثياب، وأعطاهما لرجلين من رجاله، فحملاهما وانطلقا أمام جيحزي."], [24, "وعندما وصل إلى الأكمة حيث يقيم أليشع أخذها منهما وأخفاها في البيت، وصرف الرجلين."], [25, "ثم دخل إلى أليشع، فسأله: «من أين جئت ياجيحزي؟» فأجاب: «لم يذهب عبدك إلى أي مكان»."], [26, "فقال له: «ألا تعرف أن قلبي كان حاضرا هناك حين ترجل الرجل من مركبته للقائك؟ أهذا وقت الحصول على فضة أو أخذ ثياب وزيتون وكروم وغنم وبقر وعبيد وجوار؟"], [27, "فليحل برص نعمان بك وبنسلك إلى الأبد». فخرج من أمامه وجلده أبرص في لون الثلج."]]}, {"l": "Isa 56:11", "n": "", "vs": [[11, "هم كلاب نهمة لا تعرف الشبع، ورعاة أيضا مجردون من الفهم، كل مال إلى طريقه طمعا في الربح،"]]}, {"l": "Jer 6:13", "n": "", "vs": [[13, "لأنهم جميعا، صغارهم وكبارهم، مولعون بالربح الحرام. حتى النبي والكاهن يرتكبان الزور في أعمالهما."]]}, {"l": "Jer 8:10", "n": "", "vs": [[10, "لذلك أعطي نساءهم لآخرين وحقولهم للوارثين القاهرين، لأنهم جميعا من صغيرهم إلى كبيرهم مولعون بالربح. حتى النبي والكاهن يرتكبان الزور في أعمالهما،"]]}, {"l": "Eze 33:31", "n": "", "vs": [[31, "ويقبلون إليك مثل سائر الشعب ويجلسون في حضرتك نظير شعبي، ويصغون إلى كلامك ولا يعملون به. إنهم يعربون عن أشواقهم بكلامهم، أما قلبهم فقد غوى وراء مكسبهم."]]}, {"l": "Mat 21:13", "n": "", "vs": [[13, "وقال لهم: «مكتوب: إن بيتي بيتا للصلاة يدعى. أما أنتم فجعلتموه مغارة لصوص!»"]]}, {"l": "Mat 23:14", "n": "", "vs": [[14, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تلتهمون بيوت الأرامل وتتذرعون بإطالة صلواتكم. لذلك ستنزل بكم دينونة أقسى!"]]}, {"l": "Act 8:18-20", "n": "", "vs": [[18, "ولما رأى سيمون أن الروح القدس قد حل على المؤمنين لما وضع الرسولان أيديهما عليهم، عرض على بطرس ويوحنا بعض المال، وقال لهما:"], [19, "«أعطياني أنا أيضا هذه السلطة لكي ينال الروح القدس من أضع عليه يدي»."], [20, "فقال له بطرس: «لتبق لك فضتك لهلاكك! لأنك ظننت أنك تقدر أن تشتري هبة الله بالمال!"]]}, {"l": "Act 19:24-28", "n": "", "vs": [[24, "فإن صائغا اسمه ديمتريوس كان يصنع نماذج فضية صغيرة لمعابد الإلهة أرطاميس، فيعود ذلك عليه وعلى عماله بربح وفير،"], [25, "دعا عماله وأهل مهنته، وقال لهم: «تعلمون أيها الرجال أن عيشنا الرغيد يعتمد على صناعتنا هذه،"], [26, "وقد رأيتم وسمعتم أن بولس هذا أضل عددا كبيرا من الناس، لا في أفسس وحدها، بل في مقاطعة أسيا كلها تقريبا، وأقنعهم بأن الآلهة التي تصنعها الأيدي ليست بآلهة."], [27, "وهذا لا يهدد صناعتنا بالكساد وحسب، بل يعرض معبد أرطاميس إلهتنا العظمى لفقدان هيبته. فنخشى أن تتلاشى كرامتها وتنهار عظمتها، وهي التي يتعبد لها سكان أسيا جميعا، بل العالم كله!»"], [28, "فلما سمع العمال هذا الكلام تملكهم الغضب وبدأوا يصرخون: «عظيمة أرطاميس إلهة أهل أفسس!»"]]}, {"l": "Tit 1:11", "n": "", "vs": [[11, "هؤلاء يجب أن تسد أفواههم: فهم يخربون بيوتا بجملتها، إذ يعلمون تعاليم يجب ألا تعلم، في سبيل مكسب خسيس."]]}, {"l": "2Pe 2:3", "n": "", "vs": [[3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "2Pe 2:15", "n": "", "vs": [[15, "وإذ خرجوا عن الطريق المستقيم، ضلوا. فهم سائرون في طريق بلعام بن بعور، الذي أحب الحصول على المال أجرة لإثمه."]]}, {"l": "Jud 1:11", "n": "", "vs": [[11, "الويل لهم! لأنهم سلكوا طريق قايين، واندفعوا إلى ارتكاب خطيئة بلعام طلبا للمال، وتمردوا كما تمرد قورح، فدمروا أنفسهم."]]}, {"l": "Rev 18:3", "n": "", "vs": [[3, "لأن جميع الأمم شربت من خمر زناها، وملوك الأرض زنوا معها، وتجار الأرض اغتنوا من كثرة ترفها!»"]]}, {"l": "Rev 18:13", "n": "", "vs": [[13, "والقرفة والبهار، والعطور والطيب والبخور، والخمر والزيت والدقيق والحبوب، والبهائم والغنم، والخيل والمركبات، والأجساد والنفوس البشرية"]]}], "kwAr": "يعتبرون التقوى تجارة", "noteAr": ""}, {"kw": "from", "raw": "Rom_16:17, Rom_16:18; 2Th_3:6; 2Ti_3:5", "note": "", "refs": [{"l": "Rom 16:17", "n": "", "vs": [[17, "ولكن، أتوسل إليكم، أيها الإخوة، أن تنتبهوا إلى مثيري الانقسامات والعثرات، خلافا للتعليم الذي تعلمتم، وأن تبتعدوا عنهم."]]}, {"l": "Rom 16:18", "n": "", "vs": [[18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."]]}, {"l": "2Th 3:6", "n": "", "vs": [[6, "ثم نوصيكم، أيها الإخوة، باسم ربنا يسوع المسيح، أن تعتزلوا عن كل أخ يسلك سلوكا فوضويا، لا يوافق التعليم الذي تلقيتم منا."]]}, {"l": "2Ti 3:5", "n": "", "vs": [[5, "لهم من التقوى مظهرها ولكنهم لقوتها منكرون، فعن هؤلاء الناس ابتعد!"]]}], "kwAr": "مجردين من الحق", "noteAr": ""}], "arS": [["وشتى أنواع ", []], ["النزاع", ["G3859"]], [" بين ", []], ["أناس", ["G444"]], [" ", []], ["فاسدي", ["G1311"]], [" ", []], ["العقول", ["G3563"]], [" ", []], ["مجردين", ["G650"]], [" من ", []], ["الحق", ["G225"]], ["، ", []], ["يعتبرون", ["G3543"]], [" ", []], ["التقوى", ["G2150"]], [" ", []], ["تجارة", ["G4200"]], [".", []]]}, {"c": 6, "v": 6, "text": "أما التقوى مع القناعة فهي تجارة عظيمة.", "groups": [{"kw": "godliness", "raw": "1Ti_4:8; Psa_37:16, Psa_84:11; Pro_3:13-18, Pro_8:18-21, Pro_15:16, Pro_16:8; Mat_6:32, Mat_6:33; Luk_12:31, Luk_12:32; Rom_5:3-5, Rom_8:28; 2Co_4:17, 2Co_4:18, 2Co_5:1; Phi_1:21; Heb_13:5", "note": "", "refs": [{"l": "1Ti 4:8", "n": "", "vs": [[8, "فالرياضة البدنية نافعة بعض الشيء. أما التقوى فنافعة لكل شيء، لأن فيها وعدا بالحياة الحاضرة والآتية."]]}, {"l": "Psa 37:16", "n": "", "vs": [[16, "الخير القليل الذي يملكه الصديق أفضل من ثروة أشرار كثيرين،"]]}, {"l": "Psa 84:11", "n": "", "vs": [[11, "لأن الرب الإله شمس وترس. الرب يعطي نعمة ومجدا؛ لا يمنع أي خير عن السالكين بالاستقامة."]]}, {"l": "Pro 3:13-18", "n": "", "vs": [[13, "طوبى للإنسان الذي عثر على الحكمة وللرجل الذي أحرز فهما،"], [14, "لأن مكاسبها أفضل من مكاسب الفضة، وأرباحها خير من أرباح الذهب الخالص."], [15, "هي أثمن من الجواهر، وكل نفائسك لا تعادلها."], [16, "في يمينها حياة مديدة وفي يسارها غنى وجاه."], [17, "طرقها طرق نعم، ودروبها دروب سلام."], [18, "هي شجرة حياة لمن يتشبث بها، وطوبى لمن يتمسك بها."]]}, {"l": "Pro 8:18-21", "n": "", "vs": [[18, "لدي الثراء والمجد والغنى الدائم والصلاح."], [19, "ثمري أفضل من الذهب الخالص، وغلتي خير من الفضة المنتقاة."], [20, "أمشي في طريق البر، وفي سبل العدل أسير."], [21, "لكي أورث محبي غنى، وأملأ خزائنهم كنوزا."]]}, {"l": "Pro 15:16", "n": "", "vs": [[16, "قليل من المال مع تقوى الرب خير من كنز عظيم يخالطه هم."]]}, {"l": "Pro 16:8", "n": "", "vs": [[8, "المال القليل مع العدل خير من دخل وفير حرام."]]}, {"l": "Mat 6:32", "n": "", "vs": [[32, "فهذه الحاجات كلها تسعى إليها الأمم. فإن أباكم السماوي يعلم حاجتكم إلى هذه كلها."]]}, {"l": "Mat 6:33", "n": "", "vs": [[33, "أما أنتم، فاطلبوا أولا ملكوت الله وبره، وهذه كلها تزاد لكم."]]}, {"l": "Luk 12:31", "n": "", "vs": [[31, "إنما اسعوا إلى ملكوته، فتزاد لكم هذه كلها."]]}, {"l": "Luk 12:32", "n": "", "vs": [[32, "لا تخافوا، أيها القطيع الصغير، لأن أباكم قد سر أن يعطيكم الملكوت."]]}, {"l": "Rom 5:3-5", "n": "", "vs": [[3, "ليس هذا فقط، بل نفتخر أيضا في وسط الضيقات، لعلمنا أن الضيق ينتج فينا الصبر،"], [4, "والصبر يؤهلنا للفوز في الامتحان، والفوز يبعث فينا الرجاء،"], [5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."]]}, {"l": "Rom 8:28", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."]]}, {"l": "2Co 4:17", "n": "", "vs": [[17, "ذلك لأن ما يضايقنا الآن من صعوبات بسيطة عابرة، ينتج لنا بمقدار لا يحد وزنة أبدية من المجد،"]]}, {"l": "2Co 4:18", "n": "", "vs": [[18, "إذ نرفع أنظارنا عن الأمور المنظورة ونثبتها على الأمور غير المنظورة. فإن الأمور المنظورة إنما هي إلى حين؛ وأما غير المنظورة فهي أبدية."]]}, {"l": "2Co 5:1", "n": "", "vs": [[1, "فإننا نعلم أنه متى تهدمت خيمتنا الأرضية التي نسكنها الآن، يكون لنا بناء من الله: بيت لم تصنعه أيدي البشر، أبدي في السماوات."]]}, {"l": "Phi 1:21", "n": "", "vs": [[21, "فالحياة عندي هي المسيح، والموت ربح لي."]]}, {"l": "Heb 13:5", "n": "", "vs": [[5, "اجعلوا سيرتكم مترفعة عن حب المال، واقنعوا بما عندكم، لأن الله يقول: «لا أتركك، ولا أتخلى عنك أبدا!»"]]}], "kwAr": "أما التقوى", "noteAr": ""}, {"kw": "contentment", "raw": "1Ti_6:8; Exo_2:21; Luk_3:14; Phi_4:11-13", "note": "", "refs": [{"l": "1Ti 6:8", "n": "", "vs": [[8, "إنما، مادام لنا قوت ولباس، فلنكن قانعين بهما."]]}, {"l": "Exo 2:21", "n": "", "vs": [[21, "وقبل موسى أن يقيم مع الرجل الذي زوجه من ابنته صفورة."]]}, {"l": "Luk 3:14", "n": "", "vs": [[14, "وسأله أيضا بعض الجنود: «ونحن، ماذا نفعل؟» فأجابهم: «لا تظلموا أحدا ولا تشتكوا كذبا على أحد، واقنعوا بمرتباتكم! »"]]}, {"l": "Phi 4:11-13", "n": "", "vs": [[11, "لست أعني أني كنت في حاجة، فأنا قد تعلمت أن أكون قنوعا في كل حال."], [12, "وأعرف كيف أعيش في العوز، وكيف أعيش في الوفرة. فإني، في كل شيء، وفي جميع الأحوال، متدرب على الشبع وعلى الجوع، وعلى العيش في الوفرة أو في العوز."], [13, "إني أستطيع كل شيء، في المسيح الذي يقويني."]]}], "kwAr": "مع القناعة", "noteAr": ""}], "arS": [["أما ", []], ["التقوى", ["G2150"]], [" مع ", []], ["القناعة", ["G841"]], [" فهي ", []], ["تجارة", ["G4200"]], [" ", []], ["عظيمة", ["G3173"]], [".", []]]}, {"c": 6, "v": 7, "text": "فنحن لم ندخل العالم حاملين شيئا، ولا نستطيع أن نخرج منه حاملين شيئا.", "groups": [{"kw": "we brought", "raw": "Job_1:21; Pro_27:24; Ecc_5:15, Ecc_5:16", "note": "", "refs": [{"l": "Job 1:21", "n": "", "vs": [[21, "وقال: «عريانا خرجت من بطن أمي وعريانا أعود إلى هناك. الرب أعطى والرب أخذ، فليكن اسم الرب مباركا»."]]}, {"l": "Pro 27:24", "n": "", "vs": [[24, "لأن الغنى لا يدوم إلى الأبد، ولا يخلد التاج مدى الدهور."]]}, {"l": "Ecc 5:15", "n": "", "vs": [[15, "عريانا يخرج المرء من رحم أمه، وعريانا يفارق الدنيا كما جاء. لا يأخذ شيئا من تعبه يحمله معه في يده."]]}, {"l": "Ecc 5:16", "n": "", "vs": [[16, "وهذا أيضا شر أليم، إذ إنه يفارق الدنيا كما جاء فأي منفعة له، إذ إن تعبه يذهب أدراج الرياح؟"]]}], "kwAr": "لم ندخل العالم حاملين شيئا", "noteAr": ""}, {"kw": "certain", "raw": "Psa_49:17; Luk_12:20,Luk_12:21, Luk_16:22, Luk_16:23", "note": "", "refs": [{"l": "Psa 49:17", "n": "", "vs": [[17, "فإنه عند موته لا يأخذ معه شيئا، ولا يلحق به مجده إلى قبره."]]}, {"l": "Luk 12:20", "n": "", "vs": [[20, "ولكن الله قال له: ياغبي، هذه الليلة تطلب نفسك منك، فلمن يبقى ما أعددته؟"]]}, {"l": "Luk 12:21", "n": "", "vs": [[21, "هذه هي حالة من يخزن الكنوز لنفسه ولا يكون غنيا عند الله!»"]]}, {"l": "Luk 16:22", "n": "", "vs": [[22, "ومات المسكين، وحملته الملائكة إلى حضن إبراهيم. ثم مات الغني أيضا ودفن."]]}, {"l": "Luk 16:23", "n": "", "vs": [[23, "وإذ رفع عينيه وهو في الهاوية يتعذب، رأى إبراهيم من بعيد ولعازر في حضنه."]]}], "kwAr": "ولا نستطيع أن نخرج", "noteAr": ""}], "arS": [["فنحن لم ", []], ["ندخل", ["G1533"]], [" ", []], ["العالم", ["G2889"]], [" حاملين ", []], ["شيئا", ["G3762"]], ["، ولا ", []], ["نستطيع", ["G1410"]], [" أن ", []], ["نخرج", ["G1627"]], [" منه حاملين شيئا.", []]]}, {"c": 6, "v": 8, "text": "إنما، مادام لنا قوت ولباس، فلنكن قانعين بهما.", "groups": [{"kw": "", "raw": "Gen_28:20, Gen_48:15; Deu_2:7, Deu_8:3, Deu_8:4; Pro_27:23-27, Pro_30:8, Pro_30:9; Ecc_2:24-26; Ecc_3:12, Ecc_3:13; Mat_6:11, Mat_6:25-33; Heb_13:5, Heb_13:6", "note": "", "refs": [{"l": "Gen 28:20", "n": "", "vs": [[20, "ونذر يعقوب نذرا قائلا: «إن كان الله معي، ورعاني في هذه الطريق التي أنا أسير فيها ووفر لي طعاما لآكل وثيابا لألبس،"]]}, {"l": "Gen 48:15", "n": "", "vs": [[15, "وبارك يوسف قائلا: «إن الله الذي سلك أمامه أبواي إبراهيم وإسحق، الله الذي رعاني منذ وجودي إلى هذا اليوم،"]]}, {"l": "Deu 2:7", "n": "", "vs": [[7, "لأن الرب إلهكم بارك كل عمل أيديكم، واعتنى بكم في أثناء رحلتكم في هذه الصحراء الشاسعة، وكان معكم طوال أربعين سنة، فلم يعوزكم شيء"]]}, {"l": "Deu 8:3", "n": "", "vs": [[3, "فأذلكم ثم أجاعكم وأطعمكم المن الذي لم تكونوا تعرفونه، لا أنتم ولا آباؤكم ليعلمكم أنه ليس بالخبز وحده يحيا الإنسان، بل بكل كلمة ينطق بها فم الرب."]]}, {"l": "Deu 8:4", "n": "", "vs": [[4, "وفي غضون الأربعين سنة لم تبل ثيابكم عليكم، ولم تتورم أقدامكم."]]}, {"l": "Pro 27:23-27", "n": "", "vs": [[23, "اجتهد في معرفة أحوال غنمك، واحرص كل الحرص على قطعانك."], [24, "لأن الغنى لا يدوم إلى الأبد، ولا يخلد التاج مدى الدهور."], [25, "عندما يضمحل العشب، وينمو الحشيش الجديد ويجمع كلأ الجبال،"], [26, "فإن الحملان توفر لك كساءك، وتكون الجداء ثمنا لحقلك."], [27, "ويكون لك من لبن الماعز قوت يكفيك، وطعام لأهل بيتك وغذاء لجواريك."]]}, {"l": "Pro 30:8", "n": "", "vs": [[8, "أبعد عني الباطل وكلام الزور، ولا تجعل الفقر أو الغنى من نصيبي. لكن أعطني كفافي من الطعام،"]]}, {"l": "Pro 30:9", "n": "", "vs": [[9, "لئلا أشبع فأجحدك قائلا: من هو الرب؟ أو أفتقر فأسرق وألطخ اسم إلهي بالعار."]]}, {"l": "Ecc 2:24-26", "n": "", "vs": [[24, "فليس أفضل للإنسان من أن يأكل ويشرب ويتمتع بتعب يديه. وهذا أيضا، كما أرى، هو من يد الله."], [25, "إذ بمعزل عنه من يستطيع أن يأكل ويستمتع؟"], [26, "لأن المرء الذي يحظى برضى الله ينعم الله عليه بالحكمة والمعرفة والفرح. أما الخاطيء فيفرض عليه عناء الجمع والادخار، ليكون ذلك من نصيب من يرضي الله . وهذا أيضا باطل كملاحقة الريح."]]}, {"l": "Ecc 3:12", "n": "", "vs": [[12, "فأيقنت أنه ليس أفضل لهم من أن يفرحوا ويمتعوا أنفسهم وهم مازالوا على قيد الحياة."]]}, {"l": "Ecc 3:13", "n": "", "vs": [[13, "إن من نعم الله على الإنسان أن يأكل ويشرب ويستمتع بما يجنيه من كده."]]}, {"l": "Mat 6:11", "n": "", "vs": [[11, "خبزنا كفافنا أعطنا اليوم!"]]}, {"l": "Mat 6:25-33", "n": "", "vs": [[25, "لذلك أقول لكم: لا تهتموا لمعيشتكم بشأن ما تأكلون وما تشربون، ولا لأجسادكم بشأن ما تكتسون. أليست الحياة أكثر من مجرد طعام، والجسد أكثر من مجرد كساء؟"], [26, "تأملوا طيور السماء: إنها لا تزرع ولا تحصد ولا تجمع في مخازن، وأبوكم السماوي يعولها. أفلستم أنتم أفضل منها كثيرا؟"], [27, "فمن منكم إذا حمل الهموم يقدر أن يطيل عمره ولو ساعة واحدة؟"], [28, "ولماذا تحملون هم الكساء؟ تأملوا زنابق الحقل كيف تنمو: إنها لا تتعب ولا تغزل؛"], [29, "ولكني أقول لكم: حتى سليمان في قمة مجده لم يكتس ما يعادل واحدة منها بهاء!"], [30, "فإن كان الله هكذا يكسو الأعشاب البرية مع أنها توجد اليوم وتطرح غدا في النار، أفلستم أنتم، ياقليلي الإيمان، أحرى جدا بأن يكسوكم؟"], [31, "فلا تحملوا الهم قائلين: ما عسانا نأكل؟ أو: ما عسانا نشرب؟ أو: ما عسانا نكتسي؟"], [32, "فهذه الحاجات كلها تسعى إليها الأمم. فإن أباكم السماوي يعلم حاجتكم إلى هذه كلها."], [33, "أما أنتم، فاطلبوا أولا ملكوت الله وبره، وهذه كلها تزاد لكم."]]}, {"l": "Heb 13:5", "n": "", "vs": [[5, "اجعلوا سيرتكم مترفعة عن حب المال، واقنعوا بما عندكم، لأن الله يقول: «لا أتركك، ولا أتخلى عنك أبدا!»"]]}, {"l": "Heb 13:6", "n": "", "vs": [[6, "فنستطيع إذن، أن نقول بكل ثقة وجرأة: «الرب معيني، فلن أخاف! ماذا يصنع بي الإنسان؟»"]]}], "kwAr": "", "noteAr": ""}], "arS": [["إنما، مادام لنا ", []], ["قوت", ["G1305"]], [" ", []], ["ولباس", ["G4629"]], ["، فلنكن ", []], ["قانعين", ["G714"]], [" بهما.", []]]}, {"c": 6, "v": 9, "text": "أما الذين يرغبون في أن يصيروا أغنياء، فيسقطون في التجربة والفخ ويتورطون في كثير من الشهوات السفيهة المضرة التي تغرق الناس في الدمار والهلاك.", "groups": [{"kw": "they", "raw": "Gen_13:10-13; Num_22:17-19; Jos_7:11; 2Ki_5:20-27; Pro_15:27, Pro_20:21; Pro_21:6, Pro_22:16, Pro_28:20-22; Isa_5:8; Hos_12:7, Hos_12:8; Amo_8:4-6; Zec_11:5; Mat_13:22, Mat_19:22, Mat_26:15; Jam_5:1-4; 2Pe_2:15, 2Pe_2:16; Jud_1:11", "note": "", "refs": [{"l": "Gen 13:10-13", "n": "", "vs": [[10, "وتلفت لوط حوله فشاهد السهول المحيطة بنهر الأردن وإذا بها ريانة كلها، قبلما دمر الرب سدوم وعمورة، وكأنها جنة الرب كأرض مصر الممتدة إلى صوغر."], [11, "فاختار لوط لنفسه حوض الأردن كله وارتحل شرقا. وهكذا اعتزل أحدهما عن الآخر."], [12, "وسكن أبرام في أرض كنعان، وأقام لوط في مدن السهل حيث نصب خيامه بجوار سدوم."], [13, "وكان أهل سدوم متورطين في الشر وخاطئين جدا لدى الرب."]]}, {"l": "Num 22:17-19", "n": "", "vs": [[17, "لا تتقاعس عن المجيء إلي، لأنني سأبالغ في إكرامك، وكل ما تطلبه أفعله، فتعال الآن والعن هذا الشعب»."], [18, "فأجاب بلعام رسل بالاق: «لا يمكنني أن أعصى أمر الرب إلهي في أي عمل صغير أو كبير، ولو أغدق علي بالاق ملء قصره فضة وذهبا."], [19, "فالآن، اقضوا هنا ليلتكم لأعلم بماذا يعود الرب فيوصيني به»."]]}, {"l": "Jos 7:11", "n": "", "vs": [[11, "لقد ارتكب إسرائيل خطيئة، بل تعدوا على عهدي الذي أمرتهم به، بل أخذوا مما حرمته عليهم وسرقوا وأنكروا، بل خبأوا في أمتعتهم."]]}, {"l": "2Ki 5:20-27", "n": "", "vs": [[20, "حتى حدث جيحزي خادم أليشع نفسه: «سيدي امتنع عن قبول ما أحضره نعمان من هدايا. حي هو الرب لأسرعن وراءه وآخذ منه شيئا»."], [21, "فلحق جيحزي بنعمان. ولما أبصره نعمان راكضا نحوه، ترجل عن المركبة للقائه سائلا: «أللخير جئت؟»"], [22, "فأجاب: «للخير. إن سيدي قد أرسلني قائلا: إن رجلين من جبل أفرايم من بني الأنبياء جاءاه، فأرجوك أن تعطيهما وزنة من الفضة وحلتي ثياب»."], [23, "فقال نعمان: «أرجوك أن تأخذ وزنتين» وألح عليه، وصرهما في كيسين وحلتي ثياب، وأعطاهما لرجلين من رجاله، فحملاهما وانطلقا أمام جيحزي."], [24, "وعندما وصل إلى الأكمة حيث يقيم أليشع أخذها منهما وأخفاها في البيت، وصرف الرجلين."], [25, "ثم دخل إلى أليشع، فسأله: «من أين جئت ياجيحزي؟» فأجاب: «لم يذهب عبدك إلى أي مكان»."], [26, "فقال له: «ألا تعرف أن قلبي كان حاضرا هناك حين ترجل الرجل من مركبته للقائك؟ أهذا وقت الحصول على فضة أو أخذ ثياب وزيتون وكروم وغنم وبقر وعبيد وجوار؟"], [27, "فليحل برص نعمان بك وبنسلك إلى الأبد». فخرج من أمامه وجلده أبرص في لون الثلج."]]}, {"l": "Pro 15:27", "n": "", "vs": [[27, "الحريص على الكسب يجلب المتاعب لبيته، ومن يكره الرشوة يحيا."]]}, {"l": "Pro 20:21", "n": "", "vs": [[21, "رب ملك يورث على عجل في بدايته، يفتقر إلى البركة في نهايته."]]}, {"l": "Pro 21:6", "n": "", "vs": [[6, "ادخار الكنوز بلسان منافق، دخان متلاش وفخ مميت."]]}, {"l": "Pro 22:16", "n": "", "vs": [[16, "من يجور على الفقير ليثرى ظلما، ومن يهدي الغني (على حساب الفقير) يؤول به الأمر إلى الفاقة."]]}, {"l": "Pro 28:20-22", "n": "", "vs": [[20, "الرجل الأمين يحظى ببركات غزيرة، والمتعجل إلى الثراء لا يكون بريئا."], [21, "المحاباة نقيصة، ومن أجل كسرة خبز يرتكب الإنسان الإساءة."], [22, "ذو العين الشريرة يسعى مسرعا وراء الغنى، ولا يدرك أن الفقر مطبق عليه."]]}, {"l": "Isa 5:8", "n": "", "vs": [[8, "اشتريتم البيوت والحقول حتى لم يبق لأحد غيركم مكان يسكن فيه! صارت الأرض لكم وحدكم!"]]}, {"l": "Hos 12:7", "n": "", "vs": [[7, "إن أفرايم مثل التاجر الكنعاني يحمل بيده ميزانا مغشوشا لأنه يحب الجور."]]}, {"l": "Hos 12:8", "n": "", "vs": [[8, "ويقول: «قد أصبحت غنيا، وضمنت لنفسي ثروة، ولا يمكن لأحد إن يجد في كل ما اكتسبته من غنى مالا حراما أثيما»."]]}, {"l": "Amo 8:4-6", "n": "", "vs": [[4, "استمعوا هذا أيها الدائسون على البائسين، يامن حاولتم أن تقضوا على فقراء الأرض،"], [5, "قائلين: «متى ينقضي أول الشهر حتى نبيع الحنطة؟ متى يمضي السبت لنعرض القمح في السوق، فنعمد إلى تصغير حجم مكيال الإيفة ونرفع الأسعار، ونستعمل ميزانا مغشوشا."], [6, "لنشتري المسكين بقطعة من الفضة، والبائس بنعلين، ونبيع نفاية القمح؟»"]]}, {"l": "Zec 11:5", "n": "", "vs": [[5, "الذين يقتلهم مالكوهم ويفلتون من العقاب، وكل من يبيعهم يقول: تبارك الرب فإني قد أثريت. أما رعاتهم فلا يضمرون لهم شفقة»."]]}, {"l": "Mat 13:22", "n": "", "vs": [[22, "أما المزروع بين الأشواك، فهو الذي يسمع الكلمة، ولكن هم الزمان الحاضر وخداع الغنى يخنقان الكلمة، فلا يعطي ثمرا."]]}, {"l": "Mat 19:22", "n": "", "vs": [[22, "فلما سمع الشاب هذا الكلام، مضى حزينا لأنه كان صاحب ثروة كبيرة."]]}, {"l": "Mat 26:15", "n": "", "vs": [[15, "وقال: «كم تعطونني لأسلمه إليكم؟» فوزنوا له ثلاثين قطعة من الفضة."]]}, {"l": "Jam 5:1-4", "n": "", "vs": [[1, "أيها الأغنياء، هيا الآن ابكوا مولولين بسبب ما ينتظركم من أهوال وشقاء."], [2, "إن ثرواتكم الكثيرة قد فسدت، وثيابكم الفاخرة قد أكلها العث"], [3, "ذهبكم وفضتكم قد تآكلا، وسيكون تآكلهما شاهدا ضدكم، ويأكل لحمكم كنار جمعتموها ثروة للأيام الأخيرة؟"], [4, "وهذه أجرة العمال الذين حصدوا حقولكم، تلك الأجرة التي مازلتم تحبسونها عنهم ظلما، إنها تصرخ، وصراخ أولئك العمال أنفسهم قد سمعه رب الجنود!"]]}, {"l": "2Pe 2:15", "n": "", "vs": [[15, "وإذ خرجوا عن الطريق المستقيم، ضلوا. فهم سائرون في طريق بلعام بن بعور، الذي أحب الحصول على المال أجرة لإثمه."]]}, {"l": "2Pe 2:16", "n": "", "vs": [[16, "ولكنه توبخ على هذه المخالفة التي ارتكبها. إذ إن الحمار الأبكم نطق بصوت بشري، فوضع حدا لحماقة ذلك النبي!"]]}, {"l": "Jud 1:11", "n": "", "vs": [[11, "الويل لهم! لأنهم سلكوا طريق قايين، واندفعوا إلى ارتكاب خطيئة بلعام طلبا للمال، وتمردوا كما تمرد قورح، فدمروا أنفسهم."]]}], "kwAr": "الذين يرغبون في أن يصيروا أغنياء", "noteAr": ""}, {"kw": "snare", "raw": "1Ti_3:7; Deu_7:25; Psa_11:6; Pro_1:17-19; Luk_21:35; 2Ti_2:26", "note": "", "refs": [{"l": "1Ti 3:7", "n": "", "vs": [[7, "ومن الضروري أن تكون له شهادة حسنة من الذين في خارج الكنيسة، لكي لا يقع في العار وفي فخ إبليس."]]}, {"l": "Deu 7:25", "n": "", "vs": [[25, "أحرقوا تماثيل آلهتهم ولا تشتهوا ما عليها من فضة وذهب فتغنموها لأنفسكم، لئلا تقتنصكم، لأنها رجس عند الرب إلهكم."]]}, {"l": "Psa 11:6", "n": "", "vs": [[6, "يمطر على الأشرار جمرا وكبريتا وتكون الريح المحرقة نصيبهم."]]}, {"l": "Pro 1:17-19", "n": "", "vs": [[17, "فإنه عبثا تنصب الشبكة على مرأى الطير."], [18, "إنما هم يتربصون لسفك دم أنفسهم، ويكمنون لإهدار حياتهم."], [19, "هذا هو مصير كل من يثرى ظلما، فإن الثراء الحرام يذهب بحياة قانيه."]]}, {"l": "Luk 21:35", "n": "", "vs": [[35, "فإنه سوف يطبق كالفخ على جميع الساكنين على وجه الأرض كلها."]]}, {"l": "2Ti 2:26", "n": "", "vs": [[26, "فيعودوا إلى الصواب ناجين من فخ إبليس الذي أطبق عليهم، ليعملوا إرادته."]]}], "kwAr": "والفخ", "noteAr": ""}, {"kw": "many", "raw": "Mar_4:19; Eph_4:22; 1Jo_2:15-17", "note": "", "refs": [{"l": "Mar 4:19", "n": "", "vs": [[19, "ولكن هموم الزمان الحاضر وخداع الغنى واشتهاء الأمور الأخرى، تدخل إليهم وتخنق الكلمة، فتصير بلا ثمر."]]}, {"l": "Eph 4:22", "n": "", "vs": [[22, "وهو أن تخلعوا ما يتعلق بسيرتكم الماضية: الإنسان العتيق الذي يفسد نفسه بالشهوات الخداعة؛"]]}, {"l": "1Jo 2:15-17", "n": "", "vs": [[15, "لا تحبوا العالم، ولا الأشياء التي في العالم. فالذي يحب العالم، لا تكون محبة الآب في قلبه."], [16, "لأن كل ما في العالم، من شهوات الجسد وشهوات العين وترف المعيشة، ليس من الآب، بل من العالم."], [17, "وسوف يزول العالم، وما فيه من شهوات أما الذي يعمل بإرادة الله، فيبقى إلى الأبد!"]]}], "kwAr": "كثير من الشهوات", "noteAr": ""}, {"kw": "which", "raw": "1Ti_1:9; Num_31:8; Jos_7:24-26; Mat_27:3-5; Act_5:4, Act_5:5, Act_8:20; 2Pe_2:3", "note": "", "refs": [{"l": "1Ti 1:9", "n": "", "vs": [[9, "إذ ندرك أن الشريعة لا تطبق على من كان بارا، بل على الأشرار والمتمردين، على الفاجرين والخاطئين، والنجسين والدنسين، وقاتلي آبائهم وأمهاتهم، وقاتلي الناس،"]]}, {"l": "Num 31:8", "n": "", "vs": [[8, "وقتلوا معهم ملوكهم الخمسة: أوي وراقم وصور وحور ورابع، كما قتلوا بلعام بن بعور بحد السيف."]]}, {"l": "Jos 7:24-26", "n": "", "vs": [[24, "فأخذ يشوع وجميع بني إسرائيل عخان بن زارح والفضة والرداء وسبيكة الذهب، وأبناءه وبناته وبقره وحميره وغنمه وخيمته وكل ماله، وذهبوا بهم إلى وادي عخور."], [25, "وقال يشوع: «لماذا جلبت علينا هذه الكارثة؟ لتحل بك اليوم الفواجع». فرجمه جميع إسرائيل بالحجارة مع أهل بيته وأحرقوهم بالنار،"], [26, "وأقاموا فوقه كومة كبيرة من الحجارة، ما برحت باقية إلى هذا اليوم. فهدأ غضب الرب ولذلك دعي اسم ذلك الموضع وادي عخور ومعناه: (وادي الإزعاج) إلى هذا اليوم."]]}, {"l": "Mat 27:3-5", "n": "", "vs": [[3, "فلما رأى يهوذا مسلمه أن الحكم عليه قد صدر، ندم ورد الثلاثين قطعة من الفضة إلى رؤساء الكهنة والشيوخ،"], [4, "وقال: «قد أخطأت إذ سلمتكم دما بريئا». فأجابوه: «ليس هذا شأننا نحن، بل هو شأنك أنت!»"], [5, "فألقى قطع الفضة في الهيكل وانصرف، ثم ذهب وشنق نفسه."]]}, {"l": "Act 5:4", "n": "", "vs": [[4, "أما كان بقي لك لو لم تبعه؟ وبعد بيعه أما كان لك حق الاحتفاظ بثمنه؟ لماذا قصدت في قلبك أن تغش؟ إنك لم تكذب على الناس، بل على الله!»"]]}, {"l": "Act 5:5", "n": "", "vs": [[5, "فما إن سمع حنانيا هذا الكلام حتى سقط أرضا ومات! فاستولت الرهبة الشديدة على جميع الذين عرفوا ذلك."]]}, {"l": "Act 8:20", "n": "", "vs": [[20, "فقال له بطرس: «لتبق لك فضتك لهلاكك! لأنك ظننت أنك تقدر أن تشتري هبة الله بالمال!"]]}, {"l": "2Pe 2:3", "n": "", "vs": [[3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}], "kwAr": "التي تغرق الناس", "noteAr": ""}], "arS": [["أما الذين ", []], ["يرغبون", ["G1014"]], [" في أن يصيروا ", []], ["أغنياء", ["G4147"]], ["، ", []], ["فيسقطون", ["G1706"]], [" في ", []], ["التجربة", ["G3986"]], [" ", []], ["والفخ", ["G3803"]], [" ويتورطون في ", []], ["كثير", ["G4183"]], [" من ", []], ["الشهوات", ["G1939"]], [" ", []], ["السفيهة", ["G453"]], [" ", []], ["المضرة", ["G983"]], [" التي ", []], ["تغرق", ["G1036"]], [" ", []], ["الناس", ["G444"]], [" في ", []], ["الدمار", ["G3639"]], [" ", []], ["والهلاك", ["G684"]], [".", []]]}, {"c": 6, "v": 10, "text": "فإن حب المال أصل لكل شر؛ وإذ سعى بعضهم إليه، ضلوا عن الإيمان، وطعنوا أنفسهم بأوجاع كثيرة.", "groups": [{"kw": "the love", "raw": "Gen_34:23, Gen_34:24, Gen_38:16; Exo_23:7, Exo_23:8; Deu_16:19, Deu_23:4, Deu_23:5, Deu_23:18; Jdg_17:10,Jdg_17:11; Jdg_18:19, Jdg_18:20,Jdg_18:29-31; 2Sa_4:10,2Sa_4:11; Pro_1:19; Isa_1:23, Isa_56:11; Jer_5:27; Jer_5:28; Eze_13:19, Eze_16:33, Eze_22:12; Mic_3:11, Mic_7:3, Mic_7:4; Mal_1:10; Mat_23:14; Act_1:16-19; Tit_1:11; Rev_18:13", "note": "", "refs": [{"l": "Gen 34:23", "n": "", "vs": [[23, "عند ذلك تصبح ماشيتهم ومقتنياتهم وكل بهائمهم ملكا لنا. فلنوافقهم على ذلك فيقيموا معنا»."]]}, {"l": "Gen 34:24", "n": "", "vs": [[24, "فوافق جميع الحاضرين في مجلس المدينة على كلام حمور وابنه شكيم، فاختتن كل ذكر في المدينة."]]}, {"l": "Gen 38:16", "n": "", "vs": [[16, "فمال نحوها إلى جانب الطريق وقال: «دعيني أعاشرك». ولم يكن يدري أنها كنته. فقالت: «ماذا تعطيني لكي تعاشرني؟»"]]}, {"l": "Exo 23:7", "n": "", "vs": [[7, "اجتنب الاتهام الكاذب ولا تقتل البريء والصالح، لأنني لا أبرىء المذنب."]]}, {"l": "Exo 23:8", "n": "", "vs": [[8, "لا تقبل رشوة لأن الرشوة تعمي المبصرين وتحرف أقوال الصالحين."]]}, {"l": "Deu 16:19", "n": "", "vs": [[19, "لا تعوجوا القضاء ولا تحابوا، ولا تقبلوا رشوة، لأن الرشوة تعمي أبصار الحكماء، وتعوج أقوال الصديقين."]]}, {"l": "Deu 23:4", "n": "", "vs": [[4, "لأنهم لم يستقبلوكم بالخبز والماء في الطريق عند خروجكم من مصر، ولأنهم استأجروا بلعام بن بعور من فتور أرام النهرين ليلعنكم"]]}, {"l": "Deu 23:5", "n": "", "vs": [[5, "ولكن الرب إلهكم لم يشأ أن يستجيب لبلعام، بل حول لأجلكم اللعنة إلى بركة، لأن الرب إلهكم قد أحبكم."]]}, {"l": "Deu 23:18", "n": "", "vs": [[18, "لا تأتوا بتقدمة نذر ما إلى بيت الرب إلهكم من مكسب زانية أو مأبون، لأن كليهما رجس أمام الرب."]]}, {"l": "Jdg 17:10", "n": "", "vs": [[10, "فقال له ميخا: «أقم عندي وكن لي مرشدا وكاهنا، وأنا أعطيك عشرة شواقل فضة (نحو مئة وعشرين جراما) في السنة وحلة ثياب فضلا عن القوت». فوافق اللاوي على عرضه،"]]}, {"l": "Jdg 17:11", "n": "", "vs": [[11, "ورضي بالإقامة معه. وصار اللاوي أثيرا لديه كأحد أبنائه."]]}, {"l": "Jdg 18:19", "n": "", "vs": [[19, "فقالوا له: «اصمت. لا تنطق بكلمة. تعال معنا وكن لنا مرشدا وكاهنا. أيهما خير لك: أن تكون كاهنا لبيت رجل واحد، أم تكون كاهنا لسبط وعشيرة في إسرائيل؟»"]]}, {"l": "Jdg 18:20", "n": "", "vs": [[20, "فاغتبط قلب الكاهن للأمر، وأخذ الأفود والترافيم والتمثال المنحوت وانضم إلى القوم."]]}, {"l": "Jdg 18:29-31", "n": "", "vs": [[29, "ودعوها دان باسم دان أبيهم الذي أنجبه إسرائيل، أما اسمها القديم فكان لايش."], [30, "ونصب أبناء دان لأنفسهم التمثال المنحوت، وظل يهوناثان ابن جرشوم بن منسى وبنوه من بعده كهنة لسبط الدانيين إلى يوم سبي البلاد."], [31, "ونصبوا تمثال ميخا المنحوت الذي صنعه، طوال الحقبة التي كان فيها بيت الله في شيلوه."]]}, {"l": "2Sa 4:10", "n": "", "vs": [[10, "إن كنت قد قبضت على من خبرني أن شاول قد مات، وقتلته في صقلغ، وقد ظن في نفسه أنه يحمل لي بشارة سارة، فكان موته جزاء بشارته،"]]}, {"l": "2Sa 4:11", "n": "", "vs": [[11, "فماذا أفعل بالأحرى برجلين باغيين يقتلان رجلا بريئا في بيته وعلى سريره؟ ألا أطالب الآن بدمه من أيديكما وأستأصلكما من الأرض؟»"]]}, {"l": "Pro 1:19", "n": "", "vs": [[19, "هذا هو مصير كل من يثرى ظلما، فإن الثراء الحرام يذهب بحياة قانيه."]]}, {"l": "Isa 1:23", "n": "", "vs": [[23, "أصبح رؤساؤك عصاة وشركاء لصوص، يولعون بالرشوة ويسعون وراء الهبات، لا يدافعون عن اليتيم، ولا ترفع إليهم دعوى الأرملة»."]]}, {"l": "Isa 56:11", "n": "", "vs": [[11, "هم كلاب نهمة لا تعرف الشبع، ورعاة أيضا مجردون من الفهم، كل مال إلى طريقه طمعا في الربح،"]]}, {"l": "Jer 5:27", "n": "", "vs": [[27, "بيوتهم تكتظ بالخديعة كقفص مملوء طيورا، لذلك عظموا وأثروا."]]}, {"l": "Jer 5:28", "n": "", "vs": [[28, "ازدادوا سمنا ونعومة، وارتكبوا الشر متجاوزين كل حد. لم يحكموا بعدل في دعوى اليتيم حتى تنجح، ولم يدافعوا عن حقوق المساكين."]]}, {"l": "Eze 13:19", "n": "", "vs": [[19, "فتدنسنني عند شعبي لقاء حفنة شعير وفتات خبز حتى تمتن نفوسا ما كان يجب أن تموت، ولكي تستحيين نفوسا أخرى لم يكن لها أن تحيا من جراء كذبكن على شعبي السامع للكذب."]]}, {"l": "Eze 16:33", "n": "", "vs": [[33, "كل الزانيات ينلن هدايا من الرجال، أما أنت فأعطيت هداياك لمحبيك، ورشوتهم كي يقبلوا إليك من كل صوب ليزنوا معك."]]}, {"l": "Eze 22:12", "n": "", "vs": [[12, "فيك أخذوا الرشوة لقاء سفك الدماء. أخذت الربا ومال الحرام، وسلبت أقرباءك ظلما ونسيتني، يقول السيد الرب."]]}, {"l": "Mic 3:11", "n": "", "vs": [[11, "إذ يحكم رؤساؤها بالرشوة، وكهنتها يعلمون بالأجرة ويتعاطى أنبياؤها العرافة لقاء المال، ومع ذلك يدعون الاتكال على الله قائلين: «أليس الرب في وسطنا؟ لذلك لن يصيبنا مكروه»."]]}, {"l": "Mic 7:3", "n": "", "vs": [[3, "تجد أيديهم في ارتكاب الشر، ويسعى الرئيس والقاضي وراء الرشوة، ويملي العظيم عليهم أهواء نفسه، فيتآمرون جميعا على الحق."]]}, {"l": "Mic 7:4", "n": "", "vs": [[4, "أفضلهم مثل العوسج، وأكثرهم استقامة أسوأ من سياج الشوك. وها يوم عقابكم الذي أنذر به أنبياؤكم قد وافى. عندئذ يعتريكم الارتباك."]]}, {"l": "Mal 1:10", "n": "", "vs": [[10, "آه، ياليت بينكم من يغلق أبواب الهيكل لئلا توقدوا نارا باطلة على مذبحي، يقول الرب القدير: إذ لا مسرة لي بكم ولا أرضى بتقدمة من أيديكم."]]}, {"l": "Mat 23:14", "n": "", "vs": [[14, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تلتهمون بيوت الأرامل وتتذرعون بإطالة صلواتكم. لذلك ستنزل بكم دينونة أقسى!"]]}, {"l": "Act 1:16-19", "n": "", "vs": [[16, "«أيها الإخوة، كان لابد من أن تتم النبوءة التي قالها الروح القدس بلسان النبي داود، عن يهوذا الذي انقلب دليلا للذين قبضوا على يسوع."], [17, "وكان يهوذا يعتبر واحدا منا، وقد شاركنا في خدمتنا."], [18, "ثم إنه اشترى حقلا بالمال الذي تقاضاه ثمنا للخيانة، وفيه وقع على وجهه، فانشق من وسطه واندلقت أمعاؤه كلها."], [19, "وعلم أهل أورشليم جميعا بهذه الحادثة، فأطلقوا على حقله اسم ¢حقل دمخ¢ بلغتهم، أي حقل الدم."]]}, {"l": "Tit 1:11", "n": "", "vs": [[11, "هؤلاء يجب أن تسد أفواههم: فهم يخربون بيوتا بجملتها، إذ يعلمون تعاليم يجب ألا تعلم، في سبيل مكسب خسيس."]]}, {"l": "Rev 18:13", "n": "", "vs": [[13, "والقرفة والبهار، والعطور والطيب والبخور، والخمر والزيت والدقيق والحبوب، والبهائم والغنم، والخيل والمركبات، والأجساد والنفوس البشرية"]]}], "kwAr": "حب المال", "noteAr": ""}, {"kw": "coveted", "raw": "1Ti_6:21; 2Ti_4:10; Jud_1:11; Rev_2:14, Rev_2:15", "note": "", "refs": [{"l": "1Ti 6:21", "n": "", "vs": [[21, "وإذ ادعى بعضهم هذه المعرفة المزعومة، زاغوا عن الإيمان. لتكن النعمة معك!"]]}, {"l": "2Ti 4:10", "n": "", "vs": [[10, "لأن ديماس، إذ أحب الحياة الحاضرة، تركني وذهب إلى مدينة تسالونيكي. أما كريسكيس، فقد ذهب إلى مقاطعة غلاطية، وتيطس إلى دلماطية"]]}, {"l": "Jud 1:11", "n": "", "vs": [[11, "الويل لهم! لأنهم سلكوا طريق قايين، واندفعوا إلى ارتكاب خطيئة بلعام طلبا للمال، وتمردوا كما تمرد قورح، فدمروا أنفسهم."]]}, {"l": "Rev 2:14", "n": "", "vs": [[14, "ولكني عاتب عليك قليلا لأنك تتسامح مع القوم الذين يتمسكون بتعليم بلعام عندما علم الملك بالاق أن يدمر بني إسرائيل بتوريطهم في ارتكاب الزنى والأكل من الذبائح المقدمة للأصنام،"]]}, {"l": "Rev 2:15", "n": "", "vs": [[15, "هكذا عندك أنت أيضا قوم يتمسكون بتعاليم النيقولاويين!"]]}], "kwAr": "وإذ سعى بعضهم إليه", "noteAr": ""}, {"kw": "erred", "raw": "or, been seduced", "note": "or, been seduced", "refs": [], "kwAr": "ضلوا عن الإيمان", "noteAr": "أو: انخدعوا (ضُلِّلوا)."}, {"kw": "and pierced", "raw": "Gen_29:14, Gen_29:26, Gen_29:31-35; 2Ki_5:27; Psa_32:10; Pro_1:31; 2Pe_2:7, 2Pe_2:8", "note": "", "refs": [{"l": "Gen 29:14", "n": "", "vs": [[14, "فقال له لابان: «حقا إنك عظمي ولحمي». وأقام عنده نحو شهر من الزمان."]]}, {"l": "Gen 29:26", "n": "", "vs": [[26, "فأجابه لابان: «ليس من عادة بلادنا أن نزوج الصغيرة قبل البكر."]]}, {"l": "Gen 29:31-35", "n": "", "vs": [[31, "وعندما رأى الرب أن ليئة مكروهة جعلها منجبة، أما راحيل فكانت عاقرا."], [32, "فحملت ليئة وأنجبت ابنا دعته رأوبين (ومعناه: هوذا ابن) لأنها قالت: «حقا قد نظر الرب إلى مذلتي، فالآن يحبني زوجي»."], [33, "وحملت مرة أخرى وأنجبت ابنا، فقالت: «لأن الرب سمع أنني كنت مكروهة رزقني هذا الابن أيضا». فدعته شمعون (ومعناه: سميع)"], [34, "ثم حملت مرة ثالثة وأنجبت ابنا فقالت: «الآن في هذه المرة يتحد بي زوجي، لأنني أنجبت له ثلاثة بنين». لذلك دعي اسمه لاوي (ومعناه: متحد)"], [35, "وحبلت مرة رابعة وأنجبت ابنا فقالت: «في هذه المرة أحمد الرب». لذلك دعته يهوذا (ومعناه: حمد). ثم توقفت عن الولادة."]]}, {"l": "2Ki 5:27", "n": "", "vs": [[27, "فليحل برص نعمان بك وبنسلك إلى الأبد». فخرج من أمامه وجلده أبرص في لون الثلج."]]}, {"l": "Psa 32:10", "n": "", "vs": [[10, "كثير ة هي أوجاع الأشرار. أما الواثق بالرب فالرحمة تحيط به."]]}, {"l": "Pro 1:31", "n": "", "vs": [[31, "لذلك يأكلون ثمار أعمالهم المرة، ويشبعون من عواقب مؤامراتهم"]]}, {"l": "2Pe 2:7", "n": "", "vs": [[7, "ولكنه أنقذ لوطا البار، الذي كان متضايقا جدا من سلوك أشرار زمانه في الدعارة."]]}, {"l": "2Pe 2:8", "n": "", "vs": [[8, "فإذ كان ساكنا بينهم، وهو رجل بار، كانت نفسه الزكية تتألم يوميا من جرائمهم التي كان يراها أو يسمع بها."]]}], "kwAr": "وطعنوا أنفسهم", "noteAr": ""}], "arS": [["فإن ", []], ["حب المال", ["G5365"]], [" ", []], ["أصل", ["G4491"]], [" ", []], ["لكل", ["G3956"]], [" ", []], ["شر", ["G2556"]], ["؛ وإذ ", []], ["سعى", ["G3713"]], [" ", []], ["بعضهم", ["G5100"]], [" إليه، ", []], ["ضلوا", ["G635"]], [" عن ", []], ["الإيمان", ["G4102"]], ["، ", []], ["وطعنوا", ["G4044"]], [" ", []], ["أنفسهم", ["G1438"]], [" ", []], ["بأوجاع", ["G3601"]], [" ", []], ["كثيرة", ["G4183"]], [".", []]]}, {"c": 6, "v": 11, "text": "وأما أنت، ياإنسان الله، فاهرب من هذه الأمور، واسع في إثر البر والتقوى والإيمان والمحبة والصبر والوداعة.", "groups": [{"kw": "But", "raw": "2Ti_2:22", "note": "", "refs": [{"l": "2Ti 2:22", "n": "", "vs": [[22, "إنما اهرب من الشهوات الشبابية، واسع وراء البر والإيمان والمحبة والسلام، مشاركا الذين يدعون الرب من قلب نقي."]]}], "kwAr": "وأما أنت", "noteAr": ""}, {"kw": "O man", "raw": "1Ti_6:20; Deu_33:1; 1Sa_2:27, 1Sa_9:6; 1Ki_13:1, 1Ki_13:26, 1Ki_17:18, 1Ki_17:24, 1Ki_20:28; 2Ki_1:9, 2Ki_1:13; 2Ki_5:20, 2Ki_23:17; 1Ch_23:14; 2Ch_8:14; Neh_12:24, Neh_12:36; Jer_35:4; 2Ti_3:17", "note": "", "refs": [{"l": "1Ti 6:20", "n": "", "vs": [[20, "ياتيموثاوس، حافظ على الأمانة المودعة لديك. تجنب الكلام الدنس الباطل، ومناقضات ما يسمى زورا «معرفة»."]]}, {"l": "Deu 33:1", "n": "", "vs": [[1, "وهذه هي البركة التي بارك بها موسى، رجل الله، بني إسرائيل قبل موته،"]]}, {"l": "1Sa 2:27", "n": "", "vs": [[27, "وذات يوم جاء نبي إلى عالي برسالة من الله، قال: «ألم أتجل لبيت أبيك وهم ما برحوا في مصر في ديار فرعون،"]]}, {"l": "1Sa 9:6", "n": "", "vs": [[6, "فأجابه: «في هذه المدينة يقيم نبي يتمتع بالإكرام، وكل ما ينبيء به يتحقق، فلنذهب إليه لعله يخبرنا عن الطريق التي علينا سلوكها»."]]}, {"l": "1Ki 13:1", "n": "", "vs": [[1, "وبينما كان يربعام واقفا عند المذبح ليوقد عليه، أقبل رجل الله من يهوذا إلى بيت إيل حاملا رسالة من الرب."]]}, {"l": "1Ki 13:26", "n": "", "vs": [[26, "وعندما سمع النبي الشيخ بالنبإ قال: «هو حتما رجل الله الذي خالف أمر الرب، فأوقعه الرب بين مخالب الأسد فافترسه وقتله تحقيقا لقضائه الذي نطق به»."]]}, {"l": "1Ki 17:18", "n": "", "vs": [[18, "فقالت لإيليا: «أي ذنب جنيته بحقك يارجل الله؟ هل جئت إلي لتذكرني بإثمي وتميت ابني؟»"]]}, {"l": "1Ki 17:24", "n": "", "vs": [[24, "فقالت المرأة لإيليا: «الآن علمت أنك رجل الله، وأن الله ينطق على لسانك بالحق»."]]}, {"l": "1Ki 20:28", "n": "", "vs": [[28, "فجاء رجل الله إلى أخآب وقال: «هذا ما يقوله الرب: لأن الأراميين قد ادعوا أن الرب إنما هو إله جبال وليس هو إله أودية، فإنني سأنصرك على كل هذا الجيش الغفير، فتعلمون أني أنا الرب»."]]}, {"l": "2Ki 1:9", "n": "", "vs": [[9, "فأرسل أحد قادته على رأس خمسين جنديا إلى إيليا، الذي كان جالسا آنئذ على قمة جبل. فقال له: «يارجل الله، إن الملك يأمرك بمرافقتنا»."]]}, {"l": "2Ki 1:13", "n": "", "vs": [[13, "ثم أرسل أخزيا للمرة الثالثة قائدا آخر على رأس خمسين جنديا. فأقبل هذا إلى إيليا وجثا أمامه وتوسل إليه قائلا: «يارجل الله، لتكن نفسي ونفوس عبيدك هؤلاء عزيزة في عينيك."]]}, {"l": "2Ki 5:20", "n": "", "vs": [[20, "حتى حدث جيحزي خادم أليشع نفسه: «سيدي امتنع عن قبول ما أحضره نعمان من هدايا. حي هو الرب لأسرعن وراءه وآخذ منه شيئا»."]]}, {"l": "2Ki 23:17", "n": "", "vs": [[17, "وسأل الملك: «ما هذا النصب الذي أراه؟» فأجابه رجال المدينة: «هو قبر رجل الله الذي جاء من يهوذا وأنبأ بكل ما أجريته على بيت إيل»."]]}, {"l": "1Ch 23:14", "n": "", "vs": [[14, "أما أبناء موسى رجل الله فأحصوا مع سبط لاوي."]]}, {"l": "2Ch 8:14", "n": "", "vs": [[14, "ونظم خدمات وواجبات فرق الكهنة واللاويين بمقتضى ما رتبه أبوه داود، فكان اللاويون يقومون بالتسبيح والخدمة تحت إشراف الكهنة، وحراسة الأبواب حسب فرقهم كل يوم بيومه، تنفيذا لأوامر داود رجل الله."]]}, {"l": "Neh 12:24", "n": "", "vs": [[24, "وكان رؤساء اللاويين حشبيا وشربيا ويشوع بن قدميئيل وأقرباؤهم الواقفون مقابلهم يقومون بمراسم الحمد والتسبيح، بموجب أمر داود رجل الله، فكانت نوبة تقف في مواجهة نوبة."]]}, {"l": "Neh 12:36", "n": "", "vs": [[36, "وأقرباؤه شمعيا وعزرئيل ومللاي وجللاي وماعاي ونثنئيل ويهوذا وحناني عازفين على آلات غناء داود رجل الله، يتقدمهم عزرا الكاتب."]]}, {"l": "Jer 35:4", "n": "", "vs": [[4, "ودخلت بهم إلى هيكل الرب إلى مخدع بني حانان بن يجدليا رجل الله القائم إلى جوار مخدع الرؤساء، الذي فوق مخدع معسيا بن شلوم حارس باب الهيكل،"]]}, {"l": "2Ti 3:17", "n": "", "vs": [[17, "لكي يجعل إنسان الله مؤهلا تأهيلا كاملا، ومجهزا لكل عمل صالح."]]}], "kwAr": "ياإنسان الله", "noteAr": ""}, {"kw": "flee", "raw": "1Co_6:18, 1Co_10:14; 2Ti_2:22", "note": "", "refs": [{"l": "1Co 6:18", "n": "", "vs": [[18, "اهربوا من الزنا! فكل خطيئة يرتكبها الإنسان هي خارجة عن جسده، وأما من يرتكب الزنا، فهو يسيء إلى جسده الخاص."]]}, {"l": "1Co 10:14", "n": "", "vs": [[14, "لذلك، ياأحبائي، اهربوا من عبادة الأصنام."]]}, {"l": "2Ti 2:22", "n": "", "vs": [[22, "إنما اهرب من الشهوات الشبابية، واسع وراء البر والإيمان والمحبة والسلام، مشاركا الذين يدعون الرب من قلب نقي."]]}], "kwAr": "فاهرب من هذه الأمور", "noteAr": ""}, {"kw": "and", "raw": "1Ti_5:10; Deu_16:20; Psa_34:14, Psa_38:20; Isa_51:1; Rom_14:19; 1Co_14:1; 2Ti_2:22; Heb_12:14; 1Pe_3:11", "note": "", "refs": [{"l": "1Ti 5:10", "n": "", "vs": [[10, "ويكون مشهودا لها بالأعمال الصالحة، كأن تكون قد ربت الأولاد، وأضافت الغرباء، وغسلت أقدام القديسين، وأسعفت المتضايقين، ومارست كل عمل صالح!"]]}, {"l": "Deu 16:20", "n": "", "vs": [[20, "العدل والعدل وحده أجروا، لتحيوا وتمتلكوا الأرض التي يهبها الرب إلهكم لكم."]]}, {"l": "Psa 34:14", "n": "", "vs": [[14, "ليتحول عن الشر ويفعل الخير. ليطلب السلام ويسع للوصول إليه"]]}, {"l": "Psa 38:20", "n": "", "vs": [[20, "والذين يجازون الخير بالشر يقاومونني لأني أتبع الصلاح."]]}, {"l": "Isa 51:1", "n": "", "vs": [[1, "اسمعوا لي ياملتمسي البر، الساعين وراء الرب: تلفتوا إلى الصخر الذي منه نحتم، وإلى المحجر الذي منه اقتلعتم."]]}, {"l": "Rom 14:19", "n": "", "vs": [[19, "فلنسع إذن وراء ما يؤدي إلى السلام وما يؤدي إلى بنيان بعضنا بعضا."]]}, {"l": "1Co 14:1", "n": "", "vs": [[1, "اسعوا وراء المحبة، وتشوقوا إلى المواهب الروحية، بل بالأحرى موهبة التنبوء."]]}, {"l": "2Ti 2:22", "n": "", "vs": [[22, "إنما اهرب من الشهوات الشبابية، واسع وراء البر والإيمان والمحبة والسلام، مشاركا الذين يدعون الرب من قلب نقي."]]}, {"l": "Heb 12:14", "n": "", "vs": [[14, "اجعلوا هدفكم أن تسالموا جميع الناس، وتعيشوا حياة مقدسة. فبغير قداسة، لا يقدر أحد أن يرى الرب."]]}, {"l": "1Pe 3:11", "n": "", "vs": [[11, "ليتحول عن الشر ويفعل الخير. ليطلب السلام ويسع للوصول إليه."]]}], "kwAr": "واسع في إثر", "noteAr": ""}, {"kw": "righteousness", "raw": "1Ti_4:12; Gal_5:22, Gal_5:23; Phi_4:8, Phi_4:9; Tit_2:11, Tit_2:12; 2Pe_1:5-7", "note": "", "refs": [{"l": "1Ti 4:12", "n": "", "vs": [[12, "لا يستخف أحد بحداثة سنك. وإنما كن قدوة للمؤمنين، في الكلام والسلوك والمحبة والإيمان والطهارة."]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Gal 5:23", "n": "", "vs": [[23, "والوداعة وضبط النفس. وليس من قانون يمنع مثل هذه الفضائل."]]}, {"l": "Phi 4:8", "n": "", "vs": [[8, "وختاما، أيها الإخوة: كل ما كان حقا، وكل ما كان شريفا، وكل ما كان عادلا، وكل ما كان طاهرا وكل ما كان مستحبا، وكل ما كان حسن السمعة، وكل ما كان فيه فضيلة وخصلة حميدة، فاشغلوا أفكاركم به."]]}, {"l": "Phi 4:9", "n": "", "vs": [[9, "واعملوا بها ما تعلمتم وتلقيتم وسمعتم مني وما رأيتم في. وإله السلام يكون معكم."]]}, {"l": "Tit 2:11", "n": "", "vs": [[11, "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت."]]}, {"l": "Tit 2:12", "n": "", "vs": [[12, "وهي تعلمنا أن نقطع علاقتنا بالإباحية والشهوات العالمية، وأن نحيا في العصر الحاضر حياة التعقل والبر والتقوى،"]]}, {"l": "2Pe 1:5-7", "n": "", "vs": [[5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"], [6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"], [7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."]]}], "kwAr": "البر", "noteAr": ""}], "arS": [["وأما ", []], ["أنت", ["G4771"]], ["، ", []], ["ياإنسان", ["G5599", "G444"]], [" ", []], ["الله", ["G2316"]], ["، ", []], ["فاهرب", ["G5343"]], [" من هذه ", []], ["الأمور", ["G5023"]], ["، ", []], ["واسع في إثر", ["G1377"]], [" ", []], ["البر", ["G1343"]], [" ", []], ["والتقوى", ["G2150"]], [" ", []], ["والإيمان", ["G4102"]], [" ", []], ["والمحبة", ["G26"]], [" ", []], ["والصبر", ["G5281"]], [" ", []], ["والوداعة", ["G4236"]], [".", []]]}, {"c": 6, "v": 12, "text": "أحسن الجهاد في معركة الإيمان الجميلة. تمسك بالحياة الأبدية، التي إليها قد دعيت، وقد اعترفت الاعتراف الحسن (بالإيمان) أمام شهود كثيرين.", "groups": [{"kw": "Fight", "raw": "1Ti_1:18; Zec_10:5; 1Co_9:25, 1Co_9:26; 2Co_6:7, 2Co_10:3-5; Eph_6:10-18; 1Th_5:8, 1Th_5:9; 2Ti_4:7", "note": "", "refs": [{"l": "1Ti 1:18", "n": "", "vs": [[18, "هذه التوصيات، ياتيموثاوس ولدي، أسلمها لك، بمقتضى النبوآت السابقة المختصة بك، وغايتي أن تحسن الجهاد في حربك الروحية،"]]}, {"l": "Zec 10:5", "n": "", "vs": [[5, "ويدوسون الأعداء معا كما يدوس الجبابرة الطين في الشوارع، ويحاربون لأن الرب معهم فيلحقون العار بفرسان الأعداء."]]}, {"l": "1Co 9:25", "n": "", "vs": [[25, "وكل متبار يفرض على نفسه تدريبا صارما في شتى المجالات. فهؤلاء المتبارون يفعلون ذلك ليفوزوا بإكليل فان، وأما نحن فلنفوز بإكليل غير فان."]]}, {"l": "1Co 9:26", "n": "", "vs": [[26, "إذن، أنا أركض هكذا، لا كمن لا هدف له، وهكذا ألاكم أيضا، لا كمن يلطم الهواء،"]]}, {"l": "2Co 6:7", "n": "", "vs": [[7, "في كلمة الحق وقدرة الله؛ بأسلحة البر في الهجوم والدفاع؛"]]}, {"l": "2Co 10:3-5", "n": "", "vs": [[3, "فمع أننا نعيش في الجسد، فإننا لا نحارب وفقا للجسد."], [4, "فإن الأسلحة التي نحارب بها ليست جسدية، بل قادرة بالله على هدم الحصون: بها نهدم النظريات"], [5, "وكل ما يعلو مرتفعا لمقاومة معرفة الله، ونأسر كل فكر إلى طاعة المسيح."]]}, {"l": "Eph 6:10-18", "n": "", "vs": [[10, "وختاما، تشددوا في الرب وفي قدرة قوته."], [11, "البسوا سلاح الله الكامل، لتتمكنوا من الصمود في وجه مكايد إبليس."], [12, "فإن حربنا ليست ضد ذوي اللحم والدم، بل ضد الرئاسات، ضد السلطات، ضد أسياد العالم حكام هذا الظلام، ضد قوى الشر الروحية في الأماكن السماوية."], [13, "لذلك اتخذوا سلاح الله الكامل، لتتمكنوا من المقاومة في يوم الشر، ومن الصمود أيضا بعد تحقيق كل هدف."], [14, "فاصمدوا إذن بعد أن تتخذوا الحق حزاما لأوساطكم، والبر درعا لصدوركم،"], [15, "والاستعداد لنشر بشارة السلام حذاء لأقدامكم."], [16, "وفوق هذا كله، احملوا الإيمان ترسا به تقدرون أن تطفئوا جميع سهام الشرير المشتعلة."], [17, "واتخذوا الخلاص خوذة للرأس، وكلمة الله سيف الروح."], [18, "كونوا مصلين في كل حال، بكل صلاة وطلبة في الروح، وساهرين لهذا الغرض عينه مواظبين تماما على جميع الطلبات لأجل القديسين جميعا،"]]}, {"l": "1Th 5:8", "n": "", "vs": [[8, "وأما نحن، أهل النهار، فلنظل صاحين، متخذين من الإيمان والمحبة درعا لصدورنا، ومن الرجاء بالخلاص خوذة لرؤوسنا."]]}, {"l": "1Th 5:9", "n": "", "vs": [[9, "فإن الله عيننا لا لينزل علينا الغضب بل لننال الخلاص بربنا يسوع المسيح،"]]}, {"l": "2Ti 4:7", "n": "", "vs": [[7, "قد جاهدت الجهاد الحسن، قد بلغت نهاية الشوط، قد حافظت على الإيمان."]]}], "kwAr": "أحسن الجهاد", "noteAr": ""}, {"kw": "lay", "raw": "1Ti_6:19; Psa_63:8; Pro_3:18; Son_3:4; Phi_3:12-14; Heb_3:14, Heb_6:18; 1Jo_2:25; Rev_3:3", "note": "", "refs": [{"l": "1Ti 6:19", "n": "", "vs": [[19, "وبذلك يوفرون لأنفسهم رأس مال للمستقبل، حتى يمسكوا بالحياة الحقيقية."]]}, {"l": "Psa 63:8", "n": "", "vs": [[8, "تتعلق نفسي بك. يمينك تدعمني"]]}, {"l": "Pro 3:18", "n": "", "vs": [[18, "هي شجرة حياة لمن يتشبث بها، وطوبى لمن يتمسك بها."]]}, {"l": "Son 3:4", "n": "", "vs": [[4, "وما كدت أتجاوزهم حتى وجدت من تحبه نفسي، فتشبثت به ولم أطلقه حتى أدخلته بيت أمي ومخدع من حملت بي."]]}, {"l": "Phi 3:12-14", "n": "", "vs": [[12, "لست أدعي أني قد نلت الجائزة أو بلغت الكمال. ولكني ماأزال أسعى لاقتنائها، كما أن المسيح يسوع قد اقتناني."], [13, "أيها الإخوة، أنا لا أعتبر نفسي قد نلت الجائزة، ولكني أفعل أمرا واحدا: أنسى ما هو وراء وأتقدم إلى ما هو أمام،"], [14, "إذ أسعى إلى الهدف، لنوال تلك الجائزة التي يدعونا الله إليها دعوة عليا في المسيح يسوع."]]}, {"l": "Heb 3:14", "n": "", "vs": [[14, "فإن تمسكنا دائما بالثقة التي انطلقنا بها في البداية، وأبقيناها ثابتة إلى النهاية، نكون مشاركين للمسيح."]]}, {"l": "Heb 6:18", "n": "", "vs": [[18, "فاستنادا إلى وعد الله وقسمه، وهما أمران ثابتان لا يتغيران ويستحيل أن يكذب الله فيهما، نحصل على تشجيع قوي، بعدما التجأنا إلى التمسك بالرجاء الموضوع أمامنا."]]}, {"l": "1Jo 2:25", "n": "", "vs": [[25, "فإن الله نفسه قد وعدنا بالحياة الأبدية."]]}, {"l": "Rev 3:3", "n": "", "vs": [[3, "تذكر ما سبق أن تقبلته وسمعته، وتمسك بما آمنت به، وتب! فإن كنت لا تتنبه، آتيك كما يأتي اللص، ولا تدري في أية ساعة أفاجئك!"]]}], "kwAr": "تمسك بالحياة الأبدية", "noteAr": ""}, {"kw": "whereunto", "raw": "Rom_8:28-30, Rom_9:23, Rom_9:24; Col_3:15; 1Th_2:12; 2Th_2:14; 2Ti_1:9; 1Pe_3:9; 1Pe_5:10", "note": "", "refs": [{"l": "Rom 8:28-30", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."], [29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."], [30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."]]}, {"l": "Rom 9:23", "n": "", "vs": [[23, "وذلك بقصد أن يعلن غنى مجده في أوعية الرحمة التي سبق فأعدها للمجد،"]]}, {"l": "Rom 9:24", "n": "", "vs": [[24, "فينا نحن الذين دعاهم لا من بين اليهود فقط بل من بين الأمم أيضا؟"]]}, {"l": "Col 3:15", "n": "", "vs": [[15, "وليملك في قلوبكم سلام المسيح، فإليه قد دعيتم في الجسد الواحد؛ وكونوا شاكرين!"]]}, {"l": "1Th 2:12", "n": "", "vs": [[12, "ونحرضكم أن تسلكوا سلوكا يليق بالله، ذاك الذي يدعوكم إلى ملكوته ومجده."]]}, {"l": "2Th 2:14", "n": "", "vs": [[14, "فإلى هذا الأمر قد دعاكم ببشارتنا لكم، لنوال مجد ربنا يسوع المسيح."]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،"]]}, {"l": "1Pe 3:9", "n": "", "vs": [[9, "لا تبادلوا الشر بشر، ولا الشتيمة بشتيمة. بل بالعكس: باركوا، فترثوا البركة، لأنه لهذا دعاكم الله ."]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}], "kwAr": "التي إليها قد دعيت", "noteAr": ""}, {"kw": "hast", "raw": "1Ti_6:13; Deu_26:3, Deu_26:17-19; Isa_44:5; Luk_12:8, Luk_12:9; Rom_10:9, Rom_10:10; Heb_13:23", "note": "", "refs": [{"l": "1Ti 6:13", "n": "", "vs": [[13, "وأوصيك، أمام الله الذي يحيي كل شيء، والمسيح يسوع الذي شهد أمام بيلاطس البنطي بالاعتراف الحسن،"]]}, {"l": "Deu 26:3", "n": "", "vs": [[3, "ويأتي صاحب التقدمة إلى الكاهن المعين ويقول: أعترف اليوم للرب إلهك أني قد جئت إلى الأرض التي حلف الرب لآبائنا أن يهبها لنا."]]}, {"l": "Deu 26:17-19", "n": "", "vs": [[17, "فأنتم قد أعلنتم اليوم أن الرب إلهكم وأنكم ستسلكون في سبله وتطيعون فرائضه وأحكامه وتسمعون لصوته"], [18, "كما أعلن الرب اليوم أنكم تكونون له شعبا خاصا، حسب وعده لكم، وأن عليكم طاعة وصاياه جميعها،"], [19, "فيجعلكم أسمى من كل الأمم التي خلقها من حيث الثناء والشرف والمجد، وتكونون شعبا مقدسا للرب إلهكم كما وعد»."]]}, {"l": "Isa 44:5", "n": "", "vs": [[5, "ويقولون بملء أفواههم: «أنا عبد الرب. أنا ابن يعقوب». ويكتب على يده اسم الله، وباسم إسرائيل يلقب."]]}, {"l": "Luk 12:8", "n": "", "vs": [[8, "«ولكن أقول لكم: كل من يعترف بي أمام الناس، يعترف به ابن الإنسان أيضا أمام ملائكة الله."]]}, {"l": "Luk 12:9", "n": "", "vs": [[9, "ومن أنكرني أمام الناس، ينكر أمام ملائكة الله."]]}, {"l": "Rom 10:9", "n": "", "vs": [[9, "أنك إن اعترفت بفمك بيسوع ربا، وآمنت في قلبك بأن الله أقامه من الأموات، نلت الخلاص."]]}, {"l": "Rom 10:10", "n": "", "vs": [[10, "فإن الإيمان في القلب يؤدي إلى البر، والاعتراف بالفم يؤيد الخلاص،"]]}, {"l": "Heb 13:23", "n": "", "vs": [[23, "واعلموا أن أخانا تيموثاوس قد أطلق من السجن. فإن أسرع في المجيء إلي، نذهب معا لرؤيتكم."]]}], "kwAr": "وقد اعترفت الاعتراف الحسن", "noteAr": ""}], "arS": [["أحسن", ["G2570"]], [" ", []], ["الجهاد", ["G75"]], [" في ", []], ["معركة", ["G73"]], [" ", []], ["الإيمان", ["G4102"]], [" الجميلة. ", []], ["تمسك", ["G1949"]], [" ", []], ["بالحياة", ["G2222"]], [" ", []], ["الأبدية", ["G166"]], ["، التي إليها قد ", []], ["دعيت", ["G2564"]], ["، وقد ", []], ["اعترفت", ["G3670"]], [" ", []], ["الاعتراف", ["G3671"]], [" ", []], ["الحسن", ["G2570"]], [" (بالإيمان) ", []], ["أمام", ["G1799"]], [" ", []], ["شهود", ["G3144"]], [" ", []], ["كثيرين", ["G4183"]], [".", []]]}, {"c": 6, "v": 13, "text": "وأوصيك، أمام الله الذي يحيي كل شيء، والمسيح يسوع الذي شهد أمام بيلاطس البنطي بالاعتراف الحسن،", "groups": [{"kw": "give", "raw": "1Ti_5:21", "note": "", "refs": [{"l": "1Ti 5:21", "n": "", "vs": [[21, "أطلب منك أمام الله والمسيح والملائكة المختارين أن تعمل بهذه التوصيات دون مراعاة أشخاص، فلا تعمل شيئا بتحيز."]]}], "kwAr": "وأوصيك", "noteAr": ""}, {"kw": "who quickeneth", "raw": "Deu_32:39; 1Sa_2:6; Joh_5:21, Joh_5:26, Joh_14:25, Joh_14:26, Joh_14:6; Act_17:25; Rev_21:6; Rev_22:1", "note": "", "refs": [{"l": "Deu 32:39", "n": "", "vs": [[39, "انظروا الآن: إني أنا هو وليس إله آخر معي. أنا أميت وأحيي، أسحق وأشفي، ولا منقذ من يدي."]]}, {"l": "1Sa 2:6", "n": "", "vs": [[6, "الرب يميت ويحيي، يطرح إلى الهاوية ويصعد منها."]]}, {"l": "Joh 5:21", "n": "", "vs": [[21, "فكما يقيم الآب الموتى ويحييهم، كذلك يحيي الابن من يشاء."]]}, {"l": "Joh 5:26", "n": "", "vs": [[26, "لأنه كما أن للآب حياة في ذاته، فقد أعطى الابن أيضا أن تكون له حياة في ذاته،"]]}, {"l": "Joh 14:25", "n": "", "vs": [[25, "وقد قلت لكم هذه الأمور وأنا مازلت عندكم."]]}, {"l": "Joh 14:26", "n": "", "vs": [[26, "وأما الروح القدس، المعين الذي سيرسله الآب باسمي، فإنه يعلمكم كل شيء، ويذكركم بكل ما قلته لكم."]]}, {"l": "Joh 14:6", "n": "", "vs": [[6, "فأجابه يسوع: «أنا هو الطريق والحق والحياة. لا يأتي أحد إلى الآب إلا بي."]]}, {"l": "Act 17:25", "n": "", "vs": [[25, "وليس بحاجة إلى خدمة يقدمها له الناس. فإنه يهب جميع الخلق الحياة والنفس وكل شيء."]]}, {"l": "Rev 21:6", "n": "", "vs": [[6, "ثم قال: «قد تم. أنا الألف والياء (البداية والنهاية). أنا أسقي العطشان من ينبوع ماء الحياة مجانا."]]}, {"l": "Rev 22:1", "n": "", "vs": [[1, "ثم أراني الملاك نهر ماء الحياة صافيا كالبلور، ينبع من عرش الله والحمل"]]}], "kwAr": "الله الذي يحيي كل شيء", "noteAr": ""}, {"kw": "who before", "raw": "Mat_27:11; Joh_18:36, Joh_18:37, Joh_19:11; Rev_1:5, Rev_3:14", "note": "", "refs": [{"l": "Mat 27:11", "n": "", "vs": [[11, "ووقف يسوع أمام الحاكم. فسأله الحاكم: «أأنت ملك اليهود؟» أجابه: «أنت قلت!»"]]}, {"l": "Joh 18:36", "n": "", "vs": [[36, "أجاب يسوع: «ليست مملكتي من هذا العالم. ولو كانت مملكتي من هذا العالم، لكان حراسي يجاهدون لكي لا أسلم إلى اليهود. أما الآن فمملكتي ليست من هنا»."]]}, {"l": "Joh 18:37", "n": "", "vs": [[37, "فسأله بيلاطس: «فهل أنت ملك إذن؟» أجابه: «أنت قلت، إني ملك. ولهذا ولدت وجئت إلى العالم: لأشهد للحق، وكل من هو من الحق يصغي لصوتي»."]]}, {"l": "Joh 19:11", "n": "", "vs": [[11, "فأجابه يسوع «ما كان لك علي سلطة قط، لو لم تكن قد أعطيت لك من فوق. لذلك فالذي سلمني إليك له خطيئة أعظم...»"]]}, {"l": "Rev 1:5", "n": "", "vs": [[5, "ومن يسوع المسيح الشاهد الأمين، بكر القائمين من بين الأموات، ملك ملوك الأرض، ذاك الذي بدافع محبته لنا مات لأجلنا فغسلنا بدمه من خطايانا،"]]}, {"l": "Rev 3:14", "n": "", "vs": [[14, "واكتب إلى ملاك الكنيسة في لاودكية: إليك ما يقوله الحق، الشاهد الأمين الصادق، رئيس خليقة الله:"]]}], "kwAr": "الذي شهد أمام بيلاطس البنطي", "noteAr": ""}, {"kw": "confession", "raw": "or, profession", "note": "or, profession", "refs": [], "kwAr": "بالاعتراف الحسن", "noteAr": "أو: إقرار (اعتراف)."}], "arS": [["وأوصيك", ["G3853", "G4671"]], ["، ", []], ["أمام", ["G1799"]], [" ", []], ["الله", ["G2316"]], [" الذي ", []], ["يحيي", ["G2227"]], [" ", []], ["كل شيء", ["G3956"]], ["، ", []], ["والمسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [" الذي ", []], ["شهد", ["G3140"]], [" أمام ", []], ["بيلاطس", ["G4091"]], [" ", []], ["البنطي", ["G4194"]], [" ", []], ["بالاعتراف", ["G3671"]], [" ", []], ["الحسن", ["G2570"]], ["،", []]]}, {"c": 6, "v": 14, "text": "أن تحفظ الوصية خالية من العيب واللوم إلى يوم ظهور ربنا يسوع المسيح علنا.", "groups": [{"kw": "keep", "raw": "1Ti_6:20, 1Ti_4:11-16; 1Ch_28:9, 1Ch_28:10,1Ch_28:20; Col_4:17", "note": "", "refs": [{"l": "1Ti 6:20", "n": "", "vs": [[20, "ياتيموثاوس، حافظ على الأمانة المودعة لديك. تجنب الكلام الدنس الباطل، ومناقضات ما يسمى زورا «معرفة»."]]}, {"l": "1Ti 4:11-16", "n": "", "vs": [[11, "أوص بهذه الأمور وعلم!"], [12, "لا يستخف أحد بحداثة سنك. وإنما كن قدوة للمؤمنين، في الكلام والسلوك والمحبة والإيمان والطهارة."], [13, "إلى حين وصولي، انصرف إلى تلاوة الكتاب، وإلى الوعظ، وإلى التعليم."], [14, "لا تهمل الموهبة الخاصة التي فيك والتي أعطيت لك بالتنبوء ووضع الشيوخ أيديهم عليك."], [15, "انصرف إلى هذه الأمور، وانشغل بها كليا، ليكون تقدمك واضحا للجميع."], [16, "انتبه جيدا لنفسك وللتعليم. فإنك إذ تواظب على ذلك، تنقذ نفسك وسامعيك أيضا."]]}, {"l": "1Ch 28:9", "n": "", "vs": [[9, "أما أنت ياابني سليمان، فاعرف إله أبيك واعبده بكمال قلب، وبنفس راغبة، لأن الرب يتفحص جميع القلوب، ويفهم كل تصور وفكر. فإن طلبته تجده، وإن تركته ينبذك إلى الأبد."]]}, {"l": "1Ch 28:10", "n": "", "vs": [[10, "ففكر مليا، لأن الرب قد اصطفاك لتبني بيتا لقدس الأقداس، فتقو واعمل»."]]}, {"l": "1Ch 28:20", "n": "", "vs": [[20, "فتقو وتشجع واعمل. لا تجزع ولا ترتعب لأن الرب الإله إلهي معك، ولن يخذلك ولا يتركك حتى تستوفي كل عمل خدمة هيكل الرب."]]}, {"l": "Col 4:17", "n": "", "vs": [[17, "وقولوا لأرخبس: «تنبه للخدمة التي تلقيتها في الرب، وقم بها كاملة!»"]]}], "kwAr": "أن تحفظ الوصية", "noteAr": ""}, {"kw": "without", "raw": "Son_4:7; Eph_5:27; Heb_9:14; 1Pe_1:19; 2Pe_3:14", "note": "", "refs": [{"l": "Son 4:7", "n": "", "vs": [[7, "كلك جميلة ياحبيبتي ولا عيب فيك."]]}, {"l": "Eph 5:27", "n": "", "vs": [[27, "حتى يزفها إلى نفسه كنيسة بهية لا يشوبها عيب أو تجعد أو أية نقيصة مشابهة بل تكون مقدسة خالية من العيوب."]]}, {"l": "Heb 9:14", "n": "", "vs": [[14, "فكم بالأحرى دم المسيح الذي قدم نفسه لله بروح أزلي ذبيحة لا عيب فيها، يطهر ضمائرنا من الأعمال الميتة لنعبد الله الحي."]]}, {"l": "1Pe 1:19", "n": "", "vs": [[19, "بل كانت دما ثمينا، دم المسيح، ذلك الحمل الطاهر الذي ليس فيه عيب ولا دنس!"]]}, {"l": "2Pe 3:14", "n": "", "vs": [[14, "فبينما تنتظرون إتمام هذا الوعد، أيها الأحباء، اجتهدوا أن يجدكم الرب في سلام، خالين من الدنس والعيب."]]}], "kwAr": "خالية من العيب", "noteAr": ""}, {"kw": "unrebukeable", "raw": "Phi_2:15; Col_1:22; Jud_1:24", "note": "", "refs": [{"l": "Phi 2:15", "n": "", "vs": [[15, "لتكونوا بلا أذى وبسطاء، أولادا لله لا يعابون بشيء في وسط جيل منحرف فاسد، تضيئون بينهم كأنوار في العالم،"]]}, {"l":
