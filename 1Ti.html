, [7, "بل أخلى نفسه، متخذا صورة عبد، صائرا شبيها بالبشر؛"], [8, "وإذ ظهر بهيئة إنسان، أمعن في الاتضاع، وكان طائعا حتى الموت، موت الصليب."]]}, {"l": "Col 1:16-18", "n": "", "vs": [[16, "إذ به خلقت جميع الأشياء: ما في السماوات وما على الأرض، ما يرى وما لا يرى، أعروشا كانت أم سيادات أم رئاسات أم سلطات. كل ما في الكون قد خلق به ولأجله."], [17, "هو كائن قبل كل شيء، وبه يدوم كل شيء."], [18, "وهو رأس الجسد، أي الكنيسة؛ هو البداءة وبكر القائمين من بين الأموات، ليكون له المقام الأول في كل شيء."]]}, {"l": "Heb 1:3", "n": "", "vs": [[3, "إنه ضياء مجد الله وصورة جوهره. حافظ كل ما في الكون بكلمته القديرة. وهو الذي بعدما طهرنا بنفسه من خطايانا،"]]}, {"l": "Heb 2:9-13", "n": "", "vs": [[9, "إلا أننا نرى يسوع الآن مكللا بالمجد والكرامة، لأنه قاسى الموت. وذلك بعدما صار أدنى من الملائكة إلى حين، ليذوق بنعمة الله الموت عوضا عن كل واحد."], [10, "فلما قصد الله ، الذي من أجله كل شيء وبه كل شيء، أن يحضر إلى المجد أبناء كثيرين، كان من اللائق أن يجعل قائدهم إلى الخلاص مؤهلا لإكمال مهمته عن طريق الآلام."], [11, "فإن للمسيح الذي يقدس المؤمنين به، وللمقدسين أنفسهم، أبا واحدا. لهذا، لا يستحي المسيح أن يدعو المؤمنين به إخوة له."], [12, "إذ يقول الكتاب بلسانه: «أعلن اسمك لإخوتي. وأسبحك في وسط الجماعة!»"], [13, "ويقول أيضا: «وأنا أكون متوكلا عليه!» وأيضا: «ها أنا مع الأولاد الذين وهبهم الله لي!»"]]}, {"l": "1Jo 1:2", "n": "", "vs": [[2, "فإن «الحياة» تجلت أمامنا. وبعدما رأيناها فعلا، نشهد لها الآن. وها نحن ننقل إليكم خبر هذه الحياة الأبدية التي كانت عند الآب ثم تجلت أمامنا!"]]}, {"l": "Rev 1:17", "n": "", "vs": [[17, "فلما رأيته ارتميت عند قدميه كالميت، فلمسني بيده اليمنى وقال: «لا تخف! أنا الأول والآخر،"]]}, {"l": "Rev 1:18", "n": "", "vs": [[18, "أنا الحي. كنت ميتا، ولكن ها أنا حي إلى أبد الآبدين. ولي مفاتيح الموت والهاوية."]]}], "kwAr": "الله", "noteAr": ""}, {"kw": "manifest", "raw": "Gr. manifested, 1Jo_3:5", "note": "Gr. manifested, 1Jo_3:5", "refs": [{"l": "1Jo 3:5", "n": "", "vs": [[5, "وأنتم تعرفون أن المسيح جاء إلى هذه الأرض لكي يحمل الخطايا، مع كونه بلا خطيئة."]]}], "kwAr": "ظهر في الجسد", "noteAr": "في اليونانية: أُظهر."}, {"kw": "justified", "raw": "Isa_50:5-7; Mat_3:16; Joh_1:32, Joh_1:33, Joh_15:26, Joh_16:8, Joh_16:9; Act_2:32-36; Rom_1:3, Rom_1:4; 1Pe_3:18; 1Jo_5:6-8", "note": "", "refs": [{"l": "Isa 50:5-7", "n": "", "vs": [[5, "قد فتح السيد الرب أذني فلم أعاند أو أتراجع إلى الوراء"], [6, "بذلت ظهري للضاربين، وخدي للناتفين، ولم أحجب وجهي عن الإهانة والبصق."], [7, "لأن السيد الرب يغيثني فلا أخزى، لذلك جعلت وجهي كالصوان، لأني عالم أنني لن أخزى."]]}, {"l": "Mat 3:16", "n": "", "vs": [[16, "فلما تعمد يسوع، صعد من الماء في الحال، وإذا السماوات قد انفتحت له ورأى روح الله هابطا ونازلا عليه كأنه حمامة."]]}, {"l": "Joh 1:32", "n": "", "vs": [[32, "ثم شهد يوحنا فقال: «رأيت الروح ينزل من السماء بهيئة حمامة ويستقر عليه."]]}, {"l": "Joh 1:33", "n": "", "vs": [[33, "ولم أكن أعرفه، ولكن الذي أرسلني لأعمد بالماء هو قال لي: الذي ترى الروح ينزل ويستقر عليه هو الذي سيعمد بالروح القدس."]]}, {"l": "Joh 15:26", "n": "", "vs": [[26, "وعندما يأتي المعين، الذي سأرسله لكم من عند الآب، روح الحق الذي ينبثق من الآب، فهو يشهد لي،"]]}, {"l": "Joh 16:8", "n": "", "vs": [[8, "وعندما يجيء يبكت العالم على الخطيئة وعلى البر وعلى الدينونة:"]]}, {"l": "Joh 16:9", "n": "", "vs": [[9, "أما على الخطيئة، فلأنهم لا يؤمنون بي،"]]}, {"l": "Act 2:32-36", "n": "", "vs": [[32, "فيسوع هذا أقامه الله من الموت، ونحن جميعا شهود لذلك."], [33, "وإذ رفع إلى يمين الله، وأخذ من الآب الروح القدس الموعود به، أفاضه علينا. وما ترونه الآن وتسمعونه هو نتيجة لذلك."], [34, "فإن داود لم يرتفع بجسده إلى السماء. ثم إنه هو نفسه يقول: قال الرب لربي: اجلس عن يميني"], [35, "حتى أجعل أعداءك موطئا لقدميك."], [36, "فليعلم يقينا بنو إسر ائيل جميعا، أن الله قد جعل يسوع، هذا الذي صلبتموه أنتم، ربا ومسيحا!»"]]}, {"l": "Rom 1:3", "n": "", "vs": [[3, "وهو يختص بابنه الذي جاء من نسل داود من الناحية البشرية؛"]]}, {"l": "Rom 1:4", "n": "", "vs": [[4, "ومن ناحية روح القداسة، تبين بقوة أنه ابن الله بالقيامة من بين الأموات. إنه يسوع المسيح ربنا"]]}, {"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}, {"l": "1Jo 5:6-8", "n": "", "vs": [[6, "فيسوع المسيح وحده جاءنا بالماء والدم. لا بالماء فقط، بل بالماء والدم معا. هذه الحقيقة، يشهد لها الروح القدس: لأنه هو الحق ذاته."], [7, "فإن هنالك ثلاثة شهود غفي السماء، الآب والكلمة والروح القدس، وهؤلاء الثلاثة هم واحدف."], [8, "والذين يشهدون في الأرض هم ثلاثة: الروح، والماء، والدم. وهؤلاء الثلاثة هم في الواحد."]]}], "kwAr": "شهد الروح لبره", "noteAr": ""}, {"kw": "seen", "raw": "Psa_68:17, Psa_68:18; Mat_4:11, Mat_28:2; Mar_1:13, Mar_16:5; Luk_2:10-14, Luk_22:43, Luk_24:4; Joh_20:12; Act_1:10,Act_1:11; Eph_3:10; 1Pe_1:12", "note": "", "refs": [{"l": "Psa 68:17", "n": "", "vs": [[17, "مركبات الرب كثيرة لا تحصى والرب في وسطها، فصار جبل صهيون مماثلا لجبل سيناء في القداسة."]]}, {"l": "Psa 68:18", "n": "", "vs": [[18, "يصعد إلى العلى ويأخذ معه سبايا كثيرين؛ يوزع الغنائم على الناس وحتى على الذين تمردوا قبلا على مقر سكناك، أيها الرب الإله."]]}, {"l": "Mat 4:11", "n": "", "vs": [[11, "فتركه إبليس، وإذا بعض الملائكة جاءوا إليه وأخذوا يخدمونه."]]}, {"l": "Mat 28:2", "n": "", "vs": [[2, "فإذا زلزال عنيف قد حدث، لأن ملاكا من عند الرب نزل من السماء، وجاء فدحرج الحجر وجلس عليه."]]}, {"l": "Mar 1:13", "n": "", "vs": [[13, "فقضى فيها أربعين يوما والشيطان يجربه. وكان بين الوحوش وملائكة تخدمه."]]}, {"l": "Mar 16:5", "n": "", "vs": [[5, "وإذ دخلن القبر، رأين في الجهة اليمنى شابا جالسا، لابسا ثوبا أبيض، فتملكهن الخوف."]]}, {"l": "Luk 2:10-14", "n": "", "vs": [[10, "فقال لهم الملاك: «لا تخافوا! فها أنا أبشركم بفرح عظيم يعم الشعب كله:"], [11, "فقد ولد لكم اليوم في مدينة داود مخلص هو المسيح الرب."], [12, "وهذه هي العلامة لكم. تجدون طفلا ملفوفا بقماط ونائما في مذود»."], [13, "وفجأة ظهر مع الملاك جمهور من الجند السماوي، يسبحون الله قائلين:"], [14, "«المجد لله في الأعالي، وعلى الأرض السلام؛ وبالناس المسرة! »"]]}, {"l": "Luk 22:43", "n": "", "vs": [[43, "وظهر له ملاك من السماء يشدده."]]}, {"l": "Luk 24:4", "n": "", "vs": [[4, "وفيما هن متحيرات في ذلك، إذا رجلان بثياب براقة قد وقفا بجانبهن."]]}, {"l": "Joh 20:12", "n": "", "vs": [[12, "فرأت ملاكين بثياب بيض، جالسين حيث كان جثمان يسوع موضوعا، واحدا عند الرأس والآخر عند القدمين."]]}, {"l": "Act 1:10", "n": "", "vs": [[10, "وبينما هم يحدقون إلى السماء وهو ينطلق إليها، إذا رجلان قد ظهرا لهم بثياب بيض،"]]}, {"l": "Act 1:11", "n": "", "vs": [[11, "وقالا لهم: «أيها الجليليون، لماذا تقفون ناظرين إلى السماء؟ إن يسوع، هذا الذي ارتفع عنكم إلى السماء، سيعود منها مثلما رأيتموه منطلقا إليها!»"]]}, {"l": "Eph 3:10", "n": "", "vs": [[10, "والغاية أن يتجلى الآن أمام الرئاسات والسلطات في الأماكن السماوية ما يظهر في الكنيسة من حكمة الله المتعددة الوجوه،"]]}, {"l": "1Pe 1:12", "n": "", "vs": [[12, "ولكن الله أوحى إليهم أن اجتهادهم لم يكن لمصلحتهم هم، بل لمصلحتكم أنتم. فقد كان ذلك من أجل البشارة التي نقلها إليكم في الزمان الحاضر مبشرون يؤيدهم الروح القدس المرسل من السماء. ويالها من أمور يتمنى حتى الملائكة أن يطلعوا عليها!"]]}], "kwAr": "شاهدته الملائكة", "noteAr": ""}, {"kw": "preached", "raw": "Luk_2:32; Act_10:34, Act_13:46-48; Rom_10:12, Rom_10:18; Gal_2:8; Eph_3:5-8; Col_1:27", "note": "", "refs": [{"l": "Luk 2:32", "n": "", "vs": [[32, "نور هداية للأمم ومجدا لشعبك إسر ائيل»."]]}, {"l": "Act 10:34", "n": "", "vs": [[34, "فبدأ بطرس كلامه قائلا: «تبين لي فعلا أن الله لا يفضل أحدا على أحد،"]]}, {"l": "Act 13:46-48", "n": "", "vs": [[46, "فخاطبهم بولس وبرنابا بجرأة قائلين: «كان يجب أن نبلغكم أنتم أولا كلمة الله، ولكنكم رفضتموها فأظهرتم أنكم لا تستحقون الحياة الأبدية. وها نحن نتوجه إلى غير اليهود!"], [47, "فقد أوصانا الرب قائلا: قد جعلتك نورا للأمم، لتكون سبيل خلاص إلى أقصى الأرض!»"], [48, "فلما سمع غير اليهود ذلك، فرحوا جدا، ومجدوا كلمة الرب. وآمن جميع من أعدهم الله للحياة الأبدية."]]}, {"l": "Rom 10:12", "n": "", "vs": [[12, "فلا فرق بين اليهودي واليوناني، لأن للجميع ربا واحدا، غنيا تجاه كل من يدعوه»."]]}, {"l": "Rom 10:18", "n": "", "vs": [[18, "ولكني أقول: أما سمعوا؟ بلى، فإن المبشرين «انطلق صوتهم إلى الأرض كلها، وكلامهم إلى أقاصي العالم»."]]}, {"l": "Gal 2:8", "n": "", "vs": [[8, "لأن الذي استخدم بطرس في رسوليته إلى أهل الختان، استخدمني أيضا بالنسبة إلى الأمم."]]}, {"l": "Eph 3:5-8", "n": "", "vs": [[5, "ذلك السر الذي لم يطلع عليه بنو البشر في الأجيال الماضية مثلما أعلن الآن بوحي الروح لرسله القديسين وأنبيائه:"], [6, "وهو أن الأمم هم شركاء اليهود في الميراث، وأعضاء في الجسد معهم، ولهم أيضا حق الاستفادة من الوعد. وذلك في المسيح يسوع وبفضل الإنجيل"], [7, "الذي صرت أنا خادما له بحسب نعمة الله الموهوبة لي وفقا لعمل قدرته."], [8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "Col 1:27", "n": "", "vs": [[27, "الذين أراد الله أن يعلن لهم كم هو غني مجد هذا السر بين الأمم: إنه المسيح فيكم، وهو رجاء المجد؛"]]}], "kwAr": "بشر به بين الأمم", "noteAr": ""}, {"kw": "believed", "raw": "Act_14:27; Col_1:6, Col_1:23; Rev_7:9", "note": "", "refs": [{"l": "Act 14:27", "n": "", "vs": [[27, "ولما وصلا، استدعيا الكنيسة إلى الاجتماع، وأخبرا بكل ما فعل الله بواسطتهما، وبأنه فتح باب الإيمان لغير اليهود."]]}, {"l": "Col 1:6", "n": "", "vs": [[6, "والتي وصلت إليكم كما تنتشر الآن في العالم أجمع، منتجة الثمر ونامية، مثلما يحدث بينكم أنتم منذ أن سمعتم بنعمة الله واختبرتموها بالحق،"]]}, {"l": "Col 1:23", "n": "", "vs": [[23, "على أن تثبتوا فعلا في الإيمان، مؤسسين وراسخين وغير متحولين عن رجاء الإنجيل الذي سمعتموه والذي بشر به للخليقة كلها تحت السماء، وله صرت أنا بولس خادما."]]}, {"l": "Rev 7:9", "n": "", "vs": [[9, "ثم نظرت، فرأيت جمعا كثيرا لا يحصى، من كل أمة وقبيلة وشعب ولغة، واقفين أمام العرش وأمام الحمل، وقد ارتدوا ثيا با بيضاء، وأمسكوا بأيديهم سعف النخل،"]]}], "kwAr": "أومن به في العالم", "noteAr": ""}, {"kw": "received", "raw": "Mar_16:19; Luk_24:51; Joh_6:62, Joh_13:3, Joh_16:28, Joh_17:5; Act_1:1-9, Act_1:19; Eph_4:8-10; Heb_1:3, Heb_8:1, Heb_12:2; 1Pe_3:22", "note": "", "refs": [{"l": "Mar 16:19", "n": "", "vs": [[19, "ثم إن الرب، بعدما كلمهم، رفع إلى السماء، وجلس عن يمين الله."]]}, {"l": "Luk 24:51", "n": "", "vs": [[51, "وبينما كان يباركهم، انفصل عنهم وأصعد إلى السماء"]]}, {"l": "Joh 6:62", "n": "", "vs": [[62, "فماذا لو رأيتم ابن الإنسان صاعدا إلى حيث كان قبلا؟"]]}, {"l": "Joh 13:3", "n": "", "vs": [[3, "وكان يسوع عالما أن الآب قد جعل كل شيء في يديه وأنه من الله خرج وإلى الله سيعود،"]]}, {"l": "Joh 16:28", "n": "", "vs": [[28, "خرجت من عند الآب، وأتيت إلى العالم. وها أنا أترك العالم وأعود إلى الآب»."]]}, {"l": "Joh 17:5", "n": "", "vs": [[5, "فمجدني في حضرتك الآن، أيها الآب، بما كان لي من مجد عندك قبل تكوين العالم."]]}, {"l": "Act 1:1-9", "n": "", "vs": [[1, "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"], [2, "حتى اليوم الذي ارتفع فيه إلى السماء، بعدما قدم وصاياه، بالروح القدس، إلى الرسل الذين اختارهم."], [3, "وخلال فترة أربعين يوما بعد آلامه، ظهر لهم مرات عديدة، وأثبت لهم أنه حي ببراهين كثيرة قاطعة، وحدثهم عن ملكوت الله."], [4, "وبينما كان مجتمعا معهم، قال: «لا تتركوا أورشليم، بل ابقوا فيها منتظرين إتمام وعد الآب، الذي سبق أن حدثتكم عنه."], [5, "فإن يوحنا عمد الناس بالماء؛ أما أنتم فستتعمدون بعد أيام قليلة بالروح القدس!»"], [6, "وقد سأله المجتمعون: «يار ب، أفي هذا الوقت تعيد الملك إلى إسرائيل؟»"], [7, "فأجابهم: «ليس لكم أن تعرفوا المواعيد والأوقات التي حددها الآب بسلطته."], [8, "ولكن حينما يحل الروح القدس عليكم تنالون القوة، وتكونون لي شهودا في أورشليم واليهودية كلها، وفي السامرة، وإلى أقاصي الأرض»."], [9, "قال هذا وارتفع إلى السماء بمشهد منهم. ثم حجبته سحابة عن أنظارهم."]]}, {"l": "Act 1:19", "n": "", "vs": [[19, "وعلم أهل أورشليم جميعا بهذه الحادثة، فأطلقوا على حقله اسم ¢حقل دمخ¢ بلغتهم، أي حقل الدم."]]}, {"l": "Eph 4:8-10", "n": "", "vs": [[8, "لذلك يقول (الوحي): «إذ صعد إلى الأعالي، ساق أسرى، ووهب الناس مواهب!»"], [9, "وأما أنه «صعد»، فما معنى هذا سوى أنه كان قد نزل أيضا إلى الأقسام السفلى في الأرض؟"], [10, "إن الذي نزل هو نفسه الذي صعد إلى ما فوق جميع السماوات لكي يملأ كل شيء."]]}, {"l": "Heb 1:3", "n": "", "vs": [[3, "إنه ضياء مجد الله وصورة جوهره. حافظ كل ما في الكون بكلمته القديرة. وهو الذي بعدما طهرنا بنفسه من خطايانا،"]]}, {"l": "Heb 8:1", "n": "", "vs": [[1, "وخلاصة القول في هذا الموضوع، أن المسيح هو رئيس كهنتنا الذي وصفنا كهنوته هنا. إنه الآن جالس في السماء عن يمين عرش الله العظيم."]]}, {"l": "Heb 12:2", "n": "", "vs": [[2, "متطلعين دائما إلى يسوع: رائد إيماننا ومكمله. فهو قد تحمل الموت صلبا، هازئا بما في ذلك من عار، إذ كان ينظر إلى السرور الذي ينتظره، ثم جلس عن يمين عرش الله."]]}, {"l": "1Pe 3:22", "n": "", "vs": [[22, "الذي انطلق إلى السماء، وهو الآن جالس عن يمين الله؛ وقد جعلت الملائكة والسلطات والقوات (الروحية) خاضعة له!"]]}], "kwAr": "رفع في المجد", "noteAr": ""}], "arS": [["وباعتراف الجميع", ["G3672"]], ["، أن ", []], ["سر", ["G3466"]], [" ", []], ["التقوى", ["G2150"]], [" ", []], ["عظيم", ["G3173"]], [": ", []], ["الله", ["G2316"]], [" ", []], ["ظهر", ["G5319"]], [" في ", []], ["الجسد", ["G4561"]], ["، ", []], ["شهد الروح لبره", ["G1344", "G4151"]], ["، ", []], ["شاهدته", ["G3700"]], [" ", []], ["الملائكة", ["G32"]], ["، ", []], ["بشر به", ["G2784"]], [" بين ", []], ["الأمم", ["G1484"]], ["، ", []], ["أومن به", ["G4100"]], [" في ", []], ["العالم", ["G2889"]], ["، ثم ", []], ["رفع", ["G353"]], [" في ", []], ["المجد", ["G1391"]], [".", []]]}, {"c": 4, "v": 1, "text": "إلا أن الروح يعلن صراحة أن قوما في الأزمنة الأخيرة سوف يرتدون عن الإيمان، منساقين وراء أرواح مضللة وتعاليم شيطانية،", "groups": [{"kw": "the Spirit", "raw": "Joh_16:13; Act_13:2, Act_28:25; 1Co_12:11; 1Jo_2:18; Rev_2:7, Rev_2:11, Rev_2:17, Rev_2:29; Rev_3:6, Rev_3:13, Rev_3:22", "note": "", "refs": [{"l": "Joh 16:13", "n": "", "vs": [[13, "ولكن، عندما يأتيكم روح الحق يرشدكم إلى الحق كله، لأنه لا يقول شيئا من عنده، بل يخبركم بما يسمعه، ويطلعكم على ما سوف يحدث."]]}, {"l": "Act 13:2", "n": "", "vs": [[2, "وذات يوم، وهم صائمون يتعبدون للرب، قال لهم الروح القدس: «خصصوا لي برنابا وشاول لأجل العمل الذي دعوتهما إليه»."]]}, {"l": "Act 28:25", "n": "", "vs": [[25, "فاختلفوا فيما بينهم، وانصرفوا بعدما قال لهم: «صدق الروح القدس إذ قال لآبائكم بلسان النبي إشعياء:"]]}, {"l": "1Co 12:11", "n": "", "vs": [[11, "ولكن هذا كله يشغله الروح الواحد نفسه، موزعا المواهب، كما يشاء، على كل واحد."]]}, {"l": "1Jo 2:18", "n": "", "vs": [[18, "أيها الأولاد، اعلموا أننا نعيش الآن في الزمن الأخير. وكما سمعتم أنه سوف يأتي أخيرا «مسيح دجال»، فقد ظهر حتى الآن كثيرون من الدجالين المقاومين للمسيح. من هنا نتأكد أننا نعيش في الزمن الأخير."]]}, {"l": "Rev 2:7", "n": "", "vs": [[7, "من له أذنان فليسمع ما يقوله الروح للكنائس! كل من ينتصر سأطعمه من ثمر شجرة الحياة في فردوس الله."]]}, {"l": "Rev 2:11", "n": "", "vs": [[11, "من له أذن فليسمع ما يقوله الروح للكنائس! كل من ينتصر لن يلحق به أذى الموت الثاني!"]]}, {"l": "Rev 2:17", "n": "", "vs": [[17, "من له أذن فليسمع ما يقوله الروح للكنائس! كل من سينتصر سأطعمه من المن الخفي، وأعطيه حجرا صغيرا أبيض حفر عليه اسم جديد لا يعرفه إلا الذي يأخذه!"]]}, {"l": "Rev 2:29", "n": "", "vs": [[29, "من له أذن فليسمع ما يقوله الروح للكنائس!"]]}, {"l": "Rev 3:6", "n": "", "vs": [[6, "من له أذن فليسمع ما يقوله الروح للكنائس!"]]}, {"l": "Rev 3:13", "n": "", "vs": [[13, "من له أذن فليسمع ما يقوله الروح للكنائس!"]]}, {"l": "Rev 3:22", "n": "", "vs": [[22, "من له أذن فليسمع ما يقوله الروح للكنائس!»"]]}], "kwAr": "الروح", "noteAr": ""}, {"kw": "expressly", "raw": "Eze_1:3", "note": "", "refs": [{"l": "Eze 1:3", "n": "", "vs": [[3, "أوحى الرب إلى حزقيال الكاهن ابن بوزي عند جوار نهر خابور، في ديار الكلدانيين، إذ كانت علي يد الرب،"]]}], "kwAr": "صراحة", "noteAr": ""}, {"kw": "the latter", "raw": "Num_24:14; Deu_4:30, Deu_32:29; Isa_2:2; Jer_48:47, Jer_49:39; Eze_38:16; Dan_10:14; Hos_3:5; Mic_4:1; 2Ti_3:1-9; 1Pe_1:20; 2Pe_3:3; Jud_1:4, Jud_1:18", "note": "", "refs": [{"l": "Num 24:14", "n": "", "vs": [[14, "والآن أعود إلى شعبي، ولكن دعني أنبئك بما سينزله هذا الشعب بقومك في آخر الأيام»."]]}, {"l": "Deu 4:30", "n": "", "vs": [[30, "فعندما يكتنفكم الضيق وتصيبكم في آخر الأيام جميع هذه الأمور، عندئذ ترجعون إلى الرب إلهكم وتطيعون أوامره."]]}, {"l": "Deu 32:29", "n": "", "vs": [[29, "لو عقلوا لفطنوا لمآلهم وتأملوا في مصيرهم،"]]}, {"l": "Isa 2:2", "n": "", "vs": [[2, "ويحدث في آخر الأيام، أن جبل هيكل الرب يصبح أسمى من كل الجبال، ويعلو فوق كل التلال، فتتوافد إليه جميع الأمم."]]}, {"l": "Jer 48:47", "n": "", "vs": [[47, "ولكني أرد سبي موآب في الأيام الآتية»، يقول الرب. إلى هنا ختام القضاء على موآب."]]}, {"l": "Jer 49:39", "n": "", "vs": [[39, "ولكن أرد سبي عيلام في الأيام الآتية يقول الرب»."]]}, {"l": "Eze 38:16", "n": "", "vs": [[16, "وتزحف على شعبي إسرائيل كسحابة تغطي الأرض، أني في الأيام الأخيرة آتي بك إلى أرضي لكي تعرفني الشعوب عندما تتجلى قداستي حين أدمرك ياجوج أمام عيونهم.هذا ما يقوله السيد الرب:"]]}, {"l": "Dan 10:14", "n": "", "vs": [[14, "وقد جئت الآن لأطلعك على ما يصيب شعبك في الأيام الأخيرة، لأن الرويا تختص بالأيام المقبلة»."]]}, {"l": "Hos 3:5", "n": "", "vs": [[5, "ثم يرجع أبناء إسرائيل ويطلبون الرب إلههم، وداود ملكهم (أي المسيح)، ويلتمسون برهبة الرب وجوده في آخر الأيام»."]]}, {"l": "Mic 4:1", "n": "", "vs": [[1, "ويكون في آخر الأيام أن جبل هيكل الرب يصبح أشهر الجبال، ويعلو فوق كل التلال، فتتقاطر إليه شعوب عديدة،"]]}, {"l": "2Ti 3:1-9", "n": "", "vs": [[1, "واعلم هذا الأمر: أن أزمنة صعبة ستعم في الأيام الأخيرة؛"], [2, "إذ يكون الناس محبين لأنفسهم، محبين للمال، متكبرين، مباهين بأنفسهم، شتامين، غير مطيعين لوالديهم، ناكرين للجميل، دنسين،"], [3, "متحجري العواطف، غير صفوحين، نمامين، جامحي الأهواء، شرسين غير محبين للصلاح،"], [4, "خائنين، وقحين، مدعين، محبين للذات أكثر من محبتهم لله،"], [5, "لهم من التقوى مظهرها ولكنهم لقوتها منكرون، فعن هؤلاء الناس ابتعد!"], [6, "فمن هؤلاء من يدخلون البيوت خلسة، ويوقعون في حبائلهم بعض النساء السخيفات المثقلات بالخطايا، اللواتي تجرفهن شهوات مختلفة،"], [7, "يصغين للتعليم دائما، ولا يستطعن أبدا أن يبلغن معرفة الحق بالتمام!"], [8, "ومثلما قاوم (الساحران) ينيس ويمبريس موسى، كذلك أيضا يقاوم هؤلاء الحق؛ أناس عقولهم فاسدة، وقد تبين أنهم غير أهل للإيمان."], [9, "ولكنهم لن يزدادوا تقدما، لأن حماقتهم ستنكشف للجميع، مثلما انكشفت حماقة الرجلين المذكورين."]]}, {"l": "1Pe 1:20", "n": "", "vs": [[20, "ومع أن الله كان قد عين المسيح لهذا الغرض قبل تأسيس العالم، فهو لم يعلنه إلا في هذا الزمن الأخير لفائدتكم"]]}, {"l": "2Pe 3:3", "n": "", "vs": [[3, "فاعلموا، قبل كل شيء أنه سيأتي في آخر الأيام أناس مستهزئون يسخرون بالحق، ويسلكون منجرفين وراء شهواتهم الخاصة."]]}, {"l": "Jud 1:4", "n": "", "vs": [[4, "لأنه قد تسلل إلى ما بينكم معلمون لابد أن يلاقوا الحكم بالعقاب الأبدي، كما هو مكتوب لهم منذ القديم. فهم أشرار لا يهابون الله ، يتخذون من نعمة إلهنا فرصة لإباحة الرذائل، وينكرون سيدنا وربنا الوحيد يسوع المسيح."]]}, {"l": "Jud 1:18", "n": "", "vs": [[18, "فقد سبق أن نبهوكم إلى أنه، في نهاية الزمان، سيطلع مستهزئون يعيشون منغمسين في شهواتهم الفاسقة."]]}], "kwAr": "في الأزمنة الأخيرة", "noteAr": ""}, {"kw": "depart", "raw": "Dan_11:35; Mat_24:5-12; 2Th_2:3; 2Ti_3:1-5, 2Ti_4:4", "note": "", "refs": [{"l": "Dan 11:35", "n": "", "vs": [[35, "ويعثر بعض الحكماء تمحيصا لهم وتنقية، حتى يأزف وقت النهاية في ميقات الله المعين."]]}, {"l": "Mat 24:5-12", "n": "", "vs": [[5, "فإن كثيرين سيأتون باسمي قائلين إني أنا هو المسيح، فيضللون كثيرين."], [6, "وسوف تسمعون بحروب وأخبار حروب. فإياكم أن ترتعبوا! فلابد أن يحدث هذا كله، ولكن ليست النهاية بعد."], [7, "فسوف تنقلب أمة على أمة، ومملكة على مملكة، وتحدث مجاعات وزلازل في عدة أماكن."], [8, "ولكن هذه كلها ليست إلا أول المخاض."], [9, "عندئذ يسلمكم الناس إلى العذاب، ويقتلونكم، وتكونون مكروهين لدى جميع الأمم من أجل اسمي؛"], [10, "فيرتد كثيرون ويسلمون بعضهم بعضا ويبغضون بعضهم بعضا،"], [11, "ويظهر كثيرون من الأنبياء الدجالين ويضللون كثيرين."], [12, "وإذ يعم الإثم، تبرد المحبة لدى الكثيرين."]]}, {"l": "2Th 2:3", "n": "", "vs": [[3, "لا تدعوا أحدا يخدعكم بأية وسيلة! فإن ذلك اليوم لا يأتي دون أن يسبقه انتشار العصيان وظهور الإنسان المتمرد، ابن الهلاك،"]]}, {"l": "2Ti 3:1-5", "n": "", "vs": [[1, "واعلم هذا الأمر: أن أزمنة صعبة ستعم في الأيام الأخيرة؛"], [2, "إذ يكون الناس محبين لأنفسهم، محبين للمال، متكبرين، مباهين بأنفسهم، شتامين، غير مطيعين لوالديهم، ناكرين للجميل، دنسين،"], [3, "متحجري العواطف، غير صفوحين، نمامين، جامحي الأهواء، شرسين غير محبين للصلاح،"], [4, "خائنين، وقحين، مدعين، محبين للذات أكثر من محبتهم لله،"], [5, "لهم من التقوى مظهرها ولكنهم لقوتها منكرون، فعن هؤلاء الناس ابتعد!"]]}, {"l": "2Ti 4:4", "n": "", "vs": [[4, "فيحولون آذانهم بعيدا عن الحق، منحرفين إلى الخرافات."]]}], "kwAr": "سوف يرتدون", "noteAr": ""}, {"kw": "seducing", "raw": "Gen_3:3-5, Gen_3:13; 1Ki_22:22, 1Ki_22:23; 2Ch_18:19-22; 2Co_11:3, 2Co_11:13-15; 2Th_2:9-12; 2Ti_3:13; 2Pe_2:1; Rev_9:2-11, Rev_13:14, Rev_16:14, Rev_18:2, Rev_18:23; Rev_19:20, Rev_20:2, Rev_20:3, Rev_20:8, Rev_20:10", "note": "", "refs": [{"l": "Gen 3:3-5", "n": "", "vs": [[3, "ماعدا ثمر الشجرة التي في وسطها، فقد قال الله : لا تأكلا منه ولا تلمساه لكي لا تموتا»."], [4, "فقالت الحية للمرأة: «لن تموتا،"], [5, "بل إن الله يعرف أنه حين تأكلان من ثمر هذه الشجرة تنفتح أعينكما فتصيران مثله، قادرين على التمييز بين الخير والشر»."]]}, {"l": "Gen 3:13", "n": "", "vs": [[13, "فسأل الرب الإله المرأة: «ماذا فعلت؟» فأجابت: «أغوتني الحية فأكلت»."]]}, {"l": "1Ki 22:22", "n": "", "vs": [[22, "فأجاب: أخرج، وأصبح روح ضلال في أفواه جميع أنبيائه. فقال الرب: إنك قادر على إغوائه وتفلح في ذلك، فامض ونفذ هذا الأمر."]]}, {"l": "1Ki 22:23", "n": "", "vs": [[23, "وها الرب قد جعل الآن روح ضلال في أفواه جميع أنبيائك هؤلاء، وقد قضى عليك بالشر»."]]}, {"l": "2Ch 18:19-22", "n": "", "vs": [[19, "فسأل الرب: من يغوي أخآب ليخرج إلى الحرب ويموت في راموت جلعاد؟ فأجاب كل منهم بشيء."], [20, "ثم برز روح ووقف أمام الرب وقال: أنا أغويه. فسأله الرب: بماذا؟"], [21, "فأجاب: أخرج وأصبح روح ضلال في أفواه جميع أنبيائه. فقال الرب: إنك قادر على إغوائه وتفلح في ذلك، فامض ونفذ الأمر."], [22, "وها الرب قد جعل الآن روح ضلال في أفواه جميع أنبيائك هؤلاء، وقد قضى عليك بالشر»."]]}, {"l": "2Co 11:3", "n": "", "vs": [[3, "غير أني أخشى أن تضلل عقولكم عن الإخلاص والطهارة تجاه المسيح مثلما أغوت الحية بمكرها حواء."]]}, {"l": "2Co 11:13-15", "n": "", "vs": [[13, "فإن أمثال هؤلاء هم رسل دجالون، عمال ماكرون، يظهرون أنفسهم بمظهر رسل المسيح."], [14, "ولا عجب! فالشيطان نفسه يظهر نفسه بمظهر ملاك نور."], [15, "فليس كثيرا إذن أن يظهر خدامه أنفسهم بمظهر خدام البر. وإن عاقبتهم ستكون على حسب أعمالهم."]]}, {"l": "2Th 2:9-12", "n": "", "vs": [[9, "أما بروز المتمرد، فسوف يكون بقدر طاقة الشيطان على المعجزات والعلامات والعجائب المزيفة كلها،"], [10, "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا."], [11, "ولهذا السبب، سيرسل الله إليهم طاقة الضلال حتى يصدقوا ما هو دجل،"], [12, "فتقع الدينونة على جميع الذين لم يؤمنوا بالحق بل سرهم الإثم."]]}, {"l": "2Ti 3:13", "n": "", "vs": [[13, "أما الناس الأشرار والدجالون المحتالون، فيتقدمون في الشر، مضللين الآخرين وهم أنفسهم مضللون!"]]}, {"l": "2Pe 2:1", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."]]}, {"l": "Rev 9:2-11", "n": "", "vs": [[2, "فلما فتحها اندفع الدخان كأنه من أتون عظيم، فأظلمت الشمس والجو من هذا الدخان."], [3, "وطلع من الدخان جراد على الأرض، وأعطي سلطة أن يلسع كالعقارب،"], [4, "وأمر ألا يضر عشب الأرض ولا مزروعاتها ولا أشجارها بل فقط جميع من ليس على جباههم ختم الله،"], [5, "فيعذبهم دون أن يقتلهم، مدة خمسة أشهر. والألم الذي يسببه يشبه ألم لدغة العقرب."], [6, "وفي أثناء تلك الشهور يحاول الناس أن يتخلصوا من حياتهم فلا يقدرون! ويتمنون أن يموتوا، لكن الموت يهرب منهم."], [7, "ويبدو هذا الجراد كأنه خيل مجهزة للقتال، على رؤوسه ما يشبه أكاليل الذهب، ووجوهه كوجوه البشر،"], [8, "وله شعر طويل كشعر النساء، وأسنانه كأسنان الأسود،"], [9, "وصدوره كدروع حديدية، وحفيف أجنحته كضجيج مركبات خيل تجري إلى القتال،"], [10, "وأذنابه ذات إبر كالعقارب. وله سلطة أن يؤذي البشر بأذنابه مدة خمسة أشهر."], [11, "أما ملكه فهو «ملاك الهاوية»، واسمه بالعبرية «أبدون»، وباليونانية «أبوليون»."]]}, {"l": "Rev 13:14", "n": "", "vs": [[14, "فخدع سكان الأرض بالآيات التي كان يقوم بها في حضور الوحش الأول. وأمر سكان الأرض أن يقيموا تمثالا للوحش الأول الذي كان قد جرح جرحا مميتا ولكنه عاش!"]]}, {"l": "Rev 16:14", "n": "", "vs": [[14, "وهي أرواح شيطانية قادرة على صنع المعجزات، تذهب إلى ملوك الأرض جميعا وتجمعهم للحرب في ذلك اليوم العظيم، يوم الله القادر على كل شيء."]]}, {"l": "Rev 18:2", "n": "", "vs": [[2, "وصاح بأعلى صوته: «سقطت، سقطت بابل العظمى، وصارت وكرا للشياطين ومأوى لكل روح نجس ولكل طائر نجس مكروه،"]]}, {"l": "Rev 18:23", "n": "", "vs": [[23, "ولن يضيء فيك نور مصباح. ولن يسمع فيك صوت عريس وعروس. فقد كان تجارك سادة الأرض، وبسحرك ضللت جميع الأمم."]]}, {"l": "Rev 19:20", "n": "", "vs": [[20, "فقبض على الوحش وعلى النبي الدجال الذي قام بالمعجزات في حضور الوحش وأضل بها الذين قبلوا علامة الوحش، وسجدوا لتمثاله. وطرح كلاهما حيا في بحيرة النار والكبريت المتقدة،"]]}, {"l": "Rev 20:2", "n": "", "vs": [[2, "قيد بها التنين، أي الحية القديمة، وهو إبليس أو الشيطان، وسجنه مدة ألف سنة،"]]}, {"l": "Rev 20:3", "n": "", "vs": [[3, "وطرحه في الهاوية وأغلقها عليه، وختمها، حتى يكف عن تضليل الأمم، إلى أن تنقضي الألف سنة. ولكن لابد من إطلاقه بعد ذلك لمدة قصيرة."]]}, {"l": "Rev 20:8", "n": "", "vs": [[8, "فيخرج ليضلل الأمم في زوايا الأرض الأربع، جوج وماجوج، ويجمعهم للقتال، وعددهم كثير جدا كرمل البحر!"]]}, {"l": "Rev 20:10", "n": "", "vs": [[10, "ثم يطرح إبليس الذي كان يضللهم، في بحيرة النار والكبريت، حيث الوحش والنبي الدجال. هناك سوف يعذبون نهارا وليلا، إلى أبد الآبدين."]]}], "kwAr": "أرواح مضللة", "noteAr": ""}, {"kw": "and doctrines", "raw": "Dan_11:35-38; 1Co_8:5, 1Co_8:6, 1Co_10:20; Col_2:18; Act_17:18; Rev_9:20 *Gr.", "note": "", "refs": [{"l": "Dan 11:35-38", "n": "", "vs": [[35, "ويعثر بعض الحكماء تمحيصا لهم وتنقية، حتى يأزف وقت النهاية في ميقات الله المعين."], [36, "ويصنع الملك ما يطيب له، ويتعظم على كل إله، ويجدف بالعظائم على إله الآلهة، ويفلح، إلى أن يحين اكتمال الغضب إذ لابد أن يتم ما قضى الله به."], [37, "ولن يبالي هذا الملك بآلهة آبائه ولا بمعبود النساء، ولا بأي وثن آخر إذ يتعظم على الكل."], [38, "إنما يكرم إله الحصون بدلا منهم، وهو إله لم يعرفه آباؤه، ويكرمه بالذهب والفضة والحجارة الكريمة والنفائس."]]}, {"l": "1Co 8:5", "n": "", "vs": [[5, "حتى لو كانت الآلهة المزعومة موجودة في السماء أو على الأرض وما أكثر تلك الآلهة والأرباب!"]]}, {"l": "1Co 8:6", "n": "", "vs": [[6, "فليس عندنا نحن إلا إله واحد هو الآب الذي منه كل شيء، ونحن له؛ ورب واحد هو يسوع المسيح الذي به كل شيء ونحن به."]]}, {"l": "1Co 10:20", "n": "", "vs": [[20, "لا، بل أن ما يذبحه الوثنيون فإنما يذبحونه للشياطين وليس لله. وإني لا أريد لكم أن تكونوا مشتركين مع الشياطين."]]}, {"l": "Col 2:18", "n": "", "vs": [[18, "لا يحرمكم أحد من جائزتكم، بحملكم على ما يرغب فيه من إظهار التواضع والتعبد للملائكة، داخلا في رؤى يتوهمها، وقد نفخه باطلا ذهنه الجسدي،"]]}, {"l": "Act 17:18", "n": "", "vs": [[18, "وجرت مناقشة بينه وبين بعض الفلاسفة الأبيقوريين والرواقيين. ولما وجدوا أنه يبشر بيسوع والقيامة من الموت قال بعضهم: «ماذا يعني هذا المدعي الأحمق بكلامه؟» وقال آخرون: «يبدو أنه ينادي بآلهة غريبة»."]]}, {"l": "Rev 9:20", "n": "*Gr.", "vs": [[20, "ولكن الناس الذين نجوا من هذه البلايا، لم يتوبوا عن أعمالهم، وظلوا يسجدون للشياطين وللأصنام التي صنعوها من الذهب والفضة والنحاس والحجر والخشب، مع أنها لا ترى ولا تسمع ولا تتحرك!"]]}], "kwAr": "وتعاليم شيطانية", "noteAr": ""}], "arS": [["إلا أن ", []], ["الروح", ["G4151"]], [" ", []], ["يعلن", ["G3004"]], [" ", []], ["صراحة", ["G4490"]], [" أن قوما في ", []], ["الأزمنة", ["G2540"]], [" ", []], ["الأخيرة", ["G5306"]], [" سوف ", []], ["يرتدون", ["G868"]], [" عن ", []], ["الإيمان", ["G4102"]], ["، ", []], ["منساقين", ["G4337"]], [" وراء ", []], ["أرواح", ["G4151"]], [" ", []], ["مضللة", ["G4108"]], [" ", []], ["وتعاليم", ["G1319"]], [" ", []], ["شيطانية", ["G1140"]], ["،", []]]}, {"c": 4, "v": 2, "text": "في موجة رياء ينشرها معلمون دجالون لهم ضمائر كويت بالنار.", "groups": [{"kw": "lies", "raw": "1Ki_13:18, 1Ki_22:22; Isa_9:15; Jer_5:21, Jer_23:14, Jer_23:32; Dan_8:23-25; Mat_7:15; Mat_24:24; Act_20:30; Rom_16:18; Eph_4:14; 2Ti_3:5; 2Pe_2:1-3; Rev_16:14", "note": "", "refs": [{"l": "1Ki 13:18", "n": "", "vs": [[18, "فقال له: «أنا أيضا نبي مثلك وقد أمرني ملاك الرب أن أرجع بك معي إلى بيتي فتقتات وتشرب ماء». وهكذا كذب عليه."]]}, {"l": "1Ki 22:22", "n": "", "vs": [[22, "فأجاب: أخرج، وأصبح روح ضلال في أفواه جميع أنبيائه. فقال الرب: إنك قادر على إغوائه وتفلح في ذلك، فامض ونفذ هذا الأمر."]]}, {"l": "Isa 9:15", "n": "", "vs": [[15, "إن الشيخ والوجيه هو الرأس، والنبي الذي يلقن الكذب هو الذنب"]]}, {"l": "Jer 5:21", "n": "", "vs": [[21, "اسمع هذا أيها الشعب الأحمق الغبي، يامن له عيون ولكنه لا يبصر، وله آذان ولكنه لا يسمع."]]}, {"l": "Jer 23:14", "n": "", "vs": [[14, "وفي أوساط أنبياء أورشليم رأيت أمورا مهولة: يرتكبون الفسق، ويسلكون في الأكاذيب، يشددون أيدي فاعلي الإثم لئلا يتوب أحد عن شره. صاروا جميعا كسكان سدوم وأصبح أهلها كأهل عمورة."]]}, {"l": "Jer 23:32", "n": "", "vs": [[32, "ها أنا أقاوم المتنبئين بأحلام كاذبة ويقصونها مضلين شعبي بأكاذيبهم واستخفافهم، مع أني لم أرسلهم ولم أكلفهم بشيء. ولا جدوى منهم لهذا الشعب."]]}, {"l": "Dan 8:23-25", "n": "", "vs": [[23, "وفي أواخر ملكهم عندما تبلغ المعاصي أقصى مداها، يقوم ملك فظ حاذق داهية،"], [24, "فيعظم شأنه، إنما ليس بفضل قوته. ويسبب دمارا رهيبا ويفلح في القضاء على الأقوياء، ويقهر شعب الله."], [25, "وبدهائه ومكره يحقق مآربه، ويتكبر في قلبه ويهلك الكثيرين وهم في طمأنينة، ويتمرد على رئيس الرؤساء لكنه يتحطم بغير يد الإنسان."]]}, {"l": "Mat 7:15", "n": "", "vs": [[15, "احذروا الأنبياء الدجالين الذين يأتون إليكم لابسين ثياب الحملان، ولكنهم من الداخل ذئاب خاطفة!"]]}, {"l": "Mat 24:24", "n": "", "vs": [[24, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات عظيمة وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Act 20:30", "n": "", "vs": [[30, "بل إن قوما منكم أنتم سيقومون ويعلمون تعاليم منحرفة، ليجروا التلاميذ وراءهم."]]}, {"l": "Rom 16:18", "n": "", "vs": [[18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."]]}, {"l": "Eph 4:14", "n": "", "vs": [[14, "وذلك حتى لا نكون فيما بعد أطفالا تتقاذفنا وتحملنا كل ريح تعليم يقوم على خداع الناس والمكر بهم لجرهم إلى الضلال الملفق،"]]}, {"l": "2Ti 3:5", "n": "", "vs": [[5, "لهم من التقوى مظهرها ولكنهم لقوتها منكرون، فعن هؤلاء الناس ابتعد!"]]}, {"l": "2Pe 2:1-3", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."], [2, "وكثيرون سيسيرون وراءهم في طرق الإباحية. وبسببهم توجه الإهانة إلى طريق الحق."], [3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "Rev 16:14", "n": "", "vs": [[14, "وهي أرواح شيطانية قادرة على صنع المعجزات، تذهب إلى ملوك الأرض جميعا وتجمعهم للحرب في ذلك اليوم العظيم، يوم الله القادر على كل شيء."]]}], "kwAr": "رياء", "noteAr": ""}, {"kw": "their", "raw": "Rom_1:28; Eph_4:19", "note": "", "refs": [{"l": "Rom 1:28", "n": "", "vs": [[28, "وبما أنهم لم يتخيروا إبقاء الله ضمن معرفتهم، أسلمهم الله إلى ذهن عاطل عن التمييز دفعهم إلى ممارسة الأمور غير اللائقة."]]}, {"l": "Eph 4:19", "n": "", "vs": [[19, "فهؤلاء، إذ طرحوا جانبا كل إحساس، استسلموا للإباحية ليرتكبوا كل نجاسة بشهوة نهمة لا ترتوي."]]}], "kwAr": "ضمائر كويت بالنار", "noteAr": ""}], "arS": [["في موجة ", []], ["رياء", ["G5272"]], [" ينشرها معلمون ", []], ["دجالون", ["G5573"]], [" لهم ", []], ["ضمائر", ["G4893"]], [" ", []], ["كويت بالنار", ["G2743"]], [".", []]]}, {"c": 4, "v": 3, "text": "يحرمون الزواج، ويأمرون بالامتناع عن أطعمة خلقها الله ليتناولها المؤمنون وعارفو الحق شاكرين.", "groups": [{"kw": "Forbidding", "raw": "Dan_11:37; 1Co_7:28, 1Co_7:36-39; Heb_13:4", "note": "", "refs": [{"l": "Dan 11:37", "n": "", "vs": [[37, "ولن يبالي هذا الملك بآلهة آبائه ولا بمعبود النساء، ولا بأي وثن آخر إذ يتعظم على الكل."]]}, {"l": "1Co 7:28", "n": "", "vs": [[28, "ولكن، إن تزوجت، فأنت لا تخطيء. وإن تزوجت العذراء، فهي لا تخطيء. ولكن أمثال هؤلاء يلاقون مشقات معيشية، وأنا إنما أريد حمايتكم منها."]]}, {"l": "1Co 7:36-39", "n": "", "vs": [[36, "ولكن، إن ظن أحد أنه يتصرف تصرفا غير لائق نحو عزوبيته إذا تجاوز السن، وأنه لابد من الزواج، فليفعل ما يشاء. إنه لا يخطيء. فليتزوج العزاب في هذه الحال."], [37, "وأما من عقد العزم في قلبه، ولم يكن مضطرا، بل كان كامل السيطرة على إرادته، واختار من تلقاء نفسه أن يحافظ على عزوبيته، فحسنا يفعل."], [38, "إذن، من تزوج فعل حسنا، ومن لا يتزوج يفعل أحسن."], [39, "إن الزوجة تظل تحت ارتباط مادام زوجها حيا. فإذا رقد زوجها، تصير حرة يحق لها أن تتزوج من أي رجل تريده، إنما في الرب فقط."]]}, {"l": "Heb 13:4", "n": "", "vs": [[4, "حافظوا جميعا على كرامة الزواج، مبعدين النجاسة عن الفراش. فإن الله سوف يعاقب الذين ينغمسون في خطايا الدعارة والزنى."]]}], "kwAr": "يحرمون الزواج", "noteAr": ""}, {"kw": "to abstain", "raw": "Rom_14:3, Rom_14:17; 1Co_8:8; Col_2:20-23; Heb_13:9", "note": "", "refs": [{"l": "Rom 14:3", "n": "", "vs": [[3, "فمن كان يأكل كل شيء، عليه ألا يحتقر من لا يأكل، ومن كان لا يأكل، عليه ألا يدين من يأكل، لأن الله قد قبله."]]}, {"l": "Rom 14:17", "n": "", "vs": [[17, "إذ ليس ملكوت الله بأكل وشرب، بل هو بر وسلام وفرح في الروح القدس."]]}, {"l": "1Co 8:8", "n": "", "vs": [[8, "إلا أن الطعام لا يقربنا إلى الله، فإننا إن أكلنا منه لا يعلو مقامنا، وإن لم نأكل منه لا يصغر شأننا!"]]}, {"l": "Col 2:20-23", "n": "", "vs": [[20, "فمادمتم قد متم مع المسيح بالنسبة لمباديء العالم، فلماذا، كما لو كنتم عائشين في العالم، تخضعون أنفسكم لفرائض مثل هذه:"], [21, "لا تمسك، لا تذق، لا تلمس"], [22, "وهذه أشياء تستهلك وتزول. فتلك الفرائض هي وصايا البشر وتعاليمهم."], [23, "لها مظاهر الحكمة لما فيها من إفراط في العبادة المصطنعة، وإذلال للذات، وقهر للجسد؛ أمور لا قيمة لها، وما هي إلا لإرضاء الميول البشرية."]]}, {"l": "Heb 13:9", "n": "", "vs": [[9, "فلا تنخدعوا وتتبعوا تلك التعاليم الغريبة المتنوعة ... فمن الأفضل أن يثبت القلب بالنعمة لا بنظم الأطعمة التي لم تنفع المتقيدين بها."]]}], "kwAr": "بالامتناع عن أطعمة", "noteAr": ""}, {"kw": "which", "raw": "Gen_1:29, Gen_1:30, Gen_9:3; Ecc_5:18; Act_10:13-15; 1Co_6:13", "note": "", "refs": [{"l": "Gen 1:29", "n": "", "vs": [[29, "ثم قال لهم: «إني قد أعطيتكم كل أصناف البقول المبزرة المنتشرة على كل سطح الأرض، وكل شجر مثمر مبزر، لتكون لكم طعاما."]]}, {"l": "Gen 1:30", "n": "", "vs": [[30, "أما العشب الأخضر فقد جعلته طعاما لكل من وحوش الأرض وطيور السماء والحيوانات الزاحفة، ولكل ما فيه نسمة حياة». وهكذا كان."]]}, {"l": "Gen 9:3", "n": "", "vs": [[3, "وليكن كل حي متحرك طعاما لكم، فتأكلون كل شيء كما تأكلون البقول الخضراء التي أعطيتكم."]]}, {"l": "Ecc 5:18", "n": "", "vs": [[18, "فتأمل ما وجدت: من الأفضل والأليق أن يأكل الإنسان ويشرب ويستمتع بما تكبده من عناء تحت الشمس طوال أيام حياته القليلة التي وهبها الله له، لأن هذا هو حظه."]]}, {"l": "Act 10:13-15", "n": "", "vs": [[13, "وناداه صوت: «يابطرس، قم اذبح وكل!»"], [14, "ولكن بطرس أجاب: «كلا يارب، فأنا لم آكل قط شيئا محرما أو نجسا»."], [15, "فقال له الصوت أيضا: «ما طهره الله لا تحسبه أنت نجسا!»"]]}, {"l": "1Co 6:13", "n": "", "vs": [[13, "الطعام للبطن، والبطن للطعام؛ ولكن الله سيبيد هذا وذاك. غير أن الجسد ليس للزنى، بل للرب؛ والرب للجسد."]]}], "kwAr": "خلقها الله", "noteAr": ""}, {"kw": "with", "raw": "1Ti_4:4; 1Sa_9:13; Mat_14:19, Mat_15:36; Luk_24:30; Joh_6:23; Act_27:35; Rom_14:6; 1Co_10:30,1Co_10:31; Col_3:17", "note": "", "refs": [{"l": "1Ti 4:4", "n": "", "vs": [[4, "فإن كل ما خلقه الله جيد، ولا شيء منه يرفض إذا تناوله الإنسان شاكرا؛"]]}, {"l": "1Sa 9:13", "n": "", "vs": [[13, "فإن دخلتما المدينة على التو، تلحقان به قبل صعوده إلى التل ليأكل، لأن الشعب لا يأكل من الذبيحة حتى يأتي ويباركها. بعد ذلك يتناول المدعوون منها. فأسرعا الآن خلفه إن شئتما اليوم لقاءه»."]]}, {"l": "Mat 14:19", "n": "", "vs": [[19, "وأمر الجموع أن يجلسوا على العشب. ثم أخذ الأرغفة الخمسة والسمكتين، ورفع نظره إلى السماء، وبارك وكسر الأرغفة، وأعطاها للتلاميذ، فوزعوها على الجموع."]]}, {"l": "Mat 15:36", "n": "", "vs": [[36, "ثم أخذ الأرغفة السبعة والسمكات، وشكر وكسر، وأعطى التلاميذ، فوزعوها على الجموع."]]}, {"l": "Luk 24:30", "n": "", "vs": [[30, "ولما اتكأ معهما، أخذ الخبز، وبارك، وكسر، وأعطاهما."]]}, {"l": "Joh 6:23", "n": "", "vs": [[23, "ثم جاءت قوارب أخرى من طبرية، ورست بالقرب من المكان الذي أكلوا فيه الخبز بعدما شكر الرب عليه."]]}, {"l": "Act 27:35", "n": "", "vs": [[35, "ثم أخذ رغيفا، وشكر الله أمام الجميع، وكسره وابتدأ يأكل،"]]}, {"l": "Rom 14:6", "n": "", "vs": [[6, "إن من يراعي يوما معينا، يراعيه لأجل الرب؛ ومن يأكل كل شيء، يأكل لأجل الرب، لأنه يؤدي الشكر لله؛ ومن لا يأكل، لا يأكل لأجل الرب، لأنه يؤدي الشكر لله."]]}, {"l": "1Co 10:30", "n": "", "vs": [[30, "ومادمت أتناول شيئا وأشكر عليه، فلماذا يقال في سوء لأجل ما أشكر عليه؟"]]}, {"l": "1Co 10:31", "n": "", "vs": [[31, "فإذا أكلتم أو شربتم أو مهما فعلتم، فافعلوا كل شيء لتمجيد الله."]]}, {"l": "Col 3:17", "n": "", "vs": [[17, "ومهما كان ما تعملونه، بالقول أو بالفعل، فليجر كل شيء باسم الرب يسوع، رافعين به الشكر لله الآب."]]}], "kwAr": "شاكرين", "noteAr": ""}, {"kw": "believe", "raw": "1Ti_2:4; Joh_8:31, Joh_8:32; 2Th_2:13, 2Th_2:14", "note": "", "refs": [{"l": "1Ti 2:4", "n": "", "vs": [[4, "فهو يريد لجميع الناس أن يخلصوا، ويقبلوا إلى معرفة الحق بالتمام:"]]}, {"l": "Joh 8:31", "n": "", "vs": [[31, "فقال لليهود الذين آمنوا به: «إن ثبتم في كلمتي، كنتم حقا تلاميذي."]]}, {"l": "Joh 8:32", "n": "", "vs": [[32, "وتعرفون الحق، والحق يحرركم»."]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "2Th 2:14", "n": "", "vs": [[14, "فإلى هذا الأمر قد دعاكم ببشارتنا لكم، لنوال مجد ربنا يسوع المسيح."]]}], "kwAr": "المؤمنون وعارفو الحق", "noteAr": ""}], "arS": [["يحرمون", ["G2967"]], [" ", []], ["الزواج", ["G1060"]], ["، ويأمرون ", []], ["بالامتناع", ["G567"]], [" عن ", []], ["أطعمة", ["G1033"]], [" ", []], ["خلقها", ["G2936"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["ليتناولها", ["G3336"]], [" ", []], ["المؤمنون", ["G4103"]], [" ", []], ["وعارفو", ["G1921"]], [" ", []], ["الحق", ["G225"]], [" ", []], ["شاكرين", ["G2169"]], [".", []]]}, {"c": 4, "v": 4, "text": "فإن كل ما خلقه الله جيد، ولا شيء منه يرفض إذا تناوله الإنسان شاكرا؛", "groups": [{"kw": "every", "raw": "Gen_1:31; Deu_32:4", "note": "", "refs": [{"l": "Gen 1:31", "n": "", "vs": [[31, "ورأى الله ما خلقه فاستحسنه جدا. ثم جاء مساء أعقبه صباح فكان اليوم السادس."]]}, {"l": "Deu 32:4", "n": "", "vs": [[4, "هو الصخر، وصنائعه كلها كاملة، سبله جميعها عدل. هو إله أمانة لا يرتكب جورا، صديق وعادل هو."]]}], "kwAr": "كل ما خلقه الله جيد", "noteAr": ""}, {"kw": "and", "raw": "Act_11:7-9, Act_15:20,Act_15:21, Act_15:29, Act_21:25; Rom_14:14, Rom_14:20; 1Co_10:23, 1Co_10:25", "note": "", "refs": [{"l": "Act 11:7-9", "n": "", "vs": [[7, "وسمعت صوتا يقول لي: يابطرس، قم اذبح وكل!"], [8, "فأجبت: كلا يارب، فلم يدخل فمي قط شيء محرم أو نجس."], [9, "فقال لي الصوت السماوي أيضا: ما طهره الله لا تحسبه أنت نجسا."]]}, {"l": "Act 15:20", "n": "", "vs": [[20, "بل نكتب إليهم رسالة نوصيهم فيها بأن يمتنعوا عن الأكل من الذبائح النجسة المقربة للأصنام، وعن ارتكاب الزنى، وعن تناول لحوم الحيوانات المخنوقة، وعن الدم."]]}, {"l": "Act 15:21", "n": "", "vs": [[21, "فإن لموسى، منذ القدم، أتباعا في كل مدينة، يقرأون شريعته ويبشرون بها في المجامع كل سبت»."]]}, {"l": "Act 15:29", "n": "", "vs": [[29, "إنما عليكم أن تمتنعوا عن الأكل من الذبائح المقربة للأصنام، وعن تناول الدم ولحوم الحيوانات المخنوقة، وعن ارتكاب الزنى. وتحسنون عملا إن حفظتم أنفسكم من هذه الأمور. عافاكم الله !»"]]}, {"l": "Act 21:25", "n": "", "vs": [[25, "أما المؤمنون الذين من غير اليهود، فقد أرسلنا إليهم رسالة نوصيهم فيها بأن يمتنعوا عن الأكل من الذبائح المقربة للأصنام، وعن تناول الدم، وعن الأكل من لحوم الحيوانات المخنوقة، وعن الزنى»."]]}, {"l": "Rom 14:14", "n": "", "vs": [[14, "فأنا عالم، بل مقتنع من الرب يسوع، أنه لا شيء نجس في ذاته. أما إن اعتبر أحد شيئا ما نجسا، فهو نجس في نظره."]]}, {"l": "Rom 14:20", "n": "", "vs": [[20, "لا تدمر عمل الله بسبب الطعام! حقا إن الأطعمة كلها طاهرة، ولكن الشر في أن يأكل الإنسان شيئا يسبب العثرة."]]}, {"l": "1Co 10:23", "n": "", "vs": [[23, "كل شيء حلال، ولكن ليس كل شيء ينفع. كل شيء حلال، ولكن ليس كل شيء يبني."]]}, {"l": "1Co 10:25", "n": "", "vs": [[25, "فكل ما يباع في الملحمة، لكم أن تأكلوا منه، دونما استفهام لإرضاء الضمير."]]}], "kwAr": "ولا شيء منه يرفض", "noteAr": ""}], "arS": [["فإن ", []], ["كل", ["G3956"]], [" ما ", []], ["خلقه", ["G2938"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["جيد", ["G2570"]], ["، ولا ", []], ["شيء", ["G3762"]], [" منه ", []], ["يرفض", ["G579"]], [" إذا ", []], ["تناوله", ["G2983"]], [" الإنسان ", []], ["شاكرا", ["G2169"]], ["؛", []]]}, {"c": 4, "v": 5, "text": "لأنه يصير مقدسا بكلمة الله والصلاة.", "groups": [{"kw": "it", "raw": "1Ti_4:3; Luk_11:41; 1Co_7:14; Tit_1:15", "note": "", "refs": [{"l": "1Ti 4:3", "n": "", "vs": [[3, "يحرمون الزواج، ويأمرون بالامتناع عن أطعمة خلقها الله ليتناولها المؤمنون وعارفو الحق شاكرين."]]}, {"l": "Luk 11:41", "n": "", "vs": [[41, "أحرى بكم أن تتصدقوا بما عندكم، فإذا كل شيء يكون طاهرا لكم."]]}, {"l": "1Co 7:14", "n": "", "vs": [[14, "ذلك لأن الزوج غير المؤمن قد تقدس في زوجته، والزوجة غير المؤمنة قد تقدست في زوجها. وإلا كان الأولاد في مثل هذا الزواج نجسين، والحال أنهم مقدسون."]]}, {"l": "Tit 1:15", "n": "", "vs": [[15, "عند الطاهرين، كل شيء طاهر. أما عند النجسين وغير المؤمنين، فما من شيء طاهر، بل إن عقولهم وضمائرهم أيضا قد صارت نجسة."]]}], "kwAr": "لأنه يصير مقدسا", "noteAr": ""}, {"kw": "the", "raw": "Luk_4:4", "note": "", "refs": [{"l": "Luk 4:4", "n": "", "vs": [[4, "فرد عليه يسوع قائلا: «قد كتب: ليس بالخبز وحده يحيا الإنسان، بل بكل كلمة من الله!»"]]}], "kwAr": "بكلمة الله والصلاة", "noteAr": ""}], "arS": [["لأنه يصير ", []], ["مقدسا", ["G37"]], [" ", []], ["بكلمة", ["G3056"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["والصلاة", ["G1783"]], [".", []]]}, {"c": 4, "v": 6, "text": "إن بسطت هذه الأمور أمام الإخوة، كنت خادما صالحا للمسيح يسوع، متغذيا بكلام الإيمان والتعليم الصالح الذي اتبعته تماما.", "groups": [{"kw": "thou put", "raw": "Act_20:31, Act_20:35; Rom_15:15; 1Co_4:17; 2Ti_1:6, 2Ti_2:14; 2Pe_1:12-15, 2Pe_3:1, 2Pe_3:2; Jud_1:5", "note": "", "refs": [{"l": "Act 20:31", "n": "", "vs": [[31, "لذلك كونوا متيقظين، وتذكروا أني، مدة ثلاث سنين، لم أتوقف ليلا ونهارا عن نصح كل واحد منكم وأنا أذرف الدموع."]]}, {"l": "Act 20:35", "n": "", "vs": [[35, "وقد أظهرت لكم بوضوح كيف يجب أن نبذل الجهد لنساعد المحتاجين، متذكرين كلمات الرب يسوع، إذ قال: الغبطة في العطاء أكثر مما في الأخذ!»"]]}, {"l": "Rom 15:15", "n": "", "vs": [[15, "على أني كتبت إليكم بأوفر جرأة في بعض الأمور، مذكرا لكم، وذلك بالنعمة التي وهبها الله لي."]]}, {"l": "1Co 4:17", "n": "", "vs": [[17, "لهذا السبب عينه أرسلت إليكم تيموثاوس، ابني الحبيب الأمين في الرب، فهو يذكركم بطرقي في السلوك في المسيح كما أعلم بها في كل مكان في جميع الكنائس."]]}, {"l": "2Ti 1:6", "n": "", "vs": [[6, "لهذا السبب أنبهك أن تلهب نار موهبة الله التي فيك بوضع يدي عليك."]]}, {"l": "2Ti 2:14", "n": "", "vs": [[14, "بهذه الأمور ذكر، شاهدا في حضرة الله أن لا تنشأ المجادلات الكلامية، وهي لا تنفع شيئا، غير تخريب سامعيها."]]}, {"l": "2Pe 1:12-15", "n": "", "vs": [[12, "لذلك أنوي أن أذكركم دائما بهذه الأمور، وإن كنتم عالمين بها، وراسخين في الحق الذي عندكم."], [13, "فمادمت في خيمة جسمي هذه، أرى من واجبي أن أنبهكم مذكرا."], [14, "فأنا أعلم أن خيمتي ستطوى بعد وقت قصير، كما سبق أن أعلن لي ربنا يسوع المسيح."], [15, "ولهذا، أجتهد الآن في تذكيركم بهذه الأمور، حتى تستطيعوا أن تتذكروها دائما بعد رحيلي."]]}, {"l": "2Pe 3:1", "n": "", "vs": [[1, "أيها الأحباء، أنا الآن أكتب إليكم رسالتي الثانية. وفي كلتا الرسالتين، أقصد أن أنبه أذهانكم الصافية، مذكرا إياكم بحقائق تعرفونها."]]}, {"l": "2Pe 3:2", "n": "", "vs": [[2, "وغايتي أن تتذكروا الأقوال التي أعلنها الأنبيا ء القديسون قديما، وكذلك وصية الرب والمخلص، تلك الوصية التي نقلها إليكم الرسل."]]}, {"l": "Jud 1:5", "n": "", "vs": [[5, "فالآن، أريد أن أذكركم بأمور تعرفونها. فأنتم تعرفون أن الرب، بعدما أنقذ الشعب من مصر، عاد فأهلك الذين لم يؤمنوا من ذلك الشعب."]]}], "kwAr": "إن بسطت هذه الأمور", "noteAr": ""}, {"kw": "a good", "raw": "Mat_13:52; 1Co_4:1, 1Co_4:2; 2Co_3:6, 2Co_6:4; Eph_6:21; Col_4:7; 1Th_3:2; 2Ti_2:15", "note": "", "refs": [{"l": "Mat 13:52", "n": "", "vs": [[52, "فقال: «ولهذا السبب، فأي واحد من الكتبة يصير تلميذا لملكوت السماوات، يشبه بإنسان رب بيت يطلع من كنزه ما هو جديد وما هو عتيق! »"]]}, {"l": "1Co 4:1", "n": "", "vs": [[1, "فلينظر إلينا الناس باعتبارنا خداما للمسيح ووكلاء على أسرار الله."]]}, {"l": "1Co 4:2", "n": "", "vs": [[2, "والمطلوب من الوكلاء، قبل كل شيء، أن يوجد كل منهم أمينا."]]}, {"l": "2Co 3:6", "n": "", "vs": [[6, "الذي جعلنا أصحاب كفاءة لنكون خداما لعهد جديد قائم لا على الحرف بل على الروح. فالحرف يؤدي إلى الموت؛ أما الروح فيعطي الحياة."]]}, {"l": "2Co 6:4", "n": "", "vs": [[4, "وإنما نتصرف في كل شيء بما يبين أننا فعلا خدام الله: في تحمل الكثير؛ في الشدائد والحاجات والضيقات والجلدات"]]}, {"l": "Eph 6:21", "n": "", "vs": [[21, "ولكي تعرفوا أحوالي وأخبار عملي، فإن تيخيكس، الأخ الحبيب والخادم الأمين في الرب، يخبركم بها جميعا."]]}, {"l": "Col 4:7", "n": "", "vs": [[7, "أما أحوالي كلها، فسيخبركم بها تيخيكس، الأخ الحبيب والخادم الأمين ورفيقنا العبد في الرب،"]]}, {"l": "1Th 3:2", "n": "", "vs": [[2, "فبعثنا تيموثاوس، أخانا ومعاوننا في خدمة الله بنشر الإنجيل، لكي يشددكم ويشجعكم في إيمانكم،"]]}, {"l": "2Ti 2:15", "n": "", "vs": [[15, "اجتهد أن تقدم نفسك لله فائزا في الامتحان، عاملا ليس عليه ما يدعو للخجل، مفصلا كلمة الحق باستقامة."]]}], "kwAr": "خادما صالحا", "noteAr": ""}, {"kw": "nourished", "raw": "Jer_15:16; Eph_4:15, Eph_4:16; Col_2:19, Col_3:16; 2Ti_3:14-17; 1Pe_2:2", "note": "", "refs": [{"l": "Jer 15:16", "n": "", "vs": [[16, "حالما بلغتني كلماتك أكلتها فأصبحت لي بهجة ومسرة لقلبي، لأني دعيت باسمك أيها الرب الإله القدير."]]}, {"l": "Eph 4:15", "n": "", "vs": [[15, "بل نتمسك بالحق في المحبة، فننمو في كل شيء نحو من هو الرأس، أي المسيح."]]}, {"l": "Eph 4:16", "n": "", "vs": [[16, "فمنه يستمد الجسد كله تماسكه وترابطه بمساندة كل مفصل وفقا لمقدار العمل المخصص لكل جزء، لينشيء نموا يؤول إلى بنيان الجسد بنيانا ذاتيا في المحبة."]]}, {"l": "Col 2:19", "n": "", "vs": [[19, "وهو غير ممسك بالرأس الذي منه يتلقى الجسد كله غذاءه وتماسكه بالمفاصل والأوصال، فينمو النمو الذي يمنحه الله ."]]}, {"l": "Col 3:16", "n": "", "vs": [[16, "لتسكن كلمة المسيح في داخلكم بغنى، في كل حكمة، معلمين وواعظين بعضكم بعضا، مرنمين بمزامير وتسابيح وأناشيد روحية في قلوبكم لله، رافعين له الحمد."]]}, {"l": "2Ti 3:14-17", "n": "", "vs": [[14, "إنما أنت فاثبت على ما تعلمته وتيقنته بالتمام، إذ تعرف على يد من تعلمت ذلك."], [15, "وتعلم أنك منذ حداثة سنك تعرف الكتب المقدسة، وهي القادرة أن تجعلك حكيما لبلوغ الخلاص عن طريق الإيمان في المسيح يسوع."], [16, "إن الكتاب بكل ما فيه، قد أوحى به الله؛ وهو مفيد للتعليم والتوبيخ والتقويم وتهذيب الإنسان في البر،"], [17, "لكي يجعل إنسان الله مؤهلا تأهيلا كاملا، ومجهزا لكل عمل صالح."]]}, {"l": "1Pe 2:2", "n": "", "vs": [[2, "وكأطفال مولودين حديثا، تشوقوا إلى اللبن الروحي النقي لكي تنموا به إلى أن تبلغوا الخلاص،"]]}], "kwAr": "متغذيا بكلام الإيمان", "noteAr": ""}, {"kw": "good doctrine", "raw": "1Ti_1:10, 1Ti_4:16, 1Ti_6:3; Psa_19:7 *marg. Pro_4:2; Joh_7:16, Joh_7:17; 2Ti_4:3; Tit_2:1, Tit_2:7-10; 2Jo_1:9", "note": "", "refs": [{"l": "1Ti 1:10", "n": "", "vs": [[10, "والزناة ومضاجعي الذكور، وخطافي الناس والكذابين وشاهدي الزور. وذوي كل شر آخر يخالف التعليم الصحيح"]]}, {"l": "1Ti 4:16", "n": "", "vs": [[16, "انتبه جيدا لنفسك وللتعليم. فإنك إذ تواظب على ذلك، تنقذ نفسك وسامعيك أيضا."]]}, {"l": "1Ti 6:3", "n": "", "vs": [[3, "أما إذا كان أحد يعلم ما يخالفها ولا يذعن للكلام الصحيح، كلام ربنا يسوع المسيح، وللتعليم الموافق للتقوى،"]]}, {"l": "Psa 19:7", "n": "*marg.", "vs": [[7, "شريعة الرب كاملة تنعش النفس. شهادة الرب صادقة تجعل الجاهل حكيما."]]}, {"l": "Pro 4:2", "n": "", "vs": [[2, "فإني أقدم لكم تعليما صالحا، فلا تهملوا شريعتي."]]}, {"l": "Joh 7:16", "n": "", "vs": [[16, "فأجابهم يسوع: «ليس تعليمي من عندي، بل من عند الذي أرسلني"]]}, {"l": "Joh 7:17", "n": "", "vs": [[17, "ومن أراد أن يعمل مشيئة الله يعرف ما إذا كان تعليمي من عند الله، أو أنني أتكلم من عندي."]]}, {"l": "2Ti 4:3", "n": "", "vs": [[3, "فإنه سيأتي زمان لا يطيق الناس فيه التعليم الصحيح، بل تبعا لشهواتهم الخاصة يكدسون لأنفسهم معلمين (يقولون لهم كلاما) يداعب الآذان."]]}, {"l": "Tit 2:1", "n": "", "vs": [[1, "أما أنت، فعلم بما يوافق التعليم الصحيح:"]]}, {"l": "Tit 2:7-10", "n": "", "vs": [[7, "جاعلا من نفسك في كل شيء قدوة للأعمال الصالحة، مظهرا في تعليمك النقاوة والوقار"], [8, "والكلمة الصحيحة التي لا تلام، لكي يخجل المقاوم حين لا يجد أمرا سيئا يقوله فينا."], [9, "وعلم العبيد أن يكونوا خاضعين لسادتهم، مرضين لهم في كل شيء؛ غير معاندين؛"], [10, "ولا سارقين، بل مظهرين أمانة كلية صالحة، لكي يزينوا في كل شيء تعليم مخلصنا الله."]]}, {"l": "2Jo 1:9", "n": "", "vs": [[9, "لأن من تعدى تعليم المسيح ولم يثبت فيه، فليس الله من نصيبه. أما من يثبت في هذا التعليم، فله الآب والابن معا."]]}], "kwAr": "والتعليم الصالح", "noteAr": ""}, {"kw": "thou hast", "raw": "Phi_3:16; 2Ti_3:14", "note": "", "refs": [{"l": "Phi 3:16", "n": "", "vs": [[16, "إنما، لنواصل السير من حيث قد وصلنا، في المنهج نفسه."]]}, {"l": "2Ti 3:14", "n": "", "vs": [[14, "إنما أنت فاثبت على ما تعلمته وتيقنته بالتمام، إذ تعرف على يد من تعلمت ذلك."]]}], "kwAr": "الذي اتبعته تماما", "noteAr": ""}], "arS": [["إن ", []], ["بسطت", ["G5294"]], [" هذه ", []], ["الأمور", ["G5023"]], [" أمام ", []], ["الإخوة", ["G80"]], ["، كنت ", []], ["خادما", ["G1249"]], [" ", []], ["صالحا", ["G2570"]], [" ", []], ["للمسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], ["، ", []], ["متغذيا", ["G1789"]], [" ", []], ["بكلام", ["G3056"]], [" ", []], ["الإيمان", ["G4102"]], [" ", []], ["والتعليم", ["G1319"]], [" ", []], ["الصالح", ["G2570"]], [" الذي ", []], ["اتبعته تماما", ["G3877"]], [".", []]]}, {"c": 4, "v": 7, "text": "أما أساطير العجائز المبتذلة، فتجنبها. إنما مرن نفسك في طريق التقوى.", "groups": [{"kw": "refuse", "raw": "1Ti_1:4, 1Ti_6:20; 2Ti_2:16, 2Ti_2:23, 2Ti_4:4; Tit_1:14, Tit_3:9", "note": "", "refs": [{"l": "1Ti 1:4", "n": "", "vs": [[4, "وتوصي المؤمنين ألا ينشغلوا بالأساطير وسلاسل النسب المتشابكة. فتلك الأمور تثير المجادلات ولا تعمل على تقدم تدبير الله القائم على الإيمان."]]}, {"l": "1Ti 6:20", "n": "", "vs": [[20, "ياتيموثاوس، حافظ على الأمانة المودعة لديك. تجنب الكلام الدنس الباطل، ومناقضات ما يسمى زورا «معرفة»."]]}, {"l": "2Ti 2:16", "n": "", "vs": [[16, "أما الأحاديث الباطلة الدنسة، فتجنبها؛ فإن المنصرفين إليها يتقدمون إلى فجور أفظع،"]]}, {"l": "2Ti 2:23", "n": "", "vs": [[23, "أما المجادلات الغبية الحمقاء، فتجنبها، عالما أنها تولد المشاجرات."]]}, {"l": "2Ti 4:4", "n": "", "vs": [[4, "فيحولون آذانهم بعيدا عن الحق، منحرفين إلى الخرافات."]]}, {"l": "Tit 1:14", "n": "", "vs": [[14, "لا يديرون عقولهم إلى خرافات يهودية ووصايا أناس تحولوا عن الحق بعيدا."]]}, {"l": "Tit 3:9", "n": "", "vs": [[9, "أما المسائل السخيفة، وسلاسل النسب، والمخاصمات، والمنازعات حول الشريعة، فتجنبها، لأنها غير نافعة، وباطلة."]]}], "kwAr": "فتجنبها", "noteAr": ""}, {"kw": "exercise", "raw": "1Ti_1:4, 1Ti_2:10, 1Ti_3:16, 1Ti_6:11; Act_24:16; 2Ti_3:12; Tit_2:12; Heb_5:14; 2Pe_1:5-8", "note": "", "refs": [{"l": "1Ti 1:4", "n": "", "vs": [[4, "وتوصي المؤمنين ألا ينشغلوا بالأساطير وسلاسل النسب المتشابكة. فتلك الأمور تثير المجادلات ولا تعمل على تقدم تدبير الله القائم على الإيمان."]]}, {"l": "1Ti 2:10", "n": "", "vs": [[10, "بل بما يليق بنساء يعترفن علنا بأنهن يعشن في تقوى الله، بالأعمال الصالحة!"]]}, {"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}, {"l": "1Ti 6:11", "n": "", "vs": [[11, "وأما أنت، ياإنسان الله، فاهرب من هذه الأمور، واسع في إثر البر والتقوى والإيمان والمحبة والصبر والوداعة."]]}, {"l": "Act 24:16", "n": "", "vs": [[16, "لذلك أنا أيضا أدرب نفسي لكي أحيا دائما بضمير نقي أمام الله والناس."]]}, {"l": "2Ti 3:12", "n": "", "vs": [[12, "وحقا، إن جميع الذين يعزمون أن يعيشوا عيشة التقوى في المسيح يسوع يضطهدون."]]}, {"l": "Tit 2:12", "n": "", "vs": [[12, "وهي تعلمنا أن نقطع علاقتنا بالإباحية والشهوات العالمية، وأن نحيا في العصر الحاضر حياة التعقل والبر والتقوى،"]]}, {"l": "Heb 5:14", "n": "", "vs": [[14, "أما الناضجون روحيا، فهم قادرون على تناول الطعام القوي: لأن حواسهم قد تدربت، بالممارسة الصحيحة، على التمييز بين الخير والشر."]]}, {"l": "2Pe 1:5-8", "n": "", "vs": [[5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"], [6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"], [7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."], [8, "فحين تكون هذه الصفات الطيبة في داخلكم، وتزداد بوفرة، تجعلكم مجتهدين ومثمرين في معرفتكم لربنا يسوع المسيح."]]}], "kwAr": "مرن نفسك", "noteAr": ""}], "arS": [["أما ", []], ["أساطير", ["G3454"]], [" ", []], ["العجائز", ["G1126"]], [" ", []], ["المبتذلة", ["G952"]], ["، ", []], ["فتجنبها", ["G3868"]], [". إنما ", []], ["مرن", ["G1128"]], [" ", []], ["نفسك", ["G4572"]], [" في طريق ", []], ["التقوى", ["G2150"]], [".", []]]}, {"c": 4, "v": 8, "text": "فالرياضة البدنية نافعة بعض الشيء. أما التقوى فنافعة لكل شيء، لأن فيها وعدا بالحياة الحاضرة والآتية.", "groups": [{"kw": "bodily", "raw": "1Sa_15:22; Psa_50:7-15; Isa_1:11-16, Isa_58:3-5; Jer_6:20; Amo_5:21-24; 1Co_8:8; Col_2:21-23; Heb_13:9", "note": "", "refs": [{"l": "1Sa 15:22", "n": "", "vs": [[22, "فقال صموئيل: «هل يسر الرب بالذبائح والمحرقات كسروره بالاستماع إلى صوته؟ إن الاستماع أفضل من الذبيحة، والإصغاء أفضل من شحم الكباش."]]}, {"l": "Psa 50:7-15", "n": "", "vs": [[7, "اسمع ياشعبي فأتكلم. ياإسرائيل إني أشهد عليك: «أنا الله إلهك."], [8, "لست أوبخك على ذبائحك فإن محرقاتك هي دائما قدامي."], [9, "فما كنت لآخذ من بيتك ثورا ولا من حظائرك تيسا."], [10, "لأن جميع حيوانات الغابة ملكي، وكذلك البهائم المنتشرة على ألوف الجبال."], [11, "أنا عالم بجميع طيور الجبال، وكل مخلوقات البراري هي لي."], [12, "إن جعت لا ألتمس منك حاجتي لأن لي المسكونة وكل ما فيها."], [13, "هل آكل لحم الثيران، أو أشرب دم التيوس؟"], [14, "قدم لله ذبائح الحمد وأوف العلي عهودك."], [15, "ادعني في يوم ضيقك أنقذك فتمجدني»."]]}, {"l": "Isa 1:11-16", "n": "", "vs": [[11, "ماذا تجديني كثرة ذبائحكم، يقول الرب؟ اتخمت من محرقات كباش وشحم المسمنات، ولا أسر بدم عجول وخرفان وتيوس."], [12, "حين جئتم لتمثلوا أمامي، من طلب منكم أن تدوسوا دوري؟"], [13, "كفوا عن تقديم قرابين باطلة، فالبخور رجس لي، وكذلك رأس الشهر والسبت والدعاء إلى المحفل، فأنا لا أطيق الاعتكاف مع ارتكاب الإثم."], [14, "لشد ما تبغض نفسي احتفالات رؤوس شهوركم ومواسم أعيادكم! صارت علي عبئا، وسئمت حملها."], [15, "عندما تبسطون نحوي أيديكم أحجب وجهي عنكم، وإن أكثرتم الصلاة لا أستجيب، لأن أيديكم مملوءة دما."], [16, "اغتسلوا، تطهروا، أزيلوا شر أعمالكم من أمام عيني. كفوا عن اقتراف الإثم،"]]}, {"l": "Isa 58:3-5", "n": "", "vs": [[3, "ويسألون: ما بالنا صمنا وأنت لم تلاحظ، وتذللنا ولم تحفل بذلك؟. إنكم في يوم صومكم تلتمسون مسرة أنفسكم وتسخرون جميع عمالكم."], [4, "وها أنتم تصومون لكي تتخاصموا وتتشاجروا فقط، وتتضاربوا بكلمات أثيمة. إن مثل صومكم اليوم لا يجعل أصواتكم مسموعة في العلاء."], [5, "أيكون الصوم الذي أختاره في إذلال المرء نفسه يوما، أو في إحناء رأسه كالقصبة، أو افتراش المسح والرماد؟ أتدعو هذا صوما مقبولا لدى الرب؟"]]}, {"l": "Jer 6:20", "n": "", "vs": [[20, "لأي غرض يصعد إلي البخور من شبا، وقصب الذريرة من أرض نائية؟ محرقاتكم مرفوضة، وتقدماتكم لا تسرني»."]]}, {"l": "Amo 5:21-24", "n": "", "vs": [[21, "إني أمقت أعيادكم وأحتقرها، ولا أسر باحتفالاتكم."], [22, "ومع أنكم تقربون لي ذبائح محرقاتكم وتقدماتكم من الدقيق، فإني لا أقبلها ولا ألتفت إلى ذبائح السلام من مسمنات مواشيكم."], [23, "أبعدوا عني جلبة أغانيكم لأني لن أصغي إلى نغمات رباباتكم."], [24, "إنما ليجر الحق متدفقا كالمياه والعدل كنهر سيال."]]}, {"l": "1Co 8:8", "n": "", "vs": [[8, "إلا أن الطعام لا يقربنا إلى الله، فإننا إن أكلنا منه لا يعلو مقامنا، وإن لم نأكل منه لا يصغر شأننا!"]]}, {"l": "Col 2:21-23", "n": "", "vs": [[21, "لا تمسك، لا تذق، لا تلمس"], [22, "وهذه أشياء تستهلك وتزول. فتلك الفرائض هي وصايا البشر وتعاليمهم."], [23, "لها مظاهر الحكمة لما فيها من إفراط في العبادة المصطنعة، وإذلال للذات، وقهر للجسد؛ أمور لا قيمة لها، وما هي إلا لإرضاء الميول البشرية."]]}, {"l": "Heb 13:9", "n": "", "vs": [[9, "فلا تنخدعوا وتتبعوا تلك التعاليم الغريبة المتنوعة ... فمن الأفضل أن يثبت القلب بالنعمة لا بنظم الأطعمة التي لم تنفع المتقيدين بها."]]}], "kwAr": "فالرياضة البدنية", "noteAr": ""}, {"kw": "little", "raw": "or, for a little time, Heb_9:9, Heb_9:10", "note": "or, for a little time, Heb_9:9, Heb_9:10", "refs": [{"l": "Heb 9:9", "n": "", "vs": [[9, "وما هذا إلا صورة للوقت الحاضر الذي فيه مازالت التقدمات والذبائح تقرب وفقا لنظام العهد العتيق. ولكنها لا تستطيع أن تطهر قلوب الذين يتقربون بها إلى الله، ولا أن توصلهم إلى الكمال فتريح ضمائرهم."]]}, {"l": "Heb 9:10", "n": "", "vs": [[10, "إذ إن نظام العهد السابق قد اقتصر على تحريم بعض المأكولات والمشروبات وتحليل غيرها، وعلى وضع النظم المختصة بطقوس الاغتسال المختلفة. بل إن كل ما ضمه ذلك النظام، كان قوانين جسدية ينتهي عملها حين يأتي وقت الإصلاح."]]}], "kwAr": "بعض الشيء", "noteAr": "أو: لزمن قليل."}, {"kw": "godliness", "raw": "1Ti_6:6; Job_22:2; Tit_3:8", "note": "", "refs": [{"l": "1Ti 6:6", "n": "", "vs": [[6, "أما التقوى مع القناعة فهي تجارة عظيمة."]]}, {"l": "Job 22:2", "n": "", "vs": [[2, "«أينفع الإنسان الله ؟ إنما الحكيم ينفع نفسه!"]]}, {"l": "Tit 3:8", "n": "", "vs": [[8, "صادق هذا القول! وأريد أن تقرر هذه الأمور قرارا حاسما، حتى يهتم الذين آمنوا بالله بأن يجتهدوا في الأعمال الصالحة. هذه الأمور حسنة ونافعة للناس."]]}], "kwAr": "أما التقوى", "noteAr": ""}, {"kw": "having", "raw": "Deu_28:1-14; Job_5:19-26; Psa_37:3, Psa_37:4, Psa_37:16-19, Psa_37:29, Psa_84:11, Psa_91:10-16; Psa_112:1-3, Psa_128:1-6, Psa_145:19; Pro_3:16-18; Ecc_8:12; Isa_3:10, Isa_32:17, Isa_32:18; Isa_33:16, Isa_65:13, Isa_65:14; Mat_5:3-12, Mat_6:33, Mat_19:29; Mar_10:19, Mar_10:20; Luk_12:31; Luk_12:32; Rom_8:28; 1Co_3:22; 2Pe_1:3, 2Pe_1:4; 1Jo_2:25; Rev_3:12, Rev_3:21", "note": "", "refs": [{"l": "Deu 28:1-14", "n": "", "vs": [[1, "وإن أطعتم صوت الرب طاعة تامة، حرصا منكم على تنفيذ جميع وصاياه التي أوصيكم بها اليوم، فإن الرب إلهكم يجعلكم أسمى من جميع أمم الأرض."], [2, "وإذا سمعتم لصوت الرب إلهكم فإن جميع هذه البركات تنسكب عليكم وتلازمكم."], [3, "تكونون مباركين في المدينة ومباركين في الحقول."], [4, "كما تتبارك ذريتكم، وغلات أرضكم، ونتاج بهائمكم وبقركم ونعاجكم."], [5, "وتتبارك أيضا فواكه سلالكم وخبز معاجنكم."], [6, "وتكونون مباركين في دخولكم وخروجكم"], [7, "ويهزم الرب أمامكم أعداءكم القائمين عليكم، فيقبلون عليكم في طريق واحدة، ولكنهم يولون الأدبار أمامكم في سبع طرق."], [8, "يأمر الرب لكم بالبركة، فتمتليء خزائنكم. ويبارك كل ما تنتجه أيديكم وغلات أرضكم التي يهبها لكم."], [9, "وإذا حفظتم وصاياه وسلكتم في سبله فإنه يجعلكم لنفسه شعبا مقدسا كما حلف لكم،"], [10, "فتدرك جميع شعوب الأرض أن اسم الرب قد حل عليكم، ويخافونكم."], [11, "ويزيدكم الرب وفرة فيكثر من أبنائكم ونتاج بهائمكم ومن غلات أرضكم التي حلف لآبائكم أن يهبها لكم."], [12, "ويفتح لكم الرب كنوز سمائه الصالحة، فيمطر على أرضكم في مواسمها، ويبارك كل ما تنتجه أيديكم، فتقرضون أمما كثيرة وأنتم لا تقترضون."], [13, "وإذا أطعتم وصايا الرب التي أنا آمركم بها اليوم لتحفظوها وتعملوا بها، فإنه يجعلكم رؤوسا لا أذنابا، متسامين دائما، ولا يدرككم انحطاط أبدا."], [14, "لا تنحرفوا يمينا أو شمالا عن جميع هذه الشرائع التي أنا أوصيكم بها اليوم، لكي لا تغووا وراء آلهة أخرى لتعبدوها."]]}, {"l": "Job 5:19-26", "n": "", "vs": [[19, "من ست بلايا ينجيك، وفي سبع لا يقع بك أذى."], [20, "يفديك من الموت جوعا، وفي الحرب من الموت بحد السيف."], [21, "يقيك من لذعات اللسان، فلا تخاف من الدمار إذا أقبل."], [22, "تسخر من الدمار والمجاعة، ولا تخشى وحوش الأرض،"], [23, "لأن عهدك مع حجارة الحقل، ووحوش الصحراء تسالمك."], [24, "فتدرك أن خيمتك آمنة، وتتعهد حظيرتك فلا تفقد شيئا."], [25, "عندئذ تعلم أن ذريتك كثيرة، وأن نسلك كعشب الأرض،"], [26, "وتدخل القبر في شيبة ناضجة، كما يرفع كدس القمح في موسمه."]]}, {"l": "Psa 37:3", "n": "", "vs": [[3, "توكل على الرب واصنع الخير. اسكن في الأرض (مطمئنا) وراع الأمانة."]]}, {"l": "Psa 37:4", "n": "", "vs": [[4, "ابتهج بالرب فيمنحك بغية قلبك."]]}, {"l": "Psa 37:16-19", "n": "", "vs": [[16, "الخير القليل الذي يملكه الصديق أفضل من ثروة أشرار كثيرين،"], [17, "لأن سواعد الأشرار ستكسر، أما الأبرار فالرب يسندهم."], [18, "الرب عليم بأيام الكاملين، وميراثهم يدوم إلى الأبد."], [19, "لا يخزون في زمان السوء، وفي أيام الجوع يشبعون."]]}, {"l": "Psa 37:29", "n": "", "vs": [[29, "الصديقون يرثون خيرات الأرض ويسكنون فيها إلى الأبد."]]}, {"l": "Psa 84:11", "n": "", "vs": [[11, "لأن الرب الإله شمس وترس. الرب يعطي نعمة ومجدا؛ لا يمنع أي خير عن السالكين بالاستقامة."]]}, {"l": "Psa 91:10-16", "n": "", "vs": [[10, "فلن يصيبك شر ولن تقترب بلية من مسكنك"], [11, "فإنه يوصي ملائكته بك لكي يحفظوك في جميع طرقك."], [12, "على أيديهم يحملونك لئلا تصدم بحجر قدمك."], [13, "تطأ على الأسد والأفعى، تدوس الشبل والثعبان."], [14, "قال الرب: أنجيه لأنه تعلق بي. أرفعه لأنه عرف اسمي."], [15, "يدعوني فأستجيب له، أرافقه في الضيق، أنقذه وأكرمه"], [16, "أطيل عمره، وأريه خلاصي."]]}, {"l": "Psa 112:1-3", "n": "", "vs": [[1, "هللويا! طوبى لمن يخشى الرب ويبتهج جدا بوصاياه."], [2, "ذريته تكون قوية في الأرض، جيل المستقيمين يكون مباركا."], [3, "يمتليء بيته مالا وغنى، وبره يدوم إلى الأبد."]]}, {"l": "Psa 128:1-6", "n": "", "vs": [[1, "طوباك يامن تتقي الرب وتسلك في طرقه."], [2, "لأنك تأكل من تعب يديك وتتمتع بالسعادة والخير."], [3, "تكون امرأتك ككرمة مثمر ة في جوانب بيتك، وأبناؤك كأغراس الزيتون حول مائدتك."], [4, "هكذا يبارك الرجل الذي يتقي الرب."], [5, "يباركك الرب من صهيون، حتى تشهد خير أورشليم كل أيام حياتك،"], [6, "وتعيش لترى أحفادك. وليكن لشعب إسرائيل سلام."]]}, {"l": "Psa 145:19", "n": "", "vs": [[19, "يجيب سؤل جميع خائفيه، ويسمع تضرعهم فيخلصهم."]]}, {"l": "Pro 3:16-18", "n": "", "vs": [[16, "في يمينها حياة مديدة وفي يسارها غنى وجاه."], [17, "طرقها طرق نعم، ودروبها دروب سلام."], [18, "هي شجرة حياة لمن يتشبث بها، وطوبى لمن يتمسك بها."]]}, {"l": "Ecc 8:12", "n": "", "vs": [[12, "ومع أن الخاطيء يرتكب الشر مئة مرة وتطول أيامه، إلا أنني أعلم أنه يكون خير لمتقي الله الذين يخشعون في حضرته."]]}, {"l": "Isa 3:10", "n": "", "vs": [[10, "ولكن بشروا الصديقين بالخير لأنهم سيتمتعون بثواب أعمالهم"]]}, {"l": "Isa 32:17", "n": "", "vs": [[17, "فيكون ثمر البر سلاما، وفعل البر سكينة وطمأنينة إلى الأبد،"]]}, {"l": "Isa 32:18", "n": "", "vs": [[18, "فيسكن شعبي في ديار سلام، وفي مساكن آمنة، وفي أماكن راحة مطمئنة،"]]}, {"l": "Isa 33:16", "n": "", "vs": [[16, "هو الذي يسكن في العلاء، وملجأه معاقل الصخور، يؤمن له خبزه. ويكفل له ماؤه."]]}, {"l": "Isa 65:13", "n": "", "vs": [[13, "لذلك هكذا يقول السيد الرب: ها عبيدي يأكلون وأنتم تجوعون، ويشربون وأنتم تظمأون، ويفرحون وأنتم تخزون،"]]}, {"l": "Isa 65:14", "n": "", "vs": [[14, "ويترنمون في غبطة القلب وأنتم تعولون من أسى القلب، وتولولون من انكسار الروح،"]]}, {"l": "Mat 5:3-12", "n": "", "vs": [[3, "«طوبى للمساكين بالروح، فإن لهم ملكوت السماوات."], [4, "طوبى للحزانى، فإنهم سيعزون."], [5, "طوبى للودعاء، فإنهم سيرثون الأرض."], [6, "طوبى للجياع والعطاش إلى البر، فإنهم سيشبعون."], [7, "طوبى للرحماء، فإنهم سيرحمون."], [8, "طوبى لأنقياء القلب، فإنهم سيرون الله ."], [9, "طوبى لصانعي السلام، فإنهم سيدعون أبناء الله."], [10, "طوبى للمضطهدين من أجل البر، فإن لهم ملكوت السماوات."], [11, "طوبى لكم متى أهانكم الناس واضطهدوكم، وقالوا فيكم من أجلي كل سوء كاذبين."], [12, "افرحوا وتهللوا، فإن مكافأتكم في السماوات عظيمة. فإنهم هكذا اضطهدوا الأنبياء من قبلكم!"]]}, {"l": "Mat 6:33", "n": "", "vs": [[33, "أما أنتم، فاطلبوا أولا ملكوت الله وبره، وهذه كلها تزاد لكم."]]}, {"l": "Mat 19:29", "n": "", "vs": [[29, "فأي من ترك بيوتا أو إخوة أو أخوات أو أبا أو أما أو أولادا أو أراضي من أجل اسمي، ينال مئة ضعف ويرث الحياة الأبدية."]]}, {"l": "Mar 10:19", "n": "", "vs": [[19, "أنت تعرف الوصايا: لا تقتل؛ لا تزن؛ لا تسرق؛ لا تشهد بالزور؛ لا تظلم؛ أكرم أباك وأمك!»"]]}, {"l": "Mar 10:20", "n": "", "vs": [[20, "فأجابه قائلا: «هذه كلها عملت بها منذ صغري»"]]}, {"l": "Luk 12:31", "n": "", "vs": [[31, "إنما اسعوا إلى ملكوته، فتزاد لكم هذه كلها."]]}, {"l": "Luk 12:32", "n": "", "vs": [[32, "لا تخافوا، أيها القطيع الصغير، لأن أباكم قد سر أن يعطيكم الملكوت."]]}, {"l": "Rom 8:28", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."]]}, {"l": "1Co 3:22", "n": "", "vs": [[22, "أبولس أم أبلوس أم بطرس أم العالم أم الحيا ة أم الموت أم الحاضر أم المستقبل: هذه الأمور كلها لكم،"]]}, {"l": "2Pe 1:3", "n": "", "vs": [[3, "إن الله، بقدرته الإلهية، قد زودنا بكل ما نحتاج إليه في الحيا ة الروحية المتصفة بالتقوى. ذلك أنه عرفنا بالمسيح الذي دعانا إلى مجده وفضيلته،"]]}, {"l": "2Pe 1:4", "n": "", "vs": [[4, "اللذين بهما أعطانا الله بركاته العظمى الثمينة التي كان قد وعد بها. وبهذا صار بإمكانكم أن تتخلصوا من الفساد الذي تنشره الشهوة في العالم، وتشتركوا في الطبيعة الإلهية."]]}, {"l": "1Jo 2:25", "n": "", "vs": [[25, "فإن الله نفسه قد وعدنا بالحياة الأبدية."]]}, {"l": "Rev 3:12", "n": "", "vs": [[12, "كل من ينتصر سأجعله عمودا في هيكل إلهي، فلا يخرج منه أبدا، وسأكتب عليه اسم إلهي واسم مدينة إلهي أورشليم الجديدة، التي تنزل من السماء من عند إلهي، وأكتب عليه اسمي الجديد."]]}, {"l": "Rev 3:21", "n": "", "vs": [[21, "وكل من ينتصر سأجلسه معي على عرشي، كما انتصرت أنا أيضا فجلست مع أبي على عرشه؛"]]}], "kwAr": "وعدا بالحياة الحاضرة والآتية", "noteAr": ""}], "arS": [["فالرياضة", ["G1129"]], [" ", []], ["البدنية", ["G4984"]], [" ", []], ["نافعة", ["G5624"]], [" بعض الشيء. أما ", []], ["التقوى", ["G2150"]], [" ", []], ["فنافعة", ["G5624"]], [" ", []], ["لكل شيء", ["G3956"]], ["، لأن فيها ", []], ["وعدا", ["G1860"]], [" ", []], ["بالحياة", ["G2222"]], [" ", []], ["الحاضرة", ["G3568"]], [" ", []], ["والآتية", ["G3195"]], [".", []]]}, {"c": 4, "v": 9, "text": "ما أصدق هذا القول، وما أجدره بالتصديق!", "groups": [{"kw": "", "raw": "1Ti_1:15", "note": "", "refs": [{"l": "1Ti 1:15", "n": "", "vs": [[15, "ما أصدق هذا القول، وما أجدره بالتصديق الكلي: إن المسيح يسوع قد جاء إلى العالم ليخلص الخاطئين، وأنا أولهم!"]]}], "kwAr": "", "noteAr": ""}], "arS": [["ما ", []], ["أصدق", ["G4103"]], [" هذا ", []], ["القول", ["G3056"]], ["، وما ", []], ["أجدره", ["G514"]], [" ", []], ["بالتصديق", ["G594"]], ["!", []]]}, {"c": 4, "v": 10, "text": "فإننا لأجل هذا نعمل باجتهاد ونقاسي التعيير، لأننا وضعنا رجاءنا في الله الحي، حافظ جميع الناس، وبالأخص المؤمنين.", "groups": [{"kw": "therefore", "raw": "1Co_4:9-13; 2Co_4:8-10, 2Co_6:3-10, 2Co_11:23-27; 2Ti_2:9, 2Ti_2:10, 2Ti_3:10-12; Heb_11:26, Heb_13:13; 1Pe_4:14, 1Pe_4:15", "note": "", "refs": [{"l": "1Co 4:9-13", "n": "", "vs": [[9, "فإني أرى أن الله عرضنا، نحن الرسل، في آخر الموكب كأنه محكوم علينا بالموت، لأننا صرنا معرضا للعالم، للملائكة والبشر معا."], [10, "نحن جهلاء من أجل المسيح، وأنتم حكماء في المسيح. نحن ضعفاء وأنتم أقوياء. أنتم مكرمون ونحن مهانون."], [11, "فما زلنا حتى هذه الساعة نجوع ونعطش، ونعرى ونلطم ونحرم محلا للإقامة"], [12, "ونجهد أنفسنا في الشغل بأيدينا. نتعرض للإهانة فنبارك، وللاضطهاد فنحتمل"], [13, "وللتجريح فنسالم. صرنا كأقذار العالم ونفاية الجميع، ومازلنا!"]]}, {"l": "2Co 4:8-10", "n": "", "vs": [[8, "فالصعوبات تضيق علينا من كل جهة، ولكن لا ننهار. لا نجد حلا مناسبا، ولكن لا نيأس."], [9, "يطاردنا الاضطهاد، ولكن لا يتخلى الله عنا. نطرح أرضا، ولكن لا نموت."], [10, "وحيثما ذهبنا، نحمل موت يسوع دائما في أجسادنا لتظهر فيها أيضا حياة يسوع."]]}, {"l": "2Co 6:3-10", "n": "", "vs": [[3, "ولسنا نتصرف أي تصرف يكون عثرة لأحد، حتى لا يلحق الخدمة أي لوم."], [4, "وإنما نتصرف في كل شيء بما يبين أننا فعلا خدام الله: في تحمل الكثير؛ في الشدائد والحاجات والضيقات والجلدات"], [5, "والسجون والاضطرابات والأتعاب والسهر والصوم؛"], [6, "في الطهارة والمعرفة وطول البال واللطف؛ في الروح القدس والمحبة الخالصة من الرياء؛"], [7, "في كلمة الحق وقدرة الله؛ بأسلحة البر في الهجوم والدفاع؛"], [8, "بالكرامة والهوان؛ بالصيت السييء والصيت الحسن. نعامل كمضللين ونحن صادقون،"], [9, "كمجهولين ونحن معروفون، كمائتين وها نحن نحيا ، كمعاقبين ولا نقتل،"], [10, "كمحزونين ونحن دائما فرحون، كفقراء ونحن نغني كثيرين، كمن لا شيء عندهم ونحن نملك كل شيء."]]}, {"l": "2Co 11:23-27", "n": "", "vs": [[23, "وإن كانوا خدام المسيح، أتكلم كأني فقدت صوابي، فأنا متفوق عليهم: في الأتعاب أوفر منهم جدا، في الجلدات فوق الحد، في السجون أوفر جدا، في التعرض للموت أكثر مرارا."], [24, "من اليهود تلقيت الجلد خمس مرات، كل مرة أربعين جلدة إلا واحدة."], [25, "ضربت بالعصي ثلاث مرات. رجمت بالحجارة مرة. تحطمت بي السفينة ثلاث مرات. قضيت في عرض البحر يوما بنهاره وليله."], [26, "سافرت أسفارا عديدة؛ وواجهتني أخطار السيول الجارفة، وأخطار قطاع الطرق، وأخطار من بني جنسي، وأخطار من الأمم، وأخطار في المدن، وأخطار في البراري، وأخطار في البحر، وأخطار بين إخوة دجالين."], [27, "وكم عانيت من التعب والكد والسهر الطويل، والجوع والعطش والصوم الكثير، والبرد والعري."]]}, {"l": "2Ti 2:9", "n": "", "vs": [[9, "الذي لأجل التبشير به أقاسي حتى القيود كأني فاعل شر. إلا أن كلمة الله لا تكبلها القيود."]]}, {"l": "2Ti 2:10", "n": "", "vs": [[10, "لهذا السبب أحتمل كل شيء بصبر لأجل الذين اختارهم الله ، لكي يحصلوا، هم أيضا، على الخلاص الذي في المسيح يسوع مع المجد الأبدي."]]}, {"l": "2Ti 3:10-12", "n": "", "vs": [[10, "وأما أنت، فقد عرفت جيدا تعليمي، وسيرتي، وهدفي، وإيماني، وتحملي للمشقات، ومحبتي، وثباتي،"], [11, "واضطهاداتي، وآلامي تلك التي حدثت لي في مدن أنطاكية وإيقونية ولسترة وغيرها؛ وكم احتملت من اضطهادات، والرب أنقذني منها جميعا!"], [12, "وحقا، إن جميع الذين يعزمون أن يعيشوا عيشة التقوى في المسيح يسوع يضطهدون."]]}, {"l": "Heb 11:26", "n": "", "vs": [[26, "فقد اعتبر أن عار المسيح، هو ثروة أعظم من كنوز مصر، لأنه كان يتطلع إلى المكافأة."]]}, {"l": "Heb 13:13", "n": "", "vs": [[13, "فلنخرج إذن إلى خارج المحلة، قاصدين المسيح ونحن على استعداد لتحمل العار معه!"]]}, {"l": "1Pe 4:14", "n": "", "vs": [[14, "فإذا لحقتكم الإهانة لأنكم تحملون اسم المسيح، فطوبى لكم! لأن روح المجد، أي روح الله، يستقر عليكم."]]}, {"l": "1Pe 4:15", "n": "", "vs": [[15, "لا يكن بينكم من يتأ لم عقابا على شر ارتكبه: كالقتل أو السرقة، أو غيرهما من الجرائم، أو التدخل في شؤون الآخرين."]]}], "kwAr": "لأجل هذا", "noteAr": ""}, {"kw": "because", "raw": "1Ti_6:17; Psa_37:40, Psa_52:8, Psa_84:12, Psa_118:8; Isa_12:2, Isa_50:10; Jer_17:7; Dan_3:28; Nah_1:7; Mat_27:43; Rom_15:12, Rom_15:13; 1Pe_1:21", "note": "", "refs": [{"l": "1Ti 6:17", "n": "", "vs": [[17, "أوص أغنياء هذا الزمان بأن لا يتكبروا، ولا يتكلوا على الغنى غير الثابت، بل على الله الذي يمنحنا كل شيء بوفرة لنتمتع به،"]]}, {"l": "Psa 37:40", "n": "", "vs": [[40, "يعينهم الرب حقا، وينقذهم من الأشرار، ويخلصهم لأنهم احتموا به."]]}, {"l": "Psa 52:8", "n": "", "vs": [[8, "أما أنا فمثل زيتونة خضراء في بيت الله وثقت برحمة الله إلى الدهر والأبد."]]}, {"l": "Psa 84:12", "n": "", "vs": [[12, "يارب الجنود، طوبى للإنسان المتكل عليك."]]}, {"l": "Psa 118:8", "n": "", "vs": [[8, "اللجوء إلى الرب خير من الاعتماد على البشر."]]}, {"l": "Isa 12:2", "n": "", "vs": [[2, "ها إن الله خلاصي فأطمئن ولا أرتعد، لأن الرب الله هو قوتي وترنيمتي وقد أصبح لي خلاصا»."]]}, {"l": "Isa 50:10", "n": "", "vs": [[10, "من منكم يتقي الرب ويطيع صوت خادمه؟ من الذي يسلك في الظلمة من غير نور؟ فليتكل على اسم الرب ويعتمد على إلهه."]]}, {"l": "Jer 17:7", "n": "", "vs": [[7, "ولكن مبارك الرجل الذي يتكل على الرب، ويتخذه معتمدا له،"]]}, {"l": "Dan 3:28", "n": "", "vs": [[28, "فقال نبوخذناصر: «تبارك إله شدرخ وميشخ وعبدنغو الذي أرسل ملاكه وأنقذ عبيده الذين اتكلوا عليه وخالفوا أمر الملك وبذلوا أجسادهم كيلا يعبدوا أو يسجدوا لإله غير إلههم."]]}, {"l": "Nah 1:7", "n": "", "vs": [[7, "الرب صالح، حصن في يوم الضيق، ويعرف المعتصمين به."]]}, {"l": "Mat 27:43", "n": "", "vs": [[43, "توكل على الله، فليخلصه الآن إن كان يريده! فهو قد قال: أنا ابن الله!»"]]}, {"l": "Rom 15:12", "n": "", "vs": [[12, "ويقول إشعياء أيضا: «سيطلع أصل يسى، والقائم، ليسود على الأمم: عليه تعلق الشعوب الرجاء»."]]}, {"l": "Rom 15:13", "n": "", "vs": [[13, "فليملأكم إله الرجاء كل فرح وسلام في إيمانكم حتى تزدادوا رجاء بقوة الروح القدس."]]}, {"l": "1Pe 1:21", "n": "", "vs": [[21, "أنتم الذين تؤمنون بالله بالمسيح الذي أقامه من الموت وأعطاه المجد، حتى يكون الله غاية إيمانكم ورجائكم."]]}], "kwAr": "لأننا وضعنا رجاءنا", "noteAr": ""}, {"kw": "the living", "raw": "1Ti_3:15", "note": "", "refs": [{"l": "1Ti 3:15", "n": "", "vs": [[15, "حتى إذا تأخرت تعلم كيف يجب التصرف في بيت الله، أي كنيسة الله الحي، ركن الحق ودعامته."]]}], "kwAr": "الله الحي", "noteAr": ""}, {"kw": "the saviour", "raw": "1Ti_2:4, 1Ti_2:6; Psa_36:6, Psa_107:2, 6-43; Isa_45:21, Isa_45:22; Joh_1:29, Joh_3:15-17; 1Jo_2:2, 1Jo_4:14", "note": "", "refs": [{"l": "1Ti 2:4", "n": "", "vs": [[4, "فهو يريد لجميع الناس أن يخلصوا، ويقبلوا إلى معرفة الحق بالتمام:"]]}, {"l": "1Ti 2:6", "n": "", "vs": [[6, "الذي بذل نفسه فدية عوضا عن الجميع. هذه شهادة تؤدى في أوقاتها الخاصة،"]]}, {"l": "Psa 36:6", "n": "", "vs": [[6, "عدلك ثابت مثل الجبال الشامخة، وأحكامك كالغور السحيق. وأنت يارب تحفظ الناس والبهائم جميعا."]]}, {"l": "Psa 107:2", "n": "", "vs": [[2, "ليقل هذا مفديو الرب، الذين افتداهم من يد ظالمهم."]]}, {"l": "Isa 45:21", "n": "", "vs": [[21, "أعلنوا، واعرضوا دعواكم. ليتشاوروا معا. من أنبأ بهذا منذ القدم، ومن أخبر به من زمن بعيد؟ ألست أنا الرب ولا إله غيري؟ بار ومخلص، وليس هناك آخر."]]}, {"l": "Isa 45:22", "n": "", "vs": [[22, "التفتوا إلي واخلصوا ياجميع أقاصي الأرض، لأني أنا الله وليس هناك آخر."]]}, {"l": "Joh 1:29", "n": "", "vs": [[29, "وفي اليوم التالي رأى يوحنا يسوع آتيا نحوه، فهتف قائلا: «هذا هو حمل الله الذي يزيل خطيئة العالم."]]}, {"l": "Joh 3:15-17", "n": "", "vs": [[15, "لتكون الحياة الأبدية لكل من يؤمن به."], [16, "لأنه هكذا أحب الله العالم حتى بذل ابنه الوحيد، لكي لا يهلك كل من يؤمن به، بل تكون له الحياة الأبدية."], [17, "فإن الله لم يرسل ابنه إلى العالم ليدين العالم، بل ليخلص العالم به،"]]}, {"l": "1Jo 2:2", "n": "", "vs": [[2, "فهو كفارة لخطايانا، لا لخطايانا فقط، بل لخطايا العالم كله."]]}, {"l": "1Jo 4:14", "n":
