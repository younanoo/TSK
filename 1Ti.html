s": [[31, "ويعلم الله ، أبو ربنا يسوع، المبارك إلى الأبد، أني لست أكذب:"]]}, {"l": "Gal 1:20", "n": "", "vs": [[20, "إن ما أكتبه إليكم هنا، وها أنا أمام الله، لست أكذب فيه."]]}], "kwAr": "الحق أقول ولست أكذب", "noteAr": ""}, {"kw": "a teacher", "raw": "Joh_7:35; Act_9:15, Act_22:21, Act_26:17, Act_26:18, Act_26:20; Rom_11:13, Rom_15:16; Gal_1:16, Gal_2:9", "note": "", "refs": [{"l": "Joh 7:35", "n": "", "vs": [[35, "فتساءل اليهود فيما بينهم: «إلى أين ينوي أن يذهب فلا نجده؟ أيذهب إلى المدن اليونانية التي تشتت فيها اليهود، ويعلم اليونانيين؟"]]}, {"l": "Act 9:15", "n": "", "vs": [[15, "فأمره الرب: «اذهب! فقد اخترت هذا الرجل ليكون إناء يحمل اسمي إلى الأمم والملوك وبني إسرائيل."]]}, {"l": "Act 22:21", "n": "", "vs": [[21, "ولكنه قال لي: اذهب ... سأرسلك بعيدا: إلى الأمم!»"]]}, {"l": "Act 26:17", "n": "", "vs": [[17, "وسأنقذك من شعبك ومن الأمم التي أرسلك إليها الآن،"]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "Act 26:20", "n": "", "vs": [[20, "فبشرت أهل دمشق أولا، ثم أهل أورشليم ومنطقة اليهودية كلها، ثم الأجانب. فدعوت الجميع إلى التوبة والرجوع إلى الله، والقيام بأعمال تليق بالتوبة."]]}, {"l": "Rom 11:13", "n": "", "vs": [[13, "فإني أخاطبكم، أنتم الأمم، بما أني رسول للأمم، ممجدا رسالتي،"]]}, {"l": "Rom 15:16", "n": "", "vs": [[16, "وبذلك أكون خادم المسيح يسوع، المرسل إلى الأمم، حاملا إنجيل الله وكأني أقوم بخدمة كهنوتية، بقصد أن ترفع لله من بين الأمم تقدمة تكون مقبولة ومقدسة بالروح القدس."]]}, {"l": "Gal 1:16", "n": "", "vs": [[16, "أن يعلن ابنه في لأبشر به بين الأمم، في الحال لم أستشر لحما ودما،"]]}, {"l": "Gal 2:9", "n": "", "vs": [[9, "فلما اتضحت النعمة الموهوبة لي عند يعقوب وبطرس ويوحنا، وهم البارزون باعتبارهم أعمدة، مدوا إلي وإلى برنابا أيديهم اليمنى إشارة إلى المشاركة، فنتوجه نحن إلى الأمم وهم إلى أهل الختان،"]]}], "kwAr": "معلما للأمم", "noteAr": ""}, {"kw": "in faith", "raw": "Act_14:27; Gal_2:16, Gal_3:9", "note": "", "refs": [{"l": "Act 14:27", "n": "", "vs": [[27, "ولما وصلا، استدعيا الكنيسة إلى الاجتماع، وأخبرا بكل ما فعل الله بواسطتهما، وبأنه فتح باب الإيمان لغير اليهود."]]}, {"l": "Gal 2:16", "n": "", "vs": [[16, "ولكننا، إذ علمنا أن الإنسان لا يتبرر على أساس الأعمال المطلوبة في الشريعة بل فقط بالإيمان بيسوع المسيح، آمنا نحن أيضا بالمسيح يسوع، لنتبرر على أساس الإيمان به، لا على أساس أعمال الشريعة، لأنه على أعمال الشريعة لا يبرر أي إنسان."]]}, {"l": "Gal 3:9", "n": "", "vs": [[9, "إذن الذين هم على مبدأ الإيمان يباركون مع إبراهيم المؤمن."]]}], "kwAr": "في الإيمان", "noteAr": ""}, {"kw": "verity", "raw": "Psa_111:7", "note": "", "refs": [{"l": "Psa 111:7", "n": "", "vs": [[7, "أعمال يديه حق وعدل. وكل وصاياه أمينة."]]}], "kwAr": "والحق", "noteAr": ""}], "arS": [["ولها قد ", []], ["عينت", ["G5087"]], [" ", []], ["أنا", ["G1473"]], [" ", []], ["مبشرا", ["G2783"]], [" ", []], ["ورسولا", ["G652"]], ["، ", []], ["الحق", ["G225"]], [" ", []], ["أقول", ["G3004"]], [" ولست ", []], ["أكذب", ["G5574"]], ["، ", []], ["معلما", ["G1320"]], [" ", []], ["للأمم", ["G1484"]], [" في ", []], ["الإيمان", ["G4102"]], [" ", []], ["والحق", ["G225"]], [".", []]]}, {"c": 2, "v": 8, "text": "فأريد إذن، أن يصلي الرجال في كل مكان، رافعين أيادي طاهرة، وهم لا يضمرون أي حقد أو شكوك.", "groups": [{"kw": "I will", "raw": "1Ti_5:14; 1Co_7:7 *Gr: Tit_3:8", "note": "", "refs": [{"l": "1Ti 5:14", "n": "", "vs": [[14, "فأريد إذن أن تتزوج الأرامل الشابات، فيلدن الأولاد، ويدبرن بيوتهن، ولا يفسحن للمقاوم في المجال للطعن في سلوكهن."]]}, {"l": "1Co 7:7", "n": "*Gr:", "vs": [[7, "فأنا أتمنى أن يكون جميع الناس مثلي. غير أن لكل إنسان موهبة خاصة به من عند الله: فبعضهم على الحال وبعضهم على تلك."]]}, {"l": "Tit 3:8", "n": "", "vs": [[8, "صادق هذا القول! وأريد أن تقرر هذه الأمور قرارا حاسما، حتى يهتم الذين آمنوا بالله بأن يجتهدوا في الأعمال الصالحة. هذه الأمور حسنة ونافعة للناس."]]}], "kwAr": "فأريد", "noteAr": ""}, {"kw": "pray", "raw": "2Ch_33:11, 2Ch_33:12; Psa_130:1, Psa_130:2; Lam_3:55, Lam_3:56; Jon_2:1, Jon_2:2; Mal_1:11; Luk_23:42, Luk_23:43; Joh_4:21, Joh_4:23, Joh_4:24; Act_21:5", "note": "", "refs": [{"l": "2Ch 33:11", "n": "", "vs": [[11, "لهذا أرسل الرب عليهم قادة جند ملك أشور، فقبضوا على منسى ووضعوا خزامة في أنفه، وقادوه مغلولا بسلاسل نحاس إلى بابل."]]}, {"l": "2Ch 33:12", "n": "", "vs": [[12, "وفي ضيقه استغاث بالرب إلهه وتذلل جدا أمام إله آبائه،"]]}, {"l": "Psa 130:1", "n": "", "vs": [[1, "أيها الرب إياك أدعو من الأعماق."]]}, {"l": "Psa 130:2", "n": "", "vs": [[2, "فاسمع يارب صوتي، ولتكن أذناك مرهفتين إلى صوت تضرعي."]]}, {"l": "Lam 3:55", "n": "", "vs": [[55, "استغثت باسمك يارب من أعماق الجب،"]]}, {"l": "Lam 3:56", "n": "", "vs": [[56, "فسمعت صوتي. لا تصم أذنيك عن صراخ استغاثتي."]]}, {"l": "Jon 2:1", "n": "", "vs": [[1, "ثم صلى يونان إلى الرب إلهه من جوف الحوت،"]]}, {"l": "Jon 2:2", "n": "", "vs": [[2, "قائلا: «استغثت بالرب في ضيقي فاستجاب لي، ومن جوف الهاوية ابتهلت فسمعت صوتي."]]}, {"l": "Mal 1:11", "n": "", "vs": [[11, "لأنه من مشرق الشمس إلى مغربها اسمي عظيم بين الأمم، وفي كل مكان يحرق لاسمي بخور وذبائح طاهرة، لأن اسمي عظيم بين الأمم، يقول الرب القدير."]]}, {"l": "Luk 23:42", "n": "", "vs": [[42, "ثم قال: «يايسوع، اذكرني عندما تجيء في ملكوتك!»"]]}, {"l": "Luk 23:43", "n": "", "vs": [[43, "فقال له يسوع: «الحق أقول لك: اليوم ستكون معي في الفردوس!»"]]}, {"l": "Joh 4:21", "n": "", "vs": [[21, "فأجابها يسوع: «صدقيني ياامرأة، ستأتي الساعة التي فيها تعبدون الآب لا في هذا الجبل ولا في أورشليم."]]}, {"l": "Joh 4:23", "n": "", "vs": [[23, "فستأتي ساعة، لا بل هي الآن، حين يعبد العابدون الصادقون الآب بالروح وبالحق. لأن الآب يبتغي مثل هؤلاء العابدين."]]}, {"l": "Joh 4:24", "n": "", "vs": [[24, "الله روح، فلذلك لابد لعابديه من أن يعبدوه بالروح وبالحق»."]]}, {"l": "Act 21:5", "n": "", "vs": [[5, "وعندما انتهت مدة إقامتنا عندهم خرجنا لنكمل سفرنا، فرافقونا مع نسائهم وأولادهم إلى خارج المدينة مودعين. فركعنا على الشاطيء وصلينا،"]]}], "kwAr": "أن يصلي الرجال", "noteAr": ""}, {"kw": "lifting", "raw": "Job_16:17; Psa_26:6, Psa_66:18, Psa_134:2; Pro_15:8, Pro_21:27; Isa_1:15, Isa_58:7-11; Jer_7:9, Jer_7:10; Mal_1:9, Mal_1:10; Act_10:2, Act_10:4, Act_10:31; Heb_10:22; Jam_4:8; 1Jo_3:20-22", "note": "", "refs": [{"l": "Job 16:17", "n": "", "vs": [[17, "مع أنني لم أقترف ظلما، وصلاتي مخلصة."]]}, {"l": "Psa 26:6", "n": "", "vs": [[6, "أغسل يدي عربون براءتي وأنضم إلى المجتمعين حول مذبحك يارب."]]}, {"l": "Psa 66:18", "n": "", "vs": [[18, "إن تعهدت إثما في قلبي لا يستمع لي الرب."]]}, {"l": "Psa 134:2", "n": "", "vs": [[2, "ارفعوا أيديكم نحو المقدس وباركوا الرب."]]}, {"l": "Pro 15:8", "n": "", "vs": [[8, "قربان المنافقين مكرهة الرب، ومسرته صلاة المستقيمين."]]}, {"l": "Pro 21:27", "n": "", "vs": [[27, "ذبيحة الشرير رجس عند الرب، فكم بالحري إن قربها بنية أثيمة؟"]]}, {"l": "Isa 1:15", "n": "", "vs": [[15, "عندما تبسطون نحوي أيديكم أحجب وجهي عنكم، وإن أكثرتم الصلاة لا أستجيب، لأن أيديكم مملوءة دما."]]}, {"l": "Isa 58:7-11", "n": "", "vs": [[7, "ألا يكون في مشاطرة خبزك مع الجائع، وإيواء الفقير المتشرد في بيتك. وكسوة العريان الذي تلتقيه، وعدم التغاضي عن قريبك البائس؟"], [8, "عندئذ يشع نورك كالصباح، وتزهر عافيتك سريعا، ويتقدمك برك، ويحرس مجد الرب مؤخرة ساقتك."], [9, "عندئذ تدعو فيستجيب الرب. تستغيث فيقول ها أنا. إن أزلت من وسط بيتك النير، والإيماء بالأصبع احتقارا، والنطق بالشر،"], [10, "إن بذلت نفسك للجائع، وأشبعت حاجة الذليل، فإن نورك يشرق في الظلمة، وليلك الدامس يصبح كالظهر،"], [11, "ويهديك الرب دائما ويسد حاجتك حتى في زمن القحط والأرض المجدبة، فيقوي عظامك فتصبح كروضة مروية، وكجدول ماء لا ينقطع،"]]}, {"l": "Jer 7:9", "n": "", "vs": [[9, "أتسرقون وتقتلون وتزنون وتحلفون زورا وتبخرون للبعل، وتضلون وراء الأوثان التي لم تعرفوها،"]]}, {"l": "Jer 7:10", "n": "", "vs": [[10, "ثم تمثلون في حضرتي في هذا الهيكل الذي دعي باسمي قائلين: «قد نجونا»؛ ثم ترتكبون جميع هذه الرجاسات؟"]]}, {"l": "Mal 1:9", "n": "", "vs": [[9, "الآن التمسوا رضى الله ليرأف بنا، ولكن هل بمثل هذه القرابين المعتلة يرضى عنكم؟ يقول الرب القدير."]]}, {"l": "Mal 1:10", "n": "", "vs": [[10, "آه، ياليت بينكم من يغلق أبواب الهيكل لئلا توقدوا نارا باطلة على مذبحي، يقول الرب القدير: إذ لا مسرة لي بكم ولا أرضى بتقدمة من أيديكم."]]}, {"l": "Act 10:2", "n": "", "vs": [[2, "وكان تقيا يخاف الله ، هو وأهل بيته جميعا، يتصدق على الشعب كثيرا، ويصلي إلى الله دائما."]]}, {"l": "Act 10:4", "n": "", "vs": [[4, "فنظر إلى الملاك وقد استولى عليه الخوف، وسأل: «ماذا ياسيد؟» فأجابه: «صلواتك صعدت أمام الله تذكارا."]]}, {"l": "Act 10:31", "n": "", "vs": [[31, "وقال لي: ياكرنيليوس، سمع الله صلاتك وذكر صدقاتك."]]}, {"l": "Heb 10:22", "n": "", "vs": [[22, "فلنتقدم إلى حضرة الله بقلب صادق وبثقة الإيمان الكاملة، بعدما طهر رش الدم قلوبنا من كل شعور بالذنب، وغسل الماء النقي أجسادنا."]]}, {"l": "Jam 4:8", "n": "", "vs": [[8, "اقتربوا إلى الله فيقترب إليكم. أيها الخاطئون نظفوا أيديكم، وياأصحاب الرأيين طهروا قلوبكم."]]}, {"l": "1Jo 3:20-22", "n": "", "vs": [[20, "ولو لامتنا قلوبنا؛ فإن الله أعظم من قلوبنا، وهو العليم بكل شيء."], [21, "أيها الأحباء، إذا كانت ضمائرنا لا تلومنا. فهذا دليل على أن لنا ثقة عظيمة من نحو الله."], [22, "ومهما نطلب منه بالصلاة، نحصل عليه: لأننا نطيع ما يوصينا به، ونمارس الأعمال التي ترضيه."]]}], "kwAr": "رافعين أيادي طاهرة", "noteAr": ""}, {"kw": "without", "raw": "1Ki_3:11; Psa_35:13; Mat_5:22-24, Mat_5:44, Mat_6:12, Mat_6:14, Mat_6:15; Mar_11:25; Luk_23:34; Act_7:60; 1Pe_3:7", "note": "", "refs": [{"l": "1Ki 3:11", "n": "", "vs": [[11, "وقال له: «لأنك قد طلبت هذا الأمر، ولم تطلب حياة طويلة، ولا غنى، ولا انتقاما من أعدائك، بل سألت حكمة لتسوس شؤون الحكم،"]]}, {"l": "Psa 35:13", "n": "", "vs": [[13, "أما أنا فقد لبست المسح حزنا على مرضهم، وأذللت نفسي بالصوم، ولكن صلاتي كانت ترتد إلى صدري من غير استجابة."]]}, {"l": "Mat 5:22-24", "n": "", "vs": [[22, "أما أنا فأقول لكم: كل من هو غاضب على أخيه، يستحق المحاكمة؛ ومن يقول لأخيه: ياتافه! يستحق المثول أمام المجلس الأعلى؛ ومن يقول: ياأحمق! يستحق نار جهنم!"], [23, "فإذا جئت بتقدمتك إلى المذبح، وهناك تذكرت أن لأخيك شيئا عليك،"], [24, "فاترك تقدمتك أمام المذبح، واذهب أولا وصالح أخاك، ثم ارجع وقدم تقدمتك."]]}, {"l": "Mat 5:44", "n": "", "vs": [[44, "أما أنا فأقول لكم: أحبوا أعداءكم، وباركوا لاعنيكم، وأحسنوا معاملة الذين يبغضونكم، وصلوا لأجل الذين يسيئون إليكم ويضطهدونكم،"]]}, {"l": "Mat 6:12", "n": "", "vs": [[12, "واغفر لنا ذنوبنا، كما نغفر نحن للمذنبين إلينا!"]]}, {"l": "Mat 6:14", "n": "", "vs": [[14, "فإن غفرتم للناس زلاتهم، يغفر لكم أبوكم السماوي زلاتكم."]]}, {"l": "Mat 6:15", "n": "", "vs": [[15, "وإن لم تغفروا للناس، لا يغفر لكم أبوكم السماوي زلاتكم."]]}, {"l": "Mar 11:25", "n": "", "vs": [[25, "ومتى وقفتم تصلون، وكان لكم على أحد شيء، فاغفروا له، لكي يغفر لكم أبوكم الذي في السماوات زلاتكم أيضا."]]}, {"l": "Luk 23:34", "n": "", "vs": [[34, "وقال يسوع: «ياأبي، اغفر لهم، لأنهم لا يدرون ما يفعلون!» واقتسموا ثيابه مقترعين عليها."]]}, {"l": "Act 7:60", "n": "", "vs": [[60, "ثم ركع وصرخ بصوت عال: «يارب، لا تحسب عليهم هذه الخطيئة!» وإذ قال هذا رقد."]]}, {"l": "1Pe 3:7", "n": "", "vs": [[7, "وأنتم، أيها الأزواج، إذ تساكنون زوجاتكم عالمين بأنهن أضعف منكم، أكرموهن باعتبارهن شريكات لكم في وراثة نعمة الحياة، لكي لا يعوق صلواتكم شيء."]]}], "kwAr": "لا يضمرون أي حقد", "noteAr": ""}, {"kw": "and", "raw": "Mat_21:21; Mar_11:23, Mar_11:24; Jam_1:6-8", "note": "", "refs": [{"l": "Mat 21:21", "n": "", "vs": [[21, "فأجابهم: «الحق أقول لكم: إن كان لكم إيمان ولا تشكون، فإنكم تعملون لا مثل ما عملت بالتينة وحسب، بل إن كنتم تقولون لهذا الجبل: انقلع وانطرح في البحر، فإن ذلك يحدث."]]}, {"l": "Mar 11:23", "n": "", "vs": [[23, "فالحق أقول لكم: إن أي من قال لهذا الجبل: انقلع وانطرح في البحر! ولا يشك في قلبه، بل يؤمن أن ما يقوله سيحدث، فما يقوله يتم له."]]}, {"l": "Mar 11:24", "n": "", "vs": [[24, "لهذا السبب أقول لكم: إن ما تطلبونه وتصلون لأجله، فآمنوا أنكم قد نلتموه، فيتم لكم."]]}, {"l": "Jam 1:6-8", "n": "", "vs": [[6, "وإنما، عليه أن يطلب ذلك بإيمان، دون أي تردد أو شك. فإن المتردد كموجة البحر تتلاعب بها الرياح فتقذفها وتردها!"], [7, "فلا يتوهم المتردد أنه ينال شيئا من الرب."], [8, "فعندما يكون الإنسان برأيين، لا يثبت على قرار في جميع أموره."]]}], "kwAr": "أو شكوك", "noteAr": ""}], "arS": [["فأريد", ["G1014"]], [" إذن، أن ", []], ["يصلي", ["G4336"]], [" ", []], ["الرجال", ["G435"]], [" في ", []], ["كل", ["G3956"]], [" ", []], ["مكان", ["G5117"]], ["، ", []], ["رافعين", ["G1869"]], [" ", []], ["أيادي", ["G5495"]], [" ", []], ["طاهرة", ["G3741"]], ["، وهم لا يضمرون أي ", []], ["حقد", ["G3709"]], [" أو ", []], ["شكوك", ["G1261"]], [".", []]]}, {"c": 2, "v": 9, "text": "كما أريد أيضا، أن تظهر النساء بمظهر لائق محشوم اللباس، متزينات بالحياء والرزانة، غير متحليات بالجدائل والذهب واللاليء والحلل الغالية الثمن،", "groups": [{"kw": "that", "raw": "1Pe_3:3-5", "note": "", "refs": [{"l": "1Pe 3:3-5", "n": "", "vs": [[3, "وعلى المرأة ألا تعتمد الزينة الخارجية لإظهار جمالها، بضفر الشعر والتحلي بالذهب ولبس الثياب الفاخرة."], [4, "وإنما لتعتمد الزينة الداخلية، ليكون قلبها متزينا بروح الوداعة والهدوء. هذه هي الزينة التي لا تفنى، وهي غالية الثمن في نظر الله!"], [5, "وبها كانت تتزين النساء التقيات قديما، فكانت الواحدة منهن تتكل على الله وتخضع لزوجها."]]}], "kwAr": "أن تظهر النساء", "noteAr": ""}, {"kw": "with shamefacedness", "raw": "Pro_7:10; Isa_3:16; Tit_2:3-5", "note": "", "refs": [{"l": "Pro 7:10", "n": "", "vs": [[10, "فإذا بامرأة تستقبله في زي زانية وقلب مخادع."]]}, {"l": "Isa 3:16", "n": "", "vs": [[16, "ويقول الرب: «لأن بنات صهيون متغطرسات، يمشين بأعناق مشرئبة متغزلات بعيونهن، متخطرات في سيرهن، مجلجلات بخلاخيل أقدامهن."]]}, {"l": "Tit 2:3-5", "n": "", "vs": [[3, "وكذلك أن تكون العجائز ذوات سيرة موافقة للقداسة، غير نمامات ولا مدمنات للخمر، بل معلمات لما هو صالح،"], [4, "لكي يدربن الشابات على أن يكن محبات لأزواجهن ولأولادهن،"], [5, "متعقلات، عفيفات، مهتمات بشؤون بيوتهن صالحات، خاضعات لأزواجهن، حتى لا يتكلم أحد بالسوء على كلمة الله."]]}], "kwAr": "بالحياء والرزانة", "noteAr": ""}, {"kw": "not", "raw": "Gen_24:53; Exo_35:22, Exo_35:23; 2Ki_9:30; Est_5:1; Psa_45:13, Psa_45:14, Psa_149:4; Pro_31:22; Isa_3:18-24, Isa_61:4; Jer_2:32, Jer_4:30; Eze_16:9-16; Mat_6:28; Mat_6:29, Mat_11:8", "note": "", "refs": [{"l": "Gen 24:53", "n": "", "vs": [[53, "ثم أخرج جواهر من فضة ومن ذهب وثيابا وأعطاها لرفقة، وأهدى أيضا أخاها وأمها تحفا"]]}, {"l": "Exo 35:22", "n": "", "vs": [[22, "وتوافد الرجال مع النساء من ذوي النفوس السخية، متبرعين بأساور وأقراط وخواتم وقلائد وغير ذلك من الأمتعة الذهبية فكانت كل تقدمات المتبرعين من الذهب للرب."]]}, {"l": "Exo 35:23", "n": "", "vs": [[23, "وكذلك كل من وجد لديه أقمشة زرقاء وبنفسجية وحمراء، ومنسوجات كتانية، ومن شعر المعزى، وجلود كباش، وجلود دلفين، تبرع بها."]]}, {"l": "2Ki 9:30", "n": "", "vs": [[30, "وتوجه ياهو إلى يزرعيل. فلما علمت إيزابل بذلك كحلت عينيها وزينت شعرها وأطلت من الكوة."]]}, {"l": "Est 5:1", "n": "", "vs": [[1, "وفي اليوم الثالث ارتدت أستير ثيابا ملكية، ووقفت في القاعة الداخلية أمام البهو الملكي، الذي يجلس فيه الملك على عرشه."]]}, {"l": "Psa 45:13", "n": "", "vs": [[13, "كلها مجد ابنة الملك في قصرها. ثيابها منسوجة بذهب."]]}, {"l": "Psa 45:14", "n": "", "vs": [[14, "تزف إلى الملك بحلل مطرزة، ووصيفاتها العذارى يتبعنها قادمات إليك في موكب حافل."]]}, {"l": "Psa 149:4", "n": "", "vs": [[4, "لأن الرب يسر بشعبه، يجمل الودعاء بالخلاص."]]}, {"l": "Pro 31:22", "n": "", "vs": [[22, "تصنع لنفسها أغطية موشاة، وثيابها محاكة من كتان وأرجوان."]]}, {"l": "Isa 3:18-24", "n": "", "vs": [[18, "في ذلك اليوم ينزع الرب زينة الخلاخيل، وعصابات رؤوسهن والأهلة،"], [19, "والأقراط والأساور والبراقع،"], [20, "والعصائب والسلاسل والأحزمة، وآنية الطيب والتعاويذ"], [21, "والخواتم وخزائم الأنف،"], [22, "والثيا ب المزخرفة والعباءات والمعاطف والأكياس"], [23, "والمرايا والأردية الكتانية، والعصائب المزينة وأغطية الرؤوس"], [24, "فتحل العفونة محل الطيب، والحبل عوض الحزام، والصلع بدل الشعر المنسق، وحزام المسح في موضع الثوب الفاخر، والعار عوض الجمال،"]]}, {"l": "Isa 61:4", "n": "", "vs": [[4, "فيعمرون الخرائب القديمة، ويبنون الدمار الغابر، ويرممون المدن المتهدمة، والخرب التي انقضت عليها أجيال."]]}, {"l": "Jer 2:32", "n": "", "vs": [[32, "هل تنسى عذراء زينتها؟ أو عروس حلي زفافها؟ لكن شعبي نسيني أياما لا تحصى."]]}, {"l": "Jer 4:30", "n": "", "vs": [[30, "وأنت أيتها المدينة الموحشة، ماذا تصنعين؟ مهما لبست الثيا ب القرمزية، وتحليت بزينة من ذهب، مهما كحلت عينيك بالأثمد، فباطلا تجملين ذاتك، فقد نبذك عشاقك وسعوا للقضاء عليك."]]}, {"l": "Eze 16:9-16", "n": "", "vs": [[9, "ثم غسلتك بماء، ونظفتك من الدم وطيبتك بالدهن."], [10, "وكسوتك بثياب موشاة وحذوتك بنعلين من جلد الدلفين، ولفعتك بالكتان الفاخر، ودثرتك بالحرير،"], [11, "وزينتك بالحلي، إذ وضعت أساور في يديك وعقدا في عنقك."], [12, "وجعلت خزامة في أنفك وقرطين في أذنيك وإكليل جمال على رأسك"], [13, "فتزينت بالذهب والفضة، وكانت ثيابك من الكتان الفاخر والحرير وكل ما هو موشى. وأكلت السميذ والعسل والزيت، فتمتعت بأروع الجمال حتى صرت صالحة لتكوني زوجة ملك."], [14, "فذاع اسمك بين الأمم لفرط جمالك لأنه اكتمل بفضل بهائي الذي أضفيته عليك، يقول السيد الرب."], [15, "ولكنك اعتمدت على جمالك وزنيت اتكالا على شهرتك. أغدقت عهارتك على كل عابر سبيل راغب فيك"], [16, "وأخذت بعض ثيابك فصنعت لنفسك مشارف للأصنام ملونة زنيت عليها زنى لم يكن له مثيل ولن يكون."]]}, {"l": "Mat 6:28", "n": "", "vs": [[28, "ولماذا تحملون هم الكساء؟ تأملوا زنابق الحقل كيف تنمو: إنها لا تتعب ولا تغزل؛"]]}, {"l": "Mat 6:29", "n": "", "vs": [[29, "ولكني أقول لكم: حتى سليمان في قمة مجده لم يكتس ما يعادل واحدة منها بهاء!"]]}, {"l": "Mat 11:8", "n": "", "vs": [[8, "بل ماذا خرجتم لتروا: أإنسانا يلبس ثيابا ناعمة؟ ها إن لابسي الثياب الناعمة هم في قصور الملوك!"]]}], "kwAr": "غير متحليات", "noteAr": ""}, {"kw": "broided", "raw": "or, plaited, 1Pe_3:3", "note": "or, plaited, 1Pe_3:3", "refs": [{"l": "1Pe 3:3", "n": "", "vs": [[3, "وعلى المرأة ألا تعتمد الزينة الخارجية لإظهار جمالها، بضفر الشعر والتحلي بالذهب ولبس الثياب الفاخرة."]]}], "kwAr": "بالجدائل", "noteAr": "أو: مضفور (الشعر)."}], "arS": [["كما أريد أيضا، أن تظهر ", []], ["النساء", ["G1135"]], [" ", []], ["بمظهر لائق", ["G2887"]], [" محشوم ", []], ["اللباس", ["G2689"]], ["، ", []], ["متزينات", ["G2885"]], [" ", []], ["بالحياء", ["G127"]], [" ", []], ["والرزانة", ["G4997"]], ["، غير متحليات ", []], ["بالجدائل", ["G4117"]], [" ", []], ["والذهب", ["G5557"]], [" ", []], ["واللاليء", ["G3135"]], [" ", []], ["والحلل", ["G2441"]], [" ", []], ["الغالية الثمن", ["G4185"]], ["،", []]]}, {"c": 2, "v": 10, "text": "بل بما يليق بنساء يعترفن علنا بأنهن يعشن في تقوى الله، بالأعمال الصالحة!", "groups": [{"kw": "women", "raw": "1Pe_3:3-5; 2Pe_3:11", "note": "", "refs": [{"l": "1Pe 3:3-5", "n": "", "vs": [[3, "وعلى المرأة ألا تعتمد الزينة الخارجية لإظهار جمالها، بضفر الشعر والتحلي بالذهب ولبس الثياب الفاخرة."], [4, "وإنما لتعتمد الزينة الداخلية، ليكون قلبها متزينا بروح الوداعة والهدوء. هذه هي الزينة التي لا تفنى، وهي غالية الثمن في نظر الله!"], [5, "وبها كانت تتزين النساء التقيات قديما، فكانت الواحدة منهن تتكل على الله وتخضع لزوجها."]]}, {"l": "2Pe 3:11", "n": "", "vs": [[11, "ومادامت هذه الأشياء جميعا ستنحل، فكيف يجب أن تكونوا أنتم أصحاب سلوك مقدس يتصف بالتقوى،"]]}], "kwAr": "بما يليق بنساء", "noteAr": ""}, {"kw": "with", "raw": "1Ti_5:6-10; Pro_31:31; Act_9:36, Act_9:39; Eph_2:10; Tit_2:14, Tit_3:8; 1Pe_2:12; 2Pe_1:6-8; Rev_2:19", "note": "", "refs": [{"l": "1Ti 5:6-10", "n": "", "vs": [[6, "أما تلك التي تعيش منغمسة في اللذات، فقد ماتت، وإن كانت حية."], [7, "وعليك أن توصي بهذه الأمور، لكي يكون الجميع بلا لوم."], [8, "فإذا كان أحد لا يهتم بذويه، وبخاصة بأهل بيته، فقد أنكر الإيمان، وهو أسوأ من غير المؤمن."], [9, "لتقيد في سجل الأرامل من بلغت سن الستين على الأقل، على أن تكون قد تزوجت من رجل واحد،"], [10, "ويكون مشهودا لها بالأعمال الصالحة، كأن تكون قد ربت الأولاد، وأضافت الغرباء، وغسلت أقدام القديسين، وأسعفت المتضايقين، ومارست كل عمل صالح!"]]}, {"l": "Pro 31:31", "n": "", "vs": [[31, "أعطوها من ثمر يديها، ولتكن أعمالها مصدر الثناء عليها."]]}, {"l": "Act 9:36", "n": "", "vs": [[36, "وكان في مدينة يافا تلميذة اسمها طابيثا، ومعنى اسمها: غزالة، كان يشغلها دائما فعل الخير ومساعدة الفقراء."]]}, {"l": "Act 9:39", "n": "", "vs": [[39, "فقام وذهب. ولما وصل قادوه إلى الطبقة العليا، فتقدمت إليه جميع الأرامل باكيات، يعرضن بعض الأقمصة والثياب مما كانت غزالة تخيطه وهي معهن."]]}, {"l": "Eph 2:10", "n": "", "vs": [[10, "فإننا نحن تحفة الله، وقد خلقنا في المسيح يسوع لأعمال صالحة أعدها سلفا لنسلك فيها."]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Tit 3:8", "n": "", "vs": [[8, "صادق هذا القول! وأريد أن تقرر هذه الأمور قرارا حاسما، حتى يهتم الذين آمنوا بالله بأن يجتهدوا في الأعمال الصالحة. هذه الأمور حسنة ونافعة للناس."]]}, {"l": "1Pe 2:12", "n": "", "vs": [[12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالحة يمجدون الله في يوم الافتقاد."]]}, {"l": "2Pe 1:6-8", "n": "", "vs": [[6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"], [7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."], [8, "فحين تكون هذه الصفات الطيبة في داخلكم، وتزداد بوفرة، تجعلكم مجتهدين ومثمرين في معرفتكم لربنا يسوع المسيح."]]}, {"l": "Rev 2:19", "n": "", "vs": [[19, "إني عالم بأعمالك، ومحبتك، وإيمانك، وتضحيتك، وصبرك؛ وأعلم أن أعمالك الأخيرة زادت عما كانت عليه قبلا!"]]}], "kwAr": "بالأعمال الصالحة", "noteAr": ""}], "arS": [["بل بما ", []], ["يليق", ["G4241"]], [" ", []], ["بنساء", ["G1135"]], [" ", []], ["يعترفن", ["G1861"]], [" علنا بأنهن يعشن في ", []], ["تقوى الله", ["G2317"]], ["، ", []], ["بالأعمال", ["G2041"]], [" ", []], ["الصالحة", ["G18"]], ["!", []]]}, {"c": 2, "v": 11, "text": "على المرأة أن تتلقى التعليم بسكوت وبكل خضوع.", "groups": [{"kw": "", "raw": "Gen_3:16; Est_1:20; 1Co_11:3, 1Co_14:34, 1Co_14:35; Eph_5:22-24; Col_3:18; 1Pe_3:1, 1Pe_3:5, 1Pe_3:6", "note": "", "refs": [{"l": "Gen 3:16", "n": "", "vs": [[16, "ثم قال للمرأة: «أكثر تكثيرا أوجاع مخاضك فتنجبين بالآلام أولادا، وإلى زوجك يكون اشتياقك وهو يتسلط عليك»."]]}, {"l": "Est 1:20", "n": "", "vs": [[20, "وهكذا يذيع أمر الملك الصادر عنه في كل أرجاء مملكته الشاسعة، فتعامل جميع النساء أزواجهن صغارا وكبارا باحترام»."]]}, {"l": "1Co 11:3", "n": "", "vs": [[3, "ولكني أريد أن تعلموا أن المسيح هو الرأس لكل رجل؛ أما رأس المرأة فهو الرجل، ورأس المسيح هو الله ."]]}, {"l": "1Co 14:34", "n": "", "vs": [[34, "لتصمت النساء في الكنائس، فليس مسموحا لهن أن يتكلمن، بل عليهن أن يكن خاضعات، على حد ما توصي به الشريعة أيضا."]]}, {"l": "1Co 14:35", "n": "", "vs": [[35, "ولكن، إذا رغبن في تعلم شيء ما، فليسألن أزواجهن في البيت، لأنه عار على المرأة أن تتكلم في الجماعة."]]}, {"l": "Eph 5:22-24", "n": "", "vs": [[22, "أيتها الزوجات، اخضعن لأزواجكن، كما للرب."], [23, "فإن الزوج هو رأس الزوجة كما أن المسيح أيضا هو رأس الكنيسة (جسده)، وهو نفسه مخلص الجسد."], [24, "فكما أن الكنيسة قد أخضعت للمسيح، فكذلك الزوجات أيضا لأزواجهن، في كل شيء."]]}, {"l": "Col 3:18", "n": "", "vs": [[18, "أيتها الزوجات اخضعن لأزواجكن كما يليق (بالعيشة) في الرب."]]}, {"l": "1Pe 3:1", "n": "", "vs": [[1, "كذلك، أيتها الزوجات، اخضعن لأزواجكن. حتى وإن كان الزوج غير مؤمن بالكلمة، تجذبه زوجته إلى الإيمان، بتصرفها اللائق دون كلام،"]]}, {"l": "1Pe 3:5", "n": "", "vs": [[5, "وبها كانت تتزين النساء التقيات قديما، فكانت الواحدة منهن تتكل على الله وتخضع لزوجها."]]}, {"l": "1Pe 3:6", "n": "", "vs": [[6, "فسارة، مثلا، كانت تطيع زوجها إبراهيم وتدعوه «سيدي». والمؤمنات اللواتي يقتدين بها، يثبتن أنهن بنات لها، إذ يتصرفن تصرفا صالحا، فلا يخفن أي تهديد."]]}], "kwAr": "", "noteAr": ""}], "arS": [["على ", []], ["المرأة", ["G1135"]], [" أن ", []], ["تتلقى التعليم", ["G3129"]], [" ", []], ["بسكوت", ["G2271"]], [" ", []], ["وبكل", ["G3956"]], [" ", []], ["خضوع", ["G5292"]], [".", []]]}, {"c": 2, "v": 12, "text": "ولست أسمح للمرأة أن تعلم ولا تتسلط على الرجل. بل عليها أن تلزم السكوت.", "groups": [], "arS": [["ولست ", []], ["أسمح", ["G2010"]], [" ", []], ["للمرأة", ["G1135"]], [" أن ", []], ["تعلم", ["G1321"]], [" ولا ", []], ["تتسلط", ["G831"]], [" على ", []], ["الرجل", ["G435"]], [". بل عليها أن تلزم ", []], ["السكوت", ["G2271"]], [".", []]]}, {"c": 2, "v": 13, "text": "ذلك لأن آدم كون أولا، ثم حواء:", "groups": [{"kw": "", "raw": "Gen_1:27, Gen_2:7, Gen_2:18, Gen_2:22; 1Co_11:8, 1Co_11:9", "note": "", "refs": [{"l": "Gen 1:27", "n": "", "vs": [[27, "فخلق الله الإنسان على صورته. على صورة الله خلقه. ذكرا وأنثى خلقهم."]]}, {"l": "Gen 2:7", "n": "", "vs": [[7, "ثم جبل الرب الإله آدم من تراب الأرض ونفخ في أنفه نسمة حياة، فصار آدم نفسا حية."]]}, {"l": "Gen 2:18", "n": "", "vs": [[18, "ثم قال الرب الإله: «ليس مستحسنا أن يبقى آدم وحيدا. سأصنع له معينا مشابها له»."]]}, {"l": "Gen 2:22", "n": "", "vs": [[22, "وعمل من هذه الضلع امرأة أحضرها إلى آدم."]]}, {"l": "1Co 11:8", "n": "", "vs": [[8, "فإن الرجل لم يؤخذ من المرأة، بل المرأة أخذت من الرجل؛"]]}, {"l": "1Co 11:9", "n": "", "vs": [[9, "والرجل لم يوجد لأجل المرأة، بل المرأة وجدت لأجل الرجل."]]}], "kwAr": "", "noteAr": ""}], "arS": [["ذلك لأن ", []], ["آدم", ["G76"]], [" ", []], ["كون", ["G4111"]], [" ", []], ["أولا", ["G4413"]], ["، ", []], ["ثم", ["G1534"]], [" ", []], ["حواء", ["G2096"]], [":", []]]}, {"c": 2, "v": 14, "text": "ولم يكن آدم هو الذي انخدع (بمكر الشيطان)، بل المرأة انخدعت، فوقعت في المعصية.", "groups": [{"kw": "", "raw": "Gen_3:6, Gen_3:12; 2Co_11:3", "note": "", "refs": [{"l": "Gen 3:6", "n": "", "vs": [[6, "وعندما شاهدت المرأة أن الشجرة لذيذة للمأكل وشهية للعيون، ومثيرة للنظر قطفت من ثمرها وأكلت، ثم أعطت زوجها أيضا فأكل معها،"]]}, {"l": "Gen 3:12", "n": "", "vs": [[12, "فأجاب آدم: «إنها المرأة التي جعلتها رفيقة لي. هي التي أطعمتني من ثمر الشجرة، فأكلت»."]]}, {"l": "2Co 11:3", "n": "", "vs": [[3, "غير أني أخشى أن تضلل عقولكم عن الإخلاص والطهارة تجاه المسيح مثلما أغوت الحية بمكرها حواء."]]}], "kwAr": "", "noteAr": ""}], "arS": [["ولم يكن ", []], ["آدم", ["G76"]], [" هو الذي ", []], ["انخدع", ["G538"]], [" (بمكر الشيطان)، بل ", []], ["المرأة", ["G1135"]], [" ", []], ["انخدعت", ["G538"]], ["، ", []], ["فوقعت", ["G1096"]], [" في ", []], ["المعصية", ["G3847"]], [".", []]]}, {"c": 2, "v": 15, "text": "إلا أنها ستحفظ سالمة في ولادة الأولاد، على أن يثبتن في الإيمان والمحبة والقداسة مع الرزانة!", "groups": [{"kw": "she", "raw": "Gen_3:15; Isa_7:14, Isa_9:6; Jer_31:22; Mat_1:21-25; Luk_2:7, Luk_2:10,Luk_2:11; Gal_4:4, Gal_4:5", "note": "", "refs": [{"l": "Gen 3:15", "n": "", "vs": [[15, "وأثير عداوة دائمة بينك وبين المرأة، وكذلك بين نسليكما. هو يسحق رأسك وأنت تلدغين عقبه»."]]}, {"l": "Isa 7:14", "n": "", "vs": [[14, "ولكن السيد نفسه يعطيكم آية: ها العذراء تحبل وتلد ابنا، وتدعو اسمه عمانوئيل."]]}, {"l": "Isa 9:6", "n": "", "vs": [[6, "لأنه يولد لنا ولد ويعطى لنا ابن يحمل الرياسة على كتفه، ويدعى اسمه عجيبا، مشيرا، إلها قديرا، أبا أبديا، رئيس السلام."]]}, {"l": "Jer 31:22", "n": "", "vs": [[22, "إلى متى تظلين هائمة على وجهك أيتها الابنة الغادرة؟ قد خلق الرب شيئا جديدا في الأرض: أنثى تحمي رجلا»."]]}, {"l": "Mat 1:21-25", "n": "", "vs": [[21, "فستلد ابنا، وأنت تسميه يسوع، لأنه هو الذي يخلص شعبه من خطاياهم»."], [22, "حدث هذا كله ليتم ما قاله الرب بلسان النبي القائل:"], [23, "«ها إن العذراء تحبل، وتلد ابنا، ويدعى عمانوئيل!» أي «الله معنا»."], [24, "ولما نهض يوسف من نومه، فعل ما أمره به الملاك الذي من الرب؛ فأتى بعروسه إلى بيته."], [25, "ولكنه لم يدخل بها حتى ولدت ابنا، فسماه يسوع."]]}, {"l": "Luk 2:7", "n": "", "vs": [[7, "فولدت ابنها البكر، ولفته بقماط، وأنامته في مذود، إذ لم يكن لهما متسع في المنزل."]]}, {"l": "Luk 2:10", "n": "", "vs": [[10, "فقال لهم الملاك: «لا تخافوا! فها أنا أبشركم بفرح عظيم يعم الشعب كله:"]]}, {"l": "Luk 2:11", "n": "", "vs": [[11, "فقد ولد لكم اليوم في مدينة داود مخلص هو المسيح الرب."]]}, {"l": "Gal 4:4", "n": "", "vs": [[4, "ولكن لما جاء تمام الزمان، أرسل الله ابنه، وقد ولد من امرأة وكان خاضعا للشريعة،"]]}, {"l": "Gal 4:5", "n": "", "vs": [[5, "ليحرر بالفداء أولئك الخاضعين للشريعة، فننال جميعا مقام أبناء الله."]]}], "kwAr": "إلا أنها", "noteAr": ""}, {"kw": "in childbearing", "raw": "Gen_3:16", "note": "", "refs": [{"l": "Gen 3:16", "n": "", "vs": [[16, "ثم قال للمرأة: «أكثر تكثيرا أوجاع مخاضك فتنجبين بالآلام أولادا، وإلى زوجك يكون اشتياقك وهو يتسلط عليك»."]]}], "kwAr": "في ولادة الأولاد", "noteAr": ""}, {"kw": "in faith", "raw": "1Ti_1:5", "note": "", "refs": [{"l": "1Ti 1:5", "n": "", "vs": [[5, "أما الغاية مما أوصيتك به، فهي المحبة النابعة من قلب طاهر وضمير صالح وإيمان خال من الرياء."]]}], "kwAr": "في الإيمان والمحبة", "noteAr": ""}, {"kw": "sobriety", "raw": "1Ti_2:9; Tit_2:12; 1Pe_4:7", "note": "", "refs": [{"l": "1Ti 2:9", "n": "", "vs": [[9, "كما أريد أيضا، أن تظهر النساء بمظهر لائق محشوم اللباس، متزينات بالحياء والرزانة، غير متحليات بالجدائل والذهب واللاليء والحلل الغالية الثمن،"]]}, {"l": "Tit 2:12", "n": "", "vs": [[12, "وهي تعلمنا أن ن  قائلا: إنني أتنبأ لكم بالخمر الوفير والمسكر، فإنه يصبح نبي هذا الشعب."]]}, {"l": "Mat 24:45-51", "n": "", "vs": [[45, "فمن هو إذن ذلك العبد الأمين والحكيم الذي أقامه سيده على أهل بيته ليقدم لهم الطعام في أوانه؟"], [46, "طوبى لذلك العبد الذي يأتي سيده فيجده يقوم بعمله."], [47, "الحق أقول لكم: إنه سيقيمه على ممتلكاته كلها."], [48, "ولكن إذا قال ذلك العبد الشرير في قلبه: سيتأخر سيدي في رجوعه!"], [49, "وبدأ يضرب زملاءه العبيد ويأكل ويشرب مع السكيرين،"], [50, "فإن سيد ذلك العبد لابد أن يرجع في يوم لا يتوقعه، وساعة لا يعرفها،"], [51, "فيفصله ويجعل نصيبه مع المرائين، هناك يكون البكاء وصرير الأسنان!"]]}, {"l": "Luk 12:42-46", "n": "", "vs": [[42, "فقال الرب: «من هو إذن الوكيل الأمين العاقل الذي يقيمه سيده على أهل بيته ليقدم لهم حصتهم من الطعام في حينها؟"], [43, "طوبى لذلك العبد الذي يجده سيده ، لدى رجوعه ، يقوم بهذا العمل."], [44, "الحق أقول لكم: إنه يقيمه على جميع ممتلكاته."], [45, "ولكن إذا قال ذلك العبد في نفسه: سيدي سيتأخر في رجوعه؛ وأخذ يضرب الخادمين والخادمات ويأكل ويشرب ويسكر،"], [46, "فإن سيد ذلك العبد يرجع في يوم لا يتوقعه وساعة لا يعرفها، فيمزقه ويجعل مصيره مع الخائنين."]]}, {"l": "Luk 21:34-36", "n": "", "vs": [[34, "ولكن احذروا لأنفسكم لئلا تتثقل قلوبكم بالانغماس في اللذات وبالسكر وهموم الحياة، فيدهمكم ذلك اليوم فجأة؛"], [35, "فإنه سوف يطبق كالفخ على جميع الساكنين على وجه الأرض كلها."], [36, "فاسهروا إذن وتضرعوا في كل حين، لكي تتمكنوا من أن تنجوا من جميع هذه الأمور التي هي على وشك أن تحدث، وتقفوا أمام ابن الإنسان»."]]}, {"l": "Eph 5:18", "n": "", "vs": [[18, "لا تسكروا بالخمر، ففيها الخلاعة، وإنما امتلئوا بالروح،"]]}, {"l": "Tit 1:7", "n": "", "vs": [[7, "وذلك لأن الناظر يجب أن يكون بريئا من كل تهمة باعتباره وكيلا لله، لا معجبا بنفسه ولا حاد الطبع، ولا مدمن الخمر، ولا عنيفا، ولا ساعيا إلى المكسب الخسيس؛"]]}, {"l": "Tit 2:3", "n": "", "vs": [[3, "وكذلك أن تكون العجائز ذوات سيرة موافقة للقداسة، غير نمامات ولا مدمنات للخمر، بل معلمات لما هو صالح،"]]}], "kwAr": "لا مدمنا للخمر", "noteAr": "أو: غير مستعد للمشاجرة والإساءة كمن هو في الخمر."}, {"kw": "no", "raw": "2Ti_2:24, 2Ti_2:25; Tit_1:7", "note": "", "refs": [{"l": "2Ti 2:24", "n": "", "vs": [[24, "وعبد الرب يجب ألا يتشاجر، بل أن يكون مترفقا تجاه الجميع، قادرا على التعليم، يتحمل المشقات بصبر،"]]}, {"l": "2Ti 2:25", "n": "", "vs": [[25, "ويؤدب بالوداعة مقاومي الإيمان، عسى أن يمنحهم الله التوبة، فيعرفوا الحق بالتمام،"]]}, {"l": "Tit 1:7", "n": "", "vs": [[7, "وذلك لأن الناظر يجب أن يكون بريئا من كل تهمة باعتباره وكيلا لله، لا معجبا بنفسه ولا حاد الطبع، ولا مدمن الخمر، ولا عنيفا، ولا ساعيا إلى المكسب الخسيس؛"]]}], "kwAr": "ولا عنيفا", "noteAr": ""}, {"kw": "not greedy", "raw": "Pro_1:19, Pro_15:27; Isa_56:11; Jud_1:11", "note": "", "refs": [{"l": "Pro 1:19", "n": "", "vs": [[19, "هذا هو مصير كل من يثرى ظلما، فإن الثراء الحرام يذهب بحياة قانيه."]]}, {"l": "Pro 15:27", "n": "", "vs": [[27, "الحريص على الكسب يجلب المتاعب لبيته، ومن يكره الرشوة يحيا."]]}, {"l": "Isa 56:11", "n": "", "vs": [[11, "هم كلاب نهمة لا تعرف الشبع، ورعاة أيضا مجردون من الفهم، كل مال إلى طريقه طمعا في الربح،"]]}, {"l": "Jud 1:11", "n": "", "vs": [[11, "الويل لهم! لأنهم سلكوا طريق قايين، واندفعوا إلى ارتكاب خطيئة بلعام طلبا للمال، وتمردوا كما تمرد قورح، فدمروا أنفسهم."]]}], "kwAr": "غير مولع بالمال", "noteAr": ""}, {"kw": "filthy", "raw": "1Ti_3:8; 1Sa_8:3; Tit_1:7, Tit_1:11; 1Pe_5:2", "note": "", "refs": [{"l": "1Ti 3:8", "n": "", "vs": [[8, "أما المدبرون، فيجب أن يكونوا أيضا ذوي رصانة، لا ذوي لسانين، ولا مدمنين للخمر، لا ساعين إلى المكسب الخسيس."]]}, {"l": "1Sa 8:3", "n": "", "vs": [[3, "غير أنهما لم يسلكا في طريقه، بل غويا وراء المكسب وقبلا الرشوة وحابيا في القضاء."]]}, {"l": "Tit 1:7", "n": "", "vs": [[7, "وذلك لأن الناظر يجب أن يكون بريئا من كل تهمة باعتباره وكيلا لله، لا معجبا بنفسه ولا حاد الطبع، ولا مدمن الخمر، ولا عنيفا، ولا ساعيا إلى المكسب الخسيس؛"]]}, {"l": "Tit 1:11", "n": "", "vs": [[11, "هؤلاء يجب أن تسد أفواههم: فهم يخربون بيوتا بجملتها، إذ يعلمون تعاليم يجب ألا تعلم، في سبيل مكسب خسيس."]]}, {"l": "1Pe 5:2", "n": "", "vs": [[2, "ارعوا قطيع الله الذي بينكم، كحراس له، لا بدافع الواجب، بل بدافع التطوع، كما يريد الله ، ولا رغبة في الربح الدنيء، بل رغبة في الخدمة بنشاط."]]}], "kwAr": "المكسب", "noteAr": ""}, {"kw": "patient", "raw": "1Ti_6:11; Ecc_7:8; 1Th_5:14; 2Ti_2:24; Rev_1:9", "note": "", "refs": [{"l": "1Ti 6:11", "n": "", "vs": [[11, "وأما أنت، ياإنسان الله، فاهرب من هذه الأمور، واسع في إثر البر والتقوى والإيمان والمحبة والصبر والوداعة."]]}, {"l": "Ecc 7:8", "n": "", "vs": [[8, "نهاية أمر خير من بدايته، والصبر خير من العجرفة."]]}, {"l": "1Th 5:14", "n": "", "vs": [[14, "إلا أننا نناشدكم، أيها الإخوة، أن تعظوا الفوضويين، وتشددوا فاقدي العزم، وتساندوا الضعفاء، وتعاملوا الجميع بطول البال."]]}, {"l": "2Ti 2:24", "n": "", "vs": [[24, "وعبد الرب يجب ألا يتشاجر، بل أن يكون مترفقا تجاه الجميع، قادرا على التعليم، يتحمل المشقات بصبر،"]]}, {"l": "Rev 1:9", "n": "", "vs": [[9, "أنا، يوحنا أخاكم وشريككم في الضيقة والملكوت والصبر في يسوع، كنت منفيا في الجزيرة التي تسمى بطمس، لأجل كلمة الله وشهادة يسوع."]]}], "kwAr": "بل لطيفا", "noteAr": ""}, {"kw": "a brawler", "raw": "Tit_3:2; Jam_4:1 *marg.", "note": "", "refs": [{"l": "Tit 3:2", "n": "", "vs": [[2, "ولا يقولوا سوءا في أحد، ولا يكونوا مخاصمين، بل لطفاء يعاملون الجميع بوداعة تامة."]]}, {"l": "Jam 4:1", "n": "*marg.", "vs": [[1, "من أين النزاع والخصام بينكم؟ أليس من لذاتكم تلك المتصارعة في أعضائكم؟"]]}], "kwAr": "غير متعود الخصام", "noteAr": ""}, {"kw": "not covetous", "raw": "1Sa_2:15-17; 2Ki_5:20-27; Jer_6:13, Jer_8:10; Mic_3:5, Mic_3:11; Mal_1:10; Mat_21:13; Joh_10:12, Joh_10:13, Joh_12:5, Joh_12:6; Act_8:18-21, Act_20:33; Rom_16:18; 2Pe_2:3, 2Pe_2:14, 2Pe_2:15; Rev_18:11-13", "note": "", "refs": [{"l": "1Sa 2:15-17", "n": "", "vs": [[15, "كذلك كان خادم الكاهن يأتي إلى ذابح القربان ويقول له قبل إحراق الشحم: «أعط لحما للكاهن حتى يشوى، فإنه لا يقبل منك لحما مطبوخا بل نيئا»."], [16, "فيجيبه الرجل: «ليحرقوا أولا شحم الذبيحة، ثم خذ ما تشتهيه نفسك». فيقول الخادم: «لا، بل أعطني الآن اللحم وإلا آخذه بالرغم عنك»."], [17, "فعظمت خطيئة أبناء عالي أمام الرب، لأن الشعب استهان بذبيحة الرب من جراء تصرفاتهما."]]}, {"l": "2Ki 5:20-27", "n": "", "vs": [[20, "حتى حدث جيحزي خادم أليشع نفسه: «سيدي امتنع عن قبول ما أحضره نعمان من هدايا. حي هو الرب لأسرعن وراءه وآخذ منه شيئا»."], [21, "فلحق جيحزي بنعمان. ولما أبصره نعمان راكضا نحوه، ترجل عن المركبة للقائه سائلا: «أللخير جئت؟»"], [22, "فأجاب: «للخير. إن سيدي قد أرسلني قائلا: إن رجلين من جبل أفرايم من بني الأنبياء جاءاه، فأرجوك أن تعطيهما وزنة من الفضة وحلتي ثياب»."], [23, "فقال نعمان: «أرجوك أن تأخذ وزنتين» وألح عليه، وصرهما في كيسين وحلتي ثياب، وأعطاهما لرجلين من رجاله، فحملاهما وانطلقا أمام جيحزي."], [24, "وعندما وصل إلى الأكمة حيث يقيم أليشع أخذها منهما وأخفاها في البيت، وصرف الرجلين."], [25, "ثم دخل إلى أليشع، فسأله: «من أين جئت ياجيحزي؟» فأجاب: «لم يذهب عبدك إلى أي مكان»."], [26, "فقال له: «ألا تعرف أن قلبي كان حاضرا هناك حين ترجل الرجل من مركبته للقائك؟ أهذا وقت الحصول على فضة أو أخذ ثياب وزيتون وكروم وغنم وبقر وعبيد وجوار؟"], [27, "فليحل برص نعمان بك وبنسلك إلى الأبد». فخرج من أمامه وجلده أبرص في لون الثلج."]]}, {"l": "Jer 6:13", "n": "", "vs": [[13, "لأنهم جميعا، صغارهم وكبارهم، مولعون بالربح الحرام. حتى النبي والكاهن يرتكبان الزور في أعمالهما."]]}, {"l": "Jer 8:10", "n": "", "vs": [[10, "لذلك أعطي نساءهم لآخرين وحقولهم للوارثين القاهرين، لأنهم جميعا من صغيرهم إلى كبيرهم مولعون بالربح. حتى النبي والكاهن يرتكبان الزور في أعمالهما،"]]}, {"l": "Mic 3:5", "n": "", "vs": [[5, "وهذا ما يقوله الرب بشأن الأنبياء الذين يضلون شعبه، الذين ينادون قائلين: «سلام» لمن يعطيهم طعاما، ويعلنون الحرب على من لا يلقم أفواههم."]]}, {"l": "Mic 3:11", "n": "", "vs": [[11, "إذ يحكم رؤساؤها بالرشوة، وكهنتها يعلمون بالأجرة ويتعاطى أنبياؤها العرافة لقاء المال، ومع ذلك يدعون الاتكال على الله قائلين: «أليس الرب في وسطنا؟ لذلك لن يصيبنا مكروه»."]]}, {"l": "Mal 1:10", "n": "", "vs": [[10, "آه، ياليت بينكم من يغلق أبواب الهيكل لئلا توقدوا نارا باطلة على مذبحي، يقول الرب القدير: إذ لا مسرة لي بكم ولا أرضى بتقدمة من أيديكم."]]}, {"l": "Mat 21:13", "n": "", "vs": [[13, "وقال لهم: «مكتوب: إن بيتي بيتا للصلاة يدعى. أما أنتم فجعلتموه مغارة لصوص!»"]]}, {"l": "Joh 10:12", "n": "", "vs": [[12, "وليس الأجير كالراعي، لأن الخراف ليست ملكه. فعندما يرى الذئب قادما، يترك الخراف لينجو بنفسه، فيخطف الذئب الخراف ويبددها."]]}, {"l": "Joh 10:13", "n": "", "vs": [[13, "إنه يهرب لأنه أجير ولا يبالي بالخراف!"]]}, {"l": "Joh 12:5", "n": "", "vs": [[5, "«لماذا لم يبع هذا العطر بثلاث مئة دينار توزع على الفقر اء؟»"]]}, {"l": "Joh 12:6", "n": "", "vs": [[6, "ولم يقل هذا لأنه كان يعطف على الفقراء، بل لأنه كان لصا، فقد كان أمينا للصندوق وكان يختلس مما يودع فيه."]]}, {"l": "Act 8:18-21", "n": "", "vs": [[18, "ولما رأى سيمون أن الروح القدس قد حل على المؤمنين لما وضع الرسولان أيديهما عليهم، عرض على بطرس ويوحنا بعض المال، وقال لهما:"], [19, "«أعطياني أنا أيضا هذه السلطة لكي ينال الروح القدس من أضع عليه يدي»."], [20, "فقال له بطرس: «لتبق لك فضتك لهلاكك! لأنك ظننت أنك تقدر أن تشتري هبة الله بالمال!"], [21, "لا قسمة لك في هذا الأمر ولا نصيب، لأن قلبك ليس مخلصا تجاه الله."]]}, {"l": "Act 20:33", "n": "", "vs": [[33, "ما اشتهيت يوما فضة ولا ذهبا ولا ثوبا من عند أحد."]]}, {"l": "Rom 16:18", "n": "", "vs": [[18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."]]}, {"l": "2Pe 2:3", "n": "", "vs": [[3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "2Pe 2:14", "n": "", "vs": [[14, "عيونهم لا تنظر إلا نظرات الزنى، ولا تشبع من الخطيئة. وكم من نفوس ضعيفة تقع في فخاخهم! أما قلوبهم، فقد تدربت على الشهوة والطمع. إنهم حقا أبناء اللعنة!"]]}, {"l": "2Pe 2:15", "n": "", "vs": [[15, "وإذ خرجوا عن الطريق المستقيم، ضلوا. فهم سائرون في طريق بلعام بن بعور، الذي أحب الحصول على المال أجرة لإثمه."]]}, {"l": "Rev 18:11-13", "n": "", "vs": [[11, "وسيبكي تجار الأرض ويحزنون عليها، لأنه لم يبق أحد ليشتري بضائعهم،"], [12, "فقد كانت هي تشتري منهم الذهب والفضة والحجارة الكريمة واللؤلؤ، والكتان والأرجوان والحرير والقرمز، وجميع الأخشاب العطرة وأدوات العاج والمصنوعات الخشبية الثمينة، والنحاس والحديد والرخام،"], [13, "والقرفة والبهار، والعطور والطيب والبخور، والخمر والزيت والدقيق والحبوب، والبهائم والغنم، والخيل والمركبات، والأجساد والنفوس البشرية"]]}], "kwAr": "غير مولع بالمال", "noteAr": ""}], "arS": [["لا ", []], ["مدمنا للخمر", ["G3943"]], [" ولا ", []], ["عنيفا", ["G4131"]], ["؛ بل ", []], ["لطيفا", ["G1933"]], ["، غير ", []], ["متعود الخصام", ["G269"]], ["، غير ", []], ["مولع بالمال", ["G866"]], ["،", []]]}, {"c": 3, "v": 4, "text": "يحسن تدبير بيته، ويربي أولاده في الخضوع بكل احترام.", "groups": [{"kw": "ruleth", "raw": "1Ti_3:12; Gen_18:19; Jos_24:15; Psa_101:2-8; Act_10:2; Tit_1:6", "note": "", "refs": [{"l": "1Ti 3:12", "n": "", "vs": [[12, "كما يجب أن يكون كل مدبر زوجا لامرأة واحدة، يحسن تدبير أولاده وبيته."]]}, {"l": "Gen 18:19", "n": "", "vs": [[19, "لأنني قد اخترته ليوصي بنيه وأهل بيته من بعده كي يحفظوا طريق الرب، عاملين البر والعدل، حتى ينجز الرب ما وعد به إبراهيم»."]]}, {"l": "Jos 24:15", "n": "", "vs": [[15, "وإن ساءكم أن تعبدوا الرب، فاختاروا لأنفسكم اليوم من تعبدون سواء من الآلهة التي عبدها آباؤكم الذين استوطنوا شرقي نهر الفرات أم آلهة الأموريين الذين أنتم مقيمون في أرضهم. أما أنا وبيتي فنعبد الرب»."]]}, {"l": "Psa 101:2-8", "n": "", "vs": [[2, "أسلك بتعقل في طريق الكمال. متى تأتي يارب لمعونتي؟ أسلك في وسط بيتي باستقامة قلبي."], [3, "لن أضع نصب عيني أمرا باطلا، فإني أبغض عمل الضالين لئلا يلتصق بي."], [4, "ليفارقني القلب المنحرف فلا أرتكب شرا."], [5, "أبيد كل من يغتاب قريبه سرا؛ وذو العين المتشامخة والقلب المتكبر لا أحتمله."], [6, "ترعى عيناي الأمناء في الأرض ليسكنوا معي. وخدامي هم السالكون في طريق الكمال."], [7, "لا يقيم داخل بيتي الغشاشون، والكذبة لا يمثلون أمامي."], [8, "أقضي في كل صباح على جميع الأشرار في أرضنا، حتى أستأصل من مدينة الرب كل فاعلي الإثم."]]}, {"l": "Act 10:2", "n": "", "vs": [[2, "وكان تقيا يخاف الله ، هو وأهل بيته جميعا، يتصدق على الشعب كثيرا، ويصلي إلى الله دائما."]]}, {"l": "Tit 1:6", "n": "", "vs": [[6, "على أن يكون الواحد منهم بريئا من كل تهمة، زوجا لامرأة واحدة، أبا لأولاد مؤمنين لا يتهمون بالخلاعة والتمرد."]]}], "kwAr": "يحسن تدبير بيته", "noteAr": ""}, {"kw": "with", "raw": "Phi_4:8 *Gr: Tit_2:2, Tit_2:7", "note": "", "refs": [{"l": "Phi 4:8", "n": "*Gr:", "vs": [[8, "وختاما، أيها الإخوة: كل ما كان حقا، وكل ما كان شريفا، وكل ما كان عادلا، وكل ما كان طاهرا وكل ما كان مستحبا، وكل ما كان حسن السمعة، وكل ما كان فيه فضيلة وخصلة حميدة، فاشغلوا أفكاركم به."]]}, {"l": "Tit 2:2", "n": "", "vs": [[2, "أن يكون الشيوخ ذوي رزانة ووقار، متعقلين، صحيحي الإيمان والمحبة والصبر."]]}, {"l": "Tit 2:7", "n": "", "vs": [[7, "جاعلا من نفسك في كل شيء قدوة للأعمال الصالحة، مظهرا في تعليمك النقاوة والوقار"]]}], "kwAr": "بكل احترام", "noteAr": ""}], "arS": [["يحسن", ["G2573"]], [" ", []], ["تدبير", ["G4291"]], [" ", []], ["بيته", ["G3624"]], ["، ويربي ", []], ["أولاده", ["G5043"]], [" في ", []], ["الخضوع", ["G5292"]], [" بكل ", []], ["احترام", ["G4587"]], [".", []]]}, {"c": 3, "v": 5, "text": "فإن كان أحد لا يحسن تدبير بيته، فكيف يعتني بكنيسة الله؟", "groups": [{"kw": "if", "raw": "1Sa_2:29, 1Sa_2:30, 1Sa_3:13", "note": "", "refs": [{"l": "1Sa 2:29", "n": "", "vs": [[29, "فلماذا تحتقرون ذبيحتي وتقدمتي التي أمرت بها للمسكن، وتفضل ابنيك عني لتكدسوا الشحم على أبدانكم، مما تخيرتموه من قرابين شعبي؟"]]}, {"l": "1Sa 2:30", "n": "", "vs": [[30, "لذلك يقول الرب إله إسرائيل: لقد وعدت أن يظل بيتك وبيت أبيك يخدمون في محضري إلى الأبد. أما الآن، يقول الرب: فحاشا لي أن أفعل ذلك، لأنني أكرم الذين يكرمونني، أما الذين يحتقرونني فيصغرون."]]}, {"l": "1Sa 3:13", "n": "", "vs": [[13, "وقد أنبأته بأنني سأدين بيته إلى الأبد، على الشر الذي يعلم أن ابنيه قد أوجبا به اللعنة على نفسيهما، فلم يردعهما."]]}], "kwAr": "فإن كان أحد", "noteAr": ""}, {"kw": "the church", "raw": "1Ti_3:15; Act_20:28; Eph_1:22, Eph_5:24, Eph_5:32", "note": "", "refs": [{"l": "1Ti 3:15", "n": "", "vs": [[15, "حتى إذا تأخرت تعلم كيف يجب التصرف في بيت الله، أي كنيسة الله الحي، ركن الحق ودعامته."]]}, {"l": "Act 20:28", "n": "", "vs": [[28, "فاسهروا إذن على أنفسكم وعلى جميع القطيع الذي عينكم بينه الروح القدس نظارا، لترعوا كنيسة الله التي اشتراها بدمه."]]}, {"l": "Eph 1:22", "n": "", "vs": [[22, "وأخضع كل شيء تحت قدميه، وإياه جعل فوق كل شيء رأسا للكنيسة"]]}, {"l": "Eph 5:24", "n": "", "vs": [[24, "فكما أن الكنيسة قد أخضعت للمسيح، فكذلك الزوجات أيضا لأزواجهن، في كل شيء."]]}, {"l": "Eph 5:32", "n": "", "vs": [[32, "هذا السر عظيم ولكنني أشير به إلى المسيح والكنيسة!"]]}], "kwAr": "بكنيسة الله", "noteAr": ""}], "arS": [["فإن كان ", []], ["أحد", ["G5100"]], [" لا ", []], ["يحسن", ["G1492"]], [" ", []], ["تدبير", ["G4291"]], [" ", []], ["بيته", ["G3624"]], ["، ", []], ["فكيف", ["G4459"]], [" ", []], ["يعتني", ["G1959"]], [" ", []], ["بكنيسة", ["G1577"]], [" ", []], ["الله", ["G2316"]], ["؟", []]]}, {"c": 3, "v": 6, "text": "ويجب أيضا أن لا يكون مبتدئا في الإيمان، لئلا ينتفخ تكبرا، فيقع في جريمة إبليس!", "groups": [{"kw": "novice", "raw": "or, one newly come to the faith, 1Co_3:1; Heb_5:12, Heb_5:13; 1Pe_2:2", "note": "or, one newly come to the faith, 1Co_3:1; Heb_5:12, Heb_5:13; 1Pe_2:2", "refs": [{"l": "1Co 3:1", "n": "", "vs": [[1, "على أني، أيها الإخوة، لم أستطع أن أكلمكم باعتباركم روحيين، بل باعتباركم جسديين وأطفالا في المسيح."]]}, {"l": "Heb 5:12", "n": "", "vs": [[12, "كان يجب أن تكونوا الآن قادرين على تعليم الآخرين، بعدما مضى زمان طويل على اهتدائكم. ولكنكم مازلتم بحاجة إلى من يعلمكم حتى المباديء الأساسية لإعلانات الله. ها قد عدتم من جديد تحتاجون إلى اللبن! فأنتم غير قادرين على هضم الطعام القوي."]]}, {"l": "Heb 5:13", "n": "", "vs": [[13, "وكل من يتناول اللبن، يكون عديم الخبرة في التعليم القويم، لأنه مازال طفلا غير ناضج."]]}, {"l": "1Pe 2:2", "n": "", "vs": [[2, "وكأطفال مولودين حديثا، تشوقوا إلى اللبن الروحي النقي لكي تنموا به إلى أن تبلغوا الخلاص،"]]}], "kwAr": "مبتدئا في الإيمان", "noteAr": "أو: حديث العهد بالإيمان."}, {"kw": "lest", "raw": "Deu_8:14, Deu_17:20; 2Ki_14:10; 2Ch_26:16, 2Ch_32:25; Pro_16:18, Pro_16:19, Pro_18:12; Pro_29:23; Isa_2:12; 1Co_4:6-8, 1Co_8:1; 2Co_12:7; 1Pe_5:5", "note": "", "refs": [{"l": "Deu 8:14", "n": "", "vs": [[14, "تتكبر قلوبكم وتنسون الرب إلهكم الذي أطلقكم من نير عبودية ديار مصر،"]]}, {"l": "Deu 17:20", "n": "", "vs": [[20, "لئلا يتكبر على إخوته ويحيد عن الوصية يمينا أو شمالا. فإن فعل ذلك فإنه وذريته يملكون طويلا في وسط إسرائيل."]]}, {"l": "2Ki 14:10", "n": "", "vs": [[10, "لقد هزمت الأدوميين فانتابك الغرور، ولكن خير لك أن تمكث في قصرك وتتمتع بمجد انتصارك. فلماذا تسعى إلى الشر فتجلب الدمار عليك وعلى يهوذا؟»"]]}, {"l": "2Ch 26:16", "n": "", "vs": [[16, "وعندما بلغت قوته أوجها امتلأ قلبه بكبرياء أدت إلى هلاكه، إذ خان الرب ودخل إلى هيكله ليوقد على مذبح البخور."]]}, {"l": "2Ch 32:25", "n": "", "vs": [[25, "ولكن حزقيا لم يتجاوب مع ما أبداه الله نحوه من نعم، إذ امتلأ قلبه كبرياء، فغضب الرب عليه وعلى يهوذا وأورشليم."]]}, {"l": "Pro 16:18", "n": "", "vs": [[18, "قبل الانكسار الكبرياء، وقبل السقوط غطرسة الروح."]]}, {"l": "Pro 16:19", "n": "", "vs": [[19, "اتضاع الروح مع الودعاء خير من اقتسام الغنيمة مع المتكبرين."]]}, {"l": "Pro 18:12", "n": "", "vs": [[12, "قبل الانكسار تشامخ القلب، وقبل الكرامة التواضع."]]}, {"l": "Pro 29:23", "n": "", "vs": [[23, "كبرياء الإنسان تحط من قدره، والمتواضع الروح يحرز كرامة."]]}, {"l": "Isa 2:12", "n": "", "vs": [[12, "فإن للرب القدير يوما فيه يوضع كل متعظم ومتكبر ومتغطرس."]]}, {"l": "1Co 4:6-8", "n": "", "vs": [[6, "فيما سبق، أيها الإخوة، قدمت نفسي وأبلوس إيضاحا لكم، لتتعلموا بنا أن لا تحلقوا بأفكاركم فوق ما قد كتب، فلا يفاخر أحدكم الآخر تحزبا لأحد."], [7, "فمن جعلك متميزا عن غيرك؟ وأي شيء مما لك لم تكن قد أخذته هبة؟ ومادمت قد أخذت، فلماذا تتباهى كأنك لم تأخذ؟"], [8, "إنكم قد شبعتم وقد اغتنيتم! قد صرتم ملوكا وتخليتم عنا! ويا ليتكم ملوك حقا فنشترك معكم في الملك!"]]}, {"l": "1Co 8:1", "n": "", "vs": [[1, "وأما فيما يتعلق بالذبائح المقدمة للأصنام، فنعلم أن المعرفة لجميعنا. غير أن المعرفة تنفخ تكبرا، ولكن المحبة تبني. فمن ظن أنه يعرف شيئا،"]]}, {"l": "2Co 12:7", "n": "", "vs": [[7, "ولكي لا أتكبر بما لهذه الإعلانات من عظمة فائقة، أعطيت شوكة في جسدي كأنها رسول من الشيطان يلطمني كي لا أتكبر!"]]}, {"l": "1Pe 5:5", "n": "", "vs": [[5, "كذلك، أيها الشباب، اخضعوا للشيوخ. البسوا جميعا ثوب التواضع في معاملتكم بعضكم لبعض. لأن الله يقاوم المتكبرين، ولكنه يعطي المتواضعين نعمة."]]}], "kwAr": "لئلا ينتفخ تكبرا", "noteAr": ""}, {"kw": "the condemnation", "raw": "Isa_14:12-14; Luk_10:18; 2Pe_2:4; Jud_1:6", "note": "", "refs": [{"l": "Isa 14:12-14", "n": "", "vs": [[12, "كيف هويت من السماء يازهرة بنت الصبح؟ كيف قطعت وطرحت إلى الأرض ياقاهر الأمم؟"], [13, "قد قلت في قلبك: إني أرتقي إلى السماء وأرفع عرشي فوق كواكب الله، وأجلس على جبل الاجتماع في أقصى الشمال"], [14, "أرتقي فوق أعالي السحاب، وأصبح مثل العلي."]]}, {"l": "Luk 10:18", "n": "", "vs": [[18, "فقال لهم: «قد رأيت الشيطان وهو يهوي من السماء مثل البرق."]]}, {"l": "2Pe 2:4", "n": "", "vs": [[4, "فإن الله لم يشفق على الملائكة الذين أخطأوا، بل طرحهم في أعماق هاوية الظلام مقيدين بالسلاسل، حيث يظلون محبوسين إلى يوم الحساب."]]}, {"l": "Jud 1:6", "n": "", "vs": [[6, "وأما الملائكة الذين لم يحافظوا على مقامهم الرفيع، بل تركوا مركزهم، فمازال الرب يحفظهم مقيدين بسلاسل أبدية في أعماق الظلام، بانتظار دينونة ذلك اليوم العظيم."]]}], "kwAr": "جريمة إبليس", "noteAr": ""}], "arS": [["ويجب أيضا أن لا يكون ", []], ["مبتدئا", ["G3504"]], [" في الإيمان، لئلا ", []], ["ينتفخ تكبرا", ["G5187"]], ["، ", []], ["فيقع", ["G1706"]], [" في ", []], ["جريمة", ["G2917"]], [" ", []], ["إبليس", ["G1228"]], ["!", []]]}, {"c": 3, "v": 7, "text": "ومن الضروري أن تكون له شهادة حسنة من الذين في خارج الكنيسة، لكي لا يقع في العار وفي فخ إبليس.", "groups": [{"kw": "a good", "raw": "1Ti_5:24, 1Ti_5:25; 1Sa_2:24; Act_6:3, Act_10:22, Act_22:12; 3Jo_1:12", "note": "", "refs": [{"l": "1Ti 5:24", "n": "", "vs": [[24, "من الناس من تكون خطاياهم واضحة قبل المحاكمة؛ ومن الناس من لا تظهر خطاياهم إلا بعد المحاكمة."]]}, {"l": "1Ti 5:25", "n": "", "vs": [[25, "وقياسا على ذلك، فإن الأعمال الصالحة تكون واضحة مسبقا؛ والأعمال التي ليست بصالحة، لا يمكن أن تظل مخفية."]]}, {"l": "1Sa 2:24", "n": "", "vs": [[24, "لا، يا بني، فالأخبار التي بلغتني مشينة، إذ إنكم تجعلون الشعب يتعدى على شريعة الرب."]]}, {"l": "Act 6:3", "n": "", "vs": [[3, "فاختاروا، أيها الإخوة، سبعة رجال منكم، لهم شهادة حسنة، ممتلئين من الروح القدس والحكمة، فنعينهم ليقوموا بهذه المهمة."]]}, {"l": "Act 10:22", "n": "", "vs": [[22, "فأجابوه: «قائد المئة كرنيليوس رجل صالح  "n": "", "vs": [[2, "فدعا الرسل الاثنا عشر جماعة التلاميذ وقالوا لهم: «لا يصح أن نترك نحن كلمة الله لنقوم بتوزيع الإعانات!"]]}], "kwAr": "فليباشروا خدمة التدبير", "noteAr": ""}, {"kw": "being", "raw": "1Ti_3:2; 1Co_1:8; Col_1:22; Tit_1:6, Tit_1:7", "note": "", "refs": [{"l": "1Ti 3:2", "n": "", "vs": [[2, "إذن، يجب أن يكون الراعي بلا عيب، زوجا لامرأة واحدة، نبيها عاقلا مهذبا مضيافا، قادرا على التعليم؛"]]}, {"l": "1Co 1:8", "n": "", "vs": [[8, "وهو نفسه سيحفظكم ثابتين إلى النهاية حتى تكونوا بلا عيب في يوم ربنا يسوع المسيح."]]}, {"l": "Col 1:22", "n": "", "vs": [[22, "قد صالحكم الآن في جسد بشرية (ابنه) بالموت. وذلك لكي يحضركم فتمثلوا أمامه وأنتم قديسون بلا ذنب ولا لوم."]]}, {"l": "Tit 1:6", "n": "", "vs": [[6, "على أن يكون الواحد منهم بريئا من كل تهمة، زوجا لامرأة واحدة، أبا لأولاد مؤمنين لا يتهمون بالخلاعة والتمرد."]]}, {"l": "Tit 1:7", "n": "", "vs": [[7, "وذلك لأن الناظر يجب أن يكون بريئا من كل تهمة باعتباره وكيلا لله، لا معجبا بنفسه ولا حاد الطبع، ولا مدمن الخمر، ولا عنيفا، ولا ساعيا إلى المكسب الخسيس؛"]]}], "kwAr": "بلا شكوى", "noteAr": ""}], "arS": [["وأيضا يجب أن يتم ", []], ["اختبار", ["G1381"]], [" ", []], ["المدبرين", ["G3778"]], [" ", []], ["أولا", ["G4412"]], ["، فإذا تبين أنهم ", []], ["بلا شكوى", ["G410"]], ["، ", []], ["فليباشروا خدمة التدبير", ["G1247"]], [".", []]]}, {"c": 3, "v": 11, "text": "كذلك يجب أن تكون النساء أيضا رزينات، غير نمامات، نبيهات، أمينات في كل شيء.", "groups": [{"kw": "their", "raw": "Lev_21:7, Lev_21:13-15; Eze_44:22; Luk_1:5-6; Tit_2:3", "note": "", "refs": [{"l": "Lev 21:7", "n": "", "vs": [[7, "ولا يتزوجوا امرأة زانية أو من غير سبطهم، أو امرأة مطلقة من زوجها، لأنهم مقدسون لإلههم،"]]}, {"l": "Lev 21:13-15", "n": "", "vs": [[13, "ليتزوج من عذراء،"], [14, "لا من أرملة، ولا مطلقة، ولا زانية مدنسة، بل يتزوج عذراء من سبطه."], [15, "فلا يدنس نسله بين شعبه، لأني أنا الرب الذي أقدسه»."]]}, {"l": "Eze 44:22", "n": "", "vs": [[22, "ولا يتزوج الكهنة أرملة ولا مطلقة، بل يتزوجون فتيات عذارى من شعب إسرائيل، أو أرملة كاهن."]]}, {"l": "Luk 1:5-6", "n": "", "vs": [[5, "كان في زمن هيرودس ملك اليهودية كاهن اسمه زكريا، من فرقة أبيا، وزوجته من نسل هارون، واسمها أليصابات."], [6, "وكان كلاهما بارين أمام الله، يسلكان وفقا لوصايا الرب وأحكامه كلها بغير لوم."]]}, {"l": "Tit 2:3", "n": "", "vs": [[3, "وكذلك أن تكون العجائز ذوات سيرة موافقة للقداسة، غير نمامات ولا مدمنات للخمر، بل معلمات لما هو صالح،"]]}], "kwAr": "النساء", "noteAr": ""}, {"kw": "be", "raw": "1Ti_3:4", "note": "", "refs": [{"l": "1Ti 3:4", "n": "", "vs": [[4, "يحسن تدبير بيته، ويربي أولاده في الخضوع بكل احترام."]]}], "kwAr": "رزينات", "noteAr": ""}, {"kw": "not", "raw": "Psa_15:3, Psa_50:20, Psa_101:5; Pro_10:18, Pro_25:13; Jer_9:4; Mat_4:1; Joh_6:70; 2Ti_3:3; Tit_2:3 *Gr: Rev_12:9, Rev_12:10", "note": "", "refs": [{"l": "Psa 15:3", "n": "", "vs": [[3, "الذي لا يشوه سمعة الآخرين، ولا يسيء إلى صاحبه، ولا يلحق بقريبه عارا."]]}, {"l": "Psa 50:20", "n": "", "vs": [[20, "تجلس تشهر بأخيك، وعلى ابن أمك تفتري."]]}, {"l": "Psa 101:5", "n": "", "vs": [[5, "أبيد كل من يغتاب قريبه سرا؛ وذو العين المتشامخة والقلب المتكبر لا أحتمله."]]}, {"l": "Pro 10:18", "n": "", "vs": [[18, "من يضمر البغضاء تنطق شفتاه بالكذب، ومن جاهر بالمذمة فهو أحمق."]]}, {"l": "Pro 25:13", "n": "", "vs": [[13, "الرسول الأمين لمرسليه مثل برودة الثلج في يوم الحصاد، لأنه ينعش نفوس سادته."]]}, {"l": "Jer 9:4", "n": "", "vs": [[4, "«ليحترس كل واحد من جاره، ولا يثق بأحد من أقربائه، لأن كل قريب مخادع، وكل صاحب واش."]]}, {"l": "Mat 4:1", "n": "", "vs": [[1, "ثم صعد الروح بيسوع إلى البرية، ليجرب من قبل إبليس."]]}, {"l": "Joh 6:70", "n": "", "vs": [[70, "فقال يسوع: «أليس أنا اخترتكم أنتم الاثني عشر، ومع ذلك فواحد منكم شيطان؟»"]]}, {"l": "2Ti 3:3", "n": "", "vs": [[3, "متحجري العواطف، غير صفوحين، نمامين، جامحي الأهواء، شرسين غير محبين للصلاح،"]]}, {"l": "Tit 2:3", "n": "*Gr:", "vs": [[3, "وكذلك أن تكون العجائز ذوات سيرة موافقة للقداسة، غير نمامات ولا مدمنات للخمر، بل معلمات لما هو صالح،"]]}, {"l": "Rev 12:9", "n": "", "vs": [[9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشي .", "groups": [{"kw": "", "raw": "1Ti_3:2, 1Ti_3:4, 1Ti_3:5", "note": "", "refs": [{"l": "1Ti 3:2", "n": "", "vs": [[2, "إذن، يجب أن يكون الراعي بلا عيب، زوجا لامرأة واحدة، نبيها عاقلا مهذبا مضيافا، قادرا على التعليم؛"]]}, {"l": "1Ti 3:4", "n": "", "vs": [[4, "يحسن تدبير بيته، ويربي أولاده في الخضوع بكل احترام."]]}, {"l": "1Ti 3:5", "n": "", "vs": [[5, "فإن كان أحد لا يحسن تدبير بيته، فكيف يعتني بكنيسة الله؟"]]}], "kwAr": "", "noteAr": ""}], "arS": [["كما يجب أن يكون كل ", []], ["مدبر", ["G1249"]], [" ", []], ["زوجا", ["G435"]], [" ", []], ["لامرأة", ["G1135"]], [" ", []], ["واحدة", ["G3391"]], ["، ", []], ["يحسن", ["G2573"]], [" ", []], ["تدبير", ["G4291"]], [" ", []], ["أولاده", ["G5043"]], [" ", []], ["وبيته", ["G3624"]], [".", []]]}, {"c": 3, "v": 13, "text": "فإن الذين يقومون بخدمة التدبير خير قيام، يكسبون لأنفسهم مكانة جيدة، وجرأة كبيرة في الإيمان الثابت في المسيح يسوع!", "groups": [{"kw": "they", "raw": "Mat_25:21; Luk_16:10-12, Luk_19:17", "note": "", "refs": [{"l": "Mat 25:21", "n": "", "vs": [[21, "فقال له سيده: حسنا فعلت أيها العبد الصالح والأمين! كنت أمينا على القليل، فسأقيمك على الكثير. ادخل إلى فرح سيدك!"]]}, {"l": "Luk 16:10-12", "n": "", "vs": [[10, "إن الأمين في القليل أمين أيضا في الكثير، والخائن في القليل خائن أيضا في الكثير."], [11, "فإن لم تكونوا أمناء في مال الظلم، فمن يأتمنكم على مال الحق؟"], [12, "وإن لم تكونوا أمناء في ما يخص غيركم، فمن يعطيكم ما يخصكم؟"]]}, {"l": "Luk 19:17", "n": "", "vs": [[17, "فقال له: حسنا فعلت أيها العبد الصالح. فلأنك كنت أمينا في ما هو قليل، فكن واليا على عشر مدن!"]]}], "kwAr": "فإن الذين", "noteAr": ""}, {"kw": "used", "raw": "or, ministered, Mat_20:28; Rom_12:7, Rom_12:8; 1Co_16:15; Heb_6:10; 1Pe_4:10,1Pe_4:11", "note": "or, ministered, Mat_20:28; Rom_12:7, Rom_12:8; 1Co_16:15; Heb_6:10; 1Pe_4:10,1Pe_4:11", "refs": [{"l": "Mat 20:28", "n": "", "vs": [[28, "فهكذا ابن الإنسان: قد جاء لا ليخدم، بل ليخدم ويبذل نفسه فدية عن كثيرين. »"]]}, {"l": "Rom 12:7", "n": "", "vs": [[7, "ومن وهب الخدمة، فلينهمك في الخدمة؛ أو التعليم، ففي التعليم؛"]]}, {"l": "Rom 12:8", "n": "", "vs": [[8, "أو الوعظ، ففي الوعظ؛ أو العطاء، فليعط بسخاء؛ أو القيادة، فليقد باجتهاد؛ أو إظهار الرحمة، فليرحم بسرور."]]}, {"l": "1Co 16:15", "n": "", "vs": [[15, "على أني، أيها الإخوة، أطلب إليكم هذا الطلب: أنتم تعرفون عائلة استفاناس، فهم باكورة أخائية، وقد كرسوا أنفسهم لخدمة القديسين،"]]}, {"l": "Heb 6:10", "n": "", "vs": [[10, "وليس الله بظالم حتى ينسى عملكم الجاد في إظهار محبتكم له عن طريق خدمتكم للقديسين إكراما لاسمه، الأمر الذي قمتم به قبلا، وتقومون به الآن!"]]}, {"l": "1Pe 4:10", "n": "", "vs": [[10, "وعلى كل واحد منكم أن يخدم الآخرين بالموهبة التي أعطاه الله إياها، باعتباركم وكلاء صالحين مؤتمنين على أنواع متعددة من المواهب التي يمنحها الله بالنعمة."]]}, {"l": "1Pe 4:11", "n": "", "vs": [[11, "فمن يتكلم، عليه أن يتكلم بما يوافق أقوال الله؛ ومن يخدم، عليه أن يخدم بموجب القوة التي يمنحها الله . وذلك لكي يتمجد الله في كل شيء، بيسوع المسيح، له المجد والسلطة إلى أبد الآبدين. آمين!"]]}], "kwAr": "يقومون بخدمة التدبير", "noteAr": "أو: خدموا."}, {"kw": "degree", "raw": "Act_21:35 *Gr.", "note": "", "refs": [{"l": "Act 21:35", "n": "*Gr.", "vs": [[35, "ولما وصل به الجنود إلى الدرج اضطروا أن يحملوه ليخلصوه من عنف المحتشدين."]]}], "kwAr": "مكانة جيدة", "noteAr": ""}, {"kw": "great", "raw": "Act_6:5, Act_6:8, Act_6:15, 7:1-53; Phi_1:14; 1Th_2:2; 2Ti_2:1", "note": "", "refs": [{"l": "Act 6:5", "n": "", "vs": [[5, "فاستحسنت الجماعة كلها هذا الرأي؛ ووقع الاختيار على استفانوس، وهو رجل مملوء من الإيمان والروح القدس، وفيلبس، وبروخورس، ونيكانور، وتيمون، وبرميناس، ونيقولاوس الأنطاكي المتهود."]]}, {"l": "Act 6:8", "n": "", "vs": [[8, "وإذ كان استفانوس مملوءا بالإيمان والقوة، كان يعمل عجائب ومعجزات عظيمة بين الشعب."]]}, {"l": "Act 6:15", "n": "", "vs": [[15, "فلما نظر إليه جميع الحاضرين في المجلس رأوا وجهه كأنه وجه ملاك."]]}, {"l": "Act 7:1-53", "n": "", "vs": [[1, "وسأل رئيس الكهنة استفانوس: «هل هذه الاتهامات صحيحة؟»"], [2, "فأجاب: «أيها الإخوة والآباء، اسمعوا: ظهر إله المجد لأبينا إبراهيم وهو في بلاد ما بين النهرين، قبل أن يرحل ليسكن في حاران،"], [3, "وقال له: اترك أرضك وعشيرتك، وارحل إلى الأرض التي أرشدك إليها."], [4, "فأطاع ورحل من بلاد الكلدانيين، وسكن في حاران، وبقي فيها إلى أن مات أبوه، فجاء الله به إلى هذا البلد الذي تسكنون فيه الآن،"], [5, "ولم يعطه هنا ملكا، ولا موطيء قدم. ومع أنه كان وقتئذ بلا ولد، فإن الله وعده بأن يعطي هذا البلد له ولنسله من بعده."], [6, "فقد قال الله : إن أحفاده سيقاسون الغربة في بلاد ليست لهم، مدة أربع مئة سنة يلاقون خلالها العبودية وسوء المعاملة؛"], [7, "ولكني أنزل العقاب بالشعب الذي يستعبدهم. وبعد ذلك يخرجون ويجيئون ليعبدوني في هذا المكان."], [8, "وطلب الله إلى إبراهيم أن يختن الذكور في عائلته علامة على العهد الذي أبرمه له. فختن إبراهيم إسحاق في اليوم الثامن من عمره. وختن إسحاق ابنه يعقوب، وختن يعقوب أولاده الاثني عشر، الذين هم الآباء الأولون."], [9, "وحسد الآباء الأولون يوسف وباعوه، فأصبح عبدا في مصر. ولكن الله كان معه،"], [10, "وأنقذه من جميع المحن التي مر بها، ووهبه نعمة وحكمة عند فرعون ملك مصر، فولاه على مصر، وعلى شؤون بيته."], [11, "وحدثت بعد ذلك مجاعة في مصر وكنعان، فقاسى آباؤنا من ضيق شديد، إذ لم يجدوا الطعام."], [12, "ولما سمع يعقوب أن في مصر قمحا أرسل إليها آباءنا أول مرة."], [13, "وعندما أرسلهم مرة ثانية عرفهم يوسف بنفسه، وتبين لفرعون أصل يوسف."], [14, "واستدعى يوسف والده يعقوب، وإخوته وعائلاتهم، إلى مصر وكانوا خمسة وسبعين شخصا."], [15, "فجاء يعقوب وآباؤنا إلى مصر، وأقاموا فيها إلى أن ماتوا،"], [16, "فنقلوا إلى شكيم حيث دفنوا في القبر الذي اشتراه إبراهيم من قبيلة حمور أبي شكيم ببعض الفضة."], [17, "وفيما كان يقترب إتمام الوعد الذي قطعه الله لإبراهيم، كان الشعب في مصر يتكاثرون ويزدادون عددا."], [18, "ثم قام على مصر ملك جديد لم يكن يعرف أمر يوسف."], [19, "فغدر بشعبنا، وأساء معاملة آبائنا، حتى أجبرهم على التخلي عن أطفالهم ليموتوا."], [20, "في تلك الفترة ولد موسى. وكان جميلا جدا، فرباه والداه في بيتهما ثلاثة أشهر،"], [21, "ولكنهما اضطرا أخيرا إلى التخلي عنه، فأنقذته ابنة فرعون وتبنته وربته."], [22, "فتثقف موسى بعلوم مصر كلها، حتى صار مقتدرا في القول والعمل."], [23, "ولما بلغ الأربعين من العمر خطر بقلبه أن يتفقد أحوال إخوته من بني إسرائيل،"], [24, "فرأى واحدا منهم يعتدي عليه مصري، فتدخل ليدافع عن المظلوم، وانتقم له فقتل المصري،"], [25, "على أمل أن يدرك إخوته أن الله سينقذهم على يده. غير أنهم لم يدركوا!"], [26, "وفي اليوم التالي وجد اثنين من إخوته يتعاركان، فحاول أن يصلح بينهما، قائلا: أنتما أخوان، فلماذا يعتدي أحدكما على الآخر؟"], [27, "فما كان من المعتدي على قريبه إلا أن دفعه بعيدا، وقال: من أقامك رئيسا وقاضيا علينا؟"], [28, "أتريد أن تقتلني كما قتلت المصري أمس؟"], [29, "وهنا هرب موسى من مصر إلى بلاد مديان، وعاش فيها غريبا. وهناك أنجب ولدين."], [30, "وبعدما مضت أربعون سنة كان موسى في صحراء جبل سيناء، عندما ظهر له ملاك الرب في لهيب نار من عليقة تشتعل"], [31, "وأثار المنظر دهشة موسى، فاقترب ليستطلع الأمر، وإذا صوت الرب يناديه:"], [32, "أنا إله آبائك، إله إبراهيم وإسحاق ويعقوب! فارتعد موسى ولم يعد يجرؤ على أن ينظر."], [33, "فقال له الرب: اخلع نعليك لأن المكان الذي تقف عليه هو أرض مقدسة!"], [34, "إني رأيت العذاب الذي يعانيه شعبي في مصر، وسمعت أنينهم، فنزلت لأنقذهم. والآن، هيا أرسلك إلى مصر!"], [35, "فموسى الذي رفضه شعبه قائلين: من أقامك رئيسا وقاضيا علينا؟ هو نفسه أرسله الله رئيسا ومحررا، يؤيده الملاك الذي ظهر له في العليقة!"], [36, "وقد أخرج الشعب من مصر وهو يجري عجائب ومعجزات فيها، وفي البحر الأحمر، وفي الصحراء مدة أربعين سنة."], [37, "وموسى هذا هو الذي قال لبني إسرائيل: سيبعث الله لكم من بين إخوتكم نبيا مثلي."], [38, "وهو الذي كان يقود جماعة الشعب في الصحراء، وقد قام بدور الوسيط بين الملاك الذي كلمه على جبل سيناء وآبائنا، فنقل إليكم وصايا الله الحية."], [39, "ولكن آباءنا رفضوا أن يطيعوا موسى، ولم يعترفوا بقيادته، وحنت قلوبهم للرجوع إلى مصر،"], [40, "وقالوا لهرون: اصنع لنا آلهة تهدينا في سيرنا، فإننا لا نعلم ماذا جرى لموسى هذا الذي أخرجنا من بلاد مصر!"], [41, "فصنعوا صنما على صورة عجل في تلك الأيام وقدموا له ذبيحة، وابتهجوا بما صنعت أيديهم."], [42, "فتحول الله عنهم وتركهم يعبدون كواكب السماء، كما جاء في كتاب الأنبياء:"], [43, "لا، بل حملتم خيمة الصنم مولوك، وكوكب الإله رمفان، التمثالين اللذين صنعتم لتسجدوا لهما! لذلك سأنفيكم إلى أبعد من بابل!"], [44, "وقد حمل آباؤنا معهم في الصحراء خيمة الشهادة. وكان الله قد أوصى موسى أن يقيمها على المثال الذي أطلعه عليه؛"], [45, "ثم دخلوا بها إلى هذه البلاد التي فتحوها بقيادة يشوع، بعدما طرد الله من أمامهم الشعوب الساكنة فيها. وظل آباؤنا يعبدون الله في الخيمة حتى أيام داود،"], [46, "الذي نال قبولا لدى الله، فسعى أن يجد بيتا لإله يعقوب."], [47, "وتحققت هذه الرغبة على يد سليمان الذي بنى الهيكل."], [48, "إلا أن العلي لا يسكن في هياكل تصنعها أيدي البشر، كما قال النبي:"], [49, "السماء عرشي، والأرض موطيء قدمي ... فأي بيت تبنون لي؟ يقول الرب، وأي مكان تعدون لراحتي؟"], [50, "أليست يدي قد صنعت هذه الأشياء كلها؟»"], [51, "ثم قال استفانوس: «ياأصحاب الرقاب الصلبة والقلوب والآذان غير المختونة! إنكم دائما تقاومون الروح القدس. وكما فعل آباؤكم تفعلون!"], [52, "فأي نبي نجا من اضطهادهم وقد قتلوا الذين أنبأوا بمجيء البار الذي سلمتموه أنتم وقتلتموه!"], [53, "فأنتم أخذتم الشريعة من أيدي الملائكة، ولكنكم لم تطيعوها!»"]]}, {"l": "Phi 1:14", "n": "", "vs": [[14, "كما أن أكثر الإخوة، وقد صاروا واثقين بالرب بسبب قيودي، يجرؤون على التبشير بكلمة الله دون خوف."]]}, {"l": "1Th 2:2", "n": "", "vs": [[2, "فمع أننا كنا قد قاسينا الألم والإهانة في مدينة فيلبي، كما تعلمون، فقد تجرأنا في إلهنا أن نكلمكم بإنجيل الله مجاهدين في وجه المعارضة الشديدة."]]}, {"l": "2Ti 2:1", "n": "", "vs": [[1, "وأنت ياولدي، فكن قويا في النعمة التي في المسيح يسوع."]]}], "kwAr": "وجرأة كبيرة", "noteAr": ""}], "arS": [["فإن الذين ", []], ["يقومون بخدمة التدبير", ["G1247"]], [" ", []], ["خير قيام", ["G2573"]], ["، ", []], ["يكسبون", ["G4046"]], [" ", []], ["لأنفسهم", ["G1438"]], [" ", []], ["مكانة", ["G898"]], [" ", []], ["جيدة", ["G2570"]], ["، ", []], ["وجرأة", ["G3954"]], [" ", []], ["كبيرة", ["G4183"]], [" في ", []], ["الإيمان", ["G4102"]], [" الثابت في ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], ["!", []]]}, {"c": 3, "v": 14, "text": "هذه التوصيات أكتبها إليك، وأنا أرجو أن آتي إليك بأكثر سرعة،", "groups": [{"kw": "hoping", "raw": "1Ti_4:13; 1Co_11:34, 1Co_16:5-7; 2Co_1:15-17; 1Th_2:18; Phm_1:22; Heb_13:23; 2Jo_1:12; 3Jo_1:14", "note": "", "refs": [{"l": "1Ti 4:13", "n": "", "vs": [[13, "إلى حين وصولي، انصرف إلى تلاوة الكتاب، وإلى الوعظ، وإلى التعليم."]]}, {"l": "1Co 11:34", "n": "", "vs": [[34, "وإن كان أحد جائعا فليأكل في بيته، لكي لا يكون اجتماعكم للحكم عليكم. أما المسائل الأخرى، فعندما آتي أرتبها."]]}, {"l": "1Co 16:5-7", "n": "", "vs": [[5, "ولكني سأذهب إليكم لدى اجتيازي في مقاطعة مقدونية، لأني إنما سأجتاز فيها،"], [6, "وربما أقضي عندكم مدة من الزمن، أو ربما أقضي الشتاء كله عندكم ثم تسهلون لي سبيل السفر إلى أية جهة أذهب إليها."], [7, "فأنا لا أريد أن أزوركم كعابر سبيل هذه المرة، بل أرجو أن تطول إقامتي عندكم إن أذن الرب."]]}, {"l": "2Co 1:15-17", "n": "", "vs": [[15, "فبهذه القناعة، كنت قد نويت سابقا أن أجيء إليكم، ليكون لكم فرح مرة أخرى،"], [16, "وأن أمر بكم في طريقي إلى مقاطعة مقدونية وأيضا في عودتي منها، وبعدئذ تسهلون لي سبيل السفر إلى منطقة اليهودية."], [17, "فهل تظنون أني باعتمادي لهذه الخطة تصرفت بخفة، أو أني أتخذ قراراتي وفقا لمنطق البشر، ليكون في كلامي نعم نعم ولا لا في آن واحد؟"]]}, {"l": "1Th 2:18", "n": "", "vs": [[18, "ولهذا عزمنا أن نأتي إليكم على الأخص أنا بولس مرة بعد مرة، فعاقنا الشيطان."]]}, {"l": "Phm 1:22", "n": "", "vs": [[22, "وفضلا عن هذا، أعد لي عندك مكانا للإقامة، لأني أرجو أن أوهب لكم إجابة لصلواتكم."]]}, {"l": "Heb 13:23", "n": "", "vs": [[23, "واعلموا أن أخانا تيموثاوس قد أطلق من السجن. فإن أسرع في المجيء إلي، نذهب معا لرؤيتكم."]]}, {"l": "2Jo 1:12", "n": "", "vs": [[12, "كان عندي أمور كثيرة أكتبها إليكم إلا أني ما أردت أن أكتبها هنا بالحبر والورق. فأنا آمل أن أزوركم شخصيا فنتكلم مواجهة. وعندئذ يكتمل فرحنا."]]}, {"l": "3Jo 1:14", "n": "", "vs": [[14, "فآمل أن نتقابل عن قريب، فنتكلم مواجهة! (1:15) السلام لك! الأحباء هنا يسلمون عليك. سلم على كل واحد من الأحباء باسمه."]]}], "kwAr": "وأنا أرجو أن آتي إليك", "noteAr": ""}], "arS": [["هذه التوصيات ", []], ["أكتبها", ["G1125"]], [" إليك، وأنا ", []], ["أرجو", ["G1679"]], [" أن ", []], ["آتي", ["G2064"]], [" إليك ", []], ["بأكثر سرعة", ["G5032"]], ["،", []]]}, {"c": 3, "v": 15, "text": "حتى إذا تأخرت تعلم كيف يجب التصرف في بيت الله، أي كنيسة الله الحي، ركن الحق ودعامته.", "groups": [{"kw": "know", "raw": "1Ti_3:2; Deu_31:23; 1Ki_2:2, 1Ki_2:4; 1Ch_22:13, 1Ch_28:9-21; Act_1:2", "note": "", "refs": [{"l": "1Ti 3:2", "n": "", "vs": [[2, "إذن، يجب أن يكون الراعي بلا عيب، زوجا لامرأة واحدة، نبيها عاقلا مهذبا مضيافا، قادرا على التعليم؛"]]}, {"l": "Deu 31:23", "n": "", "vs": [[23, "وأوصى الرب يشوع بن نون قائلا: «تقو وتشجع، لأنك أنت تدخل بني إسرائيل إلى الأرض التي أقسمت لهم عليها، وأنا أكون معك»."]]}, {"l": "1Ki 2:2", "n": "", "vs": [[2, "«أنا ماض إلى مصير كل أهل الأرض، فتشجع وكن رجلا."]]}, {"l": "1Ki 2:4", "n": "", "vs": [[4, "فيحقق الرب وعوده التي وعدني بها قائلا: إذا حفظ بنوك طريقهم وسلكوا أمامي بإخلاص من كل قلوبهم وأنفسهم، فإنه لن ينقطع لك رجل عن اعتلاء عرش إسرائيل."]]}, {"l": "1Ch 22:13", "n": "", "vs": [[13, "حينئذ تفلح، إذ تحرص على ممارسة الفرائض والأحكام التي أمر بها الرب موسى وسنها لإسرائيل. تشجع وتقو، لا تجزع ولا ترتعب."]]}, {"l": "1Ch 28:9-21", "n": "", "vs": [[9, "أما أنت ياابني سليمان، فاعرف إله أبيك واعبده بكمال قلب، وبنفس راغبة، لأن الرب يتفحص جميع القلوب، ويفهم كل تصور وفكر. فإن طلبته تجده، وإن تركته ينبذك إلى الأبد."], [10, "ففكر مليا، لأن الرب قد اصطفاك لتبني بيتا لقدس الأقداس، فتقو واعمل»."], [11, "وقدم داود لسليمان تصميمات بناء الرواق وبيوته ومخازنه وأجزائه العليا وغرفه الداخلية وقدس الأقداس حيث يكفر عن الخطايا."], [12, "وأعطاه أيضا التصميمات التي ألهمه الروح بها، الخاصة بفناء هيكل الرب وسائر الحجرات المحيطة به، ومخازن هيكل الله ومخازن التقدمات المكرسة للرب،"], [13, "كما قدم إليه التعليمات الخاصة بخدمات فرق الكهنة واللاويين وسائر الخدمات التي تمارس في بيت الرب، وكل ماله علاقة بآنية خدمة الهيكل"], [14, "وعين أوزان الذهب والفضة المستخدمة في صياغة آنية الذهب والفضة المستعملة في مختلف أنواع الخدمات،"], [15, "وكذلك أوزان ذهب وفضة المنائر وسرجها، بما يتناسب مع استخدام كل منارة،"], [16, "وأيضا أوزان ذهب وفضة كل مائدة من موائد خبز الوجوه،"], [17, "كما عين أوزان الذهب النقي المستخدم في صنع المناشل والمناضح والكؤوس، وأوزان ذهب وفضة كل قدح من الأقداح،"], [18, "وأوزان الذهب النقي المستخدم في صنع مذبح البخور، وفي صنع نموذج مركبة الكروبيم الباسطة أجنحتها، والتي تظلل تابوت عهد الرب."], [19, "وقال داود لابنه: «لقد دونت جميع هذه التعليمات كتابة لأن يد الرب كانت علي، وقد لقنني مواصفات هذه التصميمات."], [20, "فتقو وتشجع واعمل. لا تجزع ولا ترتعب لأن الرب الإله إلهي معك، ولن يخذلك ولا يتركك حتى تستوفي كل عمل خدمة هيكل الرب."], [21, "وستقوم فرق الكهنة واللاويين بكل خدمة هيكل الله، فضلا عن كل صانع ماهر في كل حرفة، وسيكون الرؤساء والجيش متأهبين لتلبية أوامرك»."]]}, {"l": "Act 1:2", "n": "", "vs": [[2, "حتى اليوم الذي ارتفع فيه إلى السماء، بعدما قدم وصاياه، بالروح القدس، إلى الرسل الذين اختارهم."]]}], "kwAr": "تعلم كيف يجب التصرف", "noteAr": ""}, {"kw": "the house", "raw": "Eph_2:21, Eph_2:22; 2Ti_2:20; Heb_3:2-6; 1Pe_2:5", "note": "", "refs": [{"l": "Eph 2:21", "n": "", "vs": [[21, "الذي فيه يتناسق البناء كله فيرتفع ليصير هيكلا مقدسا في الرب."]]}, {"l": "Eph 2:22", "n": "", "vs": [[22, "وفيه أنتم أيضا قد بنيتم معا فصرتم مسكنا لله بوجود الروح."]]}, {"l": "2Ti 2:20", "n": "", "vs": [[20, "وإنما، في بيت كبير، لا تكون الأواني كلها من الذهب والفضة وحسب، بل يكون بعضها من الخشب والفخار أيضا. كما يكون بعضها للاستعمال الرفيع، وبعضها للاستعمال الوضيع."]]}, {"l": "Heb 3:2-6", "n": "", "vs": [[2, "فهو أمين لله في المهمة التي عينه لها، كما كان موسى أمينا في القيام بخدمته في بيت الله كله."], [3, "إلا أنه يستحق مجدا أعظم من مجد موسى، كما أن الذي يبني بيتا ينال إكراما ومدحا أكثر مما ينال البيت الذي بناه!"], [4, "طبعا، كل بيت لابد أن يكون له بان، والله نفسه هو باني كل شيء."], [5, "إن موسى كان أمينا في كل بيت الله، ولكن بصفته خادما. وكان ذلك شهادة لما أعلنه الله في ما بعد."], [6, "أما المسيح، فهو أمين بصفته ابنا يترَأس على البيت. وهذا البيت هو نحن المؤمنين، على أن نتمسك بالثقة والافتخار برجائنا تمسكا ثابتا حتى النهاية."]]}, {"l": "1Pe 2:5", "n": "", "vs": [[5, "إذن اتحدوا به كحجارة حية، مبنيين بيتا روحيا، تكونون فيه كهنة مقدسين تقدمون لله ذبائح روحية مقبولة لديه بفضل يسوع المسيح."]]}], "kwAr": "في بيت الله", "noteAr": ""}, {"kw": "the church", "raw": "1Ti_3:5", "note": "", "refs": [{"l": "1Ti 3:5", "n": "", "vs": [[5, "فإن كان أحد لا يحسن تدبير بيته، فكيف يعتني بكنيسة الله؟"]]}], "kwAr": "كنيسة الله", "noteAr": ""}, {"kw": "the living", "raw": "1Ti_4:10, 1Ti_6:16; Deu_5:26; Jos_3:10; 1Sa_17:26, 1Sa_17:36; 2Ki_19:4; Psa_42:2, Psa_84:2; Jer_10:10, Jer_23:36; Dan_6:26; Hos_1:10; Mat_16:16; Joh_6:69; Act_14:15; Rom_9:26; 2Co_3:3, 2Co_6:16; 1Th_1:9; Heb_3:12, Heb_9:14, Heb_12:22; Rev_7:2", "note": "", "refs": [{"l": "1Ti 4:10", "n": "", "vs": [[10, "فإننا لأجل هذا نعمل باجتهاد ونقاسي التعيير، لأننا وضعنا رجاءنا في الله الحي، حافظ جميع الناس، وبالأخص المؤمنين."]]}, {"l": "1Ti 6:16", "n": "", "vs": [[16, "الذي وحده لا فناء له، الساكن في نور لا يدنى منه، الذي لم يره أي إنسان ولا يقدر أن يراه. له الكرامة والقدرة الأبدية. آمين!"]]}, {"l": "Deu 5:26", "n": "", "vs": [[26, "إذ أي بشري سمع صوت الله الحي يتكلم من وسط النار مثلنا وعاش؟"]]}, {"l": "Jos 3:10", "n": "", "vs": [[10, "بهذا تعرفون عن يقين أن الله الحي موجود بينكم، وأنه يطرد من أمامكم الكنعانيين والحثيين والحويين والفرزيين والجرجاشيين والأموريين واليبوسيين."]]}, {"l": "1Sa 17:26", "n": "", "vs": [[26, "فسأل داود الرجال الواقفين إلى جواره: «بماذا يكافأ الرجل الذي يقتل ذلك الفلسطيني ويمحو العار عن إسرائيل؟ لأنه من هو هذا الفلسطيني الأغلف حتى يعير جيش الله الحي؟»"]]}, {"l": "1Sa 17:36", "n": "", "vs": [[36, "وهكذا قتل عبدك الأسد والدب كليهما، فليكن هذا الفلسطيني الأغلف كواحد منهما لأنه عير جيش الله الحي»."]]}, {"l": "2Ki 19:4", "n": "", "vs": [[4, "فلعل الرب إلهك يسمع وعيد القائد الأشوري الذي أوفده سيده ملك أشور، ليهين الإله الحي فيعاقبه الرب إلهك على ما صدر منه من تعيير، فصل من أجل البقية الناجية منا»."]]}, {"l": "Psa 42:2", "n": "", "vs": [[2, "نفسي عطشى إلى الله الإله الحي، فمتى أجيء وأمثل أمام الله؟"]]}, {"l": "Psa 84:2", "n": "", "vs": [[2, "تتوق بل تحن نفسي إلى ديار الرب. قلبي وجسمي يرنمان بفرح للإله الحي."]]}, {"l": "Jer 10:10", "n": "", "vs": [[10, "أما الرب فهو الإله الحق، الإله الحي والملك السرمدي. ترتعد الأرض أمام غضبه ولا تتحمل الأمم فرط سخطه."]]}, {"l": "Jer 23:36", "n": "", "vs": [[36, "أما ادعاء وحي الرب فلا تذكروه من بعد، فإن كلمة المرء تغدو وحي قضائه، إذ قد حرفتم كلام الإله الحي، الرب القدير، إلهنا."]]}, {"l": "Dan 6:26", "n": "", "vs": [[26, "قد صدر مني أمر أن يرتعد كل من يقيم في تخوم مملكتي ويخاف أمام إله دانيآل، لأنه هو الإله الحي القيوم إلى الأبد، لا يزول له ملكوت وسلطانه إلى المنتهى."]]}, {"l": "Hos 1:10", "n": "", "vs": [[10, "ومع ذلك فإن عدد بني إسرائيل يكون كرمل البحر الذي لا يكال ولا يحصى. وفي الموضع الذي قيل لهم فيه: أنتم لستم شعبي، يقال لهم: أنتم أبناء الله الحي."]]}, {"l": "Mat 16:16", "n": "", "vs": [[16, "فأجاب سمعان بطرس قائلا: «أنت هو المسيح ابن الله الحي!»"]]}, {"l": "Joh 6:69", "n": "", "vs": [[69, "نحن آمنا وعرفنا أنك قدوس الله!»"]]}, {"l": "Act 14:15", "n": "", "vs": [[15, "وهما يصرخان: «لماذا تفعلون هذا أيها الناس؟ ما نحن إلا بشر ضعفاء مثلكم، نبشركم بأن ترجعوا عن هذه الأشياء الباطلة إلى الله الحي صانع السماء والأرض والبحر، وكل ما فيها،"]]}, {"l": "Rom 9:26", "n": "", "vs": [[26, "ويكون أنه حيث قيل لهم: لستم شعبي، فهناك يدعون أبناء الله الحي»."]]}, {"l": "2Co 3:3", "n": "", "vs": [[3, "وهكذا يتبين أنكم رسالة من المسيح خدمناها نحن، وقد كتبت لا بحبر بل بروح الله الحي، ولا في ألواح حجرية بل في ألواح القلب البشرية."]]}, {"l": "2Co 6:16", "n": "", "vs": [[16, "وأي وفاق لهيكل الله مع الأصنام؟ فإننا نحن هيكل الله الحي، وفقا لما قاله الله : «سأسكن في وسطهم، وأسير بينهم، وأكون إلههم وهم يكونون شعبا لي…"]]}, {"l": "1Th 1:9", "n": "", "vs": [[9, "فإن أولئك المؤمنين أنفسهم يخبرون عنا كيف كان قدومنا إليكم أول مرة، وكيف تحولتم إلى الله عن الأصنام، لتصيروا عبيدا يخدمون الله الحي الحق،"]]}, {"l": "Heb 3:12", "n": "", "vs": [[12, "فعليكم، أيها الإخوة، أن تأخذوا حذركم جيدا، حتى لا يكون قلب أي واحد منكم شريرا لا إيمان فيه، مما يؤدي به إلى الارتداد عن الله الحي."]]}, {"l": "Heb 9:14", "n": "", "vs": [[14, "فكم بالأحرى دم المسيح الذي قدم نفسه لله بروح أزلي ذبيحة لا عيب فيها، يطهر ضمائرنا من الأعمال الميتة لنعبد الله الحي."]]}, {"l": "Heb 12:22", "n": "", "vs": [[22, "ولكنكم قد اقتربتم إلى جبل صهيون، إلى مدينة الله الحي، أورشليم السماوية. بل تقدمتم إلى حفلة يجتمع فيها عدد لا يحصى من الملائكة،"]]}, {"l": "Rev 7:2", "n": "", "vs": [[2, "ثم رأيت ملاكا آخر قادما من الشرق يحمل ختم الله الحي، فنادى بصوت عال الملائكة الأربعة الذين عهد إليهم أن ينزلوا الضرر بالبر والبحر:"]]}], "kwAr": "الله الحي", "noteAr": ""}, {"kw": "the pillar", "raw": "Jer_1:18; Mat_16:18, Mat_16:19, Mat_18:18; Rom_3:2; Gal_2:9", "note": "", "refs": [{"l": "Jer 1:18", "n": "", "vs": [[18, "انظر ها أنا قد جعلتك اليوم قويا كمدينة حصينة، وكعمود من حديد، وكأسوار من نحاس، لتجابه كل أهل الأرض، وملوك يهوذا وأمراءها وكهنتها وشعب البلاد،"]]}, {"l": "Mat 16:18", "n": "", "vs": [[18, "وأنا أيضا أقول لك: أنت صخر. وعلى هذه الصخرة أبني كنيستي وأبواب الجحيم لن تقوى عليها!"]]}, {"l": "Mat 16:19", "n": "", "vs": [[19, "وأعطيك مفاتيح ملكوت السماوات: فكل ما تربطه على الأرض، يكون قد ربط في السماء؛ وما تحله على الأرض، يكون قد حل في السماء!»"]]}, {"l": "Mat 18:18", "n": "", "vs": [[18, "فالحق أقول لكم: إن كل ما تربطونه على الأرض يكون قد ربط في السماء، وما تحلونه على الأرض يكون قد حل في السماء."]]}, {"l": "Rom 3:2", "n": "", "vs": [[2, "إنه كثير من جميع الجهات، وأهمها فعلا أن أقوال الله وضعت أمانة بين أيديهم."]]}, {"l": "Gal 2:9", "n": "", "vs": [[9, "فلما اتضحت النعمة الموهوبة لي عند يعقوب وبطرس ويوحنا، وهم البارزون باعتبارهم أعمدة، مدوا إلي وإلى برنابا أيديهم اليمنى إشارة إلى المشاركة، فنتوجه نحن إلى الأمم وهم إلى أهل الختان،"]]}], "kwAr": "ركن الحق", "noteAr": ""}, {"kw": "ground", "raw": "or, stay", "note": "or, stay", "refs": [], "kwAr": "ودعامته", "noteAr": "أو: سند (عماد)."}, {"kw": "the truth", "raw": "1Ti_3:16; Joh_1:17, Joh_14:6, Joh_18:37; 2Co_6:7; Gal_3:1; Eph_4:21; Col_1:5", "note": "", "refs": [{"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}, {"l": "Joh 1:17", "n": "", "vs": [[17, "لأن الشريعة أعطيت على يد موسى، أما النعمة والحق فقد تواجدا بيسوع المسيح."]]}, {"l": "Joh 14:6", "n": "", "vs": [[6, "فأجابه يسوع: «أنا هو الطريق والحق والحياة. لا يأتي أحد إلى الآب إلا بي."]]}, {"l": "Joh 18:37", "n": "", "vs": [[37, "فسأله بيلاطس: «فهل أنت ملك إذن؟» أجابه: «أنت قلت، إني ملك. ولهذا ولدت وجئت إلى العالم: لأشهد للحق، وكل من هو من الحق يصغي لصوتي»."]]}, {"l": "2Co 6:7", "n": "", "vs": [[7, "في كلمة الحق وقدرة الله؛ بأسلحة البر في الهجوم والدفاع؛"]]}, {"l": "Gal 3:1", "n": "", "vs": [[1, "ياأهل غلاطية الأغبياء! من سحر عقولكم، أنتم الذين قد رسم أمام أعينكم يسوع المسيح وهو مصلوب؟"]]}, {"l": "Eph 4:21", "n": "", "vs": [[21, "إذا كنتم قد سمعتموه حقا وتلقيتم فيه التعليم الموافق للحق الذي في يسوع!"]]}, {"l": "Col 1:5", "n": "", "vs": [[5, "بسبب الرجاء المحفوظ لكم في السماوات، الرجاء الذي سمعتم به سابقا في كلمة الحق التي في الإنجيل"]]}], "kwAr": "الحق", "noteAr": ""}], "arS": [["حتى إذا ", []], ["تأخرت", ["G1019"]], [" ", []], ["تعلم", ["G1492"]], [" ", []], ["كيف", ["G4459"]], [" ", []], ["يجب", ["G1163"]], [" ", []], ["التصرف", ["G390"]], [" في ", []], ["بيت", ["G3624"]], [" ", []], ["الله", ["G2316"]], ["، أي ", []], ["كنيسة", ["G1577"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["الحي", ["G2198"]], ["، ", []], ["ركن", ["G4769"]], [" ", []], ["الحق", ["G225"]], [" ", []], ["ودعامته", ["G1477"]], [".", []]]}, {"c": 3, "v": 16, "text": "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد.", "groups": [{"kw": "without", "raw": "Heb_7:7", "note": "", "refs": [{"l": "Heb 7:7", "n": "", "vs": [[7, "إذن، لا خلاف أن ملكيصادق أعظم من إبراهيم، وإلا فما كان قد باركه!"]]}], "kwAr": "وباعتراف الجميع", "noteAr": ""}, {"kw": "the mystery", "raw": "1Ti_3:9; Mat_13:11; Rom_16:25; 1Co_2:7; Eph_1:9, Eph_3:3-9, Eph_6:19; Col_2:2; 2Th_2:7; Rev_17:5, Rev_17:7", "note": "", "refs": [{"l": "1Ti 3:9", "n": "", "vs": [[9, "يتمسكون بحقائق الإيمان الخفية بضمير نقي."]]}, {"l": "Mat 13:11", "n": "", "vs": [[11, "فأجاب: «لأنه قد أعطي لكم أن تعرفوا أسرار ملكوت السماوات؛ أما أولئك، فلم يعط لهم ذلك."]]}, {"l": "Rom 16:25", "n": "", "vs": [[25, "والمجد للقادر أن يثبتكم، وفقا لإنجيلي وللبشارة بيسوع المسيح، ووفقا لإعلان ما كان سرا ظل مكتوما مدى الأزمنة الأزلية،"]]}, {"l": "1Co 2:7", "n": "", "vs": [[7, "بل إننا نتكلم بحكمة الله المطوية في سر، تلك الحكمة المحجوبة التي سبق الله فأعدها قبل الدهور لأجل مجدنا"]]}, {"l": "Eph 1:9", "n": "", "vs": [[9, "إذ كشف لنا سر مشيئته بحسب مرضاته التي قصدها في نفسه،"]]}, {"l": "Eph 3:3-9", "n": "", "vs": [[3, "كيف كشف لي السر عن طريق الوحي، كما كتبت قبلا بإيجاز،"], [4, "ويمكنكم، حينما تقرأون ما كتبته، أن تدركوا اطلاعي العميق على سر المسيح،"], [5, "ذلك السر الذي لم يطلع عليه بنو البشر في الأجيال الماضية مثلما أعلن الآن بوحي الروح لرسله القديسين وأنبيائه:"], [6, "وهو أن الأمم هم شركاء اليهود في الميراث، وأعضاء في الجسد معهم، ولهم أيضا حق الاستفادة من الوعد. وذلك في المسيح يسوع وبفضل الإنجيل"], [7, "الذي صرت أنا خادما له بحسب نعمة الله الموهوبة لي وفقا لعمل قدرته."], [8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"], [9, "وأنير الجميع بمعرفة ما هو تدبير السر الذي أبقاه الله ، خالق كل شيء، مكتوما مدى الأجيال."]]}, {"l": "Eph 6:19", "n": "", "vs": [[19, "ولأجلي كي ألهم ما أنطق به كلما فتحت فمي لأعلن بجرأة سر الإنجيل"]]}, {"l": "Col 2:2", "n": "", "vs": [[2, "بغرض أن تتشجع قلوبهم وتكون كلها متحدة في المحبة، لبلوغ الإدراك التام بكل غناه، لمعرفة سر الله، أي المسيح،"]]}, {"l": "2Th 2:7", "n": "", "vs": [[7, "فإن التمرد الآن يعمل خفية كأنه سر. ولكن فقط إلى أن يرفع من الوسط ذاك الذي يحتجز المتمرد."]]}, {"l": "Rev 17:5", "n": "", "vs": [[5, "وعلى جبينها اسم مكتوب: سر: «بابل العظمى، أم زانيات الأرض وأصنامها المكروهة»."]]}, {"l": "Rev 17:7", "n": "", "vs": [[7, "فسألني الملاك: «لماذا دهشت؟ سأطلعك على ما ترمز إليه المرأة والوحش الذي يحملها، صاحب الرؤوس السبعة والقرون العشرة:"]]}], "kwAr": "سر التقوى", "noteAr": ""}, {"kw": "God", "raw": "Isa_7:14, Isa_9:6; Jer_23:5, Jer_23:6; Mic_5:2; Mat_1:23; Joh_1:1, Joh_1:2, Joh_1:14; Act_20:28; Rom_8:3, Rom_9:5; 1Co_15:47; Gal_4:4; Phi_2:6-8; Col_1:16-18; Heb_1:3; Heb_2:9-13; 1Jo_1:2; Rev_1:17, Rev_1:18", "note": "", "refs": [{"l": "Isa 7:14", "n": "", "vs": [[14, "ولكن السيد نفسه يعطيكم آية: ها العذراء تحبل وتلد ابنا، وتدعو اسمه عمانوئيل."]]}, {"l": "Isa 9:6", "n": "", "vs": [[6, "لأنه يولد لنا ولد ويعطى لنا ابن يحمل الرياسة على كتفه، ويدعى اسمه عجيبا، مشيرا، إلها قديرا، أبا أبديا، رئيس السلام."]]}, {"l": "Jer 23:5", "n": "", "vs": [[5, "ها أيام مقبلة أقيم فيها لداود ذرية بر، ملكا يسود بحكمة، ويجري في الأرض عدلا وحقا."]]}, {"l": "Jer 23:6", "n": "", "vs": [[6, "في عهده يتم خلاص شعب يهوذا، ويسكن شعب إسرائيل آمنا. أما الاسم الذي سيدعى به فهو: الرب برنا."]]}, {"l": "Mic 5:2", "n": "", "vs": [[2, "أما أنت يابيت لحم أفراتة، مع أنك قرية صغيرة بين ألوف قرى يهوذا، إلا أن منك يخرج لي من يصبح ملكا في إسرائيل وأصله منذ القديم، منذ الأزل."]]}, {"l": "Mat 1:23", "n": "", "vs": [[23, "«ها إن العذراء تحبل، وتلد ابنا، ويدعى عمانوئيل!» أي «الله معنا»."]]}, {"l": "Joh 1:1", "n": "", "vs": [[1, "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."]]}, {"l": "Joh 1:2", "n": "", "vs": [[2, "هو كان في البدء عند الله."]]}, {"l": "Joh 1:14", "n": "", "vs": [[14, "والكلمة صار بشرا، وخيم بيننا، ونحن رأينا مجده، مجد ابن وحيد عند الآب، وهو ممتلىء بالنعمة والحق."]]}, {"l": "Act 20:28", "n": "", "vs": [[28, "فاسهروا إذن على أنفسكم وعلى جميع القطيع الذي عينكم بينه الروح القدس نظارا، لترعوا كنيسة الله التي اشتراها بدمه."]]}, {"l": "Rom 8:3", "n": "", "vs": [[3, "فإن ما عجزت الشريعة عنه، لكون الجسد قد جعلها قاصرة عن تحقيقه، أتمه الله إذ أرسل ابنه، متخذا ما يشبه جسد الخطيئة ومكفرا عن الخطيئة فدان الخطيئة في الجسد"]]}, {"l": "Rom 9:5", "n": "", "vs": [[5, "ومنهم كان الآباء ومنهم جاء المسيح حسب الجسد، وهو فوق الجميع الله المبارك إلى الأبد. آمين."]]}, {"l": "1Co 15:47", "n": "", "vs": [[47, "الإنسان الأول من الأرض وقد صنع من التراب؛ أما الإنسان الثاني فهو من السماء."]]}, {"l": "Gal 4:4", "n": "", "vs": [[4, "ولكن لما جاء تمام الزمان، أرسل الله ابنه، وقد ولد من امرأة وكان خاضعا للشريعة،"]]}, {"l": "Phi 2:6-8", "n": "", "vs": [[6, "إذ إنه، وهو الكائن في هيئة الله، لم يعتبر مساواته لله خلسة، أو غنيمة يتمسك بها؛"]
