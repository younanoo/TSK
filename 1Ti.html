 وصاروا (إلى حين) من شركاء الروح القدس،"], [5, "وذاقوا كلمة الله الطيبة، وشاهدوا المعجزات التي تظهر عظمة «العالم الآتي»،"], [6, "ثم ارتدوا إلى تلك الأسس القديمة، أولئك يستحيل عليهم أن يتجددوا ثانية فيعودوا إلى التوبة. فهم يجنون على أنفسهم إذ يصلبون ابن الله مرة ثانية ويجعلونه عرضة للعار."], [7, "ولا عجب، فالتربة التي تشرب الأمطار النازلة عليها مرارا كثيرة، ثم تنتج نباتا ينفع الذين حرثوها، تنال البركة من الله!"], [8, "ولكنها، إن أخرجت الشوك والعشب البري، تكون مرفوضة وتستحق اللعنة، وما نهايتها إلا الحريق."]]}, {"l": "Heb 10:26-29", "n": "", "vs": [[26, "فإن أخطأنا عمدا برفضنا للمسيح بعد حصولنا على معرفة الحق، لا تبقى هناك ذبيحة لغفران الخطايا،"], [27, "بل انتظار العقاب الأكيد في لهيب النار التي ستلتهم المتمردين. ويا له من انتظار مخيف!"], [28, "تعلمون أن من خالف شريعة موسى، كان عقابه الموت دون رحمة، على أن يؤيد مخالفته شاهدان أو ثلاثة."], [29, "ففي ظنكم، كم يكون أشد كثيرا ذلك العقاب الذي يستحقه من يدوس ابن الله، إذ يعتبر أن دم العهد، الذي يتقدس به، هو دم نجس، وبذلك يهين روح النعمة؟"]]}, {"l": "2Pe 2:21", "n": "", "vs": [[21, "وبالحقيقة، كان أفضل لهم لو أنهم لم يتعرفوا بطريق البر، من أن يتعرفوا به ثم يرتدوا عن الوصية المقدسة التي تسلموها."]]}, {"l": "2Pe 2:22", "n": "", "vs": [[22, "وينطبق على هؤلاء ما يقوله المثل الصادق: «عاد الكلب إلى تناول ما تقيأه، والخنزيرة المغتسلة إلى التمرغ في الوحل!»"]]}], "kwAr": "عن جهل", "noteAr": ""}], "arS": [["مع أني كنت في ", []], ["الماضي", ["G4386"]], [" ", []], ["مجدفا", ["G989"]], [" عليه، ", []], ["ومضطهدا", ["G1376"]], [" ", []], ["ومهينا", ["G5197"]], [" له! ولكني ", []], ["عوملت بالرحمة", ["G1653"]], ["، لأني ", []], ["عملت", ["G4160"]], [" ما عملته عن ", []], ["جهل", ["G50"]], [" وفي ", []], ["عدم إيمان", ["G570"]], [".", []]]}, {"c": 1, "v": 14, "text": "إلا أن نعمة ربنا قد فاضت علي فوق كل حد، ومعها الإيمان والمحبة، وذلك في المسيح يسوع.", "groups": [{"kw": "the grace", "raw": "Act_15:11; Rom_16:20; 2Co_8:9, 2Co_13:14; Rev_22:21", "note": "", "refs": [{"l": "Act 15:11", "n": "", "vs": [[11, "فنحن نؤمن بأننا نخلص، كما يخلصون هم، بنعمة الرب يسوع."]]}, {"l": "Rom 16:20", "n": "", "vs": [[20, "وإله السلام سيسحق الشيطان تحت أقدامكم سريعا. لتكن نعمة ربنا يسوع المسيح معكم."]]}, {"l": "2Co 8:9", "n": "", "vs": [[9, "فأنتم تعرفون نعمة ربنا يسوع المسيح: فمن أجلكم افتقر، وهو الغني لكي تغتنوا أنتم بفقره."]]}, {"l": "2Co 13:14", "n": "", "vs": [[14, "ولتكن معكم جميعا نعمة ربنا يسوع المسيح، ومحبة الله، وشركة الروح القدس. آمين!"]]}, {"l": "Rev 22:21", "n": "", "vs": [[21, "ولتكن نعمة ربنا يسوع المسيح معكم جميعا."]]}], "kwAr": "نعمة ربنا", "noteAr": ""}, {"kw": "exceeding", "raw": "Exo_34:6; Isa_55:6, Isa_55:7; Rom_5:15-20; 1Co_15:10; Eph_1:7, Eph_1:8; 1Pe_1:3", "note": "", "refs": [{"l": "Exo 34:6", "n": "", "vs": [[6, "وعبر من أمام موسى مناديا: «أنا الرب. الرب إله رؤوف رحيم، بطيء الغضب وكثير الإحسان والوفاء."]]}, {"l": "Isa 55:6", "n": "", "vs": [[6, "اطلبوا الرب مادام موجودا، ادعوه وهو قريب."]]}, {"l": "Isa 55:7", "n": "", "vs": [[7, "ليترك الشرير طريقه والأثيم أفكاره، وليتب إلى الرب فيرحمه، وليرجع إلى إلهنا لأنه يكثر الغفران."]]}, {"l": "Rom 5:15-20", "n": "", "vs": [[15, "ولكن مفعول المعصية ليس كمفعول النعمة! فإذا كان الكثيرون بمعصية إنسان واحد قد ماتوا، فكم بالأحرى في الإنسان الواحد يسوع المسيح تتوافر للكثيرين نعمة الله والعطية المجانية بالنعمة."], [16, "ثم إن أثر خطيئة إنسان واحد ليس كأثر الهبة! فإن الحكم من جراء معصية واحدة يؤدي إلى الدينونة. وأما فعل النعمة، من جراء معاص كثيرة، فيؤدي إلى التبرير."], [17, "فما دام الموت بمعصية الإنسان الواحد، قد ملك بذلك الواحد، فكم بالأحرى يملك في الحياة بيسوع المسيح الواحد أولئك الذين ينالون فيض النعمة وعطية البر المجانية."], [18, "فإذن، كما أن معصية واحدة جلبت الدينونة على جميع البشر، كذلك فإن برا واحدا يجلب التبرير المؤدي إلى الحياة لجميع البشر."], [19, "فكما أنه بعصيان الإنسان الواحد جعل الكثيرون خاطئين، فكذلك أيضا بطاعة الواحد سيجعل الكثيرون أبرارا."], [20, "وأما الشريعة فقد أدخلت لتظهر كثرة المعصية. ولكن، حيث كثرت الخطيئة، تتوافر النعمة أكثر جدا،"]]}, {"l": "1Co 15:10", "n": "", "vs": [[10, "ولكن، بنعمة الله صرت على ما أنا عليه الآن، ونعمته الموهوبة لي لم تكن عبثا، إذ عملت جاهدا أكثر من الرسل الآخرين جميعا. إلا أني لم أكن أنا العامل، بل نعمة الله التي كانت معي."]]}, {"l": "Eph 1:7", "n": "", "vs": [[7, "ففيه لنا بدمه الفداء، أي غفران الخطايا؛ بحسب غنى نعمته"]]}, {"l": "Eph 1:8", "n": "", "vs": [[8, "التي جعلها تفيض علينا مصحوبة بكل حكمة وفهم."]]}, {"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}], "kwAr": "فاضت علي فوق كل حد", "noteAr": ""}, {"kw": "with", "raw": "Luk_7:47-50; 1Th_5:8; 2Ti_1:13; 1Jo_4:10", "note": "", "refs": [{"l": "Luk 7:47-50", "n": "", "vs": [[47, "لهذا السبب أقول لك: إن خطاياها الكثيرة قد غفرت، لهذا أحبت كثيرا. ولكن الذي يغفر له القليل، يحب قليلا!»"], [48, "ثم قال لها: «مغفورة لك خطاياك!»"], [49, "فأخذ المتكئون يسائلون أنفسهم: «من هو هذا الذي يغفر الخطايا أيضا؟»"], [50, "وقال للمرأة: «إيمانك قد خلصك. اذهبي بسلام!»"]]}, {"l": "1Th 5:8", "n": "", "vs": [[8, "وأما نحن، أهل النهار، فلنظل صاحين، متخذين من الإيمان والمحبة درعا لصدورنا، ومن الرجاء بالخلاص خوذة لرؤوسنا."]]}, {"l": "2Ti 1:13", "n": "", "vs": [[13, "اتخذ من الكلام الصحيح الذي سمعته مني مثالا في الإيمان والمحبة اللذين في المسيح يسوع."]]}, {"l": "1Jo 4:10", "n": "", "vs": [[10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."]]}], "kwAr": "ومعها الإيمان والمحبة", "noteAr": ""}], "arS": [["إلا أن ", []], ["نعمة", ["G5485"]], [" ", []], ["ربنا", ["G2962", "G2257"]], [" قد ", []], ["فاضت", ["G5250"]], [" علي فوق كل حد، ومعها ", []], ["الإيمان", ["G4102"]], [" ", []], ["والمحبة", ["G26"]], ["، وذلك في ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [".", []]]}, {"c": 1, "v": 15, "text": "ما أصدق هذا القول، وما أجدره بالتصديق الكلي: إن المسيح يسوع قد جاء إلى العالم ليخلص الخاطئين، وأنا أولهم!", "groups": [{"kw": "a faithful", "raw": "1Ti_1:19, 1Ti_3:1, 1Ti_4:9; 2Ti_2:11; Tit_3:8; Rev_21:5, Rev_22:6", "note": "", "refs": [{"l": "1Ti 1:19", "n": "", "vs": [[19, "متمسكا بالإيمان، وبالضمير الصالح، هذا الضمير الذي تخلى عنه بعضهم، فانكسرت بهم سفينة الإيمان."]]}, {"l": "1Ti 3:1", "n": "", "vs": [[1, "ما أصدق القول إن من يرغب في الرعاية فإنما يتوق إلى عمل صالح."]]}, {"l": "1Ti 4:9", "n": "", "vs": [[9, "ما أصدق هذا القول، وما أجدره بالتصديق!"]]}, {"l": "2Ti 2:11", "n": "", "vs": [[11, "وما أصدق القول: «إن كنا قد متنا معه، فسوف نحيا أيضا معه؛"]]}, {"l": "Tit 3:8", "n": "", "vs": [[8, "صادق هذا القول! وأريد أن تقرر هذه الأمور قرارا حاسما، حتى يهتم الذين آمنوا بالله بأن يجتهدوا في الأعمال الصالحة. هذه الأمور حسنة ونافعة للناس."]]}, {"l": "Rev 21:5", "n": "", "vs": [[5, "وقال الجالس على العرش: «سأصنع كل شيء جديدا». ثم قال لي: «اكتب هذا، فإن ما أقوله هو الصدق والحق»."]]}, {"l": "Rev 22:6", "n": "", "vs": [[6, "وقال لي الملاك: «هذا الكلام صدق وحق. إن الرب إله أرواح الأنبياء أرسل ملاكه ليخبر عبيده بما لا بد أن يحدث سريعا"]]}], "kwAr": "ما أصدق هذا القول", "noteAr": ""}, {"kw": "worthy", "raw": "Joh_1:12, Joh_3:16, Joh_3:17, Joh_3:36; Act_11:1, Act_11:18; 1Jo_5:11", "note": "", "refs": [{"l": "Joh 1:12", "n": "", "vs": [[12, "أما الذين قبلوه، أي الذين آمنوا باسمه، فقد منحهم الحق في أن يصيروا أولاد الله،"]]}, {"l": "Joh 3:16", "n": "", "vs": [[16, "لأنه هكذا أحب الله العالم حتى بذل ابنه الوحيد، لكي لا يهلك كل من يؤمن به، بل تكون له الحياة الأبدية."]]}, {"l": "Joh 3:17", "n": "", "vs": [[17, "فإن الله لم يرسل ابنه إلى العالم ليدين العالم، بل ليخلص العالم به،"]]}, {"l": "Joh 3:36", "n": "", "vs": [[36, "من يؤمن بالابن، فله الحياة الأبدية. ومن يرفض أن يؤمن بالابن، فلن يرى الحياة. بل يستقر عليه غضب الله»."]]}, {"l": "Act 11:1", "n": "", "vs": [[1, "وسمع الرسل والإخوة في اليهودية أن غير اليهود أيضا قبلوا كلمة الله،"]]}, {"l": "Act 11:18", "n": "", "vs": [[18, "فلما سمع المعارضون هذا، سكتوا، ومجدوا الله قائلين: «إذن، قد أنعم الله أيضا على غير اليهود بالتوبة لنوال الحياة»."]]}, {"l": "1Jo 5:11", "n": "", "vs": [[11, "وهذه الشهادة هي أن الله أعطانا حياة أبدية، وأن هذه الحياة هي في ابنه."]]}], "kwAr": "وما أجدره بالتصديق", "noteAr": ""}, {"kw": "that", "raw": "Mat_1:21, Mat_9:13, Mat_18:11, Mat_20:28; Mar_2:17; Luk_5:32, Luk_19:10; Joh_1:29, Joh_12:47; Act_3:26; Rom_3:24-26, Rom_5:6, Rom_5:8-10; Heb_7:25; 1Jo_3:5, 1Jo_3:8, 1Jo_4:9, 1Jo_4:10; Rev_5:9", "note": "", "refs": [{"l": "Mat 1:21", "n": "", "vs": [[21, "فستلد ابنا، وأنت تسميه يسوع، لأنه هو الذي يخلص شعبه من خطاياهم»."]]}, {"l": "Mat 9:13", "n": "", "vs": [[13, "اذهبوا وتعلموا معنى القول: إني أطلب رحمة لا ذبيحة. فإني ما جئت لأدعو أبرارا بل خاطئين! »"]]}, {"l": "Mat 18:11", "n": "", "vs": [[11, "فإن ابن الإنسان قد جاء لكي يخلص الهالكين."]]}, {"l": "Mat 20:28", "n": "", "vs": [[28, "فهكذا ابن الإنسان: قد جاء لا ليخدم، بل ليخدم ويبذل نفسه فدية عن كثيرين. »"]]}, {"l": "Mar 2:17", "n": "", "vs": [[17, "فسمع يسوع، وأجاب: «ليس الأصحاء هم المحتاجون إلى الطبيب، بل المرضى. ما جئت لأدعو أبرارا بل خاطئين! »"]]}, {"l": "Luk 5:32", "n": "", "vs": [[32, "ما جئت لأدعو إلى التوبة أبرارا بل خاطئين! »"]]}, {"l": "Luk 19:10", "n": "", "vs": [[10, "فإن ابن الإنسان قد جاء ليبحث عن الهالكين ويخلصهم»."]]}, {"l": "Joh 1:29", "n": "", "vs": [[29, "وفي اليوم التالي رأى يوحنا يسوع آتيا نحوه، فهتف قائلا: «هذا هو حمل الله الذي يزيل خطيئة العالم."]]}, {"l": "Joh 12:47", "n": "", "vs": [[47, "وإذا سمع أحد كلامي ولم يؤمن به، فأنا لا أحكم عليه، فقد جئت لا لأحكم على العالم، بل لأخلص العالم."]]}, {"l": "Act 3:26", "n": "", "vs": [[26, "فمن أجلكم أولا أقام الله فتاه يسوع وأرسله ليبارككم برد كل واحد منكم عن شروره»."]]}, {"l": "Rom 3:24-26", "n": "", "vs": [[24, "فهم يبررون مجانا، بنعمته، بالفداء بالمسيح يسوع"], [25, "الذي قدمه الله كفارة، عن طريق الإيمان، وذلك بدمه."], [26, "ليظهر بر الله إذ تغاضى، بإمهاله الإلهي، عن الخطايا التي حدثت في الماضي، ويظهر أيضا بره في الزمن الحاضر: فيتبين أنه بار وأنه يبرر من له الإيمان بيسوع."]]}, {"l": "Rom 5:6", "n": "", "vs": [[6, "فإنه ونحن بعد عاجزون، مات المسيح عن العصاة في الوقت المعين."]]}, {"l": "Rom 5:8-10", "n": "", "vs": [[8, "ولكن الله أثبت لنا محبته، إذ ونحن مازلنا خاطئين مات المسيح عوضا عنا."], [9, "ومادمنا الآن قد تبررنا بدمه، فكم بالأحرى نخلص به من الغضب الآتي!"], [10, "فإن كنا، ونحن أعداء، قد تصالحنا مع الله بموت ابنه، فكم بالأحرى نخلص بحياته ونحن مصالحون!"]]}, {"l": "Heb 7:25", "n": "", "vs": [[25, "وهو لذلك قادر دائما أن يحقق الخلاص الكامل للذين يتقربون به إلى الله. فهو، في حضرة الله، حي على الدوام ليتضرع من أجلهم ويحامي عنهم!"]]}, {"l": "1Jo 3:5", "n": "", "vs": [[5, "وأنتم تعرفون أن المسيح جاء إلى هذه الأرض لكي يحمل الخطايا، مع كونه بلا خطيئة."]]}, {"l": "1Jo 3:8", "n": "", "vs": [[8, "ولكن من يمارس الخطيئة، يظهر أنه من أولاد إبليس، لأن إبليس يمارس الخطيئة منذ البداية. وقد جاء ابن الله إلى الأرض لكي يبطل أعمال إبليس."]]}, {"l": "1Jo 4:9", "n": "", "vs": [[9, "وقد أظهر الله محبته لنا إذ أرسل ابنه الأوحد إلى العالم لكي نحيا به."]]}, {"l": "1Jo 4:10", "n": "", "vs": [[10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."]]}, {"l": "Rev 5:9", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"]]}], "kwAr": "المسيح يسوع قد جاء إلى العالم", "noteAr": ""}, {"kw": "of whom", "raw": "1Ti_1:13; Job_42:6; Eze_16:63, Eze_36:31, Eze_36:32; 1Co_15:9; Eph_3:8", "note": "", "refs": [{"l": "1Ti 1:13", "n": "", "vs": [[13, "مع أني كنت في الماضي مجدفا عليه، ومضطهدا ومهينا له! ولكني عوملت بالرحمة، لأني عملت ما عملته عن جهل وفي عدم إيمان."]]}, {"l": "Job 42:6", "n": "", "vs": [[6, "لذلك ألوم نفسي وأتوب معفرا ذاتي بالتراب والرماد»."]]}, {"l": "Eze 16:63", "n": "", "vs": [[63, "لكي تتذكري فتخجلي ولا تفتحي فمك من بعد بسبب خزيك، حين أغفر لك كل ما ارتكبت من شر يقول السيد الرب»."]]}, {"l": "Eze 36:31", "n": "", "vs": [[31, "فتذكرون طرقكم الأثيمة وتصرفاتكم الطالحة، وتمقتون أنفسكم في أعينكم لما ارتكبتم من آثام ورجاسات."]]}, {"l": "Eze 36:32", "n": "", "vs": [[32, "لهذا اعلموا أنه ليس من أجلكم أنا أفعل هذا، يقول السيد الرب، فاخجلوا واخزوا من طرقكم ياشعب إسرائيل."]]}, {"l": "1Co 15:9", "n": "", "vs": [[9, "فإني أنا أصغر الرسل شأنا، ولست أهلا لأن أدعى رسولا لأني اضطهدت كنيسة الله."]]}, {"l": "Eph 3:8", "n": "", "vs": [[8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}], "kwAr": "وأنا أولهم", "noteAr": ""}], "arS": [["ما ", []], ["أصدق", ["G4103"]], [" هذا ", []], ["القول", ["G3056"]], ["، وما ", []], ["أجدره", ["G514"]], [" ", []], ["بالتصديق", ["G594"]], [" ", []], ["الكلي", ["G3956"]], [": إن ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [" قد ", []], ["جاء", ["G2064"]], [" إلى ", []], ["العالم", ["G2889"]], [" ", []], ["ليخلص", ["G4982"]], [" ", []], ["الخاطئين", ["G268"]], ["، ", []], ["وأنا", ["G1473"]], [" ", []], ["أولهم", ["G4413"]], ["!", []]]}, {"c": 1, "v": 16, "text": "ولكن لهذا السبب عوملت بالرحمة، ليجعل يسوع المسيح مني، أنا أولا، مثالا يظهر صبره الطويل، لجميع الذين سيؤمنون به لنوال الحياة الأبدية.", "groups": [{"kw": "for this", "raw": "Num_23:3; Psa_25:11; Isa_1:18, Isa_43:25; Eph_1:6, Eph_1:12, Eph_2:7; 2Th_1:10", "note": "", "refs": [{"l": "Num 23:3", "n": "", "vs": [[3, "ثم قال بلعام لبالاق: «قف هنا عند محرقاتك فأمضي أنا، لعل الرب يأتي للقائي، ومهما يعلن لي أبلغك به». ثم ارتقى بلعام رابية."]]}, {"l": "Psa 25:11", "n": "", "vs": [[11, "فمن أجل اسمك أيها الرب اصفح عن إثمي فإنه عظيم."]]}, {"l": "Isa 1:18", "n": "", "vs": [[18, "تعالوا نتحاجج يقول الرب، إن كانت خطاياكم كلطخات قرمزية فإنها تبيض كالثلج، وإن كانت حمراء كصبغ الدودي تصبح في نقاء الصوف!"]]}, {"l": "Isa 43:25", "n": "", "vs": [[25, "أنا، أنا هو الماحي ذنوبك من أجل ذاتي، وخطاياك لن أذكرها."]]}, {"l": "Eph 1:6", "n": "", "vs": [[6, "بغرض مدح مجد نعمته التي بها أعطانا حظوة لديه في المحبوب:"]]}, {"l": "Eph 1:12", "n": "", "vs": [[12, "والغاية أن نكون سببا لمدح مجده بعدما سبق لنا أن وضعنا رجاءنا في المسيح."]]}, {"l": "Eph 2:7", "n": "", "vs": [[7, "وذلك كي يعرض في الدهور القادمة غنى نعمته الفائق في لطفه علينا في المسيح يسوع."]]}, {"l": "2Th 1:10", "n": "", "vs": [[10, "عندما يعود في ذلك اليوم ليتمجد في قديسيه ويكون موضع العجب عند جميع الذين آمنوا، وأنتم قد آمنتم بشهادتنا لكم!"]]}], "kwAr": "لهذا السبب", "noteAr": ""}, {"kw": "I obtained", "raw": "1Ti_1:13; 2Co_4:1", "note": "", "refs": [{"l": "1Ti 1:13", "n": "", "vs": [[13, "مع أني كنت في الماضي مجدفا عليه، ومضطهدا ومهينا له! ولكني عوملت بالرحمة، لأني عملت ما عملته عن جهل وفي عدم إيمان."]]}, {"l": "2Co 4:1", "n": "", "vs": [[1, "فما دامت لنا إذن هذه الخدمة برحمة من الله، فلا تخور عزيمتنا."]]}], "kwAr": "عوملت بالرحمة", "noteAr": ""}, {"kw": "all", "raw": "Exo_34:8; Rom_2:4, Rom_2:5; 1Pe_3:20; 2Pe_3:9, 2Pe_3:15", "note": "", "refs": [{"l": "Exo 34:8", "n": "", "vs": [[8, "فخر موسى في الحال وسجد،"]]}, {"l": "Rom 2:4", "n": "", "vs": [[4, "أم أنك تحتقر غنى لطفه وصبره وطول أناته وأنت لا تعرف أن لطف الله يدفعك إلى التوبة؟"]]}, {"l": "Rom 2:5", "n": "", "vs": [[5, "ولكنك بسبب قساوتك وقلبك غير التائب، تخزن لنفسك غضبا ليوم الغضب، يوم تعلن دينونة الله العادلة."]]}, {"l": "1Pe 3:20", "n": "", "vs": [[20, "وذلك بعدما رفضوا البشارة في أيام نوح، عندما كان الله يتأنى صابرا طوال المدة التي كان نوح يبني فيها السفينة، التي نجا بها عدد قليل من الناس عبر الماء، ثمانية أشخاص فقط!"]]}, {"l": "2Pe 3:9", "n": "", "vs": [[9, "فالرب، إذن، لا يبطيء في إتمام وعده، كما يظن بعض الناس، ولكنه يتأنى عليكم، فهو لا يريد لأحد من الناس أن يهلك، بل يريد لجميع الناس أن يرجعوا إليه تائبين."]]}, {"l": "2Pe 3:15", "n": "", "vs": [[15, "وتأكدوا أن تأني ربنا في رجوعه، هو فرصة للخلاص."]]}], "kwAr": "صبره الطويل", "noteAr": ""}, {"kw": "for a", "raw": "2Ch_33:9-13, 2Ch_33:19; Isa_55:7; Luk_7:47, Luk_15:10, Luk_18:13, Luk_18:14, Luk_19:7-9, Luk_23:43; Joh_6:37; Act_13:39; Rom_5:20, Rom_15:4; Heb_7:25", "note": "", "refs": [{"l": "2Ch 33:9-13", "n": "", "vs": [[9, "غير أن منسى أضل شعب يهوذا وأهل أورشليم وأغواهم لارتكاب شرور أشد هولا من شرور الأمم الذين طردهم الرب من أمام بني إسرائيل."], [10, "ومع أن الرب حذر منسى وشعبه فلم يصغوا إليه."], [11, "لهذا أرسل الرب عليهم قادة جند ملك أشور، فقبضوا على منسى ووضعوا خزامة في أنفه، وقادوه مغلولا بسلاسل نحاس إلى بابل."], [12, "وفي ضيقه استغاث بالرب إلهه وتذلل جدا أمام إله آبائه،"], [13, "وابتهل إليه فاستجاب له، وسمع تضرعه ورده إلى أورشليم وإلى مملكته. فعلم منسى أن الرب هو الله ."]]}, {"l": "2Ch 33:19", "n": "", "vs": [[19, "كما أن صلاته واستجابة الرب له، وسائر خطاياه وخيانته، والأماكن التي شيد فيها المرتفعات ونصب فيها تماثيل عشتاروث، والأصنام التي أقامها قبل تذلله فهي مدونة في أخبار الأنبياء."]]}, {"l": "Isa 55:7", "n": "", "vs": [[7, "ليترك الشرير طريقه والأثيم أفكاره، وليتب إلى الرب فيرحمه، وليرجع إلى إلهنا لأنه يكثر الغفران."]]}, {"l": "Luk 7:47", "n": "", "vs": [[47, "لهذا السبب أقول لك: إن خطاياها الكثيرة قد غفرت، لهذا أحبت كثيرا. ولكن الذي يغفر له القليل، يحب قليلا!»"]]}, {"l": "Luk 15:10", "n": "", "vs": [[10, "أقول لكم: هكذا يكون بين ملائكة الله فرح بخاطيء واحد يتوب»."]]}, {"l": "Luk 18:13", "n": "", "vs": [[13, "ولكن جابي الضرائب، وقف من بعيد وهو لا يجرؤ أن يرفع عينيه نحو السماء، بل قرع صدره قائلا: ارحمني، ياالله ، أنا الخاطيء!"]]}, {"l": "Luk 18:14", "n": "", "vs": [[14, "أقول لكم: إن هذا الإنسان نزل إلى بيته مبررا، بعكس الآخر. فإن كل من يرفع نفسه يوضع؛ ومن يضع نفسه يرفع»."]]}, {"l": "Luk 19:7-9", "n": "", "vs": [[7, "فلما رأى الجميع ذلك، تذمروا قائلين: «قد دخل ليبيت عند رجل خاطيء!»"], [8, "ولكن زكا وقف وقال للرب: «يارب، ها أنا أعطي نصف أموالي للفقراء. وإن كنت قد اغتصبت شيئا من أحد، أرد له أربعة أضعاف!»"], [9, "فقال له يسوع: «اليوم تم الخلاص لهذا البيت، إذ هو أيضا ابن إبراهيم."]]}, {"l": "Luk 23:43", "n": "", "vs": [[43, "فقال له يسوع: «الحق أقول لك: اليوم ستكون معي في الفردوس!»"]]}, {"l": "Joh 6:37", "n": "", "vs": [[37, "ولكن كل ما يهبه الآب لي سيأتي إلي، ومن يأت إلي لا أطرحه إلى الخارج أبدا،"]]}, {"l": "Act 13:39", "n": "", "vs": [[39, "وأنه به يتبرر كل من يؤمن من كل ما عجزت شريعة موسى أن تبرره منه."]]}, {"l": "Rom 5:20", "n": "", "vs": [[20, "وأما الشريعة فقد أدخلت لتظهر كثرة المعصية. ولكن، حيث كثرت الخطيئة، تتوافر النعمة أكثر جدا،"]]}, {"l": "Rom 15:4", "n": "", "vs": [[4, "فإن كل ما سبق أن كتب فإنما كتب لتعليمنا، حتى يكون لنا رجاء بما في الكتاب من الصبر والعزاء."]]}, {"l": "Heb 7:25", "n": "", "vs": [[25, "وهو لذلك قادر دائما أن يحقق الخلاص الكامل للذين يتقربون به إلى الله. فهو، في حضرة الله، حي على الدوام ليتضرع من أجلهم ويحامي عنهم!"]]}], "kwAr": "مثالا", "noteAr": ""}, {"kw": "believe", "raw": "Joh_3:15, Joh_3:16, Joh_3:36, Joh_5:24, Joh_6:40,Joh_6:54, Joh_20:31; Rom_5:21, Rom_6:23; 1Jo_5:11, 1Jo_5:12", "note": "", "refs": [{"l": "Joh 3:15", "n": "", "vs": [[15, "لتكون الحياة الأبدية لكل من يؤمن به."]]}, {"l": "Joh 3:16", "n": "", "vs": [[16, "لأنه هكذا أحب الله العالم حتى بذل ابنه الوحيد، لكي لا يهلك كل من يؤمن به، بل تكون له الحياة الأبدية."]]}, {"l": "Joh 3:36", "n": "", "vs": [[36, "من يؤمن بالابن، فله الحياة الأبدية. ومن يرفض أن يؤمن بالابن، فلن يرى الحياة. بل يستقر عليه غضب الله»."]]}, {"l": "Joh 5:24", "n": "", "vs": [[24, "الحق الحق أقول لكم إن من يسمع كلامي ويؤمن بالذي أرسلني تكون له الحياة الأبدية، ولا يحاكم في اليوم الأخير، لأنه قد انتقل من الموت إلى الحياة."]]}, {"l": "Joh 6:40", "n": "", "vs": [[40, "نعم! إن مشيئة أبي هي أن كل من يرى الابن ويؤمن به تكون له الحياة الأبدية، وسأقيمه أنا في اليوم الأخير»."]]}, {"l": "Joh 6:54", "n": "", "vs": [[54, "من يأكل جسدي ويشر ب دمي، فله حياة أبدية، وأنا أقيمه في اليوم الأخير،"]]}, {"l": "Joh 20:31", "n": "", "vs": [[31, "وأما هذه الآيات فقد دونت لتؤمنوا بأن يسوع هو المسيح ابن الله، ولكي تكون لكم حياة باسمه إذ تؤمنون."]]}, {"l": "Rom 5:21", "n": "", "vs": [[21, "حتى إنه كما ملكت الخطيئة بالموت، فكذلك أيضا تملك النعمة على أساس البر مؤدية إلى الحياة الأبدية بيسوع المسيح ربنا."]]}, {"l": "Rom 6:23", "n": "", "vs": [[23, "لأن أجرة الخطيئة هي الموت، وأما هبة الله فهي الحياة الأبدية في المسيح يسوع ربنا."]]}, {"l": "1Jo 5:11", "n": "", "vs": [[11, "وهذه الشهادة هي أن الله أعطانا حياة أبدية، وأن هذه الحياة هي في ابنه."]]}, {"l": "1Jo 5:12", "n": "", "vs": [[12, "فمن كان له ابن الله كانت له الحياة. ومن لم يكن له ابن الله، لم تكن له الحياة!"]]}], "kwAr": "الذين سيؤمنون به", "noteAr": ""}], "arS": [["ولكن ", []], ["لهذا السبب", ["G1223", "G5124"]], [" ", []], ["عوملت بالرحمة", ["G1653"]], ["، ليجعل ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [" مني، أنا ", []], ["أولا", ["G4413"]], ["، ", []], ["مثالا", ["G5296"]], [" ", []], ["يظهر", ["G1731"]], [" ", []], ["صبره الطويل", ["G3115"]], ["، ", []], ["لجميع", ["G3956"]], [" الذين ", []], ["سيؤمنون", ["G3195", "G4100"]], [" به لنوال ", []], ["الحياة", ["G2222"]], [" ", []], ["الأبدية", ["G166"]], [".", []]]}, {"c": 1, "v": 17, "text": "فللملك الأزلي، الله الواحد غير المنظور وغير الفاني، الكرامة والمجد إلى أبد الآبدين. آمين!", "groups": [{"kw": "the King", "raw": "1Ti_6:15, 1Ti_6:16; Psa_10:16, Psa_45:1, Psa_45:6, Psa_47:6-8, Psa_90:2, Psa_145:13; Jer_10:10; Dan_2:44; Dan_7:14; Mic_5:2; Mal_1:14; Mat_6:13, Mat_25:34; Rom_1:23; Heb_1:8-13; Rev_17:14, Rev_19:16", "note": "", "refs": [{"l": "1Ti 6:15", "n": "", "vs": [[15, "هذا الظهور سوف يتممه الله في وقته الخاص، هو السيد المبارك الأوحد، ملك الملوك ورب الأرباب،"]]}, {"l": "1Ti 6:16", "n": "", "vs": [[16, "الذي وحده لا فناء له، الساكن في نور لا يدنى منه، الذي لم يره أي إنسان ولا يقدر أن يراه. له الكرامة والقدرة الأبدية. آمين!"]]}, {"l": "Psa 10:16", "n": "", "vs": [[16, "الرب ملك إلى أبد الدهور، قد بادت من أرضه الأمم (التي تعبد آلهة سواه)"]]}, {"l": "Psa 45:1", "n": "", "vs": [[1, "فاض قلبي بكلام صالح: إني أخاطب الملك بما قد أنشأته، ولساني فصيح كقلم الكاتب الماهر."]]}, {"l": "Psa 45:6", "n": "", "vs": [[6, "عرشك ياالله إلى دهر الدهور، وصولجان ملكك عادل ومستقيم."]]}, {"l": "Psa 47:6-8", "n": "", "vs": [[6, "رنموا لله، رنموا. رنموا لملكنا، رنموا."], [7, "لأن الله هو ملك الأرض كلها. رنموا له قصيدة حمد."], [8, "ملك الله على الأمم، الله جلس على عرشه المقدس."]]}, {"l": "Psa 90:2", "n": "", "vs": [[2, "قبل أن أوجدت الجبال أو كونت المسكونة، أنت الله من الأزل وإلى الأبد."]]}, {"l": "Psa 145:13", "n": "", "vs": [[13, "ملكك ملك سرمدي، وسلطانك من جيل إلى جيل يدوم."]]}, {"l": "Jer 10:10", "n": "", "vs": [[10, "أما الرب فهو الإله الحق، الإله الحي والملك السرمدي. ترتعد الأرض أمام غضبه ولا تتحمل الأمم فرط سخطه."]]}, {"l": "Dan 2:44", "n": "", "vs": [[44, "وفي عهد هؤلاء الملوك يقيم إله السماوات مملكة لا تنقرض إلى الأبد، ولا يترك ملكها لشعب آخر، وتسحق وتبيد جميع هذه الممالك. أما هي فتخلد إلى الأبد."]]}, {"l": "Dan 7:14", "n": "", "vs": [[14, "فأنعم عليه بسلطان ومجد وملكوت لتتعبد له كل الشعوب والأمم من كل لسان. سلطانه سلطان أبدي لا يفنى، وملكه لا ينقرض."]]}, {"l": "Mic 5:2", "n": "", "vs": [[2, "أما أنت يابيت لحم أفراتة، مع أنك قرية صغيرة بين ألوف قرى يهوذا، إلا أن منك يخرج لي من يصبح ملكا في إسرائيل وأصله منذ القديم، منذ الأزل."]]}, {"l": "Mal 1:14", "n": "", "vs": [[14, "ملعون المنافق الذي ينذر للرب ذكرا سليما من قطيعه، ثم يقرب للرب ما هو مصاب بعيب، لأني ملك عظيم واسمي مهوب بين الأمم، يقول الرب القدير»."]]}, {"l": "Mat 6:13", "n": "", "vs": [[13, "ولا تدخلنا في تجربة، لكن نجنا من الشرير، لأن لك الملك والقوة والمجد إلى الأبد. آمين."]]}, {"l": "Mat 25:34", "n": "", "vs": [[34, "ثم يقول الملك للذين عن يمينه: تعالوا يامن باركهم أبي، رثوا الملكوت الذي أعد لكم منذ إنشاء العالم:"]]}, {"l": "Rom 1:23", "n": "", "vs": [[23, "واستبدلوا بمجد الله الخالد تماثيل لصور الإنسان الفاني والطيور وذوات الأربع والزواحف."]]}, {"l": "Heb 1:8-13", "n": "", "vs": [[8, "ولكنه يخاطب الابن قائلا: «إن عرشك، ياالله، ثابت إلى أبد الآبدين، وصولجان حكمك عادل ومستقيم."], [9, "إنك أحببت البر وأبغضت الإثم. لذلك مسحك الله إلهك ملكا، إذ صب عليك زيت البهجة أكثر من رفقائك!»"], [10, "كما يخاطب الابن أيضا بقوله: «أنت، يارب، وضعت أساس الأرض في البداية. والسماوات هي صنع يديك."], [11, "هي تفنى، وأنت تبقى. فسوف تبلى كلها كما تبلى الثياب،"], [12, "فتطويها كالرداء، ثم تبدلها. ولكنك أنت الدائم الباقي، وسنوك لن تنتهي!»"], [13, "فهل قال الله مرة لأي واحد من الملائكة ما قاله للابن: «اجلس عن يميني حتى أجعل أعداءك موطئا لقدميك؟»"]]}, {"l": "Rev 17:14", "n": "", "vs": [[14, "ثم يحاربون الحمل، ولكن الحمل يهزمهم، لأنه رب الأرباب وملك الملوك، والذين معه هم المدعوون، المختارون، المؤمنون»."]]}, {"l": "Rev 19:16", "n": "", "vs": [[16, "وقد كتب على ثوبه وعلى فخذه «ملك الملوك ورب الأرباب»."]]}], "kwAr": "فللملك الأزلي", "noteAr": ""}, {"kw": "invisible", "raw": "Joh_1:18; Rom_1:20; Col_1:15; Heb_11:27; 1Jo_4:12", "note": "", "refs": [{"l": "Joh 1:18", "n": "", "vs": [[18, "ما من أحد رأى الله قط. ولكن الابن الوحيد، الذي في حضن الآب، هو الذي كشف عنه."]]}, {"l": "Rom 1:20", "n": "", "vs": [[20, "فإن ما لا يرى من أمور الله، أي قدرته الأزلية وألوهته، ظاهر للعيان منذ خلق العالم، إذ تدركه العقول من خلال المخلوقات. حتى إن الناس باتوا بلا عذر."]]}, {"l": "Col 1:15", "n": "", "vs": [[15, "هو صورة الله الذي لا يرى، والبكر على كل ما قد خلق،"]]}, {"l": "Heb 11:27", "n": "", "vs": [[27, "بالإيمان، ترك أرض مصر وهو غير خائف من غضب الملك. فقد مضى في تنفيذ قراره، كأنه يرى بجانبه الله غير المنظور."]]}, {"l": "1Jo 4:12", "n": "", "vs": [[12, "إن الله لم يره أحد من الناس قط. ولكن، حين نحب بعضنا بعضا، نبين أن الله يحيا في داخلنا، وأن محبته قد اكتملت في داخلنا."]]}], "kwAr": "غير المنظور", "noteAr": ""}, {"kw": "the only", "raw": "Rom_16:27; Jud_1:25", "note": "", "refs": [{"l": "Rom 16:27", "n": "", "vs": [[27, "المجد لله إلى الأبد، الحكيم وحده، بيسوع المسيح. آمين!"]]}, {"l": "Jud 1:25", "n": "", "vs": [[25, "لله الواحد، مخلصنا بيسوع المسيح ربنا ... المجد والجلال والقدرة والسلطة، من قبل أن كان الزمان، والآن وطوال الأزمان آمين!"]]}], "kwAr": "الله الواحد", "noteAr": ""}, {"kw": "be", "raw": "1Ch_29:11; Neh_9:5; Psa_41:13, Psa_57:11, Psa_72:18, Psa_72:19, Psa_106:48; Dan_4:34, Dan_4:37; Eph_3:20,Eph_3:21; 1Pe_5:11; 2Pe_3:18; Rev_4:8-11, Rev_5:9-14, Rev_7:12, Rev_19:1, Rev_19:6", "note": "", "refs": [{"l": "1Ch 29:11", "n": "", "vs": [[11, "لك يارب العظمة والسطوة والجلال والبهاء والمجد، لأن لك كل ما في السماء والأرض. أنت يارب صاحب الملك وقد تعاليت فوق رؤوس الجميع."]]}, {"l": "Neh 9:5", "n": "", "vs": [[5, "ونادى اللاويون: يشوع وقدميئيل وباني وحشبنيا وشربيا وهوديا وشبنيا وفتحيا قائلين: «قوموا وباركوا الرب إلهكم من الأزل إلى الأبد، وليتبارك اسمك المجيد المتعالي فوق كل بركة وتسبيح."]]}, {"l": "Psa 41:13", "n": "", "vs": [[13, "تبارك الرب إله إسرائيل، من الأزل وإلى الأبد. آمين فآمين."]]}, {"l": "Psa 57:11", "n": "", "vs": [[11, "ارتفع ياالله على السماوات، وليرتفع مجدك على الأرض كلها."]]}, {"l": "Psa 72:18", "n": "", "vs": [[18, "تبارك الرب إله إسرائيل، فهو وحده صانع العجائب."]]}, {"l": "Psa 72:19", "n": "", "vs": [[19, "تبارك اسمه المجيد إلى الأبد، ولتمتليء الأرض كلها من مجده. آمين ثم آمين."]]}, {"l": "Psa 106:48", "n": "", "vs": [[48, "مبارك الرب إله إسرائيل من الأزل إلى الأبد. وليقل الشعب كله: آمين. هللويا."]]}, {"l": "Dan 4:34", "n": "", "vs": [[34, "وفي ختام السبعة الأزمنة، أنا نبوخذناصر، التفت نحو السماء، فرجع إلي عقلي، وباركت العلي وسبحت وحمدت الحي الأبدي ذا السلطان السرمدي، والذي ملكه على مدى الأجيال."]]}, {"l": "Dan 4:37", "n": "", "vs": [[37, "فالآن، أنا نبوخذناصر، أسبح وأمجد وأحمد ملك السماء الذي جميع أعماله حق، وطرقه عادلة وقادر على إذلال كل من يسلك بالكبرياء."]]}, {"l": "Eph 3:20", "n": "", "vs": [[20, "والقادر أن يفعل، وفقا للقدرة العاملة فينا، ما يفوق بلا حصر كل ما نطلب أو نتصور،"]]}, {"l": "Eph 3:21", "n": "", "vs": [[21, "له المجد في الكنيسة، في المسيح يسوع، مدى الأجيال والدهور! آمين …"]]}, {"l": "1Pe 5:11", "n": "", "vs": [[11, "له المجد والسلطة إلى أبد الآبدين. آمين!"]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}, {"l": "Rev 4:8-11", "n": "", "vs": [[8, "وكان لكل كائن منها ستة أجنحة، تكسوها عيون من الداخل ومن الخارج. وهذه الكائنات الحية الأربعة تهتف ليلا ونهارا دون انقطاع قائلة: «قدوس قدوس قدوس، الرب الإله القادر على كل شيء، الذي كان والكائن والذي سيأتي»."], [9, "وكلما قدمت هذه الكائنات التمجيد والإجلال والحمد للجالس على العرش، الحي إلى أبد الآبدين،"], [10, "يجثو الشيوخ الأربعة والعشرون أمام الجالس على العرش ساجدين للحي إلى أبد الآبدين، ويلقون أكاليلهم أمام عرشه وهم يهتفون:"], [11, "«مستحق أنت ياربنا وإلهنا المجد والإجلال والقدرة، لأنك خلقت الأشياء كلها، وهي بإرادتك كائنة وقد خلقت!»"]]}, {"l": "Rev 5:9-14", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"], [10, "وجعلتهم مملكة لإلهنا وكهنة له، وسيملكون على الأرض»."], [11, "ثم نظرت، فسمعت ترتيل الملايين من الملائكة وهي تحيط بالعرش وبالكائنات الحية والشيوخ،"], [12, "وهم يهتفون بصوت عال: «مستحق هو الحمل المذبوح أن ينال القدرة والغنى والحكمة والقوة والإجلال والمجد والبركة»."], [13, "ثم سمعت كل خليقة في السماء وعلى الأرض، وتحت الأرض، وعلى البحر، هاتفة مع كل ما فيها: «البركة والإجلال والمجد والسلطة للجالس على العرش وللحمل، إلى أبد الآبدين»."], [14, "فردت الكائنات الحية الأربعة: «آمين!» وجثا الشيوخ ساجدين."]]}, {"l": "Rev 7:12", "n": "", "vs": [[12, "قائلين: «آمين! لإلهنا البركة والمجد والحكمة والشكر والإجلال والقدرة والقوة إلى أبد الآبدين. آمين!»"]]}, {"l": "Rev 19:1", "n": "", "vs": [[1, "وبعد هذا سمعت صوتا عاليا كأنه صادر من جمع كبير في السماء يقول: «هللويا! الخلاص والمجد والكرامة والقدرة للرب إلهنا"]]}, {"l": "Rev 19:6", "n": "", "vs": [[6, "ثم سمعت صوتا كأنه صوت جمع كبير أو شلال غزير أو رعد شديد، يقول: «هللويا! فإن الرب الإله القادر على كل شيء قد ملك،"]]}], "kwAr": "الكرامة والمجد", "noteAr": ""}, {"kw": "Amen", "raw": "Mat_6:13, Mat_28:20", "note": "", "refs": [{"l": "Mat 6:13", "n": "", "vs": [[13, "ولا تدخلنا في تجربة، لكن نجنا من الشرير، لأن لك الملك والقوة والمجد إلى الأبد. آمين."]]}, {"l": "Mat 28:20", "n": "", "vs": [[20, "وعلموهم أن يعملوا بكل ما أوصيتكم به. وها أنا معكم كل الأيام إلى انتهاء الزمان! »."]]}], "kwAr": "آمين", "noteAr": ""}], "arS": [["فللملك", ["G935"]], [" ", []], ["الأزلي", ["G165"]], ["، ", []], ["الله", ["G2316"]], [" ", []], ["الواحد", ["G3441"]], [" ", []], ["غير المنظور", ["G517"]], [" ", []], ["وغير الفاني", ["G862"]], ["، ", []], ["الكرامة", ["G5092"]], [" ", []], ["والمجد", ["G1391"]], [" إلى ", []], ["أبد الآبدين", ["G165"]], [". ", []], ["آمين", ["G281"]], ["!", []]]}, {"c": 1, "v": 18, "text": "هذه التوصيات، ياتيموثاوس ولدي، أسلمها لك، بمقتضى النبوآت السابقة المختصة بك، وغايتي أن تحسن الجهاد في حربك الروحية،", "groups": [{"kw": "charge", "raw": "1Ti_1:11, 1Ti_1:12, 1Ti_4:14, 1Ti_6:13, 1Ti_6:14, 1Ti_6:20; 2Ti_2:2, 2Ti_4:1-3", "note": "", "refs": [{"l": "1Ti 1:11", "n": "", "vs": [[11, "الموافق لإنجيل مجد الله المبارك، ذلك الإنجيل الذي وضع أمانة بين يدي."]]}, {"l": "1Ti 1:12", "n": "", "vs": [[12, "وكم أشكر المسيح يسوع ربنا الذي أعطاني القدرة وعينني خادما له، إذ اعتبرني جديرا بثقته،"]]}, {"l": "1Ti 4:14", "n": "", "vs": [[14, "لا تهمل الموهبة الخاصة التي فيك والتي أعطيت لك بالتنبوء ووضع الشيوخ أيديهم عليك."]]}, {"l": "1Ti 6:13", "n": "", "vs": [[13, "وأوصيك، أمام الله الذي يحيي كل شيء، والمسيح يسوع الذي شهد أمام بيلاطس البنطي بالاعتراف الحسن،"]]}, {"l": "1Ti 6:14", "n": "", "vs": [[14, "أن تحفظ الوصية خالية من العيب واللوم إلى يوم ظهور ربنا يسوع المسيح علنا."]]}, {"l": "1Ti 6:20", "n": "", "vs": [[20, "ياتيموثاوس، حافظ على الأمانة المودعة لديك. تجنب الكلام الدنس الباطل، ومناقضات ما يسمى زورا «معرفة»."]]}, {"l": "2Ti 2:2", "n": "", "vs": [[2, "والتعاليم التي سمعتها مني بحضور شهود عديدين، أودعها أمانة بين أيدي أناس جديرين بالثقة، يكونون قادرين على تعليم الآخرين."]]}, {"l": "2Ti 4:1-3", "n": "", "vs": [[1, "أطلب منك في حضرة الله والمسيح الذي سيدين الأحياء والأموات، بعودته العلنية وملكوته،"], [2, "أن تنادي بالكلمة منشغلا بها كليا، في الفرص المناسبة وغير المناسبة على السواء، وأن توبخ وتنذر وتشجع بكل صبر في التعليم."], [3, "فإنه سيأتي زمان لا يطيق الناس فيه التعليم الصحيح، بل تبعا لشهواتهم الخاصة يكدسون لأنفسهم معلمين (يقولون لهم كلاما) يداعب الآذان."]]}], "kwAr": "هذه التوصيات", "noteAr": ""}, {"kw": "son", "raw": "1Ti_1:2; Phi_2:22; 2Ti_1:2, 2Ti_2:1; Tit_1:4; Phm_1:10", "note": "", "refs": [{"l": "1Ti 1:2", "n": "", "vs": [[2, "إلى تيموثاوس ولدي الحقيقي في الإيمان. لتكن لك النعمة والرحمة والسلام من الله أبينا والمسيح يسوع ربنا!"]]}, {"l": "Phi 2:22", "n": "", "vs": [[22, "أما تيموثاوس، فأنتم تعرفون أنه مختبر، إذ خدم معي في التبشير بالإنجيل كأنه ولد يعاون أباه."]]}, {"l": "2Ti 1:2", "n": "", "vs": [[2, "إلى تيموثاوس، ولدي الحبيب لتكن لك النعمة والرحمة والسلام من الله الآب والمسيح يسوع ربنا."]]}, {"l": "2Ti 2:1", "n": "", "vs": [[1, "وأنت ياولدي، فكن قويا في النعمة التي في المسيح يسوع."]]}, {"l": "Tit 1:4", "n": "", "vs": [[4, "إلى تيطس، ولدي الحقيقي بالنسبة إلى الإيمان المشترك بيننا."]]}, {"l": "Phm 1:10", "n": "", "vs": [[10, "فألتمس منك لأجل ولدي الذي ولدته وأنا مكبل بالقيود، أونسيموس،"]]}], "kwAr": "ولدي", "noteAr": ""}, {"kw": "according", "raw": "1Ti_4:4", "note": "", "refs": [{"l": "1Ti 4:4", "n": "", "vs": [[4, "فإن كل ما خلقه الله جيد، ولا شيء منه يرفض إذا تناوله الإنسان شاكرا؛"]]}], "kwAr": "بمقتضى النبوآت السابقة", "noteAr": ""}, {"kw": "mightest", "raw": "1Ti_6:12; 2Co_10:3, 2Co_10:4; Eph_6:12-18; 2Ti_2:3-5, 2Ti_4:7", "note": "", "refs": [{"l": "1Ti 6:12", "n": "", "vs": [[12, "أحسن الجهاد في معركة الإيمان الجميلة. تمسك بالحياة الأبدية، التي إليها قد دعيت، وقد اعترفت الاعتراف الحسن (بالإيمان) أمام شهود كثيرين."]]}, {"l": "2Co 10:3", "n": "", "vs": [[3, "فمع أننا نعيش في الجسد، فإننا لا نحارب وفقا للجسد."]]}, {"l": "2Co 10:4", "n": "", "vs": [[4, "فإن الأسلحة التي نحارب بها ليست جسدية، بل قادرة بالله على هدم الحصون: بها نهدم النظريات"]]}, {"l": "Eph 6:12-18", "n": "", "vs": [[12, "فإن حربنا ليست ضد ذوي اللحم والدم، بل ضد الرئاسات، ضد السلطات، ضد أسياد العالم حكام هذا الظلام، ضد قوى الشر الروحية في الأماكن السماوية."], [13, "لذلك اتخذوا سلاح الله الكامل، لتتمكنوا من المقاومة في يوم الشر، ومن الصمود أيضا بعد تحقيق كل هدف."], [14, "فاصمدوا إذن بعد أن تتخذوا الحق حزاما لأوساطكم، والبر درعا لصدوركم،"], [15, "والاستعداد لنشر بشارة السلام حذاء لأقدامكم."], [16, "وفوق هذا كله، احملوا الإيمان ترسا به تقدرون أن تطفئوا جميع سهام الشرير المشتعلة."], [17, "واتخذوا الخلاص خوذة للرأس، وكلمة الله سيف الروح."], [18, "كونوا مصلين في كل حال، بكل صلاة وطلبة في الروح، وساهرين لهذا الغرض عينه مواظبين تماما على جميع الطلبات لأجل القديسين جميعا،"]]}, {"l": "2Ti 2:3-5", "n": "", "vs": [[3, "شارك في احتمال الآلام كجندي صالح للمسيح يسوع."], [4, "وما من مجند يربك نفسه بشؤون الحياة إذا رغب في إرضاء من جنده."], [5, "كما أن المصارع لا يفوز بالإكليل إلا إذا صارع بحسب القوانين."]]}, {"l": "2Ti 4:7", "n": "", "vs": [[7, "قد جاهدت الجهاد الحسن، قد بلغت نهاية الشوط، قد حافظت على الإيمان."]]}], "kwAr": "أن تحسن الجهاد", "noteAr": ""}], "arS": [["هذه ", []], ["التوصيات", ["G3852"]], ["، ", []], ["ياتيموثاوس", ["G5095"]], [" ", []], ["ولدي", ["G5043"]], ["، ", []], ["أسلمها", ["G3908"]], [" لك، ", []], ["بمقتضى", ["G2596"]], [" ", []], ["النبوآت", ["G4394"]], [" ", []], ["السابقة", ["G4254"]], [" المختصة بك، وغايتي أن تحسن ", []], ["الجهاد", ["G4754"]], [" في ", []], ["حربك", ["G4752"]], [" الروحية،", []]]}, {"c": 1, "v": 19, "text": "متمسكا بالإيمان، وبالضمير الصالح، هذا الضمير الذي تخلى عنه بعضهم، فانكسرت بهم سفينة الإيمان.", "groups": [{"kw": "Holding", "raw": "1Ti_1:5, 1Ti_3:9; Tit_1:9; Heb_3:14; 1Pe_3:15, 1Pe_3:16; Rev_3:3, Rev_3:8, Rev_3:10", "note": "", "refs": [{"l": "1Ti 1:5", "n": "", "vs": [[5, "أما الغاية مما أوصيتك به، فهي المحبة النابعة من قلب طاهر وضمير صالح وإيمان خال من الرياء."]]}, {"l": "1Ti 3:9", "n": "", "vs": [[9, "يتمسكون بحقائق الإيمان الخفية بضمير نقي."]]}, {"l": "Tit 1:9", "n": "", "vs": [[9, "ملتصقا بالكلمة الصادقة الموافقة للتعليم، ليكون قادرا على تشجيع المؤمنين بالتعليم الصحيح وعلى إفحام المعارضين."]]}, {"l": "Heb 3:14", "n": "", "vs": [[14, "فإن تمسكنا دائما بالثقة التي انطلقنا بها في البداية، وأبقيناها ثابتة إلى النهاية، نكون مشاركين للمسيح."]]}, {"l": "1Pe 3:15", "n": "", "vs": [[15, "وإنما كرسوا المسيح ربا في قلوبكم. وكونوا دائما مستعدين لأن تقدموا جوابا مقنعا لكل من يسألكم عن سبب الرجاء الذي في داخلكم"]]}, {"l": "1Pe 3:16", "n": "", "vs": [[16, "على أن تفعلوا ذلك بوداعة واحترام، محافظين على طهارة ضمائركم، سالكين في المسيح سلوكا صالحا، وعندئذ يخيب الذين يوجهون إليكم التهم الكاذبة ويشتمونكم كأنكم تفعلون شرا."]]}, {"l": "Rev 3:3", "n": "", "vs": [[3, "تذكر ما سبق أن تقبلته وسمعته، وتمسك بما آمنت به، وتب! فإن كنت لا تتنبه، آتيك كما يأتي اللص، ولا تدري في أية ساعة أفاجئك!"]]}, {"l": "Rev 3:8", "n": "", "vs": [[8, "إني عالم بأعمالك. فمع أن لك قوة ضئيلة، فقد أطعت كلمتي ولم تنكر اسمي، ولذلك فتحت لك بابا لا يقدر أحد أن يغلقه."]]}, {"l": "Rev 3:10", "n": "", "vs": [[10, "ولأنك حفظت كلمتي وصبرت، فسأحفظك أنا أيضا من ساعة التجربة التي ستأتي على العالم أجمع لتجرب الساكنين على الأرض."]]}], "kwAr": "متمسكا بالإيمان", "noteAr": ""}, {"kw": "which", "raw": "Phi_3:18, Phi_3:19; 2Ti_3:1-6; 2Pe_2:1-3, 2Pe_2:12-22; Jud_1:10-13", "note": "", "refs": [{"l": "Phi 3:18", "n": "", "vs": [[18, "فإن كثيرين ممن يسلكون بينكم، وقد ذكرتهم لكم مرارا وأذكرهم الآن أيضا باكيا، إنما هم أعداء لصليب المسيح."]]}, {"l": "Phi 3:19", "n": "", "vs": [[19, "الذين مصيرهم الهلاك، وإلههم بطونهم، ومفخرتهم في عيبتهم، وفكرهم منصرف إلى الأمور الأرضية."]]}, {"l": "2Ti 3:1-6", "n": "", "vs": [[1, "واعلم هذا الأمر: أن أزمنة صعبة ستعم في الأيام الأخيرة؛"], [2, "إذ يكون الناس محبين لأنفسهم، محبين للمال، متكبرين، مباهين بأنفسهم، شتامين، غير مطيعين لوالديهم، ناكرين للجميل، دنسين،"], [3, "متحجري العواطف، غير صفوحين، نمامين، جامحي الأهواء، شرسين غير محبين للصلاح،"], [4, "خائنين، وقحين، مدعين، محبين للذات أكثر من محبتهم لله،"], [5, "لهم من التقوى مظهرها ولكنهم لقوتها منكرون، فعن هؤلاء الناس ابتعد!"], [6, "فمن هؤلاء من يدخلون البيوت خلسة، ويوقعون في حبائلهم بعض النساء السخيفات المثقلات بالخطايا، اللواتي تجرفهن شهوات مختلفة،"]]}, {"l": "2Pe 2:1-3", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."], [2, "وكثيرون سيسيرون وراءهم في طرق الإباحية. وبسببهم توجه الإهانة إلى طريق الحق."], [3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "2Pe 2:12-22", "n": "", "vs": [[12, "حقا إن هؤلاء المعلمين الدجالين الذين يتكلمون كلاما مهينا في أمور يجهلونها، يشبهون الحيوانات المفترسة غير العاقلة، المولودة ليصطادها الناس ويقتلوها. فلابد أن يهلكوا مثلها."], [13, "وبذلك ينالون أجرة إثمهم! إنهم يحسبون الانغماس في اللذات طول النهار بهجة عظيمة. فهم أوساخ وعيوب: يتلذذون بالنجاسة ويحاولون خداعكم، فيشتركون معكم في الولائم."], [14, "عيونهم لا تنظر إلا نظرات الزنى، ولا تشبع من الخطيئة. وكم من نفوس ضعيفة تقع في فخاخهم! أما قلوبهم، فقد تدربت على الشهوة والطمع. إنهم حقا أبناء اللعنة!"], [15, "وإذ خرجوا عن الطريق المستقيم، ضلوا. فهم سائرون في طريق بلعام بن بعور، الذي أحب الحصول على المال أجرة لإثمه."], [16, "ولكنه توبخ على هذه المخالفة التي ارتكبها. إذ إن الحمار الأبكم نطق بصوت بشري، فوضع حدا لحماقة ذلك النبي!"], [17, "فليس هؤلاء إلا آبارا لا ماء فيها، وغيوما تسوقها الريح العاصفة. ويا له من مصير مرعب محجوز لهم في الظلام الأبدي القاتم!"], [18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."], [19, "يعدون هؤلاء بالحرية، وهم أنفسهم عبيد للفساد! لأن الإنسان يصير عبدا لكل ما يتسلط عليه ويغلبه."], [20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."], [21, "وبالحقيقة، كان أفضل لهم لو أنهم لم يتعرفوا بطريق البر، من أن يتعرفوا به ثم يرتدوا عن الوصية المقدسة التي تسلموها."], [22, "وينطبق على هؤلاء ما يقوله المثل الصادق: «عاد الكلب إلى تناول ما تقيأه، والخنزيرة المغتسلة إلى التمرغ في الوحل!»"]]}, {"l": "Jud 1:10-13", "n": "", "vs": [[10, "ولكن هؤلاء المعلمين يتكلمون كلاما مهينا على أمور لا يعرفونها. وأما ما يفهمونه بالغريزة، كالحيوانات غير العاقلة، فإنهم به يدمرون أنفسهم."], [11, "الويل لهم! لأنهم سلكوا طريق قايين، واندفعوا إلى ارتكاب خطيئة بلعام طلبا للمال، وتمردوا كما تمرد قورح، فدمروا أنفسهم."], [12, "إنهم يشتركون معكم في ولائم المحبة دون خجل، ولكنهم كصخور تعيقكم. لا هم لهم سوى تعليف أنفسهم! إنهم يشبهون غيوما بلا مطر تسوقها الرياح، وأشجارا خريفية بلا ثمر، يقتلعها أصحابها، فتكون قد ماتت مرتين."], [13, "وبأعمالهم المخجلة يفضحون أنفسهم كأمواج في البحر هائجة تقذف الأوساخ. وهم أشبه بنجوم تائهة في الفضاء، مصيرها الظلام الشديد إلى الأبد!"]]}], "kwAr": "الذي تخلى عنه بعضهم", "noteAr": ""}, {"kw": "concerning", "raw": "1Ti_4:1, 1Ti_4:2; 1Co_11:19; Gal_1:6-8, Gal_5:4; 2Ti_4:4; Heb_6:4-6; 1Jo_2:19", "note": "", "refs": [{"l": "1Ti 4:1", "n": "", "vs": [[1, "إلا أن الروح يعلن صراحة أن قوما في الأزمنة الأخيرة سوف يرتدون عن الإيمان، منساقين وراء أرواح مضللة وتعاليم شيطانية،"]]}, {"l": "1Ti 4:2", "n": "", "vs": [[2, "في موجة رياء ينشرها معلمون دجالون لهم ضمائر كويت بالنار."]]}, {"l": "1Co 11:19", "n": "", "vs": [[19, "لأنه لابد من وجود المذاهب بينكم، حتى يبرز الفاضلون فيكم."]]}, {"l": "Gal 1:6-8", "n": "", "vs": [[6, "عجبا! كيف تتحولون بمثل هذه السرعة عن الذي دعاكم بنعمة المسيح، وتنصرفون إلى إنجيل غريب؟"], [7, "لا أعني أن هنالك إنجيلا آخر، بل إنما هنالك بعض (المعلمين) الذين يثيرون البلبلة بينكم، راغبين في تحوير إنجيل المسيح."], [8, "ولكن، حتى لو بشرناكم نحن، أو بشركم ملاك من السماء، بغير الإنجيل الذي بشرناكم به، فليكن ملعونا!"]]}, {"l": "Gal 5:4", "n": "", "vs": [[4, "يامن تريدون التبرير عن طريق الشريعة، قد حرمتم المسيح وسقطتم من النعمة!"]]}, {"l": "2Ti 4:4", "n": "", "vs": [[4, "فيحولون آذانهم بعيدا عن الحق، منحرفين إلى الخرافات."]]}, {"l": "Heb 6:4-6", "n": "", "vs": [[4, "ذلك لأن الذين قد تعرضوا مرة لنور الإيمان بالمسيح، فذاقوا العطية السماوية، وصاروا (إلى حين) من شركاء الروح القدس،"], [5, "وذاقوا كلمة الله الطيبة، وشاهدوا المعجزات التي تظهر عظمة «العالم الآتي»،"], [6, "ثم ارتدوا إلى تلك الأسس القديمة، أولئك يستحيل عليهم أن يتجددوا ثانية فيعودوا إلى التوبة. فهم يجنون على أنفسهم إذ يصلبون ابن الله مرة ثانية ويجعلونه عرضة للعار."]]}, {"l": "1Jo 2:19", "n": "", "vs": [[19, "هؤلاء الدجالون انفصلوا عنا، لكنهم في الواقع لم يكونوا منا. ولو كانوا منا لظلوا معنا. فانفصالهم عنا إذن برهان على أنهم جميعا ليسوا منا."]]}], "kwAr": "سفينة الإيمان", "noteAr": ""}, {"kw": "made", "raw": "1Ti_6:9; Mat_6:27", "note": "", "refs": [{"l": "1Ti 6:9", "n": "", "vs": [[9, "أما الذين يرغبون في أن يصيروا أغنياء، فيسقطون في التجربة والفخ ويتورطون في كثير من الشهوات السفيهة المضرة التي تغرق الناس في الدمار والهلاك."]]}, {"l": "Mat 6:27", "n": "", "vs": [[27, "فمن منكم إذا حمل الهموم يقدر أن يطيل عمره ولو ساعة واحدة؟"]]}], "kwAr": "فانكسرت بهم", "noteAr": ""}], "arS": [["متمسكا", ["G2192"]], [" ", []], ["بالإيمان", ["G4102"]], ["، ", []], ["وبالضمير", ["G4893"]], [" ", []], ["الصالح", ["G18"]], ["، هذا الضمير الذي ", []], ["تخلى", ["G683"]], [" عنه ", []], ["بعضهم", ["G5100"]], ["، ", []], ["فانكسرت بهم سفينة", ["G3489"]], [" ", []], ["الإيمان", ["G4102"]], [".", []]]}, {"c": 1, "v": 20, "text": "ومن هؤلاء همنايوس وإسكندر، وقد سلمتهما إلى الشيطان ليتعلما بالتأديب ألا يجدفا.", "groups": [{"kw": "Hymenaeus", "raw": "2Ti_2:17", "note": "", "refs": [{"l": "2Ti 2:17", "n": "", "vs": [[17, "وكلامهم ينهش كالآكلة، ومنهم هيمنايوس وفيليتوس،"]]}], "kwAr": "همنايوس", "noteAr": ""}, {"kw": "Alexander", "raw": "Act_19:33; 2Ti_2:14, 2Ti_4:14, 2Ti_4:15", "note": "", "refs": [{"l": "Act 19:33", "n": "", "vs": [[33, "وكان بين الجمهور يهودي اسمه إسكندر، دفعه اليهود إلى الأمام، ودعاه بعضهم إلى الكلام. فأشار بيده يريد أن يلقي على الشعب كلمة دفاع."]]}, {"l": "2Ti 2:14", "n": "", "vs": [[14, "بهذه الأمور ذكر، شاهدا في حضرة الله أن لا تنشأ المجادلات الكلامية، وهي لا تنفع شيئا، غير تخريب سامعيها."]]}, {"l": "2Ti 4:14", "n": "", "vs": [[14, "إن إسكندر النحاس قد أساء إلي إساءات كثيرة، سيجازيه الرب حسب أعماله."]]}, {"l": "2Ti 4:15", "n": "", "vs": [[15, "فاحترس منه أنت أيضا، لأنه قاوم كلامنا مقاومة شديدة."]]}], "kwAr": "وإسكندر", "noteAr": ""}, {"kw": "I have", "raw": "Mat_18:17; 1Co_5:4, 1Co_5:5; 2Co_10:6, 2Co_13:10", "note": "", "refs": [{"l": "Mat 18:17", "n": "", "vs": [[17, "فإذا لم يسمع لهما، فاعرض الأمر على الكنيسة. فإذا لم يسمع للكنيسة أيضا، فليكن عندك كالوثني وجابي الضرائب."]]}, {"l": "1Co 5:4", "n": "", "vs": [[4, "باسم ربنا يسوع المسيح، إذ تجتمعون معا، وروحي معكم، فبسلطة ربنا يسوع المسيح،"]]}, {"l": "1Co 5:5", "n": "", "vs": [[5, "تقررون تسليم مرتكب هذا الفعل إلى الشيطان، ليهلك جسده؛ أما روحه فتخلص في يوم الرب يسوع."]]}, {"l": "2Co 10:6", "n": "", "vs": [[6, "ونحن على استعداد لمعاقبة كل عصيان، بعد أن تكون طاعتكم قد اكتملت."]]}, {"l": "2Co 13:10", "n": "", "vs": [[10, "لهذا أكتب إليكم بهذه الأمور وأنا غائب، حتى إذا حضرت لا ألجأ إلى الحزم بحسب السلطة التي منحني إياها الرب للبنيان لا للهدم."]]}], "kwAr": "سلمتهما إلى الشيطان", "noteAr": ""}, {"kw": "that", "raw": "1Co_11:32; 2Th_3:15; Rev_3:19", "note": "", "refs": [{"l": "1Co 11:32", "n": "", "vs": [[32, "ولكن، ما دام قد حكم علينا، فإننا نؤدب من قبل الرب حتى لا ندان مع العالم."]]}, {"l": "2Th 3:15", "n": "", "vs": [[15, "ولكن، لا تعتبروه عدوا لكم، بل أرشدوه باعتباره أخا."]]}, {"l": "Rev 3:19", "n": "", "vs": [[19, "إني أوبخ وأؤدب من أحبه، لذا كن حارا وتب!"]]}], "kwAr": "ليتعلما بالتأديب", "noteAr": ""}, {"kw": "blaspheme", "raw": "Act_13:45; 2Ti_3:2; Rev_13:1, Rev_13:5, Rev_13:6", "note": "", "refs": [{"l": "Act 13:45", "n": "", "vs": [[45, "فلما رأى اليهود الجموع ملأت الغيرة صدورهم، وأخذوا يعارضون كلام بولس مجدفين."]]}, {"l": "2Ti 3:2", "n": "", "vs": [[2, "إذ يكون الناس محبين لأنفسهم، محبين للمال، متكبرين، مباهين بأنفسهم، شتامين، غير مطيعين لوالديهم، ناكرين للجميل، دنسين،"]]}, {"l": "Rev 13:1", "n": "", "vs": [[1, "ثم رأيت نفسي واقفا على رمل البحر، وإذا وحش خارج من البحر، له سبعة رؤوس وعشرة قرون، على كل قرن منها تاج، وقد كتب على كل رأس اسم تجديف."]]}, {"l": "Rev 13:5", "n": "", "vs": [[5, "وأعطى التنين الوحش فما ينطق بكلام الكبرياء والتجديف، وأعطاه سلطة العمل مدة اثنين وأربعين شهرا."]]}, {"l": "Rev 13:6", "n": "", "vs": [[6, "فأخذ الوحش يشتم اسم الله، ويشتم بيته وسكان السماء."]]}], "kwAr": "ألا يجدفا", "noteAr": ""}], "arS": [["ومن هؤلاء ", []], ["همنايوس", ["G5211"]], [" ", []], ["وإسكندر", ["G223"]], ["، وقد ", []], ["سلمتهما", ["G3860"]], [" إلى ", []], ["الشيطان", ["G4567"]], [" ", []], ["ليتعلما بالتأديب", ["G3811"]], [" ألا ", []], ["يجدفا", ["G987"]], [".", []]]}, {"c": 2, "v": 1, "text": "فأطلب، قبل كل شيء، أن تقيموا الطلبات الحارة والصلوات والتضرعات والتشكرات لأجل جميع الناس،", "groups": [{"kw": "exhort", "raw": "or, desire, 2Co_8:6; Eph_3:13; Heb_6:11", "note": "or, desire, 2Co_8:6; Eph_3:13; Heb_6:11", "refs": [{"l": "2Co 8:6", "n": "", "vs": [[6, "مما جعلنا نلتمس من تيطس أن يكمل عندكم هذا الإحسان كما سبق أن ابتدأ به."]]}, {"l": "Eph 3:13", "n": "", "vs": [[13, "فلذلك أطلب إليكم ألا يفتر عزمكم بسبب الضيقات التي أقاسيها لأجلكم، فهي مفخرة لكم."]]}, {"l": "Heb 6:11", "n": "", "vs": [[11, "وإنما نتمنى أن يظهر كل واحد منكم اجتهادا مماثلا في المحافظة حتى النهاية على الثقة الكاملة بالرجاء."]]}], "kwAr": "فأطلب", "noteAr": "أو: أرغب."}, {"kw": "first", "raw": "1Co_15:3", "note": "", "refs": [{"l": "1Co 15:3", "n": "", "vs": [[3, "فالواقع أني سلمتكم، في أول الأمر، ما كنت قد تسلمته، وهو أن المسيح مات من أجل خطايانا وفقا لما في الكتاب،"]]}], "kwAr": "قبل كل شيء", "noteAr": ""}, {"kw": "supplications", "raw": "1Ti_5:5; Gen_18:23-32; 1Ki_8:41-43; Psa_67:1-4, Psa_72:19; Mat_6:9, Mat_6:10; Jam_5:16", "note": "", "refs": [{"l": "1Ti 5:5", "n": "", "vs": [[5, "ولكن الأرملة التي تعيش وحيدة ولا معيل لها، فقد وضعت رجاءها في الله وهي تداوم على الأدعية والصلوات ليلا ونهارا."]]}, {"l": "Gen 18:23-32", "n": "", "vs": [[23, "فاقترب إبراهيم وقال: «أتهلك البار مع الأثيم؟"], [24, "لو وجد في المدينة خمسون بارا، فهل تدمرها ولا تصفح عنها من أجل الخمسين بارا الذين فيها؟"], [25, "تنزهت عن أن تهلك البار مع الأثيم، فيكون البار كالأثيم؛ حاشا لك. أديان الأرض كلها لا يجري عدلا؟»"], [26, "فقال الرب: «إن وجدت في سدوم خمسين بارا فإنني أصفح عن المكان كله من أجلهم»."], [27, "فأجاب إبراهيم: «ها أنا قد أخذت في مخاطبة المولى، مع أنني لست سوى تراب ورماد."], [28, "ماذا لو نقص الخمسون بارا خمسة؟ أفتهلك المدينة كلها من أجل الخمسة؟» فأجابه: «إن وجدت خمسة وأربعين بارا لا أهلكها»."], [29, "فخاطبه إبراهيم ثانية: «وماذا لو وجد هناك أربعون بارا فقط؟». فأجابه: «لا أهلكها من أجل الأربعين»."], [30, "وقال إبراهيم: «لا يغضب المولى، بل دعني أتكلم. ماذا لو وجد هناك ثلاثون بارا؟». فأجابه: «لا أهلكها إن وجدت ثلاثين»."], [31, "وقال إبراهيم: «ها أنا قد استرسلت في الكلام أمام المولى، فماذا لو وجدت هناك عشرين بارا؟» فقال: «لا أهلكها من أجل العشرين»."], [32, "وقال إبراهيم: «لا يغضب المولى، فأتكلم مرة أخرى: ماذا لو وجد هناك عشرة؟». فأجابه الرب: «لا أهلكها من أجل العشرة»."]]}, {"l": "1Ki 8:41-43", "n": "", "vs": [[41, "أما الغريب الذي لا ينتمي إلى شعبك إسرائيل، والذي يقبل من أرض بعيدة من أجل اسمك،"], [42, "لأن الغرباء يسمعون باسمك العظيم، وبما أجرته يدك القوية وذراعك المقتدرة، فيحضرون ويصلون في هذا الهيكل،"], [43, "فاستجب أنت من السماء مقر سكناك، وافعل كل ما يناشدك به الغريب، فيدعى باسمك بين كل أمم الأرض، فيخافوك كما يخافك شعبك إسرائيل، ويدركوا أن اسمك قد دعي على هذا الهيكل الذي بنيته."]]}, {"l": "Psa 67:1-4", "n": "", "vs": [[1, "ليترَأف الله علينا وليباركنا، وليضيء بوجهه علينا"], [2, "لكي يعرف في الأرض طريقك، وبين جميع الأمم خلاصك."], [3, "تحمدك الشعوب ياالله ، تحمدك الشعوب كلها."], [4, "تفرح وتبتهج الأمم لأنك تدين الشعوب بالاستقامة، وتهدي أمم الأرض."]]}, {"l": "Psa 72:19", "n": "", "vs": [[19, "تبارك اسمه المجيد إلى الأبد، ولتمتليء الأرض كلها من مجده. آمين ثم آمين."]]}, {"l": "Mat 6:9", "n": "", "vs": [[9, "فصلوا أنتم مثل هذه الصلاة: أبانا الذي في السماوات، ليتقدس اسمك!"]]}, {"l": "Mat 6:10", "n": "", "vs": [[10, "ليأت ملكوتك! لتكن مشيئتك على الأرض كما هي في السماء!"]]}, {"l": "Jam 5:16", "n": "", "vs": [[16, "ليعترف كل واحد منكم لأخيه بزلاته، وصلوا بعضكم لأجل بعض، حتى تشفوا. إن الصلاة الحارة التي يرفعها البار لها فعالية عظيمة."]]}], "kwAr": "الطلبات الحارة", "noteAr": ""}, {"kw": "and", "raw": "Rom_1:8, Rom_6:17; Eph_5:20; Phi_1:3; 2Th_1:3", "note": "", "refs": [{"l": "Rom 1:8", "n": "", "vs": [[8, "بادىء بدء، أشكر إلهي بيسوع المسيح من أجلكم جميعا، لأن إيمانكم يذاع خبره في العالم كله."]]}, {"l": "Rom 6:17", "n": "", "vs": [[17, "إنما الشكر لله، لأنكم كنتم عبيدا للخطيئة ولكن أطعتم من القلب صيغة التعليم الذي وضعتم في عهدته."]]}, {"l": "Eph 5:20", "n": "", "vs": [[20, "رافعين الشكر كل حين وعلى كل شيء لله والآب، باسم ربنا يسوع المسيح؛"]]}, {"l": "Phi 1:3", "n": "", "vs": [[3, "إني أشكر إلهي كلما تذكرتكم،"]]}, {"l": "2Th 1:3", "n": "", "vs": [[3, "من واجبنا أن نشكر الله على الدوام لأجلكم أيها الإخوة. كما أن هذا حق: لأن إيمانكم ينمو نموا فائقا، ومحبة أحدكم للآخر تفيض بينكم جميعا."]]}], "kwAr": "والتشكرات", "noteAr": ""}, {"kw": "all men", "raw": "1Ti_2:4; Act_17:30; 1Th_3:12; 2Ti_2:24; Tit_2:11, Tit_3:2", "note": "", "refs": [{"l": "1Ti 2:4", "n": "", "vs": [[4, "فهو يريد لجميع الناس أن يخلصوا، ويقبلوا إلى معرفة الحق بالتمام:"]]}, {"l": "Act 17:30", "n": "", "vs": [[30, "فالله الآن يدعو جميع الناس في كل مكان أن يرجعوا إليه تائبين، وقد غض النظر عن أزمنة الجهل التي مرت،"]]}, {"l": "1Th 3:12", "n": "", "vs": [[12, "وليجعلكم الرب تنمون وتفيضون في المحبة لتحبوا بعضكم بعضا وجميع الناس كمحبتنا لكم،"]]}, {"l": "2Ti 2:24", "n": "", "vs": [[24, "وعبد الرب يجب ألا يتشاجر، بل أن يكون مترفقا تجاه الجميع، قادرا على التعليم، يتحمل المشقات بصبر،"]]}, {"l": "Tit 2:11", "n": "", "vs": [[11, "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت."]]}, {"l": "Tit 3:2", "n": "", "vs": [[2, "ولا يقولوا سوءا في أحد، ولا يكونوا مخاصمين، بل لطفاء يعاملون الجميع بوداعة تامة."]]}], "kwAr": "لأجل جميع الناس", "noteAr": ""}], "arS": [["فأطلب", ["G3870"]], ["، ", []], ["قبل كل شيء", ["G4412", "G3956"]], ["، أن تقيموا ", []], ["الطلبات الحارة", ["G1162"]], [" ", []], ["والصلوات", ["G4335"]], [" ", []], ["والتضرعات", ["G1783"]], [" ", []], ["والتشكرات", ["G2169"]], [" لأجل ", []], ["جميع", ["G3956"]], [" ", []], ["الناس", ["G444"]], ["،", []]]}, {"c": 2, "v": 2, "text": "ولأجل الملوك وأصحاب السلطة، لكي نعيش حياة مطمئنة هادئة كلية التقوى والرصانة.", "groups": [{"kw": "kings", "raw": "Ezr_6:10; Neh_1:11; Psa_20:1-4, Psa_72:1; Jer_29:7", "note": "", "refs": [{"l": "Ezr 6:10", "n": "", "vs": [[10, "ليواظبوا على تقريب ذبائح سرور لإله السماء، ويثابروا على الصلاة من أجل حياة الملك وأبنائه."]]}, {"l": "Neh 1:11", "n": "", "vs": [[11, "فلتصغ أذنك ياسيد إلى صلاة عبدك وتضرعات عبيدك الذين يبتهجون بتوقير اسمك. وهب عبدك اليوم النجاح، وامنحه رحمة أمام الملك لأني كنت ساقيا للملك."]]}, {"l": "Psa 20:1-4", "n": "", "vs": [[1, "ليستجب لك الرب في يوم ضيقك. ليحرسك اسم إله يعقوب."], [2, "ليرسل لك عونا من مقدسه، وأزرا من صهيون."], [3, "ليتذكر جميع تقدماتك، ويتقبل محرقاتك."], [4, "ليعطك بغية قلبك، ويتمم لك كل مقاصدك."]]}, {"l": "Psa 72:1", "n": "", "vs": [[1, "اللهم أعط أحكامك العادلة للملك ولابنه برك،"]]}, {"l": "Jer 29:7", "n": "", "vs": [[7, "والتمسوا سلام المدينة التي سبيتكم إليها، وصلوا من أجلها إلى الرب لأن سلامكم يتوقف على سلامها."]]}], "kwAr": "الملوك", "noteAr": ""}, {"kw": "for all", "raw": "Rom_13:1-7; 1Pe_2:13", "note": "", "refs": [{"l": "Rom 13:1-7", "n": "", "vs": [[1, "على كل نفس أن تخضع للسلطات الحاكمة. فلا سلطة إلا من عند الله، والسلطات القائمة مرتبة من قبل الله."], [2, "حتى إن من يقاوم السلطة، يقاوم ترتيب الله، والمقاومون سيجلبون العقاب على أنفسهم."], [3, "فإن الحكام لا يخافهم من يفعل الصلاح بل من يفعل الشر. أفترغب إذن في أن تكون غير خائف من السلطة؟ اعمل ما هو صالح، فتكون ممدوحا عندها،"], [4, "لأنها خادمة الله لك لأجل الخير. أما إن كنت تعمل الشر فخف، لأن السلطة لا تحمل السيف عبثا، إذ إنها خادمة الله، وهي التي تنتقم لغضبه ممن يفعل الشر."], [5, "ولذلك، فمن الضروري أن تخضعوا، لا اتقاء للغضب فقط، بل مراعاة للضمير أيضا."], [6, "فلهذا السبب تدفعون الضرائب أيضا، لأن رجال السلطة هم خدام لله يواظبون على هذا العمل بعينه."], [7, "فأدوا لكل واحد حقه: الضريبة لصاحب الضريبة والجزية لصاحب الجزية، والاحترام لصاحب الاحترام، والإكرام لصاحب الإكرام."]]}, {"l": "1Pe 2:13", "n": "", "vs": [[13, "فإكراما للرب، اخضعوا لكل نظام يدير شؤون الناس: للملك، باعتباره صاحب السلطة العليا،"]]}], "kwAr": "ولأجل", "noteAr": ""}, {"kw": "authority", "raw": "or, eminent place", "note": "or, eminent place", "refs": [], "kwAr": "وأصحاب السلطة", "noteAr": "أو: مقام رفيع."}, {"kw": "that", "raw": "Gen_49:14, Gen_49:15; 2Sa_20:19; Pro_24:21; Ecc_3:12, Ecc_3:13, Ecc_8:2-5; Rom_12:18; 1Th_4:11; Heb_12:14", "note": "", "refs": [{"l": "Gen 49:14", "n": "", "vs": [[14, "يساكر حمار قوي رابض بين الحظائر."]]}, {"l": "Gen 49:15", "n": "", "vs": [[15, "عندما يرى خصوبة مرتعه وبهجة أرضه، تستكين كتفاه للأثقال، ويستعبد للعمل الشاق."]]}, {"l": "2Sa 20:19", "n": "", "vs": [[19, "أنا واحدة من بين بقية المسالمين في إسرائيل، وأنت تبغي تدمير مدينة هي أم في إسرائيل، فلماذا تريد أن تبتلع ميراث الرب؟»"]]}, {"l": "Pro 24:21", "n": "", "vs": [[21, "ياابني اتق الرب والملك، ولا تعاشر المتقلبين،"]]}, {"l": "Ecc 3:12", "n": "", "vs": [[12, "فأيقنت أنه ليس أفضل لهم من أن يفرحوا ويمتعوا أنفسهم وهم مازالوا على قيد الحياة."]]}, {"l": "Ecc 3:13", "n": "", "vs": [[13, "إن من نعم الله على الإنسان أن يأكل ويشرب ويستمتع بما يجنيه من كده."]]}, {"l": "Ecc 8:2-5", "n": "", "vs": [[2, "أقول لك: أطع كلام الملك، ولاسيما من أجل يمين الله الذي أقسمت به."], [3, "لا تسرع في الاختفاء من حضرته، ولا تتشبث بقضية سيئة لأنه يصنع ما يشاء،"], [4, "إذ تنطوي كلمة الملك على سلطان. ومن يقدر أن يقول له: ماذا تفعل؟"], [5, "من يطع الأمر لا يلق أذى، وقلب الحكيم يدرك الوقت المناسب وأسلوب القضاء."]]}, {"l": "Rom 12:18", "n": "", "vs": [[18, "إن كان ممكنا، فمادام الأمر يتعلق بكم، عيشوا في سلام مع جميع الناس."]]}, {"l": "1Th 4:11", "n": "", "vs": [[11, "وأن تسعوا بجد إلى العيش بهدوء، مهتمين بممارسة شؤونكم الخاصة، ومحصلين معيشتكم بعمل أيديكم، كما أوصيناكم."]]}, {"l": "Heb 12:14", "n": "", "vs": [[14, "اجعلوا هدفكم أن تسالموا جميع الناس، وتعيشوا حياة مقدسة. فبغير قداسة، لا يقدر أحد أن يرى الرب."]]}], "kwAr": "لكي نعيش حياة مطمئنة", "noteAr": ""}, {"kw": "all godliness", "raw": "Luk_1:6, Luk_2:25; Act_10:22, Act_24:16; Phi_4:8; Tit_2:10-14; 1Pe_2:9-13; 2Pe_1:3-7", "note": "", "refs": [{"l": "Luk 1:6", "n": "", "vs": [[6, "وكان كلاهما بارين أمام الله، يسلكان وفقا لوصايا الرب وأحكامه كلها بغير لوم."]]}, {"l": "Luk 2:25", "n": "", "vs": [[25, "وكان في أورشليم رجل اسمه سمعان، وهو رجل بار تقي ينتظر العزاء لإسرائيل وكان الروح القدس عليه."]]}, {"l": "Act 10:22", "n": "", "vs": [[22, "فأجابوه: «قائد المئة كرنيليوس رجل صالح يتقي الله ، ويشهد له بذلك شعب اليهود جميعا. وقد أوحى الله إليه بواسطة ملاك طاهر أن يستدعيك إلى بيته ليسمع ما عندك من كلام»."]]}, {"l": "Act 24:16", "n": "", "vs": [[16, "لذلك أنا أيضا أدرب نفسي لكي أحيا دائما بضمير نقي أمام الله والناس."]]}, {"l": "Phi 4:8", "n": "", "vs": [[8, "وختاما، أيها الإخوة: كل ما كان حقا، وكل ما كان شريفا، وكل ما كان عادلا، وكل ما كان طاهرا وكل ما كان مستحبا، وكل ما كان حسن السمعة، وكل ما كان فيه فضيلة وخصلة حميدة، فاشغلوا أفكاركم به."]]}, {"l": "Tit 2:10-14", "n": "", "vs": [[10, "ولا سارقين، بل مظهرين أمانة كلية صالحة، لكي يزينوا في كل شيء تعليم مخلصنا الله."], [11, "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت."], [12, "وهي تعلمنا أن نقطع علاقتنا بالإباحية والشهوات العالمية، وأن نحيا في العصر الحاضر حياة التعقل والبر والتقوى،"], [13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"], [14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "1Pe 2:9-13", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"], [10, "فإنكم في الماضي لم تكونوا شعبا؛ أما الآن، فأنتم «شعب الله وقد كنتم سابقا لا تتمتعون برحمة الله، أما الآن، فإنكم تتمتعون بها!»"], [11, "أيها الأحباء، ما أنتم إلا غرباء تزورون الأرض زيارة عابرة. لذلك أطلب إليكم أن تبتعدوا عن الشهوات الجسدية التي تصارع النفس."], [12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالحة يمجدون الله في يوم الافتقاد."], [13, "فإكراما للرب، اخضعوا لكل نظام يدير شؤون الناس: للملك، باعتباره صاحب السلطة العليا،"]]}, {"l": "2Pe 1:3-7", "n": "", "vs": [[3, "إن الله، بقدرته الإلهية، قد زودنا بكل ما نحتاج إليه في الحيا ة الروحية المتصفة بالتقوى. ذلك أنه عرفنا بالمسيح الذي دعانا إلى مجده وفضيلته،"], [4, "اللذين بهما أعطانا الله بركاته العظمى الثمينة التي كان قد وعد بها. وبهذا صار بإمكانكم أن تتخلصوا من الفساد الذي تنشره الشهوة في العالم، وتشتركوا في الطبيعة الإلهية."], [5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"], [6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"], [7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."]]}], "kwAr": "كلية التقوى", "noteAr": ""}], "arS": [["ولأجل ", []], ["الملوك", ["G935"]], [" وأصحاب ", []], ["السلطة", ["G5247"]], ["، لكي ", []], ["نعيش", ["G1236"]], [" ", []], ["حياة", ["G979"]], [" ", []], ["مطمئنة", ["G2263"]], [" ", []], ["هادئة", ["G2272"]], [" كلية ", []], ["التقوى", ["G2150"]], [" ", []], ["والرصانة", ["G4587"]], [".", []]]}, {"c": 2, "v": 3, "text": "فإن هذا الأمر جيد ومقبول في نظر الله مخلصنا،", "groups": [{"kw": "this", "raw": "1Ti_5:4; Rom_12:1, Rom_12:2, Rom_14:18; Eph_5:9, Eph_5:10; Phi_1:11, Phi_4:18; Col_1:10; 1Th_4:1; Heb_13:16; 1Pe_2:5, 1Pe_2:20", "note": "", "refs": [{"l": "1Ti 5:4", "n": "", "vs": [[4, "فإن كان للأرملة أولاد أو حفدة، فمن أول واجبات هؤلاء أن يتعلموا توقير أهلهم وأن يفوا حق والديهم. فإن هذا العمل مقبول في نظر الله."]]}, {"l": "Rom 12:1", "n": "", "vs": [[1, "لذلك أتوسل إليكم أيها الإخوة، نظرا لمراحم الله، أن تقدموا له أجسادكم ذبيحة مقدسة مقبولة عنده، وهي عبادتكم بعقل."]]}, {"l": "Rom 12:2", "n": "", "vs": [[2, "ولا تتكيفوا مع هذا العالم، بل تغيروا بتجديد الذهن، لتميزوا ما هي إرادة الله الصالحة المقبولة الكاملة."]]}, {"l": "Rom 14:18", "n": "", "vs": [[18, "فمن خدم المسيح هكذا، كان مقبولا عند الله وممدوحا عند الناس."]]}, {"l": "Eph 5:9", "n": "", "vs": [[9, "فإن ثمر النور يكون في كل صلاح واستقامة وحق."]]}, {"l": "Eph 5:10", "n": "", "vs": [[10, "هكذا تختبرون الأمور التي ترضي الرب."]]}, {"l": "Phi 1:11", "n": "", "vs": [[11, "كاملين في ثمار البر الآتية بيسوع المسيح، لمجد الله وحمده."]]}, {"l": "Phi 4:18", "n": "", "vs": [[18, "فالآن عندي كل ما يسد حاجتي ويزيد عنها. أنا في بحبوحة إذ تسلمت من أبفروديتس ما بعثتم به إلي، عطرا طيب الرائحة، ذبيحة يقبلها الله ويسر بها."]]}, {"l": "Col 1:10", "n": "", "vs": [[10, "لكي تسلكوا سلوكا لائقا بالرب ومرضيا في كل شيء، منتجين الثمر في كل عمل صالح ونامين في معرفة الله إلى التمام،"]]}, {"l": "1Th 4:1", "n": "", "vs": [[1, "وبعد، أيها الإخوة، فمثلما تلقيتم منا كيف يجب أن تسلكوا سلوكا يرضي الله ، وكما أنتم فاعلون، نرجو منكم ونحرضكم في الرب يسوع أن تضاعفوا تقدمكم في ذلك أكثر فأكثر."]]}, {"l": "Heb 13:16", "n": "", "vs": [[16, "ولا تغفلوا أيضا عن عمل الخير وإعانة المحتاجين: لأن مثل هذه «الذبائح» تسر الله جدا!"]]}, {"l": "1Pe 2:5", "n": "", "vs": [[5, "إذن اتحدوا به كحجارة حية، مبنيين بيتا روحيا، تكونون فيه كهنة مقدسين تقدمون لله ذبائح روحية مقبولة لديه بفضل يسوع المسيح."]]}, {"l": "1Pe 2:20", "n": "", "vs": [[20, "فبالحقيقة، أي مجد لكم إن كنتم تصبرون وأنتم تتحملون قصاص أخطائكم؟ لا فضل لكم عند الله إلا إذا تحملتم الآلام صابرين، وأنتم تفعلون الصواب."]]}], "kwAr": "فإن هذا الأمر جيد", "noteAr": ""}, {"kw": "God", "raw": "1Ti_1:1; Isa_45:21; Luk_1:47; 2Ti_1:9", "note": "", "refs": [{"l": "1Ti 1:1", "n": "", "vs": [[1, "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"]]}, {"l": "Isa 45:21", "n": "", "vs": [[21, "أعلنوا، واعرضوا دعواكم. ليتشاوروا معا. من أنبأ بهذا منذ القدم، ومن أخبر به من زمن بعيد؟ ألست أنا الرب ولا إله غيري؟ بار ومخلص، وليس هناك آخر."]]}, {"l": "Luk 1:47", "n": "", "vs": [[47, "وتبتهج روحي بالله مخلصي."]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،"]]}], "kwAr": "الله مخلصنا", "noteAr": ""}], "arS": [["فإن هذا الأمر ", []], ["جيد", ["G2570"]], [" ", []], ["ومقبول", ["G587"]], [" في ", []], ["نظر", ["G1799"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["مخلصنا", ["G4990", "G2257"]], ["،", []]]}, {"c": 2, "v": 4, "text": "فهو يريد لجميع الناس أن يخلصوا، ويقبلوا إلى معرفة الحق بالتمام:", "groups": [{"kw": "will", "raw": "Isa_45:22, Isa_49:6, Isa_55:1; Eze_18:23, Eze_18:32, Eze_33:11; Luk_14:23; Joh_3:15-17; Joh_6:37; Rom_3:29, Rom_3:30; 2Co_5:17-19; 1Th_2:15, 1Th_2:16; Tit_2:11; 2Pe_3:9", "note": "", "refs": [{"l": "Isa 45:22", "n": "", "vs": [[22, "التفتوا إلي واخلصوا ياجميع أقاصي الأرض، لأني أنا الله وليس هناك آخر."]]}, {"l": "Isa 49:6", "n": "", "vs": [[6, "لكم هو يسير أن تكون لي عبدا لتستنهض أسباط يعقوب، وترد من نجيت من إسرائيل، لذلك سأجعلك نورا للأمم لتكون خلاصي إلى أقصى الأرض."]]}, {"l": "Isa 55:1", "n": "", "vs": [[1, "تعالوا أيها العطاش جميعا إلى المياه، وهلموا أيها المعدمون من الفضة، ابتاعوا وكلوا، ابتاعوا خمرا ولبنا مجانا من غير فضة."]]}, {"l": "Eze 18:23", "n": "", "vs": [[23, "أحقا أسر بموت الشرير يقول السيد الرب؟ أليس برجوعه عن طرقه الآثمة فيحيا؟"]]}, {"l": "Eze 18:32", "n": "", "vs": [[32, "إذ لا أسر بموت أحد، يقول السيد الرب، فتوبوا واحيوا."]]}, {"l": "Eze 33:11", "n": "", "vs": [[11, "قل لهم: حي أنا يقول السيد الرب، إني لا أبتهج بموت الشرير بل بأن يرتدع عن غيه ويحيا. ارجعوا، ارجعوا عن طرقكم الرديئة! لماذا تموتون ياشعب إسرائيل؟"]]}, {"l": "Luk 14:23", "n": "", "vs": [[23, "فقال السيد للعبد: اخرج إلى الطرق والسياجات وأجبر الناس على الدخول حتى يمتليء بيتي،"]]}, {"l": "Joh 3:15-17", "n": "", "vs": [[15, "لتكون الحياة الأبدية لكل من يؤمن به."], [16, "لأنه هكذا أحب الله العالم حتى بذل ابنه الوحيد، لكي لا يهلك كل من يؤمن به، بل تكون له الحياة الأبدية."], [17, "فإن الله لم يرسل ابنه إلى العالم ليدين العالم، بل ليخلص العالم به،"]]}, {"l": "Joh 6:37", "n": "", "vs": [[37, "ولكن كل ما يهبه الآب لي سيأتي إلي، ومن يأت إلي لا أطرحه إلى الخارج أبدا،"]]}, {"l": "Rom 3:29", "n": "", "vs": [[29, "أو يكون الله إله اليهود وحدهم؟ أما هو إله الأمم أيضا؟ بلى، إنه إله الأمم أيضا،"]]}, {"l": "Rom 3:30", "n": "", "vs": [[30, "مادام الله الواحد هو الذي سيبرر أهل الختان على أساس الإيمان، وأهل عدم الختان على أساس الإيمان."]]}, {"l": "2Co 5:17-19", "n": "", "vs": [[17, "فإنه إذا كان أحد في المسيح، فهو خليقة جديدة: إن الأشياء القديمة قد زالت، وها كل شيء قد صار جديدا."], [18, "وكل شيء هو من عند الله الذي صالحنا مع نفسه بالمسيح، ثم سلمنا خدمة هذه المصالحة."], [19, "ذلك أن الله كان في المسيح مصالحا العالم مع نفسه، غير حاسب عليهم خطاياهم، وقد وضع بين أيدينا رسالة هذه المصالحة."]]}, {"l": "1Th 2:15", "n": "", "vs": [[15, "الذين قتلوا الرب يسوع والأنبياء واضطهدونا نحن أيضا، وهم لا يرضون الله ويعادون الناس جميعا،"]]}, {"l": "1Th 2:16", "n": "", "vs": [[16, "إذ يمنعوننا من تبشير الأمم ليخلصوا، وبذلك يستكملون خطاياهم كل حين، ولكن الغضب قد حل عليهم إلى الغاية."]]}, {"l": "Tit 2:11", "n": "", "vs": [[11, "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت."]]}, {"l": "2Pe 3:9", "n": "", "vs": [[9, "فالرب، إذن، لا يبطيء في إتمام وعده، كما يظن بعض الناس، ولكنه يتأنى عليكم، فهو لا يريد لأحد من الناس أن يهلك، بل يريد لجميع الناس أن يرجعوا إليه تائبين."]]}], "kwAr": "يريد لجميع الناس أن يخلصوا", "noteAr": ""}, {"kw": "and", "raw": "Mat_28:19; Mar_16:15; Luk_24:47; Rom_10:12-15; Rev_14:6", "note": "", "refs": [{"l": "Mat 28:19", "n": "", "vs": [[19, "فاذهبوا إذن، وتلمذوا جميع الأمم، وعمدوهم باسم الآب والابن والروح القدس؛"]]}, {"l": "Mar 16:15", "n": "", "vs": [[15, "وقال لهم: «اذهبوا إلى العالم أجمع، وبشروا الخليقة كلها بالإنجيل:"]]}, {"l": "Luk 24:47", "n": "", "vs": [[47, "وأن يبشر باسمه بالتوبة وغفران الخطايا في جميع الأمم انطلاقا من أورشليم."]]}, {"l": "Rom 10:12-15", "n": "", "vs": [[12, "فلا فرق بين اليهودي واليوناني، لأن للجميع ربا واحدا، غنيا تجاه كل من يدعوه»."], [13, "«فإن كل من يدعو باسم الرب يخلص»."], [14, "ولكن، كيف يدعون من لم يؤمنوا به؟ وكيف يؤمنون بمن لم يسمعوا به؟ وكيف يسمعون بلا مبشر؟"], [15, "وكيف يبشر أحد إلا إذا كان قد أرسل؟ كما قد كتب: «ما أجمل أقدام المبشرين بالخيرات!»"]]}, {"l": "Rev 14:6", "n": "", "vs": [[6, "ثم رأيت ملاكا آخر يطير في وسط السماء، معه بشارة أبدية يبشر بها أهل الأرض وكل أمة وقبيلة ولغة وشعب،"]]}], "kwAr": "ويقبلوا", "noteAr": ""}, {"kw": "the knowledge", "raw": "Isa_53:11; Hab_2:14; Luk_1:77; Joh_14:6, Joh_17:17; 2Ti_2:25, 2Ti_3:7; Heb_10:26", "note": "", "refs": [{"l": "Isa 53:11", "n": "", "vs": [[11, "ويرى ثمار تعب نفسه ويشبع، وعبدي البار يبرر بمعرفته كثيرين ويحمل آثامهم."]]}, {"l": "Hab 2:14", "n": "", "vs": [[14, "لأن الأرض ستمتليء من معرفة مجد الرب كما تغمر المياه البحر."]]}, {"l": "Luk 1:77", "n": "", "vs": [[77, "لتعطي شعبه المعرفة بأن الخلاص هو بمغفرة خطاياهم"]]}, {"l": "Joh 14:6", "n": "", "vs": [[6, "فأجابه يسوع: «أنا هو الطريق والحق والحياة. لا يأتي أحد إلى الآب إلا بي."]]}, {"l": "Joh 17:17", "n": "", "vs": [[17, "قدسهم بالحق؛ إن كلمتك هي الحق."]]}, {"l": "2Ti 2:25", "n": "", "vs": [[25, "ويؤدب بالوداعة مقاومي الإيمان، عسى أن يمنحهم الله التوبة، فيعرفوا الحق بالتمام،"]]}, {"l": "2Ti 3:7", "n": "", "vs": [[7, "يصغين للتعليم دائما، ولا يستطعن أبدا أن يبلغن معرفة الحق بالتمام!"]]}, {"l": "Heb 10:26", "n": "", "vs": [[26, "فإن أخطأنا عمدا برفضنا للمسيح بعد حصولنا على معرفة الحق، لا تبقى هناك ذبيحة لغفران الخطايا،"]]}], "kwAr": "معرفة الحق", "noteAr": ""}], "arS": [["فهو ", []], ["يريد", ["G2309"]], [" ", []], ["لجميع", ["G3956"]], [" ", []], ["الناس", ["G444"]], [" أن ", []], ["يخلصوا", ["G4982"]], ["، ", []], ["ويقبلوا", ["G2064"]], [" إلى ", []], ["معرفة", ["G1922"]], [" ", []], ["الحق", ["G225"]], [" بالتمام:", []]]}, {"c": 2, "v": 5, "text": "فإن الله واحد، والوسيط بين الله والناس واحد، وهو الإنسان المسيح يسوع،", "groups": [{"kw": "one God", "raw": "Deu_6:4; Isa_44:6; Mar_12:29-33; Joh_17:3; Rom_3:29, Rom_3:30, Rom_10:12; 1Co_8:6; Gal_3:20; Eph_4:6", "note": "", "refs": [{"l": "Deu 6:4", "n": "", "vs": [[4, "اسمعوا يابني إسرائيل: الرب إلهنا رب واحد،"]]}, {"l": "Isa 44:6", "n": "", "vs": [[6, "هذا ما يقوله الرب القدير ملك إسرائيل وفاديه: «أنا هو الأول والآخر، ولا إله غيري."]]}, {"l": "Mar 12:29-33", "n": "", "vs": [[29, "فأجابه يسوع: «أولى الوصايا جميعا هي: اسمع ياإسرائيل، الرب إلهنا رب واحد"], [30, "فأحب الرب إلهك بكل قلبك وبكل نفسك وبكل فكرك وبكل قوتك. هذه هي الوصية الأولى."], [31, "وهناك ثانية مثلها، وهي أن تحب قريبك كنفسك. فما من وصية أخرى أعظم من هاتين»."], [32, "فقال له الكاتب: «صحيح، يامعلم! حسب الحق تكلمت. فإن الله واحد وليس آخر سواه."], [33, "ومحبته بكل القلب وبكل الفهم وبكل القوة، ومحبة القريب كالنفس، أفضل من جميع المحرقات والذبائح!»"]]}, {"l": "Joh 17:3", "n": "", "vs": [[3, "والحياة الأبدية هي أن يعرفوك أنت الإله الحق وحدك، والذي أرسلته: يسوع المسيح."]]}, {"l": "Rom 3:29", "n": "", "vs": [[29, "أو يكون الله إله اليهود وحدهم؟ أما هو إله الأمم أيضا؟ بلى، إنه إله الأمم أيضا،"]]}, {"l": "Rom 3:30", "n": "", "vs": [[30, "مادام الله الواحد هو الذي سيبرر أهل الختان على أساس الإيمان، وأهل عدم الختان على أساس الإيمان."]]}, {"l": "Rom 10:12", "n": "", "vs": [[12, "فلا فرق بين اليهودي واليوناني، لأن للجميع ربا واحدا، غنيا تجاه كل من يدعوه»."]]}, {"l": "1Co 8:6", "n": "", "vs": [[6, "فليس عندنا نحن إلا إله واحد هو الآب الذي منه كل شيء، ونحن له؛ ورب واحد هو يسوع المسيح الذي به كل شيء ونحن به."]]}, {"l": "Gal 3:20", "n": "", "vs": [[20, "ولكن، عندما يصدر الوعد من جانب واحد، فلا لزوم لوسيط. والواعد هنا هو الله وحده."]]}, {"l": "Eph 4:6", "n": "", "vs": [[6, "وإله وآب واحد للجميع، وهو فوق الجميع وبالجميع وفي الجميع."]]}], "kwAr": "فإن الله واحد", "noteAr": ""}, {"kw": "and", "raw": "Job_9:33; Heb_7:25, Heb_8:6, Heb_9:15, Heb_12:24", "note": "", "refs": [{"l": "Job 9:33", "n": "", "vs": [[33, "وليس من حكم بيننا يضع يده على كلينا."]]}, {"l": "Heb 7:25", "n": "", "vs": [[25, "وهو لذلك قادر دائما أن يحقق الخلاص الكامل للذين يتقربون به إلى الله. فهو، في حضرة الله، حي على الدوام ليتضرع من أجلهم ويحامي عنهم!"]]}, {"l": "Heb 8:6", "n": "", "vs": [[6, "فرئيس كهنتنا، إذن، قد حصل على خدمة أفضل من خدمة الكهنوت الأرضي، لكونه الوسيط الذي أعلن لنا قيام عهد جديد أفضل من العهد السابق، ولكون هذا العهد الجديد ينطوي على وعود أفضل."]]}, {"l": "Heb 9:15", "n": "", "vs": [[15, "ولذلك، فالمسيح هو الوسيط لهذا العهد الجديد. فبما أنه قد تم الموت فداء للمخالفات الحاصلة تحت العهد الأول، ينال المدعوون الوعد بالإرث الأبدي."]]}, {"l": "Heb 12:24", "n": "", "vs": [[24, "كذلك، تقدمتم إلى يسوع، وسيط العهد الجديد، وإلى دمه المرشوش الذي يتكلم مطالبا بأفضل مما طالب به دم هابيل."]]}], "kwAr": "والوسيط", "noteAr": ""}, {"kw": "the man", "raw": "Mat_1:23; Luk_2:10,Luk_2:11; Joh_1:14; 1Co_15:45-47; Phi_2:6-8; Heb_2:6-13; Rev_1:13", "note": "", "refs": [{"l": "Mat 1:23", "n": "", "vs": [[23, "«ها إن العذراء تحبل، وتلد ابنا، ويدعى عمانوئيل!» أي «الله معنا»."]]}, {"l": "Luk 2:10", "n": "", "vs": [[10, "فقال لهم الملاك: «لا تخافوا! فها أنا أبشركم بفرح عظيم يعم الشعب كله:"]]}, {"l": "Luk 2:11", "n": "", "vs": [[11, "فقد ولد لكم اليوم في مدينة داود مخلص هو المسيح الرب."]]}, {"l": "Joh 1:14", "n": "", "vs": [[14, "والكلمة صار بشرا، وخيم بيننا، ونحن رأينا مجده، مجد ابن وحيد عند الآب، وهو ممتلىء بالنعمة والحق."]]}, {"l": "1Co 15:45-47", "n": "", "vs": [[45, "فهكذا أيضا قد كتب: «صار الإنسان الأول، آدم، نفسا حية» وأما آدم الأخير فهو روح باعث للحياة."], [46, "على أن الروحي لم يكن أولا، بل جاء المادي أولا ثم الروحي:"], [47, "الإنسان الأول من الأرض وقد صنع من التراب؛ أما الإنسان الثاني فهو من السماء."]]}, {"l": "Phi 2:6-8", "n": "", "vs": [[6, "إذ إنه، وهو الكائن في هيئة الله، لم يعتبر مساواته لله خلسة، أو غنيمة يتمسك بها؛"], [7, "بل أخلى نفسه، متخذا صورة عبد، صائرا شبيها بالبشر؛"], [8, "وإذ ظهر بهيئة إنسان، أمعن في الاتضاع، وكان طائعا حتى الموت، موت الصليب."]]}, {"l": "Heb 2:6-13", "n": "", "vs": [[6, "فقد شهد أحدهم في موضع من الكتاب، قائلا:"], [7, "جعلته أدنى من الملائكة إلى حين، ثم كللته بالمجد والكرامة، وأعطيته السلطة على كل ما صنعته يداك."], [8, "أخضعت كل شيء تحت قدميه!» فمادام الله قد أخضع للابن كل شيء، فإنه لم يترك شيئا غير خاضع له. ولكننا الآن لا نرى كل شيء تحت سلطته: (لأن ذلك سيحدث فيما بعد)."], [9, "إلا أننا نرى يسوع الآن مكللا بالمجد والكرامة، لأنه قاسى الموت. وذلك بعدما صار أدنى من الملائكة إلى حين، ليذوق بنعمة الله الموت عوضا عن كل واحد."], [10, "فلما قصد الله ، الذي من أجله كل شيء وبه كل شيء، أن يحضر إلى المجد أبناء كثيرين، كان من اللائق أن يجعل قائدهم إلى الخلاص مؤهلا لإكمال مهمته عن طريق الآلام."], [11, "فإن للمسيح الذي يقدس المؤمنين به، وللمقدسين أنفسهم، أبا واحدا. لهذا، لا يستحي المسيح أن يدعو المؤمنين به إخوة له."], [12, "إذ يقول الكتاب بلسانه: «أعلن اسمك لإخوتي. وأسبحك في وسط الجماعة!»"], [13, "ويقول أيضا: «وأنا أكون متوكلا عليه!» وأيضا: «ها أنا مع الأولاد الذين وهبهم الله لي!»"]]}, {"l": "Rev 1:13", "n": "", "vs": [[13, "وعندما التفت نحو الصوت، رأيت كائنا يشبه ابن الإنسان، يقف وسط سبع منائر من ذهب، ويرتدي ثوبا طويلا إلى الرجلين، يلف صدره حزام من ذهب."]]}], "kwAr": "الإنسان المسيح يسوع", "noteAr": ""}], "arS": [["فإن ", []], ["الله", ["G2316"]], [" ", []], ["واحد", ["G1520"]], ["، ", []], ["والوسيط", ["G3316"]], [" بين ", []], ["الله", ["G2316"]], [" ", []], ["والناس", ["G444"]], [" ", []], ["واحد", ["G1520"]], ["، وهو ", []], ["الإنسان", ["G444"]], [" ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], ["،", []]]}, {"c": 2, "v": 6, "text": "الذي بذل نفسه فدية عوضا عن الجميع. هذه شهادة تؤدى في أوقاتها الخاصة،", "groups": [{"kw": "gave", "raw": "Job_33:24; Isa_53:6; Mat_20:28; Mar_10:45; Joh_6:51, Joh_10:15; 2Co_5:14, 2Co_5:15, 2Co_5:21; Eph_1:7, Eph_1:17, Eph_5:2; Tit_2:14; Heb_9:12; 1Pe_1:18, 1Pe_1:19; 1Pe_2:24, 1Pe_3:18; 1Jo_2:1, 1Jo_2:2, 1Jo_4:10; Rev_1:5, Rev_5:9", "note": "", "refs": [{"l": "Job 33:24", "n": "", "vs": [[24, "يترَأف عليه قائلا: أنقذه يارب من الانحدار إلى الهاوية، فقد وجدت له فدية."]]}, {"l": "Isa 53:6", "n": "", "vs": [[6, "كلنا كغنم شردنا ملنا كل واحد إلى سبيله، فأثقل الرب كاهله بإثم جميعنا."]]}, {"l": "Mat 20:28", "n": "", "vs": [[28, "فهكذا ابن الإنسان: قد جاء لا ليخدم، بل ليخدم ويبذل نفسه فدية عن كثيرين. »"]]}, {"l": "Mar 10:45", "n": "", "vs": [[45, "فحتى ابن الإنسان قد جاء لا ليخدم، بل ليخدم ويبذل نفسه فدية عن كثيرين»."]]}, {"l": "Joh 6:51", "n": "", "vs": [[51, "أنا الخبز الحي الذي نزل من السماء. إن أكل أحد من هذا الخبز يحيا إلى الأبد. والخبز الذي أقدمه أنا، هو جسدي، أبذله من أجل أن يحيا العالم»."]]}, {"l": "Joh 10:15", "n": "", "vs": [[15, "مثلما يعرفني الآب وأنا أعرفه. وأنا أبذل حياتي فدى خرافي."]]}, {"l": "2Co 5:14", "n": "", "vs": [[14, "فإن محبة المسيح تسيطر علينا، وقد حكمنا بهذا: مادام واحد قد مات عوضا عن الجميع، فمعنى ذلك أن الجميع ماتوا؛"]]}, {"l": "2Co 5:15", "n": "", "vs": [[15, "وهو قد مات عوضا عن الجميع حتى لا يعيش الأحياء في ما بعد لأنفسهم بل للذي مات عوضا عنهم ثم قام."]]}, {"l": "2Co 5:21", "n": "", "vs": [[21, "فإن الذي لم يعرف خطيئة، جعله الله خطيئة لأجلنا، لنصير نحن بر الله فيه."]]}, {"l": "Eph 1:7", "n": "", "vs": [[7, "ففيه لنا بدمه الفداء، أي غفران الخطايا؛ بحسب غنى نعمته"]]}, {"l": "Eph 1:17", "n": "", "vs": [[17, "حتى يهبكم إله ربنا يسوع المسيح، أبو المجد، روح حكمة وإلهام: لتعرفوه معرفة كاملة"]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Heb 9:12", "n": "", "vs": [[12, "فإلى «قدس الأقداس» في هذه الخيمة، دخل المسيح مرة واحدة، حاملا دم نفسه، لا دم تيوس وعجول. وذلك بعدما سفك دمه عوضا عنا. فحقق فداء أبديا."]]}, {"l": "1Pe 1:18", "n": "", "vs": [[18, "واعلموا أنه قد دفع الفدية ليحرركم من سيرة حياتكم الباطلة التي أخذتموها بالتقليد عن آبائكم. وهذه الفدية لم تكن شيئا فانيا كالفضة أو الذهب،"]]}, {"l": "1Pe 1:19", "n": "", "vs": [[19, "بل كانت دما ثمينا، دم المسيح، ذلك الحمل الطاهر الذي ليس فيه عيب ولا دنس!"]]}, {"l": "1Pe 2:24", "n": "", "vs": [[24, "وهو نفسه حمل خطايانا في جسده (عندما مات مصلوبا) على الخشبة، لكي نموت بالنسبة للخطايا فنحيا حياة البر. وبجراحه هو تم لكم الشفاء،"]]}, {"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}, {"l": "1Jo 2:1", "n": "", "vs": [[1, "ياأولادي الصغار، أكتب إليكم هذه الأمور لكي لا تخطئوا. ولكن، إن أخطأ أحدكم، فلنا عند الآب شفيع هو يسوع المسيح البار."]]}, {"l": "1Jo 2:2", "n": "", "vs": [[2, "فهو كفارة لخطايانا، لا لخطايانا فقط، بل لخطايا العالم كله."]]}, {"l": "1Jo 4:10", "n": "", "vs": [[10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."]]}, {"l": "Rev 1:5", "n": "", "vs": [[5, "ومن يسوع المسيح الشاهد الأمين، بكر القائمين من بين الأموات، ملك ملوك الأرض، ذاك الذي بدافع محبته لنا مات لأجلنا فغسلنا بدمه من خطايانا،"]]}, {"l": "Rev 5:9", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"]]}], "kwAr": "الذي بذل نفسه فدية", "noteAr": ""}, {"kw": "to be testified", "raw": "or, a testimony, 1Co_1:6; 2Th_1:10; 2Ti_1:8; 1Jo_5:11, 1Jo_5:12", "note": "or, a testimony, 1Co_1:6; 2Th_1:10; 2Ti_1:8; 1Jo_5:11, 1Jo_5:12", "refs": [{"l": "1Co 1:6", "n": "", "vs": [[6, "بمقدار ما ترسخت فيكم شهادة المسيح."]]}, {"l": "2Th 1:10", "n": "", "vs": [[10, "عندما يعود في ذلك اليوم ليتمجد في قديسيه ويكون موضع العجب عند جميع الذين آمنوا، وأنتم قد آمنتم بشهادتنا لكم!"]]}, {"l": "2Ti 1:8", "n": "", "vs": [[8, "فلا تخجل إذن بالشهادة لربنا، ولا تخجل بي أنا السجين لأجله، بل شاركني في المشقات لأجل الإنجيل، متوكلا على قدرة الله."]]}, {"l": "1Jo 5:11", "n": "", "vs": [[11, "وهذه الشهادة هي أن الله أعطانا حياة أبدية، وأن هذه الحياة هي في ابنه."]]}, {"l": "1Jo 5:12", "n": "", "vs": [[12, "فمن كان له ابن الله كانت له الحياة. ومن لم يكن له ابن الله، لم تكن له الحياة!"]]}], "kwAr": "هذه شهادة", "noteAr": "أو: شهادة."}, {"kw": "in", "raw": "1Ti_6:15; Rom_5:6, Rom_16:26; Gal_4:4; Eph_1:9, Eph_1:10, Eph_3:5; Tit_1:3", "note": "", "refs": [{"l": "1Ti 6:15", "n": "", "vs": [[15, "هذا الظهور سوف يتممه الله في وقته الخاص، هو السيد المبارك الأوحد، ملك الملوك ورب الأرباب،"]]}, {"l": "Rom 5:6", "n": "", "vs": [[6, "فإنه ونحن بعد عاجزون، مات المسيح عن العصاة في الوقت المعين."]]}, {"l": "Rom 16:26", "n": "", "vs": [[26, "ولكن أذيع الآن، بأمر الله الأزلي في الكتابات النبوية، على جميع الأمم لأجل إطاعة الإيمان؛"]]}, {"l": "Gal 4:4", "n": "", "vs": [[4, "ولكن لما جاء تمام الزمان، أرسل الله ابنه، وقد ولد من امرأة وكان خاضعا للشريعة،"]]}, {"l": "Eph 1:9", "n": "", "vs": [[9, "إذ كشف لنا سر مشيئته بحسب مرضاته التي قصدها في نفسه،"]]}, {"l": "Eph 1:10", "n": "", "vs": [[10, "لأجل تدبير تمام الأزمنة، حين يوحد كل شيء تحت رئاسة المسيح، سواء الأشياء التي في السماوات والتي على الأرض."]]}, {"l": "Eph 3:5", "n": "", "vs": [[5, "ذلك السر الذي لم يطلع عليه بنو البشر في الأجيال الماضية مثلما أعلن الآن بوحي الروح لرسله القديسين وأنبيائه:"]]}, {"l": "Tit 1:3", "n": "", "vs": [[3, "ثم بين كلمته في أوانها المعين: بالبشارة التي وضعت أمانة بين يدي بموجب أمر مخلصنا الله …"]]}], "kwAr": "في أوقاتها الخاصة", "noteAr": ""}], "arS": [["الذي ", []], ["بذل", ["G1325"]], [" ", []], ["نفسه", ["G1438"]], [" ", []], ["فدية", ["G487"]], [" ", []], ["عوضا عن", ["G5228"]], [" ", []], ["الجميع", ["G3956"]], [". هذه ", []], ["شهادة", ["G3142"]], [" تؤدى في ", []], ["أوقاتها", ["G2540"]], [" ", []], ["الخاصة", ["G2398"]], ["،", []]]}, {"c": 2, "v": 7, "text": "ولها قد عينت أنا مبشرا ورسولا، الحق أقول ولست أكذب، معلما للأمم في الإيمان والحق.", "groups": [{"kw": "I am", "raw": "1Ti_1:11, 1Ti_1:12", "note": "", "refs": [{"l": "1Ti 1:11", "n": "", "vs": [[11, "الموافق لإنجيل مجد الله المبارك، ذلك الإنجيل الذي وضع أمانة بين يدي."]]}, {"l": "1Ti 1:12", "n": "", "vs": [[12, "وكم أشكر المسيح يسوع ربنا الذي أعطاني القدرة وعينني خادما له، إذ اعتبرني جديرا بثقته،"]]}], "kwAr": "قد عينت أنا", "noteAr": ""}, {"kw": "a preacher", "raw": "Ecc_1:1, Ecc_1:2, Ecc_1:12, Ecc_7:27, Ecc_12:8-10; Rom_10:14; Eph_3:7, Eph_3:8; 2Ti_1:11; 2Pe_2:5", "note": "", "refs": [{"l": "Ecc 1:1", "n": "", "vs": [[1, "هذه أقوال الجامعة ابن داود ملك أورشليم."]]}, {"l": "Ecc 1:2", "n": "", "vs": [[2, "يقول الجامعة: باطل الأباطيل، باطل الأباطيل، كل شيء باطل."]]}, {"l": "Ecc 1:12", "n": "", "vs": [[12, "أنا الجامعة، كنت ملكا على إسرائيل في أورشليم."]]}, {"l": "Ecc 7:27", "n": "", "vs": [[27, "ويقول الجامعة: إليك ما وجدته: أضف واحدا إلى واحد لتكتشف حاصل الأشياء"]]}, {"l": "Ecc 12:8-10", "n": "", "vs": [[8, "يقول الجامعة: باطل الأباطيل وكل شيء باطل."], [9, "وفضلا عن كون الجامعة حكيما، فإنه علم الناس المعرفة أيضا، وقوم وبحث ونظم أمثالا كثيرة."], [10, "إذ سعى الجامعة لانتقاء ألفاظ مبهجة، وكتب باستقامة كلمات الحق."]]}, {"l": "Rom 10:14", "n": "", "vs": [[14, "ولكن، كيف يدعون من لم يؤمنوا به؟ وكيف يؤمنون بمن لم يسمعوا به؟ وكيف يسمعون بلا مبشر؟"]]}, {"l": "Eph 3:7", "n": "", "vs": [[7, "الذي صرت أنا خادما له بحسب نعمة الله الموهوبة لي وفقا لعمل قدرته."]]}, {"l": "Eph 3:8", "n": "", "vs": [[8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "2Ti 1:11", "n": "", "vs": [[11, "الذي له عينت أنا مبشرا ورسولا ومعلما."]]}, {"l": "2Pe 2:5", "n": "", "vs": [[5, "كذلك لم يشفق على العالم القديم عندما أحدث الطوفان على عالم الفاجرين، إلا أنه حفظ نوحا المنادي ببر الله وعدله. وكان نوح واحدا من ثمانية أشخاص نجوا من الطوفان."]]}], "kwAr": "مبشرا ورسولا", "noteAr": ""}, {"kw": "I speak", "raw": "Rom_1:9, Rom_9:1; 2Co_11:31; Gal_1:20", "note": "", "refs": [{"l": "Rom 1:9", "n": "", "vs": [[9, "فإن الله الذي أخدمه بروحي في التبشير بإنجيل ابنه، هو شاهد لي كيف لا أتوقف عن ذكركم"]]}, {"l": "Rom 9:1", "n": "", "vs": [[1, "أقول الحق في المسيح، لست أكذب، وضميري شاهد لي في الروح القدس،"]]}, {"l": "2Co 11:31", "n": "", "v
