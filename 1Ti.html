واسع وراء البر والإيمان والمحبة والسلام، مشاركا الذين يدعون الرب من قلب نقي."]]}, {"l": "Jam 3:13", "n": "", "vs": [[13, "أبينكم بعض الحكماء والفهماء؟ إذن، على هؤلاء أن يسلكوا سلوكا حسنا، مظهرين بأعمالهم تلك الوداعة التي تتصف بها الحكمة (الحقيقية)."]]}, {"l": "Jam 3:17", "n": "", "vs": [[17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}, {"l": "2Pe 1:5-8", "n": "", "vs": [[5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"], [6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"], [7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."], [8, "فحين تكون هذه الصفات الطيبة في داخلكم، وتزداد بوفرة، تجعلكم مجتهدين ومثمرين في معرفتكم لربنا يسوع المسيح."]]}], "kwAr": "في الكلام والسلوك", "noteAr": ""}], "arS": [["لا ", []], ["يستخف", ["G2706"]], [" أحد ", []], ["بحداثة سنك", ["G3503", "G4675"]], [". وإنما كن ", []], ["قدوة", ["G5179"]], [" ", []], ["للمؤمنين", ["G4103"]], ["، في ", []], ["الكلام", ["G3056"]], [" ", []], ["والسلوك", ["G391"]], [" ", []], ["والمحبة", ["G26"]], [" ", []], ["والإيمان", ["G4102"]], [" ", []], ["والطهارة", ["G47"]], [".", []]]}, {"c": 4, "v": 13, "text": "إلى حين وصولي، انصرف إلى تلاوة الكتاب، وإلى الوعظ، وإلى التعليم.", "groups": [{"kw": "I come", "raw": "1Ti_3:14, 1Ti_3:15", "note": "", "refs": [{"l": "1Ti 3:14", "n": "", "vs": [[14, "هذه التوصيات أكتبها إليك، وأنا أرجو أن آتي إليك بأكثر سرعة،"]]}, {"l": "1Ti 3:15", "n": "", "vs": [[15, "حتى إذا تأخرت تعلم كيف يجب التصرف في بيت الله، أي كنيسة الله الحي، ركن الحق ودعامته."]]}], "kwAr": "إلى حين وصولي", "noteAr": ""}, {"kw": "to reading", "raw": "Deu_17:19; Jos_1:8; Psa_1:2, Psa_1:3, Psa_119:97-104; Pro_2:4, Pro_2:5; Mat_13:51, Mat_13:52; Joh_5:39; Act_6:4, Act_17:11; 2Ti_2:15-17", "note": "", "refs": [{"l": "Deu 17:19", "n": "", "vs": [[19, "فتكون معه ليطالعها كل أيام حياته ليتعلم أن يتقي الرب إلهه ويطيع جميع كلمات هذه الشريعة وهذه الفرائض ليعمل بها،"]]}, {"l": "Jos 1:8", "n": "", "vs": [[8, "واظب على ترديد كلمات هذه الشريعة، وتأمل فيها ليل نهار لتمارسها بحرص بموجب ما ورد فيها فيحالفك النجاح والتوفيق."]]}, {"l": "Psa 1:2", "n": "", "vs": [[2, "بل في شريعة الرب بهجته، يتأمل فيها نهارا وليلاَ."]]}, {"l": "Psa 1:3", "n": "", "vs": [[3, "فيكون كشجرة مغروسة عند مجاري المياه، تعطي ثمرها في حينه، وورقها لا يذبل، وكل ما يصنعه يفلح."]]}, {"l": "Psa 119:97-104", "n": "", "vs": [[97, "كم أحببت شريعتك، إنها موضوع تأملي طول النهار."], [98, "وصيتك جعلتني أحكم من أعدائي، لأنها نصيبي إلى الأبد."], [99, "صرت أكثر فهما من معلمي، لأن شهاداتك هي موضوع تأملي."], [100, "صرت أكثر فطنة من الشيوخ، لأني راعيت وصاياك."], [101, "منعت قدمي عن سلوك كل طريق شر، لكي أحفظ كلامك."], [102, "لم أبتعد عن أحكامك لأنك هكذا علمتني."], [103, "ما أحلى أقوالك لمذاقي. إنها أحلى من العسل في فمي."], [104, "من وصاياك اكتسبت فطنة لذلك أبغضت كل طريق باطل."]]}, {"l": "Pro 2:4", "n": "", "vs": [[4, "إن التمسته كما تلتمس الفضة، وبحثت عنه كما يبحث عن الكنوز الدفينة،"]]}, {"l": "Pro 2:5", "n": "", "vs": [[5, "عندئذ تدرك مخافة الرب وتعثر على معرفة الله،"]]}, {"l": "Mat 13:51", "n": "", "vs": [[51, "أفهمتم هذه الأمور كلها؟» أجابوه: «نعم!»"]]}, {"l": "Mat 13:52", "n": "", "vs": [[52, "فقال: «ولهذا السبب، فأي واحد من الكتبة يصير تلميذا لملكوت السماوات، يشبه بإنسان رب بيت يطلع من كنزه ما هو جديد وما هو عتيق! »"]]}, {"l": "Joh 5:39", "n": "", "vs": [[39, "أنتم تدرسون الكتب لأنكم تعتقدون أنها ستهديكم إلى الحياة الأبدية. هذه الكتب تشهد لي،"]]}, {"l": "Act 6:4", "n": "", "vs": [[4, "أما نحن، فنداوم على الصلاة وخدمة الكلمة»."]]}, {"l": "Act 17:11", "n": "", "vs": [[11, "وكان يهود بيرية أشرف من يهود تسالونيكي، فقبلوا كلمة الله برغبة شديدة، وأخذوا يدرسون الكتاب يوميا ليتأكدوا من صحة التعليم."]]}, {"l": "2Ti 2:15-17", "n": "", "vs": [[15, "اجتهد أن تقدم نفسك لله فائزا في الامتحان، عاملا ليس عليه ما يدعو للخجل، مفصلا كلمة الحق باستقامة."], [16, "أما الأحاديث الباطلة الدنسة، فتجنبها؛ فإن المنصرفين إليها يتقدمون إلى فجور أفظع،"], [17, "وكلامهم ينهش كالآكلة، ومنهم هيمنايوس وفيليتوس،"]]}], "kwAr": "تلاوة الكتاب", "noteAr": ""}, {"kw": "to exhortation", "raw": "Rom_12:8; 1Co_14:3; Tit_2:15", "note": "", "refs": [{"l": "Rom 12:8", "n": "", "vs": [[8, "أو الوعظ، ففي الوعظ؛ أو العطاء، فليعط بسخاء؛ أو القيادة، فليقد باجتهاد؛ أو إظهار الرحمة، فليرحم بسرور."]]}, {"l": "1Co 14:3", "n": "", "vs": [[3, "أما الذي يتنبأ، فهو يخاطب الناس بكلام البنيان والتشجيع والتعزية."]]}, {"l": "Tit 2:15", "n": "", "vs": [[15, "بهذه الأمور تكلم، وعظ، ووبخ بكل سلطان، ولا تدع أحدا يستخف بك!"]]}], "kwAr": "الوعظ", "noteAr": ""}, {"kw": "to doctrine", "raw": "1Ti_4:6, 1Ti_4:16; 1Co_14:6, 1Co_14:26; 2Ti_4:2", "note": "", "refs": [{"l": "1Ti 4:6", "n": "", "vs": [[6, "إن بسطت هذه الأمور أمام الإخوة، كنت خادما صالحا للمسيح يسوع، متغذيا بكلام الإيمان والتعليم الصالح الذي اتبعته تماما."]]}, {"l": "1Ti 4:16", "n": "", "vs": [[16, "انتبه جيدا لنفسك وللتعليم. فإنك إذ تواظب على ذلك، تنقذ نفسك وسامعيك أيضا."]]}, {"l": "1Co 14:6", "n": "", "vs": [[6, "والآن، أيها الإخوة، افرضوا أني جئتكم متكلما بلغات مجهولة، فأية منفعة تنالون مني، إلا إذا كلمتكم بإعلان أو علم أو نبوءة أو تعليم؟"]]}, {"l": "1Co 14:26", "n": "", "vs": [[26, "فما العمل إذن أيها الإخوة؟ كلما تجتمعون معا، سيكون لكل منكم مزمور، أو تعليم، أو كلام بلغة مجهولة، أو إعلان، أو ترجمة. فليتم كل شيء بهدف البنيان."]]}, {"l": "2Ti 4:2", "n": "", "vs": [[2, "أن تنادي بالكلمة منشغلا بها كليا، في الفرص المناسبة وغير المناسبة على السواء، وأن توبخ وتنذر وتشجع بكل صبر في التعليم."]]}], "kwAr": "التعليم", "noteAr": ""}], "arS": [["إلى ", []], ["حين", ["G2193"]], [" ", []], ["وصولي", ["G2064"]], ["، ", []], ["انصرف", ["G4337"]], [" إلى ", []], ["تلاوة الكتاب", ["G320"]], ["، وإلى ", []], ["الوعظ", ["G3874"]], ["، وإلى ", []], ["التعليم", ["G1319"]], [".", []]]}, {"c": 4, "v": 14, "text": "لا تهمل الموهبة الخاصة التي فيك والتي أعطيت لك بالتنبوء ووضع الشيوخ أيديهم عليك.", "groups": [{"kw": "Neglect", "raw": "Matt. 25:14-30; Luk_19:12-26; Rom_12:6-8; 1Th_5:19; 2Ti_1:6; 1Pe_4:9-11", "note": "", "refs": [{"l": "Mat 25:14-30", "n": "", "vs": [[14, "فذلك أشبه بإنسان مسافر، استدعى عبيده وسلمهم أمواله،"], [15, "فأعطى واحدا منهم خمس وزنات (من الفضة)، وأعطى آخر وزنتين، وأعطى الثالث وزنة واحدة، كل واحد على قدر طاقته، ثم سافر."], [16, "وفي الحال مضى الذي أخذ الوزنات الخمس وتاجر بها، فربح خمس وزنات أخرى."], [17, "وعمل مثله الذي أخذ الوزنتين، فربح وزنتين أخريين."], [18, "ولكن الذي أخذ الوزنة الواحدة، مضى وحفر حفرة في الأرض وطمر مال سيده."], [19, "وبعد مدة طويلة، رجع سيد أولئك العبيد واستدعاهم ليحاسبهم."], [20, "فجاءه الذي أخذ الوزنات الخمس، وقدم الوزنات الخمس الأخرى، وقال: ياسيد، أنت سلمتني خمس وزنات، فهذه خمس وزنات غيرها ربحتها !"], [21, "فقال له سيده: حسنا فعلت أيها العبد الصالح والأمين! كنت أمينا على القليل، فسأقيمك على الكثير. ادخل إلى فرح سيدك!"], [22, "ثم جاءه أيضا الذي أخذ الوزنتين وقال: ياسيد أنت سلمتني وزنتين، فهاتان وزنتان غيرهما ربحتهما!"], [23, "فقال له سيده: حسنا فعلت أيها العبد الصالح والأمين! كنت أمينا على القليل، فسأقيمك على الكثير. ادخل إلى فرح سيدك!"], [24, "ثم جاءه أيضا الذي أخذ الوزنة الواحدة، وقال: ياسيد، عرفتك رجلا قاسيا، تحصد من حيث لم تزرع، وتجمع من حيث لم تبذر،"], [25, "فخفت، فذهبت وطمرت وزنتك في الأرض. فهذا هو مالك!"], [26, "فأجابه سيده: أيها العبد الشرير الكسول! عرفت أني أحصد من حيث لم أزرع، وأجمع من حيث لم أبذر،"], [27, "فكان يحسن بك أن تودع مالي عند الصيارفة لكي أسترده لدى عودتي مع فائدته!»"], [28, "ثم قال لعبيده: «خذوا منه الوزنة، وأعطوها لصاحب الوزنات العشر:"], [29, "فإن كل من عنده، يعطى المزيد فيفيض؛ ومن ليس عنده، فحتى الذي عنده ينتزع منه."], [30, "أما هذا العبد الذي لا نفع منه، فاطرحوه في الظلمة الخارجية، هناك يكون البكاء وصرير الأسنان!"]]}, {"l": "Luk 19:12-26", "n": "", "vs": [[12, "فقال: «ذهب إنسان نبيل إلى بلد بعيد ليتسلم له ملكا ثم يعود."], [13, "فاستدعى عبيده العشرة، وأودعهم عشر وزنات، وقال لهم: تاجروا إلى أن أعود."], [14, "ولكن أهل بلده كانوا يبغضونه، فأرسلوا في إثره وفدا، قائلين: لا نريد أن يملك هذا علينا!"], [15, "ولدى عودته بعدما تسلم الملك، أمر أن يدعى إليه هؤلاء العبيد الذين أودعهم المال، ليعرف ما ربحه كل واحد منهم بتجارته."], [16, "فتقدم الأول قائلا: ياسيد، إن وزنتك ربحت عشر وزنات!"], [17, "فقال له: حسنا فعلت أيها العبد الصالح. فلأنك كنت أمينا في ما هو قليل، فكن واليا على عشر مدن!"], [18, "وتقدم الثاني قائلا: ياسيد، إن وزنتك ربحت خمس وزنات!"], [19, "فقال لهذا أيضا: وكن أنت واليا على خمس مدن!"], [20, "ثم تقدم عبد آخر قائلا: ياسيد، ها هي وزنتك التي حفظتها مطوية في منديل."], [21, "فقد كنت أخاف منك لأنك إنسان قاس، تستوفي ما لم تستودعه، وتحصد ما لم تزرعه!"], [22, "فقال له: من فمك سأحكم عليك أيها العبد الشرير: عرفت أني إنسان قاس، أستوفي ما لم أستودعه، وأحصد ما لم أزر عه."], [23, "فلماذا لم تودع مالي في المصرف، فكنت أستوفيه مع الفائدة عند عودتي؟"], [24, "ثم قال للواقفين هناك: خذوا منه الوزنة وأعطوها لصاحب الوزنات العشر .."], [25, "فقالوا له: ياسيد، إن عنده عشر وزنات! فقال:"], [26, "إني أقول لكم إن كل من عنده يعطى المزيد؛ وأما من ليس عنده، فحتى الذي عنده ينتزع منه."]]}, {"l": "Rom 12:6-8", "n": "", "vs": [[6, "ولكن، بما أن المواهب موزعة بحسب النعمة الموهوبة لنا، (فلنمارسها): فمن وهب النبوءة، فليتنبأ بحسب مقدار الإيمان؛"], [7, "ومن وهب الخدمة، فلينهمك في الخدمة؛ أو التعليم، ففي التعليم؛"], [8, "أو الوعظ، ففي الوعظ؛ أو العطاء، فليعط بسخاء؛ أو القيادة، فليقد باجتهاد؛ أو إظهار الرحمة، فليرحم بسرور."]]}, {"l": "1Th 5:19", "n": "", "vs": [[19, "لا تخمدوا الروح،"]]}, {"l": "2Ti 1:6", "n": "", "vs": [[6, "لهذا السبب أنبهك أن تلهب نار موهبة الله التي فيك بوضع يدي عليك."]]}, {"l": "1Pe 4:9-11", "n": "", "vs": [[9, "ومارسوا الضيافة بعضكم نحو بعض بلا تذمر."], [10, "وعلى كل واحد منكم أن يخدم الآخرين بالموهبة التي أعطاه الله إياها، باعتباركم وكلاء صالحين مؤتمنين على أنواع متعددة من المواهب التي يمنحها الله بالنعمة."], [11, "فمن يتكلم، عليه أن يتكلم بما يوافق أقوال الله؛ ومن يخدم، عليه أن يخدم بموجب القوة التي يمنحها الله . وذلك لكي يتمجد الله في كل شيء، بيسوع المسيح، له المجد والسلطة إلى أبد الآبدين. آمين!"]]}], "kwAr": "لا تهمل الموهبة", "noteAr": ""}, {"kw": "which", "raw": "1Ti_1:18", "note": "", "refs": [{"l": "1Ti 1:18", "n": "", "vs": [[18, "هذه التوصيات، ياتيموثاوس ولدي، أسلمها لك، بمقتضى النبوآت السابقة المختصة بك، وغايتي أن تحسن الجهاد في حربك الروحية،"]]}], "kwAr": "أعطيت لك بالتنبوء", "noteAr": ""}, {"kw": "with", "raw": "1Ti_5:22; Act_6:6, Act_8:17, Act_13:3, Act_19:6; 2Ti_1:6", "note": "", "refs": [{"l": "1Ti 5:22", "n": "", "vs": [[22, "لا تتسرع في وضع يدك على أحد. ولا تشترك في خطايا الآخرين. واحفظ نفسك طاهرا."]]}, {"l": "Act 6:6", "n": "", "vs": [[6, "وقدموهم للرسل، فصلوا ووضعوا أيديهم عليهم."]]}, {"l": "Act 8:17", "n": "", "vs": [[17, "ثم وضعا أيديهما عليهم، فنالوا الروح القدس."]]}, {"l": "Act 13:3", "n": "", "vs": [[3, "فبعدما صاموا وصلوا ووضعوا عليهما أيديهم أطلقوهما."]]}, {"l": "Act 19:6", "n": "", "vs": [[6, "وما إن وضع بولس يديه عليهم حتى حل عليهم الروح القدس، وأخذوا يتكلمون بلغات أخرى ويتنبأون."]]}, {"l": "2Ti 1:6", "n": "", "vs": [[6, "لهذا السبب أنبهك أن تلهب نار موهبة الله التي فيك بوضع يدي عليك."]]}], "kwAr": "ووضع الشيوخ أيديهم عليك", "noteAr": ""}], "arS": [["لا ", []], ["تهمل", ["G272"]], [" ", []], ["الموهبة", ["G5486"]], [" الخاصة التي فيك والتي ", []], ["أعطيت", ["G1325"]], [" لك ", []], ["بالتنبوء", ["G4394"]], [" ", []], ["ووضع", ["G1936"]], [" ", []], ["الشيوخ", ["G4244"]], [" ", []], ["أيديهم", ["G5495"]], [" عليك.", []]]}, {"c": 4, "v": 15, "text": "انصرف إلى هذه الأمور، وانشغل بها كليا، ليكون تقدمك واضحا للجميع.", "groups": [{"kw": "Meditate", "raw": "Jos_1:8; Psa_1:2, Psa_19:14, Psa_49:3, Psa_63:6, Psa_77:12, Psa_104:34, Psa_105:5, Psa_119:15, Psa_119:23, Psa_119:48; Psa_119:97, Psa_119:99, Psa_119:148, Psa_143:5", "note": "", "refs": [{"l": "Jos 1:8", "n": "", "vs": [[8, "واظب على ترديد كلمات هذه الشريعة، وتأمل فيها ليل نهار لتمارسها بحرص بموجب ما ورد فيها فيحالفك النجاح والتوفيق."]]}, {"l": "Psa 1:2", "n": "", "vs": [[2, "بل في شريعة الرب بهجته، يتأمل فيها نهارا وليلاَ."]]}, {"l": "Psa 19:14", "n": "", "vs": [[14, "لتكن أقوال فمي وخواطر قلبي مقبولة لديك يارب، ياصخرتي وفادي."]]}, {"l": "Psa 49:3", "n": "", "vs": [[3, "ينطق فمي بالحكمة، وخواطر قلبي بالفهم."]]}, {"l": "Psa 63:6", "n": "", "vs": [[6, "أذكرك على فراشي وأتأمل فيك في أثناء الليل."]]}, {"l": "Psa 77:12", "n": "", "vs": [[12, "وأتأمل جميع أفعالك وأناجي بكل ما صنعته."]]}, {"l": "Psa 104:34", "n": "", "vs": [[34, "فيلذ له نشيدي، وأنا أفرح بالرب."]]}, {"l": "Psa 105:5", "n": "", "vs": [[5, "اذكروا عجائبه التي صنع، معجزاته وأحكامه التي نطق بها."]]}, {"l": "Psa 119:15", "n": "", "vs": [[15, "أتأمل وصاياك، وأحفظ سبلك."]]}, {"l": "Psa 119:23", "n": "", "vs": [[23, "جلس الرؤساء وتآمروا علي. أما أنا عبدك فبقيت أتأمل في فرائضك."]]}, {"l": "Psa 119:48", "n": "", "vs": [[48, "وأرفع كفي إلى وصاياك التي أحببتها وأتأمل في فرائضك."]]}, {"l": "Psa 119:97", "n": "", "vs": [[97, "كم أحببت شريعتك، إنها موضوع تأملي طول النهار."]]}, {"l": "Psa 119:99", "n": "", "vs": [[99, "صرت أكثر فهما من معلمي، لأن شهاداتك هي موضوع تأملي."]]}, {"l": "Psa 119:148", "n": "", "vs": [[148, "الليل كله أظل مستيقظا، أتأمل في أقوالك"]]}, {"l": "Psa 143:5", "n": "", "vs": [[5, "تذكرت الأيام السالفة متأملا في جميع أعمالك، متفكرا في صنيع يديك."]]}], "kwAr": "انصرف إلى هذه الأمور", "noteAr": ""}, {"kw": "give", "raw": "Act_6:4; 1Co_16:15; 2Co_4:14, 2Co_8:5; Tit_2:14", "note": "", "refs": [{"l": "Act 6:4", "n": "", "vs": [[4, "أما نحن، فنداوم على الصلاة وخدمة الكلمة»."]]}, {"l": "1Co 16:15", "n": "", "vs": [[15, "على أني، أيها الإخوة، أطلب إليكم هذا الطلب: أنتم تعرفون عائلة استفاناس، فهم باكورة أخائية، وقد كرسوا أنفسهم لخدمة القديسين،"]]}, {"l": "2Co 4:14", "n": "", "vs": [[14, "ونحن عالمون أن الذي أقام الرب يسوع من الموت سوف يقيمنا نحن أيضا مع يسوع، ويوقفنا في حضرته بصحبتكم."]]}, {"l": "2Co 8:5", "n": "", "vs": [[5, "كما أنهم تجاوزوا ما توقعناه، إذ كرسوا أنفسهم أولا للرب ثم لنا نحن بمشيئة الله،"]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}], "kwAr": "وانشغل بها كليا", "noteAr": ""}, {"kw": "that", "raw": "1Ti_4:6; Mat_5:16; Phi_2:15, Phi_2:16", "note": "", "refs": [{"l": "1Ti 4:6", "n": "", "vs": [[6, "إن بسطت هذه الأمور أمام الإخوة، كنت خادما صالحا للمسيح يسوع، متغذيا بكلام الإيمان والتعليم الصالح الذي اتبعته تماما."]]}, {"l": "Mat 5:16", "n": "", "vs": [[16, "هكذا، فليضيء نوركم أمام الناس، ليروا أعمالكم الحسنة ويمجدوا أباكم الذي في السماوات."]]}, {"l": "Phi 2:15", "n": "", "vs": [[15, "لتكونوا بلا أذى وبسطاء، أولادا لله لا يعابون بشيء في وسط جيل منحرف فاسد، تضيئون بينهم كأنوار في العالم،"]]}, {"l": "Phi 2:16", "n": "", "vs": [[16, "حاملين كلمة الحياة، لتكونوا في يوم المسيح موضع فخر بأني ما سعيت باطلا ولا اجتهدت عبثا."]]}], "kwAr": "ليكون تقدمك واضحا", "noteAr": ""}, {"kw": "to all", "raw": "or, in all things", "note": "or, in all things", "refs": [], "kwAr": "للجميع", "noteAr": "أو: في كل شيء."}], "arS": [["انصرف", ["G3191"]], [" إلى هذه ", []], ["الأمور", ["G5023"]], ["، ", []], ["وانشغل بها كليا", ["G2468"]], ["، ليكون ", []], ["تقدمك", ["G4297"]], [" ", []], ["واضحا", ["G5318"]], [" ", []], ["للجميع", ["G3956"]], [".", []]]}, {"c": 4, "v": 16, "text": "انتبه جيدا لنفسك وللتعليم. فإنك إذ تواظب على ذلك، تنقذ نفسك وسامعيك أيضا.", "groups": [{"kw": "Take", "raw": "1Ch_28:10; 2Ch_19:6; Mar_13:9; Luk_21:34; Act_20:28; 1Co_3:10,1Co_3:11; Col_4:17; 2Ti_4:2; Tit_2:7, Tit_2:15; Heb_12:15; 2Jo_1:8", "note": "", "refs": [{"l": "1Ch 28:10", "n": "", "vs": [[10, "ففكر مليا، لأن الرب قد اصطفاك لتبني بيتا لقدس الأقداس، فتقو واعمل»."]]}, {"l": "2Ch 19:6", "n": "", "vs": [[6, "وقال لهم: «توخوا الحيطة في كل حكم تصدرونه، لأنكم لا تقضون للإنسان بل للرب الحاضر معكم دائما عند إصدار أحكامكم."]]}, {"l": "Mar 13:9", "n": "", "vs": [[9, "فانتبهوا لأنفسكم، لأنهم سوف يسلمونكم إلى المحاكم والمجامع، فتضربون وتمثلون أمام حكام وملوك من أجلي، شهادة عندهم."]]}, {"l": "Luk 21:34", "n": "", "vs": [[34, "ولكن احذروا لأنفسكم لئلا تتثقل قلوبكم بالانغماس في اللذات وبالسكر وهموم الحياة، فيدهمكم ذلك اليوم فجأة؛"]]}, {"l": "Act 20:28", "n": "", "vs": [[28, "فاسهروا إذن على أنفسكم وعلى جميع القطيع الذي عينكم بينه الروح القدس نظارا، لترعوا كنيسة الله التي اشتراها بدمه."]]}, {"l": "1Co 3:10", "n": "", "vs": [[10, "وبحسب نعمة الله الموهوبة لي، وضعت الأساس كما يفعل البناء الماهر، وغيري يبني عليه. ولكن، لينتبه كل واحد كيف يبني عليه."]]}, {"l": "1Co 3:11", "n": "", "vs": [[11, "فليس ممكنا أن يضع أحد أساسا آخر بالإضافة إلى الأساس الموضوع، وهو يسوع المسيح."]]}, {"l": "Col 4:17", "n": "", "vs": [[17, "وقولوا لأرخبس: «تنبه للخدمة التي تلقيتها في الرب، وقم بها كاملة!»"]]}, {"l": "2Ti 4:2", "n": "", "vs": [[2, "أن تنادي بالكلمة منشغلا بها كليا، في الفرص المناسبة وغير المناسبة على السواء، وأن توبخ وتنذر وتشجع بكل صبر في التعليم."]]}, {"l": "Tit 2:7", "n": "", "vs": [[7, "جاعلا من نفسك في كل شيء قدوة للأعمال الصالحة، مظهرا في تعليمك النقاوة والوقار"]]}, {"l": "Tit 2:15", "n": "", "vs": [[15, "بهذه الأمور تكلم، وعظ، ووبخ بكل سلطان، ولا تدع أحدا يستخف بك!"]]}, {"l": "Heb 12:15", "n": "", "vs": [[15, "انتبهوا ألا يسقط أحدكم من نعمة الله، حتى لا يتأصل بينكم جذر مرارة، فيسبب بلبلة، وينجس كثيرين منكم."]]}, {"l": "2Jo 1:8", "n": "", "vs": [[8, "فانتبهوا لأنفسكم، لكي لا يضيع الجهد الذي بذلناه في سبيلكم، بل لتنالوا أجركم كاملا."]]}], "kwAr": "انتبه جيدا لنفسك", "noteAr": ""}, {"kw": "unto the", "raw": "1Ti_4:6, 1Ti_1:3; Rom_16:17; Eph_4:14; Tit_2:7; Heb_13:9; 2Jo_1:9", "note": "", "refs": [{"l": "1Ti 4:6", "n": "", "vs": [[6, "إن بسطت هذه الأمور أمام الإخوة، كنت خادما صالحا للمسيح يسوع، متغذيا بكلام الإيمان والتعليم الصالح الذي اتبعته تماما."]]}, {"l": "1Ti 1:3", "n": "", "vs": [[3, "كما أوصيتك لما كنت منطلقا إلى مقاطعة مقدونية، (أطلب إليك) أن تبقى في مدينة أفسس، لكي تمنع بعض المعلمين من نشر التعاليم المخالفة للتعليم الصحيح،"]]}, {"l": "Rom 16:17", "n": "", "vs": [[17, "ولكن، أتوسل إليكم، أيها الإخوة، أن تنتبهوا إلى مثيري الانقسامات والعثرات، خلافا للتعليم الذي تعلمتم، وأن تبتعدوا عنهم."]]}, {"l": "Eph 4:14", "n": "", "vs": [[14, "وذلك حتى لا نكون فيما بعد أطفالا تتقاذفنا وتحملنا كل ريح تعليم يقوم على خداع الناس والمكر بهم لجرهم إلى الضلال الملفق،"]]}, {"l": "Tit 2:7", "n": "", "vs": [[7, "جاعلا من نفسك في كل شيء قدوة للأعمال الصالحة، مظهرا في تعليمك النقاوة والوقار"]]}, {"l": "Heb 13:9", "n": "", "vs": [[9, "فلا تنخدعوا وتتبعوا تلك التعاليم الغريبة المتنوعة ... فمن الأفضل أن يثبت القلب بالنعمة لا بنظم الأطعمة التي لم تنفع المتقيدين بها."]]}, {"l": "2Jo 1:9", "n": "", "vs": [[9, "لأن من تعدى تعليم المسيح ولم يثبت فيه، فليس الله من نصيبه. أما من يثبت في هذا التعليم، فله الآب والابن معا."]]}], "kwAr": "وللتعليم", "noteAr": ""}, {"kw": "continue", "raw": "Act_6:4, Act_26:22; Rom_2:7; 2Ti_3:14; Tit_1:9", "note": "", "refs": [{"l": "Act 6:4", "n": "", "vs": [[4, "أما نحن، فنداوم على الصلاة وخدمة الكلمة»."]]}, {"l": "Act 26:22", "n": "", "vs": [[22, "ولكن الله حفظني حتى هذا اليوم، وبمعونته أقف أمام البسطاء والعظماء شاهدا له ولست أحيد عما تنبأ به موسى والأنبياء،"]]}, {"l": "Rom 2:7", "n": "", "vs": [[7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"]]}, {"l": "2Ti 3:14", "n": "", "vs": [[14, "إنما أنت فاثبت على ما تعلمته وتيقنته بالتمام، إذ تعرف على يد من تعلمت ذلك."]]}, {"l": "Tit 1:9", "n": "", "vs": [[9, "ملتصقا بالكلمة الصادقة الموافقة للتعليم، ليكون قادرا على تشجيع المؤمنين بالتعليم الصحيح وعلى إفحام المعارضين."]]}], "kwAr": "تواظب على ذلك", "noteAr": ""}, {"kw": "thou shalt", "raw": "Eze_3:19-21, Eze_33:7-9; Act_20:26, Act_20:27; 1Co_9:27", "note": "", "refs": [{"l": "Eze 3:19-21", "n": "", "vs": [[19, "لكن إن أنذرت الشرير ولم يرجع عن شره وعن طرقه الأثيمة، فإنه يموت بذنبه، وتنجو أنت بنفسك."], [20, "وكذلك إن حاد البار عن بره وارتكب الإثم، ونصبت أمامه معثرة، فإنه يموت. ولأنك لم تنذره فإنه يموت بذنبه ولا تذكر بعد أعماله الصالحة التي قام بها، أما دمه فمن يدك أطلبه."], [21, "أما إن كنت قد أنذرت البار حتى لا يخطيء، ولم يخطيء، فإنه حتما يحيا لأنه قبل الإنذار، وتنجو أنت بنفسك»."]]}, {"l": "Eze 33:7-9", "n": "", "vs": [[7, "وأنت ياابن آدم، قد أقمتك رقيبا لشعب إسرائيل، فتسمع قضائي، وتحذرهم من قبلي."], [8, "إن قلت للشرير: ياشر ير إنك حتما تموت من أجل شرك، ولم تعمد إلى تحذيره من طريقه، فإن ذلك الشرير يموت بذنبه، أما دمه فمن يدك أطلبه."], [9, "ولكن إن حذرت الشرير ليرتدع عن طريقه فأبى فهو يموت بذنبه، أما أنت فتكون قد خلصت نفسك."]]}, {"l": "Act 20:26", "n": "", "vs": [[26, "لذلك أشهد لكم اليوم أني بريء من دمكم جميعا،"]]}, {"l": "Act 20:27", "n": "", "vs": [[27, "لأني لم أمتنع عن إبلاغكم جميع مقاصد الله."]]}, {"l": "1Co 9:27", "n": "", "vs": [[27, "بل أسدد اللكمات إلى جسدي وأسوقه أسيرا، مخافة أن يتبين أني غير مؤهل (للمجازاة) بعدما دعوت الآخرين إليها!"]]}], "kwAr": "تنقذ نفسك", "noteAr": ""}, {"kw": "them", "raw": "Isa_55:11; Jer_23:22; Rom_10:10-14, Rom_11:14; 1Co_9:22; 1Th_2:16, 1Th_2:19, 1Th_2:20; 2Ti_2:10; Phm_1:19; Jam_5:20", "note": "", "refs": [{"l": "Isa 55:11", "n": "", "vs": [[11, "هكذا تكون كلمتي التي تصدر عني مثمرة دائما، وتحقق ما أرغب فيه وتفلح بما أعهد به إليها."]]}, {"l": "Jer 23:22", "n": "", "vs": [[22, "لو مثلوا حقا في مجلسي لبلغوا كلامي لشعبي، ولكانوا ردوهم عن مساوئهم وعن شر أعمالهم."]]}, {"l": "Rom 10:10-14", "n": "", "vs": [[10, "فإن الإيمان في القلب يؤدي إلى البر، والاعتراف بالفم يؤيد الخلاص،"], [11, "لأن الكتاب يقول: «كل من هو مؤمن به، لا يخيب»."], [12, "فلا فرق بين اليهودي واليوناني، لأن للجميع ربا واحدا، غنيا تجاه كل من يدعوه»."], [13, "«فإن كل من يدعو باسم الرب يخلص»."], [14, "ولكن، كيف يدعون من لم يؤمنوا به؟ وكيف يؤمنون بمن لم يسمعوا به؟ وكيف يسمعون بلا مبشر؟"]]}, {"l": "Rom 11:14", "n": "", "vs": [[14, "لعلي أثير غيرة بني جنسي فأنقذ بعضا منهم."]]}, {"l": "1Co 9:22", "n": "", "vs": [[22, "وصرت للضعفاء ضعيفا، حتى أكسب الضعفاء. صرت للجميع كل شيء، لأنقذ بعضا منهم مهما كلف الأمر."]]}, {"l": "1Th 2:16", "n": "", "vs": [[16, "إذ يمنعوننا من تبشير الأمم ليخلصوا، وبذلك يستكملون خطاياهم كل حين، ولكن الغضب قد حل عليهم إلى الغاية."]]}, {"l": "1Th 2:19", "n": "", "vs": [[19, "فما هو رجاؤنا أو فرحنا أو إكليل افتخارنا أمام ربنا يسوع عند عودته؟ أليس أنتم؟ بلى،"]]}, {"l": "1Th 2:20", "n": "", "vs": [[20, "لأنكم فخرنا وفرحنا."]]}, {"l": "2Ti 2:10", "n": "", "vs": [[10, "لهذا السبب أحتمل كل شيء بصبر لأجل الذين اختارهم الله ، لكي يحصلوا، هم أيضا، على الخلاص الذي في المسيح يسوع مع المجد الأبدي."]]}, {"l": "Phm 1:19", "n": "", "vs": [[19, "وها أنا بولس قد كتبت هذا بخط يدي: أنا أوفي، ولست أذكرك هنا أنك مديون لي بنفسك أيضا."]]}, {"l": "Jam 5:20", "n": "", "vs": [[20, "فليتأكد أن الذي يرد خاطئا عن ضلال مسلكه، فإنما ينقذ نفسا من الموت، ويستر خطايا كثيرة!"]]}], "kwAr": "وسامعيك", "noteAr": ""}], "arS": [["انتبه", ["G1907"]], [" جيدا ", []], ["لنفسك", ["G4572"]], [" ", []], ["وللتعليم", ["G1319"]], [". فإنك إذ ", []], ["تواظب", ["G1961"]], [" على ذلك، ", []], ["تنقذ", ["G4982"]], [" ", []], ["نفسك", ["G4572"]], [" ", []], ["وسامعيك", ["G191"]], [" أيضا.", []]]}, {"c": 5, "v": 1, "text": "لا توبخ شيخا توبيخا قاسيا، بل عظه كأنه أب لك. وعامل الشبان كأنهم إخوة لك؛", "groups": [{"kw": "Rebuke", "raw": "1Ti_5:19, 1Ti_5:20; Lev_19:32; Deu_33:9; Gal_2:11-14", "note": "", "refs": [{"l": "1Ti 5:19", "n": "", "vs": [[19, "ولا تقبل تهمة موجهة إلى أحد الشيوخ، إلا إذا أيدها شاهدان أو ثلاثة."]]}, {"l": "1Ti 5:20", "n": "", "vs": [[20, "فإذا ثبت أن المتهم مخطيء، وبخه أمام الجميع، ليكون عند الباقين خوف!"]]}, {"l": "Lev 19:32", "n": "", "vs": [[32, "قف في حضرة كبار السن، ووقر الشيوخ، واتق إلهك، فأنا الرب."]]}, {"l": "Deu 33:9", "n": "", "vs": [[9, "الذي قال عن والديه: لم أرهما، وبإخوته لم يعترف، وأنكر أبناءه، بل أطاعوا وصاياك وصانوا عهدك."]]}, {"l": "Gal 2:11-14", "n": "", "vs": [[11, "ولكن لما جاء بطرس إلى مدينة أنطاكية، قاومته وجها لوجه لأنه كان يستحق أن يلام."], [12, "إذ قبل أن يأتي بعضهم من عند يعقوب، كان بطرس يأكل مع الإخوة الذين من الأمم؛ ولكن لما أتى أولئك، انسحب وعزل نفسه، خوفا من أهل الختان."], [13, "وجاراه في ريائه باقي الإخوة الذين من اليهود. حتى إن برنابا أيضا انساق إلى ريائهم."], [14, "فلما رأيت أنهم لا يسلكون باستقامة توافق حق الإنجيل، قلت لبطرس أمام الحاضرين جميعا: «إن كنت وأنت يهودي تعيش كالأمم لا كاليهود، فكيف تجبر الأمم أن يعيشوا كاليهود؟»"]]}], "kwAr": "لا توبخ", "noteAr": ""}, {"kw": "an elder", "raw": "1Ti_5:17; Act_14:23, Act_15:4, Act_15:6, Act_20:17; Tit_1:5, Tit_1:6; Jam_5:14; 1Pe_5:1; 2Jo_1:1; 3Jo_1:1; Rev_4:4", "note": "", "refs": [{"l": "1Ti 5:17", "n": "", "vs": [[17, "أما الشيوخ الذين يحسنون القيادة، فليعتبروا أهلا للإكرام المضاعف، وبخاصة الذين يبذلون الجهد في نشر الكلمة وفي التعليم."]]}, {"l": "Act 14:23", "n": "", "vs": [[23, "وعينا للتلاميذ شيوخا في كل كنيسة. ثم صليا بأصوام وأسلما الجميع وديعة بين يدي الرب الذي آمنوا به."]]}, {"l": "Act 15:4", "n": "", "vs": [[4, "ولما وصلوا إلى أورشليم، رحبت بهم الكنيسة بمن فيها من رسل وشيوخ، فأخبروهم بكل ما فعل الله بواسطتهم."]]}, {"l": "Act 15:6", "n": "", "vs": [[6, "فعقد الرسل والشيوخ اجتماعا لدراسة هذه القضية."]]}, {"l": "Act 20:17", "n": "", "vs": [[17, "ومن ميليتس أرسل بولس إلى أفسس يستدعي شيوخ الكنيسة."]]}, {"l": "Tit 1:5", "n": "", "vs": [[5, "تركتك في جزيرة كريت لكي تكمل ترتيب الأمور الباقية، وتقيم شيوخا في كل مدينة، مثلما أمرتك؛"]]}, {"l": "Tit 1:6", "n": "", "vs": [[6, "على أن يكون الواحد منهم بريئا من كل تهمة، زوجا لامرأة واحدة، أبا لأولاد مؤمنين لا يتهمون بالخلاعة والتمرد."]]}, {"l": "Jam 5:14", "n": "", "vs": [[14, "ومن كان منكم مريضا، فليستدع شيوخ الكنيسة ليصلوا من أجله ويدهنوه بزيت باسم الرب."]]}, {"l": "1Pe 5:1", "n": "", "vs": [[1, "وهذه وصيتي إلى الشيوخ الذين بينكم، بصفتي شيخا رفيقا لهم، وشاهدا لآلام المسيح، وشريكا في المجد الذي سيتجلى:"]]}, {"l": "2Jo 1:1", "n": "", "vs": [[1, "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."]]}, {"l": "3Jo 1:1", "n": "", "vs": [[1, "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."]]}, {"l": "Rev 4:4", "n": "", "vs": [[4, "وقد أحاط بالعرش أربعة وعشرون عرشا يجلس عليها أربعة وعشرون شيخا يلبسون ثيابا بيضاء، وعلى رؤوسهم أكاليل من ذهب."]]}], "kwAr": "شيخا", "noteAr": ""}, {"kw": "entreat", "raw": "Rom_13:7; Gal_6:1; 2Ti_2:24, 2Ti_2:25; Phm_1:9, Phm_1:10; Jam_3:17; 1Pe_5:5, 1Pe_5:6", "note": "", "refs": [{"l": "Rom 13:7", "n": "", "vs": [[7, "فأدوا لكل واحد حقه: الضريبة لصاحب الضريبة والجزية لصاحب الجزية، والاحترام لصاحب الاحترام، والإكرام لصاحب الإكرام."]]}, {"l": "Gal 6:1", "n": "", "vs": [[1, "أيها الإخوة، إن سقط أحدكم في خطأ ما فمثل هذا أصلحوه أنتم الروحيين بروح وداعة. واحذر أنت لنفسك لئلا تجرب أيضا."]]}, {"l": "2Ti 2:24", "n": "", "vs": [[24, "وعبد الرب يجب ألا يتشاجر، بل أن يكون مترفقا تجاه الجميع، قادرا على التعليم، يتحمل المشقات بصبر،"]]}, {"l": "2Ti 2:25", "n": "", "vs": [[25, "ويؤدب بالوداعة مقاومي الإيمان، عسى أن يمنحهم الله التوبة، فيعرفوا الحق بالتمام،"]]}, {"l": "Phm 1:9", "n": "", "vs": [[9, "إلا أني، إكراما للمحبة، اخترت أن أقدم إليك التماسا، بصفتي بولس العجوز والسجين حاليا لأجل المسيح يسوع."]]}, {"l": "Phm 1:10", "n": "", "vs": [[10, "فألتمس منك لأجل ولدي الذي ولدته وأنا مكبل بالقيود، أونسيموس،"]]}, {"l": "Jam 3:17", "n": "", "vs": [[17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}, {"l": "1Pe 5:5", "n": "", "vs": [[5, "كذلك، أيها الشباب، اخضعوا للشيوخ. البسوا جميعا ثوب التواضع في معاملتكم بعضكم لبعض. لأن الله يقاوم المتكبرين، ولكنه يعطي المتواضعين نعمة."]]}, {"l": "1Pe 5:6", "n": "", "vs": [[6, "إذن، تواضعوا تحت يد الله القديرة لكي يرفعكم عندما يحين الوقت،"]]}], "kwAr": "بل عظه كأنه أب لك", "noteAr": ""}, {"kw": "as brethren", "raw": "Mat_18:15-17, Mat_23:8", "note": "", "refs": [{"l": "Mat 18:15-17", "n": "", "vs": [[15, "إن أخطأ إليك أخوك، فاذهب إليه وعاتبه بينك وبينه على انفراد. فإذا سمع لك، تكون قد ربحت أخاك."], [16, "وإذا لم يسمع، فخذ معك أخا آخر أو اثنين، حتى يثبت كل أمر بشهادة شاهدين أو ثلاثة."], [17, "فإذا لم يسمع لهما، فاعرض الأمر على الكنيسة. فإذا لم يسمع للكنيسة أيضا، فليكن عندك كالوثني وجابي الضرائب."]]}, {"l": "Mat 23:8", "n": "", "vs": [[8, "أما أنتم، فلا تقبلوا أن يدعوكم أحد: يامعلم! لأن معلمكم واحد، وأنتم جميعا إخوة."]]}], "kwAr": "كأنهم إخوة لك", "noteAr": ""}], "arS": [["لا ", []], ["توبخ", ["G1969"]], [" ", []], ["شيخا", ["G4245"]], [" توبيخا قاسيا، بل ", []], ["عظه", ["G3870"]], [" كأنه ", []], ["أب", ["G3962"]], [" لك. وعامل ", []], ["الشبان", ["G3501"]], [" كأنهم ", []], ["إخوة", ["G80"]], [" لك؛", []]]}, {"c": 5, "v": 2, "text": "والعجائز كأنهن أمهات؛ والشابات كأنهن أخوات، بكل طهارة.", "groups": [{"kw": "elder", "raw": "1Ti_5:3 م في مسكنه المقدس هو أبو اليتامى وقاضي الأرامل."]]}, {"l": "Psa 94:6", "n": "", "vs": [[6, "يقتلون الأرملة والغريب ويذبحون اليتيم."]]}, {"l": "Psa 146:9", "n": "", "vs": [[9, "الرب يحفظ الغرباء، يعضد اليتامى والأرامل، ولكنه يحبط مساعي الأشرار."]]}, {"l": "Jer 49:11", "n": "", "vs": [[11, "اترك أيتامك فإني أحييهم، ولتتكل أراملك علي."]]}, {"l": "Mat 23:14", "n": "", "vs": [[14, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تلتهمون بيوت الأرامل وتتذرعون بإطالة صلواتكم. لذلك ستنزل بكم دينونة أقسى!"]]}, {"l": "Luk 7:12", "n": "", "vs": [[12, "ولما اقترب من باب المدينة، إذا ميت محمول، وهو ابن وحيد لأمه التي كانت أرملة، وكان معها جمع كبير من المدينة."]]}, {"l": "Act 6:1", "n": "", "vs": [[1, "وإذ تكاثر التلاميذ في تلك الأيام، احتج اليهود اليونانيون على العبرانيين، لأن أراملهم لم يكن يحصلن على نصيب من الإعانات اليومية."]]}, {"l": "Act 9:39", "n": "", "vs": [[39, "فقام وذهب. ولما وصل قادوه إلى الطبقة العليا، فتقدمت إليه جميع الأرامل باكيات، يعرضن بعض الأقمصة والثياب مما كانت غزالة تخيطه وهي معهن."]]}, {"l": "Jam 1:27", "n": "", "vs": [[27, "فالديانة الطاهرة النقية في نظر الله الآب، تظهر في زيارة الأيتام والأرامل لإعانتهم في ضيقهم، وفي صيانة النفس من التلوث بفساد العالم."]]}], "kwAr": "الأرامل", "noteAr": ""}, {"kw": "indeed", "raw": "1Ti_5:4, 1Ti_5:5, 1Ti_5:9-11, 1Ti_5:16; Luk_2:37; Joh_1:47", "note": "", "refs": [{"l": "1Ti 5:4", "n": "", "vs": [[4, "فإن كان للأرملة أولاد أو حفدة، فمن أول واجبات هؤلاء أن يتعلموا توقير أهلهم وأن يفوا حق والديهم. فإن هذا العمل مقبول في نظر الله."]]}, {"l": "1Ti 5:5", "n": "", "vs": [[5, "ولكن الأرملة التي تعيش وحيدة ولا معيل لها، فقد وضعت رجاءها في الله وهي تداوم على الأدعية والصلوات ليلا ونهارا."]]}, {"l": "1Ti 5:9-11", "n": "", "vs": [[9, "لتقيد في سجل الأرامل من بلغت سن الستين على الأقل، على أن تكون قد تزوجت من رجل واحد،"], [10, "ويكون مشهودا لها بالأعمال الصالحة، كأن تكون قد ربت الأولاد، وأضافت الغرباء، وغسلت أقدام القديسين، وأسعفت المتضايقين، ومارست كل عمل صالح!"], [11, "أما الأرامل الشابات، فلا تقيدهن. إذ عندما يبطرن على المسيح، يرغبن في الزواج،"]]}, {"l": "1Ti 5:16", "n": "", "vs": [[16, "وإن كان لأحد المؤمنين أو المؤمنات أرامل من ذويه، فعليه أن يعينهن حتى لا تتحمل الكنيسة الأعباء، فتتفرغ لإعانة الأرامل المحتاجات حقا."]]}, {"l": "Luk 2:37", "n": "", "vs": [[37, "وهي أرملة نحو أربع وثمانين سنة. لم تكن تفارق الهيكل وكانت تتعبد ليلا ونهارا بالصوم والدعاء."]]}, {"l": "Joh 1:47", "n": "", "vs": [[47, "ورأى يسوع نثنائيل قادما نحوه فقال عنه: «هذا إسرائيلي أصيل لا شك فيه!»"]]}], "kwAr": "اللواتي لا معيل لهن", "noteAr": ""}], "arS": [["أكرم", ["G5091"]], [" ", []], ["الأرامل", ["G5503"]], [" اللواتي ", []], ["لا معيل لهن", ["G3689"]], [".", []]]}, {"c": 5, "v": 4, "text": "فإن كان للأرملة أولاد أو حفدة، فمن أول واجبات هؤلاء أن يتعلموا توقير أهلهم وأن يفوا حق والديهم. فإن هذا العمل مقبول في نظر الله.", "groups": [{"kw": "nephews", "raw": "Jdg_12:14 *marg. Job_18:19; Isa_14:22", "note": "", "refs": [{"l": "Jdg 12:14", "n": "*marg.", "vs": [[14, "وكان له أربعون ابنا وثلاثون حفيدا يركبون على سبعين حمارا. هذا قضى لإسرائيل ثماني سنوات."]]}, {"l": "Job 18:19", "n": "", "vs": [[19, "لا يكون له نسل، ولا عقب بين شعبه، ولا حي في أماكن سكناه."]]}, {"l": "Isa 14:22", "n": "", "vs": [[22, "إني أهب ضدهم، يقول الرب القدير، وأمحو من بابل اسما وبقية ونسلا وذرية،"]]}], "kwAr": "حفدة", "noteAr": ""}, {"kw": "learn", "raw": "1Sa_22:3, 1Sa_22:4; Pro_31:28; Luk_2:51; Joh_19:26, Joh_19:27", "note": "", "refs": [{"l": "1Sa 22:3", "n": "", "vs": [[3, "ثم انتقل داود من هناك إلى مصفاة موآب، وقال لملك موآب: «دع أبي وأمي في عهدتكم ريثما أعلم ما يصنع بي الله»."]]}, {"l": "1Sa 22:4", "n": "", "vs": [[4, "فأودعهما عند ملك موآب، فأقاما عنده طوال مدة إقامة داود في الحصن."]]}, {"l": "Pro 31:28", "n": "", "vs": [[28, "يقوم أبناؤها ويغبطونها، ويطريها زوجها أيضا قائلا:"]]}, {"l": "Luk 2:51", "n": "", "vs": [[51, "ثم نزل معهما ورجع إلى الناصرة، وكان خاضعا لهما. وكانت أمه تحفظ هذه الأمور كلها في قلبها."]]}, {"l": "Joh 19:26", "n": "", "vs": [[26, "فلما رأى يسوع أمه، والتلميذ الذي كان يحبه واقفا بالقرب منها، قال لأمه: «أيتها المرأة، هذا ابنك!»"]]}, {"l": "Joh 19:27", "n": "", "vs": [[27, "ثم قال للتلميذ: «هذه أمك». ومنذ ذلك الحين أخذها التلميذ إلى بيته."]]}], "kwAr": "أن يتعلموا", "noteAr": ""}, {"kw": "piety", "raw": "or, kindness, Mat_15:4-6; Mar_7:11-13", "note": "or, kindness, Mat_15:4-6; Mar_7:11-13", "refs": [{"l": "Mat 15:4-6", "n": "", "vs": [[4, "فقد أوصى الله قائلا: أكرم أباك وأمك. ومن أهان أباه أو أمه، فليكن الموت عقابا له."], [5, "ولكنكم أنتم تقولون: من قال لأبيه أو أمه: إن ما أعولك به قد قدمته قربانا للهيكل،"], [6, "فهو في حل من إكرام أبيه وأمه. وأنتم، بهذا، تلغون ما أوصى به الله ، محافظة على تقاليدكم."]]}, {"l": "Mar 7:11-13", "n": "", "vs": [[11, "ولكنكم أنتم تقولون: إذا قال أحد لأبيه أو أمه: إن ما كنت أعولك به قد جعلته قربانا، أي تقدمة (للهيكل)،"], [12, "فهو في حل من إعانة أبيه أو أمه!"], [13, "وهكذا تبطلون كلمة الله بتعليمكم التقليدي الذي تتناقلونه. وهناك أمور كثيرة مثل هذه تفعلونها! »"]]}], "kwAr": "توقير أهلهم", "noteAr": "أو: لطفًا (برًّا)."}, {"kw": "to requite", "raw": "Gen_45:10,Gen_45:11, Gen_47:12, Gen_47:28; Rth_2:2, Rth_2:18; Eph_6:1-3", "note": "", "refs": [{"l": "Gen 45:10", "n": "", "vs": [[10, "فتقيم في أرض جاسان لتكون قريبا مني أنت وبنوك وأحفادك وغنمك وبقرك وكل مالك."]]}, {"l": "Gen 45:11", "n": "", "vs": [[11, "وأعولك هناك لأن الجوع سيستمر خمس سنوات أخرى، فلا تحتاج أنت وعائلتك وبهائمك."]]}, {"l": "Gen 47:12", "n": "", "vs": [[12, "وأمد يوسف أباه وإخوته وأهل بيت أبيه بالطعام على حسب عيالهم."]]}, {"l": "Gen 47:28", "n": "", "vs": [[28, "وعاش يعقوب في أرض مصر سبع عشرة سنة حتى بلغ من العمر مئة وسبعة وأربعين عاما."]]}, {"l": "Rut 2:2", "n": "", "vs": [[2, "فقالت راعوث الموآبية لنعمي: «دعيني أذهب إلى الحقل وألتقط السنابل المتخلفة عن أي واحد أحظى برضاه». فأجابتها: «اذهبي يابنتي»"]]}, {"l": "Rut 2:18", "n": "", "vs": [[18, "فحملتها وقدمت بها إلى المدينة. فرأت حماتها ما التقطته، ثم أخرجت ما فاض عنها من طعام بعد شبعها وأعطته لحماتها"]]}, {"l": "Eph 6:1-3", "n": "", "vs": [[1, "أيها الأولاد، أطيعوا والديكم في (رضى) الرب. فهذا هو الصواب:"], [2, "«أكرم أباك وأمك» وهذه أول وصية مرتبطة Isa 49:21", "n": "", "vs": [[21, "فتسألين نفسك: من أنجب لي هؤلاء وأنا ثكلى وعاقر، منفية ومنبوذة؟ من ربى لي هؤلاء؟ فقد تركت وحدي، أما هؤلاء فمن أين جاءوا؟"]]}, {"l": "Isa 54:1", "n": "", "vs": [[1, "ترنمي أيتها العاقر التي لم تنجب، أشيدي بالترنم والهتاف يامن لم تقاسي من المخاض، لأن أبناء المستوحشة أكثر من أبناء ذات الزوج، يقول الرب."]]}, {"l": "Lam 1:13", "n": "", "vs": [[13, "من العلاء صب نارا في عظامي فسرت فيها. نصب شركا لقدمي فردني إلى الوراء. جعلني أطلالا أئن طول النهار."]]}], "kwAr": "التي تعيش وحيدة", "noteAr": ""}, {"kw": "trusteth", "raw": "Rth_2:12; Psa_91:4; Isa_12:2, Isa_50:10; 1Co_7:32; 1Pe_3:5", "note": "", "refs": [{"l": "Rut 2:12", "n": "", "vs": [[12, "ليكافئك الرب إله إسرائيل، الذي جئت لتحتمي تحت جناحيه، وفقا لإحسانك. وليكن أجرك كاملا من عنده»."]]}, {"l": "Psa 91:4", "n": "", "vs": [[4, "بريشه الناعم يظللك، وتحت أجنحته تحتمي، فتكون لك وعوده الأمينة ترسا ومتراسا،"]]}, {"l": "Isa 12:2", "n": "", "vs": [[2, "ها إن الله خلاصي فأطمئن ولا أرتعد، لأن الرب الله هو قوتي وترنيمتي وقد أصبح لي خلاصا»."]]}, {"l": "Isa 50:10", "n": "", "vs": [[10, "من منكم يتقي الرب ويطيع صوت خادمه؟ من الذي يسلك في الظلمة من غير نور؟ فليتكل على اسم الرب ويعتمد على إلهه."]]}, {"l": "1Co 7:32", "n": "", "vs": [[32, "فأريد لكم أن تكونوا بلا هم. إن غير المتزوج يهتم بأمور الرب"]]}, {"l": "1Pe 3:5", "n": "", "vs": [[5, "وبها كانت تتزين النساء التقيات قديما، فكانت الواحدة منهن تتكل على الله وتخضع لزوجها."]]}], "kwAr": "وضعت رجاءها في الله", "noteAr": ""}, {"kw": "continueth", "raw": "Luk_2:37, Luk_18:1, Luk_18:7; Act_26:7; Eph_6:18", "note": "", "refs": [{"l": "Luk 2:37", "n": "", "vs": [[37, "وهي أرملة نحو أربع وثمانين سنة. لم تكن تفارق الهيكل وكانت تتعبد ليلا ونهارا بالصوم والدعاء."]]}, {"l": "Luk 18:1", "n": "", "vs": [[1, "وضرب لهم مثلا في وجوب الصلاة دائما ودون ملل،"]]}, {"l": "Luk 18:7", "n": "", "vs": [[7, "أفلا ينصف الله مختاريه الذين يصرخون إليه نهارا وليلا؟ أما يسرع في الاستجابة لهم؟"]]}, {"l": "Act 26:7", "n": "", "vs": [[7, "ومازالت أسباط شعبنا الاثنا عشر تواظب على العبادة ليل نهار راجية تحقيقه. من أجل هذا الرجاء يتهمني اليهود، أيها الملك:"]]}, {"l": "Eph 6:18", "n": "", "vs": [[18, "كونوا مصلين في كل حال، بكل صلاة وطلبة في الروح، وساهرين لهذا الغرض عينه مواظبين تماما على جميع الطلبات لأجل القديسين جميعا،"]]}], "kwAr": "تداوم على الأدعية والصلوات", "noteAr": ""}], "arS": [["ولكن ", []], ["الأرملة", ["G5503"]], [" التي تعيش ", []], ["وحيدة", ["G3443"]], [" ولا ", []], ["معيل لها", ["G3689"]], ["، فقد ", []], ["وضعت رجاءها", ["G1679"]], [" في ", []], ["الله", ["G2316"]], [" وهي ", []], ["تداوم", ["G4357"]], [" على ", []], ["الأدعية", ["G1162"]], [" ", []], ["والصلوات", ["G4335"]], [" ", []], ["ليلا", ["G3571"]], [" ", []], ["ونهارا", ["G2250"]], [".", []]]}, {"c": 5, "v": 6, "text": "أما تلك التي تعيش منغمسة في اللذات، فقد ماتت، وإن كانت حية.", "groups": [{"kw": "she", "raw": "1Sa_25:6; Job_21:11-15; Psa_73:5-7; Isa_22:13; Amo_6:5, Amo_6:6; Luk_12:19; Luk_15:13, Luk_16:19; Jam_5:5; Rev_18:7", "note": "", "refs": [{"l": "1Sa 25:6", "n": "", "vs": [[6, "«أطال الله بقاءك، وجعلك أنت وبيتك وكل مالك سالما."]]}, {"l": "Job 21:11-15", "n": "", "vs": [[11, "يسرحون صبيانهم كسرب، وأطفالهم يرقصون."], [12, "يغنون بالدف والعود ويطربون لصوت المزمار،"], [13, "يقضون أيامهم في الرغد، ثم في لحظة يهبطون إلى الهاوية."], [14, "يقولون للرب: فارقنا فإننا لا نعبأ بمعرفة طرقك."], [15, "من هو القدير حتى نعبده؟ وأي كسب نجنيه إن صلينا إليه؟"]]}, {"l": "Psa 73:5-7", "n": "", "vs": [[5, "لا يقاسون من أتعاب البشر، ولا يعانون من المصائب كالناس."], [6, "لذلك لبسوا الكبرياء كقلادة، وارتدوا الظلم كثوب."], [7, "عيونهم جاحظة من كثرة شحم طمعهم. وشرهم تجاوز ما يتصوره القلب."]]}, {"l": "Isa 22:13", "n": "", "vs": [[13, "ولكنكم انهمكتم بالفرح والسرور وذبح الثيران وتضحية الغنم وأكل اللحم وشرب الخمر قائلين: «لنأكل ونشرب لأننا غدا نموت»."]]}, {"l": "Amo 6:5", "n": "", "vs": [[5, "المغنين على صوت الرباب، المخترعين لأنفسهم آلات غناء كداود."]]}, {"l": "Amo 6:6", "n": "", "vs": [[6, "الشاربين خمرا في كؤوس، المتطيبين بأفضل العطور، ولا يكتئبون على خراب يوسف."]]}, {"l": "Luk 12:19", "n": "", "vs": [[19, "وأقول لنفسي: يانفس، عندك خيرات كثيرة مخزونة لسنين عديدة، فاستريحي وكلي واشربي واطر بي!"]]}, {"l": "Luk 15:13", "n": "", "vs": [[13, "وبعد بضعة أيام، جمع الابن الأصغر كل ما عنده، ومضى إلى بلد بعيد. وهنالك بذر حصته من المال في عيشة الخلاعة."]]}, {"l": "Luk 16:19", "n": "", "vs": [[19, "كان هنالك إنسان غني، يلبس الأرجوان وناعم الثياب، ويقيم الولائم المترفة، متنعما كل يوم."]]}, {"l": "Jam 5:5", "n": "", "vs": [[5, "أنتم تعيشون على الأرض عيشة رفاهية وانصراف إلى المباهج واللذات؛ وقد أصبحت قلوبكم سمينة كأنها جاهزة ليوم الذبح."]]}, {"l": "Rev 18:7", "n": "", "vs": [[7, "أنزلوا بها من العذاب والشقاء على قدر ما عظمت نفسها وترفهت. فإنها تقول في نفسها: أنا ملكة على العرش، ولست أرملة، ولن أذوق طعم الحزن."]]}], "kwAr": "أما تلك", "noteAr": ""}, {"kw": "in pleasure", "raw": "or, delicately, Deu_28:54, Deu_28:56; 1Sa_15:32; Pro_29:21; Isa_47:1; Jer_6:2; Lam_4:5; Luk_7:25", "note": "or, delicately, Deu_28:54, Deu_28:56; 1Sa_15:32; Pro_29:21; Isa_47:1; Jer_6:2; Lam_4:5; Luk_7:25", "refs": [{"l": "Deu 28:54", "n": "", "vs": [[54, "فيقسو قلب أكثركم رقة ورأفة على أخيه وامرأته التي في حضنه وسائر أبنائه الأحياء."]]}, {"l": "Deu 28:56", "n": "", "vs": [[56, "وكذلك فإن أكثر النساء رقة ورأفة، والتي لنعومتها وترفهها لا تجرؤ على لمس الأرض بباطن قدمها، تبخل على زوجها رجل حضنها وعلى ابنها وابنتها"]]}, {"l": "1Sa 15:32", "n": "", "vs": [[32, "ثم قال صموئيل: «قدموا إلي أجاج ملك العمالقة». فأقبل إليه أجاج فرحا قائلا لنفسه: «حقا قد تلاشت مرارة الموت»."]]}, {"l": "Pro 29:21", "n": "", "vs": [[21, "من دلل عبده في حداثته، يتمرد في النهاية عليه."]]}, {"l": "Isa 47:1", "n": "", "vs": [[1, "انزلي واجلسي على التراب أيتها العذراء ابنة بابل. اجلسي على الأرض لا على العرش ياابنة الكلدانيين، لأنك لن تدعي من بعد الناعمة المترفهة."]]}, {"l": "Jer 6:2", "n": "", "vs": [[2, "ها أنا أهلك أورشليم الجميلة المترفة ابنة صهيون،"]]}, {"l": "Lam 4:5", "n": "", "vs": [[5, "هلك في الشوارع الذين كانوا يأكلون الطيبات، واحتضن المزابل المتربون على لبس الحرية."]]}, {"l": "Luk 7:25", "n": "", "vs": [[25, "بل ماذا خرجتم لتروا؟ أإنسانا يلبس ثيابا ناعمة؟ ها إن لابسي الثياب الفاخرة والمترفهين هم في قصور الملوك."]]}], "kwAr": "منغمسة في اللذات", "noteAr": "أو: بترف (بتنعّم)."}, {"kw": "dead", "raw": "Mat_8:22; Luk_15:24, Luk_15:32; 2Co_5:14, 2Co_5:15; Eph_2:1, Eph_2:5, Eph_5:14; Col_2:13; Rev_3:1", "note": "", "refs": [{"l": "Mat 8:22", "n": "", "vs": [[22, "فأجابه يسوع: «اتبعني الآن، ودع الموتى يدفنون موتاهم! »"]]}, {"l": "Luk 15:24", "n": "", "vs": [[24, "فإن ابني هذا كان ميتا فعاش، وكان ضائعا فوجد. فأخذوا يفرحون!"]]}, {"l": "Luk 15:32", "n": "", "vs": [[32, "ولكن كان من الصواب أن نفرح ونبتهج، لأن أخاك هذا كان ميتا فعاش، وكان ضالا فوجد!»"]]}, {"l": "2Co 5:14", "n": "", "vs": [[14, "فإن محبة المسيح تسيطر علينا، وقد حكمنا بهذا: مادام واحد قد مات عوضا عن الجميع، فمعنى ذلك أن الجميع ماتوا؛"]]}, {"l": "2Co 5:15", "n": "", "vs": [[15, "وهو قد مات عوضا عن الجميع حتى لا يعيش الأحياء في ما بعد لأنفسهم بل للذي مات عوضا عنهم ثم قام."]]}, {"l": "Eph 2:1", "n": "", "vs": [[1, "وأنتم كنتم في السابق أمواتا بذنوبكم وخطاياكم،"]]}, {"l": "Eph 2:5", "n": "", "vs": [[5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"]]}, {"l": "Eph 5:14", "n": "", "vs": [[14, "لأن الذي يكشف كل شيء هو النور. لذلك يقال: «استيقظ أيها النائم، وقم من بين الأموات، فيشرق عليك نور المسيح!»"]]}, {"l": "Col 2:13", "n": "", "vs": [[13, "فأنتم، إذ كنتم أمواتا في الخطايا وعدم ختانكم الجسدي، أحياكم جميعا معه؛ مسامحا لنا جميعا بالخطايا كلها."]]}, {"l": "Rev 3:1", "n": "", "vs": [[1, "واكتب إلى ملاك الكنيسة في ساردس: إليك ما يقوله من له أرواح الله السبعة والنجوم السبعة: إني عالم بأعمالك. فأنت حي بالاسم، ولكنك ميت فعلا."]]}], "kwAr": "فقد ماتت", "noteAr": ""}], "arS": [["أما تلك التي تعيش ", []], ["منغمسة في اللذات", ["G4684"]], ["، فقد ", []], ["ماتت", ["G2348"]], ["، وإن كانت ", []], ["حية", ["G2198"]], [".", []]]}, {"c": 5, "v": 7, "text": "وعليك أن توصي بهذه الأمور، لكي يكون الجميع بلا لوم.", "groups": [{"kw": "", "raw": "1Ti_1:3, 1Ti_4:11, 1Ti_6:17; 2Ti_4:1; Tit_1:13, Tit_2:15", "note": "", "refs": [{"l": "1Ti 1:3", "n": "", "vs": [[3, "كما أوصيتك لما كنت منطلقا إلى مقاطعة مقدونية، (أطلب إليك) أن تبقى في مدينة أفسس، لكي تمنع بعض المعلمين من نشر التعاليم المخالفة للتعليم الصحيح،"]]}, {"l": "1Ti 4:11", "n": "", "vs": [[11, "أوص بهذه الأمور وعلم!"]]}, {"l": "1Ti 6:17", "n": "", "vs": [[17, "أوص أغنياء هذا الزمان بأن لا يتكبروا، ولا يتكلوا على الغنى غير الثابت، بل على الله الذي يمنحنا كل شيء بوفرة لنتمتع به،"]]}, {"l": "2Ti 4:1", "n": "", "vs": [[1, "أطلب منك في حضرة الله والمسيح الذي سيدين الأحياء والأموات، بعودته العلنية وملكوته،"]]}, {"l": "Tit 1:13", "n": "", "vs": [[13, "وهذه شهادة صدق. لذلك كن متشددا في توبيخهم، ليكونوا أصحاء في الإيمان،"]]}, {"l": "Tit 2:15", "n": "", "vs": [[15, "بهذه الأمور تكلم، وعظ، ووبخ بكل سلطان، ولا تدع أحدا يستخف بك!"]]}], "kwAr": "", "noteAr": ""}], "arS": [["وعليك أن ", []], ["توصي", ["G3853"]], [" بهذه ", []], ["الأمور", ["G5023"]], ["، لكي يكون الجميع ", []], ["بلا لوم", ["G423"]], [".", []]]}, {"c": 5, "v": 8, "text": "فإذا كان أحد لا يهتم بذويه، وبخاصة بأهل بيته، فقد أنكر الإيمان، وهو أسوأ من غير المؤمن.", "groups": [{"kw": "and specially", "raw": "Gen_30:30; Isa_58:7; Mat_7:11; Luk_11:11-13; 2Co_12:14; Gal_6:10", "note": "", "refs": [{"l": "Gen 30:30", "n": "", "vs": [[30, "فالقليل الذي كان لك قبل مجيئي ازداد أضعافا كثيرة، فباركك الرب منذ أن قدمت عليك، والآن متى أشرع في تحصيل رزق عائلتي؟»"]]}, {"l": "Isa 58:7", "n": "", "vs": [[7, "ألا يكون في مشاطرة خبزك مع الجائع، وإيواء الفقير المتشرد في بيتك. وكسوة العريان الذي تلتقيه، وعدم التغاضي عن قريبك البائس؟"]]}, {"l": "Mat 7:11", "n": "", "vs": [[11, "فإن كنتم وأنتم أشرار، تعرفون أن تعطوا أولادكم عطايا جيدة، فكم بالأحرى جدا يعطي أبوكم السماوي عطايا جيدة للذين يطلبون منه؟"]]}, {"l": "Luk 11:11-13", "n": "", "vs": [[11, "فأي أب منكم يطلب منه ابنه خبزا فيعطيه حجرا؟ أو يطلب سمكة فيعطيه بدل السمكة حية؟"], [12, "أو يطلب بيضة، فيعطيه عقربا؟"], [13, "فإن كنتم، أنتم الأشرار، تعرفون أن تعطوا أولادكم عطايا جيدة، فكم بالأحرى الآب، الذي من السماء يهب الروح القدس لمن يسألونه؟ »"]]}, {"l": "2Co 12:14", "n": "", "vs": [[14, "أنا مستعد الآن أن آتي إليكم مرة ثالثة، ولن أكون عبئا ثقيلا عليكم. فما أسعى إليه ليس هو ما عندكم بل هو أنتم: لأنه ليس على الأولاد أن يوفروا لوالديهم، بل على الوالدين أن يوفروا لأولادهم."]]}, {"l": "Gal 6:10", "n": "", "vs": [[10, "فمادامت لنا الفرصة إذن، فلنعمل الخير للجميع، وخصوصا لأهل الإيمان."]]}], "kwAr": "وبخاصة", "noteAr": ""}, {"kw": "house", "raw": "or, kindred, 1Ti_5:4", "note": "or, kindred, 1Ti_5:4", "refs": [{"l": "1Ti 5:4", "n": "", "vs": [[4, "فإن كان للأرملة أولاد أو حفدة، فمن أول واجبات هؤلاء أن يتعلموا توقير أهلهم وأن يفوا حق والديهم. فإن هذا العمل مقبول في نظر الله."]]}], "kwAr": "بأهل بيته", "noteAr": "أو: أقرباء."}, {"kw": "he hath", "raw": "2Ti_3:5; Tit_1:16; Rev_2:13, Rev_3:8", "note": "", "refs": [{"l": "2Ti 3:5", "n": "", "vs": [[5, "لهم من التقوى مظهرها ولكنهم لقوتها منكرون، فعن هؤلاء الناس ابتعد!"]]}, {"l": "Tit 1:16", "n": "", "vs": [[16, "يشهدون معترفين بأنهم يعرفون الله ، ولكنهم بأعمالهم ينكرونه، لأنهم مكروهون وغير طائعين، وقد تبين أنهم غير أهل لكل عمل صالح."]]}, {"l": "Rev 2:13", "n": "", "vs": [[13, "إني أعلم أين تسكن، حيث عرش الشيطان! ورغم ذلك تمسكت باسمي، ورفضت أن تنكر الإيمان بي، حتى في أيام أنتيباس شهيدي الأمين، الذي قتل عندكم حيث يسكن الشيطان!"]]}, {"l": "Rev 3:8", "n": "", "vs": [[8, "إني عالم بأعمالك. فمع أن لك قوة ضئيلة، فقد أطعت كلمتي ولم تنكر اسمي، ولذلك فتحت لك بابا لا يقدر أحد أن يغلقه."]]}], "kwAr": "فقد أنكر الإيمان", "noteAr": ""}, {"kw": "and is", "raw": "Mat_18:17; Luk_12:47, Luk_12:48; Joh_15:22; 2Co_2:15, 2Co_2:16, 2Co_6:15", "note": "", "refs": [{"l": "Mat 18:17", "n": "", "vs": [[17, "فإذا لم يسمع لهما، فاعرض الأمر على الكنيسة. فإذا لم يسمع للكنيسة أيضا، فليكن عندك كالوثني وجابي الضرائب."]]}, {"l": "Luk 12:47", "n": "", "vs": [[47, "وأما ذلك العبد الذي يعمل بإرادة سيده، فإنه سيضرب كثيرا."]]}, {"l": "Luk 12:48", "n": "", "vs": [[48, "ولكن الذي لا يعلمها ويعمل ما يستوجب الضرب، فإنه سيضرب قليلا. فكل من أعطي كثيرا، يطلب منه كثير؛ ومن أودع كثيرا، يطالب بأكثر."]]}, {"l": "Joh 15:22", "n": : [[22, "فأجابوه: «قائد المئة كرنيليوس رجل صالح يتقي الله ، ويشهد له بذلك شعب اليهود جميعا. وقد أوحى الله إليه بواسطة ملاك طاهر أن يستدعيك إلى بيته ليسمع ما عندك من كلام»."]]}, {"l": "Act 22:12", "n": "", "vs": [[12, "وكان في دمشق رجل اسمه حنانيا، تقي كما تقضي الشريعة، يشهد له يهود دمشق جميعا شهادة حسنة."]]}, {"l": "3Jo 1:12", "n": "", "vs": [[12, "أما ديمتريوس، فالجميع يشهدون له شهادة طيبة. حتى الحق نفسه يشهد له. ونحن أيضا نشهد له. وأنتم تثقون بصدق ما نشهد به."]]}], "kwAr": "مشهودا لها", "noteAr": ""}, {"kw": "good", "raw": "1Ti_5:25, 1Ti_2:10, 1Ti_6:18; Mat_5:16; Act_9:36; Eph_2:10; 2Ti_3:17; Tit_2:7, Tit_3:8; Tit_3:14; Heb_10:24, Heb_13:21; 1Pe_2:12", "note": "", "refs": [{"l": "1Ti 5:25", "n": "", "vs": [[25, "وقياسا على ذلك، فإن الأعمال الصالحة تكون واضحة مسبقا؛ والأعمال التي ليست بصالحة، لا يمكن أن تظل مخفية."]]}, {"l": "1Ti 2:10", "n": "", "vs": [[10, "بل بما يليق بنساء يعترفن علنا بأنهن يعشن في تقوى الله، بالأعمال الصالحة!"]]}, {"l": "1Ti 6:18", "n": "", "vs": [[18, "وأن يفعلوا خيرا، ويكونوا أغنياء بالأعمال الصالحة، ويوزعوا بسخاء، ويكونوا على استعداد دائم لإشراك الآخرين في خيراتهم."]]}, {"l": "Mat 5:16", "n": "", "vs": [[16, "هكذا، فليضيء نوركم أمام الناس، ليروا أعمالكم الحسنة ويمجدوا أباكم الذي في السماوات."]]}, {"l": "Act 9:36", "n": "", "vs": [[36, "وكان في مدينة يافا تلميذة اسمها طابيثا، ومعنى اسمها: غزالة، كان يشغلها دائما فعل الخير ومساعدة الفقراء."]]}, {"l": "Eph 2:10", "n": "", "vs": [[10, "فإننا نحن تحفة الله، وقد خلقنا في المسيح يسوع لأعمال صالحة أعدها سلفا لنسلك فيها."]]}, {"l": "2Ti 3:17", "n": "", "vs": [[17, "لكي يجعل إنسان الله مؤهلا تأهيلا كاملا، ومجهزا لكل عمل صالح."]]}, {"l": "Tit 2:7", "n": "", "vs": [[7, "جاعلا من نفسك في كل شيء قدوة للأعمال الصالحة، مظهرا في تعليمك النقاوة والوقار"]]}, {"l": "Tit 3:8", "n": "", "vs": [[8, "صادق هذا القول! وأريد أن تقرر هذه الأمور قرارا حاسما، حتى يهتم الذين آمنوا بالله بأن يجتهدوا في الأعمال الصالحة. هذه الأمور حسنة ونافعة للناس."]]}, {"l": "Tit 3:14", "n": "", "vs": [[14, "وليتعلم ذوونا أيضا أن يمارسوا أعمالا حسنة، لسد الحاجات الضرورية، لكي لا يكونوا عديمي الثمر."]]}, {"l": "Heb 10:24", "n": "", "vs": [[24, "وعلى كل واحد منا أن ينتبه للآخرين، لنحث بعضنا بعضا على المحبة والأعمال الصالحة."]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}, {"l": "1Pe 2:12", "n": "", "vs": [[12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالحة يمجدون الله في يوم الافتقاد."]]}], "kwAr": "بالأعمال الصالحة", "noteAr": ""}, {"kw": "if she have brought", "raw": "2Ti_1:5, 2Ti_3:15", "note": "", "refs": [{"l": "2Ti 1:5", "n": "", "vs": [[5, "كما أستذكر إيمانك الخالي من الرياء، هذا الإيمان الذي فيك والذي حل أولا في جدتك لوئيس ثم في أمك أفنيكي، وأنا متأكد أنه حال فيك أيضا."]]}, {"l": "2Ti 3:15", "n": "", "vs": [[15, "وتعلم أنك منذ حداثة سنك تعرف الكتب المقدسة، وهي القادرة أن تجعلك حكيما لبلوغ الخلاص عن طريق الإيمان في المسيح يسوع."]]}], "kwAr": "ربت الأولاد", "noteAr": ""}, {"kw": "if she have lodged", "raw": "Act_16:14, Act_16:15; Rom_12:13; Heb_13:2; 1Pe_4:9", "note": "", "refs": [{"l": "Act 16:14", "n": "", "vs": [[14, "ومن بينهن تاجرة أرجوان من مدينة ثياتيرا، متعبدة لله، اسمها ليدية، كانت تسمع ففتح الله قلبها لتقبل كلام بولس."]]}, {"l": "Act 16:15", "n": "", "vs": [[15, "فلما تعمدت هي وأهل بيتها، دعتنا بإلحاح لقبول ضيافتها قائلة: «إن كنتم قد حكمتم أني مؤمنة بالرب، فانزلوا ضيوفا ببيتي». فاضطرتنا إلى قبول دعوتها."]]}, {"l": "Rom 12:13", "n": "", "vs": [[13, "متعاونين على سد حاجات القديسين، مداومين على إضافة الغرباء."]]}, {"l": "Heb 13:2", "n": "", "vs": [[2, "ولا تغفلوا عن ضيافة الغرباء، فبها أضاف بعض القدماء ملائكة دون أن يعرفوا."]]}, {"l": "1Pe 4:9", "n": "", "vs": [[9, "ومارسوا الضيافة بعضكم نحو بعض بلا تذمر."]]}], "kwAr": "وأضافت الغرباء", "noteAr": ""}, {"kw": "washed", "raw": "Gen_18:4, Gen_19:2, Gen_24:32; Luk_7:38, Luk_7:44; Joh_13:5-15", "note": "", "refs": [{"l": "Gen 18:4", "n": "", "vs": [[4, "بل دعني أقدم لكم بعض ماء تغسلون به أرجلكم وتتكئون تحت الشجرة،"]]}, {"l": "Gen 19:2", "n": "", "vs": [[2, "وقال: «ياسيدي، انزلا في بيت عبدكما لتقضيا ليلتكما، واغسلا أرجلكما، وفي الصباح الباكر تمضيان في طريقكما». لكنهما قالا: «لا، بل نمكث الليلة في الساحة»."]]}, {"l": "Gen 24:32", "n": "", "vs": [[32, "فدخل الرجل إلى المنزل، وحل عن الجمال، وقدم لها تبنا وعلفا، وأتى لابان بماء لغسل رجليه وأرجل مرافقيه."]]}, {"l": "Luk 7:38", "n": "", "vs": [[38, "ووقفت من ورائه عند قدميه باكية، وأخذت تبل قدميه بالدموع وتمسحهما بشعر رأسها، وتقبل قدميه بحرارة وتدهنهما بالعطر."]]}, {"l": "Luk 7:44", "n": "", "vs": [[44, "ثم التفت إلى المرأة، وقال لسمعان: «أترى هذه المرأة؟ إني دخلت بيتك ولم تقدم لي ماء لغسل قدمي! أما هي، فقد غسلت قدمي بالدموع ومسحتهما بشعرها."]]}, {"l": "Joh 13:5-15", "n": "", "vs": [[5, "ثم صب ماء في وعاء للغسل، وبدأ يغسل أقدام التلاميذ ويمسحها بالمنشفة التي على وسطه."], [6, "فلما وصل إلى سمعان بطرس، قال له سمعان: «ياسيد، أنت تغسل قدمي!»"], [7, "فأجابه يسوع: «أنت الآن لا تفهم ما أعمله، ولكنك ستفهم فيما بعد»."], [8, "ولكن بطرس أصر قائلا: «لا، لن تغسل قدمي أبدا!» فأجابه يسوع: «إن كنت لا أغسلك، فلا يكون لك نصيب معي!»"], [9, "عندئذ قال له سمعان بطرس: «ياسيد، لا قدمي فقط، بل يدي ورأسي أيضا!»"], [10, "فقال يسوع: «من اغتسل صار كله نقيا، ولا يحتاج إلا لغسل قدميه. وأنتم أنقياء، ولكن ليس كلكم»."], [11, "فإن يسوع كان يعلم من الذي سيخونه، ولذلك قال: «لستم كلكم أنقياء»."], [12, "وبعدما انتهى من غسل أقدامهم، أخذ رداءه واتكأ من جديد، وسألهم: «أفهمتم ما عملته لكم؟"], [13, "أنتم تدعونني معلما وسيدا، وقد صدقتم، فأنا كذلك."], [14, "فإن كنت، وأنا السيد والمعلم، قد غسلت أقدامكم، فعليكم أنتم أيضا أن يغسل بعضكم أقدام بعض."], [15, "فقد قدمت لكم مثالا لكي تعملوا مثل ما عملت أنا لكم."]]}], "kwAr": "وغسلت أقدام القديسين", "noteAr": ""}, {"kw": "if she have relieved", "raw": "Lev_25:35; Isa_1:17; Act_9:39", "note": "", "refs": [{"l": "Lev 25:35", "n": "", "vs": [[35, "وإذا افتقر أخوك وعجز عن إعالة نفسه في وسطك، فأعنه، سواء كان غريبا أو مواطنا، ليتمكن من العيش معك."]]}, {"l": "Isa 1:17", "n": "", "vs": [[17, د حدثت، ويهدمان إيمان بعض الناس."]]}, {"l": "2Ti 4:10", "n": "", "vs": [[10, "لأن ديماس، إذ أحب الحياة الحاضرة، تركني وذهب إلى مدينة تسالونيكي. أما كريسكيس، فقد ذهب إلى مقاطعة غلاطية، وتيطس إلى دلماطية"]]}, {"l": "2Pe 2:2", "n": "", "vs": [[2, "وكثيرون سيسيرون وراءهم في طرق الإباحية. وبسببهم توجه الإهانة إلى طريق الحق."]]}, {"l": "2Pe 2:20-22", "n": "", "vs": [[20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."], [21, "وبالحقيقة، كان أفضل لهم لو أنهم لم يتعرفوا بطريق البر، من أن يتعرفوا به ثم يرتدوا عن الوصية المقدسة التي تسلموها."], [22, "وينطبق على هؤلاء ما يقوله المثل الصادق: «عاد الكلب إلى تناول ما تقيأه، والخنزيرة المغتسلة إلى التمرغ في الوحل!»"]]}, {"l": "2Pe 3:16", "n": "", "vs": [[16, "وما كتبه في رسالته إليكم، يوافق ما كتبه في باقي رسائله. وفي تلك الرسائل كلها أمور صعبة الفهم، يحرفها الجهال وغير الراسخين في الحق، كما يحرفون غيرها أيضا من الكتابات الموحى بها، فيجلبون الهلاك على أنفسهم."]]}, {"l": "1Jo 2:19", "n": "", "vs": [[19, "هؤلاء الدجالون انفصلوا عنا، لكنهم في الواقع لم يكونوا منا. ولو كانوا منا لظلوا معنا. فانفصالهم عنا إذن برهان على أنهم جميعا ليسوا منا."]]}, {"l": "Jud 1:4", "n": "", "vs": [[4, "لأنه قد تسلل إلى ما بينكم معلمون لابد أن يلاقوا الحكم بالعقاب الأبدي، كما هو مكتوب لهم منذ القديم. فهم أشرار لا يهابون الله ، يتخذون من نعمة إلهنا فرصة لإباحة الرذائل، وينكرون سيدنا وربنا الوحيد يسوع المسيح."]]}, {"l": "Jud 1:5", "n": "", "vs": [[5, "فالآن، أريد أن أذكركم بأمور تعرفونها. فأنتم تعرفون أن الرب، بعدما أنقذ الشعب من مصر، عاد فأهلك الذين لم يؤمنوا من ذلك الشعب."]]}, {"l": "Rev 12:9", "n": "", "vs": [[9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."]]}], "kwAr": "", "noteAr": ""}], "arS": [["ذلك لأن ", []], ["بعضا", ["G5100"]], [" منهن قد ", []], ["انحرفن", ["G1624"]], [" ", []], ["وراء", ["G3694"]], [" ", []], ["الشيطان", ["G4567"]], [" ", []], ["فعلا", ["G2235"]], [".", []]]}, {"c": 5, "v": 16, "text": "وإن كان لأحد المؤمنين أو المؤمنات أرامل من ذويه، فعليه أن يعينهن حتى لا تتحمل الكنيسة الأعباء، فتتفرغ لإعانة الأرامل المحتاجات حقا.", "groups": [{"kw": "let them", "raw": "1Ti_5:4, 1Ti_5:8", "note": "", "refs": [{"l": "1Ti 5:4", "n": "", "vs": [[4, "فإن كان للأرملة أولاد أو حفدة، فمن أول واجبات هؤلاء أن يتعلموا توقير أهلهم وأن يفوا حق والديهم. فإن هذا العمل مقبول في نظر الله."]]}, {"l": "1Ti 5:8", "n": "", "vs": [[8, "فإذا كان أحد لا يهتم بذويه، وبخاصة بأهل بيته، فقد أنكر الإيمان، وهو أسوأ من غير المؤمن."]]}], "kwAr": "فعليه أن يعينهن", "noteAr": ""}, {"kw": "widows indeed", "raw": "1Ti_5:3, 1Ti_5:5", "note": "", "refs": [{"l": "1Ti 5:3", "n": "", "vs": [[3, "أكرم الأرامل اللواتي لا معيل لهن."]]}, {"l": "1Ti 5:5", "n": "", "vs": [[5, "ولكن الأرملة التي تعيش وحيدة ولا معيل لها، فقد وضعت رجاءها في الله وهي تداوم على الأدعية والصلوات ليلا ونهارا."]]}], "kwAr": "الأرامل المحتاجات حقا", "noteAr": ""}], "arS": [["وإن كان لأحد ", []], ["المؤمنين", ["G4103"]], [" أو ", []], ["المؤمنات", ["G4103"]], [" ", []], ["أرامل", ["G5503"]], [" من ذويه، فعليه أن ", []], ["يعينهن", ["G1884"]], [" حتى لا ", []], ["تتحمل", ["G916"]], [" ", []], ["الكنيسة", ["G1577"]], [" الأعباء، فتتفرغ ", []], ["لإعانة", ["G1884"]], [" ", []], ["الأرامل", ["G5503"]], [" المحتاجات ", []], ["حقا", ["G3689"]], [".", []]]}, {"c": 5, "v": 17, "text": "أما الشيوخ الذين يحسنون القيادة، فليعتبروا أهلا للإكرام المضاعف، وبخاصة الذين يبذلون الجهد في نشر الكلمة وفي التعليم.", "groups": [{"kw": "the elders", "raw": "1Ti_5:1", "note": "", "refs": [{"l": "1Ti 5:1", "n": "", "vs": [[1, "لا توبخ شيخا توبيخا قاسيا، بل عظه كأنه أب لك. وعامل الشبان كأنهم إخوة لك؛"]]}], "kwAr": "الشيوخ", "noteAr": ""}, {"kw": "rule", "raw": "1Ti_3:5; Mat_24:25; Luk_12:42; Rom_12:8; 1Th_5:12, 1Th_5:13; Heb_13:7, Heb_13:17, Heb_13:24", "note": "", "refs": [{"l": "1Ti 3:5", "n": "", "vs": [[5, "فإن كان أحد لا يحسن تدبير بيته، فكيف يعتني بكنيسة الله؟"]]}, {"l": "Mat 24:25", "n": "", "vs": [[25, "ها أنا قد أخبرتكم بالأمر قبل حدوثه."]]}, {"l": "Luk 12:42", "n": "", "vs": [[42, "فقال الرب: «من هو إذن الوكيل الأمين العاقل الذي يقيمه سيده على أهل بيته ليقدم لهم حصتهم من الطعام في حينها؟"]]}, {"l": "Rom 12:8", "n": "", "vs": [[8, "أو الوعظ، ففي الوعظ؛ أو العطاء، فليعط بسخاء؛ أو القيادة، فليقد باجتهاد؛ أو إظهار الرحمة، فليرحم بسرور."]]}, {"l": "1Th 5:12", "n": "", "vs": [[12, "على أننا نرجو منكم، أيها الإخوة، أن تميزوا أولئك الذين يجتهدون بينكم، ويرعونكم كما يريد الرب، ويعظونكم،"]]}, {"l": "1Th 5:13", "n": "", "vs": [[13, "وأن تقدروهم تقديرا فائقا في المحبة، من أجل عملهم. عيشوا بسلام بعضكم مع بعض."]]}, {"l": "Heb 13:7", "n": "", "vs": [[7, "اذكروا دائما مرشديكم الذين علموكم كلام الله. تأملوا سيرتهم حتى النهاية، واقتدوا بإيمانهم."]]}, {"l": "Heb 13:17", "n": "", "vs": [[17, "أطيعوا مرشديكم، واخضعوا لهم، لأنهم يسهرون على مصلحتكم الروحية، كما يسهر الذي يحمل مسئولية سوف يقدم حسابا عن قيامه بها. وعندئذ، يؤدون مهمتهم بفرح دون تذمر. فلن يكون في تذمرهم نفع لكم!"]]}, {"l": "Heb 13:24", "n": "", "vs": [[24, "سلموا على جميع مرشديكم، وعلى القديسين جميعا."]]}], "kwAr": "يحسنون القيادة", "noteAr": ""}, {"kw": "be", "raw": "1Ti_5:3; Act_28:10; Rom_15:27; 1Co_9:5-14; Gal_6:6; Phi_2:29", "note": "", "refs": [{"l": "1Ti 5:3", "n": "", "vs": [[3, "أكرم الأرامل اللواتي لا معيل لهن."]]}, {"l": "Act 28:10", "n": "", "vs": [[10, "فأعطونا هدايا كثيرة، وزودونا عند رحيلنا بما نحتاج إليه في سفرنا."]]}, {"l": "Rom 15:27", "n": "", "vs": [[27, "حسن لديهم ذلك، وهم في دين لأولئك القديسين: فإذا كان الأمم قد اشتركوا في ما هو روحي عند أولئك، فعليهم أيضا أن يخدموهم في ما هو مادي."]]}, {"l": "1Co 9:5-14", "n": "", "vs": [[5, "أليس لنا حق أن نتخذ إحدى الأخوات زوجة ترافقنا، كما يفعل الرسل الآخرون وإخوة الرب، وبطرس؟"], [6, "أم أنا وبرنابا وحدنا لا حق لنا أن ننقطع عن العمل؟"], [7, "أي جندي يذهب إلى الحرب على نفقته الخاصة؟ وأي مزارع يغرس كرما ولا يأكل من ثماره؟ أم أي راع يرعى قطيعا ولا يأكل من لبن القطيع؟"], [8, "أتظنون أني أتكلم بهذا بمنطق البشر؟ أو ما توصي الشريعة به؟"], [9, "فإنه مكتوب في شريعة موسى: «لا تضع كمامة على فم الثور وهو يدرس الحنطة». ترى، هل تهم الله الثيران،"], [10, "أم يقول ذلك كله من أجلنا؟ نعم، فمن أجلنا قد كتب ذلك، لأنه من حق الفلاح أن يفلح برجاء، والدراس أن يدرس برجاء، على أمل الاشتراك في الغلة."], [11, "وما دمنا نحن قد زرعنا لكم الأمور الروحية، فهل يكون كثيرا علينا أن نحصد منكم الأمور المادية؟"], [12, "إن كان لغيرنا هذا الحق عليكم، أفلا نكون نحن أحق؟ ولكننا لم نستعمل هذا الحق؟ بل نتحمل كل شيء، مخافة أن نضع أي عائق أمام إنجيل المسيح !"], [13, "أما تعلمون أن الذين يشتغلون بالمقدسات كانوا يأكلون مما يقدم إلى الهيكل، وأن الذين يقومون بخدمة المذبح، كانوا يشتركون في خيرات المذبح؟"], [14, "هكذا أيضا رسم الرب للذين يبشرون بالإنجيل أن يعيشوا من الإنجيل."]]}, {"l": "Gal 6:6", "n": "", "vs": [[6, "ليشارك الذي يتعلم الكلمة من يعلمها، في جميع الخيرات."]]}, {"l": "Phi 2:29", "n": "", "vs": [[29, "فاقبلوه إذن في الرب بكل فرح، وعاملوا أمثاله بالإكرام."]]}], "kwAr": "فليعتبروا أهلا", "noteAr": ""}, {"kw": "double", "raw": "2Ki_2:9; Isa_40:2; Jer_16:18, Jer_17:18; Zec_9:12", "note": "", "refs": [{"l": "2Ki 2:9", "n": "", "vs": [[9, "ولما عبرا قال إيليا لأليشع: «اطلب ماذا أصنع لك قبل أن أوخذ منك؟» فأجاب أليشع: «ليحل علي ضعف ما لديك من قوة روحية»."]]}, {"l": "Isa 40:2", "n": "", "vs": [[2, "طيبوا خاطر أورشليم وبلغوها أن أيام محنتها قد انتهت، وإثمها قد غفر، وتلقت من يد الرب ضعفين عن جميع ما ارتكبته من خطايا»."]]}, {"l": "Jer 16:18", "n": "", "vs": [[18, "فأعاقبهم عقابا مضاعفا على إثمهم، لأنهم دنسوا أرضي بجثث أصنامهم، وملأوا ميراثي بنجاساتهم»."]]}, {"l": "Jer 17:18", "n": "", "vs": [[18, "ليلحق الخزي بمضطهدي، ولكن احفظني من العار. ليرتعبوا هم، أما أنا فلا تدعني أرتعب. اجعل يوم الشر يحل بهم، واسحقهم سحقا مضاعفا."]]}, {"l": "Zec 9:12", "n": "", "vs": [[12, "ارجعوا إلى الحصن ياأسرى الرجاء، فأنا أعلن اليوم أني أضاعف لكم الأجر لقاء ما عانيتم من ويلات."]]}], "kwAr": "للإكرام المضاعف", "noteAr": ""}, {"kw": "labour", "raw": "1Ti_4:10; Mat_9:37, Mat_9:38; Luk_10:1, Luk_10:2, Luk_10:7; Joh_4:38; Act_20:35; Rom_16:12; 1Co_3:9, 1Co_15:10, 1Co_16:16; 2Co_6:1; Phi_2:16, Phi_4:3; 2Ti_2:6", "note": "", "re  أيها الزميل المخلص، أن تساعدهما، لأنهما جاهدتا معي في خدمة الإنجيل، هما وأكليمندس ومعاوني الآخرون، المكتوبة أسماؤهم في سجل الحياة."]]}, {"l": "2Ti 2:6", "n": "", "vs": [[6, "كذلك الفلاح الذي يشتغل بجد يجب أن يكون أول من ينال حصته من الغلة."]]}], "kwAr": "يبذلون الجهد", "noteAr": ""}, {"kw": "word", "raw": "1Ti_4:6, 1Ti_4:16; 2Ti_4:2", "note": "", "refs": [{"l": "1Ti 4:6", "n": "", "vs": [[6, "إن بسطت هذه الأمور أمام الإخوة، كنت خادما صالحا للمسيح يسوع، متغذيا بكلام الإيمان والتعليم الصالح الذي اتبعته تماما."]]}, {"l": "1Ti 4:16", "n": "", "vs": [[16, "انتبه جيدا لنفسك وللتعليم. فإنك إذ تواظب على ذلك، تنقذ نفسك وسامعيك أيضا."]]}, {"l": "2Ti 4:2", "n": "", "vs": [[2, "أن تنادي بالكلمة منشغلا بها كليا، في الفرص المناسبة وغير المناسبة على السواء، وأن توبخ وتنذر وتشجع بكل صبر في التعليم."]]}], "kwAr": "الكلمة", "noteAr": ""}], "arS": [["أما ", []], ["الشيوخ", ["G4245"]], [" الذين ", []], ["يحسنون", ["G2573"]], [" ", []], ["القيادة", ["G4291"]], ["، ", []], ["فليعتبروا أهلا", ["G515"]], [" ", []], ["للإكرام", ["G5092"]], [" ", []], ["المضاعف", ["G1362"]], ["، ", []], ["وبخاصة", ["G3122"]], [" الذين ", []], ["يبذلون الجهد", ["G2872"]], [" في نشر ", []], ["الكلمة", ["G3056"]], [" وفي ", []], ["التعليم", ["G1319"]], [".", []]]}, {"c": 5, "v": 18, "text": "لأن الكتاب يقول: «لا تضع كمامة على فم الثور وهو يدرس الحبوب»، وأيضا: ¢العامل يستحق أجرته¢.", "groups": [{"kw": "the scripture", "raw": "Rom_4:3, Rom_9:17, Rom_10:11, Rom_11:2; Gal_3:8; Jam_4:5", "note": "", "refs": [{"l": "Rom 4:3", "n": "", "vs": [[3, "لأنه ماذا يقول الكتاب؟ «فآمن إبراهيم بالله، فحسب له ذلك برا»."]]}, {"l": "Rom 9:17", "n": "", "vs": [[17, "فإن الله يقول لفرعون في الكتاب: «لهذا الأمر بعينه أقمتك: لأظهر فيك قدرتي ويعلن اسمي في الأرض كلها»."]]}, {"l": "Rom 10:11", "n": "", "vs": [[11, "لأن الكتاب يقول: «كل من هو مؤمن به، لا يخيب»."]]}, {"l": "Rom 11:2", "n": "", "vs": [[2, "إن الله لم يرفض شعبه الذي كان قد اختاره. أما تعلمون ما يقوله الكتاب في أمر إيليا لما رفع إلى الله شكوى على إسرائيل قائلا:"]]}, {"l": "G تطبيق شريعتي»."]]}, {"l": "Jam 2:1-4", "n": "", "vs": [[1, "ياإخوتي، نظرا لإيمانكم بربنا يسوع المسيح، رب المجد، لا تعاملوا الناس بالانحياز والتمييز!"], [2, "لنفرض أن إنسانين دخلا مجمعكم، أحدهما غني يلبس ثيابا فاخرة ويزين أصابعه بخواتم من ذهب، والآخر فقير يلبس ثيابا رثة."], [3, "فإن رحبتم بالغني قائلين: «تفضل، اجلس هنا في الصدر!» ثم قلتم للفقير: «وأنت، قف هناك، أو اقعد على الأرض عند أقدامنا!»"], [4, "فإن ذلك يؤكد أنكم تميزون بين الناس بحسب طبقاتهم، جاعلين من أنفسكم قضاة ذوي أفكار سيئة!"]]}, {"l": "Jam 3:17", "n": "", "vs": [[17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}], "kwAr": "بتحيز", "noteAr": ""}], "arS": [["أطلب", ["G1263"]], [" منك ", []], ["أمام", ["G1799"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["والمسيح", ["G5547"]], [" ", []], ["والملائكة", ["G32"]], [" ", []], ["المختارين", ["G1588"]], [" أن ", []], ["تعمل", ["G5442"]], [" بهذه ", []], ["التوصيات", ["G5023"]], [" دون ", []], ["مراعاة أشخاص", ["G4299"]], ["، فلا ", []], ["تعمل", ["G4160"]], [" ", []], ["شيئا", ["G3367"]], [" ", []], ["بتحيز", ["G4346"]], [".", []]]}, {"c": 5, "v": 22, "text": "لا تتسرع في وضع يدك على أحد. ولا تشترك في خطايا الآخرين. واحفظ نفسك طاهرا.", "groups": [{"kw": "Lay", "raw": "1Ti_4:14; Act_6:6, Act_13:3; 2Ti_1:6; Heb_6:2", "note": "", "refs": [{"l": "1Ti 4:14", "n": "", "vs": [[14, "لا تهمل الموهبة الخاصة التي فيك والتي أعطيت لك بالتنبوء ووضع الشيوخ أيديهم عليك."]]}, {"l": "Act 6:6", "n": "", "vs": [[6, "وقدموهم للرسل، فصلوا ووضعوا أيديهم عليهم."]]}, {"l": "Act 13:3", "n": "", "vs": [[3, "فبعدما صاموا وصلوا ووضعوا عليهما أيديهم أطلقوهما."]]}, {"l": "2Ti 1:6", "n": "", "vs": [[6, "لهذا السبب أنبهك أن تلهب نار موهبة الله التي فيك بوضع يدي عليك."]]}, {"l": "Heb 6:2", "n": "", "vs": [[2, "والنظم المختصة بطقوس الاغتسال، ووضع الأيدي، وقيامة الأموات، والدينونة الأبدية."]]}], "kwAr": "وضع يدك", "noteAr": ""}, {"kw": "suddenly", "r  كان منه إلا أن نفض ثوبه وقال لهم: «دمكم على رؤوسكم. أنا بريء! ومنذ الآن أتوجه لتبشير غير اليهود»."]]}, {"l": "Act 20:26", "n": "", "vs": [[26, "لذلك أشهد لكم اليوم أني بريء من دمكم جميعا،"]]}], "kwAr": "واحفظ نفسك طاهرا", "noteAr": ""}], "arS": [["لا ", []], ["تتسرع", ["G5030"]], [" في ", []], ["وضع", ["G2007"]], [" ", []], ["يدك", ["G5495"]], [" على ", []], ["أحد", ["G3367"]], [". ولا ", []], ["تشترك", ["G2841"]], [" في ", []], ["خطايا", ["G266"]], [" ", []], ["الآخرين", ["G245"]], [". ", []], ["واحفظ", ["G5083"]], [" ", []], ["نفسك", ["G4572"]], [" ", []], ["طاهرا", ["G53"]], [".", []]]}, {"c": 5, "v": 23, "text": "لا تشرب الماء فقط بعد الآن. وإنما خذ قليلا من الخمر مداويا معدتك وأمراضك التي تعاودك كثيرا.", "groups": [{"kw": "", "raw": "1Ti_3:3, 1Ti_4:4; Lev_10:9-11; Psa_104:15; Pro_31:4-7; Eze_44:21; Eph_5:18; Tit_1:7, Tit_2:3", "note": "", "refs": [{"l": "1Ti 3:3", "n": "", "vs": [[3, "لا مدمنا للخمر ولا عنيفا؛ بل لطيفا، غير متعود الخصام، غير مولع بالمال،"]]}, {"l": "1Ti 4:4", "n": "", "vs": [[4, "فإن كل ما خلقه الله جيد، ولا شيء منه يرفض إذا تناوله الإنسان شاكرا؛"]]}, {"l": "Lev 10:9-11", "n": "", "vs": [[9, "«لا تشرب أنت وأبناؤك خمرا مسكرا عند دخولكم لخدمتي في خيمة الاجتماع، لئلا تموتوا، وتكون هذه عليكم فريضة أبدية جيلا بعد جيل،"], [10, "لتميزوا بين المقدس والمحلل، النجس والطاهر،"], [11, "ولتعلموا شعب إسرائيل جميع الفرائض التي أمرت بها على لسان موسى»."]]}, {"l": "Psa 104:15", "n": "", "vs": [[15, "وخمر تفرح قلب الإنسان وتورد وجهه فيلمع كبريق الزيت، وخبز يسند قلبه."]]}, {"l": "Pro 31:4-7", "n": "", "vs": [[4, "ليس للملوك يالموئيل، ليس للملوك أن يدمنوا الخمر، ولا للعظماء أن يجرعوا المسكر."], [5, "لئلا يسكروا فينسوا الشريعة، ويجوروا على حقوق البائسين."], [6, "أعطوا المسكر للهالك، والخمر لذوي النفوس التعسة،"], [7, "فيثملوا وينسوا فقرهم، ولا يذكروا بؤسهم بعد."]]}, {"l": "Eze 44:21", "n": "", "vs": [[21, "ولا يشربن كاهن خمرا عند دخوله إلى الساحة الداخلية."]]}, {"l": "Eph 5:18", "n": "", "vs": [[18, "لا تسكروا بالخمر، ففيها الخلاعة، وإنما امتلئوا بالروح،"]]}, {"l": "Tit 1:7", "n": "", "vs": [[7, "وذلك لأن الناظر يجب أن يكون بريئا من كل تهمة باعتباره وكيلا لله، لا معجبا بنفسه ولا حاد الطبع، ولا مدمن الخمر، ولا عنيفا، ولا ساعيا إلى المكسب الخسيس؛"]]}, {"l": "Tit 2:3", "n": "", "vs": [[3, "وكذلك أن تكون العجائز ذوات سيرة موافقة للقداسة، غير نمامات ولا مدمنات للخمر، بل معلمات لما هو صالح،"]]}], "kwAr": "", "noteAr": ""}], "arS": [["لا ", []], ["تشرب الماء", ["G5202"]], [" فقط بعد الآن. وإنما ", []], ["خذ", ["G5530"]], [" ", []], ["قليلا", ["G3641"]], [" من ", []], ["الخمر", ["G3631"]], [" مداويا ", []], ["معدتك", ["G4751"]], [" ", []], ["وأمراضك", ["G769"]], [" التي تعاودك ", []], ["كثيرا", ["G4437"]], [".", []]]}, {"c": 5, "v": 24, "text": "من الناس من تكون خطاياهم واضحة قبل المحاكمة؛ ومن الناس من لا تظهر خطاياهم إلا بعد المحاكمة.", "groups": [{"kw": "", "raw": "Jer_2:34; Act_1:16-20, Act_5:1-11, Act_8:18; Gal_5:19-21; 2Ti_4:10; 2Pe_2:20,2Pe_2:21", "note": "", "refs": [{"l": "Jer 2:34", "n": "", "vs": [[34, "فوجد في أذيالكم أيضا دم المساكين الأبرياء الذين لم تقبضوا عليهم متلبسين بجريمة الاقتحام. ومع كل ذلك"]]}, {"l": "Act 1:16-20", "n": "", "vs": [[16, "«أيها الإخوة، كان لابد من أن تتم النبوءة التي قالها الروح القدس بلسان النبي داود، عن يهوذا الذي انقلب دليلا للذين قبضوا على يسوع."], [17, "وكان يهوذا يعتبر واحدا منا، وقد شاركنا في خدمتنا."], [18, "ثم إنه اشترى حقلا بالمال الذي تقاضاه ثمنا للخيانة، وفيه وقع على وجهه، فانشق من وسطه واندلقت أمعاؤه كلها."], [19, "وعلم أهل أورشليم جميعا بهذه الحادثة، فأطلقوا على حقله اسم ¢حقل دمخ¢ بلغتهم، أي حقل الدم."], [20, "فتمت النبوءة الواردة في كتاب المزامير: لتصر داره خرابا، ولا يسكنها ساكن. وأيضا: ليستلم وظيفته آخر!"]]}, {"l": "Act 5:1-11", "n": "", "vs": [[1, "ولكن رجلا اسمه حنانيا، اتفق مع زوجته سفيرة فباع حقلا كان يملكه،"], [2, "واحتفظ لنفسه بجزء من الثمن بعلم من زوجته، وجاء بما تبقى ووضعه عند أقدام الرسل."], [3, "فقال له بطرس: «ياحنانيا، لماذا سمحت للشيطان أن يملأ قلبك، فكذبت على الروح القدس، واحتفظت لنفسك بجزء من ثمن الحقل؟"], [4, "أما كان بقي لك لو لم تبعه؟ وبعد بيعه أما كان لك حق الاحتفاظ بثمنه؟ لماذا قصدت في قلبك أن تغش؟ إنك لم تكذب على الناس، بل على الله!»"], [5, "فما إن سمع حنانيا هذا الكلام حتى سقط أرضا ومات! فاستولت الرهبة الشديدة على جميع الذين عرفوا ذلك."], [6, "وقام بعض الشبان وكفنوا حنانيا، وحملوه إلى حيث دفنوه."], [7, "وبعد نحو ثلاث ساعات حضرت زوجة حنانيا وهي لا تدري بما حدث،"], [8, "فسألها بطرس: «قولي لي: أبهذا المبلغ بعتما الحقل؟» فأجابت: «نعم، بهذا المبلغ»."], [9, "فقال لها بطرس: «لماذا اتفقت مع زوجك على امتحان روح الرب؟ ها قد وصل الشبان الذين دفنوا زوجك إلى الباب، وسيحملونك أيضا!»"], [10, "فوقعت حالا عند قدمي بطرس وماتت! ولما دخل الشبان وجدوها ميتة، فحملوا جثتها ودفنوها إلى جوار زوجها."], [11, "فاستولت الرهبة الشديدة على الكنيسة كلها، وعلى كل من سمعوا ذلك الخبر."]]}, {"l": "Act 8:18", "n": "", "vs": [[18, "ولما رأى سيمون أن الروح القدس قد حل على المؤمنين لما وضع الرسولان أيديهما عليهم، عرض على بطرس ويوحنا بعض المال، وقال لهما:"]]}, {"l": "Gal 5:19-21", "n": "", "vs": [[19, "أما أعمال الجسد فظاهرة، وهي: الزنى والنجاسة والدعارة،"], [20, "وعبادة الأصنام والسحر، والعداوة والنزاع والغيرة والغضب، والتحزب والانقسام والتعصب،"], [21, "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!"]]}, {"l": "2Ti 4:10", "n": "", "vs": [[10, "لأن ديماس، إذ أحب الحياة الحاضرة، تركني وذهب إلى مدينة تسالونيكي. أما كريسكيس، فقد ذهب إلى مقاطعة غلاطية، وتيطس إلى دلماطية"]]}, {"l": "2Pe 2:20", "n": "", "vs": [[20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."]]}, {"l": "2Pe 2:21", "n": "", "vs": [[21, "وبالحقيقة، كان أفضل لهم لو أنهم لم يتعرفوا بطريق البر، من أن يتعرفوا به ثم يرتدوا عن الوصية المقدسة التي تسلموها."]]}], "kwAr": "", "noteAr": ""}], "arS": [["من ", []], ["الناس", ["G444"]], [" من تكون ", []], ["خطاياهم", ["G266"]], [" ", []], ["واضحة", ["G4271"]], [" قبل ", []], ["المحاكمة", ["G2920"]], ["؛ ومن الناس من لا تظهر خطاياهم إلا ", []], ["بعد", ["G1872"]], [" المحاكمة.", []]]}, {"c": 5, "v": 25, "text": "وقياسا على ذلك، فإن الأعمال الصالحة تكون واضحة مسبقا؛ والأعمال التي ليست بصالحة، لا يمكن أن تظل مخفية.", "groups": [{"kw": "the good", "raw": "1Ti_3:7; Mat_5:16; Act_9:36, Act_10:22, Act_16:1-3, Act_22:12; Gal_5:22, Gal_5:23; Phi_1:11", "note": "", "refs": [{"l": "1Ti 3:7", "n": "", "vs": [[7, "ومن الضروري أن تكون له شهادة حسنة من الذين في خارج الكنيسة، لكي لا يقع في العار وفي فخ إبليس."]]}, {"l": "Mat 5:16", "n": "", "vs": [[16, "هكذا، فليضيء نوركم أمام الناس، ليروا أعمالكم الحسنة ويمجدوا أباكم الذي في السماوات."]]}, {"l": "Act 9:36", "n": "", "vs": [[36, "وكان في مدينة يافا تلميذة اسمها طابيثا، ومعنى اسمها: غزالة، كان يشغلها دائما فعل الخير ومساعدة الفقراء."]]}, {"l": "Act 10:22", "n": "", "vs": [[22, "فأجابوه: «قائد المئة كرنيليوس رجل صالح يتقي الله ، ويشهد له بذلك شعب اليهود جميعا. وقد أوحى الله إليه بواسطة ملاك طاهر أن يستدعيك إلى بيته ليسمع ما عندك من كلام»."]]}, {"l": "Act 16:1-3", "n": "", "vs": [[1, "ووصل بولس إلى دربة، ثم إلى لسترة، وكان فيها تلميذ اسمه تيموثاوس، أمه يهودية كانت قد آمنت بالمسيح، وأبوه يوناني."], [2, "وكان الإخوة في لسترة وإيقونية يشهدون لتيموثاوس شهادة حسنة."], [3, "فأحب بولس أن يصحبه في التبشير. ولأن يهود تلك المنطقة كانوا يعرفون أن أباه يوناني، فقد أخذه بولس وختنه."]]}, {"l": "Act 22:12", "n": "", "vs": [[12, "وكان في دمشق رجل اسمه حنانيا، تقي كما تقضي الشريعة، يشهد له يهود دمشق جميعا شهادة حسنة."]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Gal 5:23", "n": "", "vs": [[23, "والوداعة وضبط النفس. وليس من قانون يمنع مثل هذه الفضائل."]]}, {"l": "Phi 1:11", "n": "", "vs": [[11, "كاملين في ثمار البر الآتية بيسوع المسيح، لمجد الله وحمده."]]}], "kwAr": "الأعمال الصالحة", "noteAr": ""}, {"kw": "cannot", "raw": "Psa_37:5, Psa_37:6; Mat_6:3-6; Luk_11:33", "note": "", "refs": [{"l": "Psa 37:5", "n": "", "vs": [[5, "سلم للرب طريقك وتوكل عليه فيتولى أمرك."]]}, {"l": "Psa 37:6", "n": "", "vs": [[6, "يظهر براءتك كالنور، وحقك ظاهرا كشمس الظهيرة."]]}, {"l": "Mat 6:3-6", "n": "", "vs": [[3, "أما أنت، فعندما تتصدق على أحد، فلا تدع يدك اليسرى تعرف ما تفعله اليمنى."], [4, "لتكون صدقتك في الخفاء، وأبوك السماوي الذي يرى في الخفاء، هو يكافئك."], [5, "وعندما تصلون، لا تكونوا مثل المرائين الذين يحبون أن يصلوا واقفين في المجامع وفي زوايا الشوارع ليراهم الناس. الحق أقول لكم: إنهم قد نالوا مكافأتهم."], [6, "أما أنت، فعندما تصلي، فادخل غرفتك، وأغلق الباب عليك، وصل إلى أبيك الذي في الخفاء. وأبوك الذي يرى في الخفاء، هو يكافئك."]]}, {"l": "Luk 11:33", "n": "", "vs": [[33, "ولكن، لا أحد يشعل مصباحا ويضعه في مكان مخفي أو تحت المكيال، بل يرفعه على المنارة ليرى الداخلون النور."]]}], "kwAr": "لا يمكن أن تظل مخفية", "noteAr": ""}], "arS": [["وقياسا على ذلك، فإن ", []], ["الأعمال", ["G2041"]], [" ", []], ["الصالحة", ["G2570"]], [" تكون ", []], ["واضحة مسبقا", ["G4271"]], ["؛ والأعمال التي ", []], ["ليست بصالحة", ["G247"]], ["، لا ", []], ["يمكن", ["G1410"]], [" أن تظل ", []], ["مخفية", ["G2928"]], [".", []]]}, {"c": 6, "v": 1, "text": "على جميع من هم تحت نير العبودية أن يعتبروا سادتهم أهلا لكل إكرام، لكي لا يجلبوا التجديف على اسم الله وعلى التعليم.", "groups": [{"kw": "servants", "raw": "Deu_28:48; Isa_47:6, Isa_58:6; Mat_11:9, Mat_11:30; Act_15:10; 1Co_7:21, 1Co_7:22; Gal_5:1", "note": "", "refs": [{"l": "Deu 28:48", "n": "", "vs": [[48, "فإنكم تصبحون عبيدا لأعدائكم الذين يرسلهم الرب عليكم في أحوال الجوع والعطش والعري والفاقة، ويضع نير حديد على أعناقكم حتى يهلككم."]]}, {"l": "Isa 47:6", "n": "", "vs": [[6, "قد سخطت على شعبي ونجست ميراثي. أسلمتهم إلى يديك، فلم تبدي نحوهم رحمة بل أرهقت الشيخ بنيرك الثقيل جدا."]]}, {"l": "Isa 58:6", "n": "", "vs": [[6, "أليس الصوم الذي أختاره يكون في فك قيود الشر، وحل عقد النير، وإطلاق سراح المتضايقين، وتحطيم كل نير؟"]]}, {"l": "Mat 11:9", "n": "", "vs": [[9, "إذن، ماذا خرجتم لتروا؟ أنبيا؟ نعم، أقول لكم، وأعظم من نبي."]]}, {"l": "Mat 11:30", "n": "", "vs": [[30, "فإن نيري هين، وحملي خفيف!»"]]}, {"l": "Act 15:10", "n": "", "vs": [[10, "فلماذا تعارضون الله فتحملون تلاميذ الرب عبئا ثقيلا عجز الآباء وعجزنا نحن عن حمله؟"]]}, {"l": "1Co 7:21", "n": "", "vs": [[21, "أكنت عبدا حين دعيت؟ فلا يهمك ذلك. لا بل إن سنحت لك الفرصة لتصير حرا، فأحرى بك أن تغتنمها."]]}, {"l": "1Co 7:22", "n": "", "vs": [[22, "فإن من دعي في الرب وهو عبد، صار معتقا للرب. وكذلك أيضا من دعي وهو حر، صار عبدا للمسيح."]]}, {"l": "Gal 5:1", "n": "", "vs": [[1, "إن المسيح قد حررنا وأطلقنا في سبيل الحرية. فاثبتوا إذن، ولا تعودوا إلى الارتباك بنير العبودية."]]}], "kwAr": "تحت نير العبودية", "noteAr": ""}, {"kw": "count", "raw": "Gen_16:9, Gen_24:2, Gen_24:12, Gen_24:27, 35-67; 2Ki_5:2, 2Ki_5:3, 2Ki_5:13; Mal_1:6; Act_10:7, Act_10:22; Eph_6:5-8; Col_3:22-25; Tit_2:9; 1Pe_2:17-20", "note": "", "refs": [{"l": "Gen 16:9", "n": "", "vs": [[9, "فقال لها ملاك الرب: «عودي إلى مولاتك واخضعي لها»."]]}, {"l": "Gen 24:2", "n": "", "vs": [[2, "وقال إبراهيم لرئيس عبيده، المتولي جميع شؤون بيته: «ضع يدك تحت فخذي،"]]}, {"l": "Gen 24:12", "n": "", "vs": [[12, "وقال: «أيها الرب إله سيدي إبراهيم، أتوسل إليك أن تيسر أمري اليوم وتسدي معروفا لسيدي إبراهيم."]]}, {"l": "Gen 24:27", "n": "", "vs": [[27, "«تبارك الرب إله سيدي إبراهيم الذي لم يتخل عن لطفه ووفائه لسيدي. أما أنا فقد هداني الرب في الطريق إلى بيت إخوة سيدي»."]]}, {"l": "2Ki 5:2", "n": "", "vs": [[2, "وسبى الأراميون في إحدى غزواتهم التي أغاروا فيها على أرض إسرائيل فتاة صغيرة، صارت خادمة لزوجة نعمان."]]}, {"l": "2Ki 5:3", "n": "", "vs": [[3, "فقالت لمولاتها: «ياليت سيدي يمثل أمام النبي الذي في السامرة، فينال الشفاء من برصه»."]]}, {"l": "2Ki 5:13", "n": "", "vs": [[13, "فتقدم منه رجاله وقالوا: «ياأبانا، لو طلب النبي منك القيام بأمر عظيم، أما كنت تصنعه؟ فكم بالأحرى إن قال لك اغتسل واطهر؟»"]]}, {"l": "Mal 1:6", "n": "", "vs": [[6, "إن الابن يكرم أباه والعبد سيده. فإن كنت أنا حقا أبا فأين كرامتي؟ وإن كنت حقا سيدا فأين مهابتي؟ إن الرب القدير يقول لكم: أيها الكهنة المزدرون باسمي؛ فتسألون: كيف ازدرينا باسمك؟"]]}, {"l": "Act 10:7", "n": "", "vs": [[7, "فما إن ذهب الملاك الذي كان يكلم كرنيليوس، حتى دعا اثنين من خدمه، وجنديا تقيا من مرافقيه الدائمين،"]]}, {"l": "Act 10:22", "n": "", "vs": [[22, "فأجابوه: «قائد المئة كرنيليوس رجل صالح يتقي الله ، ويشهد له بذلك شعب اليهود جميعا. وقد أوحى الله إليه بواسطة ملاك طاهر أن يستدعيك إلى بيته ليسمع ما عندك من كلام»."]]}, {"l": "Eph 6:5-8", "n": "", "vs": [[5, "أيها العبيد، أطيعوا سادتكم البشريين بخوف وارتعاد، من قلب صادق، كمن يطيع المسيح،"], [6, "غير عاملين بجد فقط حين تكون عيونهم عليكم كمن يحاول إرضاء الناس، بل انطلاقا من كونكم عبيدا للمسيح،"], [7, "عاملين بمشيئة الله من القلب، خادمين بنية حسنة كما للرب، لا للناس."], [8, "فأنتم تعلمون أنه مهما عمل كل واحد من الخير، فسوف ينال المكافأة من الرب، سواء أكان عبدا أم حرا."]]}, {"l": "Col 3:22-25", "n": "", "vs": [[22, "أيها العبيد، أطيعوا في كل أمر سادتكم البشريين، فلا تعملوا بجد فقط حين تكون عيونهم عليكم، كمن يحاول إرضاء الناس، بل بقلب صادق خائفين الرب."], [23, "ومهما عملتم، فاجتهدوا فيه من صميم القلب، وكأنه للرب لا للناس،"], [24, "عالمين أنكم سوف تنالون المكافأة بالميراث من الرب. فإنما أنتم عبيد تخدمون الرب المسيح"], [25, "وأما من عمل شرا فسوف ينال جزاء عمله الشرير، وليس محاباة."]]}, {"l": "Tit 2:9", "n": "", "vs": [[9, "وعلم العبيد أن يكونوا خاضعين لسادتهم، مرضين لهم في كل شيء؛ غير معاندين؛"]]}, {"l": "1Pe 2:17-20", "n": "", "vs": [[17, "أكرموا جميع الناس. أحبوا الإخوة. خافوا الله . أكرموا الملك."], [18, "أيها الخدم، اخضعوا لسادتكم باحترام لائق. ليس للسادة الصالحين المترفقين فقط، بل للظالمين القساة أيضا!"], [19, "فما أجمل أن يتحمل الإنسان الأحزان حين يتألم مظلوما، بدافع من ضميره الخاضع لله!"], [20, "فبالحقيقة، أي مجد لكم إن كنتم تصبرون وأنتم تتحملون قصاص أخطائكم؟ لا فضل لكم عند الله إلا إذا تحملتم الآلام صابرين، وأنتم تفعلون الصواب."]]}], "kwAr": "أن يعتبروا سادتهم أهلا لكل إكرام", "noteAr": ""}, {"kw": "that the", "raw": "1Ti_5:14; Gen_13:7, Gen_13:8; 2Sa_12:14; Neh_9:5; Isa_52:5; Eze_36:20,Eze_36:23; Luk_17:1; Rom_2:24; 1Co_10:32; Tit_2:5, Tit_2:8, Tit_2:10; 1Pe_2:12, 1Pe_3:16", "note": "", "refs": [{"l": "1Ti 5:14", "n": "", "vs": [[14, "فأريد إذن أن تتزوج الأرامل الشابات، فيلدن الأولاد، ويدبرن بيوتهن، ولا يفسحن للمقاوم في المجال للطعن في سلوكهن."]]}, {"l": "Gen 13:7", "n": "", "vs": [[7, "ونشب نزاع بين رعاة مواشي أبرام ورعاة مواشي لوط، في الوقت الذي كان فيه الكنعانيون والفرزيون يقيمون في الأرض."]]}, {"l": "Gen 13:8", "n": "", "vs": [[8, "فقال أبرام للوط: «لا يكن نزاع بيني وبينك، ولا بين رعاتي ورعاتك لأننا نحن أخوان."]]}, {"l": "2Sa 12:14", "n": "", "vs": [[14, "ولكن لأنك جعلت أعداء الرب يشمتون من جراء هذا الأمر، فإن الابن المولود لك يموت»."]]}, {"l": "Neh 9:5", "n": "", "vs": [[5, "ونادى اللاويون: يشوع وقدميئيل وباني وحشبنيا وشربيا وهوديا وشبنيا وفتحيا قائلين: «قوموا وباركوا الرب إلهكم من الأزل إلى الأبد، وليتبارك اسمك المجيد المتعالي فوق كل بركة وتسبيح."]]}, {"l": "Isa 52:5", "n": "", "vs": [[5, "والآن ماذا لدي هناك؟ يقول الرب، فقد استعبد شعبي مجانا، صاح عليه المتسلطون ساخرين، وظلوا يجدفون على اسمي كل يوم."]]}, {"l": "Eze 36:20", "n": "", "vs": [[20, "وحين استقروا بين الأمم التي تفرقوا بينها، دنسوا اسمي القدوس إذ قيل لهم: هؤلاء شعب الرب وقد طردوا من أرضه."]]}, {"l": "Eze 36:23", "n": "", "vs": [[23, "فأقدس اسمي العظيم الذي صار بسببكم منجسا بين الأمم التي تفرقتم بينها، فتدرك الأمم أني أنا الرب حين أتقدس فيكم أمام أعينهم يقول السيد الرب."]]}, {"l": "Luk 17:1", "n": "", "vs": [[1, "وقال لتلاميذه: «لابد من أن تأتي العثرات. ولكن الويل لمن تأتي على يده!"]]}, {"l": "Rom 2:24", "n": "", "vs": [[24, "فإن «اسم الله يجدف عليه بين الأمم بسببكم»، كما هو مكتوب."]]}, {"l": "1Co 10:32", "n": "", "vs": [[32, "لا تضعوا عائقا يسبب السقوط لأحد، سواء من اليهود أم اليونانيين أم كنيسة الله."]]}, {"l": "Tit 2:5", "n": "", "vs": [[5, "متعقلات، عفيفات، مهتمات بشؤون بيوتهن صالحات، خاضعات لأزواجهن، حتى لا يتكلم أحد بالسوء على كلمة الله."]]}, {"l": "Tit 2:8", "n": "", "vs": [[8, "والكلمة الصحيحة التي لا تلام، لكي يخجل المقاوم حين لا يجد أمرا سيئا يقوله فينا."]]}, {"l": "Tit 2:10", "n": "", "vs": [[10, "ولا سارقين، بل مظهرين أمانة كلية صالحة، لكي يزينوا في كل شيء تعليم مخلصنا الله."]]}, {"l": "1Pe 2:12", "n": "", "vs": [[12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعم
