<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>مقارنة الترجمات — مكتبة دراسة الشواهد</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Serif:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
html,body{overflow-x:clip;padding:0}
.cmp{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
.cmp h1{font:700 22px var(--ui);margin:0 0 4px}.cmp .sub{color:var(--muted);margin:0 0 14px;font-size:13.5px}
.cbar{height:auto;overflow:visible;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5;border-bottom:1px solid var(--line)}
.cbar select,.cbar a,.cbar button{font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);cursor:pointer;text-decoration:none}
.cbar a:hover,.cbar button:hover{border-color:var(--gold)}
.cheads,.crow{display:grid;grid-template-columns:42px 1fr 1fr 1fr;gap:10px}
.cheads{font-weight:700;color:var(--gold);padding:0 0 6px;position:sticky;top:56px;background:var(--bg);z-index:4}
.crow{margin-bottom:8px}
.cvn{color:var(--muted);text-align:center;padding-top:10px;font-weight:600}
.cell{display:block;width:100%;text-align:right;font:inherit;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);cursor:pointer;line-height:1.9}
.cell:hover{border-color:var(--gold);background:var(--gold-soft)}
.cell.ar{font-family:"Amiri","Noto Naskh Arabic",serif;font-size:19px}
.cell.kjv{direction:ltr;text-align:left;font-family:"Noto Serif",serif;font-size:15.5px;line-height:1.7}
.chint{color:var(--muted);font-size:12.5px;margin:0 0 10px}
@media(max-width:820px){.cheads{display:none}.crow{grid-template-columns:1fr;gap:4px;border-bottom:1px dashed var(--line);padding-bottom:10px}.cvn{text-align:right;padding:0}.cell::before{content:attr(data-l);display:block;font:600 11px var(--ui);color:var(--gold)}}
</style></head><body>
<div class="cmp">
<h1>مقارنة الترجمات</h1>
<p class="sub">كتاب الحياة · فاندايك · KJV — الأصحاح كاملًا جنبًا إلى جنب</p>
<div class="cbar"><a href="index.html">← المكتبة</a><select id="bk"></select><select id="ch"></select>
<button id="prev">→ السابق</button><button id="next">التالي ←</button></div>
<p class="chint">اضغط على أي عدد في أي ترجمة لفتح صفحة تفاصيله (الشواهد وأرقام سترونج) بتلك الترجمة.</p>
<div class="cheads"><span></span><span>كتاب الحياة</span><span>فاندايك</span><span dir="ltr" style="text-align:left">KJV</span></div>
<div id="rows"></div></div>
<script>
const BOOKS=[{"a":"Est","n":"أستير","nc":10},{"a":"Job","n":"أيوب","nc":15},{"a":"Psa","n":"المزامير","nc":20},{"a":"Pro","n":"الأمثال","nc":15},{"a":"Ecc","n":"الجامعة","nc":12},{"a":"Son","n":"نشيد الأنشاد","nc":8},{"a":"Isa","n":"إشعياء","nc":15},{"a":"Jer","n":"إرميا","nc":15},{"a":"Lam","n":"مراثي إرميا","nc":5},{"a":"Eze","n":"حزقيال","nc":28},{"a":"Dan","n":"دانيال","nc":12},{"a":"Hos","n":"هوشع","nc":14},{"a":"Joe","n":"يوئيل","nc":3},{"a":"Amo","n":"عاموس","nc":9},{"a":"Oba","n":"عوبديا","nc":1},{"a":"Jon","n":"يونان","nc":4},{"a":"Mic","n":"ميخا","nc":7},{"a":"Nah","n":"ناحوم","nc":3},{"a":"Hab","n":"حبقوق","nc":3},{"a":"Zep","n":"صفنيا","nc":3},{"a":"Hag","n":"حجي","nc":2},{"a":"Zec","n":"زكريا","nc":14},{"a":"Mal","n":"ملاخي","nc":4},{"a": "Mat", "n": "متى", "nc": 28}, {"a": "Mar", "n": "مرقس", "nc": 16}, {"a": "Luk", "n": "لوقا", "nc": 24}, {"a": "Joh", "n": "يوحنا", "nc": 21}, {"a": "Act", "n": "أعمال الرسل", "nc": 28}, {"a": "Rom", "n": "رومية", "nc": 16}, {"a": "1Co", "n": "كورنثوس الأولى", "nc": 16}, {"a": "2Co", "n": "كورنثوس الثانية", "nc": 13}, {"a": "Gal", "n": "غلاطية", "nc": 6}, {"a": "Eph", "n": "أفسس", "nc": 6}, {"a": "Phi", "n": "فيلبي", "nc": 4}, {"a": "Col", "n": "كولوسي", "nc": 4}, {"a": "1Th", "n": "تسالونيكي الأولى", "nc": 5}, {"a": "2Th", "n": "تسالونيكي الثانية", "nc": 3}, {"a": "1Ti", "n": "تيموثاوس الأولى", "nc": 6}, {"a": "2Ti", "n": "تيموثاوس الثانية", "nc": 4}, {"a": "Tit", "n": "تيطس", "nc": 3}, {"a": "Phm", "n": "فليمون", "nc": 1}, {"a": "Heb", "n": "العبرانيين", "nc": 13}, {"a": "Jam", "n": "يعقوب", "nc": 5}, {"a": "1Pe", "n": "بطرس الأولى", "nc": 5}, {"a": "2Pe", "n": "بطرس الثانية", "nc": 3}, {"a": "1Jo", "n": "يوحنا الأولى", "nc": 5}, {"a": "2Jo", "n": "يوحنا الثانية", "nc": 1}, {"a": "3Jo", "n": "يوحنا الثالثة", "nc": 1}, {"a": "Jud", "n": "يهوذا", "nc": 1}, {"a": "Rev", "n": "الرؤيا", "nc": 22}];
const T=[["alab","كتاب الحياة"],["svd","فاندايك"],["kjv","KJV"]];
const $=s=>document.querySelector(s);
const nAr=x=>String(x).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
let st={b:"Mat",c:1};
const q=new URLSearchParams(location.search);
if(BOOKS.some(b=>b.a===q.get("b")))st.b=q.get("b");
st.c=Math.max(1,parseInt(q.get("c"))||1);
$("#bk").innerHTML=BOOKS.map(b=>`<option value="${b.a}">${b.n}</option>`).join("");
function fillCh(){const b=BOOKS.find(x=>x.a===st.b);if(st.c>b.nc)st.c=1;$("#ch").innerHTML=Array.from({length:b.nc},(_,i)=>`<option value="${i+1}">الأصحاح ${nAr(i+1)}</option>`).join("");$("#ch").value=st.c;$("#bk").value=st.b}
function load(k){return new Promise(r=>{if(window.TX&&window.TX[k])return r();const s=document.createElement("script");s.src="assets/tx_"+k+".js";s.onload=r;s.onerror=r;document.body.appendChild(s)})}
async function draw(){fillCh();$("#rows").innerHTML='<p class="chint">جارٍ التحميل…</p>';
  await Promise.all(T.map(t=>load(t[0])));
  const vs=[];for(let v=1;;v++){const a=TX.alab[st.b][st.c+":"+v],s=TX.svd&&TX.svd[st.b]&&TX.svd[st.b][st.c+":"+v],k=TX.kjv&&TX.kjv[st.b]&&TX.kjv[st.b][st.c+":"+v];if(!a&&!s&&!k)break;vs.push([v,a,s,k])}
  const esc=x=>String(x||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const cell=(k,l,v,t)=>`<button class="cell ${k==="kjv"?"kjv":"ar"}" data-l="${l}" data-t="${k}" data-v="${v}">${esc(t)||"—"}</button>`;
  $("#rows").innerHTML=vs.map(([v,a,s,k])=>`<div class="crow"><div class="cvn">${nAr(v)}</div>${cell("alab","كتاب الحياة",v,a)}${cell("svd","فاندايك",v,s)}${cell("kjv","KJV",v,k)}</div>`).join("");
  history.replaceState(null,"","?b="+st.b+"&c="+st.c);document.title=BOOKS.find(x=>x.a===st.b).n+" "+nAr(st.c)+" — مقارنة الترجمات"}
$("#bk").onchange=e=>{st.b=e.target.value;st.c=1;draw()};
$("#ch").onchange=e=>{st.c=+e.target.value;draw()};
function step(d){const i=BOOKS.findIndex(x=>x.a===st.b),b=BOOKS[i];let c=st.c+d;
  if(c<1){if(i===0)return;st.b=BOOKS[i-1].a;c=BOOKS[i-1].nc}else if(c>b.nc){if(i===BOOKS.length-1)return;st.b=BOOKS[i+1].a;c=1}
  st.c=c;draw();scrollTo(0,0)}
$("#prev").onclick=()=>step(-1);$("#next").onclick=()=>step(1);
$("#rows").onclick=e=>{const c=e.target.closest(".cell");if(!c)return;location.href=st.b+".html?tr="+c.dataset.t+"#/"+st.b+"/"+st.c+":"+c.dataset.v};
draw();
</script></body></html>
