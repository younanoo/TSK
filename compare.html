<div class="cmp">
<h1>مقارنة الترجمات</h1>
<p class="sub">كتاب الحياة · فاندايك · KJV — الأصحاح كاملًا جنبًا إلى جنب</p>
<div class="cbar"><a href="index.html">← المكتبة</a><a id="back" href="#"><svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14l-4 -4l4 -4" /> <path d="M5 10h11a4 4 0 1 1 0 8h-1" /></svg> العرض العادي للأصحاح</a><select id="bk"></select><select id="ch"></select>
<button id="prev">→ السابق</button><button id="next">التالي ←</button></div>
<p class="chint">اضغط على أي عدد في أي ترجمة لفتح صفحة تفاصيله (الشواهد وأرقام سترونج) بتلك الترجمة.</p>
<div class="cheads"><span></span><span>كتاب الحياة</span><span>فاندايك</span><span dir="ltr" style="text-align:left">KJV</span></div>
<div id="rows"></div></div>
<script>
const BOOKS=[{"a":"Gen","n":"التكوين","nc":50},{"a":"Exo","n":"الخروج","nc":40},{"a":"Lev","n":"اللاويين","nc":27},{"a":"Num","n":"العدد","nc":36},{"a":"Deu","n":"التثنية","nc":34},{"a":"Jos","n":"يشوع","nc":24},{"a":"Jdg","n":"القضاة","nc":21},{"a":"Rut","n":"راعوث","nc":4},{"a":"1Sa","n":"صموئيل الأول","nc":31},{"a":"2Sa","n":"صموئيل الثاني","nc":24},{"a":"1Ki","n":"الملوك الأول","nc":22},{"a":"2Ki","n":"الملوك الثاني","nc":25},{"a":"1Ch","n":"أخبار الأيام الأول","nc":29},{"a":"2Ch","n":"أخبار الأيام الثاني","nc":36},{"a":"Ezr","n":"عزرا","nc":10},{"a":"Neh","n":"نحميا","nc":13},{"a":"Est","n":"أستير","nc":10},{"a":"Job","n":"أيوب","nc":42},{"a":"Psa","n":"المزامير","nc":150},{"a":"Pro","n":"الأمثال","nc":31},{"a":"Ecc","n":"الجامعة","nc":12},{"a":"Son","n":"نشيد الأنشاد","nc":8},{"a":"Isa","n":"إشعياء","nc":66},{"a":"Jer","n":"إرميا","nc":52},{"a":"Lam","n":"مراثي إرميا","nc":5},{"a":"Eze","n":"حزقيال","nc":48},{"a":"Dan","n":"دانيال","nc":12},{"a":"Hos","n":"هوشع","nc":14},{"a":"Joe","n":"يوئيل","nc":3},{"a":"Amo","n":"عاموس","nc":9},{"a":"Oba","n":"عوبديا","nc":1},{"a":"Jon","n":"يونان","nc":4},{"a":"Mic","n":"ميخا","nc":7},{"a":"Nah","n":"ناحوم","nc":3},{"a":"Hab","n":"حبقوق","nc":3},{"a":"Zep","n":"صفنيا","nc":3},{"a":"Hag","n":"حجي","nc":2},{"a":"Zec","n":"زكريا","nc":14},{"a":"Mal","n":"ملاخي","nc":4},{"a":"Mat","n":"متى","nc":28},{"a":"Mar","n":"مرقس","nc":16},{"a":"Luk","n":"لوقا","nc":24},{"a":"Joh","n":"يوحنا","nc":21},{"a":"Act","n":"أعمال الرسل","nc":28},{"a":"Rom","n":"رومية","nc":16},{"a":"1Co","n":"كورنثوس الأولى","nc":16},{"a":"2Co","n":"كورنثوس الثانية","nc":13},{"a":"Gal","n":"غلاطية","nc":6},{"a":"Eph","n":"أفسس","nc":6},{"a":"Phi","n":"فيلبي","nc":4},{"a":"Col","n":"كولوسي","nc":4},{"a":"1Th","n":"تسالونيكي الأولى","nc":5},{"a":"2Th","n":"تسالونيكي الثانية","nc":3},{"a":"1Ti","n":"تيموثاوس الأولى","nc":6},{"a":"2Ti","n":"تيموثاوس الثانية","nc":4},{"a":"Tit","n":"تيطس","nc":3},{"a":"Phm","n":"فليمون","nc":1},{"a":"Heb","n":"العبرانيين","nc":13},{"a":"Jam","n":"يعقوب","nc":5},{"a":"1Pe","n":"بطرس الأولى","nc":5},{"a":"2Pe","n":"بطرس الثانية","nc":3},{"a":"1Jo","n":"يوحنا الأولى","nc":5},{"a":"2Jo","n":"يوحنا الثانية","nc":1},{"a":"3Jo","n":"يوحنا الثالثة","nc":1},{"a":"Jud","n":"يهوذا","nc":1},{"a":"Rev","n":"الرؤيا","nc":22}];
const T=[["alab","كتاب الحياة"],["svd","فاندايك"],["kjv","KJV"]];
const $=s=>document.querySelector(s);
const nAr=x=>String(x).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
let st={b:"Mat",c:1};
const q=new URLSearchParams(location.search);
if(BOOKS.some(b=>b.a===q.get("b")))st.b=q.get("b");
st.c=Math.max(1,parseInt(q.get("c"))||1);
$("#bk").innerHTML=BOOKS.map(b=>`<option value="${b.a}">${b.n}</option>`).join("");
function fillCh(){const b=BOOKS.find(x=>x.a===st.b);if(st.c>b.nc)st.c=1;$("#ch").innerHTML=Array.from({length:b.nc},(_,i)=>`<option value="${i+1}">الأصحاح ${nAr(i+1)}</option>`).join("");$("#ch").value=st.c;$("#bk").value=st.b}
function load(k){return new Promise(r=>{if(window.TX&&window.TX[k])return r();const s=document.createElement("script");s.src="assets/tx_"+k+".js";s.onload=r;s.onerror=r;document.body.appendChild(s)})}
async function draw(){fillCh();$("#rows").innerHTML='<p class="chint">جارٍ التحميل…</p>';
  await Promise.all(T.map(t=>load(t[0])));
  const vs=[];for(let v=1;;v++){const a=TX.alab[st.b][st.c+":"+v],s=TX.svd&&TX.svd[st.b]&&TX.svd[st.b][st.c+":"+v],k=TX.kjv&&TX.kjv[st.b]&&TX.kjv[st.b][st.c+":"+v];if(!a&&!s&&!k)break;vs.push([v,a,s,k])}
  const esc=x=>String(x||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const cell=(k,l,v,t)=>`<button class="cell ${k==="kjv"?"kjv":"ar"}" data-l="${l}" data-t="${k}" data-v="${v}">${esc(t)||"—"}</button>`;
  $("#rows").innerHTML=vs.map(([v,a,s,k])=>`<div class="crow"><div class="cvn">${nAr(v)}</div>${cell("alab","كتاب الحياة",v,a)}${cell("svd","فاندايك",v,s)}${cell("kjv","KJV",v,k)}</div>`).join("");
  history.replaceState(null,"","?b="+st.b+"&c="+st.c);$("#back").href=st.b+".html#/"+st.b+"/ch/"+st.c;document.title=BOOKS.find(x=>x.a===st.b).n+" "+nAr(st.c)+" — مقارنة الترجمات"}
$("#bk").onchange=e=>{st.b=e.target.value;st.c=1;draw()};
$("#ch").onchange=e=>{st.c=+e.target.value;draw()};
function step(d){const i=BOOKS.findIndex(x=>x.a===st.b),b=BOOKS[i];let c=st.c+d;
  if(c<1){if(i===0)return;st.b=BOOKS[i-1].a;c=BOOKS[i-1].nc}else if(c>b.nc){if(i===BOOKS.length-1)return;st.b=BOOKS[i+1].a;c=1}
  st.c=c;draw();scrollTo(0,0)}
$("#prev").onclick=()=>step(-1);$("#next").onclick=()=>step(1);
$("#rows").onclick=e=>{const c=e.target.closest(".cell");if(!c)return;location.href=st.b+".html?tr="+c.dataset.t+"#/"+st.b+"/"+st.c+":"+c.dataset.v};
draw();
</script></body></html>
