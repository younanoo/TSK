"مرتفعا", ["H1116"]], [" تنمو عليه أشجار ", []], ["الغاب", ["H3293"]], [".", []]]}, {"c": 4, "v": 1, "text": "ويكون في آخر الأيام أن جبل هيكل الرب يصبح أشهر الجبال، ويعلو فوق كل التلال، فتتقاطر إليه شعوب عديدة،", "groups": [{"kw": "in the last", "raw": "Gen_49:1; Isa_2:1-3; Jer_48:47; Eze_38:16; Dan_2:28, Dan_10:14; Hos_3:5; Act_2:17; Heb_1:2; 2Pe_3:3", "note": "", "refs": [{"l": "Gen 49:1", "n": "", "vs": [[1, "ثم استدعى يعقوب أبناءه وقال: «التفوا حولي لأنبئكم بما سيحدث لكم في الأيام المقبلة."]]}, {"l": "Isa 2:1-3", "n": "", "vs": [[1, "الإعلان الذي رآه إشعياء بن آموص بشأن يهوذا وأورشليم:"], [2, "ويحدث في آخر الأيام، أن جبل هيكل الرب يصبح أسمى من كل الجبال، ويعلو فوق كل التلال، فتتوافد إليه جميع الأمم."], [3, "وتقبل شعوب كثيرة وتقول: تعالوا لنذهب إلى جبل الرب، إلى بيت إله يعقوب، فيعلمنا طرقه، ونسلك في سبله، لأن من صهيون تخرج الشريعة، ومن أورشليم تعلن كلمة الرب."]]}, {"l": "Jer 48:47", "n": "", "vs": [[47, "ولكني أرد سبي موآب في الأيام الآتية»، يقول الرب. إلى هنا ختام القضاء على موآب."]]}, {"l": "Eze 38:16", "n": "", "vs": [[16, "وتزحف على شعبي إسرائيل كسحابة تغطي الأرض، أني في الأيام الأخيرة آتي بك إلى أرضي لكي تعرفني الشعوب عندما تتجلى قداستي حين أدمرك ياجوج أمام عيونهم.هذا ما يقوله السيد الرب:"]]}, {"l": "Dan 2:28", "n": "", "vs": [[28, "ولكن هناك إله في السماء يعلن الخفايا. وقد عرف الملك نبوخذناصر عما سيحدث في آخر الأيام. أما حلمك والرؤيا التي شهدتها في منامك فهي هذه:"]]}, {"l": "Dan 10:14", "n": "", "vs": [[14, "وقد جئت الآن لأطلعك على ما يصيب شعبك في الأيام الأخيرة، لأن الرويا تختص بالأيام المقبلة»."]]}, {"l": "Hos 3:5", "n": "", "vs": [[5, "ثم يرجع أبناء إسرائيل ويطلبون الرب إلههم، وداود ملكهم (أي المسيح)، ويلتمسون برهبة الرب وجوده في آخر الأيام»."]]}, {"l": "Act 2:17", "n": "", "vs": [[17, "يقول الله : في الأيام الأخيرة سأسكب روحي على جميع البشر، فيتنبأ بنوكم وبناتكم، ويرى شبابكم رؤى، ويحلم شيوخكم أحلاما."]]}, {"l": "Heb 1:2", "n": "", "vs": [[2, "أما الآن، في هذا الزمن الأخير، فقد كلمنا بالابن، الذي جعله وارثا لكل شيء، وبه قد خلق الكون كله!"]]}, {"l": "2Pe 3:3", "n": "", "vs": [[3, "فاعلموا، قبل كل شيء أنه سيأتي في آخر الأيام أناس مستهزئون يسخرون بالحق، ويسلكون منجرفين وراء شهواتهم الخاصة."]]}], "kwAr": "آخر الأيام", "noteAr": ""}, {"kw": "the mountain", "raw": "Mic_3:12; Psa_68:15, Psa_68:16; Isa_11:9, Isa_66:20; Eze_17:22-24, Eze_40:2, Eze_43:12; Dan_2:35, Dan_2:44, Dan_7:14, Dan_7:18, Dan_7:22, Dan_7:27; Zec_8:3; Rev_11:15, Rev_20:4, Rev_21:1-8", "note": "", "refs": [{"l": "Mic 3:12", "n": "", "vs": [[12, "لهذا من جراء أعمالكم ستحرث صهيون كالحقل وتصبح أورشليم كومة من الخرائب، وجبل الهيكل مرتفعا تنمو عليه أشجار الغاب."]]}, {"l": "Psa 68:15", "n": "", "vs": [[15, "جبل باشان هو جبل الله؛ جبل كثير القمم."]]}, {"l": "Psa 68:16", "n": "", "vs": [[16, "أيتها الجبال الكثيرة القمم لماذا تتفرسن بحسد في الجبل الذي اشتهاه الله لسكناه؟ إن الله سيسكن فيه إلى الأبد."]]}, {"l": "Isa 11:9", "n": "", "vs": [[9, "لا يؤذون ولا يسيئون في كل جبل قدسي، لأن الأرض تمتليء من معرفة الرب كما تغمر المياه البحر."]]}, {"l": "Isa 66:20", "n": "", "vs": [[20, "ويحضرون جميع إخوتكم من سائر الأمم، تقدمة للرب، على متون الجياد، وفي المركبات والهوادج، وعلى ظهور البغال وأسنمة الجمال، إلى أورشليم جبل قدسي، كما يحضر الإسرائيليون تقدمة الحنطة في آنية طاهرة إلى بيت الرب"]]}, {"l": "Eze 17:22-24", "n": "", "vs": [[22, "ثم آخذ من ناصية الأرز العالي برعما وأنصبه، وأقطف من رؤوس أغصانه غصنا طريا وأغرسه في جبل شامخ شاهق،"], [23, "في جبل إسرائيل المرتفع فينبت أغصانا ويحمل ثمارا ويصبح أرزا وارفا يأوي تحت ظل أغصانه كل طائر."], [24, "فتدرك جميع أشجار الصحراء (أي جميع الأمم) أني أنا الرب، أذللت الأشجار المتعالية، وعظمت الأشجار الدنية. يبست الشجر النضر، وأنضرت الشجر المتيبس، أنا الرب قلت وأنجزت»."]]}, {"l": "Eze 40:2", "n": "", "vs": [[2, "وأتى بي في رؤى الله إلى أرض إسرائيل، ووضعني على جبل شاهق حيث كان عليه من جهة الجنوب ما يشبه بناء المدينة."]]}, {"l": "Eze 43:12", "n": "", "vs": [[12, "وهذه هي شريعة الهيكل: إن رأس الجبل وكل المنطقة المحيطة به، هي قدس أقداس."]]}, {"l": "Dan 2:35", "n": "", "vs": [[35, "فتحطم الحديد والخزف والنحاس والفضة والذهب معا، وانسحقت وصارت كعصافة البيدر في الصيف، فحملتها الريح حتى لم يبق لها أثر. أما الحجر الذي ضرب التمثال فتحول إلى جبل كبير وملأ الأرض كلها."]]}, {"l": "Dan 2:44", "n": "", "vs": [[44, "وفي عهد هؤلاء الملوك يقيم إله السماوات مملكة لا تنقرض إلى الأبد، ولا يترك ملكها لشعب آخر، وتسحق وتبيد جميع هذه الممالك. أما هي فتخلد إلى الأبد."]]}, {"l": "Dan 7:14", "n": "", "vs": [[14, "فأنعم عليه بسلطان ومجد وملكوت لتتعبد له كل الشعوب والأمم من كل لسان. سلطانه سلطان أبدي لا يفنى، وملكه لا ينقرض."]]}, {"l": "Dan 7:18", "n": "", "vs": [[18, "غير أن قديسي العلي يستولون على المملكة ويتملكونها إلى أبد الآبدين."]]}, {"l": "Dan 7:22", "n": "", "vs": [[22, "إلى أن جاء الأزلي وانعقد مجلس القضاء الذي فيه تبرأت ساحة قديسي العلي، وأزف الوقت الذي فيه امتلكوا المملكة."]]}, {"l": "Dan 7:27", "n": "", "vs": [[27, "وتوهب المملكة والسلطان وعظمة الممالك القائمة تحت كل السماء إلى شعب قديسي العلي، فيكون ملكوت العلي ملكوتا أبديا، وتعبده جميع السلاطين ويطيعونه."]]}, {"l": "Zec 8:3", "n": "", "vs": [[3, "لهذا يقول الرب القدير: ها أنا عائد إلى صهيون لأقيم في أورشليم، فتدعى آنئذ مدينة الحق، كما يدعى جبل الرب القدير الجبل المقدس."]]}, {"l": "Rev 11:15", "n": "", "vs": [[15, "ونفخ الملاك السابع في بوقه فسمعت أصوات عالية في السماء تقول: «قد صار ملك العالم لربنا ومسيحه. إنه يملك إلى أبد الآبدين»."]]}, {"l": "Rev 20:4", "n": "", "vs": [[4, "ثم رأيت عروشا منح الجالسون عليها حق القضاء. ورأيت نفوس الذين قتلوا في سبيل الشهادة ليسوع وفي سبيل كلمة الله، والذين رفضوا أن يسجدوا للوحش ولتمثاله، والذين رفضوا علامته على أيديهم وجباههم، وقد عادوا إلى الحياة، وملكوا مع المسيح ألف سنة."]]}, {"l": "Rev 21:1-8", "n": "", "vs": [[1, "ثم رأيت سماء جديدة وأرضا جديدة لا بحر فيها، لأن السماء والأرض القديمتين قد زالتا."], [2, "وأنا رأيت المدينة المقدسة، أورشليم الجديدة، نازلة من السماء من عند الله، مجهزة كأنها عروس مزينة لعريسها."], [3, "وسمعت صوتا هاتفا من العرش: «الآن صار مسكن الله مع الناس، هو يسكن بينهم، وهم يصيرون شعبا له. الله نفسه يكون معهم إلها لهم!"], [4, "وسيمسح كل دمعة من عيونهم. إذ يزول الموت والحزن والصراخ والألم، لأن الأمور القديمة كلها قد زالت!»"], [5, "وقال الجالس على العرش: «سأصنع كل شيء جديدا». ثم قال لي: «اكتب هذا، فإن ما أقوله هو الصدق والحق»."], [6, "ثم قال: «قد تم. أنا الألف والياء (البداية والنهاية). أنا أسقي العطشان من ينبوع ماء الحياة مجانا."], [7, "هذا كله نصيب المنتصر، وأكون إلها له، وهو يكون ابنا لي."], [8, "أما الجبناء وغير المؤمنين، والفاسدون والقاتلون والزناة، والمتصلون بالشياطين وعبدة الأصنام وجميع الدجالين، فمصيرهم إلى البحيرة المتقدة بالنار والكبريت، الذي هو الموت الثاني»."]]}], "kwAr": "جبل هيكل الرب", "noteAr": ""}, {"kw": "and people", "raw": "Gen_49:10; Psa_22:27, Psa_68:29-32, Psa_72:7-11, Psa_72:16-19, Psa_86:9, Psa_110:3; Isa_11:10, Isa_27:13, Isa_43:6, Isa_49:6, Isa_49:19-23, Isa_54:2, Isa_60:3-14, Isa_66:18-23; Jer_3:17, Jer_16:19; Zep_3:9, Zep_3:10; Zec_2:11, Zec_14:16-21; Mal_1:11; Rom_11:25, Rom_11:26; Rev_15:4", "note": "", "refs": [{"l": "Gen 49:10", "n": "", "vs": [[10, "لا يزول صولجان الملك من يهوذا ولا مشترع من صلبه حتى يأتي شيلوه (ومعناه: من له الأمر) فتطيعه الشعوب."]]}, {"l": "Psa 22:27", "n": "", "vs": [[27, "تتذكر جميع أقاصي الأرض وترجع إلى الرب، وتتعبد أمامك جميع قبائل الأمم."]]}, {"l": "Psa 68:29-32", "n": "", "vs": [[29, "يقدم الملوك لك الهدايا في أورشليم لأن هيكلك فيها"], [30, "انتهر مصر، الوحش الكامن بين القصب. انتهر الأمم القوية التي تشبه قطيع الثيران؛ حتى يخضعوا ويدفعوا لك جزية فضة. بدد الشعوب المولعة بالحرب."], [31, "يفد إليك شرفاء من مصر (ليقدموا الولاء) وتبسط الحبشة يديها مسرعة إعرابا عن خضوعها لله."], [32, "ياممالك الأرض غنوا لله. رنموا للسيد،"]]}, {"l": "Psa 72:7-11", "n": "", "vs": [[7, "ليزدهر في أيامه الصديق، ويتوافر السلام مادام القمر يضيء."], [8, "ولتمتد مملكته من البحر إلى البحر، ومن النهر إلى أقاصي الأرض."], [9, "أمامه يركع أهل البادية، وأعداؤه يلحسون التراب."], [10, "ملوك ترشيش والجزر يحملون إليه الهدايا. ملوك شبا وسبَإ يقدمون عطايا."], [11, "ينحني أمامه جميع الملوك. وتتعبد له كل الأمم."]]}, {"l": "Psa 72:16-19", "n": "", "vs": [[16, "لتتكاثر الغلال في الأرض وعلى رؤوس الجبال، وتتماوج مثل أرز لبنان، ويزهر أهل المدينة كعشب الأرض."], [17, "يخلد اسمه إلى الدهر، ويدوم اسمه كديمومة الشمس، ويتبارك الناس به، وتطوبه كل الأمم."], [18, "تبارك الرب إله إسرائيل، فهو وحده صانع العجائب."], [19, "تبارك اسمه المجيد إلى الأبد، ولتمتليء الأرض كلها من مجده. آمين ثم آمين."]]}, {"l": "Psa 86:9", "n": "", "vs": [[9, "تقبل جميع الأمم التي صنعتها لتسجد أمامك يارب وتمجد اسمك."]]}, {"l": "Psa 110:3", "n": "", "vs": [[3, "في يوم محاربة أعدائك يتطوع شعبك. يجيء شبابك إلى التلال المقدسة كالندى في قلب الفجر."]]}, {"l": "Isa 11:10", "n": "", "vs": [[10, "في ذلك اليوم ينتصب أصل يسى راية للأمم، وإليه تسعى جميع الشعوب، ويكون مسكنه مجيدا."]]}, {"l": "Isa 27:13", "n": "", "vs": [[13, "في ذلك اليوم ينفخ في بوق عظيم فيأتي التائهون في أرض أشور، والمنفيون إلى ديار مصر، ليسجدوا للرب في جبل قدسه، في أورشليم."]]}, {"l": "Isa 43:6", "n": "", "vs": [[6, "أقول للشمال: أطلقهم من عقالك، وللجنوب لا تحجزهم. اجمع أبنائي من بعيد وبناتي من أقاصي الأرض،"]]}, {"l": "Isa 49:6", "n": "", "vs": [[6, "لكم هو يسير أن تكون لي عبدا لتستنهض أسباط يعقوب، وترد من نجيت من إسرائيل، لذلك سأجعلك نورا للأمم لتكون خلاصي إلى أقصى الأرض."]]}, {"l": "Isa 49:19-23", "n": "", "vs": [[19, "وتعج أرضك الخربة وديارك المتهدمة، ومناطقك المدمرة بالسكان حتى تضيق بهم، ويبتعد عنك مبتلعوك."], [20, "ويقول أيضا في مسامعك بنوك المولودون في أثناء ثكلك: إن المكان أضيق من أن يسعنا، فأفسحي لنا حتى نسكن."], [21, "فتسألين نفسك: من أنجب لي هؤلاء وأنا ثكلى وعاقر، منفية ومنبوذة؟ من ربى لي هؤلاء؟ فقد تركت وحدي، أما هؤلاء فمن أين جاءوا؟"], [22, "وهذا ما يقوله السيد الرب: ها أنا أرفع يدي إلى الأمم وأنصب رايتي إلى الشعوب، فيحملون أبناءك في أحضانهم وبناتك على أكتافهم."], [23, "يكون لك الملوك آباء مربين، وملكاتهم مرضعات، ينحنون أمامك بوجوه مطرقة إلى الأرض، ويلحسون تراب قدميك. عندئذ تدركين أنني أنا الرب، وكل من يتكل علي لا يخزى»."]]}, {"l": "Isa 54:2", "n": "", "vs": [[2, "وسعي فسحة خيمتك وابسطي ستائر مساكنك، لا تضيقي. أطيلي حبال خيمتك ورسخي أوتادك،"]]}, {"l": "Isa 60:3-14", "n": "", "vs": [[3, "فتقبل الأمم إلى نورك، وتتوافد الملوك إلى إشراق ضيائك."], [4, "تأملي حولك وانظري، فها هم جميعا قد اجتمعوا، وأتوا إليك. يجيء أبناؤك من مكان بعيد، وتحمل بناتك على الأذرع."], [5, "عندئذ تنظرين وتتهللين، وتطغى الإثارة على قلبك، وتمتلئين فرحا لأن ثروات البحر تتحول إليك وغنى الأمم يتدفق عليك."], [6, "تكتظ أرضك بكثرة الإبل. من أرض مديان وعيفة تغشاك بكران، تتقاطر إليك من شبا محملة بالذهب واللبان وتذيع تسبيح الرب."], [7, "جميع قطعان قيدار تجتمع إليك، وكباش نبايوت تخدمك، تقدم قرابين مقبولة على مذبحي، وأمجد بيتي البهي."], [8, "من هؤلاء الطائرون كالسحاب وكالحمام إلى أعشاشها؟"], [9, "فالجزائر تنتظرني، وفي الطليعة سفن ترشيش حاملة أبناءك لتأتي بهم من أرض بعيدة، ومعهم فضتهم وذهبهم، تكريما لاسم الرب إلهك ولقدوس إسرائيل لأنه قد مجدك."], [10, "يعمر الغرباء أسوارك، ويخدمك ملوكهم، لأني في غضبي عاقبتك، وفي رضاي رحمتك."], [11, "تنفتح أبوابك دائما ولا توصد ليل نهار، ليحمل إليك الناس ثروة الأمم، وفي موكب يساق إليك ملوكهم،"], [12, "لأن الأمة والمملكة التي لا تخضع لك تهلك، وهذه الشعوب تتعرض للخراب الساحق."], [13, "يأتي إليك مجد لبنان بسروه وسنديانه وشربينه لتزيين موضع مقدسي، فأجعل موطيء قدمي مجيدا."], [14, "ويقبل إليك أبناء مضايقيك خاضعين، وكل الذين احتقروك ينحنون عند قدميك، ويدعونك مدينة الرب، صهيون قدوس إسرائيل."]]}, {"l": "Isa 66:18-23", "n": "", "vs": [[18, "ولأني عالم بأعمالهم وأفكارهم فأنا مزمع أن آتي لأجمع كل الأمم والألسنة، فيتوافدون ويرون مجدي"], [19, "وأجعل بينهم آية وأبعث بعض الناجين منهم إلى الأمم: إلى ترشيش، وفول، ولود، المهرة في رمي السهام، وإلى توبال وياوان وإلى الجزائر البعيدة ممن لم يسمعوا بشهرتي أو يروا مجدي، فيذيعون مجدي بين الأمم."], [20, "ويحضرون جميع إخوتكم من سائر الأمم، تقدمة للرب، على متون الجياد، وفي المركبات والهوادج، وعلى ظهور البغال وأسنمة الجمال، إلى أورشليم جبل قدسي، كما يحضر الإسرائيليون تقدمة الحنطة في آنية طاهرة إلى بيت الرب"], [21, "ومنهم أصطفي كهنة ولاويين يقول الرب."], [22, "لأنه كما تدوم أمامي السماوات الجديدة والأرض الجديدة التي أنا أصنعها هكذا تدوم ذريتكم وذكركم."], [23, "ويأتي من رأس شهر إلى رأس شهر، ومن سبت إلى سبت كل بني البشر ليعبدوني،"]]}, {"l": "Jer 3:17", "n": "", "vs": [[17, "ويدعون في ذلك الحين مدينة أورشليم كرسي الرب، وتجتمع إليها كل الأمم للمثول في حضرة الرب، ولن يضلوا وراء عناد قلوبهم الشريرة."]]}, {"l": "Jer 16:19", "n": "", "vs": [[19, "يارب أنت عزي وحصني وملاذي في يوم الضيق، إليك تقبل الأمم من أقاصي الأرض قائلة: «لم يرث آباؤنا سوى الباطل والأكاذيب وما لا جدوى منه."]]}, {"l": "Zep 3:9", "n": "", "vs": [[9, "عندئذ أنقي شفاه الشعب ليدعوا جميعهم باسم الرب ويعبدوه جنبا إلى جنب."]]}, {"l": "Zep 3:10", "n": "", "vs": [[10, "فيقرب إلي شعبي المشتت ذبيحة من وراء أنهار كوش حيث يقيم المتضرعون إلي."]]}, {"l": "Zec 2:11", "n": "", "vs": [[11, "فتنضم أمم كثيرة في ذلك اليوم إلى الرب ويكونون لي شعبا، فأقيم في وسطك، فتدركين أن الرب القدير قد أرسلني إليك."]]}, {"l": "Zec 14:16-21", "n": "", "vs": [[16, "فيصعد الناجون من الأمم التي تألبت على أورشليم، سنة بعد سنة ليعبدوا الملك الرب القدير ويحتفلوا بعيد المظال."], [17, "وإن تقاعست أية عشيرة من عشائر أمم الأرض عن الصعود إلى أورشليم لتسجد للملك الرب القدير، يمتنع المطر عن الهطول على ديارهم."], [18, "وإن أبى أهل مصر الصعود للاشتراك في الاحتفال، يحل بهم البلاء الذي يعاقب به الرب الأمم التي لا تجيء للاحتفال بعيد المظال."], [19, "هذا هو عقاب مصر وعقاب سائر الشعوب التي تأبى المجيء للاحتفال بعيد المظال."], [20, "وينقش في ذلك اليوم على أجراس الخيل: «قدس للرب». وتكون القدور في الهيكل مقدسة كالمناضح التي أمام المذبح."], [21, "بل يكون كل قدر في أورشليم وفي يهوذا مقدسا للرب القدير، فيصبح في وسع المقربين أن يأتوا ويستخدموا ما يشاؤون منها، ليطبخوا فيها لحم الذبيحة. ولا يبقى في هيكل الرب القدير تجار في ذلك اليوم."]]}, {"l": "Mal 1:11", "n": "", "vs": [[11, "لأنه من مشرق الشمس إلى مغربها اسمي عظيم بين الأمم، وفي كل مكان يحرق لاسمي بخور وذبائح طاهرة، لأن اسمي عظيم بين الأمم، يقول الرب القدير."]]}, {"l": "Rom 11:25", "n": "", "vs": [[25, "فإني لا أريد، أيها الإخوة، أن يخفى عليكم هذا السر، لكي لا تكونوا حكماء في نظر أنفسكم، وهو أن العمى قد أصاب إسرائيل جزئيا إلى أن يتم دخول الأمم كليا."]]}, {"l": "Rom 11:26", "n": "", "vs": [[26, "وهكذا، سوف يخلص جميع إسرائيل، وفقا لما قد كتب: «إن المنقذ سيطلع من صهيون ويرد الإثم عن يعقوب."]]}, {"l": "Rev 15:4", "n": "", "vs": [[4, "من لا يخافك يارب ولا يمجد اسمك؟ فأنت وحدك قدوس! والأمم جميعا سيأتون ويسجدون لك، لأن أحكامك قد ظهرت جلية»."]]}], "kwAr": "شعوب عديدة", "noteAr": ""}], "arS": [["ويكون", ["H1961"]], [" في ", []], ["آخر", ["H319"]], [" ", []], ["الأيام", ["H3117"]], [" أن ", []], ["جبل", ["H2022"]], [" ", []], ["هيكل", ["H1004"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["يصبح", ["H1961"]], [" ", []], ["أشهر", ["H3559", "H7218"]], [" ", []], ["الجبال", ["H2022"]], ["، ", []], ["ويعلو", ["H5375"]], [" ", []], ["فوق", ["H4480"]], [" كل ", []], ["التلال", ["H1389"]], ["، ", []], ["فتتقاطر", ["H5102"]], [" ", []], ["إليه", ["H5921"]], [" ", []], ["شعوب", ["H5971"]], [" عديدة،", []]]}, {"c": 4, "v": 2, "text": "وتقبل إليه أمم كثيرة قائلة: «تعالوا لنصعد إلى جبل الرب، إلى هيكل يعقوب ليعلمنا طرقه فنسلك في سبله، لأن من صهيون تخرج الشريعة ومن أورشليم تذاع كلمة الرب».", "groups": [{"kw": "and say", "raw": "Isa_2:3; Jer_31:6, Jer_50:4, Jer_50:5; Zec_8:20-23", "note": "", "refs": [{"l": "Isa 2:3", "n": "", "vs": [[3, "وتقبل شعوب كثيرة وتقول: تعالوا لنذهب إلى جبل الرب، إلى بيت إله يعقوب، فيعلمنا طرقه، ونسلك في سبله، لأن من صهيون تخرج الشريعة، ومن أورشليم تعلن كلمة الرب."]]}, {"l": "Jer 31:6", "n": "", "vs": [[6, "لأنه سيأتي يوم ينادي فيه المراقبون في جبل أفرايم قائلين: هلموا فنصعد إلى صهيون إلى الرب إلهنا»."]]}, {"l": "Jer 50:4", "n": "", "vs": [[4, "وفي تلك الأيام، يقول الرب، يتوافد أبناء إسرائيل وأبناء يهوذا معا. يبكون في سيرهم ويلتمسون الرب إلههم."]]}, {"l": "Jer 50:5", "n": "", "vs": [[5, "يسألون عن الطريق إلى صهيون، ويتوجهون إليها قائلين: هلم ننضم إلى الرب بعهد أبدي لا ينسى."]]}, {"l": "Zec 8:20-23", "n": "", "vs": [[20, "وستأتي شعوب أيضا وأفواج من سكان مدن كثيرة إلى أورشليم."], [21, "ويمضي أهل المدينة الواحدة إلى المدينة الأخرى قائلين: هيا نذهب على الفور لنطلب رضى وجه الرب القدير ونلتمس بركته، لأننا على أي حال منطلقون إلى هناك."], [22, "فتتوافد أمم كثيرة وشعوب قوية ليلتمسوا وجه الرب القدير في أورشليم وليحظوا برضاه."], [23, "في تلك الأيام يتشبث عشرة رجال من أبناء الأمم بثوب رجل يهودي قائلين: دعنا نذهب معكم، لأننا سمعنا أن الرب معكم»."]]}], "kwAr": "قائلة", "noteAr": ""}, {"kw": "and he", "raw": "Deu_6:1; Psa_25:8, Psa_25:9, Psa_25:12; Isa_54:13; Mat_11:25-30; Joh_6:45, Joh_7:17; Act_10:32, Act_10:33, Act_13:42; Jam_1:19-25", "note": "", "refs": [{"l": "Deu 6:1", "n": "", "vs": [[1, "وهذه هي الوصايا والفرائض والأحكام التي أمرني الرب إلهكم أن ألقنكم إياها، لتعملوا بها في الأرض التي أنتم ماضون إليها لترثوها."]]}, {"l": "Psa 25:8", "n": "", "vs": [[8, "الرب صالح ومستقيم لذلك يهدي الضالين الطريق."]]}, {"l": "Psa 25:9", "n": "", "vs": [[9, "يدرب الودعاء في سبل الحق ويعلمهم طريقه."]]}, {"l": "Psa 25:12", "n": "", "vs": [[12, "من هو الإنسان الذي يخاف الرب؟ إياه يدرب في الطريق التي يختارها له،"]]}, {"l": "Isa 54:13", "n": "", "vs": [[13, "يكون جميع أبنائك تلاميذ الرب، ويعمهم سلام عظيم."]]}, {"l": "Mat 11:25-30", "n": "", "vs": [[25, "وفي ذلك الوقت، تكلم يسوع فقال: «أحمدك أيها الآب، رب السماء والأرض، لأنك حجبت هذه الأمور عن الحكماء والفهماء، وكشفتها للأطفال!"], [26, "نعم أيها الآب، لأنه هكذا حسن في نظرك."], [27, "كل شيء قد سلمه إلي أبي. ولا أحد يعرف الابن إلا الآب، ولا أحد يعرف الآب إلا الابن، ومن أراد الابن أن يعلنه له."], [28, "تعالوا إلي ياجميع المتعبين والرازحين تحت الأحمال الثقيلة، وأنا أريحكم."], [29, "احملوا نيري عليكم، وتتلمذوا على يدي، لأني وديع ومتواضع القلب، فتجدوا الراحة لنفوسكم."], [30, "فإن نيري هين، وحملي خفيف!»"]]}, {"l": "Joh 6:45", "n": "", "vs": [[45, "جاء في كتب الأنبياء: سيتعلم الجميع من الله. وكل من يسمع الآب ويتعلم منه يأتي إلي."]]}, {"l": "Joh 7:17", "n": "", "vs": [[17, "ومن أراد أن يعمل مشيئة الله يعرف ما إذا كان تعليمي من عند الله، أو أنني أتكلم من عندي."]]}, {"l": "Act 10:32", "n": "", "vs": [[32, "والآن أرسل رجالا إلى يافا، واستدع سمعان الملقب بطرس. إنه يقيم في بيت سمعان الدباغ عند البحر."]]}, {"l": "Act 10:33", "n": "", "vs": [[33, "فأرسلت حالا أدعوك، وقد أحسنت بمجيئك. ونحن الآن جميعا حاضرون أمام الله لنسمع كل ما أمرك به الرب»."]]}, {"l": "Act 13:42", "n": "", "vs": [[42, "وفيما الحاضرون ينصرفون، طلبوا إلى بولس وبرنابا أن يعودا في السبت التالي ويحدثاهم بهذا الأمر."]]}, {"l": "Jam 1:19-25", "n": "", "vs": [[19, "لذلك، ياإخوتي الأحباء، على كل واحد منكم أن يكون مسرعا إلى الإصغاء، غير متسرع في الكلام، بطيء الغضب."], [20, "لأن الإنسان، إذا غضب، لا يعمل الصلاح الذي يريده الله ."], [21, "إذن، تخلصوا من كل ما في حياتكم من نجاسة وشر متزايد. وليكن قبولكم لتلك الكلمة التي غرسها الله في قلوبكم، قبولا وديعا. فهي القادرة أن تخلص نفوسكم."], [22, "لا تكتفوا فقط بسماعها، بل اعملوا بها، وإلا كنتم تغشون أنفسكم."], [23, "فالذي يسمع الكلمة ولا يعمل بها، يكون كمن ينظر إلى المرآة ليشاهد وجهه فيها."], [24, "وبعد أن يرى نفسه، يذهب فينسى صورته حالا."], [25, "أما الذي ينظر بالتدقيق في القانون الكامل، قانون الحرية، ويواظب على ذلك، فيكون كمن يعمل بالكلمة لا كمن يسمعها وينساها، فإن الله يباركه كثيرا في كل ما يعمله."]]}], "kwAr": "ليعلمنا", "noteAr": ""}, {"kw": "for", "raw": "Psa_110:2; Isa_42:1-4, Isa_51:4, Isa_51:5; Hos_6:3; Zec_14:8, Zec_14:9; Mat_28:19, Mat_28:20; Mar_16:15, Mar_16:16, Mar_16:20; Luk_24:47; Act_1:8, Act_13:46, Act_13:47; Rom_10:12-18, Rom_15:19", "note": "", "refs": [{"l": "Psa 110:2", "n": "", "vs": [[2, "يجعل الرب صهيون منطلقا لسلطانك، ويقول: «احكم في وسط أعدائك»."]]}, {"l": "Isa 42:1-4", "n": "", "vs": [[1, "هوذا عبدي الذي أعضده، مختاري الذي ابتهجت به نفسي. وضعت روحي عليه ليسوس الأمم بالعدل."], [2, "لا يصيح ولا يصرخ ولا يرفع صوته في الطريق."], [3, "لا يكسر قصبة مرضوضة، وفتيلة مدخنة لا يطفيء. إنما بأمانة يجري عدلا."], [4, "لا يكل ولا تثبط له همة حتى يرسخ العدل في الأرض، وتنتظر الجزائر شريعته."]]}, {"l": "Isa 51:4", "n": "", "vs": [[4, "اسمعوا لي ياشعبي، واصغي إلي ياأمتي، فإن الشريعة تصدر مني، وعدلي يصبح نورا للشعوب."]]}, {"l": "Isa 51:5", "n": "", "vs": [[5, "بري بات قريبا، وتجلى خلاصي، وذر اعاي تقضيان للشعوب، وإياي ترتقب الجزائر، وتنتظر برجاء ذراعي."]]}, {"l": "Hos 6:3", "n": "", "vs": [[3, "لنعرف، بل لنجد حتى نعرف الرب، فمجيئه يقين كالفجر، يقبل إلينا كإقبال المطر وكغيوث الربيع التي تروي الأرض»."]]}, {"l": "Zec 14:8", "n": "", "vs": [[8, "في ذلك اليوم تجري مياه حية من أورشليم، يصب نصفها في البحر الشرقي (البحر الميت)، ونصفها الآخر في البحر الغربي (البحر الأبيض المتوسط) طوال الصيف والشتاء."]]}, {"l": "Zec 14:9", "n": "", "vs": [[9, "ويملك الرب على الأرض كلها، فيكون في ذلك اليوم رب واحد لا يذكر سوى اسمه."]]}, {"l": "Mat 28:19", "n": "", "vs": [[19, "فاذهبوا إذن، وتلمذوا جميع الأمم، وعمدوهم باسم الآب والابن والروح القدس؛"]]}, {"l": "Mat 28:20", "n": "", "vs": [[20, "وعلموهم أن يعملوا بكل ما أوصيتكم به. وها أنا معكم كل الأيام إلى انتهاء الزمان! »."]]}, {"l": "Mar 16:15", "n": "", "vs": [[15, "وقال لهم: «اذهبوا إلى العالم أجمع، وبشروا الخليقة كلها بالإنجيل:"]]}, {"l": "Mar 16:16", "n": "", "vs": [[16, "من آمن وتعمد، خلص، ومن لم يؤمن فسوف يدان."]]}, {"l": "Mar 16:20", "n": "", "vs": [[20, "وأما هم، فانطلقوا يبشرون في كل مكان، والرب يعمل معهم ويؤيد الكلمة بالآيات الملازمة لها."]]}, {"l": "Luk 24:47", "n": "", "vs": [[47, "وأن يبشر باسمه بالتوبة وغفران الخطايا في جميع الأمم انطلاقا من أورشليم."]]}, {"l": "Act 1:8", "n": "", "vs": [[8, "ولكن حينما يحل الروح القدس عليكم تنالون القوة، وتكونون لي شهودا في أورشليم واليهودية كلها، وفي السامرة، وإلى أقاصي الأرض»."]]}, {"l": "Act 13:46", "n": "", "vs": [[46, "فخاطبهم بولس وبرنابا بجرأة قائلين: «كان يجب أن نبلغكم أنتم أولا كلمة الله، ولكنكم رفضتموها فأظهرتم أنكم لا تستحقون الحياة الأبدية. وها نحن نتوجه إلى غير اليهود!"]]}, {"l": "Act 13:47", "n": "", "vs": [[47, "فقد أوصانا الرب قائلا: قد جعلتك نورا للأمم، لتكون سبيل خلاص إلى أقصى الأرض!»"]]}, {"l": "Rom 10:12-18", "n": "", "vs": [[12, "فلا فرق بين اليهودي واليوناني، لأن للجميع ربا واحدا، غنيا تجاه كل من يدعوه»."], [13, "«فإن كل من يدعو باسم الرب يخلص»."], [14, "ولكن، كيف يدعون من لم يؤمنوا به؟ وكيف يؤمنون بمن لم يسمعوا به؟ وكيف يسمعون بلا مبشر؟"], [15, "وكيف يبشر أحد إلا إذا كان قد أرسل؟ كما قد كتب: «ما أجمل أقدام المبشرين بالخيرات!»"], [16, "ولكن، ليس كلهم أطاعوا الإنجيل. فإن إشعياء يقول: «يارب! من صدق ما أسمعناه إياه؟»"], [17, "إذا، الإيمان نتيجة السماع، والسماع هو من التبشير بكلمة المسيح !"], [18, "ولكني أقول: أما سمعوا؟ بلى، فإن المبشرين «انطلق صوتهم إلى الأرض كلها، وكلامهم إلى أقاصي العالم»."]]}, {"l": "Rom 15:19", "n": "", "vs": [[19, "وبقوة الآيات والعجائب، وبقوة روح الله. حتى إنني، من أورشليم وما حولها حتى مقاطعة إليريكون، قد أكملت التبشير بإنجيل المسيح."]]}], "kwAr": "لأن من صهيون", "noteAr": ""}], "arS": [["وتقبل", ["H1980"]], [" إليه ", []], ["أمم", ["H1471"]], [" ", []], ["كثيرة", ["H7227"]], [" ", []], ["قائلة", ["H559"]], [": «", []], ["تعالوا", ["H1980"]], [" ", []], ["لنصعد", ["H5927"]], [" ", []], ["إلى", ["H413"]], [" ", []], ["جبل", ["H2022"]], [" ", []], ["الرب", ["H3068"]], ["، ", []], ["إلى", ["H413"]], [" ", []], ["هيكل", ["H1004"]], [" ", []], ["يعقوب", ["H3290"]], [" ", []], ["ليعلمنا", ["H3384"]], [" ", []], ["طرقه", ["H4480", "H1870"]], [" ", []], ["فنسلك", ["H1980"]], [" في ", []], ["سبله", ["H734"]], ["، ", []], ["لأن", ["H3588"]], [" من ", []], ["صهيون", ["H6726"]], [" ", []], ["تخرج", ["H3318"]], [" ", []], ["الشريعة", ["H8451"]], [" ", []], ["ومن", ["H4480"]], [" ", []], ["أورشليم", ["H3389"]], [" تذاع ", []], ["كلمة", ["H1697"]], [" ", []], ["الرب", ["H3068"]], ["».", []]]}, {"c": 4, "v": 3, "text": "فيقضي بين الأمم الكثيرة ويملي أحكامه بعدل على أمم قوية بعيدة، فيصنعون من سيوفهم أسنة محاريث، ومن رماحهم مناجل حصاد، فلا ترفع أمة على أمة سيفا ولا يتلقنون فنون الحرب بعد.", "groups": [{"kw": "he shall judge", "raw": "1Sa_2:10; Psa_82:8, Psa_96:13, Psa_98:9; Isa_11:3-5, Isa_51:5; Mat_25:31, Mat_25:32; Joh_5:22, Joh_5:23, Joh_5:27-29, Joh_16:8-11; Act_17:31; Rev_19:11", "note": "", "refs": [{"l": "1Sa 2:10", "n": "", "vs": [[10, "مخاصمو الرب يتحطمون، ومن السماء يقذف رعوده عليهم؛ يدين الرب أقاصي الأرض، ويمنح عزة لمن يختاره ملكا ويمجد مسيحه»."]]}, {"l": "Psa 82:8", "n": "", "vs": [[8, "قم ياالله قم. دن الأرض، لأنك أنت تمتلك الأمم بأسرها."]]}, {"l": "Psa 96:13", "n": "", "vs": [[13, "في حضرة الرب لأنه آت ليدين العالم بالعدل والشعوب بالحق."]]}, {"l": "Psa 98:9", "n": "", "vs": [[9, "أمام الرب لأنه جاء ليدين الأرض بالعدل والشعوب بالإنصاف."]]}, {"l": "Isa 11:3-5", "n": "", "vs": [[3, "وتكون مسرته في تقوى الرب، ولا يقضي بحسب ما تشهد عيناه، ولا يحكم بمقتضى ما تسمع أذناه،"], [4, "إنما يقضي بعدل للمساكين، ويحكم بالإنصاف لبائسي الأرض، ويعاقب الأرض بقضيب فمه، ويميت المنافق بنفخة شفتيه،"], [5, "لأنه سيرتدي البر ويتمنطق بالأمانة."]]}, {"l": "Isa 51:5", "n": "", "vs": [[5, "بري بات قريبا، وتجلى خلاصي، وذر اعاي تقضيان للشعوب، وإياي ترتقب الجزائر، وتنتظر برجاء ذراعي."]]}, {"l": "Mat 25:31", "n": "", "vs": [[31, "وعندما يعود ابن الإنسان في مجده ومعه جميع ملائكته، فإنه يجلس على عرش مجده،"]]}, {"l": "Mat 25:32", "n": "", "vs": [[32, "وتجتمع أمامه الشعوب كلها، فيفصل بعضهم عن بعض كما يفصل الراعي الغنم عن المعاز،"]]}, {"l": "Joh 5:22", "n": "", "vs": [[22, "والآب لا يحاكم أحدا، بل أعطى الابن سلطة القضاء كلها،"]]}, {"l": "Joh 5:23", "n": "", "vs": [[23, "ليكرم الجميع الابن كما يكرمون الآب. ومن لا يكرم الابن لا يكرم الآب الذي أرسله."]]}, {"l": "Joh 5:27-29", "n": "", "vs": [[27, "وأعطاه سلطة أن يدين، لأنه ابن الإنسان."], [28, "لا تتعجبوا من هذا: فسوف تأتي ساعة يسمع فيها جميع من في القبور صوته،"], [29, "فيخرجون منها: فالذين عملوا الصالحات يخرجون في القيامة المؤدية إلى الحياة، وأما الذين عملوا السيئات ففي القيامة المؤدية إلى الدينونة."]]}, {"l": "Joh 16:8-11", "n": "", "vs": [[8, "وعندما يجيء يبكت العالم على الخطيئة وعلى البر وعلى الدينونة:"], [9, "أما على الخطيئة، فلأنهم لا يؤمنون بي،"], [10, "وأما على البر، فلأني عائد إلى الآب فلا ترونني بعد؛"], [11, "وأما على الدينونة، فلأن سيد هذا العالم قد صدر عليه حكم الدينونة."]]}, {"l": "Act 17:31", "n": "", "vs": [[31, "لأنه حدد يوما يدين فيه العالم بالعدل على يد رجل اختاره لذلك. وقد قدم للجميع برهانا، إذ أقامه من بين الأموات»."]]}, {"l": "Rev 19:11", "n": "", "vs": [[11, "ثم رأيت السماء مفتوحة، وإذا حصان أبيض يسمى راكبه «الأمين الصادق» الذي يقضي ويحارب بالعدل."]]}], "kwAr": "فيقضي", "noteAr": ""}, {"kw": "and rebuke", "raw": "Mic_5:15, Mic_7:16, Mic_7:17; Psa_2:5-12, Psa_68:30,Psa_68:31, Psa_110:1, Psa_110:2, Psa_110:5, Psa_110:6; Isa_25:3, Isa_60:12; Dan_2:44; Joe_3:2, Joe_3:9-16; Zec_12:3-6, Zec_14:3, Zec_14:12-19; Rev_19:17-21, Rev_20:8, Rev_20:9", "note": "", "refs": [{"l": "Mic 5:15", "n": "", "vs": [[15, "وبغضب وسخط أنتقم من الأمم التي لم تطعني."]]}, {"l": "Mic 7:16", "n": "", "vs": [[16, "فترى الأمم ويخزون من قوتهم ويضعون أيديهم على أفواههم وتصاب آذانهم بالصمم."]]}, {"l": "Mic 7:17", "n": "", "vs": [[17, "ويلحسون التراب كالحية وينسلون من حصونهم مرتعبين كزواحف الأرض، ويرجعون بخوف إلى الرب إلهنا مرتعبين منك."]]}, {"l": "Psa 2:5-12", "n": "", "vs": [[5, "عندئذ ينذرهم في حمو غضبه، ويروعهم بشدة سخطه،"], [6, "قائلاَ: «أما أنا فقد مسحت ملكي، وأجلسته على صهيون، جبلي المقدس»."], [7, "وها أنا أعلن ما قضى به الرب: قال لي الرب: «أنت ابني، أنا اليوم ولدتك."], [8, "اطلب مني فأعطيك الأمم ميراثا، وأقاصي الأرض ملكا لك."], [9, "فتكسرهم بقضيب من حديد، وتحطمهم كآنية الفخار»."], [10, "والآن تعقلوا أيها الملوك، واحذروا ياحكام الأرض."], [11, "اعبدوا الرب بخوف، وابتهجوا برعدة."], [12, "قبلوا الابن لئلا يغضب، فتهلكوا في الطريق، لئلا يتوهج غضبه سريعا. طوبى لجميع المتكلين عليه."]]}, {"l": "Psa 68:30", "n": "", "vs": [[30, "انتهر مصر، الوحش الكامن بين القصب. انتهر الأمم القوية التي تشبه قطيع الثيران؛ حتى يخضعوا ويدفعوا لك جزية فضة. بدد الشعوب المولعة بالحرب."]]}, {"l": "Psa 68:31", "n": "", "vs": [[31, "يفد إليك شرفاء من مصر (ليقدموا الولاء) وتبسط الحبشة يديها مسرعة إعرابا عن خضوعها لله."]]}, {"l": "Psa 110:1", "n": "", "vs": [[1, "قال الرب لربي: «اجلس عن يميني حتى أضع أعداءك موطئا لقدميك»."]]}, {"l": "Psa 110:2", "n": "", "vs": [[2, "يجعل الرب صهيون منطلقا لسلطانك، ويقول: «احكم في وسط أعدائك»."]]}, {"l": "Psa 110:5", "n": "", "vs": [[5, "الرب واقف عن يمينك. في يوم غضبه يحطم ملوكا."]]}, {"l": "Psa 110:6", "n": "", "vs": [[6, "يقضي بين الأمم، فيملأ الأرض الرحبة بجثث رؤسائها."]]}, {"l": "Isa 25:3", "n": "", "vs": [[3, "لذلك يمجدك شعب قوي وتخشاك مدن آهلة بأمم فظة"]]}, {"l": "Isa 60:12", "n": "", "vs": [[12, "لأن الأمة والمملكة التي لا تخضع لك تهلك، وهذه الشعوب تتعرض للخراب الساحق."]]}, {"l": "Dan 2:44", "n": "", "vs": [[44, "وفي عهد هؤلاء الملوك يقيم إله السماوات مملكة لا تنقرض إلى الأبد، ولا يترك ملكها لشعب آخر، وتسحق وتبيد جميع هذه الممالك. أما هي فتخلد إلى الأبد."]]}, {"l": "Joe 3:2", "n": "", "vs": [[2, "أجمع الأمم كلها وأحضرهم إلى وادي يهوشافاط، وأحاكمهم هناك من أجل شعبي وميراثي إسرائيل، لأنهم شتتوهم بين الشعوب واقتسموا أرضي."]]}, {"l": "Joe 3:9-16", "n": "", "vs": [[9, "نادوا بهذا بين الأمم، وتأهبوا للحرب. احشدوا أبطالكم. ليتقدم ويصعد جميع رجال القتال."], [10, "أطرقوا سكك محاريثكم وحولوها إلى سيوف، ومناجلكم إلى رماح، وليقل الضعيف: إنني جبار قتال!"], [11, "أسرعوا وتعالوا من كل ناحية يا كل الأمم، واجتمعوا هناك، وأنزل يارب محاربيك."], [12, "لتنهض الأمم وتقبل إلى وادي القضاء لأنني هناك أجلس لأدين الشعوب المتوافدة من كل جهة."], [13, "احملوا المنجل لأن الحصيد قد نضج. تعالوا ودوسوا فإن معصرة الخمر قد امتلأت، والحياض فاضت بكثرة شرهم."], [14, "جماهير جماهير متزاحمة في وادي القضاء، لأن يوم الرب قريب في وادي القضاء."], [15, "قد أظلمت الشمس والقمر، وكفت الكواكب عن الضياء."], [16, "يزأر الرب في صهيون، ويجلجل بصوته من أورشليم فترجف السماوات والأرض؛ لكن الرب يكون ملجأ لشعبه، وحصنا لبني إسرائيل."]]}, {"l": "Zec 12:3-6", "n": "", "vs": [[3, "في ذلك اليوم أجعل أورشليم كصخرة ثقيلة تعجز عن حملها جميع الشعوب. وكل من يحاول حملها ينشق شقا، ويتألب عليها جميع شعوب الأرض."], [4, "في ذلك اليوم، يقول الرب: أصيب كل فرس من جيوش الأعداء بالرعب، وفارسه بالجنون، وأرعى برضاي شعب يهوذا، وأبتلي جميع خيول الأمم بالعمى."], [5, "فيقول آنئذ رؤساء يهوذا في قلوبهم: إن سكان أورشليم أعزاء بفضل قوة الرب القدير إلههم."], [6, "في ذلك اليوم أجعل عشائر يهوذا كمستوقد نار بين الحطب، أو كمشعل ملتهب بين أكداس الحنطة، فيلتهمون الشعوب من حولهم ممن عن يمينهم وعن يسارهم، بينما تظل أورشليم مستقرة آمنة آهلة في موضعها."]]}, {"l": "Zec 14:3", "n": "", "vs": [[3, "ولا يلبث أن يهب الرب ليحارب تلك الأمم، كما كان يحارب في يوم القتال."]]}, {"l": "Zec 14:12-19", "n": "", "vs": [[12, "وهذا هو البلاء الذي يعاقب به الرب جميع الشعوب الذين اجتمعوا على أورشليم: تتهرأ لحومهم وهم واقفون على أرجلهم، وتتآكل عيونهم في أوقابها، وتتلف ألسنتهم في أفواههم."], [13, "في ذلك اليوم يلقي الرب الرعب في قلوبهم حتى ترتفع يد الرجل ضد يد رفيقه في آن واحد ويهلكان معا."], [14, "ويحارب أبناء يهوذا أيضا دفاعا عن أورشليم، ويغنمون ثروات من الأمم المحيطة بها من ذهب وفضة وأثواب، بوفرة عظيمة."], [15, "ويصيب بلاء مماثل الخيول والبغال والجمال والحمير وسائر البهائم الموجودة داخل هذه المعسكرات."], [16, "فيصعد الناجون من الأمم التي تألبت على أورشليم، سنة بعد سنة ليعبدوا الملك الرب القدير ويحتفلوا بعيد المظال."], [17, "وإن تقاعست أية عشيرة من عشائر أمم الأرض عن الصعود إلى أورشليم لتسجد للملك الرب القدير، يمتنع المطر عن الهطول على ديارهم."], [18, "وإن أبى أهل مصر الصعود للاشتراك في الاحتفال، يحل بهم البلاء الذي يعاقب به الرب الأمم التي لا تجيء للاحتفال بعيد المظال."], [19, "هذا هو عقاب مصر وعقاب سائر الشعوب التي تأبى المجيء للاحتفال بعيد المظال."]]}, {"l": "Rev 19:17-21", "n": "", "vs": [[17, "ثم رأيت ملاكا واقفا في الشمس، ينادي الطيور الطائرة في وسط السماء بصوت عال قائلا: «هلمي اجتمعي معا إلى وليمة الله الكبرى!"], [18, "تعالي والتهمي لحوم الملوك والقادة والأبطال، والخيول وفرسانها، ولحوم البشر جميعا من أحرار وعبيد، وصغار وكبار»."], [19, "ورأيت الوحش وملوك الأرض وجيوشهم وقد احتشدوا ليحاربوا هذا الفارس وجيشه."], [20, "فقبض على الوحش وعلى النبي الدجال الذي قام بالمعجزات في حضور الوحش وأضل بها الذين قبلوا علامة الوحش، وسجدوا لتمثاله. وطرح كلاهما حيا في بحيرة النار والكبريت المتقدة،"], [21, "وقتل السيف الخارج من فم الفارس جميع الباقين، وشبعت الطيور كلها من لحومهم."]]}, {"l": "Rev 20:8", "n": "", "vs": [[8, "فيخرج ليضلل الأمم في زوايا الأرض الأربع، جوج وماجوج، ويجمعهم للقتال، وعددهم كثير جدا كرمل البحر!"]]}, {"l": "Rev 20:9", "n": "", "vs": [[9, "فيصعدون على سهول الأرض العريضة، ويحاصرون من كل جانب معسكر القديسين والمدينة المحبوبة، ولكن نارا من السماء تنزل عليهم وتلتهمهم."]]}], "kwAr": "ويملي أحكامه", "noteAr": ""}, {"kw": "they shall", "raw": "Psa_46:9; Isa_2:4, Isa_11:6-9; Hos_2:18; Joe_3:10; Zec_9:10", "note": "", "refs": [{"l": "Psa 46:9", "n": "", "vs": [[9, "يقضي على الحروب في الأرض كلها. يكسر القوس ويشق الرمح، ويحرق المركبات الحربية بالنار."]]}, {"l": "Isa 2:4", "n": "", "vs": [[4, "فيقضي بين الأمم ويحكم بين الشعوب الكثيرة، فيطبعون سيوفهم محاريث ورماحهم مناجل، ولا ترفع أمة على أمة سيفا، ولا يتدربون على الحرب فيما بعد."]]}, {"l": "Isa 11:6-9", "n": "", "vs": [[6, "فيسكن الذئب مع الحمل، ويربض النمر إلى جوار الجدي، ويتآلف العجل والأسد وكل حيوان معلوف معا، ويسوقها جميعا صبي صغير."], [7, "ترعى البقرة والدب معا، ويربض أولادهما متجاورين، ويأكل الأسد التبن كالثور،"], [8, "ويلعب الرضيع في (أمان) عند جحر الصل، ويمد الفطيم يده إلى وكر الأفعى (فلا يصيبه سوء)."], [9, "لا يؤذون ولا يسيئون في كل جبل قدسي، لأن الأرض تمتليء من معرفة الرب كما تغمر المياه البحر."]]}, {"l": "Hos 2:18", "n": "", "vs": [[18, "وأبرم في ذلك اليوم من أجلك عهدا مع وحش البرية وطيور السماء وزواحف الأرض وأحطم القوس والسيف، وأبطل الحرب من الأرض، وأجعلك تنامين مطمئنة"]]}, {"l": "Joe 3:10", "n": "", "vs": [[10, "أطرقوا سكك محاريثكم وحولوها إلى سيوف، ومناجلكم إلى رماح، وليقل الضعيف: إنني جبار قتال!"]]}, {"l": "Zec 9:10", "n": "", "vs": [[10, "وأستأصل المركبات الحربية من أفرايم، والخيل من أورشليم، وتبيد أقواس القتال، ويشيع السلام بين الأمم، ويمتد ملكه من البحر إلى البحر، ومن نهر الفرات إلى أقاصي الأرض."]]}], "kwAr": "فيصنعون", "noteAr": ""}, {"kw": "pruninghooks", "raw": "or, scythes", "note": "or, scythes", "refs": [], "kwAr": "مناجل حصاد", "noteAr": "أو: «مناجل»."}, {"kw": "neither", "raw": "Psa_72:7; Isa_9:7, Isa_60:17, Isa_60:18, Isa_65:25", "note": "", "refs": [{"l": "Psa 72:7", "n": "", "vs": [[7, "ليزدهر في أيامه الصديق، ويتوافر السلام مادام القمر يضيء."]]}, {"l": "Isa 9:7", "n": "", "vs": [[7, "ولا تكون نهاية لنمو رياسته وللسلام اللذين يسودان عرش داود ومملكته، ليثبتها ويعضدها بالحق والبر، من الآن وإلى الأبد. إن غيرة الرب القدير تتمم هذا."]]}, {"l": "Isa 60:17", "n": "", "vs": [[17, "وعوضا عن النحاس أجلب لك الذهب، وبدل الحديد آتي لك بالفضة، وعوض الخشب نحاسا، وبدل الحجارة حديدا، وأجعل ولاتك مصدر سلام، ومسخريك يعاملونك بالعدل."]]}, {"l": "Isa 60:18", "n": "", "vs": [[18, "ولا يسمع بظلم في أرضك، ولا بدمار أو خراب داخل تخومك، وتدعين أسوارك خلاصا، وبواباتك تسابيح."]]}, {"l": "Isa 65:25", "n": "", "vs": [[25, "ويرعى الذئب والحمل معا، ويأكل الأسد التبن كالبقر، وتأكل الحية التراب. لا يؤذون ولا يهلكون في كل جبل قدسي، يقول الرب."]]}], "kwAr": "ولا يتلقنون", "noteAr": ""}], "arS": [["فيقضي", ["H8199"]], [" ", []], ["بين", ["H996"]], [" ", []], ["الأمم", ["H5971"]], [" ", []], ["الكثيرة", ["H7227"]], [" ", []], ["ويملي", ["H3198"]], [" أحكامه بعدل على ", []], ["أمم", ["H1471"]], [" ", []], ["قوية", ["H6099"]], [" ", []], ["بعيدة", ["H5704", "H7350"]], ["، ", []], ["فيصنعون", ["H3807"]], [" من ", []], ["سيوفهم", ["H2719"]], [" ", []], ["أسنة", ["H855"]], [" محاريث، ومن ", []], ["رماحهم", ["H2595"]], [" ", []], ["مناجل", ["H4211"]], [" حصاد، ", []], ["فلا", ["H3808"]], [" ", []], ["ترفع", ["H5375"]], [" ", []], ["أمة", ["H1471"]], [" ", []], ["على", ["H413"]], [" ", []], ["أمة", ["H1471"]], [" ", []], ["سيفا", ["H2719"]], [" ", []], ["ولا", ["H3808"]], [" ", []], ["يتلقنون", ["H3925"]], [" فنون ", []], ["الحرب", ["H4421"]], [" ", []], ["بعد", ["H5750"]], [".", []]]}, {"c": 4, "v": 4, "text": "بل يجلس كل رجل تحت كرمه وتحت شجرة تينته ولا يرعبهم شيء من بعد، لأن هذا ما تكلم به الرب القدير.", "groups": [{"kw": "But", "raw": "The connection of this prophecy with the close of the preceding chapter shews that the establishment of the Christian Church, in consequence of the abrogation of the Mosaic dispensation, and the destruction of Jerusalem by the Romans, was intended. But, though it has in a measure been fulfilling ever since these events, yet its grand accomplishment must still be future.", "note": "The connection of this prophecy with the close of the preceding chapter shews that the establishment of the Christian Church, in consequence of the abrogation of the Mosaic dispensation, and the destruction of Jerusalem by the Romans, was intended. But, though it has in a measure been fulfilling ever since these events, yet its grand accomplishment must still be future.", "refs": [], "kwAr": "بل", "noteAr": "يدل اتصال هذه النبوة بخاتمة الأصحاح السابق على أن المقصود تأسيس الكنيسة المسيحية بعد إبطال الشريعة الموسوية وخراب أورشليم على يد الرومان. ومع أنها تتحقق إلى حد ما منذ تلك الأحداث، فإن تمامها الأعظم لا يزال في المستقبل."}, {"kw": "they", "raw": "1Ki_4:25; Isa_26:16; Zec_3:10", "note": "", "refs": [{"l": "1Ki 4:25", "n": "", "vs": [[25, "وتمتع إسرائيل ويهوذا بالأمن طوال حياة سليمان، فكان كل واحد يستمتع بالجلوس تحت ظلال كرمته وتينته من دان إلى بئر سبع"]]}, {"l": "Isa 26:16", "n": "", "vs": [[16, "يارب قد طلبوك في المحنة، وسكبوا دعاءهم عند تأديبك لهم،"]]}, {"l": "Zec 3:10", "n": "", "vs": [[10, "ويقول الرب القدير: «في ذلك اليوم يدعو كل منكم صديقه ليستريح تحت كرمته وفي ظل تينته»."]]}], "kwAr": "يجلس", "noteAr": ""}, {"kw": "none", "raw": "Isa_54:14; Jer_23:5, Jer_23:6; Eze_34:25, Eze_34:28, Eze_38:11, Eze_39:26", "note": "", "refs": [{"l": "Isa 54:14", "n": "", "vs": [[14, "بالبر يتم ترسيخك، وتكونين بعيدة عن كل ضيق فلن تخافي، ونائية عن الرعب لأنه لن يقترب منك."]]}, {"l": "Jer 23:5", "n": "", "vs": [[5, "ها أيام مقبلة أقيم فيها لداود ذرية بر، ملكا يسود بحكمة، ويجري في الأرض عدلا وحقا."]]}, {"l": "Jer 23:6", "n": "", "vs": [[6, "في عهده يتم خلاص شعب يهوذا، ويسكن شعب إسرائيل آمنا. أما الاسم الذي سيدعى به فهو: الرب برنا."]]}, {"l": "Eze 34:25", "n": "", "vs": [[25, "وأبرم معهم ميثاق سلام، وأقضي على الوحوش الضارية في الأرض فيقيمون في الصحراء آمنين، وينامون في الغابات مطمئنين."]]}, {"l": "Eze 34:28", "n": "", "vs": [[28, "فلا يكونون بعد غنيمة للأمم، ولا يفترسهم وحش الأرض، بل يسكنون آمنين لا يفزعهم أحد."]]}, {"l": "Eze 38:11", "n": "", "vs": [[11, "فتقول: أزحف على أرض عراء مكشوفة وأهاجم المطمئنين الساكنين في أمن، المقيمين كلهم من غير سور يقيهم، وليس لديهم مزاليج ولا مصاريع،"]]}, {"l": "Eze 39:26", "n": "", "vs": [[26, "فينسون عارهم وخيانتهم التي ارتكبوها بحقي بعد أن أسكنهم في أرضهم مطمئنين لا يفزعهم أحد."]]}], "kwAr": "ولا يرعبهم", "noteAr": ""}, {"kw": "for", "raw": "Isa_1:20, Isa_40:5, Isa_58:14", "note": "", "refs": [{"l": "Isa 1:20", "n": "", "vs": [[20, "ولكن إن أبيتم وتمردتم فالسيف يلتهمكم، لأن فم الرب قد تكلم."]]}, {"l": "Isa 40:5", "n": "", "vs": [[5, "ويتجلى مجد الله، فيشاهده كل ذي جسد، لأن فم الرب قد تكلم»."]]}, {"l": "Isa 58:14", "n": "", "vs": [[14, "عندئذ تبتهج بالرب، وأجعلك تمتطي مرتفعات الأرض، وأنعم عليك بمير اث يعقوب أبيك، لأن فم الرب قد تكلم."]]}], "kwAr": "لأن هذا", "noteAr": ""}], "arS": [["بل ", []], ["يجلس", ["H3427"]], [" ", []], ["كل", ["H376"]], [" رجل ", []], ["تحت", ["H8478"]], [" ", []], ["كرمه", ["H1612"]], [" ", []], ["وتحت", ["H8478"]], [" شجرة ", []], ["تينته", ["H8384"]], [" ", []], ["ولا", ["H369"]], [" ", []], ["يرعبهم", ["H2729"]], [" شيء من بعد، ", []], ["لأن", ["H3588"]], [" هذا ما ", []], ["تكلم", ["H1696"]], [" به ", []], ["الرب", ["H3068"]], [" ", []], ["القدير", ["H6635"]], [".", []]]}, {"c": 4, "v": 5, "text": "فإن جميع الأمم تسلك باسم إلهها، أما نحن فنسلك باسم الرب إلهنا إلى أبد الآبدين.", "groups": [{"kw": "all", "raw": "2Ki_17:29, 2Ki_17:34; Jer_2:10,Jer_2:11", "note": "", "refs": [{"l": "2Ki 17:29", "n": "", "vs": [[29, "ومع ذلك ظل كل قوم يصنعون آلهتهم وينصبونها في معابد المرتفعات التي شيدها السامريون في المدن التي يقيمون فيها."]]}, {"l": "2Ki 17:34", "n": "", "vs": [[34, "فهم إلى هذا اليوم، يمارسون طقوسهم الأولى. فأصبحت عبادتهم خليطا من تقوى الرب ومن الطقوس والفرائض الوثنية، وفقا لتقاليدهم، وليس بمقتضى شريعة الرب والوصية التي أمر بها ذرية يعقوب الذي حول اسمه إلى إسرائيل."]]}, {"l": "Jer 2:10", "n": "", "vs": [[10, "فاعبروا إلى جزيرة قبرص والسواحل الغربية، وأرسلوا إلى قيدار، وتفحصوا جيدا، وانظروا: هل جرى مثل هذا؟"]]}, {"l": "Jer 2:11", "n": "", "vs": [[11, "هل استبدلت أمة آلهتها مع أنها ليست حقا آلهة؟ أما شعبي فاستبدل مجده بما لا جدوى منه."]]}], "kwAr": "جميع الأمم", "noteAr": ""}, {"kw": "and we", "raw": "Gen_17:1; Psa_71:16; Isa_2:5; Zec_10:12; Col_2:6, Col_3:17", "note": "", "refs": [{"l": "Gen 17:1", "n": "", "vs": [[1, "وعندما كان أبرام في التاسعة والتسعين من عمره، ظهر له الرب قائلا: «أنا هو الله القدير. سر أمامي وكن كاملا،"]]}, {"l": "Psa 71:16", "n": "", "vs": [[16, "أجيء (مؤيدا) بقوة السيد الرب، لأذكر برك وحدك."]]}, {"l": "Isa 2:5", "n": "", "vs": [[5, "يابيت يعقوب، هيا لنسلك في نور الرب."]]}, {"l": "Zec 10:12", "n": "", "vs": [[12, "وأشددهم بالرب فيسلكون بمقتضى n": "", "vs": [[17, "لأني أكاد أتعثر، ووجعي دائما أمام ناظري."]]}, {"l": "Isa 35:3-6", "n": "", "vs": [[3, "شددوا الأيدي المسترخية، وثبتوا الركب المرتعشة."], [4, "قولوا لذوي القلوب الخائرة: «تقووا ولا تفزعوا، فها هو إلهكم قادم، مقبل بالنقمة، حامل جزاءه. سيأتي ويخلصكم»."], [5, "عندئذ تبصر عيون المكفوفين وتنفتح أذان الصم،"], [6, "ويطفر الأعرج كالظبي، ويترنم لسان الأبكم فرحا، إذ تنفجر المياه في البرية، وتتدفق الجداول في الصحراء،"]]}, {"l": "Jer 31:8", "n": "", "vs": [[8, "ها أنا آتي بهم من بلاد الشمال، وأجمعهم من أقصى أطراف الأرض، وفيهم الأعمى والأعرج، الحبلى والماخض، فيرجع حشد عظيم إلى هنا."]]}, {"l": "Eze 34:13-17", "n": "", "vs": [[13, "وأخرجه من بين الشعوب وأجمعه من البلدان، وأرده إلى أرضه، حيث أرعاه على جبال إسرائيل وفي الأودية وفي جميع أماكن الأرض الآهلة."], [14, "وأرعاه في مروج خصيبة، وتكون جبال إسرائيل الشاهقة مراعي رائعة يربضون في مراحها الطيب، ويرعون في مراع خصيبة على جبال إسرائيل."], [15, "أنا أرعى غنمي وأربضها يقول السيد الرب،"], [16, "وأطلب الضال وأسترجع المطرود وأجبر الكسير وأعصب الجريح وأستأصل السمين والقوي، وأرعاها بعدل."], [17, "أما أنتم ياغنمي فها أنا أقضي بين شاة وشاة، وبين كباش وتيوس."]]}, {"l": "Zep 3:19", "n": "", "vs": [[19, "في ذلك الوقت أعاقب الذين ضايقوك، وأخلص الأعرج، وأعيد المسبي، وأغدق عليهم مدحا وشرفا في كل أرض تعرضوا فيها للخزي."]]}, {"l": "Heb 12:12", "n": "", "vs": [[12, "لذلك، شددوا أيديكم المرتخية، وركبكم المنحلة."]]}, {"l": "Heb 12:13", "n": "", "vs": [[13, "ومهدوا لأقدامكم طرقا مستقيمة، حتى لا تنحرف أرجل العرج، بل تشفى!"]]}], "kwAr": "أجمع", "noteAr": ""}, {"kw": "and I", "raw": "Psa_147:2; Isa_56:8; Jer_3:18, Jer_30:17, Jer_30:18; Eze_34:12, Eze_34:13, Eze_36:24; Eze_37:21, Eze_37:22, Eze_39:25-29; Luk_19:10; Joh_10:16", "note": "", "refs": [{"l": "Psa 147:2", "n": "", "vs": [[2, "يبني الرب أورشليم، ويجمع شمل المنفيين من إسرائيل."]]}, {"l": "Isa 56:8", "n": "", "vs": [[8, "وهذا ما يقوله السيد الرب الذي يلم شتات إسرائيل: سأجمع إليه آخرين بعد، فضلا عن الذين جمعتهم."]]}, {"l": "Jer 3:18", "n": "", "vs": [[18, "وتنضم في تلك الأيام ذرية يهوذا إلى ذرية إسرائيل ويأتون معا من أرض الشمال إلى الديار التي أورثتها لآبائهم."]]}, {"l": "Jer 30:17", "n": "", "vs": [[17, "لأني أرد لك عافيتك وأبريء جراحك، يقول الرب، لأنك دعيت منبوذة، صهيون التي لا يعبأ بها أحد»."]]}, {"l": "Jer 30:18", "n": "", "vs": [[18, "وهذا ما يعلنه الرب: «ها أنا أرد سبي ذرية يعقوب إلى منازلهم، وأرحم مساكنهم، فتبنى المدينة على رابيتها، وينتصب القصر كالعهد به."]]}, {"l": "Eze 34:12", "n": "", "vs": [[12, "وكما يتفقد الراعي قطيعه في اليوم الذي يكون فيه بين غنمه المشتتة، هكذا أتفقد قطيعي وأخلصه من كل الأماكن التي تفرق إليها في يوم غائم كئيب."]]}, {"l": "Eze 34:13", "n": "", "vs": [[13, "وأخرجه من بين الشعوب وأجمعه من البلدان، وأرده إلى أرضه، حيث أرعاه على جبال إسرائيل وفي الأودية وفي جميع أماكن الأرض الآهلة."]]}, {"l": "Eze 36:24", "n": "", "vs": [[24, "إذ آخذكم من بين الأمم وأجمعكم من كل البلدان وأحضركم إلى أرضكم،"]]}, {"l": "Eze 37:21", "n": "", "vs": [[21, "وها أنا أحشد أبناء إسرائيل من بين الأمم التي تفرقوا فيها وأجمعهم من كل جهة وأحضرهم إلى أرضهم."]]}, {"l": "Eze 37:22", "n": "", "vs": [[22, "وأجعلهم أمة واحدة في الأرض وعلى الجبال، تحت رئاسة ملك واحد، فلا يكونون بعد أمتين، ولا ينقسمون إلى مملكتين."]]}, {"l": "Eze 39:25-29", "n": "", "vs": [[25, "أما الآن فها أنا أرد سبي ذرية يعقوب وأرحم كل شعب إسرائيل وأغار على اسمي القدوس،"], [26, "فينسون عارهم وخيانتهم التي ارتكبوها بحقي بعد أن أسكنهم في أرضهم مطمئنين لا يفزعهم أحد."], [27, "عندما أستردهم من بين الشعوب وأجمعهم من بلدان أعدائهم وأتقدس فيهم أمام عيون الأمم الكثيرة،"], [28, "فيدركون أني أنا الرب إلههم، إذ نفيتهم إلى الأمم، ثم عدت وجمعتهم إلى أرضهم، من غير أن أبقي هناك منهم أحدا من بعد."], [29, "ولا أعود أحجب وجهي عنهم لأني أسكب روحي على شعب إسرائيل يقول السيد الرب»."]]}, {"l": "Luk 19:10", "n": "", "vs": [[10, "فإن ابن الإنسان قد جاء ليبحث عن الهالكين ويخلصهم»."]]}, {"l": "Joh 10:16", "n": "", "vs": [[16, "ولي خراف أخرى لا تنتمي إلى هذه الحظيرة، لا بد أن أجمعها إلي أيضا، فتصغي لصوتي؛ فيكون هناك قطيع واحد وراع واحد."]]}], "kwAr": "وأضم", "noteAr": ""}], "arS": [["في ", []], ["ذلك", ["H1931"]], [" ", []], ["اليوم", ["H3117"]], ["، ", []], ["يقول", ["H5002"]], [" ", []], ["الرب", ["H3068"]], ["، ", []], ["أجمع", ["H622"]], [" ", []], ["العرج", ["H6760"]], ["، ", []], ["وأضم", ["H6908"]], [" ", []], ["المطرودين", ["H5080"]], [" وكل الذين ", []], ["أنزلت", ["H7489"]], [" بهم البلاء.", []]]}, {"c": 4, "v": 7, "text": "فأجعل من العرج بقية، ومن المنبوذين أمة قوية، فيملك الرب عليهم في جبل صهيون من الآن وإلى الأبد.", "groups": [{"kw": "I will", "raw": "Mic_2:12, Mic_5:3, Mic_5:7, Mic_5:8, Mic_7:18; Isa_6:13, Isa_10:21, Isa_10:22, Isa_11:11-16, Isa_49:21-23, Isa_60:22; Isa_66:8; Hos_1:10; Zec_9:13-17, Zec_10:5-12; Rom_11:5, Rom_11:6, Rom_11:25-27", "note": "", "refs": [{"l": "Mic 2:12", "n": "", "vs": [[12, "سأجمع شتاتك جميعا يايعقوب، وأجمع بقية إسرائيل وأضمهم معا كقطيع غنم في حظيرة، مثل قطيع محتشد في مرعى، فترتفع جلبة جمهورهم."]]}, {"l": "Mic 5:3", "n": "", "vs": [[3, "لذلك يسلم الرب شعبه إلى أعدائهم إلى أن تلد من تقاسي من المخاض، عندئذ ترجع بقية إخوته من السبي إلى شعب إسرائيل."]]}, {"l": "Mic 5:7", "n": "", "vs": [[7, "عندئذ تغدو بقية ذرية يعقوب بين الأمم الكثيرة كندى من لدن الرب، كالمطر الوابل على العشب الذي لا يتوانى من أجل الناس أو يرجو أبناء البشر."]]}, {"l": "Mic 5:8", "n": "", "vs": [[8, "وتكون بقية ذرية يعقوب بين الشعوب الكثيرة كأسد بين وحوش الغابة، أو كشبل بين قطعان الغنم، الذي إن اقتحم يدوس ويفترس وليس من منقذ."]]}, {"l": "Mic 7:18", "n": "", "vs": [[18, "إي إله مثلك يصفح عن الإثم ويعفو عن معصية بقية ميراثه؟ لا يحتفظ إلى الأبد بغضبه لأنه يسر بالرحمة."]]}, {"l": "Isa 6:13", "n": "", "vs": [[13, "وحتى لو بقي بعد ذلك عشر أهلها، فإنها ستحرق ثانية، ولكنها تكون كالبطمة والبلوطة، التي وإن قطعت يبقى ساقها قائما: هكذا يبقى ساقها زرعا مقدسا»."]]}, {"l": "Isa 10:21", "n": "", "vs": [[21, "وترجع بقية ذرية يعقوب إلى الرب القدير."]]}, {"l": "Isa 10:22", "n": "", "vs": [[22, "مع أن شعبك ياإسرائيل كرمل البحر، فإن بقية فقط ترجع، لأن الله قضى بفنائهم، وقضاؤه عادل."]]}, {"l": "Isa 11:11-16", "n": "", "vs": [[11, "فيعود الرب ليمد يده ثانية ليسترد البقية الباقية من شعبه، من أشور ومصر وفتروس وكوش وعيلام وشنعار وحماة، ومن جزائر البحر،"], [12, "وينصب راية للأمم ويجمع منفيي إسرائيل ومشتتي يهوذا من أربعة أطراف الأرض،"], [13, "فيتلاشى حسد أفرايم، وتزول عداوة يهوذا، فلا أفرايم يحسد يهوذا، ولا يهوذا يعادي أفرايم،"], [14, "وينقضان على أكتاف الفلسطينيين غربا ويغزوان أبناء المشرق معا، ويستوليان على بلاد أدوم وموآب، ويخضع لهم بنو عمون."], [15, "ويجفف الرب تماما لسان بحر مصر، ويهز يده على النهر فتهب ريح عاصفة تقسم ماءه إلى سبع ممرات تعبر فيها الجيوش."], [16, "ويمد الرب طريقا من أشور ليعود منه من بقي هناك من بني إسرائيل، كما أعاد الرب جميع إسرائيل من مصر."]]}, {"l": "Isa 49:21-23", "n": "", "vs": [[21, "فتسألين نفسك: من أنجب لي هؤلاء وأنا ثكلى وعاقر، منفية ومنبوذة؟ من ربى لي هؤلاء؟ فقد تركت وحدي، أما هؤلاء فمن أين جاءوا؟"], [22, "وهذا ما يقوله السيد الرب: ها أنا أرفع يدي إلى الأمم وأنصب رايتي إلى الشعوب، فيحملون أبناءك في أحضانهم وبناتك على أكتافهم."], [23, "يكون لك الملوك آباء مربين، وملكاتهم مرضعات، ينحنون أمامك بوجوه مطرقة إلى الأرض، ويلحسون تراب قدميك. عندئذ تدركين أنني أنا الرب، وكل من يتكل علي لا يخزى»."]]}, {"l": "Isa 60:22", "n": "", "vs": [[22, "ويضحى أقلهم ألفا، وأصغرهم أمة قوية، أنا الرب أسرع في تحقيق ذلك في حينه."]]}, {"l": "Isa 66:8", "n": "", "vs": [[8, "من سمع مثل هذا، ومن رأى نظيره؟ أتولد بلاد في يوم واحد؟ أم تخلق أمة دفعة واحدة؟ فما إن تمخضت صهيون حتى أنجبت أبناءها."]]}, {"l": "Hos 1:10", "n": "", "vs": [[10, "ومع ذلك فإن عدد بني إسرائيل يكون كرمل البحر الذي لا يكال ولا يحصى. وفي الموضع الذي قيل لهم فيه: أنتم لستم شعبي، يقال لهم: أنتم أبناء الله الحي."]]}, {"l": "Zec 9:13-17", "n": "", "vs": [[13, "ها أنا أوتر يهوذا كقوس وأجعل أفرايم كسهم وأثير رجال صهيون على أبناء اليونان فتكونين كسيف جبار."], [14, "ثم يتجلى الرب، وينفذ سهمه كالبرق. ينفخ السيد الرب بالبوق ويقتحم في زوابع الجنوب."], [15, "يقيهم الرب القدير فلا تنالهم حجارة المقلاع، بل تقصر عنهم ويطأونها، ويشربون (من دماء أعدائهم) ويصخبون كالسكارى من الخمر ويمتلئون كمناضح المحرقات وزوايا المذبح."], [16, "في ذلك اليوم يخلصهم الرب إلههم لأنهم شعبه قطيعه، ويتألقون في أرضه كحجارة كريمة مرصعة في تاج."], [17, "فما أجملهم وما أبهاهم! الحنطة تجعل الفتيان أكثر ازدهارا، والخمرة تجعل الفتيات أكثر نضرة»."]]}, {"l": "Zec 10:5-12", "n": "", "vs": [[5, "ويدوسون الأعداء معا كما يدوس الجبابرة الطين في الشوارع، ويحاربون لأن الرب معهم فيلحقون العار بفرسان الأعداء."], [6, "إني أشدد شعب يهوذا وأخلص ذرية يوسف وأردهم إلى أرضهم لأني أكن لهم الرحمة، فيكونون كأني لم أنبذهم لأني أنا الرب إلههم فأستجيبهم."], [7, "ويصبح شعب إسرائيل كجبابرة الحرب، وتنتشي قلوبهم كمن شرب خمرة، ويشهد أبناؤهم هذا ويفرحون، وتبتهج نفوسهم بالرب."], [8, "أصدر إشارتي لهم فأجمع شتاتهم، لأني افتديتهم، ويكثرون كما في الحقب الأولى."], [9, "مع أني بددتهم بين الأمم، فإنهم يظلون يذكرونني في المنافي البعيدة، ويحيون مع أولادهم ويرجعون."], [10, "سأردهم إلى موطنهم من ديار مصر، وأجمع شتاتهم من أشور، وآتي بهم إلى أرض جلعاد ولبنان حتى لا يبقى متسع لهم بعد."], [11, "يجتازون عبر بحر المشقات، فتنحسر الأمواج وتجف لجج النيل. تذل كبرياء أشور ويزول صولجان مصر."], [12, "وأشددهم بالرب فيسلكون بمقتضى اسمه، يقول الرب."]]}, {"l": "Rom 11:5", "n": "", "vs": [[5, "فكذلك، في الزمان الحاضر، ماتزال بقية اختارها الله بالنعمة."]]}, {"l": "Rom 11:6", "n": "", "vs": [[6, "ولكن، بما أن ذلك قد تم بالنعمة، فليس بعد على أساس الأعمال، وإلا فليست النعمة نعمة بعد."]]}, {"l": "Rom 11:25-27", "n": "", "vs": [[25, "فإني لا أريد، أيها الإخوة، أن يخفى عليكم هذا السر، لكي لا تكونوا حكماء في نظر أنفسكم، وهو أن العمى قد أصاب إسرائيل جزئيا إلى أن يتم دخول الأمم كليا."], [26, "وهكذا، سوف يخلص جميع إسرائيل، وفقا لما قد كتب: «إن المنقذ سيطلع من صهيون ويرد الإثم عن يعقوب."], [27, "وهذا هو العهد مني لهم حين أزيل خطاياهم»."]]}], "kwAr": "فأجعل", "noteAr": ""}, {"kw": "and the", "raw": "Psa_2:6; Isa_9:6, Isa_9:7, Isa_24:23; Dan_7:14, Dan_7:27; Joe_3:17; Luk_1:33; Rev_11:15", "note": "", "refs": [{"l": "Psa 2:6", "n": "", "vs": [[6, "قائلاَ: «أما أنا فقد مسحت ملكي، وأجلسته على صهيون، جبلي المقدس»."]]}, {"l": "Isa 9:6", "n": "", "vs": [[6, "لأنه يولد لنا ولد ويعطى لنا ابن يحمل الرياسة على كتفه، ويدعى اسمه عجيبا، مشيرا، إلها قديرا، أبا أبديا، رئيس السلام."]]}, {"l": "Isa 9:7", "n": "", "vs": [[7, "ولا تكون نهاية لنمو رياسته وللسلام اللذين يسودان عرش داود ومملكته، ليثبتها ويعضدها بالحق والبر، من الآن وإلى الأبد. إن غيرة الرب القدير تتمم هذا."]]}, {"l": "Isa 24:23", "n": "", "vs": [[23, "ثم يخجل القمر وتخزى الشمس، لأن الرب القدير يملك على جبل صهيون وفي أورشليم، ويتمجد أمام شيوخ شعبه."]]}, {"l": "Dan 7:14", "n": "", "vs": [[14, "فأنعم عليه بسلطان ومجد وملكوت لتتعبد له كل الشعوب والأمم من كل لسان. سلطانه سلطان أبدي لا يفنى، وملكه لا ينقرض."]]}, {"l": "Dan 7:27", "n": "", "vs": [[27, "وتوهب المملكة والسلطان وعظمة الممالك القائمة تحت كل السماء إلى شعب قديسي العلي، فيكون ملكوت العلي ملكوتا أبديا، وتعبده جميع السلاطين ويطيعونه."]]}, {"l": "Joe 3:17", "n": "", "vs": [[17, "فتدركون أني أنا هو الرب إلهكم الساكن في صهيون جبلي المقدس، وتكون أورشليم مقدسة ولا يجتاز فيها الغرباء أبدا."]]}, {"l": "Luk 1:33", "n": "", "vs": [[33, "فيملك على بيت يعقوب إلى الأبد، ولن يكون لملكه نهاية»."]]}, {"l": "Rev 11:15", "n": "", "vs": [[15, "ونفخ الملاك السابع في بوقه فسمعت أصوات عالية في السماء تقول: «قد صار ملك العالم لربنا ومسيحه. إنه يملك إلى أبد الآبدين»."]]}], "kwAr": "فيملك الرب", "noteAr": ""}], "arS": [["فأجعل", ["H7760"]], [" من ", []], ["العرج", ["H6760"]], [" ", []], ["بقية", ["H7611"]], ["، ومن ", []], ["المنبوذين", ["H1972"]], [" ", []], ["أمة", ["H1471"]], [" ", []], ["قوية", ["H6099"]], ["، ", []], ["فيملك", ["H4427"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["عليهم", ["H5921"]], [" في ", []], ["جبل", ["H2022"]], [" ", []], ["صهيون", ["H6726"]], [" من ", []], ["الآن", ["H4480", "H6258"]], [" وإلى ", []], ["الأبد", ["H5704", "H5769"]], [".", []]]}, {"c": 4, "v": 8, "text": "أما أنت يابرج القطيع، ياتلة ابنة صهيون، إليك يعود الحكم الأول، ملك ابنة أورشليم.", "groups": [{"kw": "O tower", "raw": "The Targumist applies these words to the Messiah: But thou, O Messiah, who art hidden because of the sins of the congregation of Zion, the kingdom shall come unto thee. Psa_48:12, Psa_48:13; Isa_5:2; Mat_21:33; Mar_12:1", "note": "The Targumist applies these words to the Messiah: But thou, O Messiah, who art hidden because of the sins of the congregation of Zion, the kingdom shall come unto thee. Psa_48:12, Psa_48:13; Isa_5:2; Mat_21:33; Mar_12:1", "refs": [{"l": "Psa 48:12", "n": "", "vs": [[12, "جولوا في صهيون ودوروا حولها. عدوا أبراجها."]]}, {"l": "Psa 48:13", "n": "", "vs": [[13, "تفرسوا في متاريسها وتأملوا قصور ها لتخبروا بها الأجيال القادمة."]]}, {"l": "Isa 5:2", "n": "", "vs": [[2, "حرث أرضه ونقاه من الحجارة، وغرس فيه أفضل كرمة، وشيد في وسطه برجا، ونقر في الصخر معصرة. ثم انتظر أن يثمر له عنبا فأنتج له حصرما!"]]}, {"l": "Mat 21:33", "n": "", "vs": [[33, "اسمعوا مثلا آخر: غرس إنسان رب بيت كرما، وأقام حوله سياجا، وحفر فيه معصرة، وبنى فيه برج حراسة. ثم سلم الكرم إلى مزارعين وسافر."]]}, {"l": "Mar 12:1", "n": "", "vs": [[1, "وأخذ يخاطبهم بأمثال، فقال: «غرس إنسان كرما، وأقام حوله سياجا، وحفر فيه حوض معصرة، وبنى فيه برج حراسة. ثم سلم الكرم إلى مزارعين، وسافر."]]}], "kwAr": "يابرج", "noteAr": "يطبق الترجوم هذه الكلمات على المسيّا: «وأنت يا مسيّا المحتجب بسبب خطايا جماعة صهيون، إليك يأتي الملك». انظر مز 48: 12، 13؛ إش 5: 2؛ مت 21: 33؛ مر 12: 1"}, {"kw": "the flock", "raw": "or, Edar, Gen_35:21", "note": "or, Edar, Gen_35:21", "refs": [{"l": "Gen 35:21", "n": "", "vs": [[21, "وتابع إسرائيل رحيله ونصب خيامه وراء «برج عدر»"]]}], "kwAr": "القطيع", "noteAr": "أو: «عدر». انظر تك 35: 21"}, {"kw": "the strong", "raw": "2Sa_5:7; Isa_10:32; Zec_9:12", "note": "", "refs": [{"l": "2Sa 5:7", "n": "", "vs": [[7, "غير أن داود استولى على حصن صهيون المعروف الآن بمدينة داود."]]}, {"l": "Isa 10:32", "n": "", "vs": [[32, "اليوم يتوقف في نوب ويهز قبضته على جبل بنت صهيون، أكمة أورشليم."]]}, {"l": "Zec 9:12", "n": "", "vs": [[12, "ارجعوا إلى الحصن ياأسرى الرجاء، فأنا أعلن اليوم أني أضاعف لكم الأجر لقاء ما عانيتم من ويلات."]]}], "kwAr": "ياتلة", "noteAr": ""}, {"kw": "the first", "raw": "Num_24:19; Dan_2:44, Dan_7:18; Oba_1:21; Zec_9:10; Eph_1:21; Rev_22:5", "note": "", "refs": [{"l": "Num 24:19", "n": "", "vs": [[19, "ويبرز حاكم من يعقوب فيدمر ما تبقى من مدن (الأعداء)»."]]}, {"l": "Dan 2:44", "n": "", "vs": [[44, "وفي عهد هؤلاء الملوك يقيم إله السماوات مملكة لا تنقرض إلى الأبد، ولا يترك ملكها لشعب آخر، وتسحق وتبيد جميع هذه الممالك. أما هي فتخلد إلى الأبد."]]}, {"l": "Dan 7:18", "n": "", "vs": [[18, "غير أن قديسي العلي يستولون على المملكة ويتملكونها إلى أبد الآبدين."]]}, {"l": "Oba 1:21", "n": "", "vs": [[21, "ويصعد المنقذون إلى جبل صهيون ليحكموا جبل عيسو، ويصبح الملك للرب."]]}, {"l": "Zec 9:10", "n": "", "vs": [[10, "وأستأصل المركبات الحربية من أفرايم، والخيل من أورشليم، وتبيد أقواس القتال، ويشيع السلام بين الأمم، ويمتد ملكه من البحر إلى البحر، ومن نهر الفرات إلى أقاصي الأرض."]]}, {"l": "Eph 1:21", "n": "", "vs": [[21, "أرفع جدا من كل رئاسة وسلطة وقوة وسيا دة، ومن كل اسم يسمى، لا في هذا العالم وحسب، بل في ذلك الآتي أيضا."]]}, {"l": "Rev 22:5", "n": "", "vs": [[5, "ولن يكون هنالك ليل، فلا يحتاجون إلى نور مصباح أو شمس، لأن الرب الإله ينير عليهم، وهم سيملكون إلى أبد الآبدين!"]]}], "kwAr": "الحكم الأول", "noteAr": ""}], "arS": [["أما ", []], ["أنت", ["H859"]], [" ", []], ["يابرج", ["H4026"]], [" ", []], ["القطيع", ["H5739"]], ["، ", []], ["ياتلة", ["H6076"]], [" ", []], ["ابنة", ["H1323"]], [" ", []], ["صهيون", ["H6726"]], ["، ", []], ["إليك", ["H5704", "H857"]], [" ", []], ["يعود", ["H935"]], [" ", []], ["الحكم", ["H4475"]], [" ", []], ["الأول", ["H7223"]], ["، ", []], ["ملك", ["H4467"]], [" ", []], ["ابنة", ["H1323"]], [" ", []], ["أورشليم", ["H3389"]], [".", []]]}, {"c": 4, "v": 9, "text": "لماذا تنوحين بصوت مرتفع؟ أليس فيك ملك؟ هل هلك مشيرك حتى ألم بك الألم كامرأة تقاسي من المخاض.", "groups": [{"kw": "why", "raw": "Jer_4:21, Jer_8:19, Jer_30:6, Jer_30:7", "note": "", "refs": [{"l": "Jer 4:21", "n": "", "vs": [[21, "إلى متى أظل أرى راية المعركة، وأسمع دوي البوق؟"]]}, {"l": "Jer 8:19", "n": "", "vs": [[19, "هوذا صرخة استغاثة أورشليم تتجاوب من أرض نائية قائلة: «أليس الرب في صهيون؟ أليس ملكها فيها؟ لماذا أثاروا غيظي بمنحوتاتهم وأوثانهم الغريبة الباطلة؟"]]}, {"l": "Jer 30:6", "n": "", "vs": [[6, "اسألوا وتأملوا: أيمكن للرجل أن يحمل؟ إذا ما لي أرى كل رجل يضع يديه على حقويه كامرأة تقاسي من المخاض، وقد اكتسى كل وجه بالشحوب؟"]]}, {"l": "Jer 30:7", "n": "", "vs": [[7, "ما أرهب ذلك اليوم إذ لا مثيل له! هو زمن ضيق على ذرية يعقوب، ولكنها ستنجو منه."]]}], "kwAr": "لماذا", "noteAr": ""}, {"kw": "is there", "raw": "Isa_3:1-7; Lam_4:20; Hos_3:4, Hos_10:3, Hos_13:10,Hos_13:11", "note": "", "refs": [{"l": "Isa 3:1-7", "n": "", "vs": [[1, "ها هو الرب القدير مزمع أن يقطع عن أورشليم ويهوذا الطعام والماء."], [2, "ويقضي فيها على كل بطل ومحارب وقاض ونبي وعراف وشيخ"], [3, "وعلى كل قائد وعظيم ومشير وصانع ماهر وساحر بارع."], [4, "وأجعل الصبيان رؤساء لهم، والأطفال حكاما عليهم،"], [5, "فيجور الشعب بعضهم على بعض، والرجل على صاحبه، والجار على جاره، ويتمرد الصغير على الكبير والحقير على النبيل."], [6, "عندئذ يقبض الإنسان على أخيه في بيت أبيه قائلا له: «إن عندك ثوبا، فاملك علينا لتنقذنا من هذه الفوضى»."], [7, "فيجيبهم قائلا: «لست طبيبا، ولا أملك طعاما أو ثيابا في بيتي، فلا تجعلوني رئيسا للشعب»."]]}, {"l": "Lam 4:20", "n": "", "vs": [[20, "وقع في حفرهم مصدر حياتنا، الملك الذي اختاره الرب، الذي قلنا: في ظله نعيش بين الأمم."]]}, {"l": "Hos 3:4", "n": "", "vs": [[4, "لأن أبناء إسرائيل يمكثون أمدا طويلا من غير ملك أو أمير، ومن غير ذبيحة ولا تماثيل ولا أفود ولا ترافيم."]]}, {"l": "Hos 10:3", "n": "", "vs": [[3, "يقولون الآن: «ليس لنا ملك لأننا لم نخش الله، وماذا في وسع الملك أن يفعل لنا؟»"]]}, {"l": "Hos 13:10", "n": "", "vs": [[10, "أين هو ملكك لينقذك؟ أين هم حكامك المنتشرون في جميع مدنك الذين قلت عنهم: أعطني ملكا ورؤساء؟"]]}, {"l": "Hos 13:11", "n": "", "vs": [[11, "قد أعطيتك ملكا في إبان غضبي وأخذته في سورة غيظي."]]}], "kwAr": "أليس فيك ملك", "noteAr": ""}, {"kw": "for", "raw": "Isa_13:8, Isa_21:3, Isa_26:17; Jer_22:23, Jer_30:6, Jer_50:43", "note": "", "refs": [{"l": "Isa 13:8", "n": "", "vs": [[8, "ينتابهم الفزع، وتأخذهم أوجاع ومخاض، يتلوون كوالدة تقاسي من آلآم المخاض. ويحملق بعضهم ببعض مبهوتين بوجوه ملتهبة."]]}, {"l": "Isa 21:3", "n": "", "vs": [[3, "لذلك امتلأت حقواى ألما، وانتابني مخاض كمخاض الوالدة. فقدت الوعي من جراء ما سمعت، وذهلت مما رأيت"]]}, {"l": "Isa 26:17", "n": "", "vs": [[17, "وكنا في حضرتك يارب كالحبلى المشرفة على الولادة، التي تتلوى وتصرخ في مخاضها."]]}, {"l": "Jer 22:23", "n": "", "vs": [[23, "ياساكنة لبنان المعششة في الأرز، لشد ما تئنين عندما تفاجئك الأوجاع، فتكونين كامرأة تقاسي من المخاض»."]]}, {"l": "Jer 30:6", "n": "", "vs": [[6, "اسألوا وتأملوا: أيمكن للرجل أن يحمل؟ إذا ما لي أرى كل رجل يضع يديه على حقويه كامرأة تقاسي من المخاض، وقد اكتسى كل وجه بالشحوب؟"]]}, {"l": "Jer 50:43", "n": "", "vs": [[43, "قد بلغ خبرهم ملك بابل فاسترخت يده وانتابته الضيقة ووجع امرأة في مخاضها."]]}], "kwAr": "ألم بك الألم", "noteAr": ""}], "arS": [["لماذا", ["H4100"]], [" ", []], ["تنوحين", ["H7321"]], [" ", []], ["بصوت", ["H7452"]], [" مرتفع؟ ", []], ["أليس", ["H369"]], [" فيك ", []], ["ملك", ["H4428"]], ["؟ هل ", []], ["هلك", ["H6"]], [" ", []], ["مشيرك", ["H3289"]], [" حتى ", []], ["ألم", ["H2388"]], [" بك ", []], ["الألم", ["H2427"]], [" كامرأة ", []], ["تقاسي", ["H3205"]], [" من المخاض.", []]]}, {"c": 4, "v": 10, "text": "تلوي وجعا وتأوهي ياابنة صهيون كامرأة تعاني من المخاض، لأنك الآن تخرجين من المدينة لتقيمي في الصحراء. ستذهبين إلى بابل، وهناك يتم إنقاذك لأن الرب يفتديك هناك من أيدي أعدائك.", "groups": [{"kw": "and labour", "raw": "Isa_66:7-9; Hos_13:13; Joh_16:20-22", "note": "", "refs": [{"l": "Isa 66:7-9", "n": "", "vs": [[7, "شعبي مثل امرأة ولدت قبل أن تتمخض، وقبل أن تقاسي من الطلق أنجبت ذكرا."], [8, "من سمع مثل هذا، ومن رأى نظيره؟ أتولد بلاد في يوم واحد؟ أم تخلق أمة دفعة واحدة؟ فما إن تمخضت صهيون حتى أنجبت أبناءها."], [9, "يقول الرب: هل أمخض ولا أولد؟ هل أغلق الرحم وأنا المولد؟"]]}, {"l": "Hos 13:13", "n": "", "vs": [[13, "آلام مخاض امرأة مشرفة على الولادة حلت به، ولكنه ابن جاهل يأبى أن يقترب من فوهة الرحم عند أوان ولادته."]]}, {"l": "Joh 16:20-22", "n": "", "vs": [[20, "الحق الحق أقول لكم: إنكم ستبكون وتنوحون، أما العالم فيفرح. إنكم ستحزنون، ولكن حزنكم سيتحول إلى فرح."], [21, "المرأة تحزن إذا حانت ساعتها لتلد. ولكنها حالما تلد طفلها، لا تعود تتذكر عناءها، لفرحها بأن إنسانا قد ولد في العالم."], [22, "فكذلك أنتم، تحزنون الآن؛ ولكن عندما أعود للقائكم، تبتهج قلوبكم، ولا أحد يسلبكم فرحكم."]]}], "kwAr": "وتأوهي", "noteAr": ""}, {"kw": "shalt thou", "raw": "2Ki_20:18, 2Ki_25:4; 2Ch_33:11, 2Ch_36:20; Hos_1:10, Hos_2:14; Rev_12:14", "note": "", "refs": [{"l": "2Ki 20:18", "n": "", "vs": [[18, "ويسبى بعض أبنائك الخارجين من صلبك ليكونوا خصيانا في قصر ملك بابل»."]]}, {"l": "2Ki 25:4", "n": "", "vs": [[4, "وفي تلك الليلة فتح صدقيا ورجاله ثغرة في سور المدينة، وتسلل مع رجاله المحاربين من خلال البوابة القائمة بين السورين نحو حديقة الملك. وكان الكلدانيون محيطين بالمدينة. فتوجه صدقيا ومقاتلوه إلى طريق الصحراء."]]}, {"l": "2Ch 33:11", "n": "", "vs": [[11, "لهذا أرسل الرب عليهم قادة جند ملك أشور، فقبضوا على منسى ووضعوا خزامة في أنفه، وقادوه مغلولا بسلاسل نحاس إلى بابل."]]}, {"l": "2Ch 36:20", "n": "", "vs": [[20, "وسبى نبوخذناصر الذين نجوا من السيف إلى بابل، فأصبحوا عبيدا له ولأبنائه إلى أن قامت مملكة فارس."]]}, {"l": "Hos 1:10", "n": "", "vs": [[10, "ومع ذلك فإن عدد بني إسرائيل يكون كرمل البحر الذي لا يكال ولا يحصى. وفي الموضع الذي قيل لهم فيه: أنتم لستم شعبي، يقال لهم: أنتم أبناء الله الحي."]]}, {"l": "Hos 2:14", "n": "", "vs": [[14, "لهذا، ها أنا أتملقها وآخذها إلى الصحراء وأخاطبها بحنان،"]]}, {"l": "Rev 12:14", "n": "", "vs": [[14, "فأعطيت المرأة جناحي النسر العظيم، لتطير بهما إلى البر ية، إلى المكان المجهز لها، حيث تعال بمأمن من الحية، مدة ثلاث سنوات ونصف سنة."]]}], "kwAr": "تخرجين", "noteAr": ""}, {"kw": "there shalt", "raw": "Mic_7:8-13; Ezr_1:1, Ezr_1:2; Isa_45:13, Isa_48:20, Isa_52:9-12; Zec_2:7-9", "note": "", "refs": [{"l": "Mic 7:8-13", "n": "", "vs": [[8, "لا تشمتي بي ياعدوتي، لأني إن سقطت أقوم، وإن جلست في الظلمة يكون الرب نورا لي."], [9, "إني أخطأت إلى الرب لذلك أتحمل غضبه، إلى أن يدافع عني ويثبت استقامتي، فيخرجني إلى النور لأشاهد عدله."], [10, "عندئذ ترى ذلك عدوتي فيعتريها الخزي إذ قالت لي: «أين هو الرب إلهك؟» ستشهدها عيناي تداس كطين الشوارع والأزقة."], [11, "ها قد أقبل يوم بناء أسوار مدينتك.في ذلك اليوم تتسع تخومك."], [12, "ويتقاطر إليك شعبك في ذلك اليوم، من أشور ومن مدن مصر حتى نهر الفرات؛ من بحر إلى بحر؛ ومن جبل إلى جبل."], [13, "غير أن الأرض تكون موحشة بسبب سيئات سكانها."]]}, {"l": "Ezr 1:1", "n": "", "vs": [[1, "في السنة الأولى لحكم كورش ملك فارس، وإتماما لكلام الرب الذي نطق به على لسان إرميا، نبه الرب روح كورش فأصدر نداء مكتوبا في كل أرجاء مملكته ورد فيه:"]]}, {"l": "Ezr 1:2", "n": "", "vs": [[2, "«هذا ما يقوله كورش ملك فارس: لقد وهبني الرب إله السماء جميع ممالك الأرض، وأوصاني أن أشيد له هيكلا في أورشليم في مملكة يهوذا،"]]}, {"l": "Isa 45:13", "n": "", "vs": [[13, "أنا أقمت كورش ليجري العدل، وأنا أمهد طرقه كلها، فيبني مدينتي ويطلق سراح أسراي، لا بثمن ولا لقاء مكافأة، يقول الرب القدير."]]}, {"l": "Isa 48:20", "n": "", "vs": [[20, "اكسروا أغلال الأسر. ارحلوا عن بابل. ارفعوا أصواتكم بالغناء حتى يذيع في أرجاء الدنيا أن الرب قد فدى عبده يعقوب."]]}, {"l": "Isa 52:9-12", "n": "", "vs": [[9, "اهتفي مترنمة ياأرض أورشليم الخربة، لأن الرب قد عزى شعبه وافتدى أورشليم."], [10, "شمر الرب عن ذراع قدسه أمام عيون كل الأمم، فترى أقاصي الأرض خلاص إلهنا."], [11, "انصرفوا، انصرفوا واخرجوا من هناك ولا تمسوا نجسا. اخرجوا من وسط بابل، وطهروا أنفسكم ياحاملي آنية الرب."], [12, "لأنكم لن تخرجوا من بابل في عجلة، ولن تغادروها هاربين، لأن الرب سيسير أمامكم، وإله إسرائيل يحرس مؤخرة قافلتكم."]]}, {"l": "Zec 2:7-9", "n": "", "vs": [[7, "أما الآن، فهيا اهربوا إلى صهيون يامن أقمتم في أرض بابل."], [8, "فإن الرب القدير يقول إنه أرسلني إلى الأمم التي سلبتكم إعلاء لمجده، لأن من يمسكم يمس حدقة عينه."], [9, "ها أنا أضربهم بيدي فيصيرون نهبا لعبيدهم، فتدركون أن الرب القدير قد أرسلني حقا."]]}], "kwAr": "يتم إنقاذك", "noteAr": ""}, {"kw": "redeem", "raw": "Psa_106:10; Jer_15:21", "note": "", "refs": [{"l": "Psa 106:10", "n": "", "vs": [[10, "أنقذتهم من يد مبغضيهم وافتديتهم من قبضة العدو."]]}, {"l": "Jer 15:21", "n": "", "vs": [[21, "أنقذك من قبضة الأشرار، وأفديك من أكف العتاة»."]]}], "kwAr": "يفتديك", "noteAr": ""}], "arS": [["تلوي", ["H2342"]], [" وجعا ", []], ["وتأوهي", ["H1518"]], [" ", []], ["ياابنة", ["H1323"]], [" ", []], ["صهيون", ["H6726"]], [" ", []], ["كامرأة", ["H3205"]], [" تعاني من المخاض، ", []], ["لأنك", ["H3588"]], [" ", []], ["الآن", ["H6258"]], [" ", []], ["تخرجين", ["H3318"]], [" من ", []], ["المدينة", ["H4480", "H7151"]], [" ", []], ["لتقيمي", ["H7931"]], [" في ", []], ["الصحراء", ["H7704"]], [". ", []], ["ستذهبين", ["H935"]], [" ", []], ["إلى", ["H5704"]], [" ", []], ["بابل", ["H894"]], ["، ", []], ["وهناك", ["H8033"]], [" يتم ", []], ["إنقاذك", ["H5337"]], [" لأن ", []], ["الرب", ["H3068"]], [" ", []], ["يفتديك", ["H1350"]], [" ", []], ["هناك", ["H8033"]], [" من ", []], ["أيدي", ["H4480", "H3709"]], [" ", []], ["أعدائك", ["H341"]], [".", []]]}, {"c": 4, "v": 11, "text": "والآن ها أمم غفيرة قد اجتمعت عليك قائلة «لتتدنس أورشليم حتى تتفرس عيوننا في خرابها».", "groups": [{"kw": "many", "raw": "Isa_5:25-30, Isa_8:7, Isa_8:8; Jer_52:4; Lam_2:15, Lam_2:16; Joe_3:2-15", "note": "", "refs": [{"l": "Isa 5:25-30", "n": "", "vs": [[25, "لذلك احتدم غضب الرب ضد شعبه، فمد يده عليهم وضربهم، فارتعشت الجبال، وأصبحت جثث موتاهم كالقاذورات في الشوارع. ومع ذلك كله لم يرتد غضبه ولم تبرح يده ممدودة بالعقاب."], [26, "فيرفع راية لأمم بعيدة، ويصفر لمن في أطراف الأرض، فيقبلون مسرعين (إلى أورشليم)،"], [27, "دون أن يكلوا أو يتعثروا أو يعتريهم نعاس أو نوم، أو يحل أحد منهم حزاما عن حقويه، ولا ينقطع لأحد سيور حذاء."], [28, "سهامهم مسننة، وقسيهم مشدودة. حوافر خيلهم كأنها صوان. عجلات مركباتهم مندفعة كالإعصار."], [29, "زئيرهم كأنه زئير أسد يزمجر وينقض على فريسته ويحملها وليس من منقذ."], [30, "يزمجرون عليها في ذلك اليوم كهدير البحر. وإن جاس أحد في البلاد متفرسا لا يرى سوى الظلمة والضيق، حتى (انفراجات) الضوء (أي ومضات الرجاء) قد احتجبت وراء سحبه."]]}, {"l": "Isa 8:7", "n": "", "vs": [[7, "فإن الرب مزمع أن يغرقهم بمياه النهر الفياضة، أي ملك أشور بكل جبروته، فيكون (كنهر الفرات) يطغى جيشانه على أقنيته ويفيض على ضفافه"]]}, {"l": "Isa 8:8", "n": "", "vs": [[8, "فيكتسح أرض يهوذا، ويطفو مرتفعا إلى الأعناق، وتنتشر جيوشه في عرض أرضك ياعمانوئيل»."]]}, {"l": "Jer 52:4", "n": "", "vs": [[4, "وفي اليوم العاشر من الشهر العاشر من السنة التاسعة لحكمه، زحف نبوخذناصر ملك بابل بجيشه على أورشليم وحاصرها وبنى حولها المتاريس."]]}, {"l": "Lam 2:15", "n": "", "vs": [[15, "كل عابري السبيل صفقوا عليك بالأيادي فرحا. صفروا وهزوا رؤوسهم على ابنة أورشليم وتساءلوا: أهذه هي المدينة التي تدعى كاملة الجمال وبهجة الأرض بأسرها؟"]]}, {"l": "Lam 2:16", "n": "", "vs": [[16, "قد فغر جميع أعدائك أشداقهم. يصفرون ويحرقون الأسنان. يهتفون: قد ابتلعناها. هذا هو اليوم الذي طال انتظارنا له. قد عشنا وشهدناه!"]]}, {"l": "Joe 3:2-15", "n": "", "vs": [[2, "أجمع الأمم كلها وأحضرهم إلى وادي يهوشافاط، وأحاكمهم هناك من أجل شعبي وميراثي إسرائيل، لأنهم شتتوهم بين الشعوب واقتسموا أرضي."], [3, "وألقوا القرعة على شعبي فقايضوا الزانية بالصبي، وباعوا الصبية لقاء شربة خمر."], [4, "ماذا لديكم ضدي ياصور وصيدون وسائر أقاليم فلسطين؟ أتجازونني على أمر أتيته؟ أم تسعون لإيذائي؟ إني أنزل العقاب على رؤوسكم بغتة وسريعا."], [5, "لأنكم قد استوليتم على ذهبي وفضتي، ونقلتم نفائسي إلى هياكلكم."], [6, "وبعتم يهوذا وأبناء أورشليم إلى الأغارقة لتبعدوهم عن تخوم أرضهم."], [7, "وها أنا الآن أنهضهم من الموضع حيث بعتموهم، وأرد على رؤوسكم سوء أعمالكم."], [8, "وأبيع أبناءكم وبناتكم بأيدي أبناء يهوذا، فيبيعونهم بدورهم إلى السبئيين، إلى أمة بعيدة، لأن الرب قد أصدر قضاءه."], [9, "نادوا بهذا بين الأمم، وتأهبوا للحرب. احشدوا أبطالكم. ليتقدم ويصعد جميع رجال القتال."], [10, "أطرقوا سكك محاريثكم وحولوها إلى سيوف، ومناجلكم إلى رماح، وليقل الضعيف: إنني جبار قتال!"], [11, "أسرعوا وتعالوا من كل ناحية يا كل الأمم، واجتمعوا هناك، وأنزل يارب محاربيك."], [12, "لتنهض الأمم وتقبل إلى وادي القضاء لأنني هناك أجلس لأدين الشعوب المتوافدة من كل جهة."], [13, "احملوا المنجل لأن الحصيد قد نضج. تعالوا ودوسوا فإن معصرة الخمر قد امتلأت، والحياض فاضت بكثرة شرهم."], [14, "جماهير جماهير متزاحمة في وادي القضاء، لأن يوم الرب قريب في وادي القضاء."], [15, "قد أظلمت الشمس والقمر، وكفت الكواكب عن الضياء."]]}], "kwAr": "أمم غفيرة", "noteAr": ""}, {"kw": "let our", "raw": "Mic_7:10; Oba_1:12", "note": "", "refs": [{"l": "Mic 7:10", "n": "", "vs": [[10, "عندئذ "l": "Isa 41:16", "n": "", "vs": [[16, "فتذريها، وتحملها الريح بعيدا، وتبددها الزوبعة. أما أنت فتبتهج بالرب وتمجد قدوس إسرائيل."]]}, {"l": "Jer 51:33", "n": "", "vs": [[33, "لأن هذا ما يعلنه الرب القدير إله إسرائيل: إن أهل بابل كالبيدر، وقد حان أوان درس حنطته. وبعد قليل يأزف موعد حصادهم."]]}], "kwAr": "وادرسي", "noteAr": ""}, {"kw": "hoofs", "raw": "Deu_33:25; Isa_5:28", "note": "", "refs": [{"l": "Deu 33:25", "n": "", "vs": [[25, "ولتكن مزاليج أبوابك من حديد ونحاس، ولتعادل قوتك امتداد أيامك."]]}, {"l": "Isa 5:28", "n": "", "vs": [[28, "سهامهم مسننة، وقسيهم مشدودة. حوافر خيلهم كأنها صوان. عجلات مركباتهم مندفعة كالإعصار."]]}], "kwAr": "أظلافا", "noteAr": ""}, {"kw": "thou shalt", "raw": "Mic_5:8-15; Dan_2:44; Zec_9:13-15; Rev_2:26, Rev_2:27", "note": "", "refs": [{"l": "Mic 5:8-15", "n": "", "vs": [[8, "وتكون بقية ذرية يعقوب بين الشعوب الكثيرة كأسد بين وحوش الغابة، أو كشبل بين قطعان الغنم، الذي إن اقتحم يدوس ويفترس وليس من منقذ."], [9, "فتتعاظم ياشعبي على مبغضيك، ويبيد جميع أعدائك."], [10, "ويقول الرب: في ذلك اليوم أستأصل خيولكم من بينكم وأدمر مركبات حربكم،"], [11, "وأخرب مدنكم وأهدم جميع حصونكم،"], [12, "وأقضي على السحر في دياركم ولا يبقى لكم عرافون،"], [13, "وأنتزع تماثيلكم وأنصابكم من وسطكم، فلا تعودون تسجدون لأصنام من صنع أيديكم."], [14, "وأفني عشتاروث من بينكم، وأهدم مدنكم،"], [15, "وبغضب وسخط أنتقم من الأمم التي لم تطعني."]]}, {"l": "Dan 2:44", "n": "", "vs": [[44, "وفي عهد هؤلاء الملوك يقيم إله السماوات مملكة لا تنقرض إلى الأبد، ولا يترك ملكها لشعب آخر، وتسحق وتبيد جميع هذه الممالك. أما هي فتخلد إلى الأبد."]]}, {"l": "Zec 9:13-15", "n": "", "vs": [[13, "ها أنا أوتر يهوذا كقوس وأجعل أفرايم كسهم وأثير رجال صهيون على أبناء اليونان فتكونين كسيف جبار."], [14, "ثم يتجلى الرب، وينفذ سهمه كالبرق. ينفخ السيد الرب بالبوق ويقتحم في زوابع الجنوب."], [15, "يقيهم الرب القدير فلا تنالهم حجارة المقلاع، بل تقصر عنهم ويطأونها، ويشربون (من دماء أعدائهم) ويصخبون كالسكارى من الخمر ويمتلئون كمناضح المحرقات وزوايا المذبح."]]}, {"l": "Rev 2:26", "n": "", "vs": [[26, "كل من ينتصر، ويس
