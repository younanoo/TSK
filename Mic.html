:20", "n": "", "vs": [[20, "الحق الحق أقول لكم: إنكم ستبكون وتنوحون، أما العالم فيفرح. إنكم ستحزنون، ولكن حزنكم سيتحول إلى فرح."]]}, {"l": "Rev 11:10-12", "n": "", "vs": [[10, "ويشمت بهما أهل الأرض، فيفرحون كأنهم في عيد، ويتبادلون الهدايا، لأن هذين النبيين كانا قد عذباهم كثيرا."], [11, "وبعد أن تمر الأيام الثلاثة ونصف اليوم يبعث الله في النبيين روح الحياة، فينهضان واقفين، ويستولي على الناظرين إليهما خوف شديد."], [12, "ويدعوهما صوت عال من السماء: «اصعدا إلى هنا»، فيصعدان إلى السماء في سحابة بمشهد من أعدائهما."]]}], "kwAr": "لا تشمتي", "noteAr": ""}, {"kw": "when I fall", "raw": "Psa_37:21, Psa_41:10-12; Pro_24:16", "note": "", "refs": [{"l": "Psa 37:21", "n": "", "vs": [[21, "يقترض الشرير ولا يفي، أما الصديق فيترَأف ويعطي بسخاء."]]}, {"l": "Psa 41:10-12", "n": "", "vs": [[10, "أما أنت يارب فارحمني واشفني، فأجازيهم."], [11, "قد أدركت أني حظيت برضاك حين (نصرتني) فلم يطلق علي عدوي هتاف الظفر"], [12, "فإنك تدعمني في كمالي، وتقيمني في محضرك إلى الأبد."]]}, {"l": "Pro 24:16", "n": "", "vs": [[16, "لأن الصديق يسقط سبع مرات، ومع ذلك ينهض، أما الأشرار فيتعثرون بالشر."]]}], "kwAr": "إن سقطت", "noteAr": ""}, {"kw": "when I sit", "raw": "Psa_107:10-15, Psa_112:4; Isa_9:2, Isa_49:9, Isa_50:10; Mat_4:16; Luk_1:78, Luk_1:79", "note": "", "refs": [{"l": "Psa 107:10-15", "n": "", "vs": [[10, "كانوا جالسين كالأسرى في الظلام وظلال الموت، موثقين بالذل والحديد،"], [11, "لأنهم تمردوا على كلام الله، واستهانوا بمشورة العلي."], [12, "فأذل قلوبهم بالجهد المضني. تعثروا ولم يكن من معين."], [13, "ثم استغاثوا بالرب في ضيقهم فأنقذهم من مصائبهم."], [14, "أخرجهم من الظلام وظلال الموت وحطم أصفادهم."], [15, "فليرفعوا الشكر للرب على رحمته، وعلى عجائبه لبني آدم."]]}, {"l": "Psa 112:4", "n": "", "vs": [[4, "يشرق نور في الظلمة للمستقيمين لأن الرب حنان ورحيم وصديق."]]}, {"l": "Isa 9:2", "n": "", "vs": [[2, "الشعب السالك في الظلمة أبصر نورا عظيما، والمقيمون في أرض ظلال الموت أضاء عليهم نور."]]}, {"l": "Isa 49:9", "n": "", "vs": [[9, "لتقول للأسرى: اخرجوا، وللذين في الظلمة اظهروا، فيرعون في الطرقات وتصبح الروابي الجرداء مراعي لهم."]]}, {"l": "Isa 50:10", "n": "", "vs": [[10, "من منكم يتقي الرب ويطيع صوت خادمه؟ من الذي يسلك في الظلمة من غير نور؟ فليتكل على اسم الرب ويعتمد على إلهه."]]}, {"l": "Mat 4:16", "n": "", "vs": [[16, "الشعب الجالس في الظلمة، أبصر نورا عظيما، والجالسون في أرض الموت وظلاله، أشرق عليهم نور ! »"]]}, {"l": "Luk 1:78", "n": "", "vs": [[78, "بفضل عواطف الرحمة لدى إلهنا، تلك التي تفقدنا بها الفجر المشرق من العلاء،"]]}, {"l": "Luk 1:79", "n": "", "vs": [[79, "ليضيء على القابعين في الظلام وظل الموت، ويهدي خطانا في طريق السلام»."]]}], "kwAr": "جلست", "noteAr": ""}, {"kw": "the Lord", "raw": "Psa_27:1, Psa_84:11, Psa_97:11, Psa_112:4; Isa_2:5, Isa_60:1-3, Isa_60:19, Isa_60:20; Mal_4:2; Joh_8:12; Act_26:18; 2Co_4:6; Rev_21:23, Rev_22:5", "note": "", "refs": [{"l": "Psa 27:1", "n": "", "vs": [[1, "الرب نوري وخلاصي، ممن أخاف؟ الرب حصن حياتي ممن أرتعب؟"]]}, {"l": "Psa 84:11", "n": "", "vs": [[11, "لأن الرب الإله شمس وترس. الرب يعطي نعمة ومجدا؛ لا يمنع أي خير عن السالكين بالاستقامة."]]}, {"l": "Psa 97:11", "n": "", "vs": [[11, "قد زرع نور للصديق وفرح للمستقيمي القلب."]]}, {"l": "Psa 112:4", "n": "", "vs": [[4, "يشرق نور في الظلمة للمستقيمين لأن الرب حنان ورحيم وصديق."]]}, {"l": "Isa 2:5", "n": "", "vs": [[5, "يابيت يعقوب، هيا لنسلك في نور الرب."]]}, {"l": "Isa 60:1-3", "n": "", "vs": [[1, "قومي استضيئي، فإن نورك قد جاء، ومجد الرب أشرق عليك."], [2, "ها إن الظلمة تغمر الأرض، والليل الدامس يكتنف الشعوب، ولكن الرب يشرق عليك، ويتجلى مجده حولك،"], [3, "فتقبل الأمم إلى نورك، وتتوافد الملوك إلى إشراق ضيائك."]]}, {"l": "Isa 60:19", "n": "", "vs": [[19, "ولا تعود الشمس نورا لك في النهار ولا يشرق ضوء القمر عليك لأن الرب يكون نورك الأبدي، وإلهك يكون مجدك."]]}, {"l": "Isa 60:20", "n": "", "vs": [[20, "ولا تغرب شمسك من بعد، ولا يتضاءل قمرك، لأن الرب يكون نورك الأبدي، وتنقضي أيام مناحتك."]]}, {"l": "Mal 4:2", "n": "", "vs": [[2, "أما أنتم أيها المتقون اسمي فتشرق عليكم شمس البر حاملة في أجنحتها الشفاء فتنطلقون متواثبين كعجول المعلف،"]]}, {"l": "Joh 8:12", "n": "", "vs": [[12, "وخاطبهم يسوع أيضا فقال: «أنا نور العالم. من يتبعني فلا يتخبط في الظلام بل يكون له نور الحياة»."]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "2Co 4:6", "n": "", "vs": [[6, "فإن الله ، الذي أمر أن يشرق نور من الظلام، هو الذي جعل النور يشرق في قلوبنا، لإشعاع معرفة مجد الله المتجلي في وجه المسيح."]]}, {"l": "Rev 21:23", "n": "", "vs": [[23, "ولم تكن المدينة في حاجة إلى نور الشمس أو القمر، لأن مجد الله ينيرها، والحمل مصباحها."]]}, {"l": "Rev 22:5", "n": "", "vs": [[5, "ولن يكون هنالك ليل، فلا يحتاجون إلى نور مصباح أو شمس، لأن الرب الإله ينير عليهم، وهم سيملكون إلى أبد الآبدين!"]]}], "kwAr": "الرب", "noteAr": ""}], "arS": [["لا", ["H408"]], [" ", []], ["تشمتي", ["H8055"]], [" بي ", []], ["ياعدوتي", ["H341"]], ["، ", []], ["لأني", ["H3588"]], [" إن ", []], ["سقطت", ["H5307"]], [" ", []], ["أقوم", ["H6965"]], ["، ", []], ["وإن", ["H3588"]], [" ", []], ["جلست", ["H3427"]], [" في ", []], ["الظلمة", ["H2822"]], [" يكون ", []], ["الرب", ["H3068"]], [" ", []], ["نورا", ["H216"]], [" لي.", []]]}, {"c": 7, "v": 9, "text": "إني أخطأت إلى الرب لذلك أتحمل غضبه، إلى أن يدافع عني ويثبت استقامتي، فيخرجني إلى النور لأشاهد عدله.", "groups": [{"kw": "bear", "raw": "Lev_26:41; 1Sa_3:18; 2Sa_16:11, 2Sa_16:12, 2Sa_24:17; Job_34:31, Job_34:32; Lam_1:18; Lam_3:39-42; Luk_15:18, Luk_15:19; Heb_12:6, Heb_12:7", "note": "", "refs": [{"l": "Lev 26:41", "n": "", "vs": [[41, "التي جعلتني أنقلب عليهم وأنفيهم إلى أرض أعدائهم، وإن خضعت قلوبهم النجسة بعد أن استوفوا عقاب خطاياهم،"]]}, {"l": "1Sa 3:18", "n": "", "vs": [[18, "فأطلعه صموئيل على جميع الكلام، ولم يخف عنه شيئا. فقال عالي: «إنه الرب، وهو يفعل ما يشاء»."]]}, {"l": "2Sa 16:11", "n": "", "vs": [[11, "وقال الملك لأبيشاي وسائر رجاله: «هوذا ابني الذي خرج من صلبي يسعى لقتلي، فكم بالحري هذا البنياميني. دعوه يشتم لأن الرب أمره بشتمي."]]}, {"l": "2Sa 16:12", "n": "", "vs": [[12, "لعل الرب ينظر إلى مذلتي، ويكافئني خيرا عوض شتائمه في هذا اليوم»."]]}, {"l": "2Sa 24:17", "n": "", "vs": [[17, "فقال داود للرب عندما شاهد الملاك المهلك «أنا هو المخطيء والمذنب، وأما هؤلاء الخراف فماذا جنوا؟ ليحل عقابك علي وعلى بيت أبي»."]]}, {"l": "Job 34:31", "n": "", "vs": [[31, "هل قال أحد لله: لقد تحملت العقاب فلن أعود إلى الإساءة؟"]]}, {"l": "Job 34:32", "n": "", "vs": [[32, "علمني ما لا أراه، وإن كنت قد أثمت فإنني عنه أرتدع."]]}, {"l": "Lam 1:18", "n": "", "vs": [[18, "الرب حقا عادل، وأنا قد تمردت على أمره. فاستمعوا ياجميع الشعوب واشهدوا وجعي. قد ذهب عذاراي وشباني إلى السبي."]]}, {"l": "Lam 3:39-42", "n": "", "vs": [[39, "فلماذا يشتكي الإنسان الحي حين يعاقب على خطاياه؟"], [40, "لنفحص طرقنا ونختبرها ونرجع إلى الرب."], [41, "لنرفع قلوبنا وأيدينا إلى الله في السماوات."], [42, "قد تعدينا وتمردنا، وأنت لم تغفر."]]}, {"l": "Luk 15:18", "n": "", "vs": [[18, "سأقوم وأرجع إلى أبي، وأقول له: ياأبي، أخطأت إلى السماء وأمامك؛"]]}, {"l": "Luk 15:19", "n": "", "vs": [[19, "ولا أستحق بعد أن أدعى ابنا لك: اجعلني كواحد من خدامك المأجورين!"]]}, {"l": "Heb 12:6", "n": "", "vs": [[6, "فإن الذي يحبه الرب يؤدبه. وهو يجلد كل من يتخذه له ابنا!»"]]}, {"l": "Heb 12:7", "n": "", "vs": [[7, "إذن، تحملوا تأديب الرب. فهو يعاملكم معاملة الأبناء: وأي ابن لا يؤدبه أبوه؟"]]}], "kwAr": "أتحمل", "noteAr": ""}, {"kw": "until", "raw": "1Sa_24:15, 1Sa_25:39, 1Sa_26:10; Psa_7:6, Psa_43:1; Jer_50:17-20,Jer_50:33, Jer_50:34, Jer_51:35, Jer_51:36; Rev_6:10,Rev_6:11, Rev_18:20", "note": "", "refs": [{"l": "1Sa 24:15", "n": "", "vs": [[15, "ليكن الرب هو الديان فيقضي بيني وبينك ويتولى قضيتي ويبرئني وينقذني من قبضتك»."]]}, {"l": "1Sa 25:39", "n": "", "vs": [[39, "فلما سمع داود بموت نابال قال: «مبارك الرب الذي انتقم لي بذاته من إهانة نابال، وجنبني ارتكاب الشر وعاقب نابال على إثمه». وأرسل داود إلى أبيجايل يسألها الزواج منه."]]}, {"l": "1Sa 26:10", "n": "", "vs": [[10, "إن الرب نفسه لابد أن يعاقب شاول فيميته ميتة طبيعية، أو يقتله في معركة حربية."]]}, {"l": "Psa 7:6", "n": "", "vs": [[6, "انهض يارب في احتدام غضبك، وانتصب في وجه سخط خصومي، يامن أوصيت بالعدل."]]}, {"l": "Psa 43:1", "n": "", "vs": [[1, "ياالله احكم ببراءتي، ودافع عن قضيتي ضد شعب لا يرحم. أنقذني من الغشاش والظالم."]]}, {"l": "Jer 50:17-20", "n": "", "vs": [[17, "إسرائيل قطيع غنم متشتت، طردته الأسود. كان ملك أشور أول من افترسه، ونبوخذناصر آخر من هشم عظامه."], [18, "لذلك هذا ما يعلنه الرب القدير إله إسرائيل: ها أنا أعاقب ملك بابل وأرضه. كما عاقبت ملك أشور من قبل."], [19, "وأرد إسرائيل إلى مرتعه، فيرعى في الكرمل وفي باشان، وتشبع نفسه في جبل أفرايم وجلعاد."], [20, "وفي ذلك الزمان والأوان، يقول الرب، يلتمس إثم إسرائيل فلا يوجد، وخطيئة يهوذا فلا تكون، لأني أعفو عمن أبقيته منهما."]]}, {"l": "Jer 50:33", "n": "", "vs": [[33, "وهذا ما يعلنه الرب القدير: «قد وقع الظلم على شعب إسرائيل وعلى شعب يهوذا، وجميع الذين سبوهم تشبثوا بهم وأبوا أن يطلقوهم."]]}, {"l": "Jer 50:34", "n": "", "vs": [[34, "غير أن فاديهم قوي، الرب القدير اسمه، وهو حتما يدافع عن قضيتهم لكي يشيع راحة في الأرض ويقلق أهل بابل."]]}, {"l": "Jer 51:35", "n": "", "vs": [[35, "يقول أهل أورشليم: ليحل ببابل ما أصابنا وأصاب لحومنا من ظلم. وتقول أورشليم: دمي على أهل أرض الكلدانيين."]]}, {"l": "Jer 51:36", "n": "", "vs": [[36, "لذلك هذا ما يعلنه الرب: ها أنا أدافع عن دعواك وأنتقم لك، فأجفف بحر بابل وينابيعها،"]]}, {"l": "Rev 6:10", "n": "", "vs": [[10, "وهم يصرخون للرب بأعلى صوتهم: «حتى متى، أيها السيد القدوس والحق، تؤخر معاقبة أهل الأرض على ما فعلوه بنا؟ متى تنتقم منهم لدمائنا؟»"]]}, {"l": "Rev 6:11", "n": "", "vs": [[11, "فأعطي كل منهم ثوبا أبيض، وقيل لهم أن يصبروا قليلا إلى أن يكمل عدد شركائهم العبيد وإخوتهم الذين سيقتلون مثلهم."]]}, {"l": "Rev 18:20", "n": "", "vs": [[20, "اشمتي بها أيتها السماء! واشمتوا بها أيها القديسون والرسل والأنبياء، فقد أصدر الله حكمه عليها بعدما أصدرت أحكامها عليكم»."]]}], "kwAr": "إلى أن", "noteAr": ""}, {"kw": "he will", "raw": "Job_23:10; Psa_37:6; Mal_3:18; 1Co_4:5; 2Th_1:5-10; 2Ti_4:8", "note": "", "refs": [{"l": "Job 23:10", "n": "", "vs": [[10, "ولكنه يعرف الطريق الذي أسلكه، وإذا امتحنني أخرج كالذهب"]]}, {"l": "Psa 37:6", "n": "", "vs": [[6, "يظهر براءتك كالنور، وحقك ظاهرا كشمس الظهيرة."]]}, {"l": "Mal 3:18", "n": "", "vs": [[18, "فتشرعون ثانية في التمييز بين الصالح والطالح، بين من يعبد الله ومن لا يعبده»."]]}, {"l": "1Co 4:5", "n": "", "vs": [[5, "إذن، لا تحكموا في شيء قبل الأوان، ريثما يرجع الرب الذي سيسلط النور على الأشياء التي يحجبها الظلام الآن، ويكشف نيات القلوب، عندئذ ينال كل واحد حقه من المدح من عند الله!"]]}, {"l": "2Th 1:5-10", "n": "", "vs": [[5, "وفي هذا دليل على حكم الله العادل، بقصد أن تعتبروا مؤهلين لملكوت الله الذي من أجله تلاقون الآلام."], [6, "فمن العدل عند الله حقا أن يجازي بالضيقة أولئك الذين يضايقونكم،"], [7, "وأن يكافئكم، أنتم الذين تتضايقون، كما يكافئنا نحن، بالراحة لدى ظهور الرب يسوع علنا من السماء، ومعه ملائكة قدرته،"], [8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."], [9, "فهؤلاء سيكابدون عقاب الهلاك الأبدي، بعيدا من حضرة الرب ومن مجد قوته،"], [10, "عندما يعود في ذلك اليوم ليتمجد في قديسيه ويكون موضع العجب عند جميع الذين آمنوا، وأنتم قد آمنتم بشهادتنا لكم!"]]}, {"l": "2Ti 4:8", "n": "", "vs": [[8, "إنما ينتظرني الآن إكليل البر المحفوظ لي، والذي سيهبه لي الرب الديان العادل في ذلك اليوم؛ ولن يوهب لي وحدي، بل أيضا لجميع الذين يحبون ظهوره."]]}], "kwAr": "فيخرجني", "noteAr": ""}], "arS": [["إني ", []], ["أخطأت", ["H2398"]], [" إلى ", []], ["الرب", ["H3068"]], [" لذلك ", []], ["أتحمل", ["H5375"]], [" ", []], ["غضبه", ["H2197"]], ["، ", []], ["إلى", ["H5704"]], [" أن ", []], ["يدافع", ["H7378"]], [" عني ", []], ["ويثبت", ["H6213"]], [" ", []], ["استقامتي", ["H4941"]], ["، ", []], ["فيخرجني", ["H3318"]], [" إلى ", []], ["النور", ["H216"]], [" ", []], ["لأشاهد", ["H7200"]], [" ", []], ["عدله", ["H6666"]], [".", []]]}, {"c": 7, "v": 10, "text": "عندئذ ترى ذلك عدوتي فيعتريها الخزي إذ قالت لي: «أين هو الرب إلهك؟» ستشهدها عيناي تداس كطين الشوارع والأزقة.", "groups": [{"kw": "Then", "raw": "etc. or, And thou wilt see her that is mine enemy, and cover her with shame", "note": "etc. or, And thou wilt see her that is mine enemy, and cover her with shame", "refs": [], "kwAr": "عندئذ", "noteAr": "إلخ. أو: «وسترى عدوتي فتكسوها الخزي»."}, {"kw": "she that", "raw": "Psa_137:8, Psa_137:9; Isa_47:5-9; Jer_50:33, Jer_50:34, Jer_51:8-10,Jer_51:24; Nahum 2:1-3:19; Rev_17:1-7", "note": "", "refs": [{"l": "Psa 137:8", "n": "", "vs": [[8, "يابنت بابل المحتم خرابها، طوبى لمن يجازيك بما جزيتنا به."]]}, {"l": "Psa 137:9", "n": "", "vs": [[9, "طوبى لمن يمسك صغارك ويضرب بهم الصخرة."]]}, {"l": "Isa 47:5-9", "n": "", "vs": [[5, "اجلسي صامتة وأوغلي في الظلام ياابنة الكلدانيين، لأنك لن تدعي بعد سيدة الممالك."], [6, "قد سخطت على شعبي ونجست ميراثي. أسلمتهم إلى يديك، فلم تبدي نحوهم رحمة بل أرهقت الشيخ بنيرك الثقيل جدا."], [7, "وقلت: سأظل السيدة إلى الأبد. لذلك لم تفكري بهذه الأمور في نفسك ولا تأملت بما تؤول إليه."], [8, "فالآن اسمعي هذا أيتها المترفهة المتنعمة المطمئنة، القائلة في قلبها: أنا وحدي وليس هناك غيري، لن أعرف الترمل ولن أثكل"], [9, "لذلك ستبتلين بكلا الأمرين معا في لحظة، في يوم واحد، إذ تثكلين وتترملين حتى النهاية على الرغم من كثرة سحرك وقوة رقاك."]]}, {"l": "Jer 50:33", "n": "", "vs": [[33, "وهذا ما يعلنه الرب القدير: «قد وقع الظلم على شعب إسرائيل وعلى شعب يهوذا، وجميع الذين سبوهم تشبثوا بهم وأبوا أن يطلقوهم."]]}, {"l": "Jer 50:34", "n": "", "vs": [[34, "غير أن فاديهم قوي، الرب القدير اسمه، وهو حتما يدافع عن قضيتهم لكي يشيع راحة في الأرض ويقلق أهل بابل."]]}, {"l": "Jer 51:8-10", "n": "", "vs": [[8, "فجأة سقطت بابل وتحطمت، فولولوا عليها، خذوا بلسانا لجرحها لعلها تبرأ."], [9, "قمنا بمداواة بابل، ولكن لم ينجع فيها علاج. اهجروها وليمض كل واحد منا إلى أرضه، لأن قضاءها قد بلغ عنان السماء، وتصاعد حتى ارتفع إلى الغيوم."], [10, "قد أظهر الرب برنا، فتعالوا لنذيع في صهيون ما صنعه الرب إلهنا."]]}, {"l": "Jer 51:24", "n": "", "vs": [[24, "سأجازي بابل وسائر الكلدانيين على كل شرهم الذي ارتكبوه في حق صهيون، على مرأى منكم، يقول الرب."]]}, {"l": "Nah 2:1-3:19", "n": "", "vs": [[1, "قد زحف عليك المهاجم يانينوى، فاحرسي الحصن وراقبي الطريق، منعي أسوارك، وجندي كل قوتك."], [2, "لأن الرب يعيد بهاء يعقوب ومجد إسرائيل، لأن الناهبين سلبوهم وأتلفوا كرومهم."], [3, "تروس أبطاله مخضبة بالاحمرار، وجنوده المحاربون مسربلون بالقرمز. يبرق فولاذ المركبات في يوم تأهبها، وتتبختر جيادها."], [4, "تتراكض المركبات بعنف في الشوارع، وعبر الساحات تمرق كالبرق ومنظرها كالمشاعل المتوهجة."], [5, "يستدعي الملك ضباطه، فيسرعون إليه متعثرين في خطاهم، يهرولون إلى سور المدينة وقد أقيمت المتاريس."], [6, "قد انفتحت بوابات الأنهار، وانهار القصر أمام جحافل الأعداء."], [7, "أصبحت سيدة القصر عارية مسوقة إلى الأسر، وشرعت جواريها ينحن كنوح الحمام ويضربن صدورهن."], [8, "نينوى كبركة نضبت مياهها، إذ فر أهلها. وتعلو الصرخة: «قفوا، قفوا». ولا من مجيب يلتفت."], [9, "انهبوا الفضة، انهبوا الذهب. لا نهاية لكنوزها أو لنفائس ثروتها."], [10, "أضحت موحشة خاوية جرداء، ذابت منها القلوب رعبا وانحلت منها الركب، طغى عليها الألم وعلا وجوه أهلها الشحوب."], [11, "أين نينوى عرين الأسود ومرتع الأشبال حيث يسرح الأسد واللبوءة والأشبال من غير إزعاج؟"], [12, "قد افترس الأسد ما يكفي لإعالة أشباله وخنق فريسة للبوءاته. قد ملأ عرينه بقنائصه وكهفه بأشلائهم."], [13, "ها أنا أقاومك. يقول الرب القدير. فأحرق مركباتك فتصبح دخانا، ويلتهم السيف لحوم أبنائك، وأستأصل من الأرض غنائمك ولن يتردد في ما بعد صوت مندوبيك."], [1, "ويل للمدينة السافكة الدماء الممتلئة كذبا، المكتظة بالغنائم المنهوبة، التي لا تخلو أبدا من الضحايا."], [2, "ها فرقعة السياط وقعقعة العجلاتِ وجلبة حوافر الخيول وصلصلة المركبات."], [3, "وفرسان واثبة، وسيوف لامعة ورماح بارقة وكثرة قتلى وأكوام جثث لا نهاية لها، بها يتعثرون."], [4, "كل هذا من أجل كثرة زنى نينوى الفاتنة الآسرة ومن أجل سحرها القاتل. لقد استعبدت الشعوب بعهرها والأمم بشعوذتها."], [5, "ها أنا أقاومك، يقول الرب القدير، فأكشف عارك لأطلع الأمم على عورتك والممالك على خزيك."], [6, "وألوثك بالأوساخ وأحقرك وأجعلك عبرة."], [7, "وكل من يراك يعرض عنك قائلا: «قد خربت نينوى فمن ينوح عليها؟ أين أجد لها معزين؟»"], [8, "هل أنت أفضل من طيبة الجاثمة إلى جوار النيل المحاطة بالمياه، المتمنعة بالبحر وبأسوار من المياه."], [9, "كوش ومصر كانتا قوتها اللامتناهية، وفوط وليبيا من حلفائها."], [10, "ومع ذلك فقد وقعت أسيرة واقتيدت إلى السبي، وتمزق أطفالها أشلاء في زاوية كل شارع، واقترع على عظمائها، وصفد نبلاؤها بالأغلال."], [11, "وأنت أيضا تسكرين وتترنحين، وتلتمسين ملجأ من الأعداء"], [12, "وتتساقط جميع حصونك كتساقط بواكير أثمار أشجار التين الناضجة في أفواه من يهزونها."], [13, "انظري إلى جنودك مرتعبين كالنساء في وسطك. صارت أبواب أرضك مفتوحة أمام أعدائك. وشرعت النيران تلتهم مزاليجك."], [14, "خز ني ماء تأهبا للحصار، حصني قلاعك. دوسي أكوام الطين لتجهزي الطوب؛ أصلحي قوالب الطين."], [15, "هناك تلتهمك النار، ويستأصلك السيف، فيبيدك الأعداء كالجراد. تكاثري كالجراد وكالجنادب."], [16, "قد أضحى تجارك أكثر من كواكب السماء، ولكنهم تبددوا كجراد فرد أجنحته وطار."], [17, "أصبح رؤساؤك كالجنادب، وقادتك كأسراب الجراد المتكومة على سياج في يوم بارد. ما إن تشرق الشمس حتى تطير بعيدا إلى حيث لا يعلم أحد."], [18, "قد نام رعاتك ياملك أشور، وغرق عظماؤك في سبات عميق، تشتت شعبك على الجبال ولا يوجد من يجمعهم."], [19, "لا جبر لكسرك، وجرحك مميت. وكل من يسمع بما جرى لك يصفق ابتهاجا لما أصابك، فمن لم يعان من شرك المتمادي؟"]]}, {"l": "Rev 17:1-7", "n": "", "vs": [[1, "وجاء واحد من الملائكة السبعة حاملي الكؤوس السبع وقال لي: «تعال فأريك عقاب الزانية الكبرى الجالسة على المياه الكثيرة،"], [2, "والتي زنى معها ملوك الأرض، وسكر أهل الأرض من خمر زناها»."], [3, "وحملني الملاك بالروح إلى البرية، فرأيت امرأة راكبة على وحش قرمزي له سبعة رؤوس وعشرة قرون، وقد كتبت على جسمه كله أسماء تجديف."], [4, "وكانت المرأة تلبس ملابس من أرجوان وقرمز، وتتحلى بالذهب والحجارة الكريمة واللؤلوء، وقد أمسكت كأس ذهب مملوءة بزناها المكروه النجس،"], [5, "وعلى جبينها اسم مكتوب: سر: «بابل العظمى، أم زانيات الأرض وأصنامها المكروهة»."], [6, "ورأيت المرأة سكرى لكثرة ما شربت من دم القديسين، ودم شهداء يسوع الذين قتلتهم. فتملكتني الدهشة لمنظرها،"], [7, "فسألني الملاك: «لماذا دهشت؟ سأطلعك على ما ترمز إليه المرأة والوحش الذي يحملها، صاحب الرؤوس السبعة والقرون العشرة:"]]}], "kwAr": "عدوتي", "noteAr": ""}, {"kw": "shame", "raw": "Psa_35:26, Psa_109:29; Jer_51:51; Eze_7:18; Oba_1:10", "note": "", "refs": [{"l": "Psa 35:26", "n": "", "vs": [[26, "ليخز ويخجل جميع الشامتين بي في مصيبتي. ليرتد المتعظمون علي لباس الخزي والعار."]]}, {"l": "Psa 109:29", "n": "", "vs": [[29, "ليكتس خصومي خجلا، وليتلفعوا بخزيهم كالرداء."]]}, {"l": "Jer 51:51", "n": "", "vs": [[51, "قد لحقنا الخزي لأننا استمعنا للإهانة، فكسا الخجل وجوهنا، إذ انتهك الغرباء مقادس هيكل الرب."]]}, {"l": "Eze 7:18", "n": "", "vs": [[18, "يتلفعون بالمسوح، ويغشاهم الرعب، ويكسو العار وجوههم جميعا، ويطغى القرع على رؤوسهم."]]}, {"l": "Oba 1:10", "n": "", "vs": [[10, "فمن أجل ما أنزلت بأخيك يعقوب من ظلم، يغشاك العار وتنقرض إلى الأبد."]]}], "kwAr": "الخزي", "noteAr": ""}, {"kw": "Where", "raw": "Psa_42:3, Psa_42:10, Psa_79:10, Psa_115:2; Isa_37:10,Isa_37:11; Dan_3:15; Joe_2:17; Mat_27:43", "note": "", "refs": [{"l": "Psa 42:3", "n": "", "vs": [[3, "قد صارت دموعي طعامي الوحيد نهارا وليلا، إذ قيل لي كل يوم: «أين إلهك»؟"]]}, {"l": "Psa 42:10", "n": "", "vs": [[10, "لقد عيرني مضايقي وسحقوا عظامي، إذ يقولون لي طول النهار: أين إلهك؟»"]]}, {"l": "Psa 79:10", "n": "", "vs": [[10, "لماذا تسألنا الأمم: أين إلهكم؟ دعنا نرى كيف يذيع بين الأمم خبر انتقامك لدماء عبيدك المسفوكة."]]}, {"l": "Psa 115:2", "n": "", "vs": [[2, "لماذا تسألنا الأمم: أين هو إلهكم؟"]]}, {"l": "Isa 37:10", "n": "", "vs": [[10, "«هذا ما تبلغونه إلى حزقيا ملك يهوذا: لا يخدعنك إلهك الذي تتكل عليه عندما يقول: لن تسقط أورشليم في قبضة ملك أشور."]]}, {"l": "Isa 37:11", "n": "", "vs": [[11, "فها أنت قد علمت بما ألحقه ملوك أشور بكل البلدان من تدمير كامل، فهل يمكن أن تنجو أنت؟"]]}, {"l": "Dan 3:15", "n": "", "vs": [[15, "والآن إن كنتم مستعدين لدى سماعكم صوت الالات الموسيقية المختلفة أن تنحنوا وتسجدوا للتمثال الذي صنعته، أعفو عنكم. ولكن إن أبيتم السجود، تطرحون في تلك الساعة في وسط أتون النار المتقدة. وأي إله يقدر أن ينقذكم عندئذ من يدي؟»"]]}, {"l": "Joe 2:17", "n": "", "vs": [[17, "ليبك الكهنة خدام الرب بين الرواق والمذبح قائلين: «اعف عن شعبك يارب ولا تجعل ميراثك مثار احتقار وهزء بين الأمم، فيقولوا بين الشعوب: أين إلههم؟»"]]}, {"l": "Mat 27:43", "n": "", "vs": [[43, "توكل على الله، فليخلصه الآن إن كان يريده! فهو قد قال: أنا ابن الله!»"]]}], "kwAr": "أين", "noteAr": ""}, {"kw": "mine", "raw": "Mic_4:11; Psa_58:10; Mal_1:5; Rev_18:20", "note": "", "refs": [{"l": "Mic 4:11", "n": "", "vs": [[11, "والآن ها أمم غفيرة قد اجتمعت عليك قائلة «لتتدنس أورشليم حتى تتفرس عيوننا في خرابها»."]]}, {"l": "Psa 58:10", "n": "", "vs": [[10, "يفرح الأبرار حين يرون عقاب الأشرار، ويغسلون أقدامهم بدمهم."]]}, {"l": "Mal 1:5", "n": "", "vs": [[5, "وتشهد عيونكم هذا، وتقولون ما أعظم الرب الذي يمتد سلطانه إلى ما وراء تخوم إسرائيل."]]}, {"l": "Rev 18:20", "n": "", "vs": [[20, "اشمتي بها أيتها السماء! واشمتوا بها أيها القديسون والرسل والأنبياء، فقد أصدر الله حكمه عليها بعدما أصدرت أحكامها عليكم»."]]}], "kwAr": "عيناي", "noteAr": ""}, {"kw": "now", "raw": "2Sa_22:43; 2Ki_9:33-37; Psa_18:42; Isa_25:10-12, Isa_26:5, Isa_26:6, Isa_41:15, Isa_41:16; Isa_51:22, Isa_51:23, Isa_63:2, Isa_63:3; Zec_10:5; Mal_4:3", "note": "", "refs": [{"l": "2Sa 22:43", "n": "", "vs": [[43, "فأسحقهم كغبار الأرض، ومثل طين الأسواق أدقهم وأدوسهم."]]}, {"l": "2Ki 9:33-37", "n": "", "vs": [[33, "فقال: «اطرحوها». فألقوا بها من الكوة فتناثر بعض دمها على الجدار وعلى الخيل التي داستها بحوافرها."], [34, "ودخل بعد ذلك إلى القصر حيث أكل وشرب ثم قال: «اذهبوا وافتقدوا هذه المرأة الملعونة وادفنوها، لأنها بنت ملك»."], [35, "وعندما خرجوا ليدفنوها لم يجدوا من أشلائها سوى الجمجمة والرجلين وكفي اليدين،"], [36, "فرجعوا وأخبروه، فقال: «هذا إتمام لقضاء الرب الذي نطق به على لسان إيليا التشبي قائلا: إن الكلاب ستلتهم لحم إيزابل في حقل يزرعيل."], [37, "وتصبح جثة إيزابل كالزبل على وجه حقل يزرعيل بحيث لا يتعرف عليها أحد فيقول: هذه إيزابل»."]]}, {"l": "Psa 18:42", "n": "", "vs": [[42, "فأسحقهم كالغبار في مهب الريح، وأطرحهم مثل الطين في الشوارع."]]}, {"l": "Isa 25:10-12", "n": "", "vs": [[10, "لأن يد الرب تستقر على هذا الجبل ويوطأ موآب في مكانه كما يوطأ التبن في الطين."], [11, "ويبسط يديه في وسط موآب كما يبسط السابح يديه ليسبح، ويخفض الرب من كبريائه ومن مكايد يديه،"], [12, "ويهدم أسواره الحصينة الشامخة، ويخفضها حتى تتساوى مع التراب."]]}, {"l": "Isa 26:5", "n": "", "vs": [[5, "لقد أذل الساكنين في العلاء، وخفض المدينة المتشامخة. ساواها بالأرض وطرحها إلى التراب،"]]}, {"l": "Isa 26:6", "n": "", "vs": [[6, "فداستها أقدام البائس والفقير."]]}, {"l": "Isa 41:15", "n": "", "vs": [[15, "وها أنا أجعلك نورجا محددا جديدا مسننا، فتدرس الجبال وتجعل التلال كالعصافة،"]]}, {"l": "Isa 41:16", "n": "", "vs": [[16, "فتذريها، وتحملها الريح بعيدا، وتبددها الزوبعة. أما أنت فتبتهج بالرب وتمجد قدوس إسرائيل."]]}, {"l": "Isa 51:22", "n": "", "vs": [[22, "هذا ما يقوله سيدك الرب، إلهك الذي يدافع عن دعوى شعبه: ها أنا قد أخذت من يدك كأس الترنح، ولن تجرعي من كأس غضبي بعد."]]}, {"l": "Isa 51:23", "n": "", "vs": [[23, "وأضعها في يد معذبيك الذين قالوا لك: انحني حتى ندوس عليك عابرين. فجعلت ظهرك لهم أرضا، وطريقا لهم يمرون عليه."]]}, {"l": "Isa 63:2", "n": "", "vs": [[2, "ما بال ردائك أحمر وثيابك كمن داس عنب المعصرة؟"]]}, {"l": "Isa 63:3", "n": "", "vs": [[3, "لقد دست المعصرة وحدي، ولم يكن معي أحد من الشعوب. قد دستهم في سخطي ووطئتهم في غيظي، فتناثر دمهم على ردائي ولطخت ثيابي."]]}, {"l": "Zec 10:5", "n": "", "vs": [[5, "ويدوسون الأعداء معا كما يدوس الجبابرة الطين في الشوارع، ويحاربون لأن الرب معهم فيلحقون العار بفرسان الأعداء."]]}, {"l": "Mal 4:3", "n": "", "vs": [[3, "وتطأون الأشرار، إذ يكونون رمادا تحت بطون أقدامكم، في اليوم الذي أجري فيه أعمالي، يقول الرب القدير."]]}], "kwAr": "ستشهدها", "noteAr": ""}, {"kw": "trodden down", "raw": "Heb. for a treading down", "note": "Heb. for a treading down", "refs": [], "kwAr": "تداس", "noteAr": "بالعبرية: «للدوس»."}], "arS": [["عندئذ ", []], ["ترى", ["H7200"]], [" ذلك ", []], ["عدوتي", ["H341"]], [" ", []], ["فيعتريها", ["H3680"]], [" ", []], ["الخزي", ["H955"]], [" إذ ", []], ["قالت", ["H559"]], [" ", []], ["لي", ["H413"]], [": «", []], ["أين", ["H346"]], [" هو ", []], ["الرب", ["H3068"]], [" ", []], ["إلهك", ["H430"]], ["؟» ", []], ["ستشهدها", ["H7200"]], [" ", []], ["عيناي", ["H5869"]], [" ", []], ["تداس", ["H4823"]], [" ", []], ["كطين", ["H2916"]], [" ", []], ["الشوارع", ["H2351"]], [" والأزقة.", []]]}, {"c": 7, "v": 11, "text": "ها قد أقبل يوم بناء أسوار مدينتك.في ذلك اليوم تتسع تخومك.", "groups": [{"kw": "the day", "raw": "Neh_2:17, 3:1-16, Neh_4:3, Neh_4:6; Dan_9:25; Amo_9:11-15", "note": "", "refs": [{"l": "Neh 2:17", "n": "", "vs": [[17, "ثم قلت لهم: أنتم تشهدون ما نحن عليه من ضنك، فأورشليم خربة وأبوابها محترقة، فهيا بنا نبني سور أورشليم فلا نقاسي بعد من العار."]]}, {"l": "Neh 3:1-16", "n": "", "vs": [[1, "وقام ألياشيب رئيس الكهنة وبنى باب الضأن بمؤازرة إخوته الكهنة. ثم قدسوه وثبتوا مصاريعه، وثابروا على البناء حتى بلغوا برج المئة وبرج حننئيل."], [2, "وقام رجال أريحا إلى جوارهم يبنون جزءا من السور، وإلى جوارهم بنى زكور بن إمري،"], [3, "وبنى بنو هسناءة باب السمك، وسقفوه ونصبوا مصاريعه وأقفاله وعوارضه."], [4, "وإلى جوارهم رمم مريموث بن أوريا بن هقوص قسما من السور، كما قام إلى جوارهم مشلام بن برخيا بن مشيزبئيل بالترميم، وإلى جانبه رمم صادوق بن بعنا."], [5, "وإلى جوارهم رمم التقوعيون. أما أشرافهم فامتنعوا عن مؤازرة عمل أسيادهم."], [6, "ورمم يوياداع بن فاسيح ومشلام بن بسوديا الباب العتيق، وسقفاه ونصبا مصاريعه وأقفاله وعوارضه."], [7, "وإلى جوارهما قام ملطيا الجبعوني ويادون الميرونوثي من أهل جبعون والمصفاة بالترميم، حتى وصل إلى قصر حاكم منطقة غربي الفرات."], [8, "ورمم إلى جوارهما عزيئيل بن حرهايا الصائغ. وإلى جانبه رمم حننيا العطار وتركوا ترميم أورشليم إلى السور العريض."], [9, "وإلى جوارهم رمم رفايا بن حور، رئيس نصف دائرة أورشليم، جزءا من السور."], [10, "كما رمم إلى جوارهم يدايا بن حروماف القسم المقابل لبيته. وإلى جانبه رمم حطوش بن حشبنيا."], [11, "ورمم ملكيا بن حاريم وحشوب بن فحث موآب قسما ثانيا، بالإضافة إلى برج التنانير."], [12, "وقام إلى جانبه شلوم بن هلوحيش رئيس نصف دائرة أورشليم هو وبناته بالترميم."], [13, "ورمم حانون وسكان زانوح باب الوادي، ونصبوا مصاريعه وأقفاله وعوارضه، فضلا عن ألف ذراع (خمس مئة متر) من السور حتى باب الدمن."], [14, "ورمم ملكيا بن ركاب رئيس دائرة بيت هكاريم باب الدمن ونصب مصاريعه وأقفاله وعوارضه."], [15, "كما رمم شلون بن كلحوزة رئيس دائرة المصفاة باب العين وسقفه ونصب مصاريعه وأقفاله وعوارضه، وأعاد بناء سور بركة سلوام عند حديقة الملك حتى الدرج المنحدر من مدينة داود."], [16, "وبعده رمم نحميا بن عزبوق رئيس نصف دائرة بيت صور جزءا من السور حتى مقابل مدافن داود، فالبركة الاصطناعية إلى بيت الأبطال."]]}, {"l": "Neh 4:3", "n": "", "vs": [[3, "وكان طوبيا العموني واقفا إلى جواره، فقال: «إن ما يبنونه إذا صعد عليه ثعلب فإنه يهدم حجارة سورهم»."]]}, {"l": "Neh 4:6", "n": "", "vs": [[6, "وهكذا قمنا بإعادة بناء كل السور حتى نصف ارتفاعه. وكان الشعب يعمل بقلب واحد."]]}, {"l": "Dan 9:25", "n": "", "vs": [[25, "لهذا فاعلم وافهم أن الحقبة الممتدة منذ صدور الأمر بإعادة بناء أورشليم إلى مجيء المسيح، سبعة أسابيع، ثم اثنان وستون أسبوعا يبنى في غضونها سوق وخليج. إنما تكون تلك أزمنة ضيق."]]}, {"l": "Amo 9:11-15", "n": "", "vs": [[11, "في ذلك اليوم أقيم مسكن داود الذي تهاوى، وأسد ثغراته وأعمر خرائبه وأعيد بناءه كالعهد به في الأيام الغابرة."], [12, "لكي يرث إسرائيل ما تبقى من أدوم وجميع الأمم التي دعي اسمي عليها، يقول الرب صانع هذه الأمور."], [13, "ها أيام تأتي يقول الرب، يدرك فيها الحارث الحاصد، ودائس العنب باذر الحب، وتسيل الخمور الطيبة من كروم الجبال وتفيض بها التلال كلها."], [14, "وأرد سبي شعبي إسرائيل فيعيدون بناء المدن الخربة ويسكنونها، ويزرعون كروما ويشربون من خمرها، ويغرسون جنات ويأكلون من ثمارها."], [15, "وأغرس شعبي في أرضهم فلا يستأصلون ثانية أبدا من الأرض التي وهبتها لهم، يقول الرب إلهكم."]]}], "kwAr": "يوم بناء", "noteAr": ""}, {"kw": "shall", "raw": "Ezr_4:12-24; Neh_2:8", "note": "", "refs": [{"l": "Ezr 4:12-24", "n": "", "vs": [[12, "ليعلم الملك أن اليهود الذين وفدوا علينا من عندك، جاءوا إلى أورشليم وانهمكوا في بناء المدينة المتمردة الشريرة، وقد استكملوا بناء أسوارها ورمموا أسسها."], [13, "فليحط الملك علما أنه إذا تم بناء هذه المدينة واستكملت أسوارها، فإن أهلها لن يؤدوا جزية ولا خراجا ولا خفارة مما يضير خزينة قصر الملك."], [14, "ومن حيث أننا نقتات من خير الملك، فلا يليق بنا أن نرى ما يصيب الملك من ضرر ونسكت عنه، لذلك أرسلنا نبلغك،"], [15, "لكي تنقب في سجلات تواريخ آبائك فتتبين أن هذه المدينة كانت مدينة متمردة أضرت بالملوك والبلاد وعصت منذ الأيام القديمة، لذلك حل بها الخراب."], [16, "ونحن نحذر الملك أنه إذا أعيد بناء هذه المدينة، واستكملت أسوارها، فإنك تفقد كل ما تملك عليه في عبر نهر الفرات»."], [17, "فبعث الملك جوابا إلى رحوم الوالي وشمشاي الكاتب وسائر رفقائهما المقيمين في السامرة وإلى باقي القاطنين في عبر نهر الفرات، قال فيها: «سلام وبعد،"], [18, "لقد ترجمت رسالتكم وقرئت أمامي،"], [19, "فأصدرت أمري بالبحث عن تاريخ هذه المدينة، فوجدت أنها كانت منذ الأيام الغابرة دائمة الثورة على الملوك ومهدا للتمرد والعصيان،"], [20, "وقد تولى عرش أورشليم ملوك مقتدرون تسلطوا على جميع منطقة عبر النهر، التي أدى أهلها لهم جزية وخراجا وخفارة."], [21, "والآن أصدروا أمرا إلى هؤلاء بالكف عن بناء هذه المدينة حتى يصدر أمر مني."], [22, "وحذار أن تتراخوا في تنفيذ هذا الأمر، إذ لماذا يزداد الأذى، فيسبب أضرارا تلحق خسارة بمصالح الملوك؟»"], [23, "وما إن تليت رسالة أرتحششتا الملك أمام رحوم وشمشاي الكاتب ورفقائهم، حتى انطلقوا مسرعين إلى اليهود في أورشليم ومنعوهم بالقوة من متابعة البناء."], [24, "حينئذ توقف العمل في بناء هيكل الرب في أورشليم حتى السنة الثانية من تولي الملك داريوس عرش مملكة فارس."]]}, {"l": "Neh 2:8", "n": "", "vs": [[8, "ورسالة إلى آساف المسئول عن غابات الملك ليعطيني أخشابا أصنع منها دعائم بوابات القلعة المجاورة للهيكل، وسور المدينة، والدار التي سأقيم فيها». فوافق الملك على طلبي بفضل رعاية إلهي الصالحة لي."]]}], "kwAr": "تتسع", "noteAr": ""}], "arS": [["ها قد أقبل ", []], ["يوم", ["H3117"]], [" ", []], ["بناء", ["H1129"]], [" ", []], ["أسوار", ["H1447"]], [" مدينتك.في ", []], ["ذلك", ["H1931"]], [" ", []], ["اليوم", ["H3117"]], [" ", []], ["تتسع", ["H7368"]], [" ", []], ["تخومك", ["H2706"]], [".", []]]}, {"c": 7, "v": 12, "text": "ويتقاطر إليك شعبك في ذلك اليوم، من أشور ومن مدن مصر حتى نهر الفرات؛ من بحر إلى بحر؛ ومن جبل إلى جبل.", "groups": [{"kw": "also", "raw": "Isa_11:16, Isa_19:23-25, Isa_27:12, Isa_27:13, Isa_43:6, Isa_49:12, Isa_60:4-9, Isa_66:19, Isa_66:20; Jer_3:18, Jer_23:3, Jer_31:8; Eze_37:21, Eze_29:21; Hos_11:11", "note": "", "refs": [{"l": "Isa 11:16", "n": "", "vs": [[16, "ويمد الرب طريقا من أشور ليعود منه من بقي هناك من بني إسرائيل، كما أعاد الرب جميع إسرائيل من مصر."]]}, {"l": "Isa 19:23-25", "n": "", "vs": [[23, "في ذلك اليوم يمتد طريق من مصر إلى أشور، ومن أشور إلى مصر، فيعبد المصريون والأشوريون الرب معا."], [24, "في ذلك اليوم يكون إسرائيل ثالث ثلاثة مع مصر وأشور، وبركة في وسط الأرض،"], [25, "فيباركهم الرب القدير قائلا: «مبارك شعبي مصر، وصنعة يدي أشور، وميراثي إسرائيل»."]]}, {"l": "Isa 27:12", "n": "", "vs": [[12, "في ذلك اليوم ينتقيكم الرب من مجرى الفرات إلى وادي النيل، كما ينتقى القمح، ويجمعكم واحدا فواحدا يا بني إسرائيل."]]}, {"l": "Isa 27:13", "n": "", "vs": [[13, "في ذلك اليوم ينفخ في بوق عظيم فيأتي التائهون في أرض أشور، والمنفيون إلى ديار مصر، ليسجدوا للرب في جبل قدسه، في أورشليم."]]}, {"l": "Isa 43:6", "n": "", "vs": [[6, "أقول للشمال: أطلقهم من عقالك، وللجنوب لا تحجزهم. اجمع أبنائي من بعيد وبناتي من أقاصي الأرض،"]]}, {"l": "Isa 49:12", "n": "", "vs": [[12, "انظروا، ها هم يقبلون من ديار بعيدة، هؤلاء من الشمال والغرب، وهؤلاء من أرض سينيم."]]}, {"l": "Isa 60:4-9", "n": "", "vs": [[4, "تأملي حولك وانظري، فها هم جميعا قد اجتمعوا، وأتوا إليك. يجيء أبناؤك من مكان بعيد، وتحمل بناتك على الأذرع."], [5, "عندئذ تنظرين وتتهللين، وتطغى الإثارة على قلبك، وتمتلئين فرحا لأن ثروات البحر تتحول إليك وغنى الأمم يتدفق عليك."], [6, "تكتظ أرضك بكثرة الإبل. من أرض مديان وعيفة تغشاك بكران، تتقاطر إليك من شبا محملة بالذهب واللبان وتذيع تسبيح الرب."], [7, "جميع قطعان قيدار تجتمع إليك، وكباش نبايوت تخدمك، تقدم قرابين مقبولة على مذبحي، وأمجد بيتي البهي."], [8, "من هؤلاء الطائرون كالسحاب وكالحمام إلى أعشاشها؟"], [9, "فالجزائر تنتظرني، وفي الطليعة سفن ترشيش حاملة أبناءك لتأتي بهم من أرض بعيدة، ومعهم فضتهم وذهبهم، تكريما لاسم الرب إلهك ولقدوس إسرائيل لأنه قد مجدك."]]}, {"l": "Isa 66:19", "n": "", "vs": [[19, "وأجعل بينهم آية وأبعث بعض الناجين منهم إلى الأمم: إلى ترشيش، وفول، ولود، المهرة في رمي السهام، وإلى توبال وياوان وإلى الجزائر البعيدة ممن لم يسمعوا بشهرتي أو يروا مجدي، فيذيعون مجدي بين الأمم."]]}, {"l": "Isa 66:20", "n": "", "vs": [[20, "ويحضرون جميع إخوتكم من سائر الأمم، تقدمة للرب، على متون الجياد، وفي المركبات والهوادج، وعلى ظهور البغال وأسنمة الجمال، إلى أورشليم جبل قدسي، كما يحضر الإسرائيليون تقدمة الحنطة في آنية طاهرة إلى بيت الرب"]]}, {"l": "Jer 3:18", "n": "", "vs": [[18, "وتنضم في تلك الأيام ذرية يهوذا إلى ذرية إسرائيل ويأتون معا من أرض الشمال إلى الديار التي أورثتها لآبائهم."]]}, {"l": "Jer 23:3", "n": "", "vs": [[3, "وأجمع شتات غنمي من جميع الأراضي التي أجليتها إليها، وأردها إلى مراعيها فتنمو وتتكاثر،"]]}, {"l": "Jer 31:8", "n": "", "vs": [[8, "ها أنا آتي بهم من بلاد الشمال، وأجمعهم من أقصى أطراف الأرض، وفيهم الأعمى والأعرج، الحبلى والماخض، فيرجع حشد عظيم إلى هنا."]]}, {"l": "Eze 37:21", "n": "", "vs": [[21, "وها أنا أحشد أبناء إسرائيل من بين الأمم التي تفرقوا فيها وأجمعهم من كل جهة وأحضرهم إلى أرضهم."]]}, {"l": "Eze 29:21", "n": "", "vs": [[21, "في ذلك اليوم، أنمي قوة شعب إسرائيل وأفتح فمك بينهم، فيدركون أني أنا الرب»."]]}, {"l": "Hos 11:11", "n": "", "vs": [[11, "ويهرعون كالطيور من مصر، وكحمام من أرض أشور، وأردهم إلى بيوتهم."]]}], "kwAr": "ويتقاطر", "noteAr": ""}, {"kw": "and from", "raw": "or, even to, This verse may be rendered, In that day they (people) shall come to thee from Assyria and the fenced cities; and from the fortress (probably Pelusium at the entrance of Egypt), even to the river (Euphrates), etc. The expressions employed in this prophecy appear to be too strong for the events which transpired after the Babylonian captivity; and seem to refer to the future restoration of Israel, after their land has lain desolate for ages.", "note": "or, even to, This verse may be rendered, In that day they (people) shall come to thee from Assyria and the fenced cities; and from the fortress (probably Pelusium at the entrance of Egypt), even to the river (Euphrates), etc. The expressions employed in this prophecy appear to be too strong for the events which transpired after the Babylonian captivity; and seem to refer to the future restoration of Israel, after their land has lain desolate for ages.", "refs": [], "kwAr": "ومن مدن", "noteAr": "أو: «حتى». يمكن ترجمة هذه الآية هكذا: في ذلك اليوم يأتون (الشعب) إليك من أشور ومن المدن المحصنة، ومن الحصن (ربما الفرما عند مدخل مصر) حتى النهر (الفرات) إلخ. ويبدو أن التعابير المستعملة في هذه النبوة أقوى مما تفي به الأحداث التي جرت بعد السبي البابلي، وكأنها تشير إلى الاستعادة المستقبلية لإسرائيل بعد أن تبقى أرضهم خرابا دهورا."}], "arS": [["ويتقاطر", ["H935"]], [" إليك شعبك في ", []], ["ذلك", ["H1931"]], [" ", []], ["اليوم", ["H3117"]], ["، ", []], ["من", ["H4480"]], [" ", []], ["أشور", ["H804"]], [" ", []], ["ومن", ["H4480"]], [" ", []], ["مدن", ["H5892"]], [" ", []], ["مصر", ["H4693"]], [" ", []], ["حتى", ["H5704"]], [" ", []], ["نهر", ["H5104"]], [" الفرات؛ ", []], ["من", ["H4480"]], [" ", []], ["بحر", ["H3220"]], [" إلى ", []], ["بحر", ["H4480", "H3220"]], ["؛ ", []], ["ومن", ["H4480"]], [" ", []], ["جبل", ["H2022"]], [" إلى ", []], ["جبل", ["H2022"]], [".", []]]}, {"c": 7, "v": 13, "text": "غير أن الأرض تكون موحشة بسبب سيئات سكانها.", "groups": [{"kw": "", "raw": "Not withstanding the land shall be, or, After that the land hath been, Lev_26:33-39; Isa_6:11-13, Isa_24:3-8; Jer_25:11; Dan_4:26, Dan_4:27; Luk_21:20-24", "note": "Not withstanding the land shall be, or, After that the land hath been, Lev_26:33-39; Isa_6:11-13, Isa_24:3-8; Jer_25:11; Dan_4:26, Dan_4:27; Luk_21:20-24", "refs": [{"l": "Lev 26:33-39", "n": "", "vs": [[33, "وأشتتكم بين الشعوب، وأجرد عليكم سيفي، وألاحقكم، وأحول أرضكم إلى قفر ومدنكم إلى خرائب."], [34, "عندئذ تستوفي الأرض راحة سبوتها طوال سني وحشتها وأنتم مشتتون في ديار أعدائكم. حينئذ ترتاح الأرض وتستوفي سني سبوتها."], [35, "فتعوض في أيام وحشتها عن راحتها التي لم تنعم بها في سنوات سبوتكم عندما كنتم تقيمون عليها."], [36, "أما الباقون منكم في أرض أعدائكم، فإني ألقي الرعب في قلوبهم فيهربون من حفيف ورقة تسوقها الريح، وكأنهم يهربون من السيف، ويسقطون وليس ثمة من طارد لهم."], [37, "ويعثر بعضهم ببعض كمن يفر من أمام سيف من غير طارد لهم، ولا تثبتون أمام أعدائكم"], [38, "فتهلكون بين الشعوب، وتبتلعكم أرض أعدائكم."], [39, "أما بقيتكم فتفنى بذنوبها وذنوب آبائها في أرض أعدائكم كما فني آباؤهم من قبلهم."]]}, {"l": "Isa 6:11-13", "n": "", "vs": [[11, "ثم قلت: «إلى متى يارب؟» فأجاب: «إلى أن تصبح المدن خربة مهجورة، والبيوت خالية من الرجال، والحقول خرابا مقفرا."], [12, "وينفي الرب الإنسان بعيدا، وتكثر الأماكن الموحشة في وسط الأرض."], [13, "وحتى لو بقي بعد ذلك عشر أهلها، فإنها ستحرق ثانية، ولكنها تكون كالبطمة والبلوطة، التي وإن قطعت يبقى ساقها قائما: هكذا يبقى ساقها زرعا مقدسا»."]]}, {"l": "Isa 24:3-8", "n": "", "vs": [[3, "ويحل الخراب بالأرض وتنهب نهبا، لأن الرب قد تكلم بهذا القضاء."], [4, "وتنوح الأرض وتذوي، وتضنى المسكونة وتذبل، ويحزن معها عظماؤها."], [5, "تدنست الأرض تحت سكانها، لأنهم تعدوا على الشريعة، ونقضوا الفرائض ونكثوا العهد الأبدي،"], [6, "لذلك التهمت اللعنة الأرض، وعوقب أهلها بإثمهم، فاحترق سكان الأرض ولم يبق منهم سوى قلة."], [7, "قد انتحبت الخمرة، وذبلت الكرمة، وأن جميع ذوي القلوب الطربة."], [8, "خرس طرب الدفوف، كف ضجيج المبتهجين، وصمت مرح العود."]]}, {"l": "Jer 25:11", "n": "", "vs": [[11, "فتصبح هذه الأرض بأسرها قفرا خرابا، وتستعبد جميع هذه الأمم لملك بابل طوال سبعين سنة."]]}, {"l": "Dan 4:26", "n": "", "vs": [[26, "أما الأمر الصادر بالمحافظة على ساق الشجرة فمعناه أن مملكتك تبقى لك حتى تدرك أن السيادة هي للسماء."]]}, {"l": "Dan 4:27", "n": "", "vs": [[27, "لذلك أيها الملك، تقبل مشورتي وتخل عن خطاياك بالبر وآثامك بممارسة الرحمة مع البائسين، عسى أن يطول فلاحك»."]]}, {"l": "Luk 21:20-24", "n": "", "vs": [[20, "وعندما ترون أورشليم محاصرة بالجيوش، فاعلموا أن خرابها قد اقترب."], [21, "عندئذ، ليهرب الذين في منطقة اليهودية إلى الجبال، وليرحل من المدينة من هم فيها، ولا يدخلها من هم في الأرياف:"], [22, "فإن هذه الأيام أيام انتقام يتم فيها كل ما قد كتب."], [23, "ولكن الويل للحبالى والمرضعات في تلك الأيام، لأن ضيقة عظيمة سوف تقع على الأرض وغضبا شديدا سينزل بهذا الشعب،"], [24, "فيسقطون بحد السيف ويساقون أسرى إلى جميع الأمم، وتبقى أورشليم تدوسها الأمم إلى أن تكتمل أزمنة الأمم."]]}], "kwAr": "", "noteAr": "«ومع ذلك تكون الأرض»، أو: «بعد أن تصير الأرض». انظر لا 26: 33-39؛ إش 6: 11-13؛ 24: 3-8؛ إر 25: 11؛ دا 4: 26، 27؛ لو 21: 20-24"}, {"kw": "for", "raw": "Mic_3:12; Job_4:8; Pro_1:31, Pro_5:22, Pro_31:31; Isa_3:10,Isa_3:11; Jer_17:10, Jer_21:14; Jer_32:19; Gal_6:7, Gal_6:8", "note": "", "refs": [{"l": "Mic 3:12", "n": "", "vs": [[12, "لهذا من جراء أعمالكم ستحرث صهيون كالحقل وتصبح أورشليم كومة من الخرائب، وجبل الهيكل مرتفعا تنمو عليه أشجار الغاب."]]}, {"l": "Job 4:8", "n": "", "vs": [[8, "بل كما شاهدت فإن الحارثين إثما، والزارعين شقاوة، هم يحصدونهما،"]]}, {"l": "Pro 1:31", "n": "", "vs": [[31, "لذلك يأكلون ثمار أعمالهم المرة، ويشبعون من عواقب مؤامراتهم"]]}, {"l": "Pro 5:22", "n": "", "vs": [[22, "آثام المنافق تتصيده، ويعلق بحبال خطيئته."]]}, {"l": "Pro 31:31", "n": "", "vs": [[31, "أعطوها من ثمر يديها، ولتكن أعمالها مصدر الثناء عليها."]]}, {"l": "Isa 3:10", "n": "", "vs": [[10, "ولكن بشروا الصديقين بالخير لأنهم سيتمتعون بثواب أعمالهم"]]}, {"l": "Isa 3:11", "n": "", "vs": [[11, "أما الشرير فويل له وبئس المصير لأنه يجازى على ما جنته يداه"]]}, {"l": "Jer 17:10", "n": "", "vs": [[10, "أنا الرب أفحص القلوب وأمتحن الأفكار، لأجازي كل واحد حسب طرقه، وبمقتضى أفعاله»."]]}, {"l": "Jer 21:14", "n": "", "vs": [[14, "ها أنا أعاقبكم بحسب ثمار أعمالكم، وأوقد نارا في غابة مدينتكم فتلتهم كل ما حولها»."]]}, {"l": "Jer 32:19", "n": "", "vs": [[19, "عظيم في المشورة وقادر في العمل، وعيناك مفتوحتان تراقبان جميع طرق الإنسان لتجازي كل واحد حسب تصرفاته وثمار أعماله."]]}, {"l": "Gal 6:7", "n": "", "vs": [[7, "لا تنخدعوا: إن الله لا يستهزأ به. فكل ما يزرعه الإنسان، فإياه يحصد أيضا."]]}, {"l": "Gal 6:8", "n": "", "vs": [[8, "فإن من يزرع لجسده، فمن الجسد يحصد فسادا. ومن يزرع للروح، فمن الروح يحصد حياة أبدية. فلا نفشل في عمل الخير،"]]}], "kwAr": "بسبب", "noteAr": ""}], "arS": [["غير أن ", []], ["الأرض", ["H776"]], [" ", []], ["تكون", ["H1961"]], [" ", []], ["موحشة", ["H8077"]], [" ", []], ["بسبب", ["H5921"]], [" ", []], ["سيئات", ["H4480", "H6529", "H4611"]], [" ", []], ["سكانها", ["H3427"]], [".", []]]}, {"c": 7, "v": 14, "text": "ارع يارب شعبك بعصاك، فهم قطيع ميراثك الرابضون وحدهم في الغابة في وسط الكرمل. قدهم إلى باشان وجلعاد ليتمتعوا بخصب أرضهما كالعهد بهم في أيام القدم.", "groups": [{"kw": "Feed", "raw": "or, Rule, Mic_5:4 *marg. Psa_23:1-4, Psa_28:9, Psa_95:7, Psa_100:3; Isa_40:11, Isa_49:10; Mat_2:6 *marg. Joh_10:27-30", "note": "or, Rule, Mic_5:4 *marg. Psa_23:1-4, Psa_28:9, Psa_95:7, Psa_100:3; Isa_40:11, Isa_49:10; Mat_2:6 *marg. Joh_10:27-30", "refs": [{"l": "Mic 5:4", "n": "*marg.", "vs": [[4, "فيقوم ويرعى شعبه بقوة الرب وبجلال اسم الرب إلهه، فيعيشون بأمن، لأن عظمته تمتد إلى أقاصي الأرض."]]}, {"l": "Psa 23:1-4", "n": "", "vs": [[1, "الرب راعي فلست أحتاج إلى شيء."], [2, "في مراع خضراء يربضني، وإلى مياه هادئة يقودني."], [3, "ينعش نفسي ويرشدني إلى طرق البر إكراما لاَسمه."], [4, "حتى إذا اجتزت وادي ظلال الموت، لا أخاف سوءا لأنك ترافقني. عصاك وعكازك هما معي يشددان عزيمتي."]]}, {"l": "Psa 28:9", "n": "", "vs": [[9, "خلص يارب شعبك وبارك ميراثك. كن راعيا لهم واحملهم إلى الأبد."]]}, {"l": "Psa 95:7", "n": "", "vs": [[7, "فإنه هو إلهنا، ونحن رعيته وقطيعه الذي يقوده بيده. اليوم إن سمعتم صوته،"]]}, {"l": "Psa 100:3", "n": "", "vs": [[3, "اعلموا أن الرب هو الله . هو صنعنا ونحن له، نحن شعبه وقطيع مرعاه."]]}, {"l": "Isa 40:11", "n": "", "vs": [[11, "يرعى قطيعه كراع، ويجمع الحملان بذراعه، وفي أحضانه يحملها ويقود المرضعات برفق."]]}, {"l": "Isa 49:10", "n": "", "vs": [[10, "لا يجوعون ولا يعطشون، ولا يعييهم لهيب الصحراء ولا لفح الشمس، لأن راحمهم يهديهم ويقودهم إلى ينابيع المياه."]]}, {"l": "Mat 2:6", "n": "*marg.", "vs": [[6, "وأنت يابيت لحم بأرض يهوذا، لست صغيرة الشأن أبدا بين حكام يهوذا، لأنه منك يطلع الحاكم الذي يرعى شعبي إسرائيل! »"]]}, {"l": "Joh 10:27-30", "n": "", "vs": [[27, "فخرافي تصغي لصوتي، وأنا أعرفها وهي تتبعني،"], [28, "وأعطيها حياة أبدية، فلا تهلك إلى الأبد، ولا ينتزعها أحد من يدي."], [29, "إن الآب الذي أعطاني إياها هو أعظم من الجميع، ولا يقدر أحد أن ينتزع من يد الآب شيئا."], [30, "أنا والآب واحد!»"]]}], "kwAr": "ارع", "noteAr": "أو: «احكم». انظر مي 5: 4؛ مز 23: 1-4؛ 28: 9؛ 95: 7؛ 100: 3؛ إش 40: 11؛ 49: 10؛ مت 2: 6؛ يو 10: 27-30"}, {"kw": "which", "raw": "Exo_33:16; Num_23:9; Deu_33:28; Joh_17:16", "note": "", "refs": [{"l": "Exo 33:16", "n": "", "vs": [[16, "إذ كيف يدرك أنني وشعبك قد حظينا برضاك؟ أليس بمرافقتك لنا، فنتميز أنا وشعبك بذلك عن جميع الشعوب الساكنين في الأرض؟»"]]}, {"l": "Num 23:9", "n": "", "vs": [[9, "ها أنا أراهم من قمم الصخور، ومن الآكام أبصرهم. هوذا شعب يسكن وحده. ولا يحسبون أنفسهم أمة من الأمم."]]}, {"l": "Deu 33:28", "n": "", "vs": [[28, "ليسكن بنو إسرائيل آمنين وحدهم، ولتجر ينابيع ماء يعقوب إلى أرض حنطة وخمر، وتقطر سماؤه بالندى."]]}, {"l": "Joh 17:16", "n": "", "vs": [[16, "فهم ليسوا من أهل العالم كما أني لست من العالم."]]}], "kwAr": "الرابضون", "noteAr": ""}, {"kw": "in the midst", "raw": "Isa_35:2, Isa_37:24, Isa_65:10; Jer_50:19, Jer_50:20; Eze_34:13, Eze_34:14; Zep_3:13", "note": "", "refs": [{"l": "Isa 35:2", "n": "", "vs": [[2, "تزدهر ازدهارا، وتبتهج أشد بهجة ويضفى عليها مجد لبنان وجلال الكرمل وشارون ويشهدون مجد الرب وبهاء إلهنا."]]}, {"l": "Isa 37:24", "n": "", "vs": [[24, "لقد عيرت السيد على لسان رسلك، وقلت: بكثرة مركباتي قد صعدت إلى أعالي الجبال، وبلغت أقاصي لبنان قاطعا أطول أرزه وخيار سروه واخترقت أبعد ربوعه وأفضل غاباته."]]}, {"l": "Isa 65:10", "n": "", "vs": [[10, "وتصبح أرض شارون مرعى للقطعان، ووادي عخور مربض بقر لشعبي الذي طلبني."]]}, {"l": "Jer 50:19", "n": "", "vs": [[19, "وأرد إسرائيل إلى مرتعه، فيرعى في الكرمل وفي باشان، وتشبع نفسه في جبل أفرايم وجلعاد."]]}, {"l": "Jer 50:20", "n": "", "vs": [[20, "وفي ذلك الزمان والأوان، يقول الرب، يلتمس إثم إسرائيل فلا يوجد، وخطيئة يهوذا فلا تكون، لأني أعفو عمن أبقيته منهما."]]}, {"l": "Eze 34:13", "n": "", "vs": [[13, "وأخرجه من بين الشعوب وأجمعه من البلدان، وأرده إلى أرضه، حيث أرعاه على جبال إسرائيل وفي الأودية وفي جميع أماكن الأرض الآهلة."]]}, {"l": "Eze 34:14", "n": "", "vs": [[14, "وأرعاه في مروج خصيبة، وتكون جبال إسرائيل الشاهقة مراعي رائعة يربضون في مراحها الطيب، ويرعون في مراع خصيبة على جبال إسرائيل."]]}, {"l": "Zep 3:13", "n": "", "vs": [[13, "ولن يرتكب بقية إسرائيل الإثم، ولا ينطقون بالكذب، وليس في أفواههم غش، بل يعيشون آمنين من غير أن يهددهم أحد."]]}], "kwAr": "وسط", "noteAr": ""}, {"kw": "as", "raw": "Psa_77:5-11, Psa_143:5; Lam_1:7, Lam_5:21; Amo_9:11; Mal_3:4", "note": "", "refs": [{"l": "Psa 77:5-11", "n": "", "vs": [[5, "فكرت في الأيام القديمة وفي السنين السحيقة."], [6, "في الليل أتذكر ترنيمي، وأناجي قلبي، وتجد في البحث نفسي."], [7, "هل إلى الأبد يرفضنا الرب ولا يرضى عنا أبدا؟"], [8, "هل انتهت رحمته إلى الأبد؟ هل انقطعت عنا مواعيده؟"], [9, "ألعل الله نسي رأفته؟ أم حبس بغضب مراحمه؟"], [10, "ثم قلت: «هذا يسقمني: أن يمين الله العلي قد تحولت (عنا)»"], [11, "أذكر أعمالك يارب. أذكر عجائبك التي عملتها في القديم،"]]}, {"l": "Psa 143:5", "n": "", "vs": [[5, "تذكرت الأيام السالفة متأملا في جميع أعمالك، متفكرا في صنيع يديك."]]}, {"l": "Lam 1:7", "n": "", "vs": [[7, "تذكرت أورشليم في أيام شقائها ومحنتها جميع ما كانت تتمتع به من مشتهيات في حقبها الغابرة. عندما وقع شعبها في قبضة العدو لم يكن لها مسعف، رآها العدو صريعة وسخر لهلاكها."]]}, {"l": "Lam 5:21", "n": "", "vs": [[21, "ردنا يارب إليك فنرجع. جدد أيامنا كما في العهود السالفة."]]}, {"l": "Amo 9:11", "n": "", "vs": [[11, "في ذلك اليوم أقيم مسكن داود الذي تهاوى، وأسد ثغراته وأعمر خرائبه وأعيد بناءه كالعهد به في الأيام الغابرة."]]}, {"l": "Mal 3:4", "n": "", "vs": [[4, "عندئذ تكون تقدمة يهوذا وشعب أورشليم مرضية عند الرب، كالعهد بها في سالف الأيام وفي السنين الغابرة."]]}], "kwAr": "كالعهد", "noteAr": ""}], "arS": [["ارع", ["H7462"]], [" يارب ", []], ["شعبك", ["H5971"]], [" ", []], ["بعصاك", ["H7626"]], ["، فهم ", []], ["قطيع", ["H6629"]], [" ", []], ["ميراثك", ["H5159"]], [" ", []], ["الرابضون", ["H7931"]], [" ", []], ["وحدهم", ["H910"]], [" في ", []], ["الغابة", ["H3293"]], [" في ", []], ["وسط", ["H8432"]], [" ", []], ["الكرمل", ["H3760"]], [". ", []], ["قدهم", ["H7462"]], [" إلى ", []], ["باشان", ["H1316"]], [" ", []], ["وجلعاد", ["H1568"]], [" ليتمتعوا بخصب أرضهما كالعهد بهم في ", []], ["أيام", ["H3117"]], [" ", []], ["القدم", ["H5769"]], [".", []]]}, {"c": 7, "v": 15, "text": "ويجيب الرب: سأريهم معجزات كما فعلت في أيام خروجهم من ديار مصر.", "groups": [{"kw": "", "raw": "Psa_68:22, 78:12-72; Isa_11:16, Isa_51:9, Isa_63:11-15; Jer_23:7, Jer_23:8", "note": "", "refs": [{"l": "Psa 68:22", "n": "", "vs": [[22, "يقول السيد: «سأرجع أعداءكم من باشان، سأرجعهم من أعماق البحر،"]]}, {"l": "Psa 78:12-72", "n": "", "vs": [[12, "العجائب التي رآها آباؤهم في سهل صوعن في أرض مصر."], [13, "شق البحر وأجازهم، وجعل المياه تقف كجدار."], [14, "أرشدهم بالسحاب نهارا وبنور نار الليل كله."], [15, "شق صخورا في البرية وسقاهم ماء غزيرا كأنه من اللجج."], [16, "أخرج من الصخرة سواقي، أجرى مياهها كأنهار."], [17, "لكنهم أوغلوا في غيهم مستثيرين غضب العلي في الصحراء."], [18, "وجربوا الله في قلوبهم، طالبين طعاما اشتهته نفوسهم"], [19, "وتذمروا على الله قائلين: أيقدر الله أن يبسط لنا مائدة في البرية؟"], [20, "ها هو قد ضرب الصخرة فتفجرت منها المياه وفاضت الأنهار، فهل يقدر أيضا أن يقدم الخبز أو يوفر اللحم لشعبه؟"], [21, "فلما سمع الله ذلك ثار غضبه، واندلعت النار في يعقوب، واشتد السخط على إسرائيل،"], [22, "لأنهم لم يؤمنوا بالله ولم يتكلوا على خلاصه."], [23, "ومع ذلك أمر السحاب وفتح أبواب السماوات،"], [24, "فأمطر عليهم المن ليأكلوا، وأنزل عليهم حنطة السماوات."], [25, "فأكل الإنسان خبز الملائكة، إذ أرسل لهم زادا حتى شبعوا."], [26, "أثار ريحا شرقية في السماوات، وبقوته ساق ريحا جنوبية."], [27, "فأمطر عليهم لحما كثيرا كالتراب، وطيورا كرمل البحر،"], [28, "جعلها تتساقط في وسط خيامهم حول مساكنهم."], [29, "فأكلوا حتى شبعوا جدا، وأعطاهم مشتهاهم."], [30, "وقبل أن يفرغوا من الطعام الذي اشتهوه، وهو بعد في أفواههم،"], [31, "ثار عليهم غضب الله، فقتل أسمنهم وصرع نخبتهم."], [32, "ومع هذا ظلوا يخطئون، وبالرغم من عجائبه لم يؤمنوا،"], [33, "فأفنى أيامهم بالباطل وسنيهم في الرعب."], [34, "وعندما قتل بعضهم، رجعوا بحرارة تائبين يلتمسون الله ."], [35, "تذكروا أن الله صخرتهم والإله العلي فاديهم."], [36, "ولكنهم خادعوه بأفواههم، ونافقوه بألسنتهم."], [37, "لم يكونوا مخلصين له، ولا كانوا أوفياء لعهده."], [38, "لكنه كان رحيما، فعفا عن الإثم ولم يهلكهم. وكثيرا ما كبح غضبه عنهم ولم يضرم كل سخطه."], [39, "ذكر أنهم بشر كالريح التي تذهب ولا تعود."], [40, "كم تمردوا عليه في البرية وأحزنوه في الصحراء."], [41, "ثم عادوا يجربون الله ويغيظون قدوس إسرائيل."], [42, "لم يذكروا قوته يوم أنقذهم من طالبيهم،"], [43, "كيف أجرى آياته في مصر وعجائبه في سهول صوعن."], [44, "إذ حول أنهارهم وسواقيهم دما حتى لا يشربوا."], [45, "أرسل عليهم بعوضا فأكلهم، وضفادع فأهلكتهم."], [46, "أسلم غلتهم لليسارع ومحاصيلهم للجراد ليدمرها."], [47, "أتلف كرومهم بالبرد وجميزهم بالصقيع،"], [48, "ودفع بهائمهم إلى البرد، ومواشيهم إلى نار البروق."], [49, "أرسل عليهم حمم غضبه، وسخطه وغيظه، وأطلق عليهم حملة من ملائكة الهلاك."], [50, "أفلت عنان غضبه، ولم يحفظهم من الموت، بل أهلكهم بالوبإ،"], [51, "وأباد كل أبكار مصر، طلائع ثمار الرجولة في خيام حام."], [52, "ثم ساق شعبه كالغنم واقتادهم مثل القطيع في الصحراء."], [53, "هداهم آمنين فلم يفزعوا. أما أعداؤهم فطغى البحر عليهم وغمرهم."], [54, "وأدخلهم إلى تخوم أرضه المقدسة، إلى الجبل الذي امتلكته يمينه."], [55, "ثم طرد الأمم من أمامهم وقسم أرضهم بالحبل ليجعلها ميراثا لشعبه، وأسكن في خيامهم أسباط إسرائيل."], [56, "غير أنهم جربوا الله العلي وتمردوا عليه، ولم يراعوا شهاداته."], [57, "بل ارتدوا عنه وغدروا كما فعل آباؤهم، وانحرفوا كقوس مخطئة."], [58, "وأغاظوه بمعابد مرتفعاتهم وأثاروا غيرته بأصنامهم."], [59, "سمع الله فغضب، وعافت نفسه إسرائيل جدا."], [60, "هجر مسكنه في شيلوه، تلك الخيمة التي نصبها مسكنا له بين الناس."], [61, "وأسلم تابوت عهد عزته إلى السبي وجلاله إلى يد العدو."], [62, "ودفع شعبه إلى السيف وصب نقمته على ميراثه."], [63, "فالتهمت النار فتيانهم، ولم تنشد لعذاراهم أغنية زواج."], [64, "سقط كهنتهم صرعى السيف، وأراملهم لم يندبن عليهم."], [65, "ثم استيقظ الرب كما يستيقظ النائم، مثل جبار يصرخ عاليا من الخمر."], [66, "فضرب أعداءه وقهرهم، وجعلهم عارا مدى الدهر."], [67, "رفض السكنى في خيمة يوسف ولم يختر سبط أفرايم."], [68, "بل اصطفى سبط يهوذا، جبل صهيون الذي أحبه."], [69, "فشيد هيكله، (كمسكنه) في السماوات العلى. جعله (ثابتا) مثل الأرض التي أسسها إلى الأبد."], [70, "واصطفى داود عبده، وأخذه من بين حظائر الغنم."], [71, "من خلف النعاج المرضعة أتى به، ليرعى يعقوب شعبه وإسرائيل ميراثه."], [72, "فرعاهم بقلب مستقيم، وهداهم بيديه الماهرتين."]]}, {"l": "Isa 11:16", "n": "", "vs": [[16, "ويمد الرب طريقا من أشور ليعود منه من بقي هناك من بني إسرائيل، كما أعاد الرب جميع إسرائيل من مصر."]]}, {"l": "Isa 51:9", "n": "", "vs": [[9, "استيقظي، استيقظي، تسربلي بالقوة ياذراع الرب، استيقظي كالعهد بك في الأيام القديمة، وفي الأجيال الغابرة. ألست أنت التي مزقت رهب إربا إربا، وطعنت التنين؟"]]}, {"l": "Isa 63:11-15", "n": "", "vs": [[11, "ثم تذكروا الأيام القديمة، أيام موسى عبده وتساءلوا: أين من أصعدنا من البحر مع راعي قطيعه؟ أين من أقام روحه القدوس في وسطنا؟"], [12, "من جعل ذراع قوته المجيدة تسير إلى يمين موسى؟ من شق مياه البحر أمامنا ليكتسب اسما أبديا؟"], [13, "من اقتادنا في اللجج؟ فسرنا كفرس في البرية من غير أن نعثر؟"], [14, "كقطيع منحدر إلى واد، أنعم عليهم روح الرب بالراحة، هكذا هديت شعبك لتصنع لنفسك اسما مجيدا."], [15, "تطلع من السماء وانظر من مسكنك المقدس والمجيد. أين غيرتك واقتدارك؟ قد امتنع عني لهيب أشواقك وإحساناتك."]]}, {"l": "Jer 23:7", "n": "", "vs": [[7, "لذلك ها أيام مقبلة لا يردد فيها الناس من بعد: حي هو الرب الذي أخرج بني إسرائيل من ديار مصر."]]}, {"l": "Jer 23:8", "n": "", "vs": [[8, "بل يقولون: حي هو الرب الذي أخرج ذرية شعب إسرائيل، وأتى بهم من أرض الشمال ومن كافة الديار التي أجلاهم إليها، فيسكنون في أرضهم»."]]}], "kwAr": "", "noteAr": ""}], "arS": [["ويجيب الرب: ", []], ["سأريهم", ["H7200"]], [" ", []], ["معجزات", ["H6381"]], [" كما فعلت في ", []], ["أيام", ["H3117"]], [" ", []], ["خروجهم", ["H3318"]], [" من ", []], ["ديار", ["H4480", "H776"]], [" ", []], ["مصر", ["H4714"]], [".", []]]}, {"c": 7, "v": 16, "text": "فترى الأمم ويخزون من قوتهم ويضعون أيديهم على أفواههم وتصاب آذانهم بالصمم.", "groups": [{"kw": "nations", "raw": "Mic_5:8; Psa_126:2; Isa_26:11, Isa_66:18; Eze_38:23, Eze_39:17-21; Zec_8:20-23; Zec_12:9; Rev_11:18", "note": "", "refs": [{"l": "Mic 5:8", "n": "", "vs": [[8, "وتكون بقية ذرية يعقوب بين الشعوب الكثيرة كأسد بين وحوش الغابة، أو كشبل بين قطعان الغنم، الذي إن اقتحم يدوس ويفترس وليس من منقذ."]]}, {"l": "Psa 126:2", "n": "", "vs": [[2, "عندئذ امتلأت أفواهنا ضحكا، وألسنتنا ترنما. عندئذ قالت الأمم: إن الرب قد أجرى أمورا عظيمة مع هؤلاء."]]}, {"l": "Isa 26:11", "n": "", "vs": [[11, "يارب إن يدك مرتفعة وهم لا يرونها، فدعهم يشاهدون غيرتك على شعبك، ويخزون. لتلتهمهم النار التي ادخرتها لأعدائك."]]}, {"l": "Isa 66:18", "n": "", "vs": [[18, "ولأني عالم بأعمالهم وأفكارهم فأنا مزمع أن آتي لأجمع كل الأمم والألسنة، فيتوافدون ويرون مجدي"]]}, {"l": "Eze 38:23", "n": "", "vs": [[23, "فأعظم نفسي وأقدسها، وأعلن ذاتي على مرأى من كل الأمم، فيدركون أني أنا الرب»."]]}, {"l": "Eze 39:17-21", "n": "", "vs": [[17, "أما أنت ياابن آدم، فهذا ما يعلنه السيد الرب: قل لكل أصناف الطيور ولجميع وحوش البرية اجتمعي وتعالي، احتشدي من كل جهة حول ذبيحتي التي أعدها لك، ذبيحة عظيمة أقيمها على جبال إسرائيل فتأكلين لحما وتشربين دما."], [18, "تأكلين لحم الجبابرة وترتوين من دماء رؤساء الأرض وكأنها كباش وحملان وتيوس وعجول كلها من قطعان باشان السمينة."], [19, "فتأكلين شحما حتى الشبع، وتشربين دما حتى السكر من ذبيحتي التي أعددتها لك."], [20, "فتشبعين على مائدتي من الخيل وفرسانها، من الجبابرة وكل المحاربين، يقول السيد الرب."], [21, "وأجعل مجدي يتجلى بين الأمم فتشهد دينونتي التي أنزلتها بهم، وقدرة يدي التي مددتها عليهم."]]}, {"l": "Zec 8:20-23", "n": "", "vs": [[20, "وستأتي شعوب أيضا وأفواج من سكان مدن كثيرة إلى أورشليم."], [21, "ويمضي أهل المدينة الواحدة إلى المدينة الأخرى قائلين: هيا نذهب على الفور لنطلب رضى وجه الرب القدير ونلتمس بركته، لأننا على أي حال منطلقون إلى هناك."], [22, "فتتوافد أمم كثيرة وشعوب قوية ليلتمسوا وجه الرب القدير في أورشليم وليحظوا برضاه."], [23, "في تلك الأيام يتشبث عشرة رجال من أبناء الأمم بثوب رجل يهودي قائلين: دعنا نذهب معكم، لأننا سمعنا أن الرب معكم»."]]}, {"l": "Zec 12:9", "n": "", "vs": [[9, "في ذلك اليوم أعمل على إهلاك جميع الشعوب الزاحفين على أورشليم."]]}, {"l": "Rev 11:18", "n": "", "vs": [[18, "غضبت الشعوب عليك، فجاء دور غضبك عليهم. جاءت الساعة ليدان الأموات، وتكافيء عبيدك الأنبياء والقديسين والمتقين اسمك، صغارا وكبارا، وتهلك الذين كانوا يدمرون الأرض!»"]]}], "kwAr": "الأمم", "noteAr": ""}, {"kw": "lay", "raw": "Job_21:5, Job_29:9, Job_29:10, Job_40:4; Isa_52:15; Rom_3:19", "note": "", "refs": [{"l": "Job 21:5", "n": "", "vs": [[5, "تفرسوا في واندهشوا، وضعوا أيديكم على أفواهكم."]]}, {"l": "Job 29:9", "n": "", "vs": [[9, "يمتنع العظماء عن الكلام ويضعون أيديهم على أفواههم."]]}, {"l": "Job 29:10", "n": "", "vs": [[10, "يتلاشى صوت النبلاء، وتلتصق ألسنتهم بأحناكهم."]]}, {"l": "Job 40:4", "n": "", "vs": [[4, "«انظر، أنا حقير فبماذا أجيبك؟ ها أنا أضع يدي على فمي"]]}, {"l": "Isa 52:15", "n": "", "vs": [[15, "فإنه هكذا يذهل أمما عديدة فيكم ملوك أفواههم أمامه، إذ شهدوا ما لم يخبروا به، وأدركوا مالم يسمعوه."]]}, {"l": "Rom 3:19", "n": "", "vs": [[19, "ونحن نعلم أن كل ما تقوله الشريعة إنما تخاطب به الذين هم تحت الشريعة، لكي يسد كل فم ويقع العالم كله تحت دينونة من الله."]]}], "kwAr": "ويضعون", "noteAr": ""}], "arS": [["فترى", ["H7200"]], [" ", []], ["الأمم", ["H1471"]], [" ", []], ["ويخزون", ["H954"]], [" من ", []], ["قوتهم", ["H4480", "H3605", "H1369"]], [" ", []], ["ويضعون", ["H7760"]], [" ", []], ["أيديهم", ["H3027"]], [" ", []], ["على", ["H5921"]], [" ", []], ["أفواههم", ["H6310"]], [" وتصاب ", []], ["آذانهم", ["H241"]], [" ", []], ["بالصمم", ["H2790"]], [".", []]]}, {"c": 7, "v": 17, "text": "ويلحسون التراب كالحية وينسلون من حصونهم مرتعبين كزواحف الأرض، ويرجعون بخوف إلى الرب إلهنا مرتعبين منك.", "groups": [{"kw": "lick", "raw": "Gen_3:14, Gen_3:15; Psa_72:9; Isa_49:23, Isa_60:14, Isa_65:25; Lam_3:29; Rev_3:9", "note": "", "refs": [{"l": "Gen 3:14", "n": "", "vs": [[14, "فقال الرب الإله للحية: «لأنك فعلت هذا، ملعونة أنت من بين جميع البهائم ومن جميع وحوش البرية، على بطنك تسعين، ومن التراب تأكلين طوال حياتك،"]]}, {"l": "Gen 3:15", "n": "", "vs": [[15, "وأثير عداوة دائمة بينك وبين المرأة، وكذلك بين نسليكما. هو يسحق رأسك وأنت تلدغين عقبه»."]]}, {"l": "Psa 72:9", "n": "", "vs": [[9, "أمامه يركع أهل البادية، وأعداؤه يلحسون التراب."]]}, {"l": "Isa 49:23", "n": "", "vs": [[23, "يكون لك الملوك آباء مربين، وملكاتهم مرضعات، ينحنون أمامك بوجوه مطرقة إلى الأرض، ويلحسون تراب قدميك. عندئذ تدركين أنني أنا الرب، وكل من يتكل علي لا يخزى»."]]}, {"l": "Isa 60:14", "n": "", "vs": [[14, "ويقبل إليك أبناء مضايقيك خاضعين، وكل الذين احتقروك ينحنون عند قدميك، ويدعونك مدينة الرب، صهيون قدوس إسرائيل."]]}, {"l": "Isa 65:25", "n": "", "vs": [[25, "ويرعى الذئب والحمل معا، ويأكل الأسد التبن كالبقر، وتأكل الحية التراب. لا يؤذون ولا يهلكون في كل جبل قدسي، يقول الرب."]]}, {"l": "Lam 3:29", "n": "", "vs": [[29, "ليوار وجهه في التراب تذللا، عسى أن يكون هناك رجاء."]]}, {"l": "Rev 3:9", "n": "", "vs": [[9, "أما الذين هم من مجمع الشيطان، ويدعون كذبا أنهم يهود، فسأجبرهم على أن يسجدوا عند قدميك، ويعترفوا بأني أحببتك."]]}], "kwAr": "ويلحسون", "noteAr": ""}, {"kw": "move", "raw": "1Sa_14:11; Psa_18:45; Jer_16:16", "note": "", "refs": [{"l": "1Sa 14:11", "n": "", "vs": [[11, "فأظهرا نفسيهما لحامية الفلسطينيين. فقال الفلسطينيون: «ها العبرانيون يبرزون من الجحور التي اختبأوا فيها»."]]}, {"l": "Psa 18:45", "n": "", "vs": [[45, "الغرباء يخورون، يخرجون من حصونهم مرتعدين."]]}, {"l": "Jer 16:16", "n": "", "vs": [[16, "ها أنا أرسل صيادين كثيرين، ليصطادوهم، ثم أبعث بقناصين كثيرين ليقتنصوهم من كل جبل ومن كل رابية ومن شقوق الصخور."]]}], "kwAr": "وينسلون", "noteAr": ""}, {"kw": "worms", "raw": "or, creeping things", "note": "or, creeping things", "refs": [], "kwAr": "كزواحف", "noteAr": "أو: «زواحف»."}, {"kw": "they shall be", "raw": "Exo_15:14-16; Jos_2:9-11, Jos_9:24; Psa_9:20; Isa_2:19-21, Isa_64:2; Jer_33:9; Zec_14:5; Rev_6:15-17, Rev_18:9, Rev_18:10", "note": "", "refs": [{"l": "Exo 15:14-16", "n": "", "vs": [[14, "فتسمع الشعوب وترتعب، وتستولي الرعدة على أهل فلسطين."], [15, "آنئذ يندهش أمراء أدوم، جبابرة موآب تأخذهم الرجفة، ويذوب حكام كنعان هلعا."], [16, "يسودهم الخوف والرعدة وبقدرة ذراعك يجمدون كالحجارة حتى يعبر شعبك يارب، حتى يعبر شعبك الذي اشتريته."]]}, {"l": "Jos 2:9-11", "n": "", "vs": [[9, "وقالت لهما: «لقد علمت أن الرب قد وهبكم الأرض، وأن الخشية منكم قد اعترتنا، فذابت قلوب جميع سكان الأرض خوفا منكم،"], [10, "لأننا سمعنا كيف شق الرب لكم طريقا عبر مياه البحر الأحمر لدى مغادرتكم ديار مصر، وما صنعتموه بملكي الأموريين سيحون وعوج اللذين في شرقي الأردن، وكيف قضيتم عليهما."], [11, "لقد بلغتنا هذه الأخبار فذابت قلوبنا من الخوف ولم تبق بعد روح في إنسان رعبا منكم، لأن الرب إلهكم هو رب السماء والأرض."]]}, {"l": "Jos 9:24", "n": "", "vs": [[24, "فأجابوا يشوع قائلين: «لقد بلغ عبيدك أخبار ما وعد به الرب إلهك موسى عبده، أن يهبكم كل الأرض ويهلك جميع سكانها من أمامكم، فخشينا جدا على أنفسنا منكم، فتوسلنا بالحيلة."]]}, {"l": "Psa 9:20", "n": "", "vs": [[20, "ألق في قلوبهم الرعب فتعلم الأمم أنهم ليسوا سوى بشر."]]}, {"l": "Isa 2:19-21", "n": "", "vs": [[19, "ويلجأ الناس إلى مغاور الجبال، وإلى حفائر الأرض، متوارين من هيبة الرب ومن مجد جلاله، عندما يهب ليزلزل الأرض."], [20, "في ذلك اليوم يطرح الناس للجرذان والخفافيش أوثانهم الفضية وأصنامهم الذهبية التي صنعوها ليعبدوها،"], [21, "ويدخلون في كهوف الصخر، وفي شقوق الجروف الجبلية هربا من هيبة الرب ومن مجد جلاله عندما يهب ليزلزل الأرض."]]}, {"l": "Isa 64:2", "n": "", "vs": [[2, "فتكون كالنار التي تضرم الهشيم، وتجعل المياه تغلي لكي تعرف أعداءك اسمك، فترتعب الأمم من حضرتك."]]}, {"l": "Jer 33:9", "n": "", "vs": [[9, "وتصبح هذه المدينة مبعث سرور لي، وتسبحة وافتخارا لدى جميع أمم الأرض التي يبلغها كل ما أسديته من خير إليها، فتخاف وترتعد بفضل ما أغدقته عليها من إحسان وازدهار."]]}, {"l": "Zec 14:5", "n": "", "vs": [[5, "ويهربون من خلال وادي جبالي الممتد إلى آصل. تهربون كما هربتم من الزلزلة في أيام حكم عزيا ملك يهوذا، ويأتي الرب إلهي في موكب من جميع قديسيه."]]}, {"l": "Rev 6:15-17", "n": "", "vs": [[15, "وملوك الأرض والعظماء والقواد والأغنيا ء والأقوياء والعبيد والأحرار كلهم اختبأوا في المغاور وصخور الجبال،"], [16, "وهم يقولون للجبال والصخور: اسقطي علينا، وأخفينا من وجه الجالس على العرش ومن غضب الحمل!»"], [17, "فإن يوم الغضب العظيم قد جاءهم، ومن يقوى على الوقوف أمامه؟"]]}, {"l": "Rev 18:9", "n": "", "vs": [[9, "وسيبكي عليها ملوك الأرض الذين زنوا وترفهوا معها، وسينوحون وهم ينظرون إلى دخان حريقها،"]]}, {"l": "Rev 18:10", "n": "", "vs": [[10, "فيقفون على بعد منها، خوفا من عذابها، وهم يصرخون: الويل، الويل، أيتها المدينة العظمى، بابل القوية! في ساعة واحدة حل بك العقاب!"]]}], "kwAr": "مرتعبين", "noteAr": ""}], "arS": [["ويلحسون", ["H3897"]], [" ", []], ["التراب", ["H6083"]], [" ", []], ["كالحية", ["H5175"]], [" ", []], ["وينسلون", ["H7264"]], [" من ", []], ["حصونهم", ["H4480", "H4526"]], [" ", []], ["مرتعبين", ["H6342"]], [" ", []], ["كزواحف", ["H2119"]], [" ", []], ["الأرض", ["H776"]], ["، ويرجعون بخوف ", []], ["إلى", ["H413"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["إلهنا", ["H430"]], [" ", []], ["مرتعبين", ["H3372"]], [" ", []], ["منك", ["H4480"]], [".", []]]}, {"c": 7, "v": 18, "text": "إي إله مثلك يصفح عن الإثم ويعفو عن معصية بقية ميراثه؟ لا يحتفظ إلى الأبد بغضبه لأنه يسر بالرحمة.", "groups": [{"kw": "a God", "raw": "Exo_15:11; Deu_33:26; 1Ki_8:23; Psa_35:10, Psa_71:19, Psa_89:6, Psa_89:8, Psa_113:5, Psa_113:6; Isa_40:18, Isa_40:25, Isa_46:8, Isa_46:9", "note": "", "refs": [{"l": "Exo 15:11", "n": "", "vs": [[11, "فمن مثلك يارب بين كل الآلهة؟ من مثلك جليلا في القداسة مهيبا في المجد، صانعا عجائب!"]]}, {"l": "Deu 33:26", "n": "", "vs": [[26, "ليس نظير الرب يابني إسرائيل يمتطي السماء لمعونتكم والغمام في عظمته،"]]}, {"l": "1Ki 8:23", "n": "", "vs": [[23, "وقال: «أيها الرب إله إسرائيل، ليس نظير لك في السماء من فوق ولا على الأرض من أسفل. أنت يامن تحافظ على عهد الرحمة مع عبيدك السائرين أمامك من كل قلوبهم."]]}, {"l": "Psa 35:10", "n": "", "vs": [[10, "جميع عظامي تقول: يارب من مثلك، المخلص المسكين ممن هو أقوى منه ومنقذ الفقير والبائس من يد ناهبه؟"]]}, {"l": "Psa 71:19", "n": "", "vs": [[19, "برك متعال ياالله ، وأعمالك التي صنعت عظيمة، فمن مثلك ياالله !"]]}, {"l": "Psa 89:6", "n": "", "vs": [[6, "فمن في السماء يعادل الرب؟ ليس بين الكائنات السماوية من يماثله."]]}, {"l": "Psa 89:8", "n": "", "vs": [[8, "من مثلك أيها الرب إله الجنود، الرب القدير، وأمانتك محيطة بك؟"]]}, {"l": "Psa 113:5", "n": "", "vs": [[5, "من هو نظير الرب إلهنا الساكن في الأعالي؟"]]}, {"l": "Psa 113:6", "n": "", "vs": [[6, "المطل من عليائه إلى أسفل ليرى السماوات والأرض."]]}, {"l": "Isa 40:18", "n": "", "vs": [[18, "بمن تشبهون الله وبمن تقارنونه؟"]]}, {"l": "Isa 40:25", "n": "", "vs": [[25, "فبمن إذا تقارنونني فأكون نظيره؟ يقول القدوس."]]}, {"l": "Isa 46:8", "n": "", "vs": [[8, "اذكروا هذا واتعظوا. انقشوه في أذهانكم ياعصاة!"]]}, {"l": "Isa 46:9", "n": "", "vs": [[9, "تذكروا الأمور الغابرة القديمة لأني أنا الله وليس آخر."]]}], "kwAr": "إله", "noteAr": ""}, {"kw": "that", "raw": "Exo_33:18, Exo_33:19, Exo_34:6, Exo_34:7; Num_14:18, Num_14:19; Neh_9:17; Psa_65:3, Psa_86:5, Psa_86:15; Psa_103:2, Psa_103:3, Psa_130:4, Psa_130:7, Psa_130:8; Isa_1:18, Isa_43:25, Isa_44:22, Isa_55:7; Jer_31:34, Jer_38:8, Jer_50:20; Dan_9:9; Jon_4:2; Luk_24:47; Act_13:38, Act_13:39", "note": "", "refs": [{"l": "Exo 33:18", "n": "", "vs": [[18, "وقال موسى: «أرني مجدك»."]]}, {"l": "Exo 33:19", "n": "", "vs": [[19, "فقال الرب: «أجيز إحساناتي أمامك، وأذيع اسمي (الرب) أمامك. أغدق رأفتي على من أشاء ورحمتي على من أريد»،"]]}, {"l": "Exo 34:6", "n": "", "vs": [[6, "وعبر من أمام موسى مناديا: «أنا الرب. الرب إله رؤوف رحيم، بطيء الغضب وكثير الإحسان والوفاء."]]}, {"l": "Exo 34:7", "n": "", "vs": [[7, "أدخر الإحسان وأغفر الإثم والمعصية والخطيئة. ولكني لا أعفي المذنب من العقاب، بل أفتقد إثم الآباء في الأبناء والأحفاد حتى الجيل الرابع»."]]}, {"l": "Num 14:18", "n": "", "vs": [[18, "الرب طويل الأناة، وافر الرحمة، يغفر الذنب والسيئة. لكنه لا يبريء، بل يفتقد ذنب الآباء في الأبناء إلى الجيل الثالث والرابع."]]}, {"l": "Num 14:19", "n": "", "vs": [[19, "فاصفح عن ذنب هذا الشعب بحسب نعمتك، واغفر له كما غفرت ذنوبه من مصر إلى ههنا»."]]}, {"l": "Neh 9:17", "n": "", "vs": [[17, "وأبوا أن يسمعوا، وتجاهلوا عجائبك التي أجريتها لهم، وأغلظوا قلوبهم، ثم تمردوا ونصبوا عليهم قائدا ليرجعوا إلى عبوديتهم، ولكنك إله غفور وحنان ورحيم وحكيم وكثير الإحسان، فلم تتخل عنهم،"]]}, {"l": "Psa 65:3", "n": "", "vs": [[3, "قد غلبت الآثام علي. أنت وحدك تكفر عنها."]]}, {"l": "Psa 86:5", "n": "", "vs": [[5, "لأنك أنت يارب طيب وغفور، وكثير الرحمة لجميع الذين يدعونك."]]}, {"l": "Psa 86:15", "n": "", "vs": [[15, "إنما أنت يارب إله رحيم ورؤوف وبطيء الغضب ووافر الرحمة والحق."]]}, {"l": "Psa 103:2", "n": "", "vs": [[2, "باركي يانفسي الرب، ولا تنسي جميع خيراته."]]}, {"l": "Psa 103:3", "n": "", "vs": [[3, "إنه يغفر جميع آثامك ويبريء كل أمراضك."]]}, {"l": "Psa 130:4", "n": "", "vs": [[4, "ولأنك مصدر الغفران فإن جميع الناس يهابونك."]]}, {"l": "Psa 130:7", "n": "", "vs": [[7, "ليترج إسرائيل الرب، لأن منه الرحمة والفداء الكثير."]]}, {"l": "Psa 130:8", "n": "", "vs": [[8, "وهو يفدي إسرائيل من جميع آثامه."]]}, {"l": "Isa 1:18", "n": "", "vs": [[18, "تعالوا نتحاجج يقول الرب، إن كانت خطاياكم كلطخات قرمزية فإنها تبيض كالثلج، وإن كانت حمراء كصبغ الدودي تصبح في نقاء الصوف!"]]}, {"l": "Isa 43:25", "n": "", "vs": [[25, "أنا، أنا هو الماحي ذنوبك من أجل ذاتي، وخطاياك لن أذكرها."]]}, {"l": "Isa 44:22", "n": "", "vs": [[22, "قد محوت كغيمة عابرة ذنوبك، وكسحابة خطاياك. ارجع تائبا إلي لأني قد فديتك."]]}, {"l": "Isa 55:7", "n": "", "vs": [[7, "ليترك الشرير طريقه والأثيم أفكاره، وليتب إلى الرب فيرحمه، وليرجع إلى إلهنا لأنه يكثر الغفران."]]}, {"l": "Jer 31:34", "n": "", "vs": [[34, "ولا يحض في ما بعد كل واحد قريبه قائلا: اعرف الرب إلهك لأنهم جميعا سيعرفونني، من صغيرهم إلى كبيرهم، لأني سأصفح عن إثمهم ولن أذكر خطاياهم من بعد»."]]}, {"l": "Jer 38:8", "n": "", "vs": [[8, "غادر عبد ملك القصر، وقال للملك:"]]}, {"l": "Jer 50:20", "n": "", "vs": [[20, "وفي ذلك الزمان والأوان، يقول الرب، يلتمس إثم إسرائيل فلا يوجد، وخطيئة يهوذا فلا تكون، لأني أعفو عمن أبقيته منهما."]]}, {"l": "Dan 9:9", "n": "", "vs": [[9, "إنما للرب إلهنا الرحمة والمغفرة لأننا عصيناك."]]}, {"l": "Jon 4:2", "n": "", "vs": [[2, "وصلى إلى الرب قائلا: «أيها الرب، أليس هذا ما قلته عندما كنت في بلادي؟ لهذا أسرعت إلى الهرب إلى ترشيش، لأني عرفت أنك إله رحيم رؤوف بطيء الغضب كثير الإحسان، ترجع عن العقاب."]]}, {"l": "Luk 24:47", "n": "", "vs": [[47, "وأن يبشر باسمه بالتوبة وغفران الخطايا في جميع الأمم انطلاقا من أورشليم."]]}, {"l": "Act 13:38", "n": "", "vs": [[38, "فاعلموا، أيها الإخوة، أنه بيسوع تبشرون بغفران الخطايا ،"]]}, {"l": "Act 13:39", "n": "", "vs": [[39, "وأنه به يتبرر كل من يؤمن من كل ما عجزت شريعة موسى أن تبرره منه."]]}], "kwAr": "يصفح", "noteAr": ""}, {"kw": "passeth", "raw": "Num_23:21; Amo_7:8, Amo_8:2", "note": "", "refs": [{"l": "Num 23:21", "n": "", "vs": [[21, "لم يشهد إثما في يعقوب، ولم ير مشقة في إسرائيل. الرب إلههم معهم، وهتاف للملك فيهم."]]}, {"l": "Amo 7:8", "n": "", "vs": [[8, "فقال لي الرب: «ياعاموس، ماذا ترى؟» فأجبت: «ميزان البناء». فقال الرب: «ها أنا أمد ميزان البناء في وسط شعبي إسرائيل، ولن أعفو عنهم."]]}, {"l": "Amo 8:2", "n": "", "vs": [[2, "وسألني: «ماذا ترى ياعاموس؟» فأجبت: «سلة مليئة بثمار الصيف الناضجة». فقال لي الرب: «لقد دنت نهاية شعبي إسرائيل ولن أعفو عنهم بعد."]]}], "kwAr": "ويعفو", "noteAr": ""}, {"kw": "the remnant", "raw": "Mic_7:14, Mic_2:12, Mic_4:7, Mic_5:3, Mic_5:7, Mic_5:8; Joe_2:32; Rom_11:4; Heb_8:9-12", "note": "", "refs": [{"l": "Mic 7:14", "n": "", "vs": [[14, "ارع يارب شعبك بعصاك، فهم قطيع ميراثك الرابضون وحدهم في الغابة في وسط الكرمل. قدهم إلى باشان وجلعاد ليتمتعوا بخصب أرضهما كالعهد بهم في أيام القدم."]]}, {"l": "Mic 2:12", "n": "", "vs": [[12, "سأجمع شتاتك جميعا يايعقوب، وأجمع بقية إسرائيل وأضمهم معا كقطيع غنم في حظيرة، مثل قطيع محتشد في مرعى، فترتفع جلبة جمهورهم."]]}, {"l": "Mic 4:7", "n": "", "vs": [[7, "فأجعل من العرج بقية، ومن المنبوذين أمة قوية، فيملك الرب عليهم في جبل صهيون من الآن وإلى الأبد."]]}, {"l": "Mic 5:3", "n": "", "vs": [[3, "لذلك يسلم الرب شعبه إلى أعدائهم إلى أن تلد من تقاسي من المخاض، عندئذ ترجع بقية إخوته من السبي إلى شعب إسرائيل."]]}, {"l": "Mic 5:7", "n": "", "vs": [[7, "عندئذ تغدو بقية ذرية يعقوب بين الأمم الكثيرة كندى من لدن الرب، كالمطر الوابل على العشب الذي لا يتوانى من أجل الناس أو يرجو أبناء البشر."]]}, {"l": "Mic 5:8", "n": "", "vs": [[8, "وتكون بقية ذرية يعقوب بين الشعوب الكثيرة كأسد بين وحوش الغابة، أو كشبل بين قطعان الغنم، الذي إن اقتحم يدوس ويفترس وليس من منقذ."]]}, {"l": "Joe 2:32", "n": "", "vs": [[32, "إنما كل من يدعو باسم الرب يخلص، لأن النجاة تكون في جبل صهيون وفي أورشليم، كما قال الرب، إذ يكون بين الناجين من يدعوه الرب."]]}, {"l": "Rom 11:4", "n": "", "vs": [[4, "ولكن، ماذا كان الجواب الإلهي له؟: «أبقيت لنفسي سبعة آلاف رجل لم يحنوا ركبة للبعل!»"]]}, {"l": "Heb 8:9-12", "n": "", "vs": [[9, "هذا العهد الجديد ليس كالعهد الذي أبرمته مع آبائهم، حين أمسكت بأيديهم وأخرجتهم من أرض مصر. فبما أنهم خرقوا ذلك العهد، يقول الرب، أصبح من حقي أن ألغيه!"], [10, "فهذا هو العهد الذي أبرمه مع بني إسرائيل، بعد تلك الأيام، يقول الرب: أضع شرائعي داخل ضمائرهم، وأكتبها على قلوبهم، وأكون لهم إلها، وهم يكونون لي شعبا."], [11, "بعد ذلك، لا يعلم أحد منهم ابن وطنه ولا أخاه قائلا: تعرف بالرب! ذلك لأن الجميع سوف يعرفونني حق المعرفة، من الصغير فيهم إلى العظيم."], [12, "لأني سأصفح عن آثامهم، ولا أعود أبدا إلى تذكر خطاياهم ومخالفاتهم!»"]]}], "kwAr": "بقية", "noteAr": ""}, {"kw": "he retaineth", "raw": "Psa_77:6-10, Psa_85:4, Psa_85:5, Psa_103:9; Isa_57:10,Isa_57:16; Jer_3:5, Jer_3:12; Lam_3:31, Lam_3:32", "note": "", "refs": [{"l": "Psa 77:6-10", "n": "", "vs": [[6, "في الليل أتذكر ترنيمي، وأناجي قلبي، وتجد في البحث نفسي."], [7, "هل إلى الأبد يرفضنا الرب ولا يرضى عنا أبدا؟"], [8, "هل انتهت رحمته إلى الأبد؟ هل انقطعت عنا مواعيده؟"], [9, "ألعل الله نسي رأفته؟ أم حبس بغضب مراحمه؟"], [10, "ثم قلت: «هذا يسقمني: أن يمين الله العلي قد تحولت (عنا)»"]]}, {"l": "Psa 85:4", "n": "", "vs": [[4, "ردنا إليك ياالله مخلصنا، واصرف غيظك عنا."]]}, {"l": "Psa 85:5", "n": "", "vs": [[5, "أتسخط علينا إلى الأبد؟ أتطيل غضبك من جيل إلى جيل؟"]]}, {"l": "Psa 103:9", "n": "", "vs": [[9, "لا يسخط إلى الأبد ولا يحقد إلى الدهر."]]}, {"l": "Isa 57:10", "n": "", "vs": [[10, "أصابكم الإعياء من طول المسير، ولم تقولوا: «يئسنا» بل تجددت قواكم ولم تخوروا."]]}, {"l": "Isa 57:16", "n": "", "vs": [[16, "لأنني لا أخاصم إلى الأبد، ولا أظل على الدوام غاضبا، لئلا تبيد أمامي روح الإنسان التي خلقتها."]]}, {"l": "Jer 3:5", "n": "", "vs": [[5, "أيظل غاضبا دائما؟ أيبقى ساخطا إلى الأبد؟ انظري، هذا ما نطقت به، ولكنك ارتكبت كل ما استطعت من شر»."]]}, {"l": "Jer 3:12", "n": "", "vs": [[12, "فاذهب وأعلن هذه الكلمات نحو الشمال وقل: ارجعي أيتها الخائنة إسرائيل، فأكف غضبي عنكم لأني رحيم، ولن أسخط عليكم إلى الأبد."]]}, {"l": "Lam 3:31", "n": "", "vs": [[31, "لأن الرب لا ينبذ إلى الأبد."]]}, {"l": "Lam 3:32", "n": "", "vs": [[32, "فإنه ولو أحزن يرأف بمقتضى رحمته الفائقة."]]}], "kwAr": "لا يحتفظ", "noteAr": ""}, {"kw": "he delighteth", "raw": "Isa_62:5, Isa_65:19; Jer_32:41; Eze_33:11; Zep_3:17; Luk_15:5-7, Luk_15:9, Luk_15:10,Luk_15:23, Luk_15:24, Luk_15:32; Eph_2:4, Eph_2:5; Jam_2:13", "note": "", "refs": [{"l": "Isa 62:5", "n": "", "vs": [[5, "فكما يتزوج الشاب عذراء هكذا يتزوجك أبناؤك، وكما يفرح العريس بعروسه هكذا يبتهج الرب بك."]]}, {"l": "Isa 65:19", "n": "", "vs": [[19, "وأبتهج بأورشليم وأغتبط بشعبي، ولا يعود يسمع فيها صوت بكاء أو نحيب،"]]}, {"l": "Jer 32:41", "n": "", "vs": [[41, "وأسر بالإحسان إليهم، وأغرسهم في هذه الأرض بالحق من كل قلبي ونفسي."]]}, {"l": "Eze 33:11", "n": "", "vs": [[11, "قل لهم: حي أنا يقول السيد الرب، إني لا أبتهج بموت الشرير بل بأن يرتدع عن غيه ويحيا. ارجعوا، ارجعوا عن طرقكم الرديئة! لماذا تموتون ياشعب إسرائيل؟"]]}, {"l": "Zep 3:17", "n": "", "vs": [[17, "فالرب إلهك في وسطك، جبار يخلص. يسر فرحا بك، ويجدد بمحبته حياتك، ويبتهج بك مترنما."]]}, {"l": "Luk 15:5-7", "n": "", "vs": [[5, "وبعد أن يجده، يحمله على كتفيه فرحا،"], [6, "ثم يعود إلى البيت، ويدعو الأصدقاء والجيران، قائلا لهم: افرحوا معي، لأني وجدت خروفي الضائع !"], [7, "أقول لكم إنه هكذا يكون في السماء فرح بخاطيء واحد تائب أكثر من تسعة وتسعين بارا لا يحتاجون إلى توبة!"]]}, {"l": "Luk 15:9", "n": "", "vs": [[9, "وبعد أن تجده، تدعو الصديقات والجارات قائلة: افرحن معي، لأني وجدت الدرهم الذي أضعته."]]}, {"l": "Luk 15:10", "n": "", "vs": [[10, "أقول لكم: هكذا يكون بين ملائكة الله فرح بخاطيء واحد يتوب»."]]}, {"l": "Luk 15:23", "n": "", "vs": [[23, "وأحضروا العجل المسمن واذبحوه؛ ولنأكل ونفرح:"]]}, {"l": "Luk 15:24", "n": "", "vs": [[24, "فإن ابني هذا كان ميتا فعاش، وكان ضائعا فوجد. فأخذوا يفرحون!"]]}, {"l": "Luk 15:32", "n": "", "vs": [[32, "ولكن كان من الصواب أن نفرح ونبتهج، لأن أخاك هذا كان ميتا فعاش، وكان ضالا فوجد!»"]]}, {"l": "Eph 2:4", "n": "", "vs": [[4, "أما الله ، وهو غني في الرحمة، فبسبب محبته العظيمة التي أحبنا بها،"]]}, {"l": "Eph 2:5", "n": "", "vs": [[5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"]]}, {"l": "Jam 2:13", "n": "", "vs": [[13, "فلابد أن يكون الحكم على الذين لا يمارسون الرحمة، حكما خاليا من الرحمة، أما الرحمة فهي تتفوق على الحكم!"]]}], "kwAr": "يسر", "noteAr": ""}], "arS": [["إي", ["H4310"]], [" ", []], ["إله", ["H410"]], [" ", []], ["مثلك", ["H3644"]], [" ", []], ["يصفح", ["H5375"]], [" عن ", []], ["الإثم", ["H5771"]], [" ", []], ["ويعفو", ["H5674", "H5921"]], [" عن ", []], ["معصية", ["H6588"]], [" ", []], ["بقية", ["H7611"]], [" ", []], ["ميراثه", ["H5159"]], ["؟ ", []], ["لا", ["H3808"]], [" ", []], ["يحتفظ", ["H2388"]], [" إلى ", []], ["الأبد", ["H5703"]], [" ", []], ["بغضبه", ["H639"]], [" ", []], ["لأنه", ["H3588", "H1931"]], [" ", []], ["يسر", ["H2654"]], [" ", []], ["بالرحمة", ["H2617"]], [".", []]]}, {"c": 7, "v": 19, "text": "يعود يرحمنا ويطأ ذنوبنا بقدميه، ويطرح معاصينا إلى أعماق البحر.", "groups": [{"kw": "turn", "raw": "Deu_30:3, Deu_32:36; Ezr_9:8, Ezr_9:9; Psa_90:13, Psa_90:14; Isa_63:15-17; Jer_31:20; Lam_3:32; Hos_14:4", "note": "", "refs": [{"l": "Deu 30:3", "n": "", "vs": [[3, "فإن الرب إلهكم يرد سبيكم ويرحمكم، ويلم شتاتكم من بين جميع الشعوب الذين نفاكم الرب إلهكم إليهم."]]}, {"l": "Deu 32:36", "n": "", "vs": [[36, "لأن الرب يدين شعبه ويرأف بعبيده. عندما يرى أن قوتهم قد اضمحلت ولم يبق عبد ولا حر،"]]}, {"l": "Ezr 9:8", "n": "", "vs": [[8, "ولكنك الآن أنعمت علينا بلحظة (سلام) وتعطفت علينا فأنجيت لنا بقية لتعطينا موطيء قدم في مكانك المقدس حتى تنير أعيننا وتمنحنا بعض الحياة في عبوديتنا."]]}, {"l": "Ezr 9:9", "n": "", "vs": [[9, "ومع أننا عبيد لم تتخل عنا في عبوديتنا، بل ظللتنا بالرحمة أمام ملوك فارس ومنحتنا حياة لنبني هيكلا ونرمم خرائبه ونتمتع بالحماية في يهوذا وفي أورشليم."]]}, {"l": "Psa 90:13", "n": "", "vs": [[13, "إلى متى يطول يارب غضبك؟ ارجع وتعطف على عبيدك."]]}, {"l": "Psa 90:14", "n": "", "vs": [[14, "أفض علينا باكرا من رحمتك، فنترنم فرحا ونبتهج طوال أعمارنا."]]}, {"l": "Isa 63:15-17", "n": "", "vs": [[15, "تطلع من السماء وانظر من مسكنك المقدس والمجيد. أين غيرتك واقتدارك؟ قد امتنع عني لهيب أشواقك وإحساناتك."], [16, "فأنت هو أبونا، مع أن إبراهيم لا يعرفنا، وإسرائيل لا يعترف بنا، فأنت أيها الرب، هو أبونا، واسمك فادينا منذ القديم."], [17, "لماذا يارب تركتنا نضل عن طرقك وقسيت قلوبنا حتى لم نعد نتقيك؟ ارجع إلينا من أجل عبيدك، أسباط ميراثك."]]}, {"l": "Jer 31:20", "n": "", "vs": [[20, "هل أفرايم ابن أثير لدي؟ أليس هو ابنا مسرا؟ لأني مع كثرة تنديدي به فإني مازلت أذكره، لذلك يشتاق قلبي إليه، وأكن له الرحمة»، يقول الرب."]]}, {"l": "Lam 3:32", "n": "", "vs": [[32, "فإنه ولو أحزن يرأف بمقتضى رحمته الفائقة."]]}, {"l": "Hos 14:4", "n": "", "vs": [[4, "أنا أبريء ارتدادهم وأحبهم فضلا، لأن غضبي قد تحول عنهم."]]}], "kwAr": "يعود", "noteAr": ""}, {"kw": "subdue", "raw": "Deu_30:6; Psa_130:8; Eze_11:19, Eze_11:20, Eze_36:25-27; Rom_6:14, Rom_6:17-22, Rom_7:23-25; Rom_8:2, Rom_8:3, Rom_8:13; Tit_2:14; Jam_4:5, Jam_4:6; 1Jo_3:8", "note": "", "refs": [{"l": "Deu 30:6", "n": "", "vs": [[6, "ويطهر الرب إلهكم قلوبكم وقلوب نسلكم لتحبوا الرب إلهكم من كل قلوبكم ومن كل نفوسكم لتحيوا مطمئنين"]]}, {"l": "Psa 130:8", "n": "", "vs": [[8, "وهو يفدي إسرائيل من جميع آثامه."]]}, {"l": "Eze 11:19", "n": "", "vs": [[19, "وأعطيهم جميعا قلبا واحدا، وأجعل في داخلهم روحا جديدا، وأزيل قلب الحجر من لحمهم. وأستبدله بقلب من لحم،"]]}, {"l": "Eze 11:20", "n": "", "vs": [[20, "لكي يسلكوا في فرائضي ويطيعوا أحكامي ويمارسوها، ويكونوا لي شعبا وأنا أكون لهم إلها."]]}, {"l": "Eze 36:25-27", "n": "", "vs": [[25, "وأرش عليكم ماء نقيا فتطهرون من كل نجاستكم ومن كل أصنامكم،"], [26, "وأهبكم قلبا جديدا، وأضع في داخلكم روحا جديدة، وأنتزع من لحمكم قلب الحجر وأعطيكم عوضا عنه قلب لحم."], [27, "وأضع روحي في داخلكم فأجعلكم تمارسون فرائضي وتطيعون أحكامي عاملين بها،"]]}, {"l": "Rom 6:14", "n": "", "vs": [[14, "فلن يكون للخطيئة سيادة عليكم، إذ لستم خاضعين للشريعة بل للنعمة."]]}, {"l": "Rom 6:17-22", "n": "", "vs": [[17, "إنما الشكر لله، لأنكم كنتم عبيدا للخطيئة ولكن أطعتم من القلب صيغة التعليم الذي وضعتم في عهدته."], [18, "والآن، إذ حررتم من الخطيئة، صرتم عبيدا للبر."], [19, "أتكلم بشريا هنا بسبب ضعفكم البشري. فكما قدمتم سابقا أعضاءكم عبيدا للنجاسة والإثم في خدمة الإثم، كذلك قدموا الآن أعضاءكم عبيدا للبر في خدمة القداسة."], [20, "فإنكم، لما كنتم عبيدا للخطيئة، كنتم أحرارا من البر."], [21, "ولكن أي ثمر أنتجتم حينذاك من الأمور التي تخجلون بها الآن، وما عاقبتها إلا الموت؟"], [22, "أما الآن، وقد حررتم من الخطيئة وصرتم عبيدا لله، فإن لكم ثمركم للقداسة، والعاقبة هي الحياة الأبدية."]]}, {"l": "Rom 7:23-25", "n": "", "vs": [[23, "ولكنني أرى في أعضائي ناموسا آخر يحارب الشريعة التي يريدها عقلي، ويجعلني أسيرا لناموس الخطيئة الكائن في أعضائي."], [24, "فيا لي من إنسان تعيس ! من يحررني من جسد الموت هذا؟"], [25, "أشكر الله بيسوع المسيح ربنا! إذن، أنا نفسي من حيث العقل، أخدم شريعة الله عبدا لها؛ ولكنني من حيث الجسد، أخدم ناموس الخطيئة عبدا له."]]}, {"l": "Rom 8:2", "n": "", "vs": [[2, "لأن ناموس روح الحياة في المسيح يسوع قد حررني من ناموس الخطيئة ومن الموت."]]}, {"l": "Rom 8:3", "n": "", "vs": [[3, "فإن ما عجزت الشريعة عنه، لكون الجسد قد جعلها قاصرة عن تحقيقه، أتمه الله إذ أرسل ابنه، متخذا ما يشبه جسد الخطيئة ومكفرا عن الخطيئة فدان الخطيئة في الجسد"]]}, {"l": "Rom 8:13", "n": "", "vs": [[13, "لأنه إن عشتم بحسب الجسد، فإنكم ستموتون، ولكن إن كنتم بالروح تميتون أعمال الجسد، فستحيون."]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Jam 4:5", "n": "", "vs": [[5, "أتظنون أن الكتاب يتكلم عبثا! هل الروح الذي حل في داخلنا يغار عن حسد؟"]]}, {"l": "Jam 4:6", "n": "", "vs": [[6, "لا، بل إنه يجود علينا بنعمة أعظم. لذلك يقول الكتاب: «إن الله يقاوم المتكبرين، ولكنه يعطي المتواضعين نعمة»."]]}, {"l": "1Jo 3:8", "n": "", "vs": [[8, "ولكن من يمارس الخطيئة، يظهر أنه من أولاد إبليس، لأن إبليس يمارس الخطيئة منذ البداية. وقد جاء ابن الله إلى الأرض لكي يبطل أعمال إبليس."]]}], "kwAr": "ويطأ", "noteAr": ""}, {"kw": "cast", "raw": "Psa_103:12; Isa_38:17; Jer_50:20; Dan_9:24", "note": "", "refs": [{"l": "Psa 103:12", "n": "", "vs": [[12, "وكبعد المشرق عن المغرب أبعد عنا معاصينا."]]}, {"l": "Isa 38:17", "n": "", "vs": [[17, "حقا إن ما قاسيته من مرارة كان من أجل خيري، فقد حفظتني بحبك من حفرة الهلاك، وألقيت جميع خطاياي خلف ظهرك."]]}, {"l": "Jer 50:20", "n": "", "vs": [[20, "وفي ذلك الزمان والأوان، يقول الرب، يلتمس إثم إسرائيل فلا يوجد، وخطيئة يهوذا فلا تكون، لأني أعفو عمن أبقيته منهما."]]}, {"l": "Dan 9:24", "n": "", "vs": [[24, "قد صدر القضاء أن يمضي سبعون أسبوعا على شعبك وعلى مدينة قدسك، للانتهاء من المعصية والقضاء على الخطيئة، وللتكفير عن الإثم، ولإشاعة البر الأبدي وختم الرؤيا والنبوءة ولمسح قدوس القدوسين."]]}], "kwAr": "ويطرح", "noteAr": ""}], "arS": [["يعود", ["H7725"]], [" ", []], ["يرحمنا", ["H7355"]], [" ", []], ["ويطأ", ["H3533"]], [" ", []], ["ذنوبنا", ["H5771"]], [" بقدميه، ", []], ["ويطرح", ["H7993"]], [" ", []], ["معاصينا", ["H2403"]], [" إلى ", []], ["أعماق", ["H4688"]], [" ", []], ["البحر", ["H3220"]], [".", []]]}, {"c": 7, "v": 20, "text": "أنت تبدي أمانة لذرية يعقوب، ورحمة لنسل إبراهيم، كما حلفت لأجدادنا منذ القدم.", "groups": [{"kw": "", "raw": "Gen_12:2, Gen_12:3, Gen_17:7, Gen_17:8, Gen_22:16-18, Gen_26:3, Gen_26:4, Gen_28:13, Gen_28:14; Psa_105:8-10; Jer_33:25, Jer_33:26; Luk_1:54, Luk_1:55, Luk_1:72-74; Act_3:25, Act_3:26; Rom_11:26-31; Heb_6:13-18", "note": "", "refs": [{"l": "Gen 12:2", "n": "", "vs": [[2, "فأجعل منك أمة كبيرة وأباركك وأعظم اسمك، وتكون بركة (لكثيرين)."]]}, {"l": "Gen 12:3", "n": "", "vs": [[3, "وأبارك مباركيك وألعن لاعنيك، وتتبارك فيك جميع أمم الأرض»."]]}, {"l": "Gen 17:7", "n": "", "vs": [[7, "وأقيم عهدي الأبدي بيني وبينك، وبين نسلك من بعدك جيلا بعد جيل، فأكون إلها لك ولنسلك من بعدك."]]}, {"l": "Gen 17:8", "n": "", "vs": [[8, "وأهبك أنت وذريتك من بعدك جميع أرض كنعان، التي نزلت فيها غريبا، ملكا أبديا. وأكون لهم إلها»."]]}, {"l": "Gen 22:16-18", "n": "", "vs": [[16, "وقال: «ها أنا أقسم بذاتي يقول الرب: لأنك صنعت هذا الأمر، ولم تمنع ابنك وحيدك عني،"], [17, "لأباركنك وأكثرن ذريتك فتكون كنجوم السماء وكرمل شاطيء البحر، وترث ذريتك مدن أعدائها."], [18, "وبذريتك تتبارك جميع أمم الأرض، لأنك أطعتني»."]]}, {"l": "Gen 26:3", "n": "", "vs": [[3, "أقم في هذه الأرض فأكون معك وأباركك، لأنني أعطي لك ولذريتك جميع هذه الأرض وفاء بقسمي الذي أقسمت لإبراهيم أبيك."]]}, {"l": "Gen 26:4", "n": "", "vs": [[4, "وأكثر ذريتك كنجوم السماء وأهبها جميع هذه البلاد. وتتبارك في نسلك جميع أمم الأرض."]]}, {"l": "Gen 28:13", "n": "", "vs": [[13, "والرب نفسه واقف فوقها يقول: «أنا هو الرب إله أبيك إبراهيم وإله إسحق. إن الأرض التي ترقد عليها الآن أعطيها لك ولذريتك،"]]}, {"l": "Gen 28:14", "n": "", "vs": [[14, "التي ستكون كتراب الأرض، وتمتد غربا وشرقا، وشمالا وجنوبا، وتتبارك بك وبذريتك جميع شعوب الأرض."]]}, {"l": "Psa 105:8-10", "n": "", "vs": [[8, "لم ينس عهده قط ولا وعده الذي قطعه إلى ألف جيل،"], [9, "العهد الذي أبرمه مع إبراهيم، والقسم الذي أقسم به لإسحق."], [10, "ثم ثبته ليعقوب فريضة، ولإسرائيل ميثاقا أبديا،"]]}, {"l": "Jer 33:25", "n": "", "vs": [[25, "وهذا ما يعلنه الرب: إن كنت لم أعقد ميثاقا مع النهار والليل، ولم أسن أحكاما للسماوات والأرض،"]]}, {"l": "Jer 33:26", "n": "", "vs": [[26, "فإني أرفض ذرية يعقوب وداود عبدي، فلا أصطفي من ذريته من يحكم على نسل إبراهيم وإسحق ويعقوب. ولكني سأرد سبيهم وأرحمهم»."]]}, {"l": "Luk 1:54", "n": "", "vs": [[54, "أعان إسرائيل فتاه، متذكرا الرحمة،"]]}, {"l": "Luk 1:55", "n": "", "vs": [[55, "كما تكلم إلى آبائنا، لإبراهيم ونسله إلى الأبد»."]]}, {"l": "Luk 1:72-74", "n": "", "vs": [[72, "ليتم الرحمة نحو آبائنا ويتذكر عهده المقدس"], [73, "ذلك القسم الذي أقسم لإبراهيم أبينا: بأن يمنحنا،"], [74, "بعد تخليصنا من أيدي أعدائنا، أن نعبده بلا خوف،"]]}, {"l": "Act 3:25", "n": "", "vs": [[25, "وأنتم أحفاد هؤلاء الأنبياء، وأبناء العهد الذي أبرمه الله لآبائنا عندما قال لإبراهيم: بنسلك تنال البركة شعوب الأرض كلها."]]}, {"l": "Act 3:26", "n": "", "vs": [[26, "فمن أجلكم أولا أقام الله فتاه يسوع وأرسله ليبارككم برد كل واحد منكم عن شروره»."]]}, {"l": "Rom 11:26-31", "n": "", "vs": [[26, "وهكذا، سوف يخلص جميع إسرائيل، وفقا لما قد كتب: «إن المنقذ سيطلع من صهيون ويرد الإثم عن يعقوب."], [27, "وهذا هو العهد مني لهم حين أزيل خطاياهم»."], [28, "ففيما يتعلق بالإنجيل، هم أعداء الله من أجلكم. وأما فيما يتعلق بالاختيار الإلهي فهم محبوبون من أجل الآباء."], [29, "فإن الله لا يتراجع أبدا عن هباته ودعوته."], [30, "والواقع أنه كما كنتم أنتم في الماضي غير مطيعين لله، ولكنكم الآن نلتم الرحمة من جراء عدم طاعتهم هم،"], [31, "فكذلك الآن هم غير مطيعين لله. لينالوا هم أيضا الرحمة، من جراء الرحمة التي نلتموها أنتم."]]}, {"l": "Heb 6:13-18", "n": "", "vs": [[13, "لنأخذ وعد الله لإبراهيم مثلا. فلما قطع له ذلك الوعد، أقسم بنفسه، إذ ليس هنالك من هو أعظم منه حتى يقسم به."], [14, "وقد قال له: «لأباركنك وأعطينك نسلا كثيرا!»"], [15, "وهكذا، انتظر إبراهيم بصبر فنال ما وعد به."], [16, "فالواقع أن الناس يقسمون بالأعظم. والقسم عندهم، يضع حدا لكل مشاجرة لأنه يحسم الأمور."], [17, "ولذلك، لما أراد الله أن يؤكد بصورة قاطعة لوارثي وعده، أن قراره لا يتغير أبدا، ثبته بالقسم."], [18, "فاستنادا إلى وعد الله وقسمه، وهما أمران ثابتان لا يتغيران ويستحيل أن يكذب الله فيهما، نحصل على تشجيع قوي، بعدما التجأنا إلى التمسك بالرجاء الموضوع أمامنا."]]}], "kwAr": "", "noteAr": ""}], "arS": [["أنت ", []], ["تبدي", ["H5414"]], [" ", []], ["أمانة", ["H571"]], [" لذرية ", []], ["يعقوب", ["H3290"]], ["، ", []], ["ورحمة", ["H2617"]], [" لنسل ", []], ["إبراهيم", ["H85"]], ["، ", []], ["كما", ["H834"]], [" ", []], ["حلفت", ["H7650"]], [" ", []], ["لأجدادنا", ["H1"]], [" ", []], ["منذ", ["H4480"]], [" ", []], ["القدم", ["H3117", "H6924"]], [".", []]]}], "strong": true}];</script>
