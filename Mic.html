<script>window.CATALOG=[{"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 20, "nv": 480, "refs": 6756, "last": "20:49", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 33, "abbr": "Mic", "en": "Micah", "verses": [{"c": 1, "v": 1, "text": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم.", "groups": [{"kw": "Micah", "raw": "Mic_1:14, Mic_1:15; Jer_26:18", "note": "", "refs": [{"l": "Mic 1:14", "n": "", "vs": [[14, "لهذا تحملون هدايا وداع إلى مورشة جت، وتصبح مدينة أكزيب خدعة لملوك إسرائيل."]]}, {"l": "Mic 1:15", "n": "", "vs": [[15, "وأبعث إليكم بقاهر ياأهل مريشة، فيهرب من أمامه نبلاء إسرائيل إلى مغارة عدلام."]]}, {"l": "Jer 26:18", "n": "", "vs": [[18, "«إن ميخا المورشتي تنبأ في عهد حزقيا ملك يهوذا، وخاطب كل شعب يهوذا قائلا هذا ما يعلنه الرب القدير: إن صهيون ستحرث كحقل وتصير أورشليم كومة من الخرائب، وجبل الهيكل مرتفعا تنمو عليه أشجار الغاب."]]}], "kwAr": "ميخا", "noteAr": ""}, {"kw": "Jotham", "raw": "2Chr. 27:1-32:33; Isa_1:1; Hos_1:1", "note": "", "refs": [{"l": "2Ch 27:1-32:33", "n": "", "vs": [[1, "كان يوثام في الخامسة والعشرين من عمره حين ملك، ودام حكمه ست عشرة سنة في أورشليم، واسم أمه يروشة بنت صادوق."], [2, "وصنع كل ما هو قويم في عيني الرب على غرار ما نهج عليه أبوه عزيا، إلا أنه لم يغر على هيكل الرب، إلا أن الشعب ثابر على ارتكاب الآثام."], [3, "وقد قام يوثام ببناء الباب الأعلى لهيكل الرب، وأضاف كثيرا إلى سور الأكمة."], [4, "وبنى مدنا في جبل يهوذا وشيد أبراجا وقلاعا في الغابات."], [5, "وحارب ملك عمون وهزمه، فدفعوا له الجزية في تلك السنة: مئة وزنة (نحو ثلاثة آلاف وست مئة كيلوجرام) من الفضة وعشرة آلاف كيس قمح وعشرة آلاف من الشعير. وقد أدى له العمونيون نفس الجزية في السنة الثانية والثالثة."], [6, "وعظم نفوذ يوثام لأنه سلك بأمانة في طاعة الرب إلهه."], [7, "أما بقية أخبار يوثام وكل حروبه ومنجزاته، أليست هي مدونة في كتاب تاريخ إسرائيل ويهوذا؟"], [8, "كان يوثام في الخامسة والعشرين من عمره حين تولى الملك، ودام حكمه ست عشرة سنة في أورشليم."], [9, "ثم مات فدفنوه في مدينة داود، وخلفه ابنه آحاز على الملك."], [1, "كان آحاز في العشرين من عمره حين تولى الملك، ودام حكمه ست عشرة سنة في أورشليم. وارتكب الشر أمام الرب، بعكس جده داود."], [2, "وسلك في طرق ملوك إسرائيل، وسبك تماثيل لعبادة البعليم."], [3, "وأوقد في وادي ابن هنوم، وأحرق أبناءه بالنار، على حسب رجاسات الأمم الذين طردهم الرب من أمام بني إسرائيل."], [4, "كما قرب محرقات وأوقد على المرتفعات والتلال، وتحت كل شجرة خضراء."], [5, "فأسلمه الرب ليد ملك أرام، فألحق به هزيمة نكراء، وأسروا كثيرين من يهوذا نقلوهم إلى دمشق. كما أسلمه الرب ليد ملك إسرائيل، فكسره شر كسرة."], [6, "وقتل فقح بن رمليا مئة وعشرين ألفا من يهوذا في يوم واحد، وكلهم من المحاربين الأشداء، عقابا لهم، لأنهم تركوا الرب إله آبائهم."], [7, "وقضى زكري بطل أفرايم على معسيا ابن الملك وعزريقام مدير شؤون القصر الملكي، وألقانة التالي للملك في المقام."], [8, "وسبى بنو إسرائيل من أقربائهم بني يهوذا مئتي ألف من النساء والأبناء والبنات، ونهبوا منهم أسلابا وافرة حملوها إلى السامرة."], [9, "غير أن نبيا للرب يدعى عوديد خرج للقاء الجيش الراجع إلى السامرة وقال لهم: «لقد نصركم الرب إله آبائكم على يهوذا لأنه غضب عليهم، وها أنتم قد قتلتموهم بقسوة أغضبت السماء."], [10, "والآن أنتم مزمعون على استعباد بني يهوذا وأورشليم واتخاذهم لكم عبيدا وإماء. ألم تأثموا أنتم أيضا مثلهم في حق الرب إلهكم؟"], [11, "فاسمعوا لي الآن، وردوا الأسرى أقرباءكم، لأن غضب الرب محتدم عليكم»."], [12, "ثم قام رجال من زعماء بني أفرايم هم: عزريا بن يهوحانان، وبرخيا بن مشليموت، ويحزقيا بن شلوم، وعماسا بن حدلاي، واعترضوا سبيل المقبلين من الجيش."], [13, "وقالوا لهم: «لا تدخلوا بالأسرى إلى هنا، إذ يكفينا ما علينا من آثام في حق الرب، وأنتم مزمعون أن تضيفوا إلى خطايانا وآثامنا، فذنوبنا بحد ذاتها كثيرة، وغضب الرب محتدم على إسرائيل»."], [14, "فتخلى المحاربون عن الأسرى والغنائم أمام القادة وكل زعماء الجماعة."], [15, "ونهض بعض الرجال الذين تم تعيينهم بأسمائهم وأخذوا الأسرى ووزعوا عليهم من الغنيمة ملابس وأحذية وطعاما وخمرا، وعالجوا جراحهم بالدهون وأركبوا المعيين فيهم على حمير. وأعادوهم إلى أريحا مدينة النخل حيث أسلموهم إلى أهاليهم، ثم رجعوا إلى السامرة."], [16, "في ذلك الحين استنجد الملك آحاز بملوك أشور،"], [17, "لأن الأدوميين زحفوا على يهوذا وهاجموهم وأخذوا منهم أسرى."], [18, "واقتحم الفلسطينيون مدن السواحل وجنوبي يهوذا واستولوا على بيت شمس وأيلون وجديروت وسوكو وضياعها وتمنة وضياعها وجمزو وضياعها، واستوطنوا فيها،"], [19, "لأن الرب أذل يهوذا بسبب شرور آحاز ملك يهوذا الذي أضل شعبه وخان الرب."], [20, "ولكن تلغث فلناسر ملك أشور ضايق آحاز بدلا من نجدته"], [21, "وكان آحاز قد أخذ قسما من ذهب الهيكل ومن قصر الملك ومن رؤساء البلاد، وقدمه لملك أشور، ولكن هذا لم ينجده."], [22, "وفي أثناء ضيقه ازداد الملك آحاز خيانة للرب."], [23, "وقدم ذبائح لأوثان الأراميين الذين هزموه قائلا: «إن آلهة ملوك أرام تساعدهم، فلأذبحن لهم فيساعدوني». إلا أنهم كانوا سببا في دماره وفي انهيار كل إسرائيل."], [24, "وجمع آحاز آنية بيت الله وحطمها وأغلق أبواب الهيكل، وبنى لنفسه مذابح في كل زاوية في أورشليم،"], [25, "وأقام في كل مدينة من مدن يهوذا مرتفعات ليوقد عليها لآلهة أخرى، فأغاظ الرب إله آبائه."], [26, "أما بقية أخبار آحاز وأعماله من بدايتها إلى نهايتها فهي مدونة في كتاب تاريخ ملوك يهوذا وإسرائيل."], [27, "ثم مات آحاز فدفنوه في مدينة أورشليم، لأنهم لم يواروه في مقابر ملوك إسرائيل، وخلفه ابنه حزقيا على الملك."], [1, "عندما تولى حزقيا الملك كان في الخامسة والعشرين من عمره، ودام حكمه تسعا وعشرين سنة في أورشليم، واسم أمه أبية بنت زكريا."], [2, "وصنع ما هو قويم في عيني الرب على غرار داود أبيه."], [3, "وفي الشهر الأول من السنة الأولى من ملكه فتح أبواب الهيكل ورممها."], [4, "وأدخل الكهنة واللاويين وجمعهم في ساحة الهيكل الشرقية،"], [5, "وقال لهم: «أصغوا إلي أيها اللاويون، تقدسوا الآن، وقدسوا بيت الرب إله آبائكم، وأزيلوا النجاسة من القدس،"], [6, "لأن آباءنا خانوا الرب إلهنا، وارتكبوا الشر في عينيه وتركوه، وحولوا وجوههم عن هيكله وأداروا له ظهورهم،"], [7, "وأغلقوا أيضا أبواب الرواق، وأطفأوا السرج، ولم يوقدوا بخورا، ولم يقربوا محرقة في القدس، لإله إسرائيل."], [8, "فانصب غضب الرب على يهوذا وأورشليم، وجعلهم محل رعب ودهشة واحتقار، كما أنتم تشهدون الآن."], [9, "وهوذا آباؤنا قد سقطوا صرعى السيف، وأبناؤنا وبناتنا ونساؤنا في الأسر من جراء هذا."], [10, "لذلك قررت أن أقطع عهدا مع الرب إله إسرائيل فيرد عنا لهيب غضبه."], [11, "يابني لا تضلوا الآن، فقد اختاركم الرب لتمثلوا أمامه عابدين خادمين، وموقدين له»."], [12, "عندئذ قام اللاويون: محث بن عماساي ويوئيل بن عزريا من ذرية القهاتيين، وقيس بن عبدي وعزريا بن يهللئيل من ذر ية المراريين، ويوآخ بن زمة وعيدن بن يوآخ من ذرية الجرشونيين."], [13, "ومن عشيرة أليصافان: شمرى ويعيئيل، ومن ذرية آساف: زكريا ومتنيا."], [14, "ومن ذرية هيمان: يحيئيل وشمعي، ومن ذرية يدوثون: شمعيا وعزيئيل."], [15, "وجمعوا أقرباءهم اللاويين، وتقدسوا، وبدأوا يطهرون الهيكل بموجب أمر الملك، وكما نصت عليه شريعة الرب."], [16, "ودخل الكهنة إلى قدس الهيكل ليطهروه، وأخرجوا منه كل النجاسة التي وجدوها في الهيكل إلى فناء الهيكل، فأخذها اللاويون وطرحوها في وادي قدرون خارج المدينة."], [17, "وشرعوا في التقديس في أول الشهر الأول، وانتهوا في اليوم الثامن إلى رواق الرب. وهكذا طهروه في ثمانية أيام، وتم تقديس هيكل الرب بكامله في اليوم السادس عشر من الشهر الأول."], [18, "ومثل اللاويون في حضرة حزقيا قائلين: «قد طهرنا كل هيكل الرب ومذبح المحرقة وكل آنيته، ومائدة خبز التقدمة وكل آنيتها،"], [19, "وسائر الأواني التي أزالها الملك آحاز في أثناء فترة حكمه التي خان فيها الرب، وأعددناها وقدسناها، وها هي أمام مذبح الرب»."], [20, "وفي الصباح التالي استدعى حزقيا الملك رؤساء المدينة، وتوجه إلى هيكل الرب."], [21, "فقدموا سبعة ثيران وسبعة كباش وسبعة خراف وسبعة تيوس معزى لتكون ذبيحة خطيئة عن المملكة وعن المقدس وعن يهوذا. وطلب الملك من الكهنة المنحدرين من ذرية هرون أن يقربوها على مذبح الرب،"], [22, "فذبحوا الثيران أولا ثم الكباش ثم الخرفان، ورشوا دم كل ذبيحة بدورها على المذبح."], [23, "بعد ذلك جاءوا بتيوس ذبيحة الخطيئة وأقاموها أمام الملك والحاضرين معه، فوضعوا أيديهم عليها."], [24, "وذبحها الكهنة، وكفروا بدمها على المذبح عن جميع إسرائيل، لأن الملك أمر أن تكون المحرقة وذبيحة الخطيئة عن كل إسرائيل."], [25, "وأوقف حزقيا الملك اللاويين في هيكل الرب بالصنوج والرباب والأعواد، بمقتضى أمر داود وجاد النبي وناثان النبي، تلبية لوصايا الرب التي نطق بها على لسان أنبيائه،"], [26, "فوقف اللاويون بآلات داود، والكهنة بالأبواق."], [27, "وأمر حزقيا بتقريب المحرقة على المذبح. وما إن ابتدأ تقديم المحرقة حتى ارتفع نشيد الرب مصحوبا بالعزف على الأبواق وآلات داود ملك إسرائيل."], [28, "وراح كل الحاضرين يشتركون في العبادة، وأخذ المغنون يشدون، والمبوقون ينفخون بالأبواق، إلى أن انتهى تقديم المحرقة."], [29, "عندئذ سجد الملك وسائر الماثلين معه وعبدوا الرب."], [30, "وطلب حزقيا الملك والرؤساء من اللاويين أن يسبحوا الرب بترانيم داود وآساف النبي، فرتلوا بابتهاج، وسجدوا وعبدوا الرب."], [31, "ثم قال حزقيا للحاضرين: «الآن قد كرستم أنفسكم للرب، فهاتوا ذبائح وقرابين الشكر لهيكل الرب». فأقبلت الجماعة بذبائح وقرابين شكر، وأتى كل سخي بمحرقات."], [32, "وبلغت جملة ما تقدمت به الجماعة من محرقات سبعين ثورا ومئة كبش ومئتي خروف، قربت جميعها محرقات للرب."], [33, "أما الذبائح المخصصة كأقداس فقد بلغ عددها ست مئة من البقر وثلاثة آلاف من الضأن."], [34, "ولما كان عدد الكهنة غير كاف للقيام بسلخ كل تلك المحرقات، ساعدهم اللاويون حتى اكتمل العمل، وحتى تطهر بقية الكهنة، لأن اللاويين كانوا أكثر اهتماما بتطهير أنفسهم من الكهنة."], [35, "وفضلا عن المحرقات الكثيرة فقد توافر شحم ذبائح السلام وسكائب خمر المحرقات. وهكذا عادت العبادة في الهيكل إلى سابق عهدها."], [36, "وابتهج حزقيا وجميع الشعب بما أنعم الرب به عليهم، لأن الأمر حدث بصورة مفاجئة."], [1, "وبعث حزقيا يستدعي جميع إسرائيل ويهوذا، وكتب رسائل إلى أفرايم ومنسى يحضهم على المجيء إلى هيكل الرب في أورشليم، ليحتفلوا بفصح الرب إله إسرائيل."], [2, "واتفق الملك ورؤساؤه وكل الجماعة في أورشليم، بعد التداول، على الاحتفال بالفصح في الشهر الثاني،"], [3, "لأنهم لم يتمكنوا من الاحتفال به في ذلك الحين، إذ لم يكن الكهنة قد تقدسوا تقديسا كافيا، ولم يستطع الشعب الاجتماع في أورشليم."], [4, "فلقي الاتفاق استحسانا لدى الملك ولدى سائر الجماعة،"], [5, "وقرروا إطلاق النداء في جميع أرجاء إسرائيل من بئر سبع إلى دان، ليأتوا للاحتفال بفصح الرب إله إسرائيل في أورشليم، إذ إنهم لم يحتفلوا به كما هو منصوص عليه منذ زمان طويل."], [6, "فانطلق السعاة حاملين رسائل الملك وقادته إلى جميع إسرائيل ويهوذا، داعين الناس بموجب أمر الملك، وقائلين لهم: «يابني إسرائيل، ارجعوا إلى الرب إله إبراهيم وإسحق وإسرائيل، فيرجع إليكم أنتم الباقين الناجين من يد ملوك أشور."], [7, "ولا تخونوا الرب إله آبائكم كما خانه أباؤكم وإخوتكم، فجعلهم مثار دهشة كما ترون."], [8, "ولا تعاندوا الآن كآبائكم، بل أذعنوا للرب وادخلوا إلى مقدسه الذي قدسه إلى الأبد، واعبدوا الرب إلهكم فيتحول عنكم غضبه اللاهب."], [9, "لأن رجوعكم إلى الرب يجعل إخوتكم وأبناءكم يلقون رحمة من آسريهم فيرجعون إلى هذه الأرض، لأن الرب إلهكم رؤوف رحيم، ولا يحول وجهه عنكم إن رجعتم إليه»."], [10, "فكان السعاة ينطلقون من مدينة إلى مدينة في أرض أفرايم ومنسى حتى بلغوا مواطن سبط زبولون، فكانوا يسخرون منهم ويهزأون بهم،"], [11, "باستثناء قلة من أسباط أشير ومنسى وزبولون ممن تواضعوا وقدموا إلى أورشليم."], [12, "وعملت يد الرب في أوساط يهوذا فوحدت قلوبهم لتنفيذ ما أمر به الملك والرؤساء، بموجب وصايا الرب."], [13, "فاحتشد في أورشليم جمهور غفير للاحتفال بعيد الفطير في الشهر الثاني."], [14, "فأنزلوا مذابح الأوثان المبنية في أورشليم، وهدموا مذابح التبخير وطرحوها جميعها في وادي قدرون،"], [15, "وذبحوا الفصح في اليوم الرابع عشر من الشهر الثاني. واعترى الخجل الكهنة واللاويين، فتطهروا وأدخلوا المحرقات إلى الهيكل."], [16, "وأخذوا أماكنهم في الهيكل حسب ما نصت عليه شريعة موسى رجل الله، وتناولوا الدم من يد اللاويين ورشوه على المذبح."], [17, "لأن لفيفا كبيرا من الشعب لم يكن قد تطهر، فكان على اللاويين أن يقوموا بذبح حملان الفصح نيابة عن غير المتطهرين، وتكريس تلك الحملان للرب،"], [18, "إذ أن جمعا غفيرا من أبناء أفرايم ومنسى ويساكر وزبولون لم يتطهروا، بل أكلوا من الفصح على خلاف ما هو منصوص عليه. إلا أن حزقيا ابتهل إلى الله عنهم قائلا: «الرب صالح يكفر"], [19, "عن كل من أعد قلبه لطلب الرب إله آبائه، حتى لو لم يكن طاهرا وفق فرائض التطهير التي نصت عليها أحكام الهيكل»."], [20, "فاستجاب الرب لحزقيا وأبرأ الشعب."], [21, "واحتفل بنو إسرائيل الحاضرون في أورشليم بفرح عظيم بعيد الفطير سبعة أيام، سبح فيها اللاويون والكهنة، يوما فيوما، بآلات حمد للرب."], [22, "وعزى حزقيا بكلمات التشجيع قلوب اللاويين الذين أبدوا فطنة في خدمة الرب. وظلوا يأكلون نصيبهم سبعة أيام، ويقربون ذبائح سلام حامدين الرب إله آبائهم."], [23, "ثم اتفقوا على الاستمرار بالاحتفال سبعة أيام أخرى قضوها بفرح عظيم،"], [24, "لأن حزقيا تبرع للجماعة بألف ثور وسبعة آلاف من الضأن، كما تبرع رؤساء الشعب بألف ثور وعشرة آلاف من الضأن، وتطهر عدد كبير من الكهنة."], [25, "وعمت البهجة كل جماعة يهوذا والكهنة واللاويين، وكل الوافدين من إسرائيل، والغرباء القادمين من أرض إسرائيل المقيمين في يهوذا."], [26, "وغمرت الفرحة العظيمة أورشليم لأنه لم يحتفل بمثل هذا في أورشليم منذ أيام سليمان بن داود."], [27, "ووقف الكهنة واللاويون وطلبوا البركة على الشعب فاستجاب الرب صلاتهم التي صعدت إلى مسكن قدسه في السماء."], [1, "وبعد أن تم الاحتفال، اندفع كل الإسرائيليين الحاضرين إلى مدن يهوذا وحطموا الأنصاب وقطعوا تماثيل عشتاروث، وهدموا المرتفعات والمذابح في كل يهوذا وبنيامين، وفي أرض أفرايم ومنسى حتى استأصلوها. ثم رجع كل واحد إلى بيته في مدينته."], [2, "وأعاد حزقيا تنظيم خدمة الكهنة واللاويين حسب فرقهم، وعين لكل واحد خدمته بموجب منصبه، ككاهن أو لاوي، لتقريب المحرقات، وتقديم ذبائح السلام وخدمة التسبيح عند أبواب هيكل الرب."], [3, "وتبرع الملك بحصة من ماله للمحرقات الصباحية والمسائية، ومحرقات أيام السبت ومطالع الأشهر والأعياد، كما هو منصوص عليه في شريعة الرب."], [4, "وطلب إلى أهل أورشليم أن يعطوا الكهنة واللاويين حصتهم حتى يتفرغوا لشريعة الرب."], [5, "وما إن ذاع أمر الملك حتى قدم بنو إسرائيل بسخاء من بواكير الحنطة، وأول محصول الكروم، والزيت والعسل ومن كل محاصيل الحقل، وأتوا بعشور إنتاجها بكميات وافرة،"], [6, "كما قدم بنو إسرائيل ويهوذا المقيمون في مدن يهوذا عشور البقر والضأن، وعشور الأقداس المخصصة للرب إلههم، وجعلوها أكواما أكواما."], [7, "وشرعوا في تكويمها في الشهر الثالث وفرغوا منها في الشهر السابع."], [8, "ثم جاء حزقيا ورؤساء الشعب وشاهدوا الأكوام فباركوا الرب وشعبه إسرائيل."], [9, "ولما سأل حزقيا الكهنة واللاويين عن هذه الأكوام،"], [10, "أجابه عزريا رئيس الكهنة من بيت صادوق: «منذ أن أخذ الشعب في التبرع بالتقدمات إلى هيكل الرب، أكلنا وشبعنا، وفضلت عنا هذه الكميات الوافرة، لأن الرب بارك شعبه. وهذه الوفرة قد فضلت عنا»."], [11, "وأمر حزقيا بإعداد مخازن في بيت الرب، فهيأوها،"], [12, "وأودعوا فيها التقدمات والعشور والأقداس بأمانة، وتعين كوننيا اللاوي رئيسا مشرفا على القائمين بهذا العمل، يعاونه في ذلك أخوه شمعي،"], [13, "أما يحيئيل وعزريا ونحث وعسائيل ويريموث ويوزاباد وإيليئيل ويسمخيا ومحث وبنايا، فكانوا وكلاء يعملون تحت إشراف كوننيا وشمعي وفقا للترتيب الذي قرره حزقيا الملك وعزريا رئيس كهنة بيت الله."], [14, "وكان قوري بن يمنة اللاوي حارس الباب الشرقي مشرفا على التبرعات الطوعية المقدمة لله، وعلى توزيع التقدمات المخصصة للرب وعلى عطايا الأقداس،"], [15, "يعاونه بأمانة: عدن ومنيامين ويشوع وشمعيا وأمريا وشكنيا في مدن الكهنة، في توزيع أنصبة إخوتهم الكهنة حسب فرقهم، من غير تمييز بين كبير وصغير."], [16, "فضلا عما كانوا يوزعونه كل يوم بيومه على المنتسبين من ذكورهم من ابن ثلاث سنوات فما فوق، وعلى كل من يدخل إلى بيت الله ليقوم بمختلف مهام خدمته اليومية، وفقا لمسؤلياتهم وفرقهم."], [17, "وقد أدرجت أسماء الكهنة في السجلات بحسب انتمائهم لبيوت آبائهم. أما اللاويون من ابن عشرين سنة فما فوق فقد سجلوا حسب العمل الذي يقومون به."], [18, "وقد اشتملت السجلات على أسماء الكهنة وجميع أطفالهم ونسائهم وأبنائهم وبناتهم، لأنهم كانوا أمناء في تطهير أنفسهم."], [19, "وقد تم تعيين كهنة بأسمائهم من أبناء هرون المقيمين في مزارع المدن، وفي كل مدينة، ليقوموا بتوزيع حصص على كل ذكر من الكهنة، وعلى كل منتسب من اللاويين."], [20, "هذا ما أجراه حزقيا في كل بلاد يهوذا، صانعا كل ما هو صالح وقويم وحق أمام الرب إلهه."], [21, "وكل ما قام به في خدمة بيت الله كان طاعة للشريعة والوصية، وسعيا وراء طلب الله، بكل ولاء، فأفلح."], [1, "وبعد كل ما قام به حزقيا بأمانة، زحف سنحاريب على أرض يهوذا ودخلها، وحاصر المدن الحصينة طمعا في الاستيلاء عليها."], [2, "وعندما رأى حزقيا أن سنحاريب قد وطد العزم على محاربة أورشليم،"], [3, "تداول في الأمر مع رؤساء جيشه وزعماء البلاد، واتفقوا على ردم مياه العيون القائمة خارج المدينة، فأعانوه."], [4, "وتجمع جمهور غفير، ردموا جميع الينابيع والنهر الجاري في وسط الأرض قائلين: «لماذا يأتي ملوك أشور ويجدون مياها غزيرة؟»"], [5, "وتشجع ورمم السور المنهدم، وعززه بالأبراج المرتفعة، وبنى سورا آخر خارجه، وحصن قلعة مدينة داود، وصنع أسلحة كثيرة وأتراسا."], [6, "وعبأ كل شعب المدينة تحت قيادة ضباط الجيش، واستدعاهم إلى ساحة باب المدينة ليبث فيهم الشجاعة قائلا لهم:"], [7, "«تقووا وتشجعوا، لا تجزعوا ولا ترتعبوا من ملك أشور ولا من كل الجيش الذي معه، لأن الذي معنا أكثر من الذي معه."], [8, "فمعه قوى بشرية، ومعنا الرب إلهنا لينجدنا ويحارب حروبنا». فبث كلام حزقيا الشجاعة في قلوب الشعب."], [9, "وفيما كان سنحاريب وجيشه يحاصرون لخيش، أرسل رجاله إلى أورشليم إلى حزقيا ملك يهوذا وإلى أهل أورشليم قائلين:"], [10, "«هذا ما يقوله سنحاريب ملك أشور: على ماذا تتكلون فتقيموا في أورشليم تحت الحصار؟"], [11, "ألا يغويكم حزقيا لكي تموتوا جوعا وعطشا، عندما يقول لكم: الرب إلهنا ينقذنا من يد ملك أشور؟"], [12, "أليس حزقيا هو الذي أزال مرتفعاته ومذابحه، وأمر يهوذا وأورشليم قائلا: أمام مذبح واحد تسجدون وعليه توقدون؟"], [13, "أما تعرفون ما أجريته أنا وآبائي على جميع أمم الأراضي، فهل استطاعت آلهتها أن تنقذ أرضها من يدي؟"], [14, "من من بين جميع آلهة هؤلاء الأمم الذين دمرهم آبائي استطاع أن ينقذ شعبه مني؟ فكيف يستطيع إلهكم أن ينقذكم من يدي؟"], [15, "لذلك لا يخدعنكم حزقيا ولا يغوينكم. لا تصدقوه لأنه لم يقدر إله أي أمة أو مملكة أن ينجي شعبه من يدي ومن يد آبائي، فكيف يمكن لإلهكم أن ينجيكم؟»"], [16, "وأكثر الضباط الأشوريون من التهجم على الرب وعلى عبده حزقيا."], [17, "وكتب الملك الأشوري رسائل عير فيها الرب إله إسرائيل، جاء فيها: «كما أن آلهة أمم الأرض عجزت عن إنقاذ شعوبها من يدي، كذلك لا ينقذ إله حزقيا شعبه من يدي»."], [18, "وهتف رجال سنحاريب باليهودية مخاطبين أهل أورشليم الواقفين على السور، ليوقعوا فيهم الرعب والخوف، تمهيدا للاستيلاء على المدينة،"], [19, "وكان تهجمهم على الرب إله أورشليم مماثلا لتهجمهم على أصنام الشعوب الأخرى التي صنعتها أيدي الناس."], [20, "فصلى حزقيا الملك وإشعياء بن آموص النبي، واستغاثا بالسماء من جراء ذلك،"], [21, "فأرسل الرب ملاكا فأباد كل بطل صنديد ورئيس وقائد في معسكر ملك أشور، فرجع إلى أرضه مخذولا. وعندما دخل معبد إلهه اغتاله هناك أولاده بالسيف"], [22, "وهكذا أنقذ الرب حزقيا وسكان أورشليم من سنحاريب ملك أشور ومن أيدي سواه من الأعداء، ووقاهم من كل ناحية."], [23, "وشرع كثيرون يأتون بتقدمات للرب إلى أورشليم، ويحملون تحفا لحزقيا ملك يهوذا، وارتفعت مكانته في أعين جميع الأمم بعد ذلك."], [24, "في تلك الأيام مرض حزقيا إلى أن أشرف على الموت، وصلى إلى الرب، فاستجاب له وأعطاه علامة تأكيدا لشفائه."], [25, "ولكن حزقيا لم يتجاوب مع ما أبداه الله نحوه من نعم، إذ امتلأ قلبه كبرياء، فغضب الرب عليه وعلى يهوذا وأورشليم."], [26, "ثم اتضع حزقيا بعد كبريائه، هو وأهل أورشليم، فلم يحل بهم غضب الرب في أيام حزقيا."], [27, "وأحرز حزقيا غنى ومجدا عظيمين، وبنى لنفسه مخازن للفضة والذهب والحجارة الكريمة والأطياب والأتراس وكل آنية ثمينة،"], [28, "ومخازن لمحاصيل الحنطة، ونتاج الكرمة والزيت، ومرابط لكل أنواع البهائم وحظائر للقطعان."], [29, "وبنى لنفسه قرى، وامتلك مواشي غنم وبقر بوفرة، لأن الله أغدق عليه أموالا كثيرة جدا."], [30, "وهو الذي سد مخرج مياه جدول جيحون الأعلى، وحوله إلى قناة تحت الأرض، تمتد إلى الجهة الغربية في مدينة داود. ولقد أفلح حزقيا في كل عمل قام به."], [31, "ولكن عندما وفد عليه مبعوثو ملوك بابل ليستعلموا منه عن معجزة شفائه، تركه الله ليختبر سرائر قلبه."], [32, "أما بقية أخبار حزقيا فهي مدونة في رؤيا إشعياء بن آموص النبي، وفي كتاب تاريخ ملوك يهوذا وإسرائيل."], [33, "ثم مات حزقيا فدفنوه في الجزء الأعلى من مقابر بيت داود، فكرمه كل أهل أورشليم ويهوذا عند موته، وخلفه ابنه منسى على الملك."]]}, {"l": "Isa 1:1", "n": "", "vs": [[1, "هذه هي رؤيا إشعياء بن آموص، التي أعلنت له بشأن يهوذا وأورشليم في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا."]]}, {"l": "Hos 1:1", "n": "", "vs": [[1, "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."]]}], "kwAr": "يوثام", "noteAr": ""}, {"kw": "which", "raw": "Amo_1:1; Hab_1:1", "note": "", "refs": [{"l": "Amo 1:1", "n": "", "vs": [[1, "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."]]}, {"l": "Hab 1:1", "n": "", "vs": [[1, "هذه رؤيا حبقوق النبي:"]]}], "kwAr": "التي", "noteAr": ""}, {"kw": "concerning", "raw": "Mic_1:5; Hos_4:15, Hos_5:5-14, Hos_6:10,Hos_6:11, Hos_8:14, Hos_12:1, Hos_12:2; Amo_2:4-8, Amo_3:1, Amo_3:2, Amo_6:1", "note": "", "refs": [{"l": "Mic 1:5", "n": "", "vs": [[5, "من أجل آثام يعقوب ومن أجل خطايا بيت إسرائيل. فما هو ذنب يعقوب؟ أليس هو أصنام السامرة؟ وما هي خطيئة يهوذا؟ أليست هي أوثان أورشليم؟"]]}, {"l": "Hos 4:15", "n": "", "vs": [[15, "فإن كنت ياشعب إسرائيل زانيا، فلا تجعل يهوذا يأثم أو يذهب إلى الجلجال أو إلى بيت آون ولا يحلف قائلا: حي هو الرب."]]}, {"l": "Hos 5:5-14", "n": "", "vs": [[5, "ها صلف إسرائيل يشهد عليه في وجهه، وإسرائيل وأفرايم يكبوان بإثمهما، ويتعثر معهما يهوذا أيضا."], [6, "وحين ينطلقون بمواشيهم ليلتمسوا الرب لا يجدونه، إذ قد انصرف عنهم."], [7, "لقد خانوا الرب لأنهم أنجبوا أبناء غرباء عنه، لذلك فإن مواسم أوائل الشهر الجديد تلتهمهم مع حقولهم."], [8, "انفخوا في أبواق الحرب في جبعة وفي الرامة، وأطلقوا صيحة القتال في بيت آون: تقدم يابنيامين."], [9, "أرض أفرايم ستصبح خرابا في يوم القضاء، وبين أسباط إسرائيل أظهرت ما هو يقين."], [10, "قد صار رؤساء يهوذا متعدين كالذين ينقلون تخوم الأرض ليسلبوا سواهم. لهذا سأصب عليهم سخطي كالماء."], [11, "لقد لحق الضيق بإسرائيل، وسحقه القضاء لأنه وطد العزم على الغواية وراء الأوثان."], [12, "لهذا أكون كالعث لإسرائيل، وكالسوس الناخر لشعب يهوذا."], [13, "عندما تبين إسرائيل داءه، ويهوذا جراحه، لجأ إسرائيل إلى أشور يلتمس معونة الملك العظيم، إلا أنه أخفق في علاجه أو في مداواة جراحه."], [14, "فإني سأكون كالأسد المفترس لإسرائيل، وكالشبل لأبناء يهوذا. أفترس وأمضي. أخطف ولا من منقذ."]]}, {"l": "Hos 6:10", "n": "", "vs": [[10, "لقد شهدت في وسط شعب إسرائيل فظائع، فقد زنى هناك أفرايم وتنجس إسرائيل."]]}, {"l": "Hos 6:11", "n": "", "vs": [[11, "أما أنت يايهوذا فقد تحدد موعد عقابك عندما أرد سبي شعبي."]]}, {"l": "Hos 8:14", "n": "", "vs": [[14, "لأن إسرائيل قد نسي خالقه، وشيد قصورا، وأكثر يهوذا من بناء المدن المحصنة، لهذا سأرسل نارا على هذه المدن فتلتهم حصونه."]]}, {"l": "Hos 12:1", "n": "", "vs": [[1, "يرعى أفرايم الريح، ويطارد الريح الشرقية طوال اليوم، ويرتكب الأكاذيب والجور بكثرة، ويبرم عهدا مع أشور، ويبعث بزيت الزيتون إلى مصر."]]}, {"l": "Hos 12:2", "n": "", "vs": [[2, "للرب دعوى على يهوذا، وسيعاقب إسرائيل بمقتضى طرقه ويجازيه بموجب أعماله."]]}, {"l": "Amo 2:4-8", "n": "", "vs": [[4, "هذا ما يقوله الرب: من أجل معاصي يهوذا الثلاث والأربع لن أرد عنهم سخطي، لأنهم رفضوا شريعة الرب ولم يطيعوا فرائضه، فأضلتهم أكاذيبهم التي غوى وراءها آباؤهم."], [5, "لهذا أرسل نارا على يهوذا فتلتهم حصون أورشليم."], [6, "هذا ما يقوله الرب: من أجل معاصي إسرائيل الثلاث والأربع لن أرد عنهم سخطي، لأنهم باعوا الصديق لقاء الفضة، والبائس مقابل نعلين."], [7, "الذين يسحقون رأس المسكين في التراب، ويجورون على البائسين، ويعاشر الرجل وابنه امرأة واحدة، فيتدنس بذلك اسمي المقدس."], [8, "يرقدون إلى جوار المذبح فوق ثياب مرهونة، ويشربون في هيكل إلههم خمر المغرمين."]]}, {"l": "Amo 3:1", "n": "", "vs": [[1, "اسمعوا يابني إسرائيل هذه الكلمة التي قضى بها الرب عليكم، بل على كل القبيلة التي أخرجتها من ديار مصر:"]]}, {"l": "Amo 3:2", "n": "", "vs": [[2, "إياكم وحدكم اخترت من بين جميع قبائل الأرض، لهذا أعاقبكم على جميع آثامكم."]]}, {"l": "Amo 6:1", "n": "", "vs": [[1, "ويل للمترفين في صهيون والمطمئنين في جبل السامرة، نبلاء طليعة الأمم الذين يتوافد إليهم شعب إسرائيل."]]}], "kwAr": "بشأن", "noteAr": ""}], "arS": [["هذه ", []], ["كلمة", ["H1697"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["التي", ["H834"]], [" ", []], ["أوحى", ["H1961"]], [" بها ", []], ["إلى", ["H413"]], [" ", []], ["ميخا", ["H4318"]], [" ", []], ["المورشتي", ["H4183"]], [" في ", []], ["أثناء", ["H3117"]], [" حكم ", []], ["يوثام", ["H3147"]], [" ", []], ["وآحاز", ["H271"]], [" ", []], ["وحزقيا", ["H3169"]], [" ", []], ["ملوك", ["H4428"]], [" ", []], ["يهوذا", ["H3063"]], ["، ", []], ["بشأن", ["H5921"]], [" ", []], ["السامرة", ["H8111"]], [" ", []], ["وأورشليم", ["H3389"]], [".", []]]}, {"c": 1, "v": 2, "text": "اسمعوا ياجميع الشعوب، وأصغي أيتها الأرض وكل من فيها، وليكن السيد الرب من هيكله المقدس شاهدا عليكم.", "groups": [{"kw": "all ye people", "raw": "Heb. ye people all of them", "note": "Heb. ye people all of them", "refs": [], "kwAr": "ياجميع الشعوب", "noteAr": "بالعبرية: «أيها الشعوب كلهم»."}, {"kw": "hearken", "raw": "Mic_6:1, Mic_6:2; Deu_32:1; Psa_49:1, Psa_49:2, Psa_50:1; Isa_1:2; Jer_22:29; Mar_7:14-16; Rev_2:7, Rev_2:11, Rev_2:17, Rev_2:29, Rev_3:6, Rev_3:13, Rev_3:22", "note": "", "refs": [{"l": "Mic 6:1", "n": "", "vs": [[1, "استمعوا إلى ما يقوله الرب: انهض وأعلن دعواك أمام الجبال، ولتكن الأكام شاهدة على كلامك."]]}, {"l": "Mic 6:2", "n": "", "vs": [[2, "استمعي ياجبال إلى شكوى الرب، وأصغي ياأسس الأرض الثابتة، فإن لدى الرب شكوى على شعبه وهو يحاكم إسرائيل."]]}, {"l": "Deu 32:1", "n": "", "vs": [[1, "«أصغي أيتها السماوات فأتكلم ولتنصت الأرض إلى أقوال فمي."]]}, {"l": "Psa 49:1", "n": "", "vs": [[1, "اسمعوا هذا ياجميع الشعوب، أصغوا ياجميع سكان العالم."]]}, {"l": "Psa 49:2", "n": "", "vs": [[2, "(اسمعوا) إلي أيها العظماء، الأغنياء والفقراء على السواء."]]}, {"l": "Psa 50:1", "n": "", "vs": [[1, "الرب الإله القدير تكلم، ودعا الأرض للمحاكمة من مشرق الشمس إلى مغربها."]]}, {"l": "Isa 1:2", "n": "", "vs": [[2, "اسمعي أيتها السماوات وأصغي أيتها الأرض لأن الرب يتكلم: «ربيت أبناء وأنشأتهم ولكنهم تمردوا علي."]]}, {"l": "Jer 22:29", "n": "", "vs": [[29, "ياأرض! ياأرض! ياأرض! اسمعي كلمة الرب:"]]}, {"l": "Mar 7:14-16", "n": "", "vs": [[14, "وإذ دعا الجمع إليه ثانية، قال لهم: «اسمعوا لي كلكم وافهموا!"], [15, "لا شيء من خارج الإنسان إذا دخله يمكن أن ينجسه. أما الأشياء الخارجة من الإنسان، فهي التي تنجسه."], [16, "من له أذنان للسمع، فليسمع»."]]}, {"l": "Rev 2:7", "n": "", "vs": [[7, "من له أذنان فليسمع ما يقوله الروح للكنائس! كل من ينتصر سأطعمه من ثمر شجرة الحياة في فردوس الله."]]}, {"l": "Rev 2:11", "n": "", "vs": [[11, "من له أذن فليسمع ما يقوله الروح للكنائس! كل من ينتصر لن يلحق به أذى الموت الثاني!"]]}, {"l": "Rev 2:17", "n": "", "vs": [[17, "من له أذن فليسمع ما يقوله الروح للكنائس! كل من سينتصر سأطعمه من المن الخفي، وأعطيه حجرا صغيرا أبيض حفر عليه اسم جديد لا يعرفه إلا الذي يأخذه!"]]}, {"l": "Rev 2:29", "n": "", "vs": [[29, "من له أذن فليسمع ما يقوله الروح للكنائس!"]]}, {"l": "Rev 3:6", "n": "", "vs": [[6, "من له أذن فليسمع ما يقوله الروح للكنائس!"]]}, {"l": "Rev 3:13", "n": "", "vs": [[13, "من له أذن فليسمع ما يقوله الروح للكنائس!"]]}, {"l": "Rev 3:22", "n": "", "vs": [[22, "من له أذن فليسمع ما يقوله الروح للكنائس!»"]]}], "kwAr": "وأصغي", "noteAr": ""}, {"kw": "all that therein is", "raw": "Heb. the fulness thereof, Psa_24:1, Psa_50:12", "note": "Heb. the fulness thereof, Psa_24:1, Psa_50:12", "refs": [{"l": "Psa 24:1", "n": "", "vs": [[1, "للرب الأرض وكل ما فيها. له العالم، وجميع الساكنين فيه."]]}, {"l": "Psa 50:12", "n": "", "vs": [[12, " اه. هوذا ينزل ليطأ مشارف الأرض،", "groups": [{"kw": "cometh", "raw": "Isa_26:21, Isa_64:1, Isa_64:2; Eze_3:12; Hos_5:14, Hos_5:15", "note": "", "refs": [{"l": "Isa 26:21", "n": "", "vs": [[21, "وانظروا فإن الرب خارج من مكانه ليعاقب سكان الأرض على آثامهم، فتكشف الأرض عما سفك عليها من دماء ولا تغطي قتلاها فيما بعد."]]}, {"l": "Isa 64:1", "n": "", "vs": [[1, "ليتك تشق السماوات وتنزل فتتزلزل الجبال من حضرتك!"]]}, {"l": "Isa 64:2", "n": "", "vs": [[2, "فتكون كالنار التي تضرم الهشيم، وتجعل المياه تغلي لكي تعرف أعداءك اسمك، فترتعب الأمم من حضرتك."]]}, {"l": "Eze 3:12", "n": "", "vs": [[12, "ثم حملني الروح، فسمعت خلفي صوت زلزلة عنيفة قائلا: «مبارك مجد الرب من مكانه»."]]}, {"l": "Hos 5:14", "n": "", "vs": [[14, "فإني سأكون كالأسد المفترس لإسرائيل، وكالشبل لأبناء يهوذا. أفترس وأمضي. أخطف ولا من منقذ."]]}, {"l": "Hos 5:15", "n": "", "vs": [[15, "ثم أرجع إلى موضعي إلى أن يعترفوا بإثمهم ويطلبوا وجهي، وفي ضيقهم يلتمسونني (قائلين):"]]}], "kwAr": "خارج", "noteAr": ""}, {"kw": "place", "raw": "Psa_115:3", "note": "", "refs": [{"l": "Psa 115:3", "n": "", "vs": [[3, "إن إلهنا في السماوات. كل ما شاء صنع."]]}], "kwAr": "مقر سكناه", "noteAr": ""}, {"kw": "and tread", "raw": "Job_40:12; Isa_2:10-19, Isa_25:10, Isa_63:3, Isa_63:4; Amo_4:13", "note": "", "refs": [{"l": "Job 40:12", "n": "", "vs": [[12, "انظر إلى كل متعظم وذلله، ودس الأشرار في مواضعهم."]]}, {"l": "Isa 2:10-19", "n": "", "vs": [[10, "اختف في مغاور الجبال، واختبيء في حفر الأرض خشية من هيبة الرب ومن جلال مجده."], [11, "فعيون البشر المتشامخة تخفض، وكبرياؤهم تذل، ويتعظم الرب وحده في ذلك اليوم."], [12, "فإن للرب القدير يوما فيه يوضع كل متعظم ومتكبر ومتغطرس."], [13, "ويسمو على أرز لبنان المتعالي الشامخ، وعلى كل بلوط باشان،"], [14, "وعلى كل جبل أشم، وعلى التلال المرتفعة،"], [15, "وعلى كل برج عال، وسور حصين،"], [16, "وعلى كل سفن ترشيش، وعلى كل صنعة جميلة،"], [17, "فيعتري الهوان غطرسة كل إنسان، ويذل تشامخ البشر، ويتعظم الرب وحده في ذلك اليوم،"], [18, "وتباد الأصنام كلها،"], [19, "ويلجأ الناس إلى مغاور الجبال، وإلى حفائر الأرض، متوارين من هيبة الرب ومن مجد جلاله، عندما يهب ليزلزل الأرض."]]}, {"l": "Isa 25:10", "n": "", "vs": [[10, "لأن يد الرب تستقر على هذا الجبل ويوطأ موآب في مكانه كما يوطأ التبن في الطين."]]}, {"l": "Isa 63:3", "n": "", "vs": [[3, "لقد دست المعصرة وحدي، ولم يكن معي أحد من الشعوب. قد دستهم في سخطي ووطئتهم في غيظي، فتناثر دمهم على ردائي ولطخت ثيابي."]]}, {"l": "Isa 63:4", "n": "", "vs": [[4, "لأن يوم الانتقام كان كامنا في قلبي، وسنة مفديي قد أتت."]]}, {"l": "Amo 4:13", "n": "", "vs": [[13, "فانظر إنه هو صانع الجبال وخالق الرياح، الذي أعلن فكره للبشر، وأحال النهار إلى ليل، ومشى فوق مشارف الأرض، الرب الإله القدير اسمه."]]}], "kwAr": "ليطأ", "noteAr": ""}, {"kw": "the high", "raw": "Deu_32:13, Deu_33:29; Hab_3:19", "note": "", "refs": [{"l": "Deu 32:13", "n": "", "vs": [[13, "أصعدهم على هضاب الأرض فأكلوا ثمار الصحراء، وغذاهم بعسل من صخر، وزيت من حجر الصوان،"]]}, {"l": "Deu 33:29", "n": "", "vs": [[29, "طوباكم يابني إسرائيل، أي شعب مثلكم منتصر بالرب؟ إنه ترسكم وعونكم وسيفكم المجيد. لكم يخضع أعداؤكم، وأنتم تطأون مرتفعاتهم»."]]}, {"l": "Hab 3:19", "n": "", "vs": [[19, "الرب الإله هو قوتي؛ يجعل قدمي كقدمي غزال، ويعينني على ارتقاء المرتفعات.إلى قائد الجوقة: تغنى على ذوات الأوتار."]]}], "kwAr": "مشارف", "noteAr": ""}], "arS": [["انظروا", ["H2009"]], [": ها هو ", []], ["الرب", ["H3068"]], [" ", []], ["خارج", ["H3318"]], [" من ", []], ["مقر", ["H4480", "H4725"]], [" سكناه. هوذا ", []], ["ينزل", ["H3381"]], [" ", []], ["ليطأ", ["H1869"]], [" ", []], ["مشارف", ["H1116"]], [" ", []], ["الأرض", ["H776"]], ["،", []]]}, {"c": 1, "v": 4, "text": "فتذوب الجبال من تحت قدميه، وتتصدع الوديان كالشمع أمام النار، كالمياه المنصبة في المنخفضات.", "groups": [{"kw": "the mountains", "raw": "Jdg_5:4; Psa_97:5; Isa_64:1-3; Amo_9:5; Nah_1:5; Hab_3:6, Hab_3:10; 2Pe_3:10-12; Rev_20:11", "note": "", "refs": [{"l": "Jdg 5:4", "n": "", "vs": [[4, "يارب، عندما خرجت من سعير وتقدمت من صحراء أدوم، ارتعدت الأرض، وسكبت السماء أمطارها، وقطرت السحب ماء."]]}, {"l": "Psa 97:5", "n": "", "vs": [[5, "ذابت الجبال كالشمع من نظرة الرب سيد الأرض كلها."]]}, {"l": "Isa 64:1-3", "n": "", "vs": [[1, "ليتك تشق السماوات وتنزل فتتزلزل الجبال من حضرتك!"], [2, "فتكون كالنار التي تضرم الهشيم، وتجعل المياه تغلي لكي تعرف أعداءك اسمك، فترتعب الأمم من حضرتك."], [3, "عندما أجريت أعمالا مخيفة لم نتوقعها، نزلت فتزلزلت الجبال من حضرتك."]]}, {"l": "Amo 9:5", "n": "", "vs": [[5, "إن الرب الإله القدير هو الذي يلمس الأرض فتذوب، وينوح كل المقيمين فيها، ويرتفع كل ما فيها وينخفض كنهر نيل مصر."]]}, {"l": "Nah 1:5", "n": "", "vs": [[5, "تتزلزل الجبال أمامه، وتذوب التلال، وتتصدع الأرض في حضرته والمسكونة والساكنون فيها."]]}, {"l": "Hab 3:6", "n": "", "vs": [[6, "وقف وزلزل الأرض، تفرس فأرعب الأمم، اندكت الجبال الأبدية وانهارت التلال القديمة، أما مسالكه فهي من الأزل."]]}, {"l": "Hab 3:10", "n": "", "vs": [[10, "رأتك الجبال فارتعدت، وطمت المياه الهائجة. زأرت اللجج وارتفعت أمواجها عالية."]]}, {"l": "2Pe 3:10-12", "n": "", "vs": [[10, "إلا أن «يوم الرب» سيأتي كما يأتي اللص في الليل. في ذلك اليوم، تزول السماوات محدثة دويا هائلا وتنحل العناصر محترقة بنار شديدة، وتحترق الأرض وما فيها من منجزات."], [11, "ومادامت هذه الأشياء جميعا ستنحل، فكيف يجب أن تكونوا أنتم أصحاب سلوك مقدس يتصف بالتقوى،"], [12, "منتظرين «يوم الله» الأبدي وطالبين حلوله بسرعة. ففي ذلك اليوم، تنحل السماوات ملتهبة، وتذوب العناصر محترقة."]]}, {"l": "Rev 20:11", "n": "", "vs": [[11, "ثم رأيت عرشا عظيما أبيض هربت السماء والأرض من أمام الجالس عليه، فلم يبق لهما مكان."]]}], "kwAr": "الجبال", "noteAr": ""}, {"kw": "the valleys", "raw": "Zec_14:4", "note": "", "refs": [{"l": "Zec 14:4", "n": "", "vs": [[4, "وتقف قدماه في ذلك اليوم على جبل الزيتون الممتد أمام أورشليم باتجاه الشرق، فينشق جبل الزيتون إلى شطرين من الشرق إلى الغرب عن واد عظيم جدا، فيتراجع نصف الجبل إلى الشمال، والنصف الآخر نحو الجنوب."]]}], "kwAr": "الوديان", "noteAr": ""}, {"kw": "as wax", "raw": "Psa_68:2", "note": "", "refs": [{"l": "Psa 68:2", "n": "", "vs": [[2, "كما يتلاشى الدخان تلاشيهم، وكما يذوب الشمع قرب النار يهلك الأشرار في حضرة الله."]]}], "kwAr": "كالشمع", "noteAr": ""}, {"kw": "a steep place", "raw": "Heb. a descent", "note": "Heb. a descent", "refs": [], "kwAr": "المنخفضات", "noteAr": "بالعبرية: «منحدر»."}], "arS": [["فتذوب", ["H4549"]], [" ", []], ["الجبال", ["H2022"]], [" من ", []], ["تحت", ["H8478"]], [" قدميه، ", []], ["وتتصدع", ["H1234"]], [" ", []], ["الوديان", ["H6010"]], [" ", []], ["كالشمع", ["H1749"]], [" ", []], ["أمام", ["H4480", "H6440"]], [" ", []], ["النار", ["H784"]], ["، ", []], ["كالمياه", ["H4325"]], [" ", []], ["المنصبة", ["H5064"]], [" في ", []], ["المنخفضات", ["H4174"]], [".", []]]}, {"c": 1, "v": 5, "text": "من أجل آثام يعقوب ومن أجل خطايا بيت إسرائيل. فما هو ذنب يعقوب؟ أليس هو أصنام السامرة؟ وما هي خطيئة يهوذا؟ أليست هي أوثان أورشليم؟", "groups": [{"kw": "the transgression of Jacob", "raw": "2Kings 17:7-23; 2Ch_36:14-16; Isa_50:1, Isa_50:2, Isa_59:1-15; Jer_2:17, Jer_2:19; Jer_4:18, Jer_5:25, Jer_6:19; Lam_5:16; 1Th_2:15, 1Th_2:16", "note": "", "refs": [{"l": "2Ki 17:7-23", "n": "", "vs": [[7, "وقد حلت هذه النكبة ببني إسرائيل لأنهم أثموا في حق الرب إلههم الذي أخرجهم من ديار مصر، من تحت نير فرعون وعبدوا آلهة أخرى،"], [8, "سالكين حسب فرائض الأمم الذين طردهم الرب من أمامهم، ومن أمام ملوكهم الذين نصبوهم عليهم."], [9, "وارتكب بنو إسرائيل في الخفاء معاصي في حق الرب إلههم، وشيدوا لأنفسهم مرتفعات في جميع مدنهم من برج النواطير إلى المدينة المحصنة،"], [10, "وأقاموا لأنفسهم أنصابا وتماثيل لعشتاروث على كل تل مرتفع، وتحت كل شجرة خضراء،"], [11, "وقربوا محرقات على جميع المرتفعات كسائر الأمم الذين نفاهم الرب من أمامهم، واقترفوا الموبقات لإغاظة الرب،"], [12, "عابدين الأصنام التي حذرهم ونهاهم الرب عنها."], [13, "وقد أنذر الرب إسرائيل ويهوذا عن طريق أنبيائه ورائيه قائلا: «ارجعوا عن طرقكم الأثيمة، وأطيعوا وصاياي وفرائضي بمقتضى كل الشريعة التي أوصيت آباءكم بتطبيقها، والتي أعلنتها لكم على لسان عبيدي الأنبياء."], [14, "لكنهم أصموا أذانهم وأغلظوا قلوبهم كآبائهم الذين لم يثقوا بالرب إلههم،"], [15, "وتنكروا لفرائضه وعهده الذي أبرمه مع آبائهم، وتجاهلوا تحذيراته ونواهيه لهم، وضلوا وراء أصنام باطلة، فأصبحوا هم أنفسهم باطلين، وتمثلوا بالأمم الذين حولهم، مع أن الرب أمرهم ألا يفعلوا مثلهم، وارتكبوا أمورا نهاهم الرب عنها،"], [16, "ونبذوا جميع وصايا الرب إلههم، وصنعوا لأنفسهم عجلين مسبوكين، وأقاموا تماثيل لعشتاروث وسجدوا لجميع كواكب السماء وعبدوا البعل."], [17, "وأجازوا أبناءهم وبناتهم في النار، وتعاطوا العرافة والفأل وباعوا أنفسهم لارتكاب الشر في عيني الرب لإثارة غيظه."], [18, "فاحتدم غضب الرب على إسرائيل، وطردهم من حضرته، ولم يبق سوى سبط يهوذا."], [19, "ولكن حتى سبط يهوذا لم يحفظ وصايا الرب إلهه بل نهج في طرق إسرائيل التي سلكتها."], [20, "فنبذ الرب كل ذرية إسرائيل وأذلهم وأسلمهم ليد آسريهم، وطردهم من حضرته."], [21, "لأنه شق إسرائيل عن بيت داود، فتوجوا يربعام بن نباط ملكا عليهم، فأضل يربعام بني إسرائيل عن طريق الرب واستغواهم فأخطأوا بحق الرب خطيئة عظيمة."], [22, "ولم يعدل الإسرائيليون عن ارتكاب جميع خطايا يربعام بل أمعنوا في اقترافها"], [23, "فنفى الرب إسرائيل من حضرته كما نطق على لسان جميع عبيده الأنبياء، فسبي الإسرائيليون من أرضهم إلى أشور إلى هذا اليوم."]]}, {"l": "2Ch 36:14-16", "n": "", "vs": [[14, "وأغوى معه رؤساء الكهنة والشعب الذين ازدادوا تورطا في خيانة الرب، مقترفين كل رجاسات الأمم، حتى إنهم نجسوا بيت الرب الذي قدسه في أورشليم."], [15, "وأرسل الرب إله آبائهم إليهم رسلا بصورة متوالية محذرا إياهم لأنه أشفق على شعبه وعلى مسكنه."], [16, "فكانوا يهزأون برسل الله، ورفضوا كلامه، واستهانوا بأنبيائه، حتى ثار غضب الرب على شعبه وامتنع كل شفاء!"]]}, {"l": "Isa 50:1", "n": "", "vs": [[1, "هذا ما يقوله الرب: أين كتاب طلاق أمكم الذي طلقتها به؟ لمن من دائني بعتكم؟ إنما من أجل ذنوبكم قد تم بيعكم، ومن جراء خطاياكم قد طلقت أمكم."]]}, {"l": "Isa 50:2", "n": "", "vs": [[2, "فمالي إذا حين أتيت لم أجد أحدا؟ ناديت ولا من مجيب؟ هل قصرت يدي عن الفداء؟ أم لم تعد لي طاقة على الإنقاذ؟ ها أنا بزجرتي أجفف البحر وأحول الأنهار إلى صحراء ينتن سمكها لخلوها من الماء، فيموت من العطش."]]}, {"l": "Isa 59:1-15", "n": "", "vs": [[1, "انظروا، إن ذراع الرب ليست قاصرة حتى تعجز عن أن تخلص، ولا أذنه ثقيلة حتى لا تسمع."], [2, "إنما خطاياكم أضحت تفصل بينكم وبين إلهكم، وآثامكم حجبت وجهه عنكم، فلم يسمع،"], [3, "لأن أيديكم تلوثت بالدم وأصابعكم بالإثم، ونطقت شفاهكم بالكذب، ولهجت ألسنتكم بالشر."], [4, "ليس بينكم من يطالب بالعدل، أو يحكم بالحق. يتكلون على الباطل ويتفوهون بالزور، يحبلون بالغش، ويلدون بالإثم."], [5, "يفقسون بيض أفعى، وينسجون خيوط العنكبوت. من يأكل من بيضهم يموت، ومن البيضة المكسورة تخرج حية."], [6, "لا تصلح خيوطهم لنسيج الثياب، ولا يكتسون بأعمالهم، لأن أعمالهم هي أعمال إثم، وأفعال الظلم قد ارتكبتها أيديهم."], [7, "تسرع أرجلهم لاقتراف الشر، ويهرولون لسفك دم البريء، أفكارهم أفكار أثيمة، وفي طرقهم دمار وخراب"], [8, "لم يعرفوا سبيل السلام، ولا عدل في مسالكهم. عوجوا طرقهم، والسالك فيها لا يعرف سلاما."], [9, "الحق ابتعد عنا، ولم يدركنا العدل. نرتقب نورا، فيحدق بنا الظلام، وننشد ضوءا فنسلك في العتمة."], [10, "نتحسس الحائط كالأعمى، ونتلمس كالمكفوف، نتعثر في الظهيرة كما لو كنا نسير في عتمة الليل ونكون كالأموات بين المتدفقين بالحياة"], [11, "كلنا نزمجر كالدببة، وننوح كالحمام. نبحث عن العدل فلا نجده، وعن الخلاص وإذا به قد ابتعد عنا،"], [12, "لأن معاصينا كثرت أمامك، وآثامنا تشهد علينا. فمعاصينا معنا، وذنوبنا نعرفها."], [13, "تمردنا وتنكرنا للرب. ارتددنا عن اتباع طرق إلهنا، تفوهنا بالظلم والعصيان افتراء، وبكلام زور من القلب."], [14, "قد ارتد عنا الإنصاف، ووقف العدل بعيدا، إذ سقط الحق صريعا في الشوارع، والبر لم يستطع الدخول."], [15, "أضحى الحق مفقودا، والحائد عن الشر ضحية. رأى الرب ذلك فأسخطه فقدان الإنصاف."]]}, {"l": "Jer 2:17", "n": "", "vs": [[17, "ألست أنت التي جلبت هذا الدمار على نفسك، لأنك تناسيت الرب إلهك حين قادك في الطريق؟"]]}, {"l": "Jer 2:19", "n": "", "vs": [[19, "إن شرك يقرعك، وارتدادك يؤنبك. فتبيني واعلمي أن نبذك للرب إلهك شر ومرارة، وأنك تجردت من مهابتي."]]}, {"l": "Jer 4:18", "n": "", "vs": [[18, "«طرقك وأعمالك جرت عليك هذا العقاب، هذا قصاصك وما أمره من قصاص، لأنه يخترق ذات قلبك."]]}, {"l": "Jer 5:25", "n": "", "vs": [[25, "غير أن آثامكم قد حولت عنكم هذه البركات، وخطاياكم حرمتكم من الخير."]]}, {"l": "Jer 6:19", "n": "", "vs": [[19, "اسمعي أيتها الأرض وانظري، لأني جالب شرا على هذا الشعب عقابا لهم على أفكارهم الأثيمة، لأنهم لم يطيعوا كلماتي وتنكروا لشريعتي."]]}, {"l": "Lam 5:16", "n": "", "vs": [[16, "تهاوى إكليل رأسنا، فويل لنا لأننا قد أخطأنا."]]}, {"l": "1Th 2:15", "n": "", "vs": [[15, "الذين قتلوا الرب يسوع والأنبياء واضطهدونا نحن أيضا، وهم لا يرضون الله ويعادون الناس جميعا،"]]}, {"l": "1Th 2:16", "n": "", "vs": [[16, "إذ يمنعوننا من تبشير الأمم ليخلصوا، وبذلك يستكملون خطاياهم كل حين، ولكن الغضب قد حل عليهم إلى الغاية."]]}], "kwAr": "آثام يعقوب", "noteAr": ""}, {"kw": "is it", "raw": "1Ki_13:32; Hos_7:1, Hos_8:5, Hos_8:6; Amo_6:1, Amo_8:14", "note": "", "refs": [{"l": "1Ki 13:32", "n": "", "vs": [[32, "لأن ما أنذر به من كلام الرب بشأن المذبح الذي في بيت إيل، وجميع معابد المرتفعات التي في مدن السامرة، لابد أن يتحقق»."]]}, {"l": "Hos 7:1", "n": "", "vs": [[1, "حين كنت أشفي إسرائيل، تكشفت خطيئة أفرايم، واستعلنت آثام السامرة، فقد مارسوا النفاق واقتحم اللصوص البيوت، وسلب قطاع الطرق في الخارج."]]}, {"l": "Hos 8:5", "n": "", "vs": [[5, "لشد ما أزدري عجلك أيتها السامرة، وها غضبي قد احتدم عليهم فإلى متى يظلون عاجزين عن النقاوة؟"]]}, {"l": "Hos 8:6", "n": "", "vs": [[6, "إنه صنعة عامل إسرائيلي وليس إلها، ولابد أن يصير عجل السامرة حطاما."]]}, {"l": "Amo 6:1", "n": "", "vs": [[1, "ويل للمترفين في صهيون والمطمئنين في جبل السامرة، نبلاء طليعة الأمم الذين يتوافد إليهم شعب إسرائيل."]]}, {"l": "Amo 8:14", "n": "", "vs": [[14, "أما الذين يقسمون بأوثان السامرة قائلين: حي إلهك يادان، وحي معبود بئر سبع. هؤلاء يسقطون ولا ينهضون أبدا ثانية»."]]}], "kwAr": "أليس هو", "noteAr": ""}, {"kw": "they", "raw": "2Ki_16:3, 2Ki_16:4, 2Ki_16:10-12; 2Ch_28:2-4, 2Ch_28:23-25", "note": "", "refs": [{"l": "2Ki 16:3", "n": "", "vs": [[3, "متمثلا بملوك إسرائيل، حتى إنه أجاز ابنه في النار، وفقا لأرجاس الأمم الذين طردهم الرب من أمام بني إسرائيل."]]}, {"l": "2Ki 16:4", "n": "", "vs": [[4, "وذبح وأوقد للأوثان على المرتفعات وعلى التلال وتحت كل شجرة خضراء."]]}, {"l": "2Ki 16:10-12", "n": "", "vs": [[10, "وتوجه الملك آحاز إلى دمشق للقاء تغلث فلاسر ملك أشور، فشاهد هناك المذبح، فنقل رسمه وأرسله إلى أوريا الكاهن بكامل تفاصيل صناعته."], [11, "فبنى أوريا الكاهن مذبحا بموجب الرسم الذي بعثه الملك آحاز من دمشق، وانتظر رجوع الملك من سفرته."], [12, "وعندما عاد الملك من دمشق، وشاهد المذبح"]]}, {"l": "2Ch 28:2-4", "n": "", "vs": [[2, "وسلك في طرق ملوك إسرائيل، وسبك تماثيل لعبادة البعليم."], [3, "وأوقد في وادي ابن هنوم، وأحرق أبناءه بالنار، على حسب رجاسات الأمم الذين طردهم الرب من أمام بني إسرائيل."], [4, "كما قرب محرقات وأوقد على المرتفعات والتلال، وتحت كل شجرة خضراء."]]}, {"l": "2Ch 28:23-25", "n": "", "vs": [[23, "وقدم ذبائح لأوثان الأراميين الذين هزموه قائلا: «إن آلهة ملوك أرام تساعدهم، فلأذبحن لهم فيساعدوني». إلا أنهم كانوا سببا في دماره وفي انهيار كل إسرائيل."], [24, "وجمع آحاز آنية بيت الله وحطمها وأغلق أبواب الهيكل، وبنى لنفسه مذابح في كل زاوية في أورشليم،"], [25, "وأقام في كل مدينة من مدن يهوذا مرتفعات ليوقد عليها لآلهة أخرى، فأغاظ الرب إله آبائه."]]}], "kwAr": "أليست هي", "noteAr": ""}], "arS": [["من أجل ", []], ["آثام", ["H6588"]], [" ", []], ["يعقوب", ["H3290"]], [" ومن أجل ", []], ["خطايا", ["H2403"]], [" ", []], ["بيت", ["H1004"]], [" ", []], ["إسرائيل", ["H3478"]], [". ", []], ["فما", ["H4310"]], [" هو ", []], ["ذنب", ["H6588"]], [" ", []], ["يعقوب", ["H3290"]], ["؟ ", []], ["أليس", ["H3808"]], [" هو أصنام ", []], ["السامرة", ["H8111"]], ["؟ ", []], ["وما", ["H4310"]], [" هي ", []], ["خطيئة", ["H1116"]], [" ", []], ["يهوذا", ["H3063"]], ["؟ ", []], ["أليست", ["H3808"]], [" هي أوثان ", []], ["أورشليم", ["H3389"]], ["؟", []]]}, {"c": 1, "v": 6, "text": "لذلك سأجعل السامرة كومة حجارة في الحقل ومغرسا للكروم، وأقذف بحجارتها إلى الوادي، وأعري أساساتها.", "groups": [{"kw": "I will make", "raw": "Mic_3:12; 2Ki_19:25; Isa_25:2, Isa_25:12; Jer_9:11, Jer_51:37; Hos_13:16", "note": "", "refs": [{"l": "Mic 3:12", "n": "", "vs": [[12, "لهذا من جراء أعمالكم ستحرث صهيون كالحقل وتصبح أورشليم كومة من الخرائب، وجبل الهيكل مرتفعا تنمو عليه أشجار الغاب."]]}, {"l": "2Ki 19:25", "n": "", "vs": [[25, "ألم تسمع؟ منذ زمن طويل قدرت ذلك. منذ الأيام القديمة قررته وها أنا الآن أحققه، إذ أقمتك لتدمير مدن محصنة فتحولها إلى روابي خربة."]]}, {"l": "Isa 25:2", "n": "", "vs": [[2, "حولت المدينة إلى كومة ركام، والقرية الحصينة إلى أطلال، ولن يكون قصر الغرباء مدينة بعد، ولن يبنى أبدا."]]}, {"l": "Isa 25:12", "n": "", "vs": [[12, "ويهدم أسواره الحصينة الشامخة، ويخفضها حتى تتساوى مع التراب."]]}, {"l": "Jer 9:11", "n": "", "vs": [[11, "«سأجعل أورشليم رجمة خراب، ومأوى لبنات آوى، وأحول مدن يهوذا إلى قفر مهجور»."]]}, {"l": "Jer 51:37", "n": "", "vs": [[37, "فتصير بابل ركاما ومأوى لبنات آوى، ومثار دهشة وصفير وأرضا موحشة."]]}, {"l": "Hos 13:16", "n": "", "vs": [[16, "لابد أن تتحمل السامرة وزر خطيئتها لأنها تمردت على إلهها، فيفنى أهلها بحد السيف، ويتمزق أطفالها أشلاء، وتشق بطون حواملها."]]}], "kwAr": "سأجعل", "noteAr": ""}, {"kw": "and I will pour", "raw": "Jer_51:25; Lam_4:1; Eze_13:14; Hab_3:13; Mat_24:2", "note": "", "refs": [{"l": "Jer 51:25", "n": "", "vs": [[25, "ها أنا أنقلب عليك أيها الجبل المخرب، يقول الرب. أنت تفسد كل الأرض، لذلك أمد يدي عليك وأدحرجك من بين الصخور، وأجعلك جبلا محترقا."]]}, {"l": "Lam 4:1", "n": "", "vs": [[1, "كيف اكمد الذهب واكدر لون النضار الخالص؟ كيف تبعثرت حجارة القدس في ناصية كل شارع؟"]]}, {"l": "Eze 13:14", "n": "", "vs": [[14, "فأهدم السور الذي طليتموه بماء الكلس وأسويه بالأرض فيتعرى أساسه وتتداعى المدينة وتفنون جميعا في وسطها فتدركون أني أنا الرب."]]}, {"l": "Hab 3:13", "n": "", "vs": [[13, "خرجت لخلاص شعبك، لخلاص مختارك. هشمت رؤوس زعماء البلاد الأشرار وتركتهم مطروحين عراة من العنق حتى أخمص القدم."]]}, {"l": "Mat 24:2", "n": "", "vs": [[2, "فقال لهم: «أما ترون هذه المباني كلها؟ الحق أقول لكم: لن يترك هنا حجر فوق حجر إلا ويهدم! »"]]}], "kwAr": "وأقذف", "noteAr": ""}], "arS": [["لذلك", ["H3651"]], [" ", []], ["سأجعل", ["H7760"]], [" ", []], ["السامرة", ["H8111"]], [" ", []], ["كومة", ["H5856"]], [" حجارة في ", []], ["الحقل", ["H7704"]], [" ", []], ["ومغرسا", ["H4302"]], [" ", []], ["للكروم", ["H3754"]], ["، ", []], ["وأقذف", ["H5064"]], [" ", []], ["بحجارتها", ["H68"]], [" إلى ", []], ["الوادي", ["H1516"]], ["، ", []], ["وأعري", ["H1540"]], [" ", []], ["أساساتها", ["H3247"]], [".", []]]}, {"c": 1, "v": 7, "text": "فتتحطم كل أصنامها، وتحرق كل تقدمات زن H784"]], ["، ", []], ["وأدمر", ["H7760", "H8077"]], [" ", []], ["جميع", ["H3605"]], [" ", []], ["تماثيلها", ["H6091"]], [" ", []], ["لأنها", ["H3588"]], [" ", []], ["جمعتها", ["H6908"]], [" من ", []], ["أجرة", ["H4480", "H868"]], [" ", []], ["زانية", ["H2181"]], ["، ", []], ["وإلى", ["H5704"]], [" ", []], ["زانية", ["H2181"]], [" يكون مآلها.", []]]}, {"c": 1, "v": 8, "text": "لهذا أنوح وأولول وأمشي حافيا عريانا، وأعول كبنات آوى، وأنتحب كالنعام.", "groups": [{"kw": "I will wail", "raw": "Isa_16:9, Isa_21:3, Isa_22:4; Jer_4:19, Jer_9:1, Jer_9:10,Jer_9:19, Jer_48:36-39", "note": "", "refs": [{"l": "Isa 16:9", "n": "", "vs": [[9, "لذلك أبكي كبكاء يعزير على جفنات سبمة وأرويكما بدموعي ياحشبون وياألعالة. لأن جلبة الدمار قد وقعت على حصادك وقطافك."]]}, {"l": "Isa 21:3", "n": "", "vs": [[3, "لذلك امتلأت حقواى ألما، وانتابني مخاض كمخاض الوالدة. فقدت الوعي من جراء ما سمعت، وذهلت مما رأيت"]]}, {"l": "Isa 22:4", "n": "", "vs": [[4, "لذلك أقول: «ابتعدوا عني لأبكي بمرارة، لا تتكبدوا جهدا في تعزيتي من أجل دمار ابنة شعبي،"]]}, {"l": "Jer 4:19", "n": "", "vs": [[19, "لشد ما أتعذب! لشد ما أتعذب! قلبي يتلوى ألما. فؤادي يئن في داخلي فلا أستطيع الصمت، لأني سمعت دوي البوق وصيحات القتال."]]}, {"l": "Jer 9:1", "n": "", "vs": [[1, "ياليت رأسي فيض مياه، وعيني ينبوع دموع، فأبكي نهارا وليلا قتلى بنت شعبي"]]}, {"l": "Jer 9:10", "n": "", "vs": [[10, "سأنتحب وأنوح على الجبال وأندب على مراعي البرية لأنها احترقت وأوحشت، فلا يجتاز بها عابر ولا يتردد فيها صوت القطعان، وقد هجرتها طيور السماء والوحوش."]]}, {"l": "Jer 9:19", "n": "", "vs": [[19, "ها صوت رثاء قد تجاوب في صهيون: ما أشد دمارنا، وما أعظم عارنا، لأننا قد فارقنا أرضنا، ولأنهم قد هدموا مساكننا!»"]]}, {"l": "Jer 48:36-39", "n": "", "vs": [[36, "لذلك يئن قلبي على موآب كأنين مزمار، وينوح فؤادي على رجال قير حارس كنوح الناي، فإن ثروتهم التي اكتسبوها قد تبددت."], [37, "قد أصبح كل رأس أقرع، وكل لحية محلوقة، تجرحت الأيدي وتمنطقت الأحقاء بالمسوح."], [38, "شاع النوح على سطوح موآب وفي شوارعها كلها، لأني حطمت موآب كإناء ليس لأحد رغبة فيه، يقول الرب."], [39, "لشد ما تحطمت! لشد ما يولولون: كيف أدبر موآب مجللا بالخزي؟ قد صار مثار هزء ورعب لكل من حوله»."]]}], "kwAr": "أنوح", "noteAr": ""}, {"kw": "I will go", "raw": "Isa_20:2-4", "note": "", "refs": [{"l": "Isa 20:2-4", "n": "", "vs": [[2, "تكلم الرب على لسان إشعياء بن آموص قائلا: «اذهب واخلع المسوح عن حقويك، وانزع حذاءك من قدميك». ففعل كذلك ومشى عاريا حافيا."], [3, "وقال الرب: «كما مشى عبدي إشعياء عاريا حافيا لمدة ثلاث سنوات علامة وآية على المصائب التي سأنزلها بمصر وكوش،"], [4, "هكذا يقود ملك أشور أسرى مصر وكوش صغارا وكبارا، عراة حفاة بأقفية مكشوفة، عارا لمصر."]]}], "kwAr": "وأمشي", "noteAr": ""}, {"kw": "a wailing", "raw": "Job_30:29; Psa_102:6", "note": "", "refs": [{"l": "Job 30:29", "n": "", "vs": [[29, "صرت أخا لبنات آوى، ورفيقا للنعام."]]}, {"l": "Psa 102:6", "n": "", "vs": [[6, "صرت أشبه ببجع البراري، ومثل بومة الخرائب."]]}], "kwAr": "وأعول", "noteAr": ""}, {"kw": "owls", "raw": "Heb. daughters of the owl", "note": "Heb. daughters of the owl", "refs": [], "kwAr": "كالنعام", "noteAr": "بالعبرية: «بنات النعامة»."}], "arS": [["لهذا", ["H5921", "H2063"]], [" ", []], ["أنوح", ["H5594"]], [" ", []], ["وأولول", ["H3213"]], [" ", []], ["وأمشي", ["H1980"]], [" ", []], ["حافيا", ["H7758"]], [" ", []], ["عريانا", ["H6174"]], ["، ", []], ["وأعول", ["H6213", "H4553"]], [" ", []], ["كبنات آوى", ["H8568"]], ["، ", []], ["وأنتحب", ["H60"]], [" ", []], ["كالنعام", ["H1323", "H3284"]], [".", []]]}, {"c": 1, "v": 9, "text": "لأن جروح السامرة لن تندمل، وهي لابد أن تصيب يهوذا، ها هي قد بلغت أبواب شعبي أهل أورشليم.", "groups": [{"kw": "her wound is incurable", "raw": "or, she is grievously sick of her wounds, Isa_1:5, Isa_1:6; Jer_15:18, Jer_30:11-15", "note": "or, she is grievously sick of her wounds, Isa_1:5, Isa_1:6; Jer_15:18, Jer_30:11-15", "refs": [{"l": "Isa 1:5", "n": "", "vs": [[5, "على أي موضع أضربكم بعد؟ لماذا تواظبون على التمرد؟ إن الرأس بجملته سقيم والقلب بكامله مريض."]]}, {"l": "Isa 1:6", "n": "", "vs": [[6, "من أخمص القدم إلى قمة الرأس ليس فيه عافية. كله جروح وأحباط وقروح لم تنظف، ولم تضمد، ولم تلين بالزيت."]]}, {"l": "Jer 15:18", "n": "", "vs": [[18, "لماذا لا ينقطع ألمي، وجرحي لا يشفى، ويأبى الالتئام؟ أتكون لي كجدول كاذب أو مياه سريعة النضوب؟"]]}, {"l": "Jer 30:11-15", "n": "", "vs": [[11, "لأني معك لأخلصك، يقول الرب، فأبيد جميع الأمم التي شتتك بينها. أما أنت فلن أفنيك بل أؤدبك بالحق ولا أبرئك تبرئة كاملة»."], [12, "لأن هذا ما يعلنه الرب: «إن جرحك لا شفاء له وضربتك لا علاج لها."], [13, "إذ لا يوجد من يدافع عن دعواك، ولا عقار لجرحك، ولا دواء لك."], [14, "قد نسيك محبوك، وأهملوك إهمالا، لأني ضربتك كما يضرب عدو، وعاقبتك عقاب مبغض قاس، لأن إثمك عظيم وخطاياك متكاثرة."], [15, "لماذا تنوحين من ضربتك؟ إن جرحك مستعص من جراء إثمك العظيم وخطاياك المتكاثرة، لهذا أوقعت بك المحن."]]}], "kwAr": "جروح السامرة لن تندمل", "noteAr": "أو: «هي مريضة بجراحها مرضا شديدا». انظر إش 1: 5، 6؛ إر 15: 18؛ 30: 11-15"}, {"kw": "it", "raw": "2Ki_18:9-13; Isa_8:7, Isa_8:8", "note": "", "refs": [{"l": "2Ki 18:9-13", "n": "", "vs": [[9, "وفي السنة الرابعة لحكم الملك حزقيا، الموافقة للسنة السابعة لاعتلاء هوشع بن أيلة عرش إسرائيل، زحف شلمنأسر ملك أشور على السامرة وحاصرها،"], [10, "وتمكن من الاستيلاء عليها في نهاية ثلاث سنوات، أي في السنة السادسة لملك حزقيا، الموافقة للسنة التاسعة لحكم هوشع ملك إسرائيل."], [11, "وسبى ملك أشور سكان إسرائيل إلى أشور، وأسكنهم في مدينة حلح وعلى ضفاف نهر خابور في منطقة جوزان وفي مدن مادي،"], [12, "لأنهم أبوا الاستماع لصوت الرب إلههم، ونكثوا عهده وكل ما أمر به موسى عبد الرب، ولم يعملوا بها."], [13, "وفي السنة الرابعة عشرة من حكم الملك حزقيا اجتاح سنحاريب ملك أشور جميع مدن يهوذا الحصينة واستولى عليها."]]}, {"l": "Isa 8:7", "n": "", "vs": [[7, "فإن الرب مزمع أن يغرقهم بمياه النهر الفياضة، أي ملك أشور بكل جبروته، فيكون (كنهر الفرات) يطغى جيشانه على أقنيته ويفيض على ضفافه"]]}, {"l": "Isa 8:8", "n": "", "vs": [[8, "فيكتسح أرض يهوذا، ويطفو مرتفعا إلى الأعناق، وتنتشر جيوشه في عرض أرضك ياعمانوئيل»."]]}], "kwAr": "لابد أن تصيب يهوذا", "noteAr": ""}, {"kw": "he", "raw": "Mic_1:12; 2Chr. 32:1-23; Isa_10:28-32, Isa_37:22-36", "note": "", "refs": [{"l": "Mic 1:12", "n": "", "vs": [[12, "لشد ما انتظر أهل ماروث الخير، غير أن الشر قد أقبل على باب أورشليم من عند الرب."]]}, {"l": "2Ch 32:1-23", "n": "", "vs": [[1, "وبعد كل ما قام به حزقيا بأمانة، زحف سنحاريب على أرض يهوذا ودخلها، وحاصر المدن الحصينة طمعا في الاستيلاء عليها."], [2, "وعندما رأى حزقيا أن سنحاريب قد وطد العزم على محاربة أورشليم،"], [3, "تداول في الأمر مع رؤساء جيشه وزعماء البلاد، واتفقوا على ردم مياه العيون القائمة خارج المدينة، فأعانوه."], [4, "وتجمع جمهور غفير، ردموا جميع الينابيع والنهر الجاري في وسط الأرض قائلين: «لماذا يأتي ملوك أشور ويجدون مياها غزيرة؟»"], [5, "وتشجع ورمم السور المنهدم، وعززه بالأبراج المرتفعة، وبنى سورا آخر خارجه، وحصن قلعة مدينة داود، وصنع أسلحة كثيرة وأتراسا."], [6, "وعبأ كل شعب المدينة تحت قيادة ضباط الجيش، واستدعاهم إلى ساحة باب المدينة ليبث فيهم الشجاعة قائلا لهم:"], [7, "«تقووا وتشجعوا، لا تجزعوا ولا ترتعبوا من ملك أشور ولا من كل الجيش الذي معه، لأن الذي معنا أكثر من الذي معه."], [8, "فمعه قوى بشرية، ومعنا الرب إلهنا لينجدنا ويحارب حروبنا». فبث كلام حزقيا الشجاعة في قلوب الشعب."], [9, "وفيما كان سنحاريب وجيشه يحاصرون لخيش، أرسل رجاله إلى أورشليم إلى حزقيا ملك يهوذا وإلى أهل أورشليم قائلين:"], [10, "«هذا ما يقوله سنحاريب ملك أشور: على ماذا تتكلون فتقيموا في أورشليم تحت الحصار؟"], [11, "ألا يغويكم حزقيا لكي تموتوا جوعا وعطشا، عندما يقول لكم: الرب إلهنا ينقذنا من يد ملك أشور؟"], [12, "أليس حزقيا هو الذي أزال مرتفعاته ومذابحه، وأمر يهوذا وأورشليم قائلا: أمام مذبح واحد تسجدون وعليه توقدون؟"], [13, "أما تعرفون ما أجريته أنا وآبائي على جميع أمم الأراضي، فهل استطاعت آلهتها أن تنقذ أرضها من يدي؟"], [14, "من من بين جميع آلهة هؤلاء الأمم الذين دمرهم آبائي استطاع أن ينقذ شعبه مني؟ فكيف يستطيع إلهكم أن ينقذكم من يدي؟"], [15, "لذلك لا يخدعنكم حزقيا ولا يغوينكم. لا تصدقوه لأنه لم يقدر إله أي أمة أو مملكة أن ينجي شعبه من يدي ومن يد آبائي، فكيف يمكن لإلهكم أن ينجيكم؟»"], [16, "وأكثر الضباط الأشوريون من التهجم على الرب وعلى عبده حزقيا."], [17, "وكتب الملك الأشوري رسائل عير فيها الرب إله إسرائيل، جاء فيها: «كما أن آلهة أمم الأرض عجزت عن إنقاذ شعوبها من يدي، كذلك لا ينقذ إله حزقيا شعبه من يدي»."], [18, "وهتف رجال سنحاريب باليهودية مخاطبين أهل أورشليم الواقفين على السور، ليوقعوا فيهم الرعب والخوف، تمهيدا للاستيلاء على المدينة،"], [19, "وكان تهجمهم على الرب إله أورشليم مماثلا لتهجمهم على أصنام الشعوب الأخرى التي صنعتها أيدي الناس."], [20, "فصلى حزقيا الملك وإشعياء بن آموص النبي، واستغاثا بالسماء من جراء ذلك،"], [21, "فأرسل الرب ملاكا فأباد كل بطل صنديد ورئيس وقائد في معسكر ملك أشور، فرجع إلى أرضه مخذولا. وعندما دخل معبد إلهه اغتاله هناك أولاده بالسيف"], [22, "وهكذا أنقذ الرب حزقيا وسكان أورشليم من سنحاريب ملك أشور ومن أيدي سواه من الأعداء، ووقاهم من كل ناحية."], [23, "وشرع كثيرون يأتون بتقدمات للرب إلى أورشليم، ويحملون تحفا لحزقيا ملك يهوذا، وارتفعت مكانته في أعين جميع الأمم بعد ذلك."]]}, {"l": "Isa 10:28-32", "n": "", "vs": [[28, "ها هو جيش أشور مقبل؛ قد وصل إلى عياث، واجتاز بمجرون. وضع مؤونته في مخماش."], [29, "قطعوا المعبر، وباتوا في جبع. ارتعد أهل الرامة، وهرب سكان جبعة شاول."], [30, "اصرخي يابنت جليم، واسمعي ياليشة، وأجيبي يامدينة عناثوث."], [31, "هرب أهل مدمنة. فر سكان جيبيم طلبا للنجاة."], [32, "اليوم يتوقف في نوب ويهز قبضته على جبل بنت صهيون، أكمة أورشليم."]]}, {"l": "Isa 37:22-36", "n": "", "vs": [[22, "وهذا هو رد الرب عليه: ها العذراء ابنة صهيون قد احتقرتك واستهزأت بك، وهزت ابنة أورشليم رأسها سخرية منك."], [23, "من عيرت وجدفت؟ وعلى من رفعت صوتك وشمخت بعينيك زهوا؟ أعلى قدوس إسرائيل؟"], [24, "لقد عيرت السيد على لسان رسلك، وقلت: بكثرة مركباتي قد صعدت إلى أعالي الجبال، وبلغت أقاصي لبنان قاطعا أطول أرزه وخيار سروه واخترقت أبعد ربوعه وأفضل غاباته."], [25, "قد حفرت آبارا وشربت مياها، وبباطن قدمي جففت جميع خلجان مصر."], [26, "ألم تسمع؟ منذ زمن طويل قد قدرت ذلك. منذ الأيام القديمة قررته وها أنا الآن أحققه، إذ أقمتك لتدمير مدن محصنة فتحولها إلى روابي خربة."], [27, "خارت قوى أهلها فأصبحوا مرتاعين خجلين، صاروا كعشب الحقل، كالنبات الأخضر وكحشيش السطوح الذاوي قبل نموه."], [28, "ولكني مطلع على حركاتك وسكناتك وهيجانك علي."], [29, "ولأن ثورتك علي وعجرفتك قد بلغتا مسامعي، فإني سأشكمك بخزامتي في أنفك، وأضع لجامي في فمك، وأعيدك في نفس الطريق الذي أقبلت منه."], [30, "وهذه علامة لك ياحزقيا: في هذه السنة تأكلون مما ينبت من نفسه، وفي السنة التالية تأكلون مما ينبت عنه وأما في السنة الثالثة فتزرعون فيها وتحصدون وتغرسون كروما وتجنون ثمارها."], [31, "ويعود الناجون الباقون من بيت يهوذا فتتأصل جذورهم في الأرض ويزدهرون ويتكاثرون."], [32, "لأن من أورشليم تخرج بقية ومن جبل صهيون يأتي الناجون فغيرة الرب القدير تصنع هذا."], [33, "لذلك، فهذا ما يقوله الرب عن ملك أشور: «لن يدخل هذه المدينة ولن يطلق عليها سهما أو يتقدم نحوها بترس ولا يقيم عليها مقلاعا."], [34, "بل يرجع في الطريق الذي جاء منه ولن يدخل هذه المدينة، يقول الرب."], [35, "لأنني أدافع عنها وأنقذها من أجل نفسي وإكراما لداود عبدي»."], [36, "وحدث في تلك الليلة أن ملاك الرب قتل مئة وخمسة وثمانين ألفا من جيش الأشوريين، وما إن طلع الصباح حتى كانت جثث القتلى تملأ المكان"]]}], "kwAr": "بلغت", "noteAr": ""}], "arS": [["لأن", ["H3588"]], [" ", []], ["جروح", ["H4347"]], [" السامرة لن ", []], ["تندمل", ["H605"]], ["، وهي ", []], ["لابد", ["H3588"]], [" أن ", []], ["تصيب", ["H935"]], [" ", []], ["يهوذا", ["H3063"]], ["، ها هي قد ", []], ["بلغت", ["H5060"]], [" ", []], ["أبواب", ["H8179"]], [" ", []], ["شعبي", ["H5971"]], [" أهل ", []], ["أورشليم", ["H3389"]], [".", []]]}, {"c": 1, "v": 10, "text": "لا تخبروا في جت، ولا تبكوا في عكاء. عفروا أنفسكم بالتراب في بيت عفرة.", "groups": [{"kw": "Declare", "raw": "2Sa_1:20; Amo_5:13, Amo_6:10", "note": "", "refs": [{"l": "2Sa 1:20", "n": "", "vs": [[20, "لا تخبروا في جت، ولا تبشروا في شوارع أشقلون، لئلا تفرح بنات الفلسطينيين، لئلا تشمت بنات الغلف."]]}, {"l": "Amo 5:13", "n": "", "vs": [[13, "لهذا يصمت العاقل في مثل هذا الزمان الرديء."]]}, {"l": "Amo 6:10", "n": "", "vs": [[10, "وعندما يقبل عم الميت المشرف على إحراق الجثث ليخرج عظامه من البيت، ويسأل من هو مختبيء في أقصى المنزل: أما بقي واحد معك؟ فيجيب: لا، ثم يضيف: اصمت ولا تذكر اسم الرب."]]}], "kwAr": "لا تخبروا", "noteAr": ""}, {"kw": "Aphrah", "raw": "i.e. dust, Jos_18:23, Ophrah", "note": "i.e. dust, Jos_18:23, Ophrah", "refs": [{"l": "Jos 18:23", "n": "", ully", "raw": "or, was grieved, 1Sa_4:13; Job_30:26; Isa_59:9-11; Jer_8:15, Jer_14:19", "note": "or, was grieved, 1Sa_4:13; Job_30:26; Isa_59:9-11; Jer_8:15, Jer_14:19", "refs": [{"l": "1Sa 4:13", "n": "", "vs": [[13, "وكان عالي حينذاك جالسا على كرسي إلى جوار الطريق يراقب، لأن قلبه كان مضطربا على مصير تابوت الله. وما إن دخل الرجل المدينة وأذاع النبأ حتى ضجت المدينة كلها بالصراخ."]]}, {"l": "Job 30:26", "n": "", "vs": [[26, "ولكن حين ترقبت الخير أقبل الشر، وحين توقعت النور هجم الظلام."]]}, {"l": "Isa 59:9-11", "n": "", "vs": [[9, "الحق ابتعد عنا، ولم يدركنا العدل. نرتقب نورا، فيحدق بنا الظلام، وننشد ضوءا فنسلك في العتمة."], [10, "نتحسس الحائط كالأعمى، ونتلمس كالمكفوف، نتعثر في الظهيرة كما لو كنا نسير في عتمة الليل ونكون كالأموات بين المتدفقين بالحياة"], [11, "كلنا نزمجر كالدببة، وننوح كالحمام. نبحث عن العدل فلا نجده، وعن الخلاص وإذا به قد ابتعد عنا،"]]}, {"l": "Jer 8:15", "n": "", "vs": [[15, "طلبنا السلام فلم يسفر عن خير. نشدنا وقتا للمداواة فابتلينا بالأهوال."]]}, {"l": "Jer 14:19", "n": "", "vs": [[19, "هل تنكرت ليهوذا كل التنكر؟ وهل كرهت نفسك صهيون؟ ما بالك قد ابتليتنا بضربة لا شفاء منها؟ وقد طلبنا السلام فلم نحظ بالخير. رجونا وقت الشفاء وإذا بنا نلقى الرعب."]]}], "kwAr": "انتظر", "noteAr": "أو: «حزنت». انظر 1صم 4: 13؛ أي 30: 26؛ إش 59: 9-11؛ إر 8: 15؛ 14: 19"}, {"kw": "but", "raw": "Mic_1:9; Isa_45:7; Amo_3:6", "note": "", "refs": [{"l": "Mic 1:9", "n": "", "vs": [[9, "لأن جروح السامرة لن تندمل، وهي لابد أن تصيب يهوذا، ها هي قد بلغت أبواب شعبي أهل أورشليم."]]}, {"l": "Isa 45:7", "n": "", "vs": [[7, "أنا مبدع النور وخالق الظلمة، أنا صانع الخير وخالق الضر، أنا هو الرب فاعل كل هذه."]]}, {"l": "Amo 3:6", "n": "", "vs": [[6, "أيدوي بوق في المدينة ولا يعتري الشعب الخوف؟ أيقع بلاء في المدينة ما لم يكن الرب قد أرسله؟"]]}], "kwAr": "غير أن", "noteAr": ""}], "arS": [["لشد", ["H3588"]], [" ما ", []], ["انتظر", ["H2470"]], [" ", []], ["أهل", ["H3427"]], [" ", []], ["ماروث", ["H4796"]], [" ", []], ["الخير", ["H2896"]], ["، ", []], ["غير", ["H3588"]], [" أن ", []], ["الشر", [
