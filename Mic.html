m 9:20", "n": "", "vs": [[20, "فأقول: من أنت أيها الإنسان حتى ترد جوابا على الله؟ أيقول الشيء المصنوع لصانعه: لماذا صنعتني هكذا؟"]]}, {"l": "1Co 7:16", "n": "", "vs": [[16, "فكيف تعلمين، أيتها الزوجة، ما إذا كان زوجك سيخلص على يدك؟ أو كيف تعلم، أيها الزوج، ما إذا كانت زوجتك ستخلص على يدك؟"]]}, {"l": "Jam 2:20", "n": "", "vs": [[20, "وهذا يؤكد لك، أيها الإنسان الغبي، أن الإيمان الذي لا تنتج عنه أعمال هو إيمان ميت!"]]}], "kwAr": "أيها الإنسان", "noteAr": ""}, {"kw": "what is", "raw": "1Sa_12:23; Neh_9:13; Psa_73:28; Lam_3:26; Luk_10:42; Rom_7:16; 2Th_2:16", "note": "", "refs": [{"l": "1Sa 12:23", "n": "", "vs": [[23, "وأما أنا فحاشا لي أن أخطىء إلى الرب، فأكف عن الصلاة من أجلكم، بل أواظب على تعليمكم الطريق الصالح المستقيم."]]}, {"l": "Neh 9:13", "n": "", "vs": [[13, "ونزلت على جبل سيناء وخاطبتهم من السماء، وأعطيتهم أحكاما مستقيمة وشرائع صادقة وفرائض ووصايا صالحة،"]]}, {"l": "Psa 73:28", "n": "", "vs": [[28, "أما أنا فخير لي أن أقترب إلى الله، لأني على السيد توكلت، لأحدث بجميع عجائبك."]]}, {"l": "Lam 3:26", "n": "", "vs": [[26, "خير للمرء أن ينتظر بصمت خلاص الرب."]]}, {"l": "Luk 10:42", "n": "", "vs": [[42, "ولكن الحاجة هي إلى واحد، ومريم قد اختارت النصيب الصالح الذي لن يؤخذ منها! »"]]}, {"l": "Rom 7:16", "n": "", "vs": [[16, "فما دمت أعمل ما لا أريده، فإني أصادق على صواب الشريعة."]]}, {"l": "2Th 2:16", "n": "", "vs": [[16, "وليت ربنا يسوع المسيح نفسه، والله أبانا، الذي أحبنا ووهبنا بنعمته راحة أبدية ورجاء صالحا،"]]}], "kwAr": "ما هو", "noteAr": ""}, {"kw": "and what", "raw": "Deu_10:12, Deu_10:13", "note": "", "refs": [{"l": "Deu 10:12", "n": "", "vs": [[12, "فالآن أيها الإسرائيليون ماذا يطلب منكم الرب إلهكم سوى أن تتقوه وتسلكوا في كل طرقه، وتحبوه وتعبدوه من كل قلوبكم ومن كل نفوسكم،"]]}, {"l": "Deu 10:13", "n": "", "vs": [[13, "وتطيعوا وصاياه وفرائضه، التي أنا أوصيكم بها اليوم لخيركم؟"]]}], "kwAr": "وماذا", "noteAr": ""}, {"kw": "to do", "raw": "Gen_18:19; 1Sa_15:22; Pro_21:3; Ecc_12:13; Isa_1:16-19, Isa_58:6-11; Jer_7:3-6; Hos_6:6, Hos_12:6; Amo_5:24; Zep_2:3; Mat_3:8-10; Mar_12:30-34; Luk_11:42; Tit_2:11, Tit_2:12; 2Pe_1:5-8", "note": "", "refs": [{"l": "Gen 18:19", "n": "", "vs": [[19, "لأنني قد اخترته ليوصي بنيه وأهل بيته من بعده كي يحفظوا طريق الرب، عاملين البر والعدل، حتى ينجز الرب ما وعد به إبراهيم»."]]}, {"l": "1Sa 15:22", "n": "", "vs": [[22, "فقال صموئيل: «هل يسر الرب بالذبائح والمحرقات كسروره بالاستماع إلى صوته؟ إن الاستماع أفضل من الذبيحة، والإصغاء أفضل من شحم الكباش."]]}, {"l": "Pro 21:3", "n": "", "vs": [[3, "إجراء العدل والحق أكثر قبولا عند الرب من الذبيحة."]]}, {"l": "Ecc 12:13", "n": "", "vs": [[13, "فلنسمع ختام الكلام كله: اتق الله ، واحفظ وصاياه، لأن هذا هو كل واجب الإنسان،"]]}, {"l": "Isa 1:16-19", "n": "", "vs": [[16, "اغتسلوا، تطهروا، أزيلوا شر أعمالكم من أمام عيني. كفوا عن اقتراف الإثم،"], [17, "وتعلموا الإحسان، انشدوا الحق، انصفوا المظلوم، اقضوا لليتيم، ودافعوا عن الأرملة."], [18, "تعالوا نتحاجج يقول الرب، إن كانت خطاياكم كلطخات قرمزية فإنها تبيض كالثلج، وإن كانت حمراء كصبغ الدودي تصبح في نقاء الصوف!"], [19, "إن شئتم وأطعتم تتمتعون بخيرات الأرض،"]]}, {"l": "Isa 58:6-11", "n": "", "vs": [[6, "أليس الصوم الذي أختاره يكون في فك قيود الشر، وحل عقد النير، وإطلاق سراح المتضايقين، وتحطيم كل نير؟"], [7, "ألا يكون في مشاطرة خبزك مع الجائع، وإيواء الفقير المتشرد في بيتك. وكسوة العريان الذي تلتقيه، وعدم التغاضي عن قريبك البائس؟"], [8, "عندئذ يشع نورك كالصباح، وتزهر عافيتك سريعا، ويتقدمك برك، ويحرس مجد الرب مؤخرة ساقتك."], [9, "عندئذ تدعو فيستجيب الرب. تستغيث فيقول ها أنا. إن أزلت من وسط بيتك النير، والإيماء بالأصبع احتقارا، والنطق بالشر،"], [10, "إن بذلت نفسك للجائع، وأشبعت حاجة الذليل، فإن نورك يشرق في الظلمة، وليلك الدامس يصبح كالظهر،"], [11, "ويهديك الرب دائما ويسد حاجتك حتى في زمن القحط والأرض المجدبة، فيقوي عظامك فتصبح كروضة مروية، وكجدول ماء لا ينقطع،"]]}, {"l": "Jer 7:3-6", "n": "", "vs": [[3, "هذ ما يعلنه الرب القدير إله إسرائيل: قوموا طرقكم وأعمالكم فأسكنكم في هذا الموضع."], [4, "لا تتكلوا على أقوال الكذب قائلين: هذا هيكل الرب: هذا هيكل الرب"], [5, "لكن إن قومتم حقا طرقكم وأعمالكم، وأجريتم قضاء عادلا فيما بينكم،"], [6, "إن لم تجوروا على الغريب واليتيم والأرملة، ولم تسفكوا دما بريئا في هذا الموضع، وإن لم تضلوا وراء الأوثان مسيئين بذلك لأنفسكم،"]]}, {"l": "Hos 6:6", "n": "", "vs": [[6, "إني أطلب رحمة لا ذبيحة، ومعرفتي أكثر من المحرقات."]]}, {"l": "Hos 12:6", "n": "", "vs": [[6, "أما أنتم فارجعوا إلى إلهكم تائبين. تمسكوا برحمته وعدله، وداوموا على الا تكال عليه."]]}, {"l": "Amo 5:24", "n": "", "vs": [[24, "إنما ليجر الحق متدفقا كالمياه والعدل كنهر سيال."]]}, {"l": "Zep 2:3", "n": "", "vs": [[3, "التمسوا الرب ياودعاء الأرض الراضخين لحكمه. اطلبوا البر والتواضع لعلكم تجدون ملاذا في يوم سخط الرب."]]}, {"l": "Mat 3:8-10", "n": "", "vs": [[8, "فأثمروا ثمرا يليق بالتوبة."], [9, "ولا تعللوا أنفسكم قائلين: لنا إبراهيم أبا! فإني أقول لكم: إن الله قادر أن يطلع من هذه الحجارة أولادا لإبراهيم."], [10, "وها إن الفأس قد ألقيت على أصل الشجر، فكل شجرة لا تثمر ثمرا جيدا تقطع وتطرح في النار."]]}, {"l": "Mar 12:30-34", "n": "", "vs": [[30, "فأحب الرب إلهك بكل قلبك وبكل نفسك وبكل فكرك وبكل قوتك. هذه هي الوصية الأولى."], [31, "وهناك ثانية مثلها، وهي أن تحب قريبك كنفسك. فما من وصية أخرى أعظم من هاتين»."], [32, "فقال له الكاتب: «صحيح، يامعلم! حسب الحق تكلمت. فإن الله واحد وليس آخر سواه."], [33, "ومحبته بكل القلب وبكل الفهم وبكل القوة، ومحبة القريب كالنفس، أفضل من جميع المحرقات والذبائح!»"], [34, "فلما رأى يسوع أنه أجاب بحكمة، قال له: «لست بعيدا عن ملكوت الله!» ولم يجرؤ أحد بعد ذلك أن يوجه إليه أي سؤال."]]}, {"l": "Luk 11:42", "n": "", "vs": [[42, "ولكن الويل لكم أيها الفريسيون فإنكم تدفعون عشر النعنع والسذاب والبقول الأخرى، وتتجاوزون عن العدل ومحبة الله: كان يجب أن تعملوا هذا ولا تهملوا ذاك!"]]}, {"l": "Tit 2:11", "n": "", "vs": [[11, "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت."]]}, {"l": "Tit 2:12", "n": "", "vs": [[12, "وهي تعلمنا أن نقطع علاقتنا بالإباحية والشهوات العالمية، وأن نحيا في العصر الحاضر حياة التعقل والبر والتقوى،"]]}, {"l": "2Pe 1:5-8", "n": "", "vs": [[5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"], [6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"], [7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."], [8, "فحين تكون هذه الصفات الطيبة في داخلكم، وتزداد بوفرة، تجعلكم مجتهدين ومثمرين في معرفتكم لربنا يسوع المسيح."]]}], "kwAr": "تتوخى", "noteAr": ""}, {"kw": "love", "raw": "Psa_37:26, Psa_112:4, Psa_112:9; Isa_57:1, Isa_57:2; Mat_5:7, Mat_18:32-35; Luk_6:36; Eph_4:32; Col_3:12; 1Pe_3:8", "note": "", "refs": [{"l": "Psa 37:26", "n": "", "vs": [[26, "يترَأف اليوم كله، ويقرض الآخرين. وتكون ذريته بركة لغيرهم."]]}, {"l": "Psa 112:4", "n": "", "vs": [[4, "يشرق نور في الظلمة للمستقيمين لأن الرب حنان ورحيم وصديق."]]}, {"l": "Psa 112:9", "n": "", "vs": [[9, "يوزع بسخاء ويعطي الفقراء، وبره يدوم إلى الأبد، فيرتفع رأسه باعتزاز."]]}, {"l": "Isa 57:1", "n": "", "vs": [[1, "هلك الصديق فلم يتأمل أحد في نفسه ويعتبر، ومات الأتقياء ولم يدرك أحد أن الصديق قد أخذ تفاديا للكارثة."]]}, {"l": "Isa 57:2", "n": "", "vs": [[2, "والسالكون بالاستقامة ينعمون بالسلام، وفي مضاجعهم يستريحون."]]}, {"l": "Mat 5:7", "n": "", "vs": [[7, "طوبى للرحماء، فإنهم سيرحمون."]]}, {"l": "Mat 18:32-35", "n": "", "vs": [[32, "فاستدعاه سيده وقال له: أيها العبد الشرير، ذلك الدين كله سامحتك به لأنك توسلت إلي."], [33, "أفما كان يجب أن ترحم زميلك العبد كما رحمتك أنا؟"], [34, "وإذ ثار غضب سيده عليه، دفعه إلى الجلادين ليعذبوه حتى يوفي كل ما عليه."], [35, "هكذا يفعل بكم أبي السماوي إن لم يغفر كل منكم لأخيه من قلبه! »"]]}, {"l": "Luk 6:36", "n": "", "vs": [[36, "فكونوا أنتم رحماء، كما أن أباكم رحيم."]]}, {"l": "Eph 4:32", "n": "", "vs": [[32, "وكونوا لطفاء بعضكم نحو بعض، شفوقين، مسامحين بعضكم بعضا كما سامحكم الله في المسيح."]]}, {"l": "Col 3:12", "n": "", "vs": [[12, "فباعتباركم جماعة مختارة من الله، قديسين محبوبين، البسوا دائما عواطف الحنان واللطف والتواضع والوداعة وطول البال،"]]}, {"l": "1Pe 3:8", "n": "", "vs": [[8, "والخلاصة، كونوا جميعا متحدين في الرأي، متعاطفين بعضكم مع بعض، مبادلين أحدكم الآخر المحبة الأخوية، شفوقين، متواضعين."]]}], "kwAr": "وتحب", "noteAr": ""}, {"kw": "walk humbly", "raw": "Heb. humble thyself to walk, Gen_5:22; Lev_26:41; 2Ch_30:11, 2Ch_32:26, 2Ch_33:12, 2Ch_33:13, 2Ch_33:19, 2Ch_33:23, 2Ch_34:27; Isa_57:15, Isa_66:2; Eze_16:63; Dan_4:37; Mat_5:3; Luk_18:13-17; Rom_10:1-3; Jam_4:6-10; 1Pe_5:5, 1Pe_5:6", "note": "Heb. humble thyself to walk, Gen_5:22; Lev_26:41; 2Ch_30:11, 2Ch_32:26, 2Ch_33:12, 2Ch_33:13, 2Ch_33:19, 2Ch_33:23, 2Ch_34:27; Isa_57:15, Isa_66:2; Eze_16:63; Dan_4:37; Mat_5:3; Luk_18:13-17; Rom_10:1-3; Jam_4:6-10; 1Pe_5:5, 1Pe_5:6", "refs": [{"l": "Gen 5:22", "n": "", "vs": [[22, "ثم عاش أخنوخ بعد ذلك ثلاث مئة سنة سار فيها مع الله. وولد له بنون وبنات."]]}, {"l": "Lev 26:41", "n": "", "vs": [[41, "التي جعلتني أنقلب عليهم وأنفيهم إلى أرض أعدائهم، وإن خضعت قلوبهم النجسة بعد أن استوفوا عقاب خطاياهم،"]]}, {"l": "2Ch 30:11", "n": "", "vs": [[11, "باستثناء قلة من أسباط أشير ومنسى وزبولون ممن تواضعوا وقدموا إلى أورشليم."]]}, {"l": "2Ch 32:26", "n": "", "vs": [[26, "ثم اتضع حزقيا بعد كبريائه، هو وأهل أورشليم، فلم يحل بهم غضب الرب في أيام حزقيا."]]}, {"l": "2Ch 33:12", "n": "", "vs": [[12, "وفي ضيقه استغاث بالرب إلهه وتذلل جدا أمام إله آبائه،"]]}, {"l": "2Ch 33:13", "n": "", "vs": [[13, "وابتهل إليه فاستجاب له، وسمع تضرعه ورده إلى أورشليم وإلى مملكته. فعلم منسى أن الرب هو الله ."]]}, {"l": "2Ch 33:19", "n": "", "vs": [[19, "كما أن صلاته واستجابة الرب له، وسائر خطاياه وخيانته، والأماكن التي شيد فيها المرتفعات ونصب فيها تماثيل عشتاروث، والأصنام التي أقامها قبل تذلله فهي مدونة في أخبار الأنبياء."]]}, {"l": "2Ch 33:23", "n": "", "vs": [[23, "إلا أنه لم يتذلل أمام الرب كما تذلل أبوه منسى، بل ازداد شرا."]]}, {"l": "2Ch 34:27", "n": "", "vs": [[27, "من حيث أن قلبك قد رق، وتذللت أمام الله لدى سماعك ما قضت به الشريعة على هذا الموضع وعلى أهله، وتواضعت أمامي ومزقت ثيابك وبكيت في حضرتي، فإنني قد استجبت لك أنا أيضا، يقول الرب."]]}, {"l": "Isa 57:15", "n": "", "vs": [[15, "لأنه هكذا يقول العلي السامي، المقيم في الأبد، الذي يدعى اسمه القدوس: إنني أسكن في العلى وفي الموضع المقدس، وأقيم مع المنسحق، وذوي الروح المتواضعة، لأحيي أرواح المتواضعين، وأنعش قلوب المنسحقين."]]}, {"l": "Isa 66:2", "n": "", "vs": [[2, "جميع هذه صنعتها يدي فوجدت كلها، لكنني أسر بالرجل المتواضع المنسحق الروح الذي يرتعد من كلمتي."]]}, {"l": "Eze 16:63", "n": "", "vs": [[63, "لكي تتذكري فتخجلي ولا تفتحي فمك من بعد بسبب خزيك، حين أغفر لك كل ما ارتكبت من شر يقول السيد الرب»."]]}, {"l": "Dan 4:37", "n": "", "vs": [[37, "فالآن، أنا نبوخذناصر، أسبح وأمجد وأحمد ملك السماء الذي جميع أعماله حق، وطرقه عادلة وقادر على إذلال كل من يسلك بالكبرياء."]]}, {"l": "Mat 5:3", "n": "", "vs": [[3, "«طوبى للمساكين بالروح، فإن لهم ملكوت السماوات."]]}, {"l": "Luk 18:13-17", "n": "", "vs": [[13, "ولكن جابي الضرائب، وقف من بعيد وهو لا يجرؤ أن يرفع عينيه نحو السماء، بل قرع صدره قائلا: ارحمني، ياالله ، أنا الخاطيء!"], [14, "أقول لكم: إن هذا الإنسان نزل إلى بيته مبررا، بعكس الآخر. فإن كل من يرفع نفسه يوضع؛ ومن يضع نفسه يرفع»."], [15, "وأحضر بعضهم أطفالا أيضا ليلمسهم. ولكن التلاميذ لما رأوهم زجروهم."], [16, "أما يسوع فدعاهم إليه وقال: «دعوا الصغار يأتون إلي، ولا تمنعوهم: لأن لمثل هؤلاء ملكوت الله !"], [17, "الحق أقول لكم: من لا يقبل ملكوت الله كأنه ولد صغير، فلن يدخله أبدا!»"]]}, {"l": "Rom 10:1-3", "n": "", "vs": [[1, "أيها الإخوة، إن رغبة قلبي وتضرعي إلى الله لأجلهم، هما أن يخلصوا."], [2, "فإني أشهد لهم أن عندهم غيرة لله، ولكنها ليست على أساس المعرفة."], [3, "فبما أنهم جهلوا بر الله وسعوا إلى إثبات برهم الذاتي، لم يخضعوا للبر الإلهي."]]}, {"l": "Jam 4:6-10", "n": "", "vs": [[6, "لا، بل إنه يجود علينا بنعمة أعظم. لذلك يقول الكتاب: «إن الله يقاوم المتكبرين، ولكنه يعطي المتواضعين نعمة»."], [7, "إذن، كونوا خاضعين لله. وقاوموا إبليس فيهرب منكم."], [8, "اقتربوا إلى الله فيقترب إليكم. أيها الخاطئون نظفوا أيديكم، وياأصحاب الرأيين طهروا قلوبكم."], [9, "احزنوا مولولين ونائحين وباكين. ليتحول ضحككم إلى نواح، وفرحكم إلى كآبة."], [10, "تواضعوا في حضرة الرب فيرفعكم!"]]}, {"l": "1Pe 5:5", "n": "", "vs": [[5, "كذلك، أيها الشباب، اخضعوا للشيوخ. البسوا جميعا ثوب التواضع في معاملتكم بعضكم لبعض. لأن الله يقاوم المتكبرين، ولكنه يعطي المتواضعين نعمة."]]}, {"l": "1Pe 5:6", "n": "", "vs": [[6, "إذن، تواضعوا تحت يد الله القديرة لكي يرفعكم عندما يحين الوقت،"]]}], "kwAr": "متواضعا", "noteAr": "بالعبرية: «اتضع لتسلك». انظر تك 5: 22؛ لا 26: 41؛ 2أخ 30: 11؛ 32: 26؛ 33: 12، 13، 19، 23؛ 34: 27؛ إش 57: 15؛ 66: 2؛ حز 16: 63؛ دا 4: 37؛ مت 5: 3؛ لو 18: 13-17؛ رو 10: 1-3؛ يع 4: 6-10؛ 1بط 5: 5، 6"}], "arS": [["لقد ", []], ["أوضح", ["H5046"]], [" لك ", []], ["الرب", ["H3068"]], [" أيها ", []], ["الإنسان", ["H120"]], [" ", []], ["ما", ["H4100"]], [" هو ", []], ["صالح", ["H2896"]], [". ", []], ["وماذا", ["H4100"]], [" ", []], ["يبتغي", ["H1875"]], [" ", []], ["منك", ["H4480"]], [" ", []], ["سوى", ["H3588", "H518"]], [" أن ", []], ["تتوخى", ["H6213"]], [" ", []], ["العدل", ["H4941"]], ["، ", []], ["وتحب", ["H157"]], [" ", []], ["الرحمة", ["H2617"]], ["، ", []], ["وتسلك", ["H1980"]], [" ", []], ["متواضعا", ["H6800"]], [" ", []], ["مع", ["H5973"]], [" ", []], ["إلهك", ["H430"]], ["؟", []]]}, {"c": 6, "v": 9, "text": "صوت الرب ينادي في أرجاء المدينة، ومن الحكمة أن يتقى اسمك. استمعوا ياأهل المدينة وأعضاء مجلسها:", "groups": [{"kw": "Lords", "raw": "Mic_3:12; Isa_24:10-12, Isa_27:10, Isa_32:13, Isa_32:14, Isa_40:6-8, Isa_66:6; Jer_19:11-13; Jer_26:6, Jer_26:18, Jer_37:8-10; Hos_13:16; Amo_2:5, Amo_3:8-15, Amo_6:1; Jon_3:4; Zep_3:2", "note": "", "refs": [{"l": "Mic 3:12", "n": "", "vs": [[12, "لهذا من جراء أعمالكم ستحرث صهيون كالحقل وتصبح أورشليم كومة من الخرائب، وجبل الهيكل مرتفعا تنمو عليه أشجار الغاب."]]}, {"l": "Isa 24:10-12", "n": "", "vs": [[10, "قد تدمرت مدينة الفوضى، وأغلق كل بيت، فلا يقدر أحد على الدخول."], [11, "ترتفع صرخة في الأزقة طلبا للخمرة المفقودة. زال كل فرح، وتلاشى السرور من الأرض"], [12, "بقي الخراب في المدينة، وتحطمت البوابات فأصبحت ردما."]]}, {"l": "Isa 27:10", "n": "", "vs": [[10, "لأن المدينة المنيعة تصبح مقفرة، ويصبح المسكن مهجورا متروكا كالقفر. وهناك يرعى العجل ويربض ويقرض أغصانها."]]}, {"l": "Isa 32:13", "n": "", "vs": [[13, "لأن أرض شعبي تنبت الشوك والحسك، فتنمو حتى في كل بيوت الفرح في المدينة المبتهجة."]]}, {"l": "Isa 32:14", "n": "", "vs": [[14, "لأن القصر يصبح مهجورا، والمدن العامرة خالية، والتلال والبروج مغاور إلى الأبد، ومراحا للحمير الوحشية ومرعى للقطعان،"]]}, {"l": "Isa 40:6-8", "n": "", "vs": [[6, "وعندئذ قال صوت: «ناد برسالة». فأجبت: «أية رسالة؟» فقال: «كل ذي جسد عشب، وكل بهائه كزهر الصحراء."], [7, "يذبل العشب ويذوي الزهر لأن نفخة الرب تهب عليه. حقا إن الشعب عشب."], [8, "يذبل العشب ويذوي الزهر، أما كلمة إلهنا فتثبت إلى الأبد»."]]}, {"l": "Isa 66:6", "n": "", "vs": [[6, "اسمعوا صوت جلبة في المدينة، صوتا من الهيكل، صوت الرب يجازي أعداءه."]]}, {"l": "Jer 19:11-13", "n": "", "vs": [[11, "وقل لهم: هذا ما يعلنه الرب القدير: سأحطم هذا الشعب وأدمر هذه المدينة كما يحطم المرء إناء الخزاف، بحيث لا يمكن إصلاحه، ويدفن الرجال في توفة إذ لن يتوافر موضع آخر للدفن."], [12, "هذا ما سأجريه على هذا المكان وعلى سكانه، يقول الرب، سأجعل هذه المدينة مثل توفة،"], [13, "وأحيل بيوت أورشليم وبيوت ملوك يهوذا إلى موضع نجاسة، وكذلك كل البيوت التي أحرقوا على سطوحها بخورا لكواكب السماء، وسكبوا سكائب خمر لآلهة أخرى»."]]}, {"l": "Jer 26:6", "n": "", "vs": [[6, "فإني أجعل هذا الهيكل نظير شيلوه، وهذه المدينة لعنة لجميع أمم الأرض»."]]}, {"l": "Jer 26:18", "n": "", "vs": [[18, "«إن ميخا المورشتي تنبأ في عهد حزقيا ملك يهوذا، وخاطب كل شعب يهوذا قائلا هذا ما يعلنه الرب القدير: إن صهيون ستحرث كحقل وتصير أورشليم كومة من الخرائب، وجبل الهيكل مرتفعا تنمو عليه أشجار الغاب."]]}, {"l": "Jer 37:8-10", "n": "", "vs": [[8, "فيعود الكلدانيون ويحاربون هذه المدينة ويستولون عليها ويحرقونها بالنار."], [9, "لذلك يقول الرب لا تخدعوا أنفسكم قائلين: سينسحب عنا الكلدانيون، فإنهم لا ينسحبون."], [10, "وحتى لو قضيتم على محاربيكم من جيش الكلدانيين بأسره، ولم يبق منهم سوى الجرحى القابعين في خيامهم، فإنهم سيهبون ويحرقون هذه المدينة بالنار»."]]}, {"l": "Hos 13:16", "n": "", "vs": [[16, "لابد أن تتحمل السامرة وزر خطيئتها لأنها تمردت على إلهها، فيفنى أهلها بحد السيف، ويتمزق أطفالها أشلاء، وتشق بطون حواملها."]]}, {"l": "Amo 2:5", "n": "", "vs": [[5, "لهذا أرسل نارا على يهوذا فتلتهم حصون أورشليم."]]}, {"l": "Amo 3:8-15", "n": "", "vs": [[8, "قد زأر الأسد فمن لا يخاف، وتكلم الرب فمن لا يتنبأ؟"], [9, "أذيعوا في حصون أشدود وفي حصون ديار مصر وقولوا: احتشدوا على جبال السامرة، واشهدوا ما في وسطها من جلبة، وانظروا إلى المظلومين في داخلها."], [10, "فهؤلاء الذين يكنزون الجور والنهب في قصورهم لا يعرفون التصرف باستقامة، يقول الرب."], [11, "لذلك يعلن الرب الإله: سيجتاح العدو البلاد، ويحيل حصونكم حطاما وينهب قصوركم."], [12, "هذا ما يقوله الرب: كما يعجز الراعي أن ينتزع من فم الأسد سوى رجلي حمل، أو قطعة من أذن، هكذا لن ينجو سوى القليل من شعب إسرائيل المقيمين في السامرة، المتكئين على الأرائك الوثيرة والأسرة الناعمة."], [13, "اسمعوا واشهدوا على بيت يعقوب، يقول السيد الرب الإله القدير."], [14, "في ذلك اليوم الذي أعاقب فيه إسرائيل على تعدياته، أهدم أيضا مذابح بيت إيل، وتقطع قرون المذبح وتتهاوى على الأرض."], [15, "وأدمر البيوت التي يأوون إليها في الشتاء، وبيوت المنتجعات الصيفية، وتندك بيوت العاج وتزول من الوجود قصور كثيرة، يقول الرب."]]}, {"l": "Amo 6:1", "n": "", "vs": [[1, "ويل للمترفين في صهيون والمطمئنين في جبل السامرة، نبلاء طليعة الأمم الذين يتوافد إليهم شعب إسرائيل."]]}, {"l": "Jon 3:4", "n": "", "vs": [[4, "فدخل يونان المدينة واجتاز فيها مسيرة يوم واحد، وابتدأ ينادي قائلا: «بعد أربعين يوما تتدمر المدينة»."]]}, {"l": "Zep 3:2", "n": "", "vs": [[2, "التي لا تصغي لصوت أحد، وتأبى التقويم، ولا تتكل على الرب، ولا تتقرب من إلهها."]]}], "kwAr": "صوت الرب", "noteAr": ""}, {"kw": "and", "raw": "2Ki_22:11-20; Psa_107:43; Pro_22:3; Isa_26:11; Hos_14:9", "note": "", "refs": [{"l": "2Ki 22:11-20", "n": "", "vs": [[11, "فلما سمع الملك ما ورد في سفر الشريعة مزق ثيابه،"], [12, "وأمر حلقيا الكاهن، وأخيقام بن شافان، وعكبور بن ميخا، وشافان الكاتب، وعسايا خادم الملك قائلا:"], [13, "«اذهبوا واسألوا الرب عن مصيري ومصير شعب يهوذا بناء على ما ورد في هذا السفر الذي تم العثور عليه، إذ إن غضب الرب المحتدم علينا عظيم جدا، لأن آباءنا لم يطيعوا كلام هذا السفر، ولم يمارسوا كل ما ورد فيه»."], [14, "فانطلق حلقيا الكاهن، وأخيقام، وعكبور، وشافان، وعسايا، واستشاروا النبية خلدة زوجة شلوم بن تقوة بن حرحس حارس الثياب الملكية، المقيمة في المنطقة الثانية من أورشليم."], [15, "فقالت لهم: «هذا ما يقوله الرب إله إسرائيل: قولوا للرجل الذي أرسلكم إلي:"], [16, "هكذا يقول الرب: ها أنا أجلب على هذا الموضع وعلى أهله كل الوعيد الوارد في السفر الذي قرأه ملك يهوذا،"], [17, "لأنهم نبذوني وأوقدوا لآلهة أخرى، ليثيروا سخطي بما تجنيه أيديهم من آثام، فاحتدم غضبي الذي لا ينطفيء على هذا الموضع."], [18, "أما ملك يهوذا الذي أرسلكم لتستشيروا الرب، فهذا ما تقولون له: إليك ما يقول الرب إله إسرائيل بشأن ما سمعت من كلام:"], [19, "من حيث أن قلبك قد رق، وتواضعت أمام الرب لدى سماعك ما قضيت به على هذا الموضع وعلى أهله، بأن يصيروا مثار دهشة ولعنة، ومزقت ثيابك وبكيت أمامي، فإنني قد استجبت أنا أيضا رجاءك."], [20, "لذلك ها أنا أتوفاك فتدفن في قبرك بسلام، ولا تشهد عيناك ما سأنزله بهذا الموضع من شر». فحمل الرجال ردها إلى الملك يوشيا."]]}, {"l": "Psa 107:43", "n": "", "vs": [[43, "فليتأمل كل حكيم في هذه الأمور، ويمعن النظر في مراحم الرب."]]}, {"l": "Pro 22:3", "n": "", "vs": [[3, "يرى العاقل الشر فيتوارى، أما الجاهل فيقبل إليه ويعاقب."]]}, {"l": "Isa 26:11", "n": "", "vs": [[11, "يارب إن يدك مرتفعة وهم لا يرونها، فدعهم يشاهدون غيرتك على شعبك، ويخزون. لتلتهمهم النار التي ادخرتها لأعدائك."]]}, {"l": "Hos 14:9", "n": "", "vs": [[9, "من هو حكيم فليسمع هذه الأمور، ومن هو فطن فليفهمها، لأن طرق الله مستقيمة، فيها يسلك الأبرار، أما المنافقون فيعثرون."]]}], "kwAr": "ومن الحكمة", "noteAr": ""}, {"kw": "the man of wisdom shall see thy name", "raw": "or, thy name shall see that which is wisdom, Exo_34:5-7; Psa_9:16, Psa_48:10, Psa_83:18; Isa_30:27", "note": "or, thy name shall see that which is wisdom, Exo_34:5-7; Psa_9:16, Psa_48:10, Psa_83:18; Isa_30:27", "refs": [{"l": "Exo 34:5-7", "n": "", "vs": [[5, "فنزل بهيئة سحاب، ووقف معه هناك حيث أعلن له اسمه: «الرب»،"], [6, "وعبر من أمام موسى مناديا: «أنا الرب. الرب إله رؤوف رحيم، بطيء الغضب وكثير الإحسان والوفاء."], [7, "أدخر الإحسان وأغفر الإثم والمعصية والخطيئة. ولكني لا أعفي المذنب من العقاب، بل أفتقد إثم الآباء في الأبناء والأحفاد حتى الجيل الرابع»."]]}, {"l": "Psa 9:16", "n": "", "vs": [[16, "الرب معروف بعدله، قضى أن يقع الشرير في شرك أعماله."]]}, {"l": "Psa 48:10", "n": "", "vs": [[10, "تسبيحك ياالله مثل اسمك يبلغ أقاصي الأرض. يمينك ملآنة صلاحا."]]}, {"l": "Psa 83:18", "n": "", "vs": [[18, "ويعلموا أنك أنت وحدك، يهوه العلي على الأرض كلها."]]}, {"l": "Isa 30:27", "n": "", "vs": [[27, "انظروا ها هو الرب مقبل من بعيد بغضب متوهج ودخان متكاثف متصاعد. شفتاه تفيضان سخطا، ولسانه كنار آكلة،"]]}], "kwAr": "أن يتقى اسمك", "noteAr": "أو: «اسمك يرى ما هو حكمة». انظر خر 34: 5-7؛ مز 9: 16؛ 48: 10؛ 83: 18؛ إش 30: 27"}, {"kw": "hear", "raw": "2Sa_21:1; Job_5:6-8, Job_5:17, Job_10:2; Isa_9:13, Isa_10:5, Isa_10:6; Jer_14:18-22; Lam_3:39-42; Joe_2:11-18; Amo_4:6-12; Jon_3:5-10; Hag_1:5-7; Rev_3:19", "note": "", "refs": [{"l": "2Sa 21:1", "n": "", "vs": [[1, "وحدثت مجاعة في أثناء حكم داود استمرت ثلاث سنوات متتالية، فالتمس داود وجه الرب. فأجابه الرب: «هذا من أجل ما ارتكبه شاول وأهل بيته الملطخة أيديهم بدماء الجبعونيين الذين قتلوهم."]]}, {"l": "Job 5:6-8", "n": "", "vs": [[6, "إن البلية لا تخرج من التراب، والمشقات لا تنبت من الأرض،"], [7, "ومع ذلك فإن الإنسان مولود لمعاناة المتاعب، كما ولدت الجوارح لتحلق بأجنحتها."], [8, "لو كنت في مكانك لاتجهت إلى الله وعرضت أمري عليه."]]}, {"l": "Job 5:17", "n": "", "vs": [[17, "طوبى للرجل الذي يقومه الله ، فلا ترفض تأديب القدير."]]}, {"l": "Job 10:2", "n": "", "vs": [[2, "قائلاَ لله: لا تستذنبني. فهمني لماذا تخاصمني؟"]]}, {"l": "Isa 9:13", "n": "", "vs": [[13, "إن الشعب لم يرجع تائبا إلى من عاقبه، ولا طلب الرب القدير."]]}, {"l": "Isa 10:5", "n": "", "vs": [[5, "ويل للأشوريين، قضيب غضبي، الحاملين في أيديهم عصا سخطي."]]}, {"l": "Isa 10:6", "n": "", "vs": [[6, "أرسلهم ضد أمة منافقة، وأوصيهم على شعبي الذي غضبت عليه، ليغنموا غنائمهم ويستولوا على أسلابهم، ويطأوهم كما يطأون الوحل."]]}, {"l": "Jer 14:18-22", "n": "", "vs": [[18, "إن خرجت إلى الحقول أشهد قتلى السيف، وإن دخلت المدينة أرى ضحايا المجاعة. وها النبي والكاهن كلاهما يذهبان إلى أرض لا يعرفانها»."], [19, "هل تنكرت ليهوذا كل التنكر؟ وهل كرهت نفسك صهيون؟ ما بالك قد ابتليتنا بضربة لا شفاء منها؟ وقد طلبنا السلام فلم نحظ بالخير. رجونا وقت الشفاء وإذا بنا نلقى الرعب."], [20, "نحن نقر بشرنا يارب وبآثام آبائنا، لأننا قد أخطأنا إليك."], [21, "لا ترفضنا من أجل اسمك ولا تهن عرشك المجيد. اذكر عهدك معنا ولا تنقضه."], [22, "هل بين أصنام الأمم الباطلة من يمطر؟ أو هل تسكب السموات بنفسها وابل الغيث؟ ألست أنت الرب إلهنا؟ إننا إياك نرجو لأنك أنت صنعت هذه جميعها."]]}, {"l": "Lam 3:39-42", "n": "", "vs": [[39, "فلماذا يشتكي الإنسان الحي حين يعاقب على خطاياه؟"], [40, "لنفحص طرقنا ونختبرها ونرجع إلى الرب."], [41, "لنرفع قلوبنا وأيدينا إلى الله في السماوات."], [42, "قد تعدينا وتمردنا، وأنت لم تغفر."]]}, {"l": "Joe 2:11-18", "n": "", "vs": [[11, "يجهر الرب بصوته في مقدمة جيشه لأن جنده لا يحصى لهم عدد، ومن ينفذ أمره يكون مقتدرا، لأن يوم الرب عظيم ومخيف جدا، فمن يتحمله؟"], [12, "والآن، يقول الرب: ارجعوا إلي من كل قلوبكم بصوم وبكاء ونوح."], [13, "مزقوا قلوبكم لا ثيابكم. ارجعوا إلى الرب إلهكم لأنه رؤوف ورحيم بطيء الغضب وكثير الرأفة، ولا يسر بالعقاب."], [14, "لعله يرجع ويكف عن العقاب مخلفا وراءه بركة: تقدمة دقيق وتقدمة سكيب لتقربوهما للرب إلهكم."], [15, "انفخوا بالبوق في صهيون، وقدسوا صوما، ونادوا لمحفل مقدس."], [16, "اجمعوا الشعب، قدسوا الجماعة، احشدوا الشيوخ والأولاد والرضع. ليغادر العريس مخدعه والعروس حجرتها."], [17, "ليبك الكهنة خدام الرب بين الرواق والمذبح قائلين: «اعف عن شعبك يارب ولا تجعل ميراثك مثار احتقار وهزء بين الأمم، فيقولوا بين الشعوب: أين إلههم؟»"], [18, "عندئذ يغار الرب على أرضه ويرق لشعبه."]]}, {"l": "Amo 4:6-12", "n": "", "vs": [[6, "قد جعلت الجوع يعم مدنكم، فلم تتسخ أسنانكم بالطعام! وأفقرتكم إلى الخبز في كل أماكن سكناكم، ولكنكم لم ترجعوا إلي تائبين، يقول الرب."], [7, "منعت عنكم المطر ولم يكن قد بقي للحصاد سوى ثلاثة أشهر، وأمطرت على مدينة دون مدينة، وعلى حقل دون الآخر، فجف الحقل الذي لم أمطر عليه."], [8, "فأقبلت مدينتان أو ثلاث على مدينة واحدة لتشرب ماء، ولكنها لم ترتو، ومع ذلك لم ترجعوا إلي تائبين، يقول الرب."], [9, "أرسلت الرياح اللافحة واليرقان لتجفف محاصيلكم، والتهم الجراد حدائقكم وكرومكم وأشجار تينكم وزيتونكم. وما رجعتم إلي!"], [10, "أصبتكم بالأوبئة التي أصيبت بها مصر، وقضيت على شبابكم بالسيف وسبيت خيولكم، وجعلت نتن معسكركم يزكم أنوفكم. ولكنكم لم ترجعوا إلي تائبين يقول الرب."], [11, "دمرت بعض مدنكم كما دمر الله سدوم وعمورة، فكان من نجا منكم كشعلة منتشلة من النار. ولكنكم لم ترجعوا إلي تائبين."], [12, "لذلك، هذا ما أجريه عليك ياإسرائيل. فمن أجل ما أصنعه بك تأهب للقاء إلهك."]]}, {"l": "Jon 3:5-10", "n": "", "vs": [[5, "فآمن شعب نينوى بالرب، وأعلنوا الصيام وارتدوا المسوح من كبيرهم إلى صغيرهم ."], [6, "ثم بلغ إنذار النبي ملك نينوى، فقام عن عرشه وخلع عنه حلته، وارتدى المسح وجلس على الرماد."], [7, "وأذاع في كل نينوى مرسوما ورد فيه: «بأمر من الملك ونبلائه، يمتنع الناس عن الأكل والشرب، وكذلك البهائم والغنم والبقر، لا ترع ولا تشرب ماء."], [8, "وعلى جميع الناس والبهائم أن يرتدوا المسوح، متضرعين إلى الله تائبين عن طرقهم الشريرة وعما ارتكبوه من ظلم."], [9, "لعل الرب يرجع فيعدل عن احتدام سخطه فلا نهلك»."], [10, "فلما رأى الله أعمالهم وتوبتهم عن طرقهم الآثمة عدل عن العقاب الذي كان مزمعا أن يوقعه بهم وعفا عنهم."]]}, {"l": "Hag 1:5-7", "n": "", "vs": [[5, "والآن هذا ما يقوله الرب القدير: «تأملوا فيما فعلتم:"], [6, "لقد زرعتم كثيرا وحصدتم قليلا. أكلتم ولم تشبعوا. شربتم ولم ترتووا. اكتسيتم ولم تستدفئوا. ومن ينال أجرة سرعان ما تتبدد، وكأنها وضعت في صرة مثقوبة»."], [7, "هكذا يقول الرب القدير: «تأملوا فيما فعلتم:"]]}, {"l": "Rev 3:19", "n": "", "vs": [[19, "إني أوبخ وأؤدب من أحبه، لذا كن حارا وتب!"]]}], "kwAr": "استمعوا", "noteAr": ""}], "arS": [["صوت", ["H6963"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["ينادي", ["H7121"]], [" في أرجاء ", []], ["المدينة", ["H5892"]], ["، ومن ", []], ["الحكمة", ["H8454"]], [" أن ", []], ["يتقى", ["H7200"]], [" ", []], ["اسمك", ["H8034"]], [". ", []], ["استمعوا", ["H8085"]], [" ياأهل المدينة وأعضاء مجلسها:", []]]}, {"c": 6, "v": 10, "text": "في بيوت الأشرار كنوز مسروقة وموازين مغشوشة.", "groups": [{"kw": "Are", "raw": "etc. or, Is there yet unto every man an house of the wicked, etc", "note": "etc. or, Is there yet unto every man an house of the wicked, etc", "refs": [], "kwAr": "في بيوت", "noteAr": "إلخ. أو: «هل لكل إنسان بعد بيت للشرير» إلخ."}, {"kw": "the treasures", "raw": "Jos_7:1; 2Ki_5:23, 2Ki_5:24; Pro_10:2, Pro_21:6; Jer_5:26, Jer_5:27; Amo_3:10; Hab_2:5-11; Zep_1:9; Zec_5:3, Zec_5:4; Jam_5:1-4", "note": "", "refs": [{"l": "Jos 7:1", "n": "", "vs": [[1, "ولكن الإسرائيليين ارتكبوا خيانة، إذ أخذ عخان بن كرمي بن زبدي بن زارح من سبط يهوذا مما هو مخصص للرب، فاحتدم غضب الرب على بني إسرائيل."]]}, {"l": "2Ki 5:23", "n": "", "vs": [[23, "فقال نعمان: «أرجوك أن تأخذ وزنتين» وألح عليه، وصرهما في كيسين وحلتي ثياب، وأعطاهما لرجلين من رجاله، فحملاهما وانطلقا أمام جيحزي."]]}, {"l": "2Ki 5:24", "n": "", "vs": [[24, "وعندما وصل إلى الأكمة حيث يقيم أليشع أخذها منهما وأخفاها في البيت، وصرف الرجلين."]]}, {"l": "Pro 10:2", "n": "", "vs": [[2, "كنوز المال الحرام لا تجدي، ولكن الحق ينجي من الموت."]]}, {"l": "Pro 21:6", "n": "", "vs": [[6, "ادخار الكنوز بلسان منافق، دخان متلاش وفخ مميت."]]}, {"l": "Jer 5:26", "n": "", "vs": [[26, "ففي وسط شعبي قوم أشرار يكمنون كما يكمن القناصون للطيور، وينصبون الفخ لاقتناص الناس."]]}, {"l": "Jer 5:27", "n": "", "vs": [[27, "بيوتهم تكتظ بالخديعة كقفص مملوء طيورا، لذلك عظموا وأثروا."]]}, {"l": "Amo 3:10", "n": "", "vs": [[10, "فهؤلاء الذين يكنزون الجور والنهب في قصورهم لا يعرفون التصرف باستقامة، يقول الرب."]]}, {"l": "Hab 2:5-11", "n": "", "vs": [[5, "وكما أن الخمر غادرة، كذلك تأخذ المغتر نشوة الانتصار فلا يستكين، فإن جشعه في سعة الهاوية، وهو كالموت لا يشبع. لهذا يجمع لنفسه كل الأمم ويسبي جميع الشعوب."], [6, "ولكن لا يلبث أن يسخر منه سباياه قائلين: «ويل لمن يكوم لنفسه الأسلاب، ويثرى على حساب ما نهب. إنما إلى متى؟"], [7, "ألا يقوم عليك دائنوك بغتة، أو لا يثورون عليك ويملأونك رعبا، فتصبح لهم غنيمة؟"], [8, "لأنك سلبت أمما كثيرة فإن بقية الشعوب ينهبونك ثأرا لما سفكت من دماء وارتكبت من جور في الأرض، فدمرت مدنا وأهلكت الساكنين فيها."], [9, "ويل لمن يدخر لبنيه مكسب ظلم، ويشيد مسكنه في مقام حصين ليكون في مأمن من الخطر."], [10, "لقد لطخت مؤامرتك بيتك بالعار حين استأصلت أمما عديدة وجلبت الدمار على نفسك."], [11, "حتى حجارة الجدران تصرخ من شرك، فتردد الدعائم الخشبية أصداءها."]]}, {"l": "Zep 1:9", "n": "", "vs": [[9, "وأعاقب في ذلك اليوم كل الذين يقفزون من فوق عتبة الهيكل (على غرار كهنة داجون)، الذين يملأون بيت سيدهم جورا ونهبا."]]}, {"l": "Zec 5:3", "n": "", "vs": [[3, "فقال لي: «هذه هي اللعنة المنصبة على وجه الأرض كلها. كل من يسرق يستأصل بمقتضى ما هو مدون فيها، وكل حالف زور يعاقب بموجب ما هو منصوص فيها»."]]}, {"l": "Zec 5:4", "n": "", "vs": [[4, "ويقول الرب القدير: «إني أصب هذه اللعنة على بيت كل سارق أو حالف باسمي زورا، فتحل في وسط بيته وتبيده مع خشبه وحجره»."]]}, {"l": "Jam 5:1-4", "n": "", "vs": [[1, "أيها الأغنياء، هيا الآن ابكوا مولولين بسبب ما ينتظركم من أهوال وشقاء."], [2, "إن ثرواتكم الكثيرة قد فسدت، وثيابكم الفاخرة قد أكلها العث"], [3, "ذهبكم وفضتكم قد تآكلا، وسيكون تآكلهما شاهدا ضدكم، ويأكل لحمكم كنار جمعتموها ثروة للأيام الأخيرة؟"], [4, "وهذه أجرة العمال الذين حصدوا حقولكم، تلك الأجرة التي مازلتم تحبسونها عنهم ظلما، إنها تصرخ، وصراخ أولئك العمال أنفسهم قد سمعه رب الجنود!"]]}], "kwAr": "كنوز مسروقة", "noteAr": ""}, {"kw": "and", "raw": "Lev_19:35, Lev_19:36; Deu_25:13-16; Pro_11:1, Pro_20:10,Pro_20:23; Eze_45:9-12; Hos_12:7, Hos_12:8; Amo_8:5, Amo_8:6", "note": "", "refs": [{"l": "Lev 19:35", "n": "", "vs": [[35, "لا تجوروا في القضاء، ولا تغشوا في القياس أو الوزن أو الكيل،"]]}, {"l": "Lev 19:36", "n": "", "vs": [[36, "بل استخدموا موازين عادلة وعيارات عادلة ومكاييل عادلة، فأنا الرب إلهكم الذي أخرجكم من ديار مصر."]]}, {"l": "Deu 25:13-16", "n": "", "vs": [[13, "لا تحتفظ في كيسك بمعيارين مختلفين كبير وصغير،"], [14, "ولا يكن لك في بيتك مكيالان مختلفان كبير وصغير،"], [15, "بل لتكن أوزانك ومكاييلك صحيحة لا غش فيها، لتطول أيامك على الأرض التي يهبها لك الرب إلهك،"], [16, "لأن كل من غش في المكاييل أو الأوزان يصبح مكروها لدى الرب إلهكم."]]}, {"l": "Pro 11:1", "n": "", "vs": [[1, "الميزان المغشوش رجس لدى الرب، والمكيال الوافي يحوز رضاه."]]}, {"l": "Pro 20:10", "n": "", "vs": [[10, "الغش ما بين أوزان ومعايير ومكاييل الشراء، وأوزان ومعايير ومكاييل البيع رجس لدى الرب."]]}, {"l": "Pro 20:23", "n": "", "vs": [[23, "التلاعب بالمعايير رجس عند الرب، وميزان الغش أمر رديء."]]}, {"l": "Eze 45:9-12", "n": "", "vs": [[9, "وهذا ما يعلنه السيد الرب، حسبكم يارؤساء إسرائيل، توقفوا عن الظلم والاغتصاب، واحكموا بالحق والإنصاف، وكفوا عن ظلم شعبي يقول السيد الرب."], [10, "لتكن لكم موازين عادلة وإيفة حق وبث حق."], [11, "فتكون الإيفة والبث متساويتين في المقدار، وتسع كل منهما عشر الحومر. ويكون الحومر هو المكيال المعتمد."], [12, "ويكون الشاقل معادلا لعشرين جيرة، فتكون قيمة الخمسة شواقل خمسة شواقل، وقيمة العشرة شواقل عشرة شواقل، وقيمة المن خمسين شاقلا."]]}, {"l": "Hos 12:7", "n": "", "vs": [[7, "إن أفرايم مثل التاجر الكنعاني يحمل بيده ميزانا مغشوشا لأنه يحب الجور."]]}, {"l": "Hos 12:8", "n": "", "vs": [[8, "ويقول: «قد أصبحت غنيا، وضمنت لنفسي ثروة، ولا يمكن لأحد إن يجد في كل ما اكتسبته من غنى مالا حراما أثيما»."]]}, {"l": "Amo 8:5", "n": "", "vs": [[5, "قائلين: «متى ينقضي أول الشهر حتى نبيع الحنطة؟ متى يمضي السبت لنعرض القمح في السوق، فنعمد إلى تصغير حجم مكيال الإيفة ونرفع الأسعار، ونستعمل ميزانا مغشوشا."]]}, {"l": "Amo 8:6", "n": "", "vs": [[6, "لنشتري المسكين بقطعة من الفضة، والبائس بنعلين، ونبيع نفاية القمح؟»"]]}], "kwAr": "وموازين", "noteAr": ""}, {"kw": "scant measure", "raw": "Heb. measure of leanness", "note": "Heb. measure of leanness", "refs": [], "kwAr": "مغشوشة", "noteAr": "بالعبرية: «مكيال هزال»."}], "arS": [["في ", []], ["بيوت", ["H1004"]], [" ", []], ["الأشرار", ["H7563"]], [" ", []], ["كنوز", ["H214"]], [" ", []], ["مسروقة", ["H7562"]], [" ", []], ["وموازين", ["H374"]], [" ", []], ["مغشوشة", ["H7332", "H2194"]], [".", []]]}, {"c": 6, "v": 11, "text": "فكيف أبرىء ذا المعايير المغشوشة، صاحب كيس الموازين الناقصة؟", "groups": [{"kw": "count them pure", "raw": "or, be pure", "note": "or, be pure", "refs": [], "kwAr": "أبرىء", "noteAr": "أو: «أكون نقيا»."}, {"kw": "the wicked", "raw": "Hos_12:7", "note": "", "refs": [{"l": "Hos 12:7", "n": "", "vs": [[7, "إن أفرايم مثل التاجر الكنعاني يحمل بيده ميزانا مغشوشا لأنه يحب الجور."]]}], "kwAr": "المعايير المغشوشة", "noteAr": ""}, {"kw": "the bag", "raw": "Pro_16:11", "note": "", "refs": [{"l": "Pro 16:11", "n": "", "vs": [[11, "للرب ميزان العدل وقسطاسه، وجميع معايير كيس التاجر من صنعه."]]}], "kwAr": "كيس", "noteAr": ""}], "arS": [["فكيف ", []], ["أبرىء", ["H2135"]], [" ذا ", []], ["المعايير", ["H3976"]], [" ", []], ["المغشوشة", ["H7562"]], ["، صاحب ", []], ["كيس", ["H3599"]], [" ", []], ["الموازين", ["H68"]], [" ", []], ["الناقصة", ["H4820"]], ["؟", []]]}, {"c": 6, "v": 12, "text": "قد امتلأ أثرياء المدينة ظلما، ونطق سكانها بالكذب وألسنة الغش في أفواههم", "groups": [{"kw": "the rich", "raw": "Mic_2:1, Mic_2:2, Mic_3:1-3, Mic_3:9-11, Mic_7:2-6; Isa_1:23, Isa_5:7; Jer_5:5, Jer_5:6, Jer_5:26-29, Jer_6:6, Jer_6:7; Eze_22:6-13, Eze_22:25-29; Hos_4:1, Hos_4:2; Amo_5:11, Amo_5:12, Amo_6:1-3; Zep_3:3", "note": "", "refs": [{"l": "Mic 2:1", "n": "", "vs": [[1, "ويل للمتآمرين بالسوء، الذين يحوكون الشر وهم في مضاجعهم، الذين ينفذون عند طلوع الصباح ما خططوا له، لأن ذلك في متناول قدرتهم."]]}, {"l": "Mic 2:2", "n": "", "vs": [[2, "يشتهون حقولا ويغتصبونها، وبيوتا فيستولون عليها. يجورون على الرجل وعلى بيته والإنسان وميراثه."]]}, {"l": "Mic 3:1-3", "n": "", "vs": [[1, "وقلت اسمعوا يارؤساء يعقوب وياقضاة شعب إسرائيل: ألا ينبغي لكم أن تعرفوا الحق؟"], [2, "أنتم يامن تبغضون الخير وتحبون الشر، وتسلخون جلود شعبي وتجردون لحومهم عن عظامهم."], [3, "الذين تأكلون لحوم شعبي، وتسلخون جلودهم عنهم وتهشمون عظامهم، وتقطعونهم كما يقطع اللحم في القدر، أو كاللحم المعد للمقلى."]]}, {"l": "Mic 3:9-11", "n": "", "vs": [[9, "استمعوا هذا يارؤساء بيت يعقوب وقضاة شعب إسرائيل الذين يكرهون العدل ويحرفون الحق."], [10, "الذين يبنون صهيون بالدم وأورشليم بالظلم."], [11, "إذ يحكم رؤساؤها بالرشوة، وكهنتها يعلمون بالأجرة ويتعاطى أنبياؤها العرافة لقاء المال، ومع ذلك يدعون الاتكال على الله قائلين: «أليس الرب في وسطنا؟ لذلك لن يصيبنا مكروه»."]]}, {"l": "Mic 7:2-6", "n": "", "vs": [[2, "قد باد الصالح من الأرض واختفى المستقيم من بين الناس. جميعهم يكمنون لسفك الدماء، وكل واحد منهم يقتنص أخاه."], [3, "تجد أيديهم في ارتكاب الشر، ويسعى الرئيس والقاضي وراء الرشوة، ويملي العظيم عليهم أهواء نفسه، فيتآمرون جميعا على الحق."], [4, "أفضلهم مثل العوسج، وأكثرهم استقامة أسوأ من سياج الشوك. وها يوم عقابكم الذي أنذر به أنبياؤكم قد وافى. عندئذ يعتريكم الارتباك."], [5, "لا تأتمن جارك ولا تثق بصديق، واحترس مما تنطق به شفتاك ممن ترقد في حضنك."], [6, "فإن الابن يستخف بأبيه والابنة تتمرد على أمها، والكنة على حماتها، وأعداء الإنسان أهل بيته."]]}, {"l": "Isa 1:23", "n": "", "vs": [[23, "أصبح رؤساؤك عصاة وشركاء لصوص، يولعون بالرشوة ويسعون وراء الهبات، لا يدافعون عن اليتيم، ولا ترفع إليهم دعوى الأرملة»."]]}, {"l": "Isa 5:7", "n": "", "vs": [[7, "لأن كرم الرب القدير هو بيت إسرائيل، ورجال يهوذا هم غرس بهجته. ولكن عندما انتظر حقا وجد سفك دماء، وعندما التمس عدلا رأى صراخا."]]}, {"l": "Jer 5:5", "n": "", "vs": [[5, "فلأقصدن العظماء وأكلمهم لأنهم يعرفون طريق الرب وقضاء إلههم». فإذا هؤلاء جميعا قد حطموا النير وقطعوا الربط."]]}, {"l": "Jer 5:6", "n": "", "vs": [[6, "لذلك ينقض عليهم أسد من الغاب ويقتلهم، ويفترسهم ذئب من الصحراء، ويكمن النمر حول مدنهم، فيمزق إربا كل من يخرج منهم، لأن آثامهم كثيرة، وارتداداتهم متعاظمة."]]}, {"l": "Jer 5:26-29", "n": "", "vs": [[26, "ففي وسط شعبي قوم أشرار يكمنون كما يكمن القناصون للطيور، وينصبون الفخ لاقتناص الناس."], [27, "بيوتهم تكتظ بالخديعة كقفص مملوء طيورا، لذلك عظموا وأثروا."], [28, "ازدادوا سمنا ونعومة، وارتكبوا الشر متجاوزين كل حد. لم يحكموا بعدل في دعوى اليتيم حتى تنجح، ولم يدافعوا عن حقوق المساكين."], [29, "أفلا أعاقبهم على هذه الأمور؟» يقول الرب. ألا أنتقم لنفسي من أمة كهذه؟"]]}, {"l": "Jer 6:6", "n": "", "vs": [[6, "لأن هذا ما يعلنه الرب القدير: «اقطعوا الشجر، وأقيموا مترسة حول أورشليم، إذ يجب أن تعاقب هذه المدينة، لأن داخلها مفعم بالظلم."]]}, {"l": "Jer 6:7", "n": "", "vs": [[7, "وكما تنبع العين مياهها كذلك هي تنبع شرها. يتردد في أرجائها الظلم ويعمها السلب، وأمامي دائما مرض وبلايا."]]}, {"l": "Eze 22:6-13", "n": "", "vs": [[6, "هوذا كل واحد من رؤساء إسرائيل ممن كانوا فيك انهمك في سفك الدماء على قدر طاقته."], [7, "فيك استخفوا بأب وأم وجاروا في وسطك على الغريب، واضطهدوا اليتيم والأرملة،"], [8, "احتقرت مقدساتي ونجست أيام سبوتي."], [9, "أقام فيك وشاة عملوا على سفك الدم، وأكلوا أمام الأصنام على الجبال، وارتكبوا في وسطك الموبقات."], [10, "فيك فضح الإنسان عري أبيه، وفيك أذلوا من برحت متنجسة بطمثها."], [11, "فيك إنسان زنى مع امرأة قريبه، واقترف إنسان الرذيلة مع كنته، وفيك ضاجع إنسان أخته ابنة أبيه."], [12, "فيك أخذوا الرشوة لقاء سفك الدماء. أخذت الربا ومال الحرام، وسلبت أقرباءك ظلما ونسيتني، يقول السيد الرب."], [13, "ها أنا قد صفقت بكفي من جراء ما حصلت عليه من ربح حرام، وما سفك من دم في وسطك."]]}, {"l": "Eze 22:25-29", "n": "", "vs": [[25, "تواطأ أنبياؤها الكذبة فيها مثل أسد مزمجر يمزق الفريسة. التهموا نفوسا، واستولوا على نفائس الناس وكنوزهم، وكثروا أراملها فيها."], [26, "خالف كهنتها شريعتي ونجسوا مقادسي. لم يميزوا بين المقدس والرجس، ولم يعلموا الفرق بين الطاهر والنجس، وحجبوا عيونهم عن أيام سبوتي فصرت مدنسا في وسطهم."], [27, "رؤساؤها فيها كذئاب خاطفة تمزق فرائسها إذ يسفكون دماء الناس في سبيل الربح الحرام."], [28, "وأنبياؤها قد طلوا لهم بماء الكلس، إذ يرون لهم رؤى باطلة، ويعرفون لهم عرافة كاذبة قائلين: هذا ما يعلنه السيد الرب، مع أن الرب لم يعلن شيئا."], [29, "أفرطوا في ظلم شعب الأرض واغتصبوا سالبين، واضطهدوا الفقير والمسكين، وظلموا الغريب جورا."]]}, {"l": "Hos 4:1", "n": "", "vs": [[1, "اسمعوا كلمة الرب يابني إسرائيل، لأن للرب دعوى على أهل الأرض إذ خلت الأرض من الأمانة والإحسان ومعرفة الله."]]}, {"l": "Hos 4:2", "n": "", "vs": [[2, "وتفشت فيها اللعنة والكذب والقتل والسرقة والفسق. قد تخطوا كل حد، وسفك الدم يعقبه سفك دم."]]}, {"l": "Amo 5:11", "n": "", "vs": [[11, "فلأنكم تطأون المسكين وتبتزون منه رشوة قمح حتى تشيدوا بيوتا من حجارة منحوتة، فإنكم لن تسكنوا فيها، وتغرسوا كروما شهية ولكنكم لن تشربوا من خمرها."]]}, {"l": "Amo 5:12", "n": "", "vs": [[12, "لأنني عالم بكثرة معاصيكم وعظم خطاياكم، إذ أنكم تضايقون البار أيها المرتشون الذين تصدون المسكين عن حقه في ساحة القضاء."]]}, {"l": "Amo 6:1-3", "n": "", "vs": [[1, "ويل للمترفين في صهيون والمطمئنين في جبل السامرة، نبلاء طليعة الأمم الذين يتوافد إليهم شعب إسرائيل."], [2, "توجهوا إلى مدينة كلنة وتأملوا، ثم انتقلوا إلى حماة العظيمة، ومنها انحدروا إلى جت مدينة الفلسطينيين. هل هي خير من هذه الممالك أم تخومهم أعظم من تخومكم؟"], [3, "أنتم يامن تتجاهلون يوم السوء وتقربون كرسي الظلم."]]}, {"l": "Zep 3:3", "n": "", "vs": [[3, "رؤساؤها في داخلها أسود زائرة، وقضاتها كذئاب المساء الجائعة التي لا تبقي شيئا من فرائسها إلى الصباح."]]}], "kwAr": "أثرياء", "noteAr": ""}, {"kw": "spoken", "raw": "Isa_59:3-15; Jer_9:2-6, Jer_9:8; Hos_7:1, Hos_7:13; Rom_3:13", "note": "", "refs": [{"l": "Isa 59:3-15", "n": "", "vs": [[3, "لأن أيديكم تلوثت بالدم وأصابعكم بالإثم، ونطقت شفاهكم بالكذب، ولهجت ألسنتكم بالشر."], [4, "ليس بينكم من يطالب بالعدل، أو يحكم بالحق. يتكلون على الباطل ويتفوهون بالزور، يحبلون بالغش، ويلدون بالإثم."], [5, "يفقسون بيض أفعى، وينسجون خيوط العنكبوت. من يأكل من بيضهم يموت، ومن البيضة المكسورة تخرج حية."], [6, "لا تصلح خيوطهم لنسيج الثياب، ولا يكتسون بأعمالهم، لأن أعمالهم هي أعمال إثم، وأفعال الظلم قد ارتكبتها أيديهم."], [7, "تسرع أرجلهم لاقتراف الشر، ويهرولون لسفك دم البريء، أفكارهم أفكار أثيمة، وفي طرقهم دمار وخراب"], [8, "لم يعرفوا سبيل السلام، ولا عدل في مسالكهم. عوجوا طرقهم، والسالك فيها لا يعرف سلاما."], [9, "الحق ابتعد عنا، ولم يدركنا العدل. نرتقب نورا، فيحدق بنا الظلام، وننشد ضوءا فنسلك في العتمة."], [10, "نتحسس الحائط كالأعمى، ونتلمس كالمكفوف، نتعثر في الظهيرة كما لو كنا نسير في عتمة الليل ونكون كالأموات بين المتدفقين بالحياة"], [11, "كلنا نزمجر كالدببة، وننوح كالحمام. نبحث عن العدل فلا نجده، وعن الخلاص وإذا به قد ابتعد عنا،"], [12, "لأن معاصينا كثرت أمامك، وآثامنا تشهد علينا. فمعاصينا معنا، وذنوبنا نعرفها."], [13, "تمردنا وتنكرنا للرب. ارتددنا عن اتباع طرق إلهنا، تفوهنا بالظلم والعصيان افتراء، وبكلام زور من القلب."], [14, "قد ارتد عنا الإنصاف، ووقف العدل بعيدا، إذ سقط الحق صريعا في الشوارع، والبر لم يستطع الدخول."], [15, "أضحى الحق مفقودا، والحائد عن الشر ضحية. رأى الرب ذلك فأسخطه فقدان الإنصاف."]]}, {"l": "Jer 9:2-6", "n": "", "vs": [[2, "ياليت لي في الصحراء مبيت عابر سبيل، فأهجر شعبي وأنطلق بعيدا عنهم، لأنهم جميعا زناة وجماعة خونة."], [3, "«قد وتروا ألسنتهم كقسي جاهزة ليطلقوا الأكاذيب التي تقولوا بها في الأرض من دون الحق، إذ أنهم انتهوا من شر إلى شر، وإياي لم يعرفوا» يقول الرب."], [4, "«ليحترس كل واحد من جاره، ولا يثق بأحد من أقربائه، لأن كل قريب مخادع، وكل صاحب واش."], [5, "كل واحد منهم يخدع جاره ولا ينطقون بالصدق. دربوا ألسنتهم على قول الكذب، وأرهقوا أنفسهم في ارتكاب الإثم."], [6, "يجمعون ظلما فوق ظلم، وخداعا على خداع، وأبوا أن يعرفوني»."]]}, {"l": "Jer 9:8", "n": "", "vs": [[8, "لسانهم كسهم قاتل يتفوه بالكذب. وبفمه يخاطب جاره بحديث السلام، أما في قلبه فينصب له كمينا."]]}, {"l": "Hos 7:1", "n": "", "vs": [[1, "حين كنت أشفي إسرائيل، تكشفت خطيئة أفرايم، واستعلنت آثام السامرة، فقد مارسوا النفاق واقتحم اللصوص البيوت، وسلب قطاع الطرق في الخارج."]]}, {"l": "Hos 7:13", "n": "", "vs": [[13, "ويل لهم لأنهم شردوا عني! تبا لهم لأنهم تمردوا علي! لشد ما أتوق لافتدائهم، ولكنهم نطقوا علي كذبا."]]}, {"l": "Rom 3:13", "n": "", "vs": [[13, "حناجرهم قبور مفتوحة؛ ألسنتهم أدوات للمكر؛ شفاههم تخفي سم الأفاعي القاتلة؛"]]}], "kwAr": "ونطق", "noteAr": ""}], "arS": [["قد ", []], ["امتلأ", ["H4390"]], [" ", []], ["أثرياء", ["H6223"]], [" المدينة ", []], ["ظلما", ["H2555"]], ["، ", []], ["ونطق", ["H1696"]], [" ", []], ["سكانها", ["H3427"]], [" ", []], ["بالكذب", ["H8267"]], [" ", []], ["وألسنة", ["H3956"]], [" ", []], ["الغش", ["H7423"]], [" في ", []], ["أفواههم", ["H6310"]]]}, {"c": 6, "v": 13, "text": "لذلك شرعت في تدميرك لأجعلك خرابا من أجل خطاياك.", "groups": [{"kw": "I make", "raw": "Lev_26:16; Deu_28:21, Deu_28:22; Job_33:19-22; Psa_107:17, Psa_107:18; Isa_1:5, Isa_1:6; Jer_14:18; Act_12:23", "note": "", "refs": [{"l": "Lev 26:16", "n": "", "vs": [[16, "فإني أبتليكم بالرعب المفاجيء وداء السل والحمى التي تفني العينين وتتلف النفس، وتزرعون على غير طائل، وينهب أعداؤكم زرعكم."]]}, {"l": "Deu 28:21", "n": "", "vs": [[21, "ويتفشى بينكم الوباء حتى يبيدكم عن الأرض التي أنتم ماضون إليها لامتلاكها،"]]}, {"l": "Deu 28:22", "n": "", "vs": [[22, "ويضربكم الرب بالسل والحمى والرعشة والالتهاب والجفاف واللفح والذبول، فتلازمكم حتى تفنوا."]]}, {"l": "Job 33:19-22", "n": "", "vs": [[19, "قد يقوم الإنسان بالألم على مضجعه، وبالأوجاع الناشبة في عظامه،"], [20, "حتى تعاف حياته الطعام، وشهيته لذيذ المأكل."], [21, "يبلى لحمه فيختفي عن العيان، وتنبري عظامه التي كانت خافية من قبل."], [22, "تدنو نفسه من الهاوية، وحياته من زبانية الموت."]]}, {"l": "Psa 107:17", "n": "", "vs": [[17, "سفهوا في جهلهم وسقموا من جراء آثامهم."]]}, {"l": "Psa 107:18", "n": "", "vs": [[18, "عافت أنفسهم كل طعام، فصاروا على شفا الموت."]]}, {"l": "Isa 1:5", "n": "", "vs": [[5, "على أي موضع أضربكم بعد؟ لماذا تواظبون على التمرد؟ إن الرأس بجملته سقيم والقلب بكامله مريض."]]}, {"l": "Isa 1:6", "n": "", "vs": [[6, "من أخمص القدم إلى قمة الرأس ليس فيه عافية. كله جروح وأحباط وقروح لم تنظف، ولم تضمد، ولم تلين بالزيت."]]}, {"l": "Jer 14:18", "n": "", "vs": [[18, "إن خرجت إلى الحقول أشهد قتلى السيف، وإن دخلت المدينة أرى ضحايا المجاعة. وها النبي والكاهن كلاهما يذهبان إلى أرض لا يعرفانها»."]]}, {"l": "Act 12:23", "n": "", "vs": [[23, "فضربه ملاك من عند الرب في الحال لأنه لم يعط المجد لله، فأكله الدود ومات!"]]}], "kwAr": "لأجعلك", "noteAr": ""}, {"kw": "in", "raw": "Lam_1:13, Lam_3:11; Hos_5:9, Hos_13:16", "note": "", "refs": [{"l": "Lam 1:13", "n": "", "vs": [[13, "من العلاء صب نارا في عظامي فسرت فيها. نصب شركا لقدمي فردني إلى الوراء. جعلني أطلالا أئن طول النهار."]]}, {"l": "Lam 3:11", "n": "", "vs": [[11, "أضل طرقي ومزقني إربا. دمرني."]]}, {"l": "Hos 5:9", "n": "", "vs": [[9, "أرض أفرايم ستصبح خرابا في يوم القضاء، وبين أسباط إسرائيل أظهرت ما هو يقين."]]}, {"l": "Hos 13:16", "n": "", "vs": [[16, "لابد أن تتحمل السامرة وزر خطيئتها لأنها تمردت على إلهها، فيفنى أهلها بحد السيف، ويتمزق أطفالها أشلاء، وتشق بطون حواملها."]]}], "kwAr": "شرعت", "noteAr": ""}], "arS": [["لذلك", ["H1571"]], [" ", []], ["شرعت", ["H2470"]], [" في ", []], ["تدميرك", ["H5221"]], [" ", []], ["لأجعلك", ["H8074"]], [" خرابا ", []], ["من أجل", ["H5921"]], [" ", []], ["خطاياك", ["H2403"]], [".", []]]}, {"c": 6, "v": 14, "text": "ستأكلين ولا تشبعين، ويظل جوفك خاويا. وما تدخرينه تعجزين عن الاحتفاظ به. لأني أدفعه للسيف.", "groups": [{"kw": "eat", "raw": "Lev_26:26; Isa_65:13; Eze_4:16, Eze_4:17; Hos_4:10; Hag_1:6, Hag_2:16", "note": "", "refs": [{"l": "Lev 26:26", "n": "", "vs": [[26, "وحين أقطع عنكم مؤونة الدقيق، تخبز عشر نساء خبزكم في فرن واحد لقلة الدقيق، وتقسمون الخبز بالميزان فتأكلون ولا تشبعون."]]}, {"l": "Isa 65:13", "n": "", "vs": [[13, "لذلك هكذا يقول السيد الرب: ها عبيدي يأكلون وأنتم تجوعون، ويشربون وأنتم تظمأون، ويفرحون وأنتم تخزون،"]]}, {"l": "Eze 4:16", "n": "", "vs": [[16, "ياابن آدم، ها أنا أبيد مؤونة الخبز في أورشليم، فيأكلون الخبز بالوزن معجونا بالغم، ويشربون الماء بالكيل ممزوجا بالحيرة."]]}, {"l": "Eze 4:17", "n": "", "vs": [[17, "إذ يعوزهم الخبز والماء، ويلجأ الواحد إلى أخيه وقد اعترتهم الحيرة فيفنون جميعا بإثمهم."]]}, {"l": "Hos 4:10", "n": "", "vs": [[10, "فيأكلون ولا يشبعون، ويزنون ولا يتكاثرون، لأنهم نبذوا الرب واستسلموا إلى العهارة."]]}, {"l": "Hag 1:6", "n": "", "vs": [[6, "لقد زرعتم كثيرا وحصدتم قليلا. أكلتم ولم تشبعوا. شربتم ولم ترتووا. اكتسيتم ولم تستدفئوا. ومن ينال أجرة سرعان ما تتبدد، وكأنها وضعت في صرة مثقوبة»."]]}, {"l": "Hag 2:16", "n": "", "vs": [[16, "عندما كان يقبل أحد على كومة حبوب ظنا منه أن الأرض قد غلت عشرين مكيالا، يجد أنها لم تغل سوى عشرة فقط. وحين يدنو من المعصرة ليغرف ملء خمسين وعاء، لا يجد إلا عشرين."]]}], "kwAr": "ستأكلين", "noteAr": ""}, {"kw": "and thou", "raw": "Deu_32:22-25; Isa_3:6-8, Isa_24:17-20; Jer_48:44; Eze_5:12; Amo_2:14-16; Amo_9:1-4", "note": "", "refs": [{"l": "Deu 32:22-25", "n": "", "vs": [[22, "فها قد أضرم غضبي نارا تحرق حتى الهاوية السفلى، وتأكل الأرض وغلاتها، وتشعل أسس الجبال."], [23, "أكوم عليهم شرورا وأنفذ سهامي فيهم."], [24, "وحين يكونون خائرين من الجوع، منهوكين من الحمى والداء السام، أجعل أنياب الوحوش مع سم زواحف الأرض تنشب فيهم."], [25, "يثكلهم سيف العدو في الطريق، ويستولي عليهم الرعب داخل الخدور، فيهلك الفتى مع الفتاة، والرضيع مع الشيخ."]]}, {"l": "Isa 3:6-8", "n": "", "vs": [[6, "عندئذ يقبض الإنسان على أخيه في بيت أبيه قائلا له: «إن عندك ثوبا، فاملك علينا لتنقذنا من هذه الفوضى»."], [7, "فيجيبهم قائلا: «لست طبيبا، ولا أملك طعاما أو ثيابا في بيتي، فلا تجعلوني رئيسا للشعب»."], [8, "قد كبت أورشليم؛ انهارت يهوذا لأنهما أساءتا بالقول والفعل إلى الرب وتمردتا على سلطانه."]]}, {"l": "Isa 24:17-20", "n": "", "vs": [[17, "فالرعب والحفرة والفخ عليكم ياساكني الأرض."], [18, "وكل من يهرب من صوت الرعب يقع في الحفرة، ومن يتسلق الحفرة ناجيا يعلق بالفخ، لأن الهلاك يهبط عليكم من السماء، وتتزلزل الأرض تحت أقدامكم."], [19, "فالأرض متصدعة، والمسكونة متشققة ومتزلزلة."], [20, "ترنحت الأرض كالسكارى، وتمايلت كخيمة الناطور وناءت تحت ثقل إثمها فتهاوت ولم تنهض."]]}, {"l": "Jer 48:44", "n": "", "vs": [[44, "من يهرب من الخوف يقع في الحفرة، ومن يصعد من الحفرة يعلق بالفخ، لأني أجلب على موآب هذه المحن في سنة عقابهم، يقول الرب."]]}, {"l": "Eze 5:12", "n": "", "vs": [[12, "ثلث سكانك يموتون بالوباء والجوع في وسطك، وثلث ثان يقتل حولك بالسيف، وثلث أخير أشتته بين الأمم وأتعقبه بسيف مسلول."]]}, {"l": "Amo 2:14-16", "n": "", "vs": [[14, "فلا يتاح الهرب للسريع، وتتلاشى قوة الجبار، ويعجز القوي عن إنقاذ نفسه."], [15, "ولا يصمد رامي القوس ولا يصيب الهدف، ولا يسلم سريع العدو، ولا ينجو راكب الفرس بحياته."], [16, "والثابت الجنان بين أقرانه الأبطال يفر عريانا في ذلك اليوم، يقول الرب."]]}, {"l": "Amo 9:1-4", "n": "", "vs": [[1, "ورأيت السيد واقفا إلى جوار المذبح قائلا: «اضرب تيجان الأعمدة حتى تهتز العتبات، وحطمها على رؤوس جميع الشعب. ومن ينجو منهم أهلكه بالسيف، فلا يهرب منهم أحد ولا يفلت منهم ناج."], [2, "وإن نقبوا لأنفسهم ملجأ في أعماق الهاوية، فإن يدي تطولهم هناك، وإن ارتقوا إلى السماوات فمن هناك أنزلهم."], [3, "وإن اختبأوا في أعالي الكرمل فهناك أبحث عنهم وأعتقلهم. وإن تواروا عني في أعماق البحر فإني آمر هناك الحية فتلدغهم."], [4, "وإن سيقوا إلى السبي أمام أعدائهم ألاحقهم بالسيف لأفنيهم، وأتعقبهم لأبتليهم بالشر لا بالخير»."]]}], "kwAr": "وما تدخرينه", "noteAr": ""}], "arS": [["ستأكلين", ["H398"]], [" ", []], ["ولا", ["H3808"]], [" ", []], ["تشبعين", ["H7646"]], ["، ويظل ", []], ["جوفك", ["H7130"]], [" ", []], ["خاويا", ["H3445"]], [". ", []], ["وما", ["H834"]], [" ", []], ["تدخرينه", ["H5253"]], [" ", []], ["تعجزين", ["H3808"]], [" عن ", []], ["الاحتفاظ", ["H6403"]], [" به. لأني ", []], ["أدفعه", ["H5414"]], [" ", []], ["للسيف", ["H2719"]], [".", []]]}, {"c": 6, "v": 15, "text": "تزرعين ولا تحصدين. تعصرين الزيتون ولا تدهني بزيته، وتعصرين العنب ولا تشربين من خمره.", "groups": [{"kw": "", "raw": "Lev_26:20; Deu_28:38-40; Isa_62:8, Isa_62:9, Isa_65:21, Isa_65:22; Jer_12:13; Joe_1:10-12; Amo_5:11; Zep_1:13; Hag_1:6", "note": "", "refs": [{"l": "Lev 26:20", "n": "", "vs": [[20, "فيذهب جهدكم باطلا لأن أرضكم لن تعطي غلتها، وأشجار الأرض لن تعطي أثمارها."]]}, {"l": "Deu 28:38-40", "n": "", "vs": [[38, "تبذرون كثيرا من البذار في الحقول، ولا تحصدون إلا القليل، لأن الجراد يلتهمه."], [39, "تكدحون في غرس كروم ومن خمرها لا تشربون، ومن ثمرها لا تجنون، لأن الدود ينخرها."], [40, "تكتظ أراضيكم بأشجار الزيتون، ولكن من زيتها لا تدهنون، لأن زيتونكم ينتثر على الأرض قبل نضجه."]]}, {"l": "Isa 62:8", "n": "", "vs": [[8, "قد أقسم الرب بيمينه وبذراعه القديرة قائلا: لن أعطي حنطتك من بعد طعاما لأعدائك، ولن يشرب الغرباء خمرك التي تعبت فيها،"]]}, {"l": "Isa 62:9", "n": "", "vs": [[9, "بل يأكلها الذين تكبدوا مشقة زرعها، ويحمدون الله . والذين جنوا الكرم يشربون الخمر في ساحات مقدسي."]]}, {"l": "Isa 65:21", "n": "", "vs": [[21, "يغرس الناس كرومهم ويأكلون ثمارها، ويبنون بيوتهم ويقيمون فيها،"]]}, {"l": "Isa 65:22", "n": "", "vs": [[22, "لا يبنون ليأتي آخر فيسكن فيها، ولا يغرسون كروما ليجنيها آخر، لأن أيام شعبي تكون مديدة كأيام الشجر، ويتمتع مختاري بعمل أيديهم."]]}, {"l": "Jer 12:13", "n": "", "vs": [[13, "زرع شعبي حنطة وحصد شوكا. أعيوا أنفسهم ولكن من غير جدوى، لذلك يعتريهم الخزي من قلة غلات محصولهم لفرط احتدام غضب الرب»."]]}, {"l": "Joe 1:10-12", "n": "", "vs": [[10, "قد خربت الحقول، وناحت الأرض لأن الحنطة تلفت والخمرة انقطعت، وافتقد زيت الزيتون."], [11, "اخزوا أيها الحراثون وأعولوا أيها الكرامون على الحنطة والشعير، لأن حصاد الحقل قد تلف."], [12, "قد ذوى الكرم وذبل التين والرمان والنخيل والتفاح ويبست سائر أشجار الحقل، وزالت البهجة من أبناء البشر."]]}, {"l": "Amo 5:11", "n": "", "vs": [[11, "فلأنكم تطأون المسكين وتبتزون منه رشوة قمح حتى تشيدوا بيوتا من حجارة منحوتة، فإنكم لن تسكنوا فيها، وتغرسوا كروما شهية ولكنكم لن تشربوا من خمرها."]]}, {"l": "Zep 1:13", "n": "", "vs": [[13, "فتصبح ثروتهم غنيمة، وبيوتهم خرابا. يشيدون بيوتا ولا يسكنون فيها، ويغرسون كروما ولا يشربون من خمرها."]]}, {"l": "Hag 1:6", "n": "", "vs": [[6, "لقد زرعتم كثيرا وحصدتم قليلا. أكلتم ولم تشبعوا. شربتم ولم ترتووا. اكتسيتم ولم تستدفئوا. ومن ينال أجرة سرعان ما تتبدد، وكأنها وضعت في صرة مثقوبة»."]]}], "kwAr": "", "noteAr": ""}], "arS": [["تزرعين", ["H2232"]], [" ", []], ["ولا", ["H3808"]], [" ", []], ["تحصدين", ["H7114"]], [". ", []], ["تعصرين", ["H1869"]], [" ", []], ["الزيتون", ["H2132"]], [" ", []], ["ولا", ["H3808"]], [" ", []], ["تدهني", ["H5480"]], [" ", []], ["بزيته", ["H8081"]], ["، ", []], ["وتعصرين", ["H1869"]], [" ", []], ["العنب", ["H8492"]], [" ", []], ["ولا", ["H3808"]], [" ", []], ["تشربين", ["H8354"]], [" من ", []], ["خمره", ["H3196"]], [".", []]]}, {"c": 6, "v": 16, "text": "لأنك قد مارست فرائض عمري، ونهجت على غرار أخآب، وسلكت في مشوراتهم. لذلك أجعلك خرابا، وشعبك مثار سخرية، وتقاسون من احتقار الأمم.", "groups": [{"kw": "the statutes of Omri are kept", "raw": "or, he doth much keep the, etc. 1Ki_16:25-30; Hos_5:11", "note": "or, he doth much keep the, etc. 1Ki_16:25-30; Hos_5:11", "refs": [{"l": "1Ki 16:25-30", "n": "", "vs": [[25, "وارتكب عمري الشر في عيني الرب حتى فاق إثمه جميع الذين قبله،"], [26, "واقترف خطايا يربعام بن نباط، وسلك في سبله التي أضل بها إسرائيل فاستثاروا بضلالهم غيظ الرب إلههم."], [27, "أما بقية أخبار عمري وما قام به من أعمال ومن بأس، أليست هي مدونة في كتاب أخبار أيام ملوك إسرائيل؟"], [28, "ومات عمري ودفن في السامرة، وخلفه ابنه أخآب على العرش."], [29, "وملك أخآب بن عمري على إسرائيل في السنة الثامنة والثلاثين لحكم آسا ملك يهوذا، ودامت ولايته على إسرائيل في السامرة مدة اثنتين وعشرين سنة."], [30, "وارتكب أخآب بن عمري الشر في عيني الرب، حتى فاق إثمه جميع أسلافه."]]}, {"l": "Hos 5:11", "n": "", "vs": [[11, "لقد لحق الضيق بإسرائيل، وسحقه القضاء لأنه وطد العزم على الغواية وراء الأوثان."]]}], "kwAr": "مارست فرائض عمري", "noteAr": "أو: «هو يحفظ كثيرا» إلخ. انظر 1مل 16: 25-30؛ هو 5: 11"}, {"kw": "the works", "raw": "1Ki_16:30-33, 1Ki_18:4, 1Ki_21:25, 1Ki_21:26; 2Ki_16:3, 2Ki_21:3; Isa_9:16; Rev_2:20", "note": "", "refs": [{"l": "1Ki 16:30-33", "n": "", "vs": [[30, "وارتكب أخآب بن عمري الشر في عيني الرب، حتى فاق إثمه جميع أسلافه."], [31, "وكأنما كان الانهماك في ارتكاب خطايا يربعام بن نباط أمرا تافها، فتزوج من إيزابل ابنة أثبعل ملك الصيدونيين، وغوى وراء البعل وسجد له."], [32, "وشيد مذبحا للبعل في معبد البعل الذي بناه في السامرة."], [33, "وأقام أخآب منحوتات الأصنام، وتفاقم شر أعماله ليثير غيظ الرب إله إسرائيل أكثر من سائر ملوك إسرائيل السابقين."]]}, {"l": "1Ki 18:4", "n": "", "vs": [[4, "فحين شرعت إيزابل في قتل أنبياء الرب، أخذ عوبديا مئة نبي وخبأهم خمسين خمسين في مغارتين، وتكفل بإعالتهم بالطعام والماء."]]}, {"l": "1Ki 21:25", "n": "", "vs": [[25, "ولم يكن نظير أخآب الذي أغوته زوجته إيزابل، فباع نفسه لارتكاب الشر في عيني الرب."]]}, {"l": "1Ki 21:26", "n": "", "vs": [[26, "فقد غرق في حمأة الرجاسة بعبادته الأصنام، مثلما فعل الأموريون الذين طردهم الرب من أمام بني إسرائيل."]]}, {"l": "2Ki 16:3", "n": "", "vs": [[3, "متمثلا بملوك إسرائيل، حتى إنه أجاز ابنه في النار، وفقا لأرجاس الأمم الذين طردهم الرب من أمام بني إسرائيل."]]}, {"l": "2Ki 21:3", "n": "", "vs": [[3, "فعاد وشيد معابد المرتفعات التي هدمها أبوه حزقيا، وأقام مذابح البعل، ونصب تماثيل عشتاروث على غرار ما صنع أخآب، وسجد لكواكب السماء وعبدها."]]}, {"l": "Isa 9:16", "n": "", "vs": [[16, "فمرشدو هذا الشعب يضلونه، والمرشدون يبتلعون."]]}, {"l": "Rev 2:20", "n": "", "vs": [[20, "ولكن لي عليك أنك تتساهل مع هذه المرأة إيزابل، التي تدعي أنها نبية، فتعلم عبيدي وتغويهم أن يزنوا ويأكلوا من الذبائح المقدمة للأصنام."]]}], "kwAr": "ونهجت على غرار أخآب", "noteAr": ""}, {"kw": "ye walk", "raw": "Psa_1:1; Jer_7:24", "note": "", "refs": [{"l": "Psa 1:1", "n": "", "vs": [[1, "طوبى للإنسان الذي لا يتبع مشورة الأشرار، ولا يقف في طريق الخاطئين، ولا يجالس المستهزئين."]]}, {"l": "Jer 7:24", "n": "", "vs": [[24, "إلا أنهم لم يطيعوا ولم يسمعوا، بل سلكوا بمقتضى مشورات قلوبهم الشريرة وعنادهم، وأداروا لي ظهورهم بدل وجوههم."]]}], "kwAr": "وسلكت", "noteAr": ""}, {"kw": "that", "raw": "1Ki_9:8; 2Ch_29:8, 2Ch_29:9, 2Ch_34:25; Jer_18:15, Jer_18:16, Jer_19:8, Jer_21:8, Jer_21:9; Eze_8:17, Eze_8:18", "note": "", "refs": [{"l": "1Ki 9:8", "n": "", "vs": [[8, "ويصبح هذا الهيكل عبرة يثير عجب كل من يمر به، فيصفر ويتساءل: لماذا صنع الرب هكذا بهذه الأرض وبهذا الهيكل؟"]]}, {"l": "2Ch 29:8", "n": "", "vs": [[8, "فانصب غضب الرب على يهوذا وأورشليم، وجعلهم محل رعب ودهشة واحتقار، كما أنتم تشهدون الآن."]]}, {"l": "2Ch 29:9", "n": "", "vs": [[9, "وهوذا آباؤنا قد سقطوا صرعى السيف، وأبناؤنا وبناتنا ونساؤنا في الأسر من جراء هذا."]]}, {"l": "2Ch 34:25", "n": "", "vs": [[25, "لأنهم نبذوني وأوقدوا لآلهة أخرى، ليثيروا سخطي بما تجنيه أيديهم من آثام، فينسكب غضبي الذي لا ينطفيء على هذا الموضع."]]}, {"l": "Jer 18:15", "n": "", "vs": [[15, "لكن شعبي قد نسيني وأحرق بخورا لأوثان باطلة، جعلته يتعثر في طرقه، في السبل القديمة، فسلك في ممرات وطرق غير معبدة."]]}, {"l": "Jer 18:16", "n": "", "vs": [[16, "فتصبح أرضه خرابا، مثار صفير دهشة، وكل من يعبر بها يعتريه رعب ويهز رأسه."]]}, {"l": "Jer 19:8", "n": "", "vs": [[8, "وأدمر هذه المدينة وأجعلها مثار صفير. كل من يمر بها تعتريه الدهشة ويصفر لما حل بها من نكبات."]]}, {"l": "Jer 21:8", "n": "", "vs": [[8, "وتقول لهذا الشعب: هذا ما يعلنه الرب: ها أنا أعرض أمامكم طريق الحياة وطريق الموت."]]}, {"l": "Jer 21:9", "n": "", "vs": [[9, "فمن يمكث في هذه المدينة يموت بالسيف والجوع والوباء، ومن يلجأ إلى الكلدانيين الذين يحاصرونكم ويستسلم لهم يحيا ويغنم نفسه."]]}, {"l": "Eze 8:17", "n": "", "vs": [[17, "فقال لي: «أشهدت ياابن آدم؟ أقليل ما ارتكبه شعب يهوذا من رجاسات هنا؟ فقد عاثوا في الأرض فسادا، وثابروا على إغاظتي، وقربوا كل ما هو منتن في هيكلي"]]}, {"l": "Eze 8:18", "n": "", "vs": [[18, "لذلك أعاقبهم بالغضب، ولا تترَأف عيني عليهم، ولا أعفو، وإن استغاثوا بصوت عال لا أستجيب لهم»."]]}], "kwAr": "لذلك", "noteAr": ""}, {"kw": "desolation", "raw": "or, astonishment", "note": "or, astonishment", "refs": [], "kwAr": "خرابا", "noteAr": "أو: «دهشة»."}, {"kw": "therefore", "raw": "Psa_44:13; Isa_25:8 هم ", []], ["يقتنص", ["H6679"]], [" ", []], ["أخاه", ["H251"]], [".", []]]}, {"c": 7, "v": 3, "text": "تجد أيديهم في ارتكاب الشر، ويسعى الرئيس والقاضي وراء الرشوة، ويملي العظيم عليهم أهواء نفسه، فيتآمرون جميعا على الحق.", "groups": [{"kw": "do", "raw": "Pro_4:16, Pro_4:17; Jer_3:5; Eze_22:6", "note": "", "refs": [{"l": "Pro 4:16", "n": "", "vs": [[16, "فإنهم لا يركنون إلى النوم ما لم يسيئوا، ويفارقهم النعاس ما لم يعثروا أحدا."]]}, {"l": "Pro 4:17", "n": "", "vs": [[17, "لأنهم يأكلون خبز الشر ويشربون خمر الظلم."]]}, {"l": "Jer 3:5", "n": "", "vs": [[5, "أيظل غاضبا دائما؟ أيبقى ساخطا إلى الأبد؟ انظري، هذا ما نطقت به، ولكنك ارتكبت كل ما استطعت من شر»."]]}, {"l": "Eze 22:6", "n": "", "vs": [[6, "هوذا كل واحد من رؤساء إسرائيل ممن كانوا فيك انهمك في سفك الدماء على قدر طاقته."]]}], "kwAr": "ارتكاب الشر", "noteAr": ""}, {"kw": "the prince", "raw": "Mic_3:11; Isa_1:23; Jer_8:10; Eze_22:27; Hos_4:18; Amo_5:12; Mat_26:15", "note": "", "refs": [{"l": "Mic 3:11", "n": "", "vs": [[11, "إذ يحكم رؤساؤها بالرشوة، وكهنتها يعلمون بالأجرة ويتعاطى أنبياؤها العرافة لقاء المال، ومع ذلك يدعون الاتكال على الله قائلين: «أليس الرب في وسطنا؟ لذلك لن يصيبنا مكروه»."]]}, {"l": "Isa 1:23", "n": "", "vs": [[23, "أصبح رؤساؤك عصاة وشركاء لصوص، يولعون بالرشوة ويسعون وراء الهبات، لا يدافعون عن اليتيم، ولا ترفع إليهم دعوى الأرملة»."]]}, {"l": "Jer 8:10", "n": "", "vs": [[10, "لذلك أعطي نساءهم لآخرين وحقولهم للوارثين القاهرين، لأنهم جميعا من صغيرهم إلى كبيرهم مولعون بالربح. حتى النبي والكاهن يرتكبان الزور في أعمالهما،"]]}, {"l": "Eze 22:27", "n": "", "vs": [[27, "رؤساؤها فيها كذئاب خاطفة تمزق فرائسها إذ يسفكون دماء الناس في سبيل الربح الحرام."]]}, {"l": "Hos 4:18", "n": "", "vs": [[18, "وحالما ينضب خمرهم ينغمسون في فسادهم، مفضلين العار على الشرف."]]}, {"l": "Amo 5:12", "n": "", "vs": [[12, "لأنني عالم بكثرة معاصيكم وعظم خطاياكم، إذ أنكم تضايقون البار أيها المرتشون الذين تصدون المسكين عن حقه في ساحة القضاء."]]}, {"l": "Mat 26:15", "n": "", "vs": [[15, "وقال: «كم تعطونني لأسلمه إليكم؟» فوزنوا له ثلاثين قطعة من الفضة."]]}], "kwAr": "الرئيس", "noteAr": ""}, {"kw": "the great", "raw": "1Ki_21:9-14", "note": "", "refs": [{"l": "1Ki 21:9-14", "n": "", "vs": [[9, "وقالت فيها: «ادعوا الشعب للصوم، وأجلسوا نابوت في مكان الصدارة،"], [10, "وأقيموا شاهدي زور ليشهدا أن نابوت جدف على الله وعلى الملك، ثم أخرجوه من المدينة وارجموه حتى يموت»."], [11, "فنفذ شيوخ مدينته ووجهاؤها أوامر إيزابل كما هي واردة في الرسائل التي بعثت بها إليهم."], [12, "فتداعوا للصوم، وأجلسوا نابوت في مكان الصدارة."], [13, "ثم أقبل شاهدا زور وجلسا تجاهه، وشهدا على نابوت أمام الشعب قائلين: «قد جدف نابوت على الله وعلى الملك». فجروه إلى خارج المدينة ورجموه بالحجارة حتى مات."], [14, "وأبلغوا إيزابل أن نابوت قد رجم فمات."]]}], "kwAr": "العظيم", "noteAr": ""}, {"kw": "his mischievous desire", "raw": "Heb. the mischief of his soul", "note": "Heb. the mischief of his soul", "refs": [], "kwAr": "أهواء نفسه", "noteAr": "بالعبرية: «شر نفسه»."}, {"kw": "wrap", "raw": "Isa_26:21; Luk_12:1, Luk_12:2; 1Co_4:5", "note": "", "refs": [{"l": "Isa 26:21", "n": "", "vs": [[21, "وانظروا فإن الرب خارج من مكانه ليعاقب سكان الأرض على آثامهم، فتكشف الأرض عما سفك عليها من دماء ولا تغطي قتلاها فيما بعد."]]}, {"l": "Luk 12:1", "n": "", "vs": [[1, "وفي تلك الأثناء، إذ احتشد عشرات الألوف من الشعب حتى داس بعضهم بعضا، أخذ يقول لتلاميذه أولا: «احذروا لأنفسكم من خمير الفريسيين الذي هو الريا ء!"]]}, {"l": "Luk 12:2", "n": "", "vs": [[2, "فما من مستور لن يكشف، ولا من سر لن يعرف."]]}, {"l": "1Co 4:5", "n": "", "vs": [[5, "إذن، لا تحكموا في شيء قبل الأوان، ريثما يرجع الرب الذي سيسلط النور على الأشياء التي يحجبها الظلام الآن، ويكشف نيات القلوب، عندئذ ينال كل واحد حقه من المدح من عند الله!"]]}], "kwAr": "فيتآمرون", "noteAr": ""}], "arS": [["تجد", ["H3190"]], [" ", []], ["أيديهم", ["H3709"]], [" في ارتكاب ", []], ["الشر", ["H5921", "H7451"]], ["، ", []], ["ويسعى", ["H7592"]], [" ", []], ["الرئيس", ["H8269"]], [" ", []], ["والقاضي", ["H8199"]], [" وراء ", []], ["الرشوة", ["H7966"]], ["، ", []], ["ويملي", ["H1696"]], [" ", []], ["العظيم", ["H1419"]], [" عليهم ", []], ["أهواء", ["H1942"]], [" ", []], ["نفسه", ["H5315"]], ["، ", []], ["فيتآمرون", ["H5686"]], [" جميعا على الحق.", []]]}, {"c": 7, "v": 4, "text": "أفضلهم مثل العوسج، وأكثرهم استقامة أسوأ من سياج الشوك. وها يوم عقابكم الذي أنذر به أنبياؤكم قد وافى. عندئذ يعتريكم الارتباك.", "groups": [{"kw": "", "raw": "is a, 2Sa_23:6, 2Sa_23:7; Isa_55:13; Eze_2:6; Heb_6:8", "note": "is a, 2Sa_23:6, 2Sa_23:7; Isa_55:13; Eze_2:6; Heb_6:8", "refs": [{"l": "2Sa 23:6", "n": "", "vs": [[6, "أما الأشرار فيطرحون جميعا كالشوك، لأنهم (يجرحون) اليد التي تلمسهم."]]}, {"l": "2Sa 23:7", "n": "", "vs": [[7, "وكل من يمسهم يتسلح بحديد وقناة رمح، وتلتهمهم النار جميعا في مكانهم»."]]}, {"l": "Isa 55:13", "n": "", "vs": [[13, "وحيث كان الشوك والقراص، تنمو أشجار السرو والآس: فيكون ذلك تخليدا لاسم الرب وعلامة أبدية لا تمحى."]]}, {"l": "Eze 2:6", "n": "", "vs": [[6, "أما أنت، ياابن آدم، فلا ترهبهم ولا تخش كلامهم، وإن كانوا لك قريسا وشوكا. وأنت ساكن بين عقارب، فلا ترهب كلامهم، ولا تفزع من محضرهم لأنهم شعب متمرد."]]}, {"l": "Heb 6:8", "n": "", "vs": [[8, "ولكنها، إن أخرجت الشوك والعشب البري، تكون مرفوضة وتستحق اللعنة، وما نهايتها إلا الحريق."]]}], "kwAr": "", "noteAr": "«أكثرهم استقامة» هو كسياج شوك. انظر 2صم 23: 6، 7؛ إش 55: 13؛ حز 2: 6؛ عب 6: 8"}, {"kw": "the day", "raw": "Eze_12:23, Eze_12:24; Hos_9:7, Hos_9:8; Amo_8:2", "note": "", "refs": [{"l": "Eze 12:23", "n": "", "vs": [[23, "لذلك قل لهم: هذا ما يعلنه السيد الرب: ها أنا قد أبطلت هذا المثل فلا يعودون يرددونه في إسرائيل، بل قل لهم: قد أزفت الأيام وحان تحقيق كلام كل رؤيا،"]]}, {"l": "Eze 12:24", "n": "", "vs": [[24, "إذ لن تكون بعد رؤيا باطلة ولا عرافة متملقة في وسط شعب إسرائيل."]]}, {"l": "Hos 9:7", "n": "", "vs": [[7, "لقد أزفت أيام العقاب وحان يوم الحساب، فليعلم إسرائيل هذا. لكثرة إثمك وفرط حقدك حسب النبي أحمق، ورجل الروح مجنونا."]]}, {"l": "Hos 9:8", "n": "", "vs": [[8, "إن النبي هو رقيب أفرايم شعب إلهي، غير أن فخ صياد قد نصب في كل طرقه، وطغى الحقد على بيت إلهي."]]}, {"l": "Amo 8:2", "n": "", "vs": [[2, "وسألني: «ماذا ترى ياعاموس؟» فأجبت: «سلة مليئة بثمار الصيف الناضجة». فقال لي الرب: «لقد دنت نهاية شعبي إسرائيل ولن أعفو عنهم بعد."]]}], "kwAr": "يوم عقابكم", "noteAr": ""}, {"kw": "thy", "raw": "Isa_10:3; Jer_8:12, Jer_10:15", "note": "", "refs": [{"l": "Isa 10:3", "n": "", "vs": [[3, "فماذا تصنعون في يوم العقاب عندما تقبل الكارثة من بعيد؟ إلى من تلجأون طلبا للعون، وأين تودعون ثروتكم؟"]]}, {"l": "Jer 8:12", "n": "", "vs": [[12, "هل خجلوا عندما اقترفوا الرجس؟ كلا! لم يخزوا قط ولم يعرفوا الخجل. لذلك سيسقطون بين الساقطين، وحين أعاقبهم يطوح بهم»، يقول الرب."]]}, {"l": "Jer 10:15", "n": "", "vs": [[15, "جميع الأصنام باطلة، صنعة ضلال، وفي زمن عقابها تبيد."]]}], "kwAr": "أنبياؤكم", "noteAr": ""}, {"kw": "now", "raw": "Isa_22:5; Luk_21:25", "note": "", "refs": [{"l": "Isa 22:5", "n": "", "vs": [[5, "لأن للسيد الرب القدير في أورشليم يوما يبث فيه الرعب، والذلة، والفوضى. فيه ينقب أهلها الأسوار ويستجيرون بالجبال."]]}, {"l": "Luk 21:25", "n": "", "vs": [[25, "وستظهر علامات في الشمس والقمر والنجوم، وتكون على الأرض ضيقة على الأمم الواقعة في حيرة، لأن البحر والأمواج تعج وتجيش،"]]}], "kwAr": "عندئذ", "noteAr": ""}], "arS": [["أفضلهم", ["H2896"]], [" مثل ", []], ["العوسج", ["H2312"]], ["، وأكثرهم ", []], ["استقامة", ["H3477"]], [" ", []], ["أسوأ", ["H4480"]], [" من ", []], ["سياج", ["H4534"]], [" الشوك. وها ", []], ["يوم", ["H3117"]], [" ", []], ["عقابكم", ["H6486"]], [" الذي أنذر به ", []], ["أنبياؤكم", ["H6822"]], [" قد ", []], ["وافى", ["H935"]], [". ", []], ["عندئذ", ["H6258"]], [" ", []], ["يعتريكم", ["H1961"]], [" ", []], ["الارتباك", ["H3998"]], [".", []]]}, {"c": 7, "v": 5, "text": "لا تأتمن جارك ولا تثق بصديق، واحترس مما تنطق به شفتاك ممن ترقد في حضنك.", "groups": [{"kw": "ye not in", "raw": "Job_6:14, Job_6:15; Psa_118:8, Psa_118:9; Jer_9:4; Mat_10:16", "note": "", "refs": [{"l": "Job 6:14", "n": "", "vs": [[14, "الإنسان المكروب يحتاج إلى وفاء أصدقائه، حتى لو تخلى عن خشية القدير."]]}, {"l": "Job 6:15", "n": "", "vs": [[15, "قد غدر بي إخواني كسيل انقطع ماؤه، وكمياه الأودية العابرة،"]]}, {"l": "Psa 118:8", "n": "", "vs": [[8, "اللجوء إلى الرب خير من الاعتماد على البشر."]]}, {"l": "Psa 118:9", "n": "", "vs": [[9, "اللجوء إلى الرب خير من الاعتماد على العظماء."]]}, {"l": "Jer 9:4", "n": "", "vs": [[4, "«ليحترس كل واحد من جاره، ولا يثق بأحد من أقربائه، لأن كل قريب مخادع، وكل صاحب واش."]]}, {"l": "Mat 10:16", "n": "", "vs": [[16, "ها أنا أرسلكم مثل الخراف بين الذئاب، فكونوا متنبهين كالحيات ومسالمين كالحمام."]]}], "kwAr": "لا تأتمن", "noteAr": ""}, {"kw": "keep", "raw": "Judg. 16:5-20", "note": "", "refs": [{"l": "Jdg 16:5-20", "n": "", "vs": [[5, "فجاء إليها أقطاب الفلسطينيين وقالوا لها: «تملقي شمشون إلى أن تكتشفي منه سر قوته العظيمة، وكيف يمكننا أن نتغلب عليه ونوثقه فنذله فيكافئك كل واحد منا بألف ومئة شاقل من الفضة(نحو مئة واثنين وثلاثين كيلو جراما)»."], [6, "فقالت دليلة لشمشون: «أخبرني ما هو سر قوتك العظيمة وكيف يتسنى تقييدك وإذلالك»"], [7, "فأجابها شمشون: «إذا أوثقوني بسبعة أوتار طرية لم تجف بعد، أصبح ضعيفا كأي واحد من الناس»."], [8, "فأحضر لها أقطاب الفلسطينيين سبعة أوتار طرية لم تجف بعد، فأوثقته بها."], [9, "وكان الكمين متربصا به في حجرتها، فقالت له: «الفلسطينيون قادمون عليك ياشمشون». فقطع الأوتار وكأنها خيوط شيطتها النار، ولم يكتشف سر قوته."], [10, "فقالت له دليلة: «لقد خدعتني وكذبت علي. فأخبرني الآن كيف توثق؟»"], [11, "فأجابها: «إذا أوثقوني بحبال جديدة، أصبح ضعيفا كأي واحد من الناس»."], [12, "فأخذت دليلة حبالا جديدة وأوثقته بها، وقالت له: «الفلسطينيون قادمون عليك ياشمشون». وكان الكمين يتربص به في الحجرة، فقطع الحبال عن ذراعيه وكأنها خيوط."], [13, "فقالت دليلة لشمشون: «أنت مازلت تكذب علي وتخدعني، فأخبرني بماذا توثق؟» فأجابها: «إن ضفرت خصلات شعري السبع بمغزل وثبتها بوتد، فإنني أصبح ضعيفا كأي واحد من الناس. وبينما كان يغط في نوم عميق ضفرت دليلة خصلات شعره السبع بمغزل."], [14, "وثبتتها بوتد، ونادته ثانية: «الفلسطينيون قادمون عليك ياشمشون» فانتبه من نومه وخلع وتد النسيج مع المغزل."], [15, "فقالت له: «كيف تدعي أنك تحبني وقلبك لا يثق بي؟ قد خدعتني ثلاث مرات ولم تطلعني على سر قوتك العظيمة»."], [16, "وظلت تلح عليه وتزعجه كل يوم بمثل هذا الكلام حتى ضاقت نفسه إلى الموت."], [17, "فكشف لها عن مكنون قلبه، وقال لها: «إنني نذير الرب منذ مولدي، لهذا لم أحلق شعري. وإن حلقته فإن قوتي تفارقني وأصبح ضعيفا كأي واحد من الناس»."], [18, "ولما أدركت دليلة أنه قد أسر لها بمكنون قلبه، استدعت أقطاب الفلسطينيين قائلة: «تعالوا هذه المرة، فقد أطلعني على سر قوته». فأقبل عليها أقطاب الفلسطينيين حاملين معهم الفضة."], [19, "فأضجعته على ركبتيها واستدعت رجلا حلق له خصلات شعره السبع، وشرعت في إذلاله بعد أن فارقته قوته."], [20, "وقالت: «الفلسطينيون قادمون عليك ياشمشون» فاستيقظ من نومه وقال: «أقوم مثل كل مرة وأنتفض». ولم يعلم أن الرب قد فارقه."]]}], "kwAr": "واحترس", "noteAr": ""}], "arS": [["لا", ["H408"]], [" ", []], ["تأتمن", ["H539"]], [" ", []], ["جارك", ["H7453"]], [" ", []], ["ولا", ["H408"]], [" ", []], ["تثق", ["H982"]], [" ", []], ["بصديق", ["H441"]], ["، ", []], ["واحترس", ["H8104"]], [" مما تنطق به ", []], ["شفتاك", ["H6607", "H6310"]], [" ", []], ["ممن", ["H4480"]], [" ", []], ["ترقد", ["H7901"]], [" في ", []], ["حضنك", ["H2436"]], [".", []]]}, {"c": 7, "v": 6, "text": "فإن الابن يستخف بأبيه والابنة تتمرد على أمها، والكنة على حماتها، وأعداء الإنسان أهل بيته.", "groups": [{"kw": "son", "raw": "Gen_9:22-24, Gen_49:4; 2Sa_15:10-12, 2Sa_16:11, 2Sa_16:21-23; Pro_30:11, Pro_30:17; Eze_22:7; Mat_10:21, Mat_10:35, Mat_10:36; Luk_12:53, Luk_21:16; 2Ti_3:2, 2Ti_3:3", "note": "", "refs": [{"l": "Gen 9:22-24", "n": "", "vs": [[22, "فشاهد حام أبو الكنعانيين عري أبيه، فخرج وأخبر أخويه اللذين كانا خارجا."], [23, "فأخذ سام ويافث رداء ووضعاه على أكتافهما ومشيا القهقرى إلى داخل الخيمة، وسترا عري أبيهما من غير أن يستديرا بوجهيهما نحوه فيبصرا عريه."], [24, "وعندما أفاق نوح من سكره وعلم ما فعله به ابنه الصغير"]]}, {"l": "Gen 49:4", "n": "", "vs": [[4, "لكنك فائر كالماء لذلك لن تظل متفوقا، لأنك اضطجعت في فراش أبيك. صعدت على سريري فدنسته."]]}, {"l": "2Sa 15:10-12", "n": "", "vs": [[10, "وبث أبشالوم جواسيس في أوساط جميع أسباط إسرائيل قائلا: «إن سمعتم نفير البوق، فقولوا: قد ملك أبشالوم في حبرون»."], [11, "ورافق أبشالوم مئتا رجل من أورشليم لبوا دعوته عن طيب نية غير عالمين بشيء."], [12, "وفي أثناء تقريبه ذبائح، استدعى أبشالوم أخيتوفل الجيلوني مشير داود، من بلدته جيلوه. وتفاقمت الفتنة وازداد التفاف الشعب حول أبشالوم."]]}, {"l": "2Sa 16:11", "n": "", "vs": [[11, "وقال الملك لأبيشاي وسائر رجاله: «هوذا ابني الذي خرج من صلبي يسعى لقتلي، فكم بالحري هذا البنياميني. دعوه يشتم لأن الرب أمره بشتمي."]]}, {"l": "2Sa 16:21-23", "n": "", "vs": [[21, "فأجاب أخيتوفل: «ادخل وضاجع محظيات أبيك اللواتي تركهن للمحافظة على القصر، فيسمع جميع بني إسرائيل أنك قد صرت مكروها لدى أبيك، فتتشدد أيدي مناصريك»."], [22, "فنصبوا لأبشالوم الخيمة على السطح، ودخل لمضاجعة محظيات أبيه على مرأى جميع الإسرائيليين."], [23, "وكانت مشورات أخيتوفل التي يسديها في تلك الأيام تحظى بقبول داود وأبشالوم لأنها كانت في اعتبارهما كأنها صادرة عن فم الله."]]}, {"l": "Pro 30:11", "n": "", "vs": [[11, "رب جيل يشتم أباه ولا يبارك أمه."]]}, {"l": "Pro 30:17", "n": "", "vs": [[17, "العين الساخرة بالأب، والتي تحتقر طاعة أمها، تقتلعها غربان الوادي، وتلتهمها فراخ النسور."]]}, {"l": "Eze 22:7", "n": "", "vs": [[7, "فيك استخفوا بأب وأم وجاروا في وسطك على الغريب، واضطهدوا اليتيم والأرملة،"]]}, {"l": "Mat 10:21", "n": "", "vs": [[21, "وسوف يسلم الأخ أخاه إلى الموت، والأب ولده. ويتمرد الأولاد على والديهم، ويقتلونهم!"]]}, {"l": "Mat 10:35", "n": "", "vs": [[35, "فإني جئت لأجعل الإنسان على خلاف مع أبيه، والبنت مع أمها، والكنة مع حماتها."]]}, {"l": "Mat 10:36", "n": "", "vs": [[36, "وهكذا يصير أعداء الإنسان أهل بيته."]]}, {"l": "Luk 12:53", "n": "", "vs": [[53, "فالآب ينقسم على ابنه، والابن على أبيه، والأم على بنتها، والبنت على أمها، والحماة على كنتها، والكنة على حماتها!»"]]}, {"l": "Luk 21:16", "n": "", "vs": [[16, "وسوف يسلمكم حتى الوالدون والإخوة والأقرباء والأصدقاء، ويقتلون بعضا منكم،"]]}, {"l": "2Ti 3:2", "n": "", "vs": [[2, "إذ يكون الناس محبين لأنفسهم، محبين للمال، متكبرين، مباهين بأنفسهم، شتامين، غير مطيعين لوالديهم، ناكرين للجميل، دنسين،"]]}, {"l": "2Ti 3:3", "n": "", "vs": [[3, "متحجري العواطف، غير صفوحين، نمامين، جامحي الأهواء، شرسين غير محبين للصلاح،"]]}], "kwAr": "الابن", "noteAr": ""}, {"kw": "a mans", "raw": "Psa_41:9, Psa_55:12-14; Jer_12:6, Jer_20:10; Oba_1:7; Mat_26:23, Mat_26:49, Mat_26:50; Joh_13:18", "note": "", "refs": [{"l": "Psa 41:9", "n": "", "vs": [[9, "حتى صديقي الملازم لي الذي وثقت به، الآكل من طعامي قد انقلب علي، ورفع علي عقبه."]]}, {"l": "Psa 55:12-14", "n": "", "vs": [[12, "لو كان عدوي هو الذي يعيرني لكنت أحتمل. ولو كان من يبغضني هو الذي يتجبر علي لكنت أختبيء منه."], [13, "ولكنك عديلي، وإلفي وصديقي الحميم،"], [14, "الذي كانت لنا عشر ة معه، وكنا نترافق في الحضور إلى بيت الله مع جمهور العابدين."]]}, {"l": "Jer 12:6", "n": "", "vs": [[6, "حتى إخوتك وأفراد أسرتك قد تنكروا لك، ودعوا عليك وراءك بملء أفواههم. لا تأتمنهم، وإن خاطبوك بألفاظ معسولة."]]}, {"l": "Jer 20:10", "n": "", "vs": [[10, "لأني سمعت نفثات تهديد من كثيرين، وأحاط بي رعب من كل جانب. يقولون: «اشتكوا عليه فنشتكي عليه»، حتى جميع أصدقائي الحميمين يرقبون كبوتي قائلين: «لعله يتعثر فنتغلب عليه وننتقم منه»."]]}, {"l": "Oba 1:7", "n": "", "vs": [[7, "جميع حلفائك طردوك إلى التخوم. خدعك مسالموك وأوقعوا بك الهزيمة، والذين أكلوا من خبزك كادوا لك وأنت لم تفهم."]]}, {"l": "Mat 26:23", "n": "", "vs": [[23, "فأجاب: «الذي يغمس يده معي في الصحفة هو الذي يسلمني."]]}, {"l": "Mat 26:49", "n": "", "vs": [[49, "فتقدم في الحال إلى يسوع وقال: «سلام ياسيدي!» وقبله."]]}, {"l": "Mat 26:50", "n": "", "vs": [[50, "فقال له يسوع: «ياصاحبي، لماذا أنت هنا؟» فتقدم الجمع وألقوا القبض على يسوع."]]}, {"l": "Joh 13:18", "n": "", "vs": [[18, "وأنا لا أقول هذا عن جميعكم، فأنا أعرف الذين اخترتهم. ولكن لابد أن يتم الكتاب حيث يقول: الآكل من خبزي، رفع علي عقبه!"]]}], "kwAr": "وأعداء الإنسان", "noteAr": ""}], "arS": [["فإن", ["H3588"]], [" ", []], ["الابن", ["H1121"]], [" ", []], ["يستخف", ["H5034"]], [" ", []], ["بأبيه", ["H1"]], [" ", []], ["والابنة", ["H1323"]], [" ", []], ["تتمرد", ["H6965"]], [" على ", []], ["أمها", ["H517"]], ["، ", []], ["والكنة", ["H3618"]], [" على ", []], ["حماتها", ["H2545"]], ["، ", []], ["وأعداء", ["H341"]], [" ", []], ["الإنسان", ["H376"]], [" ", []], ["أهل", ["H376"]], [" ", []], ["بيته", ["H1004"]], [".", []]]}, {"c": 7, "v": 7, "text": "أما أنا فأرتقب الرب وأنتظر إله خلاصي فيسمعني إلهي.", "groups": [{"kw": "I will look", "raw": "Psa_34:5, Psa_34:6, Psa_55:16, Psa_55:17, Psa_109:4, Psa_142:4, Psa_142:5; Isa_8:17, Isa_45:22; Hab_3:17-19; Luk_6:11, Luk_6:12", "note": "", "refs": [{"l": "Psa 34:5", "n": "", "vs": [[5, "الذين تطلعوا إليه استناروا، ولم تخجل وجوههم قط."]]}, {"l": "Psa 34:6", "n": "", "vs": [[6, "هذا المسكين استغاث، فسمعه الرب وأنقذه من جميع ضيقاته."]]}, {"l": "Psa 55:16", "n": "", "vs": [[16, "أما أنا فبالرب أستغيث والرب يخلصني."]]}, {"l": "Psa 55:17", "n": "", "vs": [[17, "مساء وصباحا وظهرا أشكو له صارخا ونائحا، فيسمع صوتي."]]}, {"l": "Psa 109:4", "n": "", "vs": [[4, "يبادلون محبتي بخصام، أما أنا فأصلي من أجلهم."]]}, {"l": "Psa 142:4", "n": "", "vs": [[4, "التفت نحو يميني فلا تجد من يحفل بي، لم يبق لي ملاذ أو من يسأل عني."]]}, {"l": "Psa 142:5", "n": "", "vs": [[5, "إياك دعوت يارب قائلا: أنت ملجإي، أنت نصيبي في أرض الأحياء."]]}, {"l": "Isa 8:17", "n": "", "vs": [[17, "سأنتظر الرب الذي يحجب وجهه عن بيت يعقوب وأتوكل عليه."]]}, {"l": "Isa 45:22", "n": "", "vs": [[22, "التفتوا إلي واخلصوا ياجميع أقاصي الأرض، لأني أنا الله وليس هناك آخر."]]}, {"l": "Hab 3:17-19", "n": "", "vs": [[17, "فمع أنه لا يزهر التين ولا يكون حمل في الكروم يكذب عمل الزيتونة والحقول لا تصنع طعاما ينقطع الغنم من الحظيرة ولا بقر في المذاود"], [18, "فإني أبتهج بالرب وأفرح بإله خلاصي."], [19, "الرب الإله هو قوتي؛ يجعل قدمي كقدمي غزال، ويعينني على ارتقاء المرتفعات.إلى قائد الجوقة: تغنى على ذوات الأوتار."]]}, {"l": "Luk 6:11", "n": "", "vs": [[11, "ولكن الحماقة استولت عليهم حتى أخذوا يتشاورون في ما بينهم ماذا يفعلون بيسوع."]]}, {"l": "Luk 6:12", "n": "", "vs": [[12, "وفي تلك الأيام، خرج إلى الجبل ليصلي، وقضى الليل كله في الصلاة لله."]]}], "kwAr": "فأرتقب", "noteAr": ""}, {"kw": "wait", "raw": "Gen_49:18; Psa_25:5, Psa_27:12-14, Psa_37:7, Psa_40:1-3, Psa_62:1-8; Isa_12:2, Isa_25:9; Lam_3:25, Lam_3:26; Luk_2:25-32", "note": "", "refs": [{"l": "Gen 49:18", "n": "", "vs": [[18, "إنني انتظرت خلاصك يارب."]]}, {"l": "Psa 25:5", "n": "", "vs": [[5, "دربني في حقك وعلمني، فإنك أنت الإله مخلصي، وإياك أرجو طوال النهار."]]}, {"l": "Psa 27:12-14", "n": "", "vs": [[12, "لا تسلمني إلى مرام مضايقي، لأنه قد قام علي شهود زور ينفثون الظلم في وجهي."], [13, "غير أني قد آمنت بأن أرى جود الرب في أرض الأحياء."], [14, "انتظر الرب. تقو وليتشجع قلبك. وانتظر الرب دائما."]]}, {"l": "Psa 37:7", "n": "", "vs": [[7, "اسكن أمام الرب وانتظره بصبر، ولا تغر من الذي ينجح في مسعاه، بفضل مكائده."]]}, {"l": "Psa 40:1-3", "n": "", "vs": [[1, "انتظرت الرب صابرا، فالتفت إلي وسمع صراخ استغاثتي،"], [2, "وانتشلني من هوة الهلاك، من طين المستنقع. وأوقف قدمي على أرض صخرية، فصرت أمشي بخطوات ثابتة."], [3, "وضع في فمي ترنيمة جديدة، قصيدة تسبيح لإلهنا. يرى ذلك كثيرون فيخافون الرب."]]}, {"l": "Psa 62:1-8", "n": "", "vs": [[1, "انتظرت نفسي الله وحده. من لدنه يأتي خلاصي."], [2, "هو وحده صخرتي وخلاصي وحصني المنيع، لذلك لا أتزعزع أبدا."], [3, "إلى متى توالون الهجوم على الإنسان، وتسعون جميعكم إلى هدمه، كأنه حائط متداع أو سياج مخلخل؟"], [4, "إنما يتآمرون كي يطيحوا به عن مكانته الرفيعة، مبتهجين بالكذب: يباركون بأفواههم ويلعنون بقلوبهم."], [5, "انتظرت نفسي الله وحده؛ من لدنه يأتي خلاصي."], [6, "هو وحده صخرتي وخلاصي وحصني المنيع، لذلك لا أتزعزع أبدا."], [7, "في الله خلاصي ومجدي. والله هو صخرة قوتي وملجإي."], [8, "ثقوا به في كل حين أيها الشعب. اسكبوا أمامه قلوبكم، الله ملجأنا."]]}, {"l": "Isa 12:2", "n": "", "vs": [[2, "ها إن الله خلاصي فأطمئن ولا أرتعد، لأن الرب الله هو قوتي وترنيمتي وقد أصبح لي خلاصا»."]]}, {"l": "Isa 25:9", "n": "", "vs": [[9, "ويقولون في ذلك اليوم: «ها هو إلهنا الذي انتظرناه فخلصنا. هذا هو الرب الذي انتظرناه نبتهج ونفرح بخلاصه»."]]}, {"l": "Lam 3:25", "n": "", "vs": [[25, "الرب صالح لمن يرجونه وللنفس التي تلتمسه."]]}, {"l": "Lam 3:26", "n": "", "vs": [[26, "خير للمرء أن ينتظر بصمت خلاص الرب."]]}, {"l": "Luk 2:25-32", "n": "", "vs": [[25, "وكان في أورشليم رجل اسمه سمعان، وهو رجل بار تقي ينتظر العزاء لإسرائيل وكان الروح القدس عليه."], [26, "وكان الروح القدس قد أوحى إليه أنه لا يرى الموت قبل أن يرى مسيح الرب،"], [27, "وقد جاء إلى الهيكل بدافع من الروح. فلما أحضر الأبوان الطفل يسوع ليقدما عنه ما سن في الشريعة،"], [28, "حمله على ذراعيه وبارك الله ، وقال:"], [29, "«أيها السيد، الآن تطلق عبدك بسلام حسب وعدك!"], [30, "فإن عيني قد أبصرتا خلاصك"], [31, "الذي هيأته لتقدمه إلى الشعوب كلها،"], [32, "نور هداية للأمم ومجدا لشعبك إسر ائيل»."]]}], "kwAr": "وأنتظر", "noteAr": ""}, {"kw": "my God", "raw": "Psa_4:2, Psa_4:3, Psa_38:15, Psa_50:15, Psa_65:2; 1Jo_5:14, 1Jo_5:15", "note": "", "refs": [{"l": "Psa 4:2", "n": "", "vs": [[2, "إلى متى يابني البشر تحولون مجدي عارا؟ وإلى متى تحبون الأمور الباطلة، وتسعون وراء الأكاذيب؟"]]}, {"l": "Psa 4:3", "n": "", "vs": [[3, "اعلموا أن الرب قد ميز لنفسه تقيه؛ الرب يسمع عندما أدعوه."]]}, {"l": "Psa 38:15", "n": "", "vs": [[15, "لأني قد وضعت فيك رجائي، وأنت تستجيبني يارب إلهي."]]}, {"l": "Psa 50:15", "n": "", "vs": [[15, "ادعني في يوم ضيقك أنقذك فتمجدني»."]]}, {"l": "Psa 65:2", "n": "", "vs": [[2, "ياسامع الصلاة إليك يقبل كل إنسان."]]}, {"l": "1Jo 5:14", "n": "", "vs": [[14, "نحن نثق بالله ثقة عظيمة تؤكد لنا أنه يسمع لنا الطلبات التي نرفعها إليه، إن كانت منسجمة مع إرادته."]]}, {"l": "1Jo 5:15", "n": "", "vs": [[15, "ومادمنا واثقين بأنه يسمع لنا، مهما كانت طلباتنا، فلنا الثقة بأننا قد حصلنا منه على تلك الطلبات."]]}], "kwAr": "إلهي", "noteAr": ""}], "arS": [["أما ", []], ["أنا", ["H589"]], [" ", []], ["فأرتقب", ["H6822"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["وأنتظر", ["H3176"]], [" ", []], ["إله", ["H430"]], [" ", []], ["خلاصي", ["H3468"]], [" ", []], ["فيسمعني", ["H8085"]], [" ", []], ["إلهي", ["H430"]], [".", []]]}, {"c": 7, "v": 8, "text": "لا تشمتي بي ياعدوتي، لأني إن سقطت أقوم، وإن جلست في الظلمة يكون الرب نورا لي.", "groups": [{"kw": "Rejoice", "raw": "Job_31:29; Psa_13:4-6, Psa_35:15, Psa_35:16, Psa_35:19, Psa_35:24-26, Psa_38:16; Pro_24:17, Pro_24:18; Jer_50:11; Lam_4:21, Lam_4:22; Eze_25:6, Eze_35:15; Oba_1:12; Joh_16:20; Rev_11:10-12", "note": "", "refs": [{"l": "Job 31:29", "n": "", "vs": [[29, "إن كنت قد فرحت بدمار مبغضي أو شمت حين أصابه شر،"]]}, {"l": "Psa 13:4-6", "n": "", "vs": [[4, "فيقول عدوي: قد قهرته؛ ويبتهج خصومي بسقوطي."], [5, "غير أني توكلت على رحمتك، فيبتهج قلبي حقا بخلاصك."], [6, "أرنم للرب لأنه غمرني بإحسانه العميم."]]}, {"l": "Psa 35:15", "n": "", "vs": [[15, "وأما هم فشمتوا فرحا عند سقطتي، وتجمعوا علي شاتمين، وشرع غرباء لا أعرفهم يضربونني. مزقوني ولم يرتدعوا."]]}, {"l": "Psa 35:16", "n": "", "vs": [[16, "كفجار ماجنين مجتمعين حول وليمة حرقوا علي أسنانهم."]]}, {"l": "Psa 35:19", "n": "", "vs": [[19, "لا يشمت بي أعدائي بحجة باطلة، ولا يتغامز مبغضي علي، بغير علة."]]}, {"l": "Psa 35:24-26", "n": "", "vs": [[24, "احكم ببراءتي يارب إلهي حسب عدلك، ولا تدعهم يشمتون بي."], [25, "لئلا يقولوا في أنفسهم: «هه! قد ظفرنا به» أو يقولوا: «قد ابتلعناه!»"], [26, "ليخز ويخجل جميع الشامتين بي في مصيبتي. ليرتد المتعظمون علي لباس الخزي والعار."]]}, {"l": "Psa 38:16", "n": "", "vs": [[16, "قلت: «لا تدعهم يشمتون بي فحالما زلت قدمي تغطرسوا علي»"]]}, {"l": "Pro 24:17", "n": "", "vs": [[17, "لا تشمت لسقوط عدوك، ولا يبتهج قلبك إذا عثر،"]]}, {"l": "Pro 24:18", "n": "", "vs": [[18, "لئلا يشهد الرب، فيسوء الأمر في عينيه ويصرف غضبه عنه."]]}, {"l": "Jer 50:11", "n": "", "vs": [[11, "لأنكم تبتهجون وتطفرون غبطة يا ناهبي شعبي، وتمرحون كعجلة فوق العشب وتصهلون كالخيل."]]}, {"l": "Lam 4:21", "n": "", "vs": [[21, "ابتهجي وافرحي ياابنة أدوم، ياساكنة عوص. إنما هذه الكأس ستجوز عليك أيضا فتسكرين وتتعرين."]]}, {"l": "Lam 4:22", "n": "", "vs": [[22, "قد تم إثمك ياابنة صهيون، ولن يطيل (الله ) من حقبة سبيك. أما أنت ياابنة أدوم فإنه يعاقبك ويفضح خطاياك."]]}, {"l": "Eze 25:6", "n": "", "vs": [[6, "لأنك صفقت بكفيك طربا، وخبطت برجليك، وفرحت بكل ما فيك من لؤم لما حل بأرض إسرائيل."]]}, {"l": "Eze 35:15", "n": "", "vs": [[15, "وكما فرحت لخراب ميراث شعب إسرائيل، كذلك أفعل بك، فتصير ياجبل سعير خرابا أنت وكل بلاد أدوم فتدركون أني أنا الرب»."]]}, {"l": "Oba 1:12", "n": "", "vs": [[12, "ما كان يجب أن تشمت بيوم مصير أخيك، في يوم فاجعته، وما كان يجب أن تبتهج في يوم دمار شعب يهوذا أو تتباهى في يوم الضيق."]]}, {"l": "Joh 16
