صدرك علي فليكونوا ملعونين أمام الرب، لأنهم نفوني من أرض ميراث الرب قائلين: اذهب اعبد آلهة أخرى."]]}, {"l": "Joe 3:6", "n": "", "vs": [[6, "وبعتم يهوذا وأبناء أورشليم إلى الأغارقة لتبعدوهم عن تخوم أرضهم."]]}], "kwAr": "أطفال كل منهن", "noteAr": ""}, {"kw": "my glory", "raw": "Psa_72:19; Eze_39:21; Hab_2:14; Zec_2:5; 2Co_3:18, 2Co_4:6", "note": "", "refs": [{"l": "Psa 72:19", "n": "", "vs": [[19, "تبارك اسمه المجيد إلى الأبد، ولتمتليء الأرض كلها من مجده. آمين ثم آمين."]]}, {"l": "Eze 39:21", "n": "", "vs": [[21, "وأجعل مجدي يتجلى بين الأمم فتشهد دينونتي التي أنزلتها بهم، وقدرة يدي التي مددتها عليهم."]]}, {"l": "Hab 2:14", "n": "", "vs": [[14, "لأن الأرض ستمتليء من معرفة مجد الرب كما تغمر المياه البحر."]]}, {"l": "Zec 2:5", "n": "", "vs": [[5, "لأني سأكون لها سورا محيطا من نار، يقول الرب، ومجدا في داخلها»."]]}, {"l": "2Co 3:18", "n": "", "vs": [[18, "ونحن جميعا فيما ننظر إلى مجد الرب بوجوه كالمرآة لا حجاب عليها، نتجلى من مجد إلى مجد لنشابه الصورة الواحدة عينها، وذلك بفعل الرب الروح."]]}, {"l": "2Co 4:6", "n": "", "vs": [[6, "فإن الله ، الذي أمر أن يشرق نور من الظلام، هو الذي جعل النور يشرق في قلوبنا، لإشعاع معرفة مجد الله المتجلي في وجه المسيح."]]}], "kwAr": "عطاياي", "noteAr": ""}], "arS": [["تطردون", ["H1644"]], [" ", []], ["أرامل", ["H802"]], [" ", []], ["شعبي", ["H5971"]], [" من ", []], ["بيوتهن", ["H4480", "H1004"]], ["، ", []], ["وتجردون", ["H3947"]], [" ", []], ["أطفال", ["H5768"]], [" كل منهن من ", []], ["عطاياي", ["H1926"]], [" إلى ", []], ["الأبد", ["H5769"]], [".", []]]}, {"c": 2, "v": 10, "text": "هبوا واذهبوا، فهذا ليس مكان راحتكم، لأنه أصبح نجسا، مدمرا ولا يمكن ترميمه.", "groups": [{"kw": "and", "raw": "Deu_4:26, Deu_30:18; Jos_23:15, Jos_23:16; 1Ki_9:7; 2Ki_15:29, 2Ki_17:6; 2Ch_7:20; 2Ch_36:20,2Ch_36:21", "note": "", "refs": [{"l": "Deu 4:26", "n": "", "vs": [[26, "فإنني أشهد عليكم اليوم السماء والأرض، أنكم تنقرضون سريعا من الأرض التي أنتم عابرون نهر الأردن إليها لترثوها، ولن تطول بكم الأيام عليها، إذ لابد أنكم حينئذ هالكون."]]}, {"l": "Deu 30:18", "n": "", "vs": [[18, "فإني أنذركم اليوم أنكم لا محالة هالكون. لا تطيل الأيام على الأرض التي أنت عابر الأردن لتدخلها وتمتلكها."]]}, {"l": "Jos 23:15", "n": "", "vs": [[15, "وكما وفى الرب بوعوده الصالحة التي وعدكم بها، فإنه كذلك يجلب عليكم كل وعيد أنذركم به، حتى يفنيكم عن هذه الأرض الخيرة التي وهبها لكم."]]}, {"l": "Jos 23:16", "n": "", "vs": [[16, "حين تتعدون على عهد الرب إلهكم الذي أمركم به فتعبدون آلهة أخرى وتسجدون لها، عندئذ يحتدم غضب الرب عليكم فتنقرضون سريعا من الأرض الخيرة التي وهبها لكم»."]]}, {"l": "1Ki 9:7", "n": "", "vs": [[7, "فإني أبيد إسرائيل عن وجه الأرض التي وهبتها لهم، وأنبذ الهيكل الذي قدسته لاسمي، فيصبح إسرائيل مثلا ومثار هزء لجميع الأمم."]]}, {"l": "2Ki 15:29", "n": "", "vs": [[29, "وفي أيامه هاجم تغلث فلاسر ملك أشور البلاد، واستولى على مدن عيون، وآبل بيت معكة، ويانوح، وقادش، وحاصور، وجلعاد والجليل، وكل أرض نفتالي وسبى أهلها إلى أشور."]]}, {"l": "2Ki 17:6", "n": "", "vs": [[6, "وفي السنة التاسعة من حكم هوشع سقطت السامرة، فسبى ملك أشور الإسرائيليين إلى أشور وأسكنهم في مدينة حلح، وعلى ضفاف نهر خابور في منطقة جوزان، وفي مدن مادي."]]}, {"l": "2Ch 7:20", "n": "", "vs": [[20, "فإنني أستأصلكم من أرضي التي وهبتها لكم، وأنبذ هذا الهيكل الذي قدسته لاسمي، وأجعله مثلا ومثار هزء لجميع الأمم."]]}, {"l": "2Ch 36:20", "n": "", "vs": [[20, "وسبى نبوخذناصر الذين نجوا من السيف إلى بابل، فأصبحوا عبيدا له ولأبنائه إلى أن قامت مملكة فارس."]]}, {"l": "2Ch 36:21", "n": "", "vs": [[21, "وذلك لكي يتم كلام الرب الذي نطق به على لسان إرميا، حتى تستوفي الأرض سبوتها، إذ أنها بقيت من غير إنتاج كل أيام خرابها حتى انقضاء سبعين سنة."]]}], "kwAr": "واذهبوا", "noteAr": ""}, {"kw": "for", "raw": "Deu_12:9; Psa_95:11; Heb_4:1-9", "note": "", "refs": [{"l": "Deu 12:9", "n": "", "vs": [[9, "لأنكم لم تدخلوا بعد إلى موضع الراحة والميراث الذي يهبه لكم الرب إلهكم."]]}, {"l": "Psa 95:11", "n": "", "vs": [[11, "فأقسمت في غضبي قائلا: «إنهم لن يدخلوا مكان راحتي»."]]}, {"l": "Heb 4:1-9", "n": "", "vs": [[1, "ومادام الوعد بالدخول إلى الراحة الإلهية قائما حتى الآن، فلنخف: فربما تبين أن بعضا منكم قد فشلوا في الدخول."], [2, "ذلك أن البشارة بالوعد قد وصلت إلينا، نحن أيضا، كما كانت قد وصلت إلى ذلك الشعب. ولكن البشارة لم تنفع سامعيها شيئا، لأنهم قابلوها بالرفض فلم يؤمنوا بها."], [3, "أما نحن، الذين آمنا بالبشارة، فسوف ندخل الراحة الإلهية. إذ قال عن الذين لم يؤمنوا: «وهكذا، في غضبي، أقسمت قائلا: إنهم لن يدخلوا مكان راحتي...!» هذه الراحة، كانت جاهزة منذ أن أتم الله تأسيس العالم."], [4, "فقد قال الوحي في موضع من الكتاب مشيرا إلى اليوم السابع: «ثم استراح الله من جميع أعماله في اليوم السابع»."], [5, "ثم عاد فقال: «لن يدخلوا مكان راحتي!»"], [6, "وهكذا، يتبين أن الراحة الإلهية هي في انتظار من سيدخلون إليها. وبما أن الذين تلقوا البشارة بها أولا لم يدخلوا إليها بسبب تمردهم،"], [7, "أعلن الله عن فرصة جديدة، إذ قال: «اليوم...» بلسان داود، بعدما مضى زمان طويل على ما كان قد قاله قديما: «اليوم، إن سمعتم صوته، فلا تقسوا قلوبكم...»"], [8, "فلو كان يشوع قد أدخل الشعب إلى الراحة، لما تكلم الله بعد ذلك عن موعد جديد للدخول بقوله: «اليوم...»"], [9, "إذن، مازالت الراحة الحقيقية الكاملة محفوظة لشعب الله."]]}], "kwAr": "فهذا ليس", "noteAr": ""}, {"kw": "because", "raw": "Lev_18:24-28, Lev_20:22-26; Psa_106:38; Jer_3:2", "note": "", "refs": [{"l": "Lev 18:24-28", "n": "", "vs": [[24, "لا تتنجسوا بكل هذه الأعمال المشينة لأن بها تنجست الشعوب التي سأطردها من أمامكم،"], [25, "فقد تنجست بها الأرض، لهذا سأعاقب الأرض بذنبها فتتقيأ سكانها."], [26, "أما أنتم فاحفظوا فرائضي وأحكامي، ولا تقترفوا شيئا من هذه الرجاسات، المواطن والغريب المقيم في وسطكم على حد سواء."], [27, "لأن جميع هذه الرجاسات قد ارتكبها أهل البلاد الذين قبلكم، فتنجست الأرض."], [28, "فلا تنجسوا الأرض بارتكابكم إياها، لئلا تتقيأكم كما تقيأت الأمم التي قبلكم."]]}, {"l": "Lev 20:22-26", "n": "", "vs": [[22, "أطيعوا جميع فرائضي وأحكامي واعملوا بها فلا تنبذكم الأرض التي أنا ذاهب بكم إليها لتقيموا فيها."], [23, "لا تمارسوا عادات الأمم التي سأطردها من أمامكم، لأنها ارتكبت كل هذه القبائح، فكرهتها،"], [24, "ووعدتكم أن ترثوا ديارها. وأنا أهبكم إياها لتمتلكوها، أرضا تفيض لبنا وعسلا. فأنا الرب إلهكم، ميزتكم عن بقية الشعوب."], [25, "ميزوا البهائم الطاهرة من النجسة، والطيور النجسة من الطاهرة، فلا تدنسوا أنفسكم بالبهائم والطيور والزواحف التي حظرتها عليكم."], [26, "وكونوا قديسين لأني أنا قدوس، وقد أفرزتكم من بين الشعوب لتكونوا خاصتي."]]}, {"l": "Psa 106:38", "n": "", "vs": [[38, "سفكوا دما بريئا، دم بنيهم وبناتهم الذين ذبحوهم لأصنام الكنعانيين، فتدنست الأرض بالدماء."]]}, {"l": "Jer 3:2", "n": "", "vs": [[2, "ارفعي عينيك إلى الهضاب وتأملي، أهناك مكان لم تضاجعي فيه؟ (أي لم تعبدي فيه الأوثان). قد جلست لهم على قارعة الطريق كالأعرابي في البادية ودنست الأرض بزناك وعهارتك."]]}], "kwAr": "لأنه", "noteAr": ""}, {"kw": "it shall", "raw": "Jer_9:19, Jer_10:18; Eze_36:12-14", "note": "", "refs": [{"l": "Jer 9:19", "n": "", "vs": [[19, "ها صوت رثاء قد تجاوب في صهيون: ما أشد دمارنا، وما أعظم عارنا، لأننا قد فارقنا أرضنا، ولأنهم قد هدموا مساكننا!»"]]}, {"l": "Jer 10:18", "n": "", "vs": [[18, "لأن هذا ما يعلنه الرب: «ها أنا أقذف بمقلاع سكان الأرض في هذه المرة، وأعرضهم للضيق حتى يعرفوا معاناته»."]]}, {"l": "Eze 36:12-14", "n": "", "vs": [[12, "وأجعل الناس من شعبي إسرائيل يخطرون عليك، فيرثونك وتكونين لهم ملكا ولا تثكلينهم من بعد."], [13, "لأ نهم قالوا لك: أنت مفترسة الناس ومثكلة شعوبك"], [14, "لهذا لن تفترسي الناس بعد، ولن تثكلي شعوبك يقول السيد الرب."]]}], "kwAr": "مدمرا", "noteAr": ""}], "arS": [["هبوا", ["H6965"]], [" ", []], ["واذهبوا", ["H1980"]], ["، ", []], ["فهذا", ["H3588", "H2063"]], [" ", []], ["ليس", ["H3808"]], [" مكان ", []], ["راحتكم", ["H4496"]], ["، ", []], ["لأنه", ["H5668"]], [" أصبح ", []], ["نجسا", ["H2930"]], ["، ", []], ["مدمرا", ["H2254"]], [" ولا يمكن ", []], ["ترميمه", ["H4834", "H2256"]], [".", []]]}, {"c": 2, "v": 11, "text": "إن جال رجل يتنبأ بينكم بالكذب وباللغو الباطل قائلا: إنني أتنبأ لكم بالخمر الوفير والمسكر، فإنه يصبح نبي هذا الشعب.", "groups": [{"kw": "a man", "raw": "1Ki_13:18, 1Ki_22:21-23; 2Ch_18:19-22; Isa_9:15; Jer_14:14, Jer_23:14, Jer_23:25, Jer_23:32; Jer_27:14, Jer_27:15, Jer_28:2, Jer_28:3, Jer_28:15, Jer_29:21-23; Eze_13:3-14, Eze_13:22; 2Co_11:13-15; 2Th_2:8-10; 2Pe_2:1-3; 1Jo_4:1; Rev_16:13, Rev_16:14", "note": "", "refs": [{"l": "1Ki 13:18", "n": "", "vs": [[18, "فقال له: «أنا أيضا نبي مثلك وقد أمرني ملاك الرب أن أرجع بك معي إلى بيتي فتقتات وتشرب ماء». وهكذا كذب عليه."]]}, {"l": "1Ki 22:21-23", "n": "", "vs": [[21, "ثم تقدم روح الضلال وقال: أنا أغويه. فسأله الرب: بماذا؟"], [22, "فأجاب: أخرج، وأصبح روح ضلال في أفواه جميع أنبيائه. فقال الرب: إنك قادر على إغوائه وتفلح في ذلك، فامض ونفذ هذا الأمر."], [23, "وها الرب قد جعل الآن روح ضلال في أفواه جميع أنبيائك هؤلاء، وقد قضى عليك بالشر»."]]}, {"l": "2Ch 18:19-22", "n": "", "vs": [[19, "فسأل الرب: من يغوي أخآب ليخرج إلى الحرب ويموت في راموت جلعاد؟ فأجاب كل منهم بشيء."], [20, "ثم برز روح ووقف أمام الرب وقال: أنا أغويه. فسأله الرب: بماذا؟"], [21, "فأجاب: أخرج وأصبح روح ضلال في أفواه جميع أنبيائه. فقال الرب: إنك قادر على إغوائه وتفلح في ذلك، فامض ونفذ الأمر."], [22, "وها الرب قد جعل الآن روح ضلال في أفواه جميع أنبيائك هؤلاء، وقد قضى عليك بالشر»."]]}, {"l": "Isa 9:15", "n": "", "vs": [[15, "إن الشيخ والوجيه هو الرأس، والنبي الذي يلقن الكذب هو الذنب"]]}, {"l": "Jer 14:14", "n": "", "vs": [[14, "وقال لي الرب: «إن الأنبياء يتنبأون زورا باسمي وأنا لم أرسلهم ولم آمرهم، ولم أكلمهم، إنما هم يتنبأون لكم برؤيا كاذبة وعرافة باطلة مستوحاة من ضلال قلوبهم."]]}, {"l": "Jer 23:14", "n": "", "vs": [[14, "وفي أوساط أنبياء أورشليم رأيت أمورا مهولة: يرتكبون الفسق، ويسلكون في الأكاذيب، يشددون أيدي فاعلي الإثم لئلا يتوب أحد عن شره. صاروا جميعا كسكان سدوم وأصبح أهلها كأهل عمورة."]]}, {"l": "Jer 23:25", "n": "", "vs": [[25, "قد سمعت ما نطق به المتنبئون باسمي زورا قائلين: قد حلمت، قد حلمت."]]}, {"l": "Jer 23:32", "n": "", "vs": [[32, "ها أنا أقاوم المتنبئين بأحلام كاذبة ويقصونها مضلين شعبي بأكاذيبهم واستخفافهم، مع أني لم أرسلهم ولم أكلفهم بشيء. ولا جدوى منهم لهذا الشعب."]]}, {"l": "Jer 27:14", "n": "", "vs": [[14, "لا تستمعوا لكلام الأنبياء الكذبة الذين يقولون لكم: لا تستعبدوا لملك بابل لأنهم يتنبأون لكم كذبا،"]]}, {"l": "Jer 27:15", "n": "", "vs": [[15, "فأنا لم أرسلهم، يقول الرب، إنما هم يتنبأون باسمي كذبا لأجلكم فتطردون أنتم وأنبياؤكم المتنبئون لكم»."]]}, {"l": "Jer 28:2", "n": "", "vs": [[2, "«هذا ما يعلنه الرب القدير إله إسرائيل: إني قد حطمت نير ملك بابل."]]}, {"l": "Jer 28:3", "n": "", "vs": [[3, "وبعد عامين أرد إلى هذا الموضع كل آنية هيكل الرب التي استولى عليها نبوخذناصر ملك بابل من هذا المكان وحملها إلى بابل."]]}, {"l": "Jer 28:15", "n": "", "vs": [[15, "وأضاف إرميا النبي مخاطبا حننيا المتنبيء: «اسمع ياحننيا، هذا ما يعلنه الرب: إن الرب لم يبعثك، وأنت جعلت هذا الشعب يصدق كذبك."]]}, {"l": "Jer 29:21-23", "n": "", "vs": [[21, "يقول الرب القدير إله إسرائيل عن أخآب بن قولايا وعن صدقيا بن معسيا اللذين يتنبآن لكم باسمي زورا: «ها أنا أسلمهما ليد نبوخذناصر ملك بابل فيقتلهما على مرأى منكم،"], [22, "فيصبحان مثل لعنة بين جميع المسبيين من يهوذا في بابل، فيقال: ليجعلك الله نظير صدقيا وأخآب اللذين قلاهما ملك بابل بالنار،"], [23, "لأنهما ارتكبا الفواحش في إسرائيل وزنيا مع نساء أصحابهما وتنبآ باسمي نبوءات كاذبة لم آمرهما بها. فأنا العارف والشاهد» يقول الرب."]]}, {"l": "Eze 13:3-14", "n": "", "vs": [[3, "ويل للأنبياء الحمقى الضالين وراء أرواحهم من غير أن يروا شيئا."], [4, "أنبياؤك ياإسرائيل هم كالثعالب في الخرائب."], [5, "لم تبرزوا إلى الثغرات، ولم تشيدوا جدارا حول بيت إسرائيل لتصمدوا في القتال في يوم الرب،"], [6, "إنما رؤياهم باطلة، وعرافتهم كاذبة. يقولون: يقول الرب، والرب لم يرسلهم، ومع ذلك يطمعون في تحقيق كلمتهم."], [7, "ألم تروا رؤيا باطلة، وتنطقوا بعرافة كاذبة قائلين: يقول الرب، وأنا لم أتكلم؟"], [8, "لذلك يعلن الرب: لأنكم تكلمتم باطلا وادعيتم رؤيا كاذبة، فها أنا أنقلب عليكم يقول السيد الرب."], [9, "فتكون يدي على الأنبياء ذوي الرؤيا الباطلة والعرافة الكاذبة، فلا يكون لهم مقام في جماعة شعبي، ولا تدون أسماؤهم في كتاب بيت إسرائيل، ولا يدخلون أرض إسرائيل، فتدركون أني أنا السيد الرب."], [10, "لأنهم حقا أضلوا شعبي قائلين: سيكون لكم سلام مع أنه ليس هناك سلام، فكان شعبي يبني حائطا وهم يطلونه بماء الكلس."], [11, "قل للطالين بماء الكلس: إن الحائط يتداعى، إذ ينهمر مطر جارف. وأنتن ياحجارة البر د تساقطن، ولتعصف به ريح جائحة."], [12, "فلا يلبث السور أن ينهار أفلا تسألون آنئذ: أين الطين الذي طينتم به؟"], [13, "لذلك، هذا ما يعلنه السيد الرب: ها أنا أجعل ريحا عاتية تخترق السور بفعل حنقي، ومطرا جارفا ينهمر في خضم غضبي، وحجارة برد تتساقط في أثناء سخطي لكي تهلك،"], [14, "فأهدم السور الذي طليتموه بماء الكلس وأسويه بالأرض فيتعرى أساسه وتتداعى المدينة وتفنون جميعا في وسطها فتدركون أني أنا الرب."]]}, {"l": "Eze 13:22", "n": "", "vs": [[22, "لأنكن أحزنتن قلب الصديق بأكاذيبكن، مع أنني لم أحزنه، وشددتن عزائم الشرير لئلا يرجع عن طريقه الأثيمة فيحيا."]]}, {"l": "2Co 11:13-15", "n": "", "vs": [[13, "فإن أمثال هؤلاء هم رسل دجالون، عمال ماكرون، يظهرون أنفسهم بمظهر رسل المسيح."], [14, "ولا عجب! فالشيطان نفسه يظهر نفسه بمظهر ملاك نور."], [15, "فليس كثيرا إذن أن يظهر خدامه أنفسهم بمظهر خدام البر. وإن عاقبتهم ستكون على حسب أعمالهم."]]}, {"l": "2Th 2:8-10", "n": "", "vs": [[8, "عندئذ سيظهر الإنسان المتمرد ظهورا جليا فيبيده الرب يسوع بنفخة فمه ويلاشيه ببهاء ظهوره عند عودته."], [9, "أما بروز المتمرد، فسوف يكون بقدر طاقة الشيطان على المعجزات والعلامات والعجائب المزيفة كلها،"], [10, "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا."]]}, {"l": "2Pe 2:1-3", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."], [2, "وكثيرون سيسيرون وراءهم في طرق الإباحية. وبسببهم توجه الإهانة إلى طريق الحق."], [3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "1Jo 4:1", "n": "", "vs": [[1, "أيها الأحباء، لا تصدقوا كل روح، بل امتحنوا الأرواح لتعرفوا ما إذا كانت من عند الله أم لا، لأن عددا كبيرا من الأنبياء الدجالين قد انتشر في العالم."]]}, {"l": "Rev 16:13", "n": "", "vs": [[13, "وعند هذا رأيت ثلاثة أرواح نجسة تشبه الضفادع تخرج من فم التنين، ومن فم الوحش، ومن فم النبي الدجال،"]]}, {"l": "Rev 16:14", "n": "", "vs": [[14, "وهي أرواح شيطانية قادرة على صنع المعجزات، تذهب إلى ملوك الأرض جميعا وتجمعهم للحرب في ذلك اليوم العظيم، يوم الله القادر على كل شيء."]]}], "kwAr": "رجل", "noteAr": ""}, {"kw": "walking in the spirit and falsehood do lie", "raw": "or, walk with the wind and lie falsely", "note": "or, walk with the wind and lie falsely", "refs": [], "kwAr": "بالكذب وباللغو الباطل", "noteAr": "أو: «يسير مع الريح ويكذب كذبا»."}, {"kw": "I will", "raw": "Mic_3:5, Mic_3:11; 1Ki_22:6; Jer_6:13, Jer_6:14, Jer_8:10,Jer_8:11, Jer_23:17; Rom_16:18; Phi_3:19; 2Pe_2:13-19", "note": "", "refs": [{"l": "Mic 3:5", "n": "", "vs": [[5, "وهذا ما يقوله الرب بشأن الأنبياء الذين يضلون شعبه، الذين ينادون قائلين: «سلام» لمن يعطيهم طعاما، ويعلنون الحرب على من لا يلقم أفواههم."]]}, {"l": "Mic 3:11", "n": "", "vs": [[11, "إذ يحكم رؤساؤها بالرشوة، وكهنتها يعلمون بالأجرة ويتعاطى أنبياؤها العرافة لقاء المال، ومع ذلك يدعون الاتكال على الله قائلين: «أليس الرب في وسطنا؟ لذلك لن يصيبنا مكروه»."]]}, {"l": "1Ki 22:6", "n": "", "vs": [[6, "فجمع ملك إسرائيل نحو أربع مئة من أنبياء الأصنام وسألهم: «هل أذهب للحرب إلى راموت جلعاد أم أمتنع؟» فأجابوه: «اذهب، فإن الرب سينصرك ويسلمها لك»."]]}, {"l": "Jer 6:13", "n": "", "vs": [[13, "لأنهم جميعا، صغارهم وكبارهم، مولعون بالربح الحرام. حتى النبي والكاهن يرتكبان الزور في أعمالهما."]]}, {"l": "Jer 6:14", "n": "", "vs": [[14, "يعالجون جراح شعبي باستخفاف قائلين: سلام، سلام. في حين لا يوجد سلام."]]}, {"l": "Jer 8:10", "n": "", "vs": [[10, "لذلك أعطي نساءهم لآخرين وحقولهم للوارثين القاهرين، لأنهم جميعا من صغيرهم إلى كبيرهم مولعون بالربح. حتى النبي والكاهن يرتكبان الزور في أعمالهما،"]]}, {"l": "Jer 8:11", "n": "", "vs": [[11, "ويعالجون جراح شعبي باستخفاف قائلين: سلام، سلام في حين لا يوجد سلام."]]}, {"l": "Jer 23:17", "n": "", "vs": [[17, "قائلين بإصرار لمن يحتقرونني: قد أعلن الرب أن السلام يسودكم ويرددون لكل من يجري وراء أهواء قلبه: لن يصيبكم ضر."]]}, {"l": "Rom 16:18", "n": "", "vs": [[18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."]]}, {"l": "Phi 3:19", "n": "", "vs": [[19, "الذين مصيرهم الهلاك، وإلههم بطونهم، ومفخرتهم في عيبتهم، وفكرهم منصرف إلى الأمور الأرضية."]]}, {"l": "2Pe 2:13-19", "n": "", "vs": [[13, "وبذلك ينالون أجرة إثمهم! إنهم يحسبون الانغماس في اللذات طول النهار بهجة عظيمة. فهم أوساخ وعيوب: يتلذذون بالنجاسة ويحاولون خداعكم، فيشتركون معكم في الولائم."], [14, "عيونهم لا تنظر إلا نظرات الزنى، ولا تشبع من الخطيئة. وكم من نفوس ضعيفة تقع في فخاخهم! أما قلوبهم، فقد تدربت على الشهوة والطمع. إنهم حقا أبناء اللعنة!"], [15, "وإذ خرجوا عن الطريق المستقيم، ضلوا. فهم سائرون في طريق بلعام بن بعور، الذي أحب الحصول على المال أجرة لإثمه."], [16, "ولكنه توبخ على هذه المخالفة التي ارتكبها. إذ إن الحمار الأبكم نطق بصوت بشري، فوضع حدا لحماقة ذلك النبي!"], [17, "فليس هؤلاء إلا آبارا لا ماء فيها، وغيوما تسوقها الريح العاصفة. ويا له من مصير مرعب محجوز لهم في الظلام الأبدي القاتم!"], [18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."], [19, "يعدون هؤلاء بالحرية، وهم أنفسهم عبيد للفساد! لأن الإنسان يصير عبدا لكل ما يتسلط عليه ويغلبه."]]}], "kwAr": "أتنبأ", "noteAr": ""}, {"kw": "he shall", "raw": "Isa_30:10,Isa_30:11; Jer_5:31; 2Th_2:11", "note": "", "refs": [{"l": "Isa 30:10", "n": "", "vs": [[10, "ويقولون للأنبياء: «لا تتنبأوا لنا بما هو حق، بل كلمونا بالكلام المداهن وتنبأوا بالمخادعات."]]}, {"l": "Isa 30:11", "n": "", "vs": [[11, "اعدلوا عن الطريق، حيدوا عن السبيل، وكفوا عن مجابهتنا بكلام قدوس إسرائيل»."]]}, {"l": "Jer 5:31", "n": "", "vs": [[31, "فالأنبياء يتنبأون زورا، والكهنة يتصرفون بمقتضى أحكامهم، وشعبي أحب مثل هذا. ولكن ماذا تصنعون في نهاية المطاف؟»"]]}, {"l": "2Th 2:11", "n": "", "vs": [[11, "ولهذا السبب، سيرسل الله إليهم طاقة الضلال حتى يصدقوا ما هو دجل،"]]}], "kwAr": "يصبح نبي", "noteAr": ""}], "arS": [["إن", ["H3863"]], [" ", []], ["جال", ["H1980"]], [" ", []], ["رجل", ["H376"]], [" يتنبأ بينكم ", []], ["بالكذب", ["H8267"]], [" ", []], ["وباللغو", ["H7307"]], [" ", []], ["الباطل", ["H3576"]], [" قائلا: إنني ", []], ["أتنبأ", ["H5197"]], [" لكم ", []], ["بالخمر", ["H3196"]], [" الوفير ", []], ["والمسكر", ["H7941"]], ["، فإنه ", []], ["يصبح", ["H1961"]], [" ", []], ["نبي", ["H5197"]], [" ", []], ["هذا", ["H2088"]], [" ", []], ["الشعب", ["H5971"]], [".", []]]}, {"c": 2, "v": 12, "text": "سأجمع شتاتك جميعا يايعقوب، وأجمع بقية إسرائيل وأضمهم معا كقطيع غنم في حظيرة، مثل قطيع محتشد في مرعى، فترتفع جلبة جمهورهم.", "groups": [{"kw": "surely assemble", "raw": "Mic_4:6, Mic_4:7; Isa_11:11, Isa_27:12; Jer_3:18, Jer_31:8; Eze_37:21; Hos_1:11", "note": "", "refs": [{"l": "Mic 4:6", "n": "", "vs": [[6, "في ذلك اليوم، يقول الرب، أجمع العرج، وأضم المطرودين وكل الذين أنزلت بهم البلاء."]]}, {"l": "Mic 4:7", "n": "", "vs": [[7, "فأجعل من العرج بقية، ومن المنبوذين أمة قوية، فيملك الرب عليهم في جبل صهيون من الآن وإلى الأبد."]]}, {"l": "Isa 11:11", "n": "", "vs": [[11, "فيعود الرب ليمد يده ثانية ليسترد البقية الباقية من شعبه، من أشور ومصر وفتروس وكوش وعيلام وشنعار وحماة، ومن جزائر البحر،"]]}, {"l": "Isa 27:12", "n": "", "vs": [[12, "في ذلك اليوم ينتقيكم الرب من مجرى الفرات إلى وادي النيل، كما ينتقى القمح، ويجمعكم واحدا فواحدا يا بني إسرائيل."]]}, {"l": "Jer 3:18", "n": "", "vs": [[18, "وتنضم في تلك الأيام ذرية يهوذا إلى ذرية إسرائيل ويأتون معا من أرض الشمال إلى الديار التي أورثتها لآبائهم."]]}, {"l": "Jer 31:8", "n": "", "vs": [[8, "ها أنا آتي بهم من بلاد الشمال، وأجمعهم من أقصى أطراف الأرض، وفيهم الأعمى والأعرج، الحبلى والماخض، فيرجع حشد عظيم إلى هنا."]]}, {"l": "Eze 37:21", "n": "", "vs": [[21, "وها أنا أحشد أبناء إسرائيل من بين الأمم التي تفرقوا فيها وأجمعهم من كل جهة وأحضرهم إلى أرضهم."]]}, {"l": "Hos 1:11", "n": "", "vs": [[11, "ويجتمع أبناء يهوذا وأبناء إسرائيل معا وينصبون عليهم قائدا واحدا، ويرجعون من أرض السبي، لأن يوم يزرعيل عظيم»."]]}], "kwAr": "سأجمع", "noteAr": ""}, {"kw": "I will put", "raw": "Mic_7:14; Jer_23:3, Jer_31:10; Eze_34:11, Eze_34:22, Eze_34:31", "note": "", "refs": [{"l": "Mic 7:14", "n": "", "vs": [[14, "ارع يارب شعبك بعصاك، فهم قطيع ميراثك الرابضون وحدهم في الغابة في وسط الكرمل. قدهم إلى باشان وجلعاد ليتمتعوا بخصب أرضهما كالعهد بهم في أيام القدم."]]}, {"l": "Jer 23:3", "n": "", "vs": [[3, "وأجمع شتات غنمي من جميع الأراضي التي أجليتها إليها، وأردها إلى مراعيها فتنمو وتتكاثر،"]]}, {"l": "Jer 31:10", "n": "", "vs": [[10, "«فاسمعوا كلام الرب أيها الأمم، وأذيعوا في الجزائر البعيدة، وقولوا: «الذي بدد شعب إسرائيل هو الذي يجمعه ويحافظ عليه كما يحافظ الراعي على قطيعه."]]}, {"l": "Eze 34:11", "n": "", "vs": [[11, "لأن هذا ما يعلنه السيد الرب: ها أنا أبحث عن غنمي وأفتقدها."]]}, {"l": "Eze 34:22", "n": "", "vs": [[22, "ولكني أنقذ غنمي فلا تكون من بعد غنيمة، وأقضي بين شاة وشاة،"]]}, {"l": "Eze 34:31", "n": "", "vs": [[31, "وأنتم ياقطيعي غنم مرعاي، أنتم بشر وأنا إلهكم يقول السيد الرب»."]]}], "kwAr": "وأضمهم", "noteAr": ""}, {"kw": "Bozrah", "raw": "Gen_36:33; Isa_34:6; Amo_1:12", "note": "", "refs": [{"l": "Gen 36:33", "n": "", "vs": [[33, "ومات بالع فخلفه يوباب بن زارح من بصرة."]]}, {"l": "Isa 34:6", "n": "", "vs": [[6, "للرب سيف مشبع بالدم، مطلي بالشحم، بدم حملان وتيوس، وبشحم كلى كباش، لأن للرب ذبيحة في بصرة، ومذبحة في أدوم."]]}, {"l": "Amo 1:12", "n": "", "vs": [[12, "فأرسل نارا على تيمان، فتلتهم حصون بصرة."]]}], "kwAr": "حظيرة", "noteAr": ""}, {"kw": "they", "raw": "Jer_31:7-9; Eze_36:37; Zec_8:22, Zec_8:23, Zec_9:14, Zec_9:15, Zec_10:6-8", "note": "", "refs": [{"l": "Jer 31:7-9", "n": "", "vs": [[7, "فإن هذا ما يعلنه الرب: «رنموا بهتاف ليعقوب، اهتفوا لرأس الأمم، أعلنوا وسبحوا وقولوا: أنقذ يارب شعبك، بقية إسرائيل»."], [8, "ها أنا آتي بهم من بلاد الشمال، وأجمعهم من أقصى أطراف الأرض، وفيهم الأعمى والأعرج، الحبلى والماخض، فيرجع حشد عظيم إلى هنا."], [9, "سيرجعون بنوح، وبتضرعات أهديهم. إلى جوار جداول المياه أسيرهم فيمشون في طريق مستقيمة لا يعثرون فيها، لأني أب لإسرائيل، وأفرايم بكري»."]]}, {"l": "Eze 36:37", "n": "", "vs": [[37, "عندئذ أجعل شعب إسرائيل يلتمسون هذا مني، فأستجيب لمطلبهم: أن أكثرهم كقطيع غنم."]]}, {"l": "Zec 8:22", "n": "", "vs": [[22, "فتتوافد أمم كثيرة وشعوب قوية ليلتمسوا وجه الرب القدير في أورشليم وليحظوا برضاه."]]}, {"l": "Zec 8:23", "n": "", "vs": [[23, "في تلك الأيام يتشبث عشرة رجال من أبناء الأمم بثوب رجل يهودي قائلين: دعنا نذهب معكم، لأننا سمعنا أن الرب معكم»."]]}, {"l": "Zec 9:14", "n": "", "vs": [[14, "ثم يتجلى الرب، وينفذ سهمه كالبرق. ينفخ السيد الرب بالبوق ويقتحم في زوابع الجنوب."]]}, {"l": "Zec 9:15", "n": "", "vs": [[15, "يقيهم الرب القدير فلا تنالهم حجارة المقلاع، بل تقصر عنهم ويطأونها، ويشربون (من دماء أعدائهم) ويصخبون كالسكارى من الخمر ويمتلئون كمناضح المحرقات وزوايا المذبح."]]}, {"l": "Zec 10:6-8", "n": "", "vs": [[6, "إني أشدد شعب يهوذا وأخلص ذرية يوسف وأردهم إلى أرضهم لأني أكن لهم الرحمة، فيكونون كأني لم أنبذهم لأني أنا الرب إلههم فأستجيبهم."], [7, "ويصبح شعب إسرائيل كجبابرة الحرب، وتنتشي قلوبهم كمن شرب خمرة، ويشهد أبناؤهم هذا ويفرحون، وتبتهج نفوسهم بالرب."], [8, "أصدر إشارتي لهم فأجمع شتاتهم، لأني افتديتهم، ويكثرون كما في الحقب الأولى."]]}], "kwAr": "فترتفع", "noteAr": ""}], "arS": [["سأجمع", ["H622", "H622"]], [" شتاتك ", []], ["جميعا", ["H3605"]], [" ", []], ["يايعقوب", ["H3290"]], ["، ", []], ["وأجمع", ["H6908", "H6908"]], [" ", []], ["بقية", ["H7611"]], [" ", []], ["إسرائيل", ["H3478"]], [" ", []], ["وأضمهم", ["H7760"]], [" ", []], ["معا", ["H3162"]], [" ", []], ["كقطيع", ["H6629"]], [" غنم في ", []], ["حظيرة", ["H1223"]], ["، مثل ", []], ["قطيع", ["H5739"]], [" محتشد في ", []], ["مرعى", ["H8432", "H1699"]], ["، ", []], ["فترتفع", ["H1949"]], [" جلبة ", []], ["جمهورهم", ["H4480", "H120"]], [".", []]]}, {"c": 2, "v": 13, "text": "والذي يفتح الثغرة يتقدمهم فيقتحمون ويعبرون الباب خارجا، وفي طليعتهم يسير ملكهم والرب في مقدمتهم.", "groups": [{"kw": "breaker", "raw": "Isa_42:7, Isa_42:13-16, Isa_45:1, Isa_45:2, Isa_49:9, Isa_49:24, Isa_49:25, Isa_51:9, Isa_51:10, Isa_55:4, Isa_59:16-19; Jer_51:20-24; Dan_2:34, Dan_2:35, Dan_2:44; Hos_13:14; Zec_12:8; 1Co_15:21-26; Heb_2:14, Heb_2:15", "note": "", "refs": [{"l": "Isa 42:7", "n": "", "vs": [[7, "لتفتح عيون العمي، وتطلق سراح المأسورين في السجن، وتحرر الجالسين في ظلمة الحبس."]]}, {"l": "Isa 42:13-16", "n": "", "vs": [[13, "يبرز الرب كجبار، يستثير حميته كما يستثيرها المحارب، ويطلق صرخة حرب داوية، يظهر جبروته أمام أعدائه."], [14, "لكم اعتصمت بالصمت، ولزمت السكينة ولجمت نفسي. أما الآن فأنا أصيح وأزفر كامرأة تقاسي من المخاض."], [15, "أخرب الجبال والتلال، وأيبس كل عشبها، وأحول الأنهار إلى قفر وأجفف البحيرات،"], [16, "وأقود العمي في سبيل لم يعرفوها من قبل، وأهديهم في مسالك يجهلونها، وأحيل الظلام أمامهم إلى نور، والأماكن الوعرة إلى أرض ممهدة. هذه الأمور أصنعها ولن أتخلى عنهم."]]}, {"l": "Isa 45:1", "n": "", "vs": [[1, "هذا ما يقوله الرب لكورش مختاره، الذي أخذت بيمينه حتى أخضع أمامه أمما وأكسر شوكة ملوك، لأفتح أمامه كوات ولا توصد في وجهه مصاريع."]]}, {"l": "Isa 45:2", "n": "", "vs": [[2, "ها أنا أتقدمك لأسوي الجبال بالأرض وأحطم أبواب النحاس، وأكسر مغاليق الحديد،"]]}, {"l": "Isa 49:9", "n": "", "vs": [[9, "لتقول للأسرى: اخرجوا، وللذين في الظلمة اظهروا، فيرعون في الطرقات وتصبح الروابي الجرداء مراعي لهم."]]}, {"l": "Isa 49:24", "n": "", "vs": [[24, "هل تسلب الغنيمة من المحارب الجبار؟ أو يفلت الأسرى من قبضة الغالب؟"]]}, {"l": "Isa 49:25", "n": "", "vs": [[25, "نعم سبي الجبار يسلب منه، وتسترد الغنيمة من الغالب، لأنني أخاصم مخاصميك وأنقذ أبناءك،"]]}, {"l": "Isa 51:9", "n": "", "vs": [[9, "استيقظي، استيقظي، تسربلي بالقوة ياذراع الرب، استيقظي كالعهد بك في الأيام القديمة، وفي الأجيال الغابرة. ألست أنت التي مزقت رهب إربا إربا، وطعنت التنين؟"]]}, {"l": "Isa 51:10", "n": "", "vs": [[10, "ألست أنت التي جففت البحر، ومياه اللجج العميقة، وجعلت أعماق البحر طريقا يعبر فوقه المفديون؟"]]}, {"l": "Isa 55:4", "n": "", "vs": [[4, "ها أنا قد جعلته شاهدا للشعوب زعيما وقائدا للأمم."]]}, {"l": "Isa 59:16-19", "n": "", "vs": [[16, "وإذ لم يجد إنسانا ينتصر للحق، وأدهشه أن لا يرى شفيعا، أحرزت له ذراعه انتصارا، وعضده بره."], [17, "فتدرع بالبر وارتدى على رأسه خوذة الخلاص، واكتسى بثياب الانتقام، والتف بعباءة الغضب."], [18, "فهو يجازيهم بمقتضى أعمالهم. يجازي أعداءه، ويعاقب خصومه، وينزل القصاص بالجزائر،"], [19, "فيتقون من المغرب اسم الرب، ومن المشرق يخشون مجد الرب، لأنه سيأتي العدو كنهر متدفق فتدفعه ريح الرب."]]}, {"l": "Jer 51:20-24", "n": "", "vs": [[20, "أنت فأس معركتي وآلة حربي. بك أمزق الأمم إربا وأحطم ممالك."], [21, "بك أجعل الفرس وفارسها أشلاء، وأهشم المركبة وراكبها."], [22, "بك أحطم الرجل والمرأة، والشيخ والفتى، والشاب والعذراء."], [23, "بك أسحق الراعي وقطيعه، والحارث وفدانه، والحكام والولاة."], [24, "سأجازي بابل وسائر الكلدانيين على كل شرهم الذي ارتكبوه في حق صهيون، على مرأى منكم، يقول الرب."]]}, {"l": "Dan 2:34", "n": "", "vs": [[34, "وبينما أنت في الرؤيا انقض حجر لم يقطع بيد إنسان، وضرب التمثال على قدميه المصنوعتين من خليط الحديد والخزف فسحقهما،"]]}, {"l": "Dan 2:35", "n": "", "vs": [[35, "فتحطم الحديد والخزف والنحاس والفضة والذهب معا، وانسحقت وصارت كعصافة البيدر في الصيف، فحملتها الريح حتى لم يبق لها أثر. أما الحجر الذي ضرب التمثال فتحول إلى جبل كبير وملأ الأرض كلها."]]}, {"l": "Dan 2:44", "n": "", "vs": [[44, "وفي عهد هؤلاء الملوك يقيم إله السماوات مملكة لا تنقرض إلى الأبد، ولا يترك ملكها لشعب آخر، وتسحق وتبيد جميع هذه الممالك. أما هي فتخلد إلى الأبد."]]}, {"l": "Hos 13:14", "n": "", "vs": [[14, "هل أفتديهم من قوة الهاوية؟ هل أنجيهم من الموت؟ أين أوبئتك ياموت؟ أين هلاكك ياهاوية؟ قد احتجبت الرحمة عن عيني."]]}, {"l": "Zec 12:8", "n": "", "vs": [[8, "في ذلك اليوم يحفظ الرب سكان أورشليم، فيكون أضعفهم قويا قادرا مثل داود، ويتولى بيت داود قيادتهم في الطليعة، تماما كما كان الله أو ملاك الرب يتقدمهم."]]}, {"l": "1Co 15:21-26", "n": "", "vs": [[21, "فبما أن الموت كان بإنسان، فإن قيامة الأموات أيضا تكون بإنسان."], [22, "فإنه، كما يموت الجميع في آدم، فكذلك سيحيى الجميع في المسيح،"], [23, "على أن لكل واحد رتبته: فأولا المسيح بصفته البكر؛ وبعده خاصته لدى رجوعه،"], [24, "وبعد ذلك الآخرة حين يسلم المسيح الملك لله الآب بعد أن يكون قد أباد كل رئاسة وكل سلطة وكل قوة."], [25, "فإنه لابد أن يملك «إلى أن يضع جميع الأعداء تحت قدميه»."], [26, "وآخر عدو يباد هو الموت. ذلك بأنه قد «أخضع كل شيء تحت قدميه»."]]}, {"l": "Heb 2:14", "n": "", "vs": [[14, "إذن، بما أن هؤلاء الأولاد متشاركون في أجسام بشرية من لحم ودم، اشترك المسيح أيضا في اللحم والدم باتخاذه جسما بشريا. وهكذا تمكن أن يموت، ليقضي على من له سلطة الموت، أي إبليس،"]]}, {"l": "Heb 2:15", "n": "", "vs": [[15, "ويحرر من كان الخوف من الموت يستعبدهم طوال حياتهم."]]}], "kwAr": "يفتح الثغرة", "noteAr": ""}, {"kw": "they have", "raw": "Zec_10:5-7, Zec_10:12, Zec_12:3-8", "note": "", "refs": [{"l": "Zec 10:5-7", "n": "", "vs": [[5, "ويدوسون الأعداء معا كما يدوس الجبابرة الطين في الشوارع، ويحاربون لأن الرب معهم فيلحقون العار بفرسان الأعداء."], [6, "إني أشدد شعب يهوذا وأخلص ذرية يوسف وأردهم إلى أرضهم لأني أكن لهم الرحمة، فيكونون كأني لم أنبذهم لأني أنا الرب إلههم فأستجيبهم."], [7, "ويصبح شعب إسرائيل كجبابرة الحرب، وتنتشي قلوبهم كمن شرب خمرة، ويشهد أبناؤهم هذا ويفرحون، وتبتهج نفوسهم بالرب."]]}, {"l": "Zec 10:12", "n": "", "vs": [[12, "وأشددهم بالرب فيسلكون بمقتضى اسمه، يقول الرب."]]}, {"l": "Zec 12:3-8", "n": "", "vs": [[3, "في ذلك اليوم أجعل أورشليم كصخرة ثقيلة تعجز عن حملها جميع الشعوب. وكل من يحاول حملها ينشق شقا، ويتألب عليها جميع شعوب الأرض."], [4, "في ذلك اليوم، يقول الرب: أصيب كل فرس من جيوش الأعداء بالرعب، وفارسه بالجنون، وأرعى برضاي شعب يهوذا، وأبتلي جميع خيول الأمم بالعمى."], [5, "فيقول آنئذ رؤساء يهوذا في قلوبهم: إن سكان أورشليم أعزاء بفضل قوة الرب القدير إلههم."], [6, "في ذلك اليوم أجعل عشائر يهوذا كمستوقد نار بين الحطب، أو كمشعل ملتهب بين أكداس الحنطة، فيلتهمون الشعوب من حولهم ممن عن يمينهم وعن يسارهم، بينما تظل أورشليم مستقرة آمنة آهلة في موضعها."], [7, "ويخلص الرب أولا خيام يهوذا لئلا يتعاظم افتخار بيت داود وأهل أورشليم على سائر يهوذا."], [8, "في ذلك اليوم يحفظ الرب سكان أورشليم، فيكون أضعفهم قويا قادرا مثل داود، ويتولى بيت داود قيادتهم في الطليعة، تماما كما كان الله أو ملاك الرب يتقدمهم."]]}], "kwAr": "فيقتحمون", "noteAr": ""}, {"kw": "their", "raw": "Isa_49:10, Isa_51:12, Isa_52:12; Jer_23:5, Jer_23:6; Eze_34:23, Eze_34:24; Hos_1:11, Hos_3:5; Zec_9:14, Zec_9:15; Joh_10:27-30; Heb_2:9, Heb_2:10, Heb_6:20; Rev_7:17, Rev_17:14; Rev_19:13-17", "note": "", "refs": [{"l": "Isa 49:10", "n": "", "vs": [[10, "لا يجوعون ولا يعطشون، ولا يعييهم لهيب الصحراء ولا لفح الشمس، لأن راحمهم يهديهم ويقودهم إلى ينابيع المياه."]]}, {"l": "Isa 51:12", "n": "", "vs": [[12, "أنا، أنا هو معزيكم، فمن أنت حتى تخشي إنسانا فانيا أو بشرا يبيدون كالعشب؟"]]}, {"l": "Isa 52:12", "n": "", "vs": [[12, "لأنكم لن تخرجوا من بابل في عجلة، ولن تغادروها هاربين، لأن الرب سيسير أمامكم، وإله إسرائيل يحرس مؤخرة قافلتكم."]]}, {"l": "Jer 23:5", "n": "", "vs": [[5, "ها أيام مقبلة أقيم فيها لداود ذرية بر، ملكا يسود بحكمة، ويجري في الأرض عدلا وحقا."]]}, {"l": "Jer 23:6", "n": "", "vs": [[6, "في عهده يتم خلاص شعب يهوذا، ويسكن شعب إسرائيل آمنا. أما الاسم الذي سيدعى به فهو: الرب برنا."]]}, {"l": "Eze 34:23", "n": "", "vs": [[23, "وأنصب عليها راعيا واحدا عبدي داود (أي المسيح) يرعاها بنفسه ويكون لها راعيا أمينا."]]}, {"l": "Eze 34:24", "n": "", "vs": [[24, "وأنا الرب أكون لهم إلها، وعبدي داود يكون لهم رئيسا. أنا الرب تكلمت."]]}, {"l": "Hos 1:11", "n": "", "vs": [[11, "ويجتمع أبناء يهوذا وأبناء إسرائيل معا وينصبون عليهم قائدا واحدا، ويرجعون من أرض السبي، لأن يوم يزرعيل عظيم»."]]}, {"l": "Hos 3:5", "n": "", "vs": [[5, "ثم يرجع أبناء إسرائيل ويطلبون الرب إلههم، وداود ملكهم (أي المسيح)، ويلتمسون برهبة الرب وجوده في آخر الأيام»."]]}, {"l": "Zec 9:14", "n": "", "vs": [[14, "ثم يتجلى الرب، وينفذ سهمه كالبرق. ينفخ السيد الرب بالبوق ويقتحم في زوابع الجنوب."]]}, {"l": "Zec 9:15", "n": "", "vs": [[15, "يقيهم الرب القدير فلا تنالهم حجارة المقلاع، بل تقصر عنهم ويطأونها، ويشربون (من دماء أعدائهم) ويصخبون كالسكارى من الخمر ويمتلئون كمناضح المحرقات وزوايا المذبح."]]}, {"l": "Joh 10:27-30", "n": "", "vs": [[27, "فخرافي تصغي لصوتي، وأنا أعرفها وهي تتبعني،"], [28, "وأعطيها حياة أبدية، فلا تهلك إلى الأبد، ولا ينتزعها أحد من يدي."], [29, "إن الآب الذي أعطاني إياها هو أعظم من الجميع، ولا يقدر أحد أن ينتزع من يد الآب شيئا."], [30, "أنا والآب واحد!»"]]}, {"l": "Heb 2:9", "n": "", "vs": [[9, "إلا أننا نرى يسوع الآن مكللا بالمجد والكرامة، لأنه قاسى الموت. وذلك بعدما صار أدنى من الملائكة إلى حين، ليذوق بنعمة الله الموت عوضا عن كل واحد."]]}, {"l": "Heb 2:10", "n": "", "vs": [[10, "فلما قصد الله ، الذي من أجله كل شيء وبه كل شيء، أن يحضر إلى المجد أبناء كثيرين، كان من اللائق أن يجعل قائدهم إلى الخلاص مؤهلا لإكمال مهمته عن طريق الآلام."]]}, {"l": "Heb 6:20", "n": "", "vs": [[20, "فلأجلنا دخل يسوع إلى هناك سابقا لنا. وهو هناك يقوم بمهمته نيابة عنا بعدما صار رئيس كهنة إلى الأبد على رتبة ملكيصادق!"]]}, {"l": "Rev 7:17", "n": "", "vs": [[17, "لأن الحمل الذي في وسط العرش يرعاهم ويقودهم إلى ينابيع ماء الحياة، ويمسح الله كل دمعة من عيونهم»."]]}, {"l": "Rev 17:14", "n": "", "vs": [[14, "ثم يحاربون الحمل، ولكن الحمل يهزمهم، لأنه رب الأرباب وملك الملوك، والذين معه هم المدعوون، المختارون، المؤمنون»."]]}, {"l": "Rev 19:13-17", "n": "", "vs": [[13, "وكان يرتدي ثوبا مغمسا بالدم؛ أما اسمه فهو «كلمة الله»"], [14, "وكان الأجناد الذين في السماء يتبعونه راكبين خيولا بيضاء، ولابسين كتانا نقيا ناصع البياض،"], [15, "وكان يخرج من فمه سيف حاد ليضرب به الأمم ويحكمهم بعصا من حديد، ويدوسهم في معصرة شدة غضب الله القادر على كل شيء."], [16, "وقد كتب على ثوبه وعلى فخذه «ملك الملوك ورب الأرباب»."], [17, "ثم رأيت ملاكا واقفا في الشمس، ينادي الطيور الطائرة في وسط السماء بصوت عال قائلا: «هلمي اجتمعي معا إلى وليمة الله الكبرى!"]]}], "kwAr": "ملكهم", "noteAr": ""}], "arS": [["والذي ", []], ["يفتح", ["H6555"]], [" الثغرة ", []], ["يتقدمهم", ["H5927", "H6440"]], [" ", []], ["فيقتحمون", ["H6555"]], [" ", []], ["ويعبرون", ["H5674"]], [" ", []], ["الباب", ["H8179"]], [" ", []], ["خارجا", ["H3318"]], ["، وفي ", []], ["طليعتهم", ["H6440"]], [" ", []], ["يسير", ["H5674"]], [" ", []], ["ملكهم", ["H4428"]], [" ", []], ["والرب", ["H3068"]], [" في ", []], ["مقدمتهم", ["H7218"]], [".", []]]}, {"c": 3, "v": 1, "text": "وقلت اسمعوا يارؤساء يعقوب وياقضاة شعب إسرائيل: ألا ينبغي لكم أن تعرفوا الحق؟", "groups": [{"kw": "", "raw": "Cir, am 3294, bc 710", "note": "Cir, am 3294, bc 710", "refs": [], "kwAr": "", "noteAr": "الدورة: 3294، قبل الميلاد 710."}, {"kw": "Hear", "raw": "Mic_3:9, Mic_3:10; Isa_1:10; Jer_13:15-18, Jer_22:2, Jer_22:3; Hos_5:1; Amo_4:1", "note": "", "refs": [{"l": "Mic 3:9", "n": "", "vs": [[9, "استمعوا هذا يارؤساء بيت يعقوب وقضاة شعب إسرائيل الذين يكرهون العدل ويحرفون الحق."]]}, {"l": "Mic 3:10", "n": "", "vs": [[10, "الذين يبنون صهيون بالدم وأورشليم بالظلم."]]}, {"l": "Isa 1:10", "n": "", "vs": [[10, "اسمعوا كلمة الرب ياحكام سدوم. أصغوا إلى شريعة إلهنا ياأهل عمورة:"]]}, {"l": "Jer 13:15-18", "n": "", "vs": [[15, "فاسمعوا واصغوا ولا تستكبروا، لأن الرب قد تكلم."], [16, "مجدوا الرب إلهكم قبل أن يجعل الظلام يخيم عليكم، وقبل أن تتعثر أقدامكم على الجبال المعتمة. أنتم ترتقبون النور ولكنه يحوله إلى ظلام الموت ويجعله ليلا دامسا."], [17, "وإن لم تنصتوا فإن نفسي تبكي في الخفاء من أجل كبريائكم، وتذرف عيناي الدموع المريرة، فتسيل العبرات لأن الرب قد سبى شعبه."], [18, "قل للملك وللملكة: «تواضعا، وتنازلا عن موضعكما لأن تاج مجدكما قد سقط عن رأسيكما»."]]}, {"l": "Jer 22:2", "n": "", "vs": [[2, "اسمع كلمة الرب ياملك يهوذا المتربع على عرش داود، أنت وخدامك وشعبك المجتازين من هذه البوابات:"]]}, {"l": "Jer 22:3", "n": "", "vs": [[3, "أجروا العدل وأنقذوا المغتصب من يد المغتصب، ولا تجوروا على الغريب واليتيم والأرملة، ولا تتعسفوا عليهم، ولا تسفكوا دما بريئا في هذا الموضع."]]}, {"l": "Hos 5:1", "n": "", "vs": [[1, "اسمعوا هذا أيها الكهنة وأنصتوا ياشعب إسرائيل، وأصغوا ياأهل بيت الملك، لأن القضاء حال بكم إذ كنتم فخا في المصفاة وشبكة منصوبة على جبل تابور."]]}, {"l": "Amo 4:1", "n": "", "vs": [[1, "اسمعي هذه الكلمة يانساء باشان، اللواتي يقمن في جبل السامرة، ممن يظلمن المسكين ويسحقن الفقراء واللواتي يقلن لأزواجهن: هاتوا مسكرا لنشرب."]]}], "kwAr": "اسمعوا", "noteAr": ""}, {"kw": "Is it", "raw": "Deu_1:13-17, Deu_16:18; 2Ch_19:5-10; Psa_14:4, Psa_82:1-5; Jer_5:4, Jer_5:5; 1Co_6:5", "note": "", "refs": [{"l": "Deu 1:13-17", "n": "", "vs": [[13, "فاختاروا من أسباطكم رجالا حكماء عقلاء من ذوي المقام، فأجعلهم قادة لكم."], [14, "فأجبتموني قائلين: إن ما تقترح علينا أن نفعله أمر صائب."], [15, "فاخترت رؤساء أسباطكم رجالا حكماء من ذوي المقام، وأقمتهم قادة عليكم، فكانوا رؤساء ألوف ومئات وخماسين وعشرات، وعرفاء لأسباطكم."], [16, "وأمرت قضاتكم آنئذ قائلا: استمعوا إلى الخصومات الناشبة بين إخوتكم واقضوا بالعدل بين الإسرائيلي وأخيه أو بين الإسرائيلي والنزيل."], [17, "لا تحابوا في القضاء واستمعوا للصغير كما تستمعون للكبير. لا تهابوا إنسانا، لأن القضاء لله. وما يشكل عليكم من أمر ترفعونه إلي فأقضي فيه."]]}, {"l": "Deu 16:18", "n": "", "vs": [[18, "وأقيموا لأنفسكم قضاة ومدبرين في جميع المدن التي يورثكم إياها الرب إلهكم بحسب أسباطكم فيقضوا بين الشعب بالعدل."]]}, {"l": "2Ch 19:5-10", "n": "", "vs": [[5, "وعين قضاة في كل مدن يهوذا المحصنة."], [6, "وقال لهم: «توخوا الحيطة في كل حكم تصدرونه، لأنكم لا تقضون للإنسان بل للرب الحاضر معكم دائما عند إصدار أحكامكم."], [7, "ولتكن هيبة الرب عليكم. فاحرصوا على إقامة العدل لأنه ليس عند الرب إلهنا ظلم ولا محاباة ولا رشوة»."], [8, "كذلك عين يهوشافاط في أورشليم قضاة للرب من اللاويين والكهنة ورؤساء بيوتات الشعب لفض النزاعات. وكان مقر إقامتهم في أورشليم،"], [9, "وأوصاهم قائلا: «اقضوا بتقوى الرب بأمانة وقلب خالص النية."], [10, "وعليكم في كل دعوى يرفعها إليكم إخوتكم المقيمون في مدنهم، تتعلق بقضية قتل، أو بين شريعة ووصية لها مساس بالفرائض والأحكام، أن تحذروهم لئلا يأثموا إلى الرب فيحل عليكم وعلى إخوتكم غضبه. افعلوا هذا وتفادوا الإثم."]]}, {"l": "Psa 14:4", "n": "", "vs": [[4, "أليس لدى جميع فاعلي الإثم معرفة؟ أولئك الذين يأكلون شعبي كما يأكلون خبزا، والرب لا يطلبون."]]}, {"l": "Psa 82:1-5", "n": "", "vs": [[1, "الله يترأس ساحة قضائه، وعلى القضاة يصدر حكما."], [2, "حتى متى تقضون بالظلم وتنحازون إلى الأشرار؟"], [3, "احكموا للذليل واليتيم. وأنصفوا المسكين والبائس."], [4, "أنقذوا المسكين والفقير؛ أنقذوهما من قبضة الأشرار."], [5, "هم من غير معرفة وفهم، يتمشون في الظلمة وتتزعزع أسس الأرض من كثرة الجور."]]}, {"l": "Jer 5:4", "n": "", "vs": [[4, "فقلت في نفسي: «إنما هم مساكين حمقى، يجهلون طريق الرب وقضاء إلههم."]]}, {"l": "Jer 5:5", "n": "", "vs": [[5, "فلأقصدن العظماء وأكلمهم لأنهم يعرفون طريق الرب وقضاء إلههم». فإذا هؤلاء جميعا قد حطموا النير وقطعوا الربط."]]}, {"l": "1Co 6:5", "n": "", "vs": [[5, "أقول هذا تخجيلا لكم. أهكذا ليس بينكم حتى حكيم واحد يقدر أن يقضي بين إخوته!"]]}], "kwAr": "ألا ينبغي لكم", "noteAr": ""}], "arS": [["وقلت", ["H559"]], [" ", []], ["اسمعوا", ["H8085"]], [" ", []], ["يارؤساء", ["H7218"]], [" ", []], ["يعقوب", ["H3290"]], [" ", []], ["وياقضاة", ["H7101"]], [" ", []], ["شعب", ["H1004"]], [" ", []], ["إسرائيل", ["H3478"]], [": ", []], ["ألا", ["H3808"]], [" ينبغي لكم أن ", []], ["تعرفوا", ["H3045"]], [" ", []], ["الحق", ["H4941"]], ["؟", []]]}, {"c": 3, "v": 2, "text": "أنتم يامن تبغضون الخير وتحبون الشر، وتسلخون جلود شعبي وتجردون لحومهم عن عظامهم.", "groups": [{"kw": "hate", "raw": "1Ki_21:20, 1Ki_22:6-8; Amo_5:10-14; Luk_19:14; Joh_7:7, Joh_15:18, Joh_15:19, Joh_15:23, Joh_15:24; Act_7:51, Act_7:52; Rom_12:9; 2Ti_3:3", "note": "", "refs": [{"l": "1Ki 21:20", "n": "", "vs": [[20, "وما إن رأى أخآب إيليا حتى قال: «هل وجدتني ياعدوي؟» فأجابه: «قد وجدتك لأنك بعت نفسك لارتكاب الشر في عيني الرب."]]}, {"l": "1Ki 22:6-8", "n": "", "vs": [[6, "فجمع ملك إسرائيل نحو أربع مئة من أنبياء الأصنام وسألهم: «هل أذهب للحرب إلى راموت جلعاد أم أمتنع؟» فأجابوه: «اذهب، فإن الرب سينصرك ويسلمها لك»."], [7, "فقال يهوشافاط: «ألا يوجد هنا بعد نبي من أنبياء الرب فنسأله المشورة؟»"], [8, "فأجاب ملك إسرائيل: «يوجد بعد رجل واحد، يمكننا عن طريقه أن نطلب مشورة الرب، ولكني أمقته لأنه لا يتنبأ علي بغير الشر. إنه ميخا بن يملة». فقال يهوشافاط: «لا تقل هذا أيها الملك»."]]}, {"l": "Amo 5:10-14", "n": "", "vs": [[10, "قد أبغضوا من يندد بالجور في ساحة القضاء، ويكرهون من ينطق بالحق."], [11, "فلأنكم تطأون المسكين وتبتزون منه رشوة قمح حتى تشيدوا بيوتا من حجارة منحوتة، فإنكم لن تسكنوا فيها، وتغرسوا كروما شهية ولكنكم لن تشربوا من خمرها."], [12, "لأنني عالم بكثرة معاصيكم وعظم خطاياكم، إذ أنكم تضايقون البار أيها المرتشون الذين تصدون المسكين عن حقه في ساحة القضاء."], [13, "لهذا يصمت العاقل في مثل هذا الزمان الرديء."], [14, "اطلبوا الخير لا الشر لتحيوا، فيكون الرب الإله القدير معكم كما تقولون."]]}, {"l": "Luk 19:14", "n": "", "vs": [[14, "ولكن أهل بلده كانوا يبغضونه، فأرسلوا في إثره وفدا، قائلين: لا نريد أن يملك هذا علينا!"]]}, {"l": "Joh 7:7", "n": "", "vs": [[7, "لا يقدر العالم أن يبغضكم، ولكنه يبغضني أنا، لأني أشهد عليه أن أعماله شريرة."]]}, {"l": "Joh 15:18", "n": "", "vs": [[18, "إن أبغضكم العالم، فاعلموا أنه قد أبغضني من قبلكم."]]}, {"l": "Joh 15:19", "n": "", "vs": [[19, "لو كنتم من أهل العالم، لكان العالم يحب أهله، ولكن ", "n": "", "vs": [[3, "القائلون: ألم يحن الوقت لنبني حصونا؟ فهذه المدينة هي كالقدر (أي كسور حولنا) ونحن كاللحم. (أي كالمحتمين بالسور)."]]}, {"l": "Eze 11:6", "n": "", "vs": [[6, "لقد أكثرتم قتلاكم في هذه المدينة وملأتم منهم شوارعها."]]}, {"l": "Eze 11:7", "n": "", "vs": [[7, "لذلك فإن قتلاكم الذين طرحتموهم في وسطها هم اللحم وهي القدر، وسأخرجكم منها."]]}], "kwAr": "وتقطعونهم", "noteAr": ""}], "arS": [["الذين ", []], ["تأكلون", ["H398"]], [" ", []], ["لحوم", ["H7607"]], [" ", []], ["شعبي", ["H5971"]], ["، ", []], ["وتسلخون", ["H6584"]], [" ", []], ["جلودهم", ["H5785"]], [" ", []], ["عنهم", ["H4480", "H5921"]], [" ", []], ["وتهشمون", ["H6476"]], [" ", []], ["عظامهم", ["H6106"]], ["، ", []], ["وتقطعونهم", ["H6566"]], [" كما يقطع اللحم في ", []], ["القدر", ["H5518"]], ["، أو ", []], ["كاللحم", ["H1320"]], [" المعد ", []], ["للمقلى", ["H8432", "H7037"]], [".", []]]}, {"c": 3, "v": 4, "text": "ثم حين تستغيثون بالرب لا يستجيب ويحجب وجهه عنكم في ذلك الوقت بسبب ما ارتكبتموه من أعمال شريرة.", "groups": [{"kw": "Then", "raw": "Mic_2:3, Mic_2:4; Jer_5:31", "note": "", "refs": [{"l": "Mic 2:3", "n": "", "vs": [[3, "لهذا، هكذا يقول الرب. ها أنا أدبر شرا لهذا الشعب تعجزون عن فك رقابكم منه، ولن تمشوا بعد متشامخين لأن الزمن يكون زمن سوء."]]}, {"l": "Mic 2:4", "n": "", "vs": [[4, "في ذلك اليوم يسخر أعداؤكم منكم، وتنوحون بمثل هذا الرثاء: «قد تم تدميرنا واستبدل الرب نصيب شعبه. كيف أخذه منا وقسم حقولنا بين آسرينا؟»"]]}, {"l": "Jer 5:31", "n": "", "vs": [[31, "فالأنبياء يتنبأون زورا، والكهنة يتصرفون بمقتضى أحكامهم، وشعبي أحب مثل هذا. ولكن ماذا تصنعون في نهاية المطاف؟»"]]}], "kwAr": "ثم", "noteAr": ""}, {"kw": "cry", "raw": "Psa_18:41; Pro_1:28, Pro_28:9; Isa_1:15; Jer_2:27, Jer_2:28; Eze_8:18; Zec_7:13; Mat_7:22; Luk_13:25; Joh_9:31; Jam_2:13", "note": "", "refs": [{"l": "Psa 18:41", "n": "", "vs": [[41, "يستغيثون ولا مخلص. ينادون الرب فلا يستجيب لهم."]]}, {"l": "Pro 1:28", "n": "", "vs": [[28, "حينئذ يستغيثون بي فلا أستجيب، ويلتمسونني فلا يجدونني."]]}, {"l": "Pro 28:9", "n": "", "vs": [[9, "من يصرف أذنه عن الاستماع إلى الشريعة، تصير حتى صلاته رجاسة."]]}, {"l": "Isa 1:15", "n": "", "vs": [[15, "عندما تبسطون نحوي أيديكم أحجب وجهي عنكم، وإن أكثرتم الصلاة لا أستجيب، لأن أيديكم مملوءة دما."]]}, {"l": "Jer 2:27", "n": "", "vs": [[27, "إذ قالوا لنصب الخشب: أنت أبي، وللحجر المنحوت صنما: أنت أنجبتني. وولوا أدبارهم وليس وجوههم نحوي، وفي وقت بليتهم استغاثوا بي قائلين: قم وأنقذنا."]]}, {"l": "Jer 2:28", "n": "", "vs": [[28, "فأين إذا الآلهة التي صنعتموها لأنفسكم؟ لتقم إن كانت قادرة على إنقاذكم في وقت ضيقكم، لأن عدد آلهتكم ياأبناء يهوذا صار كعدد مدنكم."]]}, {"l": "Eze 8:18", "n": "", "vs": [[18, "لذلك أعاقبهم بالغضب، ولا تترَأف عيني عليهم، ولا أعفو، وإن استغاثوا بصوت عال لا أستجيب لهم»."]]}, {"l": "Zec 7:13", "n": "", "vs": [[13, "وكما ناديت فلم يسمعوا فإني أنا أيضا لا أسمع، يقول الرب القدير."]]}, {"l": "Mat 7:22", "n": "", "vs": [[22, "في ذلك اليوم سيقول لي كثيرون: يارب، يارب، أليس باسمك تنبأنا، وباسمك طردنا الشياطين، وباسمك عملنا معجزات كثيرة؟"]]}, {"l": "Luk 13:25", "n": "", "vs": [[25, "فمن بعد ما يكون رب البيت قد قام وأغلق الباب، وتبدأون بالوقوف خارجا تقرعون الباب قائلين: يارب افتح لنا! فيجيبكم قائلا: لا أعرف من أين أنتم!"]]}, {"l": "Joh 9:31", "n": "", "vs": [[31, "نحن نعلم أن الله لا يستجيب للخاطئين، ولكنه يستمع لمن يتقيه ويعمل بإرادته،"]]}, {"l": "Jam 2:13", "n": "", "vs": [[13, "فلابد أن يكون الحكم على الذين لا يمارسون الرحمة، حكما خاليا من الرحمة، أما الرحمة فهي تتفوق على الحكم!"]]}], "kwAr": "تستغيثون", "noteAr": ""}, {"kw": "he will even", "raw": "Deu_31:17, Deu_31:18, Deu_32:19, Deu_32:20; Isa_59:1-15; Jer_33:5", "note": "", "refs": [{"l": "Deu 31:17", "n": "", "vs": [[17, "فيحتدم غضبي عليه في ذلك اليوم، وأنبذه وأحجب وجهي عنه، فيكون فريسة. وتلحق به شرور كثيرة ومصائب، حتى يقول: أليس لأن إلهي قد هجرني، قد أصابتني هذه الشرور؟"]]}, {"l": "Deu 31:18", "n": "", "vs": [[18, "وأحجب وجهي عنهم من أجل جميع ما ارتكبوه من شرور، إذ سعوا وراء آلهة أخرى."]]}, {"l": "Deu 32:19", "n": "", "vs": [[19, "فرأى الرب ذلك ورذلهم، إذ أثار أبناؤه وبناته غيظه."]]}, {"l": "Deu 32:20", "n": "", "vs": [[20, "وقال: سأحجب وجهي عنهم، فأرى ماذا يكون مصيرهم؟ إنهم جيل متقلب وأولاد خونة،"]]}, {"l": "Isa 59:1-15", "n": "", "vs": [[1, "انظروا، إن ذراع الرب ليست قاصرة حتى تعجز عن أن تخلص، ولا أذنه ثقيلة حتى لا تسمع."], [2, "إنما خطاياكم أضحت تفصل بينكم وبين إلهكم، وآثامكم حجبت وجهه عنكم، فلم يسمع،"], [3, "لأن أيديكم تلوثت بالدم وأصابعكم بالإثم، ونطقت شفاهكم بالكذب، ولهجت ألسنتكم بالشر."], [4, "ليس بينكم من يطالب بالعدل، أو يحكم بالحق. يتكلون على الباطل ويتفوهون بالزور، يحبلون بالغش، ويلدون بالإثم."], [5, "يفقسون بيض أفعى، وينسجون خيوط العنكبوت. من يأكل من بيضهم يموت، ومن البيضة المكسورة تخرج حية."], [6, "لا تصلح خيوطهم لنسيج الثياب، ولا يكتسون بأعمالهم، لأن أعمالهم هي أعمال إثم، وأفعال الظلم قد ارتكبتها أيديهم."], [7, "تسرع أرجلهم لاقتراف الشر، ويهرولون لسفك دم البريء، أفكارهم أفكار أثيمة، وفي طرقهم دمار وخراب"], [8, "لم يعرفوا سبيل السلام، ولا عدل في مسالكهم. عوجوا طرقهم، والسالك فيها لا يعرف سلاما."], [9, "الحق ابتعد عنا، ولم يدركنا العدل. نرتقب نورا، فيحدق بنا الظلام، وننشد ضوءا فنسلك في العتمة."], [10, "نتحسس الحائط كالأعمى، ونتلمس كالمكفوف، نتعثر في الظهيرة كما لو كنا نسير في عتمة الليل ونكون كالأموات بين المتدفقين بالحياة"], [11, "كلنا نزمجر كالدببة، وننوح كالحمام. نبحث عن العدل فلا نجده، وعن الخلاص وإذا به قد ابتعد عنا،"], [12, "لأن معاصينا كثرت أمامك، وآثامنا تشهد علينا. فمعاصينا معنا، وذنوبنا نعرفها."], [13, "تمردنا وتنكرنا للرب. ارتددنا عن اتباع طرق إلهنا، تفوهنا بالظلم والعصيان افتراء، وبكلام زور من القلب."], [14, "قد ارتد عنا الإنصاف، ووقف العدل بعيدا، إذ سقط الحق صريعا في الشوارع، والبر لم يستطع الدخول."], [15, "أضحى الحق مفقودا، والحائد عن الشر ضحية. رأى الرب ذلك فأسخطه فقدان الإنصاف."]]}, {"l": "Jer 33:5", "n": "", "vs": [[5, "في القتال الناشب مع الكلدانيين الذين سيملأون المدن بجثث القتلى الذين ضربتهم في احتدام غضبي وغيظي، لأني قد حجبت وجهي عن هذه المدينة لشرهم."]]}], "kwAr": "ويحجب", "noteAr": ""}, {"kw": "as", "raw": "Isa_3:11; Rom_2:8, Rom_2:9", "note": "", "refs": [{"l": "Isa 3:11", "n": "", "vs": [[11, "أما الشرير فويل له وبئس المصير لأنه يجازى على ما جنته يداه"]]}, {"l": "Rom 2:8", "n": "", "vs": [[8, "ويكون الغضب والسخط للمخاصمين الذين يرفضون الطاعة للحق ولكنهم يخضعون للإثم."]]}, {"l": "Rom 2:9", "n": "", "vs": [[9, "فالشدة والضيق على نفس كل إنسان يعمل الشر اليهودي أولا ثم اليوناني؛"]]}], "kwAr": "بسبب ما ارتكبتموه", "noteAr": ""}], "arS": [["ثم", ["H227"]], [" حين ", []], ["تستغيثون", ["H2199"]], [" ", []], ["بالرب", ["H3068"]], [" ", []], ["لا", ["H3808"]], [" ", []], ["يستجيب", ["H6030"]], [" ", []], ["ويحجب", ["H5641"]], [" ", []], ["وجهه", ["H6440"]], [" ", []], ["عنكم", ["H4480"]], [" في ", []], ["ذلك", ["H1931"]], [" ", []], ["الوقت", ["H6256"]], [" ", []], ["بسبب", ["H834"]], [" ما ", []], ["ارتكبتموه", ["H7489"]], [" من ", []], ["أعمال", ["H4611"]], [" شريرة.", []]]}, {"c": 3, "v": 5, "text": "وهذا ما يقوله الرب بشأن الأنبياء الذين يضلون شعبه، الذين ينادون قائلين: «سلام» لمن يعطيهم طعاما، ويعلنون الحرب على من لا يلقم أفواههم.", "groups": [{"kw": "concerning", "raw": "Mic_3:11; Isa_9:15, Isa_9:16; Jer_14:14, Jer_14:15, Jer_23:9-17, Jer_23:27, Jer_23:32, Jer_28:15-17, Jer_29:21-23; Eze_13:10-16, Eze_22:25-29; Mal_2:8; Mat_15:14", "note": "", "refs": [{"l": "Mic 3:11", "n": "", "vs": [[11, "إذ يحكم رؤساؤها بالرشوة، وكهنتها يعلمون بالأجرة ويتعاطى أنبياؤها العرافة لقاء المال، ومع ذلك يدعون الاتكال على الله قائلين: «أليس الرب في وسطنا؟ لذلك لن يصيبنا مكروه»."]]}, {"l": "Isa 9:15", "n": "", "vs": [[15, "إن الشيخ والوجيه هو الرأس، والنبي الذي يلقن الكذب هو الذنب"]]}, {"l": "Isa 9:16", "n": "", "vs": [[16, "فمرشدو هذا الشعب يضلونه، والمرشدون يبتلعون."]]}, {"l": "Jer 14:14", "n": "", "vs": [[14, "وقال لي الرب: «إن الأنبياء يتنبأون زورا باسمي وأنا لم أرسلهم ولم آمرهم، ولم أكلمهم، إنما هم يتنبأون لكم برؤيا كاذبة وعرافة باطلة مستوحاة من ضلال قلوبهم."]]}, {"l": "Jer 14:15", "n": "", "vs": [[15, "لذلك هكذا يقول الرب عن هؤلاء الأنبياء المتنبئين باسمي: مع أني لم أرسلهم فإنهم يقولون: لن تبتلى هذه الأرض بسيف ولا مجاعة، لهذا فإن هولاء الأنبياء يفنون بالسيف والمجاعة."]]}, {"l": "Jer 23:9-17", "n": "", "vs": [[9, "ثم تكلم إرميا عن الأنبياء الكذبة فقال: «إن قلبي منكسر في داخلي، وجميع عظامي ترتجف، فأنا بتأثير الرب وبفعل كلامه المقدس كرجل سكران غلبت عليه الخمر"], [10, "لأن الأرض قد اكتظت بالفاسقين، وناحت من عاقبة لعنة الله، فجفت مراعي الحقول لأن مساعيهم باتت شريرة، وجبروتهم مسخر للباطل»."], [11, "ويقول الرب: «النبي والكاهن كافران، وفي بيتي وجدت شرهما."], [12, "لذلك يضحي طريقهما مزالق لهما، تفضي بهما إلى الظلمات التي يطردون إليها، ويهويان فيها لأني أجلب عليهما شرا في سنة عقابهما»."], [13, "في أوساط أنبيا ء السامرة شهدت أمورا كريهة، إذ تنبأوا باسم البعل، وأضلوا شعبي إسرائيل."], [14, "وفي أوساط أنبياء أورشليم رأيت أمورا مهولة: يرتكبون الفسق، ويسلكون في الأكاذيب، يشددون أيدي فاعلي الإثم لئلا يتوب أحد عن شره. صاروا جميعا كسكان سدوم وأصبح أهلها كأهل عمورة."], [15, "لذلك هذا ما يقوله الرب القدير عن الأنبياء: «ها أنا أطعمهم أفسنتينا وأسقيهم ماء مسموما، لأنه من أنبياء أورشليم شاع الكفر في كل أرجاء الأرض»."], [16, "«لا تسمعوا لأقوال الأنبياء الذين يتنبأون لكم ويخدعونكم بالأوهام، لأنهم ينطقون برؤى مخيلاتهم، ولا يتكلمون بما أوحى به فمي."], [17, "قائلين بإصرار لمن يحتقرونني: قد أعلن الرب أن السلام يسودكم ويرددون لكل من يجري وراء أهواء قلبه: لن يصيبكم ضر."]]}, {"l": "Jer 23:27", "n": "", "vs": [[27, "فينسون شعبي اسمي بما يقصه كل واحد منهم على صاحبه من أحلامه، كما نسي آباؤهم اسمي لأجل وثن البعل."]]}, {"l": "Jer 23:32", "n": "", "vs": [[32, "ها أنا أقاوم المتنبئين بأحلام كاذبة ويقصونها مضلين شعبي بأكاذيبهم واستخفافهم، مع أني لم أرسلهم ولم أكلفهم بشيء. ولا جدوى منهم لهذا الشعب."]]}, {"l": "Jer 28:15-17", "n": "", "vs": [[15, "وأضاف إرميا النبي مخاطبا حننيا المتنبيء: «اسمع ياحننيا، هذا ما يعلنه الرب: إن الرب لم يبعثك، وأنت جعلت هذا الشعب يصدق كذبك."], [16, "لذلك هكذا يعلن الرب: ها أنا أبيدك عن وجه الأرض فتموت في هذه السنة لأنك نطقت بالتمرد على الرب»."], [17, "وفي الشهر السابع من تلك السنة عينها مات حننيا."]]}, {"l": "Jer 29:21-23", "n": "", "vs": [[21, "يقول الرب القدير إله إسرائيل عن أخآب بن قولايا وعن صدقيا بن معسيا اللذين يتنبآن لكم باسمي زورا: «ها أنا أسلمهما ليد نبوخذناصر ملك بابل فيقتلهما على مرأى منكم،"], [22, "فيصبحان مثل لعنة بين جميع المسبيين من يهوذا في بابل، فيقال: ليجعلك الله نظير صدقيا وأخآب اللذين قلاهما ملك بابل بالنار،"], [23, "لأنهما ارتكبا الفواحش في إسرائيل وزنيا مع نساء أصحابهما وتنبآ باسمي نبوءات كاذبة لم آمرهما بها. فأنا العارف والشاهد» يقول الرب."]]}, {"l": "Eze 13:10-16", "n": "", "vs": [[10, "لأنهم حقا أضلوا شعبي قائلين: سيكون لكم سلام مع أنه ليس هناك سلام، فكان شعبي يبني حائطا وهم يطلونه بماء الكلس."], [11, "قل للطالين بماء الكلس: إن الحائط يتداعى، إذ ينهمر مطر جارف. وأنتن ياحجارة البر د تساقطن، ولتعصف به ريح جائحة."], [12, "فلا يلبث السور أن ينهار أفلا تسألون آنئذ: أين الطين الذي طينتم به؟"], [13, "لذلك، هذا ما يعلنه السيد الرب: ها أنا أجعل ريحا عاتية تخترق السور بفعل حنقي، ومطرا جارفا ينهمر في خضم غضبي، وحجارة برد تتساقط في أثناء سخطي لكي تهلك،"], [14, "فأهدم السور الذي طليتموه بماء الكلس وأسويه بالأرض فيتعرى أساسه وتتداعى المدينة وتفنون جميعا في وسطها فتدركون أني أنا الرب."], [15, "فأنفث غضبي بالسور وبمن يطلونه بماء الكلس وأقول لكم: قد تلاشى السور والذين يطلونه."], [16, "الذين هم أنبياء إسرائيل الأدعياء، المتنبئون لإسرائيل، الذين يرون لها رؤى سلام، مع أنه لا سلام هناك، يقول السيد الرب."]]}, {"l": "Eze 22:25-29", "n": "", "vs": [[25, "تواطأ أنبياؤها الكذبة فيها مثل أسد مزمجر يمزق الفريسة. التهموا نفوسا، واستولوا على نفائس الناس وكنوزهم، وكثروا أراملها فيها."], [26, "خالف كهنتها شريعتي ونجسوا مقادسي. لم يميزوا بين المقدس والرجس، ولم يعلموا الفرق بين الطاهر والنجس، وحجبوا عيونهم عن أيام سبوتي فصرت مدنسا في وسطهم."], [27, "رؤساؤها فيها كذئاب خاطفة تمزق فرائسها إذ يسفكون دماء الناس في سبيل الربح الحرام."], [28, "وأنبياؤها قد طلوا لهم بماء الكلس، إذ يرون لهم رؤى باطلة، ويعرفون لهم عرافة كاذبة قائلين: هذا ما يعلنه السيد الرب، مع أن الرب لم يعلن شيئا."], [29, "أفرطوا في ظلم شعب الأرض واغتصبوا سالبين، واضطهدوا الفقير والمسكين، وظلموا الغريب جورا."]]}, {"l": "Mal 2:8", "n": "", "vs": [[8, "ولكنكم انحرفتم عن الطريق المستقيم، وأعثرتم بتعاليمكم كثيرين، ونقضتم عهدي مع النسل الكهنوتي، يقول الرب القدير."]]}, {"l": "Mat 15:14", "n": "", "vs": [[14, "دعوهم وشأنهم، فهم عميان يقودون عميانا. وإذا كان الأعمى يقود أعمى، يسقطان معا في حفرة»."]]}], "kwAr": "بشأن", "noteAr": ""}, {"kw": "that bite", "raw": "Mic_2:11; Isa_56:9-12; Eze_13:18, Eze_13:19; Mat_7:15; Rom_16:18", "note": "", "refs": [{"l": "Mic 2:11", "n": "", "vs": [[11, "إن جال رجل يتنبأ بينكم بالكذب وباللغو الباطل قائلا: إنني أتنبأ لكم بالخمر الوفير والمسكر، فإنه يصبح نبي هذا الشعب."]]}, {"l": "Isa 56:9-12", "n": "", "vs": [[9, "تعالي ياجميع وحوش الصحراء للالتهام، وياجميع وحوش الغاب أيضا."], [10, "فإن رقباءهم عمي، وكلهم جهال، وكلاب بكم عاجزون عن النباح، حالمون راقدون مولعون بالنوم."], [11, "هم كلاب نهمة لا تعرف الشبع، ورعاة أيضا مجردون من الفهم، كل مال إلى طريقه طمعا في الربح،"], [12, "قائلين: تعالوا نأتي بالخمر، ونشرب مسكرا حتى الثمالة، فالغد يكون مماثلا لهذا اليوم، بل أعظم منه."]]}, {"l": "Eze 13:18", "n": "", "vs": [[18, "وقل هذا ما يعلنه السيد الرب: ويل للخائطات العصائب السحرية لكل معاصم الأيدي والأنقاب لرأس كل قامة لاصطياد النفوس. أنتن تصطدن نفوس شعبي وتستحيين نفوسكن"]]}, {"l": "Eze 13:19", "n": "", "vs": [[19, "فتدنسنني عند شعبي لقاء حفنة شعير وفتات خبز حتى تمتن نفوسا ما كان يجب أن تموت، ولكي تستحيين نفوسا أخرى لم يكن لها أن تحيا من جراء كذبكن على شعبي السامع للكذب."]]}, {"l": "Mat 7:15", "n": "", "vs": [[15, "احذروا الأنبياء الدجالين الذين يأتون إليكم لابسين ثياب الحملان، ولكنهم من الداخل ذئاب خاطفة!"]]}, {"l": "Rom 16:18", "n": "", "vs": [[18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."]]}], "kwAr": "يعطيهم طعاما", "noteAr": ""}], "arS": [["وهذا", ["H3541"]], [" ما ", []], ["يقوله", ["H559"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["بشأن", ["H5921"]], [" ", []], ["الأنبياء", ["H5030"]], [" الذين ", []], ["يضلون", ["H8582"]], [" ", []], ["شعبه", ["H5971"]], ["، الذين ", []], ["ينادون", ["H7121"]], [" قائلين: «", []], ["سلام", ["H7965"]], ["» لمن ", []], ["يعطيهم", ["H5391"]], [" ", []], ["طعاما", ["H8127"]], ["، ", []], ["ويعلنون", ["H6942"]], [" ", []], ["الحرب", ["H4421"]], [" ", []], ["على", ["H5921"]], [" ", []], ["من", ["H834"]], [" ", []], ["لا", ["H3808"]], [" ", []], ["يلقم", ["H5414"]], [" ", []], ["أفواههم", ["H6310"]], [".", []]]}, {"c": 3, "v": 6, "text": "لذلك يطغى عليكم ليل خال من الرؤيا، وظلام من غير عرافة، وتغرب الشمس عن الأنبياء ويظلم عليهم النهار.", "groups": [{"kw": "night", "raw": "Psa_74:9; Isa_8:20-22; Jer_13:16; Eze_13:22, Eze_13:23; Zec_13:2-4", "note": "", "refs": [{"l": "Psa 74:9", "n": "", "vs": [[9, "لم نعد نشهد رموز عبادتنا، ولم يبق نبي بعد، وليس بيننا من يعرف متى تكون خاتمة الأمر."]]}, {"l": "Isa 8:20-22", "n": "", "vs": [[20, "فإلى الشريعة وإلى الشهادة: ومن لا ينطق بمثل هذا القول، فلا فجر له."], [21, "فإنهم يتيهون في الأرض مكتئبين جائعين، وعندما يعضهم الجوع بنابه يأخذهم الغضب ويلعنون ملكهم وإلههم ويلتفتون إلى العلاء،"], [22, "ثم ينظرون إلى الأرض فلا يجدون سوى الكرب والظلمة والضنك والعذاب، ويطردون إلى دياجير الظلام."]]}, {"l": "Jer 13:16", "n": "", "vs": [[16, "مجدوا الرب إلهكم قبل أن يجعل الظلام يخيم عليكم، وقبل أن تتعثر أقدامكم على الجبال المعتمة. أنتم ترتقبون النور ولكنه يحوله إلى ظلام الموت ويجعله ليلا دامسا."]]}, {"l": "Eze 13:22", "n": "", "vs": [[22, "لأنكن أحزنتن قلب الصديق بأكاذيبكن، مع أنني لم أحزنه، وشددتن عزائم الشرير لئلا يرجع عن طريقه الأثيمة فيحيا."]]}, {"l": "Eze 13:23", "n": "", "vs": [[23, "لذلك لن تعدن ترين رؤى باطلة، ولا تمارسن العرافة بعد، وأنقذ شعبي من أيديكن فتدركن أني أنا الرب»."]]}, {"l": "Zec 13:2-4", "n": "", "vs": [[2, "ويقول الرب القدير: في ذلك اليوم أستأصل أسماء الأصنام من الأرض فلا يعود لها ذكر، وألاشي الأنبياء الكذبة والروح النجس من الأرض."], [3, "وإن تنبأ أحد فيما بعد، يطعنه أبوه وأمه اللذان أنجباه قائلين: لابد أن تموت لأنك نطقت بالزور باسم الرب."], [4, "في ذلك اليوم يعتري الخزي كل نبي كاذب يتنبأ من رؤياه، ولا يرتدي مسوح الشعر ليكذب."]]}], "kwAr": "ليل", "noteAr": ""}, {"kw": "that ye shall not have a vision", "raw": "Heb. from a vision", "note": "Heb. from a vision", "refs": [], "kwAr": "خال من الرؤيا", "noteAr": "بالعبرية: «من رؤيا»."}, {"kw": "that ye shall not divine", "raw": "Heb. from divining", "note": "Heb. from divining", "refs": [], "kwAr": "من غير عرافة", "noteAr": "بالعبرية: «من عرافة»."}, {"kw": "the sun", "raw": "Isa_29:10, Isa_59:10; Jer_15:9; Amo_8:9, Amo_8:10", "note": "", "refs": [{"l": "Isa 29:10", "n": "", "vs": [[10, "لأن الرب قد سكب عليكم روح سبات عميق، فأغلق عيون أنبيائكم وغطى رؤوس رائييكم."]]}, {"l": "Isa 59:10", "n": "", "vs": [[10, "نتحسس الحائط كالأعمى، ونتلمس كالمكفوف، نتعثر في الظهيرة كما لو كنا نسير في عتمة الليل ونكون كالأموات بين المتدفقين بالحياة"]]}, {"l": "Jer 15:9", "n": "", "vs": [[9, "ذبلت والدة السبعة الأبناء. أسلمت روحها وغربت شمس حياتها والنهار لم يغب بعد. لحق بها الخزي والعار. أما بقيتهم فأدفعهم إلى حد السيف أمام أعدائهم»، يقول الرب."]]}, {"l": "Amo 8:9", "n": "", "vs": [[9, "ويقول الرب: في ذلك اليوم أجعل الشمس تغرب عند الظهيرة، وأغمر الأرض بالظلمة في رابعة النهار."]]}, {"l": "Amo 8:10", "n": "", "vs": [[10, "أحول أعيادكم إلى مآتم، وأغانيكم إلى مراث، وألبسكم المسوح على أحقائكم، وأفشي الصلع في كل رأس، فتصبح أعيادكم كمناحة على وحيد، ونهايتها كيوم مفعم بالمرارة."]]}], "kwAr": "وتغرب الشمس", "noteAr": ""}], "arS": [["لذلك", ["H3651"]], [" يطغى عليكم ", []], ["ليل", ["H3915"]], [" خال من ", []], ["الرؤيا", ["H4480", "H2377"]], ["، ", []], ["وظلام", ["H2821"]], [" من غير ", []], ["عرافة", ["H4480", "H7080"]], ["، ", []], ["وتغرب", ["H935"]], [" ", []], ["الشمس", ["H8121"]], [" عن ", []], ["الأنبياء", ["H5030"]], [" ", []], ["ويظلم", ["H6937"]], [" عليهم ", []], ["النهار", ["H3117"]], [".", []]]}, {"c": 3, "v": 7, "text": "يعتري الرائين الخزي وينتاب العرافين الخجل، ويغطون جميعهم شفاههم لأنهم لا ينالون جوابا من الرب.", "groups": [{"kw": "the seers", "raw": "Exo_8:18, Exo_8:19, Exo_9:11; 1Sa_9:9; Isa_44:25, Isa_47:12-14; Dan_2:9-11; Zec_13:4; 2Ti_3:8, 2Ti_3:9", "note": "", "refs": [{"l": "Exo 8:18", "n": "", "vs": [[18, "وكذلك حاول السحرة بسحرهم ليخرجوا البعوض فأخفقوا. وكان البعوض منتشرا على الناس والبهائم."]]}, {"l": "Exo 8:19", "n": "", "vs": [[19, "فقال السحرة لفرعون «هو فعل الله». ولكن قلب فرعون ظل متصلبا فلم يسمع لهما، تماما كما قال الرب."]]}, {"l": "Exo 9:11", "n": "", "vs": [[11, "ولم يستطع السحرة أن يواجهوا موسى من جراء الدمامل، لأن الدمامل أصابت السحرة وكل المصريين أيضا."]]}, {"l": "1Sa 9:9", "n": "", "vs": [[9, "وكان النبي حينذاك يدعى الرائي، فكان الرجل يقول عند ذهابه ليستشير الرب: «هيا نذهب إلى الرائي»"]]}, {"l": "Isa 44:25", "n": "", "vs": [[25, "يكشف نفاق المخادعين، ويفضح حمق العرافين، ويبطل مشورة الحكماء تسفيها لعلمهم."]]}, {"l": "Isa 47:12-14", "n": "", "vs": [[12, "تشبثي برقاك وكثرة سحرك التي تعبت فيها منذ صباك، فقد يحالفك النجاح أو تثيرين الرعب."], [13, "لقد ضعفت من كثرة طلب المشورة، فادعي المنجمين والفلكيين ليكشفوا لك طوالع المستقبل وينقذوك مما يأتي عليك."], [14, "غير أنهم أنفسهم أصبحوا كالهشيم الذي تلتهمه النار عاجزين عن إنقاذ أنفسهم وإنقاذك من شدة اللهب المحرق، فلا هو جمر للاستدفاء ولا هي نار للجلوس حولها."]]}, {"l": "Dan 2:9-11", "n": "", "vs": [[9, "بمعاقبتكم إن لم تنبئوني بالحلم، لأنكم اتفقتم على اختلاق الكذب والضلال لتنطقوا بهما أمامي إلى أن يتحقق معنى الحلم. لذلك أنبئوني أولا بما حلمت فأعلم آنئذ أنكم قادرون على تفسيره»."], [10, "فأجابوا: «ليس على الأرض إنسان في وسعه تلبية أمر الملك ولم يحدث قط أن ملكا عظيما ذا سلطان طلب مثل هذا الأمر من مجوسي أو ساحر أو منجم."], [11, "ومطلب الملك متعذر لا يمكن لأحد أن ينبيء به الملك سوى الآلهة الذين لا يسكنون مع البشر»."]]}, {"l": "Zec 13:4", "n": "", "vs": [[4, "في ذلك اليوم يعتري الخزي كل نبي كاذب يتنبأ من رؤياه، ولا يرتدي مسوح الشعر ليكذب."]]}, {"l": "2Ti 3:8", "n": "", "vs": [[8, "ومثلما قاوم (الساحران) ينيس ويمبريس موسى، كذلك أيضا يقاوم هؤلاء الحق؛ أناس عقولهم فاسدة، وقد تبين أنهم غير أهل للإيمان."]]}, {"l": "2Ti 3:9", "n": "", "vs": [[9, "ولكنهم لن يزدادوا تقدما، لأن حماقتهم ستنكشف للجميع، مثلما انكشفت حماقة الرجلين المذكورين."]]}], "kwAr": "الرائين", "noteAr": ""}, {"kw": "cover", "raw": "Lev_13:45; Eze_24:17, Eze_24:22", "note": "", "refs": [{"l": "Lev 13:45", "n": "", "vs": [[45, "وعلى المصاب بداء البرص أن يشق ثيابه ويكشف رأسه ويغطي شاربيه، وينادي: «نجس! نجس!»."]]}, {"l": "Eze 24:17", "n": "", "vs": [[17, "تنهد بصمت. لا تقم مناحة على الموتى. تلفع بعصابتك وضع نعليك في رجليك. لا تحجب شاربيك ولا تأكل من خبز الناس»."]]}, {"l": "Eze 24:22", "n": "", "vs": [[22, "وتفعلون كما فعلت: لا تحجبون شواربكم ولا تأكلون من خبز الناس،"]]}], "kwAr": "ويغطون", "noteAr": ""}, {"kw": "lips", "raw": "Heb. upper lip", "note": "Heb. upper lip", "refs": [], "kwAr": "شفاههم", "noteAr": "بالعبرية: «الشفة العليا»."}, {"kw": "no", "raw": "1Sa_14:37, 1Sa_28:6, 1Sa_28:15; Psa_74:9; Amo_8:11", "note": "", "refs": [{"l": "1Sa 14:37", "n": "", "vs": [[37, "فاستشار شاول الله سائلا: «أنتعقب الفلسطينيين؟ أتنصرنا عليهم؟» فلم يحظ بجواب في ذلك اليوم."]]}, {"l": "1Sa 28:6", "n": "", "vs": [[6, "فاستشار الرب فلم يجبه لا بأحلام ولا بالأوريم ولا عن طريق الأنبياء."]]}, {"l": "1Sa 28:15", "n": "", "vs": [[15, "فقال صموئيل لشاول: «لماذا أزعجتني بإصعادك لي؟». فأجاب: «إنني في ضيق شديد. الفلسطينيون يحاربونني والرب قد نبذني ولم يعد يجيبني لا عن طريق الأنبياء ولا بالأحلام. فدعوتك لترشدني»."]]}, {"l": "Psa 74:9", "n": "", "vs": [[9, "لم نعد نشهد رموز عبادتنا، ولم يبق نبي بعد، وليس بيننا من يعرف متى تكون خاتمة الأمر."]]}, {"l": "Amo 8:11", "n": "", "vs": [[11, "ستأتي أيام أجعل فيها المجاعة تنتشر في الأرض، لا مجاعة إلى الخبز، ولا ظمأ إلى الماء إنما لسماع كلام الرب، يقول السيد الرب."]]}], "kwAr": "لا ينالون جوابا", "noteAr": ""}], "arS": [["يعتري ", []], ["الرائين", ["H2374"]], [" ", []], ["الخزي", ["H954"]], [" وينتاب ", []], ["العرافين", ["H7080"]], [" ", []], ["الخجل", ["H2659"]], ["، ", []], ["ويغطون", ["H5844", "H5921"]], [" ", []], ["جميعهم", ["H3605"]], [" ", []], ["شفاههم", ["H8222"]], [" ", []], ["لأنهم", ["H3588"]], [" ", []], ["لا", ["H369"]], [" ينالون ", []], ["جوابا", ["H4617"]], [" من ", []], ["الرب", ["H430"]], [".", []]]}, {"c": 3, "v": 8, "text": "أما أنا، فإني ممتليء بقوة روح الرب وبالحق والعزة، لأعلن لنسل يعقوب معاصيه ولإسرائيل خطيئته.", "groups": [{"kw": "I am", "raw": "Job_32:18; Isa_11:2, Isa_11:3, Isa_58:1; Jer_1:18, Jer_6:11, Jer_15:19-21, Jer_20:9; Eze_3:14; Mat_7:29; Mar_3:17; Act_4:8-12, Act_4:19, Act_4:20, Act_7:54-57, Act_13:9-12, Act_18:5, Act_18:6, Act_18:9-11; 1Co_2:4, 1Co_2:12, 1Co_2:13", "note": "", "refs": [{"l": "Job 32:18", "n": "", "vs": [[18, "لأني أفيض كلاما، والروح في داخلي يحفزني."]]}, {"l": "Isa 11:2", "n": "", "vs": [[2, "ويستقر عليه روح الرب، روح الحكمة والفطنة، روح المشورة والقوة، روح معرفة الرب ومخافته."]]}, {"l": "Isa 11:3", "n": "", "vs": [[3, "وتكون مسرته في تقوى الرب، ولا يقضي بحسب ما تشهد عيناه، ولا يحكم بمقتضى ما تسمع أذناه،"]]}, {"l": "Isa 58:1", "n": "", "vs": [[1, "ناد بأعلى صوتك، لا تصمت. اهتف بصوتك كنفير بوق، وأخبر شعبي بإثمهم، وذرية يعقوب بخطاياهم."]]}, {"l": "Jer 1:18", "n": "", "vs": [[18, "انظر ها أنا قد جعلتك اليوم قويا كمدينة حصينة، وكعمود من حديد، وكأسوار من نحاس، لتجابه كل أهل الأرض، وملوك يهوذا وأمراءها وكهنتها وشعب البلاد،"]]}, {"l": "Jer 6:11", "n": "", "vs": [[11, "لذلك امتلأت من سخط الرب وأعياني كظمه. أسكبه على الأولاد في الطريق وعلى الشبان المجتمعين في مجالسهم، فيصيب الرجل وزوجته والشيخ والطاعن في السن."]]}, {"l": "Jer 15:19-21", "n": "", "vs": [[19, "لذلك، هكذا قال الرب: «إن رجعت أستردك فتمثل أمامي. إن نطقت بالقول السديد ونبذت الكلام الغث، أجعلك المتحدث بفمي، فيقبلون إليك مسترشدين، وأنت لا تلجأ إليهم طالبا نصيحة."], [20, "وأجعلك سورا نحاسيا منيعا لهذا الشعب، فيحاربونك ولكنهم يخفقون، لأني أنا معك لأنقذك وأخلصك."], [21, "أنقذك من قبضة الأشرار، وأفديك من أكف العتاة»."]]}, {"l": "Jer 20:9", "n": "", "vs": [[9, "إن قلت: «سأكف عن ذكره ولا أتكلم باسمه بعد» صار كلامه في قلبي كنار محرقة محصورة في عظامي، فأعياني كتمانه وعجزت عن كبته."]]}, {"l": "Eze 3:14", "n": "", "vs": [[14, "وهكذا حلق بي روح الرب وحملني بعيدا، وقد جاشت حرارة روحي بمرارة نفسي، ولكن كانت يد الرب علي شديدة."]]}, {"l": "Mat 7:29", "n": "", "vs": [[29, "لأنه كان يعلمهم كصاحب سلطان، وليس مثل كتبتهم."]]}, {"l": "Mar 3:17", "n": "", "vs": [[17, "ويعقوب بن زبدي، ويوحنا أخوه، وقد سماهما بوانرجس، أي ابني الرعد،"]]}, {"l": "Act 4:8-12", "n": "", "vs": [[8, "فامتلأ بطرس من الروح القدس وأجابهم: «يارؤساء الشعب وياشيوخه،"], [9, "إن كنتم تستجوبوننا اليوم بسبب الإحسان إلى إنسان مريض لتعرفوا كيف شفي،"], [10, "فاعلموا جميعا، وليعرف شعب إسرائيل كله، أنه باسم يسوع المسيح الناصري الذي صلبتموه أنتم، والذي أقامه الله من بين الأموات، باسمه يقف هذا الكسيح أمامكم في تمام الصحة!"], [11, "يسوع هذا هو الحجر الذي رفضتموه أيها البناة، وهو نفسه صار حجر الزاوية الأساسي،"], [12, "وليس بأحد غيره الخلاص، إذ ليس تحت السماء اسم آخر قدمه الله للبشر به يجب أن نخلص!»"]]}, {"l": "Act 4:19", "n": "", "vs": [[19, "ولكن بطرس ويوحنا قالا: «احكموا أنتم: أمن الحق أمام الله أن نطيع أمركم لا أمر الله؟"]]}, {"l": "Act 4:20", "n": "", "vs": [[20, "لا نستطيع أن نكف عن التحدث بما رأينا وسمعنا»."]]}, {"l": "Act 7:54-57", "n": "", "vs": [[54, "فلما سمع المجتمعون كلام استفانوس، ملأ الغيظ قلوبهم، وأخذوا يصرون بأسنانهم توعدا."], [55, "فرفع استفانوس نظره إلى السماء، وهو ممتليء من الروح القدس، فرأى مجد الله ويسوع واقفا عن يمين الله،"], [56, "فقال: «إني أرى السماء مفتوحة وابن الإنسان واقفا عن يمين الله!»"], [57, "فصاحوا صياحا شديدا، وسدوا آذانهم وهجموا عليه هجمة واحدة،"]]}, {"l": "Act 13:9-12", "n": "", "vs": [[9, "أما شاول، وقد صار اسمه بولس، فامتلأ من الروح القدس، ونظر إلى الساحر وقال:"], [10, "«أيها الممتليء غشا وخبثا! ياابن إبليس! ياعدو كل بر! أما تكف عن تعويج طرق الرب المستقيمة؟"], [11, "الآن ستمتد يد الرب عليك، فتصير أعمى لا تبصر النور إلى حين». وفي الحال سقطت على عينيه غمامة مظلمة، فأخذ يدور طالبا من يقوده بيده!"], [12, "ولما رأى الحاكم ما جرى آمن مدهوشا من تعليم الرب."]]}, {"l": "Act 18:5", "n": "", "vs": [[5, "ولما وصل سيلا وتيموثاوس من مقاطعة مقدونية، تفرغ بولس تماما للتبشير، شاهدا لليهود أن يسوع هو المسيح."]]}, {"l": "Act 18:6", "n": "", "vs": [[6, "ولكنهم عارضوا شهادته وأخذوا يجدفون. فما كان منه إلا أن نفض ثوبه وقال لهم: «دمكم على رؤوسكم. أنا بريء! ومنذ الآن أتوجه لتبشير غير اليهود»."]]}, {"l": "Act 18:9-11", "n": "", "vs": [[9, "وذات ليلة رأى بولس الرب في رؤيا يقول له: «لا تخف، بل تكلم ولا تسكت،"], [10, "فأنا معك، ولن يقدر أحد أن يؤذيك، لأن لي شعبا كثيرا في هذه المدينة»."], [11, "فبقي بولس في كورنثوس سنة وستة أشهر يعلم الناس كلمة الله."]]}, {"l": "1Co 2:4", "n": "", "vs": [[4, "ولم يقم كلامي وتبشيري على الإقناع بكلام الحكمة، بل على ما يعلنه الروح والقدرة."]]}, {"l": "1Co 2:12", "n": "", "vs": [[12, "وأما نحن فقد نلنا لا روح العالم بل الروح الذي من الله، لنعرف الأمور التي وهبت لنا من قبل الله."]]}, {"l": "1Co 2:13", "n": "", "vs": [[13, "ونحن نتكلم بهذه الأمور لا في كلام تعلمه الحكمة البشرية، بل في كلام يعلمه الروح القدس، معبرين عن الحقائق الروحية بوسائل روحية."]]}], "kwAr": "ممتليء", "noteAr": ""}, {"kw": "to declare", "raw": "Isa_58:1; Eze_16:2, Eze_20:4, Eze_22:2, Eze_43:10; Mat_3:7-12; Act_7:51, Act_7:52", "note": "", "refs": [{"l": "Isa 58:1", "n": "", "vs": [[1, "ناد بأعلى صوتك، لا تصمت. اهتف بصوتك كنفير بوق، وأخبر شعبي بإثمهم، وذرية يعقوب بخطاياهم."]]}, {"l": "Eze 16:2", "n": "", "vs": [[2, "«ياابن آدم، أطلع أهل أورشليم على أرجاسهم."]]}, {"l": "Eze 20:4", "n": "", "vs": [[4, "أتدينهم ياابن آدم؟ أتحاكمهم؟ أطلعهم على رجاسات آبائهم،"]]}, {"l": "Eze 22:2", "n": "", "vs": [[2, "«وأنت ياابن آدم، أتدين المدينة السافكة الدماء؟ إذا عرفها بكل رجاساتها،"]]}, {"l": "Eze 43:10", "n": "", "vs": [[10, "أما أنت ياابن آدم فصف لشعب إسرائيل الهيكل ومقاييس تصميمه ورسمه ليخجلوا من آثامهم،"]]}, {"l": "Mat 3:7-12", "n": "", "vs": [[7, "ولما رأى يوحنا كثيرين من الفر يسيين والصدوقيين يأتون إليه ليتعمدوا، قال لهم: «ياأولاد الأفاعي، من أنذركم لتهربوا من الغضب الآتي؟"], [8, "فأثمروا ثمرا يليق بالتوبة."], [9, "ولا تعللوا أنفسكم قائلين: لنا إبراهيم أبا! فإني أقول لكم: إن الله قادر أن يطلع من هذه الحجارة أولادا لإبراهيم."], [10, "وها إن الفأس قد ألقيت على أصل الشجر، فكل شجرة لا تثمر ثمرا جيدا تقطع وتطرح في النار."], [11, "أنا أعمدكم بالماء لأجل التوبة، ولكن الآتي بعدي هو أقدر مني، وأنا لا أستحق أن أحمل حذاءه. هو سيعمدكم بالروح القدس، وبالنار."], [12, "فهو يحمل المذرى بيده، وسينقي بيدره تماما: فيجمع قمحه إلى المخزن، وأما التبن فيحرقه بنار لا تطفأ! »"]]}, {"l": "Act 7:51", "n": "", "vs": [[51, "ثم قال استفانوس: «ياأصحاب الرقاب الصلبة والقلوب والآذان غير المختونة! إنكم دائما تقاومون الروح القدس. وكما فعل آباؤكم تفع [3, "فاشهدوا علي في حضرة الرب، وأمام ملكه المختار، إن كنت قد أخذت ثورا أو حمارا من أحد، أو ظلمت أو جرت على أحد أو قبلت رشوة من أحد لأغمض عيني عنه، فأعوض ذلك عليكم»."]]}, {"l": "1Sa 12:4", "n": "", "vs": [[4, "فأجابوه:«لم تظلمنا ولم تجر علينا ولا أخذت شيئا من أحد»."]]}, {"l": "Isa 1:23", "n": "", "vs": [[23, "أصبح رؤساؤك عصاة وشركاء لصوص، يولعون بالرشوة ويسعون وراء الهبات، لا يدافعون عن اليتيم، ولا ترفع إليهم دعوى الأرملة»."]]}, {"l": "Eze 22:12", "n": "", "vs": [[12, "فيك أخذوا الرشوة لقاء سفك الدماء. أخذت الربا ومال الحرام، وسلبت أقرباءك ظلما ونسيتني، يقول السيد الرب."]]}, {"l": "Eze 22:27", "n": "", "vs": [[27, "رؤساؤها فيها كذئاب خاطفة تمزق فرائسها إذ يسفكون دماء الناس في سبيل الربح الحرام."]]}, {"l": "Hos 4:18", "n": "", "vs": [[18, "وحالما ينضب خمرهم ينغمسون في فسادهم، مفضلين العار على الشرف."]]}, {"l": "Zep 3:3", "n": "", "vs": [[3, "رؤساؤها في داخلها أسود زائرة، وقضاتها كذئاب المساء الجائعة التي لا تبقي شيئا من فرائسها إلى الصباح."]]}], "kwAr": "رؤساؤها", "noteAr": ""}, {"kw": "and the priests", "raw": "Jer_6:13, Jer_8:10; Mal_1:10; 1Ti_3:3; Tit_1:11; 1Pe_5:2", "note": "", "refs": [{"l": "Jer 6:13", "n": "", "vs": [[13, "لأنهم جميعا، صغارهم وكبارهم، مولعون بالربح الحرام. حتى النبي والكاهن يرتكبان الزور في أعمالهما."]]}, {"l": "Jer 8:10", "n": "", "vs": [[10, "لذلك أعطي نساءهم لآخرين وحقولهم للوارثين القاهرين، لأنهم جميعا من صغيرهم إلى كبيرهم مولعون بالربح. حتى النبي والكاهن يرتكبان الزور في أعمالهما،"]]}, {"l": "Mal 1:10", "n": "", "vs": [[10, "آه، ياليت بينكم من يغلق أبواب الهيكل لئلا توقدوا نارا باطلة على مذبحي، يقول الرب القدير: إذ لا مسرة لي بكم ولا أرضى بتقدمة من أيديكم."]]}, {"l": "1Ti 3:3", "n": "", "vs": [[3, "لا مدمنا للخمر ولا عنيفا؛ بل لطيفا، غير متعود الخصام، غير مولع بالمال،"]]}, {"l": "Tit 1:11", "n": "", "vs": [[11, "هؤلاء يجب أن تسد أفواههم: فهم يخربون بيوتا بجملتها، إذ يعلمون تعاليم يجب ألا تعلم، في سبيل مكسب خسيس."]]}, {"l": "1Pe 5:2", "n": "", "vs": [[2, "ارعوا قطيع الله الذي بينكم، كحراس له، لا بدافع الواجب، بل بدافع التطوع، كما يريد الله ، ولا رغبة في الربح الدنيء، بل رغبة في الخدمة بنشاط."]]}], "kwAr": "وكهنتها", "noteAr": ""}, {"kw": "and the prophets", "raw": "Mic_3:5; Isa_56:11; Act_8:18-20; 2Pe_2:1-3, 2Pe_2:14, 2Pe_2:15; Jud_1:11", "note": "", "refs": [{"l": "Mic 3:5", "n": "", "vs": [[5, "وهذا ما يقوله الرب بشأن الأنبياء الذين يضلون شعبه، الذين ينادون قائلين: «سلام» لمن يعطيهم طعاما، ويعلنون الحرب على من لا يلقم أفواههم."]]}, {"l": "Isa 56:11", "n": "", "vs": [[11, "هم كلاب نهمة لا تعرف الشبع، ورعاة أيضا مجردون من الفهم، كل مال إلى طريقه طمعا في الربح،"]]}, {"l": "Act 8:18-20", "n": "", "vs": [[18, "ولما رأى سيمون أن الروح القدس قد حل على المؤمنين لما وضع الرسولان أيديهما عليهم، عرض على بطرس ويوحنا بعض المال، وقال لهما:"], [19, "«أعطياني أنا أيضا هذه السلطة لكي ينال الروح القدس من أضع عليه يدي»."], [20, "فقال له بطرس: «لتبق لك فضتك لهلاكك! لأنك ظننت أنك تقدر أن تشتري هبة الله بالمال!"]]}, {"l": "2Pe 2:1-3", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."], [2, "وكثيرون سيسيرون وراءهم في طرق الإباحية. وبسببهم توجه الإهانة إلى طريق الحق."], [3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "2Pe 2:14", "n": "", "vs": [[14, "عيونهم لا تنظر إلا نظرات الزنى، ولا تشبع من الخطيئة. وكم من نفوس ضعيفة تقع في فخاخهم! أما قلوبهم، فقد تدربت على الشهوة والطمع. إنهم حقا أبناء اللعنة!"]]}, {"l": "2Pe 2:15", "n": "", "vs": [[15, "وإذ خرجوا عن الطريق المستقيم، ضلوا. فهم سائرون في طريق بلعام بن بعور، الذي أحب الحصول على المال أجرة لإثمه."]]}, {"l": "Jud 1:11", "n": "", "vs": [[11, "الويل لهم! لأنهم سلكوا طريق قايين، واندفعوا إلى ارتكاب خطيئة بلعام طلبا للمال، وتمردوا كما تمرد قورح، فدمروا أنفسهم."]]}], "kwAr": "أنبياؤها", "noteAr": ""}, {"kw": "yet", "raw": "1Sa_4:3-6; Isa_48:2; Jer_7:4, Jer_7:8-12; Mat_3:9; Rom_2:17-29", "note": "", "refs": [{"l": "1Sa 4:3-6", "n": "", "vs": [[3, "ورجع الناجون إلى معسكرهم، فتساءل شيوخ إسرائيل: «لماذا هزمنا الرب اليوم أمام الفلسطينيين؟ لنأت بتابوت عهد الرب من شيلوه وندخله في وسطنا فينقذنا من قبضة أعدائنا»."], [4, "فبعث الجيش إلى شيلوه بمن حمل تابوت عهد الرب القدير الجالس على الكروبيم، ورافقه أيضا ابنا عالي: حفني وفينحاس."], [5, "وما إن دخل تابوت عهد الرب إلى المعسكر حتى هتف جميع الجيش هتافا عظيما ارتجت له الأرض."], [6, "فسمع الفلسطينيون ضجيج الهتاف فتساءلوا: «ما ضجيج الهتاف هذا في معسكر العبرانيين؟» ولما عرفوا أن تابوت الرب قد جيء به إلى المعسكر،"]]}, {"l": "Isa 48:2", "n": "", "vs": [[2, "الذين يدعون أنفسهم أهل المدينة المقدسة، ويعتمدون على إله إسرائيل، الرب القدير:"]]}, {"l": "Jer 7:4", "n": "", "vs": [[4, "لا تتكلوا على أقوال الكذب قائلين: هذا هيكل الرب: هذا هيكل الرب"]]}, {"l": "Jer 7:8-12", "n": "", "vs": [[8, "ها أنتم قد اتكلتم على أقوال الكذب، ولكن من غير جدوى."], [9, "أتسرقون وتقتلون وتزنون وتحلفون زورا وتبخرون للبعل، وتضلون وراء الأوثان التي لم تعرفوها،"], [10, "ثم تمثلون في حضرتي في هذا الهيكل الذي دعي باسمي قائلين: «قد نجونا»؛ ثم ترتكبون جميع هذه الرجاسات؟"], [11, "هل أصبح هذا الهيكل الذي دعي باسمي، مغارة لصوص في أعينكم؟ ها أنا قد رأيت كل هذا الشر، يقول الرب."], [12, "لكن امضوا إلى موضعي في شيلوه، حيث جعلت فيه مقرا لاسمي أولا، وشاهدوا ما فعلت به من جراء شر شعبي إسرائيل."]]}, {"l": "Mat 3:9", "n": "", "vs": [[9, "ولا تعللوا أنفسكم قائلين: لنا إبراهيم أبا! فإني أقول لكم: إن الله قادر أن يطلع من هذه الحجارة أولادا لإبراهيم."]]}, {"l": "Rom 2:17-29", "n": "", "vs": [[17, "ولكن، إن كنت تدعى يهوديا؛ وتتكل على الشريعة؛ وتفتخر بالله؛"], [18, "وتميز ما هو الأفضل بسبب ما تعلمته من الشريعة؛"], [19, "ولك ثقة في نفسك بأنك قائد للعميان، ونور للذين في الظلام،"], [20, "ومؤدب للجهال، ومعلم للأطفال؛ ولك في الشريعة صورة المعرفة والحق؛"], [21, "فأنت إذن، يامن تعلم غيرك، أما تعلم نفسك؟ أنت يامن تعظ أن لا يسرق، أتسرق؟"], [22, "أنت يامن تنهى عن الزنى، أتزني؟ أنت يامن تستنكر الأصنام، أتسرق الهياكل"], [23, "الذي تفتخر بالشريعة، أتهين الله بمخالفة الشريعة؟"], [24, "فإن «اسم الله يجدف عليه بين الأمم بسببكم»، كما هو مكتوب."], [25, "فإن الختان ينفع إن كنت تعمل بالشريعة. ولكن إن كنت مخالفا للشريعة، فقد صار ختانك كأنه عدم ختان."], [26, "إذن، إن عمل غير المختون بأحكام الشريعة، أفلا يحسب عدم ختانه كأنه ختان؟"], [27, "وغير المختون بالطبيعة، إذ يتمم الشريعة، يدينك أنت يامن تخالف الشريعة ولديك الكتاب والختان."], [28, "فليس بيهودي من كان يهوديا في الظاهر، ولا بختان ما كان ظاهرا في اللحم."], [29, "وإنما اليهودي هو من كان يهوديا في الباطن، والختان هو ما كان ختانا للقلب بالروح لا بالحرف. وهذا يأتيه المدح لا من الناس بل من الله!"]]}], "kwAr": "ومع ذلك", "noteAr": ""}, {"kw": "and say", "raw": "Heb. saying", "note": "Heb. saying", "refs": [], "kwAr": "قائلين", "noteAr": "بالعبرية: «قائلين»."}, {"kw": "none evil can come", "raw": "Amo_9:10", "note": "", "refs": [{"l": "Amo 9:10", "n": "", "vs": [[10, "ويموت جميع خطاة شعبي بالسيف ممن يقولون: لن يدركنا الشر أو يلقانا."]]}], "kwAr": "لن يصيبنا مكروه", "noteAr": ""}], "arS": [["إذ ", []], ["يحكم", ["H8199"]], [" ", []], ["رؤساؤها", ["H7218"]], [" ", []], ["بالرشوة", ["H7810"]], ["، ", []], ["وكهنتها", ["H3548"]], [" ", []], ["يعلمون", ["H3384"]], [" ", []], ["بالأجرة", ["H4242"]], [" ويتعاطى ", []], ["أنبياؤها", ["H5030"]], [" ", []], ["العرافة", ["H7080"]], [" لقاء ", []], ["المال", ["H3701"]], ["، ومع ذلك يدعون ", []], ["الاتكال", ["H8172"]], [" ", []], ["على", ["H5921"]], [" ", []], ["الله", ["H3068"]], [" ", []], ["قائلين", ["H559"]], [": «", []], ["أليس", ["H3808"]], [" ", []], ["الرب", ["H3068"]], [" في ", []], ["وسطنا", ["H7130"]], ["؟ لذلك ", []], ["لن", ["H3808"]], [" ", []], ["يصيبنا", ["H935"]], [" ", []], ["مكروه", ["H7451"]], ["».", []]]}, {"c": 3, "v": 12, "text": "لهذا من جراء أعمالكم ستحرث صهيون كالحقل وتصبح أورشليم كومة من الخرائب، وجبل الهيكل مرتفعا تنمو عليه أشجار الغاب.", "groups": [{"kw": "Zion", "raw": "Mic_1:6; Psa_79:1, Psa_107:34; Jer_26:18; Mat_24:2; Act_6:13, Act_6:14", "note": "", "refs": [{"l": "Mic 1:6", "n": "", "vs": [[6, "لذلك سأجعل السامرة كومة حجارة في الحقل ومغرسا للكروم، وأقذف بحجارتها إلى الوادي، وأعري أساساتها."]]}, {"l": "Psa 79:1", "n": "", "vs": [[1, "ياالله ، إن الأمم قد د
