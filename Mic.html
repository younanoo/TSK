5, "على أني الآن ذاهب إلى أورشليم في خدمة القديسين."], [26, "ذلك أن مؤمني مقاطعتي مقدونية وأخائية حسن لديهم أن يجمعوا إعانة للفقراء بين القديسين الذين في أورشليم."], [27, "حسن لديهم ذلك، وهم في دين لأولئك القديسين: فإذا كان الأمم قد اشتركوا في ما هو روحي عند أولئك، فعليهم أيضا أن يخدموهم في ما هو مادي."], [28, "فبعد انتهائي من هذه المهمة، وتسليمي هذا الثمر للقديسين،"]]}, {"l": "1Co 16:2", "n": "", "vs": [[2, "ففي أول يوم من الأسبوع، ليضع كل منكم جانبا ما يتيسر له مما يكسبه؛ وليحتفظ به، حتى لا يحصل الجمع عندما أذهب إليكم."]]}, {"l": "Rev 21:24-26", "n": "", "vs": [[24, "ستسير بنورها الأمم، ويأتيها ملوك الأرض بكنوزهم."], [25, "ولا تقفل أبوابها أبدا طول النهار، لأن الليل لا يأتي عليها!"], [26, "وستحمل إليها كنوز الأمم وأمجادها."]]}], "kwAr": "وتكرسين", "noteAr": ""}, {"kw": "the Lord of", "raw": "Zec_4:14, Zec_6:5", "note": "", "refs": [{"l": "Zec 4:14", "n": "", "vs": [[14, "فقال: «هاتان هما الممسوحان بالزيت اللذان يمثلان لدى رب الأرض كلها»."]]}, {"l": "Zec 6:5", "n": "", "vs": [[5, "فأجابني: «هذه أرواح السماء الأربعة خارجة بعد مثولها في حضرة رب الأرض كلها."]]}], "kwAr": "لسيد الأرض", "noteAr": ""}], "arS": [["فانهضي", ["H6965"]], [" ", []], ["ياابنة", ["H1323"]], [" ", []], ["صهيون", ["H6726"]], [" ", []], ["وادرسي", ["H1758"]], [" أعداءك، ", []], ["لأني", ["H3588"]], [" ", []], ["سأجعل", ["H7760"]], [" لك ", []], ["قرنا", ["H7161"]], [" من ", []], ["حديد", ["H1270"]], [" ", []], ["وأظلافا", ["H7760", "H6541"]], [" من ", []], ["نحاس", ["H5154"]], [" ", []], ["فتسحقين", ["H1854"]], [" ", []], ["أمما", ["H5971"]], [" ", []], ["كثيرة", ["H7227"]], ["، ", []], ["وتكرسين", ["H2763"]], [" كل ما ", []], ["تغنمينه", ["H1215"]], [" منهم ", []], ["للرب", ["H3068"]], ["، وتقدمين ", []], ["ثروتهم", ["H2428"]], [" ", []], ["لسيد", ["H113"]], [" ", []], ["الأرض", ["H776"]], [" ", []], ["كلها", ["H3605"]], [".", []]]}, {"c": 5, "v": 1, "text": "الآن احشدي جيوشك يامدينة الجيوش، لأن العدو يقيم عليك حصارا، وسيضرب خد قاضي إسرائيل بالقضيب.", "groups": [{"kw": "gather", "raw": "Deu_28:49; 2Ki_24:2; Isa_8:9, Isa_10:6; Jer_4:7, Jer_25:9; Joe_3:9; Hab_1:6; Hab_3:16", "note": "", "refs": [{"l": "Deu 28:49", "n": "", "vs": [[49, "ويجلب الرب عليكم من بعيد، من أقصى الأرض، أمة لا تفهمون لغتها، فتنقض عليكم كالنسر."]]}, {"l": "2Ki 24:2", "n": "", "vs": [[2, "فأرسل الرب غزاة من كلدانيين وأراميين وموآبيين وعمونيين للإغارة على مملكة يهوذا وإبادتها، بموجب ما قضى به الرب على لسان عبيده الأنبياء."]]}, {"l": "Isa 8:9", "n": "", "vs": [[9, "افعلوا ما شئتم أيها الشعوب وانهزموا. أصغي ياجميع أقاصي الأرض. تأهبوا للمعركة وانهزموا."]]}, {"l": "Isa 10:6", "n": "", "vs": [[6, "أرسلهم ضد أمة منافقة، وأوصيهم على شعبي الذي غضبت عليه، ليغنموا غنائمهم ويستولوا على أسلابهم، ويطأوهم كما يطأون الوحل."]]}, {"l": "Jer 4:7", "n": "", "vs": [[7, "قد برز أسد من أجمته، وزحف مدمر الشعوب. قد أقبل من خدره ليخرب أرضكم، فتصبح مدنكم أطلالا مهجورة من السكان."]]}, {"l": "Jer 25:9", "n": "", "vs": [[9, "فها أنا أجند جميع قبائل الشمال بقيادة نبوخذناصر عبدي، وآتي بها إلى هذه الأرض فيجتاحونها ويهلكون جميع سكانها مع سائر الأمم المحيطة بها، وأجعلهم مثار دهشة وصفير، وخرائب أبدية."]]}, {"l": "Joe 3:9", "n": "", "vs": [[9, "نادوا بهذا بين الأمم، وتأهبوا للحرب. احشدوا أبطالكم. ليتقدم ويصعد جميع رجال القتال."]]}, {"l": "Hab 1:6", "n": "", "vs": [[6, "فها أنا أثير الكلدانيين، هذه الأمة الحانقة المندفعة الزاحفة في رحاب الأرض، لتستولي على مساكن ليست لها."]]}, {"l": "Hab 3:16", "n": "", "vs": [[16, "سمعت هذا فتولاني الفزع وارتجفت شفتاي من الصوت، وتسرب النخر إلى عظامي، وارتعشت قدماي. ولكن سأنتظر بصبر يوم البلية الذي يحيق بالأمة التي غزتنا."]]}], "kwAr": "احشدي", "noteAr": ""}, {"kw": "he hath", "raw": "Deu_28:51-57; 2Ki_25:1-3; Eze_21:21, Eze_21:22, Eze_24:2; Luk_19:43, Luk_19:44", "note": "", "refs": [{"l": "Deu 28:51-57", "n": "", "vs": [[51, "فتستولي على نتاج بهائمكم، وتلتهم غلات أرضكم حتى تفنوا، ولا تبقي لكم قمحا ولا خمرا ولا زيتا ولا نتاج بقركم ونعاجكم حتى تهلككم."], [52, "وتحاصركم في جميع مدنكم حتى تتهدم أسواركم الشامخة الحصينة التي وثقتم بمناعتها في كل مدنكم. فتحاصركم في جميع مدنكم في كل أرضكم التي يهبها الرب إلهكم لكم."], [53, "فتأكلون في أثناء الحصار والضيقة التي يضايقكم بها عدوكم ثمار بطونكم، لحم أبنائكم وبناتكم الذين رزقكم بهم الرب إلهكم."], [54, "فيقسو قلب أكثركم رقة ورأفة على أخيه وامرأته التي في حضنه وسائر أبنائه الأحياء."], [55, "فلا يعطي أحدهم من لحم أبنائه، الذي يأكله، لأنه لم يبق لديه شيء سواه في الحصار والضيقة التي يضايقكم بها عدوكم في جميع مدنكم."], [56, "وكذلك فإن أكثر النساء رقة ورأفة، والتي لنعومتها وترفهها لا تجرؤ على لمس الأرض بباطن قدمها، تبخل على زوجها رجل حضنها وعلى ابنها وابنتها"], [57, "بمشيمتها الساقطة منها، وبأولادها الذين تلدهم، لأنها تنوي أن تأكلهم سرا في أثناء الحصار، في الضيقة التي يضايقكم بها عدوكم في كل مدنكم."]]}, {"l": "2Ki 25:1-3", "n": "", "vs": [[1, "وفي السنة التاسعة لملك صدقيا، في اليوم العاشر من الشهر العاشر، زحف نبوخذناصر ملك بابل بكامل جيشه على أورشليم وحاصرها، وأقام حولها أبراجا."], [2, "واستمر حصار أورشليم حتى العام الحادي عشر من ملك صدقيا"], [3, "وفي اليوم التاسع من الشهر الرابع من تلك السنة، تفاقمت المجاعة في المدينة، حتى لم يجد أهلها خبزا يأكلونه."]]}, {"l": "Eze 21:21", "n": "", "vs": [[21, "لأن ملك بابل قد توقف عند مفرق الطريقين على الناصية، يلتمس عرافة، فضرب بالسهام، وطلب مشورة أصنام أسلافه، ونظر إلى الكبد."]]}, {"l": "Eze 21:22", "n": "", "vs": [[22, "فعن يمينه ألقيت قرعة على أورشليم لإقامة المجانق، وإصدار الأوامر بالقتل، وإطلاق هتاف الحرب، لنصب المجانق على الأبواب، لإقامة مترسة لبناء برج."]]}, {"l": "Eze 24:2", "n": "", "vs": [[2, "«ياابن آدم، دون اسم هذا اليوم بعينه، فإن ملك بابل قد حاصر فيه أورشليم."]]}, {"l": "Luk 19:43", "n": "", "vs": [[43, "فستأتي عليك أيام يحاصرك فيها أعداؤك بالمتاريس، ويطبقون عليك، ويشددون عليك الحصار من كل جهة،"]]}, {"l": "Luk 19:44", "n": "", "vs": [[44, "ويهدمونك على أبنائك الذين فيك، فلا يتركون فيك حجرا فوق حجر: لأنك لم تعرفي وقت افتقاد الله لك»."]]}], "kwAr": "يقيم عليك حصارا", "noteAr": ""}, {"kw": "they", "raw": "Job_16:10; Lam_3:30; Mat_5:39, Mat_26:67, Mat_27:30; Joh_18:22, Joh_19:3; Act_23:2; 2Co_11:20", "note": "", "refs": [{"l": "Job 16:10", "n": "", "vs": [[10, "فغر الناس أفواههم علي، لطموني تعييرا على خدي، وتضافروا علي جميعا."]]}, {"l": "Lam 3:30", "n": "", "vs": [[30, "ليبذل خده للاطم، ويشبع تعييرا."]]}, {"l": "Mat 5:39", "n": "", "vs": [[39, "أما أنا فأقول لكم: لا تقاوموا الشر بمثله، بل من لطمك على خدك الأيمن، فأدر له الخد الآخر؛"]]}, {"l": "Mat 26:67", "n": "", "vs": [[67, "فبصقوا في وجهه، وضربوه، ولطمه بعضهم"]]}, {"l": "Mat 27:30", "n": "", "vs": [[30, "وبصقوا عليه، وأخذوا القصبة منه، وضربوه بها على رأسه."]]}, {"l": "Joh 18:22", "n": "", "vs": [[22, "فلما قال يسوع هذا لطمه أحد الحراس وقال له: «أهكذا تجيب رئيس الكهنة؟»"]]}, {"l": "Joh 19:3", "n": "", "vs": [[3, "وأخذوا يتقدمون إليه ويقولون: «سلام، ياملك اليهود!»، ويلطمونه."]]}, {"l": "Act 23:2", "n": "", "vs": [[2, "فأمر حنانيا، رئيس الكهنة، واحدا من الواقفين لديه أن يضرب بولس على فمه،"]]}, {"l": "2Co 11:20", "n": "", "vs": [[20, "فإنكم تحتملون كل من يستعبدكم، ويفترسكم، ويستغلكم، ويتكبر عليكم، ويلطمكم على وجوهكم."]]}], "kwAr": "وسيضرب", "noteAr": ""}, {"kw": "judge", "raw": "1Sa_8:5, 1Sa_8:6; Isa_33:22; Amo_2:3", "note": "", "refs": [{"l": "1Sa 8:5", "n": "", "vs": [[5, "وقالوا له: «ها أنت قد شخت، ولم يسلك ابناك في طريقك، فنصب علينا ملكا يحكم علينا كبقية الشعوب»."]]}, {"l": "1Sa 8:6", "n": "", "vs": [[6, "فاستاء صموئيل من طلبهم تنصيب ملك عليهم ليحكم بينهم، وصلى إلى الرب،"]]}, {"l": "Isa 33:22", "n": "", "vs": [[22, "لأن الرب هو قاضينا، الرب هو مشترعنا، هو ملكنا وسيخلصنا"]]}, {"l": "Amo 2:3", "n": "", "vs": [[3, "وأستأصل الحاكم من بين الموآبيين، وأقضي على كل رؤسائهم، يقول الرب."]]}], "kwAr": "قاضي", "noteAr": ""}], "arS": [["الآن", ["H6258"]], [" ", []], ["احشدي", ["H1413"]], [" ", []], ["جيوشك", ["H1413"]], [" ", []], ["يامدينة", ["H1323"]], [" ", []], ["الجيوش", ["H1416"]], ["، لأن العدو ", []], ["يقيم", ["H7760"]], [" ", []], ["عليك", ["H5921"]], [" ", []], ["حصارا", ["H4692"]], ["، ", []], ["وسيضرب", ["H5221"]], [" ", []], ["خد", ["H3895"]], [" ", []], ["قاضي", ["H8199"]], [" ", []], ["إسرائيل", ["H3478"]], [" ", []], ["بالقضيب", ["H7626"]], [".", []]]}, {"c": 5, "v": 2, "text": "أما أنت يابيت لحم أفراتة، مع أنك قرية صغيرة بين ألوف قرى يهوذا، إلا أن منك يخرج لي من يصبح ملكا في إسرائيل وأصله منذ القديم، منذ الأزل.", "groups": [{"kw": "But thou", "raw": "Mat_2:6; Joh_7:42", "note": "", "refs": [{"l": "Mat 2:6", "n": "", "vs": [[6, "وأنت يابيت لحم بأرض يهوذا، لست صغيرة الشأن أبدا بين حكام يهوذا، لأنه منك يطلع الحاكم الذي يرعى شعبي إسرائيل! »"]]}, {"l": "Joh 7:42", "n": "", "vs": [[42, "أما قال الكتاب إن المسيح سيأتي من نسل داود، ومن قرية بيت لحم حيث كان داود؟»"]]}], "kwAr": "أما أنت", "noteAr": ""}, {"kw": "Ephratah", "raw": "Gen_35:19, Gen_48:7, Ephrath, Rth_4:11; 1Sa_17:12; 1Ch_2:50,1Ch_2:51, 1Ch_2:54, 1Ch_4:4; Psa_132:6", "note": "Gen_35:19, Gen_48:7, Ephrath, Rth_4:11; 1Sa_17:12; 1Ch_2:50,1Ch_2:51, 1Ch_2:54, 1Ch_4:4; Psa_132:6", "refs": [{"l": "Gen 35:19", "n": "", "vs": [[19, "ثم ماتت راحيل ودفنت في الطريق المؤدية إلى أفراتة، أي بيت لحم."]]}, {"l": "Gen 48:7", "n": "", "vs": [[7, "لأنني فيما كنت راجعا من سهل آرام، ماتت راحيل في أرض كنعان في الطريق على مقربة من أفراتة، فدفنتها في الطريق المؤدية إلى أفراتة، التي هي بيت لحم»."]]}, {"l": "Rut 4:11", "n": "", "vs": [[11, "فقال الجمع الماثل عند بوابة المدينة والشيوخ أيضا: «نحن شهود. فليجعل الرب المرأة الداخلة إلى بيتك نظير راحيل وليئة اللتين بنتا بيت يعقوب. فليتسع نفوذك في أفراتة، وليذع اسمك في بيت لحم."]]}, {"l": "1Sa 17:12", "n": "", "vs": [[12, "وكان لداود بن يسى الأفراتي المقيم في بيت لحم أرض يهوذا، سبعة إخوة أكبر منه. وكان يسى قد شاخ في زمن شاول وتقدم في العمر."]]}, {"l": "1Ch 2:50", "n": "", "vs": [[50, "وهؤلاء بعض ذرية كالب: حور بكره من زوجته أفرات وقد أنجبت شوبال مؤسس قرية يعاريم،"]]}, {"l": "1Ch 2:51", "n": "", "vs": [[51, "وسلما مؤسس بيت لحم، وحاريف مؤسس بيت جادير."]]}, {"l": "1Ch 2:54", "n": "", "vs": [[54, "وكان سلما مؤسس بيت لحم أبا لقبائل النطوفاتيين وعطروت بيت يوآب، ونصف المنوحوت، والصرعيين."]]}, {"l": "1Ch 4:4", "n": "", "vs": [[4, "وفنوئيل الذي أسس مدينة جدور، وعازر مؤسس مدينة حوشة. وجميع هؤلاء من ذرية حور بكر كالب من زوجته أفراتة. وهو الذي قام ببناء مدينة بيت لحم."]]}, {"l": "Psa 132:6", "n": "", "vs": [[6, "في أفراتة سمعنا به، وفي حقول الوعر وجدناه،"]]}], "kwAr": "أفراتة", "noteAr": "أو: أفراث. انظر تك 35: 19؛ 48: 7؛ را 4: 11؛ 1صم 17: 12؛ 1أخ 2: 50، 51، 54؛ 4: 4؛ مز 132: 6"}, {"kw": "among", "raw": "1Sa_10:19, 1Sa_23:23", "note": "", "refs": [{"l": "1Sa 10:19", "n": "", "vs": [[19, "ولكنكم اليوم تنكرتم لإلهكم، مخلصكم من جميع المسيئين إليكم ومن مضايقيكم، وقلتم له: نصب علينا ملكا. والآن امثلوا أمام الرب حسب أسباطكم وعشائركم»."]]}, {"l": "1Sa 23:23", "n": "", "vs": [[23, "وتأكدوا لي من جميع المواضع التي يمكن أن يختبيء فيها ثم ارجعوا إلي بالخبر اليقين فأمضي معكم، إن كان حقا موجودا، فأبحث عنه بين عشائر يهوذا»."]]}], "kwAr": "بين", "noteAr": ""}, {"kw": "thousands", "raw": "Exo_18:21, Exo_18:25; Deu_1:15; 1Sa_8:12, 1Sa_17:18", "note": "", "refs": [{"l": "Exo 18:21", "n": "", "vs": [[21, "ولكن اختر من بين الشعب رجالا مقتدرين خائفين الله أمناء يبغضون الرشوة، تقيمهم عليهم رؤساء لفئات الألوف والمئات والخماسين والعشرات."]]}, {"l": "Exo 18:25", "n": "", "vs": [[25, "واختار موسى من بين جميع الإسرائيليين رجالا مقتدرين، وأقامهم على الشعب، رؤساء ألوف ومئات وخماسين وعشرات."]]}, {"l": "Deu 1:15", "n": "", "vs": [[15, "فاخترت رؤساء أسباطكم رجالا حكماء من ذوي المقام، وأقمتهم قادة عليكم، فكانوا رؤساء ألوف ومئات وخماسين وعشرات، وعرفاء لأسباطكم."]]}, {"l": "1Sa 8:12", "n": "", "vs": [[12, "ويعين بعضهم قادة ألوف وقادة خماسين، يحرثون حقوله ويحصدون غلاته، ويصنعون أسلحته ومركباته الحربية."]]}, {"l": "1Sa 17:18", "n": "", "vs": [[18, "وقدم عشر قطع من الجبن إلى قائد الألف، واطمئن على سلامة إخوتك وأحضر لي منهم ما يدل على سلامتهم»."]]}], "kwAr": "ألوف", "noteAr": ""}, {"kw": "yet", "raw": "Isa_11:1, Isa_53:2; Eze_17:22-24; Amo_9:11; Luk_2:4-7; 1Co_1:27, 1Co_1:28", "note": "", "refs": [{"l": "Isa 11:1", "n": "", "vs": [[1, "ويفرخ برعم من جذع يسى، وينبت غصن من جذوره،"]]}, {"l": "Isa 53:2", "n": "", "vs": [[2, "نما كبرعم أمامه، وكجذر في أرض يابسة، لا صورة له ولا جمال يسترعيان نظرنا، ولا منظر فنشتهيه."]]}, {"l": "Eze 17:22-24", "n": "", "vs": [[22, "ثم آخذ من ناصية الأرز العالي برعما وأنصبه، وأقطف من رؤوس أغصانه غصنا طريا وأغرسه في جبل شامخ شاهق،"], [23, "في جبل إسرائيل المرتفع فينبت أغصانا ويحمل ثمارا ويصبح أرزا وارفا يأوي تحت ظل أغصانه كل طائر."], [24, "فتدرك جميع أشجار الصحراء (أي جميع الأمم) أني أنا الرب، أذللت الأشجار المتعالية، وعظمت الأشجار الدنية. يبست الشجر النضر، وأنضرت الشجر المتيبس، أنا الرب قلت وأنجزت»."]]}, {"l": "Amo 9:11", "n": "", "vs": [[11, "في ذلك اليوم أقيم مسكن داود الذي تهاوى، وأسد ثغراته وأعمر خرائبه وأعيد بناءه كالعهد به في الأيام الغابرة."]]}, {"l": "Luk 2:4-7", "n": "", "vs": [[4, "وصعد يوسف أيضا من مدينة الناصرة بمنطقة الجليل إلى مدينة داود المدعوة بيت لحم بمنطقة اليهودية، لأنه كان من بيت داود وعشيرته،"], [5, "ليتسجل هناك مع مريم المخطوبة له، وهي حبلى."], [6, "وبينما كانا هناك، تم زمانها لتلد،"], [7, "فولدت ابنها البكر، ولفته بقماط، وأنامته في مذود، إذ لم يكن لهما متسع في المنزل."]]}, {"l": "1Co 1:27", "n": "", "vs": [[27, "بل إن الله قد اختار ما هو جاهل في العالم ليخجل الحكماء. وقد اختار الله ما هو ضعيف في العالم ليخجل المقتدرين."]]}, {"l": "1Co 1:28", "n": "", "vs": [[28, "وقد اختار الله ما كان في العالم وضيعا ومحتقرا وعديم الشأن، ليزيل ما له شأن،"]]}], "kwAr": "مع أنك", "noteAr": ""}, {"kw": "that is", "raw": "Gen_49:10; 1Ch_5:2; Isa_9:6, Isa_9:7; Jer_13:5, Jer_13:6; Eze_34:23, Eze_34:24, Eze_37:22-25; Zec_9:9; Mat_28:18; Luk_1:31-33, Luk_23:2, Luk_23:38; Joh_19:14-22; Rev_19:16", "note": "", "refs": [{"l": "Gen 49:10", "n": "", "vs": [[10, "لا يزول صولجان الملك من يهوذا ولا مشترع من صلبه حتى يأتي شيلوه (ومعناه: من له الأمر) فتطيعه الشعوب."]]}, {"l": "1Ch 5:2", "n": "", "vs": [[2, "ومع أن يهوذا كان الأقوى بين إخوته ومن ذريته تحدر الملوك الذين حكموا، فإن البكورية ظلت من نصيب يوسف."]]}, {"l": "Isa 9:6", "n": "", "vs": [[6, "لأنه يولد لنا ولد ويعطى لنا ابن يحمل الرياسة على كتفه، ويدعى اسمه عجيبا، مشيرا، إلها قديرا، أبا أبديا، رئيس السلام."]]}, {"l": "Isa 9:7", "n": "", "vs": [[7, "ولا تكون نهاية لنمو رياسته وللسلام اللذين يسودان عرش داود ومملكته، ليثبتها ويعضدها بالحق والبر، من الآن وإلى الأبد. إن غيرة الرب القدير تتمم هذا."]]}, {"l": "Jer 13:5", "n": "", "vs": [[5, "فانطلقت وطمرتها عند الفرات كأمر الرب."]]}, {"l": "Jer 13:6", "n": "", "vs": [[6, "وبعد عدة أيام قال لي الرب: «اذهب إلى الفرات وخذ المنطقة التي أمرتك أن تطمرها هناك»."]]}, {"l": "Eze 34:23", "n": "", "vs": [[23, "وأنصب عليها راعيا واحدا عبدي داود (أي المسيح) يرعاها بنفسه ويكون لها راعيا أمينا."]]}, {"l": "Eze 34:24", "n": "", "vs": [[24, "وأنا الرب أكون لهم إلها، وعبدي داود يكون لهم رئيسا. أنا الرب تكلمت."]]}, {"l": "Eze 37:22-25", "n": "", "vs": [[22, "وأجعلهم أمة واحدة في الأرض وعلى الجبال، تحت رئاسة ملك واحد، فلا يكونون بعد أمتين، ولا ينقسمون إلى مملكتين."], [23, "ولا يتدنسون بعد بأصنامهم ورجاساتهم ولا بأي من معاصيهم، بل أخلصهم من مواطن إثمهم، وأطهرهم فيكونون لي شعبا وأنا أكون لهم إلها."], [24, "ويصبح داود عبدي (أي المسيح) ملكا عليهم، فيكون لهم جميعا راع واحد فيمارسون أحكامي ويطيعون فرائضي عاملين بها."], [25, "ويقيمون في الأرض التي وهبتها لعبدي يعقوب التي سكن فيها آباؤكم، فيستوطنون فيها هم وأبناؤهم وأحفادهم إلى الأبد. ويكون عبدي داود (أي المسيح) رئيسا عليهم مدى الدهر."]]}, {"l": "Zec 9:9", "n": "", "vs": [[9, "»ابتهجي جدا ياابنة صهيون واهتفي ياابنة أورشليم، لأن هوذا ملكك مقبل إليك. هو عادل ظافر، ولكنه وديع راكب على أتان، على جحش ابن أتان."]]}, {"l": "Mat 28:18", "n": "", "vs": [[18, "فتقدم يسوع وكلمهم قائلا: «دفع إلي كل سلطان في السماء وعلى الأرض."]]}, {"l": "Luk 1:31-33", "n": "", "vs": [[31, "وها أنت ستحبلين وتلدين ابنا، وتسمينه يسوع."], [32, "إنه يكون عظيما، وابن العلي يدعى، ويمنحه الرب الإله عرش داود أبيه،"], [33, "فيملك على بيت يعقوب إلى الأبد، ولن يكون لملكه نهاية»."]]}, {"l": "Luk 23:2", "n": "", "vs": [[2, "وبدأوا يتهمونه قائلين: «تبين لنا أن هذا يضلل أمتنا، ويمنع أن تدفع الجزية للقيصر ويدعي أنه المسيح الملك!»"]]}, {"l": "Luk 23:38", "n": "", "vs": [[38, "وكان معلقا فوقه لافتة كتب فيها: «هذا هو ملك اليهود»."]]}, {"l": "Joh 19:14-22", "n": "", "vs": [[14, "وكان الوقت نحو السادسة في يوم الإعداد للفصح. وقال بيلاطس لليهود: «ها هو ملككم!»"], [15, "فصرخوا: «خذه! خذه ! اصلبه!» فسألهم بيلاطس: «أأصلب ملككم؟» فأجابه رؤساء الكهنة: «لا ملك لنا إلا القيصر»."], [16, "فسلمه بيلاطس إليهم ليصلب."], [17, "فخرج وهو حامل صليبه إلى المكان المعروف بمكان الجمجمة، وبالعبرية: «جلجثة»،"], [18, "وهناك صلبوه وصلبوا معه رجلين، واحدا من كل جانب، ويسوع في الوسط."], [19, "وعلق بيلاطس لافتة على الصليب مكتوبا عليها: «يسوع الناصري ملك اليهود»."], [20, "فقرأ اللافتة كثيرون من اليهود، لأن المكان الذي صلب يسوع فيه كان قريبا من المدينة. وكانت اللافتة مكتوبة بالعبرية واللاتينية واليونانية."], [21, "فقال رؤساء كهنة اليهود لبيلاطس: «لا تكتب: ملك اليهود، بل إن هذا الإنسان قال: أنا ملك اليهود»."], [22, "فرد بيلاطس: «ما كتبت فقد كتبت!»"]]}, {"l": "Rev 19:16", "n": "", "vs": [[16, "وقد كتب على ثوبه وعلى فخذه «ملك الملوك ورب الأرباب»."]]}], "kwAr": "ملكا", "noteAr": ""}, {"kw": "whose", "raw": "Psa_90:2, Psa_102:25-27; Pro_8:22; Joh_1:1-3; Col_1:17; Heb_13:8; 1Jo_1:1; Rev_1:11-18, Rev_2:8, Rev_21:6", "note": "", "refs": [{"l": "Psa 90:2", "n": "", "vs": [[2, "قبل أن أوجدت الجبال أو كونت المسكونة، أنت الله من الأزل وإلى الأبد."]]}, {"l": "Psa 102:25-27", "n": "", "vs": [[25, "من قدم أسست الأرض، والسماوات هي صنع يديك."], [26, "هي زائلة أما أنت فباق. تبلى كلها كالثوب. وتستبدلها كما يستبدل الرداء القديم بالجديد."], [27, "لكنك أنت الدائم الخالد، وسنوك لن تنتهي."]]}, {"l": "Pro 8:22", "n": "", "vs": [[22, "اقتناني الرب منذ بدء خلقه، من قبل الشروع في أعماله القديمة."]]}, {"l": "Joh 1:1-3", "n": "", "vs": [[1, "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."], [2, "هو كان في البدء عند الله."], [3, "به تكون كل شيء، وبغيره لم يتكون أي شيء مما تكون."]]}, {"l": "Col 1:17", "n": "", "vs": [[17, "هو كائن قبل كل شيء، وبه يدوم كل شيء."]]}, {"l": "Heb 13:8", "n": "", "vs": [[8, "يسوع المسيح هو هو أمسا واليوم وإلى الأبد."]]}, {"l": "1Jo 1:1", "n": "", "vs": [[1, "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."]]}, {"l": "Rev 1:11-18", "n": "", "vs": [[11, "يقول: «دون ما تراه في كتاب، وابعث به إلى الكنائس السبع: في أفسس، وسميرنا، وبرغامس، وثياتيرا، وساردس، وفيلادلفيا، ولاودكية»."], [12, "و"], [13, "وعندما التفت نحو الصوت، رأيت كائنا يشبه ابن الإنسان، يقف وسط سبع منائر من ذهب، ويرتدي ثوبا طويلا إلى الرجلين، يلف صدره حزام من ذهب."], [14, "شعر رأسه ناصع البياض كالصوف أو الثلج، وعيناه كشعلة ملتهبة."], [15, "رجلاه تلمعان كأنهما نحاس نقي مصقول بالنار، وصوته يدوي كصوت شلال غزير،"], [16, "ووجهه يتوهج بالنور كشمس الظهيرة. وكان في يده اليمنى سبعة نجوم، ومن فمه يخرج سيف قاطع ذو حدين."], [17, "فلما رأيته ارتميت عند قدميه كالميت، فلمسني بيده اليمنى وقال: «لا تخف! أنا الأول والآخر،"], [18, "أنا الحي. كنت ميتا، ولكن ها أنا حي إلى أبد الآبدين. ولي مفاتيح الموت والهاوية."]]}, {"l": "Rev 2:8", "n": "", "vs": [[8, "واكتب إلى ملاك الكنيسة في سميرنا: إليك ما يقوله الأول والآخر، الذي كان ميتا وعاد حيا:"]]}, {"l": "Rev 21:6", "n": "", "vs": [[6, "ثم قال: «قد تم. أنا الألف والياء (البداية والنهاية). أنا أسقي العطشان من ينبوع ماء الحياة مجانا."]]}], "kwAr": "وأصله", "noteAr": ""}, {"kw": "everlasting", "raw": "or, the days of eternity", "note": "or, the days of eternity", "refs": [], "kwAr": "الأزل", "noteAr": "أو: «أيام الأزل»."}], "arS": [["أما ", []], ["أنت", ["H859"]], [" ", []], ["يابيت لحم", ["H1035"]], [" ", []], ["أفراتة", ["H672"]], ["، مع أنك قرية ", []], ["صغيرة", ["H6810"]], [" بين ", []], ["ألوف", ["H505"]], [" قرى ", []], ["يهوذا", ["H3063"]], ["، إلا أن ", []], ["منك", ["H4480"]], [" ", []], ["يخرج", ["H3318"]], [" لي من ", []], ["يصبح", ["H1961"]], [" ", []], ["ملكا", ["H4910"]], [" في ", []], ["إسرائيل", ["H3478"]], [" ", []], ["وأصله", ["H4163"]], [" ", []], ["منذ", ["H4480"]], [" ", []], ["القديم", ["H6924"]], ["، ", []], ["منذ", ["H4480"]], [" ", []], ["الأزل", ["H3117", "H5769"]], [".", []]]}, {"c": 5, "v": 3, "text": "لذلك يسلم الرب شعبه إلى أعدائهم إلى أن تلد من تقاسي من المخاض، عندئذ ترجع بقية إخوته من السبي إلى شعب إسرائيل.", "groups": [{"kw": "Therefore", "raw": "Mic_7:13; Hos_2:9, Hos_2:14", "note": "", "refs": [{"l": "Mic 7:13", "n": "", "vs": [[13, "غير أن الأرض تكون موحشة بسبب سيئات سكانها."]]}, {"l": "Hos 2:9", "n": "", "vs": [[9, "لذلك أسترد حنطتي في حينها، وخمري في أوانه، وأنتزع صوفي وكتاني اللذين تستر بهما عريها."]]}, {"l": "Hos 2:14", "n": "", "vs": [[14, "لهذا، ها أنا أتملقها وآخذها إلى الصحراء وأخاطبها بحنان،"]]}], "kwAr": "لذلك", "noteAr": ""}, {"kw": "give", "raw": "Mic_6:14; 1Ki_14:16; 2Ch_30:7; Hos_11:8", "note": "", "refs": [{"l": "Mic 6:14", "n": "", "vs": [[14, "ستأكلين ولا تشبعين، ويظل جوفك خاويا. وما تدخرينه تعجزين عن الاحتفاظ به. لأني أدفعه للسيف."]]}, {"l": "1Ki 14:16", "n": "", "vs": [[16, "وينبذ إسرائيل من جراء خطايا يربعام التي ارتكبها واستغوى إسرائيل معه فأخطأوا»."]]}, {"l": "2Ch 30:7", "n": "", "vs": [[7, "ولا تخونوا الرب إله آبائكم كما خانه أباؤكم وإخوتكم، فجعلهم مثار دهشة كما ترون."]]}, {"l": "Hos 11:8", "n": "", "vs": [[8, "كيف أتخلى عنك ياأفرايم؟ وكيف أسلمك إلى العدو ياإسرائيل؟ كيف أعاملك كما عاملت أدمة؟ وكيف أجري عليك ما أجريته على صبوئيم؟ إن قلبي يتلوى أسى في داخلي وتضرم في مراحمي."]]}], "kwAr": "يسلم", "noteAr": ""}, {"kw": "she", "raw": "Mic_4:10; Isa_66:7, Isa_66:8; Mat_1:21; Rev_12:1, Rev_12:2", "note": "", "refs": [{"l": "Mic 4:10", "n": "", "vs": [[10, "تلوي وجعا وتأوهي ياابنة صهيون كامرأة تعاني من المخاض، لأنك الآن تخرجين من المدينة لتقيمي في الصحراء. ستذهبين إلى بابل، وهناك يتم إنقاذك لأن الرب يفتديك هناك من أيدي أعدائك."]]}, {"l": "Isa 66:7", "n": "", "vs": [[7, "شعبي مثل امرأة ولدت قبل أن تتمخض، وقبل أن تقاسي من الطلق أنجبت ذكرا."]]}, {"l": "Isa 66:8", "n": "", "vs": [[8, "من سمع مثل هذا، ومن رأى نظيره؟ أتولد بلاد في يوم واحد؟ أم تخلق أمة دفعة واحدة؟ فما إن تمخضت صهيون حتى أنجبت أبناءها."]]}, {"l": "Mat 1:21", "n": "", "vs": [[21, "فستلد ابنا، وأنت تسميه يسوع، لأنه هو الذي يخلص شعبه من خطاياهم»."]]}, {"l": "Rev 12:1", "n": "", "vs": [[1, "وظهرت في السماء آية عظيمة: امرأة لابسة الشمس، والقمر تحت قدميها، وعلى رأسها تاج من اثني عشر نجما."]]}, {"l": "Rev 12:2", "n": "", "vs": [[2, "وكانت حبلى تصرخ من ألم الولادة وتتوجع وهي تلد."]]}], "kwAr": "تقاسي من المخاض", "noteAr": ""}, {"kw": "then", "raw": "Mic_4:7; Isa_10:20,Isa_10:21, Isa_11:11; Jer_31:1, Jer_31:7-9; Rom_9:27, Rom_9:28, Rom_11:4-6", "note": "", "refs": [{"l": "Mic 4:7", "n": "", "vs": [[7, "فأجعل من العرج بقية، ومن المنبوذين أمة قوية، فيملك الرب عليهم في جبل صهيون من الآن وإلى الأبد."]]}, {"l": "Isa 10:20", "n": "", "vs": [[20, "في ذلك اليوم لا تعود بقية إسرائيل والناجون منهم يتوكلون على من ضربهم، بل يعتمدون على الرب قدوس إسرائيل بالحق."]]}, {"l": "Isa 10:21", "n": "", "vs": [[21, "وترجع بقية ذرية يعقوب إلى الرب القدير."]]}, {"l": "Isa 11:11", "n": "", "vs": [[11, "فيعود الرب ليمد يده ثانية ليسترد البقية الباقية من شعبه، من أشور ومصر وفتروس وكوش وعيلام وشنعار وحماة، ومن جزائر البحر،"]]}, {"l": "Jer 31:1", "n": "", "vs": [[1, "ويقول الرب: «في ذلك الوقت أكون إلها لجميع عشائر إسرائيل، وهم يكونون لي شعبا."]]}, {"l": "Jer 31:7-9", "n": "", "vs": [[7, "فإن هذا ما يعلنه الرب: «رنموا بهتاف ليعقوب، اهتفوا لرأس الأمم، أعلنوا وسبحوا وقولوا: أنقذ يارب شعبك، بقية إسرائيل»."], [8, "ها أنا آتي بهم من بلاد الشمال، وأجمعهم من أقصى أطراف الأرض، وفيهم الأعمى والأعرج، الحبلى والماخض، فيرجع حشد عظيم إلى هنا."], [9, "سيرجعون بنوح، وبتضرعات أهديهم. إلى جوار جداول المياه أسيرهم فيمشون في طريق مستقيمة لا يعثرون فيها، لأني أب لإسرائيل، وأفرايم بكري»."]]}, {"l": "Rom 9:27", "n": "", "vs": [[27, "أما إشعياء، فيهتف متكلما على إسرائيل: «ولو كان بنو إسرائيل كرمل البحر عددا، فإن بقية منهم ستخلص."]]}, {"l": "Rom 9:28", "n": "", "vs": [[28, "فإن الرب سيحسم الأمر وينجز كلمته سريعا على الأرض»."]]}, {"l": "Rom 11:4-6", "n": "", "vs": [[4, "ولكن، ماذا كان الجواب الإلهي له؟: «أبقيت لنفسي سبعة آلاف رجل لم يحنوا ركبة للبعل!»"], [5, "فكذلك، في الزمان الحاضر، ماتزال بقية اختارها الله بالنعمة."], [6, "ولكن، بما أن ذلك قد تم بالنعمة، فليس بعد على أساس الأعمال، وإلا فليست النعمة نعمة بعد."]]}], "kwAr": "عندئذ", "noteAr": ""}, {"kw": "his", "raw": "Mat_12:50, Mat_25:40; Rom_8:29; Heb_1:11, Heb_1:12", "note": "", "refs": [{"l": "Mat 12:50", "n": "", "vs": [[50, "لأن كل من يعمل بإرادة أبي الذي في السماوات هو أخي وأختي وأمي ! »"]]}, {"l": "Mat 25:40", "n": "", "vs": [[40, "فيجيب ينابيع المياه."]]}, {"l": "Eze 34:22-24", "n": "", "vs": [[22, "ولكني أنقذ غنمي فلا تكون من بعد غنيمة، وأقضي بين شاة وشاة،"], [23, "وأنصب عليها راعيا واحدا عبدي داود (أي المسيح) يرعاها بنفسه ويكون لها راعيا أمينا."], [24, "وأنا الرب أكون لهم إلها، وعبدي داود يكون لهم رئيسا. أنا الرب تكلمت."]]}, {"l": "Joh 10:27-30", "n": "", "vs": [[27, "فخرافي تصغي لصوتي، وأنا أعرفها وهي تتبعني،"], [28, "وأعطيها حياة أبدية، فلا تهلك إلى الأبد، ولا ينتزعها أحد من يدي."], [29, "إن الآب الذي أعطاني إياها هو أعظم من الجميع، ولا يقدر أحد أن ينتزع من يد الآب شيئا."], [30, "أنا والآب واحد!»"]]}], "kwAr": "فيقوم", "noteAr": ""}, {"kw": "feed", "raw": "or, rule, Mat_2:6 *marg.", "note": "or, rule, Mat_2:6 *marg.", "refs": [{"l": "Mat 2:6", "n": "*marg.", "vs": [[6, "وأنت يابيت لحم بأرض يهوذا، لست صغيرة الشأن أبدا بين حكام يهوذا، لأنه منك يطلع الحاكم الذي يرعى شعبي إسرائيل! »"]]}], "kwAr": "ويرعى", "noteAr": "أو: «يحكم». انظر مت 2: 6"}, {"kw": "in the majesty", "raw": "Exo_23:21; 1Ch_29:11, 1Ch_29:12; Psa_45:3-6, Psa_72:19, Psa_93:1, Psa_145:12; Mat_25:31; Joh_5:22-29, Joh_10:38, Joh_14:9-11; Rev_1:13-18", "note": "", "refs": [{"l": "Exo 23:21", "n": "", "vs": [[21, "فاصغ إليه وامتثل له ولا تعصه لأنه لا يصفح عن ذنوبكم إذ أن اسمي فيه."]]}, {"l": "1Ch 29:11", "n": "", "vs": [[11, "لك يارب العظمة والسطوة والجلال والبهاء والمجد، لأن لك كل ما في السماء والأرض. أنت يارب صاحب الملك وقد تعاليت فوق رؤوس الجميع."]]}, {"l": "1Ch 29:12", "n": "", "vs": [[12, "أنت مصدر كل غنى وكرامة، وأنت المتسلط على الجميع، والمالك للقوة والسطوة، وأنت القادر على تعظيم الجميع وتقوية عزيمتهم."]]}, {"l": "Psa 45:3-6", "n": "", "vs": [[3, "في جلالك وبهائك تقلد سيفك على فخذك أيها المقتدر،"], [4, "وبجلالك اركب ظافرا لأجل الحق والوداعة والبر، فتقتحم يمينك الأهوال."], [5, "سهامك مسنونة تخترق أعماق قلوب أعداء الملك، وتسقط الشعوب صرعى تحت قدميك."], [6, "عرشك ياالله إلى دهر الدهور، وصولجان ملكك عادل ومستقيم."]]}, {"l": "Psa 72:19", "n": "", "vs": [[19, "تبارك اسمه المجيد إلى الأبد، ولتمتليء الأرض كلها من مجده. آمين ثم آمين."]]}, {"l": "Psa 93:1", "n": "", "vs": [[1, "الرب قد ملك مرتديا الجلال. متنطقا بحزام القوة. الأرض تثبتت فلن تتزعزع."]]}, {"l": "Psa 145:12", "n": "", "vs": [[12, "لكي يطلعوا الناس على أفعالك المقتدرة، وعلى بهاء ملكك المجيد."]]}, {"l": "Mat 25:31", "n": "", "vs": [[31, "وعندما يعود ابن الإنسان في مجده ومعه جميع ملائكته، فإنه يجلس على عرش مجده،"]]}, {"l": "Joh 5:22-29", "n": "", "vs": [[22, "والآب لا يحاكم أحدا، بل أعطى الابن سلطة القضاء كلها،"], [23, "ليكرم الجميع الابن كما يكرمون الآب. ومن لا يكرم الابن لا يكرم الآب الذي أرسله."], [24, "الحق الحق أقول لكم إن من يسمع كلامي ويؤمن بالذي أرسلني تكون له الحياة الأبدية، ولا يحاكم في اليوم الأخير، لأنه قد انتقل من الموت إلى الحياة."], [25, "الحق الحق أقول لكم: إن الساعة التي يسمع فيها الأموات صوت ابن الله ستأتي بل هي الآن والذين يسمعونه يحيون."], [26, "لأنه كما أن للآب حياة في ذاته، فقد أعطى الابن أيضا أن تكون له حياة في ذاته،"], [27, "وأعطاه سلطة أن يدين، لأنه ابن الإنسان."], [28, "لا تتعجبوا من هذا: فسوف تأتي ساعة يسمع فيها جميع من في القبور صوته،"], [29, "فيخرجون منها: فالذين عملوا الصالحات يخرجون في القيامة المؤدية إلى الحياة، وأما الذين عملوا السيئات ففي القيامة المؤدية إلى الدينونة."]]}, {"l": "Joh 10:38", "n": "", "vs": [[38, "أما إن كنت أفعل ذلك، فصدقوا تلك الأعمال، إن كنتم لا تصدقونني أنا. عندئذ تعرفون ويتأكد لكم أن الآب في وأنا فيه»."]]}, {"l": "Joh 14:9-11", "n": "", "vs": [[9, "فأجابه يسوع: «مضت هذه المدة الطويلة وأنا معكم ولم تعرفني يافيلبس؟ الذي رآني رأى الآب، فكيف تقول: أرنا الآب؟"], [10, "ألا تؤمن أني أنا في الآب، وأن الآب في؟ الكلام الذي أقوله لا أقوله من عندي، وإنما الآب الحال في هو يعمل أعماله هذه."], [11, "صدقوا قولي: إني أنا في الآب وإن الآب في، وإلا فصدقوني بسبب تلك الأعمال."]]}, {"l": "Rev 1:13-18", "n": "", "vs": [[13, "وعندما التفت نحو الصوت، رأيت كائنا يشبه ابن الإنسان، يقف وسط سبع منائر من ذهب، ويرتدي ثوبا طويلا إلى الرجلين، يلف صدره حزام من ذهب."], [14, "شعر رأسه ناصع البياض كالصوف أو الثلج، وعيناه كشعلة ملتهبة."], [15, "رجلاه تلمعان كأنهما نحاس نقي مصقول بالنار، وصوته يدوي كصوت شلال غزير،"], [16, "ووجهه يتوهج بالنور كشمس الظهيرة. وكان في يده اليمنى سبعة نجوم، ومن فمه يخرج سيف قاطع ذو حدين."], [17, "فلما رأيته ارتميت عند قدميه كالميت، فلمسني بيده اليمنى وقال: «لا تخف! أنا الأول والآخر،"], [18, "أنا الحي. كنت ميتا، ولكن ها أنا حي إلى أبد الآبدين. ولي مفاتيح الموت والهاوية."]]}], "kwAr": "وبجلال", "noteAr": ""}, {"kw": "the Lord", "raw": "Joh_20:17; Eph_1:3", "note": "", "refs": [{"l": "Joh 20:17", "n": "", "vs": [[17, "فقال لها: «لا تمسكي بي! فإني لم أصعد بعد إلى الآب، بل اذهبي إلى إخوتي وقولي لهم: إني سأصعد إلى أبي وأبيكم، وإلهي وإلهكم!»"]]}, {"l": "Eph 1:3", "n": "", "vs": [[3, "تبارك الله ، أبو ربنا يسوع المسيح الذي باركنا بكل بركة روحية في الأماكن السماوية."]]}], "kwAr": "الرب", "noteAr": ""}, {"kw": "shall abide", "raw": "Mat_16:18; 1Pe_1:5; Jud_1:1", "note": "", "refs": [{"l": "Mat 16:18", "n": "", "vs": [[18, "وأنا أيضا أقول لك: أنت صخر. وعلى هذه الصخرة أبني كنيستي وأبواب الجحيم لن تقوى عليها!"]]}, {"l": "1Pe 1:5", "n": "", "vs": [[5, "محفوظا لكم في السماوات. فإنكم محفوظون بقدرة الله العاملة من خلال إيمانكم، إلى أن تفوزوا بالخلاص النهائي المعد لكم والذي سوف يتجلى في الزمان الأخير."]]}, {"l": "Jud 1:1", "n": "", "vs": [[1, "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."]]}], "kwAr": "فيعيشون", "noteAr": ""}, {"kw": "shall he be great", "raw": "Psa_22:27, Psa_72:8, Psa_98:3; Isa_49:5, Isa_52:10; Zec_9:10; Luk_1:32; Rev_11:15", "note": "", "refs": [{"l": "Psa 22:27", "n": "", "vs": [[27, "تتذكر جميع أقاصي الأرض وترجع إلى الرب، وتتعبد أمامك جميع قبائل الأمم."]]}, {"l": "Psa 72:8", "n": "", "vs": [[8, "ولتمتد مملكته من البحر إلى البحر، ومن النهر إلى أقاصي الأرض."]]}, {"l": "Psa 98:3", "n": "", "vs": [[3, "ذكر رحمته وأمانته لبيت إسرائيل. رأت كل أقاصي الأرض خلاص إلهنا."]]}, {"l": "Isa 49:5", "n": "", "vs": [[5, "والآن قال لي الرب الذي كونني في رحم أمي لأكون له خادما، حتى أرد ذرية يعقوب إليه، فيجتمع بنو إسرائيل حوله، فأتمجد في عيني الرب ويكون إلهي قوتي:"]]}, {"l": "Isa 52:10", "n": "", "vs": [[10, "شمر الرب عن ذراع قدسه أمام عيون كل الأمم، فترى أقاصي الأرض خلاص إلهنا."]]}, {"l": "Zec 9:10", "n": "", "vs": [[10, "وأستأصل المركبات الحربية من أفرايم، والخيل من أورشليم، وتبيد أقواس القتال، ويشيع السلام بين الأمم، ويمتد ملكه من البحر إلى البحر، ومن نهر الفرات إلى أقاصي الأرض."]]}, {"l": "Luk 1:32", "n": "", "vs": [[32, "إنه يكون عظيما، وابن العلي يدعى، ويمنحه الرب الإله عرش داود أبيه،"]]}, {"l": "Rev 11:15", "n": "", "vs": [[15, "ونفخ الملاك السابع في بوقه فسمعت أصوات عالية في السماء تقول: «قد صار ملك العالم لربنا ومسيحه. إنه يملك إلى أبد الآبدين»."]]}], "kwAr": "عظمته", "noteAr": ""}], "arS": [["فيقوم", ["H5975"]], [" ", []], ["ويرعى", ["H7462"]], [" شعبه ", []], ["بقوة", ["H5797"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["وبجلال", ["H1347"]], [" ", []], ["اسم", ["H8034"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["إلهه", ["H430"]], ["، ", []], ["فيعيشون", ["H3427"]], [" بأمن، ", []], ["لأن", ["H3588"]], [" ", []], ["عظمته", ["H1431"]], [" تمتد ", []], ["إلى", ["H5704"]], [" ", []], ["أقاصي", ["H657"]], [" ", []], ["الأرض", ["H776"]], [".", []]]}, {"c": 5, "v": 5, "text": "ويصبح الرب سلامهم، إذ حين يزحف الأشوريون إلى أرضنا ويطأون ترابنا، فإننا نثير عليهم سبعة رعاة وثمانية أمراء من الناس،", "groups": [{"kw": "this", "raw": "Psa_72:7; Isa_9:6, Isa_9:7; Zec_9:10; Luk_2:14; Joh_14:27, Joh_16:33; Eph_2:14-17; Col_1:20,Col_1:21", "note": "", "refs": [{"l": "Psa 72:7", "n": "", "vs": [[7, "ليزدهر في أيامه الصديق، ويتوافر السلام مادام القمر يضيء."]]}, {"l": "Isa 9:6", "n": "", "vs": [[6, "لأنه يولد لنا ولد ويعطى لنا ابن يحمل الرياسة على كتفه، ويدعى اسمه عجيبا، مشيرا، إلها قديرا، أبا أبديا، رئيس السلام."]]}, {"l": "Isa 9:7", "n": "", "vs": [[7, "ولا تكون نهاية لنمو رياسته وللسلام اللذين يسودان عرش داود ومملكته، ليثبتها ويعضدها بالحق والبر، من الآن وإلى الأبد. إن غيرة الرب القدير تتمم هذا."]]}, {"l": "Zec 9:10", "n": "", "vs": [[10, "وأستأصل المركبات الحربية من أفرايم، والخيل من أورشليم، وتبيد أقواس القتال، ويشيع السلام بين الأمم، ويمتد ملكه من البحر إلى البحر، ومن نهر الفرات إلى أقاصي الأرض."]]}, {"l": "Luk 2:14", "n": "", "vs": [[14, "«المجد لله في الأعالي، وعلى الأرض السلام؛ وبالناس المسرة! »"]]}, {"l": "Joh 14:27", "n": "", "vs": [[27, "سلاما أترك لكم. سلامي أعطيكم. ليس كما يعطي العالم أعطيكم أنا. فلا تضطرب قلوبكم، ولا ترتعب."]]}, {"l": "Joh 16:33", "n": "", "vs": [[33, "أخبرتكم بهذا كله ليكون لكم في سلام. فإنكم في العالم ستقاسون الضيق. ولكن تشجعوا، فأنا قد انتصرت على العالم!»"]]}, {"l": "Eph 2:14-17", "n": "", "vs": [[14, "فإنه هو سلامنا، ذاك الذي جعل الفريقين واحدا وهدم حائط الحاجز الفاصل بينهما،"], [15, "أي العداء: إذ أبطل بجسده شريعة الوصايا ذات الفرائض، لكي يكون من الفريقين إنسانا واحدا جديدا، إذ أحل السلام بينهما،"], [16, "ولكي يصالحهما معا في جسد واحد مع الله بالصليب الذي به قتل العداء."], [17, "ثم جاء وبشركم بالسلام أنتم البعيدين، (كما بشر بالسلام) أولئك القريبين."]]}, {"l": "Col 1:20", "n": "", "vs": [[20, "وأن يصالح به كل شيء مع نفسه، إذ أحل السلام بدمه على الصليب، فبه يصالح كل شيء، سواء كان ما على الأرض أو ما في السماوات."]]}, {"l": "Col 1:21", "n": "", "vs": [[21, "وأنتم، يامن كنتم في الماضي أجانب وأعداء في الفكر، بأعمالكم الشريرة،"]]}], "kwAr": "ويصبح الرب سلامهم", "noteAr": ""}, {"kw": "when the", "raw": "Isa_7:14, Isa_8:7-10, Isa_37:31-36, Isa_65:8; Jer_33:15", "note": "", "refs": [{"l": "Isa 7:14", "n": "", "vs": [[14, "ولكن السيد نفسه يعطيكم آية: ها العذراء تحبل وتلد ابنا، وتدعو اسمه عمانوئيل."]]}, {"l": "Isa 8:7-10", "n": "", "vs": [[7, "فإن الرب مزمع أن يغرقهم بمياه النهر الفياضة، أي ملك أشور بكل جبروته، فيكون (كنهر الفرات) يطغى جيشانه على أقنيته ويفيض على ضفافه"], [8, "فيكتسح أرض يهوذا، ويطفو مرتفعا إلى الأعناق، وتنتشر جيوشه في عرض أرضك ياعمانوئيل»."], [9, "افعلوا ما شئتم أيها الشعوب وانهزموا. أصغي ياجميع أقاصي الأرض. تأهبوا للمعركة وانهزموا."], [10, "تشاوروا معا ولكن على غير طائل، ارسموا الخطط فلا تتحقق لأن الله معنا."]]}, {"l": "Isa 37:31-36", "n": "", "vs": [[31, "ويعود الناجون الباقون من بيت يهوذا فتتأصل جذورهم في الأرض ويزدهرون ويتكاثرون."], [32, "لأن من أورشليم تخرج بقية ومن جبل صهيون يأتي الناجون فغيرة الرب القدير تصنع هذا."], [33, "لذلك، فهذا ما يقوله الرب عن ملك أشور: «لن يدخل هذه المدينة ولن يطلق عليها سهما أو يتقدم نحوها بترس ولا يقيم عليها مقلاعا."], [34, "بل يرجع في الطريق الذي جاء منه ولن يدخل هذه المدينة، يقول الرب."], [35, "لأنني أدافع عنها وأنقذها من أجل نفسي وإكراما لداود عبدي»."], [36, "وحدث في تلك الليلة أن ملاك الرب قتل مئة وخمسة وثمانين ألفا من جيش الأشوريين، وما إن طلع الصباح حتى كانت جثث القتلى تملأ المكان"]]}, {"l": "Isa 65:8", "n": "", "vs": [[8, "ولكن هذا ما يقوله الرب: كما أن (الكرام) لا يطرح العنقود الفاسد إذ يقال له إن في عنبه بعض الخمر الطيب، كذلك لن أطر ح من أمامي كل إسرائيل لئلا أقضي على خدامي جميعا."]]}, {"l": "Jer 33:15", "n": "", "vs": [[15, "في تلك الأيام أنبت من نسل داود غصن بر يجري عدلا وبرا في الأرض."]]}], "kwAr": "حين يزحف", "noteAr": ""}, {"kw": "then", "raw": "Isa_44:28, Isa_59:19; Zec_1:18-21, Zec_9:13, Zec_10:3, Zec_12:6; Rev_17:14, Rev_19:14", "note": "", "refs": [{"l": "Isa 44:28", "n": "", "vs": [[28, "القائل عن كورش: هو راعي الذي يلبي كل رغباتي والقائل عن أورشليم: لابد أن تبنى وعن الهيكل: لابد أن يؤسس (من جديد)»."]]}, {"l": "Isa 59:19", "n": "", "vs": [[19, "فيتقون من المغرب اسم الرب، ومن المشرق يخشون مجد الرب، لأنه سيأتي العدو كنهر متدفق فتدفعه ريح الرب."]]}, {"l": "Zec 1:18-21", "n": "", "vs": [[18, "ثم رفعت نظري وإذا بي أرى أربعة قرون."], [19, "فقلت للملاك: «ما هذه؟» فأجاب: «هذه هي القرون التي بددت أهل يهوذا وإسرائيل وأورشليم»."], [20, "وأراني الرب أربعة صناع،"], [21, "فسألت: «ما الذي جاء يفعله هؤلاء الرجال؟» فأجاب: «هذه هي القرون (أي الأمم) التي بددت أهل يهوذا حتى ذلت كل نفس. أما هؤلاء الصناع فقد أقبلوا ليوقعوا الرعب في نفوس الأمم التي هاجمت أرض يهوذا ليطردوا أهلها»."]]}, {"l": "Zec 9:13", "n": "", "vs": [[13, "ها أنا أوتر يهوذا كقوس وأجعل أفرايم كسهم وأثير رجال صهيون على أبناء اليونان فتكونين كسيف جبار."]]}, {"l": "Zec 10:3", "n": "", "vs": [[3, "إن غضبي محتدم على الرعاة، وسأعاقب الرؤساء، لأن الرب القدير يعتني بقطيعه شعب يهوذا، ويجعلهم كفرس المزهو في القتال."]]}, {"l": "Zec 12:6", "n": "", "vs": [[6, "في ذلك اليوم أجعل عشائر يهوذا كمستوقد نار بين الحطب، أو كمشعل ملتهب بين أكداس الحنطة، فيلتهمون الشعوب من حولهم ممن عن يمينهم وعن يسارهم، بينما تظل أورشليم مستقرة آمنة آهلة في موضعها."]]}, {"l": "Rev 17:14", "n": "", "vs": [[14, "ثم يحاربون الحمل، ولكن الحمل يهزمهم، لأنه رب الأرباب وملك الملوك، والذين معه هم المدعوون، المختارون، المؤمنون»."]]}, {"l": "Rev 19:14", "n": "", "vs": [[14, "وكان الأجناد الذين في السماء يتبعونه راكبين خيولا بيضاء، ولابسين كتانا نقيا ناصع البياض،"]]}], "kwAr": "فإننا نثير", "noteAr": ""}, {"kw": "seven", "raw": "Job_5:19; Pro_6:16, Pro_30:18, Pro_30:29; Ecc_11:2; Amo_1:3, Amo_1:6", "note": "", "refs": [{"l": "Job 5:19", "n": "", "vs": [[19, "من ست بلايا ينجيك، وفي سبع لا يقع بك أذى."]]}, {"l": "Pro 6:16", "n": "", "vs": [[16, "ستة أمور يمقتها الرب، وسبعة مكروهة لديه:"]]}, {"l": "Pro 30:18", "n": "", "vs": [[18, "ثلاثة أشياء أعجب من أن أستوعبها، وأربعة لا أعرفها:"]]}, {"l": "Pro 30:29", "n": "", "vs": [[29, "ثلاثة جليلة في خطوها، وأربعة وقور في تحركها:"]]}, {"l": "Ecc 11:2", "n": "", "vs": [[2, "وزع أنصبة على سبعة بل على ثمانية، لأنك لا تدري أية بلية تحل على الأرض."]]}, {"l": "Amo 1:3", "n": "", "vs": [[3, "هذا ما يقوله الرب: من أجل معاصي دمشق الثلاث والأربع لن أرد عنها سخطي، لأن أهلها قد داسوا شعبي في جلعاد بنوارج من حديد."]]}, {"l": "Amo 1:6", "n": "", "vs": [[6, "هذا ما يقوله الرب: من أجل معاصي غزة الثلاث والأربع لن أرد عنها سخطي، لأن أهلها نفوا شعبا عن آخره ليسلموه إلى أدوم."]]}], "kwAr": "سبعة رعاة", "noteAr": ""}, {"kw": "principal men", "raw": "Heb. princes of men", "note": "Heb. princes of men", "refs": [], "kwAr": "أمراء من الناس", "noteAr": "بالعبرية: «رؤساء الناس»."}], "arS": [["ويصبح", ["H2088", "H1961"]], [" الرب ", []], ["سلامهم", ["H7965"]], ["، إذ ", []], ["حين", ["H3588"]], [" ", []], ["يزحف", ["H935"]], [" ", []], ["الأشوريون", ["H804"]], [" إلى ", []], ["أرضنا", ["H776"]], [" ", []], ["ويطأون", ["H3588", "H1869"]], [" ", []], ["ترابنا", ["H759"]], ["، فإننا ", []], ["نثير", ["H6965"]], [" ", []], ["عليهم", ["H5921"]], [" ", []], ["سبعة", ["H7651"]], [" ", []], ["رعاة", ["H7462"]], [" ", []], ["وثمانية", ["H8083"]], [" ", []], ["أمراء", ["H5257"]], [" من ", []], ["الناس", ["H120"]], ["،", []]]}, {"c": 5, "v": 6, "text": "فيحكمون بلاد أشور بقوة السيف، ويقتحمون بوابات أرض نمرود، وينقذنا ( الله ) من الأشوريين عندما يزحفون إلى أرضنا ويطأون تخومنا.", "groups": [{"kw": "they", "raw": "Isa_14:2, Isa_33:1; Nah_2:11-13, Nah_3:1-3", "note": "", "refs": [{"l": "Isa 14:2", "n": "", "vs": [[2, "وتمد شعوب الأرض إليهم يد العون ليساعدوا إسرائيل على العودة لدياره. ويصيرون عبيدا لبني إسرائيل، في أرض الرب، ويتسلطون على آسريهم وظالميهم."]]}, {"l": "Isa 33:1", "n": "", "vs": [[1, "ويل لك أيها المدمر الذي لم تدمر بعد، والناهب الذي لم ينهبوك، فعندما تكف عن التدمير تدمر، وحين تمتنع عن النهب ينهبونك."]]}, {"l": "Nah 2:11-13", "n": "", "vs": [[11, "أين نينوى عرين الأسود ومرتع الأشبال حيث يسرح الأسد واللبوءة والأشبال من غير إزعاج؟"], [12, "قد افترس الأسد ما يكفي لإعالة أشباله وخنق فريسة للبوءاته. قد ملأ عرينه بقنائصه وكهفه بأشلائهم."], [13, "ها أنا أقاومك. يقول الرب القدير. فأحرق مركباتك فتصبح دخانا، ويلتهم السيف لحوم أبنائك، وأستأصل من الأرض غنائمك ولن يتردد في ما بعد صوت مندوبيك."]]}, {"l": "Nah 3:1-3", "n": "", "vs": [[1, "ويل للمدينة السافكة الدماء الممتلئة كذبا، المكتظة بالغنائم المنهوبة، التي لا تخلو أبدا من الضحايا."], [2, "ها فرقعة السياط وقعقعة العجلاتِ وجلبة حوافر الخيول وصلصلة المركبات."], [3, "وفرسان واثبة، وسيوف لامعة ورماح بارقة وكثرة قتلى وأكوام جثث لا نهاية لها، بها يتعثرون."]]}], "kwAr": "فيحكمون", "noteAr": ""}, {"kw": "waste", "raw": "Heb. eat up", "note": "Heb. eat up", "refs": [], "kwAr": "ويقتحمون", "noteAr": "بالعبرية: «يأكلون»."}, {"kw": "the land of Nimrod", "raw": "Gen_10:9-11 *marg.", "note": "", "refs": [{"l": "Gen 10:9-11", "n": "*marg.", "vs": [[9, "كان صيادا عاتيا أمام الرب، لذلك يقال: «كنمرود جبار صيد أمام الرب»."], [10, "وقد تكونت مملكته أول الأمر من بابل وأرك وأكد وكلنة في أرض شنعار."], [11, "ومن تلك الأرض خرج أشور وبنى مدن نينوى ورحبوت عير وكالح،"]]}], "kwAr": "أرض نمرود", "noteAr": ""}, {"kw": "in the entrances thereof", "raw": "or, with her own naked swords, thus. Isa_14:25; Luk_1:71, Luk_1:74", "note": "or, with her own naked swords, thus. Isa_14:25; Luk_1:71, Luk_1:74", "refs": [{"l": "Isa 14:25", "n": "", "vs": [[25, "أن أحطم أشور في أرضي وأطأه على جبالي، فيلقي عنهم نيره، ويزول عن كاهلهم حمله."]]}, {"l": "Luk 1:71", "n": "", "vs": [[71, "خلاص من أعدائنا ومن أيدي جميع مبغضينا،"]]}, {"l": "Luk 1:74", "n": "", "vs": [[74, "بعد تخليصنا من أيدي أعدائنا، أن نعبده بلا خوف،"]]}], "kwAr": "بوابات", "noteAr": "أو: «بسيوفها العارية»، هكذا. انظر إش 14: 25؛ لو 1: 71، 74"}, {"kw": "the Assyrian", "raw": "2Ki_15:29, 2Ki_17:3-5, 2Ki_18:9-15, 2Ki_19:32-35; 2Ch_33:11; Isa_10:5-12", "note": "", "refs": [{"l": "2Ki 15:29", "n": "", "vs": [[29, "وفي أيامه هاجم تغلث فلاسر ملك أشور البلاد، واستولى على مدن عيون، وآبل بيت معكة، ويانوح، وقادش، وحاصور، وجلعاد والجليل، وكل أرض نفتالي وسبى أهلها إلى أشور."]]}, {"l": "2Ki 17:3-5", "n": "", "vs": [[3, "وزحف عليه شلمنأسر ملك أشور فصار هوشع له تابعا يدفع له جزية."], [4, "ومالبث أن اكتشف ملك أشور خيانة هوشع، الذي أرسل وفدا يستغيث بسوا ملك مصر، ولم يؤد جزية لملك أشور كعهده في كل سنة، فقبض عليه ملك أشور وزجه موثقا في السجن."], [5, "واجتاح ملك أشور أرض إسرائيل، وحاصر السامرة ثلاث سنوات."]]}, {"l": "2Ki 18:9-15", "n": "", "vs": [[9, "وفي السنة الرابعة لحكم الملك حزقيا، الموافقة للسنة السابعة لاعتلاء هوشع بن أيلة عرش إسرائيل، زحف شلمنأسر ملك أشور على السامرة وحاصرها،"], [10, "وتمكن من الاستيلاء عليها في نهاية ثلاث سنوات، أي في السنة السادسة لملك حزقيا، الموافقة للسنة التاسعة لحكم هوشع ملك إسرائيل."], [11, "وسبى ملك أشور سكان إسرائيل إلى أشور، وأسكنهم في مدينة حلح وعلى ضفاف نهر خابور في منطقة جوزان وفي مدن مادي،"], [12, "لأنهم أبوا الاستماع لصوت الرب إلههم، ونكثوا عهده وكل ما أمر به موسى عبد الرب، ولم يعملوا بها."], [13, "وفي السنة الرابعة عشرة من حكم الملك حزقيا اجتاح سنحاريب ملك أشور جميع مدن يهوذا الحصينة واستولى عليها."], [14, "وأرسل حزقيا ملك يهوذا يقول لملك أشور في لخيش: «أخطأت، فارتحل عني، وأنا أدفع ما تفرضه علي من جزية». ففرض ملك أشور على حزقيا ملك يهوذا ثلاث مئة وزنة (نحو ألف وثمانين كيلوجراما من الفضة)، وثلاثين وزنة (نحو مائة وثمانية كيلوجرامات من الذهب)."], [15, "فجمع حزقيا كل ما في بيت الرب وخزائن قصر الملك من فضة وذهب ودفعها له."]]}, {"l": "2Ki 19:32-35", "n": "", "vs": [[32, "لذلك فهذا ما يقوله الرب عن ملك أشور: لن يدخل هذه المدينة ولن يطلق عليها سهما أو يتقدم نحوها بترس ولن يقيم عليها مقلاعا."], [33, "بل يرجع في الطريق الذي جاء منه، ولن يدخل هذه المدينة، يقول الرب."], [34, "لأنني أدافع عنها، وأنقذها من أجل نفسي، وإكراما لداود عبدي»."], [35, "وحدث في تلك الليلة أن ملاك الرب قتل مئة وخمسة وثمانين ألفا من جيش الأشوريين، فما إن طلع الصباح حتى كانت الجثث الميتة تملأ المكان."]]}, {"l": "2Ch 33:11", "n": "", "vs": [[11, "لهذا أرسل الرب عليهم قادة جند ملك أشور، فقبضوا على منسى ووضعوا خزامة في أنفه، وقادوه مغلولا بسلاسل نحاس إلى بابل."]]}, {"l": "Isa 10:5-12", "n": "", "vs": [[5, "ويل للأشوريين، قضيب غضبي، الحاملين في أيديهم عصا سخطي."], [6, "أرسلهم ضد أمة منافقة، وأوصيهم على شعبي الذي غضبت عليه، ليغنموا غنائمهم ويستولوا على أسلابهم، ويطأوهم كما يطأون الوحل."], [7, "ولكن ملك أشور لا يعرف أنني أنا الذي أرسلته، ويظن أنه بقدرته قد هاجم شعبي، وفي نيته أن يدمر ويجتاح أمما كثيرة."], [8, "لأنه يقول: أليس كل قوادي ملوكا؟"], [9, "أليس مصير كلنو كمصير كركميش؟ أو ليس مآل حماة كمآل أرفاد؟ أليست السامرة كدمشق؟"], [10, "لقد قضيت على ممالك وثنية أصنامها أعظم من أصنام أورشليم والسامرة!"], [11, "أفلا أقضي على أورشليم وأصنامها كما قضيت على السامرة وأصنامها؟"], [12, "ولكن حالما ينتهي الرب من عمله بجبل صهيون، فإنه سيعاقب ملك أشور على غرور قلبه وتشامخ عينيه،"]]}], "kwAr": "الأشوريين", "noteAr": ""}], "arS": [["فيحكمون", ["H7489"]], [" ", []], ["بلاد", ["H776"]], [" ", []], ["أشور", ["H804"]], [" بقوة ", []], ["السيف", ["H2719"]], ["، ويقتحمون ", []], ["بوابات", ["H6607"]], [" ", []], ["أرض", ["H776"]], [" ", []], ["نمرود", ["H5248"]], ["، ", []], ["وينقذنا", ["H5337"]], [" ( الله ) ", []], ["من", ["H4480"]], [" ", []], ["الأشوريين", ["H804"]], [" ", []], ["عندما", ["H3588"]], [" ", []], ["يزحفون", ["H935"]], [" إلى ", []], ["أرضنا", ["H776"]], [" ", []], ["ويطأون", ["H1869"]], [" ", []], ["تخومنا", ["H1366"]], [".", []]]}, {"c": 5, "v": 7, "text": "عندئذ تغدو بقية ذرية يعقوب بين الأمم الكثيرة كندى من لدن الرب، كالمطر الوابل على العشب الذي لا يتوانى من أجل الناس أو يرجو أبناء البشر.", "groups": [{"kw": "the remnant", "raw": "Mic_5:3, Mic_5:8; Eze_14:22; Joe_2:32; Amo_5:15; Zep_3:13; Rom_11:5, Rom_11:6", "note": "", "refs": [{"l": "Mic 5:3", "n": "", "vs": [[3, "لذلك يسلم الرب شعبه إلى أعدائهم إلى أن تلد من تقاسي من المخاض، عندئذ ترجع بقية إخوته من السبي إلى شعب إسرائيل."]]}, {"l": "Mic 5:8", "n": "", "vs": [[8, "وتكون بقية ذرية يعقوب بين الشعوب الكثيرة كأسد بين وحوش الغابة، أو كشبل بين قطعان الغنم، الذي إن اقتحم يدوس ويفترس وليس من منقذ."]]}, {"l": "Eze 14:22", "n": "", "vs": [[22, "ولكن ستبقى فيها بقية ناجية من أبناء وبنات، يخرجون منها، فيقبلون إليكم فتشهدون حسن سلوكهم وتصرفاتهم فتتعزون عن المصائب التي أوقعتها بأورشليم وعن جميع ما ابتليتها به."]]}, {"l": "Joe 2:32", "n": "", "vs": [[32, "إنما كل من يدعو باسم الرب يخلص، لأن النجاة تكون في جبل صهيون وفي أورشليم، كما قال الرب، إذ يكون بين الناجين من يدعوه الرب."]]}, {"l": "Amo 5:15", "n": "", "vs": [[15, "امقتوا الشر وأحبوا الخير وأقيموا العدل في ساحة القضاء، لعل الرب الإله القدير يترفق على بقية بيت يوسف."]]}, {"l": "Zep 3:13", "n": "", "vs": [[13, "ولن يرتكب بقية إسرائيل الإثم، ولا ينطقون بالكذب، وليس في أفواههم غش، بل يعيشون آمنين من غير أن يهددهم أحد."]]}, {"l": "Rom 11:5", "n": "", "vs": [[5, "فكذلك، في الزمان الحاضر، ماتزال بقية اختارها الله بالنعمة."]]}, {"l": "Rom 11:6", "n": "", "vs": [[6, "ولكن، بما أن ذلك قد تم بالنعمة، فليس بعد على أساس الأعمال، وإلا فليست النعمة نعمة بعد."]]}], "kwAr": "بقية ذرية يعقوب", "noteAr": ""}, {"kw": "as a dew", "raw": "Deu_32:2; Jdg_6:36; Psa_72:6, Psa_110:3; Isa_32:15, Isa_44:3, Isa_66:19; Eze_47:1; Hos_6:3, Hos_14:5; Zec_14:8; Mat_28:19; Act_9:15, Act_11:15, Act_13:46; Rom_11:12, Rom_15:19, Rom_15:20; 1Co_3:6", "note": "", "refs": [{"l": "Deu 32:2", "n": "", "vs": [[2, "لينهمر تعليمي كالمطر، وليقطر كلامي، فيكون كالطل على الكلإ وكالغيث على العشب."]]}, {"l": "Jdg 6:36", "n": "", "vs": [[36, "وقال جدعون لله: «إن كنت حقا ستنقذ إسرائيل على يدي كما وعدت (فأعطني علامة على ذلك):"]]}, {"l": "Psa 72:6", "n": "", "vs": [[6, "ليكن الملك كالمطر المنهمر على المراعي المجزوزة، كالغيوث التي تسقي الأرض."]]}, {"l": "Psa 110:3", "n": "", "vs": [[3, "في يوم محاربة أعدائك يتطوع شعبك. يجيء شبابك إلى التلال المقدسة كالندى في قلب الفجر."]]}, {"l": "Isa 32:15", "n": "", "vs": [[15, "حتى تنسكب علينا روح من السماء، فتتحول البرية إلى مرج مخصب، ويحسب المرج غابة."]]}, {"l": "Isa 44:3", "n": "", "vs": [[3, "لأني سأسكب ماء على الأرض الظمأى، وأجري السيول على التربة اليابسة، وأفيض بروحي على ذريتك، وبركاتي على نسلك."]]}, {"l": "Isa 66:19", "n": "", "vs": [[19, "وأجعل بينهم آية وأبعث بعض الناجين منهم إلى الأمم: إلى ترشيش، وفول، ولود، المهرة في رمي السهام، وإلى توبال وياوان وإلى الجزائر البعيدة ممن لم يسمعوا بشهرتي أو يروا مجدي، فيذيعون مجدي بين الأمم."]]}, {"l": "Eze 47:1", "n": "", "vs": [[1, "ثم أرجعني إلى مدخل الهيكل، وإذا بمياه تتدفق من تحت عتبته نحو الشرق، لأن واجهة الهيكل كانت نحو الشرق. وكانت المياه جارية من تحت، من أسفل الطرف الأيمن لعتبة الهيكل جنوبي المذبح."]]}, {"l": "Hos 6:3", "n": "", "vs": [[3, "لنعرف، بل لنجد حتى نعرف الرب، فمجيئه يقين كالفجر، يقبل إلينا كإقبال المطر وكغيوث الربيع التي تروي الأرض»."]]}, {"l": "Hos 14:5", "n": "", "vs": [[5, "وأكون كالطل لإسرائيل، فيزهر كالسوسن، وتتأصل جذوره كأرز لبنان."]]}, {"l": "Zec 14:8", "n": "", "vs": [[8, "في ذلك اليوم تجري مياه حية من أورشليم، يصب نصفها في البحر الشرقي (البحر الميت)، ونصفها الآخر في البحر الغربي (البحر الأبيض المتوسط) طوال الصيف والشتاء."]]}, {"l": "Mat 28:19", "n": "", "vs": [[19, "فاذهبوا إذن، وتلمذوا جميع الأمم، وعمدوهم باسم الآب والابن والروح القدس؛"]]}, {"l": "Act 9:15", "n": "", "vs": [[15, "فأمره الرب: «اذهب! فقد اخترت هذا الرجل ليكون إناء يحمل اسمي إلى الأمم والملوك وبني إسرائيل."]]}, {"l": "Act 11:15", "n": "", "vs": [[15, "ولما ابتدأت أتكلم، حل الروح القدس عليهم كما حل علينا في البداية"]]}, {"l": "Act 13:46", "n": "", "vs": [[46, "فخاطبهم بولس وبرنابا بجرأة قائلين: «كان يجب أن نبلغكم أنتم أولا كلمة الله، ولكنكم رفضتموها فأظهرتم أنكم لا تستحقون الحياة الأبدية. وها نحن نتوجه إلى غير اليهود!"]]}, {"l": "Rom 11:12", "n": "", "vs": [[12, "فإذا كانت سقطتهم غنى للعالم، وخسارتهم غنى للأمم، فكم بالأحرى يكون اكتمالهم...؟"]]}, {"l": "Rom 15:19", "n": "", "vs": [[19, "وبقوة الآيات والعجائب، وبقوة روح الله. حتى إنني، من أورشليم وما حولها حتى مقاطعة إليريكون، قد أكملت التبشير بإنجيل المسيح."]]}, {"l": "Rom 15:20", "n": "", "vs": [[20, "وكنت حريصا على التبشير حيث لم يكن قد عرف اسم المسيح، لكي لا أبني على أساس وضعه غيري،"]]}, {"l": "1Co 3:6", "n": "", "vs": [[6, "أنا غرست وأبلوس سقى؛ ولكن الله أنمى."]]}], "kwAr": "كندى", "noteAr": ""}, {"kw": "tarrieth", "raw": "Isa_55:10; Jer_14:22; Act_16:9; Rom_9:30, Rom_10:20", "note": "", "refs": [{"l": "Isa 55:10", "n": "", "vs": [[10, "وكما تهطل الأمطار وينهمر الثلج من السماء، ولا ترجع إلى هناك، بل تروي الحقول والأشجار، وتجعل البذور تنبت وتنمو وتثمر زرعا للفلاح وخبزا للجياع،"]]}, {"l": "Jer 14:22", "n": "", "vs": [[22, "هل بين أصنام الأمم الباطلة من يمطر؟ أو هل تسكب السموات بنفسها وابل الغيث؟ ألست أنت الرب إلهنا؟ إننا إياك نرجو لأنك أنت صنعت هذه جميعها."]]}, {"l": "Act 16:9", "n": "", "vs": [[9, "وفي تلك الليلة رأى بولس في رؤيا رجلا من أهل مقدونية يتوسل إليه ويقول: «اعبر إلى مقدونية وأنجدنا!»"]]}, {"l": "Rom 9:30", "n": "", "vs": [[30, "فما هي خلاصة القول؟ إن الأمم الذين لم يكونوا يسعون وراء البر، قد بلغوا البر، ولكنه البر القائم على أساس الإيمان."]]}, {"l": "Rom 10:20", "n": "", "vs": [[20, "وأما إشعياء فيجرؤ على القول: «وجدني الذين لم يطلبوني وصرت معلنا للذين لم يبحثوا عني»."]]}], "kwAr": "لا يتوانى", "noteAr": ""}], "arS": [["عندئذ ", []], ["تغدو", ["H1961"]], [" ", []], ["بقية", ["H7611"]], [" ذرية ", []], ["يعقوب", ["H3290"]], [" ", []], ["بين", ["H7130"]], [" ", []], ["الأمم", ["H5971"]], [" ", []], ["الكثيرة", ["H7227"]], [" ", []], ["كندى", ["H2919"]], [" ", []], ["من", ["H4480"]], [" ", []], ["لدن", ["H854"]], [" ", []], ["الرب", ["H3068"]], ["، ", []], ["كالمطر", ["H7241"]], [" الوابل ", []], ["على", ["H5921"]], [" ", []], ["العشب", ["H6212"]], [" ", []], ["الذي", ["H834"]], [" ", []], ["لا", ["H3808"]], [" ", []], ["يتوانى", ["H6960"]], [" من أجل ", []], ["الناس", ["H376"]], [" ", []], ["أو", ["H3808"]], [" ", []], ["يرجو", ["H3176"]], [" ", []], ["أبناء", ["H1121"]], [" ", []], ["البشر", ["H120"]], [".", []]]}, {"c": 5, "v": 8, "text": "وتكون بقية ذرية يعقوب بين الشعوب الكثيرة كأسد بين وحوش الغابة، أو كشبل بين قطعان الغنم، الذي إن اقتحم يدوس ويفترس وليس من منقذ.", "groups": [{"kw": "as a lion", "raw": "Mic_4:13; Psa_2:8-12, Psa_110:5, Psa_110:6; Isa_41:15, Isa_41:16; Oba_1:18, Oba_1:19; Zec_9:15, Zec_10:5; Zec_12:3; Mat_10:14; Act_18:6; 2Co_2:15-17", "note": "", "refs": [{"l": "Mic 4:13", "n": "", "vs": [[13, "فانهضي ياابنة صهيون وادرسي أعداءك، لأني سأجعل لك قرنا من حديد وأظلافا من نحاس فتسحقين أمما كثيرة، وتكرسين كل ما تغنمينه منهم للرب، وتقدمين ثروتهم لسيد الأرض كلها."]]}, {"l": "Psa 2:8-12", "n": "", "vs": [[8, "اطلب مني فأعطيك الأمم ميراثا، وأقاصي الأرض ملكا لك."], [9, "فتكسرهم بقضيب من حديد، وتحطمهم كآنية الفخار»."], [10, "والآن تعقلوا أيها الملوك، واحذروا ياحكام الأرض."], [11, "اعبدوا الرب بخوف، وابتهجوا برعدة."], [12, "قبلوا الابن لئلا يغضب، فتهلكوا في الطريق، لئلا يتوهج غضبه سريعا. طوبى لجميع المتكلين عليه."]]}, {"l": "Psa 110:5", "n": "", "vs": [[5, "الرب واقف عن يمينك. في يوم غضبه يحطم ملوكا."]]}, {"l": "Psa 110:6", "n": "", "vs": [[6, "يقضي بين الأمم، فيملأ الأرض الرحبة بجثث رؤسائها."]]}, {"l": "Isa 41:15", "n": "", "vs": [[15, "وها أنا أجعلك نورجا محددا جديدا مسننا، فتدرس الجبال وتجعل التلال كالعصافة،"]]}, {"l": "Isa 41:16", "n": "", "vs": [[16, "فتذريها، وتحملها الريح بعيدا، وتبددها الزوبعة. أما أنت فتبتهج بالرب وتمجد قدوس إسرائيل."]]}, {"l": "Oba 1:18", "n": "", "vs": [[18, "ويصير بيت يعقوب نارا، وبيت يوسف لهيبا، وبيت عيسو قشا فيوقدونهم ويلتهمونهم، ولا يفلت من بيت عيسو أحد، يقول الرب."]]}, {"l": "Oba 1:19", "n": "", "vs": [[19, "ويرث أهل النقب جبل عيسو، وسكان السه
