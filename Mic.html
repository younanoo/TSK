29, "من جلبة الفارس ورامي السهام يهرب أهل المدن، ويوغلون في الغابات ويتسلقون الصخور. قد أصبحت المدن جميعها مهجورة لا يقيم فيها إنسان."]]}], "kwAr": "شدوا", "noteAr": ""}, {"kw": "she", "raw": "Exo_32:21; 1Ki_13:33, 1Ki_13:34, 1Ki_14:16, 1Ki_16:31; Rev_2:14, Rev_2:20, Rev_18:1-5", "note": "", "refs": [{"l": "Exo 32:21", "n": "", "vs": [[21, "وخاطب موسى هرون: «ماذا فعل بك هذا الشعب حتى جلبت عليه هذه الخطيئة العظيمة؟»"]]}, {"l": "1Ki 13:33", "n": "", "vs": [[33, "وعلى الرغم من تحذير النبي فإن يربعام لم يحد عن طريقه الأثيمة، بل عاد مرة أخرى فكرس كهنة لمعابد المرتفعات، اختارهم من عامة الشعب، فكان يكرس كل من يرغب أن يكون كاهنا لهذه المرتفعات."]]}, {"l": "1Ki 13:34", "n": "", "vs": [[34, "فكانت هذه هي خطيئة بيت يربعام التي أفضت إلى سقوطه وانقراضه عن وجه الأرض."]]}, {"l": "1Ki 14:16", "n": "", "vs": [[16, "وينبذ إسرائيل من جراء خطايا يربعام التي ارتكبها واستغوى إسرائيل معه فأخطأوا»."]]}, {"l": "1Ki 16:31", "n": "", "vs": [[31, "وكأنما كان الانهماك في ارتكاب خطايا يربعام بن نباط أمرا تافها، فتزوج من إيزابل ابنة أثبعل ملك الصيدونيين، وغوى وراء البعل وسجد له."]]}, {"l": "Rev 2:14", "n": "", "vs": [[14, "ولكني عاتب عليك قليلا لأنك تتسامح مع القوم الذين يتمسكون بتعليم بلعام عندما علم الملك بالاق أن يدمر بني إسرائيل بتوريطهم في ارتكاب الزنى والأكل من الذبائح المقدمة للأصنام،"]]}, {"l": "Rev 2:20", "n": "", "vs": [[20, "ولكن لي عليك أنك تتساهل مع هذه المرأة إيزابل، التي تدعي أنها نبية، فتعلم عبيدي وتغويهم أن يزنوا ويأكلوا من الذبائح المقدمة للأصنام."]]}, {"l": "Rev 18:1-5", "n": "", "vs": [[1, "بعد هذا رأيت ملاكا آخر نازلا من السماء، له سلطان عظيم، أضاء بهاؤه الأرض."], [2, "وصاح بأعلى صوته: «سقطت، سقطت بابل العظمى، وصارت وكرا للشياطين ومأوى لكل روح نجس ولكل طائر نجس مكروه،"], [3, "لأن جميع الأمم شربت من خمر زناها، وملوك الأرض زنوا معها، وتجار الأرض اغتنوا من كثرة ترفها!»"], [4, "ثم سمعت صوتا آخر ينادي من السماء: «اخرجوا منها ياشعبي، لئلا تشتركوا في خطاياها، فتصابوا ببلاياها،"], [5, "فقد تراكمت خطاياها حتى بلغت السماء، وتذكر الله ما ارتكبته من آثام!"]]}], "kwAr": "أول من ارتكب الخطيئة", "noteAr": ""}, {"kw": "for", "raw": "2Ki_8:18, 2Ki_16:3, 2Ki_16:4; Jer_3:8; Eze_23:11", "note": "", "refs": [{"l": "2Ki 8:18", "n": "", "vs": [[18, "وسلك في طريق ملوك إسرائيل، على غرار بيت أخآب، لأنه كان متزوجا من بنت أخآب وارتكب الشر في عيني الرب."]]}, {"l": "2Ki 16:3", "n": "", "vs": [[3, "متمثلا بملوك إسرائيل، حتى إنه أجاز ابنه في النار، وفقا لأرجاس الأمم الذين طردهم الرب من أمام بني إسرائيل."]]}, {"l": "2Ki 16:4", "n": "", "vs": [[4, "وذبح وأوقد للأوثان على المرتفعات وعلى التلال وتحت كل شجرة خضراء."]]}, {"l": "Jer 3:8", "n": "", "vs": [[8, "ورأت أني أرسلت كتاب طلاق إلى الغادرة إسرائيل لعهرها فلم تفزع أختها الخائنة يهوذا بل مضت هي أيضا وزنت (أي عبدت الأوثان)."]]}, {"l": "Eze 23:11", "n": "", "vs": [[11, "ومع أن أختها أهوليبة شهدت هذا، فإنها أوغلت أكثر منها في عشقها وزناها،"]]}], "kwAr": "لأنكم", "noteAr": ""}], "arS": [["شدوا", ["H7573"]], [" ", []], ["الخيل", ["H7409"]], [" إلى ", []], ["المركبات", ["H4818"]], [" ", []], ["ياسكان", ["H3427"]], [" ", []], ["لاخيش", ["H3923"]], ["، ", []], ["لأنكم", ["H3588"]], [" كنتم ", []], ["أول", ["H7225"]], [" من ارتكب ", []], ["الخطيئة", ["H2403"]], [" بين ", []], ["مدن", ["H1323"]], [" ", []], ["صهيون", ["H6726"]], ["، ", []], ["وفيكم", ["H1931"]], [" قد ", []], ["وجدت", ["H4672"]], [" ", []], ["آثام", ["H6588"]], [" ", []], ["إسرائيل", ["H3478"]], [".", []]]}, {"c": 1, "v": 14, "text": "لهذا تحملون هدايا وداع إلى مورشة جت، وتصبح مدينة أكزيب خدعة لملوك إسرائيل.", "groups": [{"kw": "give", "raw": "2Sa_8:2; 2Ki_16:8, 2Ki_18:14-16; 2Ch_16:1-3; Isa_30:6", "note": "", "refs": [{"l": "2Sa 8:2", "n": "", "vs": [[2, "وقهر أيضا الموآبيين وجعلهم يرقدون على الأرض في صفوف متراصة، وقاسهم بالحبل. فكان يقتل صفين ويستبقي صفا. فأصبح الموآبيون عبيدا لداود يدفعون له الجزية."]]}, {"l": "2Ki 16:8", "n": "", "vs": [[8, "وجمع آحاز الفضة والذهب الموجودة في هيكل الرب وفي خزائن قصر الملك، وأرسلها إلى ملك أشور هدية."]]}, {"l": "2Ki 18:14-16", "n": "", "vs": [[14, "وأرسل حزقيا ملك يهوذا يقول لملك أشور في لخيش: «أخطأت، فارتحل عني، وأنا أدفع ما تفرضه علي من جزية». ففرض ملك أشور على حزقيا ملك يهوذا ثلاث مئة وزنة (نحو ألف وثمانين كيلوجراما من الفضة)، وثلاثين وزنة (نحو مائة وثمانية كيلوجرامات من الذهب)."], [15, "فجمع حزقيا كل ما في بيت الرب وخزائن قصر الملك من فضة وذهب ودفعها له."], [16, "كما قشر الذهب الذي كان قد غشى به أبواب هيكل الرب والدعائم، وبعث به إلى ملك أشور."]]}, {"l": "2Ch 16:1-3", "n": "", "vs": [[1, "وفي السنة السادسة والثلاثين لحكم آسا زحف بعشا ملك إسرائيل على يهوذا، وبنى الرامة لقطع الطريق على الخارجين والداخلين إلى آسا ملك يهوذا."], [2, "فجمع آسا فضة وذهبا من خزائن هيكل الرب وقصر الملك، وأرسلها إلى بنهدد ملك أرام المقيم في دمشق قائلا:"], [3, "«إن بيني وبينك وبين أبي وأبيك عهدا، وها أنا باعث إليك فضة وذهبا. فهيا انكث عهدك مع بعشا ملك إسرائيل فيكف عني»"]]}, {"l": "Isa 30:6", "n": "", "vs": [[6, "نبؤة بشأن وحوش النقب: عبر أرض العناء والأهوال حيث تعيش الأسود والأفاعي، تحمل قوافلهم أموالهم على ظهور حميرهم، وكنوزهم على أسنمة جمالهم إلى مصر التي لا رجاء فيها."]]}], "kwAr": "تحملون", "noteAr": ""}, {"kw": "to", "raw": "or, for", "note": "or, for", "refs": [], "kwAr": "إلى مورشة", "noteAr": "أو: «لأجل»."}, {"kw": "houses", "raw": "Psa_62:9, Psa_118:8, Psa_118:9, Psa_146:3, Psa_146:4", "note": "", "refs": [{"l": "Psa 62:9", "n": "", "vs": [[9, "ليس البشر جميعا، عظماء وأدنياء، سوى باطل ووهم. إن وضعتهم في كفة ميزان لا يزنون شيئا. إنهم أخف من نسمة."]]}, {"l": "Psa 118:8", "n": "", "vs": [[8, "اللجوء إلى الرب خير من الاعتماد على البشر."]]}, {"l": "Psa 118:9", "n": "", "vs": [[9, "اللجوء إلى الرب خير من الاعتماد على العظماء."]]}, {"l": "Psa 146:3", "n": "", "vs": [[3, "لا تتوكلوا على الرؤساء، ولا على ابن آدم الذي لا يستطيع أن يخلصكم."]]}, {"l": "Psa 146:4", "n": "", "vs": [[4, "تنطلق روحه منه فيعود إلى ترابه، وآنئذ تندثر تدابيره."]]}], "kwAr": "مدينة", "noteAr": ""}, {"kw": "Achzib", "raw": "that is, a lie, Jos_15:44", "note": "that is, a lie, Jos_15:44", "refs": [{"l": "Jos 15:44", "n": "", "vs": [[44, "وقعيلة وأكزيب ومريشة. وهي في جملتها تسع مدن مع ضياعها."]]}], "kwAr": "أكزيب", "noteAr": "أي «كذب». انظر يش 15: 44"}], "arS": [["لهذا", ["H3651"]], [" ", []], ["تحملون", ["H5414"]], [" ", []], ["هدايا", ["H7964"]], [" وداع ", []], ["إلى", ["H5921"]], [" ", []], ["مورشة جت", ["H4182"]], ["، وتصبح ", []], ["مدينة", ["H1004"]], [" ", []], ["أكزيب", ["H392"]], [" ", []], ["خدعة", ["H391"]], [" ", []], ["لملوك", ["H4428"]], [" ", []], ["إسرائيل", ["H3478"]], [".", []]]}, {"c": 1, "v": 15, "text": "وأبعث إليكم بقاهر ياأهل مريشة، فيهرب من أمامه نبلاء إسرائيل إلى مغارة عدلام.", "groups": [{"kw": "will", "raw": "Isa_7:17-25, Isa_10:5, Isa_10:6; Jer_49:1", "note": "", "refs": [{"l": "Isa 7:17-25", "n": "", "vs": [[17, "وسيجلب الرب عليك وعلى شعبك وعلى بيت أبيك أياما لم تمر بكم منذ انفصال أفرايم عن يهوذا، وذلك على يد ملك أشور."], [18, "في ذلك اليوم يصفر الرب للمصريين فيجيئون عليكم من كل أنهار مصر، وللأشوريين فيجيئون عليكم كأسراب النحل،"], [19, "فتقبل كلها وتنتشر في الأودية المقفرة، وفي شقوق الصخور وشجيرات الشوك المتكاثفة، وفي المراعي قاطبة."], [20, "في ذلك اليوم يستأجر الرب ملك أشور من عبر نهر الفرات، فيكون الموسى التي يحلق بها الرب شعر رؤوسكم وأرجلكم، وحتى لحاكم أيضا."], [21, "في ذلك اليوم يربي واحد عجلة بقر وشاتين."], [22, "ولوفرة ما تدر من حليب يأكل الزبد، لأن الزبد والعسل يأكلهما كل من يستبقى في الأرض."], [23, "في ذلك اليوم يصير كل موضع كان فيه ألف جفنة بألف شاقل (نحو اثني عشر كيلو جراما) من الفضة، منبتا للشوك والحسك."], [24, "ولا يقتحم الأرض إلا كل من يحمل سهاما وأقواسا، لأنها أرض مليئة بالشوك والحسك."], [25, "أما الجبال التي كانت تنقب بالمعول، فلا يصعد إليها أحد خوفا من الشوك والحسك، فتصبح مسرحا للثيران وموطئا للغنم»."]]}, {"l": "Isa 10:5", "n": "", "vs": [[5, "ويل للأشوريين، قضيب غضبي، الحاملين في أيديهم عصا سخطي."]]}, {"l": "Isa 10:6", "n": "", "vs": [[6, "أرسلهم ضد أمة منافقة، وأوصيهم على شعبي الذي غضبت عليه، ليغنموا غنائمهم ويستولوا على أسلابهم، ويطأوهم كما يطأون الوحل."]]}, {"l": "Jer 49:1", "n": "", "vs": [[1, "نبوءة عن بني عمون، هذا ما يعلنه الرب: «أليس لإسرائيل أبناء؟ أليس له وارث؟ فما بال ملك العمونيين قد استولى على ميراث سبط جاد وسكن شعبه في مدنه؟"]]}], "kwAr": "وأبعث", "noteAr": ""}, {"kw": "Mareshah", "raw": "Jos_15:44", "note": "", "refs": [{"l": "Jos 15:44", "n": "", "vs": [[44, "وقعيلة وأكزيب ومريشة. وهي في جملتها تسع مدن مع ضياعها."]]}], "kwAr": "مريشة", "noteAr": ""}, {"kw": "he", "raw": "etc. or, the glory of Israel shall come to, etc. 1Sa_22:1; Isa_10:3", "note": "etc. or, the glory of Israel shall come to, etc. 1Sa_22:1; Isa_10:3", "refs": [{"l": "1Sa 22:1", "n": "", "vs": [[1, "وهرب داود من جت ولجأ إلى مغارة عدلام، فلما سمع إخوته وسائر بيت أبيه بوجوده هناك جاءوا إليه."]]}, {"l": "Isa 10:3", "n": "", "vs": [[3, "فماذا تصنعون في يوم العقاب عندما تقبل الكارثة من بعيد؟ إلى من تلجأون طلبا للعون، وأين تودعون ثروتكم؟"]]}], "kwAr": "فيهرب", "noteAr": "إلخ. أو: «مجد إسرائيل يأتي إلى» إلخ. انظر 1صم 22: 1؛ إش 10: 3"}, {"kw": "Adullam", "raw": "Jos_15:35; 2Ch_11:7", "note": "", "refs": [{"l": "Jos 15:35", "n": "", "vs": [[35, "ويرموت وعدلام وسوكوه وعزيقة،"]]}, {"l": "2Ch 11:7", "n": "", "vs": [[7, "وبيت صور وسوكو وعدلام،"]]}], "kwAr": "عدلام", "noteAr": ""}], "arS": [["وأبعث", ["H935"]], [" إليكم ", []], ["بقاهر", ["H3423"]], [" ", []], ["ياأهل", ["H3427"]], [" ", []], ["مريشة", ["H4762"]], ["، ", []], ["فيهرب", ["H935"]], [" من أمامه ", []], ["نبلاء", ["H3519"]], [" ", []], ["إسرائيل", ["H3478"]], [" ", []], ["إلى", ["H5704"]], [" مغارة ", []], ["عدلام", ["H5725"]], [".", []]]}, {"c": 1, "v": 16, "text": "احلقوا رؤوسكم وجزوا شعوركم من أجل أبناء مسرتكم. اجعلوا رؤوسكم صلعاء كرأس النسر، لأنهم سيؤخذون منكم إلى السبي.", "groups": [{"kw": "bald", "raw": "Job_1:20; Isa_15:2, Isa_22:12; Jer_6:26, Jer_7:29, Jer_16:6; Amo_8:10", "note": "", "refs": [{"l": "Job 1:20", "n": "", "vs": [[20, "فقام أيوب ومزق جبته وجز شعر رأسه وأكب على الأرض ساجدا،"]]}, {"l": "Isa 15:2", "n": "", "vs": [[2, "ينطلق أهل ديبون إلى المعبد، وحتى إلى المرتفعات للبكاء؛ يولول شعب موآب على مصير نبو وميدبا برؤوس وذقون محلوقة."]]}, {"l": "Isa 22:12", "n": "", "vs": [[12, "في ذلك اليوم يدعوكم السيد الرب القدير للبكاء والنوح وحلق الشعر والتنطق بالمسوح."]]}, {"l": "Jer 6:26", "n": "", "vs": [[26, "فياأورشليم ارتدي المسوح وتمرغي في الرماد، ونوحي كمن ينوح على وحيده، وانتحبي نحيبا مرا، لأن المدمر ينقض علينا فجأة."]]}, {"l": "Jer 7:29", "n": "", "vs": [[29, "جزي شعرك واطرحيه ياأورشليم، وانصبي مرثاة على المرتفعات الجرداء، لأن الرب رفض هذا الجيل الرازح تحت سخطه»."]]}, {"l": "Jer 16:6", "n": "", "vs": [[6, "فيموت الصغير والكبير في هذه الأرض فلا يدفنون ولا يندبون أو يخدش أحد نفسه أو يحلق شعره حدادا عليهم."]]}, {"l": "Amo 8:10", "n": "", "vs": [[10, "أحول أعيادكم إلى مآتم، وأغانيكم إلى مراث، وألبسكم المسوح على أحقائكم، وأفشي الصلع في كل رأس، فتصبح أعيادكم كمناحة على وحيد، ونهايتها كيوم مفعم بالمرارة."]]}], "kwAr": "صلعاء", "noteAr": ""}, {"kw": "thy delicate", "raw": "Deu_28:56, Deu_28:57; Isa_3:16-26; Lam_4:5-8", "note": "", "refs": [{"l": "Deu 28:56", "n": "", "vs": [[56, "وكذلك فإن أكثر النساء رقة ورأفة، والتي لنعومتها وترفهها لا تجرؤ على لمس الأرض بباطن قدمها، تبخل على زوجها رجل حضنها وعلى ابنها وابنتها"]]}, {"l": "Deu 28:57", "n": "", "vs": [[57, "بمشيمتها الساقطة منها، وبأولادها الذين تلدهم، لأنها تنوي أن تأكلهم سرا في أثناء الحصار، في الضيقة التي يضايقكم بها عدوكم في كل مدنكم."]]}, {"l": "Isa 3:16-26", "n": "", "vs": [[16, "ويقول الرب: «لأن بنات صهيون متغطرسات، يمشين بأعناق مشرئبة متغزلات بعيونهن، متخطرات في سيرهن، مجلجلات بخلاخيل أقدامهن."], [17, "سيصيبهن الرب بالصلع، ويعري عوراتهن»."], [18, "في ذلك اليوم ينزع الرب زينة الخلاخيل، وعصابات رؤوسهن والأهلة،"], [19, "والأقراط والأساور والبراقع،"], [20, "والعصائب والسلاسل والأحزمة، وآنية الطيب والتعاويذ"], [21, "والخواتم وخزائم الأنف،"], [22, "والثيا ب المزخرفة والعباءات والمعاطف والأكياس"], [23, "والمرايا والأردية الكتانية، والعصائب المزينة وأغطية الرؤوس"], [24, "فتحل العفونة محل الطيب، والحبل عوض الحزام، والصلع بدل الشعر المنسق، وحزام المسح في موضع الثوب الفاخر، والعار عوض الجمال،"], [25, "فيسقط رجالك في الحرب، ويلقى أبطالك حتفهم في ساحة الوغى"], [26, "فتنوح عليهم أبواب المدينة وتنطرح على الأرض مهجورة."]]}, {"l": "Lam 4:5-8", "n": "", "vs": [[5, "هلك في الشوارع الذين كانوا يأكلون الطيبات، واحتضن المزابل المتربون على لبس الحرية."], [6, "لأن عقاب إثم ابنة شعبي أعظم من عقاب خطيئة سدوم التي انقلبت في لحظة، من غير أن تمتد إليها يد إنسان."], [7, "كان نبلاؤها أنقى من الثلج وأنصع من اللبن. أجسادهم أكثر حمرة من المرجان، وقاماتاهم كالياقوت العأزرق،"], [8, "فأصبحت صورتهم أكثر سوادا من الفحم، فلم يعرفوا فاي الشوارع. لصقت جلودهم بعظامهم، وصارت جافة كالحطب."]]}], "kwAr": "أبناء مسرتكم", "noteAr": ""}, {"kw": "for", "raw": "Deu_28:41; 2Ki_17:6; Isa_39:6, Isa_39:7", "note": "", "refs": [{"l": "Deu 28:41", "n": "", "vs": [[41, "تنجبون بنين وبنات ولا يكونون لكم، لأنهم يسبون."]]}, {"l": "2Ki 17:6", "n": "", "vs": [[6, "وفي السنة التاسعة من حكم هوشع سقطت السامرة، فسبى ملك أشور الإسرائيليين إلى أشور وأسكنهم في مدينة حلح، وعلى ضفاف نهر خابور في منطقة جوزان، وفي مدن مادي."]]}, {"l": "Isa 39:6", "n": "", "vs": [[6, "ها أيام تأتي ينقل فيها إلى بابل كل ما في قصرك مما ادخره أسلافك ولا يبقى منها شيء."]]}, {"l": "Isa 39:7", "n": "", "vs": [[7, "ويسبى بعض أبنائك الخارجين من صلبك ليكونوا خصيانا في قصر ملك بابل»."]]}], "kwAr": "لأنهم", "noteAr": ""}], "arS": [["احلقوا", ["H7139"]], [" رؤوسكم ", []], ["وجزوا", ["H1494"]], [" شعوركم ", []], ["من أجل", ["H5921"]], [" ", []], ["أبناء", ["H1121"]], [" ", []], ["مسرتكم", ["H8588"]], [". ", []], ["اجعلوا", ["H7337"]], [" رؤوسكم ", []], ["صلعاء", ["H7144"]], [" كرأس ", []], ["النسر", ["H5404"]], ["، ", []], ["لأنهم", ["H3588"]], [" سيؤخذون ", []], ["منكم", ["H4480"]], [" إلى ", []], ["السبي", ["H1540"]], [".", []]]}, {"c": 2, "v": 1, "text": "ويل للمتآمرين بالسوء، الذين يحوكون الشر وهم في مضاجعهم، الذين ينفذون عند طلوع الصباح ما خططوا له، لأن ذلك في متناول قدرتهم.", "groups": [{"kw": "", "raw": "Cir, am 3274, bc 730", "note": "Cir, am 3274, bc 730", "refs": [], "kwAr": "", "noteAr": "الدورة: 3274، قبل الميلاد 730."}, {"kw": "to", "raw": "Est_3:8, Est_5:14, Est_9:25; Psa_7:14-16, Psa_140:1-8; Pro_6:12-19, Pro_12:2; Isa_32:7; Isa_59:3; Jer_18:18; Eze_11:2; Nah_1:11; Luk_20:19, Luk_22:2-6; Act_23:12; Rom_1:30", "note": "", "refs": [{"l": "Est 3:8", "n": "", "vs": [[8, "فقال هامان للملك أحشويروش: «هناك شعب ما متشتت ومتفرق بين الشعوب في كل أرجاء مملكتك، تغاير شرائعهم شرائع جميع الأمم، وهم لا ينفذون سنن الملك. فلا يجدر بالملك إغفال أمرهم."]]}, {"l": "Est 5:14", "n": "", "vs": [[14, "عندئذ قالت له زوجته زرش وسائر المقربين إليه: «ليجهزوا خشبة ارتفاعها خمسون ذراعا (خمسة وعشرون مترا)، واطلب من الملك في الصباح أن يأمر بصلب مردخاي عليها، ثم اذهب مع الملك إلى المأدبة سعيدا». فاستصوب هامان الرأي، وأمر بتجهيز الخشبة!"]]}, {"l": "Est 9:25", "n": "", "vs": [[25, "ولكن حالما لفتت أستير انتباه الملك إلى المؤامرة أصدر مرسوما ارتد فيه كيد هامان الذي كاده لليهود على رأسه، وتم صلبه مع أبنائه على خشبة."]]}, {"l": "Psa 7:14-16", "n": "", "vs": [[14, "هوذا العدو يتمخض بالإثم، يحبل بالأذى، ويلد كذبا."], [15, "حفر بئرا وعمقها، فسقط فيها."], [16, "شره يرتد على رأسه، وظلمه يهبط على هامته."]]}, {"l": "Psa 140:1-8", "n": "", "vs": [[1, "أنقذني يارب من الأشرار واحفظني من الظالمين،"], [2, "الذين ينوون على الشر في قلوبهم ويثيرون الحرب دائما،"], [3, "سنوا ألسنتهم كالحية، وسم الأصلال تحت شفاههم."], [4, "احمني يارب من قبضة الشرير، وأنقذني من الظالمين المتآمرين على عرقلة خطواتي."], [5, "أخفى لي المتكبرون فخا، ونشروا شبكة بجانب الطريق، ونصبوا لي أشراكا."], [6, "قلت للرب: «أنت إلهي» فيارب أصغ إلى صوت تضرعي."], [7, "أيها الرب السيد، ياقوة خلاصي، أنت وقيت رأسي في يوم القتال."], [8, "لا تحقق يارب رغبات الأشرار، ولا تنجح مكيدتهم لئلا يستكبروا."]]}, {"l": "Pro 6:12-19", "n": "", "vs": [[12, "الرجل المغتاب، الرجل الأثيم هو من يسعى بنميمة الفم الكاذبة،"], [13, "ويغمز بعينيه، ويشير برجليه، ويكشف عن نواياه بحركات أصابعه."], [14, "يخترع الشر بقلب مخادع، ويثير الخصومات دائما."], [15, "لذلك تغشاه البلايا فجأة، وفي لحظة يتحطم ويستعصي شفاؤه."], [16, "ستة أمور يمقتها الرب، وسبعة مكروهة لديه:"], [17, "عينان متعجرفتان، ولسان كاذب، ويدان تسفكان دما بريئا."], [18, "وقلب يتآمر بالشر، وقدمان تسرعان بصاحبهما لارتكاب الإثم،"], [19, "وشاهد زور ينفث كذبا، ورجل يزرع خصومات بين الإخوة."]]}, {"l": "Pro 12:2", "n": "", "vs": [[2, "الصالح يحظى برضى الرب، ورجل المكائد يستجلب قضاءه."]]}, {"l": "Isa 32:7", "n": "", "vs": [[7, "إن أساليب الماكر شريرة، ومؤامراته خبيثة ليهلك البائسين بالأكاذيب، حتى لو كان المسكين ينطق بالحق."]]}, {"l": "Isa 59:3", "n": "", "vs": [[3, "لأن أيديكم تلوثت بالدم وأصابعكم بالإثم، ونطقت شفاهكم بالكذب، ولهجت ألسنتكم بالشر."]]}, {"l": "Jer 18:18", "n": "", "vs": [[18, "ثم قالوا: «تعالوا نتآمر على إرميا، لأن الشريعة لا تبيد عن الكاهن، ولا المشورة عن الحكيم، ولا الوحي عن النبي. تعالوا نلذعه بوخزات اللسان ونصم آذاننا عن كلامه»."]]}, {"l": "Eze 11:2", "n": "", "vs": [[2, "فقال لي: «ياابن آدم، هؤلاء هم الرجال المتواطئون على الشر، المتآمرون بمشورة السوء في هذه المدينة،"]]}, {"l": "Nah 1:11", "n": "", "vs": [[11, "منك خرج يانينوى من تآمر بالشر على الرب، والمشير بالسوء."]]}, {"l": "Luk 20:19", "n": "", "vs": [[19, "فسعى رؤساء الكهنة والكتبة إلى إلقاء القبض عليه في تلك الساعة عينها، ولكنهم خافوا الشعب، فقد أدركوا أنه عناهم بهذا المثل."]]}, {"l": "Luk 22:2-6", "n": "", "vs": [[2, "ومازال رؤساء الكهنة والكتبة يسعون كي يقتلوا يسوع، لأنهم كانوا خائفين من الشعب."], [3, "ودخل الشيطان في يهوذا الملقب بالإسخريوطي، وهو في عداد الاثني عشر."], [4, "فمضى وتكلم مع رؤساء الكهنة وقواد حرس الهيكل كيف يسلمه إليهم."], [5, "ففرحوا، واتفقوا أن يعطوه بعض المال."], [6, "فرضى، وأخذ يتحين فرصة ليسلمه إليهم بعيدا عن الجمع."]]}, {"l": "Act 23:12", "n": "", "vs": [[12, "ولما طلع الصباح حاك بعض اليهود مؤامرة لقتل بولس، وحرموا على أنفسهم الطعام والشراب إلى أن يقتلوه."]]}, {"l": "Rom 1:30", "n": "", "vs": [[30, "مغتابون، كارهون لله، شتامون، متكبرون، متفاخرون، مخترعون للشرور، غير طائعين للوالدين."]]}], "kwAr": "للمتآمرين", "noteAr": ""}, {"kw": "work", "raw": "Psa_36:4; Pro_4:16", "note": "", "refs": [{"l": "Psa 36:4", "n": "", "vs": [[4, "يتفكر في الباطل على سريره ليلا. ويسلك في سبيل السوء لا يستنكر الشر."]]}, {"l": "Pro 4:16", "n": "", "vs": [[16, "فإنهم لا يركنون إلى النوم ما لم يسيئوا، ويفارقهم النعاس ما لم يعثروا أحدا."]]}], "kwAr": "يحوكون الشر", "noteAr": ""}, {"kw": "when", "raw": "Hos_7:6, Hos_7:7; Mat_27:1, Mat_27:2; Mar_15:1; Act_23:15", "note": "", "refs": [{"l": "Hos 7:6", "n": "", "vs": [[6, "فقلوبهم تشتعل بالمكائد كالأتون. يخمد غضبهم في الليل، ويتوهج كنار ملتهبة عند الصباح."]]}, {"l": "Hos 7:7", "n": "", "vs": [[7, "كلهم متأججون كأتون مشتعل. يفترسون حكامهم. هلك جميع ملوكهم، ولم يوجد بينهم من يطلبني."]]}, {"l": "Mat 27:1", "n": "", "vs": [[1, "ولما طلع الصباح، عقد رؤساء الكهنة وشيوخ الشعب اجتماعا آخر، وتآمروا على يسوع لينزلوا به عقوبة الموت."]]}, {"l": "Mat 27:2", "n": "", "vs": [[2, "ثم قيدوه وساقوه فسلموه إلى بيلاطس الحاكم."]]}, {"l": "Mar 15:1", "n": "", "vs": [[1, "وحالما طلع الصباح، تشاور رؤساء الكهنة والشيوخ والكتبة والمجلس الأعلى كله، ثم قيدوا يسوع، وساقوه، وسلموه إلى بيلاطس."]]}, {"l": "Act 23:15", "n": "", "vs": [[15, "فاطلبوا من القائد بصفتكم أعضاء المجلس، أن يحضر بولس بحجة إعادة النظر في قضيته، ونحن مستعدون لاغتياله قبل وصوله إلى المجلس!»"]]}], "kwAr": "عند طلوع الصباح", "noteAr": ""}, {"kw": "because", "raw": "Gen_31:29; Deu_28:32; Pro_3:27; Joh_19:11", "note": "", "refs": [{"l": "Gen 31:29", "n": "", "vs": [[29, "إن في مقدوري أن أؤذيك، ولكن إله أبيك أمرني ليلة أمس قائلا: إياك أن تخاطب يعقوب بخير أو بشر."]]}, {"l": "Deu 28:32", "n": "", "vs": [[32, "يساق أولادك وبناتك إلى أمة أخرى وعيناك تراقبانهم طوال النهار، حتى تكلا، وما في يدك حيلة."]]}, {"l": "Pro 3:27", "n": "", "vs": [[27, "لا تحجب الإحسان عن أهله كلما كان في وسعك أن تقوم به."]]}, {"l": "Joh 19:11", "n": "", "vs": [[11, "فأجابه يسوع «ما كان لك علي سلطة قط، لو لم تكن قد أعطيت لك من فوق. لذلك فالذي سلمني إليك له خطيئة أعظم...»"]]}], "kwAr": "لأن ذلك", "noteAr": ""}], "arS": [["ويل", ["H1945"]], [" ", []], ["للمتآمرين", ["H2803"]], [" ", []], ["بالسوء", ["H205"]], ["، الذين ", []], ["يحوكون", ["H6466"]], [" ", []], ["الشر", ["H7451"]], [" وهم في ", []], ["مضاجعهم", ["H4904"]], ["، الذين ", []], ["ينفذون", ["H6213"]], [" عند ", []], ["طلوع", ["H216"]], [" ", []], ["الصباح", ["H1242"]], [" ما خططوا له، ", []], ["لأن", ["H3588"]], [" ذلك في متناول ", []], ["قدرتهم", ["H410", "H3027"]], [".", []]]}, {"c": 2, "v": 2, "text": "يشتهون حقولا ويغتصبونها، وبيوتا فيستولون عليها. يجورون على الرجل وعلى بيته والإنسان وميراثه.", "groups": [{"kw": "they covet", "raw": "Exo_20:17; 1Kings 21:2-19; Job_31:38; Isa_5:8; Jer_22:17; Amo_8:4; Hab_2:5-9; 1Ti_6:10", "note": "", "refs": [{"l": "Exo 20:17", "n": "", "vs": [[17, "لا تشته بيت جارك، ولا زوجته، ولا عبده، ولا أمته، ولا ثوره، ولا حماره، ولا شيئا مما له»."]]}, {"l": "1Ki 21:2-19", "n": "", "vs": [[2, "فقال أخآب لنابوت: «قايضني كرمك لأجعله حديقة خضروات، لأنه مجاور لقصري، فأعطيك بدلا منه كرما أفضل منه، أو إذا راق لك أدفع ثمنه فضة»."], [3, "فأجاب نابوت: «معاذ الله أن أفرط في ميراث آبائي»."], [4, "فدخل أخآب قصره مكتئبا مهموما متأثرا من قول نابوت اليزرعيلي: «لا أفرط في ميراث آبائي». واستلقى فوق سريره مشيحا بوجهه نحو الحائط عازفا عن الطعام."], [5, "فأقبلت إليه زوجته إيزابل قائلة: «مالي أراك منقبضا عازفا عن الطعام؟»"], [6, "فأجابها: «لأني قلت لنابوت اليزرعيلي: بعني كرمك، وإذا شئت قايضتك بكرم آخر، فأجاب: لا أعطيك كرمي»"], [7, "فقالت له إيزابل: «أهكذا تحكم كملك على إسرائيل؟ قم وتناول طعاما وطب نفسا، فأنا أحصل لك على كرم نابوت اليزرعيلي»."], [8, "ثم حررت رسائل باسم أخآب، وختمتها بخاتمه وبعثت بها إلى شيوخ ووجهاء يزرعيل حيث يقيم نابوت."], [9, "وقالت فيها: «ادعوا الشعب للصوم، وأجلسوا نابوت في مكان الصدارة،"], [10, "وأقيموا شاهدي زور ليشهدا أن نابوت جدف على الله وعلى الملك، ثم أخرجوه من المدينة وارجموه حتى يموت»."], [11, "فنفذ شيوخ مدينته ووجهاؤها أوامر إيزابل كما هي واردة في الرسائل التي بعثت بها إليهم."], [12, "فتداعوا للصوم، وأجلسوا نابوت في مكان الصدارة."], [13, "ثم أقبل شاهدا زور وجلسا تجاهه، وشهدا على نابوت أمام الشعب قائلين: «قد جدف نابوت على الله وعلى الملك». فجروه إلى خارج المدينة ورجموه بالحجارة حتى مات."], [14, "وأبلغوا إيزابل أن نابوت قد رجم فمات."], [15, "فلما سمعت إيزابل بموت نابوت قالت لأخآب: «قم ورث كرم نابوت اليزرعيلي، الذي أبى أن يبيعك إياه بفضة، لأن نابوت قد أصبح في عداد الأموات»."], [16, "عندئذ قام أخآب ونزل ليتفقد كرم نابوت ويستولي عليه."], [17, "ولكن الرب قال لإيليا التشبي:"], [18, "«قم امض للقاء أخآب ملك إسرائيل المقيم في السامرة، فها هو قد نزل إلى كرم نابوت ليستولي عليه،"], [19, "وقل له: هذا ما يقوله الرب: هل قتلت وامتلكت أيضا؟ في المكان الذي لعقت فيه الكلاب دم نابوت تلعق الكلاب دمك أيضا»."]]}, {"l": "Job 31:38", "n": "", "vs": [[38, "إن كانت أرضي قد احتجت علي وتباكت أتلامها جميعا،"]]}, {"l": "Isa 5:8", "n": "", "vs": [[8, "اشتريتم البيوت والحقول حتى لم يبق لأحد غيركم مكان يسكن فيه! صارت الأرض لكم وحدكم!"]]}, {"l": "Jer 22:17", "n": "", "vs": [[17, "«أما أنت فعيناك وقلبك متهافتة على الربح الحرام، وعلى سفك الدم البريء، وعلى الظلم والابتزاز»."]]}, {"l": "Amo 8:4", "n": "", "vs": [[4, "استمعوا هذا أيها الدائسون على البائسين، يامن حاولتم أن تقضوا على فقراء الأرض،"]]}, {"l": "Hab 2:5-9", "n": "", "vs": [[5, "وكما أن الخمر غادرة، كذلك تأخذ المغتر نشوة الانتصار فلا يستكين، فإن جشعه في سعة الهاوية، وهو كالموت لا يشبع. لهذا يجمع لنفسه كل الأمم ويسبي جميع الشعوب."], [6, "ولكن لا يلبث أن يسخر منه سباياه قائلين: «ويل لمن يكوم لنفسه الأسلاب، ويثرى على حساب ما نهب. إنما إلى متى؟"], [7, "ألا يقوم عليك دائنوك بغتة، أو لا يثورون عليك ويملأونك رعبا، فتصبح لهم غنيمة؟"], [8, "لأنك سلبت أمما كثيرة فإن بقية الشعوب ينهبونك ثأرا لما سفكت من دماء وارتكبت من جور في الأرض، فدمرت مدنا وأهلكت الساكنين فيها."], [9, "ويل لمن يدخر لبنيه مكسب ظلم، ويشيد مسكنه في مقام حصين ليكون في مأمن من الخطر."]]}, {"l": "1Ti 6:10", "n": "", "vs": [[10, "فإن حب المال أصل لكل شر؛ وإذ سعى بعضهم إليه، ضلوا عن الإيمان، وطعنوا أنفسهم بأوجاع كثيرة."]]}], "kwAr": "يشتهون", "noteAr": ""}, {"kw": "so", "raw": "Mic_3:9; Exo_22:21-24; 2Ki_9:26; Neh_5:1-5; Job_24:2-12; Eze_18:12, Eze_22:12; Amo_8:4; Mal_3:5; Mat_23:14", "note": "", "refs": [{"l": "Mic 3:9", "n": "", "vs": [[9, "استمعوا هذا يارؤساء بيت يعقوب وقضاة شعب إسرائيل الذين يكرهون العدل ويحرفون الحق."]]}, {"l": "Exo 22:21-24", "n": "", "vs": [[21, "لا تضطهد غريبا ولا تضايقه، فقد كنتم غرباء في ديار مصر."], [22, "لا تسيء إلى أرملة أو يتيم،"], [23, "لأ نك إن أسأت إليهما وصرخا إلي أسمع صراخهما،"], [24, "فيحتدم غضبي وأقتلكم بالسيف، فتصبح زوجاتكم أرامل وأولادكم يتامى."]]}, {"l": "2Ki 9:26", "n": "", "vs": [[26, "فالرب يقول: لقد رأيت أمسا دم نابوت ودماء أبنائه، لهذا لابد أن أعاقبك في هذا الحقل. فالآن ارفعه واطرحه في الحقل حسب قول الرب»."]]}, {"l": "Neh 5:1-5", "n": "", "vs": [[1, "وارتفع صراخ الشعب ونسائهم بالشكوى احتجاجا على إخوتهم اليهود المستغلين،"], [2, "فمن قائل: إننا رزقنا بنين وبنات كثيرين، دعنا نأخذ قمحا حتى نأكل ونحيا."], [3, "ومن قائل: إنا رهنا حقولنا وكرومنا وبيوتنا لقاء الحنطة لندفع عنا الجوع."], [4, "ومن قائل: إننا استقرضنا فضة لندفع خراج الملك على حقولنا وكرومنا،"], [5, "ومع أن لحمنا من لحم إخوتنا وأولادنا كأولادهم، فإن علينا أن نخضع أبناءنا وبناتنا للعبودية، بل إن بعض بناتنا مستعبدات، وليس بيدنا حيلة، لأن حقولنا وكرومنا مرهونة للآخرين."]]}, {"l": "Job 24:2-12", "n": "", "vs": [[2, "ينقل الناس التخوم، ويغتصبون القطعان ويرعونها."], [3, "يأخذون حمار الأيتام ويرتهنون ثور الأرملة."], [4, "يصدون المساكين عن الطريق، فيختبيء فقراء الأرض جميعا."], [5, "انظروا فها هم يخرجون إلى عملهم كالحمار الوحشي في الصحراء يطلبون في القفر صيدا، ليكون طعاما لأبنائهم،"], [6, "يجمعون علفهم من الحقل ويقطفون كرم الشرير."], [7, "يرقدون الليل كله عراة من غير كسوة تقيهم غائلة البرد."], [8, "يبتلون من مطر الجبال، ويركنون إلى الصخر لافتقارهم إلى المأوى."], [9, "يخطفون اليتامى عن الثدي، ويرتهنون طفل المسكين،"], [10, "يطوفون عراة بلا كساء، جياعا حاملين الحزم."], [11, "يعصرون الزيت بين أتلام زيتون الأشرار، ويدوسون معاصر الخمر وهم عطاش."], [12, "يرتفع من المدن أنين المشرفين على الموت، وتستغيث نفوس الجرحى، والله لا يصغي إلى دعائهم."]]}, {"l": "Eze 18:12", "n": "", "vs": [[12, "وجار على البائس والمسكين وسلب ولم يرد الرهن، والتفت إلى الأصنام ليعبدها وارتكب الأرجاس،"]]}, {"l": "Eze 22:12", "n": "", "vs": [[12, "فيك أخذوا الرشوة لقاء سفك الدماء. أخذت الربا ومال الحرام، وسلبت أقرباءك ظلما ونسيتني، يقول السيد الرب."]]}, {"l": "Amo 8:4", "n": "", "vs": [[4, "استمعوا هذا أيها الدائسون على البائسين، يامن حاولتم أن تقضوا على فقراء الأرض،"]]}, {"l": "Mal 3:5", "n": "", "vs": [[5, "وأقترب منكم لأكون شاهدا سريعا ضد السحرة والزناة والحالفين بالزور والمستغلين لأجرة العامل ومضطهدي الأرامل والأيتام، والذين يظلمون الغرباء ولا يخافونني"]]}, {"l": "Mat 23:14", "n": "", "vs": [[14, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تلتهمون بيوت الأرامل وتتذرعون بإطالة صلواتكم. لذلك ستنزل بكم دينونة أقسى!"]]}], "kwAr": "فيستولون", "noteAr": ""}, {"kw": "oppress", "raw": "or, defraud, 1Sa_12:3, 1Sa_12:4", "note": "or, defraud, 1Sa_12:3, 1Sa_12:4", "refs": [{"l": "1Sa 12:3", "n": "", "vs": [[3, "فاشهدوا علي في حضرة الرب، وأمام ملكه المختار، إن كنت قد أخذت ثورا أو حمارا من أحد، أو ظلمت أو جرت على أحد أو قبلت رشوة من أحد لأغمض عيني عنه، فأعوض ذلك عليكم»."]]}, {"l": "1Sa 12:4", "n": "", "vs": [[4, "فأجابوه:«لم تظلمنا ولم تجر علينا ولا أخذت شيئا من أحد»."]]}], "kwAr": "يجورون", "noteAr": "أو: «يغشون». انظر 1صم 12: 3، 4"}], "arS": [["يشتهون", ["H2530"]], [" ", []], ["حقولا", ["H7704"]], [" ", []], ["ويغتصبونها", ["H1497"]], ["، ", []], ["وبيوتا", ["H1004"]], [" ", []], ["فيستولون", ["H5375"]], [" عليها. ", []], ["يجورون", ["H6231"]], [" على ", []], ["الرجل", ["H1397"]], [" وعلى ", []], ["بيته", ["H1004"]], [" ", []], ["والإنسان", ["H376"]], [" ", []], ["وميراثه", ["H5159"]], [".", []]]}, {"c": 2, "v": 3, "text": "لهذا، هكذا يقول الرب. ها أنا أدبر شرا لهذا الشعب تعجزون عن فك رقابكم منه، ولن تمشوا بعد متشامخين لأن الزمن يكون زمن سوء.", "groups": [{"kw": "this family", "raw": "Jer_8:3; Amo_3:1, Amo_3:2", "note": "", "refs": [{"l": "Jer 8:3", "n": "", "vs": [[3, "وجميع البقية الباقية من هذه العشيرة الشريرة المشتتة في جميع البقاع التي نفيتهم إليها، يؤثرون الموت على الحياة»."]]}, {"l": "Amo 3:1", "n": "", "vs": [[1, "اسمعوا يابني إسرائيل هذه الكلمة التي قضى بها الرب عليكم، بل على كل القبيلة التي أخرجتها من ديار مصر:"]]}, {"l": "Amo 3:2", "n": "", "vs": [[2, "إياكم وحدكم اخترت من بين جميع قبائل الأرض، لهذا أعاقبكم على جميع آثامكم."]]}], "kwAr": "لهذا الشعب", "noteAr": ""}, {"kw": "do", "raw": "Mic_2:1; Jer_18:11, Jer_34:17; Lam_2:17; Jam_2:13", "note": "", "refs": [{"l": "Mic 2:1", "n": "", "vs": [[1, "ويل للمتآمرين بالسوء، الذين يحوكون الشر وهم في مضاجعهم، الذين ينفذون عند طلوع الصباح ما خططوا له، لأن ذلك في متناول قدرتهم."]]}, {"l": "Jer 18:11", "n": "", "vs": [[11, "لذلك قل لرجال يهوذا وأهل أورشليم، هذا ما يعلنه الرب: ها أنا أدبر لكم شرا، وأعد لكم مؤامرة، فليرجع كل واحد منكم عن طريقه الشرير وقوموا سبلكم وأعمالكم."]]}, {"l": "Jer 34:17", "n": "", "vs": [[17, "لذلك يقول الرب: «لأنكم لم تطيعوني ولم تنادوا بعتق إخوتكم، لذلك سأنادي أنا بعتقكم فأطلقكم لتسقطوا بحد السيف والوباء والجوع، وأجعلكم عرضة للرعب في جميع ممالك الأرض،"]]}, {"l": "Lam 2:17", "n": "", "vs": [[17, "نفذ الرب قضاءه، وحقق وعيده الذي حكم به منذ الحقب السالفة. هدم ولم يرأف، فأشمت بك الخصم، وعظم قوة عدوك."]]}, {"l": "Jam 2:13", "n": "", "vs": [[13, "فلابد أن يكون الحكم على الذين لا يمارسون الرحمة، حكما خاليا من الرحمة، أما الرحمة فهي تتفوق على الحكم!"]]}], "kwAr": "أدبر", "noteAr": ""}, {"kw": "from", "raw": "Amo_2:14-16, Amo_9:1-4; Zep_1:17, Zep_1:18", "note": "", "refs": [{"l": "Amo 2:14-16", "n": "", "vs": [[14, "فلا يتاح الهرب للسريع، وتتلاشى قوة الجبار، ويعجز القوي عن إنقاذ نفسه."], [15, "ولا يصمد رامي القوس ولا يصيب الهدف، ولا يسلم سريع العدو، ولا ينجو راكب الفرس بحياته."], [16, "والثابت الجنان بين أقرانه الأبطال يفر عريانا في ذلك اليوم، يقول الرب."]]}, {"l": "Amo 9:1-4", "n": "", "vs": [[1, "ورأيت السيد واقفا إلى جوار المذبح قائلا: «اضرب تيجان الأعمدة حتى تهتز العتبات، وحطمها على رؤوس جميع الشعب. ومن ينجو منهم أهلكه بالسيف، فلا يهرب منهم أحد ولا يفلت منهم ناج."], [2, "وإن نقبوا لأنفسهم ملجأ في أعماق الهاوية، فإن يدي تطولهم هناك، وإن ارتقوا إلى السماوات فمن هناك أنزلهم."], [3, "وإن اختبأوا في أعالي الكرمل فهناك أبحث عنهم وأعتقلهم. وإن تواروا عني في أعماق البحر فإني آمر هناك الحية فتلدغهم."], [4, "وإن سيقوا إلى السبي أمام أعدائهم ألاحقهم بالسيف لأفنيهم، وأتعقبهم لأبتليهم بالشر لا بالخير»."]]}, {"l": "Zep 1:17", "n": "", "vs": [[17, "فيه أضايق الناس فيمشون كالعمي، لأنهم أخطأوا بحق الرب، فتنسكب دماؤهم كالتراب، ولحمهم يتناثر كالجلة."]]}, {"l": "Zep 1:18", "n": "", "vs": [[18, "لا ينقذهم ذهبهم ولا فضتهم في يوم غضب الرب، إذ بنار غيرته تلتهم كل الأرض، وفيه يضع نهاية مباغتة كاملة سريعة لكل سكان المعمورة»."]]}], "kwAr": "منه", "noteAr": ""}, {"kw": "necks", "raw": "Jer_27:12; Lam_1:14, Lam_5:5; Rom_16:4", "note": "", "refs": [{"l": "Jer 27:12", "n": "", "vs": [[12, "فبلغت صدقيا ملك يهوذا جميع هذا الكلام وقلت: «اخضعوا لملك بابل واخدموه وشعبه فتحيوا."]]}, {"l": "Lam 1:14", "n": "", "vs": [[14, "شد معاصي إلى نير، وبيده حبكها، فناء بها عنقي. أوهن الرب قواي وأسلمني إلى يد لا طاقة لي على مقاومتها."]]}, {"l": "Lam 5:5", "n": "", "vs": [[5, "داس مضطهدونا أعناقنا، أعيينا ولم نجد راحة."]]}, {"l": "Rom 16:4", "n": "", "vs": [[4, "اللذين عرضا عنقيهما للذبح إنقاذا لحياتي، ولست أنا وحدي شاكرا لهما بل جميع كنائس الأمم أيضا."]]}], "kwAr": "رقابكم", "noteAr": ""}, {"kw": "go", "raw": "Isa_2:11, Isa_2:12, Isa_3:16, Isa_5:19, Isa_28:14-18; Jer_13:15-17, Jer_36:23, Jer_43:2; Dan_4:37, Dan_5:20-23", "note": "", "refs": [{"l": "Isa 2:11", "n": "", "vs": [[11, "فعيون البشر المتشامخة تخفض، وكبرياؤهم تذل، ويتعظم الرب وحده في ذلك اليوم."]]}, {"l": "Isa 2:12", "n": "", "vs": [[12, "فإن للرب القدير يوما فيه يوضع كل متعظم ومتكبر ومتغطرس."]]}, {"l": "Isa 3:16", "n": "", "vs": [[16, "ويقول الرب: «لأن بنات صهيون متغطرسات، يمشين بأعناق مشرئبة متغزلات بعيونهن، متخطرات في سيرهن، مجلجلات بخلاخيل أقدامهن."]]}, {"l": "Isa 5:19", "n": "", "vs": [[19, "ويقولون: ليسرع وليعجل بعقابه حتى نراه. لينفذ مقدس إسرائيل مأربه فينا فندرك حقيقة ما يفعله بنا."]]}, {"l": "Isa 28:14-18", "n": "", "vs": [[14, "لذلك اسمعوا كلمة الرب أيها المستهزئون المتحكمون في شعب أورشليم:"], [15, "لأنكم قلتم: «قد أبرمنا عهدا مع الموت، وعقدنا ميثاقا مع الهاوية، فإن الأشوريين المقتحمين أرضنا لن يسلخونا، لأن السوط الجارف إذا عبر لا يصيبنا لأننا اعتصمنا بالمراوغة ولجأنا إلي النفاق»."], [16, "لهذا يقول الرب: «ها أنا أضع حجر أساس في صهيون، حجر زاوية ثمينا ليكون أساسا راسخا وكل من يؤمن به لا يهرب."], [17, "وسأجعل العدل خيط قياس والحق مطمارا (لأكشف عن زيف أعمالكم) فيجرف البرد معتصم الكذب وتطفو المياه على المخابيء"], [18, "عندئد يبطل عهدكم مع الموت، ويلغى ميثاقكم مع الهاوية ويدوسكم أعداؤكم عند اقتحامهم بلادكم."]]}, {"l": "Jer 13:15-17", "n": "", "vs": [[15, "فاسمعوا واصغوا ولا تستكبروا، لأن الرب قد تكلم."], [16, "مجدوا الرب إلهكم قبل أن يجعل الظلام يخيم عليكم، وقبل أن تتعثر أقدامكم على الجبال المعتمة. أنتم ترتقبون النور ولكنه يحوله إلى ظلام الموت ويجعله ليلا دامسا."], [17, "وإن لم تنصتوا فإن نفسي تبكي في الخفاء من أجل كبريائكم، وتذرف عيناي الدموع المريرة، فتسيل العبرات لأن الرب قد سبى شعبه."]]}, {"l": "Jer 36:23", "n": "", "vs": [[23, "فبعد أن قرأ يهودي ثلاثة أو أربعة أقسام منه، تناول الملك مبراة الكاتب وشق الكتاب وطرحه إلى نار الكانون فاحترق الكتاب بكامله."]]}, {"l": "Jer 43:2", "n": "", "vs": [[2, "قال عزريا بن هوشعيا ويوحانان بن قاريح، وسائر الرجال المتعجرفين لإرميا: «أنت تنطق بالكذب، فالرب إلهنا لم يرسلك لتقول لنا: لا ترحلوا إلى مصر لتتغربوا فيها."]]}, {"l": "Dan 4:37", "n": "", "vs": [[37, "فالآن، أنا نبوخذناصر، أسبح وأمجد وأحمد ملك السماء الذي جميع أعماله حق، وطرقه عادلة وقادر على إذلال كل من يسلك بالكبرياء."]]}, {"l": "Dan 5:20-23", "n": "", "vs": [[20, "وعندما شمخ قلبه وقست روحه تعنتا، عزل عن عرش ملكه وجرد من جلاله،"], [21, "وطرد من بين الناس، وماثل عقله الحيوانات، وصار مأواه مع الحمير الوحشية، فأطعموه العشب كالثيران، وابتل جسمه بندى السماء، حتى علم أن الله العلي هو المتسلط في مملكة الناس، وأنه يولي عليها من يشاء."], [22, "وأنت يابيلشاصر ابنه لم يتواضع قلبك، مع علمك بكل هذا،"], [23, "بل تغطرست على رب السماء، فأحضروا أمامك آنية هيكله لتشرب بها الخمر، أنت ونبَلاء دولتك وزوجاتك ومحظياتك، وسبحت آلهة الفضة والذهب والنحاس والحديد والخشب والحجر التي لا تبصر ولا تسمع ولا تدرك، أما الله الذي بيده روحك وله كل طرقك، فلم تمجده."]]}], "kwAr": "تمشوا", "noteAr": ""}, {"kw": "for", "raw": "Amo_5:13; Eph_5:16", "note": "", "refs": [{"l": "Amo 5:13", "n": "", "vs": [[13, "لهذا يصمت العاقل في مثل هذا الزمان الرديء."]]}, {"l": "Eph 5:16", "n": "", "vs": [[16, "مستغلين الوقت أحسن استغلال، لأن الأيام شريرة."]]}], "kwAr": "لأن الزمن", "noteAr": ""}], "arS": [["لهذا", ["H3651"]], ["، ", []], ["هكذا", ["H3541"]], [" ", []], ["يقول", ["H559"]], [" ", []], ["الرب", ["H3068"]], [". ", []], ["ها", ["H2009"]], [" أنا ", []], ["أدبر", ["H2803"]], [" ", []], ["شرا", ["H7451"]], [" ", []], ["لهذا", ["H5921", "H2063"]], [" ", []], ["الشعب", ["H4940"]], [" ", []], ["تعجزون", ["H4185"]], [" عن فك ", []], ["رقابكم", ["H6677"]], [" ", []], ["منه", ["H4480", "H8033"]], ["، ", []], ["ولن", ["H3808"]], [" ", []], ["تمشوا", ["H1980"]], [" بعد ", []], ["متشامخين", ["H7317"]], [" ", []], ["لأن", ["H3588"]], [" ", []], ["الزمن", ["H6256"]], [" يكون زمن ", []], ["سوء", ["H7451"]], [".", []]]}, {"c": 2, "v": 4, "text": "في ذلك اليوم يسخر أعداؤكم منكم، وتنوحون بمثل هذا الرثاء: «قد تم تدميرنا واستبدل الرب نصيب شعبه. كيف أخذه منا وقسم حقولنا بين آسرينا؟»", "groups": [{"kw": "shall", "raw": "Num_23:7, Num_23:18, Num_24:3, Num_24:15; Job_27:1; Isa_14:4; Eze_16:44; Hab_2:6; Mar_12:12", "note": "", "refs": [{"l": "Num 23:7", "n": "", "vs": [[7, "فنطق بنبوءته قائلا: «أتى بي بالاق ملك موآب من بلاد أرام من الجبال الشرقية، وقال: تعال العن لي يعقوب، واشتم لي إسرائيل."]]}, {"l": "Num 23:18", "n": "", "vs": [[18, "فضرب مثله قائلا: «انهض يابالاق واصغ، استمع إلي ياابن صفور"]]}, {"l": "Num 24:3", "n": "", "vs": [[3, "وتنبأ قائلا: «كلام بلعام بن بعور، كلام الرجل المفتوح العينين."]]}, {"l": "Num 24:15", "n": "", "vs": [[15, "ثم تنبأ قائلا: «كلام بلعام بن بعور، كلام الرجل المفتوح العينين."]]}, {"l": "Job 27:1", "n": "", "vs": [[1, "واستطرد أيوب يضرب مثله قائلا:"]]}, {"l": "Isa 14:4", "n": "", "vs": [[4, "فتسخرون من ملك بابل قائلين: كيف استكان الظالم، وكيف خمدت غضبته المتعجرفة؟"]]}, {"l": "Eze 16:44", "n": "", "vs": [[44, "ها إن كل متمثل يقتبس هذ المثل عليك قائلا: كما تكون الأم تكون ابنتها"]]}, {"l": "Hab 2:6", "n": "", "vs": [[6, "ولكن لا يلبث أن يسخر منه سباياه قائلين: «ويل لمن يكوم لنفسه الأسلاب، ويثرى على حساب ما نهب. إنما إلى متى؟"]]}, {"l": "Mar 12:12", "n": "", "vs": [[12, "فسعوا إلى القبض عليه، ولكنهم خافوا الجمع، لأنهم أدركوا أنه كان يعنيهم بهذا المثل. فتركوه وانصرفوا."]]}], "kwAr": "يسخر", "noteAr": ""}, {"kw": "and lament", "raw": "2Sa_1:17; 2Ch_35:25; Jer_9:10,Jer_9:17-21, Jer_14:18; Joe_1:8, Joe_1:13; Amo_5:1, Amo_5:17", "note": "", "refs": [{"l": "2Sa 1:17", "n": "", "vs": [[17, "ورثا داود شاول وابنه يوناثان بهذه المرثاة،"]]}, {"l": "2Ch 35:25", "n": "", "vs": [[25, "ورثى النبي إرميا يوشيا، وظل جميع المغنين والمغنيات يندبون يوشيا في مراثيهم إلى هذا اليوم، فأصبحت هذه المرثاة التي تم تدوينها في مجموعة المراثي فريضة على إسرائيل."]]}, {"l": "Jer 9:10", "n": "", "vs": [[10, "سأنتحب وأنوح على الجبال وأندب على مراعي البرية لأنها احترقت وأوحشت، فلا يجتاز بها عابر ولا يتردد فيها صوت القطعان، وقد هجرتها طيور السماء والوحوش."]]}, {"l": "Jer 9:17-21", "n": "", "vs": [[17, "وهذا ما يعلنه الرب القدير: «تأملوا واستدعوا النادبات ليأتين، وأرسلوا إلى الحكيمات فيقبلن."], [18, "ليسرعن حتى يطلقن أصواتهن علينا بالندب فتذرف عيوننا دموعا، وتفيض أجفاننا ماء."], [19, "ها صوت رثاء قد تجاوب في صهيون: ما أشد دمارنا، وما أعظم عارنا، لأننا قد فارقنا أرضنا، ولأنهم قد هدموا مساكننا!»"], [20, "فاسمعن أيتها النساء قضاء الرب، ولتفهم آذانكن كلمة فمه: لقن بناتكن الر ثاء، ولتعلم كل منهن صاحبتها الندب،"], [21, "فإن الموت قد تسلق إلى كوانا وتسلل إلى قصورنا، فاستأصل الأطفال من الشوارع والشبان من الساحات."]]}, {"l": "Jer 14:18", "n": "", "vs": [[18, "إن خرجت إلى الحقول أشهد قتلى السيف، وإن دخلت المدينة أرى ضحايا المجاعة. وها النبي والكاهن كلاهما يذهبان إلى أرض لا يعرفانها»."]]}, {"l": "Joe 1:8", "n": "", "vs": [[8, "نوحوا كما تنوح صبية متشحة بالمسوح على زوجها الذي مات."]]}, {"l": "Joe 1:13", "n": "", "vs": [[13, "أيها الكهنة اتشحوا بالمسوح ونوحوا. ولولوا ياخدام المذبح. تعالوا وبيتوا ليلتكم بالمسوح ياخدام إلهي، لأن تقدمات الدقيق والخمر قد منعت عن هيكل الله."]]}, {"l": "Amo 5:1", "n": "", "vs": [[1, "اسمعوا هذه المرثية التي أرثيكم بها يابني إسرائيل."]]}, {"l": "Amo 5:17", "n": "", "vs": [[17, "وتعلو الولولة في جوانب الكروم، لأني سأجتاز منتقما في وسطكم يقول الرب."]]}], "kwAr": "وتنوحون", "noteAr": ""}, {"kw": "a doleful lamentation", "raw": "Heb. a lamentation of lamentations, Lam. 1:1-5:22; Eze_2:10", "note": "Heb. a lamentation of lamentations, Lam. 1:1-5:22; Eze_2:10", "refs": [{"l": "Lam 1:1-5:22", "n": "", "vs": [[1, "كيف أصبحت المدينة الآهلة بالسكان مهجورة وحيدة؟ صارت كأرملة! هذه التي كانت عظيمة بين الأمم. السيدة بين المدن صارت تحت الجزية!"], [2, "تبكي بمرارة في الليل، ودموعها تنهمر على خديها. لا معزي لها بين محبيها. غدر بها جميع خلانها وأصبحوا لها أعداء."], [3, "سبيت يهوذا إلى المنفى بعد كل ما عانته من عنت وعبودية، فأقامت بين الأمم شقية، وأدركها مطاردوها في خضم ضيقاتها."], [4, "تنوح الطرق المفضية إلى صهيون، لأنها أقفرت من القادمين إلى الأعيا د! تهدمت بواباتها جميعا. كهنتها يتنهدون؛ عذاراها متحسرات وهي تقاسي مر العذاب."], [5, "أصبح أعداؤها سادة، ونجح مضايقوها، لأن الرب أشقاها بسبب خطاياها المتكاثرة. قد ذهب أولادها إلى السبي أمام العدو."], [6, "تعرت بنت صهيون من كل بهائها، وغدا أشرافها كأيائل شاردة من غير مرعى. فروا بقوة خائرة أمام المطارد."], [7, "تذكرت أورشليم في أيام شقائها ومحنتها جميع ما كانت تتمتع به من مشتهيات في حقبها الغابرة. عندما وقع شعبها في قبضة العدو لم يكن لها مسعف، رآها العدو صريعة وسخر لهلاكها."], [8, "ارتكبت أورشليم خطيئة نكراء فأصبحت رجسة. جميع مكرميها يحتقرونها لأنهم شهدوا عريها، أما هي فتنهدت وتراجعت القهقرى."], [9, "قد علق رجسها بذيولها. لم تذكر آخرتها لهذا كان سقوطها رهيبا، ولا معزي لها. انظر يارب إلى شقائي لأن العدو قد انتصر."], [10, "امتدت يد العدو إلى كل ذخائرها، وأبصرت الأمم ينتهكون حرمة مقادسها. هؤلاء الذين حظرت عليهم أن يدخلوا في جماعتك."], [11, "شعبها كله يتنهد وهو يبحث عن القوت. قد قايضوا ذخائرهم بالطعام لإنعاش النفس الخائرة. (وقالت:) «انظر يارب وتأمل كيف أصبحت محتقرة»."], [12, "ألا يعنيكم هذا ياجميع عابري الطريق؟ تأملوا وانظروا، هل من ألم كألمي الذي ابتلاني به الرب في يوم احتدام غضبه؟"], [13, "من العلاء صب نارا في عظامي فسرت فيها. نصب شركا لقدمي فردني إلى الوراء. جعلني أطلالا أئن طول النهار."], [14, "شد معاصي إلى نير، وبيده حبكها، فناء بها عنقي. أوهن الرب قواي وأسلمني إلى يد لا طاقة لي على مقاومتها."], [15, "بدد الرب جميع جبابرتي في وسطي، وألب علي حشدا من أعدائي ليسحقوا شباني. داس الرب العذراء بنت صهيون كما يداس العنب في المعصرة."], [16, "على هذه كلها أبكي. عيناي، عيناي تفيضان بالدموع، إذ ابتعد عني كل معز ينعش نفسي. هلك أبنائي لأن العدو قد ظفر."], [17, "تمد صهيون يديها تلتمس معزيا، ولكن على غير طائل. قد أمر الرب أن يكون مضايقو يعقوب هم جيرانه الذين حوله. قد أصبحت أورشليم رجسا بينهم."], [18, "الرب حقا عادل، وأنا قد تمردت على أمره. فاستمعوا ياجميع الشعوب واشهدوا وجعي. قد ذهب عذاراي وشباني إلى السبي."], [19, "دعوت محبي فخدعوني. فني كهنتي وشيوخي في المدينة وهم ينشدون قوتا لإحيا ء نفوسهم."], [20, "انظر يارب فإني في ضيقة. أحشائي جائشة وقلبي متلاطم في داخلي، لأني أكثرت التمرد. ها السيف يثكل في الخارج وفي البيت يسود الموت."], [21, "قد سمعوا تنهدي فلم يكن من معز لي. جميع أعدائي عرفوا ببليتي فشمتوا بما فعلت بي. أسرع بيوم العقاب الذي توعدت به فيصيروا مثلي."], [22, "ليأت كل شرهم أمامك فتعاقبهم كما عاقبتني على كل ذنوبي، لأن تنهداتي كثيرة وقلبي مغشي عليه."], [1, "كيف خيم الرب في غضبه بالظلام على ابنة صهيون، وطرح من السماء إلى الأرض جلال إسرائيل، ولم يذكر موطيء قدميه في يوم سخطه؟"], [2, "قد هدم الرب من غير رحمة جميع مساكن يعقوب. قوض بغضبه معاقل ابنة يهوذا، وألحق العار بالمملكة وحكامها، إذ سواها بالأرض."], [3, "بتر في احتدام غضبه كل قوة إسرائيل. رد يمينه إلى الوراء أمام الأعداء، واشتعل مثل نار ملتهبة في إسرائيل، تلتهم كل ما حولها."], [4, "وتر قوسه كعدو. نصب يمينه كمبغض. ذبح كعدو كل عزيز في عيوننا. وسكب سخطه كنار على خيمة ابنة صهيون."], [5, "وأصبح الرب كعدو، فقوض إسرائيل، وهدم جميع قصورها، ودمر حصونها، وأكثر النوح والعويل في ابنة صهيون."], [6, "نقض مظلته كما ينقض كوخ من الأغصان في حديقة، وردم مقر مجتمعه. جعل الرب صهيون تنسى مواسم أعيادها وسبوتها. ونبذ باحتدام سخطه الملك والكاهن."], [7, "كره الرب مذبحه، وتبرأ من مقدسه، وسلم أسوار قصورها إلى يد الأعداء الذين علا هتافهم في بيت الرب كما كان يعلو هتافنا في الأعياد."], [8, "عزم الرب أن يقوض سور ابنة صهيون. مد خيط القياس ولم يرد يده عن سحقها، فاستبكى المترسة والسور فسقطا معا."], [9, "غاصت في الأرض بواباتها، دمر وحطم مزاليجها. نفى ملكها ورؤساءها بين الأمم. زالت الشريعة، ولم يعد أنبياؤها يحصلون على رؤيا من عند الرب."], [10, "يجلس شيوخ ابنة صهيون على الأرض صامتين. عفروا بالرماد رؤوسهم، وارتدوا المسوح، وطأطأت عذارى أورشليم رؤوسهن إلى الأرض."], [11, "كلت عيناي من البكاء، جاشت أحشائي وأريقت كبدي على الأرض حزنا لدمار ابنة شعبي، لأن الأطفال والرضع غشي عليهم في شوارع المدينة."], [12, "يقولون لأمهاتهم باكين: «أين الخبز والخمر؟» ثم يغشى عليهم كالجرحى في شوارع المدينة، حين تهرق حياتهم في أحضان أمهاتهم."], [13, "بماذا أنذرك وبأي شيء أشبهك ياابنة أورشليم؟ بماذا أقارنك فأعزيك أيتها العذراء ابنة صهيون؟ إن خرابك عظيم كالبحر، فمن ذا يبرئك؟"], [14, "رأى لك أنبياؤك رؤى باطلة خادعة. لم يفضحوا إثمك ليردوا سبيك. إنما رأوا لك وحيا كاذبا مضلا."], [15, "كل عابري السبيل صفقوا عليك بالأيادي فرحا. صفروا وهزوا رؤوسهم على ابنة أورشليم وتساءلوا: أهذه هي المدينة التي تدعى كاملة الجمال وبهجة الأرض بأسرها؟"], [16, "قد فغر جميع أعدائك أشداقهم. يصفرون ويحرقون الأسنان. يهتفون: قد ابتلعناها. هذا هو اليوم الذي طال انتظارنا له. قد عشنا وشهدناه!"], [17, "نفذ الرب قضاءه، وحقق وعيده الذي حكم به منذ الحقب السالفة. هدم ولم يرأف، فأشمت بك الخصم، وعظم قوة عدوك."], [18, "استغاثت قلوبهم بالرب. لتجر الدموع، ياأسوار ابنة صهيون، كالنهر ليلا ونهارا. لا تستكيني ولا تكف عيناك عن البكاء."], [19, "قومي وانتحبي في الربع الأول من الليل. اسكبي كالماء قلبك في محضر الرب. ارفعي إليه يديك من أجل نفوس أطفالك المغشي عليهم من الجوع عند ناصية كل شارع."], [20, "انظر يارب وتأمل! بمن صنعت هذا؟ أعلى النساء أن يأكلن ثمرة بطونهن، وأطفال حضانتهن؟ أيتحتم على الكاهن والنبي أن يقتلا في مقدس الرب؟"], [21, "قد انطرح الصبي والشيوخ في غبار الطرقات. سقط عذاراي وشباني بالسيف. قد قتلتهم في يوم غضبك، ونحرتهم من غير رحمة."], [22, "أنت دعوت، كما في يوم عيد، مروعي المحيطين بي. فلم يفلت ولم ينج أحد في يوم سخطك يارب. قد أفنى عدوي الذين حضنتهم وربيتهم."], [1, "أنا هو الرجل الذي شهد البلية التي أنزلها قضيب سخطه."], [2, "قادني وسيرني في الظلمة من غير نور."], [3, "حقا إنه يمد يده علي مرة تلو المرة طول النهار."], [4, "أبلى لحمي وجلدي. هشم عظامي."], [5, "حاصرني وأحاطني بالعلقم والمشقة."], [6, "أسكنني في الظلمة كموتى الحقب الغابرة."], [7, "سيج حولي حتى لا أفلت. أثقل علي قيودي."], [8, "حتى حين أصرخ وأستغيث يصد صلاتي."], [9, "قد أغلق علي طرقي بحجارة منحوتة، وجعل مسالكي ملتوية."], [10, "هو لي كدب متربص، وكأسد مترصد في مكمنه."], [11, "أضل طرقي ومزقني إربا. دمرني."], [12, "وتر قوسه ونصبني هدفا لسهمه."], [13, "اخترق كليتي بنبال جعبته."], [14, "صرت مثار هزء لشعبي وأهجية لهم اليوم كله."], [15, "أشبعني مرارة، وأرواني أفسنتينا."], [16, "هشم أسناني بالحصى، وطمرني بالرماد."], [17, "فتناءت نفسي عن السلام، ونسيت طعم الخيرات."], [18, "فقلت: «تلاشت قوتي، وكل ما كنت أرجوه من الرب»."], [19, "اذكر بليتي وتيهاني والأفسنتين والمرارة."], [20, "ما برحت نفسي تذكرها وهي منحنية في داخلي."], [21, "ولكن هذا ما أناجي به نفسي، لذلك يغمرني الرجاء:"], [22, "من إحسانات الرب أننا لم نفن، لأن مراحمه لا تزول."], [23, "تتجدد في كل صباح. فائقة أمانتك."], [24, "تقول نفسي: «الرب هو نصيبي فلذلك أرجوه»."], [25, "الرب صالح لمن يرجونه وللنفس التي تلتمسه."], [26, "خير للمرء أن ينتظر بصمت خلاص الرب."], [27, "خير للمرء أن يحمل النير في حداثته."], [28, "ليعتكف وحيدا في صمت لأن الرب قد وضع النير عليه."], [29, "ليوار وجهه في التراب تذللا، عسى أن يكون هناك رجاء."], [30, "ليبذل خده للاطم، ويشبع تعييرا."], [31, "لأن الرب لا ينبذ إلى الأبد."], [32, "فإنه ولو أحزن يرأف بمقتضى رحمته الفائقة."], [33, "لأنه لا يتعمد أن يبتلي أبناء البشر بالبؤس والأسى،"], [34, "ولا أن يسحق أسرى الأرض تحت الأقدام،"], [35, "ولا أن يجور أحد على حقوق الإنسان، أمام عيني الرب العلي"], [36, "أو أن لا ينصف الإنسان في دعواه. ألا يرى الرب هذه الأمور؟"], [37, "من ذا الذي يقضي بأمر فيتحقق إن لم يكن الرب قد أمر به؟"], [38, "أليس من فم العلي يصدر الضر والخير؟"], [39, "فلماذا يشتكي الإنسان الحي حين يعاقب على خطاياه؟"], [40, "لنفحص طرقنا ونختبرها ونرجع إلى الرب."], [41, "لنرفع قلوبنا وأيدينا إلى الله في السماوات."], [42, "قد تعدينا وتمردنا، وأنت لم تغفر."], [43, "لفعت نفسك بالغضب وتعقبتنا. قتلت من غير رحمة."], [44, "تلفعت بالسحاب حتى لا تبلغ إليك صلاة."], [45, "قد جعلتنا أوساخا وأقذارا بين الشعوب."], [46, "فغر علينا جميع أعدائنا أشداقهم،"], [47, "وحل بنا الرعب والهلاك والدمار والسحق."], [48, "تفيض عيناي بأنهار مياه على دمار ابنة شعبي."], [49, "لن تكف عيناي عن البكاء أبدا،"], [50, "حتى يشرف الرب من السماء ويبصر."], [51, "تتلف عيناي على مصير كل بنات مدينتي."], [52, "قد اصطادني، كعصفور، أعدائي الذين لم أسيء إليهم،"], [53, "طرحوني حيا في الجب ورجموني بالحجارة."], [54, "طغت المياه فوق رأسي، فقلت: «قد هلكت»."], [55, "استغثت باسمك يارب من أعماق الجب،"], [56, "فسمعت صوتي. لا تصم أذنيك عن صراخ استغاثتي."], [57, "اقتربت حين دعوتك إذ قلت: «لا تخف»."], [58, "قد دافعت عن دعواي يارب، وافتديت حياتي."], [59, "أنت شهدت ما أساءوا به إلي يارب، فاقض في دعواي."], [60, "قد رأيت انتقامهم كله وسائر مؤامراتهم علي."], [61, "سمعت تعييرهم يارب، وجميع مؤامراتهم علي."], [62, "وسمعت كلام أعدائي وتدبيراتهم ضدي اليوم كله."], [63, "راقب جلوسهم وقيامهم، فقد أصبحت أهجية لهم."], [64, "جازهم يارب بمقتضى ما جنته أيديهم."], [65, "اجعل على قلوبهم غشاوة، ولتكن لعنتك عليهم."], [66, "تعقبهم بسخط وأهلكهم من تحت سماواتك يارب."], [1, "كيف اكمد الذهب واكدر لون النضار الخالص؟ كيف تبعثرت حجارة القدس في ناصية كل شارع؟"], [2, "كيف حسب أبناء صهيون الكرام الموزونون بالذهب النقي، كآنية خزفية من عمل يد الفخاري؟"], [3, "حتى بنات آوى تكشف عن ثديها وترضع أجراءها، أما ابنة شعبي فقاسية كالنعام في الصحراء."], [4, "قد التصق لسان الرضيع بحنكه عطشا، والتمس الأطفال خبزا وليس من يعطيه لهم."], [5, "هلك في الشوارع الذين كانوا يأكلون الطيبات، واحتضن المزابل المتربون على لبس الحرية."], [6, "لأن عقاب إثم ابنة شعبي أعظم من عقاب خطيئة سدوم التي انقلبت في لحظة، من غير أن تمتد إليها يد إنسان."], [7, "كان نبلاؤها أنقى من الثلج وأنصع من اللبن. أجسادهم أكثر حمرة من المرجان، وقاماتاهم كالياقوت العأزرق،"], [8, "فأصبحت صورتهم أكثر سوادا من الفحم، فلم يعرفوا فاي الشوارع. لصقت جلودهم بعظامهم، وصارت جافة كالحطب."], [9, "كان مصير ضحايا السيف أفضل من مصير ضحايا الجوع، الذين اضمحلوا من طعنة عقم الحقل."], [10, "طهت أيدي الأمهات الحانيات أولادهن ليكونوا طعاما لهن في أثناء دمار ابنة شعبي."], [11, "نفث الرب كامل سخطه وصب حمو غضبه، وأضرم نارا في صهيون فالتهمت أسسها."], [12, "لم يصدق ملوك الأرض وسكان المعمورة أن العدو والخصم يقتحمان بوابات أورشليم."], [13, "عقابا لها على خطايا أنبيائها وآثام كهنتها، الذين سفكوا في وسطها دم الصديقين."], [14, "تاهوا كعمي في الشوارع، ملطخين بالدم حتى لم يقدر أحد أن يلمس ثيابهم."], [15, "هتفوا بهم: «ابتعدوا: تنحوا لا تلمسوا شيئا». فهربوا وتشردوا! غير أن أهل الأمم قالوا: لا يمكن أن يسكنوا معنا!"], [16, "قد بددهم الرب نفسه، ولم يعد يعبأ بهم، لم يكرموا الكهنة ولم يترَأفوا بالشيوخ."], [17, "كلت عيوننا من ترقب نصرة باطلة. في أبراجنا انتظرنا معونة أمة لا تخلص."], [18, "تصيد الرجال خطواتنا حتى لا نخطو في شوارعنا. آذنت نهايتنا، وتمت أيامنا وأزفت خاتمتنا."], [19, "كان مطاردونا أسرع من نسور السماء، تعقبونا على الجبال، وتربصوا بنا في الصحراء."], [20, "وقع في حفرهم مصدر حياتنا، الملك الذي اختاره الرب، الذي قلنا: في ظله نعيش بين الأمم."], [21, "ابتهجي وافرحي ياابنة أدوم، ياساكنة عوص. إنما هذه الكأس ستجوز عليك أيضا فتسكرين وتتعرين."], [22, "قد تم إثمك ياابنة صهيون، ولن يطيل (الله ) من حقبة سبيك. أما أنت ياابنة أدوم فإنه يعاقبك ويفضح خطاياك."], [1, "اذكر يارب ما أصابنا. انظر وعاين عارنا."], [2, "قد تحول ميراثنا إلى الغرباء وبيوتنا إلى الأجانب."], [3, "أصبحنا أيتاما لا أب لنا، وأمهاتنا كالأرامل."], [4, "بالفضة شربنا ماءنا. وبثمن ابتعنا حطبنا."], [5, "داس مضطهدونا أعناقنا، أعيينا ولم نجد راحة."], [6, "خضعنا باسطين أيدينا إلى أشور ومصر لنشبع خبزا."], [7, "قد أخطأ آباؤنا، وتواروا عن الوجود، ونحن نتحمل عقاب آثامهم."], [8, "تسلط علينا عبيد، وليس من ينقذنا من أيديهم."], [9, "بأنفسنا نأتي بخبزنا مجازفين بحياتنا من جراء السيف الكامن لنا في الصحراء."], [10, "جلدنا ملتهب كتنور من نيران الجوع المحرقة."], [11, "اغتصبوا النساء في صهيون والعذارى في مدن يهوذا."], [12, "علق النبلاء بأيديهم ولم يوقروا الشيوخ."], [13, "سخروا الشبان للطحن، وهوى الصبيان تحت الحطب."], [14, "هجر الشيوخ بوابة المدينة، وكف الشبان عن غنائهم."], [15, "انقطع فرح قلبنا وتحول رقصنا إلى نوح."], [16, "تهاوى إكليل رأسنا، فويل لنا لأننا قد أخطأنا."], [17, "لهذا غشي على قلوبنا، وأظلمت عيوننا."], [18, "لأن جبل صهيون أضحى أطلالا ترتع فيه الثعالب."], [19, "أما أنت يارب، فتملك إلى الأبد، وعرشك ثابت من جيل إلى جيل."], [20, "لماذا تنسانا إلى الأبد وتتركنا طول الأيام؟"], [21, "ردنا يارب إليك فنرجع. جدد أيامنا كما في العهود السالفة."], [22, "إلا إن كنت قد رفضتنا كل الرفض وغضبت علينا أشد الغضب."]]}, {"l": "Eze 2:10", "n": "", "vs": [[10, "وعندما نشره أمامي رأيت الكتابة تملأه من الداخل والخارج وقد دونت فيه مراث ومناحات وويلات."]]}], "kwAr": "الرثاء", "noteAr": "بالعبرية: «رثاء رثاءات»؛ مراثي إرميا 1: 1-5: 22. انظر حز 2: 10"}, {"kw": "We", "raw": "Deu_28:29; Isa_6:11, Isa_24:3; Jer_9:19, Jer_25:9-11; Zep_1:2", "note": "", "refs": [{"l": "Deu 28:29", "n": "", "vs": [[29, "فتتحسسون طرقكم في الظهر كما يتحسس الأعمى طريقه في الظلام، وتبوء طرقكم بالإخفاق، ولا تكونون إلا مظلومين مغصوبين كل الأيام، وليس من منقذ."]]}, {"l": "Isa 6:11", "n": "", "vs": [[11, "ثم قلت: «إلى متى يارب؟» فأجاب: «إلى أن تصبح المدن خربة مهجورة، والبيوت خالية من الرجال، والحقول خرابا مقفرا."]]}, {"l": "Isa 24:3", "n": "", "vs": [[3, "ويحل الخراب بالأرض وتنهب نهبا، لأن الرب قد تكلم بهذا القضاء."]]}, {"l": "Jer 9:19", "n": "", "vs": [[19, "ها صوت رثاء قد تجاوب في صهيون: ما أشد دمارنا، وما أعظم عارنا، لأننا قد فارقنا أرضنا، ولأنهم قد هدموا مساكننا!»"]]}, {"l": "Jer 25:9-11", "n": "", "vs": [[9, "فها أنا أجند جميع قبائل الشمال بقيادة نبوخذناصر عبدي، وآتي بها إلى هذه الأرض فيجتاحونها ويهلكون جميع سكانها مع سائر الأمم المحيطة بها، وأجعلهم مثار دهشة وصفير، وخرائب أبدية."], [10, "وأبيد من بينهم أهازيج الفرح والطرب وصوت غناء العريس والعروس، وضجيج الرحى ونور السراج."], [11, "فتصبح هذه الأرض بأسرها قفرا خرابا، وتستعبد جميع هذه الأمم لملك بابل طوال سبعين سنة."]]}, {"l": "Zep 1:2", "n": "", "vs": [[2, "يقول الرب: «سأمحو محوا كل شيء عن وجه الأرض."]]}], "kwAr": "تدميرنا", "noteAr": ""}, {"kw": "he", "raw": "etc", "note": "etc", "refs": [], "kwAr": "أخذه", "noteAr": "إلخ."}, {"kw": "he hath changed", "raw": "Mic_2:10, Mic_1:15; 2Ki_17:23, 2Ki_17:24; 2Ch_36:20,2Ch_36:21; Isa_63:17, Isa_63:18", "note": "", "refs": [{"l": "Mic 2:10", "n": "", "vs": [[10, "هبوا واذهبوا، فهذا ليس مكان راحتكم، لأنه أصبح نجسا، مدمرا ولا يمكن ترميمه."]]}, {"l": "Mic 1:15", "n": "", "vs": [[15, "وأبعث إليكم بقاهر ياأهل مريشة، فيهرب من أمامه نبلاء إسرائيل إلى مغارة عدلام."]]}, {"l": "2Ki 17:23", "n": "", "vs": [[23, "فنفى الرب إسرائيل من حضرته كما نطق على لسان جميع عبيده الأنبياء، فسبي الإسرائيليون من أرضهم إلى أشور إلى هذا اليوم."]]}, {"l": "2Ki 17:24", "n": "", "vs": [[24, "ونقل ملك أشور أقواما من بابل وكوث وعوا وحماة وسفروايم، وأسكنهم مدن السامرة محل بني إسرائيل، فاستولوا على السامرة وأقاموا في مدنها."]]}, {"l": "2Ch 36:20", "n": "", "vs": [[20, "وسبى نبوخذناصر الذين نجوا من السيف إلى بابل، فأصبحوا عبيدا له ولأبنائه إلى أن قامت مملكة فارس."]]}, {"l": "2Ch 36:21", "n": "", "vs": [[21, "وذلك لكي يتم كلام الرب الذي نطق به على لسان إرميا، حتى تستوفي الأرض سبوتها، إذ أنها بقيت من غير إنتاج كل أيام خرابها حتى انقضاء سبعين سنة."]]}, {"l": "Isa 63:17", "n": "", "vs": [[17, "لماذا يارب تركتنا نضل عن طرقك وقسيت قلوبنا حتى لم نعد نتقيك؟ ارجع إلينا من أجل عبيدك، أسباط ميراثك."]]}, {"l": "Isa 63:18", "n": "", "vs": [[18, "قد داس أعداؤنا هيكلك الذي امتلكه شعبك المقدس زمنا يسيرا،"]]}], "kwAr": "واستبدل", "noteAr": ""}, {"kw": "turning away he", "raw": "or, instead of restoring", "note": "or, instead of restoring", "refs": [], "kwAr": "وقسم", "noteAr": "أو: «بدلا من أن يرد»."}], "arS": [["في ", []], ["ذلك", ["H1931"]], [" ", []], ["اليوم", ["H3117"]], [" ", []], ["يسخر", ["H5375"]], [" أعداؤكم منكم، ", []], ["وتنوحون", ["H5091"]], [" ", []], ["بمثل", ["H4912"]], [" هذا ", []], ["الرثاء", ["H5093", "H5092"]], [": «قد تم ", []], ["تدميرنا", ["H7703", "H7703"]], [" ", []], ["واستبدل", ["H4171"]], [" الرب ", []], ["نصيب", ["H2506"]], [" ", []], ["شعبه", ["H5971"]], [". ", []], ["كيف", ["H349"]], [" ", []], ["أخذه", ["H4185"]], [" منا ", []], ["وقسم", ["H2505"]], [" ", []], ["حقولنا", ["H7704"]], [" بين ", []], ["آسرينا", ["H7728"]], ["؟»", []]]}, {"c": 2, "v": 5, "text": "لهذا لن يوجد بين جماعة الرب من يلقي القرعة ليقسم الأرض.", "groups": [{"kw": "cast", "raw": "Deu_32:8; Jos_18:4, Jos_18:10; Psa_16:6; Hos_9:3", "note": "", "refs": [{"l": "Deu 32:8", "n": "", "vs": [[8, "عندما قسم العلي الميراث على الأمم، وحين فرق بني آدم، أقام حدودا للشعوب على عدد بني إسرائيل،"]]}, {"l": "Jos 18:4", "n": "", "vs": [[4, "انتخبوا ثلاثة رجال من كل سبط، فأرسلهم لاستكشاف الأرض وتخطيطها بموجب أنصبتهم، ثم يرجعوا إلي."]]}, {"l": "Jos 18:10", "n": "", "vs": [[10, "فألقى يشوع بينهم القرعة في شيلوه في محضر الرب، حيث قسم الأرض على بني إسرائيل وفقا لأسباطهم."]]}, {"l": "Psa 16:6", "n": "", "vs": [[6, "في أرض بهيجة وقعت قسمة حصتي. فما أفضل هذا الميراث عندي!"]]}, {"l": "Hos 9:3", "n": "", "vs": [[3, "لن تظلوا مقيمين في أرض الرب بل يرجع أفرايم إلى ديار مصر، ويأكلوا لحما نجسا في أشور."]]}], "kwAr": "يلقي", "noteAr": ""}, {"kw": "the congregation", "raw": "Deu_23:2, Deu_23:8; Neh_7:61", "note": "", "refs": [{"l": "Deu 23:2", "n": "", "vs": [[2, "لا يدخل ابن زنى ولا أحد من ذريته حتى الجيل العاشر في جماعة الرب."]]}, {"l": "Deu 23:8", "n": "", "vs": [[8, "ومن يولد من ذريتهم في الجيل الثالث يدخل في جماعة الرب."]]}, {"l": "Neh 7:61", "n": "", "vs": [[61, "وهذا بيان بعشائر العائدين من تل ملح وتل حرشا كروب وأدون وإمير ممن أخفقوا في إثبات انتماء بيوت آبائهم ونسلهم إلى إسرائيل:"]]}], "kwAr": "جماعة الرب", "noteAr": ""}], "arS": [["لهذا", ["H3651"]], [" ", []], ["لن", ["H3808"]], [" ", []], ["يوجد", ["H1961"]], [" بين ", []], ["جماعة", ["H6951"]], [" ", []], ["الرب", ["H3068"]], [" من ", []], ["يلقي", ["H7993"]], [" ", []], ["القرعة", ["H1486"]], [" ", []], ["ليقسم", ["H2256"]], [" الأرض.", []]]}, {"c": 2, "v": 6, "text": "يقول الشعب للأنبياء: لا تتنبأوا بمثل هذه الأمور، لأن العار لن يلحق بنا.", "groups": [{"kw": "Prophesy ye", "raw": "etc. or, Prophesy not as they prophesy, Heb. Drop. etc. Isa_30:10; Jer_26:8, Jer_26:9, Jer_26:20-23; Eze_20:46, Eze_21:2; Amo_2:12, Amo_7:13; Act_4:17, Act_5:28, Act_5:40, Act_7:51; 1Th_2:15, 1Th_2:16", "note": "etc. or, Prophesy not as they prophesy, Heb. Drop. etc. Isa_30:10; Jer_26:8, Jer_26:9, Jer_26:20-23; Eze_20:46, Eze_21:2; Amo_2:12, Amo_7:13; Act_4:17, Act_5:28, Act_5:40, Act_7:51; 1Th_2:15, 1Th_2:16", "refs": [{"l": "Isa 30:10", "n": "", "vs": [[10, "ويقولون للأنبياء: «لا تتنبأوا لنا بما هو حق، بل كلمونا بالكلام المداهن وتنبأوا بالمخادعات."]]}, {"l": "Jer 26:8", "n": "", "vs": [[8, "فلما فرغ إرميا من الإدلاء بكل ما أمره الرب أن يخاطب به الشعب، قبض الكهنة والأنبياء وسائر الشعب عليه قائلين: «لابد أن تموت."]]}, {"l": "Jer 26:9", "n": "", "vs": [[9, "لماذا تنبأت باسم الرب قائلا: إن مصير هذا الهيكل سيكون كمصير شيلوه، وهذه المدينة تصير خربا مهجورة؟». وأحاط الشعب كله بإرميا في بيت الرب."]]}, {"l": "Jer 26:20-23", "n": "", "vs": [[20, "وكان هناك أيضا رجل آخر يدعى أوريا بن شمعيا من قرية يعاريم يتنبأ باسم الرب، فتنبأ على هذه المدينة وعلى هذه الأرض بمثل نبؤة إرميا."], [21, "فبلغ كلامه مسامع الملك يهوياقيم وجميع محاربيه الأشداء وسائر الرؤساء، فطلب الملك قتله، فلما سمع أوريا بذلك خاف وهرب إلى مصر."], [22, "فبعث الملك يهوياقيم رجالا إلى مصر، منهم ألناثان بن عكبور يصحبه نفر من المرافقين،"], [23, "فأخرجوا أوريا من مصر وأتوا به إلى الملك يهوياقيم فقتله بالسيف، وطرح جثته في مقابر عامة الناس."]]}, {"l": "Eze 20:46", "n": "", "vs": [[46, "«ياابن آدم، التفت نحو الجنوب وأنذره، وتنبأ على أرض الغابات في النقب"]]}, {"l": "Eze 21:2", "n": "", "vs": [[2, "«ياابن آدم: التفت نحو أورشليم وتنبأ على المقادس وعلى أرض إسرائيل"]]}, {"l": "Amo 2:12", "n": "", "vs": [[12, "ولكنكم سقيتم النذيرين خمرا، وأمرتم الأنبياء قائلين: لا تتنبأوا."]]}, {"l": "Amo 7:13", "n": "", "vs": [[13, "أما بيت إيل فلا تعد للتنبوء فيها، لأنها مقدس الملك ومقر المملكة»."]]}, {"l": "Act 4:17", "n": "", "vs": [[17, "ولكن لئلا يزداد هذا الأمر انتشارا بين الشعب، فلنهددهما ألا يذكرا هذا الاسم لأحد من الناس بعد الآن»."]]}, {"l": "Act 5:28", "n": "", "vs": [[28, "قائلا: «أمرناكم بشدة ألا تعلموا بهذا الاسم، ولكنكم قد ملأتم أورشليم بتعليمكم، وتريدون أن تحملونا مسئولية سفك دمه!»"]]}, {"l": "Act 5:40", "n": "", "vs": [[40, "فعمل أعضاء المجلس بهذه النصيحة، واستدعوا الرسل، فجلدوهم وأمروهم ألا يعلموا باسم يسوع، ثم أطلقوهم."]]}, {"l": "Act 7:51", "n": "", "vs": [[51, "ثم قال استفانوس: «ياأصحاب الرقاب الصلبة والقلوب والآذان غير المختونة! إنكم دائما تقاومون الروح القدس. وكما فعل آباؤكم تفعلون!"]]}, {"l": "1Th 2:15", "n": "", "vs": [[15, "الذين قتلوا الرب يسوع والأنبياء واضطهدونا نحن أيضا، وهم لا يرضون الله ويعادون الناس جميعا،"]]}, {"l": "1Th 2:16", "n": "", "vs": [[16, "إذ يمنعوننا من تبشير الأمم ليخلصوا، وبذلك يستكملون خطاياهم كل حين، ولكن الغضب قد حل عليهم إلى الغاية."]]}], "kwAr": "لا تتنبأوا", "noteAr": "إلخ. أو: «لا تتنبأوا كما يتنبأون»؛ بالعبرية: «تقطّروا» إلخ. انظر إش 30: 10؛ إر 26: 8، 9؛ 26: 20-23؛ حز 20: 46؛ 21: 2؛ عا 2: 12؛ 7: 13؛ أع 4: 17؛ 5: 28، 40؛ 7: 51؛ 1تس 2: 15، 16"}, {"kw": "they shall not prophesy", "raw": "Psa_74:9; Eze_3:26; Amo_8:11-13", "note": "", "refs": [{"l": "Psa 74:9", "n": "", "vs": [[9, "لم نعد نشهد رموز عبادتنا، ولم يبق نبي بعد، وليس بيننا من يعرف متى تكون خاتمة الأمر."]]}, {"l": "Eze 3:26", "n": "", "vs": [[26, "وألصق لسانك بحنكك فتبكم وتكف عن تقريعهم لأنهم شعب متمرد."]]}, {"l": "Amo 8:11-13", "n": "", "vs": [[11, "ستأتي أيام أجعل فيها المجاعة تنتشر في الأرض، لا مجاعة إلى الخبز، ولا ظمأ إلى الماء إنما لسماع كلام الرب، يقول السيد الرب."], [12, "فيهيمون من بحر إلى بحر، ومن الشمال إلى الشرق. يذهبون ويجيئون بحثا عن كلمة الرب ولا يحظون بها."], [13, "في ذلك اليوم يغشى على العذارى الجميلات والفتيان من فرط الظمإ."]]}], "kwAr": "بمثل هذه الأمور", "noteAr": ""}, {"kw": "that they", "raw": "Jer_6:14, Jer_6:15, Jer_8:11, Jer_8:12", "note": "", "refs": [{"l": "Jer 6:14", "n": "", "vs": [[14, "يعالجون جراح شعبي باستخفاف قائلين: سلام، سلام. في حين لا يوجد سلام."]]}, {"l": "Jer 6:15", "n": "", "vs": [[15, "هل خجلوا لأنهم اقترفوا الرجس؟ كلا! لم يخزوا قط ولم يعرفوا الخجل، لذلك سيسقطون بين الساقطين، وحين أعاقبهم يطوح بهم»."]]}, {"l": "Jer 8:11", "n": "", "vs": [[11, "ويعالجون جراح شعبي باستخفاف قائلين: سلام، سلام في حين لا يوجد سلام."]]}, {"l": "Jer 8:12", "n": "", "vs": [[12, "هل خجلوا عندما اقترفوا الرجس؟ كلا! لم يخزوا قط ولم يعرفوا الخجل. لذلك سيسقطون بين الساقطين، وحين أعاقبهم يطوح بهم»، يقول الرب."]]}], "kwAr": "لن يلحق بنا", "noteAr": ""}], "arS": [["يقول", ["H559"]], [" الشعب ", []], ["للأنبياء", ["H5197"]], [": ", []], ["لا", ["H408"]], [" ", []], ["تتنبأوا", ["H5197"]], [" بمثل ", []], ["هذه", ["H428"]], [" الأمور، لأن ", []], ["العار", ["H3639"]], [" ", []], ["لن", ["H3808"]], [" ", []], ["يلحق", ["H5253"]], [" بنا.", []]]}, {"c": 2, "v": 7, "text": "آه يابيت يعقوب؟ هل نفد صبر روح الرب؟ أهذه الأفعال صدرت عنه؟ أليست كلماتي صالحة للسالكين بالاستقامة؟", "groups": [{"kw": "named", "raw": "Mic_3:9; Isa_48:1, Isa_48:2, Isa_58:1; Jer_2:4; Mat_3:8; Joh_8:39; Rom_2:28, Rom_2:29, Rom_9:6-13; 2Ti_3:5", "note": "", "refs": [{"l": "Mic 3:9", "n": "", "vs": [[9, "استمعوا هذا يارؤساء بيت يعقوب وقضاة شعب إسرائيل الذين يكرهون العدل ويحرفون الحق."]]}, {"l": "Isa 48:1", "n": "", "vs": [[1, "اسمعوا هذا يابيت يعقوب المدعوين باسم إسرائيل الخارجين من صلب يهوذا، الحالفين باسم الرب، المستشهدين بإله إسرائيل باطلا وكذبا"]]}, {"l": "Isa 48:2", "n": "", "vs": [[2, "الذين يدعون أنفسهم أهل المدينة المقدسة، ويعتمدون على إله إسرائيل، الرب القدير:"]]}, {"l": "Isa 58:1", "n": "", "vs": [[1, "ناد بأعلى صوتك، لا تصمت. اهتف بصوتك كنفير بوق، وأخبر شعبي بإثمهم، وذرية يعقوب بخطاياهم."]]}, {"l": "Jer 2:4", "n": "", "vs": [[4, "اسمعوا كلمة الرب ياذرية يعقوب، وياجميع عشائر إسرائيل:"]]}, {"l": "Mat 3:8", "n": "", "vs": [[8, "فأثمروا ثمرا يليق بالتوبة."]]}, {"l": "Joh 8:39", "n": "", "vs": [[39, "فاعترضوه قائلين: «أبونا هو إبراهيم!» فقال لو كنتم أولاد إبراهيم لعملتم أعمال إبراهيم."]]}, {"l": "Rom 2:28", "n": "", "vs": [[28, "فليس بيهودي من كان يهوديا في الظاهر، ولا بختان ما كان ظاهرا في اللحم."]]}, {"l": "Rom 2:29", "n": "", "vs": [[29, "وإنما اليهودي هو من كان يهوديا في الباطن، والختان هو ما كان ختانا للقلب بالروح لا بالحرف. وهذا يأتيه المدح لا من الناس بل من الله!"]]}, {"l": "Rom 9:6-13", "n": "", "vs": [[6, "لست أعني أن كلمة الله قد خابت. إذ ليس جميع بني إسرائيل هم إسرائيل؛"], [7, "وليسوا، لأنهم نسل إبراهيم، كلهم أولادا لله، بل (كما قد كتب): «بإسحاق سيكون لك نسل يحمل اسمك»."], [8, "أي أن أولاد الجسد ليسوا هم أولاد الله، بل أولاد الوعد يحسبون نسلا."], [9, "فهذه هي كلمة الوعد: «في مثل هذا الوقت أعود، ويكون لسارة ابن»."], [10, "ليس ذلك فقط، بل إن رفقة أيضا، وقد حبلت من رجل واحد، من إسحاق أبينا،"], [11, "ولم يكن الولدان قد ولدا بعد ولا فعلا خيرا أو شرا، وذلك كي يبقى قصد الله من جهة الاختيار"], [12, "لا على
