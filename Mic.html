ذ يقول: «اليوم، إن سمعتم صوته،"]]}, {"l": "Heb 3:8", "n": "", "vs": [[8, "فلا تقسوا قلوبكم، كما حدث قديما، حين أثار آباؤكم غضبي، يوم التجربة في الصحراء."]]}], "kwAr": "استمعوا", "noteAr": ""}, {"kw": "Arise", "raw": "The manner of raising attention, says Abp. Newcome, in Mic_6:1, Mic_6:2, by calling a man to urge his plea in the face of all nature, and on the inanimate creation to hear the expostulation of Jehovah with his people, is truly awakening and magnificent. The words of Jehovah follow in Mic_6:3-5; and Gods mercies having been set before the people, one of them is introduced in a beautiful manner, asking what his duty is towards so gracious a God, Mic_6:6, Mic_6:7. The answer follows in the words of the prophet, Mic_6:8.", "note": "The manner of raising attention, says Abp. Newcome, in Mic_6:1, Mic_6:2, by calling a man to urge his plea in the face of all nature, and on the inanimate creation to hear the expostulation of Jehovah with his people, is truly awakening and magnificent. The words of Jehovah follow in Mic_6:3-5; and Gods mercies having been set before the people, one of them is introduced in a beautiful manner, asking what his duty is towards so gracious a God, Mic_6:6, Mic_6:7. The answer follows in the words of the prophet, Mic_6:8.", "refs": [{"l": "Mic 6:1", "n": "", "vs": [[1, "استمعوا إلى ما يقوله الرب: انهض وأعلن دعواك أمام الجبال، ولتكن الأكام شاهدة على كلامك."]]}, {"l": "Mic 6:2", "n": "", "vs": [[2, "استمعي ياجبال إلى شكوى الرب، وأصغي ياأسس الأرض الثابتة، فإن لدى الرب شكوى على شعبه وهو يحاكم إسرائيل."]]}, {"l": "Mic 6:3-5", "n": "", "vs": [[3, "بماذا أسأت إليك ياشعبي وبما ضايقتك؟ أجبني."], [4, "لقد أخرجتك من ديار مصر، وافتديتك من بيت العبودية، وأرسلت أمامك موسى وهرون ومريم"], [5, "اذكر ياشعبي ما تآمر به عليك بالاق ملك موآب، وما أجابه به بلعام بن بعور. واذكر ما أحسنت به إليك في رحلتك من شطيم إلى الجلجال لكي تدرك عدل الرب."]]}, {"l": "Mic 6:6", "n": "", "vs": [[6, "يارب: بماذا أتقدم عندما أمثل أمام الرب وأسجد في حضرة الله العلي؟ هل أتقدم منه بمحرقات وبعجول حولية؟"]]}, {"l": "Mic 6:7", "n": "", "vs": [[7, "هل يسر الرب بألوف أنهار زيت؟ هل أقرب بكري فداء إثمي وثمرة جسدي تكفيرا عن خطيئة نفسي؟"]]}, {"l": "Mic 6:8", "n": "", "vs": [[8, "لقد أوضح لك الرب أيها الإنسان ما هو صالح. وماذا يبتغي منك سوى أن تتوخى العدل، وتحب الرحمة، وتسلك متواضعا مع إلهك؟"]]}], "kwAr": "انهض", "noteAr": "يقول رئيس الأساقفة نيوكم: إن طريقة إثارة الانتباه في ميخا 6: 1، 2 بدعوة الإنسان إلى عرض دعواه أمام الطبيعة كلها، وبدعوة الخليقة الجامدة إلى سماع مخاصمة يهوه لشعبه، مدهشة حقا ومهيبة. وتتبع ذلك كلمات يهوه في ميخا 6: 3-5؛ وبعد أن تُعرض مراحم الله أمام الشعب يُقدَّم أحدهم بطريقة بديعة سائلا عن واجبه نحو إله كريم كهذا، ميخا 6: 6، 7. ثم يأتي الجواب على لسان النبي، ميخا 6: 8."}, {"kw": "contend", "raw": "Deu_4:26, Deu_32:1; Psa_50:1, Psa_50:4; Isa_1:2; Jer_22:29; Eze_36:1, Eze_36:8; Luk_19:40", "note": "", "refs": [{"l": "Deu 4:26", "n": "", "vs": [[26, "فإنني أشهد عليكم اليوم السماء والأرض، أنكم تنقرضون سريعا من الأرض التي أنتم عابرون نهر الأردن إليها لترثوها، ولن تطول بكم الأيام عليها، إذ لابد أنكم حينئذ هالكون."]]}, {"l": "Deu 32:1", "n": "", "vs": [[1, "«أصغي أيتها السماوات فأتكلم ولتنصت الأرض إلى أقوال فمي."]]}, {"l": "Psa 50:1", "n": "", "vs": [[1, "الرب الإله القدير تكلم، ودعا الأرض للمحاكمة من مشرق الشمس إلى مغربها."]]}, {"l": "Psa 50:4", "n": "", "vs": [[4, "ينادي السماوات من العلى، والأرض أيضا من تحت لكي يدين شعبه، قائلا:"]]}, {"l": "Isa 1:2", "n": "", "vs": [[2, "اسمعي أيتها السماوات وأصغي أيتها الأرض لأن الرب يتكلم: «ربيت أبناء وأنشأتهم ولكنهم تمردوا علي."]]}, {"l": "Jer 22:29", "n": "", "vs": [[29, "ياأرض! ياأرض! ياأرض! اسمعي كلمة الرب:"]]}, {"l": "Eze 36:1", "n": "", "vs": [[1, "»أما أنت ياابن آدم، فتنبأ لجبال إسرائيل وقل: اسمعي ياجبال إسرائيل كلمة الرب."]]}, {"l": "Eze 36:8", "n": "", "vs": [[8, "أما أنت ياجبال إسرائيل فتفرخين فروعك، وتحمل أشجارك أثمارا لشعبي إسرائيل لأن موعد رجوعهم بات وشيكا."]]}, {"l": "Luk 19:40", "n": "", "vs": [[40, "فأجابهم قائلا: «أقول لكم: إن سكت هؤلاء، هتفت الحجارة!»"]]}], "kwAr": "وأعلن دعواك", "noteAr": ""}, {"kw": "before", "raw": "or, with, Mic_1:4; Isa_2:12-14", "note": "or, with, Mic_1:4; Isa_2:12-14", "refs": [{"l": "Mic 1:4", "n": "", "vs": [[4, "فتذوب الجبال من تحت قدميه، وتتصدع الوديان كالشمع أمام النار، كالمياه المنصبة في المنخفضات."]]}, {"l": "Isa 2:12-14", "n": "", "vs": [[12, "فإن للرب القدير يوما فيه يوضع كل متعظم ومتكبر ومتغطرس."], [13, "ويسمو على أرز لبنان المتعالي الشامخ، وعلى كل بلوط باشان،"], [14, "وعلى كل جبل أشم، وعلى التلال المرتفعة،"]]}], "kwAr": "أمام", "noteAr": "أو: «مع». انظر مي 1: 4؛ إش 2: 12-14"}, {"kw": "let", "raw": "Eze_37:4", "note": "", "refs": [{"l": "Eze 37:4", "n": "", "vs": [[4, "فقال لي: «تنبأ على هذه العظام وقل لها: اسمعي أيتها العظام اليابسة كلمة الرب:"]]}], "kwAr": "ولتكن", "noteAr": ""}], "arS": [["استمعوا", ["H8085"]], [" إلى ", []], ["ما", ["H834"]], [" ", []], ["يقوله", ["H559"]], [" ", []], ["الرب", ["H3068"]], [": ", []], ["انهض", ["H6965"]], [" ", []], ["وأعلن", ["H7378"]], [" دعواك ", []], ["أمام", ["H854"]], [" ", []], ["الجبال", ["H2022"]], ["، ولتكن ", []], ["الأكام", ["H1389"]], [" ", []], ["شاهدة", ["H8085"]], [" على ", []], ["كلامك", ["H6963"]], [".", []]]}, {"c": 6, "v": 2, "text": "استمعي ياجبال إلى شكوى الرب، وأصغي ياأسس الأرض الثابتة، فإن لدى الرب شكوى على شعبه وهو يحاكم إسرائيل.", "groups": [{"kw": "foundations", "raw": "Deu_32:22; 2Sa_22:8, 2Sa_22:16; Psa_104:5; Pro_8:29; Jer_31:37", "note": "", "refs": [{"l": "Deu 32:22", "n": "", "vs": [[22, "فها قد أضرم غضبي نارا تحرق حتى الهاوية السفلى، وتأكل الأرض وغلاتها، وتشعل أسس الجبال."]]}, {"l": "2Sa 22:8", "n": "", "vs": [[8, "عندئذ ارتجت الأرض وتزلزلت. ارتجفت أساسات السماوات واهتزت لأن الرب غضب."]]}, {"l": "2Sa 22:16", "n": "", "vs": [[16, "ظهرت مجاري المياه العميقة وانكشفت أسس المسكونة من زجر الرب ومن ريح أنفه اللافحة."]]}, {"l": "Psa 104:5", "n": "", "vs": [[5, "المؤسس الأرض على قواعدها فلا تتزعزع إلى الدهر والأبد."]]}, {"l": "Pro 8:29", "n": "", "vs": [[29, "عندما قرر للبحر تخوما لا تتجاوزها مياهه متعدية على أمر الرب، وحين رسم أسس الأرض،"]]}, {"l": "Jer 31:37", "n": "", "vs": [[37, "وهذا ما يعلنه الرب: «إن أمكن قياس السماوات من فوق، والتنقيب عن أسس الأرض من تحت، عندئذ أنبذ ذرية إسرائيل بسبب كل ما ارتكبوه»."]]}], "kwAr": "ياأسس", "noteAr": ""}, {"kw": "a controversy", "raw": "Isa_1:18, Isa_5:3, Isa_43:26; Jer_2:9, Jer_2:29-35, Jer_25:31; Eze_20:35, Eze_20:36; Hos_4:1; Hos_12:2", "note": "", "refs": [{"l": "Isa 1:18", "n": "", "vs": [[18, "تعالوا نتحاجج يقول الرب، إن كانت خطاياكم كلطخات قرمزية فإنها تبيض كالثلج، وإن كانت حمراء كصبغ الدودي تصبح في نقاء الصوف!"]]}, {"l": "Isa 5:3", "n": "", "vs": [[3, "والآن ياأهل أورشليم ورجال يهوذا، احكموا بيني وبين كرمي."]]}, {"l": "Isa 43:26", "n": "", "vs": [[26, "هيا إلى المحاكمة، واعرض علي دعواك، لتتبرر"]]}, {"l": "Jer 2:9", "n": "", "vs": [[9, "لذلك أخاصمكم وأخاصم أحفادكم يقول الرب."]]}, {"l": "Jer 2:29-35", "n": "", "vs": [[29, "لماذا تخاصمونني وأنتم كلكم قد تمردتم علي؟"], [30, "عبثا عاقبت بنيكم، فهم أبوا التقويم وافترست سيوفكم أنبياءكم كأسد كاسر."], [31, "وأنت أيها الجيل، اسمع قضاء الرب: أكنت صحراء لإسرائيل أو أرض ظلام دامس؟ إذا لماذا يقول شعبي: نحن طليقون نسعى حيث شئنا، ولن نقبل إليك بعد؟"], [32, "هل تنسى عذراء زينتها؟ أو عروس حلي زفافها؟ لكن شعبي نسيني أياما لا تحصى."], [33, "لكم برعتم في تمهيد طرقكم طلبا للشهوات، فعلمتم أساليبكم حتى للشريرات."], [34, "فوجد في أذيالكم أيضا دم المساكين الأبرياء الذين لم تقبضوا عليهم متلبسين بجريمة الاقتحام. ومع كل ذلك"], [35, "تقولون: نحن أبرياء، فلذلك قد تحول عنا غضب الرب. غير أني سأدينكم لقولكم إننا لم نخطيء."]]}, {"l": "Jer 25:31", "n": "", "vs": [[31, "قد بلغت الجلبة جميع أقاصي الأرض، لأن للرب دعوى على الأمم، فيدخل في محاكمة مع البشر، ويلقي بالأشرار إلى السيف."]]}, {"l": "Eze 20:35", "n": "", "vs": [[35, "وآتي بكم إلى برية الأمم فأحاكمكم هناك مواجهة،"]]}, {"l": "Eze 20:36", "n": "", "vs": [[36, "وكما حاكمت أسلافكم في برية ديار مصر، أحاكمكم أنتم أيضا."]]}, {"l": "Hos 4:1", "n": "", "vs": [[1, "اسمعوا كلمة الرب يابني إسرائيل، لأن للرب دعوى على أهل الأرض إذ خلت الأرض من الأمانة والإحسان ومعرفة الله."]]}, {"l": "Hos 12:2", "n": "", "vs": [[2, "للرب دعوى على يهوذا، وسيعاقب إسرائيل بمقتضى طرقه ويجازيه بموجب أعماله."]]}], "kwAr": "شكوى", "noteAr": ""}], "arS": [["استمعي", ["H8085"]], [" ", []], ["ياجبال", ["H2022"]], [" إلى ", []], ["شكوى", ["H7379"]], [" ", []], ["الرب", ["H3068"]], ["، وأصغي ", []], ["ياأسس", ["H4146"]], [" ", []], ["الأرض", ["H776"]], [" ", []], ["الثابتة", ["H386"]], ["، ", []], ["فإن", ["H3588"]], [" لدى ", []], ["الرب", ["H3068"]], [" ", []], ["شكوى", ["H7379"]], [" ", []], ["على", ["H5973"]], [" ", []], ["شعبه", ["H5971"]], [" وهو ", []], ["يحاكم", ["H3198"]], [" ", []], ["إسرائيل", ["H3478"]], [".", []]]}, {"c": 6, "v": 3, "text": "بماذا أسأت إليك ياشعبي وبما ضايقتك؟ أجبني.", "groups": [{"kw": "O my", "raw": "Mic_6:5; Psa_50:7, Psa_81:8, Psa_81:13", "note": "", "refs": [{"l": "Mic 6:5", "n": "", "vs": [[5, "اذكر ياشعبي ما تآمر به عليك بالاق ملك موآب، وما أجابه به بلعام بن بعور. واذكر ما أحسنت به إليك في رحلتك من شطيم إلى الجلجال لكي تدرك عدل الرب."]]}, {"l": "Psa 50:7", "n": "", "vs": [[7, "اسمع ياشعبي فأتكلم. ياإسرائيل إني أشهد عليك: «أنا الله إلهك."]]}, {"l": "Psa 81:8", "n": "", "vs": [[8, "اسمع ياشعبي فأحذرك، ياإسرائيل هلا سمعت لي؟"]]}, {"l": "Psa 81:13", "n": "", "vs": [[13, "لو سمع لي شعبي وسلك إسرائيل في طرقي،"]]}], "kwAr": "ياشعبي", "noteAr": ""}, {"kw": "what", "raw": "Jer_2:5, Jer_2:31", "note": "", "refs": [{"l": "Jer 2:5", "n": "", "vs": [[5, "أي خطأ وجده في آباؤكم حتى نبذوني وضلوا وراء الباطل وصاروا باطلا؟"]]}, {"l": "Jer 2:31", "n": "", "vs": [[31, "وأنت أيها الجيل، اسمع قضاء الرب: أكنت صحراء لإسرائيل أو أرض ظلام دامس؟ إذا لماذا يقول شعبي: نحن طليقون نسعى حيث شئنا، ولن نقبل إليك بعد؟"]]}], "kwAr": "بماذا", "noteAr": ""}, {"kw": "wherein", "raw": "Isa_43:22, Isa_43:23", "note": "", "refs": [{"l": "Isa 43:22", "n": "", "vs": [[22, "ولكنك لم تلتمسني يايعقوب، بل سئمت مني ياإسرائيل."]]}, {"l": "Isa 43:23", "n": "", "vs": [[23, "لم تأتني بشاة لذبيحة محرقة، ولم تكرمني بقرابينك، مع أني لم أثقل عليك بتقدمة، ولا أرهقتك بطلب اللبان."]]}], "kwAr": "وبما", "noteAr": ""}, {"kw": "testify", "raw": "Psa_51:4; Rom_3:4, Rom_3:5, Rom_3:19", "note": "", "refs": [{"l": "Psa 51:4", "n": "", "vs": [[4, "إليك وحدك أخطأت، والشر قدام عينيك صنعت. لكي تتبرر إذا حكمت وتزكو إذا قضيت."]]}, {"l": "Rom 3:4", "n": "", "vs": [[4, "حاشا! وإنما، ليكن الله صادقا وكل إنسان كاذبا، كما قد كتب: «لكي تتبرر في كلامك، وتظفر متى حكمت»."]]}, {"l": "Rom 3:5", "n": "", "vs": [[5, "ولكن، إن كان إثمنا يبين بر الله، فماذا نقول؟ أيكون الله ظالما إذا أنزل بنا الغضب؟ أتكلم هنا بمنطق البشر:"]]}, {"l": "Rom 3:19", "n": "", "vs": [[19, "ونحن نعلم أن كل ما تقوله الشريعة إنما تخاطب به الذين هم تحت الشريعة، لكي يسد كل فم ويقع العالم كله تحت دينونة من الله."]]}], "kwAr": "أجبني", "noteAr": ""}], "arS": [["بماذا", ["H4100"]], [" ", []], ["أسأت", ["H6213"]], [" إليك ", []], ["ياشعبي", ["H5971"]], [" ", []], ["وبما", ["H4100"]], [" ", []], ["ضايقتك", ["H3811"]], ["؟ ", []], ["أجبني", ["H6030"]], [".", []]]}, {"c": 6, "v": 4, "text": "لقد أخرجتك من ديار مصر، وافتديتك من بيت العبودية، وأرسلت أمامك موسى وهرون ومريم", "groups": [{"kw": "I brought", "raw": "Exo_12:51, Exo_14:30,Exo_14:31, Exo_20:2; Deu_4:20,Deu_4:34, Deu_5:6, Deu_9:26; Neh_9:9-11; Psa_78:51-53, Psa_106:7-10, Psa_136:10,Psa_136:11; Isa_63:9-12; Jer_32:21; Eze_20:5-9; Amo_2:10; Act_7:36", "note": "", "refs": [{"l": "Exo 12:51", "n": "", "vs": [[51, "في ذلك اليوم عينه أخرج الرب بني إسرائيل من أرض مصر بحسب فرق عشائرهم."]]}, {"l": "Exo 14:30", "n": "", "vs": [[30, "وهكذا أنقذ الرب في ذلك اليوم الإسرائيليين من يد المصريين، وشاهدوا جثث المصريين مطروحة على شاطيء البحر."]]}, {"l": "Exo 14:31", "n": "", "vs": [[31, "وعندما شهد الإسرائيليون القوة العظيمة التي عامل بها الرب المصريين، خاف الشعب الرب وآمنوا به وبموسى عبده."]]}, {"l": "Exo 20:2", "n": "", "vs": [[2, "«أنا هو الرب إلهك الذي أخرجك من أرض مصر ديار عبوديتك."]]}, {"l": "Deu 4:20", "n": "", "vs": [[20, "أما أنتم فقد اختاركم الرب وأخرجكم من أتون الحديد من ديار مصر لتكونوا له شعب ميراثه، كما أنتم اليوم."]]}, {"l": "Deu 4:34", "n": "", "vs": [[34, "وهل حاول إله قط أن يأخذ لنفسه شعبا من وسط شعب آخر مجريا تجارب وآيات ومعجزات وحروبا وقدرة فائقة وقوة شديدة ومخاوف عظيمة كما صنع معكم الرب إلهكم في مصر على مرأى منكم؟"]]}, {"l": "Deu 5:6", "n": "", "vs": [[6, "أنا هو الرب إلهك الذي حررك من سجن العبودية في ديار مصر."]]}, {"l": "Deu 9:26", "n": "", "vs": [[26, "وابتهلت إلى الرب قائلا: ياسيد الرب، لا تهلك شعبك وميراثك الذي افتديته بقوتك العظيمة، وأخرجته من مصر بقدرة فائقة."]]}, {"l": "Neh 9:9-11", "n": "", "vs": [[9, "أنت رأيت مذلة آبائنا في مصر واستجبت إلى صراخهم عند البحر الأحمر،"], [10, "فأجريت عجائب وآيات على فرعون وعلى سائر رجاله وعلى شعب أرضه كله، لأنك علمت أنهم تجبروا عليهم، فأشهرت بهذه العجائب اسمك إلى هذا اليوم،"], [11, "إذ فلقت البحر أمام آبائنا، فاجتازوا في وسطه على اليابسة، وطرحت مطارديهم في الأعماق كما يطرح حجر في مياه هائجة،"]]}, {"l": "Psa 78:51-53", "n": "", "vs": [[51, "وأباد كل أبكار مصر، طلائع ثمار الرجولة في خيام حام."], [52, "ثم ساق شعبه كالغنم واقتادهم مثل القطيع في الصحراء."], [53, "هداهم آمنين فلم يفزعوا. أما أعداؤهم فطغى البحر عليهم وغمرهم."]]}, {"l": "Psa 106:7-10", "n": "", "vs": [[7, "لم يفهم آباؤنا في مصر عجائبك، ولم يتذكروا وفرة مراحمك، بل تمردوا عليك عند البحر الأحمر."], [8, "لكنك خلصتهم من أجل اسمك إعلانا لقوتك العظيمة."], [9, "انتهرت البحر الأحمر، فجف، واجتزت بهم عبر اللجج كأنهم على أرض جافة"], [10, "أنقذتهم من يد مبغضيهم وافتديتهم من قبضة العدو."]]}, {"l": "Psa 136:10", "n": "", "vs": [[10, "الذي ضرب مصر مع أبكارها، لأن رحمته إلى الأبد تدوم."]]}, {"l": "Psa 136:11", "n": "", "vs": [[11, "وأخرج بني إسرائيل من وسطهم، لأن رحمته إلى الأبد تدوم."]]}, {"l": "Isa 63:9-12", "n": "", "vs": [[9, "فتضايق في كل ضيقاتهم، وملاك حضرته أنقذهم، وبفضل محبته وحنانه افتداهم ورفعهم وحملهم طوال الأيام الغابرة."], [10, "لكنهم تمردوا وأحزنوا روحه فاستحال إلى عدو لهم وحاربهم بنفسه."], [11, "ثم تذكروا الأيام القديمة، أيام موسى عبده وتساءلوا: أين من أصعدنا من البحر مع راعي قطيعه؟ أين من أقام روحه القدوس في وسطنا؟"], [12, "من جعل ذراع قوته المجيدة تسير إلى يمين موسى؟ من شق مياه البحر أمامنا ليكتسب اسما أبديا؟"]]}, {"l": "Jer 32:21", "n": "", "vs": [[21, "وأخرجت شعبك إسرائيل من ديار مصر بآيات ومعجزات، وبيد قديرة وذراع ممدودة، وما ألقيته من خوف شديد في قلوب أهلها،"]]}, {"l": "Eze 20:5-9", "n": "", "vs": [[5, "وقل لهم: هذا ما يعلنه السيد الرب: في اليوم الذي اصطفيت فيه إسرائيل، وحلفت لذرية بيت يعقوب وأعلنت لهم عن نفسي في ديار مصر، حلفت لهم قائلا: أنا الرب إلهكم."], [6, "في ذلك اليوم أقسمت لهم أن أخرجهم من ديار مصر إلى الأرض التي استكشفتها لهم والتي تفيض لبنا وعسلا، فخر كل الأراضي،"], [7, "وقلت لهم: لينبذ كل منكم الأرجاس التي تنجس عينيه، ولا تتدنسوا بأصنام مصر؛ أنا الرب إلهكم."], [8, "ولكنهم تمردوا علي ولم يسمعوا لي، ولم يتركوا الأرجاس التي تنجس عيونهم، ولم يهجروا أصنام مصر. فقلت: سأسكب عليهم غضبي وأنفث فيهم كامل سخطي في وسط ديار مصر."], [9, "غير أني تصرفت على غير ذلك إكراما لاسمي، لئلا يتنجس أمام عيون الأمم التي يسكن شعب إسرائيل بينها. إذ أعلنت نفسي أمام عيون الأمم حين أخرجت شعب إسرائيل من ديار مصر."]]}, {"l": "Amo 2:10", "n": "", "vs": [[10, "كما أخرجتكم من ديار مصر وقدت طريقكم عبر الصحراء طوال أربعين سنة لترثوا أرض الأموريين."]]}, {"l": "Act 7:36", "n": "", "vs": [[36, "وقد أخرج الشعب من مصر وهو يجري عجائب ومعجزات فيها، وفي البحر الأحمر، وفي الصحراء مدة أربعين سنة."]]}], "kwAr": "أخرجتك", "noteAr": ""}, {"kw": "and redeemed", "raw": "Deu_7:8, Deu_15:15, Deu_24:18; 2Sa_7:23", "note": "", "refs": [{"l": "Deu 7:8", "n": "", "vs": [[8, "بل من محبته، وحفاظا على القسم الذي أقسم به لآبائكم، أخرجكم بقوة فائقة، وفداكم من نير عبودية فرعون ملك مصر."]]}, {"l": "Deu 15:15", "n": "", "vs": [[15, "واذكروا أنكم كنتم عبيدا في ديار مصر، فحرركم الرب إلهكم. لذلك أوصيكم بهذا الأمر اليوم."]]}, {"l": "Deu 24:18", "n": "", "vs": [[18, "واذكروا أنكم كنتم عبيدا في ديار مصر فأنقذكم الرب إلهكم. لهذا أوصيكم بالعدل."]]}, {"l": "2Sa 7:23", "n": "", "vs": [[23, "وأية أمة على الأرض تماثل شعبك إسرائيل الذي اخترته وافتديته ليكون لك شعبا ويذيع اسمك، وأجريت عظائم ومعجزات مذهلة، لتطرد من أمام شعبك الذي أنقذته من مصر، أمما مع آلهتها."]]}], "kwAr": "وافتديتك", "noteAr": ""}, {"kw": "Moses", "raw": "Exo_15:20,Exo_15:21; Num_12:1", "note": "", "refs": [{"l": "Exo 15:20", "n": "", "vs": [[20, "عندئذ أخذت مريم النبية أخت هرون، الدف بيدها، فتبعها جميع النساء بالدف والرقص."]]}, {"l": "Exo 15:21", "n": "", "vs": [[21, "فكانت مريم تجاوبهن: «رنموا للرب لأنه قد تمجد جدا. الفرس وراكبه قد طرحهما في البحر»."]]}, {"l": "Num 12:1", "n": "", "vs": [[1, "وانتقدت مريم وهرون موسى لزواجه من امرأة كوشية،"]]}], "kwAr": "موسى", "noteAr": ""}], "arS": [["لقد ", []], ["أخرجتك", ["H5927"]], [" من ", []], ["ديار", ["H4480", "H776"]], [" ", []], ["مصر", ["H4714"]], ["، ", []], ["وافتديتك", ["H6299"]], [" من ", []], ["بيت", ["H4480", "H1004"]], [" ", []], ["العبودية", ["H5650"]], ["، ", []], ["وأرسلت", ["H7971"]], [" ", []], ["أمامك", ["H6440"]], [" ", []], ["موسى", ["H4872"]], [" ", []], ["وهرون", ["H175"]], [" ", []], ["ومريم", ["H4813"]]]}, {"c": 6, "v": 5, "text": "اذكر ياشعبي ما تآمر به عليك بالاق ملك موآب، وما أجابه به بلعام بن بعور. واذكر ما أحسنت به إليك في رحلتك من شطيم إلى الجلجال لكي تدرك عدل الرب.", "groups": [{"kw": "remember", "raw": "Deu_8:2, Deu_8:18, Deu_9:7, Deu_16:3; Psa_103:1, Psa_103:2, Psa_111:4; Eph_2:11", "note": "", "refs": [{"l": "Deu 8:2", "n": "", "vs": [[2, "وتذكروا كيف قادكم الرب إلهكم في كل طريق الصحراء هذه الأربعين سنة ليذلكم ويمتحنكم، فيعرف ما في قلوبكم: إن كنتم تحفظون أوامره أم تعصونه."]]}, {"l": "Deu 8:18", "n": "", "vs": [[18, "ولكن اذكروا أن الرب إلهكم هو الذي يمنحكم القوة لإحراز الثروة، وفاء بوعده الذي أقسم عليه لآبائكم كما في هذا اليوم."]]}, {"l": "Deu 9:7", "n": "", "vs": [[7, "اذكروا ولا تنسوا كيف أسخطتم الرب إلهكم عليكم في الصحراء، فمنذ أن غادرتم ديار مصر حتى بلغتم هذا المكان وأنتم تقاومون الرب."]]}, {"l": "Deu 16:3", "n": "", "vs": [[3, "لا تأكلوه مع خبز مختمر، بل كلوه مع فطير طوال سبعة أيام، لأن هذا هو خبز المشقة، إذ إنكم على عجل غادرتم ديار مصر، وبذلك تتذكرون يوم خروجكم من ديار مصر كل أيام حياتكم."]]}, {"l": "Psa 103:1", "n": "", "vs": [[1, "باركي يانفسي الرب، وليحمد كل ما في داخلي اسمه القدوس."]]}, {"l": "Psa 103:2", "n": "", "vs": [[2, "باركي يانفسي الرب، ولا تنسي جميع خيراته."]]}, {"l": "Psa 111:4", "n": "", "vs": [[4, "جعل لعجائبه ذكرا، فالرب حنان ورحيم."]]}, {"l": "Eph 2:11", "n": "", "vs": [[11, "لذلك اذكروا، أنتم الأمم في الجسد سابقا، يامن تسمون أهل عدم الختان من قبل من يسمون أهل الختان الذي يجري في الجسد باليد،"]]}], "kwAr": "اذكر", "noteAr": ""}, {"kw": "Balak", "raw": "Num. 22:1-25:18, Num_31:16; Deu_23:4, Deu_23:5; Jos_24:9, Jos_24:10; Rev_2:14", "note": "", "refs": [{"l": "Num 22:1-25:18", "n": "", "vs": [[1, "وارتحل الإسرائيليون ونزلوا في سهول موآب، شرقي الأردن مقابل أريحا."], [2, "وإذ بلغ بالاق بن صفور ملك موآب جميع ما أنزله الإسرائيليون بالأموريين،"], [3, "اعتراه الفزع لكثرة عددهم، وملأ الخوف قلب شعبه من الإسرائيليين."], [4, "فقال بالاق لشيوخ مديان: «إن هذا الجمهور قادر على لحس كل ما حولنا كما يلحس الثور عشب الحقل»."], [5, "ثم بعث برسل يستدعي بلعام بن بعور، المقيم في موطنه في فتور، الواقعة على نهر الفرات قائلا: «ها قد خرج شعب من مصر يغشي وجه الأرض بكثرته، وهو منتشر أمامي."], [6, "فتعال الآن والعن لي هذا الشعب لأنه أعظم مني، لعلي أتمكن من دحره وطرده من الأرض، لأني عرفت أن من تباركه يكون مباركا ومن تلعنه يكون ملعونا»."], [7, "فمضى شيوخ موآب وشيوخ مديان حاملين معهم حلوان العرافة، وأقبلوا على بلعام وأبلغوه كلام بالاق."], [8, "فقال لهم: «بيتوا هنا الليلة، وغدا أرد عليكم جوابا كما يعلن لي الرب». فمكث رؤساء موآب عند بلعام."], [9, "فتجلى الله لبلعام وسأله: «من هم هؤلاء الرجال الذين عندك؟»"], [10, "فأجاب: «لقد أرسل بالاق بن صفور ملك موآب إلي قائلا:"], [11, "ها قد خرج شعب من مصر يغشي وجه الأرض. فتعال الآن والعنه لي، لعلي أقدر على محاربته وطرده»."], [12, "فقال الله لبلعام: «لا تمض معهم ولا تلعن الشعب لأنه مبارك»."], [13, "فنهض بلعام في الصباح وقال لرؤساء بالاق: «انطلقوا إلى دياركم، لأن الرب أبى أن يأذن لي بالذهاب معكم»."], [14, "فانطلق رؤساء موآب وأبلغوا بالاق أن بلعام رفض أن يحضر معهم."], [15, "فعاد بالاق وبعث أيضا عددا من الرؤساء أكبر، وعظماء أكثر من الرؤساء الأولين."], [16, "فقدموا على بلعام وقالوا: «هذا ما يقوله لك بالاق بن صفور:"], [17, "لا تتقاعس عن المجيء إلي، لأنني سأبالغ في إكرامك، وكل ما تطلبه أفعله، فتعال الآن والعن هذا الشعب»."], [18, "فأجاب بلعام رسل بالاق: «لا يمكنني أن أعصى أمر الرب إلهي في أي عمل صغير أو كبير، ولو أغدق علي بالاق ملء قصره فضة وذهبا."], [19, "فالآن، اقضوا هنا ليلتكم لأعلم بماذا يعود الرب فيوصيني به»."], [20, "فتراءى الله لبلعام ليلا وقال له: «إن جاء الرجال يستدعونك فقم وامض معهم، إنما لا تنطق إلا بما آمرك به فقط»."], [21, "فنهض بلعام صباحا وأسرج أتانه، وانطلق مع رؤساء موآب."], [22, "فاحتدم غضب الله لأنه مضى معهم، فاعترضه ملاك الرب في الطريق ليقاومه وهو راكب على أتانه وغلاماه معه."], [23, "فأبصرت الأتان ملاك الرب منتصبا في الطريق، وقد استل سيفه بيده، فحادت عن الطريق ومشت في الحقل. فضربها بلعام ليردها إلى الطريق."], [24, "ثم وقف ملاك الرب في ممر للكروم يقوم على جانبيه حائطان."], [25, "فلما شاهدت الأتان ملاك الرب زحمت جانب الحائط وضغطت رجل بلعام عليه، فضربها أيضا."], [26, "ثم اجتاز به ملاك الرب ووقف في موضع ضيق، لا سبيل فيه للتحول يمنة أو يسرة."], [27, "فلما رأت الأتان ملاك الرب ربضت تحت بلعام. فثار غضب بلعام وضرب الأتان بالقضيب."], [28, "عندئذ أنطق الرب الأتان، فقالت لبلعام: «ماذا جنيت حتى ضربتني الآن ثلاث دفعات؟»"], [29, "فقال بلعام: «لأنك سخرت مني. لو كان في يدي سيف لكنت قد قتلتك»."], [30, "فأجابته الأتان: «ألست أنا أتانك التي ركبت عليها دائما إلى هذا اليوم؟ وهل عودتك أن أصنع بك هكذا؟» فقال: «لا»."], [31, "عندئذ كشف الرب عن عيني بلعام، فشاهد ملاك الرب منتصبا في الطريق وسيفه مسلول في يده، فخر على وجهه ساجدا."], [32, "فقال له ملاك الرب: «لماذا ضربت الآن أتانك ثلاث مرات؟ فها أنا قد جئت لأعترضك، لأن طريقك ملتوية في نظري،"], [33, "فشاهدتني الأتان فحادت من أمامي ثلاث مرات. ولو لم تفعل لكنت قد قتلتك واستحييتها»."], [34, "فقال بلعام لملاك الرب: «لقد أخطأت، ولم أعلم أنك واقف لاعتراضي في الطريق. والآن إن ساء في عينيك فإني أرجع»."], [35, "فقال ملاك الرب لبلعام: «امض مع الرجال، ولكن عليك أن تنطق بما آمرك به فقط». فانطلق بلعام مع رؤساء بالاق."], [36, "فلما بلغ بالاق أن بلعام قد قدم أسرع لاستقباله إلى مدينة موآب الواقعة على حدود أرنون القصية."], [37, "فقال بالاق لبلعام: «ألم أبعث إليك أستدعيك؟ فلماذا لم تقدم علي؟ أحقا أعجز عن إكرامك؟»"], [38, "فأجاب بلعام: «ها أنا جئت إليك. أتظن أن في وسعي أن أتكلم الآن بما أريد؟ علي أن أنطق فقط بما يأمرني به الرب»."], [39, "فمضى بلعام مع بالاق حتى أقبلا إلى قرية حصوت."], [40, "فذبح بالاق بقرا وغنما وأرسلها إلى بلعام ومن معه من الرؤساء."], [41, "وفي الصباح التالي أخذ بالاق بلعام إلى مرتفعات بعل، فرأى من هناك بني إسرائيل كلهم."], [1, "فقال بلعام لبالاق: «ابن لي هنا سبعة مذابح، وأعد لي هنا سبعة ثيران وسبعة كباش»."], [2, "ففعل بالاق كما طلب بلعام. وقرب بالاق وبلعام ثورا وكبشا على كل مذبح."], [3, "ثم قال بلعام لبالاق: «قف هنا عند محرقاتك فأمضي أنا، لعل الرب يأتي للقائي، ومهما يعلن لي أبلغك به». ثم ارتقى بلعام رابية."], [4, "فوافى الله بلعام. فقال بلعام: «قد أعددت سبعة مذابح وقربت ثورا وكبشا على كل مذبح»."], [5, "فحمل الرب بلعام رسالة وقال: «ارجع إلى بالاق وبلغه إياها»."], [6, "فعاد إليه، وإذا به مازال واقفا عند محرقاته، ومعه جميع رؤساء موآب،"], [7, "فنطق بنبوءته قائلا: «أتى بي بالاق ملك موآب من بلاد أرام من الجبال الشرقية، وقال: تعال العن لي يعقوب، واشتم لي إسرائيل."], [8, "كيف ألعن من لم يلعنه الله؟ وكيف أشتم من لم يشتمه الرب؟"], [9, "ها أنا أراهم من قمم الصخور، ومن الآكام أبصرهم. هوذا شعب يسكن وحده. ولا يحسبون أنفسهم أمة من الأمم."], [10, "من يقدر أن يحصي تراب يعقوب أو يعد ربع إسرائيل؟ لتمت نفسي موت الأبرار، ولتكن آخرتي كآخرتهم»."], [11, "فقال بالاق لبلعام: «ماذا فعلت بي؟ لقد استدعيتك لتشتم أعدائي، وها أنت تباركهم»"], [12, "فأجابه: «إنني أحرص أن لا أتكلم إلا بما يضعه الرب على فمي»."], [13, "فقال له بالاق: «تعال معي إلى موضع آخر فلا ترى منه إلا طرف مخيم الشعب فقط، والعنه لي من هناك»."], [14, "فأخذه إلى حقل صوفيم المشرف على رأس الفسجة وهناك شيد سبعة مذابح، وقرب بلعام ثورا وكبشا على كل مذبح."], [15, "وقال لبالاق: «انتظرني هناك عند محرقاتك وأنا أمضي إلى هناك»."], [16, "فوافى الرب بلعام ولقنه رسالة وقال له: «ارجع إلى بالاق وبلغه إياها»."], [17, "فأقبل على بالاق، وإذا به منتظر عند محرقاته ومعه رؤساء موآب. فسأله بالاق: «ماذا تكلم به الرب؟»"], [18, "فضرب مثله قائلا: «انهض يابالاق واصغ، استمع إلي ياابن صفور"], [19, "ليس الله إنسانا فيكذب. ولا هو ابن آدم فيندم. هل يقول ولا يفعل أو يعد ولا يفي؟"], [20, "إني أمرت أن أبارك، وهو قد بارك ولا طاقة لي على رده."], [21, "لم يشهد إثما في يعقوب، ولم ير مشقة في إسرائيل. الرب إلههم معهم، وهتاف للملك فيهم."], [22, "الله أخرجهم من مصر، وقوتهم مثل قوة الثور الوحشي."], [23, "فلا عيافة تضر يعقوب، ولا عرافة تؤثر في إسرائيل. منذ الآن يقال عن يعقوب وعن إسرائيل: «انظر ماذا فعل الله!»"], [24, "هوذا شعب يتحفز كلبوة وينهض كأسد. لا ينام حتى يلتهم فريسة ويلغ في دم قتلى»."], [25, "فقال بالاق لبلعام: «إذن لا تلعنه ولا تباركه!»"], [26, "فأجاب بلعام: «ألم أخبرك أنني لن أنطق إلا بما يأمرني به الرب؟»"], [27, "فقال بالاق: «دعني آخذك إلى موضع آخر، فعسى أن يحسن في عيني الله أن تلعن لي الشعب من هناك»."], [28, "فأخذ بالاق بلعام إلى قمة جبل فغور المشرف على امتداد الصحراء،"], [29, "فقال بلعام لبالاق: «ابن لي هنا سبعة مذابح. وجهز لي هنا سبعة ثيران وسبعة كباش»."], [30, "فلبى بالاق طلب بلعام، وقرب ثورا وكبشا على كل مذبح."], [1, "ولما رأى بلعام أن الرب يسر بمباركة إسرائيل لم يمض كالمرتين السابقتين لملاقاة الرب، لكنه توجه بنظره نحو الصحراء،"], [2, "وهناك شاهد بني إسرائيل مخيمين حسب أسباطهم، فحل عليه روح الله،"], [3, "وتنبأ قائلا: «كلام بلعام بن بعور، كلام الرجل المفتوح العينين."], [4, "كلام من يسمع أقوال الله والذي يشاهد رؤيا القدير. الذي ينطرح فتنفتح عيناه."], [5, "ما أجمل خيامك يايعقوب، وما أبهى مساكنك ياإسرائيل!"], [6, "هي مثل أودية ممتدة، وكجنات على مجرى نهر، وكشجرات صبار غرسها الرب، ومثل أشجار الأرز النامية بجوار المياه."], [7, "تجري مياه من مساقيه، ولزرعه يتوافر ماء غزير. يكون ملكه أعظم شأنا من أجاج وتتسامى مملكته."], [8, "الله أخرجه من مصر، وقوته مثل الثور الوحشي. يفترس خصومه من الأمم، ويقضم عظامهم ويثخنهم بسهامه."], [9, "يجثم كأسد، ويربض كلبوة. فمن يجرؤ على إثارته؟ من يباركك يكون مباركا، ومن يلعنك يكون ملعونا»."], [10, "فاستشاط بالاق غضبا على بلعام، وضرب كفا على كف قائلا له: «دعوتك لتشتم أعدائي، وها أنت قد باركتهم ثلاث مرات!"], [11, "والآن اغرب عن وجهي وامض إلى بيتك، فقد كان في عزمي إكرامك ولكن الرب شاء أن لا تحظى به»."], [12, "فأجابه بلعام: «ألم أقل لرسلك الذين بعثتهم إلي"], [13, "إنه ولو أغدق علي بالاق ملء قصره ذهبا وفضة فلن أعصي أمر الرب، فأصنع خيرا أو شرا من نفسي؟ فإن ما يعلنه لي الرب فإياه أبلغ."], [14, "والآن أعود إلى شعبي، ولكن دعني أنبئك بما سينزله هذا الشعب بقومك في آخر الأيام»."], [15, "ثم تنبأ قائلا: «كلام بلعام بن بعور، كلام الرجل المفتوح العينين."], [16, "كلام من يسمع أقوال الله، ويتلقى المعرفة من العلي، الذي يشاهد رؤيا القدير، الذي ينطرح فتنفتح عيناه."], [17, "أراه ولكن ليس حاضرا، وأبصره ولكن ليس قريبا. يخرج نجم من يعقوب، ويظهر ملك من إسرائيل فيحطم طرفي موآب، ويهلك كل رجال الحرب."], [18, "ويرث أرض أدوم، ويتملك ديار سعير. أما إسرائيل فيزداد قوة."], [19, "ويبرز حاكم من يعقوب فيدمر ما تبقى من مدن (الأعداء)»."], [20, "ثم تطلع بلعام نحو مساكن أهل عماليق فتنبأ: «كان عماليق أول الشعوب، أما عاقبته فإلى الهلاك»."], [21, "ثم التفت نحو القينيين فأنبأ: «ليكن مسكنك منيعا، وعشك موضوعا في صخرة."], [22, "وإنما ستدمرون عندما يطردكم الأشوريون»."], [23, "ثم تنبأ قائلا: «من له طاقة على العيش حين يجري الرب ذلك؟"], [24, "تقبل سفن من كتيم، وتخضع أشور وتذل عابر، فهما أيضا يهلكان»."], [25, "ثم رجع بلعام إلى دياره، وأما بالاق فمضى في سبيله."], [1, "وأقام الإسرائيليون في شطيم، فشرع الرجال يرتكبون الزنى مع الموآبيات"], [2, "اللواتي أغوين الشعب لحضور ذبائح آلهتهن والأكل منها والسجود لها."], [3, "فاشترك الإسرائيليون في عبادة بعل فغور. فاحتدم غضب الرب عليهم."], [4, "فقال الرب لموسى: «خذ جميع قادة عبدة البعل واصلبهم، وعلقهم تحت وطأة حرارة الشمس أمام الرب، فترتد شدة غضبه عن بني إسرائيل»."], [5, "فقال موسى لقضاة إسرائيل: «اقتلوا كل واحد من قومكم من المتعلقين بعبادة بعل فغور»."], [6, "وإذ كان موسى وسائر جماعة إسرائيل يبكون عند مدخل خيمة الاجتماع، أقبل إسرائيلي وقدم إلى إخوته امرأة مديانية على مرأى منهم."], [7, "فلما رأى فينحاس بن ألعازار بن هرون ذلك، هب من بين الجماعة، وتناول رمحا بيده،"], [8, "وتبع الإسرائيلي إلى الخيمة حيث طعنهما. فاخترق الرمح الرجل الإسرائيلي وبطن المرأة، فكف الوبأ عن بني إسرائيل."], [9, "وكان عدد الذين ماتوا بالوبإ أربعة وعشرين ألفا."], [10, "فقال الرب لموسى:"], [11, "«إن فينحاس بن ألعازار بن هرون الكاهن قد رد غضبي عن بني إسرائيل، إذ غار غيرتي في وسطهم، فلم أفن بني إسرائيل بغيرتي."], [12, "لذلك قل له: هأنذا أقطع معه ميثاق سلام،"], [13, "فيكون له ولنسله من بعده ميثاق كهنوت أبدي، لأنه غار لله وكفر عن الإسرائيليين»."], [14, "وكان اسم الإسرائيلي الذي قتل مع المرأة المديانية زمري بن سالو، وهو أحد رؤساء عائلة من سبط شمعون."], [15, "أما المرأة المديانية المقتولة فكان اسمها كزبي بنت صور الذي كان رئيس قبيلة من قبائل مديان."], [16, "ثم قال الرب لموسى:"], [17, "«أسيئوا معاملة المديانيين وأهلكوهم،"], [18, "لأنهم ضايقوكم بمكايدهم التي احتالوا بها عليكم بشأن فغور، وأختهم كزبي ابنة رئيس لمديان، التي قتلت عندما تفشى الوبأ بسبب عبادة فغور»."]]}, {"l": "Num 31:16", "n": "", "vs": [[16, "إنهن باتباعهن نصيحة بلعام أغوين بني إسرائيل لعبادة فغور، وكن سبب خيانة للرب، فتفشى الوبأ في جماعة الرب."]]}, {"l": "Deu 23:4", "n": "", "vs": [[4, "لأنهم لم يستقبلوكم بالخبز والماء في الطريق عند خروجكم من مصر، ولأنهم استأجروا بلعام بن بعور من فتور أرام النهرين ليلعنكم"]]}, {"l": "Deu 23:5", "n": "", "vs": [[5, "ولكن الرب إلهكم لم يشأ أن يستجيب لبلعام، بل حول لأجلكم اللعنة إلى بركة، لأن الرب إلهكم قد أحبكم."]]}, {"l": "Jos 24:9", "n": "", "vs": [[9, "وهب بالاق بن صفور ملك موآب لمحاربتكم، واستدعى إليه بلعام بن بعور لكي يلعنكم."]]}, {"l": "Jos 24:10", "n": "", "vs": [[10, "فلم أرد أن أستجيب لبلعام، فبارككم بركة بعد بركة، وأنقذتكم من يده."]]}, {"l": "Rev 2:14", "n": "", "vs": [[14, "ولكني عاتب عليك قليلا لأنك تتسامح مع القوم الذين يتمسكون بتعليم بلعام عندما علم الملك بالاق أن يدمر بني إسرائيل بتوريطهم في ارتكاب الزنى والأكل من الذبائح المقدمة للأصنام،"]]}], "kwAr": "بالاق", "noteAr": ""}, {"kw": "Balaam", "raw": "Num_31:8; 2Pe_2:15; Jud_1:11", "note": "", "refs": [{"l": "Num 31:8", "n": "", "vs": [[8, "وقتلوا معهم ملوكهم الخمسة: أوي وراقم وصور وحور ورابع، كما قتلوا بلعام بن بعور بحد السيف."]]}, {"l": "2Pe 2:15", "n": "", "vs": [[15, "وإذ خرجوا عن الطريق المستقيم، ضلوا. فهم سائرون في طريق بلعام بن بعور، الذي أحب الحصول على المال أجرة لإثمه."]]}, {"l": "Jud 1:11", "n": "", "vs": [[11, "الويل لهم! لأنهم سلكوا طريق قايين، واندفعوا إلى ارتكاب خطيئة بلعام طلبا للمال، وتمردوا كما تمرد قورح، فدمروا أنفسهم."]]}], "kwAr": "بلعام", "noteAr": ""}, {"kw": "Shittim", "raw": "Num_22:41, Num_23:13, Num_23:14, Num_23:27, Num_25:1, Num_33:49; Jos_4:19, Jos_5:9, Jos_5:10, Jos_10:42, Jos_10:43", "note": "", "refs": [{"l": "Num 22:41", "n": "", "vs": [[41, "وفي الصباح التالي أخذ بالاق بلعام إلى مرتفعات بعل، فرأى من هناك بني إسرائيل كلهم."]]}, {"l": "Num 23:13", "n": "", "vs": [[13, "فقال له بالاق: «تعال معي إلى موضع آخر فلا ترى منه إلا طرف مخيم الشعب فقط، والعنه لي من هناك»."]]}, {"l": "Num 23:14", "n": "", "vs": [[14, "فأخذه إلى حقل صوفيم المشرف على رأس الفسجة وهناك شيد سبعة مذابح، وقرب بلعام ثورا وكبشا على كل مذبح."]]}, {"l": "Num 23:27", "n": "", "vs": [[27, "فقال بالاق: «دعني آخذك إلى موضع آخر، فعسى أن يحسن في عيني الله أن تلعن لي الشعب من هناك»."]]}, {"l": "Num 25:1", "n": "", "vs": [[1, "وأقام الإسرائيليون في شطيم، فشرع الرجال يرتكبون الزنى مع الموآبيات"]]}, {"l": "Num 33:49", "n": "", "vs": [[49, "ونصبوا خيامهم في سهول موآب على محاذاة نهر الأردن، من بيت يشيموت إلى أبل شطيم."]]}, {"l": "Jos 4:19", "n": "", "vs": [[19, "وتم اجتياز الشعب لنهر الأردن في اليوم العاشر من الشهر الأول العبري، وخيموا في الجلجال شرقي أريحا."]]}, {"l": "Jos 5:9", "n": "", "vs": [[9, "وقال الرب ليشوع: «اليوم قد دحرجت عنكم عار مصر»، فدعي اسم ذلك الموضع الجلجال (ومعناه متدحرج) إلى هذا اليوم."]]}, {"l": "Jos 5:10", "n": "", "vs": [[10, "وفيما كان الإسرائيليون مخيمين في الجلجال، في سهول أريحا، احتفلوا بالفصح في مساء اليوم الرابع عشر من الشهر."]]}, {"l": "Jos 10:42", "n": "", "vs": [[42, "وظفر يشوع بجميع هؤلاء الملوك واستولى على أرضهم دفعة واحدة، لأن الرب إله إسرائيل حارب عنهم."]]}, {"l": "Jos 10:43", "n": "", "vs": [[43, "ثم رجع يشوع وجميع جيشه معه إلى المخيم، إلى الجلجال."]]}], "kwAr": "شطيم", "noteAr": ""}, {"kw": "know", "raw": "Jdg_5:11 *marg. Psa_36:10, Psa_71:15, Psa_71:16, Psa_71:19, Psa_143:11; Rom_3:25, Rom_3:26; 1Jo_1:9", "note": "", "refs": [{"l": "Jdg 5:11", "n": "*marg.", "vs": [[11, "بأصوات المنشدين عند سواقي المياه يتغنون بانتصارات الرب وشعبه في إسرائيل، عندئذ ينزل شعب الرب إلى بوابات المدينة."]]}, {"l": "Psa 36:10", "n": "", "vs": [[10, "أدم رحمتك لعارفيك، وعدلك لذوي القلوب المستقيمة."]]}, {"l": "Psa 71:15", "n": "", "vs": [[15, "أخبر ببرك وخلاصك طول النهار، وإن كانا يفوقان إدراكي."]]}, {"l": "Psa 71:16", "n": "", "vs": [[16, "أجيء (مؤيدا) بقوة السيد الرب، لأذكر برك وحدك."]]}, {"l": "Psa 71:19", "n": "", "vs": [[19, "برك متعال ياالله ، وأعمالك التي صنعت عظيمة، فمن مثلك ياالله !"]]}, {"l": "Psa 143:11", "n": "", "vs": [[11, "أحيني يارب من أجل اسمك، وبعدلك أفرج ضيق نفسي."]]}, {"l": "Rom 3:25", "n": "", "vs": [[25, "الذي قدمه الله كفارة، عن طريق الإيمان، وذلك بدمه."]]}, {"l": "Rom 3:26", "n": "", "vs": [[26, "ليظهر بر الله إذ تغاضى، بإمهاله الإلهي، عن الخطايا التي حدثت في الماضي، ويظهر أيضا بره في الزمن الحاضر: فيتبين أنه بار وأنه يبرر من له الإيمان بيسوع."]]}, {"l": "1Jo 1:9", "n": "", "vs": [[9, "ولكن، إن اعترفنا لله بخطايانا، فهو جدير بالثقة وعادل، يغفر لنا خطايانا ويطهرنا من كل إثم."]]}], "kwAr": "تدرك", "noteAr": ""}], "arS": [["اذكر", ["H2142"]], [" ", []], ["ياشعبي", ["H5971"]], [" ", []], ["ما", ["H4100"]], [" ", []], ["تآمر", ["H3289"]], [" به عليك ", []], ["بالاق", ["H1111"]], [" ", []], ["ملك", ["H4428"]], [" ", []], ["موآب", ["H4124"]], ["، ", []], ["وما", ["H4100"]], [" ", []], ["أجابه", ["H6030"]], [" به ", []], ["بلعام", ["H1109"]], [" ", []], ["بن", ["H1121"]], [" ", []], ["بعور", ["H1160"]], [". واذكر ما أحسنت به إليك في رحلتك ", []], ["من", ["H4480"]], [" ", []], ["شطيم", ["H7851"]], [" ", []], ["إلى", ["H5704"]], [" ", []], ["الجلجال", ["H1537"]], [" ", []], ["لكي", ["H4616"]], [" ", []], ["تدرك", ["H3045"]], [" ", []], ["عدل", ["H6666"]], [" ", []], ["الرب", ["H3068"]], [".", []]]}, {"c": 6, "v": 6, "text": "يارب: بماذا أتقدم عندما أمثل أمام الرب وأسجد في حضرة الله العلي؟ هل أتقدم منه بمحرقات وبعجول حولية؟", "groups": [{"kw": "Wherewith", "raw": "2Sa_21:3; Mat_19:16; Luk_10:25; Joh_6:26; Act_2:37, Act_16:30; Rom_10:2, Rom_10:3", "note": "", "refs": [{"l": "2Sa 21:3", "n": "", "vs": [[3, "وقال داود لهم: «ماذا أصنع لكم؟» كيف يمكن أن أعوض عما نالكم من ضرر، فتدعون بالبركة لميراث الرب؟»"]]}, {"l": "Mat 19:16", "n": "", "vs": [[16, "وإذا شاب يتقدم إليه ويسأل: «أيها المعلم الصالح، أي صلاح أعمل لأحصل على الحياة الأبدية؟»"]]}, {"l": "Luk 10:25", "n": "", "vs": [[25, "وتصدى له أحد علماء الشريعة ليجربه، فقال: «يامعلم، ماذا أعمل لأرث الحياة الأبدية؟»"]]}, {"l": "Joh 6:26", "n": "", "vs": [[26, "أجابهم يسوع: «الحق الحق أقول لكم: أنتم تبحثون عني لا لأنكم رأيتم الآيات، بل لأنكم أكلتم وشبعتم من تلك الأرغفة."]]}, {"l": "Act 2:37", "n": "", "vs": [[37, "فلما سمع الحاضرون هذا الكلام، وخزتهم قلوبهم، فسألوا بطرس وباقي الرسل: «ماذا نعمل أيها الإخوة؟»"]]}, {"l": "Act 16:30", "n": "", "vs": [[30, "ثم أخرجهما خارجا وسألهما: «ياسيدي، ماذا ينبغي أن أفعل لكي أخلص؟»"]]}, {"l": "Rom 10:2", "n": "", "vs": [[2, "فإني أشهد لهم أن عندهم غيرة لله، ولكنها ليست على أساس المعرفة."]]}, {"l": "Rom 10:3", "n": "", "vs": [[3, "فبما أنهم جهلوا بر الله وسعوا إلى إثبات برهم الذاتي، لم يخضعوا للبر الإلهي."]]}], "kwAr": "بماذا", "noteAr": ""}, {"kw": "bow", "raw": "Psa_22:29, Psa_95:6; Eph_3:14", "note": "", "refs": [{"l": "Psa 22:29", "n": "", "vs": [[29, "جميع عظماء الأرض يحتفلون ويسجدون. ينحني أمامه الهابطون إلى التراب والفانون،"]]}, {"l": "Psa 95:6", "n": "", "vs": [[6, "تعالوا نسجد وننحني، لنركع أمام الرب صانعنا،"]]}, {"l": "Eph 3:14", "n": "", "vs": [[14, "ولهذا السبب أحني ركبتي للآب"]]}], "kwAr": "وأسجد", "noteAr": ""}, {"kw": "the high", "raw": "Gen_14:18-22; Dan_3:26, Dan_4:9, Dan_5:18, Dan_5:21; Mar_5:7; Act_16:17", "note": "", "refs": [{"l": "Gen 14:18-22", "n": "", "vs": [[18, "وكذلك حمل إليه ملكي صادق ملك شاليم، الذي كان كاهنا لله العلي، خبزا وخمرا،"], [19, "وباركه قائلا: «لتكن عليك ياأبرام بركة الله العلي، مالك السماوات والأرض."], [20, "وتبارك الله العلي الذي دفع أعداءك إلى يديك». فأعطاه أبرام عشر الغنائم كلها."], [21, "وقال ملك سدوم لأبرام: «أعطني الأسرى المعتوقين أما الغنائم فاحتفظ بها لنفسك»."], [22, "فأجابه أبرام: «لقد أقسمت بالرب الإله العلي، مالك السماوات والأرض،"]]}, {"l": "Dan 3:26", "n": "", "vs": [[26, "ثم دنا نبوخذناصر من باب الأتون المتقد بالنار وهتف: «ياشدرخ وميشخ وعبدنغو ياعبيد الله العلي، اخرجوا وتعالوا». فخرج شدرخ وميشخ وعبدنغو من وسط النار."]]}, {"l": "Dan 4:9", "n": "", "vs": [[9, "قلت: «يابلطشاصر رئيس المجوس، إني أعلم أن فيك روح الآلهة القدوسين ولا يتعذر عليك سر، فأخبرني برؤى حلمي الذي شهدته وبتفسيره."]]}, {"l": "Dan 5:18", "n": "", "vs": [[18, "أيها الملك قد وهب الله العلي أباك نبوخذناصر ملكا وعظمة وجلالا وبهاء."]]}, {"l": "Dan 5:21", "n": "", "vs": [[21, "وطرد من بين الناس، وماثل عقله الحيوانات، وصار مأواه مع الحمير الوحشية، فأطعموه العشب كالثيران، وابتل جسمه بندى السماء، حتى علم أن الله العلي هو المتسلط في مملكة الناس، وأنه يولي عليها من يشاء."]]}, {"l": "Mar 5:7", "n": "", "vs": [[7, "وصرخ بأعلى صوته: «ما شأنك بي يايسوع ابن الله العلي؟ أستحلفك بالله ألا تعذبني!»"]]}, {"l": "Act 16:17", "n": "", "vs": [[17, "فأخذت تسير وراء بولس ووراءنا صارخة: «هؤلاء الناس هم عبيد الله العلي، يعلنون لكم طريق الخلاص»."]]}], "kwAr": "العلي", "noteAr": ""}, {"kw": "with", "raw": "Lev_1:3-17; Num_23:1-4, Num_23:14, Num_23:15, Num_23:29, Num_23:30; Heb_10:4-10", "note": "", "refs": [{"l": "Lev 1:3-17", "n": "", "vs": [[3, "إن كانت تقدمته محرقة من البقر، فليقرب ثورا سليما، يحضره عند مدخل خيمة الاجتماع، ويقدمه أمام الرب طلبا لرضاه عنه."], [4, "فيضع يده على رأس المحرقة، فيرضى الرب بموت الثور بديلا عن صاحبه، للتكفير عن خطاياه."], [5, "ثم يذبح المقرب العجل أمام الرب. ويقدم بنو هرون، الكهنة، الدم ويرشونه على جوانب المذبح القائم عند مدخل خيمة الاجتماع."], [6, "وعلى المقرب أيضا أن يسلخ المحرقة ويقطعها إلى أجزاء."], [7, "ويوقد أبناء هرون نارا على المذبح ويرتبون عليها حطبا"], [8, "ثم يرتبون فوق حطب نار المذبح أجزاء الثور ورأسه وشحمه."], [9, "أما أعضاؤه الداخلية وأكارعه فيغسلها المقرب بماء، ثم يحرقها الكاهن جميعا على المذبح، فتكون محرقة، وقود رضى تسر الرب."], [10, "وإن كانت محرقته من الماشية: الضأن أو المعز، فلتكن ذكرا سليما."], [11, "وعلى المقرب أن يذبحه في حضرة الرب، عند الجانب الشمالي للمذبح، ثم يقوم أبناء هرون الكهنة برش دمه على جوانب المذبح."], [12, "ويقطعه المقرب إلى أجزاء مع رأسه وشحمه، فيرتبها الكاهن فوق حطب نار المذبح،"], [13, "وأما الأعضاء الداخلية والأكارع فيغسلها بماء، ثم يحرقها الكاهن جميعها فتكون محرقة ووقود رضى تسر الرب."], [14, "وإن كانت تقدمته للرب محرقة من الطير، فلتكن من اليمام أو من أفراخ الحمام."], [15, "فيقدم الكاهن القربان إلى المذبح ويحز رأسه ويصفي دمه على حائط المذبح بعد إيقاد النار على المذبح،"], [16, "وينزع حوصلته مع نثرياتها ويطرحهما إلى جانب المذبح الشرقي، حيث يجمع الرماد."], [17, "ويشق الكاهن الطائر من بين جناحيه، من غير أن يفصله إلى قطعتين، ويحرقه على المذبح فوق حطب النار، فيكون محرقة ووقود رضى تسر الرب."]]}, {"l": "Num 23:1-4", "n": "", "vs": [[1, "فقال بلعام لبالاق: «ابن لي هنا سبعة مذابح، وأعد لي هنا سبعة ثيران وسبعة كباش»."], [2, "ففعل بالاق كما طلب بلعام. وقرب بالاق وبلعام ثورا وكبشا على كل مذبح."], [3, "ثم قال بلعام لبالاق: «قف هنا عند محرقاتك فأمضي أنا، لعل الرب يأتي للقائي، ومهما يعلن لي أبلغك به». ثم ارتقى بلعام رابية."], [4, "فوافى الله بلعام. فقال بلعام: «قد أعددت سبعة مذابح وقربت ثورا وكبشا على كل مذبح»."]]}, {"l": "Num 23:14", "n": "", "vs": [[14, "فأخذه إلى حقل صوفيم المشرف على رأس الفسجة وهناك شيد سبعة مذابح، وقرب بلعام ثورا وكبشا على كل مذبح."]]}, {"l": "Num 23:15", "n": "", "vs": [[15, "وقال لبالاق: «انتظرني هناك عند محرقاتك وأنا أمضي إلى هناك»."]]}, {"l": "Num 23:29", "n": "", "vs": [[29, "فقال بلعام لبالاق: «ابن لي هنا سبعة مذابح. وجهز لي هنا سبعة ثيران وسبعة كباش»."]]}, {"l": "Num 23:30", "n": "", "vs": [[30, "فلبى بالاق طلب بلعام، وقرب ثورا وكبشا على كل مذبح."]]}, {"l": "Heb 10:4-10", "n": "", "vs": [[4, "فمن المستحيل أن يزيل دم الثيران والتيوس خطايا الناس."], [5, "لذلك قال المسيح، عند مجيئه إلى هذه الأرض: «إن الذبائح والتقدمات ما أردتها. لكنك أعددت لي جسدا بشريا."], [6, "فالحيوانات التي كانت تذبح وتحرق أمامك تكفيرا عن الخطيئة، لم ترض بها."], [7, "عندئذ قلت لك: ها أنا آتي لأعمل إرادتك، ياالله . هذا هو المكتوب عني في صفحة الكتاب !»"], [8, "فبعد أن عبر المسيح عن عدم رضى الله بجميع التقدمات والذبائح التي كانت تقرب مع أنها كانت تقدم وفقا للشريعة،"], [9, "أضاف قائلا: «ها أنا آتي لأعمل إرادتك!» فهو، إذن، يلغي النظام السابق، ليضع محله نظاما جديدا ينسجم مع إرادة الله."], [10, "بموجب هذه الإرادة الإلهية، صرنا مقدسين إذ قرب يسوع المسيح، مرة واحدة، جسده عوضا عنا!"]]}], "kwAr": "بمحرقات", "noteAr": ""}, {"kw": "of a year old", "raw": "Heb. sons of a year, Exo_12:5", "note": "Heb. sons of a year, Exo_12:5", "refs": [{"l": "Exo 12:5", "n": "", "vs": [[5, "ويجب أن يكون الحمل ذكرا ابن سنة، خاليا من كل عيب، تنتقونه من الخرفان أو المعيز."]]}], "kwAr": "حولية", "noteAr": "بالعبرية: «أبناء سنة». انظر خر 12: 5"}], "arS": [["يارب: ", []], ["بماذا", ["H4100"]], [" ", []], ["أتقدم", ["H6923"]], [" عندما أمثل أمام ", []], ["الرب", ["H3068"]], [" ", []], ["وأسجد", ["H3721"]], [" في حضرة ", []], ["الله", ["H430"]], [" ", []], ["العلي", ["H4791"]], ["؟ هل ", []], ["أتقدم", ["H6923"]], [" منه ", []], ["بمحرقات", ["H5930"]], [" ", []], ["وبعجول", ["H5695"]], [" ", []], ["حولية", ["H8141", "H1121"]], ["؟", []]]}, {"c": 6, "v": 7, "text": "هل يسر الرب بألوف أنهار زيت؟ هل أقرب بكري فداء إثمي وثمرة جسدي تكفيرا عن خطيئة نفسي؟", "groups": [{"kw": "pleased", "raw": "1Sa_15:22; Psa_10:8-13, Psa_50:9, Psa_51:16; Isa_1:11-15, Isa_40:16; Jer_7:21, Jer_7:22; Hos_6:6; Amo_5:22", "note": "", "refs": [{"l": "1Sa 15:22", "n": "", "vs": [[22, "فقال صموئيل: «هل يسر الرب بالذبائح والمحرقات كسروره بالاستماع إلى صوته؟ إن الاستماع أفضل من الذبيحة، والإصغاء أفضل من شحم الكباش."]]}, {"l": "Psa 10:8-13", "n": "", "vs": [[8, "يتربص في كمائن الديار ليقتل البريء. عيناه تترصدان المسكين."], [9, "يكمن في الخفاء، كأسد في عرينه ليخطف المسكين ويجره في شبكته."], [10, "يسحق المساكين ويدوسهم حين يسقطون بين مخالبه القوية."], [11, "يقول في قلبه: الله غافل. قد حجب وجهه، ولن يرى ما يجري"], [12, "قم يارب، ارفع يدك ياالله ، لا تنس المساكين."], [13, "لماذا يستهين الشرير بالله قائلا في قلبه: إنك لا تحاسبه؟"]]}, {"l": "Psa 50:9", "n": "", "vs": [[9, "فما كنت لآخذ من بيتك ثورا ولا من حظائرك تيسا."]]}, {"l": "Psa 51:16", "n": "", "vs": [[16, "فإنك لا تسر بذبيحة، وإلا كنت أقدمها. بمحرقة لا ترضى."]]}, {"l": "Isa 1:11-15", "n": "", "vs": [[11, "ماذا تجديني كثرة ذبائحكم، يقول الرب؟ اتخمت من
