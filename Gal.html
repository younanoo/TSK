ت سلطة الجسد لا يستطيعون أن يرضوا الله ."]]}], "kwAr": "وهذان يقاوم أحدهما الآخر", "noteAr": ""}, {"kw": "so", "raw": "Psa_119:4-6, Psa_130:3; Mat_5:6; Luk_22:33, Luk_22:46, Luk_22:54-61; Rom_7:15-23; Phi_3:12-16; Jam_3:2; 1Jo_1:8-10", "note": "", "refs": [{"l": "Psa 119:4-6", "n": "", "vs": [[4, "أنت أوصيت بحفظ وصاياك والعمل بها كلها."], [5, "ليتك توجه طرقي لممارسة فرائضك."], [6, "عندئذ لا أخزى إذا تأملت في جميع وصاياك."]]}, {"l": "Psa 130:3", "n": "", "vs": [[3, "إن كنت يارب تترصد الآثام، فمن يستطيع الوقوف في محضرك؟"]]}, {"l": "Mat 5:6", "n": "", "vs": [[6, "طوبى للجياع والعطاش إلى البر، فإنهم سيشبعون."]]}, {"l": "Luk 22:33", "n": "", "vs": [[33, "فقال له: «يارب، إني مستعد أن أذهب معك إلى السجن وإلى الموت معا!»"]]}, {"l": "Luk 22:46", "n": "", "vs": [[46, "فقال لهم: «ما بالكم نائمين؟ قوموا وصلوا لكي لا تدخلوا في تجربة!»"]]}, {"l": "Luk 22:54-61", "n": "", "vs": [[54, "وإذ قبضوا عليه، ساقوه حتى دخلوا به قصر رئيس الكهنة. وتبعه بطرس من بعيد."], [55, "ولما أشعلت نار في ساحة الدار وجلس بعضهم حولها، جلس بطرس بينهم."], [56, "فرأته خادمة جالسا عند الضوء، فدققت النظر فيه، وقالت: «وهذا كان معه!»"], [57, "ولكنه أنكر قائلا: «ياامرأة، لست أعرفه!»"], [58, "وبعد وقت قصير رآه آخر فقال: «وأنت منهم!» ولكن بطرس قال: «ياإنسان، ليس أنا!»"], [59, "وبعد مضي ساعة تقريبا، قال آخر مؤكدا: «حقا إن هذا كان معه أيضا، لأنه أيضا من الجليل!»"], [60, "فقال بطرس: «ياإنسان، لست أدري ما تقول!» وفي الحال وهو مازال يتكلم، صاح الديك."], [61, "فالتفت الرب ونظر إلى بطرس. فتذكر بطرس كلمة الرب إذ قال له: «قبل أن يصيح الديك تكون قد أنكرتني ثلاث مرات»."]]}, {"l": "Rom 7:15-23", "n": "", "vs": [[15, "فإن ما أفعله لا أملك السيطرة عليه: إذ لا أمارس ما أريده، وإن ما أبغضه فإياه أعمل."], [16, "فما دمت أعمل ما لا أريده، فإني أصادق على صواب الشريعة."], [17, "فالآن، إذن، ليس بعد أنا من يفعل ذلك، بل الخطيئة التي تسكن في."], [18, "لأنني أعلم أنه في، أي في جسدي، لا يسكن الصلاح: فأن أريد الصلاح ذلك متوفر لدي؛ وأما أن أفعله، فذلك لا أستطيعه."], [19, "فأنا لا أعمل الصلاح الذي أريده؛ وإنما الشر الذي لا أريده فإياه أمارس."], [20, "ولكن، إن كان ما لا أريده أنا إياه أعمل، فليس بعد أنا من يفعل ذلك، بل الخطيئة التي تسكن في."], [21, "إذن، أجد نفسي، أنا الذي يريد أن يعمل ما هو صالح، خاضعا لهذا الناموس:"], [22, "أن لدي الشر. فإنني، وفقا للإنسان الباطن في، أبتهج بشريعة الله."], [23, "ولكنني أرى في أعضائي ناموسا آخر يحارب الشريعة التي يريدها عقلي، ويجعلني أسيرا لناموس الخطيئة الكائن في أعضائي."]]}, {"l": "Phi 3:12-16", "n": "", "vs": [[12, "لست أدعي أني قد نلت الجائزة أو بلغت الكمال. ولكني ماأزال أسعى لاقتنائها، كما أن المسيح يسوع قد اقتناني."], [13, "أيها الإخوة، أنا لا أعتبر نفسي قد نلت الجائزة، ولكني أفعل أمرا واحدا: أنسى ما هو وراء وأتقدم إلى ما هو أمام،"], [14, "إذ أسعى إلى الهدف، لنوال تلك الجائزة التي يدعونا الله إليها دعوة عليا في المسيح يسوع."], [15, "جميع البالغين فينا، ليكن فيهم هذا الفكر. وإن كان فيكم غير هذا الفكر، فذلك أيضا سيكشفه لكم الله ."], [16, "إنما، لنواصل السير من حيث قد وصلنا، في المنهج نفسه."]]}, {"l": "Jam 3:2", "n": "", "vs": [[2, "فإننا جميعا معرضون للوقوع في أخطاء كثيرة. ولكن من يلجم لسانه ولا يخطيء في كلامه هو ناضج يقدر أن يسيطر على طبيعته سيطرة تامة."]]}, {"l": "1Jo 1:8-10", "n": "", "vs": [[8, "إن كنا ندعي أن لا خطيئة لنا، نخدع أنفسنا، ولا يكون الحق في داخلنا."], [9, "ولكن، إن اعترفنا لله بخطايانا، فهو جدير بالثقة وعادل، يغفر لنا خطايانا ويطهرنا من كل إثم."], [10, "فإن كنا ندعي أننا لم نرتكب خطيئة، نجعل الله كاذبا، ولا تكون كلمته في داخلنا!"]]}], "kwAr": "حتى إنكم لا تفعلون ما ترغبون", "noteAr": ""}], "arS": [["فإن ", []], ["الجسد", ["G4561"]], [" ", []], ["يشتهي", ["G1937"]], [" بعكس ", []], ["الروح", ["G4151"]], ["، ", []], ["والروح", ["G4151"]], [" بعكس ", []], ["الجسد", ["G4561"]], ["؛ وهذان ", []], ["يقاوم", ["G480"]], [" ", []], ["أحدهما الآخر", ["G240"]], [" حتى إنكم لا ", []], ["تفعلون", ["G4160"]], [" ما ", []], ["ترغبون", ["G2309"]], [" فيه.", []]]}, {"c": 5, "v": 18, "text": "ولكن إذا كنتم خاضعين لقيادة الروح، فلستم في حال العبودية للشريعة.", "groups": [{"kw": "if", "raw": "Gal_5:16, Gal_5:25, Gal_4:6; Psa_25:4, Psa_25:5, Psa_25:8, Psa_25:9, Psa_143:8-10; Pro_8:20; Isa_48:16-18; Eze_36:27; Joh_16:13; Rom_8:12, Rom_8:14; 2Ti_1:7; 1Jo_2:20-27", "note": "", "refs": [{"l": "Gal 5:16", "n": "", "vs": [[16, "إنما أقول: اسلكوا في الروح. وعندئذ لا تتممون شهوة الجسد أبدا."]]}, {"l": "Gal 5:25", "n": "", "vs": [[25, "إذا كنا نحيا بالروح، فلنسلك أيضا بالروح."]]}, {"l": "Gal 4:6", "n": "", "vs": [[6, "وبما أنكم أبناء له، أرسل الله إلى قلوبنا روح ابنه، مناديا: «أبا، ياأبانا»."]]}, {"l": "Psa 25:4", "n": "", "vs": [[4, "يارب عرفني طرقك، علمني سبلك."]]}, {"l": "Psa 25:5", "n": "", "vs": [[5, "دربني في حقك وعلمني، فإنك أنت الإله مخلصي، وإياك أرجو طوال النهار."]]}, {"l": "Psa 25:8", "n": "", "vs": [[8, "الرب صالح ومستقيم لذلك يهدي الضالين الطريق."]]}, {"l": "Psa 25:9", "n": "", "vs": [[9, "يدرب الودعاء في سبل الحق ويعلمهم طريقه."]]}, {"l": "Psa 143:8-10", "n": "", "vs": [[8, "أسمعني في الصباح رحمتك، فإني عليك توكلت. عرفني الطريق التي أسلكها، لأني إليك رفعت نفسي."], [9, "أنقذني من أعدائي يارب، لأنني بك استعذت."], [10, "علمني أن أعمل ما يرضيك لأنك أنت إلهي، وليهدني روحك الصالح إلى أرض مستوية."]]}, {"l": "Pro 8:20", "n": "", "vs": [[20, "أمشي في طريق البر، وفي سبل العدل أسير."]]}, {"l": "Isa 48:16-18", "n": "", "vs": [[16, "اقتربوا مني واسمعوا: منذ البدء لم أتكلم خفية، ولدى حدوثها كنت حاضرا هناك. والآن، قد أرسلني السيد الرب وروحه بهذه الرسالة:"], [17, "هذا ما يقوله الرب فاديك قدوس إسرائيل: أنا هو الرب إلهك الذي يعلمك ما فيه نفع لك، ويهديك في النهج الذي عليك أن تسلكه."], [18, "ليتك أطعت وصاياي لكان سلامك كالنهر، وبرك كأمواج البحر،"]]}, {"l": "Eze 36:27", "n": "", "vs": [[27, "وأضع روحي في داخلكم فأجعلكم تمارسون فرائضي وتطيعون أحكامي عاملين بها،"]]}, {"l": "Joh 16:13", "n": "", "vs": [[13, "ولكن، عندما يأتيكم روح الحق يرشدكم إلى الحق كله، لأنه لا يقول شيئا من عنده، بل يخبركم بما يسمعه، ويطلعكم على ما سوف يحدث."]]}, {"l": "Rom 8:12", "n": "", "vs": [[12, "فليس علينا إذن، أيها الإخوة، أي التزام نحو الجسد لنعيش بحسب الجسد."]]}, {"l": "Rom 8:14", "n": "", "vs": [[14, "فإن جميع الخاضعين لقيادة روح الله، هم أبناء لله."]]}, {"l": "2Ti 1:7", "n": "", "vs": [[7, "فإن الله قد أعطانا لا روح الجبن بل روح القوة والمحبة والبصيرة."]]}, {"l": "1Jo 2:20-27", "n": "", "vs": [[20, "أما أنتم فلكم مسحة من القدوس، وجميعكم تعرفون الحق."], [21, "فأنا أكتب إليكم ليس لأنكم لا تعرفون الحق، بل لأنكم تعرفونه وتدركون أن كل ما هو كذب لا يأتي من الحق."], [22, "ومن هو الكذاب؟ إنه الذي ينكر أن يسوع هو المسيح حقا. إنه ضد للمسيح ينكر الآب والابن معا."], [23, "وكل من ينكر الابن، لا يكون الآب أيضا من نصيبه. ومن يعترف بالابن، فله الآب أيضا."], [24, "أما أنتم، فالكلام الذي سمعتموه منذ البداية، فليكن راسخا فيكم. فحين يترسخ ذلك الكلام في داخلكم، تتوطد صلتكم بالابن، وبالآب."], [25, "فإن الله نفسه قد وعدنا بالحياة الأبدية."], [26, "كتبت إليكم هذا مشيرا إلى الذين يحاولون أن يضللوكم."], [27, "أما أنتم فقد نلتم من الله مسحة تبقى فيكم دائما. ولذلك، لستم بحاجة إلى من يعلمكم الحق. فتلك المسحة عينها هي التي تعلمكم كل شيء. وهي حق وليست كذبا. فكما علمتكم اثبتوا في المسيح."]]}], "kwAr": "إذا كنتم خاضعين لقيادة الروح", "noteAr": ""}, {"kw": "ye are", "raw": "Gal_4:5; Rom_6:14, Rom_6:15", "note": "", "refs": [{"l": "Gal 4:5", "n": "", "vs": [[5, "ليحرر بالفداء أولئك الخاضعين للشريعة، فننال جميعا مقام أبناء الله."]]}, {"l": "Rom 6:14", "n": "", "vs": [[14, "فلن يكون للخطيئة سيادة عليكم، إذ لستم خاضعين للشريعة بل للنعمة."]]}, {"l": "Rom 6:15", "n": "", "vs": [[15, "فماذا إذن؟ أنخطيء لأننا لسنا خاضعين للشريعة بل للنعمة؟ حاشا!"]]}], "kwAr": "فلستم في حال العبودية للشريعة", "noteAr": ""}], "arS": [["ولكن إذا كنتم خاضعين ", []], ["لقيادة", ["G71"]], [" ", []], ["الروح", ["G4151"]], ["، فلستم في حال العبودية ", []], ["للشريعة", ["G3551"]], [".", []]]}, {"c": 5, "v": 19, "text": "أما أعمال الجسد فظاهرة، وهي: الزنى والنجاسة والدعارة،", "groups": [{"kw": "the works", "raw": "Gal_5:13, Gal_5:17, Gal_6:8; Psa_17:4; Joh_3:6; Rom_7:5, Rom_7:18, Rom_7:25, Rom_8:3, Rom_8:5, Rom_8:9, Rom_8:13; 1Co_3:3; 1Pe_4:2", "note": "", "refs": [{"l": "Gal 5:13", "n": "", "vs": [[13, "فإنما إلى الحرية قد دعيتم، أيها الإخوة؛ ولكن لا تتخذوا من الحرية ذريعة لإرضاء الجسد، بل بالمحبة كونوا عبيدا في خدمة أحدكم الآخر."]]}, {"l": "Gal 5:17", "n": "", "vs": [[17, "فإن الجسد يشتهي بعكس الروح، والروح بعكس الجسد؛ وهذان يقاوم أحدهما الآخر حتى إنكم لا تفعلون ما ترغبون فيه."]]}, {"l": "Gal 6:8", "n": "", "vs": [[8, "فإن من يزرع لجسده، فمن الجسد يحصد فسادا. ومن يزرع للروح، فمن الروح يحصد حياة أبدية. فلا نفشل في عمل الخير،"]]}, {"l": "Psa 17:4", "n": "", "vs": [[4, "ما شأني بأعمال الناس الشريرة؟ فبفضل كلام شفتيك تفاديت مسالك العنيف."]]}, {"l": "Joh 3:6", "n": "", "vs": [[6, "فالمولود من الجسد هو جسد، والمولود من الروح هو روح."]]}, {"l": "Rom 7:5", "n": "", "vs": [[5, "فعندما كنا في الجسد، كانت أهواء الخطايا المعلنة في الشريعة عاملة في أعضائنا لكي نثمر للموت."]]}, {"l": "Rom 7:18", "n": "", "vs": [[18, "لأنني أعلم أنه في، أي في جسدي، لا يسكن الصلاح: فأن أريد الصلاح ذلك متوفر لدي؛ وأما أن أفعله، فذلك لا أستطيعه."]]}, {"l": "Rom 7:25", "n": "", "vs": [[25, "أشكر الله بيسوع المسيح ربنا! إذن، أنا نفسي من حيث العقل، أخدم شريعة الله عبدا لها؛ ولكنني من حيث الجسد، أخدم ناموس الخطيئة عبدا له."]]}, {"l": "Rom 8:3", "n": "", "vs": [[3, "فإن ما عجزت الشريعة عنه، لكون الجسد قد جعلها قاصرة عن تحقيقه، أتمه الله إذ أرسل ابنه، متخذا ما يشبه جسد الخطيئة ومكفرا عن الخطيئة فدان الخطيئة في الجسد"]]}, {"l": "Rom 8:5", "n": "", "vs": [[5, "فإن الذين هم بحسب الجسد يهتمون بأمور الجسد، والذين هم بحسب الروح يهتمون بأمور الروح."]]}, {"l": "Rom 8:9", "n": "", "vs": [[9, "وأما أنتم، فلستم تحت سلطة الجسد بل تحت سلطة الروح، إذا كان روح الله ساكنا في داخلكم حقا. ولكن، إن كان أحد ليس له روح المسيح، فهو ليس للمسيح."]]}, {"l": "Rom 8:13", "n": "", "vs": [[13, "لأنه إن عشتم بحسب الجسد، فإنكم ستموتون، ولكن إن كنتم بالروح تميتون أعمال الجسد، فستحيون."]]}, {"l": "1Co 3:3", "n": "", "vs": [[3, "فإنكم مازلتم جسديين. فمادام بينكم حسد وخصام (وانقسام)، أفلا تكونون جسديين وتسلكون وفقا للبشر؟"]]}, {"l": "1Pe 4:2", "n": "", "vs": [[2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."]]}], "kwAr": "أعمال الجسد فظاهرة", "noteAr": ""}, {"kw": "Adultery", "raw": "Eze_22:6-13; Mat_15:18, Mat_15:19; Mar_7:21-23; Rom_1:21-32; 1Co_6:9, 1Co_6:10; 2Co_12:20,2Co_12:21; Eph_4:17-19, Eph_5:3-6; Col_3:5-8; 1Ti_1:9, 1Ti_1:10; Tit_3:3; Jam_3:14, Jam_3:15; 1Pe_4:3, 1Pe_4:4; Rev_21:8, Rev_22:15", "note": "", "refs": [{"l": "Eze 22:6-13", "n": "", "vs": [[6, "هوذا كل واحد من رؤساء إسرائيل ممن كانوا فيك انهمك في سفك الدماء على قدر طاقته."], [7, "فيك استخفوا بأب وأم وجاروا في وسطك على الغريب، واضطهدوا اليتيم والأرملة،"], [8, "احتقرت مقدساتي ونجست أيام سبوتي."], [9, "أقام فيك وشاة عملوا على سفك الدم، وأكلوا أمام الأصنام على الجبال، وارتكبوا في وسطك الموبقات."], [10, "فيك فضح الإنسان عري أبيه، وفيك أذلوا من برحت متنجسة بطمثها."], [11, "فيك إنسان زنى مع امرأة قريبه، واقترف إنسان الرذيلة مع كنته، وفيك ضاجع إنسان أخته ابنة أبيه."], [12, "فيك أخذوا الرشوة لقاء سفك الدماء. أخذت الربا ومال الحرام، وسلبت أقرباءك ظلما ونسيتني، يقول السيد الرب."], [13, "ها أنا قد صفقت بكفي من جراء ما حصلت عليه من ربح حرام، وما سفك من دم في وسطك."]]}, {"l": "Mat 15:18", "n": "", "vs": [[18, "أما ما يخرج من الفم، فإنه من القلب يصدر، وهو الذي ينجس الإنسان."]]}, {"l": "Mat 15:19", "n": "", "vs": [[19, "فمن القلب تنبع الأفكار الشريرة، القتل، الزنى، الفسق، السرقة، شهادة الزور، التجديف."]]}, {"l": "Mar 7:21-23", "n": "", "vs": [[21, "فإنه من الداخل، من قلوب الناس، تنبع الأفكار الشريرة، الفسق، السرقة، القتل،"], [22, "الزنى، الطمع، الخبث، الخداع، العهارة، العين الشريرة، التجديف، الكبرياء، الحماقة"], [23, "هذه الأمور الشريرة كلها تنبع من داخل الإنسان وتنجسه»."]]}, {"l": "Rom 1:21-32", "n": "", "vs": [[21, "فمع أنهم عرفوا الله ، لم يمجدوه باعتباره الله ، ولا شكروه، بل انحطوا بتفكيرهم إلى الحماقة وصار قلبهم لغباوته مظلما."], [22, "وفيما يدعون أنهم حكماء، صاروا جهالا،"], [23, "واستبدلوا بمجد الله الخالد تماثيل لصور الإنسان الفاني والطيور وذوات الأربع والزواحف."], [24, "لذلك أسلمهم الله ، في شهوات قلوبهم، إلى النجاسة، ليهينوا أجسادهم فيما بينهم."], [25, "إذ قد استبدلوا بحق الله ما هو باطل، فاتقوا المخلوق وعبدوه بدل الخالق، المبارك إلى الأبد. آمين!"], [26, "لهذا السبب أسلمهم الله إلى الشهوات المخزية. فإن إناثهم تحولن عن استعمال أجسادهن بالطريقة الطبيعية إلى استعمالها بطريقة مخالفة للطبيعة."], [27, "وكذلك تحول الذكور أيضا عن استعمال الأنثى بالطريقة الطبيعية، والتهبوا شهوة بعضهم لبعض، مرتكبين الفحشاء ذكورا بذكور، فاستحقوا أن ينالوا في أنفسهم الجزاء العادل على ضلالهم."], [28, "وبما أنهم لم يتخيروا إبقاء الله ضمن معرفتهم، أسلمهم الله إلى ذهن عاطل عن التمييز دفعهم إلى ممارسة الأمور غير اللائقة."], [29, "إذ قد امتلأوا من كل إثم وشر وجشع وخبث، وشحنوا حسدا وقتلا وخصاما ومكرا وسوءا. وهم ثرثارون،"], [30, "مغتابون، كارهون لله، شتامون، متكبرون، متفاخرون، مخترعون للشرور، غير طائعين للوالدين."], [31, "لا فهم عندهم، ولا أمانة، ولا حنان، ولا رحمة."], [32, "إنهم يعلمون حكم الله العادل: أن الذين يفعلون هذه الأمور يستوجبون الموت؛ ومع ذلك، لا يمارسونها وحسب، بل يسرون بفاعليها."]]}, {"l": "1Co 6:9", "n": "", "vs": [[9, "أما تعلمون أن الظالمين لن يرثوا ملكوت الله؟ لا تضلوا: فإن ملكوت الله لن يرثه الزناة ولا عابدو الأصنام ولا الفاسقون ولا المتخنثون ولا مضاجعو الذكور"]]}, {"l": "1Co 6:10", "n": "", "vs": [[10, "ولا السراقون ولا الطماعون ولا السكيرون ولا الشتامون ولا المغتصبون."]]}, {"l": "2Co 12:20", "n": "", "vs": [[20, "فإني أخشى أن آتي إليكم فأجدكم في حالة لا أريدها وتجدوني في حالة لا تريدونها! أي أن يكون بينكم كثير من النزاع والحسد والحقد والتحزب والتجريح والنميمة والتكبر والبلبلة."]]}, {"l": "2Co 12:21", "n": "", "vs": [[21, "وأخشى أن يجعلني إلهي ذليلا بينكم عند مجيئي إليكم مرة أخرى، فيكون حزني شديدا على كثيرين من الذين أخطأوا قبلا ولم يتوبوا عما ارتكبوا من دنس وزنى وفسق!"]]}, {"l": "Eph 4:17-19", "n": "", "vs": [[17, "أقول هذا إذن، وأشهد في الرب، راجيا ألا تسلكوا فيما بعد كما يسلك الأمم في عقم ذهنهم،"], [18, "لكونهم مظلمي البصيرة ومتغربين عن حياة الله بسبب ما فيهم من جهل وقساوة قلب."], [19, "فهؤلاء، إذ طرحوا جانبا كل إحساس، استسلموا للإباحية ليرتكبوا كل نجاسة بشهوة نهمة لا ترتوي."]]}, {"l": "Eph 5:3-6", "n": "", "vs": [[3, "أما الزنى، وكل نجاسة أو شهوة نهمة، فلا يذكر بينكم حتى اسمها، كما يليق بالقديسين."], [4, "وكذلك البذاءة والكلام السفيه والهزل، فهي غير لائقة. وإنما أحرى بكم أن تلهجوا بالشكر لله!"], [5, "فإنكم تعلمون هذا جيدا: أن كل زان أو نجس أو صاحب شهوة نهمة، ما هو إلا عابد أصنام، ليس له ميراث في ملكوت المسيح والله."], [6, "لا يخدعكم أحد بكلام باطل! فبسبب هذه الأمور يحل غضب الله على أبناء العصيان."]]}, {"l": "Col 3:5-8", "n": "", "vs": [[5, "فأميتوا إذن أعضاءكم الأرضية: الزنى، النجاسة، جموح العاطفة، الشهوة الرديئة، والاشتهاء النهم الذي هو عبادة أصنام."], [6, "فبسبب هذه الخطايا ينزل غضب الله،"], [7, "وفيها سلكتم في الماضي، حين كنتم تعيشون فيها."], [8, "وأما الآن، فانزعوا عنكم، أنتم أيضا، هذه الخطايا كلها: الغضب، النقمة، الخبث، التجديف، الكلام القبيح الخارج من أفواهكم."]]}, {"l": "1Ti 1:9", "n": "", "vs": [[9, "إذ ندرك أن الشريعة لا تطبق على من كان بارا، بل على الأشرار والمتمردين، على الفاجرين والخاطئين، والنجسين والدنسين، وقاتلي آبائهم وأمهاتهم، وقاتلي الناس،"]]}, {"l": "1Ti 1:10", "n": "", "vs": [[10, "والزناة ومضاجعي الذكور، وخطافي الناس والكذابين وشاهدي الزور. وذوي كل شر آخر يخالف التعليم الصحيح"]]}, {"l": "Tit 3:3", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."]]}, {"l": "Jam 3:14", "n": "", "vs": [[14, "أما إن كانت قلوبكم مملوءة بمرارة الحسد وبالتحزب، فلا تفتخروا بحكمتكم، ولا تنكروا الحق."]]}, {"l": "Jam 3:15", "n": "", "vs": [[15, "إن هذه الحكمة التي تدعونها ليست نازلة من عند الله، بل هي «حكمة» أرضية بشرية شيطانية."]]}, {"l": "1Pe 4:3", "n": "", "vs": [[3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}, {"l": "1Pe 4:4", "n": "", "vs": [[4, "ورفاقكم في تلك العيشة سابقا يستغربون أنكم لا تركضون معهم إلى فيض هذه الخلاعة، ويجرحون سمعتكم."]]}, {"l": "Rev 21:8", "n": "", "vs": [[8, "أما الجبناء وغير المؤمنين، والفاسدون والقاتلون والزناة، والمتصلون بالشياطين وعبدة الأصنام وجميع الدجالين، فمصيرهم إلى البحيرة المتقدة بالنار والكبريت، الذي هو الموت الثاني»."]]}, {"l": "Rev 22:15", "n": "", "vs": [[15, "أما في خارج المدينة، فهنالك الكلاب والمتصلون بالشياطين، والزناة والقتلة، وعبدة الأصنام والدجالون ومحبو التدجيل!"]]}], "kwAr": "الزنى", "noteAr": ""}], "arS": [["أما ", []], ["أعمال", ["G2041"]], [" ", []], ["الجسد", ["G4561"]], [" ", []], ["فظاهرة", ["G5318"]], ["، وهي: ", []], ["الزنى", ["G4202"]], [" ", []], ["والنجاسة", ["G167"]], [" ", []], ["والدعارة", ["G766"]], ["،", []]]}, {"c": 5, "v": 20, "text": "وعبادة الأصنام والسحر، والعداوة والنزاع والغيرة والغضب، والتحزب والانقسام والتعصب،", "groups": [{"kw": "witchcraft", "raw": "Eze_22:18; Deu_18:10; 1Sa_15:23; 1Ch_10:13, 1Ch_10:14; 2Ch_33:6; Act_8:9-11; Act_16:16-19", "note": "", "refs": [{"l": "Eze 22:18", "n": "", "vs": [[18, "«ياابن آدم، قد أصبح شعب إسرائيل لي نفاية. كلهم مثل النحاس والقصدير والحديد والرصاص في كور. صاروا حثالة فضة."]]}, {"l": "Deu 18:10", "n": "", "vs": [[10, "ولا يكن بينكم من يجيز ابنه ولا ابنته في النار، ولا يتعاطى العرافة ولا العيافة ولا ممارسة الفأل أو السحر،"]]}, {"l": "1Sa 15:23", "n": "", "vs": [[23, "فالتمرد مماثل لخطيئة العرافة، والعناد شبيه بشر عبادة الوثن والإثم. ولأنك رفضت كلام الرب فقد رفضك الرب من الملك»."]]}, {"l": "1Ch 10:13", "n": "", "vs": [[13, "وهكذا مات شاول من جراء خيانته وعصيانه للرب، ولأنه لجأ إلى الجان طلبا للمشورة."]]}, {"l": "1Ch 10:14", "n": "", "vs": [[14, "ولم يلجأ إلى الرب طلبا لمشورته، فقضى الرب عليه وسلم عرش الملك لداود بن يسى."]]}, {"l": "2Ch 33:6", "n": "", "vs": [[6, "وأجاز أولاده في النار في وادي ابن هنوم، ولجأ إلى السحرة والعرافات وأصحاب الجان وأوغل في ارتكاب الشر مما أثار غضب الرب الشديد عليه."]]}, {"l": "Act 8:9-11", "n": "", "vs": [[9, "وكان قبل ذلك في تلك المدينة ساحر اسمه سيمون، يمارس السحر فيذهل أهل السامرة ويدعي أنه رجل عظيم."], [10, "فأصغى إليه الجميع من الصغير إلى الكبير، قائلين: «هذا الرجل هو قدرة الله العظمى!»"], [11, "وإنما أصغوا إليه لأنهم كانوا قد انخدعوا مدة طويلة بحيله السحرية!"]]}, {"l": "Act 16:16-19", "n": "", "vs": [[16, "وذات يوم كنا ذاهبين إلى الصلاة، فالتقت بنا خادمة يسكنها روح عرافة، كانت تكسب سادتها ربحا كثيرا من عرافتها،"], [17, "فأخذت تسير وراء بولس ووراءنا صارخة: «هؤلاء الناس هم عبيد الله العلي، يعلنون لكم طريق الخلاص»."], [18, "وظلت تفعل هذا أياما كثيرة، حتى تضايق بولس كثيرا، فالتفت وقال للروح الذي فيها: «باسم يسوع المسيح، آمرك أن تخرج منها!» فخرج حالا."], [19, "ولما رأى سادتها أن مورد رزقهم قد انقطع، قبضوا على بولس وسيلا، وجروهما إلى ساحة المدينة للمحاكمة،"]]}], "kwAr": "والسحر", "noteAr": ""}, {"kw": "heresies", "raw": "2Co_11:19; Tit_3:10; 2Pe_2:1", "note": "", "refs": [{"l": "2Co 11:19", "n": "", "vs": [[19, "فلأنكم عقلاء، تحتملون الأغبياء بسرور!"]]}, {"l": "Tit 3:10", "n": "", "vs": [[10, "وصاحب الهرطقة اقطع العلاقة به بعد إنذاره أولا وثانيا،"]]}, {"l": "2Pe 2:1", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."]]}], "kwAr": "والتعصب", "noteAr": ""}], "arS": [["وعبادة الأصنام", ["G1495"]], [" ", []], ["والسحر", ["G5331"]], ["، ", []], ["والعداوة", ["G2189"]], [" ", []], ["والنزاع", ["G2054"]], [" ", []], ["والغيرة", ["G2205"]], [" ", []], ["والغضب", ["G2372"]], ["، ", []], ["والتحزب", ["G2052"]], [" ", []], ["والانقسام", ["G1370"]], [" ", []], ["والتعصب", ["G139"]], ["،", []]]}, {"c": 5, "v": 21, "text": "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!", "groups": [{"kw": "drunkenness", "raw": "Deu_21:20; Luk_21:34; Rom_13:13; 1Co_5:11, 1Co_6:10; Eph_5:18; 1Th_5:7", "note": "", "refs": [{"l": "Deu 21:20", "n": "", "vs": [[20, "ويقولان للشيوخ: ابننا هذا عنيد متمرد، لا يطيع قولنا، وهو مبذر سكير."]]}, {"l": "Luk 21:34", "n": "", "vs": [[34, "ولكن احذروا لأنفسكم لئلا تتثقل قلوبكم بالانغماس في اللذات وبالسكر وهموم الحياة، فيدهمكم ذلك اليوم فجأة؛"]]}, {"l": "Rom 13:13", "n": "", "vs": [[13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."]]}, {"l": "1Co 5:11", "n": "", "vs": [[11, "أما ا أبناء العصيان."]]}, {"l": "Col 3:6", "n": "", "vs": [[6, "فبسبب هذه الخطايا ينزل غضب الله،"]]}, {"l": "Rev 21:27", "n": "", "vs": [[27, "ولن يدخلها شيء نجس، ولا الذين يعملون القبائح ويدجلون، بل فقط الذين كتبت أسماؤهم في سجل الحياة للحمل!"]]}, {"l": "Rev 22:15", "n": "", "vs": [[15, "أما في خارج المدينة، فهنالك الكلاب والمتصلون بالشياطين، والزناة والقتلة، وعبدة الأصنام والدجالون ومحبو التدجيل!"]]}], "kwAr": "إن الذين يفعلون مثل هذه", "noteAr": ""}, {"kw": "inherit", "raw": "Mat_25:34; 1Co_6:10, 1Co_15:50; Eph_5:5", "note": "", "refs": [{"l": "Mat 25:34", "n": "", "vs": [[34, "ثم يقول الملك للذين عن يمينه: تعالوا يامن باركهم أبي، رثوا الملكوت الذي أعد لكم منذ إنشاء العالم:"]]}, {"l": "1Co 6:10", "n": "", "vs": [[10, "ولا السراقون ولا الطماعون ولا السكيرون ولا الشتامون ولا المغتصبون."]]}, {"l": "1Co 15:50", "n": "", "vs": [[50, "ثم إني، أيها الإخوة، أؤكد لكم أن الأجسام ذات اللحم والدم لا يمكنها أن ترث ملكوت الله، كما لا يمكن للمنحل أن يرث غير المنحل."]]}, {"l": "Eph 5:5", "n": "", "vs": [[5, "فإنكم تعلمون هذا جيدا: أن كل زان أو نجس أو صاحب شهوة نهمة، ما هو إلا عابد أصنام، ليس له ميراث في ملكوت المسيح والله."]]}], "kwAr": "لن يرثوا ملكوت الله", "noteAr": ""}], "arS": [["والحسد", ["G5355"]], [" ", []], ["والسكر", ["G3178"]], [" ", []], ["والعربدة", ["G2970"]], ["، وما ", []], ["يشبه", ["G3664"]], [" هذه. وبالنظر إليها، ", []], ["أقول", ["G4302"]], [" لكم الآن، كما ", []], ["سبق أن قلت", ["G4277"]], [" أيضا، إن الذين ", []], ["يفعلون", ["G4238"]], [" مثل هذه لن ", []], ["يرثوا", ["G2816"]], [" ", []], ["ملكوت", ["G932"]], [" ", []], ["الله", ["G2316"]], ["!", []]]}, {"c": 5, "v": 22, "text": "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة", "groups": [{"kw": "the fruit", "raw": "Gal_5:16-18; Psa_1:3, Psa_92:14; Hos_14:8; Mat_12:33; Luk_8:14, Luk_8:15, Luk_13:9; Joh_15:2, Joh_15:5, Joh_15:16; Rom_6:22, Rom_7:4; Eph_5:9; Phi_1:11; Col_1:10", "note": "", "refs": [{"l": "Gal 5:16-18", "n": "", "vs": [[16, "إنما أقول: اسلكوا في الروح. وعندئذ لا تتممون شهوة الجسد أبدا."], [17, "فإن الجسد يشتهي بعكس الروح، والروح بعكس الجسد؛ وهذان يقاوم أحدهما الآخر حتى إنكم لا تفعلون ما ترغبون فيه."], [18, "ولكن إذا كنتم خاضعين لقيادة الروح، فلستم في حال العبودية للشريعة."]]}, {"l": "Psa 1:3", "n": "", "vs": [[3, "فيكون كشجرة مغروسة عند مجاري المياه، تعطي ثمرها في حينه، وورقها لا يذبل، وكل ما يصنعه يفلح."]]}, {"l": "Psa 92:14", "n": "", "vs": [[14, "يثمرون أيضا في الشيخوخة، ويظلون موفوري العافية والنضرة"]]}, {"l": "Hos 14:8", "n": "", "vs": [[8, "يقول أفرايم تائبا: «مالي وللأصنام!» فيجيب الرب: «قد استمعت وأنا رعيتك بعين الرضى وصرت لك كشجرة سرو خضراء، ومني أمدك بثمرك»."]]}, {"l": "Mat 12:33", "n": "", "vs": [[33, "لتكن الشجرة جيدة، فتنتج ثمرا جيدا؛ ولتكن الشجرة رديئة، فتنتج ثمرا رديئا! فمن الثمر، تعرف الشجرة."]]}, {"l": "Luk 8:14", "n": "", "vs": [[14, "وما وقع حيث الأشواك هم الذين يسمعون ثم يمضون فتخنقهم هموم الحياة وغناها ولذاتها، فلا ينتجون ثمرا ناضجا."]]}, {"l": "Luk 8:15", "n": "", "vs": [[15, "وأما الذي وقع في الأرض الجيدة، فهم الذين يسمعون الكلمة ويحفظونها في قلب جيد مستقيم، وينتجون ثمرا بالصبر."]]}, {"l": "Luk 13:9", "n": "", "vs": [[9, "فلعلها تنتج ثمرا! وإلا، فبعد ذلك تقطعها!»"]]}, {"l": "Joh 15:2", "n": "", "vs": [[2, "كل غصن في لا ينتج ثمرا يقطعه؛ وكل غصن ينتج ثمرا ينقيه لينتج مزيدا من الثمر."]]}, {"l": "Joh 15:5", "n": "", "vs": [[5, "أنا الكرمة وأنتم الأغصان. من يثبت في وأنا فيه، فذاك ينتج ثمرا كثيرا. فإنكم بمعزل عني لا تقدرون أن تفعلوا شيئا."]]}, {"l": "Joh 15:16", "n": "", "vs": [[16, "ليس أنتم اخترتموني، بل أنا اخترتكم وعينتكم لتنطلقوا وتنتجوا ثمرا ويدوم ثمركم، فيعطيكم الآب كل ما تطلبونه باسمي."]]}, {"l": "Rom 6:22", "n": "", "vs": [[22, "أما الآن، وقد حررتم من الخطيئة وصرتم عبيدا لله، فإن لكم ثمركم للقداسة، والعاقبة هي الحياة الأبدية."]]}, {"l": "Rom 7:4", "n": "", "vs": [[4, "وهكذا أنتم أيضا ياإخوتي، فإنكم بجسد المسيح الذي مات، قد صرتم أمواتا بالنسبة للشريعة، لكي تصيروا لآخر، إلى المسيح نفسه الذي أقيم من بين الأموات، من أجل أن نثمر لله."]]}, {"l": "Eph 5:9", "n": "", "vs": [[9, "فإن ثمر النور يكون في كل صلاح واستقامة وحق."]]}, {"l": "Phi 1:11", "n": "", "vs": [[11, "كاملين في ثمار البر الآتية بيسوع المسيح، لمجد الله وحمده."]]}, {"l": "Col 1:10", "n": "", "vs": [[10, "لكي تسلكوا سلوكا لائقا بالرب ومرضيا في كل شيء، منتجين الثمر في كل عمل صالح ونامين في معرفة الله إلى التمام،"]]}], "kwAr": "ثمر الروح", "noteAr": ""}, {"kw": "love", "raw": "Gal_5:13; Rom_5:2-5, Rom_12:9-18, Rom_15:3; 1Co_13:4-7; Eph_4:23-32, Eph_5:1, Eph_5:2; Phi_4:4-9; Col_3:12-17; 1Th_1:3-10, 1Th_5:10-22; Tit_2:2-12; Jam_3:17, Jam_3:18; 1Pe_1:8, 1Pe_1:22; 2Pe_1:5-8; 1Jo_4:7-16", "note": "", "refs": [{"l": "Gal 5:13", "n": "", "vs": [[13, "فإنما إلى الحرية قد دعيتم، أيها الإخوة؛ ولكن لا تتخذوا من الحرية ذريعة لإرضاء الجسد، بل بالمحبة كونوا عبيدا في خدمة أحدكم الآخر."]]}, {"l": "Rom 5:2-5", "n": "", "vs": [[2, "وبه أيضا تم لنا الدخول بالإيمان إلى هذه النعمة التي نقيم فيها الآن؛ ونحن نفتخر برجائنا في التمتع بمجد الله."], [3, "ليس هذا فقط، بل نفتخر أيضا في وسط الضيقات، لعلمنا أن الضيق ينتج فينا الصبر،"], [4, "والصبر يؤهلنا للفوز في الامتحان، والفوز يبعث فينا الرجاء،"], [5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."]]}, {"l": "Rom 12:9-18", "n": "", "vs": [[9, "ولتكن المحبة بلا رياء. انفروا من الشر، والتصقوا بالخير."], [10, "أحبوا بعضكم بعضا محبة أخوية، مفضلين بعضكم على بعض في الكرامة."], [11, "لا تتكاسلوا في الاجتهاد، بل كونوا ملتهبين في الروح، عبيدا خادمين للرب،"], [12, "فرحين بالرجاء، صابرين في الضيق، مواظبين على الصلاة،"], [13, "متعاونين على سد حاجات القديسين، مداومين على إضافة الغرباء."], [14, "باركوا الذين يضطهدونكم. باركوا ولا تلعنوا!"], [15, "افرحوا مع الفرحين، وابكوا مع الباكين."], [16, "كونوا متوافقين بعضكم مع بعض، غير مهتمين بالأمور العالية، بل مسايرين ذوي المراكز الوضيعة. لا تكونوا حكماء في نظر أنفسكم."], [17, "لا تردوا لأحد شرا مقابل شر، بل اجتهدوا في تقديم ما هو حسن أمام جميع الناس."], [18, "إن كان ممكنا، فمادام الأمر يتعلق بكم، عيشوا في سلام مع جميع الناس."]]}, {"l": "Rom 15:3", "n": "", "vs": [[3, "فحتى المسيح لم يسع لإرضاء نفسه، بل وفقا لما قد كتب: «تعييرات الذين يعيرونك وقعت علي»."]]}, {"l": "1Co 13:4-7", "n": "", "vs": [[4, "المحبة تصبر طويلا؛ وهي لطيفة. المحبة لا تحسد. المحبة لا تتفاخر ولا تتكبر."], [5, "لا تتصرف بغير لياقة، ولا تسعى إلى مصلحتها الخاصة. لا تستفز سريعا، ولا تنسب الشر لأحد."], [6, "لا تفرح بالظلم، بل تفرح بالحق."], [7, "إنها تستر كل شيء، وتصدق كل شيء، وترجو كل شيء، وتتحمل كل شيء."]]}, {"l": "Eph 4:23-32", "n": "", "vs": [[23, "وتتجددوا في روح ذهنكم؛"], [24, "وتلبسوا الإنسان الجديد المخلوق على مثال الله في البر والقداسة بالحق."], [25, "لذلك اخلعوا عنكم الكذب، وتكلموا بالصدق كل واحد مع قريبه، لأننا أعضاء بعضنا لبعض."], [26, "إن غضبتم، فلا تخطئوا؛ لا تدعوا الشمس تغيب وأنتم غاضبون،"], [27, "ولا تتيحوا فرصة لإبليس!"], [28, "ومن كان سارقا، فلا يسرق في ما بعد، بل بالأحرى ليكد ويستخدم يديه في عمل شريف ليكون عنده ما يشارك فيه المحتاجين."], [29, "لا تخرج من أفواهكم كلمة فاسدة، بل الكلام الصالح للبنيان الذي تدعو إليه الحاجة، كي يعطي السامعين نعمة."], [30, "ولا تحزنوا روح الله، الروح القدس الذي به ختمتم ليوم الفداء."], [31, "انزعوا عنكم كل حقد ونقمة وغضب وصخب وسباب وكل شر."], [32, "وكونوا لطفاء بعضكم نحو بعض، شفوقين، مسامحين بعضكم بعضا كما سامحكم الله في المسيح."]]}, {"l": "Eph 5:1", "n": "", "vs": [[1, "فاقتدوا إذن بالله كأولاد أحباء،"]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "Phi 4:4-9", "n": "", "vs": [[4, "افرحوا في الرب دائما، وأقول أيضا: افرحوا."], [5, "ليكن طول بالكم معروفا لدى الناس جميعا. إن الرب قريب."], [6, "لا تقلقوا من جهة أي شيء، بل في كل أمر لتكن طلباتكم معروفة لدى الله، بالصلاة والدعاء، مع الشكر."], [7, "وسلام الله، الذي تعجز العقول عن إدراكه، يحرس قلوبكم وأفكاركم في المسيح يسوع."], [8, "وختاما، أيها الإخوة: كل ما كان حقا، وكل ما كان شريفا، وكل ما كان عادلا، وكل ما كان طاهرا وكل ما كان مستحبا، وكل ما كان حسن السمعة، وكل ما كان فيه فضيلة وخصلة حميدة، فاشغلوا أفكاركم به."], [9, "واعملوا بها ما تعلمتم وتلقيتم وسمعتم مني وما رأيتم في. وإله السلام يكون معكم."]]}, {"l": "Col 3:12-17", "n": "", "vs": [[12, "فباعتباركم جماعة مختارة من الله، قديسين محبوبين، البسوا دائما عواطف الحنان واللطف والتواضع والوداعة وطول البال،"], [13, "محتملين بعضكم بعضا، ومسامحين بعضكم بعضا. إن كان لأحدكم شكوى على آخر، كما سامحكم الرب، هكذا افعلوا أنتم أيضا."], [14, "وفوق هذا كله البسوا المحبة، فهي رابطة الكمال."], [15, "وليملك في قلوبكم سلام المسيح، فإليه قد دعيتم في الجسد الواحد؛ وكونوا شاكرين!"], [16, "لتسكن كلمة المسيح في داخلكم بغنى، في كل حكمة، معلمين وواعظين بعضكم بعضا، مرنمين بمزامير وتسابيح وأناشيد روحية في قلوبكم لله، رافعين له الحمد."], [17, "ومهما كان ما تعملونه، بالقول أو بالفعل، فليجر كل شيء باسم الرب يسوع، رافعين به الشكر لله الآب."]]}, {"l": "1Th 1:3-10", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"], [4, "ونحن عالمون، أيها الإخوة أحباء الله، حقيقة اختياركم من قبل الله:"], [5, "لأن تبشيرنا لكم بالإنجيل لم يكن مجرد كلام، بل كان مصحوبا أيضا بالقوة وبالروح القدس وبتمام اليقين. كما أنكم تعلمون تماما ماذا كنا بينكم لأجل مصلحتكم،"], [6, "وقد صرتم مقتدين بنا وبالرب، إذ تقبلتم كلمة الله في وسط ضيقة شديدة بفرح الروح القدس."], [7, "حتى إنكم صرتم مثالا لجميع المؤمنين المقيمين في مقاطعتي مقدونية وأخائية."], [8, "فمن عندكم دوت كلمة الرب، منتشرة لا في مقدونية وأخائية فقط، بل إن إيمانكم بالله ذاع في كل مكان، حتى ليس لنا حاجة لأن نقول شيئا بعد."], [9, "فإن أولئك المؤمنين أنفسهم يخبرون عنا كيف كان قدومنا إليكم أول مرة، وكيف تحولتم إلى الله عن الأصنام، لتصيروا عبيدا يخدمون الله الحي الحق،"], [10, "وتنتظروا من السماوات ابنه الذي أقامه من بين الأموات، يسوع مخلصنا من الغضب الآتي."]]}, {"l": "1Th 5:10-22", "n": "", "vs": [[10, "الذي مات عنا لكي نحيا جميعا معه، سواء كنا في سهر الحياة أم في رقاد الموت!"], [11, "لذلك عزوا بعضكم بعضا وشددوا أحدكم الآخر، كما أنتم فاعلون."], [12, "على أننا نرجو منكم، أيها الإخوة، أن تميزوا أولئك الذين يجتهدون بينكم، ويرعونكم كما يريد الرب، ويعظونكم،"], [13, "وأن تقدروهم تقديرا فائقا في المحبة، من أجل عملهم. عيشوا بسلام بعضكم مع بعض."], [14, "إلا أننا نناشدكم، أيها الإخوة، أن تعظوا الفوضويين، وتشددوا فاقدي العزم، وتساندوا الضعفاء، وتعاملوا الجميع بطول البال."], [15, "حذار أن يبادل أحدكم شر غيره بشر مثله بل اسعوا دائما إلى الخير في معاملتكم بعضكم لبعض وللآخرين جميعا."], [16, "افرحوا على الدوام؛"], [17, "صلوا دون انقطاع؛"], [18, "ارفعوا الشكر في كل حال: فهذه هي مشيئة الله لكم في المسيح يسوع."], [19, "لا تخمدوا الروح،"], [20, "لا تحتقروا النبوءات؛"], [21, "امتحنوا كل شيء وتمسكوا بالحسن."], [22, "ترفعوا عن كل ما فيه شبهة شر."]]}, {"l": "Tit 2:2-12", "n": "", "vs": [[2, "أن يكون الشيوخ ذوي رزانة ووقار، متعقلين، صحيحي الإيمان والمحبة والصبر."], [3, "وكذلك أن تكون العجائز ذوات سيرة موافقة للقداسة، غير نمامات ولا مدمنات للخمر، بل معلمات لما هو صالح،"], [4, "لكي يدربن الشابات على أن يكن محبات لأزواجهن ولأولادهن،"], [5, "متعقلات، عفيفات، مهتمات بشؤون بيوتهن صالحات، خاضعات لأزواجهن، حتى لا يتكلم أحد بالسوء على كلمة الله."], [6, "كذلك عظ الشبان أن يكونوا متعقلين،"], [7, "جاعلا من نفسك في كل شيء قدوة للأعمال الصالحة، مظهرا في تعليمك النقاوة والوقار"], [8, "والكلمة الصحيحة التي لا تلام، لكي يخجل المقاوم حين لا يجد أمرا سيئا يقوله فينا."], [9, "وعلم العبيد أن يكونوا خاضعين لسادتهم، مرضين لهم في كل شيء؛ غير معاندين؛"], [10, "ولا سارقين، بل مظهرين أمانة كلية صالحة، لكي يزينوا في كل شيء تعليم مخلصنا الله."], [11, "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت."], [12, "وهي تعلمنا أن نقطع علاقتنا بالإباحية والشهوات العالمية، وأن نحيا في العصر الحاضر حياة التعقل والبر والتقوى،"]]}, {"l": "Jam 3:17", "n": "", "vs": [[17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}, {"l": "Jam 3:18", "n": "", "vs": [[18, "والبر هو ثمر ة ما يزرعه في سلام صانعو السلام."]]}, {"l": "1Pe 1:8", "n": "", "vs": [[8, "أنتم لم تروا المسيح، ولكنكم تحبونه. ومع أنكم لا ترونه الآن، فأنتم تؤمنون به وتبتهجون بفرح مجيد يفوق الوصف."]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}, {"l": "2Pe 1:5-8", "n": "", "vs": [[5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"], [6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"], [7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."], [8, "فحين تكون هذه الصفات الطيبة في داخلكم، وتزداد بوفرة، تجعلكم مجتهدين ومثمرين في معرفتكم لربنا يسوع المسيح."]]}, {"l": "1Jo 4:7-16", "n": "", "vs": [[7, "أيها الأحباء، لنحب بعضنا بعضا: لأن المحبة تصدر من الله. إذن، كل من يحب، يكون مولودا من الله ويعرف الله ."], [8, "أما من لا يحب، فهو لم يتعرف بالله قط لأن الله محبة!"], [9, "وقد أظهر الله محبته لنا إذ أرسل ابنه الأوحد إلى العالم لكي نحيا به."], [10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."], [11, "ومادام الله قد أحبنا هذه المحبة العظيمة، أيها الأحباء، فعلينا نحن أيضا أن نحب بعضنا بعضا."], [12, "إن الله لم يره أحد من الناس قط. ولكن، حين نحب بعضنا بعضا، نبين أن الله يحيا في داخلنا، وأن محبته قد اكتملت في داخلنا."], [13, "وما يؤكد لنا أننا نثبت في الله، وأنه يثبت فينا هو أنه وهب لنا من روحه."], [14, "ونحن أنفسنا نشهد أن الآب قد أرسل الابن مخلصا للعالم، لأننا رأيناه بعيوننا."], [15, "من يعترف بأن يسوع هو ابن الله، فإن الله يثبت فيه، وهو يثبت في الله،"], [16, "ونحن أنفسنا اختبرنا المحبة التي خصنا الله بها، ووضعنا ثقتنا فيها. إن الله محبة. ومن يثبت في المحبة، فإنه يثبت في الله، والله يثبت فيه."]]}], "kwAr": "المحبة", "noteAr": ""}, {"kw": "goodness", "raw": "Rom_15:14", "note": "", "refs": [{"l": "Rom 15:14", "n": "", "vs": [[14, "وأنا نفسي أيضا على يقين من جهتكم أيها الإخوة بأنكم مشحونون صلاحا، وممتلئون بكل معرفة، وقادرون أيضا على نصح بعضكم بعضا."]]}], "kwAr": "والصلاح", "noteAr": ""}, {"kw": "faith", "raw": "1Co_13:7, 1Co_13:13; 2Th_3:2; 1Ti_3:11, 1Ti_4:12; 1Pe_5:12", "note": "", "refs": [{"l": "1Co 13:7", "n": "", "vs": [[7, "إنها تستر كل شيء، وتصدق كل شيء، وترجو كل شيء، وتتحمل كل شيء."]]}, {"l": "1Co 13:13", "n": "", "vs": [[13, "أما الآن، فهذه الثلاثة باقية: الإيمان، والرجاء، والمحبة. ولكن أعظمها هي المحبة!"]]}, {"l": "2Th 3:2", "n": "", "vs": [[2, "ولينقذنا الله من الناس الأردياء الأشرار، لأن الإيمان ليس من نصيب الجميع."]]}, {"l": "1Ti 3:11", "n": "", "vs": [[11, "كذلك يجب أن تكون النساء أيضا رزينات، غير نمامات، نبيهات، أمينات في كل شيء."]]}, {"l": "1Ti 4:12", "n": "", "vs": [[12, "لا يستخف أحد بحداثة سنك. وإنما كن قدوة للمؤمنين، في الكلام والسلوك والمحبة والإيمان والطهارة."]]}, {"l": "1Pe 5:12", "n": "", "vs": [[12, "إني مرسل إليكم هذه الرسالة القصيرة بيد سلوانس الأخ الأمين. وغايتي أن أحرضكم وأشهد لكم أن النعمة التي تتمتعون بها هي نعمة الله الحقيقية التي أنتم فيها ثابتون."]]}], "kwAr": "والأمانة", "noteAr": ""}], "arS": [["وأما ", []], ["ثمر", ["G2590"]], [" ", []], ["الروح", ["G4151"]], [" فهو: ", []], ["المحبة", ["G26"]], [" ", []], ["والفرح", ["G5479"]], [" ", []], ["والسلام", ["G1515"]], ["، ", []], ["وطول البال", ["G3115"]], [" ", []], ["واللطف", ["G5544"]], [" ", []], ["والصلاح", ["G19"]], ["، ", []], ["والأمانة", ["G4102"]]]}, {"c": 5, "v": 23, "text": "والوداعة وضبط النفس. وليس من قانون يمنع مثل هذه الفضائل.", "groups": [{"kw": "temperance", "raw": "Act_24:25; 1Co_9:25; Tit_1:8, Tit_2:2", "note": "", "refs": [{"l": "Act 24:25", "n": "", "vs": [[25, "ولما تحدث بولس عن البر وضبط النفس والدينونة الآتية ارتعب فيلكس، وقال لبولس: «اذهب الآن، ومتى توفر لي الوقت أستدعيك ثانية»."]]}, {"l": "1Co 9:25", "n": "", "vs": [[25, "وكل متبار يفرض على نفسه تدريبا صارما في شتى المجالات. فهؤلاء المتبارون يفعلون ذلك ليفوزوا بإكليل فان، وأما نحن فلنفوز بإكليل غير فان."]]}, {"l": "Tit 1:8", "n": "", "vs": [[8, "بل مضيافا، محبا للصلاح، رزينا، بارا، تقيا، مالكا لطبعه،"]]}, {"l": "Tit 2:2", "n": "", "vs": [[2, "أن يكون الشيوخ ذوي رزانة ووقار، متعقلين، صحيحي الإيمان والمحبة والصبر."]]}], "kwAr": "وضبط النفس", "noteAr": ""}, {"kw": "against", "raw": "1Ti_1:9", "note": "", "refs": [{"l": "1Ti 1:9", "n": "", "vs": [[9, "إذ ندرك أن الشريعة لا تطبق على من كان بارا، بل على الأشرار والمتمردين، على الفاجرين والخاطئين، والنجسين والدنسين، وقاتلي آبائهم وأمهاتهم، وقاتلي الناس،"]]}], "kwAr": "وليس من قانون يمنع", "noteAr": ""}], "arS": [["والوداعة", ["G4236"]], [" ", []], ["وضبط النفس", ["G1466"]], [". وليس من ", []], ["قانون", ["G3551"]], [" يمنع مثل هذه الفضائل.", []]]}, {"c": 5, "v": 24, "text": "ولكن الذين صاروا خاصة للمسيح، قد صلبوا الجسد مع الأهواء والشهوات.", "groups": [{"kw": "they", "raw": "Gal_3:29; Rom_8:9; 1Co_3:23, 1Co_15:23; 2Co_10:7", "note": "", "refs": [{"l": "Gal 3:29", "n": "", "vs": [[29, "فإذا كنتم للمسيح، فأنتم إذن نسل إبراهيم وحسب الوعد وارثون."]]}, {"l": "Rom 8:9", "n": "", "vs": [[9, "وأما أنتم، فلستم تحت سلطة الجسد بل تحت سلطة الروح، إذا كان روح الله ساكنا في داخلكم حقا. ولكن، إن كان أحد ليس له روح المسيح، فهو ليس للمسيح."]]}, {"l": "1Co 3:23", "n": "", "vs": [[23, "وأنتم للمسيح، والمسيح لله."]]}, {"l": "1Co 15:23", "n": "", "vs": [[23, "على أن لكل واحد رتبته: فأولا المسيح بصفته البكر؛ وبعده خاصته لدى رجوعه،"]]}, {"l": "2Co 10:7", "n": "", "vs": [[7, "أتحكمون على الأمور بحسب ظواهرها؟ إن كانت لأحد ثقة في نفسه بأنه يخص المسيح، فليفكر أيضا في نفسه بأنه كما يخص هو المسيح، كذلك نخصه نحن أيضا."]]}], "kwAr": "الذين صاروا خاصة للمسيح", "noteAr": ""}, {"kw": "crucified", "raw": "Gal_5:16-18, Gal_5:20, Gal_6:14; Rom_6:6, Rom_8:13, Rom_13:14; 1Pe_2:11", "note": "", "refs": [{"l": "Gal 5:16-18", "n": "", "vs": [[16, "إنما أقول: اسلكوا في الروح. وعندئذ لا تتممون شهوة الجسد أبدا."], [17, "فإن الجسد يشتهي بعكس الروح، والروح بعكس الجسد؛ وهذان يقاوم أحدهما الآخر حتى إنكم لا تفعلون ما ترغبون فيه."], [18, "ولكن إذا كنتم خاضعين لقيادة الروح، فلستم في حال العبودية للشريعة."]]}, {"l": "Gal 5:20", "n": "", "vs": [[20, "وعبادة الأصنام والسحر، والعداوة والنزاع والغيرة والغضب، والتحزب والانقسام والتعصب،"]]}, {"l": "Gal 6:14", "n": "", "vs": [[14, "أما أنا فحاشا لي أن أفتخر إلا بصليب ربنا يسوع المسيح، الذي به أصبح العالم بالنسبة لي مصلوبا، وأنا أصبحت بالنسبة له مصلوبا."]]}, {"l": "Rom 6:6", "n": "", "vs": [[6, "فنحن نعلم هذا: أن الإنسان العتيق فينا قد صلب معه لكي يبطل جسد الخطيئة فلا نبقى عبيدا للخطيئة فيما بعد."]]}, {"l": "Rom 8:13", "n": "", "vs": [[13, "لأنه إن عشتم بحسب الجسد، فإنكم ستموتون، ولكن إن كنتم بالروح تميتون أعمال الجسد، فستحيون."]]}, {"l": "Rom 13:14", "n": "", "vs": [[14, "وإنما البسوا الرب يسوع المسيح (تمثلوا به)، ولا تنشغلوا بالتدبير للجسد لقضاء شهواته."]]}, {"l": "1Pe 2:11", "n": "", "vs": [[11, "أيها الأحباء، ما أنتم إلا غرباء تزورون الأرض زيارة عابرة. لذلك أطلب إليكم أن تبتعدوا عن الشهوات الجسدية التي تصارع النفس."]]}], "kwAr": "قد صلبوا الجسد", "noteAr": ""}, {"kw": "affections", "raw": "or, passions", "note": "or, passions", "refs": [], "kwAr": "الأهواء والشهوات", "noteAr": "أو: الأهواء (الانفعالات)."}], "arS": [["ولكن الذين صاروا خاصة ", []], ["للمسيح", ["G5547"]], ["، قد ", []], ["صلبوا", ["G4717"]], [" ", []], ["الجسد", ["G4561"]], [" مع ", []], ["الأهواء", ["G3804"]], [" ", []], ["والشهوات", ["G1939"]], [".", []]]}, {"c": 5, "v": 25, "text": "إذا كنا نحيا بالروح، فلنسلك أيضا بالروح.", "groups": [{"kw": "we", "raw": "Joh_6:63; Rom_8:2, Rom_8:10; 1Co_15:45; 2Co_3:6; 1Pe_4:6; Rev_11:11", "note": "", "refs": [{"l": "Joh 6:63", "n": "", "vs": [[63, "الروح هو الذي يعطي الحياة، أما الجسد فلا يفيد شيئا. الكلام الذي كلمتكم به هو روح وحيا ة."]]}, {"l": "Rom 8:2", "n": "", "vs": [[2, "لأن ناموس روح الحياة في المسيح يسوع قد حررني من ناموس الخطيئة ومن الموت."]]}, {"l": "Rom 8:10", "n": "", "vs": [[10, "وإذا كان المسيح فيكم، فمع أن الجسد مائت بسبب الخطيئة، فإن الروح حياة لكم بسبب البر."]]}, {"l": "1Co 15:45", "n": "", "vs": [[45, "فهكذا أيضا قد كتب: «صار الإنسان الأول، آدم، نفسا حية» وأما آدم الأخير فهو روح باعث للحياة."]]}, {"l": "2Co 3:6", "n": "", "vs": [[6, "الذي جعلنا أصحاب كفاءة لنكون خداما لعهد جديد قائم لا على الحرف بل على الروح. فالحرف يؤدي إلى الموت؛ أما الروح فيعطي الحياة."]]}, {"l": "1Pe 4:6", "n": "", "vs": [[6, "ولهذا أبلغت البشارة إلى الأموات أيضا لكي يكونوا دائما أحياء بالروح في نظر الله، مع أن حكم الموت قد نفذ بأجسادهم، فماتوا كغيرهم من الناس."]]}, {"l": "Rev 11:11", "n": "", "vs": [[11, "وبعد أن تمر الأيام الثلاثة ونصف اليوم يبعث الله في النبيين روح الحياة، فينهضان واقفين، ويستولي على الناظرين إليهما خوف شديد."]]}], "kwAr": "إذا كنا نحيا بالروح", "noteAr": ""}, {"kw": "let", "raw": "Gal_5:16; Rom_8:4, Rom_8:5", "note": "", "refs": [{"l": "Gal 5:16", "n": "", "vs": [[16, "إنما أقول: اسلكوا في الروح. وعندئذ لا تتممون شهوة الجسد أبدا."]]}, {"l": "Rom 8:4", "n": "", "vs": [[4, "حتى يتم فينا البر الذي تسعى إليه الشريعة، فينا نحن السالكين لا بحسب الجسد بل بحسب الروح."]]}, {"l": "Rom 8:5", "n": "", "vs": [[5, "فإن الذين هم بحسب الجسد يهتمون بأمور الجسد، والذين هم بحسب الروح يهتمون بأمور الروح."]]}], "kwAr": "فلنسلك أيضا بالروح", "noteAr": ""}], "arS": [["إذا كنا ", []], ["نحيا", ["G2198"]], [" ", []], ["بالروح", ["G4151"]], ["، ", []], ["فلنسلك", ["G4748"]], [" أيضا ", []], ["بالروح", ["G4151"]], [".", []]]}, {"c": 5, "v": 26, "text": "لا نكن طامحين إلى المجد الباطل، يستفز بعضنا بعضا، ويحسد أحدنا الآخر!", "groups": [{"kw": "desirous", "raw": "Luk_14:10; 1Co_3:7; Phi_2:1-3; Jam_4:16", "note": "", "refs": [{"l": "Luk 14:10", "n": "", "vs": [[10, "ولكن، عندما تدعى، فاذهب واتكيء في المكان الأخير، حتى إذا جاء الذي دعاك، يقول لك: ياصديقي، قم إلى الصدر! وعندئذ يرتفع قدرك في نظر المتكئين معك."]]}, {"l": "1Co 3:7", "n": "", "vs": [[7, "فليس الغارس شيئا ولا الساقي، بل الله الذي يعطي النمو."]]}, {"l": "Phi 2:1-3", "n": "", "vs": [[1, "فما دام لنا التشجيع في المسيح، والتعزية في المحبة، والشركة في الروح، ولنا المراحم والحنو،"], [2, "فتمموا فرحي بأن يكون لكم رأي واحد ومحبة واحدة ونفس واحدة وفكر واحد."], [3, "لا يكن بينكم شيء بروح التحزب والافتخار الباطل، بل بالتواضع ليعتبر كل واحد منكم غيره أفضل كثيرا من نفسه،"]]}, {"l": "Jam 4:16", "n": "", "vs": [[16, "وإلا، فإنكم تفتخرون متكبرين. وكل افتخار كهذا، هو افتخار رديء."]]}], "kwAr": "لا نكن طامحين إلى المجد الباطل", "noteAr": ""}, {"kw": "provoking", "raw": "Gal_5:15; Jam_3:14-16; 1Pe_5:5", "note": "", "refs": [{"l": "Gal 5:15", "n": "", "vs": [[15, "فإذا كنتم تنهشون وتفترسون بعضكم بعضا، فاحذروا أن يفني أحدكم الآخر!"]]}, {"l": "Jam 3:14-16", "n": "", "vs": [[14, "أما إن كانت قلوبكم مملوءة بمرارة الحسد وبالتحزب، فلا تفتخروا بحكمتكم، ولا تنكروا الحق."], [15, "إن هذه الحكمة التي تدعونها ليست نازلة من عند الله، بل هي «حكمة» أرضية بشرية شيطانية."], [16, "فحيث تكون مرارة الحسد والتحزب، ينتشر الخلاف والفوضى وجميع الشرور."]]}, {"l": "1Pe 5:5", "n": "", "vs": [[5, "كذلك، أيها الشباب، اخضعوا للشيوخ. البسوا جميعا ثوب التواضع في معاملتكم بعضكم لبعض. لأن الله يقاوم المتكبرين، ولكنه يعطي المتواضعين نعمة."]]}], "kwAr": "يستفز بعضنا بعضا", "noteAr": ""}], "arS": [["لا نكن طامحين إلى ", []], ["المجد الباطل", ["G2755"]], ["، ", []], ["يستفز", ["G4292"]], [" ", []], ["بعضنا بعضا", ["G240"]], ["، ", []], ["ويحسد", ["G5354"]], [" ", []], ["أحدنا الآخر", ["G240"]], ["!", []]]}, {"c": 6, "v": 1, "text": "أيها الإخوة، إن سقط أحدكم في خطأ ما فمثل هذا أصلحوه أنتم الروحيين بروح وداعة. واحذر أنت لنفسك لئلا تجرب أيضا.", "groups": [{"kw": "if", "raw": "or, although", "note": "or, although", "refs": [], "kwAr": "إن سقط أحدكم", "noteAr": "أو: حتى لو."}, {"kw": "overtaken", "raw": "Gal_2:11-13; Gen_9:20-24, Gen_12:11-13; Num_20:10-13; 2Sam. 11:2-27; Mat_26:69, Mat_26:75; Rom_14:1, Rom_15:1; Heb_12:13; Jam_5:19", "note": "", "refs": [{"l": "Gal 2:11-13", "n": "", "vs": [[11, "ولكن لما جاء بطرس إلى مدينة أنطاكية، قاومته وجها لوجه لأنه كان يستحق أن يلام."], [12, "إذ قبل أن يأتي بعضهم من عند يعقوب، كان بطرس يأكل مع الإخوة الذين من الأمم؛ ولكن لما أتى أولئك، انسحب وعزل نفسه، خوفا من أهل الختان."], [13, "وجاراه في ريائه باقي الإخوة الذين من اليهود. حتى إن برنابا أيضا انساق إلى ريائهم."]]}, {"l": "Gen 9:20-24", "n": "", "vs": [[20, "واشتغل نوح بالفلاحة وغرس كرما،"], [21, "وشرب من الخمر فسكر وتعرى داخل خيمته،"], [22, "فشاهد حام أبو الكنعانيين عري أبيه، فخرج وأخبر أخويه اللذين كانا خارجا."], [23, "فأخذ سام ويافث رداء ووضعاه على أكتافهما ومشيا القهقرى إلى داخل الخيمة، وسترا عري أبيهما من غير أن يستديرا بوجهيهما نحوه فيبصرا عريه."], [24, "وعندما أفاق نوح من سكره وعلم ما فعله به ابنه الصغير"]]}, {"l": "Gen 12:11-13", "n": "", "vs": [[11, "وما إن اقترب من تخوم مصر حتى قال لزوجته ساراي: «أنا أعرف أنك امرأة جميلة،"], [12, "فما إن يراك المصريون حتى يقولوا: هذه هي زوجته فيقتلونني ويستحيونك."], [13, "لذلك قولي إنك أختي، فيحسنوا معاملتي من أجلك وتنجو حياتي بفضلك»."]]}, {"l": "Num 20:10-13", "n": "", "vs": [[10, "وجمع موسى وهرون الشعب عند الصخرة وقالا لهم: «اسمعوا أيها المتمردون، أعلينا أن نخرج لكم من هذه الصخرة ماء؟»"], [11, "ورفع موسى يده وضرب الصخرة بعصاه مرتين، فتفجر ماء غزير، فشربت الجماعة ومواشيها."], [12, "فقال الرب لموسى وهرون: «من حيث أنكما لم تؤمنا بي حتى تقدساني على مرأى من بني إسرائيل فإنكما لن تدخلا هذا الشعب الأرض التي وهبتها لهم»."], [13, "فكان هذا ماء مريبة حيث خاصم الإسرائيليون الرب فأظهر قداسته أمامهم."]]}, {"l": "2Sa 11:2-27", "n": "", "vs": [[2, "وفي إحدى الأمسيات نهض داود عن سريره وأخذ يتمشى على سطح قصره، فشاهد امرأة ذات جمال أخاذ تستحم."], [3, "فأرسل داود من يتحرى عنها. فأبلغه أحدهم: «هذه بثشبع بنت أليعام زوجة أوريا الحثي»،"], [4, "فبعث داود يستدعيها. فأقبلت إليه وضاجعها إذ كانت قد تطهرت من طمثها، ثم رجعت إلى بيتها."], [5, "وحملت المرأة فأرسلت تبلغ داود بذلك."], [6, "فوجه داود إلى يوآب قائلا: «أرسل إلي أوريا الحثي». فبعث به يوآب إلى داود."], [7, "وحين مثل لدى داود استفسر منه عن سلامة يوآب والجيش وعن أنباء الحرب."], [8, "ثم قال داود لأوريا: «امض إلى بيتك واغسل رجليك». فخرج أوريا من بيت الملك، وأرسل له هدية إلى بيته."], [9, "غير أن أوريا لم يتوجه إلى بيته، بل نام مع رجال الملك عند باب القصر."], [10, "فأخبروا داود قائلين: «لم يتوجه أوريا إلى بيته». فسأله داود: «ألم ترجع من سفر؟ فلماذا لم تمض إلى بيتك؟»"], [11, "فأجاب: «التابوت وجيش إسرائيل ويهوذا معسكرون في الخيام، وكذلك سيدي يوآب، وبقية قواد الملك مخيمون في العراء، فهل آتي أنا إلى بيتي لآكل وأشرب وأضاجع زوجتي؟ أقسم بحياتك، لن أفعل هذا الأمر»."], [12, "فقال داود لأوريا: «امكث هنا اليوم وغدا أطلقك». فمكث أوريا في أورشليم ذلك اليوم حتى صباح اليوم التالي."], [13, "ولبى دعوة الملك، فأكل في حضرته وشرب حتى أسكره داود. ثم خرج عند المساء ليرقد في مضجعه إلى جوار رجال سيده، ولم يتوجه إلى بيته أيضا."], [14, "وفي الصباح كتب داود رسالة إلى يوآب، بعث بها مع أوريا،"], [15, "جاء فيها: «اجعلوا أوريا في الخطوط الأولى حيث ينشب القتال الشرس، ثم تراجعوا من ورائه ليلقى حتفه»."], [16, "فعين يوآب أوريا في أثناء محاصرة المدينة، في أشد جبهات القتال ضراوة، حيث احتشد أبطال الأعداء."], [17, "فاندفع رجال المدينة لمحاربة يوآب فمات بعض رجال داود ومنهم أوريا الحثي."], [18, "فبعث يوآب رسولا ليطلع داود على أنباء الحرب،"], [19, "وأوصاه قائلا: «إن رأيت أن الملك بعد إبلاغه أنباء الحرب"], [20, "قد ثار غضبه وقال لك: لماذا اقتربتم من سور المدينة للقتال؟ أما علمتم أنهم يرمون بالسهام من فوق السور؟"], [21, "من صرع أبيمالك بن يربوشث؟ ألم ترمه امرأة بحجر رحى من على السور فمات في تاباص؟ لماذا اقتربتم من السور؟ فقل له: قد مات عبدك أوريا الحثي أيضا»."], [22, "فانطلق الرسول إلى داود وأطلعه على آخر أنباء الحرب التي كلفه بها يوآب."], [23, "وقال: «لقد قوي علينا القوم وخرجوا لقتالنا في العراء، ولكننا انكفأنا عليهم وطاردناهم حتى بوابة المدينة."], [24, "فرمى الرماة على عبيدك بالسهام، فقتل بعض ضباط الملك، ومات عبدك أوريا الحثي»."], [25, "فقال داود للرسول: «هذا ما تخبر به يوآب: لا يسوءنك هذا الأمر، فإن السيف يلتهم هذا وذاك. شدد حصارك على المدينة ودمرها. قل هذا لتشجيع يوآب»."], [26, "وعندما علمت زوجة أوريا أن زوجها قد قتل ناحت عليه."], [27, "وحين انقضت فترة الحداد، أرسل داود وأحضرها إلى القصر وتزوجها وولدت ابنا ولكن الرب استاء من هذا الأمر الذي ارتكبه داود."]]}, {"l": "Mat 26:69", "n": "", "vs": [[69, "في تلك الأثناء كان بطرس جالسا في الدار الخارجية، فتقدمت إليه خادمة وقالت: «وأنت كنت مع يسوع الجليلي»."]]}, {"l": "Mat 26:75", "n": "", "vs": [[75, "فتذكر بطرس كلمة يسوع إذ قال له: «قبل أن يصيح الديك تكون قد أنكرتني ثلاث مرات». فخرج إلى الخارج، وبكى بكاء مرا."]]}, {"l": "Rom 14:1", "n": "", "vs": [[1, "ومن كان ضعيفا في الإيمان، فاقبلوه بينكم دون أن تحاكموه على أرائه."]]}, {"l": "Rom 15:1", "n": "", "vs": [[1, "ولكن علينا نحن الأقوياء (في الإيمان)، أن نحتمل ضعف الضعفاء (فيه)، وأن لا نرضي أنفسنا."]]}, {"l": "Heb 12:13", "n": "", "vs": [[13, "ومهدوا لأقدامكم طرقا مستقيمة، حتى لا تنحرف أرجل العرج، بل تشفى!"]]}, {"l": "Jam 5:19", "n": "", "vs": [[19, "أيها الإخوة، إن ضل أحد بينكم عن الحق، ورده آخر،"]]}], "kwAr": "في خطأ ما", "noteAr": ""}, {"kw": "spiritual", "raw": "Rom_8:6, Rom_15:1; 1Co_2:15, 1Co_3:1, 1Co_14:37", "note": "", "refs": [{"l": "Rom 8:6", "n": "", "vs": [[6, "فاهتمام الجسد هو موت؛ وأما اهتمام الروح فهو حياة وسلام."]]}, {"l": "Rom 15:1", "n": "", "vs": [[1, "ولكن علينا نحن الأقوياء (في الإيمان)، أن نحتمل ضعف الضعفاء (فيه)، وأن لا نرضي أنفسنا."]]}, {"l": "1Co 2:15", "n": "", "vs": [[15, "أما الإنسان الروحي، فهو يميز كل شيء، ولا يحكم فيه من أحد."]]}, {"l": "1Co 3:1", "n": "", "vs": [[1, "على أني، أيها الإخوة، لم أستطع أن أكلمكم باعتباركم روحيين، بل باعتباركم جسديين وأطفالا في المسيح."]]}, {"l": "1Co 14:37", "n": "", "vs": [[37, "فإن اعتبر أحد نفسه نبيا أو صاحب موهبة روحية، فليدرك أن ما أكتبه إليكم إنما هو وصية الرب."]]}], "kwAr": "أنتم الروحيين", "noteAr": ""}, {"kw": "restore", "raw": "2Sa_12:1-15; Job_4:3, Job_4:4; Isa_35:3, Isa_35:4; Eze_34:16; Mat_9:13, Mat_18:12-15; Luk_15:4-7, Luk_15:22-32; Heb_12:13; Jam_5:19, Jam_5:20; 1Jo_5:16; Jud_1:22, Jud_1:23", "note": "", "refs": [{"l": "2Sa 12:1-15", "n": "", "vs": [[1, "وأرسل الرب ناثان إلى داود. وعندما وفد عليه قال له: «عاش رجلان في مدينة واحدة، أحدهما ثري والآخر فقير."], [2, "وكان الغني يمتلك قطعان بقر وغنم كثيرة."], [3, "وأما الفقير فلم يكن له سوى نعجة واحدة صغيرة، اشتراها ورعاها فكبرت معه ومع أبنائه، تأكل مما يأكل وتشرب من كأسه وتنام في حضنه كأنها ابنته."], [4, "ثم نزل ضيف على الرجل الغني، فامتنع أن يذبح من غنمه ومن بقره ليعد طعاما لضيفه، بل سطا على نعجة الفقير وهيأها له»."], [5, "عندئذ احتدم غضب داود على الرجل الغني وقال لناثان: «حي هو الرب، إن الجاني يستوجب الموت،"], [6, "وعليه أن يرد للرجل الفقير أربعة أضعاف لأنه ارتكب هذا الذنب ولم يشفق»."], [7, "فقال ناثان لداود: «أنت هو الرجل! وهذا ما يقوله الرب إله إسرائيل: لقد اخترتك لتكون ملكا على إسرائيل وأنقذتك من قبضة شاول،"], [8, "ووهبتك بيت سيدك وزوجاته، ووليتك على بني إسرائيل ويهوذا. ولو كان ذلك قليلا لوهبتك المزيد."], [9, "فلماذا احتقرت كلام الرب لتقترف الشر أمامه؟ قتلت أوريا الحثي بسيف العمونيين وتزوجت امرأته."], [10, "لذلك لن يفارق السيف بيتك إلى الأبد، لأنك احتقرتني واغتصبت امرأة أوريا الحثي»."], [11, "واستطرد: «هذا ما يقوله الرب: سأثير عليك من أهل بيتك من ينزل بك البلايا، وآخذ نساءك أمام عينيك وأعطيهن لقريبك، فيضاجعهن في وضح النهار."], [12, "أنت ارتكبت خطيئتك في السر، وأنا أفعل هذا الأمر على مرأى جميع بني إسرائيل وفي وضح النهار»."], [13, "فقال داود لناثان: «قد أخطأت إلى الرب». فقال ناثان: «والرب قد نقل عنك خطيئتك، فلن تموت."], [14, "ولكن لأنك جعلت أعداء الرب يشمتون من جراء هذا الأمر، فإن الابن المولود لك يموت»."], [15, "وانصرف ناثان إلى بيته. وما لبث أن أصاب الرب الطفل الذي أنجبته أرملة أوريا الحثي لداود بمرض."]]}, {"l": "Job 4:3", "n": "", "vs": [[3, "لكم أرشدت كثيرين وشددت أيادي مرتخية."]]}, {"l": "Job 4:4", "n": "", "vs": [[4, "ولكم أنهض كلامك العاثر، وثبت الركب المصطكة!"]]}, {"l": "Isa 35:3", "n": "", "vs": [[3, "شددوا الأيدي المسترخية، وثبتوا الركب المرتعشة."]]}, {"l": "Isa 35:4", "n": "", "vs": [[4, "قولوا لذوي القلوب الخائرة: «تقووا ولا تفزعوا، فها هو إلهكم قادم، مقبل بالنقمة، حامل جزاءه. سيأتي ويخلصكم»."]]}, {"l": "Eze 34:16", "n": "", "vs": [[16, "وأطلب الضال وأسترجع المطرود وأجبر الكسير وأعصب الجريح وأستأصل السمين والقوي، وأرعاها بعدل."]]}, {"l": "Mat 9:13", "n": "", "vs": [[13, "اذهبوا وتعلموا معنى القول: إني أطلب رحمة لا ذبيحة. فإني ما جئت لأدعو أبرارا بل خاطئين! »"]]}, {"l": "Mat 18:12-15", "n": "", "vs": [[12, "ما رأيكم في إنسان كان عنده مئة خروف، فضل واحد منها: أفلا يترك التسعة والتسعين في الجبال، ويذهب يبحث عن الضال؟"], [13, "الحق أقول لكم: إنه إذا وجده، فإنه يفرح به أكثر من فرحه بالتسعة والتسعين التي لم تضل!"], [14, "وهكذا، لا يشاء أبوكم الذي في السماوات أن يهلك واحد من هؤلاء الصغار."], [15, "إن أخطأ إليك أخوك، فاذهب إليه وعاتبه بينك وبينه على انفراد. فإذا سمع لك، تكون قد ربحت أخاك."]]}, {"l": "Luk 15:4-7", "n": "", "vs": [[4, "«أي إنسان منكم عنده مئة خروف وأضاع واحدا منها، ألا يترك التسعة والتسعين في البرية ويذهب يبحث عن الخروف الضائع حتى يجده؟"], [5, "وبعد أن يجده، يحمله على كتفيه فرحا،"], [6, "ثم يعود إلى البيت، ويدعو الأصدقاء والجيران، قائلا لهم: افرحوا معي، لأني وجدت خروفي الضائع !"], [7, "أقول لكم إنه هكذا يكون في السماء فرح بخاطيء واحد تائب أكثر من تسعة وتسعين بارا لا يحتاجون إلى توبة!"]]}, {"l": "Luk 15:22-32", "n": "", "vs": [[22, "أما الأب فقال لعبيده: أحضروا سريعا أفضل ثوب وألبسوه، وضعوا في إصبعه خاتما وفي قدميه حذاء."], [23, "وأحضروا العجل المسمن واذبحوه؛ ولنأكل ونفرح:"], [24, "فإن ابني هذا كان ميتا فعاش، وكان ضائعا فوجد. فأخذوا يفرحون!"], [25, "وكان ابنه الأكبر في الحقل. فلما جاء واقترب من البيت، سمع موسيقى ورقصا."], [26, "فدعا واحدا من الخدام واستفسره ما عسى أن يكون ذلك."], [27, "فأجابه: رجع أخوك، فذبح أبوك العجل المسمن لأنه استعاده سالما!"], [28, "ولكنه غضب ورفض أن يدخل. فخرج أبوه وتوسل إليه."], [29, "غير أنه رد على أبيه قائلا: ها أنا أخدمك هذه السنين العديدة، ولم أخالف لك أمرا، ولكنك لم تعطني ولو جديا واحدا لأفرح مع أصدقائي."], [30, "ولكن لما عاد ابنك هذا الذي أكل مالك مع الفاجرات، ذبحت له العجل المسمن!"], [31, "فقال له: يابني، أنت معي دائما، وكل ما أملكه هو لك!"], [32, "ولكن كان من الصواب أن نفرح ونبتهج، لأن أخاك هذا كان ميتا فعاش، وكان ضالا فوجد!»"]]}, {"l": "Heb 12:13", "n": "", "vs": [[13, "ومهدوا لأقدامكم طرقا مستقيمة، حتى لا تنحرف أرجل العرج، بل تشفى!"]]}, {"l": "Jam 5:19", "n": "", "vs": [[19, "أيها الإخوة، إن ضل أحد بينكم عن الحق، ورده آخر،"]]}, {"l": "Jam 5:20", "n": "", "vs": [[20, "فليتأكد أن الذي يرد خاطئا عن ضلال مسلكه، فإنما ينقذ نفسا من الموت، ويستر خطايا كثيرة!"]]}, {"l": "1Jo 5:16", "n": "", "vs": [[16, "إن رأى أحد منكم واحدا من إخوته يمارس خطيئة لا تنتهي به إلى الموت، فمن واجبه أن يصلي إلى الله من أجله، فيبقيه على قيد الحياة. هذا إذا كانت الخطيئة التي يمارسها لا تنتهي به إلى الموت. فهنالك خطيئة لابد أن تنتهي إلى الموت. وطبعا، أنا لا أقصد هذه الخطيئة هنا."]]}, {"l": "Jud 1:22", "n": "", "vs": [[22, "بعض الناس يجب أن تعاملوهم بشفقة بسبب شكوكهم."]]}, {"l": "Jud 1:23", "n": "", "vs": [[23, "وبعضهم يجب أن تنقذوهم من النار خطفا. وآخرون يجب أن تعالجوهم بشفقة وحذر، مبغضين حتى الثياب التي يلوثونها بأجسادهم."]]}], "kwAr": "أصلحوه", "noteAr": ""}, {"kw": "in the", "raw": "Gal_5:23; Mat_11:29; 1Co_4:21; 2Co_10:1; 2Th_3:15; 2Ti_2:25; Jam_3:13; 1Pe_3:15", "note": "", "refs": [{"l": "Gal 5:23", "n": "", "vs": [[23, "والوداعة وضبط النفس. وليس من قانون يمنع مثل هذه الفضائل."]]}, {"l": "Mat 11:29", "n": "", "vs": [[29, "احملوا نيري عليكم، وتتلمذوا على يدي، لأني وديع ومتواضع القلب، فتجدوا الراحة لنفوسكم."]]}, {"l": "1Co 4:21", "n": "", "vs": [[21, "كيف تفضلون أن آتي إليكم: أبالعصا أو بالمحبة وروح الوداعة؟"]]}, {"l": "2Co 10:1", "n": "", "vs": [[1, "ولكني أتوسل إليكم بوداعة المسيح وحلمه، أنا بولس «المتواضع وأنا حاضر بينكم، والجريء عليكم وأنا غائب عنكم»،"]]}, {"l": "2Th 3:15", "n": "", "vs": [[15, "ولكن، لا تعتبروه عدوا لكم، بل أرشدوه باعتباره أخا."]]}, {"l": "2Ti 2:25", "n": "", "vs": [[25, "ويؤدب بالوداعة مقاومي الإيمان، عسى أن يمنحهم الله التوبة، فيعرفوا الحق بالتمام،"]]}, {"l": "Jam 3:13", "n": "", "vs": [[13, "أبينكم بعض الحكماء والفهماء؟ إذن، على هؤلاء أن يسلكوا سلوكا حسنا، مظهرين بأعمالهم تلك الوداعة التي تتصف بها الحكمة (الحقيقية)."]]}, {"l": "1Pe 3:15", "n": "", "vs": [[15, "وإنما كرسوا المسيح ربا في قلوبكم. وكونوا دائما مستعدين لأن تقدموا جوابا مقنعا لكل من يسألكم عن سبب الرجاء الذي في داخلكم"]]}], "kwAr": "بروح وداعة", "noteAr": ""}, {"kw": "considering", "raw": "1Co_7:5, 1Co_10:12; Heb_13:3; Jam_3:2", "note": "", "refs": [{"l": "1Co 7:5", "n": "", "vs": [[5, "فلا يمنع أحدكما الآخر عن نفسه إلا حين تتفقان معا على ذلك، ولفترة معينة، بقصد التفرغ للصلاة. وبعد ذلك عودا إلى علاقتكما السابقة، لكي لا يجربكما الشيطان لعدم ضبط النفس."]]}, {"l": "1Co 10:12", "n": "", "vs": [[12, "فمن توهم أنه صامد، فليحذر أن يسقط."]]}, {"l": "Heb 13:3", "n": "", "vs": [[3, "اهتموا دائما بالمسجونين، كأنكم مسجونون معهم. وتعاطفوا مع المظلومين، كأنكم مظلومون معهم."]]}, {"l": "Jam 3:2", "n": "", "vs": [[2, "فإننا جميعا معرضون للوقوع في أخطاء كثيرة. ولكن من يلجم لسانه ولا يخطيء في كلامه هو ناضج يقدر أن يسيطر على طبيعته سيطرة تامة."]]}], "kwAr": "واحذر أنت لنفسك", "noteAr": ""}], "arS": [["أيها ", []], ["الإخوة", ["G80"]], ["، إن ", []], ["سقط", ["G4301"]], [" أحدكم في ", []], ["خطأ", ["G3900"]], [" ما فمثل هذا ", []], ["أصلحوه", ["G2675"]], [" أنتم ", []], ["الروحيين", ["G4152"]], [" ", []], ["بروح", ["G4151"]], [" ", []], ["وداعة", ["G4236"]], [". ", []], ["واحذر", ["G4648"]], [" أنت ", []], ["لنفسك", ["G4572"]], [" لئلا ", []], ["تجرب", ["G3985"]], [" أيضا.", []]]}, {"c": 6, "v": 2, "text": "ليحمل الواحد منكم أثقال الآخر، وهكذا تتممون شريعة المسيح.", "groups": [{"kw": "Bear", "raw": "Gal_6:5, Gal_5:13, Gal_5:14; Exo_23:5; Num_11:11, Num_11:12; Deu_1:12; Isa_58:6; Mat_8:17, Mat_11:29, Mat_11:30; Luk_11:46; Rom_15:1; 1Th_5:14; 1Pe_2:24", "note": "", "refs": [{"l": "Gal 6:5", "n": "", "vs": [[5, "فإن كل واحد سيحمل حمله الخاص."]]}, {"l": "Gal 5:13", "n": "", "vs": [[13, "فإنما إلى الحرية قد دعيتم، أيها الإخوة؛ ولكن لا تتخذوا من الحرية ذريعة لإرضاء الجسد، بل بالمحبة كونوا عبيدا في خدمة أحدكم الآخر."]]}, {"l": "Gal 5:14", "n": "", "vs": [[14, "فإن الشريعة كلها تتم في وصية واحدة: «أن تحب قريبك كنفسك»."]]}, {"l": "Exo 23:5", "n": "", "vs": [[5, "وإذا عاينت حمار مبغضك واقعا تحت حمله، فلا تتجاوزه حتى تسعف عدوك في حل ثقل حماره."]]}, {"l": "Num 11:11", "n": "", "vs": [[11, "فقال موسى للرب: «لماذا أسأت إلى عبدك ولم ترض عنه حتى إنك حملته مسئولية هذا الشعب؟"]]}, {"l": "Num 11:12", "n": "", "vs": [[12, "ألعلي حبلت به أو ولدته، حتى تقول لي احمله في حضنك كما يحمل المربي الرضيع، وقده إلى الأرض التي وعدت بها آباءه."]]}, {"l": "Deu 1:12", "n": "", "vs": [[12, "ولكن كيف يمكن أن أحمل وحدي مشاكلكم وأثقالكم وخصوماتكم؟"]]}, {"l": "Isa 58:6", "n": "", "vs": [[6, "أليس الصوم الذي أختاره يكون في فك قيود الشر، وحل عقد النير، وإطلاق سراح المتضايقين، وتحطيم كل نير؟"]]}, {"l": "Mat 8:17", "n": "", "vs": [[17, "لكي يتم ما قيل بلسان النبي إشعياء القائل: «هو أخذ أسقامنا، وحمل أمراضنا»."]]}, {"l": "Mat 11:29", "n": "", "vs": [[29, "احملوا نيري عليكم، وتتلمذوا على يدي، لأني وديع ومتواضع القلب، فتجدوا الراحة لنفوسكم."]]}, {"l": "Mat 11:30", "n": "", "vs": [[30, "فإن نيري هين، وحملي خفيف!»"]]}, {"l": "Luk 11:46", "n": "", "vs": [[46, "فقال: «والويل أيضا لكم يا ختبروا أنفسكم. ألستم تعرفون أنفسكم، أن يسوع المسيح فيكم، إلا إذا تبين أنكم فاشلون؟"]]}], "kwAr": "فليمتحن كل واحد عمله", "noteAr": ""}, {"kw": "rejoicing", "raw": "Pro_14:14; 1Co_4:3, 1Co_4:4; 2Co_1:12; 1Jo_3:19-22", "note": "", "refs": [{"l": "Pro 14:14", "n": "", "vs": [[14, "ذو القلب المرتد يجازى بمقتضى طرقه، والصالح يثاب."]]}, {"l": "1Co 4:3", "n": "", "vs": [[3, "أما أنا، فأقل ما أهتم به هو أن يتم الحكم في من قبلكم أو من قبل محكمة بشرية. بل أنا بذاتي لست أحكم على نفسي."]]}, {"l": "1Co 4:4", "n": "", "vs": [[4, "فإن ضميري لا يؤنبني بشيء، ولكني لست أعتمد ذلك لتبرير نفسي. فإن الذي يحكم في هو الرب."]]}, {"l": "2Co 1:12", "n": "", "vs": [[12, "فإن فخرنا هو هذا: شهادة ضميرنا بأننا، في قداسة الله وإخلاصه، قد سلكنا في العالم، وبخاصة تجاهكم؛ ولم يكن ذلك بحكمة بشرية بل بنعمة الله."]]}, {"l": "1Jo 3:19-22", "n": "", "vs": [[19, "عندئذ نتأكد أننا نتصرف بحسب الحق، وتطمئن نفوسنا في حضرة الله،"], [20, "ولو لامتنا قلوبنا؛ فإن الله أعظم من قلوبنا، وهو العليم بكل شيء."], [21, "أيها الأحباء، إذا كانت ضمائرنا لا تلومنا. فهذا دليل على أن لنا ثقة عظيمة من نحو الله."], [22, "ومهما نطلب منه بالصلاة، نحصل عليه: لأننا نطيع ما يوصينا به، ونمارس الأعمال التي ترضيه."]]}], "kwAr": "يكون له أن يفتخر", "noteAr": ""}, {"kw": "and not", "raw": "Gal_6:13; Luk_18:11; 1Co_1:12, 1Co_1:13, 1Co_3:21-23, 1Co_4:6, 1Co_4:7; 2Co_11:12, 2Co_11:13", "note": "", "refs": [{"l": "Gal 6:13", "n": "", "vs": [[13, "فحتى أولئك الذين يختنون، هم أنفسهم، لا يعملون بالشريعة، بل يريدون لكم أن تختنوا ليفتخروا بجسدكم."]]}, {"l": "Luk 18:11", "n": "", "vs": [[11, "فوقف الفريسي يصلي في نفسه هكذا: أشكرك، ياالله ، لأني لست مثل باقي الناس الطماعين الظالمين الزناة، ولا مثل جابي الضرائب هذا:"]]}, {"l": "1Co 1:12", "n": "", "vs": [[12, "أعني أن واحدا منكم يقول: «أنا مع بولس» وآخر: «أنا مع أبلوس»، وآخر: «أنا مع بطرس»، وآخر: «أنا مع المسيح»."]]}, {"l": "1Co 1:13", "n": "", "vs": [[13, "فهل تجزأ المسيح؟ أم أن بولس صلب لأجلكم، أو باسم بولس تعمدتم؟"]]}, {"l": "1Co 3:21-23", "n": "", "vs": [[21, "إذن، لا يفتخر أحد بالبشر، لأن كل شيء ه مع ملائكته، فيجازي كل واحد حسب أعماله."]]}, {"l": "Rom 2:6-9", "n": "", "vs": [[6, "فإنه سيجازي كل إنسان بحسب أعماله."], [7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"], [8, "ويكون الغضب والسخط للمخاصمين الذين يرفضون الطاعة للحق ولكنهم يخضعون للإثم."], [9, "فالشدة والضيق على نفس كل إنسان يعمل الشر اليهودي أولا ثم اليوناني؛"]]}, {"l": "Rom 14:10-12", "n": "", "vs": [[10, "ولكن، لماذا أنت تدين أخاك؟ وأنت أيضا، لماذا تحتقر أخاك؟ فإننا جميعا سوف نقف أمام عرش الله لنحاسب."], [11, "فإنه قد كتب: «أنا حي، يقول الرب، لي ستنحني كل ركبة، وسيعترف كل لسان لله!»"], [12, "إذا، كل واحد منا سيؤدي حسابا عن نفسه لله."]]}, {"l": "1Co 3:8", "n": "", "vs": [[8, "فالغارس والساقي سواء. إلا أن كلا منهما سينال أجرته بالنسبة إلى تعبه."]]}, {"l": "1Co 4:5", "n": "", "vs": [[5, "إذن، لا تحكموا في شيء قبل الأوان، ريثما يرجع الرب الذي سيسلط النور على الأشياء التي يحجبها الظلام الآن، ويكشف نيات القلوب، عندئذ ينال كل واحد حقه من المدح من عند الله!"]]}, {"l": "2Co 5:10", "n": "", "vs": [[10, "إذ لابد أن نقف جميعا مكشوفين أمام عرش المسيح، لينال كل واحد منا استحقاق ما عمله حين كان في الجسد، أصالحا كان أم رديئا!"]]}, {"l": "2Co 5:11", "n": "", "vs": [[11, "فبدافع وعينا لرهبة الرب، نحاول إقناع الناس. ولكننا ظاهرون أمام الله، وأرجو أن نكون ظاهرين أيضا في ضمائركم."]]}, {"l": "Rev 2:23", "n": "", "vs": [[23, "سأبيد أولادها بالموت، فتعرف الكنائس كلها أنني أنا الذي أفحص الأفكار والقلوب، وأجازي كل واحد منكم بحسب أعماله."]]}, {"l": "Rev 20:12-15", "n": "", "vs": [[12, "ورأيت الأموات، كبارا وصغارا، واقفين قدام العرش. وفتحت الكتب، ثم فتح كتاب آخر هو سجل الحياة، ودين الأموات بحسب ما هو مدون في تلك الكتب، كل واحد حسب أعماله."], [13, "وسلم البحر من فيه من الأموات، وسلم الموت وهاوية الموتى الأموات الذين فيهما، وحكم على كل واحد بحسب أعماله."], [14, "وطرح الموت وهاوية الموتى في بحيرة النار، الذي هو الموت الثاني."], [15, "وكل من لم يوجد اسمه مكتوبا في سجل الحياة طرح في بحيرة النار!"]]}, {"l": "Rev 22:12", "n": "", "vs": [[12, "إني آت سريعا، ومعي المكافأة لأجازي كل واحد بحسب عمله."]]}], "kwAr": "", "noteAr": ""}], "arS": [["فإن ", []], ["كل واحد", ["G1538"]], [" ", []], ["سيحمل", ["G941"]], [" ", []], ["حمله", ["G5413"]], [" ", []], ["الخاص", ["G2398"]], [".", []]]}, {"c": 6, "v": 6, "text": "ليشارك الذي يتعلم الكلمة من يعلمها، في جميع الخيرات.", "groups": [{"kw": "", "raw": "Deu_12:19; Mat_10:10; Rom_15:27; 1Co_9:9-14; 1Ti_5:17, 1Ti_5:18", "note": "", "refs": [{"l": "Deu 12:19", "n": "", "vs": [[19, "إياكم إهمال اللاويين طوال بقائكم على أرضكم."]]}, {"l": "Mat 10:10", "n": "", "vs": [[10, "ولا تأخذوا للطريق زادا ولا ثوبين ولا حذاء ولا عصا: فإن العامل يستحق طعامه."]]}, {"l": "Rom 15:27", "n": "", "vs": [[27, "حسن لديهم ذلك، وهم في دين لأولئك القديسين: فإذا كان الأمم قد اشتركوا في ما هو روحي عند أولئك، فعليهم أيضا أن يخدموهم في ما هو مادي."]]}, {"l": "1Co 9:9-14", "n": "", "vs": [[9, "فإنه مكتوب في شريعة موسى: «لا تضع كمامة على فم الثور وهو يدرس الحنطة». ترى، هل تهم الله الثيران،"], [10, "أم يقول ذلك كله من أجلنا؟ نعم، فمن أجلنا قد كتب ذلك، لأنه من حق الفلاح أن يفلح برجاء، والدراس أن يدرس برجاء، على أمل الاشتراك في الغلة."], [11, "وما دمنا نحن قد زرعنا لكم الأمور الروحية، فهل يكون كثيرا علينا أن نحصد منكم الأمور المادية؟"], [12, "إن كان لغيرنا هذا الحق عليكم، أفلا نكون نحن أحق؟ ولكننا لم نستعمل هذا الحق؟ بل نتحمل كل شيء، مخافة أن نضع أي عائق أمام إنجيل المسيح !"], [13, "أما تعلمون أن الذين يشتغلون بالمقدسات كانوا يأكلون مما يقدم إلى الهيكل، وأن الذين يقومون بخدمة المذبح، كانوا يشتركون في خيرات المذبح؟"], [14, "هكذا أيضا رسم الرب للذين يبشرون بالإنجيل أن يعيشوا من الإنجيل."]]}, {"l": "1Ti 5:17", "n": "", "vs": [[17, "أما الشيوخ الذين يحسنون القيادة، فليعتبروا أهلا للإكرام المضاعف، وبخاصة الذين يبذلون الجهد في نشر الكلمة وفي التعليم."]]}, {"l": "1Ti 5:18", "n": "", "vs": [[18, "لأن الكتاب يقول: «لا تضع كمامة على فم الثور وهو يدرس الحبوب»، وأيضا: ¢العامل يستحق أجرته¢."]]}], "kwAr": "", "noteAr": ""}], "arS": [["ليشارك", ["G2841"]], [" الذي ", []], ["يتعلم", ["G2727"]], [" ", []], ["الكلمة", ["G3056"]], [" من ", []], ["يعلمها", ["G2727"]], oh 4:36", "n": "", "vs": [[36, "والحاصد يأخذ أجرته، ويجمع الثمر للحياة الأبدية، فيفرح الزارع والحاصد معا،"]]}, {"l": "Joh 6:27", "n": "", "vs": [[27, "لا تسعوا وراء الطعام الفاني، بل وراء الطعام الباقي إلى الحياة الأبدية، والذي يعطيكم إياه ابن الإنسان، لأن هذا الطعام قد وضع الله الآب ختمه عليه»."]]}, {"l": "Rom 6:22", "n": "", "vs": [[22, "أما الآن، وقد حررتم من الخطيئة وصرتم عبيدا لله، فإن لكم ثمركم للقداسة، والعاقبة هي الحياة الأبدية."]]}, {"l": "1Ti 1:16", "n": "", "vs": [[16, "ولكن لهذا السبب عوملت بالرحمة، ليجعل يسوع المسيح مني، أنا أولا، مثالا يظهر صبره الطويل، لجميع الذين سيؤمنون به لنوال الحياة الأبدية."]]}, {"l": "Tit 3:7", "n": "", "vs": [[7, "حتى إذا تبررنا بنعمته، نصير ورثة، وفقا لرجائنا بالحياة الأبدية."]]}, {"l": "Jud 1:21", "n": "", "vs": [[21, "واحفظوا أنفسكم في محبة الله، منتظرين رحمة ربنا يسوع المسيح إذ يعود ويأخذكم لتحيوا معه إلى الأبد."]]}], "kwAr": "فمن الروح يحصد حياة أبدية", "noteAr": ""}], "arS": [["فإن من ", []], ["يزرع", ["G4687"]], [" ", []], ["لجسده", ["G4561"]], ["، فمن ", []], ["الجسد", ["G4561"]], [" ", []], ["يحصد", ["G2325"]], [" ", []], ["فسادا", ["G5356"]], [". ومن ", []], ["يزرع", ["G4687"]], [" ", []], ["للروح", ["G4151"]], ["، فمن ", []], ["الروح", ["G4151"]], [" ", []], ["يحصد", ["G2325"]], [" ", []], ["حياة", ["G2222"]], [" ", []], ["أبدية", ["G166"]], [". فلا ", []], ["نفشل", ["G1573"]], [" في ", []], ["عمل", ["G4160"]], [" ", []], ["الخير", ["G2570"]], ["،", []]]}, {"c": 6, "v": 9, "text": "لأننا، متى حان الأوان، سنحصد، إن كنا لا نتراخى.", "groups": [{"kw": "us", "raw": "Mal_1:13; 1Co_15:58; 2Th_3:13; Heb_12:3", "note": "", "refs": [{"l": "Mal 1:13", "n": "", "vs": [[13, "ثم قلتم: ما هذه المشقة التي نتكبدها؟ وتأففتم علي، يقول الرب القدير. وتقربون إلي ما استوليتم عليه ظلما وما هو أعرج أو مريض، فيكون هذا تقدمة قربانكم فهل أقبل هذا من أيديكم؟ يقول الرب."]]}, {"l": "1Co 15:58", "n": "", "vs": [[58, "إذن، ياإخوتي الأحباء، كونوا راسخين غير متزحزحين، كثيري الاجتهاد في عمل الرب دائما، عالمين أن جهدكم في الرب ليس عبثا!"]]}, {"l": "2T "l": "Isa 40:30", "n": "", "vs": [[30, "إن الشبيبة ينالها الإعياء والإرهاق، والفتيان يتعثرون أشد تعثر،"]]}, {"l": "Isa 40:31", "n": "", "vs": [[31, "أما الراجون الرب فإنهم يجددون قوتهم، ويحلقون بأجنحة النسور. يركضون ولا يعيون. يمشون ولا يتعبون."]]}, {"l": "Zep 3:16", "n": "*marg.", "vs": [[16, "ويقال في ذلك اليوم لأورشليم: لا تخافي ياصهيون، ولا ترتخ يداك."]]}, {"l": "Mat 24:13", "n": "", "vs": [[13, "ولكن الذي يثبت حتى النهاية، فهو يخلص."]]}, {"l": "Luk 18:1", "n": "", "vs": [[1, "وضرب لهم مثلا في وجوب الصلاة دائما ودون ملل،"]]}, {"l": "2Co 4:1", "n": "", "vs": [[1, "فما دامت لنا إذن هذه الخدمة برحمة من الله، فلا تخور عزيمتنا."]]}, {"l": "2Co 4:16", "n": "", "vs": [[16, "لهذا، لا تخور عزيمتنا! ولكن، مادام الإنسان الظاهر فينا يفنى، فإن الإنسان الباطن فينا يتجدد يوما فيوما."]]}, {"l": "Eph 3:13", "n": "", "vs": [[13, "فلذلك أطلب إليكم ألا يفتر عزمكم بسبب الضيقات التي أقاسيها لأجلكم، فهي مفخرة لكم."]]}, {"l": "Heb 3:6", "n": "", "vs": [[6, "أما المسيح، فهو أمين بصفته ابنا يترَأس على البيت. وهذا البيت هو نحن المؤمنين، على أن نتمسك بالثقة والافتخار برجائنا تمسكا ثابتا حتى النهاية."]]}, {"l": "Heb 3:14", "n": "", "vs": [[14, "فإن تمسكنا دائما بالثقة التي انطلقنا بها في البداية، وأبقيناها ثابتة إلى النهاية، نكون مشاركين للمسيح."]]}, {"l": "Heb 10:35-39", "n": "", "vs": [[35, "إذن، لا تتخلوا عن ثقتكم بالرب. فإن لها مكافأة عظيمة."], [36, "إنكم تحتاجون إلى الصبر لتعملوا إرادة الله، فتنالوا البركة التي وعدتم بها."], [37, "فقريبا جدا، سيأتي الآتي ولا يتمهل."], [38, "وأما من تبرر بالإيمان، فبالإيمان يحيا. ومن ارتد لا تسر به نفسي!"], [39, "ولكننا نحن لسنا من أهل الارتداد المؤدي إلى الهلاك، بل من أهل الإيمان المؤدي إلى خلاص نفوسنا!"]]}, {"l": "Heb 12:3", "n": "", "vs": [[3, "فتأملوا مليا ما قاساه بتحمله تلك المعاملة العنيفة التي عامله بها الخاطئون، لكي لا تتعبوا وتنهاروا!"]]}, {"l": "Heb 12:5", "n": "", "vs": [[5, "فهل نسيتم الوعظ الذي يخاطبكم به الله بوصفكم أبناء له؟ إذ يقول: «ياابني، لا تستخف بتأديب الرب. ولا تفقد العزيمة حين يوبخك على الخطأ."]]}, {"l": "Rev 2:3", "n": "", "vs": [[3, "وقد تألمت من أجل اسمي بصبر وبغير كلل."]]}, {"l": "Rev 2:7", "n": "", "vs": [[7, "من له أذنان فليسمع ما يقوله الروح للكنائس! كل من ينتصر سأطعمه من ثمر شجرة الحياة في فردوس الله."]]}, {"l": "Rev 2:10", "n": "", "vs": [[10, "دع عنك الخوف مما ينتظرك من آلام، فإن إبليس سيزج ببعضكم في السجن لكي تمتحنوا، فتقاسون الاضطهاد عشرة أيام. فابق أمينا حتى الموت، فأمنحك إكليل الحياة."]]}, {"l": "Rev 2:11", "n": "", "vs": [[11, "من له أذن فليسمع ما يقوله الروح للكنائس! كل من ينتصر لن يلحق به أذى الموت الثاني!"]]}, {"l": "Rev 2:17", "n": "", "vs": [[17, "من له أذن فليسمع ما يقوله الروح للكنائس! كل من سينتصر سأطعمه من المن الخفي، وأعطيه حجرا صغيرا أبيض حفر عليه اسم جديد لا يعرفه إلا الذي يأخذه!"]]}, {"l": "Rev 2:26-29", "n": "", "vs": [[26, "كل من ينتصر، ويستمر حتى النهاية في فعل ما يرضيني، فسوف أعطيه سلطانا على الأمم،"], [27, "فيحكمهم بعصا من حديد، مثلما أخذت أنا من أبي سلطانا أحكمهم به، فيتحطمون كما تتحطم أواني الخزف،"], [28, "وأمنحه كوكب الصبح!"], [29, "من له أذن فليسمع ما يقوله الروح للكنائس!"]]}, {"l": "Rev 3:5", "n": "", "vs": [[5, "كل من ينتصر سيلبس ثوبا أبيض، ولن أمحو اسمه من سجل الحياة، وسأعترف باسمه أمام أبي وملائكته."]]}, {"l": "Rev 3:6", "n": "", "vs": [[6, "من له أذن فليسمع ما يقوله الروح للكنائس!"]]}, {"l": "Rev 3:12", "n": "", "vs": [[12, "كل من ينتصر سأجعله عمودا في هيكل إلهي، فلا يخرج منه أبدا، وسأكتب عليه اسم إلهي واسم مدينة إلهي أورشليم الجديدة، التي تنزل من السماء من عند إلهي، وأكتب عليه اسمي الجديد."]]}, {"l": "Rev 3:13", "n": "", "vs": [[13, "من له أذن فليسمع ما يقوله الروح للكنائس!"]]}, {"l": "Rev 3:21", "n": "", "vs": [[21, "وكل من ينتصر سأجلسه معي على عرشي، كما انتصرت أنا أيضا فجلست مع أبي على عرشه؛"]]}, {"l": "Rev 3:22", "n": "", "vs": [[22, "من له أذن فليسمع ما يقوله الروح للكنائس!»"]]}], "kwAr": "إن كنا لا نتراخى", "noteAr": ""}], "arS": [["لأننا، متى حان ", []], ["الأوان", ["G2540"]], ["، ", []], ["سنحصد", ["G2325"]], ["، إن كنا لا ", []], ["نتراخى", ["G1590"]], [".", []]]}, {"c": 6, "v": 10, "text": "فمادامت لنا الفرصة إذن، فلنعمل الخير للجميع، وخصوصا لأهل الإيمان.", "groups": [{"kw": "opportunity", "raw": "Ecc_9:10; Joh_9:4, Joh_12:35; Eph_5:16; Phi_4:10; Col_4:5 *Gr: Tit_2:14", "note": "", "refs": [{"l": "Ecc 9:10", "n": "", "vs": [[10, "وكل ما تحصل عليه من عمل، فاعمله بكل قوتك، إذ لن تجد في الهاوية التي أنت ماض إليها أي عمل أو ابتكار أو معرفة أو حكمة."]]}, {"l": "Joh 9:4", "n": "", "vs": [[4, "فعلي أن أعمل أعمال الذي أرسلني مادام الوقت نهارا. فسيأتي الليل، ولا أحد يقدر أن يعمل فيه."]]}, {"l": "Joh 12:35", "n": "", "vs": [[35, "فقال لهم يسوع: «النور باق معكم وقتا قصيرا. فواصلوا سيركم مادام النور يشرق عليكم، لئلا يطبق عليكم الظلام، فإن الذي يمشي في الظلام لا يعلم أين يذهب."]]}, {"l": "Eph 5:16", "n": "", "vs": [[16, "مستغلين الوقت أحسن استغلال، لأن الأيام شريرة."]]}, {"l": "Phi 4:10", "n": "", "vs": [[10, "ثم إني فرحت في الرب فرحا عظيما إذ إنكم الآن قد جددتم مرة أخرى اهتمامكم بي. فمع أنه كان لكم مثل هذا الاهتمام، فإن الفرصة لم تتيسر لكم من قبل."]]}, {"l": "Col 4:5", "n": "*Gr:", "vs": [[5, "تصرفوا بحكمة مع الذين هم من خارج الكنيسة، مستغلين الوقت أحسن استغلال."]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}], "kwAr": "فمادامت لنا الفرصة", "noteAr": ""}, {"kw": "do good", "raw": "Psa_37:3, Psa_37:27; Ecc_3:12; Mat_5:43; Mar_3:4; Luk_6:35; 1Th_5:15; 1Ti_6:17, 1Ti_6:18; Tit_3:8; Heb_13:16; 3Jo_1:11", "note": "", "refs": [{"l": "Psa 37:3", "n": "", "vs": [[3, "توكل على الرب واصنع الخير. اسكن في الأرض (مطمئنا) وراع الأمانة."]]}, {"l": "Psa 37:27", "n": "", "vs": [[27, "حد عن الشر واصنع الخير، فتسكن مطمئنا إلى الأبد."]]}, {"l": "Ecc 3:12", "n": "", "vs": [[12, "فأيقنت أنه ليس أفضل لهم من أن يفرحوا ويمتعوا أنفسهم وهم مازالوا على قيد الحياة."]]}, {"l": "Mat 5:43", "n": "", "vs": [[43, "وسمعتم أنه قيل: تحب قريبك وتبغض عدوك."]]}, {"l": "Mar 3:4", "n": "", "vs": [[4, "ثم سألهم: «هل يحل في السبت فعل الخير أم فعل الشر؟ تخليص نفس أو قتلها؟» فظلوا صامتين."]]}, {"l": "Luk 6:35", "n": "", "vs": [[35, "ولكن، أحبوا أعداءكم، وأحسنوا المعاملة، وأقرضوا دون أن تأملوا استيفاء القرض، فتكون مكافأتكم عظيمة، وتكونوا أبناء العلي، لأنه ينعم على ناكري الجميل والأشرار."]]}, {"l": "1Th 5:15", "n": "", "vs": [[15, "حذار أن يبادل أحدكم شر غيره بشر مثله بل اسعوا دائما إلى الخير في معاملتكم بعضكم لبعض وللآخرين جميعا."]]}, {"l": "1Ti 6:17", "n": "", "vs": [[17, "أوص أغنياء هذا الزمان بأن لا يتكبروا، ولا يتكلوا على الغنى غير الثابت، بل على الله الذي يمنحنا كل شيء بوفرة لنتمتع به،"]]}, {"l": "1Ti 6:18", "n": "", "vs": [[18, "وأن يفعلوا خيرا، ويكونوا أغنياء بالأعمال الصالحة، ويوزعوا بسخاء، ويكونوا على استعداد دائم لإشراك الآخرين في خيراتهم."]]}, {"l": "Tit 3:8", "n": "", "vs": [[8, "صادق هذا القول! وأريد أن تقرر هذه الأمور قرارا حاسما، حتى يهتم الذين آمنوا بالله بأن يجتهدوا في الأعمال الصالحة. هذه الأمور حسنة ونافعة للناس."]]}, {"l": "Heb 13:16", "n": "", "vs": [[16, "ولا تغفلوا أيضا عن عمل الخير وإعانة المحتاجين: لأن مثل هذه «الذبائح» تسر الله جدا!"]]}, {"l": "3Jo 1:11", "n": "", "vs": [[11, "أيها الحبيب، لا تقتد بما هو شر، بل بما هو خير. فإن من يفعل الخير، يكون من الله. ومن يفعل الشر، يبين أنه لم يتعرف بالله قط."]]}], "kwAr": "فلنعمل الخير للجميع", "noteAr": ""}, {"kw": "especially", "raw": "Mat_10:25, Mat_12:50, Mat_25:40; Eph_2:19, Eph_3:15; Heb_3:6, Heb_6:10; 1Jo_3:13-19; 1Jo_5:1; 3Jo_1:5-8", "note": "", "refs": [{"l": "Mat 10:25", "n": "", "vs": [[25, "يكفي التلميذ أن يصير مثل معلمه، والعبد مثل سيده! إن كانوا قد لقبوا رب البيت ببعلزبول، فكم بالأحرى يلقبون أهل بيته؟"]]}, {"l": "Mat 12:50", "n": "", "vs": [[50, "لأن كل من يعمل بإرادة أبي الذي في السماوات هو أخي وأختي وأمي ! »"]]}, {"l": "Mat 25:40", "n": "", "vs": [[40, "فيجيبهم الملك: الحق أقول لكم: بما أنكم فعلتم ذلك بأحد إخوتي هؤلاء الصغار، فبي فعلتم!"]]}, {"l": "Eph 2:19", "n": "", "vs": [[19, "إذن، لستم غرباء وأجانب بعد الآن، بل أنتم رعية مع القديسين وأعضاء في عائلة الله،"]]}, {"l": "Eph 3:15", "n": "", "vs": [[15, "الذي هو أصل كل أبوة في السماوات وعلى الأرض،"]]}, {"l": "Heb 3:6", "n": "", "vs": [[6, "أما المسيح، فهو أمين بصفته ابنا يترَأس على البيت. وهذا البيت هو نحن المؤمنين، على أن نتمسك بالثقة والافتخار برجائنا تمسكا ثابتا حتى النهاية."]]}, {"l": "Heb 6:10", "n": "", "vs": [[10, "وليس الله بظالم حتى ينسى عملكم الجاد في إظهار محبتكم له عن طريق خدمتكم للقديسين إكراما لاسمه، الأمر الذي قمتم به قبلا، وتقومون به الآن!"]]}, {"l": "1Jo 3:13-19", "n": "", "vs": [[13, "إذن، ياإخوتي، لا تتعجبوا إن كان أهل العالم يبغضونكم!"], [14, "إن محبتنا لإخوتنا تبين لنا أننا انتقلنا من الموت إلى الحياة. فالذي لا يحب إخوته، فهو باق في الموت."], [15, "وكل من يبغض أخا له، فهو قاتل. وأنتم تعرفون أن القاتل لا تكون له حياة أبدية ثابتة فيه."], [16, "ومقياس المحبة هو العمل الذي قام به المسيح إذ بذل حياته لأجلنا. فعلينا نحن أيضا أن نبذل حياتنا لأجل إخوتنا."], [17, "وأما الذي يملك مالا يمكنه من العيش في بحبوحة، ويقسي قلبه على أحد الإخوة المحتاجين، فكيف تكون محبة الله متأصلة فيه؟"], [18, "أيها الأولاد الصغار، لا يجب أن تكون محبتنا مجرد ادعاء بالكلام واللسان، بل تكون محبة عملية حقة."], [19, "عندئذ نتأكد أننا نتصرف بحسب الحق، وتطمئن نفوسنا في حضرة الله،"]]}, {"l": "1Jo 5:1", "n": "", "vs": [[1, "كل من يؤمن حقا أن يسوع هو المسيح، فهو مولود من الله. ومن يحب الوالد، فلابد أن يحب المولودين منه أيضا."]]}, {"l": "3Jo 1:5-8", "n": "", "vs": [[5, "أيها الحبيب، إن معاملتك الحسنة للإخوة وللغرباء تدل على أنك تتصرف بأمانة نحو الله."], [6, "وقد شهد هؤلاء الإخوة، أمام الكنيسة، شهادة جميلة لمحبتك. فإنك تفعل حسنا إذا زودتهم بما يحتاجون إليه في السفر. فأنت تعرف أن هذا يرضي الله ،"], [7, "لأن هؤلاء الإخوة قد انطلقوا في سبيل خدمة المسيح، وهم لا يتلقون أي عون من غير المؤمنين."], [8, "فعلينا نحن أن نرحب بأمثال هؤلاء لكي نكون حقا شركاء لهم في خدمة الحق."]]}], "kwAr": "وخصوصا لأهل الإيمان", "noteAr": ""}], "arS": [["فمادامت لنا ", []], ["الفرصة", ["G2540"]], [" إذن، ", []], ["فلنعمل", ["G2038"]], [" ", []], ["الخير", ["G18"]], [" ", []], ["للجميع", ["G3956"]], ["، ", []], ["وخصوصا", ["G3122"]], [" ", []], ["لأهل", ["G3609"]], [" ", []], ["الإيمان", ["G4102"]], [".", []]]}, {"c": 6, "v": 11, "text": "انظروا بأية حروف كبيرة قد كتبت إليكم هنا بيدي:", "groups": [{"kw": "written", "raw": "Rom_16:22; 1Co_16:21-23", "note": "", "refs": [{"l": "Rom 16:22", "n": "", "vs": [[22, "وأنا، ترتيوس الذي أخط هذه الرسالة، أسلم عليكم في الرب."]]}, {"l": "1Co 16:21-23", "n": "", "vs": [[21, "وإليكم سلامي، أنا بولس، بخط يدي."], [22, "إن كان أحد لا يحب الرب فليكن «أناثيما» (أي ملعونا)!"], [23, "لتكن معكم نعمة الرب يسوع المسيح!"]]}], "kwAr": "قد كتبت إليكم هنا بيدي", "noteAr": ""}], "arS": [["انظروا", ["G1492"]], [" بأية ", []], ["حروف", ["G1121"]], [" ", []], ["كبيرة", ["G4080"]], [" قد ", []], ["كتبت", ["G1125"]], [" إليكم هنا ", []], ["بيدي", ["G5495", "G1699"]], [":", []]]}, {"c": 6, "v": 12, "text": "إن الذين يريدون أن يظهروا في الجسد بمظهر حسن، أولئك يرغمونكم أن تختنوا، فقط لئلا يلقوا الاضطهاد بسبب صليب المسيح.", "groups": [{"kw": "as desire", "raw": "Gal_6:13; Mat_6:2, Mat_6:5, Mat_6:16, Mat_23:5, Mat_23:28; Luk_16:15, Luk_20:47; Joh_7:18; 2Co_10:12; 2Co_11:13; Phi_1:15, Phi_2:4; Col_2:23", "note": "", "refs": [{"l": "Gal 6:13", "n": "", "vs": [[13, "فحتى أولئك الذين يختنون، هم أنفسهم، لا يعملون بالشريعة، بل يريدون لكم أن تختنوا ليفتخروا بجسدكم."]]}, {"l": "Mat 6:2", "n": "", "vs": [[2, "فإذا تصدقت على أحد، فلا تنفخ أمامك في البوق، كما يفعل المراؤون في المجامع والشوارع، ليمدحهم الناس. الحق أقول لكم: إنهم قد نالوا مكافأتهم."]]}, {"l": "Mat 6:5", "n": "", "vs": [[5, "وعندما تصلون، لا تكونوا مثل المرائين الذين يحبون أن يصلوا واقفين في المجامع وفي زوايا الشوارع ليراهم الناس. الحق أقول لكم: إنهم قد نالوا مكافأتهم."]]}, {"l": "Mat 6:16", "n": "", "vs": [[16, "وعندما تصومون، لا تكونوا عابسي الوجوه، كما يفعل المراؤون الذين يقطبون وجوههم لكي يظهروا للناس صائمين. الحق أقول لكم إنهم قد نالوا مكافأتهم."]]}, {"l": "Mat 23:5", "n": "", "vs": [[5, "وكل ما يعملونه، فإنما يعملونه لكي يلفتوا نظر الناس إليهم. فهم يعرضون عصائبهم ويطيلون أطراف أثوابهم؛"]]}, {"l": "Mat 23:28", "n": "", "vs": [[28, "كذلك أنتم أيضا، تبدون للناس أبرارا، ولكنكم من الداخل ممتلئون بالرياء والفسق!"]]}, {"l": "Luk 16:15", "n": "", "vs": [[15, "فقال لهم: «إنكم تبررون أنفسكم أمام الناس، ولكن ه يدرك ويعرفني أني أنا الرب الذي يمارس الرحمة والعدل والبر في الأرض لأني أسر بها»."]]}, {"l": "Eze 28:2", "n": "", "vs": [[2, "«ياابن آدم، قل لملك صور، هذا ما يعلنه السيد الرب: لأنك تكبرت وقلت: «أنا إله، وأتربع في مجلس الآلهة، في قلب البحار»؛ مع أنك إنسان ولست إلها، وإن ظننت أن لديك حكمة الآلهة!"]]}, {"l": "Dan 4:30", "n": "", "vs": [[30, "قال: «أليست هذه هي بابل العظيمة التي بنيتها بقوة اقتداري لتكون عاصمة للمملكة، ولجلال مجدي؟»"]]}, {"l": "Dan 4:31", "n": "", "vs": [[31, "وفيما كانت كلماته بعد تتردد على شفتيه تجاوب صوت من السماء قائلا: «يانبوخذناصر الملك، لك يقولون الآن قد زال عنك الملك."]]}, {"l": "Dan 5:20", "n": "", "vs": [[20, "وعندما شمخ قلبه وقست روحه تعنتا، عزل عن عرش ملكه وجرد من جلاله،"]]}, {"l": "Dan 5:21", "n": "", "vs": [[21, "وطرد من بين الناس، وماثل عقله الحيوانات، وصار مأواه مع الحمير الوحشية، فأطعموه العشب كالثيران، وابتل جسمه بندى السماء، حتى علم أن الله العلي هو المتسلط في مملكة الناس، وأنه يولي عليها من يشاء."]]}, {"l": "1Co 1:29-31", "n": "", "vs": [[29, "حتى لا يفتخر أي بشر أمام الله."], [30, "وبفضل الله صار لكم مقام في المسيح يسوع الذي جعل لنا حكمة من الله وبرا وقداسة وفداء،"], [31, "حتى إن «من افتخر، فليفتخر بالرب»، على حد ما قد كتب."]]}, {"l": "1Co 3:21", "n": "", "vs": [[21, "إذن، لا يفتخر أحد بالبشر، لأن كل شيء هو لكم،"]]}, {"l": "2Co 11:12", "n": "", "vs": [[12, "ولكن، سأفعل ما أنا فاعله الآن لأسقط حجة الذين يلتمسون حجة تبين أنهم مثلنا في ما يفتخرون به."]]}, {"l": "2Co 12:10", "n": "", "vs": [[10, "فلأجل المسيح، تسرني الضعفات والإهانات والضيقات والاضطهادات والصعوبات، لأني حينما أكون ضعيفا، فحينئذ أكون قويا!"]]}, {"l": "2Co 12:11", "n": "", "vs": [[11, "ها قد صرت غبيا! ولكن، أنتم أجبرتموني! فقد كان يجب أن تمدحوني أنتم، لأني لست متخلفا في شيء عن أولئك الرسل المتفوقين، وإن كنت لا شيئا."]]}], "kwAr": "أن أفتخر", "noteAr": ""}, {"kw": "save", "raw": "Isa_45:24, Isa_45:25; Rom_1:16; 1Co_1:23, 1Co_2:2; Phi_3:3 *Gr: Phi_3:7-11", "note": "", "refs": [{"l": "Isa 45:24", "n": "", "vs": [[24, "ويقولون عني: إنما بالرب وحده البر والقوة، وكل من يغتاظ م
