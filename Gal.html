[{"l": "Rut 1:11-13", "n": "", "vs": [[11, "فأجابت نعمي: «ارجعا يابنتي. لماذا تأتيان معي؟ هل أنا قادرة بعد على إنجاب بنين حتى يكبروا فيكونوا لكما أزواجا؟"], [12, "عودا يابنتي، واذهبا، فأنا قد شخت، ولم أعد صالحة لأكون زوجة رجل. وحتى لو أملت أن أتزوج الليلة وأنجب بنين أيضا،"], [13, "فهل تنتظران حتى يكبروا؟ وهل تمتنعان عن الزواج من أجلهم؟ لا يابنتي، فإنني حزينة جدا من أجلكما لأن يد الرب قد عاقبتني فأصابكما الضرر أيضا»."]]}, {"l": "Rut 4:14-16", "n": "", "vs": [[14, "فقالت النساء لنعمي: «ليكن الرب مباركا الذي لم يحرمك اليوم وليا، وليذع اسمه في إسرائيل،"], [15, "لأن كنتك التي أحبتك هي أكثر خيرا لك من سبعة أبناء، وقد ولدته ليكون سببا في إحياء نفسك ورعايتك في شيخوختك»."], [16, "فأخذت نعمي الولد في حضنها، وقامت على تربيته."]]}, {"l": "2Sa 13:20", "n": "", "vs": [[20, "وعندما رآها أخوها أبشالوم سألها: «هل اغتصبك أمنون؟ اسكتي الآن ياأختي، فإنه أخوك ولا تحملي وزر هذا الأمر في قلبك». فأقامت ثامار في بيت أخيها أبشالوم في عزلة وحزن."]]}, {"l": "Isa 49:21", "n": "", "vs": [[21, "فتسألين نفسك: من أنجب لي هؤلاء وأنا ثكلى وعاقر، منفية ومنبوذة؟ من ربى لي هؤلاء؟ فقد تركت وحدي، أما هؤلاء فمن أين جاءوا؟"]]}, {"l": "1Ti 5:5", "n": "", "vs": [[5, "ولكن الأرملة التي تعيش وحيدة ولا معيل لها، فقد وضعت رجاءها في الله وهي تداوم على الأدعية والصلوات ليلا ونهارا."]]}], "kwAr": "أولاد المهجورة", "noteAr": ""}], "arS": [["فإنه قد ", []], ["كتب", ["G1125"]], [": «", []], ["افرحي", ["G2165"]], [" أيتها ", []], ["العاقر", ["G4723"]], [" التي لا ", []], ["تلد", ["G5088"]], ["، ", []], ["اهتفي", ["G4486"]], [" بأعلى ", []], ["صوتك", ["G994"]], [" أيتها التي لا ", []], ["تتمخض", ["G5605"]], ["، لأن ", []], ["أولاد", ["G5043"]], [" ", []], ["المهجورة", ["G2048"]], [" ", []], ["أكثر", ["G3123"]], [" عددا من أولاد التي لها ", []], ["زوج", ["G435"]], ["!»", []]]}, {"c": 4, "v": 28, "text": "وأما أنتم، أيها الإخوة، فأولاد الوعد، على مثال إسحاق.", "groups": [{"kw": "", "raw": "Gal_4:23, Gal_3:29; Act_3:25; Rom_4:13-18, Rom_9:8, Rom_9:9", "note": "", "refs": [{"l": "Gal 4:23", "n": "", "vs": [[23, "أما ابن الجا "vs": [[7, "فما الخلاصة إذا؟ إن ما يسعى إليه إسرائيل لم ينالوه، بل ناله المختارون منهم، والباقون عميت بصائرهم،"], [8, "وفقا لما قد كتب: «ألقى الله عليهم روح خمول وأعطاهم عيونا لا يبصرون بها، وآذانا لا يسمعون بها، حتى هذا اليوم»."], [9, "كذلك يقول داود: «لتصر لهم مائدتهم فخا وشركا وعقبة وعقابا."], [10, "لتظلم عيونهم كي لا يبصروا، ولتكن ظهورهم منحنية دائما!»"], [11, "فأقول إذا: هل تعثروا لكي يسقطوا أبدا؟ حاشا! بل بسقطتهم توفر الخلاص للأمم، لعل ذلك يثير غيرتهم."]]}], "kwAr": "اطرد الجارية وابنها", "noteAr": ""}, {"kw": "for", "raw": "Joh_8:35; Rom_8:15-17", "note": "", "refs": [{"l": "Joh 8:35", "n": "", "vs": [[35, "والعبد لا يبقى في بيت سيده دائما؛ أما الابن فيعيش فيه أبدا."]]}, {"l": "Rom 8:15-17", "n": "", "vs": [[15, "إذ إنكم لم تنالوا روح عبودية يعيدكم إلى الخوف، بل نلتم روح بنوة به نصرخ: «أبا! أبانا!»"], [16, "فالروح نفسه يشهد مع أرواحنا بأننا أولاد الله."], [17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}], "kwAr": "لأن ابن الجارية لا يرث", "noteAr": ""}], "arS": [["إنما ", []], ["ماذا", ["G5101"]], [" ", []], ["يقول", ["G3004"]], [" ", []], ["الكتاب", ["G1124"]], ["؟ «", []], ["اطرد", ["G1544"]], [" ", []], ["الجارية", ["G3814"]], [" ", []], ["وابنها", ["G5207"]], ["، لأن ", []], ["ابن", ["G5207"]], [" ", []], ["الجارية", ["G3814"]], [" لا ", []], ["يرث", ["G2816"]], [" مع ", []], ["ابن", ["G5207"]], [" ", []], ["الحرة", ["G1658"]], ["!»", []]]}, {"c": 4, "v": 31, "text": "إذن، أيها الإخوة، نحن لسنا أولاد الجارية، بل أولاد الحرة.", "groups": [{"kw": "we", "raw": "Gal_5:1, Gal_5:13; Joh_1:12, Joh_1:13, Joh_8:36; Heb_2:14, Heb_2:15; 1Jo_3:1, 1Jo_3:2", "note": "", "refs": [{"l": "Gal 5:1", "n": "", "vs": [[1, "إن المسيح قد حررنا وأطلقنا في سبيل الحرية. فاثبتوا إذن، ولا تعودوا إلى الارتباك بنير العبودية."]]}, {"l": "Gal 5:13", "n": "", "vs": [[13, "فإنما إلى الحرية قد دعيتم، أيها الإخوة؛ ولكن لا تتخذوا من الحرية ذريعة لإرضاء الجسد، بل بالمحبة كونوا عبيدا في خدمة أحدكم الآخر."]]}, {"l": "Joh 1:12", "n": "", "vs": [[12, "أما الذين قبلوه، أي الذين آمنوا باسمه، فقد منحهم الحق في أن يصيروا أولاد الله،"]]}, {"l": "Joh 1:13", "n": "", "vs": [[13, "وهم الذين ولدوا ليس من دم، ولا من رغبة جسد، ولا من رغبة بشر، بل من الله."]]}, {"l": "Joh 8:36", "n": "", "vs": [[36, "فإن حرركم الابن تصيرون بالحق أحرارا."]]}, {"l": "Heb 2:14", "n": "", "vs": [[14, "إذن، بما أن هؤلاء الأولاد متشاركون في أجسام بشرية من لحم ودم، اشترك المسيح أيضا في اللحم والدم باتخاذه جسما بشريا. وهكذا تمكن أن يموت، ليقضي على من له سلطة الموت، أي إبليس،"]]}, {"l": "Heb 2:15", "n": "", "vs": [[15, "ويحرر من كان الخوف من الموت يستعبدهم طوال حياتهم."]]}, {"l": "1Jo 3:1", "n": "", "vs": [[1, "تأملوا ما أعظم المحبة التي أحبنا بها الآب حتى صرنا ندعى «أولاد الله»، ونحن أولاده حقا. ولكن، بما أن أهل العالم لا يعرفون الله، فهم لا يعرفوننا."]]}, {"l": "1Jo 3:2", "n": "", "vs": [[2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"]]}], "kwAr": "نحن لسنا أولاد الجارية", "noteAr": ""}], "arS": [["إذن، أيها ", []], ["الإخوة", ["G80"]], ["، نحن لسنا ", []], ["أولاد", ["G5043"]], [" ", []], ["الجارية", ["G3814"]], ["، بل أولاد ", []], ["الحرة", ["G1658"]], [".", []]]}, {"c": 5, "v": 1, "text": "إن المسيح قد حررنا وأطلقنا في سبيل الحرية. فاثبتوا إذن، ولا تعودوا إلى الارتباك بنير العبودية.", "groups": [{"kw": "Stand", "raw": "Pro_23:23; 1Co_15:58, 1Co_16:13; Eph_6:14; Phi_1:27; 1Th_3:8; 2Th_2:15; Heb_3:6, Heb_3:14, Heb_4:14, Heb_10:23, Heb_10:35-39; Jud_1:3, Jud_1:20,Jud_1:21; Rev_2:25, Rev_3:3", "note": "", "refs": [{"l": "Pro 23:23", "n": "", "vs": [[23, "اقتن الحق ولا تبعه، وكذا الحكمة والتأديب والفطنة."]]}, {"l": "1Co 15:58", "n": "", "vs": [[58, "إذن، ياإخوتي الأحباء، كونوا راسخين غير متزحزحين، كثيري الاجتهاد في عمل الرب دائما، عالمين أن جهدكم في الرب ليس عبثا!"]]}, {"l": "1Co 16:13", "n": "", "vs": [[13, "كونوا متيقظين حذرين. اثبتوا في الإيمان. كونوا رجالا. كونوا أقوياء."]]}, {"l": "Eph 6:14", "n": "", "vs": [[14, "فاصمدوا إذن بعد أن تتخذوا الحق حزاما لأوساطكم، والبر درعا لصدوركم،"]]}, {"l": "Phi 1:27", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"]]}, {"l": "1Th 3:8", "n": "", "vs": [[8, "فقد طابت لنا الحياة مادمتم ثابتين في الرب!"]]}, {"l": "2Th 2:15", "n": "", "vs": [[15, "فاثبتوا إذن، أيها الإخوة، وتمسكوا بالتعاليم التي تلقيتم منا، سواء كان بالكلام أم برسالتنا."]]}, {"l": "Heb 3:6", "n": "", "vs": [[6, "أما المسيح، فهو أمين بصفته ابنا يترَأس على البيت. وهذا البيت هو نحن المؤمنين، على أن نتمسك بالثقة والافتخار برجائنا تمسكا ثابتا حتى النهاية."]]}, {"l": "Heb 3:14", "n": "", "vs": [[14, "فإن تمسكنا دائما بالثقة التي انطلقنا بها في البداية، وأبقيناها ثابتة إلى النهاية، نكون مشاركين للمسيح."]]}, {"l": "Heb 4:14", "n": "", "vs": [[14, "فمادام لنا رئيس كهنتنا العظيم الذي ارتفع مجتازا السماوات، وهو يسوع ابن الله، فلنتمسك دائما بالاعتراف به."]]}, {"l": "Heb 10:23", "n": "", "vs": [[23, "ولنتمسك دائما بالرجاء الذي نعترف به، دون أن نشك في أنه سيتحقق، لأن الذي وعدنا بتحقيقه، هو أمين وصادق."]]}, {"l": "Heb 10:35-39", "n": "", "vs": [[35, "إذن، لا تتخلوا عن ثقتكم بالرب. فإن لها مكافأة عظيمة."], [36, "إنكم تحتاجون إلى الصبر لتعملوا إرادة الله، فتنالوا البركة التي وعدتم بها."], [37, "فقريبا جدا، سيأتي الآتي ولا يتمهل."], [38, "وأما من تبرر بالإيمان، فبالإيمان يحيا. ومن ارتد لا تسر به نفسي!"], [39, "ولكننا نحن لسنا من أهل الارتداد المؤدي إلى الهلاك، بل من أهل الإيمان المؤدي إلى خلاص نفوسنا!"]]}, {"l": "Jud 1:3", "n": "", "vs": [[3, "أيها الأحباء، كنت قد نويت أن أكتب إليكم في موضوع الخلاص الذي نشترك فيه جميعا. ولكن، أراني الآن مضطرا لأن أكتب لأشجعكم على الجهاد في سبيل الإيمان الذي سلم مرة واحدة للقديسين."]]}, {"l": "Jud 1:20", "n": "", "vs": [[20, "وأما أنتم أيها الأحباء، فابنوا أنفسكم على إيمانكم الأقدس، وصلوا دائما في الروح القدس."]]}, {"l": "Jud 1:21", "n": "", "vs": [[21, "واحفظوا أنفسكم في محبة الله، منتظرين رحمة ربنا يسوع المسيح إذ يعود ويأخذكم لتحيوا معه إلى الأبد."]]}, {"l": "Rev 2:25", "n": "", "vs": [[25, "فقط تمسكوا بما لديكم إلى أن أجيء."]]}, {"l": "Rev 3:3", "n": "", "vs": [[3, "تذكر ما سبق أن تقبلته وسمعته، وتمسك بما آمنت به، وتب! فإن كنت لا تتنبه، آتيك كما يأتي اللص، ولا تدري في أية ساعة أفاجئك!"]]}], "kwAr": "فاثبتوا إذن", "noteAr": ""}, {"kw": "the liberty", "raw": "Gal_5:13, Gal_2:4, Gal_3:25, Gal_4:26, Gal_4:31; Psa_51:12; Isa_61:1; Mat_11:28-30; Joh_8:32-36; Rom_6:14, Rom_6:18, Rom_7:3, Rom_7:6, Rom_8:2; 1Co_7:22; 2Co_3:17; 1Pe_2:16; 2Pe_2:19", "note": "", "refs": [{"l": "Gal 5:13", "n": "", "vs": [[13, "فإنما إلى الحرية قد دعيتم، أيها الإخوة؛ ولكن لا تتخذوا من الحرية ذريعة لإرضاء الجسد، بل بالمحبة كونوا عبيدا في خدمة أحدكم الآخر."]]}, {"l": "Gal 2:4", "n": "", "vs": [[4, "إنما أثير الأمر بسبب الإخوة الدجالين الذين أدخلوا بيننا خلسة، فاندسوا ليتجسسوا حريتنا التي لنا في المسيح يسوع، لعلهم يعيدوننا إلى العبودية؛"]]}, {"l": "Gal 3:25", "n": "", "vs": [[25, "ولكن بعدما جاء الإيمان، تحررنا من سلطة المؤدب."]]}, {"l": "Gal 4:26", "n": "", "vs": [[26, "أما الثاني، فرمزه الحرة التي تمثل أورشليم السماوية التي هي أمنا."]]}, {"l": "Gal 4:31", "n": "", "vs": [[31, "إذن، أيها الإخوة، نحن لسنا أولاد الجارية، بل أولاد الحرة."]]}, {"l": "Psa 51:12", "n": "", "vs": [[12, "رد لي بهجتي بخلاصك، وبروح رضية آزرني"]]}, {"l": "Isa 61:1", "n": "", "vs": [[1, "روح السيد الرب علي، لأن الرب مسحني لأبشر المساكين، أرسلني لأضمد جراح المنكسري القلوب، لأنادي للمسبيين بالعتق وللمأسورين بالحرية،"]]}, {"l": "Mat 11:28-30", "n": "", "vs": [[28, "تعالوا إلي ياجميع المتعبين والرازحين تحت الأحمال الثقيلة، وأنا أريحكم."], [29, "احملوا نيري عليكم، وتتلمذوا على يدي، لأني وديع ومتواضع القلب، فتجدوا الراحة لنفوسكم."], [30, "فإن نيري هين، وحملي خفيف!»"]]}, {"l": "Joh 8:32-36", "n": "", "vs": [[32, "وتعرفون الحق، والحق يحرركم»."], [33, "فرد اليهود: «نحن أحفاد إبراهيم، ولم نكن قط عبيدا لأحد! كيف تقول لنا: إنكم ستصيرون أحرارا؟»"], [34, "أجابهم يسوع: «الحق الحق أقول لكم: إن من يرتكب الخطيئة يكون عبدا لها."], [35, "والعبد لا يبقى في بيت سيده دائما؛ أما الابن فيعيش فيه أبدا."], [36, "فإن حرركم الابن تصيرون بالحق أحرارا."]]}, {"l": "Rom 6:14", "n": "", "vs": [[14, "فلن يكون للخطيئة سيادة عليكم، إذ لستم خاضعين للشريعة بل للنعمة."]]}, {"l": "Rom 6:18", "n": "", "vs": [[18, "والآن، إذ حررتم من الخطيئة، صرتم عبيدا للبر."]]}, {"l": "Rom 7:3", "n": "", "vs": [[3, "ولذلك، فمادام الزوج حيا، تعتبر زانية إن صارت إلى رجل آخر. ولكن إن مات الزوج تتحرر من الشريعة، حتى إنها لا تكون زانية إن صارت إلى رجل آخر."]]}, {"l": "Rom 7:6", "n": "", "vs": [[6, "أما الآن، فنحن قد تحررنا من الشريعة، إذ متنا بالنِّسبة لما كان يقيدنا، حتى نكون عبيدا يخدمون وفقا للنظام الروحي الجديد، لا للنظام الحرفي العتيق."]]}, {"l": "Rom 8:2", "n": "", "vs": [[2, "لأن ناموس روح الحياة في المسيح يسوع قد حررني من ناموس الخطيئة ومن الموت."]]}, {"l": "1Co 7:22", "n": "", "vs": [[22, "فإن من دعي في الرب وهو عبد، صار معتقا للرب. وكذلك أيضا من دعي وهو حر، صار عبدا للمسيح."]]}, {"l": "2Co 3:17", "n": "", "vs": [[17, "فإن الرب هو الروح، وحيث يكون روح الرب، فهناك الحرية."]]}, {"l": "1Pe 2:16", "n": "", "vs": [[16, "تصرفوا كأحرار حقا، لا كالذين يتخذون من الحرية ستارا لارتكاب الشر بل باعتبار أنكم عبيد لله."]]}, {"l": "2Pe 2:19", "n": "", "vs": [[19, "يعدون هؤلاء بالحرية، وهم أنفسهم عبيد للفساد! لأن الإنسان يصير عبدا لكل ما يتسلط عليه ويغلبه."]]}], "kwAr": "في سبيل الحرية", "noteAr": ""}, {"kw": "entangled", "raw": "Gal_2:4, Gal_4:9; Mat_23:4; Act_15:10; Col_2:16-22; Heb_9:8-11", "note": "", "refs": [{"l": "Gal 2:4", "n": "", "vs": [[4, "إنما أثير الأمر بسبب الإخوة الدجالين الذين أدخلوا بيننا خلسة، فاندسوا ليتجسسوا حريتنا التي لنا في المسيح يسوع، لعلهم يعيدوننا إلى العبودية؛"]]}, {"l": "Gal 4:9", "n": "", "vs": [[9, "أما الآن وقد عرفتم الله ، بل بالأحرى عرفكم الله ، فكيف ترتدون أيضا إلى تلك المباديء العاجزة الفقيرة التي ترغبون في الرجوع إلى العبودية لها من جديد؟"]]}, {"l": "Mat 23:4", "n": "", "vs": [[4, "بل يحزمون أحمالا ثقيلة لا تطاق ويضعونها على أكتاف الناس، ولكنهم هم لا يريدون أن يحركوها بطرف الإصبع."]]}, {"l": "Act 15:10", "n": "", "vs": [[10, "فلماذا تعارضون الله فتحملون تلاميذ الرب عبئا ثقيلا عجز الآباء وعجزنا نحن عن حمله؟"]]}, {"l": "Col 2:16-22", "n": "", "vs": [[16, "فلا يحكم عليكم أحد في قضية الأكل والشرب، أو في القضايا المتعلقة بالأعياد ورؤوس الشهور والسبوت؛"], [17, "فهذه كانت ظلالا لما سيأتي، أي للحقيقة التي هي المسيح."], [18, "لا يحرمكم أحد من جائزتكم، بحملكم على ما يرغب فيه من إظهار التواضع والتعبد للملائكة، داخلا في رؤى يتوهمها، وقد نفخه باطلا ذهنه الجسدي،"], [19, "وهو غير ممسك بالرأس الذي منه يتلقى الجسد كله غذاءه وتماسكه بالمفاصل والأوصال، فينمو النمو الذي يمنحه الله ."], [20, "فمادمتم قد متم مع المسيح بالنسبة لمباديء العالم، فلماذا، كما لو كنتم عائشين في العالم، تخضعون أنفسكم لفرائض مثل هذه:"], [21, "لا تمسك، لا تذق، لا تلمس"], [22, "وهذه أشياء تستهلك وتزول. فتلك الفرائض هي وصايا البشر وتعاليمهم."]]}, {"l": "Heb 9:8-11", "n": "", "vs": [[8, "وبهذا، يشير الروح القدس إلى أن الطريق المؤدية إلى «قدس الأقداس» الحقيقي في السماء، كانت غير مفتوحة بعد. ذلك لأن المسكن الأول مازال قائما."], [9, "وما هذا إلا صورة للوقت الحاضر الذي فيه مازالت التقدمات والذبائح تقرب وفقا لنظام العهد العتيق. ولكنها لا تستطيع أن تطهر قلوب الذين يتقربون بها إلى الله، ولا أن توصلهم إلى الكمال فتريح ضمائرهم."], [10, "إذ إن نظام العهد السابق قد اقتصر على تحريم بعض المأكولات والمشروبات وتحليل غيرها، وعلى وضع النظم المختصة بطقوس الاغتسال المختلفة. بل إن كل ما ضمه ذلك النظام، كان قوانين جسدية ينتهي عملها حين يأتي وقت الإصلاح."], [11, "ذلك أن البركات السماوية قد تحققت في المسيح. فهو الآن كاهننا الأعلى الذي يؤدي مهمته في الخيمة الحقيقية، وهي أعظم وأكمل من الخيمة الأرضية. إنها في السماء. لم تصنعها يد بشرية، وليست من هذا العالم المادي."]]}], "kwAr": "ولا تعودوا إلى الارتباك", "noteAr": ""}], "arS": [["إن ", []], ["المسيح", ["G5547"]], [" قد ", []], ["حررنا", ["G1659"]], [" وأطلقنا في سبيل ", []], ["الحرية", ["G1657"]], [". ", []], ["فاثبتوا", ["G4739"]], [" إذن، ولا تعودوا إلى ", []], ["الارتباك", ["G1758"]], [" ", []], ["بنير", ["G2218"]], [" ", []], ["العبودية", ["G1397"]], [".", []]]}, {"c": 5, "v": 2, "text": "ها أنا بولس أقول لكم: إن ختنتم، لا ينفعكم المسيح شيئا.", "groups": [{"kw": "I Paul", "raw": "1Co_16:21; 2Co_10:1; 1Th_2:18; Phm_1:9", "note": "", "refs": [{"l": "1Co 16:21", "n": "", "vs": [[21, "وإليكم سلامي، أنا بولس، بخط يدي."]]}, {"l": "2Co 10:1", "n": "", "vs": [[1, "ولكني أتوسل إليكم بوداعة المسيح وحلمه، أنا بولس «المتواضع وأنا حاضر بينكم، والجريء عليكم وأنا غائب عنكم»،"]]}, {"l": "1Th 2:18", "n": "", "vs": [[18, "ولهذا عزمنا أن نأتي إليكم على الأخص أنا بولس مرة بعد مرة، فعاقنا الشيطان."]]}, {"l": "Phm 1:9", "n": "", "vs": [[9, "إلا أني، إكراما للمحبة، اخترت أن أقدم إليك التماسا، بصفتي بولس العجوز والسجين حاليا لأجل المسيح يسوع."]]}], "kwAr": "ها أنا بولس أقول لكم", "noteAr": ""}, {"kw": "that", "raw": "Gal_5:4, Gal_5:6, Gal_2:3-5; Act_15:1, Act_15:24, Act_16:3, Act_16:4; Rom_9:31, Rom_9:32, Rom_10:2, Rom_10:3; Heb_4:2", "note": "", "refs": [{"l": "Gal 5:4", "n": "", "vs": [[4, "يامن تريدون التبرير عن طريق الشريعة، قد حرمتم المسيح وسقطتم من النعمة!"]]}, {"l": "Gal 5:6", "n": "", "vs": [[6, "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة."]]}, {"l": "Gal 2:3-5", "n": "", "vs": [[3, "ولكن، حتى تيطس الذي كان يرافقني وهو يوناني، لم يضطر أن يختن."], [4, "إنما أثير الأمر بسبب الإخوة الدجالين الذين أدخلوا بيننا خلسة، فاندسوا ليتجسسوا حريتنا التي لنا في المسيح يسوع، لعلهم يعيدوننا إلى العبودية؛"], [5, "فلم نخضع لهم مستسلمين ولو لساعة واحدة، ليبقى حق الإنجيل ثابتا عندكم."]]}, {"l": "Act 15:1", "n": "", "vs": [[1, "وجاء بعض اليهود (الذين كانوا قد آمنوا بالمسيح) من منطقة اليهودية إلى أنطاكية، وأخذوا يعلمون الإخوة قائلين: «لا يمكنكم أن تخلصوا ما لم تختنوا حسب شريعة موسى»"]]}, {"l": "Act 15:24", "n": "", "vs": [[24, "علمنا أن بعض الأشخاص ذهبوا من عندنا إليكم، دون تفويض منا فأثاروا بكلامهم الاضطراب بينكم وأقلقوا أفكاركم."]]}, {"l": "Act 16:3", "n": "", "vs": [[3, "فأحب بولس أن يصحبه في التبشير. ولأن يهود تلك المنطقة كانوا يعرفون أن أباه يوناني، فقد أخذه بولس وختنه."]]}, {"l": "Act 16:4", "n": "", "vs": [[4, "وأخذ بولس ورفاقه ينتقلون من مدينة إلى أخرى، يبلغون المؤمنين التوصيات التي أقرها الرسل والشيوخ في أورشليم، لكي يعملوا بها."]]}, {"l": "Rom 9:31", "n": "", "vs": [[31, "أما إسرائيل، وقد كانوا يسعون وراء شريعة تهدف إلى البر، فقد فشلوا حتى في بلوغ الشريعة."]]}, {"l": "Rom 9:32", "n": "", "vs": [[32, "ولأي سبب؟ لأن سعيهم لم يكن على أساس الإيمان، بل كان وكأن الأمر قائم على الأعمال. فقد تعثروا بحجر العثرة،"]]}, {"l": "Rom 10:2", "n": "", "vs": [[2, "فإني أشهد لهم أن عندهم غيرة لله، ولكنها ليست على أساس المعرفة."]]}, {"l": "Rom 10:3", "n": "", "vs": [[3, "فبما أنهم جهلوا بر الله وسعوا إلى إثبات برهم الذاتي، لم يخضعوا للبر الإلهي."]]}, {"l": "Heb 4:2", "n": "", "vs": [[2, "ذلك أن البشارة بالوعد قد وصلت إلينا، نحن أيضا، كما كانت قد وصلت إلى ذلك الشعب. ولكن البشارة لم تنفع سامعيها شيئا، لأنهم قابلوها بالرفض فلم يؤمنوا بها."]]}], "kwAr": "إن ختنتم", "noteAr": ""}], "arS": [["ها", ["G2396"]], [" ", []], ["أنا", ["G1473"]], [" ", []], ["بولس", ["G3972"]], [" ", []], ["أقول", ["G3004"]], [" لكم: إن ", []], ["ختنتم", ["G4059"]], ["، لا ", []], ["ينفعكم", ["G5623"]], [" ", []], ["المسيح", ["G5547"]], [" ", []], ["شيئا", ["G3762"]], [".", []]]}, {"c": 5, "v": 3, "text": "وأشهد مرة أخرى لكل مختون بأنه ملتزم أن يعمل بالشريعة كلها.", "groups": [{"kw": "testify", "raw": "Deu_8:19, Deu_31:21; Neh_9:29, Neh_9:30,Neh_9:34; Luk_16:28; Act_2:40, Act_20:21; Eph_4:17; 1Th_4:6; 1Jo_4:14", "note": "", "refs": [{"l": "Deu 8:19", "n": "", "vs": [[19, "أما إن نسيتم الرب إلهكم، وغويتم وراء آلهة أخرى وعبدتموها وسجدتم لها، فإنني أشهد عليكم أنكم لا محالة هالكون."]]}, {"l": "Deu 31:21", "n": "", "vs": [[21, "فمتى حلت بهم شرور كثيرة ومصائب جمة، يشهد هذا النشيد عليهم، لأنه سيظل يتردد على أفواه ذريتهم، إذ إنني عالم بخواطرهم التي تدور بخلدهم الآن قبل أن أدخلهم إلى الأرض كما حلفت»."]]}, {"l": "Neh 9:29", "n": "", "vs": [[29, "وأنذرتهم لتردهم إلى شريعتك. غير أنهم طغوا وتمردوا على وصاياك وأخطأوا ضد أحكامك، التي إن مارسها إنسان يحيا بها، واعتصموا بعنادهم وأغلظوا قلوبهم ولم يطيعوا."]]}, {"l": "Neh 9:30", "n": "", "vs": [[30, "لقد تحملتهم سنين كثيرة، وحذرتهم بروحك على لسان أنبيائك فلم يصغوا، فأسلمتهم لعبودية أمم البلاد."]]}, {"l": "Neh 9:34", "n": "", "vs": [[34, "ولم يطع ملوكنا ورؤساؤنا وكهنتنا وآباؤنا شريعتك، ولا استمعوا إلى وصاياك وتحذيراتك التي أنذرتهم بها."]]}, {"l": "Luk 16:28", "n": "", "vs": [[28, "فإن عندي خمسة إخوة، حتى يشهد لهم منذرا، لئلا يأتوا هم أيضا إلى مكان العذاب هذا."]]}, {"l": "Act 2:40", "n": "", "vs": [[40, "ثم شهد بطرس للحاضرين ووعظهم بكلام كثير آخر، قائلا: «اخلصوا من هذا الجيل المنحرف!»"]]}, {"l": "Act 20:21", "n": "", "vs": [[21, "فكنت أحث اليهود واليونانيين على أن يتوبوا إلى الله ويؤمنوا بربنا يسوع."]]}, {"l": "Eph 4:17", "n": "", "vs": [[17, "أقول هذا إذن، وأشهد في الرب، راجيا ألا تسلكوا فيما بعد كما يسلك الأمم في عقم ذهنهم،"]]}, {"l": "1Th 4:6", "n": "", "vs": [[6, "وألا يتعدى حقوق أخيه ويسيء إليه في هذا الأمر، لأن الرب هو المنتقم لجميع هذه الإساءات، كما أنذرناكم قبلا وشهدنا لكم بحق."]]}, {"l": "1Jo 4:14", "n": "", "vs": [[14, "ونحن أنفسنا نشهد أن الآب قد أرسل الابن مخلصا للعالم، لأننا رأيناه بعيوننا."]]}], "kwAr": "وأشهد مرة أخرى", "noteAr": ""}, {"kw": "a debtor", "raw": "Gal_3:10; Deu_27:26; Mat_23:16, Mat_23:18 *Gr: Jam_2:10,Jam_2:11", "note": "", "refs": [{"l": "Gal 3:10", "n": "", "vs": [[10, "أما جميع الذين على مبدأ أعمال الشريعة، فإنهم تحت اللعنة، لأنه قد كتب: «ملعون كل من لا يثبت على العمل بكل ما هو مكتوب في كتاب الشريعة!»"]]}, {"l": "Deu 27:26", "n": "", "vs": [[26, "ملعون كل من لا يطيع كلمات هذه الشريعة ولا يعمل بها. فيقول جميع الشعب: آمين."]]}, {"l": "Mat 23:16", "n": "", "vs": [[16, "الويل لكم أيها القادة العميان! تقولون: من أقسم بالهيكل، فقسمه غير ملزم؛ أما من أقسم بذهب الهيكل، فقسمه ملزم!"]]}, {"l": "Mat 23:18", "n": "*Gr:", "vs": [[18, "وتقولون: من أقسم بالمذبح، فقسمه غير ملزم؛ أما من أقسم بالقربان الذي على المذبح، فقسمه ملزم!"]]}, {"l": "Jam 2:10", "n": "", "vs": [[10, "فأنتم تعرفون أن من يطيع جميع الوصايا الواردة في شريعة موسى، ويخالف واحدة منها فقط، يصير مذنبا، تماما كالذي يخالف الوصايا كلها."]]}, {"l": "Jam 2:11", "n": "", "vs": [[11, "فإن الله ، مثلا، قال: «لا تزن» كما قال: «لا تقتل!» فإن لم تزن، ولكن قتلت، فقد خرقت الشريعة."]]}], "kwAr": "ملتزم أن يعمل بالشريعة كلها", "noteAr": ""}], "arS": [["وأشهد", ["G3143"]], [" مرة ", []], ["أخرى", ["G3825"]], [" ", []], ["لكل", ["G3956"]], [" ", []], ["مختون", ["G4059"]], [" بأنه ", []], ["ملتزم", ["G3781"]], [" أن ", []], ["يعمل", ["G4160"]], [" ", []], ["بالشريعة", ["G3551"]], [" ", []], ["كلها", ["G3650"]], [".", []]]}, {"c": 5, "v": 4, "text": "يامن تريدون التبرير عن طريق الشريعة، قد حرمتم المسيح وسقطتم من النعمة!", "groups": [{"kw": "is", "raw": "Gal_5:2, Gal_2:21; Rom_9:31, Rom_9:32, Rom_10:3-5", "note": "", "refs": [{"l": "Gal 5:2", "n": "", "vs": [[2, "ها أنا بولس أقول لكم: إن ختنتم، لا ينفعكم المسيح شيئا."]]}, {"l": "Gal 2:21", "n": "", "vs": [[21, "إني لا أبطل فاعلية نعمة الله، إذ لو كان البر بالشريعة، لكان موت المسيح عملا لا داعي له."]]}, {"l": "Rom 9:31", "n": "", "vs": [[31, "أما إسرائيل، وقد كانوا يسعون وراء شريعة تهدف إلى البر، فقد فشلوا حتى في بلوغ الشريعة."]]}, {"l": "Rom 9:32", "n": "", "vs": [[32, "ولأي سبب؟ لأن سعيهم لم يكن على أساس الإيمان، بل كان وكأن الأمر قائم على الأعمال. فقد تعثروا بحجر العثرة،"]]}, {"l": "Rom 10:3-5", "n": "", "vs": [[3, "فبما أنهم جهلوا بر الله وسعوا إلى إثبات برهم الذاتي، لم يخضعوا للبر الإلهي."], [4, "فإن غاية الشريعة هي المسيح لتبرير كل من يؤمن."], [5, "فقد كتب موسى عن البر الآتي من الشريعة: «إن الإنسان الذي يعمل بهذه الأمور، يحيا بها»."]]}], "kwAr": "قد حرمتم المسيح", "noteAr": ""}, {"kw": "justified", "raw": "Rom_3:20, Rom_4:4, Rom_4:5", "note": "", "refs": [{"l": "Rom 3:20", "n": "", "vs": [[20, "فإن أحدا من البشر لا يتبرر أمامه بالأعمال المطلوبة في الشريعة. إذ إن الشريعة هي لإظهار الخطيئة."]]}, {"l": "Rom 4:4", "n": "", "vs": [[4, "إن الذي يعمل، لا تحسب له الأجرة من قبيل النعمة بل من قبيل الدين. أما الذي لا يعمل"]]}, {"l": "Rom 4:5", "n": "", "vs": [[5, "وإنما يؤمن بمن يبرر الأثيم، فإن إيمانه يحسب له برا."]]}], "kwAr": "تريدون التبرير", "noteAr": ""}, {"kw": "ye", "raw": "Gal_1:6-9; Rom_11:6; Heb_6:4-6, Heb_10:38, Heb_10:39, Heb_12:15; 2Pe_2:20-22, 2Pe_3:17, 2Pe_3:18; Rev_2:5", "note": "", "refs": [{"l": "Gal 1:6-9", "n": "", "vs": [[6, "عجبا! كيف تتحولون بمثل هذه السرعة عن الذي دعاكم بنعمة المسيح، وتنصرفون إلى إنجيل غريب؟"], [7, "لا أعني أن هنالك إنجيلا آخر، بل إنما هنالك بعض (المعلمين) الذين يثيرون البلبلة بينكم، راغبين في تحوير إنجيل المسيح."], [8, "ولكن، حتى لو بشرناكم نحن، أو بشركم ملاك من السماء، بغير الإنجيل الذي بشرناكم به، فليكن ملعونا!"], [9, "وكما سبق أن قلنا، أكر ر القول الآن أيضا: إن كان أحد يبشركم بإنجيل غير الذي قبلتموه، فليكن ملعونا!"]]}, {"l": "Rom 11:6", "n": "", "vs": [[6, "ولكن، بما أن ذلك قد تم بالنعمة، فليس بعد على أساس الأعمال، وإلا فليست النعمة نعمة بعد."]]}, {"l": "Heb 6:4-6", "n": "", "vs": [[4, "ذلك لأن الذين قد تعرضوا مرة لنور الإيمان بالمسيح، فذاقوا العطية السماوية، وصاروا (إلى حين) من شركاء الروح القدس،"], [5, "وذاقوا كلمة الله الطيبة، وشاهدوا المعجزات التي تظهر عظمة «العالم الآتي»،"], [6, "ثم ارتدوا إلى تلك الأسس القديمة، أولئك يستحيل عليهم أن يتجددوا ثانية فيعودوا إلى التوبة. فهم يجنون على أنفسهم إذ يصلبون ابن الله مرة ثانية ويجعلونه عرضة للعار."]]}, {"l": "Heb 10:38", "n": "", "vs": [[38, "وأما من تبرر بالإيمان، فبالإيمان يحيا. ومن ارتد لا تسر به نفسي!"]]}, {"l": "Heb 10:39", "n": "", "vs": [[39, "ولكننا نحن لسنا من أهل الارتداد المؤدي إلى الهلاك، بل من أهل الإيمان المؤدي إلى خلاص نفوسنا!"]]}, {"l": "Heb 12:15", "n": "", "vs": [[15, "انتبهوا ألا يسقط أحدكم من نعمة الله، حتى لا يتأصل بينكم جذر مرارة، فيسبب بلبلة، وينجس كثيرين منكم."]]}, {"l": "2Pe 2:20-22", "n": "", "vs": [[20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."], [21, "وبالحقيقة، كان أفضل لهم لو أنهم لم يتعرفوا بطريق البر، من أن يتعرفوا به ثم يرتدوا عن الوصية المقدسة التي تسلموها."], [22, "وينطبق على هؤلاء ما يقوله المثل الصادق: «عاد الكلب إلى تناول ما تقيأه، والخنزيرة المغتسلة إلى التمرغ في الوحل!»"]]}, {"l": "2Pe 3:17", "n": "", "vs": [[17, "أما أنتم أيها الأحباء، فإذ قد تنبهتم إلى الخطر قبل حدوثه، احذروا أن تسقطوا عن ثباتكم بالانجراف وراء ضلال الأشرار."]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}, {"l": "Rev 2:5", "n": "", "vs": [[5, "فاذكر من أين سقطت، وتب راجعا إلى أعمالك السابقة، وإلا أتيت وزحزحت منارتك من موضعها إن كنت لا تتوب!"]]}], "kwAr": "وسقطتم من النعمة", "noteAr": ""}], "arS": [["يامن تريدون ", []], ["التبرير", ["G1344"]], [" عن طريق ", []], ["الشريعة", ["G3551"]], ["، قد ", []], ["حرمتم", ["G2673"]], [" ", []], ["المسيح", ["G5547"]], [" ", []], ["وسقطتم", ["G1601"]], [" من ", []], ["النعمة", ["G5485"]], ["!", []]]}, {"c": 5, "v": 5, "text": "فإننا، بالروح وعلى أساس الإيمان، ننتظر الرجاء الذي ينتجه البر.", "groups": [{"kw": "through", "raw": "Joh_16:8-15; Eph_2:18", "note": "", "refs": [{"l": "Joh 16:8-15", "n": "", "vs": [[8, "وعندما يجيء يبكت العالم على الخطيئة وعلى البر وعلى الدينونة:"], [9, "أما على الخطيئة، فلأنهم لا يؤمنون بي،"], [10, "وأما على البر، فلأني عائد إلى الآب فلا ترونني بعد؛"], [11, "وأما على الدينونة، فلأن سيد هذا العالم قد صدر عليه حكم الدينونة."], [12, "مازال عندي أمور كثيرة أقولها لكم، ولكنكم الآن تعجزون عن احتمالها."], [13, "ولكن، عندما يأتيكم روح الحق يرشدكم إلى الحق كله، لأنه لا يقول شيئا من عنده، بل يخبركم بما يسمعه، ويطلعكم على ما سوف يحدث."], [14, "وهو سيمجدني لأن كل ما سيحدثكم به صادر عني."], [15, "كل ما هو للآب، فهو لي. ولذلك قلت لكم إن ما سيحدثكم به صادر عني."]]}, {"l": "Eph 2:18", "n": "", "vs": [[18, "فبه لنا كلينا اقتراب إلى الآب بروح واحد."]]}], "kwAr": "بالروح", "noteAr": ""}, {"kw": "wait", "raw": "Gen_49:18; Psa_25:3, Psa_25:5, Psa_62:5, Psa_130:5; Lam_3:25, Lam_3:26; Hos_12:6; Rom_8:24, Rom_8:25; 1Th_1:10; 2Th_3:5", "note": "", "refs": [{"l": "Gen 49:18", "n": "", "vs": [[18, "إنني انتظرت خلاصك يارب."]]}, {"l": "Psa 25:3", "n": "", "vs": [[3, "فإن كل من يرجوك لن يخيب. أما الغادرون بغيرهم من غير علة، فسيخزون."]]}, {"l": "Psa 25:5", "n": "", "vs": [[5, "دربني في حقك وعلمني، فإنك أنت الإله مخلصي، وإياك أرجو طوال النهار."]]}, {"l": "Psa 62:5", "n": "", "vs": [[5, "انتظرت نفسي الله وحده؛ من لدنه يأتي خلاصي."]]}, {"l": "Psa 130:5", "n": "", "vs": [[5, "انتظرتك يارب. نفسي تنتظرك، وفي كلمتك رجائي."]]}, {"l": "Lam 3:25", "n": "", "vs": [[25, "الرب صالح لمن يرجونه وللنفس التي تلتمسه."]]}, {"l": "Lam 3:26", "n": "", "vs": [[26, "خير للمرء أن ينتظر بصمت خلاص الرب."]]}, {"l": "Hos 12:6", "n": "", "vs": [[6, "أما أنتم فارجعوا إلى إلهكم تائبين. تمسكوا برحمته وعدله، وداوموا على الا تكال عليه."]]}, {"l": "Rom 8:24", "n": "", "vs": [[24, "فإننا قد خلصنا، إنما بالرجاء؛ ولكن الرجاء متى رأيناه لا يكون رجاء؛ فما يراه الإنسان لماذا يرجوه بعد؟"]]}, {"l": "Rom 8:25", "n": "", "vs": [[25, "ولكن، إن كنا نرجو ما لا نراه، فبالصبر نتوقعه."]]}, {"l": "1Th 1:10", "n": "", "vs": [[10, "وتنتظروا من السماوات ابنه الذي أقامه من بين الأموات، يسوع مخلصنا من الغضب الآتي."]]}, {"l": "2Th 3:5", "n": "", "vs": [[5, "وليهد الله قلوبكم إلى ما لدى الله من المحبة ولدى المسيح من الصبر!"]]}], "kwAr": "ننتظر", "noteAr": ""}, {"kw": "the hope", "raw": "Rom_5:21; Phi_3:9; 2Ti_4:8; Tit_2:13", "note": "", "refs": [{"l": "Rom 5:21", "n": "", "vs": [[21, "حتى إنه كما ملكت الخطيئة بالموت، فكذلك أيضا تملك النعمة على أساس البر مؤدية إلى الحياة الأبدية بيسوع المسيح ربنا."]]}, {"l": "Phi 3:9", "n": "", "vs": [[9, "ويكون لي فيه مقام، إذ ليس لي بري الذاتي القائم على أساس الشريعة، بل البر الآتي من الإيمان بالمسيح، البر الذي من عند الله على أساس الإيمان."]]}, {"l": "2Ti 4:8", "n": "", "vs": [[8, "إنما ينتظرني الآن إكليل البر المحفوظ لي، والذي سيهبه لي الرب الديان العادل في ذلك اليوم؛ ولن يوهب لي وحدي، بل أيضا لجميع الذين يحبون ظهوره."]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}], "kwAr": "الرجاء", "noteAr": ""}], "arS": [["فإننا، ", []], ["بالروح", ["G4151"]], [" وعلى أساس ", []], ["الإيمان", ["G4102"]], ["، ", []], ["ننتظر", ["G553"]], [" ", []], ["الرجاء", ["G1680"]], [" الذي ينتجه ", []], ["البر", ["G1343"]], [".", []]]}, {"c": 5, "v": 6, "text": "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة.", "groups": [{"kw": "in", "raw": "Gal_5:2, Gal_5:3, Gal_3:28, Gal_6:15; Rom_2:25-29, Rom_3:29-31; 1Co_7:19; Col_3:11", "note": "", "refs": [{"l": "Gal 5:2", "n": "", "vs": [[2, "ها أنا بولس أقول لكم: إن ختنتم، لا ينفعكم المسيح شيئا."]]}, {"l": "Gal 5:3", "n": "", "vs": [[3, "وأشهد مرة أخرى لكل مختون بأنه ملتزم أن يعمل بالشريعة كلها."]]}, {"l": "Gal 3:28", "n": "", "vs": [[28, "لا فرق بعد الآن بين يهودي ويوناني، أو عبد وحر، أو ذكر وأنثى، لأنكم جميعا واحد في المسيح يسوع."]]}, {"l": "Gal 6:15", "n": "", "vs": [[15, "فليس الختان بشيء، ولا عدم الختان بشيء، وإنما (المهم أن يصير الإنسان) خليقة جديدة."]]}, {"l": "Rom 2:25-29", "n": "", "vs": [[25, "فإن الختان ينفع إن كنت تعمل بالشريعة. ولكن إن كنت مخالفا للشريعة، فقد صار ختانك كأنه عدم ختان."], [26, "إذن، إن عمل غير المختون بأحكام الشريعة، أفلا يحسب عدم ختانه كأنه ختان؟"], [27, "وغير المختون بالطبيعة، إذ يتمم الشريعة، يدينك أنت يامن تخالف الشريعة ولديك الكتاب والختان."], [28, "فليس بيهودي من كان يهوديا في الظاهر، ولا بختان ما كان ظاهرا في اللحم."], [29, "وإنما اليهودي هو من كان يهوديا في الباطن، والختان هو ما كان ختانا للقلب بالروح لا بالحرف. وهذا يأتيه المدح لا من الناس بل من الله!"]]}, {"l": "Rom 3:29-31", "n": "", "vs": [[29, "أو يكون الله إله اليهود وحدهم؟ أما هو إله الأمم أيضا؟ بلى، إنه إله الأمم أيضا،"], [30, "مادام الله الواحد هو الذي سيبرر أهل الختان على أساس الإيمان، وأهل عدم الختان على أساس الإيمان."], [31, "إذن، هل نحن نبطل الشريعة بالإيمان؟ حاشا، بل إننا به نثبت الشريعة."]]}, {"l": "1Co 7:19", "n": "", "vs": [[19, "إن الختان ليس شيئا، وعدم الختان ليس شيئا، بل المهم هو العمل بوصايا الله."]]}, {"l": "Col 3:11", "n": "", "vs": [[11, "وفيه لا فرق بين يوناني ويهودي، أو مختون وغير مختون، أو متحضر ومتخلف، أو عبد وحر، بل المسيح هو الكل وفي الكل."]]}], "kwAr": "ففي المسيح يسوع", "noteAr": ""}, {"kw": "faith", "raw": "Mat_25:31-40; 2Co_5:14; 1Th_1:3; Heb_11:8, Heb_11:17-19; Jam_2:14-26; 1Pe_1:8; 1Jo_3:14-20, 1Jo_4:18-21", "note": "", "refs": [{"l": "Mat 25:31-40", "n": "", "vs": [[31, "وعندما يعود ابن الإنسان في مجده ومعه جميع ملائكته، فإنه يجلس على عرش مجده،"], [32, "وتجتمع أمامه الشعوب كلها، فيفصل بعضهم عن بعض كما يفصل الراعي الغنم عن المعاز،"], [33, "فيوقف الغنم عن يمينه، والمعاز عن يساره؛"], [34, "ثم يقول الملك للذين عن يمينه: تعالوا يامن باركهم أبي، رثوا الملكوت الذي أعد لكم منذ إنشاء العالم:"], [35, "لأني جعت فأطعمتموني، عطشت فسقيتموني، كنت غريبا فآويتموني،"], [36, "عريانا فكسوتموني، مريضا فزرتموني، سجينا فأتيتم إلي!"], [37, "فيرد الأبرار قائلين: يارب، متى رأيناك جائعا فأطعمناك، أو عطشانا فسقيناك؟"], [38, "ومتى رأيناك غريبا فآويناك، أو عريانا فكسوناك؟"], [39, "ومتى رأيناك مريضا أو سجينا فزرناك؟"], [40, "فيجيبهم الملك: الحق أقول لكم: بما أنكم فعلتم ذلك بأحد إخوتي هؤلاء الصغار، فبي فعلتم!"]]}, {"l": "2Co 5:14", "n": "", "vs": [[14, "فإن محبة المسيح تسيطر علينا، وقد حكمنا بهذا: مادام واحد قد مات عوضا عن الجميع، فمعنى ذلك أن الجميع ماتوا؛"]]}, {"l": "1Th 1:3", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"]]}, {"l": "Heb 11:8", "n": "", "vs": [[8, "وبالإيمان، لبى إبراهيم دعوة الله، فترك وطنه وانطلق إلى أرض أخرى وعده الله بأن يورثه إياها. ولما خرج من بيته، كان لا يعرف أين يتوجه."]]}, {"l": "Heb 11:17-19", "n": "", "vs": [[17, "وبالإيمان، إبراهيم أيضا، لما امتحنه الله ، قدم إسحاق ابنه. فإنه، إذ قبل وعود الله، قدم ابنه الوحيد ذبيحة،"], [18, "مع أن الله قال له: «بإسحاق سوف يكون لك نسل يحمل اسمك!»"], [19, "فقد آمن إبراهيم بأن الله قادر على إقامة إسحاق من الموت. والواقع أن إبراهيم استعاد ابنه من الموت، على سبيل المثال أو الرمز."]]}, {"l": "Jam 2:14-26", "n": "", "vs": [[14, "ياإخوتي، هل ينفع أحدا أن يدعي أنه مؤمن، وليس له أعمال تثبت ذلك، هل يقدر إيمان مثل هذا أن يخلصه؟"], [15, "لنفرض أن أخا أو أختا كانا بحاجة شديدة إلى الثياب والطعام اليومي،"], [16, "وقال لهما أحدكم: «أتمنى لكما كل خير. البسا ثيابا دافئة، وكلا طعاما جيدا!» دون أن يقدم لهما ما يحتاجان إليه من ثياب وطعام، فأي نفع في ذلك؟"], [17, "هكذا نرى أن الإيمان وحده ميت ما لم تنتج عنه أعمال."], [18, "وربما قال أحدكم: «أنت لك إيمان وأنا لي أعمال». أرني كيف يكون إيمانك من غير أعمال، وأنا أريك كيف يكون إيماني بأعمالي."], [19, "أنت تؤمن أن الله واحد؟ حسنا تفعل ! والشياطين أيضا تؤمن بهذه الحقيقة، ولكنها ترتعد خوفا."], [20, "وهذا يؤكد لك، أيها الإنسان الغبي، أن الإيمان الذي لا تنتج عنه أعمال هو إيمان ميت!"], [21, "لنأخذ أبانا إبراهيم مثلا: كيف تبرر؟ أليس بأعماله، إذ أصعد ابنه إسحاق على المذبح"], [22, "فأنت ترى أن إيمان إبراهيم قد رافقته الأعمال. فبالأعمال قد اكتمل الإيمان."], [23, "وهكذا، تم ما قاله الكتاب: «آمن إبراهيم بالله، فحسب له ذلك برا»، حتى إنه دعي «خليل الله»."], [24, "فترون إذن أن الإنسان لا يتبرر بإيمانه فقط، بل بأعماله أيضا."], [25, "على هذا الأساس أيضا، تبررت راحاب التي كانت زانية: فقد استقبلت الرجلين اللذين أرسلا إليها، وصرفتهما في طريق آخر."], [26, "فكما أن جسم الإنسان يكون ميتا إذا فارقته الروح، كذلك يكون الإيمان ميتا إذا لم ترافقه الأعمال!"]]}, {"l": "1Pe 1:8", "n": "", "vs": [[8, "أنتم لم تروا المسيح، ولكنكم تحبونه. ومع أنكم لا ترونه الآن، فأنتم تؤمنون به وتبتهجون بفرح مجيد يفوق الوصف."]]}, {"l": "1Jo 3:14-20", "n": "", "vs": [[14, "إن محبتنا لإخوتنا تبين لنا أننا انتقلنا من الموت إلى الحياة. فالذي لا يحب إخوته، فهو باق في الموت."], [15, "وكل من يبغض أخا له، فهو قاتل. وأنتم تعرفون أن القاتل لا تكون له حياة أبدية ثابتة فيه."], [16, "ومقياس المحبة هو العمل الذي قام به المسيح إذ بذل حياته لأجلنا. فعلينا نحن أيضا أن نبذل حياتنا لأجل إخوتنا."], [17, "وأما الذي يملك مالا يمكنه من العيش في بحبوحة، ويقسي قلبه على أحد الإخوة المحتاجين، فكيف تكون محبة الله متأصلة فيه؟"], [18, "أيها الأولاد الصغار، لا يجب أن تكون محبتنا مجرد ادعاء بالكلام واللسان، بل تكون محبة عملية حقة."], [19, "عندئذ نتأكد أننا نتصرف بحسب الحق، وتطمئن نفوسنا في حضرة الله،"], [20, "ولو لامتنا قلوبنا؛ فإن الله أعظم من قلوبنا، وهو العليم بكل شيء."]]}, {"l": "1Jo 4:18-21", "n": "", "vs": [[18, "ليس في المحبة أي خوف. بل المحبة الكاملة تطرد الخوف خارجا. فإن الخوف يأتي من العقاب. والخائف لا تكون محبة الله قد اكتملت فيه."], [19, "ونحن نحب، لأن الله أحبنا أولا."], [20, "فإن قال أحد: «أنا أحب الله !» ولكنه يبغض أخا له، فهو كاذب، لأنه إن كان لا يحب أخاه الذي يراه، فكيف يقدر أن يحب الله الذي لم يره قط؟"], [21, "فهذه الوصية جاءتنا من المسيح نفسه: من يحب الله ، يحب أخاه!"]]}], "kwAr": "بل للإيمان العامل بالمحبة", "noteAr": ""}], "arS": [["ففي ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], ["، لا ", []], ["نفع", ["G2480"]], [" ", []], ["للختان", ["G4061"]], [" ولا ", []], ["لعدم الختان", ["G203"]], ["، بل ", []], ["للإيمان", ["G4102"]], [" ", []], ["العامل", ["G1754"]], [" ", []], ["بالمحبة", ["G26"]], [".", []]]}, {"c": 5, "v": 7, "text": "كنتم تجرون جريا جيدا، فمن أعاقكم حتى لا تذعنوا للحق؟", "groups": [{"kw": "run", "raw": "Mat_13:21; 1Co_9:24; Heb_12:1", "note": "", "refs": [{"l": "Mat 13:21", "n": "", "vs": [[21, "ولكنه لا أصل له في ذاته، وإنما يبقى إلى حين: فحالما يحدث ضيق أو اضطهاد من أجل الكلمة، يتعثر."]]}, {"l": "1Co 9:24", "n": "", "vs": [[24, "أما تعلمون أن المتبارين يركضون جميعا في الميدان ولكن واحدا منهم فقط يفوز بالجائزة؟ هكذا اركضوا أنتم حتى تفوزوا!"]]}, {"l": "Heb 12:1", "n": "", "vs": [[1, "فبما أن هذا العدد الكبير من الشاهدين للإيمان، يتجمع حولنا كأنه سحابة عظيمة، فلنطرح جانبا كل ثقل يعيقنا عن التقدم، ونتخلص من تلك الخطيئة التي نتعرض للسقوط في فخها بسهولة، لكي نتمكن، نحن أيضا، أن نركض باجتهاد في السباق الممتد أمامنا،"]]}], "kwAr": "كنتم تجرون جريا جيدا", "noteAr": ""}, {"kw": "hinder you", "raw": "or, drive you back, Gal_3:1", "note": "or, drive you back, Gal_3:1", "refs": [{"l": "Gal 3:1", "n": "", "vs": [[1, "ياأهل غلاطية الأغبياء! من سحر عقولكم، أنتم الذين قد رسم أمام أعينكم يسوع المسيح وهو مصلوب؟"]]}], "kwAr": "فمن أعاقكم", "noteAr": "أو: ردّكم إلى الوراء."}, {"kw": "obey", "raw": "Act_6:7; Rom_2:8, Rom_6:17, Rom_10:16, Rom_15:18, Rom_16:26; 2Co_10:5; 2Th_1:8; Heb_5:9; Heb_11:8; 1Pe_1:22", "note": "", "refs": [{"l": "Act 6:7", "n": "", "vs": [[7, "فزادت كلمة الله انتشارا، وتكاثر عدد التلاميذ في أورشليم، وأذعن للإيمان مجموعة كبيرة من الكهنة."]]}, {"l": "Rom 2:8", "n": "", "vs": [[8, "ويكون الغضب والسخط للمخاصمين الذين يرفضون الطاعة للحق ولكنهم يخضعون للإثم."]]}, {"l": "Rom 6:17", "n": "", "vs": [[17, "إنما الشكر لله، لأنكم كنتم عبيدا للخطيئة ولكن أطعتم من القلب صيغة التعليم الذي وضعتم في عهدته."]]}, {"l": "Rom 10:16", "n": "", "vs": [[16, "ولكن، ليس كلهم أطاعوا الإنجيل. فإن إشعياء يقول: «يارب! من صدق ما أسمعناه إياه؟»"]]}, {"l": "Rom 15:18", "n": "", "vs": [[18, "فما كنت لأتجاسر أن أتكلم بشيء إلا على ما عمله المسيح على يدي لهداية الأمم إلى الطاعة، بالقول والفعل،"]]}, {"l": "Rom 16:26", "n": "", "vs": [[26, "ولكن أذيع الآن، بأمر الله الأزلي في الكتابات النبوية، على جميع الأمم لأجل إطاعة الإيمان؛"]]}, {"l": "2Co 10:5", "n": "", "vs": [[5, "وكل ما يعلو مرتفعا لمقاومة معرفة الله، ونأسر كل فكر إلى طاعة المسيح."]]}, {"l": "2Th 1:8", "n": "", "vs": [[8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."]]}, {"l": "Heb 5:9", "n": "", "vs": [[9, "وبذلك، أصبح مؤهلا لمهمته، فصار لجميع الذين يطيعونه مصدرا للخلاص الأبدي."]]}, {"l": "Heb 11:8", "n": "", "vs": [[8, "وبالإيمان، لبى إبراهيم دعوة الله، فترك وطنه وانطلق إلى أرض أخرى وعده الله بأن يورثه إياها. ولما خرج من بيته، كان لا يعرف أين يتوجه."]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}], "kwAr": "حتى لا تذعنوا للحق", "noteAr": ""}], "arS": [["كنتم ", []], ["تجرون", ["G5143"]], [" جريا ", []], ["جيدا", ["G2573"]], ["، فمن ", []], ["أعاقكم", ["G348"]], [" حتى لا ", []], ["تذعنوا", ["G3982"]], [" ", []], ["للحق", ["G225"]], ["؟", []]]}, {"c": 5, "v": 8, "text": "هذا التضليل ليس من الذي دعاكم!", "groups": [{"kw": "him", "raw": "Gal_1:6", "note": "", "refs": [{"l": "Gal 1:6", "n": "", "vs": [[6, "عجبا! كيف تتحولون بمثل هذه السرعة عن الذي دعاكم بنعمة المسيح، وتنصرفون إلى إنجيل غريب؟"]]}], "kwAr": "ليس من الذي دعاكم", "noteAr": ""}], "arS": [["هذا ", []], ["التضليل", ["G3988"]], [" ليس من الذي ", []], ["دعاكم", ["G2564"]], ["!", []]]}, {"c": 5, "v": 9, "text": "إن خميرة صغيرة تخمر العجين كله.", "groups": [{"kw": "", "raw": "Mat_23:33, Mat_16:6-12; Mar_8:15; Luk_12:1, Luk_13:21; 1Co_5:6, 1Co_5:7, 1Co_15:33; 2Ti_2:17", "note": "", "refs": [{"l": "Mat 23:33", "n": "", "vs": [[33, "أيها الحيات، أولاد الأفاعي! كيف تفلتون من عقاب جهنم؟"]]}, {"l": "Mat 16:6-12", "n": "", "vs": [[6, "وقال لهم يسوع: «انتبهوا! خذوا حذركم من خمير الفريسيين والصدوقيين!»"], [7, "فبدأوا يحاجون بعضهم بعضا، قائلين: «هذا لأننا لم نتزود خبزا!»"], [8, "وعلم يسوع بذلك، فقال لهم: «ياقليلي الإيمان، لماذا تحاجون بعضكم بعضا لأنكم لم تتزودوا خبزا؟"], [9, "ألا تفهمون بعد؟ أم نسيتم الأرغفة الخمسة التي أشبعت الخمسة الآلاف، وكم قفة رفعتم منها؟"], [10, "أو نسيتم الأرغفة السبعة التي أشبعت الأربعة الآلاف، وكم سلا رفعتم منها؟"], [11, "كيف لا تفهمون أني لم أكن أعني الخبز حين قلت لكم: خذوا حذركم من خمير الفريسيين والصدوقيين؟»"], [12, "عندئذ أدرك التلاميذ أنه لم يكن يحذرهم من خمير الخبز، بل من تعليم الفريسيين والصدوقيين."]]}, {"l": "Mar 8:15", "n": "", "vs": [[15, "وأوصاهم قائلا: «انتبهوا! خذوا حذركم من خمير الفريسيين وخمير هيرودس»."]]}, {"l": "Luk 12:1", "n": "", "vs": [[1, "وفي تلك الأثناء، إذ احتشد عشرات الألوف من الشعب حتى داس بعضهم بعضا، أخذ يقول لتلاميذه أولا: «احذروا لأنفسكم من خمير الفريسيين الذي هو الريا ء!"]]}, {"l": "Luk 13:21", "n": "", "vs": [[21, "إنه يشبه خميرة أخذتها امرأة وأخفتها في ثلاثة مقادير من الدقيق حتى اختمر العجين كله!»"]]}, {"l": "1Co 5:6", "n": "", "vs": [[6, "إن افتخاركم ليس في محله! ألستم تعلمون أن خميرة صغيرة تخمر العجين كله؟"]]}, {"l": "1Co 5:7", "n": "", "vs": [[7, "فاعزلوا الخميرة العتيقة من بينكم لتكونوا عجينا جديدا، لأنكم فطير ! فإن حمل فصحنا، أي المسيح، قد ذبح."]]}, {"l": "1Co 15:33", "n": "", "vs": [[33, "لا تنقادوا إلى الضلال: إن المعاشرات الرديئة تفسد الأخلاق الجيدة!"]]}, {"l": "2Ti 2:17", "n": "", "vs": [[17, "وكلامهم ينهش كالآكلة، ومنهم هيمنايوس وفيليتوس،"]]}], "kwAr": "", "noteAr": ""}], "arS": [["إن ", []], ["خميرة", ["G2219"]], [" ", []], ["صغيرة", ["G3398"]], [" ", []], ["تخمر", ["G2220"]], [" ", []], ["العجين", ["G5445"]], [" ", []], ["كله", ["G3650"]], [".", []]]}, {"c": 5, "v": 10, "text": "ولكن لي ثقة بكم في الرب أنكم لن تعتنقوا رأيا آخر. وكل من يثير البلبلة بينكم سيلقى عقاب ذلك، كائنا من كان.", "groups": [{"kw": "confidence", "raw": "Gal_4:11, Gal_4:20; 2Co_1:15, 2Co_2:3, 2Co_7:16, 2Co_8:22; 2Th_3:4; Phm_1:21", "note": "", "refs": [{"l": "Gal 4:11", "n": "", "vs": [[11, "أخاف عليكم، خشية أن أكون قد تعبت من أجلكم بلا جدوى."]]}, {"l": "Gal 4:20", "n": "", "vs": [[20, "وكم أود لو أكون الآن حاضرا عندكم، فأخاطبكم بغير هذه اللهجة، لأني متحير في أمركم."]]}, {"l": "2Co 1:15", "n": "", "vs": [[15, "فبهذه القناعة، كنت قد نويت سابقا أن أجيء إليكم، ليكون لكم فرح مرة أخرى،"]]}, {"l": "2Co 2:3", "n": "", "vs": [[3, "لهذا أكتب إليكم ما أكتبه هنا، حتى عندما أجيء لا يأتيني الحزن من الذي كان يجب أن يأتيني منه الفرح. ولي ثقة بجميعكم أن فرحي هو فرحكم جميعا."]]}, {"l": "2Co 7:16", "n": "", "vs": [[16, "إني أفرح بكوني واثقا بكم في كل شيء."]]}, {"l": "2Co 8:22", "n": "", "vs": [[22, "وأرسلنا معهما أخانا الذي تبين لنا بالاختبار مرة بعد مرة، أن له حماسة شديدة في أمور كثيرة، وهو الآن أوفر جدا في الحماسة بسبب ثقته العظيمة بكم."]]}, {"l": "2Th 3:4", "n": "", "vs": [[4, "ولنا في الرب ملء الثقة من جهتكم بأنكم عاملون بما نوصيكم به، وستعملون به أيضا."]]}, {"l": "Phm 1:21", "n": "", "vs": [[21, "لما كنت واثقا بإطاعتك، كتبت هذه الرسالة إليك، عالما أنك ستفعل أيضا فوق ما أطلب."]]}], "kwAr": "لي ثقة بكم في الرب", "noteAr": ""}, {"kw": "but", "raw": "Gal_1:7, Gal_2:4, Gal_3:1, Gal_4:17, Gal_6:12, Gal_6:13, Gal_6:17; Act_15:1, Act_15:2, Act_15:24; 1Jo_2:18-26", "note": "", "refs": [{"l": "Gal 1:7", "n": "", "vs": [[7, "لا أعني أن هنالك إنجيلا آخر، بل إنما هنالك بعض (المعلمين) الذين يثيرون البلبلة بينكم، راغبين في تحوير إنجيل المسيح."]]}, {"l": "Gal 2:4", "n": "", "vs": [[4, "إنما أثير الأمر بسبب الإخوة الدجالين الذين أدخلوا بيننا خلسة، فاندسوا ليتجسسوا حريتنا التي لنا في المسيح يسوع، لعلهم يعيدوننا إلى العبودية؛"]]}, {"l": "Gal 3:1", "n": "", "vs": [[1, "ياأهل غلاطية الأغبياء! من سحر عقولكم، أنتم الذين قد رسم أمام أعينكم يسوع المسيح وهو مصلوب؟"]]}, {"l": "Gal 4:17", "n": "", "vs": [[17, "إن أولئك (المعلمين) يظهرون من نحوكم حماسة، ولكنها غير صادقة، بل هم يرغبون في عزلكم عنا،"]]}, {"l": "Gal 6:12", "n": "", "vs": [[12, "إن الذين يريدون أن يظهروا في الجسد بمظهر حسن، أولئك يرغمونكم أن تختنوا، فقط لئلا يلقوا الاضطهاد بسبب صليب المسيح."]]}, {"l": "Gal 6:13", "n": "", "vs": [[13, "فحتى أولئك الذين يختنون، هم أنفسهم، لا يعملون بالشريعة، بل يريدون لكم أن تختنوا ليفتخروا بجسدكم."]]}, {"l": "Gal 6:17", "n": "", "vs": [[17, "لا يسبب لي أحد المتاعب فيما بعد، فإني أحمل في جسدي سمات الرب يسوع."]]}, {"l": "Act 15:1", "n": "", "vs": [[1, "وجاء بعض اليهود (الذين كانوا قد آمنوا بالمسيح) من منطقة اليهودية إلى أنطاكية، وأخذوا يعلمون الإخوة قائلين: «لا يمكنكم أن تخلصوا ما لم تختنوا حسب شريعة موسى»"]]}, {"l": "Act 15:2", "n": "", "vs": [[2, "فجادلهم بولس وبرنابا جدالا عنيفا. وبعد المناقشة قرر مؤمنو أنطاكية أن يذهب بولس وبرنابا مع بعض المؤمنين ليقابلوا الرسل والشيوخ في أورشليم، ويبحثوا معهم في هذه القضية."]]}, {"l": "Act 15:24", "n": "", "vs": [[24, "علمنا أن بعض الأشخاص ذهبوا من عندنا إليكم، دون تفويض منا فأثاروا بكلامهم الاضطراب بينكم وأقلقوا أفكاركم."]]}, {"l": "1Jo 2:18-26", "n": "", "vs": [[18, "أيها الأولاد، اعلموا أننا نعيش الآن في الزمن الأخير. وكما سمعتم أنه سوف يأتي أخيرا «مسيح دجال»، فقد ظهر حتى الآن كثيرون من الدجالين المقاومين للمسيح. من هنا نتأكد أننا نعيش في الزمن الأخير."], [19, "هؤلاء الدجالون انفصلوا عنا، لكنهم في الواقع لم يكونوا منا. ولو كانوا منا لظلوا معنا. فانفصالهم عنا إذن برهان على أنهم جميعا ليسوا منا."], [20, "أما أنتم فلكم مسحة من القدوس، وجميعكم تعرفون الحق."], [21, "فأنا أكتب إليكم ليس لأنكم لا تعرفون الحق، بل لأنكم تعرفونه وتدركون أن كل ما هو كذب لا يأتي من الحق."], [22, "ومن هو الكذاب؟ إنه الذي ينكر أن يسوع هو المسيح حقا. إنه ضد للمسيح ينكر الآب والابن معا."], [23, "وكل من ينكر الابن، لا يكون الآب أيضا من نصيبه. ومن يعترف بالابن، فله الآب أيضا."], [24, "أما أنتم، فالكلام الذي سمعتموه منذ البداية، فليكن راسخا فيكم. فحين يترسخ ذلك الكلام في داخلكم، تتوطد صلتكم بالابن، وبالآب."], [25, "فإن الله نفسه قد وعدنا بالحياة الأبدية."], [26, "كتبت إليكم هذا مشيرا إلى الذين يحاولون أن يضللوكم."]]}], "kwAr": "وكل من يثير البلبلة بينكم", "noteAr": ""}, {"kw": "bear", "raw": "Gal_5:12; 1Co_5:5; 2Co_2:6, 2Co_10:2, 2Co_10:6, 2Co_13:10; 1Ti_1:20", "note": "", "refs": [{"l": "Gal 5:12", "n": "", "vs": [[12, "ليت الذين يثيرون البلبلة بينكم يبترون أنفسهم!"]]}, {"l": "1Co 5:5", "n": "", "vs": [[5, "تقررون تسليم مرتكب هذا الفعل إلى الشيطان، ليهلك جسده؛ أما روحه فتخلص في يوم الرب يسوع."]]}, {"l": "2Co 2:6", "n": "", "vs": [[6, "والآن، يكفي ذلك الرجل المذنب القصاص الذي أنزله به أكثركم."]]}, {"l": "2Co 10:2", "n": "", "vs": [[2, "راجيا ألا تضطروني لأن أكون جريئا عند حضوري، فألجأ إلى الحزم الذي أظن أني سأتجرأ عليه في معاملة من يظنون منكم أننا نسلك وفقا للجسد."]]}, {"l": "2Co 10:6", "n": "", "vs": [[6, "ونحن على استعداد لمعاقبة كل عصيان، بعد أن تكون طاعتكم قد اكتملت."]]}, {"l": "2Co 13:10", "n": "", "vs": [[10, "لهذا أكتب إليكم بهذه الأمور وأنا غائب، حتى إذا حضرت لا ألجأ إلى الحزم بحسب السلطة التي منحني إياها الرب للبنيان لا للهدم."]]}, {"l": "1Ti 1:20", "n": "", "vs": [[20, "ومن هؤلاء همنايوس وإسكندر، وقد سلمتهما إلى الشيطان ليتعلما بالتأديب ألا يجدفا."]]}], "kwAr": "سيلقى عقاب ذلك", "noteAr": ""}, {"kw": "whosoever", "raw": "Gal_2:6; 2Co_5:16", "note": "", "refs": [{"l": "Gal 2:6", "n": "", "vs": [[6, "أما الذين كانوا يعتبرون من البارزين، ولا فرق عندي مهما كانت مكانتهم مادام الله لا يراعي وجاهة إنسان، فإنهم لم يزيدوا شيئا على ما أبشر به."]]}, {"l": "2Co 5:16", "n": "", "vs": [[16, "إذن، نحن منذ الآن لا نعرف أحدا معرفة بشرية. ولكن إن كنا قد عرفنا المسيح معرفة بشرية، فنحن الآن لا نعرفه هكذا بعد."]]}], "kwAr": "كائنا من كان", "noteAr": ""}], "arS": [["ولكن لي ", []], ["ثقة", ["G3982"]], [" بكم في ", []], ["الرب", ["G2962"]], [" أنكم لن ", []], ["تعتنقوا رأيا", ["G5426"]], [" ", []], ["آخر", ["G243"]], [". وكل من ", []], ["يثير البلبلة", ["G5015"]], [" بينكم ", []], ["سيلقى", ["G941"]], [" ", []], ["عقاب", ["G2917"]], [" ذلك، كائنا من كان.", []]]}, {"c": 5, "v": 11, "text": "وأما أنا، أيها الإخوة، فلو صح أنني مازلت أدعو إلى الختان، فلماذا مازلت ألقى الاضطهاد؟ إذن لكانت العثرة التي في الصليب قد زالت!", "groups": [{"kw": "if", "raw": "Gal_2:3; Act_16:3", "note": "", "refs": [{"l": "Gal 2:3", "n": "", "vs": [[3, "ولكن، حتى تيطس الذي كان يرافقني وهو يوناني، لم يضطر أن يختن."]]}, {"l": "Act 16:3", "n": "", "vs": [[3, "فأحب بولس أن يصحبه في التبشير. ولأن يهود تلك المنطقة كانوا يعرفون أن أباه يوناني، فقد أخذه بولس وختنه."]]}], "kwAr": "فلو صح أنني مازلت أدعو إلى الختان", "noteAr": ""}, {"kw": "why", "raw": "Gal_4:29, Gal_6:12, Gal_6:17; Act_21:21, Act_21:28, Act_22:21, Act_22:22, Act_23:13, Act_23:14; 1Co_15:30; 2Co_11:23-26", "note": "", "refs": [{"l": "Gal 4:29", "n": "", "vs": [[29, "ولكن، كما كان في الماضي المولود بحسب الجسد يضطهد المولود بحسب الروح، فكذلك أيضا يحدث الآن."]]}, {"l": "Gal 6:12", "n": "", "vs": [[12, "إن الذين يريدون أن يظهروا في الجسد بمظهر حسن، أولئك يرغمونكم أن تختنوا، فقط لئلا يلقوا الاضطهاد بسبب صليب المسيح."]]}, {"l": "Gal 6:17", "n": "", "vs": [[17, "لا يسبب لي أحد المتاعب فيما بعد، فإني أحمل في جسدي سمات الرب يسوع."]]}, {"l": "Act 21:21", "n": "", "vs": [[21, "وقد سمعوا بأنك تدعو اليهود الذين يسكنون بين الأجانب إلى الارتداد عن موسى، وتوصيهم بألا يختنوا أولادهم ولا يتبعوا العادات المتوارثة،"]]}, {"l": "Act 21:28", "n": "", "vs": [[28, "وهم يصرخون: «النجدة يابني إسرائيل! هذا هو الرجل الذي يدعو الناس في كل مكان إلى عقيدة تشكل خطرا على شعبنا وشريعتنا وعلى هذا المكان، حتى إنه أدخل اليونانيين إلى الهيكل ودنس هذا المكان المقدس!»"]]}, {"l": "Act 22:21", "n": "", "vs": [[21, "ولكنه قال لي: اذهب ... سأرسلك بعيدا: إلى الأمم!»"]]}, {"l": "Act 22:22", "n": "", "vs": [[22, "ظل المجتمعون يصغون حتى وصل بولس إلى ذكر الأمم، فصرخوا بقائد الكتيبة: «انزع هذا الرجل من الأرض! إنه لا يستحق الحياة!»"]]}, {"l": "Act 23:13", "n": "", "vs": [[13, "وكان عدد الذين حاكوا هذه المؤامرة نحو أربعين رجلا."]]}, {"l": "Act 23:14", "n": "", "vs": [[14, "وذهبوا إلى رؤساء الكهنة والشيوخ وقالوا: «حرام علينا الطعام والشراب حتى نقتل بولس."]]}, {"l": "1Co 15:30", "n": "", "vs": [[30, "ولماذا نعرض نحن أنفسنا للخطر كل ساعة؟"]]}, {"l": "2Co 11:23-26", "n": "", "vs": [[23, "وإن كانوا خدام المسيح، أتكلم كأني فقدت صوابي، فأنا متفوق عليهم: في الأتعاب أوفر منهم جدا، في الجلدات فوق الحد، في السجون أوفر جدا، في التعرض للموت أكثر مرارا."], [24, "من اليهود تلقيت الجلد خمس مرات، كل مرة أربعين جلدة إلا واحدة."], [25, "ضربت بالعصي ثلاث مرات. رجمت بالحجارة مرة. تحطمت بي السفينة ثلاث مرات. قضيت في عرض البحر يوما بنهاره وليله."], [26, "سافرت أسفارا عديدة؛ وواجهتني أخطار السيول الجارفة، وأخطار قطاع الطرق، وأخطار من بني جنسي، وأخطار من الأمم، وأخطار في المدن، وأخطار في البراري، وأخطار في البحر، وأخطار بين إخوة دجالين."]]}], "kwAr": "فلماذا مازلت ألقى الاضطهاد", "noteAr": ""}, {"kw": "the offence", "raw": "Isa_8:14; Rom_9:32, Rom_9:33; 1Co_1:18, 1Co_1:23; 1Pe_2:8, 1Pe_2:9", "note": "", "refs": [{"l": "Isa 8:14", "n": "", "vs": [[14, "فيكون لكم مقدسا. أما لبيتي إسرائيل، فيكون حجر صدمة وصخرة عثرة، وفخا وشركا لساكني أورشليم،"]]}, {"l": "Rom 9:32", "n": "", "vs": [[32, "ولأي سبب؟ لأن سعيهم لم يكن على أساس الإيمان، بل كان وكأن الأمر قائم على الأعمال. فقد تعثروا بحجر العثرة،"]]}, {"l": "Rom 9:33", "n": "", "vs": [[33, "كما كتب: «ها أنا واضع في صهيون حجر عثرة وصخرة سقوط. ومن يؤمن به لا يخيب»."]]}, {"l": "1Co 1:18", "n": "", "vs": [[18, "لأن البشارة بالصليب جهالة عند الهالكين؛ وأما عندنا، نحن المخلصين، فهي قدرة الله."]]}, {"l": "1Co 1:23", "n": "", "vs": [[23, "ولكننا نحن نبشر بالمسيح مصلوبا، مما يشكل عائقا عند اليهود وجهالة عند الأمم؛"]]}, {"l": "1Pe 2:8", "n": "", "vs": [[8, "كما أنه هو «الحجر الذي يصطدمون به، والصخرة التي يسقطون عليها»! وهم يسقطون لأنهم يرفضون أن يؤمنوا بالكلمة."]]}, {"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}], "kwAr": "العثرة التي في الصليب", "noteAr": ""}], "arS": [["وأما ", []], ["أنا", ["G1473"]], ["، أيها ", []], ["الإخوة", ["G80"]], ["، فلو صح أنني ", []], ["مازلت", ["G2089"]], [" ", []], ["أدعو", ["G2784"]], [" إلى ", []], ["الختان", ["G4061"]], ["، ", []], ["فلماذا", ["G5101"]], [" ", []], ["مازلت", ["G2089"]], [" ألقى ", []], ["الاضطهاد", ["G1377"]], ["؟ إذن لكانت ", []], ["العثرة", ["G4625"]], [" التي في ", []], ["الصليب", ["G4716"]], [" قد ", []], ["زالت", ["G2673"]], ["!", []]]}, {"c": 5, "v": 12, "text": "ليت الذين يثيرون البلبلة بينكم يبترون أنفسهم!", "groups": [{"kw": "cut", "raw": "Gal_5:10, Gal_1:8, Gal_1:9; Gen_17:14; Exo_12:15, Exo_30:33; Lev_22:3; Jos_7:12, Jos_7:25; Joh_9:34; Act_5:5, Act_5:9; 1Co_5:13; Tit_3:10", "note": "", "refs": [{"l": "Gal 5:10", "n": "", "vs": [[10, "ولكن لي ثقة بكم في الرب أنكم لن تعتنقوا رأيا آخر. وكل من يثير البلبلة بينكم سيلقى عقاب ذلك، كائنا من كان."]]}, {"l": "Gal 1:8", "n": "", "vs": [[8, "ولكن، حتى لو بشرناكم نحن، أو بشركم ملاك من السماء، بغير الإنجيل الذي بشرناكم به، فليكن ملعونا!"]]}, {"l": "Gal 1:9", "n": "", "vs": [[9, "وكما سبق أن قلنا، أكر ر القول الآن أيضا: إن كان أحد يبشركم بإنجيل غير الذي قبلتموه، فليكن ملعونا!"]]}, {"l": "Gen 17:14", "n": "", "vs": [[14, "أما الذكر الأغلف الذي لم يختن، يستأصل من بين قومه لأنه نكث عهدي»."]]}, {"l": "Exo 12:15", "n": "", "vs": [[15, "سبعة أيام تحتفلون، تأكلون فيها فطيرا، تخلون بيوتكم من الخمير في اليوم الأول، فإن كل من أكل خميرا في اليوم الأول إلى اليوم السابع، تباد تلك النفس من إسرائيل."]]}, {"l": "Exo 30:33", "n": "", "vs": [[33, "كل من ركب مثله أو دهن به غريبا من غير الكهنة يستأصل من بين قومه»."]]}, {"l": "Lev 22:3", "n": "", "vs": [[3, "قل لهم: إياكم على مدى أجيالكم أن يقترب كاهن إلى التقدمات التي يقدسها بنو إسرائيل وهو غير طاهر، فإن تلك النفس تستأصل من أمامي، فأنا الرب."]]}, {"l": "Jos 7:12", "n": "", "vs": [[12, "لهذا عجز بنو إسرائيل عن الثبات أمام أعدائهم، فولوا أمامهم الأدبار، لأنهم هالكون إذ لن أعود أكون معكم ما لم تستأصلوا الحرام من وسطكم،"]]}, {"l": "Jos 7:25", "n": "", "vs": [[25, "وقال يشوع: «لماذا جلبت علينا هذه الكارثة؟ لتحل بك اليوم الفواجع». فرجمه جميع إسرائيل بالحجارة مع أهل بيته وأحرقوهم بالنار،"]]}, {"l": "Joh 9:34", "n": "", "vs": [[34, "فصاحوا به: «أنت بكاملك ولدت في الخطيئة وتعلمنا؟!» ثم طردوه خارج المجمع."]]}, {"l": "Act 5:5", "n": "", "vs": [[5, "فما إن سمع حنانيا هذا الكلام حتى سقط أرضا ومات! فاستولت الرهبة الشديدة على جميع الذين عرفوا ذلك."]]}, {"l": "Act 5:9", "n": "", "vs": [[9, "فقال لها بطرس: «لماذا اتفقت مع زوجك على امتحان روح الرب؟ ها قد وصل الشبان الذين دفنوا زوجك إلى الباب، وسيحملونك أيضا!»"]]}, {"l": "1Co 5:13", "n": "", "vs": [[13, "أما الذين في الخارج، فالله يدينهم. فاعزلوا من هو شرير من بينكم."]]}, {"l": "Tit 3:10", "n": "", "vs": [[10, "وصاحب الهرطقة اقطع العلاقة به بعد إنذاره أولا وثانيا،"]]}], "kwAr": "يبترون أنفسهم", "noteAr": ""}, {"kw": "trouble", "raw": "Act_15:1, Act_15:2, Act_15:24", "note": "", "refs": [{"l": "Act 15:1", "n": "", "vs": [[1, "وجاء بعض اليهود (الذين كانوا قد آمنوا بالمسيح) من منطقة اليهودية إلى أنطاكية، وأخذوا يعلمون الإخوة قائلين: «لا يمكنكم أن تخلصوا ما لم تختنوا حسب شريعة موسى»"]]}, {"l": "Act 15:2", "n": "", "vs": [[2, "فجادلهم بولس وبرنابا جدالا عنيفا. وبعد المناقشة قرر مؤمنو أنطاكية أن يذهب بولس وبرنابا مع بعض المؤمنين ليقابلوا الرسل والشيوخ في أورشليم، ويبحثوا معهم في هذه القضية."]]}, {"l": "Act 15:24", "n": "", "vs": [[24, "علمنا أن بعض الأشخاص ذهبوا من عندنا إليكم، دون تفويض منا فأثاروا بكلامهم الاضطراب بينكم وأقلقوا أفكاركم."]]}], "kwAr": "الذين يثيرون البلبلة", "noteAr": ""}], "arS": [["ليت", ["G3785"]], [" الذين ", []], ["يثيرون البلبلة", ["G387"]], [" بينكم ", []], ["يبترون", ["G609"]], [" أنفسهم!", []]]}, {"c": 5, "v": 13, "text": "فإنما إلى الحرية قد دعيتم، أيها الإخوة؛ ولكن لا تتخذوا من الحرية ذريعة لإرضاء الجسد، بل بالمحبة كونوا عبيدا في خدمة أحدكم الآخر.", "groups": [{"kw": "ye", "raw": "Gal_5:1, Gal_4:5-7, Gal_4:22-31; Isa_61:1; Luk_4:18; Joh_8:32-36; Rom_6:18-22", "note": "", "refs": [{"l": "Gal 5:1", "n": "", "vs": [[1, "إن المسيح قد حررنا وأطلقنا في سبيل الحرية. فاثبتوا إذن، ولا تعودوا إلى الارتباك بنير العبودية."]]}, {"l": "Gal 4:5-7", "n": "", "vs": [[5, "ليحرر بالفداء أولئك الخاضعين للشريعة، فننال جميعا مقام أبناء الله."], [6, "وبما أنكم أبناء له، أرسل الله إلى قلوبنا روح ابنه، مناديا: «أبا، ياأبانا»."], [7, "إذن، أنت لست عبدا بعد الآن، بل أنت ابن. ومادمت ابنا، فقد جعلك الله وريثا أيضا."]]}, {"l": "Gal 4:22-31", "n": "", "vs": [[22, "فإنه قد كتب أن إبراهيم كان له ابنان: أحدهما من الجارية، والآخر من المرأة الحرة."], [23, "أما ابن الجارية، فقد ولد حسب الجسد. وأما ابن الحرة، فإتماما للوعد."], [24, "وهذه الحقيقة لها معنى رمزي. فهاتان المرأتان ترمزان إلى عهدين: الأول مصدره جبل سيناء، يجعل المولودين تحته في حال العبودية، ورمزه هاجر."], [25, "ولفظة هاجر تطلق على جبل سيناء، في بلاد العرب، وتمثل أورشليم الحالية، فإنها مع بنيها في العبودية."], [26, "أما الثاني، فرمزه الحرة التي تمثل أورشليم السماوية التي هي أمنا."], [27, "فإنه قد كتب: «افرحي أيتها العاقر التي لا تلد، اهتفي بأعلى صوتك أيتها التي لا تتمخض، لأن أولاد المهجورة أكثر عددا من أولاد التي لها زوج!»"], [28, "وأما أنتم، أيها الإخوة، فأولاد الوعد، على مثال إسحاق."], [29, "ولكن، كما كان في الماضي المولود بحسب الجسد يضطهد المولود بحسب الروح، فكذلك أيضا يحدث الآن."], [30, "إنما ماذا يقول الكتاب؟ «اطرد الجارية وابنها، لأن ابن الجارية لا يرث مع ابن الحرة!»"], [31, "إذن، أيها الإخوة، نحن لسنا أولاد الجارية، بل أولاد الحرة."]]}, {"l": "Isa 61:1", "n": "", "vs": [[1, "روح السيد الرب علي، لأن الرب مسحني لأبشر المساكين، أرسلني لأضمد جراح المنكسري القلوب، لأنادي للمسبيين بالعتق وللمأسورين بالحرية،"]]}, {"l": "Luk 4:18", "n": "", "vs": [[18, "«روح الرب علي، لأنه مسحني لأبشر الفقراء؛ أرسلني لأنادي للمأسورين بالإطلاق وللعميان بالبصر، لأطلق المسحوقين أحرارا،"]]}, {"l": "Joh 8:32-36", "n": "", "vs": [[32, "وتعرفون الحق، والحق يحرركم»."], [33, "فرد اليهود: «نحن أحفاد إبراهيم، ولم نكن قط عبيدا لأحد! كيف تقول لنا: إنكم ستصيرون أحرارا؟»"], [34, "أجابهم يسوع: «الحق الحق أقول لكم: إن من يرتكب الخطيئة يكون عبدا لها."], [35, "والعبد لا يبقى في بيت سيده دائما؛ أما الابن فيعيش فيه أبدا."], [36, "فإن حرركم الابن تصيرون بالحق أحرارا."]]}, {"l": "Rom 6:18-22", "n": "", "vs": [[18, "والآن، إذ حررتم من الخطيئة، صرتم عبيدا للبر."], [19, "أتكلم بشريا هنا بسبب ضعفكم البشري. فكما قدمتم سابقا أعضاءكم عبيدا للنجاسة والإثم في خدمة الإثم، كذلك قدموا الآن أعضاءكم عبيدا للبر في خدمة القداسة."], [20, "فإنكم، لما كنتم عبيدا للخطيئة، كنتم أحرارا من البر."], [21, "ولكن أي ثمر أنتجتم حينذاك من الأمور التي تخجلون بها الآن، وما عاقبتها إلا الموت؟"], [22, "أما الآن، وقد حررتم من الخطيئة وصرتم عبيدا لله، فإن لكم ثمركم للقداسة، والعاقبة هي الحياة الأبدية."]]}], "kwAr": "إلى الحرية قد دعيتم", "noteAr": ""}, {"kw": "only", "raw": "1Co_8:9; 1Pe_2:16; 2Pe_2:19; Jud_1:4, Jud_1:10-12", "note": "", "refs": [{"l": "1Co 8:9", "n": "", "vs": [[9, "ولكن خذوا حذركم لكي لا يكون حقكم هذا فخا يسقط فيه الضعفاء."]]}, {"l": "1Pe 2:16", "n": "", "vs": [[16, "تصرفوا كأحرار حقا، لا كالذين يتخذون من الحرية ستارا لارتكاب الشر بل باعتبار أنكم عبيد لله."]]}, {"l": "2Pe 2:19", "n": "", "vs": [[19, "يعدون هؤلاء بالحرية، وهم أنفسهم عبيد للفساد! لأن الإنسان يصير عبدا لكل ما يتسلط عليه ويغلبه."]]}, {"l": "Jud 1:4", "n": "", "vs": [[4, "لأنه قد تسلل إلى ما بينكم معلمون لابد أن يلاقوا الحكم بالعقاب الأبدي، كما هو مكتوب لهم منذ القديم. فهم أشرار لا يهابون الله ، يتخذون من نعمة إلهنا فرصة لإباحة الرذائل، وينكرون سيدنا وربنا الوحيد يسوع المسيح."]]}, {"l": "Jud 1:10-12", "n": "", "vs": [[10, "ولكن هؤلاء المعلمين يتكلمون كلاما مهينا على أمور لا يعرفونها. وأما ما يفهمونه بالغريزة، كالحيوانات غير العاقلة، فإنهم به يدمرون أنفسهم."], [11, "الويل لهم! لأنهم سلكوا طريق قايين، واندفعوا إلى ارتكاب خطيئة بلعام طلبا للمال، وتمردوا كما تمرد قورح، فدمروا أنفسهم."], [12, "إنهم يشتركون معكم في ولائم المحبة دون خجل، ولكنهم كصخور تعيقكم. لا هم لهم سوى تعليف أنفسهم! إنهم يشبهون غيوما بلا مطر تسوقها الرياح، وأشجارا خريفية بلا ثمر، يقتلعها أصحابها، فتكون قد ماتت مرتين."]]}], "kwAr": "لا تتخذوا من الحرية ذريعة", "noteAr": ""}, {"kw": "but", "raw": "Gal_5:14, Gal_5:22, Gal_6:2; Mar_10:43-45; Joh_13:14, Joh_13:15; Act_20:35; Rom_15:1, Rom_15:2; 1Co_9:19; 1Co_13:4-7; 2Co_4:5, 2Co_12:15; 1Th_1:3; Jam_2:15-17; 1Jo_3:16-19", "note": "", "refs": [{"l": "Gal 5:14", "n": "", "vs": [[14, "فإن الشريعة كلها تتم في وصية واحدة: «أن تحب قريبك كنفسك»."]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Gal 6:2", "n": "", "vs": [[2, "ليحمل الواحد منكم أثقال الآخر، وهكذا تتممون شريعة المسيح."]]}, {"l": "Mar 10:43-45", "n": "", "vs": [[43, "وأما أنتم فلا يكن ذلك بينكم، وإنما أي من أراد أن يصير عظيما بينكم، فليكن لكم خادما،"], [44, "وأي من أراد أن يصير أولا فيكم، فليكن للجميع عبدا."], [45, "فحتى ابن الإنسان قد جاء لا ليخدم، بل ليخدم ويبذل نفسه فدية عن كثيرين»."]]}, {"l": "Joh 13:14", "n": "", "vs": [[14, "فإن كنت، وأنا السيد والمعلم، قد غسلت أقدامكم، فعليكم أنتم أيضا أن يغسل بعضكم أقدام بعض."]]}, {"l": "Joh 13:15", "n": "", "vs": [[15, "فقد قدمت لكم مثالا لكي تعملوا مثل ما عملت أنا لكم."]]}, {"l": "Act 20:35", "n": "", "vs": [[35, "وقد أظهرت لكم بوضوح كيف يجب أن نبذل الجهد لنساعد المحتاجين، متذكرين كلمات الرب يسوع، إذ قال: الغبطة في العطاء أكثر مما في الأخذ!»"]]}, {"l": "Rom 15:1", "n": "", "vs": [[1, "ولكن علينا نحن الأقوياء (في الإيمان)، أن نحتمل ضعف الضعفاء (فيه)، وأن لا نرضي أنفسنا."]]}, {"l": "Rom 15:2", "n": "", "vs": [[2, "فليسع كل واحد منا لإرضاء قريبه من جهة ما هو صالح، في سبيل البنيان."]]}, {"l": "1Co 9:19", "n": "", "vs": [[19, "فمع أني حر من الجميع، جعلت نفسي عبدا للجميع، لأكسب أكبر عدد ممكن منهم."]]}, {"l": "1Co 13:4-7", "n": "", "vs": [[4, "المحبة تصبر طويلا؛ وهي لطيفة. المحبة لا تحسد. المحبة لا تتفاخر ولا تتكبر."], [5, "لا تتصرف بغير لياقة، ولا تسعى إلى مصلحتها الخاصة. لا تستفز سريعا، ولا تنسب الشر لأحد."], [6, "لا تفرح بالظلم، بل تفرح بالحق."], [7, "إنها تستر كل شيء، وتصدق كل شيء، وترجو كل شيء، وتتحمل كل شيء."]]}, {"l": "2Co 4:5", "n": "", "vs": [[5, "فإننا لا نبشر بأنفسنا، بل بالمسيح يسوع ربا، وما نحن إلا عبيد لكم من أجل يسوع."]]}, {"l": "2Co 12:15", "n": "", "vs": [[15, "وأنا، بكل سرور، أنفق ما عندي، بل أنفق نفسي لأجل أنفسكم، وإن كنت كلما زادت محبتي ألقى حبا أقل."]]}, {"l": "1Th 1:3", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"]]}, {"l": "Jam 2:15-17", "n": "", "vs": [[15, "لنفرض أن أخا أو أختا كانا بحاجة شديدة إلى الثياب والطعام اليومي،"], [16, "وقال لهما أحدكم: «أتمنى لكما كل خير. البسا ثيابا دافئة، وكلا طعاما جيدا!» دون أن يقدم لهما ما يحتاجان إليه من ثياب وطعام، فأي نفع في ذلك؟"], [17, "هكذا نرى أن الإيمان وحده ميت ما لم تنتج عنه أعمال."]]}, {"l": "1Jo 3:16-19", "n": "", "vs": [[16, "ومقياس المحبة هو العمل الذي قام به المسيح إذ بذل حياته لأجلنا. فعلينا نحن أيضا أن نبذل حياتنا لأجل إخوتنا."], [17, "وأما الذي يملك مالا يمكنه من العيش في بحبوحة، ويقسي قلبه على أحد الإخوة المحتاجين، فكيف تكون محبة الله متأصلة فيه؟"], [18, "أيها الأولاد الصغار، لا يجب أن تكون محبتنا مجرد ادعاء بالكلام واللسان، بل تكون محبة عملية حقة."], [19, "عندئذ نتأكد أننا نتصرف بحسب الحق، وتطمئن نفوسنا في حضرة الله،"]]}], "kwAr": "بل بالمحبة كونوا عبيدا", "noteAr": ""}], "arS": [["فإنما إلى ", []], ["الحرية", ["G1657"]], [" قد ", []], ["دعيتم", ["G2564"]], ["، أيها ", []], ["الإخوة", ["G80"]], ["؛ ولكن لا تتخذوا من ", []], ["الحرية", ["G1657"]], [" ", []], ["ذريعة", ["G874"]], [" لإرضاء ", []], ["الجسد", ["G4561"]], ["، بل ", []], ["بالمحبة", ["G26"]], [" كونوا ", []], ["عبيدا", ["G1398"]], [" في خدمة ", []], ["أحدكم الآخر", ["G240"]], [".", []]]}, {"c": 5, "v": 14, "text": "فإن الشريعة كلها تتم في وصية واحدة: «أن تحب قريبك كنفسك».", "groups": [{"kw": "all", "raw": "Mat_7:12, Mat_19:18, Mat_19:19, Mat_22:39, Mat_22:40; Rom_13:8-10; Jam_2:8-11", "note": "", "refs": [{"l": "Mat 7:12", "n": "", "vs": [[12, "إذن، كل ما تريدون أن يعاملكم الناس به، فعاملوهم أنتم به أيضا: هذه خلاصة تعليم الشريعة والأنبياء."]]}, {"l": "Mat 19:18", "n": "", "vs": [[18, "فسأل: «أية وصايا؟» أجابه يسوع: «لا تقتل؛ لا تزن؛ لا تسرق؛ لا تشهد بالزور؛"]]}, {"l": "Mat 19:19", "n": "", "vs": [[19, "أكرم أباك وأمك؛ وأحب قريبك كنفسك...»"]]}, {"l": "Mat 22:39", "n": "", "vs": [[39, "والثانية مثلها: أحب قريبك كنفسك!"]]}, {"l": "Mat 22:40", "n": "", "vs": [[40, "بهاتين الوصيتين تتعلق الشريعة وكتب الأنبياء! »"]]}, {"l": "Rom 13:8-10", "n": "", "vs": [[8, "لا تكونوا في دين لأحد، إلا بأن يحب بعضكم بعضا. فإن من يحب غيره، يكون قد تمم الشريعة،"], [9, "لأن الوصايا «لا تزن، لا تقتل، لا تسرق، لا تشهد زورا، لا تشته....» وباقي الوصايا، تتلخص في هذه الكلمة: «أحب قريبك كنفسك!»"], [10, "فالمحبة لا تعمل سوءا للقريب. وهكذا تكون المحبة إتماما للشريعة كلها."]]}, {"l": "Jam 2:8-11", "n": "", "vs": [[8, "ما أحسن عملكم حين تطبقون تلك القاعدة الملوكية الواردة في الكتاب: «تحب قريبك كما تحب نفسك!»"], [9, "ولكن عندما تعاملون الناس بالانحياز والتمييز، ترتكبون خطيئة وتحكم عليكم الشريعة باعتباركم مخالفين لها."], [10, "فأنتم تعرفون أن من يطيع جميع الوصايا الواردة في شريعة موسى، ويخالف واحدة منها فقط، يصير مذنبا، تماما كالذي يخالف الوصايا كلها."], [11, "فإن الله ، مثلا، قال: «لا تزن» كما قال: «لا تقتل!» فإن لم تزن، ولكن قتلت، فقد خرقت الشريعة."]]}], "kwAr": "الشريعة كلها تتم في وصية واحدة", "noteAr": ""}, {"kw": "Thou", "raw": "Lev_19:18, Lev_19:34; Mar_12:31, Mar_12:33; Luk_10:27-37; 1Ti_1:5", "note": "", "refs": [{"l": "Lev 19:18", "n": "", "vs": [[18, "لا تنتقم ولا تحقد على أحد أبناء شعبك، ولكن تحب قريبك كما تحب نفسك، فأنا الرب."]]}, {"l": "Lev 19:34", "n": "", "vs": [[34, "وليكن لكم الغريب المقيم عندكم كالمواطن. تحبه كما تحب نفسك، لأنكم كنتم غرباء في أرض مصر. فأنا الرب."]]}, {"l": "Mar 12:31", "n": "", "vs": [[31, "وهناك ثانية مثلها، وهي أن تحب قريبك كنفسك. فما من وصية أخرى أعظم من هاتين»."]]}, {"l": "Mar 12:33", "n": "", "vs": [[33, "ومحبته بكل القلب وبكل الفهم وبكل القوة، ومحبة القريب كالنفس، أفضل من جميع المحرقات والذبائح!»"]]}, {"l": "Luk 10:27-37", "n": "", "vs": [[27, "فأجاب: «أحب الرب إلهك بكل قلبك وكل نفسك وكل قدرتك وكل فكرك، وأحب قريبك كنفسك»."], [28, "فقال له: «جوابك صحيح. فإن عملت بهذا، تحيا!»"], [29, "لكنه إذ كان راغبا في تبرير نفسه، سأل يسوع: «ومن هو قريبي؟»"], [30, "فرد عليه يسوع قائلا:"], [31, "وحدث أن كاهنا كان نازلا في تلك الطريق، فرآه ولكنه جاوزه إلى الجانب الآخر."], [32, "وكذلك مر أيضا واحد من اللاويين، فلما وصل إلى ذلك المكان، نظر إليه، ولكنه جاوزه إلى الجانب الآخر."], [33, "إلا أن سامريا مسافرا جاء إليه، ولما رآه، أخذته الشفقة عليه،"], [34, "فتقدم إليه وربط جراحه بعدما صب عليها زيتا وخمرا. ثم أركبه على دابته وأوصله إلى الخان واعتنى به."], [35, "وعند مغادرته الخان في اليوم التالي، أخرج دينارين ودفعهما إلى صاحب الخان، وقال له: اعتن به! ومهما تنفق أكثر، فإني أفيك ذلك عند رجوعي."], [36, "فأي هؤلاء الثلاثة يبدو لك قريبا للذي وقع بأيدي اللصوص؟»"], [37, "فأجاب: «إنه الذي عامله بالرحمة!» فقال له يسوع: «اذهب، واعمل أنت هكذا! »"]]}, {"l": "1Ti 1:5", "n": "", "vs": [[5, "أما الغاية مما أوصيتك به، فهي المحبة النابعة من قلب طاهر وضمير صالح وإيمان خال من الرياء."]]}], "kwAr": "أن تحب قريبك كنفسك", "noteAr": ""}], "arS": [["فإن ", []], ["الشريعة", ["G3551"]], [" ", []], ["كلها", ["G3956"]], [" ", []], ["تتم", ["G4137"]], [" في وصية ", []], ["واحدة", ["G1520"]], [": «أن ", []], ["تحب", ["G25"]], [" ", []], ["قريبك", ["G4139"]], [" ", []], ["كنفسك", ["G1438"]], ["».", []]]}, {"c": 5, "v": 15, "text": "فإذا كنتم تنهشون وتفترسون بعضكم بعضا، فاحذروا أن يفني أحدكم الآخر!", "groups": [{"kw": "", "raw": "Gal_5:26; 2Sa_2:26, 2Sa_2:27; Isa_9:20,Isa_9:21, Isa_11:5-9, Isa_11:13; 1Co_3:3, 1Co_6:6-8; 2Co_11:20; 2Co_12:20; Jam_3:14-18, Jam_4:1-3", "note": "", "refs": [{"l": "Gal 5:26", "n": "", "vs": [[26, "لا نكن طامحين إلى المجد الباطل، يستفز بعضنا بعضا، ويحسد أحدنا الآخر!"]]}, {"l": "2Sa 2:26", "n": "", "vs": [[26, "فنادى أبنير يوآب قائلا: «أينبغي للسيف أن يظل ينهش إلى الأبد؟ .. ألم تعلم أن عاقبة القتال هي مرارة؟ فإلى متى لا تأمر جيشك بالارتداد عن إخوتهم؟»"]]}, {"l": "2Sa 2:27", "n": "", "vs": [[27, "فقال يوآب: «حي هو الله فإنه لو لم تتكلم لتعقب رجالي في الصباح إخوتهم»."]]}, {"l": "Isa 9:20", "n": "", "vs": [[20, "يلتهمون ذات اليمين ولكن يظلون جياعا، ويفترسون ذات الشمال ولا يشبعون. كل واحد منهم يأكل لحم أخيه."]]}, {"l": "Isa 9:21", "n": "", "vs": [[21, "منسى ضد أفرايم، وأفرايم ضد منسى، ولكنهما يتحدان ضد يهوذا. من أجل ذلك كله لم يرتد غضبه، وما برحت يده ممدودة للعقاب!"]]}, {"l": "Isa 11:5-9", "n": "", "vs": [[5, "لأنه سيرتدي البر ويتمنطق بالأمانة."], [6, "فيسكن الذئب مع الحمل، ويربض النمر إلى جوار الجدي، ويتآلف العجل والأسد وكل حيوان معلوف معا، ويسوقها جميعا صبي صغير."], [7, "ترعى البقرة والدب معا، ويربض أولادهما متجاورين، ويأكل الأسد التبن كالثور،"], [8, "ويلعب الرضيع في (أمان) عند جحر الصل، ويمد الفطيم يده إلى وكر الأفعى (فلا يصيبه سوء)."], [9, "لا يؤذون ولا يسيئون في كل جبل قدسي، لأن الأرض تمتليء من معرفة الرب كما تغمر المياه البحر."]]}, {"l": "Isa 11:13", "n": "", "vs": [[13, "فيتلاشى حسد أفرايم، وتزول عداوة يهوذا، فلا أفرايم يحسد يهوذا، ولا يهوذا يعادي أفرايم،"]]}, {"l": "1Co 3:3", "n": "", "vs": [[3, "فإنكم مازلتم جسديين. فمادام بينكم حسد وخصام (وانقسام)، أفلا تكونون جسديين وتسلكون وفقا للبشر؟"]]}, {"l": "1Co 6:6-8", "n": "", "vs": [[6, "غير أن الأخ يقاضي أخاه، وذلك لدى غير المؤمنين."], [7, "والواقع أنه من العيب على الإطلاق أن يقاضي بعضكم بعضا. أما كان أحر ى بكم أن تحتملوا الظلم وأحرى بكم أن تتقبلوا السلب؟"], [8, "ولكنكم أنتم تظلمون وتسلبون حتى إخوتكم."]]}, {"l": "2Co 11:20", "n": "", "vs": [[20, "فإنكم تحتملون كل من يستعبدكم، ويفترسكم، ويستغلكم، ويتكبر عليكم، ويلطمكم على وجوهكم."]]}, {"l": "2Co 12:20", "n": "", "vs": [[20, "فإني أخشى أن آتي إليكم فأجدكم في حالة لا أريدها وتجدوني في حالة لا تريدونها! أي أن يكون بينكم كثير من النزاع والحسد والحقد والتحزب والتجريح والنميمة والتكبر والبلبلة."]]}, {"l": "Jam 3:14-18", "n": "", "vs": [[14, "أما إن كانت قلوبكم مملوءة بمرارة الحسد وبالتحزب، فلا تفتخروا بحكمتكم، ولا تنكروا الحق."], [15, "إن هذه الحكمة التي تدعونها ليست نازلة من عند الله، بل هي «حكمة» أرضية بشرية شيطانية."], [16, "فحيث تكون مرارة الحسد والتحزب، ينتشر الخلاف والفوضى وجميع الشرور."], [17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."], [18, "والبر هو ثمر ة ما يزرعه في سلام صانعو السلام."]]}, {"l": "Jam 4:1-3", "n": "", "vs": [[1, "من أين النزاع والخصام بينكم؟ أليس من لذاتكم تلك المتصارعة في أعضائكم؟"], [2, "فأنتم ترغبون في امتلاك ما لا يخصكم، لكن ذلك لا يتحقق لكم، فتقتلون، وتحسدون، ولا تتمكنون من بلوغ غايتكم. وهكذا تتخاصمون وتتصارعون! إنكم لا تمتلكون ما تريدونه، لأنكم لا تطلبونه من الله."], [3, "وإذا طلبتم منه شيئا، فإنكم لا تحصلون عليه: لأنكم تطلبون بدافع شرير، إذ تنوون أن تستهلكوا ما تنالونه لإشباع شهواتكم فقط."]]}], "kwAr": "", "noteAr": ""}], "arS": [["فإذا كنتم ", []], ["تنهشون", ["G1143"]], [" ", []], ["وتفترسون", ["G2719"]], [" ", []], ["بعضكم بعضا", ["G240"]], ["، ", []], ["فاحذروا", ["G991"]], [" أن ", []], ["يفني", ["G355"]], [" ", []], ["أحدكم الآخر", ["G240"]], ["!", []]]}, {"c": 5, "v": 16, "text": "إنما أقول: اسلكوا في الروح. وعندئذ لا تتممون شهوة الجسد أبدا.", "groups": [{"kw": "I say", "raw": "Gal_3:17; 1Co_7:29", "note": "", "refs": [{"l": "Gal 3:17", "n": "", "vs": [[17, "فما أقوله هو هذا: إن عهدا سبق أن أقره الله لا تنقضه الشريعة التي جاءت بعده بأربع مئة وثلاثين سنة، وكأنها تلغي الوعد."]]}, {"l": "1Co 7:29", "n": "", "vs": [[29, "فإني، أيها الإخوة، أقول لكم إن الوقت يتقاصر. ففي ما يخص المسائل الأخرى، ليكن الذين لهم زوجات كأنهم بلا زوجات،"]]}], "kwAr": "إنما أقول", "noteAr": ""}, {"kw": "Walk", "raw": "Gal_5:25, Gal_6:8; Rom_8:1, Rom_8:4, Rom_8:5, Rom_8:12-14; 1Pe_1:22, 1Pe_4:6; Jud_1:19-21", "note": "", "refs": [{"l": "Gal 5:25", "n": "", "vs": [[25, "إذا كنا نحيا بالروح، فلنسلك أيضا بالروح."]]}, {"l": "Gal 6:8", "n": "", "vs": [[8, "فإن من يزرع لجسده، فمن الجسد يحصد فسادا. ومن يزرع للروح، فمن الروح يحصد حياة أبدية. فلا نفشل في عمل الخير،"]]}, {"l": "Rom 8:1", "n": "", "vs": [[1, "فالآن إذا ليس على الذين في المسيح يسوع أية دينونة بعد."]]}, {"l": "Rom 8:4", "n": "", "vs": [[4, "حتى يتم فينا البر الذي تسعى إليه الشريعة، فينا نحن السالكين لا بحسب الجسد بل بحسب الروح."]]}, {"l": "Rom 8:5", "n": "", "vs": [[5, "فإن الذين هم بحسب الجسد يهتمون بأمور الجسد، والذين هم بحسب الروح يهتمون بأمور الروح."]]}, {"l": "Rom 8:12-14", "n": "", "vs": [[12, "فليس علينا إذن، أيها الإخوة، أي التزام نحو الجسد لنعيش بحسب الجسد."], [13, "لأنه إن عشتم بحسب الجسد، فإنكم ستموتون، ولكن إن كنتم بالروح تميتون أعمال الجسد، فستحيون."], [14, "فإن جميع الخاضعين لقيادة روح الله، هم أبناء لله."]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}, {"l": "1Pe 4:6", "n": "", "vs": [[6, "ولهذا أبلغت البشارة إلى الأموات أيضا لكي يكونوا دائما أحياء بالروح في نظر الله، مع أن حكم الموت قد نفذ بأجسادهم، فماتوا كغيرهم من الناس."]]}, {"l": "Jud 1:19-21", "n": "", "vs": [[19, "هؤلاء هم الذين يسببون الانشقاق، وينساقون وراء غرائزهم الحيوانية، وليس الروح القدس فيهم!"], [20, "وأما أنتم أيها الأحباء، فابنوا أنفسكم على إيمانكم الأقدس، وصلوا دائما في الروح القدس."], [21, "واحفظوا أنفسكم في محبة الله، منتظرين رحمة ربنا يسوع المسيح إذ يعود ويأخذكم لتحيوا معه إلى الأبد."]]}], "kwAr": "اسلكوا في الروح", "noteAr": ""}, {"kw": "and", "raw": "Gal_5:19-21; Rom_6:12, Rom_13:13, Rom_13:14; 2Co_7:1; Eph_2:3; Col_2:11, Col_3:5-10; 1Pe_1:14, 1Pe_2:11, 1Pe_4:1-4; 1Jo_2:15, 1Jo_2:16", "note": "", "refs": [{"l": "Gal 5:19-21", "n": "", "vs": [[19, "أما أعمال الجسد فظاهرة، وهي: الزنى والنجاسة والدعارة،"], [20, "وعبادة الأصنام والسحر، والعداوة والنزاع والغيرة والغضب، والتحزب والانقسام والتعصب،"], [21, "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!"]]}, {"l": "Rom 6:12", "n": "", "vs": [[12, "إذن، لا تملكن الخطيئة في جسدكم المائت فتنقادوا لها في شهواته."]]}, {"l": "Rom 13:13", "n": "", "vs": [[13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."]]}, {"l": "Rom 13:14", "n": "", "vs": [[14, "وإنما البسوا الرب يسوع المسيح (تمثلوا به)، ولا تنشغلوا بالتدبير للجسد لقضاء شهواته."]]}, {"l": "2Co 7:1", "n": "", "vs": [[1, "فإذ نلنا هذه الوعود، أيها الأحباء، لنطهر أنفسنا من كل ما يدنس الجسد والروح، ونكمل القداسة في مخافة الله."]]}, {"l": "Eph 2:3", "n": "", "vs": [[3, "الذين بينهم نحن أيضا كنا نسلك سابقا في شهوات جسدنا، عاملين ما يريده الجسد والأفكار، وكنا بالطبيعة أولاد الغضب كالآخرين أيضا."]]}, {"l": "Col 2:11", "n": "", "vs": [[11, "وفيه أيضا ختنتم أنتم ختانا لم تجره الأيدي، إذ نزع عنكم جسد الخطايا البشري وهذا هو ختان المسيح:"]]}, {"l": "Col 3:5-10", "n": "", "vs": [[5, "فأميتوا إذن أعضاءكم الأرضية: الزنى، النجاسة، جموح العاطفة، الشهوة الرديئة، والاشتهاء النهم الذي هو عبادة أصنام."], [6, "فبسبب هذه الخطايا ينزل غضب الله،"], [7, "وفيها سلكتم في الماضي، حين كنتم تعيشون فيها."], [8, "وأما الآن، فانزعوا عنكم، أنتم أيضا، هذه الخطايا كلها: الغضب، النقمة، الخبث، التجديف، الكلام القبيح الخارج من أفواهكم."], [9, "لا يكذب أحدكم على الآخر، إذ قد نزعتم الإنسان العتيق وأعماله"], [10, "ولبستم الجديد الذي يتجدد لبلوغ تمام المعرفة وفقا لصورة خالقه،"]]}, {"l": "1Pe 1:14", "n": "", "vs": [[14, "وبما أنكم صرتم أولادا لله مطيعين له، فلا تعودوا إلى مجاراة الشهوات التي كانت تسيطر عليكم سابقا في أيام جهلكم."]]}, {"l": "1Pe 2:11", "n": "", "vs": [[11, "أيها الأحباء، ما أنتم إلا غرباء تزورون الأرض زيارة عابرة. لذلك أطلب إليكم أن تبتعدوا عن الشهوات الجسدية التي تصارع النفس."]]}, {"l": "1Pe 4:1-4", "n": "", "vs": [[1, "فبما أن المسيح قد تحمل الآلام الجسمية لأجلكم، سلحوا أنفسكم بالاستعداد دائما لتحمل الآلام. فإن من يتحمل الآلام الجسمية، يكون قد قاطع الخطيئة."], [2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."], [3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."], [4, "ورفاقكم في تلك العيشة سابقا يستغربون أنكم لا تركضون معهم إلى فيض هذه الخلاعة، ويجرحون سمعتكم."]]}, {"l": "1Jo 2:15", "n": "", "vs": [[15, "لا تحبوا العالم، ولا الأشياء التي في العالم. فالذي يحب العالم، لا تكون محبة الآب في قلبه."]]}, {"l": "1Jo 2:16", "n": "", "vs": [[16, "لأن كل ما في العالم، من شهوات الجسد وشهوات العين وترف المعيشة، ليس من الآب، بل من العالم."]]}], "kwAr": "وعندئذ", "noteAr": ""}, {"kw": "ye shall not fulfil", "raw": "or, fulfil not", "note": "or, fulfil not", "refs": [], "kwAr": "لا تتممون شهوة الجسد", "noteAr": "أو: لا تتمّموا (بصيغة النهي)."}], "arS": [["إنما ", []], ["أقول", ["G3004"]], [": ", []], ["اسلكوا", ["G4043"]], [" في ", []], ["الروح", ["G4151"]], [". وعندئذ لا ", []], ["تتممون", ["G5055"]], [" ", []], ["شهوة", ["G1939"]], [" ", []], ["الجسد", ["G4561"]], [" أبدا.", []]]}, {"c": 5, "v": 17, "text": "فإن الجسد يشتهي بعكس الروح، والروح بعكس الجسد؛ وهذان يقاوم أحدهما الآخر حتى إنكم لا تفعلون ما ترغبون فيه.", "groups": [{"kw": "the flesh", "raw": "Psa_19:12, Psa_19:13, Psa_51:1-5, Psa_51:10-12, Psa_65:3, Psa_119:5, Psa_119:20,Psa_119:24, Psa_119:25, Psa_119:32, Psa_119:35, Psa_119:40,Psa_119:133, Psa_119:159; Psa_119:176; Ecc_7:20; Isa_6:5; Mat_16:17, Mat_16:23, Mat_26:41; Joh_3:6; Rom_7:18, Rom_7:21-25, Rom_8:5, Rom_8:6, Rom_8:13; Jam_4:5, Jam_4:6", "note": "", "refs": [{"l": "Psa 19:12", "n": "", "vs": [[12, "من يتنبه إلى سهواته؟ من الخطايا الخفية خلصني،"]]}, {"l": "Psa 19:13", "n": "", "vs": [[13, "ومن الكبائر أيضا احفظ عبدك، ولا تدعها تتسلط علي. عندئذ أكون كاملا وأتبرأ من ذنب عظيم."]]}, {"l": "Psa 51:1-5", "n": "", "vs": [[1, "ارحمني ياالله حسب رحمتك، وامح معاصي حسب كثرة رأفتك."], [2, "اغسلني كليا من إثمي، وطهرني من خطيئتي."], [3, "فإ نني أقر بمعاصي، وخطيئتي ماثلة أمامي دائما."], [4, "إليك وحدك أخطأت، والشر قدام عينيك صنعت. لكي تتبرر إذا حكمت وتزكو إذا قضيت."], [5, "ها إني بالإثم قد ولدت وفي الخطيئة حبلت بي أمي."]]}, {"l": "Psa 51:10-12", "n": "", "vs": [[10, "قلبا نقيا اخلق في ياالله وروحا مستقيما جدد في داخلي."], [11, "لا تطردني من حضرتك، ولا تنزع مني روحك القدوس."], [12, "رد لي بهجتي بخلاصك، وبروح رضية آزرني"]]}, {"l": "Psa 65:3", "n": "", "vs": [[3, "قد غلبت الآثام علي. أنت وحدك تكفر عنها."]]}, {"l": "Psa 119:5", "n": "", "vs": [[5, "ليتك توجه طرقي لممارسة فرائضك."]]}, {"l": "Psa 119:20", "n": "", "vs": [[20, "تتلهف نفسي شوقا إلى أحكامك دائما."]]}, {"l": "Psa 119:24", "n": "", "vs": [[24, "وصاياك الشاهدة أيضا هي مسرتي، وأنا أستشيرها دائما."]]}, {"l": "Psa 119:25", "n": "", "vs": [[25, "(أنا يائس) أرقد ملتصقا بالتراب، فأحيني حسب وعدك."]]}, {"l": "Psa 119:32", "n": "", "vs": [[32, "أجد مسرعا في طريق وصاياك، لأنك تشرح قلبي."]]}, {"l": "Psa 119:35", "n": "", "vs": [[35, "اهدني في سبيل وصاياك، ففيها بهجتي."]]}, {"l": "Psa 119:40", "n": "", "vs": [[40, "ها قد رغبت في وصاياك. بعدلك أحيني."]]}, {"l": "Psa 119:133", "n": "", "vs": [[133, "ثبت خطواتي في كلمتك، ولا تدع أي إثم يتسلط علي."]]}, {"l": "Psa 119:159", "n": "", "vs": [[159, "انظر كيف أحببت وصاياك فأحيني يارب بمقتضى رحمتك."]]}, {"l": "Psa 119:176", "n": "", "vs": [[176, "تهت كخروف ضال. فابحث عن عبدك، فإني لم أنس وصاياك."]]}, {"l": "Ecc 7:20", "n": "", "vs": [[20, "ليس من صديق على وجه الأرض يصنع خيرا ولا يخطيء."]]}, {"l": "Isa 6:5", "n": "", "vs": [[5, "فقلت: «ويل لي لأني هلكت لأني إنسان نجس الشفتين، وأسكن وسط قوم دنسي الشفاه. فإن عيني قد أبصرتا الملك الرب القدير»."]]}, {"l": "Mat 16:17", "n": "", "vs": [[17, "فقال له يسوع: «طوبى لك ياسمعان بن يونا. فما أعلن لك هذا لحم ودم، بل أبي الذي في السماوات."]]}, {"l": "Mat 16:23", "n": "", "vs": [[23, "فالتفت يسوع إلى بطرس وقال له: «اغرب من أمامي ياشيطان! أنت عقبة أمامي، لأنك تفكر لا بأمور الله، بل بأمور الناس! »"]]}, {"l": "Mat 26:41", "n": "", "vs": [[41, "اسهروا وصلوا لكي لا تدخلوا في تجربة. إن الروح نشيط؛ أما الجسد فضعيف»."]]}, {"l": "Joh 3:6", "n": "", "vs": [[6, "فالمولود من الجسد هو جسد، والمولود من الروح هو روح."]]}, {"l": "Rom 7:18", "n": "", "vs": [[18, "لأنني أعلم أنه في، أي في جسدي، لا يسكن الصلاح: فأن أريد الصلاح ذلك متوفر لدي؛ وأما أن أفعله، فذلك لا أستطيعه."]]}, {"l": "Rom 7:21-25", "n": "", "vs": [[21, "إذن، أجد نفسي، أنا الذي يريد أن يعمل ما هو صالح، خاضعا لهذا الناموس:"], [22, "أن لدي الشر. فإنني، وفقا للإنسان الباطن في، أبتهج بشريعة الله."], [23, "ولكنني أرى في أعضائي ناموسا آخر يحارب الشريعة التي يريدها عقلي، ويجعلني أسيرا لناموس الخطيئة الكائن في أعضائي."], [24, "فيا لي من إنسان تعيس ! من يحررني من جسد الموت هذا؟"], [25, "أشكر الله بيسوع المسيح ربنا! إذن، أنا نفسي من حيث العقل، أخدم شريعة الله عبدا لها؛ ولكنني من حيث الجسد، أخدم ناموس الخطيئة عبدا له."]]}, {"l": "Rom 8:5", "n": "", "vs": [[5, "فإن الذين هم بحسب الجسد يهتمون بأمور الجسد، والذين هم بحسب الروح يهتمون بأمور الروح."]]}, {"l": "Rom 8:6", "n": "", "vs": [[6, "فاهتمام الجسد هو موت؛ وأما اهتمام الروح فهو حياة وسلام."]]}, {"l": "Rom 8:13", "n": "", "vs": [[13, "لأنه إن عشتم بحسب الجسد، فإنكم ستموتون، ولكن إن كنتم بالروح تميتون أعمال الجسد، فستحيون."]]}, {"l": "Jam 4:5", "n": "", "vs": [[5, "أتظنون أن الكتاب يتكلم عبثا! هل الروح الذي حل في داخلنا يغار عن حسد؟"]]}, {"l": "Jam 4:6", "n": "", "vs": [[6, "لا، بل إنه يجود علينا بنعمة أعظم. لذلك يقول الكتاب: «إن الله يقاوم المتكبرين، ولكنه يعطي المتواضعين نعمة»."]]}], "kwAr": "الجسد يشتهي بعكس الروح", "noteAr": ""}, {"kw": "and these", "raw": "Gal_3:21; Mat_12:30; Rom_7:7, Rom_7:8, Rom_7:10-14, Rom_8:5-8", "note": "", "refs": [{"l": "Gal 3:21", "n": "", "vs": [[21, "فهل تناقض الشريعة وعود الله؟ حاشا! فلو أعطيت شريعة قادرة أن تحيي، لكان البر بالحقيقة على مبدأ الشريعة."]]}, {"l": "Mat 12:30", "n": "", "vs": [[30, "من ليس معي، فهو ضدي؛ ومن لا يجمع معي، فهو يفرق."]]}, {"l": "Rom 7:7", "n": "", "vs": [[7, "إذن، ماذا نقول؟ هل الشريعة خطيئة؟ حاشا! ولكني ما عرفت الخطيئة إلا بالشريعة. فما كنت لأعرف الشهوة لولا قول الشريعة: «لا تشته!»"]]}, {"l": "Rom 7:8", "n": "", "vs": [[8, "ولكن الخطيئة استغلت هذه الوصية فأثارت في كل شهوة. فإن الخطيئة، لولا الشريعة، ميتة."]]}, {"l": "Rom 7:10-14", "n": "", "vs": [[10, "فمت أنا. والوصية الهادفة إلى الحياة، صارت لي مؤدية إلى الموت."], [11, "فإن الخطيئة، إذ استغلت الوصية، خدعتني وقتلتني بها."], [12, "فالشريعة إذن مقدسة، والوصية مقدسة وعادلة وصالحة."], [13, "فهل صار ما هو صالح موتا لي؟ حاشا! ولكن الخطيئة، لكي تظهر أنها خطيئة، أنتجت لي الموت بما هو صالح، حتى تصير الخطيئة خاطئة جدا بسبب الوصية."], [14, "فإننا نعلم أن الشريعة روحية؛ وأما أنا فجسدي بيع عبدا للخطيئة."]]}, {"l": "Rom 8:5-8", "n": "", "vs": [[5, "فإن الذين هم بحسب الجسد يهتمون بأمور الجسد، والذين هم بحسب الروح يهتمون بأمور الروح."], [6, "فاهتمام الجسد هو موت؛ وأما اهتمام الروح فهو حياة وسلام."], [7, "لأن اهتمام الجسد هو عداوة لله، إذ إنه لا يخضع لناموس الله، بل لا يستطيع ذلك."], [8, "فالذين هم تح
