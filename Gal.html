<script>window.CATALOG=[{"id": 17, "abbr": "Est", "en": "Esther", "nc": 10, "nv": 167, "refs": 1266, "last": "10:3", "first": "وحدث في أيام أحشويروش، الذي امتد حكمه من الهند إلى كوش، فملك على مئة وسبعة وعشرين إقليما،"}, {"id": 18, "abbr": "Job", "en": "Job", "nc": 42, "nv": 1070, "refs": 10209, "last": "42:17", "first": "عاش في أرض عوص رجل اسمه أيوب، كان صالحا كاملا يتقي الله ويحيد عن الشر."}, {"id": 19, "abbr": "Psa", "en": "Psalms", "nc": 150, "nv": 2461, "refs": 33395, "last": "150:6", "first": "طوبى للإنسان الذي لا يتبع مشورة الأشرار، ولا يقف في طريق الخاطئين، ولا يجالس المستهزئين."}, {"id": 20, "abbr": "Pro", "en": "Proverbs", "nc": 31, "nv": 915, "refs": 10457, "last": "31:31", "first": "هذه هي أمثال سليمان بن داود ملك إسرائيل،"}, {"id": 21, "abbr": "Ecc", "en": "Ecclesiastes", "nc": 12, "nv": 222, "refs": 3186, "last": "12:14", "first": "هذه أقوال الجامعة ابن داود ملك أورشليم."}, {"id": 22, "abbr": "Son", "en": "Song of Solomon", "nc": 8, "nv": 117, "refs": 1802, "last": "8:14", "first": "هذا نشيد الأناشيد لسليمان."}, {"id": 23, "abbr": "Isa", "en": "Isaiah", "nc": 66, "nv": 1292, "refs": 21959, "last": "66:24", "first": "هذه هي رؤيا إشعياء بن آموص، التي أعلنت له بشأن يهوذا وأورشليم في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا."}, {"id": 24, "abbr": "Jer", "en": "Jeremiah", "nc": 52, "nv": 1364, "refs": 20659, "last": "52:34", "first": "هذه نبوءة إرميا بن حلقيا أحد الكهنة المقيمين في عناثوث بأرض سبط بنيامين."}, {"id": 25, "abbr": "Lam", "en": "Lamentations", "nc": 5, "nv": 154, "refs": 2238, "last": "5:22", "first": "كيف أصبحت المدينة الآهلة بالسكان مهجورة وحيدة؟ صارت كأرملة! هذه التي كانت عظيمة بين الأمم. السيدة بين المدن صارت تحت الجزية!"}, {"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 48, "nv": 1273, "refs": 15264, "last": "48:35", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 48, "abbr": "Gal", "en": "Galatians", "verses": [{"c": 1, "v": 1, "text": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،", "groups": [{"kw": "an", "raw": "Rom_1:1; 1Co_1:1", "note": "", "refs": [{"l": "Rom 1:1", "n": "", "vs": [[1, "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"]]}, {"l": "1Co 1:1", "n": "", "vs": [[1, "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"]]}], "kwAr": "رسول", "noteAr": ""}, {"kw": "not", "raw": "Gal_1:11, Gal_1:12, Gal_1:17", "note": "", "refs": [{"l": "Gal 1:11", "n": "", "vs": [[11, "وأعلمكم، أيها الإخوة، أن الإنجيل الذي بشرتكم به ليس إنجيلا بشريا."]]}, {"l": "Gal 1:12", "n": "", "vs": [[12, "فلا أنا تسلمته من إنسان، ولا تلقنته، بل جاءني بإعلان من يسوع المسيح."]]}, {"l": "Gal 1:17", "n": "", "vs": [[17, "ولا صعدت إلى أورشليم لأقابل الذين كانوا رسلا من قبلي، بل انطلقت إلى بلاد العرب، وبعد ذلك رجعت إلى دمشق."]]}], "kwAr": "لا من قبل الناس", "noteAr": ""}, {"kw": "neither", "raw": "Act_1:16-26, Act_13:2-4", "note": "", "refs": [{"l": "Act 1:16-26", "n": "", "vs": [[16, "«أيها الإخوة، كان لابد من أن تتم النبوءة التي قالها الروح القدس بلسان النبي داود، عن يهوذا الذي انقلب دليلا للذين قبضوا على يسوع."], [17, "وكان يهوذا يعتبر واحدا منا، وقد شاركنا في خدمتنا."], [18, "ثم إنه اشترى حقلا بالمال الذي تقاضاه ثمنا للخيانة، وفيه وقع على وجهه، فانشق من وسطه واندلقت أمعاؤه كلها."], [19, "وعلم أهل أورشليم جميعا بهذه الحادثة، فأطلقوا على حقله اسم ¢حقل دمخ¢ بلغتهم، أي حقل الدم."], [20, "فتمت النبوءة الواردة في كتاب المزامير: لتصر داره خرابا، ولا يسكنها ساكن. وأيضا: ليستلم وظيفته آخر!"], [21, "فعلينا إذن أن نختار واحدا من الرجال الذين رافقونا طوال المدة التي قضاها الرب يسوع معنا،"], [22, "منذ أن عمده يوحنا إلى يوم ارتفاعه عنا إلى السماء، ليكون معنا شاهدا بقيامة يسوع»."], [23, "فرشح الحاضرون رجلين هما: يوسف الذي يدعى بارسابا ويلقب بيستس، ومتياس."], [24, "ثم صلوا قائلين: «أيها الرب العارف قلوب الناس جميعا، بين لنا أي هذين الرجلين تختار"], [25, "ليشاركنا في الخدمة والرسالة بدلا من يهوذا الذي ذهب إلى المكان الذي يستحقه»."], [26, "ثم ألقوا القرعة، فوقعت على متياس، فضموه إلى الرسل الأحد عشر ."]]}, {"l": "Act 13:2-4", "n": "", "vs": [[2, "وذات يوم، وهم صائمون يتعبدون للرب، قال لهم الروح القدس: «خصصوا لي برنابا وشاول لأجل العمل الذي دعوتهما إليه»."], [3, "فبعدما صاموا وصلوا ووضعوا عليهما أيديهم أطلقوهما."], [4, "وإذ أرسل الروح القدس برنابا وشاول، توجها إلى ميناء سلوكية، وسافرا بحرا باتجاه قبرص."]]}], "kwAr": "ولا بسلطة إنسان", "noteAr": ""}, {"kw": "but", "raw": "Act_9:6, Act_9:15, Act_9:16, Act_22:10,Act_22:14-21, Act_26:16-18; Rom_1:4, Rom_1:5; 2Co_3:1-3; Eph_3:8; 1Ti_1:11-14; 2Ti_1:1; Tit_1:3", "note": "", "refs": [{"l": "Act 9:6", "n": "", "vs": [[6, "فقال وهو مرتعد ومتحير؛ «يارب ماذا تريد أن أفعل؟» فقال له الرب: «قم، وادخل المدينة فيقال لك ما يجب أن تفعله»."]]}, {"l": "Act 9:15", "n": "", "vs": [[15, "فأمره الرب: «اذهب! فقد اخترت هذا الرجل ليكون إناء يحمل اسمي إلى الأمم والملوك وبني إسرائيل."]]}, {"l": "Act 9:16", "n": "", "vs": [[16, "وسأريه كم ينبغي أن يتألم من أجل اسمي!»"]]}, {"l": "Act 22:10", "n": "", "vs": [[10, "فسألت: ماذا أفعل يارب؟ فأجابني الرب: قم وادخل دمشق، وهناك يقال لك ما يجب عليك أن تفعله."]]}, {"l": "Act 22:14-21", "n": "", "vs": [[14, "فقال: إله آبائنا اختارك مسبقا لتعرف إرادته، وترى البار وتسمع صوتا من فمه."], [15, "فإنك ستكون شاهدا له، أمام جميع الناس، بما رأيت وسمعت."], [16, "والآن لماذا تبطيء؟ قم تعمد واغتسل من خطايا ك، داعيا باسم الرب."], [17, "بعد ذلك رجعت إلى أورشليم. وبينما كنت أصلي في الهيكل غبت عن الوعي،"], [18, "فرأيت الرب يقول لي: عجل واترك أورشليم بسرعة، لأن أهلها يرفضون أن تشهد لي فيها."], [19, "فقلت: يارب، إنهم يعرفون أني كنت أبحث في المجامع عن المؤمنين بك، لأسجنهم وأجلدهم."], [20, "وكنت حاضرا عندما قتل شهيدك استفانوس، وكنت راضيا بقتله، وحارسا لثياب قاتليه."], [21, "ولكنه قال لي: اذهب ... سأرسلك بعيدا: إلى الأمم!»"]]}, {"l": "Act 26:16-18", "n": "", "vs": [[16, "انهض وقف على قدميك، فقد ظهرت لك لأعينك خادما لي وشاهدا بهذه الرؤيا التي تراني فيها الآن، وبالرؤى التي ستراني فيها بعد اليوم."], [17, "وسأنقذك من شعبك ومن الأمم التي أرسلك إليها الآن،"], [18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "Rom 1:4", "n": "", "vs": [[4, "ومن ناحية روح القداسة، تبين بقوة أنه ابن الله بالقيامة من بين الأموات. إنه يسوع المسيح ربنا"]]}, {"l": "Rom 1:5", "n": "", "vs": [[5, "الذي به ولأجل اسمه نلنا نعمة ورسالة لإطاعة الإيمان بين جميع الأمم،"]]}, {"l": "2Co 3:1-3", "n": "", "vs": [[1, "ترى، هل نبتديء نمدح أنفسنا من جديد؟ أم ترانا نحتاج كبعضهم إلى رسائل توصية نحملها إليكم أو منكم؟"], [2, "فأنتم الرسالة التي توصي بنا، وقد كتبت في قلوبنا، حيث يستطيع جميع الناس أن يعرفوها ويقرأوها."], [3, "وهكذا يتبين أنكم رسالة من المسيح خدمناها نحن، وقد كتبت لا بحبر بل بروح الله الحي، ولا في ألواح حجرية بل في ألواح القلب البشرية."]]}, {"l": "Eph 3:8", "n": "", "vs": [[8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "1Ti 1:11-14", "n": "", "vs": [[11, "الموافق لإنجيل مجد الله المبارك، ذلك الإنجيل الذي وضع أمانة بين يدي."], [12, "وكم أشكر المسيح يسوع ربنا الذي أعطاني القدرة وعينني خادما له، إذ اعتبرني جديرا بثقته،"], [13, "مع أني كنت في الماضي مجدفا عليه، ومضطهدا ومهينا له! ولكني عوملت بالرحمة، لأني عملت ما عملته عن جهل وفي عدم إيمان."], [14, "إلا أن نعمة ربنا قد فاضت علي فوق كل حد، ومعها الإيمان والمحبة، وذلك في المسيح يسوع."]]}, {"l": "2Ti 1:1", "n": "", "vs": [[1, "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"]]}, {"l": "Tit 1:3", "n": "", "vs": [[3, "ثم بين كلمته في أوانها المعين: بالبشارة التي وضعت أمانة بين يدي بموجب أمر مخلصنا الله …"]]}], "kwAr": "بل بسلطة يسوع المسيح", "noteAr": ""}, {"kw": "and", "raw": "Mat_28:18-20; Joh_5:19, Joh_10:30, Joh_20:21", "note": "", "refs": [{"l": "Mat 28:18-20", "n": "", "vs": [[18, "فتقدم يسوع وكلمهم قائلا: «دفع إلي كل سلطان في السماء وعلى الأرض."], [19, "فاذهبوا إذن، وتلمذوا جميع الأمم، وعمدوهم باسم الآب والابن والروح القدس؛"], [20, "وعلموهم أن يعملوا بكل ما أوصيتكم به. وها أنا معكم كل الأيام إلى انتهاء الزمان! »."]]}, {"l": "Joh 5:19", "n": "", "vs": [[19, "فقال لهم يسوع: «الحق الحق أقول لكم إن الابن لا يقدر أن يفعل شيئا من تلقاء نفسه، بل يفعل ما يرى الآب يفعله. فكل ما يعمله الآب، يعمله الابن كذلك،"]]}, {"l": "Joh 10:30", "n": "", "vs": [[30, "أنا والآب واحد!»"]]}, {"l": "Joh 20:21", "n": "", "vs": [[21, "فقال لهم يسوع: «سلام لكم. كما أن الآب أرسلني، أرسلكم أنا»."]]}], "kwAr": "والله الآب", "noteAr": ""}, {"kw": "raised", "raw": "Act_2:24-32, Act_3:15; Rom_4:24, Rom_4:25, Rom_10:9, Rom_14:9; Eph_1:19, Eph_1:20; Heb_13:20; 1Pe_1:21; Rev_1:5, Rev_1:18, Rev_2:8", "note": "", "refs": [{"l": "Act 2:24-32", "n": "", "vs": [[24, "ولكن الله أقامه من بين الأموات ناقضا أوجاع الموت، فما كان يمكن للموت أن يبقيه في قبضته!"], [25, "فإن داود يقول فيه: كنت أرى الرب أمامي دائما فإنه عن يميني لئلا أتزعزع."], [26, "لذلك فرح قلبي وتهلل لساني. حتى إن جسدي سيرقد على رجاء."], [27, "لأنك لن تترك نفسي في هوة الأموات، ولن تدع وحيدك القدوس يرى فسادا،"], [28, "هديتني سبل الحياة، وستملأني سرورا برؤية وجهك!"], [29, "أيها الإخوة، دعوني أقول لكم صراحة إن أبانا داود مات ودفن، وقبره مازال عندنا حتى اليوم."], [30, "لأن داود كان نبيا، وعارفا أن الله أقسم له يمينا بأن يجيء المسيح من نسله ويجلس على عرشه،"], [31, "فقد تكلم عن قيامة المسيح كما رآها مسبقا، فقال إن نفسه لم تترك في هوة الأموات، ولم ينل من جسده الفساد."], [32, "فيسوع هذا أقامه الله من الموت، ونحن جميعا شهود لذلك."]]}, {"l": "Act 3:15", "n": "", "vs": [[15, "وقتلتم واهب الحياة. ولكن الله أقامه من بين الأموات ونحن شهود لذلك."]]}, {"l": "Rom 4:24", "n": "", "vs": [[24, "بل أيضا من أجلنا، نحن الذين سيحسب ذلك لنا إذ نؤمن بمن أقام من بين الأموات يسوع ربنا"]]}, {"l": "Rom 4:25", "n": "", "vs": [[25, "الذي أسلم للموت من أجل معاصينا ثم أقيم من أجل تبريرنا."]]}, {"l": "Rom 10:9", "n": "", "vs": [[9, "أنك إن اعترفت بفمك بيسوع ربا، وآمنت في قلبك بأن الله أقامه من الأموات، نلت الخلاص."]]}, {"l": "Rom 14:9", "n": "", "vs": [[9, "فإن المسيح مات وعاد حيا لأجل هذا: أن يكون سيدا على الأموات والأحياء."]]}, {"l": "Eph 1:19", "n": "", "vs": [[19, "وما هي عظمة قدرته الفائقة المعلنة لنا نحن المؤمنين، بحسب عمل اقتدار قوته"]]}, {"l": "Eph 1:20", "n": "", "vs": [[20, "الذي عمله في المسيح، بإقامته له من بين الأموات. وقد أجلسه عن يمينه في الأماكن السماوية،"]]}, {"l": "Heb 13:20", "n": "", "vs": [[20, "وأسأل الله ، إله السلام الذي أقام من بين الأموات ربنا يسوع راعي الخراف العظيم بفضل دمه الذي ختم به العهد الأبدي"]]}, {"l": "1Pe 1:21", "n": "", "vs": [[21, "أنتم الذين تؤمنون بالله بالمسيح الذي أقامه من الموت وأعطاه المجد، حتى يكون الله غاية إيمانكم ورجائكم."]]}, {"l": "Rev 1:5", "n": "", "vs": [[5, "ومن يسوع المسيح الشاهد الأمين، بكر القائمين من بين الأموات، ملك ملوك الأرض، ذاك الذي بدافع محبته لنا مات لأجلنا فغسلنا بدمه من خطايانا،"]]}, {"l": "Rev 1:18", "n": "", "vs": [[18, "أنا الحي. كنت ميتا، ولكن ها أنا حي إلى أبد الآبدين. ولي مفاتيح الموت والهاوية."]]}, {"l": "Rev 2:8", "n": "", "vs": [[8, "واكتب إلى ملاك الكنيسة في سميرنا: إليك ما يقوله الأول والآخر، الذي كان ميتا وعاد حيا:"]]}], "kwAr": "الذي أقامه من بين الأموات", "noteAr": ""}], "arS": [["من ", []], ["بولس", ["G3972"]], ["، وهو ", []], ["رسول", ["G652"]], [" لا من قبل ", []], ["الناس", ["G444"]], [" ولا بسلطة ", []], ["إنسان", ["G444"]], ["، بل بسلطة ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [" ", []], ["والله", ["G2316"]], [" ", []], ["الآب", ["G3962"]], [" الذي ", []], ["أقامه", ["G1453"]], [" من بين ", []], ["الأموات", ["G3498"]], ["،", []]]}, {"c": 1, "v": 2, "text": "ومن جميع الإخوة الذين معي، إلى الكنائس في مقاطعة غلاطية.", "groups": [{"kw": "all", "raw": "Phi_2:22, Phi_4:21", "note": "", "refs": [{"l": "Phi 2:22", "n": "", "vs": [[22, "أما تيموثاوس، فأنتم تعرفون أنه مختبر، إذ خدم معي في التبشير بالإنجيل كأنه ولد يعاون أباه."]]}, {"l": "Phi 4:21", "n": "", "vs": [[21, "سلموا على كل قديس في المسيح يسوع."]]}], "kwAr": "جميع الإخوة الذين معي", "noteAr": ""}, {"kw": "churches", "raw": "Act_9:31, Act_15:41, Act_16:5, Act_16:6, Act_18:23; 1Co_16:1", "note": "", "refs": [{"l": "Act 9:31", "n": "", "vs": [[31, "في أثناء ذلك كانت الكنيسة في مناطق اليهودية والجليل والسامرة تتمتع بالسلام. وكانت تنمو وتسير في تقوى الر ب، بمساندة الروح القدس."]]}, {"l": "Act 15:41", "n": "", "vs": [[41, "فسافر في مقاطعتي سورية وكيليكية يشدد الكنائس."]]}, {"l": "Act 16:5", "n": "", "vs": [[5, "فكانت الكنائس تتقوى في الإيمان، ويزداد عددها يوما بعد يوم."]]}, {"l": "Act 16:6", "n": "", "vs": [[6, "ومنعهم الروح القدس من التبشير في مقاطعة أسيا، فسافروا في مقاطعتي فريجية وغلاطية."]]}, {"l": "Act 18:23", "n": "", "vs": [[23, "فأمضى فيها بعض الوقت. ثم طاف مقاطعتي غلاطية وفريجية منتقلا من بلدة إلى أخرى وهو يشدد عزيمة التلاميذ جميعا."]]}, {"l": "1Co 16:1", "n": "", "vs": [[1, "وأما بخصوص جمع التبرعات للقديسين، فكما أوصيت الكنائس في مقاطعة غلاطية، كذلك اعملوا أنتم أيضا."]]}], "kwAr": "الكنائس في مقاطعة غلاطية", "noteAr": ""}], "arS": [["ومن ", []], ["جميع", ["G3956"]], [" ", []], ["الإخوة", ["G80"]], [" الذين معي، إلى ", []], ["الكنائس", ["G1577"]], [" في مقاطعة ", []], ["غلاطية", ["G1053"]], [".", []]]}, {"c": 1, "v": 3, "text": "لتكن لكم النعمة والسلام من الله الآب وربنا يسوع المسيح،", "groups": [{"kw": "", "raw": "Rom_1:7-15; 1Co_1:3; 2Co_1:2, 2Co_13:14; Eph_1:2; Phi_1:2; Col_1:2; 1Th_1:1; 2Th_1:2; 2Jo_1:3", "note": "", "refs": [{"l": "Rom 1:7-15", "n": "", "vs": [[7, "إلى جميع من هم في روما من أحباء الله القديسين المدعوين. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"], [8, "بادىء بدء، أشكر إلهي بيسوع المسيح من أجلكم جميعا، لأن إيمانكم يذاع خبره في العالم كله."], [9, "فإن الله الذي أخدمه بروحي في التبشير بإنجيل ابنه، هو شاهد لي كيف لا أتوقف عن ذكركم"], [10, "في صلواتي، متوسلا دائما عسى الآن أن يتيسر لي مرة بمشيئة الله أن آتي إليكم."], [11, "فإني أشتاق أن أراكم لأحمل إليكم موهبة روحية لتثبيتكم،"], [12, "أي ليشجع بعضنا بعضا بالإيمان المشترك، إيمانكم وإيماني."], [13, "ثم لا أريد أن يخفى عليكم، أيها الإخوة، أنني كثيرا ما قصدت أن آتي إليكم، ليكون لي ثمر من بينكم أيضا كما لي من بين الأمم الأخرى، إلا أنني كنت أعاق حتى الآن"], [14, "فإن علي دينا لليونانيين والبرابرة، للمتعلمين والجهال."], [15, "ولذلك، فبكل ما لدي، أنا في غاية الشوق أن أبشر بالإنجيل أيضا بينكم أنتم الذين في روما."]]}, {"l": "1Co 1:3", "n": "", "vs": [[3, "لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}, {"l": "2Co 1:2", "n": "", "vs": [[2, "لتكن لكم النعمة والسلام من الله أبينا ومن الرب يسوع المسيح!"]]}, {"l": "2Co 13:14", "n": "", "vs": [[14, "ولتكن معكم جميعا نعمة ربنا يسوع المسيح، ومحبة الله، وشركة الروح القدس. آمين!"]]}, {"l": "Eph 1:2", "n": "", "vs": [[2, "لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."]]}, {"l": "Phi 1:2", "n": "", "vs": [[2, "لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."]]}, {"l": "Col 1:2", "n": "", "vs": [[2, "إلى الإخوة القديسين والأمناء في المسيح، المقيمين في مدينة كولوسي. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."]]}, {"l": "1Th 1:1", "n": "", "vs": [[1, "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."]]}, {"l": "2Th 1:2", "n": "", "vs": [[2, "لتكن لكم النعمة والسلام من الله الآب والرب يسوع المسيح."]]}, {"l": "2Jo 1:3", "n": "", "vs": [[3, "فإن النعمة والرحمة والسلام ستكون معنا، من عند الله الآب والرب يسوع المسيح ابن الآب، بالحق والمحبة."]]}], "kwAr": "", "noteAr": ""}], "arS": [["لتكن لكم ", []], ["النعمة", ["G5485"]], [" ", []], ["والسلام", ["G1515"]], [" ", []], ["من", ["G575"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["الآب", ["G3962"]], [" ", []], ["وربنا", ["G2962", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], ["،", []]]}, {"c": 1, "v": 4, "text": "الذي بذل نفسه من أجل خطايانا لكي ينقذنا من العالم الحاضر الشرير، وفقا لمشيئة إلهنا وأبينا.", "groups": [{"kw": "gave", "raw": "Gal_2:20; Mat_20:28, Mat_26:28; Mar_10:45; Luk_22:19; Joh_10:11, Joh_10:17, Joh_10:18; Rom_4:25; Eph_5:2; 1Ti_2:6; Tit_2:14; Heb_9:14, Heb_10:9, Heb_10:10; 1Pe_2:24; 1Pe_3:18; 1Jo_2:2, 1Jo_3:16; Rev_1:5", "note": "", "refs": [{"l": "Gal 2:20", "n": "", "vs": [[20, "مع المسيح صلبت، وفيما بعد لا أحيا أنا بل المسيح يحيا في. أما الحياة التي أحياها الآن في الجسد، فإنما أحياها بالإيمان في ابن الله، الذي أحبني وبذل نفسه عني."]]}, {"l": "Mat 20:28", "n": "", "vs": [[28, "فهكذا ابن الإنسان: قد جاء لا ليخدم، بل ليخدم ويبذل نفسه فدية عن كثيرين. »"]]}, {"l": "Mat 26:28", "n": "", "vs": [[28, "فإن هذا هو دمي الذي للعهد الجديد والذي يسفك من أجل كثيرين لمغفرة الخطايا."]]}, {"l": "Mar 10:45", "n": "", "vs": [[45, "فحتى ابن الإنسان قد جاء لا ليخدم، بل ليخدم ويبذل نفسه فدية عن كثيرين»."]]}, {"l": "Luk 22:19", "n": "", "vs": [[19, "وإذ أخذ رغيفا، شكر، وكسر، وأعطاهم قائلا: «هذا جسدي الذي يبذل لأجلكم. هذا افعلوه لذكري!»"]]}, {"l": "Joh 10:11", "n": "", "vs": [[11, "أنا الراعي الصالح، والراعي الصالح يبذل حياته فدى خرافه."]]}, {"l": "Joh 10:17", "n": "", "vs": [[17, "إن الآب يحبني لأني أبذل حياتي لكي أستردها."]]}, {"l": "Joh 10:18", "n": "", "vs": [[18, "لا أحد ينتزع حياتي مني، بل أنا أبذلها باختياري. فلي السلطة أن أبذلها ولي السلطة أن أستردها. هذه الوصية تلقيتها من أبي»."]]}, {"l": "Rom 4:25", "n": "", "vs": [[25, "الذي أسلم للموت من أجل معاصينا ثم أقيم من أجل تبريرنا."]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "1Ti 2:6", "n": "", "vs": [[6, "الذي بذل نفسه فدية عوضا عن الجميع. هذه شهادة تؤدى في أوقاتها الخاصة،"]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Heb 9:14", "n": "", "vs": [[14, "فكم بالأحرى دم المسيح الذي قدم نفسه لله بروح أزلي ذبيحة لا عيب فيها، يطهر ضمائرنا من الأعمال الميتة لنعبد الله الحي."]]}, {"l": "Heb 10:9", "n": "", "vs": [[9, "أضاف قائلا: «ها أنا آتي لأعمل إرادتك!» فهو، إذن، يلغي النظام السابق، ليضع محله نظاما جديدا ينسجم مع إرادة الله."]]}, {"l": "Heb 10:10", "n": "", "vs": [[10, "بموجب هذه الإرادة الإلهية، صرنا مقدسين إذ قرب يسوع المسيح، مرة واحدة، جسده عوضا عنا!"]]}, {"l": "1Pe 2:24", "n": "", "vs": [[24, "وهو نفسه حمل خطايانا في جسده (عندما مات مصلوبا) على الخشبة، لكي نموت بالنسبة للخطايا فنحيا حياة البر. وبجراحه هو تم لكم الشفاء،"]]}, {"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}, {"l": "1Jo 2:2", "n": "", "vs": [[2, "فهو كفارة لخطايانا، لا لخطايانا فقط، بل لخطايا العالم كله."]]}, {"l": "1Jo 3:16", "n": "", "vs": [[16, "ومقياس المحبة هو العمل الذي قام به المسيح إذ بذل حياته لأجلنا. فعلينا نحن أيضا أن نبذل حياتنا لأجل إخوتنا."]]}, {"l": "Rev 1:5", "n": "", "vs": [[5, "ومن يسوع المسيح الشاهد الأمين، بكر القائمين من بين الأموات، ملك ملوك الأرض، ذاك الذي بدافع محبته لنا مات لأجلنا فغسلنا بدمه من خطايانا،"]]}], "kwAr": "الذي بذل نفسه", "noteAr": ""}, {"kw": "from", "raw": "Gal_6:14; Isa_65:17; Joh_12:31, Joh_14:30, Joh_15:18, Joh_15:19, Joh_17:14, Joh_17:15; Rom_12:2; 2Co_4:4; Eph_2:2, Eph_6:12; Heb_2:5, Heb_6:5; Jam_4:4; 1Jo_2:15-17, 1Jo_5:4, 1Jo_5:5, 1Jo_5:19; 1Jo_5:20; Rev_5:9, Rev_7:9", "note": "", "refs": [{"l": "Gal 6:14", "n": "", "vs": [[14, "أما أنا فحاشا لي أن أفتخر إلا بصليب ربنا يسوع المسيح، الذي به أصبح العالم بالنسبة لي مصلوبا، وأنا أصبحت بالنسبة له مصلوبا."]]}, {"l": "Isa 65:17", "n": "", "vs": [[17, "لأنني ها أنا أخلق سماوات جديدة وأرضا جديدة، تمحو ذكر الأولى فلا تعود تخطر على بال"]]}, {"l": "Joh 12:31", "n": "", "vs": [[31, "الآن وقت الحكم على هذا العالم! الآن يطرد سيد هذا العالم خارجا!"]]}, {"l": "Joh 14:30", "n": "", "vs": [[30, "لن أكلمكم كثيرا بعد، فإن سيد هذا العالم قادم علي، ولا شيء له في."]]}, {"l": "Joh 15:18", "n": "", "vs": [[18, "إن أبغضكم العالم، فاعلموا أنه قد أبغضني من قبلكم."]]}, {"l": "Joh 15:19", "n": "", "vs": [[19, "لو كنتم من أهل العالم، لكان العالم يحب أهله، ولكن لأنكم لستم من أهل العالم، بل إني اخترتكم من وسط العالم، لذلك يبغضكم العالم."]]}, {"l": "Joh 17:14", "n": "", "vs": [[14, "أبلغتهم كلمتك، فأبغضهم العالم لأنهم ليسوا من العالم."]]}, {"l": "Joh 17:15", "n": "", "vs": [[15, "وأنا لا أطلب أن تأخذهم من العالم، بل أن تحفظهم من الشرير."]]}, {"l": "Rom 12:2", "n": "", "vs": [[2, "ولا تتكيفوا مع هذا العالم، بل تغيروا بتجديد الذهن، لتميزوا ما هي إرادة الله الصالحة المقبولة الكاملة."]]}, {"l": "2Co 4:4", "n": "", "vs": [[4, "الذين أعمى إله هذا العالم أذهانهم حتى لا يضيء لهم نور الإنجيل المختص بمجد المسيح الذي هو صورة الله."]]}, {"l": "Eph 2:2", "n": "", "vs": [[2, "التي كنتم تسلكون فيها حسب مسرى هذا العالم، تابعين رئيس قوات الهواء، ذلك الروح العامل الآن في أبناء العصيان،"]]}, {"l": "Eph 6:12", "n": "", "vs": [[12, "فإن حربنا ليست ضد ذوي اللحم والدم، بل ضد الرئاسات، ضد السلطات، ضد أسياد العالم حكام هذا الظلام، ضد قوى الشر الروحية في الأماكن السماوية."]]}, {"l": "Heb 2:5", "n": "", "vs": [[5, "ثم إن «العالم الآتي» الذي نتحدث عنه كثيرا، لن يكون خاضعا لسيطرة الملائكة."]]}, {"l": "Heb 6:5", "n": "", "vs": [[5, "وذاقوا كلمة الله الطيبة، وشاهدوا المعجزات التي تظهر عظمة «العالم الآتي»،"]]}, {"l": "Jam 4:4", "n": "", "vs": [[4, "أيها الخونة! ألستم تعلمون أن مصادقة العالم هي معاداة لله؟ فالذي يريد أن يصادق العالم، يجعل نفسه عدوا لله."]]}, {"l": "1Jo 2:15-17", "n": "", "vs": [[15, "لا تحبوا العالم، ولا الأشياء التي في العالم. فالذي يحب العالم، لا تكون محبة الآب في قلبه."], [16, "لأن كل ما في العالم، من شهوات الجسد وشهوات العين وترف المعيشة، ليس من الآب، بل من العالم."], [17, "وسوف يزول العالم، وما فيه من شهوات أما الذي يعمل بإرادة الله، فيبقى إلى الأبد!"]]}, {"l": "1Jo 5:4", "n": "", "vs": [[4, "ذلك لأن المولود من الله ينتصر على العالم. فالإيمان هو الذي يجعلنا ننتصر على العالم."]]}, {"l": "1Jo 5:5", "n": "", "vs": [[5, "ومن ينتصر على العالم إلا الذي يؤمن أن يسوع هو ابن الله؟"]]}, {"l": "1Jo 5:19", "n": "", "vs": [[19, "ونحن واثقون أيضا بأننا من الله، وأن العالم كله خاضع لسيطرة إبليس الشرير."]]}, {"l": "1Jo 5:20", "n": "", "vs": [[20, "وإننا نعلم أن ابن الله قد جاء إلى الأرض وأنار أذهاننا لنعرف الإله الحق. ونحن الآن نحيا فيه، لأننا في ابنه يسوع المسيح. هذا هو الإله الحق، والحياة الأبدية."]]}, {"l": "Rev 5:9", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"]]}, {"l": "Rev 7:9", "n": "", "vs": [[9, "ثم نظرت، فرأيت جمعا كثيرا لا يحصى، من كل أمة وقبيلة وشعب ولغة، واقفين أمام العرش وأمام الحمل، وقد ارتدوا ثيا با بيضاء، وأمسكوا بأيديهم سعف النخل،"]]}], "kwAr": "لكي ينقذنا من العالم الحاضر الشرير", "noteAr": ""}, {"kw": "according", "raw": "Psa_40:8; Mat_26:42; Luk_22:42; Joh_5:30, Joh_6:38, Joh_14:30,Joh_14:31; Rom_8:3, Rom_8:27, Rom_8:32; Eph_1:3, Eph_1:11; Heb_10:4-10", "note": "", "refs": [{"l": "Psa 40:8", "n": "", "vs": [[8, "إن مسرتي أن أعمل مشيئتك الصالحة ياإلهي، وشريعتك في صميم قلبي."]]}, {"l": "Mat 26:42", "n": "", "vs": [[42, "وذهب ثانية يصلي، فقال: «ياأبي، إن كان لا يمكن أن تعبر عني هذه الكأس إلا بأن أشربها، فلتكن مشيئتك!»"]]}, {"l": "Luk 22:42", "n": "", "vs": [[42, "قائلا: «ياأبي، إن شئت أبعد عني هذه الكأس. ولكن، لتكن لا مشيئتي بل مشيئتك»."]]}, {"l": "Joh 5:30", "n": "", "vs": [[30, "وأنا لا يمكن أن أفعل شيئا من تلقاء ذاتي، بل أحكم حسبما أسمع، وحكمي عادل، لأني لا أسعى لتحقيق إرادتي بل إرادة الذي أرسلني."]]}, {"l": "Joh 6:38", "n": "", "vs": [[38, "فقد نزلت من السماء، لا لأتم مشيئتي، بل مشيئة الذي أرسلني."]]}, {"l": "Joh 14:30", "n": "", "vs": [[30, "لن أكلمكم كثيرا بعد، فإن سيد هذا العالم قادم علي، ولا شيء له في."]]}, {"l": "Joh 14:31", "n": "", "vs": [[31, "إلا أن هذا سيحدث ليعرف العالم أني أحب الآب، وأني مثلما أوصاني الآب هكذا أفعل. قوموا! لنذهب من هنا!"]]}, {"l": "Rom 8:3", "n": "", "vs": [[3, "فإن ما عجزت الشريعة عنه، لكون الجسد قد جعلها قاصرة عن تحقيقه، أتمه الله إذ أرسل ابنه، متخذا ما يشبه جسد الخطيئة ومكفرا عن الخطيئة فدان الخطيئة في الجسد"]]}, {"l": "Rom 8:27", "n": "", "vs": [[27, "على أن فاحص القلوب يعلم قصد الروح، لأن الروح يشفع في القديسين بما يوافق الله ."]]}, {"l": "Rom 8:32", "n": "", "vs": [[32, "بل بذله لأجلنا جميعا، كيف لا يجود علينا معه بكل شيء أيضا؟"]]}, {"l": "Eph 1:3", "n": "", "vs": [[3, "تبارك الله ، أبو ربنا يسوع المسيح الذي باركنا بكل بركة روحية في الأماكن السماوية."]]}, {"l": "Eph 1:11", "n": "", "vs": [[11, "وفي المسيح أيضا قد حصلنا على الميراث الذي سبق أن عينا له، وفقا لقصده، هو الذي يعمل كل شيء كما تقضي مشيئته."]]}, {"l": "Heb 10:4-10", "n": "", "vs": [[4, "فمن المستحيل أن يزيل دم الثيران والتيوس خطايا الناس."], [5, "لذلك قال المسيح، عند مجيئه إلى هذه الأرض: «إن الذبائح والتقدمات ما أردتها. لكنك أعددت لي جسدا بشريا."], [6, "فالحيوانات التي كانت تذبح وتحرق أمامك تكفيرا عن الخطيئة، لم ترض بها."], [7, "عندئذ قلت لك: ها أنا آتي لأعمل إرادتك، ياالله . هذا هو المكتوب عني في صفحة الكتاب !»"], [8, "فبعد أن عبر المسيح عن عدم رضى الله بجميع التقدمات والذبائح التي كانت تقرب مع أنها كانت تقدم وفقا للشريعة،"], [9, "أضاف قائلا: «ها أنا آتي لأعمل إرادتك!» فهو، إذن، يلغي النظام السابق، ليضع محله نظاما جديدا ينسجم مع إرادة الله."], [10, "بموجب هذه الإرادة الإلهية، صرنا مقدسين إذ قرب يسوع المسيح، مرة واحدة، جسده عوضا عنا!"]]}], "kwAr": "وفقا لمشيئة", "noteAr": ""}, {"kw": "our", "raw": "Mat_6:9; Rom_1:7; Eph_1:2; Phi_4:20; 1Th_3:11, 1Th_3:13; 2Th_2:16", "note": "", "refs": [{"l": "Mat 6:9", "n": "", "vs": [[9, "فصلوا أنتم مثل هذه الصلاة: أبانا الذي في السماوات، ليتقدس اسمك!"]]}, {"l": "Rom 1:7", "n": "", "vs": [[7, "إلى جميع من هم في روما من أحباء الله القديسين المدعوين. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}, {"l": "Eph 1:2", "n": "", "vs": [[2, "لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."]]}, {"l": "Phi 4:20", "n": "", "vs": [[20, "فلإلهنا وأبينا، المجد إلى دهر الدهور. آمين!"]]}, {"l": "1Th 3:11", "n": "", "vs": [[11, "ليت الله أبانا نفسه، وربنا يسوع المسيح، يسهل أمامنا الطريق إليكم."]]}, {"l": "1Th 3:13", "n": "", "vs": [[13, "حتى تتثبت قلوبكم بغير لوم في القداسة أمام إلهنا وأبينا عندما يظهر ربنا يسوع عائدا مع جميع قديسيه."]]}, {"l": "2Th 2:16", "n": "", "vs": [[16, "وليت ربنا يسوع المسيح نفسه، والله أبانا، الذي أحبنا ووهبنا بنعمته راحة أبدية ورجاء صالحا،"]]}], "kwAr": "إلهنا وأبينا", "noteAr": ""}], "arS": [["الذي ", []], ["بذل", ["G1325"]], [" ", []], ["نفسه", ["G1438"]], [" من أجل ", []], ["خطايانا", ["G266", "G2257"]], [" لكي ", []], ["ينقذنا", ["G1807"]], [" من ", []], ["العالم", ["G165"]], [" ", []], ["الحاضر", ["G1764"]], [" ", []], ["الشرير", ["G4190"]], ["، ", []], ["وفقا", ["G2596"]], [" ", []], ["لمشيئة", ["G2307"]], [" ", []], ["إلهنا", ["G2316"]], [" ", []], ["وأبينا", ["G3962", "G2257"]], [".", []]]}, {"c": 1, "v": 5, "text": "له المجد إلى أبد الآبدين. آمين!", "groups": [{"kw": "whom", "raw": "1Ch_29:13; Psa_41:13, Psa_72:19; Isa_24:15, Isa_42:12; Mat_6:13; Luk_2:14; Rom_11:36, Rom_16:27; Eph_1:12; Phi_4:20; 1Ti_1:17; 2Ti_4:18; Heb_13:21; 1Pe_5:11; 2Pe_3:18; Jud_1:25; Rev_4:9-11, Rev_5:12, Rev_7:12, Rev_14:7", "note": "", "refs": [{"l": "1Ch 29:13", "n": "", "vs": [[13, "والآن، نحمدك ياإلهنا ونسبح اسمك الجليل."]]}, {"l": "Psa 41:13", "n": "", "vs": [[13, "تبارك الرب إله إسرائيل، من الأزل وإلى الأبد. آمين فآمين."]]}, {"l": "Psa 72:19", "n": "", "vs": [[19, "تبارك اسمه المجيد إلى الأبد، ولتمتليء الأرض كلها من مجده. آمين ثم آمين."]]}, {"l": "Isa 24:15", "n": "", "vs": [[15, "لذلك مجدوا الرب في المشرق، مجدوا اسم الرب إله إسرائيل في جزائر البحر."]]}, {"l": "Isa 42:12", "n": "", "vs": [[12, "وليمجدوا الرب ويذيعوا حمده في الجزائر."]]}, {"l": "Mat 6:13", "n": "", "vs": [[13, "ولا تدخلنا في تجربة، لكن نجنا من الشرير، لأن لك الملك والقوة والمجد إلى الأبد. آمين."]]}, {"l": "Luk 2:14", "n": "", "vs": [[14, "«المجد لله في الأعالي، وعلى الأرض السلام؛ وبالناس المسرة! »"]]}, {"l": "Rom 11:36", "n": "", "vs": [[36, "فإن منه وبه وله كل شيء. له المجد إلى الأبد. آمين!"]]}, {"l": "Rom 16:27", "n": "", "vs": [[27, "المجد لله إلى الأبد، الحكيم وحده، بيسوع المسيح. آمين!"]]}, {"l": "Eph 1:12", "n": "", "vs": [[12, "والغاية أن نكون سببا لمدح مجده بعدما سبق لنا أن وضعنا رجاءنا في المسيح."]]}, {"l": "Phi 4:20", "n": "", "vs": [[20, "فلإلهنا وأبينا، المجد إلى دهر الدهور. آمين!"]]}, {"l": "1Ti 1:17", "n": "", "vs": [[17, "فللملك الأزلي، الله الواحد غير المنظور وغير الفاني، الكرامة والمجد إلى أبد الآبدين. آمين!"]]}, {"l": "2Ti 4:18", "n": "", "vs": [[18, "وسينجيني الرب من كل عمل شرير ويحفظني سالما لملكوته السماوي. فله المجد إلى أبد الآبدين آمين!"]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}, {"l": "1Pe 5:11", "n": "", "vs": [[11, "له المجد والسلطة إلى أبد الآبدين. آمين!"]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}, {"l": "Jud 1:25", "n": "", "vs": [[25, "لله الواحد، مخلصنا بيسوع المسيح ربنا ... المجد والجلال والقدرة والسلطة، من قبل أن كان الزمان، والآن وطوال الأزمان آمين!"]]}, {"l": "Rev 4:9-11", "n": "", "vs": [[9, "وكلما قدمت هذه الكائنات التمجيد والإجلال والحمد للجالس على العرش، الحي إلى أبد الآبدين،"], [10, "يجثو الشيوخ الأربعة والعشرون أمام الجالس على العرش ساجدين للحي إلى أبد الآبدين، ويلقون أكاليلهم أمام عرشه وهم يهتفون:"], [11, "«مستحق أنت ياربنا وإلهنا المجد والإجلال والقدرة، لأنك خلقت الأشياء كلها، وهي بإرادتك كائنة وقد خلقت!»"]]}, {"l": "Rev 5:12", "n": "", "vs": [[12, "وهم يهتفون بصوت عال: «مستحق هو الحمل المذبوح أن ينال القدرة والغنى والحكمة والقوة والإجلال والمجد والبركة»."]]}, {"l": "Rev 7:12", "n": "", "vs": [[12, "قائلين: «آمين! لإلهنا البركة والمجد والحكمة والشكر والإجلال والقدرة والقوة إلى أبد الآبدين. آمين!»"]]}, {"l": "Rev 14:7", "n": "", "vs": [[7, "وهو ينادي عاليا: «اتقوا الله ومجدوه، فقد حانت ساعة دينونته. اسجدوا لمن خلق السماء والأرض والبحر والينابيع»."]]}], "kwAr": "له المجد", "noteAr": ""}, {"kw": "Amen", "raw": "Mat_28:20", "note": "", "refs": [{"l": "Mat 28:20", "n": "", "vs": [[20, "وعلموهم أن يعملوا بكل ما أوصيتكم به. وها أنا معكم كل الأيام إلى انتهاء الزمان! »."]]}], "kwAr": "آمين", "noteAr": ""}], "arS": [["له ", []], ["المجد", ["G1391"]], [" إلى ", []], ["أبد الآبدين", ["G165"]], [". ", []], ["آمين", ["G281"]], ["!", []]]}, {"c": 1, "v": 6, "text": "عجبا! كيف تتحولون بمثل هذه السرعة عن الذي دعاكم بنعمة المسيح، وتنصرفون إلى إنجيل غريب؟", "groups": [{"kw": "marvel", "raw": "Mar_6:6; Joh_9:30", "note": "", "refs": [{"l": "Mar 6:6", "n": "", "vs": [[6, "وتعجب من عدم إيمانهم. ثم أخذ يطوف بالقرى المجاورة وهو يعلم."]]}, {"l": "Joh 9:30", "n": "", "vs": [[30, "فأجابهم الرجل: «إن في ذلك عجبا! إنه فتح عيني، وتقولون إنكم لا تعلمون له أصلا!"]]}], "kwAr": "عجبا", "noteAr": ""}, {"kw": "so", "raw": "Gal_3:1-5, Gal_4:9-15, Gal_5:4, Gal_5:7; Psa_106:13; Isa_29:13; Jer_2:12, Jer_2:13", "note": "", "refs": [{"l": "Gal 3:1-5", "n": "", "vs": [[1, "ياأهل غلاطية الأغبياء! من سحر عقولكم، أنتم الذين قد رسم أمام أعينكم يسوع المسيح وهو مصلوب؟"], [2, "أريد أن أستعلم منكم هذا الأمر فقط: أعلى أساس العمل بما في الشريعة نلتم الروح، أم على أساس الإيمان بالبشارة؟"], [3, "أإلى هذا الحد أنتم أغبياء؟ أبعدما ابتدأتم بالروح تكملون بالجسد؟"], [4, "وهل كان اختباركم الطويل بلا جدوى، إن كان حقا بلا جدوى؟"], [5, "فذاك الذي يهبكم الروح، ويجري معجزات في ما بينكم، أيفعل ذلك على أساس أعمال الشريعة أم على أساس الإيمان بالبشارة؟"]]}, {"l": "Gal 4:9-15", "n": "", "vs": [[9, "أما الآن وقد عرفتم الله ، بل بالأحرى عرفكم الله ، فكيف ترتدون أيضا إلى تلك المباديء العاجزة الفقيرة التي ترغبون في الرجوع إلى العبودية لها من جديد؟"], [10, "تحتفلون بأيام وأشهر ومواسم وسنين!"], [11, "أخاف عليكم، خشية أن أكون قد تعبت من أجلكم بلا جدوى."], [12, "أتوسل إليكم أيها الإخوة، أن تكونوا مثلي، لأني أنا أيضا مثلكم. أنتم لم تظلموني بشيء،"], [13, "بل تعرفون أنني في علة بالجسد بشرتكم أول الأمر؛"], [14, "ومع أن العلة التي في جسدي كانت تجربة لكم، فإنكم لم تحتقروني ولم تنفروا مني بسببها، بل قبلتموني كأني ملاك من عند الله، أو كأني المسيح يسوع."], [15, "فأين غبطتكم تلك؟ فإني أشهد لكم أنكم كنتم ستقلعون عيونكم وتقدمونها لي، لو كان ذلك ممكنا!"]]}, {"l": "Gal 5:4", "n": "", "vs": [[4, "يامن تريدون التبرير عن طريق الشريعة، قد حرمتم المسيح وسقطتم من النعمة!"]]}, {"l": "Gal 5:7", "n": "", "vs": [[7, "كنتم تجرون جريا جيدا، فمن أعاقكم حتى لا تذعنوا للحق؟"]]}, {"l": "Psa 106:13", "n": "", "vs": [[13, "ولكن سرعان ما نسوا أعماله! لم ينتظروا مشورته."]]}, {"l": "Isa 29:13", "n": "", "vs": [[13, "لذلك يقول الرب: لأن هذا الشعب يقترب مني بفمه ويكرمني بشفتيه، بينما قلبه بعيد عنى. وما مخافتهم مني سوى تقليد تلقنوه من الناس."]]}, {"l": "Jer 2:12", "n": "", "vs": [[12, "فاذهلي أيتها السماوات، وارتجفي وارتعدي جدا."]]}, {"l": "Jer 2:13", "n": "", "vs": [[13, "قد ارتكب شعبي شرين: نبذوني أنا ينبوع الحياة، وحفروا لأنفسهم آبارا متصدعة لا تضبط ماء."]]}], "kwAr": "بمثل هذه السرعة", "noteAr": ""}, {"kw": "that called", "raw": "Gal_5:8; 1Co_4:15; 2Th_2:14; 2Ti_1:9; 1Pe_1:15; 2Pe_1:3", "note": "", "refs": [{"l": "Gal 5:8", "n": "", "vs": [[8, "هذا التضليل ليس من الذي دعاكم!"]]}, {"l": "1Co 4:15", "n": "", "vs": [[15, "فقد يكون لكم عشر ة آلاف من المرشدين في المسيح، ولكن ليس لكم آباء كثيرون! لأني أنا ولدتكم في المسيح يسوع بالإنجيل."]]}, {"l": "2Th 2:14", "n": "", "vs": [[14, "فإلى هذا الأمر قد دعاكم ببشارتنا لكم، لنوال مجد ربنا يسوع المسيح."]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،"]]}, {"l": "1Pe 1:15", "n": "", "vs": [[15, "وإنما اسلكوا سلوكا مقدسا في كل أمر، مقتدين بالقدوس الذي دعاكم،"]]}, {"l": "2Pe 1:3", "n": "", "vs": [[3, "إن الله، بقدرته الإلهية، قد زودنا بكل ما نحتاج إليه في الحيا ة الروحية المتصفة بالتقوى. ذلك أنه عرفنا بالمسيح الذي دعانا إلى مجده وفضيلته،"]]}], "kwAr": "عن الذي دعاكم", "noteAr": ""}, {"kw": "the grace", "raw": "Act_15:11; Rom_5:2; 1Ti_1:14; 2Ti_2:1; Rev_22:21", "note": "", "refs": [{"l": "Act 15:11", "n": "", "vs": [[11, "فنحن نؤمن بأننا نخلص، كما يخلصون هم، بنعمة الرب يسوع."]]}, {"l": "Rom 5:2", "n": "", "vs": [[2, "وبه أيضا تم لنا الدخول بالإيمان إلى هذه النعمة التي نقيم فيها الآن؛ ونحن نفتخر برجائنا في التمتع بمجد الله."]]}, {"l": "1Ti 1:14", "n": "", "vs": [[14, "إلا أن نعمة ربنا قد فاضت علي فوق كل حد، ومعها الإيمان والمحبة، وذلك في المسيح يسوع."]]}, {"l": "2Ti 2:1", "n": "", "vs": [[1, "وأنت ياولدي، فكن قويا في النعمة التي في المسيح يسوع."]]}, {"l": "Rev 22:21", "n": "", "vs": [[21, "ولتكن نعمة ربنا يسوع المسيح معكم جميعا."]]}], "kwAr": "بنعمة المسيح", "noteAr": ""}, {"kw": "unto", "raw": "Rom_10:3; 2Co_11:4", "note": "", "refs": [{"l": "Rom 10:3", "n": "", "vs": [[3, "فبما أنهم جهلوا بر الله وسعوا إلى إثبات برهم الذاتي، لم يخضعوا للبر الإلهي."]]}, {"l": "2Co 11:4", "n": "", "vs": [[4, "فإذا كان من يأتيكم يبشر بيسوع آخر لم نبشر به نحن أو كنتم تنالون روحا آخر لم تنالوه، أو تقبلون إنجيلا لم تقبلوه، فإنكم تحتملون ذلك بكل سرور."]]}], "kwAr": "إلى إنجيل غريب", "noteAr": ""}], "arS": [["عجبا", ["G2296"]], ["! كيف ", []], ["تتحولون", ["G3346"]], [" بمثل هذه ", []], ["السرعة", ["G5030"]], [" عن الذي ", []], ["دعاكم", ["G2564"]], [" ", []], ["بنعمة", ["G5485"]], [" ", []], ["المسيح", ["G5547"]], ["، وتنصرفون إلى ", []], ["إنجيل", ["G2098"]], [" ", []], ["غريب", ["G2087"]], ["؟", []]]}, {"c": 1, "v": 7, "text": "لا أعني أن هنالك إنجيلا آخر، بل إنما هنالك بعض (المعلمين) الذين يثيرون البلبلة بينكم، راغبين في تحوير إنجيل المسيح.", "groups": [{"kw": "but", "raw": "Gal_2:4, Gal_4:17, Gal_5:10,Gal_5:12, Gal_6:12, Gal_6:13, Gal_6:17; Act_15:1-5, Act_15:24, Act_20:30; Rom_16:17, Rom_16:18; 2Co_11:13", "note": "", "refs": [{"l": "Gal 2:4", "n": "", "vs": [[4, "إنما أثير الأمر بسبب الإخوة الدجالين الذين أدخلوا بيننا خلسة، فاندسوا ليتجسسوا حريتنا التي لنا في المسيح يسوع، لعلهم يعيدوننا إلى العبودية؛"]]}, {"l": "Gal 4:17", "n": "", "vs": [[17, "إن أولئك (المعلمين) يظهرون من نحوكم حماسة، ولكنها غير صادقة، بل هم يرغبون في عزلكم عنا،"]]}, {"l": "Gal 5:10", "n": "", "vs": [[10, "ولكن لي ثقة بكم في الرب أنكم لن تعتنقوا رأيا آخر. وكل من يثير البلبلة بينكم سيلقى عقاب ذلك، كائنا من كان."]]}, {"l": "Gal 5:12", "n": "", "vs": [[12, "ليت الذين يثيرون البلبلة بينكم يبترون أنفسهم!"]]}, {"l": "Gal 6:12", "n": "", "vs": [[12, "إن الذين يريدون أن يظهروا في الجسد بمظهر حسن، أولئك يرغمونكم أن تختنوا، فقط لئلا يلقوا الاضطهاد بسبب صليب المسيح."]]}, {"l": "Gal 6:13", "n": "", "vs": [[13, "فحتى أولئك الذين يختنون، هم أنفسهم، لا يعملون بالشريعة، بل يريدون لكم أن تختنوا ليفتخروا بجسدكم."]]}, {"l": "Gal 6:17", "n": "", "vs": [[17, "لا يسبب لي أحد المتاعب فيما بعد، فإني أحمل في جسدي سمات الرب يسوع."]]}, {"l": "Act 15:1-5", "n": "", "vs": [[1, "وجاء بعض اليهود (الذين كانوا قد آمنوا بالمسيح) من منطقة اليهودية إلى أنطاكية، وأخذوا يعلمون الإخوة قائلين: «لا يمكنكم أن تخلصوا ما لم تختنوا حسب شريعة موسى»"], [2, "فجادلهم بولس وبرنابا جدالا عنيفا. وبعد المناقشة قرر مؤمنو أنطاكية أن يذهب بولس وبرنابا مع بعض المؤمنين ليقابلوا الرسل والشيوخ في أورشليم، ويبحثوا معهم في هذه القضية."], [3, "وبعدما ودعتهم الكنيسة، سافروا إلى أورشليم مرورا بمدن فينيقية والسامرة، مخبرين الإخوة فيها بأن غير اليهود أيضا قد اهتدوا إلى المسيح، فأشاعوا بذلك فرحا كبيرا بين الإخوة جميعا."], [4, "ولما وصلوا إلى أورشليم، رحبت بهم الكنيسة بمن فيها من رسل وشيوخ، فأخبروهم بكل ما فعل الله بواسطتهم."], [5, "ولكن بعض الذين كانوا على مذهب الفريسيين، ثم آمنوا، وقفوا وقالوا: «يجب أن يختن المؤمنون من غير اليهود ويلزموا أن يعملوا بشريعة موسى»."]]}, {"l": "Act 15:24", "n": "", "vs": [[24, "علمنا أن بعض الأشخاص ذهبوا من عندنا إليكم، دون تفويض منا فأثاروا بكلامهم الاضطراب بينكم وأقلقوا أفكاركم."]]}, {"l": "Act 20:30", "n": "", "vs": [[30, "بل إن قوما منكم أنتم سيقومون ويعلمون تعاليم منحرفة، ليجروا التلاميذ وراءهم."]]}, {"l": "Rom 16:17", "n": "", "vs": [[17, "ولكن، أتوسل إليكم، أيها الإخوة، أن تنتبهوا إلى مثيري الانقسامات والعثرات، خلافا للتعليم الذي تعلمتم، وأن تبتعدوا عنهم."]]}, {"l": "Rom 16:18", "n": "", "vs": [[18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."]]}, {"l": "2Co 11:13", "n": "", "vs": [[13, "فإن أمثال هؤلاء هم رسل دجالون، عمال ماكرون، يظهرون أنفسهم بمظهر رسل المسيح."]]}], "kwAr": "بل إنما هنالك بعض", "noteAr": ""}, {"kw": "pervert", "raw": "Gal_5:10,Gal_5:12; Jer_23:26; Mat_24:24; Act_13:10, Act_15:1, Act_15:24; 2Co_2:17, 2Co_4:2; 1Ti_4:1-3; 2Ti_2:18, 2Ti_3:8, 2Ti_3:9, 2Ti_4:3, 2Ti_4:4; Tit_1:10,Tit_1:11; 2Pe_2:1-3; 1Jo_2:18, 1Jo_2:19, 1Jo_2:26, 1Jo_4:1; 2Jo_1:7, 2Jo_1:10; Jud_1:4; Rev_2:2, Rev_2:6, Rev_2:14, Rev_2:15, Rev_2:20, Rev_12:9; Rev_13:14, Rev_19:20, Rev_20:3", "note": "", "refs": [{"l": "Gal 5:10", "n": "", "vs": [[10, "ولكن لي ثقة بكم في الرب أنكم لن تعتنقوا رأيا آخر. وكل من يثير البلبلة بينكم سيلقى عقاب ذلك، كائنا من كان."]]}, {"l": "Gal 5:12", "n": "", "vs": [[12, "ليت الذين يثيرون البلبلة بينكم يبترون أنفسهم!"]]}, {"l": "Jer 23:26", "n": "", "vs": [[26, "إلى متى يظل هذا الخداع مكنونا في قلوب المتنبئين زورا؟ إنهم حقا أنبياء خداع، يتنبأون بأوهام قلوبهم."]]}, {"l": "Mat 24:24", "n": "", "vs": [[24, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات عظيمة وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Act 13:10", "n": "", "vs": [[10, "«أيها الممتليء غشا وخبثا! ياابن إبليس! ياعدو كل بر! أما تكف عن تعويج طرق الرب المستقيمة؟"]]}, {"l": "Act 15:1", "n": "", "vs": [[1, "وجاء بعض اليهود (الذين كانوا قد آمنوا بالمسيح) من منطقة اليهودية إلى أنطاكية، وأخذوا يعلمون الإخوة قائلين: «لا يمكنكم أن تخلصوا ما لم تختنوا حسب شريعة موسى»"]]}, {"l": "Act 15:24", "n": "", "vs": [[24, "علمنا أن بعض الأشخاص ذهبوا من عندنا إليكم، دون تفويض منا فأثاروا بكلامهم الاضطراب بينكم وأقلقوا أفكاركم."]]}, {"l": "2Co 2:17", "n": "", "vs": [[17, "فإننا لا نتاجر بكلمة الله كما يفعل الكثيرون، وإنما بإخلاص ومن قبل الله، وأمام الله، نتكلم في المسيح."]]}, {"l": "2Co 4:2", "n": "", "vs": [[2, "ولكننا قد رفضنا الأساليب الخفية المخجلة، إذ لا نسلك في المكر، ولا نزور كلمة الله، بل بإعلاننا للحق نمدح أنفسنا لدى ضمير كل إنسان، أمام الله."]]}, {"l": "1Ti 4:1-3", "n": "", "vs": [[1, "إلا أن الروح يعلن صراحة أن قوما في الأزمنة الأخيرة سوف يرتدون عن الإيمان، منساقين وراء أرواح مضللة وتعاليم شيطانية،"], [2, "في موجة رياء ينشرها معلمون دجالون لهم ضمائر كويت بالنار."], [3, "يحرمون الزواج، ويأمرون بالامتناع عن أطعمة خلقها الله ليتناولها المؤمنون وعارفو الحق شاكرين."]]}, {"l": "2Ti 2:18", "n": "", "vs": [[18, "اللذان زاغا عن الحق؛ إذ يزعمان أن القيامة قد حدثت، ويهدمان إيمان بعض الناس."]]}, {"l": "2Ti 3:8", "n": "", "vs": [[8, "ومثلما قاوم (الساحران) ينيس ويمبريس موسى، كذلك أيضا يقاوم هؤلاء الحق؛ أناس عقولهم فاسدة، وقد تبين أنهم غير أهل للإيمان."]]}, {"l": "2Ti 3:9", "n": "", "vs": [[9, "ولكنهم لن يزدادوا تقدما، لأن حماقتهم ستنكشف للجميع، مثلما انكشفت حماقة الرجلين المذكورين."]]}, {"l": "2Ti 4:3", "n": "", "vs": [[3, "فإنه سيأتي زمان لا يطيق الناس فيه التعليم الصحيح، بل تبعا لشهواتهم الخاصة يكدسون لأنفسهم معلمين (يقولون لهم كلاما) يداعب الآذان."]]}, {"l": "2Ti 4:4", "n": "", "vs": [[4, "فيحولون آذانهم بعيدا عن الحق، منحرفين إلى الخرافات."]]}, {"l": "Tit 1:10", "n": "", "vs": [[10, "فإن هنالك كثيرين من معلمي الباطل المتمردين وخادعي عقول الناس، وبخاصة الذين من أهل الختان."]]}, {"l": "Tit 1:11", "n": "", "vs": [[11, "هؤلاء يجب أن تسد أفواههم: فهم يخربون بيوتا بجملتها، إذ يعلمون تعاليم يجب ألا تعلم، في سبيل مكسب خسيس."]]}, {"l": "2Pe 2:1-3", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."], [2, "وكثيرون سيسيرون وراءهم في طرق الإباحية. وبسببهم توجه الإهانة إلى طريق الحق."], [3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "1Jo 2:18", "n": "", "vs": [[18, "أيها الأولاد، اعلموا أننا نعيش الآن في الزمن الأخير. وكما سمعتم أنه سوف يأتي أخيرا «مسيح دجال»، فقد ظهر حتى الآن كثيرون من الدجالين المقاومين للمسيح. من هنا نتأكد أننا نعيش في الزمن الأخير."]]}, {"l": "1Jo 2:19", "n": "", "vs": [[19, "هؤلاء الدجالون انفصلوا عنا، لكنهم في الواقع لم يكونوا منا. ولو كانوا منا لظلوا معنا. فانفصالهم عنا إذن برهان على أنهم جميعا ليسوا منا."]]}, {"l": "1Jo 2:26", "n": "", "vs": [[26, "كتبت إليكم هذا مشيرا إلى الذين يحاولون أن يضللوكم."]]}, {"l": "1Jo 4:1", "n": "", "vs": [[1, "أيها الأحباء، لا تصدقوا كل روح، بل امتحنوا الأرواح لتعرفوا ما إذا كانت من عند الله أم لا، لأن عددا كبيرا من الأنبياء الدجالين قد انتشر في العالم."]]}, {"l": "2Jo 1:7", "n": "", "vs": [[7, "إن العالم أصبح يعج بالمضللين الذين لا يعترفون أن يسوع المسيح جاء إلى الأرض بجسم بشري. هذا هو روح المضل وضد المسيح!"]]}, {"l": "2Jo 1:10", "n": "", "vs": [[10, "إن جاءكم أحد بغير هذا التعليم، فلا تستقبلوه في بيتكم، ولا تبادلوه التحية."]]}, {"l": "Jud 1:4", "n": "", "vs": [[4, "لأنه قد تسلل إلى ما بينكم معلمون لابد أن يلاقوا الحكم بالعقاب الأبدي، كما هو مكتوب لهم منذ القديم. فهم أشرار لا يهابون الله ، يتخذون من نعمة إلهنا فرصة لإباحة الرذائل، وينكرون سيدنا وربنا الوحيد يسوع المسيح."]]}, {"l": "Rev 2:2", "n": "", "vs": [[2, "إني عالم بأعمالك، وجهدك، وصبرك، وأعلم أنك لا تستطيع احتمال الأشرار، وأنك دققت في فحص ادعاءات أولئك الذين يزعمون أنهم رسل، وما هم برسل، فتبين لك أنهم دجالون!"]]}, {"l": "Rev 2:6", "n": "", "vs": [[6, "أما ما يسرني فيك فهو أنك تكره أعمال النيقولاويين التي أكرهها أنا أيضا."]]}, {"l": "Rev 2:14", "n": "", "vs": [[14, "ولكني عاتب عليك قليلا لأنك تتسامح مع القوم الذين يتمسكون بتعليم بلعام عندما علم الملك بالاق أن يدمر بني إسرائيل بتوريطهم في ارتكاب الزنى والأكل من الذبائح المقدمة للأصنام،"]]}, {"l": "Rev 2:15", "n": "", "vs": [[15, "هكذا عندك أنت أيضا قوم يتمسكون بتعاليم النيقولاويين!"]]}, {"l": "Rev 2:20", "n": "", "vs": [[20, "ولكن لي عليك أنك تتساهل مع هذه المرأة إيزابل، التي تدعي أنها نبية، فتعلم عبيدي وتغويهم أن يزنوا ويأكلوا من الذبائح المقدمة للأصنام."]]}, {"l": "Rev 12:9", "n": "", "vs": [[9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."]]}, {"l": "Rev 13:14", "n": "", "vs": [[14, "فخدع سكان الأرض بالآيات التي كان يقوم بها في حضور الوحش الأول. وأمر سكان الأرض أن يقيموا تمثالا للوحش الأول الذي كان قد جرح جرحا مميتا ولكنه عاش!"]]}, {"l": "Rev 19:20", "n": "", "vs": [[20, "فقبض على الوحش وعلى النبي الدجال الذي قام بالمعجزات في حضور الوحش وأضل بها الذين قبلوا علامة الوحش، وسجدوا لتمثاله. وطرح كلاهما حيا في بحيرة النار والكبريت المتقدة،"]]}, {"l": "Rev 20:3", "n": "", "vs": [[3, "وطرحه في الهاوية وأغلقها عليه، وختمها، حتى يكف عن تضليل الأمم، إلى أن تنقضي الألف سنة. ولكن لابد من إطلاقه بعد ذلك لمدة قصيرة."]]}], "kwAr": "تحوير إنجيل المسيح", "noteAr": ""}], "arS": [["لا أعني أن هنالك ", []], ["إنجيلا", ["G2098"]], [" ", []], ["آخر", ["G243"]], ["، بل إنما هنالك ", []], ["بعض", ["G5100"]], [" (المعلمين) الذين ", []], ["يثيرون البلبلة", ["G5015"]], [" بينكم، ", []], ["راغبين", ["G2309"]], [" في ", []], ["تحوير", ["G3344"]], [" ", []], ["إنجيل", ["G2098"]], [" ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 1, "v": 8, "text": "ولكن، حتى لو بشرناكم نحن، أو بشركم ملاك من السماء، بغير الإنجيل الذي بشرناكم به، فليكن ملعونا!", "groups": [{"kw": "though", "raw": "Gal_1:9; 1Co_16:22; 2Co_11:13, 2Co_11:14; 1Ti_1:19, 1Ti_1:20; Tit_3:10; Rev_22:18, Rev_22:19", "note": "", "refs": [{"l": "Gal 1:9", "n": "", "vs": [[9, "وكما سبق أن قلنا، أكر ر القول الآن أيضا: إن كان أحد يبشركم بإنجيل غير الذي قبلتموه، فليكن ملعونا!"]]}, {"l": "1Co 16:22", "n": "", "vs": [[22, "إن كان أحد لا يحب الرب فليكن «أناثيما» (أي ملعونا)!"]]}, {"l": "2Co 11:13", "n": "", "vs": [[13, "فإن أمثال هؤلاء هم رسل دجالون، عمال ماكرون، يظهرون أنفسهم بمظهر رسل المسيح."]]}, {"l": "2Co 11:14", "n": "", "vs": [[14, "ولا عجب! فالشيطان نفسه يظهر نفسه بمظهر ملاك نور."]]}, {"l": "1Ti 1:19", "n": "", "vs": [[19, "متمسكا بالإيمان، وبالضمير الصالح، هذا الضمير الذي تخلى عنه بعضهم، فانكسرت بهم سفينة الإيمان."]]}, {"l": "1Ti 1:20", "n": "", "vs": [[20, "ومن هؤلاء همنايوس وإسكندر، وقد سلمتهما إلى الشيطان ليتعلما بالتأديب ألا يجدفا."]]}, {"l": "Tit 3:10", "n": "", "vs": [[10, "وصاحب الهرطقة اقطع العلاقة به بعد إنذاره أولا وثانيا،"]]}, {"l": "Rev 22:18", "n": "", "vs": [[18, "وإنني أشهد لكل من يسمع ما جاء في كتاب النبوءة هذا: إن زاد أحد شيئا على ما كتب فيه، يزيده الله من البلايا التي ورد ذكرها،"]]}, {"l": "Rev 22:19", "n": "", "vs": [[19, "وإن أسقط أحد شيئا من أقوال كتاب النبوءة هذا، يسقط الله نصيبه من شجرة الحياة، ومن المدينة المقدسة، اللتين جاء ذكرهما في هذا الكتاب."]]}], "kwAr": "حتى لو بشرناكم نحن", "noteAr": ""}, {"kw": "let", "raw": "Gal_3:10,Gal_3:13; Gen_9:25; Deu_27:15-26; Jos_9:23; 1Sa_26:19; Neh_13:25; Mat_25:41; 2Pe_2:14", "note": "", "refs": [{"l": "Gal 3:10", "n": "", "vs": [[10, "أما جميع الذين على مبدأ أعمال الشريعة، فإنهم تحت اللعنة، لأنه قد كتب: «ملعون كل من لا يثبت على العمل بكل ما هو مكتوب في كتاب الشريعة!»"]]}, {"l": "Gal 3:13", "n": "", "vs": [[13, "إن المسيح حررنا بالفداء من لعنة الشريعة، إذ صار لعنة عوضا عنا، لأنه قد كتب: «ملعون كل من علق على خشبة»،"]]}, {"l": "Gen 9:25", "n": "", "vs": [[25, "قال: «ليكن كنعان ملعونا، وليكن عبد العبيد لإخوته»."]]}, {"l": "Deu 27:15-26", "n": "", "vs": [[15, "ملعون الإنسان الذي يصنع تمثالا منحوتا أو مسبوكا مما تصنعه يدا نحات، وتنصبه للعبادة في الخفاء، لأن ذلك رجس لدى الرب. ويجيب جميع الشعب قائلين: آمين."], [16, "ملعون كل من يستخف بأبيه وأمه. ويقول جميع الشعب: آمين."], [17, "ملعون كل من يعبث بحدود أرض جاره. ويقول جميع الشعب: آمين."], [18, "ملعون كل من يضل الكفيف عن طريقه. ويقول جميع الشعب: آمين."], [19, "ملعون كل من يجور على حق الغريب واليتيم والأرملة. ويقول جميع الشعب: آمين."], [20, "ملعون كل من يضاجع امرأة أبيه، لأنه يكشف ستر أبيه. ويقول جميع الشعب: آمين."], [21, "ملعون كل من يضاجع بهيمة ما. ويقول جميع الشعب: آمين."], [22, "ملعون كل من يضاجع أخته ابنة أمه أو ابنة أبيه. ويقول جميع الشعب: آمين."], [23, "ملعون كل من يضاجع حماته. فيقول جميع الشعب: آمين."], [24, "ملعون كل من يقتل صاحبه في الخفاء. فيقول جميع الشعب: آمين."], [25, "ملعون كل من يأخذ رشوة ليقتل نفسا بريئة. فيقول جميع الشعب: آمين."], [26, "ملعون كل من لا يطيع كلمات هذه الشريعة ولا يعمل بها. فيقول جميع الشعب: آمين."]]}, {"l": "Jos 9:23", "n": "", "vs": [[23, "فلتكونوا ملعونين الآن، لا ينقطع منكم العبيد ومحتطبو الحطب ومستقو الماء لبيت إلهي»."]]}, {"l": "1Sa 26:19", "n": "", "vs": [[19, "فليسمع سيدي الملك كلام عبده الآن: إن كان الرب قد أثارك ضدي فلأقدمن له قربان رضي. وإن كان الناس هم الذين أوغروا صدرك علي فليكونوا ملعونين أمام الرب، لأنهم نفوني من أرض ميراث الرب قائلين: اذهب اعبد آلهة أخرى."]]}, {"l": "Neh 13:25", "n": "", "vs": [[25, "فأنبتهم ولعنتهم وضربت منهم قوما ونتفت شعورهم، واستحلفتهم باسم الله قائلا: «إياكم أن تزوجوا بناتكم من بنيهم، ولا تأخذوا بناتهم لأبنائكم ولا لكم."]]}, {"l": "Mat 25:41", "n": "", "vs": [[41, "ثم يقول للذين عن يساره: ابتعدوا عني ياملاعين إلى النار الأبدية المعدة لإبليس وأعوانه!"]]}, {"l": "2Pe 2:14", "n": "", "vs": [[14, "عيونهم لا تنظر إلا نظرات الزنى، ولا تشبع من الخطيئة. وكم من نفوس ضعيفة تقع في فخاخهم! أما قلوبهم، فقد تدربت على الشهوة والطمع. إنهم حقا أبناء اللعنة!"]]}], "kwAr": "فليكن", "noteAr": ""}, {"kw": "accursed", "raw": "Mar_14:71; Act_23:14; Rom_9:3; 1Co_12:3, 1Co_16:22 *Gr.", "note": "", "refs": [{"l": "Mar 14:71", "n": "", "vs": [[71, "ولكنه بدأ يلعن ويحلف: «إني لا أعرف هذا الرجل الذي تتحدثون عنه»."]]}, {"l": "Act 23:14", "n": "", "vs": [[14, "وذهبوا إلى رؤساء الكهنة والشيوخ وقالوا: «حرام علينا الطعام والشراب حتى نقتل بولس."]]}, {"l": "Rom 9:3", "n": "", "vs": [[3, "فقد كنت أتمنى لو أكون أنا نفسي محروما من المسيح في سبيل إخوتي، بني جنسي حسب الجسد."]]}, {"l": "1Co 12:3", "n": "", "vs": [[3, "لذلك أقول لكم أن تعرفوا أنه لا أحد وهو يتكلم بروح الله يقول: «اللعنة على يسوع!» وكذلك لا يستطيع أحد أن يقول: «يسوع رب» إلا بالروح القدس."]]}, {"l": "1Co 16:22", "n": "*Gr.", "vs": [[22, "إن كان أحد لا يحب الرب فليكن «أناثيما» (أي ملعونا)!"]]}], "kwAr": "ملعونا", "noteAr": ""}], "arS": [["ولكن، حتى لو ", []], ["بشرناكم", ["G2097"]], [" ", []], ["نحن", ["G2249"]], ["، أو بشركم ", []], ["ملاك", ["G32"]], [" من ", []], ["السماء", ["G3772"]], ["، بغير الإنجيل الذي ", []], ["بشرناكم", ["G2097"]], [" به، فليكن ", []], ["ملعونا", ["G331"]], ["!", []]]}, {"c": 1, "v": 9, "text": "وكما سبق أن قلنا، أكر ر القول الآن أيضا: إن كان أحد يبشركم بإنجيل غير الذي قبلتموه، فليكن ملعونا!", "groups": [{"kw": "so", "raw": "2Co_1:17, 2Co_13:1, 2Co_13:2; Phi_3:1, Phi_4:4", "note": "", "refs": [{"l": "2Co 1:17", "n": "", "vs": [[17, "فهل تظنون أني باعتمادي لهذه الخطة تصرفت بخفة، أو أني أتخذ قراراتي وفقا لمنطق البشر، ليكون في كلامي نعم نعم ولا لا في آن واحد؟"]]}, {"l": "2Co 13:1", "n": "", "vs": [[1, "هذه المرة الثالثة أنا قادم إليكم. بشهادة شاهدين أو ثلاثة يثبت كل أمر."]]}, {"l": "2Co 13:2", "n": "", "vs": [[2, "سبق لي أن أعلنت، وها أنا أقول مقدما وأنا غائب، كما قلت وأنا حاضر عندكم في المرة الثانية، للذين أخطأوا في الماضي وللباقين جميعا: إني إذا عدت إليكم فلا أشفق،"]]}, {"l": "Phi 3:1", "n": "", "vs": [[1, "وبعد، ياإخوتي، افرحوا في الرب. لا يزعجني أن أكتب إليكم بالأمور نفسها، فإن ذلك يجعلكم في مأمن."]]}, {"l": "Phi 4:4", "n": "", "vs": [[4, "افرحوا في الرب دائما، وأقول أيضا: افرحوا."]]}], "kwAr": "أكرر القول الآن", "noteAr": ""}, {"kw": "than", "raw": "Deu_4:2, Deu_12:32, Deu_13:1-11; Pro_30:6; Rev_22:18, Rev_22:19", "note": "", "refs": [{"l": "Deu 4:2", "n": "", "vs": [[2, "لا تضيفوا على ما أوصيكم به ولا تنقصوا منه، بل أطيعوا أوامر الرب إلهكم التي أوصيكم بها."]]}, {"l": "Deu 12:32", "n": "", "vs": [[32, "فاحرصوا على طاعة كل ما أوصيكم به. لا تزيدوا عليه ولا تنقصوا منه."]]}, {"l": "Deu 13:1-11", "n": "", "vs": [[1, "إذا ظهر بينكم نبي أو صاحب أحلام، وتنبأ بوقوع آية أو أعجوبة."], [2, "فتحققت تلك الآية أو الأعجوبة التي تنبأ بها، ثم قال: هلم نذهب وراء آلهة أخرى لم تعرفوها ونعبدها."], [3, "فلا تصغوا إلى كلام ذلك النبي أو صاحب الأحلام، لأن الرب إلهكم يجربكم ليرى إن كنتم تحبونه من كل قلوبكم ومن كل أنفسكم،"], [4, "فاتبعوا الرب إلهكم واتقوه، وأطيعوا وصاياه واسمعوا صوته، واعبدوه وتمسكوا به."], [5, "أما ذلك النبي أو الحالم فإنه يقتل، لأنه نطق بالبهتان ضد الرب إلهكم الذي أخرجكم من ديار مصر، وفداكم من نير العبودية، ليضلكم عن الطريق التي أمركم بسلوكها، فتستأصلون الشر من بينكم."], [6, "وإذا أضلك سرا أخوك ابن أمك، أو ابنك أو ابنتك، أو زوجتك المحبوبة، أو صديقك الحميم قائلا: لنذهب ونعبد آلهة أخرى غريبة عنك وعن آبائك"], [7, "من آلهة الشعوب الأخرى المحيطة بك أو البعيدة عنك من أقصى الأرض إلى أقصاها،"], [8, "فلا تستجب له ولا تصغ إليه، ولا يشفق قلبك عليه، ولا تترَأف به، ولا تتستر عليه."], [9, "بل حتما تقتله. كن أنت أول قاتليه، ثم يعقبك بقية الشعب."], [10, "ارجمه بالحجارة حتى يموت، لأنه سعى أن يضلك عن الرب إلهك الذي أخرجك من ديار مصر من نير العبودية،"], [11, "فيشيع الخبر بين الإسرائيليين جميعهم ويخافون، ولا يعاودون ارتكاب مثل هذا الأمر الشنيع بينكم."]]}, {"l": "Pro 30:6", "n": "", "vs": [[6, "لا تضف على كلامه لئلا يوبخك فتصبح كاذبا."]]}, {"l": "Rev 22:18", "n": "", "vs": [[18, "وإنني أشهد لكل من يسمع ما جاء في كتاب النبوءة هذا: إن زاد أحد شيئا على ما كتب فيه، يزيده الله من البلايا التي ورد ذكرها،"]]}, {"l": "Rev 22:19", "n": "", "vs": [[19, "وإن أسقط أحد شيئا من أقوال كتاب النبوءة هذا، يسقط الله نصيبه من شجرة الحياة، ومن المدينة المقدسة، اللتين جاء ذكرهما في هذا الكتاب."]]}], "kwAr": "غير الذي قبلتموه", "noteAr": ""}], "arS": [["وكما ", []], ["سبق أن قلنا", ["G4280"]], ["، أكر ر القول ", []], ["الآن", ["G737"]], [" ", []], ["أيضا", ["G3825"]], [": إن كان ", []], ["أحد", ["G1536"]], [" ", []], ["يبشركم", ["G2097"]], [" بإنجيل غير الذي ", []], ["قبلتموه", ["G3880"]], ["، فليكن ", []], ["ملعونا", ["G331"]], ["!", []]]}, {"c": 1, "v": 10, "text": "فهل أسعى الآن إلى كسب تأييد الناس أو الله؟ أم تراني أطلب أن أرضي الناس؟ لو كنت حتى الآن أرضي الناس، لما كنت عبدا للمسيح!", "groups": [{"kw": "do I now", "raw": "Act_4:19, Act_4:20, Act_5:29; 2Co_5:9-11; 1Th_2:4", "note": "", "refs": [{"l": "Act 4:19", "n": "", "vs": [[19, "ولكن بطرس ويوحنا قالا: «احكموا أنتم: أمن الحق أمام الله أن نطيع أمركم لا أمر الله؟"]]}, {"l": "Act 4:20", "n": "", "vs": [[20, "لا نستطيع أن نكف عن التحدث بما رأينا وسمعنا»."]]}, {"l": "Act 5:29", "n": "", "vs": [[29, "فأجاب بطرس والرسل: «ينبغي أن يطاع الله لا الناس!"]]}, {"l": "2Co 5:9-11", "n": "", "vs": [[9, "ولذلك أيضا نحرص أن نرضيه، سواء أكنا مقيمين أم مغتربين."], [10, "إذ لابد أن نقف جميعا مكشوفين أمام عرش المسيح، لينال كل واحد منا استحقاق ما عمله حين كان في الجسد، أصالحا كان أم رديئا!"], [11, "فبدافع وعينا لرهبة الرب، نحاول إقناع الناس. ولكننا ظاهرون أمام الله، وأرجو أن نكون ظاهرين أيضا في ضمائركم."]]}, {"l": "1Th 2:4", "n": "", "vs": [[4, "بل إننا نتكلم كمن تبين من اختبار الله لهم أنهم أهل لأن يؤتمنوا على الإنجيل، لنرضي لا الناس بل الله الذي يختبر قلوبنا."]]}], "kwAr": "فهل أسعى الآن", "noteAr": ""}, {"kw": "persuade", "raw": "1Sa_21:7; Mat_28:14; Act_12:20; Rom_2:8 *Gr: 1Jo_3:9", "note": "", "refs": [{"l": "1Sa 21:7", "n": "", "vs": [[7, "وكان هناك رجل من خدم شاول معتكفا في ذلك اليوم أمام الرب، يدعى دواغ الأدومي، رئيس رعاة شاول."]]}, {"l": "Mat 28:14", "n": "", "vs": [[14, "فإذا بلغ الخبر الحاكم، فإننا ندافع عنكم، فتكونون في مأمن من أي سوء»."]]}, {"l": "Act 12:20", "n": "", "vs": [[20, "وكان ناقما على أهل صور وصيدا. فاتفقوا وأرسلوا وفدا منهم يستعطفون بلاستس حاجب الملك طالبين الأمان، لأن منطقتهم كانت تكسب رزقها من مملكة هيرودس."]]}, {"l": "Rom 2:8", "n": "*Gr:", "vs": [[8, "ويكون الغضب والسخط للمخاصمين الذين يرفضون الطاعة للحق ولكنهم يخضعون للإثم."]]}, {"l": "1Jo 3:9", "n": "", "vs": [[9, "فكل مولود من الله، لا يمارس الخطيئة، لأن طبيعة الله صارت ثابتة فيه. بل إنه لا يستطيع أن يمارس الخطيئة، لأنه مولود من الله."]]}], "kwAr": "كسب تأييد الناس", "noteAr": ""}, {"kw": "do I seek", "raw": "2Co_12:19; 1Th_2:4", "note": "", "refs": [{"l": "2Co 12:19", "n": "", "vs": [[19, "طالما كنتم تظنون أننا ندافع عن أنفسنا عندكم! ولكننا إنما نتكلم أمام الله في المسيح. وذلك كله، أيها الأحباء، لأجل بنيانكم."]]}, {"l": "1Th 2:4", "n": "", "vs": [[4, "بل إننا نتكلم كمن تبين من اختبار الله لهم أنهم أهل لأن يؤتمنوا على الإنجيل، لنرضي لا الناس بل الله الذي يختبر قلوبنا."]]}], "kwAr": "أم تراني أطلب", "noteAr": ""}, {"kw": "for if", "raw": "Mat_22:16; Rom_15:1, Rom_15:2; 1Co_10:33; Eph_6:6; Col_3:22; Jam_4:4", "note": "", "refs": [{"l": "Mat 22:16", "n": "", "vs": [[16, "فأرسلوا إليه بعض تلاميذهم مع أعضاء حزب هيرودس، يقولون له: «يامعلم، نعلم أنك صادق وتعلم الناس طريق الله في الحق، ولا تبالي بأحد لأنك لا تراعي مقامات الناس،"]]}, {"l": "Rom 15:1", "n": "", "vs": [[1, "ولكن علينا نحن الأقوياء (في الإيمان)، أن نحتمل ضعف الضعفاء (فيه)، وأن لا نرضي أنفسنا."]]}, {"l": "Rom 15:2", "n": "", "vs": [[2, "فليسع كل واحد منا لإرضاء قريبه من جهة ما هو صالح، في سبيل البنيان."]]}, {"l": "1Co 10:33", "n": "", "vs": [[33, "فهكذا أنا أيضا أسعى لإرضاء الجميع في كل شيء، ولا أهتم بمصلحتي الخاصة، بل بمصلحة الكثيرين، لكي يخلصوا."]]}, {"l": "Eph 6:6", "n": "", "vs": [[6, "غير عاملين بجد فقط حين تكون عيونهم عليكم كمن يحاول إرضاء الناس، بل انطلاقا من كونكم عبيدا للمسيح،"]]}, {"l": "Col 3:22", "n": "", "vs": [[22, "أيها العبيد، أطيعوا في كل أمر سادتكم البشريين، فلا تعملوا بجد فقط حين تكون عيونهم عليكم، كمن يحاول إرضاء الناس، بل بقلب صادق خائفين الرب."]]}, {"l": "Jam 4:4", "n": "", "vs": [[4, "أيها الخونة! ألستم تعلمون أن مصادقة العالم هي معاداة لله؟ فالذي يريد أن يصادق العالم، يجعل نفسه عدوا لله."]]}], "kwAr": "لو كنت حتى الآن أرضي الناس", "noteAr": ""}, {"kw": "the servant", "raw": "Rom_1:1", "note": "", "refs": [{"l": "Rom 1:1", "n": "", "vs": [[1, "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"]]}], "kwAr": "عبدا للمسيح", "noteAr": ""}], "arS": [["فهل أسعى ", []], ["الآن", ["G737"]], [" إلى ", []], ["كسب تأييد", ["G3982"]], [" ", []], ["الناس", ["G444"]], [" أو ", []], ["الله", ["G2316"]], ["؟ أم تراني ", []], ["أطلب", ["G2212"]], [" أن ", []], ["أرضي", ["G700"]], [" ", []], ["الناس", ["G444"]], ["؟ لو كنت حتى الآن ", []], ["أرضي", ["G700"]], [" ", []], ["الناس", ["G444"]], ["، لما كنت ", []], ["عبدا", ["G1401"]], [" ", []], ["للمسيح", ["G5547"]], ["!", []]]}, {"c": 1, "v": 11, "text": "وأعلمكم، أيها الإخوة، أن الإنجيل الذي بشرتكم به ليس إنجيلا بشريا.", "groups": [{"kw": "that", "raw": "Gal_1:1; 1Co_2:9, 1Co_2:10, 1Co_11:23, 1Co_15:1-3; Eph_3:3-8", "note": "", "refs": [{"l": "Gal 1:1", "n": "", "vs": [[1, "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"]]}, {"l": "1Co 2:9", "n": "", "vs": [[9, "لما صلبوا رب المجد! ولكن، وفقا لما كتب: «إن ما لم تره عين، ولم تسمع به أذن، ولم يخطر على بال بشر قد أعده الله لمحبيه!»"]]}, {"l": "1Co 2:10", "n": "", "vs": [[10, "ولكن الله كشف لنا ذلك بالروح. فإن الروح يتقصى كل شيء، حتى أعماق الله."]]}, {"l": "1Co 11:23", "n": "", "vs": [[23, "فإني قد تسلمت من الرب ما سلمتكم إياه. وهو أن الرب يسوع، في الليلة التي أسلم فيها، أخذ خبزا،"]]}, {"l": "1Co 15:1-3", "n": "", "vs": [[1, "على أني أذكركم، أيها الإخوة بالإنجيل الذي بشرتكم به، وقبلتموه ومازلتم قائمين فيه،"], [2, "وبه أيضا أنتم مخلصون، إن كنتم تتمسكون بالكلمة التي بشرتكم بها، إلا إذا كنتم قد آمنتم عبثا."], [3, "فالواقع أني سلمتكم، في أول الأمر، ما كنت قد تسلمته، وهو أن المسيح مات من أجل خطايانا وفقا لما في الكتاب،"]]}, {"l": "Eph 3:3-8", "n": "", "vs": [[3, "كيف كشف لي السر عن طريق الوحي، كما كتبت قبلا بإيجاز،"], [4, "ويمكنكم، حينما تقرأون ما كتبته، أن تدركوا اطلاعي العميق على سر المسيح،"], [5, "ذلك السر الذي لم يطلع عليه بنو البشر في الأجيال الماضية مثلما أعلن الآن بوحي الروح لرسله القديسين وأنبيائه:"], [6, "وهو أن الأمم هم شركاء اليهود في الميراث، وأعضاء في الجسد معهم، ولهم أيضا حق الاستفادة من الوعد. وذلك في المسيح يسوع وبفضل الإنجيل"], [7, "الذي صرت أنا خادما له بحسب نعمة الله الموهوبة لي وفقا لعمل قدرته."], [8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}], "kwAr": "أن الإنجيل الذي بشرتكم به", "noteAr": ""}], "arS": [["وأعلمكم", ["G1107"]], ["، أيها ", []], ["الإخوة", ["G80"]], ["، أن ", []], ["الإنجيل", ["G2098"]], [" الذي ", []], ["بشرتكم", ["G2097"]], [" به ليس إنجيلا ", []], ["بشريا", ["G444"]], [".", []]]}, {"c": 1, "v": 12, "text": "فلا أنا تسلمته من إنسان، ولا تلقنته، بل جاءني بإعلان من يسوع المسيح.", "groups": [], "arS": [["فلا أنا ", []], ["تسلمته", ["G3880"]], [" من ", []], ["إنسان", ["G444"]], ["، ولا ", []], ["تلقنته", ["G1321"]], ["، بل جاءني ", []], ["بإعلان", ["G602"]], [" من ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 1, "v": 13, "text": "فإنكم قد سمعتم بسيرتي الماضية في الديانة اليهودية، كيف كنت أضطهد كنيسة الله متطرفا إلى أقصى حد، ساعيا إلى تخريبها،", "groups": [{"kw": "ye", "raw": "Act_22:3-5, Act_26:4, Act_26:5", "note": "", "refs": [{"l": "Act 22:3-5", "n": "", "vs": [[3, "»أنا رجل يهودي، ولدت في طرسوس الواقعة في مقاطعة كيليكية، ولكني نشأت في هذه المدينة وتعلمت عند قدمي غمالائيل التربية الموافقة تماما لشريعة آبائنا. وكنت غيورا في أمور الله، مثلكم جميعا اليوم."], [4, "فاضطهدت هذا الطريق حتى الموت، فكنت أعتقل أتباعه من الرجال والنساء، وأزج بهم في السجون."], [5, "ويشهد رئيس الكهنة ومجلس الشيوخ على صدق كلامي هذا. فقد أخذت منهم رسائل إلى إخوانهم في دمشق ليعاونوني في القبض على الذين هناك، لأسوقهم إلى أورشليم فينالوا عقابهم."]]}, {"l": "Act 26:4", "n": "", "vs": [[4, "إن اليهود جميعا يعرفون نشأتي من البداية. فقد عشت بين شعبي في أورشليم منذ صغري."]]}, {"l": "Act 26:5", "n": "", "vs": [[5, "وماداموا يعرفونني من البداية، فلو أرادوا لشهدوا أنني كنت فريسيا، أي تابعا للمذهب الأكثر تشددا في ديانتنا."]]}], "kwAr": "فإنكم قد سمعتم", "noteAr": ""}, {"kw": "how", "raw": "Act_8:1, Act_8:3, Act_9:1, Act_9:2, Act_9:13, Act_9:14, Act_9:21, Act_9:26, Act_22:4, Act_22:5, Act_26:9-11; 1Co_15:9; Phi_3:6; 1Ti_1:13", "note": "", "refs": [{"l": "Act 8:1", "n": "", "vs": [[1, "وكان شاول موافقا على قتل استفانوس. وفي ذلك اليوم نفسه وقع اضطهاد شديد على الكنيسة التي في أورشليم. فتشتت الإخوة جميعا في نواحي اليهودية والسامرة، ولم يبق في أورشليم إلا الرسل."]]}, {"l": "Act 8:3", "n": "", "vs": [[3, "أما شاول فكان يحاول إبادة الكنيسة، فيذهب من بيت إلى بيت ويجر الرجال والنساء ويلقيهم في السجن."]]}, {"l": "Act 9:1", "n": "", "vs": [[1, "أما شاول فكان لايزال يفور بالتهديد والقتل على تلاميذ الرب. فذهب إلى رئيس الكهنة،"]]}, {"l": "Act 9:2", "n": "", "vs": [[2, "وطلب منه رسائل إلى مجامع اليهود في دمشق لتسهيل القبض على أتباع هذا الطريق من الرجال والنساء، حيثما يجدهم، ليسوقهم مقيدين إلى أورشليم."]]}, {"l": "Act 9:13", "n": "", "vs": [[13, "فقال حنانيا للرب: «ولكني، يارب، قد سمعت من كثيرين بالفظائع التي ارتكبها هذا الرجل بقديسيك في أورشليم،"]]}, {"l": "Act 9:14", "n": "", "vs": [[14, "وقد خوله رؤساء الكهنة السلطة ليلقي القبض على كل من يدعو باسمك»."]]}, {"l": "Act 9:21", "n": "", "vs": [[21, "وأثار كلامه دهشة السامعين، فتساءلوا: «أليس هذا هو الذي كان يبيد جميع الداعين بهذا الاسم في أورشليم؟ أما جاء إلى هنا ليلقي القبض عليهم ويسوقهم مقيدين إلى رؤساء الكهنة؟»"]]}, {"l": "Act 9:26", "n": "", "vs": [[26, "ولما وصل شاول إلى أورشليم، حاول أن ينضم إلى التلاميذ هناك، فخافوا منه، إذ لم يصدقوا أنه صار تلميذا للرب."]]}, {"l": "Act 22:4", "n": "", "vs": [[4, "فاضطهدت هذا الطريق حتى الموت، فكنت أعتقل أتباعه من الرجال والنساء، وأزج بهم في السجون."]]}, {"l": "Act 22:5", "n": "", "vs": [[5, "ويشهد رئيس الكهنة ومجلس الشيوخ على صدق كلامي هذا. فقد أخذت منهم رسائل إلى إخوانهم في دمشق ليعاونوني في القبض على الذين هناك، لأسوقهم إلى أورشليم فينالوا عقابهم."]]}, {"l": "Act 26:9-11", "n": "", "vs": [[9, "وكنت أعتقد أنه يجب أن أبذل غاية جهدي لأقاوم اسم يسوع الناصري."], [10, "وقد عملت على تنفيذ خطتي في أورشليم بتفويض خاص من رؤساء الكهنة، فألقيت في السجن عددا كبيرا من القديسين. وكنت أعطي صوتي بالموافقة عندما كان المجلس يحكم بإعدامهم."], [11, "وكم عذبتهم في المجامع كلها لأجبرهم على التجديف. وقد بلغ حقدي عليهم درجة جعلتني أطاردهم في المدن التي في خارج البلاد."]]}, {"l": "1Co 15:9", "n": "", "vs": [[9, "فإني أنا أصغر الرسل شأنا، ولست أهلا لأن أدعى رسولا لأني اضطهدت كنيسة الله."]]}, {"l": "Phi 3:6", "n": "", "vs": [[6, "ومن جهة الحماسة، مضطهد للكنيسة؛ ومن جهة البر المطلوب في الشريعة، كنت بلا لوم."]]}, {"l": "1Ti 1:13", "n": "", "vs": [[13, "مع أني كنت في الماضي مجدفا عليه، ومضطهدا ومهينا له! ولكني عوملت بالرحمة، لأني عملت ما عملته عن جهل وفي عدم إيمان."]]}], "kwAr": "كيف كنت أضطهد كنيسة الله", "noteAr": ""}], "arS": [["فإنكم قد ", []], ["سمعتم", ["G191"]], [" ", []], ["بسيرتي", ["G391"]], [" ", []], ["الماضية", ["G4218"]], [" في ", []], ["الديانة اليهودية", ["G2454"]], ["، كيف كنت ", []], ["أضطهد", ["G1377"]], [" ", []], ["كنيسة", ["G1577"]], [" ", []], ["الله", ["G2316"]], [" متطرفا إلى ", []], ["أقصى حد", ["G5236"]], ["، ساعيا إلى ", []], ["تخريبها", ["G4199"]], ["،", []]]}, {"c": 1, "v": 14, "text": "وكيف كنت متفوقا في الديانة اليهودية على كثيرين من أبناء جيلي في أمتي لكوني غيورا أكثر منهم جدا على تقاليد آبائي.", "groups": [{"kw": "profited", "raw": "Isa_29:13, Isa_57:12", "note": "", "refs": [{"l": "Isa 29:13", "n": "", "vs": [[13, "لذلك يقول الرب: لأن هذا الشعب يقترب مني بفمه ويكرمني بشفتيه، بينما قلبه بعيد عنى. وما مخافتهم مني سوى تقليد تلقنوه من الناس."]]}, {"l": "Isa 57:12", "n": "", "vs": [[12, "سأتحدث عن بركم وأعمالكم، ولكنها لن تجديكم نفعا."]]}], "kwAr": "متفوقا في الديانة اليهودية", "noteAr": ""}, {"kw": "equals", "raw": "Gr. equals in years", "note": "Gr. equals in years", "refs": [], "kwAr": "أبناء جيلي", "noteAr": "في اليونانية: أقراني في السنّ."}, {"kw": "being", "raw": "Act_22:3, Act_26:5, Act_26:9; Phi_3:4-6", "note": "", "refs": [{"l": "Act 22:3", "n": "", "vs": [[3, "»أنا رجل يهودي، ولدت في طرسوس الواقعة في مقاطعة كيليكية، ولكني نشأت في هذه المدينة وتعلمت عند قدمي غمالائيل التربية الموافقة تماما لشريعة آبائنا. وكنت غيورا في أمور الله، مثلكم جميعا اليوم."]]}, {"l": "Act 26:5", "n": "", "vs": [[5, "وماداموا يعرفونني من البداية، فلو أرادوا لشهدوا أنني كنت فريسيا، أي تابعا للمذهب الأكثر تشددا في ديانتنا."]]}, {"l": "Act 26:9", "n": "", "vs": [[9, "وكنت أعتقد أنه يجب أن أبذل غاية جهدي لأقاوم اسم يسوع الناصري."]]}, {"l": "Phi 3:4-6", "n": "", "vs": [[4, "مع أن من حقي أنا أيضا أن أعتمد عليها. فإن خطر على بال أحد أن يعتمد على أمور الجسد، فأنا أحق منه:"], [5, "فمن جهة الختان، مختون في اليوم الثامن من عمري؛ وأنا من جنس إسرائيل، من سبط بنيامين، عبراني من العبرانيين؛ ومن جهة الشريعة، أنا فريسي؛"], [6, "ومن جهة الحماسة، مضطهد للكنيسة؛ ومن جهة البر المطلوب في الشريعة، كنت بلا لوم."]]}], "kwAr": "لكوني غيورا", "noteAr": ""}, {"kw": "traditions", "raw": "Jer_15:2; Mat_15:2, Mat_15:3, Mat_15:6; Mar_7:3-13; Col_2:8; 1Pe_1:8", "note": "", "refs": [{"l": "Jer 15:2", "n": "", "vs": [[2, "وعندما يسألونك: إلى أين نذهب؟ أجبهم: هذا ما يعلنه الرب: من هو للوبأ فبالوبأ يموت، ومن هو للسيف فبالسيف يقتل، ومن هو للمجاعة فبالمجاعة يفنى، ومن هو للسبي فإلى السبي يذهب."]]}, {"l": "Mat 15:2", "n": "", "vs": [[2, "«لماذا يخالف تلاميذك تقاليد الشيوخ، فلا يغسلون أيديهم قبل أن يأكلوا؟»"]]}, {"l": "Mat 15:3", "n": "", "vs": [[3, "فأجابهم «ولماذا تخالفون أنتم وصية الله من أجل المحافظة على تقاليدكم؟"]]}, {"l": "Mat 15:6", "n": "", "vs": [[6, "فهو في حل من إكرام أبيه وأمه. وأنتم، بهذا، تلغون ما أوصى به الله ، محافظة على تقاليدكم."]]}, {"l": "Mar 7:3-13", "n": "", "vs": [[3, "فقد كان الفريسيون، واليهود عامة، لا يأكلون ما لم يغسلوا أيديهم مرارا، متمسكين بتقليد الشيوخ."], [4, "وإذا عادوا من السوق، لا يأكلون ما لم يغتسلوا. وهناك طقوس أخرى كثيرة تسلموها ليتمسكوا بها، كغسل الكؤوس والأباريق وأوعية النحاس."], [5, "عندئذ سأله الفريسيون والكتبة: «لماذا لا يسلك تلاميذك وفقا لتقليد الشيوخ، بل يتناولون الطعام بأيد نجسة؟»"], [6, "فرد عليهم قائلا: «أحسن إشعياء إذ تنبأ عنكم أيها المراؤون، كما جاء في الكتاب: هذا الشعب يكرمني بشفتيه، وأما قلبه فبعيد عني جدا."], [7, "إنما باطلا يعبدونني وهم يعلمون تعاليم ليست إلا وصايا الناس !"], [8, "فقد أهملتم وصية الله وتمسكتم بتقليد الناس!»"], [9, "وقال لهم: «حقا أنكم رفضتم وصية الله لتحافظوا على تقليدكم أنتم!"], [10, "فإن موسى قال: أكرم أباك وأمك! وأيضا: من أهان أباه أو أمه، فليكن الموت عقابا له!"], [11, "ولكنكم أنتم تقولون: إذا قال أحد لأبيه أو أمه: إن ما كنت أعولك به قد جعلته قربانا، أي تقدمة (للهيكل)،"], [12, "فهو في حل من إعانة أبيه أو أمه!"], [13, "وهكذا تبطلون كلمة الله بتعليمكم التقليدي الذي تتناقلونه. وهناك أمور كثيرة مثل هذه تفعلونها! »"]]}, {"l": "Col 2:8", "n": "", "vs": [[8, "احذروا أن يوقعكم أحد فريسة بالفلسفة والغرور الباطل، عملا بتقاليد الناس ومباديء العالم؛ مما لا يوافق المسيح."]]}, {"l": "1Pe 1:8", "n": "", "vs": [[8, "أنتم لم تروا المسيح، ولكنكم تحبونه. ومع أنكم لا ترونه الآن، فأنتم تؤمنون به وتبتهجون بفرح مجيد يفوق الوصف."]]}], "kwAr": "تقاليد آبائي", "noteAr": ""}], "arS": [["وكيف كنت ", []], ["متفوقا", ["G4298"]], [" في ", []], ["الديانة اليهودية", ["G2454"]], [" على ", []], ["كثيرين", ["G4183"]], [" من ", []], ["أبناء جيلي", ["G4915"]], [" في ", []], ["أمتي", ["G1085"]], [" لكوني ", []], ["غيورا", ["G2207"]], [" أكثر منهم ", []], ["جدا", ["G4056"]], [" على ", []], ["تقاليد", ["G3862"]], [" ", []], ["آبائي", ["G3967", "G3450"]], [".", []]]}, {"c": 1, "v": 15, "text": "ولكن، لما سر الله ، الذي كان قد أفرزني وأنا في بطن أمي ثم دعاني بنعمته،", "groups": [{"kw": "it", "raw": "Deu_7:7, Deu_7:8; 1Sa_12:22; 1Ch_28:4, 1Ch_28:5; Mat_11:26; Luk_10:21; 1Co_1:1; Eph_1:5, Eph_1:9, Eph_3:11", "note": "", "refs": [{"l": "Deu 7:7", "n": "", "vs": [[7, "ولم يفضلكم الرب ويتخيركم لأنكم أكثر عددا من سائر الشعوب، فأنتم أقل الأمم عددا."]]}, {"l": "Deu 7:8", "n": "", "vs": [[8, "بل من محبته، وحفاظا على القسم الذي أقسم به لآبائكم، أخرجكم بقوة فائقة، وفداكم من نير عبودية فرعون ملك مصر."]]}, {"l": "1Sa 12:22", "n": "", "vs": [[22, "فالرب لا يتخلى عن شعبه إكراما لاسمه العظيم، لأنه شاء أن يجعلكم له شعبا."]]}, {"l": "1Ch 28:4", "n": "", "vs": [[4, "إن الرب إله إسرائيل قد اصطفاني من كل بيت أبي ليجعلني ملكا على إسرائيل إلى الأبد، وذلك لأنه اختار سبط يهوذا للرئاسة، ثم اختار بيت أبي من بين بيوت يهوذا، وقد سر أن يفرزني من بين أبناء أبي ليوليني على ملك إسرائيل."]]}, {"l": "1Ch 28:5", "n": "", "vs": [[5, "ثم اصطفى ابني سليمان من بين أبنائي الكثيرين الذين رزقني بهم الرب، ليخلفني على عرش مملكة الرب، على إسرائيل."]]}, {"l": "Mat 11:26", "n": "", "vs": [[26, "نعم أيها الآب، لأنه هكذا حسن في نظرك."]]}, {"l": "Luk 10:21", "n": "", "vs": [[21, "في تلك الساعة ابتهج يسوع بالروح وقال: «أحمدك أيها الآب، رب السماء والأرض، لأنك حجبت هذه الأمور عن الحكماء والفهماء، وكشفتها للأطفال. نعم، أيها الآب، لأنه هكذا حسن في نظرك!"]]}, {"l": "1Co 1:1", "n": "", "vs": [[1, "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"]]}, {"l": "Eph 1:5", "n": "", "vs": [[5, "إذ سبق فعيننا في المحبة ليتخذنا أبناء له بيسوع المسيح. وذلك موافق للقصد الذي سرت به مشيئته،"]]}, {"l": "Eph 1:9", "n": "", "vs": [[9, "إذ كشف لنا سر مشيئته بحسب مرضاته التي قصدها في نفسه،"]]}, {"l": "Eph 3:11", "n": "", "vs": [[11, "وفقا للقصد الأزلي الذي قصده الله في المسيح يسوع ربنا،"]]}], "kwAr": "لما سر الله", "noteAr": ""}, {"kw": "who", "raw": "Isa_49:1, Isa_49:5; Jer_1:5; Luk_1:15, Luk_1:16; Act_9:15, Act_13:2, Act_22:14, Act_22:15; Rom_1:1", "note": "", "refs": [{"l": "Isa 49:1", "n": "", "vs": [[1, "أنصتي إلي أيتها الجزائر، واصغوا ياشعوب البلاد البعيدة: قد دعاني الرب وأنا مازلت جنينا، وذكر اسمي وأنا ما برحت في رحم أمي."]]}, {"l": "Isa 49:5", "n": "", "vs": [[5, "والآن قال لي الرب الذي كونني في رحم أمي لأكون له خادما، حتى أرد ذرية يعقوب إليه، فيجتمع بنو إسرائيل حوله، فأتمجد في عيني الرب ويكون إلهي قوتي:"]]}, {"l": "Jer 1:5", "n": "", "vs": [[5, "«قبلما شكلتك في أحشاء أمك عرفتك، وقبلما ولدت أفرزتك، وأقمتك نبيا للأمم»."]]}, {"l": "Luk 1:15", "n": "", "vs": [[15, "وسوف يكون عظيما أمام الرب، ولا يشرب خمرا ولا مسكرا، ويمتليء بالروح القدس وهو بعد في بطن أمه،"]]}, {"l": "Luk 1:16", "n": "", "vs": [[16, "ويرد كثيرين
