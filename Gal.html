], [" أيضا ", []], ["انساق", ["G4879"]], [" إلى ", []], ["ريائهم", ["G5272"]], [".", []]]}, {"c": 2, "v": 14, "text": "فلما رأيت أنهم لا يسلكون باستقامة توافق حق الإنجيل، قلت لبطرس أمام الحاضرين جميعا: «إن كنت وأنت يهودي تعيش كالأمم لا كاليهود، فكيف تجبر الأمم أن يعيشوا كاليهود؟»", "groups": [{"kw": "walked", "raw": "Psa_15:2, Psa_58:1, Psa_84:11; Pro_2:7, Pro_10:9", "note": "", "refs": [{"l": "Psa 15:2", "n": "", "vs": [[2, "السالك بالاستقامة، الصانع البر، والصادق القلب."]]}, {"l": "Psa 58:1", "n": "", "vs": [[1, "أحقا تنطقون بالحق أيها الحكام، وتقضون بالاستقامة يابني البشر؟"]]}, {"l": "Psa 84:11", "n": "", "vs": [[11, "لأن الرب الإله شمس وترس. الرب يعطي نعمة ومجدا؛ لا يمنع أي خير عن السالكين بالاستقامة."]]}, {"l": "Pro 2:7", "n": "", "vs": [[7, "يذخر للمستقيمين فطنة، وهو ترس للسالكين بالكمال."]]}, {"l": "Pro 10:9", "n": "", "vs": [[9, "من يسلك باستقامة يسير مطمئنا، وذو الطرق المنحرفة يفتضح."]]}], "kwAr": "لا يسلكون باستقامة", "noteAr": ""}, {"kw": "the truth", "raw": "Gal_2:5; Rom_14:14; 1Ti_4:3-5; Heb_9:10", "note": "", "refs": [{"l": "Gal 2:5", "n": "", "vs": [[5, "فلم نخضع لهم مستسلمين ولو لساعة واحدة، ليبقى حق الإنجيل ثابتا عندكم."]]}, {"l": "Rom 14:14", "n": "", "vs": [[14, "فأنا عالم، بل مقتنع من الرب يسوع، أنه لا شيء نجس في ذاته. أما إن اعتبر أحد شيئا ما نجسا، فهو نجس في نظره."]]}, {"l": "1Ti 4:3-5", "n": "", "vs": [[3, "يحرمون الزواج، ويأمرون بالامتناع عن أطعمة خلقها الله ليتناولها المؤمنون وعارفو الحق شاكرين."], [4, "فإن كل ما خلقه الله جيد، ولا شيء منه يرفض إذا تناوله الإنسان شاكرا؛"], [5, "لأنه يصير مقدسا بكلمة الله والصلاة."]]}, {"l": "Heb 9:10", "n": "", "vs": [[10, "إذ إن نظام العهد السابق قد اقتصر على تحريم بعض المأكولات والمشروبات وتحليل غيرها، وعلى وضع النظم المختصة بطقوس الاغتسال المختلفة. بل إن كل ما ضمه ذلك النظام، كان قوانين جسدية ينتهي عملها حين يأتي وقت الإصلاح."]]}], "kwAr": "حق الإنجيل", "noteAr": ""}, {"kw": "I said", "raw": "Gal_2:11; Lev_19:17; Psa_141:5; Pro_27:5, Pro_27:6; 1Ti_5:20", "note": "", "refs": [{"l": "Gal 2:11", "n": "", "vs": [[11, "ولكن لما جاء بطرس إلى مدينة أنطاكية، قاومته وجها لوجه لأنه كان يستحق أن يلام."]]}, {"l": "Lev 19:17", "n": "", "vs": [[17, "لا تبغض أخاك في قلبك، بل إنذارا تنذره لئلا تكون شريكا في ذنبه."]]}, {"l": "Psa 141:5", "n": "", "vs": [[5, "ليضربني الصديق فذلك رحمة، وليوبخني فذلك زيت عاطر لرأسي. أما الأشرار فإني أصلي دائما (كي تحفظني من أفعالهم الأثيمة)."]]}, {"l": "Pro 27:5", "n": "", "vs": [[5, "التوبيخ الظاهر خير من الحب المضمر."]]}, {"l": "Pro 27:6", "n": "", "vs": [[6, "أمينة هي جروح المحب، وخادعة هي قبلات العدو"]]}, {"l": "1Ti 5:20", "n": "", "vs": [[20, "فإذا ثبت أن المتهم مخطيء، وبخه أمام الجميع، ليكون عند الباقين خوف!"]]}], "kwAr": "قلت لبطرس أمام الحاضرين", "noteAr": ""}, {"kw": "If thou", "raw": "Gal_2:12, Gal_2:13; Act_10:28, 11:3-18", "note": "", "refs": [{"l": "Gal 2:12", "n": "", "vs": [[12, "إذ قبل أن يأتي بعضهم من عند يعقوب، كان بطرس يأكل مع الإخوة الذين من الأمم؛ ولكن لما أتى أولئك، انسحب وعزل نفسه، خوفا من أهل الختان."]]}, {"l": "Gal 2:13", "n": "", "vs": [[13, "وجاراه في ريائه باقي الإخوة الذين من اليهود. حتى إن برنابا أيضا انساق إلى ريائهم."]]}, {"l": "Act 10:28", "n": "", "vs": [[28, "فقال لهم: «أنتم تعلمون أنه محرم على اليهودي أن يتعامل مع الأجنبي أو يزوره في بيته. غير أن الله أراني ألا أقول عن إنسان ما إنه دنس أو نجس."]]}, {"l": "Act 11:3-18", "n": "", "vs": [[3, "«كيف دخلت بيت رجال غير مختونين، وأكلت معهم؟»"], [4, "فشرح لهم بطرس ما حدث على التوالي، وقال:"], [5, "«كنت أصلي في مدينة يافا، فوقعت علي غيبوبة، فرأيت في رؤيا وعاء يشبه قطعة كبيرة من القماش مربوطة بأطرافها الأربعة، وقد تدلى إلي من السماء."], [6, "وعندما تأملته مليا وجدت فيه أنواع الحيوانات الدابة على الأرض والوحوش والزواحف وطيور السماء جميعا،"], [7, "وسمعت صوتا يقول لي: يابطرس، قم اذبح وكل!"], [8, "فأجبت: كلا يارب، فلم يدخل فمي قط شيء محرم أو نجس."], [9, "فقال لي الصوت السماوي أيضا: ما طهره الله لا تحسبه أنت نجسا."], [10, "وتكرر هذا ثلاث مرات، ثم سحب الوعاء بما فيه إلى السماء."], [11, "وإذا ثلاثة رجال مرسلون إلي من قيصرية وصلوا إلى البيت الذي كنت مقيما فيه،"], [12, "فأمرني الروح أن أذهب معهم بلا تردد، فذهبت، ورافقني هؤلاء الإخوة الستة. وعند دخولنا بيت الرجل،"], [13, "أخبرنا كيف رأى الملاك في بيته واقفا وقائلا له: أرسل رجالا إلى يافا، واستدع سمعان الملقب بطرس،"], [14, "وهو يكلمك كلاما به تخلص أنت وأهل بيتك جميعا."], [15, "ولما ابتدأت أتكلم، حل الروح القدس عليهم كما حل علينا في البداية"], [16, "فتذكرت ما قاله الرب لنا: إن يوحنا عمد بالماء، وأما أنتم فستتعمدون بالروح القدس."], [17, "فإن كان الله قد ساواهم بنا فأعطاهم الهبة التي أعطانا، إذ آمنا بالرب يسوع المسيح، فمن أكون أنا حتى أعيق الله ؟»"], [18, "فلما سمع المعارضون هذا، سكتوا، ومجدوا الله قائلين: «إذن، قد أنعم الله أيضا على غير اليهود بالتوبة لنوال الحياة»."]]}], "kwAr": "إن كنت وأنت يهودي", "noteAr": ""}, {"kw": "why", "raw": "Gal_2:3, Gal_6:12; Act_15:10,Act_15:11, Act_15:19-21, Act_15:24, Act_15:28, Act_15:29", "note": "", "refs": [{"l": "Gal 2:3", "n": "", "vs": [[3, "ولكن، حتى تيطس الذي كان يرافقني وهو يوناني، لم يضطر أن يختن."]]}, {"l": "Gal 6:12", "n": "", "vs": [[12, "إن الذين يريدون أن يظهروا في الجسد بمظهر حسن، أولئك يرغمونكم أن تختنوا، فقط لئلا يلقوا الاضطهاد بسبب صليب المسيح."]]}, {"l": "Act 15:10", "n": "", "vs": [[10, "فلماذا تعارضون الله فتحملون تلاميذ الرب عبئا ثقيلا عجز الآباء وعجزنا نحن عن حمله؟"]]}, {"l": "Act 15:11", "n": "", "vs": [[11, "فنحن نؤمن بأننا نخلص، كما يخلصون هم، بنعمة الرب يسوع."]]}, {"l": "Act 15:19-21", "n": "", "vs": [[19, "لذلك أرى أن لا نضع عبئا على المهتدين إلى الله من غير اليهود،"], [20, "بل نكتب إليهم رسالة نوصيهم فيها بأن يمتنعوا عن الأكل من الذبائح النجسة المقربة للأصنام، وعن ارتكاب الزنى، وعن تناول لحوم الحيوانات المخنوقة، وعن الدم."], [21, "فإن لموسى، منذ القدم، أتباعا في كل مدينة، يقرأون شريعته ويبشرون بها في المجامع كل سبت»."]]}, {"l": "Act 15:24", "n": "", "vs": [[24, "علمنا أن بعض الأشخاص ذهبوا من عندنا إليكم، دون تفويض منا فأثاروا بكلامهم الاضطراب بينكم وأقلقوا أفكاركم."]]}, {"l": "Act 15:28", "n": "", "vs": [[28, "فقد رأى الروح القدس ونحن، أن لا نحملكم أي عبء فوق ما يتوجب عليكم."]]}, {"l": "Act 15:29", "n": "", "vs": [[29, "إنما عليكم أن تمتنعوا عن الأكل من الذبائح المقربة للأصنام، وعن تناول الدم ولحوم الحيوانات المخنوقة، وعن ارتكاب الزنى. وتحسنون عملا إن حفظتم أنفسكم من هذه الأمور. عافاكم الله !»"]]}], "kwAr": "فكيف تجبر الأمم", "noteAr": ""}], "arS": [["فلما ", []], ["رأيت", ["G1492"]], [" أنهم لا ", []], ["يسلكون باستقامة", ["G3716"]], [" توافق ", []], ["حق", ["G225"]], [" ", []], ["الإنجيل", ["G2098"]], ["، ", []], ["قلت", ["G2036"]], [" ", []], ["لبطرس", ["G4074"]], [" ", []], ["أمام", ["G1715"]], [" الحاضرين ", []], ["جميعا", ["G3956"]], [": «إن كنت وأنت ", []], ["يهودي", ["G2453"]], [" ", []], ["تعيش", ["G2198"]], [" ", []], ["كالأمم", ["G1483"]], [" لا ", []], ["كاليهود", ["G2452"]], ["، فكيف ", []], ["تجبر", ["G315"]], [" ", []], ["الأمم", ["G1484"]], [" أن يعيشوا ", []], ["كاليهود", ["G2450"]], ["؟»", []]]}, {"c": 2, "v": 15, "text": "نحن يهود بالولادة، ولسنا أمما خاطئين.", "groups": [{"kw": "Jews", "raw": "Mat_3:7-9; Joh_8:39-41; Rom_4:16; Eph_2:3", "note": "", "refs": [{"l": "Mat 3:7-9", "n": "", "vs": [[7, "ولما رأى يوحنا كثيرين من الفر يسيين والصدوقيين يأتون إليه ليتعمدوا، قال لهم: «ياأولاد الأفاعي، من أنذركم لتهربوا من الغضب الآتي؟"], [8, "فأثمروا ثمرا يليق بالتوبة."], [9, "ولا تعللوا أنفسكم قائلين: لنا إبراهيم أبا! فإني أقول لكم: إن الله قادر أن يطلع من هذه الحجارة أولادا لإبراهيم."]]}, {"l": "Joh 8:39-41", "n": "", "vs": [[39, "فاعترضوه قائلين: «أبونا هو إبراهيم!» فقال لو كنتم أولاد إبراهيم لعملتم أعمال إبراهيم."], [40, "ولكنكم تسعون إلى قتلي وأنا إنسان كلمتكم بالحق الذي سمعته من الله. وهذا لم يفعله إبراهيم."], [41, "أنتم تعملون أعمال أبيكم!» فقالوا له: «نحن لم نولد من زنا! لنا أب واحد هو الله »."]]}, {"l": "Rom 4:16", "n": "", "vs": [[16, "لذلك، فإن الوعد هو على أساس الإيمان ليكون بحسب النعمة، بقصد أن يكون مضمونا للنسل كله: ليس لأهل الشريعة وحدهم، بل أيضا لأهل الإيمان الذي كان لإبراهيم. فإنه أب لنا جميعا،"]]}, {"l": "Eph 2:3", "n": "", "vs": [[3, "الذين بينهم نحن أيضا كنا نسلك سابقا في شهوات جسدنا، عاملين ما يريده الجسد والأفكار، وكنا بالطبيعة أولاد الغضب كالآخرين أيضا."]]}], "kwAr": "نحن يهود بالولادة", "noteAr": ""}, {"kw": "sinners", "raw": "Mat_9:11; Mar_7:26-28; Act_22:21; Rom_3:9; Eph_2:11, Eph_2:12; Tit_3:3", "note": "", "refs": [{"l": "Mat 9:11", "n": "", "vs": [[11, "وعندما رأى الفريسيون ذلك، قالوا لتلاميذه: «لماذا يأكل معلمكم مع الجباة والخاطئين؟»"]]}, {"l": "Mar 7:26-28", "n": "", "vs": [[26, "وكانت المرأة يونانية، من أصل سوري فينيقي، وتوسلت إليه أن يطرد الشيطان من ابنتها."], [27, "ولكنه قال لها: «دعي البنين أولا يشبعون! فليس من الصواب أن يؤخذ خبز البنين ويطرح للكلاب»."], [28, "فأجابت قائلة له: «صحيح ياسيد! ولكن الكلاب تحت المائدة تأكل من فتات البنين!»"]]}, {"l": "Act 22:21", "n": "", "vs": [[21, "ولكنه قال لي: اذهب ... سأرسلك بعيدا: إلى الأمم!»"]]}, {"l": "Rom 3:9", "n": "", "vs": [[9, "فماذا إذن؟ أنحن اليهود أفضل؟ لا، على الإطلاق! فإننا، في ما سبق، قد اتهمنا اليهود واليونانيين بكونهم جميعا تحت الخطيئة،"]]}, {"l": "Eph 2:11", "n": "", "vs": [[11, "لذلك اذكروا، أنتم الأمم في الجسد سابقا، يامن تسمون أهل عدم الختان من قبل من يسمون أهل الختان الذي يجري في الجسد باليد،"]]}, {"l": "Eph 2:12", "n": "", "vs": [[12, "أنكم كنتم في ذلك الحين بلا مسيح، أجانب عن جماعة إسرائيل، وغرباء عن العهود الموعودة، لا رجاء لكم، ومنكرين لله في العالم."]]}, {"l": "Tit 3:3", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."]]}], "kwAr": "أمما خاطئين", "noteAr": ""}], "arS": [["نحن ", []], ["يهود", ["G2453"]], [" ", []], ["بالولادة", ["G5449"]], ["، ولسنا ", []], ["أمما", ["G1484"]], [" ", []], ["خاطئين", ["G268"]], [".", []]]}, {"c": 2, "v": 16, "text": "ولكننا، إذ علمنا أن الإنسان لا يتبرر على أساس الأعمال المطلوبة في الشريعة بل فقط بالإيمان بيسوع المسيح، آمنا نحن أيضا بالمسيح يسوع، لنتبرر على أساس الإيمان به، لا على أساس أعمال الشريعة، لأنه على أعمال الشريعة لا يبرر أي إنسان.", "groups": [{"kw": "that", "raw": "Gal_2:19, Gal_3:10-12, Gal_5:4; Job_9:2, Job_9:3, Job_9:29, Job_25:4; Psa_130:3, Psa_130:4; Luk_10:25-29; Act_13:38, Act_13:39; Rom_3:19, Rom_3:20,Rom_3:27, Rom_3:28, Rom_4:2, Rom_4:13-15; Phi_3:9", "note": "", "refs": [{"l": "Gal 2:19", "n": "", "vs": [[19, "فإنني، بالشريعة، قد مت عن الشريعة، لكي أحيا لله."]]}, {"l": "Gal 3:10-12", "n": "", "vs": [[10, "أما جميع الذين على مبدأ أعمال الشريعة، فإنهم تحت اللعنة، لأنه قد كتب: «ملعون كل من لا يثبت على العمل بكل ما هو مكتوب في كتاب الشريعة!»"], [11, "أما أن أحدا لا يتبر ر عند الله بفضل الشريعة، فذلك واضح، لأن «من تبرر بالإيمان فبالإيمان يحيا»."], [12, "ولكن الشريعة لا تراعي مبدأ الإيمان، بل «من عمل بهذه الوصايا، يحيا بها»."]]}, {"l": "Gal 5:4", "n": "", "vs": [[4, "يامن تريدون التبرير عن طريق الشريعة، قد حرمتم المسيح وسقطتم من النعمة!"]]}, {"l": "Job 9:2", "n": "", "vs": [[2, "«قد علمت يقينا أن الأمر كذلك، ولكن كيف يتبرر الإنسان أمام الله؟"]]}, {"l": "Job 9:3", "n": "", "vs": [[3, "إن شاء المرء أن يتحاج معه، فإنه يعجز عن الإجابة عن واحد من ألف."]]}, {"l": "Job 9:29", "n": "", "vs": [[29, "أنا مستذنب، فلماذا أجاهد عبثا؟"]]}, {"l": "Job 25:4", "n": "", "vs": [[4, "فكيف يتبرر الإنسان عند الله، وكيف يزكو مولود المرأة؟"]]}, {"l": "Psa 130:3", "n": "", "vs": [[3, "إن كنت يارب تترصد الآثام، فمن يستطيع الوقوف في محضرك؟"]]}, {"l": "Psa 130:4", "n": "", "vs": [[4, "ولأنك مصدر الغفران فإن جميع الناس يهابونك."]]}, {"l": "Luk 10:25-29", "n": "", "vs": [[25, "وتصدى له أحد علماء الشريعة ليجربه، فقال: «يامعلم، ماذا أعمل لأرث الحياة الأبدية؟»"], [26, "فقال له: «ماذا كتب في الشريعة؟ وكيف تقرأها؟»"], [27, "فأجاب: «أحب الرب إلهك بكل قلبك وكل نفسك وكل قدرتك وكل فكرك، وأحب قريبك كنفسك»."], [28, "فقال له: «جوابك صحيح. فإن عملت بهذا، تحيا!»"], [29, "لكنه إذ كان راغبا في تبرير نفسه، سأل يسوع: «ومن هو قريبي؟»"]]}, {"l": "Act 13:38", "n": "", "vs": [[38, "فاعلموا، أيها الإخوة، أنه بيسوع تبشرون بغفران الخطايا ،"]]}, {"l": "Act 13:39", "n": "", "vs": [[39, "وأنه به يتبرر كل من يؤمن من كل ما عجزت شريعة موسى أن تبرره منه."]]}, {"l": "Rom 3:19", "n": "", "vs": [[19, "ونحن نعلم أن كل ما تقوله الشريعة إنما تخاطب به الذين هم تحت الشريعة، لكي يسد كل فم ويقع العالم كله تحت دينونة من الله."]]}, {"l": "Rom 3:20", "n": "", "vs": [[20, "فإن أحدا من البشر لا يتبرر أمامه بالأعمال المطلوبة في الشريعة. إذ إن الشريعة هي لإظهار الخطيئة."]]}, {"l": "Rom 3:27", "n": "", "vs": [[27, "إذن، أين الافتخار؟ إنه قد أبطل! وعلى أي أساس؟ أعلى أساس الأعمال؟ لا، بل على أساس الإيمان،"]]}, {"l": "Rom 3:28", "n": "", "vs": [[28, "لأننا قد استنتجنا أن الإنسان يتبرر بالإيمان، بمعزل عن الأعمال المطلوبة في الشريعة."]]}, {"l": "Rom 4:2", "n": "", "vs": [[2, "فلو كان إبراهيم قد تبرر على أساس الأعمال، لكان من حقه أن يفتخر، ولكن ليس أمام الله."]]}, {"l": "Rom 4:13-15", "n": "", "vs": [[13, "فليس على أساس الشريعة كان الوعد لإبراهيم، أو لنسله، بأن يكون وارثا للعالم، وإنما على أساس البر الذي بالإيمان."], [14, "فلو كان أهل الشريعة هم أصحاب الإرث، لصار الإيمان بلا فاعلية ونقض الوعد."], [15, "لأن الشريعة إنما تنتج الغضب؛ فلولا الشريعة لما ظهرت المخالفة."]]}, {"l": "Phi 3:9", "n": "", "vs": [[9, "ويكون لي فيه مقام، إذ ليس لي بري الذاتي القائم على أساس الشريعة، بل البر الآتي من الإيمان بالمسيح، البر الذي من عند الله على أساس الإيمان."]]}], "kwAr": "إذ علمنا أن الإنسان لا يتبرر", "noteAr": ""}, {"kw": "but", "raw": "Gal_3:13, Gal_3:14, Gal_3:22-24, Gal_4:5; Rom_1:17, Rom_3:21-26, Rom_3:28, Rom_3:30, Rom_4:5, Rom_4:6, Rom_4:24, Rom_4:25, Rom_5:1, Rom_5:2, Rom_5:8, Rom_5:9; Rom_8:3, Rom_8:30-34; 1Co_6:11; 2Co_5:19-21; Phi_3:9; Heb_7:18, Heb_7:19", "note": "", "refs": [{"l": "Gal 3:13", "n": "", "vs": [[13, "إن المسيح حررنا بالفداء من لعنة الشريعة، إذ صار لعنة عوضا عنا، لأنه قد كتب: «ملعون كل من علق على خشبة»،"]]}, {"l": "Gal 3:14", "n": "", "vs": [[14, "لكي تصل بركة إبراهيم إلى الأمم في المسيح يسوع، فننال عن طريق الإيمان الروح الموعود."]]}, {"l": "Gal 3:22-24", "n": "", "vs": [[22, "ولكن الكتاب حبس الجميع تحت الخطيئة، حتى إن الوعد، على أساس الإيمان بيسوع المسيح، يوهب للذين يؤمنون."], [23, "فقبل مجيء الإيمان، كنا تحت حراسة الشريعة، محتجزين إلى أن يعلن الإيمان الذي كان إعلانه منتظرا."], [24, "إذن، كانت الشريعة هي مؤدبنا حتى مجيء المسيح، لكي نبرر على أساس الإيمان."]]}, {"l": "Gal 4:5", "n": "", "vs": [[5, "ليحرر بالفداء أولئك الخاضعين للشريعة، فننال جميعا مقام أبناء الله."]]}, {"l": "Rom 1:17", "n": "", "vs": [[17, "ففيه قد أعلن البر الذي يمنحه الله على أساس الإيمان والذي يؤدي إلى الإيمان، على حد ما قد كتب: «أما من تبرر بالإيمان، فبالإيمان يحيا»."]]}, {"l": "Rom 3:21-26", "n": "", "vs": [[21, "أما الآن، فقد أعلن البر الذي يمنحه الله ، مستقلا عن الشريعة، ومشهودا له من الشريعة والأنبياء،"], [22, "ذلك البر الذي يمنحه الله على أساس الإيمان بيسوع المسيح لجميع الذين يؤمنون. إذ لا فرق،"], [23, "لأن الجميع قد أخطأوا وهم عاجزون عن بلوغ ما يمجد الله ."], [24, "فهم يبررون مجانا، بنعمته، بالفداء بالمسيح يسوع"], [25, "الذي قدمه الله كفارة، عن طريق الإيمان، وذلك بدمه."], [26, "ليظهر بر الله إذ تغاضى، بإمهاله الإلهي، عن الخطايا التي حدثت في الماضي، ويظهر أيضا بره في الزمن الحاضر: فيتبين أنه بار وأنه يبرر من له الإيمان بيسوع."]]}, {"l": "Rom 3:28", "n": "", "vs": [[28, "لأننا قد استنتجنا أن الإنسان يتبرر بالإيمان، بمعزل عن الأعمال المطلوبة في الشريعة."]]}, {"l": "Rom 3:30", "n": "", "vs": [[30, "مادام الله الواحد هو الذي سيبرر أهل الختان على أساس الإيمان، وأهل عدم الختان على أساس الإيمان."]]}, {"l": "Rom 4:5", "n": "", "vs": [[5, "وإنما يؤمن بمن يبرر الأثيم، فإن إيمانه يحسب له برا."]]}, {"l": "Rom 4:6", "n": "", "vs": [[6, "كما يهنيء داود أيضا الإنسان الذي يحسب له الله برا بمعزل عن الأعمال، إذ يقول:"]]}, {"l": "Rom 4:24", "n": "", "vs": [[24, "بل أيضا من أجلنا، نحن الذين سيحسب ذلك لنا إذ نؤمن بمن أقام من بين الأموات يسوع ربنا"]]}, {"l": "Rom 4:25", "n": "", "vs": [[25, "الذي أسلم للموت من أجل معاصينا ثم أقيم من أجل تبريرنا."]]}, {"l": "Rom 5:1", "n": "", "vs": [[1, "فبما أننا قد تبررنا على أساس الإيمان، صرنا في سلام مع الله بربنا يسوع المسيح."]]}, {"l": "Rom 5:2", "n": "", "vs": [[2, "وبه أيضا تم لنا الدخول بالإيمان إلى هذه النعمة التي نقيم فيها الآن؛ ونحن نفتخر برجائنا في التمتع بمجد الله."]]}, {"l": "Rom 5:8", "n": "", "vs": [[8, "ولكن الله أثبت لنا محبته، إذ ونحن مازلنا خاطئين مات المسيح عوضا عنا."]]}, {"l": "Rom 5:9", "n": "", "vs": [[9, "ومادمنا الآن قد تبررنا بدمه، فكم بالأحرى نخلص به من الغضب الآتي!"]]}, {"l": "Rom 8:3", "n": "", "vs": [[3, "فإن ما عجزت الشريعة عنه، لكون الجسد قد جعلها قاصرة عن تحقيقه، أتمه الله إذ أرسل ابنه، متخذا ما يشبه جسد الخطيئة ومكفرا عن الخطيئة فدان الخطيئة في الجسد"]]}, {"l": "Rom 8:30-34", "n": "", "vs": [[30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."], [31, "فبعد هذا، ماذا نقول؟ مادام الله معنا، فمن يكون علينا؟ ذاك الذي لم يمسك عنا ابنه،"], [32, "بل بذله لأجلنا جميعا، كيف لا يجود علينا معه بكل شيء أيضا؟"], [33, "ومن سيتهم مختاري الله؟ إن الله هو الذي يبرر،"], [34, "فمن ذا يدين؟ إنه المسيح يسوع هو الذي مات، بل بالأحرى قام، وهو أيضا عن يمين الله، وهو يشفع فينا أيضا."]]}, {"l": "1Co 6:11", "n": "", "vs": [[11, "وهكذا كان بعضكم، إلا أنكم قد اغتسلتم، بل تقدستم، بل تبررتم، باسم الرب يسوع المسيح وبروح إلهنا."]]}, {"l": "2Co 5:19-21", "n": "", "vs": [[19, "ذلك أن الله كان في المسيح مصالحا العالم مع نفسه، غير حاسب عليهم خطاياهم، وقد وضع بين أيدينا رسالة هذه المصالحة."], [20, "فنحن إذن سفراء المسيح، وكأن الله يعظ بنا نتوسل بالنيابة عن المسيح منادين: «تصالحوا مع الله!»"], [21, "فإن الذي لم يعرف خطيئة، جعله الله خطيئة لأجلنا، لنصير نحن بر الله فيه."]]}, {"l": "Phi 3:9", "n": "", "vs": [[9, "ويكون لي فيه مقام، إذ ليس لي بري الذاتي القائم على أساس الشريعة، بل البر الآتي من الإيمان بالمسيح، البر الذي من عند الله على أساس الإيمان."]]}, {"l": "Heb 7:18", "n": "", "vs": [[18, "هكذا، يتبين أن نظام الكهنوت القديم قد ألغي لأنه عاجز وغير نافع."]]}, {"l": "Heb 7:19", "n": "", "vs": [[19, "فالشريعة لم توصل الذين كانوا يعبدون الله بحسبها ولو إلى أدنى درجات الكمال. ولذلك، وضع الله أساسا جديدا للاقتراب إليه، مقدما لنا رجاء أفضل."]]}], "kwAr": "بل فقط بالإيمان بيسوع المسيح", "noteAr": ""}, {"kw": "we have", "raw": "Gal_2:20; Joh_6:68, Joh_6:69, Joh_20:31; Act_4:12; 1Pe_1:2, 1Pe_1:8, 1Pe_1:9, 1Pe_1:18-21, 1Pe_2:24, 1Pe_3:18; 2Pe_1:1; 1Jo_1:7, 1Jo_2:1, 1Jo_2:2; Rev_7:9, Rev_7:14", "note": "", "refs": [{"l": "Gal 2:20", "n": "", "vs": [[20, "مع المسيح صلبت، وفيما بعد لا أحيا أنا بل المسيح يحيا في. أما الحياة التي أحياها الآن في الجسد، فإنما أحياها بالإيمان في ابن الله، الذي أحبني وبذل نفسه عني."]]}, {"l": "Joh 6:68", "n": "", "vs": [[68, "فأجابه سمعان بطرس: «إلى من نذهب يار ب وعندك كلام الحياة الأبدية."]]}, {"l": "Joh 6:69", "n": "", "vs": [[69, "نحن آمنا وعرفنا أنك قدوس الله!»"]]}, {"l": "Joh 20:31", "n": "", "vs": [[31, "وأما هذه الآيات فقد دونت لتؤمنوا بأن يسوع هو المسيح ابن الله، ولكي تكون لكم حياة باسمه إذ تؤمنون."]]}, {"l": "Act 4:12", "n": "", "vs": [[12, "وليس بأحد غيره الخلاص، إذ ليس تحت السماء اسم آخر قدمه الله للبشر به يجب أن نخلص!»"]]}, {"l": "1Pe 1:2", "n": "", "vs": [[2, "بحسب علمه السابق ثم قدسهم بالروح ليطيعوا يسوع المسيح ويطهروا برش دمه عليهم."]]}, {"l": "1Pe 1:8", "n": "", "vs": [[8, "أنتم لم تروا المسيح، ولكنكم تحبونه. ومع أنكم لا ترونه الآن، فأنتم تؤمنون به وتبتهجون بفرح مجيد يفوق الوصف."]]}, {"l": "1Pe 1:9", "n": "", "vs": [[9, "إذ بلغتم هدف إيمانكم، وهو خلاص نفوسكم."]]}, {"l": "1Pe 1:18-21", "n": "", "vs": [[18, "واعلموا أنه قد دفع الفدية ليحرركم من سيرة حياتكم الباطلة التي أخذتموها بالتقليد عن آبائكم. وهذه الفدية لم تكن شيئا فانيا كالفضة أو الذهب،"], [19, "بل كانت دما ثمينا، دم المسيح، ذلك الحمل الطاهر الذي ليس فيه عيب ولا دنس!"], [20, "ومع أن الله كان قد عين المسيح لهذا الغرض قبل تأسيس العالم، فهو لم يعلنه إلا في هذا الزمن الأخير لفائدتكم"], [21, "أنتم الذين تؤمنون بالله بالمسيح الذي أقامه من الموت وأعطاه المجد، حتى يكون الله غاية إيمانكم ورجائكم."]]}, {"l": "1Pe 2:24", "n": "", "vs": [[24, "وهو نفسه حمل خطايانا في جسده (عندما مات مصلوبا) على الخشبة، لكي نموت بالنسبة للخطايا فنحيا حياة البر. وبجراحه هو تم لكم الشفاء،"]]}, {"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}, {"l": "2Pe 1:1", "n": "", "vs": [[1, "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"]]}, {"l": "1Jo 1:7", "n": "", "vs": [[7, "ولكن، إن كنا فعلا نعيش في النور، كما هو في النور، تكون لنا حقا شركة بعضنا مع بعض، ودم ابنه يسوع يطهرنا من كل خطيئة."]]}, {"l": "1Jo 2:1", "n": "", "vs": [[1, "ياأولادي الصغار، أكتب إليكم هذه الأمور لكي لا تخطئوا. ولكن، إن أخطأ أحدكم، فلنا عند الآب شفيع هو يسوع المسيح البار."]]}, {"l": "1Jo 2:2", "n": "", "vs": [[2, "فهو كفارة لخطايانا، لا لخطايانا فقط، بل لخطايا العالم كله."]]}, {"l": "Rev 7:9", "n": "", "vs": [[9, "ثم نظرت، فرأيت جمعا كثيرا لا يحصى، من كل أمة وقبيلة وشعب ولغة، واقفين أمام العرش وأمام الحمل، وقد ارتدوا ثيا با بيضاء، وأمسكوا بأيديهم سعف النخل،"]]}, {"l": "Rev 7:14", "n": "", "vs": [[14, "فأجبته: «أنت أعلم ياسيدي!» فقال: «هؤلاء هم الذين أتوا من الضيقة العظيمة، وقد غسلوا ثيابهم وبيضوها بدم الحمل."]]}], "kwAr": "آمنا نحن أيضا", "noteAr": ""}, {"kw": "for", "raw": "Gal_3:11; Psa_143:2", "note": "", "refs": [{"l": "Gal 3:11", "n": "", "vs": [[11, "أما أن أحدا لا يتبر ر عند الله بفضل الشريعة، فذلك واضح، لأن «من تبرر بالإيمان فبالإيمان يحيا»."]]}, {"l": "Psa 143:2", "n": "", "vs": [[2, "لا تحاكم عبدك، فلن يتبرر أمامك إنسان."]]}], "kwAr": "لأنه على أعمال الشريعة", "noteAr": ""}], "arS": [["ولكننا، إذ ", []], ["علمنا", ["G1492"]], [" أن ", []], ["الإنسان", ["G444"]], [" لا ", []], ["يتبرر", ["G1344"]], [" على أساس ", []], ["الأعمال", ["G2041"]], [" المطلوبة في ", []], ["الشريعة", ["G3551"]], [" بل فقط ", []], ["بالإيمان", ["G4102"]], [" ", []], ["بيسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], ["، ", []], ["آمنا", ["G4100"]], [" نحن أيضا ", []], ["بالمسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], ["، ", []], ["لنتبرر", ["G1344"]], [" على أساس ", []], ["الإيمان", ["G4102"]], [" به، لا على أساس ", []], ["أعمال", ["G2041"]], [" ", []], ["الشريعة", ["G3551"]], ["، لأنه على ", []], ["أعمال", ["G2041"]], [" ", []], ["الشريعة", ["G3551"]], [" لا ", []], ["يبرر", ["G1344"]], [" أي ", []], ["إنسان", ["G4561"]], [".", []]]}, {"c": 2, "v": 17, "text": "ولكن، إن كنا ونحن نسعى أن نتبرر في المسيح، قد وجدنا خاطئين أيضا، فهل يكون المسيح خادما للخطيئة؟ حاشا!", "groups": [{"kw": "while", "raw": "Rom_9:30-33, Rom_11:7", "note": "", "refs": [{"l": "Rom 9:30-33", "n": "", "vs": [[30, "فما هي خلاصة القول؟ إن الأمم الذين لم يكونوا يسعون وراء البر، قد بلغوا البر، ولكنه البر القائم على أساس الإيمان."], [31, "أما إسرائيل، وقد كانوا يسعون وراء شريعة تهدف إلى البر، فقد فشلوا حتى في بلوغ الشريعة."], [32, "ولأي سبب؟ لأن سعيهم لم يكن على أساس الإيمان، بل كان وكأن الأمر قائم على الأعمال. فقد تعثروا بحجر العثرة،"], [33, "كما كتب: «ها أنا واضع في صهيون حجر عثرة وصخرة سقوط. ومن يؤمن به لا يخيب»."]]}, {"l": "Rom 11:7", "n": "", "vs": [[7, "فما الخلاصة إذا؟ إن ما يسعى إليه إسرائيل لم ينالوه، بل ناله المختارون منهم، والباقون عميت بصائرهم،"]]}], "kwAr": "ونحن نسعى أن نتبرر", "noteAr": ""}, {"kw": "are found", "raw": "Gal_2:11; Rom_6:1, Rom_6:2; 1Jo_3:8-10", "note": "", "refs": [{"l": "Gal 2:11", "n": "", "vs": [[11, "ولكن لما جاء بطرس إلى مدينة أنطاكية، قاومته وجها لوجه لأنه كان يستحق أن يلام."]]}, {"l": "Rom 6:1", "n": "", "vs": [[1, "إذن ماذا نقول؟ أنستمر في الخطيئة لكي تتوافر النعمة؟"]]}, {"l": "Rom 6:2", "n": "", "vs": [[2, "حاشا! فنحن الذين متنا بالنسبة للخطيئة، كيف نعيش بعد فيها؟"]]}, {"l": "1Jo 3:8-10", "n": "", "vs": [[8, "ولكن من يمارس الخطيئة، يظهر أنه من أولاد إبليس، لأن إبليس يمارس الخطيئة منذ البداية. وقد جاء ابن الله إلى الأرض لكي يبطل أعمال إبليس."], [9, "فكل مولود من الله، لا يمارس الخطيئة، لأن طبيعة الله صارت ثابتة فيه. بل إنه لا يستطيع أن يمارس الخطيئة، لأنه مولود من الله."], [10, "إذن، هذا هو المقياس الذي نميز به بين أولاد الله وأولاد إبليس. من لا يمارس الصلاح، فهو ليس من الله. وكذلك من لا يحب أخاه!"]]}], "kwAr": "قد وجدنا خاطئين", "noteAr": ""}, {"kw": "is", "raw": "Mat_1:21; Rom_15:8; 2Co_3:7-9; Heb_7:24-28, Heb_8:2; 1Jo_3:5", "note": "", "refs": [{"l": "Mat 1:21", "n": "", "vs": [[21, "فستلد ابنا، وأنت تسميه يسوع، لأنه هو الذي يخلص شعبه من خطاياهم»."]]}, {"l": "Rom 15:8", "n": "", "vs": [[8, "فإني أقول إن المسيح صار خادم أهل الختان إظهارا لصدق الله وتوطيدا لوعوده للآباء،"]]}, {"l": "2Co 3:7-9", "n": "", "vs": [[7, "ولكن، مادامت خدمة الموت التي نقشت حروفها في لوح حجر، قد ابتدأت بمجد، حتى إن بني إسرائيل لم يقدروا أن يثبتوا أنظارهم على وجه موسى، بسبب مجد وجهه، ذلك المجد الزائل،"], [8, "أفليس أحرى أن تكون خدمة الروح راسخة في المجد؟"], [9, "فبما أن خدمة الدينونة كانت مجدا، فأحرى كثيرا أن تفوقها في المجد خدمة البر."]]}, {"l": "Heb 7:24-28", "n": "", "vs": [[24, "وأما المسيح، فلأنه حي إلى الأبد، فهو يبقى صاحب كهنوت لا يزول!"], [25, "وهو لذلك قادر دائما أن يحقق الخلاص الكامل للذين يتقربون به إلى الله. فهو، في حضرة الله، حي على الدوام ليتضرع من أجلهم ويحامي عنهم!"], [26, "نعم، هذا هو رئيس الكهنة الذي كنا محتاجين إليه. إنه قدوس، لا عيبة فيه، ولا نجاسة، قد انفصل عن الخاطئين، وارتفع حتى صار أسمى من السماوات."], [27, "وهو لا يحتاج إلى ما كان يحتاج إليه قديما كل رئيس كهنة: أن يقدم الذبائح يوميا للتكفير عن خطاياه الخاصة أولا، ثم عن خطايا الشعب، وذلك لأنه كفر عن خطاياهم مرة واحدة، حين قدم نفسه عنهم."], [28, "إذن، كانت الشريعة تعين كل رئيس كهنة من بين البشر الضعفاء. أما كلمة القسم، التي جاءت بعد الشريعة، فقد عينت ابن الله، المؤهل تماما لمهمته، رئيس كهنة إلى الأبد!"]]}, {"l": "Heb 8:2", "n": "", "vs": [[2, "وهو يقوم بمهمته هناك، في قدس الأقداس: في خيمة العبادة الحقيقية التي نصبها الرب، لا الإنسان."]]}, {"l": "1Jo 3:5", "n": "", "vs": [[5, "وأنتم تعرفون أن المسيح جاء إلى هذه الأرض لكي يحمل الخطايا، مع كونه بلا خطيئة."]]}], "kwAr": "فهل يكون المسيح خادما للخطيئة", "noteAr": ""}, {"kw": "God", "raw": "Rom_3:4, Rom_3:6", "note": "", "refs": [{"l": "Rom 3:4", "n": "", "vs": [[4, "حاشا! وإنما، ليكن الله صادقا وكل إنسان كاذبا، كما قد كتب: «لكي تتبرر في كلامك، وتظفر متى حكمت»."]]}, {"l": "Rom 3:6", "n": "", "vs": [[6, "حاشا! وإلا، فكيف يدين الله العالم؟"]]}], "kwAr": "حاشا", "noteAr": ""}], "arS": [["ولكن، إن كنا ونحن ", []], ["نسعى", ["G2212"]], [" أن ", []], ["نتبرر", ["G1344"]], [" في ", []], ["المسيح", ["G5547"]], ["، قد ", []], ["وجدنا", ["G2147"]], [" ", []], ["خاطئين", ["G268"]], [" أيضا، فهل يكون ", []], ["المسيح", ["G5547"]], [" ", []], ["خادما", ["G1249"]], [" ", []], ["للخطيئة", ["G266"]], ["؟ ", []], ["حاشا", ["G1096", "G3361"]], ["!", []]]}, {"c": 2, "v": 18, "text": "فإذا عدت أبني ما قد هدمته، فإني أجعل نفسي مخالفا.", "groups": [{"kw": "", "raw": "Gal_2:4, Gal_2:5, Gal_2:12-16, Gal_2:21, Gal_4:9-12, Gal_5:11; Rom_14:15; 1Co_8:11, 1Co_8:12", "note": "", "refs": [{"l": "Gal 2:4", "n": "", "vs": [[4, "إنما أثير الأمر بسبب الإخوة الدجالين الذين أدخلوا بيننا خلسة، فاندسوا ليتجسسوا حريتنا التي لنا في المسيح يسوع، لعلهم يعيدوننا إلى العبودية؛"]]}, {"l": "Gal 2:5", "n": "", "vs": [[5, "فلم نخضع لهم مستسلمين ولو لساعة واحدة، ليبقى حق الإنجيل ثابتا عندكم."]]}, {"l": "Gal 2:12-16", "n": "", "vs": [[12, "إذ قبل أن يأتي بعضهم من عند يعقوب، كان بطرس يأكل مع الإخوة الذين من الأمم؛ ولكن لما أتى أولئك، انسحب وعزل نفسه، خوفا من أهل الختان."], [13, "وجاراه في ريائه باقي الإخوة الذين من اليهود. حتى إن برنابا أيضا انساق إلى ريائهم."], [14, "فلما رأيت أنهم لا يسلكون باستقامة توافق حق الإنجيل، قلت لبطرس أمام الحاضرين جميعا: «إن كنت وأنت يهودي تعيش كالأمم لا كاليهود، فكيف تجبر الأمم أن يعيشوا كاليهود؟»"], [15, "نحن يهود بالولادة، ولسنا أمما خاطئين."], [16, "ولكننا، إذ علمنا أن الإنسان لا يتبرر على أساس الأعمال المطلوبة في الشريعة بل فقط بالإيمان بيسوع المسيح، آمنا نحن أيضا بالمسيح يسوع، لنتبرر على أساس الإيمان به، لا على أساس أعمال الشريعة، لأنه على أعمال الشريعة لا يبرر أي إنسان."]]}, {"l": "Gal 2:21", "n": "", "vs": [[21, "إني لا أبطل فاعلية نعمة الله، إذ لو كان البر بالشريعة، لكان موت المسيح عملا لا داعي له."]]}, {"l": "Gal 4:9-12", "n": "", "vs": [[9, "أما الآن وقد عرفتم الله ، بل بالأحرى عرفكم الله ، فكيف ترتدون أيضا إلى تلك المباديء العاجزة الفقيرة التي ترغبون في الرجوع إلى العبودية لها من جديد؟"], [10, "تحتفلون بأيام وأشهر ومواسم وسنين!"], [11, "أخاف عليكم، خشية أن أكون قد تعبت من أجلكم بلا جدوى."], [12, "أتوسل إليكم أيها الإخوة، أن تكونوا مثلي، لأني أنا أيضا مثلكم. أنتم لم تظلموني بشيء،"]]}, {"l": "Gal 5:11", "n": "", "vs": [[11, "وأما أنا، أيها الإخوة، فلو صح أنني مازلت أدعو إلى الختان، فلماذا مازلت ألقى الاضطهاد؟ إذن لكانت العثرة التي في الصليب قد زالت!"]]}, {"l": "Rom 14:15", "n": "", "vs": [[15, "فإن كنت بطعامك تسبب الحزن لأخيك، فلست تسلك بعد بما يتفق مع المحبة. لا تدمر بطعامك من لأجله مات المسيح."]]}, {"l": "1Co 8:11", "n": "", "vs": [[11, "وبذلك يتدمر ذلك الضعيف، وهو أخ لك مات المسيح من أجله، بسبب معرفتك!"]]}, {"l": "1Co 8:12", "n": "", "vs": [[12, "فإذ تخطئون هكذا إلى الإخوة فتجرحون ضمائرهم الضعيفة، إنما تخطئون إلى المسيح."]]}], "kwAr": "", "noteAr": ""}], "arS": [["فإذا عدت ", []], ["أبني", ["G3618"]], [" ما قد ", []], ["هدمته", ["G2647"]], ["، فإني ", []], ["أجعل", ["G4921"]], [" ", []], ["نفسي", ["G1683"]], [" ", []], ["مخالفا", ["G3848"]], [".", []]]}, {"c": 2, "v": 19, "text": "فإنني، بالشريعة، قد مت عن الشريعة، لكي أحيا لله.", "groups": [{"kw": "through", "raw": "Gal_3:10,Gal_3:24; Rom_3:19, Rom_3:20, Rom_4:15, Rom_5:20, Rom_7:7-11, Rom_7:14, Rom_7:22, Rom_7:23, Rom_8:2, Rom_10:4, Rom_10:5", "note": "", "refs": [{"l": "Gal 3:10", "n": "", "vs": [[10, "أما جميع الذين على مبدأ أعمال الشريعة، فإنهم تحت اللعنة، لأنه قد كتب: «ملعون كل من لا يثبت على العمل بكل ما هو مكتوب في كتاب الشريعة!»"]]}, {"l": "Gal 3:24", "n": "", "vs": [[24, "إذن، كانت الشريعة هي مؤدبنا حتى مجيء المسيح، لكي نبرر على أساس الإيمان."]]}, {"l": "Rom 3:19", "n": "", "vs": [[19, "ونحن نعلم أن كل ما تقوله الشريعة إنما تخاطب به الذين هم تحت الشريعة، لكي يسد كل فم ويقع العالم كله تحت دينونة من الله."]]}, {"l": "Rom 3:20", "n": "", "vs": [[20, "فإن أحدا من البشر لا يتبرر أمامه بالأعمال المطلوبة في الشريعة. إذ إن الشريعة هي لإظهار الخطيئة."]]}, {"l": "Rom 4:15", "n": "", "vs": [[15, "لأن الشريعة إنما تنتج الغضب؛ فلولا الشريعة لما ظهرت المخالفة."]]}, {"l": "Rom 5:20", "n": "", "vs": [[20, "وأما الشريعة فقد أدخلت لتظهر كثرة المعصية. ولكن، حيث كثرت الخطيئة، تتوافر النعمة أكثر جدا،"]]}, {"l": "Rom 7:7-11", "n": "", "vs": [[7, "إذن، ماذا نقول؟ هل الشريعة خطيئة؟ حاشا! ولكني ما عرفت الخطيئة إلا بالشريعة. فما كنت لأعرف الشهوة لولا قول الشريعة: «لا تشته!»"], [8, "ولكن الخطيئة استغلت هذه الوصية فأثارت في كل شهوة. فإن الخطيئة، لولا الشريعة، ميتة."], [9, "أما أنا فكنت من قبل عائشا بمعزل عن الشريعة؛ ولكن لما جاءت الشريعة عاشت الخطيئة،"], [10, "فمت أنا. والوصية الهادفة إلى الحياة، صارت لي مؤدية إلى الموت."], [11, "فإن الخطيئة، إذ استغلت الوصية، خدعتني وقتلتني بها."]]}, {"l": "Rom 7:14", "n": "", "vs": [[14, "فإننا نعلم أن الشريعة روحية؛ وأما أنا فجسدي بيع عبدا للخطيئة."]]}, {"l": "Rom 7:22", "n": "", "vs": [[22, "أن لدي الشر. فإنني، وفقا للإنسان الباطن في، أبتهج بشريعة الله."]]}, {"l": "Rom 7:23", "n": "", "vs": [[23, "ولكنني أرى في أعضائي ناموسا آخر يحارب الشريعة التي يريدها عقلي، ويجعلني أسيرا لناموس الخطيئة الكائن في أعضائي."]]}, {"l": "Rom 8:2", "n": "", "vs": [[2, "لأن ناموس روح الحياة في المسيح يسوع قد حررني من ناموس الخطيئة ومن الموت."]]}, {"l": "Rom 10:4", "n": "", "vs": [[4, "فإن غاية الشريعة هي المسيح لتبرير كل من يؤمن."]]}, {"l": "Rom 10:5", "n": "", "vs": [[5, "فقد كتب موسى عن البر الآتي من الشريعة: «إن الإنسان الذي يعمل بهذه الأمور، يحيا بها»."]]}], "kwAr": "بالشريعة", "noteAr": ""}, {"kw": "dead", "raw": "Rom_6:2, Rom_6:11, Rom_6:14, Rom_7:4, Rom_7:6, Rom_7:9; Col_2:20, Col_3:3; 1Pe_2:24", "note": "", "refs": [{"l": "Rom 6:2", "n": "", "vs": [[2, "حاشا! فنحن الذين متنا بالنسبة للخطيئة، كيف نعيش بعد فيها؟"]]}, {"l": "Rom 6:11", "n": "", "vs": [[11, "فكذلك أنتم أيضا، احسبوا أنفسكم أمواتا بالنسبة للخطيئة وأحياء لله في المسيح يسوع."]]}, {"l": "Rom 6:14", "n": "", "vs": [[14, "فلن يكون للخطيئة سيادة عليكم، إذ لستم خاضعين للشريعة بل للنعمة."]]}, {"l": "Rom 7:4", "n": "", "vs": [[4, "وهكذا أنتم أيضا ياإخوتي، فإنكم بجسد المسيح الذي مات، قد صرتم أمواتا بالنسبة للشريعة، لكي تصيروا لآخر، إلى المسيح نفسه الذي أقيم من بين الأموات، من أجل أن نثمر لله."]]}, {"l": "Rom 7:6", "n": "", "vs": [[6, "أما الآن، فنحن قد تحررنا من الشريعة، إذ متنا بالنِّسبة لما كان يقيدنا، حتى نكون عبيدا يخدمون وفقا للنظام الروحي الجديد، لا للنظام الحرفي العتيق."]]}, {"l": "Rom 7:9", "n": "", "vs": [[9, "أما أنا فكنت من قبل عائشا بمعزل عن الشريعة؛ ولكن لما جاءت الشريعة عاشت الخطيئة،"]]}, {"l": "Col 2:20", "n": "", "vs": [[20, "فمادمتم قد متم مع المسيح بالنسبة لمباديء العالم، فلماذا، كما لو كنتم عائشين في العالم، تخضعون أنفسكم لفرائض مثل هذه:"]]}, {"l": "Col 3:3", "n": "", "vs": [[3, "فإنكم قد متم، وحياتكم مستورة مع المسيح في الله."]]}, {"l": "1Pe 2:24", "n": "", "vs": [[24, "وهو نفسه حمل خطايانا في جسده (عندما مات مصلوبا) على الخشبة، لكي نموت بالنسبة للخطايا فنحيا حياة البر. وبجراحه هو تم لكم الشفاء،"]]}], "kwAr": "قد مت عن الشريعة", "noteAr": ""}, {"kw": "that", "raw": "Gal_2:20; Rom_14:7, Rom_14:8; 1Co_10:31; 2Co_5:15; 1Th_5:10; Tit_2:14; Heb_9:14; 1Pe_4:1, 1Pe_4:2, 1Pe_4:6", "note": "", "refs": [{"l": "Gal 2:20", "n": "", "vs": [[20, "مع المسيح صلبت، وفيما بعد لا أحيا أنا بل المسيح يحيا في. أما الحياة التي أحياها الآن في الجسد، فإنما أحياها بالإيمان في ابن الله، الذي أحبني وبذل نفسه عني."]]}, {"l": "Rom 14:7", "n": "", "vs": [[7, "فلا أحد منا يحيا لنفسه، ولا أحد يموت لنفسه."]]}, {"l": "Rom 14:8", "n": "", "vs": [[8, "فإن حيينا، فللرب نحيا؛ وإن متنا فللرب نموت. فسواء حيينا أم متنا، فإنما نحن للرب."]]}, {"l": "1Co 10:31", "n": "", "vs": [[31, "فإذا أكلتم أو شربتم أو مهما فعلتم، فافعلوا كل شيء لتمجيد الله."]]}, {"l": "2Co 5:15", "n": "", "vs": [[15, "وهو قد مات عوضا عن الجميع حتى لا يعيش الأحياء في ما بعد لأنفسهم بل للذي مات عوضا عنهم ثم قام."]]}, {"l": "1Th 5:10", "n": "", "vs": [[10, "الذي مات عنا لكي نحيا جميعا معه، سواء كنا في سهر الحياة أم في رقاد الموت!"]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Heb 9:14", "n": "", "vs": [[14, "فكم بالأحرى دم المسيح الذي قدم نفسه لله بروح أزلي ذبيحة لا عيب فيها، يطهر ضمائرنا من الأعمال الميتة لنعبد الله الحي."]]}, {"l": "1Pe 4:1", "n": "", "vs": [[1, "فبما أن المسيح قد تحمل الآلام الجسمية لأجلكم، سلحوا أنفسكم بالاستعداد دائما لتحمل الآلام. فإن من يتحمل الآلام الجسمية، يكون قد قاطع الخطيئة."]]}, {"l": "1Pe 4:2", "n": "", "vs": [[2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."]]}, {"l": "1Pe 4:6", "n": "", "vs": [[6, "ولهذا أبلغت البشارة إلى الأموات أيضا لكي يكونوا دائما أحياء بالروح في نظر الله، مع أن حكم الموت قد نفذ بأجسادهم، فماتوا كغيرهم من الناس."]]}], "kwAr": "لكي أحيا لله", "noteAr": ""}], "arS": [["فإنني، ", []], ["بالشريعة", ["G3551"]], ["، قد ", []], ["مت", ["G599"]], [" عن ", []], ["الشريعة", ["G3551"]], ["، لكي ", []], ["أحيا", ["G2198"]], [" ", []], ["لله", ["G2316"]], [".", []]]}, {"c": 2, "v": 20, "text": "مع المسيح صلبت، وفيما بعد لا أحيا أنا بل المسيح يحيا في. أما الحياة التي أحياها الآن في الجسد، فإنما أحياها بالإيمان في ابن الله، الذي أحبني وبذل نفسه عني.", "groups": [{"kw": "crucified", "raw": "Gal_5:24, Gal_6:14; Rom_6:4-6, Rom_8:3, Rom_8:4; Col_2:11-14", "note": "", "refs": [{"l": "Gal 5:24", "n": "", "vs": [[24, "ولكن الذين صاروا خاصة للمسيح، قد صلبوا الجسد مع الأهواء والشهوات."]]}, {"l": "Gal 6:14", "n": "", "vs": [[14, "أما أنا فحاشا لي أن أفتخر إلا بصليب ربنا يسوع المسيح، الذي به أصبح العالم بالنسبة لي مصلوبا، وأنا أصبحت بالنسبة له مصلوبا."]]}, {"l": "Rom 6:4-6", "n": "", "vs": [[4, "وبسبب ذلك دفنا معه بالمعمودية للموت، حتى كما أقيم المسيح من الأموات بمجد الآب، كذلك نسلك نحن أيضا في حياة جديدة."], [5, "فما دمنا قد اتحدنا به في ما يشبه موته، فإننا سنتحد به أيضا في قيامته."], [6, "فنحن نعلم هذا: أن الإنسان العتيق فينا قد صلب معه لكي يبطل جسد الخطيئة فلا نبقى عبيدا للخطيئة فيما بعد."]]}, {"l": "Rom 8:3", "n": "", "vs": [[3, "فإن ما عجزت الشريعة عنه، لكون الجسد قد جعلها قاصرة عن تحقيقه، أتمه الله إذ أرسل ابنه، متخذا ما يشبه جسد الخطيئة ومكفرا عن الخطيئة فدان الخطيئة في الجسد"]]}, {"l": "Rom 8:4", "n": "", "vs": [[4, "حتى يتم فينا البر الذي تسعى إليه الشريعة، فينا نحن السالكين لا بحسب الجسد بل بحسب الروح."]]}, {"l": "Col 2:11-14", "n": "", "vs": [[11, "وفيه أيضا ختنتم أنتم ختانا لم تجره الأيدي، إذ نزع عنكم جسد الخطايا البشري وهذا هو ختان المسيح:"], [12, "فقد دفنتم معه في المعمودية، وفيها أيضا أقمتم معه، عن طريق إيمانكم بقدرة الله الذي أقامه من بين الأموات."], [13, "فأنتم، إذ كنتم أمواتا في الخطايا وعدم ختانكم الجسدي، أحياكم جميعا معه؛ مسامحا لنا جميعا بالخطايا كلها."], [14, "إذ قد محا صك الفرائض المكتوب علينا والمناقض لمصلحتنا، بل إنه قد أزاله من الوسط، مسمرا إياه على الصليب."]]}], "kwAr": "مع المسيح صلبت", "noteAr": ""}, {"kw": "nevertheless", "raw": "Rom_6:8, Rom_6:13, Rom_8:2; Eph_2:4, Eph_2:5; Col_2:13, Col_3:3, Col_3:4", "note": "", "refs": [{"l": "Rom 6:8", "n": "", "vs": [[8, "ومادمنا متنا مع المسيح، فنحن نؤمن أننا سنحيا أيضا معه،"]]}, {"l": "Rom 6:13", "n": "", "vs": [[13, "ولا تقدموا أعضاءكم للخطيئة أسلحة للإثم، بل قدموا أنفسكم لله باعتباركم أقمتم من بين الأموات أحياء، وأعضاءكم لله أسلحة للبر."]]}, {"l": "Rom 8:2", "n": "", "vs": [[2, "لأن ناموس روح الحياة في المسيح يسوع قد حررني من ناموس الخطيئة ومن الموت."]]}, {"l": "Eph 2:4", "n": "", "vs": [[4, "أما الله ، وهو غني في الرحمة، فبسبب محبته العظيمة التي أحبنا بها،"]]}, {"l": "Eph 2:5", "n": "", "vs": [[5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"]]}, {"l": "Col 2:13", "n": "", "vs": [[13, "فأنتم، إذ كنتم أمواتا في الخطايا وعدم ختانكم الجسدي، أحياكم جميعا معه؛ مسامحا لنا جميعا بالخطايا كلها."]]}, {"l": "Col 3:3", "n": "", "vs": [[3, "فإنكم قد متم، وحياتكم مستورة مع المسيح في الله."]]}, {"l": "Col 3:4", "n": "", "vs": [[4, "فعندما يظهر المسيح، وهو حياتنا، عندئذ تظهرون أنتم أيضا معه في المجد."]]}], "kwAr": "وفيما بعد لا أحيا أنا", "noteAr": ""}, {"kw": "but", "raw": "Joh_14:19, Joh_14:20, Joh_17:21; 2Co_4:10,2Co_4:11, 2Co_13:3, 2Co_13:5; Eph_3:17; Col_1:27; 1Th_5:10; 1Pe_4:2; Rev_3:20", "note": "", "refs": [{"l": "Joh 14:19", "n": "", "vs": [[19, "بعد قليل لا يراني العالم. أما أنتم فسوف ترونني. ولأني أنا حي، فأنتم أيضا ستحيون."]]}, {"l": "Joh 14:20", "n": "", "vs": [[20, "في ذلك اليوم تعلمون أني أنا في أبي، وأنتم في، وأنا فيكم."]]}, {"l": "Joh 17:21", "n": "", "vs": [[21, "ليكون الجميع واحدا؛ أيها الآب، كما أنك أنت في وأنا فيك، ليكونوا هم أيضا واحدا فينا، لكي يؤمن العالم أنك أنت أرسلتني."]]}, {"l": "2Co 4:10", "n": "", "vs": [[10, "وحيثما ذهبنا، نحمل موت يسوع دائما في أجسادنا لتظهر فيها أيضا حياة يسوع : [[16, "ولكننا، إذ علمنا أن الإنسان لا يتبرر على أساس الأعمال المطلوبة في الشريعة بل فقط بالإيمان بيسوع المسيح، آمنا نحن أيضا بالمسيح يسوع، لنتبرر على أساس الإيمان به، لا على أساس أعمال الشريعة، لأنه على أعمال الشريعة لا يبرر أي إنسان."]]}, {"l": "Gal 3:11", "n": "", "vs": [[11, "أما أن أحدا لا يتبر ر عند الله بفضل الشريعة، فذلك واضح، لأن «من تبرر بالإيمان فبالإيمان يحيا»."]]}, {"l": "Joh 6:57", "n": "", "vs": [[57, "وكما أني أحيا بالآب الحي الذي أرسلني، فكذلك يحيا بي من يأكلني."]]}, {"l": "Rom 1:17", "n": "", "vs": [[17, "ففيه قد أعلن البر الذي يمنحه الله على أساس الإيمان والذي يؤدي إلى الإيمان، على حد ما قد كتب: «أما من تبرر بالإيمان، فبالإيمان يحيا»."]]}, {"l": "Rom 5:2", "n": "", "vs": [[2, "وبه أيضا تم لنا الدخول بالإيمان إلى هذه النعمة التي نقيم فيها الآن؛ ونحن نفتخر برجائنا في التمتع بمجد الله."]]}, {"l": "2Co 1:24", "n": "", "vs": [[24, "وهذا لا يعني أننا نتسلط على إيمانكم، بل إننا معاونون لكم نعمل لأجل فرحكم. فبالإيمان أنتم ثابتون."]]}, {"l": "2Co 5:7", "n": "", "vs": [[7, "لأننا نسلك بالإيمان لا بالعيان."]]}, {"l": "2Co 5:15", "n": "", "vs": [[15, "وهو قد مات عوضا عن الجميع حتى لا يعيش الأحياء في ما بعد لأنفسهم بل للذي مات عوضا عنهم ثم قام."]]}, {"l": "Phi 4:13", "n": "", "vs": [[13, "إني أستطيع كل شيء، في المسيح الذي يقويني."]]}, {"l": "1Th 5:10", "n": "", "vs": [[10, "الذي مات عنا لكي نحيا جميعا معه، سواء كنا في سهر الحياة أم في رقاد الموت!"]]}, {"l": "1Pe 1:8", "n": "", "vs": [[8, "أنتم لم تروا المسيح، ولكنكم تحبونه. ومع أنكم لا ترونه الآن، فأنتم تؤمنون به وتبتهجون بفرح مجيد يفوق الوصف."]]}, {"l": "1Pe 4:2", "n": "", "vs": [[2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."]]}], "kwAr": "الآن في الجسد", "noteAr": ""}, {"kw": "the Son", "raw": "Joh_1:49, Joh_3:16, Joh_3:35, Joh_6:69, Joh_9:35-38; Act_8:37, Act_9:20; 1Th_1:10; 1Jo_1:7; 1Jo_4:9, 1Jo_4:10,1Jo_4:14, 1Jo_5:10-13, 1Jo_5:20", "note": "", "refs": [{"l": "Joh 1:49", "n": "", "vs": [[49, "فهتف نثنائيل قائلا: «يامعلم، أنت ابن الله! أنت ملك إسرائيل!»"]]}, {"l": "Joh 3:16", "n": "", "vs": [[16, "لأنه هكذا أحب الله العالم حتى بذل ابنه الوحيد، لكي لا يهلك كل من يؤمن به، بل تكون له الحياة الأبدية."]]}, {"l": "Joh 3:35", "n": "", "vs": [[35, "فالآب يحب الابن، وقد جعل في يده كل شيء."]]}, {"l": "Joh 6:69", "n": "", "vs": [[69, "نحن آمنا وعرفنا أنك قدوس الله!»"]]}, {"l": "Joh 9:35-38", "n": "", "vs": [[35, "وعرف يسوع بطرده خارجا، فقصد إليه وسأله: «أتؤمن بابن الله؟»"], [36, "أجاب: «من هو ياسيد حتى أومن به؟»"], [37, "فقال له يسوع: «الذي قد رأيته، والذي يكلمك، هو نفسه!»"], [38, "فقال: «أنا أومن ياسيد!» وسجد له."]]}, {"l": "Act 8:37", "n": "", "vs": [[37, "فأجابه فيلبس: «هذا جائز إن كنت تؤمن من كل قلبك». فقال الخصي: «إني أومن بأن يسوع المسيح هو ابن الله»."]]}, {"l": "Act 9:20", "n": "", "vs": [[20, "وفي الحال بدأ يبشر في المجامع بأن يسوع هو ابن الله."]]}, {"l": "1Th 1:10", "n": "", "vs": [[10, "وتنتظروا من السماوات ابنه الذي أقامه من بين الأموات، يسوع مخلصنا من الغضب الآتي."]]}, {"l": "1Jo 1:7", "n": "", "vs": [[7, "ولكن، إن كنا فعلا نعيش في النور، كما هو في النور، تكون لنا حقا شركة بعضنا مع بعض، ودم ابنه يسوع يطهرنا من كل خطيئة."]]}, {"l": "1Jo 4:9", "n": "", "vs": [[9, "وقد أظهر الله محبته لنا إذ أرسل ابنه الأوحد إلى العالم لكي نحيا به."]]}, {"l": "1Jo 4:10", "n": "", "vs": [[10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."]]}, {"l": "1Jo 4:14", "n": "", "vs": [[14, "ونحن أنفسنا نشهد أن الآب قد أرسل الابن مخلصا للعالم، لأننا رأيناه بعيوننا."]]}, {"l": "1Jo 5:10-13", "n": "", "vs": [[10, "فمن يؤمن بابن الله، يثق في قلبه بصحة هذه الشهادة. أما من لا يصدق الله ، إذ يرفض تصديق الشهادة التي شهد بها لابنه، فهو يتهم الله بالكذب."], [11, "وهذه الشهادة هي أن الله أعطانا حياة أبدية، وأن هذه الحياة هي في ابنه."], [12, "فمن كان له ابن الله كانت له الحياة. ومن لم يكن له ابن الله، لم تكن له الحياة!"], [13, "يامن آمنتم باسم ابن الله، إني كتبت هذا إليكم لكي تعرفوا أن الحياة الأبدية ملك لكم منذ الآن."]]}, {"l": "1Jo 5:20", "n": "", "vs": [[20, "وإننا نعلم أن ابن الله قد جاء إلى الأرض وأنار أذهاننا لنعرف الإله الحق. ونحن الآن نحيا فيه، لأننا في ابنه يسوع المسيح. هذا هو الإله الحق، والحياة الأبدية."]]}], "kwAr": "بالإيمان في ابن الله", "noteAr": ""}, {"kw": "who", "raw": "Gal_1:4; Mat_20:28; Joh_10:11, Joh_15:13; Rom_8:37; Eph_5:2, Eph_5:25; Tit_2:14; Rev_1:5", "note": "", "refs": [{"l": "Gal 1:4", "n": "", "vs": [[4, "الذي بذل نفسه من أجل خطايانا لكي ينقذنا من العالم الحاضر الشرير، وفقا لمشيئة إلهنا وأبينا."]]}, {"l": "Mat 20:28", "n": "", "vs": [[28, "فهكذا ابن الإنسان: قد جاء لا ليخدم، بل ليخدم ويبذل نفسه فدية عن كثيرين. »"]]}, {"l": "Joh 10:11", "n": "", "vs": [[11, "أنا الراعي الصالح، والراعي الصالح يبذل حياته فدى خرافه."]]}, {"l": "Joh 15:13", "n": "", "vs": [[13, "ليس لأحد محبة أعظم من هذه: أن يبذل أحد حياته فدى أحبائه."]]}, {"l": "Rom 8:37", "n": "", "vs": [[37, "ولكننا، في جميع هذه الأمور، نحرز ما يفوق الانتصار على يد من أحبنا."]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "Eph 5:25", "n": "", "vs": [[25, "أيها الأزواج، أحبوا زوجاتكم مثلما أحب المسيح الكنيسة وبذل نفسه لأجلها،"]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Rev 1:5", "n": "", "vs": [[5, "ومن يسوع المسيح الشاهد الأمين، بكر القائمين من بين الأموات، ملك ملوك الأرض، ذاك الذي بدافع محبته لنا مات لأجلنا فغسلنا بدمه من خطايانا،"]]}], "kwAr": "الذي أحبني وبذل نفسه عني", "noteAr": ""}], "arS": [["مع ", []], ["المسيح", ["G5547"]], [" ", []], ["صلبت", ["G4957"]], ["، وفيما بعد لا ", []], ["أحيا", ["G2198"]], [" أنا بل ", []], ["المسيح", ["G5547"]], [" ", []], ["يحيا", ["G2198"]], [" في. أما ", []], ["الحياة", ["G2198"]], [" التي أحياها ", []], ["الآن", ["G3568"]], [" في ", []], ["الجسد", ["G4561"]], ["، فإنما أحياها ", []], ["بالإيمان", ["G4102"]], [" في ", []], ["ابن", ["G5207"]], [" ", []], ["الله", ["G2316"]], ["، الذي ", []], ["أحبني", ["G25"]], [" ", []], ["وبذل", ["G3860"]], [" ", []], ["نفسه", ["G1438"]], [" عني.", []]]}, {"c": 2, "v": 21, "text": "إني لا أبطل فاعلية نعمة الله، إذ لو كان البر بالشريعة، لكان موت المسيح عملا لا داعي له.", "groups": [{"kw": "do not", "raw": "Gal_2:18; Psa_33:10; Mar_7:9 *marg. Rom_8:31", "note": "", "refs": [{"l": "Gal 2:18", "n": "", "vs": [[18, "فإذا عدت أبني ما قد هدمته، فإني أجعل نفسي مخالفا."]]}, {"l": "Psa 33:10", "n": "", "vs": [[10, "الرب أحبط مؤامرة الأمم. أبطل أفكار الشعوب."]]}, {"l": "Mar 7:9", "n": "*marg.", "vs": [[9, "وقال لهم: «حقا أنكم رفضتم وصية الله لتحافظوا على تقليدكم أنتم!"]]}, {"l": "Rom 8:31", "n": "", "vs": [[31, "فبعد هذا، ماذا نقول؟ مادام الله معنا، فمن يكون علينا؟ ذاك الذي لم يمسك عنا ابنه،"]]}], "kwAr": "إني لا أبطل", "noteAr": ""}, {"kw": "righteousness", "raw": "Gal_2:16, Gal_3:21, Gal_5:2-4; Rom_10:3, Rom_11:6; Heb_7:11", "note": "", "refs": [{"l": "Gal 2:16", "n": "", "vs": [[16, "ولكننا، إذ علمنا أن الإنسان لا يتبرر على أساس الأعمال المطلوبة في الشريعة بل فقط بالإيمان بيسوع المسيح، آمنا نحن أيضا بالمسيح يسوع، لنتبرر على أساس الإيمان به، لا على أساس أعمال الشريعة، لأنه على أعمال الشريعة لا يبرر أي إنسان."]]}, {"l": "Gal 3:21", "n": "", "vs": [[21, "فهل تناقض الشريعة وعود الله؟ حاشا! فلو أعطيت شريعة قادرة أن تحيي، لكان البر بالحقيقة على مبدأ الشريعة."]]}, {"l": "Gal 5:2-4", "n": "", "vs": [[2, "ها أنا بولس أقول لكم: إن ختنتم، لا ينفعكم المسيح شيئا."], [3, "وأشهد مرة أخرى لكل مختون بأنه ملتزم أن يعمل بالشريعة كلها."], [4, "يامن تريدون التبرير عن طريق الشريعة، قد حرمتم المسيح وسقطتم من النعمة!"]]}, {"l": "Rom 10:3", "n": "", "vs": [[3, "فبما أنهم جهلوا بر الله وسعوا إلى إثبات برهم الذاتي، لم يخضعوا للبر الإلهي."]]}, {"l": "Rom 11:6", "n": "", "vs": [[6, "ولكن، بما أن ذلك قد تم بالنعمة، فليس بعد على أساس الأعمال، وإلا فليست النعمة نعمة بعد."]]}, {"l": "Heb 7:11", "n": "", "vs": [[11, "إن شريعة موسى كلها كانت تدور حول نظام الكهنوت الذي قام بنو لاوي بتأدية واجباته. إلا أن ذلك النظام لم يوصل إلى الكمال أولئك الذين كانوا يعبدون الله على أساسه. وإلا، لما دعت الحاجة إلى تعيين كاهن آخر على رتبة ملكيصادق، وليس على رتبة هرون!"]]}], "kwAr": "لو كان البر بالشريعة", "noteAr": ""}, {"kw": "Christ", "raw": "Isa_49:4; Jer_8:8; 1Co_15:2, 1Co_15:14, 1Co_15:17", "note": "", "refs": [{"l": "Isa 49:4", "n": "", "vs": [[4, "ولكنني أجبت: لقد تعبت باطلا. وأفنيت قوتي سدى وعبثا. غير أن حقي محفوظ عند الرب، ومكافأتي عند إلهي."]]}, {"l": "Jer 8:8", "n": "", "vs": [[8, "كيف تدعون أنكم حكماء ولديكم شريعة الرب بينما حولها قلم الكتبة المخادع إلى أكذوبة؟"]]}, {"l": "1Co 15:2", "n": "", "vs": [[2, "وبه أيضا أنتم مخلصون، إن كنتم تتمسكون بالكلمة التي بشرتكم بها، إلا إذا كنتم قد آمنتم عبثا."]]}, {"l": "1Co 15:14", "n": "", "vs": [[14, "ولو لم يكن المسيح قد قام، لكان تبشيرنا عبثا وإيمانكم عبثا،"]]}, {"l": "1Co 15:17", "n": "", "vs": [[17, "ولو لم يكن المسيح قد قام، لكان إيمانكم عبثا، ولكنتم بعد في خطاياكم،"]]}], "kwAr": "لكان موت المسيح", "noteAr": ""}], "arS": [["إني لا ", []], ["أبطل", ["G114"]], [" فاعلية ", []], ["نعمة", ["G5485"]], [" ", []], ["الله", ["G2316"]], ["، إذ لو كان ", []], ["البر", ["G1343"]], [" ", []], ["بالشريعة", ["G3551"]], ["، لكان ", []], ["موت", ["G599"]], [" ", []], ["المسيح", ["G5547"]], [" عملا ", []], ["لا داعي له", ["G1432"]], [".", []]]}, {"c": 3, "v": 1, "text": "ياأهل غلاطية الأغبياء! من سحر عقولكم، أنتم الذين قد رسم أمام أعينكم يسوع المسيح وهو مصلوب؟", "groups": [{"kw": "Foolish", "raw": "Gal_3:3; Deu_32:6; 1Sa_13:13; Mat_7:26; Luk_24:25; Eph_5:15; 1Ti_6:4 *marg.", "note": "", "refs": [{"l": "Gal 3:3", "n": "", "vs": [[3, "أإلى هذا الحد أنتم أغبياء؟ أبعدما ابتدأتم بالروح تكملون بالجسد؟"]]}, {"l": "Deu 32:6", "n": "", "vs": [[6, "أبهذا تكافئون الرب أيها الشعب الأحمق الغبي؟ أليس هو أباكم وخالقكم الذي عملكم وكونكم؟"]]}, {"l": "1Sa 13:13", "n": "", "vs": [[13, "فقال صموئيل لشاول: «لقد تصرفت بحماقة، فأنت قد عصيت وصية الرب إلهك التي أمرك بها. ولو أطعته لثبت ملكك على إسرائيل إلى الأبد."]]}, {"l": "Mat 7:26", "n": "", "vs": [[26, "وأي من يسمع أقوالي هذه ولا يعمل بها، يشبه برجل غبي بنى بيته على الرمل،"]]}, {"l": "Luk 24:25", "n": "", "vs": [[25, "فقال لهما: «ياقليلي الفهم وبطيئي القلب في الإيمان بجميع ما تكلم به الأنبياء!"]]}, {"l": "Eph 5:15", "n": "", "vs": [[15, "فانتبهوا تماما إذن كيف تسلكون بتدقيق، لا سلوك الجهلاء بل سلوك العقلاء،"]]}, {"l": "1Ti 6:4", "n": "*marg.", "vs": [[4, "فهو قد انتفخ تكبرا، ولا يعرف شيئا، وإنما هو مهووس بالمجادلات والمنازعات الكلامية، ومنها ينشأ الحسد والخصام والتجريح والنيات السيئة،"]]}], "kwAr": "ياأهل غلاطية الأغبياء", "noteAr": ""}, {"kw": "who", "raw": "Gal_1:6, Gal_4:9, Gal_5:7, Gal_5:8; Mat_24:24; Act_8:9-11; 2Co_11:3, 2Co_11:13-15; Eph_4:14; 2Th_2:9-12; 2Pe_2:18; Rev_2:20, Rev_13:13, Rev_13:14, Rev_18:3", "note": "", "refs": [{"l": "Gal 1:6", "n": "", "vs": [[6, "عجبا! كيف تتحولون بمثل هذه السرعة عن الذي دعاكم بنعمة المسيح، وتنصرفون إلى إنجيل غريب؟"]]}, {"l": "Gal 4:9", "n": "", "vs": [[9, "أما الآن وقد عرفتم الله ، بل بالأحرى عرفكم الله ، فكيف ترتدون أيضا إلى تلك المباديء العاجزة الفقيرة التي ترغبون في الرجوع إلى العبودية لها من جديد؟"]]}, {"l": "Gal 5:7", "n": "", "vs": [[7, "كنتم تجرون جريا جيدا، فمن أعاقكم حتى لا تذعنوا للحق؟"]]}, {"l": "Gal 5:8", "n": "", "vs": [[8, "هذا التضليل ليس من الذي دعاكم!"]]}, {"l": "Mat 24:24", "n": "", "vs": [[24, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات عظيمة وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Act 8:9-11", "n": "", "vs": [[9, "وكان قبل ذلك في تلك المدينة ساحر اسمه سيمون، يمارس السحر فيذهل أهل السامرة ويدعي أنه رجل عظيم."], [10, "فأصغى إليه الجميع من الصغير إلى الكبير، قائلين: «هذا الرجل هو قدرة الله العظمى!»"], [11, "وإنما أصغوا إليه لأنهم كانوا قد انخدعوا مدة طويلة بحيله السحرية!"]]}, {"l": "2Co 11:3", "n": "", "vs": [[3, "غير أني أخشى أن تضلل عقولكم عن الإخلاص والطهارة تجاه المسيح مثلما أغوت الحية بمكرها حواء."]]}, {"l": "2Co 11:13-15", "n": "", "vs": [[13, "فإن أمثال هؤلاء هم رسل دجالون، عمال ماكرون، يظهرون أنفسهم بمظهر رسل المسيح."], [14, "ولا عجب! فالشيطان نفسه يظهر نفسه بمظهر ملاك نور."], [15, "فليس كثيرا إذن أن يظهر خدامه أنفسهم بمظهر خدام البر. وإن عاقبتهم ستكون على حسب أعمالهم."]]}, {"l": "Eph 4:14", "n": "", "vs": [[14, "وذلك حتى لا نكون فيما بعد أطفالا تتقاذفنا وتحملنا كل ريح تعليم يقوم على خداع الناس والمكر بهم لجرهم إلى الضلال الملفق،"]]}, {"l": "2Th 2:9-12", "n": "", "vs": [[9, "أما بروز المتمرد، فسوف يكون بقدر طاقة الشيطان على المعجزات والعلامات والعجائب المزيفة كلها،"], [10, "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا."], [11, "ولهذا السبب، سيرسل الله إليهم طاقة الضلال حتى يصدقوا ما هو دجل،"], [12, "فتقع الدينونة على جميع الذين لم يؤمنوا بالحق بل سرهم الإثم."]]}, {"l": "2Pe 2:18", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."]]}, {"l": "Rev 2:20", "n": "", "vs": [[20, "ولكن لي عليك أنك تتساهل مع هذه المرأة إيزابل، التي تدعي أنها نبية، فتعلم عبيدي وتغويهم أن يزنوا ويأكلوا من الذبائح المقدمة للأصنام."]]}, {"l": "Rev 13:13", "n": "", "vs": [[13, "وقام الوحش الثاني بآيات خارقة، حتى إنه أنزل من السماء نارا على الأرض بمشهد من الناس جميعا،"]]}, {"l": "Rev 13:14", "n": "", "vs": [[14, "فخدع سكان الأرض بالآيات التي كان يقوم بها في حضور الوحش الأول. وأمر سكان الأرض أن يقيموا تمثالا للوحش الأول الذي كان قد جرح جرحا مميتا ولكنه عاش!"]]}, {"l": "Rev 18:3", "n": "", "vs": [[3, "لأن جميع الأمم شربت من خمر زناها، وملوك الأرض زنوا معها، وتجار الأرض اغتنوا من كثرة ترفها!»"]]}], "kwAr": "من سحر عقولكم", "noteAr": ""}, {"kw": "ye", "raw": "Gal_2:14, Gal_5:7; Act_6:7; Rom_2:8, Rom_6:17, Rom_10:16; 2Co_10:5; 2Th_1:8; Heb_5:9; Heb_11:8; 1Pe_1:22, 1Pe_4:17", "note": "", "refs": [{"l": "Gal 2:14", "n": "", "vs": [[14, "فلما رأيت أنهم لا يسلكون باستقامة توافق حق الإنجيل، قلت لبطرس أمام الحاضرين جميعا: «إن كنت وأنت يهودي تعيش كالأمم لا كاليهود، فكيف تجبر الأمم أن يعيشوا كاليهود؟»"]]}, {"l": "Gal 5:7", "n": "", "vs": [[7, "كنتم تجرون جريا جيدا، فمن أعاقكم حتى لا تذعنوا للحق؟"]]}, {"l": "Act 6:7", "n": "", "vs": [[7, "فزادت كلمة الله انتشارا، وتكاثر عدد التلاميذ في أورشليم، وأذعن للإيمان مجموعة كبيرة من الكهنة."]]}, {"l": "Rom 2:8", "n": "", "vs": [[8, "ويكون الغضب والسخط للمخاصمين الذين يرفضون الطاعة للحق ولكنهم يخضعون للإثم."]]}, {"l": "Rom 6:17", "n": "", "vs": [[17, "إنما الشكر لله، لأنكم كنتم عبيدا للخطيئة ولكن أطعتم من القلب صيغة التعليم الذي وضعتم في عهدته."]]}, {"l": "Rom 10:16", "n": "", "vs": [[16, "ولكن، ليس كلهم أطاعوا الإنجيل. فإن إشعياء يقول: «يارب! من صدق ما أسمعناه إياه؟»"]]}, {"l": "2Co 10:5", "n": "", "vs": [[5, "وكل ما يعلو مرتفعا لمقاومة معرفة الله، ونأسر كل فكر إلى طاعة المسيح."]]}, {"l": "2Th 1:8", "n": "", "vs": [[8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."]]}, {"l": "Heb 5:9", "n": "", "vs": [[9, "وبذلك، أصبح مؤهلا لمهمته، فصار لجميع الذين يطيعونه مصدرا للخلاص الأبدي."]]}, {"l": "Heb 11:8", "n": "", "vs": [[8, "وبالإيمان، لبى إبراهيم دعوة الله، فترك وطنه وانطلق إلى أرض أخرى وعده الله بأن يورثه إياها. ولما خرج من بيته، كان لا يعرف أين يتوجه."]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}, {"l": "1Pe 4:17", "n": "", "vs": [[17, "حقا إن الوقت قد حان ليبتديء القضاء بأهل بيت الله. فإن كان القضاء يبدأ بنا أولا، فما هو مصير الذين لا يؤمنون بإنجيل الله؟"]]}], "kwAr": "أنتم الذين", "noteAr": ""}, {"kw": "Jesus Christ", "raw": "1Co_1:23, 1Co_1:24, 1Co_2:2, 1Co_11:26; Eph_3:8", "note": "", "refs": [{"l": "1Co 1:23", "n": "", "vs": [[23, "ولكننا نحن نبشر بالمسيح مصلوبا، مما يشكل عائقا عند اليهود وجهالة عند الأمم؛"]]}, {"l": "1Co 1:24", "n": "", "vs": [[24, "وأما عند المدعوين، سواء من اليهود أو اليونانيين، فإن المسيح هو قدر ة الله وحكمة الله."]]}, {"l": "1Co 2:2", "n": "", "vs": [[2, "إذ كنت عازما ألا أعرف شيئا بينكم إلا يسوع المسيح، وأن أعرفه مصلوبا."]]}, {"l": "1Co 11:26", "n": "", "vs": [[26, "إذن، كلما أكلتم هذا الخبز وشربتم هذه الكأس، تعلنون موت الرب، إلى أن يرجع."]]}, {"l": "Eph 3:8", "n": "", "vs": [[8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}], "kwAr": "يسوع المسيح وهو مصلوب", "noteAr": ""}], "arS": [["ياأهل ", []], ["غلاطية", ["G1052"]], [" ", []], ["الأغبياء", ["G453"]], ["! من ", []], ["سحر", ["G940"]], [" عقولكم، أنتم الذين قد رسم أمام ", []], ["أعينكم", ["G3788"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [" وهو ", []], ["مصلوب", ["G4717"]], ["؟", []]]}, {"c": 3, "v": 2, "text": "أريد أن أستعلم منكم هذا الأمر فقط: أعلى أساس العمل بما في الشريعة نلتم الروح، أم على أساس الإيمان بالبشارة؟", "groups": [{"kw": "Received", "raw": "Gal_3:5, Gal_3:14; Act_2:38, Act_8:15, Act_10:44-47, Act_11:15-18, Act_15:8, Act_19:2-6; 1Co_12:7-13; 2Co_11:4; Eph_1:13, Eph_1:14; Heb_2:4, Heb_6:4; 1Pe_1:12", "note": "", "refs": [{"l": "Gal 3:5", "n": "", "vs": [[5, "فذاك الذي يهبكم الروح، ويجري معجزات في ما بينكم، أيفعل ذلك على أساس أعمال الشريعة أم على أساس الإيمان بالبشارة؟"]]}, {"l": "Gal 3:14", "n": "", "vs": [[14, "لكي تصل بركة إبراهيم إلى الأمم في المسيح يسوع، فننال عن طريق الإيمان الروح الموعود."]]}, {"l": "Act 2:38", "n": "", "vs": [[38, "أجابهم بطرس: «توبوا، وليتعمد كل واحد منكم باسم يسوع المسيح، فيغفر الله خطاياكم وتنالوا هبة الروح القدس،"]]}, {"l": "Act 8:15", "n": "", "vs": [[15, "فصليا لأجلهم لكي ينالوا الروح القدس،"]]}, {"l": "Act 10:44-47", "n": "", "vs": [[44, "وبينما كان بطرس يتكلم بهذا الكلام، حل الروح القدس على جميع الذين كانوا يسمعون."], [45, "فدهش المؤمنون اليهود الذين جاءوا برفقة بطرس، لأن هبة الروح القدس فاضت أيضا على غير اليهود،"], [46, "إذ سمعوهم يتكلمون بلغات، ويسبحون الله . فقال بطرس:"], [47, "«أيستطيع أحد أن يمنع الماء فلا يتعمد أيضا هؤلاء الذين نالوا الروح القدس مثلنا؟»"]]}, {"l": "Act 11:15-18", "n": "", "vs": [[15, "ولما ابتدأت أتكلم، حل الروح القدس عليهم كما حل علينا في البداية"], [16, "فتذكرت ما قاله الرب لنا: إن يوحنا عمد بالماء، وأما أنتم فستتعمدون بالروح القدس."], [17, "فإن كان الله قد ساواهم بنا فأعطاهم الهبة التي أعطانا، إذ آمنا بالرب يسوع المسيح، فمن أكون أنا حتى أعيق الله ؟»"], [18, "فلما سمع المعارضون هذا، سكتوا، ومجدوا الله قائلين: «إذن، قد أنعم الله أيضا على غير اليهود بالتوبة لنوال الحياة»."]]}, {"l": "Act 15:8", "n": "", "vs": [[8, "وقد شهد الله العليم بما في القلوب على قبوله لهم إذ وهبهم الروح القدس كما وهبنا إياه."]]}, {"l": "Act 19:2-6", "n": "", "vs": [[2, "فسألهم: «هل نلتم الروح القدس عندما آمنتم؟» أجابوه: «لا! حتى إننا لم نسمع بوجود الروح القدس!»"], [3, "فسأل: «إذن على أي أساس قد تعمدتم؟» أجابوا: «على أساس معمودية يوحنا!»"], [4, "فقال بولس: «كان يوحنا يعمد بمعمودية التوبة، ويدعو الشعب إلى الإيمان بالآتي بعده، أي بيسوع»."], [5, "فلما سمعوا هذا تعمدوا باسم الرب يسوع."], [6, "وما إن وضع بولس يديه عليهم حتى حل عليهم الروح القدس، وأخذوا يتكلمون بلغات أخرى ويتنبأون."]]}, {"l": "1Co 12:7-13", "n": "", "vs": [[7, "وإنما كل واحد يوهب موهبة يتجلى الروح فيها لأجل المنفعة."], [8, "فواحد يوهب، عن طريق الروح، كلام الحكمة، وآخر كلام المعرفة وفقا للروح نفسه،"], [9, "وآخر إيمانا بالروح نفسه. ويوهب آخر موهبة شفاء الأمراض بالروح الواحد،"], [10, "وآخر عمل المعجزات، وآخر النبوءة وآخر التمييز بين الأرواح، وآخر التكلم بلغات مختلفة (لم يتعلمها)، وآخر ترجمة اللغات تلك."], [11, "ولكن هذا كله يشغله الروح الواحد نفسه، موزعا المواهب، كما يشاء، على كل واحد."], [12, "فكما أن الجسد واحد وله أعضاء كثيرة، ولكن أعضاء الجسد كلها تشكل جسما واحدا مع أنها كثيرة، فكذلك حال المسيح أيضا."], [13, "فإننا، بالروح الواحد، قد تعمدنا جميعا لنصير جسدا واحدا، سواء كنا يهودا أم يونانيين، عبيدا أم أحرارا، وقد سقينا جميعا الروح الواحد."]]}, {"l": "2Co 11:4", "n": "", "vs": [[4, "فإذا كان من يأتيكم يبشر بيسوع آخر لم نبشر به نحن أو كنتم تنالون روحا آخر لم تنالوه، أو تقبلون إنجيلا لم تقبلوه، فإنكم تحتملون ذلك بكل سرور."]]}, {"l": "Eph 1:13", "n": "", "vs": [[13, "وفيه أنتم أيضا (وضعتم رجاءكم) إذ سمعتم كلمة الحق، أي الإنجيل الذي فيه خلاصكم؛ كذلك فيه أيضا ختمتم، إذ آمنتم، بالروح القدس الموعود،"]]}, {"l": "Eph 1:14", "n": "", "vs": [[14, "هذا الروح الذي هو عربون ميراثنا إلى أن يتم فداء ما قد اقتني: بغر ض مدح مجده."]]}, {"l": "Heb 2:4", "n": "", "vs": [[4, "وقد أيد الله شهادتهم بعلامات وعجائب ومعجزات مختلفة، وبالمواهب التي وزعها ا ومواسم وسنين!"]]}, {"l": "Gal 5:4-8", "n": "", "vs": [[4, "يامن تريدون التبرير عن طريق الشريعة، قد حرمتم المسيح وسقطتم من النعمة!"], [5, "فإننا، بالروح وعلى أساس الإيمان، ننتظر الرجاء الذي ينتجه البر."], [6, "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة."], [7, "كنتم تجرون جريا جيدا، فمن أعاقكم حتى لا تذعنوا للحق؟"], [8, "هذا التضليل ليس من الذي دعاكم!"]]}, {"l": "Gal 6:12-14", "n": "", "vs": [[12, "إن الذين يريدون أن يظهروا في الجسد بمظهر حسن، أولئك يرغمونكم أن تختنوا، فقط لئلا يلقوا الاضطهاد بسبب صليب المسيح."], [13, "فحتى أولئك الذين يختنون، هم أنفسهم، لا يعملون بالشريعة، بل يريدون لكم أن تختنوا ليفتخروا بجسدكم."], [14, "أما أنا فحاشا لي أن أفتخر إلا بصليب ربنا يسوع المسيح، الذي به أصبح العالم بالنسبة لي مصلوبا، وأنا أصبحت بالنسبة له مصلوبا."]]}, {"l": "Heb 7:16-19", "n": "", "vs": [[16, "لم يعين كاهنا على أساس الشريعة التي توصي بضرورة الانتماء إلى نسل بشري معين، بل على أساس القوة النابعة من حياته التي لا تزول أبدا."], [17, "ذلك لأن الوحي يشهد له قائلا: «أنت كاهن إلى الأبد على رتبة ملكيصادق!»"], [18, "هكذا، يتبين أن نظام الكهنوت القديم قد ألغي لأنه عاجز وغير نافع."], [19, "فالشريعة لم توصل الذين كانوا يعبدون الله بحسبها ولو إلى أدنى درجات الكمال. ولذلك، وضع الله أساسا جديدا للاقتراب إليه، مقدما لنا رجاء أفضل."]]}, {"l": "Heb 9:2", "n": "", "vs": [[2, "وكانت هذه الخيمة الكبيرة تحتوي على غرفتين يفصل بينهما الحجاب. الغرفة الأولى، واسمها «القدس»، كانت تحتوي على منارة ذهبية، ومائدة يوضع عليها خبز مقرب لله."]]}, {"l": "Heb 9:9", "n": "", "vs": [[9, "وما هذا إلا صورة للوقت الحاضر الذي فيه مازالت التقدمات والذبائح تقرب وفقا لنظام العهد العتيق. ولكنها لا تستطيع أن تطهر قلوب الذين يتقربون بها إلى الله، ولا أن توصلهم إلى الكمال فتريح ضمائرهم."]]}, {"l": "Heb 9:10", "n": "", "vs": [[10, "إذ إن نظام العهد السابق قد اقتصر على تحريم بعض المأكولات والمشروبات وتحليل غيرها، وعلى وضع النظم المختصة بطقوس الاغتسال المختلفة. بل إن كل ما ضمه ذلك النظام، كان قوانين جسدية ينتهي عملها حين يأتي وقت الإصلاح."]]}], "kwAr": "أبعدما ابتدأتم بالروح", "noteAr": ""}], "arS": [["أإلى هذا الحد أنتم ", []], ["أغبياء", ["G453"]], ["؟ أبعدما ", []], ["ابتدأتم", ["G1728"]], [" ", []], ["بالروح", ["G4151"]], [" ", []], ["تكملون", ["G2005"]], [" ", []], ["بالجسد", ["G4561"]], ["؟", []]]}, {"c": 3, "v": 4, "text": "وهل كان اختباركم الطويل بلا جدوى، إن كان حقا بلا جدوى؟", "groups": [{"kw": "ye", "raw": "Eze_18:24; Heb_6:4-6, Heb_10:32-39; 2Pe_2:20-22; 2Jo_1:8", "note": "", "refs": [{"l": "Eze 18:24", "n": "", "vs": [[24, "وإذا تحول الصديق عن بره وارتكب إثما على غرار كل الرجاسات التي يرتكبها الشرير، أفيحيا؟ إن كل ما صنعه من بر لا يذكر له. إنما يموت بخيانته التي خانها، وما اقترفه من خطايا."]]}, {"l": "Heb 6:4-6", "n": "", "vs": [[4, "ذلك لأن الذين قد تعرضوا مرة لنور الإيمان بالمسيح، فذاقوا العطية السماوية، وصاروا (إلى حين) من شركاء الروح القدس،"], [5, "وذاقوا كلمة الله الطيبة، وشاهدوا المعجزات التي تظهر عظمة «العالم الآتي»،"], [6, "ثم ارتدوا إلى تلك الأسس القديمة، أولئك يستحيل عليهم أن يتجددوا ثانية فيعودوا إلى التوبة. فهم يجنون على أنفسهم إذ يصلبون ابن الله مرة ثانية ويجعلونه عرضة للعار."]]}, {"l": "Heb 10:32-39", "n": "", "vs": [[32, "لا تنسوا أبدا تلك الأيام الماضية التي فيها، بعدما أشرق عليكم نور الإيمان بالمسيح، صبرتم على جهاد مرير طويل، إذ قاسيتم كثيرا من الآلام."], [33, "وذلك عندما تعرضتم للإهانات والمضايقات من جهة، وعندما شاركتم الذين عوملوا مثل هذه المعاملة من جهة أخرى."], [34, "فقد تعاطفتم مع المسجونين، كما تقبلتم نهب ممتلكاتكم بفرح، علما منكم بأن لكم في السماء ثروة أفضل وأبقى."], [35, "إذن، لا تتخلوا عن ثقتكم بالرب. فإن لها مكافأة عظيمة."], [36, "إنكم تحتاجون إلى الصبر لتعملوا إرادة الله، فتنالوا البركة التي وعدتم بها."], [37, "فقريبا جدا، سيأتي الآتي ولا يتمهل."], [38, "وأما من تبرر بالإيمان، فبالإيمان يحيا. ومن ارتد لا تسر به نفسي!"], [39, "ولكننا نحن لسنا من أهل الارتداد المؤدي إلى الهلاك، بل من أهل الإيمان المؤدي إلى خلاص نفوسنا!"]]}, {"l": "2Pe 2:20-22", "n": "", "vs": [[20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدا  "وأبارك مباركيك وألعن لاعنيك، وتتبارك فيك جميع أمم الأرض»."]]}, {"l": "Gen 18:18", "n": "", "vs": [[18, "وإبراهيم لابد أن يصبح أمة كبيرة وقوية، وبه تتبارك شعوب الأرض جميعا،"]]}, {"l": "Gen 22:18", "n": "", "vs": [[18, "وبذريتك تتبارك جميع أمم الأرض، لأنك أطعتني»."]]}, {"l": "Gen 26:4", "n": "", "vs": [[4, "وأكثر ذريتك كنجوم السماء وأهبها جميع هذه البلاد. وتتبارك في نسلك جميع أمم الأرض."]]}, {"l": "Gen 28:14", "n": "", "vs": [[14, "التي ستكون كتراب الأرض، وتمتد غربا وشرقا، وشمالا وجنوبا، وتتبارك بك وبذريتك جميع شعوب الأرض."]]}, {"l": "Gen 49:10", "n": "", "vs": [[10, "لا يزول صولجان الملك من يهوذا ولا مشترع من صلبه حتى يأتي شيلوه (ومعناه: من له الأمر) فتطيعه الشعوب."]]}, {"l": "Psa 72:7", "n": "", "vs": [[7, "ليزدهر في أيامه الصديق، ويتوافر السلام مادام القمر يضيء."]]}, {"l": "Isa 6:13", "n": "", "vs": [[13, "وحتى لو بقي بعد ذلك عشر أهلها، فإنها ستحرق ثانية، ولكنها تكون كالبطمة والبلوطة، التي وإن قطعت يبقى ساقها قائما: هكذا يبقى ساقها زرعا مقدسا»."]]}, {"l": "Isa 65:9", "n": "", "vs": [[9, "بل أخرج من صلب يعقوب ذرية، ومن يهوذا وارثا لجبالي، فيملكها مختاري، ويقيم فيها عبيدي،"]]}, {"l": "Act 2:25", "n": "", "vs": [[25, "فإن داود يقول فيه: كنت أرى الرب أمامي دائما فإنه عن يميني لئلا أتزعزع."]]}, {"l": "Act 2:26", "n": "", "vs": [[26, "لذلك فرح قلبي وتهلل لساني. حتى إن جسدي سيرقد على رجاء."]]}, {"l": "Act 2:35", "n": "", "vs": [[35, "حتى أجعل أعداءك موطئا لقدميك."]]}, {"l": "Rev 11:15", "n": "", "vs": [[15, "ونفخ الملاك السابع في بوقه فسمعت أصوات عالية في السماء تقول: «قد صار ملك العالم لربنا ومسيحه. إنه يملك إلى أبد الآبدين»."]]}], "kwAr": "فيك تتبارك جميع الأمم", "noteAr": ""}], "arS": [["ثم إن ", []], ["الكتاب", ["G1124"]], ["، إذ ", []], ["سبق فرأى", ["G4275"]], [" أن ", []], ["الله", ["G2316"]], [" سوف ", []], ["يبرر", ["G1344"]], [" ", []], ["الأمم", ["G1484"]], [" على أساس ", []], ["الإيمان", ["G4102"]], ["، ", []], ["بشر", ["G4283"]], [" ", []], ["إبراهيم", ["G11"]], [" سلفا بقوله: «فيك ", []], ["تتبارك", ["G1757"]], [" ", []], ["جميع", ["G3956"]], [" ", []], ["الأمم", ["G1484"]], ["!»", []]]}, {"c": 3, "v": 9, "text": "إذن الذين هم على مبدأ الإيمان يباركون مع إبراهيم المؤمن.", "groups": [{"kw": "", "raw": "Gal_3:7, Gal_3:8, Gal_3:14, Gal_3:29, Gal_4:28; Rom_4:11, Rom_4:16, Rom_4:24", "note": "", "refs": [{"l": "Gal 3:7", "n": "", "vs": [[7, "فاعلموا إذن أن الذين هم على مبدأ الإيمان هم أبناء إبراهيم فعلا."]]}, {"l": "Gal 3:8", "n": "", "vs": [[8, "ثم إن الكتاب، إذ سبق فرأى أن الله سوف يبرر الأمم على أساس الإيمان، بشر إبراهيم سلفا بقوله: «فيك تتبارك جميع الأمم!»"]]}, {"l": "Gal 3:14", "n": "", "vs": [[14, "لكي تصل بركة إبراهيم إلى الأمم في المسيح يسوع، فننال عن طريق الإيمان الروح الموعود."]]}, {"l": "Gal 3:29", "n": "", "vs": [[29, "فإذا كنتم للمسيح، فأنتم إذن نسل إبراهيم وحسب الوعد وارثون."]]}, {"l": "Gal 4:28", "n": "", "vs": [[28, "وأما أنتم، أيها الإخوة، فأولاد الوعد، على مثال إسحاق."]]}, {"l": "Rom 4:11", "n": "", "vs": [[11, "ثم تلقى إبراهيم علامة الختان ختما للبر الحاصل بالإيمان الذي كان له وهو مازال غير مختون، لكي يكون أبا لجميع الذين يؤمنون من غير المختونين فيحسب البر لهم أيضا،"]]}, {"l": "Rom 4:16", "n": "", "vs": [[16, "لذلك، فإن الوعد هو على أساس الإيمان ليكون بحسب النعمة، بقصد أن يكون مضمونا للنسل كله: ليس لأهل الشريعة وحدهم، بل أيضا لأهل الإيمان الذي كان لإبراهيم. فإنه أب لنا جميعا،"]]}, {"l": "Rom 4:24", "n": "", "vs": [[24, "بل أيضا من أجلنا، نحن الذين سيحسب ذلك لنا إذ نؤمن بمن أقام من بين الأموات يسوع ربنا"]]}], "kwAr": "", "noteAr": ""}], "arS": [["إذن الذين هم على مبدأ ", []], ["الإيمان", ["G4102"]], [" ", []], ["يباركون", ["G2127"]], [" مع ", []], ["إبراهيم", ["G11"]], [" ", []], ["المؤمن", ["G4103"]], [".", []]]}, {"c": 3, "v": 10, "text": "أما جميع الذين على مبدأ أعمال الشريعة، فإنهم تحت اللعنة، لأنه قد كتب: «ملعون كل من لا يثبت على العمل بكل ما هو مكتوب في كتاب الشريعة!»", "groups": [{"kw": "as many", "raw": "Gal_3:11; Gal_2:16; Luk_18:9-13; Rom_4:15, Rom_7:9-13, Rom_8:7", "note": "", "refs": [{"l": "Gal 3:11", "n": "", "vs": [[11, "أما أن أحدا لا يتبر ر عند الله بفضل الشريعة، فذلك واضح، لأن «من تبرر بالإيمان فبالإيمان يحيا»."]]}, {"l": "Gal 2:16", "n": "", "vs": [[16, "ولكننا، إذ علمنا أن الإنسان لا يتبرر على أساس الأعمال المطلوبة في الشريعة بل فقط بالإيمان بيسوع المسيح، آمنا نحن أيضا بالمسيح يسوع، لنتبرر على أساس الإيمان به، لا على أساس أعمال الشريعة، لأنه على أعمال الشريعة لا يبرر أي إنسان."]]}, {"l": "Luk 18:9-13", "n": "", "vs": [[9, "وضرب أيضا هذا المثل لأناس يثقون في أنفسهم بأنهم أبرار ويحتقرون الآخرين:"], [10, "«صعد إنسانان إلى الهيكل ليصليا، أحدهما فريسي والآخر جابي ضرائب."], [11, "فوقف الفريسي يصلي في نفسه هكذا: أشكرك، ياالله ، لأني لست مثل باقي الناس الطماعين الظالمين الزناة، ولا مثل جابي الضرائب هذا:"], [12, "أصوم مرتين في الأسبوع، وأقدم عشر كل ما أجنيه!"], [13, "ولكن جابي الضرائب، وقف من بعيد وهو لا يجرؤ أن يرفع عينيه نحو السماء، بل قرع صدره قائلا: ارحمني، ياالله ، أنا الخاطيء!"]]}, {"l": "Rom 4:15", "n": "", "vs": [[15, "لأن الشريعة إنما تنتج الغضب؛ فلولا الشريعة لما ظهرت المخالفة."]]}, {"l": "Rom 7:9-13", "n": "", "vs": [[9, "أما أنا فكنت من قبل عائشا بمعزل عن الشريعة؛ ولكن لما جاءت الشريعة عاشت الخطيئة،"], [10, "فمت أنا. والوصية الهادفة إلى الحياة، صارت لي مؤدية إلى الموت."], [11, "فإن الخطيئة، إذ استغلت الوصية، خدعتني وقتلتني بها."], [12, "فالشريعة إذن مقدسة، والوصية مقدسة وعادلة وصالحة."], [13, "فهل صار ما هو صالح موتا لي؟ حاشا! ولكن الخطيئة، لكي تظهر أنها خطيئة، أنتجت لي الموت بما هو صالح، حتى تصير الخطيئة خاطئة جدا بسبب الوصية."]]}, {"l": "Rom 8:7", "n": "", "vs": [[7, "لأن اهتمام الجسد هو عداوة لله، إذ إنه لا يخضع لناموس الله، بل لا يستطيع ذلك."]]}], "kwAr": "جميع الذين على مبدأ أعمال الشريعة", "noteAr": ""}, {"kw": "under", "raw": "Deu_11:26-28, Deu_29:20; Isa_43:28; Mat_25:41", "note": "", "refs": [{"l": "Deu 11:26-28", "n": "", "vs": [[26, "انظروا ها أنا أخيركم اليوم بين البركة واللعنة:"], [27, "البركة لكم إن أطعتم وصايا الرب إلهكم التي أنا أوصيتكم بها اليوم،"], [28, "واللعنة إن عصيتم وصايا الرب إلهكم، وضللتم عن الطريق التي أنا أوصيكم بها اليوم، وغويتم وراء آلهة أخرى غريبة عنكم."]]}, {"l": "Deu 29:20", "n": "", "vs": [[20, "إن الرب لا يشاء الرفق بمثل هذا الإنسان، بل يحتدم غضبه وغيرته عليه، فتنزل به كل اللعنات المدونة في هذا الكتاب، ويمحو اسمه من تحت السماء."]]}, {"l": "Isa 43:28", "n": "", "vs": [[28, "لذلك أدنس عظماء مقادسي وأقضي على إسرائيل بالهلاك وأتركه عرضة للخزي والعار."]]}, {"l": "Mat 25:41", "n": "", "vs": [[41, "ثم يقول للذين عن يساره: ابتعدوا عني ياملاعين إلى النار الأبدية المعدة لإبليس وأعوانه!"]]}], "kwAr": "تحت اللعنة", "noteAr": ""}, {"kw": "Cursed", "raw": "Deu_27:26; Jer_11:3; Eze_18:4; Rom_3:19, Rom_3:20, Rom_6:23; Jam_2:9-11", "note": "", "refs": [{"l": "Deu 27:26", "n": "", "vs": [[26, "ملعون كل من لا يطيع كلمات هذه الشريعة ولا يعمل بها. فيقول جميع الشعب: آمين."]]}, {"l": "Jer 11:3", "n": "", "vs": [[3, "وقل لهم: هذا ما يعلنه الرب إله إسرائيل: ملعون الذي لا يسمع كلمات هذا العهد،"]]}, {"l": "Eze 18:4", "n": "", "vs": [[4, "ها جميع النفوس هي لي. نفس الأب كنفس الابن كلتاهما لي. والنفس التي تخطيء هي تموت."]]}, {"l": "Rom 3:19", "n": "", "vs": [[19, "ونحن نعلم أن كل ما تقوله الشريعة إنما تخاطب به الذين هم تحت الشريعة، لكي يسد كل فم ويقع العالم كله تحت دينونة من الله."]]}, {"l": "Rom 3:20", "n": "", "vs": [[20, "فإن أحدا من البشر لا يتبرر أمامه بالأعمال المطلوبة في الشريعة. إذ إن الشريعة هي لإظهار الخطيئة."]]}, {"l": "Rom 6:23", "n": "", "vs": [[23, "لأن أجرة الخطيئة هي الموت، وأما هبة الله فهي الحياة الأبدية في المسيح يسوع ربنا."]]}, {"l": "Jam 2:9-11", "n": "", "vs": [[9, "ولكن عندما تعاملون الناس بالانحياز والتمييز، ترتكبون خطيئة وتحكم عليكم الشريعة باعتباركم مخالفين لها."], [10, "فأنتم تعرفون أن من يطيع جميع الوصايا الواردة في شريعة موسى، ويخالف واحدة منها فقط، يصير مذنبا، تماما كالذي يخالف الوصايا كلها."], [11, "فإن الله ، مثلا، قال: «لا تزن» كما قال: «لا تقتل!» فإن لم تزن، ولكن قتلت، فقد خرقت الشريعة."]]}], "kwAr": "ملعون كل من لا يثبت", "noteAr": ""}], "arS": [["أما ", []], ["جميع", ["G3745"]], [" الذين على مبدأ ", []], ["أعمال", ["G2041"]], [" ", []], ["الشريعة", ["G3551"]], ["، فإنهم ", []], ["تحت", ["G5259"]], [" ", []], ["اللعنة", ["G2671"]], ["، لأنه قد ", []], ["كتب", ["G11
