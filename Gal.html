 من بني إسرائيل إلى الرب إلههم،"]]}, {"l": "Act 9:15", "n": "", "vs": [[15, "فأمره الرب: «اذهب! فقد اخترت هذا الرجل ليكون إناء يحمل اسمي إلى الأمم والملوك وبني إسرائيل."]]}, {"l": "Act 13:2", "n": "", "vs": [[2, "وذات يوم، وهم صائمون يتعبدون للرب، قال لهم الروح القدس: «خصصوا لي برنابا وشاول لأجل العمل الذي دعوتهما إليه»."]]}, {"l": "Act 22:14", "n": "", "vs": [[14, "فقال: إله آبائنا اختارك مسبقا لتعرف إرادته، وترى البار وتسمع صوتا من فمه."]]}, {"l": "Act 22:15", "n": "", "vs": [[15, "فإنك ستكون شاهدا له، أمام جميع الناس، بما رأيت وسمعت."]]}, {"l": "Rom 1:1", "n": "", "vs": [[1, "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"]]}], "kwAr": "الذي كان قد أفرزني", "noteAr": ""}, {"kw": "and", "raw": "Rom_1:5, Rom_8:30, Rom_9:24; 1Co_1:9, 1Co_1:24, 1Co_15:10; 2Th_2:13, 2Th_2:14; 1Ti_1:12-14; 2Ti_1:9; 1Pe_5:10", "note": "", "refs": [{"l": "Rom 1:5", "n": "", "vs": [[5, "الذي به ولأجل اسمه نلنا نعمة ورسالة لإطاعة الإيمان بين جميع الأمم،"]]}, {"l": "Rom 8:30", "n": "", "vs": [[30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."]]}, {"l": "Rom 9:24", "n": "", "vs": [[24, "فينا نحن الذين دعاهم لا من بين اليهود فقط بل من بين الأمم أيضا؟"]]}, {"l": "1Co 1:9", "n": "", "vs": [[9, "فإن الله أمين، وقد دعاكم إلى الشركة مع ابنه يسوع ربنا."]]}, {"l": "1Co 1:24", "n": "", "vs": [[24, "وأما عند المدعوين، سواء من اليهود أو اليونانيين، فإن المسيح هو قدر ة الله وحكمة الله."]]}, {"l": "1Co 15:10", "n": "", "vs": [[10, "ولكن، بنعمة الله صرت على ما أنا عليه الآن، ونعمته الموهوبة لي لم تكن عبثا، إذ عملت جاهدا أكثر من الرسل الآخرين جميعا. إلا أني لم أكن أنا العامل، بل نعمة الله التي كانت معي."]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "2Th 2:14", "n": "", "vs": [[14, "فإلى هذا الأمر قد دعاكم ببشارتنا لكم، لنوال مجد ربنا يسوع المسيح."]]}, {"l": "1Ti 1:12-14", "n": "", "vs": [[12, "وكم أشكر المسيح يسوع ربنا الذي أعطاني القدرة وعينني خادما له، إذ اعتبرني جديرا بثقته،"], [13, "مع أني كنت في الماضي مجدفا عليه، ومضطهدا ومهينا له! ولكني عوملت بالرحمة، لأني عملت ما عملته عن جهل وفي عدم إيمان."], [14, "إلا أن نعمة ربنا قد فاضت علي فوق كل حد، ومعها الإيمان والمحبة، وذلك في المسيح يسوع."]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،"]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}], "kwAr": "ثم دعاني بنعمته", "noteAr": ""}], "arS": [["ولكن، لما ", []], ["سر", ["G2106"]], [" ", []], ["الله", ["G2316"]], [" ، الذي كان قد ", []], ["أفرزني", ["G873"]], [" وأنا في ", []], ["بطن", ["G2836"]], [" ", []], ["أمي", ["G3384", "G3450"]], [" ثم ", []], ["دعاني", ["G2564"]], [" ", []], ["بنعمته", ["G5485"]], ["،", []]]}, {"c": 1, "v": 16, "text": "أن يعلن ابنه في لأبشر به بين الأمم، في الحال لم أستشر لحما ودما،", "groups": [{"kw": "reveal", "raw": "Mat_16:17; 1Co_2:9-13; 2Co_4:6; Eph_1:17, Eph_1:18, Eph_3:5-10", "note": "", "refs": [{"l": "Mat 16:17", "n": "", "vs": [[17, "فقال له يسوع: «طوبى لك ياسمعان بن يونا. فما أعلن لك هذا لحم ودم، بل أبي الذي في السماوات."]]}, {"l": "1Co 2:9-13", "n": "", "vs": [[9, "لما صلبوا رب المجد! ولكن، وفقا لما كتب: «إن ما لم تره عين، ولم تسمع به أذن، ولم يخطر على بال بشر قد أعده الله لمحبيه!»"], [10, "ولكن الله كشف لنا ذلك بالروح. فإن الروح يتقصى كل شيء، حتى أعماق الله."], [11, "فمن من الناس يعرف ما في الإنسان إلا روح الإنسان الذي فيه؛ وكذلك فإن ما في الله أيضا لا يعرفه أحد إلا روح الله."], [12, "وأما نحن فقد نلنا لا روح العالم بل الروح الذي من الله، لنعرف الأمور التي وهبت لنا من قبل الله."], [13, "ونحن نتكلم بهذه الأمور لا في كلام تعلمه الحكمة البشرية، بل في كلام يعلمه الروح القدس، معبرين عن الحقائق الروحية بوسائل روحية."]]}, {"l": "2Co 4:6", "n": "", "vs": [[6, "فإن الله ، الذي أمر أن يشرق نور من الظلام، هو الذي جعل النور يشرق في قلوبنا، لإشعاع معرفة مجد الله المتجلي في وجه المسيح."]]}, {"l": "Eph 1:17", "n": "", "vs": [[17, "حتى يهبكم إله ربنا يسوع المسيح، أبو المجد، روح حكمة وإلهام: لتعرفوه معرفة كاملة"]]}, {"l": "Eph 1:18", "n": "", "vs": [[18, "إذ تستنير بصائر قلوبكم، فتعلموا ما في دعوته لكم من رجاء، وما هو غنى مجد ميراثه في القديسين،"]]}, {"l": "Eph 3:5-10", "n": "", "vs": [[5, "ذلك السر الذي لم يطلع عليه بنو البشر في الأجيال الماضية مثلما أعلن الآن بوحي الروح لرسله القديسين وأنبيائه:"], [6, "وهو أن الأمم هم شركاء اليهود في الميراث، وأعضاء في الجسد معهم، ولهم أيضا حق الاستفادة من الوعد. وذلك في المسيح يسوع وبفضل الإنجيل"], [7, "الذي صرت أنا خادما له بحسب نعمة الله الموهوبة لي وفقا لعمل قدرته."], [8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"], [9, "وأنير الجميع بمعرفة ما هو تدبير السر الذي أبقاه الله ، خالق كل شيء، مكتوما مدى الأجيال."], [10, "والغاية أن يتجلى الآن أمام الرئاسات والسلطات في الأماكن السماوية ما يظهر في الكنيسة من حكمة الله المتعددة الوجوه،"]]}], "kwAr": "أن يعلن ابنه في", "noteAr": ""}, {"kw": "that", "raw": "Gal_2:7-9; Act_9:15, Act_22:21, Act_26:17, Act_26:18; Rom_1:13, Rom_1:14, Rom_11:13, Rom_15:16-19; Eph_3:1, Eph_3:8; Col_1:25-27; 1Th_2:16; 1Ti_2:7; 2Ti_1:11", "note": "", "refs": [{"l": "Gal 2:7-9", "n": "", "vs": [[7, "بل بالعكس، رأوا أنه عهد إلي بالإنجيل لأهل عدم الختان، كما عهد به إلى بطرس لأهل الختان."], [8, "لأن الذي استخدم بطرس في رسوليته إلى أهل الختان، استخدمني أيضا بالنسبة إلى الأمم."], [9, "فلما اتضحت النعمة الموهوبة لي عند يعقوب وبطرس ويوحنا، وهم البارزون باعتبارهم أعمدة، مدوا إلي وإلى برنابا أيديهم اليمنى إشارة إلى المشاركة، فنتوجه نحن إلى الأمم وهم إلى أهل الختان،"]]}, {"l": "Act 9:15", "n": "", "vs": [[15, "فأمره الرب: «اذهب! فقد اخترت هذا الرجل ليكون إناء يحمل اسمي إلى الأمم والملوك وبني إسرائيل."]]}, {"l": "Act 22:21", "n": "", "vs": [[21, "ولكنه قال لي: اذهب ... سأرسلك بعيدا: إلى الأمم!»"]]}, {"l": "Act 26:17", "n": "", "vs": [[17, "وسأنقذك من شعبك ومن الأمم التي أرسلك إليها الآن،"]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "Rom 1:13", "n": "", "vs": [[13, "ثم لا أريد أن يخفى عليكم، أيها الإخوة، أنني كثيرا ما قصدت أن آتي إليكم، ليكون لي ثمر من بينكم أيضا كما لي من بين الأمم الأخرى، إلا أنني كنت أعاق حتى الآن"]]}, {"l": "Rom 1:14", "n": "", "vs": [[14, "فإن علي دينا لليونانيين والبرابرة، للمتعلمين والجهال."]]}, {"l": "Rom 11:13", "n": "", "vs": [[13, "فإني أخاطبكم، أنتم الأمم، بما أني رسول للأمم، ممجدا رسالتي،"]]}, {"l": "Rom 15:16-19", "n": "", "vs": [[16, "وبذلك أكون خادم المسيح يسوع، المرسل إلى الأمم، حاملا إنجيل الله وكأني أقوم بخدمة كهنوتية، بقصد أن ترفع لله من بين الأمم تقدمة تكون مقبولة ومقدسة بالروح القدس."], [17, "يحق لي إذن أن أفتخر في المسيح يسوع بما يعود لله من خدمتي."], [18, "فما كنت لأتجاسر أن أتكلم بشيء إلا على ما عمله المسيح على يدي لهداية الأمم إلى الطاعة، بالقول والفعل،"], [19, "وبقوة الآيات والعجائب، وبقوة روح الله. حتى إنني، من أورشليم وما حولها حتى مقاطعة إليريكون، قد أكملت التبشير بإنجيل المسيح."]]}, {"l": "Eph 3:1", "n": "", "vs": [[1, "لهذا السبب، أنا بولس سجين المسيح يسوع لأجلكم أنتم الأمم …"]]}, {"l": "Eph 3:8", "n": "", "vs": [[8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "Col 1:25-27", "n": "", "vs": [[25, "ولها قد صرت أنا خادما بموجب تدبير الله الموهوب لي من أجلكم، وهو أن أتمم كلمة الله، بإعلان"], [26, "السر الذي كان مكتوما طوال العصور والأجيال، ولكن كشف الآن لقديسيه،"], [27, "الذين أراد الله أن يعلن لهم كم هو غني مجد هذا السر بين الأمم: إنه المسيح فيكم، وهو رجاء المجد؛"]]}, {"l": "1Th 2:16", "n": "", "vs": [[16, "إذ يمنعوننا من تبشير الأمم ليخلصوا، وبذلك يستكملون خطاياهم كل حين، ولكن الغضب قد حل عليهم إلى الغاية."]]}, {"l": "1Ti 2:7", "n": "", "vs": [[7, "ولها قد عينت أنا مبشرا ورسولا، الحق أقول ولست أكذب، معلما للأمم في الإيمان والحق."]]}, {"l": "2Ti 1:11", "n": "", "vs": [[11, "الذي له عينت أنا مبشرا ورسولا ومعلما."]]}], "kwAr": "لأبشر به بين الأمم", "noteAr": ""}, {"kw": "immediately", "raw": "Gal_1:11, Gal_1:12, Gal_2:1, Gal_2:6; Deu_33:9; Luk_9:23-25, Luk_9:59-62; Act_26:19, Act_26:20; 2Co_5:16", "note": "", "refs": [{"l": "Gal 1:11", "n": "", "vs": [[11, "وأعلمكم، أيها الإخوة، أن الإنجيل الذي بشرتكم به ليس إنجيلا بشريا."]]}, {"l": "Gal 1:12", "n": "", "vs": [[12, "فلا أنا تسلمته من إنسان، ولا تلقنته، بل جاءني بإعلان من يسوع المسيح."]]}, {"l": "Gal 2:1", "n": "", "vs": [[1, "وبعد أربع عشرة سنة، صعدت مرة ثانية إلى أورشليم بصحبة برنابا، وقد أخذت معي تيطس أيضا."]]}, {"l": "Gal 2:6", "n": "", "vs": [[6, "أما الذين كانوا يعتبرون من البارزين، ولا فرق عندي مهما كانت مكانتهم مادام الله لا يراعي وجاهة إنسان، فإنهم لم يزيدوا شيئا على ما أبشر به."]]}, {"l": "Deu 33:9", "n": "", "vs": [[9, "الذي قال عن والديه: لم أرهما، وبإخوته لم يعترف، وأنكر أبناءه، بل أطاعوا وصاياك وصانوا عهدك."]]}, {"l": "Luk 9:23-25", "n": "", "vs": [[23, "ثم قال للجميع: «إن أراد أحد أن يسير ورائي، فلينكر نفسه ويحمل صليبه كل يوم ويتبعني."], [24, "فأي من أراد أن يخلص نفسه، يخسرها؛ ولكن من يخسر نفسه من أجلي، فهو يخلصها."], [25, "فماذا ينتفع الإنسان لو ربح العالم كله وخسر نفسه أو أهلكها؟"]]}, {"l": "Luk 9:59-62", "n": "", "vs": [[59, "وقال لغيره: «اتبعني!» ولكن هذا قال: «ياسيد، اسمح لي أن أذهب أولا وأدفن أبي!»"], [60, "فقال له يسوع: «دع الموتى يدفنون موتاهم، وأما أنت فاذهب وبشر بملكوت الله»."], [61, "وقال له آخر: «ياسيد، سأتبعك، ولكن اسمح لي أولا أن أودع أهل بيتي!»"], [62, "فقال له يسوع: «ما من أحد يضع يده على المحراث ويلتفت إلى الوراء، يصلح لملكوت الله»."]]}, {"l": "Act 26:19", "n": "", "vs": [[19, "ومن ذلك الحين لم أعاند الرؤيا السماوية، أيها الملك أغريباس."]]}, {"l": "Act 26:20", "n": "", "vs": [[20, "فبشرت أهل دمشق أولا، ثم أهل أورشليم ومنطقة اليهودية كلها، ثم الأجانب. فدعوت الجميع إلى التوبة والرجوع إلى الله، والقيام بأعمال تليق بالتوبة."]]}, {"l": "2Co 5:16", "n": "", "vs": [[16, "إذن، نحن منذ الآن لا نعرف أ , "فوقعت بينهما مشاجرة حتى انفصل أحدهما عن الآخر. فأخذ برنابا مرقس وسافر بحرا إلى قبرص،"]]}, {"l": "1Co 9:6", "n": "", "vs": [[6, "أم أنا وبرنابا وحدنا لا حق لنا أن ننقطع عن العمل؟"]]}, {"l": "Col 4:10", "n": "", "vs": [[10, "يسلم عليكم أرسترخس رفيقي في السجن؛ ومرقس ابن أخت برنابا، وفي شأنه تلقيتم بعض التوصيات: فإن جاء إليكم، فرحبوا به؛"]]}], "kwAr": "برنابا", "noteAr": ""}, {"kw": "Titus", "raw": "Gal_2:3; 2Co_8:16, 2Co_8:23; Tit_1:4", "note": "", "refs": [{"l": "Gal 2:3", "n": "", "vs": [[3, "ولكن، حتى تيطس الذي كان يرافقني وهو يوناني، لم يضطر أن يختن."]]}, {"l": "2Co 8:16", "n": "", "vs": [[16, "ولكن، شكرا لله الذي وضع في قلب تيطس مثل هذه الحماسة لأجلكم."]]}, {"l": "2Co 8:23", "n": "", "vs": [[23, "أما تيطس، فهو زميلي ومعاوني من أجل مصلحتكم. وأما أخوانا الآخران، فهما رسولا الكنائس ومجد المسيح."]]}, {"l": "Tit 1:4", "n": "", "vs": [[4, "إلى تيطس، ولدي الحقيقي بالنسبة إلى الإيمان المشترك بيننا."]]}], "kwAr": "تيطس", "noteAr": ""}], "arS": [["وبعد ", []], ["أربع عشرة", ["G1180"]], [" ", []], ["سنة", ["G2094"]], ["، ", []], ["صعدت", ["G305"]], [" مرة ", []], ["ثانية", ["G3825"]], [" إلى ", []], ["أورشليم", ["G2414"]], [" بصحبة ", []], ["برنابا", ["G921"]], ["، وقد ", []], ["أخذت معي", ["G4838"]], [" ", []], ["تيطس", ["G5103"]], [" أيضا.", []]]}, {"c": 2, "v": 2, "text": "وإنما صعدت إليها استجابة للوحي؛ وبسطت أمامهم الإنجيل الذي أبشر به بين الأمم، ولكن على انفراد أمام البارزين فيهم، لئلا يكون مسعاي في الحاضر والماضي بلا جدوى.", "groups": [{"kw": "by", "raw": "Act_16:9, Act_16:10, Act_18:9, Act_23:11", "note": "", "refs": [{"l": "Act 16:9", "n": "", "vs": [[9, "وفي تلك الليلة رأى بولس في رؤيا رجلا من أهل مقدونية يتوسل إليه ويقول: «اعبر إلى مقدونية وأنجدنا!»"]]}, {"l": "Act 16:10", "n": "", "vs": [[10, "عندئذ تأكدنا أن الرب دعانا للتبشير في مقدونية. فاتجهنا إليها في الحال."]]}, {"l": "Act 18:9", "n": "", "vs": [[9, "وذات ليلة رأى بولس الرب في رؤيا يقول له: «لا تخف، بل تكلم ولا تسكت،"]]}, {"l": "Act 23:11", "n": "", "vs": [[11, "وفي الليلة التالية ظهر الرب لبولس وقال له: «تشجع، فكما أديت لي الشهادة في أورشليم، لابد أن تؤديها لي في روما أيضا»."]]}], "kwAr": "استجابة للوحي", "noteAr": ""}, {"kw": "communicated", "raw": "Gal_2:9, Gal_1:16; Act_15:4, Act_15:12; 1Co_1:23, 1Co_2:2", "note": "", "refs": [{"l": "Gal 2:9", "n": "", "vs": [[9, "فلما اتضحت النعمة الموهوبة لي عند يعقوب وبطرس ويوحنا، وهم البارزون باعتبارهم أعمدة، مدوا إلي وإلى برنابا أيديهم اليمنى إشارة إلى المشاركة، فنتوجه نحن إلى الأمم وهم إلى أهل الختان،"]]}, {"l": "Gal 1:16", "n": "", "vs": [[16, "أن يعلن ابنه في لأبشر به بين الأمم، في الحال لم أستشر لحما ودما،"]]}, {"l": "Act 15:4", "n": "", "vs": [[4, "ولما وصلوا إلى أورشليم، رحبت بهم الكنيسة بمن فيها من رسل وشيوخ، فأخبروهم بكل ما فعل الله بواسطتهم."]]}, {"l": "Act 15:12", "n": "", "vs": [[12, "»عندئذ توقف الجدال بين الحاضرين، وأخذوا يستمعون إلى برنابا وبولس وهما يخبرانهم بما أجراه الله بواسطتهما من علامات وعجائب بين غير اليهود."]]}, {"l": "1Co 1:23", "n": "", "vs": [[23, "ولكننا نحن نبشر بالمسيح مصلوبا، مما يشكل عائقا عند اليهود وجهالة عند الأمم؛"]]}, {"l": "1Co 2:2", "n": "", "vs": [[2, "إذ كنت عازما ألا أعرف شيئا بينكم إلا يسوع المسيح، وأن أعرفه مصلوبا."]]}], "kwAr": "وبسطت أمامهم الإنجيل", "noteAr": ""}, {"kw": "privately", "raw": "or, severally", "note": "or, severally", "refs": [], "kwAr": "على انفراد", "noteAr": "أو: كلٌّ على حدة."}, {"kw": "which", "raw": "Gal_2:6, Gal_2:9; Ecc_10:1; Act_5:34; Phi_2:29", "note": "", "refs": [{"l": "Gal 2:6", "n": "", "vs": [[6, "أما الذين كانوا يعتبرون من البارزين، ولا فرق عندي مهما كانت مكانتهم مادام الله لا يراعي وجاهة إنسان، فإنهم لم يزيدوا شيئا على ما أبشر به."]]}, {"l": "Gal 2:9", "n": "", "vs": [[9, "فلما اتضحت النعمة الموهوبة لي عند يعقوب وبطرس ويوحنا، وهم البارزون باعتبارهم أعمدة، مدوا إلي وإلى برنابا أيديهم اليمنى إشارة إلى المشاركة، فنتوجه نحن إلى الأمم وهم إلى أهل الختان،"]]}, {"l": "Ecc 10:1", "n": "", "vs": [[1, "كما أن الذباب الميت ينتن طيب العطار، فإن بعض الحماقة تكون أثقل من الحكمة والكرامة."]]}, {"l": "Act 5:34", "n": "", "vs": [[34, "ولكن أحد أعضاء المجلس، واسمه  "", "vs": [[24, "علمنا أن بعض الأشخاص ذهبوا من عندنا إليكم، دون تفويض منا فأثاروا بكلامهم الاضطراب بينكم وأقلقوا أفكاركم."]]}, {"l": "Act 16:3", "n": "", "vs": [[3, "فأحب بولس أن يصحبه في التبشير. ولأن يهود تلك المنطقة كانوا يعرفون أن أباه يوناني، فقد أخذه بولس وختنه."]]}, {"l": "1Co 9:20", "n": "", "vs": [[20, "فصرت لليهود كأني يهودي، حتى أكسب اليهود؛ وللخاضعين للشريعة كأني خاضع لها مع أني لست خاضعا لها حتى أكسب الخاضعين لها؛"]]}, {"l": "1Co 9:21", "n": "", "vs": [[21, "وللذين بلا شريعة كأني بلا شريعة مع أني لست بلا ناموس عند الله بل أنا خاضع لناموس من نحو المسيح حتى أكسب الذين هم بلا شريعة."]]}], "kwAr": "", "noteAr": ""}], "arS": [["ولكن، حتى ", []], ["تيطس", ["G5103"]], [" الذي كان يرافقني وهو ", []], ["يوناني", ["G1672"]], ["، لم ", []], ["يضطر", ["G315"]], [" أن ", []], ["يختن", ["G4059"]], [".", []]]}, {"c": 2, "v": 4, "text": "إنما أثير الأمر بسبب الإخوة الدجالين الذين أدخلوا بيننا خلسة، فاندسوا ليتجسسوا حريتنا التي لنا في المسيح يسوع، لعلهم يعيدوننا إلى العبودية؛", "groups": [{"kw": "because", "raw": "Gal_5:10,Gal_5:12; Act_15:1, Act_15:24, Act_20:30; 2Co_11:13, 2Co_11:17, 2Co_11:26; 1Jo_4:1", "note": "", "refs": [{"l": "Gal 5:10", "n": "", "vs": [[10, "ولكن لي ثقة بكم في الرب أنكم لن تعتنقوا رأيا آخر. وكل من يثير البلبلة بينكم سيلقى عقاب ذلك، كائنا من كان."]]}, {"l": "Gal 5:12", "n": "", "vs": [[12, "ليت الذين يثيرون البلبلة بينكم يبترون أنفسهم!"]]}, {"l": "Act 15:1", "n": "", "vs": [[1, "وجاء بعض اليهود (الذين كانوا قد آمنوا بالمسيح) من منطقة اليهودية إلى أنطاكية، وأخذوا يعلمون الإخوة قائلين: «لا يمكنكم أن تخلصوا ما لم تختنوا حسب شريعة موسى»"]]}, {"l": "Act 15:24", "n": "", "vs": [[24, "علمنا أن بعض الأشخاص ذهبوا من عندنا إليكم، دون تفويض منا فأثاروا بكلامهم الاضطراب بينكم وأقلقوا أفكاركم."]]}, {"l": "Act 20:30", "n": "", "vs": [[30, "بل إن قوما منكم أنتم سيقومون ويعلمون تعاليم منحرفة، ليجروا التلاميذ وراءهم."]]}, {"l": "2Co 11:13", "n": "", "vs": [[13, "فإن أمثال هؤلاء هم رسل دجالون، عمال ماكرون، يظهرون أنفسهم بمظهر رسل المسيح."]]}, {"l": "2Co 11:17", "n": "", "vs": [[17, "وما أتكلم به هنا، لا أتكلم به وفقا للرب، بل كأني في الغباوة، ولي هذه الثقة التي تدفعني إلى الافتخار:"]]}, {"l": "2Co 11:26", "n": "", "vs": [[26, "سافرت أسفارا عديدة؛ وواجهتني أخطار السيول الجارفة، وأخطار قطاع الطرق، وأخطار من بني جنسي، وأخطار من الأمم، وأخطار في المدن، وأخطار في البراري، وأخطار في البحر، وأخطار بين إخوة دجالين."]]}, {"l": "1Jo 4:1", "n": "", "vs": [[1, "أيها الأحباء، لا تصدقوا كل روح، بل امتحنوا الأرواح لتعرفوا ما إذا كانت من عند الله أم لا، لأن عددا كبيرا من الأنبياء الدجالين قد انتشر في العالم."]]}], "kwAr": "بسبب الإخوة الدجالين", "noteAr": ""}, {"kw": "unawares", "raw": "2Ti_3:6; 2Pe_2:1, 2Pe_2:2; Jud_1:4", "note": "", "refs": [{"l": "2Ti 3:6", "n": "", "vs": [[6, "فمن هؤلاء من يدخلون البيوت خلسة، ويوقعون في حبائلهم بعض النساء السخيفات المثقلات بالخطايا، اللواتي تجرفهن شهوات مختلفة،"]]}, {"l": "2Pe 2:1", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."]]}, {"l": "2Pe 2:2", "n": "", "vs": [[2, "وكثيرون سيسيرون وراءهم في طرق الإباحية. وبسببهم توجه الإهانة إلى طريق الحق."]]}, {"l": "Jud 1:4", "n": "", "vs": [[4, "لأنه قد تسلل إلى ما بينكم معلمون لابد أن يلاقوا الحكم بالعقاب الأبدي، كما هو مكتوب لهم منذ القديم. فهم أشرار لا يهابون الله ، يتخذون من نعمة إلهنا فرصة لإباحة الرذائل، وينكرون سيدنا وربنا الوحيد يسوع المسيح."]]}], "kwAr": "الذين أدخلوا بيننا خلسة", "noteAr": ""}, {"kw": "liberty", "raw": "Gal_3:23-26, Gal_5:1, Gal_5:13; Psa_51:12, Psa_119:45; Joh_8:31-36; 2Co_3:17; 1Pe_2:16; 2Pe_2:19", "note": "", "refs": [{"l": "Gal 3:23-26", "n": "", "vs": [[23, "فقبل مجيء الإيمان، كنا تحت حراسة الشريعة، محتجزين إلى أن يعلن الإيمان الذي كان إعلانه منتظرا."], [24, "إذن، كانت الشريعة هي مؤدبنا حتى مجيء المسيح، لكي نبرر على أساس الإيمان."], [25, "ولكن بعدما جاء الإيمان، تحررنا من سلطة المؤدب."], [26, "فإنكم جميعا أبناء الله بالإيمان بالمسيح يسوع."]]}, {"l": "Gal 5:1", "n": "", "vs": [[1, "إن المسيح قد حررنا وأطلقنا في سبيل الحرية. فاثبتوا إذن، ولا تعودوا إلى الارتباك بنير العبودية."]]}, {"l": "Gal 5:13", "n": "", "vs": [[13, "فإنما إلى الحرية قد دعيتم، أيها الإخوة؛ ولكن لا تتخذوا من الحرية ذريعة لإرضاء الجسد، بل بالمحبة كونوا عبيدا في خدمة أحدكم الآخر."]]}, {"l": "Psa 51:12", "n": "", "vs": [[12, "رد لي بهجتي بخلاصك، وبروح رضية آزرني"]]}, {"l": "Psa 119:45", "n": "", "vs": [[45, "وأسلك في رحابة الحرية، لأني التمست أوامرك."]]}, {"l": "Joh 8:31-36", "n": "", "vs": [[31, "فقال لليهود الذين آمنوا به: «إن ثبتم في كلمتي، كنتم حقا تلاميذي."], [32, "وتعرفون الحق، والحق يحرركم»."], [33, "فرد اليهود: «نحن أحفاد إبراهيم، ولم نكن قط عبيدا لأحد! كيف تقول لنا: إنكم ستصيرون أحرارا؟»"], [34, "أجابهم يسوع: «الحق الحق أقول لكم: إن من يرتكب الخطيئة يكون عبدا لها."], [35, "والعبد لا يبقى في بيت سيده دائما؛ أما الابن فيعيش فيه أبدا."], [36, "فإن حرركم الابن تصيرون بالحق أحرارا."]]}, {"l": "2Co 3:17", "n": "", "vs": [[17, "فإن الرب هو الروح، وحيث يكون روح الرب، فهناك الحرية."]]}, {"l": "1Pe 2:16", "n": "", "vs": [[16, "تصرفوا كأحرار حقا، لا كالذين يتخذون من الحرية ستارا لارتكاب الشر بل باعتبار أنكم عبيد لله."]]}, {"l": "2Pe 2:19", "n": "", "vs": [[19, "يعدون هؤلاء بالحرية، وهم أنفسهم عبيد للفساد! لأن الإنسان يصير عبدا لكل ما يتسلط عليه ويغلبه."]]}], "kwAr": "حريتنا التي لنا في المسيح", "noteAr": ""}, {"kw": "bring", "raw": "Gal_4:3, Gal_4:9, Gal_4:10,Gal_4:25; Isa_51:23; 2Co_11:20", "note": "", "refs": [{"l": "Gal 4:3", "n": "", "vs": [[3, "وهذه حالنا نحن أيضا: فإذ كنا قاصرين، كنا في حالة العبودية لمبادىء العالم."]]}, {"l": "Gal 4:9", "n": "", "vs": [[9, "أما الآن وقد عرفتم الله ، بل بالأحرى عرفكم الله ، فكيف ترتدون أيضا إلى تلك المباديء العاجزة الفقيرة التي ترغبون في الرجوع إلى العبودية لها من جديد؟"]]}, {"l": "Gal 4:10", "n": "", "vs": [[10, "تحتفلون بأيام وأشهر ومواسم وسنين!"]]}, {"l": "Gal 4:25", "n": "", "vs": [[25, "ولفظة هاجر تطلق على جبل سيناء، في بلاد العرب، وتمثل أورشليم الحالية، فإنها مع بنيها في العبودية."]]}, {"l": "Isa 51:23", "n": "", "vs": [[23, "وأضعها في يد معذبيك الذين قالوا لك: انحني حتى ندوس عليك عابرين. فجعلت ظهرك لهم أرضا، وطريقا لهم يمرون عليه."]]}, {"l": "2Co 11:20", "n": "", "vs": [[20, "فإنكم تحتملون كل من يستعبدكم، ويفترسكم، ويستغلكم، ويتكبر عليكم، ويلطمكم على وجوهكم."]]}], "kwAr": "يعيدوننا إلى العبودية", "noteAr": ""}], "arS": [["إنما أثير الأمر بسبب ", []], ["الإخوة الدجالين", ["G5569"]], [" الذين ", []], ["أدخلوا بيننا خلسة", ["G3920"]], ["، ", []], ["فاندسوا", ["G3922"]], [" ", []], ["ليتجسسوا", ["G2684"]], [" ", []], ["حريتنا", ["G1657", "G2257"]], [" التي لنا في ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], ["، لعلهم يعيدوننا إلى ", []], ["العبودية", ["G2615"]], ["؛", []]]}, {"c": 2, "v": 5, "text": "فلم نخضع لهم مستسلمين ولو لساعة واحدة، ليبقى حق الإنجيل ثابتا عندكم.", "groups": [{"kw": "we", "raw": "Gal_3:1, Gal_3:2; Act_15:2; Col_2:4-8; Jud_1:3", "note": "", "refs": [{"l": "Gal 3:1", "n": "", "vs": [[1, "ياأهل غلاطية الأغبياء! من سحر عقولكم، أنتم الذين قد رسم أمام أعينكم يسوع المسيح وهو مصلوب؟"]]}, {"l": "Gal 3:2", "n": "", "vs": [[2, "أريد أن أستعلم منكم هذا الأمر فقط: أعلى أساس العمل بما في الشريعة نلتم الروح، أم على أساس الإيمان بالبشارة؟"]]}, {"l": "Act 15:2", "n": "", "vs": [[2, "فجادلهم بولس وبرنابا جدالا عنيفا. وبعد المناقشة قرر مؤمنو أنطاكية أن يذهب بولس وبرنابا مع بعض المؤمنين ليقابلوا الرسل والشيوخ في أورشليم، ويبحثوا معهم في هذه القضية."]]}, {"l": "Col 2:4-8", "n": "", "vs": [[4, "أقول هذا حتى لا يضللكم أحد بكلام خداع."], [5, "فمع أني في الجسد غائب، إلا أني في الروح حاضر معكم، أفرح إذ أشاهد ترتيبكم وثباتكم في الإيمان بالمسيح."], [6, "فمثلما قبلتم المسيح يسوع الرب، ففيه اسلكوا"], [7, "وأنتم متأصلون ومبنيون فيه وراسخون في الإيمان الموافق لما تعلمتم وفائضون بالشكر."], [8, "احذروا أن يوقعكم أحد فريسة بالفلسفة والغرور الباطل، عملا بتقاليد الناس ومباديء العالم؛ مما لا يوافق المسيح."]]}, {"l": "Jud 1:3", "n": "", "vs": [[3, "أيها الأحباء، كنت قد نويت أن أكتب إليكم في موضوع الخلاص الذي نشترك فيه جميعا. ولكن، أراني الآن مضطرا لأن أكتب لأشجعكم على الجهاد في سبيل الإيمان الذي سلم مرة واحدة للقديسين."]]}], "kwAr": "فلم نخضع لهم", "noteAr": ""}, {"kw": "that", "raw": "Gal_2:14, Gal_4:16; Eph_1:13; Col_1:5; 1Th_2:13", "note": "", "refs": [{"l": "Gal 2:14", "n": "", "vs": [[14, "فلما رأيت أنهم لا يسلكون باستقامة توافق حق الإنجيل، قلت لبطرس أمام الحاضرين جميعا: «إن كنت وأنت يهودي تعيش كالأمم لا كاليهود، فكيف تجبر الأمم أن يعيشوا كاليهود؟»"]]}, {"l": "Gal 4:16", "n": "", "vs": [[16, "فهل صرت الآن عدوا لكم لأني كلمتكم بالحق؟"]]}, {"l": "Eph 1:13", "n": "", "vs": [[13, "وفيه أنتم أيضا (وضعتم رجاءكم) إذ سمعتم كلمة الحق، أي الإنجيل الذي فيه خلاصكم؛ كذلك فيه أيضا ختمتم، إذ آمنتم، بالروح القدس الموعود،"]]}, {"l": "Col 1:5", "n": "", "vs": [[5, "بسبب الرجاء المحفوظ لكم في السماوات، الرجاء الذي سمعتم به سابقا في كلمة الحق التي في الإنجيل"]]}, {"l": "1Th 2:13", "n": "", "vs": [[13, "ولذلك نحن أيضا نرفع الشكر لله بلا توقف، لأنكم لما تلقيتم منا كلمة البشارة من الله، قبلتموها لا كأنها كلمة بشر، بل كما هي في الحقيقة: باعتبارها كلمة الله العاملة أيضا فيكم أنتم المؤمنين."]]}], "kwAr": "ليبقى حق الإنجيل ثابتا", "noteAr": ""}], "arS": [["فلم ", []], ["نخضع", ["G1502"]], [" لهم ", []], ["مستسلمين", ["G5292"]], [" ولو ", []], ["لساعة", ["G5610"]], [" واحدة، ليبقى ", []], ["حق", ["G225"]], [" ", []], ["الإنجيل", ["G2098"]], [" ", []], ["ثابتا", ["G1265"]], [" عندكم.", []]]}, {"c": 2, "v": 6, "text": "أما الذين كانوا يعتبرون من البارزين، ولا فرق عندي مهما كانت مكانتهم مادام الله لا يراعي وجاهة إنسان، فإنهم لم يزيدوا شيئا على ما أبشر به.", "groups": [{"kw": "these who", "raw": "Gal_2:2, Gal_2:9, Gal_6:3; 2Co_11:5, 2Co_11:21-23, 2Co_12:11; Heb_13:7, Heb_13:17", "note": "", "refs": [{"l": "Gal 2:2", "n": "", "vs": [[2, "وإنما صعدت إليها استجابة للوحي؛ وبسطت أمامهم الإنجيل الذي أبشر به بين الأمم، ولكن على انفراد أمام البارزين فيهم، لئلا يكون مسعاي في الحاضر والماضي بلا جدوى."]]}, {"l": "Gal 2:9", "n": "", "vs": [[9, "فلما اتضحت النعمة الموهوبة لي عند يعقوب وبطرس ويوحنا، وهم البارزون باعتبارهم أعمدة، مدوا إلي وإلى برنابا أيديهم اليمنى إشارة إلى المشاركة، فنتوجه نحن إلى الأمم وهم إلى أهل الختان،"]]}, {"l": "Gal 6:3", "n": "", "vs": [[3, "فإن ظن أحد أنه شيء، وهو في الواقع لا شيء، فإنما يخدع نفسه."]]}, {"l": "2Co 11:5", "n": "", "vs": [[5, "فإني أعتبر نفسي غير متخلف في شيء عن أولئك الرسل المتفوقين."]]}, {"l": "2Co 11:21-23", "n": "", "vs": [[21, "ياللمهانة! كم كنا ضعفاء في معاملتنا لكم!"], [22, "فإن كانوا عبرانيين، فأنا كذلك؛ أو إسرائيليين، فأنا كذلك؛ أو من نسل إبراهيم؛ فأنا كذلك!"], [23, "وإن كانوا خدام المسيح، أتكلم كأني فقدت صوابي، فأنا متفوق عليهم: في الأتعاب أوفر منهم جدا، في الجلدات فوق الحد، في السجون أوفر جدا، في التعرض للموت أكثر مرارا."]]}, {"l": "2Co 12:11", "n": "", "vs": [[11, "ها قد صرت غبيا! ولكن، أنتم أجبرتموني! فقد كان يجب أن تمدحوني أنتم، لأني لست متخلفا في شيء عن أولئك الرسل المتفوقين، وإن كنت لا شيئا."]]}, {"l": "Heb 13:7", "n": "", "vs": [[7, "اذكروا دائما مرشديكم الذين علموكم كلام الله. تأملوا سيرتهم حتى النهاية، واقتدوا بإيمانهم."]]}, {"l": "Heb 13:17", "n": "", "vs": [[17, "أطيعوا مرشديكم، واخضعوا لهم، لأنهم يسهرون على مصلحتكم الروحية، كما يسهر الذي يحمل مسئولية سوف يقدم حسابا عن قيامه بها. وعندئذ، يؤدون مهمتهم بفرح دون تذمر. فلن يكون في تذمرهم نفع لكم!"]]}], "kwAr": "الذين كانوا يعتبرون من البارزين", "noteAr": ""}, {"kw": "it maketh", "raw": "Gal_2:11-14; Job_32:6, Job_32:7, Job_32:17-22; Mat_22:16; Mar_6:17-20, Mar_12:14; Luk_20:21; 2Co_5:16", "note": "", "refs": [{"l": "Gal 2:11-14", "n": "", "vs": [[11, "ولكن لما جاء بطرس إلى مدينة أنطاكية، قاومته وجها لوجه لأنه كان يستحق أن يلام."], [12, "إذ قبل أن يأتي بعضهم من عند يعقوب، كان بطرس يأكل مع الإخوة الذين من الأمم؛ ولكن لما أتى أولئك، انسحب وعزل نفسه، خوفا من أهل الختان."], [13, "وجاراه في ريائه باقي الإخوة الذين من اليهود. حتى إن برنابا أيضا انساق إلى ريائهم."], [14, "فلما رأيت أنهم لا يسلكون باستقامة توافق حق الإنجيل، قلت لبطرس أمام الحاضرين جميعا: «إن كنت وأنت يهودي تعيش كالأمم لا كاليهود، فكيف تجبر الأمم أن يعيشوا كاليهود؟»"]]}, {"l": "Job 32:6", "n": "", "vs": [[6, "«أنا صغير السن وأنتم شيوخ، لذلك تهيبت وخفت أن أبدي لكم رأيي،"]]}, {"l": "Job 32:7", "n": "", "vs": [[7, "قائلا لنفسي: لتتكلم الأيام، ولتلقن كثرة السنين حكمة»"]]}, {"l": "Job 32:17-22", "n": "", "vs": [[17, "لا، سأجيب أنا أيضا وأبدي رأيي،"], [18, "لأني أفيض كلاما، والروح في داخلي يحفزني."], [19, "انظروا، إن قلبي في داخلي كخمر لم تفتح، وكزقاق جديدة تكاد تنشق!"], [20, "فلأتكلمن لأفرج عن نفسي، أفتح شفتي لأجيب."], [21, "لن أحابي إنسانا أو أتملق أحدا."], [22, "لأني لا أعرف التملق، وإلا يقضي علي صانعي سريعا."]]}, {"l": "Mat 22:16", "n": "", "vs": [[16, "فأرسلوا إليه بعض تلاميذهم مع أعضاء حزب هيرودس، يقولون له: «يامعلم، نعلم أنك صادق وتعلم الناس طريق الله في الحق، ولا تبالي بأحد لأنك لا تراعي مقامات الناس،"]]}, {"l": "Mar 6:17-20", "n": "", "vs": [[17, "فإن هيرودس هذا كان قد أرسل وقبض على يوحنا وقيده في السجن. وذلك من أجل هيروديا التي تزوجها هيرودس وهي زوجة أخيه فيلبس."], [18, "فإن يوحنا كان يقول له: «ليس حلالا لك أن تتزوج بزوجة أخيك!»"], [19, "فكانت هيروديا ناقمة على يوحنا، وتتمنى أن تقتله، ولكنها لم تستطع."], [20, "فقد كان هيرودس يرهب يوحنا لعلمه أنه رجل بار وقديس، وكان يحافظ على سلامته. ومع أنه كان يتضايق كثيرا من كلامه، إلا أنه كان يحب الاستماع إليه."]]}, {"l": "Mar 12:14", "n": "", "vs": [[14, "فجاءوا وقالوا له: «يامعلم، نحن نعلم أنك صادق، ولا تبالي بأحد، لأنك لا تراعي مقامات الناس، بل تعلم طريق الله بالحق: أيحل أن تدفع الجزية للقيصر أم لا؟ أندفعها أم لا ندفع؟»"]]}, {"l": "Luk 20:21", "n": "", "vs": [[21, "فقالوا يسألونه: «يامعلم، نعلم أنك تتكلم وتعلم بالصدق، فلا تراعي مقامات الناس، بل تعلم طريق الله بالحق:"]]}, {"l": "2Co 5:16", "n": "", "vs": [[16, "إذن، نحن منذ الآن لا نعرف أحدا معرفة بشرية. ولكن إن كنا قد عرفنا المسيح معرفة بشرية، فنحن الآن لا نعرفه هكذا بعد."]]}], "kwAr": "ولا فرق عندي", "noteAr": ""}, {"kw": "God", "raw": "Job_34:19; Act_10:34; Rom_2:11; 1Pe_1:17", "note": "", "refs": [{"l": "Job 34:19", "n": "", "vs": [[19, "الذي لا يحابي الأمراء، ولا يؤثر الأغنياء على الفقراء، لأنهم جميعا عمل يديه."]]}, {"l": "Act 10:34", "n": "", "vs": [[34, "فبدأ بطرس كلامه قائلا: «تبين لي فعلا أن الله لا يفضل أحدا على أحد،"]]}, {"l": "Rom 2:11", "n": "", "vs": [[11, "فليس عند الله تحيز."]]}, {"l": "1Pe 1:17", "n": "", "vs": [[17, "وما دمتم تعترفون بالله أبا لكم، وهو يحكم على كل إنسان حسب أعماله دون انحياز، فاسلكوا في مخافته مدة إقامتكم المؤقتة على الأرض."]]}], "kwAr": "مادام الله لا يراعي وجاهة إنسان", "noteAr": ""}, {"kw": "in", "raw": "Gal_2:10; Acts 15:6-29; 2Co_12:11", "note": "", "refs": [{"l": "Gal 2:10", "n": "", "vs": [[10, "على ألا نغفل أمر الفقراء، وهذا عينه طالما كنت مجتهدا في العمل له."]]}, {"l": "Act 15:6-29", "n": "", "vs": [[6, "فعقد الرسل والشيوخ اجتماعا لدراسة هذه القضية."], [7, "وبعد نقاش كثير، وقف بطرس وقال:"], [8, "وقد شهد الله العليم بما في القلوب على قبوله لهم إذ وهبهم الروح القدس كما وهبنا إياه."], [9, "فهو لم يفرق بيننا وبينهم في شيء، إذ طهر بالإيمان قلوبهم."], [10, "فلماذا تعارضون الله فتحملون تلاميذ الرب عبئا ثقيلا عجز الآباء وعجزنا نحن عن حمله؟"], [11, "فنحن نؤمن بأننا نخلص، كما يخلصون هم، بنعمة الرب يسوع."], [12, "»عندئذ توقف الجدال بين الحاضرين، وأخذوا يستمعون إلى برنابا وبولس وهما يخبرانهم بما أجراه الله بواسطتهما من علامات وعجائب بين غير اليهود."], [13, "وبعد انتهائهما من الكلام، قال يعقوب:"], [14, "»استمعوا لي أيها الإخوة: أخبر كم سمعان كيف تفقد الله منذ البداية غير اليهود ليتخذ من بينهم شعبا يحمل اسمه؛"], [15, "وتوافق هذا أقوال الأنبياء، كما جاء في الكتاب."], [16, "سأعود من بعد هذا وأبني خيمة داود المنهدمة ثم أقيم أنقاضها وأبنيها من جديد،"], [17, "لكي يسعى إلى الرب باقي الناس وجميع الشعوب التي تحمل اسمي، يقول الرب، فاعل هذه الأمور"], [18, "المعروفة لديه منذ الأزل."], [19, "لذلك أرى أن لا نضع عبئا على المهتدين إلى الله من غير اليهود،"], [20, "بل نكتب إليهم رسالة نوصيهم فيها بأن يمتنعوا عن الأكل من الذبائح النجسة المقربة للأصنام، وعن ارتكاب الزنى، وعن تناول لحوم الحيوانات المخنوقة، وعن الدم."], [21, "فإن لموسى، منذ القدم، أتباعا في كل مدينة، يقرأون شريعته ويبشرون بها في المجامع كل سبت»."], [22, "عند ذلك أجمع الرسل والشيوخ والجماعة كلها على اختيار رجلين من الإخوة يرسلونهما إلى أنطاكية مع بولس وبرنابا. فاختاروا يهوذا، الملقب برسابا، وسيلا، وكان لهما مكانة رفيعة بين الإخوة."], [23, "وسلموهم هذه الرسالة:"], [24, "علمنا أن بعض الأشخاص ذهبوا من عندنا إليكم، دون تفويض منا فأثاروا بكلامهم الاضطراب بينكم وأقلقوا أفكاركم."], [25, "،"], [26, "فأجمعنا برأي واحد على أن نختار رجلين قد كرسا حياتهما لاسم ربنا يسوع المسيح نرسلهما إليكم مع أخوينا الحبيبين برنابا وبولس."], [27, "فأرسلنا يهوذا وسيلا، ليبلغاكم الرسالة نفسها شفاها."], [28, "فقد رأى الروح القدس ونحن، أن لا نحملكم أي عبء فوق ما يتوجب عليكم."], [29, "إنما عليكم أن تمتنعوا عن الأكل من الذبائح المقربة للأصنام، وعن تناول الدم ولحوم الحيوانات المخنوقة، وعن ارتكاب الزنى. وتحسنون عملا إن حفظتم أنفسكم من هذه الأمور. عافاكم الله !»"]]}, {"l": "2Co 12:11", "n": "", "vs": [[11, "ها قد صرت غبيا! ولكن، أنتم أجبرتموني! فقد كان يجب أن تمدحوني أنتم، لأني لست متخلفا في شيء عن أولئك الرسل المتفوقين، وإن كنت لا شيئا."]]}], "kwAr": "لم يزيدوا شيئا", "noteAr": ""}], "arS": [["أما الذين كانوا يعتبرون من ", []], ["البارزين", ["G1380"]], ["، ولا ", []], ["فرق", ["G1308"]], [" عندي مهما كانت مكانتهم مادام ", []], ["الله", ["G2316"]], [" لا ", []], ["يراعي", ["G2983"]], [" ", []], ["وجاهة", ["G4383"]], [" ", []], ["إنسان", ["G444"]], ["، فإنهم لم ", []], ["يزيدوا", ["G4323"]], [" ", []], ["شيئا", ["G3762"]], [" على ما أبشر به.", []]]}, {"c": 2, "v": 7, "text": "بل بالعكس، رأوا أنه عهد إلي بالإنجيل لأهل عدم الختان، كما عهد به إلى بطرس لأهل الختان.", "groups": [{"kw": "when", "raw": "Gal_2:9; Act_15:12, Act_15:25, Act_15:26; 2Pe_3:15", "note": "", "refs": [{"l": "Gal 2:9", "n": "", "vs": [[9, "فلما اتضحت النعمة الموهوبة لي عند يعقوب وبطرس ويوحنا، وهم البارزون باعتبارهم أعمدة، مدوا إلي وإلى برنابا أيديهم اليمنى إشارة إلى المشاركة، فنتوجه نحن إلى الأمم وهم إلى أهل الختان،"]]}, {"l": "Act 15:12", "n": "", "vs": [[12, "»عندئذ توقف الجدال بين الحاضرين، وأخذوا يستمعون إلى برنابا وبولس وهما يخبرانهم بما أجراه الله بواسطتهما من علامات وعجائب بين غير اليهود."]]}, {"l": "Act 15:25", "n": "", "vs": [[25, "،"]]}, {"l": "Act 15:26", "n": "", "vs": [[26, "فأجمعنا برأي واحد على أن نختار رجلين قد كرسا حياتهما لاسم ربنا يسوع المسيح نرسلهما إليكم مع أخوينا الحبيبين برنابا وبولس."]]}, {"l": "2Pe 3:15", "n": "", "vs": [[15, "وتأكدوا أن تأني ربنا في رجوعه، هو فرصة للخلاص."]]}], "kwAr": "رأوا", "noteAr": ""}, {"kw": "the gospel of the uncircumcision", "raw": "Gal_1:16; Act_13:46-48, Act_18:6, Act_28:28; Rom_1:5, Rom_11:13; 1Th_2:4; 1Ti_2:7; 2Ti_1:11", "note": "", "refs": [{"l": "Gal 1:16", "n": "", "vs": [[16, "أن يعلن ابنه في لأبشر به بين الأمم، في الحال لم أستشر لحما ودما،"]]}, {"l": "Act 13:46-48", "n": "", "vs": [[46, "فخاطبهم بولس وبرنابا بجرأة قائلين: «كان يجب أن نبلغكم أنتم أولا كلمة الله، ولكنكم رفضتموها فأظهرتم أنكم لا تستحقون الحياة الأبدية. وها نحن نتوجه إلى غير اليهود!"], [47, "فقد أوصانا الرب قائلا: قد جعلتك نورا للأمم، لتكون سبيل خلاص إلى أقصى الأرض!»"], [48, "فلما سمع غير اليهود ذلك، فرحوا جدا، ومجدوا كلمة الرب. وآمن جميع من أعدهم الله للحياة الأبدية."]]}, {"l": "Act 18:6", "n": "", "vs": [[6, "ولكنهم عارضوا شهادته وأخذوا يجدفون. فما كان منه إلا أن نفض ثوبه وقال لهم: «دمكم على رؤوسكم. أنا بريء! ومنذ الآن أتوجه لتبشير غير اليهود»."]]}, {"l": "Act 28:28", "n": "", "vs": [[28, "وختم بولس كلامه بقوله: «اعلموا إذن أن الله قد أرسل خلاصه هذا إلى الأمم الأخرى، وهم سيستمعون إليه!»"]]}, {"l": "Rom 1:5", "n": "", "vs": [[5, "الذي به ولأجل اسمه نلنا نعمة ورسالة لإطاعة الإيمان بين جميع الأمم،"]]}, {"l": "Rom 11:13", "n": "", "vs": [[13, "فإني أخاطبكم، أنتم الأمم، بما أني رسول للأمم، ممجدا رسالتي،"]]}, {"l": "1Th 2:4", "n": "", "vs": [[4, "بل إننا نتكلم كمن تبين من اختبار الله لهم أنهم أهل لأن يؤتمنوا على الإنجيل، لنرضي لا الناس بل الله الذي يختبر قلوبنا."]]}, {"l": "1Ti 2:7", "n": "", "vs": [[7, "ولها قد عينت أنا مبشرا ورسولا، الحق أقول ولست أكذب، معلما للأمم في الإيمان والحق."]]}, {"l": "2Ti 1:11", "n": "", "vs": [[11, "الذي له عينت أنا مبشرا ورسولا ومعلما."]]}], "kwAr": "عهد إلي بالإنجيل لأهل عدم الختان", "noteAr": ""}], "arS": [["بل ", []], ["بالعكس", ["G5121"]], ["، ", []], ["رأوا", ["G1492"]], [" أنه ", []], ["عهد", ["G4100"]], [" إلي ", []], ["بالإنجيل", ["G2098"]], [" لأهل ", []], ["عدم الختان", ["G203"]], ["، كما عهد به إلى ", []], ["بطرس", ["G4074"]], [" لأهل ", []], ["الختان", ["G4061"]], [".", []]]}, {"c": 2, "v": 8, "text": "لأن الذي استخدم بطرس في رسوليته إلى أهل الختان، استخدمني أيضا بالنسبة إلى الأمم.", "groups": [{"kw": "he", "raw": "Act_1:8, 2:14-41, Act_3:12-26, Act_4:4, Act_5:12-16, Act_8:17", "note": "", "refs": [{"l": "Act 1:8", "n": "", "vs": [[8, "ولكن حينما يحل الروح القدس عليكم تنالون القوة، وتكونون لي شهودا في أورشليم واليهودية كلها، وفي السامرة، وإلى أقاصي الأرض»."]]}, {"l": "Act 2:14-41", "n": "", "vs": [[14, "فوقف بطرس مع الرسل الأحد عشر، وخاطب الحاضرين بصوت عال، وقال:"], [15, "ليس هؤلاء سكارى كما تتوهمون، فالناس لا يسكرون في الساعة التاسعة صباحا."], [16, "ولكن هذا ما قيل بلسان النبي يوئيل:"], [17, "يقول الله : في الأيام الأخيرة سأسكب روحي على جميع البشر، فيتنبأ بنوكم وبناتكم، ويرى شبابكم رؤى، ويحلم شيوخكم أحلاما."], [18, "في تلك الأيام أفيض من روحي على عبيدي كلهم، رجالا ونساء، فيتنبأون."], [19, "سأجري عجائب فوق في السماء وعلامات تحت على الأرض، حيث يكون دم ونار ودخان كثيف!"], [20, "وقبل أن يأتي يوم الرب، ذلك اليوم العظيم الشهير، ستظلم الشمس، ويتحول القمر إلى لون الدم."], [21, "ولكن كل من يدعو باسم الرب يخلص!"], [22, "فيا بني إسرائيل، اسمعوا هذا الكلام: إن يسوع الناصري رجل أيده الله بمعجزات وعجائب وعلامات أجراها على يده بينكم، كما تعلمون."], [23, "ومع ذلك فقد سمح الله ، وفقا لمشيئته المحتومة وعلمه السابق، أن تقبضوا عليه وتصلبوه وتقتلوه بأيدي الأثمة."], [24, "ولكن الله أقامه من بين الأموات ناقضا أوجاع الموت، فما كان يمكن للموت أن يبقيه في قبضته!"], [25, "فإن داود يقول فيه: كنت أرى الرب أمامي دائما فإنه عن يميني لئلا أتزعزع."], [26, "لذلك فرح قلبي وتهلل لساني. حتى إن جسدي سيرقد على رجاء."], [27, "لأنك لن تترك نفسي في هوة الأموات، ولن تدع وحيدك القدوس يرى فسادا،"], [28, "هديتني سبل الحياة، وستملأني سرورا برؤية وجهك!"], [29, "أيها الإخوة، دعوني أقول لكم صراحة إن أبانا داود مات ودفن، وقبره مازال عندنا حتى اليوم."], [30, "لأن داود كان نبيا، وعارفا أن الله أقسم له يمينا بأن يجيء المسيح من نسله ويجلس على عرشه،"], [31, "فقد تكلم عن قيامة المسيح كما رآها مسبقا، فقال إن نفسه لم تترك في هوة الأموات، ولم ينل من جسده الفساد."], [32, "فيسوع هذا أقامه الله من الموت، ونحن جميعا شهود لذلك."], [33, "وإذ رفع إلى يمين الله، وأخذ من الآب الروح القدس الموعود به، أفاضه علينا. وما ترونه الآن وتسمعونه هو نتيجة لذلك."], [34, "فإن داود لم يرتفع بجسده إلى السماء. ثم إنه هو نفسه يقول: قال الرب لربي: اجلس عن يميني"], [35, "حتى أجعل أعداءك موطئا لقدميك."], [36, "فليعلم يقينا بنو إسر ائيل جميعا، أن الله قد جعل يسوع، هذا الذي صلبتموه أنتم، ربا ومسيحا!»"], [37, "فلما سمع الحاضرون هذا الكلام، وخزتهم قلوبهم، فسألوا بطرس وباقي الرسل: «ماذا نعمل أيها الإخوة؟»"], [38, "أجابهم بطرس: «توبوا، وليتعمد كل واحد منكم باسم يسوع المسيح، فيغفر الله خطاياكم وتنالوا هبة الروح القدس،"], [39, "لأن الوعد هو لكم ولأولادكم وللبعيدين جميعا، يناله كل من يدعوه الرب إلهنا!»"], [40, "ثم شهد بطرس للحاضرين ووعظهم بكلام كثير آخر، قائلا: «اخلصوا من هذا الجيل المنحرف!»"], [41, "فالذين قبلوا كلامه منهم تعمدوا. وانضم في ذلك اليوم نحو ثلاثة آلاف نفس."]]}, {"l": "Act 3:12-26", "n": "", "vs": [[12, "فقال لهم بطرس إذ رأى ذلك: «يابني إسرائيل، لماذا تتعجبون مما حدث، ولماذا تحدقون إلينا كأننا بقدرتنا أو بتقوانا جعلنا هذا الرجل يمشي؟"], [13, "إن إله إبراهيم وإسحاق ويعقوب، إله آبائنا، قد مجد فتاه يسوع، الذي أسلمتموه أنتم للموت وأنكرتموه أمام بيلاطس، في حين كان يريد أن يطلقه."], [14, "أنتم أنكرتم القدوس البار وطلبتم العفو عن رجل قاتل،"], [15, "وقتلتم واهب الحياة. ولكن الله أقامه من بين الأموات ونحن شهود لذلك."], [16, "وبفضل الإيمان باسمه، أعاد اسمه القوة إلى هذا الرجل الذي ترونه وتعرفونه. فالإيمان بيسوع هو الذي أعطاه هذه الصحة الكاملة بمشهد منكم جميعا."], [17, "إني أعلم أيها الإخوة أنكم ورؤساءكم عاملتم المسيح بجهل،"], [18, "ولكن الله أتم بذلك ما كان قد أوحى به إلى جميع أنبيائه من أن المسيح سيلاقي الآلام."], [19, "فتوبوا وارجعوا ليمحو الله خطاياكم،"], [20, "وتأتيكم أيام الفرج من قبل الرب، إذ يرسل إليكم يسوع المسيح ثانية، الذي سبق أن عينه لكم،"], [21, "إذ لابد أن يبقى المسيح في السماء حتى يأتي الزمن الذي يتم فيه الإصلاح الشامل لكل شيء كما أوحى الله إلى أنبيائه الأتقياء منذ القدم."], [22, "وقد قال موسى: سيبعث الله فيكم من بين إخوتكم نبيا مثلي فاسمعوا له في كل ما يكلمكم به."], [23, "أما من لا يسمع له فيباد من وسط الشعب."], [24, "وكذلك تنبأ بهذه الأزمنة جميع الأنبياء، من صموئيل إلى الذين جاءوا بعده."], [25, "وأنتم أحفاد هؤلاء الأنبياء، وأبناء العهد الذي أبرمه الله لآبائنا عندما قال لإبراهيم: بنسلك تنال البركة شعوب الأرض كلها."], [26, "فمن أجلكم أولا أقام الله فتاه يسوع وأرسله ليبارككم برد كل واحد منكم عن شروره»."]]}, {"l": "Act 4:4", "n": "", "vs": [[4, "وكان كثيرون ممن سمعوا الكلمة قد آمنوا فصار عدد المؤمنين من الرجال نحو خمسة آلاف."]]}, {"l": "Act 5:12-16", "n": "", "vs": [[12, "وجرت على أيدي الرسل معجزات وعجائب كثيرة بين الشعب. وكانوا كلهم يجتمعون بقلب واحد في قاعة سليمان بالهيكل."], [13, "ولم يجرؤ أحد من خارج على الانضمام إليهم، بل كان الشعب يشيد بهم."], [14, "وأخذ عدد المؤمنين بالرب يزداد بانضمام جماعات من الرجال والنساء."], [15, "وكان الناس يحملون المرضى على فرشهم وأسرتهم إلى الشوارع، لعل ظل بطرس عند مروره يقع على أحد منهم فينال الشفاء."], [16, "بل كانت الجموع من المدن والقرى المجاورة يأتون إلى أورشليم حاملين المرضى والمعذبين بالأرواح النجسة، فكانوا جميعا يبرأون."]]}, {"l": "Act 8:17", "n": "", "vs": [[17, "ثم وضعا أيديهما عليهم، فنالوا الروح القدس."]]}], "kwAr": "الذي استخدم بطرس", "noteAr": ""}, {"kw": "the same", "raw": "Gal_3:5; Act_9:15, Act_13:2-11, Act_14:3-11, Act_15:12, Act_19:11, Act_19:12, Act_19:26, Act_21:19, Act_22:21; Act_26:17, Act_26:18; 1Co_1:5-7, 1Co_9:2, 1Co_15:10; 2Co_11:4, 2Co_11:5; Col_1:29", "note": "", "refs": [{"l": "Gal 3:5", "n": "", "vs": [[5, "فذاك الذي يهبكم الروح، ويجري معجزات في ما بينكم، أيفعل ذلك على أساس أعمال الشريعة أم على أساس الإيمان بالبشارة؟"]]}, {"l": "Act 9:15", "n": "", "vs": [[15, "فأمره الرب: «اذهب! فقد اخترت هذا الرجل ليكون إناء يحمل اسمي إلى الأمم والملوك وبني إسرائيل."]]}, {"l": "Act 13:2-11", "n": "", "vs": [[2, "وذات يوم، وهم صائمون يتعبدون للرب، قال لهم الروح القدس: «خصصوا لي برنابا وشاول لأجل العمل الذي دعوتهما إليه»."], [3, "فبعدما صاموا وصلوا ووضعوا عليهما أيديهم أطلقوهما."], [4, "وإذ أرسل الروح القدس برنابا وشاول، توجها إلى ميناء سلوكية، وسافرا بحرا باتجاه قبرص."], [5, "ولما وصلا الجزيرة نزلا في سلاميس، وأخذا يبشران بكلمة الله في مجامع اليهود، وكان يرافقهما يوحنا معاونا لهما."], [6, "واجتازا الجزيرة كلها حتى وصلا بافوس. وهناك قابلا ساحرا يهوديا نبيا دجالا، اسمه باريشوع،"], [7, "وكان مقربا من سرجيوس بولس حاكم قبرص. وكان الحاكم ذكيا، فاستدعى برنابا وشاول، وطلب إليهما أن يكلماه بكلمة الله."], [8, "فعارضهما الساحر عليم، وهذا معنى اسمه، ساعيا أن يحول الحاكم عن الإيمان."], [9, "أما شاول، وقد صار اسمه بولس، فامتلأ من الروح القدس، ونظر إلى الساحر وقال:"], [10, "«أيها الممتليء غشا وخبثا! ياابن إبليس! ياعدو كل بر! أما تكف عن تعويج طرق الرب المستقيمة؟"], [11, "الآن ستمتد يد الرب عليك، فتصير أعمى لا تبصر النور إلى حين». وفي الحال سقطت على عينيه غمامة مظلمة، فأخذ يدور طالبا من يقوده بيده!"]]}, {"l": "Act 14:3-11", "n": "", "vs": [[3, "إلا أن بولس وبرنابا بقيا هناك فترة طويلة يبشران بالرب بكل جرأة، وأيدهما الرب شاهدا لكلمة نعمته بما أجراه على أيديهما من آيات وعجائب."], [4, "فانقسم أهل إيقونية فريقين: فمنهم من كان مع اليهود، ومنهم من كان مع الرسولين."], [5, "ولما أوشك غير اليهود واليهود ورؤساؤهم أن يهينوا الرسولين ويرجموهما بالحجارة،"], [6, "علما بذلك فهربا إلى مدينتي لسترة ودربة الواقعتين في مقاطعة ليكأونية، وإلى المنطقة المحيطة بهما،"], [7, "وأخذا يبشران هناك."], [8, "وكان يقيم في مدينة لسترة كسيح مقعد منذ ولادته لم يمش قط."], [9, "فإذ كان يصغي إلى حديث بولس فرأى فيه إيمانا بأنه سيشفى،"], [10, "فناداه بأعلى صوته: «انهض واقفا على رجليك!» فقفز الرجل وبدأ يمشي."], [11, "فلما رأى الحاضرون ما قام به بولس هتفوا باللغة الليكأونية: «اتخذ الآلهة صورة بشر ونزلوا بيننا!»"]]}, {"l": "Act 15:12", "n": "", "vs": [[12, "»عندئذ توقف الجدال بين الحاضرين، وأخذوا يستمعون إلى برنابا وبولس وهما يخبرانهم بما أجراه الله بواسطتهما من علامات وعجائب بين غير اليهود."]]}, {"l": "Act 19:11", "n": "", "vs": [[11, "وكان الله يجري معجزات خارقة على يد بولس،"]]}, {"l": "Act 19:12", "n": "", "vs": [[12, "حتى صار الناس يأخذون المناديل أو المآزر التي مست جسده، ويضعونها على المرضى، فتزول أمراضهم وتخرج الأرواح الشريرة منهم."]]}, {"l": "Act 19:26", "n": "", "vs": [[26, "وقد رأيتم وسمعتم أن بولس هذا أضل عددا كبيرا من الناس، لا في أفسس وحدها، بل في مقاطعة أسيا كلها تقريبا، وأقنعهم بأن الآلهة التي تصنعها الأيدي ليست بآلهة."]]}, {"l": "Act 21:19", "n": "", "vs": [[19, "فسلم بولس عليهم وأخذ يخبرهم على التوالي بكل ما فعله الله بين غير اليهود بواسطة خدمته."]]}, {"l": "Act 22:21", "n": "", "vs": [[21, "ولكنه قال لي: اذهب ... سأرسلك بعيدا: إلى الأمم!»"]]}, {"l": "Act 26:17", "n": "", "vs": [[17, "وسأنقذك من شعبك ومن الأمم التي أرسلك إليها الآن،"]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "1Co 1:5-7", "n": "", "vs": [[5, "فبه قد صرتم أغنياء في كل شيء، في كل كلام، وكل معرفة،"], [6, "بمقدار ما ترسخت فيكم شهادة المسيح."], [7, "حتى إنكم لا تحتاجون بعد إلى أية موهبة فيما تتوقعون ظهور ربنا يسوع المسيح علنا."]]}, {"l": "1Co 9:2", "n": "", "vs": [[2, "إن لم أكن رسولا إلى غيركم، فإنما أنا رسول إليكم، لأنكم ختم رسوليتي في الرب."]]}, {"l": "1Co 15:10", "n": "", "vs": [[10, "ولكن، بنعمة الله صرت على ما أنا عليه الآن، ونعمته الموهوبة لي لم تكن عبثا، إذ عملت جاهدا أكثر من الرسل الآخرين جميعا. إلا أني لم أكن أنا العامل، بل نعمة الله التي كانت معي."]]}, {"l": "2Co 11:4", "n": "", "vs": [[4, "فإذا كان من يأتيكم يبشر بيسوع آخر لم نبشر به نحن أو كنتم تنالون روحا آخر لم تنالوه، أو تقبلون إنجيلا لم تقبلوه، فإنكم تحتملون ذلك بكل سرور."]]}, {"l": "2Co 11:5", "n": "", "vs": [[5, "فإني أعتبر نفسي غير متخلف في شيء عن أولئك الرسل المتفوقين."]]}, {"l": "Col 1:29", "n": "", "vs": [[29, "ولأجل هذا أتعب أنا أيضا وأجاهد، بفضل قدرته العاملة في بقوة."]]}], "kwAr": "استخدمني أيضا", "noteAr": ""}], "arS": [["لأن الذي ", []], ["استخدم", ["G1754"]], [" ", []], ["بطرس", ["G4074"]], [" في ", []], ["رسوليته", ["G651"]], [" إلى أهل ", []], ["الختان", ["G4061"]], ["، ", []], ["استخدمني", ["G1754"]], [" أيضا بالنسبة إلى ", []], ["الأمم", ["G1484"]], [".", []]]}, {"c": 2, "v": 9, "text": "فلما اتضحت النعمة الموهوبة لي عند يعقوب وبطرس ويوحنا، وهم البارزون باعتبارهم أعمدة، مدوا إلي وإلى برنابا أيديهم اليمنى إشارة إلى المشاركة، فنتوجه نحن إلى الأمم وهم إلى أهل الختان،", "groups": [{"kw": "James", "raw": "Act_15:7, Act_15:13, Act_15:22-29", "note": "", "refs": [{"l": "Act 15:7", "n": "", "vs": [[7, "وبعد نقاش كثير، وقف بطرس وقال:"]]}, {"l": "Act 15:13", "n": "", "vs": [[13, "وبعد انتهائهما من الكلام، قال يعقوب:"]]}, {"l": "Act 15:22-29", "n": "", "vs": [[22, "عند ذلك أجمع الرسل والشيوخ والجماعة كلها على اختيار رجلين من الإخوة يرسلونهما إلى أنطاكية مع بولس وبرنابا. فاختاروا يهوذا، الملقب برسابا، وسيلا، وكان لهما مكانة رفيعة بين الإخوة."], [23, "وسلموهم هذه الرسالة:"], [24, "علمنا أن بعض الأشخاص ذهبوا من عندنا إليكم، دون تفويض منا فأثاروا بكلامهم الاضطراب بينكم وأقلقوا أفكاركم."], [25, "،"], [26, "فأجمعنا برأي واحد على أن نختار رجلين قد كرسا حياتهما لاسم ربنا يسوع المسيح نرسلهما إليكم مع أخوينا الحبيبين برنابا وبولس."], [27, "فأرسلنا يهوذا وسيلا، ليبلغاكم الرسالة نفسها شفاها."], [28, "فقد رأى الروح القدس ونحن، أن لا نحملكم أي عبء فوق ما يتوجب عليكم."], [29, "إنما عليكم أن تمتنعوا عن الأكل من الذبائح المقربة للأصنام، وعن تناول الدم ولحوم الحيوانات المخنوقة، وعن ارتكاب الزنى. وتحسنون عملا إن حفظتم أنفسكم من هذه الأمور. عافاكم الله !»"]]}], "kwAr": "يعقوب وبطرس ويوحنا", "noteAr": ""}, {"kw": "pillars", "raw": "Gal_2:2, Gal_2:6, Gal_2:12-14; Mat_16:18; Eph_2:20; Rev_3:12, Rev_21:14-20", "note": "", "refs": [{"l": "Gal 2:2", "n": "", "vs": [[2, "وإنما صعدت إليها استجابة للوحي؛ وبسطت أمامهم الإنجيل الذي أبشر به بين الأمم، ولكن على انفراد أمام البارزين فيهم، لئلا يكون مسعاي في الحاضر والماضي بلا جدوى."]]}, {"l": "Gal 2:6", "n": "", "vs": [[6, "أما الذين كانوا يعتبرون من البارزين، ولا فرق عندي مهما كانت مكانتهم مادام الله لا يراعي وجاهة إنسان، فإنهم لم يزيدوا شيئا على ما أبشر به."]]}, {"l": "Gal 2:12-14", "n": "", "vs": [[12, "إذ قبل أن يأتي بعضهم من عند يعقوب، كان بطرس يأكل مع الإخوة الذين من الأمم؛ ولكن لما أتى أولئك، انسحب وعزل نفسه، خوفا من أهل الختان."], [13, "وجاراه في ريائه باقي الإخوة الذين من اليهود. حتى إن برنابا أيضا انساق إلى ريائهم."], [14, "فلما رأيت أنهم لا يسلكون باستقامة توافق حق الإنجيل، قلت لبطرس أمام الحاضرين جميعا: «إن كنت وأنت يهودي تعيش كالأمم لا كاليهود، فكيف تجبر الأمم أن يعيشوا كاليهود؟»"]]}, {"l": "Mat 16:18", "n": "", "vs": [[18, "وأنا أيضا أقول لك: أنت صخر. وعلى هذه الصخرة أبني كنيستي وأبواب الجحيم لن تقوى عليها!"]]}, {"l": "Eph 2:20", "n": "", "vs": [[20, "وقد بنيتم على أساس الرسل والأنبياء، والمسيح يسوع نفسه هو حجر الزاوية الأساس،"]]}, {"l": "Rev 3:12", "n": "", "vs": [[12, "كل من ينتصر سأجعله عمودا في هيكل إلهي، فلا يخرج منه أبدا، وسأكتب عليه اسم إلهي واسم مدينة إلهي أورشليم الجديدة، التي تنزل من السماء من عند إلهي، وأكتب عليه اسمي الجديد."]]}, {"l": "Rev 21:14-20", "n": "", "vs": [[14, "ويقوم سور المدينة على اثنتي عشرة دعامة كتبت عليها أسماء رسل الحمل الاثني عشر."], [15, "وكان الملاك الذي يكلمني يمسك قصبة من الذهب ليقيس بها المدينة وأبوابها وسورها."], [16, "وكانت أرض المدينة مربعة، طولها يساوي عرضها، فلما قاسها بالقصبة تبين أن ضلعها يساوي ألفين وأربعمئة كيلومتر، وهي متساوية الطول والعرض والارتفاع."], [17, "ثم قاس السور، فتبين أنه يساوي مئة وأربعا وأربعين ذراعا، وكان الملاك يستعمل قياسا يعادل ذراع إنسان."], [18, "كانت المدينة مبنية من ذهب خالص شفاف كالزجاج النقي. أما سورها فمن اليشب،"], [19, "وهو قائم على اثنتي عشرة دعامة مرصعة بالأحجار الكريمة: كانت الدعامة الأولى من اليشب؛ والثانية من الياقوت الأزرق؛ والثالثة من العقيق الأبيض؛ والرابعة من الزمرد الذبابي؛"], [20, "والخامسة من الجزع العقيقي؛ والسادسة من العقيق الأحمر؛ والسابعة من الزبرجد؛ والثامنة من الزمرد السلقي؛ والتاسعة من الياقوت الأصفر، والعاشرة من العقيق الأخضر؛ والحادية عشرة من الأسمانجوني؛ والثانية عشرة من الجمشت."]]}], "kwAr": "أعمدة", "noteAr": ""}, {"kw": "the grace", "raw": "Rom_1:5, Rom_12:3, Rom_12:5, Rom_12:6, Rom_15:15; 1Co_15:10; Eph_3:8; Col_1:29; 1Pe_4:10,1Pe_4:11", "note": "", "refs": [{"l": "Rom 1:5", "n": "", "vs": [[5, "الذي به ولأجل اسمه نلنا نعمة ورسالة لإطاعة الإيمان بين جميع الأمم،"]]}, {"l": "Rom 12:3", "n": "", "vs": [[3, "فإني، بالنعمة الموهوبة لي، أوصي كل واحد بينكم ألا يقدر نفسه تقديرا يفوق حقه، بل أن يكون متعقلا في تفكيره، بحسب مقدار الإيمان الذي قسمه الله لكل منكم."]]}, {"l": "Rom 12:5", "n": "", "vs": [[5, "فكذلك نحن الكثيرين جسد واحد في المسيح، وكلنا أعضاء بعضنا لبعض."]]}, {"l": "Rom 12:6", "n": "", "vs": [[6, "ولكن، بما أن المواهب موزعة بحسب النعمة الموهوبة لنا، (فلنمارسها): فمن وهب النبوءة، فليتنبأ بحسب مقدار الإيمان؛"]]}, {"l": "Rom 15:15", "n": "", "vs": [[15, "على أني كتبت إليكم بأوفر جرأة في بعض الأمور، مذكرا لكم، وذلك بالنعمة التي وهبها الله لي."]]}, {"l": "1Co 15:10", "n": "", "vs": [[10, "ولكن، بنعمة الله صرت على ما أنا عليه الآن، ونعمته الموهوبة لي لم تكن عبثا، إذ عملت جاهدا أكثر من الرسل الآخرين جميعا. إلا أني لم أكن أنا العامل، بل نعمة الله التي كانت معي."]]}, {"l": "Eph 3:8", "n": "", "vs": [[8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "Col 1:29", "n": "", "vs": [[29, "ولأجل هذا أتعب أنا أيضا وأجاهد، بفضل قدرته العاملة في بقوة."]]}, {"l": "1Pe 4:10", "n": "", "vs": [[10, "وعلى كل واحد منكم أن يخدم الآخرين بالموهبة التي أعطاه الله إياها، باعتباركم وكلاء صالحين مؤتمنين على أنواع متعددة من المواهب التي يمنحها الله بالنعمة."]]}, {"l": "1Pe 4:11", "n": "", "vs": [[11, "فمن يتكلم، عليه أن يتكلم بما يوافق أقوال الله؛ ومن يخدم، عليه أن يخدم بموجب القوة التي يمنحها الله . وذلك لكي يتمجد الله في كل شيء، بيسوع المسيح، له المجد والسلطة إلى أبد الآبدين. آمين!"]]}], "kwAr": "النعمة الموهوبة لي", "noteAr": ""}, {"kw": "fellowship", "raw": "2Co_8:4; 1Jo_1:3", "note": "", "refs": [{"l": "2Co 8:4", "n": "", "vs": [[4, "وقد توسلوا إلينا بإلحاح شديد أن نقبل إحسانهم واشتراكهم في إعانة القديسين."]]}, {"l": "1Jo 1:3", "n": "", "vs": [[3, "فنحن، إذن، نخبركم بما رأيناه وسمعناه، لكي تكونوا شركاءنا. كما أن شركتنا هي مع الآب ومع ابنه يسوع المسيح."]]}], "kwAr": "أيديهم اليمنى إشارة إلى المشاركة", "noteAr": ""}, {"kw": "we should", "raw": "Act_15:23-30", "note": "", "refs": [{"l": "Act 15:23-30", "n": "", "vs": [[23, "وسلموهم هذه الرسالة:"], [24, "علمنا أن بعض الأشخاص ذهبوا من عندنا إليكم، دون تفويض منا فأثاروا بكلامهم الاضطراب بينكم وأقلقوا أفكاركم."], [25, "،"], [26, "فأجمعنا برأي واحد على أن نختار رجلين قد كرسا حياتهما لاسم ربنا يسوع المسيح نرسلهما إليكم مع أخوينا الحبيبين برنابا وبولس."], [27, "فأرسلنا يهوذا وسيلا، ليبلغاكم الرسالة نفسها شفاها."], [28, "فقد رأى الروح القدس ونحن، أن لا نحملكم أي عبء فوق ما يتوجب عليكم."], [29, "إنما عليكم أن تمتنعوا عن الأكل من الذبائح المقربة للأصنام، وعن تناول الدم ولحوم الحيوانات المخنوقة، وعن ارتكاب الزنى. وتحسنون عملا إن حفظتم أنفسكم من هذه الأمور. عافاكم الله !»"], [30, "فانطلق حاملو الرسالة، وسافروا إلى أنطاكية، حيث دعوا الجماعة إلى الاجتماع، وقدموا إليهم الرسالة."]]}], "kwAr": "فنتوجه نحن إلى الأمم", "noteAr": ""}], "arS": [["فلما اتضحت ", []], ["النعمة", ["G5485"]], [" ", []], ["الموهوبة", ["G1325"]], [" لي عند ", []], ["يعقوب", ["G2385"]], [" ", []], ["وبطرس", ["G2786"]], [" ", []], ["ويوحنا", ["G2491"]], ["، وهم ", []], ["البارزون", ["G1380"]], [" باعتبارهم ", []], ["أعمدة", ["G4769"]], ["، مدوا إلي وإلى ", []], ["برنابا", ["G921"]], [" أيديهم ", []], ["اليمنى", ["G1188"]], [" إشارة إلى ", []], ["المشاركة", ["G2842"]], ["، فنتوجه نحن إلى ", []], ["الأمم", ["G1484"]], [" وهم إلى أهل ", []], ["الختان", ["G4061"]], ["،", []]]}, {"c": 2, "v": 10, "text": "على ألا نغفل أمر الفقراء، وهذا عينه طالما كنت مجتهدا في العمل له.", "groups": [{"kw": "that", "raw": "Act_11:29, Act_11:30, Act_24:17; Rom_15:25-27; 1Co_16:1, 1Co_16:2; 2Cor. 8:1-9:15; Heb_13:16; Jam_2:15, Jam_2:16; 1Jo_3:17", "note": "", "refs": [{"l": "Act 11:29", "n": "", "vs": [[29, "لذلك قرر التلاميذ في أنطاكية أن يتبرع كل منهم بما يتيسر له، ويرسلوا إعانة إلى الإخوة المقيمين في اليهودية."]]}, {"l": "Act 11:30", "n": "", "vs": [[30, "ففعلوا ذلك، وأرسلوا الإعانة إلى الشيوخ بيد برنابا وشاول."]]}, {"l": "Act 24:17", "n": "", "vs": [[17, "وبعد غياب عدة سنوات عن أورشليم، رجعت إليها أحمل بعض التبرعات إلى شعبي، وأقرب تقدمات."]]}, {"l": "Rom 15:25-27", "n": "", "vs": [[25, "على أني الآن ذاهب إلى أورشليم في خدمة القديسين."], [26, "ذلك أن مؤمني مقاطعتي مقدونية وأخائية حسن لديهم أن يجمعوا إعانة للفقراء بين القديسين الذين في أورشليم."], [27, "حسن لديهم ذلك، وهم في دين لأولئك القديسين: فإذا كان الأمم قد اشتركوا في ما هو روحي عند أولئك، فعليهم أيضا أن يخدموهم في ما هو مادي."]]}, {"l": "1Co 16:1", "n": "", "vs": [[1, "وأما بخصوص جمع التبرعات للقديسين، فكما أوصيت الكنائس في مقاطعة غلاطية، كذلك اعملوا أنتم أيضا."]]}, {"l": "1Co 16:2", "n": "", "vs": [[2, "ففي أول يوم من الأسبوع، ليضع كل منكم جانبا ما يتيسر له مما يكسبه؛ وليحتفظ به، حتى لا يحصل الجمع عندما أذهب إليكم."]]}, {"l": "2Co 8:1-9:15", "n": "", "vs": [[1, "والآن، نعرفكم، أيها الإخوة، بنعمة الله الموهوبة في كنائس مقاطعة مقدونية."], [2, "فمع أنهم كانوا في تجربة ضيقة شديدة، فإن فرحهم الوافر مع فقرهم الشديد فاضا فأنتجا منهم سخاء غنيا."], [3, "فإني أشهد أنهم تبرعوا من تلقاء أنفسهم، لا على قدر طاقتهم وحسب، بل فوق طاقتهم."], [4, "وقد توسلوا إلينا بإلحاح شديد أن نقبل إحسانهم واشتراكهم في إعانة القديسين."], [5, "كما أنهم تجاوزوا ما توقعناه، إذ كرسوا أنفسهم أولا للرب ثم لنا نحن بمشيئة الله،"], [6, "مما جعلنا نلتمس من تيطس أن يكمل عندكم هذا الإحسان كما سبق أن ابتدأ به."], [7, "ولكن، كما أنكم في وفرة من كل شيء: من الإيمان، والكلمة، والمعرفة، والاجتهاد في كل أمر، ومحبتكم لنا، ليتكم تكونون أيضا في وفرة من نعمة العطاء هذه."], [8, "لا أقول هذا على سبيل الأمر، بل اختبارا لصدق محبتكم بحماسة الآخرين."], [9, "فأنتم تعرفون نعمة ربنا يسوع المسيح: فمن أجلكم افتقر، وهو الغني لكي تغتنوا أنتم بفقره."], [10, "وأنا أبدي لكم رأيي في الموضوع. فإن هذا نافع لكم أنتم الذين سبق أن بدأتم منذ السنة الماضية لا أن تفعلوا فقط بل أن ترغبوا أيضا:"], [11, "إنما الآن أكملوا القيام بذلك العمل، حتى كما كان لكم الاستعداد لأن ترغبوا، يكون لكم أيضا الاستعداد لأن تكملوا العمل مما تملكون."], [12, "فمتى وجد الاستعداد، يقبل العطاء على قدر ما يملك الإنسان، لا على قدر ما لا يملك."], [13, "وليس ذلك بهدف أن يكون الآخرون في وفرة وتكونوا أنتم في ضيق، بل على مبدأ المساواة:"], [14, "ففي الحالة الحاضرة، تسد وفرتكم حاجتهم، لكي تسد وفرتهم حاجتكم، فتتم المساواة،"], [15, "وفقا لما قد كتب: «المكثر لم يفضل عنه شيء، والمقلل لم ينقصه شيء»."], [16, "ولكن، شكرا لله الذي وضع في قلب تيطس مثل هذه الحماسة لأجلكم."], [17, "فقد لبى التماسنا فعلا، بل انطلق إليكم من تلقاء نفسه لكونه أشد حماسة."], [18, "وقد أرسلنا معه الأخ الذي ذاع مدحه بين الكنائس كلها في خدمة الإنجيل."], [19, "ليس هذا وحسب، بل هو أيضا منتخب الكنائس رفيقا لنا في السفر لإيصال هذا الإحسان الذي نعمل له تمجيدا للرب نفسه وإظهارا لاهتمامنا بعضنا ببعض."], [20, "ونحن حريصون على ألا يلومنا أحد في أمر هذه التقدمة الكبيرة التي نتولى القيام بها."], [21, "فإننا نحرص على النزاهة لا أمام الرب فقط، بل أمام الناس أيضا."], [22, "وأرسلنا معهما أخانا الذي تبين لنا بالاختبار مرة بعد مرة، أن له حماسة شديدة في أمور كثيرة، وهو الآن أوفر جدا في الحماسة بسبب ثقته العظيمة بكم."], [23, "أما تيطس، فهو زميلي ومعاوني من أجل مصلحتكم. وأما أخوانا الآخران، فهما رسولا الكنائس ومجد المسيح."], [24, "فأثبتوا لهم إذن أمام الكنائس برهان محبتكم وصواب افتخارنا بكم."], [1, "فإنه من غير الضروري أن أكتب إليكم في موضوع إعانة القديسين،"], [2, "مادمت أعرف استعدادكم الذي أفتخر به من جهتكم عند المقدونيين فأقول: إن مقاطعة أخائية جاهزة للإعانة منذ السنة الماضية. وحماستكم كانت دافعا لأكثر الإخوة."], [3, "ولكني أرسلت إليكم الإخوة لكي لا ينقلب افتخارنا بكم في هذا الأمر افتخارا باطلا ولكي تكونوا جاهزين كما قلت؛"], [4, "لئلا نضطر نحن، ولا أقول أنتم، إلى الخجل بهذه الثقة العظيمة إذا ما رافقني بعض المقدونيين ووجدوكم غير جاهزين."], [5, "لذلك رأيت من اللازم أن ألتمس من الإخوة أن يسبقوني إليكم، لكي يعدوا أولا بركتكم التي سبق الإعلان عنها، فتكون جاهزة باعتبارها بركة، لا كأنها واجب ثقيل!"], [6, "فمن الحق أن من يزرع بالتقتير، يحصد أيضا بالتقتير، ومن يزرع بالبركات، يحصد أيضا بالبركات."], [7, "فليتبرع كل واحد بما نوى في قلبه، لا بأسف ولا عن اضطرار، لأن الله يحب المعطي المتهلل."], [8, "والله قادر أن يجعل كل نعمة تفيض عليكم، حتى يكون لكم اكتفاء كلي في كل شيء وكل حين، فتفيضوا في كل عمل صالح؛"], [9, "وفقا لما قد كتب: «وزع بسخاء، أعطى الفقراء، بره يدوم إلى الأبد!»"], [10, "والذي يقدم بذارا للزارع، وخبزا للأكل، سيقدم لكم بذاركم ويكثره ويزيد أثمار بركم:"], [11, "إذ تغتنون في كل شيء، لأجل كل سخاء طوعي ينتج بنا شكرا لله"], [12, "ذلك لأن خدمة الله بهذه الإعانة لا تسد حاجة القديسين وحسب، بل تفيض بشكر كثير لله."], [13, "فإن القديسين، إذ يختبرون هذه الخدمة، يمجدون الله على طاعتكم في الشهادة لإنجيل المسيح وعلى السخاء الطوعي في مشاركتكم لهم وللجميع."], [14, "كما يرفعون الدعاء لأجلكم، متشوقين إليكم، بسبب نعمة الله الفائقة التي ظهرت فيكم."], [15, "فشكرا لله على عطيته المجانية التي تفوق الوصف!"]]}, {"l": "Heb 13:16", "n": "", "vs": [[16, "ولا تغفلوا أيضا عن عمل الخير وإعانة المحتاجين: لأن مثل هذه «الذبائح» تسر الله جدا!"]]}, {"l": "Jam 2:15", "n": "", "vs": [[15, "لنفرض أن أخا أو أختا كانا بحاجة شديدة إلى الثياب والطعام اليومي،"]]}, {"l": "Jam 2:16", "n": "", "vs": [[16, "وقال لهما أحدكم: «أتمنى لكما كل خير. البسا ثيابا دافئة، وكلا طعاما جيدا!» دون أن يقدم لهما ما يحتاجان إليه من ثياب وطعام، فأي نفع في ذلك؟"]]}, {"l": "1Jo 3:17", "n": "", "vs": [[17, "وأما الذي يملك مالا يمكنه من العيش في بحبوحة، ويقسي قلبه على أحد الإخوة المحتاجين، فكيف تكون محبة الله متأصلة فيه؟"]]}], "kwAr": "على ألا نغفل أمر الفقراء", "noteAr": ""}], "arS": [["على ألا نغفل أمر ", []], ["الفقراء", ["G4434"]], ["، وهذا عينه طالما كنت ", []], ["مجتهدا", ["G4704"]], [" في العمل له.", []]]}, {"c": 2, "v": 11, "text": "ولكن لما جاء بطرس إلى مدينة أنطاكية، قاومته وجها لوجه لأنه كان يستحق أن يلام.", "groups": [{"kw": "to Antioch", "raw": "Act_15:30-35", "note": "", "refs": [{"l": "Act 15:30-35", "n": "", "vs": [[30, "فانطلق حاملو الرسالة، وسافروا إلى أنطاكية، حيث دعوا الجماعة إلى الاجتماع، وقدموا إليهم الرسالة."], [31, "ولما قرأوها فرحوا بما فيها من تشجيع."], [32, "وكان يهوذا وسيلا نبيين أيضا، فوعظا الإخوة كثيرا، وشددا عزيمتهم."], [33, "وبعد مدة من الزمن صرفهما الإخوة في أنطاكية بسلام إلى الذين أرسلوهما."], [34, "ولكن سيلا استحسن البقاء في أنطاكية، فعاد يهوذا وحده."], [35, "وبقي هناك أيضا بولس وبرنابا يعلمان ويبشران بكلمة الرب، يعاونهما آخرون كثيرون."]]}], "kwAr": "إلى مدينة أنطاكية", "noteAr": ""}, {"kw": "I withstood", "raw": "Gal_2:5; 2Co_5:16, 2Co_11:5, 2Co_11:21-28, 2Co_12:11; 1Ti_5:20; Jud_1:3", "note": "", "refs": [{"l": "Gal 2:5", "n": "", "vs": [[5, "فلم نخضع لهم مستسلمين ولو لساعة واحدة، ليبقى حق الإنجيل ثابتا عندكم."]]}, {"l": "2Co 5:16", "n": "", "vs": [[16, "إذن، نحن منذ الآن لا نعرف أحدا معرفة بشرية. ولكن إن كنا قد عرفنا المسيح معرفة بشرية، فنحن الآن لا نعرفه هكذا بعد."]]}, {"l": "2Co 11:5", "n": "", "vs": [[5, "فإني أعتبر نفسي غير متخلف في شيء عن أولئك الرسل المتفوقين."]]}, {"l": "2Co 11:21-28", "n": "", "vs": [[21, "ياللمهانة! كم كنا ضعفاء في معاملتنا لكم!"], [22, "فإن كانوا عبرانيين، فأنا كذلك؛ أو إسرائيليين، فأنا كذلك؛ أو من نسل إبراهيم؛ فأنا كذلك!"], [23, "وإن كانوا خدام المسيح، أتكلم كأني فقدت صوابي، فأنا متفوق عليهم: في الأتعاب أوفر منهم جدا، في الجلدات فوق الحد، في السجون أوفر جدا، في التعرض للموت أكثر مرارا."], [24, "من اليهود تلقيت الجلد خمس مرات، كل مرة أربعين جلدة إلا واحدة."], [25, "ضربت بالعصي ثلاث مرات. رجمت بالحجارة مرة. تحطمت بي السفينة ثلاث مرات. قضيت في عرض البحر يوما بنهاره وليله."], [26, "سافرت أسفارا عديدة؛ وواجهتني أخطار السيول الجارفة، وأخطار قطاع الطرق، وأخطار من بني جنسي، وأخطار من الأمم، وأخطار في المدن، وأخطار في البراري، وأخطار في البحر، وأخطار بين إخوة دجالين."], [27, "وكم عانيت من التعب والكد والسهر الطويل، والجوع والعطش والصوم الكثير، والبرد والعري."], [28, "وفضلا عن هذه المخاطر الخارجية، يزداد علي الضغط يوما بعد يوم، إذ أحمل هم جميع الكنائس."]]}, {"l": "2Co 12:11", "n": "", "vs": [[11, "ها قد صرت غبيا! ولكن، أنتم أجبرتموني! فقد كان يجب أن تمدحوني أنتم، لأني لست متخلفا في شيء عن أولئك الرسل المتفوقين، وإن كنت لا شيئا."]]}, {"l": "1Ti 5:20", "n": "", "vs": [[20, "فإذا ثبت أن المتهم مخطيء، وبخه أمام الجميع، ليكون عند الباقين خوف!"]]}, {"l": "Jud 1:3", "n": "", "vs": [[3, "أيها الأحباء، كنت قد نويت أن أكتب إليكم في موضوع الخلاص الذي نشترك فيه جميعا. ولكن، أراني الآن مضطرا لأن أكتب لأشجعكم على الجهاد في سبيل الإيمان الذي سلم مرة واحدة للقديسين."]]}], "kwAr": "قاومته وجها لوجه", "noteAr": ""}, {"kw": "because", "raw": "Exo_32:21, Exo_32:22; Num_20:12; Jer_1:17; Jon_1:3, Jon_4:3, Jon_4:4, Jon_4:9; Mat_16:17, Mat_16:18, Mat_16:23; Act_15:37-39, Act_23:1-5; Jam_3:2; 1Jo_1:8-10", "note": "", "refs": [{"l": "Exo 32:21", "n": "", "vs": [[21, "وخاطب موسى هرون: «ماذا فعل بك هذا الشعب حتى جلبت عليه هذه الخطيئة العظيمة؟»"]]}, {"l": "Exo 32:22", "n": "", "vs": [[22, "فأجاب هرون: «لا يحتدم غضب سيدي. إنك تعرف شر هذا الشعب."]]}, {"l": "Num 20:12", "n": "", "vs": [[12, "فقال الرب لموسى وهرون: «من حيث أنكما لم تؤمنا بي حتى تقدساني على مرأى من بني إسرائيل فإنكما لن تدخلا هذا الشعب الأرض التي وهبتها لهم»."]]}, {"l": "Jer 1:17", "n": "", "vs": [[17, "أما أنت فتأهب، وقم وكلمهم بكل ما آمرك به. لا تخف من حضرتهم لئلا أفزعك أمامهم."]]}, {"l": "Jon 1:3", "n": "", "vs": [[3, "غير أن يونان تأهب ليهرب من الرب إلى ترشيش، فانحدر إلى مدينة يافا حيث عثر على سفينة مبحرة إلى ترشيش، فدفع أجرتها وصعد إليها ليتوجه مع بحارتها إلى ترشيش هربا من الرب."]]}, {"l": "Jon 4:3", "n": "", "vs": [[3, "والآن دعني أيها الرب ألفظ أنفاسي لأنه خير لي أن أموت من أن أحيا»."]]}, {"l": "Jon 4:4", "n": "", "vs": [[4, "فقال الرب: «أأنت محق في غضبك؟»"]]}, {"l": "Jon 4:9", "n": "", "vs": [[9, "فقال الله ليونان: «أأنت محق في غضبك من أجل اليقطينة؟» فأجاب: «أنا محق في غضبي حتى الموت»."]]}, {"l": "Mat 16:17", "n": "", "vs": [[17, "فقال له يسوع: «طوبى لك ياسمعان بن يونا. فما أعلن لك هذا لحم ودم، بل أبي الذي في السماوات."]]}, {"l": "Mat 16:18", "n": "", "vs": [[18, "وأنا أيضا أقول لك: أنت صخر. وعلى هذه الصخرة أبني كنيستي وأبواب الجحيم لن تقوى عليها!"]]}, {"l": "Mat 16:23", "n": "", "vs": [[23, "فالتفت يسوع إلى بطرس وقال له: «اغرب من أمامي ياشيطان! أنت عقبة أمامي، لأنك تفكر لا بأمور الله، بل بأمور الناس! »"]]}, {"l": "Act 15:37-39", "n": "", "vs": [[37, "فاقترح برنابا أن يأخذا معهما يوحنا الملقب مرقس."], [38, "ولكن بولس رفض أن يأخذاه معهما، لأنه كان قد فارقهما في بمفيلية، ولم يرافقهما في الخدمة."], [39, "فوقعت بينهما مشاجرة حتى انفصل أحدهما عن الآخر. فأخذ برنابا مرقس وسافر بحرا إلى قبرص،"]]}, {"l": "Act 23:1-5", "n": "", "vs": [[1, "فحدق بولس إلى المجلس، وقال: «أيها الإخوة، إني عشت لله بضمير صالح حتى هذا اليوم»."], [2, "فأمر حنانيا، رئيس الكهنة، واحدا من الواقفين لديه أن يضرب بولس على فمه،"], [3, "فقال له بولس: «ضربك الله ، ياحائط المقبرة المطلي بالكلس! كيف تجلس لتحاكمني وفقا للشريعة، ثم تخالف الشريعة فتأمر بضربي؟»"], [4, "فقال له الواقفون هناك: «أتشتم رئيس كهنة الله؟»"], [5, "فأجاب بولس: «لم أكن أعرف أيها الإخوة أنه رئيس كهنة فقد جاء في الكتاب: لا تشتم رئيس شعبك!»"]]}, {"l": "Jam 3:2", "n": "", "vs": [[2, "فإننا جميعا معرضون للوقوع في أخطاء كثيرة. ولكن من يلجم لسانه ولا يخطيء في كلامه هو ناضج يقدر أن يسيطر على طبيعته سيطرة تامة."]]}, {"l": "1Jo 1:8-10", "n": "", "vs": [[8, "إن كنا ندعي أن لا خطيئة لنا، نخدع أنفسنا، ولا يكون الحق في داخلنا."], [9, "ولكن، إن اعترفنا لله بخطايانا، فهو جدير بالثقة وعادل، يغفر لنا خطايانا ويطهرنا من كل إثم."], [10, "فإن كنا ندعي أننا لم نرتكب خطيئة، نجعل الله كاذبا، ولا تكون كلمته في داخلنا!"]]}], "kwAr": "لأنه كان يستحق أن يلام", "noteAr": ""}], "arS": [["ولكن لما ", []], ["جاء", ["G2064"]], [" ", []], ["بطرس", ["G4074"]], [" إلى مدينة ", []], ["أنطاكية", ["G490"]], ["، ", []], ["قاومته", ["G436"]], [" ", []], ["وجها لوجه", ["G4383"]], [" لأنه كان يستحق أن ", []], ["يلام", ["G2607"]], [".", []]]}, {"c": 2, "v": 12, "text": "إذ قبل أن يأتي بعضهم من عند يعقوب، كان بطرس يأكل مع الإخوة الذين من الأمم؛ ولكن لما أتى أولئك، انسحب وعزل نفسه، خوفا من أهل الختان.", "groups": [{"kw": "certain", "raw": "Gal_2:9; Act_21:18-25", "note": "", "refs": [{"l": "Gal 2:9", "n": "", "vs": [[9, "فلما اتضحت النعمة الموهوبة لي عند يعقوب وبطرس ويوحنا، وهم البارزون باعتبارهم أعمدة، مدوا إلي وإلى برنابا أيديهم اليمنى إشارة إلى المشاركة، فنتوجه نحن إلى الأمم وهم إلى أهل الختان،"]]}, {"l": "Act 21:18-25", "n": "", "vs": [[18, "وفي اليوم التالي لوصولنا رافقنا بولس للاجتماع بيعقوب، وكان الشيوخ كلهم مجتمعين عنده."], [19, "فسلم بولس عليهم وأخذ يخبرهم على التوالي بكل ما فعله الله بين غير اليهود بواسطة خدمته."], [20, "فلما سمعوا أخباره مجدوا الله ، وقالوا له: «أنت ترى أيها الأخ أن الذين آمنوا بالرب من اليهود يعدون بالآلاف، وهم متحمسون للشريعة،"], [21, "وقد سمعوا بأنك تدعو اليهود الذين يسكنون بين الأجانب إلى الارتداد عن موسى، وتوصيهم بألا يختنوا أولادهم ولا يتبعوا العادات المتوارثة،"], [22, "فما العمل إذن، لأنهم لابد أن يسمعوا بقدومك؟"], [23, "فاعمل ما نقوله لك: عندنا أربعة رجال عليهم نذر،"], [24, "فخذهم إلى الهيكل وتطهر معهم، وادفع نفقة حلق رؤوسهم، فيعرف الجميع أن ما سمعوه عنك غير صحيح، وأنك تسلك مثلهم طريق العمل بالشريعة."], [25, "أما المؤمنون الذين من غير اليهود، فقد أرسلنا إليهم رسالة نوصيهم فيها بأن يمتنعوا عن الأكل من الذبائح المقربة للأصنام، وعن تناول الدم، وعن الأكل من لحوم الحيوانات المخنوقة، وعن الزنى»."]]}], "kwAr": "يأتي بعضهم من عند يعقوب", "noteAr": ""}, {"kw": "he did", "raw": "Act_10:28, Act_11:3; Eph_2:15, Eph_2:19-22, Eph_3:6", "note": "", "refs": [{"l": "Act 10:28", "n": "", "vs": [[28, "فقال لهم: «أنتم تعلمون أنه محرم على اليهودي أن يتعامل مع الأجنبي أو يزوره في بيته. غير أن الله أراني ألا أقول عن إنسان ما إنه دنس أو نجس."]]}, {"l": "Act 11:3", "n": "", "vs": [[3, "«كيف دخلت بيت رجال غير مختونين، وأكلت معهم؟»"]]}, {"l": "Eph 2:15", "n": "", "vs": [[15, "أي العداء: إذ أبطل بجسده شريعة الوصايا ذات الفرائض، لكي يكون من الفريقين إنسانا واحدا جديدا، إذ أحل السلام بينهما،"]]}, {"l": "Eph 2:19-22", "n": "", "vs": [[19, "إذن، لستم غرباء وأجانب بعد الآن، بل أنتم رعية مع القديسين وأعضاء في عائلة الله،"], [20, "وقد بنيتم على أساس الرسل والأنبياء، والمسيح يسوع نفسه هو حجر الزاوية الأساس،"], [21, "الذي فيه يتناسق البناء كله فيرتفع ليصير هيكلا مقدسا في الرب."], [22, "وفيه أنتم أيضا قد بنيتم معا فصرتم مسكنا لله بوجود الروح."]]}, {"l": "Eph 3:6", "n": "", "vs": [[6, "وهو أن الأمم هم شركاء اليهود في الميراث، وأعضاء في الجسد معهم، ولهم أيضا حق الاستفادة من الوعد. وذلك في المسيح يسوع وبفضل الإنجيل"]]}], "kwAr": "كان بطرس يأكل مع الإخوة الذين من الأمم", "noteAr": ""}, {"kw": "he withdrew", "raw": "Isa_65:5; Luk_15:2; 1Th_5:22", "note": "", "refs": [{"l": "Isa 65:5", "n": "", "vs": [[5, "ويقول أحدهم للآخر: لا تقترب مني لئلا تدنسني، لأني أقدس منك. (فيثيرون غيظي) كدخان في أنفي ونار تتقد طول النهار."]]}, {"l": "Luk 15:2", "n": "", "vs": [[2, "فتذمر الفريسيون والكتبة قائلين: «هذا الإنسان يرحب بالخاطئين ويأكل معهم!»"]]}, {"l": "1Th 5:22", "n": "", "vs": [[22, "ترفعوا عن كل ما فيه شبهة شر."]]}], "kwAr": "انسحب وعزل نفسه", "noteAr": ""}, {"kw": "fearing", "raw": "Pro_29:25; Isa_57:11; Mat_26:69-75", "note": "", "refs": [{"l": "Pro 29:25", "n": "", "vs": [[25, "الخشية من الناس فخ منصوب، أما المتكل على الرب فآمن."]]}, {"l": "Isa 57:11", "n": "", "vs": [[11, "ممن خفتم وارتعبتم حتى كذبتم ولم تذكروني أو تفكروا في؟ هل اعتصمت بالسكينة زمنا طويلا حتى لم تعودوا تخافونني؟"]]}, {"l": "Mat 26:69-75", "n": "", "vs": [[69, "في تلك الأثناء كان بطرس جالسا في الدار الخارجية، فتقدمت إليه خادمة وقالت: «وأنت كنت مع يسوع الجليلي»."], [70, "فأنكر بطرس أمام الجميع وقال: «لا أدري ما تقولين!»"], [71, "ثم خرج إلى مدخل الدار، فعرفته خادمة أخرى، فقالت للحاضرين هناك: «وهذا كان مع يسوع الناصري!»"], [72, "فأنكر بطرس مرة ثانية وأقسم: «إني لا أعرف ذلك الرجل!»"], [73, "وبعد قليل تقدم الواقفون هناك إلى بطرس وقالوا له: «بالحق إنك واحد منهم، فإن لهجتك تدل عليك!»"], [74, "فابتدأ بطرس يلعن ويحلف، قائلا: «إني لا أعرف ذلك الرجل!» وفي الحال صاح الديك،"], [75, "فتذكر بطرس كلمة يسوع إذ قال له: «قبل أن يصيح الديك تكون قد أنكرتني ثلاث مرات». فخرج إلى الخارج، وبكى بكاء مرا."]]}], "kwAr": "خوفا من أهل الختان", "noteAr": ""}], "arS": [["إذ قبل أن يأتي ", []], ["بعضهم", ["G5100"]], [" من عند ", []], ["يعقوب", ["G2385"]], ["، كان بطرس ", []], ["يأكل", ["G4906"]], [" مع الإخوة الذين من ", []], ["الأمم", ["G1484"]], ["؛ ولكن لما ", []], ["أتى", ["G2064"]], [" أولئك، ", []], ["انسحب", ["G5288"]], [" ", []], ["وعزل", ["G873"]], [" ", []], ["نفسه", ["G1438"]], ["، ", []], ["خوفا", ["G5399"]], [" من أهل ", []], ["الختان", ["G4061"]], [".", []]]}, {"c": 2, "v": 13, "text": "وجاراه في ريائه باقي الإخوة الذين من اليهود. حتى إن برنابا أيضا انساق إلى ريائهم.", "groups": [{"kw": "the other", "raw": "Gen_12:11-13, Gen_26:6, Gen_26:7, Gen_27:24; Ecc_7:20, Ecc_10:1; 1Co_5:6, 1Co_8:9, 1Co_15:33", "note": "", "refs": [{"l": "Gen 12:11-13",
