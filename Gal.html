, [" ", []], ["العالم", ["G2889"]], [".", []]]}, {"c": 4, "v": 4, "text": "ولكن لما جاء تمام الزمان، أرسل الله ابنه، وقد ولد من امرأة وكان خاضعا للشريعة،", "groups": [{"kw": "the fulness", "raw": "Gen_49:10; Dan_9:24-26; Mal_3:1; Mar_1:15; Act_1:7; Eph_1:10; Heb_9:10", "note": "", "refs": [{"l": "Gen 49:10", "n": "", "vs": [[10, "لا يزول صولجان الملك من يهوذا ولا مشترع من صلبه حتى يأتي شيلوه (ومعناه: من له الأمر) فتطيعه الشعوب."]]}, {"l": "Dan 9:24-26", "n": "", "vs": [[24, "قد صدر القضاء أن يمضي سبعون أسبوعا على شعبك وعلى مدينة قدسك، للانتهاء من المعصية والقضاء على الخطيئة، وللتكفير عن الإثم، ولإشاعة البر الأبدي وختم الرؤيا والنبوءة ولمسح قدوس القدوسين."], [25, "لهذا فاعلم وافهم أن الحقبة الممتدة منذ صدور الأمر بإعادة بناء أورشليم إلى مجيء المسيح، سبعة أسابيع، ثم اثنان وستون أسبوعا يبنى في غضونها سوق وخليج. إنما تكون تلك أزمنة ضيق."], [26, "وبعد اثنين وستين أسبوعا يقتل المسيح، ولكن ليس من أجل نفسه، ويدمر شعب رئيس آت المدينة والقدس، وتقبل آخرتها كطوفان، وتستمر الحرب حتى النهاية، ويعم الخراب المقضي به."]]}, {"l": "Mal 3:1", "n": "", "vs": [[1, "«ها أنا أرسل رسولي فيمهد الطريق أمامي ويأتي الرب الذي تطلبونه فجأة إلى هيكله ويقبل أيضا ملاك العهد الذي تسرون به» يقول الرب القدير"]]}, {"l": "Mar 1:15", "n": "", "vs": [[15, "«قد اكتمل الزمان واقترب ملكوت الله. فتوبوا وآمنوا بالإنجيل! »"]]}, {"l": "Act 1:7", "n": "", "vs": [[7, "فأجابهم: «ليس لكم أن تعرفوا المواعيد والأوقات التي حددها الآب بسلطته."]]}, {"l": "Eph 1:10", "n": "", "vs": [[10, "لأجل تدبير تمام الأزمنة، حين يوحد كل شيء تحت رئاسة المسيح، سواء الأشياء التي في السماوات والتي على الأرض."]]}, {"l": "Heb 9:10", "n": "", "vs": [[10, "إذ إن نظام العهد السابق قد اقتصر على تحريم بعض المأكولات والمشروبات وتحليل غيرها، وعلى وضع النظم المختصة بطقوس الاغتسال المختلفة. بل إن كل ما ضمه ذلك النظام، كان قوانين جسدية ينتهي عملها حين يأتي وقت الإصلاح."]]}], "kwAr": "تمام الزمان", "noteAr": ""}, {"kw": "God", "raw": "Isa_48:16; Zec_2:8-11; Joh_3:16, Joh_6:38, Joh_8:42, Joh_10:36; 1Jo_4:9, 1Jo_4:10,1Jo_4:14", "note": "", "refs": [{"l": "Isa 48:16", "n": "", "vs": [[16, "اقتربوا مني واسمعوا: منذ البدء لم أتكلم خفية، ولدى حدوثها كنت حاضرا هناك. والآن، قد أرسلني السيد الرب وروحه بهذه الرسالة:"]]}, {"l": "Zec 2:8-11", "n": "", "vs": [[8, "فإن الرب القدير يقول إنه أرسلني إلى الأمم التي سلبتكم إعلاء لمجده، لأن من يمسكم يمس حدقة عينه."], [9, "ها أنا أضربهم بيدي فيصيرون نهبا لعبيدهم، فتدركون أن الرب القدير قد أرسلني حقا."], [10, "رنمي وابتهجي ياأورشليم، لأني قادم لأقيم في وسطك، يقول الرب."], [11, "فتنضم أمم كثيرة في ذلك اليوم إلى الرب ويكونون لي شعبا، فأقيم في وسطك، فتدركين أن الرب القدير قد أرسلني إليك."]]}, {"l": "Joh 3:16", "n": "", "vs": [[16, "لأنه هكذا أحب الله العالم حتى بذل ابنه الوحيد، لكي لا يهلك كل من يؤمن به، بل تكون له الحياة الأبدية."]]}, {"l": "Joh 6:38", "n": "", "vs": [[38, "فقد نزلت من السماء، لا لأتم مشيئتي، بل مشيئة الذي أرسلني."]]}, {"l": "Joh 8:42", "n": "", "vs": [[42, "فقال يسوع: «لو كان الله أباكم لكنتم تحبونني، لأني خرجت من الله وجئت. لم آت من نفسي، بل هو الذي أرسلني."]]}, {"l": "Joh 10:36", "n": "", "vs": [[36, "فهل تقولون لمن قدسه الآب وبعثه إلى العالم: أنت تجدف، لأني قلت: أنا ابن الله؟"]]}, {"l": "1Jo 4:9", "n": "", "vs": [[9, "وقد أظهر الله محبته لنا إذ أرسل ابنه الأوحد إلى العالم لكي نحيا به."]]}, {"l": "1Jo 4:10", "n": "", "vs": [[10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."]]}, {"l": "1Jo 4:14", "n": "", "vs": [[14, "ونحن أنفسنا نشهد أن الآب قد أرسل الابن مخلصا للعالم، لأننا رأيناه بعيوننا."]]}], "kwAr": "أرسل الله ابنه", "noteAr": ""}, {"kw": "made", "raw": "Isa_9:6, Isa_9:7; Mic_5:2; Zec_6:12; Luk_2:10,Luk_2:11; Joh_1:14; Rom_1:3, Rom_9:5; Phi_2:6-8; 1Ti_3:16; Heb_2:14, Heb_10:5-7; 1Jo_4:2", "note": "", "refs": [{"l": "Isa 9:6", "n": "", "vs": [[6, "لأنه يولد لنا ولد ويعطى لنا ابن يحمل الرياسة على كتفه، ويدعى اسمه عجيبا، مشيرا، إلها قديرا، أبا أبديا، رئيس السلام."]]}, {"l": "Isa 9:7", "n": "", "vs": [[7, "ولا تكون نهاية لنمو رياسته وللسلام اللذين يسودان عرش داود ومملكته، ليثبتها ويعضدها بالحق والبر، من الآن وإلى الأبد. إن غيرة الرب القدير تتمم هذا."]]}, {"l": "Mic 5:2", "n": "", "vs": [[2, "أما أنت يابيت لحم أفراتة، مع أنك قرية صغيرة بين ألوف قرى يهوذا، إلا أن منك يخرج لي من يصبح ملكا في إسرائيل وأصله منذ القديم، منذ الأزل."]]}, {"l": "Zec 6:12", "n": "", "vs": [[12, "وقل له: هكذا يقول الرب القدير: ها هو الرجل الذي اسمه الغصن، الذي ينبت من ذاته ويبني هيكل الرب."]]}, {"l": "Luk 2:10", "n": "", "vs": [[10, "فقال لهم الملاك: «لا تخافوا! فها أنا أبشركم بفرح عظيم يعم الشعب كله:"]]}, {"l": "Luk 2:11", "n": "", "vs": [[11, "فقد ولد لكم اليوم في مدينة داود مخلص هو المسيح الرب."]]}, {"l": "Joh 1:14", "n": "", "vs": [[14, "والكلمة صار بشرا، وخيم بيننا، ونحن رأينا مجده، مجد ابن وحيد عند الآب، وهو ممتلىء بالنعمة والحق."]]}, {"l": "Rom 1:3", "n": "", "vs": [[3, "وهو يختص بابنه الذي جاء من نسل داود من الناحية البشرية؛"]]}, {"l": "Rom 9:5", "n": "", "vs": [[5, "ومنهم كان الآباء ومنهم جاء المسيح حسب الجسد، وهو فوق الجميع الله المبارك إلى الأبد. آمين."]]}, {"l": "Phi 2:6-8", "n": "", "vs": [[6, "إذ إنه، وهو الكائن في هيئة الله، لم يعتبر مساواته لله خلسة، أو غنيمة يتمسك بها؛"], [7, "بل أخلى نفسه، متخذا صورة عبد، صائرا شبيها بالبشر؛"], [8, "وإذ ظهر بهيئة إنسان، أمعن في الاتضاع، وكان طائعا حتى الموت، موت الصليب."]]}, {"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}, {"l": "Heb 2:14", "n": "", "vs": [[14, "إذن، بما أن هؤلاء الأولاد متشاركون في أجسام بشرية من لحم ودم، اشترك المسيح أيضا في اللحم والدم باتخاذه جسما بشريا. وهكذا تمكن أن يموت، ليقضي على من له سلطة الموت، أي إبليس،"]]}, {"l": "Heb 10:5-7", "n": "", "vs": [[5, "لذلك قال المسيح، عند مجيئه إلى هذه الأرض: «إن الذبائح والتقدمات ما أردتها. لكنك أعددت لي جسدا بشريا."], [6, "فالحيوانات التي كانت تذبح وتحرق أمامك تكفيرا عن الخطيئة، لم ترض بها."], [7, "عندئذ قلت لك: ها أنا آتي لأعمل إرادتك، ياالله . هذا هو المكتوب عني في صفحة الكتاب !»"]]}, {"l": "1Jo 4:2", "n": "", "vs": [[2, "وهذه هي الطريقة التي تعرفون بها كون الروح من عند الله فعلا: إذا كان ذلك الروح يعترف بأن يسوع المسيح قد جاء إلى الأرض في الجسد، فهو من عند الله."]]}], "kwAr": "وقد ولد", "noteAr": ""}, {"kw": "of a", "raw": "Gen_3:15; Isa_7:14; Jer_31:22; Mic_5:3; Mat_1:23; Luk_1:31, Luk_1:35, Luk_2:7", "note": "", "refs": [{"l": "Gen 3:15", "n": "", "vs": [[15, "وأثير عداوة دائمة بينك وبين المرأة، وكذلك بين نسليكما. هو يسحق رأسك وأنت تلدغين عقبه»."]]}, {"l": "Isa 7:14", "n": "", "vs": [[14, "ولكن السيد نفسه يعطيكم آية: ها العذراء تحبل وتلد ابنا، وتدعو اسمه عمانوئيل."]]}, {"l": "Jer 31:22", "n": "", "vs": [[22, "إلى متى تظلين هائمة على وجهك أيتها الابنة الغادرة؟ قد خلق الرب شيئا جديدا في الأرض: أنثى تحمي رجلا»."]]}, {"l": "Mic 5:3", "n": "", "vs": [[3, "لذلك يسلم الرب شعبه إلى أعدائهم إلى أن تلد من تقاسي من المخاض، عندئذ ترجع بقية إخوته من السبي إلى شعب إسرائيل."]]}, {"l": "Mat 1:23", "n": "", "vs": [[23, "«ها إن العذراء تحبل، وتلد ابنا، ويدعى عمانوئيل!» أي «الله معنا»."]]}, {"l": "Luk 1:31", "n": "", "vs": [[31, "وها أنت ستحبلين وتلدين ابنا، وتسمينه يسوع."]]}, {"l": "Luk 1:35", "n": "", "vs": [[35, "فأجابها الملاك: «الروح القدس يحل عليك، وقدرة العلي تظللك. لذلك أيضا فالقدوس المولود منك يدعى ابن الله."]]}, {"l": "Luk 2:7", "n": "", "vs": [[7, "فولدت ابنها البكر، ولفته بقماط، وأنامته في مذود، إذ لم يكن لهما متسع في المنزل."]]}], "kwAr": "من امرأة", "noteAr": ""}, {"kw": "made under", "raw": "Mat_3:15, Mat_5:17; Luk_2:21-27; Rom_15:8; Col_2:14", "note": "", "refs": [{"l": "Mat 3:15", "n": "", "vs": [[15, "ولكن يسوع أجابه: «اسمح الآن بذلك! فهكذا يليق بنا أن نتم كل بر». عندئذ سمح له."]]}, {"l": "Mat 5:17", "n": "", "vs": [[17, "لا تظنوا أني جئت لألغي الشريعة أو الأنبياء. ما جئت لألغي، بل لأكمل."]]}, {"l": "Luk 2:21-27", "n": "", "vs": [[21, "ولما تمت ثمانية أيام ليختن الطفل، سمي يسوع، كما كان قد سمي بلسان الملاك قبل أن يحبل به في البطن."], [22, "ثم لما تمت الأيام لتطهيرها حسب شريعة موسى، صعدا به إلى أورشليم ليقدماه إلى الرب،"], [23, "كما كتب في شريعة الرب: «كل بكر من الذكور يدعى قدسا للرب»،"], [24, "وليقدما ذبيحة كما يوصى في شريعة الرب: «زوجي يمام، أو فرخي حمام»."], [25, "وكان في أورشليم رجل اسمه سمعان، وهو رجل بار تقي ينتظر العزاء لإسرائيل وكان الروح القدس عليه."], [26, "وكان الروح القدس قد أوحى إليه أنه لا يرى الموت قبل أن يرى مسيح الرب،"], [27, "وقد جاء إلى الهيكل بدافع من الروح. فلما أحضر الأبوان الطفل يسوع ليقدما عنه ما سن في الشريعة،"]]}, {"l": "Rom 15:8", "n": "", "vs": [[8, "فإني أقول إن المسيح صار خادم أهل الختان إظهارا لصدق الله وتوطيدا لوعوده للآباء،"]]}, {"l": "Col 2:14", "n": "", "vs": [[14, "إذ قد محا صك الفرائض المكتوب علينا والمناقض لمصلحتنا، بل إنه قد أزاله من الوسط، مسمرا إياه على الصليب."]]}], "kwAr": "وكان خاضعا للشريعة", "noteAr": ""}], "arS": [["ولكن لما ", []], ["جاء", ["G2064"]], [" ", []], ["تمام", ["G4138"]], [" ", []], ["الزمان", ["G5550"]], ["، ", []], ["أرسل", ["G1821"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["ابنه", ["G5207"]], ["، وقد ", []], ["ولد", ["G1096"]], [" من ", []], ["امرأة", ["G1135"]], [" وكان خاضعا ", []], ["للشريعة", ["G3551"]], ["،", []]]}, {"c": 4, "v": 5, "text": "ليحرر بالفداء أولئك الخاضعين للشريعة، فننال جميعا مقام أبناء الله.", "groups": [{"kw": "redeem", "raw": "Gal_4:21, Gal_3:13; Mat_20:28; Luk_1:68; Act_20:28; Eph_1:7, Eph_5:2; Col_1:13-20; Tit_2:14; Heb_1:3, Heb_9:12, Heb_9:15; 1Pe_1:18-20, 1Pe_3:18; Rev_5:9, Rev_14:3", "note": "", "refs": [{"l": "Gal 4:21", "n": "", "vs": [[21, "قولوا لي، يامن ترغبون في الرجوع إلى العبودية للشريعة، ألستم تسمعون ما جاء في الشريعة؟"]]}, {"l": "Gal 3:13", "n": "", "vs": [[13, "إن المسيح حررنا بالفداء من لعنة الشريعة، إذ صار لعنة عوضا عنا، لأنه قد كتب: «ملعون كل من علق على خشبة»،"]]}, {"l": "Mat 20:28", "n": "", "vs": [[28, "فهكذا ابن الإنسان: قد جاء لا ليخدم، بل ليخدم ويبذل نفسه فدية عن كثيرين. »"]]}, {"l": "Luk 1:68", "n": "", "vs": [[68, "«تبارك الرب إله إسرائيل، لأنه تفقد شعبه وعمل له فداء،"]]}, {"l": "Act 20:28", "n": "", "vs": [[28, "فاسهروا إذن على أنفسكم وعلى جميع القطيع الذي عينكم بينه الروح القدس نظارا، لترعوا كنيسة الله التي اشتراها بدمه."]]}, {"l": "Eph 1:7", "n": "", "vs": [[7, "ففيه لنا بدمه الفداء، أي غفران الخطايا؛ بحسب غنى نعمته"]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "Col 1:13-20", "n": "", "vs": [[13, "هو الذي أنقذنا من سلطة الظلام ونقلنا إلى ملكوت ابن محبته"], [14, "الذي فيه لنا الفداء، أي غفران الخطايا."], [15, "هو صورة الله الذي لا يرى، والبكر على كل ما قد خلق،"], [16, "إذ به خلقت جميع الأشياء: ما في السماوات وما على الأرض، ما يرى وما لا يرى، أعروشا كانت أم سيادات أم رئاسات أم سلطات. كل ما في الكون قد خلق به ولأجله."], [17, "هو كائن قبل كل شيء، وبه يدوم كل شيء."], [18, "وهو رأس الجسد، أي الكنيسة؛ هو البداءة وبكر القائمين من بين الأموات، ليكون له المقام الأول في كل شيء."], [19, "فإنه فيه سر الله أن يحل بكل ملئه،"], [20, "وأن يصالح به كل شيء مع نفسه، إذ أحل السلام بدمه على الصليب، فبه يصالح كل شيء، سواء كان ما على الأرض أو ما في السماوات."]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Heb 1:3", "n": "", "vs": [[3, "إنه ضياء مجد الله وصورة جوهره. حافظ كل ما في الكون بكلمته القديرة. وهو الذي بعدما طهرنا بنفسه من خطايانا،"]]}, {"l": "Heb 9:12", "n": "", "vs": [[12, "فإلى «قدس الأقداس» في هذه الخيمة، دخل المسيح مرة واحدة، حاملا دم نفسه، لا دم تيوس وعجول. وذلك بعدما سفك دمه عوضا عنا. فحقق فداء أبديا."]]}, {"l": "Heb 9:15", "n": "", "vs": [[15, "ولذلك، فالمسيح هو الوسيط لهذا العهد الجديد. فبما أنه قد تم الموت فداء للمخالفات الحاصلة تحت العهد الأول، ينال المدعوون الوعد بالإرث الأبدي."]]}, {"l": "1Pe 1:18-20", "n": "", "vs": [[18, "واعلموا أنه قد دفع الفدية ليحرركم من سيرة حياتكم الباطلة التي أخذتموها بالتقليد عن آبائكم. وهذه الفدية لم تكن شيئا فانيا كالفضة أو الذهب،"], [19, "بل كانت دما ثمينا، دم المسيح، ذلك الحمل الطاهر الذي ليس فيه عيب ولا دنس!"], [20, "ومع أن الله كان قد عين المسيح لهذا الغرض قبل تأسيس العالم، فهو لم يعلنه إلا في هذا الزمن الأخير لفائدتكم"]]}, {"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}, {"l": "Rev 5:9", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"]]}, {"l": "Rev 14:3", "n": "", "vs": [[3, "وكانوا ينشدون ترتيلة جديدة أمام عرش الله، وأمام الكائنات الحية الأربعة والشيوخ. ولم يستطع أحد أن يتعلم هذه الترتيلة إلا المئة والأربعة والأربعون ألفا المشترون من الأرض،"]]}], "kwAr": "ليحرر بالفداء", "noteAr": ""}, {"kw": "that we", "raw": "Gal_4:7, Gal_3:26; Joh_1:12; Rom_8:19, Rom_8:23, Rom_9:4; Eph_1:5", "note": "", "refs": [{"l": "Gal 4:7", "n": "", "vs": [[7, "إذن، أنت لست عبدا بعد الآن، بل أنت ابن. ومادمت ابنا، فقد جعلك الله وريثا أيضا."]]}, {"l": "Gal 3:26", "n": "", "vs": [[26, "فإنكم جميعا أبناء الله بالإيمان بالمسيح يسوع."]]}, {"l": "Joh 1:12", "n": "", "vs": [[12, "أما الذين قبلوه، أي الذين آمنوا باسمه، فقد منحهم الحق في أن يصيروا أولاد الله،"]]}, {"l": "Rom 8:19", "n": "", "vs": [[19, "ذلك أن الخليقة تترقب بلهفة أن يعلن أبناء الله،"]]}, {"l": "Rom 8:23", "n": "", "vs": [[23, "وليس هي وحدها، بل أيضا نحن الذين لنا باكورة الروح، نحن أنفسنا نئن في قرارة نفوسنا مترقبين إعلان بنوتنا بافتداء أجسادنا."]]}, {"l": "Rom 9:4", "n": "", "vs": [[4, "فإنهم إسرائيليون، وقد منحوا التبني والمجد والعهود والتشريع والعبادة والمواعيد،"]]}, {"l": "Eph 1:5", "n": "", "vs": [[5, "إذ سبق فعيننا في المحبة ليتخذنا أبناء له بيسوع المسيح. وذلك موافق للقصد الذي سرت به مشيئته،"]]}], "kwAr": "فننال جميعا مقام أبناء الله", "noteAr": ""}], "arS": [["ليحرر بالفداء", ["G1805"]], [" أولئك الخاضعين ", []], ["للشريعة", ["G3551"]], ["، ", []], ["فننال", ["G618"]], [" جميعا مقام ", []], ["أبناء", ["G5206"]], [" الله.", []]]}, {"c": 4, "v": 6, "text": "وبما أنكم أبناء له، أرسل الله إلى قلوبنا روح ابنه، مناديا: «أبا، ياأبانا».", "groups": [{"kw": "God", "raw": "Luk_11:13; Joh_7:39, Joh_14:16; Rom_5:5, Rom_8:15-17; 2Co_1:22; Eph_1:13, Eph_4:30", "note": "", "refs": [{"l": "Luk 11:13", "n": "", "vs": [[13, "فإن كنتم، أنتم الأشرار، تعرفون أن تعطوا أولادكم عطايا جيدة، فكم بالأحرى الآب، الذي من السماء يهب الروح القدس لمن يسألونه؟ »"]]}, {"l": "Joh 7:39", "n": "", "vs": [[39, "قال يسوع هذا عن الروح القدس الذي كان المؤمنون به سيقبلونه. ولم يكن الروح قد أعطي بعد لأن يسوع لم يكن قد تمجد بعد."]]}, {"l": "Joh 14:16", "n": "", "vs": [[16, "وسوف أطلب من الآب أن يعطيكم معينا آخر يبقى معكم إلى الأبد،"]]}, {"l": "Rom 5:5", "n": "", "vs": [[5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."]]}, {"l": "Rom 8:15-17", "n": "", "vs": [[15, "إذ إنكم لم تنالوا روح عبودية يعيدكم إلى الخوف، بل نلتم روح بنوة به نصرخ: «أبا! أبانا!»"], [16, "فالروح نفسه يشهد مع أرواحنا بأننا أولاد الله."], [17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}, {"l": "2Co 1:22", "n": "", "vs": [[22, "وهو أيضا قد وضع ختمه علينا، ووهبنا الروح القدس عربونا في قلوبنا."]]}, {"l": "Eph 1:13", "n": "", "vs": [[13, "وفيه أنتم أيضا (وضعتم رجاءكم) إذ سمعتم كلمة الحق، أي الإنجيل الذي فيه خلاصكم؛ كذلك فيه أيضا ختمتم، إذ آمنتم، بالروح القدس الموعود،"]]}, {"l": "Eph 4:30", "n": "", "vs": [[30, "ولا تحزنوا روح الله، الروح القدس الذي به ختمتم ليوم الفداء."]]}], "kwAr": "أرسل الله", "noteAr": ""}, {"kw": "the Spirit", "raw": "Joh_3:34, Joh_15:26, Joh_16:7; Rom_5:5, Rom_8:9, Rom_8:15; 1Co_15:45; Phi_1:19; 1Pe_1:11; Rev_19:10", "note": "", "refs": [{"l": "Joh 3:34", "n": "", "vs": [[34, "لأن الذي أرسله الله يتكلم بكلام الله فإن الله يعطي الروح ليس بالمكيال."]]}, {"l": "Joh 15:26", "n": "", "vs": [[26, "وعندما يأتي المعين، الذي سأرسله لكم من عند الآب، روح الحق الذي ينبثق من الآب، فهو يشهد لي،"]]}, {"l": "Joh 16:7", "n": "", "vs": [[7, "ولكني أقول لكم الحق: من الأفضل لكم أن أذهب، لأني إن كنت لا أذهب، لا يأتيكم المعين. ولكني إذا ذهبت أرسله إليكم."]]}, {"l": "Rom 5:5", "n": "", "vs": [[5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."]]}, {"l": "Rom 8:9", "n": "", "vs": [[9, "وأما أنتم، فلستم تحت سلطة الجسد بل تحت سلطة الروح، إذا كان روح الله ساكنا في داخلكم حقا. ولكن، إن كان أحد ليس له روح المسيح، فهو ليس للمسيح."]]}, {"l": "Rom 8:15", "n": "", "vs": [[15, "إذ إنكم لم تنالوا روح عبودية يعيدكم إلى الخوف، بل نلتم روح بنوة به نصرخ: «أبا! أبانا!»"]]}, {"l": "1Co 15:45", "n": "", "vs": [[45, "فهكذا أيضا قد كتب: «صار الإنسان الأول، آدم، نفسا حية» وأما آدم الأخير فهو روح باعث للحياة."]]}, {"l": "Phi 1:19", "n": "", "vs": [[19, "فإنني أعلم أن هذا الأمر سيؤدي إلى الإفراج عني، بفضل صلاتكم وبمعونة روح يسوع المسيح؛"]]}, {"l": "1Pe 1:11", "n": "", "vs": [[11, "واجتهدوا لمعرفة الزمان والأحوال التي كان يشير إليها روح المسيح الذي كان عاملا فيهم، عندما شهد لهم مسبقا بما ينتظر المسيح من آلام، وبما يأتي بعدها من أمجاد."]]}, {"l": "Rev 19:10", "n": "", "vs": [[10, "فجثوت عند قدميه لأسجد له، فقال لي: «لا تفعل! إني عبد لله، مثلك ومثل إخوتك المؤمنين الذين لديهم الشهادة المختصة بيسوع: لله اسجد! فإن الشهادة المختصة بيسوع هي روح النبوءة»."]]}], "kwAr": "روح ابنه", "noteAr": ""}, {"kw": "crying", "raw": "Isa_44:3-5; Jer_3:4, Jer_3:19; Mat_6:6-9; Luk_11:2; Rom_8:26, Rom_8:27; Eph_2:18; Eph_6:18; Heb_4:14-16; Jud_1:20", "note": "", "refs": [{"l": "Isa 44:3-5", "n": "", "vs": [[3, "لأني سأسكب ماء على الأرض الظمأى، وأجري السيول على التربة اليابسة، وأفيض بروحي على ذريتك، وبركاتي على نسلك."], [4, "فينبتون بين العشب مزهرين كالصفصاف عند مجاري المياه."], [5, "ويقولون بملء أفواههم: «أنا عبد الرب. أنا ابن يعقوب». ويكتب على يده اسم الله، وباسم إسرائيل يلقب."]]}, {"l": "Jer 3:4", "n": "", "vs": [[4, "ألم تدعني الآن قائلة: ياأبي، أنت رفيق صباي؟"]]}, {"l": "Jer 3:19", "n": "", "vs": [[19, "ولكني قلت في نفسي: لشد ما يسعدني أن أقيمك بين الأبناء وأورثك أرضا شهية هي أجمل ميراث بين الأمم. وفكرت أنك تدعينني ياأبي، ولن ترتدي عن اتباعي."]]}, {"l": "Mat 6:6-9", "n": "", "vs": [[6, "أما أنت، فعندما تصلي، فادخل غرفتك، وأغلق الباب عليك، وصل إلى أبيك الذي في الخفاء. وأبوك الذي يرى في الخفاء، هو يكافئك."], [7, "وعندما تصلون، لا تكرروا كلاما فارغا كما يفعل الوثنيون، ظنا منهم أنه بالإكثار من الكلام، يستجاب لهم."], [8, "فلا تكونوا مثلهم، لأن أباكم يعلم ما تحتاجون إليه قبل أن تسألوه."], [9, "فصلوا أنتم مثل هذه الصلاة: أبانا الذي في السماوات، ليتقدس اسمك!"]]}, {"l": "Luk 11:2", "n": "", "vs": [[2, "فقال لهم: «عندما تصلون، قولوا: أبانا الذي في السماوات! ليتقدس اسمك، ليأت ملكوتك. لتكن مشيئتك كما في السماء كذلك على الأرض."]]}, {"l": "Rom 8:26", "n": "", "vs": [[26, "وكذلك الروح أيضا يمدنا بالعون لنقهر ضعفنا. فإننا لا نعلم ما يجب أن نصلي لأجله كما يليق، ولكن الروح نفسه يؤدي الشفاعة عنا بأنات تفوق التعبير."]]}, {"l": "Rom 8:27", "n": "", "vs": [[27, "على أن فاحص القلوب يعلم قصد الروح، لأن الروح يشفع في القديسين بما يوافق الله ."]]}, {"l": "Eph 2:18", "n": "", "vs": [[18, "فبه لنا كلينا اقتراب إلى الآب بروح واحد."]]}, {"l": "Eph 6:18", "n": "", "vs": [[18, "كونوا مصلين في كل حال، بكل صلاة وطلبة في الروح، وساهرين لهذا الغرض عينه مواظبين تماما على جميع الطلبات لأجل القديسين جميعا،"]]}, {"l": "Heb 4:14-16", "n": "", "vs": [[14, "فمادام لنا رئيس كهنتنا العظيم الذي ارتفع مجتازا السماوات، وهو يسوع ابن الله، فلنتمسك دائما بالاعتراف به."], [15, "ذلك لأن رئيس الكهنة الذي لنا، ليس عاجزا عن تفهم ضعفاتنا، بل إنه قد تعرض للتجارب التي نتعرض نحن لها، إلا أنه بلا خطية."], [16, "فلنتقدم بثقة إلى عرش النعمة، لننال الرحمة ونجد نعمة تعيننا عند الحاجة."]]}, {"l": "Jud 1:20", "n": "", "vs": [[20, "وأما أنتم أيها الأحباء، فابنوا أنفسكم على إيمانكم الأقدس، وصلوا دائما في الروح القدس."]]}], "kwAr": "مناديا أبا ياأبانا", "noteAr": ""}], "arS": [["وبما أنكم ", []], ["أبناء", ["G5207"]], [" له، ", []], ["أرسل", ["G1821"]], [" ", []], ["الله", ["G2316"]], [" إلى ", []], ["قلوبنا", ["G2588"]], [" ", []], ["روح", ["G4151"]], [" ", []], ["ابنه", ["G5207"]], ["، ", []], ["مناديا", ["G2896"]], [": «", []], ["أبا", ["G5"]], ["، ", []], ["ياأبانا", ["G3962"]], ["».", []]]}, {"c": 4, "v": 7, "text": "إذن، أنت لست عبدا بعد الآن، بل أنت ابن. ومادمت ابنا، فقد جعلك الله وريثا أيضا.", "groups": [{"kw": "thou", "raw": "Gal_4:1, Gal_4:2, Gal_4:5, Gal_4:6, Gal_4:31, Gal_5:1", "note": "", "refs": [{"l": "Gal 4:1", "n": "", "vs": [[1, "أقول أيضا مادام الوريث قاصرا، فليس بينه وبين العبد أي فرق، مع أنه صاحب الإرث كله،"]]}, {"l": "Gal 4:2", "n": "", "vs": [[2, "بل يبقى خاضعا للأوصياء والوكلاء إلى أن تنقضي الفترة التي حددها أبوه."]]}, {"l": "Gal 4:5", "n": "", "vs": [[5, "ليحرر بالفداء أولئك الخاضعين للشريعة، فننال جميعا مقام أبناء الله."]]}, {"l": "Gal 4:6", "n": "", "vs": [[6, "وبما أنكم أبناء له، أرسل الله إلى قلوبنا روح ابنه، مناديا: «أبا، ياأبانا»."]]}, {"l": "Gal 4:31", "n": "", "vs": [[31, "إذن، أيها الإخوة، نحن لسنا أولاد الجارية، بل أولاد الحرة."]]}, {"l": "Gal 5:1", "n": "", "vs": [[1, "إن المسيح قد حررنا وأطلقنا في سبيل الحرية. فاثبتوا إذن، ولا تعودوا إلى الارتباك بنير العبودية."]]}], "kwAr": "أنت لست عبدا بعد الآن", "noteAr": ""}, {"kw": "but", "raw": "Gal_3:26", "note": "", "refs": [{"l": "Gal 3:26", "n": "", "vs": [[26, "فإنكم جميعا أبناء الله بالإيمان بالمسيح يسوع."]]}], "kwAr": "بل أنت ابن", "noteAr": ""}, {"kw": "if", "raw": "Gal_3:29; Rom_8:16, Rom_8:17", "note": "", "refs": [{"l": "Gal 3:29", "n": "", "vs": [[29, "فإذا كنتم للمسيح، فأنتم إذن نسل إبراهيم وحسب الوعد وارثون."]]}, {"l": "Rom 8:16", "n": "", "vs": [[16, "فالروح نفسه يشهد مع أرواحنا بأننا أولاد الله."]]}, {"l": "Rom 8:17", "n": "", "vs": [[17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}], "kwAr": "ومادمت ابنا", "noteAr": ""}, {"kw": "heir", "raw": "Gen_15:1, Gen_17:7, Gen_17:8; Psa_16:5, Psa_73:26; Jer_10:16, Jer_31:33, Jer_32:38-41; Lam_3:24; 1Co_3:21-23; 2Co_6:16-18; Rev_21:7", "note": "", "refs": [{"l": "Gen 15:1", "n": "", "vs": [[1, "وبعد هذه الأمور قال الرب لأبرام في الرؤيا: «لا تخف ياأبرام. أنا ترس لك. وأجرك عظيم جدا»."]]}, {"l": "Gen 17:7", "n": "", "vs": [[7, "وأقيم عهدي الأبدي بيني وبينك، وبين نسلك من بعدك جيلا بعد جيل، فأكون إلها لك ولنسلك من بعدك."]]}, {"l": "Gen 17:8", "n": "", "vs": [[8, "وأهبك أنت وذريتك من بعدك جميع أرض كنعان، التي نزلت فيها غريبا، ملكا أبديا. وأكون لهم إلها»."]]}, {"l": "Psa 16:5", "n": "", "vs": [[5, "الرب نصيبي وميراثي وكأس ارتوائي. أنت حافظ قسمتي."]]}, {"l": "Psa 73:26", "n": "", "vs": [[26, "إن جسدي وقلبي يفنيان، أما الله فهو صخرة قلبي ونصيبي إلى الدهر."]]}, {"l": "Jer 10:16", "n": "", "vs": [[16, "أما (الله ) نصيب يعقوب فليس مثل هذه الأوثان، بل هو جابل كل الأشياء، وشعب إسرائيل هو شعب ميراثه، واسمه الرب القدير."]]}, {"l": "Jer 31:33", "n": "", "vs": [[33, "ولكن هذا هو العهد الذي أبرمه مع ذرية إسرائيل بعد تلك الأيام»، يقول الرب: «سأجعل شريعتي في دواخلهم، وأدونها على قلوبهم وأكون لهم إلها وهم يكونون لي شعبا."]]}, {"l": "Jer 32:38-41", "n": "", "vs": [[38, "فيكونون لي شعبا وأكون لهم إلها."], [39, "وأعطيهم قلبا واحدا وطريقا واحدا ليتقوني كل الأيام، وذلك لخيرهم وخير أولادهم من بعدهم."], [40, "وأبرم معهم عهدا أبديا أن لا أكف عن الإحسان إليهم، وأضع تقواي في قلوبهم لئلا يرتدوا عني،"], [41, "وأسر بالإحسان إليهم، وأغرسهم في هذه الأرض بالحق من كل قلبي ونفسي."]]}, {"l": "Lam 3:24", "n": "", "vs": [[24, "تقول نفسي: «الرب هو نصيبي فلذلك أرجوه»."]]}, {"l": "1Co 3:21-23", "n": "", "vs": [[21, "إذن، لا يفتخر أحد بالبشر، لأن كل شيء هو لكم،"], [22, "أبولس أم أبلوس أم بطرس أم العالم أم الحيا ة أم الموت أم الحاضر أم المستقبل: هذه الأمور كلها لكم،"], [23, "وأنتم للمسيح، والمسيح لله."]]}, {"l": "2Co 6:16-18", "n": "", "vs": [[16, "وأي وفاق لهيكل الله مع الأصنام؟ فإننا نحن هيكل الله الحي، وفقا لما قاله الله : «سأسكن في وسطهم، وأسير بينهم، وأكون إلههم وهم يكونون شعبا لي…"], [17, "لذلك اخرجوا من وسطهم، وكونوا منفصلين، يقول الرب، ولا تلمسوا ما هو نجس،"], [18, "فأقبلكم، وأكون لكم أبا، وتكونوا لي بنين وبنات»، هذا يقوله الرب القادر على كل شيء."]]}, {"l": "Rev 21:7", "n": "", "vs": [[7, "هذا كله نصيب المنتصر، وأكون إلها له، وهو يكون ابنا لي."]]}], "kwAr": "وريثا", "noteAr": ""}], "arS": [["إذن، أنت لست ", []], ["عبدا", ["G1401"]], [" بعد الآن، بل أنت ", []], ["ابن", ["G5207"]], [". ومادمت ", []], ["ابنا", ["G5207"]], ["، فقد جعلك ", []], ["الله", ["G2316"]], [" ", []], ["وريثا", ["G2818"]], [" أيضا.", []]]}, {"c": 4, "v": 8, "text": "ولكن، لما كنتم في ذلك الحين لا تعرفون الله ، كنتم في حال العبودية.", "groups": [{"kw": "when", "raw": "Exo_5:2; Jer_10:25; Joh_1:10; Act_17:23, Act_17:30; Rom_1:28; 1Co_1:21; Eph_2:11, Eph_2:12, Eph_4:18; 1Th_4:5; 2Th_1:8; 1Jo_3:1", "note": "", "refs": [{"l": "Exo 5:2", "n": "", "vs": [[2, "فقال فرعون: «من هو الرب حتى أطيع أمره وأطلق إسرائيل؟ أنا لا أعرف الرب ولن أطلق بني إسرائيل»."]]}, {"l": "Jer 10:25", "n": "", "vs": [[25, "لينصب سخطك على الأمم التي لم تعرفك، وعلى الشعوب التي لا تدعو باسمك، لأنهم قد افترسوا ذرية يعقوب والتهموها وخربوا مسكنها."]]}, {"l": "Joh 1:10", "n": "", "vs": [[10, "كان في العالم، وبه تكون العالم، ولم يعرفه العالم."]]}, {"l": "Act 17:23", "n": "", "vs": [[23, "فبينما كنت أتجول في مدينتكم وأنظر إلى معابدكم وجدت معبدا مكتوبا عليه «إلى الإله المجهول». فبهذا الإله الذي تعبدونه ولا تعرفونه، أنا أبشركم."]]}, {"l": "Act 17:30", "n": "", "vs": [[30, "فالله الآن يدعو جميع الناس في كل مكان أن يرجعوا إليه تائبين، وقد غض النظر عن أزمنة الجهل التي مرت،"]]}, {"l": "Rom 1:28", "n": "", "vs": [[28, "وبما أنهم لم يتخيروا إبقاء الله ضمن معرفتهم، أسلمهم الله إلى ذهن عاطل عن التمييز دفعهم إلى ممارسة الأمور غير اللائقة."]]}, {"l": "1Co 1:21", "n": "", "vs": [[21, "فبما أن العالم، في حكمة الله، لم يعرف الله عن طريق الحكمة، فقد سر الله أن يخلص بجهالة البشارة الذين يؤمنون."]]}, {"l": "Eph 2:11", "n": "", "vs": [[11, "لذلك اذكروا، أنتم الأمم في الجسد سابقا، يامن تسمون أهل عدم الختان من قبل من يسمون أهل الختان الذي يجري في الجسد باليد،"]]}, {"l": "Eph 2:12", "n": "", "vs": [[12, "أنكم كنتم في ذلك الحين بلا مسيح، أجانب عن جماعة إسرائيل، وغرباء عن العهود الموعودة، لا رجاء لكم، ومنكرين لله في العالم."]]}, {"l": "Eph 4:18", "n": "", "vs": [[18, "لكونهم مظلمي البصيرة ومتغربين عن حياة الله بسبب ما فيهم من جهل وقساوة قلب."]]}, {"l": "1Th 4:5", "n": "", "vs": [[5, "غير منساق للشهوة الجامحة كالوثنيين الذين لا يعرفون الله ،"]]}, {"l": "2Th 1:8", "n": "", "vs": [[8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."]]}, {"l": "1Jo 3:1", "n": "", "vs": [[1, "تأملوا ما أعظم المحبة التي أحبنا بها الآب حتى صرنا ندعى «أولاد الله»، ونحن أولاده حقا. ولكن، بما أن أهل العالم لا يعرفون الله، فهم لا يعرفوننا."]]}], "kwAr": "لما كنتم في ذلك الحين لا تعرفون الله", "noteAr": ""}, {"kw": "ye did", "raw": "Jos_24:2, Jos_24:15; Psa_115:4-8, Psa_135:15-18; Isa_44:9-20; Jer_10:3-16; Act_14:12, Act_17:29; Rom_1:23; 1Co_8:4, 1Co_10:19, 1Co_10:20, 1Co_12:2; 1Th_1:9; 1Pe_4:3", "note": "", "refs": [{"l": "Jos 24:2", "n": "", "vs": [[2, "وقال يشوع لجميع الشعب: «هذا ما يقوله الرب إله إسرائيل: لقد أقام أجدادكم، ومن جملتهم تارح أبو إبراهيم وأبو ناحور منذ القدم في شرقي نهر الفرات حيث عبدوا آلهة أخرى،"]]}, {"l": "Jos 24:15", "n": "", "vs": [[15, "وإن ساءكم أن تعبدوا الرب، فاختاروا لأنفسكم اليوم من تعبدون سواء من الآلهة التي عبدها آباؤكم الذين استوطنوا شرقي نهر الفرات أم آلهة الأموريين الذين أنتم مقيمون في أرضهم. أما أنا وبيتي فنعبد الرب»."]]}, {"l": "Psa 115:4-8", "n": "", "vs": [[4, "أما أوثانهم فهي فضة وذهب من صنع أيدي البشر."], [5, "لها أفواه لكنها لا تنطق. لها عيون ولكنها لا تبصر."], [6, "وآذان لكنها لا تسمع. وأنوف لكنها لا تشم."], [7, "لها أيد لكنها لا تلمس. وأرجل لكنها لا تمشي، ولا تصدر من حناجرها صوتا."], [8, "مثلها يصير صانعوها وكل من يتوكل عليها."]]}, {"l": "Psa 135:15-18", "n": "", "vs": [[15, "أما أصنام الأمم فهي من فضة وذهب، صنعة أيدي الناس."], [16, "لها أفواه لكنها لا تتكلم، وعيون لكنها لا ترى."], [17, "وآذان لكنها لا تسمع. وليس في أفواهها نسمة حياة."], [18, "مثلها يصير صانعوها وكل من يتوكل عليها."]]}, {"l": "Isa 44:9-20", "n": "", "vs": [[9, "كل صانعي التماثيل لا جدوى منهم، ومشتهياتهم لا طائل منها. وهم شهود عليها أنها لا تبصر ولا تعلم لكي يخزوا."], [10, "من يصور صنما أو يسبك تمثالا لا ترتجى منه فائدة؟"], [11, "هذا وأمثاله يلحق بهم العار لأن الصناع ليسوا سوى بشر. فليجتمعوا إذا ويمثلوا أمامي، فينتابهم رعب ويخزوا معا."], [12, "يصنع الحداد فأسا بعد أن يقلبها في جمرات الكور ويطرقها، ويشكلها بذراعه القوية. لا يعبأ بالجوع ولا بنضوب قوته، ولا بالعطش والإعياء."], [13, "ثم يأتي نجار فيتناول قطعة خشب ويمد عليها الخيط ويعلمها وينعمها ويحفر عليها بالبركار صورة إنسان ساحر الجمال لينصبه صنما في منزل."], [14, "يقطع شجرة أرز أو يختار سنديانا أو بلوطا. يتركها تنمو بين أشجار الغابة. أو يزرع شجرة صنوبر فينميها المطر."], [15, "ثم تصبح وقودا لنيران الناس: يأخذ بعضا منها ليدفيء نفسه، أو يوقده ليخبز خبزه، أو ينحت منه إلها يعبده، يصنع منه تمثالا يخر أمامه ساجدا."], [16, "يوقد نصفه في النار وعلى نصفه الآخر يأكل لحما، يشوي شواء ويشبع، ويدفيء نفسه قائلا: آه، أنا مستدفيء، وأرى نارا."], [17, "ويصنع ما تبقى منه إلها، صنما يخر أمامه ساجدا مبتهلا إليه قائلا: أنقذني. أنت إلهي."], [18, "إنهم لا يفقهون ولا يدركون، إذ غشي على عيونهم فلا يبصرون، وأغلق على قلوبهم فلا يفهمون."], [19, "ليس من متأمل أو ذي معرفة أو إدراك يقول: قد أحرقت نصف الشجرة بالنار وخبزت خبزي على جمراتها، شويت لحما عليها وأكلته. أفأصنع من بقيتها رجسا وأسجد أمام قطعة خشب؟"], [20, "لكأنه يأكل الرماد! يجري وراء سراب ويعجز عن إنقاذ نفسه أو الاعتراف أن الصنم الذي يمسكه بيده هو محض ضلال!"]]}, {"l": "Jer 10:3-16", "n": "", "vs": [[3, "لأن عادات الأمم باطلة، إذ تقطع الشجرة من الغابة ثم تشذبها وتنحتها يدا صانع بفأس."], [4, "ثم يزينونها بالفضة والذهب وتثبت بالمسامير والمطارق لئلا تتحرك."], [5, "فتكون كفزاعة في حقل قثاء لا تنطق، بل تحمل لأنها عاجزة عن المشي. فلا تخافوها لأنها لا تضر ولا تنفع»."], [6, "أنت لا نظير لك يارب. عظيم أنت، واسمك عظيم في الجبروت."], [7, "من لا يتقيك ياملك الأمم؟ فالخوف منك يليق بك، إذ لا يوجد بين حكماء الشعوب وفي جميع ممالكهم من هو نظيرك."], [8, "جميعهم بلداء وحمقى، يتلقفون العلم من أصنام خشبية."], [9, "يحضرون لصنعها الفضة المطرقة من ترشيش، والذهب من أوفاز، فهي عمل صانع ماهر وصوغ يدي صائغ، وتكسى بثياب زرقاء وأرجوانية. كلها صنعة صناع مهرة."], [10, "أما الرب فهو الإله الحق، الإله الحي والملك السرمدي. ترتعد الأرض أمام غضبه ولا تتحمل الأمم فرط سخطه."], [11, "«وهذا ما تقولونه لهم: إن الآلهة التي لم تصنع السماوات والأرض يجب أن تستأصل من الأرض ومن تحت السماء»."], [12, "فالرب هو الذي صنع السماوات والأرض بقدرته، وأسس الدنيا بحكمته ومد السماوات بفطنته."], [13, "ما إن ينطق بصوته حتى تتجمع غمار المياه في السماوات، وتصعد السحب من أقاصي الأرض. يجعل للمطر بروقا، ويطلق الريح من خزائنه."], [14, "كل امريء خامل وعديم المعرفة، وكل صائغ أخزاه تمثاله لأن صنمه المسبوك كاذب ولا حياة فيه."], [15, "جميع الأصنام باطلة، صنعة ضلال، وفي زمن عقابها تبيد."], [16, "أما (الله ) نصيب يعقوب فليس مثل هذه الأوثان، بل هو جابل كل الأشياء، وشعب إسرائيل هو شعب ميراثه، واسمه الرب القدير."]]}, {"l": "Act 14:12", "n": "", "vs": [[12, "ثم دعوا برنابا زفس وبولس هرمس، لأنه كان يدير الحديث."]]}, {"l": "Act 17:29", "n": "", "vs": [[29, "فما دمنا ذرية الله، فيجب ألا ننظر إلى الألوهية كأنها صنم من ذهب أو فضة أو حجر يستطيع إنسان أن ينحته أو يصوغه كما يتخيل!"]]}, {"l": "Rom 1:23", "n": "", "vs": [[23, "واستبدلوا بمجد الله الخالد تماثيل لصور الإنسان الفاني والطيور وذوات الأربع والزواحف."]]}, {"l": "1Co 8:4", "n": "", "vs": [[4, "ففيما يخص الأكل من ذبائح الأصنام، نحن نعلم أن الصنم ليس بإله موجود في الكون، وأنه لا وجود إلا لإله واحد."]]}, {"l": "1Co 10:19", "n": "", "vs": [[19, "فماذا أعني إذن؟ أأن ما ذبح للصنم له قيمة أو أن الصنم له قيمة؟"]]}, {"l": "1Co 10:20", "n": "", "vs": [[20, "لا، بل أن ما يذبحه الوثنيون فإنما يذبحونه للشياطين وليس لله. وإني لا أريد لكم أن تكونوا مشتركين مع الشياطين."]]}, {"l": "1Co 12:2", "n": "", "vs": [[2, "تعلمون أنكم، عندما كنتم من الأمم، كنتم تنجرفون إلى الأصنام الخرساء أيما انجراف."]]}, {"l": "1Th 1:9", "n": "", "vs": [[9, "فإن أولئك المؤمنين أنفسهم يخبرون عنا كيف كان قدومنا إليكم أول مرة، وكيف تحولتم إلى الله عن الأصنام، لتصيروا عبيدا يخدمون الله الحي الحق،"]]}, {"l": "1Pe 4:3", "n": "", "vs": [[3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}], "kwAr": "كنتم في حال العبودية", "noteAr": ""}], "arS": [["ولكن، لما كنتم في ذلك ", []], ["الحين", ["G5119"]], [" لا ", []], ["تعرفون", ["G1492"]], [" ", []], ["الله", ["G2316"]], [" ، كنتم في حال ", []], ["العبودية", ["G1398"]], [".", []]]}, {"c": 4, "v": 9, "text": "أما الآن وقد عرفتم الله ، بل بالأحرى عرفكم الله ، فكيف ترتدون أيضا إلى تلك المباديء العاجزة الفقيرة التي ترغبون في الرجوع إلى العبودية لها من جديد؟", "groups": [{"kw": "ye have", "raw": "1Ki_8:43; 1Ch_28:9; Psa_9:10; Pro_2:5; Jer_31:34; Hab_2:14; Mat_11:27; Joh_17:3; 1Co_15:34; 2Co_4:6; Eph_1:17; 2Pe_2:20; 1Jo_2:3, 1Jo_2:4, 1Jo_5:20", "note": "", "refs": [{"l": "1Ki 8:43", "n": "", "vs": [[43, "فاستجب أنت من السماء مقر سكناك، وافعل كل ما يناشدك به الغريب، فيدعى باسمك بين كل أمم الأرض، فيخافوك كما يخافك شعبك إسرائيل، ويدركوا أن اسمك قد دعي على هذا الهيكل الذي بنيته."]]}, {"l": "1Ch 28:9", "n": "", "vs": [[9, "أما أنت ياابني سليمان، فاعرف إله أبيك واعبده بكمال قلب، وبنفس راغبة، لأن الرب يتفحص جميع القلوب، ويفهم كل تصور وفكر. فإن طلبته تجده، وإن تركته ينبذك إلى الأبد."]]}, {"l": "Psa 9:10", "n": "", "vs": [[10, "ويتكل عليك الذين يعرفون اسمك، لأنك يارب لم تخذل طالبيك."]]}, {"l": "Pro 2:5", "n": "", "vs": [[5, "عندئذ تدرك مخافة الرب وتعثر على معرفة الله،"]]}, {"l": "Jer 31:34", "n": "", "vs": [[34, "ولا يحض في ما بعد كل واحد قريبه قائلا: اعرف الرب إلهك لأنهم جميعا سيعرفونني، من صغيرهم إلى كبيرهم، لأني سأصفح عن إثمهم ولن أذكر خطاياهم من بعد»."]]}, {"l": "Hab 2:14", "n": "", "vs": [[14, "لأن الأرض ستمتليء من معرفة مجد الرب كما تغمر المياه البحر."]]}, {"l": "Mat 11:27", "n": "", "vs": [[27, "كل شيء قد سلمه إلي أبي. ولا أحد يعرف الابن إلا الآب، ولا أحد يعرف الآب إلا الابن، ومن أراد الابن أن يعلنه له."]]}, {"l": "Joh 17:3", "n": "", "vs": [[3, "والحياة الأبدية هي أن يعرفوك أنت الإله الحق وحدك، والذي أرسلته: يسوع المسيح."]]}, {"l": "1Co 15:34", "n": "", "vs": [[34, "عودوا إلى الصواب كما يجب ولا تخطئوا، فإن بعضا منكم يجهلون الله تماما أقول هذا لكي تخجلوا!"]]}, {"l": "2Co 4:6", "n": "", "vs": [[6, "فإن الله ، الذي أمر أن يشرق نور من الظلام، هو الذي جعل النور يشرق في قلوبنا، لإشعاع معرفة مجد الله المتجلي في وجه المسيح."]]}, {"l": "Eph 1:17", "n": "", "vs": [[17, "حتى يهبكم إله ربنا يسوع المسيح، أبو المجد، روح حكمة وإلهام: لتعرفوه معرفة كاملة"]]}, {"l": "2Pe 2:20", "n": "", "vs": [[20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."]]}, {"l": "1Jo 2:3", "n": "", "vs": [[3, "وما يؤكد لنا أننا قد عرفنا المسيح حقا هو أن نعمل بوصاياه."]]}, {"l": "1Jo 2:4", "n": "", "vs": [[4, "فالذي يدعي أنه قد عرفه، ولكنه لا يعمل بوصاياه، يكون كاذبا ولا يكون الحق في داخله."]]}, {"l": "1Jo 5:20", "n": "", "vs": [[20, "وإننا نعلم أن ابن الله قد جاء إلى الأرض وأنار أذهاننا لنعرف الإله الحق. ونحن الآن نحيا فيه، لأننا في ابنه يسوع المسيح. هذا هو الإله الحق، والحياة الأبدية."]]}], "kwAr": "وقد عرفتم الله", "noteAr": ""}, {"kw": "are known", "raw": "Exo_33:17; Psa_1:6; Joh_10:14, Joh_10:27; Rom_8:29; 1Co_8:3, 1Co_13:12; 2Ti_2:19", "note": "", "refs": [{"l": "Exo 33:17", "n": "", "vs": [[17, "فأجاب الرب موسى: «سأفعل عين هذا الأمر الذي التمست. لأنك حظيت برضاي وأنا عرفتك باسمك»."]]}, {"l": "Psa 1:6", "n": "", "vs": [[6, "لأن الرب يحفظ طريق الأبرار، أما طريق الأشرار فمصيرها الهلاك."]]}, {"l": "Joh 10:14", "n": "", "vs": [[14, "أما أنا فإني الراعي الصالح، وأعرف خرافي، وخر افي تعرفني،"]]}, {"l": "Joh 10:27", "n": "", "vs": [[27, "فخرافي تصغي لصوتي، وأنا أعرفها وهي تتبعني،"]]}, {"l": "Rom 8:29", "n": "", "vs": [[29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."]]}, {"l": "1Co 8:3", "n": "", "vs": [[3, "أما الذي يحب الله ، فإن الله يعرفه."]]}, {"l": "1Co 13:12", "n": "", "vs": [[12, "ونحن الآن ننظر إلى الأمور من خلال زجاج قاتم فنراها بغموض. إلا أننا سنراها أخيرا مواجهة. الآن، أعرف معرفة جزئية. ولكني، عندئذ، سأعرف مثلما عرفت."]]}, {"l": "2Ti 2:19", "n": "", "vs": [[19, "إلا أن الأساس الراسخ الذي وضعه الله يظل ثابتا، وعليه هذا الختم: «الرب يعرف خاصته»، وأيضا: «لينفصل عن الإثم كل من يسمي اسم الرب!»"]]}], "kwAr": "عرفكم الله", "noteAr": ""}, {"kw": "how", "raw": "Gal_3:3; Rom_8:3; Col_2:20-23; Heb_7:18", "note": "", "refs": [{"l": "Gal 3:3", "n": "", "vs": [[3, "أإلى هذا الحد أنتم أغبياء؟ أبعدما ابتدأتم بالروح تكملون بالجسد؟"]]}, {"l": "Rom 8:3", "n": "", "vs": [[3, "فإن ما عجزت الشريعة عنه، لكون الجسد قد جعلها قاصرة عن تحقيقه، أتمه الله إذ أرسل ابنه، متخذا ما يشبه جسد الخطيئة ومكفرا عن الخطيئة فدان الخطيئة في الجسد"]]}, {"l": "Col 2:20-23", "n": "", "vs": [[20, "فمادمتم قد متم مع المسيح بالنسبة لمباديء العالم، فلماذا، كما لو كنتم عائشين في العالم، تخضعون أنفسكم لفرائض مثل هذه:"], [21, "لا تمسك، لا تذق، لا تلمس"], [22, "وهذه أشياء تستهلك وتزول. فتلك الفرائض هي وصايا البشر وتعاليمهم."], [23, "لها مظاهر الحكمة لما فيها من إفراط في العبادة المصطنعة، وإذلال للذات، وقهر للجسد؛ أمور لا قيمة لها، وما هي إلا لإرضاء الميول البشرية."]]}, {"l": "Heb 7:18", "n": "", "vs": [[18, "هكذا، يتبين أن نظام الكهنوت القديم قد ألغي لأنه عاجز وغير نافع."]]}], "kwAr": "فكيف ترتدون", "noteAr": ""}, {"kw": "again", "raw": "or, back, Heb_10:38, Heb_10:39", "note": "or, back, Heb_10:38, Heb_10:39", "refs": [{"l": "Heb 10:38", "n": "", "vs": [[38, "وأما من تبرر بالإيمان، فبالإيمان يحيا. ومن ارتد لا تسر به نفسي!"]]}, {"l": "Heb 10:39", "n": "", "vs": [[39, "ولكننا نحن لسنا من أهل الارتداد المؤدي إلى الهلاك، بل من أهل الإيمان المؤدي إلى خلاص نفوسنا!"]]}], "kwAr": "من جديد", "noteAr": "أو: إلى الوراء."}, {"kw": "elements", "raw": "or, rudiments, Gal_4:3", "note": "or, rudiments, Gal_4:3", "refs": [{"l": "Gal 4:3", "n": "", "vs": [[3, "وهذه حالنا نحن أيضا: فإذ كنا قاصرين، كنا في حالة العبودية لمبادىء العالم."]]}], "kwAr": "المباديء العاجزة الفقيرة", "noteAr": "أو: المبادئ الأولى (الأركان)."}], "arS": [["أما ", []], ["الآن", ["G3568"]], [" وقد ", []], ["عرفتم", ["G1097"]], [" ", []], ["الله", ["G2316"]], [" ، بل ", []], ["بالأحرى", ["G3123"]], [" ", []], ["عرفكم", ["G1097"]], [" ", []], ["الله", ["G2316"]], [" ، ", []], ["فكيف", ["G4459"]], [" ", []], ["ترتدون", ["G1994"]], [" أيضا إلى تلك ", []], ["المباديء", ["G4747"]], [" ", []], ["العاجزة", ["G772"]], [" ", []], ["الفقيرة", ["G4434"]], [" التي ", []], ["ترغبون", ["G2309"]], [" في الرجوع إلى ", []], ["العبودية", ["G1398"]], [" لها من ", []], ["جديد", ["G509"]], ["؟", []]]}, {"c": 4, "v": 10, "text": "تحتفلون بأيام وأشهر ومواسم وسنين!", "groups": [{"kw": "", "raw": "Lev. 23:1-44, Lev_25:1, Lev_25:13; Num. 28:1-29:40; Rom_14:5; Col_2:16, Col_2:17", "note": "", "refs": [{"l": "Lev 23:1-44", "n": "", "vs": [[1, "وقال الرب لموسى:"], [2, "«أوص بني إسرائيل: هذه هي مواسمي وأعيادي التي تعلنونها محافل مقدسة."], [3, "ستة أيام تعملون، أما اليوم السابع فهو سبت راحة ومحفل مقدس. لا تقوموا فيه بأي عمل، بل يكون سبت راحة للرب حيث تقيمون."], [4, "إليكم مواسم الرب والمحافل المقدسة التي تعيدونها في أوقاتها:"], [5, "في اليوم الرابع عشر من الشهر الأول العبري (أي شهر نيسان ; أبريل) بين العشاءين يكون فصح للرب."], [6, "وفي اليوم الخامس عشر من هذا الشهر يكون عيد الفطير للرب، فتأكلون فطيرا سبعة أيام."], [7, "في اليوم الأول يكون لكم محفل مقدس، تتوقف فيه جميع الأعمال."], [8, "ثم تقربون محرقات للرب طوال سبعة أيام. وفي اليوم السابع تقيمون محفلا مقدسا تتعطل فيه جميع الأعمال»."], [9, "وخاطب الرب موسى: «أوص بني إسرائيل وقل لهم:"], [10, "متى دخلتم الأرض التي أهبها لكم وحصدتم غلاتها، تحضرون أول حزمة من حصادكم للكاهن،"], [11, "فيرجح الكاهن الحزمة في اليوم التالي ليوم السبت أمام الرب ليرضى عنكم."], [12, "وتقدمون يوم ترجيح الحزمة خروفا سليما محرقة للرب،"], [13, "مع عشرين (نحو خمسة لترات) من دقيق معجون بالزيت وقودا للرب لتحظوا برضاه. وكذلك تقدمون سكيبه ربع الهين (نحو لتر) من الخمر."], [14, "لا تأكلوا من الغلة الجديدة، لا دقيقا مخبوزا ولا فريكا ولا سويقا إلى اليوم الذي تحضرون فيه قربان إلهكم، فتكون هذه عليكم فريضة دائمة جيلا بعد جيل."], [15, "ثم تحسبون سبعة أسابيع كاملة، ابتداء من اليوم التالي للسبت الذي تحضرون فيه حزمة الترجيح،"], [16, "فتحسبون خمسين يوما إلى اليوم التالي للسبت السابع، ثم تقربون تقدمة جديدة للرب."], [17, "فتأتون من مساكنكم بخبز ترجيح، رغيفين مقدارهما عشرين (نحو خمسة لترات) من دقيق مخبوزين بخمير، فيكونان باكورة للرب."], [18, "وتقدمون مع الخبز سبعة خراف سليمة حولية وثورا واحدا وكبشين وسكيب خمر. فتكون جميعها محرقة ووقود رضى وسرور للرب."], [19, "وتقربون تيسا واحدا من المعز ذبيحة خطيئة وخروفين حوليين ذبيحة سلام."], [20, "فيرجحها الكاهن أمام الرب مع خبز الباكورة والخروفين، فتكون مقدسة للرب نصيبا للكاهن."], [21, "وتخصصون ذلك اليوم عينه ليكون محفلا مقدسا لكم، تتعطل فيه جميع الأعمال، فتكون عليكم فريضة دائمة حيث تقيمون جيلا بعد جيل."], [22, "وعندما تستوفون حصاد غلاتكم، اتركوا زوايا حقولكم غير محصودة، ولا تلتقطوا ما يقع منها على الأرض، بل اتركوه للمسكين وعابر السبيل. فأنا الرب إلهكم»."], [23, "وقال الرب لموسى:"], [24, "«أوص بني إسرائيل وقل لهم: يكون لكم اليوم الأول من الشهر السابع (أي شهر أيلول ; سبتمبر) يوم عطلة فيه تحتفلون احتفالا مقدسا، تنفخون فيه بالأبواق."], [25, "تتوقفون فيه عن أعمالكم وتصعدون تقدمات محرقات للرب»."], [26, "وقال الرب لموسى:"], [27, "«ويكون اليوم العاشر من هذا الشهر السابع يوم كفارة، تحتفلون فيه احتفالا مقدسا، وتذللون نفوسكم، وتقربون محرقات للرب،"], [28, "وتتوقفون فيه أيضا عن أعمالكم، لأنه يوم كفارة للتكفير عنكم أمام الرب إلهكم."], [29, "وكل نفس لا تتذلل في هذا اليوم تستأصل من بين شعبها"], [30, "وأبيد كل من لا يتوقف عن عمله في هذا اليوم."], [31, "إياكم القيام بعمل ما. إنها فريضة دائمة عليكم جيلا بعد جيل حيث تقيمون."], [32, "إنه سبت راحة لكم تتذللون فيه، فتستريحون من مساء اليوم التاسع حتى مساء اليوم التالي»."], [33, "وقال الرب لموسى:"], [34, "«أوص بني إسرائيل أن يحتفلوا بعيد الخيام في اليوم الخامس عشر من الشهر السابع. يحتفلون للرب سبعة أيام."], [35, "تجتمعون في اليوم الأول في محفل مقدس، تتوقف فيه جميع الأعمال،"], [36, "ثم تثابرون على تقريب محرقات للرب طوال سبعة أيام. وفي اليوم الثامن تجتمعون لاحتفال مقدس تقدمون فيه محرقات للرب، وتعتكفون للعبادة. وفي هذا اليوم تتوقف أيضا جميع الأعمال."], [37, "هذه هي أعياد الرب التي تحتفلون فيها احتفالا مقدسا لتقريب محرقات للرب، محرقة وتقدمة وذبيحة وخمرا للرب، كل يوم بيومه،"], [38, "فتكون هذه المحرقات علاوة على تقدمات سبوت الرب، وعلاوة على عطاياكم وجميع نذوركم ونوافلكم التي تقدمونها للرب."], [39, "وتعيدون في اليوم الخامس عشر من الشهر السابع عيدا للرب، لأن فيه تجمعون غلة أرضكم. تعيدون للرب سبعة أيام، فيكون اليوم الثامن عطلة."], [40, "في اليوم الأول تجمعون ثمار أشجار نضرة وسعف نخل وأغصان أشجار كثيفة الورق، وأغصان صفصاف نهري، وتفرحون أمام الرب إلهكم سبعة أيام."], [41, "سبعة أيام في السنة من الشهر السابع تحتفلون به عيدا للرب. ويكون هذا فريضة دائمة عليكم جيلا بعد جيل،"], [42, "فيقيم كل أبناء أرض إسرائيل في خيام سبعة أيام."], [43, "لكي تتذكر أجيالكم أنني أسكنت أبناء إسرائيل في خيام عندما أخرجتهم من أرض مصر. فأنا الرب إلهكم»."], [44, "وهكذا أبلغ موسى بني إسرائيل بأعياد الرب."]]}, {"l": "Lev 25:1", "n": "", "vs": [[1, "وقال الرب لموسى في جبل سيناء:"]]}, {"l": "Lev 25:13", "n": "", "vs": [[13, "وفي سنة اليوبيل هذه يرتد كل واحد إلى ملكه."]]}, {"l": "Num 28:1-29:40", "n": "", "vs": [[1, "وقال الرب لموسى:"], [2, "«أوص بني إسرائيل وقل لهم: عليكم أن تقربوا لي طعام وقائدي في مواعيده كرائحة رضى لي،"], [3, "وقل لهم: هذا هو الوقود الذي تقدمونه للرب: حملان حوليان صحيحان، يوميا ليكونا محرقة دائمة."], [4, "قدموا أحد الحملين صباحا، والحمل الآخر ما بين العشاءين،"], [5, "مع تقدمة من عشر الإيفة (نحو لترين ونصف اللتر) من دقيق معجون بربع الهين (نحو لتر) من زيت زيتون مرضوض."], [6, "هذه هي التقدمة المعتادة التي نص عليها في جبل سيناء لتكون رائحة رضى ومحرقة دائمة للرب."], [7, "ويسكب مع الحمل الواحد ربع الهين (نحو لتر) من الخمر للرب في القدس."], [8, "أما الحمل الثاني فتقدمونه بين العشاءين كتقدمة الصباح، مع سكيبه، فيكون محرقة رائحة رضى للرب."], [9, "وفي يوم السبت تقربون حملين حوليين صحيحين، مع تقدمة من عشرين (نحو خمسة لترات) من دقيق معجون بزيت، وأيضا سكيب خمر."], [10, "فتكون هذه محرقة في كل سبت، علاوة على المحرقة الدائمة وسكيبها."], [11, "وتقربون أيضا في اليوم الأول من كل شهر محرقة للرب من ثورين وكبش واحد، وسبعة حملان حولية صحيحة."], [12, "وتقدمة من ثلاثة أعشار (نحو سبعة لترات ونصف اللتر) من دقيق معجون بزيت، لكل ثور، وتقدمة من عشرين (نحو خمسة لترات) من دقيق معجون بزيت للكبش الواحد."], [13, "وتقدمة من عشر واحد (نحو لتر ين ونصف اللتر) من دقيق معجون بزيت لكل حمل، فتكون محرقة رائحة رضى وقربانا للرب."], [14, "وتكون سكائب خمرها نصف الهين (نحو لترين) للثور، وثلث الهين (نحو لتر وثلث اللتر) للكبش، وربع الهين (نحو لتر) للحمل. هذه محرقة تقرب كل شهر من أشهر السنة."], [15, "كذلك تقدمون تيسا واحدا من المعز ذبيحة خطيئة للرب علاوة على المحرقة الدائمة المقربة مع سكيبها من الخمر."], [16, "ويكون اليوم الرابع عشر من الشهر الأول العبري (أي شهر آذار ; مارس) فصحا للرب."], [17, "وفي اليوم الخامس عشر منه تحتفلون وتأكلون فطيرا سبعة أيام."], [18, "وتقيمون في اليوم الأول محفلا مقدسا، تمتنعون فيه عن أي عمل."], [19, "وتصعدون ذبائح محرقات للرب ثورين وكبشا واحدا وسبعة حملان حولية صحيحة."], [20, "وتكون تقدمتها ثلاثة أعشار (نحو سبعة لترات ونصف اللتر) من دقيق معجون بزيت لكل ثور، وعشرين (نحو خمسة لترات) للكبش الواحد."], [21, "وعشرا واحدا (نحو لترين ونصف) لكل حمل من السبعة الحملان."], [22, "وتقربون أيضا تيسا واحدا ذبيحة خطيئة للتكفير عنكم،"], [23, "فتكون هذه التقدمة علاوة على محرقة الصباح الدائمة التي تصعدونها."], [24, "هكذا تصنعون كل يوم طوال السبعة الأيام، فتقدمون طعام وقود رائحة رضى للرب، فضلا عن المحرقة الدائمة التي تقرب مع سكيب خمرها."], [25, "ثم تقيمون محفلا مقدسا في اليوم السابع، تمتنعون فيه عن أي عمل."], [26, "وفي يوم أول الأثمار حين تقربون تقدمة جديدة للرب في أثناء عيد الأسابيع، أقيموا محفلا مقدسا، تمتنعون فيه عن أي عمل."], [27, "وتقربون محرقة كرائحة رضى للرب، من ثورين وكبش واحد وسبعة حملان حولية."], [28, "أما تقدمتهن فتكون ثلاثة أعشار (نحو سبعة لترات ونصف اللتر) من دقيق معجون بزيت لكل ثور، وعشرين (نحو خمسة لترات) للكبش الواحد"], [29, "وعشرا واحدا (نحو لترين ونصف اللتر) لكل حمل من الحملان السبعة."], [30, "وأيضا تقدمون تيسا واحدا من المعز للتكفير عنكم،"], [31, "وهكذا علاوة على المحرقة الدائمة وتقدمتها، أصعدوا هذه مع سكائبها من الخمر، على أن تكون الذبائح خالية من كل عيب."], [1, "وفي اليوم الأول من الشهر السابع العبري (أي شهر أيلول ; سبتمبر) تقيمون لكم محفلا مقدسا للرب، تمتنعون فيه عن أي عمل، إذ يكون لكم يوم نفخ بالأبواق."], [2, "وتصعدون فيه محرقة لرائحة رضى للرب ثورا واحدا وكبشا واحدا وسبعة حملان حولية سليمة."], [3, "وتكون تقدمتها ثلاثة أعشار (نحو سبعة لترات ونصف اللتر) من دقيق معجون بزيت للثور، وعشرين (نحو خمسة لترات) للكبش،"], [4, "وعشرا واحدا (نحو لترين ونصف اللتر) لكل حمل من السبعة الحملان."], [5, "كما تقدمون تيسا واحدا من المعز ذبيحة خطيئة للتكفير عنكم."], [6, "فتكون هذه علاوة على المحرقة الشهرية وتقدمتها من الدقيق والمحرقة اليومية الدائمة وتقدمتها من الدقيق، مع ما يرافقها من سكائب الخمر، هي محرقة رائحة رضى للرب."], [7, "وفي اليوم العاشر من الشهر السابع تقيمون لكم محفلا مقدسا، تصومون فيه وتمتنعون عن أي عمل."], [8, "وتقربون محرقة للرب رائحة رضى ثورا واحدا وكبشا واحدا وسبعة حملان حولية سليمة."], [9, "تكون تقدمتها ثلاثة أعشار (نحو سبعة لترات ونصف اللتر) من دقيق معجون بزيت للثور، وعشرين (نحو خمسة لترات) للكبش الواحد،"], [10, "وعشرا واحدا (نحو لترين ونصف اللتر) لكل حمل من السبعة الحملان"], [11, "كما تقدمون تيسا واحدا من المعز ذبيحة خطيئة للتكفير عنكم. فتكون هذه علاوة على ذبيحة الخطيئة السنوية المقدمة في يوم الكفارة، والمحرقة اليومية الدائمة مع ما يرافقها من سكائب الخمر."], [12, "وفي اليوم الخامس عشر من الشهر نفسه تقيمون لكم محفلا مقدسا، تمتنعون فيه عن أي عمل، وتحتفلون فيه للرب سبعة أيام."], [13, "وتقربون في اليوم الأول محرقة رائحة رضى للرب، ثلاثة عشر ثورا وكبشين وأربعة عشر حملا حوليا سليما."], [14, "وتكون تقدمتها ثلاثة أعشار (نحو سبعة لترات ونصف اللتر) من دقيق معجون بزيت لكل ثور من الثيران الثلاثة عشر، وعشرين (نحو خمسة لترات) لكل كبش من الكبشين."], [15, "وعشرا واحدا (نحو لترين ونصف اللتر) لكل حمل من الأربعة عشر حملا."], [16, "كما تقدمون تيسا من المعز ذبيحة خطيئة، علاوة على المحرقة اليومية الدائمة وتقدمتها وسكيبها من الخمر."], [17, "وتقربون في اليوم الثاني اثني عشر ثورا وكبشين وأربعة عشر حملا حوليا سليما."], [18, "وتكون تقدمتها من الدقيق وسكائب الخمر لكل من الثيران والكبشين والحملان، هي التقدمة المعتادة بما يتفق مع عددها."], [19, "كما تقدمون تيسا واحدا من المعز ذبيحة خطيئة، علاوة على المحرقة اليومية الدائمة، وتقدمتها من الدقيق وسكائب الخمر."], [20, "وتقربون في اليوم الثالث أحد عشر ثورا وكبشين وأربعة عشر حملا حوليا سليما."], [21, "وتكون تقدمتها من الدقيق وسكائب الخمر لكل من الثيران والكبشين والحملان هي التقدمة المعتادة بما يتفق مع عددها."], [22, "كما تقدمون تيسا واحدا من المعز ذبيحة خطيئة، علاوة على المحرقة اليومية الدائمة وتقدمتها من الدقيق وسكائب الخمر."], [23, "وتقربون في اليوم الرابع عشرة ثيران وكبشين وأربعة عشر حملا حوليا سليما."], [24, "وتكون تقدمتها من الدقيق وسكائب الخمر لكل من الثيران والكبشين والحملان هي التقدمة المعتادة بما يتفق مع عددها."], [25, "كما تقدمون تيسا واحدا من المعز ذبيحة خطيئة، علاوة على المحرقة اليومية الدائمة وتقدمتها من الدقيق وسكائب الخمر."], [26, "وتقربون في اليوم الخامس تسعة ثيران وكبشين وأربعة عشر حملا حوليا صحيحا،"], [27, "وتكون تقدمتها من الدقيق وسكائب الخمر لكل من الثيران والكبشين والحملان هي التقدمة المعتادة بما يتفق مع عددها."], [28, "كما تقدمون تيسا واحدا من المعز ذبيحة خطيئة، علاوة على المحرقة اليومية الدائمة وتقدمتها من الدقيق وسكائب الخمر."], [29, "وتقربون في اليوم السادس ثمانية ثيران وكبشين وأربعة عشر حملا حوليا سليما."], [30, "وتكون تقدمتها من الدقيق وسكائب الخمر لكل من الثيران والكبشين والحملان هي التقدمة المعتادة بما يتفق مع عددها."], [31, "كما تقدمون تيسا واحدا من المعز ذبيحة خطيئة، علاوة على المحرقة اليومية الدائمة وتقدمتها من الدقيق وسكائب الخمر."], [32, "وتقربون في اليوم السابع سبعة ثيران وكبشين وأربعة عشر حملا حوليا سليما."], [33, "وتكون تقدمتها من الدقيق وسكائب الخمر لكل من الثيران والكبشين والحملان هي التقدمة المعتادة بما يتفق مع عددها."], [34, "كما تقدمون تيسا واحدا من المعز ذبيحة خطيئة، علاوة على المحرقة اليومية الدائمة وتقدمتها من الدقيق وسكائب الخمر."], [35, "وفي اليوم الثامن تجتمعون للعبادة وفيه تمتنعون عن أي عمل."], [36, "وتقربون محرقة لتكون رائحة رضى للرب ثورا واحدا وكبشا واحدا وسبعة حملان حولية سليمة."], [37, "وتكون تقدمتها من الدقيق وسكائب الخمر لكل من الثور والكبش والحملان هي التقدمة المعتادة بما يتفق مع عددها."], [38, "كما تقدمون تيسا واحدا من المعز ذبيحة خطيئة علاوة على المحرقة اليومية الدائمة وتقدمتها من الدقيق وسكائب الخمر."], [39, "فهذه هي الذبائح التي تقربونها للرب في مواسم أعيادكم، علاوة على نذوركم وقرابين محرقاتكم الطوعية وتقدماتكم من الدقيق وسكائب خمركم وذبائح سلامتكم»."], [40, "فأبلغ موسى بني إسرائيل جميع ما أمره به الرب."]]}, {"l": "Rom 14:5", "n": "", "vs": [[5, "ومن الناس من يراعي يوما دون غيره، ومنهم من يعتبر الأيام كلها متساوية. فليكن كل واحد مقتنعا برأيه في عقله."]]}, {"l": "Col 2:16", "n": "", "vs": [[16, "فلا يحكم عليكم أحد في قضية الأكل والشرب، أو في القضايا المتعلقة بالأعياد ورؤوس الشهور والسبوت؛"]]}, {"l": "Col 2:17", "n": "", "vs": [[17, "فهذه كانت ظلالا لما سيأتي، أي للحقيقة التي هي المسيح."]]}], "kwAr": "", "noteAr": ""}], "arS": [["تحتفلون", ["G3906"]], [" ", []], ["بأيام", ["G2250"]], [" ", []], ["وأشهر", ["G3376"]], [" ", []], ["ومواسم", ["G2540"]], [" ", []], ["وسنين", ["G1763"]], ["!", []]]}, {"c": 4, "v": 11, "text": "أخاف عليكم، خشية أن أكون قد تعبت من أجلكم بلا جدوى.", "groups": [{"kw": "am", "raw": "Gal_4:20; 2Co_11:2, 2Co_11:3, 2Co_12:20,2Co_12:21", "note": "", "refs": [{"l": "Gal 4:20", "n": "", "vs": [[20, "وكم أود لو أكون الآن حاضرا عندكم، فأخاطبكم بغير هذه اللهجة، لأني متحير في أمركم."]]}, {"l": "2Co 11:2", "n": "", "vs": [[2, "فإني أغار عليكم غيرة من عند الله لأني خطبتكم لرجل واحد هو المسيح، لأقدمكم إليه عذراء عفيفة."]]}, {"l": "2Co 11:3", "n": "", "vs": [[3, "غير أني أخشى أن تضلل عقولكم عن الإخلاص والطهارة تجاه المسيح مثلما أغوت الحية بمكرها حواء."]]}, {"l": "2Co 12:20", "n": "", "vs": [[20, "فإني أخشى أن آتي إليكم فأجدكم في حالة لا أريدها وتجدوني في حالة لا تريدونها! أي أن يكون بينكم كثير من النزاع والحسد والحقد والتحزب والتجريح والنميمة والتكبر والبلبلة."]]}, {"l": "2Co 12:21", "n": "", "vs": [[21, "وأخشى أن يجعلني إلهي ذليلا بينكم عند مجيئي إليكم مرة أخرى، فيكون حزني شديدا على كثيرين من الذين أخطأوا قبلا ولم يتوبوا عما ارتكبوا من دنس وزنى وفسق!"]]}], "kwAr": "أخاف عليكم", "noteAr": ""}, {"kw": "lest", "raw": "Gal_2:2, Gal_5:2-4; Isa_49:4; Act_16:6; 1Co_15:58; Phi_2:16; 1Th_3:5; 2Jo_1:8", "note": "", "refs": [{"l": "Gal 2:2", "n": "", "vs": [[2, "وإنما صعدت إليها استجابة للوحي؛ وبسطت أمامهم الإنجيل الذي أبشر به بين الأمم، ولكن على انفراد أمام البارزين فيهم، لئلا يكون مسعاي في الحاضر والماضي بلا جدوى."]]}, {"l": "Gal 5:2-4", "n": "", "vs": [[2, "ها أنا بولس أقول لكم: إن ختنتم، لا ينفعكم المسيح شيئا."], [3, "وأشهد مرة أخرى لكل مختون بأنه ملتزم أن يعمل بالشريعة كلها."], [4, "يامن تريدون التبرير عن طريق الشريعة، قد حرمتم المسيح وسقطتم من النعمة!"]]}, {"l": "Isa 49:4", "n": "", "vs": [[4, "ولكنني أجبت: لقد تعبت باطلا. وأفنيت قوتي سدى وعبثا. غير أن ة،"]]}, {"l": "1Co 9:20-23", "n": "", "vs": [[20, "فصرت لليهود كأني يهودي، حتى أكسب اليهود؛ وللخاضعين للشريعة كأني خاضع لها مع أني لست خاضعا لها حتى أكسب الخاضعين لها؛"], [21, "وللذين بلا شريعة كأني بلا شريعة مع أني لست بلا ناموس عند الله بل أنا خاضع لناموس من نحو المسيح حتى أكسب الذين هم بلا شريعة."], [22, "وصرت للضعفاء ضعيفا، حتى أكسب الضعفاء. صرت للجميع كل شيء، لأنقذ بعضا منهم مهما كلف الأمر."], [23, "وإني أفعل الأمور كلها من أجل الإنجيل، لأكون شريكا فيه مع الآخرين."]]}, {"l": "Phi 3:7", "n": "", "vs": [[7, "ولكن، ما كان لي من ربح، فقد اعتبرته خسارة، من أجل المسيح."]]}, {"l": "Phi 3:8", "n": "", "vs": [[8, "بل إني أعتبر كل شيء خسارة، من أجل امتياز معرفة المسيح يسوع ربي؛ فمن أجله تحملت خسارة كل شيء، وأعتبر كل شيء نفاية، لكي أربح المسيح"]]}], "kwAr": "أن تكونوا مثلي", "noteAr": ""}, {"kw": "ye", "raw": "2Co_2:5", "note": "", "refs": [{"l": "2Co 2:5", "n": "", "vs": [[5, "وإذا كان أحد قد سبب الحزن، فإنه لم يسبب الحزن لي شخصيا، بل لجميعكم إلى حد ما، هذا لكي لا أبالغ!"]]}], "kwAr": "أنتم لم تظلموني بشيء", "noteAr": ""}], "arS": [["أتوسل", ["G1189"]], [" إليكم أيها ", []], ["الإخوة", ["G80"]], ["، أن تكونوا ", []], ["مثلي", ["G5613"]], ["، لأني ", []], ["أنا", ["G2504"]], [" أيضا مثلكم. أنتم لم ", []], ["تظلموني", ["G91"]], [" بشيء،", []]]}, {"c": 4, "v": 13, "text": "بل تعرفون أنني في علة بالجسد بشرتكم أول الأمر؛", "groups": [{"kw": "through", "raw": "1Co_2:3; 2Co_10:10, 2Co_11:6, 2Co_11:30, 2Co_12:7-10, 2Co_13:4", "note": "", "refs": [{"l": "1Co 2:3", "n": "", "vs": [[3, "وقد كنت عندكم في حالة من الضعف والخوف والارتعاد الكثير."]]}, {"l": "2Co 10:10", "n": "", "vs": [[10, "فمنكم من يقول: «رسائله شديدة اللهجة وقوية؛ أما حضوره الشخصي فضعيف، وكلامه حقير»."]]}, {"l": "2Co 11:6", "n": "", "vs": [[6, "فمع أني أتكلم كلام العامة غير الفصيح، فلا تنقصني المعرفة. وإنما أظهرنا لكم ذلك في كل شيء أمام الجميع."]]}, {"l": "2Co 11:30", "n": "", "vs": [[30, "إن كان لابد من الافتخار، فإني سأفتخر بأمور ضعفي."]]}, {"l": "2Co 12:7-10", "n": "", "vs": [[7, "ولكي لا أتكبر بما لهذه الإعلانات  ممكنا", "noteAr": ""}], "arS": [["فأين", ["G5101"]], [" ", []], ["غبطتكم", ["G3108"]], [" تلك؟ فإني ", []], ["أشهد", ["G3140"]], [" لكم أنكم كنتم ", []], ["ستقلعون", ["G1846"]], [" ", []], ["عيونكم", ["G3788"]], [" ", []], ["وتقدمونها", ["G1325"]], [" لي، لو كان ذلك ", []], ["ممكنا", ["G1415"]], ["!", []]]}, {"c": 4, "v": 16, "text": "فهل صرت الآن عدوا لكم لأني كلمتكم بالحق؟", "groups": [{"kw": "become", "raw": "Gal_3:1-4; 1Ki_18:17, 1Ki_18:18, 1Ki_21:20, 1Ki_22:8, 1Ki_22:27; 2Ch_24:20-22, 2Ch_25:16; Psa_141:5; Pro_9:8; Joh_7:7, Joh_8:45", "note": "", "refs": [{"l": "Gal 3:1-4", "n": "", "vs": [[1, "ياأهل غلاطية الأغبياء! من سحر عقولكم، أنتم الذين قد رسم أمام أعينكم يسوع المسيح وهو مصلوب؟"], [2, "أريد أن أستعلم منكم هذا الأمر فقط: أعلى أساس العمل بما في الشريعة نلتم الروح، أم على أساس الإيمان بالبشارة؟"], [3, "أإلى هذا الحد أنتم أغبياء؟ أبعدما ابتدأتم بالروح تكملون بالجسد؟"], [4, "وهل كان اختباركم الطويل بلا جدوى، إن كان حقا بلا جدوى؟"]]}, {"l": "1Ki 18:17", "n": "", "vs": [[17, "وما إن رأى أخآب إيليا حتى قال له: «أهذا أنت يامكدر إسرائيل؟»"]]}, {"l": "1Ki 18:18", "n": "", "vs": [[18, "فأجابه إيليا: «أنا لست مكدر إسرائيل، بل أنت وبيت أبيك، بعصيانكم وصايا الرب وضلالكم وراء البعليم."]]}, {"l": "1Ki 21:20", "n": "", "vs": [[20, "وما إن رأى أخآب إيليا حتى قال: «هل وجدتني ياعدوي؟» فأجابه: «قد وجدتك لأنك بعت نفسك لارتكاب الشر في عيني الرب."]]}, {"l": "1Ki 22:8", "n": "", "vs": [[8, "فأجاب ملك إسرائيل: «يوجد بعد رجل واحد، يمكننا عن طريقه أن نطلب مشورة الرب، ولكني أمقته لأنه لا يتنبأ علي بغير الشر. إنه ميخا بن يملة». فقال يهوشافاط: «لا تقل هذا أيها الملك»."]]}, {"l": "1Ki 22:27", "n": "", "vs": [[27, "وقولوا لهما: إن الملك أمر بإيداع هذا في السجن، وأطعموه خبز الضيق وماء الضيق حتى أرجع من الحرب بسلام»."]]}, {"l": "2Ch 24:20-22", "n": "", "vs": [[20, "فحل روح الله على زكريا بن يهوياداع الكاهن، فوقف أمام الشعب وقال لهم: «هذا ما يقوله الله : لماذا تتعدون أوامر الرب فلا تفلحون؟ لقد نبذتم الرب فنبذكم الرب»."], [21, "فكادوا له حتى أمر الملك برجمه بالحجارة في ساحة الهيكل."], [22, "ولم يذكر الملك الفضل الذي أسداه إليه يهوياداع، بل قتل ابنه، وفيما هو يلفظ أنفاسه قال: «لينظر الرب ويجر قضاءه»."]]}, {"l": "2Ch 25:16", "n": "", "vs": [[16, "فقاطعه الملك وقال: «هل أقمناك أحد مشيري الملك؟ كف لئلا تقتل». فانصرف النبي وهو يقول: «قد أيقنت أن الله قضى بإهلاكك، لأنك ارتكبت هذا وأبيت أن تسمع لمشورتي»."]]}, {"l": "Psa 141:5", "n": "", "vs": [[5, "ليضربني الصديق فذلك رحمة، وليوبخني فذلك زيت عاطر لرأسي. أما الأشرار فإني أصلي دائما (كي تحفظني من أفعالهم الأثيمة)."]]}, {"l": "Pro 9:8", "n": "", "vs": [[8, "لا تقرع الساخر لئلا يبغضك، ووبخ الحكيم فيحبك."]]}, {"l": "Joh 7:7", "n": "", "vs": [[7, "لا يقدر العالم أن يبغضكم، ولكنه يبغضني أنا، لأني أشهد عليه أن أعماله شريرة."]]}, {"l": "Joh 8:45", "n": "", "vs": [[45, "أما أنا فلأني أقول الحق، لستم تصدقونني."]]}], "kwAr": "فهل صرت الآن عدوا لكم", "noteAr": ""}, {"kw": "because", "raw": "Gal_2:5, Gal_2:14, Gal_5:7", "note": "", "refs": [{"l": "Gal 2:5", "n": "", "vs": [[5, "فلم نخضع لهم مستسلمين ولو لساعة واحدة، ليبقى حق الإنجيل ثابتا عندكم."]]}, {"l": "Gal 2:14", "n": "", "vs": [[14, "فلما رأيت أنهم لا يسلكون باستقامة توافق حق الإنجيل، قلت لبطرس أمام الحاضرين جميعا: «إن كنت وأنت يهودي تعيش كالأمم لا كاليهود، فكيف تجبر الأمم أن يعيشوا كاليهود؟»"]]}, {"l": "Gal 5:7", "n": "", "vs": [[7, "كنتم تجرون جريا جيدا، فمن أعاقكم حتى لا تذعنوا للحق؟"]]}], "kwAr": "لأني كلمتكم بالحق", "noteAr": ""}], "arS": [["فهل ", []], ["صرت", ["G1096"]], [" الآن ", []], ["عدوا", ["G2190"]], [" لكم لأني كلمتكم ", []], ["بالحق", ["G226"]], ["؟", []]]}, {"c": 4, "v": 17, "text": "إن أولئك (المعلمين) يظهرون من نحوكم حماسة، ولكنها غير صادقة، بل هم يرغبون في عزلكم عنا،", "groups": [{"kw": "zealously", "raw": "Gal_6:12, Gal_6:13; Mat_23:15; Rom_10:2, Rom_16:18; 1Co_11:2; 2Co_11:3, 2Co_11:13-15; Phi_2:21; 2Pe_2:3, 2Pe_2:18", "note": "", "refs": [{"l": "Gal 6:12", "n": "", "vs": [[12, "إن الذين يريدون أن يظهروا في الجسد بمظهر حسن، أولئك يرغمونكم أن تختنوا، فقط لئلا يلقوا الاضطهاد بسبب صليب المسيح."]]}, {"l": "Gal 6:13", "n": "", "vs": [[13, "فحتى أولئك , []], ["حماسة", ["G2206"]], ["، ولكنها غير ", []], ["صادقة", ["G2573"]], ["، بل هم ", []], ["يرغبون", ["G2309"]], [" في ", []], ["عزلكم", ["G1576"]], [" عنا،", []]]}, {"c": 4, "v": 18, "text": "لكي تتحمسوا لهم. جميل إظهار الحماسة في ما هو حق، كل حين، وليس فقط حين أكون حاضرا عندكم.", "groups": [{"kw": "it is", "raw": "Num_25:11-13; Psa_69:9, Psa_119:139; Isa_59:17; Joh_2:17; 1Co_15:58; Tit_2:14; Rev_3:19", "note": "", "refs": [{"l": "Num 25:11-13", "n": "", "vs": [[11, "«إن فينحاس بن ألعازار بن هرون الكاهن قد رد غضبي عن بني إسرائيل، إذ غار غيرتي في وسطهم، فلم أفن بني إسرائيل بغيرتي."], [12, "لذلك قل له: هأنذا أقطع معه ميثاق سلام،"], [13, "فيكون له ولنسله من بعده ميثاق كهنوت أبدي، لأنه غار لله وكفر عن الإسرائيليين»."]]}, {"l": "Psa 69:9", "n": "", "vs": [[9, "لأن الغيرة على بيتك التهمتني وتعييرات الذين يعيرونك وقعت علي."]]}, {"l": "Psa 119:139", "n": "", "vs": [[139, "أتميز غيرة في داخلي، لأن أعدائي تغاضوا عن كلامك."]]}, {"l": "Isa 59:17", "n": "", "vs": [[17, "فتدرع بالبر وارتدى على رأسه خوذة الخلاص، واكتسى بثياب الانتقام، والتف بعباءة الغضب."]]}, {"l": "Joh 2:17", "n": "", "vs": [[17, "فتذكر تلاميذه أنه جاء في الكتاب: «الغيرة على بيتك تلتهمني»."]]}, {"l": "1Co 15:58", "n": "", "vs": [[58, "إذن، ياإخوتي الأحباء، كونوا راسخين غير متزحزحين، كثيري الاجتهاد في عمل الرب دائما، عالمين أن جهدكم في الرب ليس عبثا!"]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Rev 3:19", "n": "", "vs": [[19, "إني أوبخ وأؤدب من أحبه، لذا كن حارا وتب!"]]}], "kwAr": "جميل إظهار الحماسة", "noteAr": ""}, {"kw": "I am", "raw": "Gal_4:20; Phi_1:27, Phi_2:12", "note": "", "refs": [{"l": "Gal 4:20", "n": "", "vs": [[20, "وكم أود لو أكون الآن حاضرا عندكم، فأخاطبكم بغير هذه اللهجة، لأني متحير في أمركم."]]}, {"l": "Phi 1:27", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"]]}, {"l": "Phi 2:12", "n": "", "vs": [[12, "إذن، ياأحبائي، كما كنتم تطيعون دائما، لا كما لو أنني حاضر وحسب، بل بالأحرى كثيرا الآن وأنا غائب، كذلك اسعوا لتحقيق خلاصكم عمليا بخوف وارتعاد،"]]}], "kwAr": "حين أكون حاضرا عندكم", "noteAr": ""}], "arS": [["لكي ", []], ["تتحمسوا", ["G2206"]], [" لهم. ", []], ["جميل", ["G2570"]], [" إظهار ", []], ["الحماسة", ["G2206"]], [" في ما هو حق، ", []], ["كل حين", ["G3842"]], ["، وليس ", []], ["فقط", ["G3440"]], [" حين أكون ", []], ["حاضرا", ["G3918"]], [" عندكم.", []]]}, {"c": 4, "v": 19, "text": "ياأطفالي الذين أتمخض بكم مرة أخرى إلى أن تتشكل فيكم صورة المسيح.", "groups": [{"kw": "little", "raw": "1Co_4:14; 1Ti_1:2; Tit_1:4; Phm_1:10,Phm_1:19; Jam_1:18; 1Jo_2:1, 1Jo_2:12, 1Jo_5:21", "note": "", "refs": [{"l": "1Co 4:14", "n": "", "vs": [[14, "لا أكتب هذا تخجيلا لكم، بل أنبهكم باعتباركم أولادي الأحباء."]]}, {"l": "1Ti 1:2", "n": "", "vs": [[2, "إلى تيموثاوس ولدي الحقيقي في الإيمان. لتكن لك النعمة والرحمة والسلام من الله أبينا والمسيح يسوع ربنا!"]]}, {"l": "Tit 1:4", "n": "", "vs": [[4, "إلى تيطس، ولدي الحقيقي بالنسبة إلى الإيمان المشترك بيننا."]]}, {"l": "Phm 1:10", "n": "", "vs": [[10, "فألتمس منك لأجل ولدي الذي ولدته وأنا مكبل بالقيود، أونسيموس،"]]}, {"l": "Phm 1:19", "n": "", "vs": [[19, "وها أنا بولس قد كتبت هذا بخط يدي: أنا أوفي، ولست أذكرك هنا أنك مديون لي بنفسك أيضا."]]}, {"l": "Jam 1:18", "n": "", "vs": [[18, "وهو قد شاء أن يجعلنا أولادا له، فولدنا بكلمته، كلمة الحق. وغايته أن نكون باكورة خليقته."]]}, {"l": "1Jo 2:1", "n": "", "vs": [[1, "ياأولادي الصغار، أكتب إليكم هذه الأمور لكي لا تخطئوا. ولكن، إن أخطأ أحدكم، فلنا عند الآب شفيع هو يسوع المسيح البار."]]}, {"l": "1Jo 2:12", "n": "", "vs": [[12, "أكتب إليكم، أيها الأولاد، لأن الله قد غفر لكم خطاياكم إكراما لاسم المسيح."]]}, {"l": "1Jo 5:21", "n": "", "vs": [[21, "أيها الأولاد الصغار، احفظوا أنفسكم من الأصنام!"]]}], "kwAr": "ياأطفالي", "noteAr": ""}, {"kw": "of", "raw": "Num_11:11, Num_11:12; Isa_53:11; Luk_22:44; Phi_1:8, Phi_2:17; Col_2:1, Col_4:12; Heb_5:7; Rev_12:1, Rev_12:2", "note": "", "refs": [{"l": "Num 11:11", "n": "", "vs": [[11, "فقال موسى للرب: «لماذا أسأت إلى عبدك ولم ترض عنه حتى إنك حملته مسئولية هذا الشعب؟"]]}, {"l": "Num 11:12", "n": "", "vs": [[12, "ألعلي حبلت به أو ولدته، حتى تقول لي احمله في حضنك كما يحمل المربي الرضيع، وقده إلى الأرض التي وعدت بها آباءه."]]}, {"l": "Isa 53:11", "n": "", "vs": [[11, "ويرى ثمار تعب نفسه ويشبع، وعبدي البار يبرر بمعرفته كثيرين ويحمل آثامهم."]]}, {"l": "Luk 22:44", "n": "", "vs": [[44, "وإذ كان في صراع، أخذ يصلي بأشد إلحاح؛ حتى إن عرقه صار كقطرات دم نازلة على الأرض."]]}, {"l": "Phi 1:8", "n": "", "vs": [[8, "فإن الله شاهد لي كيف أحن إليكم جميعا في عواطف المسيح يسوع."]]}, {"l": "Phi 2:17", "n": "", "vs": [[17, "حتى لو سفك دمي سكيبا فوق ذبيحة إيمانكم وخدمته، فإني أفرح وأبتهج معكم جميعا."]]}, {"l": "Col 2:1", "n": "", "vs": [[1, "فإني أريد أن تعلموا مقدار جهادي لأجلكم ولأجل الذين في مدينة لاودكية، ولأجل جميع الذين لا يعرفونني بالوجه،"]]}, {"l": "Col 4:12", "n": "", "vs": [[12, "يسلم عليكم أبفراس الذي هو منكم، وهو عبد للمسيح يسوع، يجاهد كل حين لأجلكم في الصلوات لتثبتوا كاملين ولكم تمام اليقين من جهة مشيئة الله كلها."]]}, {"l": "Heb 5:7", "n": "", "vs": [[7, "والمسيح، في أثناء حياته البشرية على الأرض، رفع أدعية وتضرعات مقترنة بصراخ شديد ودموع، إلى القادر أن يخلصه من الموت. وقد لبى الله طلبه إكراما لتقواه."]]}, {"l": "Rev 12:1", "n": "", "vs": [[1, "وظهرت في السماء آية عظيمة: امرأة لابسة الشمس، والقمر تحت قدميها، وعلى رأسها تاج من اثني عشر نجما."]]}, {"l": "Rev 12:2", "n": "", "vs": [[2, "وكانت حبلى تصرخ من ألم الولادة وتتوجع وهي تلد."]]}], "kwAr": "الذين أتمخض بكم", "noteAr": ""}, {"kw": "Christ", "raw": "Rom_8:29, Rom_13:14; Eph_4:24; Phi_2:5; Col_1:27, Col_3:10", "note": "", "refs": [{"l": "Rom 8:29", "n": "", "vs": [[29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."]]}, {"l": "Rom 13:14", "n": "", "vs": [[14, "وإنما البسوا الرب يسوع المسيح (تمثلوا به)، ولا تنشغلوا بالتدبير للجسد لقضاء شهواته."]]}, {"l": "Eph عة هي المسيح لتبرير كل من يؤمن."], [5, "فقد كتب موسى عن البر الآتي من الشريعة: «إن الإنسان الذي يعمل بهذه الأمور، يحيا بها»."], [6, "غير أن البر الآتي من الإيمان يقول هذا: «لا تقل في قلبك: من يصعد إلى السماوات؟» أي لينزل المسيح،"], [7, "ولا: «من ينزل إلى الأعماق؟» أي ليصعد المسيح من بين الأموات!"], [8, "فماذا يقول إذا؟ إنه يقول: «إن الكلمة قريبة منك. إنها في فمك وفي قلبك!» وما هذه الكلمة إلا كلمة الإيمان التي نبشر بها:"], [9, "أنك إن اعترفت بفمك بيسوع ربا، وآمنت في قلبك بأن الله أقامه من الأموات، نلت الخلاص."], [10, "فإن الإيمان في القلب يؤدي إلى البر، والاعتراف بالفم يؤيد الخلاص،"]]}], "kwAr": "يامن ترغبون", "noteAr": ""}, {"kw": "do", "raw": "Mat_21:42-44, Mat_22:29-32; Joh_5:46, Joh_5:47", "note": "", "refs": [{"l": "Mat 21:42-44", "n": "", "vs": [[42, "فقال لهم يسوع: «ألم تقرأوا في الكتاب: الحجر الذي رفضه البناة، هو نفسه صار حجر الزاوية الأساسي. من الرب كان هذا، وهو عجيب في أنظارنا!"], [43, "لذلك أقول لكم: إن ملكوت الله سينزع من أيديكم ويسلم إلى شعب يؤدي ثمره."], [44, "فأي من يقع على هذا الحجر يتكسر، ومن يقع الحجر عليه يسحقه سحقا! »"]]}, {"l": "Mat 22:29-32", "n": "", "vs": [[29, "فرد عليهم يسوع قائلا: «أنتم في ضلال لأنكم لا تفهمون الكتاب ولا قدرة الله."], [30, "فالناس في القيامة لا يتزوجون ولا يزوجون، بل يكونون كملائكة الله في السماء."], [31, "أما عن قيامة الأموات، أفما قرأتم ما قيل لكم على لسان الله:"], [32, "أنا إله إبراهيم وإله إسحاق وإله يعقوب؟ وليس الله بإله أموات، بل هو إله أحياء»."]]}, {"l": "Joh 5:46", "n": "", "vs": [[46, "فلو كنتم صدقتم موسى، لكنتم صدقتموني، لأنه هو كتب عني."]]}, {"l": "Joh 5:47", "n": "", "vs": [[47, "وإذا كنتم لا تصدقون ما كتبه موسى، فكيف تصدقون كلامي؟»"]]}], "kwAr": "ألستم تسمعون", "noteAr": ""}, {"kw": "the law", "raw": "Joh_10:34, Joh_12:34, Joh_15:25; Rom_3:19", "note": "", "refs": [{"l": "Joh 10:34", "n": "", "vs": [[34, "فقال لهم يسوع: «أليس مكتوبا في شريعتكم: أنا قلت إنكم آلهة؟"]]}, {"l": "Joh 12:34", "n": "", "vs": [[34, "فقال بعض الحاضرين: «علمتنا الشريعة أن المسيح يبقى حيا إلى الأبد، فكيف تقول إن ابن الإنسان لابد أن يعلق؟ "born", "raw": "Rom_9:7, Rom_9:8", "note": "", "refs": [{"l": "Rom 9:7", "n": "", "vs": [[7, "وليسوا، لأنهم نسل إبراهيم، كلهم أولادا لله، بل (كما قد كتب): «بإسحاق سيكون لك نسل يحمل اسمك»."]]}, {"l": "Rom 9:8", "n": "", "vs": [[8, "أي أن أولاد الجسد ليسوا هم أولاد الله، بل أولاد الوعد يحسبون نسلا."]]}], "kwAr": "ولد حسب الجسد", "noteAr": ""}, {"kw": "but", "raw": "Gen_17:15-19, Gen_18:10-14, Gen_21:1, Gen_21:2; Rom_4:18-21, Rom_10:8; Heb_11:11", "note": "", "refs": [{"l": "Gen 17:15-19", "n": "", "vs": [[15, "وقال الرب لإبراهيم: «أما ساراي زوجتك فلا تدعوها ساراي بعد الآن، بل يكون اسمها سارة (ومعناه أميرة)."], [16, "وأباركها وأعطيك ابنا منها. سأباركها وأجعلها أما لشعوب، ومنها يتحدر ملوك أمم»."], [17, "فانطرح إبراهيم على وجهه وضحك قائلا في نفسه: «أيولد ابن لمن بلغ المئة من عمره؟ وهل تنجب سارة وهي في التسعين من عمرها؟ »"], [18, "وقال إبراهيم لله: «ليت إسماعيل يحيا في رعايتك»."], [19, "فأجاب الرب: «إن سارة زوجتك هي التي تلد لك ابنا وتدعو اسمه إسحق (ومعناه يضحك). وأقيم عهدي معه ومع ذريته من بعده عهدا أبديا."]]}, {"l": "Gen 18:10-14", "n": "", "vs": [[10, "فقال: «إني أرجع إليك في مثل هذا الوقت من السنة القادمة فتكون سارة آنئذ قد ولدت لك ابنا». وكانت سارة وراءه، عند باب الخيمة، فسمعت حديثه."], [11, "وكان إبراهيم وسارة عجوزين طاعنين جدا في السن وقد تجاوزت سارة سن اليأس."], [12, "فضحكت سارة في نفسها قائلة: «أبعد أن فني عمري وأصبح زوجي شيخا يكون لي هذا التنعم؟»"], [13, "فقال الرب لإبراهيم: «لماذا ضحكت سارة قائلة: أحقا ألد ابنا وقد بلغت سن الشيخوخة؟"], [14, "أيتعذر على الرب شيء؟ سأرجع إليك في مثل هذا الوقت من السنة القادمة فتكون سارة قد أنجبت ابنا»."]]}, {"l": "Gen 21:1", "n": "", "vs": [[1, "وافتقد الرب سارة كما قال، وأنجز لها ما وعد به."]]}, {"l": "Gen 21:2", "n": "", "vs": [[2, "فحبلت سارة وولدت لإبراهيم في شيخوخته ابنا، في الوقت الذي عينه الله له."]]}, {"l": "Rom 4:18-21", "n": "", "vs": [[18, "إذ رغم انقطاع الرجاء، فبالرجاء آمن إبراهيم بأنه سيصير أبا لأمم كثيرة، وفقا لما قيل له: «بهذه الكثرة سيكون نسلك»."], [19, "ولم يضعف في الإيمان حين أدرك موت جسده، لكونه قارب سن المئة، وموت رحم زوجته سارة أيضا؛"], [20, "ولم يشك في وعد الله عن عدم إيمان، بل وجد في الإيمان قوة، فأعطى المجد لله."], [21, "وإذ اقتنع تماما بأن ما وعده الله به هو قادر أن يفعله؛"]]}, {"l": "Rom 10:8", "n": "", "vs": [[8, "فماذا يقول إذا؟ إنه يقول: «إن الكلمة قريبة منك. إنها في فمك وفي قلبك!» وما هذه الكلمة إلا كلمة الإيمان التي نبشر بها:"]]}, {"l": "Heb 11:11", "n": "", "vs": [[11, "وبالإيمان أيضا، نالت سارة زوجة إبراهيم قدرة على الإنجاب، فولدت ابنا مع أنها كانت قد جاوزت سن الحمل. وذلك لأنها آمنت بأن الله ، الذي وعدها بذلك، لابد أن يحقق وعده."]]}], "kwAr": "وأما ابن الحرة", "noteAr": ""}], "arS": [["أما ابن ", []], ["الجارية", ["G3814"]], ["، فقد ", []], ["ولد", ["G1080"]], [" حسب ", []], ["الجسد", ["G4561"]], [". وأما ابن ", []], ["الحرة", ["G1658"]], ["، فإتماما ", []], ["للوعد", ["G1860"]], [".", []]]}, {"c": 4, "v": 24, "text": "وهذه الحقيقة لها معنى رمزي. فهاتان المرأتان ترمزان إلى عهدين: الأول مصدره جبل سيناء، يجعل المولودين تحته في حال العبودية، ورمزه هاجر.", "groups": [{"kw": "an allegory", "raw": "Eze_20:49; Hos_11:10; Mat_13:35; 1Co_10:11 *Gr: Heb_11:19", "note": "", "refs": [{"l": "Eze 20:49", "n": "", "vs": [[49, "عندئذ قلت: «آه ياسيد الرب: هم يقولون عني: أما يضرب هو أمثالا فقط؟»"]]}, {"l": "Hos 11:10", "n": "", "vs": [[10, "يسيرون ورائي أنا الرب، فأزأر كالأسد، وعندئذ يسرع أبنائي قادمين من الغرب."]]}, {"l": "Mat 13:35", "n": "", "vs": [[35, "ليتم ما قيل بلسان النبي القائل: «سأفتح فمي بأمثال، وأكشف ما كان مخفيا منذ إنشاء العالم»."]]}, {"l": "1Co 10:11", "n": "*Gr:", "vs": [[11, "فهذه الأمور كلها حدثت لهم لتكون مثالا، وقد كتبت إنذارا لنا، نحن الذين تناهت إلينا أواخر الأزمنة."]]}, {"l": "Heb 11:19", "n": "", "vs": [[19, "فقد آمن إبراهيم بأن الله قادر على إقامة إسحاق من الموت. والواقع أن إبراهيم استعاد ابنه من الموت، على سبيل المثال أو الرمز."]]}], "kwAr": "لها معنى رمزي", "noteAr": ""}, {"kw": "for", "raw": "Gal_4:25; Luk_22:19, Luk_22:20; 1Co_10:4", "note": "", "refs": [{"l": "Gal 4:25", "n": "", "vs": [[25, "ولفظة هاجر تطلق على جبل سيناء، في بلاد العرب، وتمثل أورشليم الحالية، فإنها مع بنيها في العبودية."]]}, {"l": "Luk 22:19", "n": "", "vs": [[19, "وإذ أخذ رغيفا، شكر، وكسر، وأعطاهم قائلا: «هذا جسدي الذي يبذل لأجلكم. هذا افعلوه لذكري!»"]]}, {"l": "Luk 22:20", "n": "", "vs": [[20, "وكذلك أخذ الكأس أيضا بعد العشاء، وقال: «هذه الكأس هي العهد الجديد بدمي الذي يسفك لأجلكم."]]}, {"l": "1Co 10:4", "n": "", "vs": [[4, "وشربوا كلهم شرابا واحدا له رمز روحي، إذ شربوا من صخرة روحية تبعتهم، وقد كانت هذه الصخرة هي المسيح."]]}], "kwAr": "فهاتان المرأتان", "noteAr": ""}, {"kw": "the two", "raw": "Gal_3:15-21; Heb_7:22, Heb_8:6-13, Heb_9:15-24, Heb_10:15-18, Heb_12:24, Heb_13:20", "note": "", "refs": [{"l": "Gal 3:15-21", "n": "", "vs": [[15, "أيها الإخوة، بمنطق البشر أقول إنه حتى العهد الذي يقره إنسان، لا أحد يلغيه أو يزيد عليه."], [16, "وقد وجهت الوعود لإبراهيم ونسله، ولا يقول «وللأنسال» كأنه يشير إلى كثيرين، بل يشير إلى واحد، إذ يقول «ولنسلك»، يعني المسيح."], [17, "فما أقوله هو هذا: إن عهدا سبق أن أقره الله لا تنقضه الشريعة التي جاءت بعده بأربع مئة وثلاثين سنة، وكأنها تلغي الوعد."], [18, "فلو كان الميراث يتم على مبدأ الشريعة، لما كان الأمر متعلقا بعد بالوعد. غير أن الله ، بالوعد، أنعم بالميراث على إبراهيم."], [19, "فلماذا الشريعة إذن؟ إنها فقط أضيفت إظهارا للمعاصي، إلى أن يجيء «النسل» الذي قطع له الوعد، وقد رتبت بملائكة وعلى يد وسيط."], [20, "ولكن، عندما يصدر الوعد من جانب واحد، فلا لزوم لوسيط. والواعد هنا هو الله وحده."], [21, "فهل تناقض الشريعة وعود الله؟ حاشا! فلو أعطيت شريعة قادرة أن تحيي، لكان البر بالحقيقة على مبدأ الشريعة."]]}, {"l": "Heb 7:22", "n": "", "vs": [[22, "فعلى أساس ذلك القسم، صار يسوع ضامنا لعهد أفضل!"]]}, {"l": "Heb 8:6-13", "n": "", "vs": [[6, "فرئيس كهنتنا، إذن، قد حصل على خدمة أفضل من خدمة الكهنوت الأرضي، لكونه الوسيط الذي أعلن لنا قيام عهد جديد أفضل من العهد السابق، ولكون هذا العهد الجديد ينطوي على وعود أفضل."], [7, "فلو كان العهد السابق بلا عيب، لما ظهرت الحاجة إلى عهد آخر يحل محله."], [8, "والواقع أن الله نفسه يعبر عن عجز العهد السابق. وهذا واضح في قول أحد الأنبياء قديما:"], [9, "هذا العهد الجديد ليس كالعهد الذي أبرمته مع آبائهم، حين أمسكت بأيديهم وأخرجتهم من أرض مصر. فبما أنهم خرقوا ذلك العهد، يقول الرب، أصبح من حقي أن ألغيه!"], [10, "فهذا هو العهد الذي أبرمه مع بني إسرائيل، بعد تلك الأيام، يقول الرب: أضع شرائعي داخل ضمائرهم، وأكتبها على قلوبهم، وأكون لهم إلها، وهم يكونون لي شعبا."], [11, "بعد ذلك، لا يعلم أحد منهم ابن وطنه ولا أخاه قائلا: تعرف بالرب! ذلك لأن الجميع سوف يعرفونني حق المعرفة، من الصغير فيهم إلى العظيم."], [12, "لأني سأصفح عن آثامهم، ولا أعود أبدا إلى تذكر خطاياهم ومخالفاتهم!»"], [13, "وهكذا، نلاحظ أن الله بكلامه عن عهد جديد، جعل العهد السابق عتيقا. وطبيعي أن كل ما عتق وشاخ، يكون في طريقه إلى الزوال!"]]}, {"l": "Heb 9:15-24", "n": "", "vs": [[15, "ولذلك، فالمسيح هو الوسيط لهذا العهد الجديد. فبما أنه قد تم الموت فداء للمخالفات الحاصلة تحت العهد الأول، ينال المدعوون الوعد بالإرث الأبدي."], [16, "فعندما يموت أحد ويترك وصية، لابد من إثبات موته للاستفادة من وصيته."], [17, "إذ لا قوة للوصية على الإطلاق مادام صاحبها حيا. فلا تثبت الوصية إلا بموت صاحبها."], [18, "وهكذا، فحتى العهد العتيق لم يبدأ تنفيذه إلا برش الدم."], [19, "فمعلوم أن موسى، بعد تلاوة وصايا الشريعة كلها على الشعب، أخذ دم العجول والتيوس مع بعض الماء، ورشه على كتاب الشريعة، وعلى أفراد الشعب، بباقة من نبات الزوفا وصوف أحمر اللون."], [20, "وقال: هذا دم العهد الذي أوصاكم الله بحفظه."], [21, "وقد رش موسى الدم أيضا على خيمة العبادة، وعلى أدوات الخدمة التي فيها."], [22, "فالشريعة توصي بأن يتطهر كل شيء تقريبا بالدم. ولا غفران إلا بسفك الدم!"], [23, "وبما أن تطهير الخيمة الأرضية كان يتطلب رش دم الذبائح الحيوانية، فإن الخيمة الحقيقية لابد أن تتطلب دم ذبيحة أفضل من الذبائح الأخرى."], [24, "فالمسيح، رئيس كهنتنا، لم يدخل إلى «قدس الأقداس» الأرضي، الذي صنعته يد بشرية وما هو إلا ظل للحقيقة، بل دخل إلى السماء عينها، حيث يقوم الآن بتمثيلنا في حضرة الله بالذات."]]}, {"l": "Heb 10:15-18", "n": "", "vs": [[15, "والروح القدس نفسه يشهد لنا بهذه الحقيقة. إذ قال أولا:"], [16, "«هذا هو العهد الذي أبرمه معهم بعد تلك الأيام، يقول الرب: أضع شرائعي في داخل قلوبهم، وأكتبها في عقولهم»."], [17, "ثم أضاف: «ولا أعود أبدا إلى تذكر خطاياهم ومخالفاتهم»."], [18, "فحينما يتحقق غفر ان الخطايا، لا تبقى حاجة بعد إلى تقريب التقدمات عنها!"]]}, {"l": "Heb 12:24", "n": "", "vs": [[24, "كذلك، تقدمتم إلى يسوع، وسيط العهد الجديد، وإلى دمه المرشوش الذي يتكلم مطالبا بأفضل مما طالب به دم هابيل."]]}, {"l": "Heb 13:20", "n": "", "vs": [[20, "وأسأل الله ، إله السلام الذي أقام من بين الأموات ربنا يسوع راعي الخراف العظيم بفضل دمه الذي ختم به العهد الأبدي"]]}], "kwAr": "عهدين", "noteAr": ""}, {"kw": "covenants", "raw": "or, testament", "note": "or, testament", "refs": [], "kwAr": "عهدين", "noteAr": "أو: وصيّتين."}, {"kw": "Sinai", "raw": "Gr. Sina", "note": "Gr. Sina", "refs": [], "kwAr": "جبل سيناء", "noteAr": "في اليونانية: سينا."}, {"kw": "which", "raw": "Gal_5:1; Rom_8:15", "note": "", "refs": [{"l": "Gal 5:1", "n": "", "vs": [[1, "إن المسيح قد حررنا وأطلقنا في سبيل الحرية. فاثبتوا إذن، ولا تعودوا إلى الارتباك بنير العبودية."]]}, {"l": "Rom 8:15", "n": "", "vs": [[15, "إذ إنكم لم تنالوا روح عبودية يعيدكم إلى الخوف، بل نلتم روح بنوة به نصرخ: «أبا! أبانا!»"]]}], "kwAr": "يجعل المولودين تحته في حال العبودية", "noteAr": ""}, {"kw": "Agar", "raw": "Gen_16:3, Gen_16:4, Gen_16:8, Gen_16:15, Gen_16:16, Gen_21:9-13, Gen_25:12, Hagar", "note": "Gen_16:3, Gen_16:4, Gen_16:8, Gen_16:15, Gen_16:16, Gen_21:9-13, Gen_25:12, Hagar", "refs": [{"l": "Gen 16:3", "n": "", "vs": [[3, "وهكذا بعد إقامة عشر سنوات في أرض كنعان، أخذت ساراي جاريتها المصرية هاجر وأعطتها لرجلها أبرام لتكون زوجة له."]]}, {"l": "Gen 16:4", "n": "", "vs": [[4, "فعاشر هاجر فحبلت منه. ولما أدركت أنها حامل هانت مولاتها في عينيها،"]]}, {"l": "Gen 16:8", "n": "", "vs": [[8, "فقال: «ياهاجر جارية ساراي، من أين جئت؟ وإلى أين تذهبين؟». فأجابت: «إنني هاربة من وجه سيدتي ساراي»."]]}, {"l": "Gen 16:15", "n": "", "vs": [[15, "ثم ولدت هاجر لأبرام ابنا، فدعا أبرام ابنه الذي أنجبته له هاجر إسماعيل."]]}, {"l": "Gen 16:16", "n": "", "vs": [[16, "وكان أبرام في السادسة والثمانين من عمره عندما ولدت له هاجر إسماعيل."]]}, {"l": "Gen 21:9-13", "n": "", "vs": [[9, "ورأت سارة أن ابن هاجر المصرية الذي أنجبته لإبراهيم يسخر من ابنها إسحق،"], [10, "فقالت لإبر اهيم: «اطرد هذه الجارية وابنها، فإن ابن الجارية لن يرث مع ابني إسحق»."], [11, "فقبح هذا القول في نفس إبر اهيم من أجل ابنه."], [12, "فقال الله له: «لا يسوء في نفسك أمر الصبي أو أمر جاريتك، واسمع لكلام سارة في كل ما تشير به عليك لأنه بإسحق يدعى لك نسل."], [13, "وسأقيم من ابن الجارية أمة أيضا لأنه من ذريتك»."]]}, {"l": "Gen 25:12", "n": "", "vs": [[12, "وهذا سجل مواليد إسماعيل بن إبراهيم الذي أنجبته هاجر المصرية جارية سارة لإبراهيم."]]}], "kwAr": "هاجر", "noteAr": "هي هاجر؛ انظر تك 16: 3-16؛ 21: 9-13؛ 25: 12."}], "arS": [["وهذه الحقيقة لها معنى ", []], ["رمزي", ["G238"]], [". فهاتان المرأتان ترمزان إلى ", []], ["عهدين", ["G1417", "G1242"]], [": الأول مصدره ", []], ["جبل", ["G3735"]], [" ", []], ["سيناء", ["G4614"]], ["، يجعل ", []], ["المولودين", ["G1080"]], [" تحته في حال ", []], ["العبودية", ["G1397"]], ["، ورمزه ", []], ["هاجر", ["G28"]], [".", []]]}, {"c": 4, "v": 25, "text": "ولفظة هاجر تطلق على جبل سيناء، في بلاد العرب، وتمثل أورشليم الحالية، فإنها مع بنيها في العبودية.", "groups": [{"kw": "is", "raw": "Gal_4:24", "note": "", "refs": [{"l": "Gal 4:24", "n": "", "vs": [[24, "وهذه الحقيقة لها معنى رمزي. فهاتان المرأتان ترمزان إلى عهدين: الأول مصدره جبل سيناء، يجعل المولودين تحته في حال العبودية، ورمزه هاجر."]]}], "kwAr": "ولفظة هاجر", "noteAr": ""}, {"kw": "Sinai", "raw": "Deu_33:2; Jdg_5:5; Psa_68:8, Psa_68:17; Heb_12:18", "note": "", "refs": [{"l": "Deu 33:2", "n": "", "vs": [[2, "فقال: «أقبل الرب من سيناء، وأشرف عليهم من سعير، وتألق في جبل فاران؛ جاء محاطا بعشرات الألوف من الملائكة وعن يمينه يومض برق عليهم."]]}, {"l": "Jdg 5:5", "n": "", "vs": [[5, "تزلزلت الأرض أمام الرب وارتعد جبل سيناء هذا من حضرة الرب إله إسرائيل."]]}, {"l": "Psa 68:8", "n": "", "vs": [[8, "رجفت الأرض، وهطلت السماء مطرا، وارتعد جبل سيناء من حضرة الله إله إسرائيل."]]}, {"l": "Psa 68:17", "n": "", "vs": [[17, "مركبات الرب كثيرة لا تحصى والرب في وسطها، فصار جبل صهيون مماثلا لجبل سيناء في القداسة."]]}, {"l": "Heb 12:18", "n": " 4:2; Phi_3:20; Heb_12:22; Rev_3:12, Rev_21:2, 10-27", "note": "", "refs": [{"l": "Psa 87:3-6", "n": "", "vs": [[3, "يتحدثون عنك بأمور مجيدة يامدينة الله."], [4, "أذكر مصر وبابل بين الذين يعرفونني، وكذلك فلسطين وصور مع الحبشة، فيقولون: هذا ولد في صهيون."], [5, "حقا عن صهيون يقولون: «هذا الإنسان وهذا الإنسان ولد فيها، والعلي يثبتها»."], [6, "يدون الرب في سجل إحصاء الشعوب أن هذا ولد هناك."]]}, {"l": "Isa 2:2", "n": "", "vs": [[2, "ويحدث في آخر الأيام، أن جبل هيكل الرب يصبح أسمى من كل الجبال، ويعلو فوق كل التلال، فتتوافد إليه جميع الأمم."]]}, {"l": "Isa 2:3", "n": "", "vs": [[3, "وتقبل شعوب كثيرة وتقول: تعالوا لنذهب إلى جبل الرب، إلى بيت إله يعقوب، فيعلمنا طرقه، ونسلك في سبله، لأن من صهيون تخرج الشريعة، ومن أورشليم تعلن كلمة الرب."]]}, {"l": "Isa 52:9", "n": "", "vs": [[9, "اهتفي مترنمة ياأرض أورشليم الخربة، لأن الرب قد عزى شعبه وافتدى أورشليم."]]}, {"l": "Isa 62:1", "n": "", "vs": [[1, "إكراما لصهيون لا أصمت، ومن أجل أورشليم لا أستكين حتى يتجلى كضياء برها وخلاصها كمشعل متوهج،"]]}, {"l": "Isa 62:2", "n": "", "vs": [[2, "فترى الأمم برك وكل الملوك مجدك، وتدعين باسم جديد يطلقه عليك فم الرب."]]}, {"l": "Isa 65:18", "n": "", "vs": [[18, "إنما افرحوا وابتهجوا إلى الأبد بما أنا خالقه، فها أنا أخلق أورشليم بهجة، وشعبها فرحا."]]}, {"l": "Isa 66:10", "n": "", "vs": [[10, "تهللوا مع أورشليم وافرحوا لها ياكل محبيها، ابتهجوا معها بفرح ياجميع النائحين عليها."]]}, {"l": "Joe 3:17", "n": "", "vs": [[17, "فتدركون أني أنا هو الرب إلهكم الساكن في صهيون جبلي المقدس، وتكون أورشليم مقدسة ولا يجتاز فيها الغرباء أبدا."]]}, {"l": "Mic 4:1", "n": "", "vs": [[1, "ويكون في آخر الأيام أن جبل هيكل الرب يصبح أشهر الجبال، ويعلو فوق كل التلال، فتتقاطر إليه شعوب عديدة،"]]}, {"l": "Mic 4:2", "n": "", "vs": [[2, "وتقبل إليه أمم كثيرة قائلة: «تعالوا لنصعد إلى جبل الرب، إلى هيكل يعقوب ليعلمنا طرقه فنسلك في سبله، لأن من صهيون تخرج الشريعة ومن أورشليم تذاع كلمة الرب»."]]}, {"l": "Phi 3:20", "n": "", "vs": [[20, "أما نحن، فإن وطننا في السماوات التي منها ننتظر عودة مخلصنا الرب يسوع المسيح،"]]}, {"l": "Heb 12:22
