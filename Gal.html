أن الناس يقسمون بالأعظم. والقسم عندهم، يضع حدا لكل مشاجرة لأنه يحسم الأمور."], [17, "ولذلك، لما أراد الله أن يؤكد بصورة قاطعة لوارثي وعده، أن قراره لا يتغير أبدا، ثبته بالقسم."], [18, "فاستنادا إلى وعد الله وقسمه، وهما أمران ثابتان لا يتغيران ويستحيل أن يكذب الله فيهما، نحصل على تشجيع قوي، بعدما التجأنا إلى التمسك بالرجاء الموضوع أمامنا."]]}], "kwAr": "تلغي الوعد", "noteAr": ""}, {"kw": "none", "raw": "Gal_5:4; Num_30:8; Psa_33:10; Rom_3:3; 1Co_1:17", "note": "", "refs": [{"l": "Gal 5:4", "n": "", "vs": [[4, "يامن تريدون التبرير عن طريق الشريعة، قد حرمتم المسيح وسقطتم من النعمة!"]]}, {"l": "Num 30:8", "n": "", "vs": [[8, "وإن منعها زوجها عند معرفته بنذورها، فإن ما تعهدت به وألزمت نفسها به يصبح لاغيا، والرب يصفح عنها."]]}, {"l": "Psa 33:10", "n": "", "vs": [[10, "الرب أحبط مؤامرة الأمم. أبطل أفكار الشعوب."]]}, {"l": "Rom 3:3", "n": "", "vs": [[3, "فماذا يحدث؟ إن كان بعضهم قد أساءوا الأمانة، فهل يعطل عدم أمانتهم أمانة الله؟"]]}, {"l": "1Co 1:17", "n": "", "vs": [[17, "فإن المسيح قد أرسلني لا لأعمد، بل لأبشر بالإنجيل، غير معتمد على حكمة الكلام، لئلا يصير صليب المسيح كأنه بلا نفع."]]}], "kwAr": "تلغي", "noteAr": ""}], "arS": [["فما ", []], ["أقوله", ["G3004"]], [" هو هذا: إن ", []], ["عهدا", ["G1242"]], [" ", []], ["سبق أن أقره", ["G4300"]], [" ", []], ["الله", ["G2316"]], [" لا ", []], ["تنقضه", ["G208"]], [" ", []], ["الشريعة", ["G3551"]], [" التي جاءت ", []], ["بعده", ["G3326"]], [" ", []], ["بأربع مئة", ["G5071"]], [" ", []], ["وثلاثين", ["G5144"]], [" ", []], ["سنة", ["G2094"]], ["، وكأنها ", []], ["تلغي", ["G2673"]], [" ", []], ["الوعد", ["G1860"]], [".", []]]}, {"c": 3, "v": 18, "text": "فلو كان الميراث يتم على مبدأ الشريعة، لما كان الأمر متعلقا بعد بالوعد. غير أن الله ، بالوعد، أنعم بالميراث على إبراهيم.", "groups": [{"kw": "if", "raw": "Gal_3:10,Gal_3:12, Gal_3:26, Gal_3:29, Gal_2:21; Rom_4:13-16, Rom_8:17", "note": "", "refs": [{"l": "Gal 3:10", "n": "", "vs": [[10, "أما جميع الذين على مبدأ أعمال الشريعة، فإنهم تحت اللعنة، لأنه قد كتب: «ملعون كل من لا يثبت على العمل بكل ما هو مكتوب في كتاب الشريعة!»"]]}, {"l": "Gal 3:12", "n": "", "vs": [[12, "ولكن الشريعة لا تراعي مبدأ الإيمان، بل «من عمل بهذه الوصايا، يحيا بها»."]]}, {"l": "Gal 3:26", "n": "", "vs": [[26, "فإنكم جميعا أبناء الله بالإيمان بالمسيح يسوع."]]}, {"l": "Gal 3:29", "n": "", "vs": [[29, "فإذا كنتم للمسيح، فأنتم إذن نسل إبراهيم وحسب الوعد وارثون."]]}, {"l": "Gal 2:21", "n": "", "vs": [[21, "إني لا أبطل فاعلية نعمة الله، إذ لو كان البر بالشريعة، لكان موت المسيح عملا لا داعي له."]]}, {"l": "Rom 4:13-16", "n": "", "vs": [[13, "فليس على أساس الشريعة كان الوعد لإبراهيم، أو لنسله، بأن يكون وارثا للعالم، وإنما على أساس البر الذي بالإيمان."], [14, "فلو كان أهل الشريعة هم أصحاب الإرث، لصار الإيمان بلا فاعلية ونقض الوعد."], [15, "لأن الشريعة إنما تنتج الغضب؛ فلولا الشريعة لما ظهرت المخالفة."], [16, "لذلك، فإن الوعد هو على أساس الإيمان ليكون بحسب النعمة، بقصد أن يكون مضمونا للنسل كله: ليس لأهل الشريعة وحدهم، بل أيضا لأهل الإيمان الذي كان لإبراهيم. فإنه أب لنا جميعا،"]]}, {"l": "Rom 8:17", "n": "", "vs": [[17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}], "kwAr": "فلو كان الميراث يتم على مبدأ الشريعة", "noteAr": ""}, {"kw": "but", "raw": "Gal_3:16; Psa_105:6-12, Psa_105:42; Mic_7:18-20; Luk_1:54, Luk_1:55, Luk_1:72, Luk_1:73; Heb_6:12-15", "note": "", "refs": [{"l": "Gal 3:16", "n": "", "vs": [[16, "وقد وجهت الوعود لإبراهيم ونسله، ولا يقول «وللأنسال» كأنه يشير إلى كثيرين، بل يشير إلى واحد، إذ يقول «ولنسلك»، يعني المسيح."]]}, {"l": "Psa 105:6-12", "n": "", "vs": [[6, "ياذرية إبراهيم عبده، يابني يعقوب الذين اختارهم."], [7, "هو الرب إلهنا، أحكامه تملأ الأرض كلها."], [8, "لم ينس عهده قط ولا وعده الذي قطعه إلى ألف جيل،"], [9, "العهد الذي أبرمه مع إبراهيم، والقسم الذي أقسم به لإسحق."], [10, "ثم ثبته ليعقوب فريضة، ولإسرائيل ميثاقا أبديا،"], [11, "قائلا: «لك أعطي أرض كنعان نصيب ميراث لكم»."], [12, "إذ كانوا قلة بعد، نفرا ضئيلا متغربين في الأرض."]]}, {"l": "Psa 105:42", "n": "", "vs": [[42, "لأنه ذكر كلمته المقدسة التي وعد بها إبراهيم عبده."]]}, {"l": "Mic 7:18-20", "n": "", "vs": [[18, "إي إله مثلك يصفح عن الإثم ويعفو عن معصية بقية ميراثه؟ لا يحتفظ إلى الأبد بغضبه لأنه يسر بالرحمة."], [19, "يعود يرحمنا ويطأ ذنوبنا بقدميه، ويطرح معاصينا إلى أعماق البحر."], [20, "أنت تبدي أمانة لذرية يعقوب، ورحمة لنسل إبراهيم، كما حلفت لأجدادنا منذ القدم."]]}, {"l": "Luk 1:54", "n": "", "vs": [[54, "أعان إسرائيل فتاه، متذكرا الرحمة،"]]}, {"l": "Luk 1:55", "n": "", "vs": [[55, "كما تكلم إلى آبائنا، لإبراهيم ونسله إلى الأبد»."]]}, {"l": "Luk 1:72", "n": "", "vs": [[72, "ليتم الرحمة نحو آبائنا ويتذكر عهده المقدس"]]}, {"l": "Luk 1:73", "n": "", "vs": [[73, "ذلك القسم الذي أقسم لإبراهيم أبينا: بأن يمنحنا،"]]}, {"l": "Heb 6:12-15", "n": "", "vs": [[12, "وذلك حتى لا تتكاسلوا، بل تقتدوا بالذين يرثون ما وعد الله به، عن طريق الإيمان والصبر."], [13, "لنأخذ وعد الله لإبراهيم مثلا. فلما قطع له ذلك الوعد، أقسم بنفسه، إذ ليس هنالك من هو أعظم منه حتى يقسم به."], [14, "وقد قال له: «لأباركنك وأعطينك نسلا كثيرا!»"], [15, "وهكذا، انتظر إبراهيم بصبر فنال ما وعد به."]]}], "kwAr": "غير أن الله بالوعد أنعم", "noteAr": ""}], "arS": [["فلو كان ", []], ["الميراث", ["G2817"]], [" يتم على مبدأ ", []], ["الشريعة", ["G3551"]], ["، لما كان الأمر متعلقا بعد ", []], ["بالوعد", ["G1860"]], [". غير أن ", []], ["الله", ["G2316"]], [" ، ", []], ["بالوعد", ["G1860"]], ["، ", []], ["أنعم", ["G5483"]], [" بالميراث على ", []], ["إبراهيم", ["G11"]], [".", []]]}, {"c": 3, "v": 19, "text": "فلماذا الشريعة إذن؟ إنها فقط أضيفت إظهارا للمعاصي، إلى أن يجيء «النسل» الذي قطع له الوعد، وقد رتبت بملائكة وعلى يد وسيط.", "groups": [{"kw": "then", "raw": "Rom_3:1, Rom_3:2, Rom_7:7-13", "note": "", "refs": [{"l": "Rom 3:1", "n": "", "vs": [[1, "إذن، ما هو فضل اليهودي؟ بل ما هو نفع الختان؟"]]}, {"l": "Rom 3:2", "n": "", "vs": [[2, "إنه كثير من جميع الجهات، وأهمها فعلا أن أقوال الله وضعت أمانة بين أيديهم."]]}, {"l": "Rom 7:7-13", "n": "", "vs": [[7, "إذن، ماذا نقول؟ هل الشريعة خطيئة؟ حاشا! ولكني ما عرفت الخطيئة إلا بالشريعة. فما كنت لأعرف الشهوة لولا قول الشريعة: «لا تشته!»"], [8, "ولكن الخطيئة استغلت هذه الوصية فأثارت في كل شهوة. فإن الخطيئة، لولا الشريعة، ميتة."], [9, "أما أنا فكنت من قبل عائشا بمعزل عن الشريعة؛ ولكن لما جاءت الشريعة عاشت الخطيئة،"], [10, "فمت أنا. والوصية الهادفة إلى الحياة، صارت لي مؤدية إلى الموت."], [11, "فإن الخطيئة، إذ استغلت الوصية، خدعتني وقتلتني بها."], [12, "فالشريعة إذن مقدسة، والوصية مقدسة وعادلة وصالحة."], [13, "فهل صار ما هو صالح موتا لي؟ حاشا! ولكن الخطيئة، لكي تظهر أنها خطيئة، أنتجت لي الموت بما هو صالح، حتى تصير الخطيئة خاطئة جدا بسبب الوصية."]]}], "kwAr": "فلماذا الشريعة إذن", "noteAr": ""}, {"kw": "It was added", "raw": "Gal_3:21-24; Deu_4:8, Deu_4:9; Psa_147:19, Psa_147:20; Luk_16:31; Joh_5:45-47, Joh_15:22; Rom_2:13; Rom_3:19, Rom_3:20, Rom_4:15, Rom_5:20,Rom_5:21, Rom_7:7-13; 1Ti_1:8, 1Ti_1:9", "note": "", "refs": [{"l": "Gal 3:21-24", "n": "", "vs": [[21, "فهل تناقض الشريعة وعود الله؟ حاشا! فلو أعطيت شريعة قادرة أن تحيي، لكان البر بالحقيقة على مبدأ الشريعة."], [22, "ولكن الكتاب حبس الجميع تحت الخطيئة، حتى إن الوعد، على أساس الإيمان بيسوع المسيح، يوهب للذين يؤمنون."], [23, "فقبل مجيء الإيمان، كنا تحت حراسة الشريعة، محتجزين إلى أن يعلن الإيمان الذي كان إعلانه منتظرا."], [24, "إذن، كانت الشريعة هي مؤدبنا حتى مجيء المسيح، لكي نبرر على أساس الإيمان."]]}, {"l": "Deu 4:8", "n": "", "vs": [[8, "وأي شعب، مهما عظم، لديه شرائع وأحكام عادلة نظير هذه الشرائع التي أضعها اليوم أمامكم؟"]]}, {"l": "Deu 4:9", "n": "", "vs": [[9, "إنما احترزوا واحذروا لئلا تنسوا الأمور التي شهدتها أعينكم فلا تنمحي من قلوبكم كل أيام حياتكم. وعلموها لأولادكم ولأحفادكم."]]}, {"l": "Psa 147:19", "n": "", "vs": [[19, "يعلن ليعقوب كلمته ولإسرائيل فرائضه وأحكامه."]]}, {"l": "Psa 147:20", "n": "", "vs": [[20, "لم يعامل أمة أخرى هكذا، ولم يعرفها أحكامه هللويا."]]}, {"l": "Luk 16:31", "n": "", "vs": [[31, "فقال له: إن كانوا لا يسمعون لموسى والأنبياء، فلا يقتنعون حتى لو قام واحد من بين الأموات!»"]]}, {"l": "Joh 5:45-47", "n": "", "vs": [[45, "لا تظنوا أني أشكوكم إلى الآب، فإن هنالك من يشكوكم، وهو موسى الذي علقتم عليه رجاءكم."], [46, "فلو كنتم صدقتم موسى، لكنتم صدقتموني، لأنه هو كتب عني."], [47, "وإذا كنتم لا تصدقون ما كتبه موسى، فكيف تصدقون كلامي؟»"]]}, {"l": "Joh 15:22", "n": "", "vs": [[22, "لو لم آت وأكلمهم، لما كانت لهم خطيئة؛ ولكن لا عذر لهم الآن في خطيئتهم."]]}, {"l": "Rom 2:13", "n": "", "vs": [[13, "فليس سامعو الشريعة هم الأبرار أمام الله؛ بل العاملون بالشريعة يبررون."]]}, {"l": "Rom 3:19", "n": "", "vs": [[19, "ونحن نعلم أن كل ما تقوله الشريعة إنما تخاطب به الذين هم تحت الشريعة، لكي يسد كل فم ويقع العالم كله تحت دينونة من الله."]]}, {"l": "Rom 3:20", "n": "", "vs": [[20, "فإن أحدا من البشر لا يتبرر أمامه بالأعمال المطلوبة في الشريعة. إذ إن الشريعة هي لإظهار الخطيئة."]]}, {"l": "Rom 4:15", "n": "", "vs": [[15, "لأن الشريعة إنما تنتج الغضب؛ فلولا الشريعة لما ظهرت المخالفة."]]}, {"l": "Rom 5:20", "n": "", "vs": [[20, "وأما الشريعة فقد أدخلت لتظهر كثرة المعصية. ولكن، حيث كثرت الخطيئة، تتوافر النعمة أكثر جدا،"]]}, {"l": "Rom 5:21", "n": "", "vs": [[21, "حتى إنه كما ملكت الخطيئة بالموت، فكذلك أيضا تملك النعمة على أساس البر مؤدية إلى الحياة الأبدية بيسوع المسيح ربنا."]]}, {"l": "Rom 7:7-13", "n": "", "vs": [[7, "إذن، ماذا نقول؟ هل الشريعة خطيئة؟ حاشا! ولكني ما عرفت الخطيئة إلا بالشريعة. فما كنت لأعرف الشهوة لولا قول الشريعة: «لا تشته!»"], [8, "ولكن الخطيئة استغلت هذه الوصية فأثارت في كل شهوة. فإن الخطيئة، لولا الشريعة، ميتة."], [9, "أما أنا فكنت من قبل عائشا بمعزل عن الشريعة؛ ولكن لما جاءت الشريعة عاشت الخطيئة،"], [10, "فمت أنا. والوصية الهادفة إلى الحياة، صارت لي مؤدية إلى الموت."], [11, "فإن الخطيئة، إذ استغلت الوصية، خدعتني وقتلتني بها."], [12, "فالشريعة إذن مقدسة، والوصية مقدسة وعادلة وصالحة."], [13, "فهل صار ما هو صالح موتا لي؟ حاشا! ولكن الخطيئة، لكي تظهر أنها خطيئة، أنتجت لي الموت بما هو صالح، حتى تصير الخطيئة خاطئة جدا بسبب الوصية."]]}, {"l": "1Ti 1:8", "n": "", "vs": [[8, "إننا نعلم أن الشريعة جيدة في ذاتها، إذا استعملت استعمالا شرعيا."]]}, {"l": "1Ti 1:9", "n": "", "vs": [[9, "إذ ندرك أن الشريعة لا تطبق على من كان بارا، بل على الأشرار والمتمردين، على الفاجرين والخاطئين، والنجسين والدنسين، وقاتلي آبائهم وأمهاتهم، وقاتلي الناس،"]]}], "kwAr": "إنها فقط أضيفت", "noteAr": ""}, {"kw": "till", "raw": "Gal_3:16, Gal_3:25, Gal_4:1-4", "note": "", "refs": [{"l": "Gal 3:16", "n": "", "vs": [[16, "وقد وجهت الوعود لإبراهيم ونسله، ولا يقول «وللأنسال» كأنه يشير إلى كثيرين، بل يشير إلى واحد، إذ يقول «ولنسلك»، يعني المسيح."]]}, {"l": "Gal 3:25", "n": "", "vs": [[25, "ولكن بعدما جاء الإيمان، تحررنا من سلطة المؤدب."]]}, {"l": "Gal 4:1-4", "n": "", "vs": [[1, "أقول أيضا مادام الوريث قاصرا، فليس بينه وبين العبد أي فرق، مع أنه صاحب الإرث كله،"], [2, "بل يبقى خاضعا للأوصياء والوكلاء إلى أن تنقضي الفترة التي حددها أبوه."], [3, "وهذه حالنا نحن أيضا: فإذ كنا قاصرين، كنا في حالة العبودية لمبادىء العالم."], [4, "ولكن لما جاء تمام الزمان، أرسل الله ابنه، وقد ولد من امرأة وكان خاضعا للشريعة،"]]}], "kwAr": "إلى أن يجيء النسل", "noteAr": ""}, {"kw": "by", "raw": "Deu_33:2; Act_7:53; Heb_2:2, Heb_2:5", "note": "", "refs": [{"l": "Deu 33:2", "n": "", "vs": [[2, "فقال: «أقبل الرب من سيناء، وأشرف عليهم من سعير، وتألق في جبل فاران؛ جاء محاطا بعشرات الألوف من الملائكة وعن يمينه يومض برق عليهم."]]}, {"l": "Act 7:53", "n": "", "vs": [[53, "فأنتم أخذتم الشريعة من أيدي الملائكة، ولكنكم لم تطيعوها!»"]]}, {"l": "Heb 2:2", "n": "", "vs": [[2, "فإننا نعلم أن كل كلمة نقلتها الملائكة، قد تبين أنها ثابتة، وقد نال كل متعد أو مخالف لها عقابا عادلا."]]}, {"l": "Heb 2:5", "n": "", "vs": [[5, "ثم إن «العالم الآتي» الذي نتحدث عنه كثيرا، لن يكون خاضعا لسيطرة الملائكة."]]}], "kwAr": "رتبت بملائكة", "noteAr": ""}, {"kw": "in", "raw": "Exo_20:19-22, Exo_24:1-12, Exo_34:27-35; Lev_15:32; Deu_5:5, Deu_5:22-33; Deu_9:13-20,Deu_9:25-29, Deu_18:15-19; Psa_106:23; Joh_1:17; Act_7:38; The Apostle, having just before been speaking of the promise made to Abraham, and representing that as the rule of our justification, and not the law, lest they should think he derogated too much from the law, and thereby rendered it useless - he thence takes occasion to discourse of the design and tendency of it, and to acquaint us for what purposes it was given.", "note": "Exo_20:19-22, Exo_24:1-12, Exo_34:27-35; Lev_15:32; Deu_5:5, Deu_5:22-33; Deu_9:13-20,Deu_9:25-29, Deu_18:15-19; Psa_106:23; Joh_1:17; Act_7:38; The Apostle, having just before been speaking of the promise made to Abraham, and representing that as the rule of our justification, and not the law, lest they should think he derogated too much from the law, and thereby rendered it useless - he thence takes occasion to discourse of the design and tendency of it, and to acquaint us for what purposes it was given.", "refs": [{"l": "Exo 20:19-22", "n": "", "vs": [[19, "وقالوا لموسى: «كلمنا أنت بنفسك فنسمع، لئلا نموت إذا ظل الله يخاطبنا»."], [20, "فأجاب موسى: «لا تخافوا. إنما الرب قد جاء ليمتحنكم حتى تظل مخافة الرب تلازمكم فلا تخطئوا»."], [21, "وبينما كان الشعب واقفا من بعيد، اقترب موسى من الظلام المتكاثف حيث كان الله ."], [22, "فقال الرب لموسى: «تقول لبني إسرائيل: أنتم رأيتم بأنفسكم كيف كلمتكم من السماء."]]}, {"l": "Exo 24:1-12", "n": "", "vs": [[1, "ثم قال الرب لموسى: «اصعد إلي أنت وهرون وناداب وأبيهو، وسبعون من شيوخ إسرائيل وليسجد هؤلاء من بعيد."], [2, "لا يقترب إلي أحد سواك، أما الآخرون فيمكثون بعيدين. وحذار أن يصعد الشعب معك»."], [3, "فجاء موسى وبلغ الشعب بكل كلام الرب وأحكامه، فأجاب الشعب بصوت واحد: «كل ما أمرنا به الرب نفعل»."], [4, "فكتب موسى جميع أقوال الرب، ثم بكر في الصباح وشيد مذبحا على سفح الجبل، ونصب اثني عشر عمودا على عدد أسباط بني إسرائيل الاثني عشر."], [5, "وأرسل بعض شبان بني إسرائيل فقدموا محرقات وقربوا ذبائح سلامة للرب من العجول،"], [6, "وأخذ موسى نصف الدم واحتفظ به في طسوس ورش النصف الباقي على المذبح."], [7, "وتناول كتاب العهد وتلاه على مسامع الشعب، فقالوا: «كل ما أمر به الرب نفعله ونطيعه»."], [8, "ثم أخذ موسى الدم الذي في الطسوس ورشه على الشعب قائلا: «هوذا دم العهد الذي قطعه الرب معكم بناء على جميع هذه الأقوال»."], [9, "ثم صعد موسى وهرون وناداب وأبيهو وسبعون من شيوخ إسرائيل،"], [10, "ورأوا إله إسرائيل، وتحت قدميه أرضية كأنها مصنوعة من الياقوت الأزرق الشفاف تماثل السماء في النقاء،"], [11, "ولكن الله لم يمد يده ليهلك أشراف بني إسرائيل. فرأوا الله وأكلوا وشربوا."], [12, "وقال الرب لموسى: «اصعد إلى الجبل وامكث هناك لأعطيك الوصايا والشرائع التي كتبتها على لوحي الحجر لتلقنها لهم»."]]}, {"l": "Exo 34:27-35", "n": "", "vs": [[27, "واستطرد الرب: «دون هذه الكلمات، لأنني طبقا لنصها أبرمت معك ومع إسرائيل ميثاقا»."], [28, "ومكث موسى في حضرة الرب أربعين يوما وأربعين ليلة، لم يأكل فيها خبزا، ولم يشرب ماء. فدون على اللوحين كلمات العهد، أي الوصايا العشر."], [29, "وعندما انحدر من جبل سيناء حاملا بيديه لوحي الشهادة، لم يكن يدري أن وجهه كان يلمع لأنه كان يتحدث مع الله."], [30, "وحين شاهد هرون وبنو إسرائيل موسى، كان وجهه لامعا، فخافوا أن يقتربوا منه،"], [31, "فدعاهم موسى فرجع إليه هرون ورؤساء الشعب فخاطبهم."], [32, "وما لبث أن اقترب منه جميع بني إسرائيل، فتلا عليهم كل الوصايا التي أملاها الرب في جبل سيناء."], [33, "وعندما أنهى موسى حديثه معهم، وضع على وجهه برقعا،"], [34, "كان يخلعه عند مثوله أمام الرب ليتحادث معه إلى أن ينصرف من لدنه، ثم يخرج ليخاطب بني إسرائيل بما أوصاه."], [35, "فإذا عاين بنو إسرائيل لمعانا في جلد وجه موسى، كان يرد البرقع إلى حين دخوله إلى الخيمة للتحدث مع الرب فيرفعه."]]}, {"l": "Lev 15:32", "n": "", "vs": [[32, "هذه هي نصوص التعليمات بشأن المصاب بالسيلان، أو من يفرز سائله المنوي فيتنجس به،"]]}, {"l": "Deu 5:5", "n": "", "vs": [[5, "وكنت أنا واقفا بين الرب وبينكم، لأنكم خفتم من النار، فلم تصعدوا إلى الجبل. فقال الرب:"]]}, {"l": "Deu 5:22-33", "n": "", "vs": [[22, "إن الرب قد أعلن بصوت عظيم هذه الكلمات لكل جماعتكم في الجبل من وسط النار والسحاب ولم يزد. ونقشها على لوحين من حجر وأعطاني إياها."], [23, "فلما سمعتم الصوت من وسط الظلام، والجبل يشتعل بالنار، أقبل علي جميع قادة أسباطكم وشيوخكم،"], [24, "وقالوا: قد أظهر الرب لنا مجده وعظمته، وسمعنا صوته من وسط النار، ورأينا في هذا اليوم أن الله يخاطب الإنسان فلا يموت."], [25, "ولكن الآن، إن عدنا نسمع صوت الرب إلهنا فإن هذه النار العظيمة تلتهمنا. فلماذا نموت؟"], [26, "إذ أي بشري سمع صوت الله الحي يتكلم من وسط النار مثلنا وعاش؟"], [27, "فتقدم أنت واستمع كل ما ينطق به الرب إلهنا، وخاطبنا بجميع ما يكلمك به، فنستمع ونطيع."], [28, "فسمع الرب حديثكم حين كلمتموني، وقال لي: لقد سمعت حديث الشعب الذي كلموك به. وقد أحسنوا في كل ما قالوه."], [29, "ياليت قلبهم يظل متعلقا بي حتى يتقوني ويطيعوا جميع وصاياي دائما، لكي يتمتعوا هم وأولادهم بالخير إلى الأبد."], [30, "اذهب وقل لهم: ارجعوا إلى خيامكم."], [31, "وأما أنت فامثل هنا أمامي، فأكلمك بجميع الوصايا والشرائع والأحكام لتعلمها لهم فيعملوا بها في الأرض التي وهبتها لهم ليمتلكوها."], [32, "فاحرصوا على العمل بكل ما أمركم به الرب إلهكم، لا تحيدوا يمينا أو شمالا."], [33, "واسلكوا في كل الطريق التي أوصاكم بها الرب لتحيوا وتزدهروا وتمكثوا طويلا في الأرض التي ترثونها."]]}, {"l": "Deu 9:13-20", "n": "", "vs": [[13, "ثم قال لي: قد تأملت هذا الشعب وإذ به شعب متصلب القلب."], [14, "دعني أستأصلهم وأمحو اسمهم من تحت السماء، وأقيم منك شعبا أعظم وأكثر منهم."], [15, "فانصرفت، وانحدرت من الجبل وهو ما برح يشتعل بالنار، ولوحا العهد في يدي."], [16, "وتطلعت وإذا بكم قد أخطأتم إلى الرب، وصغتم لأنفسكم عجلا مسبوكا، وضللتم سريعا عن السبيل الذي أوصاكم به الرب."], [17, "فأخذت اللوحين وألقيتهما من يدي وحطمتهما أمام أعينكم."], [18, "ثم انطرحت بذل أمام الرب أربعين نهارا وأربعين ليلة، كما في السابق، لا آكل خبزا ولا أشرب ماء، من جراء كل خطاياكم التي ارتكبتموها في عيني الرب لتغيظوه،"], [19, "لأنني جزعت من غضب الرب واحتدام سخطه عليكم، حتى أوشك أن يبيدكم. فاستجاب لي الرب أيضا في تلك المرة."], [20, "كما غضب الرب على هرون أيضا حتى كاد أن يهلكه، فصليت من أجله حينئذ، فقبل الرب تضرعي."]]}, {"l": "Deu 9:25-29", "n": "", "vs": [[25, "فسقطت أمام الرب أربعين نهارا وأربعين ليلة، لأن الرب أعلن أنه عازم أن يقضي عليكم."], [26, "وابتهلت إلى الرب قائلا: ياسيد الرب، لا تهلك شعبك وميراثك الذي افتديته بقوتك العظيمة، وأخرجته من مصر بقدرة فائقة."], [27, "اذكر عبيدك إبراهيم وإسحق ويعقوب، وتغاض عن عناد هذا الشعب وإثمه وخطيئته،"], [28, "لئلا يقول أهل مصر الذين أخرجتنا من بينهم: لقد أخرجهم الرب ليهلكهم في البرية، لأنه عجز عن إدخالهم إلى الأرض التي وعدهم بها، ولأنه مقتهم."], [29, "إنهم شعبك وميراثك الذي أخرجته بقوتك العظيمة وقدرتك الفائقة."]]}, {"l": "Deu 18:15-19", "n": "", "vs": [[15, "سيقيم الرب فيكم نبيا مثلي من بني إسرائيل، له تسمعون،"], [16, "فقد استجاب الرب إلهكم ما طلبتم منه في حوريب في يوم الاجتماع عندما قلتم: لا نعود نسمع صوت الرب إلهنا، ولا نرى النار العظيمة أيضا لئلا نموت"], [17, "فقال لي الرب: لقد أصابوا في ما تكلموا."], [18, "لهذا أقيم لهم نبيا من بين إخوتهم مثلك، وأضع كلامي في فمه، فيخاطبهم بكل ما آمره به."], [19, "فيكون أن كل من يعصى كلامي الذي يتكلم به باسمي، فأنا أحاسبه."]]}, {"l": "Psa 106:23", "n": "", "vs": [[23, "فأوشك أن يبيدهم كقوله، لولا أن موسى مختاره وقف في الثغرة أمامه يشفع فيهم ليرد غضبه فلا يهلكهم."]]}, {"l": "Joh 1:17", "n": "", "vs": [[17, "لأن الشريعة أعطيت على يد موسى، أما النعمة والحق فقد تواجدا بيسوع المسيح."]]}, {"l": "Act 7:38", "n": "", "vs": [[38, "وهو الذي كان يقود جماعة الشعب في الصحراء، وقد قام بدور الوسيط بين الملاك الذي كلمه على جبل سيناء وآبائنا، فنقل إليكم وصايا الله الحية."]]}], "kwAr": "على يد وسيط", "noteAr": "كان الرسول قد تكلّم للتوّ عن الوعد المعطى لإبراهيم وجعله قاعدة تبريرنا لا الشريعة؛ ولئلا يظنوا أنه ينتقص من الشريعة كثيرًا فيجعلها بلا فائدة، اغتنم الفرصة ليتحدّث عن غايتها ومقصدها، ويعرّفنا لأي أغراض أُعطيت. انظر خر 20: 19-22؛ تث 5: 5؛ يو 1: 17؛ أع 7: 38."}], "arS": [["فلماذا", ["G5101"]], [" ", []], ["الشريعة", ["G3551"]], [" إذن؟ إنها فقط ", []], ["أضيفت", ["G4369"]], [" ", []], ["إظهارا", ["G5484"]], [" ", []], ["للمعاصي", ["G3847"]], ["، إلى أن ", []], ["يجيء", ["G2064"]], [" «", []], ["النسل", ["G4690"]], ["» الذي ", []], ["قطع له الوعد", ["G1861"]], ["، وقد ", []], ["رتبت", ["G1299"]], [" ", []], ["بملائكة", ["G32"]], [" وعلى ", []], ["يد", ["G5495"]], [" ", []], ["وسيط", ["G3316"]], [".", []]]}, {"c": 3, "v": 20, "text": "ولكن، عندما يصدر الوعد من جانب واحد، فلا لزوم لوسيط. والواعد هنا هو الله وحده.", "groups": [{"kw": "a mediator is", "raw": "Job_9:33; Act_12:20; 1Ti_2:5", "note": "", "refs": [{"l": "Job 9:33", "n": "", "vs": [[33, "وليس من حكم بيننا يضع يده على كلينا."]]}, {"l": "Act 12:20", "n": "", "vs": [[20, "وكان ناقما على أهل صور وصيدا. فاتفقوا وأرسلوا وفدا منهم يستعطفون بلاستس حاجب الملك طالبين الأمان، لأن منطقتهم كانت تكسب رزقها من مملكة هيرودس."]]}, {"l": "1Ti 2:5", "n": "", "vs": [[5, "فإن الله واحد، والوسيط بين الله والناس واحد، وهو الإنسان المسيح يسوع،"]]}], "kwAr": "فلا لزوم لوسيط", "noteAr": ""}, {"kw": "but", "raw": "Gal_3:17; Gen_15:18, Gen_17:1, Gen_17:2; Deu_6:4; Rom_3:29", "note": "", "refs": [{"l": "Gal 3:17", "n": "", "vs": [[17, "فما أقوله هو هذا: إن عهدا سبق أن أقره الله لا تنقضه الشريعة التي جاءت بعده بأربع مئة وثلاثين سنة، وكأنها تلغي الوعد."]]}, {"l": "Gen 15:18", "n": "", "vs": [[18, "في ذلك اليوم عقد الله ميثاقا مع أبرام قائلا: «سأعطي نسلك هذه الأرض من وادي العريش إلى النهر الكبير، نهر الفرات."]]}, {"l": "Gen 17:1", "n": "", "vs": [[1, "وعندما كان أبرام في التاسعة والتسعين من عمره، ظهر له الرب قائلا: «أنا هو الله القدير. سر أمامي وكن كاملا،"]]}, {"l": "Gen 17:2", "n": "", "vs": [[2, "فأجعل عهدي بيني وبينك وأكثر نسلك جدا»."]]}, {"l": "Deu 6:4", "n": "", "vs": [[4, "اسمعوا يابني إسرائيل: الرب إلهنا رب واحد،"]]}, {"l": "Rom 3:29", "n": "", "vs": [[29, "أو يكون الله إله اليهود وحدهم؟ أما هو إله الأمم أيضا؟ بلى، إنه إله الأمم أيضا،"]]}], "kwAr": "والواعد هنا هو الله وحده", "noteAr": ""}], "arS": [["ولكن، عندما يصدر الوعد من جانب ", []], ["واحد", ["G1520"]], ["، فلا لزوم ", []], ["لوسيط", ["G3316"]], [". والواعد هنا هو ", []], ["الله", ["G2316"]], [" وحده.", []]]}, {"c": 3, "v": 21, "text": "فهل تناقض الشريعة وعود الله؟ حاشا! فلو أعطيت شريعة قادرة أن تحيي، لكان البر بالحقيقة على مبدأ الشريعة.", "groups": [{"kw": "the law", "raw": "Mat_5:17-20; Rom_3:31, Rom_7:7-13", "note": "", "refs": [{"l": "Mat 5:17-20", "n": "", "vs": [[17, "لا تظنوا أني جئت لألغي الشريعة أو الأنبياء. ما جئت لألغي، بل لأكمل."], [18, "فالحق أقول لكم: إلى أن تزول الأرض والسماء، لن يزول حرف واحد أو نقطة واحدة من الشريعة، حتى يتم كل شيء."], [19, "فأي من خالف واحدة من هذه الوصايا الصغرى، وعلم الناس أن يفعلوا فعله، يدعى الأصغر في ملكوت السماوات. وأما من عمل بها وعلمها، فيدعى عظيما في ملكوت السماوات."], [20, "فإني أقول لكم: إن لم يزد بركم على بر الكتبة والفريسيين، لن تدخلوا ملكوت السماوات أبدا."]]}, {"l": "Rom 3:31", "n": "", "vs": [[31, "إذن، هل نحن نبطل الشريعة بالإيمان؟ حاشا، بل إننا به نثبت الشريعة."]]}, {"l": "Rom 7:7-13", "n": "", "vs": [[7, "إذن، ماذا نقول؟ هل الشريعة خطيئة؟ حاشا! ولكني ما عرفت الخطيئة إلا بالشريعة. فما كنت لأعرف الشهوة لولا قول الشريعة: «لا تشته!»"], [8, "ولكن الخطيئة استغلت هذه الوصية فأثارت في كل شهوة. فإن الخطيئة، لولا الشريعة، ميتة."], [9, "أما أنا فكنت من قبل عائشا بمعزل عن الشريعة؛ ولكن لما جاءت الشريعة عاشت الخطيئة،"], [10, "فمت أنا. والوصية الهادفة إلى الحياة، صارت لي مؤدية إلى الموت."], [11, "فإن الخطيئة، إذ استغلت الوصية، خدعتني وقتلتني بها."], [12, "فالشريعة إذن مقدسة، والوصية مقدسة وعادلة وصالحة."], [13, "فهل صار ما هو صالح موتا لي؟ حاشا! ولكن الخطيئة، لكي تظهر أنها خطيئة، أنتجت لي الموت بما هو صالح، حتى تصير الخطيئة خاطئة جدا بسبب الوصية."]]}], "kwAr": "فهل تناقض الشريعة وعود الله", "noteAr": ""}, {"kw": "God forbid", "raw": "Gal_2:17; Rom_3:4, Rom_3:6", "note": "", "refs": [{"l": "Gal 2:17", "n": "", "vs": [[17, "ولكن، إن كنا ونحن نسعى أن نتبرر في المسيح، قد وجدنا خاطئين أيضا، فهل يكون المسيح خادما للخطيئة؟ حاشا!"]]}, {"l": "Rom 3:4", "n": "", "vs": [[4, "حاشا! وإنما، ليكن الله صادقا وكل إنسان كاذبا، كما قد كتب: «لكي تتبرر في كلامك، وتظفر متى حكمت»."]]}, {"l": "Rom 3:6", "n": "", "vs": [[6, "حاشا! وإلا، فكيف يدين الله العالم؟"]]}], "kwAr": "حاشا", "noteAr": ""}, {"kw": "for", "raw": "Gal_2:19, Gal_2:21; Rom_3:20", "note": "", "refs": [{"l": "Gal 2:19", "n": "", "vs": [[19, "فإنني، بالشريعة، قد مت عن الشريعة، لكي أحيا لله."]]}, {"l": "Gal 2:21", "n": "", "vs": [[21, "إني لا أبطل فاعلية نعمة الله، إذ لو كان البر بالشريعة، لكان موت المسيح عملا لا داعي له."]]}, {"l": "Rom 3:20", "n": "", "vs": [[20, "فإن أحدا من البشر لا يتبرر أمامه بالأعمال المطلوبة في الشريعة. إذ إن الشريعة هي لإظهار الخطيئة."]]}], "kwAr": "فلو أعطيت شريعة قادرة أن تحيي", "noteAr": ""}, {"kw": "righteousness", "raw": "Rom_3:21, Rom_3:22, Rom_9:31, Rom_10:3-6; Phi_3:6-9; Heb_11:7", "note": "", "refs": [{"l": "Rom 3:21", "n": "", "vs": [[21, "أما الآن، فقد أعلن البر الذي يمنحه الله ، مستقلا عن الشريعة، ومشهودا له من الشريعة والأنبياء،"]]}, {"l": "Rom 3:22", "n": "", "vs": [[22, "ذلك البر الذي يمنحه الله على أساس الإيمان بيسوع المسيح لجميع الذين يؤمنون. إذ لا فرق،"]]}, {"l": "Rom 9:31", "n": "", "vs": [[31, "أما إسرائيل، وقد كانوا يسعون وراء شريعة تهدف إلى البر، فقد فشلوا حتى في بلوغ الشريعة."]]}, {"l": "Rom 10:3-6", "n": "", "vs": [[3, "فبما أنهم جهلوا بر الله وسعوا إلى إثبات برهم الذاتي، لم يخضعوا للبر الإلهي."], [4, "فإن غاية الشريعة هي المسيح لتبرير كل من يؤمن."], [5, "فقد كتب موسى عن البر الآتي من الشريعة: «إن الإنسان الذي يعمل بهذه الأمور، يحيا بها»."], [6, "غير أن البر الآتي من الإيمان يقول هذا: «لا تقل في قلبك: من يصعد إلى السماوات؟» أي لينزل المسيح،"]]}, {"l": "Phi 3:6-9", "n": "", "vs": [[6, "ومن جهة الحماسة، مضطهد للكنيسة؛ ومن جهة البر المطلوب في الشريعة، كنت بلا لوم."], [7, "ولكن، ما كان لي من ربح، فقد اعتبرته خسارة، من أجل المسيح."], [8, "بل إني أعتبر كل شيء خسارة، من أجل امتياز معرفة المسيح يسوع ربي؛ فمن أجله تحملت خسارة كل شيء، وأعتبر كل شيء نفاية، لكي أربح المسيح"], [9, "ويكون لي فيه مقام، إذ ليس لي بري الذاتي القائم على أساس الشريعة، بل البر الآتي من الإيمان بالمسيح، البر الذي من عند الله على أساس الإيمان."]]}, {"l": "Heb 11:7", "n": "", "vs": [[7, "وبالإيمان نوح، لما أنذره الله عن طريق الوحي بالطوفان الآتي، دفعه خوف الله إلى بناء سفينة ضخمة كانت وسيلة النجاة له ولعائلته، مع أنه لم يكن قد رأى طوفانا من قبل. وبعمله هذا، حكم على العالم وأصبح وارثا للبر القائم على أساس الإيمان."]]}], "kwAr": "لكان البر", "noteAr": ""}], "arS": [["فهل تناقض ", []], ["الشريعة", ["G3551"]], [" ", []], ["وعود", ["G1860"]], [" ", []], ["الله", ["G2316"]], ["؟ ", []], ["حاشا", ["G1096", "G3361"]], ["! فلو ", []], ["أعطيت", ["G1325"]], [" ", []], ["شريعة", ["G3551"]], [" ", []], ["قادرة", ["G1410"]], [" أن ", []], ["تحيي", ["G2227"]], ["، لكان ", []], ["البر", ["G1343"]], [" ", []], ["بالحقيقة", ["G3689"]], [" على مبدأ ", []], ["الشريعة", ["G3551"]], [".", []]]}, {"c": 3, "v": 22, "text": "ولكن الكتاب حبس الجميع تحت الخطيئة، حتى إن الوعد، على أساس الإيمان بيسوع المسيح، يوهب للذين يؤمنون.", "groups": [{"kw": "concluded", "raw": "Gal_3:8-10,Gal_3:23; Psa_143:2; Rom_3:9-20,Rom_3:23, Rom_5:12, Rom_5:20, Rom_11:32", "note": "", "refs": [{"l": "Gal 3:8-10", "n": "", "vs": [[8, "ثم إن الكتاب، إذ سبق فرأى أن الله سوف يبرر الأمم على أساس الإيمان، بشر إبراهيم سلفا بقوله: «فيك تتبارك جميع الأمم!»"], [9, "إذن الذين هم على مبدأ الإيمان يباركون مع إبراهيم المؤمن."], [10, "أما جميع الذين على مبدأ أعمال الشريعة، فإنهم تحت اللعنة، لأنه قد كتب: «ملعون كل من لا يثبت على العمل بكل ما هو مكتوب في كتاب الشريعة!»"]]}, {"l": "Gal 3:23", "n": "", "vs": [[23, "فقبل مجيء الإيمان، كنا تحت حراسة الشريعة، محتجزين إلى أن يعلن الإيمان الذي كان إعلانه منتظرا."]]}, {"l": "Psa 143:2", "n": "", "vs": [[2, "لا تحاكم عبدك، فلن يتبرر أمامك إنسان."]]}, {"l": "Rom 3:9-20", "n": "", "vs": [[9, "فماذا إذن؟ أنحن اليهود أفضل؟ لا، على الإطلاق! فإننا، في ما سبق، قد اتهمنا اليهود واليونانيين بكونهم جميعا تحت الخطيئة،"], [10, "كما قد كتب:"], [11, "ليس من يبحث عن الله."], [12, "جميع الناس قد ضلوا، وصاروا كلهم بلا نفع. ليس من يمارس الصلاح، لا ولا واحد."], [13, "حناجرهم قبور مفتوحة؛ ألسنتهم أدوات للمكر؛ شفاههم تخفي سم الأفاعي القاتلة؛"], [14, "أفواههم مملوءة لعنة ومرارة،"], [15, "أقدامهم سريعة إلى سفك الدماء؛"], [16, "في طرقهم الخراب والشقاء؛"], [17, "أما طريق السلام فلم يعرفوه؛"], [18, "ومخافة الله ليست نصب عيونهم»."], [19, "ونحن نعلم أن كل ما تقوله الشريعة إنما تخاطب به الذين هم تحت الشريعة، لكي يسد كل فم ويقع العالم كله تحت دينونة من الله."], [20, "فإن أحدا من البشر لا يتبرر أمامه بالأعمال المطلوبة في الشريعة. إذ إن الشريعة هي لإظهار الخطيئة."]]}, {"l": "Rom 3:23", "n": "", "vs": [[23, "لأن الجميع قد أخطأوا وهم عاجزون عن بلوغ ما يمجد الله ."]]}, {"l": "Rom 5:12", "n": "", "vs": [[12, "ولهذا، فكما دخلت الخطيئة إلى العالم على يد إنسان واحد، وبدخول الخطيئة دخل الموت، هكذا جاز الموت على جميع البشر، لأنهم جميعا أخطأوا."]]}, {"l": "Rom 5:20", "n": "", "vs": [[20, "وأما الشريعة فقد أدخلت لتظهر كثرة المعصية. ولكن، حيث كثرت الخطيئة، تتوافر النعمة أكثر جدا،"]]}, {"l": "Rom 11:32", "n": "", "vs": [[32, "فإن الله حبس الجميع معا في عدم الطاعة لكي يرحمهم جميعا."]]}], "kwAr": "حبس الجميع تحت الخطيئة", "noteAr": ""}, {"kw": "that", "raw": "Gal_3:14, Gal_3:17, Gal_3:29; Rom_4:11-16, Rom_5:20,Rom_5:21; 2Ti_1:1; Heb_6:13-17, Heb_9:15; 2Pe_1:4; 2Pe_3:13; 1Jo_2:25, 1Jo_5:11-13", "note": "", "refs": [{"l": "Gal 3:14", "n": "", "vs": [[14, "لكي تصل بركة إبراهيم إلى الأمم في المسيح يسوع، فننال عن طريق الإيمان الروح الموعود."]]}, {"l": "Gal 3:17", "n": "", "vs": [[17, "فما أقوله هو هذا: إن عهدا سبق أن أقره الله لا تنقضه الشريعة التي جاءت بعده بأربع مئة وثلاثين سنة، وكأنها تلغي الوعد."]]}, {"l": "Gal 3:29", "n": "", "vs": [[29, "فإذا كنتم للمسيح، فأنتم إذن نسل إبراهيم وحسب الوعد وارثون."]]}, {"l": "Rom 4:11-16", "n": "", "vs": [[11, "ثم تلقى إبراهيم علامة الختان ختما للبر الحاصل بالإيمان الذي كان له وهو مازال غير مختون، لكي يكون أبا لجميع الذين يؤمنون من غير المختونين فيحسب البر لهم أيضا،"], [12, "وأبا للمختونين الذين ليسوا من أهل الختان وحسب بل الذين يسيرون في خطى الإيمان الذي كان لأبينا إبراهيم وهو بعد غير مختون."], [13, "فليس على أساس الشريعة كان الوعد لإبراهيم، أو لنسله، بأن يكون وارثا للعالم، وإنما على أساس البر الذي بالإيمان."], [14, "فلو كان أهل الشريعة هم أصحاب الإرث، لصار الإيمان بلا فاعلية ونقض الوعد."], [15, "لأن الشريعة إنما تنتج الغضب؛ فلولا الشريعة لما ظهرت المخالفة."], [16, "لذلك، فإن الوعد هو على أساس الإيمان ليكون بحسب النعمة، بقصد أن يكون مضمونا للنسل كله: ليس لأهل الشريعة وحدهم، بل أيضا لأهل الإيمان الذي كان لإبراهيم. فإنه أب لنا جميعا،"]]}, {"l": "Rom 5:20", "n": "", "vs": [[20, "وأما الشريعة فقد أدخلت لتظهر كثرة المعصية. ولكن، حيث كثرت الخطيئة، تتوافر النعمة أكثر جدا،"]]}, {"l": "Rom 5:21", "n": "", "vs": [[21, "حتى إنه كما ملكت الخطيئة بالموت، فكذلك أيضا تملك النعمة على أساس البر مؤدية إلى الحياة الأبدية بيسوع المسيح ربنا."]]}, {"l": "2Ti 1:1", "n": "", "vs": [[1, "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"]]}, {"l": "Heb 6:13-17", "n": "", "vs": [[13, "لنأخذ وعد الله لإبراهيم مثلا. فلما قطع له ذلك الوعد، أقسم بنفسه، إذ ليس هنالك من هو أعظم منه حتى يقسم به."], [14, "وقد قال له: «لأباركنك وأعطينك نسلا كثيرا!»"], [15, "وهكذا، انتظر إبراهيم بصبر فنال ما وعد به."], [16, "فالواقع أن الناس يقسمون بالأعظم. والقسم عندهم، يضع حدا لكل مشاجرة لأنه يحسم الأمور."], [17, "ولذلك، لما أراد الله أن يؤكد بصورة قاطعة لوارثي وعده، أن قراره لا يتغير أبدا، ثبته بالقسم."]]}, {"l": "Heb 9:15", "n": "", "vs": [[15, "ولذلك، فالمسيح هو الوسيط لهذا العهد الجديد. فبما أنه قد تم الموت فداء للمخالفات الحاصلة تحت العهد الأول، ينال المدعوون الوعد بالإرث الأبدي."]]}, {"l": "2Pe 1:4", "n": "", "vs": [[4, "اللذين بهما أعطانا الله بركاته العظمى الثمينة التي كان قد وعد بها. وبهذا صار بإمكانكم أن تتخلصوا من الفساد الذي تنشره الشهوة في العالم، وتشتركوا في الطبيعة الإلهية."]]}, {"l": "2Pe 3:13", "n": "", "vs": [[13, "إلا أننا، وفقا لوعد الرب، ننتظر سماوات جديدة وأرضا جديدة، حيث يسكن البر."]]}, {"l": "1Jo 2:25", "n": "", "vs": [[25, "فإن الله نفسه قد وعدنا بالحياة الأبدية."]]}, {"l": "1Jo 5:11-13", "n": "", "vs": [[11, "وهذه الشهادة هي أن الله أعطانا حياة أبدية، وأن هذه الحياة هي في ابنه."], [12, "فمن كان له ابن الله كانت له الحياة. ومن لم يكن له ابن الله، لم تكن له الحياة!"], [13, "يامن آمنتم باسم ابن الله، إني كتبت هذا إليكم لكي تعرفوا أن الحياة الأبدية ملك لكم منذ الآن."]]}], "kwAr": "حتى إن الوعد", "noteAr": ""}, {"kw": "to", "raw": "Mar_16:16; Joh_3:15-18, Joh_3:36, Joh_5:24, Joh_6:40, Joh_11:25, Joh_11:26, Joh_12:46, Joh_20:31; Act_16:31; Rom_10:9; 1Jo_3:23, 1Jo_3:24, 1Jo_5:13", "note": "", "refs": [{"l": "Mar 16:16", "n": "", "vs": [[16, "من آمن وتعمد، خلص، ومن لم يؤمن فسوف يدان."]]}, {"l": "Joh 3:15-18", "n": "", "vs": [[15, "لتكون الحياة الأبدية لكل من يؤمن به."], [16, "لأنه هكذا أحب الله العالم حتى بذل ابنه الوحيد، لكي لا يهلك كل من يؤمن به، بل تكون له الحياة الأبدية."], [17, "فإن الله لم يرسل ابنه إلى العالم ليدين العالم، بل ليخلص العالم به،"], [18, "فالذي يؤمن به لا يدان، أما الذي لا يؤمن به فقد صدر عليه حكم الدينونة، لأنه لم يؤمن باسم ابن الله الوحيد."]]}, {"l": "Joh 3:36", "n": "", "vs": [[36, "من يؤمن بالابن، فله الحياة الأبدية. ومن يرفض أن يؤمن بالابن، فلن يرى الحياة. بل يستقر عليه غضب الله»."]]}, {"l": "Joh 5:24", "n": "", "vs": [[24, "الحق الحق أقول لكم إن من يسمع كلامي ويؤمن بالذي أرسلني تكون له الحياة الأبدية، ولا يحاكم في اليوم الأخير، لأنه قد انتقل من الموت إلى الحياة."]]}, {"l": "Joh 6:40", "n": "", "vs": [[40, "نعم! إن مشيئة أبي هي أن كل من يرى الابن ويؤمن به تكون له الحياة الأبدية، وسأقيمه أنا في اليوم الأخير»."]]}, {"l": "Joh 11:25", "n": "", "vs": [[25, "فرد يسوع: «أنا هو القيامة والحياة. من آمن بي، وإن مات فسيحيا."]]}, {"l": "Joh 11:26", "n": "", "vs": [[26, "ومن كان حيا وآمن بي فلن يموت إلى الأبد. أتؤمنين بهذا؟»"]]}, {"l": "Joh 12:46", "n": "", "vs": [[46, "جئت إلى العالم نورا، فمن آمن بي لا يبقى في الظلام."]]}, {"l": "Joh 20:31", "n": "", "vs": [[31, "وأما هذه الآيات فقد دونت لتؤمنوا بأن يسوع هو المسيح ابن الله، ولكي تكون لكم حياة باسمه إذ تؤمنون."]]}, {"l": "Act 16:31", "n": "", "vs": [[31, "فأجاباه: «آمن بالرب يسوع فتخلص أنت وأهل بيتك!»"]]}, {"l": "Rom 10:9", "n": "", "vs": [[9, "أنك إن اعترفت بفمك بيسوع ربا، وآمنت في قلبك بأن الله أقامه من الأموات، نلت الخلاص."]]}, {"l": "1Jo 3:23", "n": "", "vs": [[23, "وأما وصيته فهي أن نؤمن باسم ابنه يسوع المسيح، وأن يحب بعضنا بعضا كما أوصانا."]]}, {"l": "1Jo 3:24", "n": "", "vs": [[24, "وكل من يطيع وصايا الله، فإنه يثبت في الله، والله يثبت فيه. والذي يؤكد لنا أن الله يثبت فينا، هو الروح القدس الذي وهبه لنا."]]}, {"l": "1Jo 5:13", "n": "", "vs": [[13, "يامن آمنتم باسم ابن الله، إني كتبت هذا إليكم لكي تعرفوا أن الحياة الأبدية ملك لكم منذ الآن."]]}], "kwAr": "يوهب للذين يؤمنون", "noteAr": ""}], "arS": [["ولكن ", []], ["الكتاب", ["G1124"]], [" ", []], ["حبس", ["G4788"]], [" ", []], ["الجميع", ["G3956"]], [" ", []], ["تحت", ["G5259"]], [" ", []], ["الخطيئة", ["G266"]], ["، حتى إن ", []], ["الوعد", ["G1860"]], ["، على أساس ", []], ["الإيمان", ["G4102"]], [" ", []], ["بيسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], ["، ", []], ["يوهب", ["G1325"]], [" للذين ", []], ["يؤمنون", ["G4100"]], [".", []]]}, {"c": 3, "v": 23, "text": "فقبل مجيء الإيمان، كنا تحت حراسة الشريعة، محتجزين إلى أن يعلن الإيمان الذي كان إعلانه منتظرا.", "groups": [{"kw": "faith came", "raw": "Gal_3:19, Gal_3:24, Gal_3:25, Gal_4:1-4; Heb_12:2", "note": "", "refs": [{"l": "Gal 3:19", "n": "", "vs": [[19, "فلماذا الشريعة إذن؟ إنها فقط أضيفت إظهارا للمعاصي، إلى أن يجيء «النسل» الذي قطع له الوعد، وقد رتبت بملائكة وعلى يد وسيط."]]}, {"l": "Gal 3:24", "n": "", "vs": [[24, "إذن، كانت الشريعة هي مؤدبنا حتى مجيء المسيح، لكي نبرر على أساس الإيمان."]]}, {"l": "Gal 3:25", "n": "", "vs": [[25, "ولكن بعدما جاء الإيمان، تحررنا من سلطة المؤدب."]]}, {"l": "Gal 4:1-4", "n": "", "vs": [[1, "أقول أيضا مادام الوريث قاصرا، فليس بينه وبين العبد أي فرق، مع أنه صاحب الإرث كله،"], [2, "بل يبقى خاضعا للأوصياء والوكلاء إلى أن تنقضي الفترة التي حددها أبوه."], [3, "وهذه حالنا نحن أيضا: فإذ كنا قاصرين، كنا في حالة العبودية لمبادىء العالم."], [4, "ولكن لما جاء تمام الزمان، أرسل الله ابنه، وقد ولد من امرأة وكان خاضعا للشريعة،"]]}, {"l": "Heb 12:2", "n": "", "vs": [[2, "متطلعين دائما إلى يسوع: رائد إيماننا ومكمله. فهو قد تحمل الموت صلبا، هازئا بما في ذلك من عار، إذ كان ينظر إلى السرور الذي ينتظره، ثم جلس عن يمين عرش الله."]]}], "kwAr": "فقبل مجيء الإيمان", "noteAr": ""}, {"kw": "under", "raw": "Gal_4:4, Gal_4:5, Gal_4:21, Gal_5:18; Rom_3:19, Rom_6:14, Rom_6:15; 1Co_9:20,1Co_9:21", "note": "", "refs": [{"l": "Gal 4:4", "n": "", "vs": [[4, "ولكن لما جاء تمام الزمان، أرسل الله ابنه، وقد ولد من امرأة وكان خاضعا للشريعة،"]]}, {"l": "Gal 4:5", "n": "", "vs": [[5, "ليحرر بالفداء أولئك الخاضعين للشريعة، فننال جميعا مقام أبناء الله."]]}, {"l": "Gal 4:21", "n": "", "vs": [[21, "قولوا لي، يامن ترغبون في الرجوع إلى العبودية للشريعة، ألستم تسمعون ما جاء في الشريعة؟"]]}, {"l": "Gal 5:18", "n": "", "vs": [[18, "ولكن إذا كنتم خاضعين لقيادة الروح، فلستم في حال العبودية للشريعة."]]}, {"l": "Rom 3:19", "n": "", "vs": [[19, "ونحن نعلم أن كل ما تقوله الشريعة إنما تخاطب به الذين هم تحت الشريعة، لكي يسد كل فم ويقع العالم كله تحت دينونة من الله."]]}, {"l": "Rom 6:14", "n": "", "vs": [[14, "فلن يكون للخطيئة سيادة عليكم، إذ لستم خاضعين للشريعة بل للنعمة."]]}, {"l": "Rom 6:15", "n": "", "vs": [[15, "فماذا إذن؟ أنخطيء لأننا لسنا خاضعين للشريعة بل للنعمة؟ حاشا!"]]}, {"l": "1Co 9:20", "n": "", "vs": [[20, "فصرت لليهود كأني يهودي، حتى أكسب اليهود؛ وللخاضعين للشريعة كأني خاضع لها مع أني لست خاضعا لها حتى أكسب الخاضعين لها؛"]]}, {"l": "1Co 9:21", "n": "", "vs": [[21, "وللذين بلا شريعة كأني بلا شريعة مع أني لست بلا ناموس عند الله بل أنا خاضع لناموس من نحو المسيح حتى أكسب الذين هم بلا شريعة."]]}], "kwAr": "تحت حراسة الشريعة", "noteAr": ""}, {"kw": "the faith", "raw": "Luk_10:23, Luk_10:24; Heb_11:13, Heb_11:39, Heb_11:40; 1Pe_1:11, 1Pe_1:12", "note": "", "refs": [{"l": "Luk 10:23", "n": "", "vs": [[23, "ثم التفت إلى التلاميذ وقال لهم على حدة: «طوبى للعيون التي ترى ما أنتم ترون."]]}, {"l": "Luk 10:24", "n": "", "vs": [[24, "فإني أقول لكم إن كثيرين من الأنبياء والملوك تمنوا أن يروا ما تبصرون ولكنهم لم يروا، وأن يسمعوا ما تسمعون ولكنهم لم يسمعوا»."]]}, {"l": "Heb 11:13", "n": "", "vs": [[13, "هؤلاء جميعا، حافظوا على إيمانهم إلى النهاية. وماتوا قبل أن تتحقق وعود الله لهم في أثناء حياتهم. ولكنهم رأوها من بعيد، وتوقعوا تحقيقها كاملة في المستقبل. وإذ آمنوا بتلك الوعود الإلهية اعترفوا بأنهم ليسوا إلا غرباء على الأرض يزورونها زيارة عابرة."]]}, {"l": "Heb 11:39", "n": "", "vs": [[39, "إن هؤلاء لم يحصلوا جميعا على تحقيق كل ما وعدهم الله به، مع أنهم حاصلون على شهادة حسنة من جهة الإيمان."]]}, {"l": "Heb 11:40", "n": "", "vs": [[40, "ولكن الله سبق فأعد لنا ما هو أفضل، وذلك حتى لا يكملوا بمعزل عنا."]]}, {"l": "1Pe 1:11", "n": "", "vs": [[11, "واجتهدوا لمعرفة الزمان والأحوال التي كان يشير إليها روح المسيح الذي كان عاملا فيهم، عندما شهد لهم مسبقا بما ينتظر المسيح من آلام، وبما يأتي بعدها من أمجاد."]]}, {"l": "1Pe 1:12", "n": "", "vs": [[12, "ولكن الله أوحى إليهم أن اجتهادهم لم يكن لمصلحتهم هم، بل لمصلحتكم أنتم. فقد كان ذلك من أجل البشارة التي نقلها إليكم في الزمان الحاضر مبشرون يؤيدهم الروح القدس المرسل من السماء. ويالها من أمور يتمنى حتى الملائكة أن يطلعوا عليها!"]]}], "kwAr": "إلى أن يعلن الإيمان", "noteAr": ""}], "arS": [["فقبل ", []], ["مجيء", ["G2064"]], [" ", []], ["الإيمان", ["G4102"]], ["، كنا تحت ", []], ["حراسة", ["G5432"]], [" ", []], ["الشريعة", ["G3551"]], ["، ", []], ["محتجزين", ["G4788"]], [" إلى أن ", []], ["يعلن", ["G601"]], [" ", []], ["الإيمان", ["G4102"]], [" الذي كان إعلانه منتظرا.", []]]}, {"c": 3, "v": 24, "text": "إذن، كانت الشريعة هي مؤدبنا حتى مجيء المسيح، لكي نبرر على أساس الإيمان.", "groups": [{"kw": "the law", "raw": "Gal_3:25, Gal_2:19, Gal_4:2, Gal_4:3; Mat_5:17, Mat_5:18; Act_13:38, Act_13:39; Rom_3:20-22, Rom_7:7-9, Rom_7:24, Rom_7:25; Rom_10:4; Col_2:17; Heb_7:18, Heb_7:19, Heb_9:8-16, Heb_10:1-14", "note": "", "refs": [{"l": "Gal 3:25", "n": "", "vs": [[25, "ولكن بعدما جاء الإيمان، تحررنا من سلطة المؤدب."]]}, {"l": "Gal 2:19", "n": "", "vs": [[19, "فإنني، بالشريعة، قد مت عن الشريعة، لكي أحيا لله."]]}, {"l": "Gal 4:2", "n": "", "vs": [[2, "بل يبقى خاضعا للأوصياء والوكلاء إلى أن تنقضي الفترة التي حددها أبوه."]]}, {"l": "Gal 4:3", "n": "", "vs": [[3, "وهذه حالنا نحن أيضا: فإذ كنا قاصرين، كنا في حالة العبودية لمبادىء العالم."]]}, {"l": "Mat 5:17", "n": "", "vs": [[17, "لا تظنوا أني جئت لألغي الشريعة أو الأنبياء. ما جئت لألغي، بل لأكمل."]]}, {"l": "Mat 5:18", "n": "", "vs": [[18, "فالحق أقول لكم: إلى أن تزول الأرض والسماء، لن يزول حرف واحد أو نقطة واحدة من الشريعة، حتى يتم كل شيء."]]}, {"l": "Act 13:38", "n": "", "vs": [[38, "فاعلموا، أيها الإخوة، أنه بيسوع تبشرون بغفران الخطايا ،"]]}, {"l": "Act 13:39", "n": "", "vs": [[39, "وأنه به يتبرر كل من يؤمن من كل ما عجزت شريعة موسى أن تبرره منه."]]}, {"l": "Rom 3:20-22", "n": "", "vs": [[20, "فإن أحدا من البشر لا يتبرر أمامه بالأعمال المطلوبة في الشريعة. إذ إن الشريعة هي لإظهار الخطيئة."], [21, "أما الآن، فقد أعلن البر الذي يمنحه الله ، مستقلا عن الشريعة، ومشهودا له من الشريعة والأنبياء،"], [22, "ذلك البر الذي يمنحه الله على أساس الإيمان بيسوع المسيح لجميع الذين يؤمنون. إذ لا فرق،"]]}, {"l": "Rom 7:7-9", "n": "", "vs": [[7, "إذن، ماذا نقول؟ هل الشريعة خطيئة؟ حاشا! ولكني ما عرفت الخطيئة إلا بالشريعة. فما كنت لأعرف الشهوة لولا قول الشريعة: «لا تشته!»"], [8, "ولكن الخطيئة استغلت هذه الوصية فأثارت في كل شهوة. فإن الخطيئة، لولا الشريعة، ميتة."], [9, "أما أنا فكنت من قبل عائشا بمعزل عن الشريعة؛ ولكن لما جاءت الشريعة عاشت الخطيئة،"]]}, {"l": "Rom 7:24", "n": "", "vs": [[24, "فيا لي من إنسان تعيس ! من يحررني من جسد الموت هذا؟"]]}, {"l": "Rom 7:25", "n": "", "vs": [[25, "أشكر الله بيسوع المسيح ربنا! إذن، أنا نفسي من حيث العقل، أخدم شريعة الله عبدا لها؛ ولكنني من حيث الجسد، أخدم ناموس الخطيئة عبدا له."]]}, {"l": "Rom 10:4", "n": "", "vs": [[4, "فإن غاية الشريعة هي المسيح لتبرير كل من يؤمن."]]}, {"l": "Col 2:17", "n": "", "vs": [[17, "فهذه كانت ظلالا لما سيأتي، أي للحقيقة التي هي المسيح."]]}, {"l": "Heb 7:18", "n": "", "vs": [[18, "هكذا، يتبين أن نظام الكهنوت القديم قد ألغي لأنه عاجز وغير نافع."]]}, {"l": "Heb 7:19", "n": "", "vs": [[19, "فالشريعة لم توصل الذين كانوا يعبدون الله بحسبها ولو إلى أدنى درجات الكمال. ولذلك، وضع الله أساسا جديدا للاقتراب إليه، مقدما لنا رجاء أفضل."]]}, {"l": "Heb 9:8-16", "n": "", "vs": [[8, "وبهذا، يشير الروح القدس إلى أن الطريق المؤدية إلى «قدس الأقداس» الحقيقي في السماء، كانت غير مفتوحة بعد. ذلك لأن المسكن الأول مازال قائما."], [9, "وما هذا إلا صورة للوقت الحاضر الذي فيه مازالت التقدمات والذبائح تقرب وفقا لنظام العهد العتيق. ولكنها لا تستطيع أن تطهر قلوب الذين يتقربون بها إلى الله، ولا أن توصلهم إلى الكمال فتريح ضمائرهم."], [10, "إذ إن نظام العهد السابق قد اقتصر على تحريم بعض المأكولات والمشروبات وتحليل غيرها، وعلى وضع النظم المختصة بطقوس الاغتسال المختلفة. بل إن كل ما ضمه ذلك النظام، كان قوانين جسدية ينتهي عملها حين يأتي وقت الإصلاح."], [11, "ذلك أن البركات السماوية قد تحققت في المسيح. فهو الآن كاهننا الأعلى الذي يؤدي مهمته في الخيمة الحقيقية، وهي أعظم وأكمل من الخيمة الأرضية. إنها في السماء. لم تصنعها يد بشرية، وليست من هذا العالم المادي."], [12, "فإلى «قدس الأقداس» في هذه الخيمة، دخل المسيح مرة واحدة، حاملا دم نفسه، لا دم تيوس وعجول. وذلك بعدما سفك دمه عوضا عنا. فحقق فداء أبديا."], [13, "ولا عجب! فوفقا للنظام السابق، كان دم الثيران والتيوس يرش على المنجسين، مع رماد عجلة محروقة، فيصيرون طاهرين طهارة جسدية."], [14, "فكم بالأحرى دم المسيح الذي قدم نفسه لله بروح أزلي ذبيحة لا عيب فيها، يطهر ضمائرنا من الأعمال الميتة لنعبد الله الحي."], [15, "ولذلك، فالمسيح هو الوسيط لهذا العهد الجديد. فبما أنه قد تم الموت فداء للمخالفات الحاصلة تحت العهد الأول، ينال المدعوون الوعد بالإرث الأبدي."], [16, "فعندما يموت أحد ويترك وصية، لابد من إثبات موته للاستفادة من وصيته."]]}, {"l": "Heb 10:1-14", "n": "", "vs": [[1, "فقد كانت شريعة موسى تتضمن ظلا واهيا للخيرات التي سيأتي بها المسيح، ولم تكن لتصور الحقيقة كما هي. ولذلك، لم تكن قادرة أن توصل إلى الكمال أولئك الذين يتقربون بها إلى الله، مقدمين دائما الذبائح السنوية عينها،"], [2, "وإلا، لما كان هنالك داع للاستمرار في تقديمها! لأن ضمائر العابدين، متى تطهرت مرة واحدة إلى التمام، لا تعود بحاجة إلى التطهير مرة ثانية: إذ يكون الشعور بالذنب قد زال."], [3, "ولكن في عملية تقديم الذبائح المتكررة كل سنة، تذكيرا للعابدين بخطاياهم."], [4, "فمن المستحيل أن يزيل دم الثيران والتيوس خطايا الناس."], [5, "لذلك قال المسيح، عند مجيئه إلى هذه الأرض: «إن الذبائح والتقدمات ما أردتها. لكنك أعددت لي جسدا بشريا."], [6, "فالحيوانات التي كانت تذبح وتحرق أمامك تكفيرا عن الخطيئة، لم ترض بها."], [7, "عندئذ قلت لك: ها أنا آتي لأعمل إرادتك، ياالله . هذا هو المكتوب عني في صفحة الكتاب !»"], [8, "فبعد أن عبر المسيح عن عدم رضى الله بجميع التقدمات والذبائح التي كانت تقرب مع أنها كانت تقدم وفقا للشريعة،"], [9, "أضاف قائلا: «ها أنا آتي لأعمل إرادتك!» فهو، إذن، يلغي النظام السابق، ليضع محله نظاما جديدا ينسجم مع إرادة الله."], [10, "بموجب هذه الإرادة الإلهية، صرنا مقدسين إذ قرب يسوع المسيح، مرة واحدة، جسده عوضا عنا!"], [11, "وقديما، كان كل كاهن يقف يوميا أمام المذبح ليقوم بمهمته، فيقدم لله تلك الذبائح عينها، مع أنها لم تكن قادرة على إزالة الخطايا إطلاقا."], [12, "ولكن المسيح، رئيس كهنتنا، قدم ذبيحة واحدة عن الخطايا، ثم جلس إلى الأبد عن يمين الله،"], [13, "منتظرا أن يوضع أعداؤه موطئا لقدميه."], [14, "إذ إنه، بتقدمة وحيدة جعل أولئك الذين قدسهم كاملين إلى الأبد."]]}], "kwAr": "الشريعة هي مؤدبنا", "noteAr": ""}, {"kw": "justified", "raw": "Gal_2:16; Act_13:39", "note": "", "refs": [{"l": "Gal 2:16", "n": "", "vs": [[16, "ولكننا، إذ علمنا أن الإنسان لا يتبرر على أساس الأعمال المطلوبة في الشريعة بل فقط بالإيمان بيسوع المسيح، آمنا نحن أيضا بالمسيح يسوع، لنتبرر على أساس الإيمان به، لا على أساس أعمال الشريعة، لأنه على أعمال الشريعة لا يبرر أي إنسان."]]}, {"l": "Act 13:39", "n": "", "vs": [[39, "وأنه به يتبرر كل من يؤمن من كل ما عجزت شريعة موسى أن تبرره منه."]]}], "kwAr": "لكي نبرر على أساس الإيمان", "noteAr": ""}], "arS": [["إذن، كانت ", []], ["الشريعة", ["G3551"]], [" هي ", []], ["مؤدبنا", ["G3807", "G2257"]], [" حتى مجيء ", []], ["المسيح", ["G5547"]], ["، لكي ", []], ["نبرر", ["G1344"]], [" على أساس ", []], ["الإيمان", ["G4102"]], [".", []]]}, {"c": 3, "v": 25, "text": "ولكن بعدما جاء الإيمان، تحررنا من سلطة المؤدب.", "groups": [{"kw": "faith", "raw": "Gal_3:23", "note": "", "refs": [{"l": "Gal 3:23", "n": "", "vs": [[23, "فقبل مجيء الإيمان، كنا تحت حراسة الشريعة، محتجزين إلى أن يعلن الإيمان الذي كان إعلانه منتظرا."]]}], "kwAr": "بعدما جاء الإيمان", "noteAr": ""}, {"kw": "we", "raw": "Gal_4:1-6; Rom_6:14, Rom_7:4; Heb_7:11-19, Heb_8:3-13, Heb_10:15-18", "note": "", "refs": [{"l": "Gal 4:1-6", "n": "", "vs": [[1, "أقول أيضا مادام الوريث قاصرا، فليس بينه وبين العبد أي فرق، مع أنه صاحب الإرث كله،"], [2, "بل يبقى خاضعا للأوصياء والوكلاء إلى أن تنقضي الفترة التي حددها أبوه."], [3, "وهذه حالنا نحن أيضا: فإذ كنا قاصرين، كنا في حالة العبودية لمبادىء العالم."], [4, "ولكن لما جاء تمام الزمان، أرسل الله ابنه، وقد ولد من امرأة وكان خاضعا للشريعة،"], [5, "ليحرر بالفداء أولئك الخاضعين للشريعة، فننال جميعا مقام أبناء الله."], [6, "وبما أنكم أبناء له، أرسل الله إلى قلوبنا روح ابنه، مناديا: «أبا، ياأبانا»."]]}, {"l": "Rom 6:14", "n": "", "vs": [[14, "فلن يكون للخطيئة سيادة عليكم، إذ لستم خاضعين للشريعة بل للنعمة."]]}, {"l": "Rom 7:4", "n": "", "vs": [[4, "وهكذا أنتم أيضا ياإخوتي، فإنكم بجسد المسيح الذي مات، قد صرتم أمواتا بالنسبة للشريعة، لكي تصيروا لآخر، إلى المسيح نفسه الذي أقيم من بين الأموات، من أجل أن نثمر لله."]]}, {"l": "Heb 7:11-19", "n": "", "vs": [[11, "إن شريعة موسى كلها كانت تدور حول نظام الكهنوت الذي قام بنو لاوي بتأدية واجباته. إلا أن ذلك النظام لم يوصل إلى الكمال أولئك الذين كانوا يعبدون الله على أساسه. وإلا، لما دعت الحاجة إلى تعيين كاهن آخر على رتبة ملكيصادق، وليس على رتبة هرون!"], [12, "وحين يحدث أي تغير في الكهنوت، فمن الضروري أن يقابله تغير مماثل في شريعة الكهنوت."], [13, "فالمسيح، رئيس كهنتنا، لم يكن من سبط لاوي، الذي كان كهنة اليهود يتحدرون منه."], [14, "إذ من الواضح تاريخيا أن ربنا يرجع بأصله البشري إلى يهوذا. وشريعة موسى لا تذكر أية علاقة لنسل يهوذا بنظام الكهنوت."], [15, "ومما يزيد الأمر وضوحا، أن الكاهن الجديد، الشبيه بملكيصادق،"], [16, "لم يعين كاهنا على أساس الشريعة التي توصي بضرورة الانتماء إلى نسل بشري معين، بل على أساس القوة النابعة من حياته التي لا تزول أبدا."], [17, "ذلك لأن الوحي يشهد له قائلا: «أنت كاهن إلى الأبد على رتبة ملكيصادق!»"], [18, "هكذا، يتبين أن نظام الكهنوت القديم قد ألغي لأنه عاجز وغير نافع."], [19, "فالشريعة لم توصل الذين كانوا يعبدون الله بحسبها ولو إلى أدنى درجات الكمال. ولذلك، وضع الله أساسا جديدا للاقتراب إليه، مقدما لنا رجاء أفضل."]]}, {"l": "Heb 8:3-13", "n": "", "vs": [[3, "فمهمة كل رئيس كهنة هي أن يقرب لله التقدمات والذبائح. وعليه، فمن الضروري أن يكون لرئيس كهنتنا ما يقدمه."], [4, "فلو أن المسيح كان على هذه الأرض، لما كانت الشريعة تسمح له بأن يكون كاهنا. إذ تحصر الشريعة وظيفة الكهنوت في نسل واحد يحق للمتحدرين منه أن يقربوا التقدمات."], [5, "وهؤلاء يقومون بخدمة ما يشكل رمزا وظلا للأمور التي في السماء. وهذا واضح من قول الله لموسى قبل أن يصنع خيمة العبادة. إذ أوحى إليه قائلا: «انتبه! عليك أن تصنع الخيمة وما فيها وفقا للمثال الذي أظهرته لك على الجبل!»"], [6, "فرئيس كهنتنا، إذن، قد حصل على خدمة أفضل من خدمة الكهنوت الأرضي، لكونه الوسيط الذي أعلن لنا قيام عهد جديد أفضل من العهد السابق، ولكون هذا العهد الجديد ينطوي على وعود أفضل."], [7, "فلو كان العهد السابق بلا عيب، لما ظهرت الحاجة إلى عهد آخر يحل محله."], [8, "والواقع أن الله نفسه يعبر عن عجز العهد السابق. وهذا واضح في قول أحد الأنبياء قديما:"], [9, "هذا العهد الجديد ليس كالعهد الذي أبرمته مع آبائهم، حين أمسكت بأيديهم وأخرجتهم من أرض مصر. فبما أنهم خرقوا ذلك العهد، يقول الرب، أصبح من حقي أن ألغيه!"], [10, "فهذا هو العهد الذي أبرمه مع بني إسرائيل، بعد تلك الأيام، يقول الرب: أضع شرائعي داخل ضمائرهم، وأكتبها على قلوبهم، وأكون لهم إلها، وهم يكونون لي شعبا."], [11, "بعد ذلك، لا يعلم أحد منهم ابن وطنه ولا أخاه قائلا: تعرف بالرب! ذلك لأن الجميع سوف يعرفونني حق المعرفة، من الصغير فيهم إلى العظيم."], [12, "لأني سأصفح عن آثامهم، ولا أعود أبدا إلى تذكر خطاياهم ومخالفاتهم!»"], [13, "وهكذا، نلاحظ أن الله بكلامه عن عهد جديد، جعل العهد السابق عتيقا. وطبيعي أن كل ما عتق وشاخ، يكون في طريقه إلى الزوال!"]]}, {"l": "Heb 10:15-18", "n": "", "vs": [[15, "والروح القدس نفسه يشهد لنا بهذه الحقيقة. إذ قال أولا:"], [16, "«هذا هو العهد الذي أبرمه معهم بعد تلك الأيام، يقول الرب: أضع شرائعي في داخل قلوبهم، وأكتبها في عقولهم»."], [17, "ثم أضاف: «ولا أعود أبدا إلى تذكر خطاياهم ومخالفاتهم»."], [18, "فحينما يتحقق غفر ان الخطايا، لا تبقى حاجة بعد إلى تقريب التقدمات عنها!"]]}], "kwAr": "تحررنا من سلطة المؤدب", "noteAr": ""}], "arS": [["ولكن بعدما ", []], ["جاء", ["G2064"]], [" ", []], ["الإيمان", ["G4102"]], ["، تحررنا من سلطة ", []], ["المؤدب", ["G3807"]], [".", []]]}, {"c": 3, "v": 26, "text": "فإنكم جميعا أبناء الله بالإيمان بالمسيح يسوع.", "groups": [{"kw": "", "raw": "Gal_4:5, Gal_4:6; Joh_1:12, Joh_1:13, Joh_20:17; Rom_8:14-17; 2Co_6:18; Eph_1:5, Eph_5:1; Phi_2:15; Heb_2:10-15; 1Jo_3:1, 1Jo_3:2; Rev_21:7", "note": "", "refs": [{"l": "Gal 4:5", "n": "", "vs": [[5, "ليحرر بالفداء أولئك الخاضعين للشريعة، فننال جميعا مقام أبناء الله."]]}, {"l": "Gal 4:6", "n": "", "vs": [[6, "وبما أنكم أبناء له، أرسل الله إلى قلوبنا روح ابنه، مناديا: «أبا، ياأبانا»."]]}, {"l": "Joh 1:12", "n": "", "vs": [[12, "أما الذين قبلوه، أي الذين آمنوا باسمه، فقد منحهم الحق في أن يصيروا أولاد الله،"]]}, {"l": "Joh 1:13", "n": "", "vs": [[13, "وهم الذين ولدوا ليس من دم، ولا من رغبة جسد، ولا من رغبة بشر، بل من الله."]]}, {"l": "Joh 20:17", "n": "", "vs": [[17, "فقال لها: «لا تمسكي بي! فإني لم أصعد بعد إلى الآب، بل اذهبي إلى إخوتي وقولي لهم: إني سأصعد إلى أبي وأبيكم، وإلهي وإلهكم!»"]]}, {"l": "Rom 8:14-17", "n": "", "vs": [[14, "فإن جميع الخاضعين لقيادة روح الله، هم أبناء لله."], [15, "إذ إنكم لم تنالوا روح عبودية يعيدكم إلى الخوف، بل نلتم روح بنوة به نصرخ: «أبا! أبانا!»"], [16, "فالروح نفسه يشهد مع أرواحنا بأننا أولاد الله."], [17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}, {"l": "2Co 6:18", "n": "", "vs": [[18, "فأقبلكم، وأكون لكم أبا، وتكونوا لي بنين وبنات»، هذا يقوله الرب القادر على كل شيء."]]}, {"l": "Eph 1:5", "n": "", "vs": [[5, "إذ سبق فعيننا في المحبة ليتخذنا أبناء له بيسوع المسيح. وذلك موافق للقصد الذي سرت به مشيئته،"]]}, {"l": "Eph 5:1", "n": "", "vs": [[1, "فاقتدوا إذن بالله كأولاد أحباء،"]]}, {"l": "Phi 2:15", "n": "", "vs": [[15, "لتكونوا بلا أذى وبسطاء، أولادا لله لا يعابون بشيء في وسط جيل منحرف فاسد، تضيئون بينهم كأنوار في العالم،"]]}, {"l": "Heb 2:10-15", "n": "", "vs": [[10, "فلما قصد الله ، الذي من أجله كل شيء وبه كل شيء، أن يحضر إلى المجد أبناء كثيرين، كان من اللائق أن يجعل قائدهم إلى الخلاص مؤهلا لإكمال مهمته عن طريق الآلام."], [11, "فإن للمسيح الذي يقدس المؤمنين به، وللمقدسين أنفسهم، أبا واحدا. لهذا، لا يستحي المسيح أن يدعو المؤمنين به إخوة له."], [12, "إذ يقول الكتاب بلسانه: «أعلن اسمك لإخوتي. وأسبحك في وسط الجماعة!»"], [13, "ويقول أيضا: «وأنا أكون متوكلا عليه!» وأيضا: «ها أنا مع الأولاد الذين وهبهم الله لي!»"], [14, "إذن، بما أن هؤلاء الأولاد متشاركون في أجسام بشرية من لحم ودم، اشترك المسيح أيضا في اللحم والدم باتخاذه جسما بشريا. وهكذا تمكن أن يموت، ليقضي على من له سلطة الموت، أي إبليس،"], [15, "ويحرر من كان الخوف من الموت يستعبدهم طوال حياتهم."]]}, {"l": "1Jo 3:1", "n": "", "vs": [[1, "تأملوا ما أعظم المحبة التي أحبنا بها الآب حتى صرنا ندعى «أولاد الله»، ونحن أولاده حقا. ولكن، بما أن أهل العالم لا يعرفون الله، فهم لا يعرفوننا."]]}, {"l": "1Jo 3:2", "n": "", "vs": [[2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"]]}, {"l": "Rev 21:7", "n": "", "vs": [[7, "هذا كله نصيب المنتصر، وأكون إلها له، وهو يكون ابنا لي."]]}], "kwAr": "", "noteAr": ""}], "arS": [["فإنكم ", []], ["جميعا", ["G3956"]], [" ", []], ["أبناء", ["G5207"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["بالإيمان", ["G4102"]], [" ", []], ["بالمسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [".", []]]}, {"c": 3, "v": 27, "text": "لأنكم، جميع الذين تعمدتم في المسيح، قد لبستم المسيح.", "groups": [{"kw": "as many", "raw": "Mat_28:19, Mat_28:20; Mar_16:15, Mar_16:16; Act_2:38, Act_8:36-38, Act_9:18, Act_16:15, Act_16:31-33; Rom_6:3, Rom_6:4; 1Co_12:13; Col_2:10-12; 1Pe_3:21", "note": "", "refs": [{"l": "Mat 28:19", "n": "", "vs": [[19, "فاذهبوا إذن، وتلمذوا جميع الأمم، وعمدوهم باسم الآب والابن والروح القدس؛"]]}, {"l": "Mat 28:20", "n": "", "vs": [[20, "وعلموهم أن يعملوا بكل ما أوصيتكم به. وها أنا معكم كل الأيام إلى انتهاء الزمان! »."]]}, {"l": "Mar 16:15", "n": "", "vs": [[15, "وقال لهم: «اذهبوا إلى العالم أجمع، وبشروا الخليقة كلها بالإنجيل:"]]}, {"l": "Mar 16:16", "n": "", "vs": [[16, "من آمن وتعمد، خلص، ومن لم يؤمن فسوف يدان."]]}, {"l": "Act 2:38", "n": "", "vs": [[38, "أجابهم بطرس: «توبوا، وليتعمد كل واحد منكم باسم يسوع المسيح، فيغفر الله خطاياكم وتنالوا هبة الروح القدس،"]]}, {"l": "Act 8:36-38", "n": "", "vs": [[36, "وبينما كانت العربة تسير بهما، وصلا إلى مكان فيه ماء، فقال الخصي: «ها هو الماء، فماذا يمنع أن أتعمد؟»"], [37, "فأجابه فيلبس: «هذا جائز إن كنت تؤمن من كل قلبك». فقال الخصي: «إني أومن بأن يسوع المسيح هو ابن الله»."], [38, "وأمر أن تقف العربة، فنزلا إلى الماء معا، وعمد فيلبس الخصي."]]}, {"l": "Act 9:18", "n": "", "vs": [[18, "وفي الحال تساقط من عيني شاول ما يشبه القشور، فأبصر ، ثم قام وتعمد."]]}, {"l": "Act 16:15", "n": "", "vs": [[15, "فلما تعمدت هي وأهل بيتها، دعتنا بإلحاح لقبول ضيافتها قائلة: «إن كنتم قد حكمتم أني مؤمنة بالرب، فانزلوا ضيوفا ببيتي». فاضطرتنا إلى قبول دعوتها."]]}, {"l": "Act 16:31-33", "n": "", "vs": [[31, "فأجاباه: «آمن بالرب يسوع فتخلص أنت وأهل بيتك!»"], [32, "ثم بشراه وأهل بيته جميعا بكلمة الرب."], [33, "فأخذهما في تلك الساعة من الليل وغسل جراحهما وتعمد حالا هو وأهل بيِته جميعا."]]}, {"l": "Rom 6:3", "n": "", "vs": [[3, "أم يخفى عليكم أننا جميعا، نحن الذين تعمدنا اتحادا بالمسيح يسوع، قد تعمدنا اتحادا بموته؟"]]}, {"l": "Rom 6:4", "n": "", "vs": [[4, "وبسبب ذلك دفنا معه بالمعمودية للموت، حتى كما أقيم المسيح من الأموات بمجد الآب، كذلك نسلك نحن أيضا في حياة جديدة."]]}, {"l": "1Co 12:13", "n": "", "vs": [[13, "فإننا، بالروح الواحد، قد تعمدنا جميعا لنصير جسدا واحدا، سواء كنا يهودا أم يونانيين، عبيدا أم أحرارا، وقد سقينا جميعا الروح الواحد."]]}, {"l": "Col 2:10-12", "n": "", "vs": [[10, "وأنتم مكملون فيه. فهو رأس كل رئاسة وسلطة؛"], [11, "وفيه أيضا ختنتم أنتم ختانا لم تجره الأيدي، إذ نزع عنكم جسد الخطايا البشري وهذا هو ختان المسيح:"], [12, "فقد دفنتم معه في المعمودية، وفيها أيضا أقمتم معه، عن طريق إيمانكم بقدرة الله الذي أقامه من بين الأموات."]]}, {"l": "1Pe 3:21", "n": "", "vs": [[21, "وعملية النجاة هذه مصورة في المعمودية التي لا نقصد بها أن نغتسل من أوساخ أجسامنا، بل هي تعهد ضمير صالح أمام الله بفضل قيامة يسوع المسيح،"]]}], "kwAr": "جميع الذين تعمدتم في المسيح", "noteAr": ""}, {"kw": "put", "raw": "Job_29:14; Isa_61:10; Luk_15:22; Rom_3:22, Rom_13:14; Eph_4:24; Col_3:10", "note": "", "refs": [{"l": "Job 29:14", "n": "", "vs": [[14, "ارتديت البر فكساني، وكجبة وعمامة كان عدلي."]]}, {"l": "Isa 61:10", "n": "", "vs": [[10, "إنني أبتهج حقا بالرب وتفرح نفسي بإلهي، لأنه كساني ثياب الخلاص وسربلني برداء البر، مثل عريس يزين رأسه بتاج، وكعروس تتجمل بحليها."]]}, {"l": "Luk 15:22", "n": "", "vs": [[22, "أما الأب فقال لعبيده: أحضروا سريعا أفضل ثوب وألبسوه، وضعوا في إصبعه خاتما وفي قدميه حذاء."]]}, {"l": "Rom 3:22", "n": "", "vs": [[22, "ذلك البر الذي يمنحه الله على أساس الإيمان بيسوع المسيح لجميع الذين يؤمنون. إذ لا فرق،"]]}, {"l": "Rom 13:14", "n": "", "vs": [[14, "وإنما البسوا الرب يسوع المسيح (تمثلوا به)، ولا تنشغلوا بالتدبير للجسد لقضاء شهواته."]]}, {"l": "Eph 4:24", "n": "", "vs": [[24, "وتلبسوا الإنسان الجديد المخلوق على مثال الله في البر والقداسة بالحق."]]}, {"l": "Col 3:10", "n": "", "vs": [[10, "ولبستم الجديد الذي يتجدد لبلوغ تمام المعرفة وفقا لصورة خالقه،"]]}], "kwAr": "قد لبستم المسيح", "noteAr": ""}], "arS": [["لأنكم، ", []], ["جميع", ["G3745"]], [" الذين ", []], ["تعمدتم", ["G907"]], [" في ", []], ["المسيح", ["G5547"]], ["، قد ", []], ["لبستم", ["G1746"]], [" ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 3, "v": 28, "text": "لا فرق بعد الآن بين يهودي ويوناني، أو عبد وحر، أو ذكر وأنثى، لأنكم جميعا واحد في المسيح يسوع.", "groups": [{"kw": "neither", "raw": "Gal_5:6; Rom_1:16, Rom_2:9, Rom_2:10, Rom_3:29, Rom_3:30, Rom_4:11, Rom_4:12, Rom_9:24, Rom_10:12-15; 1Co_7:19; 1Co_12:13; Eph_3:5-10; Col_3:11", "note": "", "refs": [{"l": "Gal 5:6", "n": "", "vs": [[6, "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة."]]}, {"l": "Rom 1:16", "n": "", "vs": [[16, "فأنا لا أستحي بالإنجيل، لأنه قدرة الله للخلاص، لكل من يؤمن، لليهودي أولا ثم لليوناني على السواء."]]}, {"l": "Rom 2:9", "n": "", "vs": [[9, "فالشدة والضيق على نفس كل إنسان يعمل الشر اليهودي أولا ثم اليوناني؛"]]}, {"l": "Rom 2:10", "n": "", "vs": [[10, "والمجد والكرامة والسلام لكل من يعمل الصلاح اليهودي أولا، ثم اليوناني ."]]}, {"l": "Rom 3:29", "n": "", "vs": [[29, "أو يكون الله إله اليهود وحدهم؟ أما هو إله الأمم أيضا؟ بلى، إنه إله الأمم أيضا،"]]}, {"l": "Rom 3:30", "n": "", "vs": [[30, "مادام الله الواحد هو الذي سيبرر أهل الختان على أساس الإيمان، وأهل عدم الختان على أساس الإيمان."]]}, {"l": "Rom 4:11", "n": "", "vs": [[11, "ثم تلقى إبراهيم علامة الختان ختما للبر الحاصل بالإيمان الذي كان له وهو مازال غير مختون، لكي يكون أبا لجميع الذين يؤمنون من غير المختونين فيحسب البر لهم أيضا،"]]}, {"l": "Rom 4:12", "n": "", "vs": [[12, "وأبا للمختونين الذين ليسوا من أهل الختان وحسب بل الذين يسيرون في خطى الإيمان الذي كان لأبينا إبراهيم وهو بعد غير مختون."]]}, {"l": "Rom 9:24", "n": "", "vs": [[24, "فينا نحن الذين دعاهم لا من بين اليهود فقط بل من بين الأمم أيضا؟"]]}, {"l": "Rom 10:12-15", "n": "", "vs": [[12, "فلا فرق بين اليهودي واليوناني، لأن للجميع ربا واحدا، غنيا تجاه كل من يدعوه»."], [13, "«فإن كل من يدعو باسم الرب يخلص»."], [14, "ولكن، كيف يدعون من لم يؤمنوا به؟ وكيف يؤمنون بمن لم يسمعوا به؟ وكيف يسمعون بلا مبشر؟"], [15, "وكيف يبشر أحد إلا إذا كان قد أرسل؟ كما قد كتب: «ما أجمل أقدام المبشرين بالخيرات!»"]]}, {"l": "1Co 7:19", "n": "", "vs": [[19, "إن الختان ليس شيئا، وعدم الختان ليس شيئا، بل المهم هو العمل بوصايا الله."]]}, {"l": "1Co 12:13", "n": "", "vs": [[13, "فإننا، بالروح الواحد، قد تعمدنا جميعا لنصير جسدا واحدا، سواء كنا يهودا أم يونانيين، عبيدا أم أحرارا، وقد سقينا جميعا الروح الواحد."]]}, {"l": "Eph 3:5-10", "n": "", "vs": [[5, "ذلك السر الذي لم يطلع عليه بنو البشر في الأجيال الماضية مثلما أعلن الآن بوحي الروح لرسله القديسين وأنبيائه:"], [6, "وهو أن الأمم هم شركاء اليهود في الميراث، وأعضاء في الجسد معهم، ولهم أيضا حق الاستفادة من الوعد. وذلك في المسيح يسوع وبفضل الإنجيل"], [7, "الذي صرت أنا خادما له بحسب نعمة الله الموهوبة لي وفقا لعمل قدرته."], [8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"], [9, "وأنير الجميع بمعرفة ما هو تدبير السر الذي أبقاه الله ، خالق كل شيء، مكتوما مدى الأجيال."], [10, "والغاية أن يتجلى الآن أمام الرئاسات والسلطات في الأماكن السماوية ما يظهر في الكنيسة من حكمة الله المتعددة الوجوه،"]]}, {"l": "Col 3:11", "n": "", "vs": [[11, "وفيه لا فرق بين يوناني ويهودي، أو مختون وغير مختون، أو متحضر ومتخلف، أو عبد وحر، بل المسيح هو الكل وفي الكل."]]}], "kwAr": "لا فرق", "noteAr": ""}, {"kw": "male", "raw": "1Co_7:14", "note": "", "refs": [{"l": "1Co 7:14", "n": "", "vs": [[14, "ذلك لأن الزوج غير المؤمن قد تقدس في زوجته، والزوجة غير المؤمنة قد تقدست في زوجها. وإلا كان الأولاد في مثل هذا الزواج نجسين، والحال أنهم مقدسون."]]}], "kwAr": "ذكر وأنثى", "noteAr": ""}, {"kw": "for", "raw": "Joh_10:16, Joh_11:52, Joh_17:20,Joh_17:21; 1Co_12:12; Eph_2:13-22, Eph_4:4, Eph_4:15, Eph_4:16", "note": "", "refs": [{"l": "Joh 10:16", "n": "", "vs": [[16, "ولي خراف أخرى لا تنتمي إلى هذه الحظيرة، لا بد أن أجمعها إلي أيضا، فتصغي لصوتي؛ فيكون هناك قطيع واحد وراع واحد."]]}, {"l": "Joh 11:52", "n": "", "vs": [[52, "وليس فدى الأمة وحسب بل أيضا ليجمع أبناء الله المشتتين فيجعلهم واحدا."]]}, {"l": "Joh 17:20", "n": "", "vs": [[20, "ولست أصلي من أجل هؤلاء فقط، بل أيضا من أجل الذين سوف يؤمنون بي بسبب كلمة هؤلاء،"]]}, {"l": "Joh 17:21", "n": "", "vs": [[21, "ليكون الجميع واحدا؛ أيها الآب، كما أنك أنت في وأنا فيك، ليكونوا هم أيضا واحدا فينا، لكي يؤمن العالم أنك أنت أرسلتني."]]}, {"l": "1Co 12:12", "n": "", "vs": [[12, "فكما أن الجسد واحد وله أعضاء كثيرة، ولكن أعضاء الجسد كلها تشكل جسما واحدا مع أنها كثيرة، فكذلك حال المسيح أيضا."]]}, {"l": "Eph 2:13-22", "n": "", "vs": [[13, "أما الآن، ففي المسيح يسوع، أنتم الذين كنتم من قبل بعيدين قد صرتم قريبين بدم المسيح."], [14, "فإنه هو سلامنا، ذاك الذي جعل الفريقين واحدا وهدم حائط الحاجز الفاصل بينهما،"], [15, "أي العداء: إذ أبطل بجسده شريعة الوصايا ذات الفرائض، لكي يكون من الفريقين إنسانا واحدا جديدا، إذ أحل السلام بينهما،"], [16, "ولكي يصالحهما معا في جسد واحد مع الله بالصليب الذي به قتل العداء."], [17, "ثم جاء وبشركم بالسلام أنتم البعيدين، (كما بشر بالسلام) أولئك القريبين."], [18, "فبه لنا كلينا اقتراب إلى الآب بروح واحد."], [19, "إذن، لستم غرباء وأجانب بعد الآن، بل أنتم رعية مع القديسين وأعضاء في عائلة الله،"], [20, "وقد بنيتم على أساس الرسل والأنبياء، والمسيح يسوع نفسه هو حجر الزاوية الأساس،"], [21, "الذي فيه يتناسق البناء كله فيرتفع ليصير هيكلا مقدسا في الرب."], [22, "وفيه أنتم أيضا قد بنيتم معا فصرتم مسكنا لله بوجود الروح."]]}, {"l": "Eph 4:4", "n": "", "vs": [[4, "مثلما دعيتم، جميعكم، دعوة لها رجاء واحد."]]}, {"l": "Eph 4:15", "n": "", "vs": [[15, "بل نتمسك بالحق في المحبة، فننمو في كل شيء نحو من هو الرأس، أي المسيح."]]}, {"l": "Eph 4:16", "n": "", "vs": [[16, "فمنه يستمد الجسد كله تماسكه وترابطه بمساندة كل مفصل وفقا لمقدار العمل المخصص لكل جزء، لينشيء نموا يؤول إلى بنيان الجسد بنيانا ذاتيا في المحبة."]]}], "kwAr": "لأنكم جميعا واحد في المسيح يسوع", "noteAr": ""}], "arS": [["لا فرق بعد الآن بين ", []], ["يهودي", ["G2453"]], [" ", []], ["ويوناني", ["G1672"]], ["، أو ", []], ["عبد", ["G1401"]], [" ", []], ["وحر", ["G1658"]], ["، أو ", []], ["ذكر", ["G730"]], [" ", []], ["وأنثى", ["G2338"]], ["، لأنكم ", []], ["جميعا", ["G3956"]], [" ", []], ["واحد", ["G1520"]], [" في ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [".", []]]}, {"c": 3, "v": 29, "text": "فإذا كنتم للمسيح، فأنتم إذن نسل إبراهيم وحسب الوعد وارثون.", "groups": [{"kw": "Christs", "raw": "Gal_5:24; 1Co_3:23, 1Co_15:23; 2Co_10:7", "note": "", "refs": [{"l": "Gal 5:24", "n": "", "vs": [[24, "ولكن الذين صاروا خاصة للمسيح، قد صلبوا الجسد مع الأهواء والشهوات."]]}, {"l": "1Co 3:23", "n": "", "vs": [[23, "وأنتم للمسيح، والمسيح لله."]]}, {"l": "1Co 15:23", "n": "", "vs": [[23, "على أن لكل واحد رتبته: فأولا المسيح بصفته البكر؛ وبعده خاصته لدى رجوعه،"]]}, {"l": "2Co 10:7", "n": "", "vs": [[7, "أتحكمون على الأمور بحسب ظواهرها؟ إن كانت لأحد ثقة في نفسه بأنه يخص المسيح، فليفكر أيضا في نفسه بأنه كما يخص هو المسيح، كذلك نخصه نحن أيضا."]]}], "kwAr": "كنتم للمسيح", "noteAr": ""}, {"kw": "Abrahams", "raw": "Gal_3:7, Gal_3:16, Gal_3:28, Gal_4:22-31; Gen_21:10-12; Rom_4:12, Rom_4:16-21, Rom_9:7, Rom_9:8; Heb_11:18", "note": "", "refs": [{"l": "Gal 3:7", "n": "", "vs": [[7, "فاعلموا إذن أن الذين هم على مبدأ الإيمان هم أبناء إبراهيم فعلا."]]}, {"l": "Gal 3:16", "n": "", "vs": [[16, "وقد وجهت الوعود لإبراهيم ونسله، ولا يقول «وللأنسال» كأنه يشير إلى كثيرين، بل يشير إلى واحد، إذ يقول «ولنسلك»، يعني المسيح."]]}, {"l": "Gal 3:28", "n": "", "vs": [[28, "لا فرق بعد الآن بين يهودي ويوناني، أو عبد وحر، أو ذكر وأنثى، لأنكم جميعا واحد في المسيح يسوع."]]}, {"l": "Gal 4:22-31", "n": "", "vs": [[22, "فإنه قد كتب أن إبراهيم كان له ابنان: أحدهما من الجارية، والآخر من المرأة الحرة."], [23, "أما ابن الجارية، فقد ولد حسب الجسد. وأما ابن الحرة، فإتماما للوعد."], [24, "وهذه الحقيقة لها معنى رمزي. فهاتان المرأتان ترمزان إلى عهدين: الأول مصدره جبل سيناء، يجعل المولودين تحته في حال العبودية، ورمزه هاجر."], [25, "ولفظة هاجر تطلق على جبل سيناء، في بلاد العرب، وتمثل أورشليم الحالية، فإنها مع بنيها في العبودية."], [26, "أما الثاني، فرمزه الحرة التي تمثل أورشليم السماوية التي هي أمنا."], [27, "فإنه قد كتب: «افرحي أيتها العاقر التي لا تلد، اهتفي بأعلى صوتك أيتها التي لا تتمخض، لأن أولاد المهجورة أكثر عددا من أولاد التي لها زوج!»"], [28, "وأما أنتم، أيها الإخوة، فأولاد الوعد، على مثال إسحاق."], [29, "ولكن، كما كان في الماضي المولود بحسب الجسد يضطهد المولود بحسب الروح، فكذلك أيضا يحدث الآن."], [30, "إنما ماذا يقول الكتاب؟ «اطرد الجارية وابنها، لأن ابن الجارية لا يرث مع ابن الحرة!»"], [31, "إذن، أيها الإخوة، نحن لسنا أولاد الجارية، بل أولاد الحرة."]]}, {"l": "Gen 21:10-12", "n": "", "vs": [[10, "فقالت لإبر اهيم: «اطرد هذه الجارية وابنها، فإن ابن الجارية لن يرث مع ابني إسحق»."], [11, "فقبح هذا القول في نفس إبر اهيم من أجل ابنه."], [12, "فقال الله له: «لا يسوء في نفسك أمر الصبي أو أمر جاريتك، واسمع لكلام سارة في كل ما تشير به عليك لأنه بإسحق يدعى لك نسل."]]}, {"l": "Rom 4:12", "n": "", "vs": [[12, "وأبا للمختونين الذين ليسوا من أهل الختان وحسب بل الذين يسيرون في خطى الإيمان الذي كان لأبينا إبراهيم وهو بعد غير مختون."]]}, {"l": "Rom 4:16-21", "n": "", "vs": [[16, "لذلك، فإن الوعد هو على أساس الإيمان ليكون بحسب النعمة، بقصد أن يكون مضمونا للنسل كله: ليس لأهل الشريعة وحدهم، بل أيضا لأهل الإيمان الذي كان لإبراهيم. فإنه أب لنا جميعا،"], [17, "كما قد كتب: «إني جعلتك أبا لأمم كثيرة». (إنه أب لنا) في نظر الله الذي به آمن، والذي يحيي الموتى ويستدعي إلى الوجود ما كان غير موجود."], [18, "إذ رغم انقطاع الرجاء، فبالرجاء آمن إبراهيم بأنه سيصير أبا لأمم كثيرة، وفقا لما قيل له: «بهذه الكثرة سيكون نسلك»."], [19, "ولم يضعف في الإيمان حين أدرك موت جسده، لكونه قارب سن المئة، وموت رحم زوجته سارة أيضا؛"], [20, "ولم يشك في وعد الله عن عدم إيمان، بل وجد في الإيمان قوة، فأعطى المجد لله."], [21, "وإذ اقتنع تماما بأن ما وعده الله به هو قادر أن يفعله؛"]]}, {"l": "Rom 9:7", "n": "", "vs": [[7, "وليسوا، لأنهم نسل إبراهيم، كلهم أولادا لله، بل (كما قد كتب): «بإسحاق سيكون لك نسل يحمل اسمك»."]]}, {"l": "Rom 9:8", "n": "", "vs": [[8, "أي أن أولاد الجسد ليسوا هم أولاد الله، بل أولاد الوعد يحسبون نسلا."]]}, {"l": "Heb 11:18", "n": "", "vs": [[18, "مع أن الله قال له: «بإسحاق سوف يكون لك نسل يحمل اسمك!»"]]}], "kwAr": "نسل إبراهيم", "noteAr": ""}, {"kw": "heirs", "raw": "Gal_4:7, Gal_4:28; Rom_4:13, Rom_4:14, Rom_8:17; 1Co_3:22; Eph_3:6; Tit_3:7; Heb_1:14, Heb_6:17; Heb_11:7; Jam_2:5; Rev_21:7", "note": "", "refs": [{"l": "Gal 4:7", "n": "", "vs": [[7, "إذن، أنت لست عبدا بعد الآن، بل أنت ابن. ومادمت ابنا، فقد جعلك الله وريثا أيضا."]]}, {"l": "Gal 4:28", "n": "", "vs": [[28, "وأما أنتم، أيها الإخوة، فأولاد الوعد، على مثال إسحاق."]]}, {"l": "Rom 4:13", "n": "", "vs": [[13, "فليس على أساس الشريعة كان الوعد لإبراهيم، أو لنسله، بأن يكون وارثا للعالم، وإنما على أساس البر الذي بالإيمان."]]}, {"l": "Rom 4:14", "n": "", "vs": [[14, "فلو كان أهل الشريعة هم أصحاب الإرث، لصار الإيمان بلا فاعلية ونقض الوعد."]]}, {"l": "Rom 8:17", "n": "", "vs": [[17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}, {"l": "1Co 3:22", "n": "", "vs": [[22, "أبولس أم أبلوس أم بطرس أم العالم أم الحيا ة أم الموت أم الحاضر أم المستقبل: هذه الأمور كلها لكم،"]]}, {"l": "Eph 3:6", "n": "", "vs": [[6, "وهو أن الأمم هم شركاء اليهود في الميراث، وأعضاء في الجسد معهم، ولهم أيضا حق الاستفادة من الوعد. وذلك في المسيح يسوع وبفضل الإنجيل"]]}, {"l": "Tit 3:7", "n": "", "vs": [[7, "حتى إذا تبررنا بنعمته، نصير ورثة، وفقا لرجائنا بالحياة الأبدية."]]}, {"l": "Heb 1:14", "n": "", "vs": [[14, "لا! فليس الملائكة إلا أرواحا خادمة ترسل لخدمة الذين سيرثون الخلاص."]]}, {"l": "Heb 6:17", "n": "", "vs": [[17, "ولذلك، لما أراد الله أن يؤكد بصورة قاطعة لوارثي وعده، أن قراره لا يتغير أبدا، ثبته بالقسم."]]}, {"l": "Heb 11:7", "n": "", "vs": [[7, "وبالإيمان نوح، لما أنذره
