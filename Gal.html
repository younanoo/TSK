, {"l": "Isa 53:6", "n": "", "vs": [[6, "كلنا كغنم شردنا ملنا كل واحد إلى سبيله، فأثقل الرب كاهله بإثم جميعنا."]]}, {"l": "Isa 64:6", "n": "", "vs": [[6, "كلنا أصبحنا كنجس، وأضحت جميع أعمال برنا كثوب قذر، فذبلنا كأوراق الشجر وعبثت بنا آثامنا كالريح."]]}, {"l": "Jam 3:2", "n": "", "vs": [[2, "فإننا جميعا معرضون للوقوع في أخطاء كثيرة. ولكن من يلجم لسانه ولا يخطيء في كلامه هو ناضج يقدر أن يسيطر على طبيعته سيطرة تامة."]]}, {"l": "1Jo 1:8-10", "n": "", "vs": [[8, "إن كنا ندعي أن لا خطيئة لنا، نخدع أنفسنا، ولا يكون الحق في داخلنا."], [9, "ولكن، إن اعترفنا لله بخطايانا، فهو جدير بالثقة وعادل، يغفر لنا خطايانا ويطهرنا من كل إثم."], [10, "فإن كنا ندعي أننا لم نرتكب خطيئة، نجعل الله كاذبا، ولا تكون كلمته في داخلنا!"]]}, {"l": "Rev 5:9", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"]]}, {"l": "Rev 7:14", "n": "", "vs": [[14, "فأجبته: «أنت أعلم ياسيدي!» فقال: «هؤلاء هم الذين أتوا من الضيقة العظيمة، وقد غسلوا ثيابهم وبيضوها بدم الحمل."]]}, {"l": "Rev 7:15", "n": "", "vs": [[15, "لهذا هم أمام عرش الله يخدمونه في هيكله ليلا ونهارا والجالس على العرش يبسط خيمته عليهم،"]]}], "kwAr": "أن أحدا لا يتبرر عند الله", "noteAr": ""}, {"kw": "The just", "raw": "Hab_2:4; Rom_1:17; Heb_10:38", "note": "", "refs": [{"l": "Hab 2:4", "n": "", "vs": [[4, "أما الرسالة فهي: إن ذا النفس المنتفخة غير المستقيمة مصيره الهلاك، أما البار فبالإيمان يحيا."]]}, {"l": "Rom 1:17", "n": "", "vs": [[17, "ففيه قد أعلن البر الذي يمنحه الله على أساس الإيمان والذي يؤدي إلى الإيمان، على حد ما قد كتب: «أما من تبرر بالإيمان، فبالإيمان يحيا»."]]}, {"l": "Heb 10:38", "n": "", "vs": [[38, "وأما من تبرر بالإيمان، فبالإيمان يحيا. ومن ارتد لا تسر به نفسي!"]]}], "kwAr": "من تبرر بالإيمان فبالإيمان يحيا", "noteAr": ""}], "arS": [["أما أن ", []], ["أحدا", ["G3762"]], [" لا يتبر ر عند ", []], ["الله", ["G2316"]], [" بفضل ", []], ["الشريعة", ["G3551"]], ["، فذلك ", []], ["واضح", ["G1212"]], ["، لأن «من ", []], ["تبرر", ["G1342"]], [" ", []], ["بالإيمان", ["G4102"]], [" فبالإيمان ", []], ["يحيا", ["G2198"]], ["».", []]]}, {"c": 3, "v": 12, "text": "ولكن الشريعة لا تراعي مبدأ الإيمان، بل «من عمل بهذه الوصايا، يحيا بها».", "groups": [{"kw": "the law", "raw": "Rom_4:4, Rom_4:5, Rom_4:14, Rom_4:16, Rom_9:30-32, Rom_10:5, Rom_10:6, Rom_11:6", "note": "", "refs": [{"l": "Rom 4:4", "n": "", "vs": [[4, "إن الذي يعمل، لا تحسب له الأجرة من قبيل النعمة بل من قبيل الدين. أما الذي لا يعمل"]]}, {"l": "Rom 4:5", "n": "", "vs": [[5, "وإنما يؤمن بمن يبرر الأثيم، فإن إيمانه يحسب له برا."]]}, {"l": "Rom 4:14", "n": "", "vs": [[14, "فلو كان أهل الشريعة هم أصحاب الإرث، لصار الإيمان بلا فاعلية ونقض الوعد."]]}, {"l": "Rom 4:16", "n": "", "vs": [[16, "لذلك، فإن الوعد هو على أساس الإيمان ليكون بحسب النعمة، بقصد أن يكون مضمونا للنسل كله: ليس لأهل الشريعة وحدهم، بل أيضا لأهل الإيمان الذي كان لإبراهيم. فإنه أب لنا جميعا،"]]}, {"l": "Rom 9:30-32", "n": "", "vs": [[30, "فما هي خلاصة القول؟ إن الأمم الذين لم يكونوا يسعون وراء البر، قد بلغوا البر، ولكنه البر القائم على أساس الإيمان."], [31, "أما إسرائيل، وقد كانوا يسعون وراء شريعة تهدف إلى البر، فقد فشلوا حتى في بلوغ الشريعة."], [32, "ولأي سبب؟ لأن سعيهم لم يكن على أساس الإيمان، بل كان وكأن الأمر قائم على الأعمال. فقد تعثروا بحجر العثرة،"]]}, {"l": "Rom 10:5", "n": "", "vs": [[5, "فقد كتب موسى عن البر الآتي من الشريعة: «إن الإنسان الذي يعمل بهذه الأمور، يحيا بها»."]]}, {"l": "Rom 10:6", "n": "", "vs": [[6, "غير أن البر الآتي من الإيمان يقول هذا: «لا تقل في قلبك: من يصعد إلى السماوات؟» أي لينزل المسيح،"]]}, {"l": "Rom 11:6", "n": "", "vs": [[6, "ولكن، بما أن ذلك قد تم بالنعمة، فليس بعد على أساس الأعمال، وإلا فليست النعمة نعمة بعد."]]}], "kwAr": "الشريعة لا تراعي مبدأ الإيمان", "noteAr": ""}, {"kw": "The man", "raw": "Lev_18:5; Neh_9:29; Eze_20:11, Eze_20:13; Mat_19:17; Luk_10:25-28; Rom_10:5, Rom_10:6", "note": "", "refs": [{"l": "Lev 18:5", "n": "", "vs": [[5, "احفظوا فرائضي وأحكامي التي إذا أطاعها الإنسان يحيا بها. أنا الرب."]]}, {"l": "Neh 9:29", "n": "", "vs": [[29, "وأنذرتهم لتردهم إلى شريعتك. غير أنهم طغوا وتمردوا على وصاياك وأخطأوا ضد أحكامك، التي إن مارسها إنسان يحيا بها، واعتصموا بعنادهم وأغلظوا قلوبهم ولم يطيعوا."]]}, {"l": "Eze 20:11", "n": "", "vs": [[11, "وأعطيتهم فرائضي، وأعلنت لهم أحكامي التي إن مارسها إنسان يحيا بها،"]]}, {"l": "Eze 20:13", "n": "", "vs": [[13, "لكن شعب إسرائيل تمردوا علي في البرية ولم يمارسوا فرائضي، وتنكروا لأحكامي التي إن عمل بها إنسان يحيا، ونجسوا أيام سبوتي كثيرا. فقلت: سأسكب غضبي عليهم في البرية لأميتهم."]]}, {"l": "Mat 19:17", "n": "", "vs": [[17, "فأجابه: «لماذا تسألني عن الصالح؟ واحد هو الصالح. ولكن، إن أردت أن تدخل الحياة، فاعمل بالوصايا»."]]}, {"l": "Luk 10:25-28", "n": "", "vs": [[25, "وتصدى له أحد علماء الشريعة ليجربه، فقال: «يامعلم، ماذا أعمل لأرث الحياة الأبدية؟»"], [26, "فقال له: «ماذا كتب في الشريعة؟ وكيف تقرأها؟»"], [27, "فأجاب: «أحب الرب إلهك بكل قلبك وكل نفسك وكل قدرتك وكل فكرك، وأحب قريبك كنفسك»."], [28, "فقال له: «جوابك صحيح. فإن عملت بهذا، تحيا!»"]]}, {"l": "Rom 10:5", "n": "", "vs": [[5, "فقد كتب موسى عن البر الآتي من الشريعة: «إن الإنسان الذي يعمل بهذه الأمور، يحيا بها»."]]}, {"l": "Rom 10:6", "n": "", "vs": [[6, "غير أن البر الآتي من الإيمان يقول هذا: «لا تقل في قلبك: من يصعد إلى السماوات؟» أي لينزل المسيح،"]]}], "kwAr": "من عمل بهذه الوصايا", "noteAr": ""}], "arS": [["ولكن ", []], ["الشريعة", ["G3551"]], [" لا تراعي مبدأ ", []], ["الإيمان", ["G4102"]], ["، بل «من ", []], ["عمل", ["G4160"]], [" بهذه الوصايا، ", []], ["يحيا", ["G2198"]], [" بها».", []]]}, {"c": 3, "v": 13, "text": "إن المسيح حررنا بالفداء من لعنة الشريعة، إذ صار لعنة عوضا عنا، لأنه قد كتب: «ملعون كل من علق على خشبة»،", "groups": [{"kw": "redeemed", "raw": "Gal_3:10, Gal_4:5; Isa_55:5-7, Isa_55:10-12; Dan_9:24, Dan_9:26; Zec_13:7; Mat_26:28; Rom_3:24-26, Rom_4:25, Rom_8:3, Rom_8:4; 2Co_5:21; Eph_5:2; Tit_2:14; Heb_7:26, Heb_7:27, Heb_9:12, Heb_9:15, Heb_9:26, Heb_9:28, Heb_10:4-10; 1Pe_1:18-21, 1Pe_2:24, 1Pe_3:18; 1Jo_2:1, 1Jo_2:2, 1Jo_4:10; Rev_1:5, Rev_5:9, Rev_13:8", "note": "", "refs": [{"l": "Gal 3:10", "n": "", "vs": [[10, "أما جميع الذين على مبدأ أعمال الشريعة، فإنهم تحت اللعنة، لأنه قد كتب: «ملعون كل من لا يثبت على العمل بكل ما هو مكتوب في كتاب الشريعة!»"]]}, {"l": "Gal 4:5", "n": "", "vs": [[5, "ليحرر بالفداء أولئك الخاضعين للشريعة، فننال جميعا مقام أبناء الله."]]}, {"l": "Isa 55:5-7", "n": "", "vs": [[5, "انظر، إنك تدعو أمما لا تعرفها، وتسعى إليك أمم لم تعرفك، بفضل الرب إلهك، ومن أجل قدوس إسرائيل، لأنه قد مجدك."], [6, "اطلبوا الرب مادام موجودا، ادعوه وهو قريب."], [7, "ليترك الشرير طريقه والأثيم أفكاره، وليتب إلى الرب فيرحمه، وليرجع إلى إلهنا لأنه يكثر الغفران."]]}, {"l": "Isa 55:10-12", "n": "", "vs": [[10, "وكما تهطل الأمطار وينهمر الثلج من السماء، ولا ترجع إلى هناك، بل تروي الحقول والأشجار، وتجعل البذور تنبت وتنمو وتثمر زرعا للفلاح وخبزا للجياع،"], [11, "هكذا تكون كلمتي التي تصدر عني مثمرة دائما، وتحقق ما أرغب فيه وتفلح بما أعهد به إليها."], [12, "لأنكم ستتركون بابل بفرح وسلام فتترنم الجبال والتلال أمامكم بهجة وتصفق أشجار الحقل بأيديها غبطة،"]]}, {"l": "Dan 9:24", "n": "", "vs": [[24, "قد صدر القضاء أن يمضي سبعون أسبوعا على شعبك وعلى مدينة قدسك، للانتهاء من المعصية والقضاء على الخطيئة، وللتكفير عن الإثم، ولإشاعة البر الأبدي وختم الرؤيا والنبوءة ولمسح قدوس القدوسين."]]}, {"l": "Dan 9:26", "n": "", "vs": [[26, "وبعد اثنين وستين أسبوعا يقتل المسيح، ولكن ليس من أجل نفسه، ويدمر شعب رئيس آت المدينة والقدس، وتقبل آخرتها كطوفان، وتستمر الحرب حتى النهاية، ويعم الخراب المقضي به."]]}, {"l": "Zec 13:7", "n": "", "vs": [[7, "ويقول الرب القدير: «استيقظ أيها السيف وهاجم راعي ورجل رفقتي. اضرب الراعي فتتبدد الخراف. ولكني أرد يدي عن الصغار (أي القلة المؤمنة)."]]}, {"l": "Mat 26:28", "n": "", "vs": [[28, "فإن هذا هو دمي الذي للعهد الجديد والذي يسفك من أجل كثيرين لمغفرة الخطايا."]]}, {"l": "Rom 3:24-26", "n": "", "vs": [[24, "فهم يبررون مجانا، بنعمته، بالفداء بالمسيح يسوع"], [25, "الذي قدمه الله كفارة، عن طريق الإيمان، وذلك بدمه."], [26, "ليظهر بر الله إذ تغاضى، بإمهاله الإلهي، عن الخطايا التي حدثت في الماضي، ويظهر أيضا بره في الزمن الحاضر: فيتبين أنه بار وأنه يبرر من له الإيمان بيسوع."]]}, {"l": "Rom 4:25", "n": "", "vs": [[25, "الذي أسلم للموت من أجل معاصينا ثم أقيم من أجل تبريرنا."]]}, {"l": "Rom 8:3", "n": "", "vs": [[3, "فإن ما عجزت الشريعة عنه، لكون الجسد قد جعلها قاصرة عن تحقيقه، أتمه الله إذ أرسل ابنه، متخذا ما يشبه جسد الخطيئة ومكفرا عن الخطيئة فدان الخطيئة في الجسد"]]}, {"l": "Rom 8:4", "n": "", "vs": [[4, "حتى يتم فينا البر الذي تسعى إليه الشريعة، فينا نحن السالكين لا بحسب الجسد بل بحسب الروح."]]}, {"l": "2Co 5:21", "n": "", "vs": [[21, "فإن الذي لم يعرف خطيئة، جعله الله خطيئة لأجلنا، لنصير نحن بر الله فيه."]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Heb 7:26", "n": "", "vs": [[26, "نعم، هذا هو رئيس الكهنة الذي كنا محتاجين إليه. إنه قدوس، لا عيبة فيه، ولا نجاسة، قد انفصل عن الخاطئين، وارتفع حتى صار أسمى من السماوات."]]}, {"l": "Heb 7:27", "n": "", "vs": [[27, "وهو لا يحتاج إلى ما كان يحتاج إليه قديما كل رئيس كهنة: أن يقدم الذبائح يوميا للتكفير عن خطاياه الخاصة أولا، ثم عن خطايا الشعب، وذلك لأنه كفر عن خطاياهم مرة واحدة، حين قدم نفسه عنهم."]]}, {"l": "Heb 9:12", "n": "", "vs": [[12, "فإلى «قدس الأقداس» في هذه الخيمة، دخل المسيح مرة واحدة، حاملا دم نفسه، لا دم تيوس وعجول. وذلك بعدما سفك دمه عوضا عنا. فحقق فداء أبديا."]]}, {"l": "Heb 9:15", "n": "", "vs": [[15, "ولذلك، فالمسيح هو الوسيط لهذا العهد الجديد. فبما أنه قد تم الموت فداء للمخالفات الحاصلة تحت العهد الأول، ينال المدعوون الوعد بالإرث الأبدي."]]}, {"l": "Heb 9:26", "n": "", "vs": [[26, "وإلا لكان يجب أن يموت المسيح متألما مرات كثيرة منذ تأسيس العالم! ولكنه الآن، عند انتهاء الأزمنة، ظهر مرة واحدة ليبطل قوة الخطيئة بتقديم نفسه ذبيحة لله."]]}, {"l": "Heb 9:28", "n": "", "vs": [[28, "كذلك المسيح أيضا: مات مرة واحدة حاملا خطايا كثيرين، مقربا نفسه (لله) عوضا عنهم. ولا بد أن يعود إلى الظهور. لا ليعالج الخطايا، بل ليحقق الخلاص النهائي لجميع منتظريه!"]]}, {"l": "Heb 10:4-10", "n": "", "vs": [[4, "فمن المستحيل أن يزيل دم الثيران والتيوس خطايا الناس."], [5, "لذلك قال المسيح، عند مجيئه إلى هذه الأرض: «إن الذبائح والتقدمات ما أردتها. لكنك أعددت لي جسدا بشريا."], [6, "فالحيوانات التي كانت تذبح وتحرق أمامك تكفيرا عن الخطيئة، لم ترض بها."], [7, "عندئذ قلت لك: ها أنا آتي لأعمل إرادتك، ياالله . هذا هو المكتوب عني في صفحة الكتاب !»"], [8, "فبعد أن عبر المسيح عن عدم رضى الله بجميع التقدمات والذبائح التي كانت تقرب مع أنها كانت تقدم وفقا للشريعة،"], [9, "أضاف قائلا: «ها أنا آتي لأعمل إرادتك!» فهو، إذن، يلغي النظام السابق، ليضع محله نظاما جديدا ينسجم مع إرادة الله."], [10, "بموجب هذه الإرادة الإلهية، صرنا مقدسين إذ قرب يسوع المسيح، مرة واحدة، جسده عوضا عنا!"]]}, {"l": "1Pe 1:18-21", "n": "", "vs": [[18, "واعلموا أنه قد دفع الفدية ليحرركم من سيرة حياتكم الباطلة التي أخذتموها بالتقليد عن آبائكم. وهذه الفدية لم تكن شيئا فانيا كالفضة أو الذهب،"], [19, "بل كانت دما ثمينا، دم المسيح، ذلك الحمل الطاهر الذي ليس فيه عيب ولا دنس!"], [20, "ومع أن الله كان قد عين المسيح لهذا الغرض قبل تأسيس العالم، فهو لم يعلنه إلا في هذا الزمن الأخير لفائدتكم"], [21, "أنتم الذين تؤمنون بالله بالمسيح الذي أقامه من الموت وأعطاه المجد، حتى يكون الله غاية إيمانكم ورجائكم."]]}, {"l": "1Pe 2:24", "n": "", "vs": [[24, "وهو نفسه حمل خطايانا في جسده (عندما مات مصلوبا) على الخشبة، لكي نموت بالنسبة للخطايا فنحيا حياة البر. وبجراحه هو تم لكم الشفاء،"]]}, {"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}, {"l": "1Jo 2:1", "n": "", "vs": [[1, "ياأولادي الصغار، أكتب إليكم هذه الأمور لكي لا تخطئوا. ولكن، إن أخطأ أحدكم، فلنا عند الآب شفيع هو يسوع المسيح البار."]]}, {"l": "1Jo 2:2", "n": "", "vs": [[2, "فهو كفارة لخطايانا، لا لخطايانا فقط، بل لخطايا العالم كله."]]}, {"l": "1Jo 4:10", "n": "", "vs": [[10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."]]}, {"l": "Rev 1:5", "n": "", "vs": [[5, "ومن يسوع المسيح الشاهد الأمين، بكر القائمين من بين الأموات، ملك ملوك الأرض، ذاك الذي بدافع محبته لنا مات لأجلنا فغسلنا بدمه من خطايانا،"]]}, {"l": "Rev 5:9", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"]]}, {"l": "Rev 13:8", "n": "", "vs": [[8, "فيسجد للوحش جميع سكان الأرض الذين لم تكتب أسماؤهم منذ تأسيس العالم في سجل الحياة للحمل الذي ذبح."]]}], "kwAr": "حررنا بالفداء", "noteAr": ""}, {"kw": "being", "raw": "2Ki_22:19; Jer_44:22, Jer_49:13; Rom_9:3", "note": "", "refs": [{"l": "2Ki 22:19", "n": "", "vs": [[19, "من حيث أن قلبك قد رق، وتواضعت أمام الرب لدى سماعك ما قضيت به على هذا الموضع وعلى أهله، بأن يصيروا مثار دهشة ولعنة، ومزقت ثيابك وبكيت أمامي، فإنني قد استجبت أنا أيضا رجاءك."]]}, {"l": "Jer 44:22", "n": "", "vs": [[22, "فلم يطق الرب بعد تحمل ما ارتكبتم من شر وما اقترفتم من أرجاس، فصارت أرضكم أطلالا ومثار دهشة ولعنة ومهجورة كالعهد بها في هذا اليوم."]]}, {"l": "Jer 49:13", "n": "", "vs": [[13, "ها أنا قد أقسمت بنفسي، يقول الرب، أن تصبح بصرة عرضة للرعب والعار والخراب واللعنة، وتغدو مدنها خرائب دائمة."]]}, {"l": "Rom 9:3", "n": "", "vs": [[3, "فقد كنت أتمنى لو أكون أنا نفسي محروما من المسيح في سبيل إخوتي، بني جنسي حسب الجسد."]]}], "kwAr": "إذ صار لعنة", "noteAr": ""}, {"kw": "for", "raw": "Deu_21:23; 2Sa_17:23, 2Sa_18:10,2Sa_18:14, 2Sa_18:15, 2Sa_21:3, 2Sa_21:9; Est_7:10, Est_9:14; Mat_27:5; 1Pe_2:24", "note": "", "refs": [{"l": "Deu 21:23", "n": "", "vs": [[23, "فلا تبت جثته على الخشبة، بل ادفنوه في نفس ذلك اليوم، لأن المعلق ملعون من الله. فلا تنجسوا أرضكم التي يهبها لكم الرب ميراثا."]]}, {"l": "2Sa 17:23", "n": "", "vs": [[23, "وعندما رأى أخيتوفل أن مشورته لم يعمل بها، ركب حماره وتوجه إلى بيته في مسقط رأسه، ثم نظم شؤون عائلته، وخنق نفسه فمات، ودفن في قبر أبيه."]]}, {"l": "2Sa 18:10", "n": "", "vs": [[10, "فرآه رجل وأخبر يوآب: «رأيت أبشالوم معلقا بشجرة البلوط»."]]}, {"l": "2Sa 18:14", "n": "", "vs": [[14, "فقال يوآب: «لا يمكنني أن أصبر هكذا أمامك» وأخذ بيده ثلاثة سهام أنشبها في قلب أبشالوم، وهو ما برح حيا معلقا بشجرة البلوط."]]}, {"l": "2Sa 18:15", "n": "", "vs": [[15, "ثم أحاط بالشجرة عشرة غلمان، حاملي سلاح يوآب، وأجهزوا على أبشالوم فمات."]]}, {"l": "2Sa 21:3", "n": "", "vs": [[3, "وقال داود لهم: «ماذا أصنع لكم؟» كيف يمكن أن أعوض عما نالكم من ضرر، فتدعون بالبركة لميراث الرب؟»"]]}, {"l": "2Sa 21:9", "n": "", "vs": [[9, "وسلمهم إلى الجبعونيين، فصلبوهم على الجبل في حضرة الرب. فقتل السبعة معا في بداية موسم حصاد الشعير."]]}, {"l": "Est 7:10", "n": "", "vs": [[10, "فصلبوا هامان على الخشبة التي أعدها لمردخاي. ثم هدأت سورة غضب الملك."]]}, {"l": "Est 9:14", "n": "", "vs": [[14, "فأمر الملك بتنفيذ الطلب، وأصدر مرسوما بذلك في شوشن العاصمة، وصلبوا أبناء هامان العشرة."]]}, {"l": "Mat 27:5", "n": "", "vs": [[5, "فألقى قطع الفضة في الهيكل وانصرف، ثم ذهب وشنق نفسه."]]}, {"l": "1Pe 2:24", "n": "", "vs": [[24, "وهو نفسه حمل خطايانا في جسده (عندما مات مصلوبا) على الخشبة، لكي نموت بالنسبة للخطايا فنحيا حياة البر. وبجراحه هو تم لكم الشفاء،"]]}], "kwAr": "عوضا عنا", "noteAr": ""}, {"kw": "Cursed", "raw": "Jos_10:26, Jos_10:27", "note": "", "refs": [{"l": "Jos 10:26", "n": "", "vs": [[26, "ثم قتلهم يشوع بعد ذلك وعلق جثثهم على خمسة أشجار، حتى المساء."]]}, {"l": "Jos 10:27", "n": "", "vs": [[27, "وعند غروب الشمس أمر يشوع فأنزلوهم عنها وطرحوهم في الكهف الذي لجأوا إليه وسدوا مدخله بحجارة كبيرة باقية إلى هذا اليوم."]]}], "kwAr": "ملعون كل من علق على خشبة", "noteAr": ""}], "arS": [["إن ", []], ["المسيح", ["G5547"]], [" ", []], ["حررنا بالفداء", ["G1805"]], [" من ", []], ["لعنة", ["G2671"]], [" ", []], ["الشريعة", ["G3551"]], ["، إذ ", []], ["صار", ["G1096"]], [" ", []], ["لعنة", ["G2671"]], [" عوضا عنا، لأنه قد ", []], ["كتب", ["G1125"]], [": «", []], ["ملعون", ["G1944"]], [" ", []], ["كل", ["G3956"]], [" من ", []], ["علق", ["G2910"]], [" على ", []], ["خشبة", ["G3586"]], ["»،", []]]}, {"c": 3, "v": 14, "text": "لكي تصل بركة إبراهيم إلى الأمم في المسيح يسوع، فننال عن طريق الإيمان الروح الموعود.", "groups": [{"kw": "the blessing", "raw": "Gal_3:6-9, Gal_3:29; Gen_12:2, Gen_12:3; Isa_41:8, Isa_51:2, Isa_51:3; Rom_4:3-17", "note": "", "refs": [{"l": "Gal 3:6-9", "n": "", "vs": [[6, "كذلك «آمن إبراهيم بالله، فحسب له ذلك برا»."], [7, "فاعلموا إذن أن الذين هم على مبدأ الإيمان هم أبناء إبراهيم فعلا."], [8, "ثم إن الكتاب، إذ سبق فرأى أن الله سوف يبرر الأمم على أساس الإيمان، بشر إبراهيم سلفا بقوله: «فيك تتبارك جميع الأمم!»"], [9, "إذن الذين هم على مبدأ الإيمان يباركون مع إبراهيم المؤمن."]]}, {"l": "Gal 3:29", "n": "", "vs": [[29, "فإذا كنتم للمسيح، فأنتم إذن نسل إبراهيم وحسب الوعد وارثون."]]}, {"l": "Gen 12:2", "n": "", "vs": [[2, "فأجعل منك أمة كبيرة وأباركك وأعظم اسمك، وتكون بركة (لكثيرين)."]]}, {"l": "Gen 12:3", "n": "", "vs": [[3, "وأبارك مباركيك وألعن لاعنيك، وتتبارك فيك جميع أمم الأرض»."]]}, {"l": "Isa 41:8", "n": "", "vs": [[8, "أما أنت ياإسرائيل عبدي. يايعقوب الذي اصطفيته، ياذرية إبراهيم خليلي،"]]}, {"l": "Isa 51:2", "n": "", "vs": [[2, "انظروا إلى إبراهيم أبيكم وإلى سارة التي أنجبتكم، فقد دعوته حين كان فردا واحدا وباركته وأكثرته."]]}, {"l": "Isa 51:3", "n": "", "vs": [[3, "الرب يعزي صهيون ويعزي خرائبها، ويحول قفرها إلى عدن وصحر اءها إلى جنة رائعة، فتفيض بالفر ح والغبطة والشكر وهتاف ترنيم."]]}, {"l": "Rom 4:3-17", "n": "", "vs": [[3, "لأنه ماذا يقول الكتاب؟ «فآمن إبراهيم بالله، فحسب له ذلك برا»."], [4, "إن الذي يعمل، لا تحسب له الأجرة من قبيل النعمة بل من قبيل الدين. أما الذي لا يعمل"], [5, "وإنما يؤمن بمن يبرر الأثيم، فإن إيمانه يحسب له برا."], [6, "كما يهنيء داود أيضا الإنسان الذي يحسب له الله برا بمعزل عن الأعمال، إذ يقول:"], [7, "«طوبى للذين غفرت آثامهم وسترت خطاياهم."], [8, "طوبى للرجل الذي لا يحسب له الرب خطيئة!»"], [9, "فهل هذه الطوبى لأهل الختان وحدهم، أم لأهل عدم الختان أيضا؟ إننا نقول إن الإيمان قد حسب لإبراهيم برا."], [10, "ففي أية حالة حسب له ذلك؟ أبعد الختان أم قبل الختان؟"], [11, "ثم تلقى إبراهيم علامة الختان ختما للبر الحاصل بالإيمان الذي كان له وهو مازال غير مختون، لكي يكون أبا لجميع الذين يؤمنون من غير المختونين فيحسب البر لهم أيضا،"], [12, "وأبا للمختونين الذين ليسوا من أهل الختان وحسب بل الذين يسيرون في خطى الإيمان الذي كان لأبينا إبراهيم وهو بعد غير مختون."], [13, "فليس على أساس الشريعة كان الوعد لإبراهيم، أو لنسله، بأن يكون وارثا للعالم، وإنما على أساس البر الذي بالإيمان."], [14, "فلو كان أهل الشريعة هم أصحاب الإرث، لصار الإيمان بلا فاعلية ونقض الوعد."], [15, "لأن الشريعة إنما تنتج الغضب؛ فلولا الشريعة لما ظهرت المخالفة."], [16, "لذلك، فإن الوعد هو على أساس الإيمان ليكون بحسب النعمة، بقصد أن يكون مضمونا للنسل كله: ليس لأهل الشريعة وحدهم، بل أيضا لأهل الإيمان الذي كان لإبراهيم. فإنه أب لنا جميعا،"], [17, "كما قد كتب: «إني جعلتك أبا لأمم كثيرة». (إنه أب لنا) في نظر الله الذي به آمن، والذي يحيي الموتى ويستدعي إلى الوجود ما كان غير موجود."]]}], "kwAr": "بركة إبراهيم", "noteAr": ""}, {"kw": "through", "raw": "Gal_3:16; Gen_22:18; Isa_49:6, Isa_52:10; Luk_2:10,Luk_2:11; Act_2:39, Act_3:25, Act_3:26, Act_4:12; Rom_10:9-15; 1Ti_2:4-6", "note": "", "refs": [{"l": "Gal 3:16", "n": "", "vs": [[16, "وقد وجهت الوعود لإبراهيم ونسله، ولا يقول «وللأنسال» كأنه يشير إلى كثيرين، بل يشير إلى واحد، إذ يقول «ولنسلك»، يعني المسيح."]]}, {"l": "Gen 22:18", "n": "", "vs": [[18, "وبذريتك تتبارك جميع أمم الأرض، لأنك أطعتني»."]]}, {"l": "Isa 49:6", "n": "", "vs": [[6, "لكم هو يسير أن تكون لي عبدا لتستنهض أسباط يعقوب، وترد من نجيت من إسرائيل، لذلك سأجعلك نورا للأمم لتكون خلاصي إلى أقصى الأرض."]]}, {"l": "Isa 52:10", "n": "", "vs": [[10, "شمر الرب عن ذراع قدسه أمام عيون كل الأمم، فترى أقاصي الأرض خلاص إلهنا."]]}, {"l": "Luk 2:10", "n": "", "vs": [[10, "فقال لهم الملاك: «لا تخافوا! فها أنا أبشركم بفرح عظيم يعم الشعب كله:"]]}, {"l": "Luk 2:11", "n": "", "vs": [[11, "فقد ولد لكم اليوم في مدينة داود مخلص هو المسيح الرب."]]}, {"l": "Act 2:39", "n": "", "vs": [[39, "لأن الوعد هو لكم ولأولادكم وللبعيدين جميعا، يناله كل من يدعوه الرب إلهنا!»"]]}, {"l": "Act 3:25", "n": "", "vs": [[25, "وأنتم أحفاد هؤلاء الأنبياء، وأبناء العهد الذي أبرمه الله لآبائنا عندما قال لإبراهيم: بنسلك تنال البركة شعوب الأرض كلها."]]}, {"l": "Act 3:26", "n": "", "vs": [[26, "فمن أجلكم أولا أقام الله فتاه يسوع وأرسله ليبارككم برد كل واحد منكم عن شروره»."]]}, {"l": "Act 4:12", "n": "", "vs": [[12, "وليس بأحد غيره الخلاص، إذ ليس تحت السماء اسم آخر قدمه الله للبشر به يجب أن نخلص!»"]]}, {"l": "Rom 10:9-15", "n": "", "vs": [[9, "أنك إن اعترفت بفمك بيسوع ربا، وآمنت في قلبك بأن الله أقامه من الأموات، نلت الخلاص."], [10, "فإن الإيمان في القلب يؤدي إلى البر، والاعتراف بالفم يؤيد الخلاص،"], [11, "لأن الكتاب يقول: «كل من هو مؤمن به، لا يخيب»."], [12, "فلا فرق بين اليهودي واليوناني، لأن للجميع ربا واحدا، غنيا تجاه كل من يدعوه»."], [13, "«فإن كل من يدعو باسم الرب يخلص»."], [14, "ولكن، كيف يدعون من لم يؤمنوا به؟ وكيف يؤمنون بمن لم يسمعوا به؟ وكيف يسمعون بلا مبشر؟"], [15, "وكيف يبشر أحد إلا إذا كان قد أرسل؟ كما قد كتب: «ما أجمل أقدام المبشرين بالخيرات!»"]]}, {"l": "1Ti 2:4-6", "n": "", "vs": [[4, "فهو يريد لجميع الناس أن يخلصوا، ويقبلوا إلى معرفة الحق بالتمام:"], [5, "فإن الله واحد، والوسيط بين الله والناس واحد، وهو الإنسان المسيح يسوع،"], [6, "الذي بذل نفسه فدية عوضا عن الجميع. هذه شهادة تؤدى في أوقاتها الخاصة،"]]}], "kwAr": "في المسيح يسوع", "noteAr": ""}, {"kw": "might", "raw": "Gal_3:2, Gal_3:5, Gal_4:6; Isa_32:15, Isa_44:3, Isa_44:4, Isa_59:19-21; Jer_31:33, Jer_32:40; Eze_11:19; Eze_36:26, Eze_36:27, Eze_39:29; Joe_2:28, Joe_2:29; Zec_12:10; Luk_11:13, Luk_24:49; Joh_7:39; Act_1:4, Act_1:5, Act_2:33, Act_2:38, Act_5:32, Act_10:45-47, Act_11:15, Act_11:16; Rom_8:9-16, Rom_8:26; Rom_8:27; 1Co_12:13; 2Co_1:22; Eph_1:13, Eph_1:14, Eph_2:18, Eph_2:22, Eph_3:16, Eph_4:30; 1Pe_1:22; Jud_1:19, Jud_1:20", "note": "", "refs": [{"l": "Gal 3:2", "n": "", "vs": [[2, "أريد أن أستعلم منكم هذا الأمر فقط: أعلى أساس العمل بما في الشريعة نلتم الروح، أم على أساس الإيمان بالبشارة؟"]]}, {"l": "Gal 3:5", "n": "", "vs": [[5, "فذاك الذي يهبكم الروح، ويجري معجزات في ما بينكم، أيفعل ذلك على أساس أعمال الشريعة أم على أساس الإيمان بالبشارة؟"]]}, {"l": "Gal 4:6", "n": "", "vs": [[6, "وبما أنكم أبناء له، أرسل الله إلى قلوبنا روح ابنه، مناديا: «أبا، ياأبانا»."]]}, {"l": "Isa 32:15", "n": "", "vs": [[15, "حتى تنسكب علينا روح من السماء، فتتحول البرية إلى مرج مخصب، ويحسب المرج غابة."]]}, {"l": "Isa 44:3", "n": "", "vs": [[3, "لأني سأسكب ماء على الأرض الظمأى، وأجري السيول على التربة اليابسة، وأفيض بروحي على ذريتك، وبركاتي على نسلك."]]}, {"l": "Isa 44:4", "n": "", "vs": [[4, "فينبتون بين العشب مزهرين كالصفصاف عند مجاري المياه."]]}, {"l": "Isa 59:19-21", "n": "", "vs": [[19, "فيتقون من المغرب اسم الرب، ومن المشرق يخشون مجد الرب، لأنه سيأتي العدو كنهر متدفق فتدفعه ريح الرب."], [20, "ويقبل الفادي إلى صهيون، وإلى التائبين عن معاصيهم من ذرية يعقوب، يقول الرب."], [21, "أما أنا يقول الرب، فهذا عهدي معهم: إن روحي الحال عليك وكلامي الذي لقنتك إياه، لا يزول من فمك أو من فم أبنائك أو أحفادك، من الآن وإلى الأبد."]]}, {"l": "Jer 31:33", "n": "", "vs": [[33, "ولكن هذا هو العهد الذي أبرمه مع ذرية إسرائيل بعد تلك الأيام»، يقول الرب: «سأجعل شريعتي في دواخلهم، وأدونها على قلوبهم وأكون لهم إلها وهم يكونون لي شعبا."]]}, {"l": "Jer 32:40", "n": "", "vs": [[40, "وأبرم معهم عهدا أبديا أن لا أكف عن الإحسان إليهم، وأضع تقواي في قلوبهم لئلا يرتدوا عني،"]]}, {"l": "Eze 11:19", "n": "", "vs": [[19, "وأعطيهم جميعا قلبا واحدا، وأجعل في داخلهم روحا جديدا، وأزيل قلب الحجر من لحمهم. وأستبدله بقلب من لحم،"]]}, {"l": "Eze 36:26", "n": "", "vs": [[26, "وأهبكم قلبا جديدا، وأضع في داخلكم روحا جديدة، وأنتزع من لحمكم قلب الحجر وأعطيكم عوضا عنه قلب لحم."]]}, {"l": "Eze 36:27", "n": "", "vs": [[27, "وأضع روحي في داخلكم فأجعلكم تمارسون فرائضي وتطيعون أحكامي عاملين بها،"]]}, {"l": "Eze 39:29", "n": "", "vs": [[29, "ولا أعود أحجب وجهي عنهم لأني أسكب روحي على شعب إسرائيل يقول السيد الرب»."]]}, {"l": "Joe 2:28", "n": "", "vs": [[28, "ثم أسكب روحي على كل بشر، فيتنبأ أبناؤكم وبناتكم، ويحلم شيوخكم أحلاما ويرى شبابكم رؤى."]]}, {"l": "Joe 2:29", "n": "", "vs": [[29, "وأسكب في تلك الأيام أيضا روحي على العبيد والإماء."]]}, {"l": "Zec 12:10", "n": "", "vs": [[10, "وأفيض على ذرية داود وعلى سكان أورشليم روح النعمة والابتهال، حتى إذا نظروا إلي أنا الذي طعنوه ينوحون عليه كما ينوح والد على ولده الوحيد، متفجعين عليه كتفجعهم على موت بكرهم."]]}, {"l": "Luk 11:13", "n": "", "vs": [[13, "فإن كنتم، أنتم الأشرار، تعرفون أن تعطوا أولادكم عطايا جيدة، فكم بالأحرى الآب، الذي من السماء يهب الروح القدس لمن يسألونه؟ »"]]}, {"l": "Luk 24:49", "n": "", "vs": [[49, "وها أنا سأرسل إليكم ما وعد به أبي. ولكن أقيموا في المدينة حتى تلبسوا القوة من الأعالي!»"]]}, {"l": "Joh 7:39", "n": "", "vs": [[39, "قال يسوع هذا عن الروح القدس الذي كان المؤمنون به سيقبلونه. ولم يكن الروح قد أعطي بعد لأن يسوع لم يكن قد تمجد بعد."]]}, {"l": "Act 1:4", "n": "", "vs": [[4, "وبينما كان مجتمعا معهم، قال: «لا تتركوا أورشليم، بل ابقوا فيها منتظرين إتمام وعد الآب، الذي سبق أن حدثتكم عنه."]]}, {"l": "Act 1:5", "n": "", "vs": [[5, "فإن يوحنا عمد الناس بالماء؛ أما أنتم فستتعمدون بعد أيام قليلة بالروح القدس!»"]]}, {"l": "Act 2:33", "n": "", "vs": [[33, "وإذ رفع إلى يمين الله، وأخذ من الآب الروح القدس الموعود به، أفاضه علينا. وما ترونه الآن وتسمعونه هو نتيجة لذلك."]]}, {"l": "Act 2:38", "n": "", "vs": [[38, "أجابهم بطرس: «توبوا، وليتعمد كل واحد منكم باسم يسوع المسيح، فيغفر الله خطاياكم وتنالوا هبة الروح القدس،"]]}, {"l": "Act 5:32", "n": "", "vs": [[32, "ونحن نشهد على هذا، وكذلك يشهد الروح القدس الذي وهبه الله للذين يطيعونه»."]]}, {"l": "Act 10:45-47", "n": "", "vs": [[45, "فدهش المؤمنون اليهود الذين جاءوا برفقة بطرس، لأن هبة الروح القدس فاضت أيضا على غير اليهود،"], [46, "إذ سمعوهم يتكلمون بلغات، ويسبحون الله . فقال بطرس:"], [47, "«أيستطيع أحد أن يمنع الماء فلا يتعمد أيضا هؤلاء الذين نالوا الروح القدس مثلنا؟»"]]}, {"l": "Act 11:15", "n": "", "vs": [[15, "ولما ابتدأت أتكلم، حل الروح القدس عليهم كما حل علينا في البداية"]]}, {"l": "Act 11:16", "n": "", "vs": [[16, "فتذكرت ما قاله الرب لنا: إن يوحنا عمد بالماء، وأما أنتم فستتعمدون بالروح القدس."]]}, {"l": "Rom 8:9-16", "n": "", "vs": [[9, "وأما أنتم، فلستم تحت سلطة الجسد بل تحت سلطة الروح، إذا كان روح الله ساكنا في داخلكم حقا. ولكن، إن كان أحد ليس له روح المسيح، فهو ليس للمسيح."], [10, "وإذا كان المسيح فيكم، فمع أن الجسد مائت بسبب الخطيئة، فإن الروح حياة لكم بسبب البر."], [11, "وإذا كان روح الذي أقام يسوع من بين الأموات يسكن فيكم، فإن الذي أقام المسيح من بين الأموات سوف يحيي أيضا أجسادكم الفانية بسبب روحه الذي يسكن فيكم."], [12, "فليس علينا إذن، أيها الإخوة، أي التزام نحو الجسد لنعيش بحسب الجسد."], [13, "لأنه إن عشتم بحسب الجسد، فإنكم ستموتون، ولكن إن كنتم بالروح تميتون أعمال الجسد، فستحيون."], [14, "فإن جميع الخاضعين لقيادة روح الله، هم أبناء لله."], [15, "إذ إنكم لم تنالوا روح عبودية يعيدكم إلى الخوف، بل نلتم روح بنوة به نصرخ: «أبا! أبانا!»"], [16, "فالروح نفسه يشهد مع أرواحنا بأننا أولاد الله."]]}, {"l": "Rom 8:26", "n": "", "vs": [[26, "وكذلك الروح أيضا يمدنا بالعون لنقهر ضعفنا. فإننا لا نعلم ما يجب أن نصلي لأجله كما يليق، ولكن الروح نفسه يؤدي الشفاعة عنا بأنات تفوق التعبير."]]}, {"l": "Rom 8:27", "n": "", "vs": [[27, "على أن فاحص القلوب يعلم قصد الروح، لأن الروح يشفع في القديسين بما يوافق الله ."]]}, {"l": "1Co 12:13", "n": "", "vs": [[13, "فإننا، بالروح الواحد، قد تعمدنا جميعا لنصير جسدا واحدا، سواء كنا يهودا أم يونانيين، عبيدا أم أحرارا، وقد سقينا جميعا الروح الواحد."]]}, {"l": "2Co 1:22", "n": "", "vs": [[22, "وهو أيضا قد وضع ختمه علينا، ووهبنا الروح القدس عربونا في قلوبنا."]]}, {"l": "Eph 1:13", "n": "", "vs": [[13, "وفيه أنتم أيضا (وضعتم رجاءكم) إذ سمعتم كلمة الحق، أي الإنجيل الذي فيه خلاصكم؛ كذلك فيه أيضا ختمتم، إذ آمنتم، بالروح القدس الموعود،"]]}, {"l": "Eph 1:14", "n": "", "vs": [[14, "هذا الروح الذي هو عربون ميراثنا إلى أن يتم فداء ما قد اقتني: بغر ض مدح مجده."]]}, {"l": "Eph 2:18", "n": "", "vs": [[18, "فبه لنا كلينا اقتراب إلى الآب بروح واحد."]]}, {"l": "Eph 2:22", "n": "", "vs": [[22, "وفيه أنتم أيضا قد بنيتم معا فصرتم مسكنا لله بوجود الروح."]]}, {"l": "Eph 3:16", "n": "", "vs": [[16, "لكي يمنحكم، وفقا لغنى مجده، أن يمد الروح الكيان الداخلي في كل منكم بالقوة المؤيدة،"]]}, {"l": "Eph 4:30", "n": "", "vs": [[30, "ولا تحزنوا روح الله، الروح القدس الذي به ختمتم ليوم الفداء."]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}, {"l": "Jud 1:19", "n": "", "vs": [[19, "هؤلاء هم الذين يسببون الانشقاق، وينساقون وراء غرائزهم الحيوانية، وليس الروح القدس فيهم!"]]}, {"l": "Jud 1:20", "n": "", "vs": [[20, "وأما أنتم أيها الأحباء، فابنوا أنفسكم على إيمانكم الأقدس، وصلوا دائما في الروح القدس."]]}], "kwAr": "فننال", "noteAr": ""}], "arS": [["لكي تصل ", []], ["بركة", ["G2129"]], [" ", []], ["إبراهيم", ["G11"]], [" إلى ", []], ["الأمم", ["G1484"]], [" في ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], ["، ", []], ["فننال", ["G2983"]], [" عن طريق ", []], ["الإيمان", ["G4102"]], [" ", []], ["الروح", ["G4151"]], [" ", []], ["الموعود", ["G1860"]], [".", []]]}, {"c": 3, "v": 15, "text": "أيها الإخوة، بمنطق البشر أقول إنه حتى العهد الذي يقره إنسان، لا أحد يلغيه أو يزيد عليه.", "groups": [{"kw": "I speak", "raw": "Rom_6:19; 1Co_15:32", "note": "", "refs": [{"l": "Rom 6:19", "n": "", "vs": [[19, "أتكلم بشريا هنا بسبب ضعفكم البشري. فكما قدمتم سابقا أعضاءكم عبيدا للنجاسة والإثم في خدمة الإثم، كذلك قدموا الآن أعضاءكم عبيدا للبر في خدمة القداسة."]]}, {"l": "1Co 15:32", "n": "", "vs": [[32, "ولو كنت بمنطق البشر قد تعرضت للموت في أفسس بين مخالب الوحوش، فأي نفع يعود علي إن كان الذين يموتون لا يقومون؟ ولم لا «نأكل ونشرب، لأننا غدا نموت؟»"]]}], "kwAr": "بمنطق البشر أقول", "noteAr": ""}, {"kw": "it be", "raw": "Heb_9:17", "note": "", "refs": [{"l": "Heb 9:17", "n": "", "vs": [[17, "إذ لا قوة للوصية على الإطلاق مادام صاحبها حيا. فلا تثبت الوصية إلا بموت صاحبها."]]}], "kwAr": "حتى", "noteAr": ""}, {"kw": "covenant", "raw": "or, testament", "note": "or, testament", "refs": [], "kwAr": "العهد الذي يقره إنسان", "noteAr": "أو: وصية."}], "arS": [["أيها ", []], ["الإخوة", ["G80"]], ["، ", []], ["بمنطق", ["G2596"]], [" ", []], ["البشر", ["G444"]], [" ", []], ["أقول", ["G3004"]], [" إنه حتى ", []], ["العهد", ["G1242"]], [" الذي ", []], ["يقره", ["G2964"]], [" ", []], ["إنسان", ["G444"]], ["، لا ", []], ["أحد", ["G3762"]], [" ", []], ["يلغيه", ["G114"]], [" أو ", []], ["يزيد عليه", ["G1928"]], [".", []]]}, {"c": 3, "v": 16, "text": "وقد وجهت الوعود لإبراهيم ونسله، ولا يقول «وللأنسال» كأنه يشير إلى كثيرين، بل يشير إلى واحد، إذ يقول «ولنسلك»، يعني المسيح.", "groups": [{"kw": "to", "raw": "Gal_3:8; Gen_12:3, Gen_12:7, Gen_13:15, Gen_13:16, Gen_15:5, Gen_17:7, Gen_17:8, Gen_21:12, Gen_22:17, Gen_22:18, Gen_26:3, Gen_26:4, Gen_28:13; Gen_28:14, Gen_49:10", "note": "", "refs": [{"l": "Gal 3:8", "n": "", "vs": [[8, "ثم إن الكتاب، إذ سبق فرأى أن الله سوف يبرر الأمم على أساس الإيمان، بشر إبراهيم سلفا بقوله: «فيك تتبارك جميع الأمم!»"]]}, {"l": "Gen 12:3", "n": "", "vs": [[3, "وأبارك مباركيك وألعن لاعنيك، وتتبارك فيك جميع أمم الأرض»."]]}, {"l": "Gen 12:7", "n": "", "vs": [[7, "وظهر الرب لأبرام وقال له: «سأعطي هذه الأرض لذريتك». فبنى أبرام هناك مذبحا للرب الذي ظهر له."]]}, {"l": "Gen 13:15", "n": "", "vs": [[15, "فإن هذه الأرض التي تراها، سأعطيها لك ولذريتك إلى الأبد."]]}, {"l": "Gen 13:16", "n": "", "vs": [[16, "وسأجعل نسلك كتراب الأرض، فإن استطاع أحد أن يحصي تراب الأرض يقدر آنئذ أن يحصي نسلك"]]}, {"l": "Gen 15:5", "n": "", "vs": [[5, "وأخر جه الرب إلى الخارج وقال: «انظر إلى السماء وعد النجوم إن استطعت ذلك». ثم قال له: «هكذا يكون نسلك»."]]}, {"l": "Gen 17:7", "n": "", "vs": [[7, "وأقيم عهدي الأبدي بيني وبينك، وبين نسلك من بعدك جيلا بعد جيل، فأكون إلها لك ولنسلك من بعدك."]]}, {"l": "Gen 17:8", "n": "", "vs": [[8, "وأهبك أنت وذريتك من بعدك جميع أرض كنعان، التي نزلت فيها غريبا، ملكا أبديا. وأكون لهم إلها»."]]}, {"l": "Gen 21:12", "n": "", "vs": [[12, "فقال الله له: «لا يسوء في نفسك أمر الصبي أو أمر جاريتك، واسمع لكلام سارة في كل ما تشير به عليك لأنه بإسحق يدعى لك نسل."]]}, {"l": "Gen 22:17", "n": "", "vs": [[17, "لأباركنك وأكثرن ذريتك فتكون كنجوم السماء وكرمل شاطيء البحر، وترث ذريتك مدن أعدائها."]]}, {"l": "Gen 22:18", "n": "", "vs": [[18, "وبذريتك تتبارك جميع أمم الأرض، لأنك أطعتني»."]]}, {"l": "Gen 26:3", "n": "", "vs": [[3, "أقم في هذه الأرض فأكون معك وأباركك، لأنني أعطي لك ولذريتك جميع هذه الأرض وفاء بقسمي الذي أقسمت لإبراهيم أبيك."]]}, {"l": "Gen 26:4", "n": "", "vs": [[4, "وأكثر ذريتك كنجوم السماء وأهبها جميع هذه البلاد. وتتبارك في نسلك جميع أمم الأرض."]]}, {"l": "Gen 28:13", "n": "", "vs": [[13, "والرب نفسه واقف فوقها يقول: «أنا هو الرب إله أبيك إبراهيم وإله إسحق. إن الأرض التي ترقد عليها الآن أعطيها لك ولذريتك،"]]}, {"l": "Gen 28:14", "n": "", "vs": [[14, "التي ستكون كتراب الأرض، وتمتد غربا وشرقا، وشمالا وجنوبا، وتتبارك بك وبذريتك جميع شعوب الأرض."]]}, {"l": "Gen 49:10", "n": "", "vs": [[10, "لا يزول صولجان الملك من يهوذا ولا مشترع من صلبه حتى يأتي شيلوه (ومعناه: من له الأمر) فتطيعه الشعوب."]]}], "kwAr": "وجهت الوعود لإبراهيم ونسله", "noteAr": ""}, {"kw": "which", "raw": "Gal_3:27-29; Rom_12:5; 1Co_12:12, 1Co_12:27; Eph_4:15, Eph_4:16, Eph_5:29, Eph_5:30,Eph_5:32; Col_2:19; Col_3:11", "note": "", "refs": [{"l": "Gal 3:27-29", "n": "", "vs": [[27, "لأنكم، جميع الذين تعمدتم في المسيح، قد لبستم المسيح."], [28, "لا فرق بعد الآن بين يهودي ويوناني، أو عبد وحر، أو ذكر وأنثى، لأنكم جميعا واحد في المسيح يسوع."], [29, "فإذا كنتم للمسيح، فأنتم إذن نسل إبراهيم وحسب الوعد وارثون."]]}, {"l": "Rom 12:5", "n": "", "vs": [[5, "فكذلك نحن الكثيرين جسد واحد في المسيح، وكلنا أعضاء بعضنا لبعض."]]}, {"l": "1Co 12:12", "n": "", "vs": [[12, "فكما أن الجسد واحد وله أعضاء كثيرة، ولكن أعضاء الجسد كلها تشكل جسما واحدا مع أنها كثيرة، فكذلك حال المسيح أيضا."]]}, {"l": "1Co 12:27", "n": "", "vs": [[27, "فالواقع أنكم أنتم جميعا جسد المسيح، وأعضاء فيه كل بمفرده."]]}, {"l": "Eph 4:15", "n": "", "vs": [[15, "بل نتمسك بالحق في المحبة، فننمو في كل شيء نحو من هو الرأس، أي المسيح."]]}, {"l": "Eph 4:16", "n": "", "vs": [[16, "فمنه يستمد الجسد كله تماسكه وترابطه بمساندة كل مفصل وفقا لمقدار العمل المخصص لكل جزء، لينشيء نموا يؤول إلى بنيان الجسد بنيانا ذاتيا في المحبة."]]}, {"l": "Eph 5:29", "n": "", "vs": [[29, "فلا أحد يبغض جسده البتة، بل يغذيه ويعتني به، كما يعامل المسيح أيضا الكنيسة."]]}, {"l": "Eph 5:30", "n": "", "vs": [[30, "فإننا نحن أعضاء جسده."]]}, {"l": "Eph 5:32", "n": "", "vs": [[32, "هذا السر عظيم ولكنني أشير به إلى المسيح والكنيسة!"]]}, {"l": "Col 2:19", "n": "", "vs": [[19, "وهو غير ممسك بالرأس الذي منه يتلقى الجسد كله غذاءه وتماسكه بالمفاصل والأوصال، فينمو النمو الذي يمنحه الله ."]]}, {"l": "Col 3:11", "n": "", "vs": [[11, "وفيه لا فرق بين يوناني ويهودي، أو مختون وغير مختون، أو متحضر ومتخلف، أو عبد وحر، بل المسيح هو الكل وفي الكل."]]}], "kwAr": "يعني المسيح", "noteAr": ""}], "arS": [["وقد وجهت ", []], ["الوعود", ["G1860"]], [" ", []], ["لإبراهيم", ["G11"]], [" ", []], ["ونسله", ["G4690"]], ["، ولا ", []], ["يقول", ["G3004"]], [" «", []], ["وللأنسال", ["G4690"]], ["» كأنه يشير إلى ", []], ["كثيرين", ["G4183"]], ["، بل يشير إلى ", []], ["واحد", ["G1520"]], ["، إذ يقول «", []], ["ولنسلك", ["G4690"]], ["»، يعني ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 3, "v": 17, "text": "فما أقوله هو هذا: إن عهدا سبق أن أقره الله لا تنقضه الشريعة التي جاءت بعده بأربع مئة وثلاثين سنة، وكأنها تلغي الوعد.", "groups": [{"kw": "this", "raw": "Gal_5:16; 1Co_1:12, 1Co_7:29, 1Co_10:19; 2Co_9:6; Eph_4:17; Col_2:4", "note": "", "refs": [{"l": "Gal 5:16", "n": "", "vs": [[16, "إنما أقول: اسلكوا في الروح. وعندئذ لا تتممون شهوة الجسد أبدا."]]}, {"l": "1Co 1:12", "n": "", "vs": [[12, "أعني أن واحدا منكم يقول: «أنا مع بولس» وآخر: «أنا مع أبلوس»، وآخر: «أنا مع بطرس»، وآخر: «أنا مع المسيح»."]]}, {"l": "1Co 7:29", "n": "", "vs": [[29, "فإني، أيها الإخوة، أقول لكم إن الوقت يتقاصر. ففي ما يخص المسائل الأخرى، ليكن الذين لهم زوجات كأنهم بلا زوجات،"]]}, {"l": "1Co 10:19", "n": "", "vs": [[19, "فماذا أعني إذن؟ أأن ما ذبح للصنم له قيمة أو أن الصنم له قيمة؟"]]}, {"l": "2Co 9:6", "n": "", "vs": [[6, "فمن الحق أن من يزرع بالتقتير، يحصد أيضا بالتقتير، ومن يزرع بالبركات، يحصد أيضا بالبركات."]]}, {"l": "Eph 4:17", "n": "", "vs": [[17, "أقول هذا إذن، وأشهد في الرب، راجيا ألا تسلكوا فيما بعد كما يسلك الأمم في عقم ذهنهم،"]]}, {"l": "Col 2:4", "n": "", "vs": [[4, "أقول هذا حتى لا يضللكم أحد بكلام خداع."]]}], "kwAr": "فما أقوله هو هذا", "noteAr": ""}, {"kw": "the covenant", "raw": "Gen_15:18, Gen_17:7, Gen_17:8, Gen_17:19; Luk_1:68-79; Joh_1:17, Joh_8:56-58; Rom_3:25; 2Co_1:20; Heb_11:13, Heb_11:17-19, Heb_11:39, Heb_11:40; 1Pe_1:11, 1Pe_1:12, 1Pe_1:20", "note": "", "refs": [{"l": "Gen 15:18", "n": "", "vs": [[18, "في ذلك اليوم عقد الله ميثاقا مع أبرام قائلا: «سأعطي نسلك هذه الأرض من وادي العريش إلى النهر الكبير، نهر الفرات."]]}, {"l": "Gen 17:7", "n": "", "vs": [[7, "وأقيم عهدي الأبدي بيني وبينك، وبين نسلك من بعدك جيلا بعد جيل، فأكون إلها لك ولنسلك من بعدك."]]}, {"l": "Gen 17:8", "n": "", "vs": [[8, "وأهبك أنت وذريتك من بعدك جميع أرض كنعان، التي نزلت فيها غريبا، ملكا أبديا. وأكون لهم إلها»."]]}, {"l": "Gen 17:19", "n": "", "vs": [[19, "فأجاب الرب: «إن سارة زوجتك هي التي تلد لك ابنا وتدعو اسمه إسحق (ومعناه يضحك). وأقيم عهدي معه ومع ذريته من بعده عهدا أبديا."]]}, {"l": "Luk 1:68-79", "n": "", "vs": [[68, "«تبارك الرب إله إسرائيل، لأنه تفقد شعبه وعمل له فداء،"], [69, "وأقام لنا قرن خلاص في بيت داود فتاه،"], [70, "كما تكلم بلسان أنبيائه القديسين الذين جاءوا منذ القديم:"], [71, "خلاص من أعدائنا ومن أيدي جميع مبغضينا،"], [72, "ليتم الرحمة نحو آبائنا ويتذكر عهده المقدس"], [73, "ذلك القسم الذي أقسم لإبراهيم أبينا: بأن يمنحنا،"], [74, "بعد تخليصنا من أيدي أعدائنا، أن نعبده بلا خوف،"], [75, "بقداسة وبر أمامه، طوال حياتنا."], [76, "وأنت، أيها الطفل، سوف تدعى نبي العلي، لأنك ستتقدم أمام الرب لتعد طرقه،"], [77, "لتعطي شعبه المعرفة بأن الخلاص هو بمغفرة خطاياهم"], [78, "بفضل عواطف الرحمة لدى إلهنا، تلك التي تفقدنا بها الفجر المشرق من العلاء،"], [79, "ليضيء على القابعين في الظلام وظل الموت، ويهدي خطانا في طريق السلام»."]]}, {"l": "Joh 1:17", "n": "", "vs": [[17, "لأن الشريعة أعطيت على يد موسى، أما النعمة والحق فقد تواجدا بيسوع المسيح."]]}, {"l": "Joh 8:56-58", "n": "", "vs": [[56, "أبوكم إبراهيم ابتهج لرجائه أن يرى يومي، فرآه وفرح»"], [57, "فقال له اليهود: «ليس لك من العمر خمسون سنة بعد فكيف رأيت إبراهيم؟»"], [58, "أجابهم: الحق الحق أقول لكم: إنني كائن من قبل أن يكون إبراهيم»."]]}, {"l": "Rom 3:25", "n": "", "vs": [[25, "الذي قدمه الله كفارة، عن طريق الإيمان، وذلك بدمه."]]}, {"l": "2Co 1:20", "n": "", "vs": [[20, "فمهما كانت وعود الله، فإن فيه النعم لها كلها، وفيه الآمين بنا لأجل مجد الله."]]}, {"l": "Heb 11:13", "n": "", "vs": [[13, "هؤلاء جميعا، حافظوا على إيمانهم إلى النهاية. وماتوا قبل أن تتحقق وعود الله لهم في أثناء حياتهم. ولكنهم رأوها من بعيد، وتوقعوا تحقيقها كاملة في المستقبل. وإذ آمنوا بتلك الوعود الإلهية اعترفوا بأنهم ليسوا إلا غرباء على الأرض يزورونها زيارة عابرة."]]}, {"l": "Heb 11:17-19", "n": "", "vs": [[17, "وبالإيمان، إبراهيم أيضا، لما امتحنه الله ، قدم إسحاق ابنه. فإنه، إذ قبل وعود الله، قدم ابنه الوحيد ذبيحة،"], [18, "مع أن الله قال له: «بإسحاق سوف يكون لك نسل يحمل اسمك!»"], [19, "فقد آمن إبراهيم بأن الله قادر على إقامة إسحاق من الموت. والواقع أن إبراهيم استعاد ابنه من الموت، على سبيل المثال أو الرمز."]]}, {"l": "Heb 11:39", "n": "", "vs": [[39, "إن هؤلاء لم يحصلوا جميعا على تحقيق كل ما وعدهم الله به، مع أنهم حاصلون على شهادة حسنة من جهة الإيمان."]]}, {"l": "Heb 11:40", "n": "", "vs": [[40, "ولكن الله سبق فأعد لنا ما هو أفضل، وذلك حتى لا يكملوا بمعزل عنا."]]}, {"l": "1Pe 1:11", "n": "", "vs": [[11, "واجتهدوا لمعرفة الزمان والأحوال التي كان يشير إليها روح المسيح الذي كان عاملا فيهم، عندما شهد لهم مسبقا بما ينتظر المسيح من آلام، وبما يأتي بعدها من أمجاد."]]}, {"l": "1Pe 1:12", "n": "", "vs": [[12, "ولكن الله أوحى إليهم أن اجتهادهم لم يكن لمصلحتهم هم، بل لمصلحتكم أنتم. فقد كان ذلك من أجل البشارة التي نقلها إليكم في الزمان الحاضر مبشرون يؤيدهم الروح القدس المرسل من السماء. ويالها من أمور يتمنى حتى الملائكة أن يطلعوا عليها!"]]}, {"l": "1Pe 1:20", "n": "", "vs": [[20, "ومع أن الله كان قد عين المسيح لهذا الغرض قبل تأسيس العالم، فهو لم يعلنه إلا في هذا الزمن الأخير لفائدتكم"]]}], "kwAr": "إن عهدا سبق أن أقره الله", "noteAr": ""}, {"kw": "which", "raw": "Gen_15:13; Exo_12:40,Exo_12:41; Act_7:6", "note": "", "refs": [{"l": "Gen 15:13", "n": "", "vs": [[13, "فقال له الرب: «تيقن أن نسلك سيتغرب في أرض ليست لهم، فيستعبدهم أهلها ويذلونهم أربع مئة سنة."]]}, {"l": "Exo 12:40", "n": "", "vs": [[40, "وكانت مدة غربة بني إسرائيل التي أقاموها في مصر
