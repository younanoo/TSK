": "Act 20:23", "n": "", "vs": [[23, "إلا أن الروح القدس كان يعلن لي في كل مدينة أذهب إليها أن السجن والمصاعب تنتظرني"]]}, {"l": "Act 20:24", "n": "", "vs": [[24, "ولكني لا أحسب لحياتي أية قيمة، ما دمت أسعى إلى بلوغ غايتي وإتمام الخدمة التي كلفني إياها الرب يسوع: أن أشهد ببشارة نعمة الله."]]}, {"l": "Rom 6:6", "n": "", "vs": [[6, "فنحن نعلم هذا: أن الإنسان العتيق فينا قد صلب معه لكي يبطل جسد الخطيئة فلا نبقى عبيدا للخطيئة فيما بعد."]]}, {"l": "1Co 15:58", "n": "", "vs": [[58, "إذن، ياإخوتي الأحباء، كونوا راسخين غير متزحزحين، كثيري الاجتهاد في عمل الرب دائما، عالمين أن جهدكم في الرب ليس عبثا!"]]}, {"l": "2Co 5:14-16", "n": "", "vs": [[14, "فإن محبة المسيح تسيطر علينا، وقد حكمنا بهذا: مادام واحد قد مات عوضا عن الجميع، فمعنى ذلك أن الجميع ماتوا؛"], [15, "وهو قد مات عوضا عن الجميع حتى لا يعيش الأحياء في ما بعد لأنفسهم بل للذي مات عوضا عنهم ثم قام."], [16, "إذن، نحن منذ الآن لا نعرف أحدا معرفة بشرية. ولكن إن كنا قد عرفنا المسيح معرفة بشرية، فنحن الآن لا نعرفه هكذا بعد."]]}, {"l": "Phi 1:20", "n": "", "vs": [[20, "وفقا لما أتوقعه وأرجوه: أني لن أفشل في شيء، بل في كل جرأة وكما في كل حين فكذلك الآن أيضا، يتعظم المسيح في جسدي، سواء أكان بالحياة أم بالموت."]]}, {"l": "Phi 1:21", "n": "", "vs": [[21, "فالحياة عندي هي المسيح، والموت ربح لي."]]}, {"l": "Phi 3:8", "n": "", "vs": [[8, "بل إني أعتبر كل شيء خسارة، من أجل امتياز معرفة المسيح يسوع ربي؛ فمن أجله تحملت خسارة كل شيء، وأعتبر كل شيء نفاية، لكي أربح المسيح"]]}, {"l": "Phi 3:9", "n": "", "vs": [[9, "ويكون لي فيه مقام، إذ ليس لي بري الذاتي القائم على أساس الشريعة، بل البر الآتي من الإيمان بالمسيح، البر الذي من عند الله على أساس الإيمان."]]}, {"l": "Col 3:1-3", "n": "", "vs": [[1, "فبما أنكم قد قمتم مع المسيح، فاسعوا إلى الأمور التي في العلى، حيث المسيح جالس عن يمين الله."], [2, "احصروا اهتمامكم بالأمور التي في العلى، لا بالأمور الأرضية."], [3, "فإنكم قد متم، وحياتكم مستورة مع المسيح في الله."]]}, {"l": "1Jo 2:15-17", "n": "", "vs": [[15, "لا تحبوا العالم، ولا الأشياء التي في العالم. فالذي يحب العالم، لا تكون محبة الآب في قلبه."], [16, "لأن كل ما في العالم، من شهوات الجسد وشهوات العين وترف المعيشة، ليس من الآب، بل من العالم."], [17, "وسوف يزول العالم، وما فيه من شهوات أما الذي يعمل بإرادة الله، فيبقى إلى الأبد!"]]}, {"l": "1Jo 5:4", "n": "", "vs": [[4, "ذلك لأن المولود من الله ينتصر على العالم. فالإيمان هو الذي يجعلنا ننتصر على العالم."]]}, {"l": "1Jo 5:5", "n": "", "vs": [[5, "ومن ينتصر على العالم إلا الذي يؤمن أن يسوع هو ابن الله؟"]]}], "kwAr": "أصبح العالم بالنسبة لي مصلوبا", "noteAr": ""}], "arS": [["أما أنا ", []], ["فحاشا", ["G1096", "G3361"]], [" لي أن ", []], ["أفتخر", ["G2744"]], [" ", []], ["إلا", ["G1508"]], [" ", []], ["بصليب", ["G4716"]], [" ", []], ["ربنا", ["G2962", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], ["، الذي به أصبح ", []], ["العالم", ["G2889"]], [" بالنسبة لي ", []], ["مصلوبا", ["G4717"]], ["، وأنا أصبحت بالنسبة له مصلوبا.", []]]}, {"c": 6, "v": 15, "text": "فليس الختان بشيء، ولا عدم الختان بشيء، وإنما (المهم أن يصير الإنسان) خليقة جديدة.", "groups": [{"kw": "in", "raw": "Gal_5:6; Rom_8:1; 2Co_5:17", "note": "", "refs": [{"l": "Gal 5:6", "n": "", "vs": [[6, "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة."]]}, {"l": "Rom 8:1", "n": "", "vs": [[1, "فالآن إذا ليس على الذين في المسيح يسوع أية دينونة بعد."]]}, {"l": "2Co 5:17", "n": "", "vs": [[17, "فإنه إذا كان أحد في المسيح، فهو خليقة جديدة: إن الأشياء القديمة قد زالت، وها كل شيء قد صار جديدا."]]}], "kwAr": "خليقة جديدة", "noteAr": ""}, {"kw": "neither", "raw": "1Co_7:19", "note": "", "refs": [{"l": "1Co 7:19", "n": "", "vs": [[19, "إن الختان ليس شيئا، وعدم الختان ليس شيئا، بل المهم هو العمل بوصايا الله."]]}], "kwAr": "فليس الختان بشيء", "noteAr": ""}, {"kw": "but", "raw": "2Co_5:17; Eph_2:10, Eph_4:24; Col_3:10,Col_3:11; Rev_21:5", "note": "", "refs": [{"l": "2Co 5:17", "n": "", "vs": [[17, "فإنه إذا كان أحد في المسيح، فهو خليقة جديدة: إن الأشياء القديمة قد زالت، وها كل شيء قد صار جديدا."]]}, {"l": "Eph 2:10", "n": "", "vs": [[10, "فإننا نحن تحفة الله، وقد خلقنا في المسيح يسوع لأعمال صالحة أعدها سلفا لنسلك فيها."]]}, {"l": "Eph 4:24", "n": "", "vs": [[24, "وتلبسوا الإنسان الجديد المخلوق على مثال الله في البر والقداسة بالحق."]]}, {"l": "Col 3:10", "n": "", "vs": [[10, "ولبستم الجديد الذي يتجدد لبلوغ تمام المعرفة وفقا لصورة خالقه،"]]}, {"l": "Col 3:11", "n": "", "vs": [[11, "وفيه لا فرق بين يوناني ويهودي، أو مختون وغير مختون، أو متحضر ومتخلف، أو عبد وحر، بل المسيح هو الكل وفي الكل."]]}, {"l": "Rev 21:5", "n": "", "vs": [[5, "وقال الجالس على العرش: «سأصنع كل شيء جديدا». ثم قال لي: «اكتب هذا، فإن ما أقوله هو الصدق والحق»."]]}], "kwAr": "وإنما", "noteAr": ""}], "arS": [["فليس ", []], ["الختان", ["G4061"]], [" بشيء، ولا ", []], ["عدم الختان", ["G203"]], [" بشيء، وإنما (المهم أن يصير الإنسان) ", []], ["خليقة", ["G2937"]], [" ", []], ["جديدة", ["G2537"]], [".", []]]}, {"c": 6, "v": 16, "text": "فالسلام والرحمة على جميع السالكين وفقا لهذا المبدأ، وعلى إسرائيل الله.", "groups": [{"kw": "walk", "raw": "Gal_5:16, Gal_5:25; Psa_125:4, Psa_125:5; Phi_3:16", "note": "", "refs": [{"l": "Gal 5:16", "n": "", "vs": [[16, "إنما أقول: اسلكوا في الروح. وعندئذ لا تتممون شهوة الجسد أبدا."]]}, {"l": "Gal 5:25", "n": "", "vs": [[25, "إذا كنا نحيا بالروح، فلنسلك أيضا بالروح."]]}, {"l": "Psa 125:4", "n": "", "vs": [[4, "أحسن يارب إلى الأخيار وإلى ذوي القلوب المستقيمة."]]}, {"l": "Psa 125:5", "n": "", "vs": [[5, "أما الذين يحيدون إلى طرق ملتوية، فإن الرب يسوقهم إلى الهلاك مع فاعلي الإثم. ليكن السلام لشعب إسرائيل."]]}, {"l": "Phi 3:16", "n": "", "vs": [[16, "إنما، لنواصل السير من حيث قد وصلنا، في المنهج نفسه."]]}], "kwAr": "السالكين وفقا لهذا المبدأ", "noteAr": ""}, {"kw": "peace", "raw": "Gal_1:3; Num_6:23-27; 1Ch_12:18; Psa_125:5; Joh_14:27, Joh_16:33; Rom_1:7; Phi_4:7", "note": "", "refs": [{"l": "Gal 1:3", "n": "", "vs": [[3, "لتكن لكم النعمة والسلام من الله الآب وربنا يسوع المسيح،"]]}, {"l": "Num 6:23-27", "n": "", "vs": [[23, "«أوص هرون وأبناءه قائلا: هذا ما يباركون به بني إسرائيل قائلين لهم:"], [24, "يباركك الرب ويحرسك."], [25, "يضيء الرب بوجهه عليك ويرحمك."], [26, "يلتفت الرب بوجهه إليك ويمنحك سلاما."], [27, "وهكذا يجعلون اسمي على بني إسرائيل وأنا أباركهم»."]]}, {"l": "1Ch 12:18", "n": "", "vs": [[18, "فحل روح الرب على عماساي الذي أصبح في ما بعد قائد الثلاثة وقال: «إننا رجالك ياداود، ونحن معك ياابن يسى. سلام لك، وسلام لناصريك، لأن إلهك هو معينك». فرحب بهم داود وجعلهم رؤساء في جيشه."]]}, {"l": "Psa 125:5", "n": "", "vs": [[5, "أما الذين يحيدون إلى طرق ملتوية، فإن الرب يسوقهم إلى الهلاك مع فاعلي الإثم. ليكن السلام لشعب إسرائيل."]]}, {"l": "Joh 14:27", "n": "", "vs": [[27, "سلاما أترك لكم. سلامي أعطيكم. ليس كما يعطي العالم أعطيكم أنا. فلا تضطرب قلوبكم، ولا ترتعب."]]}, {"l": "Joh 16:33", "n": "", "vs": [[33, "أخبرتكم بهذا كله ليكون لكم في سلام. فإنكم في العالم ستقاسون الضيق. ولكن تشجعوا، فأنا قد انتصرت على العالم!»"]]}, {"l": "Rom 1:7", "n": "", "vs": [[7, "إلى جميع من هم في روما من أحباء الله القديسين المدعوين. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}, {"l": "Phi 4:7", "n": "", "vs": [[7, "وسلام الله، الذي تعجز العقول عن إدراكه، يحرس قلوبكم وأفكاركم في المسيح يسوع."]]}], "kwAr": "فالسلام والرحمة", "noteAr": ""}, {"kw": "the Israel", "raw": "Gal_3:7-9, Gal_3:29; Psa_73:1; Isa_45:25; Hos_1:10; Joh_1:47; Rom_2:28, Rom_2:29, Rom_4:12; Rom_9:6-8; Phi_3:3; 1Pe_2:5-9", "note": "", "refs": [{"l": "Gal 3:7-9", "n": "", "vs": [[7, "فاعلموا إذن أن الذين هم على مبدأ الإيمان هم أبناء إبراهيم فعلا."], [8, "ثم إن الكتاب، إذ سبق فرأى أن الله سوف يبرر الأمم على أساس الإيمان، بشر إبراهيم سلفا بقوله: «فيك تتبارك جميع الأمم!»"], [9, "إذن الذين هم على مبدأ الإيمان يباركون مع إبراهيم المؤمن."]]}, {"l": "Gal 3:29", "n": "", "vs": [[29, "فإذا كنتم للمسيح، فأنتم إذن نسل إبراهيم وحسب الوعد وارثون."]]}, {"l": "Psa 73:1", "n": "", "vs": [[1, "حقا إن الله رفيق بإسرائيل، بذوي القلوب النقية."]]}, {"l": "Isa 45:25", "n": "", "vs": [[25, "أما ذرية إسرائيل فبالرب يتبررون وبه يزهون."]]}, {"l": "Hos 1:10", "n": "", "vs": [[10, "ومع ذلك فإن عدد بني إسرائيل يكون كرمل البحر الذي لا يكال ولا يحصى. وفي الموضع الذي قيل لهم فيه: أنتم لستم شعبي، يقال لهم: أنتم أبناء الله الحي."]]}, {"l": "Joh 1:47", "n": "", "vs": [[47, "ورأى يسوع نثنائيل قادما نحوه فقال عنه: «هذا إسرائيلي أصيل لا شك فيه!»"]]}, {"l": "Rom 2:28", "n": "", "vs": [[28, "فليس بيهودي من كان يهوديا في الظاهر، ولا بختان ما كان ظاهرا في اللحم."]]}, {"l": "Rom 2:29", "n": "", "vs": [[29, "وإنما اليهودي هو من كان يهوديا في الباطن، والختان هو ما كان ختانا للقلب بالروح لا بالحرف. وهذا يأتيه المدح لا من الناس بل من الله!"]]}, {"l": "Rom 4:12", "n": "", "vs": [[12, "وأبا للمختونين الذين ليسوا من أهل الختان وحسب بل الذين يسيرون في خطى الإيمان الذي كان لأبينا إبراهيم وهو بعد غير مختون."]]}, {"l": "Rom 9:6-8", "n": "", "vs": [[6, "لست أعني أن كلمة الله قد خابت. إذ ليس جميع بني إسرائيل هم إسرائيل؛"], [7, "وليسوا، لأنهم نسل إبراهيم، كلهم أولادا لله، بل (كما قد كتب): «بإسحاق سيكون لك نسل يحمل اسمك»."], [8, "أي أن أولاد الجسد ليسوا هم أولاد الله، بل أولاد الوعد يحسبون نسلا."]]}, {"l": "Phi 3:3", "n": "", "vs": [[3, "فإننا نحن أهل الختان الحق، لأننا إنما نعبد بروح الله ونفتخر في المسيح يسوع، ولا نعتمد على أمور الجسد،"]]}, {"l": "1Pe 2:5-9", "n": "", "vs": [[5, "إذن اتحدوا به كحجارة حية، مبنيين بيتا روحيا، تكونون فيه كهنة مقدسين تقدمون لله ذبائح روحية مقبولة لديه بفضل يسوع المسيح."], [6, "وكما يقول الكتاب: «ها أنا أضع في صهيون حجر زاوية، مختارا وثمينا. والذي يؤمن به، لا يخيب!»"], [7, "فإن هذا الحجر هو ثمين في نظركم، أنتم المؤمنين به. أما بالنسبة إلى الذين لا يؤمنون، «فالحجر الذي رفضه البناؤون صار هو الحجر الأساسي رأس زاوية البيت»،"], [8, "كما أنه هو «الحجر الذي يصطدمون به، والصخرة التي يسقطون عليها»! وهم يسقطون لأنهم يرفضون أن يؤمنوا بالكلمة."], [9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}], "kwAr": "وعلى إسرائيل الله", "noteAr": ""}], "arS": [["فالسلام", ["G1515"]], [" ", []], ["والرحمة", ["G1656"]], [" على ", []], ["جميع", ["G3745"]], [" ", []], ["السالكين", ["G4748"]], [" وفقا لهذا ", []], ["المبدأ", ["G2583"]], ["، وعلى ", []], ["إسرائيل", ["G2474"]], [" ", []], ["الله", ["G2316"]], [".", []]]}, {"c": 6, "v": 17, "text": "لا يسبب لي أحد المتاعب فيما بعد، فإني أحمل في جسدي سمات الرب يسوع.", "groups": [{"kw": "let", "raw": "Gal_1:7, Gal_5:12; Jos_7:25; Act_15:24; Heb_12:15", "note": "", "refs": [{"l": "Gal 1:7", "n": "", "vs": [[7, "لا أعني أن هنالك إنجيلا آخر، بل إنما هنالك بعض (المعلمين) الذين يثيرون البلبلة بينكم، راغبين في تحوير إنجيل المسيح."]]}, {"l": "Gal 5:12", "n": "", "vs": [[12, "ليت الذين يثيرون البلبلة بينكم يبترون أنفسهم!"]]}, {"l": "Jos 7:25", "n": "", "vs": [[25, "وقال يشوع: «لماذا جلبت علينا هذه الكارثة؟ لتحل بك اليوم الفواجع». فرجمه جميع إسرائيل بالحجارة مع أهل بيته وأحرقوهم بالنار،"]]}, {"l": "Act 15:24", "n": "", "vs": [[24, "علمنا أن بعض الأشخاص ذهبوا من عندنا إليكم، دون تفويض منا فأثاروا بكلامهم الاضطراب بينكم وأقلقوا أفكاركم."]]}, {"l": "Heb 12:15", "n": "", "vs": [[15, "انتبهوا ألا يسقط أحدكم من نعمة الله، حتى لا يتأصل بينكم جذر مرارة، فيسبب بلبلة، وينجس كثيرين منكم."]]}], "kwAr": "لا يسبب لي أحد المتاعب", "noteAr": ""}, {"kw": "I bear", "raw": "Gal_5:11; 2Co_1:5, 2Co_4:10, 2Co_11:23-25; Col_1:24", "note": "", "refs": [{"l": "Gal 5:11", "n": "", "vs": [[11, "وأما أنا، أيها الإخوة، فلو صح أنني مازلت أدعو إلى الختان، فلماذا مازلت ألقى الاضطهاد؟ إذن لكانت العثرة التي في الصليب قد زالت!"]]}, {"l": "2Co 1:5", "n": "", "vs": [[5, "فكما فاضت علينا آلام المسيح، يفيض علينا أيضا التشجيع بالمسيح."]]}, {"l": "2Co 4:10", "n": "", "vs": [[10, "وحيثما ذهبنا، نحمل موت يسوع دائما في أجسادنا لتظهر فيها أيضا حياة يسوع."]]}, {"l": "2Co 11:23-25", "n": "", "vs": [[23, "وإن كانوا خدام المسيح، أتكلم كأني فقدت صوابي، فأنا متفوق عليهم: في الأتعاب أوفر منهم جدا، في الجلدات فوق الحد، في السجون أوفر جدا، في التعرض للموت أكثر مرارا."], [24, "من اليهود تلقيت الجلد خمس مرات، كل مرة أربعين جلدة إلا واحدة."], [25, "ضربت بالعصي ثلاث مرات. رجمت بالحجارة مرة. تحطمت بي السفينة ثلاث مرات. قضيت في عرض البحر يوما بنهاره وليله."]]}, {"l": "Col 1:24", "n": "", "vs": [[24
