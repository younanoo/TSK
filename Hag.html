من فوق عنكم الندى، ومنعت الأرض غلتها."], [11, "وقضيت بالقحط على الأرض والتلال، وعلى حقول الحنطة والكروم، وأشجار الزيتون وعلى كل ما تنتجه الأرض، وعلى الناس والبهائم، وعلى كل تعب أيديكم»."]]}, {"l": "Pro 3:9", "n": "", "vs": [[9, "أكرم الرب من مالك، ومن أوائل غلات محاصيلك."]]}, {"l": "Pro 3:10", "n": "", "vs": [[10, "فتمتليء أهراؤك وفرة، وتفيض معاصرك خمرا."]]}, {"l": "Zec 8:10-12", "n": "", "vs": [[10, "فإنه قبل تلك الأيام لم تدفع أجرة لرجل أو بهيمة، ولم يكن هناك من يأمن على نفسه من أعدائه في ذهابه وإيابه، لأنني أثرت كل واحد ضد صاحبه."], [11, "أما الآن فلن أتعامل مع بقية شعبي الناجية كما تعاملت معه في الأيام الغابرة، يقول الرب القدير."], [12, "بل يزرعون في سلام، فتعطي الكروم ثمرها والأرض غلاتها، وتجود السماء بأمطارها، وأورث بقية هذا الشعب الناجية كل هذه."]]}, {"l": "Mal 2:2", "n": "", "vs": [[2, "إن أبيتم الاستماع، ولم تنووا في قلوبكم أن تمجدوا اسمي، أصب عليكم اللعنة، وألعن بركاتكم، بل ها أنا قد حولتها إلى لعنات لأنكم لم تجعلوها في قلوبكم."]]}], "kwAr": "عندما كان يقبل أحد", "noteAr": ""}], "arS": [["عندما ", []], ["كان", ["H1961"]], [" ", []], ["يقبل", ["H935"]], [" أحد ", []], ["على", ["H413"]], [" ", []], ["كومة", ["H6194"]], [" حبوب ظنا منه أن الأرض قد غلت ", []], ["عشرين", ["H6242"]], [" مكيالا، يجد أنها لم تغل سوى ", []], ["عشرة", ["H6235"]], [" فقط. وحين ", []], ["يدنو", ["H935"]], [" من ", []], ["المعصرة", ["H3342"]], [" ", []], ["ليغرف", ["H2834"]], [" ملء ", []], ["خمسين", ["H2572"]], [" ", []], ["وعاء", ["H6333"]], ["، لا يجد إلا ", []], ["عشرين", ["H6242"]], [".", []]]}, {"c": 2, "v": 17, "text": "إني ابتليت تعب أيديكم بالقحط والذبول والبرد، ولكنكم لم ترجعوا تائبين إلي، يقول الرب.", "groups": [{"kw": "with blasting", "raw": "Hag_1:9; Gen_42:6, Gen_42:23, Gen_42:27; Deu_28:22; 1Ki_8:37; 2Ch_6:28; Isa_37:27; Amo_4:9", "note": "", "refs": [{"l": "Hag 1:9", "n": "", "vs": [[9, "لقد توقعتم كثيرا فحصلتم على قليل، وما أتيتم به إلى البيت من غلة نفخت عليه وبددته. لماذا فعلت هذا يقول الرب القدير؟ من أجل بيتي الذي ما برح مهدما بينما كل واحد منكم منهمك في بناء بيته."]]}, {"l": "Gen 42:6", "n": "", "vs": [[6, "وكان يوسف هو المتسلط على مصر، والقائم على بيع القمح لأهلها جميعا. فأقبل إخوة يوسف وسجدوا له بوجوههم إلى الأرض."]]}, {"l": "Gen 42:23", "n": "", "vs": [[23, "ولم يعلموا أن يوسف كان فاهما حديثهم، لأنه كان يخاطبهم عن طريق مترجم."]]}, {"l": "Gen 42:27", "n": "", "vs": [[27, "وحين فتح أحدهم عدله في الخان ليعلف حماره، لمح فضته لأنها كانت موضوعة في فم العدل."]]}, {"l": "Deu 28:22", "n": "", "vs": [[22, "ويضربكم الرب بالسل والحمى والرعشة والالتهاب والجفاف واللفح والذبول، فتلازمكم حتى تفنوا."]]}, {"l": "1Ki 8:37", "n": "", "vs": [[37, "وإن أصابت الأرض مجاعة، أو تفشى فيها وبأ، أو اعترتها آفات زراعية، أو جفاف، أو غزاها الجراد والجندب، أو إذا حاصر الشعب عدو في أية مدينة من مدنه، أو حلت به كارثة أو مرض،"]]}, {"l": "2Ch 6:28", "n": "", "vs": [[28, "وإن أصابت الأرض مجاعة، أو تفشى فيها وبأ، أو اعترتها آفات زراعية أو جفاف، أو غزاها الجراد والجندب، أو إذا حاصر الشعب عدو في مدينة من مدنه، أو حلت به كارثة أو مرض،"]]}, {"l": "Isa 37:27", "n": "", "vs": [[27, "خارت قوى أهلها فأصبحوا مرتاعين خجلين، صاروا كعشب الحقل، كالنبات الأخضر وكحشيش السطوح الذاوي قبل نموه."]]}, {"l": "Amo 4:9", "n": "", "vs": [[9, "أرسلت الرياح اللافحة واليرقان لتجفف محاصيلكم، والتهم الجراد حدائقكم وكرومكم وأشجار تينكم وزيتونكم. وما رجعتم إلي!"]]}], "kwAr": "بالقحط", "noteAr": ""}, {"kw": "with hail", "raw": "Exo_9:18-29; Isa_28:2", "note": "", "refs": [{"l": "Exo 9:18-29", "n": "", "vs": [[18, "لذلك غدا في مثل هذا الوقت أمطر بردا ثقيلا لم تشهده مصر منذ يوم تأسيسها حتى الآن."], [19, "فأرسل الآن واجمع مواشيك وكل مالك في الحقل، لأن كل من يمكث في الحقل من الناس والبهائم ولا يلجأ إلى مأوى، ينهمر عليه البرد فيموت»."], [20, "فكل من خاف كلمة الرب من رجال فرعون لاذ بعبيده وماشيته بالبيوت،"], [21, "أما الذين استخفوا بكلام الرب فقد تركوا عبيدهم ومواشيهم في الحقل."], [22, "وقال الرب لموسى: «مد يدك نحو السماء فينهمر البرد على كل أرض مصر، وعلى الرجال والبهائم وعلى عشب الحقل في جميع أرض مصر»."], [23, "فمد موسى عصاه نحو السماء، فأرسل الرب رعودا وبردا. وأصابت الصواعق الأرض، وأمطر الرب بردا على كل بلاد مصر،"], [24, "فانهمر البرد، واختلطت الصواعق بالبرد، فكانت أسوأ عاصفة شهدتها أرض مصر منذ أن صارت أمة."], [25, "وأصاب البرد في كل أرجاء مصر جميع ما في الحقول من ناس وبهائم. وأتلف كل نبات نام في الحقل وكسر جميع الأشجار."], [26, "أما أرض جاسان حيث يقيم بنو إسرائيل، فإنها وحدها لم يسقط فيها برد."], [27, "فأرسل فرعون واستدعى موسى وهرون وقال لهما: «لقد أخطأت هذه المرة والرب هو البار، أما أنا وشعبي فأشرار،"], [28, "فتضرعا إلى الرب إذ يكفينا ما ابتلينا به من رعود وبرد، فأطلقكم، ولا تمكثون هنا بعد»."], [29, "فأجاب موسى: «حالما أخرج من المدينة أبسط يدي في الصلاة إلى الرب فيتوقف الرعد وينقطع البرد لكي تعرف أن الأرض هي للرب."]]}, {"l": "Isa 28:2", "n": "", "vs": [[2, "لأن للرب متسلطا قويا عاتيا ينقض كعاصفة برد، كنوء مدمر، كزوبعة هائلة من مياه جارفة فيطرحها أرضا بعنف،"]]}], "kwAr": "والبرد", "noteAr": ""}, {"kw": "in all", "raw": "Hag_1:11; Psa_78:46; Isa_62:8; Jer_3:24", "note": "", "refs": [{"l": "Hag 1:11", "n": "", "vs": [[11, "وقضيت بالقحط على الأرض والتلال، وعلى حقول الحنطة والكروم، وأشجار الزيتون وعلى كل ما تنتجه الأرض، وعلى الناس والبهائم، وعلى كل تعب أيديكم»."]]}, {"l": "Psa 78:46", "n": "", "vs": [[46, "أسلم غلتهم لليسارع ومحاصيلهم للجراد ليدمرها."]]}, {"l": "Isa 62:8", "n": "", "vs": [[8, "قد أقسم الرب بيمينه وبذراعه القديرة قائلا: لن أعطي حنطتك من بعد طعاما لأعدائك، ولن يشرب الغرباء خمرك التي تعبت فيها،"]]}, {"l": "Jer 3:24", "n": "", "vs": [[24, "لقد التهم خزي الأوثان تعب آبائنا منذ صبانا، وافترس غنمهم وبقرهم وأبناءهم وبناتهم."]]}], "kwAr": "تعب أيديكم", "noteAr": ""}, {"kw": "yet", "raw": "2Ch_28:22; Job_36:13; Isa_9:13, Isa_42:25; Jer_5:3, Jer_6:16, Jer_6:17, Jer_8:4-7; Hos_7:9, Hos_7:10; Amo_4:8-11; Zec_1:2-4, Zec_7:9-13; Rev_2:21, Rev_9:20,Rev_9:21", "note": "", "refs": [{"l": "2Ch 28:22", "n": "", "vs": [[22, "وفي أثناء ضيقه ازداد الملك آحاز خيانة للرب."]]}, {"l": "Job 36:13", "n": "", "vs": [[13, "أما فجار القلوب فيذخرون لأنفسهم غضبا، ولا يستغيثون بالله حين يعاقبهم."]]}, {"l": "Isa 9:13", "n": "", "vs": [[13, "إن الشعب لم يرجع تائبا إلى من عاقبه، ولا طلب الرب القدير."]]}, {"l": "Isa 42:25", "n": "", "vs": [[25, "لذلك صب عليهم جام غضبه في وطيس الحرب فاكتنفتهم بضرامها ولكنهم لم يفهموا، وأحرقتهم بنيرانها ولم يتعظوا."]]}, {"l": "Jer 5:3", "n": "", "vs": [[3, "أيها الرب، أليست عيناك تطلبان الحق؟ لقد عاقبتهم ولكنهم لم يتوجعوا. أهلكتهم ولكنهم أبوا التقويم. صلبوا وجوههم أكثر من الصخر، ورفضوا التوبة."]]}, {"l": "Jer 6:16", "n": "", "vs": [[16, "وهذا ما يعلنه الرب: «قفوا في الطرقات وانظروا، واسألوا عن المسالك الصالحة القديمة واطرقوها، فتجدوا راحة لنفوسكم. ولكنكم قلتم: لن نسير فيها."]]}, {"l": "Jer 6:17", "n": "", "vs": [[17, "فأقمت عليكم رقباء قائلا: اسمعوا دوي البوق. ولكنكم قلتم: «لن نسمع!»"]]}, {"l": "Jer 8:4-7", "n": "", "vs": [[4, "وتقول لهم: «هذا ما يعلنه الرب: عندما يسقط الرجال، ألا يقومون ثانية؟ وعندما يرتدون مخطئين ألا يرجعون؟"], [5, "فما بال شعب أورشليم قد ارتدوا ارتدادا دائما متشبثين بالخديعة ورافضين الرجوع؟"], [6, "قد أصغيت وسمعت، وإذا بهم ينطقون بما ينافي الحق، وما من أحد يتوب عن شره قائلا: ما هذا الذي أرتكب؟ بل كل واحد مضى في طريقه كفرس مندفع لخوض معركة."], [7, "إن اللقلق في السماء يعرف ميعاد هجرته، وكذلك اليمامة والسنونة المغردة تحفظان أوان عودتهما من هجرتهما. أما شعبي فلا يعرف قضاء الرب!"]]}, {"l": "Hos 7:9", "n": "", "vs": [[9, "استنزف الغرباء قوته وهو لا يدري، وخط الشيب شعر رأسه وهو لا يعلم."]]}, {"l": "Hos 7:10", "n": "", "vs": [[10, "يشهد غرور إسرائيل عليه ولم يرجع إلى الرب إلهه، ولا التمسه."]]}, {"l": "Amo 4:8-11", "n": "", "vs": [[8, "فأقبلت مدينتان أو ثلاث على مدينة واحدة لتشرب ماء، ولكنها لم ترتو، ومع ذلك لم ترجعوا إلي تائبين، يقول الرب."], [9, "أرسلت الرياح اللافحة واليرقان لتجفف محاصيلكم، والتهم الجراد حدائقكم وكرومكم وأشجار تينكم وزيتونكم. وما رجعتم إلي!"], [10, "أصبتكم بالأوبئة التي أصيبت بها مصر، وقضيت على شبابكم بالسيف وسبيت خيولكم، وجعلت نتن معسكركم يزكم أنوفكم. ولكنكم لم ترجعوا إلي تائبين يقول الرب."], [11, "دمرت بعض مدنكم كما دمر الله سدوم وعمورة، فكان من نجا منكم كشعلة منتشلة من النار. ولكنكم لم ترجعوا إلي تائبين."]]}, {"l": "Zec 1:2-4", "n": "", "vs": [[2, "«لقد غضب الرب أشد الغضب على آبائكم."], [3, "ولكن قل لهم، هذا ما يعلنه الرب القدير: ارجعوا إلي فأرجع إليكم، يقول الرب القدير."], [4, "ولا تكونوا كآبائكم الذين ناداهم الأنبياء السالفون قائلين: هكذا يقول الرب القدير، ارجعوا عن طرقكم الباطلة وأعمالكم الشريرة، ولكنهم لم يسمعوا ولم يصغوا إلي، يقول الرب."]]}, {"l": "Zec 7:9-13", "n": "", "vs": [[9, "«هذا ما يقوله الرب القدير، اقضوا بالعدل، وليبد كل منكم إحسانا ورحمة لأخيه."], [10, "ولا تجوروا على الأرملة واليتيم والغريب والمسكين، ولا يضمر أحدكم شرا في قلبه لأخيه."], [11, "ولكنهم أبوا أن يصغوا، واعتصموا بعنادهم غير عابئين، وأصموا آذانهم لئلا يسمعوا."], [12, "وقسوا قلوبهم كالصوان لئلا يسمعوا الشريعة التي أرسلها الرب القدير بروحه على لسان أنبيائه السابقين. فانصب غضب عظيم من لدن الرب القدير."], [13, "وكما ناديت فلم يسمعوا فإني أنا أيضا لا أسمع، يقول الرب القدير."]]}, {"l": "Rev 2:21", "n": "", "vs": [[21, "وقد أمهلتها مدة لتتوب تاركة زناها، ولكنها لم تتب."]]}, {"l": "Rev 9:20", "n": "", "vs": [[20, "ولكن الناس الذين نجوا من هذه البلايا، لم يتوبوا عن أعمالهم، وظلوا يسجدون للشياطين وللأصنام التي صنعوها من الذهب والفضة والنحاس والحجر والخشب، مع أنها لا ترى ولا تسمع ولا تتحرك!"]]}, {"l": "Rev 9:21", "n": "", "vs": [[21, "ولم يتوبوا عن القتل والسحر والزنى والسرقة!"]]}], "kwAr": "ولكنكم", "noteAr": ""}], "arS": [["إني ", []], ["ابتليت", ["H5221"]], [" ", []], ["تعب", ["H3605", "H4639"]], [" ", []], ["أيديكم", ["H3027"]], [" ", []], ["بالقحط", ["H7711"]], [" ", []], ["والذبول", ["H3420"]], [" ", []], ["والبرد", ["H1259"]], ["، ولكنكم ", []], ["لم", ["H369"]], [" ترجعوا تائبين ", []], ["إلي", ["H413"]], ["، ", []], ["يقول", ["H5002"]], [" ", []], ["الرب", ["H3068"]], [".", []]]}, {"c": 2, "v": 18, "text": "ولكن تأملوا فيما يجري منذ هذا اليوم وصاعدا، من اليوم الرابع والعشرين من الشهر التاسع، منذ أن تم وضع أساس هيكل الرب. تأملوا.", "groups": [{"kw": "Consider", "raw": "Hag_2:15; Deu_32:29; Luk_15:17-20", "note": "", "refs": [{"l": "Hag 2:15", "n": "", "vs": [[15, "والآن تأملوا فيما صنعتم اليوم والأيام السالفة قبل أن تضعوا حجرا فوق حجر لبناء هيكل الرب."]]}, {"l": "Deu 32:29", "n": "", "vs": [[29, "لو عقلوا لفطنوا لمآلهم وتأملوا في مصيرهم،"]]}, {"l": "Luk 15:17-20", "n": "", "vs": [[17, "ثم رجع إلى نفسه، وقال: ما أكثر خدام أبي المأجورين الذين يفضل عنهم الخبز، وأنا هنا أكاد أهلك جوعا!"], [18, "سأقوم وأرجع إلى أبي، وأقول له: ياأبي، أخطأت إلى السماء وأمامك؛"], [19, "ولا أستحق بعد أن أدعى ابنا لك: اجعلني كواحد من خدامك المأجورين!"], [20, "فقام ورجع إلى أبيه. ولكن أباه رآه وهو مازال بعيدا، فتحنن، وركض إليه وعانقه وقبله بحرارة."]]}], "kwAr": "تأملوا فيما يجري", "noteAr": ""}, {"kw": "even", "raw": "Hag_1:14, Hag_1:15; Ezr_5:1, Ezr_5:2; Zec_8:9, Zec_8:12", "note": "", "refs": [{"l": "Hag 1:14", "n": "", "vs": [[14, "وبث الرب الهمة في نفس زربابل بن شألتيئيل حاكم يهوذا ونفس يهوشع بن يهوصادق رئيس الكهنة ونفوس سائر بقية الشعب، فتوافدوا وباشروا العمل في هيكل الرب القدير إلههم."]]}, {"l": "Hag 1:15", "n": "", "vs": [[15, "وكان ذلك في اليوم الرابع والعشرين من الشهر السادس من السنة الثانية من حكم الملك داريوس."]]}, {"l": "Ezr 5:1", "n": "", "vs": [[1, "في ذلك الحين تنبأ النبيان حجي وزكريا بن عدو لليهود المقيمين في أورشليم ويهوذا باسم الرب إله إسرائيل المهيمن عليهم."]]}, {"l": "Ezr 5:2", "n": "", "vs": [[2, "فقام زربابل بن شألتيئيل ويشوع بن يوصادوق، وشرعا في استكمال بناء هيكل الله الذي في أورشليم، بمعونة نبيي الله،"]]}, {"l": "Zec 8:9", "n": "", "vs": [[9, "ولتتشدد أيديكم أنتم يامن تسمعون هذه الكلمات التي نطق بها الأنبياء الذين كانوا حاضرين عند إرساء أساس هيكل الرب القدير لإعادة بنائه،"]]}, {"l": "Zec 8:12", "n": "", "vs": [[12, "بل يزرعون في سلام، فتعطي الكروم ثمرها والأرض غلاتها، وتجود السماء بأمطارها، وأورث بقية هذا الشعب الناجية كل هذه."]]}], "kwAr": "منذ أن تم وضع أساس", "noteAr": ""}], "arS": [["ولكن ", []], ["تأملوا", ["H7760", "H3824"]], [" فيما يجري ", []], ["منذ", ["H4480"]], [" ", []], ["هذا", ["H2088"]], [" ", []], ["اليوم", ["H3117"]], [" ", []], ["وصاعدا", ["H4605"]], ["، من ", []], ["اليوم", ["H3117"]], [" ", []], ["الرابع", ["H702"]], [" ", []], ["والعشرين", ["H6242"]], [" من الشهر ", []], ["التاسع", ["H8671"]], ["، ", []], ["منذ", ["H4480"]], [" أن تم وضع ", []], ["أساس", ["H3245"]], [" ", []], ["هيكل", ["H1964"]], [" ", []], ["الرب", ["H3068"]], [". ", []], ["تأملوا", ["H7760", "H3824"]], [".", []]]}, {"c": 2, "v": 19, "text": "هل في الأهراء بذار بعد؟ حتى الكروم والتين والرمان والزيتون لم تثمر بعد. لكن منذ هذا اليوم أبارك فيها».", "groups": [{"kw": "as", "raw": "Hab_3:17, Hab_3:18", "note": "", "refs": [{"l": "Hab 3:17", "n": "", "vs": [[17, "فمع أنه لا يزهر التين ولا يكون حمل في الكروم يكذب عمل الزيتونة والحقول لا تصنع طعاما ينقطع الغنم من الحظيرة ولا بقر في المذاود"]]}, {"l": "Hab 3:18", "n": "", "vs": [[18, "فإني أبتهج بالرب وأفرح بإله خلاصي."]]}], "kwAr": "حتى", "noteAr": ""}, {"kw": "from", "raw": "Gen_26:12; Lev_26:3-13; Deu_15:10, Deu_28:2-15; Psa_84:12, Psa_128:1-5, Psa_133:3; Pro_3:9, Pro_3:10; Zec_8:11-15; Mal_3:10; Mat_6:33", "note": "", "refs": [{"l": "Gen 26:12", "n": "", "vs": [[12, "وزرع إسحق في تلك الأرض، فحصد في تلك السنة مئة ضعف لأن الله باركه."]]}, {"l": "Lev 26:3-13", "n": "", "vs": [[3, "إن سلكتم في فرائضي وأطعتم وصاياي وعملتم بها،"], [4, "فإني أسكب عليكم المطر في أوانه، وتعطي الأرض غلتها، وتثمر أشجار الحقل،"], [5, "فتستمر دراسة حنطتكم حتى موعد قطاف العنب، ويستمر قطاف العنب حتى موسم الزراعة، فتأكلون خبزكم حتى الشبع، وتسكنون في أرضكم آمنين."], [6, "وأشيع سلاما في الأرض، فتنامون مطمئنين، وأبيد الوحوش البرية من الأرض ولا يجتاز سيف في دياركم."], [7, "وتطردون أعداءكم فيسقطون أمامكم بالسيف."], [8, "خمسة منكم يطردون مئة، ومئة منكم يطردون عشرة آلاف. ويتساقط أعداؤكم أمامكم بحد السيف،"], [9, "وأرعاكم بعنايتي، وأنميكم وأكثركم، وأفي بميثاقي معكم،"], [10, "وتظلون تأكلون من الغلال القديمة حين تفرغونها من مخازنها لتوسعوا لغلات السنة الجديدة."], [11, "وأقيم مسكني في وسطكم ولا أخذلكم،"], [12, "وأسير بينكم وأكون إلهكم، وأنتم تكونون لي شعبا."], [13, "أنا الرب إلهكم أخرجتكم من مصر، وحطمت أغلال قيودكم ورفعت شأنكم، لكي لا تظلوا عبيدا للمصريين في ما بعد."]]}, {"l": "Deu 15:10", "n": "", "vs": [[10, "أقرضوه عن طيب خاطر، لأنه من أجل هذا يبارككم الرب إلهكم في كل أعمالكم وما تنتجه أيديكم،"]]}, {"l": "Deu 28:2-15", "n": "", "vs": [[2, "وإذا سمعتم لصوت الرب إلهكم فإن جميع هذه البركات تنسكب عليكم وتلازمكم."], [3, "تكونون مباركين في المدينة ومباركين في الحقول."], [4, "كما تتبارك ذريتكم، وغلات أرضكم، ونتاج بهائمكم وبقركم ونعاجكم."], [5, "وتتبارك أيضا فواكه سلالكم وخبز معاجنكم."], [6, "وتكونون مباركين في دخولكم وخروجكم"], [7, "ويهزم الرب أمامكم أعداءكم القائمين عليكم، فيقبلون عليكم في طريق واحدة، ولكنهم يولون الأدبار أمامكم في سبع طرق."], [8, "يأمر الرب لكم بالبركة، فتمتليء خزائنكم. ويبارك كل ما تنتجه أيديكم وغلات أرضكم التي يهبها لكم."], [9, "وإذا حفظتم وصاياه وسلكتم في سبله فإنه يجعلكم لنفسه شعبا مقدسا كما حلف لكم،"], [10, "فتدرك جميع شعوب الأرض أن اسم الرب قد حل عليكم، ويخافونكم."], [11, "ويزيدكم الرب وفرة فيكثر من أبنائكم ونتاج بهائمكم ومن غلات أرضكم التي حلف لآبائكم أن يهبها لكم."], [12, "ويفتح لكم الرب كنوز سمائه الصالحة، فيمطر على أرضكم في مواسمها، ويبارك كل ما تنتجه أيديكم، فتقرضون أمما كثيرة وأنتم لا تقترضون."], [13, "وإذا أطعتم وصايا الرب التي أنا آمركم بها اليوم لتحفظوها وتعملوا بها، فإنه يجعلكم رؤوسا لا أذنابا، متسامين دائما، ولا يدرككم انحطاط أبدا."], [14, "لا تنحرفوا يمينا أو شمالا عن جميع هذه الشرائع التي أنا أوصيكم بها اليوم، لكي لا تغووا وراء آلهة أخرى لتعبدوها."], [15, "ولكن إن عصيتم صوت الرب إلهكم ولم تحرصوا على العمل بجميع وصاياه وفرائضه التي أنا آمركم اليوم بها، فإن جميع هذه اللعنات تحل بكم وتلازمكم."]]}, {"l": "Psa 84:12", "n": "", "vs": [[12, "يارب الجنود، طوبى للإنسان المتكل عليك."]]}, {"l": "Psa 128:1-5", "n": "", "vs": [[1, "طوباك يامن تتقي الرب وتسلك في طرقه."], [2, "لأنك تأكل من تعب يديك وتتمتع بالسعادة والخير."], [3, "تكون امرأتك ككرمة مثمر ة في جوانب بيتك، وأبناؤك كأغراس الزيتون حول مائدتك."], [4, "هكذا يبارك الرجل الذي يتقي الرب."], [5, "يباركك الرب من صهيون، حتى تشهد خير أورشليم كل أيام حياتك،"]]}, {"l": "Psa 133:3", "n": "", "vs": [[3, "بل مثل ندى حرمون المتقاطر على جبل صهيون. فإنه هناك أمر الرب أن تحل البركة والحياة إلى الأبد."]]}, {"l": "Pro 3:9", "n": "", "vs": [[9, "أكرم الرب من مالك، ومن أوائل غلات محاصيلك."]]}, {"l": "Pro 3:10", "n": "", "vs": [[10, "فتمتليء أهراؤك وفرة، وتفيض معاصرك خمرا."]]}, {"l": "Zec 8:11-15", "n": "", "vs": [[11, "أما الآن فلن أتعامل مع بقية شعبي الناجية كما تعاملت معه في الأيام الغابرة، يقول الرب القدير."], [12, "بل يزرعون في سلام، فتعطي الكروم ثمرها والأرض غلاتها، وتجود السماء بأمطارها، وأورث بقية هذا الشعب الناجية كل هذه."], [13, "وكما كنتم لعنة بين الأمم ياأ بناء يهوذا وإسرائيل، فإنني أخلصكم فتصبحون بركة. لا تجزعوا، بل تشجعوا."], [14, "لأنه هكذا يقول الرب القدير، كما وطدت العزم أن أعاقبكم بالشر عندما أثار آباؤكم سخطي، ولم أرجع عن عزمي، يقول الرب القدير،"], [15, "فإني عدت أيضا فقضيت في هذه الأيام أن أحسن إلى أورشليم وإلى شعب يهوذا. فلا تجزعوا."]]}, {"l": "Mal 3:10", "n": "", "vs": [[10, "هاتوا العشور جميعها إلى بيت الخزينة ليتوافر في هيكلي طعام، واختبروني لتروا إن كنت لا أفتح كوى السماء وأفيض عليكم بركة وفيرة، يقول الرب القدير."]]}, {"l": "Mat 6:33", "n": "", "vs": [[33, "أما أنتم، فاطلبوا أولا ملكوت الله وبره، وهذه كلها تزاد لكم."]]}], "kwAr": "منذ هذا اليوم", "noteAr": ""}], "arS": [["هل في ", []], ["الأهراء", ["H4035"]], [" ", []], ["بذار", ["H2233"]], [" ", []], ["بعد", ["H5750"]], ["؟ ", []], ["حتى", ["H5704"]], [" ", []], ["الكروم", ["H1612"]], [" ", []], ["والتين", ["H8384"]], [" ", []], ["والرمان", ["H7416"]], [" ", []], ["والزيتون", ["H2132"]], [" ", []], ["لم", ["H3808"]], [" ", []], ["تثمر", ["H5375"]], [" ", []], ["بعد", ["H5750"]], [". لكن ", []], ["منذ", ["H4480"]], [" ", []], ["هذا", ["H2088"]], [" ", []], ["اليوم", ["H3117"]], [" ", []], ["أبارك", ["H1288"]], [" فيها».", []]]}, {"c": 2, "v": 20, "text": "ثم أوحى الرب بكلمته إلى حجي للمرة الثانية في اليوم الرابع والعشرين من الشهر قائلا:", "groups": [{"kw": "in the", "raw": "Hag_2:10", "note": "", "refs": [{"l": "Hag 2:10", "n": "", "vs": [[10, "وفي اليوم الرابع والعشرين من الشهر التاسع (أي شهر كانون الأول ; ديسمبر)، في السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي حجي:"]]}], "kwAr": "في اليوم الرابع والعشرين", "noteAr": ""}], "arS": [["ثم ", []], ["أوحى", ["H1961"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["بكلمته", ["H1697"]], [" إلى ", []], ["حجي", ["H2292"]], [" للمرة ", []], ["الثانية", ["H8145"]], [" في ", []], ["اليوم", ["H3117"]], [" ", []], ["الرابع", ["H702"]], [" ", []], ["والعشرين", ["H6242"]], [" من ", []], ["الشهر", ["H2320"]], [" ", []], ["قائلا", ["H559"]], [":", []]]}, {"c": 2, "v": 21, "text": "«كلم زربابل حاكم يهوذا وقل له: أنا مزمع أن أزلزل السماء والأرض.", "groups": [{"kw": "Zerubbabel", "raw": "Hag_1:1, Hag_1:14; 1Ch_3:19; Ezr_2:2, Ezr_5:2; Zec_4:6-10", "note": "", "refs": [{"l": "Hag 1:1", "n": "", "vs": [[1, "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"]]}, {"l": "Hag 1:14", "n": "", "vs": [[14, "وبث الرب الهمة في نفس زربابل بن شألتيئيل حاكم يهوذا ونفس يهوشع بن يهوصادق رئيس الكهنة ونفوس سائر بقية الشعب، فتوافدوا وباشروا العمل في هيكل الرب القدير إلههم."]]}, {"l": "1Ch 3:19", "n": "", "vs": [[19, "وأنجب فدايا: زربابل وشمعي. أما أبناء زربابل فهم مشلام، وحننيا وأختهم شلومية،"]]}, {"l": "Ezr 2:2", "n": "", "vs": [[2, "وقد جاءوا بقيادة زربابل، ويشوع، ونحميا، وسرايا، ورعلايا، ومردخاي، وبلشان، ومسفار، وبغواي ورحوم، وبعنة. وهذا بيان بالعائدين من شعب إسرائيل:"]]}, {"l": "Ezr 5:2", "n": "", "vs": [[2, "فقام زربابل بن شألتيئيل ويشوع بن يوصادوق، وشرعا في استكمال بناء هيكل الله الذي في أورشليم، بمعونة نبيي الله،"]]}, {"l": "Zec 4:6-10", "n": "", "vs": [[6, "فقال: «هذه رسالة الرب إلى زربابل: لا بالقدرة ولا بالقوة، ولكن بروحي تفلحون يقول الرب القدير."], [7, "أي شيء أنت أيها الجبل العظيم؟ أنت سهل أمام زربابل، وسيضع زربابل حجر الزاوية في خضم هتاف القائلين: ليباركه، ليباركه الرب»."], [8, "ثم أوحى الرب إلي بكلمته قائلا:"], [9, "«قد أسست يدا زربابل هذا الهيكل، ويداه تكملان بناءه، فتدرك أن الرب القدير قد أرسلني إليكم."], [10, "من يزدري بيوم الإنجازات الصغيرة؟ يفرح الرجال حين يشاهدون ميزان البناء في يد زربابل، وهذه السبعة هي أعين الرب الجائلة في كل الأرض»."]]}], "kwAr": "زربابل", "noteAr": ""}, {"kw": "I will", "raw": "Hag_2:6, Hag_2:7; Psa_46:6; Eze_26:15, Eze_38:19, Eze_38:20; Joe_3:16; Heb_12:26, Heb_12:27; Rev_16:17-19", "note": "", "refs": [{"l": "Hag 2:6", "n": "", "vs": [[6, "لأنه هكذا يقول الرب القدير: ها أنا مزمع مرة أخرى، عما قليل، أن أزلزل السماء والأرض والبحر واليابسة."]]}, {"l": "Hag 2:7", "n": "", "vs": [[7, "وأزعزع أركان جميع الأمم فتجلب نفائسهم إلى هذا المكان وأملأ هذا الهيكل بالمجد."]]}, {"l": "Psa 46:6", "n": "", "vs": [[6, "ماجت الأمم وهاجت، فتزلزلت الممالك، ولكن ما إن دوى بصوته حتى ذابت الأرض."]]}, {"l": "Eze 26:15", "n": "", "vs": [[15, "وهذا ما يعلنه السيد الرب عن مدينة صور: ألا ترتعد مدن السواحل لجلبة سقوطك، ولصراخ الجرحى، ولوقوع القتل فيك،"]]}, {"l": "Eze 38:19", "n": "", "vs": [[19, "وفي خضم غيرتي واتقاد سخطي أقول إنه في ذلك اليوم تحدث هزة عظيمة في أرض إسرائيل،"]]}, {"l": "Eze 38:20", "n": "", "vs": [[20, "فيرتعش من حضرتي سمك البحر وطيور السماء ووحوش البرية وجميع الحيوانات الدابة على الأرض، وكل الناس الذين على وجه المسكونة، وتندك الجبال وتسقط المعاقل وتنهار كل الأسوار إلى الأرض."]]}, {"l": "Joe 3:16", "n": "", "vs": [[16, "يزأر الرب في صهيون، ويجلجل بصوته من أورشليم فترجف السماوات والأرض؛ لكن الرب يكون ملجأ لشعبه، وحصنا لبني إسرائيل."]]}, {"l": "Heb 12:26", "n": "", "vs": [[26, "وإذ تكلم الله قديما، زلزل صوته الأرض، أما الآن، فيعد قائلا: «إني مرة أخرى، سوف أزلزل لا الأرض وحدها، بل السماء أيضا!»"]]}, {"l": "Heb 12:27", "n": "", "vs": [[27, "وبقوله: «مرة أخرى»، يشير إلى أنه سوف يزيل كل ما ليس له أساس متين باعتباره مخلوقا، حتى لا تبقى إلا تلك الأشياء الثابتة الأساس."]]}, {"l": "Rev 16:17-19", "n": "", "vs": [[17, "ثم سكب الملاك السابع كأسه على الهواء، فدوى صوت من العرش في الهيكل السماوي يقول: «قد تم!»"], [18, "فحدثت بروق وأصوات ورعود وزلزال عنيف لم تشهد الأرض له مثيلا منذ وجد الإنسان على الأرض، لأنه كان زلزالا عنيفا جدا!"], [19, "فانقسمت المدينة العظمى إلى ثلاثة أقسام، وحل الدمار بمدن الأمم. فقد ذكر الله بابل العظمى ليسقيها كأسا تفور بخمر غضبه."]]}], "kwAr": "أنا مزمع", "noteAr": ""}], "arS": [["«", []], ["كلم", ["H559"]], [" ", []], ["زربابل", ["H2216"]], [" ", []], ["حاكم", ["H6346"]], [" ", []], ["يهوذا", ["H3063"]], [" ", []], ["وقل", ["H559"]], [" له: ", []], ["أنا", ["H589"]], [" مزمع أن ", []], ["أزلزل", ["H7493"]], [" ", []], ["السماء", ["H8064"]], [" ", []], ["والأرض", ["H776"]], [".", []]]}, {"c": 2, "v": 22, "text": "وأطوح بعروش ممالك الأمم، وأدمر قوتها وأقلب المركبات وفرسانها، فتهوي الخيول وركابها ويلقى كل واحد حتفه بسيف صاحبه.", "groups": [{"kw": "overthrow", "raw": "Isa_60:12; Eze_21:27; Dan_2:34, Dan_2:35, Dan_2:44, Dan_2:45, Dan_7:25-27, Dan_8:25; Mic_5:8, Mic_5:15; Zep_3:8; Zec_10:11, Zec_12:2-5, Zec_14:3; Mat_24:7; Rev_11:15", "note": "", "refs": [{"l": "Isa 60:12", "n": "", "vs": [[12, "لأن الأمة والمملكة التي لا تخضع لك تهلك، وهذه الشعوب تتعرض للخراب الساحق."]]}, {"l": "Eze 21:27", "n": "", "vs": [[27, "ها أنا أقلبه، أقلبه، أقلبه، حتى لا يبقى منه أثر، إلى أن يأتي صاحب الحكم، فأعطيه إياه."]]}, {"l": "Dan 2:34", "n": "", "vs": [[34, "وبينما أنت في الرؤيا انقض حجر لم يقطع بيد إنسان، وضرب التمثال على قدميه المصنوعتين من خليط الحديد والخزف فسحقهما،"]]}, {"l": "Dan 2:35", "n": "", "vs": [[35, "فتحطم الحديد والخزف والنحاس والفضة والذهب معا، وانسحقت وصارت كعصافة البيدر في الصيف، فحملتها الريح حتى لم يبق لها أثر. أما الحجر الذي ضرب التمثال فتحول إلى جبل كبير وملأ الأرض كلها."]]}, {"l": "Dan 2:44", "n": "", "vs": [[44, "وفي عهد هؤلاء الملوك يقيم إله السماوات مملكة لا تنقرض إلى الأبد، ولا يترك ملكها لشعب آخر، وتسحق وتبيد جميع هذه الممالك. أما هي فتخلد إلى الأبد."]]}, {"l": "Dan 2:45", "n": "", "vs": [[45, "لأنك رأيت أن الحجر المنقض الذي لم يقطع من الجبل بيدين، قد سحق الحديد والنحاس والخزف والفضة والذهب. إن الله العظيم قد أطلع الملك عما سيحدث في الأيام الآتية؛ فالحلم حقيقة وتفسيره صدق»."]]}, {"l": "Dan 7:25-27", "n": "", "vs": [[25, "ويعير العلي وينكل بقديسيه، ويحاول أن يغير الأوقات والقوانين، فيذل القديسين ثلاث سنوات ونصف السنة."], [26, "ولكن ينعقد مجلس القضاء، فيجرد من سلطانه فيدمر ويفنى إلى المنتهى."], [27, "وتوهب المملكة والسلطان وعظمة الممالك القائمة تحت كل السماء إلى شعب قديسي العلي، فيكون ملكوت العلي ملكوتا أبديا، وتعبده جميع السلاطين ويطيعونه."]]}, {"l": "Dan 8:25", "n": "", "vs": [[25, "وبدهائه ومكره يحقق مآربه، ويتكبر في قلبه ويهلك الكثيرين وهم في طمأنينة، ويتمرد على رئيس الرؤساء لكنه يتحطم بغير يد الإنسان."]]}, {"l": "Mic 5:8", "n": "", "vs": [[8, "وتكون بقية ذرية يعقوب بين الشعوب الكثيرة كأسد بين وحوش الغابة، أو كشبل بين قطعان الغنم، الذي إن اقتحم يدوس ويفترس وليس من منقذ."]]}, {"l": "Mic 5:15", "n": "", "vs": [[15, "وبغضب وسخط أنتقم من الأمم التي لم تطعني."]]}, {"l": "Zep 3:8", "n": "", "vs": [[8, "لذلك يقول الرب: انتظروني لأني عزمت في اليوم الذي أقوم فيه كشاهد أن أجمع الأمم وأحشد الممالك لأسكب عليهم سخطي واحتدام غضبي، لأن الأرض بكاملها ستؤكل بنار غيرة غيظي."]]}, {"l": "Zec 10:11", "n": "", "vs": [[11, "يجتازون عبر بحر المشقات، فتنحسر الأمواج وتجف لجج النيل. تذل كبرياء أشور ويزول صولجان مصر."]]}, {"l": "Zec 12:2-5", "n": "", "vs": [[2, "«ها أنا مزمع أن أجعل أورشليم كأس خمر تترنح منها جميع الشعوب المحيطة بها، فتحاصر يهوذا أيضا في أثناء حصارها لأورشليم."], [3, "في ذلك اليوم أجعل أورشليم كصخرة ثقيلة تعجز عن حملها جميع الشعوب. وكل من يحاول حملها ينشق شقا، ويتألب عليها جميع شعوب الأرض."], [4, "في ذلك اليوم، يقول الرب: أصيب كل فرس من جيوش الأعداء بالرعب، وفارسه بالجنون، وأرعى برضاي شعب يهوذا، وأبتلي جميع خيول الأمم بالعمى."], [5, "فيقول آنئذ رؤساء يهوذا في قلوبهم: إن سكان أورشليم أعزاء بفضل قوة الرب القدير إلههم."]]}, {"l": "Zec 14:3", "n": "", "vs": [[3, "ولا يلبث أن يهب الرب ليحارب تلك الأمم، كما كان يحارب في يوم القتال."]]}, {"l": "Mat 24:7", "n": "", "vs": [[7, "فسوف تنقلب أمة على أمة، ومملكة على مملكة، وتحدث مجاعات وزلازل في عدة أماكن."]]}, {"l": "Rev 11:15", "n": "", "vs": [[15, "ونفخ الملاك السابع في بوقه فسمعت أصوات عالية في السماء تقول: «قد صار ملك العالم لربنا ومسيحه. إنه يملك إلى أبد الآبدين»."]]}], "kwAr": "وأطوح", "noteAr": ""}, {"kw": "and I will overthrow the chariots", "raw": "Exo_14:17, Exo_14:28, Exo_15:4, Exo_15:19; Psa_46:9, Psa_76:6; Eze_39:20; Mic_5:10; Zec_4:6; Zec_9:10", "note": "", "refs": [{"l": "Exo 14:17", "n": "", "vs": [[17, "فها أنا أغلظ قلوب المصريين فيسعون وراءكم، فأتعظم (بالقضاء) على فرعون وعلى مركباته وفرسانه،"]]}, {"l": "Exo 14:28", "n": "", "vs": [[28, "وارتدت المياه وأغرقت المركبات والفرسان وكل جيش فرعون الذي لحق بهم إلى البحر، فلم يفلت منهم ناج واحد."]]}, {"l": "Exo 15:4", "n": "", "vs": [[4, "طرح فرعون وجيشه في البحر، وأغرق خيرة قادة فرعون في البحر الأحمر."]]}, {"l": "Exo 15:19", "n": "", "vs": [[19, "وعندما دخلت خيول فرعون ومركباته وفرسانه إلى البحر رد عليهم مياه البحر، أما بنو إسرائيل فمشوا على اليابسة في وسط البحر."]]}, {"l": "Psa 46:9", "n": "", "vs": [[9, "يقضي على الحروب في الأرض كلها. يكسر القوس ويشق الرمح، ويحرق المركبات الحربية بالنار."]]}, {"l": "Psa 76:6", "n": "", "vs": [[6, "من زجرك ياإله يعقوب تصرع الفرسان والخيول."]]}, {"l": "Eze 39:20", "n": "", "vs": [[20, "فتشبعين على مائدتي من الخيل وفرسانها، من الجبابرة وكل المحاربين، يقول السيد الرب."]]}, {"l": "Mic 5:10", "n": "", "vs": [[10, "ويقول الرب: في ذلك اليوم أستأصل خيولكم من بينكم وأدمر مركبات حربكم،"]]}, {"l": "Zec 4:6", "n": "", "vs": [[6, "فقال: «هذه رسالة الرب إلى زربابل: لا بالقدرة ولا بالقوة، ولكن بروحي تفلحون يقول الرب القدير."]]}, {"l": "Zec 9:10", "n": "", "vs": [[10, "وأستأصل المركبات الحربية من أفرايم، والخيل من أورشليم، وتبيد أقواس القتال، ويشيع السلام بين الأمم، ويمتد ملكه من البحر إلى البحر، ومن نهر الفرات إلى أقاصي الأرض."]]}], "kwAr": "وأقلب المركبات", "noteAr": ""}, {"kw": "every", "raw": "Jdg_7:22; 1Sa_14:16; 2Ch_20:22; Isa_9:19, Isa_19:2", "note": "", "refs": [{"l": "Jdg 7:22", "n": "", "vs": [[22, "وعادت الفرق الثلاث تنفخ في أبواقها، فجعل الرب أعداءهم يقاتلون بعضهم بعضا، وأغمد كل واحد سيفه في صاحبه وفروا إلى بيت شطة باتجاه صردة حتى بلغوا آبل محولة بالقرب من طباة."]]}, {"l": "1Sa 14:16", "n": "", "vs": [[16, "وشاهد مراقبو جيش شاول في جبعة بنيامين ما أصاب جيش الفلسطينيين من تبدد وتشتت."]]}, {"l": "2Ch 20:22", "n": "", "vs": [[22, "وعندما شرعوا في الغناء والتسبيح أثار الرب كمائن على العمونيين والموآبيين، وأهل جبل سعير القادمين لمحاربة يهوذا، فانكسروا."]]}, {"l": " Joh 6:27", "n": "", "vs": [[27, "لا تسعوا وراء الطعام الفاني، بل وراء الطعام الباقي إلى الحياة الأبدية، والذي يعطيكم إياه ابن الإنسان، لأن هذا الطعام قد وضع الله الآب ختمه عليه»."]]}, {"l": "2Ti 2:19", "n": "", "vs": [[19, "إلا أن الأساس الراسخ الذي وضعه الله يظل ثابتا، وعليه هذا الختم: «الرب يعرف خاصته»، وأيضا: «لينفصل عن الإثم كل من يسمي اسم الرب!»"]]}], "kwAr": "وأجعلك", "noteAr": ""}, {"kw": "for", "raw": "Isa_42:1, Isa_43:10, Isa_49:1-3; Zec_4:6-14; Mat_12:18; 1Pe_2:4", "note": "", "refs": [{"l": "Isa 42:1", "n": "", "vs": [[1, "هوذا عبدي الذي أعضده، مختاري الذي ابتهجت به نفسي. وضعت روحي عليه ليسوس الأمم بالعدل."]]}, {"l": "Isa 43:10", "n": "", "vs": [[10, "أنتم شهودي يقول الرب، وعبدي الذي اصطفيته، لتعلموا وتؤمنوا بي، وتدركوا أني أنا أنا هو الله ، لم يوجد إله قبلي ولا يكون إله بعدي."]]}, {"l": "Isa 49:1-3", "n": "", "vs": [[1, "أنصتي إلي أيتها الجزائر، واصغوا ياشعوب البلاد البعيدة: قد دعاني الرب وأنا مازلت جنينا، وذكر اسمي وأنا ما برحت في رحم أمي."], [2, "جعل فمي كسيف قاطع، وواراني في ظل يديه؛ صنع مني سهما مسنونا وأخفاني في جعبته،"], [3, "وقال لي: «أنت عبدي إسرائيل الذي به أتمجد"]]}, {"l": "Zec 4:6-14", "n": "", "vs": [[6, "فقال: «هذه رسالة الرب إلى زربابل: لا بالقدرة ولا بالقوة، ولكن بروحي تفلحون يقول الرب القدير."], [7, "أي شيء أنت أيها الجبل العظيم؟ أنت سهل أمام زربابل، وسيضع زربابل حجر الزاوية في خضم هتاف القائلين: ليباركه، ليباركه الرب»."], [8, "ثم أوحى الرب إلي بكلمته قائلا:"], [9, "«قد أسست يدا زربابل هذا الهيكل، ويداه تكملان بناءه، فتدرك أن الرب القدير قد أرسلني إليكم."], [10, "من يزدري بيوم الإنجازات الصغيرة؟ يفرح الرجال حين يشاهدون ميزان البناء في يد زربابل، وهذه السبعة هي أعين الرب الجائلة في كل الأرض»."], [11, "ثم سألته: «ما هاتان الزيتونتان القائمتان عن يمين المنارة وعن يسارها؟"], [12, "وما غصنا الزيتون هذان المنتصبان إلى جوار أنبوبتي الذهب، اللذان يصبان الزيت الذهبي؟»"], [13, "فأجابني: «ألا تعلم ما هاتان؟» فقلت: «لا ياسيدي»."], [14, "فقال: «هاتان هما الممسوحان بالزيت اللذان يمثلان لدى رب الأرض كلها»."]]}, {"l": "Mat 12:18", "n": "", "vs": [[18, "«
