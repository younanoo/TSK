<script>window.CATALOG=[{"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 5, "nv": 99, "refs": 1290, "last": "5:17", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 37, "abbr": "Hag", "en": "Haggai", "verses": [{"c": 1, "v": 1, "text": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:", "groups": [{"kw": "second", "raw": "Hag_2:1, Hag_2:10,Hag_2:20; Ezr_4:24, Ezr_5:1, Ezr_5:2; Zec_1:1", "note": "", "refs": [{"l": "Hag 2:1", "n": "", "vs": [[1, "وفي اليوم الحادي والعشرين من الشهر السابع (أي شهر تشرين الأول ; أكتوبر) أوحى الرب بهذه الكلمة إلى حجي النبي:"]]}, {"l": "Hag 2:10", "n": "", "vs": [[10, "وفي اليوم الرابع والعشرين من الشهر التاسع (أي شهر كانون الأول ; ديسمبر)، في السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي حجي:"]]}, {"l": "Hag 2:20", "n": "", "vs": [[20, "ثم أوحى الرب بكلمته إلى حجي للمرة الثانية في اليوم الرابع والعشرين من الشهر قائلا:"]]}, {"l": "Ezr 4:24", "n": "", "vs": [[24, "حينئذ توقف العمل في بناء هيكل الرب في أورشليم حتى السنة الثانية من تولي الملك داريوس عرش مملكة فارس."]]}, {"l": "Ezr 5:1", "n": "", "vs": [[1, "في ذلك الحين تنبأ النبيان حجي وزكريا بن عدو لليهود المقيمين في أورشليم ويهوذا باسم الرب إله إسرائيل المهيمن عليهم."]]}, {"l": "Ezr 5:2", "n": "", "vs": [[2, "فقام زربابل بن شألتيئيل ويشوع بن يوصادوق، وشرعا في استكمال بناء هيكل الله الذي في أورشليم، بمعونة نبيي الله،"]]}, {"l": "Zec 1:1", "n": "", "vs": [[1, "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"]]}], "kwAr": "الثانية", "noteAr": ""}, {"kw": "the sixth", "raw": "Elul the sixth month of the ecclesiastical year, answering to a part of September.", "note": "Elul the sixth month of the ecclesiastical year, answering to a part of September.", "refs": [], "kwAr": "الشهر السادس", "noteAr": "أيلول: الشهر السادس من السنة الكنسية، ويقابل جزءا من سبتمبر."}, {"kw": "by Haggai", "raw": "Heb. by the hand of Haggai, Exo_4:13; 1Ki_14:18; 2Ki_14:25; Ezr_6:14", "note": "Heb. by the hand of Haggai, Exo_4:13; 1Ki_14:18; 2Ki_14:25; Ezr_6:14", "refs": [{"l": "Exo 4:13", "n": "", "vs": [[13, "لكن موسى أجاب: «ياسيد، أتوسل إليك أن ترسل من تشاء غيري»."]]}, {"l": "1Ki 14:18", "n": "", "vs": [[18, "فدفنه الإسرائيليون وناحوا عليه، تماما حسب كلام الرب الذي نطق به على لسان عبده أخيا النبي."]]}, {"l": "2Ki 14:25", "n": "", "vs": [[25, "وهو الذي استرجع لإسرائيل أراضيها الممتدة من حماة إلى البحر الميت، تحقيقا لكلام الرب الذي نطق به على لسان عبده يونان بن أمتاي النبي من أهل جت حافر،"]]}, {"l": "Ezr 6:14", "n": "", "vs": [[14, "وهكذا تابع شيوخ اليهود البناء بنجاح، تتميما لنبوءة حجي النبي وزكريا بن عدو، فاستكملوا البناء حسب أمر إله إسرائيل وأمر كورش وداريوس وأرتحششتا ملوك فارس."]]}], "kwAr": "على لسان النبي حجي", "noteAr": "بالعبرية: «بيد حجي». انظر خر 4: 13؛ 1مل 14: 18؛ 2مل 14: 25؛ عز 6: 14"}, {"kw": "unto", "raw": "Hag_1:12, Hag_1:14, Hag_2:2, Hag_2:4, Hag_2:21-23; 1Ch_3:17, 1Ch_3:19, Salathiel, Ezr_2:2, Ezr_3:2, Ezr_3:8, Ezr_4:2, Ezr_5:2; Neh_7:7; Zec_4:6-10; Mat_1:12, Mat_1:13, Zorobabel, Salathiel, Luk_3:27", "note": "Hag_1:12, Hag_1:14, Hag_2:2, Hag_2:4, Hag_2:21-23; 1Ch_3:17, 1Ch_3:19, Salathiel, Ezr_2:2, Ezr_3:2, Ezr_3:8, Ezr_4:2, Ezr_5:2; Neh_7:7; Zec_4:6-10; Mat_1:12, Mat_1:13, Zorobabel, Salathiel, Luk_3:27", "refs": [{"l": "Hag 1:12", "n": "", "vs": [[12, "حينئذ أطاع زربابل بن شألتيئيل ويهوشع بن يهوصادق رئيس الكهنة، وسائر بقية شعب إسرائيل صوت الرب إلههم، واستمعوا إلى كلمات حجي النبي، كما بعثه الرب إلههم إليهم، فاعترى الخوف الشعب في محضر الله."]]}, {"l": "Hag 1:14", "n": "", "vs": [[14, "وبث الرب الهمة في نفس زربابل بن شألتيئيل حاكم يهوذا ونفس يهوشع بن يهوصادق رئيس الكهنة ونفوس سائر بقية الشعب، فتوافدوا وباشروا العمل في هيكل الرب القدير إلههم."]]}, {"l": "Hag 2:2", "n": "", "vs": [[2, "«خاطب زربابل بن شألتيئيل حاكم يهوذا، ويهوشع بن يهوصادق رئيس الكهنة وجميع البقية الناجية من الشعب قائلا:"]]}, {"l": "Hag 2:4", "n": "", "vs": [[4, "والآن تشجع يازربابل، يقول الرب، وتشدد يايهوشع بن يهوصادق رئيس الكهنة، وأنتم كذلك ياجميع سكان الأرض. تشجعوا واعملوا بجد لأني معكم، يقول الرب القدير."]]}, {"l": "Hag 2:21-23", "n": "", "vs": [[21, "«كلم زربابل حاكم يهوذا وقل له: أنا مزمع أن أزلزل السماء والأرض."], [22, "وأطوح بعروش ممالك الأمم، وأدمر قوتها وأقلب المركبات وفرسانها، فتهوي الخيول وركابها ويلقى كل واحد حتفه بسيف صاحبه."], [23, "في ذلك اليوم، يقول الرب القدير، أصطفيك يازربابل بن شألتيئيل عبدي، وأجعلك كخاتم في إصبعي (حاكما باسمي) لأني اخترتك يقول الرب القدير»."]]}, {"l": "1Ch 3:17", "n": "", "vs": [[17, "وأنجب يكنيا: أسير وشألتيئيل (ومن أحفاد يهوياقيم):"]]}, {"l": "1Ch 3:19", "n": "", "vs": [[19, "وأنجب فدايا: زربابل وشمعي. أما أبناء زربابل فهم مشلام، وحننيا وأختهم شلومية،"]]}, {"l": "Ezr 2:2", "n": "", "vs": [[2, "وقد جاءوا بقيادة زربابل، ويشوع، ونحميا، وسرايا، ورعلايا، ومردخاي، وبلشان، ومسفار، وبغواي ورحوم، وبعنة. وهذا بيان بالعائدين من شعب إسرائيل:"]]}, {"l": "Ezr 3:2", "n": "", "vs": [[2, "فهب يشوع بن يوصاداق وأقرباؤه الكهنة، وزربابل بن شألتئيل وأقرباؤه، وبنوا مذبح إله إسرائيل، ليقربوا عليه محرقات كما هو مكتوب في شريعة موسى رجل الله."]]}, {"l": "Ezr 3:8", "n": "", "vs": [[8, "وفي الشهر الثاني من السنة الثانية من رجوعهم إلى أورشليم إلى بيت الله، ابتدأ زربابل بن شألتئيل ويشوع بن يوصاداق، وبقية أقربائهم من الكهنة واللاويين، وسائر القادمين من السبي إلى أورشليم، بالعمل في بناء الهيكل، فأقاموا اللاويين، البالغين من العمر عشرين سنة فما فوق، للإشراف على العمل في هيكل الرب."]]}, {"l": "Ezr 4:2", "n": "", "vs": [[2, "أقبلوا إلى زربابل ورؤساء العشائر قائلين لهم: «دعونا نبني معكم، لأننا مثلكم نعبد إلهكم، وله قربنا الذبائح منذ أيام الملك أسرحدون ملك أشور، الذي أتى بنا إلى هذه الأرض»."]]}, {"l": "Ezr 5:2", "n": "", "vs": [[2, "فقام زربابل بن شألتيئيل ويشوع بن يوصادوق، وشرعا في استكمال بناء هيكل الله الذي في أورشليم، بمعونة نبيي الله،"]]}, {"l": "Neh 7:7", "n": "", "vs": [[7, "الذين وفدوا مع زربابل ويشوع ونحميا وعزريا ورعميا ونحماني ومردخاي وبلشان ومسفارث وبغواي ونحوم وبعنة. وهذا بيان بعدد رجال شعب إسرائيل:"]]}, {"l": "Zec 4:6-10", "n": "", "vs": [[6, "فقال: «هذه رسالة الرب إلى زربابل: لا بالقدرة ولا بالقوة، ولكن بروحي تفلحون يقول الرب القدير."], [7, "أي شيء أنت أيها الجبل العظيم؟ أنت سهل أمام زربابل، وسيضع زربابل حجر الزاوية في خضم هتاف القائلين: ليباركه، ليباركه الرب»."], [8, "ثم أوحى الرب إلي بكلمته قائلا:"], [9, "«قد أسست يدا زربابل هذا الهيكل، ويداه تكملان بناءه، فتدرك أن الرب القدير قد أرسلني إليكم."], [10, "من يزدري بيوم الإنجازات الصغيرة؟ يفرح الرجال حين يشاهدون ميزان البناء في يد زربابل، وهذه السبعة هي أعين الرب الجائلة في كل الأرض»."]]}, {"l": "Mat 1:12", "n": "", "vs": [[12, "وبعد السبي إلى بابل، يكنيا أنجب شألتئيل. وشألتئيل أنجب زربابل."]]}, {"l": "Mat 1:13", "n": "", "vs": [[13, "وزربابل أنجب أبيهود. وأبيهود أنجب ألياقيم. وألياقيم أنجب عازور."]]}, {"l": "Luk 3:27", "n": "", "vs": [[27, "بن يوحنا، بن ريسا بن زربابل، بن شألتئيل بن نيري،"]]}], "kwAr": "إلى زربابل", "noteAr": "انظر حج 1: 12، 14؛ 2: 2، 4؛ 2: 21-23؛ 1أخ 3: 17، 19؛ عز 2: 2؛ 3: 2، 8؛ 4: 2؛ 5: 2؛ نح 7: 7؛ زك 4: 6-10؛ مت 1: 12، 13؛ لو 3: 27 (زربابل وشألتيئيل)"}, {"kw": "governor", "raw": "or, captain, Ezr_1:8, Ezr_2:63; Neh_5:14, Neh_8:9", "note": "or, captain, Ezr_1:8, Ezr_2:63; Neh_5:14, Neh_8:9", "refs": [{"l": "Ezr 1:8", "n": "", "vs": [[8, "وأمر مثرداث الخازن أن يعدها لشيشبصر رئيس يهوذا،"]]}, {"l": "Ezr 2:63", "n": "", "vs": [[63, "وحرم عليهم الحاكم الأكل من طعام الكهنة إلى أن يحضر كاهن يقدر أن يستخدم الأوريم والتميم (ليعلن له الرب صحة نسبهم إلى الكهنة)."]]}, {"l": "Neh 5:14", "n": "", "vs": [[14, "كما أنني منذ أن عينت واليا في أرض يهوذا، من مستهل السنة العشرين من حكم أرتحششتا الملك، إلى السنة الثانية والثلاثين، أي طوال اثنتي عشرة سنة لم آخذ من الشعب الضرائب المخصصة لنفقات الوالي لأعيش منها أنا وموظفي،"]]}, {"l": "Neh 8:9", "n": "", "vs": [[9, "وإذ بكى الشعب لدى سماعهم نص الشريعة، خاطبهم نحميا الوالي وعزرا الكاتب واللاويون الذين علموا الشعب قائلين: «لا تنوحوا ولا تبكوا، فهذا اليوم مقدس للرب إلهكم»"]]}], "kwAr": "حاكم", "noteAr": "أو: «قائد». انظر عز 1: 8؛ 2: 63؛ نح 5: 14؛ 8: 9"}, {"kw": "Joshua", "raw": "Ezr_2:2, Ezr_3:8, Ezr_5:2; Neh_12:1, Neh_12:10", "note": "", "refs": [{"l": "Ezr 2:2", "n": "", "vs": [[2, "وقد جاءوا بقيادة زربابل، ويشوع، ونحميا، وسر  40: 4؛ دا 6: 14؛ 10: 12"}], "arS": [["والآن", ["H6258"]], [" ", []], ["هذا", ["H3541"]], [" ما ", []], ["يقوله", ["H559"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["القدير", ["H6635"]], [": «", []], ["تأملوا", ["H7760", "H3824", "H5921"]], [" فيما ", []], ["فعلتم", ["H1870"]], [":", []]]}, {"c": 1, "v": 6, "text": "لقد زرعتم كثيرا وحصدتم قليلا. أكلتم ولم تشبعوا. شربتم ولم ترتووا. اكتسيتم ولم تستدفئوا. ومن ينال أجرة سرعان ما تتبدد، وكأنها وضعت في صرة مثقوبة».", "groups": [{"kw": "have", "raw": "Hag_1:9, Hag_2:16; Lev_26:20; Deu_28:38-40; 2Sa_21:1; Psa_107:34; Isa_5:10; Jer_14:4; Hos_4:10, Hos_8:7; Joe_1:10-13; Amo_4:6-9; Mic_6:14, Mic_6:15; Zec_8:10; Mal_2:2, Mal_3:9-11", "note": "", "refs": [{"l": "Hag 1:9", "n": "", "vs": [[9, "لقد توقعتم كثيرا فحصلتم على قليل، وما أتيتم به إلى البيت من غلة نفخت عليه وبددته. لماذا فعلت هذا يقول الرب القدير؟ من أجل بيتي الذي ما برح مهدما بينما كل واحد منكم منهمك في بناء بيته."]]}, {"l": "Hag 2:16", "n": "", "vs": [[16, "عندما كان يقبل أحد على كومة حبوب ظنا منه أن الأرض قد غلت عشرين مكيالا، يجد أنها لم تغل سوى عشرة فقط. وحين يدنو من المعصرة ليغرف ملء خمسين وعاء، لا يجد إلا عشرين."]]}, {"l": "Lev 26:20", "n": "", "vs": [[20, "فيذهب جهدكم باطلا لأن أرضكم لن تعطي غلتها، وأشجار الأرض لن تعطي أثمارها."]]}, {"l": "Deu 28:38-40", "n": "", "vs": [[38, "تبذرون كثيرا من البذار في الحقول، ولا تحصدون إلا القليل، لأن الجراد يلتهمه."], [39, "تكدحون في غرس كروم ومن خمرها لا تشربون، ومن ثمرها لا تجنون، لأن الدود ينخرها."], [40, "تكتظ أراضيكم بأشجار الزيتون، ولكن من زيتها لا تدهنون، لأن زيتونكم ينتثر على الأرض قبل نضجه."]]}, {"l": "2Sa 21:1", "n": "", "vs": [[1, "وحدثت مجاعة في أثناء حكم داود استمرت ثلاث سنوات متتالية، فالتمس داود وجه الرب. فأجابه الرب: «هذا من أجل ما ارتكبه شاول وأهل بيته الملطخة أيديهم بدماء الجبعونيين الذين قتلوهم."]]}, {"l": "Psa 107:34", "n": "", "vs": [[34, "يجعل الحقول الخصيبة أرضا ملحة جرداء من جراء شر سكانها."]]}, {"l": "Isa 5:10", "n": "", "vs": [[10, "فعشرة فدادين كروم لا تغل سوى بث واحد (مئتين وعشرين لترا) من النبيذ، وحومر (عشر كيلات) من البذور ينتج كيلة واحدة."]]}, {"l": "Jer 14:4", "n": "", "vs": [[4, "خزي الفلاحون وغطوا رؤوسهم لأن الأرض قد تشققت لانقطاع المطر عنها."]]}, {"l": "Hos 4:10", "n": "", "vs": [[10, "فيأكلون ولا يشبعون، ويزنون ولا يتكاثرون، لأنهم نبذوا الرب واستسلموا إلى العهارة."]]}, {"l": "Hos 8:7", "n": "", "vs": [[7, "إنهم يزرعون الريح، وسيحصدون الزوبعة. زرع عقيم لا يصنع دقيقا، وإن صنع يلتهمه الغرباء."]]}, {"l": "Joe 1:10-13", "n": "", "vs": [[10, "قد خربت الحقول، وناحت الأرض لأن الحنطة تلفت والخمرة انقطعت، وافتقد زيت الزيتون."], [11, "اخزوا أيها الحراثون وأعولوا أيها الكرامون على الحنطة والشعير، لأن حصاد الحقل قد تلف."], [12, "قد ذوى الكرم وذبل التين والرمان والنخيل والتفاح ويبست سائر أشجار الحقل، وزالت البهجة من أبناء البشر."], [13, "أيها الكهنة اتشحوا بالمسوح ونوحوا. ولولوا ياخدام المذبح. تعالوا وبيتوا ليلتكم بالمسوح ياخدام إلهي، لأن تقدمات الدقيق والخمر قد منعت عن هيكل الله."]]}, {"l": "Amo 4:6-9", "n": "", "vs": [[6, "قد جعلت الجوع يعم مدنكم، فلم تتسخ أسنانكم بالطعام! وأفقرتكم إلى الخبز في كل أماكن سكناكم، ولكنكم لم ترجعوا إلي تائبين، يقول الرب."], [7, "منعت عنكم المطر ولم يكن قد بقي للحصاد سوى ثلاثة أشهر، وأمطرت على مدينة دون مدينة، وعلى حقل دون الآخر، فجف الحقل الذي لم أمطر عليه."], [8, "فأقبلت مدينتان أو ثلاث على مدينة واحدة لتشرب ماء، ولكنها لم ترتو، ومع ذلك لم ترجعوا إلي تائبين، يقول الرب."], [9, "أرسلت الرياح اللافحة واليرقان لتجفف محاصيلكم، والتهم الجراد حدائقكم وكرومكم وأشجار تينكم وزيتونكم. وما رجعتم إلي!"]]}, {"l": "Mic 6:14", "n": "", "vs": [[14, "ستأكلين ولا تشبعين، ويظل جوفك خاويا. وما تدخرينه تعجزين عن الاحتفاظ به. لأني أدفعه للسيف."]]}, {"l": "Mic 6:15", "n": "", "vs": [[15, "تزرعين ولا تحصدين. تعصرين الزيتون ولا تدهني بزيته، وتعصرين العنب ولا تشربين من خمره."]]}, {"l": "Zec 8:10", "n": "", "vs": [[10, "فإنه قبل تلك الأيام لم تدفع أجرة لرجل أو بهيمة، ولم يكن هناك من يأمن على نفسه من أعدائه في ذهابه وإيابه، لأنني أثرت كل واحد ضد صاحبه."]]}, {"l": "Mal 2:2", "n": "", "vs": [[2, "إن أبيتم الاستماع، ولم تنووا في قلوبكم أن تمجدوا اسمي، أصب عليكم ا ظيم ومدهش،"], [10, "وأنا أدفع أجرة قاطعي الخشب: عشرين ألف كر من الحنطة، وعشرين ألف كيس من الشعير، وعشرين ألف بث خمر، وعشرين ألف برميل زيت»."]]}, {"l": "Ezr 3:7", "n": "", "vs": [[7, "ثم تبرعوا بفضة لاستئجار نحاتين ونجارين، وقدموا طعاما ومشروبات وزيتا للصيدونيين والصوريين، لينقلوا لهم خشب أرز من لبنان إلى ساحل يافا، بترخيص من كورش ملك فارس."]]}, {"l": "Ezr 6:4", "n": "", "vs": [[4, "على أن يتكون من ثلاثة صفوف من حجارة عظيمة، وصف رابع من خشب جديد. وتتكفل خزينة الملك بنفقة البناء."]]}, {"l": "Zec 11:1", "n": "", "vs": [[1, "افتح أبوابك يالبنان حتى تلتهم النار أرزك."]]}, {"l": "Zec 11:2", "n": "", "vs": [[2, "انتحب أيها السرو لأن الأرز قد تهاوى، والعظماء قد هلكوا. انتحب يابلوط باشان لأن الغابات الكثيفة دمرت."]]}], "kwAr": "إلى الجبل", "noteAr": ""}, {"kw": "and build", "raw": "Hag_1:2-4; Jon_3:1, Jon_3:2; Mat_3:8, Mat_3:9", "note": "", "refs": [{"l": "Hag 1:2-4", "n": "", "vs": [[2, "«هذا ما يقوله الرب القدير: قد قال هذا الشعب إن الوقت لم يحن بعد لبناء بيت الرب»."], [3, "فأوحى الرب بكلمته هذه إلى النبي حجي قائلا:"], [4, "«هل حان الوقت الذي فيه تقيمون في بيوت مغشاة بألواح بينما هذا البيت ما برح مهدما؟»"]]}, {"l": "Jon 3:1", "n": "", "vs": [[1, "وأمر الرب يونان ثانية:"]]}, {"l": "Jon 3:2", "n": "", "vs": [[2, "«قم امض إلى نينوى المدينة العظيمة، وأعلن لهم الرسالة التي أبلغك إياها»."]]}, {"l": "Mat 3:8", "n": "", "vs": [[8, "فأثمروا ثمرا يليق بالتوبة."]]}, {"l": "Mat 3:9", "n": "", "vs": [[9, "ولا تعللوا أنفسكم قائلين: لنا إبراهيم أبا! فإني أقول لكم: إن الله قادر أن يطلع من هذه الحجارة أولادا لإبراهيم."]]}], "kwAr": "وشيدوا", "noteAr": ""}, {"kw": "and I will take", "raw": "1Ki_9:3; 2Ch_7:16; Psa_87:2, Psa_87:3, Psa_132:13, Psa_132:14", "note": "", "refs": [{"l": "1Ki 9:3", "n": "", "vs": [[3, "وقال له: «سمعت صلاتك وتضرعك الذي رفعته أمامي، لهذا قدست هذا الهيكل الذي شيدته لأضع اسمي عليه إلى الأبد، فتكون عيناي وقلبي هناك كل الأيام."]]}, {"l": "2Ch 7:16", "n": "", "vs": [[16, "لقد اخترت هذا الهيكل وقدسته حتى أضع اسمي عليه إلى الأبد، فتكون عيناي وقلبي هناك إلى دهر الدهور."]]}, raw": "They had used all proper means in the cultivation of their lands, and had sown much; but when they rationally entertained the most sanguine expectations of a large increase, they were strangely disappointed; and even what they had brought home was unaccountably wasted, as if the Lord had blown upon it, and driven it away! And the reason was, because they neglected the temple, and left it in ruins, whilst they eagerly employed themselves in building and decorating their own houses; therefore they were visited by drought and famine, and by various diseases on man and beast. Hag_1:6, Hag_2:16, Hag_2:17; Isa_17:10,Isa_17:11; Mal_3:8-11", "note": "They had used all proper means in the cultivation of their lands, and had sown much; but when they rationally entertained the most sanguine expectations of a large increase, they were strangely disappointed; and even what they had brought home was unaccountably wasted, as if the Lord had blown upon it, and driven it away! And the reason was, because they neglected the temple, and left it in ruins, whilst they eagerly employed themselves in building and decorating their own houses; therefore they were visited by drought and famine, and by various diseases on man and beast. Hag_1:6, Hag_2:16, Hag_2:17; Isa_17:10,Isa_17:11; Mal_3:8-11", "refs": [{"l": "Hag 1:6", "n": "", "vs": [[6, "لقد زرعتم كثيرا وحصدتم قليلا. أكلتم ولم تشبعوا. شربتم ولم ترتووا. اكتسيتم ولم تستدفئوا. ومن ينال أجرة سرعان ما تتبدد، وكأنها وضعت في صرة مثقوبة»."]]}, {"l": "Hag 2:16", "n": "", "vs": [[16, "عندما كان يقبل أحد على كومة حبوب ظنا منه أن الأرض قد غلت عشرين مكيالا، يجد أنها لم تغل سوى عشرة فقط. وحين يدنو من المعصرة ليغرف ملء خمسين وعاء، لا يجد إلا عشرين."]]}, {"l": "Hag 2:17", "n": "", "vs": [[17, "إني ابتليت تعب أيديكم بالقحط والذبول والبرد، ولكنكم لم ترجعوا تائبين إلي، يقول الرب."]]}, {"l": "Isa 17:10", "n": "", "vs": [[10, "لأنكم قد نسيتم إله خلاصكم، ولم تذكروا صخرة عزكم. لذلك وإن كنتم تزرعون غرسا مبهجا وتغرسون زرعا غريبا،"]]}, {"l": "Isa 17:11", "n": "", "vs": [[11, "وإن كنتم يوم تغرسونه تنمونه، وفي الصباح عندما تزرعونه تجعلونه يزهر، فإن الحصيد لا يكون منتجا في يوم الضربة المهلكة التي لا برء منها."]]}, {"l": "Mal 3:8-11", "n": "", "vs": [[8, "أيسلب الإنسان الله ؟ لقد سلبتموني! وتسألون: بماذا سلبناك؟ في العشور والقرابين."], [9, "أنتم، بل الأمة كلها، تحت اللعنة لأنكم سلبتموني."], [10, "هاتوا العشور جميعها إلى بيت الخزينة ليتوافر في هيكلي طعام، واختبروني لتروا إن كنت لا أفتح كوى السماء وأفيض عليكم بركة وفيرة، يقول الرب القدير."], [11, "وأكف عنكم أذى الجراد الملتهم، فلا يتلف لكم غلات الأرض، ولا تصاب كرومكم بالعقم، يقول الرب القدير."]]}], "kwAr": "لقد توقعتم", "noteAr": "كانوا قد استعملوا كل الوسائل اللازمة في فلاحة أراضيهم وزرعوا كثيرا، ولكنهم حين توقعوا بحسب العقل ازديادا وفيرا خابت آمالهم على نحو غريب، حتى إن ما أتوا به إلى البيت ضاع بما لا يُفسَّر، كأن الرب نفخ عليه وطيّره. والسبب أنهم أهملوا الهيكل وتركوه خرابا بينما انهمكوا في بناء بيوتهم وتزيينها، فافتقدهم القحط والجوع وأمراض شتى في الإنسان والبهيمة. انظر حج 1: 6؛ 2: 16، 17؛ إش 17: 10، 11؛ ملا 3: 8-11"}, {"kw": "blow upon it", "raw": "or, blow it away, 2Sa_22:16; 2Ki_19:7; Isa_40:7; Mal_2:2", "note": "or, blow it away, 2Sa_22:16; 2Ki_19:7; Isa_40:7; Mal_2:2", "refs": [{"l": "2Sa 22:16", "n": "", "vs": [[16, "ظهرت مجاري المياه العميقة وانكشفت أسس المسكونة من زجر الرب ومن ريح أنفه اللافحة."]]}, {"l": "2Ki 19:7", "n": "", "vs": [[7, "فها خبر سييء يرد إليه من بلاده يحمله على العودة إليها حيث أقضي عليه بحد السيف في عقر داره»."]]}, {"l": "Isa 40:7", "n": "", "vs": [[7, "يذبل العشب ويذوي الزهر لأن نفخة الرب تهب عليه. حقا إن الشعب عشب."]]}, {"l": "Mal 2:2", "n": "", "vs": [[2, "إن أبيتم الاستماع، ولم تنووا في قلوبكم أن تمجدوا اسمي، أصب عليكم اللعنة، وألعن بركاتكم، بل ها أنا قد حولتها إلى لعنات لأنكم لم تجعلوها في قلوبكم."]]}], "kwAr": "نفخت عليه", "noteAr": "أو: «بددته». انظر 2صم 22: 16؛ 2مل 19: 7؛ إش 40: 7؛ ملا 2: 2"}, {"kw": "Why", "raw": "Job_10:2; Psa_77:5-10", "note": "", "refs": [{"l": "Job 10:2", "n": "", "vs": [[2, "قائلاَ لله: لا تستذنبني. فهمني لماذا تخاصمني؟"]]}, {"l": "Psa 77:5-10", "n": "", "vs": [[5, "فكرت في الأيام القديمة وفي السنين السحيقة."], [6, "في الليل أتذكر ترنيمي، وأناجي قلبي، وتجد في البحث نفسي."], [7, "هل إلى الأبد يرفضنا الرب ولا يرضى عنا أبدا؟"], [8, "هل انتهت رحمته إلى الأبد؟ هل انقطعت عنا مواعيده؟"], [9, "ألعل الله نسي رأفته؟ أم حبس بغضب مراحمه؟"], [10, "ثم قلت: «هذا يسقمني: أن يمين الله العلي قد تحولت (عنا)»"]]}], "kwAr": "لماذا", "noteAr": ""}, {"kw": "Because", "raw": "Hag_1:4; Jos_7:10-15; 2Sa_21:1; Mat_10:37, Mat_10:38; 1Co_11:30-32; Rev_2:4, Rev_3:19", "note": "", "refs": [{"l": "Hag 1:4", "n": "", "vs": [[4, "«هل حان الوقت الذي فيه تقيمون في بيوت مغشاة بألواح بينما هذا البيت ما برح مهدما؟»"]]}, {"l": "Jos 7:10-15", "n": "", "vs": [[10, "فقال الرب ليشوع: «قم، لماذا أنت ساقط على وجهك؟"], [11, "لقد ارتكب إسرائيل خطيئة، بل تعدوا على عهدي الذي أمرتهم به، بل أخذوا مما حرمته عليهم وسرقوا وأنكروا، بل خبأوا في أمتعتهم."], [12, "لهذا عجز بنو إسرائيل عن الثبات أمام أعدائهم، فولوا أمامهم الأدبار، لأنهم هالكون إذ لن أعود أكون معكم ما لم تستأصلوا الحرام من وسطكم،"], [13, "قم، واطلب من الشعب أن يتقدسوا ليوم غد، لأنه هكذا قال الرب إله إسرائيل: في وسطك حرام ياإسرائيل، ولن تتمكنوا من هزيمة أعدائكم حتى تستأصلوا الحرام من بينكم."], [14, "فلتتقدم أسباطكم في يوم غد، سبط تلو سبط، والسبط الذي يشير إليه الرب يمثل بعشائره والعشيرة التي يعينها الرب تتقدم ببيوتها، والبيت الذي يحدده الرب يتقدم برجاله."], [15, "والذي تثبت عليه جريمة السرقة مما هو محرم، يحرق بالنار هو وكل ما له، لأنه نقض عهد الرب، وارتكب قباحة في إسرائيل»."]]}, {"l": "2Sa 21:1", "n": "", "vs": [[1, "وحدثت مجاعة في أثناء حكم داود استمرت ثلاث سنوات متتالية، فالتمس داود وجه الرب. فأجابه الرب: «هذا من أجل ما ارتكبه شاول وأهل بيته الملطخة أيديهم بدماء الجبعونيين الذين قتلوهم."]]}, {"l": "Mat 10:37", "n": "", "vs": [[37, "من أحب أباه أو أمه أكثر مني، فلا يستحقني. ومن أحب ابنه أو ابنته أكثر مني، فلا يستحقني."]]}, {"l": "Mat 10:38", "n": "", "vs": [[38, "ومن لا يحمل صليبه ويتبعني، فهو لا يستحقني."]]}, {"l": "1Co 11:30-32", "n": "", "vs": [[30, "لهذا السبب فيكم كثيرون من الضعفاء والمرضى، وكثيرون يرقدون."], [31, "فلو كنا حكمنا على نفوسنا، لما كان حكم علينا."], [32, "ولكن، ما دام قد حكم علينا، فإننا نؤدب من قبل الرب حتى لا ندان مع العالم."]]}, {"l": "Rev 2:4", "n": "", "vs": [[4, "ولي عليك أنك تركت محبتك الأولى!"]]}, {"l": "Rev 3:19", "n": "", "vs": [[19, "إني أوبخ وأؤدب من أحبه، لذا كن حارا وتب!"]]}], "kwAr": "من أجل بيتي", "noteAr": ""}], "arS": [["لقد ", []], ["توقعتم", ["H6437"]], [" ", []], ["كثيرا", ["H7235"]], [" فحصلتم على ", []], ["قليل", ["H4592"]], ["، وما ", []], ["أتيتم", ["H935"]], [" به إلى ", []], ["البيت", ["H1004"]], [" من غلة ", []], ["نفخت", ["H5301"]], [" عليه وبددته. ", []], ["لماذا", ["H3282", "H4100"]], [" فعلت هذا ", []], ["يقول", ["H5002"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["القدير", ["H6635"]], ["؟ من ", []], ["أجل", ["H3282"]], [" ", []], ["بيتي", ["H1004"]], [" ", []], ["الذي", ["H834"]], [" ما برح ", []], ["مهدما", ["H2720"]], [" بينما ", []], ["كل", ["H376"]], [" واحد منكم منهمك في بناء ", []], ["بيته", ["H1004"]], [".", []]]}, {"c": 1, "v": 10, "text": "لذلك منعت السماء من فوق عنكم الندى، ومنعت الأرض غلتها.", "groups": [{"kw": "", "raw": "Lev_26:19; Deu_28:23, Deu_28:24; 1Ki_8:35, 1Ki_17:1; Jer_14:1-6; Hos_2:9; Joe_1:18-20", "note": "", "refs": [{"l": "Lev 26:19", "n": "", "vs": [[19, "أذل غطرستكم، وأجعل سماءكم كالحديد لا تمطر وأرضكم كالنحاس لا تغل"]]}, {"l": "Deu 28:23", "n": "", "vs": [[23, "وتصبح السماء التي فوقكم كالنحاس والأرض تحتكم كالحديد."]]}, {"l": "Deu 28:24", "n": "", "vs": [[24, "ويحول الرب مطر أرضكم إلى غبار وعواصف ترابية تنهمر عليكم من السماء حتى تهلكوا."]]}, {"l": "1Ki 8:35", "n": "", "vs": [[35, "إذا أغلقت أبواب السماء وانحبس المطر لأن الشعب أخطأ إليك، ثم صلوا في هذا الهيكل معترفين باسمك، وتابوا عن خطيئتهم لأنك أنزلت بهم البلاء،"]]}, {"l": "1Ki 17:1", "n": "", "vs": [[1, "وقال إيليا التشبي من أهل جلعاد لأخآب: «حي هو الرب إله إسرائيل الذي أخدمه، إنه لن يهطل ندى ولا مطر في هذه السنين، إلا حين أعلن ذلك»."]]}, {"l": "Jer 14:1-6", "n": "", "vs": [[1, "هذه كلمة الرب التي أوحى بها إلى إرميا بشأن القحط:"], [2, "«أرض يهوذا تنوح وأبوابها واهية. أهلها يندبون مطروحين إلى الأرض، وعويل أورشليم قد صعد إلى العلى."], [3, "أرسل أشرافهم خدامهم ليحملوا إليهم الماء، فأقبلوا إلى الجباب وإذا بها فارغة من الماء، فرجعوا بجرار خاوية وقد اعتراهم الخزي والخجل وغطوا رؤوسهم."], [4, "خزي الفلاحون وغطوا رؤوسهم لأن الأرض قد تشققت لانقطاع المطر عنها."], [5, "حتى الإيل في الصحراء قد هجرت وليدها لتعذر وجود الكَلإ."], [6, "وقفت الفراء على الروابي وتنسمت الريح كبنات آوى فكلت عيونها لعدم وجود العشب»."]]}, {"l": "Hos 2:9", "n": "", "vs": [[9, "لذلك أسترد حنطتي في حينها، وخمري في أوانه، وأنتزع صوفي وكتاني اللذين تستر بهما عريها."]]}, {"l": "Joe 1:18-20", "n": "", "vs": [[18, "لكم أنت البهائم، وشردت المواشي إذ افتقرت إلى المرعى. حتى قطعان الغنم هلكت أيضا."], [19, "إليك يارب أصرخ لأن النار قد التهمت مراعي البرية، وأحرق اللهيب كل أشجار الحقل."], [20, "حتى الحيوانات البرية استغاثت بك، لأن مياه الجداول الجارية قد جفت، والتهمت النيران مراعي البرية."]]}], "kwAr": "", "noteAr": ""}], "arS": [["لذلك", ["H5921", "H3651"]], [" ", []], ["منعت", ["H3607"]], [" ", []], ["السماء", ["H8064"]], [" ", []], ["من", ["H4480"]], [" ", []], ["فوق", ["H5921"]], [" عنكم ", []], ["الندى", ["H2919"]], ["، ", []], ["ومنعت", ["H3607"]], [" ", []], ["الأرض", ["H776"]], [" ", []], ["غلتها", ["H2981"]], [".", []]]}, {"c": 1, "v": 11, "text": "وقضيت بالقحط على الأرض والتلال، وعلى حقول الحنطة والكروم، وأشجار الزيتون وعلى كل ما تنتجه الأرض، وعلى الناس والبهائم، وعلى كل تعب أيديكم».", "groups": [{"kw": "I called", "raw": "Deu_28:22; 1Ki_17:1; 2Ki_8:1; Job_34:29; Lam_1:21; Amo_5:8, Amo_7:4, Amo_9:6", "note": "", "refs": [{"l": "Deu 28:22", "n": "", "vs": [[22, "ويضربكم الرب بالسل والحمى والرعشة والالتهاب والجفاف واللفح والذبول، فتلازمكم حتى تفنوا."]]}, {"l": "1Ki 17:1", "n": "", "vs": [[1, "وقال إيليا التشبي من أهل جلعاد لأخآب: «حي هو الرب إله إسرائيل الذي أخدمه، إنه لن يهطل ندى ولا مطر في هذه السنين، إلا حين أعلن ذلك»."]]}, {"l": "2Ki 8:1", "n": "", "vs": [[1, "وقال أليشع للمرأة التي أحيا ابنها: «اذهبي أنت وعائلتك وتغربي حيث تشائين، لأن الرب سيصيب البلاد بمجاعة تدوم سبع سنوات»."]]}, {"l": "Job 34:29", "n": "", "vs": [[29, "فإن هيمن بسكينته فمن يدينه، وإن وارى وجهه فمن يعاينه، سواء أكانوا شعبا أم فردا"]]}, {"l": "Lam 1:21", "n": "", "vs": [[21, "قد سمعوا تنهدي فلم يكن من معز لي. جميع أعدائي عرفوا ببليتي فشمتوا بما فعلت بي. أسرع بيوم العقاب الذي توعدت به فيصيروا مثلي."]]}, {"l": "Amo 5:8", "n": "", "vs": [[8, "إنه هو الذي خلق الثريا والجبار، ويحول دياجير الظلمة إلى نهار، والنهار إلى ليل، ويستدعي مياه البحر ويفيضها على وجه الأرض، الرب اسمه."]]}, {"l": "Amo 7:4", "n": "", "vs": [[4, "ثم هذا ما أراني السيد الرب: شاهدت السيد الرب يدعو للمحاكمة بالنار التي لعقت البحر العظيم فجف، وأكلت الحقول."]]}, {"l": "Amo 9:6", "n": "", "vs": [[6, "هو الذي يبني مخادعه العليا في السماوات ويؤسس قبته على الأرض، الذي يدعو مياه البحر ويسكبها على وجه الثرى، الرب اسمه."]]}], "kwAr": "وقضيت بالقحط", "noteAr": ""}, {"kw": "upon all", "raw": "Hag_2:17", "note": "", "refs": [{"l": "Hag 2:17", "n": "", "vs": [[17, "إني ابتليت تعب أيديكم بالقحط والذبول والبرد، ولكنكم لم ترجعوا تائبين إلي، يقول الرب."]]}], "kwAr": "وعلى كل تعب", "noteAr": ""}], "arS": [["وقضيت", ["H7121"]], [" ", []], ["بالقحط", ["H2721"]], [" ", []], ["على", ["H5921"]], [" ", []], ["الأرض", ["H776"]], [" ", []], ["والتلال", ["H2022"]], ["، ", []], ["وعلى", ["H5921"]], [" حقول ", []], ["الحنطة", ["H1715"]], [" ", []], ["والكروم", ["H8492"]], ["، وأشجار ", []], ["الزيتون", ["H3323"]], [" ", []], ["وعلى", ["H5921"]], [" كل ", []], ["ما", ["H834"]], [" ", []], ["تنتجه", ["H3318"]], [" ", []], ["الأرض", ["H127"]], ["، ", []], ["وعلى", ["H5921"]], [" ", []], ["الناس", ["H120"]], [" ", []], ["والبهائم", ["H929"]], ["، ", []], ["وعلى", ["H5921"]], [" ", []], ["كل", ["H3605"]], [" ", []], ["تعب", ["H3018"]], [" ", []], ["أيديكم", ["H3709"]], ["».", []]]}, {"c": 1, "v": 12, "text": "حينئذ أطاع زربابل بن شألتيئيل ويهوشع بن يهوصادق رئيس الكهنة، وسائر بقية شعب إسرائيل صوت الرب إلههم، واستمعوا إلى كلمات حجي النبي، كما بعثه الرب إلههم إليهم،  قد هذا الشعب، ولكن لم تعلمني من سترسل معي. ثم قلت: إني عرفتك باسمك وحظيت برضاي."], [13, "فالآن إن كنت حقا قد حظيت برضاك، فأرشدني إلى طريقك لكي أسلك حسب قصدك، وأحظى بمسرتك، واذكر أيضا أن هذه الأمة هي شعبك»."], [14, "فأجابه: «إن حضوري يرافقك فأريحك»."]]}, {"l": "Exo 34:8", "n": "", "vs": [[8, "فخر موسى في الحال وسجد،"]]}, {"l": "Exo 34:10", "n": "", "vs": [[10, "فأجاب الرب: «ها أنا أبرم معك ميثاقا، فأجري أمام جميع شعبك معجزات لم يجر مثيلها في جميع أمم الأرض كلها، فيشهد الشعب الذي تقيم في وسطه، الفعل المهول الذي أصنعه من أجلك."]]}], "kwAr": "بمقتضى", "noteAr": ""}, {"kw": "so", "raw": "Num_11:25-29; Neh_9:20,Neh_9:30; Psa_51:11, Psa_51:12; Isa_63:11-14; Zec_4:6; Joh_14:16, Joh_14:17", "note": "", "refs": [{"l": "Num 11:25-29", "n": "", "vs": [[25, "فنزل الرب في سحابة وخاطبه، وأخذ من الروح الحال عليه ووضعه على السبعين رئيسا. فلما حل عليهم الروح تنبأوا لفترة وتوقفوا."], [26, "وكان قد بقي اثنان من الشيوخ المسجلين بين السبعين في المخيم لم يأتيا إلى الخيمة، اسم أحدهما ألداد، واسم الآخر ميداد. فحل عليهما الروح فتنبآ في المخيم."], [27, "فأسرع أحد الشبان وأخبر موسى بذلك،"], [28, "فقال يشوع بن نون، مساعد موسى منذ حداثته: «ياسيدي، امنعهما!»"], [29, "غير أن موسى قال له: «هل ملأتك غيرة علي؟ ليت كل شعب الرب يصبحون أنبياء يحل عليهم الرب بروحه»."]]}, {"l": "Neh 9:20", "n": "", "vs": [[20, "وأنعمت عليهم بروحك الصالح ليلقنهم، ولم تمنع منك عن أفواههم، ووفرت لهم ماء لإرواء عطشهم."]]}, {"l": "Neh 9:30", "n": "", "vs": [[30, "لقد تحملتهم سنين كثيرة، وحذرتهم بروحك على لسان أنبيائك فلم يصغوا، فأسلمتهم لعبودية أمم البلاد."]]}, {"l": "Psa 51:11", "n": "", "vs": [[11, "لا تطردني من حضرتك، ولا تنزع مني روحك القدوس."]]}, {"l": "Psa 51:12", "n": "", "vs": [[12, "رد لي بهجتي بخلاصك، وبروح رضية آزرني"]]}, {"l": "Isa 63:11-14", "n": "", "vs": [[11, "ثم تذكروا الأيام القديمة، أيام موسى عبده وتساءلوا: أين من أصعدنا من البحر مع راعي قطيعه؟ أين من أقام روحه القدوس في وسطنا؟"], [12, "من جعل ذراع قوته المجيدة تسير إلى يمين موسى؟ من شق مياه البحر أمامنا ليكتسب اسما أبديا؟"], [13, "من اقتادنا في اللجج؟ فسرنا كفرس في البرية من غير أن نعثر؟"], [14, "كقطيع منحدر إلى واد، أنعم عليهم روح الرب بالراحة، هكذا هديت شعبك لتصنع لنفسك اسما مجيدا."]]}, {"l": "Zec 4:6", "n": "", "vs": [[6, "فقال: «هذه رسالة الرب إلى زربابل: لا بالقدرة ولا بالقوة، ولكن بروحي تفلحون يقول الرب القدير."]]}, {"l": "Joh 14:16", "n": "", "vs": [[16, "وسوف أطلب من الآب أن يعطيكم معينا آخر يبقى معكم إلى الأبد،"]]}, {"l": "Joh 14:17", "n": "", "vs": [[17, "وهو روح الحق، الذي لا يقدر العالم أن يتقبله لأنه لا يراه ولا يعرفه، وأما أنتم فتعرفونه لأنه في وسطكم، وسيكون في داخلكم."]]}], "kwAr": "إن روحي ماكث معكم", "noteAr": ""}, {"kw": "fear", "raw": "Jos_8:1; 2Ch_20:17; Isa_41:10,Isa_41:13; Zec_8:13, Zec_8:15; Mat_28:5; Act_27:24; Rev_1:17", "note": "", "refs": [{"l": "Jos 8:1", "n": "", "vs": [[1, "وقال الرب ليشوع: «لا تجزع ولا تثبط همتك. خذ جيشك برمته وحاصر عاي لأني قد أسلمتك ملك عاي وشعبه ومدينته وأرضه."]]}, {"l": "2Ch 20:17", "n": "", "vs": [[17, "ليس عليكم أن تخوضوا هذه المعركة، بل قفوا واثبتوا واشهدوا خلاص الرب الذي ينعم به عليكم يابني يهوذا وياأهل أورشليم. لا تجزعوا ولا ترتعبوا. انطلقوا غدا للقائهم والرب معكم»."]]}, {"l": "Isa 41:10", "n": "", "vs": [[10, "لا تخف لأني معك. لا تتلفت حولك جزعا، لأني إلهك، أشددك وأعينك وأعضدك بيمين بري"]]}, {"l": "Isa 41:13", "n": "", "vs": [[13, "لأني أنا الرب إلهك الذي يمسك بيمينك قائلا لك: لا تخف. سأعينك."]]}, {"l": "Zec 8:13", "n": "", "vs": [[13, "وكما كنتم لعنة بين الأمم ياأ بناء يهوذا وإسرائيل، فإنني أخلصكم فتصبحون بركة. لا تجزعوا، بل تشجعوا."]]}, {"l": "Zec 8:15", "n": "", "vs": [[15, "فإني عدت أيضا فقضيت في هذه الأيام أن أحسن إلى أورشليم وإلى شعب يهوذا. فلا تجزعوا."]]}, {"l": "Mat 28:5", "n": "", "vs": [[5, "فطمأن الملاك المرأتين قائلا: «لا تخافا. فأنا أعلم أنكما تبحثان عن يسوع الذي صلب."]]}, {"l": "Act 27:24", "n": "", "vs": [[24, "وقال لي: لا تخف يابولس! فلابد أن تمثل أمام القيصر. وقد وهبك الله حياة جميع المسافرين معك!"]]}, {"l": "Rev 1:17", "n": "", "vs": [[17, "فلما رأيته ارتميت عند قدميه كالميت، فلمسني بيده اليمنى وقال: «لا تخف! أنا الأول والآخر،"]]}], "kwAr": "فلا تفزعوا", "noteAr": ""}], "arS": [["بمقتضى ", []], ["عهدي", ["H1697"]], [" ", []], ["الذي", ["H834"]], [" ", []], ["أبرمته", ["H3772"]], [" ", []], ["معكم", ["H854"]], [" عندما ", []], ["خرجتم", ["H3318"]], [" من ديار ", []], ["مصر", ["H4480", "H4714"]], [". إن ", []], ["روحي", ["H7307"]], [" ", []], ["ماكث", ["H5975"]], [" ", []], ["معكم", ["H8432"]], ["، ", []], ["فلا", ["H408"]], [" ", []], ["تفزعوا", ["H3372"]], [".", []]]}, {"c": 2, "v": 6, "text": "لأنه هكذا يقول الرب القدير: ها أنا مزمع مرة أخرى، عما قليل، أن أزلزل السماء والأرض والبحر واليابسة.", "groups": [{"kw": "Yet", "raw": "Hag_2:21, Hag_2:22; Heb_12:26-28", "note": "", "refs": [{"l": "Hag 2:21", "n": "", "vs": [[21, "«كلم زربابل حاكم يهوذا وقل له: أنا مزمع أن أزلزل السماء والأرض."]]}, {"l": "Hag 2:22", "n": "", "vs": [[22, "وأطوح بعروش ممالك الأمم، وأدمر قوتها وأقلب المركبات وفرسانها، فتهوي الخيول وركابها ويلقى كل واحد حتفه بسيف صاحبه."]]}, {"l": "Heb 12:26-28", "n": "", "vs": [[26, "وإذ تكلم الله قديما، زلزل صوته الأرض، أما الآن، فيعد قائلا: «إني مرة أخرى، سوف أزلزل لا الأرض وحدها، بل السماء أيضا!»"], [27, "وبقوله: «مرة أخرى»، يشير إلى أنه سوف يزيل كل ما ليس له أساس متين باعتباره مخلوقا، حتى لا تبقى إلا تلك الأشياء الثابتة الأساس."], [28, "فبما أننا قد حصلنا على مملكة ثابتة لا تتزلزل، لنعبد الله ونخدمه شاكرين، بصورة ترضيه، بكل احترام ومخافة،"]]}], "kwAr": "مرة أخرى", "noteAr": ""}, {"kw": "it is", "raw": "Psa_37:10; Isa_10:25, Isa_29:17; Jer_51:33; Heb_10:37", "note": "", "refs": [{"l": "Psa 37:10", "n": "", "vs": [[10, "فعما قليل (ينقرض) الشرير، إذ تطلبه ولا تجده."]]}, {"l": "Isa 10:25", "n": "", "vs": [[25, "فإنه عما قليل يكتمل سخطي، وينصب غضبي لإبادتهم»."]]}, {"l": "Isa 29:17", "n": "", "vs": [[17, "ألا تتحول لبنان في لحظات إلى حقل خصيب، والحقل الخصب إلى غابة؟"]]}, {"l": "Jer 51:33", "n": "", "vs": [[33, "لأن هذا ما يعلنه الرب القدير إله إسرائيل: إن أهل بابل كالبيدر، وقد حان أوان درس حنطته. وبعد قليل يأزف موعد حصادهم."]]}, {"l": "Heb 10:37", "n": "", "vs": [[37, "فقريبا جدا، سيأتي الآتي ولا يتمهل."]]}], "kwAr": "عما قليل", "noteAr": ""}, {"kw": "and I", "raw": "Isa_34:4; Jer_4:23-26; Eze_38:20; Joe_2:30-32, Joe_3:16; Mat_24:29, Mat_24:30; Mar_13:24-26; Luk_21:25-27; Act_2:19; Heb_12:26; Rev_6:12-17, Rev_8:5-12; Rev_11:9, 6:2-17", "note": "", "refs": [{"l": "Isa 34:4", "n": "", "vs": [[4, "وتنحل كل كواكب السماء، وتطوى السماوات كدرج، وتتساقط كل نجومها كتساقط أوراق الكرمة أو حبات التين المتغضنة."]]}, {"l": "Jer 4:23-26", "n": "", "vs": [[23, "تأملت الأرض فإذا هي خربة خاوية، وتطلعت إلى السماء فإذا هي مظلمة."], [24, "نظرت إلى الجبال وإذا بها ترتجف، وإلى الآكام وإذا بها تتقلقل."], [25, "تلفت حولي فلم أجد إنسانا، وإذا كل الطيور قد هربت."], [26, "نظرت وإذا بالأرض الخصيبة قد تحولت إلى بر ية، وأصبحت جميع مدنها أطلالا أمام الرب وأمام غضبه المحتدم."]]}, {"l": "Eze 38:20", "n": "", "vs": [[20, "فيرتعش من حضرتي سمك البحر وطيور السماء ووحوش البرية وجميع الحيوانات الدابة على الأرض، وكل الناس الذين على وجه المسكونة، وتندك الجبال وتسقط المعاقل وتنهار كل الأسوار إلى الأرض."]]}, {"l": "Joe 2:30-32", "n": "", "vs": [[30, "وأجري آيات في السماء وعلى الأرض، دما ونارا وأعمدة دخان."], [31, "وتتحول الشمس إلى ظلام، والقمر إلى دم، قبل مجيء يوم الرب العظيم المخيف."], [32, "إنما كل من يدعو باسم الرب يخلص، لأن النجاة تكون في جبل صهيون وفي أورشليم، كما قال الرب، إذ يكون بين الناجين من يدعوه الرب."]]}, {"l": "Joe 3:16", "n": "", "vs": [[16, "يزأر الرب في صهيون، ويجلجل بصوته من أورشليم فترجف السماوات والأرض؛ لكن الرب يكون ملجأ لشعبه، وحصنا لبني إسرائيل."]]}, {"l": "Mat 24:29", "n": "", "vs": [[29, "وحالا بعد الضيقة في تلك الأيام، تظلم الشمس، ويحجب القمر ضوءه، وتتهاوى النجوم من السماء، وتتزعزع قوات السماوات."]]}, {"l": "Mat 24:30", "n": "", "vs": [[30, "وعندئذ تظهر آية ابن الإنسان في السماء، فتنتحب قبائل الأرض كلها، ويرون ابن الإنسان آتيا على سحب السماء بقدرة ومجد عظيم."]]}, {"l": "Mar 13:24-26", "n": "", "vs": [[24, "ولكن في تلك الأيام، بعد تلك الضيقة، تظلم الشمس ويحجب القمر ضوءه،"], [25, "وتتهاوى نجوم السماء، وتتزعزع القوات التي في السماوات."], [26, "وعندئذ سوف يبصرون ابن الإنسان آتيا في السحب بقدرة عظيمة ومجد."]]}, {"l": "Luk 21:25-27", "n": "", "vs": [[25, "وستظهر علامات في الشمس والقمر والنجوم، وتكون على الأرض ضيقة على الأمم الواقعة في حيرة، لأن البحر والأمواج تعج وتجيش،"], [26, "ويغمى على الناس من الرعب ومن توقع ما سوف يجتاح المسكونة، إذ تتزعزع قوات السماوات."], [27, "عندئذ يرون ابن الإنسان آتيا في السحاب بقوة ومجد عظيم."]]}, {"l": "Act 2:19", "n": "", "vs": [[19, "سأجري عجائب فوق في السماء وعلامات تحت على الأرض، حيث يكون دم ونار ودخان كثيف!"]]}, {"l": "Heb 12:26", "n": "", "vs": [[26, "وإذ تكلم الله قديما، زلزل صوته الأرض، أما الآن، فيعد قائلا: «إني مرة أخرى، سوف أزلزل لا الأرض وحدها، بل السماء أيضا!»"]]}, {"l": "Rev 6:12-17", "n": "", "vs": [[12, "ثم نظرت، فرأيت الحمل يفك الختم السادس، وإذا الأرض قد زلزلت زلزالا عظيما، والشمس اسودت فصارت كخرقة من شعر، وصار القمر أحمر كالدم،"], [13, "وسقطت نجوم السماء على الأرض كما تطرح شجرة التين ثمارها الفجة، إذا هزتها ريح عاصفة."], [14, "وطويت السماء كما تطوى لفافة من ورق، فتزحزحت الجبال والجزر كلها من مواضعها."], [15, "وملوك الأرض والعظماء والقواد والأغنيا ء والأقوياء والعبيد والأحرار كلهم اختبأوا في المغاور وصخور الجبال،"], [16, "وهم يقولون للجبال والصخور: اسقطي علينا، وأخفينا من وجه الجالس على العرش ومن غضب الحمل!»"], [17, "فإن يوم الغضب العظيم قد جاءهم، ومن يقوى على الوقوف أمامه؟"]]}, {"l": "Rev 8:5-12", "n": "", "vs": [[5, "ثم ملأ الملاك المبخرة من النار التي على المذبح وألقاها إلى الأرض، فحدثت رعود وأصوات وبروق وزلزلة."], [6, "واستعد الملائكة السبعة، أصحاب الأبواق السبعة، لينفخوا فيها."], [7, "ولما نفخ الملاك الأول في بوقه، إذا برد ونار يخالطهما الدم يسقطان إلى الأرض، فاحترق ثلث الأرض وثلث الأشجار مع كل عشب أخضر."], [8, "ولما نفخ الملاك الثاني في بوقه، ألقي في البحر ما يشبه جبلا عظيما مشتعلا، فصار ثلث البحر دما،"], [9, "فمات ثلث المخلوقات الحية التي فيه، وتحطم ثلث السفن."], [10, "ثم نفخ الملاك الثالث في بوقه، فهوى من السماء نجم عظيم كأنه شعلة من نار، وسقط على ثلث الأنهار وينابيع المياه."], [11, "واسم هذا النجم «العلقم». فصار ثلث المياه مرا كالعلقم، ومات كثيرون من الناس بسبب مرارة المياه."], [12, "ولما نفخ الملاك الرابع في بوقه، حدثت ضربة لثلث الشمس وثلث القمر وثلث النجوم، فأظلم ثلثها وفقد النهار ثلث ضيائه، وكذلك الليل."]]}, {"l": "Rev 11:9", "n": "", "vs": [[9, "فيراهما أناس من مختلف الشعوب والقبائل واللغات والأمم، مدة ثلاثة أيام ونصف يوم، ولا يؤذن لأحد بدفنهما."]]}, {"l": "Rev 6:2-17", "n": "", "vs": [[2, "فنظرت وإذا أمامي حصان أبيض، يحمل راكبه قوسا، وعلى رأسه إكليل، وقد خرج منتصرا ولكي ينتصر."], [3, "ثم فك الحمل الختم الثاني، فسمعت الكائن الثاني ينادي: «تعال!»"], [4, "فخرج حصان أحمر، أعطي راكبه سيفا عظيما، ومنح سلطة نزع السلام من الأرض وجعل الناس يقتلون بعضهم بعضا."], [5, "وعندما فك الحمل الختم الثالث سمعت الكائن الثالث ينادي: «تعال!» فرأيت حصانا أسود، يحمل راكبه ميزانا بيده."], [6, "وسمعت صوتا من بين الكائنات الحية الأربعة يقول: «كيلة قمح بدينار، وثلاث كيلات شعير بدينار. أما الزيت والخمر فلا تمسهما»."], [7, "ثم فك الحمل الختم الرابع فسمعت الكائن الرابع ينادي: «تعال!»"], [8, "فرأيت حصانا لونه أخضر «باهت اللون»، اسم راكبه «الموت» يتبعه حصان آخر اسم راكبه «الهاوية»، وأعطيا سلطة إبادة ربع الأرض بالسيف والجوع والوباء ووحوش الأرض الضارية!"], [9, "ثم فك الحمل الختم الخامس، فرأيت مذبحا تحته أرواح الذين سفكت دماؤهم من أجل كلمة الله، ومن أجل الشهادة التي أدوها،"], [10, "وهم يصرخون للرب بأعلى صوتهم: «حتى متى، أيها السيد القدوس والحق، تؤخر معاقبة أهل الأرض على ما فعلوه بنا؟ متى تنتقم منهم لدمائنا؟»"], [11, "فأعطي كل منهم ثوبا أبيض، وقيل لهم أن يصبروا قليلا إلى أن يكمل عدد شركائهم العبيد وإخوتهم الذين سيقتلون مثلهم."], [12, "ثم نظرت، فرأيت الحمل يفك الختم السادس، وإذا الأرض قد زلزلت زلزالا عظيما، والشمس اسودت فصارت كخرقة من شعر، وصار القمر أحمر كالدم،"], [13, "وسقطت نجوم السماء على الأرض كما تطرح شجرة التين ثمارها الفجة، إذا هزتها ريح عاصفة."], [14, "وطويت السماء كما تطوى لفافة من ورق، فتزحزحت الجبال والجزر كلها من مواضعها."], [15, "وملوك الأرض والعظماء والقواد والأغنيا ء والأقوياء والعبيد والأحرار كلهم اختبأوا في المغاور وصخور الجبال،"], [16, "وهم يقولون للجبال والصخور: اسقطي علينا، وأخفينا من وجه الجالس على العرش ومن غضب الحمل!»"], [17, "فإن يوم الغضب العظيم قد جاءهم، ومن يقوى على الوقوف أمامه؟"]]}], "kwAr": "ها أنا", "noteAr": ""}], "arS": [["لأنه", ["H3588"]], [" ", []], ["هكذا", ["H3541"]], [" ", []], ["يقول", ["H559"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["القدير", ["H6635"]], [": ها ", []], ["أنا", ["H589"]], [" مزمع ", []], ["مرة", ["H259"]], [" ", []], ["أخرى", ["H5750"]], ["، عما ", []], ["قليل", ["H4592"]], ["، أن ", []], ["أزلزل", ["H7493"]], [" ", []], ["السماء", ["H8064"]], [" ", []], ["والأرض", ["H776"]], [" ", []], ["والبحر", ["H3220"]], [" ", []], ["واليابسة", ["H2724"]], [".", []]]}, {"c": 2, "v": 7, "text": "وأزعزع أركان جميع الأمم فتجلب نفائسهم إلى هذا المكان وأملأ هذا الهيكل بالمجد.", "groups": [{"kw": "I will shake", "raw": "Eze_21:27; Dan_2:44, Dan_2:45, Dan_7:20-25; Joe_3:9-16; Luk_21:10,Luk_21:11", "note": "", "refs": [{"l": "Eze 21:27", "n": "", "vs": [[27, "ها أنا أقلبه، أقلبه، أقلبه، حتى لا يبقى منه أثر، إلى أن يأتي صاحب الحكم، فأعطيه إياه."]]}, {"l": "Dan 2:44", "n": "", "vs": [[44, "وفي عهد هؤلاء الملوك يقيم إله السماوات مملكة لا تنقرض إلى الأبد، ولا يترك ملكها لشعب آخر، وتسحق وتبيد جميع هذه الممالك. أما هي فتخلد إلى الأبد."]]}, {"l": "Dan 2:45", "n": "", "vs": [[45, "لأنك رأيت أن الحجر المنقض الذي لم يقطع من الجبل بيدين، قد سحق الحديد والنحاس والخزف والفضة والذهب. إن الله العظيم قد أطلع الملك عما سيحدث في الأيام الآتية؛ فالحلم حقيقة وتفسيره صدق»."]]}, {"l": "Dan 7:20-25", "n": "", "vs": [[20, "وعن القرون العشرة النامية في رأسه، وعن القرن الآخر الصغير الذي نبت، فاقتلعت أمامه ثلاثة قرون. هذا القرن ذو العيون الناطق بالعظائم ومنظره أشد هولا من رفاقه."], [21, "وقد شهدت هذا القرن يحارب القديسين ويغلبهم."], [22, "إلى أن جاء الأزلي وانعقد مجلس القضاء الذي فيه تبرأت ساحة قديسي العلي، وأزف الوقت الذي فيه امتلكوا المملكة."], [23, "فأجاب: إن الحيوان الرابع هو رمز للمملكة الرابعة على الأرض، وهي تختلف عن سائر الممالك لأنها تستولي على كل الأرض وتخضعها وتسحقها."], [24, "أما القرون العشرة من هذه المملكة فهي عشرة ملوك يتولونها، ثم يقوم بعدهم ملك آخر يختلف عن الملوك السالفين، ويخضع ثلاثة ملوك،"], [25, "ويعير العلي وينكل بقديسيه، ويحاول أن يغير الأوقات والقوانين، فيذل القديسين ثلاث سنوات ونصف السنة."]]}, {"l": "Joe 3:9-16", "n": "", "vs": [[9, "نادوا بهذا بين الأمم، وتأهبوا للحرب. احشدوا أبطالكم. ليتقدم ويصعد جميع رجال القتال."], [10, "أطرقوا سكك محاريثكم وحولوها إلى سيوف، ومناجلكم إلى رماح، وليقل الضعيف: إنني جبار قتال!"], [11, "أسرعوا وتعالوا من كل ناحية يا كل الأمم، واجتمعوا هناك، وأنزل يارب محاربيك."], [12, "لتنهض الأمم وتقبل إلى وادي القضاء لأنني هناك أجلس لأدين الشعوب المتوافدة من كل جهة."], [13, "احملوا المنجل لأن الحصيد قد نضج. تعالوا ودوسوا فإن معصرة الخمر قد امتلأت، والحياض فاضت بكثرة شرهم."], [14, "جماهير جماهير متزاحمة في وادي القضاء، لأن يوم الرب قريب في وادي القضاء."], [15, "قد أظلمت الشمس والقمر، وكفت الكواكب عن الضياء."], [16, "يزأر الرب في صهيون، ويجلجل بصوته من أورشليم فترجف السماوات والأرض؛ لكن الرب يكون ملجأ لشعبه، وحصنا لبني إسرائيل."]]}, {"l": "Luk 21:10", "n": "", "vs": [[10, "ثم قال لهم: «ستنقلب أمة على أمة ومملكة على مملكة،"]]}, {"l": "Luk 21:11", "n": "", "vs": [[11, "وتحدث في عدة أماكن زلازل شديدة ومجاعات وأوبئة، وتظهر علامات مخيفة وآيات عظيمة من السماء."]]}], "kwAr": "وأزعزع", "noteAr": ""}, {"kw": "and the", "raw": "Gen_3:15, Gen_22:18, Gen_49:10; Zec_9:9, Zec_9:10; Luk_2:10,Luk_2:11, Luk_2:27, Luk_2:46; Rom_15:9-15; Gal_3:8", "note": "", "refs": [{"l": "Gen 3:15", "n": "", "vs": [[15, "وأثير عداوة دائمة بينك وبين المرأة، وكذلك بين نسليكما. هو يسحق رأسك وأنت تلدغين عقبه»."]]}, {"l": "Gen 22:18", "n": "", "vs": [[18, "وبذريتك تتبارك جميع أمم الأرض، لأنك أطعتني»."]]}, {"l": "Gen 49:10", "n": "", "vs": [[10, "لا يزول صولجان الملك من يهوذا ولا مشترع من صلبه حتى يأتي شيلوه (ومعناه: من له الأمر) فتطيعه الشعوب."]]}, {"l": "Zec 9:9", "n": "", "vs": [[9, "»ابتهجي جدا ياابنة صهيون واهتفي ياابنة أورشليم، لأن هوذا ملكك مقبل إليك. هو عادل ظافر، ولكنه وديع راكب على أتان، على جحش ابن أتان."]]}, {"l": "Zec 9:10", "n": "", "vs": [[10, "وأستأصل المركبات الحربية من أفرايم، والخيل من أورشليم، وتبيد أقواس القتال، ويشيع السلام بين الأمم، ويمتد ملكه من البحر إلى البحر، ومن نهر الفرات إلى أقاصي الأرض."]]}, {"l": "Luk 2:10", "n": "", "vs": [[10, "فقال لهم الملاك: «لا تخافوا! فها أنا أبشركم بفرح عظيم يعم الشعب كله:"]]}, {"l": "Luk 2:11", "n": "", "vs": [[11, "فقد ولد لكم اليوم في مدينة داود مخلص هو المسيح الرب."]]}, {"l": "Luk 2:27", "n": "", "vs": [[27, "وقد جاء إلى الهيكل بدافع من الروح. فلما أحضر الأبوان الطفل يسوع ليقدما عنه ما سن في الشريعة،"]]}, {"l": "Luk 2:46", "n": "", "vs": [[46, "وبعد ثلاثة أيام وجداه في الهيكل، جالسا وسط المعلمين يستمع إليهم ويطرح عليهم الأسئلة."]]}, {"l": "Rom 15:9-15", "n": "", "vs": [[9, "وإن الأمم يمجدون الله على الرحمة، وفقا لما قد كتب: «لهذا أعترف لك بين الأمم وأرتل لاسمك!»"], [10, "وأيضا قيل: «افرحوا، أيها الأمم، مع شعبه»."], [11, "وأيضا: «سبحوا الرب ياجميع الأمم، ولتحمده جميع الشعوب»."], [12, "ويقول إشعياء أيضا: «سيطلع أصل يسى، والقائم، ليسود على الأمم: عليه تعلق الشعوب الرجاء»."], [13, "فليملأكم إله الرجاء كل فرح وسلام في إيمانكم حتى تزدادوا رجاء بقوة الروح القدس."], [14, "وأنا نفسي أيضا على يقين من جهتكم أيها الإخوة بأنكم مشحونون صلاحا، وممتلئون بكل معرفة، وقادرون أيضا على نصح بعضكم بعضا."], [15, "على أني كتبت إليكم بأوفر جرأة في بعض الأمور، مذكرا لكم، وذلك بالنعمة التي وهبها الله لي."]]}, {"l": "Gal 3:8", "n": "", "vs": [[8, "ثم إن الكتاب، إذ سبق فرأى أن الله سوف يبرر الأمم على أساس الإيمان، بشر إبراهيم سلفا بقوله: «فيك تتبارك جميع الأمم!»"]]}], "kwAr": "نفائسهم", "noteAr": ""}, {"kw": "I will fill", "raw": "Exo_40:34, Exo_40:35; 1Ki_8:11; 2Ch_5:14; Psa_80:1; Mal_3:1; Luk_19:47, Luk_20:1; Luk_21:38; Joh_1:14, Joh_2:13-17, Joh_7:37-39, 10:23-38; Col_2:9", "note": "", "refs": [{"l": "Exo 40:34", "n": "", "vs": [[34, "وما لبثت السحابة أن غطت خيمة الاجتماع وملأ جلال الرب المسكن،"]]}, {"l": "Exo 40:35", "n": "", "vs": [[35, "فلم يستطع موسى دخول خيمة الاجتماع، لأن السحابة حلت عليها، ومجد الرب ملأ المسكن."]]}, {"l": "1Ki 8:11", "n": "", "vs": [[11, "فلم يستطع الكهنة القيام بالخدمة من جراء السحاب، لأن مجد الرب ملأ الهيكل."]]}, {"l": "2Ch 5:14", "n": "", "vs": [[14, "ولم يستطع الكهنة القيام بالخدمة بسبب السحاب لأن مجد الرب ملأ الهيكل."]]}, {"l": "Psa 80:1", "n": "", "vs": [[1, "اصغ ياراعي إسرائيل، يامن قدت (قوم) يوسف كالقطيع. تجل يامن بنعمتك تجلس على عرشك فوق الكروبيم"]]}, {"l": "Mal 3:1", "n": "", "vs": [[1, "«ها أنا أرسل رسولي فيمهد الطريق أمامي ويأتي الرب الذي تطلبونه فجأة إلى هيكله ويقبل أيضا ملاك العهد الذي تسرون به» يقول الرب القدير"]]}, {"l": "Luk 19:47", "n": "", "vs": [[47, "وكان يعلم يوما فيوما في الهيكل. وسعى رؤساء الكهنة والكتبة ووجهاء الشعب إلى قتله."]]}, {"l": "Luk 20:1", "n": "", "vs": [[1, "وفيما كان يعلم الشعب في الهيكل ذات يوم، ويبشر، تصدى له رؤساء الكهنة والكتبة مع الشيوخ،"]]}, {"l": "Luk 21:38", "n": "", "vs": [[38, "وكان جميع الشعب يبكرون إليه في الهيكل ليستمعوا إليه."]]}, {"l": "Joh 1:14", "n": "", "vs": [[14, "والكلمة صار بشرا، وخيم بيننا، ونحن رأينا مجده، مجد ابن وحيد عند الآب، وهو ممتلىء بالنعمة والحق."]]}, {"l": "Joh 2:13-17", "n": "", "vs": [[13, "وإذ اقترب عيد الفصح اليهودي، صعد يسوع إلى أورشليم،"], [14, "فوجد في الهيكل باعة البقر والغنم والحمام، والصيارفة جالسين إلى موائدهم،"], [15, "فجدل سوطا من حبال، وطردهم جميعا من الهيكل، مع الغنم والبقر، وبعثر نقود الصيارفة وقلب مناضدهم،"], [16, "وقال لبائعي الحمام: «أخرجوا هذه من هنا. لا تجعلوا بيت أبي بيتا للتجارة!»"], [17, "فتذكر تلاميذه أنه جاء في الكتاب: «الغيرة على بيتك تلتهمني»."]]}, {"l": "Joh 7:37-39", "n": "", "vs": [[37, "وفي آخر يوم من العيد، وهو أعظم أيامه، وقف يسوع وقال بأعلى صوته: «إن عطش أحد فليأت إلي ويشرب."], [38, "وكما قال الكتاب، فمن آمن بي تجري من داخله أنهار ماء حي»."], [39, "قال يسوع هذا عن الروح القدس الذي كان المؤمنون به سيقبلونه. ولم يكن الروح قد أعطي بعد لأن يسوع لم يكن قد تمجد بعد."]]}, {"l": "Joh 10:23-38", "n": "", "vs": [[23, "كان يسوع يتمشى في الهيكل في قاعة سليمان."], [24, "فتجمع حوله اليهود وقالوا له: «حتى متى تبقينا حائرين بشأنك؟ إن كنت أنت المسيح حقا، فقل لنا صراحة»."], [25, "فأجابهم يسوع: «قلت لكم، ولكنكم لا تصدقون. والأعمال التي أعملها باسم أبي، هي تشهد لي."], [26, "ولكنكم لا تصدقون لأنكم لستم خرافي."], [27, "فخرافي تصغي لصوتي، وأنا أعرفها وهي تتبعني،"], [28, "وأعطيها حياة أبدية، فلا تهلك إلى الأبد، ولا ينتزعها أحد من يدي."], [29, "إن الآب الذي أعطاني إياها هو أعظم من الجميع، ولا يقدر أحد أن ينتزع من يد الآب شيئا."], [30, "أنا والآب واحد!»"], [31, "فرفع اليهود، مرة ثانية، حجارة ليرجموه."], [32, "فقال لهم يسوع: «أريتكم أعمالا صالحة كثيرة من عند أبي، فبسبب أي عمل منها ترجمونني؟»"], [33, "أجابوه: «لا نرجمك بسبب أي عمل صالح، بل بسبب تجديفك: لأنك تجعل نفسك الله ، وأنت إنسان!»"], [34, "فقال لهم يسوع: «أليس مكتوبا في شريعتكم: أنا قلت إنكم آلهة؟"], [35, "فإذا كانت الشريعة تدعو أولئك الذين نزلت إليهم كلمة الله آلهة والكتاب لا يمكن أن ينقض"], [36, "فهل تقولون لمن قدسه الآب وبعثه إلى العالم: أنت تجدف، لأني قلت: أنا ابن الله؟"], [37, "إن كنت لا أعمل أعمال أبي، فلا تصدقوني."], [38, "أما إن كنت أفعل ذلك، فصدقوا تلك الأعمال، إن كنتم لا تصدقونني أنا. عندئذ تعرفون ويتأكد لكم أن الآب في وأنا فيه»."]]}, {"l": "Col 2:9", "n": "", "vs": [[9, "فإنه فيه، جسديا، يحل الله بكل ملئه،"]]}], "kwAr": "وأملأ", "noteAr": ""}], "arS": [["وأزعزع", ["H7493"]], [" أركان ", []], ["جميع", ["H3605"]], [" ", []], ["الأمم", ["H1471"]], [" ", []], ["فتجلب", ["H935"]], [" ", []], ["نفائسهم", ["H2532"]], [" إلى هذا المكان ", []], ["وأملأ", ["H4390"]], [" هذا ", []], ["الهيكل", ["H1004"]], [" ", []], ["بالمجد", ["H3519"]], [".", []]]}, {"c": 2, "v": 8, "text": "فالذهب والفضة لي يقول الرب القدير.", "groups": [{"kw": "", "raw": "1Kings 6:20-35; 1Ch_29:14-16; Psa_24:1, Psa_50:10-12; Isa_60:13, Isa_60:17", "note": "", "refs": [{"l": "1Ki 6:20-35", "n": "", "vs": [[20, "كان طوله عشرين ذراعا (نحو عشرة أمتار)، وعرضه عشرين ذراعا، وارتفاعه عشرين ذراعا. وغشاه بذهب نقي كما غشى المذبح بخشب الأرز."], [21, "وبعد ذلك غشى سليمان الهيكل كله من داخل بذهب نقي. وصنع سلاسل ذهبية حجز بها مدخل المحراب المغشى بالذهب النقي."], [22, "فكان الهيكل بكامله مغشى من الداخل بالذهب النقي، بما فيه مذبح المحراب."], [23, "وأقام في المحراب كروبين مصنوعين من خشب الزيتون، علو الواحد منهما عشر أذرع (نحو خمسة أمتار)."], [24, "وطول جناحي الكروب الواحد، من الطرف الواحد إلى الطرف الآخر، عشر أذرع (نحو خمسة أمتار)"], [25, "وكذلك كان طول جناحي الكروب الثاني عشر أذرع (نحو خمسة أمتار)، لأنهما كانا متماثلين في القياس والشكل."], [26, "وكان علو كل كروب عشر أذرع (نحو خمسة أمتار)."], [27, "وأقام الكروبين في وسط قدس الأقداس، بحيث يمتد طرفا جناحيهما الخارجيين من الحائط إلى الحائط، ويتلامس طرفا جناحيهما الداخليين في منتصف المحراب،"], [28, "وغشى سليمان الكروبين بالذهب."], [29, "ونقشت على جميع الجدران المحيطة بالهيكل من الداخل والخارج رسوم كروبيم ونخيل وبراعم زهور."], [30, "وغشى أرض الهيكل كله، بقسميه الداخلي والخارجي، بذهب."], [31, "وكان للمحراب باب من مصراعين مصنوعين من خشب الزيتون، لهما عتبة وقائمتان على شكل مخمس."], [32, "ونقش على المصراعين رسوم كروبيم ونخيل وبراعم زهور، وغشاهما بذهب، كما رصع الكروبيم والنخيل بذهب."], [33, "وصنع لمدخل الهيكل قوائم مربعة من خشب الزيتون،"], [34, "ومصراعين من خشب السرو، لكل مصراع دفتان تنطويان على بعضهما."], [35, "ونحت نقوش كروبيم ونخيل وبراعم زهور وغشاها بذهب مطروق."]]}, {"l": "1Ch 29:14-16", "n": "", "vs": [[14, "ولكن من أنا، ومن هو شعبي حتى نقدر أن نتبرع بسخاء وعن رضى؟ لأن منك الجميع ومن يدك نقدم لك."], [15, "فنحن مثل آبائنا، غرباء ونزلاء أمامك، وأيامنا كالظل على الأرض، خالية من الرجاء."], [16, "فيا أيها الرب إلهنا، إن كل هذه الثروة التي وفرناها لنشيد لك هيكلا لاسم قدسك إنما هي من نعم يدك وأنت مالك الكل."]]}, {"l": "Psa 24:1", "n": "", "vs": [[1, "للرب الأرض وكل ما فيها. له العالم، وجميع الساكنين فيه."]]}, {"l": "Psa 50:10-12", "n": "", "vs": [[10, "لأن جميع حيوانات الغابة ملكي، وكذلك البهائم المنتشرة على ألوف الجبال."], [11, "أنا عالم بجميع طيور الجبال، وكل مخلوقات البراري هي لي."], [12, "إن جعت لا ألتمس منك حاجتي لأن لي المسكونة وكل ما فيها."]]}, {"l": "Isa 60:13", "n": "", "vs": [[13, "يأتي إليك مجد لبنان بسروه وسنديانه وشربينه لتزيين موضع مقدسي، فأجعل موطيء قدمي مجيدا."]]}, {"l": "Isa 60:17", "n": "", "vs": [[17, "وعوضا عن النحاس أجلب لك الذهب، وبدل الحديد آتي لك بالفضة، وعوض الخشب نحاسا، وبدل الحجارة حديدا، وأجعل ولاتك مصدر سلام، ومسخريك يعاملونك بالعدل."]]}], "kwAr": "", "noteAr": ""}], "arS": [["فالذهب", ["H2091"]], [" ", []], ["والفضة", ["H3701"]], [" لي ", []], ["يقول", ["H5002"]], [" ", []], ["الرب", ["H3068"]], [" ", []], ["القدير", ["H6635"]], [".", []]]}, {"c": 2, "v": 9, "text": "ويكون مجد هذا الهيكل الأخير أعظم من مجد الهيكل السابق، وأجعل السلام يسود هذا الموضع يقول الرب القدير».", "groups": [{"kw": "glory", "raw": "Psa_24:7-10; Joh_1:14; 2Co_3:9, 2Co_3:10; 1Ti_3:16; Jam_2:1", "note": "", "refs": [{"l": "Psa 24:7-10", "n": "", "vs": [[7, "ارفعي رؤوسك أيتها الأبواب، وارتفعي أيتها المداخل الأبدية، فيدخل ملك المجد."], [8, "من هو ملك المجد هذا؟ إنه الرب القدير الجبار، الرب الجبار في القتال."], [9, "ارفعي رؤوسك أيتها الأبواب، ارفعيها أيتها المداخل الأبدية، فيدخل ملك المجد"], [10, "من هو ملك المجد هذا؟ إنه رب الجنود، هو ملك المجد."]]}, {"l": "Joh 1:14", "n": "", "vs": [[14, "والكلمة صار بشرا، وخيم بيننا، ونحن رأينا مجده، مجد ابن وحيد عند الآب، وهو ممتلىء بالنعمة والحق."]]}, {"l": "2Co 3:9", "n": "", "vs": [[9, "فبما أن خدمة الدينونة كانت مجدا، فأحرى كثيرا أن تفوقها في المجد خدمة البر."]]}, {"l": "2Co 3:10", "n": "", "vs": [[10, "حتى إن ما قد مجد سابقا لا يكون قد مجد على هذا النحو بالنظر إلى المجد الفائق."]]}, {"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}, {"l": "Jam 2:1", "n": "", "vs": [[1, "ياإخوتي، نظرا لإيمانكم بربنا يسوع المسيح، رب المجد، لا تعاملوا الناس بالانحياز والتمييز!"]]}], "kwAr": "ويكون مجد", "noteAr": ""}, {"kw": "saith", "raw": "Whoever compares the description of the temple of Solomon, in the first book of Kings, with the most splendid accounts of the second temple, however adorned with costly stones and other magnificent decorations in after ages, must perceive that the former, being wholly overlaid with pure gold, was incomparably more glorious than the latter in its greatest magnificence; and the Jews themselves allow that the ark of the covenant, fire from heaven, the Urim and Thummim the anointing oil, the Shechinah or visible glory, and the spirit of prophecy, which distinguished the former temple, were wanting in this. In nothing, in fact, could the second temple excel the first in glory, except in the personal presence of the Desire of all nations, He who is the glory of the Lord, and the true temple, in whom dwells all the fulness of the Godhead bodily, and who was the true Shechinah of which that of Solomons temple was merely a type. And if it be admitted that the presence of the promised Messiah was intended, then it will follow that Jesus of Nazareth was He; for the second temple, in which as the Prince of peace he preached peace and reconciliation with God, has been utterly destroyed for upwards of seventeen hundred years.", "note": "Whoever compares the description of the temple of Solomon, in the first book of Kings, with the most splendid accounts of the second temple, however adorned with costly stones and other magnificent decorations in after ages, must perceive that the former, being wholly overlaid with pure gold, was incomparably more glorious than the latter in its greatest magnificence; and the Jews themselves allow that the ark of the covenant, fire from heaven, the Urim and Thummim the anointing oil, the Shechinah or visible glory, and the spirit of prophecy, which distinguished the former temple, were wanting in this. In nothing, in fact, could the second temple excel the first in glory, except in the personal presence of the Desire of all nations, He who is the glory of the Lord, and the true temple, in whom dwells all the fulness of the Godhead bodily, and who was the true Shechinah of which that of Solomons temple was merely a type. And if it be admitted that the presence of the promised Messiah was intended, then it will follow that Jesus of Nazareth was He; for the second temple, in which as the Prince of peace he preached peace and reconciliation with God, has been utterly destroyed for upwards of seventeen hundred years.", "refs": [], "kwAr": "يقول", "noteAr": "كل من قارن وصف هيكل سليمان في سفر الملوك الأول بأبهى ما قيل عن الهيكل الثاني، مهما زُيّن لاحقا بالحجارة الكريمة والزخارف الفخمة، يرى أن الأول، لكونه مغشى كله بالذهب الخالص، كان أمجد من الثاني بما لا يقاس في أبهى حالاته؛ ويقر اليهود أنفسهم بأن تابوت العهد والنار النازلة من السماء والأوريم والتميم ودهن المسحة والشكينة أي المجد المنظور وروح النبوة، التي ميزت الهيكل الأول، كانت مفقودة في الثاني. وفي الحقيقة لم يفضل الهيكل الثاني الأول في المجد إلا بحضور مشتهى كل الأمم شخصيا، الذي هو مجد الرب والهيكل الحقيقي، الذي فيه يحل كل ملء اللاهوت جسديا، والذي لم تكن الشكينة في هيكل سليمان إلا رمزا له. وإذا سُلِّم بأن المقصود حضور المسيا الموعود فيلزم أن يسوع الناصري هو هو؛ لأن الهيكل الثاني، الذي بشر فيه رئيس السلام بالسلام والمصالحة مع الله، قد خُرّب تماما منذ أكثر من سبعة عشر قرنا."}, {"kw": "give", "raw": "Psa_85:8, Psa_85:9; Isa_9:6, Isa_9:7, Isa_57:18-21; Mic_5:5; Luk_2:14; Joh_14:27; Act_10:36; Eph_2:14-17; Col_1:19-21", "note": "", "refs": [{"l": "Psa 85:8", "n": "", "vs": [[8, "إني أسمع ما يتكلم به الله الرب، فإنه يتكلم بالسلام لشعبه ولأتقيائه، فلا يرجعون إلى الجهالة."]]}, {"l": "Psa 85:9", "n": "", "vs": [[9, "حقا إن خلاصه قريب من الذين يخافونه، لكي يقيم المجد في أرضنا."]]}, {"l": "Isa 9:6", "n": "", "vs": [[6, "لأنه يولد لنا ولد ويعطى لنا ابن يحمل الرياسة على كتفه، ويدعى اسمه عجيبا، مشيرا، إلها قديرا، أبا أبديا، رئيس السلام."]]}, {"l": "Isa 9:7", "n": "", "vs": [[7, "ولا تكون نهاية لنمو رياسته وللسلام اللذين يسودان عرش داود ومملكته، ليثبتها ويعضدها بالحق والبر، من الآن وإلى الأبد. إن غيرة الرب القدير تتمم هذا."]]}, {"l": "Isa 57:18-21", "n": "", "vs": [[18, "لقد رأيت طرقه المكتوبة، إنما سأقومه وأقوده وأرد له ولنائحيه الطمأنينة"], [19, "وأستبدل نواحه بالحمد، يقول الرب؛ فيكون سلام للقريب والبعيد لأنني سأشفيه."], [20, "أما الأشرار فهم كالبحر الهائج الذي لا يهدأ، تقذف مياهه القذر والطين"], [21, "إذ ليس سلام للأشرار، قال إلهي."]]}, {"l": "Mic 5:5", "n": "", "vs": [[5, "ويصبح الرب سلامهم، إذ حين يزحف الأشوريون إلى أرضنا ويطأون ترابنا، فإننا نثير عليهم سبعة رعاة وثمانية أمراء من الناس،"]]}
