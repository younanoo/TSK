 "Joh 6:33", "n": "", "vs": [[33, "فخبز الله هو النازل من السماء الواهب حياة للعالم»."]]}, {"l": "Joh 6:38", "n": "", "vs": [[38, "فقد نزلت من السماء، لا لأتم مشيئتي، بل مشيئة الذي أرسلني."]]}, {"l": "Joh 6:41", "n": "", "vs": [[41, "فأخذ اليهود يتذمرون على يسوع لأنه قال: «أنا الخبز الذي نزل من السماء»."]]}, {"l": "Joh 6:51", "n": "", "vs": [[51, "أنا الخبز الحي الذي نزل من السماء. إن أكل أحد من هذا الخبز يحيا إلى الأبد. والخبز الذي أقدمه أنا، هو جسدي، أبذله من أجل أن يحيا العالم»."]]}, {"l": "Joh 6:58", "n": "", "vs": [[58, "هذا هو الخبز الذي نزل من السماء، وهو ليس كالمن الذي أكله أباؤكم ثم ماتوا. فالذي يأكل هذا الخبز يحيا إلى الأبد»."]]}, {"l": "Joh 8:14", "n": "", "vs": [[14, "فأجاب: «مع أني أشهد لنفسي فإن شهادتي صحيحة، لأنني أعرف من أين أتيت وإلى أين أذهب؛ أما أنتم فلا تعرفون لا من أين أتيت ولا إلى أين أذهب."]]}, {"l": "Joh 16:27", "n": "", "vs": [[27, "فإن الآب نفسه يحبكم، لأنكم أحببتموني، وآمنتم بأني من عند الله خرجت."]]}, {"l": "Joh 16:28", "n": "", "vs": [[28, "خرجت من عند الآب، وأتيت إلى العالم. وها أنا أترك العالم وأعود إلى الآب»."]]}], "kwAr": "قد نزل أيضا", "noteAr": ""}, {"kw": "the lower", "raw": "Psa_8:5, Psa_63:9, Psa_139:15; Mat_12:40; Heb_2:7, Heb_2:9", "note": "", "refs": [{"l": "Psa 8:5", "n": "", "vs": [[5, "جعلته أدنى قليلا من الملائكة إلى حين، ثم كللته بالمجد والكرامة"]]}, {"l": "Psa 63:9", "n": "", "vs": [[9, "أما طالبو نفسي ليهلكوها فسيدخلون أسفل أعماق الأرض."]]}, {"l": "Psa 139:15", "n": "", "vs": [[15, "لم يخف عليك كياني عندما كونت في السر، وجبلت في أعماق الأرض."]]}, {"l": "Mat 12:40", "n": "", "vs": [[40, "فكما بقي يونان في جوف الحوت ثلاثة أيام وثلاث ليال، هكذا سيبقى ابن الإنسان في جوف الأرض ثلاثة أيام وثلاث ليال."]]}, {"l": "Heb 2:7", "n": "", "vs": [[7, "جعلته أدنى من الملائكة إلى حين، ثم كللته بالمجد والكرامة، وأعطيته السلطة على كل ما صنعته يداك."]]}, {"l": "Heb 2:9", "n": "", "vs": [[9, "إلا أننا نرى يسوع الآن مكللا بالمجد والكرامة، لأنه قاسى الموت. وذلك بعدما صار أدنى من الملائكة إلى حين، ليذوق بنعمة الله الموت عوضا عن كل واحد."]]}], "kwAr": "الأقسام السفلى في الأرض", "noteAr": ""}], "arS": [["وأما أنه «", []], ["صعد", ["G305"]], ["»، فما معنى هذا سوى أنه كان قد ", []], ["نزل", ["G2597"]], [" أيضا إلى ", []], ["الأقسام", ["G3313"]], [" ", []], ["السفلى", ["G2737"]], [" في ", []], ["الأرض", ["G1093"]], ["؟", []]]}, {"c": 4, "v": 10, "text": "إن الذي نزل هو نفسه الذي صعد إلى ما فوق جميع السماوات لكي يملأ كل شيء.", "groups": [{"kw": "ascended", "raw": "Eph_1:20-23; Act_1:9, Act_1:11; 1Ti_3:16; Heb_4:14, Heb_7:26, Heb_8:1, Heb_9:23, Heb_9:24", "note": "", "refs": [{"l": "Eph 1:20-23", "n": "", "vs": [[20, "الذي عمله في المسيح، بإقامته له من بين الأموات. وقد أجلسه عن يمينه في الأماكن السماوية،"], [21, "أرفع جدا من كل رئاسة وسلطة وقوة وسيا دة، ومن كل اسم يسمى، لا في هذا العالم وحسب، بل في ذلك الآتي أيضا."], [22, "وأخضع كل شيء تحت قدميه، وإياه جعل فوق كل شيء رأسا للكنيسة"], [23, "التي هي جسده وكماله، هو الذي يكمل الكل في الكل."]]}, {"l": "Act 1:9", "n": "", "vs": [[9, "قال هذا وارتفع إلى السماء بمشهد منهم. ثم حجبته سحابة عن أنظارهم."]]}, {"l": "Act 1:11", "n": "", "vs": [[11, "وقالا لهم: «أيها الجليليون، لماذا تقفون ناظرين إلى السماء؟ إن يسوع، هذا الذي ارتفع عنكم إلى السماء، سيعود منها مثلما رأيتموه منطلقا إليها!»"]]}, {"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}, {"l": "Heb 4:14", "n": "", "vs": [[14, "فمادام لنا رئيس كهنتنا العظيم الذي ارتفع مجتازا السماوات، وهو يسوع ابن الله، فلنتمسك دائما بالاعتراف به."]]}, {"l": "Heb 7:26", "n": "", "vs": [[26, "نعم، هذا هو رئيس الكهنة الذي كنا محتاجين إليه. إنه قدوس، لا عيبة فيه، ولا نجاسة، قد انفصل عن الخاطئين، وارتفع حتى صار أسمى من السماوات."]]}, {"l": "Heb 8:1", "n": "", "vs": [[1, "وخلاصة القول في هذا الموضوع، أن المسيح هو رئيس كهنتنا الذي وصفنا كهنوته هنا. إنه الآن جالس في السماء عن يمين عرش الله العظيم."]]}, {"l": "Heb 9:23", "n": "", "vs": [[23, "وبما أن تطهير الخيمة الأرضية كان يتطلب رش دم الذبائح الحيوانية، فإن الخيمة الحقيقية لابد أن تتطلب دم ذبيحة أفضل من الذبائح الأخرى."]]}, {"l": "Heb 9:24", "n": "", "vs": [[24, "فالمسيح، رئيس كهنتنا، لم يدخل إلى «قدس الأقداس» الأرضي، الذي صنعته يد بشرية وما هو إلا ظل للحقيقة، بل دخل إلى السماء عينها، حيث يقوم الآن بتمثيلنا في حضرة الله بالذات."]]}], "kwAr": "الذي صعد إلى ما فوق جميع السماوات", "noteAr": ""}, {"kw": "that he", "raw": "Eph_3:19; Joh_1:16; Act_2:33; Col_1:19, Col_2:9", "note": "", "refs": [{"l": "Eph 3:19", "n": "", "vs": [[19, "وتعرفوا محبة المسيح التي تفوق المعرفة، فتمتلئوا حتى تبلغوا ملء الله كله."]]}, {"l": "Joh 1:16", "n": "", "vs": [[16, "فمن امتلائه أخذنا جميعنا ونلنا نعمة على نعمة،"]]}, {"l": "Act 2:33", "n": "", "vs": [[33, "وإذ رفع إلى يمين الله، وأخذ من الآب الروح القدس الموعود به، أفاضه علينا. وما ترونه الآن وتسمعونه هو نتيجة لذلك."]]}, {"l": "Col 1:19", "n": "", "vs": [[19, "فإنه فيه سر الله أن يحل بكل ملئه،"]]}, {"l": "Col 2:9", "n": "", "vs": [[9, "فإنه فيه، جسديا، يحل الله بكل ملئه،"]]}], "kwAr": "لكي", "noteAr": ""}, {"kw": "fill", "raw": "or, fulfil, Mat_24:34; Luk_24:44; Joh_19:24, Joh_19:28, Joh_19:36 *Gr: Act_3:18, Act_13:32, Act_13:33; Rom_9:25-30, Rom_15:9-13, Rom_16:25, Rom_16:26", "note": "or, fulfil, Mat_24:34; Luk_24:44; Joh_19:24, Joh_19:28, Joh_19:36 *Gr: Act_3:18, Act_13:32, Act_13:33; Rom_9:25-30, Rom_15:9-13, Rom_16:25, Rom_16:26", "refs": [{"l": "Mat 24:34", "n": "", "vs": [[34, "الحق أقول لكم: لا يزول هذا الجيل أبدا، حتى تحدث هذه الأمور كلها."]]}, {"l": "Luk 24:44", "n": "", "vs": [[44, "ثم قال لهم: «هذا هو الكلام الذي كلمتكم به وأنا مازلت بينكم: أنه لابد أن يتم كل ما كتب عني في شريعة موسى وكتب الأنبياء والمزامير»."]]}, {"l": "Joh 19:24", "n": "", "vs": [[24, "فقال الجنود بعضهم لبعض: «لا داعي لتمزيقه، بل لنقترع عليه فنرى من يكسبه!» وقد حدث ذلك ليتم ما جاء في الكتاب: «اقتسموا ثيا بي بينهم، وعلى قميصي اقترعوا». وهذا هو ما فعله الجنود."]]}, {"l": "Joh 19:28", "n": "", "vs": [[28, "بعد هذا رأى يسوع أن كل شيء قد اكتمل، فقال: «أنا عطشان»، ليتم ما جاء في الكتاب."]]}, {"l": "Joh 19:36", "n": "*Gr:", "vs": [[36, "وقد حدث هذا ليتم ما جاء في الكتاب: «لن يكسر منه عظم!»"]]}, {"l": "Act 3:18", "n": "", "vs": [[18, "ولكن الله أتم بذلك ما كان قد أوحى به إلى جميع أنبيائه من أن المسيح سيلاقي الآلام."]]}, {"l": "Act 13:32", "n": "", "vs": [[32, "وها نحن الآن نبشركم بأن ما وعد الله به آباءنا،"]]}, {"l": "Act 13:33", "n": "", "vs": [[33, "قد أتمه لنا نحن أبناءهم، إذ أقام يسوع من الموت وفقا لما كتب في المزمور الثاني: أنت ابني؛ أنا اليوم ولدتك."]]}, {"l": "Rom 9:25-30", "n": "", "vs": [[25, "وذلك على حد ما يقول أيضا في نبوءة هوشع: «من لم يكونوا شعبي سأدعوهم شعبي، ومن لم تكن محبوبة سأدعوها محبوبة."], [26, "ويكون أنه حيث قيل لهم: لستم شعبي، فهناك يدعون أبناء الله الحي»."], [27, "أما إشعياء، فيهتف متكلما على إسرائيل: «ولو كان بنو إسرائيل كرمل البحر عددا، فإن بقية منهم ستخلص."], [28, "فإن الرب سيحسم الأمر وينجز كلمته سريعا على الأرض»."], [29, "وكما كان إشعياء قد قال سابقا: «لو لم يبق لنا رب الجنود نسلا، لصرنا مثل سدوم وشابهنا عمورة!»"], [30, "فما هي خلاصة القول؟ إن الأمم الذين لم يكونوا يسعون وراء البر، قد بلغوا البر، ولكنه البر القائم على أساس الإيمان."]]}, {"l": "Rom 15:9-13", "n": "", "vs": [[9, "وإن الأمم يمجدون الله على الرحمة، وفقا لما قد كتب: «لهذا أعترف لك بين الأمم وأرتل لاسمك!»"], [10, "وأيضا قيل: «افرحوا، أيها الأمم، مع شعبه»."], [11, "وأيضا: «سبحوا الرب ياجميع الأمم، ولتحمده جميع الشعوب»."], [12, "ويقول إشعياء أيضا: «سيطلع أصل يسى، والقائم، ليسود على الأمم: عليه تعلق الشعوب الرجاء»."], [13, "فليملأكم إله الرجاء كل فرح وسلام في إيمانكم حتى تزدادوا رجاء بقوة الروح القدس."]]}, {"l": "Rom 16:25", "n": "", "vs": [[25, "والمجد للقادر أن يثبتكم، وفقا لإنجيلي وللبشارة بيسوع المسيح، ووفقا لإعلان ما كان سرا ظل مكتوما مدى الأزمنة الأزلية،"]]}, {"l": "Rom 16:26", "n": "", "vs": [[26, "ولكن أذيع الآن، بأمر الله الأزلي في الكتابات النبوية، على جميع الأمم لأجل إطاعة الإيمان؛"]]}], "kwAr": "يملأ كل شيء", "noteAr": "أو: يُتمّ (يكمّل)."}], "arS": [["إن الذي ", []], ["نزل", ["G2597"]], [" هو ", []], ["نفسه", ["G846"]], [" الذي ", []], ["صعد", ["G305"]], [" إلى ما ", []], ["فوق", ["G5231"]], [" ", []], ["جميع", ["G3956"]], [" ", []], ["السماوات", ["G3772"]], [" لكي ", []], ["يملأ", ["G4137"]], [" ", []], ["كل شيء", ["G3956"]], [".", []]]}, {"c": 4, "v": 11, "text": "وهو قد وهب البعض أن يكونوا رسلا، والبعض أنبياء، والبعض مبشرين والبعض رعاة ومعلمين،", "groups": [{"kw": "he", "raw": "Eph_4:8, Eph_2:20, Eph_3:5; Rom_10:14, Rom_10:15; 1Co_12:28; Jud_1:17; Rev_18:20, Rev_21:14", "note": "", "refs": [{"l": "Eph 4:8", "n": "", "vs": [[8, "لذلك يقول (الوحي): «إذ صعد إلى الأعالي، ساق أسرى، ووهب الناس مواهب!»"]]}, {"l": "Eph 2:20", "n": "", "vs": [[20, "وقد بنيتم على أساس الرسل والأنبياء، والمسيح يسوع نفسه هو حجر الزاوية الأساس،"]]}, {"l": "Eph 3:5", "n": "", "vs": [[5, "ذلك السر الذي لم يطلع عليه بنو البشر في الأجيال الماضية مثلما أعلن الآن بوحي الروح لرسله القديسين وأنبيائه:"]]}, {"l": "Rom 10:14", "n": "", "vs": [[14, "ولكن، كيف يدعون من لم يؤمنوا به؟ وكيف يؤمنون بمن لم يسمعوا به؟ وكيف يسمعون بلا مبشر؟"]]}, {"l": "Rom 10:15", "n": "", "vs": [[15, "وكيف يبشر أحد إلا إذا كان قد أرسل؟ كما قد كتب: «ما أجمل أقدام المبشرين بالخيرات!»"]]}, {"l": "1Co 12:28", "n": "", "vs": [[28, "وقد رتب الله في الكنيسة أشخاصا مخصوصين: أولا الرسل، ثانيا الأنبياء، ثالثا المعلمين، وبعد ذلك أصحاب المواهب المعجزية أو مواهب الشفاء أو إعانة الآخرين أو تدبير الشؤون أو التكلم باللغات المختلفة."]]}, {"l": "Jud 1:17", "n": "", "vs": [[17, "أما أنتم أيها الأحباء، فاذكروا دائما ما قاله رسل ربنا يسوع المسيح."]]}, {"l": "Rev 18:20", "n": "", "vs": [[20, "اشمتي بها أيتها السماء! واشمتوا بها أيها القديسون والرسل والأنبياء، فقد أصدر الله حكمه عليها بعدما أصدرت أحكامها عليكم»."]]}, {"l": "Rev 21:14", "n": "", "vs": [[14, "ويقوم سور المدينة على اثنتي عشرة دعامة كتبت عليها أسماء رسل الحمل الاثني عشر."]]}], "kwAr": "وهو قد وهب", "noteAr": ""}, {"kw": "evangelists", "raw": "Act_21:8; 2Ti_4:5", "note": "", "refs": [{"l": "Act 21:8", "n": "", "vs": [[8, "وفي اليوم التالي ذهبنا إلى مدينة قيصرية ونزلنا ضيوفا ببيت المبشر فيلبس، وهو واحد من المدبرين السبعة،"]]}, {"l": "2Ti 4:5", "n": "", "vs": [[5, "أما أنت، فكن بصيرا في كل أمر، وتحمل المشقات، واعمل عمل المبشر، وأكمل خدمتك إلى التمام!"]]}], "kwAr": "مبشرين", "noteAr": ""}, {"kw": "pastors", "raw": "2Ch_15:3; Jer_3:15; Mat_28:20; Act_13:1; Rom_12:7; 1Co_12:29; Heb_5:12; 1Pe_5:1-3", "note": "", "refs": [{"l": "2Ch 15:3", "n": "", "vs": [[3, "لقد قضى الإسرائيليون حقبة طويلة كانوا فيها بلا إله حق، وبلا كاهن يعلمهم، وبلا شريعة."]]}, {"l": "Jer 3:15", "n": "", "vs": [[15, "وأقيم عليكم رعاة يحظون برضى قلبي، فيرعونكم بالمعرفة والفطنة."]]}, {"l": "Mat 28:20", "n": "", "vs": [[20, "وعلموهم أن يعملوا بكل ما أوصيتكم به. وها أنا معكم كل الأيام إلى انتهاء الزمان! »."]]}, {"l": "Act 13:1", "n": "", "vs": [[1, "وكان في الكنيسة التي في أنطاكية بعض الأنبياء والمعلمين؛ ومنهم برنابا؛ وسمعان الذي يدعى الأسود؛ ولوكيوس من القيروان؛ ومناين الذي تربى في طفولته مع هيرودوس حاكم الربع؛ وشاول."]]}, {"l": "Rom 12:7", "n": "", "vs": [[7, "ومن وهب الخدمة، فلينهمك في الخدمة؛ أو التعليم، ففي التعليم؛"]]}, {"l": "1Co 12:29", "n": "", "vs": [[29, "فهل هم جميعا رسل؟ أجميعهم أنبياء؟ أجميعهم معلمون؟ أجميعهم حائزون على مواهب معجزية؟"]]}, {"l": "Heb 5:12", "n": "", "vs": [[12, "كان يجب أن تكونوا الآن قادرين على تعليم الآخرين، بعدما مضى زمان طويل على اهتدائكم. ولكنكم مازلتم بحاجة إلى من يعلمكم حتى المباديء الأساسية لإعلانات الله. ها قد عدتم من جديد تحتاجون إلى اللبن! فأنتم غير قادرين على هضم الطعام القوي."]]}, {"l": "1Pe 5:1-3", "n": "", "vs": [[1, "وهذه وصيتي إلى الشيوخ الذين بينكم، بصفتي شيخا رفيقا لهم، وشاهدا لآلام المسيح، وشريكا في المجد الذي سيتجلى:"], [2, "ارعوا قطيع الله الذي بينكم، كحراس له، لا بدافع الواجب، بل بدافع التطوع، كما يريد الله ، ولا رغبة في الربح الدنيء، بل رغبة في الخدمة بنشاط."], [3, "لا تتسلطوا على القطيع الذي وضعه الله أمانة بين أيديكم، بل كونوا قدوة له."]]}], "kwAr": "رعاة ومعلمين", "noteAr": ""}], "arS": [["وهو قد ", []], ["وهب", ["G1325"]], [" البعض أن يكونوا ", []], ["رسلا", ["G652"]], ["، والبعض ", []], ["أنبياء", ["G4396"]], ["، والبعض ", []], ["مبشرين", ["G2099"]], [" والبعض ", []], ["رعاة", ["G4166"]], [" ", []], ["ومعلمين", ["G1320"]], ["،", []]]}, {"c": 4, "v": 12, "text": "لتأهيل القديسين من جهة عمل الخدمة، لبنيان جسد المسيح،", "groups": [{"kw": "perfecting", "raw": "Luk_22:32; Joh_21:15-17; Act_9:31, Act_11:23, Act_14:22, Act_14:23, Act_20:28; Rom_15:14, Rom_15:29; 1Co_12:7; 2Co_7:1; Phi_1:25, Phi_1:26, Phi_3:12-18; Col_1:28; 1Th_5:11-14; Heb_6:1, Heb_13:17", "note": "", "refs": [{"l": "Luk 22:32", "n": "", "vs": [[32, "ولكني تضرعت لأجلك لكي لا يخيب إيمانك. وأنت، بعد أن تسترد، ثبت إخوتك»."]]}, {"l": "Joh 21:15-17", "n": "", "vs": [[15, "وبعدما أكلوا سأل يسوع سمعان بطرس: «ياسمعان بن يونا، أتحبني أكثر مما يحبني هؤلاء؟» فأجابه «نعم يارب، أنت تعلم أني أحبك!» فقال له: «أطعم حملاني!»"], [16, "ثم سأله ثانية: «ياسمعان بن يونا، أتحبني؟» فأجابه: «نعم يارب. أنت تعلم أني أحبك!» قال له: «ارع خرافي»"], [17, "فسأله مرة ثالثة: «ياسمعان بن يونا، أتحبني؟» فحزن بطرس لأن يسوع قال له في المرة الثالثة: «أتحبني». وقال له: «يارب، أنت تعلم كل شيء. أنت تعلم أني أحبك!» فقال له يسوع: «أطعم خرافي!"]]}, {"l": "Act 9:31", "n": "", "vs": [[31, "في أثناء ذلك كانت الكنيسة في مناطق اليهودية والجليل والسامرة تتمتع بالسلام. وكانت تنمو وتسير في تقوى الر ب، بمساندة الروح القدس."]]}, {"l": "Act 11:23", "n": "", "vs": [[23, "فلما وصل ورأى النعمة التي منحها الله ، امتلأ فرحا، وحث الجميع على الثبات في الرب بعزم القلب."]]}, {"l": "Act 14:22", "n": "", "vs": [[22, "وفي هذه الأماكن كلها كانا يشددان عزيمة التلاميذ، ويحثانهم على الثبات في الإيمان، مؤكدين لهم أن دخول ملكوت الله يقتضي أن نقاسي صعوبات كثيرة."]]}, {"l": "Act 14:23", "n": "", "vs": [[23, "وعينا للتلاميذ شيوخا في كل كنيسة. ثم صليا بأصوام وأسلما الجميع وديعة بين يدي الرب الذي آمنوا به."]]}, {"l": "Act 20:28", "n": "", "vs": [[28, "فاسهروا إذن على أنفسكم وعلى جميع القطيع الذي عينكم بينه الروح القدس نظارا، لترعوا كنيسة الله التي اشتراها بدمه."]]}, {"l": "Rom 15:14", "n": "", "vs": [[14, "وأنا نفسي أيضا على يقين من جهتكم أيها الإخوة بأنكم مشحونون صلاحا، وممتلئون بكل معرفة، وقادرون أيضا على نصح بعضكم بعضا."]]}, {"l": "Rom 15:29", "n": "", "vs": [[29, "سأنطلق إلى أسبانيا، مارا بكم. وأعلم أني، إذا جئت إليكم، فسوف أجيء في ملء بركة المسيح."]]}, {"l": "1Co 12:7", "n": "", "vs": [[7, "وإنما كل واحد يوهب موهبة يتجلى الروح فيها لأجل المنفعة."]]}, {"l": "2Co 7:1", "n": "", "vs": [[1, "فإذ نلنا هذه الوعود، أيها الأحباء، لنطهر أنفسنا من كل ما يدنس الجسد والروح، ونكمل القداسة في مخافة الله."]]}, {"l": "Phi 1:25", "n": "", "vs": [[25, "وما دامت لي ثقة بهذا، أعلم أني سأبقى وأقيم معكم جميعا، لأجل تقدمكم في الإيمان وفرحكم فيه،"]]}, {"l": "Phi 1:26", "n": "", "vs": [[26, "ليزداد بسببي افتخاركم بالمسيح بحضوري بينكم من جديد."]]}, {"l": "Phi 3:12-18", "n": "", "vs": [[12, "لست أدعي أني قد نلت الجائزة أو بلغت الكمال. ولكني ماأزال أسعى لاقتنائها، كما أن المسيح يسوع قد اقتناني."], [13, "أيها الإخوة، أنا لا أعتبر نفسي قد نلت الجائزة، ولكني أفعل أمرا واحدا: أنسى ما هو وراء وأتقدم إلى ما هو أمام،"], [14, "إذ أسعى إلى الهدف، لنوال تلك الجائزة التي يدعونا الله إليها دعوة عليا في المسيح يسوع."], [15, "جميع البالغين فينا، ليكن فيهم هذا الفكر. وإن كان فيكم غير هذا الفكر، فذلك أيضا سيكشفه لكم الله ."], [16, "إنما، لنواصل السير من حيث قد وصلنا، في المنهج نفسه."], [17, "كونوا جميعا، أيها الإخوة، مقتدين بي؛ ولاحظوا الذين يسلكون بحسب القدوة التي ترونها فينا."], [18, "فإن كثيرين ممن يسلكون بينكم، وقد ذكرتهم لكم مرارا وأذكرهم الآن أيضا باكيا، إنما هم أعداء لصليب المسيح."]]}, {"l": "Col 1:28", "n": "", "vs": [[28, "هذا السر نعلنه نحن، واعظين كل إنسان، ومعلمين كل إنسان، في كل حكمة، لكي نحضر كل إنسان كاملا في المسيح."]]}, {"l": "1Th 5:11-14", "n": "", "vs": [[11, "لذلك عزوا بعضكم بعضا وشددوا أحدكم الآخر، كما أنتم فاعلون."], [12, "على أننا نرجو منكم، أيها الإخوة، أن تميزوا أولئك الذين يجتهدون بينكم، ويرعونكم كما يريد الرب، ويعظونكم،"], [13, "وأن تقدروهم تقديرا فائقا في المحبة، من أجل عملهم. عيشوا بسلام بعضكم مع بعض."], [14, "إلا أننا نناشدكم، أيها الإخوة، أن تعظوا الفوضويين، وتشددوا فاقدي العزم، وتساندوا الضعفاء، وتعاملوا الجميع بطول البال."]]}, {"l": "Heb 6:1", "n": "", "vs": [[1, "لذلك، فلنترك تلك المباديء الأولية عن المسيح، ونتقدم إلى النضوج الكامل. ولا نضع من جديد تلك الأسس التي تعلمناها سابقا، وهي: التوبة من الأعمال المميتة، والإيمان بالله،"]]}, {"l": "Heb 13:17", "n": "", "vs": [[17, "أطيعوا مرشديكم، واخضعوا لهم، لأنهم يسهرون على مصلحتكم الروحية، كما يسهر الذي يحمل مسئولية سوف يقدم حسابا عن قيامه بها. وعندئذ، يؤدون مهمتهم بفرح دون تذمر. فلن يكون في تذمرهم نفع لكم!"]]}], "kwAr": "لتأهيل القديسين", "noteAr": ""}, {"kw": "the work", "raw": "Act_1:17, Act_1:25, Act_20:24; Rom_12:7; 1Co_4:1, 1Co_4:2; 2Co_3:8, 2Co_4:1, 2Co_5:18, 2Co_6:3; Col_4:17; 1Ti_1:12; 2Ti_4:5, 2Ti_4:11", "note": "", "refs": [{"l": "Act 1:17", "n": "", "vs": [[17, "وكان يهوذا يعتبر واحدا منا، وقد شاركنا في خدمتنا."]]}, {"l": "Act 1:25", "n": "", "vs": [[25, "ليشاركنا في الخدمة والرسالة بدلا من يهوذا الذي ذهب إلى المكان الذي يستحقه»."]]}, {"l": "Act 20:24", "n": "", "vs": [[24, "ولكني لا أحسب لحياتي أية قيمة، ما دمت أسعى إلى بلوغ غايتي وإتمام الخدمة التي كلفني إياها الرب يسوع: أن أشهد ببشارة نعمة الله."]]}, {"l": "Rom 12:7", "n": "", "vs": [[7, "ومن وهب الخدمة، فلينهمك في الخدمة؛ أو التعليم، ففي التعليم؛"]]}, {"l": "1Co 4:1", "n": "", "vs": [[1, "فلينظر إلينا الناس باعتبارنا خداما للمسيح ووكلاء على أسرار الله."]]}, {"l": "1Co 4:2", "n": "", "vs": [[2, "والمطلوب من الوكلاء، قبل كل شيء، أن يوجد كل منهم أمينا."]]}, {"l": "2Co 3:8", "n": "", "vs": [[8, "أفليس أحرى أن تكون خدمة الروح راسخة في المجد؟"]]}, {"l": "2Co 4:1", "n": "", "vs": [[1, "فما دامت لنا إذن هذه الخدمة برحمة من الله، فلا تخور عزيمتنا."]]}, {"l": "2Co 5:18", "n": "", "vs": [[18, "وكل شيء هو من عند الله الذي صالحنا مع نفسه بالمسيح، ثم سلمنا خدمة هذه المصالحة."]]}, {"l": "2Co 6:3", "n": "", "vs": [[3, "ولسنا نتصرف أي تصرف يكون عثرة لأحد، حتى لا يلحق الخدمة أي لوم."]]}, {"l": "Col 4:17", "n": "", "vs": [[17, "وقولوا لأرخبس: «تنبه للخدمة التي تلقيتها في الرب، وقم بها كاملة!»"]]}, {"l": "1Ti 1:12", "n": "", "vs": [[12, "وكم أشكر المسيح يسوع ربنا الذي أعطاني القدرة وعينني خادما له، إذ اعتبرني جديرا بثقته،"]]}, {"l": "2Ti 4:5", "n": "", "vs": [[5, "أما أنت، فكن بصيرا في كل أمر، وتحمل المشقات، واعمل عمل المبشر، وأكمل خدمتك إلى التمام!"]]}, {"l": "2Ti 4:11", "n": "", "vs": [[11, "ولم يبق معي إلا لوقا وحده. مر بمرقس وأحضره معك، فهو ينفعني في الخدمة."]]}], "kwAr": "عمل الخدمة", "noteAr": ""}, {"kw": "the edifying", "raw": "Eph_4:16, Eph_4:29; Rom_14:19, Rom_15:2; 1Co_14:4, 1Co_14:5, 1Co_14:12, 1Co_14:14, 1Co_14:26; 2Co_12:19; 1Th_5:11", "note": "", "refs": [{"l": "Eph 4:16", "n": "", "vs": [[16, "فمنه يستمد الجسد كله تماسكه وترابطه بمساندة كل مفصل وفقا لمقدار العمل المخصص لكل جزء، لينشيء نموا يؤول إلى بنيان الجسد بنيانا ذاتيا في المحبة."]]}, {"l": "Eph 4:29", "n": "", "vs": [[29, "لا تخرج من أفواهكم كلمة فاسدة، بل الكلام الصالح للبنيان الذي تدعو إليه الحاجة، كي يعطي السامعين نعمة."]]}, {"l": "Rom 14:19", "n": "", "vs": [[19, "فلنسع إذن وراء ما يؤدي إلى السلام وما يؤدي إلى بنيان بعضنا بعضا."]]}, {"l": "Rom 15:2", "n": "", "vs": [[2, "فليسع كل واحد منا لإرضاء قريبه من جهة ما هو صالح، في سبيل البنيان."]]}, {"l": "1Co 14:4", "n": "", "vs": [[4, "فالذي يتكلم بلغة مجهولة يبني نفسه؛ وأما الذي يتنبأ، فيبني الكنيسة."]]}, {"l": "1Co 14:5", "n": "", "vs": [[5, "إني أرغب في أن تتكلموا جميعا بلغات مجهولة، ولكن بالأحرى أن تتنبأوا. فإن من يتنبأ أفضل ممن يتكلم باللغات إلا إذا ترجم (ما يقوله) لتنال الكنيسة بنيانا."]]}, {"l": "1Co 14:12", "n": "", "vs": [[12, "وهكذا أنتم أيضا، إذ إنكم متشوقون إلى المواهب الروحية، اسعوا في طلب المزيد منها لأجل بنيان الكنيسة."]]}, {"l": "1Co 14:14", "n": "", "vs": [[14, "فإني إن صليت بلغة مجهولة، فروحي تصلي، ولكن عقلي عديم الثمر."]]}, {"l": "1Co 14:26", "n": "", "vs": [[26, "فما العمل إذن أيها الإخوة؟ كلما تجتمعون معا، سيكون لكل منكم مزمور، أو تعليم، أو كلام بلغة مجهولة، أو إعلان، أو ترجمة. فليتم كل شيء بهدف البنيان."]]}, {"l": "2Co 12:19", "n": "", "vs": [[19, "طالما كنتم تظنون أننا ندافع عن أنفسنا عندكم! ولكننا إنما نتكلم أمام الله في المسيح. وذلك كله، أيها الأحباء، لأجل بنيانكم."]]}, {"l": "1Th 5:11", "n": "", "vs": [[11, "لذلك عزوا بعضكم بعضا وشددوا أحدكم الآخر، كما أنتم فاعلون."]]}], "kwAr": "لبنيان", "noteAr": ""}, {"kw": "the body", "raw": "Eph_4:4, Eph_1:23; Col_1:24", "note": "", "refs": [{"l": "Eph 4:4", "n": "", "vs": [[4, "مثلما دعيتم، جميعكم، دعوة لها رجاء واحد."]]}, {"l": "Eph 1:23", "n": "", "vs": [[23, "التي هي جسده وكماله، هو الذي يكمل الكل في الكل."]]}, {"l": "Col 1:24", "n": "", "vs": [[24, "والآن أنا أفرح في الآلام التي أقاسيها لأجلكم، وأتمم في جسدي ما نقص من ضيقات المسيح لأجل جسده الذي هو الكنيسة،"]]}], "kwAr": "جسد المسيح", "noteAr": ""}], "arS": [["لتأهيل", ["G2677"]], [" ", []], ["القديسين", ["G40"]], [" من جهة ", []], ["عمل", ["G2041"]], [" ", []], ["الخدمة", ["G1248"]], ["، ", []], ["لبنيان", ["G3619"]], [" ", []], ["جسد", ["G4983"]], [" ", []], ["المسيح", ["G5547"]], ["،", []]]}, {"c": 4, "v": 13, "text": "حتى نصل جميعا إلى وحدة الإيمان ووحدة المعرفة لابن الله، إلى إنسان تام البلوغ، إلى مقدار قامة ملء المسيح.", "groups": [{"kw": "we all", "raw": "Eph_4:3, Eph_4:5; Jer_32:38, Jer_32:39; Eze_37:21, Eze_37:22; Zep_3:9; Zec_14:9; Joh_17:21; Act_4:32; 1Co_1:10; Phi_2:1-3", "note": "", "refs": [{"l": "Eph 4:3", "n": "", "vs": [[3, "مجتهدين أن تحافظوا على وحدة الروح برابطة الوفاق. فإنما هناك جسد واحد وروح واحد،"]]}, {"l": "Eph 4:5", "n": "", "vs": [[5, "ولكم رب واحد، وإيمان واحد، ومعمودية واحدة،"]]}, {"l": "Jer 32:38", "n": "", "vs": [[38, "فيكونون لي شعبا وأكون لهم إلها."]]}, {"l": "Jer 32:39", "n": "", "vs": [[39, "وأعطيهم قلبا واحدا وطريقا واحدا ليتقوني كل الأيام، وذلك لخيرهم وخير أولادهم من بعدهم."]]}, {"l": "Eze 37:21", "n": "", "vs": [[21, "وها أنا أحشد أبناء إسرائيل من بين الأمم التي تفرقوا فيها وأجمعهم من كل جهة وأحضرهم إلى أرضهم."]]}, {"l": "Eze 37:22", "n": "", "vs": [[22, "وأجعلهم أمة واحدة في الأرض وعلى الجبال، تحت رئاسة ملك واحد، فلا يكونون بعد أمتين، ولا ينقسمون إلى مملكتين."]]}, {"l": "Zep 3:9", "n": "", "vs": [[9, "عندئذ أنقي شفاه الشعب ليدعوا جميعهم باسم الرب ويعبدوه جنبا إلى جنب."]]}, {"l": "Zec 14:9", "n": "", "vs": [[9, "ويملك الرب على الأرض كلها، فيكون في ذلك اليوم رب واحد لا يذكر سوى اسمه."]]}, {"l": "Joh 17:21", "n": "", "vs": [[21, "ليكون الجميع واحدا؛ أيها الآب، كما أنك أنت في وأنا فيك، ليكونوا هم أيضا واحدا فينا، لكي يؤمن العالم أنك أنت أرسلتني."]]}, {"l": "Act 4:32", "n": "", "vs": [[32, "وكانت جماعة المؤمنين قلبا واحدا ونفسا واحدة، ولم يكن أحد يقول إن شيئا مما عنده هو له وحده، بل كان كل شيء عندهم مشتركا."]]}, {"l": "1Co 1:10", "n": "", "vs": [[10, "على أنني أيها الإخوة، أتوسل إليكم باسم ربنا يسوع المسيح أن يكون لجميعكم صوت واحد وأن لا يكون بينكم أي انقسام. وإنما كونوا جميعا موحدي الفكر والرأي."]]}, {"l": "Phi 2:1-3", "n": "", "vs": [[1, "فما دام لنا التشجيع في المسيح، والتعزية في المحبة، والشركة في الروح، ولنا المراحم والحنو،"], [2, "فتمموا فرحي بأن يكون لكم رأي واحد ومحبة واحدة ونفس واحدة وفكر واحد."], [3, "لا يكن بينكم شيء بروح التحزب والافتخار الباطل، بل بالتواضع ليعتبر كل واحد منكم غيره أفضل كثيرا من نفسه،"]]}], "kwAr": "حتى نصل جميعا", "noteAr": ""}, {"kw": "in the unity", "raw": "or, into the unity", "note": "or, into the unity", "refs": [], "kwAr": "إلى وحدة الإيمان", "noteAr": "أو: إلى الوحدة."}, {"kw": "the knowledge", "raw": "Isa_53:11; Mat_11:27; Joh_16:3, Joh_17:3, Joh_17:25, Joh_17:26; 2Co_4:6; Phi_3:8; Col_2:2; 2Pe_1:1-3, 2Pe_3:18; 1Jo_5:20", "note": "", "refs": [{"l": "Isa 53:11", "n": "", "vs": [[11, "ويرى ثمار تعب نفسه ويشبع، وعبدي البار يبرر بمعرفته كثيرين ويحمل آثامهم."]]}, {"l": "Mat 11:27", "n": "", "vs": [[27, "كل شيء قد سلمه إلي أبي. ولا أحد يعرف الابن إلا الآب، ولا أحد يعرف الآب إلا الابن، ومن أراد الابن أن يعلنه له."]]}, {"l": "Joh 16:3", "n": "", "vs": [[3, "وهم يفعلون هذا بكم لأنهم لم يعرفوا أبي، ولا عرفوني."]]}, {"l": "Joh 17:3", "n": "", "vs": [[3, "والحياة الأبدية هي أن يعرفوك أنت الإله الحق وحدك، والذي أرسلته: يسوع المسيح."]]}, {"l": "Joh 17:25", "n": "", "vs": [[25, "أيها الآب البار، إن العالم لم يعرفك، أما أنا فعرفتك، وهؤلاء عرفوا أنك أنت أرسلتني،"]]}, {"l": "Joh 17:26", "n": "", "vs": [[26, "وقد عرفتهم اسمك، وسأعرفهم أيضا، لتكون فيهم المحبة التي أحببتني بها، وأكون أنا فيهم»."]]}, {"l": "2Co 4:6", "n": "", "vs": [[6, "فإن الله ، الذي أمر أن يشرق نور من الظلام، هو الذي جعل النور يشرق في قلوبنا، لإشعاع معرفة مجد الله المتجلي في وجه المسيح."]]}, {"l": "Phi 3:8", "n": "", "vs": [[8, "بل إني أعتبر كل شيء خسارة، من أجل امتياز معرفة المسيح يسوع ربي؛ فمن أجله تحملت خسارة كل شيء، وأعتبر كل شيء نفاية، لكي أربح المسيح"]]}, {"l": "Col 2:2", "n": "", "vs": [[2, "بغرض أن تتشجع قلوبهم وتكون كلها متحدة في المحبة، لبلوغ الإدراك التام بكل غناه، لمعرفة سر الله، أي المسيح،"]]}, {"l": "2Pe 1:1-3", "n": "", "vs": [[1, "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"], [2, "ليكن لكم المزيد من النعمة والسلام بفضل معرفة الله ويسوع ربنا!"], [3, "إن الله، بقدرته الإلهية، قد زودنا بكل ما نحتاج إليه في الحيا ة الروحية المتصفة بالتقوى. ذلك أنه عرفنا بالمسيح الذي دعانا إلى مجده وفضيلته،"]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}, {"l": "1Jo 5:20", "n": "", "vs": [[20, "وإننا نعلم أن ابن الله قد جاء إلى الأرض وأنار أذهاننا لنعرف الإله الحق. ونحن الآن نحيا فيه، لأننا في ابنه يسوع المسيح. هذا هو الإله الحق، والحياة الأبدية."]]}], "kwAr": "المعرفة لابن الله", "noteAr": ""}, {"kw": "unto a", "raw": "Eph_4:12, Eph_2:15; 1Co_14:20; Col_1:28", "note": "", "refs": [{"l": "Eph 4:12", "n": "", "vs": [[12, "لتأهيل القديسين من جهة عمل الخدمة، لبنيان جسد المسيح،"]]}, {"l": "Eph 2:15", "n": "", "vs": [[15, "أي العداء: إذ أبطل بجسده شريعة الوصايا ذات الفرائض، لكي يكون من الفريقين إنسانا واحدا جديدا، إذ أحل السلام بينهما،"]]}, {"l": "1Co 14:20", "n": "", "vs": [[20, "أيها الإخوة، لا تكونوا أولادا في التفكير، بل كونوا أطفالا في الشر. وأما في التفكير، فكونوا راشدين."]]}, {"l": "Col 1:28", "n": "", "vs": [[28, "هذا السر نعلنه نحن، واعظين كل إنسان، ومعلمين كل إنسان، في كل حكمة، لكي نحضر كل إنسان كاملا في المسيح."]]}], "kwAr": "إلى إنسان تام البلوغ", "noteAr": ""}, {"kw": "stature", "raw": "or, age", "note": "or, age", "refs": [], "kwAr": "قامة", "noteAr": "أو: سنّ (عمر)."}, {"kw": "fulness", "raw": "Eph_1:23", "note": "", "refs": [{"l": "Eph 1:23", "n": "", "vs": [[23, "التي هي جسده وكماله، هو الذي يكمل الكل في الكل."]]}], "kwAr": "ملء المسيح", "noteAr": ""}], "arS": [["حتى ", []], ["نصل", ["G2658"]], [" ", []], ["جميعا", ["G3956"]], [" إلى ", []], ["وحدة", ["G1775"]], [" ", []], ["الإيمان", ["G4102"]], [" ووحدة ", []], ["المعرفة", ["G1922"]], [" ", []], ["لابن", ["G5207"]], [" ", []], ["الله", ["G2316"]], ["، إلى ", []], ["إنسان", ["G435"]], [" ", []], ["تام البلوغ", ["G5046"]], ["، إلى ", []], ["مقدار", ["G3358"]], [" ", []], ["قامة", ["G2244"]], [" ", []], ["ملء", ["G4138"]], [" ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 4, "v": 14, "text": "وذلك حتى لا نكون فيما بعد أطفالا تتقاذفنا وتحملنا كل ريح تعليم يقوم على خداع الناس والمكر بهم لجرهم إلى الضلال الملفق،", "groups": [{"kw": "no more", "raw": "Isa_28:9; Mat_18:3, Mat_18:4; 1Co_3:1, 1Co_3:2, 1Co_14:20; Heb_5:12-14", "note": "", "refs": [{"l": "Isa 28:9", "n": "", "vs": [[9, "فتساءلوا: «لمن يلقن إشعياء العلم، ولمن يشرح رسالته؟ هل للمفطومين عن اللبن المبعدين عن الثدي؟"]]}, {"l": "Mat 18:3", "n": "", "vs": [[3, "وقال: «الحق أقول لكم إن كنتم لا تتحولون وتصيرون مثل الأولاد الصغار، فلن تدخلوا ملكوت السماوات أبدا."]]}, {"l": "Mat 18:4", "n": "", "vs": [[4, "فمن اتضع فصار مثل هذا الولد الصغير، فهو الأعظم في ملكوت السماوات."]]}, {"l": "1Co 3:1", "n": "", "vs": [[1, "على أني، أيها الإخوة، لم أستطع أن أكلمكم باعتباركم روحيين، بل باعتباركم جسديين وأطفالا في المسيح."]]}, {"l": "1Co 3:2", "n": "", "vs": [[2, "قد أطعمتكم لبنا لا الطعام القوي، لأنكم لم تكونوا قادرين عليه، بل إنكم حتى الآن غير قادرين."]]}, {"l": "1Co 14:20", "n": "", "vs": [[20, "أيها الإخوة، لا تكونوا أولادا في التفكير، بل كونوا أطفالا في الشر. وأما في التفكير، فكونوا راشدين."]]}, {"l": "Heb 5:12-14", "n": "", "vs": [[12, "كان يجب أن تكونوا الآن قادرين على تعليم الآخرين، بعدما مضى زمان طويل على اهتدائكم. ولكنكم مازلتم بحاجة إلى من يعلمكم حتى المباديء الأساسية لإعلانات الله. ها قد عدتم من جديد تحتاجون إلى اللبن! فأنتم غير قادرين على هضم الطعام القوي."], [13, "وكل من يتناول اللبن، يكون عديم الخبرة في التعليم القويم، لأنه مازال طفلا غير ناضج."], [14, "أما الناضجون روحيا، فهم قادرون على تناول الطعام القوي: لأن حواسهم قد تدربت، بالممارسة الصحيحة، على التمييز بين الخير والشر."]]}], "kwAr": "حتى لا نكون فيما بعد أطفالا", "noteAr": ""}, {"kw": "tossed", "raw": "Act_20:30,Act_20:31; Rom_16:17, Rom_16:18; 2Co_11:3, 2Co_11:4; Gal_1:6, Gal_1:7, Gal_3:1; Col_2:4-8; 2Th_2:2-5; 1Ti_3:6, 1Ti_4:6, 1Ti_4:7; 2Ti_1:15, 2Ti_2:17, 2Ti_2:18, 2Ti_3:6-9, 2Ti_3:13, 2Ti_4:3; Heb_13:9; 2Pe_2:1-3; 1Jo_2:19, 1Jo_2:26, 1Jo_4:1", "note": "", "refs": [{"l": "Act 20:30", "n": "", "vs": [[30, "بل إن قوما منكم أنتم سيقومون ويعلمون تعاليم منحرفة، ليجروا التلاميذ وراءهم."]]}, {"l": "Act 20:31", "n": "", "vs": [[31, "لذلك كونوا متيقظين، وتذكروا أني، مدة ثلاث سنين، لم أتوقف ليلا ونهارا عن نصح كل واحد منكم وأنا أذرف الدموع."]]}, {"l": "Rom 16:17", "n": "", "vs": [[17, "ولكن، أتوسل إليكم، أيها الإخوة، أن تنتبهوا إلى مثيري الانقسامات والعثرات، خلافا للتعليم الذي تعلمتم، وأن تبتعدوا عنهم."]]}, {"l": "Rom 16:18", "n": "", "vs": [[18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."]]}, {"l": "2Co 11:3", "n": "", "vs": [[3, "غير أني أخشى أن تضلل عقولكم عن الإخلاص والطهارة تجاه المسيح مثلما أغوت الحية بمكرها حواء."]]}, {"l": "2Co 11:4", "n": "", "vs": [[4, "فإذا كان من يأتيكم يبشر بيسوع آخر لم نبشر به نحن أو كنتم تنالون روحا آخر لم تنالوه، أو تقبلون إنجيلا لم تقبلوه، فإنكم تحتملون ذلك بكل سرور."]]}, {"l": "Gal 1:6", "n": "", "vs": [[6, "عجبا! كيف تتحولون بمثل هذه السرعة عن الذي دعاكم بنعمة المسيح، وتنصرفون إلى إنجيل غريب؟"]]}, {"l": "Gal 1:7", "n": "", "vs": [[7, "لا أعني أن هنالك إنجيلا آخر، بل إنما هنالك بعض (المعلمين) الذين يثيرون البلبلة بينكم، راغبين في تحوير إنجيل المسيح."]]}, {"l": "Gal 3:1", "n": "", "vs": [[1, "ياأهل غلاطية الأغبياء! من سحر عقولكم، أنتم الذين قد رسم أمام أعينكم يسوع المسيح وهو مصلوب؟"]]}, {"l": "Col 2:4-8", "n": "", "vs": [[4, "أقول هذا حتى لا يضللكم أحد بكلام خداع."], [5, "فمع أني في الجسد غائب، إلا أني في الروح حاضر معكم، أفرح إذ أشاهد ترتيبكم وثباتكم في الإيمان بالمسيح."], [6, "فمثلما قبلتم المسيح يسوع الرب، ففيه اسلكوا"], [7, "وأنتم متأصلون ومبنيون فيه وراسخون في الإيمان الموافق لما تعلمتم وفائضون بالشكر."], [8, "احذروا أن يوقعكم أحد فريسة بالفلسفة والغرور الباطل، عملا بتقاليد الناس ومباديء العالم؛ مما لا يوافق المسيح."]]}, {"l": "2Th 2:2-5", "n": "", "vs": [[2, "ألا تضطرب أفكاركم سريعا ولا تقلقوا، لا من إيحاء ولا من خبر ولا من رسالة منسوبة إلينا زورا، يزعم فيها أن يوم الرب قد حل فعلا."], [3, "لا تدعوا أحدا يخدعكم بأية وسيلة! فإن ذلك اليوم لا يأتي دون أن يسبقه انتشار العصيان وظهور الإنسان المتمرد، ابن الهلاك،"], [4, "الذي يتحدى كل ما يدعى إلها أو معبودا، ويعاديه مترفعا عليه. بل إنه أيضا يتخذ من هيكل الله مقرا له، محاولا أن يبرهن أنه إله."], [5, "ألا تذكرون أني كثيرا ما قلت لكم هذا عندما كنت عندكم؟"]]}, {"l": "1Ti 3:6", "n": "", "vs": [[6, "ويجب أيضا أن لا يكون مبتدئا في الإيمان، لئلا ينتفخ تكبرا، فيقع في جريمة إبليس!"]]}, {"l": "1Ti 4:6", "n": "", "vs": [[6, "إن بسطت هذه الأمور أمام الإخوة، كنت خادما صالحا للمسيح يسوع، متغذيا بكلام الإيمان والتعليم الصالح الذي اتبعته تماما."]]}, {"l": "1Ti 4:7", "n": "", "vs": [[7, "أما أساطير العجائز المبتذلة، فتجنبها. إنما مرن نفسك في طريق التقوى."]]}, {"l": "2Ti 1:15", "n": "", "vs": [[15, "أنت على علم بأن معاوني الذين في مقاطعة أسيا، ومنهم فيجلس وهرموجينس، قد تخلوا عني."]]}, {"l": "2Ti 2:17", "n": "", "vs": [[17, "وكلامهم ينهش كالآكلة، ومنهم هيمنايوس وفيليتوس،"]]}, {"l": "2Ti 2:18", "n": "", "vs": [[18, "اللذان زاغا عن الحق؛ إذ يزعمان أن القيامة قد حدثت، ويهدمان إيمان بعض الناس."]]}, {"l": "2Ti 3:6-9", "n": "", "vs": [[6, "فمن هؤلاء من يدخلون البيوت خلسة، ويوقعون في حبائلهم بعض النساء السخيفات المثقلات بالخطايا، اللواتي تجرفهن شهوات مختلفة،"], [7, "يصغين للتعليم دائما، ولا يستطعن أبدا أن يبلغن معرفة الحق بالتمام!"], [8, "ومثلما قاوم (الساحران) ينيس ويمبريس موسى، كذلك أيضا يقاوم هؤلاء الحق؛ أناس عقولهم فاسدة، وقد تبين أنهم غير أهل للإيمان."], [9, "ولكنهم لن يزدادوا تقدما، لأن حماقتهم ستنكشف للجميع، مثلما انكشفت حماقة الرجلين المذكورين."]]}, {"l": "2Ti 3:13", "n": "", "vs": [[13, "أما الناس الأشرار والدجالون المحتالون، فيتقدمون في الشر، مضللين الآخرين وهم أنفسهم مضللون!"]]}, {"l": "2Ti 4:3", "n": "", "vs": [[3, "فإنه سيأتي زمان لا يطيق الناس فيه التعليم الصحيح، بل تبعا لشهواتهم الخاصة يكدسون لأنفسهم معلمين (يقولون لهم كلاما) يداعب الآذان."]]}, {"l": "Heb 13:9", "n": "", "vs": [[9, "فلا تنخدعوا وتتبعوا تلك التعاليم الغريبة المتنوعة ... فمن الأفضل أن يثبت القلب بالنعمة لا بنظم الأطعمة التي لم تنفع المتقيدين بها."]]}, {"l": "2Pe 2:1-3", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."], [2, "وكثيرون سيسيرون وراءهم في طرق الإباحية. وبسببهم توجه الإهانة إلى طريق الحق."], [3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "1Jo 2:19", "n": "", "vs": [[19, "هؤلاء الدجالون انفصلوا عنا، لكنهم في الواقع لم يكونوا منا. ولو كانوا منا لظلوا معنا. فانفصالهم عنا إذن برهان على أنهم جميعا ليسوا منا."]]}, {"l": "1Jo 2:26", "n": "", "vs": [[26, "كتبت إليكم هذا مشيرا إلى الذين يحاولون أن يضللوكم."]]}, {"l": "1Jo 4:1", "n": "", "vs": [[1, "أيها الأحباء، لا تصدقوا كل روح، بل امتحنوا الأرواح لتعرفوا ما إذا كانت من عند الله أم لا، لأن عددا كبيرا من الأنبياء الدجالين قد انتشر في العالم."]]}], "kwAr": "تتقاذفنا", "noteAr": ""}, {"kw": "carried", "raw": "Mat_11:7; 1Co_12:2; Jam_1:6, Jam_3:4", "note": "", "refs": [{"l": "Mat 11:7", "n": "", "vs": [[7, "وما إن انصرف تلاميذ يوحنا، حتى أخذ يسوع يتحدث إلى الجموع عن يوحنا: «ماذا خرجتم إلى البرية لتروا؟ أقصبة تهزها الرياح؟"]]}, {"l": "1Co 12:2", "n": "", "vs": [[2, "تعلمون أنكم، عندما كنتم من الأمم، كنتم تنجرفون إلى الأصنام الخرساء أيما انجراف."]]}, {"l": "Jam 1:6", "n": "", "vs": [[6, "وإنما، عليه أن يطلب ذلك بإيمان، دون أي تردد أو شك. فإن المتردد كموجة البحر تتلاعب بها الرياح فتقذفها وتردها!"]]}, {"l": "Jam 3:4", "n": "", "vs": [[4, "ومهما كانت السفينة كبيرة والرياح التي تدفعها قوية وهوجاء، فبدفة صغيرة جدا يتحكم الربان فيها ويسوقها إلى الجهة التي يريد. كذلك اللسان أيضا: فهو عضو صغير،"]]}], "kwAr": "وتحملنا كل ريح تعليم", "noteAr": ""}, {"kw": "by the", "raw": "Mat_24:11, Mat_24:24; 2Co_2:17, 2Co_4:2, 2Co_11:13-15; 2Th_2:9, 2Th_2:10; 2Pe_2:18; Rev_13:11-14, Rev_19:20", "note": "", "refs": [{"l": "Mat 24:11", "n": "", "vs": [[11, "ويظهر كثيرون من الأنبياء الدجالين ويضللون كثيرين."]]}, {"l": "Mat 24:24", "n": "", "vs": [[24, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات عظيمة وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "2Co 2:17", "n": "", "vs": [[17, "فإننا لا نتاجر بكلمة الله كما يفعل الكثيرون، وإنما بإخلاص ومن قبل الله، وأمام الله، نتكلم في المسيح."]]}, {"l": "2Co 4:2", "n": "", "vs": [[2, "ولكننا قد رفضنا الأساليب الخفية المخجلة، إذ لا نسلك في المكر، ولا نزور كلمة الله، بل بإعلاننا للحق نمدح أنفسنا لدى ضمير كل إنسان، أمام الله."]]}, {"l": "2Co 11:13-15", "n": "", "vs": [[13, "فإن أمثال هؤلاء هم رسل دجالون، عمال ماكرون، يظهرون أنفسهم بمظهر رسل المسيح."], [14, "ولا عجب! فالشيطان نفسه يظهر نفسه بمظهر ملاك نور."], [15, "فليس كثيرا إذن أن يظهر خدامه أنفسهم بمظهر خدام البر. وإن عاقبتهم ستكون على حسب أعمالهم."]]}, {"l": "2Th 2:9", "n": "", "vs": [[9, "أما بروز المتمرد، فسوف يكون بقدر طاقة الشيطان على المعجزات والعلامات والعجائب المزيفة كلها،"]]}, {"l": "2Th 2:10", "n": "", "vs": [[10, "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا."]]}, {"l": "2Pe 2:18", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."]]}, {"l": "Rev 13:11-14", "n": "", "vs": [[11, "ثم رأيت وحشا آخر خارجا من الأرض، له قرنان صغيران كقرني خروف، ولكن صوته كصوت تنين،"], [12, "وقد استمد سلطته من الوحش الأول الذي خرج من البحر ليعمل بها في حضوره، فجعل سكان الأرض يسجدون للوحش الأول الذي شفي من جرحه المميت."], [13, "وقام الوحش الثاني بآيات خارقة، حتى إنه أنزل من السماء نارا على الأرض بمشهد من الناس جميعا،"], [14, "فخدع سكان الأرض بالآيات التي كان يقوم بها في حضور الوحش الأول. وأمر سكان الأرض أن يقيموا تمثالا للوحش الأول الذي كان قد جرح جرحا مميتا ولكنه عاش!"]]}, {"l": "Rev 19:20", "n": "", "vs": [[20, "فقبض على الوحش وعلى النبي الدجال الذي قام بالمعجزات في حضور الوحش وأضل بها الذين قبلوا علامة الوحش، وسجدوا لتمثاله. وطرح كلاهما حيا في بحيرة النار والكبريت المتقدة،"]]}], "kwAr": "خداع الناس", "noteAr": ""}, {"kw": "lie", "raw": "Psa_10:9, Psa_59:3; Mic_7:2; Act_23:21", "note": "", "refs": [{"l": "Psa 10:9", "n": "", "vs": [[9, "يكمن في الخفاء، كأسد في عرينه ليخطف المسكين ويجره في شبكته."]]}, {"l": "Psa 59:3", "n": "", "vs": [[3, "قد نصبوا كمينا لنفسي. اجتمع على أقوياء، لا بسبب معصيتي ولا من جراء خطيئتي يارب."]]}, {"l": "Mic 7:2", "n": "", "vs": [[2, "قد باد الصالح من الأرض واختفى المستقيم من بين الناس. جميعهم يكمنون لسفك الدماء، وكل واحد منهم يقتنص أخاه."]]}, {"l": "Act 23:21", "n": "", "vs": [[21, "فلا تقبل طلبهم، لأن أكثر من أربعين رجلا منهم حرموا على أنفسهم الطعام والشراب ونصبوا كمينا لاغتياله، وهم الآن مستعدون لذلك، وينتظرون تلبية طلبهم!»"]]}], "kwAr": "الضلال الملفق", "noteAr": ""}], "arS": [["وذلك حتى لا نكون فيما بعد ", []], ["أطفالا", ["G3516"]], [" ", []], ["تتقاذفنا", ["G2831"]], [" ", []], ["وتحملنا", ["G4064"]], [" ", []], ["كل", ["G3956"]], [" ", []], ["ريح", ["G417"]], [" ", []], ["تعليم", ["G1319"]], [" يقوم على ", []], ["خداع", ["G2940"]], [" ", []], ["الناس", ["G444"]], [" ", []], ["والمكر", ["G3834"]], [" بهم لجرهم إلى ", []], ["الضلال", ["G4106"]], [" الملفق،", []]]}, {"c": 4, "v": 15, "text": "بل نتمسك بالحق في المحبة، فننمو في كل شيء نحو من هو الرأس، أي المسيح.", "groups": [{"kw": "But", "raw": "Eph_4:25; Zec_8:16; 2Co_4:2, 2Co_8:8", "note": "", "refs": [{"l": "Eph 4:25", "n": "", "vs": [[25, "لذلك اخلعوا عنكم الكذب، وتكلموا بالصدق كل واحد مع قريبه، لأننا أعضاء بعضنا لبعض."]]}, {"l": "Zec 8:16", "n": "", "vs": [[16, "وهذا ما عليكم أن تفعلوه: لا تكذبوا بعضكم على بعض، واحكموا في ساحات قضائكم بالعدل وأحكام السلام."]]}, {"l": "2Co 4:2", "n": "", "vs": [[2, "ولكننا قد رفضنا الأساليب الخفية المخجلة، إذ لا نسلك في المكر، ولا نزور كلمة الله، بل بإعلاننا للحق نمدح أنفسنا لدى ضمير كل إنسان، أمام الله."]]}, {"l": "2Co 8:8", "n": "", "vs": [[8, "لا أقول هذا على سبيل الأمر، بل اختبارا لصدق محبتكم بحماسة الآخرين."]]}], "kwAr": "بل", "noteAr": ""}, {"kw": "speaking the truth", "raw": "or, being sincere, Jdg_16:15; Psa_32:2; Joh_1:47; Rom_12:9; Jam_2:15, Jam_2:16; 1Pe_1:22; 1Jo_3:18", "note": "or, being sincere, Jdg_16:15; Psa_32:2; Joh_1:47; Rom_12:9; Jam_2:15, Jam_2:16; 1Pe_1:22; 1Jo_3:18", "refs": [{"l": "Jdg 16:15", "n": "", "vs": [[15, "فقالت له: «كيف تدعي أنك تحبني وقلبك لا يثق بي؟ قد خدعتني ثلاث مرات ولم تطلعني على سر قوتك العظيمة»."]]}, {"l": "Psa 32:2", "n": "", "vs": [[2, "طوبى للرجل الذي لا يحسب له الرب خطيئة، وليس في روحه غش."]]}, {"l": "Joh 1:47", "n": "", "vs": [[47, "ورأى يسوع نثنائيل قادما نحوه فقال عنه: «هذا إسرائيلي أصيل لا شك فيه!»"]]}, {"l": "Rom 12:9", "n": "", "vs": [[9, "ولتكن المحبة بلا رياء. انفروا من الشر، والتصقوا بالخير."]]}, {"l": "Jam 2:15", "n": "", "vs": [[15, "لنفرض أن أخا أو أختا كانا بحاجة شديدة إلى الثياب والطعام اليومي،"]]}, {"l": "Jam 2:16", "n": "", "vs": [[16, "وقال لهما أحدكم: «أتمنى لكما كل خير. البسا ثيابا دافئة، وكلا طعاما جيدا!» دون أن يقدم لهما ما يحتاجان إليه من ثياب وطعام، فأي نفع في ذلك؟"]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}, {"l": "1Jo 3:18", "n": "", "vs": [[18, "أيها الأولاد الصغار، لا يجب أن تكون محبتنا مجرد ادعاء بالكلام واللسان، بل تكون محبة عملية حقة."]]}], "kwAr": "نتمسك بالحق في المحبة", "noteAr": "أو: صادقين (مخلصين)."}, {"kw": "may", "raw": "Eph_2:21; Hos_14:5-7; Mal_4:2; 1Pe_2:2; 2Pe_3:18", "note": "", "refs": [{"l": "Eph 2:21", "n": "", "vs": [[21, "الذي فيه يتناسق البناء كله فيرتفع ليصير هيكلا مقدسا في الرب."]]}, {"l": "Hos 14:5-7", "n": "", "vs": [[5, "وأكون كالطل لإسرائيل، فيزهر كالسوسن، وتتأصل جذوره كأرز لبنان."], [6, "تمتد أغصانه ويصير جماله كشجرة الزيتون وشذاه كأرز لبنان."], [7, "ويعودون ويقيمون في ظله ويزدهرون كالحنطة، ويزهرون كالكرمة، ويذيع ذكرهم كخمر لبنان."]]}, {"l": "Mal 4:2", "n": "", "vs": [[2, "أما أنتم أيها المتقون اسمي فتشرق عليكم شمس البر حاملة في أجنحتها الشفاء فتنطلقون متواثبين كعجول المعلف،"]]}, {"l": "1Pe 2:2", "n": "", "vs": [[2, "وكأطفال مولودين حديثا، تشوقوا إلى اللبن الروحي النقي لكي تنموا به إلى أن تبلغوا الخلاص،"]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}], "kwAr": "فننمو في كل شيء", "noteAr": ""}, {"kw": "which", "raw": "Eph_1:22, Eph_5:23; Col_1:18, Col_1:19", "note": "", "refs": [{"l": "Eph 1:22", "n": "", "vs": [[22, "وأخضع كل شيء تحت قدميه، وإياه جعل فوق كل شيء رأسا للكنيسة"]]}, {"l": "Eph 5:23", "n": "", "vs": [[23, "فإن الزوج هو رأس الزوجة كما أن المسيح أيضا هو رأس الكنيسة (جسده)، وهو نفسه مخلص الجسد."]]}, {"l": "Col 1:18", "n": "", "vs": [[18, "وهو رأس الجسد، أي الكنيسة؛ هو البداءة وبكر القائمين من بين الأموات، ليكون له المقام الأول في كل شيء."]]}, {"l": "Col 1:19", "n": "", "vs": [[19, "فإنه فيه سر الله أن يحل بكل ملئه،"]]}], "kwAr": "من هو الرأس", "noteAr": ""}], "arS": [["بل ", []], ["نتمسك بالحق", ["G226"]], [" في ", []], ["المحبة", ["G26"]], ["، ", []], ["فننمو", ["G837"]], [" في ", []], ["كل شيء", ["G3956"]], [" نحو من هو ", []], ["الرأس", ["G2776"]], ["، أي ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 4, "v": 16, "text": "فمنه يستمد الجسد كله تماسكه وترابطه بمساندة كل مفصل وفقا لمقدار العمل المخصص لكل جزء، لينشيء نموا يؤول إلى بنيان الجسد بنيانا ذاتيا في المحبة.", "groups": [{"kw": "whom", "raw": "Eph_4:12; Joh_15:5", "note": "", "refs": [{"l": "Eph 4:12", "n": "", "vs": [[12, "لتأهيل القديسين من جهة عمل الخدمة، لبنيان جسد المسيح،"]]}, {"l": "Joh 15:5", "n": "", "vs": [[5, "أنا الكرمة وأنتم الأغصان. من يثبت في وأنا فيه، فذاك ينتج ثمرا كثيرا. فإنكم بمعزل عني لا تقدرون أن تفعلوا شيئا."]]}], "kwAr": "فمنه", "noteAr": ""}, {"kw": "fitly", "raw": "Job_10:10,Job_10:11; Psa_139:15, Psa_139:16; 1Cor. 12:12-28; Col_2:19", "note": "", "refs": [{"l": "Job 10:10", "n": "", "vs": [[10, "ألم تصبني كاللبن وتخثرني كالجبن؟"]]}, {"l": "Job 10:11", "n": "", "vs": [[11, "كسوتني جلدا ولحما، فنسجتني بعظام وعصب."]]}, {"l": "Psa 139:15", "n": "", "vs": [[15, "لم يخف عليك كياني عندما كونت في السر، وجبلت في أعماق الأرض."]]}, {"l": "Psa 139:16", "n": "", "vs": [[16, "رأتني عيناك وأنا مازلت جنينا؛ وقبل أن تخلق أعضائي كتبت في سفرك يوم تصورتها."]]}, {"l": "1Co 12:12-28", "n": "", "vs": [[12, "فكما أن الجسد واحد وله أعضاء كثيرة، ولكن أعضاء الجسد كلها تشكل جسما واحدا مع أنها كثيرة، فكذلك حال المسيح أيضا."], [13, "فإننا، بالروح الواحد، قد تعمدنا جميعا لنصير جسدا واحدا، سواء كنا يهودا أم يونانيين، عبيدا أم أحرارا، وقد سقينا جميعا الروح الواحد."], [14, "فليس الجسد عضوا واحدا بل مجموعة أعضاء."], [15, "فإن قالت الرجل: «لأني لست يدا، لست من الجسد!» فهل تصبح من خارج الجسد فعلا؟"], [16, "وإن قالت الأذن: «لأني لست عينا، لست من الجسد!» فهل تصبح من خارج الجسد فعلا؟"], [17, "فلو كان الجسد كله عينا، فكيف كنا نسمع؟ ولو كان كله أذنا، فكيف كنا نشم؟"], [18, "على أن الله قد رتب كلا من الأعضاء في الجسد كما أراد."], [19, "فلو كانت كلها عضوا واحدا، فكيف يتكون الجسد؟"], [20, "فالواقع أن الأعضاء كثيرة، والجسد واحد."], [21, "وهكذا، لا تستطيع العين أن تقول لليد: «أنا لا أحتاج إليك!» ولا الرأس أن تقول للرجلين: «أنا لا أحتاج إليكما!»،"], [22, "بل بالأحرى جدا، أعضاء الجسد التي تبدو أضعف الأعضاء هي ضرورية،"], [23, "وتلك التي نعتبرها أقل ما في الجسد كرامة، نكسوها بإكرام أوفر. والأعضاء غير اللائقة يكون لها لياقة أوفر؛"], [24, "أما اللائقة، فلا تحتاج إلى ذلك. ولكن الله أحكم صنع الجسد بجملته، معطيا كرامة أوفر لما تنقصه الكرامة،"], [25, "لكي لا يكون في الجسد انقسام بل يكون بين الأعضاء اهتمام واحد لمصلحة الجسد."], [26, "فحين يصيب الألم واحدا من الأعضاء، تشعر الأعضاء الباقية معه بالألم. وحين ينال واحد من الأعضاء إكراما، تفرح معه الأعضاء الباقية."], [27, "فالواقع أنكم أنتم جميعا جسد المسيح، وأعضاء فيه كل بمفرده."], [28, "وقد رتب الله في الكنيسة أشخاصا مخصوصين: أولا الرسل، ثانيا الأنبياء، ثالثا المعلمين، وبعد ذلك أصحاب المواهب المعجزية أو مواهب الشفاء أو إعانة الآخرين أو تدبير الشؤون أو التكلم باللغات المختلفة."]]}, {"l": "Col 2:19", "n": "", "vs": [[19, "وهو غير ممسك بالرأس الذي منه يتلقى الجسد كله غذاءه وتماسكه بالمفاصل والأوصال، فينمو النمو الذي يمنحه الله ."]]}], "kwAr": "تماسكه وترابطه", "noteAr": ""}, {"kw": "the effectual", "raw": "Eph_3:7; 1Th_2:13", "note": "", "refs": [{"l": "Eph 3:7", "n": "", "vs": [[7, "الذي صرت أنا خادما له بحسب نعمة الله الموهوبة لي وفقا لعمل قدرته."]]}, {"l": "1Th 2:13", "n": "", "vs": [[13, "ولذلك نحن أيضا نرفع الشكر لله بلا توقف، لأنكم لما تلقيتم منا كلمة البشارة من الله، قبلتموها لا كأنها كلمة بشر، بل كما هي في الحقيقة: باعتبارها كلمة الله العاملة أيضا فيكم أنتم المؤمنين."]]}], "kwAr": "وفقا لمقدار العمل", "noteAr": ""}, {"kw": "edifying", "raw": "Eph_4:15, Eph_1:4, Eph_3:17; 1Co_8:1, 1Co_13:4-9, 1Co_13:13, 1Co_14:1; Gal_5:6, Gal_5:13, Gal_5:14, Gal_5:22; Phi_1:9; Col_2:2; 1Th_1:3, 1Th_3:12, 1Th_4:9, 1Th_4:10; 2Th_1:3; 1Ti_1:5; 1Pe_1:22; 1Jo_4:16", "note": "", "refs": [{"l": "Eph 4:15", "n": "", "vs": [[15, "بل نتمسك بالحق في المحبة، فننمو في كل شيء نحو من هو الرأس، أي المسيح."]]}, {"l": "Eph 1:4", "n": "", "vs": [[4, "كما كان قد اختارنا فيه قبل تأسيس العالم، لنكون قديسين بلا لوم أمامه."]]}, {"l": "Eph 3:17", "n": "", "vs": [[17, "ليسكن المسيح في قلوبكم بالإيمان؛ حتى إذا تأصلتم وتأسستم في المحبة،"]]}, {"l": "1Co 8:1", "n": "", "vs": [[1, "وأما فيما يتعلق بالذبائح المقدمة للأصنام، فنعلم أن المعرفة لجميعنا. غير أن المعرفة تنفخ تكبرا، ولكن المحبة تبني. فمن ظن أنه يعرف شيئا،"]]}, {"l": "1Co 13:4-9", "n": "", "vs": [[4, "المحبة تصبر طويلا؛ وهي لطيفة. المحبة لا تحسد. المحبة لا تتفاخر ولا تتكبر."], [5, "لا تتصرف بغير لياقة، ولا تسعى إلى مصلحتها الخاصة. لا تستفز سريعا، ولا تنسب الشر لأحد."], [6, "لا تفرح بالظلم، بل تفرح بالحق."], [7, "إنها تستر كل شيء، وتصدق كل شيء، وترجو كل شيء، وتتحمل كل شيء."], [8, "المحبة لا تزول أبدا. أما مواهب النبوآت فستزال، ومواهب اللغات ستنقطع، والمعرفة ستزال."], [9, "فإن معرفتنا جزئية ونبوءتنا جزئية."]]}, {"l": "1Co 13:13", "n": "", "vs": [[13, "أما الآن، فهذه الثلاثة باقية: الإيمان، والرجاء، والمحبة. ولكن أعظمها هي المحبة!"]]}, {"l": "1Co 14:1", "n": "", "vs": [[1, "اسعوا وراء المحبة، وتشوقوا إلى المواهب الروحية، بل بالأحرى موهبة التنبوء."]]}, {"l": "Gal 5:6", "n": "", "vs": [[6, "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة."]]}, {"l": "Gal 5:13", "n": "", "vs": [[13, "فإنما إلى الحرية قد دعيتم، أيها الإخوة؛ ولكن لا تتخذوا من الحرية ذريعة لإرضاء الجسد، بل بالمحبة كونوا عبيدا في خدمة أحدكم الآخر."]]}, {"l": "Gal 5:14", "n": "", "vs": [[14, "فإن الشريعة كلها تتم في وصية واحدة: «أن تحب قريبك كنفسك»."]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Phi 1:9", "n": "", "vs": [[9, "وصلاتي لأجلكم هي هذه: أن تزداد محبتكم أكثر فأكثر في تمام المعرفة والإدراك،"]]}, {"l": "Col 2:2", "n": "", "vs": [[2, "بغرض أن تتشجع قلوبهم وتكون كلها متحدة في المحبة، لبلوغ الإدراك التام بكل غناه، لمعرفة سر الله، أي المسيح،"]]}, {"l": "1Th 1:3", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"]]}, {"l": "1Th 3:12", "n": "", "vs": [[12, "وليجعلكم الرب تنمون وتفيضون في المحبة لتحبوا بعضكم بعضا وجميع الناس كمحبتنا لكم،"]]}, {"l": "1Th 4:9", "n": "", "vs": [[9, "أما المحبة الأخوية، فلستم في حاجة لأن أكتب إليكم عنها، لأنكم بأنفسكم قد تعلمتم من الله أن تحبوا بعضكم بعضا،"]]}, {"l": "1Th 4:10", "n": "", "vs": [[10, "ولأنكم أيضا هكذا تعاملون جميع الإخوة في مقاطعة مقدونية كلها. وإنما نحرضكم، أيها الإخوة، أن تضاعفوا ذلك أكثر فأكثر،"]]}, {"l": "2Th 1:3", "n": "", "vs": [[3, "من واجبنا أن نشكر الله على الدوام لأجلكم أيها الإخوة. كما أن هذا حق: لأن إيمانكم ينمو نموا فائقا، ومحبة أحدكم للآخر تفيض بينكم جميعا."]]}, {"l": "1Ti 1:5", "n": "", "vs": [[5, "أما الغاية مما أوصيتك به، فهي المحبة النابعة من قلب طاهر وضمير صالح وإيمان خال من الرياء."]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}, {"l": "1Jo 4:16", "n": "", "vs": [[16, "ونحن أنفسنا اختبرنا المحبة التي خصنا الله بها، ووضعنا ثقتنا فيها. إن الله محبة. ومن يثبت في المحبة، فإنه يثبت في الله، والله يثبت فيه."]]}], "kwAr": "بنيان الجسد", "noteAr": ""}], "arS": [["فمنه يستمد ", []], ["الجسد", ["G4983"]], [" ", []], ["كله", ["G3956"]], [" ", []], ["تماسكه", ["G4883"]], [" ", []], ["وترابطه", ["G4822"]], [" ", []], ["بمساندة", ["G2024"]], [" كل ", []], ["مفصل", ["G860"]], [" ", []], ["وفقا", ["G2596"]], [" ", []], ["لمقدار", ["G3358"]], [" ", []], ["العمل", ["G1753"]], [" المخصص لكل ", []], ["جزء", ["G3313"]], ["، لينشيء ", []], ["نموا", ["G838"]], [" يؤول إلى ", []], ["بنيان", ["G3619"]], [" ", []], ["الجسد", ["G4983"]], [" بنيانا ", []], ["ذاتيا", ["G1438"]], [" في ", []], ["المحبة", ["G26"]], [".", []]]}, {"c": 4, "v": 17, "text": "أقول هذا إذن، وأشهد في الرب، راجيا ألا تسلكوا فيما بعد كما يسلك الأمم في عقم ذهنهم،", "groups": [{"kw": "I say", "raw": "1Co_1:12, 1Co_15:50; 2Co_9:6; Gal_3:17; Col_2:4", "note": "", "refs": [{"l": "1Co 1:12", "n": "", "vs": [[12, "أعني أن واحدا منكم يقول: «أنا مع بولس» وآخر: «أنا مع أبلوس»، وآخر: «أنا مع بطرس»، وآخر: «أنا مع المسيح»."]]}, {"l": "1Co 15:50", "n": "", "vs": [[50, "ثم إني، أيها الإخوة، أؤكد لكم أن الأجسام ذات اللحم والدم لا يمكنها أن ترث ملكوت الله، كما لا يمكن للمنحل أن يرث غير المنحل."]]}, {"l": "2Co 9:6", "n": "", "vs": [[6, "فمن الحق أن من يزرع بالتقتير، يحصد أيضا بالتقتير، ومن يزرع بالبركات، يحصد أيضا بالبركات."]]}, {"l": "Gal 3:17", "n": "", "vs": [[17, "فما أقوله هو هذا: إن عهدا سبق أن أقره الله لا تنقضه الشريعة التي جاءت بعده بأربع مئة وثلاثين سنة، وكأنها تلغي الوعد."]]}, {"l": "Col 2:4", "n": "", "vs": [[4, "أقول هذا حتى لا يضللكم أحد بكلام خداع."]]}], "kwAr": "أقول هذا", "noteAr": ""}, {"kw": "testify", "raw": "Neh_9:29, Neh_9:30, Neh_13:15; Jer_42:19; Act_2:40, Act_18:5, Act_20:21; Gal_5:3; 1Th_4:6", "note": "", "refs": [{"l": "Neh 9:29", "n": "", "vs": [[29, "وأنذرتهم لتردهم إلى شريعتك. غير أنهم طغوا وتمردوا على وصاياك وأخطأوا ضد أحكامك، التي إن مارسها إنسان يحيا بها، واعتصموا بعنادهم وأغلظوا قلوبهم ولم يطيعوا."]]}, {"l": "Neh 9:30", "n": "", "vs": [[30, "لقد تحملتهم سنين كثيرة، وحذرتهم بروحك على لسان أنبيائك فلم يصغوا، فأسلمتهم لعبودية أمم البلاد."]]}, {"l": "Neh 13:15", "n": "", "vs": [[15, "وفي تلك الأيام شاهدت في أرض يهوذا قوما يدوسون المعاصر في يوم السبت، ويأتون بأكياس الحنطة ويحملونها على الحمير، وكذلك بأحمال العنب والتين وسواها من المحاصيل التي يجلبونها إلى أورشليم في يوم السبت، فحذرتهم من بيع الطعام في ذلك اليوم."]]}, {"l": "Jer 42:19", "n": "", "vs": [[19, "«فيابقية إسرائيل لا تهاجروا إلى مصر. تيقنوا أني قد حذرتكم اليوم."]]}, {"l": "Act 2:40", "n": "", "vs": [[40, "ثم شهد بطرس للحاضرين ووعظهم بكلام كثير آخر، قائلا: «اخلصوا من هذا الجيل المنحرف!»"]]}, {"l": "Act 18:5", "n": "", "vs": [[5, "ولما وصل سيلا وتيموثاوس من مقاطعة مقدونية، تفرغ بولس تماما للتبشير، شاهدا لليهود أن يسوع هو المسيح."]]}, {"l": "Act 20:21", "n": "", "vs": [[21, "فكنت أحث اليهود واليونانيين على أن يتوبوا إلى الله ويؤمنوا بربنا يسوع."]]}, {"l": "Gal 5:3", "n": "", "vs": [[3, "وأشهد مرة أخرى لكل مختون بأنه ملتزم أن يعمل بالشريعة كلها."]]}, {"l": "1Th 4:6", "n": "", "vs": [[6, "وألا يتعدى حقوق أخيه ويسيء إليه في هذا الأمر، لأن الرب هو المنتقم لجميع هذه الإساءات، كما أنذرناكم قبلا وشهدنا لكم بحق."]]}], "kwAr": "وأشهد في الرب", "noteAr": ""}, {"kw": "in the", "raw": "1Th_4:1, 1Th_4:2; 1Ti_5:21, 1Ti_6:13; 2Ti_4:1", "note": "", "refs": [{"l": "1Th 4:1", "n": "", "vs": [[1, "وبعد، أيها الإخوة، فمثلما تلقيتم منا كيف يجب أن تسلكوا سلوكا يرضي الله ، وكما أنتم فاعلون، نرجو منكم ونحرضكم في الرب يسوع أن تضاعفوا تقدمكم في ذلك أكثر فأكثر."]]}, {"l": "1Th 4:2", "n": "", "vs": [[2, "فإنكم تعرفون الوصايا التي لقناكم إياها من قبل الرب يسوع."]]}, {"l": "1Ti 5:21", "n": "", "vs": [[21, "أطلب منك أمام الله والمسيح والملائكة المختارين أن تعمل بهذه التوصيات دون مراعاة أشخاص، فلا تعمل شيئا بتحيز."]]}, {"l": "1Ti 6:13", "n": "", "vs": [[13, "وأوصيك، أمام الله الذي يحيي كل شيء، والمسيح يسوع الذي شهد أمام بيلاطس البنطي بالاعتراف الحسن،"]]}, {"l": "2Ti 4:1", "n": "", "vs": [[1, "أطلب منك في حضرة الله والمسيح الذي سيدين الأحياء والأموات، بعودته العلنية وملكوته،"]]}], "kwAr": "في الرب", "noteAr": ""}, {"kw": "that ye", "raw": "Eph_1:22, Eph_2:1-3, Eph_5:3-8; Rom_1:23-32; 1Co_6:9-11; Gal_5:19-21; Col_3:5-8; 1Pe_4:3, 1Pe_4:4", "note": "", "refs": [{"l": "Eph 1:22", "n": "", "vs": [[22, "وأخضع كل شيء تحت قدميه، وإياه جعل فوق كل شيء رأسا للكنيسة"]]}, {"l": "Eph 2:1-3", "n": "", "vs": [[1, "وأنتم كنتم في السابق أمواتا بذنوبكم وخطاياكم،"], [2, "التي كنتم تسلكون فيها حسب مسرى هذا العالم، تابعين رئيس قوات الهواء، ذلك الروح العامل الآن في أبناء العصيان،"], [3, "الذين بينهم نحن أيضا كنا نسلك سابقا في شهوات جسدنا، عاملين ما يريده الجسد والأفكار، وكنا بالطبيعة أولاد الغضب كالآخرين أيضا."]]}, {"l": "Eph 5:3-8", "n": "", "vs": [[3, "أما الزنى، وكل نجاسة أو شهوة نهمة، فلا يذكر بينكم حتى اسمها، كما يليق بالقديسين."], [4, "وكذلك البذاءة والكلام السفيه والهزل، فهي غير لائقة. وإنما أحرى بكم أن تلهجوا بالشكر لله!"], [5, "فإنكم تعلمون هذا جيدا: أن كل زان أو نجس أو صاحب شهوة نهمة، ما هو إلا عابد أصنام، ليس له ميراث في ملكوت المسيح والله."], [6, "لا يخدعكم أحد بكلام باطل! فبسبب هذه الأمور يحل غضب الله على أبناء العصيان."], [7, "إذن، لا تكونوا شركاء لهم:"], [8, "فقد كنتم في الماضي ظلاما، ولكنكم الآن نور في الرب. فاسلكوا سلوك أولاد النور."]]}, {"l": "Rom 1:23-32", "n": "", "vs": [[23, "واستبدلوا بمجد الله الخالد تماثيل لصور الإنسان الفاني والطيور وذوات الأربع والزواحف."], [24, "لذلك أسلمهم الله ، في شهوات قلوبهم، إلى النجاسة، ليهينوا أجسادهم فيما بينهم."], [25, "إذ قد استبدلوا بحق الله ما هو باطل، فاتقوا المخلوق وعبدوه بدل الخالق، المبارك إلى الأبد. آمين!"], [26, "لهذا السبب أسلمهم الله إلى الشهوات المخزية. فإن إناثهم تحولن عن استعمال أجسادهن بالطريقة الطبيعية إلى استعمالها بطريقة مخالفة للطبيعة."], [27, "وكذلك تحول الذكور أيضا عن استعمال الأنثى بالطريقة الطبيعية، والتهبوا شهوة بعضهم لبعض، مرتكبين الفحشاء ذكورا بذكور، فاستحقوا أن ينالوا في أنفسهم الجزاء العادل على ضلالهم."], [28, "وبما أنهم لم يتخيروا إبقاء الله ضمن معرفتهم، أسلمهم الله إلى ذهن عاطل عن التمييز دفعهم إلى ممارسة الأمور غير اللائقة."], [29, "إذ قد امتلأوا من كل إثم وشر وجشع وخبث، وشحنوا حسدا وقتلا وخصاما ومكرا وسوءا. وهم ثرثارون،"], [30, "مغتابون، كارهون لله، شتامون، متكبرون، متفاخرون، مخترعون للشرور، غير طائعين للوالدين."], [31, "لا فهم عندهم، ولا أمانة، ولا حنان، ولا رحمة."], [32, "إنهم يعلمون حكم الله العادل: أن الذين يفعلون هذه الأمور يستوجبون الموت؛ ومع ذلك، لا يمارسونها وحسب، بل يسرون بفاعليها."]]}, {"l": "1Co 6:9-11", "n": "", "vs": [[9, "أما تعلمون أن الظالمين لن يرثوا ملكوت الله؟ لا تضلوا: فإن ملكوت الله لن يرثه الزناة ولا عابدو الأصنام ولا الفاسقون ولا المتخنثون ولا مضاجعو الذكور"], [10, "ولا السراقون ولا الطماعون ولا السكيرون ولا الشتامون ولا المغتصبون."], [11, "وهكذا كان بعضكم، إلا أنكم قد اغتسلتم، بل تقدستم، بل تبررتم، باسم الرب يسوع المسيح وبروح إلهنا."]]}, {"l": "Gal 5:19-21", "n": "", "vs": [[19, "أما أعمال الجسد فظاهرة، وهي: الزنى والنجاسة والدعارة،"], [20, "وعبادة الأصنام والسحر، والعداوة والنزاع والغيرة والغضب، والتحزب والانقسام والتعصب،"], [21, "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!"]]}, {"l": "Col 3:5-8", "n": "", "vs": [[5, "فأميتوا إذن أعضاءكم الأرضية: الزنى، النجاسة، جموح العاطفة، الشهوة الرديئة، والاشتهاء النهم الذي هو عبادة أصنام."], [6, "فبسبب هذه الخطايا ينزل غضب الله،"], [7, "وفيها سلكتم في الماضي، حين كنتم تعيشون فيها."], [8, "وأما الآن، فانزعوا عنكم، أنتم أيضا، هذه الخطايا كلها: الغضب، النقمة، الخبث، التجديف، الكلام القبيح الخارج من أفواهكم."]]}, {"l": "1Pe 4:3", "n": "", "vs": [[3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}, {"l": "1Pe 4:4", "n": "", "vs": [[4, "ورفاقكم في تلك العيشة سابقا يستغربون أنكم لا تركضون معهم إلى فيض هذه الخلاعة، ويجرحون سمعتكم."]]}], "kwAr": "ألا تسلكوا فيما بعد", "noteAr": ""}, {"kw": "in the", "raw": "Psa_94:8-11; Act_14:15", "note": "", "refs": [{"l": "Psa 94:8-11", "n": "", "vs": [[8, "افهموا ياأغبياء الشعب! ياجهال متى تتعقلون؟"], [9, "صانع الأذن ألا يسمع؟ جابل العين ألا يبصر؟"], [10, "مؤدب الأمم ألا يزجر وهو الذي يعلم الإنسان الحكمة؟"], [11, "الرب يعلم أفكار الإنسان ويعرف أنها باطلة."]]}, {"l": "Act 14:15", "n": "", "vs": [[15, "وهما يصرخان: «لماذا تفعلون هذا أيها الناس؟ ما نحن إلا بشر ضعفاء مثلكم، نبشركم بأن ترجعوا عن هذه الأشياء الباطلة إلى الله الحي صانع السماء والأرض والبحر، وكل ما فيها،"]]}], "kwAr": "في عقم ذهنهم", "noteAr": ""}], "arS": [["أقول", ["G3004"]], [" هذا إذن، ", []], ["وأشهد", ["G3143"]], [" في ", []], ["الرب", ["G2962"]], ["، راجيا ألا ", []], ["تسلكوا", ["G4043"]], [" فيما بعد كما ", []], ["يسلك", ["G4043"]], [" ", []], ["الأمم", ["G1484"]], [" في ", []], ["عقم", ["G3153"]], [" ", []], ["ذهنهم", ["G3563"]], ["،", []]]}, {"c": 4, "v": 18, "text": "لكونهم مظلمي البصيرة ومتغربين عن حياة الله بسبب ما فيهم من جهل وقساوة قلب.", "groups": [{"kw": "the understanding", "raw": "Psa_74:20, Psa_115:4-8; Isa_44:18-20, Isa_46:5-8; Act_17:30, Act_26:17, Act_26:18; Rom_1:21-23, Rom_1:28; 1Co_1:21; 2Co_4:4; Gal_4:8; 1Th_4:5", "note": "", "refs": [{"l": "Psa 74:20", "n": "", "vs": [[20, "اذكر العهد الذي قطعته لنا، فإن الظلم كامن في كل ركن مظلم من الأرض."]]}, {"l": "Psa 115:4-8", "n": "", "vs": [[4, "أما أوثانهم فهي فضة وذهب من صنع أيدي البشر."], [5, "لها أفواه لكنها لا تنطق. لها عيون ولكنها لا تبصر."], [6, "وآذان لكنها لا تسمع. وأنوف لكنها لا تشم."], [7, "لها أيد لكنها لا تلمس. وأرجل لكنها لا تمشي، ولا تصدر من حناجرها صوتا."], [8, "مثلها يصير صانعوها وكل من يتوكل عليها."]]}, {"l": "Isa 44:18-20", "n": "", "vs": [[18, "إنهم لا يفقهون ولا يدركون، إذ غشي على عيونهم فلا يبصرون، وأغلق على قلوبهم فلا يفهمون."], [19, "ليس من متأمل أو ذي معرفة أو إدراك يقول: قد أحرقت نصف الشجرة بالنار وخبزت خبزي على جمراتها، شويت لحما عليها وأكلته. أفأصنع من بقيتها رجسا وأسجد أمام قطعة خشب؟"], [20, "لكأنه يأكل الرماد! يجري وراء سراب ويعجز عن إنقاذ نفسه أو الاعتراف أن الصنم الذي يمسكه بيده هو محض ضلال!"]]}, {"l": "Isa 46:5-8", "n": "", "vs": [[5, "بمن تشبهونني وتعادلونني وتقارنونني حتى نكون متماثلين؟"], [6, "هل بالذين يفرغون الذهب من الكيس ويزنون الفضة بالميزان، ويستأجرون صائغا ليسبكها إلها، ويخرون لها ساجدين؟"], [7, "يرفعونها على أكتافهم وينقلونها لينصبوها في موضعها حيث تستقر هناك لا تبرح من مكانها، وإن استغاث بها أحد لا تستجيب ولا تنجيه من محنته؟"], [8, "اذكروا هذا واتعظوا. انقشوه في أذهانكم ياعصاة!"]]}, {"l": "Act 17:30", "n": "", "vs": [[30, "فالله الآن يدعو جميع الناس في كل مكان أن يرجعوا إليه تائبين، وقد غض النظر عن أزمنة الجهل التي مرت،"]]}, {"l": "Act 26:17", "n": "", "vs": [[17, "وسأنقذك من شعبك ومن الأمم التي أرسلك إليها الآن،"]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "Rom 1:21-23", "n": "", "vs": [[21, "فمع أنهم عرفوا الله ، لم يمجدوه باعتباره الله ، ولا شكروه، بل انحطوا بتفكيرهم إلى الحماقة وصار قلبهم لغباوته مظلما."], [22, "وفيما يدعون أنهم حكماء، صاروا جهالا،"], [23, "واستبدلوا بمجد الله الخالد تماثيل لصور الإنسان الفاني والطيور وذوات الأربع والزواحف."]]}, {"l": "Rom 1:28", "n": "", "vs": [[28, "وبما أنهم لم يتخيروا إبقاء الله ضمن معرفتهم، أسلمهم الله إلى ذهن عاطل عن التمييز دفعهم إلى ممارسة الأمور غير اللائقة."]]}, {"l": "1Co 1:21", "n": "", "vs": [[21, "فبما أن العالم، في حكمة الله، لم يعرف الله عن طريق الحكمة، فقد سر الله أن يخلص بجهالة البشارة الذين يؤمنون."]]}, {"l": "2Co 4:4", "n": "", "vs": [[4, "الذين أعمى إله هذا العالم أذهانهم حتى لا يضيء لهم نور الإنجيل المختص بمجد المسيح الذي هو صورة الله."]]}, {"l": "Gal 4:8", "n": "", "vs": [[8, "ولكن، لما كنتم في ذلك الحين لا تعرفون الله ، كنتم في حال العبودية."]]}, {"l": "1Th 4:5", "n": "", "vs": [[5, "غير منساق للشهوة الجامحة كالوثنيين الذين لا يعرفون الله ،"]]}], "kwAr": "مظلمي البصيرة", "noteAr": ""}, {"kw": "alienated", "raw": "Eph_2:12; Ro  "Joh 12:40", "n": "", "vs": [[40, "«أعمى عيونهم وقسى قلوبهم، لئلا يبصروا بعيونهم ويفهموا بقلوبهم، ويتوبوا فأشفيهم»."]]}, {"l": "Rom 11:25", "n": "*marg.", "vs": [[25, "فإني لا أريد، أيها الإخوة، أن يخفى عليكم هذا السر، لكي لا تكونوا حكماء في نظر أنفسكم، وهو أن العمى قد أصاب إسرائيل جزئيا إلى أن يتم دخول الأمم كليا."]]}], "kwAr": "وقساوة قلب", "noteAr": "أو: قساوة."}], "arS": [["لكونهم ", []], ["مظلمي", ["G4654"]], [" ", []], ["البصيرة", ["G1271"]], [" ", []], ["ومتغربين", ["G526"]], [" عن ", []], ["حياة", ["G2222"]], [" ", []], ["الله", ["G2316"]], [" بسبب ما فيهم من ", []], ["جهل", ["G52"]], [" ", []], ["وقساوة", ["G4457"]], [" ", []], ["قلب", ["G2588"]], [".", []]]}, {"c": 4, "v": 19, "text": "فهؤلاء، إذ طرحوا جانبا كل إحساس، استسلموا للإباحية ليرتكبوا كل نجاسة بشهوة نهمة لا ترتوي.", "groups": [{"kw": "past", "raw": "1Ti_4:2", "note": "", "refs": [{"l": "1Ti 4:2", "n": "", "vs": [[2, "في موجة رياء ينشرها معلمون دجالون لهم ضمائر كويت بالنار."]]}], "kwAr": "إذ طرحوا جانبا كل إحساس", "noteAr": ""}, {"kw": "given", "raw": "Eph_4:17; Rom_1:24-26; 1Pe_4:3", "note": "", "refs": [{"l": "Eph 4:17", "n": "", "vs": [[17, "أقول هذا إذن، وأشهد في الرب، راجيا ألا تسلكوا فيما بعد كما يسلك الأمم في عقم ذهنهم،"]]}, {"l": "Rom 1:24-26", "n": "", "vs": [[24, "لذلك أسلمهم الله ، في شهوات قلوبهم، إلى النجاسة، ليهينوا أجسادهم فيما بينهم."], [25, "إذ قد استبدلوا بحق الله ما هو باطل، فاتقوا المخلوق وعبدوه بدل الخالق، المبارك إلى الأبد. آمين!"], [26, "لهذا السبب أسلمهم الله إلى الشهوات المخزية. فإن إناثهم تحولن عن استعمال أجسادهن بالطريقة الطبيعية إلى استعمالها بطريقة مخالفة للطبيعة."]]}, {"l": "1Pe 4:3", "n": "", "vs": [[3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}], "kwAr": "استسلموا للإباحية", "noteAr": ""}, {"kw": "with", "raw": "Job_15:16; Isa_56:11; 2Pe_2:12-14, 2Pe_2:22; Jud_1:11; Rev_17:1-6, Rev_18:3", "note": "", "refs": [{"l": "Job 15:16", "n": "", "vs": [[16, "فكم بالأحرى يكون الإنسان الشارب الإثم كالماء مكروها وفاسدا!"]]}, {"l": "Isa 56:11", "n": "", "vs": [[11, "هم كلاب نهمة لا تعرف الشبع، ورعاة أيضا مجردون من الفهم، كل مال إلى طريقه طمعا في الربح،"]]}, {"l": "2Pe 2:12-14", "n": "", "vs": [[12, "حقا إن هؤلاء المعلمين الدجالين الذين يتكلمون كلاما مهينا في أمور يجهلونها، يشبهون الحيوانات المفترسة غير العاقلة، المولودة ليصطادها الناس ويقتلوها. فلابد أن يهلكوا مثلها."], [13, "وبذلك ينالون أجرة إثمهم! إنهم يحسبون الانغماس في اللذات طول النهار بهجة عظيمة. فهم أوساخ وعيوب: يتلذذون بالنجاسة ويحاولون خداعكم، فيشتركون معكم في الولائم."], [14, "عيونهم لا تنظر إلا نظرات الزنى، ولا تشبع من الخطيئة. وكم من نفوس ضعيفة تقع في فخاخهم! أما قلوبهم، فقد تدربت على الشهوة والطمع. إنهم حقا أبناء اللعنة!"]]}, {"l": "2Pe 2:22", "n": "", "vs": [[22, "وينطبق على هؤلاء ما يقوله المثل الصادق: «عاد الكلب إلى تناول ما تقيأه، والخنزيرة المغتسلة إلى التمرغ في الوحل!»"]]}, {"l": "Jud 1:11", "n": "", "vs": [[11, "الويل لهم! لأنهم سلكوا طريق قايين، واندفعوا إلى ارتكاب خطيئة بلعام طلبا للمال، وتمردوا كما تمرد قورح، فدمروا أنفسهم."]]}, {"l": "Rev 17:1-6", "n": "", "vs": [[1, "وجاء واحد من الملائكة السبعة حاملي الكؤوس السبع وقال لي: «تعال فأريك عقاب الزانية الكبرى الجالسة على المياه الكثيرة،"], [2, "والتي زنى معها ملوك الأرض، وسكر أهل الأرض من خمر زناها»."], [3, "وحملني الملاك بالروح إلى البرية، فرأيت امرأة راكبة على وحش قرمزي له سبعة رؤوس وعشرة قرون، وقد كتبت على جسمه كله أسماء تجديف."], [4, "وكانت المرأة تلبس ملابس من أرجوان وقرمز، وتتحلى بالذهب والحجارة الكريمة واللؤلوء، وقد أمسكت كأس ذهب مملوءة بزناها المكروه النجس،"], [5, "وعلى جبينها اسم مكتوب: سر: «بابل العظمى، أم زانيات الأرض وأصنامها المكروهة»."], [6, "ورأيت المرأة سكرى لكثرة ما شربت من دم القديسين، ودم شهداء يسوع الذين قتلتهم. فتملكتني الدهشة لمنظرها،"]]}, {"l": "Rev 18:3", "n": "", "vs": [[3, "لأن جميع الأمم شربت من خمر زناها، وملوك الأرض زنوا معها، وتجار الأرض اغتنوا من كثرة ترفها!»"]]}], "kwAr": "بشهوة نهمة", "noteAr": ""}], "arS": [["فهؤلاء، إذ ", []], ["طرحوا جانبا كل إحساس", ["G524"] : "إذا كنتم قد سمعتموه حقا وتلقيتم فيه التعليم الموافق للحق الذي في يسوع!", "groups": [{"kw": "heard", "raw": "Mat_17:5; Luk_10:16; Joh_10:27; Act_3:22, Act_3:23; Heb_3:7, Heb_3:8", "note": "", "refs": [{"l": "Mat 17:5", "n": "", "vs": [[5, "وبينما كان يتكلم، إذا سحابة منيرة قد خيمت عليهم، وصوت من السحابة يهتف: «هذا هو ابني الحبيب الذي سررت به كل سرور. له اسمعوا!»"]]}, {"l": "Luk 10:16", "n": "", "vs": [[16, "من يسمع لكم يسمع لي، ومن يرفضكم يرفضني؛ ومن يرفضني يرفض الذي أرسلني! »"]]}, {"l": "Joh 10:27", "n": "", "vs": [[27, "فخرافي تصغي لصوتي، وأنا أعرفها وهي تتبعني،"]]}, {"l": "Act 3:22", "n": "", "vs": [[22, "وقد قال موسى: سيبعث الله فيكم من بين إخوتكم نبيا مثلي فاسمعوا له في كل ما يكلمكم به."]]}, {"l": "Act 3:23", "n": "", "vs": [[23, "أما من لا يسمع له فيباد من وسط الشعب."]]}, {"l": "Heb 3:7", "n": "", "vs": [[7, "لهذا، ينبهنا الروح القدس إذ يقول: «اليوم، إن سمعتم صوته،"]]}, {"l": "Heb 3:8", "n": "", "vs": [[8, "فلا تقسوا قلوبكم، كما حدث قديما، حين أثار آباؤكم غضبي، يوم التجربة في الصحراء."]]}], "kwAr": "قد سمعتموه حقا", "noteAr": ""}, {"kw": "as", "raw": "Eph_1:13; Psa_45:4, Psa_85:10,Psa_85:11; Joh_1:17, Joh_14:6, Joh_14:17; 2Co_1:20, 2Co_11:10; 1Jo_5:10-12, 1Jo_5:20", "note": "", "refs": [{"l": "Eph 1:13", "n": "", "vs": [[13, "وفيه أنتم أيضا (وضعتم رجاءكم) إذ سمعتم كلمة الحق، أي الإنجيل الذي فيه خلاصكم؛ كذلك فيه أيضا ختمتم، إذ آمنتم، بالروح القدس الموعود،"]]}, {"l": "Psa 45:4", "n": "", "vs": [[4, "وبجلالك اركب ظافرا لأجل الحق والوداعة والبر، فتقتحم يمينك الأهوال."]]}, {"l": "Psa 85:10", "n": "", "vs": [[10, "الرحمة والحق تلاقيا، البر والسلام تعانقا."]]}, {"l": "Psa 85:11", "n": "", "vs": [[11, "ينبت الحق من الأرض، ويشرف البر من السماء."]]}, {"l": "Joh 1:17", "n": "", "vs": [[17, "لأن الشريعة أعطيت على يد موسى، أما النعمة والحق فقد تواجدا بيسوع المسيح."]]}, {"l": "Joh 14:6", "n": "", "vs": [[6, "فأجابه يسوع: «أنا هو الطريق والحق والحياة. لا يأتي أحد إلى الآب إلا بي."]]}, {"l": "Joh 14:17", "n": "", "vs": [[17, "وهو روح الحق، الذي لا يقدر العالم أن يتقبله لأنه لا يراه ولا يعرفه، وأما أنتم فتعرفونه لأنه في وسطكم، وسيكون في داخلكم."]]}, {"l": "2Co 1:20", "n": "", "vs": [[20, "فمهما كانت وعود الله، فإن فيه النعم لها كلها، وفيه الآمين بنا لأجل مجد الله."]]}, {"l": "2Co 11:10", "n": "", "vs": [[10, "ومادام حق المسيح في، لن يوقف أحد افتخاري هذا في بلاد أخائية كلها!"]]}, {"l": "1Jo 5:10-12", "n": "", "vs": [[10, "فمن يؤمن بابن الله، يثق في قلبه بصحة هذه الشهادة. أما من لا يصدق الله ، إذ يرفض تصديق الشهادة التي شهد بها لابنه، فهو يتهم الله بالكذب."], [11, "وهذه الشهادة هي أن الله أعطانا حياة أبدية، وأن هذه الحياة هي في ابنه."], [12, "فمن كان له ابن الله كانت له الحياة. ومن لم يكن له ابن الله، لم تكن له الحياة!"]]}, {"l": "1Jo 5:20", "n": "", "vs": [[20, "وإننا نعلم أن ابن الله قد جاء إلى الأرض وأنار أذهاننا لنعرف الإله الحق. ونحن الآن نحيا فيه، لأننا في ابنه يسوع المسيح. هذا هو الإله الحق، والحياة الأبدية."]]}], "kwAr": "الموافق للحق الذي في يسوع", "noteAr": ""}], "arS": [["إذا كنتم قد ", []], ["سمعتموه", ["G191"]], [" حقا ", []], ["وتلقيتم", ["G1321"]], [" فيه ", []], ["التعليم", ["G1321"]], [" الموافق ", []], ["للحق", ["G225"]], [" الذي في ", []], ["يسوع", ["G2424"]], ["!", []]]}, {"c": 4, "v": 22, "text": "وهو أن تخلعوا ما يتعلق بسيرتكم الماضية: الإنسان العتيق الذي يفسد نفسه بالشهوات الخداعة؛", "groups": [{"kw": "ye", "raw": "Eph_4:25; 1Sa_1:14; Job_22:23; Eze_18:30-32; Col_2:11, Col_3:8, Col_3:9; Heb_12:1; Jam_1:21; 1Pe_2:1, 1Pe_2:2", "note": "", "refs": [{"l": "Eph 4:25", "n": "", "vs": [[25, "لذلك اخلعوا عنكم الكذب، وتكلموا بالصدق كل واحد مع قريبه، لأننا أعضاء بعضنا لبعض."]]}, {"l": "1Sa 1:14", "n": "", "vs": [[14, "فقال لها عالي: «إلى متى تظلين سكرى؟ كفي عن شرب الخمر»"]]}, {"l": "Job 22:23", "n": "", "vs": [[23, "إن رجعت إلى القدير واتضعت، وإن طرحت الإثم بعيدا عن خيامك،"]]}, {"l": "Eze 18:30-32", "n": "", "vs": [[30, "لذلك أدينكم ياشعب إسرائيل، كل واحد بمقتضى طرقه، يقول السيد الرب. توبوا وارجعوا عن ذنوبكم كلها، فلا يكون لكم الإثم معثرة هلاك."], [31, "اطرحوا عنكم كل ذنوبكم التي ارتكبتموها، واحصلوا لأنفسكم على قلب جديد وروح جديدة. فلماذا تنقرضون ياشعب إسرائيل؟"], [32, "إذ لا أسر بموت أحد، يقول السيد الرب، فتوبوا واحيوا."]]}, {"l": "Col 2:11", "n": "", "vs": [[11, "وفيه أيضا ختنتم أنتم ختانا لم تجره الأيدي، إذ نزع عنكم جسد الخطايا البشري وهذا هو ختان المسيح:"]]}, {"l": "Col 3:8", "n": "", "vs": [[8, "وأما الآن، فانزعوا عنكم، أنتم أيضا، هذه الخطايا كلها: الغضب، النقمة، الخبث، التجديف، الكلام القبيح الخارج من أفواهكم."]]}, {"l": "Col 3:9", "n": "", "vs": [[9, "لا يكذب أحدكم على الآخر، إذ قد نزعتم الإنسان العتيق وأعماله"]]}, {"l": "Heb 12:1", "n": "", "vs": [[1, "فبما أن هذا العدد الكبير من الشاهدين للإيمان، يتجمع حولنا كأنه سحابة عظيمة، فلنطرح جانبا كل ثقل يعيقنا عن التقدم، ونتخلص من تلك الخطيئة التي نتعرض للسقوط في فخها بسهولة، لكي نتمكن، نحن أيضا، أن نركض باجتهاد في السباق الممتد أمامنا،"]]}, {"l": "Jam 1:21", "n": "", "vs": [[21, "إذن، تخلصوا من كل ما في حياتكم من نجاسة وشر متزايد. وليكن قبولكم لتلك الكلمة التي غرسها الله في قلوبكم، قبولا وديعا. فهي القادرة أن تخلص نفوسكم."]]}, {"l": "1Pe 2:1", "n": "", "vs": [[1, "لذلك، تخلصوا من كل أثر للشر والخداع والرياء والحسد والذم."]]}, {"l": "1Pe 2:2", "n": "", "vs": [[2, "وكأطفال مولودين حديثا، تشوقوا إلى اللبن الروحي النقي لكي تنموا به إلى أن تبلغوا الخلاص،"]]}], "kwAr": "أن تخلعوا", "noteAr": ""}, {"kw": "former", "raw": "Eph_4:17, Eph_2:3; Gal_1:13; Col_3:7; 1Pe_1:18, 1Pe_4:3; 2Pe_2:7", "note": "", "refs": [{"l": "Eph 4:17", "n": "", "vs": [[17, "أقول هذا إذن، وأشهد في الرب، راجيا ألا تسلكوا فيما بعد كما يسلك الأمم في عقم ذهنهم،"]]}, {"l": "Eph 2:3", "n": "", "vs": [[3, "الذين بينهم نحن أيضا كنا نسلك سابقا في شهوات جسدنا، عاملين ما يريده الجسد والأفكار، وكنا بالطبيعة أولاد الغضب كالآخرين أيضا."]]}, {"l": "Gal 1:13", "n": "", "vs": [[13, "فإنكم قد سمعتم بسيرتي الماضية في الديانة اليهودية، كيف كنت أضطهد كنيسة الله متطرفا إلى أقصى حد، ساعيا إلى تخريبها،"]]}, {"l": "Col 3:7", "n": "", "vs": [[7, "وفيها سلكتم في الماضي، حين كنتم تعيشون فيها."]]}, {"l": "1Pe 1:18", "n": "", "vs": [[18, "واعلموا أنه قد دفع الفدية ليحرركم من سيرة حياتكم الباطلة التي أخذتموها بالتقليد عن آبائكم. وهذه الفدية لم تكن شيئا فانيا كالفضة أو الذهب،"]]}, {"l": "1Pe 4:3", "n": "", "vs": [[3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}, {"l": "2Pe 2:7", "n": "", "vs": [[7, "ولكنه أنقذ لوطا البار، الذي كان متضايقا جدا من سلوك أشرار زمانه في الدعارة."]]}], "kwAr": "بسيرتكم الماضية", "noteAr": ""}, {"kw": "the old", "raw": "Rom_6:6; Col_3:9", "note": "", "refs": [{"l": "Rom 6:6", "n": "", "vs": [[6, "فنحن نعلم هذا: أن الإنسان العتيق فينا قد صلب معه لكي يبطل جسد الخطيئة فلا نبقى عبيدا للخطيئة فيما بعد."]]}, {"l": "Col 3:9", "n": "", "vs": [[9, "لا يكذب أحدكم على الآخر، إذ قد نزعتم الإنسان العتيق وأعماله"]]}], "kwAr": "الإنسان العتيق", "noteAr": ""}, {"kw": "deceitful", "raw": "Pro_11:18; Jer_49:16; Oba_1:3; Rom_7:11; Tit_3:3; Heb_3:13; Jam_1:26; 2Pe_2:13", "note": "", "refs": [{"l": "Pro 11:18", "n": "", "vs": [[18, "الشرير يكسب أجرة غش زائلة، أما زارع البر فله ثواب أكيد دائم."]]}, {"l": "Jer 49:16", "n": "", "vs": [[16, "قد خدعك ما تثيره من رعب، وأغوتك كبرياء قلبك، يامن تقيم في شقوق الصخر وتعتصم بقمة التل. ولكنني سأطرحك من هناك ولو بنيت عشك عاليا كعش النسر، يقول الرب."]]}, {"l": "Oba 1:3", "n": "", "vs": [[3, "قد غرتك كبرياء قلبك أيها المقيم في شقوق الصخور، ومساكنه في القمم، القائل في قلبه: من يهوي بي إلى الأرض؟"]]}, {"l": "Rom 7:11", "n": "", "vs": [[11, "فإن الخطيئة، إذ استغلت الوصية، خدعتني وقتلتني بها."]]}, {"l": "Tit 3:3", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."]]}, {"l": "Heb 3:13", "n": "", "vs": [[13, "وإنما، شجعوا بعضكم بعضا كل يوم، مادمنا نقول: «اليوم...». وذلك لكي لا تقسي الخطيئة قلب أحد منكم بخداعها."]]}, {"l": "Jam 1:26", "n": "", "vs": [[26, "وإن ظن أحد أنه متدين، وهو لا يلجم لسانه، فإنه يغش قلبه، وديانته غير نافعة!"]]}, {"l": "2Pe 2:13", "n": "", "vs": [[13, "وبذلك وسلام."]]}, {"l": "1Pe 1:13", "n": "", "vs": [[13, "لذلك اجعلوا أذهانكم متنبهة دائما، وتيقظوا، وعلقوا رجاءكم كله على النعمة التي ستكون من نصيبكم عندما يعود يسوع المسيح ظاهرا بمجده!"]]}], "kwAr": "في روح ذهنكم", "noteAr": ""}], "arS": [["وتتجددوا", ["G365"]], [" في ", []], ["روح", ["G4151"]], [" ", []], ["ذهنكم", ["G3563"]], ["؛", []]]}, {"c": 4, "v": 24, "text": "وتلبسوا الإنسان الجديد المخلوق على مثال الله في البر والقداسة بالحق.", "groups": [{"kw": "put", "raw": "Eph_6:11; Job_29:14; Isa_52:1, Isa_59:17; Rom_13:12, Rom_13:14; 1Co_15:53; Gal_3:27; Col_3:10-14", "note": "", "refs": [{"l": "Eph 6:11", "n": "", "vs": [[11, "البسوا سلاح الله الكامل، لتتمكنوا من الصمود في وجه مكايد إبليس."]]}, {"l": "Job 29:14", "n": "", "vs": [[14, "ارتديت البر فكساني، وكجبة وعمامة كان عدلي."]]}, {"l": "Isa 52:1", "n": "", "vs": [[1, "استيقظي، استيقظي تسربلي بقوتك ياصهيون، ارتدي ثياب بهائك ياأورشليم، المدينة المقدسة، إذ لن يدخلك بعد اليوم أغلف ولا نجس."]]}, {"l": "Isa 59:17", "n": "", "vs": [[17, "فتدرع بالبر وارتدى على رأسه خوذة الخلاص، واكتسى بثياب الانتقام، والتف بعباءة الغضب."]]}, {"l": "Rom 13:12", "n": "", "vs": [[12, "كاد الليل أن ينتهي والنهار أن يطلع. فلنطرح أعمال الظلام، ونلبس سلاح النور"]]}, {"l": "Rom 13:14", "n": "", "vs": [[14, "وإنما البسوا الرب يسوع المسيح (تمثلوا به)، ولا تنشغلوا بالتدبير للجسد لقضاء شهواته."]]}, {"l": "1Co 15:53", "n": "", "vs": [[53, "فلابد لهذا الجسم القابل للانحلال أن يلبس عدم انحلال، ولهذا الفاني أن يلبس خلودا."]]}, {"l": "Gal 3:27", "n": "", "vs": [[27, "لأنكم، جميع الذين تعمدتم في المسيح، قد لبستم المسيح."]]}, {"l": "Col 3:10-14", "n": "", "vs": [[10, "ولبستم الجديد الذي يتجدد لبلوغ تمام المعرفة وفقا لصورة خالقه،"], [11, "وفيه لا فرق بين يوناني ويهودي، أو مختون وغير مختون، أو متحضر ومتخلف، أو عبد وحر، بل المسيح هو الكل وفي الكل."], [12, "فباعتباركم جماعة مختارة من الله، قديسين محبوبين، البسوا دائما عواطف الحنان واللطف والتواضع والوداعة وطول البال،"], [13, "محتملين بعضكم بعضا، ومسامحين بعضكم بعضا. إن كان لأحدكم شكوى على آخر، كما سامحكم الرب، هكذا افعلوا أنتم أيضا."], [14, "وفوق هذا كله البسوا المحبة، فهي رابطة الكمال."]]}], "kwAr": "وتلبسوا", "noteAr": ""}, {"kw": "new", "raw": "Eph_2:15; Rom_6:4; 2Co_4:16, 2Co_5:17; 1Pe_2:2", "note": "", "refs": [{"l": "Eph 2:15", "n": "", "vs": [[15, "أي العداء: إذ أبطل بجسده شريعة الوصايا ذات الفرائض، لكي يكون من الفريقين إنسانا واحدا جديدا، إذ أحل السلام بينهما،"]]}, {"l": "Rom 6:4", "n": "", "vs": [[4, "وبسبب ذلك دفنا معه بالمعمودية للموت، حتى كما أقيم المسيح من الأموات بمجد الآب، كذلك نسلك نحن أيضا في حياة جديدة."]]}, {"l": "2Co 4:16", "n": "", "vs": [[16, "لهذا، لا تخور عزيمتنا! ولكن، مادام الإنسان الظاهر فينا يفنى، فإن الإنسان الباطن فينا يتجدد يوما فيوما."]]}, {"l": "2Co 5:17", "n": "", "vs": [[17, "فإنه إذا كان أحد في المسيح، فهو خليقة جديدة: إن الأشياء القديمة قد زالت، وها كل شيء قد صار جديدا."]]}, {"l": "1Pe 2:2", "n": "", "vs": [[2, "وكأطفال مولودين حديثا، تشوقوا إلى اللبن الروحي النقي لكي تنموا به إلى أن تبلغوا الخلاص،"]]}], "kwAr": "الإنسان الجديد", "noteAr": ""}, {"kw": "after", "raw": "Gen_1:26, Gen_1:27; 2Co_3:18; Col_3:10; 1Jo_3:2", "note": "", "refs": [{"l": "Gen 1:26", "n": "", "vs": [[26, "ثم قال الله : «لنصنع الإنسان على صورتنا، كمثالنا، فيتسلط على سمك البحر، وعلى طير السماء، وعلى الأرض، وعلى كل زاحف يزحف عليها»."]]}, {"l": "Gen 1:27", "n": "", "vs": [[27, "فخلق الله الإنسان على صورته. على صورة الله خلقه. ذكرا وأنثى خلقهم."]]}, {"l": "2Co 3:18", "n": "", "vs": [[18, "ونحن جميعا فيما ننظر إلى مجد الرب بوجوه كالمرآة لا حجاب عليها، نتجلى من مجد إلى مجد لنشابه الصورة الواحدة عينها، وذلك بفعل الرب الروح."]]}, {"l": "Col 3:10", "n": "", "vs": [[10, "ولبستم الجديد الذي يتجدد لبلوغ تمام المعرفة وفقا لصورة خالقه،"]]}, {"l": "1Jo 3:2", "n": "", "vs": [[2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"]]}], "kwAr": "على مثال الله", "noteAr": ""}, {"kw": "created", "raw": "Eph_2:10; Gal_6:15", "note": "", "refs": [{"l": "Eph 2:10", "n": "", "vs": [[10, "فإننا نحن تحفة الله، وقد خلقنا في المسيح يسوع لأعمال صالحة أعدها سلفا لنسلك فيها."]]}, {"l": "Gal 6:15", "n": "", "vs": [[15, "فليس الختان بشيء، ولا عدم الختان بشيء، وإنما (المهم أن يصير الإنسان) خليقة جديدة."]]}], "kwAr": "المخلوق", "noteAr": ""}, {"kw": "righteousness", "raw": "Psa_45:6, Psa_45:7; Rom_8:29; Tit_2:14; Heb_1:8, Heb_12:14; 1Jo_3:3", "note": "", "refs": [{"l": "Psa 45:6", "n": "", "vs": [[6, "عرشك ياالله إلى دهر الدهور، وصولجان ملكك عادل ومستقيم."]]}, {"l": "Psa 45:7", "n": "", "vs": [[7, "أحببت البر وأبغضت الإثم. من أجل ذلك مسحك الله (ملكا) بدهن الابتهاج أكثر من رفقائك (الملوك)."]]}, {"l": "Rom 8:29", "n": "", "vs": [[29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Heb 1:8", "n": "", "vs": [[8, "ولكنه يخاطب الابن قائلا: «إن عرشك، ياالله، ثابت إلى أبد الآبدين، وصولجان حكمك عادل ومستقيم."]]}, {"l": "Heb 12:14", "n": "", "vs": [[14, "اجعلوا هدفكم أن تسالموا جميع الناس، وتعيشوا حياة مقدسة. فبغير قداسة، لا يقدر أحد أن يرى الرب."]]}, {"l": "1Jo 3:3", "n": "", "vs": [[3, "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر."]]}], "kwAr": "في البر", "noteAr": ""}, {"kw": "true holiness", "raw": "or, holiness of truth, Joh_17:17", "note": "or, holiness of truth, Joh_17:17", "refs": [{"l": "Joh 17:17", "n": "", "vs": [[17, "قدسهم بالحق؛ إن كلمتك هي الحق."]]}], "kwAr": "والقداسة بالحق", "noteAr": "أو: قداسة الحق."}], "arS": [["وتلبسوا", ["G1746"]], [" ", []], ["الإنسان", ["G444"]], [" ", []], ["الجديد", ["G2537"]], [" ", []], ["المخلوق", ["G2936"]], [" على مثال ", []], ["الله", ["G2316"]], [" في ", []], ["البر", ["G1343"]], [" ", []], ["والقداسة", ["G3742"]], [" ", []], ["بالحق", ["G225"]], [".", []]]}, {"c": 4, "v": 25, "text": "لذلك اخلعوا عنكم الكذب، وتكلموا بالصدق كل واحد مع قريبه، لأننا أعضاء بعضنا لبعض.", "groups": [{"kw": "putting", "raw": "Lev_19:11; 1Ki_13:18; Psa_52:3, Psa_119:29; Pro_6:17, Pro_12:19, Pro_12:22, Pro_21:6; Isa_9:15, Isa_59:3, Isa_59:4, Isa_63:8; Jer_9:3-5; Hos_4:2; Joh_8:44; Act_5:3, Act_5:4; Col_3:9; 1Ti_1:10, 1Ti_4:2; Tit_1:2, Tit_1:12; Rev_21:8, Rev_22:15", "note": "", "refs": [{"l": "Lev 19:11", "n": "", "vs": [[11, "لا تسرق، ولا تكذب، ولا تغدر بصاحبك،"]]}, {"l": "1Ki 13:18", "n": "", "vs": [[18, "فقال له: «أنا أيضا نبي مثلك وقد أمرني ملاك الرب أن أرجع بك معي إلى بيتي فتقتات وتشرب ماء». وهكذا كذب عليه."]]}, {"l": "Psa 52:3", "n": "", "vs": [[3, "أحببت الشر أكثر من الخير، والكذب أكثر من الصدق."]]}, {"l": "Psa 119:29", "n": "", "vs": [[29, "أبعد عني طريق الغواية وبرحمتك لقني شريعتك."]]}, {"l": "Pro 6:17", "n": "", "vs": [[17, "عينان متعجرفتان، ولسان كاذب، ويدان تسفكان دما بريئا."]]}, {"l": "Pro 12:19", "n": "", "vs": [[19, "أقوال الشفاه الصادقة تدوم إلى الأبد، أما أكاذيب لسان الزور فتنفضح في لحظة."]]}, {"l": "Pro 12:22", "n": "", "vs": [[22, "الشفاه الكاذبة رجس لدى الرب، ومسرته بالعاملين بالصدق."]]}, {"l": "Pro 21:6", "n": "", "vs": [[6, "ادخار الكنوز بلسان منافق، دخان متلاش وفخ مميت."]]}, {"l": "Isa 9:15", "n": "", "vs": [[15, "إن الشيخ والوجيه هو الرأس، والنبي الذي يلقن الكذب هو الذنب"]]}, {"l": "Isa 59:3", "n": "", "vs": [[3, "لأن أيديكم تلوثت بالدم وأصابعكم بالإثم، ونطقت شفاهكم بالكذب، ولهجت ألسنتكم بالشر."]]}, {"l": "Isa 59:4", "n": "", "vs": [[4, "ليس بينكم من يطالب بالعدل، أو يحكم بالحق. يتكلون على الباطل ويتفوهون بالزور، يحبلون بالغش، ويلدون بالإثم."]]}, {"l": "Isa 63:8", "n": "", "vs": [[8, "لأنه قال: إنهم حقا شعبي وأبناء أوفياء، لن يعودوا للباطل. فخلصهم."]]}, {"l": "Jer 9:3-5", "n": "", "vs": [[3, "«قد وتروا ألسنتهم كقسي جاهزة ليطلقوا الأكاذيب التي تقولوا بها في الأرض من دون الحق، إذ أنهم انتهوا من شر إلى شر، وإياي لم يعرفوا» يقول الرب."], [4, "«ليحترس كل واحد من جاره، ولا يثق بأحد من أقربائه، لأن كل قريب مخادع، وكل صاحب واش."], [5, "كل واحد منهم يخدع جاره ولا ينطقون بالصدق. دربوا ألسنتهم على قول الكذب، وأرهقوا أنفسهم في ارتكاب الإثم."]]}, {"l": "Hos 4:2", "n": "", "vs": [[2, "وتفشت فيها ال
