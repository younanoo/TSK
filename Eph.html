, "vs": [[43, "ولكن متى خرج الروح النجس من إنسان يسكنه، يهيم في الأماكن القاحلة طالبا الراحة، فلا يجد."], [44, "فيقول: أرجع إلى مسكني الذي فارقته! ويرجع، فيجده فارغا مكنوسا مزينا."], [45, "فيذهب، ويحضر معه سبعة أرواح أخرى أكثر منه شرا، فتدخل جميعا وتسكن ذلك الإنسان، فتكون آخرته أسوأ من حالته الأولى. هكذا تكون حال هذا الجيل الشرير! »"]]}, {"l": "Luk 11:21-26", "n": "", "vs": [[21, "عندما يحرس القوي بيته وهو بكامل سلاحه، تكون أمتعته في مأمن."], [22, "ولكن عندما يغزوه من هو أقوى منه فيغلبه، فإنه يجرده من كامل سلاحه الذي اعتمد عليه، ثم يوزع غنائمه."], [23, "من ليس معي، فهو ضدي؛ ومن لا يجمع معي، فهو يفرق."], [24, "بعد أن يخرج الروح النجس من الإنسان، يهيم في الأماكن القاحلة طلبا للراحة، وإذ لا يجد، يقول: سأرجع إلى بيتي الذي غادرته!"], [25, "وعندما يأتي، يجده مكنوسا مزينا."], [26, "فيذهب ويصطحب سبعة أرواح أخر أردأ منه، فتدخل ذلك الإنسان وتسكنه، فتصير الحالة الأخيرة لذلك الإنسان أردأ من الأولى! »"]]}, {"l": "Luk 22:2", "n": "", "vs": [[2, "ومازال رؤساء الكهنة والكتبة يسعون كي يقتلوا يسوع، لأنهم كانوا خائفين من الشعب."]]}, {"l": "Luk 22:3", "n": "", "vs": [[3, "ودخل الشيطان في يهوذا الملقب بالإسخريوطي، وهو في عداد الاثني عشر."]]}, {"l": "Luk 22:31", "n": "", "vs": [[31, "وقال الرب «سمعان، سمعان! ها إن الشيطان قد طلبكم لكي يغربلكم كما يغربل القمح،"]]}, {"l": "Joh 13:2", "n": "", "vs": [[2, "ففي أثناء العشاء، وكان الشيطان قد وضع في قلب يهوذا بن سمعان الإسخريوطي أن يخون يسوع،"]]}, {"l": "Joh 13:27", "n": "", "vs": [[27, "وبعد اللقمة، دخله الشيطان. فقال له يسوع: «أسرع في ما نويت أن تعمله!»"]]}, {"l": "Act 5:3", "n": "", "vs": [[3, "فقال له بطرس: «ياحنانيا، لماذا سمحت للشيطان أن يملأ قلبك، فكذبت على الروح القدس، واحتفظت لنفسك بجزء من ثمن الحقل؟"]]}, {"l": "2Co 4:4", "n": "", "vs": [[4, "الذين أعمى إله هذا العالم أذهانهم حتى لا يضيء لهم نور الإنجيل المختص بمجد المسيح الذي هو صورة الله."]]}, {"l": "1Jo 3:8", "n": "", "vs": [[8, "ولكن من يمارس الخطيئة، يظهر أنه من أولاد إبليس، لأن إبليس يمارس الخطيئة منذ البداية. وقد جاء ابن الله إلى الأرض لكي يبطل أعمال إبليس."]]}, {"l": "1Jo 4:4", "n": "", "vs": [[4, "أيها الأولاد الصغار، أنتم من الله، وقد غلبتم الذين يقاومون المسيح: لأن الروح القدس الساكن فيكم أقوى من الروح الشرير المنتشر في العالم."]]}], "kwAr": "ذلك الروح العامل الآن", "noteAr": ""}, {"kw": "the children", "raw": "Eph_2:3, Eph_5:6; Isa_30:1, Isa_57:4; Hos_10:9; Mat_11:19, Mat_13:38; Col_3:6; 1Pe_1:14 *Gr: 2Pe_2:14 *Gr: 1Jo_3:10", "note": "", "refs": [{"l": "Eph 2:3", "n": "", "vs": [[3, "الذين بينهم نحن أيضا كنا نسلك سابقا في شهوات جسدنا، عاملين ما يريده الجسد والأفكار، وكنا بالطبيعة أولاد الغضب كالآخرين أيضا."]]}, {"l": "Eph 5:6", "n": "", "vs": [[6, "لا يخدعكم أحد بكلام باطل! فبسبب هذه الأمور يحل غضب الله على أبناء العصيان."]]}, {"l": "Isa 30:1", "n": "", "vs": [[1, "يقول الرب: «ويل للبنين المتمردين الذين ينصاعون لمشورة لم تصدر عني، ويبرمون عهدا ليس من روحي، ليضيفوا خطيئة إلى خطيئة."]]}, {"l": "Isa 57:4", "n": "", "vs": [[4, "بمن تسخرون؟ وعلى من تفغرون أشداقكم واسعة وتدلعون ألسنتكم؟ ألستم أنتم أبناء الخطاة والمنافقين؟"]]}, {"l": "Hos 10:9", "n": "", "vs": [[9, "لقد أخطأت ياإسرائيل منذ أيام جبعة ولم تكف عن ارتكاب الإثم، ألم تدركهم الحرب في جبعة؟"]]}, {"l": "Mat 11:19", "n": "", "vs": [[19, "ثم جاء ابن الإنسان يأكل ويشرب، فقالوا: هذا رجل شره وسكير، صديق لجباة الضرائب والخاطئين. ولكن تختبر الحكمة بأعمالها.»"]]}, {"l": "Mat 13:38", "n": "", "vs": [[38, "والحقل هو العالم. والزرع الجيد هو بنو الملكوت. والزوان هو بنو الشرير."]]}, {"l": "Col 3:6", "n": "", "vs": [[6, "فبسبب هذه الخطايا ينزل غضب الله،"]]}, {"l": "1Pe 1:14", "n": "*Gr:", "vs": [[14, "وبما أنكم صرتم أولادا لله مطيعين له، فلا تعودوا إلى مجاراة الشهوات التي كانت تسيطر عليكم سابقا في أيام جهلكم."]]}, {"l": "2Pe 2:14", "n": "*Gr:", "vs": [[14, "عيونهم لا تنظر إلا نظرات الزنى، ولا تشبع من الخطيئة. وكم من نفوس ضعيفة تقع في فخاخهم! أما قلوبهم، فقد تدربت على الشهوة والطمع. إنهم حقا أبناء اللعنة!"]]}, {"l": "1Jo 3:10", "n": "", "vs": [[10, "إذن، هذا هو المقياس الذي نميز به بين أولاد الله وأولاد إبليس. من لا يمارس الصلاح، فهو ليس من الله. وكذلك من لا يحب أخاه!"]]}], "kwAr": "أبناء العصيان", "noteAr": ""}], "arS": [["التي كنتم ", []], ["تسلكون", ["G4043"]], [" فيها حسب ", []], ["مسرى", ["G165"]], [" هذا ", []], ["العالم", ["G2889"]], ["، تابعين ", []], ["رئيس", ["G758"]], [" ", []], ["قوات", ["G1849"]], [" ", []], ["الهواء", ["G109"]], ["، ذلك ", []], ["الروح", ["G4151"]], [" ", []], ["العامل", ["G1754"]], [" ", []], ["الآن", ["G3568"]], [" في ", []], ["أبناء", ["G5207"]], [" ", []], ["العصيان", ["G543"]], ["،", []]]}, {"c": 2, "v": 3, "text": "الذين بينهم نحن أيضا كنا نسلك سابقا في شهوات جسدنا، عاملين ما يريده الجسد والأفكار، وكنا بالطبيعة أولاد الغضب كالآخرين أيضا.", "groups": [{"kw": "we", "raw": "Isa_53:6, Isa_64:6, Isa_64:7; Dan_9:5-9; Rom_3:9-19; 1Co_6:9-11; Gal_2:15, Gal_2:16, Gal_3:22; Tit_3:3; 1Pe_4:3; 1Jo_1:8-10", "note": "", "refs": [{"l": "Isa 53:6", "n": "", "vs": [[6, "كلنا كغنم شردنا ملنا كل واحد إلى سبيله، فأثقل الرب كاهله بإثم جميعنا."]]}, {"l": "Isa 64:6", "n": "", "vs": [[6, "كلنا أصبحنا كنجس، وأضحت جميع أعمال برنا كثوب قذر، فذبلنا كأوراق الشجر وعبثت بنا آثامنا كالريح."]]}, {"l": "Isa 64:7", "n": "", "vs": [[7, "ليس هناك من ينادي باسمك، ويحرص على التمسك بك لأنك حجبت وجهك عنا ولاشيتنا بسبب معاصينا."]]}, {"l": "Dan 9:5-9", "n": "", "vs": [[5, "إننا أخطأنا وأثمنا وارتكبنا الشر، وتمردنا وانحرفنا عن وصاياك وأحكامك."], [6, "ولم نسمع لعبيدك الأنبياء الذين باسمك أنذروا ملوكنا ورؤساءنا وآباءنا وجميع شعب الأرض."], [7, "لك أيها السيد البر، ولنا الخزي، كما هو حادث اليوم لرجال يهوذا ولأهل أورشليم، ولسائر بني إسرائيل القريبين والبعيدين، المشتتين في كل البلدان التي أجليتهم إليها عقابا لهم على ما اقترفوه من خيانة في حقك."], [8, "فلنا أيها السيد الخزي، نحن وملوكنا ورؤسائنا وآبائنا، لأننا أخطأنا إليك."], [9, "إنما للرب إلهنا الرحمة والمغفرة لأننا عصيناك."]]}, {"l": "Rom 3:9-19", "n": "", "vs": [[9, "فماذا إذن؟ أنحن اليهود أفضل؟ لا، على الإطلاق! فإننا، في ما سبق، قد اتهمنا اليهود واليونانيين بكونهم جميعا تحت الخطيئة،"], [10, "كما قد كتب:"], [11, "ليس من يبحث عن الله."], [12, "جميع الناس قد ضلوا، وصاروا كلهم بلا نفع. ليس من يمارس الصلاح، لا ولا واحد."], [13, "حناجرهم قبور مفتوحة؛ ألسنتهم أدوات للمكر؛ شفاههم تخفي سم الأفاعي القاتلة؛"], [14, "أفواههم مملوءة لعنة ومرارة،"], [15, "أقدامهم سريعة إلى سفك الدماء؛"], [16, "في طرقهم الخراب والشقاء؛"], [17, "أما طريق السلام فلم يعرفوه؛"], [18, "ومخافة الله ليست نصب عيونهم»."], [19, "ونحن نعلم أن كل ما تقوله الشريعة إنما تخاطب به الذين هم تحت الشريعة، لكي يسد كل فم ويقع العالم كله تحت دينونة من الله."]]}, {"l": "1Co 6:9-11", "n": "", "vs": [[9, "أما تعلمون أن الظالمين لن يرثوا ملكوت الله؟ لا تضلوا: فإن ملكوت الله لن يرثه الزناة ولا عابدو الأصنام ولا الفاسقون ولا المتخنثون ولا مضاجعو الذكور"], [10, "ولا السراقون ولا الطماعون ولا السكيرون ولا الشتامون ولا المغتصبون."], [11, "وهكذا كان بعضكم، إلا أنكم قد اغتسلتم، بل تقدستم، بل تبررتم، باسم الرب يسوع المسيح وبروح إلهنا."]]}, {"l": "Gal 2:15", "n": "", "vs": [[15, "نحن يهود بالولادة، ولسنا أمما خاطئين."]]}, {"l": "Gal 2:16", "n": "", "vs": [[16, "ولكننا، إذ علمنا أن الإنسان لا يتبرر على أساس الأعمال المطلوبة في الشريعة بل فقط بالإيمان بيسوع المسيح، آمنا نحن أيضا بالمسيح يسوع، لنتبرر على أساس الإيمان به، لا على أساس أعمال الشريعة، لأنه على أعمال الشريعة لا يبرر أي إنسان."]]}, {"l": "Gal 3:22", "n": "", "vs": [[22, "ولكن الكتاب حبس الجميع تحت الخطيئة، حتى إن الوعد، على أساس الإيمان بيسوع المسيح، يوهب للذين يؤمنون."]]}, {"l": "Tit 3:3", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."]]}, {"l": "1Pe 4:3", "n": "", "vs": [[3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}, {"l": "1Jo 1:8-10", "n": "", "vs": [[8, "إن كنا ندعي أن لا خطيئة لنا، نخدع أنفسنا، ولا يكون الحق في داخلنا."], [9, "ولكن، إن اعترفنا لله بخطايانا، فهو جدير بالثقة وعادل، يغفر لنا خطايانا ويطهرنا من كل إثم."], [10, "فإن كنا ندعي أننا لم نرتكب خطيئة، نجعل الله كاذبا، ولا تكون كلمته في داخلنا!"]]}], "kwAr": "نحن أيضا", "noteAr": ""}, {"kw": "in times", "raw": "Eph_4:17-19; Act_14:16, Act_17:30,Act_17:31; Rom_11:30; 1Pe_2:10; 1Jo_2:8", "note": "", "refs": [{"l": "Eph 4:17-19", "n": "", "vs": [[17, "أقول هذا إذن، وأشهد في الرب، راجيا ألا تسلكوا فيما بعد كما يسلك الأمم في عقم ذهنهم،"], [18, "لكونهم مظلمي البصيرة ومتغربين عن حياة الله بسبب ما فيهم من جهل وقساوة قلب."], [19, "فهؤلاء، إذ طرحوا جانبا كل إحساس، استسلموا للإباحية ليرتكبوا كل نجاسة بشهوة نهمة لا ترتوي."]]}, {"l": "Act 14:16", "n": "", "vs": [[16, "وقد ترك الأمم في العصور الماضية يسلكون في طرقهم،"]]}, {"l": "Act 17:30", "n": "", "vs": [[30, "فالله الآن يدعو جميع الناس في كل مكان أن يرجعوا إليه تائبين، وقد غض النظر عن أزمنة الجهل التي مرت،"]]}, {"l": "Act 17:31", "n": "", "vs": [[31, "لأنه حدد يوما يدين فيه العالم بالعدل على يد رجل اختاره لذلك. وقد قدم للجميع برهانا، إذ أقامه من بين الأموات»."]]}, {"l": "Rom 11:30", "n": "", "vs": [[30, "والواقع أنه كما كنتم أنتم في الماضي غير مطيعين لله، ولكنكم الآن نلتم الرحمة من جراء عدم طاعتهم هم،"]]}, {"l": "1Pe 2:10", "n": "", "vs": [[10, "فإنكم في الماضي لم تكونوا شعبا؛ أما الآن، فأنتم «شعب الله وقد كنتم سابقا لا تتمتعون برحمة الله، أما الآن، فإنكم تتمتعون بها!»"]]}, {"l": "1Jo 2:8", "n": "", "vs": [[8, "ومع ذلك فالوصية التي أكتبها إليكم، هي جديدة دائما، وتتضح حقيقتها في المسيح كما تتضح فيكم أنتم. ذلك لأن الظلام قد بدأ يزول منذ أن أشرق النور الحقيقي الذي مازال الآن مشرقا."]]}], "kwAr": "سابقا", "noteAr": ""}, {"kw": "in the", "raw": "Eph_4:22; Mar_4:19; Joh_8:44; Rom_1:24, Rom_6:12, Rom_13:14; Gal_5:16-24; 1Ti_6:9; Jam_4:1-3; 1Pe_1:14, 1Pe_2:11, 1Pe_4:2; 2Pe_2:18; 1Jo_2:16; Jud_1:16-18", "note": "", "refs": [{"l": "Eph 4:22", "n": "", "vs": [[22, "وهو أن تخلعوا ما يتعلق بسيرتكم الماضية: الإنسان العتيق الذي يفسد نفسه بالشهوات الخداعة؛"]]}, {"l": "Mar 4:19", "n": "", "vs": [[19, "ولكن هموم الزمان الحاضر وخداع الغنى واشتهاء الأمور الأخرى، تدخل إليهم وتخنق الكلمة، فتصير بلا ثمر."]]}, {"l": "Joh 8:44", "n": "", "vs": [[44, "إنكم أولاد أبيكم إبليس، وترغبون أن تعملوا شهوات أبيكم. فهو من البدء كان قاتلا للناس، ولم يثبت في الحق لأنه خال من الحق! وعندما ينطق بالكذب فهو ينضح بما فيه، لأنه كذاب وأبو الكذب!"]]}, {"l": "Rom 1:24", "n": "", "vs": [[24, "لذلك أسلمهم الله ، في شهوات قلوبهم، إلى النجاسة، ليهينوا أجسادهم فيما بينهم."]]}, {"l": "Rom 6:12", "n": "", "vs": [[12, "إذن، لا تملكن الخطيئة في جسدكم المائت فتنقادوا لها في شهواته."]]}, {"l": "Rom 13:14", "n": "", "vs": [[14, "وإنما البسوا الرب يسوع المسيح (تمثلوا به)، ولا تنشغلوا بالتدبير للجسد لقضاء شهواته."]]}, {"l": "Gal 5:16-24", "n": "", "vs": [[16, "إنما أقول: اسلكوا في الروح. وعندئذ لا تتممون شهوة الجسد أبدا."], [17, "فإن الجسد يشتهي بعكس الروح، والروح بعكس الجسد؛ وهذان يقاوم أحدهما الآخر حتى إنكم لا تفعلون ما ترغبون فيه."], [18, "ولكن إذا كنتم خاضعين لقيادة الروح، فلستم في حال العبودية للشريعة."], [19, "أما أعمال الجسد فظاهرة، وهي: الزنى والنجاسة والدعارة،"], [20, "وعبادة الأصنام والسحر، والعداوة والنزاع والغيرة والغضب، والتحزب والانقسام والتعصب،"], [21, "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!"], [22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"], [23, "والوداعة وضبط النفس. وليس من قانون يمنع مثل هذه الفضائل."], [24, "ولكن الذين صاروا خاصة للمسيح، قد صلبوا الجسد مع الأهواء والشهوات."]]}, {"l": "1Ti 6:9", "n": "", "vs": [[9, "أما الذين يرغبون في أن يصيروا أغنياء، فيسقطون في التجربة والفخ ويتورطون في كثير من الشهوات السفيهة المضرة التي تغرق الناس في الدمار والهلاك."]]}, {"l": "Jam 4:1-3", "n": "", "vs": [[1, "من أين النزاع والخصام بينكم؟ أليس من لذاتكم تلك المتصارعة في أعضائكم؟"], [2, "فأنتم ترغبون في امتلاك ما لا يخصكم، لكن ذلك لا يتحقق لكم، فتقتلون، وتحسدون، ولا تتمكنون من بلوغ غايتكم. وهكذا تتخاصمون وتتصارعون! إنكم لا تمتلكون ما تريدونه، لأنكم لا تطلبونه من الله."], [3, "وإذا طلبتم منه شيئا، فإنكم لا تحصلون عليه: لأنكم تطلبون بدافع شرير، إذ تنوون أن تستهلكوا ما تنالونه لإشباع شهواتكم فقط."]]}, {"l": "1Pe 1:14", "n": "", "vs": [[14, "وبما أنكم صرتم أولادا لله مطيعين له، فلا تعودوا إلى مجاراة الشهوات التي كانت تسيطر عليكم سابقا في أيام جهلكم."]]}, {"l": "1Pe 2:11", "n": "", "vs": [[11, "أيها الأحباء، ما أنتم إلا غرباء تزورون الأرض زيارة عابرة. لذلك أطلب إليكم أن تبتعدوا عن الشهوات الجسدية التي تصارع النفس."]]}, {"l": "1Pe 4:2", "n": "", "vs": [[2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."]]}, {"l": "2Pe 2:18", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."]]}, {"l": "1Jo 2:16", "n": "", "vs": [[16, "لأن كل ما في العالم، من شهوات الجسد وشهوات العين وترف المعيشة، ليس من الآب، بل من العالم."]]}, {"l": "Jud 1:16-18", "n": "", "vs": [[16, "وهؤلاء المعلمون يتذمرون ويشكون دائما وفيما هم يندفعون وراء شهواتهم، يطلقون ألسنتهم متحدثين بأمور طنانة، ويمدحون من يعجبهم طلبا للمنفعة!"], [17, "أما أنتم أيها الأحباء، فاذكروا دائما ما قاله رسل ربنا يسوع المسيح."], [18, "فقد سبق أن نبهوكم إلى أنه، في نهاية الزمان، سيطلع مستهزئون يعيشون منغمسين في شهواتهم الفاسقة."]]}], "kwAr": "في شهوات جسدنا", "noteAr": ""}, {"kw": "fulfilling", "raw": "Rom_8:7, Rom_8:8; 2Co_7:1; Gal_5:19-21", "note": "", "refs": [{"l": "Rom 8:7", "n": "", "vs": [[7, "لأن اهتمام الجسد هو عداوة لله، إذ إنه لا يخضع لناموس الله، بل لا يستطيع ذلك."]]}, {"l": "Rom 8:8", "n": "", "vs": [[8, "فالذين هم تحت سلطة الجسد لا يستطيعون أن يرضوا الله ."]]}, {"l": "2Co 7:1", "n": "", "vs": [[1, "فإذ نلنا هذه الوعود، أيها الأحباء، لنطهر أنفسنا من كل ما يدنس الجسد والروح، ونكمل القداسة في مخافة الله."]]}, {"l": "Gal 5:19-21", "n": "", "vs": [[19, "أما أعمال الجسد فظاهرة، وهي: الزنى والنجاسة والدعارة،"], [20, "وعبادة الأصنام والسحر، والعداوة والنزاع والغيرة والغضب، والتحزب والانقسام والتعصب،"], [21, "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!"]]}], "kwAr": "عاملين ما يريده الجسد", "noteAr": ""}, {"kw": "desires", "raw": "Gr. wills, Joh_1:13", "note": "Gr. wills, Joh_1:13", "refs": [{"l": "Joh 1:13", "n": "", "vs": [[13, "وهم الذين ولدوا ليس من دم، ولا من رغبة جسد، ولا من رغبة بشر، بل من الله."]]}], "kwAr": "ما يريده", "noteAr": "في اليونانية: مشيئات."}, {"kw": "by", "raw": "Gen_5:3, Gen_6:5, Gen_8:21; Job_14:4, Job_15:14-16, Job_25:4; Psa_51:5; Mar_7:21, Mar_7:22; Joh_3:1-6; Rom_5:12-19, Rom_7:18; Gal_2:15, Gal_2:16", "note": "", "refs": [{"l": "Gen 5:3", "n": "", "vs": [[3, "كان عمر آدم مئة وثلاثين سنة عندما أنجب ولدا كشبهه ومثاله، وسماه شيثا."]]}, {"l": "Gen 6:5", "n": "", "vs": [[5, "ورأى الرب أن شر الإنسان قد كثر في الأرض، وأن كل تصور فكر قلبه يتسم دائما بالإثم،"]]}, {"l": "Gen 8:21", "n": "", "vs": [[21, "فتقبلها الرب برضى، وقال في نفسه: «لن ألعن الأرض مرة أخرى من أجل الإنسان، لأن أهواء قلب الإنسان شريرة منذ حداثته ولن أقدم على إهلاك كل حي كما فعلت."]]}, {"l": "Job 14:4", "n": "", "vs": [[4, "من يستولد الطاهر من النجس؟ لا أحد!"]]}, {"l": "Job 15:14-16", "n": "", "vs": [[14, "من هو الإنسان حتى يزكو أو مولود المرأة حتى يتبرر؟"], [15, "فإن كان الله لا يأتمن قديسيه، والسماوات غير طاهرة لديه،"], [16, "فكم بالأحرى يكون الإنسان الشارب الإثم كالماء مكروها وفاسدا!"]]}, {"l": "Job 25:4", "n": "", "vs": [[4, "فكيف يتبرر الإنسان عند الله، وكيف يزكو مولود المرأة؟"]]}, {"l": "Psa 51:5", "n": "", "vs": [[5, "ها إني بالإثم قد ولدت وفي الخطيئة حبلت بي أمي."]]}, {"l": "Mar 7:21", "n": "", "vs": [[21, "فإنه من الداخل، من قلوب الناس، تنبع الأفكار الشريرة، الفسق، السرقة، القتل،"]]}, {"l": "Mar 7:22", "n": "", "vs": [[22, "الزنى، الطمع، الخبث، الخداع، العهارة، العين الشريرة، التجديف، الكبرياء، الحماقة"]]}, {"l": "Joh 3:1-6", "n": "", "vs": [[1, "غير أن إنسانا من الفريسيين، اسمه نيقوديموس، وهو عضو في المجلس اليهودي،"], [2, "جاء إلى يسوع ليلا وقال له: «يامعلم، نعلم أنك جئت من الله معلما، لأنه لا يقدر أحد أن يعمل ما تعمل من آيات إلا إذا كان الله معه»."], [3, "فأجابه يسوع: «الحق الحق أقول لك: لا أحد يمكنه أن يرى ملكوت الله إلا إذا ولد من جديد»."], [4, "فسأله نيقوديموس: «كيف يمكن الإنسان أن يولد وهو كبير السن؟ ألعله يستطيع أن يدخل بطن أمه ثانية ثم يولد؟»"], [5, "أجابه يسوع: «الحق الحق أقول لك: لا يمكن أن يدخل أحد ملكوت الله إلا إذا ولد من الماء والروح."], [6, "فالمولود من الجسد هو جسد، والمولود من الروح هو روح."]]}, {"l": "Rom 5:12-19", "n": "", "vs": [[12, "ولهذا، فكما دخلت الخطيئة إلى العالم على يد إنسان واحد، وبدخول الخطيئة دخل الموت، هكذا جاز الموت على جميع البشر، لأنهم جميعا أخطأوا."], [13, "فإن الخطيئة كانت منتشرة في العالم قبل مجيء الشريعة. إلا أن الخطيئة ما كانت تسجل، لأن الشريعة لم تكن موجودة."], [14, "أما الموت، فقد ملك منذ آدم إلى موسى، حتى على الذين لم يرتكبوا خطيئة شبيهة بمخالفة آدم، الذي هو رمز للآتي بعده."], [15, "ولكن مفعول المعصية ليس كمفعول النعمة! فإذا كان الكثيرون بمعصية إنسان واحد قد ماتوا، فكم بالأحرى في الإنسان الواحد يسوع المسيح تتوافر للكثيرين نعمة الله والعطية المجانية بالنعمة."], [16, "ثم إن أثر خطيئة إنسان واحد ليس كأثر الهبة! فإن الحكم من جراء معصية واحدة يؤدي إلى الدينونة. وأما فعل النعمة، من جراء معاص كثيرة، فيؤدي إلى التبرير."], [17, "فما دام الموت بمعصية الإنسان الواحد، قد ملك بذلك الواحد، فكم بالأحرى يملك في الحياة بيسوع المسيح الواحد أولئك الذين ينالون فيض النعمة وعطية البر المجانية."], [18, "فإذن، كما أن معصية واحدة جلبت الدينونة على جميع البشر، كذلك فإن برا واحدا يجلب التبرير المؤدي إلى الحياة لجميع البشر."], [19, "فكما أنه بعصيان الإنسان الواحد جعل الكثيرون خاطئين، فكذلك أيضا بطاعة الواحد سيجعل الكثيرون أبرارا."]]}, {"l": "Rom 7:18", "n": "", "vs": [[18, "لأنني أعلم أنه في، أي في جسدي، لا يسكن الصلاح: فأن أريد الصلاح ذلك متوفر لدي؛ وأما أن أفعله، فذلك لا أستطيعه."]]}, {"l": "Gal 2:15", "n": "", "vs": [[15, "نحن يهود بالولادة، ولسنا أمما خاطئين."]]}, {"l": "Gal 2:16", "n": "", "vs": [[16, "ولكننا، إذ علمنا أن الإنسان لا يتبرر على أساس الأعمال المطلوبة في الشريعة بل فقط بالإيمان بيسوع المسيح، آمنا نحن أيضا بالمسيح يسوع، لنتبرر على أساس الإيمان به، لا على أساس أعمال الشريعة، لأنه على أعمال الشريعة لا يبرر أي إنسان."]]}], "kwAr": "بالطبيعة", "noteAr": ""}, {"kw": "children", "raw": "Eph_2:2; Rom_9:22", "note": "", "refs": [{"l": "Eph 2:2", "n": "", "vs": [[2, "التي كنتم تسلكون فيها حسب مسرى هذا العالم، تابعين رئيس قوات الهواء، ذلك الروح العامل الآن في أبناء العصيان،"]]}, {"l": "Rom 9:22", "n": "", "vs": [[22, "فماذا إذا إن كان الله ، وقد شاء أن يظهر غضبه ويعلن قدرته، احتمل بكل صبر أوعية غضب جاهزة للهلاك،"]]}], "kwAr": "أولاد الغضب", "noteAr": ""}, {"kw": "even", "raw": "Rom_3:9, Rom_3:22, Rom_3:23; 1Co_4:7", "note": "", "refs": [{"l": "Rom 3:9", "n": "", "vs": [[9, "فماذا إذن؟ أنحن اليهود أفضل؟ لا، على الإطلاق! فإننا، في ما سبق، قد اتهمنا اليهود واليونانيين بكونهم جميعا تحت الخطيئة،"]]}, {"l": "Rom 3:22", "n": "", "vs": [[22, "ذلك البر الذي يمنحه الله على أساس الإيمان بيسوع المسيح لجميع الذين يؤمنون. إذ لا فرق،"]]}, {"l": "Rom 3:23", "n": "", "vs": [[23, "لأن الجميع قد أخطأوا وهم عاجزون عن بلوغ ما يمجد الله ."]]}, {"l": "1Co 4:7", "n": "", "vs": [[7, "فمن جعلك متميزا عن غيرك؟ وأي شيء مما لك لم تكن قد أخذته هبة؟ ومادمت قد أخذت، فلماذا تتباهى كأنك لم تأخذ؟"]]}], "kwAr": "كالآخرين أيضا", "noteAr": ""}], "arS": [["الذين بينهم ", []], ["نحن", ["G2249"]], [" أيضا كنا ", []], ["نسلك", ["G390"]], [" ", []], ["سابقا", ["G4218"]], [" في ", []], ["شهوات", ["G1939"]], [" ", []], ["جسدنا", ["G4561", "G2257"]], ["، ", []], ["عاملين", ["G4160"]], [" ما ", []], ["يريده", ["G2307"]], [" ", []], ["الجسد", ["G4561"]], [" ", []], ["والأفكار", ["G1271"]], ["، وكنا ", []], ["بالطبيعة", ["G5449"]], [" ", []], ["أولاد", ["G5043"]], [" ", []], ["الغضب", ["G3709"]], [" ", []], ["كالآخرين", ["G3062"]], [" أيضا.", []]]}, {"c": 2, "v": 4, "text": "أما الله ، وهو غني في الرحمة، فبسبب محبته العظيمة التي أحبنا بها،", "groups": [{"kw": "who", "raw": "Eph_2:7, Eph_1:7, Eph_3:8; Exo_33:19, Exo_34:6, Exo_34:7; Neh_9:17; Psa_51:1, Psa_86:5, Psa_86:15, Psa_103:8-11; Psa_145:8; Isa_55:6-8; Dan_9:9; Jon_4:2; Mic_7:18-20; Luk_1:78; Rom_2:4; Rom_5:20,Rom_5:21, Rom_9:23, Rom_10:12; 1Ti_1:14; 1Pe_1:3", "note": "", "refs": [{"l": "Eph 2:7", "n": "", "vs": [[7, "وذلك كي يعرض في الدهور القادمة غنى نعمته الفائق في لطفه علينا في المسيح يسوع."]]}, {"l": "Eph 1:7", "n": "", "vs": [[7, "ففيه لنا بدمه الفداء، أي غفران الخطايا؛ بحسب غنى نعمته"]]}, {"l": "Eph 3:8", "n": "", "vs": [[8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "Exo 33:19", "n": "", "vs": [[19, "فقال الرب: «أجيز إحساناتي أمامك، وأذيع اسمي (الرب) أمامك. أغدق رأفتي على من أشاء ورحمتي على من أريد»،"]]}, {"l": "Exo 34:6", "n": "", "vs": [[6, "وعبر من أمام موسى مناديا: «أنا الرب. الرب إله رؤوف رحيم، بطيء الغضب وكثير الإحسان والوفاء."]]}, {"l": "Exo 34:7", "n": "", "vs": [[7, "أدخر الإحسان وأغفر الإثم والمعصية والخطيئة. ولكني لا أعفي المذنب من العقاب، بل أفتقد إثم الآباء في الأبناء والأحفاد حتى الجيل الرابع»."]]}, {"l": "Neh 9:17", "n": "", "vs": [[17, "وأبوا أن يسمعوا، وتجاهلوا عجائبك التي أجريتها لهم، وأغلظوا قلوبهم، ثم تمردوا ونصبوا عليهم قائدا ليرجعوا إلى عبوديتهم، ولكنك إله غفور وحنان ورحيم وحكيم وكثير الإحسان، فلم تتخل عنهم،"]]}, {"l": "Psa 51:1", "n": "", "vs": [[1, "ارحمني ياالله حسب رحمتك، وامح معاصي حسب كثرة رأفتك."]]}, {"l": "Psa 86:5", "n": "", "vs": [[5, "لأنك أنت يارب طيب وغفور، وكثير الرحمة لجميع الذين يدعونك."]]}, {"l": "Psa 86:15", "n": "", "vs": [[15, "إنما أنت يارب إله رحيم ورؤوف وبطيء الغضب ووافر الرحمة والحق."]]}, {"l": "Psa 103:8-11", "n": "", "vs": [[8, "الرب رحيم ورؤوف، بطيء الغضب ووافر الرحمة."], [9, "لا يسخط إلى الأبد ولا يحقد إلى الدهر."], [10, "لم يعاملنا حسب خطايانا ولم يجازنا حسب آثامنا."], [11, "مثل ارتفاع السماوات فوق الأرض، تعاظمت رحمته على متقيه."]]}, {"l": "Psa 145:8", "n": "", "vs": [[8, "الرب حنان ورحيم، بطيء الغضب ووافر الرأفة."]]}, {"l": "Isa 55:6-8", "n": "", "vs": [[6, "اطلبوا الرب مادام موجودا، ادعوه وهو قريب."], [7, "ليترك الشرير طريقه والأثيم أفكاره، وليتب إلى الرب فيرحمه، وليرجع إلى إلهنا لأنه يكثر الغفران."], [8, "لأن أفكاري ليست مماثلة لأفكاركم، ولا طرقكم مثل طرقي، يقول الرب."]]}, {"l": "Dan 9:9", "n": "", "vs": [[9, "إنما للرب إلهنا الرحمة والمغفرة لأننا عصيناك."]]}, {"l": "Jon 4:2", "n": "", "vs": [[2, "وصلى إلى الرب قائلا: «أيها الرب، أليس هذا ما قلته عندما كنت في بلادي؟ لهذا أسرعت إلى الهرب إلى ترشيش، لأني عرفت أنك إله رحيم رؤوف بطيء الغضب كثير الإحسان، ترجع عن العقاب."]]}, {"l": "Mic 7:18-20", "n": "", "vs": [[18, "إي إله مثلك يصفح عن الإثم ويعفو عن معصية بقية ميراثه؟ لا يحتفظ إلى الأبد بغضبه لأنه يسر بالرحمة."], [19, "يعود يرحمنا ويطأ ذنوبنا بقدميه، ويطرح معاصينا إلى أعماق البحر."], [20, "أنت تبدي أمانة لذرية يعقوب، ورحمة لنسل إبراهيم، كما حلفت لأجدادنا منذ القدم."]]}, {"l": "Luk 1:78", "n": "", "vs": [[78, "بفضل عواطف الرحمة لدى إلهنا، تلك التي تفقدنا بها الفجر المشرق من العلاء،"]]}, {"l": "Rom 2:4", "n": "", "vs": [[4, "أم أنك تحتقر غنى لطفه وصبره وطول أناته وأنت لا تعرف أن لطف الله يدفعك إلى التوبة؟"]]}, {"l": "Rom 5:20", "n": "", "vs": [[20, "وأما الشريعة فقد أدخلت لتظهر كثرة المعصية. ولكن، حيث كثرت الخطيئة، تتوافر النعمة أكثر جدا،"]]}, {"l": "Rom 5:21", "n": "", "vs": [[21, "حتى إنه كما ملكت الخطيئة بالموت، فكذلك أيضا تملك النعمة على أساس البر مؤدية إلى الحياة الأبدية بيسوع المسيح ربنا."]]}, {"l": "Rom 9:23", "n": "", "vs": [[23, "وذلك بقصد أن يعلن غنى مجده في أوعية الرحمة التي سبق فأعدها للمجد،"]]}, {"l": "Rom 10:12", "n": "", "vs": [[12, "فلا فرق بين اليهودي واليوناني، لأن للجميع ربا واحدا، غنيا تجاه كل من يدعوه»."]]}, {"l": "1Ti 1:14", "n": "", "vs": [[14, "إلا أن نعمة ربنا قد فاضت علي فوق كل حد، ومعها الإيمان والمحبة، وذلك في المسيح يسوع."]]}, {"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}], "kwAr": "وهو غني في الرحمة", "noteAr": ""}, {"kw": "his", "raw": "Deu_7:7, Deu_7:8, Deu_9:5, Deu_9:6; Jer_31:3; Eze_16:6-8; Joh_3:14-17; Rom_5:8, Rom_9:15, Rom_9:16; 2Th_2:13; 2Ti_1:9; Tit_3:4-7; 1Jo_4:10-19", "note": "", "refs": [{"l": "Deu 7:7", "n": "", "vs": [[7, "ولم يفضلكم الرب ويتخيركم لأنكم أكثر عددا من سائر الشعوب، فأنتم أقل الأمم عددا."]]}, {"l": "Deu 7:8", "n": "", "vs": [[8, "بل من محبته، وحفاظا على القسم الذي أقسم به لآبائكم، أخرجكم بقوة فائقة، وفداكم من نير عبودية فرعون ملك مصر."]]}, {"l": "Deu 9:5", "n": "", "vs": [[5, "إذ ليس بفضل صلاحكم واستقامتكم تدخلون لامتلاك أرضهم، إنما من أجل إثمهم يطردهم الرب إلهكم من أمامكم وفاء بوعده الذي أقسم عليه لآبائكم إبراهيم وإسحق ويعقوب."]]}, {"l": "Deu 9:6", "n": "", "vs": [[6, "فاعلموا أنه ليس بفضل صلاحكم يهبكم الرب إلهكم هذه الأرض الخصيبة لامتلاكها، لأنكم شعب عنيد."]]}, {"l": "Jer 31:3", "n": "", "vs": [[3, "ظهر لي الرب قائلا: «أحببتكم حبا أبديا، لذلك اجتذبتكم إلي برحمة."]]}, {"l": "Eze 16:6-8", "n": "", "vs": [[6, "وحين مررت بك وشهدتك مازلت ملطخة بدمائك قلت لك: عيشي بدمك. نعم عيشي بدمك."], [7, "وكثرتك كنبت الحقل، فنميت وكبرت وبلغت عمرا صرت فيه أجمل الجميلات، فنهد ثدياك ونما شعرك، ولكنك كنت عارية متجردة."], [8, "فمررت بك ورأيتك وإذا بك قد بلغت سن الحب، فبسطت عليك أطراف ثوبي، وسترت عورتك وحلفت لك وأبرمت معك عهدا، فصرت لي، يقول السيد الرب."]]}, {"l": "Joh 3:14-17", "n": "", "vs": [[14, "وكما علق موسى الحية في البر ية، فكذلك لا بد من أن يعلق ابن الإنسان،"], [15, "لتكون الحياة الأبدية لكل من يؤمن به."], [16, "لأنه هكذا أحب الله العالم حتى بذل ابنه الوحيد، لكي لا يهلك كل من يؤمن به، بل تكون له الحياة الأبدية."], [17, "فإن الله لم يرسل ابنه إلى العالم ليدين العالم، بل ليخلص العالم به،"]]}, {"l": "Rom 5:8", "n": "", "vs": [[8, "ولكن الله أثبت لنا محبته، إذ ونحن مازلنا خاطئين مات المسيح عوضا عنا."]]}, {"l": "Rom 9:15", "n": "", "vs": [[15, "فإنه يقول لموسى: «إني أرحم من أرحمه، وأشفق على من أشفق عليه!»"]]}, {"l": "Rom 9:16", "n": "", "vs": [[16, "إذا، لا يتعلق الأمر برغبة الإنسان ولا بسعيه، وإنما برحمة الله فقط."]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،"]]}, {"l": "Tit 3:4-7", "n": "", "vs": [[4, "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،"], [5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"], [6, "الذي سكبه علينا بغنى بيسوع المسيح مخلصنا."], [7, "حتى إذا تبررنا بنعمته، نصير ورثة، وفقا لرجائنا بالحياة الأبدية."]]}, {"l": "1Jo 4:10-19", "n": "", "vs": [[10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."], [11, "ومادام الله قد أحبنا هذه المحبة العظيمة، أيها الأحباء، فعلينا نحن أيضا أن نحب بعضنا بعضا."], [12, "إن الله لم يره أحد من الناس قط. ولكن، حين نحب بعضنا بعضا، نبين أن الله يحيا في داخلنا، وأن محبته قد اكتملت في داخلنا."], [13, "وما يؤكد لنا أننا نثبت في الله، وأنه يثبت فينا هو أنه وهب لنا من روحه."], [14, "ونحن أنفسنا نشهد أن الآب قد أرسل الابن مخلصا للعالم، لأننا رأيناه بعيوننا."], [15, "من يعترف بأن يسوع هو ابن الله، فإن الله يثبت فيه، وهو يثبت في الله،"], [16, "ونحن أنفسنا اختبرنا المحبة التي خصنا الله بها، ووضعنا ثقتنا فيها. إن الله محبة. ومن يثبت في المحبة، فإنه يثبت في الله، والله يثبت فيه."], [17, "وتكون محبة الله قد اكتملت في داخلنا حين تولد فينا ثقة كاملة من جهة يوم الدينونة: لأنه كما المسيح، هكذا نحن أيضا في هذا العالم."], [18, "ليس في المحبة أي خوف. بل المحبة الكاملة تطرد الخوف خارجا. فإن الخوف يأتي من العقاب. والخائف لا تكون محبة الله قد اكتملت فيه."], [19, "ونحن نحب، لأن الله أحبنا أولا."]]}], "kwAr": "محبته العظيمة", "noteAr": ""}], "arS": [["أما ", []], ["الله", ["G2316"]], [" ، وهو ", []], ["غني", ["G4145"]], [" في ", []], ["الرحمة", ["G1656"]], ["، فبسبب ", []], ["محبته", ["G26"]], [" ", []], ["العظيمة", ["G4183"]], [" التي ", []], ["أحبنا", ["G25", "G2248"]], [" بها،", []]]}, {"c": 2, "v": 5, "text": "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،", "groups": [{"kw": "dead", "raw": "Eph_2:1; Rom_5:6, Rom_5:8, Rom_5:10", "note": "", "refs": [{"l": "Eph 2:1", "n": "", "vs": [[1, "وأنتم كنتم في السابق أمواتا بذنوبكم وخطاياكم،"]]}, {"l": "Rom 5:6", "n": "", "vs": [[6, "فإنه ونحن بعد عاجزون، مات المسيح عن العصاة في الوقت المعين."]]}, {"l": "Rom 5:8", "n": "", "vs": [[8, "ولكن الله أثبت لنا محبته، إذ ونحن مازلنا خاطئين مات المسيح عوضا عنا."]]}, {"l": "Rom 5:10", "n": "", "vs": [[10, "فإن كنا، ونحن أعداء، قد تصالحنا مع الله بموت ابنه، فكم بالأحرى نخلص بحياته ونحن مصالحون!"]]}], "kwAr": "أمواتا بالذنوب", "noteAr": ""}, {"kw": "quickened", "raw": "Eph_2:1, Eph_5:14; Joh_5:21, Joh_6:63; Rom_8:2", "note": "", "refs": [{"l": "Eph 2:1", "n": "", "vs": [[1, "وأنتم كنتم في السابق أمواتا بذنوبكم وخطاياكم،"]]}, {"l": "Eph 5:14", "n": "", "vs": [[14, "لأن الذي يكشف كل شيء هو النور. لذلك يقال: «استيقظ أيها النائم، وقم من بين الأموات، فيشرق عليك نور المسيح!»"]]}, {"l": "Joh 5:21", "n": "", "vs": [[21, "فكما يقيم الآب الموتى ويحييهم، كذلك يحيي الابن من يشاء."]]}, {"l": "Joh 6:63", "n": "", "vs": [[63, "الروح هو الذي يعطي الحياة، أما الجسد فلا يفيد شيئا. الكلام الذي كلمتكم به هو روح وحيا ة."]]}, {"l": "Rom 8:2", "n": "", "vs": [[2, "لأن ناموس روح الحياة في المسيح يسوع قد حررني من ناموس الخطيئة ومن الموت."]]}], "kwAr": "أحيانا مع المسيح", "noteAr": ""}, {"kw": "grace ye", "raw": "Gr. whose grace ye, Eph_2:8; Act_15:11; Rom_3:24, Rom_4:16, Rom_11:5, Rom_11:6, Rom_16:20; 2Co_13:14; Tit_2:11, Tit_3:5; Rev_22:21", "note": "Gr. whose grace ye, Eph_2:8; Act_15:11; Rom_3:24, Rom_4:16, Rom_11:5, Rom_11:6, Rom_16:20; 2Co_13:14; Tit_2:11, Tit_3:5; Rev_22:21", "refs": [{"l": "Eph 2:8", "n": "", "vs": [[8, "فإنكم بالنعمة مخلصون، بالإيمان، وهذا ليس منكم. إنه هبة من الله،"]]}, {"l": "Act 15:11", "n": "", "vs": [[11, "فنحن نؤمن بأننا نخلص، كما يخلصون هم، بنعمة الرب يسوع."]]}, {"l": "Rom 3:24", "n": "", "vs": [[24, "فهم يبررون مجانا، بنعمته، بالفداء بالمسيح يسوع"]]}, {"l": "Rom 4:16", "n": "", "vs": [[16, "لذلك، فإن الوعد هو على أساس الإيمان ليكون بحسب النعمة، بقصد أن يكون مضمونا للنسل كله: ليس لأهل الشريعة وحدهم، بل أيضا لأهل الإيمان الذي كان لإبراهيم. فإنه أب لنا جميعا،"]]}, {"l": "Rom 11:5", "n": "", "vs": [[5, "فكذلك، في الزمان الحاضر، ماتزال بقية اختارها الله بالنعمة."]]}, {"l": "Rom 11:6", "n": "", "vs": [[6, "ولكن، بما أن ذلك قد تم بالنعمة، فليس بعد على أساس الأعمال، وإلا فليست النعمة نعمة بعد."]]}, {"l": "Rom 16:20", "n": "", "vs": [[20, "وإله السلام سيسحق الشيطان تحت أقدامكم سريعا. لتكن نعمة ربنا يسوع المسيح معكم."]]}, {"l": "2Co 13:14", "n": "", "vs": [[14, "ولتكن معكم جميعا نعمة ربنا يسوع المسيح، ومحبة الله، وشركة الروح القدس. آمين!"]]}, {"l": "Tit 2:11", "n": "", "vs": [[11, "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت."]]}, {"l": "Tit 3:5", "n": "", "vs": [[5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"]]}, {"l": "Rev 22:21", "n": "", "vs": [[21, "ولتكن نعمة ربنا يسوع المسيح معكم جميعا."]]}], "kwAr": "بالنعمة أنتم مخلصون", "noteAr": "في اليونانية: بنعمته أنتم (مخلّصون)."}], "arS": [["وإذ كنا نحن أيضا ", []], ["أمواتا", ["G3498"]], [" ", []], ["بالذنوب", ["G3900"]], ["، ", []], ["أحيانا مع", ["G4806"]], [" ", []], ["المسيح", ["G5547"]], ["، إنما ", []], ["بالنعمة", ["G5485"]], [" أنتم ", []], ["مخلصون", ["G4982"]], ["،", []]]}, {"c": 2, "v": 6, "text": "وأقامنا معه وأجلسنا معه في الأماكن السماوية في المسيح يسوع.", "groups": [{"kw": "hath", "raw": "Eph_1:19, Eph_1:20; Rom_6:4, Rom_6:5; Col_1:18, Col_2:12, Col_2:13, Col_3:1-3", "note": "", "refs": [{"l": "Eph 1:19", "n": "", "vs": [[19, "وما هي عظمة قدرته الفائقة المعلنة لنا نحن المؤمنين، بحسب عمل اقتدار قوته"]]}, {"l": "Eph 1:20", "n": "", "vs": [[20, "الذي عمله في المسيح، بإقامته له من بين الأموات. وقد أجلسه عن يمينه في الأماكن السماوية،"]]}, {"l": "Rom 6:4", "n": "", "vs": [[4, "وبسبب ذلك دفنا معه بالمعمودية للموت، حتى كما أقيم المسيح من الأموات بمجد الآب، كذلك نسلك نحن أيضا في حياة جديدة."]]}, {"l": "Rom 6:5", "n": "", "vs": [[5, "فما دمنا قد اتحدنا به في ما يشبه موته، فإننا سنتحد به أيضا في قيامته."]]}, {"l": "Col 1:18", "n": "", "vs": [[18, "وهو رأس الجسد، أي الكنيسة؛ هو البداءة وبكر القائمين من بين الأموات، ليكون له المقام الأول في كل شيء."]]}, {"l": "Col 2:12", "n": "", "vs": [[12, "فقد دفنتم معه في المعمودية، وفيها أيضا أقمتم معه، عن طريق إيمانكم بقدرة الله الذي أقامه من بين الأموات."]]}, {"l": "Col 2:13", "n": "", "vs": [[13, "فأنتم، إذ كنتم أمواتا في الخطايا وعدم ختانكم الجسدي، أحياكم جميعا معه؛ مسامحا لنا جميعا بالخطايا كلها."]]}, {"l": "Col 3:1-3", "n": "", "vs": [[1, "فبما أنكم قد قمتم مع المسيح، فاسعوا إلى الأمور التي في العلى، حيث المسيح جالس عن يمين الله."], [2, "احصروا اهتمامكم بالأمور التي في العلى، لا بالأمور الأرضية."], [3, "فإنكم قد متم، وحياتكم مستورة مع المسيح في الله."]]}], "kwAr": "وأقامنا معه", "noteAr": ""}, {"kw": "sit", "raw": "Mat_26:29; Luk_12:37, Luk_22:29, Luk_22:30; Joh_12:26, Joh_14:3, Joh_17:21-26; Rev_3:20,Rev_3:21", "note": "", "refs": [{"l": "Mat 26:29", "n": "", "vs": [[29, "على أني أقول لكم: إني لا أشرب بعد اليوم من نتاج الكرمة هذا حتى يأتي اليوم الذي فيه أشربه معكم جديدا في ملكوت أبي»."]]}, {"l": "Luk 12:37", "n": "", "vs": [[37, "طوبى لأولئك العبيد الذين يجدهم سيدهم لدى عودته ساهرين. الحق أقول لكم: إنه يشد وسطه بالحزام ويجعلهم يتكئون ويقوم يخدمهم."]]}, {"l": "Luk 22:29", "n": "", "vs": [[29, "وأنا أعين لكم، كما عين لي أبي، ملكوتا،"]]}, {"l": "Luk 22:30", "n": "", "vs": [[30, "لكي تأكلوا وتشربوا على مائدتي في ملكوتي، وتجلسوا على عروش تدينون أسباط إسرائيل الاثني عشر."]]}, {"l": "Joh 12:26", "n": "", "vs": [[26, "من أراد أن يخدمني فليتبعني. وحيث أكون أنا يكون خادمي أيضا. وكل من يخدمني يكرمه أبي."]]}, {"l": "Joh 14:3", "n": "", "vs": [[3, "وبعدما أذهب وأعد لكم المكان أعود إليكم وآخذكم إلي، لتكونوا حيث أكون أنا."]]}, {"l": "Joh 17:21-26", "n": "", "vs": [[21, "ليكون الجميع واحدا؛ أيها الآب، كما أنك أنت في وأنا فيك، ليكونوا هم أيضا واحدا فينا، لكي يؤمن العالم أنك أنت أرسلتني."], [22, "إني أعطيتهم المجد الذي أعطيتني، ليكونوا واحدا كما نحن واحد."], [23, "أنا فيهم، وأنت في، ليكتملوا فيصيروا واحدا، حتى يعرف العالم أنك أرسلتني وأنك أحببتهم كما أحببتني."], [24, "أيها الآب، أريد لهؤلاء الذين وهبتهم لي أن يكونوا معي حيث أكون أنا، فيشاهدوا مجدي الذي أعطيتني، لأنك أحببتني قبل إنشاء العالم."], [25, "أيها الآب البار، إن العالم لم يعرفك، أما أنا فعرفتك، وهؤلاء عرفوا أنك أنت أرسلتني،"], [26, "وقد عرفتهم اسمك، وسأعرفهم أيضا، لتكون فيهم المحبة التي أحببتني بها، وأكون أنا فيهم»."]]}, {"l": "Rev 3:20", "n": "", "vs": [[20, "ها أنا واقف خارج الباب أقرعه. إن سمع أحد صوتي وفتح الباب، أدخل إليه فأتعشى معه وهو معي."]]}, {"l": "Rev 3:21", "n": "", "vs": [[21, "وكل من ينتصر سأجلسه معي على عرشي، كما انتصرت أنا أيضا فجلست مع أبي على عرشه؛"]]}], "kwAr": "وأجلسنا معه", "noteAr": ""}, {"kw": "in", "raw": "Eph_1:3", "note": "", "refs": [{"l": "Eph 1:3", "n": "", "vs": [[3, "تبارك الله ، أبو ربنا يسوع المسيح الذي باركنا بكل بركة روحية في الأماكن السماوية."]]}], "kwAr": "في الأماكن السماوية", "noteAr": ""}], "arS": [["وأقامنا معه", ["G4891"]], [" ", []], ["وأجلسنا معه", ["G4776"]], [" في الأماكن ", []], ["السماوية", ["G2032"]], [" في ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [".", []]]}, {"c": 2, "v": 7, "text": "وذلك كي يعرض في الدهور القادمة غنى نعمته الفائق في لطفه علينا في المسيح يسوع.", "groups": [{"kw": "in the", "raw": "Eph_3:5, Eph_3:21; Psa_41:13, Psa_106:48; Isa_60:15; 1Ti_1:17", "note": "", "refs": [{"l": "Eph 3:5", "n": "", "vs": [[5, "ذلك السر الذي لم يطلع عليه بنو البشر في الأجيال الماضية مثلما أعلن الآن بوحي الروح لرسله القديسين وأنبيائه:"]]}, {"l": "Eph 3:21", "n": "", "vs": [[21, "له المجد في الكنيسة، في المسيح يسوع، مدى الأجيال والدهور! آمين …"]]}, {"l": "Psa 41:13", "n": "", "vs": [[13, "تبارك الرب إله إسرائيل، من الأزل وإلى الأبد. آمين فآمين."]]}, {"l": "Psa 106:48", "n": "", "vs": [[48, "مبارك الرب إله إسرائيل من الأزل إلى الأبد. وليقل الشعب كله: آمين. هللويا."]]}, {"l": "Isa 60:15", "n": "", "vs": [[15, "وبعد أن كنت مهجورة ممقوتة لا يعبر بك أحد، سأجعلك بهية إلى الأبد، وفرح كل الأجيال،"]]}, {"l": "1Ti 1:17", "n": "", "vs": [[17, "فللملك الأزلي، الله الواحد غير المنظور وغير الفاني، الكرامة والمجد إلى أبد الآبدين. آمين!"]]}], "kwAr": "في الدهور القادمة", "noteAr": ""}, {"kw": "show", "raw": "Eph_2:4; 2Th_1:12; 1Ti_1:16; 1Pe_1:12; Rev_5:9-14", "note": "", "refs": [{"l": "Eph 2:4", "n": "", "vs": [[4, "أما الله ، وهو غني في الرحمة، فبسبب محبته العظيمة التي أحبنا بها،"]]}, {"l": "2Th 1:12", "n": "", "vs": [[12, "حتى يتمجد اسم ربنا يسوع فيكم وتتمجدوا أنتم فيه وفقا لنعمة إلهنا وربنا يسوع المسيح."]]}, {"l": "1Ti 1:16", "n": "", "vs": [[16, "ولكن لهذا السبب عوملت بالرحمة، ليجعل يسوع المسيح مني، أنا أولا، مثالا يظهر صبره الطويل، لجميع الذين سيؤمنون به لنوال الحياة الأبدية."]]}, {"l": "1Pe 1:12", "n": "", "vs": [[12, "ولكن الله أوحى إليهم أن اجتهادهم لم يكن لمصلحتهم هم، بل لمصلحتكم أنتم. فقد كان ذلك من أجل البشارة التي نقلها إليكم في الزمان الحاضر مبشرون يؤيدهم الروح القدس المرسل من السماء. ويالها من أمور يتمنى حتى الملائكة أن يطلعوا عليها!"]]}, {"l": "Rev 5:9-14", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"], [10, "وجعلتهم مملكة لإلهنا وكهنة له، وسيملكون على الأرض»."], [11, "ثم نظرت، فسمعت ترتيل الملايين من الملائكة وهي تحيط بالعرش وبالكائنات الحية والشيوخ،"], [12, "وهم يهتفون بصوت عال: «مستحق هو الحمل المذبوح أن ينال القدرة والغنى والحكمة والقوة والإجلال والمجد والبركة»."], [13, "ثم سمعت كل خليقة في السماء وعلى الأرض، وتحت الأرض، وعلى البحر، هاتفة مع كل ما فيها: «البركة والإجلال والمجد والسلطة للجالس على العرش وللحمل، إلى أبد الآبدين»."], [14, "فردت الكائنات الحية الأربعة: «آمين!» وجثا الشيوخ ساجدين."]]}], "kwAr": "كي يعرض", "noteAr": ""}, {"kw": "in his", "raw": "Tit_3:4", "note": "", "refs": [{"l": "Tit 3:4", "n": "", "vs": [[4, "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،"]]}], "kwAr": "في لطفه علينا", "noteAr": ""}], "arS": [["وذلك كي ", []], ["يعرض", ["G1731"]], [" في ", []], ["الدهور", ["G165"]], [" ", []], ["القادمة", ["G1904"]], [" ", []], ["غنى", ["G4149"]], [" ", []], ["نعمته", ["G5485"]], [" ", []], ["الفائق", ["G5235"]], [" في ", []], ["لطفه", ["G5544"]], [" علينا في ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [".", []]]}, {"c": 2, "v": 8, "text": "فإنكم بالنعمة مخلصون، بالإيمان، وهذا ليس منكم. إنه هبة من الله،", "groups": [{"kw": "by", "raw": "Eph_2:5; Rom_3:24; 2Th_1:9", "note": "", "refs": [{"l": "Eph 2:5", "n": "", "vs": [[5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"]]}, {"l": "Rom 3:24", "n": "", "vs": [[24, "فهم يبررون مجانا، بنعمته، بالفداء بالمسيح يسوع"]]}, {"l": "2Th 1:9", "n": "", "vs": [[9, "فهؤلاء سيكابدون عقاب الهلاك الأبدي، بعيدا من حضرة الرب ومن مجد قوته،"]]}], "kwAr": "بالنعمة", "noteAr": ""}, {"kw": "through", "raw": "Mar_16:16; Luk_7:50; Joh_3:14-18, Joh_3:36, Joh_5:24, Joh_6:27-29, Joh_6:35, Joh_6:40; Act_13:39; Act_15:7-9, Act_16:31; Rom_3:22-26, Rom_4:5, Rom_4:16, Rom_10:9, Rom_10:10; Gal_3:14, Gal_3:22; 1Jo_5:10-12", "note": "", "refs": [{"l": "Mar 16:16", "n": "", "vs": [[16, "من آمن وتعمد، خلص، ومن لم يؤمن فسوف يدان."]]}, {"l": "Luk 7:50", "n": "", "vs": [[50, "وقال للمرأة: «إيمانك قد خلصك. اذهبي بسلام!»"]]}, {"l": "Joh 3:14-18", "n": "", "vs": [[14, "وكما علق موسى الحية في البر ية، فكذلك لا بد من أن يعلق ابن الإنسان،"], [15, "لتكون الحياة الأبدية لكل من يؤمن به."], [16, "لأنه هكذا أحب الله العالم حتى بذل ابنه الوحيد، لكي لا يهلك كل من يؤمن به، بل تكون له الحياة الأبدية."], [17, "فإن الله لم يرسل ابنه إلى العالم ليدين العالم، بل ليخلص العالم به،"], [18, "فالذي يؤمن به لا يدان، أما الذي لا يؤمن به فقد صدر عليه حكم الدينونة، لأنه لم يؤمن باسم ابن الله الوحيد."]]}, {"l": "Joh 3:36", "n": "", "vs": [[36, "من يؤمن بالابن، فله الحياة الأبدية. ومن يرفض أن يؤمن بالابن، فلن يرى الحياة. بل يستقر عليه غضب الله»."]]}, {"l": "Joh 5:24", "n": "", "vs": [[24, "الحق الحق أقول لكم إن من يسمع كلامي ويؤمن بالذي أرسلني تكون له الحياة الأبدية، ولا يحاكم في اليوم الأخير، لأنه قد انتقل من الموت إلى الحياة."]]}, {"l": "Joh 6:27-29", "n": "", "vs": [[27, "لا تسعوا وراء الطعام الفاني، بل وراء الطعام الباقي إلى الحياة الأبدية، والذي يعطيكم إياه ابن الإنسان، لأن هذا الطعام قد وضع الله الآب ختمه عليه»."], [28, "فسألوه: «ماذا نفعل لنعمل ما يطلبه الله ؟»"], [29, "أجاب يسوع: «العمل الذي يطلبه الله هو أن تؤمنوا بمن أرسله»."]]}, {"l": "Joh 6:35", "n": "", "vs": [[35, "فأجابهم يسوع: «أنا هو خبز الحياة. فالذي يقبل إلي لا يجوع، والذي يؤمن بي لا يعطش أبدا."]]}, {"l": "Joh 6:40", "n": "", "vs": [[40, "نعم! إن مشيئة أبي هي أن كل من يرى الابن ويؤمن به تكون له الحياة الأبدية، وسأقيمه أنا في اليوم الأخير»."]]}, {"l": "Act 13:39", "n": "", "vs": [[39, "وأنه به يتبرر كل من يؤمن من كل ما عجزت شريعة موسى أن تبرره منه."]]}, {"l": "Act 15:7-9", "n": "", "vs": [[7, "وبعد نقاش كثير، وقف بطرس وقال:"], [8, "وقد شهد الله العليم بما في القلوب على قبوله لهم إذ وهبهم الروح القدس كما وهبنا إياه."], [9, "فهو لم يفرق بيننا وبينهم في شيء، إذ طهر بالإيمان قلوبهم."]]}, {"l": "Act 16:31", "n": "", "vs": [[31, "فأجاباه: «آمن بالرب يسوع فتخلص أنت وأهل بيتك!»"]]}, {"l": "Rom 3:22-26", "n": "", "vs": [[22, "ذلك البر الذي يمنحه الله على أساس الإيمان بيسوع المسيح لجميع الذين يؤمنون. إذ لا فرق،"], [23, "لأن الجميع قد أخطأوا وهم عاجزون عن بلوغ ما يمجد الله ."], [24, "فهم يبررون مجانا، بنعمته، بالفداء بالمسيح يسوع"], [25, "الذي قدمه الله كفارة، عن طريق الإيمان، وذلك بدمه."], [26, "ليظهر بر الله إذ تغاضى، بإمهاله الإلهي، عن الخطايا التي حدثت في الماضي، ويظهر أيضا بره في الزمن الحاضر: فيتبين أنه بار وأنه يبرر من له الإيمان بيسوع."]]}, {"l": "Rom 4:5", "n": "", "vs": [[5, "وإنما يؤمن بمن يبرر الأثيم، فإن إيمانه يحسب له برا."]]}, {"l": "Rom 4:16", "n": "", "vs": [[16, "لذلك، فإن الوعد هو على أساس الإيمان ليكون بحسب النعمة، بقصد أن يكون مضمونا للنسل كله: ليس لأهل الشريعة وحدهم، بل أيضا لأهل الإيمان الذي كان لإبراهيم. فإنه أب لنا جميعا،"]]}, {"l": "Rom 10:9", "n": "", "vs": [[9, "أنك إن اعترفت بفمك بيسوع ربا، وآمنت في قلبك بأن الله أقامه من الأموات، نلت الخلاص."]]}, {"l": "Rom 10:10", "n": "", "vs": [[10, "فإن الإيمان في القلب يؤدي إلى البر، والاعتراف بالفم يؤيد الخلاص،"]]}, {"l": "Gal 3:14", "n": "", "vs": [[14, "لكي تصل بركة إبراهيم إلى الأمم في المسيح يسوع، فننال عن طريق الإيمان الروح الموعود."]]}, {"l": "Gal 3:22", "n": "", "vs": [[22, "ولكن الكتاب حبس الجميع تحت الخطيئة، حتى إن الوعد، على أساس الإيمان بيسوع المسيح، يوهب للذين يؤمنون."]]}, {"l": "1Jo 5:10-12", "n": "", "vs": [[10, "فمن يؤمن بابن الله، يثق في قلبه بصحة هذه الشهادة. أما من لا يصدق الله ، إذ يرفض تصديق الشهادة التي شهد بها لابنه، فهو يتهم الله بالكذب."], [11, "وهذه الشهادة هي أن الله أعطانا حياة أبدية، وأن هذه الحياة هي في ابنه."], [12, "فمن كان له ابن الله كانت له الحياة. ومن لم يكن له ابن الله، لم تكن له الحياة!"]]}], "kwAr": "بالإيمان", "noteAr": ""}, {"kw": "that", "raw": "Eph_2:10, Eph_1:19; Mat_16:17; Joh_1:12, Joh_1:13, Joh_6:37, Joh_6:44, Joh_6:65; Act_14:27, Act_16:14; Rom_10:14, Rom_10:17; Phi_1:29; Col_2:12; Jam_1:16-18", "note": "", "refs": [{"l": "Eph 2:10", "n": "", "vs": [[10, "فإننا نحن تحفة الله، وقد خلقنا في المسيح يسوع لأعمال صالحة أعدها سلفا لنسلك فيها."]]}, {"l": "Eph 1:19", "n": "", "vs": [[19, "وما هي عظمة قدرته الفائقة المعلنة لنا نحن المؤمنين، بحسب عمل اقتدار قوته"]]}, {"l": "Mat 16:17", "n": "", "vs": [[17, "فقال له يسوع: «طوبى لك ياسمعان بن يونا. فما أعلن لك هذا لحم ودم، بل أبي الذي في السماوات."]]}, {"l": "Joh 1:12", "n": "", "vs": [[12, "أما الذين قبلوه، أي الذين آمنوا باسمه، فقد منحهم الحق في أن يصيروا أولاد الله،"]]}, {"l": "Joh 1:13", "n": "", "vs": [[13, "وهم الذين ولدوا ليس من دم، ولا من رغبة جسد، ولا من رغبة بشر، بل من الله."]]}, {"l": "Joh 6:37", "n": "", "vs": [[37, "ولكن كل ما يهبه الآب لي سيأتي إلي، ومن يأت إلي لا أطرحه إلى الخارج أبدا،"]]}, {"l": "Joh 6:44", "n": "", "vs": [[44, "لا يقدر أحد أن يأتي إلي إلا إذا اجتذبه الآب الذي أرسلني. وأنا أقيمه في اليوم الأخير."]]}, {"l": "Joh 6:65", "n": "", "vs": [[65, "ثم قال: «لذلك قلت لكم: لا يقدر أحد أن يأتي إلي إلا إذا وهبه الآب ذلك»."]]}, {"l": "Act 14:27", "n": "", "vs": [[27, "ولما وصلا، استدعيا الكنيسة إلى الاجتماع، وأخبرا بكل ما فعل الله بواسطتهما، وبأنه فتح باب الإيمان لغير اليهود."]]}, {"l": "Act 16:14", "n": "", "vs": [[14, "ومن بينهن تاجرة أرجوان من مدينة ثياتيرا، متعبدة لله، اسمها ليدية، كانت تسمع ففتح الله قلبها لتقبل كلام بولس."]]}, {"l": "Rom 10:14", "n": "", "vs": [[14, "ولكن، كيف يدعون من لم يؤمنوا به؟ وكيف يؤمنون بمن لم يسمعوا به؟ وكيف يسمعون بلا مبشر؟"]]}, {"l": "Rom 10:17", "n": "", "vs": [[17, "إذا، الإيمان نتيجة السماع، والسماع هو من التبشير بكلمة المسيح !"]]}, {"l": "Phi 1:29", "n": "", "vs": [[29, "فقد وهب لكم، لأجل المسيح، لا أن تؤمنوا به وحسب، بل أيضا أن تتألموا لأجله،"]]}, {"l": "Col 2:12", "n": "", "vs": [[12, "فقد دفنتم معه في المعمودية، وفيها أيضا أقمتم معه، عن طريق إيمانكم بقدرة الله الذي أقامه من بين الأموات."]]}, {"l": "Jam 1:16-18", "n": "", "vs": [[16, "فيا إخوتي الأحباء، لا تضلوا:"], [17, "إن كل عطية صالحة وهبة كاملة إنما تنزل من فوق، من لدن أبي الأنوار الذي ليس فيه تحول، ولا ظل لأنه لا يدور."], [18, "وهو قد شاء أن يجعلنا أولادا له، فولدنا بكلمته، كلمة الحق. وغايته أن نكون باكورة خليقته."]]}], "kwAr": "وهذا ليس منكم", "noteAr": ""}], "arS": [["فإنكم ", []], ["بالنعمة", ["G5485"]], [" ", []], ["مخلصون", ["G4982"]], ["، ", []], ["بالإيمان", ["G4102"]], ["، ", []], ["وهذا", ["G5124"]], [" ليس منكم. إنه ", []], ["هبة", ["G1435"]], [" من ", []], ["الله", ["G2316"]], ["،", []]]}, {"c": 2, "v": 9, "text": "لا على أساس الأعمال، حتى لا يفتخر أحد.", "groups": [{"kw": "", "raw": "Rom_3:20,Rom_3:27, Rom_3:28, Rom_4:2, Rom_9:11, Rom_9:16, Rom_11:6; 1Co_1:29-31; 2Ti_1:9; Tit_3:3-5", "note": "", "refs": [{"l": "Rom 3:20", "n": "", "vs": [[20, "فإن أحدا من البشر لا يتبرر أمامه بالأعمال المطلوبة في الشريعة. إذ إن الشريعة هي لإظهار الخطيئة."]]}, {"l": "Rom 3:27", "n": "", "vs": [[27, "إذن، أين الافتخار؟ إنه قد أبطل! وعلى أي أساس؟ أعلى أساس الأعمال؟ لا، بل على أساس الإيمان،"]]}, {"l": "Rom 3:28", "n": "", "vs": [[28, "لأننا قد استنتجنا أن الإنسان يتبرر بالإيمان، بمعزل عن الأعمال المطلوبة في الشريعة."]]}, {"l": "Rom 4:2", "n": "", "vs": [[2, "فلو كان إبراهيم قد تبرر على أساس الأعمال، لكان من حقه أن يفتخر، ولكن ليس أمام الله."]]}, {"l": "Rom 9:11", "n": "", "vs": [[11, "ولم يكن الولدان قد ولدا بعد ولا فعلا خيرا أو شرا، وذلك كي يبقى قصد الله من جهة الاختيار"]]}, {"l": "Rom 9:16", "n": "", "vs": [[16, "إذا، لا يتعلق الأمر برغبة الإنسان ولا بسعيه، وإنما برحمة الله فقط."]]}, {"l": "Rom 11:6", "n": "", "vs": [[6, "ولكن، بما أن ذلك قد تم بالنعمة، فليس بعد على أساس الأعمال، وإلا فليست النعمة نعمة بعد."]]}, {"l": "1Co 1:29-31", "n": "", "vs": [[29, "حتى لا يفتخر أي بشر أمام الله."], [30, "وبفضل الله صار لكم مقام في المسيح يسوع الذي جعل لنا حكمة من الله وبرا وقداسة وفداء،"], [31, "حتى إن «من افتخر، فليفتخر بالرب»، على حد ما قد كتب."]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،"]]}, {"l": "Tit 3:3-5", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."], [4, "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،"], [5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"]]}], "kwAr": "", "noteAr": ""}], "arS": [["لا على أساس ", []], ["الأعمال", ["G2041"]], ["، حتى لا ", []], ["يفتخر", ["G2744"]], [" ", []], ["أحد", ["G5100"]], [".", []]]}, {"c": 2, "v": 10, "text": "فإننا نحن تحفة الله، وقد خلقنا في المسيح يسوع لأعمال صالحة أعدها سلفا لنسلك فيها.", "groups": [{"kw": "we are", "raw": "Deu_32:6; Psa_100:3, Psa_138:8; Isa_19:25, Isa_29:23, Isa_43:21, Isa_44:21, Isa_60:21, Isa_61:3; Jer_31:33, Jer_32:39, Jer_32:40; Joh_3:3-6, Joh_3:21; 1Co_3:9; 2Co_5:5, 2Co_5:17; Phi_1:6; Phi_2:13; Heb_13:21", "note": "", "refs": [{"l": "Deu 32:6", "n": "", "vs": [[6, "أبهذا تكافئون الرب أيها الشعب الأحمق الغبي؟ أليس هو أباكم وخالقكم الذي عملكم وكونكم؟"]]}, {"l": "Psa 100:3", "n": "", "vs": [[3, "اعلموا أن الرب هو الله . هو صنعنا ونحن له، نحن شعبه وقطيع مرعاه."]]}, {"l": "Psa 138:8", "n": "", "vs": [[8, "الرب ينجز مقاصده لي. رحمتك يارب إلى الأبد تدوم، فلا تتخل عني لأني صنع يديك."]]}, {"l": "Isa 19:25", "n": "", "vs": [[25, "فيباركهم الرب القدير قائلا: «مبارك شعبي مصر، وصنعة يدي أشور، وميراثي إسرائيل»."]]}, {"l": "Isa 29:23", "n": "", "vs": [[23, "لأنهم عندما يرون أبناءهم يتزايدون بفضلي، فإنهم يقدسون اسمي، ويقدسون قدوس يعقوب، ويرهبون إله إسرائيل،"]]}, {"l": "Isa 43:21", "n": "", "vs": [[21, "وجبلته لنفسي ليذيع حمدي."]]}, {"l": "Isa 44:21", "n": "", "vs": [[21, "اذكر هذه الأمور يايعقوب، لأنك أنت عبدي ياإسرائيل، قد جبلتك فأنت عبدي، وأنا لا أنساك ياإسرائيل."]]}, {"l": "Isa 60:21", "n": "", "vs": [[21, "ويكون شعبك جميعا أبرارا ويرثون الأرض إلى الأبد، فهم غصن غرسي وعمل يدي لأتمجد."]]}, {"l": "Isa 61:3", "n": "", "vs": [[3, "لأمنح نائحي صهيون تاج جمال بدل الرماد، ودهن السرور بدل النوح، ورداء تسبيح بدل الروح اليائسة، فيدعون أشجار البر وغرس الرب لكي يتمجد."]]}, {"l": "Jer 31:33", "n": "", "vs": [[33, "ولكن هذا هو العهد الذي أبرمه مع ذرية إسرائيل بعد تلك الأيام»، يقول الرب: «سأجعل شريعتي في دواخلهم، وأدونها على قلوبهم وأكون لهم إلها وهم يكونون لي شعبا."]]}, {"l": "Jer 32:39", "n": "", "vs": [[39, "وأعطيهم قلبا واحدا وطريقا واحدا ليتقوني كل الأيام، وذلك لخيرهم وخير أولادهم من بعدهم."]]}, {"l": "Jer 32:40", "n": "", "vs": [[40, "وأبرم معهم عهدا أبديا أن لا أكف عن الإحسان إليهم، وأضع تقواي في قلوبهم لئلا يرتدوا عني،"]]}, {"l": "Joh 3:3-6", "n": "", "vs": [[3, "فأجابه يسوع: «الحق الحق أقول لك: لا أحد يمكنه أن يرى ملكوت الله إلا إذا ولد من جديد»."], [4, "فسأله نيقوديموس: «كيف يمكن الإنسان أن يولد وهو كبير السن؟ ألعله يستطيع أن يدخل بطن أمه ثانية ثم يولد؟»"], [5, "أجابه يسوع: «الحق الحق أقول لك: لا يمكن أن يدخل أحد ملكوت الله إلا إذا ولد من الماء والروح."], [6, "فالمولود من الجسد هو جسد، والمولود من الروح هو روح."]]}, {"l": "Joh 3:21", "n": "", "vs": [[21, "وأما الذي يسلك في الحق فيأتي إلى النور لتظهر أعماله ويتبين أنها عملت بقوة الله»."]]}, {"l": "1Co 3:9", "n": "", "vs": [[9, "فإننا نحن جميعا عاملون معا عند الله، وأنتم حقل الله وبناء الله."]]}, {"l": "2Co 5:5", "n": "", "vs": [[5, "والذي أعدنا لهذا الأمر بعينه هو الله ، وقد أعطانا الروح عربونا أيضا."]]}, {"l": "2Co 5:17", "n": "", "vs": [[17, "فإنه إذا كان أحد في المسيح، فهو خليقة جديدة: إن الأشياء القديمة قد زالت، وها كل شيء قد صار جديدا."]]}, {"l": "Phi 1:6", "n": "", "vs": [[6, "ولي ثقة في هذا الأمر بالذات: أن الذي بدأ فيكم عملا صالحا سوف يتممه إلى يوم المسيح يسوع."]]}, {"l": "Phi 2:13", "n": "", "vs": [[13, "لأن الله هو الذي ينشيء فيكم الإرادة والعمل لأجل مرضاته."]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}], "kwAr": "نحن تحفة الله", "noteAr": ""}, {"kw": "created", "raw": "Eph_4:24; Psa_51:10; 2Co_5:17; Gal_6:15; Col_3:10", "note": "", "refs": [{"l": "Eph 4:24", "n": "", "vs": [[24, "وتلبسوا الإنسان الجديد المخلوق على مثال الله في البر والقداسة بالحق."]]}, {"l": "Psa 51:10", "n": "", "vs": [[10, "قلبا نقيا اخلق في ياالله وروحا مستقيما جدد في داخلي."]]}, {"l": "2Co 5:17", "n": "", "vs": [[17, "فإنه إذا كان أحد في المسيح، فهو خليقة جديدة: إن الأشياء القديمة قد زالت، وها كل شيء قد صار جديدا."]]}, {"l": "Gal 6:15", "n": "", "vs": [[15, "فليس الختان بشيء، ولا عدم الختان بشيء، وإنما (المهم أن يصير الإنسان) خليقة جديدة."]]}, {"l": "Col 3:10", "n": "", "vs": [[10, "ولبستم الجديد الذي يتجدد لبلوغ تمام المعرفة وفقا لصورة خالقه،"]]}], "kwAr": "خلقنا في المسيح يسوع", "noteAr": ""}, {"kw": "good", "raw": "Mat_5:16; Act_9:36; 2Co_9:8; Col_1:10; 2Th_2:17; 1Ti_2:10, 1Ti_5:10,1Ti_5:25; 1Ti_6:18; 2Ti_2:21, 2Ti_3:17; Tit_2:7, Tit_2:14, Tit_3:1, Tit_3:8, Tit_3:14; Heb_10:24, Heb_13:21; 1Pe_2:12", "note": "", "refs": [{"l": "Mat 5:16", "n": "", "vs": [[16, "هكذا، فليضيء نوركم أمام الناس، ليروا أعمالكم الحسنة ويمجدوا أباكم الذي في السماوات."]]}, {"l": "Act 9:36", "n": "", "vs": [[36, "وكان في مدينة يافا تلميذة اسمها طابيثا، ومعنى اسمها: غزالة، كان يشغلها دائما فعل الخير ومساعدة الفقراء."]]}, {"l": "2Co 9:8", "n": "", "vs": [[8, "والله قادر أن يجعل كل نعمة تفيض عليكم، حتى يكون لكم اكتفاء كلي في كل شيء وكل حين، فتفيضوا في كل عمل صالح؛"]]}, {"l": "Col 1:10", "n": "", "vs": [[10, "لكي تسلكوا سلوكا لائقا بالرب ومرضيا في كل شيء، منتجين الثمر في كل عمل صالح ونامين في معرفة الله إلى التمام،"]]}, {"l": "2Th 2:17", "n": "", "vs": [[17, "يشجع قلوبكم ويرسخكم في كل عمل صالح وقول حسن!"]]}, {"l": "1Ti 2:10", "n": "", "vs": [[10, "بل بما يليق بنساء يعترفن علنا بأنهن يعشن في تقوى الله، بالأعمال الصالحة!"]]}, {"l": "1Ti 5:10", "n": "", "vs": [[10, "ويكون مشهودا لها بالأعمال الصالحة، كأن تكون قد ربت الأولاد، وأضافت الغرباء، وغسلت أقدام القديسين، وأسعفت المتضايقين، ومارست كل عمل صالح!"]]}, {"l": "1Ti 5:25", "n": "", "vs": [[25, "وقياسا على ذلك، فإن الأعمال الصالحة تكون واضحة مسبقا؛ والأعمال التي ليست بصالحة، لا يمكن أن تظل مخفية."]]}, {"l": "1Ti 6:18", "n": "", "vs": [[18, "وأن يفعلوا خيرا، ويكونوا أغنياء بالأعمال الصالحة، ويوزعوا بسخاء، ويكونوا على استعداد دائم لإشراك الآخرين في خيراتهم."]]}, {"l": "2Ti 2:21", "n": "", "vs": [[21, "إذن الذي ينفصل عن هذه الأخيرة، مطهرا نفسه، يكون إناء للاستعمال الرفيع، مقدسا، نافعا لرب البيت، متأهبا لكل عمل صالح."]]}, {"l": "2Ti 3:17", "n": "", "vs": [[17, "لكي يجعل إنسان الله مؤهلا تأهيلا كاملا، ومجهزا لكل عمل صالح."]]}, {"l": "Tit 2:7", "n": "", "vs": [[7, "جاعلا من نفسك في كل شيء قدوة للأعمال الصالحة، مظهرا في تعليمك النقاوة والوقار"]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Tit 3:1", "n": "", "vs": [[1, "ذكر المؤمنين أن يخضعوا للحكام والسلطات، ويطيعوا القانون، ويكونوا مستعدين لكل عمل صالح،"]]}, {"l": "Tit 3:8", "n": "", "vs": [[8, "صادق هذا القول! وأريد أن تقرر هذه الأمور قرارا حاسما، حتى يهتم الذين آمنوا بالله بأن يجتهدوا في الأعمال الصالحة. هذه الأمور حسنة ونافعة للناس."]]}, {"l": "Tit 3:14", "n": "", "vs": [[14, "وليتعلم ذوونا أيضا أن يمارسوا أعمالا حسنة، لسد الحاجات الضرورية، لكي لا يكونوا عديمي الثمر."]]}, {"l": "Heb 10:24", "n": "", "vs": [[24, "وعلى كل واحد منا أن ينتبه للآخرين، لنحث بعضنا بعضا على المحبة والأعمال الصالحة."]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}, {"l": "1Pe 2:12", "n": "", "vs": [[12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالحة يمجدون الله في يوم الافتقاد."]]}], "kwAr": "لأعمال صالحة", "noteAr": ""}, {"kw": "which", "raw": "Eph_1:4; Rom_8:29", "note": "", "refs": [{"l": "Eph 1:4", "n": "", "vs": [[4, "كما كان قد اختارنا فيه قبل تأسيس العالم، لنكون قديسين بلا لوم أمامه."]]}, {"l": "Rom 8:29", "n": "", "vs": [[29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."]]}], "kwAr": "أعدها", "noteAr": ""}, {"kw": "ordained", "raw": "or, prepared", "note": "or, prepared", "refs": [], "kwAr": "أعدها سلفا", "noteAr": "أو: أعدّها."}, {"kw": "walk", "raw": "Eph_2:2, Eph_4:1; Deu_5:33; Psa_81:13, Psa_119:3; Isa_2:3-5; Act_9:31; Rom_8:1; 1Jo_1:7; 1Jo_2:6", "note": "", "refs": [{"l": "Eph 2:2", "n": "", "vs": [[2, "التي كنتم تسلكون فيها حسب مسرى هذا العالم، تابعين رئيس قوات الهواء، ذلك الروح العامل الآن في أبناء العصيان،"]]}, {"l": "Eph 4:1", "n": "", "vs": [[1, "... إذن، أنا السجين في الرب، أناشدكم أن تسلكوا سلوكا يليق بالدعوة التي إليها دعيتم،"]]}, {"l": "Deu 5:33", "n": "", "vs": [[33, "واسلكوا في كل الطريق التي أوصاكم بها الرب لتحيوا وتزدهروا وتمكثوا طويلا في الأرض التي ترثونها."]]}, {"l": "Psa 81:13", "n": "", "vs": [[13, "لو سمع لي شعبي وسلك إسرائيل في طرقي،"]]}, {"l": "Psa 119:3", "n": "", "vs": [[3, "ولا يرتكبون إثما، إنما في طرقه يسيرون."]]}, {"l": "Isa 2:3-5", "n": "", "vs": [[3, "وتقبل شعوب كثيرة وتقول: تعالوا لنذهب إلى جبل الرب، إلى بيت إله يعقوب، فيعلمنا طرقه، ونسلك في سبله، لأن من صهيون تخرج الشريعة، ومن أورشليم تعلن كلمة الرب."], [4, "فيقضي بين الأمم ويحكم بين الشعوب الكثيرة، فيطبعون سيوفهم محاريث ورماحهم مناجل، ولا ترفع أمة على أمة سيفا، ولا يتدربون على الحرب فيما بعد."], [5, "يابيت يعقوب، هيا لنسلك في نور الرب."]]}, {"l": "Act 9:31", "n": "", "vs": [[31, "في أثناء ذلك كانت الكنيسة في مناطق اليهودية والجليل والسامرة تتمتع بالسلام. وكانت تنمو وتسير في تقوى الر ب، بمساندة الروح القدس."]]}, {"l": "Rom 8:1", "n": "", "vs": [[1, "فالآن إذا ليس على الذين في المسيح يسوع أية دينونة بعد."]]}, {"l": "1Jo 1:7", "n": "", "vs": [[7, "ولكن، إن كنا فعلا نعيش في النور، كما هو في النور، تكون لنا حقا شركة بعضنا مع بعض، ودم ابنه يسوع يطهرنا من كل خطيئة."]]}, {"l": "1Jo 2:6", "n": "", "vs": [[6, "كل من يعترف أنه ثابت في المسيح، يلتزم أن يسلك كما سلك المسيح!"]]}], "kwAr": "لنسلك فيها", "noteAr": ""}], "arS": [["فإننا نحن ", []], ["تحفة", ["G4161"]], [" ", []], ["الله", ["G2316"]], ["، وقد ", []], ["خلقنا", ["G2936"]], [" في ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["لأعمال", ["G2041"]], [" ", []], ["صالحة", ["G18"]], [" ", []], ["أعدها سلفا", ["G4282"]], [" ", []], ["لنسلك", ["G4043"]], [" فيها.", []]]}, {"c": 2, "v": 11, "text": "لذلك اذكروا، أنتم الأمم في الجسد سابقا، يامن تسمون أهل عدم الختان من قبل من يسمون أهل الختان الذي يجري في الجسد باليد،", "groups": [{"kw": "remember", "raw": "Eph_5:8; Deu_5:15, Deu_8:2, Deu_9:7, Deu_15:15, Deu_16:12; Isa_51:1, Isa_51:2; Eze_16:61-63, Eze_20:43; Eze_36:31; 1Co_6:11, 1Co_12:2; Gal_4:8, Gal_4:9", "note": "", "refs": [{"l": "Eph 5:8", "n": "", "vs": [[8, "فقد كنتم في الماضي ظلاما، ولكنكم الآن نور في الرب. فاسلكوا سلوك أولاد النور."]]}, {"l": "Deu 5:15", "n": "", "vs": [[15, "وتذكر أنك كنت عبدا في ديار مصر، فأطلقك الرب من هناك بقدرة فائقة وقوة شديدة، لهذا أوصاك الرب إلهك أن ترتاح في يوم السبت."]]}, {"l": "Deu 8:2", "n": "", "vs": [[2, "وتذكروا كيف قادكم الرب إلهكم في كل طريق الصحراء هذه الأربعين سنة ليذلكم ويمتحنكم، فيعرف ما في قلوبكم: إن كنتم تحفظون أوامره أم تعصونه."]]}, {"l": "Deu 9:7", "n": "", "vs": [[7, "اذكروا ولا تنسوا كيف أسخطتم الرب إلهكم عليكم في الصحراء، فمنذ أن غادرتم ديار مصر حتى بلغتم هذا المكان وأنتم تقاومون الرب."]]}, {"l": "Deu 15:15", "n": "", "vs": [[15, "واذكروا أنكم كنتم عبيدا في ديار مصر، فحرركم الرب إلهكم. لذلك أوصيكم بهذا الأمر اليوم."]]}, {"l": "Deu 16:12", "n": "", "vs": [[12, "وتذكروا أنكم كنتم عبيدا في مصر، فأطيعوا هذه الفرائض واعملوا بها."]]}, {"l": "Isa 51:1", "n": "", "vs": [[1, "اسمعوا لي ياملتمسي البر، الساعين وراء الرب: تلفتوا إلى الصخر الذي منه نحتم، وإلى المحجر الذي منه اقتلعتم."]]}, {"l": "Isa 51:2", "n": "", "vs": [[2, "انظروا إلى إبراهيم أبيكم وإلى سارة التي أنجبتكم، فقد دعوته حين كان فردا واحدا وباركته وأكثرته."]]}, {"l": "Eze 16:61-63", "n": "", "vs": [[61, "فتذكرين عندئذ طرقك حين تستقبلين أختيك: الكبرى والصغرى كلتيهما، وأجعلهما كبنتين لك، إنما ليس ذلك بفضل عهدك."], [62, "فأقيم عهدي معك فتدركين أني أنا الرب،"], [63, "لكي تتذكري فتخجلي ولا تفتحي فمك من بعد بسبب خزيك، حين أغفر لك كل ما ارتكبت من شر يقول السيد الرب»."]]}, {"l": "Eze 20:43", "n": "", "vs": [[43, "هناك تذكرون طرق شركم وأعمالكم التي تدنستم بها، وتمقتون أنفسكم من أجل ما ارتكبتموه من شرور."]]}, {"l": "Eze 36:31", "n": "", "vs": [[31, "فتذكرون طرقكم الأثيمة وتصرفاتكم الطالحة، وتمقتون أنفسكم في أعينكم لما ارتكبتم من آثام ورجاسات."]]}, {"l": "1Co 6:11", "n": "", "vs": [[11, "وهكذا كان بعضكم، إلا أنكم قد اغتسلتم، بل تقدستم، بل تبررتم، باسم الرب يسوع المسيح وبروح إلهنا."]]}, {"l": "1Co 12:2", "n": "", "vs": [[2, "تعلمون أنكم، عندما كنتم من الأمم، كنتم تنجرفون إلى الأصنام الخرساء أيما انجراف."]]}, {"l": "Gal 4:8", "n": "", "vs": [[8, "ولكن، لما كنتم في ذلك الحين لا تعرفون الله ، كنتم في حال العبودية."]]}, {"l": "Gal 4:9", "n": "", "vs": [[9, "أما الآن وقد عرفتم الله ، بل بالأحرى عرفكم الله ، فكيف ترتدون أيضا إلى تلك المباديء العاجزة الفقيرة التي ترغبون في الرجوع إلى العبودية لها من جديد؟"]]}], "kwAr": "لذلك اذكروا", "noteAr": ""}, {"kw": "Gentiles", "raw": "Rom_2:29; Gal_2:15, Gal_6:12; Col_1:21, Col_2:13", "note": "", "refs": [{"l": "Rom 2:29", "n": "", "vs": [[29, "وإنما اليهودي هو من كان يهوديا في الباطن، والختان هو ما كان ختانا للقلب بالروح لا بالحرف. وهذا يأتيه المدح لا من الناس بل من الله!"]]}, {"l": "Gal 2:15", "n": "", "vs": [[15, "نحن يهود بالولادة، ولسنا أمما خاطئين."]]}, {"l": "Gal 6:12", "n": "", "vs": [[12, "إن الذين يريدون أن يظهروا في الجسد بمظهر حسن، أولئك يرغمونكم أن تختنوا، فقط لئلا يلقوا الاضطهاد بسبب صليب المسيح."]]}, {"l": "Col 1:21", "n": "", "vs": [[21, "وأنتم، يامن كنتم في الماضي أجانب وأعداء في الفكر، بأعمالكم الشريرة،"]]}, {"l": "Col 2:13", "n": "", "vs": [[13, "فأنتم، إذ كنتم أمواتا في الخطايا وعدم ختانكم الجسدي، أحياكم جميعا معه؛ مسامحا لنا جميعا بالخطايا كلها."]]}], "kwAr": "أنتم الأمم في الجسد", "noteAr": ""}, {"kw": "Uncircumcision", "raw": "1Sa_17:26, 1Sa_17:36; Jer_9:25, Jer_9:26; Phi_3:3; Col_3:11", "note": "", "refs": [{"l": "1Sa 17:26", "n": "", "vs": [[26, "فسأل داود الرجال الواقفين إلى جواره: «بماذا يكافأ الرجل الذي يقتل ذلك الفلسطيني ويمحو العار عن إسرائيل؟ لأنه من هو هذا الفلسطيني الأغلف حتى يعير جيش الله الحي؟»"]]}, {"l": "1Sa 17:36", "n": "", "vs": [[36, "وهكذا قتل عبدك الأسد والدب كليهما، فليكن هذا الفلسطيني الأغلف كواحد منهما لأنه عير جيش الله الحي»."]]}, {"l": "Jer 9:25", "n": "", "vs": [[25, "«ها أيام مقبلة»، يقول الرب، «أعاقب فيها كل مختون وأغلف"]]}, {"l": "Jer 9:26", "n": "", "vs": [[26, "أهل مصر ويهوذا وأدوم وبني عمون وموآب، وسائر المقيمين في الصحراء ممن يقصون شعر أصداغهم، لأن جميع الشعوب غلف، أما كل بيت إسرائيل فإنهم ذوو قلوب غلفاء»."]]}, {"l": "Phi 3:3", "n": "", "vs": [[3, "فإننا نحن أهل الختان الحق، لأننا إنما نعبد بروح الله ونفتخر في المسيح يسوع، ولا نعتمد على أمور الجسد،"]]}, {"l": "Col 3:11", "n": "", "vs": [[11, "وفيه لا فرق بين يوناني ويهودي، أو مختون وغير مختون، أو متحضر ومتخلف، أو عبد وحر، بل المسيح هو الكل وفي الكل."]]}], "kwAr": "أهل عدم الختان", "noteAr": ""}, {"kw": "made", "raw": "Col_2:11", "note": "", "refs": [{"l": "Col 2:11", "n": "", "vs": [[11, "وفيه أيضا ختنتم أنتم ختانا لم تجره الأيدي، إذ نزع عنكم جسد الخطايا البشري وهذا هو ختان المسيح:"]]}], "kwAr": "يجري في الجسد باليد", "noteAr": ""}], "arS": [["لذلك", ["G1352"]], [" ", []], ["اذكروا", ["G3421"]], ["، أنتم ", []], ["الأمم", ["G1484"]], [" في ", []], ["الجسد", ["G4561"]], [" ", []], ["سابقا", ["G4218"]], ["، يامن ", []], ["تسمون", ["G3004"]], [" أهل ", []], ["عدم الختان", ["G203"]], [" من قبل من ", []], ["يسمون", ["G3004"]], [" أهل ", []], ["الختان", ["G4061"]], [" الذي يجري في ", []], ["الجسد", ["G4561"]], [" ", []], ["باليد", ["G5499"]], ["،", []]]}, {"c": 2, "v": 12, "text": "أنكم كنتم في ذلك الحين بلا مسيح، أجانب عن جماعة إسرائيل، وغرباء عن العهود الموعودة، لا رجاء لكم، ومنكرين لله في العالم.", "groups": [{"kw": "without", "raw": "Joh_10:16, Joh_15:5; Col_1:21", "note": "", "refs": [{"l": "Joh 10:16", "n": "", "vs": [[16, "ولي خراف أخرى لا تنتمي إلى هذه الحظيرة، لا بد أن أجمعها إلي أيضا، فتصغي لصوتي؛ فيكون هناك قطيع واحد وراع واحد."]]}, {"l": "Joh 15:5", "n": "", "vs": [[5, "أنا الكرمة وأنتم الأغصان. من يثبت في وأنا فيه، فذاك ينتج ثمرا كثيرا. فإنكم بمعزل عني لا تقدرون أن تفعلوا شيئا."]]}, {"l": "Col 1:21", "n": "", "vs": [[21, "وأنتم، يامن كنتم في الماضي أجانب وأعداء في الفكر، بأعمالكم الشريرة،"]]}], "kwAr": "بلا مسيح", "noteAr": ""}, {"kw": "aliens", "raw": "Eph_4:18; Ezr_4:3; Isa_61:5; Eze_13:9; Heb_11:34", "note": "", "refs": [{"l": "Eph 4:18", "n": "", "vs": [[18, "لكونهم مظلمي البصيرة ومتغربين عن حياة الله بسبب ما فيهم من جهل وقساوة قلب."]]}, {"l": "Ezr 4:3", "n": "", "vs": [[3, "فأجابهم زربابل ويشوع وسائر رؤساء عشائر إسرائيل: «لا شأن لكم معنا في بناء هيكل إلهنا، وإنما نحن وحدنا نبني هيكل الرب إله إسرائيل، بموجب أمر الملك كورش ملك فارس»."]]}, {"l": "Isa 61:5", "n": "", "vs": [[5, "ويقوم الغرباء على رعاية قطعانكم، وأبناء الأجانب يكونون لكم حراثا وكرامين."]]}, {"l": "Eze 13:9", "n": "", "vs": [[9, "فتكون يدي على الأنبياء ذوي الرؤيا الباطلة والعرافة الكاذبة، فلا يكون لهم مقام في جماعة شعبي، ولا تدون أسماؤهم في كتاب بيت إسرائيل، ولا يدخلون أرض إسرائيل، فتدركون أني أنا السيد الرب."]]}, {"l": "Heb 11:34", "n": "", "vs": [[34, "وأبطلوا قوة النار، ونجوا من الموت قتلا بالسيف. وبه أيضا نالوا القوة بعد ضعف، فصاروا أشداء في المعارك، وردوا جيوشا غريبة على أعقابها."]]}], "kwAr": "أجانب عن جماعة إسرائيل", "noteAr": ""}, {"kw": "the covenants", "raw": "Gen_15:18, Gen_17:7-9; Exo_24:3-11; Num_18:19; Psa. 89:3-18; Jer_31:31-34; Jer_33:20-26; Eze_37:26; Luk_1:72; Act_3:25; Rom_9:4, Rom_9:5, Rom_9:8; Gal_3:16, Gal_3:17", "note": "", "refs": [{"l": "Gen 15:18", "n": "", "vs": [[18, "في ذلك اليوم عقد الله ميثاقا مع أبرام قائلا: «سأعطي نسلك هذه الأرض من وادي العريش إلى النهر الكبير، نهر الفرات."]]}, {"l": "Gen 17:7-9", "n": "", "vs": [[7, "وأقيم عهدي الأبدي بيني وبينك، وبين نسلك من بعدك جيلا بعد جيل، فأكون إلها لك ولنسلك من بعدك."], [8, "وأهبك أنت وذريتك من بعدك جميع أرض كنعان، التي نزلت فيها غريبا، ملكا أبديا. وأكون لهم إلها»."], [9, "وقال الرب لإبراهيم: «أما أنت فاحفظ عهدي، أنت وذريتك من بعدك مدى أجيالهم."]]}, {"l": "Exo 24:3-11", "n": "", "vs": [[3, "فجاء موسى وبلغ الشعب بكل كلام الرب وأحكامه، فأجاب الشعب بصوت واحد: «كل ما أمرنا به الرب نفعل»."], [4, "فكتب موسى جميع أقوال الرب، ثم بكر في الصباح وشيد مذبحا على سفح الجبل، ونصب اثني عشر عمودا على عدد أسباط بني إسرائيل الاثني عشر."], [5, "وأرسل بعض شبان بني إسرائيل فقدموا محرقات وقربوا ذبائح سلامة للرب من العجول،"], [6, "وأخذ موسى نصف الدم واحتفظ به في طسوس ورش النصف الباقي على المذبح."], [7, "وتناول كتاب العهد وتلاه على مسامع الشعب، فقالوا: «كل ما أمر به الرب نفعله ونطيعه»."], [8, "ثم أخذ موسى الدم الذي في الطسوس ورشه على الشعب قائلا: «هوذا دم العهد الذي قطعه الرب معكم بناء على جميع هذه الأقوال»."], [9, "ثم صعد موسى وهرون وناداب وأبيهو وسبعون من شيوخ إسرائيل،"], [10, "ورأوا إله إسرائيل، وتحت قدميه أرضية كأنها مصنوعة من الياقوت الأزرق الشفاف تماثل السماء في النقاء،"], [11, "ولكن الله لم يمد يده ليهلك أشراف بني إسرائيل. فرأوا الله وأكلوا وشربوا."]]}, {"l": "Num 18:19", "n": "", "vs": [[19, "وهكذا أعطيك أنت وأبناءك وبناتك، حقا أبديا، جميع تقدمات الأقداس التي يقربها بنو إسرائيل للرب، فيكون هذا ميثاق ملح أبديا أمام الرب، لك ولنسلك أيضا»."]]}, {"l": "Psa 89:3-18", "n": "", "vs": [[3, "قد قلت: إني أقمت عهدا مع الملك الذي اخترته، أقسمت لداود عبدي."], [4, "أثبت نسلك إلى الأبد، وأبقي عرشك قائما من جيل إلى جيل."], [5, "السماوات نفسها تشيد بعجائبك أيها الرب، والملائكة القديسون بأمانتك."], [6, "فمن في السماء يعادل الرب؟ ليس بين الكائنات السماوية من يماثله."], [7, "إنه إله مهوب جدا في محفل الملائكة القديسين، ومخوف كثيرا عند جميع المحيطين به."], [8, "من مثلك أيها الرب إله الجنود، الرب القدير، وأمانتك محيطة بك؟"], [9, "أنت متسلط على هياج البحر، فتهديء أمواجه عند ارتفاعها."], [10, "أنت سحقت قوة مصر فصارت كقتيل. وبددت أعداءك بقدرتك العظيمة."], [11, "أنت ملك السماوات والأرض أيضا. أنت مؤسس المسكونة وكل ما فيها."], [12, "أنت خالق الشمال والجنوب، وباسمك يترنم جبلا تابور وحرمون."], [13, "أنت ذو القدرة العظيمة. يدك قوية ويمناك رفيعة."], [14, "البر والقضاء قاعدتا عرشك، الرحمة والحق يتقدمان حضرتك."], [15, "طوبى للشعب الذي يستجيب لهتاف البوق فيسلك في نور محياك أيها الرب."], [16, "باسمك يبتهجون طول النهار، وببرك يسمون."], [17, "فإنك أنت قوتهم التي بها يفخرون، وبرضاك يعلو شأننا."], [18, "لأن الرب هو حمايتنا، وملكنا هو قدوس إسرائيل."]]}, {"l": "Jer 31:31-34", "n": "", "vs": [[31, "«ها أيام مقبلة»، يقول الرب أقطع فيها عهدا جديدا مع ذرية إسرائيل ويهوذا،"], [32, "لا كالعهد الذي أبرمته مع آبائهم، يوم أخذتهم بيدهم لأخرجهم من ديار مصر، فنقضوا عهدي، لذلك أهملتهم."], [33, "ولكن هذا هو العهد الذي أبرمه مع ذرية إسرائيل بعد تلك الأيام»، يقول الرب: «سأجعل شريعتي في دواخلهم، وأدونها على قلوبهم وأكون لهم إلها وهم يكونون لي شعبا."], [34, "ولا يحض في ما بعد كل واحد قريبه قائلا: اعرف الرب إلهك لأنهم جميعا سيعرفونني، من صغيرهم إلى كبيرهم، لأني سأصفح عن إثمهم ولن أذكر خطاياهم من بعد»."]]}, {"l": "Jer 33:20-26", "n": "", "vs": [[20, "«هذا ما يقوله الرب: إن استطعتم أن تنقضوا عهدي مع النهار، ومع الليل، بحيث لا يحل النهار والليل في أوانهما،"], [21, "يمكن أن تنقضوا عهدي مع عبدي داود، فلا يكون من ذريته ابن يملك على عرشه، ومع الكهنة واللاويين خدامي."], [22, "وأكثر ذرية داود عبدي وذر اري اللاويين خدامي، وأجعلها في كثرة نجوم السماء التي لا تحصى، وكرمل البحر الذي لا يعد»."], [23, "ثم أوحى الرب إلى إرميا بهذه النبوءة."], [24, "«ألم تسمع ما قاله ذلك الشعب: قد نبذ الرب العشيرتين اللتين اختارهما؟ كذلك احتقروا شعبي وكأنهم لم يعودوا أمة."], [25, "وهذا ما يعلنه الرب: إن كنت لم أعقد ميثاقا مع النهار والليل، ولم أسن أحكاما للسماوات والأرض،"], [26, "فإني أرفض ذرية يعقوب وداود عبدي، فلا أصطفي من ذريته من يحكم على نسل إبراهيم وإسحق ويعقوب. ولكني سأرد سبيهم وأرحمهم»."]]}, {"l": "Eze 37:26", "n": "", "vs": [[26, "وأبرم معهم ميثاق سلام، فيكون معهم عهدا أبديا، وأوطنهم وأكثرهم وأقيم مقدسي في وسطهم إلى الأبد."]]}, {"l": "Luk 1:72", "n": "", "vs": [[72, "ليتم الرحمة نحو آبائنا ويتذكر عهده المقدس"]]}, {"l": "Act 3:25", "n": "", "vs": [[25, "وأنتم أحفاد هؤلاء الأنبياء، وأبناء العهد الذي أبرمه الله لآبائنا عندما قال لإبراهيم: بنسلك تنال البركة شعوب الأرض كلها."]]}, {"l": "Rom 9:4", "n": "", "vs": [[4, "فإنهم إسرائيليون، وقد منحوا التبني والمجد والعهود والتشريع والعبادة والمواعيد،"]]}, {"l": "Rom 9:5", "n": "", "vs": [[5, "ومنهم كان الآباء ومنهم جاء المسيح حسب الجسد، وهو فوق الجميع الله المبارك إلى الأبد. آمين."]]}, {"l": "Rom 9:8", "n": "", "vs": [[8, "أي أن أولاد الجسد ليسوا هم أولاد الله، بل أولاد الوعد يحسبون نسلا."]]}, {"l": "Gal 3:16", "n": "", "vs": [[16, "وقد وجهت الوعود لإبراهيم ونسله، ولا يقول «وللأنسال» كأنه يشير إلى كثيرين، بل يشير إلى واحد، إذ يقول «ولنسلك»، يعني المسيح."]]}, {"l": "Gal 3:17", "n": "", "vs": [[17, "فما أقوله هو هذا: إن عهدا سبق أن أقره الله لا تنقضه الشريعة التي جاءت بعده بأربع مئة وثلاثين سنة، وكأنها تلغي الوعد."]]}], "kwAr": "العهود الموعودة", "noteAr": ""}, {"kw": "having", "raw": "Jer_14:8, Jer_17:13; Joh_4:22; Act_28:20; Col_1:5, Col_1:27; 1Th_4:13; 2Th_2:16; 1Ti_1:1; Heb_6:18; 1Pe_1:3, 1Pe_1:21, 1Pe_3:15; 1Jo_3:3", "note": "", "refs": [{"l": "Jer 14:8", "n": "", "vs": [[8, "يارجاء إسرائيل ومخلصه في وقت الضيق، لماذا تكون كغريب في الأرض، وكعابر سبيل يميل ليبيت ثم يمضي؟"]]}, {"l": "Jer 17:13", "n": "", "vs": [[13, "أيها الرب رجاء إسرائيل: إن جميع الذين يتخلون عنك يلحق بهم الخزي، والذين ينصرفون عنك (يزولون) كمن كتبت أسماؤهم على التراب لأنهم نبذوا الرب ينبوع المياه الحية."]]}, {"l": "Joh 4:22", "n": "", "vs": [[22, "أنتم تعبدون ما تجهلون، ونحن نعبد ما نعلم، لأن الخلاص هو من عند اليهود."]]}, {"l": "Act 28:20", "n": "", "vs": [[20, "لذلك طلبت أن أراكم وأكلمكم؛ فأنا موثق بهذه السلسلة من أجل رجاء إسرائيل»."]]}, {"l": "Col 1:5", "n": "", "vs": [[5, "بسبب الرجاء المحفوظ لكم في السماوات، الرجاء الذي سمعتم به سابقا في كلمة الحق التي في الإنجيل"]]}, {"l": "Col 1:27", "n": "", "vs": [[27, "الذين أراد الله أن يعلن لهم كم هو غني مجد هذا السر بين الأمم: إنه المسيح فيكم، وهو رجاء المجد؛"]]}, {"l": "1Th 4:13", "n": "", "vs": [[13, "على أننا نريد، أيها الإخوة، ألا يخفى عليكم أمر الراقدين، حتى لا يصيبكم الحزن كغيركم من الناس الذين لا رجاء لهم."]]}, {"l": "2Th 2:16", "n": "", "vs": [[16, "وليت ربنا يسوع المسيح نفسه، والله أبانا، الذي أحبنا ووهبنا بنعمته راحة أبدية ورجاء صالحا،"]]}, {"l": "1Ti 1:1", "n": "", "vs": [[1, "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"]]}, {"l": "Heb 6:18", "n": "", "vs": [[18, "فاستنادا إلى وعد الله وقسمه، وهما أمران ثابتان لا يتغيران ويستحيل أن يكذب الله فيهما، نحصل على تشجيع قوي، بعدما التجأنا إلى التمسك بالرجاء الموضوع أمامنا."]]}, {"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}, {"l": "1Pe 1:21", "n": "", "vs": [[21, "أنتم الذين تؤمنون بالله بالمسيح الذي أقامه من الموت وأعطاه المجد، حتى يكون الله غاية إيمانكم ورجائكم."]]}, {"l": "1Pe 3:15", "n": "", "vs": [[15, "وإنما كرسوا المسيح ربا في قلوبكم. وكونوا دائما مستعدين لأن تقدموا جوابا مقنعا لكل من يسألكم عن سبب الرجاء الذي في داخلكم"]]}, {"l": "1Jo 3:3", "n": "", "vs": [[3, "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر."]]}], "kwAr": "لا رجاء لكم", "noteAr": ""}, {"kw": "without", "raw": "2Ch_15:3; Isa_44:6, Isa_45:20; Hos_3:4; Act_14:15, Act_14:16; Rom_1:28-32; 1Co_8:4-6, 1Co_10:19, 1Co_10:20; Gal_4:8; 1Th_4:5", "note": "", "refs": [{"l": "2Ch 15:3", "n": "", "vs": [[3, "لقد قضى الإسرائيليون حقبة طويلة كانوا فيها بلا إله حق، وبلا كاهن يعلمهم، وبلا شريعة."]]}, {"l": "Isa 44:6", "n": "", "vs": [[6, "هذا ما يقوله الرب القدير ملك إسرائيل وفاديه: «أنا هو الأول والآخر، ولا إله غيري."]]}, {"l": "Isa 45:20", "n": "", "vs": [[20, "اجتمعوا وتعالوا. اقتربوا معا أيها الناجون من الأمم، فإن الجهال وحدهم هم الذين يحملون الأصنام الخشبية ويواظبون على الصلاة لإله لا يخلص."]]}, {"l": "Hos 3:4", "n": "", "vs": [[4, "لأن أبناء إسرائيل يمكثون أمدا طويلا من غير ملك أو أمير، ومن غير ذبيحة ولا تماثيل ولا أفود ولا ترافيم."]]}, {"l": "Act 14:15", "n": "", "vs": [[15, "وهما يصرخان: «لماذا تفعلون هذا أيها الناس؟ ما نحن إلا بشر ضعفاء مثلكم، نبشركم بأن ترجعوا عن هذه الأشياء الباطلة إلى الله الحي صانع السماء والأرض والبحر، وكل ما فيها،"]]}, {"l": "Act 14:16", "n": "", "vs": [[16, "وقد ترك الأمم في العصور الماضية يسلكون في طرقهم،"]]}, {"l": "Rom 1:28-32", "n": "", "vs": [[28, "وبما أنهم لم يتخيروا إبقاء الله ضمن معرفتهم، أسلمهم الله إلى ذهن عاطل عن التمييز دفعهم إلى ممارسة الأمور غير اللائقة."], [29, "إذ قد امتلأوا من كل إثم وشر وجشع وخبث، وشحنوا حسدا وقتلا وخصاما ومكرا وسوءا. وهم ثرثارون،"], [30, "مغتابون، كارهون لله، شتامون، متكبرون، متفاخرون، مخترعون للشرور، غير طائعين للوالدين."], [31, "لا فهم عندهم، ولا أمانة، ولا حنان، ولا رحمة."], [32, "إنهم يعلمون حكم الله العادل: أن الذين يفعلون هذه الأمور يستوجبون الموت؛ ومع ذلك، لا يمارسونها وحسب، بل يسرون بفاعليها."]]}, {"l": "1Co 8:4-6", "n": "", "vs": [[4, "ففيما يخص الأكل من ذبائح الأصنام، نحن نعلم أن الصنم ليس بإله موجود في الكون، وأنه لا وجود إلا لإله واحد."], [5, "حتى لو كانت الآلهة المزعومة موجودة في السماء أو على الأرض وما أكثر تلك الآلهة والأرباب!"], [6, "فليس عندنا نحن إلا إله واحد هو الآب الذي منه كل شيء، ونحن له؛ ورب واحد هو يسوع المسيح الذي به كل شيء ونحن به."]]}, {"l": "1Co 10:19", "n": "", "vs": [[19, "فماذا أعني إذن؟ أأن ما ذبح للصنم له قيمة أو أن الصنم له قيمة؟"]]}, {"l": "1Co 10:20", "n": "", "vs": [[20, "لا، بل أن ما يذبحه الوثنيون فإنما يذبحونه للشياطين وليس لله. وإني لا أريد لكم أن تكونوا مشتركين مع الشياطين."]]}, {"l": "Gal 4:8", "n": "", "vs": [[8, "ولكن، لما كنتم في ذلك الحين لا تعرفون الله ، كنتم في حال العبودية."]]}, {"l": "1Th 4:5", "n": "", "vs": [[5, "غير منساق للشهوة الجامحة كالوثنيين الذين لا يعرفون الله ،"]]}], "kwAr": "ومنكرين لله في العالم", "noteAr": ""}], "arS": [["أنكم كنتم في ذلك ", []], ["الحين", ["G2540"]], [" ", []], ["بلا مسيح", ["G5565", "G5547"]], ["، ", []], ["أجانب", ["G526"]], [" عن ", []], ["جماعة", ["G4174"]], [" ", []], ["إسرائيل", ["G2474"]], ["، ", []], ["وغرباء", ["G3581"]], [" عن ", []], ["العهود", ["G1242"]], [" ", []], ["الموعودة", ["G1860"]], ["، لا ", []], ["رجاء", ["G1680"]], [" لكم، ", []], ["ومنكرين لله", ["G112"]], [" في ", []], ["العالم", ["G2889"]], [".", []]]}, {"c": 2, "v": 13, "text": "أما الآن، ففي المسيح يسوع، أنتم الذين كنتم من قبل بعيدين قد صرتم قريبين بدم المسيح.", "groups": [{"kw": "in", "raw": "Rom_8:1; 1Co_1:30; 2Co_5:17; Gal_3:28", "note": "", "refs": [{"l": "Rom 8:1", "n": "", "vs": [[1, "فالآن إذا ليس على الذين في المسيح يسوع أية دينونة بعد."]]}, {"l": "1Co 1:30", "n": "", "vs": [[30, "وبفضل الله صار لكم مقام في المسيح يسوع الذي جعل لنا حكمة من الله وبرا وقداسة وفداء،"]]}, {"l": "2Co 5:17", "n": "", "vs": [[17, "فإنه إذا كان أحد في المسيح، فهو خليقة جديدة: إن الأشياء القديمة قد زالت، وها كل شيء قد صار جديدا."]]}, {"l": "Gal 3:28", "n": "", "vs": [[28, "لا فرق بعد الآن بين يهودي ويوناني، أو عبد وحر، أو ذكر وأنثى، لأنكم جميعا واحد في المسيح يسوع."]]}], "kwAr": "ففي المسيح يسوع", "noteAr": ""}, {"kw": "were", "raw": "Eph_2:12, Eph_2:17, Eph_2:19-22, Eph_3:5-8; Psa_22:7, Psa_73:27; Isa_11:10, Isa_24:15, Isa_24:16, Isa_43:6, Isa_49:12; Isa_57:19, Isa_60:4, Isa_60:9, Isa_66:19; Jer_16:19; Act_2:39, Act_15:14, Act_22:21, Act_26:18; Rom_15:8-12", "note": "", "refs": [{"l": "Eph 2:12", "n": "", "vs": [[12, "أنكم كنتم في ذلك الحين بلا مسيح، أجانب عن جماعة إسرائيل، وغرباء عن العهود الموعودة، لا رجاء لكم، ومنكرين لله في العالم."]]}, {"l": "Eph 2:17", "n": "", "vs": [[17, "ثم جاء وبشركم بالسلام أنتم البعيدين، (كما بشر بالسلام) أولئك القريبين."]]}, {"l": "Eph 2:19-22", "n": "", "vs": [[19, "إذن، لستم غرباء وأجانب بعد الآن، بل أنتم رعية مع القديسين وأعضاء في عائلة الله،"], [20, "وقد بنيتم على أساس الرسل والأنبياء، والمسيح يسوع نفسه هو حجر الزاوية الأساس،"], [21, "الذي فيه يتناسق البناء كله فيرتفع ليصير هيكلا مقدسا في الرب."], [22, "وفيه أنتم أيضا قد بنيتم معا فصرتم مسكنا لله بوجود الروح."]]}, {"l": "Eph 3:5-8", "n": "", "vs": [[5, "ذلك السر الذي لم يطلع عليه بنو البشر في الأجيال الماضية مثلما أعلن الآن بوحي الروح لرسله القديسين وأنبيائه:"], [6, "وهو أن الأمم هم شركاء اليهود في الميراث، وأعضاء في الجسد معهم، ولهم أيضا حق الاستفادة من الوعد. وذلك في المسيح يسوع وبفضل الإنجيل"], [7, "الذي صرت أنا خادما له بحسب نعمة الله الموهوبة لي وفقا لعمل قدرته."], [8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "Psa 22:7", "n": "", "vs": [[7, "جميع الذين يرونني يستهزئون بي، يفتحون شفاههم علي بالباطل، ويهزون رؤوسهم قائلين:"]]}, {"l": "Psa 73:27", "n": "", "vs": [[27, "هوذا المبتعدون عنك يهلكون وأنت تدمر كل من يخونك."]]}, {"l": "Isa 11:10", "n": "", "vs": [[10, "في ذلك اليوم ينتصب أصل يسى راية للأمم، وإليه تسعى جميع الشعوب، ويكون مسكنه مجيدا."]]}, {"l": "Isa 24:15", "n": "", "vs": [[15, "لذلك مجدوا الرب في المشرق، مجدوا اسم الرب إله إسرائيل في جزائر البحر."]]}, {"l": "Isa 24:16", "n": "", "vs": [[16, "من أقاصي المعمورة سمعنا تسابيح مجد قائلة: «المجد للبار». ولكني قلت: أنا هالك! أنا هالك ويل لي لأن الخونة يمارسون الخيانة. الخونة يمارسون الخيانة."]]}, {"l": "Isa 43:6", "n": "", "vs": [[6, "أقول للشمال: أطلقهم من عقالك، وللجنوب لا تحجزهم. اجمع أبنائي من بعيد وبناتي من أقاصي الأرض،"]]}, {"l": "Isa 49:12", "n": "", "vs": [[12, "انظروا، ها هم يقبلون من ديار بعيدة، هؤلاء من الشمال والغرب، وهؤلاء من أرض سينيم."]]}, {"l": "Isa 57:19", "n": "", "vs": [[19, "وأستبدل نواحه بالحمد، يقول الرب؛ فيكون سلام للقريب والبعيد لأنني سأشفيه."]]}, {"l": "Isa 60:4", "n": "", "vs": [[4, "تأملي حولك وانظري، فها هم جميعا قد اجتمعوا، وأتوا إليك. يجيء أبناؤك من مكان بعيد، وتحمل بناتك على الأذرع."]]}, {"l": "Isa 60:9", "n": "", "vs": [[9, "فالجزائر تنتظرني، وفي الطليعة سفن ترشيش حاملة أبناءك لتأتي بهم من أرض بعيدة، ومعهم فضتهم وذهبهم، تكريما لاسم الرب إلهك ولقدوس إسرائيل لأنه قد مجدك."]]}, {"l": "Isa 66:19", "n": "", "vs": [[19, "وأجعل بينهم آية وأبعث بعض الناجين منهم إلى الأمم: إلى ترشيش، وفول، ولود، المهرة في رمي السهام، وإلى توبال وياوان وإلى الجزائر البعيدة ممن لم يسمعوا بشهرتي أو يروا مجدي، فيذيعون مجدي بين الأمم."]]}, {"l": "Jer 16:19", "n": "", "vs": [[19, "يارب أنت عزي وحصني وملاذي في يوم الضيق، إليك تقبل الأمم من أقاصي الأرض قائلة: «لم يرث آباؤنا سوى الباطل والأكاذيب وما لا جدوى منه."]]}, {"l": "Act 2:39", "n": "", "vs": [[39, "لأن الوعد هو لكم ولأولادكم وللبعيدين جميعا، يناله كل من يدعوه الرب إلهنا!»"]]}, {"l": "Act 15:14", "n": "", "vs": [[14, "»استمعوا لي أيها الإخوة: أخبر كم سمعان كيف تفقد الله منذ البداية غير اليهود ليتخذ من بينهم شعبا يحمل اسمه؛"]]}, {"l": "Act 22:21", "n": "", "vs": [[21, "ولكنه قال لي: اذهب ... سأرسلك بعيدا: إلى الأمم!»"]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "Rom 15:8-12", "n": "", "vs": [[8, "فإني أقول إن المسيح صار خادم أهل الختان إظهارا لصدق الله وتوطيدا لوعوده للآباء،"], [9, "وإن الأمم يمجدون الله على الرحمة، وفقا لما قد كتب: «لهذا أعترف لك بين الأمم وأرتل لاسمك!»"], [10, "وأيضا قيل: «افرحوا، أيها الأمم، مع شعبه»."], [11, "وأيضا: «سبحوا الرب ياجميع الأمم، ولتحمده جميع الشعوب»."], [12, "ويقول إشعياء أيضا: «سيطلع أصل يسى، والقائم، ليسود على الأمم: عليه تعلق الشعوب الرجاء»."]]}], "kwAr": "كنتم من قبل بعيدين", "noteAr": ""}, {"kw": "are", "raw": "Eph_2:16, Eph_1:7; Rom_3:23-30, Rom_5:9, Rom_5:10; 1Co_6:11; 2Co_5:20,2Co_5:21; Col_1:13, Col_1:14, Col_1:21, Col_1:22; Heb_9:18; 1Pe_1:18, 1Pe_1:19, 1Pe_3:18; Rev_5:9", "note": "", "refs": [{"l": "Eph 2:16", "n": "", "vs": [[16, "ولكي يصالحهما معا في جسد واحد مع الله بالصليب الذي به قتل العداء."]]}, {"l": "Eph 1:7", "n": "", "vs": [[7, "ففيه لنا بدمه الفداء، أي غفران الخطايا؛ بحسب غنى نعمته"]]}, {"l": "Rom 3:23-30", "n": "", "vs": [[23, "لأن الجميع قد أخطأوا وهم عاجزون عن بلوغ ما يمجد الله ."], [24, "فهم يبررون مجانا، بنعمته، بالفداء بالمسيح يسوع"], [25, "الذي قدمه الله كفارة، عن طريق الإيمان، وذلك بدمه."], [26, "ليظهر بر الله إذ تغاضى، بإمهاله الإلهي، عن الخطايا التي حدثت في الماضي، ويظهر أيضا بره في الزمن الحاضر: فيتبين أنه بار وأنه يبرر من له الإيمان بيسوع."], [27, "إذن، أين الافتخار؟ إنه قد أبطل! وعلى أي أساس؟ أع
