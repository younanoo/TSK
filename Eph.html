s": [[3, "أما موسى فقد كان أكثر حلما من جميع الناس الذين على وجه الأرض."]]}, {"l": "Psa 45:4", "n": "", "vs": [[4, "وبجلالك اركب ظافرا لأجل الحق والوداعة والبر، فتقتحم يمينك الأهوال."]]}, {"l": "Psa 138:6", "n": "", "vs": [[6, "فمع تعاليك، تلتفت إلى المتواضعين، أما المتكبر فتعرفه من بعيد."]]}, {"l": "Pro 3:34", "n": "", "vs": [[34, "يسخر من المستكبرين الساخرين، ويغدق رضاه على المتواضعين"]]}, {"l": "Pro 16:19", "n": "", "vs": [[19, "اتضاع الروح مع الودعاء خير من اقتسام الغنيمة مع المتكبرين."]]}, {"l": "Isa 57:15", "n": "", "vs": [[15, "لأنه هكذا يقول العلي السامي، المقيم في الأبد، الذي يدعى اسمه القدوس: إنني أسكن في العلى وفي الموضع المقدس، وأقيم مع المنسحق، وذوي الروح المتواضعة، لأحيي أرواح المتواضعين، وأنعش قلوب المنسحقين."]]}, {"l": "Isa 61:1-3", "n": "", "vs": [[1, "روح السيد الرب علي، لأن الرب مسحني لأبشر المساكين، أرسلني لأضمد جراح المنكسري القلوب، لأنادي للمسبيين بالعتق وللمأسورين بالحرية،"], [2, "لأعلن سنة الرب المقبولة، ويوم انتقام لإلهنا، لأعزي جميع النائحين."], [3, "لأمنح نائحي صهيون تاج جمال بدل الرماد، ودهن السرور بدل النوح، ورداء تسبيح بدل الروح اليائسة، فيدعون أشجار البر وغرس الرب لكي يتمجد."]]}, {"l": "Zep 2:3", "n": "", "vs": [[3, "التمسوا الرب ياودعاء الأرض الراضخين لحكمه. اطلبوا البر والتواضع لعلكم تجدون ملاذا في يوم سخط الرب."]]}, {"l": "Zec 9:9", "n": "", "vs": [[9, "»ابتهجي جدا ياابنة صهيون واهتفي ياابنة أورشليم، لأن هوذا ملكك مقبل إليك. هو عادل ظافر، ولكنه وديع راكب على أتان، على جحش ابن أتان."]]}, {"l": "Mat 5:3-5", "n": "", "vs": [[3, "«طوبى للمساكين بالروح، فإن لهم ملكوت السماوات."], [4, "طوبى للحزانى، فإنهم سيعزون."], [5, "طوبى للودعاء، فإنهم سيرثون الأرض."]]}, {"l": "Mat 11:29", "n": "", "vs": [[29, "احملوا نيري عليكم، وتتلمذوا على يدي، لأني وديع ومتواضع القلب، فتجدوا الراحة لنفوسكم."]]}, {"l": "Act 20:19", "n": "", "vs": [[19, "فقد كنت أخدم الرب بكل تواضع، وبكثير من الدموع، وأنا أعاني المحن التي أصابتني بها مؤامرات اليهود."]]}, {"l": "1Co 13:4", "n": "", "vs": [[4, "المحبة تصبر طويلا؛ وهي لطيفة. المحبة لا تحسد. المحبة لا تتفاخر ولا تتكبر."]]}, {"l": "1Co 13:5", "n": "", "vs": [[5, "لا تتصرف بغير لياقة، ولا تسعى إلى مصلحتها الخاصة. لا تستفز سريعا، ولا تنسب الشر لأحد."]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Gal 5:23", "n": "", "vs": [[23, "والوداعة وضبط النفس. وليس من قانون يمنع مثل هذه الفضائل."]]}, {"l": "Col 3:12", "n": "", "vs": [[12, "فباعتباركم جماعة مختارة من الله، قديسين محبوبين، البسوا دائما عواطف الحنان واللطف والتواضع والوداعة وطول البال،"]]}, {"l": "Col 3:13", "n": "", "vs": [[13, "محتملين بعضكم بعضا، ومسامحين بعضكم بعضا. إن كان لأحدكم شكوى على آخر، كما سامحكم الرب، هكذا افعلوا أنتم أيضا."]]}, {"l": "1Ti 6:11", "n": "", "vs": [[11, "وأما أنت، ياإنسان الله، فاهرب من هذه الأمور، واسع في إثر البر والتقوى والإيمان والمحبة والصبر والوداعة."]]}, {"l": "2Ti 2:25", "n": "", "vs": [[25, "ويؤدب بالوداعة مقاومي الإيمان، عسى أن يمنحهم الله التوبة، فيعرفوا الحق بالتمام،"]]}, {"l": "Jam 1:21", "n": "", "vs": [[21, "إذن، تخلصوا من كل ما في حياتكم من نجاسة وشر متزايد. وليكن قبولكم لتلك الكلمة التي غرسها الله في قلوبكم، قبولا وديعا. فهي القادرة أن تخلص نفوسكم."]]}, {"l": "Jam 3:15-18", "n": "", "vs": [[15, "إن هذه الحكمة التي تدعونها ليست نازلة من عند الله، بل هي «حكمة» أرضية بشرية شيطانية."], [16, "فحيث تكون مرارة الحسد والتحزب، ينتشر الخلاف والفوضى وجميع الشرور."], [17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."], [18, "والبر هو ثمر ة ما يزرعه في سلام صانعو السلام."]]}, {"l": "1Pe 3:15", "n": "", "vs": [[15, "وإنما كرسوا المسيح ربا في قلوبكم. وكونوا دائما مستعدين لأن تقدموا جوابا مقنعا لكل من يسألكم عن سبب الرجاء الذي في داخلكم"]]}], "kwAr": "بكل تواضع ووداعة", "noteAr": ""}, {"kw": "forbearing", "raw": "Mar_9:19; Rom_15:1; 1Co_13:7; Gal_6:2", "note": "", "refs": [{"l": "Mar 9:19", "n": "", "vs": [[19, "فأجابهم قائلا: «أيها الجيل غير المؤمن! إلى متى أبقى معكم؟ إلى متى أحتملكم؟ أحضروه إلي!»"]]}, {"l": "Rom 15:1", "n": "", "vs": [[1, "ولكن علينا نحن الأقوياء (في الإيمان)، أن نحتمل ضعف الضعفاء (فيه)، وأن لا نرضي أنفسنا."]]}, {"l": "1Co 13:7", "n": "", "vs": [[7, "إنها تستر كل شيء، وتصدق كل شيء، وترجو كل شيء، وتتحمل كل شيء."]]}, {"l": "Gal 6:2", "n": "", "vs": [[2, "ليحمل الواحد منكم أثقال الآخر، وهكذا تتممون شريعة المسيح."]]}], "kwAr": "محتملين بعضكم بعضا", "noteAr": ""}], "arS": [["بكل", ["G3956"]], [" ", []], ["تواضع", ["G5012"]], [" ", []], ["ووداعة", ["G4236"]], [" ", []], ["وطول بال", ["G3115"]], ["، ", []], ["محتملين", ["G430"]], [" ", []], ["بعضكم بعضا", ["G240"]], [" في ", []], ["المحبة", ["G26"]], ["،", []]]}, {"c": 4, "v": 3, "text": "مجتهدين أن تحافظوا على وحدة الروح برابطة الوفاق. فإنما هناك جسد واحد وروح واحد،", "groups": [{"kw": "", "raw": "Eph_4:4; Joh_13:34, Joh_17:21-23; Rom_14:17-19; 1Co_1:10, 1Co_12:12, 1Co_12:13; 2Co_13:11; Col_3:13-15; 1Th_5:13; Heb_12:14; Jam_3:17, Jam_3:18", "note": "", "refs": [{"l": "Eph 4:4", "n": "", "vs": [[4, "مثلما دعيتم، جميعكم، دعوة لها رجاء واحد."]]}, {"l": "Joh 13:34", "n": "", "vs": [[34, "وصية جديدة أنا أعطيكم: أحبوا بعضكم بعضا، كما أحببتكم أنا، تحبون بعضكم."]]}, {"l": "Joh 17:21-23", "n": "", "vs": [[21, "ليكون الجميع واحدا؛ أيها الآب، كما أنك أنت في وأنا فيك، ليكونوا هم أيضا واحدا فينا، لكي يؤمن العالم أنك أنت أرسلتني."], [22, "إني أعطيتهم المجد الذي أعطيتني، ليكونوا واحدا كما نحن واحد."], [23, "أنا فيهم، وأنت في، ليكتملوا فيصيروا واحدا، حتى يعرف العالم أنك أرسلتني وأنك أحببتهم كما أحببتني."]]}, {"l": "Rom 14:17-19", "n": "", "vs": [[17, "إذ ليس ملكوت الله بأكل وشرب، بل هو بر وسلام وفرح في الروح القدس."], [18, "فمن خدم المسيح هكذا، كان مقبولا عند الله وممدوحا عند الناس."], [19, "فلنسع إذن وراء ما يؤدي إلى السلام وما يؤدي إلى بنيان بعضنا بعضا."]]}, {"l": "1Co 1:10", "n": "", "vs": [[10, "على أنني أيها الإخوة، أتوسل إليكم باسم ربنا يسوع المسيح أن يكون لجميعكم صوت واحد وأن لا يكون بينكم أي انقسام. وإنما كونوا جميعا موحدي الفكر والرأي."]]}, {"l": "1Co 12:12", "n": "", "vs": [[12, "فكما أن الجسد واحد وله أعضاء كثيرة، ولكن أعضاء الجسد كلها تشكل جسما واحدا مع أنها كثيرة، فكذلك حال المسيح أيضا."]]}, {"l": "1Co 12:13", "n": "", "vs": [[13, "فإننا، بالروح الواحد، قد تعمدنا جميعا لنصير جسدا واحدا، سواء كنا يهودا أم يونانيين، عبيدا أم أحرارا، وقد سقينا جميعا الروح الواحد."]]}, {"l": "2Co 13:11", "n": "", "vs": [[11, "وأخيرا، أيها الإخوة: افرحوا؛ تكملوا؛ تشجعوا؛ اتفقوا في الرأي؛ عيشوا بسلام. وإله المحبة والسلام سيكون معكم!"]]}, {"l": "Col 3:13-15", "n": "", "vs": [[13, "محتملين بعضكم بعضا، ومسامحين بعضكم بعضا. إن كان لأحدكم شكوى على آخر، كما سامحكم الرب، هكذا افعلوا أنتم أيضا."], [14, "وفوق هذا كله البسوا المحبة، فهي رابطة الكمال."], [15, "وليملك في قلوبكم سلام المسيح، فإليه قد دعيتم في الجسد الواحد؛ وكونوا شاكرين!"]]}, {"l": "1Th 5:13", "n": "", "vs": [[13, "وأن تقدروهم تقديرا فائقا في المحبة، من أجل عملهم. عيشوا بسلام بعضكم مع بعض."]]}, {"l": "Heb 12:14", "n": "", "vs": [[14, "اجعلوا هدفكم أن تسالموا جميع الناس، وتعيشوا حياة مقدسة. فبغير قداسة، لا يقدر أحد أن يرى الرب."]]}, {"l": "Jam 3:17", "n": "", "vs": [[17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}, {"l": "Jam 3:18", "n": "", "vs": [[18, "والبر هو ثمر ة ما يزرعه في سلام صانعو السلام."]]}], "kwAr": "", "noteAr": ""}], "arS": [["مجتهدين", ["G4704"]], [" أن ", []], ["تحافظوا", ["G5083"]], [" على ", []], ["وحدة", ["G1775"]], [" ", []], ["الروح", ["G4151"]], [" ", []], ["برابطة", ["G4886"]], [" ", []], ["الوفاق", ["G1515"]], [". فإنما هناك ", []], ["جسد", ["G4983"]], [" ", []], ["واحد", ["G1520"]], [" ", []], ["وروح", ["G4151"]], [" ", []], ["واحد", ["G1520"]], ["،", []]]}, {"c": 4, "v": 4, "text": "مثلما دعيتم، جميعكم، دعوة لها رجاء واحد.", "groups": [{"kw": "one body", "raw": "Eph_2:16, Eph_5:30; Rom_12:4, Rom_12:5; 1Co_10:17, 1Co_12:12, 1Co_12:13, 1Co_12:20; Col_3:15", "note": "", "refs": [{"l": "Eph 2:16", "n": "", "vs": [[16, "ولكي يصالحهما معا في جسد واحد مع الله بالصليب الذي به قتل العداء."]]}, {"l": "Eph 5:30", "n": "", "vs": [[30, "فإننا نحن أعضاء جسده."]]}, {"l": "Rom 12:4", "n": "", "vs": [[4, "فكما أن لنا في جسد واحد أعضاء كثيرة، ولكن ليس لجميع هذه الأعضاء عمل واحد،"]]}, {"l": "Rom 12:5", "n": "", "vs": [[5, "فكذلك نحن الكثيرين جسد واحد في المسيح، وكلنا أعضاء بعضنا لبعض."]]}, {"l": "1Co 10:17", "n": "", "vs": [[17, "فإننا نحن الكثيرين رغيف واحد، أي جسد واحد، لأننا جميعا نشترك في الرغيف الواحد."]]}, {"l": "1Co 12:12", "n": "", "vs": [[12, "فكما أن الجسد واحد وله أعضاء كثيرة، ولكن أعضاء الجسد كلها تشكل جسما واحدا مع أنها كثيرة، فكذلك حال المسيح أيضا."]]}, {"l": "1Co 12:13", "n": "", "vs": [[13, "فإننا، بالروح الواحد، قد تعمدنا جميعا لنصير جسدا واحدا، سواء كنا يهودا أم يونانيين، عبيدا أم أحرارا، وقد سقينا جميعا الروح الواحد."]]}, {"l": "1Co 12:20", "n": "", "vs": [[20, "فالواقع أن الأعضاء كثيرة، والجسد واحد."]]}, {"l": "Col 3:15", "n": "", "vs": [[15, "وليملك في قلوبكم سلام المسيح، فإليه قد دعيتم في الجسد الواحد؛ وكونوا شاكرين!"]]}], "kwAr": "جسد واحد", "noteAr": ""}, {"kw": "one Spirit", "raw": "Eph_2:18, Eph_2:22; Mat_28:19; 1Co_12:4-11; 2Co_11:4", "note": "", "refs": [{"l": "Eph 2:18", "n": "", "vs": [[18, "فبه لنا كلينا اقتراب إلى الآب بروح واحد."]]}, {"l": "Eph 2:22", "n": "", "vs": [[22, "وفيه أنتم أيضا قد بنيتم معا فصرتم مسكنا لله بوجود الروح."]]}, {"l": "Mat 28:19", "n": "", "vs": [[19, "فاذهبوا إذن، وتلمذوا جميع الأمم، وعمدوهم باسم الآب والابن والروح القدس؛"]]}, {"l": "1Co 12:4-11", "n": "", "vs": [[4, "هناك مواهب مختلفة، ولكن الروح واحد."], [5, "وهناك خدمات مختلفة، والرب واحد."], [6, "وهناك أيضا أعمال مختلفة، ولكن الله واحد، وهو يعمل كل شيء في الجميع."], [7, "وإنما كل واحد يوهب موهبة يتجلى الروح فيها لأجل المنفعة."], [8, "فواحد يوهب، عن طريق الروح، كلام الحكمة، وآخر كلام المعرفة وفقا للروح نفسه،"], [9, "وآخر إيمانا بالروح نفسه. ويوهب آخر موهبة شفاء الأمراض بالروح الواحد،"], [10, "وآخر عمل المعجزات، وآخر النبوءة وآخر التمييز بين الأرواح، وآخر التكلم بلغات مختلفة (لم يتعلمها)، وآخر ترجمة اللغات تلك."], [11, "ولكن هذا كله يشغله الروح الواحد نفسه، موزعا المواهب، كما يشاء، على كل واحد."]]}, {"l": "2Co 11:4", "n": "", "vs": [[4, "فإذا كان من يأتيكم يبشر بيسوع آخر لم نبشر به نحن أو كنتم تنالون روحا آخر لم تنالوه، أو تقبلون إنجيلا لم تقبلوه، فإنكم تحتملون ذلك بكل سرور."]]}], "kwAr": "وروح واحد", "noteAr": ""}, {"kw": "as", "raw": "Eph_4:1, Eph_1:18; Jer_14:8, Jer_17:7; Act_15:11; Col_1:5; 2Th_2:16; 1Ti_1:1; Tit_1:2; Tit_2:13, Tit_3:7; Heb_6:18, Heb_6:19; 1Pe_1:3, 1Pe_1:4, 1Pe_1:21; 1Jo_3:3", "note": "", "refs": [{"l": "Eph 4:1", "n": "", "vs": [[1, "... إذن، أنا السجين في الرب، أناشدكم أن تسلكوا سلوكا يليق بالدعوة التي إليها دعيتم،"]]}, {"l": "Eph 1:18", "n": "", "vs": [[18, "إذ تستنير بصائر قلوبكم، فتعلموا ما في دعوته لكم من رجاء، وما هو غنى مجد ميراثه في القديسين،"]]}, {"l": "Jer 14:8", "n": "", "vs": [[8, "يارجاء إسرائيل ومخلصه في وقت الضيق، لماذا تكون كغريب في الأرض، وكعابر سبيل يميل ليبيت ثم يمضي؟"]]}, {"l": "Jer 17:7", "n": "", "vs": [[7, "ولكن مبارك الرجل الذي يتكل على الرب، ويتخذه معتمدا له،"]]}, {"l": "Act 15:11", "n": "", "vs": [[11, "فنحن نؤمن بأننا نخلص، كما يخلصون هم، بنعمة الرب يسوع."]]}, {"l": "Col 1:5", "n": "", "vs": [[5, "بسبب الرجاء المحفوظ لكم في السماوات، الرجاء الذي سمعتم به سابقا في كلمة الحق التي في الإنجيل"]]}, {"l": "2Th 2:16", "n": "", "vs": [[16, "وليت ربنا يسوع المسيح نفسه، والله أبانا، الذي أحبنا ووهبنا بنعمته راحة أبدية ورجاء صالحا،"]]}, {"l": "1Ti 1:1", "n": "", "vs": [[1, "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"]]}, {"l": "Tit 1:2", "n": "", "vs": [[2, "في رجاء الحياة الأبدية، التي وعد بها الله المنزه عن الكذب، من قبل أزمنة الأزل،"]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "Tit 3:7", "n": "", "vs": [[7, "حتى إذا تبررنا بنعمته، نصير ورثة، وفقا لرجائنا بالحياة الأبدية."]]}, {"l": "Heb 6:18", "n": "", "vs": [[18, "فاستنادا إلى وعد الله وقسمه، وهما أمران ثابتان لا يتغيران ويستحيل أن يكذب الله فيهما، نحصل على تشجيع قوي، بعدما التجأنا إلى التمسك بالرجاء الموضوع أمامنا."]]}, {"l": "Heb 6:19", "n": "", "vs": [[19, "هذا الرجاء هو لنا بمثابة مرساة أمينة ثابتة تشد نفوسنا إلى ما وراء الحجاب السماوي."]]}, {"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}, {"l": "1Pe 1:4", "n": "", "vs": [[4, "وإرثا لا يفنى ولا يفسد ولا يزول،"]]}, {"l": "1Pe 1:21", "n": "", "vs": [[21, "أنتم الذين تؤمنون بالله بالمسيح الذي أقامه من الموت وأعطاه المجد، حتى يكون الله غاية إيمانكم ورجائكم."]]}, {"l": "1Jo 3:3", "n": "", "vs": [[3, "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر."]]}], "kwAr": "مثلما دعيتم", "noteAr": ""}], "arS": [["مثلما ", []], ["دعيتم", ["G2564"]], ["، جميعكم، ", []], ["دعوة", ["G2821"]], [" لها ", []], ["رجاء", ["G1680"]], [" ", []], ["واحد", ["G3391"]], [".", []]]}, {"c": 4, "v": 5, "text": "ولكم رب واحد، وإيمان واحد، ومعمودية واحدة،", "groups": [{"kw": "One Lord", "raw": "Act_2:36, Act_10:36; Rom_14:8, Rom_14:9; 1Co_1:2, 1Co_1:13, 1Co_8:6, 1Co_12:5; Phi_2:11, Phi_3:8", "note": "", "refs": [{"l": "Act 2:36", "n": "", "vs": [[36, "فليعلم يقينا بنو إسر ائيل جميعا، أن الله قد جعل يسوع، هذا الذي صلبتموه أنتم، ربا ومسيحا!»"]]}, {"l": "Act 10:36", "n": "", "vs": [[36, "وقد أرسل كلمته إلى بني إسرائيل، وبشرهم بالسلام بواسطة يسوع المسيح، رب الجميع."]]}, {"l": "Rom 14:8", "n": "", "vs": [[8, "فإن حيينا، فللرب نحيا؛ وإن متنا فللرب نموت. فسواء حيينا أم متنا، فإنما نحن للرب."]]}, {"l": "Rom 14:9", "n": "", "vs": [[9, "فإن المسيح مات وعاد حيا لأجل هذا: أن يكون سيدا على الأموات والأحياء."]]}, {"l": "1Co 1:2", "n": "", "vs": [[2, "إلى كنيسة الله في مدينة كورنثوس، إلى الذين تقدسوا في المسيح يسوع، المدعوين، القديسين؛ وإلى جميع الذين يدعون باسم ربنا يسوع المسيح في كل مكان ربا لهم ولنا."]]}, {"l": "1Co 1:13", "n": "", "vs": [[13, "فهل تجزأ المسيح؟ أم أن بولس صلب لأجلكم، أو باسم بولس تعمدتم؟"]]}, {"l": "1Co 8:6", "n": "", "vs": [[6, "فليس عندنا نحن إلا إله واحد هو الآب الذي منه كل شيء، ونحن له؛ ورب واحد هو يسوع المسيح الذي به كل شيء ونحن به."]]}, {"l": "1Co 12:5", "n": "", "vs": [[5, "وهناك خدمات مختلفة، والرب واحد."]]}, {"l": "Phi 2:11", "n": "", "vs": [[11, "ولكي يعترف كل لسان بأن يسوع المسيح هو الرب، لمجد الله الآب."]]}, {"l": "Phi 3:8", "n": "", "vs": [[8, "بل إني أعتبر كل شيء خسارة، من أجل امتياز معرفة المسيح يسوع ربي؛ فمن أجله تحملت خسارة كل شيء، وأعتبر كل شيء نفاية، لكي أربح المسيح"]]}], "kwAr": "رب واحد", "noteAr": ""}, {"kw": "one faith", "raw": "Eph_4:13; Rom_3:30; 2Co_11:4; Gal_1:6, Gal_1:7, Gal_5:6; Tit_1:1, Tit_1:4; Heb_13:7; Jam_2:18; 2Pe_1:1; Jud_1:3, Jud_1:20", "note": "", "refs": [{"l": "Eph 4:13", "n": "", "vs": [[13, "حتى نصل جميعا إلى وحدة الإيمان ووحدة المعرفة لابن الله، إلى إنسان تام البلوغ، إلى مقدار قامة ملء المسيح."]]}, {"l": "Rom 3:30", "n": "", "vs": [[30, "مادام الله الواحد هو الذي سيبرر أهل الختان على أساس الإيمان، وأهل عدم الختان على أساس الإيمان."]]}, {"l": "2Co 11:4", "n": "", "vs": [[4, "فإذا كان من يأتيكم يبشر بيسوع آخر لم نبشر به نحن أو كنتم تنالون روحا آخر لم تنالوه، أو تقبلون إنجيلا لم تقبلوه، فإنكم تحتملون ذلك بكل سرور."]]}, {"l": "Gal 1:6", "n": "", "vs": [[6, "عجبا! كيف تتحولون بمثل هذه السرعة عن الذي دعاكم بنعمة المسيح، وتنصرفون إلى إنجيل غريب؟"]]}, {"l": "Gal 1:7", "n": "", "vs": [[7, "لا أعني أن هنالك إنجيلا آخر، بل إنما هنالك بعض (المعلمين) الذين يثيرون البلبلة بينكم، راغبين في تحوير إنجيل المسيح."]]}, {"l": "Gal 5:6", "n": "", "vs": [[6, "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة."]]}, {"l": "Tit 1:1", "n": "", "vs": [[1, "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"]]}, {"l": "Tit 1:4", "n": "", "vs": [[4, "إلى تيطس، ولدي الحقيقي بالنسبة إلى الإيمان المشترك بيننا."]]}, {"l": "Heb 13:7", "n": "", "vs": [[7, "اذكروا دائما مرشديكم الذين علموكم كلام الله. تأملوا سيرتهم حتى النهاية، واقتدوا بإيمانهم."]]}, {"l": "Jam 2:18", "n": "", "vs": [[18, "وربما قال أحدكم: «أنت لك إيمان وأنا لي أعمال». أرني كيف يكون إيمانك من غير أعمال، وأنا أريك كيف يكون إيماني بأعمالي."]]}, {"l": "2Pe 1:1", "n": "", "vs": [[1, "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"]]}, {"l": "Jud 1:3", "n": "", "vs": [[3, "أيها الأحباء، كنت قد نويت أن أكتب إليكم في موضوع الخلاص الذي نشترك فيه جميعا. ولكن، أراني الآن مضطرا لأن أكتب لأشجعكم على الجهاد في سبيل الإيمان الذي سلم مرة واحدة للقديسين."]]}, {"l": "Jud 1:20", "n": "", "vs": [[20, "وأما أنتم أيها الأحباء، فابنوا أنفسكم على إيمانكم الأقدس، وصلوا دائما في الروح القدس."]]}], "kwAr": "وإيمان واحد", "noteAr": ""}, {"kw": "one baptism", "raw": "Mat_28:19; Rom_6:3, Rom_6:4; 1Co_12:13; Gal_3:26-28; Heb_6:6; 1Pe_3:21", "note": "", "refs": [{"l": "Mat 28:19", "n": "", "vs": [[19, "فاذهبوا إذن، وتلمذوا جميع الأمم، وعمدوهم باسم الآب والابن والروح القدس؛"]]}, {"l": "Rom 6:3", "n": "", "vs": [[3, "أم يخفى عليكم أننا جميعا، نحن الذين تعمدنا اتحادا بالمسيح يسوع، قد تعمدنا اتحادا بموته؟"]]}, {"l": "Rom 6:4", "n": "", "vs": [[4, "وبسبب ذلك دفنا معه بالمعمودية للموت، حتى كما أقيم المسيح من الأموات بمجد الآب، كذلك نسلك نحن أيضا في حياة جديدة."]]}, {"l": "1Co 12:13", "n": "", "vs": [[13, "فإننا، بالروح الواحد، قد تعمدنا جميعا لنصير جسدا واحدا، سواء كنا يهودا أم يونانيين، عبيدا أم أحرارا، وقد سقينا جميعا الروح الواحد."]]}, {"l": "Gal 3:26-28", "n": "", "vs": [[26, "فإنكم جميعا أبناء الله بالإيمان بالمسيح يسوع."], [27, "لأنكم، جميع الذين تعمدتم في المسيح، قد لبستم المسيح."], [28, "لا فرق بعد الآن بين يهودي ويوناني، أو عبد وحر، أو ذكر وأنثى، لأنكم جميعا واحد في المسيح يسوع."]]}, {"l": "Heb 6:6", "n": "", "vs": [[6, "ثم ارتدوا إلى تلك الأسس القديمة، أولئك يستحيل عليهم أن يتجددوا ثانية فيعودوا إلى التوبة. فهم يجنون على أنفسهم إذ يصلبون ابن الله مرة ثانية ويجعلونه عرضة للعار."]]}, {"l": "1Pe 3:21", "n": "", "vs": [[21, "وعملية النجاة هذه مصورة في المعمودية التي لا نقصد بها أن نغتسل من أوساخ أجسامنا، بل هي تعهد ضمير صالح أمام الله بفضل قيامة يسوع المسيح،"]]}], "kwAr": "ومعمودية واحدة", "noteAr": ""}], "arS": [["ولكم ", []], ["رب", ["G2962"]], [" ", []], ["واحد", ["G1520"]], ["، ", []], ["وإيمان", ["G4102"]], [" ", []], ["واحد", ["G3391"]], ["، ", []], ["ومعمودية", ["G908"]], [" ", []], ["واحدة", ["G1520"]], ["،", []]]}, {"c": 4, "v": 6, "text": "وإله وآب واحد للجميع، وهو فوق الجميع وبالجميع وفي الجميع.", "groups": [{"kw": "God", "raw": "Eph_6:23; Num_16:22; Isa_63:16; Mal_2:10; Mat_6:9; Joh_20:17; 1Co_8:6, 1Co_12:6; Gal_3:26-28, Gal_4:3-7; 1Jo_3:1-3", "note": "", "refs": [{"l": "Eph 6:23", "n": "", "vs": [[23, "سلام إلى الإخوة، ومحبة مع إيمان، من الله الآب والرب يسوع المسيح!"]]}, {"l": "Num 16:22", "n": "", "vs": [[22, "فانطرحا على وجهيهما وابتهلا قائلين: «اللهم، ياإله أرواح جميع البشر، أتسخط على الجماعة كلها من أجل خطيئة رجل واحد؟»"]]}, {"l": "Isa 63:16", "n": "", "vs": [[16, "فأنت هو أبونا، مع أن إبراهيم لا يعرفنا، وإسرائيل لا يعترف بنا، فأنت أيها الرب، هو أبونا، واسمك فادينا منذ القديم."]]}, {"l": "Mal 2:10", "n": "", "vs": [[10, "أليس لنا جميعا أب واحد؟ ألم يخلقنا إله واحد، فما بالنا يغدر أحدنا بالآخر وندنس عهد آبائنا؟"]]}, {"l": "Mat 6:9", "n": "", "vs": [[9, "فصلوا أنتم مثل هذه الصلاة: أبانا الذي في السماوات، ليتقدس اسمك!"]]}, {"l": "Joh 20:17", "n": "", "vs": [[17, "فقال لها: «لا تمسكي بي! فإني لم أصعد بعد إلى الآب، بل اذهبي إلى إخوتي وقولي لهم: إني سأصعد إلى أبي وأبيكم، وإلهي وإلهكم!»"]]}, {"l": "1Co 8:6", "n": "", "vs": [[6, "فليس عندنا نحن إلا إله واحد هو الآب الذي منه كل شيء، ونحن له؛ ورب واحد هو يسوع المسيح الذي به كل شيء ونحن به."]]}, {"l": "1Co 12:6", "n": "", "vs": [[6, "وهناك أيضا أعمال مختلفة، ولكن الله واحد، وهو يعمل كل شيء في الجميع."]]}, {"l": "Gal 3:26-28", "n": "", "vs": [[26, "فإنكم جميعا أبناء الله بالإيمان بالمسيح يسوع."], [27, "لأنكم، جميع الذين تعمدتم في المسيح، قد لبستم المسيح."], [28, "لا فرق بعد الآن بين يهودي ويوناني، أو عبد وحر، أو ذكر وأنثى، لأنكم جميعا واحد في المسيح يسوع."]]}, {"l": "Gal 4:3-7", "n": "", "vs": [[3, "وهذه حالنا نحن أيضا: فإذ كنا قاصرين، كنا في حالة العبودية لمبادىء العالم."], [4, "ولكن لما جاء تمام الزمان، أرسل الله ابنه، وقد ولد من امرأة وكان خاضعا للشريعة،"], [5, "ليحرر بالفداء أولئك الخاضعين للشريعة، فننال جميعا مقام أبناء الله."], [6, "وبما أنكم أبناء له، أرسل الله إلى قلوبنا روح ابنه، مناديا: «أبا، ياأبانا»."], [7, "إذن، أنت لست عبدا بعد الآن، بل أنت ابن. ومادمت ابنا، فقد جعلك الله وريثا أيضا."]]}, {"l": "1Jo 3:1-3", "n": "", "vs": [[1, "تأملوا ما أعظم المحبة التي أحبنا بها الآب حتى صرنا ندعى «أولاد الله»، ونحن أولاده حقا. ولكن، بما أن أهل العالم لا يعرفون الله، فهم لا يعرفوننا."], [2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"], [3, "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر."]]}], "kwAr": "وإله وآب واحد للجميع", "noteAr": ""}, {"kw": "who", "raw": "Eph_1:21; Gen_14:19; 1Ch_29:11, 1Ch_29:12; Psa_95:3; Isa_40:11-17, Isa_40:21-23; Jer_10:10-13; Dan_4:34, Dan_4:35, Dan_5:18-23; Mat_6:13; Rom_11:36; Rev_4:8-11", "note": "", "refs": [{"l": "Eph 1:21", "n": "", "vs": [[21, "أرفع جدا من كل رئاسة وسلطة وقوة وسيا دة، ومن كل اسم يسمى، لا في هذا العالم وحسب، بل في ذلك الآتي أيضا."]]}, {"l": "Gen 14:19", "n": "", "vs": [[19, "وباركه قائلا: «لتكن عليك ياأبرام بركة الله العلي، مالك السماوات والأرض."]]}, {"l": "1Ch 29:11", "n": "", "vs": [[11, "لك يارب العظمة والسطوة والجلال والبهاء والمجد، لأن لك كل ما في السماء والأرض. أنت يارب صاحب الملك وقد تعاليت فوق رؤوس الجميع."]]}, {"l": "1Ch 29:12", "n": "", "vs": [[12, "أنت مصدر كل غنى وكرامة، وأنت المتسلط على الجميع، والمالك للقوة والسطوة، وأنت القادر على تعظيم الجميع وتقوية عزيمتهم."]]}, {"l": "Psa 95:3", "n": "", "vs": [[3, "لأن الرب إله عظيم، وملك كبير على جميع الآلهة."]]}, {"l": "Isa 40:11-17", "n": "", "vs": [[11, "يرعى قطيعه كراع، ويجمع الحملان بذراعه، وفي أحضانه يحملها ويقود المرضعات برفق."], [12, "من كال المياه بكفه وقاس السماوات بالشبر وكال تراب الأرض بالكيل ووزن الجبال بقبان، والتلال بميزان؟"], [13, "من أرشد روح الرب أو كان له مشيرا فعلمه؟"], [14, "هل طلب الرب مشورة من أحد؟ من علمه طريق العدل ولقنه المعرفة وأراه سبيل الفهم؟"], [15, "إن الشعوب كنقطة من دلو، وكغبار الميزان. يرفع الجزائر وكأنها ذرة هباء."], [16, "لبنان بأسره لا يكفي أن يكون للوقود، وحيوانه لا يكفي لذبيحة محرقة."], [17, "جميع الأمم لا تحسب لديه شيئا، وهي في عينيه عدم وخواء."]]}, {"l": "Isa 40:21-23", "n": "", "vs": [[21, "ألم تعلموا؟ ألم تسمعوا؟ ألم يبلغكم منذ البدء؟ ألم تفهموا من إرساء أسس الأرض؟"], [22, "إنه هو الجالس على كرة الأرض وسكانها كالجراد. هو الباسط السماوات كسرادق، وينشرها كخيمة للسكنى،"], [23, "يجعل العظماء كالعدم، والحكام كلا شيء."]]}, {"l": "Jer 10:10-13", "n": "", "vs": [[10, "أما الرب فهو الإله الحق، الإله الحي والملك السرمدي. ترتعد الأرض أمام غضبه ولا تتحمل الأمم فرط سخطه."], [11, "«وهذا ما تقولونه لهم: إن الآلهة التي لم تصنع السماوات والأرض يجب أن تستأصل من الأرض ومن تحت السماء»."], [12, "فالرب هو الذي صنع السماوات والأرض بقدرته، وأسس الدنيا بحكمته ومد السماوات بفطنته."], [13, "ما إن ينطق بصوته حتى تتجمع غمار المياه في السماوات، وتصعد السحب من أقاصي الأرض. يجعل للمطر بروقا، ويطلق الريح من خزائنه."]]}, {"l": "Dan 4:34", "n": "", "vs": [[34, "وفي ختام السبعة الأزمنة، أنا نبوخذناصر، التفت نحو السماء، فرجع إلي عقلي، وباركت العلي وسبحت وحمدت الحي الأبدي ذا السلطان السرمدي، والذي ملكه على مدى الأجيال."]]}, {"l": "Dan 4:35", "n": "", "vs": [[35, "وعرفت أن كل أهل الأرض لا يحسبون شيئا، وأنه يفعل ما يشاء في جند السماء وسكان الأرض، وليس من يكف يده أو يقول له: ماذا تفعل؟"]]}, {"l": "Dan 5:18-23", "n": "", "vs": [[18, "أيها الملك قد وهب الله العلي أباك نبوخذناصر ملكا وعظمة وجلالا وبهاء."], [19, "ولفرط عظمته التي أنعم الله بها عليه، كانت جميع الأمم والشعوب من كل لسان ترتعد أمامه وتفزع، فكان يقتل من يشاء، ويستحيي من يشاء، يرفع من يشاء ويضع من يشاء."], [20, "وعندما شمخ قلبه وقست روحه تعنتا، عزل عن عرش ملكه وجرد من جلاله،"], [21, "وطرد من بين الناس، وماثل عقله الحيوانات، وصار مأواه مع الحمير الوحشية، فأطعموه العشب كالثيران، وابتل جسمه بندى السماء، حتى علم أن الله العلي هو المتسلط في مملكة الناس، وأنه يولي عليها من يشاء."], [22, "وأنت يابيلشاصر ابنه لم يتواضع قلبك، مع علمك بكل هذا،"], [23, "بل تغطرست على رب السماء، فأحضروا أمامك آنية هيكله لتشرب بها الخمر، أنت ونبَلاء دولتك وزوجاتك ومحظياتك، وسبحت آلهة الفضة والذهب والنحاس والحديد والخشب والحجر التي لا تبصر ولا تسمع ولا تدرك، أما الله الذي بيده روحك وله كل طرقك، فلم تمجده."]]}, {"l": "Mat 6:13", "n": "", "vs": [[13, "ولا تدخلنا في تجربة، لكن نجنا من الشرير، لأن لك الملك والقوة والمجد إلى الأبد. آمين."]]}, {"l": "Rom 11:36", "n": "", "vs": [[36, "فإن منه وبه وله كل شيء. له المجد إلى الأبد. آمين!"]]}, {"l": "Rev 4:8-11", "n": "", "vs": [[8, "وكان لكل كائن منها ستة أجنحة، تكسوها عيون من الداخل ومن الخارج. وهذه الكائنات الحية الأربعة تهتف ليلا ونهارا دون انقطاع قائلة: «قدوس قدوس قدوس، الرب الإله القادر على كل شيء، الذي كان والكائن والذي سيأتي»."], [9, "وكلما قدمت هذه الكائنات التمجيد والإجلال والحمد للجالس على العرش، الحي إلى أبد الآبدين،"], [10, "يجثو الشيوخ الأربعة والعشرون أمام الجالس على العرش ساجدين للحي إلى أبد الآبدين، ويلقون أكاليلهم أمام عرشه وهم يهتفون:"], [11, "«مستحق أنت ياربنا وإلهنا المجد والإجلال والقدرة، لأنك خلقت الأشياء كلها، وهي بإرادتك كائنة وقد خلقت!»"]]}], "kwAr": "وهو فوق الجميع", "noteAr": ""}, {"kw": "and in", "raw": "Eph_2:22, Eph_3:17; Joh_14:23, Joh_17:26; 2Co_6:16; 1Jo_3:24, 1Jo_4:12-15", "note": "", "refs": [{"l": "Eph 2:22", "n": "", "vs": [[22, "وفيه أنتم أيضا قد بنيتم معا فصرتم مسكنا لله بوجود الروح."]]}, {"l": "Eph 3:17", "n": "", "vs": [[17, "ليسكن المسيح في قلوبكم بالإيمان؛ حتى إذا تأصلتم وتأسستم في المحبة،"]]}, {"l": "Joh 14:23", "n": "", "vs": [[23, "أجابه يسوع: «من يحبني يعمل بكلمتي، ويحبه أبي، وإليه نأتي، وعنده نجعل لنا منزلا."]]}, {"l": "Joh 17:26", "n": "", "vs": [[26, "وقد عرفتهم اسمك، وسأعرفهم أيضا، لتكون فيهم المحبة التي أحببتني بها، وأكون أنا فيهم»."]]}, {"l": "2Co 6:16", "n": "", "vs": [[16, "وأي وفاق لهيكل الله مع الأصنام؟ فإننا نحن هيكل الله الحي، وفقا لما قاله الله : «سأسكن في وسطهم، وأسير بينهم، وأكون إلههم وهم يكونون شعبا لي…"]]}, {"l": "1Jo 3:24", "n": "", "vs": [[24, "وكل من يطيع وصايا الله، فإنه يثبت في
