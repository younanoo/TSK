وءة ولمسح قدوس القدوسين."], [25, "لهذا فاعلم وافهم أن الحقبة الممتدة منذ صدور الأمر بإعادة بناء أورشليم إلى مجيء المسيح، سبعة أسابيع، ثم اثنان وستون أسبوعا يبنى في غضونها سوق وخليج. إنما تكون تلك أزمنة ضيق."], [26, "وبعد اثنين وستين أسبوعا يقتل المسيح، ولكن ليس من أجل نفسه، ويدمر شعب رئيس آت المدينة والقدس، وتقبل آخرتها كطوفان، وتستمر الحرب حتى النهاية، ويعم الخراب المقضي به."], [27, "ويبرم عهدا ثابتا مع كثيرين لمدة أسبوع واحد، ولكنه في وسط الأسبوع يبطل الذبيحة والتقدمة، ويقيم على جناح الهيكل رجاسة الخراب، إلى أن يتم القضاء، فينصب العقاب على المخرب»."]]}, {"l": "Amo 9:11", "n": "", "vs": [[11, "في ذلك اليوم أقيم مسكن داود الذي تهاوى، وأسد ثغراته وأعمر خرائبه وأعيد بناءه كالعهد به في الأيام الغابرة."]]}, {"l": "Mic 4:1", "n": "", "vs": [[1, "ويكون في آخر الأيام أن جبل هيكل الرب يصبح أشهر الجبال، ويعلو فوق كل التلال، فتتقاطر إليه شعوب عديدة،"]]}, {"l": "Mic 4:2", "n": "", "vs": [[2, "وتقبل إليه أمم كثيرة قائلة: «تعالوا لنصعد إلى جبل الرب، إلى هيكل يعقوب ليعلمنا طرقه فنسلك في سبله، لأن من صهيون تخرج الشريعة ومن أورشليم تذاع كلمة الرب»."]]}, {"l": "Mal 3:1", "n": "", "vs": [[1, "«ها أنا أرسل رسولي فيمهد الطريق أمامي ويأتي الرب الذي تطلبونه فجأة إلى هيكله ويقبل أيضا ملاك العهد الذي تسرون به» يقول الرب القدير"]]}, {"l": "1Co 10:11", "n": "", "vs": [[11, "فهذه الأمور كلها حدثت لهم لتكون مثالا، وقد كتبت إنذارا لنا، نحن الذين تناهت إلينا أواخر الأزمنة."]]}, {"l": "Gal 4:4", "n": "", "vs": [[4, "ولكن لما جاء تمام الزمان، أرسل الله ابنه، وقد ولد من امرأة وكان خاضعا للشريعة،"]]}, {"l": "Heb 1:2", "n": "", "vs": [[2, "أما الآن، في هذا الزمن الأخير، فقد كلمنا بالابن، الذي جعله وارثا لكل شيء، وبه قد خلق الكون كله!"]]}, {"l": "Heb 9:10", "n": "", "vs": [[10, "إذ إن نظام العهد السابق قد اقتصر على تحريم بعض المأكولات والمشروبات وتحليل غيرها، وعلى وضع النظم المختصة بطقوس الاغتسال المختلفة. بل إن كل ما ضمه ذلك النظام، كان قوانين جسدية ينتهي عملها حين يأتي وقت الإصلاح."]]}, {"l": "Heb 11:40", "n": "", "vs": [[40, "ولكن الله سبق فأعد لنا ما هو أفضل، وذلك حتى لا يكملوا بمعزل عنا."]]}, {"l": "1Pe 1:20", "n": "", "vs": [[20, "ومع أن الله كان قد عين المسيح لهذا الغرض قبل تأسيس العالم، فهو لم يعلنه إلا في هذا الزمن الأخير لفائدتكم"]]}], "kwAr": "لأجل تدبير تمام الأزمنة", "noteAr": ""}, {"kw": "he", "raw": "Eph_1:22, Eph_2:15, Eph_3:15; Gen_49:10; Mat_25:32; 1Co_3:22, 1Co_3:23, 1Co_11:3; Phi_2:9, Phi_2:10; Col_1:20, Col_3:11; Heb_12:22-24; Rev_5:9, Rev_7:4-12, Rev_19:4-6", "note": "", "refs": [{"l": "Eph 1:22", "n": "", "vs": [[22, "وأخضع كل شيء تحت قدميه، وإياه جعل فوق كل شيء رأسا للكنيسة"]]}, {"l": "Eph 2:15", "n": "", "vs": [[15, "أي العداء: إذ أبطل بجسده شريعة الوصايا ذات الفرائض، لكي يكون من الفريقين إنسانا واحدا جديدا، إذ أحل السلام بينهما،"]]}, {"l": "Eph 3:15", "n": "", "vs": [[15, "الذي هو أصل كل أبوة في السماوات وعلى الأرض،"]]}, {"l": "Gen 49:10", "n": "", "vs": [[10, "لا يزول صولجان الملك من يهوذا ولا مشترع من صلبه حتى يأتي شيلوه (ومعناه: من له الأمر) فتطيعه الشعوب."]]}, {"l": "Mat 25:32", "n": "", "vs": [[32, "وتجتمع أمامه الشعوب كلها، فيفصل بعضهم عن بعض كما يفصل الراعي الغنم عن المعاز،"]]}, {"l": "1Co 3:22", "n": "", "vs": [[22, "أبولس أم أبلوس أم بطرس أم العالم أم الحيا ة أم الموت أم الحاضر أم المستقبل: هذه الأمور كلها لكم،"]]}, {"l": "1Co 3:23", "n": "", "vs": [[23, "وأنتم للمسيح، والمسيح لله."]]}, {"l": "1Co 11:3", "n": "", "vs": [[3, "ولكني أريد أن تعلموا أن المسيح هو الرأس لكل رجل؛ أما رأس المرأة فهو الرجل، ورأس المسيح هو الله ."]]}, {"l": "Phi 2:9", "n": "", "vs": [[9, "لذلك أيضا رفعه الله عاليا، وأعطاه الاسم الذي يفوق كل اسم،"]]}, {"l": "Phi 2:10", "n": "", "vs": [[10, "لكي تنحني سجودا لاسم يسوع كل ركبة، سواء في السماء أم على الأرض أم تحت الأرض،"]]}, {"l": "Col 1:20", "n": "", "vs": [[20, "وأن يصالح به كل شيء مع نفسه، إذ أحل السلام بدمه على الصليب، فبه يصالح كل شيء، سواء كان ما على الأرض أو ما في السماوات."]]}, {"l": "Col 3:11", "n": "", "vs": [[11, "وفيه لا فرق بين يوناني ويهودي، أو مختون وغير مختون، أو متحضر ومتخلف، أو عبد وحر، بل المسيح هو الكل وفي الكل."]]}, {"l": "Heb 12:22-24", "n": "", "vs": [[22, "ولكنكم قد اقتربتم إلى جبل صهيون، إلى مدينة الله الحي، أورشليم السماوية. بل تقدمتم إلى حفلة يجتمع فيها عدد لا يحصى من الملائكة،"], [23, "إلى كنيسة تجمع أبناء لله أبكارا، أسماؤهم مكتوبة في السماء. بل إلى الله نفسه، ديان الجميع، وإلى أرواح أناس بررهم الله وجعلهم كاملين."], [24, "كذلك، تقدمتم إلى يسوع، وسيط العهد الجديد، وإلى دمه المرشوش الذي يتكلم مطالبا بأفضل مما طالب به دم هابيل."]]}, {"l": "Rev 5:9", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"]]}, {"l": "Rev 7:4-12", "n": "", "vs": [[4, "وسمعت أن عدد المختومين، مئة وأربعة وأربعون ألفا، من جميع أسباط بني إسرائيل:"], [5, "من سبط يهوذا ختم اثنا عشر ألفا؛ ومن سبط رأوبين اثنا عشر ألفا؛ ومن سبط جاد اثنا عشر ألفا؛"], [6, "ومن سبط أشير اثنا عشر ألفا؛ ومن سبط نفتالي اثنا عشر ألفا؛ ومن سبط منسى اثنا عشر ألفا"], [7, "ومن سبط شمعون اثنا عشر ألفا؛ ومن سبط لاوي اثنا عشر ألفا؛ ومن سبط يساكر اثنا عشر ألفا؛"], [8, "ومن سبط زبولون اثنا عشر ألفا؛ ومن سبط يوسف اثنا عشر ألفا؛ ومن سبط بنيامين ختم اثنا عشر ألفا."], [9, "ثم نظرت، فرأيت جمعا كثيرا لا يحصى، من كل أمة وقبيلة وشعب ولغة، واقفين أمام العرش وأمام الحمل، وقد ارتدوا ثيا با بيضاء، وأمسكوا بأيديهم سعف النخل،"], [10, "وهم يهتفون بصوت عال: «الخلاص من عند إلهنا الجالس على العرش ومن عند الحمل!»"], [11, "واجتمع الملائكة جميعا حول العرش، ومعهم الشيوخ والكائنات الحية الأربعة، وخروا على وجوههم أمام العرش سجودا لله،"], [12, "قائلين: «آمين! لإلهنا البركة والمجد والحكمة والشكر والإجلال والقدرة والقوة إلى أبد الآبدين. آمين!»"]]}, {"l": "Rev 19:4-6", "n": "", "vs": [[4, "وجثا الشيوخ الأربعة والعشرون والكائنات الحية الأربعة سجودا لله الجالس على العرش، وهتفوا: «آمين! هللويا!»"], [5, "وخرج من العرش صوت يقول: «سبحوا إلهنا ياجميع عبيده الذين يتقونه صغارا وكبارا!»"], [6, "ثم سمعت صوتا كأنه صوت جمع كبير أو شلال غزير أو رعد شديد، يقول: «هللويا! فإن الرب الإله القادر على كل شيء قد ملك،"]]}], "kwAr": "حين يوحد كل شيء", "noteAr": ""}, {"kw": "heaven", "raw": "Gr. the heavens", "note": "Gr. the heavens", "refs": [], "kwAr": "في السماوات", "noteAr": "في اليونانية: السماوات."}], "arS": [["لأجل ", []], ["تدبير", ["G3622"]], [" ", []], ["تمام", ["G4138"]], [" ", []], ["الأزمنة", ["G2540"]], ["، حين ", []], ["يوحد", ["G346"]], [" ", []], ["كل شيء", ["G3956"]], [" تحت رئاسة ", []], ["المسيح", ["G5547"]], ["، سواء الأشياء التي في ", []], ["السماوات", ["G3772"]], [" والتي على ", []], ["الأرض", ["G1093"]], [".", []]]}, {"c": 1, "v": 11, "text": "وفي المسيح أيضا قد حصلنا على الميراث الذي سبق أن عينا له، وفقا لقصده، هو الذي يعمل كل شيء كما تقضي مشيئته.", "groups": [{"kw": "we", "raw": "Eph_1:14; Psa_37:18; Act_20:32, Act_26:18; Rom_8:17; Gal_3:18; Col_1:12, Col_3:24; Tit_3:7; Jam_2:5; 1Pe_1:4, 1Pe_3:9", "note": "", "refs": [{"l": "Eph 1:14", "n": "", "vs": [[14, "هذا الروح الذي هو عربون ميراثنا إلى أن يتم فداء ما قد اقتني: بغر ض مدح مجده."]]}, {"l": "Psa 37:18", "n": "", "vs": [[18, "الرب عليم بأيام الكاملين، وميراثهم يدوم إلى الأبد."]]}, {"l": "Act 20:32", "n": "", "vs": [[32, "وا لآن أسلمكم إلى الله وإلى كلمة نعمته القادرة أن تبنيكم وتعطيكم ميراثا تشتركون فيه مع جميع المقدسين لله."]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "Rom 8:17", "n": "", "vs": [[17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}, {"l": "Gal 3:18", "n": "", "vs": [[18, "فلو كان الميراث يتم على مبدأ الشريعة، لما كان الأمر متعلقا بعد بالوعد. غير أن الله ، بالوعد، أنعم بالميراث على إبراهيم."]]}, {"l": "Col 1:12", "n": "", "vs": [[12, "رافعين الشكر بفرح للآب الذي جعلكم أهلا للاشتراك في ميراث القديسين في (ملكوت) النور،"]]}, {"l": "Col 3:24", "n": "", "vs": [[24, "عالمين أنكم سوف تنالون المكافأة بالميراث من الرب. فإنما أنتم عبيد تخدمون الرب المسيح"]]}, {"l": "Tit 3:7", "n": "", "vs": [[7, "حتى إذا تبررنا بنعمته، نصير ورثة، وفقا لرجائنا بالحياة الأبدية."]]}, {"l": "Jam 2:5", "n": "", "vs": [[5, "فياإخوتي الأحباء، أما اختار الله الفقراء في نظر الناس ليجعلهم أغنياء في الإيمان، ويعطيهم حق الإرث في الملكوت الذي وعد به محبيه؟"]]}, {"l": "1Pe 1:4", "n": "", "vs": [[4, "وإرثا لا يفنى ولا يفسد ولا يزول،"]]}, {"l": "1Pe 3:9", "n": "", "vs": [[9, "لا تبادلوا الشر بشر، ولا الشتيمة بشتيمة. بل بالعكس: باركوا، فترثوا البركة، لأنه لهذا دعاكم الله ."]]}], "kwAr": "قد حصلنا على الميراث", "noteAr": ""}, {"kw": "being", "raw": "Eph_1:5", "note": "", "refs": [{"l": "Eph 1:5", "n": "", "vs": [[5, "إذ سبق فعيننا في المحبة ليتخذنا أبناء له بيسوع المسيح. وذلك موافق للقصد الذي سرت به مشيئته،"]]}], "kwAr": "سبق أن عينا له", "noteAr": ""}, {"kw": "according", "raw": "Isa_46:10,Isa_46:11", "note": "", "refs": [{"l": "Isa 46:10", "n": "", "vs": [[10, "وقد أنبأت بالنهاية منذ البدء، وأخبرت من القدم بأمور لم تكن قد حدثت بعد، قائلا: مقاصدي لابد أن تتم، ومشيئتي لابد أن تتحقق."]]}, {"l": "Isa 46:11", "n": "", "vs": [[11, "أدعو من المشرق الطائر الجارح، ومن الأرض البعيدة رجل مشورتي. قد نطقت بقضائي ولابد أن أجريه، وما رسمته من خطة لابد أن أنفذه."]]}], "kwAr": "وفقا لقصده", "noteAr": ""}, {"kw": "the purpose", "raw": "Eph_1:9", "note": "", "refs": [{"l": "Eph 1:9", "n": "", "vs": [[9, "إذ كشف لنا سر مشيئته بحسب مرضاته التي قصدها في نفسه،"]]}], "kwAr": "لقصده", "noteAr": ""}, {"kw": "the counsel", "raw": "Eph_1:8; Job_12:13; Pro_8:14; Isa_5:19, Isa_28:29, Isa_40:13, Isa_40:14; Jer_23:18, Jer_32:19; Zec_6:13; Act_2:23, Act_4:28, Act_20:27; Rom_11:34; Heb_6:17", "note": "", "refs": [{"l": "Eph 1:8", "n": "", "vs": [[8, "التي جعلها تفيض علينا مصحوبة بكل حكمة وفهم."]]}, {"l": "Job 12:13", "n": "", "vs": [[13, "الحكمة والقوة لله، وله المشورة والفهم."]]}, {"l": "Pro 8:14", "n": "", "vs": [[14, "لي المشورة والرأي الصائب، لي الفطنة والقوة."]]}, {"l": "Isa 5:19", "n": "", "vs": [[19, "ويقولون: ليسرع وليعجل بعقابه حتى نراه. لينفذ مقدس إسرائيل مأربه فينا فندرك حقيقة ما يفعله بنا."]]}, {"l": "Isa 28:29", "n": "", "vs": [[29, "إن مصدر هذه المعرفة هو الرب القدير العجيب في مشورته والعظيم في حكمته."]]}, {"l": "Isa 40:13", "n": "", "vs": [[13, "من أرشد روح الرب أو كان له مشيرا فعلمه؟"]]}, {"l": "Isa 40:14", "n": "", "vs": [[14, "هل طلب الرب مشورة من أحد؟ من علمه طريق العدل ولقنه المعرفة وأراه سبيل الفهم؟"]]}, {"l": "Jer 23:18", "n": "", "vs": [[18, "مع أنه ليس بينهم من مثل في مجلس الرب ورأى وأنصت لكلمته، ولا من أصغى لقوله وأطاعه."]]}, {"l": "Jer 32:19", "n": "", "vs": [[19, "عظيم في المشورة وقادر في العمل، وعيناك مفتوحتان تراقبان جميع طرق الإنسان لتجازي كل واحد حسب تصرفاته وثمار أعماله."]]}, {"l": "Zec 6:13", "n": "", "vs": [[13, "هو الذي يبني هيكل الرب ويتجلل بالمجد ويكون نفسه ملكا وكاهنا في آن واحد فيجلس ويحكم على عرشه ويعمل بفضل مشورة رتبتيه على إشاعة السلام بين قومه."]]}, {"l": "Act 2:23", "n": "", "vs": [[23, "ومع ذلك فقد سمح الله ، وفقا لمشيئته المحتومة وعلمه السابق، أن تقبضوا عليه وتصلبوه وتقتلوه بأيدي الأثمة."]]}, {"l": "Act 4:28", "n": "", "vs": [[28, "وعملوا به كل ما سبق أن رسمت يدك وقضت مشيئتك أن يكون."]]}, {"l": "Act 20:27", "n": "", "vs": [[27, "لأني لم أمتنع عن إبلاغكم جميع مقاصد الله."]]}, {"l": "Rom 11:34", "n": "", "vs": [[34, "«لأنه من عرف فكر الرب؟ أو من كان له مشيرا؟"]]}, {"l": "Heb 6:17", "n": "", "vs": [[17, "ولذلك، لما أراد الله أن يؤكد بصورة قاطعة لوارثي وعده، أن قراره لا يتغير أبدا، ثبته بالقسم."]]}], "kwAr": "كما تقضي مشيئته", "noteAr": ""}], "arS": [["وفي المسيح أيضا قد ", []], ["حصلنا على الميراث", ["G2820"]], [" الذي سبق أن ", []], ["عينا", ["G4309"]], [" له، ", []], ["وفقا", ["G2596"]], [" ", []], ["لقصده", ["G4286"]], ["، هو الذي ", []], ["يعمل", ["G1754"]], [" ", []], ["كل شيء", ["G3956"]], [" كما ", []], ["تقضي", ["G1012"]], [" ", []], ["مشيئته", ["G2307"]], [".", []]]}, {"c": 1, "v": 12, "text": "والغاية أن نكون سببا لمدح مجده بعدما سبق لنا أن وضعنا رجاءنا في المسيح.", "groups": [{"kw": "be", "raw": "Eph_1:6, Eph_1:14, Eph_2:7, Eph_3:21; 2Th_2:13", "note": "", "refs": [{"l": "Eph 1:6", "n": "", "vs": [[6, "بغرض مدح مجد نعمته التي بها أعطانا حظوة لديه في المحبوب:"]]}, {"l": "Eph 1:14", "n": "", "vs": [[14, "هذا الروح الذي هو عربون ميراثنا إلى أن يتم فداء ما قد اقتني: بغر ض مدح مجده."]]}, {"l": "Eph 2:7", "n": "", "vs": [[7, "وذلك كي يعرض في الدهور القادمة غنى نعمته الفائق في لطفه علينا في المسيح يسوع."]]}, {"l": "Eph 3:21", "n": "", "vs": [[21, "له المجد في الكنيسة، في المسيح يسوع، مدى الأجيال والدهور! آمين …"]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}], "kwAr": "أن نكون سببا لمدح مجده", "noteAr": ""}, {"kw": "who", "raw": "Eph_1:13; Psa_2:12, Psa_146:3-5; Isa_11:10, Isa_12:2, Isa_32:1, Isa_32:2, Isa_42:1-4, Isa_45:23, Isa_45:25; Jer_17:5-7, Jer_23:6; Mat_12:18-21; Joh_14:1; Rom_15:12, Rom_15:13; 2Ti_1:12; Jam_1:18; 1Pe_1:21", "note": "", "refs": [{"l": "Eph 1:13", "n": "", "vs": [[13, "وفيه أنتم أيضا (وضعتم رجاءكم) إذ سمعتم كلمة الحق، أي الإنجيل الذي فيه خلاصكم؛ كذلك فيه أيضا ختمتم، إذ آمنتم، بالروح القدس الموعود،"]]}, {"l": "Psa 2:12", "n": "", "vs": [[12, "قبلوا الابن لئلا يغضب، فتهلكوا في الطريق، لئلا يتوهج غضبه سريعا. طوبى لجميع المتكلين عليه."]]}, {"l": "Psa 146:3-5", "n": "", "vs": [[3, "لا تتوكلوا على الرؤساء، ولا على ابن آدم الذي لا يستطيع أن يخلصكم."], [4, "تنطلق روحه منه فيعود إلى ترابه، وآنئذ تندثر تدابيره."], [5, "طوبى لمن يكون إله يعقوب معينه، ورجاؤه في الرب إلهه،"]]}, {"l": "Isa 11:10", "n": "", "vs": [[10, "في ذلك اليوم ينتصب أصل يسى راية للأمم، وإليه تسعى جميع الشعوب، ويكون مسكنه مجيدا."]]}, {"l": "Isa 12:2", "n": "", "vs": [[2, "ها إن الله خلاصي فأطمئن ولا أرتعد، لأن الرب الله هو قوتي وترنيمتي وقد أصبح لي خلاصا»."]]}, {"l": "Isa 32:1", "n": "", "vs": [[1, "انظروا ها إن ملكا يملك بالبر، ورؤساء يحكمون بالعدل."]]}, {"l": "Isa 32:2", "n": "", "vs": [[2, "ويصبح كل إنسان كملاذ من الريح، وكملجاء من العاصفة، أو كجداول ميا ه في صحراء، أو كظل صخرة عظيمة في أرض جدباء."]]}, {"l": "Isa 42:1-4", "n": "", "vs": [[1, "هوذا عبدي الذي أعضده، مختاري الذي ابتهجت به نفسي. وضعت روحي عليه ليسوس الأمم بالعدل."], [2, "لا يصيح ولا يصرخ ولا يرفع صوته في الطريق."], [3, "لا يكسر قصبة مرضوضة، وفتيلة مدخنة لا يطفيء. إنما بأمانة يجري عدلا."], [4, "لا يكل ولا تثبط له همة حتى يرسخ العدل في الأرض، وتنتظر الجزائر شريعته."]]}, {"l": "Isa 45:23", "n": "", "vs": [[23, "لقد أقسمت بذاتي، وخرجت من فمي، بكل صدق، كلمة لا تنقض: إنه ستجثو لي كل ركبة ويقسم بي كل لسان."]]}, {"l": "Isa 45:25", "n": "", "vs": [[25, "أما ذرية إسرائيل فبالرب يتبررون وبه يزهون."]]}, {"l": "Jer 17:5-7", "n": "", "vs": [[5, "وهذا ما يقوله الرب: «ليكن ملعونا كل من يتوكل على بشر، ويتخذ من الناس ذراع قوة له، ويحول قلبه عن الرب."], [6, "فيكون كالأثل في البادية، لا يرى الفلاح عندما يقبل. يقيم في حر الصحراء الشديد، في الأرض المهجورة من الناس لملوحتها."], [7, "ولكن مبارك الرجل الذي يتكل على الرب، ويتخذه معتمدا له،"]]}, {"l": "Jer 23:6", "n": "", "vs": [[6, "في عهده يتم خلاص شعب يهوذا، ويسكن شعب إسرائيل آمنا. أما الاسم الذي سيدعى به فهو: الرب برنا."]]}, {"l": "Mat 12:18-21", "n": "", "vs": [[18, "«ها هو فتاي الذي اخترته، حبيبي الذي سرت به نفسي! سأضع روحي عليه، فيعلن العدل للأمم."], [19, "لا يخاصم ولا يصرخ، ولا يسمع أحد صوته في الشوارع."], [20, "قصبة مرضوضة لا يكسر، وفتيلة مدخنة لا يطفيء، حتى يقود العدل إلى النصر،"], [21, "وعلى اسمه تعلق الأمم رجاءها! »"]]}, {"l": "Joh 14:1", "n": "", "vs": [[1, "«لا تضطرب قلوبكم. أنتم تؤمنون بالله، فآمنوا بي أيضا."]]}, {"l": "Rom 15:12", "n": "", "vs": [[12, "ويقول إشعياء أيضا: «سيطلع أصل يسى، والقائم، ليسود على الأمم: عليه تعلق الشعوب الرجاء»."]]}, {"l": "Rom 15:13", "n": "", "vs": [[13, "فليملأكم إله الرجاء كل فرح وسلام في إيمانكم حتى تزدادوا رجاء بقوة الروح القدس."]]}, {"l": "2Ti 1:12", "n": "", "vs": [[12, "من أجل ذلك أيضا أقاسي الآن هذه الآلام، ولكني لست أخجل، لأنني أعرف من أنا مؤمن به، ولي تمام الثقة بأنه قادر أن يحفظ لي الأمانة التي أودعتها عنده سالمة إلى ذلك اليوم."]]}, {"l": "Jam 1:18", "n": "", "vs": [[18, "وهو قد شاء أن يجعلنا أولادا له، فولدنا بكلمته، كلمة الحق. وغايته أن نكون باكورة خليقته."]]}, {"l": "1Pe 1:21", "n": "", "vs": [[21, "أنتم الذين تؤمنون بالله بالمسيح الذي أقامه من الموت وأعطاه المجد، حتى يكون الله غاية إيمانكم ورجائكم."]]}], "kwAr": "بعدما سبق لنا", "noteAr": ""}, {"kw": "trusted", "raw": "or, hoped", "note": "or, hoped", "refs": [], "kwAr": "وضعنا رجاءنا", "noteAr": "أو: رجونا."}], "arS": [["والغاية أن نكون سببا ", []], ["لمدح", ["G1868"]], [" ", []], ["مجده", ["G1391"]], [" بعدما ", []], ["سبق", ["G4276"]], [" لنا أن ", []], ["وضعنا رجاءنا", ["G4276"]], [" في ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 1, "v": 13, "text": "وفيه أنتم أيضا (وضعتم رجاءكم) إذ سمعتم كلمة الحق، أي الإنجيل الذي فيه خلاصكم؛ كذلك فيه أيضا ختمتم، إذ آمنتم، بالروح القدس الموعود،", "groups": [{"kw": "ye also", "raw": "Eph_2:11, Eph_2:12; Col_1:21-23; 1Pe_2:10", "note": "", "refs": [{"l": "Eph 2:11", "n": "", "vs": [[11, "لذلك اذكروا، أنتم الأمم في الجسد سابقا، يامن تسمون أهل عدم الختان من قبل من يسمون أهل الختان الذي يجري في الجسد باليد،"]]}, {"l": "Eph 2:12", "n": "", "vs": [[12, "أنكم كنتم في ذلك الحين بلا مسيح، أجانب عن جماعة إسرائيل، وغرباء عن العهود الموعودة، لا رجاء لكم، ومنكرين لله في العالم."]]}, {"l": "Col 1:21-23", "n": "", "vs": [[21, "وأنتم، يامن كنتم في الماضي أجانب وأعداء في الفكر، بأعمالكم الشريرة،"], [22, "قد صالحكم الآن في جسد بشرية (ابنه) بالموت. وذلك لكي يحضركم فتمثلوا أمامه وأنتم قديسون بلا ذنب ولا لوم."], [23, "على أن تثبتوا فعلا في الإيمان، مؤسسين وراسخين وغير متحولين عن رجاء الإنجيل الذي سمعتموه والذي بشر به للخليقة كلها تحت السماء، وله صرت أنا بولس خادما."]]}, {"l": "1Pe 2:10", "n": "", "vs": [[10, "فإنكم في الماضي لم تكونوا شعبا؛ أما الآن، فأنتم «شعب الله وقد كنتم سابقا لا تتمتعون برحمة الله، أما الآن، فإنكم تتمتعون بها!»"]]}], "kwAr": "وفيه أنتم أيضا", "noteAr": ""}, {"kw": "after that ye heard", "raw": "Eph_4:21; Joh_1:17; Rom_6:17, Rom_10:14-17; Col_1:4-6, Col_1:23; 1Th_2:13", "note": "", "refs": [{"l": "Eph 4:21", "n": "", "vs": [[21, "إذا كنتم قد سمعتموه حقا وتلقيتم فيه التعليم الموافق للحق الذي في يسوع!"]]}, {"l": "Joh 1:17", "n": "", "vs": [[17, "لأن الشريعة أعطيت على يد موسى، أما النعمة والحق فقد تواجدا بيسوع المسيح."]]}, {"l": "Rom 6:17", "n": "", "vs": [[17, "إنما الشكر لله، لأنكم كنتم عبيدا للخطيئة ولكن أطعتم من القلب صيغة التعليم الذي وضعتم في عهدته."]]}, {"l": "Rom 10:14-17", "n": "", "vs": [[14, "ولكن، كيف يدعون من لم يؤمنوا به؟ وكيف يؤمنون بمن لم يسمعوا به؟ وكيف يسمعون بلا مبشر؟"], [15, "وكيف يبشر أحد إلا إذا كان قد أرسل؟ كما قد كتب: «ما أجمل أقدام المبشرين بالخيرات!»"], [16, "ولكن، ليس كلهم أطاعوا الإنجيل. فإن إشعياء يقول: «يارب! من صدق ما أسمعناه إياه؟»"], [17, "إذا، الإيمان نتيجة السماع، والسماع هو من التبشير بكلمة المسيح !"]]}, {"l": "Col 1:4-6", "n": "", "vs": [[4, "إذ بلغنا خبر إيمانكم بالمسيح يسوع والمحبة التي لكم نحو جميع القديسين،"], [5, "بسبب الرجاء المحفوظ لكم في السماوات، الرجاء الذي سمعتم به سابقا في كلمة الحق التي في الإنجيل"], [6, "والتي وصلت إليكم كما تنتشر الآن في العالم أجمع، منتجة الثمر ونامية، مثلما يحدث بينكم أنتم منذ أن سمعتم بنعمة الله واختبرتموها بالحق،"]]}, {"l": "Col 1:23", "n": "", "vs": [[23, "على أن تثبتوا فعلا في الإيمان، مؤسسين وراسخين وغير متحولين عن رجاء الإنجيل الذي سمعتموه والذي بشر به للخليقة كلها تحت السماء، وله صرت أنا بولس خادما."]]}, {"l": "1Th 2:13", "n": "", "vs": [[13, "ولذلك نحن أيضا نرفع الشكر لله بلا توقف، لأنكم لما تلقيتم منا كلمة البشارة من الله، قبلتموها لا كأنها كلمة بشر، بل كما هي في الحقيقة: باعتبارها كلمة الله العاملة أيضا فيكم أنتم المؤمنين."]]}], "kwAr": "إذ سمعتم", "noteAr": ""}, {"kw": "the word", "raw": "Psa_119:43; 2Co_6:7; 2Ti_2:15; Jam_1:18", "note": "", "refs": [{"l": "Psa 119:43", "n": "", "vs": [[43, "لا تنزع كلمة الحق من فمي لأن رجائي في أحكامك،"]]}, {"l": "2Co 6:7", "n": "", "vs": [[7, "في كلمة الحق وقدرة الله؛ بأسلحة البر في الهجوم والدفاع؛"]]}, {"l": "2Ti 2:15", "n": "", "vs": [[15, "اجتهد أن تقدم نفسك لله فائزا في الامتحان، عاملا ليس عليه ما يدعو للخجل، مفصلا كلمة الحق باستقامة."]]}, {"l": "Jam 1:18", "n": "", "vs": [[18, "وهو قد شاء أن يجعلنا أولادا له، فولدنا بكلمته، كلمة الحق. وغايته أن نكون باكورة خليقته."]]}], "kwAr": "كلمة الحق", "noteAr": ""}, {"kw": "the gospel", "raw": "Mar_16:15, Mar_16:16; Act_13:26; Rom_1:16; 2Ti_3:15; Tit_2:11; Heb_2:3", "note": "", "refs": [{"l": "Mar 16:15", "n": "", "vs": [[15, "وقال لهم: «اذهبوا إلى العالم أجمع، وبشروا الخليقة كلها بالإنجيل:"]]}, {"l": "Mar 16:16", "n": "", "vs": [[16, "من آمن وتعمد، خلص، ومن لم يؤمن فسوف يدان."]]}, {"l": "Act 13:26", "n": "", "vs": [[26, "أيها الإخوة، يابني جنس إبراهيم، ويا كل من يتقي الله من الحاضرين هنا: إلينا أرسل الله كلمة هذا الخلاص!"]]}, {"l": "Rom 1:16", "n": "", "vs": [[16, "فأنا لا أستحي بالإنجيل، لأنه قدرة الله للخلاص، لكل من يؤمن، لليهودي أولا ثم لليوناني على السواء."]]}, {"l": "2Ti 3:15", "n": "", "vs": [[15, "وتعلم أنك منذ حداثة سنك تعرف الكتب المقدسة، وهي القادرة أن تجعلك حكيما لبلوغ الخلاص عن طريق الإيمان في المسيح يسوع."]]}, {"l": "Tit 2:11", "n": "", "vs": [[11, "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت."]]}, {"l": "Heb 2:3", "n": "", "vs": [[3, "فكيف نفلت نحن إن أهملنا هذا الخلاص العظيم جدا؟ فإن الرب يسوع نفسه قد أعلنه أولا، ثم تثبت لنا من الذين سمعوه مباشرة."]]}], "kwAr": "الإنجيل الذي فيه خلاصكم", "noteAr": ""}, {"kw": "ye were", "raw": "Eph_4:30; Joh_6:27; Rom_4:11; 2Co_1:22; 2Ti_2:19; Rev_7:2", "note": "", "refs": [{"l": "Eph 4:30", "n": "", "vs": [[30, "ولا تحزنوا روح الله، الروح القدس الذي به ختمتم ليوم الفداء."]]}, {"l": "Joh 6:27", "n": "", "vs": [[27, "لا تسعوا وراء الطعام الفاني، بل وراء الطعام الباقي إلى الحياة الأبدية، والذي يعطيكم إياه ابن الإنسان، لأن هذا الطعام قد وضع الله الآب ختمه عليه»."]]}, {"l": "Rom 4:11", "n": "", "vs": [[11, "ثم تلقى إبراهيم علامة الختان ختما للبر الحاصل بالإيمان الذي كان له وهو مازال غير مختون، لكي يكون أبا لجميع الذين يؤمنون من غير المختونين فيحسب البر لهم أيضا،"]]}, {"l": "2Co 1:22", "n": "", "vs": [[22, "وهو أيضا قد وضع ختمه علينا، ووهبنا الروح القدس عربونا في قلوبنا."]]}, {"l": "2Ti 2:19", "n": "", "vs": [[19, "إلا أن الأساس الراسخ الذي وضعه الله يظل ثابتا، وعليه هذا الختم: «الرب يعرف خاصته»، وأيضا: «لينفصل عن الإثم كل من يسمي اسم الرب!»"]]}, {"l": "Rev 7:2", "n": "", "vs": [[2, "ثم رأيت ملاكا آخر قادما من الشرق يحمل ختم الله الحي، فنادى بصوت عال الملائكة الأربعة الذين عهد إليهم أن ينزلوا الضرر بالبر والبحر:"]]}], "kwAr": "ختمتم", "noteAr": ""}, {"kw": "holy", "raw": "Joe_2:28; Luk_11:13, Luk_24:49; Joh_14:16, Joh_14:17, Joh_14:26, Joh_15:26, Joh_16:7-15; Act_1:4; Act_2:16-22, Act_2:33; Gal_3:14", "note": "", "refs": [{"l": "Joe 2:28", "n": "", "vs": [[28, "ثم أسكب روحي على كل بشر، فيتنبأ أبناؤكم وبناتكم، ويحلم شيوخكم أحلاما ويرى شبابكم رؤى."]]}, {"l": "Luk 11:13", "n": "", "vs": [[13, "فإن كنتم، أنتم الأشرار، تعرفون أن تعطوا أولادكم عطايا جيدة، فكم بالأحرى الآب، الذي من السماء يهب الروح القدس لمن يسألونه؟ »"]]}, {"l": "Luk 24:49", "n": "", "vs": [[49, "وها أنا سأرسل إليكم ما وعد به أبي. ولكن أقيموا في المدينة حتى تلبسوا القوة من الأعالي!»"]]}, {"l": "Joh 14:16", "n": "", "vs": [[16, "وسوف أطلب من الآب أن يعطيكم معينا آخر يبقى معكم إلى الأبد،"]]}, {"l": "Joh 14:17", "n": "", "vs": [[17, "وهو روح الحق، الذي لا يقدر العالم أن يتقبله لأنه لا يراه ولا يعرفه، وأما أنتم فتعرفونه لأنه في وسطكم، وسيكون في داخلكم."]]}, {"l": "Joh 14:26", "n": "", "vs": [[26, "وأما الروح القدس، المعين الذي سيرسله الآب باسمي، فإنه يعلمكم كل شيء، ويذكركم بكل ما قلته لكم."]]}, {"l": "Joh 15:26", "n": "", "vs": [[26, "وعندما يأتي المعين، الذي سأرسله لكم من عند الآب، روح الحق الذي ينبثق من الآب، فهو يشهد لي،"]]}, {"l": "Joh 16:7-15", "n": "", "vs": [[7, "ولكني أقول لكم الحق: من الأفضل لكم أن أذهب، لأني إن كنت لا أذهب، لا يأتيكم المعين. ولكني إذا ذهبت أرسله إليكم."], [8, "وعندما يجيء يبكت العالم على الخطيئة وعلى البر وعلى الدينونة:"], [9, "أما على الخطيئة، فلأنهم لا يؤمنون بي،"], [10, "وأما على البر، فلأني عائد إلى الآب فلا ترونني بعد؛"], [11, "وأما على الدينونة، فلأن سيد هذا العالم قد صدر عليه حكم الدينونة."], [12, "مازال عندي أمور كثيرة أقولها لكم، ولكنكم الآن تعجزون عن احتمالها."], [13, "ولكن، عندما يأتيكم روح الحق يرشدكم إلى الحق كله، لأنه لا يقول شيئا من عنده، بل يخبركم بما يسمعه، ويطلعكم على ما سوف يحدث."], [14, "وهو سيمجدني لأن كل ما سيحدثكم به صادر عني."], [15, "كل ما هو للآب، فهو لي. ولذلك قلت لكم إن ما سيحدثكم به صادر عني."]]}, {"l": "Act 1:4", "n": "", "vs": [[4, "وبينما كان مجتمعا معهم، قال: «لا تتركوا أورشليم، بل ابقوا فيها منتظرين إتمام وعد الآب، الذي سبق أن حدثتكم عنه."]]}, {"l": "Act 2:16-22", "n": "", "vs": [[16, "ولكن هذا ما قيل بلسان النبي يوئيل:"], [17, "يقول الله : في الأيام الأخيرة سأسكب روحي على جميع البشر، فيتنبأ بنوكم وبناتكم، ويرى شبابكم رؤى، ويحلم شيوخكم أحلاما."], [18, "في تلك الأيام أفيض من روحي على عبيدي كلهم، رجالا ونساء، فيتنبأون."], [19, "سأجري عجائب فوق في السماء وعلامات تحت على الأرض، حيث يكون دم ونار ودخان كثيف!"], [20, "وقبل أن يأتي يوم الرب، ذلك اليوم العظيم الشهير، ستظلم الشمس، ويتحول القمر إلى لون الدم."], [21, "ولكن كل من يدعو باسم الرب يخلص!"], [22, "فيا بني إسرائيل، اسمعوا هذا الكلام: إن يسوع الناصري رجل أيده الله بمعجزات وعجائب وعلامات أجراها على يده بينكم، كما تعلمون."]]}, {"l": "Act 2:33", "n": "", "vs": [[33, "وإذ رفع إلى يمين الله، وأخذ من الآب الروح القدس الموعود به، أفاضه علينا. وما ترونه الآن وتسمعونه هو نتيجة لذلك."]]}, {"l": "Gal 3:14", "n": "", "vs": [[14, "لكي تصل بركة إبراهيم إلى الأمم في المسيح يسوع، فننال عن طريق الإيمان الروح الموعود."]]}], "kwAr": "بالروح القدس الموعود", "noteAr": ""}], "arS": [["وفيه أنتم أيضا (وضعتم رجاءكم) إذ ", []], ["سمعتم", ["G191"]], [" ", []], ["كلمة", ["G3056"]], [" ", []], ["الحق", ["G225"]], ["، أي ", []], ["الإنجيل", ["G2098"]], [" الذي فيه ", []], ["خلاصكم", ["G4991", "G5216"]], ["؛ كذلك فيه أيضا ", []], ["ختمتم", ["G4972"]], ["، إذ ", []], ["آمنتم", ["G4100"]], ["، ", []], ["بالروح", ["G4151"]], [" ", []], ["القدس", ["G40"]], [" ", []], ["الموعود", ["G1860"]], ["،", []]]}, {"c": 1, "v": 14, "text": "هذا الروح الذي هو عربون ميراثنا إلى أن يتم فداء ما قد اقتني: بغر ض مدح مجده.", "groups": [{"kw": "the earnest", "raw": "Rom_8:15-17, Rom_8:23; 2Co_1:22, 2Co_5:5; Gal_4:6", "note": "", "refs": [{"l": "Rom 8:15-17", "n": "", "vs": [[15, "إذ إنكم لم تنالوا روح عبودية يعيدكم إلى الخوف، بل نلتم روح بنوة به نصرخ: «أبا! أبانا!»"], [16, "فالروح نفسه يشهد مع أرواحنا بأننا أولاد الله."], [17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}, {"l": "Rom 8:23", "n": "", "vs": [[23, "وليس هي وحدها، بل أيضا نحن الذين لنا باكورة الروح، نحن أنفسنا نئن في قرارة نفوسنا مترقبين إعلان بنوتنا بافتداء أجسادنا."]]}, {"l": "2Co 1:22", "n": "", "vs": [[22, "وهو أيضا قد وضع ختمه علينا، ووهبنا الروح القدس عربونا في قلوبنا."]]}, {"l": "2Co 5:5", "n": "", "vs": [[5, "والذي أعدنا لهذا الأمر بعينه هو الله ، وقد أعطانا الروح عربونا أيضا."]]}, {"l": "Gal 4:6", "n": "", "vs": [[6, "وبما أنكم أبناء له، أرسل الله إلى قلوبنا روح ابنه، مناديا: «أبا، ياأبانا»."]]}], "kwAr": "عربون ميراثنا", "noteAr": ""}, {"kw": "the redemption", "raw": "Eph_4:30; Lev_25:24-34; Psa_74:2, Psa_78:54; Jer_32:7, Jer_32:8; Luk_21:28; Act_20:28; Rom_8:23; 1Pe_2:9 *marg.", "note": "", "refs": [{"l": "Eph 4:30", "n": "", "vs": [[30, "ولا تحزنوا روح الله، الروح القدس الذي به ختمتم ليوم الفداء."]]}, {"l": "Lev 25:24-34", "n": "", "vs": [[24, "بل في كل عقد بيع تضعون شرط فكاك للأرض."], [25, "وإذا افتقر مواطنك وباع بعض ملكه فليأت أقرب أقربائه ويفك مبيع قريبه"], [26, "ومن لم يكن له قريب، واستطاع الحصول على مقدار كاف من المال لفك البيع،"], [27, "فليحسب عدد السنوات التي انقضت على المبيع، وما هو متبق منها حتى حلول سنة اليوبيل، فيدفع للمشتري ما يعادل غلال السنوات المتبقية، ويسترد ملكه"], [28, "وإن لم يتوافر لديه المال لاسترداد مبيعه من يد الشاري، فلينتظر حتى حلول سنة اليوبيل ليسترد ملكه."], [29, "وإذا باع إنسان بيتا للسكنى في مدينة مسورة يحق استرداده في خلال سنة من بيعه."], [30, "وإن عجز عن فكاكه قبل انقضاء سنة، يصبح البيت الذي في المدينة المسورة من حق شاريه ونسله لا يرد في سنة اليوبيل."], [31, "أما البيوت المباعة في القرى غير المسورة فإنها تعامل معاملة الحقول الزراعية، قابلة للفكاك والاسترداد في سنة اليوبيل."], [32, "أما بيوت اللاويين القائمة في مدن اللاويين المسورة، فإن للاويين حق استردادها دائما،"], [33, "فبيوت اللاويين قابلة للفكاك وتسترد في سنة اليوبيل، لأن بيوتهم في مدن اللاويين هي ملكهم بين بني إسرائيل."], [34, "أما المزارع المحيطة بمدنهم ": "", "vs": [[11, "هل استبدلت أمة آلهتها مع أنها ليست حقا آلهة؟ أما شعبي فاستبدل مجده بما لا جدوى منه."]]}, {"l": "Mat 6:13", "n": "", "vs": [[13, "ولا تدخلنا في تجربة، لكن نجنا من الشرير، لأن لك الملك والقوة والمجد إلى الأبد. آمين."]]}, {"l": "Luk 2:14", "n": "", "vs": [[14, "«المجد لله في الأعالي، وعلى الأرض السلام؛ وبالناس المسرة! »"]]}, {"l": "Act 7:2", "n": "", "vs": [[2, "فأجاب: «أيها الإخوة والآباء، اسمعوا: ظهر إله المجد لأبينا إبراهيم وهو في بلاد ما بين النهرين، قبل أن يرحل ليسكن في حاران،"]]}, {"l": "1Co 2:8", "n": "", "vs": [[8, "وهي حكمة لم يعرفها أحد من رؤساء هذا العالم. فلو عرفوها،"]]}, {"l": "Jam 2:1", "n": "", "vs": [[1, "ياإخوتي، نظرا لإيمانكم بربنا يسوع المسيح، رب المجد، لا تعاملوا الناس بالانحياز والتمييز!"]]}, {"l": "Rev 7:12", "n": "", "vs": [[12, "قائلين: «آمين! لإلهنا البركة والمجد والحكمة والشكر والإجلال والقدرة والقوة إلى أبد الآبدين. آمين!»"]]}], "kwAr": "أبو المجد", "noteAr": ""}, {"kw": "the spirit", "raw": "Gen_41:38, Gen_41:39; Isa_11:2; Dan_5:11; Luk_12:12, Luk_21:15; Joh_14:17, Joh_14:26; Act_6:10; 1Co_12:8, 1Co_14:6; Col_1:9, Col_2:3; Jam_3:17, Jam_3:18", "note": "", "refs": [{"l": "Gen 41:38", "n": "", "vs": [[38, "وقال فرعون لعبيده: «هل نجد نظير هذا رجلا فيه روح الله؟»"]]}, {"l": "Gen 41:39", "n": "", "vs": [[39, "ثم قال فرعون ليوسف: «من حيث أن الله قد أطلعك على كل هذا، فليس هناك بصير وحكيم نظيرك."]]}, {"l": "Isa 11:2", "n": "", "vs": [[2, "ويستقر عليه روح الرب، روح الحكمة والفطنة، روح المشورة والقوة، روح معرفة الرب ومخافته."]]}, {"l": "Dan 5:11", "n": "", "vs": [[11, "لأن في مملكتك رجلا فيه روح الآلهة القدوسين، وقد تميز في عهد أبيك باستنارة وفهم وحكمة كحكمة الآلهة، فعينه أبوك الملك نبوخذناصر رئيسا للمجوس والسحرة والكلدانيين والمنجمين."]]}, {"l": "Luk 12:12", "n": "", "vs": [[12, "فإن الروح القدس سيلقنكم في تلك الساعة عينها ما يجب أن تقولوا»."]]}, {"l": "Luk 21:15", "n": "", "vs": [[15, "لأني سوف أعطيكم كلاما وحكمة لا يقدر جميع مقاوميكم أن يردوها أو يناقضوها."]]}, {"l": "Joh 14:17", "n": "", "vs": [[17, "وهو روح الحق، الذي لا يقدر العالم أن يتقبله لأنه لا يراه ولا يعرفه، وأما أنتم فتعرفونه لأنه في وسطكم، وسيكون في داخلكم."]]}, {"l": "Joh 14:26", "n": "", "vs": [[26, "وأما الروح القدس، المعين الذي سيرسله الآب باسمي، فإنه يعلمكم كل شيء، ويذكركم بكل ما قلته لكم."]]}, {"l": "Act 6:10", "n": "", "vs": [[10, "ولكنهم لم يتمكنوا من مقاومة حكمته والروح الذي كان يتكلم به."]]}, {"l": "1Co 12:8", "n": "", "vs": [[8, "فواحد يوهب، عن طريق الروح، كلام الحكمة، وآخر كلام المعرفة وفقا للروح نفسه،"]]}, {"l": "1Co 14:6", "n": "", "vs": [[6, "والآن، أيها الإخوة، افرضوا أني جئتكم متكلما بلغات مجهولة، فأية منفعة تنالون مني، إلا إذا كلمتكم بإعلان أو علم أو نبوءة أو تعليم؟"]]}, {"l": "Col 1:9", "n": "", "vs": [[9, "لذلك نحن أيضا، من اليوم الذي فيه سمعنا بأخباركم، مازلنا نصلي ونتضرع لأجلكم، لأن تمتلئوا من تمام المعرفة لمشيئة الله في كل حكمة وإدراك روحي،"]]}, {"l": "Col 2:3", "n": "", "vs": [[3, "المخزونة فيه كنوز الحكمة والمعرفة كلها."]]}, {"l": "Jam 3:17", "n": "", "vs": [[17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}, {"l": "Jam 3:18", "n": "", "vs": [[18, "والبر هو ثمر ة ما يزرعه في سلام صانعو السلام."]]}], "kwAr": "روح حكمة", "noteAr": ""}, {"kw": "revelation", "raw": "Eph_3:5; Dan_2:28-30, Dan_10:1; Mat_11:25, Mat_16:17; 1Co_2:10; 2Co_12:1", "note": "", "refs": [{"l": "Eph 3:5", "n": "", "vs": [[5, "ذلك السر الذي لم يطلع عليه بنو البشر في الأجيال الماضية مثلما أعلن الآن بوحي الروح لرسله القديسين وأنبيائه:"]]}, {"l": "Dan 2:28-30", "n": "", "vs": [[28, "ولكن هناك إله في السماء يعلن الخفايا. وقد عرف الملك نبوخذناصر عما سيحدث في آخر الأيام. أما حلمك والرؤيا التي شهدتها في منامك فهي هذه:"], [29, "أيها الملك، فيما أنت مستلق على مضجعك انتابتك الأفكار عما يحدث في الأيام المقبلة، والذي يكشف الخفايا عرفك بما سيكون."], [30, "وقد أعلن لي هذا السر، لا لحكمة في أكثر من سائر الأحياء، إنما لكي يطلع الملك على تفسيره وتدرك أفكار قلبك."]]}, {"l": "Dan 10:1", "n": "", "vs": [[1, "وفي السنة الثالثة لحكم كورش ملك فارس، أعلن وحي لدانيآل المدعو بلطشاصر، والوحي دائما حق. وبعد مكابدة مجهدة، أدرك فحوى الوحي وفهم معنى الرؤيا."]]}, {"l": "Mat 11:25", "n": "", "vs": [[25, "وفي ذلك الوقت، تكلم يسوع فقال: «أحمدك أيها الآب، رب السماء والأرض، لأنك حجبت هذه الأمور عن الحكماء والفهماء، وكشفتها للأطفال!"]]}, {"l": "Mat 16:17", "n": "", "vs": [[17, "فقال له يسوع: «طوبى لك ياسمعان بن يونا. فما أعلن لك هذا لحم ودم، بل أبي الذي في السماوات."]]}, {"l": "1Co 2:10", "n": "", "vs": [[10, "ولكن الله كشف لنا ذلك بالروح. فإن الروح يتقصى كل شيء، حتى أعماق الله."]]}, {"l": "2Co 12:1", "n": "", "vs": [[1, "أجل، إن الافتخار لا ينفعني شيئا؛ ولكن سأنتقل إلى ما كشفه لي الرب من رؤى وإعلانات."]]}], "kwAr": "وإلهام", "noteAr": ""}, {"kw": "in the knowledge", "raw": "or, for the acknowledgment, Eph_3:18, Eph_3:19; Pro_2:5; Jer_9:24, Jer_24:7, Jer_31:34; Mat_11:27; Joh_8:54, Joh_8:55, Joh_16:3; Joh_17:3, Joh_17:25, Joh_17:26; Rom_1:28; Col_1:10, Col_2:2; 2Ti_2:25; Tit_1:1; 2Pe_1:3; 2Pe_3:18; 1Jo_2:3, 1Jo_2:4", "note": "or, for the acknowledgment, Eph_3:18, Eph_3:19; Pro_2:5; Jer_9:24, Jer_24:7, Jer_31:34; Mat_11:27; Joh_8:54, Joh_8:55, Joh_16:3; Joh_17:3, Joh_17:25, Joh_17:26; Rom_1:28; Col_1:10, Col_2:2; 2Ti_2:25; Tit_1:1; 2Pe_1:3; 2Pe_3:18; 1Jo_2:3, 1Jo_2:4", "refs": [{"l": "Eph 3:18", "n": "", "vs": [[18, "تصيرون قادرين تماما أن تدركوا، مع القديسين جميعا، ما هو العرض والطول والعلو والعمق،"]]}, {"l": "Eph 3:19", "n": "", "vs": [[19, "وتعرفوا محبة المسيح التي تفوق المعرفة، فتمتلئوا حتى تبلغوا ملء الله كله."]]}, {"l": "Pro 2:5", "n": "", "vs": [[5, "عندئذ تدرك مخافة الرب وتعثر على معرفة الله،"]]}, {"l": "Jer 9:24", "n": "", "vs": [[24, "بل ليفتخر المفتخر بأنه يدرك ويعرفني أني أنا الرب الذي يمارس الرحمة والعدل والبر في الأرض لأني أسر بها»."]]}, {"l": "Jer 24:7", "n": "", "vs": [[7, "وأهبهم قلبا ليعرفوا أني أنا الرب، فيكونوا لي شعبا وأكون لهم إلها، لأنهم يرجعون إلي من كل قلوبهم."]]}, {"l": "Jer 31:34", "n": "", "vs": [[34, "ولا يحض في ما بعد كل واحد قريبه قائلا: اعرف الرب إلهك لأنهم جميعا سيعرفونني، من صغيرهم إلى كبيرهم، لأني سأصفح عن إثمهم ولن أذكر خطاياهم من بعد»."]]}, {"l": "Mat 11:27", "n": "", "vs": [[27, "كل شيء قد سلمه إلي أبي. ولا أحد يعرف الابن إلا الآب، ولا أحد يعرف الآب إلا الابن، ومن أراد الابن أن يعلنه له."]]}, {"l": "Joh 8:54", "n": "", "vs": [[54, "أجابهم: «إن كنت أمجد نفسي، فليس مجدي بشيء. لكن أبي هو الذي يمجدني. وأنتم تقولون إنه إلهكم،"]]}, {"l": "Joh 8:55", "n": "", "vs": [[55, "مع أنكم لا تعرفونه. أما أنا فأعرفه. ولو قلت لكم إني لا أعرفه لكنت مثلكم كاذبا. لكني أعرفه وأعمل بكلمته."]]}, {"l": "Joh 16:3", "n": "", "vs": [[3, "وهم يفعلون هذا بكم لأنهم لم يعرفوا أبي، ولا عرفوني."]]}, {"l": "Joh 17:3", "n": "", "vs": [[3, "والحياة الأبدية هي أن يعرفوك أنت الإله الحق وحدك، والذي أرسلته: يسوع المسيح."]]}, {"l": "Joh 17:25", "n": "", "vs": [[25, "أيها الآب البار، إن العالم لم يعرفك، أما أنا فعرفتك، وهؤلاء عرفوا أنك أنت أرسلتني،"]]}, {"l": "Joh 17:26", "n": "", "vs": [[26, "وقد عرفتهم اسمك، وسأعرفهم أيضا، لتكون فيهم المحبة التي أحببتني بها، وأكون أنا فيهم»."]]}, {"l": "Rom 1:28", "n": "", "vs": [[28, "وبما أنهم لم يتخيروا إبقاء الله ضمن معرفتهم، أسلمهم الله إلى ذهن عاطل عن التمييز دفعهم إلى ممارسة الأمور غير اللائقة."]]}, {"l": "Col 1:10", "n": "", "vs": [[10, "لكي تسلكوا سلوكا لائقا بالرب ومرضيا في كل شيء، منتجين الثمر في كل عمل صالح ونامين في معرفة الله إلى التمام،"]]}, {"l": "Col 2:2", "n": "", "vs": [[2, "بغرض أن تتشجع قلوبهم وتكون كلها متحدة في المحبة، لبلوغ الإدراك التام بكل غناه، لمعرفة سر الله، أي المسيح،"]]}, {"l": "2Ti 2:25", "n": "", "vs": [[25, "ويؤدب بالوداعة مقاومي الإيمان، عسى أن يمنحهم الله التوبة، فيعرفوا الحق بالتمام،"]]}, {"l": "Tit 1:1", "n": "", "vs": [[1, "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"]]}, {"l": "2Pe 1:3", "n": "", "vs": [[3, "إن الله، بقدرته الإلهية، قد زودنا بكل ما نحتاج إليه في الحيا ة الروحية المتصفة بالتقوى. ذلك أنه عرفنا بالمسيح الذي دعانا إلى مجده وفضيلته،"]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}, {"l": "1Jo 2:3", "n": "", "vs": [[3, "وما يؤكد لنا أننا قد عرفنا المسيح حقا هو أن نعمل بوصاياه."]]}, {"l": "1Jo 2:4", "n": "", "vs": [[4, "فالذي يدعي أنه قد عرفه، ولكنه لا يعمل بوصاياه، يكون كاذبا ولا يكون الحق في داخله."]]}], "kwAr": "لتعرفوه معرفة كاملة", "noteAr": "أو: لأجل الإقرار به (معرفته معرفة كاملة)."}], "arS": [["حتى ", []], ["يهبكم", ["G1325"]], [" ", []], ["إله", ["G2316"]], [" ", []], ["ربنا", ["G2962", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], ["، ", []], ["أبو", ["G3962"]], [" ", []], ["المجد", ["G1391"]], ["، ", []], ["روح", ["G4151"]], [" ", []], ["حكمة", ["G4678"]], [" ", []], ["وإلهام", ["G602"]], [": لتعرفوه ", []], ["معرفة", ["G1922"]], [" كاملة", []]]}, {"c": 1, "v": 18, "text": "إذ تستنير بصائر قلوبكم، فتعلموا ما في دعوته لكم من رجاء، وما هو غنى مجد ميراثه في القديسين،", "groups": [{"kw": "eyes", "raw": "Eph_5:8; Psa_119:18; Isa_6:10, Isa_29:10,Isa_29:18, Isa_32:3, Isa_42:7; Mat_13:15; Luk_24:45; Act_16:14, Act_26:18; 2Co_4:4, 2Co_4:6; Heb_10:32", "note": "", "refs": [{"l": "Eph 5:8", "n": "", "vs": [[8, "فقد كنتم في الماضي ظلاما، ولكنكم الآن نور في الرب. فاسلكوا سلوك أولاد النور."]]}, {"l": "Psa 119:18", "n": "", "vs": [[18, "افتح عيني فأرى عجائب من شريعتك."]]}, {"l": "Isa 6:10", "n": "", "vs": [[10, "قس قلب هذا الشعب، وثقل أذنيه وأغمض عينيه لئلا يرى بعينيه ويسمع بأذنيه ويفهم بقلبه، فيرجع عن غيه ويبرأ»."]]}, {"l": "Isa 29:10", "n": "", "vs": [[10, "لأن الرب قد سكب عليكم روح سبات عميق، فأغلق عيون أنبيائكم وغطى رؤوس رائييكم."]]}, {"l": "Isa 29:18", "n": "", "vs": [[18, "في ذلك اليوم يسمع الأصم أقوال الكتاب، وتبصر عيون المكفوفين من وراء الظلمة والكآبة."]]}, {"l": "Isa 32:3", "n": "", "vs": [[3, "عندئذ تنفتح عيون الناظرين، وتصغي آذان السامعين (لاحتياجات شعبهم)"]]}, {"l": "Isa 42:7", "n": "", "vs": [[7, "لتفتح عيون العمي، وتطلق سراح المأسورين في السجن، وتحرر الجالسين في ظلمة الحبس."]]}, {"l": "Mat 13:15", "n": "", "vs": [[15, "لأن قلب هذا الشعب قد صار غليظا، وصارت آذانهم ثقيلة السمع، وأغمضوا عيونهم؛ لئلا يبصروا بعيونهم، ويسمعوا بآذانهم، ويفهموا بقلوبهم، ويرجعوا إلي، فأشفيهم!"]]}, {"l": "Luk 24:45", "n": "", "vs": [[45, "ثم فتح أذهانهم ليفهموا الكتب،"]]}, {"l": "Act 16:14", "n": "", "vs": [[14, "ومن بينهن تاجرة أرجوان من مدينة ثياتيرا، متعبدة لله، اسمها ليدية، كانت تسمع ففتح الله قلبها لتقبل كلام بولس."]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "2Co 4:4", "n": "", "vs": [[4, "الذين أعمى إله هذا العالم أذهانهم حتى لا يضيء لهم نور الإنجيل المختص بمجد المسيح الذي هو صورة الله."]]}, {"l": "2Co 4:6", "n": "", "vs": [[6, "فإن الله ، الذي أمر أن يشرق نور من الظلام، هو الذي جعل النور يشرق في قلوبنا، لإشعاع معرفة مجد الله المتجلي في وجه المسيح."]]}, {"l": "Heb 10:32", "n": "", "vs": [[32, "لا تنسوا أبدا تلك الأيام الماضية التي فيها، بعدما أشرق عليكم نور الإيمان بالمسيح، صبرتم على جهاد مرير طويل، إذ قاسيتم كثيرا من الآلام."]]}], "kwAr": "بصائر قلوبكم", "noteAr": ""}, {"kw": "is", "raw": "Eph_2:12, Eph_4:4; Rom_5:4, Rom_5:5, Rom_8:24, Rom_8:25; Gal_5:5; Col_1:5, Col_1:23; 1Th_5:8; 2Th_2:16; Tit_2:13, Tit_3:7; 1Pe_1:3; 1Jo_3:1-3", "note": "", "refs": [{"l": "Eph 2:12", "n": "", "vs": [[12, "أنكم كنتم في ذلك الحين بلا مسيح، أجانب عن جماعة إسرائيل، وغرباء عن العهود الموعودة، لا رجاء لكم، ومنكرين لله في العالم."]]}, {"l": "Eph 4:4", "n": "", "vs": [[4, "مثلما دعيتم، جميعكم، دعوة لها رجاء واحد."]]}, {"l": "Rom 5:4", "n": "", "vs": [[4, "والصبر يؤهلنا للفوز في الامتحان، والفوز يبعث فينا الرجاء،"]]}, {"l": "Rom 5:5", "n": "", "vs": [[5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."]]}, {"l": "Rom 8:24", "n": "", "vs": [[24, "فإننا قد خلصنا، إنما بالرجاء؛ ولكن الرجاء متى رأيناه لا يكون رجاء؛ فما يراه الإنسان لماذا يرجوه بعد؟"]]}, {"l": "Rom 8:25", "n": "", "vs": [[25, "ولكن، إن كنا نرجو ما لا نراه، فبالصبر نتوقعه."]]}, {"l": "Gal 5:5", "n": "", "vs": [[5, "فإننا، بالروح وعلى أساس الإيمان، ننتظر الرجاء الذي ينتجه البر."]]}, {"l": "Col 1:5", "n": "", "vs": [[5, "بسبب الرجاء المحفوظ لكم في السماوات، الرجاء الذي سمعتم به سابقا في كلمة الحق التي في الإنجيل"]]}, {"l": "Col 1:23", "n": "", "vs": [[23, "على أن تثبتوا فعلا في الإيمان، مؤسسين وراسخين وغير متحولين عن رجاء الإنجيل الذي سمعتموه والذي بشر به للخليقة كلها تحت السماء، وله صرت أنا بولس خادما."]]}, {"l": "1Th 5:8", "n": "", "vs": [[8, "وأما نحن، أهل النهار، فلنظل صاحين، متخذين من الإيمان والمحبة درعا لصدورنا، ومن الرجاء بالخلاص خوذة لرؤوسنا."]]}, {"l": "2Th 2:16", "n": "", "vs": [[16, "وليت ربنا يسوع المسيح نفسه، والله أبانا، الذي أحبنا ووهبنا بنعمته راحة أبدية ورجاء صالحا،"]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "Tit 3:7", "n": "", "vs": [[7, "حتى إذا تبررنا بنعمته، نصير ورثة، وفقا لرجائنا بالحياة الأبدية."]]}, {"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}, {"l": "1Jo 3:1-3", "n": "", "vs": [[1, "تأملوا ما أعظم المحبة التي أحبنا بها الآب حتى صرنا ندعى «أولاد الله»، ونحن أولاده حقا. ولكن، بما أن أهل العالم لا يعرفون الله، فهم لا يعرفوننا."], [2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"], [3, "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر."]]}], "kwAr": "ما في دعوته", "noteAr": ""}, {"kw": "his calling", "raw": "Eph_4:1; Rom_8:28-30; Phi_3:14; Col_3:15; 1Th_2:12; 2Th_1:11; 1Ti_6:12; 1Pe_3:9, 1Pe_5:10", "note": "", "refs": [{"l": "Eph 4:1", "n": "", "vs": [[1, "... إذن، أنا السجين في الرب، أناشدكم أن تسلكوا سلوكا يليق بالدعوة التي إليها دعيتم،"]]}, {"l": "Rom 8:28-30", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."], [29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."], [30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."]]}, {"l": "Phi 3:14", "n": "", "vs": [[14, "إذ أسعى إلى الهدف، لنوال تلك الجائزة التي يدعونا الله إليها دعوة عليا في المسيح يسوع."]]}, {"l": "Col 3:15", "n": "", "vs": [[15, "وليملك في قلوبكم سلام المسيح، فإليه قد دعيتم في الجسد الواحد؛ وكونوا شاكرين!"]]}, {"l": "1Th 2:12", "n": "", "vs": [[12, "ونحرضكم أن تسلكوا سلوكا يليق بالله، ذاك الذي يدعوكم إلى ملكوته ومجده."]]}, {"l": "2Th 1:11", "n": "", "vs": [[11, "لأجل ذلك أيضا نصلي من أجلكم على الدوام، لكي يجعلكم إلهنا مؤهلين للدعوة الإلهية ويتم فيكم، بقدرته، كل ما يسره من الصلاح وفعالية الإيمان،"]]}, {"l": "1Ti 6:12", "n": "", "vs": [[12, "أحسن الجهاد في معركة الإيمان الجميلة. تمسك بالحياة الأبدية، التي إليها قد دعيت، وقد اعترفت الاعتراف الحسن (بالإيمان) أمام شهود كثيرين."]]}, {"l": "1Pe 3:9", "n": "", "vs": [[9, "لا تبادلوا الشر بشر، ولا الشتيمة بشتيمة. بل بالعكس: باركوا، فترثوا البركة، لأنه لهذا دعاكم الله ."]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}], "kwAr": "دعوته لكم من رجاء", "noteAr": ""}, {"kw": "the riches", "raw": "Eph_1:7, Eph_1:11, Eph_3:8, Eph_3:16", "note": "", "refs": [{"l": "Eph 1:7", "n": "", "vs": [[7, "ففيه لنا بدمه الفداء، أي غفران الخطايا؛ بحسب غنى نعمته"]]}, {"l": "Eph 1:11", "n": "", "vs": [[11, "وفي المسيح أيضا قد حصلنا على الميراث الذي سبق أن عينا له، وفقا لقصده، هو الذي يعمل كل شيء كما تقضي مشيئته."]]}, {"l": "Eph 3:8", "n": "", "vs": [[8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "Eph 3:16", "n": "", "vs": [[16, "لكي يمنحكم، وفقا لغنى مجده، أن يمد الروح الكيان الداخلي في كل منكم بالقوة المؤيدة،"]]}], "kwAr": "غنى مجد ميراثه", "noteAr": ""}], "arS": [["إذ ", []], ["تستنير", ["G5461"]], [" ", []], ["بصائر", ["G3788"]], [" ", []], ["قلوبكم", ["G1271"]], ["، ", []], ["فتعلموا", ["G1492"]], [" ما في ", []], ["دعوته", ["G2821"]], [" لكم من ", []], ["رجاء", ["G1680"]], ["، وما هو ", []], ["غنى", ["G4149"]], [" ", []], ["مجد", ["G1391"]], [" ", []], ["ميراثه", ["G2817"]], [" في ", []], ["القديسين", ["G40"]], ["،", []]]}, {"c": 1, "v": 19, "text": "وما هي عظمة قدرته الفائقة المعلنة لنا نحن المؤمنين، بحسب عمل اقتدار قوته", "groups": [{"kw": "exceeding", "raw": "Eph_2:10, Eph_3:7, Eph_3:20; Psa_110:2, Psa_110:3; Isa_53:1; Joh_3:6; Act_26:18; Rom_1:16; 2Co_4:7, 2Co_5:17; Phi_2:13; Col_1:29, Col_2:12; 1Th_1:5; 2Th_1:11; Jam_1:18", "note": "", "refs": [{"l": "Eph 2:10", "n": "", "vs": [[10, "فإننا نحن تحفة الله، وقد خلقنا في المسيح يسوع لأعمال صالحة أعدها سلفا لنسلك فيها."]]}, {"l": "Eph 3:7", "n": "", "vs": [[7, "الذي صرت أنا خادما له بحسب نعمة الله الموهوبة لي وفقا لعمل قدرته."]]}, {"l": "Eph 3:20", "n": "", "vs": [[20, "والقادر أن يفعل، وفقا للقدرة العاملة فينا، ما يفوق بلا حصر كل ما نطلب أو نتصور،"]]}, {"l": "Psa 110:2", "n": "", "vs": [[2, "يجعل الرب صهيون منطلقا لسلطانك، ويقول: «احكم في وسط أعدائك»."]]}, {"l": "Psa 110:3", "n": "", "vs": [[3, "في يوم محاربة أعدائك يتطوع شعبك. يجيء شبابك إلى التلال المقدسة كالندى في قلب الفجر."]]}, {"l": "Isa 53:1", "n": "", "vs": [[1, "من آمن بكلامنا، ولمن ظهرت يد الرب؟"]]}, {"l": "Joh 3:6", "n": "", "vs": [[6, "فالمولود من الجسد هو جسد، والمولود من الروح هو روح."]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "Rom 1:16", "n": "", "vs": [[16, "فأنا لا أستحي بالإنجيل، لأنه قدرة الله للخلاص، لكل من يؤمن، لليهودي أولا ثم لليوناني على السواء."]]}, {"l": "2Co 4:7", "n": "", "vs": [[7, "ولكن هذا الكنز نحمله نحن في أوعية من فخار، ليتبين أن القدرة الفائقة آتية من الله لا صادرة منا."]]}, {"l": "2Co 5:17", "n": "", "vs": [[17, "فإنه إذا كان أحد في المسيح، فهو خليقة جديدة: إن الأشياء القديمة قد زالت، وها كل شيء قد صار جديدا."]]}, {"l": "Phi 2:13", "n": "", "vs": [[13, "لأن الله هو الذي ينشيء فيكم الإرادة والعمل لأجل مرضاته."]]}, {"l": "Col 1:29", "n": "", "vs": [[29, "ولأجل هذا أتعب أنا أيضا وأجاهد، بفضل قدرته العاملة في بقوة."]]}, {"l": "Col 2:12", "n": "", "vs": [[12, "فقد دفنتم معه في المعمودية، وفيها أيضا أقمتم معه، عن طريق إيمانكم بقدرة الله الذي أقامه من بين الأموات."]]}, {"l": "1Th 1:5", "n": "", "vs": [[5, "لأن تبشيرنا لكم بالإنجيل لم يكن مجرد كلام، بل كان مصحوبا أيضا بالقوة وبالروح القدس وبتمام اليقين. كما أنكم تعلمون تماما ماذا كنا بينكم لأجل مصلحتكم،"]]}, {"l": "2Th 1:11", "n": "", "vs": [[11, "لأجل ذلك أيضا نصلي من أجلكم على الدوام، لكي يجعلكم إلهنا مؤهلين للدعوة الإلهية ويتم فيكم، بقدرته، كل ما يسره من الصلاح وفعالية الإيمان،"]]}, {"l": "Jam 1:18", "n": "", "vs": [[18, "وهو قد شاء أن يجعلنا أولادا له، فولدنا بكلمته، كلمة الحق. وغايته أن نكون باكورة خليقته."]]}], "kwAr": "عظمة قدرته الفائقة", "noteAr": ""}, {"kw": "his mighty", "raw": "Gr. the might of his", "note": "Gr. the might of his", "refs": [], "kwAr": "اقتدار قوته", "noteAr": "في اليونانية: قوة شدّته."}], "arS": [["وما هي ", []], ["عظمة", ["G3174"]], [" ", []], ["قدرته", ["G1411"]], [" ", []], ["الفائقة", ["G5235"]], [" المعلنة لنا نحن ", []], ["المؤمنين", ["G4100"]], ["، ", []], ["بحسب", ["G2596"]], [" ", []], ["عمل", ["G1753"]], [" ", []], ["اقتدار", ["G2904"]], [" ", []], ["قوته", ["G2479"]]]}, {"c": 1, "v": 20, "text": "الذي عمله في المسيح، بإقامته له من بين الأموات. وقد أجلسه عن يمينه في الأماكن السماوية،", "groups": [{"kw": "he wrought", "raw": "Eph_2:5, Eph_2:6; Rom_6:5-11; Phi_3:10; 1Pe_1:3", "note": "", "refs": [{"l": "Eph 2:5", "n": "", "vs": [[5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"]]}, {"l": "Eph 2:6", "n": "", "vs": [[6, "وأقامنا معه وأجلسنا معه في الأماكن السماوية في المسيح يسوع."]]}, {"l": "Rom 6:5-11", "n": "", "vs": [[5, "فما دمنا قد اتحدنا به في ما يشبه موته، فإننا سنتحد به أيضا في قيامته."], [6, "فنحن نعلم هذا: أن الإنسان العتيق فينا قد صلب معه لكي يبطل جسد الخطيئة فلا نبقى عبيدا للخطيئة فيما بعد."], [7, "فإن من مات، قد تحرر من الخطيئة."], [8, "ومادمنا متنا مع المسيح، فنحن نؤمن أننا سنحيا أيضا معه،"], [9, "لكوننا على يقين بأن المسيح، وقد أقيم من بين الأموات، لا يموت مرة ثانية، إذ ليس للموت سيادة عليه بعد."], [10, "لأنه بموته، قد مات لأجل الخطيئة مرة واحدة؛ وبحياته، يحيا لله."], [11, "فكذلك أنتم أيضا، احسبوا أنفسكم أمواتا بالنسبة للخطيئة وأحياء لله في المسيح يسوع."]]}, {"l": "Phi 3:10", "n": "", "vs": [[10, "وغايتي أن أعرف المسيح وقوة قيامته والشركة في آلامه؛ والتشبه به في موته،"]]}, {"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}], "kwAr": "الذي عمله في المسيح", "noteAr": ""}, {"kw": "when", "raw": "Psa_16:9-11; Joh_10:18, Joh_10:30; Act_2:24-33, Act_4:10, Act_10:40, Act_26:8; Rom_1:4; Heb_13:20", "note": "", "refs": [{"l": "Psa 16:9-11", "n": "", "vs": [[9, "لذلك فرح قلبي وتهلل لساني حتى إن جسدي سيرقد على رجاء،"], [10, "لأنك لن تترك نفسي في هوة الأموات ولن تدع وحيدك القدوس ينال منه الفساد."], [11, "هديتني سبل الحياة: فإن ملء البهجة في حضرتك، وفي يمينك مسرات أبدية."]]}, {"l": "Joh 10:18", "n": "", "vs": [[18, "لا أحد ينتزع حياتي مني، بل أنا أبذلها باختياري. فلي السلطة أن أبذلها ولي السلطة أن أستردها. هذه الوصية تلقيتها من أبي»."]]}, {"l": "Joh 10:30", "n": "", "vs": [[30, "أنا والآب واحد!»"]]}, {"l": "Act 2:24-33", "n": "", "vs": [[24, "ولكن الله أقامه من بين الأموات ناقضا أوجاع الموت، فما كان يمكن للموت أن يبقيه في قبضته!"], [25, "فإن داود يقول فيه: كنت أرى الرب أمامي دائما فإنه عن يميني لئلا أتزعزع."], [26, "لذلك فرح قلبي وتهلل لساني. حتى إن جسدي سيرقد على رجاء."], [27, "لأنك لن تترك نفسي في هوة الأموات، ولن تدع وحيدك القدوس يرى فسادا،"], [28, "هديتني سبل الحياة، وستملأني سرورا برؤية وجهك!"], [29, "أيها الإخوة، دعوني أقول لكم صراحة إن أبانا داود مات ودفن، وقبره مازال عندنا حتى اليوم."], [30, "لأن داود كان نبيا، وعارفا أن الله أقسم له يمينا بأن يجيء المسيح من نسله ويجلس على عرشه،"], [31, "فقد تكلم عن قيامة المسيح كما رآها مسبقا، فقال إن نفسه لم تترك في هوة الأموات، ولم ينل من جسده الفساد."], [32, "فيسوع هذا أقامه الله من الموت، ونحن جميعا شهود لذلك."], [33, "وإذ رفع إلى يمين الله، وأخذ من الآب الروح القدس الموعود به، أفاضه علينا. وما ترونه الآن وتسمعونه هو نتيجة لذلك."]]}, {"l": "Act 4:10", "n": "", "vs": [[10, "فاعلموا جميعا، وليعرف شعب إسرائيل كله، أنه باسم يسوع المسيح الناصري الذي صلبتموه أنتم، والذي أقامه الله من بين الأموات، باسمه يقف هذا الكسيح أمامكم في تمام الصحة!"]]}, {"l": "Act 10:40", "n": "", "vs": [[40, "ولكن الله أقامه من الموت في اليوم الثالث، وجعله يظهر،"]]}, {"l": "Act 26:8", "n": "", "vs": [[8, "لماذا لا تصدقون أن الله يقيم الأموات؟"]]}, {"l": "Rom 1:4", "n": "", "vs": [[4, "ومن ناحية روح القداسة، تبين بقوة أنه ابن الله بالقيامة من بين الأموات. إنه يسوع المسيح ربنا"]]}, {"l": "Heb 13:20", "n": "", "vs": [[20, "وأسأل الله ، إله السلام الذي أقام من بين الأموات ربنا يسوع راعي الخراف العظيم بفضل دمه الذي ختم به العهد الأبدي"]]}], "kwAr": "بإقامته له من بين الأموات", "noteAr": ""}, {"kw": "and set", "raw": "Eph_4:8-10; Psa_110:1; Mat_22:43-45, Mat_26:64, Mat_28:18; Mar_14:62, Mar_16:19; Joh_17:1-5; Act_2:34-36, Act_5:31, Act_7:55, Act_7:56; Rom_8:34; Col_3:1; Heb_1:3, Heb_2:9; Heb_10:12; Rev_1:17, Rev_5:11-14", "note": "", "refs": [{"l": "Eph 4:8-10", "n": "", "vs": [[8, "لذلك يقول (الوحي): «إذ صعد إلى الأعالي، ساق أسرى، ووهب الناس مواهب!»"], [9, "وأما أنه «صعد»، فما معنى هذا سوى أنه كان قد نزل أيضا إلى الأقسام السفلى في الأرض؟"], [10, "إن الذي نزل هو نفسه الذي صعد إلى ما فوق جميع السماوات لكي يملأ كل شيء."]]}, {"l": "Psa 110:1", "n": "", "vs": [[1, "قال الرب لربي: «اجلس عن يميني حتى أضع أعداءك موطئا لقدميك»."]]}, {"l": "Mat 22:43-45", "n": "", "vs": [[43, "فسألهم: «إذن، كيف يدعوه داود بالروح ربا له إذ يقول:"], [44, "قال الرب لربي: اجلس عن يميني حتى أضع أعداءك موطئا لقدميك؟"], [45, "فإن كان داود يدعوه ربه، فكيف يكون ابنه؟»"]]}, {"l": "Mat 26:64", "n": "", "vs": [[64, "فأجابه يسوع: «أنت قلت! وأقول لكم أيضا إنكم منذ الآن سوف ترون ابن الإنسان جالسا عن يمين القدرة ثم آتيا على سحب السماء!»"]]}, {"l": "Mat 28:18", "n": "", "vs": [[18, "فتقدم يسوع وكلمهم قائلا: «دفع إلي كل سلطان في السماء وعلى الأرض."]]}, {"l": "Mar 14:62", "n": "", "vs": [[62, "فقال يسوع: «أنا هو. وسوف ترون ابن الإنسان جالسا عن يمين القدرة، ثم آتيا على سحب السماء! »"]]}, {"l": "Mar 16:19", "n": "", "vs": [[19, "ثم إن الرب، بعدما كلمهم، رفع إلى السماء، وجلس عن يمين الله."]]}, {"l": "Joh 17:1-5", "n": "", "vs": [[1, "ولما أنهى يسوع هذا الحديث رفع عينيه نحو السماء، وقال: «أيها الآب، قد حانت الساعة! مجد ابنك، ليمجدك ابنك أيضا،"], [2, "فقد أوليته السلطة على جميع البشر، ليمنح جميع الذين قد وهبتهم له حياة أبدية."], [3, "والحياة الأبدية هي أن يعرفوك أنت الإله الحق وحدك، والذي أرسلته: يسوع المسيح."], [4, "أنا مجدتك على الأرض، وأنجزت العمل الذي كلفتني."], [5, "فمجدني في حضرتك الآن، أيها الآب، بما كان لي من مجد عندك قبل تكوين العالم."]]}, {"l": "Act 2:34-36", "n": "", "vs": [[34, "فإن داود لم يرتفع بجسده إلى السماء. ثم إنه هو نفسه يقول: قال الرب لربي: اجلس عن يميني"], [35, "حتى أجعل أعداءك موطئا لقدميك."], [36, "فليعلم يقينا بنو إسر ائيل جميعا، أن الله قد جعل يسوع، هذا الذي صلبتموه أنتم، ربا ومسيحا!»"]]}, {"l": "Act 5:31", "n": "", "vs": [[31, "ولكن الله رفعه إلى يمينه وجعله رئيسا ومخلصا ليمنح إسرائيل التوبة وغفران الخطايا؛"]]}, {"l": "Act 7:55", "n": "", "vs": [[55, "فرفع استفانوس نظره إلى السماء، وهو ممتليء من الروح القدس، فرأى مجد الله ويسوع واقفا عن يمين الله،"]]}, {"l": "Act 7:56", "n": "", "vs": [[56, "فقال: «إني أرى السماء مفتوحة وابن الإنسان واقفا عن يمين الله!»"]]}, {"l": "Rom 8:34", "n": "", "vs": [[34, "فمن ذا يدين؟ إنه المسيح يسوع هو الذي مات، بل بالأحرى قام، وهو أيضا عن يمين الله، وهو يشفع فينا أيضا."]]}, {"l": "Col 3:1", "n": "", "vs": [[1, "فبما أنكم قد قمتم مع المسيح، فاسعوا إلى الأمور التي في العلى، حيث المسيح جالس عن يمين الله."]]}, {"l": "Heb 1:3", "n": "", "vs": [[3, "إنه ضياء مجد الله وصورة جوهره. حافظ كل ما في الكون بكلمته القديرة. وهو الذي بعدما طهرنا بنفسه من خطايانا،"]]}, {"l": "Heb 2:9", "n": "", "vs": [[9, "إلا أننا نرى يسوع الآن مكللا بالمجد والكرامة، لأنه قاسى الموت. وذلك بعدما صار أدنى من الملائكة إلى حين، ليذوق بنعمة الله الموت عوضا عن كل واحد."]]}, {"l": "Heb 10:12", "n": "", "vs": [[12, "ولكن المسيح، رئيس كهنتنا، قدم ذبيحة واحدة عن الخطايا، ثم جلس إلى الأبد عن يمين الله،"]]}, {"l": "Rev 1:17", "n": "", "vs": [[17, "فلما رأيته ارتميت عند قدميه كالميت، فلمسني بيده اليمنى وقال: «لا تخف! أنا الأول والآخر،"]]}, {"l": "Rev 5:11-14", "n": "", "vs": [[11, "ثم نظرت، فسمعت ترتيل الملايين من الملائكة وهي تحيط بالعرش وبالكائنات الحية والشيوخ،"], [12, "وهم يهتفون بصوت عال: «مستحق هو الحمل المذبوح أن ينال القدرة والغنى والحكمة والقوة والإجلال والمجد والبركة»."], [13, "ثم سمعت كل خليقة في السماء وعلى الأرض، وتحت الأرض، وعلى البحر، هاتفة مع كل ما فيها: «البركة والإجلال والمجد والسلطة للجالس على العرش وللحمل، إلى أبد الآبدين»."], [14, "فردت الكائنات الحية الأربعة: «آمين!» وجثا الشيوخ ساجدين."]]}], "kwAr": "وقد أجلسه عن يمينه", "noteAr": ""}, {"kw": "heavenly", "raw": "Eph_1:3", "note": "", "refs": [{"l": "Eph 1:3", "n": "", "vs": [[3, "تبارك الله ، أبو ربنا يسوع المسيح الذي باركنا بكل بركة روحية في الأماكن السماوية."]]}], "kwAr": "في الأماكن السماوية", "noteAr": ""}], "arS": [["الذي ", []], ["عمله", ["G1754"]], [" في ", []], ["المسيح", ["G5547"]], ["، ", []], ["بإقامته", ["G1453"]], [" له من بين ", []], ["الأموات", ["G3498"]], [". وقد ", []], ["أجلسه", ["G2523"]], [" عن ", []], ["يمينه", ["G1188"]], [" في الأماكن ", []], ["السماوية", ["G2032"]], ["،", []]]}, {"c": 1, "v": 21, "text": "أرفع جدا من كل رئاسة وسلطة وقوة وسيا دة، ومن كل اسم يسمى، لا في هذا العالم وحسب، بل في ذلك الآتي أيضا.", "groups": [{"kw": "above", "raw": "Phi_2:9, Phi_2:10; Col_2:10; Heb_1:4", "note": "", "refs": [{"l": "Phi 2:9", "n": "", "vs": [[9, "لذلك أيضا رفعه الله عاليا، وأعطاه الاسم الذي يفوق كل اسم،"]]}, {"l": "Phi 2:10", "n": "", "vs": [[10, "لكي تنحني سجودا لاسم يسوع كل ركبة، سواء في السماء أم على الأرض أم تحت الأرض،"]]}, {"l": "Col 2:10", "n": "", "vs": [[10, "وأنتم مكملون فيه. فهو رأس كل رئاسة وسلطة؛"]]}, {"l": "Heb 1:4", "n": "", "vs": [[4, "جلس في الأعالي عن يمين الله العظيم. وهكذا، أخذ مكانا أعظم من الملائكة، بما أن الاسم الذي ورثه متفوق جدا على أسماء الملائكة جميعا!"]]}], "kwAr": "أرفع جدا", "noteAr": ""}, {"kw": "principality", "raw": "Eph_3:10, Eph_6:12; Dan_7:27; Rom_8:38, Rom_8:39; Col_1:15, Col_1:16, Col_2:15; Heb_4:14; 1Pe_3:22", "note": "", "refs": [{"l": "Eph 3:10", "n": "", "vs": [[10, "والغاية أن يتجلى الآن أمام الرئاسات والسلطات في الأماكن السماوية ما يظهر في الكنيسة من حكمة الله المتعددة الوجوه،"]]}, {"l": "Eph 6:12", "n": "", "vs": [[12, "فإن حربنا ليست ضد ذوي اللحم والدم، بل ضد الرئاسات، ضد السلطات، ضد أسياد العالم حكام هذا الظلام، ضد قوى الشر الروحية في الأماكن السماوية."]]}, {"l": "Dan 7:27", "n": "", "vs": [[27, "وتوهب المملكة والسلطان وعظمة الممالك القائمة تحت كل السماء إلى شعب قديسي العلي، فيكون ملكوت العلي ملكوتا أبديا، وتعبده جميع السلاطين ويطيعونه."]]}, {"l": "Rom 8:38", "n": "", "vs": [[38, "فإني لعلى يقين بأنه لا الموت ولا الحياة، ولا الملائكة ولا الرياسات، ولا الأمور الحاضرة ولا الآتية، ولا القوات،"]]}, {"l": "Rom 8:39", "n": "", "vs": [[39, "ولا الأعالي ولا الأعماق، ولا خليقة أخرى، تقدر أن تفصلنا عن محبة الله التي لنا في المسيح يسوع ربنا."]]}, {"l": "Col 1:15", "n": "", "vs": [[15, "هو صورة الله الذي لا يرى، والبكر على كل ما قد خلق،"]]}, {"l": "Col 1:16", "n": "", "vs": [[16, "إذ به خلقت جميع الأشياء: ما في السماوات وما على الأرض، ما يرى وما لا يرى، أعروشا كانت أم سيادات أم رئاسات أم سلطات. كل ما في الكون قد خلق به ولأجله."]]}, {"l": "Col 2:15", "n": "", "vs": [[15, "وإذ نزع سلاح الرئاسات والسلطات، فضحهم جهارا فيه، وساقهم في موكبه ظافرا عليهم."]]}, {"l": "Heb 4:14", "n": "", "vs": [[14, "فمادام لنا رئيس كهنتنا العظيم الذي ارتفع مجتازا السماوات، وهو يسوع ابن الله، فلنتمسك دائما بالاعتراف به."]]}, {"l": "1Pe 3:22", "n": "", "vs": [[22, "الذي انطلق إلى السماء، وهو الآن جالس عن يمين الله؛ وقد جعلت الملائكة والسلطات والقوات (الروحية) خاضعة له!"]]}], "kwAr": "من كل رئاسة", "noteAr": ""}, {"kw": "every", "raw": "Mat_28:19; Act_4:12; Phi_2:9-11; Rev_19:12, Rev_19:13", "note": "", "refs": [{"l": "Mat 28:19", "n": "", "vs": [[19, "فاذهبوا إذن، وتلمذوا جميع الأمم، وعمدوهم باسم الآب والابن والروح القدس؛"]]}, {"l": "Act 4:12", "n": "", "vs": [[12, "وليس بأحد غيره الخلاص، إذ ليس تحت السماء اسم آخر قدمه الله للبشر به يجب أن نخلص!»"]]}, {"l": "Phi 2:9-11", "n": "", "vs": [[9, "لذلك أيضا رفعه الله عاليا، وأعطاه الاسم الذي يفوق كل اسم،"], [10, "لكي تنحني سجودا لاسم يسوع كل ركبة، سواء في السماء أم على الأرض أم تحت الأرض،"], [11, "ولكي يعترف كل لسان بأن يسوع المسيح هو الرب، لمجد الله الآب."]]}, {"l": "Rev 19:12", "n": "", "vs": [[12, "عيناه كلهيب نار، وعلى رأسه أكاليل كثيرة، وقد كتب على جبهته اسم لا يعرفه أحد إلا هو."]]}, {"l": "Rev 19:13", "n": "", "vs": [[13, "وكان يرتدي ثوبا مغمسا بالدم؛ أما اسمه فهو «كلمة الله»"]]}], "kwAr": "ومن كل اسم يسمى", "noteAr": ""}, {"kw": "in that", "raw": "Mat_25:31-36, Mat_28:18; Joh_5:25-29; Heb_2:5; Rev_20:10-15", "note": "", "refs": [{"l": "Mat 25:31-36", "n": "", "vs": [[31, "وعندما يعود ابن الإنسان في مجده ومعه جميع ملائكته، فإنه يجلس على عرش مجده،"], [32, "وتجتمع أمامه الشعوب كلها، فيفصل بعضهم عن بعض كما يفصل الراعي الغنم عن المعاز،"], [33, "فيوقف الغنم عن يمينه، والمعاز عن يساره؛"], [34, "ثم يقول الملك للذين عن يمينه: تعالوا يامن باركهم أبي، رثوا الملكوت الذي أعد لكم منذ إنشاء العالم:"], [35, "لأني جعت فأطعمتموني، عطشت فسقيتموني، كنت غريبا فآويتموني،"], [36, "عريانا فكسوتموني، مريضا فزرتموني، سجينا فأتيتم إلي!"]]}, {"l": "Mat 28:18", "n": "", "vs": [[18, "فتقدم يسوع وكلمهم قائلا: «دفع إلي كل سلطان في السماء وعلى الأرض."]]}, {"l": "Joh 5:25-29", "n": "", "vs": [[25, "الحق الحق أقول لكم: إن الساعة التي يسمع فيها الأموات صوت ابن الله ستأتي بل هي الآن والذين يسمعونه يحيون."], [26, "لأنه كما أن للآب حياة في ذاته، فقد أعطى الابن أيضا أن تكون له حياة في ذاته،"], [27, "وأعطاه سلطة أن يدين، لأنه ابن الإنسان."], [28, "لا تتعجبوا من هذا: فسوف تأتي ساعة يسمع فيها جميع من في القبور صوته،"], [29, "فيخرجون منها: فالذين عملوا الصالحات يخرجون في القيامة المؤدية إلى الحياة، وأما الذين عملوا السيئات ففي القيامة المؤدية إلى الدينونة."]]}, {"l": "Heb 2:5", "n": "", "vs": [[5, "ثم إن «العالم الآتي» الذي نتحدث عنه كثيرا، لن يكون خاضعا لسيطرة الملائكة."]]}, {"l": "Rev 20:10-15", "n": "", "vs": [[10, "ثم يطرح إبليس الذي كان يضللهم، في بحيرة النار والكبريت، حيث الوحش والنبي الدجال. هناك سوف يعذبون نهارا وليلا، إلى أبد الآبدين."], [11, "ثم رأيت عرشا عظيما أبيض هربت السماء والأرض من أمام الجالس عليه، فلم يبق لهما مكان."], [12, "ورأيت الأموات، كبارا وصغارا، واقفين قدام العرش. وفتحت الكتب، ثم فتح كتاب آخر هو سجل الحياة، ودين الأموات بحسب ما هو مدون في تلك الكتب، كل واحد حسب أعماله."], [13, "وسلم البحر من فيه من الأموات، وسلم الموت وهاوية الموتى الأموات الذين فيهما، وحكم على كل واحد بحسب أعماله."], [14, "وطرح الموت وهاوية الموتى في بحيرة النار، الذي هو الموت الثاني."], [15, "وكل من لم يوجد اسمه مكتوبا في سجل الحياة طرح في بحيرة النار!"]]}], "kwAr": "في ذلك الآتي", "noteAr": ""}], "arS": [["أرفع جدا", ["G5231"]], [" من ", []], ["كل", ["G3956"]], [" ", []], ["رئاسة", ["G746"]], [" ", []], ["وسلطة", ["G1849"]], [" ", []], ["وقوة", ["G1411"]], [" وسيا دة، ومن كل ", []], ["اسم", ["G3686"]], [" ", []], ["يسمى", ["G3687"]], ["، لا في هذا ", []], ["العالم", ["G165"]], [" ", []], ["وحسب", ["G3440"]], ["، بل في ذلك ", []], ["الآتي", ["G3195"]], [" أيضا.", []]]}, {"c": 1, "v": 22, "text": "وأخضع كل شيء تحت قدميه، وإياه جعل فوق كل شيء رأسا للكنيسة", "groups": [{"kw": "put", "raw": "Gen_3:15; Psa_8:6-8, Psa_91:13; 1Co_15:25-27; Heb_2:8", "note": "", "refs": [{"l": "Gen 3:15", "n": "", "vs": [[15, "وأثير عداوة دائمة بينك وبين المرأة، وكذلك بين نسليكما. هو يسحق رأسك وأنت تلدغين عقبه»."]]}, {"l": "Psa 8:6-8", "n": "", "vs": [[6, "وأعطيته السلطة على كل ما صنعته يداك. أخضعت كل شيء تحت قدميه."], [7, "الغنم والبقر وجميع المواشي، ووحوش البرية أيضا،"], [8, "والطيور والأسماك وجميع الحيوانات المائية."]]}, {"l": "Psa 91:13", "n": "", "vs": [[13, "تطأ على الأسد والأفعى، تدوس الشبل والثعبان."]]}, {"l": "1Co 15:25-27", "n": "", "vs": [[25, "فإنه لابد أن يملك «إلى أن يضع جميع الأعداء تحت قدميه»."], [26, "وآخر عدو يباد هو الموت. ذلك بأنه قد «أخضع كل شيء تحت قدميه»."], [27, "ولكن، في قوله إن كل شيء قد أخضع، فمن الواضح أنه يستثني الله الذي جعل كل شيء خاضعا للابن."]]}, {"l": "Heb 2:8", "n": "", "vs": [[8, "أخضعت كل شيء تحت قدميه!» فمادام الله قد أخضع للابن كل شيء، فإنه لم يترك شيئا غير خاضع له. ولكننا الآن لا نرى كل شيء تحت سلطته: (لأن ذلك سيحدث فيما بعد)."]]}], "kwAr": "وأخضع كل شيء تحت قدميه", "noteAr": ""}, {"kw": "gave", "raw": "Eph_4:15, Eph_4:16; 1Co_11:3; Col_1:8, Col_2:10,Col_2:19", "note": "", "refs": [{"l": "Eph 4:15", "n": "", "vs": [[15, "بل نتمسك بالحق في المحبة، فننمو في كل شيء نحو من هو الرأس، أي المسيح."]]}, {"l": "Eph 4:16", "n": "", "vs": [[16, "فمنه يستمد الجسد كله تماسكه وترابطه بمساندة كل مفصل وفقا لمقدار العمل المخصص لكل جزء، لينشيء نموا يؤول إلى بنيان الجسد بنيانا ذاتيا في المحبة."]]}, {"l": "1Co 11:3", "n": "", "vs": [[3, "ولكني أريد أن تعلموا أن المسيح هو الرأس لكل رجل؛ أما رأس المرأة فهو الرجل، ورأس المسيح هو الله ."]]}, {"l": "Col 1:8", "n": "", "vs": [[8, "وهو نفسه أخبرنا بما لكم من المحبة في الروح."]]}, {"l": "Col 2:10", "n": "", "vs": [[10, "وأنتم مكملون فيه. فهو رأس كل رئاسة وسلطة؛"]]}, {"l": "Col 2:19", "n": "", "vs": [[19, "وهو غير ممسك بالرأس الذي منه يتلقى الجسد كله غذاءه وتماسكه بالمفاصل والأوصال، فينمو النمو الذي يمنحه الله ."]]}], "kwAr": "وإياه جعل فوق كل شيء رأسا", "noteAr": ""}, {"kw": "to the", "raw": "Eph_3:21; Mat_16:18; Act_20:28; 1Ti_3:15; Heb_12:22-24", "note": "", "refs": [{"l": "Eph 3:21", "n": "", "vs": [[21, "له المجد في الكنيسة، في المسيح يسوع، مدى الأجيال والدهور! آمين …"]]}, {"l": "Mat 16:18", "n": "", "vs": [[18, "وأنا أيضا أقول لك: أنت صخر. وعلى هذه الصخرة أبني كنيستي وأبواب الجحيم لن تقوى عليها!"]]}, {"l": "Act 20:28", "n": "", "vs": [[28, "فاسهروا إذن على أنفسكم وعلى جميع القطيع الذي عينكم بينه الروح القدس نظارا، لترعوا كنيسة الله التي اشتراها بدمه."]]}, {"l": "1Ti 3:15", "n": "", "vs": [[15, "حتى إذا تأخرت تعلم كيف يجب التصرف في بيت الله، أي كنيسة الله الحي، ركن الحق ودعامته."]]}, {"l": "Heb 12:22-24", "n": "", "vs": [[22, "ولكنكم قد اقتربتم إلى جبل صهيون، إلى مدينة الله الحي، أورشليم السماوية. بل تقدمتم إلى حفلة يجتمع فيها عدد لا يحصى من الملائكة،"], [23, "إلى كنيسة تجمع أبناء لله أبكارا، أسماؤهم مكتوبة في السماء. بل إلى الله نفسه، ديان الجميع، وإلى أرواح أناس بررهم الله وجعلهم كاملين."], [24, "كذلك، تقدمتم إلى يسوع، وسيط العهد الجديد، وإلى دمه المرشوش الذي يتكلم مطالبا بأفضل مما طالب به دم هابيل."]]}], "kwAr": "للكنيسة", "noteAr": ""}], "arS": [["وأخضع", ["G5293"]], [" ", []], ["كل شيء", ["G3956"]], [" ", []], ["تحت", ["G5259"]], [" ", []], ["قدميه", ["G4228"]], ["، وإياه ", []], ["جعل", ["G1325"]], [" فوق ", []], ["كل شيء", ["G3956"]], [" ", []], ["رأسا", ["G2776"]], [" ", []], ["للكنيسة", ["G1577"]]]}, {"c": 1, "v": 23, "text": "التي هي جسده وكماله، هو الذي يكمل الكل في الكل.", "groups": [{"kw": "his", "raw": "Eph_2:16, Eph_4:4, Eph_4:12, Eph_5:23-32; Rom_13:5; 1Cor. 12:12-27; Col_1:18, Col_1:24, Col_3:15", "note": "", "refs": [{"l": "Eph 2:16", "n": "", "vs": [[16, "ولكي يصالحهما معا في جسد واحد مع الله بالصليب الذي به قتل العداء."]]}, {"l": "Eph 4:4", "n": "", "vs": [[4, "مثلما دعيتم، جميعكم، دعوة لها رجاء واحد."]]}, {"l": "Eph 4:12", "n": "", "vs": [[12, "لتأهيل القديسين من جهة عمل الخدمة، لبنيان جسد المسيح،"]]}, {"l": "Eph 5:23-32", "n": "", "vs": [[23, "فإن الزوج هو رأس الزوجة كما أن المسيح أيضا هو رأس الكنيسة (جسده)، وهو نفسه مخلص الجسد."], [24, "فكما أن الكنيسة قد أخضعت للمسيح، فكذلك الزوجات أيضا لأزواجهن، في كل شيء."], [25, "أيها الأزواج، أحبوا زوجاتكم مثلما أحب المسيح الكنيسة وبذل نفسه لأجلها،"], [26, "لكي يقدسها مطهرا إياها بغسل الماء، بالكلمة،"], [27, "حتى يزفها إلى نفسه كنيسة بهية لا يشوبها عيب أو تجعد أو أية نقيصة مشابهة بل تكون مقدسة خالية من العيوب."], [28, "على هذا المثال يجب على الأزواج أن يحبوا زوجاتهم كأجسادهم. إن من يحب زوجته، يحب نفسه."], [29, "فلا أحد يبغض جسده البتة، بل يغذيه ويعتني به، كما يعامل المسيح أيضا الكنيسة."], [30, "فإننا نحن أعضاء جسده."], [31, "لذلك يستقل الزوج عن أبيه وأمه، ويتحد بزوجته، فيصير الاثنان جسدا واحدا."], [32, "هذا السر عظيم ولكنني أشير به إلى المسيح والكنيسة!"]]}, {"l": "Rom 13:5", "n": "", "vs": [[5, "ولذلك، فمن الضروري أن تخضعوا، لا اتقاء للغضب فقط، بل مراعاة للضمير أيضا."]]}, {"l": "1Co 12:12-27", "n": "", "vs": [[12, "فكما أن الجسد واحد وله أعضاء كثيرة، ولكن أعضاء الجسد كلها تشكل جسما واحدا مع أنها كثيرة، فكذلك حال المسيح أيضا."], [13, "فإننا، بالروح الواحد، قد تعمدنا جميعا لنصير جسدا واحدا، سواء كنا يهودا أم يونانيين، عبيدا أم أحرارا، وقد سقينا جميعا الروح الواحد."], [14, "فليس الجسد عضوا واحدا بل مجموعة أعضاء."], [15, "فإن قالت الرجل: «لأني لست يدا، لست من الجسد!» فهل تصبح من خارج الجسد فعلا؟"], [16, "وإن قالت الأذن: «لأني لست عينا، لست من الجسد!» فهل تصبح من خارج الجسد فعلا؟"], [17, "فلو كان الجسد كله عينا، فكيف كنا نسمع؟ ولو كان كله أذنا، فكيف كنا نشم؟"], [18, "على أن الله قد رتب كلا من الأعضاء في الجسد كما أراد."], [19, "فلو كانت كلها عضوا واحدا، فكيف يتكون الجسد؟"], [20, "فالواقع أن الأعضاء كثيرة، والجسد واحد."], [21, "وهكذا، لا تستطيع العين أن تقول لليد: «أنا لا أحتاج إليك!» ولا الرأس أن تقول للرجلين: «أنا لا أحتاج إليكما!»،"], [22, "بل بالأحرى جدا، أعضاء الجسد التي تبدو أضعف الأعضاء هي ضرورية،"], [23, "وتلك التي نعتبرها أقل ما في الجسد كرامة، نكسوها بإكرام أوفر. والأعضاء غير اللائقة يكون لها لياقة أوفر؛"], [24, "أما اللائقة، فلا تحتاج إلى ذلك. ولكن الله أحكم صنع الجسد بجملته، معطيا كرامة أوفر لما تنقصه الكرامة،"], [25, "لكي لا يكون في الجسد انقسام بل يكون بين الأعضاء اهتمام واحد لمصلحة الجسد."], [26, "فحين يصيب الألم واحدا من الأعضاء، تشعر الأعضاء الباقية معه بالألم. وحين ينال واحد من الأعضاء إكراما، تفرح معه الأعضاء الباقية."], [27, "فالواقع أنكم أنتم جميعا جسد المسيح، وأعضاء فيه كل بمفرده."]]}, {"l": "Col 1:18", "n": "", "vs": [[18, "وهو رأس الجسد، أي الكنيسة؛ هو البداءة وبكر القائمين من بين الأموات، ليكون له المقام الأول في كل شيء."]]}, {"l": "Col 1:24", "n": "", "vs": [[24, "والآن أنا أفرح في الآلام التي أقاسيها لأجلكم، وأتمم في جسدي ما نقص من ضيقات المسيح لأجل جسده الذي هو الكنيسة،"]]}, {"l": "Col 3:15", "n": "", "vs": [[15, "وليملك في قلوبكم سلام المسيح، فإليه قد دعيتم في الجسد الواحد؛ وكونوا شاكرين!"]]}], "kwAr": "التي هي جسده", "noteAr": ""}, {"kw": "fulness", "raw": "Eph_3:19, Eph_4:10; Joh_1:16; 1Co_12:6, 1Co_15:28; Col_1:19, Col_2:9, Col_2:10, Col_3:11", "note": "", "refs": [{"l": "Eph 3:19", "n": "", "vs": [[19, "وتعرفوا محبة المسيح التي تفوق المعرفة، فتمتلئوا حتى تبلغوا ملء الله كله."]]}, {"l": "Eph 4:10", "n": "", "vs": [[10, "إن الذي نزل هو نفسه الذي صعد إلى ما فوق جميع السماوات لكي يملأ كل شيء."]]}, {"l": "Joh 1:16", "n": "", "vs": [[16, "فمن امتلائه أخذنا جميعنا ونلنا نعمة على نعمة،"]]}, {"l": "1Co 12:6", "n": "", "vs": [[6, "وهناك أيضا أعمال مختلفة، ولكن الله واحد، وهو يعمل كل شيء في الجميع."]]}, {"l": "1Co 15:28", "n": "", "vs": [[28, "وعندما يتم إخضاع كل شيء للابن، فإن الابن نفسه سيخضع للذي أخضع له كل شيء، لكي يكون الله هو كل شيء في كل شيء!"]]}, {"l": "Col 1:19", "n": "", "vs": [[19, "فإنه فيه سر الله أن يحل بكل ملئه،"]]}, {"l": "Col 2:9", "n": "", "vs": [[9, "فإنه فيه، جسديا، يحل الله بكل ملئه،"]]}, {"l": "Col 2:10", "n": "", "vs": [[10, "وأنتم مكملون فيه. فهو رأس كل رئاسة وسلطة؛"]]}, {"l": "Col 3:11", "n": "", "vs": [[11, "وفيه لا فرق بين يوناني ويهودي، أو مختون وغير مختون، أو متحضر ومتخلف، أو عبد وحر، بل المسيح هو الكل وفي الكل."]]}], "kwAr": "وكماله", "noteAr": ""}], "arS": [["التي هي ", []], ["جسده", ["G4983"]], [" ", []], ["وكماله", ["G4138"]], ["، هو الذي ", []], ["يكمل", ["G4137"]], [" ", []], ["الكل", ["G3956"]], [" في ", []], ["الكل", ["G3956"]], [".", []]]}, {"c": 2, "v": 1, "text": "وأنتم كنتم في السابق أمواتا بذنوبكم وخطاياكم،", "groups": [{"kw": "you", "raw": "Eph_2:5, Eph_2:6, Eph_1:19, Eph_1:20; Joh_5:25, Joh_10:10, Joh_11:25, Joh_11:26, Joh_14:6; Rom_8:2; 1Co_15:45; Col_2:13, Col_3:1-4", "note": "", "refs": [{"l": "Eph 2:5", "n": "", "vs": [[5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"]]}, {"l": "Eph 2:6", "n": "", "vs": [[6, "وأقامنا معه وأجلسنا معه في الأماكن السماوية في المسيح يسوع."]]}, {"l": "Eph 1:19", "n": "", "vs": [[19, "وما هي عظمة قدرته الفائقة المعلنة لنا نحن المؤمنين، بحسب عمل اقتدار قوته"]]}, {"l": "Eph 1:20", "n": "", "vs": [[20, "الذي عمله في المسيح، بإقامته له من بين الأموات. وقد أجلسه عن يمينه في الأماكن السماوية،"]]}, {"l": "Joh 5:25", "n": "", "vs": [[25, "الحق الحق أقول لكم: إن الساعة التي يسمع فيها الأموات صوت ابن الله ستأتي بل هي الآن والذين يسمعونه يحيون."]]}, {"l": "Joh 10:10", "n": "", "vs": [[10, "السارق لا يأتي إلا ليسرق ويذبح ويهلك. أما أنا فقد أتيت لتكون لهم حياة، بل ملء الحياة!"]]}, {"l": "Joh 11:25", "n": "", "vs": [[25, "فرد يسوع: «أنا هو القيامة والحياة. من آمن بي، وإن مات فسيحيا."]]}, {"l": "Joh 11:26", "n": "", "vs": [[26, "ومن كان حيا وآمن بي فلن يموت إلى الأبد. أتؤمنين بهذا؟»"]]}, {"l": "Joh 14:6", "n": "", "vs": [[6, "فأجابه يسوع: «أنا هو الطريق والحق والحياة. لا يأتي أحد إلى الآب إلا بي."]]}, {"l": "Rom 8:2", "n": "", "vs": [[2, "لأن ناموس روح الحياة في المسيح يسوع قد حررني من ناموس الخطيئة ومن الموت."]]}, {"l": "1Co 15:45", "n": "", "vs": [[45, "فهكذا أيضا قد كتب: «صار الإنسان الأول، آدم، نفسا حية» وأما آدم الأخير فهو روح باعث للحياة."]]}, {"l": "Col 2:13", "n": "", "vs": [[13, "فأنتم، إذ كنتم أمواتا في الخطايا وعدم ختانكم الجسدي، أحياكم جميعا معه؛ مسامحا لنا جميعا بالخطايا كلها."]]}, {"l": "Col 3:1-4", "n": "", "vs": [[1, "فبما أنكم قد قمتم مع المسيح، فاسعوا إلى الأمور التي في العلى، حيث المسيح جالس عن يمين الله."], [2, "احصروا اهتمامكم بالأمور التي في العلى، لا بالأمور الأرضية."], [3, "فإنكم قد متم، وحياتكم مستورة مع المسيح في الله."], [4, "فعندما يظهر المسيح، وهو حياتنا، عندئذ تظهرون أنتم أيضا معه في المجد."]]}], "kwAr": "وأنتم", "noteAr": ""}, {"kw": "dead", "raw": "Eph_2:5, Eph_4:18, Eph_5:14; Mat_8:22; Luk_15:24, Luk_15:32; Joh_5:21; 2Co_5:14; 1Ti_5:6; 1Jo_3:14; Rev_3:1", "note": "", "refs": [{"l": "Eph 2:5", "n": "", "vs": [[5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"]]}, {"l": "Eph 4:18", "n": "", "vs": [[18, "لكونهم مظلمي البصيرة ومتغربين عن حياة الله بسبب ما فيهم من جهل وقساوة قلب."]]}, {"l": "Eph 5:14", "n": "", "vs": [[14, "لأن الذي يكشف كل شيء هو النور. لذلك يقال: «استيقظ أيها النائم، وقم من بين الأموات، فيشرق عليك نور المسيح!»"]]}, {"l": "Mat 8:22", "n": "", "vs": [[22, "فأجابه يسوع: «اتبعني الآن، ودع الموتى يدفنون موتاهم! »"]]}, {"l": "Luk 15:24", "n": "", "vs": [[24, "فإن ابني هذا كان ميتا فعاش، وكان ضائعا فوجد. فأخذوا يفرحون!"]]}, {"l": "Luk 15:32", "n": "", "vs": [[32, "ولكن كان من الصواب أن نفرح ونبتهج، لأن أخاك هذا كان ميتا فعاش، وكان ضالا فوجد!»"]]}, {"l": "Joh 5:21", "n": "", "vs": [[21, "فكما يقيم الآب الموتى ويحييهم، كذلك يحيي الابن من يشاء."]]}, {"l": "2Co 5:14", "n": "", "vs": [[14, "فإن محبة المسيح تسيطر علينا، وقد حكمنا بهذا: مادام واحد قد مات عوضا عن الجميع، فمعنى ذلك أن الجميع ماتوا؛"]]}, {"l": "1Ti 5:6", "n": "", "vs": [[6, "أما تلك التي تعيش منغمسة في اللذات، فقد ماتت، وإن كانت حية."]]}, {"l": "1Jo 3:14", "n": "", "vs": [[14, "إن محبتنا لإخوتنا تبين لنا أننا انتقلنا من الموت إلى الحياة. فالذي لا يحب إخوته، فهو باق في الموت."]]}, {"l": "Rev 3:1", "n": "", "vs": [[1, "واكتب إلى ملاك الكنيسة في ساردس: إليك ما يقوله من له أرواح الله السبعة والنجوم السبعة: إني عالم بأعمالك. فأنت حي بالاسم، ولكنك ميت فعلا."]]}], "kwAr": "أمواتا بذنوبكم وخطاياكم", "noteAr": ""}], "arS": [["وأنتم كنتم في السابق ", []], ["أمواتا", ["G3498"]], [" ", []], ["بذنوبكم", ["G3900"]], [" ", []], ["وخطاياكم", ["G266"]], ["،", []]]}, {"c": 2, "v": 2, "text": "التي كنتم تسلكون فيها حسب مسرى هذا العالم، تابعين رئيس قوات الهواء، ذلك الروح العامل الآن في أبناء العصيان،", "groups": [{"kw": "in time", "raw": "Eph_2:3, Eph_4:22; Job_31:7; Act_19:35; 1Co_6:11; Col_1:21, Col_3:7; 1Pe_4:3; 1Jo_5:19", "note": "", "refs": [{"l": "Eph 2:3", "n": "", "vs": [[3, "الذين بينهم نحن أيضا كنا نسلك سابقا في شهوات جسدنا، عاملين ما يريده الجسد والأفكار، وكنا بالطبيعة أولاد الغضب كالآخرين أيضا."]]}, {"l": "Eph 4:22", "n": "", "vs": [[22, "وهو أن تخلعوا ما يتعلق بسيرتكم الماضية: الإنسان العتيق الذي يفسد نفسه بالشهوات الخداعة؛"]]}, {"l": "Job 31:7", "n": "", "vs": [[7, "إن حادت خطواتي عن الطريق، وغوى قلبي وراء عيني، وعلقت بيدي لطخة عار،"]]}, {"l": "Act 19:35", "n": "", "vs": [[35, "أخيرا تمكن كاتب المدينة من تهدئة الحشود، وقال: «ياأهل أفسس، من ينكر أن أفسس هي المدينة الحارسة لهيكل أرطاميس الإلهة العظيمة، ولصنمها الذي هبط من السماء؟"]]}, {"l": "1Co 6:11", "n": "", "vs": [[11, "وهكذا كان بعضكم، إلا أنكم قد اغتسلتم، بل تقدستم، بل تبررتم، باسم الرب يسوع المسيح وبروح إلهنا."]]}, {"l": "Col 1:21", "n": "", "vs": [[21, "وأنتم، يامن كنتم في الماضي أجانب وأعداء في الفكر، بأعمالكم الشريرة،"]]}, {"l": "Col 3:7", "n": "", "vs": [[7, "وفيها سلكتم في الماضي، حين كنتم تعيشون فيها."]]}, {"l": "1Pe 4:3", "n": "", "vs": [[3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}, {"l": "1Jo 5:19", "n": "", "vs": [[19, "ونحن واثقون أيضا بأننا من الله، وأن العالم كله خاضع لسيطرة إبليس الشرير."]]}], "kwAr": "التي كنتم", "noteAr": ""}, {"kw": "walked according", "raw": "Psa_17:14; Jer_23:10; Luk_16:8; Joh_7:7, Joh_8:23, Joh_15:19; Rom_12:2; 1Co_5:10; Gal_1:4; 2Ti_4:10; Jam_1:7, Jam_4:4; 1Jo_2:15-17, 1Jo_5:4", "note": "", "refs": [{"l": "Psa 17:14", "n": "", "vs": [[14, "أنقذني بيدك يارب من الناس. من أهل الدنيا الذين نصيبهم هو في هذه الحياة. أنت تملأ بطونهم من خيراتك المخزونة، فيشبع أبناؤهم، ويورثون أولادهم ما يفضل عنهم."]]}, {"l": "Jer 23:10", "n": "", "vs": [[10, "لأن الأرض قد اكتظت بالفاسقين، وناحت من عاقبة لعنة الله، فجفت مراعي الحقول لأن مساعيهم باتت شريرة، وجبروتهم مسخر للباطل»."]]}, {"l": "Luk 16:8", "n": "", "vs": [[8, "فامتدح السيد وكيله الخائن لأنه تصرف بحكمة. فإن أبناء هذا العالم أحكم مع أهل جيلهم من أبناء النور."]]}, {"l": "Joh 7:7", "n": "", "vs": [[7, "لا يقدر العالم أن يبغضكم، ولكنه يبغضني أنا، لأني أشهد عليه أن أعماله شريرة."]]}, {"l": "Joh 8:23", "n": "", "vs": [[23, "فكان رده: «أنتم من تحت. أما أنا فمن فوق. أنتم من هذا العالم. وأنا لست منه."]]}, {"l": "Joh 15:19", "n": "", "vs": [[19, "لو كنتم من أهل العالم، لكان العالم يحب أهله، ولكن لأنكم لستم من أهل العالم، بل إني اخترتكم من وسط العالم، لذلك يبغضكم العالم."]]}, {"l": "Rom 12:2", "n": "", "vs": [[2, "ولا تتكيفوا مع هذا العالم، بل تغيروا بتجديد الذهن، لتميزوا ما هي إرادة الله الصالحة المقبولة الكاملة."]]}, {"l": "1Co 5:10", "n": "", "vs": [[10, "فلا أعني زناة هذا العالم أو الطماعين أو السراقين أو عابدي الأصنام على وجه الإطلاق، وإلا كنتم مضطرين إلى الخروج من المجتمع البشري!"]]}, {"l": "Gal 1:4", "n": "", "vs": [[4, "الذي بذل نفسه من أجل خطايانا لكي ينقذنا من العالم الحاضر الشرير، وفقا لمشيئة إلهنا وأبينا."]]}, {"l": "2Ti 4:10", "n": "", "vs": [[10, "لأن ديماس، إذ أحب الحياة الحاضرة، تركني وذهب إلى مدينة تسالونيكي. أما كريسكيس، فقد ذهب إلى مقاطعة غلاطية، وتيطس إلى دلماطية"]]}, {"l": "Jam 1:7", "n": "", "vs": [[7, "فلا يتوهم المتردد أنه ينال شيئا من الرب."]]}, {"l": "Jam 4:4", "n": "", "vs": [[4, "أيها الخونة! ألستم تعلمون أن مصادقة العالم هي معاداة لله؟ فالذي يريد أن يصادق العالم، يجعل نفسه عدوا لله."]]}, {"l": "1Jo 2:15-17", "n": "", "vs": [[15, "لا تحبوا العالم، ولا الأشياء التي في العالم. فالذي يحب العالم، لا تكون محبة الآب في قلبه."], [16, "لأن كل ما في العالم، من شهوات الجسد وشهوات العين وترف المعيشة، ليس من الآب، بل من العالم."], [17, "وسوف يزول العالم، وما فيه من شهوات أما الذي يعمل بإرادة الله، فيبقى إلى الأبد!"]]}, {"l": "1Jo 5:4", "n": "", "vs": [[4, "ذلك لأن المولود من الله ينتصر على العالم. فالإيمان هو الذي يجعلنا ننتصر على العالم."]]}], "kwAr": "تسلكون فيها حسب مسرى هذا العالم", "noteAr": ""}, {"kw": "the prince", "raw": "Eph_6:12; Joh_8:44, Joh_12:31, Joh_14:30, Joh_16:11; 1Jo_5:19; Rev_12:9, Rev_13:8, Rev_13:14, Rev_20:2", "note": "", "refs": [{"l": "Eph 6:12", "n": "", "vs": [[12, "فإن حربنا ليست ضد ذوي اللحم والدم، بل ضد الرئاسات، ضد السلطات، ضد أسياد العالم حكام هذا الظلام، ضد قوى الشر الروحية في الأماكن السماوية."]]}, {"l": "Joh 8:44", "n": "", "vs": [[44, "إنكم أولاد أبيكم إبليس، وترغبون أن تعملوا شهوات أبيكم. فهو من البدء كان قاتلا للناس، ولم يثبت في الحق لأنه خال من الحق! وعندما ينطق بالكذب فهو ينضح بما فيه، لأنه كذاب وأبو الكذب!"]]}, {"l": "Joh 12:31", "n": "", "vs": [[31, "الآن وقت الحكم على هذا العالم! الآن يطرد سيد هذا العالم خارجا!"]]}, {"l": "Joh 14:30", "n": "", "vs": [[30, "لن أكلمكم كثيرا بعد، فإن سيد هذا العالم قادم علي، ولا شيء له في."]]}, {"l": "Joh 16:11", "n": "", "vs": [[11, "وأما على الدينونة، فلأن سيد هذا العالم قد صدر عليه حكم الدينونة."]]}, {"l": "1Jo 5:19", "n": "", "vs": [[19, "ونحن واثقون أيضا بأننا من الله، وأن العالم كله خاضع لسيطرة إبليس الشرير."]]}, {"l": "Rev 12:9", "n": "", "vs": [[9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."]]}, {"l": "Rev 13:8", "n": "", "vs": [[8, "فيسجد للوحش جميع سكان الأرض الذين لم تكتب أسماؤهم منذ تأسيس العالم في سجل الحياة للحمل الذي ذبح."]]}, {"l": "Rev 13:14", "n": "", "vs": [[14, "فخدع سكان الأرض بالآيات التي كان يقوم بها في حضور الوحش الأول. وأمر سكان الأرض أن يقيموا تمثالا للوحش الأول الذي كان قد جرح جرحا مميتا ولكنه عاش!"]]}, {"l": "Rev 20:2", "n": "", "vs": [[2, "قيد بها التنين، أي الحية القديمة، وهو إبليس أو الشيطان، وسجنه مدة ألف سنة،"]]}], "kwAr": "رئيس", "noteAr": ""}, {"kw": "of the air", "raw": "Job_1:7, Job_1:16, Job_1:19; Rev_16:17", "note": "", "refs": [{"l": "Job 1:7", "n": "", "vs": [[7, "فسأل الرب الشيطان: «من أين جئت؟» فأجاب الشيطان: «من الطواف في الأرض والتجول فيها»."]]}, {"l": "Job 1:16", "n": "", "vs": [[16, "وفيما هو يتكلم أقبل آخر قائلا: «لقد نزلت صاعقة من السماء أحرقت الغنم والغلمان والتهمتهم، وأفلت أنا وحدي لأخبرك»."]]}, {"l": "Job 1:19", "n": "", "vs": [[19, "هبت ريح شديدة من عبر الصحراء، فاجتاحت أركان البيت الأربعة، فانهار على الغلمان وماتوا جميعا، وأفلت أنا وحدي لأخبرك»."]]}, {"l": "Rev 16:17", "n": "", "vs": [[17, "ثم سكب الملاك السابع كأسه على الهواء، فدوى صوت من العرش في الهيكل السماوي يقول: «قد تم!»"]]}], "kwAr": "قوات الهواء", "noteAr": ""}, {"kw": "the spirit", "raw": "Mat_12:43-45; Luk_11:21-26, Luk_22:2, Luk_22:3, Luk_22:31; Joh_13:2, Joh_13:27; Act_5:3; 2Co_4:4; 1Jo_3:8, 1Jo_4:4", "note": "", "refs": [{"l": "Mat 12:43-45", "n": ""
