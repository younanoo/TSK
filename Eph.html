, "noteAr": ""}], "arS": [["وكذلك ", []], ["البذاءة", ["G151"]], [" ", []], ["والكلام السفيه", ["G3473"]], [" ", []], ["والهزل", ["G2160"]], ["، فهي غير ", []], ["لائقة", ["G433"]], [". وإنما ", []], ["أحرى", ["G3123"]], [" بكم أن تلهجوا ", []], ["بالشكر", ["G2169"]], [" لله!", []]]}, {"c": 5, "v": 5, "text": "فإنكم تعلمون هذا جيدا: أن كل زان أو نجس أو صاحب شهوة نهمة، ما هو إلا عابد أصنام، ليس له ميراث في ملكوت المسيح والله.", "groups": [{"kw": "this", "raw": "1Co_6:9, 1Co_6:10; Gal_5:19, Gal_5:21", "note": "", "refs": [{"l": "1Co 6:9", "n": "", "vs": [[9, "أما تعلمون أن الظالمين لن يرثوا ملكوت الله؟ لا تضلوا: فإن ملكوت الله لن يرثه الزناة ولا عابدو الأصنام ولا الفاسقون ولا المتخنثون ولا مضاجعو الذكور"]]}, {"l": "1Co 6:10", "n": "", "vs": [[10, "ولا السراقون ولا الطماعون ولا السكيرون ولا الشتامون ولا المغتصبون."]]}, {"l": "Gal 5:19", "n": "", "vs": [[19, "أما أعمال الجسد فظاهرة، وهي: الزنى والنجاسة والدعارة،"]]}, {"l": "Gal 5:21", "n": "", "vs": [[21, "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!"]]}], "kwAr": "فإنكم تعلمون هذا جيدا", "noteAr": ""}, {"kw": "that no", "raw": "Eph_5:3; Heb_13:4", "note": "", "refs": [{"l": "Eph 5:3", "n": "", "vs": [[3, "أما الزنى، وكل نجاسة أو شهوة نهمة، فلا يذكر بينكم حتى اسمها، كما يليق بالقديسين."]]}, {"l": "Heb 13:4", "n": "", "vs": [[4, "حافظوا جميعا على كرامة الزواج، مبعدين النجاسة عن الفراش. فإن الله سوف يعاقب الذين ينغمسون في خطايا الدعارة والزنى."]]}], "kwAr": "أن كل زان", "noteAr": ""}, {"kw": "who is", "raw": "Gal_5:21; Col_3:5; 1Ti_6:10,1Ti_6:17; Rev_21:8, Rev_22:15", "note": "", "refs": [{"l": "Gal 5:21", "n": "", "vs": [[21, "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!"]]}, {"l": "Col 3:5", "n": "", "vs": [[5, "فأميتوا إذن أعضاءكم الأرضية: الزنى، النجاسة، جموح العاطفة، الشهوة الرديئة، والاشتهاء النهم الذي هو عبادة أصنام."]]}, {"l": "1Ti 6:10",
