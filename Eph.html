 إننا نتكلم كمن تبين من اختبار الله لهم أنهم أهل لأن يؤتمنوا على الإنجيل، لنرضي لا الناس بل الله الذي يختبر قلوبنا."]]}], "kwAr": "حين تكون عيونهم عليكم", "noteAr": ""}, {"kw": "doing", "raw": "Eph_5:17; Mat_7:21, Mat_12:50; Col_1:9, Col_4:12; 1Th_4:3; Heb_10:36, Heb_13:21; 1Pe_2:15, 1Pe_4:2; 1Jo_2:17", "note": "", "refs": [{"l": "Eph 5:17", "n": "", "vs": [[17, "لذلك لا تكونوا أغبياء، بل افهموا ما هي مشيئة الرب."]]}, {"l": "Mat 7:21", "n": "", "vs": [[21, "ليس كل من يقول لي: يارب، يارب! يدخل ملكوت السماوات، بل من يعمل بإرادة أبي الذي في السماوات."]]}, {"l": "Mat 12:50", "n": "", "vs": [[50, "لأن كل من يعمل بإرادة أبي الذي في السماوات هو أخي وأختي وأمي ! »"]]}, {"l": "Col 1:9", "n": "", "vs": [[9, "لذلك نحن أيضا، من اليوم الذي فيه سمعنا بأخباركم، مازلنا نصلي ونتضرع لأجلكم، لأن تمتلئوا من تمام المعرفة لمشيئة الله في كل حكمة وإدراك روحي،"]]}, {"l": "Col 4:12", "n": "", "vs": [[12, "يسلم عليكم أبفراس الذي هو منكم، وهو عبد للمسيح يسوع، يجاهد كل حين لأجلكم في الصلوات لتثبتوا كاملين ولكم تمام اليقين من جهة مشيئة الله كلها."]]}, {"l": "1Th 4:3", "n": "", "vs": [[3, "فإن مشيئة الله هي هذه: قداستكم. وذلك بأن تمتنعوا عن الزنى،"]]}, {"l": "Heb 10:36", "n": "", "vs": [[36, "إنكم تحتاجون إلى الصبر لتعملوا إرادة الله، فتنالوا البركة التي وعدتم بها."]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}, {"l": "1Pe 2:15", "n": "", "vs": [[15, "فإن هذه هي إرادة الله: أن تفعلوا الخير دائما، فتفحموا جهالة الناس الأغبياء!"]]}, {"l": "1Pe 4:2", "n": "", "vs": [[2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."]]}, {"l": "1Jo 2:17", "n": "", "vs": [[17, "وسوف يزول العالم، وما فيه من شهوات أما الذي يعمل بإرادة الله، فيبقى إلى الأبد!"]]}], "kwAr": "عاملين بمشيئة الله", "noteAr": ""}, {"kw": "from", "raw": "Jer_3:10, Jer_24:7; Rom_6:17; Col_3:23", "note": "", "refs": [{"l": "Jer 3:10", "n": "", "vs": [[10, "ومع هذا كله لم ترجع إلي أختها الخائنة يهوذا من كل قلبها، إنما تظاهرت بذلك»، يقول الرب."]]}, {"l": "Jer 24:7", "n": "", "vs": [[7, "وأهبهم قلبا ليعرفوا أني أنا الرب، فيكونوا لي شعبا وأكون لهم إلها، لأنهم يرجعون إلي من كل قلوبهم."]]}, {"l": "Rom 6:17", "n": "", "vs": [[17, "إنما الشكر لله، لأنكم كنتم عبيدا للخطيئة ولكن أطعتم من القلب صيغة التعليم الذي وضعتم في عهدته."]]}, {"l": "Col 3:23", "n": "", "vs": [[23, "ومهما عملتم، فاجتهدوا فيه من صميم القلب، وكأنه للرب لا للناس،"]]}], "kwAr": "من القلب", "noteAr": ""}], "arS": [["غير عاملين بجد فقط حين تكون ", []], ["عيونهم", ["G3787"]], [" عليكم كمن يحاول ", []], ["إرضاء الناس", ["G441"]], ["، بل انطلاقا من كونكم ", []], ["عبيدا", ["G1401"]], [" ", []], ["للمسيح", ["G5547"]], ["،", []]]}, {"c": 6, "v": 7, "text": "عاملين بمشيئة الله من القلب، خادمين بنية حسنة كما للرب، لا للناس.", "groups": [{"kw": "good", "raw": "Gen_31:6, Gen_31:38-40; 2Ki_5:2, 2Ki_5:3, 2Ki_5:13", "note": "", "refs": [{"l": "Gen 31:6", "n": "", "vs": [[6, "أنتما تعلمان أنني خدمت أباكما بكل قواي."]]}, {"l": "Gen 31:38-40", "n": "", "vs": [[38, "لقد مكثت معك عشرين سنة، فما أسقطت نعاجك وعنازك، ولم آكل من كباش غنمك."], [39, "أشلاء فريسة لم أحضر لك بل كنت أتحمل خسارتها، ومن يدي كنت تطلبها، سواء كانت مخطوفة في النهار أم في الليل."], [40, "كنت في النهار يأكلني الحر وفي الليل الجليد، وفارق نومي عيني."]]}, {"l": "2Ki 5:2", "n": "", "vs": [[2, "وسبى الأراميون في إحدى غزواتهم التي أغاروا فيها على أرض إسرائيل فتاة صغيرة، صارت خادمة لزوجة نعمان."]]}, {"l": "2Ki 5:3", "n": "", "vs": [[3, "فقالت لمولاتها: «ياليت سيدي يمثل أمام النبي الذي في السامرة، فينال الشفاء من برصه»."]]}, {"l": "2Ki 5:13", "n": "", "vs": [[13, "فتقدم منه رجاله وقالوا: «ياأبانا، لو طلب النبي منك القيام بأمر عظيم، أما كنت تصنعه؟ فكم بالأحرى إن قال لك اغتسل واطهر؟»"]]}], "kwAr": "بنية حسنة", "noteAr": ""}, {"kw": "as", "raw": "Eph_6:5, Eph_6:6; 1Co_10:31", "note": "", "refs": [{"l": "Eph 6:5", "n": "", "vs": [[5, "أيها العبيد، أطيعوا سادتكم البشريين بخوف وارتعاد، من قلب صادق، كمن يطيع المسيح،"]]}, {"l": "Eph 6:6", "n": "", "vs": [[6, "غير عاملين بجد فقط حين تكون عيونهم عليكم كمن يحاول إرضاء الناس، بل انطلاقا من كونكم عبيدا للمسيح،"]]}, {"l": "1Co 10:31", "n": "", "vs": [[31, "فإذا أكلتم أو شربتم أو مهما فعلتم، فافعلوا كل شيء لتمجيد الله."]]}], "kwAr": "كما للرب", "noteAr": ""}], "arS": [["عاملين", ["G4160"]], [" ", []], ["بمشيئة", ["G2307"]], [" ", []], ["الله", ["G2316"]], [" من ", []], ["القلب", ["G5590"]], ["، ", []], ["خادمين", ["G1398"]], [" ", []], ["بنية حسنة", ["G2133"]], [" كما ", []], ["للرب", ["G2962"]], ["، لا ", []], ["للناس", ["G444"]], [".", []]]}, {"c": 6, "v": 8, "text": "فأنتم تعلمون أنه مهما عمل كل واحد من الخير، فسوف ينال المكافأة من الرب، سواء أكان عبدا أم حرا.", "groups": [{"kw": "whatsoever", "raw": "Pro_11:18, Pro_23:18; Isa_3:11; Mat_5:12, Mat_6:1, Mat_6:4, Mat_10:41, Mat_10:42, Mat_16:27; Luk_6:35; Luk_14:14; Rom_2:6-10; 2Co_5:10; Col_3:24; Heb_10:35, Heb_11:26", "note": "", "refs": [{"l": "Pro 11:18", "n": "", "vs": [[18, "الشرير يكسب أجرة غش زائلة، أما زارع البر فله ثواب أكيد دائم."]]}, {"l": "Pro 23:18", "n": "", "vs": [[18, "فهناك حقا ثواب، ورجاؤك لن يخيب."]]}, {"l": "Isa 3:11", "n": "", "vs": [[11, "أما الشرير فويل له وبئس المصير لأنه يجازى على ما جنته يداه"]]}, {"l": "Mat 5:12", "n": "", "vs": [[12, "افرحوا وتهللوا، فإن مكافأتكم في السماوات عظيمة. فإنهم هكذا اضطهدوا الأنبياء من قبلكم!"]]}, {"l": "Mat 6:1", "n": "", "vs": [[1, "احذروا من أن تعملوا بركم أمام الناس بقصد أن ينظروا إليكم. وإلا، فليس لكم مكافأة عند أبيكم الذي في السماوات."]]}, {"l": "Mat 6:4", "n": "", "vs": [[4, "لتكون صدقتك في الخفاء، وأبوك السماوي الذي يرى في الخفاء، هو يكافئك."]]}, {"l": "Mat 10:41", "n": "", "vs": [[41, "من يرحب بنبي لكونه نبيا، فإنه ينال مكافأة نبي؛ ومن يرحب برجل بار لكونه بارا، فإنه ينال مكافأة بار."]]}, {"l": "Mat 10:42", "n": "", "vs": [[42, "وأي من سقى واحدا من هؤلاء الصغار ولو كأس ماء بارد، فقط لأنه تلميذ لي، فالحق أقول لكم: إن مكافأته لن تضيع أبدا»."]]}, {"l": "Mat 16:27", "n": "", "vs": [[27, "فإن ابن الإنسان سوف يعود في مجد أبيه مع ملائكته، فيجازي كل واحد حسب أعماله."]]}, {"l": "Luk 6:35", "n": "", "vs": [[35, "ولكن، أحبوا أعداءكم، وأحسنوا المعاملة، وأقرضوا دون أن تأملوا استيفاء القرض، فتكون مكافأتكم عظيمة، وتكونوا أبناء العلي، لأنه ينعم على ناكري الجميل والأشرار."]]}, {"l": "Luk 14:14", "n": "", "vs": [[14, "فتكون مباركا لأن هؤلاء لا يملكون ما يكافئونك به، فإنك تكافأ في قيامة الأبرار»."]]}, {"l": "Rom 2:6-10", "n": "", "vs": [[6, "فإنه سيجازي كل إنسان بحسب أعماله."], [7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"], [8, "ويكون الغضب والسخط للمخاصمين الذين يرفضون الطاعة للحق ولكنهم يخضعون للإثم."], [9, "فالشدة والضيق على نفس كل إنسان يعمل الشر اليهودي أولا ثم اليوناني؛"], [10, "والمجد والكرامة والسلام لكل من يعمل الصلاح اليهودي أولا، ثم اليوناني ."]]}, {"l": "2Co 5:10", "n": "", "vs": [[10, "إذ لابد أن نقف جميعا مكشوفين أمام عرش المسيح، لينال كل واحد منا استحقاق ما عمله حين كان في الجسد، أصالحا كان أم رديئا!"]]}, {"l": "Col 3:24", "n": "", "vs": [[24, "عالمين أنكم سوف تنالون المكافأة بالميراث من الرب. فإنما أنتم عبيد تخدمون الرب المسيح"]]}, {"l": "Heb 10:35", "n": "", "vs": [[35, "إذن، لا تتخلوا عن ثقتكم بالرب. فإن لها مكافأة عظيمة."]]}, {"l": "Heb 11:26", "n": "", "vs": [[26, "فقد اعتبر أن عار المسيح، هو ثروة أعظم من كنوز مصر، لأنه كان يتطلع إلى المكافأة."]]}], "kwAr": "مهما عمل كل واحد من الخير", "noteAr": ""}, {"kw": "whether", "raw": "Gal_3:28; Col_3:11", "note": "", "refs": [{"l": "Gal 3:28", "n": "", "vs": [[28, "لا فرق بعد الآن بين يهودي ويوناني، أو عبد وحر، أو ذكر وأنثى، لأنكم جميعا واحد في المسيح يسوع."]]}, {"l": "Col 3:11", "n": "", "vs": [[11, "وفيه لا فرق بين يوناني ويهودي، أو مختون وغير مختون، أو متحضر ومتخلف، أو عبد وحر، بل المسيح هو الكل وفي الكل."]]}], "kwAr": "سواء أكان عبدا أم حرا", "noteAr": ""}], "arS": [["فأنتم ", []], ["تعلمون", ["G1492"]], [" أنه مهما عمل ", []], ["كل واحد", ["G1538"]], [" من ", []], ["الخير", ["G18"]], ["، فسوف ", []], ["ينال", ["G2865"]], [" المكافأة من ", []], ["الرب", ["G2962"]], ["، سواء أكان ", []], ["عبدا", ["G1401"]], [" أم ", []], ["حرا", ["G1658"]], [".", []]]}, {"c": 6, "v": 9, "text": "وأنتم، أيها السادة، عاملوهم بمثل هذه المعاملة غير لاجئين إلى التهديد، عالمين أن سيدكم وسيدهم هو في السماء، وهو لا يراعي مقامات الناس.", "groups": [{"kw": "ye", "raw": "Lev_19:13, Lev_25:39-46; Deu_15:11-16, Deu_24:14, Deu_24:15; Neh_5:5, Neh_5:8, Neh_5:9; Job_24:10-12; Job_31:13-15; Isa_47:6, Isa_58:3-6; Amo_8:4-7; Mal_3:5; Col_4:1; Jam_5:4", "note": "", "refs": [{"l": "Lev 19:13", "n": "", "vs": [[13, "لا تظلم قريبك، ولا تسلب ولا ترجيء دفع أجرة أجيرك إلى الغد."]]}, {"l": "Lev 25:39-46", "n": "", "vs": [[39, "وإذا افتقر أخوك وبيع لك عبدا، فلا تعامله كعبد،"], [40, "بل ليكن عندك كأجير أو نزيل، فيخدمك حتى حلول سنة اليوبيل،"], [41, "ثم تعتقه هو وأولاده، ويعود إلى قومه، ويرجع إلى ملك آبائه،"], [42, "لأن بني إسرائيل عبيدي الذين أخرجتهم من مصر، لا يباعون كالعبيد."], [43, "لا تطغ بتسلطك، بل اتق إلهك،"], [44, "وليكن عبيدكم وإماؤكم من الشعوب التي حولكم، منها تقتنون عبيدا وإماء،"], [45, "وكذلك من أبناء المستوطنين النازلين عندكم، فمنهم ومن عشائرهم، الذين عندكم المولودين في أرضكم، تقتنون عبيدا لكم."], [46, "وتورثونهم لبنيكم من بعدكم ميراث ملك، فيكونون عبيدا لكم إلى الأبد. وأما إخوتكم من بني إسرائيل فلا تطغوا بتسلطكم عليهم."]]}, {"l": "Deu 15:11-16", "n": "", "vs": [[11, "فالأرض لن تخلو أبدا من الفقراء، لهذا أوصيكم أن تسخوا على أخيكم المسكين والفقير المقيم في أرضكم."], [12, "إذا اشتريت عبرانيا أو عبرانية، وخدمك ست سنوات، ففي السنة السابعة تطلقه حرا من عندك."], [13, "لا تطلقه صفر اليدين،"], [14, "بل زوده مما باركك الرب إلهك به، من غنم وحنطة وزيت."], [15, "واذكروا أنكم كنتم عبيدا في ديار مصر، فحرركم الرب إلهكم. لذلك أوصيكم بهذا الأمر اليوم."], [16, "ولكن إن قال لك العبد: إنني لا أريد أن أتركك لأنه قد أحبك وأحب بيتك وتمتع بالخير عندك،"]]}, {"l": "Deu 24:14", "n": "", "vs": [[14, "لا تظلم أجيرا وفقيرا، سواء كان من بني إسرائيل أو من الغرباء المقيمين في مدينتك."]]}, {"l": "Deu 24:15", "n": "", "vs": [[15, "ادفع له أجرته في يومه قبل غروب الشمس لأنه فقير، أجهد نفسه للحصول عليها. وإلا توجه إلى الرب بالشكوى ضدك، فتكون هذه عليك خطيئة."]]}, {"l": "Neh 5:5", "n": "", "vs": [[5, "ومع أن لحمنا من لحم إخوتنا وأولادنا كأولادهم، فإن علينا أن نخضع أبناءنا وبناتنا للعبودية، بل إن بعض بناتنا مستعبدات، وليس بيدنا حيلة، لأن حقولنا وكرومنا مرهونة للآخرين."]]}, {"l": "Neh 5:8", "n": "", "vs": [[8, "وقلت لهم: «إننا بحسب طاقتنا افتدينا بالأموال إخوتنا اليهود الذين بيعوا للأمم، وها أنتم تبيعون إخوتكم لهم، وهم يعودون فيبيعونهم لنا». فسكتوا ولم يجدوا جوابا."]]}, {"l": "Neh 5:9", "n": "", "vs": [[9, "ثم استطردت: «هذا تصرف سيء. ألا تسلكون في خوف إلهنا تفاديا لتعيير الأمم أعدائنا؟"]]}, {"l": "Job 24:10-12", "n": "", "vs": [[10, "يطوفون عراة بلا كساء، جياعا حاملين الحزم."], [11, "يعصرون الزيت بين أتلام زيتون الأشرار، ويدوسون معاصر الخمر وهم عطاش."], [12, "يرتفع من المدن أنين المشرفين على الموت، وتستغيث نفوس الجرحى، والله لا يصغي إلى دعائهم."]]}, {"l": "Job 31:13-15", "n": "", "vs": [[13, "إن كنت قد تنكرت لحق خادمي وأمتي عندما اشتكيا علي،"], [14, "فماذا أصنع عندما يقوم الله (لمحاكمتي)؟ وبماذا أجيب عندما يتقصى (ليحاسبني)؟"], [15, "أليس الذي كونني في الرحم كونه أيضا؟ أو ليس الذي شكلنا في الرحم واحد؟"]]}, {"l": "Isa 47:6", "n": "", "vs": [[6, "قد سخطت على شعبي ونجست ميراثي. أسلمتهم إلى يديك، فلم تبدي نحوهم رحمة بل أرهقت الشيخ بنيرك الثقيل جدا."]]}, {"l": "Isa 58:3-6", "n": "", "vs": [[3, "ويسألون: ما بالنا صمنا وأنت لم تلاحظ، وتذللنا ولم تحفل بذلك؟. إنكم في يوم صومكم تلتمسون مسرة أنفسكم وتسخرون جميع عمالكم."], [4, "وها أنتم تصومون لكي تتخاصموا وتتشاجروا فقط، وتتضاربوا بكلمات أثيمة. إن مثل صومكم اليوم لا يجعل أصواتكم مسموعة في العلاء."], [5, "أيكون الصوم الذي أختاره في إذلال المرء نفسه يوما، أو في إحناء رأسه كالقصبة، أو افتراش المسح والرماد؟ أتدعو هذا صوما مقبولا لدى الرب؟"], [6, "أليس الصوم الذي أختاره يكون في فك قيود الشر، وحل عقد النير، وإطلاق سراح المتضايقين، وتحطيم كل نير؟"]]}, {"l": "Amo 8:4-7", "n": "", "vs": [[4, "استمعوا هذا أيها الدائسون على البائسين، يامن حاولتم أن تقضوا على فقراء الأرض،"], [5, "قائلين: «متى ينقضي أول الشهر حتى نبيع الحنطة؟ متى يمضي السبت لنعرض القمح في السوق، فنعمد إلى تصغير حجم مكيال الإيفة ونرفع الأسعار، ونستعمل ميزانا مغشوشا."], [6, "لنشتري المسكين بقطعة من الفضة، والبائس بنعلين، ونبيع نفاية القمح؟»"], [7, "قد أقسم الرب بعزة يعقوب قائلا: «لن أنسى شيئا من مساوئهم."]]}, {"l": "Mal 3:5", "n": "", "vs": [[5, "وأقترب منكم لأكون شاهدا سريعا ضد السحرة والزناة والحالفين بالزور والمستغلين لأجرة العامل ومضطهدي الأرامل والأيتام، والذين يظلمون الغرباء ولا يخافونني"]]}, {"l": "Col 4:1", "n": "", "vs": [[1, "أيها السادة، عاملوا عبيدكم بالعدل والإنصاف، عالمين أن لكم، أنتم أيضا، سيدا في السماء."]]}, {"l": "Jam 5:4", "n": "", "vs": [[4, "وهذه أجرة العمال الذين حصدوا حقولكم، تلك الأجرة التي مازلتم تحبسونها عنهم ظلما، إنها تصرخ، وصراخ أولئك العمال أنفسهم قد سمعه رب الجنود!"]]}], "kwAr": "وأنتم أيها السادة", "noteAr": ""}, {"kw": "the same", "raw": "Eph_6:5-7; Mat_7:12; Luk_6:31; Jam_2:8, Jam_2:13", "note": "", "refs": [{"l": "Eph 6:5-7", "n": "", "vs": [[5, "أيها العبيد، أطيعوا سادتكم البشريين بخوف وارتعاد، من قلب صادق، كمن يطيع المسيح،"], [6, "غير عاملين بجد فقط حين تكون عيونهم عليكم كمن يحاول إرضاء الناس، بل انطلاقا من كونكم عبيدا للمسيح،"], [7, "عاملين بمشيئة الله من القلب، خادمين بنية حسنة كما للرب، لا للناس."]]}, {"l": "Mat 7:12", "n": "", "vs": [[12, "إذن، كل ما تريدون أن يعاملكم الناس به، فعاملوهم أنتم به أيضا: هذه خلاصة تعليم الشريعة والأنبياء."]]}, {"l": "Luk 6:31", "n": "", "vs": [[31, "وبمثل ما تريدون أن يعاملكم الناس عاملوهم أنتم أيضا."]]}, {"l": "Jam 2:8", "n": "", "vs": [[8, "ما أحسن عملكم حين تطبقون تلك القاعدة الملوكية الواردة في الكتاب: «تحب قريبك كما تحب نفسك!»"]]}, {"l": "Jam 2:13", "n": "", "vs": [[13, "فلابد أن يكون الحكم على الذين لا يمارسون الرحمة، حكما خاليا من الرحمة، أما الرحمة فهي تتفوق على الحكم!"]]}], "kwAr": "عاملوهم بمثل هذه المعاملة", "noteAr": ""}, {"kw": "forbearing", "raw": "or, moderating, Lev_25:43; 1Sa_15:17; Dan_3:6, Dan_3:15, Dan_5:19, Dan_5:20", "note": "or, moderating, Lev_25:43; 1Sa_15:17; Dan_3:6, Dan_3:15, Dan_5:19, Dan_5:20", "refs": [{"l": "Lev 25:43", "n": "", "vs": [[43, "لا تطغ بتسلطك، بل اتق إلهك،"]]}, {"l": "1Sa 15:17", "n": "", "vs": [[17, "فقال صموئيل: «ألم تكن تحسب نفسك حقيرا، ولكن الرب جعلك على رأس أسباط إسرائيل وأقامك ملكا عليهم،"]]}, {"l": "Dan 3:6", "n": "", "vs": [[6, "وكل من لا ينحني ويسجد، يلقى فورا في وسط أتون نار متقدة»."]]}, {"l": "Dan 3:15", "n": "", "vs": [[15, "والآن إن كنتم مستعدين لدى سماعكم صوت الالات الموسيقية المختلفة أن تنحنوا وتسجدوا للتمثال الذي صنعته، أعفو عنكم. ولكن إن أبيتم السجود، تطرحون في تلك الساعة في وسط أتون النار المتقدة. وأي إله يقدر أن ينقذكم عندئذ من يدي؟»"]]}, {"l": "Dan 5:19", "n": "", "vs": [[19, "ولفرط عظمته التي أنعم الله بها عليه، كانت جميع الأمم والشعوب من كل لسان ترتعد أمامه وتفزع، فكان يقتل من يشاء، ويستحيي من يشاء، يرفع من يشاء ويضع من يشاء."]]}, {"l": "Dan 5:20", "n": "", "vs": [[20, "وعندما شمخ قلبه وقست روحه تعنتا، عزل عن عرش ملكه وجرد من جلاله،"]]}], "kwAr": "غير لاجئين إلى التهديد", "noteAr": "أو: مخفّفين (التهديد)."}, {"kw": "knowing", "raw": "Psa_140:12; Ecc_5:8; Mat_22:8, Mat_22:10, Mat_24:48, Mat_24:51; Luk_12:45, Luk_12:46; Joh_13:13; 1Co_7:22", "note": "", "refs": [{"l": "Psa 140:12", "n": "", "vs": [[12, "قد علمت أن الرب ينصف دعوى المساكين ويحكم بالحق للمحتاجين."]]}, {"l": "Ecc 5:8", "n": "", "vs": [[8, "إن شهدت في البلاد الفقير مظلوما، والحق والعدل مزهوقين فلا تعجب من الأمر، فإن فوق المسئول الكبير مسئولا أعلى منه رتبة يراقبه وفوقهما من هو أعظم مقاما منهما."]]}, {"l": "Mat 22:8", "n": "", "vs": [[8, "ثم قال لعبيده: إن وليمة العرس جاهزة، ولكن المدعوين لم يكونوا مستحقين."]]}, {"l": "Mat 22:10", "n": "", "vs": [[10, "فخرج العبيد إلى الطرق، وجمعوا كل من وجدوا، أشرارا وصالحين، حتى امتلأت قاعة العرس بالضيوف."]]}, {"l": "Mat 24:48", "n": "", "vs": [[48, "ولكن إذا قال ذلك العبد الشرير في قلبه: سيتأخر سيدي في رجوعه!"]]}, {"l": "Mat 24:51", "n": "", "vs": [[51, "فيفصله ويجعل نصيبه مع المرائين، هناك يكون البكاء وصرير الأسنان!"]]}, {"l": "Luk 12:45", "n": "", "vs": [[45, "ولكن إذا قال ذلك العبد في نفسه: سيدي سيتأخر في رجوعه؛ وأخذ يضرب الخادمين والخادمات ويأكل ويشرب ويسكر،"]]}, {"l": "Luk 12:46", "n": "", "vs": [[46, "فإن سيد ذلك العبد يرجع في يوم لا يتوقعه وساعة لا يعرفها، فيمزقه ويجعل مصيره مع الخائنين."]]}, {"l": "Joh 13:13", "n": "", "vs": [[13, "أنتم تدعونني معلما وسيدا، وقد صدقتم، فأنا كذلك."]]}, {"l": "1Co 7:22", "n": "", "vs": [[22, "فإن من دعي في الرب وهو عبد، صار معتقا للرب. وكذلك أيضا من دعي وهو حر، صار عبدا للمسيح."]]}], "kwAr": "عالمين", "noteAr": ""}, {"kw": "your Master", "raw": "Some read, both your and their Master. 1Co_1:2; Phi_2:10,Phi_2:11", "note": "Some read, both your and their Master. 1Co_1:2; Phi_2:10,Phi_2:11", "refs": [{"l": "1Co 1:2", "n": "", "vs": [[2, "إلى كنيسة الله في مدينة كورنثوس، إلى الذين تقدسوا في المسيح يسوع، المدعوين، القديسين؛ وإلى جميع الذين يدعون باسم ربنا يسوع المسيح في كل مكان ربا لهم ولنا."]]}, {"l": "Phi 2:10", "n": "", "vs": [[10, "لكي تنحني سجودا لاسم يسوع كل ركبة، سواء في السماء أم على الأرض أم تحت الأرض،"]]}, {"l": "Phi 2:11", "n": "", "vs": [[11, "ولكي يعترف كل لسان بأن يسوع المسيح هو الرب، لمجد الله الآب."]]}], "kwAr": "سيدكم وسيدهم", "noteAr": "في بعض القراءات: سيدكم وسيدهم كليكما."}, {"kw": "neither", "raw": "Act_10:34; Rom_2:11; Col_3:25", "note": "", "refs": [{"l": "Act 10:34", "n": "", "vs": [[34, "فبدأ بطرس كلامه قائلا: «تبين لي فعلا أن الله لا يفضل أحدا على أحد،"]]}, {"l": "Rom 2:11", "n": "", "vs": [[11, "فليس عند الله تحيز."]]}, {"l": "Col 3:25", "n": "", "vs": [[25, "وأما من عمل شرا فسوف ينال جزاء عمله الشرير، وليس محاباة."]]}], "kwAr": "وهو لا يراعي مقامات الناس", "noteAr": ""}], "arS": [["وأنتم، أيها ", []], ["السادة", ["G2962"]], ["، ", []], ["عاملوهم", ["G4160"]], [" بمثل هذه المعاملة غير ", []], ["لاجئين", ["G447"]], [" إلى ", []], ["التهديد", ["G547"]], ["، ", []], ["عالمين", ["G1492"]], [" أن ", []], ["سيدكم", ["G2962"]], [" وسيدهم هو في ", []], ["السماء", ["G3772"]], ["، وهو لا يراعي ", []], ["مقامات", ["G4382"]], [" الناس.", []]]}, {"c": 6, "v": 10, "text": "وختاما، تشددوا في الرب وفي قدرة قوته.", "groups": [{"kw": "Finally", "raw": "2Co_13:11; Phi_3:1, Phi_4:8; 1Pe_3:8", "note": "", "refs": [{"l": "2Co 13:11", "n": "", "vs": [[11, "وأخيرا، أيها الإخوة: افرحوا؛ تكملوا؛ تشجعوا؛ اتفقوا في الرأي؛ عيشوا بسلام. وإله المحبة والسلام سيكون معكم!"]]}, {"l": "Phi 3:1", "n": "", "vs": [[1, "وبعد، ياإخوتي، افرحوا في الرب. لا يزعجني أن أكتب إليكم بالأمور نفسها، فإن ذلك يجعلكم في مأمن."]]}, {"l": "Phi 4:8", "n": "", "vs": [[8, "وختاما، أيها الإخوة: كل ما كان حقا، وكل ما كان شريفا، وكل ما كان عادلا، وكل ما كان طاهرا وكل ما كان مستحبا، وكل ما كان حسن السمعة، وكل ما كان فيه فضيلة وخصلة حميدة، فاشغلوا أفكاركم به."]]}, {"l": "1Pe 3:8", "n": "", "vs": [[8, "والخلاصة، كونوا جميعا متحدين في الرأي، متعاطفين بعضكم مع بعض، مبادلين أحدكم الآخر المحبة الأخوية، شفوقين، متواضعين."]]}], "kwAr": "وختاما", "noteAr": ""}, {"kw": "be", "raw": "Eph_1:19, Eph_3:16; Deu_20:3, Deu_20:4, Deu_31:23; Jos_1:6, Jos_1:7, Jos_1:9; 1Sa_23:16; 1Ch_28:10,1Ch_28:20; 2Ch_15:7; Psa_138:3; Isa_35:3, Isa_35:4, Isa_40:28, Isa_40:31; Hag_2:4; Zec_8:9, Zec_8:13; 1Co_16:13; 2Co_12:9, 2Co_12:10; Phi_4:13; Col_1:11; 2Ti_2:1, 2Ti_4:17; 1Pe_5:10", "note": "", "refs": [{"l": "Eph 1:19", "n": "", "vs": [[19, "وما هي عظمة قدرته الفائقة المعلنة لنا نحن المؤمنين، بحسب عمل اقتدار قوته"]]}, {"l": "Eph 3:16", "n": "", "vs": [[16, "لكي يمنحكم، وفقا لغنى مجده، أن يمد الروح الكيان الداخلي في كل منكم بالقوة المؤيدة،"]]}, {"l": "Deu 20:3", "n": "", "vs": [[3, "اسمع ياإسرائيل: أنتم اليوم موشكون على محاربة أعدائكم، فلا تهن قلوبكم، لا تخافوا منهم ولا ترتعدوا ولا ترهبوهم،"]]}, {"l": "Deu 20:4", "n": "", "vs": [[4, "لأن الرب إلهكم سائر معكم لمحاربة أعدائكم عنكم، وليخلصكم."]]}, {"l": "Deu 31:23", "n": "", "vs": [[23, "وأوصى الرب يشوع بن نون قائلا: «تقو وتشجع، لأنك أنت تدخل بني إسرائيل إلى الأرض التي أقسمت لهم عليها، وأنا أكون معك»."]]}, {"l": "Jos 1:6", "n": "", "vs": [[6, "تقو وتشجع، لأنك أنت الذي ستوزع على هذا الشعب الأرض التي حلفت لآبائهم أن أهبها لهم."]]}, {"l": "Jos 1:7", "n": "", "vs": [[7, "كن شديد البأس ثابت القلب، ولتطع كل حرف من حروف الشريعة التي أمرك بها موسى عبدي. لا تحد عنها يمينا أو شمالا، لكي تفلح حيثما تتوجه."]]}, {"l": "Jos 1:9", "n": "", "vs": [[9, "ألم آمرك؟ إذن تقو وتشجع، لا ترهب ولا تجزع لأن الرب إلهك معك حيثما تتوجه»."]]}, {"l": "1Sa 23:16", "n": "", "vs": [[16, "فأقبل يوناثان بن شاول إلى داود في الغابة ليقوي من ثقته بالله،"]]}, {"l": "1Ch 28:10", "n": "", "vs": [[10, "ففكر مليا، لأن الرب قد اصطفاك لتبني بيتا لقدس الأقداس، فتقو واعمل»."]]}, {"l": "1Ch 28:20", "n": "", "vs": [[20, "فتقو وتشجع واعمل. لا تجزع ولا ترتعب لأن الرب الإله إلهي معك، ولن يخذلك ولا يتركك حتى تستوفي كل عمل خدمة هيكل الرب."]]}, {"l": "2Ch 15:7", "n": "", "vs": [[7, "فتقووا أنتم، ولا تخر عزيمتكم لأن لعملكم ثوابا»."]]}, {"l": "Psa 138:3", "n": "", "vs": [[3, "يوم دعوتك استجبت لي، وشجعتني إذ زدتني قوة في داخلي."]]}, {"l": "Isa 35:3", "n": "", "vs": [[3, "شددوا الأيدي المسترخية، وثبتوا الركب المرتعشة."]]}, {"l": "Isa 35:4", "n": "", "vs": [[4, "قولوا لذوي القلوب الخائرة: «تقووا ولا تفزعوا، فها هو إلهكم قادم، مقبل بالنقمة، حامل جزاءه. سيأتي ويخلصكم»."]]}, {"l": "Isa 40:28", "n": "", "vs": [[28, "ألم تعلموا؟ ألم تسمعوا؟ إن الرب هو إله سرمدي وخالق أقاصي الأرض. لا يهن ولا يخور، وفهمه لا يستقصى."]]}, {"l": "Isa 40:31", "n": "", "vs": [[31, "أما الراجون الرب فإنهم يجددون قوتهم، ويحلقون بأجنحة النسور. يركضون ولا يعيون. يمشون ولا يتعبون."]]}, {"l": "Hag 2:4", "n": "", "vs": [[4, "والآن تشجع يازربابل، يقول الرب، وتشدد يايهوشع بن يهوصادق رئيس الكهنة، وأنتم كذلك ياجميع سكان الأرض. تشجعوا واعملوا بجد لأني معكم، يقول الرب القدير."]]}, {"l": "Zec 8:9", "n": "", "vs": [[9, "ولتتشدد أيديكم أنتم يامن تسمعون هذه الكلمات التي نطق بها الأنبياء الذين كانوا حاضرين عند إرساء أساس هيكل الرب القدير لإعادة بنائه،"]]}, {"l": "Zec 8:13", "n": "", "vs": [[13, "وكما كنتم لعنة بين الأمم ياأ بناء يهوذا وإسرائيل، فإنني أخلصكم فتصبحون بركة. لا تجزعوا، بل تشجعوا."]]}, {"l": "1Co 16:13", "n": "", "vs": [[13, "كونوا متيقظين حذرين. اثبتوا في الإيمان. كونوا رجالا. كونوا أقوياء."]]}, {"l": "2Co 12:9", "n": "", "vs": [[9, "فقال لي: «نعمتي تكفيك، لأن قدرتي تكمل في الضعف!» فأنا أرضى بأن أفتخر مسرورا بالضعفات التي في، لكي تخيم علي قدرة المسيح."]]}, {"l": "2Co 12:10", "n": "", "vs": [[10, "فلأجل المسيح، تسرني الضعفات والإهانات والضيقات والاضطهادات والصعوبات، لأني حينما أكون ضعيفا، فحينئذ أكون قويا!"]]}, {"l": "Phi 4:13", "n": "", "vs": [[13, "إني أستطيع كل شيء، في المسيح الذي يقويني."]]}, {"l": "Col 1:11", "n": "", "vs": [[11, "متشددين بكل قوة موافقة لقدرة مجده، لتتمكنوا تماما من الاحتمال وطول البال،"]]}, {"l": "2Ti 2:1", "n": "", "vs": [[1, "وأنت ياولدي، فكن قويا في النعمة التي في المسيح يسوع."]]}, {"l": "2Ti 4:17", "n": "", "vs": [[17, "إلا أن الرب وقف بجانبي وأمدني بالقوة، لكي تتم بي المناداة بالبشارة، فيسمعها جميع من هم من الأمم؛ وقد نجوت من فم الأسد."]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}], "kwAr": "تشددوا في الرب", "noteAr": ""}], "arS": [["وختاما", ["G3063"]], ["، ", []], ["تشددوا", ["G1743"]], [" في ", []], ["الرب", ["G2962"]], [" وفي ", []], ["قدرة", ["G2904"]], [" ", []], ["قوته", ["G2479"]], [".", []]]}, {"c": 6, "v": 11, "text": "البسوا سلاح الله الكامل، لتتمكنوا من الصمود في وجه مكايد إبليس.", "groups": [{"kw": "Put", "raw": "Eph_4:24; Rom_13:14; Col_3:10", "note": "", "refs": [{"l": "Eph 4:24", "n": "", "vs": [[24, "وتلبسوا الإنسان الجديد المخلوق على مثال الله في البر والقداسة بالحق."]]}, {"l": "Rom 13:14", "n": "", "vs": [[14, "وإنما البسوا الرب يسوع المسيح (تمثلوا به)، ولا تنشغلوا بالتدبير للجسد لقضاء شهواته."]]}, {"l": "Col 3:10", "n": "", "vs": [[10, "ولبستم الجديد الذي يتجدد لبلوغ تمام المعرفة وفقا لصورة خالقه،"]]}], "kwAr": "البسوا", "noteAr": ""}, {"kw": "the whole", "raw": "Eph_6:13; Rom_13:12; 2Co_6:7, 2Co_10:4; 1Th_5:8", "note": "", "refs": [{"l": "Eph 6:13", "n": "", "vs": [[13, "لذلك اتخذوا سلاح الله الكامل، لتتمكنوا من المقاومة في يوم الشر، ومن الصمود أيضا بعد تحقيق كل هدف."]]}, {"l": "Rom 13:12", "n": "", "vs": [[12, "كاد الليل أن ينتهي والنهار أن يطلع. فلنطرح أعمال الظلام، ونلبس سلاح النور"]]}, {"l": "2Co 6:7", "n": "", "vs": [[7, "في كلمة الحق وقدرة الله؛ بأسلحة البر في الهجوم والدفاع؛"]]}, {"l": "2Co 10:4", "n": "", "vs": [[4, "فإن الأسلحة التي نحارب بها ليست جسدية، بل قادرة بالله على هدم الحصون: بها نهدم النظريات"]]}, {"l": "1Th 5:8", "n": "", "vs": [[8, "وأما نحن، أهل النهار، فلنظل صاحين، متخذين من الإيمان والمحبة درعا لصدورنا، ومن الرجاء بالخلاص خوذة لرؤوسنا."]]}], "kwAr": "سلاح الله الكامل", "noteAr": ""}, {"kw": "able", "raw": "Eph_6:13; Luk_14:29-31; 1Co_10:13; Heb_7:25; Jud_1:24", "note": "", "refs": [{"l": "Eph 6:13", "n": "", "vs": [[13, "لذلك اتخذوا سلاح الله الكامل، لتتمكنوا من المقاومة في يوم الشر، ومن الصمود أيضا بعد تحقيق كل هدف."]]}, {"l": "Luk 14:29-31", "n": "", "vs": [[29, "وذلك لئلا يضع له الأساس ولا يقدر أن ينجزه. أفلا يأخذ جميع الناظرين يسخرون منه."], [30, "قائلين: هذا الإنسان شرع يبني وعجز عن الإنجاز؟"], [31, "أم أي ملك ذاهب لمحاربة آخر، لا يجلس أولا ويستشير ليرى هل يقدر أن يواجه بعشرة آلاف ذلك الزاحف عليه بعشرين ألفا."]]}, {"l": "1Co 10:13", "n": "", "vs": [[13, "لم يصبكم من التجارب إلا ما هو بشري. ولكن الله أمين وجدير بالثقة، فلا يدعكم تجربون فوق ما تطيقون، بل يدبر لكم مع التجربة سبيل الخروج منها لتطيقوا احتمالها."]]}, {"l": "Heb 7:25", "n": "", "vs": [[25, "وهو لذلك قادر دائما أن يحقق الخلاص الكامل للذين يتقربون به إلى الله. فهو، في حضرة الله، حي على الدوام ليتضرع من أجلهم ويحامي عنهم!"]]}, {"l": "Jud 1:24", "n": "", "vs": [[24, "وللقادر أن يحرسكم من السقوط حتى يوصلكم إلى المثول أمامه في المجد مبتهجين ولا عيب فيكم …"]]}], "kwAr": "لتتمكنوا من الصمود", "noteAr": ""}, {"kw": "the wiles", "raw": "Eph_4:14 *Gr: Mar_13:22; 2Co_2:11, 2Co_4:4, 2Co_11:3, 2Co_11:13-15; 2Th_2:9-11; 1Pe_5:8; 2Pe_2:1-3; Rev_2:24, Rev_12:9, Rev_13:11-15, Rev_19:20, Rev_20:2, Rev_20:3, Rev_20:7, Rev_20:8", "note": "", "refs": [{"l": "Eph 4:14", "n": "*Gr:", "vs": [[14, "وذلك حتى لا نكون فيما بعد أطفالا تتقاذفنا وتحملنا كل ريح تعليم يقوم على خداع الناس والمكر بهم لجرهم إلى الضلال الملفق،"]]}, {"l": "Mar 13:22", "n": "", "vs": [[22, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "2Co 2:11", "n": "", "vs": [[11, "مخافة أن يستغلنا الشيطان مادمنا لا نجهل نياته."]]}, {"l": "2Co 4:4", "n": "", "vs": [[4, "الذين أعمى إله هذا العالم أذهانهم حتى لا يضيء لهم نور الإنجيل المختص بمجد المسيح الذي هو صورة الله."]]}, {"l": "2Co 11:3", "n": "", "vs": [[3, "غير أني أخشى أن تضلل عقولكم عن الإخلاص والطهارة تجاه المسيح مثلما أغوت الحية بمكرها حواء."]]}, {"l": "2Co 11:13-15", "n": "", "vs": [[13, "فإن أمثال هؤلاء هم رسل دجالون، عمال ماكرون، يظهرون أنفسهم بمظهر رسل المسيح."], [14, "ولا عجب! فالشيطان نفسه يظهر نفسه بمظهر ملاك نور."], [15, "فليس كثيرا إذن أن يظهر خدامه أنفسهم بمظهر خدام البر. وإن عاقبتهم ستكون على حسب أعمالهم."]]}, {"l": "2Th 2:9-11", "n": "", "vs": [[9, "أما بروز المتمرد، فسوف يكون بقدر طاقة الشيطان على المعجزات والعلامات والعجائب المزيفة كلها،"], [10, "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا."], [11, "ولهذا السبب، سيرسل الله إليهم طاقة الضلال حتى يصدقوا ما هو دجل،"]]}, {"l": "1Pe 5:8", "n": "", "vs": [[8, "تعقلوا وتنبهوا. إن خصمكم إبليس كأسد يزأر، يجول باحثا عن فريسة يبتلعها."]]}, {"l": "2Pe 2:1-3", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."], [2, "وكثيرون سيسيرون وراءهم في طرق الإباحية. وبسببهم توجه الإهانة إلى طريق الحق."], [3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "Rev 2:24", "n": "", "vs": [[24, "أما أنتم، الباقين من أهل ثياتيرا، الذين لم يتقبلوا هذا التعليم الفاسد، ولم يعرفوا ما يدعونه «أسرار الشيطان العميقة»، فلن أحملكم أي عبء جديد."]]}, {"l": "Rev 12:9", "n": "", "vs": [[9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."]]}, {"l": "Rev 13:11-15", "n": "", "vs": [[11, "ثم رأيت وحشا آخر خارجا من الأرض، له قرنان صغيران كقرني خروف، ولكن صوته كصوت تنين،"], [12, "وقد استمد سلطته من الوحش الأول الذي خرج من البحر ليعمل بها في حضوره، فجعل سكان الأرض يسجدون للوحش الأول الذي شفي من جرحه المميت."], [13, "وقام الوحش الثاني بآيات خارقة، حتى إنه أنزل من السماء نارا على الأرض بمشهد من الناس جميعا،"], [14, "فخدع سكان الأرض بالآيات التي كان يقوم بها في حضور الوحش الأول. وأمر سكان الأرض أن يقيموا تمثالا للوحش الأول الذي كان قد جرح جرحا مميتا ولكنه عاش!"], [15, "وأعطي سلطة على أن يبعث الروح في التمثال لينطق، وأن يمد يده فيقتل كل من يرفض السجود لتمثال الوحش،"]]}, {"l": "Rev 19:20", "n": "", "vs": [[20, "فقبض على الوحش وعلى النبي الدجال الذي قام بالمعجزات في حضور الوحش وأضل بها الذين قبلوا علامة الوحش، وسجدوا لتمثاله. وطرح كلاهما حيا في بحيرة النار والكبريت المتقدة،"]]}, {"l": "Rev 20:2", "n": "", "vs": [[2, "قيد بها التنين، أي الحية القديمة، وهو إبليس أو الشيطان، وسجنه مدة ألف سنة،"]]}, {"l": "Rev 20:3", "n": "", "vs": [[3, "وطرحه في الهاوية وأغلقها عليه، وختمها، حتى يكف عن تضليل الأمم، إلى أن تنقضي الألف سنة. ولكن لابد من إطلاقه بعد ذلك لمدة قصيرة."]]}, {"l": "Rev 20:7", "n": "", "vs": [[7, "فحين تنقضي الألف سنة، يطلق الشيطان من سجنه،"]]}, {"l": "Rev 20:8", "n": "", "vs": [[8, "فيخرج ليضلل الأمم في زوايا الأرض الأربع، جوج وماجوج، ويجمعهم للقتال، وعددهم كثير جدا كرمل البحر!"]]}], "kwAr": "مكايد إبليس", "noteAr": ""}], "arS": [["البسوا", ["G1746"]], [" ", []], ["سلاح الله الكامل", ["G3833", "G2316"]], ["، ", []], ["لتتمكنوا", ["G1410"]], [" من ", []], ["الصمود", ["G2476"]], [" في وجه ", []], ["مكايد", ["G3180"]], [" ", []], ["إبليس", ["G1228"]], [".", []]]}, {"c": 6, "v": 12, "text": "فإن حربنا ليست ضد ذوي اللحم والدم، بل ضد الرئاسات، ضد السلطات، ضد أسياد العالم حكام هذا الظلام، ضد قوى الشر الروحية في الأماكن السماوية.", "groups": [{"kw": "wrestle", "raw": "Luk_13:24; 1Co_9:25-27; 2Ti_2:5; Heb_12:1, Heb_12:4", "note": "", "refs": [{"l": "Luk 13:24", "n": "", "vs": [[24, "«ابذلوا الجهد للدخول من الباب الضيق، فإني أقول لكم إن كثيرين سيسعون إلى الدخول، فلا يتمكنون."]]}, {"l": "1Co 9:25-27", "n": "", "vs": [[25, "وكل متبار يفرض على نفسه تدريبا صارما في شتى المجالات. فهؤلاء المتبارون يفعلون ذلك ليفوزوا بإكليل فان، وأما نحن فلنفوز بإكليل غير فان."], [26, "إذن، أنا أركض هكذا، لا كمن لا هدف له، وهكذا ألاكم أيضا، لا كمن يلطم الهواء،"], [27, "بل أسدد اللكمات إلى جسدي وأسوقه أسيرا، مخافة أن يتبين أني غير مؤهل (للمجازاة) بعدما دعوت الآخرين إليها!"]]}, {"l": "2Ti 2:5", "n": "", "vs": [[5, "كما أن المصارع لا يفوز بالإكليل إلا إذا صارع بحسب القوانين."]]}, {"l": "Heb 12:1", "n": "", "vs": [[1, "فبما أن هذا العدد الكبير من الشاهدين للإيمان، يتجمع حولنا كأنه سحابة عظيمة، فلنطرح جانبا كل ثقل يعيقنا عن التقدم، ونتخلص من تلك الخطيئة التي نتعرض للسقوط في فخها بسهولة، لكي نتمكن، نحن أيضا، أن نركض باجتهاد في السباق الممتد أمامنا،"]]}, {"l": "Heb 12:4", "n": "", "vs": [[4, "لم تقاوموا بعد حتى بذل الدم في مجاهدتكم ضد الخطيئة."]]}], "kwAr": "فإن حربنا", "noteAr": ""}, {"kw": "flesh and blood", "raw": "Gr. blood and flesh, Mat_16:17; 1Co_15:50; Gal_1:16", "note": "Gr. blood and flesh, Mat_16:17; 1Co_15:50; Gal_1:16", "refs": [{"l": "Mat 16:17", "n": "", "vs": [[17, "فقال له يسوع: «طوبى لك ياسمعان بن يونا. فما أعلن لك هذا لحم ودم، بل أبي الذي في السماوات."]]}, {"l": "1Co 15:50", "n": "", "vs": [[50, "ثم إني، أيها الإخوة، أؤكد لكم أن الأجسام ذات اللحم والدم لا يمكنها أن ترث ملكوت الله، كما لا يمكن للمنحل أن يرث غير المنحل."]]}, {"l": "Gal 1:16", "n": "", "vs": [[16, "أن يعلن ابنه في لأبشر به بين الأمم، في الحال لم أستشر لحما ودما،"]]}], "kwAr": "ذوي اللحم والدم", "noteAr": "في اليونانية: دم ولحم."}, {"kw": "principalities", "raw": "Eph_1:21, Eph_3:10; Rom_8:38; Col_2:15; 1Pe_3:22", "note": "", "refs": [{"l": "Eph 1:21", "n": "", "vs": [[21, "أرفع جدا من كل رئاسة وسلطة وقوة وسيا دة، ومن كل اسم يسمى، لا في هذا العالم وحسب، بل في ذلك الآتي أيضا."]]}, {"l": "Eph 3:10", "n": "", "vs": [[10, "والغاية أن يتجلى الآن أمام الرئاسات والسلطات في الأماكن السماوية ما يظهر في الكنيسة من حكمة الله المتعددة الوجوه،"]]}, {"l": "Rom 8:38", "n": "", "vs": [[38, "فإني لعلى يقين بأنه لا الموت ولا الحياة، ولا الملائكة ولا الرياسات، ولا الأمور الحاضرة ولا الآتية، ولا القوات،"]]}, {"l": "Col 2:15", "n": "", "vs": [[15, "وإذ نزع سلاح ال  من المجد،"], [18, "إذ نرفع أنظارنا عن الأمور المنظورة ونثبتها على الأمور غير المنظورة. فإن الأمور المنظورة إنما هي إلى حين؛ وأما غير المنظورة فهي أبدية."]]}, {"l": "Heb 6:17", "n": "", "vs": [[17, "ولذلك، لما أراد الله أن يؤكد بصورة قاطعة لوارثي وعده، أن قراره لا يتغير أبدا، ثبته بالقسم."]]}, {"l": "Heb 6:18", "n": "", "vs": [[18, "فاستنادا إلى وعد الله وقسمه، وهما أمران ثابتان لا يتغيران ويستحيل أن يكذب الله فيهما، نحصل على تشجيع قوي، بعدما التجأنا إلى التمسك بالرجاء الموضوع أمامنا."]]}, {"l": "Heb 11:24-34", "n": "", "vs": [[24, "وبالإيمان، موسى نفسه، لما كبر، رفض أن يدعى ابنا لابنة فرعون."], [25, "بل اختار أن يتحمل المذلة مع شعب الله، بدلا من التمتع الوقتي بلذات الخطيئة."], [26, "فقد اعتبر أن عار المسيح، هو ثروة أعظم من كنوز مصر، لأنه كان يتطلع إلى المكافأة."], [27, "بالإيمان، ترك أرض مصر وهو غير خائف من غضب الملك. فقد مضى في تنفيذ قراره، كأنه يرى بجانبه الله غير المنظور."], [28, "وبالإيمان، أقام الفصح ورش الدم، لكي لا يمس مهلك الأبكار أحدا من أبناء شعبه."], [29, "بالإيمان اجتاز الشعب في البحر الأحمر كأنه أرض يابسة. أما المصريون، فإذ حاولوا ذلك غرقوا!"], [30, "بالإيمان انهارت أسوار مدينة أريحا، بعدما دار الشعب حولها لمدة سبعة أيام."], [31, "وجزاء للإيمان، نجت راحاب الزانية من الموت المحتم مع المتمردين، بعدما استقبلت الجاسوسين بسلام."], [32, "وهل من حاجة بعد لمزيد من الأمثلة؟ إن الوقت لا يتسع لي حتى أسرد أخبار الإيمان عن: جدعون وباراق وشمشون ويفتاح وداود وصموئيل والأنبياء."], [33, "فبالإيمان، تغلب هؤلاء على ممالك الأعداء، وحكموا حكما عادلا ونالوا ما وعدهم به الله . وبه، أطبقوا أفواه الأسود،"], [34, "وأبطلوا قوة النار، ونجوا من الموت قتلا بالسيف. وبه أيضا نالوا القوة بعد ضعف، فصاروا أشداء في المعارك، وردوا جيوشا غريبة على أعقابها."]]}, {"l": "1Pe 5:8", "n": "", "vs": [[8, "تعقلوا وتنبهوا. إن خصمكم إبليس كأسد يزأر، يجول باحثا عن فريسة يبتلعها."]]}, {"l": "1Pe 5:9", "n": "", "vs": [[9, "فقاوموه، ثابتين في الإيمان. واذكروا أن إخوتكم المنتشرين في العالم يجتازون وسط هذه الآلام عينها."]]}, {"l": "1Jo 5:4", "n": "", "vs": [[4, "ذلك لأن المولود من الله ينتصر على العالم. فالإيمان هو الذي يجعلنا ننتصر على العالم."]]}, {"l": "1Jo 5:5", "n": "", "vs": [[5, "ومن ينتصر على العالم إلا الذي يؤمن أن يسوع هو ابن الله؟"]]}], "kwAr": "احملوا الإيمان ترسا", "noteAr": "«الثيريوس» (G2375) ترس كبير مستطيل كالباب («ثيرا»، G2374)، مصنوع من الخشب ومكسوّ بالجلود. انظر تك 15: 1؛ أم 18: 10؛ 1يو 5: 4-5."}, {"kw": "to quench", "raw": "1Th_5:19", "note": "", "refs": [{"l": "1Th 5:19", "n": "", "vs": [[19, "لا تخمدوا الروح،"]]}], "kwAr": "أن تطفئوا", "noteAr": ""}], "arS": [["وفوق هذا ", []], ["كله", ["G3956"]], ["، ", []], ["احملوا", ["G353"]], [" ", []], ["الإيمان", ["G4102"]], [" ", []], ["ترسا", ["G2375"]], [" به ", []], ["تقدرون", ["G1410"]], [" أن ", []], ["تطفئوا", ["G4570"]], [" ", []], ["جميع", ["G3956"]], [" ", []], ["سهام", ["G956"]], [" ", []], ["الشرير", ["G4190"]], [" ", []], ["المشتعلة", ["G4448"]], [".", []]]}, {"c": 6, "v": 17, "text": "واتخذوا الخلاص خوذة للرأس، وكلمة الله سيف الروح.", "groups": [{"kw": "the helmet", "raw": "1Sa_17:5, 1Sa_17:58; Isa_59:17; 1Th_5:8", "note": "", "refs": [{"l": "1Sa 17:5", "n": "", "vs": [[5, "يضع على رأسه خوذة من نحاس، ويرتدي درعا مصفحا وزنه خمسة آلاف شاقل (نحو سبعة وخمسين كيلو جراما) من النحاس"]]}, {"l": "1Sa 17:58", "n": "", "vs": [[58, "فسأله شاول: «ابن من أنت يا فتى؟» فأجابه داود: «ابن عبدك يسى البيتلحمي»."]]}, {"l": "Isa 59:17", "n": "", "vs": [[17, "فتدرع بالبر وارتدى على رأسه خوذة الخلاص، واكتسى بثياب الانتقام، والتف بعباءة الغضب."]]}, {"l": "1Th 5:8", "n": "", "vs": [[8, "وأما نحن، أهل النهار، فلنظل صاحين، متخذين من الإيمان والمحبة درعا لصدورنا، ومن الرجاء بالخلاص خوذة لرؤوسنا."]]}], "kwAr": "الخلاص خوذة للرأس", "noteAr": ""}, {"kw": "the sword", "raw": "Isa_49:2; Heb_4:12; Rev_1:16, Rev_2:16, Rev_19:15", "note": "", "refs": [{"l": "Isa 49:2", "n": "", "vs": [[2, "جعل فمي كسيف قاطع، وواراني في ظل يديه؛ صنع مني سهما مسنونا وأخفاني في جعبته،"]]}, {"l": "Heb 4:12", "n": "", "vs": [[12, "ذلك لأن كلمة الله حية، وفعاله، وأمضى من كل سيف له حدان، وخارقة إلى مفترق النفس والروح والمفاصل ونخاع العظام، وقادرة أن تميز أفكار القلب ونياته."]]}, {"l": "Rev 1:16", "n": "", "vs": [[16, "ووجهه يتوهج بالنور كشمس الظهيرة. وكان في يده اليمنى سبعة نجوم، ومن فمه يخرج سيف قاطع ذو حدين."]]}, {"l": "Rev 2:16", "n": "", "vs": [[16, "عليك أن تتوب، وإلا جئتك سريعا لأحارب هؤلاء الضالين بالسيف الذي في فمي."]]}, {"l": "Rev 19:15", "n": "", "vs": [[15, "وكان يخرج من فمه سيف حاد ليضرب به الأمم ويحكمهم بعصا من حديد، ويدوسهم في معصرة شدة غضب الله القادر على كل شيء."]]}], "kwAr": "سيف الروح", "noteAr": ""}, {"kw": "which", "raw": "Mat_4:4, Mat_4:7, Mat_4:10,Mat_4:11; Heb_12:5, Heb_12:6, Heb_13:5, Heb_13:6; Rev_12:11", "note": "", "refs": [{"l": "Mat 4:4", "n": "", "vs": [[4, "فأجابه قائلا: «قد كتب: ليس بالخبز وحده يحيا الإنسان، بل بكل كلمة تخرج من فم الله!»"]]}, {"l": "Mat 4:7", "n": "", "vs": [[7, "فقال له يسوع: «وقد كتب أيضا: لا تجرب الرب إلهك! »"]]}, {"l": "Mat 4:10", "n": "", "vs": [[10, "فقال له يسوع: «اذهب ياشيطان! فقد كتب: للرب إلهك تسجد، وإياه وحده تعبد! »"]]}, {"l": "Mat 4:11", "n": "", "vs": [[11, "فتركه إبليس، وإذا بعض الملائكة جاءوا إليه وأخذوا يخدمونه."]]}, {"l": "Heb 12:5", "n": "", "vs": [[5, "فهل نسيتم الوعظ الذي يخاطبكم به الله بوصفكم أبناء له؟ إذ يقول: «ياابني، لا تستخف بتأديب الرب. ولا تفقد العزيمة حين يوبخك على الخطأ."]]}, {"l": "Heb 12:6", "n": "", "vs": [[6, "فإن الذي يحبه الرب يؤدبه. وهو يجلد كل من يتخذه له ابنا!»"]]}, {"l": "Heb 13:5", "n": "", "vs": [[5, "اجعلوا سيرتكم مترفعة عن حب المال، واقنعوا بما عندكم، لأن الله يقول: «لا أتركك، ولا أتخلى عنك أبدا!»"]]}, {"l": "Heb 13:6", "n": "", "vs": [[6, "فنستطيع إذن، أن نقول بكل ثقة وجرأة: «الرب معيني، فلن أخاف! ماذا يصنع بي الإنسان؟»"]]}, {"l": "Rev 12:11", "n": "", "vs": [[11, "وهم قد انتصروا عليه بدم الحمل وبالكلمة التي شهدوا لها، فلم تكن حياتهم عزيزة لديهم، حتى إنهم ماتوا."]]}], "kwAr": "وكلمة الله", "noteAr": ""}], "arS": [["واتخذوا", ["G1209"]], [" ", []], ["الخلاص", ["G4992"]], [" ", []], ["خوذة", ["G4030"]], [" للرأس، ", []], ["وكلمة", ["G4487"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["سيف", ["G3162"]], [" ", []], ["الروح", ["G4151"]], [".", []]]}, {"c": 6, "v": 18, "text": "كونوا مصلين في كل حال، بكل صلاة وطلبة في الروح، وساهرين لهذا الغرض عينه مواظبين تماما على جميع الطلبات لأجل القديسين جميعا،", "groups": [{"kw": "Praying", "raw": "Eph_1:16; Job_27:10; Psa_4:1, Psa_6:9; Isa_26:16; Dan_6:10; Luk_3:26, Luk_3:37, Luk_18:1-7; Luk_21:36; Act_1:14, Act_6:4, Act_10:2, Act_12:5; Rom_12:12; Phi_4:6; Col_4:2; 1Th_5:17; 2Ti_1:3", "note": "", "refs": [{"l": "Eph 1:16", "n": "", "vs": [[16, "لا أنقطع عن شكر الله لأجلكم وعن ذكركم في صلواتي،"]]}, {"l": "Job 27:10", "n": "", "vs": [[10, "هل يسر بالقدير ويستغيث به في كل الأزمنة؟"]]}, {"l": "Psa 4:1", "n": "", "vs": [[1, "استجب لي عندما أدعوك ياإله بري، فقد أفرجت لي دوما في الضيق، فأنعم علي وأصغ إلى صلاتي."]]}, {"l": "Psa 6:9", "n": "", "vs": [[9, "سمع الرب تضرعي. الرب يتقبل صلاتي."]]}, {"l": "Isa 26:16", "n": "", "vs": [[16, "يارب قد طلبوك في المحنة، وسكبوا دعاءهم عند تأديبك لهم،"]]}, {"l": "Dan 6:10", "n": "", "vs": [[10, "فلما بلغ دانيآل أمر توقيع الوثيقة مضى إلى بيته وصعد إلى عليته ذات الكوى المفتوحة باتجاه أورشليم، وجثا على ركبتيه ثلاث مرات في اليوم وصلى، وحمد إلهه كمألوف عادته من قبل."]]}, {"l": "Luk 3:26", "n": "", "vs": [[26, "بن مآث بن متاثيا، بن شمعي بن يوسف، بن يهوذا"]]}, {"l": "Luk 3:37", "n": "", "vs": [[37, "بن متوشالح، بن أخنوخ بن يارد، بن مهللئيل بن قينان،"]]}, {"l": "Luk 18:1-7", "n": "", "vs": [[1, "وضرب لهم مثلا في وجوب الصلاة دائما ودون ملل،"], [2, "قال: «كان في مدينة قاض لا يخاف الله ولا يحترم إنسانا."], [3, "وكان في تلك المدينة أرملة كانت تأتي إليه قائلة: أنصفني من خصمي!"], [4, "فظل يرفض طلبها مدة من الزمن. ولكنه بعد ذلك قال في نفسه: حتى لو كنت لا أخاف الله ولا أحترم إنسانا،"], [5, "فمهما يكن، فلأن هذه الأرملة تزعجني سأنصفها، لئلا تأتي دائما فتصدع رأسي!»"], [6, "وقال الرب: «اسمعوا ما يقوله القاضي الظالم."], [7, "أفلا ينصف الله مختاريه الذين يصرخون إليه نهارا وليلا؟ أما يسرع في الاستجابة لهم؟"]]}, {"l": "Luk 21:36", "n": "", "vs": [[36, "فاسهروا إذن وتضرعوا في كل حين، لكي تتمكنوا من أن تنجوا من جميع هذه الأمور التي هي على وشك أن تحدث، وتقفوا أمام ابن الإنسان»."]]}, {"l": "Act 1:14", "n": "", "vs": [[14, "وكانوا جميعا يداومون على الصلاة بقلب واحد، ومعهم بعض النساء، ومريم أم يسوع، وإخوته."]]}, {"l": "Act 6:4", "n": "", "vs": [[4, "أما نحن، فنداوم على الصلاة وخدمة الكلمة»."]]}, {"l": "Act 10:2", "n": "", "vs": [[2, "وكان تقيا يخاف الله ، هو وأهل بيته جميعا، يتصدق على الشعب كثيرا، ويصلي إلى الله دائما."]]}, {"l": "Act 12:5", "n": "", "vs": [[5, "فأبقاه في السجن. أما الكنيسة فكانت ترفع الصلاة الحارة إلى الله من أجله."]]}, {"l": "Rom 12:12", "n": "", "vs": [[12, "فرحين بالرجاء، صابرين في الضيق، مواظبين على الصلاة،"]]}, {"l": "Phi 4:6", "n": "", "vs": [[6, "لا تقلقوا من جهة أي شيء، بل في كل أمر لتكن طلباتكم معروفة لدى الله، بالصلاة والدعاء، مع الشكر."]]}, {"l": "Col 4:2", "n": "", "vs": [[2, "داوموا على الصلاة، متيقظين فيها بالشكر،"]]}, {"l": "1Th 5:17", "n": "", "vs": [[17, "صلوا دون انقطاع؛"]]}, {"l": "2Ti 1:3", "n": "", "vs": [[3, "كم أشكر الله ، الذي أعبده بضمير طاهر كما أخذت عن أجدادي، إذ مازلت أذكرك دائما في تضرعاتي ليلا ونهارا؛"]]}], "kwAr": "كونوا مصلين في كل حال", "noteAr": ""}, {"kw": "supplication", "raw": "1Ki_8:52, 1Ki_8:54, 1Ki_8:59, 1Ki_9:3; Est_4:8; Dan_9:20; Hos_12:4; 1Ti_2:1; Heb_5:7", "note": "", "refs": [{"l": "1Ki 8:52", "n": "", "vs": [[52, "لتكن عيناك مفتوحتين ملتفتتين نحو تضرع عبدك وابتهال شعبك إسرائيل، فتصغي إليهم كلما استغاثوا بك،"]]}, {"l": "1Ki 8:54", "n": "", "vs": [[54, "وعندما انتهى سليمان من الصلاة إلى الرب والتضرع إليه، نهض من أمام المذبح حيث كان جاثيا على ركبتيه وباسطا يديه نحو السماء."]]}, {"l": "1Ki 8:59", "n": "", "vs": [[59, "ولتكن كلماتي التي تضرعت بها ماثلة دائما أمام الرب ليل نهار ليسعف عبده في قضاء شؤونه، ويعين شعبه إسرائيل في قضاء أمور حياتهم يوما بعد يوم،"]]}, {"l": "1Ki 9:3", "n": "", "vs": [[3, "وقال له: «سمعت صلاتك وتضرعك الذي رفعته أمامي، لهذا قدست هذا الهيكل الذي شيدته لأضع اسمي عليه إلى الأبد، فتكون عيناي وقلبي هناك كل الأيام."]]}, {"l": "Est 4:8", "n": "", "vs": [[8, "وأعطاه نسخة من الأمر الصادر عن العاصمة بإفناء اليهود لكي يطلع أستير عليها، ويخبرها بما جرى، ويوصيها أن تمثل أمام الملك وتتوسل إليه أن يعفو عن شعبها."]]}, {"l": "Dan 9:20", "n": "", "vs": [[20, "وبينما كنت أصلي وأعترف بخطيئتي وخطيئة شعبي إسرائيل، وأرفع تضرعاتي أمام الرب إلهي من أجل جبل قدس إلهي،"]]}, {"l": "Hos 12:4", "n": "", "vs": [[4, "تصارع مع الملاك وغلب. بكى والتمس رضاه وبركته، التقاه الله في بيت إيل فخاطبه هناك."]]}, {"l": "1Ti 2:1", "n": "", "vs": [[1, "فأطلب، قبل كل شيء، أن تقيموا الطلبات الحارة والصلوات والتضرعات والتشكرات لأجل جميع الناس،"]]}, {"l": "Heb 5:7", "n": "", "vs": [[7, "والمسيح، في أثناء حياته البشرية على الأرض، رفع أدعية وتضرعات مقترنة بصراخ شديد ودموع، إلى القادر أن يخلصه من الموت. وقد لبى الله طلبه إكراما لتقواه."]]}], "kwAr": "وطلبة", "noteAr": ""}, {"kw": "in the", "raw": "Eph_2:22; Zec_12:10; Rom_8:15, Rom_8:26, Rom_8:27; Gal_4:6; Jud_1:20", "note": "", "refs": [{"l": "Eph 2:22", "n": "", "vs": [[22, "وفيه أنتم أيضا قد بنيتم معا فصرتم مسكنا لله بوجود الروح."]]}, {"l": "Zec 12:10", "n": "", "vs": [[10, "وأفيض على ذرية داود وعلى سكان أورشليم روح النعمة والابتهال، حتى إذا نظروا إلي أنا الذي طعنوه ينوحون عليه كما ينوح والد على ولده الوحيد، متفجعين عليه كتفجعهم على موت بكرهم."]]}, {"l": "Rom 8:15", "n": "", "vs": [[15, "إذ إنكم لم تنالوا روح عبودية يعيدكم إلى الخوف، بل نلتم روح بنوة به نصرخ: «أبا! أبانا!»"]]}, {"l": "Rom 8:26", "n": "", "vs": [[26, "وكذلك الروح أيضا يمدنا بالعون لنقهر ضعفنا. فإننا لا نعلم ما يجب أن نصلي لأجله كما يليق، ولكن الروح نفسه يؤدي الشفاعة عنا بأنات تفوق التعبير."]]}, {"l": "Rom 8:27", "n": "", "vs": [[27, "على أن فاحص القلوب يعلم قصد الروح، لأن الروح يشفع في القديسين بما يوافق الله ."]]}, {"l": "Gal 4:6", "n": "", "vs": [[6, "وبما أنكم أبناء له، أرسل الله إلى قلوبنا روح ابنه، مناديا: «أبا، ياأبانا»."]]}, {"l": "Jud 1:20", "n": "", "vs": [[20, "وأما أنتم أيها الأحباء، فابنوا أنفسكم على إيمانكم الأقدس، وصلوا دائما في الروح القدس."]]}], "kwAr": "في الروح", "noteAr": ""}, {"kw": "watching", "raw": "Mat_26:41; Mar_13:33, Mar_14:38; Luk_21:36, Luk_22:46; Col_4:2; 1Pe_4:7", "note": "", "refs": [{"l": "Mat 26:41", "n": "", "vs": [[41, "اسهروا وصلوا لكي لا تدخلوا في تجربة. إن الروح نشيط؛ أما الجسد فضعيف»."]]}, {"l": "Mar 13:33", "n": "", "vs": [[33, "فانتبهوا واسهروا لأنكم لا تعرفون متى يحين الوقت!"]]}, {"l": "Mar 14:38", "n": "", "vs": [[38, "اسهروا وصلوا لئلا تدخلوا في تجربة. إن الروح نشيط، وأما الجسد فضعيف»."]]}, {"l": "Luk 21:36", "n": "", "vs": [[36, "فاسهروا إذن وتضرعوا في كل حين، لكي تتمكنوا من أن تنجوا من جميع هذه الأمور التي هي على وشك أن تحدث، وتقفوا أمام ابن الإنسان»."]]}, {"l": "Luk 22:46", "n": "", "vs": [[46, "فقال لهم: «ما بالكم نائمين؟ قوموا وصلوا لكي لا تدخلوا في تجربة!»"]]}, {"l": "Col 4:2", "n": "", "vs": [[2, "داوموا على الصلاة، متيقظين فيها بالشكر،"]]}, {"l": "1Pe 4:7", "n": "", "vs": [[7, "إن نهاية كل شيء قد صارت قريبة. فتعقلوا إذن، وكونوا متنبهين لرفع الصلاة دائما."]]}], "kwAr": "وساهرين لهذا الغرض", "noteAr": ""}, {"kw": "all perseverance", "raw": "Gen_32:24-28; Mat_15:25-28; Luk_11:5-8, Luk_18:1-8", "note": "", "refs": [{"l": "Gen 32:24-28", "n": "", "vs": [[24, "وبقي وحده، صارعه إنسان حتى مطلع الفجر."], [25, "وعندما رأى أنه لم يتغلب على يعقوب، ضربه على حق فخذه، فانخلع مفصل فخذ يعقوب في مصارعته معه."], [26, "وقال له: «أطلقني، فقد طلع الفجر». فأجابه يعقوب: «لا أطلقك حتى تباركني»."], [27, "فسأله: «ما اسمك؟» فأجاب: «يعقوب»."], [28, "فقال: «لا يدعى اسمك في ما بعد يعقوب، بل إسرائيل (ومعناه: يجاهد مع الله)، لأنك جاهدت مع الله والناس وقدرت»."]]}, {"l": "Mat 15:25-28", "n": "", "vs": [[25, "ولكن المرأة اقتربت إليه، وسجدت له، وقالت: «أعني ياسيد!»"], [26, "فأجاب: «ليس من الصواب أن يؤخذ خبز البنين ويطرح لجراء الكلاب!»"], [27, "فقالت: «صحيح ياسيد؛ ولكن جراء الكلاب تأكل من الفتات الذي يسقط من موائد أصحابها!»"], [28, "فأجابها يسوع: «أيتها المرأة، عظيم إيمانك! فليكن لك ما تطلبين!» فشفيت ابنتها من تلك الساعة."]]}, {"l": "Luk 11:5-8", "n": "", "vs": [[5, "ثم قال لهم: «من منكم يكون له صديق، فيذهب إليه في منتصف الليل ويقول له: ياصديقي، أقرضني ثلاثة أرغفة،"], [6, "فقد جاءني صديق من سفر، وليس عندي ما أقدم له!"], [7, "لكن صديقه يجيبه من الداخل: لا تزعجني! فقد أقفلت الباب، وها أنا وأولادي في الفراش. لا أقدر أن أقوم وأعطيك!"], [8, "أقول لكم: إن كان لا يقوم ويعطيه لأنه صديقه، فلابد أن يقوم ويعطيه قدر ما يحتاج إليه، لأنه ألح في الطلب."]]}, {"l": "Luk 18:1-8", "n": "", "vs": [[1, "وضرب لهم مثلا في وجوب الصلاة دائما ودون ملل،"], [2, "قال: «كان في مدينة قاض لا يخاف الله ولا يحترم إنسانا."], [3, "وكان في تلك المدينة أرملة كانت تأتي إليه قائلة: أنصفني من خصمي!"], [4, "فظل يرفض طلبها مدة من الزمن. ولكنه بعد ذلك قال في نفسه: حتى لو كنت لا أخاف الله ولا أحترم إنسانا،"], [5, "فمهما يكن، فلأن هذه الأرملة تزعجني سأنصفها، لئلا تأتي دائما فتصدع رأسي!»"], [6, "وقال الرب: «اسمعوا ما يقوله القاضي الظالم."], [7, "أفلا ينصف الله مختاريه الذين يصرخون إليه نهارا وليلا؟ أما يسرع في الاستجابة لهم؟"], [8, "أقول لكم: إنه ينصفهم سريعا. ولكن، عندما يعود ابن الإنسان، أيجد إيمانا على الأرض؟»"]]}], "kwAr": "مواظبين تماما", "noteAr": ""}, {"kw": "supplication", "raw": "Eph_6:19, Eph_1:16, Eph_3:8, Eph_3:18; Phi_1:4; 1Ti_2:1; Col_1:4; Phm_1:5", "note": "", "refs": [{"l": "Eph 6:19", "n": "", "vs": [[19, "ولأجلي كي ألهم ما أنطق به كلما فتحت فمي لأعلن بجرأة سر الإنجيل"]]}, {"l": "Eph 1:16", "n": "", "vs": [[16, "لا أنقطع عن شكر الله لأجلكم وعن ذكركم في صلواتي،"]]}, {"l": "Eph 3:8", "n": "", "vs": [[8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "Eph 3:18", "n": "", "vs": [[18, "تصيرون قادرين تماما أن تدركوا، مع القديسين جميعا، ما هو العرض والطول والعلو والعمق،"]]}, {"l": "Phi 1:4", "n": "", "vs": [[4, "إذ أتضرع بفرح لأجلكم جميعا كل حين في جميع صلواتي،"]]}, {"l": "1Ti 2:1", "n": "", "vs": [[1, "فأطلب، قبل كل شيء، أن تقيموا الطلبات الحارة والصلوات والتضرعات والتشكرات لأجل جميع الناس،"]]}, {"l": "Col 1:4", "n": "", "vs": [[4, "إذ بلغنا خبر إيمانكم بالمسيح يسوع والمحبة التي لكم نحو جميع القديسين،"]]}, {"l": "Phm 1:5", "n": "", "vs": [[5, "وقد سمعت بما لك من محبة وأمانة من نحو الرب يسوع، ومن نحو جميع القديسين،"]]}], "kwAr": "جميع الطلبات", "noteAr": ""}], "arS": [["كونوا ", []], ["مصلين" ء في كل شيء، في كل كلام، وكل معرفة،"]]}, {"l": "2Co 8:7", "n": "", "vs": [[7, "ولكن، كما أنكم في وفرة من كل شيء: من الإيمان، والكلمة، والمعرفة، والاجتهاد في كل أمر، ومحبتكم لنا، ليتكم تكونون أيضا في وفرة من نعمة العطاء هذه."]]}], "kwAr": "كي ألهم ما أنطق به", "noteAr": ""}, {"kw": "that I", "raw": "Act_4:13, Act_4:29, Act_4:31, Act_9:27, Act_9:29, Act_13:46, Act_14:3, Act_18:26, Act_19:8, Act_28:31; 2Co_3:12 *marg. 2Co_7:4; Phi_1:20; 1Th_2:2", "note": "", "refs": [{"l": "Act 4:13", "n": "", "vs": [[13, "فتعجب المجتمعون من جرأة بطرس ويوحنا، لما عرفوا أنهما غير متعلمين وأنهما من عامة الشعب، فأدركوا أنهما كانا مع يسوع."]]}, {"l": "Act 4:29", "n": "", "vs": [[29, "والآن انظر، يارب، إلى تهديدهم، وهبنا نحن عبيدك أن نعلن كلامك بكل جرأة،"]]}, {"l": "Act 4:31", "n": "", "vs": [[31, "وفيما هم يصلون ارتج المكان الذي كانوا مجتمعين فيه، وامتلأوا جميعا بالروح القدس، فأخذوا يعلنون كلمة الله بكل جرأة!"]]}, {"l": "Act 9:27", "n": "", "vs": [[27, "فتولى برنابا أمره وأحضره إلى الرسل، وحدثهم كيف ظهر الرب له في الطريق وكلمه، وكيف بشر بجرأة باسم يسوع في دمشق."]]}, {"l": "Act 9:29", "n": "", "vs": [[29, "وكان يخاطب اليهود اليونانيين ويجادلهم، فحاولوا أن يقتلوه."]]}, {"l": "Act 13:46", "n": "", "vs": [[46, "فخاطبهم بولس وبرنابا بجرأة قائلين: «كان يجب أن نبلغكم أنتم أولا كلمة الله، ولكنكم رفضتموها فأظهرتم أنكم لا تستحقون الحياة الأبدية. وها نحن نتوجه إلى غير اليهود!"]]}, {"l": "Act 14:3", "n": "", "vs": [[3, "إلا أن بولس وبرنابا بقيا هناك فترة طويلة يبشران بالرب بكل جرأة، وأيدهما الرب شاهدا لكلمة نعمته بما أجراه على أيديهما من آيات وعجائب."]]}, {"l": "Act 18:26", "n": "", "vs": [[26, "فقد أخذ يتكلم في المجمع بجرأة. فسمعه أكيلا وبريسكلا، فأخذاه إليهما وأوضحا له طريق الله بأكثر دقة."]]}, {"l": "Act 19:8", "n": "", "vs": [[8, "وأخذ بولس يداوم على الذهاب إلى المجمع مدة ثلاثة أشهر، يتكلم بجرأة فيناقش الحاضرين ويحاول إقناعهم بالحقائق المختصة بملكوت الله."]]}, {"l": "Act 28:31", "n": "", "vs": [[31, "مبشرا بملكوت الله، ومعلما الأمور المختصة بالرب يسوع المسيح بكل جرأة وبلا عائق."]]}, {"l": "2Co 3:12", "n": "*marg.", "vs": [[12, "فإذ لنا هذا الرجاء الوطيد، نعمل بكثير من الجرأة."]]}, {"l": "2Co 7:4", "n": "", "vs": [[4, "كبيرة ثقتي بكم، وعظيم افتخاري بكم. إني ممتليء تشجيعا وفائض فرحا في جميع ضيقاتنا."]]}, {"l": "Phi 1:20", "n": "", "vs": [[20, "وفقا لما أتوقعه وأرجوه: أني لن أفشل في شيء، بل في كل جرأة وكما في كل حين فكذلك الآن أيضا، يتعظم المسيح في جسدي، سواء أكان بالحياة أم بالموت."]]}, {"l": "1Th 2:2", "n": "", "vs": [[2, "فمع أننا كنا قد قاسينا الألم والإهانة في مدينة فيلبي، كما تعلمون، فقد تجرأنا في إلهنا أن نكلمكم بإنجيل الله مجاهدين في وجه المعارضة الشديدة."]]}], "kwAr": "كلما فتحت فمي", "noteAr": ""}, {"kw": "the mystery", "raw": "Eph_1:9, Eph_3:3, Eph_3:4; 1Co_2:7, 1Co_4:1; Col_1:26, Col_1:27, Col_2:2; 1Ti_3:16", "note": "", "refs": [{"l": "Eph 1:9", "n": "", "vs": [[9, "إذ كشف لنا سر مشيئته بحسب مرضاته التي قصدها في نفسه،"]]}, {"l": "Eph 3:3", "n": "", "vs": [[3, "كيف كشف لي السر عن طريق الوحي، كما كتبت قبلا بإيجاز،"]]}, {"l": "Eph 3:4", "n": "", "vs": [[4, "ويمكنكم، حينما تقرأون ما كتبته، أن تدركوا اطلاعي العميق على سر المسيح،"]]}, {"l": "1Co 2:7", "n": "", "vs": [[7, "بل إننا نتكلم بحكمة الله المطوية في سر، تلك الحكمة المحجوبة التي سبق الله فأعدها قبل الدهور لأجل مجدنا"]]}, {"l": "1Co 4:1", "n": "", "vs": [[1, "فلينظر إلينا الناس باعتبارنا خداما للمسيح ووكلاء على أسرار الله."]]}, {"l": "Col 1:26", "n": "", "vs": [[26, "السر الذي كان مكتوما طوال العصور والأجيال، ولكن كشف الآن لقديسيه،"]]}, {"l": "Col 1:27", "n": "", "vs": [[27, "الذين أراد الله أن يعلن لهم كم هو غني مجد هذا السر بين الأمم: إنه المسيح فيكم، وهو رجاء المجد؛"]]}, {"l": "Col 2:2", "n": "", "vs": [[2, "بغرض أن تتشجع قلوبهم وتكون كلها متحدة في المحبة، لبلوغ الإدراك التام بكل غناه، لمعرفة سر الله، أي المسيح،"]]}, {"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}], "kwAr": "سر الإنجيل", "noteAr": ""}], "arS": [["ولأجلي", ["G5228", "G1700"]], [" كي ألهم ما ", ام بيت رحوب وأرام صوبا عشرين ألف راجل، ومن ملك معكة ألف رجل، ومن رجال طوب اثني عشر ألف رجل."]]}, {"l": "Act 26:29", "n": "", "vs": [[29, "فقال بولس: «سواء كان قليلا أم كثيرا، فإن صلاتي إلى الله لأجلك ولأجل الحاضرين هنا جميعا أن تصيروا مثلي، ولكن دون هذه السلاسل!»"]]}, {"l": "Act 28:20", "n": "", "vs": [[20, "لذلك طلبت أن أراكم وأكلمكم؛ فأنا موثق بهذه السلسلة من أجل رجاء إسرائيل»."]]}, {"l": "Phi 1:7", "n": "", "vs": [[7, "كما أن من الحق أن يكون لي هذا الشعور تجاهكم جميعا، لأني أحتفظ بكم في قلبي، لكونكم جميعا شركاء لي في النعمة، سواء أكان في قيودي أم في الدفاع عن الإنجيل وتثبيته."]]}, {"l": "Phi 1:13", "n": "", "vs": [[13, "حتى إنه قد صار معروفا لدى الحرس الإمبراطوري كله ولدى الباقين جميعا أن قيودي إنما هي لأجل المسيح؛"]]}, {"l": "Phi 1:14", "n": "", "vs": [[14, "كما أن أكثر الإخوة، وقد صاروا واثقين بالرب بسبب قيودي، يجرؤون على التبشير بكلمة الله دون خوف."]]}, {"l": "2Ti 1:16", "n": "", "vs": [[16, "ليرحم الرب عائلة أونيسيفورس، لأنه كثيرا ما أنعشني، ولم يخجل بقيودي،"]]}, {"l": "2Ti 2:9", "n": "", "vs": [[9, "الذي لأجل التبشير به أقاسي حتى القيود كأني فاعل شر. إلا أن كلمة الله لا تكبلها القيود."]]}, {"l": "Phm 1:10", "n": "", "vs": [[10, "فألتمس منك لأجل ولدي الذي ولدته وأنا مكبل بالقيود، أونسيموس،"]]}], "kwAr": "المقيد بالسلاسل", "noteAr": "أو: سلسلة."}, {"kw": "therein", "raw": "or, thereof", "note": "or, thereof", "refs": [], "kwAr": "في إعلانه", "noteAr": "أو: عنه (به)."}, {"kw": "boldly", "raw": "Eph_6:19; Isa_58:1; Jer_1:7, Jer_1:8, Jer_1:17; Eze_2:4-7; Mat_10:27, Mat_10:28; Act_5:29, Act_28:31; Col_4:4; Phi_1:20; 1Th_2:2; 1Jo_3:16; Jud_1:3", "note": "", "refs": [{"l": "Eph 6:19", "n": "", "vs": [[19, "ولأجلي كي ألهم ما أنطق به كلما فتحت فمي لأعلن بجرأة سر الإنجيل"]]}, {"l": "Isa 58:1", "n": "", "vs": [[1, "ناد بأعلى صوتك، لا تصمت. اهتف بصوتك كنفير بوق، وأخبر شعبي بإثمهم، وذرية يعقوب بخطاياهم."]]}, {"l": "Jer 1:7", "n": "", "vs": [[7, "ولكن الرب أجابني: «لا تقل إني لست سوى ولد، لأنك ستذهب إلى كل من أبعث بك إليه، وتنطق بكل ما آمرك به."]]}, {"l": "Jer 1:8", "n": " ["G4243"]], [" المقيد ", []], ["بالسلاسل", ["G254"]], ["، فأكون ", []], ["جريئا", ["G3955"]], [" في إعلانه كما ", []], ["يجب", ["G1163"]], [" أن ", []], ["أتكلم", ["G2980"]], [" به.", []]]}, {"c": 6, "v": 21, "text": "ولكي تعرفوا أحوالي وأخبار عملي، فإن تيخيكس، الأخ الحبيب والخادم الأمين في الرب، يخبركم بها جميعا.", "groups": [{"kw": "that", "raw": "Phi_1:12; Col_4:7", "note": "", "refs": [{"l": "Phi 1:12", "n": "", "vs": [[12, "على أني أريد أن تعلموا، أيها الإخوة، أن أحوالي قد أدت في الواقع إلى انتشار الإنجيل بنجاح،"]]}, {"l": "Col 4:7", "n": "", "vs": [[7, "أما أحوالي كلها، فسيخبركم بها تيخيكس، الأخ الحبيب والخادم الأمين ورفيقنا العبد في الرب،"]]}], "kwAr": "ولكي تعرفوا أحوالي", "noteAr": ""}, {"kw": "Tychicus", "raw": "Act_20:4; 2Ti_4:12; Tit_3:12", "note": "", "refs": [{"l": "Act 20:4", "n": "", "vs": [[4, "ورافقه في السفر سوباترس بن برس من بيرية؛ وأرسترخس وسكوندس من تسالونيكي؛ وغايوس وتيموثاوس من دربة، وتيخيكس وتروفيمس من مقاطعة أسيا."]]}, {"l": "2Ti 4:12", "n": "", "vs": [[12, "أما تيخيكس، فقد أرسلته إلى مدينة أفسس."]]}, {"l": "Tit 3:12", "n": "", "vs": [[12, "حالما أرسل إليك أرتماس أو تيخيكس، اجتهد أن تأتيني إلى مدينة نيكوبوليس، لأني قررت أن أقضي فصل الشتاء هناك."]]}], "kwAr": "تيخيكس", "noteAr": ""}, {"kw": "beloved", "raw": "Col_4:9; Phm_1:16; 2Pe_3:15", "note": "", "refs": [{"l": "Col 4:9", "n": "", "vs": [[9, "يرافقه أونسيموس، الأخ الأمين الحبيب الذي هو من عندكم. فهما يطلعانكم على أحوالنا هنا."]]}, {"l": "Phm 1:16", "n": "", "vs": [[16, "لا كعبد في ما بعد، بل أفضل من عبد، أخا حبيبا، إلي بخاصة، فكم بالأحرى إليك، في الجسد وفي الرب معا؟"]]}, {"l": "2Pe 3:15", "n": "", "vs": [[15, "وتأكدوا أن تأني ربنا في رجوعه، هو فرصة للخلاص."]]}], "kwAr": "الأخ الحبيب", "noteAr": ""}, {"kw": "faithful", "raw": "1Co_4:17; Col_1:7; 1Ti_4:6; 1Pe_5:12", "note": "", "refs": [{"l": "1Co 4:17", "n": "", "vs": [[17, "لهذا السبب عينه أرسلت إليكم تيموثاوس، ابني الحبيب الأمين في الرب، فهو يذكركم بطرقي في السلوك في المسيح كما أعلم بها في كل مكان في جميع الكنائس."]]}, {"l": "Col 1:7", s": [[25, "لتكن النعمة معكم جميعا!"]]}], "kwAr": "لتكن النعمة", "noteAr": ""}, {"kw": "love", "raw": "Joh_21:15-17; 1Co_16:22", "note": "", "refs": [{"l": "Joh 21:15-17", "n": "", "vs": [[15, "وبعدما أكلوا سأل يسوع سمعان بطرس: «ياسمعان بن يونا، أتحبني أكثر مما يحبني هؤلاء؟» فأجابه «نعم يارب، أنت تعلم أني أحبك!» فقال له: «أطعم حملاني!»"], [16, "ثم سأله ثانية: «ياسمعان بن يونا، أتحبني؟» فأجابه: «نعم يارب. أنت تعلم أني أحبك!» قال له: «ارع خرافي»"], [17, "فسأله مرة ثالثة: «ياسمعان بن يونا، أتحبني؟» فحزن بطرس لأن يسوع قال له في المرة الثالثة: «أتحبني». وقال له: «يارب، أنت تعلم كل شيء. أنت تعلم أني أحبك!» فقال له يسوع: «أطعم خرافي!"]]}, {"l": "1Co 16:22", "n": "", "vs": [[22, "إن كان أحد لا يحب الرب فليكن «أناثيما» (أي ملعونا)!"]]}], "kwAr": "الذين يحبون ربنا يسوع المسيح", "noteAr": ""}, {"kw": "in sincerity", "raw": "or, with incorruption, Mat_22:37; 2Co_8:8, 2Co_8:12; Tit_2:7", "note": "or, with incorruption, Mat_22:37; 2Co_8:8, 2Co_8:12; Tit_2:7", "refs": [{"l": "Mat 22:37", "n": "", "vs": [[37, "فأجابه: «أحب الرب إلهك بكل قلبك وكل نفسك وكل فكرك!"]]}, {"l": "2Co 8:8", "n": "", "vs": [[8, "لا أقول هذا على سبيل الأمر، بل اختبارا لصدق محبتكم بحماسة الآخرين."]]}, {"l": "2Co 8:12", "n": "", "vs": [[12, "فمتى وجد الاستعداد، يقبل العطاء على قدر ما يملك الإنسان، لا على قدر ما لا يملك."]]}, {"l": "Tit 2:7", "n": "", "vs": [[7, "جاعلا من نفسك في كل شيء قدوة للأعمال الصالحة، مظهرا في تعليمك النقاوة والوقار"]]}], "kwAr": "محبة لا يعتريها الفساد", "noteAr": "أو: في عدم فساد."}, {"kw": "Amen", "raw": "Mat_6:13, Mat_28:20", "note": "", "refs": [{"l": "Mat 6:13", "n": "", "vs": [[13, "ولا تدخلنا في تجربة، لكن نجنا من الشرير، لأن لك الملك والقوة والمجد إلى الأبد. آمين."]]}, {"l": "Mat 28:20", "n": "", "vs": [[20, "وعلموهم أن يعملوا بكل ما أوصيتكم به. وها أنا معكم كل الأيام إلى انتهاء الزمان! »."]]}], "kwAr": "آمين", "noteAr": ""}], "arS": [["لتكن ", []], ["النعمة", ["G5485"]], [" مع ", []], ["جميع", ["G3956"]], [" الذين ", []], ["يحبون", ["G25"]], [" ", []], ["ربنا", ["G2962", "G2257"]
