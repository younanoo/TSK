ام، فكان شعبي يبني حائطا وهم يطلونه بماء الكلس."], [11, "قل للطالين بماء الكلس: إن الحائط يتداعى، إذ ينهمر مطر جارف. وأنتن ياحجارة البر د تساقطن، ولتعصف به ريح جائحة."], [12, "فلا يلبث السور أن ينهار أفلا تسألون آنئذ: أين الطين الذي طينتم به؟"], [13, "لذلك، هذا ما يعلنه السيد الرب: ها أنا أجعل ريحا عاتية تخترق السور بفعل حنقي، ومطرا جارفا ينهمر في خضم غضبي، وحجارة برد تتساقط في أثناء سخطي لكي تهلك،"], [14, "فأهدم السور الذي طليتموه بماء الكلس وأسويه بالأرض فيتعرى أساسه وتتداعى المدينة وتفنون جميعا في وسطها فتدركون أني أنا الرب."], [15, "فأنفث غضبي بالسور وبمن يطلونه بماء الكلس وأقول لكم: قد تلاشى السور والذين يطلونه."], [16, "الذين هم أنبياء إسرائيل الأدعياء، المتنبئون لإسرائيل، الذين يرون لها رؤى سلام، مع أنه لا سلام هناك، يقول السيد الرب."]]}, {"l": "Mic 3:5", "n": "", "vs": [[5, "وهذا ما يقوله الرب بشأن الأنبياء الذين يضلون شعبه، الذين ينادون قائلين: «سلام» لمن يعطيهم طعاما، ويعلنون الحرب على من لا يلقم أفواههم."]]}, {"l": "Mat 24:4", "n": "", "vs": [[4, "فأجاب يسوع: «انتبهوا! لا يضللكم أحد!"]]}, {"l": "Mat 24:24", "n": "", "vs": [[24, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات عظيمة وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Mar 13:5", "n": "", "vs": [[5, "فأخذ يسوع يجيبهم قائلا: «انتبهوا! لا يضللكم أحد!"]]}, {"l": "Mar 13:22", "n": "", "vs": [[22, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Gal 6:7", "n": "", "vs": [[7, "لا تنخدعوا: إن الله لا يستهزأ به. فكل ما يزرعه الإنسان، فإياه يحصد أيضا."]]}, {"l": "Gal 6:8", "n": "", "vs": [[8, "فإن من يزرع لجسده، فمن الجسد يحصد فسادا. ومن يزرع للروح، فمن الروح يحصد حياة أبدية. فلا نفشل في عمل الخير،"]]}, {"l": "Col 2:4", "n": "", "vs": [[4, "أقول هذا حتى لا يضللكم أحد بكلام خداع."]]}, {"l": "Col 2:8", "n": "", "vs": [[8, "احذروا أن يوقعكم أحد فريسة بالفلسفة والغرور الباطل، عملا بتقاليد الناس ومباديء العالم؛ مما لا يوافق المسيح."]]}, {"l": "Col 2:18", "n": "", "vs": [[18, "لا يحرمكم أحد من جائزتكم، بحملكم على ما يرغب فيه من إظهار التواضع والتعبد للملائكة، داخلا في رؤى يتوهمها، وقد نفخه باطلا ذهنه الجسدي،"]]}, {"l": "2Th 2:3", "n": "", "vs": [[3, "لا تدعوا أحدا يخدعكم بأية وسيلة! فإن ذلك اليوم لا يأتي دون أن يسبقه انتشار العصيان وظهور الإنسان المتمرد، ابن الهلاك،"]]}, {"l": "2Th 2:10-12", "n": "", "vs": [[10, "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا."], [11, "ولهذا السبب، سيرسل الله إليهم طاقة الضلال حتى يصدقوا ما هو دجل،"], [12, "فتقع الدينونة على جميع الذين لم يؤمنوا بالحق بل سرهم الإثم."]]}, {"l": "1Jo 4:1", "n": "", "vs": [[1, "أيها الأحباء، لا تصدقوا كل روح، بل امتحنوا الأرواح لتعرفوا ما إذا كانت من عند الله أم لا، لأن عددا كبيرا من الأنبياء الدجالين قد انتشر في العالم."]]}], "kwAr": "لا يخدعكم أحد", "noteAr": ""}, {"kw": "vain", "raw": "2Ki_18:20; Jer_23:14-16", "note": "", "refs": [{"l": "2Ki 18:20", "n": "", "vs": [[20, "أظننت أن مجرد الكلام يشكل خطة وقوة لخوض الحرب؟ على من اعتمدت حتى تمردت علي؟"]]}, {"l": "Jer 23:14-16", "n": "", "vs": [[14, "وفي أوساط أنبياء أورشليم رأيت أمورا مهولة: يرتكبون الفسق، ويسلكون في الأكاذيب، يشددون أيدي فاعلي الإثم لئلا يتوب أحد عن شره. صاروا جميعا كسكان سدوم وأصبح أهلها كأهل عمورة."], [15, "لذلك هذا ما يقوله الرب القدير عن الأنبياء: «ها أنا أطعمهم أفسنتينا وأسقيهم ماء مسموما، لأنه من أنبياء أورشليم شاع الكفر في كل أرجاء الأرض»."], [16, "«لا تسمعوا لأقوال الأنبياء الذين يتنبأون لكم ويخدعونكم بالأوهام، لأنهم ينطقون برؤى مخيلاتهم، ولا يتكلمون بما أوحى به فمي."]]}], "kwAr": "بكلام باطل", "noteAr": ""}, {"kw": "cometh", "raw": "Num_32:13, Num_32:14; Jos_22:17, Jos_22:18; Psa_78:31; Rom_1:18; Col_3:6", "note": "", "refs": [{"l": "Num 32:13", "n": "", "vs": [[13, "وإذ اشتد غضب الرب على بني إسرائيل أتاههم في الصحراء أربعين سنة، حتى تم فناء كل الجيل الذي ارتكب الشر في عيني الرب."]]}, {"l": "Num 32:14", "n": "", "vs": [[14, "وها أنتم نتاج تربية قوم خطاة، ترتكبون وزر آبائكم، لتزيدوا من شدة غضبه على إسرائيل."]]}, {"l": "Jos 22:17", "n": "", "vs": [[17, "ألم يكفنا إثم فغور الذي لم نتطهر منه إلى هذا اليوم منذ أن تفشى الوبأ في جماعة الرب،"]]}, {"l": "Jos 22:18", "n": "", "vs": [[18, "حتى ترتدوا أنتم اليوم عن الرب؟ إذا تمردتم اليوم على الرب فإنه يسخط غدا على كل جماعة إسرائيل."]]}, {"l": "Psa 78:31", "n": "", "vs": [[31, "ثار عليهم غضب الله، فقتل أسمنهم وصرع نخبتهم."]]}, {"l": "Rom 1:18", "n": "", "vs": [[18, "فإنه قد أعلن غضب الله من السماء على جميع ما يفعله الناس من عصيان وإثم فيحجبون الحق بالإثم."]]}, {"l": "Col 3:6", "n": "", "vs": [[6, "فبسبب هذه الخطايا ينزل غضب الله،"]]}], "kwAr": "يحل غضب الله", "noteAr": ""}, {"kw": "children", "raw": "Eph_2:2, Eph_2:3", "note": "", "refs": [{"l": "Eph 2:2", "n": "", "vs": [[2, "التي كنتم تسلكون فيها حسب مسرى هذا العالم، تابعين رئيس قوات الهواء، ذلك الروح العامل الآن في أبناء العصيان،"]]}, {"l": "Eph 2:3", "n": "", "vs": [[3, "الذين بينهم نحن أيضا كنا نسلك سابقا في شهوات جسدنا، عاملين ما يريده الجسد والأفكار، وكنا بالطبيعة أولاد الغضب كالآخرين أيضا."]]}], "kwAr": "أبناء", "noteAr": ""}, {"kw": "disobedience", "raw": "or, unbelief, Heb_3:19; 1Pe_2:8 *Gr.", "note": "or, unbelief, Heb_3:19; 1Pe_2:8 *Gr.", "refs": [{"l": "Heb 3:19", "n": "", "vs": [[19, "وهكذا، نرى أن عدم الإيمان منعهم من الدخول إلى مكان الراحة."]]}, {"l": "1Pe 2:8", "n": "*Gr.", "vs": [[8, "كما أنه هو «الحجر الذي يصطدمون به، والصخرة التي يسقطون عليها»! وهم يسقطون لأنهم يرفضون أن يؤمنوا بالكلمة."]]}], "kwAr": "العصيان", "noteAr": "أو: عدم الإيمان."}], "arS": [["لا ", []], ["يخدعكم", ["G538"]], [" ", []], ["أحد", ["G3367"]], [" ", []], ["بكلام", ["G3056"]], [" ", []], ["باطل", ["G2756"]], ["! فبسبب هذه ", []], ["الأمور", ["G5023"]], [" ", []], ["يحل", ["G2064"]], [" ", []], ["غضب", ["G3709"]], [" ", []], ["الله", ["G2316"]], [" على ", []], ["أبناء", ["G5207"]], [" ", []], ["العصيان", ["G543"]], [".", []]]}, {"c": 5, "v": 7, "text": "إذن، لا تكونوا شركاء لهم:", "groups": [{"kw": "", "raw": "Eph_5:11; Num_16:26; Psa_50:18; Pro_1:10-17, Pro_9:6, Pro_13:20; 1Ti_5:22; Rev_18:4", "note": "", "refs": [{"l": "Eph 5:11", "n": "", "vs": [[11, "وعليكم ألا تكتفوا بعدم الاشتراك في أعمال الظلام العقيمة، بل بالأحرى أن تفضحوها أيضا."]]}, {"l": "Num 16:26", "n": "", "vs": [[26, "وقال للجماعة كلها: «ابتعدوا عن خيام هؤلاء القوم الأشرار، ولا تلمسوا شيئا مما لهم لئلا تهلكوا من جراء خطاياهم»."]]}, {"l": "Psa 50:18", "n": "", "vs": [[18, "ترى سارقا فتوافقه، ومع الزناة نصيبك."]]}, {"l": "Pro 1:10-17", "n": "", "vs": [[10, "ياابني إن استغواك الخطاة فلا تقبل."], [11, "إن قالوا: «تعال معنا لنتربص بالناس حتى نسفك دماء أو نكمن للبريء ونقتله لغير علة."], [12, "أو قالوا لك: تعال لنبتلعهم أحياء كما تبتلعهم الهاوية وأصحاء كالهابطين في حفرة الموت"], [13, "فنغنم كل نفيس ونملأ بيوتنا بالأسلاب."], [14, "اربط مصيرك بمصيرنا، ولنتقاسم أسلابنا بالتساوي»."], [15, "إن قالوا لك هكذا فلا تسلك ياابني في طريقهم، واكفف قدمك عن سبيلهم."], [16, "لأن أرجلهم تسعى حثيثا إلى الشر، وتسرع إلى سفك الدماء."], [17, "فإنه عبثا تنصب الشبكة على مرأى الطير."]]}, {"l": "Pro 9:6", "n": "", "vs": [[6, "انبذوا الجهالة فتحيوا، واسلكوا سبيل الفهم»."]]}, {"l": "Pro 13:20", "n": "", "vs": [[20, "من يعاشر الحكماء يصبح حكيما، ورفيق الحمقى يناله الأذى."]]}, {"l": "1Ti 5:22", "n": "", "vs": [[22, "لا تتسرع في وضع يدك على أحد. ولا تشترك في خطايا الآخرين. واحفظ نفسك طاهرا."]]}, {"l": "Rev 18:4", "n": "", "vs": [[4, "ثم سمعت صوتا آخر ينادي من السماء: «اخرجوا منها ياشعبي، لئلا تشتركوا في خطاياها، فتصابوا ببلاياها،"]]}], "kwAr": "", "noteAr": ""}], "arS": [["إذن، لا تكونوا ", []], ["شركاء", ["G4830"]], [" لهم:", []]]}, {"c": 5, "v": 8, "text": "فقد كنتم في الماضي ظلاما، ولكنكم الآن نور في الرب. فاسلكوا سلوك أولاد النور.", "groups": [{"kw": "ye were", "raw": "Eph_2:11, Eph_2:12, Eph_4:18, Eph_6:12; Psa_74:20; Isa_9:2, Isa_42:16, Isa_60:2; Jer_13:16; Mat_4:16; Luk_1:79; Act_17:30, Act_26:18; Rom_1:21, Rom_2:19; 2Co_6:14; Col_1:13; Tit_3:3; 1Pe_2:9; 1Jo_2:8", "note": "", "refs": [{"l": "Eph 2:11", "n": "", "vs": [[11, "لذلك اذكروا، أنتم الأمم في الجسد سابقا، يامن تسمون أهل عدم الختان من قبل من يسمون أهل الختان الذي يجري في الجسد باليد،"]]}, {"l": "Eph 2:12", "n": "", "vs": [[12, "أنكم كنتم في ذلك الحين بلا مسيح، أجانب عن جماعة إسرائيل، وغرباء عن العهود الموعودة، لا رجاء لكم، ومنكرين لله في العالم."]]}, {"l": "Eph 4:18", "n": "", "vs": [[18, "لكونهم مظلمي البصيرة ومتغربين عن حياة الله بسبب ما فيهم من جهل وقساوة قلب."]]}, {"l": "Eph 6:12", "n": "", "vs": [[12, "فإن حربنا ليست ضد ذوي اللحم والدم، بل ضد الرئاسات، ضد السلطات، ضد أسياد العالم حكام هذا الظلام، ضد قوى الشر الروحية في الأماكن السماوية."]]}, {"l": "Psa 74:20", "n": "", "vs": [[20, "اذكر العهد الذي قطعته لنا، فإن الظلم كامن في كل ركن مظلم من الأرض."]]}, {"l": "Isa 9:2", "n": "", "vs": [[2, "الشعب السالك في الظلمة أبصر نورا عظيما، والمقيمون في أرض ظلال الموت أضاء عليهم نور."]]}, {"l": "Isa 42:16", "n": "", "vs": [[16, "وأقود العمي في سبيل لم يعرفوها من قبل، وأهديهم في مسالك يجهلونها، وأحيل الظلام أمامهم إلى نور، والأماكن الوعرة إلى أرض ممهدة. هذه الأمور أصنعها ولن أتخلى عنهم."]]}, {"l": "Isa 60:2", "n": "", "vs": [[2, "ها إن الظلمة تغمر الأرض، والليل الدامس يكتنف الشعوب، ولكن الرب يشرق عليك، ويتجلى مجده حولك،"]]}, {"l": "Jer 13:16", "n": "", "vs": [[16, "مجدوا الرب إلهكم قبل أن يجعل الظلام يخيم عليكم، وقبل أن تتعثر أقدامكم على الجبال المعتمة. أنتم ترتقبون النور ولكنه يحوله إلى ظلام الموت ويجعله ليلا دامسا."]]}, {"l": "Mat 4:16", "n": "", "vs": [[16, "الشعب الجالس في الظلمة، أبصر نورا عظيما، والجالسون في أرض الموت وظلاله، أشرق عليهم نور ! »"]]}, {"l": "Luk 1:79", "n": "", "vs": [[79, "ليضيء على القابعين في الظلام وظل الموت، ويهدي خطانا في طريق السلام»."]]}, {"l": "Act 17:30", "n": "", "vs": [[30, "فالله الآن يدعو جميع الناس في كل مكان أن يرجعوا إليه تائبين، وقد غض النظر عن أزمنة الجهل التي مرت،"]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "Rom 1:21", "n": "", "vs": [[21, "فمع أنهم عرفوا الله ، لم يمجدوه باعتباره الله ، ولا شكروه، بل انحطوا بتفكيرهم إلى الحماقة وصار قلبهم لغباوته مظلما."]]}, {"l": "Rom 2:19", "n": "", "vs": [[19, "ولك ثقة في نفسك بأنك قائد للعميان، ونور للذين في الظلام،"]]}, {"l": "2Co 6:14", "n": "", "vs": [[14, "لا تدخلوا مع غير المؤمنين تحت نير واحد. فأي ارتباط بين البر والإثم؟ وأية شركة بين النور والظلام؟"]]}, {"l": "Col 1:13", "n": "", "vs": [[13, "هو الذي أنقذنا من سلطة الظلام ونقلنا إلى ملكوت ابن محبته"]]}, {"l": "Tit 3:3", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."]]}, {"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}, {"l": "1Jo 2:8", "n": "", "vs": [[8, "ومع ذلك فالوصية التي أكتبها إليكم، هي جديدة دائما، وتتضح حقيقتها في المسيح كما تتضح فيكم أنتم. ذلك لأن الظلام قد بدأ يزول منذ أن أشرق النور الحقيقي الذي مازال الآن مشرقا."]]}], "kwAr": "فقد كنتم في الماضي ظلاما", "noteAr": ""}, {"kw": "but", "raw": "Isa_42:6, Isa_42:7, Isa_49:6, Isa_49:9, Isa_60:1, Isa_60:3, Isa_60:19, Isa_60:20; Joh_1:4, Joh_1:5, Joh_1:9, Joh_8:12, Joh_12:46; 1Co_1:30; 2Co_3:18, 2Co_4:6; 1Th_5:4-8; 1Jo_2:9-11", "note": "", "refs": [{"l": "Isa 42:6", "n": "", "vs": [[6, "«أنا هو الرب قد دعوتك بالبر. أمسكت بيدك وحافظت عليك وجعلتك عهدا للشعب ونورا للأمم"]]}, {"l": "Isa 42:7", "n": "", "vs": [[7, "لتفتح عيون العمي، وتطلق سراح المأسورين في السجن، وتحرر الجالسين في ظلمة الحبس."]]}, {"l": "Isa 49:6", "n": "", "vs": [[6, "لكم هو يسير أن تكون لي عبدا لتستنهض أسباط يعقوب، وترد من نجيت من إسرائيل، لذلك سأجعلك نورا للأمم لتكون خلاصي إلى أقصى الأرض."]]}, {"l": "Isa 49:9", "n": "", "vs": [[9, "لتقول للأسرى: اخرجوا، وللذين في الظلمة اظهروا، فيرعون في الطرقات وتصبح الروابي الجرداء مراعي لهم."]]}, {"l": "Isa 60:1", "n": "", "vs": [[1, "قومي استضيئي، فإن نورك قد جاء، ومجد الرب أشرق عليك."]]}, {"l": "Isa 60:3", "n": "", "vs": [[3, "فتقبل الأمم إلى نورك، وتتوافد الملوك إلى إشراق ضيائك."]]}, {"l": "Isa 60:19", "n": "", "vs": [[19, "ولا تعود الشمس نورا لك في النهار ولا يشرق ضوء القمر عليك لأن الرب يكون نورك الأبدي، وإلهك يكون مجدك."]]}, {"l": "Isa 60:20", "n": "", "vs": [[20, "ولا تغرب شمسك من بعد، ولا يتضاءل قمرك، لأن الرب يكون نورك الأبدي، وتنقضي أيام مناحتك."]]}, {"l": "Joh 1:4", "n": "", "vs": [[4, "فيه كانت الحياة. والحياة هذه كانت نور الناس."]]}, {"l": "Joh 1:5", "n": "", "vs": [[5, "والنور يضيء في الظلام، والظلام لم يدرك النور."]]}, {"l": "Joh 1:9", "n": "", "vs": [[9, "فالنور الحق الذي ينير كل إنسان كان آتيا إلى العالم."]]}, {"l": "Joh 8:12", "n": "", "vs": [[12, "وخاطبهم يسوع أيضا فقال: «أنا نور العالم. من يتبعني فلا يتخبط في الظلام بل يكون له نور الحياة»."]]}, {"l": "Joh 12:46", "n": "", "vs": [[46, "جئت إلى العالم نورا، فمن آمن بي لا يبقى في الظلام."]]}, {"l": "1Co 1:30", "n": "", "vs": [[30, "وبفضل الله صار لكم مقام في المسيح يسوع الذي جعل لنا حكمة من الله وبرا وقداسة وفداء،"]]}, {"l": "2Co 3:18", "n": "", "vs": [[18, "ونحن جميعا فيما ننظر إلى مجد الرب بوجوه كالمرآة لا حجاب عليها، نتجلى من مجد إلى مجد لنشابه الصورة الواحدة عينها، وذلك بفعل الرب الروح."]]}, {"l": "2Co 4:6", "n": "", "vs": [[6, "فإن الله ، الذي أمر أن يشرق نور من الظلام، هو الذي جعل النور يشرق في قلوبنا، لإشعاع معرفة مجد الله المتجلي في وجه المسيح."]]}, {"l": "1Th 5:4-8", "n": "", "vs": [[4, "غير أنكم أنتم، أيها الإخوة، لستم في الظلام حتى يفاجئكم ذلك اليوم كأنه لص."], [5, "فأنتم جميعا أبناء النور وأبناء النهار. إننا لسنا أهل الليل ولا أهل الظلام."], [6, "إذن، لا ننم كما ينام الآخرون، بل لنظل ساهرين وصاحين،"], [7, "فإنه في الليل ينام الذين ينامون، وفي الليل يسكر الذين يسكرون"], [8, "وأما نحن، أهل النهار، فلنظل صاحين، متخذين من الإيمان والمحبة درعا لصدورنا، ومن الرجاء بالخلاص خوذة لرؤوسنا."]]}, {"l": "1Jo 2:9-11", "n": "", "vs": [[9, "من ادعى أنه يحيا في النور، ولكنه يبغض أحد إخوته، فهو مازال حتى الآن في الظلام."], [10, "فالذي يحب إخوته، هو الذي يحيا في النور فعلا ولا شيء يسقطه."], [11, "أما الذي يبغض أحد إخوته، فهو تائه في الظلام، يتلمس طريقه ولا يعرف أين يتجه، لأن الظلام قد أعمى عينيه!"]]}], "kwAr": "ولكنكم الآن نور في الرب", "noteAr": ""}, {"kw": "walk", "raw": "Eph_5:2; Isa_2:5; Luk_16:8; Joh_12:36; Gal_5:25; 1Pe_2:9-11; 1Jo_1:7", "note": "", "refs": [{"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "Isa 2:5", "n": "", "vs": [[5, "يابيت يعقوب، هيا لنسلك في نور الرب."]]}, {"l": "Luk 16:8", "n": "", "vs": [[8, "فامتدح السيد وكيله الخائن لأنه تصرف بحكمة. فإن أبناء هذا العالم أحكم مع أهل جيلهم من أبناء النور."]]}, {"l": "Joh 12:36", "n": "", "vs": [[36, "آمنوا بالنور مادام النور معكم، فتصيروا أبناء النور»."]]}, {"l": "Gal 5:25", "n": "", "vs": [[25, "إذا كنا نحيا بالروح، فلنسلك أيضا بالروح."]]}, {"l": "1Pe 2:9-11", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"], [10, "فإنكم في الماضي لم تكونوا شعبا؛ أما الآن، فأنتم «شعب الله وقد كنتم سابقا لا تتمتعون برحمة الله، أما الآن، فإنكم تتمتعون بها!»"], [11, "أيها الأحباء، ما أنتم إلا غرباء تزورون الأرض زيارة عابرة. لذلك أطلب إليكم أن تبتعدوا عن الشهوات الجسدية التي تصارع النفس."]]}, {"l": "1Jo 1:7", "n": "", "vs": [[7, "ولكن، إن كنا فعلا نعيش في النور، كما هو في النور، تكون لنا حقا شركة بعضنا مع بعض، ودم ابنه يسوع يطهرنا من كل خطيئة."]]}], "kwAr": "فاسلكوا سلوك أولاد النور", "noteAr": ""}], "arS": [["فقد كنتم في ", []], ["الماضي", ["G4218"]], [" ", []], ["ظلاما", ["G4655"]], ["، ولكنكم ", []], ["الآن", ["G3568"]], [" ", []], ["نور", ["G5457"]], [" في ", []], ["الرب", ["G2962"]], [". ", []], ["فاسلكوا", ["G4043"]], [" سلوك ", []], ["أولاد", ["G5043"]], [" ", []], ["النور", ["G5457"]], [".", []]]}, {"c": 5, "v": 9, "text": "فإن ثمر النور يكون في كل صلاح واستقامة وحق.", "groups": [{"kw": "the fruit", "raw": "Gal_5:22, Gal_5:23", "note": "", "refs": [{"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Gal 5:23", "n": "", "vs": [[23, "والوداعة وضبط النفس. وليس من قانون يمنع مثل هذه الفضائل."]]}], "kwAr": "ثمر النور", "noteAr": ""}, {"kw": "goodness", "raw": "Psa_16:2, Psa_16:3; Rom_2:4, Rom_15:14; 1Pe_2:25; 3Jo_1:11", "note": "", "refs": [{"l": "Psa 16:2", "n": "", "vs": [[2, "قلت للرب: أنت سيدي، ولا خير لي بمعزل عنك."]]}, {"l": "Psa 16:3", "n": "", "vs": [[3, "كل بهجتي في قديسي الأرض وأفاضلها."]]}, {"l": "Rom 2:4", "n": "", "vs": [[4, "أم أنك تحتقر غنى لطفه وصبره وطول أناته وأنت لا تعرف أن لطف الله يدفعك إلى التوبة؟"]]}, {"l": "Rom 15:14", "n": "", "vs": [[14, "وأنا نفسي أيضا على يقين من جهتكم أيها الإخوة بأنكم مشحونون صلاحا، وممتلئون بكل معرفة، وقادرون أيضا على نصح بعضكم بعضا."]]}, {"l": "1Pe 2:25", "n": "", "vs": [[25, "فقد كنتم ضالين كخراف ضائعة، ولكنكم قد رجعتم الآن إلى راعي نفوسكم وحارسها!"]]}, {"l": "3Jo 1:11", "n": "", "vs": [[11, "أيها الحبيب، لا تقتد بما هو شر، بل بما هو خير. فإن من يفعل الخير، يكون من الله. ومن يفعل الشر، يبين أنه لم يتعرف بالله قط."]]}], "kwAr": "في كل صلاح", "noteAr": ""}, {"kw": "righteousness", "raw": "Phi_1:11; 1Ti_6:11; Heb_1:8, Heb_11:33; 1Pe_2:24; 1Jo_2:29, 1Jo_3:9, 1Jo_3:10", "note": "", "refs": [{"l": "Phi 1:11", "n": "", "vs": [[11, "كاملين في ثمار البر الآتية بيسوع المسيح، لمجد الله وحمده."]]}, {"l": "1Ti 6:11", "n": "", "vs": [[11, "وأما أنت، ياإنسان الله، فاهرب من هذه الأمور، واسع في إثر البر والتقوى والإيمان والمحبة والصبر والوداعة."]]}, {"l": "Heb 1:8", "n": "", "vs": [[8, "ولكنه يخاطب الابن قائلا: «إن عرشك، ياالله، ثابت إلى أبد الآبدين، وصولجان حكمك عادل ومستقيم."]]}, {"l": "Heb 11:33", "n": "", "vs": [[33, "فبالإيمان، تغلب هؤلاء على ممالك الأعداء، وحكموا حكما عادلا ونالوا ما وعدهم به الله . وبه، أطبقوا أفواه الأسود،"]]}, {"l": "1Pe 2:24", "n": "", "vs": [[24, "وهو نفسه حمل خطايانا في جسده (عندما مات مصلوبا) على الخشبة، لكي نموت بالنسبة للخطايا فنحيا حياة البر. وبجراحه هو تم لكم الشفاء،"]]}, {"l": "1Jo 2:29", "n": "", "vs": [[29, "وما دمتم تعلمون أن الله بار، فاعلموا أن كل من يفعل الصلاح، يظهر أنه مولود من الله حقا."]]}, {"l": "1Jo 3:9", "n": "", "vs": [[9, "فكل مولود من الله، لا يمارس الخطيئة، لأن طبيعة الله صارت ثابتة فيه. بل إنه لا يستطيع أن يمارس الخطيئة، لأنه مولود من الله."]]}, {"l": "1Jo 3:10", "n": "", "vs": [[10, "إذن، هذا هو المقياس الذي نميز به بين أولاد الله وأولاد إبليس. من لا يمارس الصلاح، فهو ليس من الله. وكذلك من لا يحب أخاه!"]]}], "kwAr": "واستقامة", "noteAr": ""}, {"kw": "truth", "raw": "Eph_4:15, Eph_4:25, Eph_6:14; Joh_1:47", "note": "", "refs": [{"l": "Eph 4:15", "n": "", "vs": [[15, "بل نتمسك بالحق في المحبة، فننمو في كل شيء نحو من هو الرأس، أي المسيح."]]}, {"l": "Eph 4:25", "n": "", "vs": [[25, "لذلك اخلعوا عنكم الكذب، وتكلموا بالصدق كل واحد مع قريبه، لأننا أعضاء بعضنا لبعض."]]}, {"l": "Eph 6:14", "n": "", "vs": [[14, "فاصمدوا إذن بعد أن تتخذوا الحق حزاما لأوساطكم، والبر درعا لصدوركم،"]]}, {"l": "Joh 1:47", "n": "", "vs": [[47, "ورأى يسوع نثنائيل قادما نحوه فقال عنه: «هذا إسرائيلي أصيل لا شك فيه!»"]]}], "kwAr": "وحق", "noteAr": ""}], "arS": [["فإن ", []], ["ثمر", ["G2590"]], [" النور يكون في ", []], ["كل", ["G3956"]], [" ", []], ["صلاح", ["G19"]], [" ", []], ["واستقامة", ["G1343"]], [" ", []], ["وحق", ["G225"]], [".", []]]}, {"c": 5, "v": 10, "text": "هكذا تختبرون الأمور التي ترضي الرب.", "groups": [{"kw": "Proving", "raw": "1Sa_17:39; Rom_12:1, Rom_12:2; Phi_1:10; 1Th_5:21", "note": "", "refs": [{"l": "1Sa 17:39", "n": "", "vs": [[39, "وتقلد داود سيف شاول، وهم أن يمشي، وإذ لم يكن قد تعود عليها من قبل قال لشاول: «لا أقدر أن أمشي بعدة الحرب هذه، لأنني لست معتادا عليها». وخلعها عنه."]]}, {"l": "Rom 12:1", "n": "", "vs": [[1, "لذلك أتوسل إليكم أيها الإخوة، نظرا لمراحم الله، أن تقدموا له أجسادكم ذبيحة مقدسة مقبولة عنده، وهي عبادتكم بعقل."]]}, {"l": "Rom 12:2", "n": "", "vs": [[2, "ولا تتكيفوا مع هذا العالم، بل تغيروا بتجديد الذهن، لتميزوا ما هي إرادة الله الصالحة المقبولة الكاملة."]]}, {"l": "Phi 1:10", "n": "", "vs": [[10, "لكي تستحسنوا الأمور الممتازة، حتى تكونوا طاهرين وخالين من العثرات إلى يوم المسيح،"]]}, {"l": "1Th 5:21", "n": "", "vs": [[21, "امتحنوا كل شيء وتمسكوا بالحسن."]]}], "kwAr": "هكذا تختبرون", "noteAr": ""}, {"kw": "acceptable", "raw": "Psa_19:14; Pro_21:3; Isa_58:5; Jer_6:20; Rom_14:18; Phi_4:18; 1Ti_2:3; 1Ti_5:4; Heb_12:28; 1Pe_2:5, 1Pe_2:20", "note": "", "refs": [{"l": "Psa 19:14", "n": "", "vs": [[14, "لتكن أقوال فمي وخواطر قلبي مقبولة لديك يارب، ياصخرتي وفادي."]]}, {"l": "Pro 21:3", "n": "", "vs": [[3, "إجراء العدل والحق أكثر قبولا عند الرب من الذبيحة."]]}, {"l": "Isa 58:5", "n": "", "vs": [[5, "أيكون الصوم الذي أختاره في إذلال المرء نفسه يوما، أو في إحناء رأسه كالقصبة، أو افتراش المسح والرماد؟ أتدعو هذا صوما مقبولا لدى الرب؟"]]}, {"l": "Jer 6:20", "n": "", "vs": [[20, "لأي غرض يصعد إلي البخور من شبا، وقصب الذريرة من أرض نائية؟ محرقاتكم مرفوضة، وتقدماتكم لا تسرني»."]]}, {"l": "Rom 14:18", "n": "", "vs": [[18, "فمن خدم المسيح هكذا، كان مقبولا عند الله وممدوحا عند الناس."]]}, {"l": "Phi 4:18", "n": "", "vs": [[18, "فالآن عندي كل ما يسد حاجتي ويزيد عنها. أنا في بحبوحة إذ تسلمت من أبفروديتس ما بعثتم به إلي، عطرا طيب الرائحة، ذبيحة يقبلها الله ويسر بها."]]}, {"l": "1Ti 2:3", "n": "", "vs": [[3, "فإن هذا الأمر جيد ومقبول في نظر الله مخلصنا،"]]}, {"l": "1Ti 5:4", "n": "", "vs": [[4, "فإن كان للأرملة أولاد أو حفدة، فمن أول واجبات هؤلاء أن يتعلموا توقير أهلهم وأن يفوا حق والديهم. فإن هذا العمل مقبول في نظر الله."]]}, {"l": "Heb 12:28", "n": "", "vs": [[28, "فبما أننا قد حصلنا على مملكة ثابتة لا تتزلزل، لنعبد الله ونخدمه شاكرين، بصورة ترضيه، بكل احترام ومخافة،"]]}, {"l": "1Pe 2:5", "n": "", "vs": [[5, "إذن اتحدوا به كحجارة حية، مبنيين بيتا روحيا، تكونون فيه كهنة مقدسين تقدمون لله ذبائح روحية مقبولة لديه بفضل يسوع المسيح."]]}, {"l": "1Pe 2:20", "n": "", "vs": [[20, "فبالحقيقة، أي مجد لكم إن كنتم تصبرون وأنتم تتحملون قصاص أخطائكم؟ لا فضل لكم عند الله إلا إذا تحملتم الآلام صابرين، وأنتم تفعلون الصواب."]]}], "kwAr": "الأمور التي ترضي الرب", "noteAr": ""}], "arS": [["هكذا ", []], ["تختبرون", ["G1381"]], [" الأمور التي ", []], ["ترضي", ["G2101"]], [" ", []], ["الرب", ["G2962"]], [".", []]]}, {"c": 5, "v": 11, "text": "وعليكم ألا تكتفوا بعدم الاشتراك في أعمال الظلام العقيمة، بل بالأحرى أن تفضحوها أيضا.", "groups": [{"kw": "no", "raw": "Eph_5:7; Gen_49:5-7; Psa_1:1, Psa_1:2, Psa_26:4, Psa_26:5, Psa_94:20,Psa_94:21; Pro_4:14, Pro_4:15, Pro_9:6; Jer_15:17; Rom_16:17; 1Co_5:9-11, 1Co_10:20,1Co_10:21; 2Co_6:14-18; 2Th_3:6, 2Th_3:14; 1Ti_6:5; 2Ti_3:5; 2Jo_1:10,2Jo_1:11; Rev_18:4", "note": "", "refs": [{"l": "Eph 5:7", "n": "", "vs": [[7, "إذن، لا تكونوا شركاء لهم:"]]}, {"l": "Gen 49:5-7", "n": "", "vs": [[5, "شمعون ولاوي أخوان سيوفهما آلات ظلم."], [6, "فيانفسي لا تدخلي في مجلسهما، وياروحي لا تنضمي إلى مجمعهما."], [7, "لأنهما في غضبهما اغتالا إنسانا، وفي عبثهما عرقبا ثورا. ملعون سخطهما لأنه عنيف وغضبهما لأنه ضار. أفرقهما في يعقوب وأشتتهما في إسرائيل."]]}, {"l": "Psa 1:1", "n": "", "vs": [[1, "طوبى للإنسان الذي لا يتبع مشورة الأشرار، ولا يقف في طريق الخاطئين، ولا يجالس المستهزئين."]]}, {"l": "Psa 1:2", "n": "", "vs": [[2, "بل في شريعة الرب بهجته، يتأمل فيها نهارا وليلاَ."]]}, {"l": "Psa 26:4", "n": "", "vs": [[4, "لم أجالس أهل الباطل ومع المنافقين لا أشترك."]]}, {"l": "Psa 26:5", "n": "", "vs": [[5, "بل أبغضت معشر فاعلي الإثم، ولم أجلس مع الأشرار."]]}, {"l": "Psa 94:20", "n": "", "vs": [[20, "أيحالفك ملك الشر المختلق إثما ليجعل الظلم شريعة للقضاء؟"]]}, {"l": "Psa 94:21", "n": "", "vs": [[21, "يجتمعون معا للقضاء على حياة الصديق، ويحكمون على البريء بالموت."]]}, {"l": "Pro 4:14", "n": "", "vs": [[14, "لا تدخل في سبيل الأشرار ولا تنهج نهجهم."]]}, {"l": "Pro 4:15", "n": "", "vs": [[15, "ابتعد عنه ولا تعبر به. حد عنه ولا تجتز فيه."]]}, {"l": "Pro 9:6", "n": "", "vs": [[6, "انبذوا الجهالة فتحيوا، واسلكوا سبيل الفهم»."]]}, {"l": "Jer 15:17", "n": "", "vs": [[17, "لم أجلس في مجالس العابثين، ولم أشترك في لهوهم. اعتزلت وحدي لأن يدك كانت علي، وقد ملأتني سخطا."]]}, {"l": "Rom 16:17", "n": "", "vs": [[17, "ولكن، أتوسل إليكم، أيها الإخوة، أن تنتبهوا إلى مثيري الانقسامات والعثرات، خلافا للتعليم الذي تعلمتم، وأن تبتعدوا عنهم."]]}, {"l": "1Co 5:9-11", "n": "", "vs": [[9, "كتبت إليكم في رسالتي أن لا تعاشروا الزناة."], [10, "فلا أعني زناة هذا العالم أو الطماعين أو السراقين أو عابدي الأصنام على وجه الإطلاق، وإلا كنتم مضطرين إلى الخروج من المجتمع البشري!"], [11, "أما الآن فقد كتبت إليكم بأن لا تعاشروا من يسمى أخا إن كان زانيا أو طماعا أو عابد أصنام أو شتاما أو سكيرا أو سراقا. فمثل هذا لا تعاشروه ولا تجلسوا معه لتناول الطعام."]]}, {"l": "1Co 10:20", "n": "", "vs": [[20, "لا، بل أن ما يذبحه الوثنيون فإنما يذبحونه للشياطين وليس لله. وإني لا أريد لكم أن تكونوا مشتركين مع الشياطين."]]}, {"l": "1Co 10:21", "n": "", "vs": [[21, "فلا تستطيعون أن تشربوا كأس الرب وكأس الشياطين معا، ولا أن تشتركوا في مائدة الرب ومائدة الشياطين معا،"]]}, {"l": "2Co 6:14-18", "n": "", "vs": [[14, "لا تدخلوا مع غير المؤمنين تحت نير واحد. فأي ارتباط بين البر والإثم؟ وأية شركة بين النور والظلام؟"], [15, "وأي تحالف للمسيح مع إبليس؟ وأي نصيب للمؤمن مع غير المؤمن؟"], [16, "وأي وفاق لهيكل الله مع الأصنام؟ فإننا نحن هيكل الله الحي، وفقا لما قاله الله : «سأسكن في وسطهم، وأسير بينهم، وأكون إلههم وهم يكونون شعبا لي…"], [17, "لذلك اخرجوا من وسطهم، وكونوا منفصلين، يقول الرب، ولا تلمسوا ما هو نجس،"], [18, "فأقبلكم، وأكون لكم أبا، وتكونوا لي بنين وبنات»، هذا يقوله الرب القادر على كل شيء."]]}, {"l": "2Th 3:6", "n": "", "vs": [[6, "ثم نوصيكم، أيها الإخوة، باسم ربنا يسوع المسيح، أن تعتزلوا عن كل أخ يسلك سلوكا فوضويا، لا يوافق التعليم الذي تلقيتم منا."]]}, {"l": "2Th 3:14", "n": "", "vs": [[14, "وإن كان أحد لا يطيع كلمتنا في هذه الرسالة، فميزوه ولا تتعاملوا معه، لتدفعوه إلى الخجل."]]}, {"l": "1Ti 6:5", "n": "", "vs": [[5, "وشتى أنواع النزاع بين أناس فاسدي العقول مجردين من الحق، يعتبرون التقوى تجارة."]]}, {"l": "2Ti 3:5", "n": "", "vs": [[5, "لهم من التقوى مظهرها ولكنهم لقوتها منكرون، فعن هؤلاء الناس ابتعد!"]]}, {"l": "2Jo 1:10", "n": "", "vs": [[10, "إن جاءكم أحد بغير هذا التعليم، فلا تستقبلوه في بيتكم، ولا تبادلوه التحية."]]}, {"l": "2Jo 1:11", "n": "", "vs": [[11, "لأن من يسلم عليه، يشاركه في أعماله الشريرة."]]}, {"l": "Rev 18:4", "n": "", "vs": [[4, "ثم سمعت صوتا آخر ينادي من السماء: «اخرجوا منها ياشعبي، لئلا تشتركوا في خطاياها، فتصابوا ببلاياها،"]]}], "kwAr": "عدم الاشتراك", "noteAr": ""}, {"kw": "unfruitful", "raw": "Pro_1:31; Isa_3:10,Isa_3:11; Rom_6:21; Gal_6:8", "note": "", "refs": [{"l": "Pro 1:31", "n": "", "vs": [[31, "لذلك يأكلون ثمار أعمالهم المرة، ويشبعون من عواقب مؤامراتهم"]]}, {"l": "Isa 3:10", "n": "", "vs": [[10, "ولكن بشروا الصديقين بالخير لأنهم سيتمتعون بثواب أعمالهم"]]}, {"l": "Isa 3:11", "n": "", "vs": [[11, "أما الشرير فويل له وبئس المصير لأنه يجازى على ما جنته يداه"]]}, {"l": "Rom 6:21", "n": "", "vs": [[21, "ولكن أي ثمر أنتجتم حينذاك من الأمور التي تخجلون بها الآن، وما عاقبتها إلا الموت؟"]]}, {"l": "Gal 6:8", "n": "", "vs": [[8, "فإن من يزرع لجسده، فمن الجسد يحصد فسادا. ومن يزرع للروح، فمن الروح يحصد حياة أبدية. فلا نفشل في عمل الخير،"]]}], "kwAr": "العقيمة", "noteAr": ""}, {"kw": "works", "raw": "Eph_4:22; Job_24:13-17; Joh_3:19-21; Rom_1:22-32, Rom_13:12; 1Th_5:7", "note": "", "refs": [{"l": "Eph 4:22", "n": "", "vs": [[22, "وهو أن تخلعوا ما يتعلق بسيرتكم الماضية: الإنسان العتيق الذي يفسد نفسه بالشهوات الخداعة؛"]]}, {"l": "Job 24:13-17", "n": "", "vs": [[13, "هناك من كان بين المتمردين على النور، فلم يعرفوا طرقه، ولم يمكثوا في سبله."], [14, "عند مطلع النور ينهض القاتل ويهلك البائس والمحتاج، وفي الليل يغدو لصا."], [15, "ينتظر الزاني حلول العتمة فيتقنع قائلا: لن تبصرني عين."], [16, "ينقبون البيوت ليلا، وفي النهار يغلقون على أنفسهم فلا يعرفون النور،"], [17, "لأن الصباح عندهم كظل الموت، وأهوال الظلمة هي رفقتهم."]]}, {"l": "Joh 3:19-21", "n": "", "vs": [[19, "وهذا هو الحكم: إن النور قد جاء إلى العالم، ولكن الناس أحبوا الظلمة أكثر من النور، لأن أعمالهم كانت شريرة."], [20, "فكل من يعمل الشر يبغض النور، ولا يأتي إليه مخافة أن تفضح أعماله."], [21, "وأما الذي يسلك في الحق فيأتي إلى النور لتظهر أعماله ويتبين أنها عملت بقوة الله»."]]}, {"l": "Rom 1:22-32", "n": "", "vs": [[22, "وفيما يدعون أنهم حكماء، صاروا جهالا،"], [23, "واستبدلوا بمجد الله الخالد تماثيل لصور الإنسان الفاني والطيور وذوات الأربع والزواحف."], [24, "لذلك أسلمهم الله ، في شهوات قلوبهم، إلى النجاسة، ليهينوا أجسادهم فيما بينهم."], [25, "إذ قد استبدلوا بحق الله ما هو باطل، فاتقوا المخلوق وعبدوه بدل الخالق، المبارك إلى الأبد. آمين!"], [26, "لهذا السبب أسلمهم الله إلى الشهوات المخزية. فإن إناثهم تحولن عن استعمال أجسادهن بالطريقة الطبيعية إلى استعمالها بطريقة مخالفة للطبيعة."], [27, "وكذلك تحول الذكور أيضا عن استعمال الأنثى بالطريقة الطبيعية، والتهبوا شهوة بعضهم لبعض، مرتكبين الفحشاء ذكورا بذكور، فاستحقوا أن ينالوا في أنفسهم الجزاء العادل على ضلالهم."], [28, "وبما أنهم لم يتخيروا إبقاء الله ضمن معرفتهم، أسلمهم الله إلى ذهن عاطل عن التمييز دفعهم إلى ممارسة الأمور غير اللائقة."], [29, "إذ قد امتلأوا من كل إثم وشر وجشع وخبث، وشحنوا حسدا وقتلا وخصاما ومكرا وسوءا. وهم ثرثارون،"], [30, "مغتابون، كارهون لله، شتامون، متكبرون، متفاخرون، مخترعون للشرور، غير طائعين للوالدين."], [31, "لا فهم عندهم، ولا أمانة، ولا حنان، ولا رحمة."], [32, "إنهم يعلمون حكم الله العادل: أن الذين يفعلون هذه الأمور يستوجبون الموت؛ ومع ذلك، لا يمارسونها وحسب، بل يسرون بفاعليها."]]}, {"l": "Rom 13:12", "n": "", "vs": [[12, "كاد الليل أن ينتهي والنهار أن يطلع. فلنطرح أعمال الظلام، ونلبس سلاح النور"]]}, {"l": "1Th 5:7", "n": "", "vs": [[7, "فإنه في الليل ينام الذين ينامون، وفي الليل يسكر الذين يسكرون"]]}], "kwAr": "أعمال الظلام", "noteAr": ""}, {"kw": "but", "raw": "Gen_20:16; Lev_19:17; Psa_141:5; Pro_9:7, Pro_9:8, Pro_13:18, Pro_15:12, Pro_19:25, Pro_25:12; Pro_29:1; Isa_29:21; Mat_18:15; Luk_3:19; 1Ti_5:20; 2Ti_4:2; Tit_2:15", "note": "", "refs": [{"l": "Gen 20:16", "n": "", "vs": [[16, "وقال لسارة: «ها قد وهبت أخاك ألف قطعة من الفضة، تبرئة لك من كل إساءة أمام الذين معك، فأنت بريئة أمام كل واحد، وهكذا تكونين قد أنصفت»."]]}, {"l": "Lev 19:17", "n": "", "vs": [[17, "لا تبغض أخاك في قلبك، بل إنذارا تنذره لئلا تكون شريكا في ذنبه."]]}, {"l": "Psa 141:5", "n": "", "vs": [[5, "ليضربني الصديق فذلك رحمة، وليوبخني فذلك زيت عاطر لرأسي. أما الأشرار فإني أصلي دائما (كي تحفظني من أفعالهم الأثيمة)."]]}, {"l": "Pro 9:7", "n": "", "vs": [[7, "من يسع لتقويم الساخر يلحقه الهوان، ومن يوبخ الشرير يعده عيبه."]]}, {"l": "Pro 9:8", "n": "", "vs": [[8, "لا تقرع الساخر لئلا يبغضك، ووبخ الحكيم فيحبك."]]}, {"l": "Pro 13:18", "n": "", "vs": [[18, "من يرفض التأديب يحل به الفقر والذل، ومن يتجاوب مع التوبيخ يكرم."]]}, {"l": "Pro 15:12", "n": "", "vs": [[12, "المستهزيء يكره التوبيخ، ولا يلجأ إلى الحكماء."]]}, {"l": "Pro 19:25", "n": "", "vs": [[25, "اضرب المستهزيء فيتعقل الأحمق، ووبخ العاقل فيكتسب فهما."]]}, {"l": "Pro 25:12", "n": "", "vs": [[12, "الموبخ الحكيم لأذن صاغية مثل قرط من ذهب وحلي من إبريز."]]}, {"l": "Pro 29:1", "n": "", "vs": [[1, "من كثر توبيخه وظل معتصما بعناده، يتحطم فجأة ولا شفاء له."]]}, {"l": "Isa 29:21", "n": "", "vs": [[21, "الذين بكلمة جعلوا الإنسان يخطيء، ونصبوا فخا لمن يفحمهم في ساحة القضاء، وصدوا البار بادعاءاتهم الجوفاء."]]}, {"l": "Mat 18:15", "n": "", "vs": [[15, "إن أخطأ إليك أخوك، فاذهب إليه وعاتبه بينك وبينه على انفراد. فإذا سمع لك، تكون قد ربحت أخاك."]]}, {"l": "Luk 3:19", "n": "", "vs": [[19, "ولكن هيرودس حاكم الربع، إذ كان يوحنا قد وبخه بسبب هيروديا زوجة أخيه وبسبب جميع ما ارتكبه من الشرور،"]]}, {"l": "1Ti 5:20", "n": "", "vs": [[20, "فإذا ثبت أن المتهم مخطيء، وبخه أمام الجميع، ليكون عند الباقين خوف!"]]}, {"l": "2Ti 4:2", "n": "", "vs": [[2, "أن تنادي بالكلمة منشغلا بها كليا، في الفرص المناسبة وغير المناسبة على السواء، وأن توبخ وتنذر وتشجع بكل صبر في التعليم."]]}, {"l": "Tit 2:15", "n": "", "vs": [[15, "بهذه الأمور تكلم، وعظ، ووبخ بكل سلطان، ولا تدع أحدا يستخف بك!"]]}], "kwAr": "بل بالأحرى أن تفضحوها", "noteAr": ""}], "arS": [["وعليكم ألا تكتفوا بعدم ", []], ["الاشتراك", ["G4790"]], [" في ", []], ["أعمال", ["G2041"]], [" ", []], ["الظلام", ["G4655"]], [" ", []], ["العقيمة", ["G175"]], ["، بل ", []], ["بالأحرى", ["G3123"]], [" أن ", []], ["تفضحوها", ["G1651"]], [" أيضا.", []]]}, {"c": 5, "v": 12, "text": "فالأمور التي يفعلونها سرا، قبيح حتى ذكرها.", "groups": [{"kw": "it", "raw": "Eph_5:3; Rom_1:24-27; 1Pe_4:3", "note": "", "refs": [{"l": "Eph 5:3", "n": "", "vs": [[3, "أما الزنى، وكل نجاسة أو شهوة نهمة، فلا يذكر بينكم حتى اسمها، كما يليق بالقديسين."]]}, {"l": "Rom 1:24-27", "n": "", "vs": [[24, "لذلك أسلمهم الله ، في شهوات قلوبهم، إلى النجاسة، ليهينوا أجسادهم فيما بينهم."], [25, "إذ قد استبدلوا بحق الله ما هو باطل، فاتقوا المخلوق وعبدوه بدل الخالق، المبارك إلى الأبد. آمين!"], [26, "لهذا السبب أسلمهم الله إلى الشهوات المخزية. فإن إناثهم تحولن عن استعمال أجسادهن بالطريقة الطبيعية إلى استعمالها بطريقة مخالفة للطبيعة."], [27, "وكذلك تحول الذكور أيضا عن استعمال الأنثى بالطريقة الطبيعية، والتهبوا شهوة بعضهم لبعض، مرتكبين الفحشاء ذكورا بذكور، فاستحقوا أن ينالوا في أنفسهم الجزاء العادل على ضلالهم."]]}, {"l": "1Pe 4:3", "n": "", "vs": [[3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}], "kwAr": "قبيح حتى ذكرها", "noteAr": ""}, {"kw": "in", "raw": "2Sa_12:12; Pro_9:17; Ecc_12:14; Jer_23:24; Luk_12:1, Luk_12:2; Rom_2:16; Rev_20:12", "note": "", "refs": [{"l": "2Sa 12:12", "n": "", "vs": [[12, "أنت ارتكبت خطيئتك في السر، وأنا أفعل هذا الأمر على مرأى جميع بني إسرائيل وفي وضح النهار»."]]}, {"l": "Pro 9:17", "n": "", "vs": [[17, "«المياه المسروقة عذبة، والخبز المأكول خفية شهي»."]]}, {"l": "Ecc 12:14", "n": "", "vs": [[14, "لأن الله سيدين كل عمل مهما كان خفيا، سواء كان خيرا أم شرا."]]}, {"l": "Jer 23:24", "n": "", "vs": [[24, "أيمكن لأحد أن يتوارى في أماكن خفية فلا أراه؟ أما أملأ السماوات والأرض؟"]]}, {"l": "Luk 12:1", "n": "", "vs": [[1, "وفي تلك الأثناء، إذ احتشد عشرات الألوف من الشعب حتى داس بعضهم بعضا، أخذ يقول لتلاميذه أولا: «احذروا لأنفسكم من خمير الفريسيين الذي هو الريا ء!"]]}, {"l": "Luk 12:2", "n": "", "vs": [[2, "فما من مستور لن يكشف، ولا من سر لن يعرف."]]}, {"l": "Rom 2:16", "n": "", "vs": [[16, "(وتكون الدينونة) يوم يدين الله خفايا الناس، وفقا لإنجيلي، على يد يسوع المسيح."]]}, {"l": "Rev 20:12", "n": "", "vs": [[12, "ورأيت الأموات، كبارا وصغارا، واقفين قدام العرش. وفتحت الكتب، ثم فتح كتاب آخر هو سجل الحياة، ودين الأموات بحسب ما هو مدون في تلك الكتب، كل واحد حسب أعماله."]]}], "kwAr": "سرا", "noteAr": ""}], "arS": [["فالأمور التي ", []], ["يفعلونها", ["G1096"]], [" ", []], ["سرا", ["G2931"]], ["، ", []], ["قبيح", ["G149"]], [" حتى ", []], ["ذكرها", ["G3004"]], [".", []]]}, {"c": 5, "v": 13, "text": "إلا أن كل شيء، إذا ما فضح النور أمره، يصير مكشوفا:", "groups": [{"kw": "reproved", "raw": "or, discovered, Lam_2:14; Hos_2:10, Hos_7:1", "note": "or, discovered, Lam_2:14; Hos_2:10, Hos_7:1", "refs": [{"l": "Lam 2:14", "n": "", "vs": [[14, "رأى لك أنبياؤك رؤى باطلة خادعة. لم يفضحوا إثمك ليردوا سبيك. إنما رأوا لك وحيا كاذبا مضلا."]]}, {"l": "Hos 2:10", "n": "", "vs": [[10, "وأكشف عورتها أمام عشاقها، ولا ينقذها أحد من يدي."]]}, {"l": "Hos 7:1", "n": "", "vs": [[1, "حين كنت أشفي إسرائيل، تكشفت خطيئة أفرايم، واستعلنت آثام السامرة، فقد مارسوا النفاق واقتحم اللصوص البيوت، وسلب قطاع الطرق في الخارج."]]}], "kwAr": "إذا ما فضح النور أمره", "noteAr": "أو: مكشوفة (مفضوحة)."}, {"kw": "for", "raw": "Mic_7:9; Joh_3:20,Joh_3:21; 1Co_4:5; Heb_1:13", "note": "", "refs": [{"l": "Mic 7:9", "n": "", "vs": [[9, "إني أخطأت إلى الرب لذلك أتحمل غضبه، إلى أن يدافع عني ويثبت استقامتي، فيخرجني إلى النور لأشاهد عدله."]]}, {"l": "Joh 3:20", "n": "", "vs": [[20, "فكل من يعمل الشر يبغض النور، ولا يأتي إليه مخافة أن تفضح أعماله."]]}, {"l": "Joh 3:21", "n": "", "vs": [[21, "وأما الذي يسلك في الحق فيأتي إلى النور لتظهر أعماله ويتبين أنها عملت بقوة الله»."]]}, {"l": "1Co 4:5", "n": "", "vs": [[5, "إذن، لا تحكموا في شيء قبل الأوان، ريثما يرجع الرب الذي سيسلط النور على الأشياء التي يحجبها الظلام الآن، ويكشف نيات القلوب، عندئذ ينال كل واحد حقه من المدح من عند الله!"]]}, {"l": "Heb 1:13", "n": "", "vs": [[13, "فهل قال الله مرة لأي واحد من الملائكة ما قاله للابن: «اجلس عن يميني حتى أجعل أعداءك موطئا لقدميك؟»"]]}], "kwAr": "لأن الذي يكشف كل شيء هو النور", "noteAr": ""}], "arS": [["إلا أن ", []], ["كل شيء", ["G3956"]], ["، إذا ما ", []], ["فضح", ["G1651"]], [" ", []], ["النور", ["G5457"]], [" أمره، يصير ", []], ["مكشوفا", ["G5319"]], [":", []]]}, {"c": 5, "v": 14, "text": "لأن الذي يكشف كل شيء هو النور. لذلك يقال: «استيقظ أيها النائم، وقم من بين الأموات، فيشرق عليك نور المسيح!»", "groups": [{"kw": "he", "raw": "or, it", "note": "or, it", "refs": [], "kwAr": "لذلك يقال", "noteAr": "أو: هو (الكتاب، يقول)."}, {"kw": "Awake", "raw": "Isa_51:17, Isa_52:1, Isa_60:1; Rom_13:11, Rom_13:12; 1Co_15:34; 1Th_5:6; 2Ti_2:26 *marg.", "note": "", "refs": [{"l": "Isa 51:17", "n": "", "vs": [[17, "استيقظي، استيقظي، انهضي ياأورشليم، يامن تجرعت من يد الرب كأس غضبه، يامن شربت ثمالة كأس الترنح."]]}, {"l": "Isa 52:1", "n": "", "vs": [[1, "استيقظي، استيقظي تسربلي بقوتك ياصهيون، ارتدي ثياب بهائك ياأورشليم، المدينة المقدسة، إذ لن يدخلك بعد اليوم أغلف ولا نجس."]]}, {"l": "Isa 60:1", "n": "", "vs": [[1, "قومي استضيئي، فإن نورك قد جاء، ومجد الرب أشرق عليك."]]}, {"l": "Rom 13:11", "n": "", "vs": [[11, "وفوق هذا، فأنتم تعرفون الوقت، وأنها الآن الساعة التي يجب أن نستيقظ فيها من النوم. فخلاصنا الآن، أقرب إلينا مما كان يوم آمنا:"]]}, {"l": "Rom 13:12", "n": "", "vs": [[12, "كاد الليل أن ينتهي والنهار أن يطلع. فلنطرح أعمال الظلام، ونلبس سلاح النور"]]}, {"l": "1Co 15:34", "n": "", "vs": [[34, "عودوا إلى الصواب كما يجب ولا تخطئوا، فإن بعضا منكم يجهلون الله تماما أقول هذا لكي تخجلوا!"]]}, {"l": "1Th 5:6", "n": "", "vs": [[6, "إذن، لا ننم كما ينام الآخرون، بل لنظل ساهرين وصاحين،"]]}, {"l": "2Ti 2:26", "n": "*marg.", "vs": [[26, "فيعودوا إلى الصواب ناجين من فخ إبليس الذي أطبق عليهم، ليعملوا إرادته."]]}], "kwAr": "استيقظ أيها النائم", "noteAr": ""}, {"kw": "arise", "raw": "Eph_2:5; Isa_26:19; Eze_37:4-10; Joh_5:25-29, Joh_11:43, Joh_11:44; Rom_6:4, Rom_6:5, Rom_6:13; Col_3:1", "note": "", "refs": [{"l": "Eph 2:5", "n": "", "vs": [[5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"]]}, {"l": "Isa 26:19", "n": "", "vs": [[19, "ولكن أمواتك يحيون، وتقوم أجسادهم فيا سكان التراب استيقظوا واشدوا بفرح لأن طلك هو ندى متلأليء، جعلته يهطل على أرض الأشباح."]]}, {"l": "Eze 37:4-10", "n": "", "vs": [[4, "فقال لي: «تنبأ على هذه العظام وقل لها: اسمعي أيتها العظام اليابسة كلمة الرب:"], [5, "ها أنا أجعل روحا يدخل فيك فتحيين."], [6, "وأكسوك بالعصب واللحم، وأبسط عليك جلدا وأجعل فيك روحا فتحيين وتدركين أني أنا الرب»."], [7, "وفيما كنت أتنبأ كما أمرت، حدث صوت جلبة وزلزلة، فتقاربت العظام كل عظم إلى عظمه،"], [8, "واكتست بالعصب واللحم وبسط عليها الجلد. إنما لم يكن فيها روح"], [9, "فقال لي: «تنبأ للروح ياابن آدم، وقل: هذا ما يأمر به السيد الرب: هيا ياروح أقبل من الرياح الأربع وهب على هؤلاء القتلى ليحيوا»."], [10, "فتنبأت كما أمرني الرب، فدخل فيهم الروح فدبت فيهم الحياة، وانتصبوا على أقدامهم جيشا عظيما جدا جدا."]]}, {"l": "Joh 5:25-29", "n": "", "vs": [[25, "الحق الحق أقول لكم: إن الساعة التي يسمع فيها الأموات صوت ابن الله ستأتي بل هي الآن والذين يسمعونه يحيون."], [26, "لأنه كما أن للآب حياة في ذاته، فقد أعطى الابن أيضا أن تكون له حياة في ذاته،"], [27, "وأعطاه سلطة أن يدين، لأنه ابن الإنسان."], [28, "لا تتعجبوا من هذا: فسوف تأتي ساعة يسمع فيها جميع من في القبور صوته،"], [29, "فيخرجون منها: فالذين عملوا الصالحات يخرجون في القيامة المؤدية إلى الحياة، وأما الذين عملوا السيئات ففي القيامة المؤدية إلى الدينونة."]]}, {"l": "Joh 11:43", "n": "", "vs": [[43, "ثم نادى بصوت عال: «لعازر اخرج!»"]]}, {"l": "Joh 11:44", "n": "", "vs": [[44, "فخرج الميت والأكفان تشد يديه ورجليه، والمنديل يلف رأسه. فقال يسوع لمن حوله: «حلوه ودعوه يذهب!»"]]}, {"l": "Rom 6:4", "n": "", "vs": [[4, "وبسبب ذلك دفنا معه بالمعمودية للموت، حتى كما أقيم المسيح من الأموات بمجد الآب، كذلك نسلك نحن أيضا في حياة جديدة."]]}, {"l": "Rom 6:5", "n": "", "vs": [[5, "فما دمنا قد اتحدنا به في ما يشبه موته، فإننا سنتحد به أيضا في قيامته."]]}, {"l": "Rom 6:13", "n": "", "vs": [[13, "ولا تقدموا أعضاءكم للخطيئة أسلحة للإثم، بل قدموا أنفسكم لله باعتباركم أقمتم من بين الأموات أحياء، وأعضاءكم لله أسلحة للبر."]]}, {"l": "Col 3:1", "n": "", "vs": [[1, "فبما أنكم قد قمتم مع المسيح، فاسعوا إلى الأمور التي في العلى، حيث المسيح جالس عن يمين الله."]]}], "kwAr": "وقم من بين الأموات", "noteAr": ""}, {"kw": "Christ", "raw": "Joh_8:12, Joh_9:5; Act_13:47; 2Co_4:6; 2Ti_1:10", "note": "", "refs": [{"l": "Joh 8:12", "n": "", "vs": [[12, "وخاطبهم يسوع أيضا فقال: «أنا نور العالم. من يتبعني فلا يتخبط في الظلام بل يكون له نور الحياة»."]]}, {"l": "Joh 9:5", "n": "", "vs": [[5, "وما دمت في العالم، فأنا نور العالم»."]]}, {"l": "Act 13:47", "n": "", "vs": [[47, "فقد أوصانا الرب قائلا: قد جعلتك نورا للأمم، لتكون سبيل خلاص إلى أقصى الأرض!»"]]}, {"l": "2Co 4:6", "n": "", "vs": [[6, "فإن الله ، الذي أمر أن يشرق نور من الظلام، هو الذي جعل النور يشرق في قلوبنا، لإشعاع معرفة مجد الله المتجلي في وجه المسيح."]]}, {"l": "2Ti 1:10", "n": "", "vs": [[10, "والتي أعلنت الآن بظهور مخلصنا يسوع المسيح الذي سحق الموت وأنار الحياة والخلود بالإنجيل"]]}], "kwAr": "فيشرق عليك نور المسيح", "noteAr": ""}], "arS": [["لأن الذي ", []], ["يكشف", ["G5319"]], [" كل شيء هو ", []], ["النور", ["G5457"]], [". لذلك ", []], ["يقال", ["G3004"]], [": «", []], ["استيقظ", ["G1453"]], [" أيها ", []], ["النائم", ["G2518"]], ["، ", []], ["وقم", ["G450"]], [" من بين ", []], ["الأموات", ["G3498"]], ["، ", []], ["فيشرق عليك", ["G2017"]], [" نور ", []], ["المسيح", ["G5547"]], ["!»", []]]}, {"c": 5, "v": 15, "text": "فانتبهوا تماما إذن كيف تسلكون بتدقيق، لا سلوك الجهلاء بل سلوك العقلاء،", "groups": [{"kw": "See", "raw": "Eph_5:33; Mat_8:4, Mat_27:4, Mat_27:24; 1Th_5:15; Heb_12:25; 1Pe_1:22; Rev_19:10", "note": "", "refs": [{"l": "Eph 5:33", "n": "", "vs": [[33, "إنما أنتم أيضا، كل بمفرده، ليحب كل واحد منكم زوجته كنفسه. وأما الزوجة، فعليها أن تهاب زوجها."]]}, {"l": "Mat 8:4", "n": "", "vs": [[4, "وقال له يسوع: «انتبه! لا تخبر أحدا، بل اذهب واعرض نفسك على الكاهن، وقدم القربان الذي أمر به موسى، فيكون ذلك شهادة لهم! »"]]}, {"l": "Mat 27:4", "n": "", "vs": [[4, "وقال: «قد أخطأت إذ سلمتكم دما بريئا». فأجابوه: «ليس هذا شأننا نحن، بل هو شأنك أنت!»"]]}, {"l": "Mat 27:24", "n": "", "vs": [[24, "فلما رأى بيلاطس أنه لا فائدة، وأن فتنة تكاد تنشب بالأحرى، أخذ ماء وغسل يديه أمام الجمع، وقال: «أنا بريء من دم هذا البار. فانظروا أنتم في الأمر!»"]]}, {"l": "1Th 5:15", "n": "", "vs": [[15, "حذار أن يبادل أحدكم شر غيره بشر مثله بل اسعوا دائما إلى الخير في معاملتكم بعضكم لبعض وللآخرين جميعا."]]}, {"l": "Heb 12:25", "n": "", "vs": [[25, "إذن حذار أن ترفضوا الذي يتكلم! فمادام أولئك الذين رفضوا الاستماع لمن كلمهم على هذه الأرض، لم يفلتوا (من العقاب) قط، فكم بالأحرى لا نفلت نحن أبدا إن تحولنا عن الذي يتكلم إلينا من السماء عينها!"]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}, {"l": "Rev 19:10", "n": "", "vs": [[10, "فجثوت عند قدميه لأسجد له، فقال لي: «لا تفعل! إني عبد لله، مثلك ومثل إخوتك المؤمنين الذين لديهم الشهادة المختصة بيسوع: لله اسجد! فإن الشهادة المختصة بيسوع هي روح النبوءة»."]]}], "kwAr": "فانتبهوا تماما", "noteAr": ""}, {"kw": "walk", "raw": "Exo_23:13; Mat_10:16; 1Co_14:20; Phi_1:27; Col_1:9, Col_4:5", "note": "", "refs": [{"l": "Exo 23:13", "n": "", "vs": [[13, "أطيعوا كل ما أوصيتكم به، ولا تذكروا اسم آلهة أخرى، ولا يتلفظ به فمك."]]}, {"l": "Mat 10:16", "n": "", "vs": [[16, "ها أنا أرسلكم مثل الخراف بين الذئاب، فكونوا متنبهين كالحيات ومسالمين كالحمام."]]}, {"l": "1Co 14:20", "n": "", "vs": [[20, "أيها الإخوة، لا تكونوا أولادا في التفكير، بل كونوا أطفالا في الشر. وأما في التفكير، فكونوا راشدين."]]}, {"l": "Phi 1:27", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"]]}, {"l": "Col 1:9", "n": "", "vs": [[9, "لذلك نحن أيضا، من اليوم الذي فيه سمعنا بأخباركم، مازلنا نصلي ونتضرع لأجلكم، لأن تمتلئوا من تمام المعرفة لمشيئة الله في كل حكمة وإدراك روحي،"]]}, {"l": "Col 4:5", "n": "", "vs": [[5, "تصرفوا بحكمة مع الذين هم من خارج الكنيسة، مستغلين الوقت أحسن استغلال."]]}], "kwAr": "كيف تسلكون بتدقيق", "noteAr": ""}, {"kw": "not", "raw": "2Sa_24:10; Job_2:10; Psa_73:22; Pro_14:8; Mat_25:2; Luk_24:25; Gal_3:1, Gal_3:3; 1Ti_6:9; Jam_3:13", "note": "", "refs": [{"l": "2Sa 24:10", "n": "", "vs": [[10, "وبعد أن تم إحصاء الشعب اعترى الندم قلب داود، فتضرع إلى الرب قائلا: «أخطأت جدا بما ارتكبته، فأرجوك يارب أن تزيل إثم عبدك لأنني تصرفت تصرفا أحمق»."]]}, {"l": "Job 2:10", "n": "", "vs": [[10, "فأجابها: «أنت تتكلمين كالجاهلات! أنقبل الخير من عند الله والشر لا نقبل؟». في هذا كله لم ترتكب شفتا أيوب خطأ في حق الله."]]}, {"l": "Psa 73:22", "n": "", "vs": [[22, "أدركت أنني كنت غبيا لا أعرف شيئا، إذ كنت كبهيمة أمامك."]]}, {"l": "Pro 14:8", "n": "", "vs": [[8, "حكمة العاقل في تبين حسن مسلكه، وغباوة الجهال في ارتكاب خدعهم."]]}, {"l": "Mat 25:2", "n": "", "vs": [[2, "وكانت خمس منهن حكيمات، وخمس جاهلات."]]}, {"l": "Luk 24:25", "n": "", "vs": [[25, "فقال لهما: «ياقليلي الفهم وبطيئي القلب في الإيمان بجميع ما تكلم به الأنبياء!"]]}, {"l": "Gal 3:1", "n": "", "vs": [[1, "ياأهل غلاطية الأغبياء! من سحر عقولكم، أنتم الذين قد رسم أمام أعينكم يسوع المسيح وهو مصلوب؟"]]}, {"l": "Gal 3:3", "n": "", "vs": [[3, "أإلى هذا الحد أنتم أغبياء؟ أبعدما ابتدأتم بالروح تكملون بالجسد؟"]]}, {"l": "1Ti 6:9", "n": "", "vs": [[9, "أما الذين يرغبون في أن يصيروا أغنياء، فيسقطون في التجربة والفخ ويتورطون في كثير من الشهوات السفيهة المضرة التي تغرق الناس في الدمار والهلاك."]]}, {"l": "Jam 3:13", "n": "", "vs": [[13, "أبينكم بعض الحكماء والفهماء؟ إذن، على هؤلاء أن يسلكوا سلوكا حسنا، مظهرين بأعمالهم تلك الوداعة التي تتصف بها الحكمة (الحقيقية)."]]}], "kwAr": "لا سلوك الجهلاء", "noteAr": ""}], "arS": [["فانتبهوا", ["G991"]], [" تماما إذن ", []], ["كيف", ["G4459"]], [" ", []], ["تسلكون", ["G4043"]], [" ", []], ["بتدقيق", ["G199"]], ["، لا سلوك ", []], ["الجهلاء", ["G781"]], [" بل سلوك ", []], ["العقلاء", ["G4680"]], ["،", []]]}, {"c": 5, "v": 16, "text": "مستغلين الوقت أحسن استغلال، لأن الأيام شريرة.", "groups": [{"kw": "Redeeming", "raw": "Ecc_9:10; Rom_13:11; Gal_6:10; Col_4:5", "note": "", "refs": [{"l": "Ecc 9:10", "n": "", "vs": [[10, "وكل ما تحصل عليه من عمل، فاعمله بكل قوتك، إذ لن تجد في الهاوية التي أنت ماض إليها أي عمل أو ابتكار أو معرفة أو حكمة."]]}, {"l": "Rom 13:11", "n": "", "vs": [[11, "وفوق هذا، فأنتم تعرفون الوقت، وأنها الآن الساعة التي يجب أن نستيقظ فيها من النوم. فخلاصنا الآن، أقرب إلينا مما كان يوم آمنا:"]]}, {"l": "Gal 6:10", "n": "", "vs": [[10, "فمادامت لنا الفرصة إذن، فلنعمل الخير للجميع، وخصوصا لأهل الإيمان."]]}, {"l": "Col 4:5", "n": "", "vs": [[5, "تصرفوا بحكمة مع الذين هم من خارج الكنيسة، مستغلين الوقت أحسن استغلال."]]}], "kwAr": "مستغلين الوقت", "noteAr": ""}, {"kw": "the days", "raw": "Eph_6:13, Eph_6:15; Psa_37:19; Ecc_11:2, Ecc_12:1; Amo_5:13; Joh_12:35; Act_11:28, Act_11:29; 1Co_7:26, 1Co_7:29-31", "note": "", "refs": [{"l": "Eph 6:13", "n": "", "vs": [[13, "لذلك اتخذوا سلاح الله الكامل، لتتمكنوا من المقاومة في يوم الشر، ومن الصمود أيضا بعد تحقيق كل هدف."]]}, {"l": "Eph 6:15", "n": "", "vs": [[15, "والاستعداد لنشر بشارة السلام حذاء لأقدامكم."]]}, {"l": "Psa 37:19", "n": "", "vs": [[19, "لا يخزون في زمان السوء، وفي أيام الجوع يشبعون."]]}, {"l": "Ecc 11:2", "n": "", "vs": [[2, "وزع أنصبة على سبعة بل على ثمانية، لأنك لا تدري أية بلية تحل على الأرض."]]}, {"l": "Ecc 12:1", "n": "", "vs": [[1, "فاذكر خالقك في أيام حداثتك قبل أن تقبل عليك أيام الشر، أو تغلب عليك السنون، حين تقول: ليس لي فيها لذة."]]}, {"l": "Amo 5:13", "n": "", "vs": [[13, "لهذا يصمت العاقل في مثل هذا الزمان الرديء."]]}, {"l": "Joh 12:35", "n": "", "vs": [[35, "فقال لهم يسوع: «النور باق معكم وقتا قصيرا. فواصلوا سيركم مادام النور يشرق عليكم، لئلا يطبق عليكم الظلام، فإن الذي يمشي في الظلام لا يعلم أين يذهب."]]}, {"l": "Act 11:28", "n": "", "vs": [[28, "وبينهم نبي اسمه أغابوس، تنبأ بوحي من الروح أن مجاعة عظيمة ستحدث في البلاد كلها. وقد وقعت هذه المجاعة فعلا في عهد القيصر كلوديوس."]]}, {"l": "Act 11:29", "n": "", "vs": [[29, "لذلك قرر التلاميذ في أنطاكية أن يتبرع كل منهم بما يتيسر له، ويرسلوا إعانة إلى الإخوة المقيمين في اليهودية."]]}, {"l": "1Co 7:26", "n": "", "vs": [[26, "فلسبب الشدة الحالية، أظن أنه يحسن بالإنسان أن يبقى على حاله."]]}, {"l": "1Co 7:29-31", "n": "", "vs": [[29, "فإني، أيها الإخوة، أقول لكم إن الوقت يتقاصر. ففي ما يخص المسائل الأخرى، ليكن الذين لهم زوجات كأنهم بلا زوجات،"], [30, "والذين يبكون كأنهم لا يبكون، والذين يفرحون كأنهم لا يفرحون، والذين يشترون كأنهم لا يملكون،"], [31, "والذين يستغلون هذا العالم كأنهم لا يستغلونه. ذلك لأن طراز هذا العالم زائل."]]}], "kwAr": "لأن الأيام شريرة", "noteAr": ""}], "arS": [["مستغلين", ["G1805"]], [" ", []], ["الوقت", ["G2540"]], [" أحسن استغلال، لأن ", []], ["الأيام", ["G2250"]], [" ", []], ["شريرة", ["G4190"]], [".", []]]}, {"c": 5, "v": 17, "text": "لذلك لا تكونوا أغبياء، بل افهموا ما هي مشيئة الرب.", "groups": [{"kw": "be", "raw": "Eph_5:15; Col_4:5", "note": "", "refs": [{"l": "Eph 5:15", "n": "", "vs": [[15, "فانتبهوا تماما إذن كيف تسلكون بتدقيق، لا سلوك الجهلاء بل سلوك العقلاء،"]]}, {"l": "Col 4:5", "n": "", "vs": [[5, "تصرفوا بحكمة مع الذين هم من خارج الكنيسة، مستغلين الوقت أحسن استغلال."]]}], "kwAr": "لا تكونوا أغبياء", "noteAr": ""}, {"kw": "understanding", "raw": "Deu_4:6; 1Ki_3:9-12; Job_28:28; Psa_111:10, Psa_119:27; Pro_2:5, Pro_14:8, Pro_23:23; Jer_4:22; Joh_7:17; Rom_12:2; Col_1:9; 1Th_4:1-3, 1Th_5:18; 1Pe_4:2", "note": "", "refs": [{"l": "Deu 4:6", "n": "", "vs": [[6, "فاحفظوها وطبقوها، لأنها هي حكمتكم وفطنتكم لدى الشعوب الذين يسمعون عن هذه الشرائع، فيقولون: إن هذا الشعب العظيم هو حقا شعب حكيم فطن."]]}, {"l": "1Ki 3:9-12", "n": "", "vs": [[9, "فهب عبدك قلبا فهيما لأقضي بين شعبك، وأميز بين الخير والشر، لأنه من يستطيع أن يحكم شعبك العظيم هذا؟»"], [10, "فسر الرب بطلب سليمان هذا."], [11, "وقال له: «لأنك قد طلبت هذا الأمر، ولم تطلب حياة طويلة، ولا غنى، ولا انتقاما من أعدائك، بل سألت حكمة لتسوس شؤون الحكم،"], [12, "فإنني سألبي طلبك، فأهبك قلبا حكيما مميزا، فلا يضاهيك أحد من قبل ولا من بعد."]]}, {"l": "Job 28:28", "n": "", "vs": [[28, "ثم قال للإنسان: انظر، إن مخافة الرب هي الحكمة، وتفادي الشر هو الفطنة»."]]}, {"l": "Psa 111:10", "n": "", "vs": [[10, "رأس الحكمة مخافة الرب. والعامل بها ذو فطنة شديدة. تسبيح الرب دائم إلى الأبد."]]}, {"l": "Psa 119:27", "n": "", "vs": [[27, "فهمني طريق أوامرك، فأتأمل في أعمالك العجيبة."]]}, {"l": "Pro 2:5", "n": "", "vs": [[5, "عندئذ تدرك مخافة الرب وتعثر على معرفة الله،"]]}, {"l": "Pro 14:8", "n": "", "vs": [[8, "حكمة العاقل في تبين حسن مسلكه، وغباوة الجهال في ارتكاب خدعهم."]]}, {"l": "Pro 23:23", "n": "", "vs": [[23, "اقتن الحق ولا تبعه، وكذا الحكمة والتأديب والفطنة."]]}, {"l": "Jer 4:22", "n": "", "vs": [[22, "إن قومي حمقى لا يعرفونني. هم أبناء أغبياء مجردون من الفهم، حاذقون في ارتكاب الشر، وجهلاء في صنع الخير»."]]}, {"l": "Joh 7:17", "n": "", "vs": [[17, "ومن أراد أن يعمل مشيئة الله يعرف ما إذا كان تعليمي من عند الله، أو أنني أتكلم من عندي."]]}, {"l": "Rom 12:2", "n": "", "vs": [[2, "ولا تتكيفوا مع هذا العالم، بل تغيروا بتجديد الذهن، لتميزوا ما هي إرادة الله الصالحة المقبولة الكاملة."]]}, {"l": "Col 1:9", "n": "", "vs": [[9, "لذلك نحن أيضا، من اليوم الذي فيه سمعنا بأخباركم، مازلنا نصلي ونتضرع لأجلكم، لأن تمتلئوا من تمام المعرفة لمشيئة الله في كل حكمة وإدراك روحي،"]]}, {"l": "1Th 4:1-3", "n": "", "vs": [[1, "وبعد، أيها الإخوة، فمثلما تلقيتم منا كيف يجب أن تسلكوا سلوكا يرضي الله ، وكما أنتم فاعلون، نرجو منكم ونحرضكم في الرب يسوع أن تضاعفوا تقدمكم في ذلك أكثر فأكثر."], [2, "فإنكم تعرفون الوصايا التي لقناكم إياها من قبل الرب يسوع."], [3, "فإن مشيئة الله هي هذه: قداستكم. وذلك بأن تمتنعوا عن الزنى،"]]}, {"l": "1Th 5:18", "n": "", "vs": [[18, "ارفعوا الشكر في كل حال: فهذه هي مشيئة الله لكم في المسيح يسوع."]]}, {"l": "1Pe 4:2", "n": "", "vs": [[2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."]]}], "kwAr": "بل افهموا", "noteAr": ""}], "arS": [["لذلك", ["G1223", "G5124"]], [" لا تكونوا ", []], ["أغبياء", ["G878"]], ["، بل ", []], ["افهموا", ["G4920"]], [" ما هي ", []], ["مشيئة", ["G2307"]], [" ", []], ["الرب", ["G2962"]], [".", []]]}, {"c": 5, "v": 18, "text": "لا تسكروا بالخمر، ففيها الخلاعة، وإنما امتلئوا بالروح،", "groups": [{"kw": "be not", "raw": "Gen_9:21, Gen_19:32-35; Deu_21:20; Psa_69:12; Pro_20:1, Pro_23:20,Pro_23:21, Pro_23:29-35; Isa_5:11-13, Isa_5:22; Mat_24:49; Luk_12:45, Luk_21:34; Rom_13:13; 1Co_5:11, 1Co_6:10; 1Co_11:21; Gal_5:21; 1Th_5:7", "note": "", "refs": [{"l": "Gen 9:21", "n": "", "vs": [[21, "وشرب من الخمر فسكر وتعرى داخل خيمته،"]]}, {"l": "Gen 19:32-35", "n": "", "vs": [[32, "فتعالي نسقيه خمرا ونضطجع معه فلا تنقطع ذرية أبينا»."], [33, "فسقتا في تلك الليلة أباهما خمرا، وأقبلت الابنة الكبرى وضاجعت أباها فلم يعلم باضطجاعها ولا بقيامها."], [34, "وفي اليوم الثاني قالت الابنة البكر لأختها الصغيرة: «إني قد اضطجعت مع أبي ليلة أمس، فتعالي نسقيه الليلة أيضا خمرا ثم ادخلي واضطجعي معه فنحيي من أبينا نسلا»."], [35, "فسقتا أباهما خمرا في تلك الليلة أيضا وأقبلت الابنة الصغيرة وضاجعت أباها. فلم يعلم باضطجاعها ولا بقيامها."]]}, {"l": "Deu 21:20", "n": "", "vs": [[20, "ويقولان للشيوخ: ابننا هذا عنيد متمرد، لا يطيع قولنا، وهو مبذر سكير."]]}, {"l": "Psa 69:12", "n": "", "vs": [[12, "صرت حديث الجالسين في باب المدينة، وأغنية للسكارى."]]}, {"l": "Pro 20:1", "n": "", "vs": [[1, "الخمر مستهزئة، والمسكر صخاب، ومن يدمن عليها فليس بحكيم."]]}, {"l": "Pro 23:20", "n": "", "vs": [[20, "لا تكن واحدا من مدمني الخمر، الشرهين لالتهام اللحم،"]]}, {"l": "Pro 23:21", "n": "", "vs": [[21, "لأن السكير والشره يفتقران، وكثرة النوم تكسو المرء بالخرق."]]}, {"l": "Pro 23:29-35", "n": "", "vs": [[29, "لمن المعاناة؟ لمن الويل والشقاء والمخاصمات والشكوى؟ لمن الجر اح بلا سبب؟ ولمن احمرار العينين؟"], [30, "إنها للمدمنين الخمر، الساعين وراء المسكر الممزوج."], [31, "لا تنظر إلى الخمر إذا التهبت بالاحمرار، وتألقت في الكأس، وسالت سائغة،"], [32, "فإنها في آخرها تلسع كالحية وتلدغ كالأفعوان."], [33, "فتشاهد عيناك أمورا غريبة، وقلبك يحدثك بأشياء ملتوية،"], [34, "فتكون مترنحا كمن يضطجع في وسط عباب البحر، أو كراقد على قمة سارية!"], [35, "فتقول: «ضر بوني ولكن لم أتوجع. لكموني فلم أشعر، فمتى أستيقظ؟ سأذهب ألتمس شربها مرة أخرى»."]]}, {"l": "Isa 5:11-13", "n": "", "vs": [[11, "ويل لمن ينهضون في الصباح مبكرين يسعون وراء المسكر حتى ساعة متأخرة من الليل إلى أن تلهبهم الخمر."], [12, "يتلهون في مآدبهم بالعود والرباب والدف والناي والخمر، غير مكترثين لأعمال الرب ولا ناظرين إلى صنع يديه،"], [13, "لذلك يسبى شعبي لأنهم لا يعرفون، ويموت عظماؤهم جوعا، ويهلك العامة ظمأ."]]}, {"l": "Isa 5:22", "n": "", "vs": [[22, "ويل للعتاة في شرب الخمر والمتفوقين في مزج المسكر،"]]}, {"l": "Mat 24:49", "n": "", "vs": [[49, "وبدأ يضرب زملاءه العبيد ويأكل ويشرب مع السكيرين،"]]}, {"l": "Luk 12:45", "n": "", "vs": [[45, "ولكن إذا قال ذلك العبد في نفسه: سيدي سيتأخر في رجوعه؛ وأخذ يضرب الخادمين والخادمات ويأكل ويشرب ويسكر،"]]}, {"l": "Luk 21:34", "n": "", "vs": [[34, "ولكن احذروا لأنفسكم لئلا تتثقل قلوبكم بالانغماس في اللذات وبالسكر وهموم الحياة، فيدهمكم ذلك اليوم فجأة؛"]]}, {"l": "Rom 13:13", "n": "", "vs": [[13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."]]}, {"l": "1Co 5:11", "n": "", "vs": [[11, "أما الآن فقد كتبت إليكم بأن لا تعاشروا من يسمى أخا إن كان زانيا أو طماعا أو عابد أصنام أو شتاما أو سكيرا أو سراقا. فمثل هذا لا تعاشروه ولا تجلسوا معه لتناول الطعام."]]}, {"l": "1Co 6:10", "n": "", "vs": [[10, "ولا السراقون ولا الطماعون ولا السكيرون ولا الشتامون ولا المغتصبون."]]}, {"l": "1Co 11:21", "n": "", "vs": [[21, "لأن كل واحد يسبق غيره ليتناول عشاءه الخاص، فيظل الواحد جائعا، ويشرب الآخر حتى يسكر!"]]}, {"l": "Gal 5:21", "n": "", "vs": [[21, "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!"]]}, {"l": "1Th 5:7", "n": "", "vs": [[7, "فإنه في الليل ينام الذين ينامون، وفي الليل يسكر الذين يسكرون"]]}], "kwAr": "لا تسكروا بالخمر", "noteAr": ""}, {"kw": "excess", "raw": "Mat_23:25; 1Pe_4:3, 1Pe_4:4", "note": "", "refs": [{"l": "Mat 23:25", "n": "", "vs": [[25, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تنظفون الكأس والصحفة من الخارج، ولكنهما من الداخل ممتلئتان بما كسبتم بالنهب والطمع!"]]}, {"l": "1Pe 4:3", "n": "", "vs": [[3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}, {"l": "1Pe 4:4", "n": "", "vs": [[4, "ورفاقكم في تلك العيشة سابقا يستغربون أنكم لا تركضون معهم إلى فيض هذه الخلاعة، ويجرحون سمعتكم."]]}], "kwAr": "ففيها الخلاعة", "noteAr": ""}, {"kw": "but", "raw": "Psa_63:3-5; Son_1:4, Son_7:9; Isa_25:6, Isa_55:1; Zec_9:15-17; Luk_11:13; Act_2:13-18, Act_11:24; Gal_5:22-25", "note": "", "refs": [{"l": "Psa 63:3-5", "n": "", "vs": [[3, "لأن رحمتك خير من الحياة، لذلك تسبحك شفتاي."], [4, "أحمدك على بركاتك مدى حياتي، وباسمك أرفع يدي مبتهلا."], [5, "تشبع نفسي كأنها أكلت من الشحم والدسم، ويسبحك فمي بشفتين مبتهجتين"]]}, {"l": "Son 1:4", "n": "", "vs": [[4, "اجذبني وراءك فنجري، أدخلني الملك إلى مخادعه. نبتهج بك ونفرح، ونطري حبك أكثر من الخمر، فالذين أحبوك محقون."]]}, {"l": "Son 7:9", "n": "", "vs": [[9, "فمك كأجود الخمر!(المحبوبة): لتكن سائغة لحبيبي، تسيل عذبة على شفاه النائمين."]]}, {"l": "Isa 25:6", "n": "", "vs": [[6, "في هذا الجبل، في أورشليم، يقيم الرب القدير مأدبة مسمنات لجميع الشعوب، مأدبة خمر صافية معتقة، مأدبة لحوم وأمخاخ."]]}, {"l": "Isa 55:1", "n": "", "vs": [[1, "تعالوا أيها العطاش جميعا إلى المياه، وهلموا أيها المعدمون من الفضة، ابتاعوا وكلوا، ابتاعوا خمرا ولبنا مجانا من غير فضة."]]}, {"l": "Zec 9:15-17", "n": "", "vs": [[15, "يقيهم الرب القدير فلا تنالهم حجارة المقلاع، بل تقصر عنهم ويطأونها، ويشربون (من دماء أعدائهم) ويصخبون كالسكارى من الخمر ويمتلئون كمناضح المحرقات وزوايا المذبح."], [16, "في ذلك اليوم يخلصهم الرب إلههم لأنهم شعبه قطيعه، ويتألقون في أرضه كحجارة كريمة مرصعة في تاج."], [17, "فما أجملهم وما أبهاهم! الحنطة تجعل الفتيان أكثر ازدهارا، والخمرة تجعل الفتيات أكثر نضرة»."]]}, {"l": "Luk 11:13", "n": "", "vs": [[13, "فإن كنتم، أنتم الأشرار، تعرفون أن تعطوا أولادكم عطايا جيدة، فكم بالأحرى الآب، الذي من السماء يهب الروح القدس لمن يسألونه؟ »"]]}, {"l": "Act 2:13-18", "n": "", "vs": [[13, "أما بعضهم فقالوا ساخرين: «ما هم إلا سكارى!»"], [14, "فوقف بطرس مع الرسل الأحد عشر، وخاطب الحاضرين بصوت عال، وقال:"], [15, "ليس هؤلاء سكارى كما تتوهمون، فالناس لا يسكرون في الساعة التاسعة صباحا."], [16, "ولكن هذا ما قيل بلسان النبي يوئيل:"], [17, "يقول الله : في الأيام الأخيرة سأسكب روحي على جميع البشر، فيتنبأ بنوكم وبناتكم، ويرى شبابكم رؤى، ويحلم شيوخكم أحلاما."], [18, "في تلك الأيام أفيض من روحي على عبيدي كلهم، رجالا ونساء، فيتنبأون."]]}, {"l": "Act 11:24", "n": "", "vs": [[24, "فقد كان برنابا رجلا صالحا ممتلئا من الروح القدس والإيمان. وانضم إلى الرب جمع كبير."]]}, {"l": "Gal 5:22-25", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"], [23, "والوداعة وضبط النفس. وليس من قانون يمنع مثل هذه الفضائل."], [24, "ولكن الذين صاروا خاصة للمسيح، قد صلبوا الجسد مع الأهواء والشهوات."], [25, "إذا كنا نحيا بالروح، فلنسلك أيضا بالروح."]]}], "kwAr": "وإنما امتلئوا بالروح", "noteAr": ""}], "arS": [["لا ", []], ["تسكروا", ["G3182"]], [" ", []], ["بالخمر", ["G3631"]], ["، ففيها ", []], ["الخلاعة", ["G810"]], ["، وإنما ", []], ["امتلئوا", ["G4137"]], [" ", []], ["بالروح", ["G4151"]], ["،", []]]}, {"c": 5, "v": 19, "text": "محدثين بعضكم بعضا بمزامير وتسابيح وأناشيد روحية، مرنمين ومرتلين بقلوبكم للرب؛", "groups": [{"kw": "to yourselves", "raw": "Act_16:25; 1Co_14:26; Col_3:16; Jam_5:13", "note": "", "refs": [{"l": "Act 16:25", "n": "", "vs": [[25, "ونحو منتصف الليل كان بولس وسيلا يصليان ويسبحان الله، والمسجونون يسمعونهما،"]]}, {"l": "1Co 14:26", "n": "", "vs": [[26, "فما العمل إذن أيها الإخوة؟ كلما تجتمعون معا، سيكون لكل منكم مزمور، أو تعليم، أو كلام بلغة مجهولة، أو إعلان، أو ترجمة. فليتم كل شيء بهدف البنيان."]]}, {"l": "Col 3:16", "n": "", "vs": [[16, "لتسكن كلمة المسيح في داخلكم بغنى، في كل حكمة، معلمين وواعظين بعضكم بعضا، مرنمين بمزامير وتسابيح وأناشيد روحية في قلوبكم لله، رافعين له الحمد."]]}, {"l": "Jam 5:13", "n": "", "vs": [[13, "هل بينكم من يتألم؟ فليصل! وهل بينكم من هو سعيد؟ فليرتل!"]]}], "kwAr": "محدثين بعضكم بعضا", "noteAr": ""}, {"kw": "psalms", "raw": "Psalms, ψαλμοι [Strongs G5568], from ψαλλω [Strongs G5567], to touch or play on a musical instrument, properly denotes such sacred songs or poems as are sung to stringed instruments, and may here refer to those of David; hymns, υμνοι [Strongs G5215], from υδω, to sing, celebrate, praise, signifies songs in honour of God; and songs ωδαι [Strongs G5603], from αειδω, to sing, denotes any regular poetic composition adapted to singing, and is here restricted to those which are spiritual. Psa_95:2, Psa_105:2; Mat_26:30", "note": "Psalms, ψαλμοι [Strongs G5568], from ψαλλω [Strongs G5567], to touch or play on a musical instrument, properly denotes such sacred songs or poems as are sung to stringed instruments, and may here refer to those of David; hymns, υμνοι [Strongs G5215], from υδω, to sing, celebrate, praise, signifies songs in honour of God; and songs ωδαι [Strongs G5603], from αειδω, to sing, denotes any regular poetic composition adapted to singing, and is here restricted to those which are spiritual. Psa_95:2, Psa_105:2; Mat_26:30", "refs": [{"l": "Psa 95:2", "n": "", "vs": [[2, "لنتقدم أمام حضرته بالشكر، ونهتف له بالترنيم."]]}, {"l": "Psa 105:2", "n": "", "vs": [[2, "غنوا له، اشدوا له. حدثوا بكل عجائبه."]]}, {"l": "Mat 26:30", "n": "", "vs": [[30, "ثم رتلوا، وانطلقوا خارجا إلى جبل الزيتون."]]}], "kwAr": "بمزامير", "noteAr": "«مزامير» (بسالموي، G5568) من «بسالّو» (G5567) أي يعزف على آلة موسيقية، وتدل أصلًا على الأناشيد أو القصائد المقدسة التي تُرنّم مع الآلات الوترية، وقد تشير هنا إلى مزامير داود؛ و«تسابيح» (هيمنوي، G5215) من «هيدو» أي يرنّم ويمجّد ويسبّح، وتعني أغاني لإكرام الله؛ و«أناشيد» (أوداي، G5603) من «أإيدو» أي يغني، وتدل على أي نظم شعري يصلح للغناء، وقد قُصرت هنا على الروحية منها. انظر مز 95: 2؛ 105: 2؛ مت 26: 30."}, {"kw": "making", "raw": "Psa_47:7, Psa_47:8, Psa_62:8, Psa_86:12, Psa_105:3, Psa_147:7; Isa_65:14; Mat_15:8; Joh_4:23, Joh_4:24", "note": "", "refs": [{"l": "Psa 47:7", "n": "", "vs": [[7, "لأن الله هو ملك الأرض كلها. رنموا له قصيدة حمد."]]}, {"l": "Psa 47:8", "n": "", "vs": [[8, "ملك الله على الأمم، الله جلس على عرشه المقدس."]]}, {"l": "Psa 62:8", "n": "", "vs": [[8, "ثقوا به في كل حين أيها الشعب. اسكبوا أمامه قلوبكم، الله ملجأنا."]]}, {"l": "Psa 86:12", "n": "", "vs": [[12, "أحمدك يارب إلهي بكامل قلبي، وأمجد اسمك إلى الأبد."]]}, {"l": "Psa 105:3", "n": "", "vs": [[3, "تباهوا باسمه القدوس، لتفرح قلوب طالبي الرب."]]}, {"l": "Psa 147:7", "n": "", "vs": [[7, "ردوا على الرب بحمد، رنموا لإلهنا على العود."]]}, {"l": "Isa 65:14", "n": "", "vs": [[14, "ويترنمون في غبطة القلب وأنتم تعولون من أسى القلب، وتولولون من انكسار الروح،"]]}, {"l": "Mat 15:8", "n": "", "vs": [[8, "هذا الشعب يكرمني بشفتيه، أما قلبه فبعيد عني جدا!"]]}, {"l": "Joh 4:23", "n": "", "vs": [[23, "فستأتي ساعة، لا بل هي الآن، حين يعبد العابدون الصادقون الآب بالروح وبالحق. لأن الآب يبتغي مثل هؤلاء العابدين."]]}, {"l": "Joh 4:24", "n": "", "vs": [[24, "الله روح، فلذلك لابد لعابديه من أن يعبدوه بالروح وبالحق»."]]}], "kwAr": "مرنمين ومرتلين", "noteAr": ""}], "arS": [["محدثين", ["G2980"]], [" ", []], ["بعضكم بعضا", ["G1438"]], [" ", []], ["بمزامير", ["G5568"]], [" ", []], ["وتسابيح", ["G5215"]], [" ", []], ["وأناشيد", ["G5603"]], [" ", []], ["روحية", ["G4152"]], ["، ", []], ["مرنمين", ["G103"]], [" ", []], ["ومرتلين", ["G5567"]], [" ", []], ["بقلوبكم", ["G2588", "G5216"]], [" ", []], ["للرب", ["G2962"]], ["؛", []]]}, {"c": 5, "v": 20, "text": "رافعين الشكر كل حين وعلى كل شيء لله والآب، باسم ربنا يسوع المسيح؛", "groups": [{"kw": "thanks", "raw": "Eph_5:4; Job_1:21; Psa_34:1; Isa_63:7; Act_5:41; 1Co_1:4; Phi_1:3, Phi_4:6; Col_1:11, Col_1:12, Col_3:17; 1Th_3:9, 1Th_5:18; 2Th_1:3, 2Th_2:13", "note": "", "refs": [{"l": "Eph 5:4", "n": "", "vs": [[4, "وكذلك البذاءة والكلام السفيه والهزل، فهي غير لائقة. وإنما أحرى بكم أن تلهجوا بالشكر لله!"]]}, {"l": "Job 1:21", "n": "", "vs": [[21, "وقال: «عريانا خرجت من بطن أمي وعريانا أعود إلى هناك. الرب أعطى والرب أخذ، فليكن اسم الرب مباركا»."]]}, {"l": "Psa 34:1", "n": "", "vs": [[1, "أبارك الرب في كل حين. تسبيحه دائما في فمي."]]}, {"l": "Isa 63:7", "n": "", "vs": [[7, "ألهج برأفات الرب وتسابيحه وإحساناته التي أغدقها على بيت إسرائيل بفضل خيره ورحمته."]]}, {"l": "Act 5:41", "n": "", "vs": [[41, "ولكن الرسل خرجوا من المجلس فرحين، لأنهم اعتبروا أهلا لأن يلقوا الإهانة من أجل اسم يسوع."]]}, {"l": "1Co 1:4", "n": "", "vs": [[4, "إني أشكر الله من أجلكم دائما، وعلى نعمة الله الموهوبة لكم في المسيح يسوع."]]}, {"l": "Phi 1:3", "n": "", "vs": [[3, "إني أشكر إلهي كلما تذكرتكم،"]]}, {"l": "Phi 4:6", "n": "", "vs": [[6, "لا تقلقوا من جهة أي شيء، بل في كل أمر لتكن طلباتكم معروفة لدى الله، بالصلاة والدعاء، مع الشكر."]]}, {"l": "Col 1:11", "n": "", "vs": [[11, "متشددين بكل قوة موافقة لقدرة مجده، لتتمكنوا تماما من الاحتمال وطول البال،"]]}, {"l": "Col 1:12", "n": "", "vs": [[12, "رافعين الشكر بفرح للآب الذي جعلكم أهلا للاشتراك في ميراث القديسين في (ملكوت) النور،"]]}, {"l": "Col 3:17", "n": "", "vs": [[17, "ومهما كان ما تعملونه، بالقول أو بالفعل، فليجر كل شيء باسم الرب يسوع، رافعين به الشكر لله الآب."]]}, {"l": "1Th 3:9", "n": "", "vs": [[9, "فأي شكر نستطيع أن نؤديه إلى الله عوضا عنكم من أجل كل ما نبتهج به من الفرح بسببكم أمام إلهنا،"]]}, {"l": "1Th 5:18", "n": "", "vs": [[18, "ارفعوا الشكر في كل حال: فهذه هي مشيئة الله لكم في المسيح يسوع."]]}, {"l": "2Th 1:3", "n": "", "vs": [[3, "من واجبنا أن نشكر الله على الدوام لأجلكم أيها الإخوة. كما أن هذا حق: لأن إيمانكم ينمو نموا فائقا، ومحبة أحدكم للآخر تفيض بينكم جميعا."]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}], "kwAr": "رافعين الشكر كل حين", "noteAr": ""}, {"kw": "in", "raw": "Joh_14:13, Joh_14:14, Joh_15:16, Joh_16:23-26; Col_3:17; Heb_13:15; 1Pe_2:5, 1Pe_4:11", "note": "", "refs": [{"l": "Joh 14:13", "n": "", "vs": [[13, "فأي شيء تطلبونه باسمي أفعله لكم، ليتمجد الآب في الابن."]]}, {"l": "Joh 14:14", "n": "", "vs": [[14, "إن طلبتم شيئا باسمي، فإني أفعله."]]}, {"l": "Joh 15:16", "n": "", "vs": [[16, "ليس أنتم اخترتموني، بل أنا اخترتكم وعينتكم لتنطلقوا وتنتجوا ثمرا ويدوم ثمركم، فيعطيكم الآب كل ما تطلبونه باسمي."]]}, {"l": "Joh 16:23-26", "n": "", "vs": [[23, "وفي ذلك اليوم لا تسألونني عن شيء. الحق الحق أقول لكم: إن الآب سيعطيكم كل ما تطلبون منه باسمي."], [24, "حتى الآن لم تطلبوا باسمي شيئا. اطلبوا تنالوا، فيكون فرحكم كاملا."], [25, "ضربت لكم أمثالا في كلامي عن هذه الأمور، ولكن سيأتي وقت أحدثكم فيه عن الآب بكلام صريح، دون أمثال."], [26, "في ذلك اليوم تطلبون من الآب باسمي. ولست أقول لكم إني أطلب إليه عنكم."]]}, {"l": "Col 3:17", "n": "", "vs": [[17, "ومهما كان ما تعملونه، بالقول أو بالفعل، فليجر كل شيء باسم الرب يسوع، رافعين به الشكر لله الآب."]]}, {"l": "Heb 13:15", "n": "", "vs": [[15, "فبالمسيح، رئيس كهنتنا، لنقرب لله دائما ذبيحة الحمد والتسبيح، أي الثمار التي تنتجها أفواهنا المعترفة باسمه."]]}, {"l": "1Pe 2:5", "n": "", "vs": [[5, "إذن اتحدوا به كحجارة حية، مبنيين بيتا روحيا، تكونون فيه كهنة مقدسين تقدمون لله ذبائح روحية مقبولة لديه بفضل يسوع المسيح."]]}, {"l": "1Pe 4:11", "n": "", "vs": [[11, "فمن يتكلم، عليه أن يتكلم بما يوافق أقوال الله؛ ومن يخدم، عليه أن يخدم بموجب القوة التي يمنحها الله . وذلك لكي يتمجد الله في كل شيء، بيسوع المسيح، له المجد والسلطة إلى أبد الآبدين. آمين!"]]}], "kwAr": "باسم ربنا يسوع المسيح", "noteAr": ""}], "arS": [["رافعين ", []], ["الشكر", ["G2168"]], [" ", []], ["كل حين", ["G3842"]], [" وعلى ", []], ["كل شيء", ["G3956"]], [" ", []], ["لله", ["G2316"]], [" ", []], ["والآب", ["G3962"]], ["، ", []], ["باسم", ["G3686"]], [" ", []], ["ربنا", ["G2962", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], ["؛", []]]}, {"c": 5, "v": 21, "text": "خاضعين بعضكم لبعض في مخافة المسيح.", "groups": [{"kw": "submitting", "raw": "Eph_5:22, Eph_5:24; Gen_16:9; 1Ch_29:24; Rom_13:1-5; 1Co_16:16; Phi_2:3; 1Ti_2:11; 1Ti_3:4; Heb_13:17; 1Pe_2:13, 1Pe_5:5", "note": "", "refs": [{"l": "Eph 5:22", "n": "", "vs": [[22, "أيتها الزوجات، اخضعن لأزواجكن، كما للرب."]]}, {"l": "Eph 5:24", "n": "", "vs": [[24, "فكما أن الكنيسة قد أخضعت للمسيح، فكذلك الزوجات أيضا لأزواجهن، في كل شيء."]]}, {"l": "Gen 16:9", "n": "", "vs": [[9, "فقال لها ملاك الرب: «عودي إلى مولاتك واخضعي لها»."]]}, {"l": "1Ch 29:24", "n": "", "vs": [[24, "كما أبدى الرؤساء والأبطال وسائر أبناء الملك داود خضوعا تاما لسليمان الملك."]]}, {"l": "Rom 13:1-5", "n": "", "vs": [[1, "على كل نفس أن تخضع للسلطات الحاكمة. فلا سلطة إلا من عند الله، والسلطات القائمة مرتبة من قبل الله."], [2, "حتى إن من يقاوم السلطة، يقاوم ترتيب الله، والمقاومون سيجلبون العقاب على أنفسهم."], [3, "فإن الحكام لا يخافهم من يفعل الصلاح بل من يفعل الشر. أفترغب إذن في أن تكون غير خائف من السلطة؟ اعمل ما هو صالح، فتكون ممدوحا عندها،"], [4, "لأنها خادمة الله لك لأجل الخير. أما إن كنت تعمل الشر فخف، لأن السلطة لا تحمل السيف عبثا، إذ إنها خادمة الله، وهي التي تنتقم لغضبه ممن يفعل الشر."], [5, "ولذلك، فمن الضروري أن تخضعوا، لا اتقاء للغضب فقط، بل مراعاة للضمير أيضا."]]}, {"l": "1Co 16:16", "n": "", "vs": [[16, "فاخضعوا لهم ولأمثالهم، ولكل من يشترك معهم باجتهاد في العمل."]]}, {"l": "Phi 2:3", "n": "", "vs": [[3, "لا يكن بينكم شيء بروح التحزب والافتخار الباطل، بل بالتواضع ليعتبر كل واحد منكم غيره أفضل كثيرا من نفسه،"]]}, {"l": "1Ti 2:11", "n": "", "vs": [[11, "على المرأة أن تتلقى التعليم بسكوت وبكل خضوع."]]}, {"l": "1Ti 3:4", "n": "", "vs": [[4, "يحسن تدبير بيته، ويربي أولاده في الخضوع بكل احترام."]]}, {"l": "Heb 13:17", "n": "", "vs": [[17, "أطيعوا مرشديكم، واخضعوا لهم، لأنهم يسهرون على مصلحتكم الروحية، كما يسهر الذي يحمل مسئولية سوف يقدم حسابا عن قيامه بها. وعندئذ، يؤدون مهمتهم بفرح دون تذمر. فلن يكون في تذمرهم نفع لكم!"]]}, {"l": "1Pe 2:13", "n": "", "vs": [[13, "فإكراما للرب، اخضعوا لكل نظام يدير شؤون الناس: للملك، باعتباره صاحب السلطة العليا،"]]}, {"l": "1Pe 5:5", "n": "", "vs": [[5, "كذلك، أيها الشباب، اخضعوا للشيوخ. البسوا جميعا ثوب التواضع في معاملتكم بعضكم لبعض. لأن الله يقاوم المتكبرين، ولكنه يعطي المتواضعين نعمة."]]}], "kwAr": "خاضعين بعضكم لبعض", "noteAr": ""}, {"kw": "in", "raw": "2Ch_19:7; Neh_5:9, Neh_5:15; Pro_24:21; 2Co_7:1; 1Pe_2:17", "note": "", "refs": [{"l": "2Ch 19:7", "n": "", "vs": [[7, "ولتكن هيبة الرب عليكم. فاحرصوا على إقامة العدل لأنه ليس عند الرب إلهنا ظلم ولا محاباة ولا رشوة»."]]}, {"l": "Neh 5:9", "n": "", "vs": [[9, "ثم استطردت: «هذا تصرف سيء. ألا تسلكون في خوف إلهنا تفاديا لتعيير الأمم أعدائنا؟"]]}, {"l": "Neh 5:15", "n": "", "vs": [[15, "على نقيض الولاة السابقين الذين ثقلوا الضرائب على الشعب، وابتزوا منهم خبزا وخمرا، فضلا عن أربعين شاقلا (نحو أربع مئة وثمانين جراما من الفضة). كما تسلط رجالهم على الشعب. أما أنا فلم أفعل هكذا من خوف الله،"]]}, {"l": "Pro 24:21", "n": "", "vs": [[21, "ياابني اتق الرب والملك، ولا تعاشر المتقلبين،"]]}, {"l": "2Co 7:1", "n": "", "vs": [[1, "فإذ نلنا هذه الوعود، أيها الأحباء، لنطهر أنفسنا من كل ما يدنس الجسد والروح، ونكمل القداسة في مخافة الله."]]}, {"l": "1Pe 2:17", "n": "", "vs": [[17, "أكرموا جميع الناس. أحبوا الإخوة. خافوا الله . أكرموا الملك."]]}], "kwAr": "في مخافة المسيح", "noteAr": ""}], "arS": [["خاضعين", ["G5293"]], [" ", []], ["بعضكم لبعض", ["G240"]], [" في ", []], ["مخافة", ["G5401"]], [" المسيح.", []]]}, {"c": 5, "v": 22, "text": "أيتها الزوجات، اخضعن لأزواجكن، كما للرب.", "groups": [{"kw": "submit", "raw": "Eph_5:24; Gen_3:16; Est_1:16-18, Est_1:20; 1Co_14:34; Col_3:18-25; 1Ti_2:11, 1Ti_2:12; Tit_2:5; 1Pe_3:1-6", "note": "", "refs": [{"l": "Eph 5:24", "n": "", "vs": [[24, "فكما أن الكنيسة قد أخضعت للمسيح، فكذلك الزوجات أيضا لأزواجهن، في كل شيء."]]}, {"l": "Gen 3:16", "n": "", "vs": [[16, "ثم قال للمرأة: «أكثر تكثيرا أوجاع مخاضك فتنجبين بالآلام أولادا، وإلى زوجك يكون اشتياقك وهو يتسلط عليك»."]]}, {"l": "Est 1:16-18", "n": "", "vs": [[16, "فأجابه مموكان في حضرة العظماء: «إن الملكة وشتي لم تذنب في حق الملك وحده، بل أساءت إلى جميع الرؤساء والأمم المقيمين في تخوم الملك أحشويروش،"], [17, "فما إن يذيع خبر تصرف الملكة بين جميع النساء، حتى يحتقرن أزواجهن، إذ يقلن: إن الملك أحشويروش أمر أن تمثل الملكة وشتي أمامه ولكنها لم تصدع بأمره."], [18, "فتحذو في هذا اليوم سيدات فارس ومادي، اللواتي بلغهن خبر الملكة، حذوها، مع جميع رؤساء الملك. ومثل هذا يثير كثرة من الاحتقار والغضب."]]}, {"l": "Est 1:20", "n": "", "vs": [[20, "وهكذا يذيع أمر الملك الصادر عنه في كل أرجاء مملكته الشاسعة، فتعامل جميع النساء أزواجهن صغارا وكبارا باحترام»."]]}, {"l": "1Co 14:34", "n": "", "vs": [[34, "لتصمت النساء في الكنائس، فليس مسموحا لهن أن يتكلمن، بل عليهن أن يكن خاضعات، على حد ما توصي به الشريعة أيضا."]]}, {"l": "Col 3:18-25", "n": "", "vs": [[18, "أيتها الزوجات اخضعن لأزواجكن كما يليق (بالعيشة) في الرب."], [19, "أيها الأزواج، أحبوا زوجاتكم، ولا تعاملوهن بقسوة."], [20, "أيها الأولاد، أطيعوا والديكم في كل أمر، لأن ذلك مرضي في الرب."], [21, "أيها الآباء، لا تثيروا غضب أولادكم لئلا يصيبهم الفشل."], [22, "أيها العبيد، أطيعوا في كل أمر سادتكم البشريين، فلا تعملوا بجد فقط حين تكون عيونهم عليكم، كمن يحاول إرضاء الناس، بل بقلب صادق خائفين الرب."], [23, "ومهما عملتم، فاجتهدوا فيه من صميم القلب، وكأنه للرب لا للناس،"], [24, "عالمين أنكم سوف تنالون المكافأة بالميراث من الرب. فإنما أنتم عبيد تخدمون الرب المسيح"], [25, "وأما من عمل شرا فسوف ينال جزاء عمله الشرير، وليس محاباة."]]}, {"l": "1Ti 2:11", "n": "", "vs": [[11, "على المرأة أن تتلقى التعليم بسكوت وبكل خضوع."]]}, {"l": "1Ti 2:12", "n": "", "vs": [[12, "ولست أسمح للمرأة أن تعلم ولا تتسلط على الرجل. بل عليها أن تلزم السكوت."]]}, {"l": "Tit 2:5", "n": "", "vs": [[5, "متعقلات، عفيفات، مهتمات بشؤون بيوتهن صالحات، خاضعات لأزواجهن، حتى لا يتكلم أحد بالسوء على كلمة الله."]]}, {"l": "1Pe 3:1-6", "n": "", "vs": [[1, "كذلك، أيتها الزوجات، اخضعن لأزواجكن. حتى وإن كان الزوج غير مؤمن بالكلمة، تجذبه زوجته إلى الإيمان، بتصرفها اللائق دون كلام،"], [2, "وذلك حين يلاحظ سلوكها الطاهر ووقارها."], [3, "وعلى المرأة ألا تعتمد الزينة الخارجية لإظهار جمالها، بضفر الشعر والتحلي بالذهب ولبس الثياب الفاخرة."], [4, "وإنما لتعتمد الزينة الداخلية، ليكون قلبها متزينا بروح الوداعة والهدوء. هذه هي الزينة التي لا تفنى، وهي غالية الثمن في نظر الله!"], [5, "وبها كانت تتزين النساء التقيات قديما، فكانت الواحدة منهن تتكل على الله وتخضع لزوجها."], [6, "فسارة، مثلا، كانت تطيع زوجها إبراهيم وتدعوه «سيدي». والمؤمنات اللواتي يقتدين بها، يثبتن أنهن بنات لها، إذ يتصرفن تصرفا صالحا، فلا يخفن أي تهديد."]]}], "kwAr": "اخضعن لأزواجكن", "noteAr": ""}, {"kw": "as", "raw": "Eph_6:5; Col_3:22, Col_3:23", "note": "", "refs": [{"l": "Eph 6:5", "n": "", "vs": [[5, "أيها العبيد، أطيعوا سادتكم البشريين بخوف وارتعاد، من قلب صادق، كمن يطيع المسيح،"]]}, {"l": "Col 3:22", "n": "", "vs": [[22, "أيها العبيد، أطيعوا في كل أمر سادتكم البشريين، فلا تعملوا بجد فقط حين تكون عيونهم عليكم، كمن يحاول إرضاء الناس، بل بقلب صادق خائفين الرب."]]}, {"l": "Col 3:23", "n": "", "vs": [[23, "ومهما عملتم، فاجتهدوا فيه من صميم القلب، وكأنه للرب لا للناس،"]]}], "kwAr": "كما للرب", "noteAr": ""}], "arS": [["أيتها ", []], ["الزوجات", ["G1135"]], ["، ", []], ["اخضعن", ["G5293"]], [" ", []], ["لأزواجكن", ["G435"]], ["، كما ", []], ["للرب", ["G2962"]], [".", []]]}, {"c": 5, "v": 23, "text": "فإن الزوج هو رأس الزوجة كما أن المسيح أيضا هو رأس الكنيسة (جسده)، وهو نفسه مخلص الجسد.", "groups": [{"kw": "husband", "raw": "1Co_11:3-10", "note": "", "refs": [{"l": "1Co 11:3-10", "n": "", "vs": [[3, "ولكني أريد أن تعلموا أن المسيح هو الرأس لكل رجل؛ أما رأس المرأة فهو الرجل، ورأس المسيح هو الله ."], [4, "فكل رجل يصلي أو يتنبأ، وعلى رأسه غطاء، يجلب العار على رأسه."], [5, "وكل امرأة تصلي أو تتنبأ، وليس على رأسها غطاء، تجلب العار على رأسها، لأن كشف الغطاء كحلق الشعر تماما."], [6, "فإذا كانت المرأة لا تغطي رأسها، فليقص شعرها! ولكن، مادام من العار على المرأة أن يقص شعرها أو يحلق، فلتغط رأسها."], [7, "ذلك لأن الرجل عليه ألا يغطي رأسه، باعتباره صورة الله ومجده. وأما المرأة فهي مجد الرجل."], [8, "فإن الرجل لم يؤخذ من المرأة، بل المرأة أخذت من الرجل؛"], [9, "والرجل لم يوجد لأجل المرأة، بل المرأة وجدت لأجل الرجل."], [10, "لذا يجب على المرأة أن تضع على رأسها علامة الخضوع، من أجل الملائكة."]]}], "kwAr": "فإن الزوج هو رأس الزوجة", "noteAr": ""}, {"kw": "even", "raw": "Eph_1:22, Eph_1:23, Eph_4:15; Col_1:18", "note": "", "refs": [{"l": "Eph 1:22", "n": "", "vs": [[22, "وأخضع كل شيء تحت قدميه، وإياه جعل فوق كل شيء رأسا للكنيسة"]]}, {"l": "Eph 1:23", "n": "", "vs": [[23, "التي هي جسده وكماله، هو الذي يكمل الكل في الكل."]]}, {"l": "Eph 4:15", "n": "", "vs": [[15, "بل نتمسك بالحق في المحبة، فننمو في كل شيء نحو من هو الرأس، أي المسيح."]]}, {"l": "Col 1:18", "n": "", "vs": [[18, "وهو رأس الجسد، أي الكنيسة؛ هو البداءة وبكر القائمين من بين الأموات، ليكون له المقام الأول في كل شيء."]]}], "kwAr": "كما أن المسيح أيضا هو رأس الكنيسة", "noteAr": ""}, {"kw": "he", "raw": "Eph_5:25, Eph_5:26; Act_20:28; 1Th_1:10; Rev_5:9", "note": "", "refs": [{"l": "Eph 5:25", "n": "", "vs": [[25, "أيها الأزواج، أحبوا زوجاتكم مثلما أحب المسيح الكنيسة وبذل نفسه لأجلها،"]]}, {"l": "Eph 5:26", "n": "", "vs": [[26, "لكي يقدسها مطهرا إياها بغسل الماء، بالكلمة،"]]}, {"l": "Act 20:28", "n": "", "vs": [[28, "فاسهروا إذن على أنفسكم وعلى جميع القطيع الذي عينكم بينه الروح القدس نظارا، لترعوا كنيسة الله التي اشتراها بدمه."]]}, {"l": "1Th 1:10", "n": "", "vs": [[10, "وتنتظروا من السماوات ابنه الذي أقامه من بين الأموات، يسوع مخلصنا من الغضب الآتي."]]}, {"l": "Rev 5:9", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"]]}], "kwAr": "وهو نفسه مخلص الجسد", "noteAr": ""}], "arS": [["فإن ", []], ["الزوج", ["G435"]], [" هو ", []], ["رأس", ["G2776"]], [" ", []], ["الزوجة", ["G1135"]], [" كما أن ", []], ["المسيح", ["G5547"]], [" أيضا هو ", []], ["رأس", ["G2776"]], [" ", []], ["الكنيسة", ["G1577"]], [" (جسده)، وهو نفسه ", []], ["مخلص", ["G4990"]], [" ", []], ["الجسد", ["G4983"]], [".", []]]}, {"c": 5, "v": 24, "text": "فكما أن الكنيسة قد أخضعت للمسيح، فكذلك الزوجات أيضا لأزواجهن، في كل شيء.", "groups": [{"kw": "in", "raw": "Eph_5:33; Exo_23:13, Exo_29:35; Col_3:20,Col_3:22; Tit_2:7, Tit_2:9", "note": "", "refs": [{"l": "Eph 5:33", "n": "", "vs": [[33, "إنما أنتم أيضا، كل بمفرده، ليحب كل واحد منكم زوجته كنفسه. وأما الزوجة، فعليها أن تهاب زوجها."]]}, {"l": "Exo 23:13", "n": "", "vs": [[13, "أطيعوا كل ما أوصيتكم به، ولا تذكروا اسم آلهة أخرى، ولا يتلفظ به فمك."]]}, {"l": "Exo 29:35", "n": "", "vs": [[35, "هكذا تصنع لهرون وبنيه بموجب كل ما أمرتك، إذ تكرسهم سبعة أيام."]]}, {"l": "Col 3:20", "n": "", "vs": [[20, "أيها الأولاد، أطيعوا والديكم في كل أمر، لأن ذلك مرضي في الرب."]]}, {"l": "Col 3:22", "n": "", "vs": [[22, "أيها العبيد، أطيعوا في كل أمر سادتكم البشريين، فلا تعملوا بجد فقط حين تكون عيونهم عليكم، كمن يحاول إرضاء الناس، بل بقلب صادق خائفين الرب."]]}, {"l": "Tit 2:7", "n": "", "vs": [[7, "جاعلا من نفسك في كل شيء قدوة للأعمال الصالحة، مظهرا في تعليمك النقاوة والوقار"]]}, {"l": "Tit 2:9", "n": "", "vs": [[9, "وعلم العبيد أن يكونوا خاضعين لسادتهم، مرضين لهم في كل شيء؛ غير معاندين؛"]]}], "kwAr": "في كل شيء", "noteAr": ""}], "arS": [["فكما أن ", []], ["الكنيسة", ["G1577"]], [" قد ", []], ["أخضعت", ["G5293"]], [" ", []], ["للمسيح", ["G5547"]], ["، ", []], ["فكذلك", ["G3779"]], [" ", []], ["الزوجات", ["G1135"]], [" أيضا ", []], ["لأزواجهن", ["G435"]], ["، في ", []], ["كل شيء", ["G3956"]], [".", []]]}, {"c": 5, "v": 25, "text": "أيها الأزواج، أحبوا زوجاتكم مثلما أحب المسيح الكنيسة وبذل نفسه لأجلها،", "groups": [{"kw": "love", "raw": "Eph_5:28; Gen_2:24, Gen_24:67; 2Sa_12:3; Pro_5:18, Pro_5:19; Col_3:19; 1Pe_3:7", "note": "", "refs": [{"l": "Eph 5:28", "n": "", "vs": [[28, "على هذا المثال يجب على الأزواج أن يحبوا زوجاتهم كأجسادهم. إن من يحب زوجته، يحب نفسه."]]}, {"l": "Gen 2:24", "n": "", "vs": [[24, "لهذا، فإن الرجل يترك أباه وأمه ويلتصق بامرأته، ويصيران جسدا واحدا."]]}, {"l": "Gen 24:67", "n": "", "vs": [[67, "فأدخل إسحق رفقة إلى خيمة أمه سارة، وتزوجها وأحبها وتعزى بها بعد موت أمه."]]}, {"l": "2Sa 12:3", "n": "", "vs": [[3, "وأما الفقير فلم يكن له سوى نعجة واحدة صغيرة، اشتراها ورعاها فكبرت معه ومع أبنائه، تأكل مما يأكل وتشرب من كأسه وتنام في حضنه كأنها ابنته."]]}, {"l": "Pro 5:18", "n": "", "vs": [[18, "ليكن ينبوع عفتك مباركا، واغتبط بامرأة شبابك،"]]}, {"l": "Pro 5:19", "n": "", "vs": [[19, "فتكون كالظبية المحبوبة والوعلة البهية، فترتوي من فيض فتنتها، وتظل دائما أسير حبها."]]}, {"l": "Col 3:19", "n": "", "vs": [[19, "أيها الأزواج، أحبوا زوجاتكم، ولا تعاملوهن بقسوة."]]}, {"l": "1Pe 3:7", "n": "", "vs": [[7, "وأنتم، أيها الأزواج، إذ تساكنون زوجاتكم عالمين بأنهن أضعف منكم، أكرموهن باعتبارهن شريكات لكم في وراثة نعمة الحياة، لكي لا يعوق صلواتكم شيء."]]}], "kwAr": "أحبوا زوجاتكم", "noteAr": ""}, {"kw": "loved", "raw": "Eph_5:2; Mat_20:28; Luk_22:19, Luk_22:20; Joh_6:51; Act_20:28; Gal_1:4, Gal_2:20; 1Ti_2:6; 1Pe_1:18-21; Rev_1:5, Rev_5:9", "note": "", "refs": [{"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا
