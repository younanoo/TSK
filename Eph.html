لكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"]]}], "kwAr": "مثلما أحب المسيح الكنيسة", "noteAr": ""}], "arS": [["أيها ", []], ["الأزواج", ["G435"]], ["، ", []], ["أحبوا", ["G25"]], [" ", []], ["زوجاتكم", ["G1135"]], [" مثلما ", []], ["أحب", ["G25"]], [" ", []], ["المسيح", ["G5547"]], [" ", []], ["الكنيسة", ["G1577"]], [" ", []], ["وبذل", ["G3860"]], [" ", []], ["نفسه", ["G1438"]], [" لأجلها،", []]]}, {"c": 5, "v": 26, "text": "لكي يقدسها مطهرا إياها بغسل الماء، بالكلمة،", "groups": [{"kw": "he", "raw": "Joh_17:17-19; Act_26:18; 1Co_6:11; Tit_2:14; Heb_9:14, Heb_10:10; 1Pe_1:2; Jud_1:1", "note": "", "refs": [{"l": "Joh 17:17-19", "n": "", "vs": [[17, "قدسهم بالحق؛ إن كلمتك هي الحق."], [18, "وكما أرسلتني أنت إلى العالم، أرسلتهم أنا أيضا إليه."], [19, "ومن أجلهم أنا أقدس ذاتي، ليتقدسوا هم أيضا في الحق."]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "1Co 6:11", "n": "", "vs": [[11, "وهكذا كان بعضكم، إلا أنكم قد اغتسلتم، بل تقدستم، بل تبررتم، باسم الرب يسوع المسيح وبروح إلهنا."]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Heb 9:14", "n": "", "vs": [[14, "فكم بالأحرى دم المسيح الذي قدم نفسه لله بروح أزلي ذبيحة لا عيب فيها، يطهر ضمائرنا من الأعمال الميتة لنعبد الله الحي."]]}, {"l": "Heb 10:10", "n": "", "vs": [[10, "بموجب هذه الإرادة الإلهية، صرنا مقدسين إذ قرب يسوع المسيح، مرة واحدة، جسده عوضا عنا!"]]}, {"l": "1Pe 1:2", "n": "", "vs": [[2, "بحسب علمه السابق ثم قدسهم بالروح ليطيعوا يسوع المسيح ويطهروا برش دمه عليهم."]]}, {"l": "Jud 1:1", "n": "", "vs": [[1, "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."]]}], "kwAr": "لكي يقدسها", "noteAr": ""}, {"kw": "with", "raw": "Eze_16:9, Eze_36:25; Zec_13:1; Joh_3:5; Act_22:16; Tit_3:5-7; Heb_10:22; 1Pe_3:21; 1Jo_5:6", "note": "", "refs": [{"l": "Eze 16:9", "n": "", "vs": [[9, "ثم غسلتك بماء، ونظفتك من الدم وطيبتك بالدهن."]]}, {"l": "Eze 36:25", "n": "", "vs": [[25, "وأرش عليكم ماء نقيا فتطهرون من كل نجاستكم ومن كل أصنامكم،"]]}, {"l": "Zec 13:1", "n": "", "vs": [[1, "»في ذلك اليوم يتفجر ينبوع ليطهر ذرية داود وسكان أورشليم من إثمهم ونجاستهم."]]}, {"l": "Joh 3:5", "n": "", "vs": [[5, "أجابه يسوع: «الحق الحق أقول لك: لا يمكن أن يدخل أحد ملكوت الله إلا إذا ولد من الماء والروح."]]}, {"l": "Act 22:16", "n": "", "vs": [[16, "والآن لماذا تبطيء؟ قم تعمد واغتسل من خطايا ك، داعيا باسم الرب."]]}, {"l": "Tit 3:5-7", "n": "", "vs": [[5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"], [6, "الذي سكبه علينا بغنى بيسوع المسيح مخلصنا."], [7, "حتى إذا تبررنا بنعمته، نصير ورثة، وفقا لرجائنا بالحياة الأبدية."]]}, {"l": "Heb 10:22", "n": "", "vs": [[22, "فلنتقدم إلى حضرة الله بقلب صادق وبثقة الإيمان الكاملة، بعدما طهر رش الدم قلوبنا من كل شعور بالذنب، وغسل الماء النقي أجسادنا."]]}, {"l": "1Pe 3:21", "n": "", "vs": [[21, "وعملية النجاة هذه مصورة في المعمودية التي لا نقصد بها أن نغتسل من أوساخ أجسامنا، بل هي تعهد ضمير صالح أمام الله بفضل قيامة يسوع المسيح،"]]}, {"l": "1Jo 5:6", "n": "", "vs": [[6, "فيسوع المسيح وحده جاءنا بالماء والدم. لا بالماء فقط، بل بالماء والدم معا. هذه الحقيقة، يشهد لها الروح القدس: لأنه هو الحق ذاته."]]}], "kwAr": "بغسل الماء", "noteAr": ""}, {"kw": "by", "raw": "Joh_15:8, Joh_17:7; Jam_1:18; 1Pe_1:22, 1Pe_1:23", "note": "", "refs": [{"l": "Joh 15:8", "n": "", "vs": [[8, "بهذا يتمجد أبي: أن تنتجوا ثمرا كثيرا فتكونون حقا تلاميذي."]]}, {"l": "Joh 17:7", "n": "", "vs": [[7, "وعرفوا الآن أن كل ما وهبته لي فهو منك،"]]}, {"l": "Jam 1:18", "n": "", "vs": [[18, "وهو قد شاء أن يجعلنا أولادا له، فولدنا بكلمته، كلمة الحق. وغايته أن نكون باكورة خليقته."]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}, {"l": "1Pe 1:23", "n": "", "vs": [[23, "فأنتم قد ولدتم ولادة ثانية لا من زرع بشري يفنى، بل مما لا يفنى: بكلمة الله الحية الباقية إلى الأبد."]]}], "kwAr": "بالكلمة", "noteAr": ""}], "arS": [["لكي ", []], ["يقدسها", ["G37"]], [" ", []], ["مطهرا", ["G2511"]], [" إياها ", []], ["بغسل", ["G3067"]], [" ", []], ["الماء", ["G5204"]], ["، ", []], ["بالكلمة", ["G4487"]], ["،", []]]}, {"c": 5, "v": 27, "text": "حتى يزفها إلى نفسه كنيسة بهية لا يشوبها عيب أو تجعد أو أية نقيصة مشابهة بل تكون مقدسة خالية من العيوب.", "groups": [{"kw": "he", "raw": "2Co_4:14, 2Co_11:2; Col_1:22, Col_1:28; Jud_1:24", "note": "", "refs": [{"l": "2Co 4:14", "n": "", "vs": [[14, "ونحن عالمون أن الذي أقام الرب يسوع من الموت سوف يقيمنا نحن أيضا مع يسوع، ويوقفنا في حضرته بصحبتكم."]]}, {"l": "2Co 11:2", "n": "", "vs": [[2, "فإني أغار عليكم غيرة من عند الله لأني خطبتكم لرجل واحد هو المسيح، لأقدمكم إليه عذراء عفيفة."]]}, {"l": "Col 1:22", "n": "", "vs": [[22, "قد صالحكم الآن في جسد بشرية (ابنه) بالموت. وذلك لكي يحضركم فتمثلوا أمامه وأنتم قديسون بلا ذنب ولا لوم."]]}, {"l": "Col 1:28", "n": "", "vs": [[28, "هذا السر نعلنه نحن، واعظين كل إنسان، ومعلمين كل إنسان، في كل حكمة، لكي نحضر كل إنسان كاملا في المسيح."]]}, {"l": "Jud 1:24", "n": "", "vs": [[24, "وللقادر أن يحرسكم من السقوط حتى يوصلكم إلى المثول أمامه في المجد مبتهجين ولا عيب فيكم …"]]}], "kwAr": "حتى يزفها إلى نفسه", "noteAr": ""}, {"kw": "glorious", "raw": "Psa_45:13, Psa_87:3; Isa_60:15-20, Isa_62:3; Jer_33:9; Heb_12:22-24; Rev_7:9-17, 21:10-26", "note": "", "refs": [{"l": "Psa 45:13", "n": "", "vs": [[13, "كلها مجد ابنة الملك في قصرها. ثيابها منسوجة بذهب."]]}, {"l": "Psa 87:3", "n": "", "vs": [[3, "يتحدثون عنك بأمور مجيدة يامدينة الله."]]}, {"l": "Isa 60:15-20", "n": "", "vs": [[15, "وبعد أن كنت مهجورة ممقوتة لا يعبر بك أحد، سأجعلك بهية إلى الأبد، وفرح كل الأجيال،"], [16, "وتشربين لبن الأمم، وترضعين ثدي الملوك، وتدركين أني أنا الرب مخلصك وفاديك عزيز يعقوب."], [17, "وعوضا عن النحاس أجلب لك الذهب، وبدل الحديد آتي لك بالفضة، وعوض الخشب نحاسا، وبدل الحجارة حديدا، وأجعل ولاتك مصدر سلام، ومسخريك يعاملونك بالعدل."], [18, "ولا يسمع بظلم في أرضك، ولا بدمار أو خراب داخل تخومك، وتدعين أسوارك خلاصا، وبواباتك تسابيح."], [19, "ولا تعود الشمس نورا لك في النهار ولا يشرق ضوء القمر عليك لأن الرب يكون نورك الأبدي، وإلهك يكون مجدك."], [20, "ولا تغرب شمسك من بعد، ولا يتضاءل قمرك، لأن الرب يكون نورك الأبدي، وتنقضي أيام مناحتك."]]}, {"l": "Isa 62:3", "n": "", "vs": [[3, "وتكونين تاج جمال في يد الرب، وإكليلا ملكيا في كف إلهك."]]}, {"l": "Jer 33:9", "n": "", "vs": [[9, "وتصبح هذه المدينة مبعث سرور لي، وتسبحة وافتخارا لدى جميع أمم الأرض التي يبلغها كل ما أسديته من خير إليها، فتخاف وترتعد بفضل ما أغدقته عليها من إحسان وازدهار."]]}, {"l": "Heb 12:22-24", "n": "", "vs": [[22, "ولكنكم قد اقتربتم إلى جبل صهيون، إلى مدينة الله الحي، أورشليم السماوية. بل تقدمتم إلى حفلة يجتمع فيها عدد لا يحصى من الملائكة،"], [23, "إلى كنيسة تجمع أبناء لله أبكارا، أسماؤهم مكتوبة في السماء. بل إلى الله نفسه، ديان الجميع، وإلى أرواح أناس بررهم الله وجعلهم كاملين."], [24, "كذلك، تقدمتم إلى يسوع، وسيط العهد الجديد، وإلى دمه المرشوش الذي يتكلم مطالبا بأفضل مما طالب به دم هابيل."]]}, {"l": "Rev 7:9-17", "n": "", "vs": [[9, "ثم نظرت، فرأيت جمعا كثيرا لا يحصى، من كل أمة وقبيلة وشعب ولغة، واقفين أمام العرش وأمام الحمل، وقد ارتدوا ثيا با بيضاء، وأمسكوا بأيديهم سعف النخل،"], [10, "وهم يهتفون بصوت عال: «الخلاص من عند إلهنا الجالس على العرش ومن عند الحمل!»"], [11, "واجتمع الملائكة جميعا حول العرش، ومعهم الشيوخ والكائنات الحية الأربعة، وخروا على وجوههم أمام العرش سجودا لله،"], [12, "قائلين: «آمين! لإلهنا البركة والمجد والحكمة والشكر والإجلال والقدرة والقوة إلى أبد الآبدين. آمين!»"], [13, "وسألني أحد الشيوخ: «أتعلم من هم هؤلاء الذين يرتدون الثياب البيضاء، وهل تعرف من أين أتوا؟»"], [14, "فأجبته: «أنت أعلم ياسيدي!» فقال: «هؤلاء هم الذين أتوا من الضيقة العظيمة، وقد غسلوا ثيابهم وبيضوها بدم الحمل."], [15, "لهذا هم أمام عرش الله يخدمونه في هيكله ليلا ونهارا والجالس على العرش يبسط خيمته عليهم،"], [16, "فلن يجوعوا ولن يعطشوا، ولن تضربهم الشمس ولا أي حر،"], [17, "لأن الحمل الذي في وسط العرش يرعاهم ويقودهم إلى ينابيع ماء الحياة، ويمسح الله كل دمعة من عيونهم»."]]}, {"l": "Rev 21:10-26", "n": "", "vs": [[10, "وأخذني بالروح إلى قمة جبل ضخم عال، وأراني المدينة المقدسة أورشليم نازلة من السماء من عند الله"], [11, "ولها مجد الله، وهي تتلألأ كالأحجار الكريمة، وكأنها من حجر اليشب البلوري!"], [12, "لها سور ضخم عال واثنا عشر بابا يحرسها اثنا عشر ملاكا، وقد كتبت عليها أسماء أسباط إسرائيل الاثني عشر؛"], [13, "إلى الشرق ثلاثة أبواب؛ وإلى الشمال ثلاثة أبواب، وإلى الجنوب ثلاثة أبواب؛ وإلى الغرب ثلاثة أبواب."], [14, "ويقوم سور المدينة على اثنتي عشرة دعامة كتبت عليها أسماء رسل الحمل الاثني عشر."], [15, "وكان الملاك الذي يكلمني يمسك قصبة من الذهب ليقيس بها المدينة وأبوابها وسورها."], [16, "وكانت أرض المدينة مربعة، طولها يساوي عرضها، فلما قاسها بالقصبة تبين أن ضلعها يساوي ألفين وأربعمئة كيلومتر، وهي متساوية الطول والعرض والارتفاع."], [17, "ثم قاس السور، فتبين أنه يساوي مئة وأربعا وأربعين ذراعا، وكان الملاك يستعمل قياسا يعادل ذراع إنسان."], [18, "كانت المدينة مبنية من ذهب خالص شفاف كالزجاج النقي. أما سورها فمن اليشب،"], [19, "وهو قائم على اثنتي عشرة دعامة مرصعة بالأحجار الكريمة: كانت الدعامة الأولى من اليشب؛ والثانية من الياقوت الأزرق؛ والثالثة من العقيق الأبيض؛ والرابعة من الزمرد الذبابي؛"], [20, "والخامسة من الجزع العقيقي؛ والسادسة من العقيق الأحمر؛ والسابعة من الزبرجد؛ والثامنة من الزمرد السلقي؛ والتاسعة من الياقوت الأصفر، والعاشرة من العقيق الأخضر؛ والحادية عشرة من الأسمانجوني؛ والثانية عشرة من الجمشت."], [21, "أما الأبواب الاثنا عشر فهي اثنتا عشرة لؤلؤة: كل باب لؤلؤة واحدة. وساحة المدينة من ذهب خالص كالزجاج الشفاف."], [22, "ولم أجد في المدينة هيكلا، لأن الرب الإله القادر على كل شيء والحمل هما هيكلها."], [23, "ولم تكن المدينة في حاجة إلى نور الشمس أو القمر، لأن مجد الله ينيرها، والحمل مصباحها."], [24, "ستسير بنورها الأمم، ويأتيها ملوك الأرض بكنوزهم."], [25, "ولا تقفل أبوابها أبدا طول النهار، لأن الليل لا يأتي عليها!"], [26, "وستحمل إليها كنوز الأمم وأمجادها."]]}], "kwAr": "كنيسة بهية", "noteAr": ""}, {"kw": "not", "raw": "Son_4:7; Heb_9:14; 1Pe_1:19, 1Pe_1:19; 2Pe_3:14", "note": "", "refs": [{"l": "Son 4:7", "n": "", "vs": [[7, "كلك جميلة ياحبيبتي ولا عيب فيك."]]}, {"l": "Heb 9:14", "n": "", "vs": [[14, "فكم بالأحرى دم المسيح الذي قدم نفسه لله بروح أزلي ذبيحة لا عيب فيها، يطهر ضمائرنا من الأعمال الميتة لنعبد الله الحي."]]}, {"l": "1Pe 1:19", "n": "", "vs": [[19, "بل كانت دما ثمينا، دم المسيح، ذلك الحمل الطاهر الذي ليس فيه عيب ولا دنس!"]]}, {"l": "1Pe 1:19", "n": "", "vs": [[19, "بل كانت دما ثمينا، دم المسيح، ذلك الحمل الطاهر الذي ليس فيه عيب ولا دنس!"]]}, {"l": "2Pe 3:14", "n": "", "vs": [[14, "فبينما تنتظرون إتمام هذا الوعد، أيها الأحباء، اجتهدوا أن يجدكم الرب في سلام، خالين من الدنس والعيب."]]}], "kwAr": "لا يشوبها عيب", "noteAr": ""}, {"kw": "but", "raw": "Eph_1:4; 2Co_11:2; Col_1:22, Col_1:28; 1Th_5:23; Jud_1:21; Rev_21:27", "note": "", "refs": [{"l": "Eph 1:4", "n": "", "vs": [[4, "كما كان قد اختارنا فيه قبل تأسيس العالم، لنكون قديسين بلا لوم أمامه."]]}, {"l": "2Co 11:2", "n": "", "vs": [[2, "فإني أغار عليكم غيرة من عند الله لأني خطبتكم لرجل واحد هو المسيح، لأقدمكم إليه عذراء عفيفة."]]}, {"l": "Col 1:22", "n": "", "vs": [[22, "قد صالحكم الآن في جسد بشرية (ابنه) بالموت. وذلك لكي يحضركم فتمثلوا أمامه وأنتم قديسون بلا ذنب ولا لوم."]]}, {"l": "Col 1:28", "n": "", "vs": [[28, "هذا السر نعلنه نحن، واعظين كل إنسان، ومعلمين كل إنسان، في كل حكمة، لكي نحضر كل إنسان كاملا في المسيح."]]}, {"l": "1Th 5:23", "n": "", "vs": [[23, "وإله السلام نفسه يقدسكم إلى التمام ويحفظكم سالمين، روحا ونفسا وجسدا، لتكونوا بلا لوم عند عودة ربنا يسوع المسيح."]]}, {"l": "Jud 1:21", "n": "", "vs": [[21, "واحفظوا أنفسكم في محبة الله، منتظرين رحمة ربنا يسوع المسيح إذ يعود ويأخذكم لتحيوا معه إلى الأبد."]]}, {"l": "Rev 21:27", "n": "", "vs": [[27, "ولن يدخلها شيء نجس، ولا الذين يعملون القبائح ويدجلون، بل فقط الذين كتبت أسماؤهم في سجل الحياة للحمل!"]]}], "kwAr": "بل تكون مقدسة", "noteAr": ""}], "arS": [["حتى ", []], ["يزفها", ["G3936"]], [" إلى ", []], ["نفسه", ["G1438"]], [" ", []], ["كنيس 04"]], [" ", []], ["جسده", ["G4561"]], [" ", []], ["البتة", ["G4218"]], ["، بل ", []], ["يغذيه", ["G1625"]], [" ", []], ["ويعتني به", ["G2282"]], ["، كما يعامل ", []], ["المسيح", ["G2962"]], [" أيضا ", []], ["الكنيسة", ["G1577"]], [".", []]]}, {"c": 5, "v": 30, "text": "فإننا نحن أعضاء جسده.", "groups": [{"kw": "", "raw": "Eph_1:23; Gen_2:23; Rom_12:5; 1Co_6:15, 12:12-27; Col_2:19", "note": "", "refs": [{"l": "Eph 1:23", "n": "", "vs": [[23, "التي هي جسده وكماله، هو الذي يكمل الكل في الكل."]]}, {"l": "Gen 2:23", "n": "", "vs": [[23, "فقال آدم: «هذه الآن عظم من عظامي ولحم من لحمي. فهي تدعى امرأة لأنها من امريء أخذت»."]]}, {"l": "Rom 12:5", "n": "", "vs": [[5, "فكذلك نحن الكثيرين جسد واحد في المسيح، وكلنا أعضاء بعضنا لبعض."]]}, {"l": "1Co 6:15", "n": "", "vs": [[15, "أما تعلمون أن أجسادكم هي أعضاء المسيح؟ فهل يجوز أن آخذ أعضاء المسيح وأجعلها أعضاء زانية؟ حاشا!"]]}, {"l": "1Co 12:12-27", "n": "", "vs": [[12, "فكما أن الجسد واحد وله أعضاء كثيرة، ولكن أعضاء الجسد كلها تشكل جسما واحدا مع أنها كثيرة، فكذلك حال المسيح أيضا."], [13, "فإننا، بالروح الواحد، قد تعمدنا جميعا لنصير جسدا واحدا، سواء كنا يهودا أم يونانيين، عبيدا أم أحرارا، وقد سقينا جميعا الروح الواحد."], [14, "فليس الجسد عضوا واحدا بل مجموعة أعضاء."], [15, "فإن قالت الرجل: «لأني لست يدا، لست من الجسد!» فهل تصبح من خارج الجسد فعلا؟"], [16, "وإن قالت الأذن: «لأني لست عينا، لست من الجسد!» فهل تصبح من خارج الجسد فعلا؟"], [17, "فلو كان الجسد كله عينا، فكيف كنا نسمع؟ ولو كان كله أذنا، فكيف كنا نشم؟"], [18, "على أن الله قد رتب كلا من الأعضاء في الجسد كما أراد."], [19, "فلو كانت كلها عضوا واحدا، فكيف يتكون الجسد؟"], [20, "فالواقع أن الأعضاء كثيرة، والجسد واحد."], [21, "وهكذا، لا تستطيع العين أن تقول لليد: «أنا لا أحتاج إليك!» ولا الرأس أن تقول للرجلين: «أنا لا أحتاج إليكما!»،"], [22, "بل بالأحرى جدا، أعضاء الجسد التي تبدو أضعف الأعضاء هي ضرورية،"], [23, "وتلك التي نعتبرها أقل ما في الجسد كرامة، نكسوها بإكرام أوفر. والأعضاء غير اللائقة يكون لها لياقة أوفر؛"], [24, "أما اللائقة، فلا تحتاج إلى ذلك. ولكن الله أحكم صنع الجسد بجملته، معطيا كرامة أوفر لما تنقصه الكرامة،"], [25, "لكي لا يكون في الجسد انقسام بل يكون بين الأعضاء اهتمام واحد لمصلحة الجسد."], [26, "فحين يصيب الألم واحدا من الأعضاء، تشعر الأعضاء الباقية معه بالألم. وحين ينال واحد من الأعضاء إكراما، تفرح معه الأعضاء الباقية."], [27, "فالواقع أنكم أنتم جميعا جسد المسيح، وأعضاء فيه كل بمفرده."]]}, {"l": "Col 2:19", "n": "", "vs": [[19, "وهو غير ممسك بالرأس الذي منه يتلقى الجسد كله غذاءه وتماسكه بالمفاصل والأوصال، فينمو النمو الذي يمنحه الله ."]]}], "kwAr": "", "noteAr": ""}], "arS": [["فإننا نحن ", []], ["أعضاء", ["G3196"]], [" ", []], ["جسده", ["G4983"]], [".", []]]}, {"c": 5, "v": 31, "text": "لذلك يستقل الزوج عن أبيه وأمه، ويتحد بزوجته، فيصير الاثنان جسدا واحدا.", "groups": [{"kw": "", "raw": "Gen_2:24; Mat_19:5; Mar_10:7, Mar_10:8; 1Co_6:16", "note": "", "refs": [{"l": "Gen 2:24", "n": "", "vs": [[24, "لهذا، فإن الرجل يترك أباه وأمه ويلتصق بامرأته، ويصيران جسدا واحدا."]]}, {"l": "Mat 19:5", "n": "", "vs": [[5, "وقال: لذلك يترك الرجل أباه وأمه ويتحد بزوجته، فيصير الاثنان جسدا واحدا؟"]]}, {"l": "Mar 10:7", "n": "", "vs": [[7, "لذلك يترك الرجل أباه وأمه ويتحد بزوجته،"]]}, {"l": "Mar 10:8", "n": "", "vs": [[8, "فيصير الاثنان جسدا واحدا. فلا يكونان بعد اثنين بل جسدا واحدا."]]}, {"l": "1Co 6:16", "n": "", "vs": [[16, "أوما تعلمون أن من اقترن بزانية صار معها جسدا واحدا؟ فإنه يقول: «إن الاثنين يصيران جسدا واحدا»."]]}], "kwAr": "", "noteAr": ""}], "arS": [["لذلك", ["G473", "G5127"]], [" يستقل ", []], ["الزوج", ["G444"]], [" عن ", []], ["أبيه", ["G3962"]], [" ", []], ["وأمه", ["G3384"]], ["، ", []], ["ويتحد", ["G4347"]], [" ", []], ["بزوجته", ["G1135"]], ["، فيصير ", []], ["الاثنان", ["G1417"]], [" ", []], ["جسدا", ["G4561"]], [" ", []], ["واحدا", ["G3391"]], [".", []]]}, {"c": 5, "v": 32, "text": "هذا السر عظيم ولكنني أشير به إلى المسيح والكنيسة!", "groups": [{"kw": "a great", "raw": "Eph_6:19; Col_2:2; 1Ti_3:8, 1Ti_3:16", "note": "", "refs": [{"l": "Eph 6:19", "n": "", "vs": [[19, "ولأجلي كي ألهم ما أنطق به كلما فتحت فمي لأعلن بجرأة سر الإنجيل"]]}, {"l": "Col 2:2", "n": "", "vs": [[2, "بغرض أن تتشجع قلوبهم وتكون كلها متحدة في المحبة، لبلوغ الإدراك التام بكل غناه، لمعرفة سر الله، أي المسيح،"]]}, {"l": "1Ti 3:8", "n": "", "vs": [[8, "أما المدبرون، فيجب أن يكونوا أيضا ذوي رصانة، لا ذوي لسانين، ولا مدمنين للخمر، لا ساعين إلى المكسب الخسيس."]]}, {"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}], "kwAr": "هذا السر عظيم", "noteAr": ""}, {"kw": "speak", "raw": "Psa_45:9-17; Song 1:1-8:14; Isa_54:5, Isa_62:4, Isa_62:5; Joh_3:29; 2Co_11:2; Rev_19:7, Rev_19:8, Rev_21:2", "note": "", "refs": [{"l": "Psa 45:9-17", "n": "", "vs": [[9, "أميرات بين حظياتك. جلست الملكة عن يمينك مزينة بذهب أوفير ."], [10, "اسمعي يابنت وانظري، وأرهفي إلي أذنك، وانسي شعبك وبيت أبيك"], [11, "فيشتهي الملك جمالك، لأنه هو سيدك فاسجدي له."], [12, "بنت صور أغنى الشعوب تسترضيك بهدية."], [13, "كلها مجد ابنة الملك في قصرها. ثيابها منسوجة بذهب."], [14, "تزف إلى الملك بحلل مطرزة، ووصيفاتها العذارى يتبعنها قادمات إليك في موكب حافل."], [15, "يحضرن بفرح وابتهاج. يدخلن إلى قصر الملك."], [16, "يصبح أبناؤك يوما ملوكا كآبائهم فيتربعون على عروش في كل الأرض."], [17, "أخلد ذكرى اسمك في كل الأجيال، وتحمدك الشعوب إلى الدهر والأبد."]]}, {"l": "Son 1:1-8:14", "n": "", "vs": [[1, "هذا نشيد الأناشيد لسليمان."], [2, "(المحبوبة): ليلثمني بقبلات فمه، لأن حبك ألذ من الخمر."], [3, "رائحة عطورك شذية، واسمك أريج مسكوب؛ لذلك أحبتك العذارى."], [4, "اجذبني وراءك فنجري، أدخلني الملك إلى مخادعه. نبتهج بك ونفرح، ونطري حبك أكثر من الخمر، فالذين أحبوك محقون."], [5, "سمراء أنا، ولكنني رائعة الجمال يابنات أورشليم. أنا سمراء كخيام قيدار. أو كسرادق سليمان."], [6, "(المحبوبة): لا تحدقن إلي لأنني سمراء، فإن الشمس قد لوحتني. إخوتي قد غضبوا مني فأقاموني ناطورة للكروم، أما كرمي فلم أنطره."], [7, "قل لي يامن تحبه نفسي، أين ترعى قطعانك وأين تربض بها عند الظهيرة؟ فلماذا أكون كامرأة مقنعة، أتجول بجوار قطعان أصحابك؟"], [8, "(المحب): إن كنت لا تعلمين ياأجمل النساء، فاقتفي أثر الغنم، وارعي جداءك عند مساكن الرعاة."], [9, "إني أشبهك ياحبيبتي بفرس في مركبات فرعون."], [10, "ما أجمل خديك بسموط، وعنقك بالقلائد الذهبية."], [11, "سنصنع لك أقراطا من ذهب مع جمان من فضة."], [12, "(المحبوبة) بينما الملك مستلق على أريكته فاح نارديني بأريجه."], [13, "حبيبي صرة مر لي، هاجع بين نهدي."], [14, "حبيبي لي عنقود حناء في كروم عين جدي."], [15, "(المحب): كم أنت جميلة ياحبيبتي، كم أنت جميلة! عيناك حمامتان!"], [16, "(المحبوبة): كم أنت وسيم ياحبيبي وجذاب حقا! أنت حلو وأريكتنا مخضرة."], [17, "عوارض بيتنا خشب أرز وروافدنا خشب سرو."], [1, "(المحبوبة): أنا وردة شارون، سوسنة الأودية."], [2, "(المحب): كسوسنة بين أشواك، هكذا حبيبتي بين البنات."], [3, "(المحبوبة): حبيبي بين الفتيان كشجرة تفاح بين أشجار الوعر، تحت ظله اشتهيت أن أجلس، وثمره حلو لحلقي."], [4, "أتى بي إلى قاعة احتفاله، ورايته فوقي محبة."], [5, "أسندوني بأقراص الزبيب، أنعشوني بالتفاح، فإني مريضة حبا."], [6, "شماله تحت رأسي، ويمينه تعانقني."], [7, "أستحلفكن يابنات أورشليم بظباء الصحراء وأيائلها ألا توقظن أو تنبهن حبيبي حتى يشاء."], [8, "هذا صوت حبيبي! ها هو آت طافرا على الجبال واثبا فوق التلال."], [9, "حبيبي كظبي أو كالأيل الفتي. ها هو واقف وراء جدارنا يرنو من الكوى ويسترق النظر من خلال النوافذ المشبكة."], [10, "خاطبني حبيبي وقال: انهضي ياحبيبتي ياجميلتي وتعالي معي،"], [11, "فها الشتاء قد انقضى، وكف المطر وزال."], [12, "وأزهرت الأرض، وحل موسم التغريد، وتردد هديل اليمام في أرضنا."], [13, "قد أنبتت التينة فجها، ونشرت الكروم المزهرة أريجها، فانهضي ياحبيبتي ياجميلتي وتعالي."], [14, "(المحب): ياحمامتي اللائذة بشقوق الصخر ومخابيء المعاقل، أريني وجهك وأسمعيني صوتك، لأن صوتك عذب ومحياك رائع."], [15, "اقتنصوا لنا الثعالب الصغار التي تتلف الكروم، فإن كرومنا قد أزهر ت."], [16, "(المحبوبة): حبيبي لي وأنا له، هو يرعى قطيعه بين السوسن."], [17, "إلى أن ينبلج النهار وتنهزم الظلال، ارجع ياحبيبي وكن كالظبي أو الأيل الفتي على جبال الأطياب."], [1, "(المحبوبة): طوال الليل على مضجعي طلبت بشوق من تحبه نفسي، فما وجدته."], [2, "سأنهض الآن أطوف في المدينة وأتجول في شوارعها وساحاتها، ألتمس من تحبه نفسي. وهكذا رحت ألتمسه فما وجدته."], [3, "وعثر علي الحراس المتجولون في المدينة، فسألت: أشاهدتم من تحبه نفسي؟"], [4, "وما كدت أتجاوزهم حتى وجدت من تحبه نفسي، فتشبثت به ولم أطلقه حتى أدخلته بيت أمي ومخدع من حملت بي."], [5, "استحلفكن يابنات أورشليم بظباء الصحراء وأيائلها ألا توقظن أو تنبهن الحبيب حتى يشاء."], [6, "(نشيد بنات أورشليم): من هذه الصاعدة من القفر كأعمدة من دخان معطرة بالمر واللبان وكل عطور التاجر؟"], [7, "ها هي أريكة سليمان يحف به ستون بطلا من جبابرة إسرائيل."], [8, "جميعهم مدججون بالسيوف متمرسون على الحرب، تتدلى سيوفهم على جوانبهم تأهبا لأهوال الليل."], [9, "قد صنع الملك سليمان كرسي العرش من خشب لبنان."], [10, "وصنع أعمدته فضة ومتكأه ذهبا ومقعده أرجوانا، وغطاؤه الداخلي رصعته بنات أورشليم محبة."], [11, "(المحبوبة): اخرجن يابنات صهيون وانظرن الملك سليمان مكللا بالتاج الذي توجته به أمه في يوم عرسه، في يوم بهجة قلبه."], [1, "(المحب): لشد ما أنت جميلة ياحبيبتي، لشد ما أنت جميلة! عيناك من وراء نقابك كحمامتين، وشعرك لسواده كقطيع معز منحدر من جبل جلعاد."], [2, "أسنانك كقطيع مجزوز خارج من الاغتسال، كل واحدة ذات توأم، وما فيها عقيم."], [3, "شفتاك كخيط من القرمز، وحديث فمك عذب، وخداك كفلقتي رمانة خلف نقابك."], [4, "عنقك مماثل لبرج داود المشيد ليكون قلعة للسلاح، حيث علق فيه ألف ترس من تروس المحاربين الصناديد."], [5, "نهداك كخشفتي ظبية توأمين يرعيان بين السوسن."], [6, "وما يكاد يتنفس النهار وتنهزم الظلال حتى أنطلق إلى جبل المر وإلى تل اللبان."], [7, "كلك جميلة ياحبيبتي ولا عيب فيك."], [8, "تعالي معي من لبنان ياعروسي. تعالي معي من لبنان! انظري من قمة جبل أمانة، من رأس سنير وحرمون، في عرين الأسود، من جبال النمور."], [9, "قد سلبت قلبي، ياأختي ياعروسي! قد سلبت قلبي بنظرة عينيك وقلادة عنقك."], [10, "ما أعذب حبك ياأختي ياعروسي! لكم حبك ألذ من الخمر، وأريج أطيابك أزكى من كل العطور."], [11, "شفتاك تقطران شهدا أيتها العروس، وتحت لسانك عسل ولبن، ورائحة ثيابك كشذى لبنان."], [12, "أنت جنة مغلقة ياأختي العروس. أنت عين مقفلة وينبوع مختوم!"], [13, "أغراسك فردوس رمان مع خيرة الأثمار والحناء والناردين."], [14, "ناردين وزعفران، قصب الذريرة وقرفة مع كل أصناف اللبان والمر والعود مع أفخر العطور."], [15, "أنت ينبوع جنات وبئر مياه حية وجداول دافقة من لبنان."], [16, "(المحبوبة): استيقظي ياريح الشمال، وهبي ياريح الجنوب، هبي على جنتي فينتشر عبيرها. ليقبل حبيبي إلى جنته ويتذوق أطيب أثمارها."], [1, "(المحب): قد جئت إلى جنتي ياأختي، ياعروسي، وقطفت مري مع أطيابي، وأكلت شهدي مع عسلي، وشربت خمري مع لبني.(بنات أورشليم): كلوا أيها الخلان. اشربوا حتى الانتشاء أيها المحبون."], [2, "(المحبوبة): قد نمت ولكن قلبي كان مستيقظا. آه، اسمعوا! ها صوت حبيبي قارعا قائلا: افتحي لي ياأختي، ياحبيبتي، ياحمامتي، ياكاملتي! فإن رأسي قد ابتل من الندى وخصائلي من طل الليل."], [3, "فقلت: قد خلعت ثوبي فكيف أرتديه ثانية؟ غسلت قدمي فكيف أوسخهما؟"], [4, "مد حبيبي يده من كوة الباب، فتحركت له مشاعري،"], [5, "فنهضت لأفتح له بيدين تقطران مرا، وأصابع تفيض عطرا على مزلاج الباب."], [6, "فتحت لحبيبي، لكن حبيبي كان قد انصرف وعبر ففارقتني نفسي حين ابتعد. بحثت عنه فلم أجده، دعوته فلم يجب."], [7, "وجدني الحراس المتجولون في المدينة، فانهالوا علي ضربا فجرحوني. نزع حراس الأسوار إزاري عني."], [8, "أستحلفكن يابنات أورشليم إن وجدتن حبيبي أن تبلغنه أني مريضة حبا."], [9, "(بنات أورشليم): بم يفوق حبيبك المحبين أيتها الجميلة بين النساء؟ بم يفوق حبيبك المحبين حتى تستحلفينا هكذا؟"], [10, "(المحبوبة): حبيبي متألق وأحمر، علم بين عشرة آلاف."], [11, "رأسه ذهب خالص وغدائره متموجة حالكة السواد كلون الغراب."], [12, "عيناه حمامتان عند مجاري المياه، مغسولتان مستقرتان في موضعهما."], [13, "خداه كخميلة طيب تفوحان عطرا، وشفتاه كالسوسن تقطران مرا شذيا."], [14, "يداه حلقتان من ذهب مدورتان ومرصعتان بالزبرجد، وجسمه عاج مصقول مغشى بالياقوت الأزر ق."], [15, "ساقاه عمودا رخام قائمتان على قاعدتين من ذهب نقي، طلعته كلبنان، كأبهى أشجار الأرز."], [16, "فمه عذب، وكله مشتهيات. هذا هو حبيبي وهذا هو خليلي يابنات أورشليم!"], [1, "(بنات أورشليم): أين ذهب حبيبك أيتها الجميلة بين النساء؟ إلى أين تحول حبيبك فنبحث عنه معك؟"], [2, "(المحبوبة): قد انطلق حبيبي إلى جنته، إلى خمائل الأطياب ليرعى في الروضات ويقطف السوسن."], [3, "أنا لحبيبي، وحبيبي لي، وهو يرعى بين السوسن."], [4, "(المحب): أنت جميلة ياحبيبتي كترصة، حسناء كأورشليم، وجليلة كجيش يرفع أعلامه."], [5, "أشيحي بعينيك عني فقد قهرتاني. شعرك كقطيع ماعز منحدر من جلعاد."], [6, "أسنانك في بياضها كقطيع غنم خارج من الاغتسال؛ كل واحدة منها ذات توأم وما فيها عقيم."], [7, "خداك تحت نقابك كفلقتي رمانة."], [8, "هناك ستون ملكة وثمانون سرية وعذارى لا يحصى لهن عدد."], [9, "لكنك ياحمامتي ياكاملتي فريدة، الابنة الوحيدة لأمها، الأعز على من أنجبتها. رأتها العذارى فطوبنها، وشاهدتها الملكات والسراري فأطرينها."], [10, "من هذه الطالعة كالفجر، الجميلة كالبدر، المشرقة كالشمس، الجليلة كجيش يرفع أعلامه؟"], [11, "(المحبوبة): نزلت إلى حديقة الجوز لأرى ثمر الوادي الجديد، وأنظر هل أزهر الكرم ونور الرمان؟"], [12, "وقبل أن أدرك ما يجري وجدت نفسي بين أمراء قومي فهربت."], [13, "(بنات أورشليم): ارجعي، ارجعي ياشولميث، ارجعي، ارجعي لنتأمل فيك.(المحبوبة): ماذا ترون في شولميث؟(المحب): مثل رقص صفين!"], [1, "(المحب): ما أرشق خطوات قدميك بالحذاء يابنت الأمير! فخذاك المستدير تان كجوهرتين صاغتهما يد صانع حاذق."], [2, "سرتك كأس مدورة، لا تحتاج إلى خمرة ممزوجة، وبطنك كومة حنطة مسيجة بالسوسن."], [3, "نهداك كخشفتي ظبية توأمين."], [4, "عنقك (مصقول) كبرج من عاج. عيناك (عميقتان ساكنتان) كبركتي حشبون عند باب بث ربيم. أنفك (شامخ) كبرج لبنان المشرف على دمشق،"], [5, "رأسك كالكرمل، وغدائر شعرك المتهدلة كأرجوان، قد وقع الملك أسير هذه الخصل."], [6, "ما أجملك أيتها الحبيبة وما ألذك بالمسرات!"], [7, "قامتك هذه مثل النخلة، ونهداك مثل العناقيد."], [8, "قلت: لأصعدن إلى النخلة وأمسكن بعذوقها، فيكون لي نهداك كعناقيد الكرم، وعبير أنفاسك كأريج التفاح."], [9, "فمك كأجود الخمر!(المحبوبة): لتكن سائغة لحبيبي، تسيل عذبة على شفاه النائمين."], [10, "أنا لحبيبي، وإلي تشوقه."], [11, "تعال ياحبيبي لنمض إلى الحقل ولنبت في القرى."], [12, "لنخرج مبكرين إلى الكروم، لنرى هل أفرخت الكرمة، وهل تفتحت براعمها، وهل نور الرمان؟ هناك أهبك حبي."], [13, "قد نشر اللفاح أريجه، وتدلت فوق بابنا أفخر الثمار، قديمها وحديثها، التي ادخرتها لك ياحبيبي."], [1, "(المحبوبة): ليتك كنت أخي الذي رضع ثدي أمي، حتى إذا التقيتك في الخارج أقبلك وليس من يلومني!"], [2, "ثم أقودك وأدخل بك بيت أمي التي تعلمني الحب، فأقدم لك خمرة ممزوجة من سلاف رماني."], [3, "شماله تحت رأسي، ويمينه تعانقني."], [4, "أستحلفكن يابنات أورشليم ألا توقظن ولا تنبهن الحبيب حتى يشاء."], [5, "(بنات أورشليم): من هذه الصاعدة من القفر متكئة على حبيبها؟(المحب): تحت شجرة التفاح حيث حبلت بك أمك، وحيث تمخضت بك وأنجبتك، أيقظت فيك أشواقك."], [6, "(المحبوبة): اجعلني كخاتم على قلبك، كوشم على ذراعك، فإن المحبة قوية كالموت، والغيرة قاسية كالهاوية. ولهيبها لهيب نار، كأنها نار الرب!"], [7, "لا يمكن للمياه الغزيرة أن تخمد المحبة، ولا تستطيع السيول أن تغمرها. لو بذل الإنسان كل ثروة بيته ثمنا للمحبة لاحتقرت أشد الاحتقار."], [8, "لنا أخت صغيرة لم ينم نهداها بعد، فماذا نصنع لأختنا في يوم خطبتها؟"], [9, "لو كانت سورا لبنينا عليه صرحا من فضة، ولو كانت بابا لدعمناه بألواح من أرز."], [10, "(المحبوبة): أنا كسور ونهداي كبرجين، حينئذ صرت في عينيه كاملة."], [11, "كان لسليمان كرم في بعل هامون، فعهد بالكرم إلى النواطير على أن يؤدي كل واحد منهم ألفا من الفضة لقاء الثمر."], [12, "لكن كرمي الذي لي هو أمامي. الألف لك ياسليمان، ومئتان من الفضة للنواطير."], [13, "(المحب): أنت أيتها الجالسة في الجنات، إن مرافقي يصغون بانتباه إلى صوتك، فأسمعيني إياه."], [14, "(المحبوبة): أسرع إلي كالهارب ياحبيبي، وكن كالظبي أو الأيل الفتي على جبال الأطياب!"]]}, {"l": "Isa 54:5", "n": "", "vs": [[5, "لأن صانعك هو بعلك، والرب القدير اسمه، وفاديك هو قدوس إسرائيل الذي يدعى إله كل الأرض."]]}, {"l": "Isa 62:4", "n": "", "vs": [[4, "ولا تعودين تدعين بالمهجورة، ولا يقال لأرضك من بعد خربة، بل تدعين «حفصيبة» (أي مسرتي بها)، وأرضك تدعى ذات بعل، لأن الرب يسر بك، وأرضك تصبح ذات بعل."]]}, {"l": "Isa 62:5", "n": "", "vs": [[5, "فكما يتزوج الشاب عذراء هكذا يتزوجك أبناؤك، وكما يفرح العريس بعروسه هكذا يبتهج الرب بك."]]}, {"l": "Joh 3:29", "n": "", "vs": [[29, "ومن له العروس، يكون هو العريس! أما صديق العريس، الذي يقف قربه ويسمعه، فيبتهج لفرحه بصوت العريس. وها إن فرحي هذا قد تم."]]}, {"l": "2Co 11:2", "n": "", "vs": [[2, "فإني أغار عليكم غيرة من عند الله لأني خطبتكم لرجل واحد هو المسيح، لأقدمكم إليه عذراء عفيفة."]]}, {"l": "Rev 19:7", "n": "", "vs": [[7, "لنفرح ونبتهج ونمجده، فإن عرس الحمل قد حان موعده، وعروسه قد هيأت نفسها،"]]}, {"l": "Rev 19:8", "n": "", "vs": [[8, "ووهب لها أن تلبس الكتان الأبيض الناصع!» والكتان يرمز إلى أعمال الصلاح التي قام بها القديسون."]]}, {"l": "Rev 21:2", "n": "", "vs": [[2, "وأنا رأيت المدينة المقدسة، أورشليم الجديدة، نازلة من السماء من عند الله، مجهزة كأنها عروس مزينة لعريسها."]]}], "kwAr": "ولكنني أشير به", "noteAr": ""}], "arS": [["هذا ", []], ["السر", ["G3466"]], [" ", []], ["عظيم", ["G3173"]], [" ولكنني ", []], ["أشير", ["G3004"]], [" به إلى ", []], ["المسيح", ["G5547"]], [" ", []], ["والكنيسة", ["G1577"]], ["!", []]]}, {"c": 5, "v": 33, "text": "إنما أنتم أيضا، كل بمفرده، ليحب كل واحد منكم زوجته كنفسه. وأما الزوجة، فعليها أن تهاب زوجها.", "groups": [{"kw": "let", "raw": "Eph_5:25, Eph_5:28, Eph_5:29; Col_3:19; 1Pe_3:7", "note": "", "refs": [{"l": "Eph 5:25", "n": "", "vs": [[25, "أيها الأزواج، أحبوا زوجاتكم مثلما أحب المسيح الكنيسة وبذل نفسه لأجلها،"]]}, {"l": "Eph 5:28", "n": "", "vs": [[28, "على هذا المثال يجب على الأزواج أن يحبوا زوجاتهم كأجسادهم. إن من يحب زوجته، يحب نفسه."]]}, {"l": "Eph 5:29", "n": "", "vs": [[29, "فلا أحد يبغض جسده البتة، بل يغذيه ويعتني به، كما يعامل المسيح أيضا الكنيسة."]]}, {"l": "Col 3:19", "n": "", "vs": [[19, "أيها الأزواج، أحبوا زوجاتكم، ولا تعاملوهن بقسوة."]]}, {"l": "1Pe 3:7", "n": "", "vs": [[7, "وأنتم، أيها الأزواج، إذ تساكنون زوجاتكم عالمين بأنهن أضعف منكم، أكرموهن باعتبارهن شريكات لكم في وراثة نعمة الحياة، لكي لا يعوق صلواتكم شيء."]]}], "kwAr": "ليحب كل واحد منكم زوجته", "noteAr": ""}, {"kw": "reverence", "raw": "Eph_5:22; 1Ki_1:31; Est_1:20; Heb_12:9; 1Pe_3:2-6", "note": "", "refs": [{"l": "Eph 5:22", "n": "", "vs": [[22, "أيتها الزوجات، اخضعن لأزواجكن، كما للرب."]]}, {"l": "1Ki 1:31", "n": "", "vs": [[31, "فخرت بثشبع على وجهها إلى الأرض ساجدة للملك وقالت: «ليحي سيدي الملك داود إلى الأبد!»"]]}, {"l": "Est 1:20", "n": "", "vs": [[20, "وهكذا يذيع أمر الملك الصادر عنه في كل أرجاء مملكته الشاسعة، فتعامل جميع النساء أزواجهن صغارا وكبارا باحترام»."]]}, {"l": "Heb 12:9", "n": "", "vs": [[9, "إن آباءنا الأرضيين كانوا يؤدبوننا ونحن أولاد، وكنا نحترمهم. أفلا يجدر بنا الآن أن نخضع خضوعا تاما لتأديب أبي الأرواح، لنحيا حياة فضلى؟"]]}, {"l": "1Pe 3:2-6", "n": "", "vs": [[2, "وذلك حين يلاحظ سلوكها الطاهر ووقارها."], [3, "وعلى المرأة ألا تعتمد الزينة الخارجية لإظهار جمالها، بضفر الشعر والتحلي بالذهب ولبس الثياب الفاخرة."], [4, "وإنما لتعتمد الزينة الداخلية، ليكون قلبها متزينا بروح الوداعة والهدوء. هذه هي الزينة التي لا تفنى، وهي غالية الثمن في نظر الله!"], [5, "وبها كانت تتزين النساء التقيات قديما، فكانت الواحدة منهن تتكل على الله وتخضع لزوجها."], [6, "فسارة، مثلا، كانت تطيع زوجها إبراهيم وتدعوه «سيدي». والمؤمنات اللواتي يقتدين بها، يثبتن أنهن بنات لها، إذ يتصرفن تصرفا صالحا، فلا يخفن أي تهديد."]]}], "kwAr": "فعليها أن تهاب زوجها", "noteAr": ""}], "arS": [["إنما أنتم أيضا، كل بمفرده، ", []], ["ليحب", ["G25"]], [" ", []], ["كل واحد", ["G1538"]], [" منكم ", []], ["زوجته", ["G1135"]], [" ", []], ["كنفسه", ["G1438"]], [". وأما ", []], ["الزوجة", ["G1135"]], ["، فعليها أن ", []], ["تهاب", ["G5399"]], [" ", []], ["زوجها", ["G435"]], [".", []]]}, {"c": 6, "v": 1, "text": "أيها الأولاد، أطيعوا والديكم في (رضى) الرب. فهذا هو الصواب:", "groups": [{"kw": "obey", "raw": "Gen_28:7, Gen_37:13; Lev_19:3; Deu_21:18; 1Sa_17:20; Est_2:20; Pro_1:8, Pro_6:20; Pro_23:22, Pro_30:11, Pro_30:17; Jer_35:14; Luk_2:51; Col_3:20-25", "note": "", "refs": [{"l": "Gen 28:7", "n": "", "vs": [[7, "وأن يعقوب أطاع والديه وارتحل إلى سهل أرام"]]}, {"l": "Gen 37:13", "n": "", "vs": [[13, "فقال إسرائيل ليوسف: ألا يرعى إخوتك الغنم عند شكيم؟ تعال لأرسلك إليهم."]]}, {"l": "Lev 19:3", "n": "", "vs": [[3, "ليوقر كل إنسان أمه وأباه، وراعوا سبوتي. فأنا الرب إلهكم."]]}, {"l": "Deu 21:18", "n": "", "vs": [[18, "إن كان لرجل ابن عنيد متمرد، لا يطيع أمر أبيه ولا قول أمه، ويؤدبانه ولكن من غير جدوى."]]}, {"l": "1Sa 17:20", "n": "", "vs": [[20, "فانطلق داود مبكرا في صباح اليوم التالي، بعد أن ترك الغنم في عهدة حارس، محملا بما أمره به أبوه، وبلغ المعسكر فيما كان الجيش خارجا للاصطفاف والهتاف للحرب."]]}, {"l": "Est 2:20", "n": "", "vs": [[20, "ولم تكن أستير قد كشفت عن جنسها وشعبها كما أوصاها مردخاي، وظلت تعمل بوصايا مردخاي وكأنها ما برحت في بيته تحت إشرافه."]]}, {"l": "Pro 1:8", "n": "", "vs": [[8, "استمع ياابني إلى توجيه أبيك ولا تتنكر لتعليم أمك."]]}, {"l": "Pro 6:20", "n": "", "vs": [[20, "ياابني احفظ وصايا أبيك ولا تتجاهل شريعة أمك."]]}, {"l": "Pro 23:22", "n": "", "vs": [[22, "استمع لأبيك الذي أنجبك، ولا تحتقر أمك إذا شاخت."]]}, {"l": "Pro 30:11", "n": "", "vs": [[11, "رب جيل يشتم أباه ولا يبارك أمه."]]}, {"l": "Pro 30:17", "n": "", "vs": [[17, "العين الساخرة بالأب، والتي تحتقر طاعة أمها، تقتلعها غربان الوادي، وتلتهمها فراخ النسور."]]}, {"l": "Jer 35:14", "n": "", "vs": [[14, "ها وصية يوناداب بن ركاب التي أوصى بها أبناءه قائلا لا تشربوا خمرا، قد نفذوها، فلم يشربوا خمرا إلى هذا اليوم، لأنهم أطاعوا أمر أبيهم. أما أنا فقد أنذرتكم منذ البدء فلم تسمعوا لي،"]]}, {"l": "Luk 2:51", "n": "", "vs": [[51, "ثم نزل معهما ورجع إلى الناصرة، وكان خاضعا لهما. وكانت أمه تحفظ هذه الأمور كلها في قلبها."]]}, {"l": "Col 3:20-25", "n": "", "vs": [[20, "أيها الأولاد، أطيعوا والديكم في كل أمر، لأن ذلك مرضي في الرب."], [21, "أيها الآباء، لا تثيروا غضب أولادكم لئلا يصيبهم الفشل."], [22, "أيها العبيد، أطيعوا في كل أمر سادتكم البشريين، فلا تعملوا بجد فقط حين تكون عيونهم عليكم، كمن يحاول إرضاء الناس، بل بقلب صادق خائفين الرب."], [23, "ومهما عملتم، فاجتهدوا فيه من صميم القلب، وكأنه للرب لا للناس،"], [24, "عالمين أنكم سوف تنالون المكافأة بالميراث من الرب. فإنما أنتم عبيد تخدمون الرب المسيح"], [25, "وأما من عمل شرا فسوف ينال جزاء عمله الشرير، وليس محاباة."]]}], "kwAr": "أطيعوا والديكم", "noteAr": ""}, {"kw": "in", "raw": "Eph_6:5, Eph_6:6; Rom_16:2; 1Co_15:58; Col_3:16, Col_3:17, Col_3:23, Col_3:24; 1Pe_2:13", "note": "", "refs": [{"l": "Eph 6:5", "n": "", "vs": [[5, "أيها العبيد، أطيعوا سادتكم البشريين بخوف وارتعاد، من قلب صادق، كمن يطيع المسيح،"]]}, {"l": "Eph 6:6", "n": "", "vs": [[6, "غير عاملين بجد فقط حين تكون عيونهم عليكم كمن يحاول إرضاء الناس، بل انطلاقا من كونكم عبيدا للمسيح،"]]}, {"l": "Rom 16:2", "n": "", "vs": [[2, "فاقبلوها في الرب قبولا يليق بالقديسين وقدموا لها أي عون تحتاج إليه منكم، لأنها هي كانت معينة لكثيرين ولي أنا أيضا."]]}, {"l": "1Co 15:58", "n": "", "vs": [[58, "إذن، ياإخوتي الأحباء، كونوا راسخين غير متزحزحين، كثيري الاجتهاد في عمل الرب دائما، عالمين أن جهدكم في الرب ليس عبثا!"]]}, {"l": "Col 3:16", "n": "", "vs": [[16, "لتسكن كلمة المسيح في داخلكم بغنى، في كل حكمة، معلمين وواعظين بعضكم بعضا، مرنمين بمزامير وتسابيح وأناشيد روحية في قلوبكم لله، رافعين له الحمد."]]}, {"l": "Col 3:17", "n": "", "vs": [[17, "ومهما كان ما تعملونه، بالقول أو بالفعل، فليجر كل شيء باسم الرب يسوع، رافعين به الشكر لله الآب."]]}, {"l": "Col 3:23", "n": "", "vs": [[23, "ومهما عملتم، فاجتهدوا فيه من صميم القلب، وكأنه للرب لا للناس،"]]}, {"l": "Col 3:24", "n": "", "vs": [[24, "عالمين أنكم سوف تنالون المكافأة بالميراث من الرب. فإنما أنتم عبيد تخدمون الرب المسيح"]]}, {"l": "1Pe 2:13", "n": "", "vs": [[13, "فإكراما للرب، اخضعوا لكل نظام يدير شؤون الناس: للملك، باعتباره صاحب السلطة العليا،"]]}], "kwAr": "في الرب", "noteAr": ""}, {"kw": "for", "raw": "Neh_9:13; Job_33:27; Psa_19:8, Psa_119:75, Psa_119:128; Hos_14:9; Rom_7:12, Rom_12:2; 1Ti_5:4", "note": "", "refs": [{"l": "Neh 9:13", "n": "", "vs": [[13, "ونزلت على جبل سيناء وخاطبتهم من السماء، وأعطيتهم أحكاما مستقيمة وشرائع صادقة وفرائض ووصايا صالحة،"]]}, {"l": "Job 33:27", "n": "", "vs": [[27, "ثم يرنم أمام الناس قائلا: لقد أخطأت وحرفت ما هو حق ولم أجاز عليه،"]]}, {"l": "Psa 19:8", "n": "", "vs": [[8, "وصايا الرب مستقيمة تفرح القلب. أمر الرب نقي ينير العينين."]]}, {"l": "Psa 119:75", "n": "", "vs": [[75, "قد علمت يارب أن أحكامك عادلة، وأنك بالحق أدبتني."]]}, {"l": "Psa 119:128", "n": "", "vs": [[128, "ولأني أحسب كل فرائضك مستقيمة في كل شيء، أبغض كل طريق باطل."]]}, {"l": "Hos 14:9", "n": "", "vs": [[9, "من هو حكيم فليسمع هذه الأمور، ومن هو فطن فليفهمها، لأن طرق الله مستقيمة، فيها يسلك الأبرار، أما المنافقون فيعثرون."]]}, {"l": "Rom 7:12", "n": "", "vs": [[12, "فالشريعة إذن مقدسة، والوصية مقدسة وعادلة وصالحة."]]}, {"l": "Rom 12:2", "n": "", "vs": [[2, "ولا تتكيفوا مع هذا العالم، بل تغيروا بتجديد الذهن، لتميزوا ما هي إرادة الله الصالحة المقبولة الكاملة."]]}, {"l": "1Ti 5:4", "n": "", "vs": [[4, "فإن كان للأرملة أولاد أو حفدة، فمن أول واجبات هؤلاء أن يتعلموا توقير أهلهم وأن يفوا حق والديهم. فإن هذا العمل مقبول في نظر الله."]]}], "kwAr": "فهذا هو الصواب", "noteAr": ""}], "arS": [["أيها ", []], ["الأولاد", ["G5043"]], ["، ", []], ["أطيعوا", ["G5219"]], [" ", []], ["والديكم", ["G1118"]], [" في (رضى) ", []], ["الرب", ["G2962"]], [". فهذا هو ", []], ["الصواب", ["G1342"]], [":", []]]}, {"c": 6, "v": 2, "text": "«أكرم أباك وأمك» وهذه أول وصية مرتبطة بوعد", "groups": [{"kw": "", "raw": "Exo_20:12; Deu_27:16; Pro_20:20; Jer_35:18; Eze_22:7; Mal_1:6; Mat_15:4-6; Mar_7:9-13; Rom_13:7", "note": "", "refs": [{"l": "Exo 20:12", "n": "", "vs": [[12, "أكرم أباك وأمك لكي يطول عمرك في الأرض التي يهبك إياها الرب إلهك."]]}, {"l": "Deu 27:16", "n": "", "vs": [[16, "ملعون كل من يستخف بأبيه وأمه. ويقول جميع الشعب: آمين."]]}, {"l": "Pro 20:20", "n": "", "vs": [[20, "من يشتم أباه أو أمه يطفيء الرب سراج حياته في الظلمة الحالكة."]]}, {"l": "Jer 35:18", "n": "", "vs": [[18, "وقال إرميا لبيت الركابيين: «هذا ما يعلنه الرب القدير إله إسرائيل: بما أنكم أطعتم وصية أبيكم يوناداب ونفذتم جميع أوامره وعملتم بها،"]]}, {"l": "Eze 22:7", "n": "", "vs": [[7, "فيك استخفوا بأب وأم وجاروا في وسطك على الغريب، واضطهدوا اليتيم والأرملة،"]]}, {"l": "Mal 1:6", "n": "", "vs": [[6, "إن الابن يكرم أباه والعبد سيده. فإن كنت أنا حقا أبا فأين كرامتي؟ وإن كنت حقا سيدا فأين مهابتي؟ إن الرب القدير يقول لكم: أيها الكهنة المزدرون باسمي؛ فتسألون: كيف ازدرينا باسمك؟"]]}, {"l": "Mat 15:4-6", "n": "", "vs": [[4, "فقد أوصى الله قائلا: أكرم أباك وأمك. ومن أهان أباه أو أمه، فليكن الموت عقابا له."], [5, "ولكنكم أنتم تقولون: من قال لأبيه أو أمه: إن ما أعولك به قد قدمته قربانا للهيكل،"], [6, "فهو في حل من إكرام أبيه وأمه. وأنتم، بهذا، تلغون ما أوصى به الله ، محافظة على تقاليدكم."]]}, {"l": "Mar 7:9-13", "n": "", "vs": [[9, "وقال لهم: «حقا أنكم رفضتم وصية الله لتحافظوا على تقليدكم أنتم!"], [10, "فإن موسى قال: أكرم أباك وأمك! وأيضا: من أهان أباه أو أمه، فليكن الموت عقابا له!"], [11, "ولكنكم أنتم تقولون: إذا قال أحد لأبيه أو أمه: إن ما كنت أعولك به قد جعلته قربانا، أي تقدمة (للهيكل)،"], [12, "فهو في حل من إعانة أبيه أو أمه!"], [13, "وهكذا تبطلون كلمة الله بتعليمكم التقليدي الذي تتناقلونه. وهناك أمور كثيرة مثل هذه تفعلونها! »"]]}, {"l": "Rom 13:7", "n": "", "vs": [[7, "فأدوا لكل واحد حقه: الضريبة لصاحب الضريبة والجزية لصاحب الجزية، والاحترام لصاحب الاحترام، والإكرام لصاحب الإكرام."]]}], "kwAr": "", "noteAr": ""}], "arS": [["«", []], ["أكرم", ["G5091"]], [" ", []], ["أباك", ["G3962"]], [" ", []], ["وأمك", ["G3384"]], ["» وهذه ", []], ["أول", ["G4413"]], [" ", []], ["وصية", ["G1785"]], [" مرتبطة ", []], ["بوعد", ["G1860"]]]}, {"c": 6, "v": 3, "text": "«لكي تلاقي الخير ويطول عمرك على الأرض!»", "groups": [{"kw": "", "raw": "Deu_4:40, Deu_5:16, Deu_6:3, Deu_6:18, Deu_12:25, Deu_12:28, Deu_22:7; Rth_3:1; Psa_128:1, Psa_128:2; Isa_3:10; Jer_42:6", "note": "", "refs": [{"l": "Deu 4:40", "n": "", "vs": [[40, "فاحفظوا اليوم ما أوصيكم به من شرائعه وأحكامه ليحسن الرب إليكم وإلى أولادكم من بعدكم، فيطيل أيامكم على الأرض التي وهبكم إياها إلى الأبد»."]]}, {"l": "Deu 5:16", "n": "", "vs": [[16, "أكرم أباك وأمك كما أمرك الرب إلهك، فتطول أيامك ويكون لك خير على الأرض التي يورثها لك الرب إلهك."]]}, {"l": "Deu 6:3", "n": "", "vs": [[3, "فأنصتوا يابني إسرائيل واحرصوا على العمل بها فتزدهروا وتتكاثروا جدا في أرض تفيض لبنا وعسلا، كما وعدكم الرب إله آبائكم."]]}, {"l": "Deu 6:18", "n": "", "vs": [[18, "واصنعوا ما هو صالح ومرضي لدى الرب لتزدهروا وتدخلوا وترثوا الأرض التي أقسم الرب لآبائكم،"]]}, {"l": "Deu 12:25", "n": "", "vs": [[25, "لا تأكلوه، لتنعموا أنتم وأولادكم من بعدكم بالخير، إذ صنعتم الحق في عيني الله."]]}, {"l": "Deu 12:28", "n": "", "vs": [[28, "فاحفظوا وأطيعوا جميع هذه الوصايا التي أنا أوصيكم بها لتتمتعوا أنتم وأولادكم من بعدكم بالخير إلى الأبد، إذ عملتم الصالح والحق في عيني الرب إلهكم."]]}, {"l": "Deu 22:7", "n": "", "vs": [[7, "أطلق الأم وخذ الفراخ لنفسك، فيكون لك خير وتطيل أيام حياتك."]]}, {"l": "Rut 3:1", "n": "", "vs": [[1, "وذات يوم قالت نعمي لكنتها راعوث: «هل أحاول أن أجد لك زوجا يرعاك فتنعمي بالخير؟"]]}, {"l": "Psa 128:1", "n": "", "vs": [[1, "طوباك يامن تتقي الرب وتسلك في طرقه."]]}, {"l": "Psa 128:2", "n": "", "vs": [[2, "لأنك تأكل من تعب يديك وتتمتع بالسعادة والخير."]]}, {"l": "Isa 3:10", "n": "", "vs": [[10, "ولكن بشروا الصديقين بالخير لأنهم سيتمتعون بثواب أعمالهم"]]}, {"l": "Jer 42:6", "n": "", "vs": [[6, "سواء كانت خيرا أو شرا، فنطيع صوت الرب إلهنا الذي نرسلك إليه، فننال خيرا إن أطعناه»."]]}], "kwAr": "", "noteAr": ""}], "arS": [["«لكي تلاقي ", []], ["الخير", ["G2095"]], [" ", []], ["ويطول عمرك", ["G3118"]], [" على ", []], ["الأرض", ["G1093"]], ["!»", []]]}, {"c": 6, "v": 4, "text": "وأنتم، أيها الآباء، لا تثيروا غضب أولادكم. وإنما ربوهم بتأديب الرب وتحريضه.", "groups": [{"kw": "ye", "raw": "Gen_31:14, Gen_31:15; 1Sa_20:30-34; Col_3:21", "note": "", "refs": [{"l": "Gen 31:14", "n": "", "vs": [[14, "فقالت راحيل وليئة: «هل بقي لنا نصيب وميراث في بيت أبينا؟"]]}, {"l": "Gen 31:15", "n": "", "vs": [[15, "ألم يعاملنا كأجنبيتين لأنه باعنا وأكل ثمننا أيضا؟"]]}, {"l": "1Sa 20:30-34", "n": "", "vs": [[30, "فاستشاط شاول غضبا على يوناثان وقال له: «يا ابن المتعوجة المتمردة، أتظن أنني لم أعلم أن انحيازك لابن يسى يفضي إلى خزيك وخزي أمك التي أنجبتك؟"], [31, "فمادام ابن يسى حيا فإنك لا تستقر أنت ولا مملكتك. والآن أرسل واقبض عليه، وأت به لأنه محكوم عليه بالموت»."], [32, "فأجاب يوناثان: «لماذا يقتل، وأي ذنب جناه؟»"], [33, "فصوب شاول الرمح نحوه ليطعنه، فأدرك يوناثان على الفور أن والده مصر على قتل داود."], [34, "فغادر المائدة والغضب الجامح يعصف به، من غير أن يقرب الطعام إذ ساءه تصرف والده المخزي من نحو داود. وكان ذلك في اليوم الثاني من أول الشهر."]]}, {"l": "Col 3:21", "n": "", "vs": [[21, "أيها الآباء، لا تثيروا غضب أولادكم لئلا يصيبهم الفشل."]]}], "kwAr": "أيها الآباء", "noteAr": ""}, {"kw": "but", "raw": "Gen_18:19; Exo_12:26, Exo_12:27, Exo_13:14, Exo_13:15; Deu_4:9, Deu_6:7, Deu_6:20-24, Deu_11:19-21; Jos_4:6, Jos_4:7, Jos_4:21-24, Jos_24:15; 1Ch_22:10-13, 1Ch_28:9, 1Ch_28:10,1Ch_28:20, 1Ch_29:19; Psa_71:17; Psa_71:18, Psa_78:4-7; Pro_4:1-4, Pro_19:18, Pro_22:6, Pro_22:15, Pro_23:13, Pro_23:14, Pro_29:15, Pro_29:17; Isa_38:19; 2Ti_1:5, 2Ti_3:15; Heb_12:7-10", "note": "", "refs": [{"l": "Gen 18:19", "n": "", "vs": [[19, "لأنني قد اخترته ليوصي بنيه وأهل بيته من بعده كي يحفظوا طريق الرب، عاملين البر والعدل، حتى ينجز الرب ما وعد به إبراهيم»."]]}, {"l": "Exo 12:26", "n": "", "vs": [[26, "ويكون حين يسألكم أبناؤكم: ماذا تعني هذه الفريضة لكم؟"]]}, {"l": "Exo 12:27", "n": "", "vs": [[27, "تجيبونهم آنئذ: إنها ذبيحة فصح للرب الذي عبر عن بيوت بني إسرائيل في مصر عندما أهلك المصريين، وأنقذ بيوتنا». فحنى الشعب رؤوسهم ساجدين."]]}, {"l": "Exo 13:14", "n": "", "vs": [[14, "وحين يسألك ابنك في الأيام المقبلة: ما معنى هذا؟ تجيبه: إنه بيد قديرة أخرجنا الرب من ديار العبودية."]]}, {"l": "Exo 13:15", "n": "", "vs": [[15, "وعندما تصلب فرعون وامتنع عن إطلاقنا، أهلك الرب كل بكر في بلاد مصر، من أبكار الناس والبهائم. لذلك أنا أقرب للرب الذكور من كل فاتح رحم وأفدي كل بكر من أولادي."]]}, {"l": "Deu 4:9", "n": "", "vs": [[9, "إنما احترزوا واحذروا لئلا تنسوا الأمور التي شهدتها أعينكم فلا تنمحي من قلوبكم كل أيام حياتكم. وعلموها لأولادكم ولأحفادكم."]]}, {"l": "Deu 6:7", "n": "", "vs": [[7, "وقصوها على أولادكم، وتحدثوا بها حين تجلسون في بيوتكم، وحين تسيرون في الطريق، وحين تنامون، وحين تنهضون."]]}, {"l": "Deu 6:20-24", "n": "", "vs": [[20, "وإذا سألكم أبناؤكم في مستقبل الأ يام: ما هي الشروط والفرائض والأحكام التي أمركم بها الرب إلهنا؟"], [21, "تجيبونهم: لقد كنا عبيدا لفرعون في مصر، فأخرجنا الرب بقوة فائقة،"], [22, "وأجرى الرب آيات وعجائب عظيمة ومهلكة بمصر على فرعون وجميع أهل بيته على مرأى منا."], [23, "ثم أخرجنا من هناك ليأتي بنا ويورثنا الأرض التي أقسم لآبائنا أن يهبها لنا."], [24, "فأمرنا الرب أن نمارس جميع هذه الفرائض ونتقيه لنزدهر دائما ونظل أحياء كما في هذا اليوم."]]}, {"l": "Deu 11:19-21", "n": "", "vs": [[19, "وعلموها لأولادكم، وتحدثوا بها حين تكونون في بيوتكم، وحين تسيرون في الطريق، وحين تأوون إلى فراشكم، وحين تنهضون،"], [20, "واكتبوها على قوائم أبواب بيوتكم وبوابات مدنكم،"], [21, "لكي تطول أيامكم وأيام أولادكم على الأرض التي حلف الرب لآبائكم أن يهبها لهم، فتكون في كثرتها كأيام السماء على الأرض."]]}, {"l": "Jos 4:6", "n": "", "vs": [[6, "فتكون هذه الحجارة، بعد نصبها، علامة في وسطكم، حتى إذا سألكم أبناؤكم في الأيام المقبلة: ماذا تعني لكم هذه الحجارة؟"]]}, {"l": "Jos 4:7", "n": "", "vs": [[7, "تجيبونهم: إن مياه الأردن توقفت عن الجريان، وانفلقت عند عبور تابوت عهد الرب النهر. وهكذا تصبح هذه الحجارة نصبا تذكاريا لبني إسرائيل مدى الدهر»."]]}, {"l": "Jos 4:21-24", "n": "", "vs": [[21, "وقال لبني إسرائيل: «إذا سأل بنوكم آباءهم في الأجيال المقبلة: ما هذه الحجارة؟"], [22, "يجيبونهم: إن الإسرائيليين قد عبروا نهر الأردن فوق أرض يابسة."], [23, "لأن الرب إلهكم شق مياه الأردن أمامكم، فعبرتم النهر فوق أرض يابسة، كما فعل الرب إلهكم بالبحر الأحمر الذي شقه أمامنا حتى عبرنا."], [24, "حتى تدرك جميع الشعوب أن يد الرب قوية، فتتقوا الرب إلهكم إلى الأبد»."]]}, {"l": "Jos 24:15", "n": "", "vs": [[15, "وإن ساءكم أن تعبدوا الرب، فاختاروا لأنفسكم اليوم من تعبدون سواء من الآلهة التي عبدها آباؤكم الذين استوطنوا شرقي نهر الفرات أم آلهة الأموريين الذين أنتم مقيمون في أرضهم. أما أنا وبيتي فنعبد الرب»."]]}, {"l": "1Ch 22:10-13", "n": "", "vs": [[10, "هو يبني بيتا لاسمي، ويكون لي ابنا، وأنا له أبا، وأثبت عرشه على إسرائيل إلى الأبد."], [11, "والآن ياابني ليكن الرب معك فيحالفك التوفيق في بناء بيت الرب إلهك كما تكلم عنك،"], [12, "وليمنحك الرب فطنة ومعرفة عندما يوليك على إسرائيل لتطيع شريعة الرب إلهك،"], [13, "حينئذ تفلح، إذ تحرص على ممارسة الفرائض والأحكام التي أمر بها الرب موسى وسنها لإسرائيل. تشجع وتقو، لا تجزع ولا ترتعب."]]}, {"l": "1Ch 28:9", "n": "", "vs": [[9, "أما أنت ياابني سليمان، فاعرف إله أبيك واعبده بكمال قلب، وبنفس راغبة، لأن الرب يتفحص جميع القلوب، ويفهم كل تصور وفكر. فإن طلبته تجده، وإن تركته ينبذك إلى الأبد."]]}, {"l": "1Ch 28:10", "n": "", "vs": [[10, "ففكر مليا، لأن الرب قد اصطفاك لتبني بيتا لقدس الأقداس، فتقو واعمل»."]]}, {"l": "1Ch 28:20", "n": "", "vs": [[20, "فتقو وتشجع واعمل. لا تجزع ولا ترتعب لأن الرب الإله إلهي معك، ولن يخذلك ولا يتركك حتى تستوفي كل عمل خدمة هيكل الرب."]]}, {"l": "1Ch 29:19", "n": "", "vs": [[19, "أما سليمان ابني، فهبه قلبا كاملا ليطيع وصاياك وشهاداتك وفرائضك، ويعمل بها كلها وليبني الهيكل الذي أعددت له»."]]}, {"l": "Psa 71:17", "n": "", "vs": [[17, "قد علمتني ياالله منذ صباي، فلم أكف لحظة عن إعلان عجائبك."]]}, {"l": "Psa 71:18", "n": "", "vs": [[18, "لا تتركني في الشيخوخة والشيب ياالله ، حتى أخبر هذا الجيل بأعمال قدرتك، وبقوتك (الجيل) الآتي."]]}, {"l": "Psa 78:4-7", "n": "", "vs": [[4, "لا نكتمها عن أبنائنا بل نخبر الجيل القادم: عن قوة الرب وعجائبه التي صنع."], [5, "فإنه أعطى شرائع لبني إسرائيل وأوامر لذرية يعقوب، أوصى فيها آباءنا أن يعرفوا بها أبناءهم."], [6, "لكي يعرفها الجيل القادم، البنون الذين لم يولدوا بعد، فيعلموها أيضا لأعقابهم."], [7, "فيضعون على الله اتكالهم ولا ينسون أعماله، بل يحفظون وصاياه."]]}, {"l": "Pro 4:1-4", "n": "", "vs": [[1, "استمعوا أيها البنون إلى إرشاد الأب، وأصغوا لتكتسبوا الفطنة،"], [2, "فإني أقدم لكم تعليما صالحا، فلا تهملوا شريعتي."], [3, "عندما كنت ابنا لأبي، غضا وحيدا لأمي،"], [4, "قال لي: «ادخر في قلبك كلامي، واحفظ وصاياي فتحيا."]]}, {"l": "Pro 19:18", "n": "", "vs": [[18, "أدب ابنك مادام في ذلك رجاء، ولا تحمل نفسك على قتله."]]}, {"l": "Pro 22:6", "n": "", "vs": [[6, "درب الولد بمقتضى مواهبه وطبيعته، فمتى شاخ لا يميل عنها."]]}, {"l": "Pro 22:15", "n": "", "vs": [[15, "الحماقة متأصلة في قلب الولد، وعصا التأديب تطردها منه."]]}, {"l": "Pro 23:13", "n": "", "vs": [[13, "لا تمتنع عن تأديب الولد. إن عاقبته بالعصا لا يموت."]]}, {"l": "Pro 23:14", "n": "", "vs": [[14, "اضربه بالعصا، فتنقذ نفسه من الهاوية."]]}, {"l": "Pro 29:15", "n": "", "vs": [[15, "العصا والتأنيب يثمران حكمة، لكن الصبي المهمل يخجل أمه."]]}, {"l": "Pro 29:17", "n": "", "vs": [[17, "قوم ابنك فيريحك، ويشيع المسرة في نفسك."]]}, {"l": "Isa 38:19", "n": "", "vs": [[19, "الأحياء وحدهم يسبحونك كما أفعل اليوم، ويحدث الآباء أبناءهم عن أمانتك"]]}, {"l": "2Ti 1:5", "n": "", "vs": [[5, "كما أستذكر إيمانك الخالي من الرياء، هذا الإيمان الذي فيك والذي حل أولا في جدتك لوئيس ثم في أمك أفنيكي، وأنا متأكد أنه حال فيك أيضا."]]}, {"l": "2Ti 3:15", "n": "", "vs": [[15, "وتعلم أنك منذ حداثة سنك تعرف الكتب المقدسة، وهي القادرة أن تجعلك حكيما لبلوغ الخلاص عن طريق الإيمان في المسيح يسوع."]]}, {"l": "Heb 12:7-10", "n": "", "vs": [[7, "إذن، تحملوا تأديب الرب. فهو يعاملكم معاملة الأبناء: وأي ابن لا يؤدبه أبوه؟"], [8, "فإن كنتم لا تتلقون التأديب الذي يشترك فيه أبناء الله جميعا، فمعنى ذلك أنكم لستم أبناء شرعيين له."], [9, "إن آباءنا الأرضيين كانوا يؤدبوننا ونحن أولاد، وكنا نحترمهم. أفلا يجدر بنا الآن أن نخضع خضوعا تاما لتأديب أبي الأرواح، لنحيا حياة فضلى؟"], [10, "وقد أدبنا آباؤنا فترة من الزمان، حسب ما رأوه مناسبا. أما الله ، فيؤدبنا دائما من أجل منفعتنا: لكي نشترك في قداسته."]]}], "kwAr": "وإنما ربوهم", "noteAr": ""}], "arS": [["وأنتم، أيها ", []], ["الآباء", ["G3962"]], ["، لا ", []], ["تثيروا غضب", ["G3949"]], [" ", []], ["أولادكم", ["G5043"]], [". وإنما ", []], ["ربوهم", ["G1625"]], [" ", []], ["بتأديب", ["G3809"]], [" ", []], ["الرب", ["G2962"]], [" ", []], ["وتحريضه", ["G3559"]], [".", []]]}, {"c": 6, "v": 5, "text": "أيها العبيد، أطيعوا سادتكم البشريين بخوف وارتعاد، من قلب صادق، كمن يطيع المسيح،", "groups": [{"kw": "be", "raw": "Gen_16:9; Psa_123:2; Mal_1:6; Mat_6:24, Mat_8:9; Act_10:7, Act_10:8; Col_3:22; 1Ti_6:1-3; Tit_2:9, Tit_2:10; 1Pe_2:18-21", "note": "", "refs": [{"l": "Gen 16:9", "n": "", "vs": [[9, "فقال لها ملاك الرب: «عودي إلى مولاتك واخضعي لها»."]]}, {"l": "Psa 123:2", "n": "", "vs": [[2, "كما تتعلق عيون العبيد بأيدي سادتهم، وعينا الجارية بيد سيدتها، هكذا تتعلق أنظارنا بالرب إلهنا حتى يتحنن علينا."]]}, {"l": "Mal 1:6", "n": "", "vs": [[6, "إن الابن يكرم أباه والعبد سيده. فإن كنت أنا حقا أبا فأين كرامتي؟ وإن كنت حقا سيدا فأين مهابتي؟ إن الرب القدير يقول لكم: أيها الكهنة المزدرون باسمي؛ فتسألون: كيف ازدرينا باسمك؟"]]}, {"l": "Mat 6:24", "n": "", "vs": [[24, "لا يمكن لأحد أن يكون عبدا لسيدين: لأنه إما أن يبغض أحدهما فيحب الآخر، وإما أن يلزم أحدهما فيهجر الآخر. لا يمكنكم أن تكونوا عبيدا لله والمال معا."]]}, {"l": "Mat 8:9", "n": "", "vs": [[9, "فأنا أيضا رجل تحت سلطة أعلى مني، ولي جنود تحت إمرتي؛ أقول لأحدهم: اذهب! فيذهب، ولآخر: تعال! فيأتي، ولعبدي: افعل هذا! فيفعل»."]]}, {"l": "Act 10:7", "n": "", "vs": [[7, "فما إن ذهب الملاك الذي كان يكلم كرنيليوس، حتى دعا اثنين من خدمه، وجنديا تقيا من مرافقيه الدائمين،"]]}, {"l": "Act 10:8", "n": "", "vs": [[8, "وروى لهم الخبر كله، وأرسلهم إلى يافا."]]}, {"l": "Col 3:22", "n": "", "vs": [[22, "أيها العبيد، أطيعوا في كل أمر سادتكم البشريين، فلا تعملوا بجد فقط حين تكون عيونهم عليكم، كمن يحاول إرضاء الناس، بل بقلب صادق خائفين الرب."]]}, {"l": "1Ti 6:1-3", "n": "", "vs": [[1, "على جميع من هم تحت نير العبودية أن يعتبروا سادتهم أهلا لكل إكرام، لكي لا يجلبوا التجديف على اسم الله وعلى التعليم."], [2, "وعلى الذين لهم سادة مؤمنون أن لا يستخفوا بهم لأنهم إخوة لهم، بل بالأحرى أن يخدموهم بخضوع، لأن المستفيدين من خدمتهم الصالحة هم مؤمنون محبوبون."], [3, "أما إذا كان أحد يعلم ما يخالفها ولا يذعن للكلام الصحيح، كلام ربنا يسوع المسيح، وللتعليم الموافق للتقوى،"]]}, {"l": "Tit 2:9", "n": "", "vs": [[9, "وعلم العبيد أن يكونوا خاضعين لسادتهم، مرضين لهم في كل شيء؛ غير معاندين؛"]]}, {"l": "Tit 2:10", "n": "", "vs": [[10, "ولا سارقين، بل مظهرين أمانة كلية صالحة، لكي يزينوا في كل شيء تعليم مخلصنا الله."]]}, {"l": "1Pe 2:18-21", "n": "", "vs": [[18, "أيها الخدم، اخضعوا لسادتكم باحترام لائق. ليس للسادة الصالحين المترفقين فقط، بل للظالمين القساة أيضا!"], [19, "فما أجمل أن يتحمل الإنسان الأحزان حين يتألم مظلوما، بدافع من ضميره الخاضع لله!"], [20, "فبالحقيقة، أي مجد لكم إن كنتم تصبرون وأنتم تتحملون قصاص أخطائكم؟ لا فضل لكم عند الله إلا إذا تحملتم الآلام صابرين، وأنتم تفعلون الصواب."], [21, "لأن الله دعاكم إلى الاشتراك في هذا النوع من الآلام. فالمسيح، الذي تألم لأجلكم، هو القدوة التي تقتدون بها. فسيروا على آثار خطواته:"]]}], "kwAr": "أطيعوا", "noteAr": ""}, {"kw": "according", "raw": "Phm_1:16", "note": "", "refs": [{"l": "Phm 1:16", "n": "", "vs": [[16, "لا كعبد في ما بعد، بل أفضل من عبد، أخا حبيبا، إلي بخاصة، فكم بالأحرى إليك، في الجسد وفي الرب معا؟"]]}], "kwAr": "سادتكم البشريين", "noteAr": ""}, {"kw": "with", "raw": "1Co_2:3; 2Co_7:15; Phi_2:12; 1Pe_3:2", "note": "", "refs": [{"l": "1Co 2:3", "n": "", "vs": [[3, "وقد كنت عندكم في حالة من الضعف والخوف والارتعاد الكثير."]]}, {"l": "2Co 7:15", "n": "", "vs": [[15, "وإن عواطفه تزداد نحوكم أكثر جدا عندما يتذكر طاعتكم جميعا وكيف استقبلتموه بخوف وارتعاد."]]}, {"l": "Phi 2:12", "n": "", "vs": [[12, "إذن، ياأحبائي، كما كنتم تطيعون دائما، لا كما لو أنني حاضر وحسب، بل بالأحرى كثيرا الآن وأنا غائب، كذلك اسعوا لتحقيق خلاصكم عمليا بخوف وارتعاد،"]]}, {"l": "1Pe 3:2", "n": "", "vs": [[2, "وذلك حين يلاحظ سلوكها الطاهر ووقارها."]]}], "kwAr": "بخوف وارتعاد", "noteAr": ""}, {"kw": "in", "raw": "Eph_6:24; Jos_24:14; 1Ch_29:17; Psa_86:11; Mat_6:22; Act_2:46; 2Co_1:12; 2Co_11:2, 2Co_11:3", "note": "", "refs": [{"l": "Eph 6:24", "n": "", "vs": [[24, "لتكن النعمة مع جميع الذين يحبون ربنا يسوع المسيح محبة لا يعتريها الفساد!"]]}, {"l": "Jos 24:14", "n": "", "vs": [[14, "والآن اتقوا الرب واعبدوه بكل أمانة، وانزعوا الأوثان التي عبدها آباؤكم في شرقي نهر الفرات وفي مصر واعبدوا الرب."]]}, {"l": "1Ch 29:17", "n": "", "vs": [[17, "وأنا أعلم ياإلهي أنك تفحص القلوب وتسر بالاستقامة، وأنا قدمت إليك كل هذه بقلب مستقيم، كذلك رأيت شعبك الماثل هنا يتبرع عن رضى بابتهاج."]]}, {"l": "Psa 86:11", "n": "", "vs": [[11, "يارب علمني طريقك فأسلك بموجب حقك. وحد قلبي ليخاف اسمك."]]}, {"l": "Mat 6:22", "n": "", "vs": [[22, "العين مصباح الجسد. فإن كانت عينك سليمة، يكون جسدك كله منورا."]]}, {"l": "Act 2:46", "n": "", "vs": [[46, "ويداومون على الحضور إلى الهيكل يوميا بقلب واحد، ويكسرون الخبز في البيوت، ويتناولون الطعام معا بابتهاج وبساطة قلب،"]]}, {"l": "2Co 1:12", "n": "", "vs": [[12, "فإن فخرنا هو هذا: شهادة ضميرنا بأننا، في قداسة الله وإخلاصه، قد سلكنا في العالم، وبخاصة تجاهكم؛ ولم يكن ذلك بحكمة بشرية بل بنعمة الله."]]}, {"l": "2Co 11:2", "n": "", "vs": [[2, "فإني أغار عليكم غيرة من عند الله لأني خطبتكم لرجل واحد هو المسيح، لأقدمكم إليه عذراء عفيفة."]]}, {"l": "2Co 11:3", "n": "", "vs": [[3, "غير أني أخشى أن تضلل عقولكم عن الإخلاص والطهارة تجاه المسيح مثلما أغوت الحية بمكرها حواء."]]}], "kwAr": "من قلب صادق", "noteAr": ""}, {"kw": "as", "raw": "Eph. 1:1-23; 1Co_7:22; Col_3:17-24", "note": "", "refs": [{"l": "Eph 1:1-23", "n": "", "vs": [[1, "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."], [2, "لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."], [3, "تبارك الله ، أبو ربنا يسوع المسيح الذي باركنا بكل بركة روحية في الأماكن السماوية."], [4, "كما كان قد اختارنا فيه قبل تأسيس العالم، لنكون قديسين بلا لوم أمامه."], [5, "إذ سبق فعيننا في المحبة ليتخذنا أبناء له بيسوع المسيح. وذلك موافق للقصد الذي سرت به مشيئته،"], [6, "بغرض مدح مجد نعمته التي بها أعطانا حظوة لديه في المحبوب:"], [7, "ففيه لنا بدمه الفداء، أي غفران الخطايا؛ بحسب غنى نعمته"], [8, "التي جعلها تفيض علينا مصحوبة بكل حكمة وفهم."], [9, "إذ كشف لنا سر مشيئته بحسب مرضاته التي قصدها في نفسه،"], [10, "لأجل تدبير تمام الأزمنة، حين يوحد كل شيء تحت رئاسة المسيح، سواء الأشياء التي في السماوات والتي على الأرض."], [11, "وفي المسيح أيضا قد حصلنا على الميراث الذي سبق أن عينا له، وفقا لقصده، هو الذي يعمل كل شيء كما تقضي مشيئته."], [12, "والغاية أن نكون سببا لمدح مجده بعدما سبق لنا أن وضعنا رجاءنا في المسيح."], [13, "وفيه أنتم أيضا (وضعتم رجاءكم) إذ سمعتم كلمة الحق، أي الإنجيل الذي فيه خلاصكم؛ كذلك فيه أيضا ختمتم، إذ آمنتم، بالروح القدس الموعود،"], [14, "هذا الروح الذي هو عربون ميراثنا إلى أن يتم فداء ما قد اقتني: بغر ض مدح مجده."], [15, "لذلك أنا أيضا، وقد سمعت بما فيكم من الإيمان بالرب يسوع والمحبة لجميع القديسين،"], [16, "لا أنقطع عن شكر الله لأجلكم وعن ذكركم في صلواتي،"], [17, "حتى يهبكم إله ربنا يسوع المسيح، أبو المجد، روح حكمة وإلهام: لتعرفوه معرفة كاملة"], [18, "إذ تستنير بصائر قلوبكم، فتعلموا ما في دعوته لكم من رجاء، وما هو غنى مجد ميراثه في القديسين،"], [19, "وما هي عظمة قدرته الفائقة المعلنة لنا نحن المؤمنين، بحسب عمل اقتدار قوته"], [20, "الذي عمله في المسيح، بإقامته له من بين الأموات. وقد أجلسه عن يمينه في الأماكن السماوية،"], [21, "أرفع جدا من كل رئاسة وسلطة وقوة وسيا دة، ومن كل اسم يسمى، لا في هذا العالم وحسب، بل في ذل
