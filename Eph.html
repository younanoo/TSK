<script>window.CATALOG=[{"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 20, "nv": 480, "refs": 6756, "last": "20:49", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 49, "abbr": "Eph", "en": "Ephesians", "verses": [{"c": 1, "v": 1, "text": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس.", "groups": [{"kw": "an", "raw": "Rom_1:1; 1Co_1:1; Gal_1:1", "note": "", "refs": [{"l": "Rom 1:1", "n": "", "vs": [[1, "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"]]}, {"l": "1Co 1:1", "n": "", "vs": [[1, "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"]]}, {"l": "Gal 1:1", "n": "", "vs": [[1, "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"]]}], "kwAr": "رسول للمسيح يسوع", "noteAr": ""}, {"kw": "to the saints", "raw": "Rom_1:7; 1Co_1:2; 2Co_1:1", "note": "", "refs": [{"l": "Rom 1:7", "n": "", "vs": [[7, "إلى جميع من هم في روما من أحباء الله القديسين المدعوين. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}, {"l": "1Co 1:2", "n": "", "vs": [[2, "إلى كنيسة الله في مدينة كورنثوس، إلى الذين تقدسوا في المسيح يسوع، المدعوين، القديسين؛ وإلى جميع الذين يدعون باسم ربنا يسوع المسيح في كل مكان ربا لهم ولنا."]]}, {"l": "2Co 1:1", "n": "", "vs": [[1, "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."]]}], "kwAr": "إلى القديسين", "noteAr": ""}, {"kw": "which", "raw": "Eph_6:21; Num_12:7; Luk_16:10; Act_16:15; 1Co_4:12, 1Co_4:17; Gal_3:9; Col_1:2; Rev_2:10,Rev_2:13, Rev_17:14", "note": "", "refs": [{"l": "Eph 6:21", "n": "", "vs": [[21, "ولكي تعرفوا أحوالي وأخبار عملي، فإن تيخيكس، الأخ الحبيب والخادم الأمين في الرب، يخبركم بها جميعا."]]}, {"l": "Num 12:7", "n": "", "vs": [[7, "أما عبدي موسى فلست أعامله هكذا، بل هو أمين في بيتي،"]]}, {"l": "Luk 16:10", "n": "", "vs": [[10, "إن الأمين في القليل أمين أيضا في الكثير، والخائن في القليل خائن أيضا في الكثير."]]}, {"l": "Act 16:15", "n": "", "vs": [[15, "فلما تعمدت هي وأهل بيتها، دعتنا بإلحاح لقبول ضيافتها قائلة: «إن كنتم قد حكمتم أني مؤمنة بالرب، فانزلوا ضيوفا ببيتي». فاضطرتنا إلى قبول دعوتها."]]}, {"l": "1Co 4:12", "n": "", "vs": [[12, "ونجهد أنفسنا في الشغل بأيدينا. نتعرض للإهانة فنبارك، وللاضطهاد فنحتمل"]]}, {"l": "1Co 4:17", "n": "", "vs": [[17, "لهذا السبب عينه أرسلت إليكم تيموثاوس، ابني الحبيب الأمين في الرب، فهو يذكركم بطرقي في السلوك في المسيح كما أعلم بها في كل مكان في جميع الكنائس."]]}, {"l": "Gal 3:9", "n": "", "vs": [[9, "إذن الذين هم على مبدأ الإيمان يباركون مع إبراهيم المؤمن."]]}, {"l": "Col 1:2", "n": "", "vs": [[2, "إلى الإخوة القديسين والأمناء في المسيح، المقيمين في مدينة كولوسي. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."]]}, {"l": "Rev 2:10", "n": "", "vs": [[10, "دع عنك الخوف مما ينتظرك من آلام، فإن إبليس سيزج ببعضكم في السجن لكي تمتحنوا، فتقاسون الاضطهاد عشرة أيام. فابق أمينا حتى الموت، فأمنحك إكليل الحياة."]]}, {"l": "Rev 2:13", "n": "", "vs": [[13, "إني أعلم أين تسكن، حيث عرش الشيطان! ورغم ذلك تمسكت باسمي، ورفضت أن تنكر الإيمان بي، حتى في أيام أنتيباس شهيدي الأمين، الذي قتل عندكم حيث يسكن الشيطان!"]]}, {"l": "Rev 17:14", "n": "", "vs": [[14, "ثم يحاربون الحمل، ولكن الحمل يهزمهم، لأنه رب الأرباب وملك الملوك، والذين معه هم المدعوون، المختارون، المؤمنون»."]]}], "kwAr": "المقيمين في أفسس", "noteAr": ""}, {"kw": "faithful", "raw": "Acts 19:1-20:38", "note": "", "refs": [{"l": "Act 19:1-20:38", "n": "", "vs": [[1, "وبينما كان أبلوس في كورنثوس وصل بولس إلى أفسس، بعدما مر بالمناطق الداخلية من البلاد. وهناك وجد بعض التلاميذ،"], [2, "فسألهم: «هل نلتم الروح القدس عندما آمنتم؟» أجابوه: «لا! حتى إننا لم نسمع بوجود الروح القدس!»"], [3, "فسأل: «إذن على أي أساس قد تعمدتم؟» أجابوا: «على أساس معمودية يوحنا!»"], [4, "فقال بولس: «كان يوحنا يعمد بمعمودية التوبة، ويدعو الشعب إلى الإيمان بالآتي بعده، أي بيسوع»."], [5, "فلما سمعوا هذا تعمدوا باسم الرب يسوع."], [6, "وما إن وضع بولس يديه عليهم حتى حل عليهم الروح القدس، وأخذوا يتكلمون بلغات أخرى ويتنبأون."], [7, "وكان عددهم نحو اثني عشر رجلا."], [8, "وأخذ بولس يداوم على الذهاب إلى المجمع مدة ثلاثة أشهر، يتكلم بجرأة فيناقش الحاضرين ويحاول إقناعهم بالحقائق المختصة بملكوت الله."], [9, "ولكن بعضهم عاندوا ولم يقتنعوا، وأخذوا يشتمون الطريق أمام المجتمعين. فانفصل بولس عنهم، وانفرد بالتلاميذ، وبدأ يعقد مناقشات كل يوم في مدرسة رجل اسمه تيرانوس،"], [10, "وداوم على ذلك مدة سنتين. وهكذا وصلت كلمة الرب إلى جميع سكان مقاطعة أسيا من اليهود واليونانيين."], [11, "وكان الله يجري معجزات خارقة على يد بولس،"], [12, "حتى صار الناس يأخذون المناديل أو المآزر التي مست جسده، ويضعونها على المرضى، فتزول أمراضهم وتخرج الأرواح الشريرة منهم."], [13, "وحاول بعض اليهود الجوالين الذين يحترفون طرد الأرواح الشرير ة، أن يستغلوا اسم الرب يسوع، قائلين: «نطردك باسم يسوع الذي يبشر به بولس!»"], [14, "وكان بين هؤلاء سبعة أبناء لواحد من الكهنة اسمه سكاوا،"], [15, "فأجابهم الروح الشرير: «يسوع أنا أعرفه، وبولس أفهمه. ولكن، من أنتم؟»"], [16, "ثم هجم عليهم الرجل الذي به الروح الشرير، فتمكن منهم وغلبهم، فهربوا من البيت الذي كانوا فيه، عراة مجرحين."], [17, "فانتشر خبر ذلك بين اليهود واليونانيين الساكنين في أفسس، فاستولت الرهبة على الجميع. وتمجد اسم الرب يسوع."], [18, "فجاء كثيرون من الذين كانوا قد آمنوا يعترفون ويخبرون بما كانوا يعملون."], [19, "وأخذ كثيرون من المشتغلين بالسحر يجمعون كتبهم ويحرقونها أمام الجميع. وقد حسب ثمنها، فتبين أنه خمسون ألف قطعة من الفضة."], [20, "بهذه الصورة كانت كلمة الرب تنتشر وتقوى باقتدار."], [21, "وبعد حدوث هذه الأمور، عزم بولس على السفر إلى أورشليم مرورا بمقاطعتي مقدونية وأخائية، قائلا: «لابد لي بعد إقامتي فيها من زيارة روما أيضا!»"], [22, "فأرسل إلى مقدونية اثنين من معاونيه، هما تيموثاوس وأرسطوس، وبقي مدة من الزمن في مقاطعة أسيا."], [23, "في تلك المدة وقع اضطراب خطير في أفسس بسبب الطريق."], [24, "فإن صائغا اسمه ديمتريوس كان يصنع نماذج فضية صغيرة لمعابد الإلهة أرطاميس، فيعود ذلك عليه وعلى عماله بربح وفير،"], [25, "دعا عماله وأهل مهنته، وقال لهم: «تعلمون أيها الرجال أن عيشنا الرغيد يعتمد على صناعتنا هذه،"], [26, "وقد رأيتم وسمعتم أن بولس هذا أضل عددا كبيرا من الناس، لا في أفسس وحدها، بل في مقاطعة أسيا كلها تقريبا، وأقنعهم بأن الآلهة التي تصنعها الأيدي ليست بآلهة."], [27, "وهذا لا يهدد صناعتنا بالكساد وحسب، بل يعرض معبد أرطاميس إلهتنا العظمى لفقدان هيبته. فنخشى أن تتلاشى كرامتها وتنهار عظمتها، وهي التي يتعبد لها سكان أسيا جميعا، بل العالم كله!»"], [28, "فلما سمع العمال هذا الكلام تملكهم الغضب وبدأوا يصرخون: «عظيمة أرطاميس إلهة أهل أفسس!»"], [29, "وعم الاضطراب المدينة كلها. وهجم حشد كبير من الناس على غايوس وأرسترخس المقدونيين رفيقي بولس في السفر، وجروهما إلى ساحة الملعب."], [30, "وأراد بولس أن يواجه الجمهور، ولكن التلاميذ منعوه من ذلك،"], [31, "كما أرسل إليه أصدقاؤه من وجهاء أسيا يرجون منه ألا يعرض نفسه لخطر الذهاب إلى الملعب،"], [32, "فقد كان الأمر مختلطا على الجمهور، بعضهم يصرخ بشيء، وبعضهم يصرخ بشيء آخر، حتى إن أكثرهم لم يكونوا يعرفون سبب تجمعهم."], [33, "وكان بين الجمهور يهودي اسمه إسكندر، دفعه اليهود إلى الأمام، ودعاه بعضهم إلى الكلام. فأشار بيده يريد أن يلقي على الشعب كلمة دفاع."], [34, "لكن المحتشدين عرفوا أنه يهودي، فأخذوا يهتفون معا هتافا واحدا ظلوا يرددونه نحو ساعتين: «عظيمة أرطاميس إلهة أهل أفسس!»"], [35, "أخيرا تمكن كاتب المدينة من تهدئة الحشود، وقال: «ياأهل أفسس، من ينكر أن أفسس هي المدينة الحارسة لهيكل أرطاميس الإلهة العظيمة، ولصنمها الذي هبط من السماء؟"], [36, "فلأنه لا خلاف في هذا الأمر، يجب أن تهدأوا ولا تفعلوا شيئا بتسرع."], [37, "فقد أحضرتم هذين الرجلين، مع أنهما لم يسرقا المعبد ولم يشتما إلهتكم."], [38, "أما إذا كان لديمتريوس وزملاء مهنته شكوى، فإن عندنا محاكم وقضاة. فليتقدموا بشكواهم إلى القضاة."], [39, "وإذا كان لكم شكوى أخرى، فإن النظر فيها يتم في جلسة قانونية."], [40, "أما الآن فكلنا معرضون للمحاكمة بتهمة افتعال الاضطراب، بسبب ما حدث اليوم، ونحن لا نملك حجة نبرر بها التجمع!»"], [41, "وبقوله هذا صرف المحتشدين."], [1, "بعدما انتهى الاضطراب، دعا بولس التلاميذ وشجعهم، ثم ودعهم وسافر إلى مقاطعة مقدونية،"], [2, "وتجول فيها يعظ ويشجع التلاميذ في كل مكان. وأخيرا وصل إلى اليونان،"], [3, "وقضى فيها ثلاثة أشهر. وبينما كان يستعد للسفر بحرا إلى سورية، عرف أن اليهود يدبرون مؤامرة لقتله. فقرر أن يعود بطريق مقدونية."], [4, "ورافقه في السفر سوباترس بن برس من بيرية؛ وأرسترخس وسكوندس من تسالونيكي؛ وغايوس وتيموثاوس من دربة، وتيخيكس وتروفيمس من مقاطعة أسيا."], [5, "هؤلاء سبقونا مع بولس وانتظرونا في ترواس."], [6, "وبعد عيد الفطير اليهودي سافرنا نحن من فيلبي، بطريق البحر، فوصلنا ترواس بعد خمسة أيام، فلحقنا بهم، وبقينا هناك سبعة أيام."], [7, "وفي أول يوم من الأسبوع، إذ اجتمعنا لنكسر الخبز، أخذ بولس يعظ المجتمعين. ولما كان ينوي السفر في اليوم التالي، أطال وعظه إلى منتصف الليل."], [8, "وكان اجتماعنا في غرفة بالطبقة العليا، وقد أشعلت فيها مصابيح كثيرة."], [9, "وكان شاب اسمه أفتيخوس قد جلس على النافذة، فغلب عليه النوم العميق، وبولس ماض في حديثه الطويل، فسقط من الطبقة الثالثة وحمل ميتا."], [10, "فنزل بولس وارتمى عليه، وطوقه بذراعيه وقال: «لا تقلقوا! ماتزال حياته فيه!»"], [11, "وبعدما صعد بولس وكسر الخبز وأكل، ثم تابع حديثه إلى الفجر، سافر برا (إلى أسوس)."], [12, "أما الشاب فجاءوا به حيا، فكان لهم في ذلك عزاء عظيم."], [13, "وأما نحن فسبقنا بولس وتوجهنا إلى أسوس بطريق البحر، حيث انتظرنا وصوله حسب الخطة التي كان قد رسمها بأن يوافينا سيرا على قدميه."], [14, "فلما لحق بنا، أصعدناه إلى السفينة، وأبحرنا إلى ميناء ميتيليني"], [15, "وتابعنا السفر فوصلنا في اليوم التالي أمام جزيرة خيوس. وفي اليوم الثالث مررنا بالقرب من جزيرة ساموس، ووصلنا ميليتس في اليوم الرابع."], [16, "وكان بولس قد قرر أن يتجاوز أفسس في البحر لكي لا يتأخر في مقاطعة أسيا، فقد كان يريد السرعة لعله يتمكن من الوصول إلى أورشليم في يوم الخمسين."], [17, "ومن ميليتس أرسل بولس إلى أفسس يستدعي شيوخ الكنيسة."], [18, "فلما جاءوا إليه، قال لهم:"], [19, "فقد كنت أخدم الرب بكل تواضع، وبكثير من الدموع، وأنا أعاني المحن التي أصابتني بها مؤامرات اليهود."], [20, "وما قصرت في شيء يمكن أن يعود عليكم بالفائدة إلا وكنت أعلنه لكم وأعلمكم به علنا ومن بيت إلى بيت."], [21, "فكنت أحث اليهود واليونانيين على أن يتوبوا إلى الله ويؤمنوا بربنا يسوع."], [22, "وأنا اليوم ذاهب إلى أورشليم، مدفوعا بالروح، ولا أعلم ماذا ينتظرني هناك."], [23, "إلا أن الروح القدس كان يعلن لي في كل مدينة أذهب إليها أن السجن والمصاعب تنتظرني"], [24, "ولكني لا أحسب لحياتي أية قيمة، ما دمت أسعى إلى بلوغ غايتي وإتمام الخدمة التي كلفني إياها الرب يسوع: أن أشهد ببشارة نعمة الله."], [25, "وأنا أعلم أنكم لن تروا وجهي بعد اليوم، أنتم الذين تجولت بينكم جميعا مبشرا بملكوت الله."], [26, "لذلك أشهد لكم اليوم أني بريء من دمكم جميعا،"], [27, "لأني لم أمتنع عن إبلاغكم جميع مقاصد الله."], [28, "فاسهروا إذن على أنفسكم وعلى جميع القطيع الذي عينكم بينه الروح القدس نظارا، لترعوا كنيسة الله التي اشتراها بدمه."], [29, "فإني أعلم أنه بعد رحيلي سيندس بينكم ذئاب خاطفة، لا تشفق على القطيع."], [30, "بل إن قوما منكم أنتم سيقومون ويعلمون تعاليم منحرفة، ليجروا التلاميذ وراءهم."], [31, "لذلك كونوا متيقظين، وتذكروا أني، مدة ثلاث سنين، لم أتوقف ليلا ونهارا عن نصح كل واحد منكم وأنا أذرف الدموع."], [32, "وا لآن أسلمكم إلى الله وإلى كلمة نعمته القادرة أن تبنيكم وتعطيكم ميراثا تشتركون فيه مع جميع المقدسين لله."], [33, "ما اشتهيت يوما فضة ولا ذهبا ولا ثوبا من عند أحد."], [34, "وأنتم تعلمون أني اشتغلت بيدي هاتين لأسد حاجاتي وحاجات مرافقي."], [35, "وقد أظهرت لكم بوضوح كيف يجب أن نبذل الجهد لنساعد المحتاجين، متذكرين كلمات الرب يسوع، إذ قال: الغبطة في العطاء أكثر مما في الأخذ!»"], [36, "وبعد هذا الكلام ركع بولس معهم جميعا وصلى."], [37, "وبكى الجميع كثيرا، وعانقوا بولس وقبلوه بحرارة."], [38, "وقد حزنوا كثيرا، خاصة لأنه قال لهم إنهم لن يروا وجهه مرة أخرى. ثم رافقوه إلى السفينة مودعين."]]}], "kwAr": "الأمناء في المسيح يسوع", "noteAr": ""}], "arS": [["من ", []], ["بولس", ["G3972"]], ["، وهو ", []], ["رسول", ["G652"]], [" ", []], ["للمسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["بمشيئة", ["G2307"]], [" ", []], ["الله", ["G2316"]], ["، إلى ", []], ["القديسين", ["G40"]], [" ", []], ["الأمناء", ["G4103"]], [" في ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], ["، المقيمين في ", []], ["أفسس", ["G2181"]], [".", []]]}, {"c": 1, "v": 2, "text": "لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح.", "groups": [{"kw": "", "raw": "Rom_1:7; 2Co_1:2; Gal_1:3; Tit_1:4", "note": "", "refs": [{"l": "Rom 1:7", "n": "", "vs": [[7, "إلى جميع من هم في روما من أحباء الله القديسين المدعوين. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}, {"l": "2Co 1:2", "n": "", "vs": [[2, "لتكن لكم النعمة والسلام من الله أبينا ومن الرب يسوع المسيح!"]]}, {"l": "Gal 1:3", "n": "", "vs": [[3, "لتكن لكم النعمة والسلام من الله الآب وربنا يسوع المسيح،"]]}, {"l": "Tit 1:4", "n": "", "vs": [[4, "إلى تيطس، ولدي الحقيقي بالنسبة إلى الإيمان المشترك بيننا."]]}], "kwAr": "", "noteAr": ""}], "arS": [["لتكن لكم ", []], ["النعمة", ["G5485"]], [" ", []], ["والسلام", ["G1515"]], [" ", []], ["من", ["G575"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["أبينا", ["G3962", "G2257"]], [" ", []], ["والرب", ["G2962"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 1, "v": 3, "text": "تبارك الله ، أبو ربنا يسوع المسيح الذي باركنا بكل بركة روحية في الأماكن السماوية.", "groups": [{"kw": "Blessed", "raw": "Gen_14:20; 1Ch_29:20; Neh_9:5; Psa_72:19; Dan_4:34; Luk_2:28; 2Co_1:3; 1Pe_1:3; Rev_4:9-11, Rev_5:9-14", "note": "", "refs": [{"l": "Gen 14:20", "n": "", "vs": [[20, "وتبارك الله العلي الذي دفع أعداءك إلى يديك». فأعطاه أبرام عشر الغنائم كلها."]]}, {"l": "1Ch 29:20", "n": "", "vs": [[20, "ثم قال داود للجمع الحاضر: «باركوا الرب إلهكم». فسبح كل الجمع الرب إله آبائهم وسجدوا للرب وللملك."]]}, {"l": "Neh 9:5", "n": "", "vs": [[5, "ونادى اللاويون: يشوع وقدميئيل وباني وحشبنيا وشربيا وهوديا وشبنيا وفتحيا قائلين: «قوموا وباركوا الرب إلهكم من الأزل إلى الأبد، وليتبارك اسمك المجيد المتعالي فوق كل بركة وتسبيح."]]}, {"l": "Psa 72:19", "n": "", "vs": [[19, "تبارك اسمه المجيد إلى الأبد، ولتمتليء الأرض كلها من مجده. آمين ثم آمين."]]}, {"l": "Dan 4:34", "n": "", "vs": [[34, "وفي ختام السبعة الأزمنة، أنا نبوخذناصر، التفت نحو السماء، فرجع إلي عقلي، وباركت العلي وسبحت وحمدت الحي الأبدي ذا السلطان السرمدي، والذي ملكه على مدى الأجيال."]]}, {"l": "Luk 2:28", "n": "", "vs": [[28, "حمله على ذراعيه وبارك الله ، وقال:"]]}, {"l": "2Co 1:3", "n": "", "vs": [[3, "تبارك الله ، أبو ربنا يسوع المسيح، أبو المراحم وإله كل تعزية،"]]}, {"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}, {"l": "Rev 4:9-11", "n": "", "vs": [[9, "وكلما قدمت هذه الكائنات التمجيد والإجلال والحمد للجالس على العرش، الحي إلى أبد الآبدين،"], [10, "يجثو الشيوخ الأربعة والعشرون أمام الجالس على العرش ساجدين للحي إلى أبد الآبدين، ويلقون أكاليلهم أمام عرشه وهم يهتفون:"], [11, "«مستحق أنت ياربنا وإلهنا المجد والإجلال والقدرة، لأنك خلقت الأشياء كلها، وهي بإرادتك كائنة وقد خلقت!»"]]}, {"l": "Rev 5:9-14", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"], [10, "وجعلتهم مملكة لإلهنا وكهنة له، وسيملكون على الأرض»."], [11, "ثم نظرت، فسمعت ترتيل الملايين من الملائكة وهي تحيط بالعرش وبالكائنات الحية والشيوخ،"], [12, "وهم يهتفون بصوت عال: «مستحق هو الحمل المذبوح أن ينال القدرة والغنى والحكمة والقوة والإجلال والمجد والبركة»."], [13, "ثم سمعت كل خليقة في السماء وعلى الأرض، وتحت الأرض، وعلى البحر، هاتفة مع كل ما فيها: «البركة والإجلال والمجد والسلطة للجالس على العرش وللحمل، إلى أبد الآبدين»."], [14, "فردت الكائنات الحية الأربعة: «آمين!» وجثا الشيوخ ساجدين."]]}], "kwAr": "تبارك الله", "noteAr": ""}, {"kw": "God", "raw": "Eph_1:17; Joh_10:29, Joh_10:30, Joh_20:17; Rom_15:6; 2Co_1:3, 2Co_11:31; Phi_2:11", "note": "", "refs": [{"l": "Eph 1:17", "n": "", "vs": [[17, "حتى يهبكم إله ربنا يسوع المسيح، أبو المجد، روح حكمة وإلهام: لتعرفوه معرفة كاملة"]]}, {"l": "Joh 10:29", "n": "", "vs": [[29, "إن الآب الذي أعطاني إياها هو أعظم من الجميع، ولا يقدر أحد أن ينتزع من يد الآب شيئا."]]}, {"l": "Joh 10:30", "n": "", "vs": [[30, "أنا والآب واحد!»"]]}, {"l": "Joh 20:17", "n": "", "vs": [[17, "فقال لها: «لا تمسكي بي! فإني لم أصعد بعد إلى الآب، بل اذهبي إلى إخوتي وقولي لهم: إني سأصعد إلى أبي وأبيكم، وإلهي وإلهكم!»"]]}, {"l": "Rom 15:6", "n": "", "vs": [[6, "لكي تمجدوا الله أبا ربنا يسوع المسيح بنفس واحدة وفم واحد."]]}, {"l": "2Co 1:3", "n": "", "vs": [[3, "تبارك الله ، أبو ربنا يسوع المسيح، أبو المراحم وإله كل تعزية،"]]}, {"l": "2Co 11:31", "n": "", "vs": [[31, "ويعلم الله ، أبو ربنا يسوع، المبارك إلى الأبد، أني لست أكذب:"]]}, {"l": "Phi 2:11", "n": "", "vs": [[11, "ولكي يعترف كل لسان بأن يسوع المسيح هو الرب، لمجد الله الآب."]]}], "kwAr": "الله", "noteAr": ""}, {"kw": "who", "raw": "Gen_12:2, Gen_12:3, Gen_22:18; 1Ch_4:10; Psa_72:17, Psa_134:3; Isa_61:9; Gal_3:9", "note": "", "refs": [{"l": "Gen 12:2", "n": "", "vs": [[2, "فأجعل منك أمة كبيرة وأباركك وأعظم اسمك، وتكون بركة (لكثيرين)."]]}, {"l": "Gen 12:3", "n": "", "vs": [[3, "وأبارك مباركيك وألعن لاعنيك، وتتبارك فيك جميع أمم الأرض»."]]}, {"l": "Gen 22:18", "n": "", "vs": [[18, "وبذريتك تتبارك جميع أمم الأرض، لأنك أطعتني»."]]}, {"l": "1Ch 4:10", "n": "", "vs": [[10, "وتضرع يعبيص لإله إسرائيل قائلا: «ليتك تباركني وتوسع من حدود أرضي، وتعضدني، وتقيني من الشر فلا يشقيني». فاستجاب الله دعاءه."]]}, {"l": "Psa 72:17", "n": "", "vs": [[17, "يخلد اسمه إلى الدهر، ويدوم اسمه كديمومة الشمس، ويتبارك الناس به، وتطوبه كل الأمم."]]}, {"l": "Psa 134:3", "n": "", "vs": [[3, "يباركك الرب من صهيون، صانع السماوات والأرض."]]}, {"l": "Isa 61:9", "n": "", "vs": [[9, "وتشتهر ذريتهم بين الأمم، ونسلهم وسط الشعوب، وكل من يراهم يعرفهم، ويقر أنهم شعب باركه الرب."]]}, {"l": "Gal 3:9", "n": "", "vs": [[9, "إذن الذين هم على مبدأ الإيمان يباركون مع إبراهيم المؤمن."]]}], "kwAr": "الذي باركنا", "noteAr": ""}, {"kw": "heavenly", "raw": "Eph_1:20, Eph_2:6, Eph_3:10, Eph_6:12 *marg. Heb_8:5, Heb_9:23", "note": "", "refs": [{"l": "Eph 1:20", "n": "", "vs": [[20, "الذي عمله في المسيح، بإقامته له من بين الأموات. وقد أجلسه عن يمينه في الأماكن السماوية،"]]}, {"l": "Eph 2:6", "n": "", "vs": [[6, "وأقامنا معه وأجلسنا معه في الأماكن السماوية في المسيح يسوع."]]}, {"l": "Eph 3:10", "n": "", "vs": [[10, "والغاية أن يتجلى الآن أمام الرئاسات والسلطات في الأماكن السماوية ما يظهر في الكنيسة من حكمة الله المتعددة الوجوه،"]]}, {"l": "Eph 6:12", "n": "*marg.", "vs": [[12, "فإن حربنا ليست ضد ذوي اللحم والدم، بل ضد الرئاسات، ضد السلطات، ضد أسياد العالم حكام هذا الظلام، ضد قوى الشر الروحية في الأماكن السماوية."]]}, {"l": "Heb 8:5", "n": "", "vs": [[5, "وهؤلاء يقومون بخدمة ما يشكل رمزا وظلا للأمور التي في السماء. وهذا واضح من قول الله لموسى قبل أن يصنع خيمة العبادة. إذ أوحى إليه قائلا: «انتبه! عليك أن تصنع الخيمة وما فيها وفقا للمثال الذي أظهرته لك على الجبل!»"]]}, {"l": "Heb 9:23", "n": "", "vs": [[23, "وبما أن تطهير الخيمة الأرضية كان يتطلب رش دم الذبائح الحيوانية، فإن الخيمة الحقيقية لابد أن تتطلب دم ذبيحة أفضل من الذبائح الأخرى."]]}], "kwAr": "السماوية", "noteAr": ""}, {"kw": "places", "raw": "or, things, Eph_6:12", "note": "or, things, Eph_6:12", "refs": [{"l": "Eph 6:12", "n": "", "vs": [[12, "فإن حربنا ليست ضد ذوي اللحم والدم، بل ضد الرئاسات، ضد السلطات، ضد أسياد العالم حكام هذا الظلام، ضد قوى الشر الروحية في الأماكن السماوية."]]}], "kwAr": "الأماكن", "noteAr": "أو: الأمور (السماوية)."}, {"kw": "in Christ", "raw": "Eph_1:10; Joh_14:20, Joh_15:2-5, Joh_17:21; Rom_12:5; 1Co_1:30, 1Co_12:12; 2Co_5:17, 2Co_5:21", "note": "", "refs": [{"l": "Eph 1:10", "n": "", "vs": [[10, "لأجل تدبير تمام الأزمنة، حين يوحد كل شيء تحت رئاسة المسيح، سواء الأشياء التي في السماوات والتي على الأرض."]]}, {"l": "Joh 14:20", "n": "", "vs": [[20, "في ذلك اليوم تعلمون أني أنا في أبي، وأنتم في، وأنا فيكم."]]}, {"l": "Joh 15:2-5", "n": "", "vs": [[2, "كل غصن في لا ينتج ثمرا يقطعه؛ وكل غصن ينتج ثمرا ينقيه لينتج مزيدا من الثمر."], [3, "أنتم الآن أنقياء بسبب الكلمة التي خاطبتكم بها."], [4, "فاثبتوا في وأنا فيكم. كما أن الغصن لا يقدر أن ينتج ثمرا إلا إذا ثبت في الكرمة؛ فكذلك أنتم، إلا إذا ثبتم في."], [5, "أنا الكرمة وأنتم الأغصان. من يثبت في وأنا فيه، فذاك ينتج ثمرا كثيرا. فإنكم بمعزل عني لا تقدرون أن تفعلوا شيئا."]]}, {"l": "Joh 17:21", "n": "", "vs": [[21, "ليكون الجميع واحدا؛ أيها الآب، كما أنك أنت في وأنا فيك، ليكونوا هم أيضا واحدا فينا، لكي يؤمن العالم أنك أنت أرسلتني."]]}, {"l": "Rom 12:5", "n": "", "vs": [[5, "فكذلك نحن الكثيرين جسد واحد في المسيح، وكلنا أعضاء بعضنا لبعض."]]}, {"l": "1Co 1:30", "n": "", "vs": [[30, "وبفضل الله صار لكم مقام في المسيح يسوع الذي جعل لنا حكمة من الله وبرا وقداسة وفداء،"]]}, {"l": "1Co 12:12", "n": "", "vs": [[12, "فكما أن الجسد واحد وله أعضاء كثيرة، ولكن أعضاء الجسد كلها تشكل جسما واحدا مع أنها كثيرة، فكذلك حال المسيح أيضا."]]}, {"l": "2Co 5:17", "n": "", "vs": [[17, "فإنه إذا كان أحد في المسيح، فهو خليقة جديدة: إن الأشياء القديمة قد زالت، وها كل شيء قد صار جديدا."]]}, {"l": "2Co 5:21", "n": "", "vs": [[21, "فإن الذي لم يعرف خطيئة، جعله الله خطيئة لأجلنا، لنصير نحن بر الله فيه."]]}], "kwAr": "في المسيح", "noteAr": ""}], "arS": [["تبارك", ["G2128"]], [" ", []], ["الله", ["G2316"]], [" ، ", []], ["أبو", ["G3962"]], [" ", []], ["ربنا", ["G2962", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [" الذي ", []], ["باركنا", ["G2127", "G2248"]], [" ", []], ["بكل", ["G3956"]], [" ", []], ["بركة", ["G2129"]], [" ", []], ["روحية", ["G4152"]], [" في الأماكن ", []], ["السماوية", ["G2032"]], [".", []]]}, {"c": 1, "v": 4, "text": "كما كان قد اختارنا فيه قبل تأسيس العالم، لنكون قديسين بلا لوم أمامه.", "groups": [{"kw": "as", "raw": "Deu_7:6, Deu_7:7; Psa_135:4; Isa_41:8, Isa_41:9, Isa_42:1, Isa_65:8-10; Mat_11:25, Mat_11:26, Mat_24:22, Mat_24:24; Mat_24:31; Joh_10:16; Act_13:48, Act_18:10; Rom_8:28, Rom_8:30,Rom_8:33, Rom_9:23, Rom_9:24, Rom_11:5, Rom_11:6; 2Th_2:13, 2Th_2:14; 2Ti_2:10; Tit_1:1, Tit_1:2; Jam_2:5; 1Pe_1:2, 1Pe_2:9", "note": "", "refs": [{"l": "Deu 7:6", "n": "", "vs": [[6, "لأنكم شعب مقدس للرب إلهكم. فإياكم قد اختار الرب إلهكم من بين جميع شعوب الأرض لتكونوا شعبه الخاص."]]}, {"l": "Deu 7:7", "n": "", "vs": [[7, "ولم يفضلكم الرب ويتخيركم لأنكم أكثر عددا من سائر الشعوب، فأنتم أقل الأمم عددا."]]}, {"l": "Psa 135:4", "n": "", "vs": [[4, "لأن الرب قد اختار يعقوب لنفسه، واتخذ إسرائيل شعبا خاصا له."]]}, {"l": "Isa 41:8", "n": "", "vs": [[8, "أما أنت ياإسرائيل عبدي. يايعقوب الذي اصطفيته، ياذرية إبراهيم خليلي،"]]}, {"l": "Isa 41:9", "n": "", "vs": [[9, "يامن أخذتك من أقاصي الأرض، ودعوتك من أبعد أطرافها قائلا لك: أنت عبدي. لقد اصطفيتك ولم أنبذك."]]}, {"l": "Isa 42:1", "n": "", "vs": [[1, "هوذا عبدي الذي أعضده، مختاري الذي ابتهجت به نفسي. وضعت روحي عليه ليسوس الأمم بالعدل."]]}, {"l": "Isa 65:8-10", "n": "", "vs": [[8, "ولكن هذا ما يقوله الرب: كما أن (الكرام) لا يطرح العنقود الفاسد إذ يقال له إن في عنبه بعض الخمر الطيب، كذلك لن أطر ح من أمامي كل إسرائيل لئلا أقضي على خدامي جميعا."], [9, "بل أخرج من صلب يعقوب ذرية، ومن يهوذا وارثا لجبالي، فيملكها مختاري، ويقيم فيها عبيدي،"], [10, "وتصبح أرض شارون مرعى للقطعان، ووادي عخور مربض بقر لشعبي الذي طلبني."]]}, {"l": "Mat 11:25", "n": "", "vs": [[25, "وفي ذلك الوقت، تكلم يسوع فقال: «أحمدك أيها الآب، رب السماء والأرض، لأنك حجبت هذه الأمور عن الحكماء والفهماء، وكشفتها للأطفال!"]]}, {"l": "Mat 11:26", "n": "", "vs": [[26, "نعم أيها الآب، لأنه هكذا حسن في نظرك."]]}, {"l": "Mat 24:22", "n": "", "vs": [[22, "ولولا أن تلك الأيام ستختصر، لما كان أحد من البشر ينجو. ولكن من أجل المختارين ستختصر تلك الأيام."]]}, {"l": "Mat 24:24", "n": "", "vs": [[24, "فسوف يبرز أكثر من مسيح دجال ونبي دجال، ويقدمون آيات عظيمة وأعاجيب، ليضللوا حتى المختارين، لو استطاعوا."]]}, {"l": "Mat 24:31", "n": "", "vs": [[31, "ويرسل ملائكته بصوت بوق عظيم ليجمعوا مختاريه من الجهات الأربع، من أقاصي السماوات إلى أقاصيها."]]}, {"l": "Joh 10:16", "n": "", "vs": [[16, "ولي خراف أخرى لا تنتمي إلى هذه الحظيرة، لا بد أن أجمعها إلي أيضا، فتصغي لصوتي؛ فيكون هناك قطيع واحد وراع واحد."]]}, {"l": "Act 13:48", "n": "", "vs": [[48, "فلما سمع غير اليهود ذلك، فرحوا جدا، ومجدوا كلمة الرب. وآمن جميع من أعدهم الله للحياة الأبدية."]]}, {"l": "Act 18:10", "n": "", "vs": [[10, "فأنا معك، ولن يقدر أحد أن يؤذيك، لأن لي شعبا كثيرا في هذه المدينة»."]]}, {"l": "Rom 8:28", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."]]}, {"l": "Rom 8:30", "n": "", "vs": [[30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."]]}, {"l": "Rom 8:33", "n": "", "vs": [[33, "ومن سيتهم مختاري الله؟ إن الله هو الذي يبرر،"]]}, {"l": "Rom 9:23", "n": "", "vs": [[23, "وذلك بقصد أن يعلن غنى مجده في أوعية الرحمة التي سبق فأعدها للمجد،"]]}, {"l": "Rom 9:24", "n": "", "vs": [[24, "فينا نحن الذين دعاهم لا من بين اليهود فقط بل من بين الأمم أيضا؟"]]}, {"l": "Rom 11:5", "n": "", "vs": [[5, "فكذلك، في الزمان الحاضر، ماتزال بقية اختارها الله بالنعمة."]]}, {"l": "Rom 11:6", "n": "", "vs": [[6, "ولكن، بما أن ذلك قد تم بالنعمة، فليس بعد على أساس الأعمال، وإلا فليست النعمة نعمة بعد."]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "2Th 2:14", "n": "", "vs": [[14, "فإلى هذا الأمر قد دعاكم ببشارتنا لكم، لنوال مجد ربنا يسوع المسيح."]]}, {"l": "2Ti 2:10", "n": "", "vs": [[10, "لهذا السبب أحتمل كل شيء بصبر لأجل الذين اختارهم الله ، لكي يحصلوا، هم أيضا، على الخلاص الذي في المسيح يسوع مع المجد الأبدي."]]}, {"l": "Tit 1:1", "n": "", "vs": [[1, "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"]]}, {"l": "Tit 1:2", "n": "", "vs": [[2, "في رجاء الحياة الأبدية، التي وعد بها الله المنزه عن الكذب، من قبل أزمنة الأزل،"]]}, {"l": "Jam 2:5", "n": "", "vs": [[5, "فياإخوتي الأحباء، أما اختار الله الفقراء في نظر الناس ليجعلهم أغنياء في الإيمان، ويعطيهم حق الإرث في الملكوت الذي وعد به محبيه؟"]]}, {"l": "1Pe 1:2", "n": "", "vs": [[2, "بحسب علمه السابق ثم قدسهم بالروح ليطيعوا يسوع المسيح ويطهروا برش دمه عليهم."]]}, {"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}], "kwAr": "كما كان قد اختارنا", "noteAr": ""}, {"kw": "before", "raw": "Mat_25:34; Joh_17:24; Act_15:18; 1Pe_1:20; Rev_13:8, Rev_17:8", "note": "", "refs": [{"l": "Mat 25:34", "n": "", "vs": [[34, "ثم يقول الملك للذين عن يمينه: تعالوا يامن باركهم أبي، رثوا الملكوت الذي أعد لكم منذ إنشاء العالم:"]]}, {"l": "Joh 17:24", "n": "", "vs": [[24, "أيها الآب، أريد لهؤلاء الذين وهبتهم لي أن يكونوا معي حيث أكون أنا، فيشاهدوا مجدي الذي أعطيتني، لأنك أحببتني قبل إنشاء العالم."]]}, {"l": "Act 15:18", "n": "", "vs": [[18, "المعروفة لديه منذ الأزل."]]}, {"l": "1Pe 1:20", "n": "", "vs": [[20, "ومع أن الله كان قد عين المسيح لهذا الغرض قبل تأسيس العالم، فهو لم يعلنه إلا في هذا الزمن الأخير لفائدتكم"]]}, {"l": "Rev 13:8", "n": "", "vs": [[8, "فيسجد للوحش جميع سكان الأرض الذين لم تكتب أسماؤهم منذ تأسيس العالم في سجل الحياة للحمل الذي ذبح."]]}, {"l": "Rev 17:8", "n": "", "vs": [[8, "هذا الوحش كان موجودا، وهو غير موجود الآن، ولكنه على وشك أن يطلع من الهاوية ويمضي إلى الهلاك. وسيدهش سكان الأرض الذين لم تكتب أسماؤهم منذ تأسيس العالم في سجل الحياة، عندما يرون الوحش، لأنه كان موجودا، ثم أصبح غير موجود، وسيعود!"]]}], "kwAr": "قبل تأسيس العالم", "noteAr": ""}, {"kw": "that", "raw": "Eph_2:10; Luk_1:74, Luk_1:75; Joh_15:16; Rom_8:28, Rom_8:29; Col_3:12; 1Th_4:7; 2Ti_1:9; 2Ti_2:19; Tit_2:11, Tit_2:12; 2Pe_1:5-10", "note": "", "refs": [{"l": "Eph 2:10", "n": "", "vs": [[10, "فإننا نحن تحفة الله، وقد خلقنا في المسيح يسوع لأعمال صالحة أعدها سلفا لنسلك فيها."]]}, {"l": "Luk 1:74", "n": "", "vs": [[74, "بعد تخليصنا من أيدي أعدائنا، أن نعبده بلا خوف،"]]}, {"l": "Luk 1:75", "n": "", "vs": [[75, "بقداسة وبر أمامه، طوال حياتنا."]]}, {"l": "Joh 15:16", "n": "", "vs": [[16, "ليس أنتم اخترتموني، بل أنا اخترتكم وعينتكم لتنطلقوا وتنتجوا ثمرا ويدوم ثمركم، فيعطيكم الآب كل ما تطلبونه باسمي."]]}, {"l": "Rom 8:28", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."]]}, {"l": "Rom 8:29", "n": "", "vs": [[29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."]]}, {"l": "Col 3:12", "n": "", "vs": [[12, "فباعتباركم جماعة مختارة من الله، قديسين محبوبين، البسوا دائما عواطف الحنان واللطف والتواضع والوداعة وطول البال،"]]}, {"l": "1Th 4:7", "n": "", "vs": [[7, "فإن الله دعانا لا إلى النجاسة بل (إلى العيش( في القداسة."]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،"]]}, {"l": "2Ti 2:19", "n": "", "vs": [[19, "إلا أن الأساس الراسخ الذي وضعه الله يظل ثابتا، وعليه هذا الختم: «الرب يعرف خاصته»، وأيضا: «لينفصل عن الإثم كل من يسمي اسم الرب!»"]]}, {"l": "Tit 2:11", "n": "", "vs": [[11, "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت."]]}, {"l": "Tit 2:12", "n": "", "vs": [[12, "وهي تعلمنا أن نقطع علاقتنا بالإباحية والشهوات العالمية، وأن نحيا في العصر الحاضر حياة التعقل والبر والتقوى،"]]}, {"l": "2Pe 1:5-10", "n": "", "vs": [[5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"], [6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"], [7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."], [8, "فحين تكون هذه الصفات الطيبة في داخلكم، وتزداد بوفرة، تجعلكم مجتهدين ومثمرين في معرفتكم لربنا يسوع المسيح."], [9, "أما الذي لا يملك هذه الصفات، فهو أعمى روحيا. إنه قصير البصر، قد نسي أنه تطهر من خطاياه القديمة!"], [10, "فأحرى بكم إذن، أيها الإخوة، أن تجتهدوا لتثبتوا عمليا أن الله قد دعاكم واختاركم حقا. فإنكم، إن فعلتم هذا، لن تسقطوا أبدا!"]]}], "kwAr": "لنكون قديسين", "noteAr": ""}, {"kw": "without", "raw": "Eph_5:27; 1Co_1:8; Phi_2:15; Col_1:22; 2Pe_3:14", "note": "", "refs": [{"l": "Eph 5:27", "n": "", "vs": [[27, "حتى يزفها إلى نفسه كنيسة بهية لا يشوبها عيب أو تجعد أو أية نقيصة مشابهة بل تكون مقدسة خالية من العيوب."]]}, {"l": "1Co 1:8", "n": "", "vs": [[8, "وهو نفسه سيحفظكم ثابتين إلى النهاية حتى تكونوا بلا عيب في يوم ربنا يسوع المسيح."]]}, {"l": "Phi 2:15", "n": "", "vs": [[15, "لتكونوا بلا أذى وبسطاء، أولادا لله لا يعابون بشيء في وسط جيل منحرف فاسد، تضيئون بينهم كأنوار في العالم،"]]}, {"l": "Col 1:22", "n": "", "vs": [[22, "قد صالحكم الآن في جسد بشرية (ابنه) بالموت. وذلك لكي يحضركم فتمثلوا أمامه وأنتم قديسون بلا ذنب ولا لوم."]]}, {"l": "2Pe 3:14", "n": "", "vs": [[14, "فبينما تنتظرون إتمام هذا الوعد، أيها الأحباء، اجتهدوا أن يجدكم الرب في سلام، خالين من الدنس والعيب."]]}], "kwAr": "بلا لوم", "noteAr": ""}, {"kw": "love", "raw": "Eph_3:17, Eph_4:2, Eph_4:15, Eph_4:16, Eph_5:2; Gal_5:6, Gal_5:13, Gal_5:22; Col_2:2; 1Th_3:12; 1Jo_4:16", "note": "", "refs": [{"l": "Eph 3:17", "n": "", "vs": [[17, "ليسكن المسيح في قلوبكم بالإيمان؛ حتى إذا تأصلتم وتأسستم في المحبة،"]]}, {"l": "Eph 4:2", "n": "", "vs": [[2, "بكل تواضع ووداعة وطول بال، محتملين بعضكم بعضا في المحبة،"]]}, {"l": "Eph 4:15", "n": "", "vs": [[15, "بل نتمسك بالحق في المحبة، فننمو في كل شيء نحو من هو الرأس، أي المسيح."]]}, {"l": "Eph 4:16", "n": "", "vs": [[16, "فمنه يستمد الجسد كله تماسكه وترابطه بمساندة كل مفصل وفقا لمقدار العمل المخصص لكل جزء، لينشيء نموا يؤول إلى بنيان الجسد بنيانا ذاتيا في المحبة."]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "Gal 5:6", "n": "", "vs": [[6, "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة."]]}, {"l": "Gal 5:13", "n": "", "vs": [[13, "فإنما إلى الحرية قد دعيتم، أيها الإخوة؛ ولكن لا تتخذوا من الحرية ذريعة لإرضاء الجسد، بل بالمحبة كونوا عبيدا في خدمة أحدكم الآخر."]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Col 2:2", "n": "", "vs": [[2, "بغرض أن تتشجع قلوبهم وتكون كلها متحدة في المحبة، لبلوغ الإدراك التام بكل غناه، لمعرفة سر الله، أي المسيح،"]]}, {"l": "1Th 3:12", "n": "", "vs": [[12, "وليجعلكم الرب تنمون وتفيضون في المحبة لتحبوا بعضكم بعضا وجميع الناس كمحبتنا لكم،"]]}, {"l": "1Jo 4:16", "n": "", "vs": [[16, "ونحن أنفسنا اختبرنا المحبة التي خصنا الله بها، ووضعنا ثقتنا فيها. إن الله محبة. ومن يثبت في المحبة، فإنه يثبت في الله، والله يثبت فيه."]]}], "kwAr": "في المحبة", "noteAr": ""}], "arS": [["كما كان قد ", []], ["اختارنا", ["G1586", "G2248"]], [" فيه ", []], ["قبل", ["G4253"]], [" ", []], ["تأسيس", ["G2602"]], [" ", []], ["العالم", ["G2889"]], ["، لنكون ", []], ["قديسين", ["G40"]], [" ", []], ["بلا لوم", ["G299"]], [" ", []], ["أمامه", ["G2714"]], [".", []]]}, {"c": 1, "v": 5, "text": "إذ سبق فعيننا في المحبة ليتخذنا أبناء له بيسوع المسيح. وذلك موافق للقصد الذي سرت به مشيئته،", "groups": [{"kw": "predestinated", "raw": "Eph_1:11; Rom_8:29, Rom_8:30", "note": "", "refs": [{"l": "Eph 1:11", "n": "", "vs": [[11, "وفي المسيح أيضا قد حصلنا على الميراث الذي سبق أن عينا له، وفقا لقصده، هو الذي يعمل كل شيء كما تقضي مشيئته."]]}, {"l": "Rom 8:29", "n": "", "vs": [[29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."]]}, {"l": "Rom 8:30", "n": "", "vs": [[30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."]]}], "kwAr": "سبق فعيننا", "noteAr": ""}, {"kw": "unto", "raw": "Jer_3:4, Jer_3:19; Hos_1:10; Joh_1:12, Joh_11:52; Rom_8:14-17, Rom_8:23; 2Co_6:18; Gal_4:5, Gal_4:6; Heb_12:5-9; 1Jo_3:1; Rev_21:7", "note": "", "refs": [{"l": "Jer 3:4", "n": "", "vs": [[4, "ألم تدعني الآن قائلة: ياأبي، أنت رفيق صباي؟"]]}, {"l": "Jer 3:19", "n": "", "vs": [[19, "ولكني قلت في نفسي: لشد ما يسعدني أن أقيمك بين الأبناء وأورثك أرضا شهية هي أجمل ميراث بين الأمم. وفكرت أنك تدعينني ياأبي، ولن ترتدي عن اتباعي."]]}, {"l": "Hos 1:10", "n": "", "vs": [[10, "ومع ذلك فإن عدد بني إسرائيل يكون كرمل البحر الذي لا يكال ولا يحصى. وفي الموضع الذي قيل لهم فيه: أنتم لستم شعبي، يقال لهم: أنتم أبناء الله الحي."]]}, {"l": "Joh 1:12", "n": "", "vs": [[12, "أما الذين قبلوه، أي الذين آمنوا باسمه، فقد منحهم الحق في أن يصيروا أولاد الله،"]]}, {"l": "Joh 11:52", "n": "", "vs": [[52, "وليس فدى الأمة وحسب بل أيضا ليجمع أبناء الله المشتتين فيجعلهم واحدا."]]}, {"l": "Rom 8:14-17", "n": "", "vs": [[14, "فإن جميع الخاضعين لقيادة روح الله، هم أبناء لله."], [15, "إذ إنكم لم تنالوا روح عبودية يعيدكم إلى الخوف، بل نلتم روح بنوة به نصرخ: «أبا! أبانا!»"], [16, "فالروح نفسه يشهد مع أرواحنا بأننا أولاد الله."], [17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}, {"l": "Rom 8:23", "n": "", "vs": [[23, "وليس هي وحدها، بل أيضا نحن الذين لنا باكورة الروح، نحن أنفسنا نئن في قرارة نفوسنا مترقبين إعلان بنوتنا بافتداء أجسادنا."]]}, {"l": "2Co 6:18", "n": "", "vs": [[18, "فأقبلكم، وأكون لكم أبا، وتكونوا لي بنين وبنات»، هذا يقوله الرب القادر على كل شيء."]]}, {"l": "Gal 4:5", "n": "", "vs": [[5, "ليحرر بالفداء أولئك الخاضعين للشريعة، فننال جميعا مقام أبناء الله."]]}, {"l": "Gal 4:6", "n": "", "vs": [[6, "وبما أنكم أبناء له، أرسل الله إلى قلوبنا روح ابنه، مناديا: «أبا، ياأبانا»."]]}, {"l": "Heb 12:5-9", "n": "", "vs": [[5, "فهل نسيتم الوعظ الذي يخاطبكم به الله بوصفكم أبناء له؟ إذ يقول: «ياابني، لا تستخف بتأديب الرب. ولا تفقد العزيمة حين يوبخك على الخطأ."], [6, "فإن الذي يحبه الرب يؤدبه. وهو يجلد كل من يتخذه له ابنا!»"], [7, "إذن، تحملوا تأديب الرب. فهو يعاملكم معاملة الأبناء: وأي ابن لا يؤدبه أبوه؟"], [8, "فإن كنتم لا تتلقون التأديب الذي يشترك فيه أبناء الله جميعا، فمعنى ذلك أنكم لستم أبناء شرعيين له."], [9, "إن آباءنا الأرضيين كانوا يؤدبوننا ونحن أولاد، وكنا نحترمهم. أفلا يجدر بنا الآن أن نخضع خضوعا تاما لتأديب أبي الأرواح، لنحيا حياة فضلى؟"]]}, {"l": "1Jo 3:1", "n": "", "vs": [[1, "تأملوا ما أعظم المحبة التي أحبنا بها الآب حتى صرنا ندعى «أولاد الله»، ونحن أولاده حقا. ولكن، بما أن أهل العالم لا يعرفون الله، فهم لا يعرفوننا."]]}, {"l": "Rev 21:7", "n": "", "vs": [[7, "هذا كله نصيب المنتصر، وأكون إلها له، وهو يكون ابنا لي."]]}], "kwAr": "ليتخذنا أبناء له", "noteAr": ""}, {"kw": "by", "raw": "Joh_20:17; Gal_3:26; Heb_2:10-15", "note": "", "refs": [{"l": "Joh 20:17", "n": "", "vs": [[17, "فقال لها: «لا تمسكي بي! فإني لم أصعد بعد إلى الآب، بل اذهبي إلى إخوتي وقولي لهم: إني سأصعد إلى أبي وأبيكم، وإلهي وإلهكم!»"]]}, {"l": "Gal 3:26", "n": "", "vs": [[26, "فإنكم جميعا أبناء الله بالإيمان بالمسيح يسوع."]]}, {"l": "Heb 2:10-15", "n": "", "vs": [[10, "فلما قصد الله ، الذي من أجله كل شيء وبه كل شيء، أن يحضر إلى المجد أبناء كثيرين، كان من اللائق أن يجعل قائدهم إلى الخلاص مؤهلا لإكمال مهمته عن طريق الآلام."], [11, "فإن للمسيح الذي يقدس المؤمنين به، وللمقدسين أنفسهم، أبا واحدا. لهذا، لا يستحي المسيح أن يدعو المؤمنين به إخوة له."], [12, "إذ يقول الكتاب بلسانه: «أعلن اسمك لإخوتي. وأسبحك في وسط الجماعة!»"], [13, "ويقول أيضا: «وأنا أكون متوكلا عليه!» وأيضا: «ها أنا مع الأولاد الذين وهبهم الله لي!»"], [14, "إذن، بما أن هؤلاء الأولاد متشاركون في أجسام بشرية من لحم ودم، اشترك المسيح أيضا في اللحم والدم باتخاذه جسما بشريا. وهكذا تمكن أن يموت، ليقضي على من له سلطة الموت، أي إبليس،"], [15, "ويحرر من كان الخوف من الموت يستعبدهم طوال حياتهم."]]}], "kwAr": "بيسوع المسيح", "noteAr": ""}, {"kw": "according", "raw": "Eph_1:9, Eph_1:11; Dan_4:35; Mat_1:25, Mat_11:26; Luk_10:21, Luk_11:32; Rom_9:11-16; 1Co_1:1, 1Co_1:21; Phi_2:13; 2Th_1:11", "note": "", "refs": [{"l": "Eph 1:9", "n": "", "vs": [[9, "إذ كشف لنا سر مشيئته بحسب مرضاته التي قصدها في نفسه،"]]}, {"l": "Eph 1:11", "n": "", "vs": [[11, "وفي المسيح أيضا قد حصلنا على الميراث الذي سبق أن عينا له، وفقا لقصده، هو الذي يعمل كل شيء كما تقضي مشيئته."]]}, {"l": "Dan 4:35", "n": "", "vs": [[35, "وعرفت أن كل أهل الأرض لا يحسبون شيئا، وأنه يفعل ما يشاء في جند السماء وسكان الأرض، وليس من يكف يده أو يقول له: ماذا تفعل؟"]]}, {"l": "Mat 1:25", "n": "", "vs": [[25, "ولكنه لم يدخل بها حتى ولدت ابنا، فسماه يسوع."]]}, {"l": "Mat 11:26", "n": "", "vs": [[26, "نعم أيها الآب، لأنه هكذا حسن في نظرك."]]}, {"l": "Luk 10:21", "n": "", "vs": [[21, "في تلك الساعة ابتهج يسوع بالروح وقال: «أحمدك أيها الآب، رب السماء والأرض، لأنك حجبت هذه الأمور عن الحكماء والفهماء، وكشفتها للأطفال. نعم، أيها الآب، لأنه هكذا حسن في نظرك!"]]}, {"l": "Luk 11:32", "n": "", "vs": [[32, "وأهل نينوى سيقفون في الدينونة مع هذا الجيل ويدينونه: لأنهم تابوا لدى وعظ يونان لهم. وها هنا أعظم من يونان."]]}, {"l": "Rom 9:11-16", "n": "", "vs": [[11, "ولم يكن الولدان قد ولدا بعد ولا فعلا خيرا أو شرا، وذلك كي يبقى قصد الله من جهة الاختيار"], [12, "لا على أساس الأعمال بل على أساس دعوة منه، قيل لها: «إن الولد الأكبر يكون عبدا للأصغر»،"], [13, "كما قد كتب: «أحببت يعقوب، وأبغضت عيسو»."], [14, "إذا، ماذا نقول، أيكون عند الله ظلم، حاشا!"], [15, "فإنه يقول لموسى: «إني أرحم من أرحمه، وأشفق على من أشفق عليه!»"], [16, "إذا، لا يتعلق الأمر برغبة الإنسان ولا بسعيه، وإنما برحمة الله فقط."]]}, {"l": "1Co 1:1", "n": "", "vs": [[1, "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"]]}, {"l": "1Co 1:21", "n": "", "vs": [[21, "فبما أن العالم، في حكمة الله، لم يعرف الله عن طريق الحكمة، فقد سر الله أن يخلص بجهالة البشارة الذين يؤمنون."]]}, {"l": "Phi 2:13", "n": "", "vs": [[13, "لأن الله هو الذي ينشيء فيكم الإرادة والعمل لأجل مرضاته."]]}, {"l": "2Th 1:11", "n": "", "vs": [[11, "لأجل ذلك أيضا نصلي من أجلكم على الدوام، لكي يجعلكم إلهنا مؤهلين للدعوة الإلهية ويتم فيكم، بقدرته، كل ما يسره من الصلاح وفعالية الإيمان،"]]}], "kwAr": "موافق للقصد", "noteAr": ""}], "arS": [["إذ ", []], ["سبق فعيننا", ["G4309"]], [" في ", []], ["المحبة", ["G26"]], [" ليتخذنا ", []], ["أبناء", ["G5206"]], [" له ", []], ["بيسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [". وذلك ", []], ["موافق", ["G2596"]], [" للقصد الذي ", []], ["سرت به", ["G2107"]], [" ", []], ["مشيئته", ["G2307"]], ["،", []]]}, {"c": 1, "v": 6, "text": "بغرض مدح مجد نعمته التي بها أعطانا حظوة لديه في المحبوب:", "groups": [{"kw": "praise", "raw": "Eph_1:7, Eph_1:8, Eph_1:12, Eph_1:14, Eph_1:18, Eph_2:7, Eph_3:10,Eph_3:11; Pro_16:4; Isa_43:21, Isa_61:3, Isa_61:11; Jer_33:9; Luk_2:14; Rom_9:23, Rom_9:24; 2Co_4:15; Phi_1:11, Phi_4:19; 2Th_1:8-10; 1Ti_1:14-16; 1Pe_2:9, 1Pe_4:11", "note": "", "refs": [{"l": "Eph 1:7", "n": "", "vs": [[7, "ففيه لنا بدمه الفداء، أي غفران الخطايا؛ بحسب غنى نعمته"]]}, {"l": "Eph 1:8", "n": "", "vs": [[8, "التي جعلها تفيض علينا مصحوبة بكل حكمة وفهم."]]}, {"l": "Eph 1:12", "n": "", "vs": [[12, "والغاية أن نكون سببا لمدح مجده بعدما سبق لنا أن وضعنا رجاءنا في المسيح."]]}, {"l": "Eph 1:14", "n": "", "vs": [[14, "هذا الروح الذي هو عربون ميراثنا إلى أن يتم فداء ما قد اقتني: بغر ض مدح مجده."]]}, {"l": "Eph 1:18", "n": "", "vs": [[18, "إذ تستنير بصائر قلوبكم، فتعلموا ما في دعوته لكم من رجاء، وما هو غنى مجد ميراثه في القديسين،"]]}, {"l": "Eph 2:7", "n": "", "vs": [[7, "وذلك كي يعرض في الدهور القادمة غنى نعمته الفائق في لطفه علينا في المسيح يسوع."]]}, {"l": "Eph 3:10", "n": "", "vs": [[10, "والغاية أن يتجلى الآن أمام الرئاسات والسلطات في الأماكن السماوية ما يظهر في الكنيسة من حكمة الله المتعددة الوجوه،"]]}, {"l": "Eph 3:11", "n": "", "vs": [[11, "وفقا للقصد الأزلي الذي قصده الله في المسيح يسوع ربنا،"]]}, {"l": "Pro 16:4", "n": "", "vs": [[4, "لكل شيء صنعه الرب غرض في ذاته، حتى الشرير ليوم الضيق."]]}, {"l": "Isa 43:21", "n": "", "vs": [[21, "وجبلته لنفسي ليذيع حمدي."]]}, {"l": "Isa 61:3", "n": "", "vs": [[3, "لأمنح نائحي صهيون تاج جمال بدل الرماد، ودهن السرور بدل النوح، ورداء تسبيح بدل الروح اليائسة، فيدعون أشجار البر وغرس الرب لكي يتمجد."]]}, {"l": "Isa 61:11", "n": "", "vs": [[11, "لأنه كما تنبت الأرض مزروعاتها، والحديقة تخرج نباتاتها التي زرعت فيها، هكذا السيد الرب يجعل البر والتسبيح ينبتان أمام جميع الأمم."]]}, {"l": "Jer 33:9", "n": "", "vs": [[9, "وتصبح هذه المدينة مبعث سرور لي، وتسبحة وافتخارا لدى جميع أمم الأرض التي يبلغها كل ما أسديته من خير إليها، فتخاف وترتعد بفضل ما أغدقته عليها من إحسان وازدهار."]]}, {"l": "Luk 2:14", "n": "", "vs": [[14, "«المجد لله في الأعالي، وعلى الأرض السلام؛ وبالناس المسرة! »"]]}, {"l": "Rom 9:23", "n": "", "vs": [[23, "وذلك بقصد أن يعلن غنى مجده في أوعية الرحمة التي سبق فأعدها للمجد،"]]}, {"l": "Rom 9:24", "n": "", "vs": [[24, "فينا نحن الذين دعاهم لا من بين اليهود فقط بل من بين الأمم أيضا؟"]]}, {"l": "2Co 4:15", "n": "", "vs": [[15, "فإن جميع الأشياء نقاسيها من أجلكم، حتى إذا فاضت النعمة في الكثيرين، تجعل الشكر يفيض لأجل مجد الله."]]}, {"l": "Phi 1:11", "n": "", "vs": [[11, "كاملين في ثمار البر الآتية بيسوع المسيح، لمجد الله وحمده."]]}, {"l": "Phi 4:19", "n": "", "vs": [[19, "وإن إلهي سيسد حاجاتكم كلها إلى التمام، وفقا لغناه في المجد، في المسيح يسوع."]]}, {"l": "2Th 1:8-10", "n": "", "vs": [[8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."], [9, "فهؤلاء سيكابدون عقاب الهلاك الأبدي، بعيدا من حضرة الرب ومن مجد قوته،"], [10, "عندما يعود في ذلك اليوم ليتمجد في قديسيه ويكون موضع العجب عند جميع الذين آمنوا، وأنتم قد آمنتم بشهادتنا لكم!"]]}, {"l": "1Ti 1:14-16", "n": "", "vs": [[14, "إلا أن نعمة ربنا قد فاضت علي فوق كل حد، ومعها الإيمان والمحبة، وذلك في المسيح يسوع."], [15, "ما أصدق هذا القول، وما أجدره بالتصديق الكلي: إن المسيح يسوع قد جاء إلى العالم ليخلص الخاطئين، وأنا أولهم!"], [16, "ولكن لهذا السبب عوملت بالرحمة، ليجعل يسوع المسيح مني، أنا أولا، مثالا يظهر صبره الطويل، لجميع الذين سيؤمنون به لنوال الحياة الأبدية."]]}, {"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}, {"l": "1Pe 4:11", "n": "", "vs": [[11, "فمن يتكلم، عليه أن يتكلم بما يوافق أقوال الله؛ ومن يخدم، عليه أن يخدم بموجب القوة التي يمنحها الله . وذلك لكي يتمجد الله في كل شيء، بيسوع المسيح، له المجد والسلطة إلى أبد الآبدين. آمين!"]]}], "kwAr": "مدح مجد نعمته", "noteAr": ""}, {"kw": "he", "raw": "Isa_45:24, Isa_45:25; Jer_23:6; Rom_3:22-26, Rom_5:15-19, Rom_8:1; 2Co_5:21; Phi_3:9; 1Pe_2:5", "note": "", "refs": [{"l": "Isa 45:24", "n": "", "vs": [[24, "ويقولون عني: إنما بالرب وحده البر والقوة، وكل من يغتاظ منه يأتي إلى الرب ويخزى."]]}, {"l": "Isa 45:25", "n": "", "vs": [[25, "أما ذرية إسرائيل فبالرب يتبررون وبه يزهون."]]}, {"l": "Jer 23:6", "n": "", "vs": [[6, "في عهده يتم خلاص شعب يهوذا، ويسكن شعب إسرائيل آمنا. أما الاسم الذي سيدعى به فهو: الرب برنا."]]}, {"l": "Rom 3:22-26", "n": "", "vs": [[22, "ذلك البر الذي يمنحه الله على أساس الإيمان بيسوع المسيح لجميع الذين يؤمنون. إذ لا فرق،"], [23, "لأن الجميع قد أخطأوا وهم عاجزون عن بلوغ ما يمجد الله ."], [24, "فهم يبررون مجانا، بنعمته، بالفداء بالمسيح يسوع"], [25, "الذي قدمه الله كفارة، عن طريق الإيمان، وذلك بدمه."], [26, "ليظهر بر الله إذ تغاضى، بإمهاله الإلهي، عن الخطايا التي حدثت في الماضي، ويظهر أيضا بره في الزمن الحاضر: فيتبين أنه بار وأنه يبرر من له الإيمان بيسوع."]]}, {"l": "Rom 5:15-19", "n": "", "vs": [[15, "ولكن مفعول المعصية ليس كمفعول النعمة! فإذا كان الكثيرون بمعصية إنسان واحد قد ماتوا، فكم بالأحرى في الإنسان الواحد يسوع المسيح تتوافر للكثيرين نعمة الله والعطية المجانية بالنعمة."], [16, "ثم إن أثر خطيئة إنسان واحد ليس كأثر الهبة! فإن الحكم من جراء معصية واحدة يؤدي إلى الدينونة. وأما فعل النعمة، من جراء معاص كثيرة، فيؤدي إلى التبرير."], [17, "فما دام الموت بمعصية الإنسان الواحد، قد ملك بذلك الواحد، فكم بالأحرى يملك في الحياة بيسوع المسيح الواحد أولئك الذين ينالون فيض النعمة وعطية البر المجانية."], [18, "فإذن، كما أن معصية واحدة جلبت الدينونة على جميع البشر، كذلك فإن برا واحدا يجلب التبرير المؤدي إلى الحياة لجميع البشر."], [19, "فكما أنه بعصيان الإنسان الواحد جعل الكثيرون خاطئين، فكذلك أيضا بطاعة الواحد سيجعل الكثيرون أبرارا."]]}, {"l": "Rom 8:1", "n": "", "vs": [[1, "فالآن إذا ليس على الذين في المسيح يسوع أية دينونة بعد."]]}, {"l": "2Co 5:21", "n": "", "vs": [[21, "فإن الذي لم يعرف خطيئة، جعله الله خطيئة لأجلنا، لنصير نحن بر الله فيه."]]}, {"l": "Phi 3:9", "n": "", "vs": [[9, "ويكون لي فيه مقام، إذ ليس لي بري الذاتي القائم على أساس الشريعة، بل البر الآتي من الإيمان بالمسيح، البر الذي من عند الله على أساس الإيمان."]]}, {"l": "1Pe 2:5", "n": "", "vs": [[5, "إذن اتحدوا به كحجارة حية، مبنيين بيتا روحيا، تكونون فيه كهنة مقدسين تقدمون لله ذبائح روحية مقبولة لديه بفضل يسوع المسيح."]]}], "kwAr": "أعطانا حظوة", "noteAr": ""}, {"kw": "in", "raw": "Psa_22:20, Psa_60:5; Pro_8:30,Pro_8:31; Isa_42:1, Isa_49:1-3; Zec_13:7; Mat_3:17, Mat_17:5; Joh_3:35, Joh_10:17; Col_1:13", "note": "", "refs": [{"l": "Psa 22:20", "n": "", "vs": [[20, "أنقذ من السيف نفسي، ومن مخالب الأدنياء حياتي."]]}, {"l": "Psa 60:5", "n": "", "vs": [[5, "لكي ينجو أحباؤك. خلص بيمينك واستجب لي."]]}, {"l": "Pro 8:30", "n": "", "vs": [[30, "كنت عنده صانعا مبدعا، وكنت كل يوم لذته، أفيض بهجة دائما أمامه."]]}, {"l": "Pro 8:31", "n": "", "vs": [[31, "مغتبطة بعالمه المسكون، ومسراتي مع بني آدم."]]}, {"l": "Isa 42:1", "n": "", "vs": [[1, "هوذا عبدي الذي أعضده، مختاري الذي ابتهجت به نفسي. وضعت روحي عليه ليسوس الأمم بالعدل."]]}, {"l": "Isa 49:1-3", "n": "", "vs": [[1, "أنصتي إلي أيتها الجزائر، واصغوا ياشعوب البلاد البعيدة: قد دعاني الرب وأنا مازلت جنينا، وذكر اسمي وأنا ما برحت في رحم أمي."], [2, "جعل فمي كسيف قاطع، وواراني في ظل يديه؛ صنع مني سهما مسنونا وأخفاني في جعبته،"], [3, "وقال لي: «أنت عبدي إسرائيل الذي به أتمجد"]]}, {"l": "Zec 13:7", "n": "", "vs": [[7, "ويقول الرب القدير: «استيقظ أيها السيف وهاجم راعي ورجل رفقتي. اضرب الراعي فتتبدد الخراف. ولكني أرد يدي عن الصغار (أي القلة المؤمنة)."]]}, {"l": "Mat 3:17", "n": "", "vs": [[17, "وإذا صوت من السماوات يقول: «هذا هو ابني الحبيب، الذي به سررت كل سرور! »"]]}, {"l": "Mat 17:5", "n": "", "vs": [[5, "وبينما كان يتكلم، إذا سحابة منيرة قد خيمت عليهم، وصوت من السحابة يهتف: «هذا هو ابني الحبيب الذي سررت به كل سرور. له اسمعوا!»"]]}, {"l": "Joh 3:35", "n": "", "vs": [[35, "فالآب يحب الابن، وقد جعل في يده كل شيء."]]}, {"l": "Joh 10:17", "n": "", "vs": [[17, "إن الآب يحبني لأني أبذل حياتي لكي أستردها."]]}, {"l": "Col 1:13", "n": "", "vs": [[13, "هو الذي أنقذنا من سلطة الظلام ونقلنا إلى ملكوت ابن محبته"]]}], "kwAr": "في المحبوب", "noteAr": ""}], "arS": [["بغرض ", []], ["مدح", ["G1868"]], [" ", []], ["مجد", ["G1391"]], [" ", []], ["نعمته", ["G5485"]], [" التي بها ", []], ["أعطانا حظوة", ["G5487"]], [" لديه في ", []], ["المحبوب", ["G25"]], [":", []]]}, {"c": 1, "v": 7, "text": "ففيه لنا بدمه الفداء، أي غفران الخطايا؛ بحسب غنى نعمته", "groups": [{"kw": "whom", "raw": "Job_33:24; Psa_130:7; Dan_9:24-26; Zec_9:11, Zec_13:1, Zec_13:7; Mat_20:28, Mat_26:28; Mar_14:24; Act_20:28; Rom_3:24; 1Co_1:30; Col_1:14; 1Ti_2:6; Tit_2:14; Heb_9:12-15, Heb_9:22, Heb_10:4-12; 1Pe_1:18, 1Pe_1:19, 1Pe_2:24, 1Pe_3:18; 1Jo_2:2, 1Jo_4:10; Rev_5:9, Rev_14:4", "note": "", "refs": [{"l": "Job 33:24", "n": "", "vs": [[24, "يترَأف عليه قائلا: أنقذه يارب من الانحدار إلى الهاوية، فقد وجدت له فدية."]]}, {"l": "Psa 130:7", "n": "", "vs": [[7, "ليترج إسرائيل الرب، لأن منه الرحمة والفداء الكثير."]]}, {"l": "Dan 9:24-26", "n": "", "vs": [[24, "قد صدر القضاء أن يمضي سبعون أسبوعا على شعبك وعلى مدينة قدسك، للانتهاء من المعصية والقضاء على الخطيئة، وللتكفير عن الإثم، ولإشاعة البر الأبدي وختم الرؤيا والنبوءة ولمسح قدوس القدوسين."], [25, "لهذا فاعلم وافهم أن الحقبة الممتدة منذ صدور الأمر بإعادة بناء أورشليم إلى مجيء المسيح، سبعة أسابيع، ثم اثنان وستون أسبوعا يبنى في غضونها سوق وخليج. إنما تكون تلك أزمنة ضيق."], [26, "وبعد اثنين وستين أسبوعا يقتل المسيح، ولكن ليس من أجل نفسه، ويدمر شعب رئيس آت المدينة والقدس، وتقبل آخرتها كطوفان، وتستمر الحرب حتى النهاية، ويعم الخراب المقضي به."]]}, {"l": "Zec 9:11", "n": "", "vs": [[11, "أما أنتم فبفضل دم عهدي معكم أطلق أسراكم من الجب الذي لا ماء فيه."]]}, {"l": "Zec 13:1", "n": "", "vs": [[1, "»في ذلك اليوم يتفجر ينبوع ليطهر ذرية داود وسكان أورشليم من إثمهم ونجاستهم."]]}, {"l": "Zec 13:7", "n": "", "vs": [[7, "ويقول الرب القدير: «استيقظ أيها السيف وهاجم راعي ورجل رفقتي. اضرب الراعي فتتبدد الخراف. ولكني أرد يدي عن الصغار (أي القلة المؤمنة)."]]}, {"l": "Mat 20:28", "n": "", "vs": [[28, "فهكذا ابن الإنسان: قد جاء لا ليخدم، بل ليخدم ويبذل نفسه فدية عن كثيرين. »"]]}, {"l": "Mat 26:28", "n": "", "vs": [[28, "فإن هذا هو دمي الذي للعهد الجديد والذي يسفك من أجل كثيرين لمغفرة الخطايا."]]}, {"l": "Mar 14:24", "n": "", "vs": [[24, "وقال لهم: «هذا هو دمي الذي للعهد الجديد والذي يسفك من أجل كثيرين."]]}, {"l": "Act 20:28", "n": "", "vs": [[28, "فاسهروا إذن على أنفسكم وعلى جميع القطيع الذي عينكم بينه الروح القدس نظارا، لترعوا كنيسة الله التي اشتراها بدمه."]]}, {"l": "Rom 3:24", "n": "", "vs": [[24, "فهم يبررون مجانا، بنعمته، بالفداء بالمسيح يسوع"]]}, {"l": "1Co 1:30", "n": "", "vs": [[30, "وبفضل الله صار لكم مقام في المسيح يسوع الذي جعل لنا حكمة من الله وبرا وقداسة وفداء،"]]}, {"l": "Col 1:14", "n": "", "vs": [[14, "الذي فيه لنا الفداء، أي غفران الخطايا."]]}, {"l": "1Ti 2:6", "n": "", "vs": [[6, "الذي بذل نفسه فدية عوضا عن الجميع. هذه شهادة تؤدى في أوقاتها الخاصة،"]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Heb 9:12-15", "n": "", "vs": [[12, "فإلى «قدس الأقداس» في هذه الخيمة، دخل المسيح مرة واحدة، حاملا دم نفسه، لا دم تيوس وعجول. وذلك بعدما سفك دمه عوضا عنا. فحقق فداء أبديا."], [13, "ولا عجب! فوفقا للنظام السابق، كان دم الثيران والتيوس يرش على المنجسين، مع رماد عجلة محروقة، فيصيرون طاهرين طهارة جسدية."], [14, "فكم بالأحرى دم المسيح الذي قدم نفسه لله بروح أزلي ذبيحة لا عيب فيها، يطهر ضمائرنا من الأعمال الميتة لنعبد الله الحي."], [15, "ولذلك، فالمسيح هو الوسيط لهذا العهد الجديد. فبما أنه قد تم الموت فداء للمخالفات الحاصلة تحت العهد الأول، ينال المدعوون الوعد بالإرث الأبدي."]]}, {"l": "Heb 9:22", "n": "", "vs": [[22, "فالشريعة توصي بأن يتطهر كل شيء تقريبا بالدم. ولا غفران إلا بسفك الدم!"]]}, {"l": "Heb 10:4-12", "n": "", "vs": [[4, "فمن المستحيل أن يزيل دم الثيران والتيوس خطايا الناس."], [5, "لذلك قال المسيح، عند مجيئه إلى هذه الأرض: «إن الذبائح والتقدمات ما أردتها. لكنك أعددت لي جسدا بشريا."], [6, "فالحيوانات التي كانت تذبح وتحرق أمامك تكفيرا عن الخطيئة، لم ترض بها."], [7, "عندئذ قلت لك: ها أنا آتي لأعمل إرادتك، ياالله . هذا هو المكتوب عني في صفحة الكتاب !»"], [8, "فبعد أن عبر المسيح عن عدم رضى الله بجميع التقدمات والذبائح التي كانت تقرب مع أنها كانت تقدم وفقا للشريعة،"], [9, "أضاف قائلا: «ها أنا آتي لأعمل إرادتك!» فهو، إذن، يلغي النظام السابق، ليضع محله نظاما جديدا ينسجم مع إرادة الله."], [10, "بموجب هذه الإرادة الإلهية، صرنا مقدسين إذ قرب يسوع المسيح، مرة واحدة، جسده عوضا عنا!"], [11, "وقديما، كان كل كاهن يقف يوميا أمام المذبح ليقوم بمهمته، فيقدم لله تلك الذبائح عينها، مع أنها لم تكن قادرة على إزالة الخطايا إطلاقا."], [12, "ولكن المسيح، رئيس كهنتنا، قدم ذبيحة واحدة عن الخطايا، ثم جلس إلى الأبد عن يمين الله،"]]}, {"l": "1Pe 1:18", "n": "", "vs": [[18, "واعلموا أنه قد دفع الفدية ليحرركم من سيرة حياتكم الباطلة التي أخذتموها بالتقليد عن آبائكم. وهذه الفدية لم تكن شيئا فانيا كالفضة أو الذهب،"]]}, {"l": "1Pe 1:19", "n": "", "vs": [[19, "بل كانت دما ثمينا، دم المسيح، ذلك الحمل الطاهر الذي ليس فيه عيب ولا دنس!"]]}, {"l": "1Pe 2:24", "n": "", "vs": [[24, "وهو نفسه حمل خطايانا في جسده (عندما مات مصلوبا) على الخشبة، لكي نموت بالنسبة للخطايا فنحيا حياة البر. وبجراحه هو تم لكم الشفاء،"]]}, {"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}, {"l": "1Jo 2:2", "n": "", "vs": [[2, "فهو كفارة لخطايانا، لا لخطايانا فقط، بل لخطايا العالم كله."]]}, {"l": "1Jo 4:10", "n": "", "vs": [[10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."]]}, {"l": "Rev 5:9", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"]]}, {"l": "Rev 14:4", "n": "", "vs": [[4, "فهؤلاء لم ينجسوا أنفسهم مع النساء لأنهم أطهار، وهم يتبعون الحمل حيثما ذهب، وقد تم شراؤهم من بين الناس باكورة لله، وللحمل،"]]}], "kwAr": "ففيه لنا بدمه الفداء", "noteAr": ""}, {"kw": "the forgiveness", "raw": "Exo_34:7; Psa_32:1, Psa_32:2, Psa_86:5, Psa_130:4; Isa_43:25, Isa_55:6, Isa_55:7; Jer_31:34; Dan_9:9, Dan_9:19; Jon_4:2; Mic_7:18; Luk_1:77, Luk_7:40-42, Luk_7:47-50, Luk_24:47; Joh_20:23; Act_2:38, Act_3:19, Act_10:43, Act_13:38, Act_13:39; Rom_4:6-9; Col_2:13; Heb_10:17, Heb_10:18; 1Jo_1:7-9, 1Jo_2:12", "note": "", "refs": [{"l": "Exo 34:7", "n": "", "vs": [[7, "أدخر الإحسان وأغفر الإثم والمعصية والخطيئة. ولكني لا أعفي المذنب من العقاب، بل أفتقد إثم الآباء في الأبناء والأحفاد حتى الجيل الرابع»."]]}, {"l": "Psa 32:1", "n": "", "vs": [[1, "طوبى للذي غفرت آثامه وسترت خطاياه."]]}, {"l": "Psa 32:2", "n": "", "vs": [[2, "طوبى للرجل الذي لا يحسب له الرب خطيئة، وليس في روحه غش."]]}, {"l": "Psa 86:5", "n": "", "vs": [[5, "لأنك أنت يارب طيب وغفور، وكثير الرحمة لجميع الذين يدعونك."]]}, {"l": "Psa 130:4", "n": "", "vs": [[4, "ولأنك مصدر الغفران فإن جميع الناس يهابونك."]]}, {"l": "Isa 43:25", "n": "", "vs": [[25, "أنا، أنا هو الماحي ذنوبك من أجل ذاتي، وخطاياك لن أذكرها."]]}, {"l": "Isa 55:6", "n": "", "vs": [[6, "اطلبوا الرب مادام موجودا، ادعوه وهو قريب."]]}, {"l": "Isa 55:7", "n": "", "vs": [[7, "ليترك الشرير طريقه والأثيم أفكاره، وليتب إلى الرب فيرحمه، وليرجع إلى إلهنا لأنه يكثر الغفران."]]}, {"l": "Jer 31:34", "n": "", "vs": [[34, "ولا يحض في ما بعد كل واحد قريبه قائلا: اعرف الرب إلهك لأنهم جميعا سيعرفونني، من صغيرهم إلى كبيرهم، لأني سأصفح عن إثمهم ولن أذكر خطاياهم من بعد»."]]}, {"l": "Dan 9:9", "n": "", "vs": [[9, "إنما للرب إلهنا الرحمة والمغفرة لأننا عصيناك."]]}, {"l": "Dan 9:19", "n": "", "vs": [[19, "فاستمع أيها السيد واغفر. أصغ أيها السيد وتصرف ولا تبطىء من أجل نفسك ياإلهي، لأن اسمك دعي على مدينتك وعلى شعبك»."]]}, {"l": "Jon 4:2", "n": "", "vs": [[2, "وصلى إلى الرب قائلا: «أيها الرب، أليس هذا ما قلته عندما كنت في بلادي؟ لهذا أسرعت إلى الهرب إلى ترشيش، لأني عرفت أنك إله رحيم رؤوف بطيء الغضب كثير الإحسان، ترجع عن العقاب."]]}, {"l": "Mic 7:18", "n": "", "vs": [[18, "إي إله مثلك يصفح عن الإثم ويعفو عن معصية بقية ميراثه؟ لا يحتفظ إلى الأبد بغضبه لأنه يسر بالرحمة."]]}, {"l": "Luk 1:77", "n": "", "vs": [[77, "لتعطي شعبه المعرفة بأن الخلاص هو بمغفرة خطاياهم"]]}, {"l": "Luk 7:40-42", "n": "", "vs": [[40, "فرد عليه يسوع قائلا: «ياسمعان، عندي شيء أقوله لك». أجاب: «قل يامعلم!»"], [41, "فقال: «كان لأحد المتعاملين بالدين، دين على اثنين: على أحدهما خمس مئة دينار، وعلى الآخر خمسون."], [42, "ولكن إذ لم يكن عندهما ما يدفعانه وفاء للدين، سامحهما كليهما. فأيهما يكون أكثر حبا له؟»"]]}, {"l": "Luk 7:47-50", "n": "", "vs": [[47, "لهذا السبب أقول لك: إن خطاياها الكثيرة قد غفرت، لهذا أحبت كثيرا. ولكن الذي يغفر له القليل، يحب قليلا!»"], [48, "ثم قال لها: «مغفورة لك خطاياك!»"], [49, "فأخذ المتكئون يسائلون أنفسهم: «من هو هذا الذي يغفر الخطايا أيضا؟»"], [50, "وقال للمرأة: «إيمانك قد خلصك. اذهبي بسلام!»"]]}, {"l": "Luk 24:47", "n": "", "vs": [[47, "وأن يبشر باسمه بالتوبة وغفران الخطايا في جميع الأمم انطلاقا من أورشليم."]]}, {"l": "Joh 20:23", "n": "", "vs": [[23, "من غفرتم خطاياهم غفرت لهم، ومن أمسكتم خطاياهم، أمسكت!»"]]}, {"l": "Act 2:38", "n": "", "vs": [[38, "أجابهم بطرس: «توبوا، وليتعمد كل واحد منكم باسم يسوع المسيح، فيغفر الله خطاياكم وتنالوا هبة الروح القدس،"]]}, {"l": "Act 3:19", "n": "", "vs": [[19, "فتوبوا وارجعوا ليمحو الله خطاياكم،"]]}, {"l": "Act 10:43", "n": "", "vs": [[43, "له يشهد جميع الأنبياء أن كل من يؤمن به ينال باسمه غفران الخطايا»."]]}, {"l": "Act 13:38", "n": "", "vs": [[38, "فاعلموا، أيها الإخوة، أنه بيسوع تبشرون بغفران الخطايا ،"]]}, {"l": "Act 13:39", "n": "", "vs": [[39, "وأنه به يتبرر كل من يؤمن من كل ما عجزت شريعة موسى أن تبرره منه."]]}, {"l": "Rom 4:6-9", "n": "", "vs": [[6, "كما يهنيء داود أيضا الإنسان الذي يحسب له الله برا بمعزل عن الأعمال، إذ يقول:"], [7, "«طوبى للذين غفرت آثامهم وسترت خطاياهم."], [8, "طوبى للرجل الذي لا يحسب له الرب خطيئة!»"], [9, "فهل هذه الطوبى لأهل الختان وحدهم، أم لأهل عدم الختان أيضا؟ إننا نقول إن الإيمان قد حسب لإبراهيم برا."]]}, {"l": "Col 2:13", "n": "", "vs": [[13, "فأنتم، إذ كنتم أمواتا في الخطايا وعدم ختانكم الجسدي، أحياكم جميعا معه؛ مسامحا لنا جميعا بالخطايا كلها."]]}, {"l": "Heb 10:17", "n": "", "vs": [[17, "ثم أضاف: «ولا أعود أبدا إلى تذكر خطاياهم ومخالفاتهم»."]]}, {"l": "Heb 10:18", "n": "", "vs": [[18, "فحينما يتحقق غفر ان الخطايا، لا تبقى حاجة بعد إلى تقريب التقدمات عنها!"]]}, {"l": "1Jo 1:7-9", "n": "", "vs": [[7, "ولكن، إن كنا فعلا نعيش في النور، كما هو في النور، تكون لنا حقا شركة بعضنا مع بعض، ودم ابنه يسوع يطهرنا من كل خطيئة."], [8, "إن كنا ندعي أن لا خطيئة لنا، نخدع أنفسنا، ولا يكون الحق في داخلنا."], [9, "ولكن، إن اعترفنا لله بخطايانا، فهو جدير بالثقة وعادل، يغفر لنا خطايانا ويطهرنا من كل إثم."]]}, {"l": "1Jo 2:12", "n": "", "vs": [[12, "أكتب إليكم، أيها الأولاد، لأن الله قد غفر لكم خطاياكم إكراما لاسم المسيح."]]}], "kwAr": "غفران الخطايا", "noteAr": ""}, {"kw": "to", "raw": "Eph_1:6, Eph_2:4, Eph_2:7, Eph_3:8, Eph_3:16; Rom_2:4, Rom_3:24, Rom_9:23; 2Co_8:9; Phi_4:19; Col_1:27, Col_2:2; Tit_3:6 *marg.", "note": "", "refs": [{"l": "Eph 1:6", "n": "", "vs": [[6, "بغرض مدح مجد نعمته التي بها أعطانا حظوة لديه في المحبوب:"]]}, {"l": "Eph 2:4", "n": "", "vs": [[4, "أما الله ، وهو غني في الرحمة، فبسبب محبته العظيمة التي أحبنا بها،"]]}, {"l": "Eph 2:7", "n": "", "vs": [[7, "وذلك كي يعرض في الدهور القادمة غنى نعمته الفائق في لطفه علينا في المسيح يسوع."]]}, {"l": "Eph 3:8", "n": "", "vs": [[8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "Eph 3:16", "n": "", "vs": [[16, "لكي يمنحكم، وفقا لغنى مجده، أن يمد الروح الكيان الداخلي في كل منكم بالقوة المؤيدة،"]]}, {"l": "Rom 2:4", "n": "", "vs": [[4, "أم أنك تحتقر غنى لطفه وصبره وطول أناته وأنت لا تعرف أن لطف الله يدفعك إلى التوبة؟"]]}, {"l": "Rom 3:24", "n": "", "vs": [[24, "فهم يبررون مجانا، بنعمته، بالفداء بالمسيح يسوع"]]}, {"l": "Rom 9:23", "n": "", "vs": [[23, "وذلك بقصد أن يعلن غنى مجده في أوعية الرحمة التي سبق فأعدها للمجد،"]]}, {"l": "2Co 8:9", "n": "", "vs": [[9, "فأنتم تعرفون نعمة ربنا يسوع المسيح: فمن أجلكم افتقر، وهو الغني لكي تغتنوا أنتم بفقره."]]}, {"l": "Phi 4:19", "n": "", "vs": [[19, "وإن إلهي سيسد حاجاتكم كلها إلى التمام، وفقا لغناه في المجد، في المسيح يسوع."]]}, {"l": "Col 1:27", "n": "", "vs": [[27, "الذين أراد الله أن يعلن لهم كم هو غني مجد هذا السر بين الأمم: إنه المسيح فيكم، وهو رجاء المجد؛"]]}, {"l": "Col 2:2", "n": "", "vs": [[2, "بغرض أن تتشجع قلوبهم وتكون كلها متحدة في المحبة، لبلوغ الإدراك التام بكل غناه، لمعرفة سر الله، أي المسيح،"]]}, {"l": "Tit 3:6", "n": "*marg.", "vs": [[6, "الذي سكبه علينا بغنى بيسوع المسيح مخلصنا."]]}], "kwAr": "بحسب غنى نعمته", "noteAr": ""}], "arS": [["ففيه ", []], ["لنا", ["G2192"]], [" ", []], ["بدمه", ["G129"]], [" ", []], ["الفداء", ["G629"]], ["، أي ", []], ["غفران", ["G859"]], [" ", []], ["الخطايا", ["G3900"]], ["؛ ", []], ["بحسب", ["G2596"]], [" ", []], ["غنى", ["G4149"]], [" ", []], ["نعمته", ["G5485"]]]}, {"c": 1, "v": 8, "text": "التي جعلها تفيض علينا مصحوبة بكل حكمة وفهم.", "groups": [{"kw": "he", "raw": "Rom_5:15, Rom_5:20,Rom_5:21", "note": "", "refs": [{"l": "Rom 5:15", "n": "", "vs": [[15, "ولكن مفعول المعصية ليس كمفعول النعمة! فإذا كان الكثيرون بمعصية إنسان واحد قد ماتوا، فكم بالأحرى في الإنسان الواحد يسوع المسيح تتوافر للكثيرين نعمة الله والعطية المجانية بالنعمة."]]}, {"l": "Rom 5:20", "n": "", "vs": [[20, "وأما الشريعة فقد أدخلت لتظهر كثرة المعصية. ولكن، حيث كثرت الخطيئة، تتوافر النعمة أكثر جدا،"]]}, {"l": "Rom 5:21", "n": "", "vs": [[21, "حتى إنه كما ملكت الخطيئة بالموت، فكذلك أيضا تملك النعمة على أساس البر مؤدية إلى الحياة الأبدية بيسوع المسيح ربنا."]]}], "kwAr": "جعلها تفيض علينا", "noteAr": ""}, {"kw": "in", "raw": "Eph_1:11, Eph_3:10; Psa_104:24; Pro_8:12; Isa_52:13; Dan_2:20,Dan_2:21; Mat_11:19; Rom_11:33; 1Co_1:19-24, 1Co_2:7; Col_2:3; Jud_1:25; Rev_5:12", "note": "", "refs": [{"l": "Eph 1:11", "n": "", "vs": [[11, "وفي المسيح أيضا قد حصلنا على الميراث الذي سبق أن عينا له، وفقا لقصده، هو الذي يعمل كل شيء كما تقضي مشيئته."]]}, {"l": "Eph 3:10", "n": "", "vs": [[10, "والغاية أن يتجلى الآن أمام الرئاسات والسلطات في الأماكن السماوية ما يظهر في الكنيسة من حكمة الله المتعددة الوجوه،"]]}, {"l": "Psa 104:24", "n": "", "vs": [[24, "يارب ما أعظم أعمالك، كلها صنعت بحكمة، فامتلأت الأرض من غناك."]]}, {"l": "Pro 8:12", "n": "", "vs": [[12, "أنا الحكمة أسكن التعقل، وأملك المعرفة والتدبير."]]}, {"l": "Isa 52:13", "n": "", "vs": [[13, "ها هو عبدي يفلح، ويتعظم ويتعالى ويتسامى جدا."]]}, {"l": "Dan 2:20", "n": "", "vs": [[20, "قائلا: «ليكن اسم الله مباركا من الأزل وإلى الأبد لأن له الحكمة والقدرة."]]}, {"l": "Dan 2:21", "n": "", "vs": [[21, "هو يغير الأوقات والفصول. يعزل ملوكا وينصب ملوكا. يهب الحكماء حكمة وذوي الفطنة معرفة."]]}, {"l": "Mat 11:19", "n": "", "vs": [[19, "ثم جاء ابن الإنسان يأكل ويشرب، فقالوا: هذا رجل شره وسكير، صديق لجباة الضرائب والخاطئين. ولكن تختبر الحكمة بأعمالها.»"]]}, {"l": "Rom 11:33", "n": "", "vs": [[33, "فما أعمق غنى الله وحكمته وعلمه! ما أبعد أحكامه عن الفحص وطرقه عن التتبع !"]]}, {"l": "1Co 1:19-24", "n": "", "vs": [[19, "فإنه قد كتب: «سأبيد حكمة الحكماء وأزيل فهم الفهماء!»"], [20, "إذن، أين الحكيم؟ وأين الكاتب؟ وأين المجادل في هذا الزمان؟ ألم يقلب الله حكمة هذا العالم جهالة؟"], [21, "فبما أن العالم، في حكمة الله، لم يعرف الله عن طريق الحكمة، فقد سر الله أن يخلص بجهالة البشارة الذين يؤمنون."], [22, "إذ إن اليهود يطلبون آيات، واليونانيين يبحثون عن الحكمة."], [23, "ولكننا نحن نبشر بالمسيح مصلوبا، مما يشكل عائقا عند اليهود وجهالة عند الأمم؛"], [24, "وأما عند المدعوين، سواء من اليهود أو اليونانيين، فإن المسيح هو قدر ة الله وحكمة الله."]]}, {"l": "1Co 2:7", "n": "", "vs": [[7, "بل إننا نتكلم بحكمة الله المطوية في سر، تلك الحكمة المحجوبة التي سبق الله فأعدها قبل الدهور لأجل مجدنا"]]}, {"l": "Col 2:3", "n": "", "vs": [[3, "المخزونة فيه كنوز الحكمة والمعرفة كلها."]]}, {"l": "Jud 1:25", "n": "", "vs": [[25, "لله الواحد، مخلصنا بيسوع المسيح ربنا ... المجد والجلال والقدرة والسلطة، من قبل أن كان الزمان، والآن وطوال الأزمان آمين!"]]}, {"l": "Rev 5:12", "n": "", "vs": [[12, "وهم يهتفون بصوت عال: «مستحق هو الحمل المذبوح أن ينال القدرة والغنى والحكمة والقوة والإجلال والمجد والبركة»."]]}], "kwAr": "بكل حكمة وفهم", "noteAr": ""}], "arS": [["التي جعلها ", []], ["تفيض", ["G4052"]], [" علينا مصحوبة ", []], ["بكل", ["G3956"]], [" ", []], ["حكمة", ["G4678"]], [" ", []], ["وفهم", ["G5428"]], [".", []]]}, {"c": 1, "v": 9, "text": "إذ كشف لنا سر مشيئته بحسب مرضاته التي قصدها في نفسه،", "groups": [{"kw": "made", "raw": "Eph_1:17, Eph_1:18, Eph_3:3-9; Mat_13:11; Rom_16:25-27; 1Co_2:10-12; Gal_1:12, Gal_1:16; Col_1:26-28; 1Ti_3:16", "note": "", "refs": [{"l": "Eph 1:17", "n": "", "vs": [[17, "حتى يهبكم إله ربنا يسوع المسيح، أبو المجد، روح حكمة وإلهام: لتعرفوه معرفة كاملة"]]}, {"l": "Eph 1:18", "n": "", "vs": [[18, "إذ تستنير بصائر قلوبكم، فتعلموا ما في دعوته لكم من رجاء، وما هو غنى مجد ميراثه في القديسين،"]]}, {"l": "Eph 3:3-9", "n": "", "vs": [[3, "كيف كشف لي السر عن طريق الوحي، كما كتبت قبلا بإيجاز،"], [4, "ويمكنكم، حينما تقرأون ما كتبته، أن تدركوا اطلاعي العميق على سر المسيح،"], [5, "ذلك السر الذي لم يطلع عليه بنو البشر في الأجيال الماضية مثلما أعلن الآن بوحي الروح لرسله القديسين وأنبيائه:"], [6, "وهو أن الأمم هم شركاء اليهود في الميراث، وأعضاء في الجسد معهم، ولهم أيضا حق الاستفادة من الوعد. وذلك في المسيح يسوع وبفضل الإنجيل"], [7, "الذي صرت أنا خادما له بحسب نعمة الله الموهوبة لي وفقا لعمل قدرته."], [8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"], [9, "وأنير الجميع بمعرفة ما هو تدبير السر الذي أبقاه الله ، خالق كل شيء، مكتوما مدى الأجيال."]]}, {"l": "Mat 13:11", "n": "", "vs": [[11, "فأجاب: «لأنه قد أعطي لكم أن تعرفوا أسرار ملكوت السماوات؛ أما أولئك، فلم يعط لهم ذلك."]]}, {"l": "Rom 16:25-27", "n": "", "vs": [[25, "والمجد للقادر أن يثبتكم، وفقا لإنجيلي وللبشارة بيسوع المسيح، ووفقا لإعلان ما كان سرا ظل مكتوما مدى الأزمنة الأزلية،"], [26, "ولكن أذيع الآن، بأمر الله الأزلي في الكتابات النبوية، على جميع الأمم لأجل إطاعة الإيمان؛"], [27, "المجد لله إلى الأبد، الحكيم وحده، بيسوع المسيح. آمين!"]]}, {"l": "1Co 2:10-12", "n": "", "vs": [[10, "ولكن الله كشف لنا ذلك بالروح. فإن الروح يتقصى كل شيء، حتى أعماق الله."], [11, "فمن من الناس يعرف ما في الإنسان إلا روح الإنسان الذي فيه؛ وكذلك فإن ما في الله أيضا لا يعرفه أحد إلا روح الله."], [12, "وأما نحن فقد نلنا لا روح العالم بل الروح الذي من الله، لنعرف الأمور التي وهبت لنا من قبل الله."]]}, {"l": "Gal 1:12", "n": "", "vs": [[12, "فلا أنا تسلمته من إنسان، ولا تلقنته، بل جاءني بإعلان من يسوع المسيح."]]}, {"l": "Gal 1:16", "n": "", "vs": [[16, "أن يعلن ابنه في لأبشر به بين الأمم، في الحال لم أستشر لحما ودما،"]]}, {"l": "Col 1:26-28", "n": "", "vs": [[26, "السر الذي كان مكتوما طوال العصور والأجيال، ولكن كشف الآن لقديسيه،"], [27, "الذين أراد الله أن يعلن لهم كم هو غني مجد هذا السر بين الأمم: إنه المسيح فيكم، وهو رجاء المجد؛"], [28, "هذا السر نعلنه نحن، واعظين كل إنسان، ومعلمين كل إنسان، في كل حكمة، لكي نحضر كل إنسان كاملا في المسيح."]]}, {"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}], "kwAr": "إذ كشف لنا سر مشيئته", "noteAr": ""}, {"kw": "according", "raw": "Eph_1:5", "note": "", "refs": [{"l": "Eph 1:5", "n": "", "vs": [[5, "إذ سبق فعيننا في المحبة ليتخذنا أبناء له بيسوع المسيح. وذلك موافق للقصد الذي سرت به مشيئته،"]]}], "kwAr": "بحسب مرضاته", "noteAr": ""}, {"kw": "purposed", "raw": "Eph_1:11, Eph_3:11; Job_23:13, Job_23:14; Psa_33:11; Isa_14:24-27, Isa_46:10,Isa_46:11; Jer_2:29; Lam_3:37, Lam_3:38; Act_2:23, Act_4:28, Act_13:48; Rom_8:28; 2Ti_1:9", "note": "", "refs": [{"l": "Eph 1:11", "n": "", "vs": [[11, "وفي المسيح أيضا قد حصلنا على الميراث الذي سبق أن عينا له، وفقا لقصده، هو الذي يعمل كل شيء كما تقضي مشيئته."]]}, {"l": "Eph 3:11", "n": "", "vs": [[11, "وفقا للقصد الأزلي الذي قصده الله في المسيح يسوع ربنا،"]]}, {"l": "Job 23:13", "n": "", "vs": [[13, "ولكنه متفرد وحده فمن يرده؟ يفعل ما يشاء،"]]}, {"l": "Job 23:14", "n": "", "vs": [[14, "لأنه يتمم ما رسمه لي، ومازال لديه وفرة منها."]]}, {"l": "Psa 33:11", "n": "", "vs": [[11, "أما مقاصد الرب فتثبت إلى الأبد، وأفكار قلبه تدوم مدى الدهور."]]}, {"l": "Isa 14:24-27", "n": "", "vs": [[24, "لقد أقسم الرب القدير قائلا: «حقا ما عزمت عليه لابد أن يتحقق، وما نويت عليه حتما يتم:"], [25, "أن أحطم أشور في أرضي وأطأه على جبالي، فيلقي عنهم نيره، ويزول عن كاهلهم حمله."], [26, "هذا هو القضاء الذي حكمت به على الأرض كلها، وهذه هي اليد التي امتدت على كل الأمم."], [27, "لأن الرب القدير قد قضى، فمن يبطل قضاءه؟ ويده قد امتدت فمن يردها؟»"]]}, {"l": "Isa 46:10", "n": "", "vs": [[10, "وقد أنبأت بالنهاية منذ البدء، وأخبرت من القدم بأمور لم تكن قد حدثت بعد، قائلا: مقاصدي لابد أن تتم، ومشيئتي لابد أن تتحقق."]]}, {"l": "Isa 46:11", "n": "", "vs": [[11, "أدعو من المشرق الطائر الجارح، ومن الأرض البعيدة رجل مشورتي. قد نطقت بقضائي ولابد أن أجريه، وما رسمته من خطة لابد أن أنفذه."]]}, {"l": "Jer 2:29", "n": "", "vs": [[29, "لماذا تخاصمونني وأنتم كلكم قد تمردتم علي؟"]]}, {"l": "Lam 3:37", "n": "", "vs": [[37, "من ذا الذي يقضي بأمر فيتحقق إن لم يكن الرب قد أمر به؟"]]}, {"l": "Lam 3:38", "n": "", "vs": [[38, "أليس من فم العلي يصدر الضر والخير؟"]]}, {"l": "Act 2:23", "n": "", "vs": [[23, "ومع ذلك فقد سمح الله ، وفقا لمشيئته المحتومة وعلمه السابق، أن تقبضوا عليه وتصلبوه وتقتلوه بأيدي الأثمة."]]}, {"l": "Act 4:28", "n": "", "vs": [[28, "وعملوا به كل ما سبق أن رسمت يدك وقضت مشيئتك أن يكون."]]}, {"l": "Act 13:48", "n": "", "vs": [[48, "فلما سمع غير اليهود ذلك، فرحوا جدا، ومجدوا كلمة الرب. وآمن جميع من أعدهم الله للحياة الأبدية."]]}, {"l": "Rom 8:28", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،"]]}], "kwAr": "التي قصدها في نفسه", "noteAr": ""}], "arS": [["إذ ", []], ["كشف", ["G1107"]], [" لنا ", []], ["سر", ["G3466"]], [" ", []], ["مشيئته", ["G2307"]], [" ", []], ["بحسب", ["G2596"]], [" ", []], ["مرضاته", ["G2107"]], [" التي ", []], ["قصدها", ["G4388"]], [" في نفسه،", []]]}, {"c": 1, "v": 10, "text": "لأجل تدبير تمام الأزمنة، حين يوحد كل شيء تحت رئاسة المسيح، سواء الأشياء التي في السماوات والتي على الأرض.", "groups": [{"kw": "in the", "raw": "Isa_2:2-4; Dan_2:44, Dan_9:24-27; Amo_9:11; Mic_4:1, Mic_4:2; Mal_3:1; 1Co_10:11; Gal_4:4; Heb_1:2, Heb_9:10, Heb_11:40; 1Pe_1:20", "note": "", "refs": [{"l": "Isa 2:2-4", "n": "", "vs": [[2, "ويحدث في آخر الأيام، أن جبل هيكل الرب يصبح أسمى من كل الجبال، ويعلو فوق كل التلال، فتتوافد إليه جميع الأمم."], [3, "وتقبل شعوب كثيرة وتقول: تعالوا لنذهب إلى جبل الرب، إلى بيت إله يعقوب، فيعلمنا طرقه، ونسلك في سبله، لأن من صهيون تخرج الشريعة، ومن أورشليم تعلن كلمة الرب."], [4, "فيقضي بين الأمم ويحكم بين الشعوب الكثيرة، فيطبعون سيوفهم محاريث ورماحهم مناجل، ولا ترفع أمة على أمة سيفا، ولا يتدربون على الحرب فيما بعد."]]}, {"l": "Dan 2:44", "n": "", "vs": [[44, "وفي عهد هؤلاء الملوك يقيم إله السماوات مملكة لا تنقرض إلى الأبد، ولا يترك ملكها لشعب آخر، وتسحق وتبيد جميع هذه الممالك. أما هي فتخلد إلى الأبد."]]}, {"l": "Dan 9:24-27", "n": "", "vs": [[24, "قد صدر القضاء أن يمضي سبعون أسبوعا على شعبك وعلى مدينة قدسك، للانتهاء من المعصية والقضاء على الخطيئة، وللتكفير عن الإثم، ولإشاعة البر الأبدي وختم الرؤيا والنب
