لى أساس الأعمال؟ لا، بل على أساس الإيمان،"], [28, "لأننا قد استنتجنا أن الإنسان يتبرر بالإيمان، بمعزل عن الأعمال المطلوبة في الشريعة."], [29, "أو يكون الله إله اليهود وحدهم؟ أما هو إله الأمم أيضا؟ بلى، إنه إله الأمم أيضا،"], [30, "مادام الله الواحد هو الذي سيبرر أهل الختان على أساس الإيمان، وأهل عدم الختان على أساس الإيمان."]]}, {"l": "Rom 5:9", "n": "", "vs": [[9, "ومادمنا الآن قد تبررنا بدمه، فكم بالأحرى نخلص به من الغضب الآتي!"]]}, {"l": "Rom 5:10", "n": "", "vs": [[10, "فإن كنا، ونحن أعداء، قد تصالحنا مع الله بموت ابنه، فكم بالأحرى نخلص بحياته ونحن مصالحون!"]]}, {"l": "1Co 6:11", "n": "", "vs": [[11, "وهكذا كان بعضكم، إلا أنكم قد اغتسلتم، بل تقدستم، بل تبررتم، باسم الرب يسوع المسيح وبروح إلهنا."]]}, {"l": "2Co 5:20", "n": "", "vs": [[20, "فنحن إذن سفراء المسيح، وكأن الله يعظ بنا نتوسل بالنيابة عن المسيح منادين: «تصالحوا مع الله!»"]]}, {"l": "2Co 5:21", "n": "", "vs": [[21, "فإن الذي لم يعرف خطيئة، جعله الله خطيئة لأجلنا، لنصير نحن بر الله فيه."]]}, {"l": "Col 1:13", "n": "", "vs": [[13, "هو الذي أنقذنا من سلطة الظلام ونقلنا إلى ملكوت ابن محبته"]]}, {"l": "Col 1:14", "n": "", "vs": [[14, "الذي فيه لنا الفداء، أي غفران الخطايا."]]}, {"l": "Col 1:21", "n": "", "vs": [[21, "وأنتم، يامن كنتم في الماضي أجانب وأعداء في الفكر، بأعمالكم الشريرة،"]]}, {"l": "Col 1:22", "n": "", "vs": [[22, "قد صالحكم الآن في جسد بشرية (ابنه) بالموت. وذلك لكي يحضركم فتمثلوا أمامه وأنتم قديسون بلا ذنب ولا لوم."]]}, {"l": "Heb 9:18", "n": "", "vs": [[18, "وهكذا، فحتى العهد العتيق لم يبدأ تنفيذه إلا برش الدم."]]}, {"l": "1Pe 1:18", "n": "", "vs": [[18, "واعلموا أنه قد دفع الفدية ليحرركم من سيرة حياتكم الباطلة التي أخذتموها بالتقليد عن آبائكم. وهذه الفدية لم تكن شيئا فانيا كالفضة أو الذهب،"]]}, {"l": "1Pe 1:19", "n": "", "vs": [[19, "بل كانت دما ثمينا، دم المسيح، ذلك الحمل الطاهر الذي ليس فيه عيب ولا دنس!"]]}, {"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}, {"l": "Rev 5:9", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"]]}], "kwAr": "قد صرتم قريبين", "noteAr": ""}], "arS": [["أما ", []], ["الآن", ["G3570"]], ["، ففي ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], ["، أنتم الذين كنتم من قبل ", []], ["بعيدين", ["G3112"]], [" قد صرتم ", []], ["قريبين", ["G1451"]], [" ", []], ["بدم", ["G129"]], [" ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 2, "v": 14, "text": "فإنه هو سلامنا، ذاك الذي جعل الفريقين واحدا وهدم حائط الحاجز الفاصل بينهما،", "groups": [{"kw": "our", "raw": "Isa_9:6, Isa_9:7; Eze_34:24, Eze_34:25; Mic_5:5; Zec_6:13; Luk_1:79, Luk_2:14; Joh_16:33; Act_10:36; Rom_5:1; Col_1:20; Heb_7:2, Heb_13:20", "note": "", "refs": [{"l": "Isa 9:6", "n": "", "vs": [[6, "لأنه يولد لنا ولد ويعطى لنا ابن يحمل الرياسة على كتفه، ويدعى اسمه عجيبا، مشيرا، إلها قديرا، أبا أبديا، رئيس السلام."]]}, {"l": "Isa 9:7", "n": "", "vs": [[7, "ولا تكون نهاية لنمو رياسته وللسلام اللذين يسودان عرش داود ومملكته، ليثبتها ويعضدها بالحق والبر، من الآن وإلى الأبد. إن غيرة الرب القدير تتمم هذا."]]}, {"l": "Eze 34:24", "n": "", "vs": [[24, "وأنا الرب أكون لهم إلها، وعبدي داود يكون لهم رئيسا. أنا الرب تكلمت."]]}, {"l": "Eze 34:25", "n": "", "vs": [[25, "وأبرم معهم ميثاق سلام، وأقضي على الوحوش الضارية في الأرض فيقيمون في الصحراء آمنين، وينامون في الغابات مطمئنين."]]}, {"l": "Mic 5:5", "n": "", "vs": [[5, "ويصبح الرب سلامهم، إذ حين يزحف الأشوريون إلى أرضنا ويطأون ترابنا، فإننا نثير عليهم سبعة رعاة وثمانية أمراء من الناس،"]]}, {"l": "Zec 6:13", "n": "", "vs": [[13, "هو الذي يبني هيكل الرب ويتجلل بالمجد ويكون نفسه ملكا وكاهنا في آن واحد فيجلس ويحكم على عرشه ويعمل بفضل مشورة رتبتيه على إشاعة السلام بين قومه."]]}, {"l": "Luk 1:79", "n": "", "vs": [[79, "ليضيء على القابعين في الظلام وظل الموت، ويهدي خطانا في طريق السلام»."]]}, {"l": "Luk 2:14", "n": "", "vs": [[14, "«المجد لله في الأعالي، وعلى الأرض السلام؛ وبالناس المسرة! »"]]}, {"l": "Joh 16:33", "n": "", "vs": [[33, "أخبرتكم بهذا كله ليكون لكم في سلام. فإنكم في العالم ستقاسون الضيق. ولكن تشجعوا، فأنا قد انتصرت على العالم!»"]]}, {"l": "Act 10:36", "n": "", "vs": [[36, "وقد أرسل كلمته إلى بني إسرائيل، وبشرهم بالسلام بواسطة يسوع المسيح، رب الجميع."]]}, {"l": "Rom 5:1", "n": "", "vs": [[1, "فبما أننا قد تبررنا على أساس الإيمان، صرنا في سلام مع الله بربنا يسوع المسيح."]]}, {"l": "Col 1:20", "n": "", "vs": [[20, "وأن يصالح به كل شيء مع نفسه، إذ أحل السلام بدمه على الصليب، فبه يصالح كل شيء، سواء كان ما على الأرض أو ما في السماوات."]]}, {"l": "Heb 7:2", "n": "", "vs": [[2, "وأدى له إبراهيم عشرا من كل ما غنمه في المعركة. فمن جهة، يعني اسم ملكيصادق «ملك العدل». ومن جهة أخرى، كان لقبه «ملك ساليم» أي «ملك السلام»."]]}, {"l": "Heb 13:20", "n": "", "vs": [[20, "وأسأل الله ، إله السلام الذي أقام من بين الأموات ربنا يسوع راعي الخراف العظيم بفضل دمه الذي ختم به العهد الأبدي"]]}], "kwAr": "هو سلامنا", "noteAr": ""}, {"kw": "both", "raw": "Eph_2:15, Eph_3:15, Eph_4:16; Isa_19:24, Isa_19:25; Eze_37:19, Eze_37:20; Joh_10:16, Joh_11:52; 1Co_12:12; Gal_3:28; Col_3:11", "note": "", "refs": [{"l": "Eph 2:15", "n": "", "vs": [[15, "أي العداء: إذ أبطل بجسده شريعة الوصايا ذات الفرائض، لكي يكون من الفريقين إنسانا واحدا جديدا، إذ أحل السلام بينهما،"]]}, {"l": "Eph 3:15", "n": "", "vs": [[15, "الذي هو أصل كل أبوة في السماوات وعلى الأرض،"]]}, {"l": "Eph 4:16", "n": "", "vs": [[16, "فمنه يستمد الجسد كله تماسكه وترابطه بمساندة كل مفصل وفقا لمقدار العمل المخصص لكل جزء، لينشيء نموا يؤول إلى بنيان الجسد بنيانا ذاتيا في المحبة."]]}, {"l": "Isa 19:24", "n": "", "vs": [[24, "في ذلك اليوم يكون إسرائيل ثالث ثلاثة مع مصر وأشور، وبركة في وسط الأرض،"]]}, {"l": "Isa 19:25", "n": "", "vs": [[25, "فيباركهم الرب القدير قائلا: «مبارك شعبي مصر، وصنعة يدي أشور، وميراثي إسرائيل»."]]}, {"l": "Eze 37:19", "n": "", "vs": [[19, "فقل لهم: هذا ما يعلنه السيد الرب: ها أنا أتناول قضيب يوسف الذي في حوزة أفرايم وأسباط إسرائيل رفاقه، وأضم إليه قضيب يهوذا، وأجعلهم جميعا قضيبا واحدا فيصبحون واحدا في يدي."]]}, {"l": "Eze 37:20", "n": "", "vs": [[20, "ويكون في يدك، على مشهد منهم القضيبان اللذان كتبت عليهما."]]}, {"l": "Joh 10:16", "n": "", "vs": [[16, "ولي خراف أخرى لا تنتمي إلى هذه الحظيرة، لا بد أن أجمعها إلي أيضا، فتصغي لصوتي؛ فيكون هناك قطيع واحد وراع واحد."]]}, {"l": "Joh 11:52", "n": "", "vs": [[52, "وليس فدى الأمة وحسب بل أيضا ليجمع أبناء الله المشتتين فيجعلهم واحدا."]]}, {"l": "1Co 12:12", "n": "", "vs": [[12, "فكما أن الجسد واحد وله أعضاء كثيرة، ولكن أعضاء الجسد كلها تشكل جسما واحدا مع أنها كثيرة، فكذلك حال المسيح أيضا."]]}, {"l": "Gal 3:28", "n": "", "vs": [[28, "لا فرق بعد الآن بين يهودي ويوناني، أو عبد وحر، أو ذكر وأنثى، لأنكم جميعا واحد في المسيح يسوع."]]}, {"l": "Col 3:11", "n": "", "vs": [[11, "وفيه لا فرق بين يوناني ويهودي، أو مختون وغير مختون، أو متحضر ومتخلف، أو عبد وحر، بل المسيح هو الكل وفي الكل."]]}], "kwAr": "جعل الفريقين واحدا", "noteAr": ""}, {"kw": "the middle", "raw": "Est_3:8; Act_10:28; Col_2:10-14, Col_2:20", "note": "", "refs": [{"l": "Est 3:8", "n": "", "vs": [[8, "فقال هامان للملك أحشويروش: «هناك شعب ما متشتت ومتفرق بين الشعوب في كل أرجاء مملكتك، تغاير شرائعهم شرائع جميع الأمم، وهم لا ينفذون سنن الملك. فلا يجدر بالملك إغفال أمرهم."]]}, {"l": "Act 10:28", "n": "", "vs": [[28, "فقال لهم: «أنتم تعلمون أنه محرم على اليهودي أن يتعامل مع الأجنبي أو يزوره في بيته. غير أن الله أراني ألا أقول عن إنسان ما إنه دنس أو نجس."]]}, {"l": "Col 2:10-14", "n": "", "vs": [[10, "وأنتم مكملون فيه. فهو رأس كل رئاسة وسلطة؛"], [11, "وفيه أيضا ختنتم أنتم ختانا لم تجره الأيدي، إذ نزع عنكم جسد الخطايا البشري وهذا هو ختان المسيح:"], [12, "فقد دفنتم معه في المعمودية، وفيها أيضا أقمتم معه، عن طريق إيمانكم بقدرة الله الذي أقامه من بين الأموات."], [13, "فأنتم، إذ كنتم أمواتا في الخطايا وعدم ختانكم الجسدي، أحياكم جميعا معه؛ مسامحا لنا جميعا بالخطايا كلها."], [14, "إذ قد محا صك الفرائض المكتوب علينا والمناقض لمصلحتنا، بل إنه قد أزاله من الوسط، مسمرا إياه على الصليب."]]}, {"l": "Col 2:20", "n": "", "vs": [[20, "فمادمتم قد متم مع المسيح بالنسبة لمباديء العالم، فلماذا، كما لو كنتم عائشين في العالم، تخضعون أنفسكم لفرائض مثل هذه:"]]}], "kwAr": "حائط الحاجز الفاصل", "noteAr": ""}], "arS": [["فإنه هو ", []], ["سلامنا", ["G1515", "G2257"]], ["، ذاك الذي ", []], ["جعل", ["G4160"]], [" ", []], ["الفريقين", ["G297"]], [" ", []], ["واحدا", ["G1520"]], [" ", []], ["وهدم", ["G3089"]], [" ", []], ["حائط", ["G3320"]], [" ", []], ["الحاجز", ["G5418"]], [" الفاصل بينهما،", []]]}, {"c": 2, "v": 15, "text": "أي العداء: إذ أبطل بجسده شريعة الوصايا ذات الفرائض، لكي يكون من الفريقين إنسانا واحدا جديدا، إذ أحل السلام بينهما،", "groups": [{"kw": "in his", "raw": "Col_1:22; Heb_10:19-22", "note": "", "refs": [{"l": "Col 1:22", "n": "", "vs": [[22, "قد صالحكم الآن في جسد بشرية (ابنه) بالموت. وذلك لكي يحضركم فتمثلوا أمامه وأنتم قديسون بلا ذنب ولا لوم."]]}, {"l": "Heb 10:19-22", "n": "", "vs": [[19, "فلنا الآن، أيها الإخوة حق التقدم بثقة إلى «قدس الأقداس» (في السماء) بدم يسوع."], [20, "وذلك بسلوك هذا الطريق الحي الجديد الذي شقه لنا المسيح بتمزيق الحجاب، أي جسده."], [21, "ولنا أيضا كاهن عظيم يمارس سلطته على بيت الله."], [22, "فلنتقدم إلى حضرة الله بقلب صادق وبثقة الإيمان الكاملة، بعدما طهر رش الدم قلوبنا من كل شعور بالذنب، وغسل الماء النقي أجسادنا."]]}], "kwAr": "إذ أبطل بجسده", "noteAr": ""}, {"kw": "the law", "raw": "Gal_3:10; Col_2:14, Col_2:20; Heb_7:16, Heb_8:13, Heb_9:9, Heb_9:10,Heb_9:23, Heb_10:1-10", "note": "", "refs": [{"l": "Gal 3:10", "n": "", "vs": [[10, "أما جميع الذين على مبدأ أعمال الشريعة، فإنهم تحت اللعنة، لأنه قد كتب: «ملعون كل من لا يثبت على العمل بكل ما هو مكتوب في كتاب الشريعة!»"]]}, {"l": "Col 2:14", "n": "", "vs": [[14, "إذ قد محا صك الفرائض المكتوب علينا والمناقض لمصلحتنا، بل إنه قد أزاله من الوسط، مسمرا إياه على الصليب."]]}, {"l": "Col 2:20", "n": "", "vs": [[20, "فمادمتم قد متم مع المسيح بالنسبة لمباديء العالم، فلماذا، كما لو كنتم عائشين في العالم، تخضعون أنفسكم لفرائض مثل هذه:"]]}, {"l": "Heb 7:16", "n": "", "vs": [[16, "لم يعين كاهنا على أساس الشريعة التي توصي بضرورة الانتماء إلى نسل بشري معين، بل على أساس القوة النابعة من حياته التي لا تزول أبدا."]]}, {"l": "Heb 8:13", "n": "", "vs": [[13, "وهكذا، نلاحظ أن الله بكلامه عن عهد جديد، جعل العهد السابق عتيقا. وطبيعي أن كل ما عتق وشاخ، يكون في طريقه إلى الزوال!"]]}, {"l": "Heb 9:9", "n": "", "vs": [[9, "وما هذا إلا صورة للوقت الحاضر الذي فيه مازالت التقدمات والذبائح تقرب وفقا لنظام العهد العتيق. ولكنها لا تستطيع أن تطهر قلوب الذين يتقربون بها إلى الله، ولا أن توصلهم إلى الكمال فتريح ضمائرهم."]]}, {"l": "Heb 9:10", "n": "", "vs": [[10, "إذ إن نظام العهد السابق قد اقتصر على تحريم بعض المأكولات والمشروبات وتحليل غيرها، وعلى وضع النظم المختصة بطقوس الاغتسال المختلفة. بل إن كل ما ضمه ذلك النظام، كان قوانين جسدية ينتهي عملها حين يأتي وقت الإصلاح."]]}, {"l": "Heb 9:23", "n": "", "vs": [[23, "وبما أن تطهير الخيمة الأرضية كان يتطلب رش دم الذبائح الحيوانية، فإن الخيمة الحقيقية لابد أن تتطلب دم ذبيحة أفضل من الذبائح الأخرى."]]}, {"l": "Heb 10:1-10", "n": "", "vs": [[1, "فقد كانت شريعة موسى تتضمن ظلا واهيا للخيرات التي سيأتي بها المسيح، ولم تكن لتصور الحقيقة كما هي. ولذلك، لم تكن قادرة أن توصل إلى الكمال أولئك الذين يتقربون بها إلى الله، مقدمين دائما الذبائح السنوية عينها،"], [2, "وإلا، لما كان هنالك داع للاستمرار في تقديمها! لأن ضمائر العابدين، متى تطهرت مرة واحدة إلى التمام، لا تعود بحاجة إلى التطهير مرة ثانية: إذ يكون الشعور بالذنب قد زال."], [3, "ولكن في عملية تقديم الذبائح المتكررة كل سنة، تذكيرا للعابدين بخطاياهم."], [4, "فمن المستحيل أن يزيل دم الثيران والتيوس خطايا الناس."], [5, "لذلك قال المسيح، عند مجيئه إلى هذه الأرض: «إن الذبائح والتقدمات ما أردتها. لكنك أعددت لي جسدا بشريا."], [6, "فالحيوانات التي كانت تذبح وتحرق أمامك تكفيرا عن الخطيئة، لم ترض بها."], [7, "عندئذ قلت لك: ها أنا آتي لأعمل إرادتك، ياالله . هذا هو المكتوب عني في صفحة الكتاب !»"], [8, "فبعد أن عبر المسيح عن عدم رضى الله بجميع التقدمات والذبائح التي كانت تقرب مع أنها كانت تقدم وفقا للشريعة،"], [9, "أضاف قائلا: «ها أنا آتي لأعمل إرادتك!» فهو، إذن، يلغي النظام السابق، ليضع محله نظاما جديدا ينسجم مع إرادة الله."], [10, "بموجب هذه الإرادة الإلهية، صرنا مقدسين إذ قرب يسوع المسيح، مرة واحدة، جسده عوضا عنا!"]]}], "kwAr": "شريعة الوصايا", "noteAr": ""}, {"kw": "one", "raw": "Eph_4:16; 2Co_5:17; Gal_6:15; Col_3:10", "note": "", "refs": [{"l": "Eph 4:16", "n": "", "vs": [[16, "فمنه يستمد الجسد كله تماسكه وترابطه بمساندة كل مفصل وفقا لمقدار العمل المخصص لكل جزء، لينشيء نموا يؤول إلى بنيان الجسد بنيانا ذاتيا في المحبة."]]}, {"l": "2Co 5:17", "n": "", "vs": [[17, "فإنه إذا كان أحد في المسيح، فهو خليقة جديدة: إن الأشياء القديمة قد زالت، وها كل شيء قد صار جديدا."]]}, {"l": "Gal 6:15", "n": "", "vs": [[15, "فليس الختان بشيء، ولا عدم الختان بشيء، وإنما (المهم أن يصير الإنسان) خليقة جديدة."]]}, {"l": "Col 3:10", "n": "", "vs": [[10, "ولبستم الجديد الذي يتجدد لبلوغ تمام المعرفة وفقا لصورة خالقه،"]]}], "kwAr": "إنسانا واحدا جديدا", "noteAr": ""}], "arS": [["أي ", []], ["العداء", ["G2189"]], [": إذ ", []], ["أبطل", ["G2673"]], [" ", []], ["بجسده", ["G4561"]], [" ", []], ["شريعة", ["G3551"]], [" ", []], ["الوصايا", ["G1785"]], [" ذات ", []], ["الفرائض", ["G1378"]], ["، لكي يكون من ", []], ["الفريقين", ["G1417"]], [" ", []], ["إنسانا", ["G444"]], [" ", []], ["واحدا", ["G1520"]], [" ", []], ["جديدا", ["G2537"]], ["، إذ ", []], ["أحل", ["G4160"]], [" ", []], ["السلام", ["G1515"]], [" بينهما،", []]]}, {"c": 2, "v": 16, "text": "ولكي يصالحهما معا في جسد واحد مع الله بالصليب الذي به قتل العداء.", "groups": [{"kw": "reconcile", "raw": "Rom_5:10; 2Co_5:18-21; Col_1:21-22", "note": "", "refs": [{"l": "Rom 5:10", "n": "", "vs": [[10, "فإن كنا، ونحن أعداء، قد تصالحنا مع الله بموت ابنه، فكم بالأحرى نخلص بحياته ونحن مصالحون!"]]}, {"l": "2Co 5:18-21", "n": "", "vs": [[18, "وكل شيء هو من عند الله الذي صالحنا مع نفسه بالمسيح، ثم سلمنا خدمة هذه المصالحة."], [19, "ذلك أن الله كان في المسيح مصالحا العالم مع نفسه، غير حاسب عليهم خطاياهم، وقد وضع بين أيدينا رسالة هذه المصالحة."], [20, "فنحن إذن سفراء المسيح، وكأن الله يعظ بنا نتوسل بالنيابة عن المسيح منادين: «تصالحوا مع الله!»"], [21, "فإن الذي لم يعرف خطيئة، جعله الله خطيئة لأجلنا، لنصير نحن بر الله فيه."]]}, {"l": "Col 1:21-22", "n": "", "vs": [[21, "وأنتم، يامن كنتم في الماضي أجانب وأعداء في الفكر، بأعمالكم الشريرة،"], [22, "قد صالحكم الآن في جسد بشرية (ابنه) بالموت. وذلك لكي يحضركم فتمثلوا أمامه وأنتم قديسون بلا ذنب ولا لوم."]]}], "kwAr": "ولكي يصالحهما", "noteAr": ""}, {"kw": "having", "raw": "Eph_2:15; Rom_6:6, Rom_8:3, Rom_8:7; Gal_2:20; Col_2:14; 1Pe_4:1, 1Pe_4:2", "note": "", "refs": [{"l": "Eph 2:15", "n": "", "vs": [[15, "أي العداء: إذ أبطل بجسده شريعة الوصايا ذات الفرائض، لكي يكون من الفريقين إنسانا واحدا جديدا، إذ أحل السلام بينهما،"]]}, {"l": "Rom 6:6", "n": "", "vs": [[6, "فنحن نعلم هذا: أن الإنسان العتيق فينا قد صلب معه لكي يبطل جسد الخطيئة فلا نبقى عبيدا للخطيئة فيما بعد."]]}, {"l": "Rom 8:3", "n": "", "vs": [[3, "فإن ما عجزت الشريعة عنه، لكون الجسد قد جعلها قاصرة عن تحقيقه، أتمه الله إذ أرسل ابنه، متخذا ما يشبه جسد الخطيئة ومكفرا عن الخطيئة فدان الخطيئة في الجسد"]]}, {"l": "Rom 8:7", "n": "", "vs": [[7, "لأن اهتمام الجسد هو عداوة لله، إذ إنه لا يخضع لناموس الله، بل لا يستطيع ذلك."]]}, {"l": "Gal 2:20", "n": "", "vs": [[20, "مع المسيح صلبت، وفيما بعد لا أحيا أنا بل المسيح يحيا في. أما الحياة التي أحياها الآن في الجسد، فإنما أحياها بالإيمان في ابن الله، الذي أحبني وبذل نفسه عني."]]}, {"l": "Col 2:14", "n": "", "vs": [[14, "إذ قد محا صك الفرائض المكتوب علينا والمناقض لمصلحتنا، بل إنه قد أزاله من الوسط، مسمرا إياه على الصليب."]]}, {"l": "1Pe 4:1", "n": "", "vs": [[1, "فبما أن المسيح قد تحمل الآلام الجسمية لأجلكم، سلحوا أنفسكم بالاستعداد دائما لتحمل الآلام. فإن من يتحمل الآلام الجسمية، يكون قد قاطع الخطيئة."]]}, {"l": "1Pe 4:2", "n": "", "vs": [[2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."]]}], "kwAr": "قتل العداء", "noteAr": ""}, {"kw": "thereby", "raw": "or, in himself", "note": "or, in himself", "refs": [], "kwAr": "الذي به", "noteAr": "أو: في نفسه."}], "arS": [["ولكي ", []], ["يصالحهما", ["G604"]], [" معا في ", []], ["جسد", ["G4983"]], [" ", []], ["واحد", ["G1520"]], [" مع ", []], ["الله", ["G2316"]], [" ", []], ["بالصليب", ["G4716"]], [" الذي به ", []], ["قتل", ["G615"]], [" ", []], ["العداء", ["G2189"]], [".", []]]}, {"c": 2, "v": 17, "text": "ثم جاء وبشركم بالسلام أنتم البعيدين، (كما بشر بالسلام) أولئك القريبين.", "groups": [{"kw": "and preached", "raw": "Psa_85:10; Isa_27:5, Isa_52:7, Isa_57:19-21; Zec_9:10; Mat_10:13; Luk_2:14; Luk_15:5, Luk_15:6; Act_2:39, Act_10:36; Rom_5:1; 2Co_5:20", "note": "", "refs": [{"l": "Psa 85:10", "n": "", "vs": [[10, "الرحمة والحق تلاقيا، البر والسلام تعانقا."]]}, {"l": "Isa 27:5", "n": "", "vs": [[5, "أو ليستجيروا بحمايتي وليعقدوا معي سلاما؛ أجل! ليعقدوا معي سلاما."]]}, {"l": "Isa 52:7", "n": "", "vs": [[7, "ما أجمل على الجبال وقع قدمي المبشر الذي يذيع سلاما وينشر بشائر الخير، القائل لصهيون: قد ملك إلهك!"]]}, {"l": "Isa 57:19-21", "n": "", "vs": [[19, "وأستبدل نواحه بالحمد، يقول الرب؛ فيكون سلام للقريب والبعيد لأنني سأشفيه."], [20, "أما الأشرار فهم كالبحر الهائج الذي لا يهدأ، تقذف مياهه القذر والطين"], [21, "إذ ليس سلام للأشرار، قال إلهي."]]}, {"l": "Zec 9:10", "n": "", "vs": [[10, "وأستأصل المركبات الحربية من أفرايم، والخيل من أورشليم، وتبيد أقواس القتال، ويشيع السلام بين الأمم، ويمتد ملكه من البحر إلى البحر، ومن نهر الفرات إلى أقاصي الأرض."]]}, {"l": "Mat 10:13", "n": "", "vs": [[13, "فإذا كان ذلك البيت مستحقا فعلا، فليحل سلامكم عليه. وإن لم يكن مستحقا، فليرجع سلامكم لكم"]]}, {"l": "Luk 2:14", "n": "", "vs": [[14, "«المجد لله في الأعالي، وعلى الأرض السلام؛ وبالناس المسرة! »"]]}, {"l": "Luk 15:5", "n": "", "vs": [[5, "وبعد أن يجده، يحمله على كتفيه فرحا،"]]}, {"l": "Luk 15:6", "n": "", "vs": [[6, "ثم يعود إلى البيت، ويدعو الأصدقاء والجيران، قائلا لهم: افرحوا معي، لأني وجدت خروفي الضائع !"]]}, {"l": "Act 2:39", "n": "", "vs": [[39, "لأن الوعد هو لكم ولأولادكم وللبعيدين جميعا، يناله كل من يدعوه الرب إلهنا!»"]]}, {"l": "Act 10:36", "n": "", "vs": [[36, "وقد أرسل كلمته إلى بني إسرائيل، وبشرهم بالسلام بواسطة يسوع المسيح، رب الجميع."]]}, {"l": "Rom 5:1", "n": "", "vs": [[1, "فبما أننا قد تبررنا على أساس الإيمان، صرنا في سلام مع الله بربنا يسوع المسيح."]]}, {"l": "2Co 5:20", "n": "", "vs": [[20, "فنحن إذن سفراء المسيح، وكأن الله يعظ بنا نتوسل بالنيابة عن المسيح منادين: «تصالحوا مع الله!»"]]}], "kwAr": "وبشركم بالسلام", "noteAr": ""}, {"kw": "that", "raw": "Eph_2:13, Eph_2:14; Deu_4:7; Psa_75:1, Psa_76:1, Psa_76:2, Psa_147:19, Psa_147:20, Psa_148:14; Luk_10:9-11", "note": "", "refs": [{"l": "Eph 2:13", "n": "", "vs": [[13, "أما الآن، ففي المسيح يسوع، أنتم الذين كنتم من قبل بعيدين قد صرتم قريبين بدم المسيح."]]}, {"l": "Eph 2:14", "n": "", "vs": [[14, "فإنه هو سلامنا، ذاك الذي جعل الفريقين واحدا وهدم حائط الحاجز الفاصل بينهما،"]]}, {"l": "Deu 4:7", "n": "", "vs": [[7, "لأنه أي شعب، مهما عظم، له آلهة قريبة منه مثل الرب إلهنا في كل ما ندعوه؟"]]}, {"l": "Psa 75:1", "n": "", "vs": [[1, "نحمدك ياالله نحمدك، لأن اسمك قريب من شعبك الذي يخبر بما صنعت من عجائب."]]}, {"l": "Psa 76:1", "n": "", "vs": [[1, "الله معروف في يهوذا واسمه معظم في إسرائيل."]]}, {"l": "Psa 76:2", "n": "", "vs": [[2, "خيمته في أورشليم ومسكنه في جبل صهيون."]]}, {"l": "Psa 147:19", "n": "", "vs": [[19, "يعلن ليعقوب كلمته ولإسرائيل فرائضه وأحكامه."]]}, {"l": "Psa 147:20", "n": "", "vs": [[20, "لم يعامل أمة أخرى هكذا، ولم يعرفها أحكامه هللويا."]]}, {"l": "Psa 148:14", "n": "", "vs": [[14, "يرفع رأس شعبه إكراما لكل أتقيائه، لبني إسرائيل الشعب المقرب إليه. هللويا."]]}, {"l": "Luk 10:9-11", "n": "", "vs": [[9, "واشفوا المرضى الذين فيها، وقولوا لهم: قد اقترب منكم ملكوت الله!"], [10, "وأية مدينة دخلتم ولم يقبلكم أهلها، فاخرجوا إلى شوارعها، وقولوا:"], [11, "حتى غبار مدينتكم العالق بأقدامنا ننفضه عليكم، ولكن اعلموا هذا: أن ملكوت الله قد اقترب!"]]}], "kwAr": "أولئك القريبين", "noteAr": ""}], "arS": [["ثم ", []], ["جاء", ["G2064"]], [" ", []], ["وبشركم", ["G2097"]], [" ", []], ["بالسلام", ["G1515"]], [" أنتم ", []], ["البعيدين", ["G3112"]], ["، (كما بشر بالسلام) أولئك ", []], ["القريبين", ["G1451"]], [".", []]]}, {"c": 2, "v": 18, "text": "فبه لنا كلينا اقتراب إلى الآب بروح واحد.", "groups": [{"kw": "through", "raw": "Eph_3:12; Joh_10:7, Joh_10:9, Joh_14:6; Rom_5:2; Heb_4:15, Heb_4:16, Heb_7:19, Heb_10:19, Heb_10:20; 1Pe_1:21; 1Pe_3:18; 1Jo_2:1, 1Jo_2:2", "note": "", "refs": [{"l": "Eph 3:12", "n": "", "vs": [[12, "الذي به لنا جرأة واقتراب واثق من جراء الإيمان به"]]}, {"l": "Joh 10:7", "n": "", "vs": [[7, "لذلك عاد فقال: «الحق الحق أقول لكم: أنا باب الخراف."]]}, {"l": "Joh 10:9", "n": "", "vs": [[9, "أنا الباب. من دخل بي يخلص، فيدخل ويخرج ويجد المرعى."]]}, {"l": "Joh 14:6", "n": "", "vs": [[6, "فأجابه يسوع: «أنا هو الطريق والحق والحياة. لا يأتي أحد إلى الآب إلا بي."]]}, {"l": "Rom 5:2", "n": "", "vs": [[2, "وبه أيضا تم لنا الدخول بالإيمان إلى هذه النعمة التي نقيم فيها الآن؛ ونحن نفتخر برجائنا في التمتع بمجد الله."]]}, {"l": "Heb 4:15", "n": "", "vs": [[15, "ذلك لأن رئيس الكهنة الذي لنا، ليس عاجزا عن تفهم ضعفاتنا، بل إنه قد تعرض للتجارب التي نتعرض نحن لها، إلا أنه بلا خطية."]]}, {"l": "Heb 4:16", "n": "", "vs": [[16, "فلنتقدم بثقة إلى عرش النعمة، لننال الرحمة ونجد نعمة تعيننا عند الحاجة."]]}, {"l": "Heb 7:19", "n": "", "vs": [[19, "فالشريعة لم توصل الذين كانوا يعبدون الله بحسبها ولو إلى أدنى درجات الكمال. ولذلك، وضع الله أساسا جديدا للاقتراب إليه، مقدما لنا رجاء أفضل."]]}, {"l": "Heb 10:19", "n": "", "vs": [[19, "فلنا الآن، أيها الإخوة حق التقدم بثقة إلى «قدس الأقداس» (في السماء) بدم يسوع."]]}, {"l": "Heb 10:20", "n": "", "vs": [[20, "وذلك بسلوك هذا الطريق الحي الجديد الذي شقه لنا المسيح بتمزيق الحجاب، أي جسده."]]}, {"l": "1Pe 1:21", "n": "", "vs": [[21, "أنتم الذين تؤمنون بالله بالمسيح الذي أقامه من الموت وأعطاه المجد، حتى يكون الله غاية إيمانكم ورجائكم."]]}, {"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}, {"l": "1Jo 2:1", "n": "", "vs": [[1, "ياأولادي الصغار، أكتب إليكم هذه الأمور لكي لا تخطئوا. ولكن، إن أخطأ أحدكم، فلنا عند الآب شفيع هو يسوع المسيح البار."]]}, {"l": "1Jo 2:2", "n": "", "vs": [[2, "فهو كفارة لخطايانا، لا لخطايانا فقط، بل لخطايا العالم كله."]]}], "kwAr": "فبه", "noteAr": ""}, {"kw": "by", "raw": "Eph_4:4, Eph_6:18; Zec_12:10; Rom_8:15, Rom_8:26, Rom_8:27; 1Co_12:13; Jud_1:20", "note": "", "refs": [{"l": "Eph 4:4", "n": "", "vs": [[4, "مثلما دعيتم، جميعكم، دعوة لها رجاء واحد."]]}, {"l": "Eph 6:18", "n": "", "vs": [[18, "كونوا مصلين في كل حال، بكل صلاة وطلبة في الروح، وساهرين لهذا الغرض عينه مواظبين تماما على جميع الطلبات لأجل القديسين جميعا،"]]}, {"l": "Zec 12:10", "n": "", "vs": [[10, "وأفيض على ذرية داود وعلى سكان أورشليم روح النعمة والابتهال، حتى إذا نظروا إلي أنا الذي طعنوه ينوحون عليه كما ينوح والد على ولده الوحيد، متفجعين عليه كتفجعهم على موت بكرهم."]]}, {"l": "Rom 8:15", "n": "", "vs": [[15, "إذ إنكم لم تنالوا روح عبودية يعيدكم إلى الخوف، بل نلتم روح بنوة به نصرخ: «أبا! أبانا!»"]]}, {"l": "Rom 8:26", "n": "", "vs": [[26, "وكذلك الروح أيضا يمدنا بالعون لنقهر ضعفنا. فإننا لا نعلم ما يجب أن نصلي لأجله كما يليق، ولكن الروح نفسه يؤدي الشفاعة عنا بأنات تفوق التعبير."]]}, {"l": "Rom 8:27", "n": "", "vs": [[27, "على أن فاحص القلوب يعلم قصد الروح، لأن الروح يشفع في القديسين بما يوافق الله ."]]}, {"l": "1Co 12:13", "n": "", "vs": [[13, "فإننا، بالروح الواحد، قد تعمدنا جميعا لنصير جسدا واحدا، سواء كنا يهودا أم يونانيين، عبيدا أم أحرارا، وقد سقينا جميعا الروح الواحد."]]}, {"l": "Jud 1:20", "n": "", "vs": [[20, "وأما أنتم أيها الأحباء، فابنوا أنفسكم على إيمانكم الأقدس، وصلوا دائما في الروح القدس."]]}], "kwAr": "بروح واحد", "noteAr": ""}, {"kw": "the", "raw": "Eph_3:14; Mat_28:19; Joh_4:21-23; 1Co_8:6; Gal_4:6; Jam_3:9; 1Pe_1:17", "note": "", "refs": [{"l": "Eph 3:14", "n": "", "vs": [[14, "ولهذا السبب أحني ركبتي للآب"]]}, {"l": "Mat 28:19", "n": "", "vs": [[19, "فاذهبوا إذن، وتلمذوا جميع الأمم، وعمدوهم باسم الآب والابن والروح القدس؛"]]}, {"l": "Joh 4:21-23", "n": "", "vs": [[21, "فأجابها يسوع: «صدقيني ياامرأة، ستأتي الساعة التي فيها تعبدون الآب لا في هذا الجبل ولا في أورشليم."], [22, "أنتم تعبدون ما تجهلون، ونحن نعبد ما نعلم، لأن الخلاص هو من عند اليهود."], [23, "فستأتي ساعة، لا بل هي الآن، حين يعبد العابدون الصادقون الآب بالروح وبالحق. لأن الآب يبتغي مثل هؤلاء العابدين."]]}, {"l": "1Co 8:6", "n": "", "vs": [[6, "فليس عندنا نحن إلا إله واحد هو الآب الذي منه كل شيء، ونحن له؛ ورب واحد هو يسوع المسيح الذي به كل شيء ونحن به."]]}, {"l": "Gal 4:6", "n": "", "vs": [[6, "وبما أنكم أبناء له، أرسل الله إلى قلوبنا روح ابنه، مناديا: «أبا، ياأبانا»."]]}, {"l": "Jam 3:9", "n": "", "vs": [[9, "به نرفع الحمد والشكر للرب والآب، وبه نوجه الشتائم إلى الناس الذين خلقهم الله على مثاله."]]}, {"l": "1Pe 1:17", "n": "", "vs": [[17, "وما دمتم تعترفون بالله أبا لكم، وهو يحكم على كل إنسان حسب أعماله دون انحياز، فاسلكوا في مخافته مدة إقامتكم المؤقتة على الأرض."]]}], "kwAr": "اقتراب إلى الآب", "noteAr": ""}], "arS": [["فبه لنا ", []], ["كلينا", ["G297"]], [" ", []], ["اقتراب", ["G4318"]], [" إلى ", []], ["الآب", ["G3962"]], [" ", []], ["بروح", ["G4151"]], [" ", []], ["واحد", ["G1520"]], [".", []]]}, {"c": 2, "v": 19, "text": "إذن، لستم غرباء وأجانب بعد الآن، بل أنتم رعية مع القديسين وأعضاء في عائلة الله،", "groups": [{"kw": "strangers", "raw": "Eph_2:12", "note": "", "refs": [{"l": "Eph 2:12", "n": "", "vs": [[12, "أنكم كنتم في ذلك الحين بلا مسيح، أجانب عن جماعة إسرائيل، وغرباء عن العهود الموعودة، لا رجاء لكم، ومنكرين لله في العالم."]]}], "kwAr": "لستم غرباء وأجانب", "noteAr": ""}, {"kw": "but", "raw": "Eph_3:6; Gal_3:26-28, Gal_4:26-31; Phi_3:20 *Gr: Heb_12:22-24; Rev_21:12-26", "note": "", "refs": [{"l": "Eph 3:6", "n": "", "vs": [[6, "وهو أن الأمم هم شركاء اليهود في الميراث، وأعضاء في الجسد معهم، ولهم أيضا حق الاستفادة من الوعد. وذلك في المسيح يسوع وبفضل الإنجيل"]]}, {"l": "Gal 3:26-28", "n": "", "vs": [[26, "فإنكم جميعا أبناء الله بالإيمان بالمسيح يسوع."], [27, "لأنكم، جميع الذين تعمدتم في المسيح، قد لبستم المسيح."], [28, "لا فرق بعد الآن بين يهودي ويوناني، أو عبد وحر، أو ذكر وأنثى، لأنكم جميعا واحد في المسيح يسوع."]]}, {"l": "Gal 4:26-31", "n": "", "vs": [[26, "أما الثاني، فرمزه الحرة التي تمثل أورشليم السماوية التي هي أمنا."], [27, "فإنه قد كتب: «افرحي أيتها العاقر التي لا تلد، اهتفي بأعلى صوتك أيتها التي لا تتمخض، لأن أولاد المهجورة أكثر عددا من أولاد التي لها زوج!»"], [28, "وأما أنتم، أيها الإخوة، فأولاد الوعد، على مثال إسحاق."], [29, "ولكن، كما كان في الماضي المولود بحسب الجسد يضطهد المولود بحسب الروح، فكذلك أيضا يحدث الآن."], [30, "إنما ماذا يقول الكتاب؟ «اطرد الجارية وابنها، لأن ابن الجارية لا يرث مع ابن الحرة!»"], [31, "إذن، أيها الإخوة، نحن لسنا أولاد الجارية، بل أولاد الحرة."]]}, {"l": "Phi 3:20", "n": "*Gr:", "vs": [[20, "أما نحن، فإن وطننا في السماوات التي منها ننتظر عودة مخلصنا الرب يسوع المسيح،"]]}, {"l": "Heb 12:22-24", "n": "", "vs": [[22, "ولكنكم قد اقتربتم إلى جبل صهيون، إلى مدينة الله الحي، أورشليم السماوية. بل تقدمتم إلى حفلة يجتمع فيها عدد لا يحصى من الملائكة،"], [23, "إلى كنيسة تجمع أبناء لله أبكارا، أسماؤهم مكتوبة في السماء. بل إلى الله نفسه، ديان الجميع، وإلى أرواح أناس بررهم الله وجعلهم كاملين."], [24, "كذلك، تقدمتم إلى يسوع، وسيط العهد الجديد، وإلى دمه المرشوش الذي يتكلم مطالبا بأفضل مما طالب به دم هابيل."]]}, {"l": "Rev 21:12-26", "n": "", "vs": [[12, "لها سور ضخم عال واثنا عشر بابا يحرسها اثنا عشر ملاكا، وقد كتبت عليها أسماء أسباط إسرائيل الاثني عشر؛"], [13, "إلى الشرق ثلاثة أبواب؛ وإلى الشمال ثلاثة أبواب، وإلى الجنوب ثلاثة أبواب؛ وإلى الغرب ثلاثة أبواب."], [14, "ويقوم سور المدينة على اثنتي عشرة دعامة كتبت عليها أسماء رسل الحمل الاثني عشر."], [15, "وكان الملاك الذي يكلمني يمسك قصبة من الذهب ليقيس بها المدينة وأبوابها وسورها."], [16, "وكانت أرض المدينة مربعة، طولها يساوي عرضها، فلما قاسها بالقصبة تبين أن ضلعها يساوي ألفين وأربعمئة كيلومتر، وهي متساوية الطول والعرض والارتفاع."], [17, "ثم قاس السور، فتبين أنه يساوي مئة وأربعا وأربعين ذراعا، وكان الملاك يستعمل قياسا يعادل ذراع إنسان."], [18, "كانت المدينة مبنية من ذهب خالص شفاف كالزجاج النقي. أما سورها فمن اليشب،"], [19, "وهو قائم على اثنتي عشرة دعامة مرصعة بالأحجار الكريمة: كانت الدعامة الأولى من اليشب؛ والثانية من الياقوت الأزرق؛ والثالثة من العقيق الأبيض؛ والرابعة من الزمرد الذبابي؛"], [20, "والخامسة من الجزع العقيقي؛ والسادسة من العقيق الأحمر؛ والسابعة من الزبرجد؛ والثامنة من الزمرد السلقي؛ والتاسعة من الياقوت الأصفر، والعاشرة من العقيق الأخضر؛ والحادية عشرة من الأسمانجوني؛ والثانية عشرة من الجمشت."], [21, "أما الأبواب الاثنا عشر فهي اثنتا عشرة لؤلؤة: كل باب لؤلؤة واحدة. وساحة المدينة من ذهب خالص كالزجاج الشفاف."], [22, "ولم أجد في المدينة هيكلا، لأن الرب الإله القادر على كل شيء والحمل هما هيكلها."], [23, "ولم تكن المدينة في حاجة إلى نور الشمس أو القمر، لأن مجد الله ينيرها، والحمل مصباحها."], [24, "ستسير بنورها الأمم، ويأتيها ملوك الأرض بكنوزهم."], [25, "ولا تقفل أبوابها أبدا طول النهار، لأن الليل لا يأتي عليها!"], [26, "وستحمل إليها كنوز الأمم وأمجادها."]]}], "kwAr": "بل أنتم رعية مع القديسين", "noteAr": ""}, {"kw": "household", "raw": "Eph_3:15; Mat_10:25; Gal_6:10; 1Jo_3:1", "note": "", "refs": [{"l": "Eph 3:15", "n": "", "vs": [[15, "الذي هو أصل كل أبوة في السماوات وعلى الأرض،"]]}, {"l": "Mat 10:25", "n": "", "vs": [[25, "يكفي التلميذ أن يصير مثل معلمه، والعبد مثل سيده! إن كانوا قد لقبوا رب البيت ببعلزبول، فكم بالأحرى يلقبون أهل بيته؟"]]}, {"l": "Gal 6:10", "n": "", "vs": [[10, "فمادامت لنا الفرصة إذن، فلنعمل الخير للجميع، وخصوصا لأهل الإيمان."]]}, {"l": "1Jo 3:1", "n": "", "vs": [[1, "تأملوا ما أعظم المحبة التي أحبنا بها الآب حتى صرنا ندعى «أولاد الله»، ونحن أولاده حقا. ولكن، بما أن أهل العالم لا يعرفون الله، فهم لا يعرفوننا."]]}], "kwAr": "في عائلة الله", "noteAr": ""}], "arS": [["إذن", ["G686", "G3767"]], ["، لستم ", []], ["غرباء", ["G3581"]], [" ", []], ["وأجانب", ["G3941"]], [" بعد الآن، بل أنتم ", []], ["رعية مع", ["G4847"]], [" ", []], ["القديسين", ["G40"]], [" وأعضاء في ", []], ["عائلة", ["G3609"]], [" ", []], ["الله", ["G2316"]], ["،", []]]}, {"c": 2, "v": 20, "text": "وقد بنيتم على أساس الرسل والأنبياء، والمسيح يسوع نفسه هو حجر الزاوية الأساس،", "groups": [{"kw": "built", "raw": "Eph_4:12; 1Pe_2:4, 1Pe_2:5", "note": "", "refs": [{"l": "Eph 4:12", "n": "", "vs": [[12, "لتأهيل القديسين من جهة عمل الخدمة، لبنيان جسد المسيح،"]]}, {"l": "1Pe 2:4", "n": "", "vs": [[4, "فأنتم قد أتيتم إليه، باعتباره الحجر الحي الذي رفضه الناس، واختاره الله ، وهو ثمين في نظره."]]}, {"l": "1Pe 2:5", "n": "", "vs": [[5, "إذن اتحدوا به كحجارة حية، مبنيين بيتا روحيا، تكونون فيه كهنة مقدسين تقدمون لله ذبائح روحية مقبولة لديه بفضل يسوع المسيح."]]}], "kwAr": "وقد بنيتم", "noteAr": ""}, {"kw": "the foundation", "raw": "Eph_4:11-13; Isa_28:16; Mat_16:18; 1Co_3:9-11, 1Co_12:28; Gal_2:9; Rev_21:14", "note": "", "refs": [{"l": "Eph 4:11-13", "n": "", "vs": [[11, "وهو قد وهب البعض أن يكونوا رسلا، والبعض أنبياء، والبعض مبشرين والبعض رعاة ومعلمين،"], [12, "لتأهيل القديسين من جهة عمل الخدمة، لبنيان جسد المسيح،"], [13, "حتى نصل جميعا إلى وحدة الإيمان ووحدة المعرفة لابن الله، إلى إنسان تام البلوغ، إلى مقدار قامة ملء المسيح."]]}, {"l": "Isa 28:16", "n": "", "vs": [[16, "لهذا يقول الرب: «ها أنا أضع حجر أساس في صهيون، حجر زاوية ثمينا ليكون أساسا راسخا وكل من يؤمن به لا يهرب."]]}, {"l": "Mat 16:18", "n": "", "vs": [[18, "وأنا أيضا أقول لك: أنت صخر. وعلى هذه الصخرة أبني كنيستي وأبواب الجحيم لن تقوى عليها!"]]}, {"l": "1Co 3:9-11", "n": "", "vs": [[9, "فإننا نحن جميعا عاملون معا عند الله، وأنتم حقل الله وبناء الله."], [10, "وبحسب نعمة الله الموهوبة لي، وضعت الأساس كما يفعل البناء الماهر، وغيري يبني عليه. ولكن، لينتبه كل واحد كيف يبني عليه."], [11, "فليس ممكنا أن يضع أحد أساسا آخر بالإضافة إلى الأساس الموضوع، وهو يسوع المسيح."]]}, {"l": "1Co 12:28", "n": "", "vs": [[28, "وقد رتب الله في الكنيسة أشخاصا مخصوصين: أولا الرسل، ثانيا الأنبياء، ثالثا المعلمين، وبعد ذلك أصحاب المواهب المعجزية أو مواهب الشفاء أو إعانة الآخرين أو تدبير الشؤون أو التكلم باللغات المختلفة."]]}, {"l": "Gal 2:9", "n": "", "vs": [[9, "فلما اتضحت النعمة الموهوبة لي عند يعقوب وبطرس ويوحنا، وهم البارزون باعتبارهم أعمدة، مدوا إلي وإلى برنابا أيديهم اليمنى إشارة إلى المشاركة، فنتوجه نحن إلى الأمم وهم إلى أهل الختان،"]]}, {"l": "Rev 21:14", "n": "", "vs": [[14, "ويقوم سور المدينة على اثنتي عشرة دعامة كتبت عليها أسماء رسل الحمل الاثني عشر."]]}], "kwAr": "على أساس الرسل والأنبياء", "noteAr": ""}, {"kw": "Jesus", "raw": "Psa_118:22; Isa_28:16; Mat_21:42; Mar_12:10,Mar_12:11; Luk_20:17, Luk_20:18; Act_4:11, Act_4:12; 1Pe_2:7, 1Pe_2:8", "note": "", "refs": [{"l": "Psa 118:22", "n": "", "vs": [[22, "الحجر الذي رفضه البناؤون قد صار رأس الزاوية."]]}, {"l": "Isa 28:16", "n": "", "vs": [[16, "لهذا يقول الرب: «ها أنا أضع حجر أساس في صهيون، حجر زاوية ثمينا ليكون أساسا راسخا وكل من يؤمن به لا يهرب."]]}, {"l": "Mat 21:42", "n": "", "vs": [[42, "فقال لهم يسوع: «ألم تقرأوا في الكتاب: الحجر الذي رفضه البناة، هو نفسه صار حجر الزاوية الأساسي. من الرب كان هذا، وهو عجيب في أنظارنا!"]]}, {"l": "Mar 12:10", "n": "", "vs": [[10, "أفما قرأ تم هذه الآية المكتوبة: الحجر الذي رفضه البناة، هو نفسه صار حجر الزاوية."]]}, {"l": "Mar 12:11", "n": "", "vs": [[11, "من الرب كان هذا، وهو عجيب في أنظارنا!»"]]}, {"l": "Luk 20:17", "n": "", "vs": [[17, "ولكنه نظر إليهم وقال: «إذن ما معنى هذه الآية المكتوبة: الحجر الذي رفضه البناة، هو نفسه صار حجر الزاوية؟"]]}, {"l": "Luk 20:18", "n": "", "vs": [[18, "من يقع على هذا الحجر يتكسر، ومن يقع الحجر عليه يسحقه سحقا؟»"]]}, {"l": "Act 4:11", "n": "", "vs": [[11, "يسوع هذا هو الحجر الذي رفضتموه أيها البناة، وهو نفسه صار حجر الزاوية الأساسي،"]]}, {"l": "Act 4:12", "n": "", "vs": [[12, "وليس بأحد غيره الخلاص، إذ ليس تحت السماء اسم آخر قدمه الله للبشر به يجب أن نخلص!»"]]}, {"l": "1Pe 2:7", "n": "", "vs": [[7, "فإن هذا الحجر هو ثمين في نظركم، أنتم المؤمنين به. أما بالنسبة إلى الذين لا يؤمنون، «فالحجر الذي رفضه البناؤون صار هو الحجر الأساسي رأس زاوية البيت»،"]]}, {"l": "1Pe 2:8", "n": "", "vs": [[8, "كما أنه هو «الحجر الذي يصطدمون به، والصخرة التي يسقطون عليها»! وهم يسقطون لأنهم يرفضون أن يؤمنوا بالكلمة."]]}], "kwAr": "المسيح يسوع نفسه هو حجر الزاوية", "noteAr": ""}], "arS": [["وقد ", []], ["بنيتم", ["G2026"]], [" على ", []], ["أساس", ["G2310"]], [" ", []], ["الرسل", ["G652"]], [" ", []], ["والأنبياء", ["G4396"]], ["، ", []], ["والمسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [" نفسه هو ", []], ["حجر الزاوية", ["G204"]], [" الأساس،", []]]}, {"c": 2, "v": 21, "text": "الذي فيه يتناسق البناء كله فيرتفع ليصير هيكلا مقدسا في الرب.", "groups": [{"kw": "all", "raw": "Eph_4:13-16; Ezek. 40:1-42:20; 1Co_3:9; Heb_3:3, Heb_3:4", "note": "", "refs": [{"l": "Eph 4:13-16", "n": "", "vs": [[13, "حتى نصل جميعا إلى وحدة الإيمان ووحدة المعرفة لابن الله، إلى إنسان تام البلوغ، إلى مقدار قامة ملء المسيح."], [14, "وذلك حتى لا نكون فيما بعد أطفالا تتقاذفنا وتحملنا كل ريح تعليم يقوم على خداع الناس والمكر بهم لجرهم إلى الضلال الملفق،"], [15, "بل نتمسك بالحق في المحبة، فننمو في كل شيء نحو من هو الرأس، أي المسيح."], [16, "فمنه يستمد الجسد كله تماسكه وترابطه بمساندة كل مفصل وفقا لمقدار العمل المخصص لكل جزء، لينشيء نموا يؤول إلى بنيان الجسد بنيانا ذاتيا في المحبة."]]}, {"l": "Eze 40:1-42:20", "n": "", "vs": [[1, "وفي اليوم العاشر من مطلع السنة الخامسة والعشرين من سبينا الموافقة للسنة الرابعة عشرة من سقوط أورشليم، كانت علي يد الرب فأحضرني إلى هناك،"], [2, "وأتى بي في رؤى الله إلى أرض إسرائيل، ووضعني على جبل شاهق حيث كان عليه من جهة الجنوب ما يشبه بناء المدينة."], [3, "فنقلني إلى هناك، وإذا برجل مظهره كمظهر النحاس يحمل بيده خيط كتان وقصبة وهو واقف بالباب."], [4, "فقال لي الرجل: «ياابن آدم، انظر بعينيك واصغ بأذنيك وانتبه أشد الانتباه إلى كل ما أطلعك عليه، لأنك لهذا أحضرت إلى هنا. ثم أبلغ شعب إسرائيل بكل ما تشهده»."], [5, "وإذا بسور قائم خارج الهيكل محيط به. وكان طول القصبة التي في يد الرجل (نحو ثلاثة أمتار) فشرع يقيس البناء فكان كل من عرضه وارتفاعه قصبة واحدة (نحو ثلاثة أمتار)."], [6, "ثم تقدم من الباب المواجه للشرق وارتقى درجه وقاس عتبة الباب، فكان عرضها قصبة واحدة (نحو ثلاثة أمتار)، كما كان عرض العتبة الأخرى قصبة واحدة"], [7, "وقاس كذلك الحجرات الجانبية فكان طول وعرض كل منها قصبة واحدة، وبين كل حجرة وحجر ة خمس أذرع (نحو مترين ونصف المتر) وكان عرض عتبة الباب الداخلية بجانب رواق الباب قصبة واحدة."], [8, "ثم قاس رواق الباب من داخل فكان قصبة واحدة،"], [9, "وقاس أيضا رواق الباب مع عضائده فكانت بجملتها عشر أذرع (نحو خمسة أمتار). وكان رواق الباب هذا من الداخل باتجاه الهيكل."], [10, "وكانت حجرات الحراس عند الباب ستا، ثلاثا على كل جانب، وكلها ذات قياس واحد هي وعضائدها."], [11, "ثم قاس عرض مدخل الباب فكان عشر أذرع (نحو خمسة أمتار) وطوله ثلاث عشرة ذراعا (نحو ستة أمتار ونصف المتر)."], [12, "أما الحافة التي أمام الحجرات فكانت ذراعا واحدة (نحو نصف متر) في كل جانب. وكان طول كل حجرة من حجرات الحراس وعرضها ست أذرع (نحو ثلاثة أمتار)."], [13, "ثم قاس الباب من سقف الحائط الخلفي للحجرة إلى سقف الحائط الخلفي للحجرة المقابلة، فكانت المسافة بينها خمسا وعشرين ذراعا (نحو اثنتي عشر مترا ونصف المتر)، الباب مقابل الباب."], [14, "وكان طول محيط العضائد القائمة حول ممر المدخل الداخلي ستين ذراعا (نحو ثلاثين مترا)."], [15, "كما كانت المسافة بين حافة باب المدخل وحافة باب الرواق الداخلي خمسين ذراعا (نحو خمسة وعشرين مترا)."], [16, "ولحجرات المدخل وجدرانه والرواق كوى مشبكة داخلية محيطة بها جميعا، كما حفر على العضادة رسم شجرة نخيل."], [17, "ثم أخذني إلى الساحة الخارجية، وإذا بمخادع ورصيف محيط بالساحة شيد عليه ثلاثون مخدعا."], [18, "وكان الرصيف ممتدا على جوانب البوابات، وعرضه مماثل لطول البوابات. هذا هو الرصيف الأسفل."], [19, "وقام الملاك بقياس العرض من أمام الباب الأسفل إلى أمام الساحة الداخلية من الخارج، فكانت المسافة مئة ذراع (نحو خمسين مترا) إلى الشرق وإلى الشمال."], [20, "ثم قاس طول وعرض باب الساحة الخارجية المتجه نحو الشمال،"], [21, "وكذلك حجراته المتقابلة، ثلاثا من كل جهة، وعضائده ورواقه، فكانت مقاييسها مماثلة لمقاييس الأول. طولها خمسون ذراعا (نحو خمسة وعشرين مترا)، وعرضها خمس وعشرون ذراعا (نحو اثنتي عشر مترا ونصف المتر)."], [22, "كما كانت كواه وأروقته ونخيله مماثلة في قيا سها لقياس الباب نحو الشرق. وكانت له سبع درجات يصعدون عليها للوصول إليه. وانتصبت أمامه أقواس أروقته."], [23, "وللساحة الداخلية باب مقابل لباب الشمال، وآخر مقابل لباب الشرق. وقاس المسافة من باب إلى باب، وإذا بها مئة ذراع (نحو خمسين مترا)."], [24, "ثم أخذني نحو الجنوب، وإذا هناك باب متجه نحو الجنوب، فقاس عضائده وأروقته فكانت مماثلة للأقيسة السابقة."], [25, "وكان في مدخله وأروقته كوى تحيط بها مماثلة لكوى المدخلين الآخرين. وكان طوله خمسين ذراعا (نحو خمسة وعشرين مترا) وعرضه خمسا وعشرين ذراعا (نحو اثني عشر مترا ونصف المتر)."], [26, "وكانت له سبع درجات يصعدون عليها للوصول إليه. وانتصبت أمامه أقواس أروقته، ونقشت على عضائده شجرتا نخيل كل واحدة من جانب."], [27, "وللساحة الداخلية باب متجه نحو الجنوب. وقاس المسافة من الباب إلى الباب وإذا بها مئة ذراع (نحو خمسين مترا) باتجاه الجنوب."], [28, "ثم أحضرني إلى الساحة الداخلية من باب الجنوب، وقاس الباب، فكانت مقاييسه مماثلة لمقاييس البابين الآخرين،"], [29, "وكذلك مقاييس حجراته وعضائده وأروقته. كما كان له ولأروقته على امتداد محيطها كوى. أما طوله فكان خمسين ذراعا (نحو خمسة وعشرين مترا) وعرضه خمسا وعشرين ذراعا (نحو اثني عشر مترا ونصف المتر)"], [30, "وكان على مد محيطه أروقة طولها خمس وعشرون ذراعا (نحو اثني عشر مترا ونصف)، وعرضها خمس أذرع (نحو مترين ونصف المتر)."], [31, "وكانت أروقته المقببة مواجهة للساحة الخارجية، وقد نقشت على عضائدها أشجار نخيل، وله ثماني درجات تفضي إليه."], [32, "وأتى بي إلى الساحة الداخلية المتجهة نحو الشرق وقاس الباب، فكانت قياساته مماثلة للمقاييس الأخرى."], [33, "وكذلك مقاييس حجراته وعضائده وأروقته. كما كان له ولأروقته كوى على طول محيطها. أما طوله فكان خمسين ذراعا (نحو خمسة وعشرين مترا)، وعرضه خمسا وعشرين ذراعا (نحو اثني عشر مترا ونصف المتر)"], [34, "وكانت أروقته المقببة مواجهة للساحة الخارجية، وقد نقشت على عضائده أشجار نخيل، وله ثماني درجات تفضي إليه."], [35, "ثم أخذني إلى باب الشمال وقاسه، فكانت مقاييسه مماثلة للمقاييس الأخرى."], [36, "وكذلك مقاييس حجراته وعضائده وأروقته والكوى التي على محيطه. أما طوله فكان خمسين ذراعا (نحو خمسة وعشرين مترا)، وعرضه خمسا وعشرين ذراعا (نحو اثني عشر مترا ونصف المتر)."], [37, "وكانت أروقته المقببة مواجهة للساحة الخارجية، وقد نقشت على عضائدها أشجار نخيل، وله ثماني درجات تفضي إليه."], [38, "وكان هناك مخدع ملحق به مع بابه، مجاورا لعضائد الأبواب، حيث كانت تغسل ذبيحة المحرقة."], [39, "وكان على كل جانب من جانبي الرواق مائدتان تذبح عليهما المحرقة وذبيحة الخطيئة وذبيحة الإثم،"], [40, "كما كان في الجانب الخارجي عند الدرجات المفضية إلى باب الشمال مائدتان، وفي الجانب الآخر عند رواق الباب مائدتان أخريان،"], [41, "أي أربع موائد في كل جانب. فتكون في جملتها ثماني موائد تذبح عليها القرابين."], [42, "وكان هناك أيضا أربع موائد أخرى مربعة الشكل، مصنوعة من حجارة منحوتة، طول وعرض كل واحدة منها ذراع ونصف (نحو خمسة وسبعين سنتيمترا،) وارتفاعها ذراع واحدة (نحو خمسين سنتيمترا،) كانوا يضعون عليها الأدوات المستخدمة في ذبح المحرقات وسائر الذبائح."], [43, "ولها كلابات مزدوجة طولها شبر معقوفة مثبتة حول محيطها. وكان على الموائد لحم القرابين."], [44, "وأقيم خارج الباب الداخلي مخدعان في الساحة الداخلية، أحدهما مجاور لباب الشمال باتجاه الجنوب، والآخر مجاور للباب الجنوبي باتجاه الشمال."], [45, "وقال لي الملاك: «هذا المخدع المتجه نحو الجنوب هو للكهنة الذين يحرسون الهيكل."], [46, "والمخدع المتجه نحو الشمال هو للكهنة الذين يحرسون المذبح، وهم أبناء صادوق، الذين وحدهم من أبناء لاوي يحق لهم أن يقتربوا من الرب ليخدموه»."], [47, "ثم قاس الساحة فكانت مربعة طولها وعرضها مئة ذراع (نحو خمسين مترا) والمذبح قائم أمام الهيكل."], [48, "وأحضرني إلى رواق الهيكل وقاس سمك عضادتيه من كل من جانبيه، فكان خمس أذرع (نحو مترين ونصف المتر) لكل عضادة وعرض الباب ثلاث أذرع (نحو مترين ونصف المتر)"], [49, "وكان طول الرواق عشرين ذراعا (نحو عشرة أمتار) وعرضه إحدى عشر ذراعا (نحو خمسة أمتار ونصف المتر) عند الدرجات التي تؤدي إليه، كما نصب عند العضائد عمودان واحد عن كل جانب."], [1, "وأحضرني إلى الهيكل ثم قاس العضائد فكان عرضها في كل جانب ست أذرع (نحو ثلاثة أمتار) مماثلا لعرض الخيمة."], [2, "أما عرض المدخل فكان عشرة أذرع (نحو خمسة أمتار)، كما كان عرض كل من جانبي المدخل خمس أذرع (نحو مترين ونصف المتر). ثم قاس الهيكل فكان طوله أربعين ذراعا (نحو عشرين مترا)، وعرضه عشرين ذراعا (نحو عشرة أمتار)."], [3, "ثم تقدم من الداخل وقاس عضادة المدخل، فكانت ذراعين (نحو متر) أما المدخل نفسه فكان طوله ست أذرع (نحو ثلاثة أمتار)، وعرضه سبع أذرع (نحو ثلاثة أمتار ونصف المتر)،"], [4, "وقاس الداخل فكان كل من طوله وعرضه عشرين ذراعا (نحو عشرة أمتار) باتجاه القدس. وقال لي: «هذا هو قدس الأقداس»"], [5, "وقاس حائط الهيكل فكان سمكه ست أذرع (نحو ثلاثة أمتار)، وعرض كل حجرة من الحجرات المحيطة بالهيكل أربع أذرع (نحو مترين)."], [6, "وكانت الحجرات مؤلفة من ثلاث طبقات، في كل طبقة ثلاثون حجرة. كل حجرة مبنية فوق أختها. وكانت الحجرات داخلات في الحائط المحيط بالهيكل لتعتمد عليه ولا تعتمد على حائط الهيكل نفسه."], [7, "وكانت الحجرات الجانبية هذه تتسع من طابق إلى طابق وفقا لاَتساع كل طابق محيط بالهيكل، لهذا كان المرء يصعد من أسفل طابق إلى أعلى طابق عن طريق الطابق الأوسط."], [8, "ورأيت أن للهيكل رصيفا سميكا على امتداد محيطه. وكان مقاس الحجرات الجانبية قصبة كاملة أي ست أذرع (نحو ثلاثة أمتار) إلى المفصل."], [9, "وسمك حائط الحجرات من خارج خمس أذرع (نحو مترين ونصف المتر). وما تبقى هو فسحة لحجرات الهيكل."], [10, "وما بين الرصيف والمخادع عشرون ذراعا (نحو عشرة أمتار) على امتداد محيط الهيكل الخارجي."], [11, "وكان للحجرات الجانبية المطلة على الفسحة مدخلان: مدخل باتجاه الشمال، ومدخل آخر باتجاه الجنوب. وكان عرض هذه الفسحة خمس أذرع (نحو مترين ونصف المتر) على امتداد محيط الهيكل."], [12, "وكان عرض البناء المواجه لساحة الهيكل نحو الغرب سبعين ذراعا (نحو خمسة وثلاثين مترا) وسمك حائط البناء على امتداد محيطه خمس أذرع (نحو مترين ونصف المتر)."], [13, "ثم قاس الهيكل فكان طوله مئة ذراع (نحو خمسين مترا) كما كان طول الساحة والبناء مع جدرانه مئة ذراع (نحو خمسين مترا)."], [14, "وكذلك عرض الواجهة الشرقية للهيكل مع الساحة كان مئة ذراع (نحو خمسين مترا)."], [15, "ثم قاس طول البناء المواجه للساحة الخلفية باتجاه الغرب مع أساطينه، فكان مئة ذراع (نحو خمسين مترا). مع الهيكل الداخلي وأروقته."], [16, "وكانت العتبات والكوى المشبكة والأساطين المحيطة بالطبقات الثلاث مقابل العتبة، وكانت من الأرض إلى الكوى، والكوى نفسها، كلها مغطاة بألواح الخشب من جميع جوانبها."], [17, "وكذلك ما فوق المدخل وداخل الهيكل وخارجه، ومحيط الجدار من جانبيه الداخلي والخارجي بموجب الأقيسة المعينة."], [18, "وحفر فيه كروبيم وأشجار نخيل، نخلة بين كروب وكروب. وكان لكل كروب وجهان،"], [19, "أحدهما وجه إنسان باتجاه النخلة السابقة له، والآخر وجه شبل باتجاه النخلة التي تليه. وجميعها حفرت على كل جوانب الهيكل."], [20, "وقد انتشرت محفورات الكروبيم وأشجار النخيل من الأرض إلى ما فوق المداخل، وكذلك على جدار الهيكل."], [21, "وكانت قوائم الهيكل مربعة، كما كان وجه القدس مماثلا في منظره لوجه الهيكل."], [22, "أما المذبح فكان مصنوعا من خشب ارتفاعه ثلاث أذرع (نحو متر ونصف المتر)، وطوله ذراعان (نحو متر). وكانت زواياه وقاعدته وجوانبه مصنوعة من خشب. وقال لي الملاك: «هذه هي المائدة التي أمام الرب»."], [23, "وكان لكل من الهيكل والقدس بابان مزدوجان،"], [24, "ولكل باب مصراعان ينطويان على نفسيهما."], [25, "وحفر على مصاريع الهيكل كروبيم وأشجار نخيل مثل ما حفر على الجدران. وثبت إفريز من خشب على وجه الرواق من خارج."], [26, "وانتشرت الكوى المشبكة ورسوم أشجار النخيل على جانبي الرواق وعلى حجرات البيت وعلى الأفاريز."], [1, "ثم أخرجني إلى الساحة الخارجية من الطريق المتجه شمالا، وأدخلني إلى المخادع المواجهة للساحة المنفصلة مقابل البناء الشمالي."], [2, "وكان طول البناء ذي الباب المشرع شمالا مئة ذراع (نحو خمسين مترا) وعرضه خمسين ذراعا (نحو خمسة وعشرين مترا)."], [3, "ومقابل الساحة الداخلية التي طولها عشرون ذراعا (نحو عشرة أمتار) ومقابل رصيف الساحة الخارجية أروقة متقابلة قائمة في ثلاث طبقات."], [4, "وأمام المخادع ممر عرضه عشر أذرع (نحو خمسة أمتار) وطوله مئة ذراع (نحو خمسين مترا) وأبوابه مشرعة نحو الشمال."], [5, "وكانت المخادع العليا أضيق من مخادع الطابقين الآخرين لأن الأعمدة شغلت جزءا منها."], [6, "لأن المخادع مؤلفة من ثلاث طبقات، ولم يكن لها أعمدة كأعمدة الساحات. لذلك فإن المخادع العليا كانت أضيق من مخادع الطابقين الآخرين: الأسفل والأوسط"], [7, "وكان طول الجدار الخارجي الموازي لامتداد المخادع، باتجاه الساحة الخارجية، خمسين ذراعا (نحو خمسة وعشرين مترا)،"], [8, "لأن طول امتداد المخادع في الساحة الخارجية خمسون ذراعا (نحو خمسة وعشرين مترا)، بينما طول امتداد المخادع المواجهة للهيكل مئة ذراع (نحو خمسين مترا)"], [9, "وأقيم تحت هذه المخادع مدخل في الجهة الشرقية يفضي إلى المخادع من الساحة الخارجية."], [10, "وفي عرض جدار الدار نحو الشرق كانت هناك مخادع قائمة في الشمال، في مواجهة الساحة، مقابل البناء."], [11, "وأمامها ممر. وكانت مماثلة في طولها وعرضها وجميع مخارجها وأشكالها وأبوابها للمخادع التي نحو الشمال."], [12, "وكان تحت المخادع المتجهة نحو الجنوب مدخل شرقي يفضي إلى الممر المؤدي إليها، وفي مواجهتها جدار فاصل."], [13, "ثم قال لي الملاك: «إن المخادع الشمالية والمخادع الجنوبية المقابلة للساحة مخادع مقدسة، حيث يأكل الكهنة الذين يقربون في خدمتهم إلى الرب أقداس القرابين. هناك يضعون أقداس القرابين وتقدمة الحبوب، وذبيحة الخطية، وذبيحة الإثم لأن المكان مقدس."], [14, "وعلى الكهنة بعد دخولهم إليها أن لا يخرجوا إلى الساحة الخارجية إلا بعد أن يخلعوا ثيابهم المقدسة التي يخدمون بها، ويرتدون ثيابا غيرها. ثم يذهبون إلى حيث يجتمع الشعب."], [15, "وعندما انتهى من قياس الهيكل الداخلي أخرجني إلى الباب الشرقي، وقاس منطقة الهيكل المحيطة به."], [16, "فقاس الجانب الشرقي بقصبة القياس فكان خمس مئة قصبة (نحو ألف وخمس مئة متر)."], [17, "ثم تحول إلى الجانب الشمالي فقاسه، فكان خمس مئة قصبة (نحو ألف وخمس مئة متر)."], [18, "وقاس الجانب الجنوبي فكان خمس مئة قصبة (نحو ألف وخمس مئة متر)."], [19, "وكذلك قاس الجانب الغربي فكان خمس مئة قصبة (نحو ألف وخمس مئة متر)."], [20, "وهكذا أتم قياس محيط جوانبه الأربعة وكان له سور مربع طوله خمس مئة قصبة (نحو ألف وخمس مئة متر)، وكذلك عرضه، ليفصل بين الموضع المقدس والمواضع العامة."]]}, {"l": "1Co 3:9", "n": "", "vs": [[9, "فإننا نحن جميعا عاملون معا عند الله، وأنتم حقل الله وبناء الله."]]}, {"l": "Heb 3:3", "n": "", "vs": [[3, "إلا أنه يستحق مجدا أعظم من مجد موسى، كما أن الذي يبني بيتا ينال إكراما ومدحا أكثر مما ينال البيت الذي بناه!"]]}, {"l": "Heb 3:4", "n": "", "vs": [[4, "طبعا، كل بيت لابد أن يكون له بان، والله نفسه هو باني كل شيء."]]}], "kwAr": "البناء كله", "noteAr": ""}, {"kw": "fitly", "raw": "Exod. 26:1-37; 1Ki_6:7", "note": "", "refs": [{"l": "Exo 26:1-37", "n": "", "vs": [[1, "أما المسكن فتصنع سقفه من عشرة ستور كتانية مبرومة بإتقان، ذات ألوان زرقاء وبنفسجية وحمراء طرز عليها حائك ماهر (رسم) الكروبيم،"], [2, "ويكون طول كل ستار ثماني وعشرين ذراعا (نحو أربعة عشر مترا) وعرضه أربع أذرع (نحو مترين) فيكون لجميع الستور قياس واحد."], [3, "وتصل خمسة ستور منها ببعض، وكذلك افعل بالستور الخمسة الأخرى."], [4, "واصنع عرى من قماش أزرق على حاشية الطرف الواحد في الستور الموصولة الأولى. وكذلك تفعل أيضا في حاشية الطرف الواحد في الستور الموصولة الأولى. وكذلك تفعل أيضا في حاشية الطرف الأخير من الستور الأخرى الموصولة."], [5, "فيكون للطرف الأخير الواحد خمسون عروة في المجموعة الأولى، وخمسون عروة في طرف المجموعة الثانية، الواحدة مقابل الأخرى."], [6, "ثم اصنع خمسين مشبكا من ذهب تصل بها عرى المجموعتين، فتتصل المجموعتان معا لتصبحا سقفا واحدا للمسكن."], [7, "وتصنع أيضا سقفا ثانيا للمسكن، من أحد عشر ستارا من نسيج شعر المعزى."], [8, "طول الستار الواحد ثلاثون ذراعا (نحو خمسة عشر مترا) وعرضه أربع أذرع (نحو مترين) فتكون كلها ذات مقاس واحد."], [9, "وتصل خمسة ستور معا لتصبح قطعة واحدة، وكذلك افعل بالستور الستة الأخرى. على أن تثني الستار السادس، فيتدلى كحجاب أمام واجهة المسكن."], [10, "واصنع خمسين عروة على حاشية طرف واحد للمجموعة الأولى. وكذلك تصنع بحاشية طرف واحد للمجموعة الثانية."], [11, "وتصنع خمسين مشبكا من نحاس تدخلها في العرى فتتصل المجموعتان معا، لتصبحا سقفا ثانيا للمسكن."], [12, "ويتبقى لديك ذراع (نحو نصف المتر) من غطاء السقف مدلى لحجب مؤخر المسكن."], [13, "والجزء الفاصل من طول الستور على كل جانب من بين الجانبين، تسدله على جانبي المسكن من هنا ومن هناك لتغطيه."], [14, "وتصنع غطاء للخيمة من جلود كباش مصبوغة باللون الأحمر، وفوقه سقف آخر من جلود الدلفين."], [15, "أما جدران المسكن فتصنعها من ألواح قائمة من خشب السنط."], [16, "طول اللوح منها عشر أذرع (نحو خمسة أمتار) وعرضه ذراع ونصف (نحو خمسة وسبعين سنتيمترا)"], [17, "ولتكن لكل لوح رجلان متقابلتان إحداهما بإزاء الأخرى. هكذا تصنع لجميع ألواح المسكن."], [18, "فتجعل الجانب الجنوبي للمسكن مكونا من عشرين لوحا."], [19, "واصنع أربعين قاعدة من فضة تحت العشرين لوحا، فيكون لكل لوح منفرد قاعدتان لرجليه."], [20, "واجعل لجانب المسكن الثاني الشمالي عشرين لوحا."], [21, "واصنع له أيضا أربعين قاعدة من فضة، ليكون لكل لوح منفرد قاعدتان لرجليه."], [22, "أما جدار مؤخر المسكن الغربي فتصنع له ستة ألواح."], [23, "كما تصنع لوحين لزاويتي المسكن في المؤخر."], [24, "على أن يكون كل منهما مزدوجا من أسفله إلى أعلاه، حيث تثبت في رأس كل مزدوج حلقة واحدة. كل منهما للزاويتين."], [25, "فيكون هناك ثمانية ألواح للجانب الغربي، وست عشرة قاعدة من فضة، قاعدتان تحت كل لوح منفرد."], [26, "وتصنع عوارض من خشب السنط. خمسا لألواح جانب المسكن الجنوبي."], [27, "وخمس عوارض لألواح مؤخر المسكن الغربي."], [28, "وتجعل العارضة الوسطى تنفذ في وسط الألواح من طرف إلى طرف."], [29, "وتغشي الألواح برقائق من ذهب. واصنع لها حلقات من ذهب لتكون بيوتا للعوارض، وتغشي العوارض بذهب أيضا."], [30, "وهكذا تقيم المسكن وفقا للمثال الذي أريتك إياه على الجبل."], [31, "وتصنع ستارا من كتان مبروم ذي ألوان زرقاء وبنفسجية وحمراء، بعد أن يطرز عليه حائك ماهر رسم الكروبيم."], [32, "وعلقه على أربعة أعمدة من خشب السنط مغشاة بذهب. لها أربعة خطاطيف من ذهب، وقائمة على أربع قواعد من فضة."], [33, "وتجعل الستار تحت المشابك. ثم تأتي بتابوت الشهادة (الذي فيه لوحا الوصايا العشر) فتدخله إلى هناك، إلى ما وراء الستارة الفاصلة بين القدس وقدس الأقداس."], [34, "وتضع الغطاء على تابوت الشهادة في قدس الأقداس."], [35, "وتنصب المائدة خارج الستارة مقابل المنارة، فتكون المائدة قائمة في الجهة الجنوبية."], [36, "وتصنع ستارة لمدخل المسكن، ذات ألوان زرقاء وبنفسجية وحمراء وخيوط كتان مبروم من تطريز حائك ماهر."], [37, "وتجعل للستارة خمسة أعمدة من خشب السنط، ذات خطاطيف من ذهب، وتغشي الأعمدة بذهب وتسبك لها خمس قواعد من نحاس."]]}, {"l": "1Ki 6:7", "n": "", "vs": [[7, "وتم بناء الهيكل بحجارة صحيحة، اقتلعها العمال ونحتوها في مقالعها، فلم يسمع في الهيكل عند بنائه صوت منحت أو معول أو أي أداة حديدية."]]}], "kwAr": "يتناسق", "noteAr": ""}, {"kw": "an", "raw": "Psa_93:5; Eze_42:12; 1Co_3:17; 2Co_6:16", "note": "", "refs": [{"l": "Psa 93:5", "n": "", "vs": [[5, "أقوالك ثابتة إلى الأبد، وببيتك أيها الرب تليق القداسة مدى الدهر."]]}, {"l": "Eze 42:12", "n": "", "vs": [[12, "وكان تحت المخادع المتجهة نحو الجنوب مدخل شرقي يفضي إلى الممر المؤدي إليها، وفي مواجهتها جدار فاصل."]]}, {"l": "1Co 3:17", "n": "", "vs": [[17, "فإن دمر أحد هيكل الله، يدمره الله ، لأن هيكل الله مقدس، وهو أنتم"]]}, {"l": "2Co 6:16", "n": "", "vs": [[16, "وأي وفاق لهيكل الله مع الأصنام؟ فإننا نحن هيكل الله الحي، وفقا لما قاله الله : «سأسكن في وسطهم، وأسير بينهم، وأكون إلههم وهم يكونون شعبا لي…"]]}], "kwAr": "هيكلا مقدسا", "noteAr": ""}], "arS": [["الذي فيه ", []], ["يتناسق", ["G4883"]], [" ", []], ["البناء", ["G3619"]], [" ", []], ["كله", ["G3956"]], [" ", []], ["فيرتفع", ["G837"]], [" ليصير ", []], ["هيكلا", ["G3485"]], [" ", []], ["مقدسا", ["G40"]], [" في ", []], ["الرب", ["G2962"]], [".", []]]}, {"c": 2, "v": 22, "text": "وفيه أنتم أيضا قد بنيتم معا فصرتم مسكنا لله بوجود الروح.", "groups": [{"kw": "an", "raw": "Joh_14:17-23, Joh_17:21-23; Rom_8:9-11; 1Co_3:16, 1Co_6:19; 1Pe_2:4, 1Pe_2:5; 1Jo_3:24, 1Jo_4:13, 1Jo_4:16", "note": "", "refs": [{"l": "Joh 14:17-23", "n": "", "vs": [[17, "وهو روح الحق، الذي لا يقدر العالم أن يتقبله لأنه لا يراه ولا يعرفه، وأما أنتم فتعرفونه لأنه في وسطكم، وسيكون في داخلكم."], [18, "لن أترككم يتامى، بل سأعود إليكم."], [19, "بعد قليل لا يراني العالم. أما أنتم فسوف ترونني. ولأني أنا حي، فأنتم أيضا ستحيون."], [20, "في ذلك اليوم تعلمون أني أنا في أبي، وأنتم في، وأنا فيكم."], [21, "من كانت عنده وصاياي، ويعمل بها، فذاك يحبني. والذي يحبني، يحبه أبي، وأنا أحبه وأعلن له ذاتي»."], [22, "فسأله يهوذا، غير الإسخريوطي: «ياسيد، ماذا جرى حتى تعلن لنا ذاتك ولا تعلنها للعالم؟»"], [23, "أجابه يسوع: «من يحبني يعمل بكلمتي، ويحبه أبي، وإليه نأتي، وعنده نجعل لنا منزلا."]]}, {"l": "Joh 17:21-23", "n": "", "vs": [[21, "ليكون الجميع واحدا؛ أيها الآب، كما أنك أنت في وأنا فيك، ليكونوا هم أيضا واحدا فينا، لكي يؤمن العالم أنك أنت أرسلتني."], [22, "إني أعطيتهم المجد الذي أعطيتني، ليكونوا واحدا كما نحن واحد."], [23, "أنا فيهم، وأنت في، ليكتملوا فيصيروا واحدا، حتى يعرف العالم أنك أرسلتني وأنك أحببتهم كما أحببتني."]]}, {"l": "Rom 8:9-11", "n": "", "vs": [[9, "وأما أنتم، فلستم تحت سلطة الجسد بل تحت سلطة الروح، إذا كان روح الله ساكنا في داخلكم حقا. ولكن، إن كان أحد ليس له روح المسيح، فهو ليس للمسيح."], [10, "وإذا كان المسيح فيكم، فمع أن الجسد مائت بسبب الخطيئة، فإن الروح حياة لكم بسبب البر."], [11, "وإذا كان روح الذي أقام يسوع من بين الأموات يسكن فيكم، فإن الذي أقام المسيح من بين الأموات سوف يحيي أيضا أجسادكم الفانية بسبب روحه الذي يسكن فيكم."]]}, {"l": "1Co 3:16", "n": "", "vs": [[16, "ألا تعرفون أنكم هيكل الله وأن روح الله ساكن فيكم؟"]]}, {"l": "1Co 6:19", "n": "", "vs": [[19, "أما تعلمون أن جسدكم هو هيكل للروح القدس الساكن فيكم والذي هو لكم من الله، وأنكم أنتم لستم ملكا لأنفسكم؟"]]}, {"l": "1Pe 2:4", "n": "", "vs": [[4, "فأنتم قد أتيتم إليه، باعتباره الحجر الحي الذي رفضه الناس، واختاره الله ، وهو ثمين في نظره."]]}, {"l": "1Pe 2:5", "n": "", "vs": [[5, "إذن اتحدوا به كحجارة حية، مبنيين بيتا روحيا، تكونون فيه كهنة مقدسين تقدمون لله ذبائح روحية مقبولة لديه بفضل يسوع المسيح."]]}, {"l": "1Jo 3:24", "n": "", "vs": [[24, "وكل من يطيع وصايا الله، فإنه يثبت في الله، والله يثبت فيه. والذي يؤكد لنا أن الله يثبت فينا، هو الروح القدس الذي وهبه لنا."]]}, {"l": "1Jo 4:13", "n": "", "vs": [[13, "وما يؤكد لنا أننا نثبت في الله، وأنه يثبت فينا هو أنه وهب لنا من روحه."]]}, {"l": "1Jo 4:16", "n": "", "vs": [[16, "ونحن أنفسنا اختبرنا المحبة التي خصنا الله بها، ووضعنا ثقتنا فيها. إن الله محبة. ومن يثبت في المحبة، فإنه يثبت في الله، والله يثبت فيه."]]}], "kwAr": "مسكنا لله", "noteAr": ""}], "arS": [["وفيه أنتم أيضا قد ", []], ["بنيتم معا", ["G4925"]], [" فصرتم ", []], ["مسكنا", ["G2732"]], [" ", []], ["لله", ["G2316"]], [" بوجود ", []], ["الروح", ["G4151"]], [".", []]]}, {"c": 3, "v": 1, "text": "لهذا السبب، أنا بولس سجين المسيح يسوع لأجلكم أنتم الأمم …", "groups": [{"kw": "I", "raw": "2Co_10:1; Gal_5:2", "note": "", "refs": [{"l": "2Co 10:1", "n": "", "vs": [[1, "ولكني أتوسل إليكم بوداعة المسيح وحلمه، أنا بولس «المتواضع وأنا حاضر بينكم، والجريء عليكم وأنا غائب عنكم»،"]]}, {"l": "Gal 5:2", "n": "", "vs": [[2, "ها أنا بولس أقول لكم: إن ختنتم، لا ينفعكم المسيح شيئا."]]}], "kwAr": "أنا بولس", "noteAr": ""}, {"kw": "the", "raw": "Eph_4:1, Eph_6:20; Luk_21:12; Act_21:33, Act_26:29, Act_28:17-20; 2Co_11:23; Phi_1:7; Phi_1:13-16; Col_1:24, Col_4:3, Col_4:18; 2Ti_1:8, 2Ti_1:16, 2Ti_2:9; Phm_1:1, Phm_1:9; Rev_2:10", "note": "", "refs": [{"l": "Eph 4:1", "n": "", "vs": [[1, "... إذن، أنا السجين في الرب، أناشدكم أن تسلكوا سلوكا يليق بالدعوة التي إليها دعيتم،"]]}, {"l": "Eph 6:20", "n": "", "vs": [[20, "الذي أنا سفيره المقيد بالسلاسل، فأكون جريئا في إعلانه كما يجب أن أتكلم به."]]}, {"l": "Luk 21:12", "n": "", "vs": [[12, "ولكن قبل هذه الأمور كلها يمد الناس أيديهم إليكم ويضطهدونكم، فيسلمونكم إلى المجامع والسجون، ويسوقونكم للمثول أمام الملوك والحكام، من أجل اسمي."]]}, {"l": "Act 21:33", "n": "", "vs": [[33, "فاقترب القائد وألقى القبض عليه، وأمر جنوده أن يقيدوه بسلسلتين، وأخذ يسأل: «من هو، وماذا فعل؟»"]]}, {"l": "Act 26:29", "n": "", "vs": [[29, "فقال بولس: «سواء كان قليلا أم كثيرا، فإن صلاتي إلى الله لأجلك ولأجل الحاضرين هنا جميعا أن تصيروا مثلي، ولكن دون هذه السلاسل!»"]]}, {"l": "Act 28:17-20", "n": "", "vs": [[17, "وبعد ثلاثة أيام دعا بولس وجهاء اليهود، وقال لهم: «أيها الإخوة، مع أني لم أفعل ما يسيء إلى الشعب، ولا إلى طقوس آبائنا، فقد سجنت في أورشليم وسلمت إلى الرومان،"], [18, "فاستجوبوني وأرادوا إطلاقي، لأنه لم يكن هناك ما يستوجب إعدامي."], [19, "غير أن اليهود اعترضوا، فاضطررت إلى استئناف دعواي إلى القيصر. وهذا لا يعني أنني أشكو بني وطني بشيء."], [20, "لذلك طلبت أن أراكم وأكلمكم؛ فأنا موثق بهذه السلسلة من أجل رجاء إسرائيل»."]]}, {"l": "2Co 11:23", "n": "", "vs": [[23, "وإن كانوا خدام المسيح، أتكلم كأني فقدت صوابي، فأنا متفوق عليهم: في الأتعاب أوفر منهم جدا، في الجلدات فوق الحد، في السجون أوفر جدا، في التعرض للموت أكثر مرارا."]]}, {"l": "Phi 1:7", "n": "", "vs": [[7, "كما أن من الحق أن يكون لي هذا الشعور تجاهكم جميعا، لأني أحتفظ بكم في قلبي، لكونكم جميعا شركاء لي في النعمة، سواء أكان في قيودي أم في الدفاع عن الإنجيل وتثبيته."]]}, {"l": "Phi 1:13-16", "n": "", "vs": [[13, "حتى إنه قد صار معروفا لدى الحرس الإمبراطوري كله ولدى الباقين جميعا أن قيودي إنما هي لأجل المسيح؛"], [14, "كما أن أكثر الإخوة، وقد صاروا واثقين بالرب بسبب قيودي، يجرؤون على التبشير بكلمة الله دون خوف."], [15, "حقا أن بعضهم يبشرون بالمسيح عن حسد ونزاع؛ وأما الآخرون فعن حسن نية."], [16, "فهؤلاء تدفعهم المحبة، عالمين أني قد عينت للدفاع عن الإنجيل؛"]]}, {"l": "Col 1:24", "n": "", "vs": [[24, "والآن أنا أفرح في الآلام التي أقاسيها لأجلكم، وأتمم في جسدي ما نقص من ضيقات المسيح لأجل جسده الذي هو الكنيسة،"]]}, {"l": "Col 4:3", "n": "", "vs": [[3, "مصلين معا لأجلنا أيضا، كي يفتح لنا الله بابا للكلمة، فنتكلم بسر المسيح الذي من أجله أنا مقيد أيضا،"]]}, {"l": "Col 4:18", "n": "", "vs": [[18, "هذا السلام بخط يدي، أنا بولس. تذكروا قيودي. لتكن النعمة معكم."]]}, {"l": "2Ti 1:8", "n": "", "vs": [[8, "فلا تخجل إذن بالشهادة لربنا، ولا تخجل بي أنا السجين لأجله، بل شاركني في المشقات لأجل الإنجيل، متوكلا على قدرة الله."]]}, {"l": "2Ti 1:16", "n": "", "vs": [[16, "ليرحم الرب عائلة أونيسيفورس، لأنه كثيرا ما أنعشني، ولم يخجل بقيودي،"]]}, {"l": "2Ti 2:9", "n": "", "vs": [[9, "الذي لأجل التبشير به أقاسي حتى القيود كأني فاعل شر. إلا أن كلمة الله لا تكبلها القيود."]]}, {"l": "Phm 1:1", "n": "", "vs": [[1, "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"]]}, {"l": "Phm 1:9", "n": "", "vs": [[9, "إلا أني، إكراما للمحبة، اخترت أن أقدم إليك التماسا، بصفتي بولس العجوز والسجين حاليا لأجل المسيح يسوع."]]}, {"l": "Rev 2:10", "n": "", "vs": [[10, "دع عنك الخوف مما ينتظرك من آلام، فإن إبليس سيزج ببعضكم في السجن لكي تمتحنوا، فتقاسون الاضطهاد عشرة أيام. فابق أمينا حتى الموت، فأمنحك إكليل الحياة."]]}], "kwAr": "سجين المسيح يسوع", "noteAr": ""}, {"kw": "for", "raw": "Gal_5:11; Col_1:24; 1Th_2:15, 1Th_2:16; 2Ti_2:10", "note": "", "refs": [{"l": "Gal 5:11", "n": "", "vs": [[11, "وأما أنا، أيها الإخوة، فلو صح أنني مازلت أدعو إلى الختان، فلماذا مازلت ألقى الاضطهاد؟ إذن لكانت العثرة التي في الصليب قد زالت!"]]}, {"l": "Col 1:24", "n": "", "vs": [[24, "والآن أنا أفرح في الآلام التي أقاسيها لأجلكم، وأتمم في جسدي ما نقص من ضيقات المسيح لأجل جسده الذي هو الكنيسة،"]]}, {"l": "1Th 2:15", "n": "", "vs": [[15, "الذين قتلوا الرب يسوع والأنبياء واضطهدونا نحن أيضا، وهم لا يرضون الله ويعادون الناس جميعا،"]]}, {"l": "1Th 2:16", "n": "", "vs": [[16, "إذ يمنعوننا من تبشير الأمم ليخلصوا، وبذلك يستكملون خطاياهم كل حين، ولكن الغضب قد حل عليهم إلى الغاية."]]}, {"l": "2Ti 2:10", "n": "", "vs": [[10, "لهذا السبب أحتمل كل شيء بصبر لأجل الذين اختارهم الله ، لكي يحصلوا، هم أيضا، على الخلاص الذي في المسيح يسوع مع المجد الأبدي."]]}], "kwAr": "لأجلكم أنتم الأمم", "noteAr": ""}], "arS": [["لهذا السبب", ["G5484", "G5127"]], ["، ", []], ["أنا", ["G1473"]], [" ", []], ["بولس", ["G3972"]], [" ", []], ["سجين", ["G1198"]], [" ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [" لأجلكم أنتم ", []], ["الأمم", ["G1484"]], [" …", []]]}, {"c": 3, "v": 2, "text": "على اعتبار أنكم قد سمعتم بتدبير نعمة الله الموهوبة لي لأجلكم:", "groups": [{"kw": "ye", "raw": "Eph_4:21; Gal_1:13; Col_1:4, Col_1:6; 2Ti_1:11", "note": "", "refs": [{"l": "Eph 4:21", "n": "", "vs": [[21, "إذا كنتم قد سمعتموه حقا وتلقيتم فيه التعليم الموافق للحق الذي في يسوع!"]]}, {"l": "Gal 1:13", "n": "", "vs": [[13, "فإنكم قد سمعتم بسيرتي الماضية في الديانة اليهودية، كيف كنت أضطهد كنيسة الله متطرفا إلى أقصى حد، ساعيا إلى تخريبها،"]]}, {"l": "Col 1:4", "n": "", "vs": [[4, "إذ بلغنا خبر إيمانكم بالمسيح يسوع والمحبة التي لكم نحو جميع القديسين،"]]}, {"l": "Col 1:6", "n": "", "vs": [[6, "والتي وصلت إليكم كما تنتشر الآن في العالم أجمع، منتجة الثمر ونامية، مثلما يحدث بينكم أنتم منذ أن سمعتم بنعمة الله واختبرتموها بالحق،"]]}, {"l": "2Ti 1:11", "n": "", "vs": [[11, "الذي له عينت أنا مبشرا ورسولا ومعلما."]]}], "kwAr": "قد سمعتم", "noteAr": ""}, {"kw": "the dispensation", "raw": "Eph_3:8, Eph_4:7; Act_9:15, Act_13:2, Act_13:46, Act_22:21, Act_26:17, Act_26:18; Rom_1:5, Rom_11:13, Rom_12:3; Rom_15:15, Rom_15:16; 1Co_4:1, 1Co_9:17-22; Gal_1:15, Gal_1:16, Gal_2:8, Gal_2:9; Col_1:25-27; 1Ti_1:11, 1Ti_2:7; 2Ti_1:11", "note": "", "refs": [{"l": "Eph 3:8", "n": "", "vs": [[8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "Eph 4:7", "n": "", "vs": [[7, "على أن كل واحد منا قد أعطي نعمة توافق مقدار ما يهبه المسيح."]]}, {"l": "Act 9:15", "n": "", "vs": [[15, "فأمره الرب: «اذهب! فقد اخترت هذا الرجل ليكون إناء يحمل اسمي إلى الأمم والملوك وبني إسرائيل."]]}, {"l": "Act 13:2", "n": "", "vs": [[2, "وذات يوم، وهم صائمون يتعبدون للرب، قال لهم الروح القدس: «خصصوا لي برنابا وشاول لأجل العمل الذي دعوتهما إليه»."]]}, {"l": "Act 13:46", "n": "", "vs": [[46, "فخاطبهم بولس وبرنابا بجرأة قائلين: «كان يجب أن نبلغكم أنتم أولا كلمة الله، ولكنكم رفضتموها فأظهرتم أنكم لا تستحقون الحياة الأبدية. وها نحن نتوجه إلى غير اليهود!"]]}, {"l": "Act 22:21", "n": "", "vs": [[21, "ولكنه قال لي: اذهب ... سأرسلك بعيدا: إلى الأمم!»"]]}, {"l": "Act 26:17", "n": "", "vs": [[17, "وسأنقذك من شعبك ومن الأمم التي أرسلك إليها الآن،"]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "Rom 1:5", "n": "", "vs": [[5, "الذي به ولأجل اسمه نلنا نعمة ورسالة لإطاعة الإيمان بين جميع الأمم،"]]}, {"l": "Rom 11:13", "n": "", "vs": [[13, "فإني أخاطبكم، أنتم الأمم، بما أني رسول للأمم، ممجدا رسالتي،"]]}, {"l": "Rom 12:3", "n": "", "vs": [[3, "فإني، بالنعمة الموهوبة لي، أوصي كل واحد بينكم ألا يقدر نفسه تقديرا يفوق حقه، بل أن يكون متعقلا في تفكيره، بحسب مقدار الإيمان الذي قسمه الله لكل منكم."]]}, {"l": "Rom 15:15", "n": "", "vs": [[15, "على أني كتبت إليكم بأوفر جرأة في بعض الأمور، مذكرا لكم، وذلك بالنعمة التي وهبها الله لي."]]}, {"l": "Rom 15:16", "n": "", "vs": [[16, "وبذلك أكون خادم المسيح يسوع، المرسل إلى الأمم، حاملا إنجيل الله وكأني أقوم بخدمة كهنوتية، بقصد أن ترفع لله من بين الأمم تقدمة تكون مقبولة ومقدسة بالروح القدس."]]}, {"l": "1Co 4:1", "n": "", "vs": [[1, "فلينظر إلينا الناس باعتبارنا خداما للمسيح ووكلاء على أسرار الله."]]}, {"l": "1Co 9:17-22", "n": "", "vs": [[17, "فإن قمت بذلك متطوعا، كانت لي مكافأة. ولكن، إن كنت مرغما، فأنا مؤتمن على مسئولية،"], [18, "فما هي مكافأتي إذن؟ هي أني في تبشيري أجعل الإنجيل بلا كلفة، غير مستغل كامل حقي لقاء التبشير بالإنجيل."], [19, "فمع أني حر من الجميع، جعلت نفسي عبدا للجميع، لأكسب أكبر عدد ممكن منهم."], [20, "فصرت لليهود كأني يهودي، حتى أكسب اليهود؛ وللخاضعين للشريعة كأني خاضع لها مع أني لست خاضعا لها حتى أكسب الخاضعين لها؛"], [21, "وللذين بلا شريعة كأني بلا شريعة مع أني لست بلا ناموس عند الله بل أنا خاضع لناموس من نحو المسيح حتى أكسب الذين هم بلا شريعة."], [22, "وصرت للضعفاء ضعيفا، حتى أكسب الضعفاء. صرت للجميع كل شيء، لأنقذ بعضا منهم مهما كلف الأمر."]]}, {"l": "Gal 1:15", "n": "", "vs": [[15, "ولكن، لما سر الله ، الذي كان قد أفرزني وأنا في بطن أمي ثم دعاني بنعمته،"]]}, {"l": "Gal 1:16", "n": "", "vs": [[16, "أن يعلن ابنه في لأبشر به بين الأمم، في الحال لم أستشر لحما ودما،"]]}, {"l": "Gal 2:8", "n": "", "vs": [[8, "لأن الذي استخدم بطرس في رسوليته إلى أهل الختان، استخدمني أيضا بالنسبة إلى الأمم."]]}, {"l": "Gal 2:9", "n": "", "vs": [[9, "فلما اتضحت النعمة الموهوبة لي عند يعقوب وبطرس ويوحنا، وهم البارزون باعتبارهم أعمدة، مدوا إلي وإلى برنابا أيديهم اليمنى إشارة إلى المشاركة، فنتوجه نحن إلى الأمم وهم إلى أهل الختان،"]]}, {"l": "Col 1:25-27", "n": "", "vs": [[25, "ولها قد صرت أنا خادما بموجب تدبير الله الموهوب لي من أجلكم، وهو أن أتمم كلمة الله، بإعلان"], [26, "السر الذي كان مكتوما طوال العصور والأجيال، ولكن كشف الآن لقديسيه،"], [27, "الذين أراد الله أن يعلن لهم كم هو غني مجد هذا السر بين الأمم: إنه المسيح فيكم، وهو رجاء المجد؛"]]}, {"l": "1Ti 1:11", "n": "", "vs": [[11, "الموافق لإنجيل مجد الله المبارك، ذلك الإنجيل الذي وضع أمانة بين يدي."]]}, {"l": "1Ti 2:7", "n": "", "vs": [[7, "ولها قد عينت أنا مبشرا ورسولا، الحق أقول ولست أكذب، معلما للأمم في الإيمان والحق."]]}, {"l": "2Ti 1:11", "n": "", "vs": [[11, "الذي له عينت أنا مبشرا ورسولا ومعلما."]]}], "kwAr": "بتدبير نعمة الله", "noteAr": ""}], "arS": [["على اعتبار أنكم قد ", []], ["سمعتم", ["G191"]], [" ", []], ["بتدبير", ["G3622"]], [" ", []], ["نعمة", ["G5485"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["الموهوبة", ["G1325"]], [" لي لأجلكم:", []]]}, {"c": 3, "v": 3, "text": "كيف كشف لي السر عن طريق الوحي، كما كتبت قبلا بإيجاز،", "groups": [{"kw": "by", "raw": "Eph_1:17; Act_22:17, Act_22:21, Act_23:9, Act_26:15-19; 1Co_2:9, 1Co_2:10; Gal_1:12, Gal_1:16-19", "note": "", "refs": [{"l": "Eph 1:17", "n": "", "vs": [[17, "حتى يهبكم إله ربنا يسوع المسيح، أبو المجد، روح حكمة وإلهام: لتعرفوه معرفة كاملة"]]}, {"l": "Act 22:17", "n": "", "vs": [[17, "بعد ذلك رجعت إلى أورشليم. وبينما كنت أصلي في الهيكل غبت عن الوعي،"]]}, {"l": "Act 22:21", "n": "", "vs": [[21, "ولكنه قال لي: اذهب ... سأرسلك بعيدا: إلى الأمم!»"]]}, {"l": "Act 23:9", "n": "", "vs": [[9, "وعلا الصياح، فوقف بعض علماء الشريعة الموالين للفريسيين، يحتجون بحماسة، فقالوا: «لا نجد على هذا الرجل ذنبا، فلربما كلمه روح أو ملاك!»"]]}, {"l": "Act 26:15-19", "n": "", "vs": [[15, "فسألت: من أنت ياسيد؟ فأجاب: أنا يسوع الذي أنت تضطهده."], [16, "انهض وقف على قدميك، فقد ظهرت لك لأعينك خادما لي وشاهدا بهذه الرؤيا التي تراني فيها الآن، وبالرؤى التي ستراني فيها بعد اليوم."], [17, "وسأنقذك من شعبك ومن الأمم التي أرسلك إليها الآن،"], [18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."], [19, "ومن ذلك الحين لم أعاند الرؤيا السماوية، أيها الملك أغريباس."]]}, {"l": "1Co 2:9", "n": "", "vs": [[9, "لما صلبوا رب المجد! ولكن، وفقا لما كتب: «إن ما لم تره عين، ولم تسمع به أذن، ولم يخطر على بال بشر قد أعده الله لمحبيه!»"]]}, {"l": "1Co 2:10", "n": "", "vs": [[10, "ولكن الله كشف لنا ذلك بالروح. فإن الروح يتقصى كل شيء، حتى أعماق الله."]]}, {"l": "Gal 1:12", "n": "", "vs": [[12, "فلا أنا تسلمته من إنسان، ولا تلقنته، بل جاءني بإعلان من يسوع المسيح."]]}, {"l": "Gal 1:16-19", "n": "", "vs": [[16, "أن يعلن ابنه في لأبشر به بين الأمم، في الحال لم أستشر لحما ودما،"], [17, "ولا صعدت إلى أورشليم لأقابل الذين كانوا رسلا من قبلي، بل انطلقت إلى بلاد العرب، وبعد ذلك رجعت إلى دمشق."], [18, "ثم صعدت إلى أورشليم، بعد ثلاث سنوات، لأتعرف ببطرس. وقد أقمت عنده خمسة عشر يوما."], [19, "ولكني لم أقابل غيره من الرسل إلا يعقوب، أخا الرب."]]}], "kwAr": "عن طريق الوحي", "noteAr": ""}, {"kw": "the mystery", "raw": "Eph_3:9; Rom_11:25, Rom_16:25; Col_1:26, Col_1:27", "note": "", "refs": [{"l": "Eph 3:9", "n": "", "vs": [[9, "وأنير الجميع بمعرفة ما هو تدبير السر الذي أبقاه الله ، خالق كل شيء، مكتوما مدى الأجيال."]]}, {"l": "Rom 11:25", "n": "", "vs": [[25, "فإني لا أريد، أيها الإخوة، أن يخفى عليكم هذا السر، لكي لا تكونوا حكماء في نظر أنفسكم، وهو أن العمى قد أصاب إسرائيل جزئيا إلى أن يتم دخول الأمم كليا."]]}, {"l": "Rom 16:25", "n": "", "vs": [[25, "والمجد للقادر أن يثبتكم، وفقا لإنجيلي وللبشارة بيسوع المسيح، ووفقا لإعلان ما كان سرا ظل مكتوما مدى الأزمنة الأزلية،"]]}, {"l": "Col 1:26", "n": "", "vs": [[26, "السر الذي كان مكتوما طوال العصور والأجيال، ولكن كشف الآن لقديسيه،"]]}, {"l": "Col 1:27", "n": "", "vs": [[27, "الذين أراد الله أن يعلن لهم كم هو غني مجد هذا السر بين الأمم: إنه المسيح فيكم، وهو رجاء المجد؛"]]}], "kwAr": "كشف لي السر", "noteAr": ""}, {"kw": "as I", "raw": "Eph_1:9-11, Eph_2:11-22", "note": "", "refs": [{"l": "Eph 1:9-11", "n": "", "vs": [[9, "إذ كشف لنا سر مشيئته بحسب مرضاته التي قصدها في نفسه،"], [10, "لأجل تدبير تمام الأزمنة، حين يوحد كل شيء تحت رئاسة المسيح، سواء الأشياء التي في السماوات والتي على الأرض."], [11, "وفي المسيح أيضا قد حصلنا على الميراث الذي سبق أن عينا له، وفقا لقصده، هو الذي يعمل كل شيء كما تقضي مشيئته."]]}, {"l": "Eph 2:11-22", "n": "", "vs": [[11, "لذلك اذكروا، أنتم الأمم في الجسد سابقا، يامن تسمون أهل عدم الختان من قبل من يسمون أهل الختان الذي يجري في الجسد باليد،"], [12, "أنكم كنتم في ذلك الحين بلا مسيح، أجانب عن جماعة إسرائيل، وغرباء عن العهود الموعودة، لا رجاء لكم، ومنكرين لله في العالم."], [13, "أما الآن، ففي المسيح يسوع، أنتم الذين كنتم من قبل بعيدين قد صرتم قريبين بدم المسيح."], [14, "فإنه هو سلامنا، ذاك الذي جعل الفريقين واحدا وهدم حائط الحاجز الفاصل بينهما،"], [15, "أي العداء: إذ أبطل بجسده شريعة الوصايا ذات الفرائض، لكي يكون من الفريقين إنسانا واحدا جديدا، إذ أحل السلام بينهما،"], [16, "ولكي يصالحهما معا في جسد واحد مع الله بالصليب الذي به قتل العداء."], [17, "ثم جاء وبشركم بالسلام أنتم البعيدين، (كما بشر بالسلام) أولئك القريبين."], [18, "فبه لنا كلينا اقتراب إلى الآب بروح واحد."], [19, "إذن، لستم غرباء وأجانب بعد الآن، بل أنتم رعية مع القديسين وأعضاء في عائلة الله،"], [20, "وقد بنيتم على أساس الرسل والأنبياء، والمسيح يسوع نفسه هو حجر الزاوية الأساس،"], [21, "الذي فيه يتناسق البناء كله فيرتفع ليصير هيكلا مقدسا في الرب."], [22, "وفيه أنتم أيضا قد بنيتم معا فصرتم مسكنا لله بوجود الروح."]]}], "kwAr": "كما كتبت", "noteAr": ""}, {"kw": "afore", "raw": "or, a little before", "note": "or, a little before", "refs": [], "kwAr": "قبلا بإيجاز", "noteAr": "أو: قبل قليل."}], "arS": [["كيف ", []], ["كشف", ["G1107"]], [" لي ", []], ["السر", ["G3466"]], [" عن طريق ", []], ["الوحي", ["G602"]], ["، كما ", []], ["كتبت قبلا", ["G4270"]], [" ", []], ["بإيجاز", ["G3641"]], ["،", []]]}, {"c": 3, "v": 4, "text": "ويمكنكم، حينما تقرأون ما كتبته، أن تدركوا اطلاعي العميق على سر المسيح،", "groups": [{"kw": "ye may", "raw": "Mat_13:11; 1Co_2:6, 1Co_2:7, 1Co_13:2; 2Co_11:6", "note": "", "refs": [{"l": "Mat 13:11", "n": "", "vs": [[11, "فأجاب: «لأنه قد أعطي لكم أن تعرفوا أسرار ملكوت السماوات؛ أما أولئك، فلم يعط لهم ذلك."]]}, {"l": "1Co 2:6", "n": "", "vs": [[6, "على أن لنا حكمة نتكلم بها بين البالغين. ولكنها حكمة ليست من هذا العالم ولا من رؤساء هذا العالم الزائلين."]]}, {"l": "1Co 2:7", "n": "", "vs": [[7, "بل إننا نتكلم بحكمة الله المطوية في سر، تلك الحكمة المحجوبة التي سبق الله فأعدها قبل الدهور لأجل مجدنا"]]}, {"l": "1Co 13:2", "n": "", "vs": [[2, "ولو كانت لي موهبة النبوءة، وكنت عالما بجميع الأسرار والعلم كله، وكان عندي الإيمان كله حتى أنقل الجبال، وليس عندي محبة، فلست شيئا!"]]}, {"l": "2Co 11:6", "n": "", "vs": [[6, "فمع أني أتكلم كلام العامة غير الفصيح، فلا تنقصني المعرفة. وإنما أظهرنا لكم ذلك في كل شيء أمام الجميع."]]}], "kwAr": "أن تدركوا", "noteAr": ""}, {"kw": "the mystery", "raw": "Eph_1:9, Eph_5:32, Eph_6:19; Luk_2:10,Luk_2:11, Luk_8:10; 1Co_4:1; Col_2:2, Col_4:3; 1Ti_3:9, 1Ti_3:16", "note": "", "refs": [{"l": "Eph 1:9", "n": "", "vs": [[9, "إذ كشف لنا سر مشيئته بحسب مرضاته التي قصدها في نفسه،"]]}, {"l": "Eph 5:32", "n": "", "vs": [[32, "هذا السر عظيم ولكنني أشير به إلى المسيح والكنيسة!"]]}, {"l": "Eph 6:19", "n": "", "vs": [[19, "ولأجلي كي ألهم ما أنطق به كلما فتحت فمي لأعلن بجرأة سر الإنجيل"]]}, {"l": "Luk 2:10", "n": "", "vs": [[10, "فقال لهم الملاك: «لا تخافوا! فها أنا أبشركم بفرح عظيم يعم الشعب كله:"]]}, {"l": "Luk 2:11", "n": "", "vs": [[11, "فقد ولد لكم اليوم في مدينة داود مخلص هو المسيح الرب."]]}, {"l": "Luk 8:10", "n": "", "vs": [[10, "فقال: «لكم قد أعطي أن تعرفوا أسرار ملكوت الله. أما الآخرون، فأكلمهم بأمثال، حتى إنهم: ينظرون ولا يبصرون، ويسمعون ولا يفهمون."]]}, {"l": "1Co 4:1", "n": "", "vs": [[1, "فلينظر إلينا الناس باعتبارنا خداما للمسيح ووكلاء على أسرار الله."]]}, {"l": "Col 2:2", "n": "", "vs": [[2, "
