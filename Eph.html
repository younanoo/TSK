: [[49, "لهذا السبب أيضا قالت حكمة الله: سأرسل إليهم أنبياء ورسلا، فيقتلون منهم ويضطهدون،"]]}, {"l": "1Co 12:28", "n": "", "vs": [[28, "وقد رتب الله في الكنيسة أشخاصا مخصوصين: أولا الرسل، ثانيا الأنبياء، ثالثا المعلمين، وبعد ذلك أصحاب المواهب المعجزية أو مواهب الشفاء أو إعانة الآخرين أو تدبير الشؤون أو التكلم باللغات المختلفة."]]}, {"l": "1Co 12:29", "n": "", "vs": [[29, "فهل هم جميعا رسل؟ أجميعهم أنبياء؟ أجميعهم معلمون؟ أجميعهم حائزون على مواهب معجزية؟"]]}, {"l": "2Pe 3:2", "n": "", "vs": [[2, "وغايتي أن تتذكروا الأقوال التي أعلنها الأنبيا ء القديسون قديما، وكذلك وصية الرب والمخلص، تلك الوصية التي نقلها إليكم الرسل."]]}, {"l": "Jud 1:17", "n": "", "vs": [[17, "أما أنتم أيها الأحباء، فاذكروا دائما ما قاله رسل ربنا يسوع المسيح."]]}], "kwAr": "مثلما أعلن الآن", "noteAr": ""}, {"kw": "by", "raw": "Luk_2:26, Luk_2:27; Joh_14:26, Joh_16:13; Act_10:19, Act_10:20,Act_10:28; 1Co_12:8-10", "note": "", "refs": [{"l": "Luk 2:26", "n": "", "vs": [[26, "وكان الروح القدس قد أوحى إليه أنه لا يرى الموت قبل أن يرى مسيح الرب،"]]}, {"l": "Luk 2:27", "n": "", "vs": [[27, "وقد جاء إلى الهيكل بدافع من الروح. فلما أحضر الأبوان الطفل يسوع ليقدما عنه ما سن في الشريعة،"]]}, {"l": "Joh 14:26", "n": "", "vs": [[26, "وأما الروح القدس، المعين الذي سيرسله الآب باسمي، فإنه يعلمكم كل شيء، ويذكركم بكل ما قلته لكم."]]}, {"l": "Joh 16:13", "n": "", "vs": [[13, "ولكن، عندما يأتيكم روح الحق يرشدكم إلى الحق كله، لأنه لا يقول شيئا من عنده، بل يخبركم بما يسمعه، ويطلعكم على ما سوف يحدث."]]}, {"l": "Act 10:19", "n": "", "vs": [[19, "في هذه الأثناء كان بطرس يواصل التفكير في معنى الرؤيا، فقال له الروح: «بالباب ثلاثة رجال يطلبونك"]]}, {"l": "Act 10:20", "n": "", "vs": [[20, "فانزل إليهم ورافقهم بلا تردد، فإني أنا أرسلتهم»."]]}, {"l": "Act 10:28", "n": "", "vs": [[28, "فقال لهم: «أنتم تعلمون أنه محرم على اليهودي أن يتعامل مع الأجنبي أو يزوره في بيته. غير أن الله أراني ألا أقول عن إنسان ما إنه دنس أو نجس."]]}, {"l": "1Co 12:8-10", "n": "", "vs": [[8, "فواحد يوهب، عن طريق الروح، كلام الحكمة، وآخر كلام المعرفة وفقا للروح نفسه،"], [9, "وآخر إيمانا بالروح نفسه. ويوهب آخر موهبة شفاء الأمراض بالروح الواحد،"], [10, "وآخر عمل المعجزات، وآخر النبوءة وآخر التمييز بين الأرواح، وآخر التكلم بلغات مختلفة (لم يتعلمها)، وآخر ترجمة اللغات تلك."]]}], "kwAr": "بوحي الروح", "noteAr": ""}], "arS": [["ذلك السر الذي لم ", []], ["يطلع", ["G1107"]], [" عليه ", []], ["بنو", ["G5207"]], [" ", []], ["البشر", ["G444"]], [" في ", []], ["الأجيال", ["G1074"]], [" ", []], ["الماضية", ["G2087"]], [" مثلما ", []], ["أعلن", ["G601"]], [" ", []], ["الآن", ["G3568"]], [" بوحي ", []], ["الروح", ["G4151"]], [" ", []], ["لرسله", ["G652"]], [" ", []], ["القديسين", ["G40"]], [" ", []], ["وأنبيائه", ["G4396"]], [":", []]]}, {"c": 3, "v": 6, "text": "وهو أن الأمم هم شركاء اليهود في الميراث، وأعضاء في الجسد معهم، ولهم أيضا حق الاستفادة من الوعد. وذلك في المسيح يسوع وبفضل الإنجيل", "groups": [{"kw": "the Gentiles", "raw": "Eph_2:13-22; Rom_8:15-17; Gal_3:26-29, Gal_4:5-7", "note": "", "refs": [{"l": "Eph 2:13-22", "n": "", "vs": [[13, "أما الآن، ففي المسيح يسوع، أنتم الذين كنتم من قبل بعيدين قد صرتم قريبين بدم المسيح."], [14, "فإنه هو سلامنا، ذاك الذي جعل الفريقين واحدا وهدم حائط الحاجز الفاصل بينهما،"], [15, "أي العداء: إذ أبطل بجسده شريعة الوصايا ذات الفرائض، لكي يكون من الفريقين إنسانا واحدا جديدا، إذ أحل السلام بينهما،"], [16, "ولكي يصالحهما معا في جسد واحد مع الله بالصليب الذي به قتل العداء."], [17, "ثم جاء وبشركم بالسلام أنتم البعيدين، (كما بشر بالسلام) أولئك القريبين."], [18, "فبه لنا كلينا اقتراب إلى الآب بروح واحد."], [19, "إذن، لستم غرباء وأجانب بعد الآن، بل أنتم رعية مع القديسين وأعضاء في عائلة الله،"], [20, "وقد بنيتم على أساس الرسل والأنبياء، والمسيح يسوع نفسه هو حجر الزاوية الأساس،"], [21, "الذي فيه يتناسق البناء كله فيرتفع ليصير هيكلا مقدسا في الرب."], [22, "وفيه أنتم أيضا قد بنيتم معا فصرتم مسكنا لله بوجود الروح."]]}, {"l": "Rom 8:15-17", "n": "", "vs": [[15, "إذ إنكم لم تنالوا روح عبودية يعيدكم إلى الخوف، بل نلتم روح بنوة به نصرخ: «أبا! أبانا!»"], [16, "فالروح نفسه يشهد مع أرواحنا بأننا أولاد الله."], [17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}, {"l": "Gal 3:26-29", "n": "", "vs": [[26, "فإنكم جميعا أبناء الله بالإيمان بالمسيح يسوع."], [27, "لأنكم، جميع الذين تعمدتم في المسيح، قد لبستم المسيح."], [28, "لا فرق بعد الآن بين يهودي ويوناني، أو عبد وحر، أو ذكر وأنثى، لأنكم جميعا واحد في المسيح يسوع."], [29, "فإذا كنتم للمسيح، فأنتم إذن نسل إبراهيم وحسب الوعد وارثون."]]}, {"l": "Gal 4:5-7", "n": "", "vs": [[5, "ليحرر بالفداء أولئك الخاضعين للشريعة، فننال جميعا مقام أبناء الله."], [6, "وبما أنكم أبناء له، أرسل الله إلى قلوبنا روح ابنه، مناديا: «أبا، ياأبانا»."], [7, "إذن، أنت لست عبدا بعد الآن، بل أنت ابن. ومادمت ابنا، فقد جعلك الله وريثا أيضا."]]}], "kwAr": "أن الأمم هم شركاء", "noteAr": ""}, {"kw": "the same", "raw": "Eph_4:15, Eph_4:16, Eph_5:30; Rom_12:4, Rom_12:5; 1Co_12:12, 1Co_12:27; Col_2:19", "note": "", "refs": [{"l": "Eph 4:15", "n": "", "vs": [[15, "بل نتمسك بالحق في المحبة، فننمو في كل شيء نحو من هو الرأس، أي المسيح."]]}, {"l": "Eph 4:16", "n": "", "vs": [[16, "فمنه يستمد الجسد كله تماسكه وترابطه بمساندة كل مفصل وفقا لمقدار العمل المخصص لكل جزء، لينشيء نموا يؤول إلى بنيان الجسد بنيانا ذاتيا في المحبة."]]}, {"l": "Eph 5:30", "n": "", "vs": [[30, "فإننا نحن أعضاء جسده."]]}, {"l": "Rom 12:4", "n": "", "vs": [[4, "فكما أن لنا في جسد واحد أعضاء كثيرة، ولكن ليس لجميع هذه الأعضاء عمل واحد،"]]}, {"l": "Rom 12:5", "n": "", "vs": [[5, "فكذلك نحن الكثيرين جسد واحد في المسيح، وكلنا أعضاء بعضنا لبعض."]]}, {"l": "1Co 12:12", "n": "", "vs": [[12, "فكما أن الجسد واحد وله أعضاء كثيرة، ولكن أعضاء الجسد كلها تشكل جسما واحدا مع أنها كثيرة، فكذلك حال المسيح أيضا."]]}, {"l": "1Co 12:27", "n": "", "vs": [[27, "فالواقع أنكم أنتم جميعا جسد المسيح، وأعضاء فيه كل بمفرده."]]}, {"l": "Col 2:19", "n": "", "vs": [[19, "وهو غير ممسك بالرأس الذي منه يتلقى الجسد كله غذاءه وتماسكه بالمفاصل والأوصال، فينمو النمو الذي يمنحه الله ."]]}], "kwAr": "أعضاء في الجسد", "noteAr": ""}, {"kw": "partakers", "raw": "Gal_3:14; 1Jo_1:3, 1Jo_2:25", "note": "", "refs": [{"l": "Gal 3:14", "n": "", "vs": [[14, "لكي تصل بركة إبراهيم إلى الأمم في المسيح يسوع، فننال عن طريق الإيمان الروح الموعود."]]}, {"l": "1Jo 1:3", "n": "", "vs": [[3, "فنحن، إذن، نخبركم بما رأيناه وسمعناه، لكي تكونوا شركاءنا. كما أن شركتنا هي مع الآب ومع ابنه يسوع المسيح."]]}, {"l": "1Jo 2:25", "n": "", "vs": [[25, "فإن الله نفسه قد وعدنا بالحياة الأبدية."]]}], "kwAr": "حق الاستفادة من الوعد", "noteAr": ""}], "arS": [["وهو أن ", []], ["الأمم", ["G1484"]], [" هم ", []], ["شركاء اليهود في الميراث", ["G4789"]], ["، ", []], ["وأعضاء في الجسد معهم", ["G4954"]], ["، ولهم أيضا حق ", []], ["الاستفادة", ["G4830"]], [" من ", []], ["الوعد", ["G1860"]], [". وذلك في ", []], ["المسيح", ["G5547"]], [" يسوع وبفضل ", []], ["الإنجيل", ["G2098"]]]}, {"c": 3, "v": 7, "text": "الذي صرت أنا خادما له بحسب نعمة الله الموهوبة لي وفقا لعمل قدرته.", "groups": [{"kw": "I", "raw": "Eph_3:2; Rom_15:16; 2Co_3:6, 2Co_4:1; Col_1:23-25", "note": "", "refs": [{"l": "Eph 3:2", "n": "", "vs": [[2, "على اعتبار أنكم قد سمعتم بتدبير نعمة الله الموهوبة لي لأجلكم:"]]}, {"l": "Rom 15:16", "n": "", "vs": [[16, "وبذلك أكون خادم المسيح يسوع، المرسل إلى الأمم، حاملا إنجيل الله وكأني أقوم بخدمة كهنوتية، بقصد أن ترفع لله من بين الأمم تقدمة تكون مقبولة ومقدسة بالروح القدس."]]}, {"l": "2Co 3:6", "n": "", "vs": [[6, "الذي جعلنا أصحاب كفاءة لنكون خداما لعهد جديد قائم لا على الحرف بل على الروح. فالحرف يؤدي إلى الموت؛ أما الروح فيعطي الحياة."]]}, {"l": "2Co 4:1", "n": "", "vs": [[1, "فما دامت لنا إذن هذه الخدمة برحمة من الله، فلا تخور عزيمتنا."]]}, {"l": "Col 1:23-25", "n": "", "vs": [[23, "على أن تثبتوا فعلا في الإيمان، مؤسسين وراسخين وغير متحولين عن رجاء الإنجيل الذي سمعتموه والذي بشر به للخليقة كلها تحت السماء، وله صرت أنا بولس خادما."], [24, "والآن أنا أفرح في الآلام التي أقاسيها لأجلكم، وأتمم في جسدي ما نقص من ضيقات المسيح لأجل جسده الذي هو الكنيسة،"], [25, "ولها قد صرت أنا خادما بموجب تدبير الله الموهوب لي من أجلكم، وهو أن أتمم كلمة الله، بإعلان"]]}], "kwAr": "صرت أنا خادما", "noteAr": ""}, {"kw": "according", "raw": "Eph_3:8; Rom_1:5; 1Co_15:10; 1Ti_1:14, 1Ti_1:15", "note": "", "refs": [{"l": "Eph 3:8", "n": "", "vs": [[8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "Rom 1:5", "n": "", "vs": [[5, "الذي به ولأجل اسمه نلنا نعمة ورسالة لإطاعة الإيمان بين جميع الأمم،"]]}, {"l": "1Co 15:10", "n": "", "vs": [[10, "ولكن، بنعمة الله صرت على ما أنا عليه الآن، ونعمته الموهوبة لي لم تكن عبثا، إذ عملت جاهدا أكثر من الرسل الآخرين جميعا. إلا أني لم أكن أنا العامل، بل نعمة الله التي كانت معي."]]}, {"l": "1Ti 1:14", "n": "", "vs": [[14, "إلا أن نعمة ربنا قد فاضت علي فوق كل حد، ومعها الإيمان والمحبة، وذلك في المسيح يسوع."]]}, {"l": "1Ti 1:15", "n": "", "vs": [[15, "ما أصدق هذا القول، وما أجدره بالتصديق الكلي: إن المسيح يسوع قد جاء إلى العالم ليخلص الخاطئين، وأنا أولهم!"]]}], "kwAr": "بحسب نعمة الله", "noteAr": ""}, {"kw": "by", "raw": "Eph_3:20, Eph_1:19, Eph_4:16; Isa_43:13; Rom_15:18, Rom_15:19; 2Co_10:4, 2Co_10:5; Gal_2:8; Col_1:29; 1Th_2:13; Heb_13:21", "note": "", "refs": [{"l": "Eph 3:20", "n": "", "vs": [[20, "والقادر أن يفعل، وفقا للقدرة العاملة فينا، ما يفوق بلا حصر كل ما نطلب أو نتصور،"]]}, {"l": "Eph 1:19", "n": "", "vs": [[19, "وما هي عظمة قدرته الفائقة المعلنة لنا نحن المؤمنين، بحسب عمل اقتدار قوته"]]}, {"l": "Eph 4:16", "n": "", "vs": [[16, "فمنه يستمد الجسد كله تماسكه وترابطه بمساندة كل مفصل وفقا لمقدار العمل المخصص لكل جزء، لينشيء نموا يؤول إلى بنيان الجسد بنيانا ذاتيا في المحبة."]]}, {"l": "Isa 43:13", "n": "", "vs": [[13, "منذ البدء أنا هو الله وليس منقذ من يدي. أفعل ومن يبطل عملي؟"]]}, {"l": "Rom 15:18", "n": "", "vs": [[18, "فما كنت لأتجاسر أن أتكلم بشيء إلا على ما عمله المسيح على يدي لهداية الأمم إلى الطاعة، بالقول والفعل،"]]}, {"l": "Rom 15:19", "n": "", "vs": [[19, "وبقوة الآيات والعجائب، وبقوة روح الله. حتى إنني، من أورشليم وما حولها حتى مقاطعة إليريكون، قد أكملت التبشير بإنجيل المسيح."]]}, {"l": "2Co 10:4", "n": "", "vs": [[4, "فإن الأسلحة التي نحارب بها ليست جسدية، بل قادرة بالله على هدم الحصون: بها نهدم النظريات"]]}, {"l": "2Co 10:5", "n": "", "vs": [[5, "وكل ما يعلو مرتفعا لمقاومة معرفة الله، ونأسر كل فكر إلى طاعة المسيح."]]}, {"l": "Gal 2:8", "n": "", "vs": [[8, "لأن الذي استخدم بطرس في رسوليته إلى أهل الختان، استخدمني أيضا بالنسبة إلى الأمم."]]}, {"l": "Col 1:29", "n": "", "vs": [[29, "ولأجل هذا أتعب أنا أيضا وأجاهد، بفضل قدرته العاملة في بقوة."]]}, {"l": "1Th 2:13", "n": "", "vs": [[13, "ولذلك نحن أيضا نرفع الشكر لله بلا توقف، لأنكم لما تلقيتم منا كلمة البشارة من الله، قبلتموها لا كأنها كلمة بشر، بل كما هي في الحقيقة: باعتبارها كلمة الله العاملة أيضا فيكم أنتم المؤمنين."]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}], "kwAr": "وفقا لعمل قدرته", "noteAr": ""}], "arS": [["الذي ", []], ["صرت", ["G1096"]], [" أنا ", []], ["خادما", ["G1249"]], [" له ", []], ["بحسب", ["G2596"]], [" ", []], ["نعمة", ["G5485"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["الموهوبة", ["G1325"]], [" لي وفقا ", []], ["لعمل", ["G1753"]], [" ", []], ["قدرته", ["G1411"]], [".", []]]}, {"c": 3, "v": 8, "text": "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،", "groups": [{"kw": "who am", "raw": "Pro_30:2, Pro_30:3; Rom_12:10; 1Co_15:9; Phi_2:3; 1Ti_1:13, 1Ti_1:15; 1Pe_5:5, 1Pe_5:6", "note": "", "refs": [{"l": "Pro 30:2", "n": "", "vs": [[2, "إنني أكثر الناس بلادة، وليس لي فهم إنسان."]]}, {"l": "Pro 30:3", "n": "", "vs": [[3, "لم أتلقن الحكمة، ولا أملك معرفة القدوس."]]}, {"l": "Rom 12:10", "n": "", "vs": [[10, "أحبوا بعضكم بعضا محبة أخوية، مفضلين بعضكم على بعض في الكرامة."]]}, {"l": "1Co 15:9", "n": "", "vs": [[9, "فإني أنا أصغر الرسل شأنا، ولست أهلا لأن أدعى رسولا لأني اضطهدت كنيسة الله."]]}, {"l": "Phi 2:3", "n": "", "vs": [[3, "لا يكن بينكم شيء بروح التحزب والافتخار الباطل، بل بالتواضع ليعتبر كل واحد منكم غيره أفضل كثيرا من نفسه،"]]}, {"l": "1Ti 1:13", "n": "", "vs": [[13, "مع أني كنت في الماضي مجدفا عليه، ومضطهدا ومهينا له! ولكني عوملت بالرحمة، لأني عملت ما عملته عن جهل وفي عدم إيمان."]]}, {"l": "1Ti 1:15", "n": "", "vs": [[15, "ما أصدق هذا القول، وما أجدره بالتصديق الكلي: إن المسيح يسوع قد جاء إلى العالم ليخلص الخاطئين، وأنا أولهم!"]]}, {"l": "1Pe 5:5", "n": "", "vs": [[5, "كذلك، أيها الشباب، اخضعوا للشيوخ. البسوا جميعا ثوب التواضع في معاملتكم بعضكم لبعض. لأن الله يقاوم المتكبرين، ولكنه يعطي المتواضعين نعمة."]]}, {"l": "1Pe 5:6", "n": "", "vs": [[6, "إذن، تواضعوا تحت يد الله القديرة لكي يرفعكم عندما يحين الوقت،"]]}], "kwAr": "أنا الأصغر من أصغر القديسين", "noteAr": ""}, {"kw": "is this", "raw": "1Ch_17:16, 1Ch_29:14, 1Ch_29:15; Act_5:41; Rom_15:15-17", "note": "", "refs": [{"l": "1Ch 17:16", "n": "", "vs": [[16, "فمثل الملك داود أمام الرب وقال: «من أنا أيها الرب الإله، وما هي مكانة عائلتي، حتى رفعتني إلى هذا المستوى؟"]]}, {"l": "1Ch 29:14", "n": "", "vs": [[14, "ولكن من أنا، ومن هو شعبي حتى نقدر أن نتبرع بسخاء وعن رضى؟ لأن منك الجميع ومن يدك نقدم لك."]]}, {"l": "1Ch 29:15", "n": "", "vs": [[15, "فنحن مثل آبائنا، غرباء ونزلاء أمامك، وأيامنا كالظل على الأرض، خالية من الرجاء."]]}, {"l": "Act 5:41", "n": "", "vs": [[41, "ولكن الرسل خرجوا من المجلس فرحين، لأنهم اعتبروا أهلا لأن يلقوا الإهانة من أجل اسم يسوع."]]}, {"l": "Rom 15:15-17", "n": "", "vs": [[15, "على أني كتبت إليكم بأوفر جرأة في بعض الأمور، مذكرا لكم، وذلك بالنعمة التي وهبها الله لي."], [16, "وبذلك أكون خادم المسيح يسوع، المرسل إلى الأمم، حاملا إنجيل الله وكأني أقوم بخدمة كهنوتية، بقصد أن ترفع لله من بين الأمم تقدمة تكون مقبولة ومقدسة بالروح القدس."], [17, "يحق لي إذن أن أفتخر في المسيح يسوع بما يعود لله من خدمتي."]]}], "kwAr": "وهبت هذه النعمة", "noteAr": ""}, {"kw": "I", "raw": "Eph_3:2; Gal_1:16, Gal_2:8; 1Ti_2:7; 2Ti_1:11", "note": "", "refs": [{"l": "Eph 3:2", "n": "", "vs": [[2, "على اعتبار أنكم قد سمعتم بتدبير نعمة الله الموهوبة لي لأجلكم:"]]}, {"l": "Gal 1:16", "n": "", "vs": [[16, "أن يعلن ابنه في لأبشر به بين الأمم، في الح  إنه المسيح فيكم، وهو رجاء المجد؛"]]}, {"l": "Col 2:1-3", "n": "", "vs": [[1, "فإني أريد أن تعلموا مقدار جهادي لأجلكم ولأجل الذين في مدينة لاودكية، ولأجل جميع الذين لا يعرفونني بالوجه،"], [2, "بغرض أن تتشجع قلوبهم وتكون كلها متحدة في المحبة، لبلوغ الإدراك التام بكل غناه، لمعرفة سر الله، أي المسيح،"], [3, "المخزونة فيه كنوز الحكمة والمعرفة كلها."]]}, {"l": "Rev 3:18", "n": "", "vs": [[18, "نصيحتي لك أن تشتري مني ذهبا نقيا، صفته النار، فتغتني حقا، وثيابا بيضاء ترتديها فتستر عريك المعيب، وكحلا لشفاء عينيك فيعود إليك البصر."]]}], "kwAr": "غنى المسيح الذي لا يحد", "noteAr": ""}], "arS": [["فلي، أنا ", []], ["الأصغر من أصغر", ["G1647"]], [" ", []], ["القديسين", ["G40"]], [" ", []], ["جميعا", ["G3956"]], ["، ", []], ["وهبت", ["G1325"]], [" هذه ", []], ["النعمة", ["G5485"]], [": أن ", []], ["أذيع", ["G2097"]], [" بين ", []], ["الأمم", ["G1484"]], [" بشارة ", []], ["غنى", ["G4149"]], [" ", []], ["المسيح", ["G5547"]], [" الذي ", []], ["لا يحد", ["G421"]], ["،", []]]}, {"c": 3, "v": 9, "text": "وأنير الجميع بمعرفة ما هو تدبير السر الذي أبقاه الله ، خالق كل شيء، مكتوما مدى الأجيال.", "groups": [{"kw": "to", "raw": "Mat_10:27, Mat_28:19; Mar_16:15, Mar_16:16; Luk_24:47; Rom_16:26; Col_1:23; 2Ti_4:17; Rev_14:6", "note": "", "refs": [{"l": "Mat 10:27", "n": "", "vs": [[27, "ما أقوله لكم في الظلام، قولوه في النور؛ وما تسمعونه همسا، نادوا به على السطوح."]]}, {"l": "Mat 28:19", "n": "", "vs": [[19, "فاذهبوا إذن، وتلمذوا جميع الأمم، وعمدوهم باسم الآب والابن والروح القدس؛"]]}, {"l": "Mar 16:15", "n": "", "vs": [[15, "وقال لهم: «اذهبوا إلى العالم أجمع، وبشروا الخليقة كلها بالإنجيل:"]]}, {"l": "Mar 16:16", "n": "", "vs": [[16, "من آمن وتعمد، خلص، ومن لم يؤمن فسوف يدان."]]}, {"l": "Luk 24:47", "n": "", "vs": [[47, "وأن يبشر باسمه بالتوبة وغفران الخطايا في جميع الأمم انطلاقا من أورشليم."]]}, {"l": "Rom 16:26", "n": "", "vs": [[26, "ولكن أذيع الآن، بأمر الله الأزلي في الكتابات النبوية، على جميع الأمم لأجل إطاعة الإيمان؛"]]}, {"l": "Col 1:23", "n": "", "vs": [[23, "على أن تثبتوا فعلا في الإيمان، مؤسسين وراسخين وغير متحولين عن رجاء الإنجيل الذي سمعتموه والذي بشر به للخليقة كلها تحت السماء، وله صرت أنا بولس خادما."]]}, {"l": "2Ti 4:17", "n": "", "vs": [[17, "إلا أن الرب وقف بجانبي وأمدني بالقوة، لكي تتم بي المناداة بالبشارة، فيسمعها جميع من هم من الأمم؛ وقد نجوت من فم الأسد."]]}, {"l": "Rev 14:6", "n": "", "vs": [[6, "ثم رأيت ملاكا آخر يطير في وسط السماء، معه بشارة أبدية يبشر بها أهل الأرض وكل أمة وقبيلة ولغة وشعب،"]]}], "kwAr": "وأنير الجميع", "noteAr": ""}, {"kw": "fellowship", "raw": "Eph_3:3-5, Eph_1:9, Eph_1:10; 1Ti_3:16", "note": "", "refs": [{"l": "Eph 3:3-5", "n": "", "vs": [[3, "كيف كشف لي السر عن طريق الوحي، كما كتبت قبلا بإيجاز،"], [4, "ويمكنكم، حينما تقرأون ما كتبته، أن تدركوا اطلاعي العميق على سر المسيح،"], [5, "ذلك السر الذي لم يطلع عليه بنو البشر في الأجيال الماضية مثلما أعلن الآن بوحي الروح لرسله القديسين وأنبيائه:"]]}, {"l": "Eph 1:9", "n": "", "vs": [[9, "إذ كشف لنا سر مشيئته بحسب مرضاته التي قصدها في نفسه،"]]}, {"l": "Eph 1:10", "n": "", "vs": [[10, "لأجل تدبير تمام الأزمنة، حين يوحد كل شيء تحت رئاسة المسيح، سواء الأشياء التي في السماوات والتي على الأرض."]]}, {"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}], "kwAr": "تدبير السر", "noteAr": ""}, {"kw": "beginning", "raw": "Eph_1:4; Mat_13:35, Mat_25:34; Act_15:18; Rom_16:25; 1Co_2:7; 2Th_2:13; 2Ti_1:9; Tit_1:2; 1Pe_1:20; Rev_13:8, Rev_17:8", "note": "", "refs": [{"l": "Eph 1:4", "n": "", "vs": [[4, "كما كان قد اختارنا فيه قبل تأسيس العالم، لنكون قديسين بلا لوم أمامه."]]}, {"l": "Mat 13:35", "n": "", "vs": [[35, "ليتم ما قيل بلسان النبي القائل: «سأفتح فمي بأمثال، وأكشف ما كان مخفيا منذ إنشاء العالم»."]]}, {"l": "Mat 25:34", "n": "", "vs": [[34, "ثم يقول الملك للذين عن يمينه: تعالوا يامن باركهم أبي، رثوا الملكوت الذي أعد لكم منذ إنشاء العالم:"]]}, {"l": "Act 15:18", "n": "", "vs": [[18, "المعروفة لديه منذ الأزل."]]}, {"l": "Rom 16:25", "n": "", "vs": [[25, "والمجد للقادر أن يثبتكم، وفقا لإنجيلي وللبشارة بيسوع المسيح، ووفقا لإعلان ما كان سرا ظل مكتوما مدى الأزمنة الأزلية،"]]}, {"l": "1Co 2:7", "n": "", "vs": [[7, "بل إننا نتكلم بحكمة الله المطوية في سر، تلك الحكمة المحجوبة التي سبق الله فأعدها قبل الدهور لأجل مجدنا"]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،"]]}, {"l": "Tit 1:2", "n": "", "vs": [[2, "في رجاء الحياة الأبدية، التي وعد بها الله المنزه عن الكذب، من قبل أزمنة الأزل،"]]}, {"l": "1Pe 1:20", "n": "", "vs": [[20, "ومع أن الله كان قد عين المسيح لهذا الغرض قبل تأسيس العالم، فهو لم يعلنه إلا في هذا الزمن الأخير لفائدتكم"]]}, {"l": "Rev 13:8", "n": "", "vs": [[8, "فيسجد للوحش جميع سكان الأرض الذين لم تكتب أسماؤهم منذ تأسيس العالم في سجل الحياة للحمل الذي ذبح."]]}, {"l": "Rev 17:8", "n": "", "vs": [[8, "هذا الوحش كان موجودا، وهو غير موجود الآن، ولكنه على وشك أن يطلع من الهاوية ويمضي إلى الهلاك. وسيدهش سكان الأرض الذين لم تكتب أسماؤهم منذ تأسيس العالم في سجل الحياة، عندما يرون الوحش، لأنه كان موجودا، ثم أصبح غير موجود، وسيعود!"]]}], "kwAr": "مدى الأجيال", "noteAr": ""}, {"kw": "hid", "raw": "Col_1:26, Col_3:3", "note": "", "refs": [{"l": "Col 1:26", "n": "", "vs": [[26, "السر الذي كان مكتوما طوال العصور والأجيال، ولكن كشف الآن لقديسيه،"]]}, {"l": "Col 3:3", "n": "", "vs": [[3, "فإنكم قد متم، وحياتكم مستورة مع المسيح في الله."]]}], "kwAr": "مكتوما", "noteAr": ""}, {"kw": "created", "raw": "Psa_33:6; Isa_44:24; Joh_1:1-3, Joh_5:17, Joh_5:19, Joh_10:30; Col_1:16, Col_1:17; Heb_1:2, Heb_1:3, Heb_3:3, Heb_3:4", "note": "", "refs": [{"l": "Psa 33:6", "n": "", "vs": [[6, "بكلمة من الرب صنعت السماوات وبنسمة فمه كل مجموعات الكواكب."]]}, {"l": "Isa 44:24", "n": "", "vs": [[24, "هذا ما يقوله الرب فاديك وجابلك من الرحم: «أنا هو الرب صانع كل الأشياء، الذي نشر السماوات وحده، وبسط الأرض بنفسه. من كان معي حينذاك؟"]]}, {"l": "Joh 1:1-3", "n": "", "vs": [[1, "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."], [2, "هو كان في البدء عند الله."], [3, "به تكون كل شيء، وبغيره لم يتكون أي شيء مما تكون."]]}, {"l": "Joh 5:17", "n": "", "vs": [[17, "ولكن يسوع قال لهم: «ما زال أبي يعمل إلى الآن. وأنا أيضا أعمل!»"]]}, {"l": "Joh 5:19", "n": "", "vs": [[19, "فقال لهم يسوع: «الحق الحق أقول لكم إن الابن لا يقدر أن يفعل شيئا من تلقاء نفسه، بل يفعل ما يرى الآب يفعله. فكل ما يعمله الآب، يعمله الابن كذلك،"]]}, {"l": "Joh 10:30", "n": "", "vs": [[30, "أنا والآب واحد!»"]]}, {"l": "Col 1:16", "n": "", "vs": [[16, "إذ به خلقت جميع الأشياء: ما في السماوات وما على الأرض، ما يرى وما لا يرى، أعروشا كانت أم سيادات أم رئاسات أم سلطات. كل ما في الكون قد خلق به ولأجله."]]}, {"l": "Col 1:17", "n": "", "vs": [[17, "هو كائن قبل كل شيء، وبه يدوم كل شيء."]]}, {"l": "Heb 1:2", "n": "", "vs": [[2, "أما الآن، في هذا الزمن الأخير، فقد كلمنا بالابن، الذي جعله وارثا لكل شيء، وبه قد خلق الكون كله!"]]}, {"l": "Heb 1:3", "n": "", "vs": [[3, "إنه ضياء مجد الله وصورة جوهره. حافظ كل ما في الكون بكلمته القديرة. وهو الذي بعدما طهرنا بنفسه من خطايانا،"]]}, {"l": "Heb 3:3", "n": "", "vs": [[3, "إلا أنه يستحق مجدا أعظم من مجد موسى، كما أن الذي يبني بيتا ينال إكراما ومدحا أكثر مما ينال البيت الذي بناه!"]]}, {"l": "Heb 3:4", "n": "", "vs": [[4, "طبعا، كل بيت لابد أن يكون له بان، والله نفسه هو باني كل شيء."]]}], "kwAr": "خالق كل شيء", "noteAr": ""}], "arS": [["وأنير", ["G5461"]], [" ", []], ["الجميع", ["G3956"]], [" بمعرفة ما هو ", []], ["تدبير", ["G2842"]], [" ", []], ["السر", ["G3466"]], [" الذي أبقاه ", []], ["الله", ["G2316"]], [" ، ", []], ["خالق", ["G2936"]], [" ", []], ["كل شيء", ["G3956"]], ["، ", []], ["مكتوما", ["G613"]], [" مدى ", []], ["الأجيال", ["G165"]], [".", []]]}, {"c": 3, "v": 10, "text": "والغاية أن يتجلى الآن أمام الرئاسات والسلطات في الأماكن السماوية ما يظهر في الكنيسة من حكمة الله المتعددة الوجوه،", "groups": [{"kw": "intent", "raw": "Exo_25:17-22; Psa_103:20, Psa_148:1, Psa_148:2; Isa_6:2-4; Eze_3:12; 1Pe_1:12; Rev_5:9-14", "note": "", "refs": [{"l": "Exo 25:17-22", "n": "", "vs": [[17, "وتصنع غطاء من ذهب خالص، هو كرسي الرحمة، طوله ذراعان ونصف (نحو متر وربع المتر) وعرضه ذراع ونصف (نحو خمسة وسبعين سنتيمترا)"], [18, "وتخرط كروبين (تمثالي ملاكين) من ذهب وتقيمهما على طرفي الغطاء."], [19, "فتصنع كروبا واحدا على كل طرف من الغطاء، مخروطين من الغطاء نفسه، وقائمين على طرفيه."], [20, "ويكون الكروبان متواجهين أيضا، باسطين أجنحتهما إلى فوق، يظللان بهما الغطاء، ويتجهان بوجهيهما نحوه."], [21, "وتضع الغطاء فوق التابوت الذي تحتفظ بداخله بلوحي الشهادة التي أعطيك."], [22, "وهناك أجتمع بك وأكلمك بكل ما أوصيك به لتبلغه لبني إسرائيل من على الغطاء، ما بين الكروبين اللذين يعلوان تابوت الشهادة."]]}, {"l": "Psa 103:20", "n": "", "vs": [[20, "باركوا الرب ياملائكته المقتدرين قوة، الفاعلين أمره فور صدور كلمته."]]}, {"l": "Psa 148:1", "n": "", "vs": [[1, "هللويا! سبحوا الرب من السماوات. سبحوه في الأعالي."]]}, {"l": "Psa 148:2", "n": "", "vs": [[2, "سبحوه ياجميع ملائكته. سبحوه ياجميع أجناده."]]}, {"l": "Isa 6:2-4", "n": "", "vs": [[2, "وأحاط به ملائكة السرافيم، لكل واحد منهم ستة أجنحة، أخفى وجهه بجناحين، وغطى قدميه بجناحين، ويطير بالجناحين الباقيين."], [3, "ونادى أحدهم الآخر: «قدوس، قدوس، قدوس الرب القدير. مجده ملء كل الأرض»."], [4, "فاهتزت أسس أركان الهيكل من صوت المنادي، وامتلأ الهيكل بالدخان."]]}, {"l": "Eze 3:12", "n": "", "vs": [[12, "ثم حملني الروح، فسمعت خلفي صوت زلزلة عنيفة قائلا: «مبارك مجد الرب من مكانه»."]]}, {"l": "1Pe 1:12", "n": "", "vs": [[12, "ولكن الله أوحى إليهم أن اجتهادهم لم يكن لمصلحتهم هم، بل لمصلحتكم أنتم. فقد كان ذلك من أجل البشارة التي نقلها إليكم في الزمان الحاضر مبشرون يؤيدهم الروح القدس المرسل من السماء. ويالها من أمور يتمنى حتى الملائكة أن يطلعوا عليها!"]]}, {"l": "Rev 5:9-14", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"], [10, "وجعلتهم مملكة لإلهنا وكهنة له، وسيملكون على الأرض»."], [11, "ثم نظرت، فسمعت ترتيل الملايين من الملائكة وهي تحيط بالعرش وبالكائنات الحية والشيوخ،"], [12, "وهم يهتفون بصوت عال: «مستحق هو الحمل المذبوح أن ينال القدرة والغنى والحكمة والقوة والإجلال والمجد والبركة»."], [13, "ثم سمعت كل خليقة في السماء وعلى الأرض، وتحت الأرض، وعلى البحر، هاتفة مع كل ما فيها: «البركة والإجلال والمجد والسلطة للجالس على العرش وللحمل، إلى أبد الآبدين»."], [14, "فردت الكائنات الحية الأربعة: «آمين!» وجثا الشيوخ ساجدين."]]}], "kwAr": "والغاية", "noteAr": ""}, {"kw": "principalities", "raw": "Eph_1:21; Rom_8:38; Col_1:16; 1Pe_3:22", "note": "", "refs": [{"l": "Eph 1:21", "n": "", "vs": [[21, "أرفع جدا من كل رئاسة وسلطة وقوة وسيا دة، ومن كل اسم يسمى، لا في هذا العالم وحسب، بل في ذلك الآتي أيضا."]]}, {"l": "Rom 8:38", "n": "", "vs": [[38, "فإني لعلى يقين بأنه لا الموت ولا الحياة، ولا الملائكة ولا الرياسات، ولا الأمور الحاضرة ولا الآتية، ولا القوات،"]]}, {"l": "Col 1:16", "n": "", "vs": [[16, "إذ به خلقت جميع الأشياء: ما في السماوات وما على الأرض، ما يرى وما لا يرى، أعروشا كانت أم سيادات أم رئاسات أم سلطات. كل ما في الكون قد خلق به ولأجله."]]}, {"l": "1Pe 3:22", "n": "", "vs": [[22, "الذي انطلق إلى السماء، وهو الآن جالس عن يمين الله؛ وقد جعلت الملائكة والسلطات والقوات (الروحية) خاضعة له!"]]}], "kwAr": "الرئاسات والسلطات", "noteAr": ""}, {"kw": "in", "raw": "Eph_1:3", "note": "", "refs": [{"l": "Eph 1:3", "n": "", "vs": [[3, "تبارك الله ، أبو ربنا يسوع المسيح الذي باركنا بكل بركة روحية في الأماكن السماوية."]]}], "kwAr": "في الأماكن السماوية", "noteAr": ""}, {"kw": "manifold", "raw": "Eph_1:8; Psa_104:24; Mat_11:25-27; Rom_11:33; 1Co_1:24, 1Co_2:7; 1Ti_3:16; Rev_5:12", "note": "", "refs": [{"l": "Eph 1:8", "n": "", "vs": [[8, "التي جعلها تفيض علينا مصحوبة بكل حكمة وفهم."]]}, {"l": "Psa 104:24", "n": "", "vs": [[24, "يارب ما أعظم أعمالك، كلها صنعت بحكمة، فامتلأت الأرض من غناك."]]}, {"l": "Mat 11:25-27", "n": "", "vs": [[25, "وفي ذلك الوقت، تكلم يسوع فقال: «أحمدك أيها الآب، رب السماء والأرض، لأنك حجبت هذه الأمور عن الحكماء والفهماء، وكشفتها للأطفال!"], [26, "نعم أيها الآب، لأنه هكذا حسن في نظرك."], [27, "كل شيء قد سلمه إلي أبي. ولا أحد يعرف الابن إلا الآب، ولا أحد يعرف الآب إلا الابن، ومن أراد الابن أن يعلنه له."]]}, {"l": "Rom 11:33", "n": "", "vs": [[33, "فما أعمق غنى الله وحكمته وعلمه! ما أبعد أحكامه عن الفحص وطرقه عن التتبع !"]]}, {"l": "1Co 1:24", "n": "", "vs": [[24, "وأما عند المدعوين، سواء من اليهود أو اليونانيين، فإن المسيح هو قدر ة الله وحكمة الله."]]}, {"l": "1Co 2:7", "n": "", "vs": [[7, "بل إننا نتكلم بحكمة الله المطوية في سر، تلك الحكمة المحجوبة التي سبق الله فأعدها قبل الدهور لأجل مجدنا"]]}, {"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}, {"l": "Rev 5:12", "n": "", "vs": [[12, "وهم يهتفون بصوت عال: «مستحق هو الحمل المذبوح أن ينال القدرة والغنى والحكمة والقوة والإجلال والمجد والبركة»."]]}], "kwAr": "حكمة الله المتعددة الوجوه", "noteAr": ""}], "arS": [["والغاية أن ", []], ["يتجلى", ["G1107"]], [" ", []], ["الآن", ["G3568"]], [" أمام ", []], ["الرئاسات", ["G746"]], [" ", []], ["والسلطات", ["G1849"]], [" في الأماكن ", []], ["السماوية", ["G2032"]], [" ما يظهر في ", []], ["الكنيسة", ["G1577"]], [" من ", []], ["حكمة", ["G4678"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["المتعددة الوجوه", ["G4182"]], ["،", []]]}, {"c": 3, "v": 11, "text": "وفقا للقصد الأزلي الذي قصده الله في المسيح يسوع ربنا،", "groups": [{"kw": "", "raw": "Eph_1:4, Eph_1:9, Eph_1:11; Isa_14:24-27, Isa_46:10,Isa_46:11; Jer_51:29; Rom_8:28-30, Rom_9:11; 2Ti_1:9", "note": "", "refs": [{"l": "Eph 1:4", "n": "", "vs": [[4, "كما كان قد اختارنا فيه قبل تأسيس العالم، لنكون قديسين بلا لوم أمامه."]]}, {"l": "Eph 1:9", "n": "", "vs": [[9, "إذ كشف لنا سر مشيئته بحسب مرضاته التي قصدها في نفسه،"]]}, {"l": "Eph 1:11", "n": "", "vs": [[11, "وفي المسيح أيضا قد حصلنا على الميراث الذي سبق أن عينا له، وفقا لقصده، هو الذي يعمل كل شيء كما تقضي مشيئته."]]}, {"l": "Isa 14:24-27", "n": "", "vs": [[24, "لقد أقسم الرب القدير قائلا: «حقا ما عزمت عليه لابد أن يتحقق، وما نويت عليه حتما يتم:"], [25, "أن أحطم أشور في أرضي وأطأه على جبالي، فيلقي عنهم نيره، ويزول عن كاهلهم حمله."], [26, "هذا هو القضاء الذي حكمت به على الأرض كلها، وهذه هي اليد التي امتدت على كل الأمم."], [27, "لأن الرب القدير قد قضى، فمن يبطل قضاءه؟ ويده قد امتدت فمن يردها؟»"]]}, {"l": "Isa 46:10", "n": "", "vs": [[10, "وقد أنبأت بالنهاية منذ البدء، وأخبرت من القدم بأمور لم تكن قد حدثت بعد، قائلا: مقاصدي لابد أن تتم، ومشيئتي لابد أن تتحقق."]]}, {"l": "Isa 46:11", "n": "", "vs": [[11, "أدعو من المشرق الطائر الجارح، ومن الأرض البعيدة رجل مشورتي. قد نطقت بقضائي ولابد أن أجريه، وما رسمته من خطة لابد أن أنفذه."]]}, {"l": "Jer 51:29", "n": "", "vs": [[29, "الأرض ترجف وتقشعر، لأن قضاء الرب على بابل يتم، ليجعل أرض بابل خرابا وقفرا."]]}, {"l": "Rom 8:28-30", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."], [29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."], [30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."]]}, {"l": "Rom 9:11", "n": "", "vs": [[11, "ولم يكن الولدان قد ولدا بعد ولا فعلا خيرا أو شرا، وذلك كي يبقى قصد الله من جهة الاختيار"]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،"]]}], "kwAr": "", "noteAr": ""}], "arS": [["وفقا", ["G2596"]], [" ", []], ["للقصد", ["G4286"]], [" ", []], ["الأزلي", ["G165"]], [" الذي ", []], ["قصده", ["G4160"]], [" الله في ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["ربنا", ["G2962", "G2257"]], ["،", []]]}, {"c": 3, "v": 12, "text": "الذي به لنا جرأة واقتراب واثق من جراء الإيمان به", "groups": [{"kw": "", "raw": "Eph_2:18; Joh_14:6; Rom_5:2; Heb_4:14-16, Heb_10:19-22", "note": "", "refs": [{"l": "Eph 2:18", "n": "", "vs": [[18, "فبه لنا كلينا اقتراب إلى الآب بروح واحد."]]}, {"l": "Joh 14:6", "n": "", "vs": [[6, "فأجابه يسوع: «أنا هو الطريق والحق والحياة. لا يأتي أحد إلى الآب إلا بي."]]}, {"l": "Rom 5:2", "n": "", "vs": [[2, "وبه أيضا تم لنا الدخول بالإيمان إلى هذه النعمة التي نقيم فيها الآن؛ ونحن نفتخر برجائنا في التمتع بمجد الله."]]}, {"l": "Heb 4:14-16", "n": "", "vs": [[14, "فمادام لنا رئيس كهنتنا العظيم الذي ارتفع مجتازا السماوات، وهو يسوع ابن الله، فلنتمسك دائما بالاعتراف به."], [15, "ذلك لأن رئيس الكهنة الذي لنا، ليس عاجزا عن تفهم ضعفاتنا، بل إنه قد تعرض للتجارب التي نتعرض نحن لها، إلا أنه بلا خطية."], [16, "فلنتقدم بثقة إلى عرش النعمة، لننال الرحمة ونجد نعمة تعيننا عند الحاجة."]]}, {"l": "Heb 10:19-22", "n": "", "vs": [[19, "فلنا الآن، أيها الإخوة حق التقدم بثقة إلى «قدس الأقداس» (في السماء) بدم يسوع."], [20, "وذلك بسلوك هذا الطريق الحي الجديد الذي شقه لنا المسيح بتمزيق الحجاب، أي جسده."], [21, "ولنا أيضا كاهن عظيم يمارس سلطته على بيت الله."], [22, "فلنتقدم إلى حضرة الله بقلب صادق وبثقة الإيمان الكاملة، بعدما طهر رش الدم قلوبنا من كل شعور بالذنب، وغسل الماء النقي أجسادنا."]]}], "kwAr": "", "noteAr": ""}], "arS": [["الذي به ", []], ["لنا", ["G2192"]], [" ", []], ["جرأة", ["G3954"]], [" ", []], ["واقتراب", ["G4318"]], [" ", []], ["واثق", ["G4006"]], [" من جراء ", []], ["الإيمان", ["G4102"]], [" به", []]]}, {"c": 3, "v": 13, "text": "فلذلك أطلب إليكم ألا يفتر عزمكم بسبب الضيقات التي أقاسيها لأجلكم، فهي مفخرة لكم.", "groups": [{"kw": "ye", "raw": "Deu_20:3; Isa_40:30,Isa_40:31; Zep_3:16; Act_14:22; Gal_6:9; 2Th_3:13; Heb_12:3-5", "note": "", "refs": [{"l": "Deu 20:3", "n": "", "vs": [[3, "اسمع ياإسرائيل: أنتم اليوم موشكون على محاربة أعدائكم، فلا تهن قلوبكم، لا تخافوا منهم ولا ترتعدوا ولا ترهبوهم،"]]}, {"l": "Isa 40:30", "n": "", "vs": [[30, "إن الشبيبة ينالها الإعياء والإرهاق، والفتيان يتعثرون أشد تعثر،"]]}, {"l": "Isa 40:31", "n": "", "vs": [[31, "أما الراجون الرب فإنهم يجددون قوتهم، ويحلقون بأجنحة النسور. يركضون ولا يعيون. يمشون ولا يتعبون."]]}, {"l": "Zep 3:16", "n": "", "vs": [[16, "ويقال في ذلك اليوم لأورشليم: لا تخافي ياصهيون، ولا ترتخ يداك."]]}, {"l": "Act 14:22", "n": "", "vs": [[22, "وفي هذه الأماكن كلها كانا يشددان عزيمة التلاميذ، ويحثانهم على الثبات في الإيمان، مؤكدين لهم أن دخول ملكوت الله يقتضي أن نقاسي صعوبات كثيرة."]]}, {"l": "Gal 6:9", "n": "", "vs": [[9, "لأننا، متى حان الأوان، سنحصد، إن كنا لا نتراخى."]]}, {"l": "2Th 3:13", "n": "", "vs": [[13, "أما أنتم، أيها الإخوة، فلا تملوا من عمل الخير."]]}, {"l": "Heb 12:3-5", "n": "", "vs": [[3, "فتأملوا مليا ما قاساه بتحمله تلك المعاملة العنيفة التي عامله بها الخاطئون، لكي لا تتعبوا وتنهاروا!"], [4, "لم تقاوموا بعد حتى بذل الدم في مجاهدتكم ضد الخطيئة."], [5, "فهل نسيتم الوعظ الذي يخاطبكم به الله بوصفكم أبناء له؟ إذ يقول: «ياابني، لا تستخف بتأديب الرب. ولا تفقد العزيمة حين يوبخك على الخطأ."]]}], "kwAr": "ألا يفتر عزمكم", "noteAr": ""}, {"kw": "at", "raw": "Eph_3:1; 2Co_1:6; Phi_1:12-14; Col_1:24; 1Th_3:2-4", "note": "", "refs": [{"l": "Eph 3:1", "n": "", "vs": [[1, "لهذا السبب، أنا بولس سجين المسيح يسوع لأجلكم أنتم الأمم …"]]}, {"l": "2Co 1:6", "n": "", "vs": [[6, "فإن كنا في ضيقة، فذلك لأجل تشجيعكم وخلاصكم؛ وإن كنا متشجعين، فذلك لأجل تشجيعكم، مما يعمل فيكم على احتمال نفس الآلام التي نتألم بها نحن أيضا."]]}, {"l": "Phi 1:12-14", "n": "", "vs": [[12, "على أني أريد أن تعلموا، أيها الإخوة، أن أحوالي قد أدت في الواقع إلى انتشار الإنجيل بنجاح،"], [13, "حتى إنه قد صار معروفا لدى الحرس الإمبراطوري كله ولدى الباقين جميعا أن قيودي إنما هي لأجل المسيح؛"], [14, "كما أن أكثر الإخوة، وقد صاروا واثقين بالرب بسبب قيودي، يجرؤون على التبشير بكلمة الله دون خوف."]]}, {"l": "Col 1:24", "n": "", "vs": [[24, "والآن أنا أفرح في الآلام التي أقاسيها لأجلكم، وأتمم في جسدي ما نقص من ضيقات المسيح لأجل جسده الذي هو الكنيسة،"]]}, {"l": "1Th 3:2-4", "n": "", "vs": [[2, "فبعثنا تيموثاوس، أخانا ومعاوننا في خدمة الله بنشر الإنجيل، لكي يشددكم ويشجعكم في إيمانكم،"], [3, "حتى لا يتزعزع أحد منكم من جراء هذه الضيقات. فإنكم تعلمون أننا معينون لذلك؛"], [4, "وقد سبق لنا، لما كنا عندكم أن أخبرناكم أننا سنقاسي الضيقات، الأمر الذي حدث بعد ذلك كما تعلمون."]]}], "kwAr": "بسبب الضيقات", "noteAr": ""}], "arS": [["فلذلك", ["G1352"]], [" ", []], ["أطلب", ["G154"]], [" إليكم ألا ", []], ["يفتر", ["G1573"]], [" عزمكم بسبب ", []], ["الضيقات", ["G2347"]], [" التي أقاسيها لأجلكم، فهي ", []], ["مفخرة", ["G1391"]], [" لكم.", []]]}, {"c": 3, "v": 14, "text": "ولهذا السبب أحني ركبتي للآب", "groups": [{"kw": "I", "raw": "Eph_1:16-19; 1Ki_8:54, 1Ki_19:18; 2Ch_6:13; Ezr_9:5; Psa_95:6; Isa_45:23; Dan_6:10; Luk_22:41; Act_7:60, Act_9:40, Act_20:36, Act_21:5", "note": "", "refs": [{"l": "Eph 1:16-19", "n": "", "vs": [[16, "لا أنقطع عن شكر الله لأجلكم وعن ذكركم في صلواتي،"], [17, "حتى يهبكم إله ربنا يسوع المسيح، أبو المجد، روح حكمة وإلهام: لتعرفوه معرفة كاملة"], [18, "إذ تستنير بصائر قلوبكم، فتعلموا ما في دعوته لكم من رجاء، وما هو غنى مجد ميراثه في القديسين،"], [19, "وما هي عظمة قدرته الفائقة المعلنة لنا نحن المؤمنين، بحسب عمل اقتدار قوته"]]}, {"l": "1Ki 8:54", "n": "", "vs": [[54, "وعندما انتهى سليمان من الصلاة إلى الرب والتضرع إليه، نهض من أمام المذبح حيث كان جاثيا على ركبتيه وباسطا يديه نحو السماء."]]}, {"l": "1Ki 19:18", "n": "", "vs": [[18, "ولقد أبقيت في إسرائيل سبعة آلاف لم يحنوا ركبهم للبعل ولم تقبله أفواههم»."]]}, {"l": "2Ch 6:13", "n": "", "vs": [[13, "لأن سليمان كان قد صنع منبرا من نحاس أقامه في وسط الدار، طوله خمس أذرع (نحو مترين ونصف المتر)، وعرضه خمس أذرع (نحو مترين ونصف المتر)، وارتفاعه ثلاث أذرع (نحو متر ونصف المتر)، فوقف عليه أولا، ثم جثا على ركبتيه في مواجهة كل جماعة إسرائيل، وبسط يديه إلى السماء،"]]}, {"l": "Ezr 9:5", "n": "", "vs": [[5, "حينئذ قمت من تذللي، وأنا مازلت مرتديا ردائي وثيابي الممزقة، وجثوت على ركبتي وبسطت يدي إلى الرب إلهي،"]]}, {"l": "Psa 95:6", "n": "", "vs": [[6, "تعالوا نسجد وننحني، لنركع أمام الرب صانعنا،"]]}, {"l": "Isa 45:23", "n": "", "vs": [[23, "لقد أقسمت بذاتي، وخرجت من فمي، بكل صدق، كلمة لا تنقض: إنه ستجثو لي كل ركبة ويقسم بي كل لسان."]]}, {"l": "Dan 6:10", "n": "", "vs": [[10, "فلما بلغ دانيآل أمر توقيع الوثيقة مضى إلى بيته وصعد إلى عليته ذات الكوى المفتوحة باتجاه أورشليم، وجثا على ركبتيه ثلاث مرات في اليوم وصلى، وحمد إلهه كمألوف عادته من قبل."]]}, {"l": "Luk 22:41", "n": "", "vs": [[41, "وابتعد عنهم مسافة تقارب رمية حجر، وركع يصلي"]]}, {"l": "Act 7:60", "n": "", "vs": [[60, "ثم ركع وصرخ بصوت عال: «يارب، لا تحسب عليهم هذه الخطيئة!» وإذ قال هذا رقد."]]}, {"l": "Act 9:40", "n": "", "vs": [[40, "فطلب بطرس إلى جميع الحاضرين أن يخرجوا من الغرفة، وركع وصلى، ثم التفت إلى الجثة وقال: «ياطابيثا، قومي!» ففتحت عينيها. ولما رأت بطرس جلست،"]]}, {"l": "Act 20:36", "n": "", "vs": [[36, "وبعد هذا الكلام ركع بولس معهم جميعا وصلى."]]}, {"l": "Act 21:5", "n": "", "vs": [[5, "وعندما انتهت مدة إقامتنا عندهم خرجنا لنكمل سفرنا، فرافقونا مع نسائهم وأولادهم إلى خارج المدينة مودعين. فركعنا على الشاطيء وصلينا،"]]}], "kwAr": "أحني ركبتي", "noteAr": ""}, {"kw": "the Father", "raw": "Eph_1:3", "note": "", "refs": [{"l": "Eph 1:3", "n": "", "vs": [[3, "تبارك الله ، أبو ربنا يسوع المسيح الذي باركنا بكل بركة روحية في الأماكن السماوية."]]}], "kwAr": "للآب", "noteAr": ""}], "arS": [["ولهذا السبب", ["G5484", "G5127"]], [" ", []], ["أحني", ["G2578"]], [" ", []], ["ركبتي", ["G1119", "G3450"]], [" ", []], ["للآب", ["G3962"]]]}, {"c": 3, "v": 15, "text": "الذي هو أصل كل أبوة في السماوات وعلى الأرض،", "groups": [{"kw": "the whole", "raw": "Eph_1:10,Eph_1:21; Phi_2:9-11; Col_1:20; Rev_5:8-14, Rev_7:4-12", "note": "", "refs": [{"l": "Eph 1:10", "n": "", "vs": [[10, "لأجل تدبير تمام الأزمنة، حين يوحد كل شيء تحت رئاسة المسيح، سواء الأشياء التي في السماوات والتي على الأرض."]]}, {"l": "Eph 1:21", "n": "", "vs": [[21, "أرفع جدا من كل رئاسة وسلطة وقوة وسيا دة، ومن كل اسم يسمى، لا في هذا العالم وحسب، بل في ذلك الآتي أيضا."]]}, {"l": "Phi 2:9-11", "n": "", "vs": [[9, "لذلك أيضا رفعه الله عاليا، وأعطاه الاسم الذي يفوق كل اسم،"], [10, "لكي تنحني سجودا لاسم يسوع كل ركبة، سواء في السماء أم على الأرض أم تحت الأرض،"], [11, "ولكي يعترف كل لسان بأن يسوع المسيح هو الرب، لمجد الله الآب."]]}, {"l": "Col 1:20", "n": "", "vs": [[20, "وأن يصالح به كل شيء مع نفسه، إذ أحل السلام بدمه على الصليب، فبه يصالح كل شيء، سواء كان ما على الأرض أو ما في السماوات."]]}, {"l": "Rev 5:8-14", "n": "", "vs": [[8, "فسجد الشيوخ الأربعة والعشرون والكائنات الحية الأربعة أمام الحمل، وكان بيد كل منهم قيثارة وكؤوس ذهب مملوءة بالبخور، الذي هو صلوات القديسين."], [9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"], [10, "وجعلتهم مملكة لإلهنا وكهنة له، وسيملكون على الأرض»."], [11, "ثم نظرت، فسمعت ترتيل الملايين من الملائكة وهي تحيط بالعرش وبالكائنات الحية والشيوخ،"], [12, "وهم يهتفون بصوت عال: «مستحق هو الحمل المذبوح أن ينال القدرة والغنى والحكمة والقوة والإجلال والمجد والبركة»."], [13, "ثم سمعت كل خليقة في السماء وعلى الأرض، وتحت الأرض، وعلى البحر، هاتفة مع كل ما فيها: «البركة والإجلال والمجد والسلطة للجالس على العرش وللحمل، إلى أبد الآبدين»."], [14, "فردت الكائنات الحية الأربعة: «آمين!» وجثا الشيوخ ساجدين."]]}, {"l": "Rev 7:4-12", "n": "", "vs": [[4, "وسمعت أن عدد المختومين، مئة وأربعة وأربعون ألفا، من جميع أسباط بني إسرائيل:"], [5, "من سبط يهوذا ختم اثنا عشر ألفا؛ ومن سبط رأوبين اثنا عشر ألفا؛ ومن سبط جاد اثنا عشر ألفا؛"], [6, "ومن سبط أشير اثنا عشر ألفا؛ ومن سبط نفتالي اثنا عشر ألفا؛ ومن سبط منسى اثنا عشر ألفا"], [7, "ومن سبط شمعون اثنا عشر ألفا؛ ومن سبط لاوي اثنا عشر ألفا؛ ومن سبط يساكر اثنا عشر ألفا؛"], [8, "ومن سبط زبولون اثنا عشر ألفا؛ ومن سبط يوسف اثنا عشر ألفا؛ ومن سبط بنيامين ختم اثنا عشر ألفا."], [9, "ثم نظرت، فرأيت جمعا كثيرا لا يحصى، من كل أمة وقبيلة وشعب ولغة، واقفين أمام العرش وأمام الحمل، وقد ارتدوا ثيا با بيضاء، وأمسكوا بأيديهم سعف النخل،"], [10, "وهم يهتفون بصوت عال: «الخلاص من عند إلهنا الجالس على العرش ومن عند الحمل!»"], [11, "واجتمع الملائكة جميعا حول العرش، ومعهم الشيوخ والكائنات الحية الأربعة، وخروا على وجوههم أمام العرش سجودا لله،"], [12, "قائلين: «آمين! لإلهنا البركة والمجد والحكمة والشكر والإجلال والقدرة والقوة إلى أبد الآبدين. آمين!»"]]}], "kwAr": "كل أبوة", "noteAr": ""}, {"kw": "is", "raw": "Isa_65:15; Jer_33:16; Act_11:26; Rev_2:17, Rev_3:12", "note": "", "refs": [{"l": "Isa 65:15", "n": "", "vs": [[15, "وتخلفون اسمكم لعنة على شفاه مختاري، ويميتكم الرب ويطلق على عبيده اسما آخر."]]}, {"l": "Jer 33:16", "n": "", "vs": [[16, "في تلك الأيام يخلص يهوذا، وتسكن أورشليم آمنة، وهذا هو الاسم الذي تدعى به: الرب برنا."]]}, {"l": "Act 11:26", "n": "", "vs": [[26, "ولما وجده جاء به إلى أنطاكية، فكانا يجتمعان مع الكنيسة هناك سنة كاملة، ويعلمان جمعا كبيرا. وفي أنطاكية أطلق على تلاميذ الرب أول مرة اسم المسيحيين."]]}, {"l": "Rev 2:17", "n": "", "vs": [[17, "من له أذن فليسمع ما يقوله الروح للكنائس! كل من سينتصر سأطعمه من المن الخفي، وأعطيه حجرا صغيرا أبيض حفر عليه اسم جديد لا يعرفه إلا الذي يأخذه!"]]}, {"l": "Rev 3:12", "n": "", "vs": [[12, "كل من ينتصر سأجعله عمودا في هيكل إلهي، فلا يخرج منه أبدا، وسأكتب عليه اسم إلهي واسم مدينة إلهي أورشليم الجديدة، التي تنزل من السماء من عند إلهي، وأكتب عليه اسمي الجديد."]]}], "kwAr": "أصل", "noteAr": ""}], "arS": [["الذي هو أصل ", []], ["كل", ["G3956"]], [" ", []], ["أبوة", ["G3965"]], [" في ", []], ["السماوات", ["G3772"]], [" وعلى ", []], ["الأرض", ["G1093"]], ["،", []]]}, {"c": 3, "v": 16, "text": "لكي يمنحكم، وفقا لغنى مجده، أن يمد الروح الكيان الداخلي في كل منكم بالقوة المؤيدة،", "groups": [{"kw": "according", "raw": "Eph_3:8, Eph_1:7, Eph_1:18, Eph_2:7; Rom_9:23; Phi_4:19; Col_1:27", "note": "", "refs": [{"l": "Eph 3:8", "n": "", "vs": [[8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "Eph 1:7", "n": "", "vs": [[7, "ففيه لنا بدمه الفداء، أي غفران الخطايا؛ بحسب غنى نعمته"]]}, {"l": "Eph 1:18", "n": "", "vs": [[18, "إذ تستنير بصائر قلوبكم، فتعلموا ما في دعوته لكم من رجاء، وما هو غنى مجد ميراثه في القديسين،"]]}, {"l": "Eph 2:7", "n": "", "vs": [[7, "وذلك كي يعرض في الدهور القادمة غنى نعمته الفائق في لطفه علينا في المسيح يسوع."]]}, {"l": "Rom 9:23", "n": "", "vs": [[23, "وذلك بقصد أن يعلن غنى مجده في أوعية الرحمة التي سبق فأعدها للمجد،"]]}, {"l": "Phi 4:19", "n": "", "vs": [[19, "وإن إلهي سيسد حاجاتكم كلها إلى التمام، وفقا لغناه في المجد، في المسيح يسوع."]]}, {"l": "Col 1:27", "n": "", "vs": [[27, "الذين أراد الله أن يعلن لهم كم هو غني مجد هذا السر بين الأمم: إنه المسيح فيكم، وهو رجاء المجد؛"]]}], "kwAr": "وفقا لغنى مجده", "noteAr": ""}, {"kw": "to be", "raw": "Eph_6:10; Job_23:6; Psa_28:8, Psa_138:3; Isa_40:29-31, Isa_41:10; Zec_10:12; Mat_6:13; 2Co_12:9; Phi_4:13; Col_1:11; 2Ti_4:17; Heb_11:34", "note": "", "refs": [{"l": "Eph 6:10", "n": "", "vs": [[10, "وختاما، تشددوا في الرب وفي قدرة قوته."]]}, {"l": "Job 23:6", "n": "", "vs": [[6, "أيخاصمني بعظمة قوته؟ لا! بل يلتفت مترئفا علي."]]}, {"l": "Psa 28:8", "n": "", "vs": [[8, "الرب قوة شعبه، وهو حصن خلاص مسيحه."]]}, {"l": "Psa 138:3", "n": "", "vs": [[3, "يوم دعوتك استجبت لي، وشجعتني إذ زدتني قوة في داخلي."]]}, {"l": "Isa 40:29-31", "n": "", "vs": [[29, "يهب المنهوك قوة ويمنح الضعيف قدرة عظيمة."], [30, "إن الشبيبة ينالها الإعياء والإرهاق، والفتيان يتعثرون أشد تعثر،"], [31, "أما الراجون الرب فإنهم يجددون قوتهم، ويحلقون بأجنحة النسور. يركضون ولا يعيون. يمشون ولا يتعبون."]]}, {"l": "Isa 41:10", "n": "", "vs": [[10, "لا تخف لأني معك. لا تتلفت حولك جزعا، لأني إلهك، أشددك وأعينك وأعضدك بيمين بري"]]}, {"l": "Zec 10:12", "n": "", "vs": [[12, "وأشددهم بالرب فيسلكون بمقتضى اسمه، يقول الرب."]]}, {"l": "Mat 6:13", "n": "", "vs": [[13, "ولا تدخلنا في تجربة، لكن نجنا من الشرير، لأن لك الملك والقوة والمجد إلى الأبد. آمين."]]}, {"l": "2Co 12:9", "n": "", "vs": [[9, "فقال لي: «نعمتي تكفيك، لأن قدرتي تكمل في الضعف!» فأنا أرضى بأن أفتخر مسرورا بالضعفات التي في، لكي تخيم علي قدرة المسيح."]]}, {"l": "Phi 4:13", "n": "", "vs": [[13, "إني أستطيع كل شيء، في المسيح الذي يقويني."]]}, {"l": "Col 1:11", "n": "", "vs": [[11, "متشددين بكل قوة موافقة لقدرة مجده، لتتمكنوا تماما من الاحتمال وطول البال،"]]}, {"l": "2Ti 4:17", "n": "", "vs": [[17, "إلا أن الرب وقف بجانبي وأمدني بالقوة، لكي تتم بي المناداة بالبشارة، فيسمعها جميع من هم من الأمم؛ وقد نجوت من فم الأسد."]]}, {"l": "Heb 11:34", "n": "", "vs": [[34, "وأبطلوا قوة النار، ونجوا من الموت قتلا بالسيف. وبه أيضا نالوا القوة بعد ضعف، فصاروا أشداء في المعارك، وردوا جيوشا غريبة على أعقابها."]]}], "kwAr": "أن يمد الروح", "noteAr": ""}, {"kw": "the inner", "raw": "Jer_31:33; Rom_2:29, Rom_7:22; 2Co_4:16; 1Pe_3:4", "note": "", "refs": [{"l": "Jer 31:33", "n": "", "vs": [[33, "ولكن هذا هو العهد الذي أبرمه مع ذرية إسرائيل بعد تلك الأيام»، يقول الرب: «سأجعل شريعتي في دواخلهم، وأدونها على قلوبهم وأكون لهم إلها وهم يكونون لي شعبا."]]}, {"l": "Rom 2:29", "n": "", "vs": [[29, "وإنما اليهودي هو من كان يهوديا في الباطن، والختان هو ما كان ختانا للقلب بالروح لا بالحرف. وهذا يأتيه المدح لا من الناس بل من الله!"]]}, {"l": "Rom 7:22", "n": "", "vs": [[22, "أن لدي الشر. فإنني، وفقا للإنسان الباطن في، أبتهج بشريعة الله."]]}, {"l": "2Co 4:16", "n": "", "vs": [[16, "لهذا، لا تخور عزيمتنا! ولكن، مادام الإنسان الظاهر فينا يفنى، فإن الإنسان الباطن فينا يتجدد يوما فيوما."]]}, {"l": "1Pe 3:4", "n": "", "vs": [[4, "وإنما لتعتمد الزينة الداخلية، ليكون قلبها متزينا بروح الوداعة والهدوء. هذه هي الزينة التي لا تفنى، وهي غالية الثمن في نظر الله!"]]}], "kwAr": "الكيان الداخلي", "noteAr": ""}], "arS": [["لكي ", []], ["يمنحكم", ["G1325"]], ["، ", []], ["وفقا", ["G2596"]], [" ", []], ["لغنى", ["G4149"]], [" ", []], ["مجده", ["G1391"]], ["، أن ", []], ["يمد", ["G2901"]], [" ", []], ["الروح", ["G4151"]], [" الكيان ", []], ["الداخلي", ["G2080"]], [" في كل منكم ", []], ["بالقوة", ["G1411"]], [" المؤيدة،", []]]}, {"c": 3, "v": 17, "text": "ليسكن المسيح في قلوبكم بالإيمان؛ حتى إذا تأصلتم وتأسستم في المحبة،", "groups": [{"kw": "Christ", "raw": "Eph_2:21; Isa_57:15; Joh_6:56, Joh_14:17, Joh_14:23, Joh_17:23; Rom_8:9-11; 2Co_6:16; Gal_2:20; Col_1:27; 1Jo_4:4, 1Jo_4:16; Rev_3:20", "note": "", "refs": [{"l": "Eph 2:21", "n": "", "vs": [[21, "الذي فيه يتناسق البناء كله فيرتفع ليصير هيكلا مقدسا في الرب."]]}, {"l": "Isa 57:15", "n": "", "vs": [[15, "لأنه هكذا يقول العلي السامي، المقيم في الأبد، الذي يدعى اسمه القدوس: إنني أسكن في العلى وفي الموضع المقدس، وأقيم مع المنسحق، وذوي الروح المتواضعة، لأحيي أرواح المتواضعين، وأنعش قلوب المنسحقين."]]}, {"l": "Joh 6:56", "n": "", "vs": [[56, "وكل من يأكل جسدي ويشرب دمي، يثبت في وأنا فيه."]]}, {"l": "Joh 14:17", "n": "", "vs": [[17, "وهو روح الحق، الذي لا يقدر العالم أن يتقبله لأنه لا يراه ولا يعرفه، وأما أنتم فتعرفونه لأنه في وسطكم، وسيكون في داخلكم."]]}, {"l": "Joh 14:23", "n": "", "vs": [[23, "أجابه يسوع: «من يحبني يعمل بكلمتي، ويحبه أبي، وإليه نأتي، وعنده نجعل لنا منزلا."]]}, {"l": "Joh 17:23", "n": "", "vs": [[23, "أنا فيهم، وأنت في، ليكتملوا فيصيروا واحدا، حتى يعرف العالم أنك أرسلتني وأنك أحببتهم كما أحببتني."]]}, {"l": "Rom 8:9-11", "n": "", "vs": [[9, "وأما أنتم، فلستم تحت سلطة الجسد بل تحت سلطة الروح، إذا كان روح الله ساكنا في داخلكم حقا. ولكن، إن كان أحد ليس له روح المسيح، فهو ليس للمسيح."], [10, "وإذا كان المسيح فيكم، فمع أن الجسد مائت بسبب الخطيئة، فإن الروح حياة لكم بسبب البر."], [11, "وإذا كان روح الذي أقام يسوع من بين الأموات يسكن فيكم، فإن الذي أقام المسيح من بين الأموات سوف يحيي أيضا أجسادكم الفانية بسبب روحه الذي يسكن فيكم."]]}, {"l": "2Co 6:16", "n": "", "vs": [[16, "وأي وفاق لهيكل الله مع الأصنام؟ فإننا نحن هيكل الله الحي، وفقا لما قاله الله : «سأسكن في وسطهم، وأسير بينهم، وأكون إلههم وهم يكونون شعبا لي…"]]}, {"l": "Gal 2:20", "n": "", "vs": [[20, "مع المسيح صلبت، وفيما بعد لا أحيا أنا بل المسيح يحيا في. أما الحياة التي أحياها الآن في الجسد، فإنما أحياها بالإيمان في ابن الله، الذي أحبني وبذل نفسه عني."]]}, {"l": "Col 1:27", "n": "", "vs": [[27, "الذين أراد الله أن يعلن لهم كم هو غني مجد هذا السر بين الأمم: إنه المسيح فيكم، وهو رجاء المجد؛"]]}, {"l": "1Jo 4:4", "n": "", "vs": [[4, "أيها الأولاد الصغار، أنتم من الله، وقد غلبتم الذين يقاومون المسيح: لأن الروح القدس الساكن فيكم أقوى من الروح الشرير المنتشر في العالم."]]}, {"l": "1Jo 4:16", "n": "", "vs": [[16, "ونحن أنفسنا اختبرنا المحبة التي خصنا الله بها، ووضعنا ثقتنا فيها. إن الله محبة. ومن يثبت في المحبة، فإنه يثبت في الله، والله يثبت فيه."]]}, {"l": "Rev 3:20", "n": "", "vs": [[20, "ها أنا واقف خارج الباب أقرعه. إن سمع أحد صوتي وفتح الباب، أدخل إليه فأتعشى معه وهو معي."]]}], "kwAr": "ليسكن المسيح في قلوبكم", "noteAr": ""}, {"kw": "being", "raw": "Mat_13:6; Rom_5:5; 1Co_8:1; 2Co_5:14, 2Co_5:15; Gal_5:6; Col_1:23, Col_2:7", "note": "", "refs": [{"l": "Mat 13:6", "n": "", "vs": [[6, "ولكن لما أشرقت الشمس، احترق ويبس لأنه كان بلا أصل."]]}, {"l": "Rom 5:5", "n": "", "vs": [[5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."]]}, {"l": "1Co 8:1", "n": "", "vs": [[1, "وأما فيما يتعلق بالذبائح المقدمة للأصنام، فنعلم أن المعرفة لجميعنا. غير أن المعرفة تنفخ تكبرا، ولكن المحبة تبني. فمن ظن أنه يعرف شيئا،"]]}, {"l": "2Co 5:14", "n": "", "vs": [[14, "فإن محبة المسيح تسيطر علينا، وقد حكمنا بهذا: مادام واحد قد مات عوضا عن الجميع، فمعنى ذلك أن الجميع ماتوا؛"]]}, {"l": "2Co 5:15", "n": "", "vs": [[15, "وهو قد مات عوضا عن الجميع حتى لا يعيش الأحياء في ما بعد لأنفسهم بل للذي مات عوضا عنهم ثم قام."]]}, {"l": "Gal 5:6", "n": "", "vs": [[6, "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة."]]}, {"l": "Col 1:23", "n": "", "vs": [[23, "على أن تثبتوا فعلا في الإيمان، مؤسسين وراسخين وغير متحولين عن رجاء الإنجيل الذي سمعتموه والذي بشر به للخليقة كلها تحت السماء، وله صرت أنا بولس خادما."]]}, {"l": "Col 2:7", "n": "", "vs": [[7, "وأنتم متأصلون ومبنيون فيه وراسخون في الإيمان الموافق لما تعلمتم وفائضون بالشكر."]]}], "kwAr": "إذا تأصلتم", "noteAr": ""}, {"kw": "grounded", "raw": "Mat_7:24, Mat_7:25; Luk_6:48 *Gr.", "note": "", "refs": [{"l": "Mat 7:24", "n": "", "vs": [[24, "فأي من يسمع أقوالي هذه ويعمل بها، أشبهه برجل حكيم بنى بيته على الصخر،"]]}, {"l": "Mat 7:25", "n": "", "vs": [[25, "فنزلت الأمطار، وجرت السيول، وهبت العواصف، فضربت ذلك البيت، فلم يسقط لأنه مؤسس على الصخر."]]}, {"l": "Luk 6:48", "n": "*Gr.", "vs": [[48, "إنه يشبه إنسانا يبني بيتا، فحفر وعمق ووضع الأساس على الصخر. ثم هطل مطر غزير وصدم السيل ذلك البيت، فلم يقدر أن يزعزعه، لأنه كان مؤسسا على الصخر."]]}], "kwAr": "وتأسستم في المحبة", "noteAr": ""}], "arS": [["ليسكن", ["G2730"]], [" ", []], ["المسيح", ["G5547"]], [" في ", []], ["قلوبكم", ["G2588", "G5216"]], [" ", []], ["بالإيمان", ["G4102"]], ["؛ حتى إذا ", []], ["تأصلتم", ["G4492"]], [" ", []], ["وتأسستم", ["G2311"]], [" في ", []], ["المحبة", ["G26"]], ["،", []]]}, {"c": 3, "v": 18, "text": "تصيرون قادرين تماما أن تدركوا، مع القديسين جميعا، ما هو العرض والطول والعلو والعمق،", "groups": [{"kw": "able", "raw": "Eph_3:19, Eph_1:18-23; Job_11:7-9; Psa_103:11, Psa_103:12, Psa_103:17, Psa_139:6; Isa_55:9; Joh_15:13; Gal_2:20, Gal_3:13; Phi_2:5-8, Phi_3:8-10; 1Ti_1:14-16, 1Ti_3:16; Tit_2:13, Tit_2:14; Rev_3:21", "note": "", "refs": [{"l": "Eph 3:19", "n": "", "vs": [[19, "وتعرفوا محبة المسيح التي تفوق المعرفة، فتمتلئوا حتى تبلغوا ملء الله كله."]]}, {"l": "Eph 1:18-23", "n": "", "vs": [[18, "إذ تستنير بصائر قلوبكم، فتعلموا ما في دعوته لكم من رجاء، وما هو غنى مجد ميراثه في القديسين،"], [19, "وما هي عظمة قدرته الفائقة المعلنة لنا نحن المؤمنين، بحسب عمل اقتدار قوته"], [20, "الذي عمله في المسيح، بإقامته له من بين الأموات. وقد أجلسه عن يمينه في الأماكن السماوية،"], [21, "أرفع جدا من كل رئاسة وسلطة وقوة وسيا دة، ومن كل اسم يسمى، لا في هذا العالم وحسب، بل في ذلك الآتي أيضا."], [22, "وأخضع كل شيء تحت قدميه، وإياه جعل فوق كل شيء رأسا للكنيسة"], [23, "التي هي جسده وكماله، هو الذي يكمل الكل في الكل."]]}, {"l": "Job 11:7-9", "n": "", "vs": [[7, "ألعلك تدرك أعماق الله، أم تبلغ أقصى قوة القدير؟"], [8, "هو أسمى من السماوات، فماذا يمكنك أن تفعل؟ وهو أبعد غورا من الهاوية، فماذا تعلم؟"], [9, "هو أطول من الأرض وأعرض من البحر."]]}, {"l": "Psa 103:11", "n": "", "vs": [[11, "مثل ارتفاع السماوات فوق الأرض، تعاظمت رحمته على متقيه."]]}, {"l": "Psa 103:12", "n": "", "vs": [[12, "وكبعد المشرق عن المغرب أبعد عنا معاصينا."]]}, {"l": "Psa 103:17", "n": "", "vs": [[17, "أما رحمة الرب فهي من الأزل وإلى الأبد على متقيه، وعدله يمتد إلى بني البنين،"]]}, {"l": "Psa 139:6", "n": "", "vs": [[6, "ما أعجب هذا العلم الفائق، إنه أسمى من أن أدركه."]]}, {"l": "Isa 55:9", "n": "", "vs": [[9, "فكما ارتفعت السماوات عن الأرض، كذلك ارتفعت طرقي عن طرقكم، وأفكاري عن أفكاركم."]]}, {"l": "Joh 15:13", "n": "", "vs": [[13, "ليس لأحد محبة أعظم من هذه: أن يبذل أحد حياته فدى أحبائه."]]}, {"l": "Gal 2:20", "n": "", "vs": [[20, "مع المسيح صلبت، وفيما بعد لا أحيا أنا بل المسيح يحيا في. أما الحياة التي أحياها الآن في الجسد، فإنما أحياها بالإيمان في ابن الله، الذي أحبني وبذل نفسه عني."]]}, {"l": "Gal 3:13", "n": "", "vs": [[13, "إن المسيح حررنا بالفداء من لعنة الشريعة، إذ صار لعنة عوضا عنا، لأنه قد كتب: «ملعون كل من علق على خشبة»،"]]}, {"l": "Phi 2:5-8", "n": "", "vs": [[5, "فليكن فيكم هذا الفكر الذي هو أيضا في المسيح يسوع."], [6, "إذ إنه، وهو الكائن في هيئة الله، لم يعتبر مساواته لله خلسة، أو غنيمة يتمسك بها؛"], [7, "بل أخلى نفسه، متخذا صورة عبد، صائرا شبيها بالبشر؛"], [8, "وإذ ظهر بهيئة إنسان، أمعن في الاتضاع، وكان طائعا حتى الموت، موت الصليب."]]}, {"l": "Phi 3:8-10", "n": "", "vs": [[8, "بل إني أعتبر كل شيء خسارة، من أجل امتياز معرفة المسيح يسوع ربي؛ فمن أجله تحملت خسارة كل شيء، وأعتبر كل شيء نفاية، لكي أربح المسيح"], [9, "ويكون لي فيه مقام، إذ ليس لي بري الذاتي القائم على أساس الشريعة، بل البر الآتي من الإيمان بالمسيح، البر الذي من عند الله على أساس الإيمان."], [10, "وغايتي أن أعرف المسيح وقوة قيامته والشركة في آلامه؛ والتشبه به في موته،"]]}, {"l": "1Ti 1:14-16", "n": "", "vs": [[14, "إلا أن نعمة ربنا قد فاضت علي فوق كل حد، ومعها الإيمان والمحبة، وذلك في المسيح يسوع."], [15, "ما أصدق هذا القول، وما أجدره بالتصديق الكلي: إن المسيح يسوع قد جاء إلى العالم ليخلص الخاطئين، وأنا أولهم!"], [16, "ولكن لهذا السبب عوملت بالرحمة، ليجعل يسوع المسيح مني، أنا أولا، مثالا يظهر صبره الطويل، لجميع الذين سيؤمنون به لنوال الحياة الأبدية."]]}, {"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Rev 3:21", "n": "", "vs": [[21, "وكل من ينتصر سأجلسه معي على عرشي، كما انتصرت أنا أيضا فجلست مع أبي على عرشه؛"]]}], "kwAr": "تصيرون قادرين تماما", "noteAr": ""}, {"kw": "with", "raw": "Eph_1:10,Eph_1:15; Deu_33:2, Deu_33:3; 2Ch_6:41; Psa_116:15, Psa_132:9, Psa_145:10; Zec_14:5; 2Co_13:13; Col_1:4", "note": "", "refs": [{"l": "Eph 1:10", "n": "", "vs": [[10, "لأجل تدبير تمام الأزمنة، حين يوحد كل شيء تحت رئاسة المسيح، سواء الأشياء التي في السماوات والتي على الأرض."]]}, {"l": "Eph 1:15", "n": "", "vs": [[15, "لذلك أنا أيضا، وقد سمعت بما فيكم من الإيمان بالرب يسوع والمحبة لجميع القديسين،"]]}, {"l": "Deu 33:2", "n": "", "vs": [[2, "فقال: «أقبل الرب من سيناء، وأشرف عليهم من سعير، وتألق في جبل فاران؛ جاء محاطا بعشرات الألوف من الملائكة وعن يمينه يومض برق عليهم."]]}, {"l": "Deu 33:3", "n": "", "vs": [[3, "حقا إنك أنت الذي أحببت الشعب؛ وجميع القديسين في يدك، ساجدون عند قدميك يتلقون منك أقوالك،"]]}, {"l": "2Ch 6:41", "n": "", "vs": [[41, "والآن، انهض أيها الرب الإله إلى مكان راحتك، أنت والتابوت رمز عزتك. ليرتد، أيها الرب الإله، كهنتك ثوب خلاصك، وليبتهج أتقياؤك بالخير."]]}, {"l": "Psa 116:15", "n": "", "vs": [[15, "عزيز في عيني الرب موت قديسيه."]]}, {"l": "Psa 132:9", "n": "", "vs": [[9, "ليرتد كهنتك البر ثوبا، وليهتف أتقياؤك فرحا."]]}, {"l": "Psa 145:10", "n": "", "vs": [[10, "كل أعمالك تسبح بحمدك يارب، وأتقياؤك يباركونك،"]]}, {"l": "Zec 14:5", "n": "", "vs": [[5, "ويهربون من خلال وادي جبالي الممتد إلى آصل. تهربون كما هربتم من الزلزلة في أيام حكم عزيا ملك يهوذا، ويأتي الرب إلهي في موكب من جميع قديسيه."]]}, {"l": "2Co 13:13", "n": "", "vs": [[13, "جميع القديسين يسلمون عليكم."]]}, {"l": "Col 1:4", "n": "", "vs": [[4, "إذ بلغنا خبر إيمانكم بالمسيح يسوع والمحبة التي لكم نحو جميع القديسين،"]]}], "kwAr": "مع القديسين جميعا", "noteAr": ""}, {"kw": "what", "raw": "Rom_10:3, Rom_10:11, Rom_10:12", "note": "", "refs": [{"l": "Rom 10:3", "n": "", "vs": [[3, "فبما أنهم جهلوا بر الله وسعوا إلى إثبات برهم الذاتي، لم يخضعوا للبر الإلهي."]]}, {"l": "Rom 10:11", "n": "", "vs": [[11, "لأن الكتاب يقول: «كل من هو مؤمن به، لا يخيب»."]]}, {"l": "Rom 10:12", "n": "", "vs": [[12, "فلا فرق بين اليهودي واليوناني، لأن للجميع ربا واحدا، غنيا تجاه كل من يدعوه»."]]}], "kwAr": "ما هو العرض والطول", "noteAr": ""}], "arS": [["تصيرون ", []], ["قادرين", ["G1840"]], [" تماما أن ", []], ["تدركوا", ["G2638"]], ["، مع ", []], ["القديسين", ["G40"]], [" ", []], ["جميعا", ["G3956"]], ["، ما هو ", []], ["العرض", ["G4114"]], [" ", []], ["والطول", ["G3372"]], [" ", []], ["والعلو", ["G5311"]], [" ", []], ["والعمق", ["G899"]], ["،", []]]}, {"c": 3, "v": 19, "text": "وتعرفوا محبة المسيح التي تفوق المعرفة، فتمتلئوا حتى تبلغوا ملء الله كله.", "groups": [{"kw": "to know", "raw": "Eph_3:18, Eph_5:2, Eph_5:25; Joh_17:3; 2Co_5:14; Gal_2:20; Phi_2:5-12; Col_1:10; 2Pe_3:18; 1Jo_4:9-14", "note": "", "refs": [{"l": "Eph 3:18", "n": "", "vs": [[18, "تصيرون قادرين تماما أن تدركوا، مع القديسين جميعا، ما هو العرض والطول والعلو والعمق،"]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "Eph 5:25", "n": "", "vs": [[25, "أيها الأزواج، أحبوا زوجاتكم مثلما أحب المسيح الكنيسة وبذل نفسه لأجلها،"]]}, {"l": "Joh 17:3", "n": "", "vs": [[3, "والحياة الأبدية هي أن يعرفوك أنت الإله الحق وحدك، والذي أرسلته: يسوع المسيح."]]}, {"l": "2Co 5:14", "n": "", "vs": [[14, "فإن محبة المسيح تسيطر علينا، وقد حكمنا بهذا: مادام واحد قد مات عوضا عن الجميع، فمعنى ذلك أن الجميع ماتوا؛"]]}, {"l": "Gal 2:20", "n": "", "vs": [[20, "مع المسيح صلبت، وفيما بعد لا أحيا أنا بل المسيح يحيا في. أما الحياة التي أحياها الآن في الجسد، فإنما أحياها بالإيمان في ابن الله، الذي أحبني وبذل نفسه عني."]]}, {"l": "Phi 2:5-12", "n": "", "vs": [[5, "فليكن فيكم هذا الفكر الذي هو أيضا في المسيح يسوع."], [6, "إذ إنه، وهو الكائن في هيئة الله، لم يعتبر مساواته لله خلسة، أو غنيمة يتمسك بها؛"], [7, "بل أخلى نفسه، متخذا صورة عبد، صائرا شبيها بالبشر؛"], [8, "وإذ ظهر بهيئة إنسان، أمعن في الاتضاع، وكان طائعا حتى الموت، موت الصليب."], [9, "لذلك أيضا رفعه الله عاليا، وأعطاه الاسم الذي يفوق كل اسم،"], [10, "لكي تنحني سجودا لاسم يسوع كل ركبة، سواء في السماء أم على الأرض أم تحت الأرض،"], [11, "ولكي يعترف كل لسان بأن يسوع المسيح هو الرب، لمجد الله الآب."], [12, "إذن، ياأحبائي، كما كنتم تطيعون دائما، لا كما لو أنني حاضر وحسب، بل بالأحرى كثيرا الآن وأنا غائب، كذلك اسعوا لتحقيق خلاصكم عمليا بخوف وارتعاد،"]]}, {"l": "Col 1:10", "n": "", "vs": [[10, "لكي تسلكوا سلوكا لائقا بالرب ومرضيا في كل شيء، منتجين الثمر في كل عمل صالح ونامين في معرفة الله إلى التمام،"]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}, {"l": "1Jo 4:9-14", "n": "", "vs": [[9, "وقد أظهر الله محبته لنا إذ أرسل ابنه الأوحد إلى العالم لكي نحيا به."], [10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."], [11, "ومادام الله قد أحبنا هذه المحبة العظيمة، أيها الأحباء، فعلينا نحن أيضا أن نحب بعضنا بعضا."], [12, "إن الله لم يره أحد من الناس قط. ولكن، حين نحب بعضنا بعضا، نبين أن الله يحيا في داخلنا، وأن محبته قد اكتملت في داخلنا."], [13, "وما يؤكد لنا أننا نثبت في الله، وأنه يثبت فينا هو أنه وهب لنا من روحه."], [14, "ونحن أنفسنا نشهد أن الآب قد أرسل الابن مخلصا للعالم، لأننا رأيناه بعيوننا."]]}], "kwAr": "وتعرفوا محبة المسيح", "noteAr": ""}, {"kw": "passeth", "raw": "Phi_1:7", "note": "", "refs": [{"l": "Phi 1:7", "n": "", "vs": [[7, "كما أن من الحق أن يكون لي هذا الشعور تجاهكم جميعا، لأني أحتفظ بكم في قلبي، لكونكم جميعا شركاء لي في النعمة، سواء أكان في قيودي أم في الدفاع عن الإنجيل وتثبيته."]]}], "kwAr": "التي تفوق المعرفة", "noteAr": ""}, {"kw": "that ye", "raw": "Eph_1:23; Psa_17:15, Psa_43:4; Mat_5:6; Joh_1:16; Col_2:9, Col_2:10; Rev_7:15-17; Rev_21:22-24, Rev_22:3-5", "note": "", "refs": [{"l": "Eph 1:23", "n": "", "vs": [[23, "التي هي جسده وكماله، هو الذي يكمل الكل في الكل."]]}, {"l": "Psa 17:15", "n": "", "vs": [[15, "أما أنا فبالبر أشاهد وجهك. أشبع، إذا استيقظت، من بهاء طلعتك."]]}, {"l": "Psa 43:4", "n": "", "vs": [[4, "فأقبل إلى مذبح الله، إلى الله فرحي وأسبحك بالعود ياإلهي."]]}, {"l": "Mat 5:6", "n": "", "vs": [[6, "طوبى للجياع والعطاش إلى البر، فإنهم سيشبعون."]]}, {"l": "Joh 1:16", "n": "", "vs": [[16, "فمن امتلائه أخذنا جميعنا ونلنا نعمة على نعمة،"]]}, {"l": "Col 2:9", "n": "", "vs": [[9, "فإنه فيه، جسديا، يحل الله بكل ملئه،"]]}, {"l": "Col 2:10", "n": "", "vs": [[10, "وأنتم مكملون فيه. فهو رأس كل رئاسة وسلطة؛"]]}, {"l": "Rev 7:15-17", "n": "", "vs": [[15, "لهذا هم أمام عرش الله يخدمونه في هيكله ليلا ونهارا والجالس على العرش يبسط خيمته عليهم،"], [16, "فلن يجوعوا ولن يعطشوا، ولن تضربهم الشمس ولا أي حر،"], [17, "لأن الحمل الذي في وسط العرش يرعاهم ويقودهم إلى ينابيع ماء الحياة، ويمسح الله كل دمعة من عيونهم»."]]}, {"l": "Rev 21:22-24", "n": "", "vs": [[22, "ولم أجد في المدينة هيكلا، لأن الرب الإله القادر على كل شيء والحمل هما هيكلها."], [23, "ولم تكن المدينة في حاجة إلى نور الشمس أو القمر، لأن مجد الله ينيرها، والحمل مصباحها."], [24, "ستسير بنورها الأمم، ويأتيها ملوك الأرض بكنوزهم."]]}, {"l": "Rev 22:3-5", "n": "", "vs": [[3, "لن تكون فيما بعد لعنة أبدا. لأن عرش الله والحمل قائم في المدينة، حيث يخدمه عبيده"], [4, "ويرون وجهه، وقد كتب اسمه على جباههم."], [5, "ولن يكون هنالك ليل، فلا يحتاجون إلى نور مصباح أو شمس، لأن الرب الإله ينير عليهم، وهم سيملكون إلى أبد الآبدين!"]]}], "kwAr": "فتمتلئوا", "noteAr": ""}], "arS": [["وتعرفوا", ["G1097"]], [" ", []], ["محبة", ["G26"]], [" ", []], ["المسيح", ["G5547"]], [" التي ", []], ["تفوق", ["G5235"]], [" ", []], ["المعرفة", ["G1108"]], ["، ", []], ["فتمتلئوا", ["G4137"]], [" حتى تبلغوا ", []], ["ملء", ["G4138"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["كله", ["G3956"]], [".", []]]}, {"c": 3, "v": 20, "text": "والقادر أن يفعل، وفقا للقدرة العاملة فينا، ما يفوق بلا حصر كل ما نطلب أو نتصور،", "groups": [{"kw": "able", "raw": "Gen_17:1, Gen_18:4; 2Ch_25:9; Jer_32:17, Jer_32:27; Dan_3:17, Dan_6:20; Mat_3:9; Joh_10:29, Joh_10:30; Rom_4:21, Rom_16:25; Heb_7:25, Heb_11:19, Heb_13:20,Heb_13:21; Jam_4:12; Jud_1:24", "note": "", "refs": [{"l": "Gen 17:1", "n": "", "vs": [[1, "وعندما كان أبرام في التاسعة والتسعين من عمره، ظهر له الرب قائلا: «أنا هو الله القدير. سر أمامي وكن كاملا،"]]}, {"l": "Gen 18:4", "n": "", "vs": [[4, "بل دعني أقدم لكم بعض ماء تغسلون به أرجلكم وتتكئون تحت الشجرة،"]]}, {"l": "2Ch 25:9", "n": "", "vs": [[9, "فسأل أمصيا رجل الله: «وماذا عن المال الذي دفعته لمرتزقة إسرائيل؟» فأجابه: «إن الرب قادر أن يعوضك أكثر مما دفعت»."]]}, {"l": "Jer 32:17", "n": "", "vs": [[17, "آه أيها السيد الرب، إنك أنت الذي صنعت السماوات والأرض بقوتك العظيمة وذراعك الممدودة ولا يتعذر عليك أمر."]]}, {"l": "Jer 32:27", "n": "", "vs": [[27, "«انظر، أنا الرب إله كل بشر. هل يتعذر علي أمر؟"]]}, {"l": "Dan 3:17", "n": "", "vs": [[17, "لأن إلهنا الذي نعبده قادر أن ينجينا من أتون النار المتقدة، وأن ينقذنا من يدك أيها الملك."]]}, {"l": "Dan 6:20", "n": "", "vs": [[20, "فلما دنا منه نادى دانيآل بصوت حزين قائلا: «يادانيآل، عبد الله الحي، هل إلهك الذي تعبده دائما استطاع أن ينجيك من الأسود؟»"]]}, {"l": "Mat 3:9", "n": "", "vs": [[9, "ولا تعللوا أنفسكم قائلين: لنا إبراهيم أبا! فإني أقول لكم: إن الله قادر أن يطلع من هذه الحجارة أولادا لإبراهيم."]]}, {"l": "Joh 10:29", "n": "", "vs": [[29, "إن الآب الذي أعطاني إياها هو أعظم من الجميع، ولا يقدر أحد أن ينتزع من يد الآب شيئا."]]}, {"l": "Joh 10:30", "n": "", "vs": [[30, "أنا والآب واحد!»"]]}, {"l": "Rom 4:21", "n": "", "vs": [[21, "وإذ اقتنع تماما بأن ما وعده الله به هو قادر أن يفعله؛"]]}, {"l": "Rom 16:25", "n": "", "vs": [[25, "والمجد للقادر أن يثبتكم، وفقا لإنجيلي وللبشارة بيسوع المسيح، ووفقا لإعلان ما كان سرا ظل مكتوما مدى الأزمنة الأزلية،"]]}, {"l": "Heb 7:25", "n": "", "vs": [[25, "وهو لذلك قادر دائما أن يحقق الخلاص الكامل للذين يتقربون به إلى الله. فهو، في حضرة الله، حي على الدوام ليتضرع من أجلهم ويحامي عنهم!"]]}, {"l": "Heb 11:19", "n": "", "vs": [[19, "فقد آمن إبراهيم بأن الله قادر على إقامة إسحاق من الموت. والواقع أن إبراهيم استعاد ابنه من الموت، على سبيل المثال أو الرمز."]]}, {"l": "Heb 13:20", "n": "", "vs": [[20, "وأسأل الله ، إله السلام الذي أقام من بين الأموات ربنا يسوع راعي الخراف العظيم بفضل دمه الذي ختم به العهد الأبدي"]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}, {"l": "Jam 4:12", "n": "", "vs": [[12, "وليس للشريعة إلا قاض واحد، هو الله واضعها، وهو وحده القادر أن يحكم بالخلاص أو بالهلاك. فمن تكون أنت لتحكم على الآخرين؟"]]}, {"l": "Jud 1:24", "n": "", "vs": [[24, "وللقادر أن يحرسكم من السقوط حتى يوصلكم إلى المثول أمامه في المجد مبتهجين ولا عيب فيكم …"]]}], "kwAr": "والقادر أن يفعل", "noteAr": ""}, {"kw": "exceeding", "raw": "Exo_34:6; 2Sa_7:19; 1Ki_3:13; Psa_36:8, Psa_36:9; Son_5:1; Isa_35:2, Isa_55:7; Joh_10:10; 1Co_2:9; 1Ti_1:14; 2Pe_1:11", "note": "", "refs": [{"l": "Exo 34:6", "n": "", "vs": [[6, "وعبر من أمام موسى مناديا: «أنا الرب. الرب إله رؤوف رحيم، بطيء الغضب وكثير الإحسان والوفاء."]]}, {"l": "2Sa 7:19", "n": "", "vs": [[19, "وكأن هذا الأمر صغر في عينيك ياسيدي الرب، فرحت تتعهد بالحفاظ على ذرية عبدك إلى زمن طويل. وهذا ما يتوق إليه قلب الإنسان؟"]]}, {"l": "1Ki 3:13", "n": "", "vs": [[13, "وقد أنعمت عليك أيضا بما لم تسأله، من غنى ومجد، حتى لا يكون لك نظير بين الملوك في أيامك."]]}, {"l": "Psa 36:8", "n": "", "vs": [[8, "يرتوون من خيرات بيتك، ومن نهر نعمك تسقيهم."]]}, {"l": "Psa 36:9", "n": "", "vs": [[9, "لأن عندك نبع الحياة، وبنورك نرى النور."]]}, {"l": "Son 5:1", "n": "", "vs": [[1, "(المحب): قد جئت إلى جنتي ياأختي، ياعروسي، وقطفت مري مع أطيابي، وأكلت شهدي مع عسلي، وشربت خمري مع لبني.(بنات أورشليم): كلوا أيها الخلان. اشربوا حتى الانتشاء أيها المحبون."]]}, {"l": "Isa 35:2", "n": "", "vs": [[2, "تزدهر ازدهارا، وتبتهج أشد بهجة ويضفى عليها مجد لبنان وجلال الكرمل وشارون ويشهدون مجد الرب وبهاء إلهنا."]]}, {"l": "Isa 55:7", "n": "", "vs": [[7, "ليترك الشرير طريقه والأثيم أفكاره، وليتب إلى الرب فيرحمه، وليرجع إلى إلهنا لأنه يكثر الغفران."]]}, {"l": "Joh 10:10", "n": "", "vs": [[10, "السارق لا يأتي إلا ليسرق ويذبح ويهلك. أما أنا فقد أتيت لتكون لهم حياة، بل ملء الحياة!"]]}, {"l": "1Co 2:9", "n": "", "vs": [[9, "لما صلبوا رب المجد! ولكن، وفقا لما كتب: «إن ما لم تره عين، ولم تسمع به أذن، ولم يخطر على بال بشر قد أعده الله لمحبيه!»"]]}, {"l": "1Ti 1:14", "n": "", "vs": [[14, "إلا أن نعمة ربنا قد فاضت علي فوق كل حد، ومعها الإيمان والمحبة، وذلك في المسيح يسوع."]]}, {"l": "2Pe 1:11", "n": "", "vs": [[11, "وهكذا يفتح الله لكم الباب واسعا للدخول إلى الملكوت الأبدي، ملكوت ربنا ومخلصنا يسوع المسيح."]]}], "kwAr": "ما يفوق بلا حصر", "noteAr": ""}, {"kw": "according", "raw": "Eph_3:7, Eph_1:19; Col_1:29", "note": "", "refs": [{"l": "Eph 3:7", "n": "", "vs": [[7, "الذي صرت أنا خادما له بحسب نعمة الله الموهوبة لي وفقا لعمل قدرته."]]}, {"l": "Eph 1:19", "n": "", "vs": [[19, "وما هي عظمة قدرته الفائقة المعلنة لنا نحن المؤمنين، بحسب عمل اقتدار قوته"]]}, {"l": "Col 1:29", "n": "", "vs": [[29, "ولأجل هذا أتعب أنا أيضا وأجاهد، بفضل قدرته العاملة في بقوة."]]}], "kwAr": "وفقا للقدرة العاملة فينا", "noteAr": ""}], "arS": [["والقادر", ["G1410"]], [" أن ", []], ["يفعل", ["G4160"]], ["، وفقا ", []], ["للقدرة", ["G1411"]], [" ", []], ["العاملة", ["G1754"]], [" فينا، ما ", []], ["يفوق بلا حصر", ["G5228", "G1537", "G4053"]], [" ", []], ["كل", ["G3956"]], [" ما ", []], ["نطلب", ["G154"]], [" أو ", []], ["نتصور", ["G3539"]], ["،", []]]}, {"c": 3, "v": 21, "text": "له المجد في الكنيسة، في المسيح يسوع، مدى الأجيال والدهور! آمين …", "groups": [{"kw": "be", "raw": "Eph_1:6; 1Ch_29:11; Psa_29:1, Psa_29:2, Psa_72:19, Psa_115:1; Isa_6:3, Isa_42:12; Mat_6:13; Luk_2:14; Rom_11:36, Rom_16:27; Gal_1:5; Phi_2:11, Phi_4:20; 2Ti_4:18; Heb_13:21; 1Pe_5:11; Rev_4:9-11, Rev_5:9-14, Rev_7:12-17", "note": "", "refs": [{"l": "Eph 1:6", "n": "", "vs": [[6, "بغرض مدح مجد نعمته التي بها أعطانا حظوة لديه في المحبوب:"]]}, {"l": "1Ch 29:11", "n": "", "vs": [[11, "لك يارب العظمة والسطوة والجلال والبهاء والمجد، لأن لك كل ما في السماء والأرض. أنت يارب صاحب الملك وقد تعاليت فوق رؤوس الجميع."]]}, {"l": "Psa 29:1", "n": "", "vs": [[1, "قدموا للرب ياأبناء الله، قدموا للرب مجدا وعزا."]]}, {"l": "Psa 29:2", "n": "", "vs": [[2, "قدموا للرب مجدا لاَسمه. اسجدوا للرب بثوب الإجلال والقداسة."]]}, {"l": "Psa 72:19", "n": "", "vs": [[19, "تبارك اسمه المجيد إلى الأبد، ولتمتليء الأرض كلها من مجده. آمين ثم آمين."]]}, {"l": "Psa 115:1", "n": "", "vs": [[1, "لا تمجدنا يارب، بل مجد اسمك، من أجل رحمتك وحقك."]]}, {"l": "Isa 6:3", "n": "", "vs": [[3, "ونادى أحدهم الآخر: «قدوس، قدوس، قدوس الرب القدير. مجده ملء كل الأرض»."]]}, {"l": "Isa 42:12", "n": "", "vs": [[12, "وليمجدوا الرب ويذيعوا حمده في الجزائر."]]}, {"l": "Mat 6:13", "n": "", "vs": [[13, "ولا تدخلنا في تجربة، لكن نجنا من الشرير، لأن لك الملك والقوة والمجد إلى الأبد. آمين."]]}, {"l": "Luk 2:14", "n": "", "vs": [[14, "«المجد لله في الأعالي، وعلى الأرض السلام؛ وبالناس المسرة! »"]]}, {"l": "Rom 11:36", "n": "", "vs": [[36, "فإن منه وبه وله كل شيء. له المجد إلى الأبد. آمين!"]]}, {"l": "Rom 16:27", "n": "", "vs": [[27, "المجد لله إلى الأبد، الحكيم وحده، بيسوع المسيح. آمين!"]]}, {"l": "Gal 1:5", "n": "", "vs": [[5, "له المجد إلى أبد الآبدين. آمين!"]]}, {"l": "Phi 2:11", "n": "", "vs": [[11, "ولكي يعترف كل لسان بأن يسوع المسيح هو الرب، لمجد الله الآب."]]}, {"l": "Phi 4:20", "n": "", "vs": [[20, "فلإلهنا وأبينا، المجد إلى دهر الدهور. آمين!"]]}, {"l": "2Ti 4:18", "n": "", "vs": [[18, "وسينجيني الرب من كل عمل شرير ويحفظني سالما لملكوته السماوي. فله المجد إلى أبد الآبدين آمين!"]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}, {"l": "1Pe 5:11", "n": "", "vs": [[11, "له المجد والسلطة إلى أبد الآبدين. آمين!"]]}, {"l": "Rev 4:9-11", "n": "", "vs": [[9, "وكلما قدمت هذه الكائنات التمجيد والإجلال والحمد للجالس على العرش، الحي إلى أبد الآبدين،"], [10, "يجثو الشيوخ الأربعة والعشرون أمام الجالس على العرش ساجدين للحي إلى أبد الآبدين، ويلقون أكاليلهم أمام عرشه وهم يهتفون:"], [11, "«مستحق أنت ياربنا وإلهنا المجد والإجلال والقدرة، لأنك خلقت الأشياء كلها، وهي بإرادتك كائنة وقد خلقت!»"]]}, {"l": "Rev 5:9-14", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"], [10, "وجعلتهم مملكة لإلهنا وكهنة له، وسيملكون على الأرض»."], [11, "ثم نظرت، فسمعت ترتيل الملايين من الملائكة وهي تحيط بالعرش وبالكائنات الحية والشيوخ،"], [12, "وهم يهتفون بصوت عال: «مستحق هو الحمل المذبوح أن ينال القدرة والغنى والحكمة والقوة والإجلال والمجد والبركة»."], [13, "ثم سمعت كل خليقة في السماء وعلى الأرض، وتحت الأرض، وعلى البحر، هاتفة مع كل ما فيها: «البركة والإجلال والمجد والسلطة للجالس على العرش وللحمل، إلى أبد الآبدين»."], [14, "فردت الكائنات الحية الأربعة: «آمين!» وجثا الشيوخ ساجدين."]]}, {"l": "Rev 7:12-17", "n": "", "vs": [[12, "قائلين: «آمين! لإلهنا البركة والمجد والحكمة والشكر والإجلال والقدرة والقوة إلى أبد الآبدين. آمين!»"], [13, "وسألني أحد الشيوخ: «أتعلم من هم هؤلاء الذين يرتدون الثياب البيضاء، وهل تعرف من أين أتوا؟»"], [14, "فأجبته: «أنت أعلم ياسيدي!» فقال: «هؤلاء هم الذين أتوا من الضيقة العظيمة، وقد غسلوا ثيابهم وبيضوها بدم الحمل."], [15, "لهذا هم أمام عرش الله يخدمونه في هيكله ليلا ونهارا والجالس على العرش يبسط خيمته عليهم،"], [16, "فلن يجوعوا ولن يعطشوا، ولن تضربهم الشمس ولا أي حر،"], [17, "لأن الحمل الذي في وسط العرش يرعاهم ويقودهم إلى ينابيع ماء الحياة، ويمسح الله كل دمعة من عيونهم»."]]}], "kwAr": "له المجد في الكنيسة", "noteAr": ""}, {"kw": "by", "raw": "Phi_1:11; Heb_13:15, Heb_13:16; 1Pe_2:5", "note": "", "refs": [{"l": "Phi 1:11", "n": "", "vs": [[11, "كاملين في ثمار البر الآتية بيسوع المسيح، لمجد الله وحمده."]]}, {"l": "Heb 13:15", "n": "", "vs": [[15, "فبالمسيح، رئيس كهنتنا، لنقرب لله دائما ذبيحة الحمد والتسبيح، أي الثمار التي تنتجها أفواهنا المعترفة باسمه."]]}, {"l": "Heb 13:16", "n": "", "vs": [[16, "ولا تغفلوا أيضا عن عمل الخير وإعانة المحتاجين: لأن مثل هذه «الذبائح» تسر الله جدا!"]]}, {"l": "1Pe 2:5", "n": "", "vs": [[5, "إذن اتحدوا به كحجارة حية، مبنيين بيتا روحيا، تكونون فيه كهنة مقدسين تقدمون لله ذبائح روحية مقبولة لديه بفضل يسوع المسيح."]]}], "kwAr": "في المسيح يسوع", "noteAr": ""}, {"kw": "throughout", "raw": "Eph_2:7; 1Pe_5:11; 2Pe_3:18; Jud_1:25", "note": "", "refs": [{"l": "Eph 2:7", "n": "", "vs": [[7, "وذلك كي يعرض في الدهور القادمة غنى نعمته الفائق في لطفه علينا في المسيح يسوع."]]}, {"l": "1Pe 5:11", "n": "", "vs": [[11, "له المجد والسلطة إلى أبد الآبدين. آمين!"]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}, {"l": "Jud 1:25", "n": "", "vs": [[25, "لله الواحد، مخلصنا بيسوع المسيح ربنا ... المجد والجلال والقدرة والسلطة، من قبل أن كان الزمان، والآن وطوال الأزمان آمين!"]]}], "kwAr": "مدى الأجيال والدهور", "noteAr": ""}], "arS": [["له ", []], ["المجد", ["G1391"]], [" في ", []], ["الكنيسة", ["G1577"]], ["، في ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], ["، مدى ", []], ["الأجيال", ["G1074"]], [" ", []], ["والدهور", ["G165"]], ["! ", []], ["آمين", ["G281"]], [" …", []]]}, {"c": 4, "v": 1, "text": "... إذن، أنا السجين في الرب، أناشدكم أن تسلكوا سلوكا يليق بالدعوة التي إليها دعيتم،", "groups": [{"kw": "prisoner", "raw": "Eph_3:1", "note": "", "refs": [{"l": "Eph 3:1", "n": "", "vs": [[1, "لهذا السبب، أنا بولس سجين المسيح يسوع لأجلكم أنتم الأمم …"]]}], "kwAr": "أنا السجين", "noteAr": ""}, {"kw": "of the Lord", "raw": "or, in the Lord", "note": "or, in the Lord", "refs": [], "kwAr": "في الرب", "noteAr": "أو: في الرب."}, {"kw": "beseech", "raw": "Jer_38:20; Rom_12:1; 1Co_4:16; 2Co_5:20, 2Co_6:1, 2Co_10:1; Gal_4:12; Phm_1:9, Phm_1:10; 1Pe_2:11; 2Jo_1:5", "note": "", "refs": [{"l": "Jer 38:20", "n": "", "vs": [[20, "فقال إرميا: «إنك لن تسلم إليهم. اسمع لصوت الرب في كل ما أقوله لك، فتنعم بالخير وتنجو نفسك."]]}, {"l": "Rom 12:1", "n": "", "vs": [[1, "لذلك أتوسل إليكم أيها الإخوة، نظرا لمراحم الله، أن تقدموا له أجسادكم ذبيحة مقدسة مقبولة عنده، وهي عبادتكم بعقل."]]}, {"l": "1Co 4:16", "n": "", "vs": [[16, "فأدعوكم إذن إلى الاقتداء بي."]]}, {"l": "2Co 5:20", "n": "", "vs": [[20, "فنحن إذن سفراء المسيح، وكأن الله يعظ بنا نتوسل بالنيابة عن المسيح منادين: «تصالحوا مع الله!»"]]}, {"l": "2Co 6:1", "n": "", "vs": [[1, "فبما أننا عاملون معا عند الله، نطلب ألا يكون قبولكم لنعمة الله عبثا."]]}, {"l": "2Co 10:1", "n": "", "vs": [[1, "ولكني أتوسل إليكم بوداعة المسيح وحلمه، أنا بولس «المتواضع وأنا حاضر بينكم، والجريء عليكم وأنا غائب عنكم»،"]]}, {"l": "Gal 4:12", "n": "", "vs": [[12, "أتوسل إليكم أيها الإخوة، أن تكونوا مثلي، لأني أنا أيضا مثلكم. أنتم لم تظلموني بشيء،"]]}, {"l": "Phm 1:9", "n": "", "vs": [[9, "إلا أني، إكراما للمحبة، اخترت أن أقدم إليك التماسا، بصفتي بولس العجوز والسجين حاليا لأجل المسيح يسوع."]]}, {"l": "Phm 1:10", "n": "", "vs": [[10, "فألتمس منك لأجل ولدي الذي ولدته وأنا مكبل بالقيود، أونسيموس،"]]}, {"l": "1Pe 2:11", "n": "", "vs": [[11, "أيها الأحباء، ما أنتم إلا غرباء تزورون الأرض زيارة عابرة. لذلك أطلب إليكم أن تبتعدوا عن الشهوات الجسدية التي تصارع النفس."]]}, {"l": "2Jo 1:5", "n": "", "vs": [[5, "وا لآن، أيتها السيدة، لي رجاء أطلبه منك، ولا تعتبريه وصية جديدة. وإنما هو تلك الوصية الموجودة عندنا منذ البداية،: أن يحب بعضنا بعضا."]]}], "kwAr": "أناشدكم", "noteAr": ""}, {"kw": "walk", "raw": "Eph_4:17, Eph_5:2; Gen_5:24, Gen_17:1; Act_9:31; Phi_1:27, Phi_3:17, Phi_3:18; Col_1:10, Col_4:12; 1Th_2:12, 1Th_4:1, 1Th_4:2; Tit_2:10; Heb_13:21", "note": "", "refs": [{"l": "Eph 4:17", "n": "", "vs": [[17, "أقول هذا إذن، وأشهد في الرب، راجيا ألا تسلكوا فيما بعد كما يسلك الأمم في عقم ذهنهم،"]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "Gen 5:24", "n": "", "vs": [[24, "وسار أخنوخ مع الله، ثم توارى من الوجود، لأن الله نقله إليه."]]}, {"l": "Gen 17:1", "n": "", "vs": [[1, "وعندما كان أبرام في التاسعة والتسعين من عمره، ظهر له الرب قائلا: «أنا هو الله القدير. سر أمامي وكن كاملا،"]]}, {"l": "Act 9:31", "n": "", "vs": [[31, "في أثناء ذلك كانت الكنيسة في مناطق اليهودية والجليل والسامرة تتمتع بالسلام. وكانت تنمو وتسير في تقوى الر ب، بمساندة الروح القدس."]]}, {"l": "Phi 1:27", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"]]}, {"l": "Phi 3:17", "n": "", "vs": [[17, "كونوا جميعا، أيها الإخوة، مقتدين بي؛ ولاحظوا الذين يسلكون بحسب القدوة التي ترونها فينا."]]}, {"l": "Phi 3:18", "n": "", "vs": [[18, "فإن كثيرين ممن يسلكون بينكم، وقد ذكرتهم لكم مرارا وأذكرهم الآن أيضا باكيا، إنما هم أعداء لصليب المسيح."]]}, {"l": "Col 1:10", "n": "", "vs": [[10, "لكي تسلكوا سلوكا لائقا بالرب ومرضيا في كل شيء، منتجين الثمر في كل عمل صالح ونامين في معرفة الله إلى التمام،"]]}, {"l": "Col 4:12", "n": "", "vs": [[12, "يسلم عليكم أبفراس الذي هو منكم، وهو عبد للمسيح يسوع، يجاهد كل حين لأجلكم في الصلوات لتثبتوا كاملين ولكم تمام اليقين من جهة مشيئة الله كلها."]]}, {"l": "1Th 2:12", "n": "", "vs": [[12, "ونحرضكم أن تسلكوا سلوكا يليق بالله، ذاك الذي يدعوكم إلى ملكوته ومجده."]]}, {"l": "1Th 4:1", "n": "", "vs": [[1, "وبعد، أيها الإخوة، فمثلما تلقيتم منا كيف يجب أن تسلكوا سلوكا يرضي الله ، وكما أنتم فاعلون، نرجو منكم ونحرضكم في الرب يسوع أن تضاعفوا تقدمكم في ذلك أكثر فأكثر."]]}, {"l": "1Th 4:2", "n": "", "vs": [[2, "فإنكم تعرفون الوصايا التي لقناكم إياها من قبل الرب يسوع."]]}, {"l": "Tit 2:10", "n": "", "vs": [[10, "ولا سارقين، بل مظهرين أمانة كلية صالحة، لكي يزينوا في كل شيء تعليم مخلصنا الله."]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}], "kwAr": "أن تسلكوا سلوكا", "noteAr": ""}, {"kw": "vocation", "raw": "Eph_4:4; Rom_8:28-30; Phi_3:14; 2Th_1:11; 2Ti_1:9; Heb_3:1; 1Pe_3:9, 1Pe_5:10; 2Pe_1:3", "note": "", "refs": [{"l": "Eph 4:4", "n": "", "vs": [[4, "مثلما دعيتم، جميعكم، دعوة لها رجاء واحد."]]}, {"l": "Rom 8:28-30", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."], [29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."], [30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."]]}, {"l": "Phi 3:14", "n": "", "vs": [[14, "إذ أسعى إلى الهدف، لنوال تلك الجائزة التي يدعونا الله إليها دعوة عليا في المسيح يسوع."]]}, {"l": "2Th 1:11", "n": "", "vs": [[11, "لأجل ذلك أيضا نصلي من أجلكم على الدوام، لكي يجعلكم إلهنا مؤهلين للدعوة الإلهية ويتم فيكم، بقدرته، كل ما يسره من الصلاح وفعالية الإيمان،"]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،"]]}, {"l": "Heb 3:1", "n": "", "vs": [[1, "إذن، أيها الإخوة القديسون الذين اشتركتم في الدعوة السماوية، تأملوا يسوع: الرسول ورئيس الكهنة في الإيمان الذي نتمسك به."]]}, {"l": "1Pe 3:9", "n": "", "vs": [[9, "لا تبادلوا الشر بشر، ولا الشتيمة بشتيمة. بل بالعكس: باركوا، فترثوا البركة، لأنه لهذا دعاكم الله ."]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}, {"l": "2Pe 1:3", "n": "", "vs": [[3, "إن الله، بقدرته الإلهية، قد زودنا بكل ما نحتاج إليه في الحيا ة الروحية المتصفة بالتقوى. ذلك أنه عرفنا بالمسيح الذي دعانا إلى مجده وفضيلته،"]]}], "kwAr": "يليق بالدعوة", "noteAr": ""}], "arS": [["... إذن، ", []], ["أنا", ["G1473"]], [" ", []], ["السجين", ["G1198"]], [" في ", []], ["الرب", ["G2962"]], ["، ", []], ["أناشدكم", ["G3870"]], [" أن ", []], ["تسلكوا", ["G4043"]], [" سلوكا ", []], ["يليق", ["G516"]], [" ", []], ["بالدعوة", ["G2821"]], [" التي إليها ", []], ["دعيتم", ["G2564"]], ["،", []]]}, {"c": 4, "v": 2, "text": "بكل تواضع ووداعة وطول بال، محتملين بعضكم بعضا في المحبة،", "groups": [{"kw": "lowliness", "raw": "Num_12:3; Psa_45:4, Psa_138:6; Pro_3:34, Pro_16:19; Isa_57:15, Isa_61:1-3; Zep_2:3; Zec_9:9; Mat_5:3-5, Mat_11:29; Act_20:19; 1Co_13:4, 1Co_13:5; Gal_5:22, Gal_5:23; Col_3:12, Col_3:13; 1Ti_6:11; 2Ti_2:25; Jam_1:21, Jam_3:15-18; 1Pe_3:15", "note": "", "refs": [{"l": "Num 12:3", "n": "", "v
