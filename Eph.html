لعنة والكذب والقتل والسرقة والفسق. قد تخطوا كل حد، وسفك الدم يعقبه سفك دم."]]}, {"l": "Joh 8:44", "n": "", "vs": [[44, "إنكم أولاد أبيكم إبليس، وترغبون أن تعملوا شهوات أبيكم. فهو من البدء كان قاتلا للناس، ولم يثبت في الحق لأنه خال من الحق! وعندما ينطق بالكذب فهو ينضح بما فيه، لأنه كذاب وأبو الكذب!"]]}, {"l": "Act 5:3", "n": "", "vs": [[3, "فقال له بطرس: «ياحنانيا، لماذا سمحت للشيطان أن يملأ قلبك، فكذبت على الروح القدس، واحتفظت لنفسك بجزء من ثمن الحقل؟"]]}, {"l": "Act 5:4", "n": "", "vs": [[4, "أما كان بقي لك لو لم تبعه؟ وبعد بيعه أما كان لك حق الاحتفاظ بثمنه؟ لماذا قصدت في قلبك أن تغش؟ إنك لم تكذب على الناس، بل على الله!»"]]}, {"l": "Col 3:9", "n": "", "vs": [[9, "لا يكذب أحدكم على الآخر، إذ قد نزعتم الإنسان العتيق وأعماله"]]}, {"l": "1Ti 1:10", "n": "", "vs": [[10, "والزناة ومضاجعي الذكور، وخطافي الناس والكذابين وشاهدي الزور. وذوي كل شر آخر يخالف التعليم الصحيح"]]}, {"l": "1Ti 4:2", "n": "", "vs": [[2, "في موجة رياء ينشرها معلمون دجالون لهم ضمائر كويت بالنار."]]}, {"l": "Tit 1:2", "n": "", "vs": [[2, "في رجاء الحياة الأبدية، التي وعد بها الله المنزه عن الكذب، من قبل أزمنة الأزل،"]]}, {"l": "Tit 1:12", "n": "", "vs": [[12, "وقد قال واحد منهم، وهو عندهم نبي خاص بهم: «أهل كريت دائما كذابون، وحوش شرسة، نهمون كسالى»."]]}, {"l": "Rev 21:8", "n": "", "vs": [[8, "أما الجبناء وغير المؤمنين، والفاسدون والقاتلون والزناة، والمتصلون بالشياطين وعبدة الأصنام وجميع الدجالين، فمصيرهم إلى البحيرة المتقدة بالنار والكبريت، الذي هو الموت الثاني»."]]}, {"l": "Rev 22:15", "n": "", "vs": [[15, "أما في خارج المدينة، فهنالك الكلاب والمتصلون بالشياطين، والزناة والقتلة، وعبدة الأصنام والدجالون ومحبو التدجيل!"]]}], "kwAr": "اخلعوا عنكم الكذب", "noteAr": ""}, {"kw": "speak", "raw": "Eph_4:15; Pro_8:7, Pro_12:17; Zec_8:16, Zec_8:19; 2Co_7:14; Col_3:9", "note": "", "refs": [{"l": "Eph 4:15", "n": "", "vs": [[15, "بل نتمسك بالحق في المحبة، فننمو في كل شيء نحو من هو الرأس، أي المسيح."]]}, {"l": "Pro 8:7", "n": "", "vs": [[7, "لأن فمي يتكلم بالصدق، وشفتي تمقتان الإثم."]]}, {"l": "Pro 12:17", "n": "", "vs": [[17, "من ينطق بالصدق يشهد بالحق، أما شاهد الزور فيتكلم بالكذب."]]}, {"l": "Zec 8:16", "n": "", "vs": [[16, "وهذا ما عليكم أن تفعلوه: لا تكذبوا بعضكم على بعض، واحكموا في ساحات قضائكم بالعدل وأحكام السلام."]]}, {"l": "Zec 8:19", "n": "", "vs": [[19, "«هذا ما يقوله الرب القدير: إن أصوامكم في الشهور الرابع والخامس والسابع والعاشر ستكون مواسم ابتهاج وفرح وأعياد سعيدة يتمتع بها شعب يهوذا، لهذا أحبوا الحق والسلام."]]}, {"l": "2Co 7:14", "n": "", "vs": [[14, "فإذا كنت قد افتخرت له بشيء فيما يتعلق بكم، فإني لم أخجل؛ وإنما كما كلمناكم في كل شيء بالصدق، كذلك كان افتخارنا بكم لتيطس صادقا أيضا."]]}, {"l": "Col 3:9", "n": "", "vs": [[9, "لا يكذب أحدكم على الآخر، إذ قد نزعتم الإنسان العتيق وأعماله"]]}], "kwAr": "وتكلموا بالصدق", "noteAr": ""}, {"kw": "for", "raw": "Eph_5:30; Rom_12:5; 1Co_10:17, 12:12-27", "note": "", "refs": [{"l": "Eph 5:30", "n": "", "vs": [[30, "فإننا نحن أعضاء جسده."]]}, {"l": "Rom 12:5", "n": "", "vs": [[5, "فكذلك نحن الكثيرين جسد واحد في المسيح، وكلنا أعضاء بعضنا لبعض."]]}, {"l": "1Co 10:17", "n": "", "vs": [[17, "فإننا نحن الكثيرين رغيف واحد، أي جسد واحد، لأننا جميعا نشترك في الرغيف الواحد."]]}, {"l": "1Co 12:12-27", "n": "", "vs": [[12, "فكما أن الجسد واحد وله أعضاء كثيرة، ولكن أعضاء الجسد كلها تشكل جسما واحدا مع أنها كثيرة، فكذلك حال المسيح أيضا."], [13, "فإننا، بالروح الواحد، قد تعمدنا جميعا لنصير جسدا واحدا، سواء كنا يهودا أم يونانيين، عبيدا أم أحرارا، وقد سقينا جميعا الروح الواحد."], [14, "فليس الجسد عضوا واحدا بل مجموعة أعضاء."], [15, "فإن قالت الرجل: «لأني لست يدا، لست من الجسد!» فهل تصبح من خارج الجسد فعلا؟"], [16, "وإن قالت الأذن: «لأني لست عينا، لست من الجسد!» فهل تصبح من خارج الجسد فعلا؟"], [17, "فلو كان الجسد كله عينا، فكيف كنا نسمع؟ ولو كان كله أذنا، فكيف كنا نشم؟"], [18, "على أن الله قد رتب كلا من الأعضاء في الجسد كما أراد."], [19, "فلو كانت كلها عضوا واحدا، فكيف يتكون الجسد؟"], [20, "فالواقع أن الأعضاء كثيرة، والجسد واحد."], [21, "وهكذا، لا تستطيع العين أن تقول لليد: «أنا لا أحتاج إليك!» ولا الرأس أن تقول للرجلين: «أنا لا أحتاج إليكما!»،"], [22, "بل بالأحرى جدا، أعضاء الجسد التي تبدو أضعف الأعضاء هي ضرورية،"], [23, "وتلك التي نعتبرها أقل ما في الجسد كرامة، نكسوها بإكرام أوفر. والأعضاء غير اللائقة يكون لها لياقة أوفر؛"], [24, "أما اللائقة، فلا تحتاج إلى ذلك. ولكن الله أحكم صنع الجسد بجملته، معطيا كرامة أوفر لما تنقصه الكرامة،"], [25, "لكي لا يكون في الجسد انقسام بل يكون بين الأعضاء اهتمام واحد لمصلحة الجسد."], [26, "فحين يصيب الألم واحدا من الأعضاء، تشعر الأعضاء الباقية معه بالألم. وحين ينال واحد من الأعضاء إكراما، تفرح معه الأعضاء الباقية."], [27, "فالواقع أنكم أنتم جميعا جسد المسيح، وأعضاء فيه كل بمفرده."]]}], "kwAr": "لأننا أعضاء بعضنا لبعض", "noteAr": ""}], "arS": [["لذلك", ["G1352"]], [" ", []], ["اخلعوا", ["G659"]], [" عنكم ", []], ["الكذب", ["G5579"]], ["، ", []], ["وتكلموا", ["G2980"]], [" ", []], ["بالصدق", ["G225"]], [" ", []], ["كل واحد", ["G1538"]], [" مع ", []], ["قريبه", ["G4139"]], ["، لأننا ", []], ["أعضاء", ["G3196"]], [" ", []], ["بعضنا لبعض", ["G240"]], [".", []]]}, {"c": 4, "v": 26, "text": "إن غضبتم، فلا تخطئوا؛ لا تدعوا الشمس تغيب وأنتم غاضبون،", "groups": [{"kw": "ye", "raw": "Eph_4:31, Eph_4:32; Exo_11:8, Exo_32:21, Exo_32:22; Num_20:10-13, Num_20:24, Num_25:7-11; Neh_5:6-13; Psa_4:4, Psa_37:8, Psa_106:30-33; Pro_14:29, Pro_19:11, Pro_25:23; Ecc_7:9; Mat_5:22; Mar_3:5, Mar_10:14; Rom_12:19-21; Jam_1:19", "note": "", "refs": [{"l": "Eph 4:31", "n": "", "vs": [[31, "انزعوا عنكم كل حقد ونقمة وغضب وصخب وسباب وكل شر."]]}, {"l": "Eph 4:32", "n": "", "vs": [[32, "وكونوا لطفاء بعضكم نحو بعض، شفوقين، مسامحين بعضكم بعضا كما سامحكم الله في المسيح."]]}, {"l": "Exo 11:8", "n": "", "vs": [[8, "فيأتي إلي، من ثم، جميع عبيدك هؤلاء وينحنون أمامي قائلين: انطلق أنت وكل من يتبعك من الشعب. وآنئذ فقط أمضي» ثم انصرف من لدن فرعون بغضب محتدم."]]}, {"l": "Exo 32:21", "n": "", "vs": [[21, "وخاطب موسى هرون: «ماذا فعل بك هذا الشعب حتى جلبت عليه هذه الخطيئة العظيمة؟»"]]}, {"l": "Exo 32:22", "n": "", "vs": [[22, "فأجاب هرون: «لا يحتدم غضب سيدي. إنك تعرف شر هذا الشعب."]]}, {"l": "Num 20:10-13", "n": "", "vs": [[10, "وجمع موسى وهرون الشعب عند الصخرة وقالا لهم: «اسمعوا أيها المتمردون، أعلينا أن نخرج لكم من هذه الصخرة ماء؟»"], [11, "ورفع موسى يده وضرب الصخرة بعصاه مرتين، فتفجر ماء غزير، فشربت الجماعة ومواشيها."], [12, "فقال الرب لموسى وهرون: «من حيث أنكما لم تؤمنا بي حتى تقدساني على مرأى من بني إسرائيل فإنكما لن تدخلا هذا الشعب الأرض التي وهبتها لهم»."], [13, "فكان هذا ماء مريبة حيث خاصم الإسرائيليون الرب فأظهر قداسته أمامهم."]]}, {"l": "Num 20:24", "n": "", "vs": [[24, "«هرون لن يلبث أن يموت، لأنه لن يدخل الأرض التي وهبتها لبني إسرائيل، لأنكم عصيتم كلامي عند ماء مريبة»."]]}, {"l": "Num 25:7-11", "n": "", "vs": [[7, "فلما رأى فينحاس بن ألعازار بن هرون ذلك، هب من بين الجماعة، وتناول رمحا بيده،"], [8, "وتبع الإسرائيلي إلى الخيمة حيث طعنهما. فاخترق الرمح الرجل الإسرائيلي وبطن المرأة، فكف الوبأ عن بني إسرائيل."], [9, "وكان عدد الذين ماتوا بالوبإ أربعة وعشرين ألفا."], [10, "فقال الرب لموسى:"], [11, "«إن فينحاس بن ألعازار بن هرون الكاهن قد رد غضبي عن بني إسرائيل، إذ غار غيرتي في وسطهم، فلم أفن بني إسرائيل بغيرتي."]]}, {"l": "Neh 5:6-13", "n": "", "vs": [[6, "وحين سمعت صراخ شكواهم وكلامهم غضبت جدا."], [7, "وبعد أن تدبرت الأمر في نفسي عنفت الأشراف والولاة قائلا: «إنكم تأخذون الربا من إخوتكم». ثم عقدت اجتماعا عظيما لمقاضاتهم."], [8, "وقلت لهم: «إننا بحسب طاقتنا افتدينا بالأموال إخوتنا اليهود الذين بيعوا للأمم، وها أنتم تبيعون إخوتكم لهم، وهم يعودون فيبيعونهم لنا». فسكتوا ولم يجدوا جوابا."], [9, "ثم استطردت: «هذا تصرف سيء. ألا تسلكون في خوف إلهنا تفاديا لتعيير الأمم أعدائنا؟"], [10, "لقد أقرضت أنا وغلماني الشعب أيضا فضة وقمحا، فلنمتنع عن تقاضي الربا."], [11, "ردوا لهم هذا اليوم حقولهم وكرومهم وزيتونهم وبيوتهم، والنسبة المئوية من الربا التي تتقاضونها على الفضة والقمح والخمر والزيت»."], [12, "فأجابوا: «نرد ولا نطالبهم بربا، صانعين كل ما قلت». فاستدعيت الكهنة واستحلفتهم أن يفعلوا بمقتضى هذا التعهد،"], [13, "ثم نفضت حجري قائلا: «هكذا ينفض الله كل إنسان لا ينفذ هذا التعهد في بيته وفي عمله، فيصبح شريدا معدما». فأجابت كل الجماعة: «آمين». وسبحت الرب. ونفذ الشعب نص هذا التعهد."]]}, {"l": "Psa 4:4", "n": "", "vs": [[4, "ارتعدوا ولا تخطئوا. فكروا في قلوبكم على مضاجعكم معتصمين بالصمت."]]}, {"l": "Psa 37:8", "n": "", "vs": [[8, "كف عن الغضب، وانبذ السخط، ولا تتهور لئلا تفعل الشر."]]}, {"l": "Psa 106:30-33", "n": "", "vs": [[30, "فوقف فينحاس وأجرى القضاء، فامتنع الوبأ."], [31, "فحسب له ذلك برا جيلا فجيلا إلى الأبد."], [32, "ثم أسخطوا الرب عند مياه مريبة (أي الخصومة) حتى تأذى موسى بسببهم،"], [33, "إذ استفزوا روحه فأفرطت شفتاه بالكلام."]]}, {"l": "Pro 14:29", "n": "", "vs": [[29, "البطيء الغضب ذو فهم كثير، أما السريع إلى السخط فيبدي حماقة."]]}, {"l": "Pro 19:11", "n": "", "vs": [[11, "تعقل الإنسان يكبح غضبه، وبهاؤه في العفو عن الخطأ."]]}, {"l": "Pro 25:23", "n": "", "vs": [[23, "ريح الشمال تجلب المطر، واللسان النمام يستأثر بالنظرات الغاضبة."]]}, {"l": "Ecc 7:9", "n": "", "vs": [[9, "لا يستسلم قلبك سريعا للغضب، لأن الغضب يستقر في صدور الجهال."]]}, {"l": "Mat 5:22", "n": "", "vs": [[22, "أما أنا فأقول لكم: كل من هو غاضب على أخيه، يستحق المحاكمة؛ ومن يقول لأخيه: ياتافه! يستحق المثول أمام المجلس الأعلى؛ ومن يقول: ياأحمق! يستحق نار جهنم!"]]}, {"l": "Mar 3:5", "n": "", "vs": [[5, "فأدار يسوع نظره فيهم غاضبا وقد تضايق من صلابة قلوبهم، وقال للرجل: «مد يدك!» فمدها، فإذا هي قد عادت صحيحة."]]}, {"l": "Mar 10:14", "n": "", "vs": [[14, "فلما رأى يسوع ذلك، غضب وقال لهم: «دعوا الصغار يأتون إلي، ولا تمنعوهم، لأن لمثل هؤلاء ملكوت الله!"]]}, {"l": "Rom 12:19-21", "n": "", "vs": [[19, "لا تنتقموا لأنفسكم، أيها الأحباء، بل دعوا الغضب لله، لأنه قد كتب: «لي الانتقام، أنا أجازي، يقول الرب»."], [20, "وإنما «إن جاع عدوك فأطعمه، وإن عطش فاسقه. فإنك، بعملك هذا تجمع على رأسه جمرا مشتعلا»."], [21, "لا تدع الشر يغلبك، بل اغلب الشر بالخير."]]}, {"l": "Jam 1:19", "n": "", "vs": [[19, "لذلك، ياإخوتي الأحباء، على كل واحد منكم أن يكون مسرعا إلى الإصغاء، غير متسرع في الكلام، بطيء الغضب."]]}], "kwAr": "إن غضبتم فلا تخطئوا", "noteAr": ""}, {"kw": "let", "raw": "Deu_24:15", "note": "", "refs": [{"l": "Deu 24:15", "n": "", "vs": [[15, "ادفع له أجرته في يومه قبل غروب الشمس لأنه فقير، أجهد نفسه للحصول عليها. وإلا توجه إلى الرب بالشكوى ضدك، فتكون هذه عليك خطيئة."]]}], "kwAr": "لا تدعوا الشمس تغيب", "noteAr": ""}], "arS": [["إن ", []], ["غضبتم", ["G3710"]], ["، فلا ", []], ["تخطئوا", ["G264"]], ["؛ لا تدعوا ", []], ["الشمس", ["G2246"]], [" ", []], ["تغيب", ["G1931"]], [" وأنتم ", []], ["غاضبون", ["G3950"]], ["،", []]]}, {"c": 4, "v": 27, "text": "ولا تتيحوا فرصة لإبليس!", "groups": [{"kw": "", "raw": "Eph_6:11, Eph_6:16; Act_5:3; 2Co_2:10,2Co_2:11; Jam_4:7; 1Pe_5:8", "note": "", "refs": [{"l": "Eph 6:11", "n": "", "vs": [[11, "البسوا سلاح الله الكامل، لتتمكنوا من الصمود في وجه مكايد إبليس."]]}, {"l": "Eph 6:16", "n": "", "vs": [[16, "وفوق هذا كله، احملوا الإيمان ترسا به تقدرون أن تطفئوا جميع سهام الشرير المشتعلة."]]}, {"l": "Act 5:3", "n": "", "vs": [[3, "فقال له بطرس: «ياحنانيا، لماذا سمحت للشيطان أن يملأ قلبك، فكذبت على الروح القدس، واحتفظت لنفسك بجزء من ثمن الحقل؟"]]}, {"l": "2Co 2:10", "n": "", "vs": [[10, "فمن تسامحونه بشيء، أسامحه أنا أيضا. وإذا كنت أنا أيضا قد سامحت ذلك الرجل بشيء، فقد سامحته من أجلكم في حضرة المسيح،"]]}, {"l": "2Co 2:11", "n": "", "vs": [[11, "مخافة أن يستغلنا الشيطان مادمنا لا نجهل نياته."]]}, {"l": "Jam 4:7", "n": "", "vs": [[7, "إذن، كونوا خاضعين لله. وقاوموا إبليس فيهرب منكم."]]}, {"l": "1Pe 5:8", "n": "", "vs": [[8, "تعقلوا وتنبهوا. إن خصمكم إبليس كأسد يزأر، يجول باحثا عن فريسة يبتلعها."]]}], "kwAr": "", "noteAr": ""}], "arS": [["ولا ", []], ["تتيحوا", ["G1325"]], [" ", []], ["فرصة", ["G5117"]], [" ", []], ["لإبليس", ["G1228"]], ["!", []]]}, {"c": 4, "v": 28, "text": "ومن كان سارقا، فلا يسرق في ما بعد، بل بالأحرى ليكد ويستخدم يديه في عمل شريف ليكون عنده ما يشارك فيه المحتاجين.", "groups": [{"kw": "him that", "raw": "Exo_20:15, Exo_20:17, Exo_21:16; Pro_30:9; Jer_7:9; Hos_4:2; Zec_5:3; Joh_12:6; 1Co_6:10,1Co_6:11", "note": "", "refs": [{"l": "Exo 20:15", "n": "", "vs": [[15, "لا تسرق."]]}, {"l": "Exo 20:17", "n": "", "vs": [[17, "لا تشته بيت جارك، ولا زوجته، ولا عبده، ولا أمته، ولا ثوره، ولا حماره، ولا شيئا مما له»."]]}, {"l": "Exo 21:16", "n": "", "vs": [[16, "من يخطف إنسانا ويبعه أو يسترقه عنده حتما يمت."]]}, {"l": "Pro 30:9", "n": "", "vs": [[9, "لئلا أشبع فأجحدك قائلا: من هو الرب؟ أو أفتقر فأسرق وألطخ اسم إلهي بالعار."]]}, {"l": "Jer 7:9", "n": "", "vs": [[9, "أتسرقون وتقتلون وتزنون وتحلفون زورا وتبخرون للبعل، وتضلون وراء الأوثان التي لم تعرفوها،"]]}, {"l": "Hos 4:2", "n": "", "vs": [[2, "وتفشت فيها اللعنة والكذب والقتل والسرقة والفسق. قد تخطوا كل حد، وسفك الدم يعقبه سفك دم."]]}, {"l": "Zec 5:3", "n": "", "vs": [[3, "فقال لي: «هذه هي اللعنة المنصبة على وجه الأرض كلها. كل من يسرق يستأصل بمقتضى ما هو مدون فيها، وكل حالف زور يعاقب بموجب ما هو منصوص فيها»."]]}, {"l": "Joh 12:6", "n": "", "vs": [[6, "ولم يقل هذا لأنه كان يعطف على الفقراء، بل لأنه كان لصا، فقد كان أمينا للصندوق وكان يختلس مما يودع فيه."]]}, {"l": "1Co 6:10", "n": "", "vs": [[10, "ولا السراقون ولا الطماعون ولا السكيرون ولا الشتامون ولا المغتصبون."]]}, {"l": "1Co 6:11", "n": "", "vs": [[11, "وهكذا كان بعضكم، إلا أنكم قد اغتسلتم، بل تقدستم، بل تبررتم، باسم الرب يسوع المسيح وبروح إلهنا."]]}], "kwAr": "ومن كان سارقا", "noteAr": ""}, {"kw": "steal no more", "raw": "Job_34:32; Pro_28:13; Luk_3:8, Luk_3:10-14, Luk_19:8", "note": "", "refs": [{"l": "Job 34:32", "n": "", "vs": [[32, "علمني ما لا أراه، وإن كنت قد أثمت فإنني عنه أرتدع."]]}, {"l": "Pro 28:13", "n": "", "vs": [[13, "من يكتم آثامه لا يفلح، ومن يعترف بها ويقلع عنها يحظى بالرحمة."]]}, {"l": "Luk 3:8", "n": "", "vs": [[8, "فأثمروا أثمارا تليق بالتوبة، ولا تبتدئوا تقولون في أنفسكم: لنا إبراهيم أبا! فإني أقول لكم إن الله قادر أن يطلع من هذه الحجارة أولادا لإبراهيم."]]}, {"l": "Luk 3:10-14", "n": "", "vs": [[10, "وسألته الجموع: «فماذا نفعل إذن؟»"], [11, "فأجابهم: «من كان عنده ثوبان، فليعط من لا ثوب عنده؛ ومن كان عنده طعام، فليعمل كذلك أيضا»."], [12, "وجاء أيضا جباة ضرائب ليتعمدوا، فسألوه: «يامعلم، ماذا نفعل؟»"], [13, "فقال لهم: «لا تجبوا أكثر مما فرض لكم»."], [14, "وسأله أيضا بعض الجنود: «ونحن، ماذا نفعل؟» فأجابهم: «لا تظلموا أحدا ولا تشتكوا كذبا على أحد، واقنعوا بمرتباتكم! »"]]}, {"l": "Luk 19:8", "n": "", "vs": [[8, "ولكن زكا وقف وقال للرب: «يارب، ها أنا أعطي نصف أموالي للفقراء. وإن كنت قد اغتصبت شيئا من أحد، أرد له أربعة أضعاف!»"]]}], "kwAr": "فلا يسرق في ما بعد", "noteAr": ""}, {"kw": "labour", "raw": "Pro_13:11, Pro_14:23; Act_20:34, Act_20:35; 1Th_4:11, 1Th_4:12; 2Th_3:6-8, 2Th_3:11, 2Th_3:12", "note": "", "refs": [{"l": "Pro 13:11", "n": "", "vs": [[11, "مال الظلم يتبدد سريعا، والمال المدخر من تعب اليد يزداد."]]}, {"l": "Pro 14:23", "n": "", "vs": [[23, "في كل جهد مبذول ربح، أما مجرد الكلام فيؤدي إلى الفقر."]]}, {"l": "Act 20:34", "n": "", "vs": [[34, "وأنتم تعلمون أني اشتغلت بيدي هاتين لأسد حاجاتي وحاجات مرافقي."]]}, {"l": "Act 20:35", "n": "", "vs": [[35, "وقد أظهرت لكم بوضوح كيف يجب أن نبذل الجهد لنساعد المحتاجين، متذكرين كلمات الرب يسوع، إذ قال: الغبطة في العطاء أكثر مما في الأخذ!»"]]}, {"l": "1Th 4:11", "n": "", "vs": [[11, "وأن تسعوا بجد إلى العيش بهدوء، مهتمين بممارسة شؤونكم الخاصة، ومحصلين معيشتكم بعمل أيديكم، كما أوصيناكم."]]}, {"l": "1Th 4:12", "n": "", "vs": [[12, "عندئذ تكون سيرتكم حسنة السمعة تجاه الذين من خارج الكنيسة، ولا تكونون في حاجة إلى شيء."]]}, {"l": "2Th 3:6-8", "n": "", "vs": [[6, "ثم نوصيكم، أيها الإخوة، باسم ربنا يسوع المسيح، أن تعتزلوا عن كل أخ يسلك سلوكا فوضويا، لا يوافق التعليم الذي تلقيتم منا."], [7, "فأنتم أنفسكم تعرفون كيف ينبغي أن تقتدوا بنا، لأن سلوكنا بينكم لم يكن فوضويا،"], [8, "ولا أكلنا الخبز من عند أحد مجانا، بل كنا نشتغل بتعب وكد ليل نهار، لكي لا نكون عبئا ثقيلا على أي واحد منكم."]]}, {"l": "2Th 3:11", "n": "", "vs": [[11, "وقد سمعنا أن بينكم بعض الذين يسلكون سلوكا فوضويا فلا يشتغلون شيئا بل يتلهون بشؤون غيرهم."]]}, {"l": "2Th 3:12", "n": "", "vs": [[12, "فمثل هؤلاء نوصيهم ونناشدهم، في الرب يسوع المسيح، أن يكسبوا معيشتهم بأنفسهم، مشتغلين بهدوء."]]}], "kwAr": "بل بالأحرى ليكد", "noteAr": ""}, {"kw": "that he", "raw": "Luk_3:11, Luk_21:1-4; Joh_13:29; 2Co_8:2, 2Co_8:12", "note": "", "refs": [{"l": "Luk 3:11", "n": "", "vs": [[11, "فأجابهم: «من كان عنده ثوبان، فليعط من لا ثوب عنده؛ ومن كان عنده طعام، فليعمل كذلك أيضا»."]]}, {"l": "Luk 21:1-4", "n": "", "vs": [[1, "وتطلع فرأى الأغنياء يلقون تقدماتهم في صندوق الهيكل."], [2, "ورأى أيضا أرملة فقيرة تلقي فيه فلسين."], [3, "فقال: «الحق أقول لكم إن هذه الأرملة الفقيرة قد ألقت أكثر منهم جميعا."], [4, "لأن هؤلاء جميعا قد ألقوا في التقدمات من الفائض عنهم. وأما هي، فمن حاجتها ألقت كل ما تملكه لمعيشتها!»"]]}, {"l": "Joh 13:29", "n": "", "vs": [[29, "بل ظن بعضهم أنه يأمره أن يشتري ما يحتاجون إليه في العيد، أو أن يعطي الفقراء بعض المال، لأنه كان أمينا للصندوق."]]}, {"l": "2Co 8:2", "n": "", "vs": [[2, "فمع أنهم كانوا في تجربة ضيقة شديدة، فإن فرحهم الوافر مع فقرهم الشديد فاضا فأنتجا منهم سخاء غنيا."]]}, {"l": "2Co 8:12", "n": "", "vs": [[12, "فمتى وجد الاستعداد، يقبل العطاء على قدر ما يملك الإنسان، لا على قدر ما لا يملك."]]}], "kwAr": "ليكون عنده", "noteAr": ""}, {"kw": "give", "raw": "or, distribute, Rom_12:13; 2Co_9:12-15; 1Ti_6:18", "note": "or, distribute, Rom_12:13; 2Co_9:12-15; 1Ti_6:18", "refs": [{"l": "Rom 12:13", "n": "", "vs": [[13, "متعاونين على سد حاجات القديسين، مداومين على إضافة الغرباء."]]}, {"l": "2Co 9:12-15", "n": "", "vs": [[12, "ذلك لأن خدمة الله بهذه الإعانة لا تسد حاجة القديسين وحسب، بل تفيض بشكر كثير لله."], [13, "فإن القديسين، إذ يختبرون هذه الخدمة، يمجدون الله على طاعتكم في الشهادة لإنجيل المسيح وعلى السخاء الطوعي في مشاركتكم لهم وللجميع."], [14, "كما يرفعون الدعاء لأجلكم، متشوقين إليكم، بسبب نعمة الله الفائقة التي ظهرت فيكم."], [15, "فشكرا لله على عطيته المجانية التي تفوق الوصف!"]]}, {"l": "1Ti 6:18", "n": "", "vs": [[18, "وأن يفعلوا خيرا، ويكونوا أغنياء بالأعمال الصالحة، ويوزعوا بسخاء، ويكونوا على استعداد دائم لإشراك الآخرين في خيراتهم."]]}], "kwAr": "ما يشارك فيه المحتاجين", "noteAr": "أو: يوزّع."}], "arS": [["ومن كان ", []], ["سارقا", ["G2813"]], ["، فلا ", []], ["يسرق", ["G2813"]], [" في ما بعد، بل ", []], ["بالأحرى", ["G3123"]], [" ", []], ["ليكد", ["G2872"]], [" ويستخدم ", []], ["يديه", ["G5495"]], [" في ", []], ["عمل", ["G2038"]], [" ", []], ["شريف", ["G18"]], [" ليكون ", []], ["عنده", ["G2192"]], [" ما ", []], ["يشارك", ["G3330"]], [" فيه ", []], ["المحتاجين", ["G5532"]], [".", []]]}, {"c": 4, "v": 29, "text": "لا تخرج من أفواهكم كلمة فاسدة، بل الكلام الصالح للبنيان الذي تدعو إليه الحاجة، كي يعطي السامعين نعمة.", "groups": [{"kw": "no", "raw": "Eph_5:3, Eph_5:4; Psa_5:9, Psa_52:2, Psa_73:7-9; Mat_12:34-37; Rom_3:13, Rom_3:14; 1Co_15:32, 1Co_15:33; Col_3:8, Col_3:9, Col_4:6; Jam_3:2-8; 2Pe_2:18; Jud_1:13-16; Rev_13:5, Rev_13:6", "note": "", "refs": [{"l": "Eph 5:3", "n": "", "vs": [[3, "أما الزنى، وكل نجاسة أو شهوة نهمة، فلا يذكر بينكم حتى اسمها، كما يليق بالقديسين."]]}, {"l": "Eph 5:4", "n": "", "vs": [[4, "وكذلك البذاءة والكلام السفيه والهزل، فهي غير لائقة. وإنما أحرى بكم أن تلهجوا بالشكر لله!"]]}, {"l": "Psa 5:9", "n": "", "vs": [[9, "إذ ليس في أفواههم صدق وداخلهم مفاسد، حناجرهم قبور مفتوحة وألسنتهم أدوات للمكر."]]}, {"l": "Psa 52:2", "n": "", "vs": [[2, "لسانك يخترع المساويء، ويمارس الغش ويجرح كالموسى المسنونة."]]}, {"l": "Psa 73:7-9", "n": "", "vs": [[7, "عيونهم جاحظة من كثرة شحم طمعهم. وشرهم تجاوز ما يتصوره القلب."], [8, "يستهزئون ويتكلمون بالظلم خبثا، وبكبرياء ينطقون."], [9, "جدفوا على السماء بأفواههم، ولوثوا الأرض بخبث ألسنتهم."]]}, {"l": "Mat 12:34-37", "n": "", "vs": [[34, "ياأولاد الأفاعي، كيف تقدرون، وأنتم أشرار، أن تتكلموا كلاما صالحا؟ لأن الفم يتكلم بما يفيض به القلب."], [35, "فالإنسان الصالح، من الكنز الصالح في قلبه، يصدر ما هو صالح. والإنسان الشرير، يصدر ما هو شرير."], [36, "على أني أقول لكم: إن كل كلمة باطلة يتكلم بها الناس، سوف يؤدون عنها الحساب في يوم الدينونة."], [37, "فإنك بكلامك تبرر، وبكلامك تدان ! »"]]}, {"l": "Rom 3:13", "n": "", "vs": [[13, "حناجرهم قبور مفتوحة؛ ألسنتهم أدوات للمكر؛ شفاههم تخفي سم الأفاعي القاتلة؛"]]}, {"l": "Rom 3:14", "n": "", "vs": [[14, "أفواههم مملوءة لعنة ومرارة،"]]}, {"l": "1Co 15:32", "n": "", "vs": [[32, "ولو كنت بمنطق البشر قد تعرضت للموت في أفسس بين مخالب الوحوش، فأي نفع يعود علي إن كان الذين يموتون لا يقومون؟ ولم لا «نأكل ونشرب، لأننا غدا نموت؟»"]]}, {"l": "1Co 15:33", "n": "", "vs": [[33, "لا تنقادوا إلى الضلال: إن المعاشرات الرديئة تفسد الأخلاق الجيدة!"]]}, {"l": "Col 3:8", "n": "", "vs": [[8, "وأما الآن، فانزعوا عنكم، أنتم أيضا، هذه الخطايا كلها: الغضب، النقمة، الخبث، التجديف، الكلام القبيح الخارج من أفواهكم."]]}, {"l": "Col 3:9", "n": "", "vs": [[9, "لا يكذب أحدكم على الآخر، إذ قد نزعتم الإنسان العتيق وأعماله"]]}, {"l": "Col 4:6", "n": "", "vs": [[6, "ليكن كلامكم دائما مصحوبا بالنعمة، وليكن مصلحا بملح، فتعرفوا كيف يجب أن تجيبوا كل واحد."]]}, {"l": "Jam 3:2-8", "n": "", "vs": [[2, "فإننا جميعا معرضون للوقوع في أخطاء كثيرة. ولكن من يلجم لسانه ولا يخطيء في كلامه هو ناضج يقدر أن يسيطر على طبيعته سيطرة تامة."], [3, "فحين نضع لجاما في فم حصان، نتمكن من توجيهه واقتياده كما نريد."], [4, "ومهما كانت السفينة كبيرة والرياح التي تدفعها قوية وهوجاء، فبدفة صغيرة جدا يتحكم الربان فيها ويسوقها إلى الجهة التي يريد. كذلك اللسان أيضا: فهو عضو صغير،"], [5, "ولكن ما أشد فعاليته! انظروا: إن شرارة صغيرة تحرق غابة كبيرة!"], [6, "واللسان كالنار خطرا: فهو وحده، بين أعضاء الجسم، جامع للشرور كلها، ويلوث الجسم كله بالفساد. إنه يشعل دائرة الكون، ويستمد ناره من جهنم!"], [7, "من السهل على الإنسان أن يروض الوحوش والطيور والزواحف والحيوانات البحرية، بجميع أجناسها. فهذا ما نراه يحدث."], [8, "ولكن أحدا من الناس لا يقدر أن يروض اللسان. فهو شر لا ينضبط، ممتليء بالسم القتال!"]]}, {"l": "2Pe 2:18", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."]]}, {"l": "Jud 1:13-16", "n": "", "vs": [[13, "وبأعمالهم المخجلة يفضحون أنفسهم كأمواج في البحر هائجة تقذف الأوساخ. وهم أشبه بنجوم تائهة في الفضاء، مصيرها الظلام الشديد إلى الأبد!"], [14, "عن هؤلاء وأمثالهم، تنبأ أخنوخ السابع بعد آدم، فقال: «انظروا إن الرب آت بصحبة عشرات الألوف من قديسيه،"], [15, "ليدين جميع الناس، ويوبخ جميع الأشرار الذين لا يهابون الله ، بسبب جميع أعمالهم الشريرة التي ارتكبوها وجميع أقوالهم القاسية التي أهانوه بها والتي لا تصدر إلا عن الخاطئين الأشرار غير الأتقياء!»"], [16, "وهؤلاء المعلمون يتذمرون ويشكون دائما وفيما هم يندفعون وراء شهواتهم، يطلقون ألسنتهم متحدثين بأمور طنانة، ويمدحون من يعجبهم طلبا للمنفعة!"]]}, {"l": "Rev 13:5", "n": "", "vs": [[5, "وأعطى التنين الوحش فما ينطق بكلام الكبرياء والتجديف، وأعطاه سلطة العمل مدة اثنين وأربعين شهرا."]]}, {"l": "Rev 13:6", "n": "", "vs": [[6, "فأخذ الوحش يشتم اسم الله، ويشتم بيته وسكان السماء."]]}], "kwAr": "لا تخرج من أفواهكم كلمة فاسدة", "noteAr": ""}, {"kw": "that which", "raw": "Deu_6:6-9; Psa_37:30,Psa_37:31, Psa_45:2, Psa_71:17, Psa_71:18, Psa_71:24, Psa_78:4, Psa_78:5; Pro_10:31, Pro_10:32, Pro_12:13; Pro_15:2-4, Pro_15:7, Pro_15:23, Pro_16:21, Pro_25:11, Pro_25:12; Isa_50:4; Mal_3:16-18; Luk_4:22; 1Co_14:19; Col_3:16, Col_3:17, Col_4:6; 1Th_5:11", "note": "", "refs": [{"l": "Deu 6:6-9", "n": "", "vs": [[6, "وضعوا هذه الكلمات التي أوصيكم بها على قلوبكم،"], [7, "وقصوها على أولادكم، وتحدثوا بها حين تجلسون في بيوتكم، وحين تسيرون في الطريق، وحين تنامون، وحين تنهضون."], [8, "اربطوها علامة على أيديكم، واجعلوها عصائب على جباهكم."], [9, "اكتبوها على قوائم أبواب بيوتكم وبوابات مدنكم."]]}, {"l": "Psa 37:30", "n": "", "vs": [[30, "فم الصديق ينطق دائما بالحكمة، ويتفوه بكلام الحق"]]}, {"l": "Psa 37:31", "n": "", "vs": [[31, "شريعة إلهه ثابتة في قلبه، فلا تتقلقل خطواته."]]}, {"l": "Psa 45:2", "n": "", "vs": [[2, "أنت أبرع جمالا من كل بني البشر. انسكبت النعمة على شفتيك، لذلك باركك الله إلى الأبد."]]}, {"l": "Psa 71:17", "n": "", "vs": [[17, "قد علمتني ياالله منذ صباي، فلم أكف لحظة عن إعلان عجائبك."]]}, {"l": "Psa 71:18", "n": "", "vs": [[18, "لا تتركني في الشيخوخة والشيب ياالله ، حتى أخبر هذا الجيل بأعمال قدرتك، وبقوتك (الجيل) الآتي."]]}, {"l": "Psa 71:24", "n": "", "vs": [[24, "ويلهج لساني ببرك اليوم كله، لأن الساعين إلى أذيتي يحل حتما بهم الخزي والعار."]]}, {"l": "Psa 78:4", "n": "", "vs": [[4, "لا نكتمها عن أبنائنا بل نخبر الجيل القادم: عن قوة الرب وعجائبه التي صنع."]]}, {"l": "Psa 78:5", "n": "", "vs": [[5, "فإنه أعطى شرائع لبني إسرائيل وأوامر لذرية يعقوب، أوصى فيها آباءنا أن يعرفوا بها أبناءهم."]]}, {"l": "Pro 10:31", "n": "", "vs": [[31, "من فم الصديق تفيض الحكمة، واللسان المخاتل يقطع."]]}, {"l": "Pro 10:32", "n": "", "vs": [[32, "شفتا الصديق تدركان ما هو حق، فتنطقان به، وفم الشرير لا يتكلم إلا بالباطل."]]}, {"l": "Pro 12:13", "n": "", "vs": [[13, "يقع الشرير في فخ أكاذيب لسانه، أما الصديق فيفلت من الضيق."]]}, {"l": "Pro 15:2-4", "n": "", "vs": [[2, "لسان الحكيم يتقن المعرفة، وأقوال الجهال تفيض حماقة."], [3, "عينا الرب في كل مكان تراقبان الأشرار والأخيار."], [4, "اللسان السليم ينعش كشجرة حياة، واعوجاجه يؤدي إلى انكسار الروح."]]}, {"l": "Pro 15:7", "n": "", "vs": [[7, "أقوال شفاه الحكماء تنشر المعرفة، أما قلوب الجهال فتنبع حماقة."]]}, {"l": "Pro 15:23", "n": "", "vs": [[23, "الجواب الملائم يفرح الإنسان، وما أحسن الكلمة في حينها."]]}, {"l": "Pro 16:21", "n": "", "vs": [[21, "الحكيم القلب يدعى فهيما، وعذوبة المنطق تزيد من قوة الإقناع."]]}, {"l": "Pro 25:11", "n": "", "vs": [[11, "كلمة تقال في أوانها مثل تفاح من ذهب في مصوغ من فضة."]]}, {"l": "Pro 25:12", "n": "", "vs": [[12, "الموبخ الحكيم لأذن صاغية مثل قرط من ذهب وحلي من إبريز."]]}, {"l": "Isa 50:4", "n": "", "vs": [[4, "السيد الرب وهبني منطق العلماء لأعرف كيف أغيث المتعب بكلمة، ينبهني في كل صباح، ويرهف أذني حتى أسمع بانتباه المتعلمين."]]}, {"l": "Mal 3:16-18", "n": "", "vs": [[16, "ثم حدث خائفو الرب بعضهم بعضا. فأصغى الرب إلى كلامهم وسمعهم، فتم تدوين أسماء متقي الرب والمتأملين باسمه أمامه في كتاب تذكرة، ورد فيه:"], [17, "سيكونون لي، يقول الرب القدير، في اليوم الذي أصنع فيه نفائسي، وأحافظ عليهم كما يحافظ الوالد على ابنه الذي يخدمه."], [18, "فتشرعون ثانية في التمييز بين الصالح والطالح، بين من يعبد الله ومن لا يعبده»."]]}, {"l": "Luk 4:22", "n": "", "vs": [[22, "وشهد له جميع الحاضرين، متعجبين من كلام النعمة الخارج من فمه، وتساءلوا: «أليس هذا ابن يوسف؟»"]]}, {"l": "1Co 14:19", "n": "", "vs": [[19, "ولكن، حيث أكون في الكنيسة، أفضل أن أقول خمس كلمات بعقلي، لكي أعلم بها الآخرين أيضا، على أن أقول عشرة آلاف كلمة بلغة مجهولة."]]}, {"l": "Col 3:16", "n": "", "vs": [[16, "لتسكن كلمة المسيح في داخلكم بغنى، في كل حكمة، معلمين وواعظين بعضكم بعضا، مرنمين بمزامير وتسابيح وأناشيد روحية في قلوبكم لله، رافعين له الحمد."]]}, {"l": "Col 3:17", "n": "", "vs": [[17, "ومهما كان ما تعملونه، بالقول أو بالفعل، فليجر كل شيء باسم الرب يسوع، رافعين به الشكر لله الآب."]]}, {"l": "Col 4:6", "n": "", "vs": [[6, "ليكن كلامكم دائما مصحوبا بالنعمة، وليكن مصلحا بملح، فتعرفوا كيف يجب أن تجيبوا كل واحد."]]}, {"l": "1Th 5:11", "n": "", "vs": [[11, "لذلك عزوا بعضكم بعضا وشددوا أحدكم الآخر، كما أنتم فاعلون."]]}], "kwAr": "بل الكلام الصالح", "noteAr": ""}, {"kw": "to the use of edifying", "raw": "or, to edify profitably, Eph_4:12, Eph_4:16", "note": "or, to edify profitably, Eph_4:12, Eph_4:16", "refs": [{"l": "Eph 4:12", "n": "", "vs": [[12, "لتأهيل القديسين من جهة عمل الخدمة، لبنيان جسد المسيح،"]]}, {"l": "Eph 4:16", "n": "", "vs": [[16, "فمنه يستمد الجسد كله تماسكه وترابطه بمساندة كل مفصل وفقا لمقدار العمل المخصص لكل جزء، لينشيء نموا يؤول إلى بنيان الجسد بنيانا ذاتيا في المحبة."]]}], "kwAr": "للبنيان", "noteAr": "أو: للبنيان بشكل نافع."}, {"kw": "minister", "raw": "Mat_5:16; 1Pe_2:12, 1Pe_3:1", "note": "", "refs": [{"l": "Mat 5:16", "n": "", "vs": [[16, "هكذا، فليضيء نوركم أمام الناس، ليروا أعمالكم الحسنة ويمجدوا أباكم الذي في السماوات."]]}, {"l": "1Pe 2:12", "n": "", "vs": [[12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالحة يمجدون الله في يوم الافتقاد."]]}, {"l": "1Pe 3:1", "n": "", "vs": [[1, "كذلك، أيتها الزوجات، اخضعن لأزواجكن. حتى وإن كان الزوج غير مؤمن بالكلمة، تجذبه زوجته إلى الإيمان، بتصرفها اللائق دون كلام،"]]}], "kwAr": "كي يعطي السامعين نعمة", "noteAr": ""}], "arS": [["لا تخرج من ", []], ["أفواهكم", ["G4750", "G5216"]], [" ", []], ["كلمة", ["G3056"]], [" ", []], ["فاسدة", ["G4550"]], ["، بل الكلام ", []], ["الصالح", ["G18"]], [" ", []], ["للبنيان", ["G3619"]], [" الذي تدعو إليه ", []], ["الحاجة", ["G5532"]], ["، كي ", []], ["يعطي", ["G1325"]], [" ", []], ["السامعين", ["G191"]], [" ", []], ["نعمة", ["G5485"]], [".", []]]}, {"c": 4, "v": 30, "text": "ولا تحزنوا روح الله، الروح القدس الذي به ختمتم ليوم الفداء.", "groups": [{"kw": "grieve", "raw": "Gen_6:3, Gen_6:6; Jdg_10:16; Psa_78:40, Psa_95:10; Isa_7:13, Isa_43:24, Isa_63:10; Eze_16:43; Mar_3:5; Act_7:51; 1Th_5:19; Heb_3:10,Heb_3:17", "note": "", "refs": [{"l": "Gen 6:3", "n": "", "vs": [[3, "فقال الرب: «لن يمكث روحي مجاهدا في الإنسان إلى الأبد. هو بشري زائغ، لذلك لن تطول أيامه أكثر من مئة وعشرين سنة فقط»."]]}, {"l": "Gen 6:6", "n": "", "vs": [[6, "فملأ قلبه الأسف والحزن لأنه خلق الإنسان."]]}, {"l": "Jdg 10:16", "n": "", "vs": [[16, "وأزالوا الأوثان الغريبة من وسطهم وعبدوا الرب، فرق قلبه لمشقة إسرائيل."]]}, {"l": "Psa 78:40", "n": "", "vs": [[40, "كم تمردوا عليه في البرية وأحزنوه في الصحراء."]]}, {"l": "Psa 95:10", "n": "", "vs": [[10, "أربعين سنة رفضت ذلك الجيل، وقلت: «هم شعب أضلتهم قلوبهم ولم يعرفوا قط طرقي»."]]}, {"l": "Isa 7:13", "n": "", "vs": [[13, "عندئذ قال إشعياء: «اسمعوا يابيت داود: أما كفاكم أنكم أضجرتم الناس حتى تضجروا إلهي أيضا؟"]]}, {"l": "Isa 43:24", "n": "", "vs": [[24, "لم تشتر لي بخورا ذكى الرائحة، ولم تشبعني بشحم ذبائحك. إنما أعييتني بثقل آثامك وأرهقتني بذنوبك."]]}, {"l": "Isa 63:10", "n": "", "vs": [[10, "لكنهم تمردوا وأحزنوا روحه فاستحال إلى عدو لهم وحاربهم بنفسه."]]}, {"l": "Eze 16:43", "n": "", "vs": [[43, "ولأنك لم تذكري أيام حداثتك، وإنما أثرت حنقي بارتكاب جميع هذه الموبقات، ها أنا بدوري أعاقبك أشد العقاب، يقول السيد الرب، فلا تقترفين هذه الرذيلة فوق رجاساتك كلها."]]}, {"l": "Mar 3:5", "n": "", "vs": [[5, "فأدار يسوع نظره فيهم غاضبا وقد تضايق من صلابة قلوبهم، وقال للرجل: «مد يدك!» فمدها، فإذا هي قد عادت صحيحة."]]}, {"l": "Act 7:51", "n": "", "vs": [[51, "ثم قال استفانوس: «ياأصحاب الرقاب الصلبة والقلوب والآذان غير المختونة! إنكم دائما تقاومون الروح القدس. وكما فعل آباؤكم تفعلون!"]]}, {"l": "1Th 5:19", "n": "", "vs": [[19, "لا تخمدوا الروح،"]]}, {"l": "Heb 3:10", "n": "", "vs": [[10, "لذلك ثار غضبي على ذلك الجيل، وقلت: إن قلوبهم تدفعهم دائما إلى الضلال، ولم يعرفوا طرقي قط!"]]}, {"l": "Heb 3:17", "n": "", "vs": [[17, "وعلى من ثار غضب الله مدة أربعين سنة؟ على أولئك الذين أخطأوا، فسقطت جثثهم متناثرة في الصحراء!"]]}], "kwAr": "ولا تحزنوا روح الله", "noteAr": ""}, {"kw": "whereby", "raw": "Eph_1:13", "note": "", "refs": [{"l": "Eph 1:13", "n": "", "vs": [[13, "وفيه أنتم أيضا (وضعتم رجاءكم) إذ سمعتم كلمة الحق، أي الإنجيل الذي فيه خلاصكم؛ كذلك فيه أيضا ختمتم، إذ آمنتم، بالروح القدس الموعود،"]]}], "kwAr": "الذي به ختمتم", "noteAr": ""}, {"kw": "the day", "raw": "Eph_1:14; Hos_13:14; Luk_21:28; Rom_8:11, Rom_8:23; 1Co_1:30, 1Co_15:54", "note": "", "refs": [{"l": "Eph 1:14", "n": "", "vs": [[14, "هذا الروح الذي هو عربون ميراثنا إلى أن يتم فداء ما قد اقتني: بغر ض مدح مجده."]]}, {"l": "Hos 13:14", "n": "", "vs": [[14, "هل أفتديهم من قوة الهاوية؟ هل أنجيهم من الموت؟ أين أوبئتك ياموت؟ أين هلاكك ياهاوية؟ قد احتجبت الرحمة عن عيني."]]}, {"l": "Luk 21:28", "n": "", "vs": [[28, "ولكن عندما تبدأ هذه الأمور تحدث، فانتصبوا وارفعوا رؤوسكم لأن فداءكم يقترب»."]]}, {"l": "Rom 8:11", "n": "", "vs": [[11, "وإذا كان روح الذي أقام يسوع من بين الأموات يسكن فيكم، فإن الذي أقام المسيح من بين الأموات سوف يحيي أيضا أجسادكم الفانية بسبب روحه الذي يسكن فيكم."]]}, {"l": "Rom 8:23", "n": "", "vs": [[23, "وليس هي وحدها، بل أيضا نحن الذين لنا باكورة الروح، نحن أنفسنا نئن في قرارة نفوسنا مترقبين إعلان بنوتنا بافتداء أجسادنا."]]}, {"l": "1Co 1:30", "n": "", "vs": [[30, "وبفضل الله صار لكم مقام في المسيح يسوع الذي جعل لنا حكمة من الله وبرا وقداسة وفداء،"]]}, {"l": "1Co 15:54", "n": "", "vs": [[54, "وبعد أن يلبس هذا المنحل عدم انحلال، وهذا الفاني خلودا، تتم الكلمة التي قد كتبت: «ابتلع الموت في النصر!»"]]}], "kwAr": "ليوم الفداء", "noteAr": ""}], "arS": [["ولا ", []], ["تحزنوا", ["G3076"]], [" ", []], ["روح", ["G4151"]], [" ", []], ["الله", ["G2316"]], ["، ", []], ["الروح", ["G4151"]], [" ", []], ["القدس", ["G40"]], [" الذي به ", []], ["ختمتم", ["G4972"]], [" ", []], ["ليوم", ["G2250"]], [" ", []], ["الفداء", ["G629"]], [".", []]]}, {"c": 4, "v": 31, "text": "انزعوا عنكم كل حقد ونقمة وغضب وصخب وسباب وكل شر.", "groups": [{"kw": "bitterness", "raw": "Psa_64:3; Rom_3:14; Col_3:8, Col_3:19; Jam_3:14, Jam_3:15", "note": "", "refs": [{"l": "Psa 64:3", "n": "", "vs": [[3, "الذين سنوا ألسنتهم كالسيف، وصوبوا سهام كلامهم المر،"]]}, {"l": "Rom 3:14", "n": "", "vs": [[14, "أفواههم مملوءة لعنة ومرارة،"]]}, {"l": "Col 3:8", "n": "", "vs": [[8, "وأما الآن، فانزعوا عنكم، أنتم أيضا، هذه الخطايا كلها: الغضب، النقمة، الخبث، التجديف، الكلام القبيح الخارج من أفواهكم."]]}, {"l": "Col 3:19", "n": "", "vs": [[19, "أيها الأزواج، أحبوا زوجاتكم، ولا تعاملوهن بقسوة."]]}, {"l": "Jam 3:14", "n": "", "vs": [[14, "أما إن كانت قلوبكم مملوءة بمرارة الحسد وبالتحزب، فلا تفتخروا بحكمتكم، ولا تنكروا الحق."]]}, {"l": "Jam 3:15", "n": "", "vs": [[15, "إن هذه الحكمة التي تدعونها ليست نازلة من عند الله، بل هي «حكمة» أرضية بشرية شيطانية."]]}], "kwAr": "كل حقد", "noteAr": ""}, {"kw": "wrath", "raw": "Eph_4:26; Pro_14:17, Pro_19:12; Ecc_7:9; 2Co_12:20; Gal_5:20; Col_3:8; 2Ti_2:23; Tit_1:7; Jam_1:19, Jam_3:14-18, Jam_4:1, Jam_4:2", "note": "", "refs": [{"l": "Eph 4:26", "n": "", "vs": [[26, "إن غضبتم، فلا تخطئوا؛ لا تدعوا الشمس تغيب وأنتم غاضبون،"]]}, {"l": "Pro 14:17", "n": "", "vs": [[17, "ذو الطبع الحاد يتصرف بحمق، وذو المكائد ممقوت."]]}, {"l": "Pro 19:12", "n": "", "vs": [[12, "حنق الملك كزمجرة الأسد، ورضاه كالطل على العشب."]]}, {"l": "Ecc 7:9", "n": "", "vs": [[9, "لا يستسلم قلبك سريعا للغضب، لأن الغضب يستقر في صدور الجهال."]]}, {"l": "2Co 12:20", "n": "", "vs": [[20, "فإني أخشى أن آتي إليكم فأجدكم في حالة لا أريدها وتجدوني في حالة لا تريدونها! أي أن يكون بينكم كثير من النزاع والحسد والحقد والتحزب والتجريح والنميمة والتكبر والبلبلة."]]}, {"l": "Gal 5:20", "n": "", "vs": [[20, "وعبادة الأصنام والسحر، والعداوة والنزاع والغيرة والغضب، والتحزب والانقسام والتعصب،"]]}, {"l": "Col 3:8", "n": "", "vs": [[8, "وأما الآن، فانزعوا عنكم، أنتم أيضا، هذه الخطايا كلها: الغضب، النقمة، الخبث، التجديف، الكلام القبيح الخارج من أفواهكم."]]}, {"l": "2Ti 2:23", "n": "", "vs": [[23, "أما المجادلات الغبية الحمقاء، فتجنبها، عالما أنها تولد المشاجرات."]]}, {"l": "Tit 1:7", "n": "", "vs": [[7, "وذلك لأن الناظر يجب أن يكون بريئا من كل تهمة باعتباره وكيلا لله، لا معجبا بنفسه ولا حاد الطبع، ولا مدمن الخمر، ولا عنيفا، ولا ساعيا إلى المكسب الخسيس؛"]]}, {"l": "Jam 1:19", "n": "", "vs": [[19, "لذلك، ياإخوتي الأحباء، على كل واحد منكم أن يكون مسرعا إلى الإصغاء، غير متسرع في الكلام، بطيء الغضب."]]}, {"l": "Jam 3:14-18", "n": "", "vs": [[14, "أما إن كانت قلوبكم مملوءة بمرارة الحسد وبالتحزب، فلا تفتخروا بحكمتكم، ولا تنكروا الحق."], [15, "إن هذه الحكمة التي تدعونها ليست نازلة من عند الله، بل هي «حكمة» أرضية بشرية شيطانية."], [16, "فحيث تكون مرارة الحسد والتحزب، ينتشر الخلاف والفوضى وجميع الشرور."], [17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."], [18, "والبر هو ثمر ة ما يزرعه في سلام صانعو السلام."]]}, {"l": "Jam 4:1", "n": "", "vs": [[1, "من أين النزاع والخصام بينكم؟ أليس من لذاتكم تلك المتصارعة في أعضائكم؟"]]}, {"l": "Jam 4:2", "n": "", "vs": [[2, "فأنتم ترغبون في امتلاك ما لا يخصكم، لكن ذلك لا يتحقق لكم، فتقتلون، وتحسدون، ولا تتمكنون من بلوغ غايتكم. وهكذا تتخاصمون وتتصارعون! إنكم لا تمتلكون ما تريدونه، لأنكم لا تطلبونه من الله."]]}], "kwAr": "ونقمة وغضب", "noteAr": ""}, {"kw": "clamour", "raw": "2Sa_19:43, 2Sa_20:1, 2Sa_20:2; Pro_29:9, Pro_29:22; Act_19:28, Act_19:29, Act_21:30, Act_22:22, Act_22:23; 1Ti_3:3; 1Ti_6:4, 1Ti_6:5", "note": "", "refs": [{"l": "2Sa 19:43", "n": "", "vs": [[43, "فقال رجال إسرائيل لرجال يهوذا: «إن لنا عشرة سهام في الملك، ونحن أولى منكم بداود، فلماذا استخففتم بنا؟ أولم نكن نحن أول من تحدث عن إرجاع ملكنا؟» فكان رد رجال يهوذا أغلظ من كلام رجال إسرائيل."]]}, {"l": "2Sa 20:1", "n": "", "vs": [[1, "وحدث أن كان هناك رجل لئيم يدعى شبع بن بكري من سبط بنيامين، فنفخ هذا بالبوق وقال: «ليس لنا نصيب في داود ولا قسم في ابن يسى، فليرجع كل رجل إلى خيمته ياإسرائيل»."]]}, {"l": "2Sa 20:2", "n": "", "vs": [[2, "فتخلى كل رجال إسرائيل عن داود وتبعوا شبع بن بكري، وأما رجال يهوذا فلازموا ملكهم وواكبوه من الأردن إلى أورشليم."]]}, {"l": "Pro 29:9", "n": "", "vs": [[9, "إن خاصم الحكيم سفيها، لن يجد راحة، سواء غضب السفيه أو ضحك."]]}, {"l": "Pro 29:22", "n": "", "vs": [[22, "الإنسان الغضوب يثير النزاع، والرجل السخوط كثير المعاصي."]]}, {"l": "Act 19:28", "n": "", "vs": [[28, "فلما سمع العمال هذا الكلام تملكهم الغضب وبدأوا يصرخون: «عظيمة أرطاميس إلهة أهل أفسس!»"]]}, {"l": "Act 19:29", "n": "", "vs": [[29, "وعم الاضطراب المدينة كلها. وهجم حشد كبير من الناس على غايوس وأرسترخس المقدونيين رفيقي بولس في السفر، وجروهما إلى ساحة الملعب."]]}, {"l": "Act 21:30", "n": "", "vs": [[30, "عندئذ هاج أهل المدينة جميعا، وهجم الناس على بولس وجروه إلى خارج الهيكل، ثم أغلقت الأبواب حالا."]]}, {"l": "Act 22:22", "n": "", "vs": [[22, "ظل المجتمعون يصغون حتى وصل بولس إلى ذكر الأمم، فصرخوا بقائد الكتيبة: «انزع هذا الرجل من الأرض! إنه لا يستحق الحياة!»"]]}, {"l": "Act 22:23", "n": "", "vs": [[23, "ثم أخذوا يصيحون ويلوحون بثيابهم، ويذرون الغبار في الهواء."]]}, {"l": "1Ti 3:3", "n": "", "vs": [[3, "لا مدمنا للخمر ولا عنيفا؛ بل لطيفا، غير متعود الخصام، غير مولع بالمال،"]]}, {"l": "1Ti 6:4", "n": "", "vs": [[4, "فهو قد انتفخ تكبرا، ولا يعرف شيئا، وإنما هو مهووس بالمجادلات والمنازعات الكلامية، ومنها ينشأ الحسد والخصام والتجريح والنيات السيئة،"]]}, {"l": "1Ti 6:5", "n": "", "vs": [[5, "وشتى أنواع النزاع بين أناس فاسدي العقول مجردين من الحق، يعتبرون التقوى تجارة."]]}], "kwAr": "وصخب", "noteAr": ""}, {"kw": "evil speaking", "raw": "Lev_19:16; 2Sa_19:27; Psa_15:3, Psa_50:20, Psa_101:5, Psa_140:11; Pro_6:19, Pro_10:18; Pro_18:8, Pro_25:23, Pro_26:20; Jer_6:28, Jer_9:4; Rom_1:29, Rom_1:30; 1Ti_3:11, 1Ti_5:13; 2Ti_3:3; Tit_2:3, Tit_3:2; Jam_4:11; 1Pe_2:1; 2Pe_2:10,2Pe_2:11; Jud_1:8-10; Rev_12:10", "note": "", "refs": [{"l": "Lev 19:16", "n": "", "vs": [[16, "لا تسع في الوشاية بين شعبك، ولا ترتكب ما يعرض حياة جارك للخطر، فأنا الرب."]]}, {"l": "2Sa 19:27", "n": "", "vs": [[27, "ووشى بعبدك بهتانا إلى سيدي الملك، وسيدي الملك كملاك الله. فافعل ما يروق لك."]]}, {"l": "Psa 15:3", "n": "", "vs": [[3, "الذي لا يشوه سمعة الآخرين، ولا يسيء إلى صاحبه، ولا يلحق بقريبه عارا."]]}, {"l": "Psa 50:20", "n": "", "vs": [[20, "تجلس تشهر بأخيك، وعلى ابن أمك تفتري."]]}, {"l": "Psa 101:5", "n": "", "vs": [[5, "أبيد كل من يغتاب قريبه سرا؛ وذو العين المتشامخة والقلب المتكبر لا أحتمله."]]}, {"l": "Psa 140:11", "n": "", "vs": [[11, "لا تدع ذا اللسان السليط يثبت في الأرض: فالشر يتصيد رجل الظلم ليهلكه."]]}, {"l": "Pro 6:19", "n": "", "vs": [[19, "وشاهد زور ينفث كذبا، ورجل يزرع خصومات بين الإخوة."]]}, {"l": "Pro 10:18", "n": "", "vs": [[18, "من يضمر البغضاء تنطق شفتاه بالكذب، ومن جاهر بالمذمة فهو أحمق."]]}, {"l": "Pro 18:8", "n": "", "vs": [[8, "همسات النمام كلقم سائغة تنزلق إلى بواطن الجوف."]]}, {"l": "Pro 25:23", "n": "", "vs": [[23, "ريح الشمال تجلب المطر، واللسان النمام يستأثر بالنظرات الغاضبة."]]}, {"l": "Pro 26:20", "n": "", "vs": [[20, "كما تخمد النار لافتقارها إلى الحطب، هكذا تكف الخصومة حينما يغيب النمام."]]}, {"l": "Jer 6:28", "n": "", "vs": [[28, "فكلهم عصاة متمردون ساعون في النميمة. هم نحاس وحديد وكلهم فاسدون."]]}, {"l": "Jer 9:4", "n": "", "vs": [[4, "«ليحترس كل واحد من جاره، ولا يثق بأحد من أقربائه، لأن كل قريب مخادع، وكل صاحب واش."]]}, {"l": "Rom 1:29", "n": "", "vs": [[29, "إذ قد امتلأوا من كل إثم وشر وجشع وخبث، وشحنوا حسدا وقتلا وخصاما ومكرا وسوءا. وهم ثرثارون،"]]}, {"l": "Rom 1:30", "n": "", "vs": [[30, "مغتابون، كارهون لله، شتامون، متكبرون، متفاخرون، مخترعون للشرور، غير طائعين للوالدين."]]}, {"l": "1Ti 3:11", "n": "", "vs": [[11, "كذلك يجب أن تكون النساء أيضا رزينات، غير نمامات، نبيهات، أمينات في كل شيء."]]}, {"l": "1Ti 5:13", "n": "", "vs": [[13, "وفي الوقت نفسه يتعودن البطالة والتنقل من بيت إلى بيت. ولا تكفيهن البطالة، بل ينصرفن أيضا إلى الثرثرة والتشاغل بما لا يعنيهن والتحدث بأمور غير لائقة."]]}, {"l": "2Ti 3:3", "n": "", "vs": [[3, "متحجري العواطف، غير صفوحين، نمامين، جامحي الأهواء، شرسين غير محبين للصلاح،"]]}, {"l": "Tit 2:3", "n": "", "vs": [[3, "وكذلك أن تكون العجائز ذوات سيرة موافقة للقداسة، غير نمامات ولا مدمنات للخمر، بل معلمات لما هو صالح،"]]}, {"l": "Tit 3:2", "n": "", "vs": [[2, "ولا يقولوا سوءا في أحد، ولا يكونوا مخاصمين، بل لطفاء يعاملون الجميع بوداعة تامة."]]}, {"l": "Jam 4:11", "n": "", "vs": [[11, "وياإخوتي، لا تذموا بعضكم بعضا. فمن يفعل هذا ويحكم على أخيه، يطعن في شريعة الله ويحكم عليها. فإن كنت تحكم على الشريعة، لا تكون عاملا بها بل تجعل نفسك قاضيا لها."]]}, {"l": "1Pe 2:1", "n": "", "vs": [[1, "لذلك، تخلصوا من كل أثر للشر والخداع والرياء والحسد والذم."]]}, {"l": "2Pe 2:10", "n": "", "vs": [[10, "وما أشد العقاب، وبخاصة على الذين ينجرفون وراء الميول الجسدية، مستجيبين لشهوة النجاسة، ومحتقرين سيادة الله! ثم إنهم وقحون، معجبون بأنفسهم، لا يخافون أن يتكلموا بالشتم والإهانة على أصحاب الأمجاد."]]}, {"l": "2Pe 2:11", "n": "", "vs": [[11, "ومع ذلك، فحتى الملائكة، وهم يتفوقون عليهم في القوة والقدرة، لا يقدمون عليهم أمام الرب أية تهمة مهينة.."]]}, {"l": "Jud 1:8-10", "n": "", "vs": [[8, "ومع ذلك، فإن أولئك المعلمين المتوهمين يسيرون في الطريق التي سار فيها أهل تلك المدن. إذ يلوثون أجسادهم بالنجاسة، ويحتقرون السيادة الإلهية، ويتكلمون بالإهانة على الكائنات المجيدة!"], [9, "فحتى ميخائيل، وهو رئيس ملائكة، لم يجرؤ أن يحكم على إبليس بكلام مهين عندما خاصمه وتجادل معه بخصوص جثمان موسى، وإنما اكتفى بالقول له: «ليزجرك الرب!»"], [10, "ولكن هؤلاء المعلمين يتكلمون كلاما مهينا على أمور لا يعرفونها. وأما ما يفهمونه بالغريزة، كالحيوانات غير العاقلة، فإنهم به يدمرون أنفسهم."]]}, {"l": "Rev 12:10", "n": "", "vs": [[10, "ثم سمعت صوتا عاليا في السماء يقول: «الآن تم خلاص إلهنا، وآلت القدرة والملك إليه والسلطان إلى مسيحه! فإنه قد طرح من السماء إلى الأرض المشتكي الذي يتهم إخوتنا أمام إلهنا ليلا ونهارا."]]}], "kwAr": "وسباب", "noteAr": ""}, {"kw": "with", "raw": "Gen_4:8, Gen_27:41, Gen_37:4, Gen_37:21; Lev_19:17, Lev_19:18; 2Sa_13:22; Pro_10:12, Pro_26:24, Pro_26:25; Ecc_7:9; Rom_1:29; 1Co_5:8, 1Co_14:20; Col_3:8; Tit_3:3; 1Jo_3:12, 1Jo_3:15", "note": "", "refs": [{"l": "Gen 4:8", "n": "", "vs": [[8, "وعاد قايين يتظاهر بالود لأخيه هابيل. وحدث إذ كانا معا في الحقل أن قايين هجم على أخيه هابيل وقتله."]]}, {"l": "Gen 27:41", "n": "", "vs": [[41, "وحقد عيسو على يعقوب من أجل ما ناله من بركة أبيه. فناجى نفسه: «قريبا يموت أبي، وبعدئذ أقتل أخي يعقوب»."]]}, {"l": "Gen 37:4", "n": "", "vs": [[4, "ولما رأى إخوته أن أباهم يحبه أكثر منهم كرهوه وأساءوا إليه بكلامهم."]]}, {"l": "Gen 37:21", "n": "", "vs": [[21, "وإذ سمع رأوبين حديثهم، أراد أن ينقذه فقال: «لا نقتله،"]]}, {"l": "Lev 19:17", "n": "", "vs": [[17, "لا تبغض أخاك في قلبك، بل إنذارا تنذره لئلا تكون شريكا في ذنبه."]]}, {"l": "Lev 19:18", "n": "", "vs": [[18, "لا تنتقم ولا تحقد على أحد أبناء شعبك، ولكن تحب قريبك كما تحب نفسك، فأنا الرب."]]}, {"l": "2Sa 13:22", "n": "", "vs": [[22, "أما أبشالوم فلم يخاطب أمنون بخير أو شر، لكنه أضمر له بغضا شديدا لأنه انتهك حرمة أخته ثامار."]]}, {"l": "Pro 10:12", "n": "", "vs": [[12, "البغضاء تثير الخصومات، والمحبة تستر جميع الذنوب."]]}, {"l": "Pro 26:24", "n": "", "vs": [[24, "الرجل الماكر يطلي نواياه بمعسول الشفاه، ولكنه يراعي الحقد في قلبه،"]]}, {"l": "Pro 26:25", "n": "", "vs": [[25, "إن تملقك بعذوبة حديثه، فلا تأتمنه، لأن قلبه مفعم بسبعة صنوف من الرجاسات."]]}, {"l": "Ecc 7:9", "n": "", "vs": [[9, "لا يستسلم قلبك سريعا للغضب، لأن الغضب يستقر في صدور الجهال."]]}, {"l": "Rom 1:29", "n": "", "vs": [[29, "إذ قد امتلأوا من كل إثم وشر وجشع وخبث، وشحنوا حسدا وقتلا وخصاما ومكرا وسوءا. وهم ثرثارون،"]]}, {"l": "1Co 5:8", "n": "", "vs": [[8, "فلنعيد إذن، لا بخميرة عتيقة، ولا بخميرة الخبث والشر، بل بفطير الخلاص والحق."]]}, {"l": "1Co 14:20", "n": "", "vs": [[20, "أيها الإخوة، لا تكونوا أولادا في التفكير، بل كونوا أطفالا في الشر. وأما في التفكير، فكونوا راشدين."]]}, {"l": "Col 3:8", "n": "", "vs": [[8, "وأما الآن، فانزعوا عنكم، أنتم أيضا، هذه الخطايا كلها: الغضب، النقمة، الخبث، التجديف، الكلام القبيح الخارج من أفواهكم."]]}, {"l": "Tit 3:3", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."]]}, {"l": "1Jo 3:12", "n": "", "vs": [[12, "لا أن نكون مثل قايين الذي قتل أخاه. فقايين كان من أولاد إبليس الشرير. ولماذا قتل أخاه؟ قتله لأن أعماله هو كانت شريرة، أما أعمال أخيه فكانت صالحة."]]}, {"l": "1Jo 3:15", "n": "", "vs": [[15, "وكل من يبغض أخا له، فهو قاتل. وأنتم تعرفون أن القاتل لا تكون له حياة أبدية ثابتة فيه."]]}], "kwAr": "وكل شر", "noteAr": ""}], "arS": [["انزعوا", ["G142"]], [" عنكم ", []], ["كل", ["G3956"]], [" ", []], ["حقد", ["G4088"]], [" ", []], ["ونقمة", ["G2372"]], [" ", []], ["وغضب", ["G3709"]], [" ", []], ["وصخب", ["G2906"]], [" ", []], ["وسباب", ["G988"]], [" وكل ", []], ["شر", ["G2549"]], [".", []]]}, {"c": 4, "v": 32, "text": "وكونوا لطفاء بعضكم نحو بعض، شفوقين، مسامحين بعضكم بعضا كما سامحكم الله في المسيح.", "groups": [{"kw": "kind", "raw": "Rth_2:20; Psa_112:4, Psa_112:5, Psa_112:9; Pro_19:22; Isa_57:1 *marg. Luk_6:35; Act_28:2; Rom_12:10; 1Co_13:4; 2Co_2:10, 2Co_6:6; Col_3:12, Col_3:13; 2Pe_1:7", "note": "", "refs": [{"l": "Rut 2:20", "n": "", "vs": [[20, "فقالت نعمي لكنتها: «ليكن الرب مباركا لأنه لم يتخل عن الإحسان إلى الأحياء والأموات». ثم استطردت: «إن الرجل قريب لنا، وهو من أوليائنا»."]]}, {"l": "Psa 112:4", "n": "", "vs": [[4, "يشرق نور في الظلمة للمستقيمين لأن الرب حنان ورحيم وصديق."]]}, {"l": "Psa 112:5", "n": "", "vs": [[5, "سعيد هو الرجل الذي يتحنن ويقرض مجانا ويدبر شؤونه بالحيطة والعدل."]]}, {"l": "Psa 112:9", "n": "", "vs": [[9, "يوزع بسخاء ويعطي الفقراء، وبره يدوم إلى الأبد، فيرتفع رأسه باعتزاز."]]}, {"l": "Pro 19:22", "n": "", "vs": [[22, "حسن الجميل زينة الناس، والفقير خير من الغني الكاذب."]]}, {"l": "Isa 57:1", "n": "*marg.", "vs": [[1, "هلك الصديق فلم يتأمل أحد في نفسه ويعتبر، ومات الأتقياء ولم يدرك أحد أن الصديق قد أخذ تفاديا للكارثة."]]}, {"l": "Luk 6:35", "n": "", "vs": [[35, "ولكن، أحبوا أعداءكم، وأحسنوا المعاملة، وأقرضوا دون أن تأملوا استيفاء القرض، فتكون مكافأتكم عظيمة، وتكونوا أبناء العلي، لأنه ينعم على ناكري الجميل والأشرار."]]}, {"l": "Act 28:2", "n": "", "vs": [[2, "واستقبلنا أهلها الغرباء بعطف كبير قل نظيره. فإذ كان المطر ينهمر والجو باردا، أوقدوا لنا نارا، ورحبوا بنا."]]}, {"l": "Rom 12:10", "n": "", "vs": [[10, "أحبوا بعضكم بعضا محبة أخوية، مفضلين بعضكم على بعض في الكرامة."]]}, {"l": "1Co 13:4", "n": "", "vs": [[4, "المحبة تصبر طويلا؛ وهي لطيفة. المحبة لا تحسد. المحبة لا تتفاخر ولا تتكبر."]]}, {"l": "2Co 2:10", "n": "", "vs": [[10, "فمن تسامحونه بشيء، أسامحه أنا أيضا. وإذا كنت أنا أيضا قد سامحت ذلك الرجل بشيء، فقد سامحته من أجلكم في حضرة المسيح،"]]}, {"l": "2Co 6:6", "n": "", "vs": [[6, "في الطهارة والمعرفة وطول البال واللطف؛ في الروح القدس والمحبة الخالصة من الرياء؛"]]}, {"l": "Col 3:12", "n": "", "vs": [[12, "فباعتباركم جماعة مختارة من الله، قديسين محبوبين، البسوا دائما عواطف الحنان واللطف والتواضع والوداعة وطول البال،"]]}, {"l": "Col 3:13", "n": "", "vs": [[13, "محتملين بعضكم بعضا، ومسامحين بعضكم بعضا. إن كان لأحدكم شكوى على آخر، كما سامحكم الرب، هكذا افعلوا أنتم أيضا."]]}, {"l": "2Pe 1:7", "n": "", "vs": [[7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."]]}], "kwAr": "وكونوا لطفاء", "noteAr": ""}, {"kw": "tenderhearted", "raw": "Psa_145:9; Pro_12:10; Luk_1:78; Jam_5:11", "note": "", "refs": [{"l": "Psa 145:9", "n": "", "vs": [[9, "الرب يغمر الجميع بصلاحه، ومراحمه تعم كل أعماله."]]}, {"l": "Pro 12:10", "n": "", "vs": [[10, "الصديق يراعي نفس بهيمته، أما الشرير فأرق مراحمه تتسم بالقسوة."]]}, {"l": "Luk 1:78", "n": "", "vs": [[78, "بفضل عواطف الرحمة لدى إلهنا، تلك التي تفقدنا بها الفجر المشرق من العلاء،"]]}, {"l": "Jam 5:11", "n": "", "vs": [[11, "فنحن نقول عن الصابرين على الألم: «طوبى لهم!» وقد سمعتم بصبر أيوب، ورأيتم كيف عامله الرب في النهاية. وهذا يبين أن الرب كثير الرحمة والشفقة."]]}], "kwAr": "شفوقين", "noteAr": ""}, {"kw": "forgiving", "raw": "Eph_5:1; Gen_50:17, Gen_50:18; Mat_6:12, Mat_6:14, Mat_6:15, Mat_18:21-35; Mar_11:25, Mar_11:26; Luk_6:37; Luk_11:4, Luk_17:4; Rom_12:20,Rom_12:21; 2Co_2:7, 2Co_2:10; Col_3:12, Col_3:13; 1Pe_3:8, 1Pe_3:9; 1Jo_1:9, 1Jo_2:12", "note": "", "refs": [{"l": "Eph 5:1", "n": "", "vs": [[1, "فاقتدوا إذن بالله كأولاد أحباء،"]]}, {"l": "Gen 50:17", "n": "", "vs": [[17, "هكذا تقولون ليوسف: اغفر لإخوتك ذنبهم وخطيئتهم، فإنهم قد أساءوا إليك. فالآن اصفح عن إثم عبيد إله أبيك». فلما بلغته رسالتهم بكى يوسف."]]}, {"l": "Gen 50:18", "n": "", "vs": [[18, "وجاء إخوته أيضا وانطرحوا أمامه وقالوا: «ها نحن عبيدك»."]]}, {"l": "Mat 6:12", "n": "", "vs": [[12, "واغفر لنا ذنوبنا، كما نغفر نحن للمذنبين إلينا!"]]}, {"l": "Mat 6:14", "n": "", "vs": [[14, "فإن غفرتم للناس زلاتهم، يغفر لكم أبوكم السماوي زلاتكم."]]}, {"l": "Mat 6:15", "n": "", "vs": [[15, "وإن لم تغفروا للناس، لا يغفر لكم أبوكم السماوي زلاتكم."]]}, {"l": "Mat 18:21-35", "n": "", "vs": [[21, "عندئذ تقدم إليه بطرس وسأله: «يارب، كم مرة يخطيء إلي أخي فأغفر له؟ هل إلى سبع مرات؟»"], [22, "فأجابه يسوع: «لا إلى سبع مرات، بل إلى سبعين سبع مرات!"], [23, "لهذا السبب، يشبه ملكوت السماوات بإنسان ملك أراد أن يحاسب عبيده."], [24, "فلما شرع يحاسبهم، أحضر إليه واحد مديون بعشرة آلاف وزنة."], [25, "وإذ لم يكن عنده ما يوفي به دينه، أمر سيده بأن يباع هو وزوجته وأولاده وكل ما يملك ليوفي الدين."], [26, "لكن العبد خر أمامه ساجدا وقائلا: ياسيد، أمهلني فأوفي لك الدين كله."], [27, "فأشفق سيد ذلك العبد عليه، فأطلق سراحه، وسامحه بالدين."], [28, "«ولكن لما خرج ذلك العبد، قصد واحدا من زملائه العبيد كان مديونا له بمئة دينار. فقبض عليه وأخذ بخناقه قائلا: أوفني ما عليك!"], [29, "فخر زميله العبد أمامه وقال متوسلا: أمهلني فأوفيك!"], [30, "فلم يقبل بل مضى وألقاه في السجن حتى يوفي ما عليه."], [31, "وإذ شاهد زملاؤه العبيد ما جرى، حزنوا جدا، فمضوا وأخبروا سيدهم بكل ما جرى."], [32, "فاستدعاه سيده وقال له: أيها العبد الشرير، ذلك الدين كله سامحتك به لأنك توسلت إلي."], [33, "أفما كان يجب أن ترحم زميلك العبد كما رحمتك أنا؟"], [34, "وإذ ثار غضب سيده عليه، دفعه إلى الجلادين ليعذبوه حتى يوفي كل ما عليه."], [35, "هكذا يفعل بكم أبي السماوي إن لم يغفر كل منكم لأخيه من قلبه! »"]]}, {"l": "Mar 11:25", "n": "", "vs": [[25, "ومتى وقفتم تصلون، وكان لكم على أحد شيء، فاغفروا له، لكي يغفر لكم أبوكم الذي في السماوات زلاتكم أيضا."]]}, {"l": "Mar 11:26", "n": "", "vs": [[26, "ولكن، إن لم تغفروا، لا يغفر لكم أيضا أبوكم الذي في السماوات زلاتكم»."]]}, {"l": "Luk 6:37", "n": "", "vs": [[37, "ولا تدينوا، فلا تدانوا. لا تحكموا على أحد، فلا يحكم عليكم. اغفروا، يغفر لكم."]]}, {"l": "Luk 11:4", "n": "", "vs": [[4, "واغفر لنا خطايانا، لأننا نحن أيضا نغفر لكل من يذنب إلينا؛ ولا تدخلنا في تجربة لكن نجنا من الشرير! »"]]}, {"l": "Luk 17:4", "n": "", "vs": [[4, "وإن أخطأ إليك سبع مرات في اليوم، وعاد إليك سبع مرات قائلا: أنا تائب! فعليك أن تغفر له»."]]}, {"l": "Rom 12:20", "n": "", "vs": [[20, "وإنما «إن جاع عدوك فأطعمه، وإن عطش فاسقه. فإنك، بعملك هذا تجمع على رأسه جمرا مشتعلا»."]]}, {"l": "Rom 12:21", "n": "", "vs": [[21, "لا تدع الشر يغلبك، بل اغلب الشر بالخير."]]}, {"l": "2Co 2:7", "n": "", "vs": [[7, "وعلى نقيض ذلك، فأحرى بكم الآن أن تسامحوه وتشجعوه، وإلا فإنه قد يبتلع في غمرة الحزن الشديد."]]}, {"l": "2Co 2:10", "n": "", "vs": [[10, "فمن تسامحونه بشيء، أسامحه أنا أيضا. وإذا كنت أنا أيضا قد سامحت ذلك الرجل بشيء، فقد سامحته من أجلكم في حضرة المسيح،"]]}, {"l": "Col 3:12", "n": "", "vs": [[12, "فباعتباركم جماعة مختارة من الله، قديسين محبوبين، البسوا دائما عواطف الحنان واللطف والتواضع والوداعة وطول البال،"]]}, {"l": "Col 3:13", "n": "", "vs": [[13, "محتملين بعضكم بعضا، ومسامحين بعضكم بعضا. إن كان لأحدكم شكوى على آخر، كما سامحكم الرب، هكذا افعلوا أنتم أيضا."]]}, {"l": "1Pe 3:8", "n": "", "vs": [[8, "والخلاصة، كونوا جميعا متحدين في الرأي، متعاطفين بعضكم مع بعض، مبادلين أحدكم الآخر المحبة الأخوية، شفوقين، متواضعين."]]}, {"l": "1Pe 3:9", "n": "", "vs": [[9, "لا تبادلوا الشر بشر، ولا الشتيمة بشتيمة. بل بالعكس: باركوا، فترثوا البركة، لأنه لهذا دعاكم الله ."]]}, {"l": "1Jo 1:9", "n": "", "vs": [[9, "ولكن، إن اعترفنا لله بخطايانا، فهو جدير بالثقة وعادل، يغفر لنا خطايانا ويطهرنا من كل إثم."]]}, {"l": "1Jo 2:12", "n": "", "vs": [[12, "أكتب إليكم، أيها الأولاد، لأن الله قد غفر لكم خطاياكم إكراما لاسم المسيح."]]}], "kwAr": "مسامحين بعضكم بعضا", "noteAr": ""}], "arS": [["وكونوا ", []], ["لطفاء", ["G5543"]], [" بعضكم نحو بعض، ", []], ["شفوقين", ["G2155"]], ["، ", []], ["مسامحين", ["G5483"]], [" بعضكم بعضا كما ", []], ["سامحكم", ["G5483"]], [" ", []], ["الله", ["G2316"]], [" في ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 5, "v": 1, "text": "فاقتدوا إذن بالله كأولاد أحباء،", "groups": [{"kw": "followers", "raw": "Eph_4:32; Lev_11:45; Mat_5:45, Mat_5:48; Luk_6:35, Luk_6:36; 1Pe_1:15, 1Pe_1:16; 1Jo_4:11", "note": "", "refs": [{"l": "Eph 4:32", "n": "", "vs": [[32, "وكونوا لطفاء بعضكم نحو بعض، شفوقين، مسامحين بعضكم بعضا كما سامحكم الله في المسيح."]]}, {"l": "Lev 11:45", "n": "", "vs": [[45, "لأني أنا الرب الذي أخرجكم من ديار مصر لأكون لكم إلها. فكونوا قديسين لأني أنا قدوس."]]}, {"l": "Mat 5:45", "n": "", "vs": [[45, "فتكونوا أبناء أبيكم الذي في السماوات: فإنه يشرق بشمسه على الأشرار والصالحين، ويمطر على الأبرار وغير الأبرار."]]}, {"l": "Mat 5:48", "n": "", "vs": [[48, "فكونوا أنتم كاملين، كما أن أباكم السماوي هو كامل!"]]}, {"l": "Luk 6:35", "n": "", "vs": [[35, "ولكن، أحبوا أعداءكم، وأحسنوا المعاملة، وأقرضوا دون أن تأملوا استيفاء القرض، فتكون مكافأتكم عظيمة، وتكونوا أبناء العلي، لأنه ينعم على ناكري الجميل والأشرار."]]}, {"l": "Luk 6:36", "n": "", "vs": [[36, "فكونوا أنتم رحماء، كما أن أباكم رحيم."]]}, {"l": "1Pe 1:15", "n": "", "vs": [[15, "وإنما اسلكوا سلوكا مقدسا في كل أمر، مقتدين بالقدوس الذي دعاكم،"]]}, {"l": "1Pe 1:16", "n": "", "vs": [[16, "لأنه قد كتب: «كونوا قديسين، لأني أنا قدوس!»"]]}, {"l": "1Jo 4:11", "n": "", "vs": [[11, "ومادام الله قد أحبنا هذه المحبة العظيمة، أيها الأحباء، فعلينا نحن أيضا أن نحب بعضنا بعضا."]]}], "kwAr": "فاقتدوا إذن بالله", "noteAr": ""}, {"kw": "as", "raw": "Jer_31:20; Hos_1:10; Joh_1:12; Col_3:12; 1Jo_3:1, 1Jo_3:2", "note": "", "refs": [{"l": "Jer 31:20", "n": "", "vs": [[20, "هل أفرايم ابن أثير لدي؟ أليس هو ابنا مسرا؟ لأني مع كثرة تنديدي به فإني مازلت أذكره، لذلك يشتاق قلبي إليه، وأكن له الرحمة»، يقول الرب."]]}, {"l": "Hos 1:10", "n": "", "vs": [[10, "ومع ذلك فإن عدد بني إسرائيل يكون كرمل البحر الذي لا يكال ولا يحصى. وفي الموضع الذي قيل لهم فيه: أنتم لستم شعبي، يقال لهم: أنتم أبناء الله الحي."]]}, {"l": "Joh 1:12", "n": "", "vs": [[12, "أما الذين قبلوه، أي الذين آمنوا باسمه، فقد منحهم الحق في أن يصيروا أولاد الله،"]]}, {"l": "Col 3:12", "n": "", "vs": [[12, "فباعتباركم جماعة مختارة من الله، قديسين محبوبين، البسوا دائما عواطف الحنان واللطف والتواضع والوداعة وطول البال،"]]}, {"l": "1Jo 3:1", "n": "", "vs": [[1, "تأملوا ما أعظم المحبة التي أحبنا بها الآب حتى صرنا ندعى «أولاد الله»، ونحن أولاده حقا. ولكن، بما أن أهل العالم لا يعرفون الله، فهم لا يعرفوننا."]]}, {"l": "1Jo 3:2", "n": "", "vs": [[2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"]]}], "kwAr": "كأولاد أحباء", "noteAr": ""}], "arS": [["فاقتدوا", ["G3402"]], [" إذن ", []], ["بالله", ["G2316"]], [" ", []], ["كأولاد", ["G5043"]], [" ", []], ["أحباء", ["G27"]], ["،", []]]}, {"c": 5, "v": 2, "text": "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة.", "groups": [{"kw": "walk", "raw": "Eph_3:17, Eph_4:2, Eph_4:15; Joh_13:34; Rom_14:16; 1Co_16:14; Col_3:14; 1Th_4:9; 1Ti_4:12; 1Pe_4:8; 1Jo_3:11, 1Jo_3:12, 1Jo_3:23, 1Jo_4:20,1Jo_4:21", "note": "", "refs": [{"l": "Eph 3:17", "n": "", "vs": [[17, "ليسكن المسيح في قلوبكم بالإيمان؛ حتى إذا تأصلتم وتأسستم في المحبة،"]]}, {"l": "Eph 4:2", "n": "", "vs": [[2, "بكل تواضع ووداعة وطول بال، محتملين بعضكم بعضا في المحبة،"]]}, {"l": "Eph 4:15", "n": "", "vs": [[15, "بل نتمسك بالحق في المحبة، فننمو في كل شيء نحو من هو الرأس، أي المسيح."]]}, {"l": "Joh 13:34", "n": "", "vs": [[34, "وصية جديدة أنا أعطيكم: أحبوا بعضكم بعضا، كما أحببتكم أنا، تحبون بعضكم."]]}, {"l": "Rom 14:16", "n": "", "vs": [[16, "إذن، لا تعرضوا صلاحكم لكلام السوء."]]}, {"l": "1Co 16:14", "n": "", "vs": [[14, "وكل ما تعملونه، فاعملوه في المحبة."]]}, {"l": "Col 3:14", "n": "", "vs": [[14, "وفوق هذا كله البسوا المحبة، فهي رابطة الكمال."]]}, {"l": "1Th 4:9", "n": "", "vs": [[9, "أما المحبة الأخوية، فلستم في حاجة لأن أكتب إليكم عنها، لأنكم بأنفسكم قد تعلمتم من الله أن تحبوا بعضكم بعضا،"]]}, {"l": "1Ti 4:12", "n": "", "vs": [[12, "لا يستخف أحد بحداثة سنك. وإنما كن قدوة للمؤمنين، في الكلام والسلوك والمحبة والإيمان والطهارة."]]}, {"l": "1Pe 4:8", "n": "", "vs": [[8, "لكن أهم شيء هو أن تبادلوا بعضكم بعضا المحبة الشديدة. لأن المحبة تستر إساءات كثيرة."]]}, {"l": "1Jo 3:11", "n": "", "vs": [[11, "فالوصية التي سمعتموها منذ البداية، هي أن يحب بعضنا بعضا،"]]}, {"l": "1Jo 3:12", "n": "", "vs": [[12, "لا أن نكون مثل قايين الذي قتل أخاه. فقايين كان من أولاد إبليس الشرير. ولماذا قتل أخاه؟ قتله لأن أعماله هو كانت شريرة، أما أعمال أخيه فكانت صالحة."]]}, {"l": "1Jo 3:23", "n": "", "vs": [[23, "وأما وصيته فهي أن نؤمن باسم ابنه يسوع المسيح، وأن يحب بعضنا بعضا كما أوصانا."]]}, {"l": "1Jo 4:20", "n": "", "vs": [[20, "فإن قال أحد: «أنا أحب الله !» ولكنه يبغض أخا له، فهو كاذب، لأنه إن كان لا يحب أخاه الذي يراه، فكيف يقدر أن يحب الله الذي لم يره قط؟"]]}, {"l": "1Jo 4:21", "n": "", "vs": [[21, "فهذه الوصية جاءتنا من المسيح نفسه: من يحب الله ، يحب أخاه!"]]}], "kwAr": "واسلكوا في المحبة", "noteAr": ""}, {"kw": "as", "raw": "Eph_5:25, Eph_3:19; Mat_20:28; Joh_15:12, Joh_15:13; 2Co_5:14, 2Co_5:15, 2Co_8:9; Gal_1:4, Gal_2:20; 1Ti_2:6; Tit_2:14; Heb_7:25-27, Heb_9:14, Heb_9:26, Heb_10:10,Heb_10:11; 1Pe_2:21-24; 1Jo_3:16; Rev_1:5, Rev_5:9", "note": "", "refs": [{"l": "Eph 5:25", "n": "", "vs": [[25, "أيها الأزواج، أحبوا زوجاتكم مثلما أحب المسيح الكنيسة وبذل نفسه لأجلها،"]]}, {"l": "Eph 3:19", "n": "", "vs": [[19, "وتعرفوا محبة المسيح التي تفوق المعرفة، فتمتلئوا حتى تبلغوا ملء الله كله."]]}, {"l": "Mat 20:28", "n": "", "vs": [[28, "فهكذا ابن الإنسان: قد جاء لا ليخدم، بل ليخدم ويبذل نفسه فدية عن كثيرين. »"]]}, {"l": "Joh 15:12", "n": "", "vs": [[12, "وصيتي لكم هي هذه: أن يحب بعضكم بعضا كما أنا أحببتكم."]]}, {"l": "Joh 15:13", "n": "", "vs": [[13, "ليس لأحد محبة أعظم من هذه: أن يبذل أحد حياته فدى أحبائه."]]}, {"l": "2Co 5:14", "n": "", "vs": [[14, "فإن محبة المسيح تسيطر علينا، وقد حكمنا بهذا: مادام واحد قد مات عوضا عن الجميع، فمعنى ذلك أن الجميع ماتوا؛"]]}, {"l": "2Co 5:15", "n": "", "vs": [[15, "وهو قد مات عوضا عن الجميع حتى لا يعيش الأحياء في ما بعد لأنفسهم بل للذي مات عوضا عنهم ثم قام."]]}, {"l": "2Co 8:9", "n": "", "vs": [[9, "فأنتم تعرفون نعمة ربنا يسوع المسيح: فمن أجلكم افتقر، وهو الغني لكي تغتنوا أنتم بفقره."]]}, {"l": "Gal 1:4", "n": "", "vs": [[4, "الذي بذل نفسه من أجل خطايانا لكي ينقذنا من العالم الحاضر الشرير، وفقا لمشيئة إلهنا وأبينا."]]}, {"l": "Gal 2:20", "n": "", "vs": [[20, "مع المسيح صلبت، وفيما بعد لا أحيا أنا بل المسيح يحيا في. أما الحياة التي أحياها الآن في الجسد، فإنما أحياها بالإيمان في ابن الله، الذي أحبني وبذل نفسه عني."]]}, {"l": "1Ti 2:6", "n": "", "vs": [[6, "الذي بذل نفسه فدية عوضا عن الجميع. هذه شهادة تؤدى في أوقاتها الخاصة،"]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Heb 7:25-27", "n": "", "vs": [[25, "وهو لذلك قادر دائما أن يحقق الخلاص الكامل للذين يتقربون به إلى الله. فهو، في حضرة الله، حي على الدوام ليتضرع من أجلهم ويحامي عنهم!"], [26, "نعم، هذا هو رئيس الكهنة الذي كنا محتاجين إليه. إنه قدوس، لا عيبة فيه، ولا نجاسة، قد انفصل عن الخاطئين، وارتفع حتى صار أسمى من السماوات."], [27, "وهو لا يحتاج إلى ما كان يحتاج إليه قديما كل رئيس كهنة: أن يقدم الذبائح يوميا للتكفير عن خطاياه الخاصة أولا، ثم عن خطايا الشعب، وذلك لأنه كفر عن خطاياهم مرة واحدة، حين قدم نفسه عنهم."]]}, {"l": "Heb 9:14", "n": "", "vs": [[14, "فكم بالأحرى دم المسيح الذي قدم نفسه لله بروح أزلي ذبيحة لا عيب فيها، يطهر ضمائرنا من الأعمال الميتة لنعبد الله الحي."]]}, {"l": "Heb 9:26", "n": "", "vs": [[26, "وإلا لكان يجب أن يموت المسيح متألما مرات كثيرة منذ تأسيس العالم! ولكنه الآن، عند انتهاء الأزمنة، ظهر مرة واحدة ليبطل قوة الخطيئة بتقديم نفسه ذبيحة لله."]]}, {"l": "Heb 10:10", "n": "", "vs": [[10, "بموجب هذه الإرادة الإلهية، صرنا مقدسين إذ قرب يسوع المسيح، مرة واحدة، جسده عوضا عنا!"]]}, {"l": "Heb 10:11", "n": "", "vs": [[11, "وقديما، كان كل كاهن يقف يوميا أمام المذبح ليقوم بمهمته، فيقدم لله تلك الذبائح عينها، مع أنها لم تكن قادرة على إزالة الخطايا إطلاقا."]]}, {"l": "1Pe 2:21-24", "n": "", "vs": [[21, "لأن الله دعاكم إلى الاشتراك في هذا النوع من الآلام. فالمسيح، الذي تألم لأجلكم، هو القدوة التي تقتدون بها. فسيروا على آثار خطواته:"], [22, "إنه لم يفعل خطيئة واحدة، ولا كان في فمه مكر."], [23, "ومع أنه أهين، فلم يكن يرد الإهانة. وإذ تحمل الآلام، لم يكن يهدد بالانتقام، بل أسلم أمره لله الذي يحكم بالعدل."], [24, "وهو نفسه حمل خطايانا في جسده (عندما مات مصلوبا) على الخشبة، لكي نموت بالنسبة للخطايا فنحيا حياة البر. وبجراحه هو تم لكم الشفاء،"]]}, {"l": "1Jo 3:16", "n": "", "vs": [[16, "ومقياس المحبة هو العمل الذي قام به المسيح إذ بذل حياته لأجلنا. فعلينا نحن أيضا أن نبذل حياتنا لأجل إخوتنا."]]}, {"l": "Rev 1:5", "n": "", "vs": [[5, "ومن يسوع المسيح الشاهد الأمين، بكر القائمين من بين الأموات، ملك ملوك الأرض، ذاك الذي بدافع محبته لنا مات لأجلنا فغسلنا بدمه من خطايانا،"]]}, {"l": "Rev 5:9", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"]]}], "kwAr": "على مثال المسيح", "noteAr": ""}, {"kw": "a sacrifice", "raw": "Rom_8:3 *marg. 1Co_5:7; Heb_9:23, Heb_10:12", "note": "", "refs": [{"l": "Rom 8:3", "n": "*marg.", "vs": [[3, "فإن ما عجزت الشريعة عنه، لكون الجسد قد جعلها قاصرة عن تحقيقه، أتمه الله إذ أرسل ابنه، متخذا ما يشبه جسد الخطيئة ومكفرا عن الخطيئة فدان الخطيئة في الجسد"]]}, {"l": "1Co 5:7", "n": "", "vs": [[7, "فاعزلوا الخميرة العتيقة من بينكم لتكونوا عجينا جديدا، لأنكم فطير ! فإن حمل فصحنا، أي المسيح، قد ذبح."]]}, {"l": "Heb 9:23", "n": "", "vs": [[23, "وبما أن تطهير الخيمة الأرضية كان يتطلب رش دم الذبائح الحيوانية، فإن الخيمة الحقيقية لابد أن تتطلب دم ذبيحة أفضل من الذبائح الأخرى."]]}, {"l": "Heb 10:12", "n": "", "vs": [[12, "ولكن المسيح، رئيس كهنتنا، قدم ذبيحة واحدة عن الخطايا، ثم جلس إلى الأبد عن يمين الله،"]]}], "kwAr": "تقدمة وذبيحة", "noteAr": ""}, {"kw": "for a", "raw": "Gen_8:21; Lev_1:9, Lev_1:13, Lev_1:17, Lev_3:16; Amo_5:21; 2Co_2:15", "note": "", "refs": [{"l": "Gen 8:21", "n": "", "vs": [[21, "فتقبلها الرب برضى، وقال في نفسه: «لن ألعن الأرض مرة أخرى من أجل الإنسان، لأن أهواء قلب الإنسان شريرة منذ حداثته ولن أقدم على إهلاك كل حي كما فعلت."]]}, {"l": "Lev 1:9", "n": "", "vs": [[9, "أما أعضاؤه الداخلية وأكارعه فيغسلها المقرب بماء، ثم يحرقها الكاهن جميعا على المذبح، فتكون محرقة، وقود رضى تسر الرب."]]}, {"l": "Lev 1:13", "n": "", "vs": [[13, "وأما الأعضاء الداخلية والأكارع فيغسلها بماء، ثم يحرقها الكاهن جميعها فتكون محرقة ووقود رضى تسر الرب."]]}, {"l": "Lev 1:17", "n": "", "vs": [[17, "ويشق الكاهن الطائر من بين جناحيه، من غير أن يفصله إلى قطعتين، ويحرقه على المذبح فوق حطب النار، فيكون محرقة ووقود رضى تسر الرب."]]}, {"l": "Lev 3:16", "n": "", "vs": [[16, "ويحرقها الكاهن على المذبح طعام وقود رضى وسرور، فيكون كل الشحم للرب."]]}, {"l": "Amo 5:21", "n": "", "vs": [[21, "إني أمقت أعيادكم وأحتقرها، ولا أسر باحتفالاتكم."]]}, {"l": "2Co 2:15", "n": "", "vs": [[15, "فإننا رائحة المسيح الطيبة المرتفعة إلى الله، المنتشرة على السواء عند الذين يخلصون وعند الذين يهلكون:"]]}], "kwAr": "طيبة الرائحة", "noteAr": ""}], "arS": [["واسلكوا", ["G4043"]], [" في ", []], ["المحبة", ["G26"]], [" على مثال ", []], ["المسيح", ["G5547"]], [" الذي ", []], ["أحبنا", ["G25", "G2248"]], [" ", []], ["وبذل", ["G3860"]], [" ", []], ["نفسه", ["G1438"]], [" لأجلنا ", []], ["تقدمة", ["G4376"]], [" ", []], ["وذبيحة", ["G2378"]], [" ", []], ["لله", ["G2316"]], [" ", []], ["طيبة", ["G2175"]], [" ", []], ["الرائحة", ["G3744"]], [".", []]]}, {"c": 5, "v": 3, "text": "أما الزنى، وكل نجاسة أو شهوة نهمة، فلا يذكر بينكم حتى اسمها، كما يليق بالقديسين.", "groups": [{"kw": "fornication", "raw": "Eph_5:5, Eph_4:19, Eph_4:20; Num_25:1; Deu_23:17, Deu_23:18; Mat_15:19; Mar_7:21; Act_15:20; Rom_1:29, Rom_6:13; 1Co_5:10,1Co_5:11, 1Co_6:9, 1Co_6:13, 1Co_6:18, 1Co_10:8; 2Co_12:21; Gal_5:19-21; Col_3:5; 1Th_4:3, 1Th_4:7; Heb_12:16, Heb_13:4; 2Pe_2:10; Rev_2:14, Rev_2:21, Rev_9:21, Rev_21:8; Rev_22:15", "note": "", "refs": [{"l": "Eph 5:5", "n": "", "vs": [[5, "فإنكم تعلمون هذا جيدا: أن كل زان أو نجس أو صاحب شهوة نهمة، ما هو إلا عابد أصنام، ليس له ميراث في ملكوت المسيح والله."]]}, {"l": "Eph 4:19", "n": "", "vs": [[19, "فهؤلاء، إذ طرحوا جانبا كل إحساس، استسلموا للإباحية ليرتكبوا كل نجاسة بشهوة نهمة لا ترتوي."]]}, {"l": "Eph 4:20", "n": "", "vs": [[20, "أما أنتم، فلم تتعلموا المسيح هكذا،"]]}, {"l": "Num 25:1", "n": "", "vs": [[1, "وأقام الإسرائيليون في شطيم، فشرع الرجال يرتكبون الزنى مع الموآبيات"]]}, {"l": "Deu 23:17", "n": "", "vs": [[17, "لا يكن من بنات إسرائيل ولا من أبناء إسرائيل زانيات ومأبونو معابد."]]}, {"l": "Deu 23:18", "n": "", "vs": [[18, "لا تأتوا بتقدمة نذر ما إلى بيت الرب إلهكم من مكسب زانية أو مأبون، لأن كليهما رجس أمام الرب."]]}, {"l": "Mat 15:19", "n": "", "vs": [[19, "فمن القلب تنبع الأفكار الشريرة، القتل، الزنى، الفسق، السرقة، شهادة الزور، التجديف."]]}, {"l": "Mar 7:21", "n": "", "vs": [[21, "فإنه من الداخل، من قلوب الناس، تنبع الأفكار الشريرة، الفسق، السرقة، القتل،"]]}, {"l": "Act 15:20", "n": "", "vs": [[20, "بل نكتب إليهم رسالة نوصيهم فيها بأن يمتنعوا عن الأكل من الذبائح النجسة المقربة للأصنام، وعن ارتكاب الزنى، وعن تناول لحوم الحيوانات المخنوقة، وعن الدم."]]}, {"l": "Rom 1:29", "n": "", "vs": [[29, "إذ قد امتلأوا من كل إثم وشر وجشع وخبث، وشحنوا حسدا وقتلا وخصاما ومكرا وسوءا. وهم ثرثارون،"]]}, {"l": "Rom 6:13", "n": "", "vs": [[13, "ولا تقدموا أعضاءكم للخطيئة أسلحة للإثم، بل قدموا أنفسكم لله باعتباركم أقمتم من بين الأموات أحياء، وأعضاءكم لله أسلحة للبر."]]}, {"l": "1Co 5:10", "n": "", "vs": [[10, "فلا أعني زناة هذا العالم أو الطماعين أو السراقين أو عابدي الأصنام على وجه الإطلاق، وإلا كنتم مضطرين إلى الخروج من المجتمع البشري!"]]}, {"l": "1Co 5:11", "n": "", "vs": [[11, "أما الآن فقد كتبت إليكم بأن لا تعاشروا من يسمى أخا إن كان زانيا أو طماعا أو عابد أصنام أو شتاما أو سكيرا أو سراقا. فمثل هذا لا تعاشروه ولا تجلسوا معه لتناول الطعام."]]}, {"l": "1Co 6:9", "n": "", "vs": [[9, "أما تعلمون أن الظالمين لن يرثوا ملكوت الله؟ لا تضلوا: فإن ملكوت الله لن يرثه الزناة ولا عابدو الأصنام ولا الفاسقون ولا المتخنثون ولا مضاجعو الذكور"]]}, {"l": "1Co 6:13", "n": "", "vs": [[13, "الطعام للبطن، والبطن للطعام؛ ولكن الله سيبيد هذا وذاك. غير أن الجسد ليس للزنى، بل للرب؛ والرب للجسد."]]}, {"l": "1Co 6:18", "n": "", "vs": [[18, "اهربوا من الزنا! فكل خطيئة يرتكبها الإنسان هي خارجة عن جسده، وأما من يرتكب الزنا، فهو يسيء إلى جسده الخاص."]]}, {"l": "1Co 10:8", "n": "", "vs": [[8, "ولا نرتكب الزنا كما فعل بعضهم، فسقط في يوم واحد ثلاثة وعشرون ألفا."]]}, {"l": "2Co 12:21", "n": "", "vs": [[21, "وأخشى أن يجعلني إلهي ذليلا بينكم عند مجيئي إليكم مرة أخرى، فيكون حزني شديدا على كثيرين من الذين أخطأوا قبلا ولم يتوبوا عما ارتكبوا من دنس وزنى وفسق!"]]}, {"l": "Gal 5:19-21", "n": "", "vs": [[19, "أما أعمال الجسد فظاهرة، وهي: الزنى والنجاسة والدعارة،"], [20, "وعبادة الأصنام والسحر، والعداوة والنزاع والغيرة والغضب، والتحزب والانقسام والتعصب،"], [21, "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!"]]}, {"l": "Col 3:5", "n": "", "vs": [[5, "فأميتوا إذن أعضاءكم الأرضية: الزنى، النجاسة، جموح العاطفة، الشهوة الرديئة، والاشتهاء النهم الذي هو عبادة أصنام."]]}, {"l": "1Th 4:3", "n": "", "vs": [[3, "فإن مشيئة الله هي هذه: قداستكم. وذلك بأن تمتنعوا عن الزنى،"]]}, {"l": "1Th 4:7", "n": "", "vs": [[7, "فإن الله دعانا لا إلى النجاسة بل (إلى العيش( في القداسة."]]}, {"l": "Heb 12:16", "n": "", "vs": [[16, "وحذار أن يكون بينكم زان أو مستهتر مثل عيسو الذي باع حقوقه بوصفه الابن البكر، لقاء أكلة واحدة."]]}, {"l": "Heb 13:4", "n": "", "vs": [[4, "حافظوا جميعا على كرامة الزواج، مبعدين النجاسة عن الفراش. فإن الله سوف يعاقب الذين ينغمسون في خطايا الدعارة والزنى."]]}, {"l": "2Pe 2:10", "n": "", "vs": [[10, "وما أشد العقاب، وبخاصة على الذين ينجرفون وراء الميول الجسدية، مستجيبين لشهوة النجاسة، ومحتقرين سيادة الله! ثم إنهم وقحون، معجبون بأنفسهم، لا يخافون أن يتكلموا بالشتم والإهانة على أصحاب الأمجاد."]]}, {"l": "Rev 2:14", "n": "", "vs": [[14, "ولكني عاتب عليك قليلا لأنك تتسامح مع القوم الذين يتمسكون بتعليم بلعام عندما علم الملك بالاق أن يدمر بني إسرائيل بتوريطهم في ارتكاب الزنى والأكل من الذبائح المقدمة للأصنام،"]]}, {"l": "Rev 2:21", "n": "", "vs": [[21, "وقد أمهلتها مدة لتتوب تاركة زناها، ولكنها لم تتب."]]}, {"l": "Rev 9:21", "n": "", "vs": [[21, "ولم يتوبوا عن القتل والسحر والزنى والسرقة!"]]}, {"l": "Rev 21:8", "n": "", "vs": [[8, "أما الجبناء وغير المؤمنين، والفاسدون والقاتلون والزناة، والمتصلون بالشياطين وعبدة الأصنام وجميع الدجالين، فمصيرهم إلى البحيرة المتقدة بالنار والكبريت، الذي هو الموت الثاني»."]]}, {"l": "Rev 22:15", "n": "", "vs": [[15, "أما في خارج المدينة، فهنالك الكلاب والمتصلون بالشياطين، والزناة والقتلة، وعبدة الأصنام والدجالون ومحبو التدجيل!"]]}], "kwAr": "الزنى", "noteAr": ""}, {"kw": "covetousness", "raw": "Eph_5:5; Exo_18:21, Exo_20:17; Jos_7:21; 1Sa_8:3; Psa_10:3, Psa_119:36; Pro_28:16; Jer_6:13, Jer_8:10, Jer_22:17; Eze_33:31; Mic_2:2; Mar_7:22; Luk_12:15, Luk_16:14; Act_20:33; 1Co_6:10; Col_3:5; 1Ti_3:3, 1Ti_6:10; 2Ti_3:2; Tit_1:7, Tit_1:11; Heb_13:5; 1Pe_5:2; 2Pe_2:3, 2Pe_2:14", "note": "", "refs": [{"l": "Eph 5:5", "n": "", "vs": [[5, "فإنكم تعلمون هذا جيدا: أن كل زان أو نجس أو صاحب شهوة نهمة، ما هو إلا عابد أصنام، ليس له ميراث في ملكوت المسيح والله."]]}, {"l": "Exo 18:21", "n": "", "vs": [[21, "ولكن اختر من بين الشعب رجالا مقتدرين خائفين الله أمناء يبغضون الرشوة، تقيمهم عليهم رؤساء لفئات الألوف والمئات والخماسين والعشرات."]]}, {"l": "Exo 20:17", "n": "", "vs": [[17, "لا تشته بيت جارك، ولا زوجته، ولا عبده، ولا أمته، ولا ثوره، ولا حماره، ولا شيئا مما له»."]]}, {"l": "Jos 7:21", "n": "", "vs": [[21, "رأيت بين الغنائم رداء شنعاريا نفيسا، ومئتي شاقل فضة (نحو كيلوجرامين ونصف)، وسبيكة من ذهب وزنها خمسون شاقلا (نحو ست مئة جرام)، فاشتهيتها وأخذتها. وها هي مطمورة في الأرض في وسط خيمتي، والفضة تحتها»."]]}, {"l": "1Sa 8:3", "n": "", "vs": [[3, "غير أنهما لم يسلكا في طريقه، بل غويا وراء المكسب وقبلا الرشوة وحابيا في القضاء."]]}, {"l": "Psa 10:3", "n": "", "vs": [[3, "الشرير يفتخر بشهوات نفسه، والرجل الطماع يلعن ويجدف على الله."]]}, {"l": "Psa 119:36", "n": "", "vs": [[36, "اجتذب قلبي نحو شهاداتك بعيدا عن مطامع المال."]]}, {"l": "Pro 28:16", "n": "", "vs": [[16, "الحاكم المفتقر إلى الفطنة، هو متسلط جائر. ومن يمقت الربح الحرام يتمتع بعمر مديد."]]}, {"l": "Jer 6:13", "n": "", "vs": [[13, "لأنهم جميعا، صغارهم وكبارهم، مولعون بالربح الحرام. حتى النبي والكاهن يرتكبان الزور في أعمالهما."]]}, {"l": "Jer 8:10", "n": "", "vs": [[10, "لذلك أعطي نساءهم لآخرين وحقولهم للوارثين القاهرين، لأنهم جميعا من صغيرهم إلى كبيرهم مولعون بالربح. حتى النبي والكاهن يرتكبان الزور في أعمالهما،"]]}, {"l": "Jer 22:17", "n": "", "vs": [[17, "«أما أنت فعيناك وقلبك متهافتة على الربح الحرام، وعلى سفك الدم البريء، وعلى الظلم والابتزاز»."]]}, {"l": "Eze 33:31", "n": "", "vs": [[31, "ويقبلون إليك مثل سائر الشعب ويجلسون في حضرتك نظير شعبي، ويصغون إلى كلامك ولا يعملون به. إنهم يعربون عن أشواقهم بكلامهم، أما قلبهم فقد غوى وراء مكسبهم."]]}, {"l": "Mic 2:2", "n": "", "vs": [[2, "يشتهون حقولا ويغتصبونها، وبيوتا فيستولون عليها. يجورون على الرجل وعلى بيته والإنسان وميراثه."]]}, {"l": "Mar 7:22", "n": "", "vs": [[22, "الزنى، الطمع، الخبث، الخداع، العهارة، العين الشريرة، التجديف، الكبرياء، الحماقة"]]}, {"l": "Luk 12:15", "n": "", "vs": [[15, "وقال للجمع: «احذروا وتحفظوا من الطمع. فمتى كان الإنسان في سعة، لا تكون حياته في أمواله»."]]}, {"l": "Luk 16:14", "n": "", "vs": [[14, "وكان الفريسيون أيضا، وهم محبون للمال، يسمعون ذلك كله، فاستهزأوا به."]]}, {"l": "Act 20:33", "n": "", "vs": [[33, "ما اشتهيت يوما فضة ولا ذهبا ولا ثوبا من عند أحد."]]}, {"l": "1Co 6:10", "n": "", "vs": [[10, "ولا السراقون ولا الطماعون ولا السكيرون ولا الشتامون ولا المغتصبون."]]}, {"l": "Col 3:5", "n": "", "vs": [[5, "فأميتوا إذن أعضاءكم الأرضية: الزنى، النجاسة، جموح العاطفة، الشهوة الرديئة، والاشتهاء النهم الذي هو عبادة أصنام."]]}, {"l": "1Ti 3:3", "n": "", "vs": [[3, "لا مدمنا للخمر ولا عنيفا؛ بل لطيفا، غير متعود الخصام، غير مولع بالمال،"]]}, {"l": "1Ti 6:10", "n": "", "vs": [[10, "فإن حب المال أصل لكل شر؛ وإذ سعى بعضهم إليه، ضلوا عن الإيمان، وطعنوا أنفسهم بأوجاع كثيرة."]]}, {"l": "2Ti 3:2", "n": "", "vs": [[2, "إذ يكون الناس محبين لأنفسهم، محبين للمال، متكبرين، مباهين بأنفسهم، شتامين، غير مطيعين لوالديهم، ناكرين للجميل، دنسين،"]]}, {"l": "Tit 1:7", "n": "", "vs": [[7, "وذلك لأن الناظر يجب أن يكون بريئا من كل تهمة باعتباره وكيلا لله، لا معجبا بنفسه ولا حاد الطبع، ولا مدمن الخمر، ولا عنيفا، ولا ساعيا إلى المكسب الخسيس؛"]]}, {"l": "Tit 1:11", "n": "", "vs": [[11, "هؤلاء يجب أن تسد أفواههم: فهم يخربون بيوتا بجملتها، إذ يعلمون تعاليم يجب ألا تعلم، في سبيل مكسب خسيس."]]}, {"l": "Heb 13:5", "n": "", "vs": [[5, "اجعلوا سيرتكم مترفعة عن حب المال، واقنعوا بما عندكم، لأن الله يقول: «لا أتركك، ولا أتخلى عنك أبدا!»"]]}, {"l": "1Pe 5:2", "n": "", "vs": [[2, "ارعوا قطيع الله الذي بينكم، كحراس له، لا بدافع الواجب، بل بدافع التطوع، كما يريد الله ، ولا رغبة في الربح الدنيء، بل رغبة في الخدمة بنشاط."]]}, {"l": "2Pe 2:3", "n": "", "vs": [[3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "2Pe 2:14", "n": "", "vs": [[14, "عيونهم لا تنظر إلا نظرات الزنى، ولا تشبع من الخطيئة. وكم من نفوس ضعيفة تقع في فخاخهم! أما قلوبهم، فقد تدربت على الشهوة والطمع. إنهم حقا أبناء اللعنة!"]]}], "kwAr": "أو شهوة نهمة", "noteAr": ""}, {"kw": "named", "raw": "Eph_5:12; Exo_23:13; 1Co_5:1", "note": "", "refs": [{"l": "Eph 5:12", "n": "", "vs": [[12, "فالأمور التي يفعلونها سرا، قبيح حتى ذكرها."]]}, {"l": "Exo 23:13", "n": "", "vs": [[13, "أطيعوا كل ما أوصيتكم به، ولا تذكروا اسم آلهة أخرى، ولا يتلفظ به فمك."]]}, {"l": "1Co 5:1", "n": "", "vs": [[1, "قد شاع فعلا أن بينكم زنى. ومثل هذا الزنى لا يوجد حتى بين الأمم. ذلك بأن رجلا منكم يعاشر زوجة أبيه."]]}], "kwAr": "فلا يذكر بينكم", "noteAr": ""}, {"kw": "as", "raw": "Rom_16:2; Phi_1:27; 1Ti_2:10; Tit_2:3", "note": "", "refs": [{"l": "Rom 16:2", "n": "", "vs": [[2, "فاقبلوها في الرب قبولا يليق بالقديسين وقدموا لها أي عون تحتاج إليه منكم، لأنها هي كانت معينة لكثيرين ولي أنا أيضا."]]}, {"l": "Phi 1:27", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"]]}, {"l": "1Ti 2:10", "n": "", "vs": [[10, "بل بما يليق بنساء يعترفن علنا بأنهن يعشن في تقوى الله، بالأعمال الصالحة!"]]}, {"l": "Tit 2:3", "n": "", "vs": [[3, "وكذلك أن تكون العجائز ذوات سيرة موافقة للقداسة، غير نمامات ولا مدمنات للخمر، بل معلمات لما هو صالح،"]]}], "kwAr": "كما يليق بالقديسين", "noteAr": ""}], "arS": [["أما ", []], ["الزنى", ["G4202"]], ["، ", []], ["وكل", ["G3956"]], [" ", []], ["نجاسة", ["G167"]], [" أو ", []], ["شهوة نهمة", ["G4124"]], ["، فلا ", []], ["يذكر", ["G3687"]], [" بينكم حتى اسمها، كما ", []], ["يليق", ["G4241"]], [" ", []], ["بالقديسين", ["G40"]], [".", []]]}, {"c": 5, "v": 4, "text": "وكذلك البذاءة والكلام السفيه والهزل، فهي غير لائقة. وإنما أحرى بكم أن تلهجوا بالشكر لله!", "groups": [{"kw": "filthiness", "raw": "Eph_4:29; Pro_12:23, Pro_15:2; Ecc_10:13; Mat_12:34-37; Mar_7:22; Col_3:8; Jam_3:4-8; 2Pe_2:7, 2Pe_2:18; Jud_1:10,Jud_1:13", "note": "", "refs": [{"l": "Eph 4:29", "n": "", "vs": [[29, "لا تخرج من أفواهكم كلمة فاسدة، بل الكلام الصالح للبنيان الذي تدعو إليه الحاجة، كي يعطي السامعين نعمة."]]}, {"l": "Pro 12:23", "n": "", "vs": [[23, "العاقل يحتفظ بعلمه، وقلوب الجهال تفضح ما فيها من سفاهة."]]}, {"l": "Pro 15:2", "n": "", "vs": [[2, "لسان الحكيم يتقن المعرفة، وأقوال الجهال تفيض حماقة."]]}, {"l": "Ecc 10:13", "n": "", "vs": [[13, "بداية كلمات فمه حماقة، وخاتمة حديثه جنون خبيث."]]}, {"l": "Mat 12:34-37", "n": "", "vs": [[34, "ياأولاد الأفاعي، كيف تقدرون، وأنتم أشرار، أن تتكلموا كلاما صالحا؟ لأن الفم يتكلم بما يفيض به القلب."], [35, "فالإنسان الصالح، من الكنز الصالح في قلبه، يصدر ما هو صالح. والإنسان الشرير، يصدر ما هو شرير."], [36, "على أني أقول لكم: إن كل كلمة باطلة يتكلم بها الناس، سوف يؤدون عنها الحساب في يوم الدينونة."], [37, "فإنك بكلامك تبرر، وبكلامك تدان ! »"]]}, {"l": "Mar 7:22", "n": "", "vs": [[22, "الزنى، الطمع، الخبث، الخداع، العهارة، العين الشريرة، التجديف، الكبرياء، الحماقة"]]}, {"l": "Col 3:8", "n": "", "vs": [[8, "وأما الآن، فانزعوا عنكم، أنتم أيضا، هذه الخطايا كلها: الغضب، النقمة، الخبث، التجديف، الكلام القبيح الخارج من أفواهكم."]]}, {"l": "Jam 3:4-8", "n": "", "vs": [[4, "ومهما كانت السفينة كبيرة والرياح التي تدفعها قوية وهوجاء، فبدفة صغيرة جدا يتحكم الربان فيها ويسوقها إلى الجهة التي يريد. كذلك اللسان أيضا: فهو عضو صغير،"], [5, "ولكن ما أشد فعاليته! انظروا: إن شرارة صغيرة تحرق غابة كبيرة!"], [6, "واللسان كالنار خطرا: فهو وحده، بين أعضاء الجسم، جامع للشرور كلها، ويلوث الجسم كله بالفساد. إنه يشعل دائرة الكون، ويستمد ناره من جهنم!"], [7, "من السهل على الإنسان أن يروض الوحوش والطيور والزواحف والحيوانات البحرية، بجميع أجناسها. فهذا ما نراه يحدث."], [8, "ولكن أحدا من الناس لا يقدر أن يروض اللسان. فهو شر لا ينضبط، ممتليء بالسم القتال!"]]}, {"l": "2Pe 2:7", "n": "", "vs": [[7, "ولكنه أنقذ لوطا البار، الذي كان متضايقا جدا من سلوك أشرار زمانه في الدعارة."]]}, {"l": "2Pe 2:18", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."]]}, {"l": "Jud 1:10", "n": "", "vs": [[10, "ولكن هؤلاء المعلمين يتكلمون كلاما مهينا على أمور لا يعرفونها. وأما ما يفهمونه بالغريزة، كالحيوانات غير العاقلة، فإنهم به يدمرون أنفسهم."]]}, {"l": "Jud 1:13", "n": "", "vs": [[13, "وبأعمالهم المخجلة يفضحون أنفسهم كأمواج في البحر هائجة تقذف الأوساخ. وهم أشبه بنجوم تائهة في الفضاء، مصيرها الظلام الشديد إلى الأبد!"]]}], "kwAr": "البذاءة", "noteAr": ""}, {"kw": "convenient", "raw": "Rom_1:28; Phm_1:8", "note": "", "refs": [{"l": "Rom 1:28", "n": "", "vs": [[28, "وبما أنهم لم يتخيروا إبقاء الله ضمن معرفتهم، أسلمهم الله إلى ذهن عاطل عن التمييز دفعهم إلى ممارسة الأمور غير اللائقة."]]}, {"l": "Phm 1:8", "n": "", "vs": [[8, "لذلك، فمع أن لي كامل الحق في المسيح أن آمرك بالواجب،"]]}], "kwAr": "غير لائقة", "noteAr": ""}, {"kw": "but", "raw": "Eph_5:19, Eph_5:20, Eph_1:16; Psa_33:1, Psa_92:1, Psa_107:21, Psa_107:22; Dan_6:10; Joh_6:23; 2Co_1:11; 2Co_9:15; Phi_4:6; Col_3:15-17; 1Th_3:9, 1Th_5:18; Heb_13:15", "note": "", "refs": [{"l": "Eph 5:19", "n": "", "vs": [[19, "محدثين بعضكم بعضا بمزامير وتسابيح وأناشيد روحية، مرنمين ومرتلين بقلوبكم للرب؛"]]}, {"l": "Eph 5:20", "n": "", "vs": [[20, "رافعين الشكر كل حين وعلى كل شيء لله والآب، باسم ربنا يسوع المسيح؛"]]}, {"l": "Eph 1:16", "n": "", "vs": [[16, "لا أنقطع عن شكر الله لأجلكم وعن ذكركم في صلواتي،"]]}, {"l": "Psa 33:1", "n": "", "vs": [[1, "سبحوا الرب أيها الأبرار، فإن الحمد يليق بالمستقيمين."]]}, {"l": "Psa 92:1", "n": "", "vs": [[1, "ما أحسن تقديم الشكر لك يارب والترنيم لاسمك أيها العلي!"]]}, {"l": "Psa 107:21", "n": "", "vs": [[21, "فليرفعوا الشكر للرب على رحمته، وعلى عجائبه لبني آدم."]]}, {"l": "Psa 107:22", "n": "", "vs": [[22, "وليقربوا له ذبائح الشكر، ويحدثوا بأعماله بترانيم الفرح."]]}, {"l": "Dan 6:10", "n": "", "vs": [[10, "فلما بلغ دانيآل أمر توقيع الوثيقة مضى إلى بيته وصعد إلى عليته ذات الكوى المفتوحة باتجاه أورشليم، وجثا على ركبتيه ثلاث مرات في اليوم وصلى، وحمد إلهه كمألوف عادته من قبل."]]}, {"l": "Joh 6:23", "n": "", "vs": [[23, "ثم جاءت قوارب أخرى من طبرية، ورست بالقرب من المكان الذي أكلوا فيه الخبز بعدما شكر الرب عليه."]]}, {"l": "2Co 1:11", "n": "", "vs": [[11, "على أن تساعدونا أنتم بالصلاة لأجلنا؛ حتى إن ما يوهب لنا استجابة لصلاة الكثيرين، يدفع الكثيرين إلى الشكر من أجلنا."]]}, {"l": "2Co 9:15", "n": "", "vs": [[15, "فشكرا لله على عطيته المجانية التي تفوق الوصف!"]]}, {"l": "Phi 4:6", "n": "", "vs": [[6, "لا تقلقوا من جهة أي شيء، بل في كل أمر لتكن طلباتكم معروفة لدى الله، بالصلاة والدعاء، مع الشكر."]]}, {"l": "Col 3:15-17", "n": "", "vs": [[15, "وليملك في قلوبكم سلام المسيح، فإليه قد دعيتم في الجسد الواحد؛ وكونوا شاكرين!"], [16, "لتسكن كلمة المسيح في داخلكم بغنى، في كل حكمة، معلمين وواعظين بعضكم بعضا، مرنمين بمزامير وتسابيح وأناشيد روحية في قلوبكم لله، رافعين له الحمد."], [17, "ومهما كان ما تعملونه، بالقول أو بالفعل، فليجر كل شيء باسم الرب يسوع، رافعين به الشكر لله الآب."]]}, {"l": "1Th 3:9", "n": "", "vs": [[9, "فأي شكر نستطيع أن نؤديه إلى الله عوضا عنكم من أجل كل ما نبتهج به من الفرح بسببكم أمام إلهنا،"]]}, {"l": "1Th 5:18", "n": "", "vs": [[18, "ارفعوا الشكر في كل حال: فهذه هي مشيئة الله لكم في المسيح يسوع."]]}, {"l": "Heb 13:15", "n": "", "vs": [[15, "فبالمسيح، رئيس كهنتنا، لنقرب لله دائما ذبيحة الحمد والتسبيح، أي الثمار التي تنتجها أفواهنا المعترفة باسمه."]]}], "kwAr": "وإنما أحرى بكم"
