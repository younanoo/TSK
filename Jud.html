<script>window.CATALOG=[{"id": 17, "abbr": "Est", "en": "Esther", "nc": 10, "nv": 167, "refs": 1266, "last": "10:3", "first": "وحدث في أيام أحشويروش، الذي امتد حكمه من الهند إلى كوش، فملك على مئة وسبعة وعشرين إقليما،"}, {"id": 18, "abbr": "Job", "en": "Job", "nc": 42, "nv": 1070, "refs": 10209, "last": "42:17", "first": "عاش في أرض عوص رجل اسمه أيوب، كان صالحا كاملا يتقي الله ويحيد عن الشر."}, {"id": 19, "abbr": "Psa", "en": "Psalms", "nc": 150, "nv": 2461, "refs": 33395, "last": "150:6", "first": "طوبى للإنسان الذي لا يتبع مشورة الأشرار، ولا يقف في طريق الخاطئين، ولا يجالس المستهزئين."}, {"id": 20, "abbr": "Pro", "en": "Proverbs", "nc": 31, "nv": 915, "refs": 10457, "last": "31:31", "first": "هذه هي أمثال سليمان بن داود ملك إسرائيل،"}, {"id": 21, "abbr": "Ecc", "en": "Ecclesiastes", "nc": 12, "nv": 222, "refs": 3186, "last": "12:14", "first": "هذه أقوال الجامعة ابن داود ملك أورشليم."}, {"id": 22, "abbr": "Son", "en": "Song of Solomon", "nc": 8, "nv": 117, "refs": 1802, "last": "8:14", "first": "هذا نشيد الأناشيد لسليمان."}, {"id": 23, "abbr": "Isa", "en": "Isaiah", "nc": 66, "nv": 1292, "refs": 21959, "last": "66:24", "first": "هذه هي رؤيا إشعياء بن آموص، التي أعلنت له بشأن يهوذا وأورشليم في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا."}, {"id": 24, "abbr": "Jer", "en": "Jeremiah", "nc": 52, "nv": 1364, "refs": 20659, "last": "52:34", "first": "هذه نبوءة إرميا بن حلقيا أحد الكهنة المقيمين في عناثوث بأرض سبط بنيامين."}, {"id": 25, "abbr": "Lam", "en": "Lamentations", "nc": 5, "nv": 154, "refs": 2238, "last": "5:22", "first": "كيف أصبحت المدينة الآهلة بالسكان مهجورة وحيدة؟ صارت كأرملة! هذه التي كانت عظيمة بين الأمم. السيدة بين المدن صارت تحت الجزية!"}, {"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 48, "nv": 1273, "refs": 15264, "last": "48:35", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 65, "abbr": "Jud", "en": "Jude", "verses": [{"c": 1, "v": 1, "text": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح.", "groups": [{"kw": "", "raw": "ad 66, am 4070", "note": "ad 66, am 4070", "refs": [], "kwAr": "تاريخ الكتابة", "noteAr": "نحو سنة ٦٦ م (سنة العالم ٤٠٧٠)."}, {"kw": "Jude", "raw": "Mat_10:3, Lebbeus, Thaddeus, Mar_3:18, Thaddeus, Luk_6:16; Joh_14:22; Act_1:13", "note": "Mat_10:3, Lebbeus, Thaddeus, Mar_3:18, Thaddeus, Luk_6:16; Joh_14:22; Act_1:13", "refs": [{"l": "Mat 10:3", "n": "", "vs": [[3, "فيلبس، وبرثلماوس؛ توما، ومتى جابي الضرائب؛ يعقوب بن حلفى، وتداوس؛"]]}, {"l": "Mar 3:18", "n": "", "vs": [[18, "وأندراوس، وفيلبس، وبرثلماوس، ومتى وتوما، ويعقوب بن حلفى، وتداوس، وسمعان القانوي،"]]}, {"l": "Luk 6:16", "n": "", "vs": [[16, "يهوذا أخو يعقوب، ويهوذا الإسخريوطي الذي خانه في ما بعد."]]}, {"l": "Joh 14:22", "n": "", "vs": [[22, "فسأله يهوذا، غير الإسخريوطي: «ياسيد، ماذا جرى حتى تعلن لنا ذاتك ولا تعلنها للعالم؟»"]]}, {"l": "Act 1:13", "n": "", "vs": [[13, "ولما وصلوا صعدوا إلى غرفة في الطبقة العليا كانوا يقيمون فيها، وهم: بطرس ويوحنا، ويعقوب وأندراوس، وفيلبس وتوما، وبرثلماوس ومتى، ويعقوب بن حلفى وسمعان الغيور، ويهوذا أخو يعقوب."]]}], "kwAr": "يهوذا", "noteAr": "ويُدعى أيضًا لباوس وتداوس."}, {"kw": "the servant", "raw": "Joh_12:26; Act_27:23; Rom_1:1, Rom_6:22, Rom_16:18; Jam_1:1; 2Pe_1:1", "note": "", "refs": [{"l": "Joh 12:26", "n": "", "vs": [[26, "من أراد أن يخدمني فليتبعني. وحيث أكون أنا يكون خادمي أيضا. وكل من يخدمني يكرمه أبي."]]}, {"l": "Act 27:23", "n": "", "vs": [[23, "فقد ظهر لي هذه الليلة ملاك من عند الله الذي أنا له وإياه أخدم،"]]}, {"l": "Rom 1:1", "n": "", "vs": [[1, "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"]]}, {"l": "Rom 6:22", "n": "", "vs": [[22, "أما الآن، وقد حررتم من الخطيئة وصرتم عبيدا لله، فإن لكم ثمركم للقداسة، والعاقبة هي الحياة الأبدية."]]}, {"l": "Rom 16:18", "n": "", "vs": [[18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."]]}, {"l": "Jam 1:1", "n": "", "vs": [[1, "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"]]}, {"l": "2Pe 1:1", "n": "", "vs": [[1, "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"]]}], "kwAr": "عبد يسوع المسيح", "noteAr": ""}, {"kw": "them", "raw": "Joh_15:16, Joh_17:17, Joh_17:19; Act_20:32; 1Co_1:2, 1Co_6:11; Eph_5:26; 1Th_5:23; 1Pe_1:2", "note": "", "refs": [{"l": "Joh 15:16", "n": "", "vs": [[16, "ليس أنتم اخترتموني، بل أنا اخترتكم وعينتكم لتنطلقوا وتنتجوا ثمرا ويدوم ثمركم، فيعطيكم الآب كل ما تطلبونه باسمي."]]}, {"l": "Joh 17:17", "n": "", "vs": [[17, "قدسهم بالحق؛ إن كلمتك هي الحق."]]}, {"l": "Joh 17:19", "n": "", "vs": [[19, "ومن أجلهم أنا أقدس ذاتي، ليتقدسوا هم أيضا في الحق."]]}, {"l": "Act 20:32", "n": "", "vs": [[32, "وا لآن أسلمكم إلى الله وإلى كلمة نعمته القادرة أن تبنيكم وتعطيكم ميراثا تشتركون فيه مع جميع المقدسين لله."]]}, {"l": "1Co 1:2", "n": "", "vs": [[2, "إلى كنيسة الله في مدينة كورنثوس، إلى الذين تقدسوا في المسيح يسوع، المدعوين، القديسين؛ وإلى جميع الذين يدعون باسم ربنا يسوع المسيح في كل مكان ربا لهم ولنا."]]}, {"l": "1Co 6:11", "n": "", "vs": [[11, "وهكذا كان بعضكم، إلا أنكم قد اغتسلتم، بل تقدستم، بل تبررتم، باسم الرب يسوع المسيح وبروح إلهنا."]]}, {"l": "Eph 5:26", "n": "", "vs": [[26, "لكي يقدسها مطهرا إياها بغسل الماء، بالكلمة،"]]}, {"l": "1Th 5:23", "n": "", "vs": [[23, "وإله السلام نفسه يقدسكم إلى التمام ويحفظكم سالمين، روحا ونفسا وجسدا، لتكونوا بلا لوم عند عودة ربنا يسوع المسيح."]]}, {"l": "1Pe 1:2", "n": "", "vs": [[2, "بحسب علمه السابق ثم قدسهم بالروح ليطيعوا يسوع المسيح ويطهروا برش دمه عليهم."]]}], "kwAr": "المحبوبين منه", "noteAr": ""}, {"kw": "preserved", "raw": "Joh_6:39, Joh_10:28-30, Joh_17:11, Joh_17:12, Joh_17:15; 2Ti_4:18; 1Pe_1:5", "note": "", "refs": [{"l": "Joh 6:39", "n": "", "vs": [[39, "ومشيئته هي أن لا أدع أحدا ممن وهبهم لي يهلك، بل أقيمه في اليوم الأخير."]]}, {"l": "Joh 10:28-30", "n": "", "vs": [[28, "وأعطيها حياة أبدية، فلا تهلك إلى الأبد، ولا ينتزعها أحد من يدي."], [29, "إن الآب الذي أعطاني إياها هو أعظم من الجميع، ولا يقدر أحد أن ينتزع من يد الآب شيئا."], [30, "أنا والآب واحد!»"]]}, {"l": "Joh 17:11", "n": "", "vs": [[11, "هؤلاء باقون في العالم؛ أما أنا فلست باقيا فيه، لأني عائد إليك. أيها الآب القدوس احفظ في اسمك الذين وهبتهم لي، ليكونوا واحدا، كما نحن واحد."]]}, {"l": "Joh 17:12", "n": "", "vs": [[12, "حين كنت معهم، كنت أحفظهم في اسمك. فالذين وهبتهم لي، رعيتهم، ولم يهلك منهم أحد إلا ابن الهلاك، ليتم الكتاب."]]}, {"l": "Joh 17:15", "n": "", "vs": [[15, "وأنا لا أطلب أن تأخذهم من العالم، بل أن تحفظهم من الشرير."]]}, {"l": "2Ti 4:18", "n": "", "vs": [[18, "وسينجيني الرب من كل عمل شرير ويحفظني سالما لملكوته السماوي. فله المجد إلى أبد الآبدين آمين!"]]}, {"l": "1Pe 1:5", "n": "", "vs": [[5, "محفوظا لكم في السماوات. فإنكم محفوظون بقدرة الله العاملة من خلال إيمانكم، إلى أن تفوزوا بالخلاص النهائي المعد لكم والذي سوف يتجلى في الزمان الأخير."]]}], "kwAr": "المحفوظين", "noteAr": ""}, {"kw": "and called", "raw": "Rom_8:30, Rom_9:24; 1Th_2:12; 2Th_2:13, 2Th_2:14; 2Ti_1:9; Heb_3:1; 1Pe_2:9, 1Pe_5:10", "note": "", "refs": [{"l": "Rom 8:30", "n": "", "vs": [[30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."]]}, {"l": "Rom 9:24", "n": "", "vs": [[24, "فينا نحن الذين دعاهم لا من بين اليهود فقط بل من بين الأمم أيضا؟"]]}, {"l": "1Th 2:12", "n": "", "vs": [[12, "ونحرضكم أن تسلكوا سلوكا يليق بالله، ذاك الذي يدعوكم إلى ملكوته ومجده."]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "2Th 2:14", "n": "", "vs": [[14, "فإلى هذا الأمر قد دعاكم ببشارتنا لكم، لنوال مجد ربنا يسوع المسيح."]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،"]]}, {"l": "Heb 3:1", "n": "", "vs": [[1, "إذن، أيها الإخوة القديسون الذين اشتركتم في الدعوة السماوية، تأملوا يسوع: الرسول ورئيس الكهنة في الإيمان الذي نتمسك به."]]}, {"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}], "kwAr": "دعاهم الله الآب إليه", "noteAr": ""}], "arS": [["من ", []], ["يهوذا", ["G2455"]], ["، ", []], ["عبد", ["G1401"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [" ", []], ["وشقيق", ["G80"]], [" ", []], ["يعقوب", ["G2385"]], ["، إلى الذين ", []], ["دعاهم", ["G2822"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["الآب", ["G3962"]], [" إليه، ", []], ["المحبوبين", ["G37"]], [" منه، ", []], ["والمحفوظين", ["G5083"]], [" من أجل ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 1, "v": 2, "text": "لتكن لكم الرحمة والسلام والمحبة في وفرة وازدياد!", "groups": [{"kw": "", "raw": "Rom_1:7; 1Pe_1:2; 2Pe_1:2; Rev_1:4-6", "note": "", "refs": [{"l": "Rom 1:7", "n": "", "vs": [[7, "إلى جميع من هم في روما من أحباء الله القديسين المدعوين. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}, {"l": "1Pe 1:2", "n": "", "vs": [[2, "بحسب علمه السابق ثم قدسهم بالروح ليطيعوا يسوع المسيح ويطهروا برش دمه عليهم."]]}, {"l": "2Pe 1:2", "n": "", "vs": [[2, "ليكن لكم المزيد من النعمة والسلام بفضل معرفة الله ويسوع ربنا!"]]}, {"l": "Rev 1:4-6", "n": "", "vs": [[4, "من يوحنا، إلى الكنائس السبع في مقاطعة آسيا: لكم النعمة والسلام من الكائن والذي كان والذي سيأتي، ومن الأرواح السبعة الماثلة أمام عرشه،"], [5, "ومن يسوع المسيح الشاهد الأمين، بكر القائمين من بين الأموات، ملك ملوك الأرض، ذاك الذي بدافع محبته لنا مات لأجلنا فغسلنا بدمه من خطايانا،"], [6, "وجعل منا مملكة، وكهنة لله أبيه، له المجد والسلطان إلى أبد الآبدين. آمين!"]]}], "kwAr": "", "noteAr": ""}], "arS": [["لتكن ", []], ["لكم", ["G5213"]], [" ", []], ["الرحمة", ["G1656"]], [" ", []], ["والسلام", ["G1515"]], [" ", []], ["والمحبة", ["G26"]], [" في ", []], ["وفرة وازدياد", ["G4129"]], ["!", []]]}, {"c": 1, "v": 3, "text": "أيها الأحباء، كنت قد نويت أن أكتب إليكم في موضوع الخلاص الذي نشترك فيه جميعا. ولكن، أراني الآن مضطرا لأن أكتب لأشجعكم على الجهاد في سبيل الإيمان الذي سلم مرة واحدة للقديسين.", "groups": [{"kw": "when", "raw": "Rom_15:15, Rom_15:16; Gal_6:11; Heb_13:22; 1Pe_5:12; 2Pe_1:12-15, 2Pe_3:1", "note": "", "refs": [{"l": "Rom 15:15", "n": "", "vs": [[15, "على أني كتبت إليكم بأوفر جرأة في بعض الأمور، مذكرا لكم، وذلك بالنعمة التي وهبها الله لي."]]}, {"l": "Rom 15:16", "n": "", "vs": [[16, "وبذلك أكون خادم المسيح يسوع، المرسل إلى الأمم، حاملا إنجيل الله وكأني أقوم بخدمة كهنوتية، بقصد أن ترفع لله من بين الأمم تقدمة تكون مقبولة ومقدسة بالروح القدس."]]}, {"l": "Gal 6:11", "n": "", "vs": [[11, "انظروا بأية حروف كبيرة قد كتبت إليكم هنا بيدي:"]]}, {"l": "Heb 13:22", "n": "", "vs": [[22, "إنما أسألكم، أيها الإخوة، أن تحتملوا ما وجهته إليكم من كلام الوعظ في هذه الرسالة، وهو قليل!"]]}, {"l": "1Pe 5:12", "n": "", "vs": [[12, "إني مرسل إليكم هذه الرسالة القصيرة بيد سلوانس الأخ الأمين. وغايتي أن أحرضكم وأشهد لكم أن النعمة التي تتمتعون بها هي نعمة الله الحقيقية التي أنتم فيها ثابتون."]]}, {"l": "2Pe 1:12-15", "n": "", "vs": [[12, "لذلك أنوي أن أذكركم دائما بهذه الأمور، وإن كنتم عالمين بها، وراسخين في الحق الذي عندكم."], [13, "فمادمت في خيمة جسمي هذه، أرى من واجبي أن أنبهكم مذكرا."], [14, "فأنا أعلم أن خيمتي ستطوى بعد وقت قصير، كما سبق أن أعلن لي ربنا يسوع المسيح."], [15, "ولهذا، أجتهد الآن في تذكيركم بهذه الأمور، حتى تستطيعوا أن تتذكروها دائما بعد رحيلي."]]}, {"l": "2Pe 3:1", "n": "", "vs": [[1, "أيها الأحباء، أنا الآن أكتب إليكم رسالتي الثانية. وفي كلتا الرسالتين، أقصد أن أنبه أذهانكم الصافية، مذكرا إياكم بحقائق تعرفونها."]]}], "kwAr": "كنت قد نويت أن أكتب", "noteAr": ""}, {"kw": "common", "raw": "Isa_45:17, Isa_45:22; Act_4:12, Act_13:46, Act_13:47, Act_28:28; Gal_3:28; Tit_1:4; 2Pe_1:1", "note": "", "refs": [{"l": "Isa 45:17", "n": "", "vs": [[17, "أما إسرائيل فقد خلصه الرب بخلاص أبدي، ولن يلحقكم عار أو خزي مدى الدهور،"]]}, {"l": "Isa 45:22", "n": "", "vs": [[22, "التفتوا إلي واخلصوا ياجميع أقاصي الأرض، لأني أنا الله وليس هناك آخر."]]}, {"l": "Act 4:12", "n": "", "vs": [[12, "وليس بأحد غيره الخلاص، إذ ليس تحت السماء اسم آخر قدمه الله للبشر به يجب أن نخلص!»"]]}, {"l": "Act 13:46", "n": "", "vs": [[46, "فخاطبهم بولس وبرنابا بجرأة قائلين: «كان يجب أن نبلغكم أنتم أولا كلمة الله، ولكنكم رفضتموها فأظهرتم أنكم لا تستحقون الحياة الأبدية. وها نحن نتوجه إلى غير اليهود!"]]}, {"l": "Act 13:47", "n": "", "vs": [[47, "فقد أوصانا الرب قائلا: قد جعلتك نورا للأمم، لتكون سبيل خلاص إلى أقصى الأرض!»"]]}, {"l": "Act 28:28", "n": "", "vs": [[28, "وختم بولس كلامه بقوله: «اعلموا إذن أن الله قد أرسل خلاصه هذا إلى الأمم الأخرى، وهم سيستمعون إليه!»"]]}, {"l": "Gal 3:28", "n": "", "vs": [[28, "لا فرق بعد الآن بين يهودي ويوناني، أو عبد وحر، أو ذكر وأنثى، لأنكم جميعا واحد في المسيح يسوع."]]}, {"l": "Tit 1:4", "n": "", "vs": [[4, "إلى تيطس، ولدي الحقيقي بالنسبة إلى الإيمان المشترك بيننا."]]}, {"l": "2Pe 1:1", "n": "", "vs": [[1, "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"]]}], "kwAr": "الخلاص الذي نشترك فيه", "noteAr": ""}, {"kw": "that ye", "raw": "Neh_13:25; Jer_9:3; Act_6:8-10, Act_9:22, Act_17:3, Act_18:4-6, Act_18:28; Phi_1:27; 1Th_2:2; 1Ti_1:18, 1Ti_6:12; 2Ti_1:13, 2Ti_4:7, 2Ti_4:8; Rev_2:10, Rev_12:11", "note": "", "refs": [{"l": "Neh 13:25", "n": "", "vs": [[25, "فأنبتهم ولعنتهم وضربت منهم قوما ونتفت شعورهم، واستحلفتهم باسم الله قائلا: «إياكم أن تزوجوا بناتكم من بنيهم، ولا تأخذوا بناتهم لأبنائكم ولا لكم."]]}, {"l": "Jer 9:3", "n": "", "vs": [[3, "«قد وتروا ألسنتهم كقسي جاهزة ليطلقوا الأكاذيب التي تقولوا بها في الأرض من دون الحق، إذ أنهم انتهوا من شر إلى شر، وإياي لم يعرفوا» يقول الرب."]]}, {"l": "Act 6:8-10", "n": "", "vs": [[8, "وإذ كان استفانوس مملوءا بالإيمان والقوة، كان يعمل عجائب ومعجزات عظيمة بين الشعب."], [9, "فعارضه بعض المنتمين إلى جماعة العبيد المحررين، يساندهم بعض اليهود من القيروان والإسكندرية، وغيرهم من مقاطعتي كيليكيا وأسيا، وأخذوا يجادلونه."], [10, "ولكنهم لم يتمكنوا من مقاومة حكمته والروح الذي كان يتكلم به."]]}, {"l": "Act 9:22", "n": "", "vs": [[22, "وأما شاول فقد صار أكثر حماسة في وعظه، فكان يفحم اليهود الساكنين في دمشق ببراهينه التي كان يبين بها أن يسوع هو المسيح."]]}, {"l": "Act 17:3", "n": "", "vs": [[3, "وشرح لهم مبينا أن المسيح كان لابد أن يتألم ويقوم من بين الأموات، وأن «المسيح الذي تنتظرونه هو يسوع الذي أبشركم به الآن!»"]]}, {"l": "Act 18:4-6", "n": "", "vs": [[4, "وكان في كل سبت يناقش الحاضرين في المجمع لإقناع اليهود واليونانيين."], [5, "ولما وصل سيلا وتيموثاوس من مقاطعة مقدونية، تفرغ بولس تماما للتبشير، شاهدا لليهود أن يسوع هو المسيح."], [6, "ولكنهم عارضوا شهادته وأخذوا يجدفون. فما كان منه إلا أن نفض ثوبه وقال لهم: «دمكم على رؤوسكم. أنا بريء! ومنذ الآن أتوجه لتبشير غير اليهود»."]]}, {"l": "Act 18:28", "n": "", "vs": [[28, "فقد كان جريئا في مجادلاته العلنية مع اليهود، وكان يفحمهم مستندا إلى الكتاب فيثبت أن يسوع هو المسيح."]]}, {"l": "Phi 1:27", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"]]}, {"l": "1Th 2:2", "n": "", "vs": [[2, "فمع أننا كنا قد قاسينا الألم والإهانة في مدينة فيلبي، كما تعلمون، فقد تجرأنا في إلهنا أن نكلمكم بإنجيل الله مجاهدين في وجه المعارضة الشديدة."]]}, {"l": "1Ti 1:18", "n": "", "vs": [[18, "هذه التوصيات، ياتيموثاوس ولدي، أسلمها لك، بمقتضى النبوآت السابقة المختصة بك، وغايتي أن تحسن الجهاد في حربك الروحية،"]]}, {"l": "1Ti 6:12", "n": "", "vs": [[12, "أحسن الجهاد في معركة الإيمان الجميلة. تمسك بالحياة الأبدية، التي إليها قد دعيت، وقد اعترفت الاعتراف الحسن (بالإيمان) أمام شهود كثيرين."]]}, {"l": "2Ti 1:13", "n": "", "vs": [[13, "اتخذ من الكلام الصحيح الذي سمعته مني مثالا في الإيمان والمحبة اللذين في المسيح يسوع."]]}, {"l": "2Ti 4:7", "n": "", "vs": [[7, "قد جاهدت الجهاد الحسن، قد بلغت نهاية الشوط، قد حافظت على الإيمان."]]}, {"l": "2Ti 4:8", "n": "", "vs": [[8, "إنما ينتظرني الآن إكليل البر المحفوظ لي، والذي سيهبه لي الرب الديان العادل في ذلك اليوم؛ ولن يوهب لي وحدي، بل أيضا لجميع الذين يحبون ظهوره."]]}, {"l": "Rev 2:10", "n": "", "vs": [[10, "دع عنك الخوف مما ينتظرك من آلام، فإن إبليس سيزج ببعضكم في السجن لكي تمتحنوا، فتقاسون الاضطهاد عشرة أيام. فابق أمينا حتى الموت، فأمنحك إكليل الحياة."]]}, {"l": "Rev 12:11", "n": "", "vs": [[11, "وهم قد انتصروا عليه بدم الحمل وبالكلمة التي شهدوا لها، فلم تكن حياتهم عزيزة لديهم، حتى إنهم ماتوا."]]}], "kwAr": "الجهاد", "noteAr": ""}, {"kw": "which", "raw": "Deu_9:10, Deu_21:9; Act_20:27; 1Co_15:3; Gal_2:5; 2Pe_3:2", "note": "", "refs": [{"l": "Deu 9:10", "n": "", "vs": [[10, "وسلمني الرب لوحي الحجر المكتوبين بأصبع الله، حيث خط عليهما جميع الوصايا التي كلمكم بها الرب في الجبل من وسط النار في يوم الاجتماع."]]}, {"l": "Deu 21:9", "n": "", "vs": [[9, "وهكذا تبرأون من سفك الدم البريء في وسطكم، إذا صنعتم ما هو صالح في عيني الرب."]]}, {"l": "Act 20:27", "n": "", "vs": [[27, "لأني لم أمتنع عن إبلاغكم جميع مقاصد الله."]]}, {"l": "1Co 15:3", "n": "", "vs": [[3, "فالواقع أني سلمتكم، في أول الأمر، ما كنت قد تسلمته، وهو أن المسيح مات من أجل خطايانا وفقا لما في الكتاب،"]]}, {"l": "Gal 2:5", "n": "", "vs": [[5, "فلم نخضع لهم مستسلمين ولو لساعة واحدة، ليبقى حق الإنجيل ثابتا عندكم."]]}, {"l": "2Pe 3:2", "n": "", "vs": [[2, "وغايتي أن تتذكروا الأقوال التي أعلنها الأنبيا ء القديسون قديما، وكذلك وصية الرب والمخلص، تلك الوصية التي نقلها إليكم الرسل."]]}], "kwAr": "الإيمان الذي سلم مرة واحدة", "noteAr": ""}, {"kw": "the saints", "raw": "Eph_1:1; Phi_1:1; Col_1:2", "note": "", "refs": [{"l": "Eph 1:1", "n": "", "vs": [[1, "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."]]}, {"l": "Phi 1:1", "n": "", "vs": [[1, "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."]]}, {"l": "Col 1:2", "n": "", "vs": [[2, "إلى الإخوة القديسين والأمناء في المسيح، المقيمين في مدينة كولوسي. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."]]}], "kwAr": "للقديسين", "noteAr": ""}], "arS": [["أيها ", []], ["الأحباء", ["G27"]], ["، كنت قد ", []], ["نويت", ["G4160", "G4710"]], [" أن ", []], ["أكتب", ["G1125"]], [" ", []], ["إليكم", ["G5213"]], [" في ", []], ["موضوع", ["G4012"]], [" ", []], ["الخلاص", ["G4991"]], [" الذي ", []], ["نشترك فيه", ["G2839"]], [" جميعا. ولكن، أراني الآن ", []], ["مضطرا", ["G2192", "G318"]], [" لأن ", []], ["أكتب", ["G1125"]], [" ", []], ["لأشجعكم", ["G3870"]], [" على ", []], ["الجهاد", ["G1864"]], [" في سبيل ", []], ["الإيمان", ["G4102"]], [" الذي ", []], ["سلم", ["G3860"]], [" ", []], ["مرة واحدة", ["G530"]], [" ", []], ["للقديسين", ["G40"]], [".", []]]}, {"c": 1, "v": 4, "text": "لأنه قد تسلل إلى ما بينكم معلمون لابد أن يلاقوا الحكم بالعقاب الأبدي، كما هو مكتوب لهم منذ القديم. فهم أشرار لا يهابون الله ، يتخذون من نعمة إلهنا فرصة لإباحة الرذائل، وينكرون سيدنا وربنا الوحيد يسوع المسيح.", "groups": [{"kw": "crept", "raw": "Mat_13:25; Act_15:24; Gal_2:4; Eph_4:14; 2Ti_3:6; 2Pe_2:1, 2Pe_2:2", "note": "", "refs": [{"l": "Mat 13:25", "n": "", "vs": [[25, "وبينما الناس نائمون، جاء عدوه، وبذر زوانا في وسط القمح، ومضى."]]}, {"l": "Act 15:24", "n": "", "vs": [[24, "علمنا أن بعض الأشخاص ذهبوا من عندنا إليكم، دون تفويض منا فأثاروا بكلامهم الاضطراب بينكم وأقلقوا أفكاركم."]]}, {"l": "Gal 2:4", "n": "", "vs": [[4, "إنما أثير الأمر بسبب الإخوة الدجالين الذين أدخلوا بيننا خلسة، فاندسوا ليتجسسوا حريتنا التي لنا في المسيح يسوع، لعلهم يعيدوننا إلى العبودية؛"]]}, {"l": "Eph 4:14", "n": "", "vs": [[14, "وذلك حتى لا نكون فيما بعد أطفالا تتقاذفنا وتحملنا كل ريح تعليم يقوم على خداع الناس والمكر بهم لجرهم إلى الضلال الملفق،"]]}, {"l": "2Ti 3:6", "n": "", "vs": [[6, "فمن هؤلاء من يدخلون البيوت خلسة، ويوقعون في حبائلهم بعض النساء السخيفات المثقلات بالخطايا، اللواتي تجرفهن شهوات مختلفة،"]]}, {"l": "2Pe 2:1", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."]]}, {"l": "2Pe 2:2", "n": "", "vs": [[2, "وكثيرون سيسيرون وراءهم في طرق الإباحية. وبسببهم توجه الإهانة إلى طريق الحق."]]}], "kwAr": "تسلل", "noteAr": ""}, {"kw": "who", "raw": "Rom_9:21, Rom_9:22; 1Pe_2:8; 2Pe_2:3", "note": "", "refs": [{"l": "Rom 9:21", "n": "", "vs": [[21, "أوليس لصانع الفخار سلطة على الطين ليصنع من كتلة واحدة وعاء للاستعمال الرفيع وآخر للاستعمال الوضيع؟"]]}, {"l": "Rom 9:22", "n": "", "vs": [[22, "فماذا إذا إن كان الله ، وقد شاء أن يظهر غضبه ويعلن قدرته، احتمل بكل صبر أوعية غضب جاهزة للهلاك،"]]}, {"l": "1Pe 2:8", "n": "", "vs": [[8, "كما أنه هو «الحجر الذي يصطدمون به، والصخرة التي يسقطون عليها»! وهم يسقطون لأنهم يرفضون أن يؤمنوا بالكلمة."]]}, {"l": "2Pe 2:3", "n": "", "vs": [[3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}], "kwAr": "مكتوب لهم منذ القديم", "noteAr": ""}, {"kw": "ungodly", "raw": "Jud_1:15; 2Sa_22:5; Psa_1:1; 1Pe_4:18; 2Pe_2:5, 2Pe_2:6, 2Pe_3:7", "note": "", "refs": [{"l": "Jud 1:15", "n": "", "vs": [[15, "ليدين جميع الناس، ويوبخ جميع الأشرار الذين لا يهابون الله ، بسبب جميع أعمالهم الشريرة التي ارتكبوها وجميع أقوالهم القاسية التي أهانوه بها والتي لا تصدر إلا عن الخاطئين الأشرار غير الأتقياء!»"]]}, {"l": "2Sa 22:5", "n": "", "vs": [[5, "طوقتني أمواج الموت وسيول الهلاك غمرتني."]]}, {"l": "Psa 1:1", "n": "", "vs": [[1, "طوبى للإنسان الذي لا يتبع مشورة الأشرار، ولا يقف في طريق الخاطئين، ولا يجالس المستهزئين."]]}, {"l": "1Pe 4:18", "n": "", "vs": [[18, "وإن كان البار يخلص بجهد، فماذا يحدث للشرير والخاطيء؟"]]}, {"l": "2Pe 2:5", "n": "", "vs": [[5, "كذلك لم يشفق على العالم القديم عندما أحدث الطوفان على عالم الفاجرين، إلا أنه حفظ نوحا المنادي ببر الله وعدله. وكان نوح واحدا من ثمانية أشخاص نجوا من الطوفان."]]}, {"l": "2Pe 2:6", "n": "", "vs": [[6, "وإذ حكم الله على مدينتي سدوم وعمورة بالخراب، حولهما إلى رماد، جاعلا منهما عبرة للذين يعيشون حياة فاجرة."]]}, {"l": "2Pe 3:7", "n": "", "vs": [[7, "أما السماوات والأرض الحالية، فستبقى مخزونة ومحفوظة للنار بتلك الكلمة عينها إلى يوم الدينونة وهلاك الفاجرين!"]]}], "kwAr": "لا يهابون الله", "noteAr": ""}, {"kw": "turning", "raw": "Rom_6:1, Rom_6:2; Gal_5:13; Tit_2:11, Tit_2:12; Heb_12:15, Heb_12:16; 1Pe_2:16; 2Pe_2:10,2Pe_2:18-22", "note": "", "refs": [{"l": "Rom 6:1", "n": "", "vs": [[1, "إذن ماذا نقول؟ أنستمر في الخطيئة لكي تتوافر النعمة؟"]]}, {"l": "Rom 6:2", "n": "", "vs": [[2, "حاشا! فنحن الذين متنا بالنسبة للخطيئة، كيف نعيش بعد فيها؟"]]}, {"l": "Gal 5:13", "n": "", "vs": [[13, "فإنما إلى الحرية قد دعيتم، أيها الإخوة؛ ولكن لا تتخذوا من الحرية ذريعة لإرضاء الجسد، بل بالمحبة كونوا عبيدا في خدمة أحدكم الآخر."]]}, {"l": "Tit 2:11", "n": "", "vs": [[11, "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت."]]}, {"l": "Tit 2:12", "n": "", "vs": [[12, "وهي تعلمنا أن نقطع علاقتنا بالإباحية والشهوات العالمية، وأن نحيا في العصر الحاضر حياة التعقل والبر والتقوى،"]]}, {"l": "Heb 12:15", "n": "", "vs": [[15, "انتبهوا ألا يسقط أحدكم من نعمة الله، حتى لا يتأصل بينكم جذر مرارة، فيسبب بلبلة، وينجس كثيرين منكم."]]}, {"l": "Heb 12:16", "n": "", "vs": [[16, "وحذار أن يكون بينكم زان أو مستهتر مثل عيسو الذي باع حقوقه بوصفه الابن البكر، لقاء أكلة واحدة."]]}, {"l": "1Pe 2:16", "n": "", "vs": [[16, "تصرفوا كأحرار حقا، لا كالذين يتخذون من الحرية ستارا لارتكاب الشر بل باعتبار أنكم عبيد لله."]]}, {"l": "2Pe 2:10", "n": "", "vs": [[10, "وما أشد العقاب، وبخاصة على الذين ينجرفون وراء الميول الجسدية، مستجيبين لشهوة النجاسة، ومحتقرين سيادة الله! ثم إنهم وقحون، معجبون بأنفسهم، لا يخافون أن يتكلموا بالشتم والإهانة على أصحاب الأمجاد."]]}, {"l": "2Pe 2:18-22", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."], [19, "يعدون هؤلاء بالحرية، وهم أنفسهم عبيد للفساد! لأن الإنسان يصير عبدا لكل ما يتسلط عليه ويغلبه."], [20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."], [21, "وبالحقيقة، كان أفضل لهم لو أنهم لم يتعرفوا بطريق البر، من أن يتعرفوا به ثم يرتدوا عن الوصية المقدسة التي تسلموها."], [22, "وينطبق على هؤلاء ما يقوله المثل الصادق: «عاد الكلب إلى تناول ما تقيأه، والخنزيرة المغتسلة إلى التمرغ في الوحل!»"]]}], "kwAr": "يتخذون من نعمة إلهنا فرصة", "noteAr": ""}, {"kw": "denying", "raw": "Tit_1:15, Tit_1:16; 2Pe_2:1; 1Jo_2:22", "note": "", "refs": [{"l": "Tit 1:15", "n": "", "vs": [[15, "عند الطاهرين، كل شيء طاهر. أما عند النجسين وغير المؤمنين، فما من شيء طاهر، بل إن عقولهم وضمائرهم أيضا قد صارت نجسة."]]}, {"l": "Tit 1:16", "n": "", "vs": [[16, "يشهدون معترفين بأنهم يعرفون الله ، ولكنهم بأعمالهم ينكرونه، لأنهم مكروهون وغير طائعين، وقد تبين أنهم غير أهل لكل عمل صالح."]]}, {"l": "2Pe 2:1", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."]]}, {"l": "1Jo 2:22", "n": "", "vs": [[22, "ومن هو الكذاب؟ إنه الذي ينكر أن يسوع هو المسيح حقا. إنه ضد للمسيح ينكر الآب والابن معا."]]}], "kwAr": "ينكرون", "noteAr": ""}, {"kw": "only", "raw": "Psa_62:2; Joh_17:3; 1Ti_6:15, 1Ti_6:16; Rev_15:4", "note": "", "refs": [{"l": "Psa 62:2", "n": "", "vs": [[2, "هو وحده صخرتي وخلاصي وحصني المنيع، لذلك لا أتزعزع أبدا."]]}, {"l": "Joh 17:3", "n": "", "vs": [[3, "والحياة الأبدية هي أن يعرفوك أنت الإله الحق وحدك، والذي أرسلته: يسوع المسيح."]]}, {"l": "1Ti 6:15", "n": "", "vs": [[15, "هذا الظهور سوف يتممه الله في وقته الخاص، هو السيد المبارك الأوحد، ملك الملوك ورب الأرباب،"]]}, {"l": "1Ti 6:16", "n": "", "vs": [[16, "الذي وحده لا فناء له، الساكن في نور لا يدنى منه، الذي لم يره أي إنسان ولا يقدر أن يراه. له الكرامة والقدرة الأبدية. آمين!"]]}, {"l": "Rev 15:4", "n": "", "vs": [[4, "من لا يخافك يارب ولا يمجد اسمك؟ فأنت وحدك قدوس! والأمم جميعا سيأتون ويسجدون لك، لأن أحكامك قد ظهرت جلية»."]]}], "kwAr": "سيدنا وربنا الوحيد", "noteAr": ""}], "arS": [["لأنه", ["G1063"]], [" قد ", []], ["تسلل", ["G3921"]], [" إلى ما بينكم ", []], ["معلمون", ["G5100", "G444"]], [" لابد أن يلاقوا ", []], ["الحكم", ["G2917"]], [" بالعقاب الأبدي، كما هو ", []], ["مكتوب", ["G4270"]], [" لهم منذ ", []], ["القديم", ["G3819"]], [". فهم ", []], ["أشرار", ["G765"]], [" لا يهابون الله ، ", []], ["يتخذون", ["G3346"]], [" من ", []], ["نعمة", ["G5485"]], [" ", []], ["إلهنا", ["G2257", "G2316"]], [" فرصة لإباحة ", []], ["الرذائل", ["G766"]], ["، ", []], ["وينكرون", ["G720"]], [" ", []], ["سيدنا", ["G1203"]], [" ", []], ["وربنا", ["G2962"]], [" ", []], ["الوحيد", ["G3441"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 1, "v": 5, "text": "فالآن، أريد أن أذكركم بأمور تعرفونها. فأنتم تعرفون أن الرب، بعدما أنقذ الشعب من مصر، عاد فأهلك الذين لم يؤمنوا من ذلك الشعب.", "groups": [{"kw": "put", "raw": "Rom_15:15; 2Pe_1:12, 2Pe_1:13, 2Pe_3:1", "note": "", "refs": [{"l": "Rom 15:15", "n": "", "vs": [[15, "على أني كتبت إليكم بأوفر جرأة في بعض الأمور، مذكرا لكم، وذلك بالنعمة التي وهبها الله لي."]]}, {"l": "2Pe 1:12", "n": "", "vs": [[12, "لذلك أنوي أن أذكركم دائما بهذه الأمور، وإن كنتم عالمين بها، وراسخين في الحق الذي عندكم."]]}, {"l": "2Pe 1:13", "n": "", "vs": [[13, "فمادمت في خيمة جسمي هذه، أرى من واجبي أن أنبهكم مذكرا."]]}, {"l": "2Pe 3:1", "n": "", "vs": [[1, "أيها الأحباء، أنا الآن أكتب إليكم رسالتي الثانية. وفي كلتا الرسالتين، أقصد أن أنبه أذهانكم الصافية، مذكرا إياكم بحقائق تعرفونها."]]}], "kwAr": "أذكركم", "noteAr": ""}, {"kw": "having", "raw": "1Co_10:1-12", "note": "", "refs": [{"l": "1Co 10:1-12", "n": "", "vs": [[1, "فإني لا أريد أن يخفى عليكم، أيها الأخوة أن آباءنا كانوا كلهم تحت السحابة، واجتازوا كلهم في البحر،"], [2, "فتعمدوا كلهم أتباعا لموسى، في السحابة وفي البحر،"], [3, "وأكلوا كلهم طعاما واحدا له رمز روحي،"], [4, "وشربوا كلهم شرابا واحدا له رمز روحي، إذ شربوا من صخرة روحية تبعتهم، وقد كانت هذه الصخرة هي المسيح."], [5, "ومع ذلك، فإن الله لم يرتض بأكثرهم إذ طرحوا قتلى في الصحراء."], [6, "وإنما حدثت هذه الأمور لتكون مثالا لنا، حتى لا نشتهي أمورا شريرة كما اشتهى أولئك."], [7, "فلا تكونوا عابدين للأصنام كما كان بعضهم، كما قد كتب: «جلس الشعب للأكل والشرب، ثم قاموا للرقص واللهو»."], [8, "ولا نرتكب الزنا كما فعل بعضهم، فسقط في يوم واحد ثلاثة وعشرون ألفا."], [9, "ولا نجرب الرب كما جربه بعضهم، فأهلكتهم الحيات."], [10, "ولا تتذمروا، كما تذمر بعضهم، فهلكوا على يد الملاك المهلك."], [11, "فهذه الأمور كلها حدثت لهم لتكون مثالا، وقد كتبت إنذارا لنا، نحن الذين تناهت إلينا أواخر الأزمنة."], [12, "فمن توهم أنه صامد، فليحذر أن يسقط."]]}], "kwAr": "بعدما أنقذ الشعب من مصر", "noteAr": ""}, {"kw": "afterward", "raw": "Num. 14:22-37, Num_26:64, Num_26:65; Deu_2:15, Deu_2:16; Psa_106:26; Heb_3:16-19, Heb_4:1, Heb_4:2", "note": "", "refs": [{"l": "Num 14:22-37", "n": "", "vs": [[22, "فإن جميع الرجال الذين عاينوا مجدي ومعجزاتي التي أجريتها في مصر وفي الصحراء، وجربوني عشر مرات من غير أن يطيعوا قولي،"], [23, "لن يروا الأرض التي وعدت بها آباءهم. جميع الذين استخفوا بي، لن يشاهدوها."], [24, "ولكن لأن في عبدي كالب روحا مختلفة، وقد تبعني بكل قلبه، فسأدخله إلى الأرض التي ذهب إليها، وسيرثها نسله من بعده."], [25, "وبما أن العمالقة والكنعانيين ساكنون في الوديان، فارجعوا غدا إلى الصحراء في اتجاه البحر الأحمر»."], [26, "قال الرب لموسى وهرون:"], [27, "«إلى متى أصفح عن هذه الجماعة الشريرة المتذمرة علي؟ لقد سمعت تذمرهم علي،"], [28, "فقل لهم: حي أنا يقول الرب، لأنزلن بكم كل ما تكلمتم به في مسمعي."], [29, "إذ تتساقط جثثكم في هذه الصحراء، من ابن عشرين سنة فما فوق ممن تم إحصاؤهم وتذمروا علي."], [30, "لن تدخلوا الأرض التي وعدت رافعا يدي بقسم أن أسكنكم فيها، ما عدا كالب بن يفنة ويشوع بن نون."], [31, "غير أني سأدخل إليها أولادكم الذين ادعيتم أنهم يصبحون أسرى، فيتمتعون بالأرض التي احتقرتموها."], [32, "أما أنتم فإن جثثكم تتساقط في هذا القفر،"], [33, "ويبقى بنوكم في الصحراء أربعين سنة، تعانون من فجوركم، حتى تبلى جثثكم فيها."], [34, "وتحملون أوزاركم أربعين سنة. كل يوم بسنة، على عدد الأيام الأربعين التي تجسستم فيها الأرض، فتدركون عاقبة ابتعادي عنكم."], [35, "أنا الرب قد تكلمت، وهذا ما سأعاقب به هذه الجماعة الشريرة المتآمرة علي: في هذه الصحراء يفنون ويموتون»."], [36, "أما الجواسيس الذين أرسلهم موسى لاستكشاف الأرض، فرجعوا فأثاروا عليه الشعب بما روجوه من أخبار سيئة عن الأرض،"], [37, "فقد أماتهم الرب بالوبأ عقابا لهم"]]}, {"l": "Num 26:64", "n": "", "vs": [[64, "ولم يكن بين هؤلاء المحصين إنسان ممن عدهم موسى وهرون سابقا في صحراء سيناء،"]]}, {"l": "Num 26:65", "n": "", "vs": [[65, "لأن الرب كان قد قال لهم، إنهم جميعا سيموتون في الصحراء، فلم يبق منهم إنسان سوى كالب بن يفنة ويشوع بن نون."]]}, {"l": "Deu 2:15", "n": "", "vs": [[15, "وهكذا عاقبهم الرب أيضا حتى أبادهم وأفناهم من المخيم."]]}, {"l": "Deu 2:16", "n": "", "vs": [[16, "فعندما مات جميع المقاتلين من بين الشعب"]]}, {"l": "Psa 106:26", "n": "", "vs": [[26, "فأقسم أن يهلكهم في البرية،"]]}, {"l": "Heb 3:16-19", "n": "", "vs": [[16, "فمن هم الذين أثاروا غضب الله عندما سمعوا الدعوة ورفضوها؟ إنهم ذلك الشعب الذي خرج من مصر بقيادة موسى!"], [17, "وعلى من ثار غضب الله مدة أربعين سنة؟ على أولئك الذين أخطأوا، فسقطت جثثهم متناثرة في الصحراء!"], [18, "ولمن أقسم الله أنهم لن يدخلوا أبدا مكان راحته؟ للذين عصوا أمره!"], [19, "وهكذا، نرى أن عدم الإيمان منعهم من الدخول إلى مكان الراحة."]]}, {"l": "Heb 4:1", "n": "", "vs": [[1, "ومادام الوعد بالدخول إلى الراحة الإلهية قائما حتى الآن، فلنخف: فربما تبين أن بعضا منكم قد فشلوا في الدخول."]]}, {"l": "Heb 4:2", "n": "", "vs": [[2, "ذلك أن البشارة بالوعد قد وصلت إلينا، نحن أيضا، كما كانت قد وصلت إلى ذلك الشعب. ولكن البشارة لم تنفع سامعيها شيئا، لأنهم قابلوها بالرفض فلم يؤمنوا بها."]]}], "kwAr": "أهلك الذين لم يؤمنوا", "noteAr": ""}], "arS": [["فالآن، ", []], ["أريد", ["G1014"]], [" أن ", []], ["أذكركم", ["G5279", "G5209"]], [" بأمور ", []], ["تعرفونها", ["G1492"]], [". فأنتم تعرفون ", []], ["أن", ["G3754"]], [" ", []], ["الرب", ["G2962"]], ["، بعدما ", []], ["أنقذ", ["G4982"]], [" ", []], ["الشعب", ["G2992"]], [" ", []], ["من", ["G1537"]], [" ", []], ["مصر", ["G1093", "G125"]], ["، ", []], ["عاد", ["G1208"]], [" ", []], ["فأهلك", ["G622"]], [" الذين ", []], ["لم", ["G3361"]], [" ", []], ["يؤمنوا", ["G4100"]], [" من ذلك الشعب.", []]]}, {"c": 1, "v": 6, "text": "وأما الملائكة الذين لم يحافظوا على مقامهم الرفيع، بل تركوا مركزهم، فمازال الرب يحفظهم مقيدين بسلاسل أبدية في أعماق الظلام، بانتظار دينونة ذلك اليوم العظيم.", "groups": [{"kw": "angels", "raw": "Joh_8:44", "note": "", "refs": [{"l": "Joh 8:44", "n": "", "vs": [[44, "إنكم أولاد أبيكم إبليس، وترغبون أن تعملوا شهوات أبيكم. فهو من البدء كان قاتلا للناس، ولم يثبت في الحق لأنه خال من الحق! وعندما ينطق بالكذب فهو ينضح بما فيه، لأنه كذاب وأبو الكذب!"]]}], "kwAr": "الملائكة", "noteAr": ""}, {"kw": "first estate", "raw": "or, principality, Eph_6:12", "note": "or, principality, Eph_6:12", "refs": [{"l": "Eph 6:12", "n": "", "vs": [[12, "فإن حربنا ليست ضد ذوي اللحم والدم، بل ضد الرئاسات، ضد السلطات، ضد أسياد العالم حكام هذا الظلام، ضد قوى الشر الروحية في الأماكن السماوية."]]}], "kwAr": "مقامهم الرفيع", "noteAr": "أو: رياسة."}, {"kw": "he hath", "raw": "Mat_25:41; 2Pe_2:4", "note": "", "refs": [{"l": "Mat 25:41", "n": "", "vs": [[41, "ثم يقول للذين عن يساره: ابتعدوا عني ياملاعين إلى النار الأبدية المعدة لإبليس وأعوانه!"]]}, {"l": "2Pe 2:4", "n": "", "vs": [[4, "فإن الله لم يشفق على الملائكة الذين أخطأوا، بل طرحهم في أعماق هاوية الظلام مقيدين بالسلاسل، حيث يظلون محبوسين إلى يوم الحساب."]]}], "kwAr": "يحفظهم مقيدين", "noteAr": ""}, {"kw": "unto", "raw": "Mat_8:29; Heb_10:27; Rev_20:10", "note": "", "refs": [{"l": "Mat 8:29", "n": "", "vs": [[29, "وفجأة صرخا قائلين: «ما شأنك بنا يايسوع ابن الله؟ أجئت إلى هنا قبل الأوان لتعذبنا؟»"]]}, {"l": "Heb 10:27", "n": "", "vs": [[27, "بل انتظار العقاب الأكيد في لهيب النار التي ستلتهم المتمردين. ويا له من انتظار مخيف!"]]}, {"l": "Rev 20:10", "n": "", "vs": [[10, "ثم يطرح إبليس الذي كان يضللهم، في بحيرة النار والكبريت، حيث الوحش والنبي الدجال. هناك سوف يعذبون نهارا وليلا، إلى أبد الآبدين."]]}], "kwAr": "دينونة ذلك اليوم العظيم", "noteAr": ""}], "arS": [["وأما ", []], ["الملائكة", ["G32"]], [" الذين ", []], ["لم", ["G3361"]], [" ", []], ["يحافظوا", ["G5083"]], [" على ", []], ["مقامهم الرفيع", ["G1438", "G746"]], ["، ", []], ["بل", ["G235"]], [" ", []], ["تركوا", ["G620"]], [" ", []], ["مركزهم", ["G2398", "G3613"]], ["، فمازال الرب ", []], ["يحفظهم", ["G5083"]], [" مقيدين ", []], ["بسلاسل", ["G1199"]], [" ", []], ["أبدية", ["G126"]], [" في أعماق ", []], ["الظلام", ["G2217"]], ["، ", []], ["بانتظار", ["G1519"]], [" ", []], ["دينونة", ["G2920"]], [" ذلك ", []], ["اليوم", ["G2250"]], [" ", []], ["العظيم", ["G3173"]], [".", []]]}, {"c": 1, "v": 7, "text": "وتعرفون كذلك ما فعله الرب بمدينتي سدوم وعمورة وبالمدن التي حولهما. فقد كان أهل هذه المدن، مثل أولئك المعلمين، مندفعين وراء الزنى، ومنغمسين في شهوات مخالفة للطبيعة. لذلك عاقب الرب هذه المدن بالنار الأبدية، فدمرها. فكانت بذلك عبرة للآخرين.", "groups": [{"kw": "as", "raw": "Gen_13:13, Gen_18:20, Gen_19:24-26; Deu_29:23; Isa_1:9, Isa_13:19; Jer_20:16; Jer_50:40; Lam_4:6; Eze_16:49, Eze_16:50; Hos_11:8; Amo_4:11; Luk_17:29", "note": "", "refs": [{"l": "Gen 13:13", "n": "", "vs": [[13, "وكان أهل سدوم متورطين في الشر وخاطئين جدا لدى الرب."]]}, {"l": "Gen 18:20", "n": "", "vs": [[20, "وقال الرب: «لأن الشكوى ضد مظالم سدوم وعمورة قد كثرت وخطيئتهم قد عظمت جدا"]]}, {"l": "Gen 19:24-26", "n": "", "vs": [[24, "فأمطر الرب على سدوم وعمورة كبريتا ونارا، من عنده من السماء."], [25, "وقلب تلك المدن والساكنين فيها، والسهل المحيط بها وكل مزروعات الأرض."], [26, "وتلفتت زوجة لوط السائرة خلفه وراءها، فتحولت إلى عمود من الملح."]]}, {"l": "Deu 29:23", "n": "", "vs": [[23, "إذ تصبح جميع الأرض كبريتا، محترقة لا زرع فيها ولا نبات ولا عشب، وكأنها انقلبت كما جرى لسدوم وعمورة وأدمة وصبوييم، التي قلبها الرب من جراء غضبه وسخطه."]]}, {"l": "Isa 1:9", "n": "", "vs": [[9, "لولا أن الرب القدير حفظ لنا بقية يسيرة، لأصبحنا مثل سدوم وعمورة."]]}, {"l": "Isa 13:19", "n": "", "vs": [[19, "أما بابل، مجد الممالك وبهاء وفخر الكلدانيين، فتصبح كسدوم وعمورة اللتين قلبهما الله ."]]}, {"l": "Jer 20:16", "n": "", "vs": [[16, "ليصبح ذلك الرجل كالمدن التي قلبها الرب من غير رفق، وليسمع صراخ المعارك في الصباح، وضجيج جلبتها عند الظهيرة."]]}, {"l": "Jer 50:40", "n": "", "vs": [[40, "وكما قلب الله سدوم وعمورة وما جاورهما، هكذا لن يسكن فيها أحد أو يقيم فيها إنسان."]]}, {"l": "Lam 4:6", "n": "", "vs": [[6, "لأن عقاب إثم ابنة شعبي أعظم من عقاب خطيئة سدوم التي انقلبت في لحظة، من غير أن تمتد إليها يد إنسان."]]}, {"l": "Eze 16:49", "n": "", "vs": [[49, "أما إثم أختك سدوم، فإنها مع بناتها طغت عليها الغطرسة والتخمة وسلام الاطمئنان، ولم تغث الفقير والمسكين."]]}, {"l": "Eze 16:50", "n": "", "vs": [[50, "وتشامخن وارتكبن الرجس أمامي، فمحوتهن عندما شاهدت ذلك."]]}, {"l": "Hos 11:8", "n": "", "vs": [[8, "كيف أتخلى عنك ياأفرايم؟ وكيف أسلمك إلى العدو ياإسرائيل؟ كيف أعاملك كما عاملت أدمة؟ وكيف أجري عليك ما أجريته على صبوئيم؟ إن قلبي يتلوى أسى في داخلي وتضرم في مراحمي."]]}, {"l": "Amo 4:11", "n": "", "vs": [[11, "دمرت بعض مدنكم كما دمر الله سدوم وعمورة، فكان من نجا منكم كشعلة منتشلة من النار. ولكنكم لم ترجعوا إلي تائبين."]]}, {"l": "Luk 17:29", "n": "", "vs": [[29, "ولكن في اليوم الذي فيه خرج لوط من سدوم، أمطر (الله ) من السماء نارا وكبريتا، فأهلك الجميع"]]}], "kwAr": "سدوم وعمورة", "noteAr": ""}, {"kw": "strange", "raw": "Gr. other, Gen_19:5; Rom_1:26, Rom_1:27; 1Co_6:9", "note": "Gr. other, Gen_19:5; Rom_1:26, Rom_1:27; 1Co_6:9", "refs": [{"l": "Gen 19:5", "n": "", "vs": [[5, "ونادوا لوطا: «أين الرجلان اللذان استضفتهما الليلة؟ أخرجهما إلينا لنضاجعهما»."]]}, {"l": "Rom 1:26", "n": "", "vs": [[26, "لهذا السبب أسلمهم الله إلى الشهوات المخزية. فإن إناثهم تحولن عن استعمال أجسادهن بالطريقة الطبيعية إلى استعمالها بطريقة مخالفة للطبيعة."]]}, {"l": "Rom 1:27", "n": "", "vs": [[27, "وكذلك تحول الذكور أيضا عن استعمال الأنثى بالطريقة الطبيعية، والتهبوا شهوة بعضهم لبعض، مرتكبين الفحشاء ذكورا بذكور، فاستحقوا أن ينالوا في أنفسهم الجزاء العادل على ضلالهم."]]}, {"l": "1Co 6:9", "n": "", "vs": [[9, "أما تعلمون أن الظالمين لن يرثوا ملكوت الله؟ لا تضلوا: فإن ملكوت الله لن يرثه الزناة ولا عابدو الأصنام ولا الفاسقون ولا المتخنثون ولا مضاجعو الذكور"]]}], "kwAr": "شهوات مخالفة للطبيعة", "noteAr": "في اليونانية: أخرى."}, {"kw": "are", "raw": "Mat_11:24; 2Pe_2:6", "note": "", "refs": [{"l": "Mat 11:24", "n": "", "vs": [[24, "ولكني أقول لكم إن حالة بلاد سدوم في يوم الدينونة، ستكون أخف وطأة من حالتك! »"]]}, {"l": "2Pe 2:6", "n": "", "vs": [[6, "وإذ حكم الله على مدينتي سدوم وعمورة بالخراب، حولهما إلى رماد، جاعلا منهما عبرة للذين يعيشون حياة فاجرة."]]}], "kwAr": "عبرة للآخرين", "noteAr": ""}, {"kw": "eternal", "raw": "Deu_29:23; Isa_33:14; Mat_25:41; Mar_9:43-49", "note": "", "refs": [{"l": "Deu 29:23", "n": "", "vs": [[23, "إذ تصبح جميع الأرض كبريتا، محترقة لا زرع فيها ولا نبات ولا عشب، وكأنها انقلبت كما جرى لسدوم وعمورة وأدمة وصبوييم، التي قلبها الرب من جراء غضبه وسخطه."]]}, {"l": "Isa 33:14", "n": "", "vs": [[14, "قد ارتعب الخطاة في صهيون، واستولت الرعدة على الكافرين، فهتفوا: من منا يقدر أن يسكن مع نار آكلة؟ ومن منا يمكنه أن يقيم في وقائد أبدية؟"]]}, {"l": "Mat 25:41", "n": "", "vs": [[41, "ثم يقول للذين عن يساره: ابتعدوا عني ياملاعين إلى النار الأبدية المعدة لإبليس وأعوانه!"]]}, {"l": "Mar 9:43-49", "n": "", "vs": [[43, "فإن كانت يدك فخا لك، فاقطعها: أفضل لك أن تدخل الحياة ويدك مقطوعة من أن تكون لك يدان وتذهب إلى جهنم، إلى النار التي لا تطفأ"], [44, "حيث دودهم لا يموت، والنار لا تطفأ"], [45, "وإن كانت رجلك فخا لك، فاقطعها: أفضل لك أن تدخل الحياة ورجلك مقطوعة من أن تكون لك رجلان وتطرح في جهنم، في النار التي لا تطفأ."], [46, "حيث دودهم لا يموت، والنار لا تطفأ."], [47, "وإن كانت عينك فخا لك، فاقلعها: أفضل لك أن تدخل ملكوت الله وعينك مقلوعة من أن تكون لك عينان وتطرح في جهنم النار."], [48, "حيث دودهم لا يموت، والنار لا تطفأ."], [49, "فإن كل واحد سوف تملحه النار."]]}], "kwAr": "النار الأبدية", "noteAr": ""}], "arS": [["وتعرفون ", []], ["كذلك", ["G5613"]], [" ما فعله الرب بمدينتي ", []], ["سدوم", ["G4670"]], [" ", []], ["وعمورة", ["G1116"]], [" ", []], ["وبالمدن", ["G4172"]], [" التي ", []], ["حولهما", ["G4012", "G846"]], [". فقد كان أهل هذه المدن، ", []], ["مثل", ["G3664", "G5158"]], [" أولئك المعلمين، مندفعين وراء ", []], ["الزنى", ["G1608"]], ["، ", []], ["ومنغمسين", ["G565", "G3694"]], [" في ", []], ["شهوات", ["G4561"]], [" ", []], ["مخالفة للطبيعة", ["G2087"]], [". لذلك ", []], ["عاقب", ["G5254", "G1349"]], [" الرب هذه المدن ", []], ["بالنار", ["G4442"]], [" ", []], ["الأبدية", ["G166"]], ["، فدمرها. ", []], ["فكانت", ["G4295"]], [" بذلك ", []], ["عبرة", ["G1164"]], [" للآخرين.", []]]}, {"c": 1, "v": 8, "text": "ومع ذلك، فإن أولئك المعلمين المتوهمين يسيرون في الطريق التي سار فيها أهل تلك المدن. إذ يلوثون أجسادهم بالنجاسة، ويحتقرون السيادة الإلهية، ويتكلمون بالإهانة على الكائنات المجيدة!", "groups": [{"kw": "these", "raw": "Jer_38:25-28", "note": "", "refs": [{"l": "Jer 38:25-28", "n": "", "vs": [[25, "فإذا سمع الرؤساء أني تحدثت إليك وسألوك: بماذا خاطبت الملك، وماذا قال الملك؟ لا تكتم عنا شيئا، ونحن لن نقتلك."], [26, "فأجبهم: إني توسلت إلى الملك أن لا يردني إلى بيت يوناثان لأموت هناك»."], [27, "فأقبل كل الرؤساء إلى إرميا واستجوبوه، فأخبرهم بمقتضى ما أوصاه به الملك من كلام. فكفوا عنه لأن الحديث الذي دار بينهما لم يشع."], [28, "فأقام إرميا في دار الحرس إلى اليوم الذي سقطت فيه أورشليم."]]}], "kwAr": "المتوهمين", "noteAr": ""}, {"kw": "defile", "raw": "1Co_3:17; 1Ti_1:10; 2Pe_2:10-12", "note": "", "refs": [{"l": "1Co 3:17", "n": "", "vs": [[17, "فإن دمر أحد هيكل الله، يدمره الله ، لأن هيكل الله مقدس، وهو أنتم"]]}, {"l": "1Ti 1:10", "n": "", "vs": [[10, "والزناة ومضاجعي الذكور، وخطافي الناس والكذابين وشاهدي الزور. وذوي كل شر آخر يخالف التعليم الصحيح"]]}, {"l": "2Pe 2:10-12", "n": "", "vs": [[10, "وما أشد العقاب، وبخاصة على الذين ينجرفون وراء الميول الجسدية، مستجيبين لشهوة النجاسة، ومحتقرين سيادة الله! ثم إنهم وقحون، معجبون بأنفسهم، لا يخافون أن يتكلموا بالشتم والإهانة على أصحاب الأمجاد."], [11, "ومع ذلك، فحتى الملائكة، وهم يتفوقون عليهم في القوة والقدرة، لا يقدمون عليهم أمام الرب أية تهمة مهينة.."], [12, "حقا إن هؤلاء المعلمين الدجالين الذين يتكلمون كلاما مهينا في أمور يجهلونها، يشبهون الحيوانات المفترسة غير العاقلة، المولودة ليصطادها الناس ويقتلوها. فلابد أن يهلكوا مثلها."]]}], "kwAr": "يلوثون أجسادهم", "noteAr": ""}, {"kw": "despise", "raw": "Gen_3:5; Num_16:3, Num_16:12, Num_16:13, 1Sa_10:27; Psa_2:1-6, Psa_12:3-4; Luk_19:14; Act_7:27, Act_7:39; 1Th_4:8; Heb_13:17", "note": "", "refs": [{"l": "Gen 3:5", "n": "", "vs": [[5, "بل إن الله يعرف أنه حين تأكلان من ثمر هذه الشجرة تنفتح أعينكما فتصيران مثله، قادرين على التمييز بين الخير والشر»."]]}, {"l": "Num 16:3", "n": "", "vs": [[3, "هؤلاء تألبوا على موسى وهرون وقالوا: «حسبكما! إن كل الجماعة بأسرها مقدسة، وفي وسطها الرب. فما بالكما تترفعان على جماعة الرب؟»"]]}, {"l": "Num 16:12", "n": "", "vs": [[12, "فأرسل موسى يستدعي داثان وأبيرام ابني أليآب، فردا: «لن نحضر!"]]}, {"l": "Num 16:13", "n": "", "vs": [[13, "ألم يكفك أنك أخرجتنا من أرض تدر لبنا وعسلا لتهلكنا في الصحراء، ثم تترَأس علينا؟"]]}, {"l": "1Sa 10:27", "n": "", "vs": [[27, "غير أن فئة من الغوغاء قالوا: «كيف ينقذنا هذا؟» فاحتقروه ولم يقدموا له هدايا. أما شاول فاعتصم بالصمت."]]}, {"l": "Psa 2:1-6", "n": "", "vs": [[1, "لماذا ضجت الأمم؟ ولماذا تتآمر الشعوب باطلاَ؟"], [2, "اجتمع ملوك الأرض ورؤساؤها، وتحالفوا ليقاوموا الرب ومسيحه، قائلين:"], [3, "«لنحطم عنا قيودهما، ونتحرر من نير عبوديتهما»."], [4, "لكن الجالس على عرشه في السماوات يضحك. الرب يستهزيء بهم."], [5, "عندئذ ينذرهم في حمو غضبه، ويروعهم بشدة سخطه،"], [6, "قائلاَ: «أما أنا فقد مسحت ملكي، وأجلسته على صهيون، جبلي المقدس»."]]}, {"l": "Psa 12:3-4", "n": "", "vs": [[3, "يقطع الرب كل الشفاه الملقة، وكل لسان متبجح."], [4, "الذين قالوا: ألسنتنا لنا وبها نسود. فمن يتحكم فينا؟"]]}, {"l": "Luk 19:14", "n": "", "vs": [[14, "ولكن أهل بلده كانوا يبغضونه، فأرسلوا في إثره وفدا، قائلين: لا نريد أن يملك هذا علينا!"]]}, {"l": "Act 7:27", "n": "", "vs": [[27, "فما كان من المعتدي على قريبه إلا أن دفعه بعيدا، وقال: من أقامك رئيسا وقاضيا علينا؟"]]}, {"l": "Act 7:39", "n": "", "vs": [[39, "ولكن آباءنا رفضوا أن يطيعوا موسى، ولم يعترفوا بقيادته، وحنت قلوبهم للرجوع إلى مصر،"]]}, {"l": "1Th 4:8", "n": "", "vs": [[8, "إذن، من استخف بأخيه في هذا الأمر، يستخف لا بإنسان بل بالله، بذاك الذي وهبكم فعلا روحه القدوس."]]}, {"l": "Heb 13:17", "n": "", "vs": [[17, "أطيعوا مرشديكم، واخضعوا لهم، لأنهم يسهرون على مصلحتكم الروحية، كما يسهر الذي يحمل مسئولية سوف يقدم حسابا عن قيامه بها. وعندئذ، يؤدون مهمتهم بفرح دون تذمر. فلن يكون في تذمرهم نفع لكم!"]]}], "kwAr": "يحتقرون السيادة", "noteAr": ""}, {"kw": "speak", "raw": "Jud_1:9, Jud_1:10; Exo_22:28; Pro_30:11, Pro_30:17; Ecc_10:20; Act_23:5; 1Pe_2:17", "note": "", "refs": [{"l": "Jud 1:9", "n": "", "vs": [[9, "فحتى ميخائيل، وهو رئيس ملائكة، لم يجرؤ أن يحكم على إبليس بكلام مهين عندما خاصمه وتجادل معه بخصوص جثمان موسى، وإنما اكتفى بالقول له: «ليزجرك الرب!»"]]}, {"l": "Jud 1:10", "n": "", "vs": [[10, "ولكن هؤلاء المعلمين يتكلمون كلاما مهينا على أمور لا يعرفونها. وأما ما يفهمونه بالغريزة، كالحيوانات غير العاقلة، فإنهم به يدمرون أنفسهم."]]}, {"l": "Exo 22:28", "n": "", "vs": [[28, "لا تشتم القضاة ولا تلعن رؤساء شعبك."]]}, {"l": "Pro 30:11", "n": "", "vs": [[11, "رب جيل يشتم أباه ولا يبارك أمه."]]}, {"l": "Pro 30:17", "n": "", "vs": [[17, "العين الساخرة بالأب، والتي تحتقر طاعة أمها، تقتلعها غربان الوادي، وتلتهمها فراخ النسور."]]}, {"l": "Ecc 10:20", "n": "", "vs": [[20, "لا تلعن الملك حتى في فكرك، ولا تشتم الغني في مخدعك، لأن طير السماء ينقل صوتك، وذا الجناح يبلغ الأمر."]]}, {"l": "Act 23:5", "n": "", "vs": [[5, "فأجاب بولس: «لم أكن أعرف أيها الإخوة أنه رئيس كهنة فقد جاء في الكتاب: لا تشتم رئيس شعبك!»"]]}, {"l": "1Pe 2:17", "n": "", "vs": [[17, "أكرموا جميع الناس. أحبوا الإخوة. خافوا الله . أكرموا الملك."]]}], "kwAr": "يتكلمون بالإهانة", "noteAr": ""}], "arS": [["ومع ", []], ["ذلك", ["G3668"]], ["، فإن ", []], ["أولئك", ["G3778"]], [" المعلمين ", []], ["المتوهمين", ["G1797"]], [" يسيرون في الطريق التي سار فيها أهل تلك المدن. إذ ", []], ["يلوثون", ["G3392"]], [" ", []], ["أجسادهم", ["G4561"]], [" بالنجاسة، ", []], ["ويحتقرون", ["G114"]], [" ", []], ["السيادة", ["G2963"]], [" الإلهية، ويتكلمون ", []], ["بالإهانة  لتساعدوني، فإن قلبي يتحد مع قلوبكم؛ ولكن إن كنتم مزمعين على تسليمي لعدوي من غير ذنب جنيته فإن إله آبائنا يرى وينصف»."]]}, {"l": "Isa 37:3", "n": "", "vs": [[3, "وقالوا له: يقول حزقيا: «هذا اليوم يوم ضيق وإهانة وكرب، صرنا فيه كامرأة تقاسي المخاض وهي عاجزة عن الولادة."]]}, {"l": "Isa 37:4", "n": "", "vs": [[4, "لعل الرب إلهك قد سمع وعيد ربشاقى الذي أوفده سيده ملك أشور ليهين الإله الحي، فيعاقبه الرب إلهك على ما صدر منه من تعيير، فصل من أجل البقية الناجية»."]]}, {"l": "Isa 37:10-20", "n": "", "vs": [[10, "«هذا ما تبلغونه إلى حزقيا ملك يهوذا: لا يخدعنك إلهك الذي تتكل عليه عندما يقول: لن تسقط أورشليم في قبضة ملك أشور."], [11, "فها أنت قد علمت بما ألحقه ملوك أشور بكل البلدان من تدمير كامل، فهل يمكن أن تنجو أنت؟"], [12, "هل أنقذت آلهة الأمم الأخرى أهل جوزان وحاران ورصف وأبناء عدن في تلسار الذين أفناهم آبائي؟"], [13, "أين ملك حماة، وملك أرفاد، وملك مدينة سفروايم، وهينع وعوا؟»"], [14, "فتناول حزقيا الكتاب من أيدي الرسل وقرأه، ثم توجه إلى بيت الرب وبسطه أمامه،"], [15, "وصلى قائلا:"], [16, "«أيها الرب القدير، إله إسرائيل المتربع فوق الكروبيم، أنت وحدك إله كل ممالك الأرض، وأنت وحدك صانع السماء والأرض."], [17, "أرهف يارب أذنيك واصغ. افتح يارب عينيك وانظر، واسمع كل تهديدات سنحاريب التي بعث بها ليعير الله الحي."], [18, "حقا يارب، إن ملوك أشور قد أبادوا الأمم ودمروا ديارهم"], [19, "وطرحوا آلهتهم إلى النار وأبادوها لأنها لم تكن فعلا آلهة بل خشبا وحجارة صنعة أيدي الناس"], [20, "فخلصنا الآن أيها الرب إلهنا، أنقذنا من يده، فتدرك ممالك الأرض بأسرها أنك أنت وحدك الرب الإله»."]]}, {"l": "Zec 3:2", "n": "", "vs": [[2, "فقال الرب للشيطان: «إن الرب ينتهرك ياشيطان، الرب الذي اصطفى أورشليم ينتهرك، أليس هذا الرجل كحطبة مشتعلة انتشلت من النار؟»"]]}], "kwAr": "ليزجرك الرب", "noteAr": ""}], "arS": [["فحتى", ["G1161"]], [" ", []], ["ميخائيل", ["G3413"]], ["، وهو ", []], ["رئيس ملائكة", ["G743"]], ["، ", []], ["لم", ["G3756"]], [" ", []], ["يجرؤ", ["G5111"]], [" أن ", []], ["يحكم", ["G2018"]], [" على ", []], ["إبليس", ["G1228"]], [" ", []], ["بكلام مهين", ["G988", "G2920"]], [" ", []], ["عندما", ["G 3:13-16; Luk_11:42-47", "note": "", "refs": [{"l": "Isa 3:9", "n": "", "vs": [[9, "ملامح وجوههم تشهد عليهم، إذ يجاهرون بخطيئتهم كسدوم ولا يسترونها، فويل لهم لأنهم جلبوا على أنفسهم شرا."]]}, {"l": "Isa 3:11", "n": "", "vs": [[11, "أما الشرير فويل له وبئس المصير لأنه يجازى على ما جنته يداه"]]}, {"l": "Jer 13:27", "n": "", "vs": [[27, "قد شهدت على التلال في الحقول فسقك وحمحمة فجورك وعهر زناك. ويل لك ياأورشليم. إلى متى تظلين غير طاهرة؟»"]]}, {"l": "Eze 13:3", "n": "", "vs": [[3, "ويل للأنبياء الحمقى الضالين وراء أرواحهم من غير أن يروا شيئا."]]}, {"l": "Zec 11:17", "n": "", "vs": [[17, "ويل للراعي الأحمق الذي يهجر القطيع. ليبتر السيف ذراعه ويفقأ عينه اليمنى، فتيبس ذراعه وتكف عينه اليمنى عن البصر»."]]}, {"l": "Mat 11:21", "n": "", "vs": [[21, "فقال: «الويل لك ياكورزين! الويل لك يابيت صيدا! فلو أجري في صور وصيدا ما أجري فيكما من المعجزات، لتاب أهلهما منذ القديم متشحين بالمسوح في وسط الرماد."]]}, {"l": "Mat 23:13-16", "n": "", "vs": [[13, "لكن الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تغلقون ملكوت السماوات في وجوه الناس، فلا أنتم تدخلون، ولا تدعون الداخلين يدخلون!"], [14, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تلتهمون بيوت الأرامل وتتذرعون بإطالة صلواتكم. لذلك ستنزل بكم دينونة أقسى!"], [15, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تطوفون البحر والبر لتكسبوا متهودا واحدا؛ فإذا تهود جعلتموه أهلا لجهنم ضعف ما أنتم عليه!"], [16, "الويل لكم أيها القادة العميان! تقولون: من أقسم بالهيكل، فقسمه غير ملزم؛ أما من أقسم بذهب الهيكل، فقسمه ملزم!"]]}, {"l": "Luk 11:42-47", "n": "", "vs": [[42, "ولكن الويل لكم أيها الفريسيون فإنكم تدفعون عشر النعنع والسذاب والبقول الأخرى، وتتجاوزون عن العدل ومحبة الله: كان يجب أن تعملوا هذا ولا تهملوا ذاك!"], [43, "الويل لكم أيها الفريسيون، فإنكم تحبون تصدر المقاعد الأولى في المجامع وتلقي التحيات في الساحات العامة!"], [44, "الويل لكم، فإنكم تشبهون القبور المخفية، يمشي الناس عليها وهم لا يعلمون!»"], [45, "وتكلم أحد علماء الشريعة، قائلا له: «يامعلم، إنك بقولك هذا تهيننا نحن أيضا»."], [46, "فقال: «والويل أيضا لكم ياعلماء الشريعة، فإنكم تحملون الناس أحمالا مرهقة، وأنتم لا تمسونها بإصبع من أصابعكم!"], [47, "الويل لكم، فإنكم تبنون قبور الأنبياء وآباؤكم قتلوهم."]]}], "kwAr": "الويل لهم", "noteAr": ""}, {"kw": "for", "raw": "Gen_4:5-14; 1Jo_3:12", "note": "", "refs": [{"l": "Gen 4:5-14", "n": "", "vs": [[5, "لكنه لم يتقبل قربان قايين ولم يرض عنه. فاغتاظ قايين جدا وتجهم وجهه كمدا."], [6, "فسأل الرب قايين: «لماذا اغتظت؟ لماذا تجهم وجهك؟"], [7, "لو أحسنت في تصرفك ألا يشرق وجهك فرحا؟ وإن لم تحسن التصرف، فعند الباب خطيئة تنتظرك، تتشوق أن تتسلط عليك، لكن يجب أن تتحكم فيها»"], [8, "وعاد قايين يتظاهر بالود لأخيه هابيل. وحدث إذ كانا معا في الحقل أن قايين هجم على أخيه هابيل وقتله."], [9, "وسأل الرب قايين: «أين أخوك هابيل؟» فأجاب: «لا أعرف. هل أنا حارس لأخي؟»"], [10, "فقال الرب له: «ماذا فعلت؟ إن صوت دم أخيك يصرخ إلي من الأرض."], [11, "فمنذ الآن، تحل عليك لعنة الأرض التي فتحت فاها وابتلعت دم أخيك الذي سفكته يدك."], [12, "عندما تفلحها لن تعطيك خيرها، وتكون شريدا وطريدا في الأرض»."], [13, "فقال قايين للرب: «عقوبتي أعظم من أن تحتمل."], [14, "ها أنت اليوم قد طردتني عن وجه الأرض، ومن أمام حضرتك أختفي، وأكون شريدا طريدا في الأرض، ويقتلني كل من يجدني»."]]}, {"l": "1Jo 3:12", "n": "", "vs": [[12, "لا أن نكون مثل قايين الذي قتل أخاه. فقايين كان من أولاد إبليس الشرير. ولماذا قتل أخاه؟ قتله لأن أعماله هو كانت شريرة، أما أعمال أخيه فكانت صالحة."]]}], "kwAr": "طريق قايين", "noteAr": ""}, {"kw": "ran", "raw": "Num. 22:1-24:25, Num_31:16; Deu_23:4; Jos_24:9-11; Mic_6:5; 2Pe_2:15; Rev_2:14", "note": "", "refs": [{"l": "Num 22:1-24:25", "n": "", "vs": [[1, "وارتحل الإسرائيليون ونزلوا في سهول موآب، شرقي الأردن مقابل أريحا."], [2, "وإذ بلغ بالاق بن صفور ملك موآب جميع ما أنزله الإسرائيليون بالأموريين،"], [3, "اعتراه الفزع لكثرة عددهم، وملأ الخوف قلب شعبه من الإسرائيليين."], [4, "فقال بالاق لشيوخ مديان: «إن هذا الجمهور قادر على لحس كل ما حولنا كما يلحس الثور عشب الحقل»."], [5, "ثم بعث برسل يستدعي بلعام بن بعور، المقيم في موطنه في فتور، الواقعة على نهر الفرات قائلا: «ها قد خرج شعب من مصر يغشي وجه الأرض بكثرته، وهو منتشر أمامي."], [6, "فتعال الآن والعن لي هذا الشعب لأنه أعظم مني، لعلي أتمكن من دحره وطرده من الأرض، لأني عرفت أن من تباركه يكون مباركا ومن تلعنه يكون ملعونا»."], [7, "فمضى شيوخ موآب وشيوخ مديان حاملين معهم حلوان العرافة، وأقبلوا على بلعام وأبلغوه كلام بالاق."], [8, "فقال لهم: «بيتوا هنا الليلة، وغدا أرد عليكم جوابا كما يعلن لي الرب». فمكث رؤساء موآب عند بلعام."], [9, "فتجلى الله لبلعام وسأله: «من هم هؤلاء الرجال الذين عندك؟»"], [10, "فأجاب: «لقد أرسل بالاق بن صفور ملك موآب إلي قائلا:"], [11, "ها قد خرج شعب من مصر يغشي وجه الأرض. فتعال الآن والعنه لي، لعلي أقدر على محاربته وطرده»."], [12, "فقال الله لبلعام: «لا تمض معهم ولا تلعن الشعب لأنه مبارك»."], [13, "فنهض بلعام في الصباح وقال لرؤساء بالاق: «انطلقوا إلى دياركم، لأن الرب أبى أن يأذن لي بالذهاب معكم»."], [14, "فانطلق رؤساء موآب وأبلغوا بالاق أن بلعام رفض أن يحضر معهم."], [15, "فعاد بالاق وبعث أيضا عددا من الرؤساء أكبر، وعظماء أكثر من الرؤساء الأولين."], [16, "فقدموا على بلعام وقالوا: «هذا ما يقوله لك بالاق بن صفور:"], [17, "لا تتقاعس عن المجيء إلي، لأنني سأبالغ في إكرامك، وكل ما تطلبه أفعله، فتعال الآن والعن هذا الشعب»."], [18, "فأجاب بلعام رسل بالاق: «لا يمكنني أن أعصى أمر الرب إلهي في أي عمل صغير أو كبير، ولو أغدق علي بالاق ملء قصره فضة وذهبا."], [19, "فالآن، اقضوا هنا ليلتكم لأعلم بماذا يعود الرب فيوصيني به»."], [20, "فتراءى الله لبلعام ليلا وقال له: «إن جاء الرجال يستدعونك فقم وامض معهم، إنما لا تنطق إلا بما آمرك به فقط»."], [21, "فنهض بلعام صباحا وأسرج أتانه، وانطلق مع رؤساء موآب."], [22, "فاحتدم غضب الله لأنه مضى معهم، فاعترضه ملاك الرب في الطريق ليقاومه وهو راكب على أتانه وغلاماه معه."], [23, "فأبصرت الأتان ملاك الرب منتصبا في الطريق، وقد استل سيفه بيده، فحادت عن الطريق ومشت في الحقل. فضربها بلعام ليردها إلى الطريق."], [24, "ثم وقف ملاك الرب في ممر للكروم يقوم على جانبيه حائطان."], [25, "فلما شاهدت الأتان ملاك الرب زحمت جانب الحائط وضغطت رجل بلعام عليه، فضربها أيضا."], [26, "ثم اجتاز به ملاك الرب ووقف في موضع ضيق، لا سبيل فيه للتحول يمنة أو يسرة."], [27, "فلما رأت الأتان ملاك الرب ربضت تحت بلعام. فثار غضب بلعام وضرب الأتان بالقضيب."], [28, "عندئذ أنطق الرب الأتان، فقالت لبلعام: «ماذا جنيت حتى ضربتني الآن ثلاث دفعات؟»"], [29, "فقال بلعام: «لأنك سخرت مني. لو كان في يدي سيف لكنت قد قتلتك»."], [30, "فأجابته الأتان: «ألست أنا أتانك التي ركبت عليها دائما إلى هذا اليوم؟ وهل عودتك أن أصنع بك هكذا؟» فقال: «لا»."], [31, "عندئذ كشف الرب عن عيني بلعام، فشاهد ملاك الرب منتصبا في الطريق وسيفه مسلول في يده، فخر على وجهه ساجدا."], [32, "فقال له ملاك الرب: «لماذا ضربت الآن أتانك ثلاث مرات؟ فها أنا قد جئت لأعترضك، لأن طريقك ملتوية في نظري،"], [33, "فشاهدتني الأتان فحادت من أمامي ثلاث مرات. ولو لم تفعل لكنت قد قتلتك واستحييتها»."], [34, "فقال بلعام لملاك الرب: «لقد أخطأت، ولم أعلم أنك واقف لاعتراضي في الطريق. والآن إن ساء في عينيك فإني أرجع»."], [35, "فقال ملاك الرب لبلعام: «امض مع الرجال، ولكن عليك أن تنطق بما آمرك به فقط». فانطلق بلعام مع رؤساء بالاق."], [36, "فلما بلغ بالاق أن بلعام قد قدم أسرع لاستقباله إلى مدينة موآب الواقعة على حدود أرنون القصية."], [37, "فقال بالاق لبلعام: «ألم أبعث إليك أستدعيك؟ فلماذا لم تقدم علي؟ أحقا أعجز عن إكرامك؟»"], [38, "فأجاب بلعام: «ها أنا جئت إليك. أتظن أن في وسعي أن أتكلم الآن بما أريد؟ علي أن أنطق فقط بما يأمرني به الرب»."], [39, "فمضى بلعام مع بالاق حتى أقبلا إلى قرية حصوت."], [40, "فذبح بالاق بقرا وغنما وأرسلها إلى بلعام ومن معه من الرؤساء."], [41, "وفي الصباح التالي أخذ بالاق بلعام إلى مرتفعات بعل، فرأى من هناك بني إسرائيل كلهم."], [1, "فقال بلعام لبالاق: «ابن لي هنا سبعة مذابح، وأعد لي هنا سبعة ثيران وسبعة كباش»."], [2, "ففعل بالاق كما طلب بلعام. وقرب بالاق وبلعام ثورا وكبشا على كل مذبح."], [3, "ثم قال بلعام لبالاق: «قف هنا عند محرقاتك فأمضي أنا، لعل الرب يأتي للقائي، ومهما يعلن لي أبلغك به». ثم ارتقى بلعام رابية."], [4, "فوافى الله بلعام. فقال بلعام: «قد أعددت سبعة مذابح وقربت ثورا وكبشا على كل مذبح»."], [5, "فحمل الرب بلعام رسالة وقال: «ارجع إلى بالاق وبلغه إياها»."], [6, "فعاد إليه، وإذا به مازال واقفا عند محرقاته، ومعه جميع رؤساء موآب،"], [7, "فنطق بنبوءته قائلا: «أتى بي بالاق ملك موآب من بلاد أرام من الجبال الشرقية، وقال: تعال العن لي يعقوب، واشتم لي إسرائيل."], [8, "كيف ألعن من لم يلعنه الله؟ وكيف أشتم من لم يشتمه الرب؟"], [9, "ها أنا أراهم من قمم الصخور، ومن الآكام أبصرهم. هوذا شعب يسكن وحده. ولا يحسبون أنفسهم أمة من الأمم."], [10, "من يقدر أن يحصي تراب يعقوب أو يعد ربع إسرائيل؟ لتمت نفسي موت الأبرار، ولتكن آخرتي كآخرتهم»."], [11, "فقال بالاق لبلعام: «ماذا فعلت بي؟ لقد استدعيتك لتشتم أعدائي، وها أنت تباركهم»"], [12, "فأجابه: «إنني أحرص أن لا أتكلم إلا بما يضعه الرب على فمي»."], [13, "فقال له بالاق: «تعال معي إلى موضع آخر فلا ترى منه إلا طرف مخيم الشعب فقط، والعنه لي من هناك»."], [14, "فأخذه إلى حقل صوفيم المشرف على رأس الفسجة وهناك شيد سبعة مذابح، وقرب بلعام ثورا وكبشا على كل مذبح."], [15, "وقال لبالاق: «انتظرني هناك عند محرقاتك وأنا أمضي إلى هناك»."], [16, "فوافى الرب بلعام ولقنه رسالة وقال له: «ارجع إلى بالاق وبلغه إياها»."], [17, "فأقبل على بالاق، وإذا به منتظر عند محرقاته ومعه رؤساء موآب. فسأله بالاق: «ماذا تكلم به الرب؟»"], [18, "فضرب مثله قائلا: «انهض يابالاق واصغ، استمع إلي ياابن صفور"], [19, "ليس الله إنسانا فيكذب. ولا هو ابن آدم فيندم. هل يقول ولا يفعل أو يعد ولا يفي؟"], [20, "إني أمرت أن أبارك، وهو قد بارك ولا طاقة لي على رده."], [21, "لم يشهد إثما في يعقوب، ولم ير مشقة في إسرائيل. الرب إلههم معهم، وهتاف للملك فيهم."], [22, "الله أخرجهم من مصر، وقوتهم مثل قوة الثور الوحشي."], [23, "فلا عيافة تضر يعقوب، ولا عرافة تؤثر في إسرائيل. منذ الآن يقال عن يعقوب وعن إسرائيل: «انظر ماذا فعل الله!»"], [24, "هوذا شعب يتحفز كلبوة وينهض كأسد. لا ينام حتى يلتهم فريسة ويلغ في دم قتلى»."], [25, "فقال بالاق لبلعام: «إذن لا تلعنه ولا تباركه!»"], [26, "فأجاب بلعام: «ألم أخبرك أنني لن أنطق إلا بما يأمرني به الرب؟»"], [27, "فقال بالاق: «دعني آخذك إلى موضع آخر، فعسى أن يحسن في عيني الله أن تلعن لي الشعب من هناك»."], [28, "فأخذ بالاق بلعام إلى قمة جبل فغور المشرف على امتداد الصحراء،"], [29, "فقال بلعام لبالاق: «ابن لي هنا سبعة مذابح. وجهز لي هنا سبعة ثيران وسبعة كباش»."], [30, "فلبى بالاق طلب بلعام، وقرب ثورا وكبشا على كل مذبح."], [1, "ولما رأى بلعام أن الرب يسر بمباركة إسرائيل لم يمض كالمرتين السابقتين لملاقاة الرب، لكنه توجه بنظره نحو الصحراء،"], [2, "وهناك شاهد بني إسرائيل مخيمين حسب أسباطهم، فحل عليه روح الله،"], [3, "وتنبأ قائلا: «كلام بلعام بن بعور، كلام الرجل المفتوح العينين."], [4, "كلام من يسمع أقوال الله والذي يشاهد رؤيا القدير. الذي ينطرح فتنفتح عيناه."], [5, "ما أجمل خيامك يايعقوب، وما أبهى مساكنك ياإسرائيل!"], [6, "هي مثل أودية ممتدة، وكجنات على مجرى نهر، وكشجرات صبار غرسها الرب، ومثل أشجار الأرز النامية بجوار المياه."], [7, "تجري مياه من مساقيه، ولزرعه يتوافر ماء غزير. يكون ملكه أعظم شأنا من أجاج وتتسامى مملكته."], [8, "الله أخرجه من مصر، وقوته مثل الثور الوحشي. يفترس خصومه من الأمم، ويقضم عظامهم ويثخنهم بسهامه."], [9, "يجثم كأسد، ويربض كلبوة. فمن يجرؤ على إثارته؟ من يباركك يكون مباركا، ومن يلعنك يكون ملعونا»."], [10, "فاستشاط بالاق غضبا على بلعام، وضرب كفا على كف قائلا له: «دعوتك لتشتم أعدائي، وها أنت قد باركتهم ثلاث مرات!"], [11, "والآن اغرب عن وجهي وامض إلى بيتك، فقد كان في عزمي إكرامك ولكن الرب شاء أن لا تحظى به»."], [12, "فأجابه بلعام: «ألم أقل لرسلك الذين بعثتهم إلي"], [13, "إنه ولو أغدق علي بالاق ملء قصره ذهبا وفضة فلن أعصي أمر الرب، فأصنع خيرا أو شرا من نفسي؟ فإن ما يعلنه لي الرب فإياه أبلغ."], [14, "والآن أعود إلى شعبي، ولكن دعني أنبئك بما سينزله هذا الشعب بقومك في آخر الأيام»."], [15, "ثم تنبأ قائلا: «كلام بلعام بن بعور، كلام الرجل المفتوح العينين."], [16, "كلام من يسمع أقوال الله، ويتلقى المعرفة من العلي، الذي يشاهد رؤيا القدير، الذي ينطرح فتنفتح عيناه."], [17, "أراه ولكن ليس حاضرا، وأبصره ولكن ليس قريبا. يخرج نجم من يعقوب، ويظهر ملك من إسرائيل فيحطم طرفي موآب، ويهلك كل رجال الحرب."], [18, "ويرث أرض أدوم، ويتملك ديار سعير. أما إسرائيل فيزداد قوة."], [19, "ويبرز حاكم من يعقوب فيدمر ما تبقى من مدن (الأعداء)»."], [20, "ثم تطلع بلعام نحو مساكن أهل عماليق فتنبأ: «كان عماليق أول الشعوب، أما عاقبته فإلى الهلاك»."], [21, "ثم التفت نحو القينيين فأنبأ: «ليكن مسكنك منيعا، وعشك موضوعا في صخرة."], [22, "وإنما ستدمرون عندما يطردكم الأشوريون»."], [23, "ثم تنبأ قائلا: «من له طاقة على العيش حين يجري الرب ذلك؟"], [24, "تقبل سفن من كتيم، وتخضع أشور وتذل عابر، فهما أيضا يهلكان»."], [25, "ثم رجع بلعام إلى دياره، وأما بالاق فمضى في سبيله."]]}, {"l": "Num 31:16", "n": "", "vs": [[16, "إنهن باتباعهن نصيحة بلعام أغوين بني إسرائيل لعبادة فغور، وكن سبب خيانة للرب، فتفشى الوبأ في جماعة الرب."]]}, {"l": "Deu 23:4", "n": "", "vs": [[4, "لأنهم لم يستقبلوكم بالخبز والماء في الطريق عند خروجكم من مصر، ولأنهم استأجروا بلعام بن بعور من فتور أرام النهرين ليلعنكم"]]}, {"l": "Jos 24:9-11", "n": "", "vs": [[9, "وهب بالاق بن صفور ملك موآب لمحاربتكم، واستدعى إليه بلعام بن بعور لكي يلعنكم."], [10, "فلم أرد أن أستجيب لبلعام، فبارككم بركة بعد بركة، وأنقذتكم من يده."], [11, "ثم اجتزتم نهر الأردن وحاصرتم أريحا، فتصدى لكم أصحابها الأموريون والفرزيون والكنعانيون والحثيون والجرجاشيون والحويون واليبوسيون، فأسلمتهم إليكم."]]}, {"l": "Mic 6:5", "n": "", "vs": [[5, "اذكر ياشعبي ما تآمر به عليك بالاق ملك موآب، وما أجابه به بلعام بن بعور. واذكر ما أحسنت به إليك في رحلتك من شطيم إلى الجلجال لكي تدرك عدل الرب."]]}, {"l": "2Pe 2:15", "n": "", "vs": [[15, "وإذ خرجوا عن الطريق المستقيم، ضلوا. فهم سائرون في طريق بلعام بن بعور، الذي أحب الحصول على المال أجرة لإثمه."]]}, {"l": "Rev 2:14", "n": "", "vs": [[14, "ولكني عاتب عليك قليلا لأنك تتسامح مع القوم الذين يتمسكون بتعليم بلعام عندما علم الملك بالاق أن يدمر بني إسرائيل بتوريطهم في ارتكاب الزنى والأكل من الذبائح المقدمة للأصنام،"]]}], "kwAr": "خطيئة بلعام", "noteAr": ""}, {"kw": "perished", "raw": "Num. 16:1-35, Num_26:9, Num_26:10, Korah", "note": "Num. 16:1-35, Num_26:9, Num_26:10, Korah", "refs": [{"l": "Num 16:1-35", "n": "", "vs": [[1, "وشرع قورح بن يصهار بن قهات بن لاوي، وداثان وأبيرام ابنا ألياب، وأون بن فالت من سبط رأوبين،"], [2, "يتآمرون على موسى، مع مئتين وخمسين من رؤساء جماعة بني إسرائيل، ذوي المكانة ممن تم تعيينهم في المجلس."], [3, "هؤلاء تألبوا على موسى وهرون وقالوا: «حسبكما! إن كل الجماعة بأسرها مقدسة، وفي وسطها الرب. فما بالكما تترفعان على جماعة الرب؟»"], [4, "فلما سمع موسى هذا، أكب على وجهه،"], [5, "ثم قال لقورح وسائر جماعته: «غدا يعلن الرب من هو له، ومن هو المقدس فيقربه منه."], [6, "ولكن ياقورح افعل هذا أنت وجماعتك: خذوا لكم مجامر،"], [7, "وضعوا فيها نارا وبخورا أمام الرب غدا. والرجل الذي يختاره الرب يكون هو المقدس، فحسبكم أيها اللاويون!»"], [8, "وأضاف موسى قائلا لقورح: «استمعوا يابني لاوي،"], [9, "ألم يكفكم أن إله إسرائيل قد أفرزكم من بين الشعب ليقربكم إليه لكي تخدموا مسكن الرب وتقفوا في حضرة الشعب كله لخدمته."], [10, "فقربك مع بقية إخوتك من بني لاوي، حتى صرتم تطمعون في الكهنوت."], [11, "إذن أنت وكل جماعتك قد تألبتم على الرب، لأنه من هو هرون حتى تتذمروا عليه؟»"], [12, "فأرسل موسى يستدعي داثان وأبيرام ابني أليآب، فردا: «لن نحضر!"], [13, "ألم يكفك أنك أخرجتنا من أرض تدر لبنا وعسلا لتهلكنا في الصحراء، ثم تترَأس علينا؟"], [14, "فأنت لم تقدنا إلى أرض تفيض خيرات، ولا أورثتنا حقولا وكروما. فمن تحاول أن تخدع؟ إننا لن نحضر!»"], [15, "فاحتدم غيظ موسى وقال للرب: «لا تقبل تقدمتهما، فأنا لم آخذ حتى حمارا واحدا منهما، ولم أسيء إلى أحد منهما»."], [16, "وقال موسى لقورح: «امثل أنت وجماعتك كلها أمام الرب غدا، وكذلك يحضر هرون أيضا."], [17, "وليأخذ كل منكم مجمرته وضعوا فيها بخورا، وليقدم كل واحد مجمرته، فتكون مئتين وخمسين مجمرة، وكذلك خذ أنت وهرون، كل واحد مجمرته»."], [18, "فجاء كل واحد بمجمرته ووضعوا فيها نارا وبخورا، ومثلوا عند مدخل خيمة الاجتماع مع موسى وهرون."], [19, "وحشد قورح عليهما كل الجماعة المتآمرة عند مدخل خيمة الاجتماع، فتراءى آنئذ مجد الرب للجماعة كلها."], [20, "وقال الرب لموسى وهرون:"], [21, "«افترزا من بين هذه الجماعة لأني سأفنيهم في لحظة»."], [22, "فانطرحا على وجهيهما وابتهلا قائلين: «اللهم، ياإله أرواح جميع البشر، أتسخط على الجماعة كلها من أجل خطيئة رجل واحد؟»"], [23, "فقال الرب لموسى:"], [24, "«اطلب من الشعب أن يبتعدوا من حوالي خيام قورح وداثان وأبيرام»."], [25, "فذهب موسى إلى داثان وأبيرام، وتبعه شيوخ إسرائيل،"], [26, "وقال للجماعة كلها: «ابتعدوا عن خيام هؤلاء القوم الأشرار، ولا تلمسوا شيئا مما لهم لئلا تهلكوا من جراء خطاياهم»."], [27, "فابتعدوا من حوالي خيام قورح وداثان وأبيرام، وخرج داثان وأبيرام، ووقفا أمام خيمتيهما مع زوجاتهما وأولادهما صغارا وكبارا."], [28, "فقال موسى: «بهذا تعرفون أن الرب قد أرسلني لأجري كل هذه الأعمال، وأنها ليست صادرة عن نفسي:"], [29, "إن مات هؤلاء موتا طبيعيا، أو ابتلوا بما يبتلى به الناس عادة، فلا يكون الرب قد أرسلني."], [30, "ولكن إن أجرى الرب بدعة، وانشقت الأرض وابتلعتهم مع كل مالهم، ودفنوا في باطن الأرض أحياء، عندئذ تدركون أن هؤلاء القوم قد ازدروا بالرب»."], [31, "وحالما انتهى من كلامه انشقت الأرض تحتهم،"], [32, "وفتحت فاها وابتلعتهم مع بيوتهم، كما ابتلعت رجال قورح مع كل ما يملكون."], [33, "فاختفوا هم وكل ما يملكون أحياء في باطن الأرض التي انطبقت عليهم، فبادوا من بين الجماعة."], [34, "وهرب الإسرائيليون الذين حولهم من صوت صرخاتهم قائلين: «لئلا تبتلعنا الأرض»."], [35, "واندلعت نار من عند الرب فالتهمت المئتين والخمسين رجلا الذين قربوا البخور."]]}, {"l": "Num 26:9", "n": "", "vs": [[9, "أما أبناء أليآب فهم: نموئيل وداثان وأبيرام. وكان داثان وأبيرام من المنتخبين في المجلس وهما اللذان خاصما موسى وهرون مع بقية جماعة قورح حين تمردوا على الرب."]]}, {"l": "Num 26:10", "n": "", "vs": [[10, "فانشقت الأرض آنئذ وابتلعتهما مع قورح، حين أحرقت النار القوم البالغ عددهم مئتين وخمسين رجلا، فصاروا عبرة."]]}], "kwAr": "تمرد قورح", "noteAr": "قورح."}], "arS": [["الويل", ["G3759"]], [" ", []], ["لهم", ["G846"]], ["! ", []], ["لأنهم", ["G3754"]], [" ", []], ["سلكوا", ["G4198"]], [" ", []], ["طريق", ["G3598"]], [" ", []], ["قايين", ["G2535"]], ["، ", []], ["واندفعوا", ["G1632"]], [" إلى ارتكاب ", []], ["خطيئة", ["G4106"]], [" ", []], ["بلعام", ["G903"]], [" ", []], ["طلبا للمال", ["G3408"]], ["، ", []], ["وتمردوا", ["G485"]], [" كما تمرد ", []], ["قورح", ["G2879"]], ["، ", []], ["فدمروا أنفسهم", ["G622"]], [".", []]]}, {"c": 1, "v": 12, "text": "إنهم يشتركون معكم في ولائم المحبة دون خجل، ولكنهم كصخور تعيقكم. لا هم لهم سوى تعليف أنفسهم! إنهم يشبهون غيوما بلا مطر تسوقها الرياح، وأشجارا خريفية بلا ثمر، يقتلعها أصحابها، فتكون قد ماتت مرتين.", "groups": [{"kw": "are spots", "raw": "2Pe_2:13, 2Pe_2:14", "note": "", "refs": [{"l": "2Pe 2:13", "n": "", "vs": [[13, "وبذلك ينالون أجرة إثمهم! إنهم يحسبون الانغماس في اللذات طول النهار بهجة عظيمة. فهم أوساخ وعيوب: يتلذذون بالنجاسة ويحاولون خداعكم، فيشتركون معكم في الولائم."]]}, {"l": "2Pe 2:14", "n": "", "vs": [[14, "عيونهم لا تنظر إلا نظرات الزنى، ولا تشبع من الخطيئة. وكم من نفوس ضعيفة تقع في فخاخهم! أما قلوبهم، فقد تدربت على الشهوة والطمع. إنهم حقا أبناء اللعنة!"]]}], "kwAr": "صخور تعيقكم", "noteAr": ""}, {"kw": "feasts", "raw": "1Co_11:21, 1Co_11:22", "note": "", "refs": [{"l": "1Co 11:21", "n": "", "vs": [[21, "لأن كل واحد يسبق غيره ليتناول عشاءه الخاص، فيظل الواحد جائعا، ويشرب الآخر حتى يسكر!"]]}, {"l": "1Co 11:22", "n": "", "vs": [[22, "أفليس عندكم بيوت تأكلون وتشربون فيها؟ أم إنكم تحتقرون كنيسة الله وتهينون الذين لا يملكون شيئا؟ فماذا أقول لكم؟ أأمدحكم؟ على هذا لست أمدحكم!"]]}], "kwAr": "ولائم المحبة", "noteAr": ""}, {"kw": "feeding", "raw": "Psa_78:29-31; Isa_56:10-12; Eze_34:8, Eze_34:18; Luk_12:19, Luk_12:20,Luk_12:45, Luk_16:19; Luk_21:34; Phi_3:19; 1Th_5:6, 1Th_5:7; Jam_5:5", "note": "", "refs": [{"l": "Psa 78:29-31", "n": "", "vs": [[29, "فأكلوا حتى شبعوا جدا، وأعطاهم مشتهاهم."], [30, "وقبل أن يفرغوا من الطعام الذي اشتهوه، وهو بعد في أفواههم،"], [31, "ثار عليهم غضب الله، فقتل أسمنهم وصرع نخبتهم."]]}, {"l": "Isa 56:10-12", "n": "", "vs": [[10, "فإن رقباءهم عمي، وكلهم جهال، وكلاب بكم عاجزون عن النباح، حالمون راقدون مولعون بالنوم."], [11, "هم كلاب نهمة لا تعرف الشبع، ورعاة أيضا مجردون من الفهم، كل مال إلى طريقه طمعا في الربح،"], [12, "قائلين: تعالوا نأتي بالخمر، ونشرب مسكرا حتى الثمالة، فالغد يكون مماثلا لهذا اليوم، بل أعظم منه."]]}, {"l": "Eze 34:8", "n": "", "vs": [[8, "حي أنا يقول السيد الرب، لأن غنمي باتت غنيمة وصارت قوتا لكل وحش البرية، إذ لم يكن هناك راع ولا سأل رعاتي عن غنمي، بل انهمكوا في رعاية أنفسهم وأهملوا غنمي،"]]}, {"l": "Eze 34:18", "n": "", "vs": [[18, "أتحسبون أنه أمر تافه أن ترعوا في المرعى الخصيب وتدوسوا بأرجلكم بقية المراعي؟ وأن تشربوا من المياه الصافية وتعكروا بقيتها بأقدامكم؟"]]}, {"l": "Luk 12:19", "n": "", "vs": [[19, "وأقول لنفسي: يانفس، عندك خيرات كثيرة مخزونة لسنين عديدة، فاستريحي وكلي واشربي واطر بي!"]]}, {"l": "Luk 12:20", "n": "", "vs": [[20, "ولكن الله قال له: ياغبي، هذه الليلة تطلب نفسك منك، فلمن يبقى ما أعددته؟"]]}, {"l": "Luk 12:45", "n": "", "vs": [[45, "ولكن إذا قال ذلك العبد في نفسه: سيدي سيتأخر في رجوعه؛ وأخذ يضرب الخادمين والخادمات ويأكل ويشرب ويسكر،"]]}, {"l": "Luk 16:19", "n": "", "vs": [[19, "كان هنالك إنسان غني، يلبس الأرجوان وناعم الثياب، ويقيم الولائم المترفة، متنعما كل يوم."]]}, {"l": "Luk 21:34", "n": "", "vs": [[34, "ولكن احذروا لأنفسكم لئلا تتثقل قلوبكم بالانغماس في اللذات وبالسكر وهموم الحياة، فيدهمكم ذلك اليوم فجأة؛"]]}, {"l": "Phi 3:19", "n": "", "vs": [[19, "الذين مصيرهم الهلاك، وإلههم بطونهم، ومفخرتهم في عيبتهم، وفكرهم منصرف إلى الأمور الأرضية."]]}, {"l": "1Th 5:6", "n": "", "vs": [[6, "إذن، لا ننم كما ينام الآخرون، بل لنظل ساهرين وصاحين،"]]}, {"l": "1Th 5:7", "n": "", "vs": [[7, "فإنه في الليل ينام الذين ينامون، وفي الليل يسكر الذين يسكرون"]]}, {"l": "Jam 5:5", "n": "", "vs": [[5, "أنتم تعيشون على الأرض عيشة رفاهية وانصراف إلى المباهج واللذات؛ وقد أصبحت قلوبكم سمينة كأنها جاهزة ليوم الذبح."]]}], "kwAr": "تعليف أنفسهم", "noteAr": ""}, {"kw": "clouds", "raw": "Pro_25:14; Hos_6:4; 2Pe_2:17", "note": "", "refs": [{"l": "Pro 25:14", "n": "", "vs": [[14, "المتفاخر بإغداق هدايا كاذبة هو كالسحاب والريح بلا مطر."]]}, {"l": "Hos 6:4", "n": "", "vs": [[4, "ماذا أصنع بك ياإسرائيل، وأي شيء أفعله بك يايهوذا؟ إن حبكم يتلاشى كسحابة الصبح ويتبخر كالندى."]]}, {"l": "2Pe 2:17", "n": "", "vs": [[17, "فليس هؤلاء إلا آبارا لا ماء فيها، وغيوما تسوقها الريح العاصفة. ويا له من مصير مرعب محجوز لهم في الظلام الأبدي القاتم!"]]}], "kwAr": "غيوما بلا مطر", "noteAr": ""}, {"kw": "carried", "raw": "Eph_4:14", "note": "", "refs": [{"l": "Eph 4:14", "n": "", "vs": [[14, "وذلك حتى لا نكون فيما بعد أطفالا تتقاذفنا وتحملنا كل ريح تعليم يقوم على خداع الناس والمكر بهم لجرهم إلى الضلال الملفق،"]]}], "kwAr": "تسوقها الرياح", "noteAr": ""}, {"kw": "trees", "raw": "Psa_1:3, Psa_37:2; Mat_13:6, Mat_21:19, Mat_21:20; Mar_4:6, Mar_11:21; Luk_8:6; Joh_15:4-6", "note": "", "refs": [{"l": "Psa 1:3", "n": "", "vs": [[3, "فيكون كشجرة مغروسة عند مجاري المياه، تعطي ثمرها في حينه، وورقها لا يذبل، وكل ما يصنعه يفلح
