 الأوساخ. وهم أشبه بنجوم تائهة في الفضاء، مصيرها الظلام الشديد إلى الأبد!", "groups": [{"kw": "Raging", "raw": "Psa_65:7, Psa_93:3, Psa_93:4; Isa_57:20; Jer_5:22, Jer_5:23", "note": "", "refs": [{"l": "Psa 65:7", "n": "", "vs": [[7, "المهديء اضطراب البحار، عجيج الأمواج، وضجيج الأمم."]]}, {"l": "Psa 93:3", "n": "", "vs": [[3, "يارب قد رفعت الأنهار صوتها. ترفع الأنهار صوت موجها الهادر."]]}, {"l": "Psa 93:4", "n": "", "vs": [[4, "الرب في العلاء أعظم من صوت المياه الغزيرة ومن أمواج البحر الهائلة."]]}, {"l": "Isa 57:20", "n": "", "vs": [[20, "أما الأشرار فهم كالبحر الهائج الذي لا يهدأ، تقذف مياهه القذر والطين"]]}, {"l": "Jer 5:22", "n": "", "vs": [[22, "ألا تخشونني؟» يقول الرب، ألا ترتعدون في حضرتي؟ قد جعلت الرمل حدا لمياه البحر، حاجزا أبديا لا يتخطاه. تتلاطم أمواجه ولكنها تعجز عن تعديه، وتهدر ولكنها لا تتجاوزه."]]}, {"l": "Jer 5:23", "n": "", "vs": [[23, "أما هذا الشعب فذو قلب متمرد عاص، ثاروا علي ومضوا،"]]}], "kwAr": "أمواج في البحر هائجة", "noteAr": ""}, {"kw": "foaming", "raw": "Phi_3:19; 2Ti_3:13", "note": "", "refs": [{"l": "Phi 3:19", "n": "", "vs": [[19, "الذين مصيرهم الهلاك، وإلههم بطونهم، ومفخرتهم في عيبتهم، وفكرهم منصرف إلى الأمور الأرضية."]]}, {"l": "2Ti 3:13", "n": "", "vs": [[13, "أما الناس الأشرار والدجالون المحتالون، فيتقدمون في الشر، مضللين الآخرين وهم أنفسهم مضللون!"]]}], "kwAr": "تقذف الأوساخ", "noteAr": ""}, {"kw": "wandering", "raw": "Rev_8:10,Rev_8:11", "note": "", "refs": [{"l": "Rev 8:10", "n": "", "vs": [[10, "ثم نفخ الملاك الثالث في بوقه، فهوى من السماء نجم عظيم كأنه شعلة من نار، وسقط على ثلث الأنهار وينابيع المياه."]]}, {"l": "Rev 8:11", "n": "", "vs": [[11, "واسم هذا النجم «العلقم». فصار ثلث المياه مرا كالعلقم، ومات كثيرون من الناس بسبب مرارة المياه."]]}], "kwAr": "نجوم تائهة", "noteAr": ""}, {"kw": "to whom", "raw": "2Pe_2:17; Rev_14:10,Rev_14:11, Rev_20:10, Rev_21:8", "note": "", "refs": [{"l": "2Pe 2:17", "n": "", "vs": [[17, "فليس هؤلاء إلا آبارا لا ماء فيها، وغيوما تسوقها الريح العاصفة. ويا له من مصير مرعب محجوز لهم في الظلام الأبدي القاتم!"]]}, {"l": "Rev 14:10", "n": "", "vs": [[10, "فلابد لهم، في حضرة الملائكة القديسين وفي حضرة الحمل، من أن يشربوا من خمر الغضب غير المخففة، المسكوبة في كأس غضب الله، فيكابدوا عذاب النار والكبريت المتقد،"]]}, {"l": "Rev 14:11", "n": "", "vs": [[11, "ويتصاعد دخان عذابهم إلى أبد الآبدين. لا راحة في النهار ولا في الليل للذين عبدوا الوحش وسجدوا لتمثاله وقبلوا علامة اسمه."]]}, {"l": "Rev 20:10", "n": "", "vs": [[10, "ثم يطرح إبليس الذي كان يضللهم، في بحيرة النار والكبريت، حيث الوحش والنبي الدجال. هناك سوف يعذبون نهارا وليلا، إلى أبد الآبدين."]]}, {"l": "Rev 21:8", "n": "", "vs": [[8, "أما الجبناء وغير المؤمنين، والفاسدون والقاتلون والزناة، والمتصلون بالشياطين وعبدة الأصنام وجميع الدجالين، فمصيرهم إلى البحيرة المتقدة بالنار والكبريت، الذي هو الموت الثاني»."]]}], "kwAr": "الظلام الشديد إلى الأبد", "noteAr": ""}], "arS": [["وبأعمالهم ", []], ["المخجلة", ["G152"]], [" ", []], ["يفضحون", ["G1890"]], [" ", []], ["أنفسهم", ["G1438"]], [" ", []], ["كأمواج", ["G2949"]], [" في ", []], ["البحر", ["G2281"]], [" ", []], ["هائجة", ["G66"]], [" تقذف الأوساخ. وهم أشبه ", []], ["بنجوم", ["G792"]], [" ", []], ["تائهة", ["G4107"]], [" في الفضاء، ", []], ["مصيرها", ["G3739", "G5083"]], [" ", []], ["الظلام", ["G4655"]], [" ", []], ["الشديد", ["G2217"]], [" ", []], ["إلى الأبد", ["G1519", "G165"]], ["!", []]]}, {"c": 1, "v": 14, "text": "عن هؤلاء وأمثالهم، تنبأ أخنوخ السابع بعد آدم، فقال: «انظروا إن الرب آت بصحبة عشرات الألوف من قديسيه،", "groups": [{"kw": "Enoch", "raw": "Gen_5:18, Gen_5:24; 1Ch_1:1-3; Heb_11:5, Heb_11:6", "note": "", "refs": [{"l": "Gen 5:18", "n": "", "vs": [[18, "وكان عمر يارد مئة واثنتين وستين سنة عندما أنجب أخنوخ."]]}, {"l": "Gen 5:24", "n": "", "vs": [[24, "وسار أخنوخ مع الله، ثم توارى من الوجود، لأن الله نقله إليه."]]}, {"l": "1Ch 1:1-3", "n": "", "vs": [[1, "هذا سجل بأسماء مواليد البشر حسب تعاقبهم: آدم، شيث، أنوش،"], [2, "قينان، مهللئيل، يارد،"], [3, "أخنوخ، متوشالح، لامك،"]]}, {"l": "Heb 11:5", "n": "", "vs": [[5, "وبالإيمان، انتقل أخنوخ إلى حضرة الله دون أن يموت. وقد اختفى من على هذه الأرض لأن الله أخذه إليه. وقبل حدوث ذلك، شهد له بأنه قد أرضى الله ."]]}, {"l": "Heb 11:6", "n": "", "vs": [[6, "فمن المستحيل إرضاء الله بدون إيمان. إذ إن من يتقرب إلى الله، لابد له أن يؤمن بأنه موجود، وبأنه يكافيء الذين يسعون إليه."]]}], "kwAr": "أخنوخ السابع بعد آدم", "noteAr": ""}, {"kw": "Behold", "raw": "Deu_33:2; Job_19:25-27; Psa_50:3-5; Dan_7:9, Dan_7:10; Zec_14:5; Mat_16:27; Mat_24:30,Mat_24:31, Mat_25:31; 1Th_3:13; 2Th_1:7, 2Th_1:8; Rev_1:7", "note": "", "refs": [{"l": "Deu 33:2", "n": "", "vs": [[2, "فقال: «أقبل الرب من سيناء، وأشرف عليهم من سعير، وتألق في جبل فاران؛ جاء محاطا بعشرات الألوف من الملائكة وعن يمينه يومض برق عليهم."]]}, {"l": "Job 19:25-27", "n": "", "vs": [[25, "أما أنا فإني موقن أن فادي حي، وأنه لابد في النهاية أن يقوم على الأرض."], [26, "وبعد أن يفنى جلدي، فإني بذاتي أعاين الله ."], [27, "الذي أشاهده لنفسي فتنظره عيناي وليس عينا آخر، قد فنيت كليتاي شوقا في داخلي."]]}, {"l": "Psa 50:3-5", "n": "", "vs": [[3, "يأتي إلهنا ولا يصمت، تحيط به النار الآكلة والعواصف الثائرة."], [4, "ينادي السماوات من العلى، والأرض أيضا من تحت لكي يدين شعبه، قائلا:"], [5, "«اجمعوا إلي أتقيائي الذين قطعوا معي عهدا على ذبيحة»."]]}, {"l": "Dan 7:9", "n": "", "vs": [[9, "وفيما كنت أنظر، نصبت عروش واعتلى الأزلي كرسيه وكانت ثيابه بيضاء كالثلج، وشعر رأسه كالصوف النقي، وعرشه لهيبا متوهجا وعجلاته نارا متقدة."]]}, {"l": "Dan 7:10", "n": "", "vs": [[10, "ومن أمامه يتدفق ويجري نهر من نار، وتخدمه ألوف ألوف الملائكة، ويمثل في حضرته عشرات الألوف. فانعقد مجلس القضاء وفتحت الأسفار."]]}, {"l": "Zec 14:5", "n": "", "vs": [[5, "ويهربون من خلال وادي جبالي الممتد إلى آصل. تهربون كما هربتم من الزلزلة في أيام حكم عزيا ملك يهوذا، ويأتي الرب إلهي في موكب من جميع قديسيه."]]}, {"l": "Mat 16:27", "n": "", "vs": [[27, "فإن ابن الإنسان سوف يعود في مجد أبيه مع ملائكته، فيجازي كل واحد حسب أعماله."]]}, {"l": "Mat 24:30", "n": "", "vs": [[30, "وعندئذ تظهر آية ابن الإنسان في السماء، فتنتحب قبائل الأرض كلها، ويرون ابن الإنسان آتيا على سحب السماء بقدرة ومجد عظيم."]]}, {"l": "Mat 24:31", "n": "", "vs": [[31, "ويرسل ملائكته بصوت بوق عظيم ليجمعوا مختاريه من الجهات الأربع، من أقاصي السماوات إلى أقاصيها."]]}, {"l": "Mat 25:31", "n": "", "vs": [[31, "وعندما يعود ابن الإنسان في مجده ومعه جميع ملائكته، فإنه يجلس على عرش مجده،"]]}, {"l": "1Th 3:13", "n": "", "vs": [[13, "حتى تتثبت قلوبكم بغير لوم في القداسة أمام إلهنا وأبينا عندما يظهر ربنا يسوع عائدا مع جميع قديسيه."]]}, {"l": "2Th 1:7", "n": "", "vs": [[7, "وأن يكافئكم، أنتم الذين تتضايقون، كما يكافئنا نحن، بالراحة لدى ظهور الرب يسوع علنا من السماء، ومعه ملائكة قدرته،"]]}, {"l": "2Th 1:8", "n": "", "vs": [[8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."]]}, {"l": "Rev 1:7", "n": "", "vs": [[7, "ها هو آت مع السحاب! ستراه عيون الجميع، حتى أولئك الذين طعنوه، وتنوح بسببه قبائل الأرض كلها! نعم، آمين!"]]}], "kwAr": "انظروا إن الرب آت", "noteAr": ""}], "arS": [["عن ", []], ["هؤلاء", ["G5125"]], [" وأمثالهم، ", []], ["تنبأ", ["G4395"]], [" ", []], ["أخنوخ", ["G1802"]], [" ", []], ["السابع", ["G1442"]], [" ", []], ["بعد", ["G575"]], [" ", []], ["آدم", ["G76"]], ["، ", []], ["فقال", ["G3004"]], [": «", []], ["انظروا", ["G2400"]], [" إن ", []], ["الرب", ["G2962"]], [" ", []], ["آت", ["G2064"]], [" ", []], ["بصحبة", ["G1722"]], [" ", []], ["عشرات الألوف", ["G3461"]], [" من ", []], ["قديسيه", ["G848", "G40"]], ["،", []]]}, {"c": 1, "v": 15, "text": "ليدين جميع الناس، ويوبخ جميع الأشرار الذين لا يهابون الله ، بسبب جميع أعمالهم الشريرة التي ارتكبوها وجميع أقوالهم القاسية التي أهانوه بها والتي لا تصدر إلا عن الخاطئين الأشرار غير الأتقياء!»", "groups": [{"kw": "execute", "raw": "Psa_9:7, Psa_9:8, Psa_37:6, Psa_50:1-6, Psa_98:9, Psa_149:9; Ecc_11:9, Ecc_12:14; Joh_5:22, Joh_5:23, Joh_5:27; Act_17:31; Rom_2:16, Rom_14:10; 1Co_4:5, 1Co_5:13; Rev_22:12-15, Rev_22:20", "note": "", "refs": [{"l": "Psa 9:7", "n": "", "vs": [[7, "أما الرب فإلى الأبد يملك. ثبت عرشه للقضاء."]]}, {"l": "Psa 9:8", "n": "", "vs": [[8, "يدين العالم بالعدل ويقضي بين الشعوب بالإنصاف."]]}, {"l": "Psa 37:6", "n": "", "vs": [[6, "يظهر براءتك كالنور، وحقك ظاهرا كشمس الظهيرة."]]}, {"l": "Psa 50:1-6", "n": "", "vs": [[1, "الرب الإله القدير تكلم، ودعا الأرض للمحاكمة من مشرق الشمس إلى مغربها."], [2, "من صهيون الكاملة الجمال أشرق مجد الله."], [3, "يأتي إلهنا ولا يصمت، تحيط به النار الآكلة والعواصف الثائرة."], [4, "ينادي السماوات من العلى، والأرض أيضا من تحت لكي يدين شعبه، قائلا:"], [5, "«اجمعوا إلي أتقيائي الذين قطعوا معي عهدا على ذبيحة»."], [6, "فتذيع السماوات عدله لأن الله هو الديان."]]}, {"l": "Psa 98:9", "n": "", "vs": [[9, "أمام الرب لأنه جاء ليدين الأرض بالعدل والشعوب بالإنصاف."]]}, {"l": "Psa 149:9", "n": "", "vs": [[9, "ليتم فيهم حكم الله المكتوب، فيكون هذا تكريما لجميع قديسيه. هللويا."]]}, {"l": "Ecc 11:9", "n": "", "vs": [[9, "افرح أيها الشاب في حداثتك، وليمتعك قلبك في أيام شبابك، واتبع أهواء قلبك، وكل ما تشهده عيناك. ولكن اعلم أنه بسبب هذه الأمور كلها يأتي الله بك إلى كرسي القضاء."]]}, {"l": "Ecc 12:14", "n": "", "vs": [[14, "لأن الله سيدين كل عمل مهما كان خفيا، سواء كان خيرا أم شرا."]]}, {"l": "Joh 5:22", "n": "", "vs": [[22, "والآب لا يحاكم أحدا، بل أعطى الابن سلطة القضاء كلها،"]]}, {"l": "Joh 5:23", "n": "", "vs": [[23, "ليكرم الجميع الابن كما يكرمون الآب. ومن لا يكرم الابن لا يكرم الآب الذي أرسله."]]}, {"l": "Joh 5:27", "n": "", "vs": [[27, "وأعطاه سلطة أن يدين، لأنه ابن الإنسان."]]}, {"l": "Act 17:31", "n": "", "vs": [[31, "لأنه حدد يوما يدين فيه العالم بالعدل على يد رجل اختاره لذلك. وقد قدم للجميع برهانا، إذ أقامه من بين الأموات»."]]}, {"l": "Rom 2:16", "n": "", "vs": [[16, "(وتكون الدينونة) يوم يدين الله خفايا الناس، وفقا لإنجيلي، على يد يسوع المسيح."]]}, {"l": "Rom 14:10", "n": "", "vs": [[10, "ولكن، لماذا أنت تدين أخاك؟ وأنت أيضا، لماذا تحتقر أخاك؟ فإننا جميعا سوف نقف أمام عرش الله لنحاسب."]]}, {"l": "1Co 4:5", "n": "", "vs": [[5, "إذن، لا تحكموا في شيء قبل الأوان، ريثما يرجع الرب الذي سيسلط النور على الأشياء التي يحجبها الظلام الآن، ويكشف نيات القلوب، عندئذ ينال كل واحد حقه من المدح من عند الله!"]]}, {"l": "1Co 5:13", "n": "", "vs": [[13, "أما الذين في الخارج، فالله يدينهم. فاعزلوا من هو شرير من بينكم."]]}, {"l": "Rev 22:12-15", "n": "", "vs": [[12, "إني آت سريعا، ومعي المكافأة لأجازي كل واحد بحسب عمله."], [13, "أنا الألف والياء، الأول والآخر، البداية والنهاية."], [14, "طوبى للذين يغسلون ثيابهم، فلهم السلطة على شجرة الحياة، والحق في دخول المدينة من الأبواب!"], [15, "أما في خارج المدينة، فهنالك الكلاب والمتصلون بالشياطين، والزناة والقتلة، وعبدة الأصنام والدجالون ومحبو التدجيل!"]]}, {"l": "Rev 22:20", "n": "", "vs": [[20, "والذي يشهد بهذه الأمور يقول: «نعم! أنا آت سريعا»."]]}], "kwAr": "ليدين جميع الناس", "noteAr": ""}, {"kw": "convince", "raw": "Rom_2:5, Rom_3:19, Rom_3:20", "note": "", "refs": [{"l": "Rom 2:5", "n": "", "vs": [[5, "ولكنك بسبب قساوتك وقلبك غير التائب، تخزن لنفسك غضبا ليوم الغضب، يوم تعلن دينونة الله العادلة."]]}, {"l": "Rom 3:19", "n": "", "vs": [[19, "ونحن نعلم أن كل ما تقوله الشريعة إنما تخاطب به الذين هم تحت الشريعة، لكي يسد كل فم ويقع العالم كله تحت دينونة من الله."]]}, {"l": "Rom 3:20", "n": "", "vs": [[20, "فإن أحدا من البشر لا يتبرر أمامه بالأعمال المطلوبة في الشريعة. إذ إن الشريعة هي لإظهار الخطيئة."]]}], "kwAr": "ويوبخ جميع الأشرار", "noteAr": ""}, {"kw": "and of all", "raw": "Jud_1:16; Exo_16:8; 1Sa_2:3; Psa_31:18, Psa_73:9, Psa_94:4; Isa_37:22-36; Dan_7:20; Dan_11:36; Mal_3:13-15; Mat_12:31-37; Rev_13:5, Rev_13:6, Rev_13:11", "note": "", "refs": [{"l": "Jud 1:16", "n": "", "vs": [[16, "وهؤلاء المعلمون يتذمرون ويشكون دائما وفيما هم يندفعون وراء شهواتهم، يطلقون ألسنتهم متحدثين بأمور طنانة، ويمدحون من يعجبهم طلبا للمنفعة!"]]}, {"l": "Exo 16:8", "n": "", "vs": [[8, "وقال موسى أيضا: «إنكم ستعلمون أنه هو الرب، عندما يعطيكم لحما في المساء لتأكلوا، وخبزا في الصباح لتشبعوا، لأنه سمع تذمركم عليه. فماذا نحن؟ إنكم تتذمرون على الله»."]]}, {"l": "1Sa 2:3", "n": "", "vs": [[3, "كفوا عن الكبرياء، وكموا أفواهكم عن الغرور لأن الرب إله عليم وبه توزن الأعمال."]]}, {"l": "Psa 31:18", "n": "", "vs": [[18, "لتخرس الشفاه الكاذبة، الناطقة بكبرياء وازدراء ووقاحة على الصديق."]]}, {"l": "Psa 73:9", "n": "", "vs": [[9, "جدفوا على السماء بأفواههم، ولوثوا الأرض بخبث ألسنتهم."]]}, {"l": "Psa 94:4", "n": "", "vs": [[4, "إلى متى يهذر عمال الإثم ويتواقحون ويتباهون بأنفسهم؟"]]}, {"l": "Isa 37:22-36", "n": "", "vs": [[22, "وهذا هو رد الرب عليه: ها العذراء ابنة صهيون قد احتقرتك واستهزأت بك، وهزت ابنة أورشليم رأسها سخرية منك."], [23, "من عيرت وجدفت؟ وعلى من رفعت صوتك وشمخت بعينيك زهوا؟ أعلى قدوس إسرائيل؟"], [24, "لقد عيرت السيد على لسان رسلك، وقلت: بكثرة مركباتي قد صعدت إلى أعالي الجبال، وبلغت أقاصي لبنان قاطعا أطول أرزه وخيار سروه واخترقت أبعد ربوعه وأفضل غاباته."], [25, "قد حفرت آبارا وشربت مياها، وبباطن قدمي جففت جميع خلجان مصر."], [26, "ألم تسمع؟ منذ زمن طويل قد قدرت ذلك. منذ الأيام القديمة قررته وها أنا الآن أحققه، إذ أقمتك لتدمير مدن محصنة فتحولها إلى روابي خربة."], [27, "خارت قوى أهلها فأصبحوا مرتاعين خجلين، صاروا كعشب الحقل، كالنبات الأخضر وكحشيش السطوح الذاوي قبل نموه."], [28, "ولكني مطلع على حركاتك وسكناتك وهيجانك علي."], [29, "ولأن ثورتك علي وعجرفتك قد بلغتا مسامعي، فإني سأشكمك بخزامتي في أنفك، وأضع لجامي في فمك، وأعيدك في نفس الطريق الذي أقبلت منه."], [30, "وهذه علامة لك ياحزقيا: في هذه السنة تأكلون مما ينبت من نفسه، وفي السنة التالية تأكلون مما ينبت عنه وأما في السنة الثالثة فتزرعون فيها وتحصدون وتغرسون كروما وتجنون ثمارها."], [31, "ويعود الناجون الباقون من بيت يهوذا فتتأصل جذورهم في الأرض ويزدهرون ويتكاثرون."], [32, "لأن من أورشليم تخرج بقية ومن جبل صهيون يأتي الناجون فغيرة الرب القدير تصنع هذا."], [33, "لذلك، فهذا ما يقوله الرب عن ملك أشور: «لن يدخل هذه المدينة ولن يطلق عليها سهما أو يتقدم نحوها بترس ولا يقيم عليها مقلاعا."], [34, "بل يرجع في الطريق الذي جاء منه ولن يدخل هذه المدينة، يقول الرب."], [35, "لأنني أدافع عنها وأنقذها من أجل نفسي وإكراما لداود عبدي»."], [36, "وحدث في تلك الليلة أن ملاك الرب قتل مئة وخمسة وثمانين ألفا من جيش الأشوريين، وما إن طلع الصباح حتى كانت جثث القتلى تملأ المكان"]]}, {"l": "Dan 7:20", "n": "", "vs": [[20, "وعن القرون العشرة النامية في رأسه، وعن القرن الآخر الصغير الذي نبت، فاقتلعت أمامه ثلاثة قرون. هذا القرن ذو العيون الناطق بالعظائم ومنظره أشد هولا من رفاقه."]]}, {"l": "Dan 11:36", "n": "", "vs": [[36, "ويصنع الملك ما يطيب له، ويتعظم على كل إله، ويجدف بالعظائم على إله الآلهة، ويفلح، إلى أن يحين اكتمال الغضب إذ لابد أن يتم ما قضى الله به."]]}, {"l": "Mal 3:13-15", "n": "", "vs": [[13, "لقد قسوتم في كلامكم علي يقول الرب، ومع ذلك تقولون: بماذا تكلمنا ضدك؟"], [14, "لقد قلتم: من العبث عبادة الله، وأي جدوى من حفظنا شعائره، والنواح أمام حضرة الرب القدير؟"], [15, "وها نحن الآن نغبط المستكبرين، ونرى فاعلي الشر يزدهرون، بل إنهم تحدوا الله ونجوا."]]}, {"l": "Mat 12:31-37", "n": "", "vs": [[31, "لذلك أقول لكم: إن كل خطيئة وتجديف يغفر للناس."], [32, "وأما التجديف على الروح (القدس)، فلن يغفر. ومن قال كلمة ضد ابن الإنسان، يغفر له. وأما من قال كلمة ضد الروح القدس، فلن يغفر له، لا في هذا الزمان، ولا في الزمان الآتي."], [33, "لتكن الشجرة جيدة، فتنتج ثمرا جيدا؛ ولتكن الشجرة رديئة، فتنتج ثمرا رديئا! فمن الثمر، تعرف الشجرة."], [34, "ياأولاد الأفاعي، كيف تقدرون، وأنتم أشرار، أن تتكلموا كلاما صالحا؟ لأن الفم يتكلم بما يفيض به القلب."], [35, "فالإنسان الصالح، من الكنز الصالح في قلبه، يصدر ما هو صالح. والإنسان الشرير، يصدر ما هو شرير."], [36, "على أني أقول لكم: إن كل كلمة باطلة يتكلم بها الناس، سوف يؤدون عنها الحساب في يوم الدينونة."], [37, "فإنك بكلامك تبرر، وبكلامك تدان ! »"]]}, {"l": "Rev 13:5", "n": "", "vs": [[5, "وأعطى التنين الوحش فما ينطق بكلام الكبرياء والتجديف، وأعطاه سلطة العمل مدة اثنين وأربعين شهرا."]]}, {"l": "Rev 13:6", "n": "", "vs": [[6, "فأخذ الوحش يشتم اسم الله، ويشتم بيته وسكان السماء."]]}, {"l": "Rev 13:11", "n": "", "vs": [[11, "ثم رأيت وحشا آخر خارجا من الأرض، له قرنان صغيران كقرني خروف، ولكن صوته كصوت تنين،"]]}], "kwAr": "أقوالهم القاسية", "noteAr": ""}], "arS": [["ليدين", ["G4160", "G2920"]], [" ", []], ["جميع", ["G3956"]], [" الناس، ", []], ["ويوبخ", ["G1827"]], [" ", []], ["جميع", ["G3956"]], [" ", []], ["الأشرار", ["G765"]], [" الذين لا يهابون الله ، ", []], ["بسبب", ["G4012"]], [" ", []], ["جميع", ["G3956"]], [" ", []], ["أعمالهم", ["G2041"]], [" ", []], ["الشريرة", ["G763"]], [" ", []], ["التي", ["G3739"]], [" ", []], ["ارتكبوها", ["G764"]], [" ", []], ["وجميع", ["G3956"]], [" ", []], ["أقوالهم القاسية", ["G4642"]], [" التي ", []], ["أهانوه", ["G2980", "G2596", "G846"]], [" بها والتي لا تصدر إلا عن ", []], ["الخاطئين", ["G268"]], [" ", []], ["الأشرار", ["G765"]], [" غير الأتقياء!»", []]]}, {"c": 1, "v": 16, "text": "وهؤلاء المعلمون يتذمرون ويشكون دائما وفيما هم يندفعون وراء شهواتهم، يطلقون ألسنتهم متحدثين بأمور طنانة، ويمدحون من يعجبهم طلبا للمنفعة!", "groups": [{"kw": "murmurers", "raw": "Num_14:36, Num_16:11; Deu_1:27; Psa_106:25; Isa_29:24; Luk_5:30, Luk_15:2, Luk_19:7; Joh_6:41, Joh_6:61; 1Co_10:10; Phi_2:14", "note": "", "refs": [{"l": "Num 14:36", "n": "", "vs": [[36, "أما الجواسيس الذين أرسلهم موسى لاستكشاف الأرض، فرجعوا فأثاروا عليه الشعب بما روجوه من أخبار سيئة عن الأرض،"]]}, {"l": "Num 16:11", "n": "", "vs": [[11, "إذن أنت وكل جماعتك قد تألبتم على الرب، لأنه من هو هرون حتى تتذمروا عليه؟»"]]}, {"l": "Deu 1:27", "n": "", "vs": [[27, "وتذمرتم في خيامكم قائلين: لأن الرب يكرهنا أخرجنا من أرض مصر ليوقعنا في أيدي الأموريين ويهلكنا."]]}, {"l": "Psa 106:25", "n": "", "vs": [[25, "بل تذمروا داخل خيامهم، غير منصتين لصوت الرب."]]}, {"l": "Isa 29:24", "n": "", "vs": [[24, "ويكتسب الضالون فهما ويتقبل المتذمرون التعليم."]]}, {"l": "Luk 5:30", "n": "", "vs": [[30, "فتذمر كتبة اليهود والفريسيون على تلاميذه، قائلين: «لماذا تأكلون وتشربون مع جباة ضرائب وخاطئين؟»"]]}, {"l": "Luk 15:2", "n": "", "vs": [[2, "فتذمر الفريسيون والكتبة قائلين: «هذا الإنسان يرحب بالخاطئين ويأكل معهم!»"]]}, {"l": "Luk 19:7", "n": "", "vs": [[7, "فلما رأى الجميع ذلك، تذمروا قائلين: «قد دخل ليبيت عند رجل خاطيء!»"]]}, {"l": "Joh 6:41", "n": "", "vs": [[41, "فأخذ اليهود يتذمرون على يسوع لأنه قال: «أنا الخبز الذي نزل من السماء»."]]}, {"l": "Joh 6:61", "n": "", "vs": [[61, "فعلم يسوع في نفسه أن تلاميذه يتذمرون، فسألهم: «أهذا يبعث الشكوك في نفوسكم؟"]]}, {"l": "1Co 10:10", "n": "", "vs": [[10, "ولا تتذمروا، كما تذمر بعضهم، فهلكوا على يد الملاك المهلك."]]}, {"l": "Phi 2:14", "n": "", "vs": [[14, "فافعلوا كل شيء دون تذمر أو جدال،"]]}], "kwAr": "يتذمرون ويشكون", "noteAr": ""}, {"kw": "walking", "raw": "Jud_1:18; Gal_5:16, Gal_5:24; 1Th_4:5; 2Ti_4:3; Jam_1:14, Jam_1:15; 1Pe_1:14, 1Pe_2:11; 1Pe_4:2; 2Pe_2:10, 2Pe_3:3", "note": "", "refs": [{"l": "Jud 1:18", "n": "", "vs": [[18, "فقد سبق أن نبهوكم إلى أنه، في نهاية الزمان، سيطلع مستهزئون يعيشون منغمسين في شهواتهم الفاسقة."]]}, {"l": "Gal 5:16", "n": "", "vs": [[16, "إنما أقول: اسلكوا في الروح. وعندئذ لا تتممون شهوة الجسد أبدا."]]}, {"l": "Gal 5:24", "n": "", "vs": [[24, "ولكن الذين صاروا خاصة للمسيح، قد صلبوا الجسد مع الأهواء والشهوات."]]}, {"l": "1Th 4:5", "n": "", "vs": [[5, "غير منساق للشهوة الجامحة كالوثنيين الذين لا يعرفون الله ،"]]}, {"l": "2Ti 4:3", "n": "", "vs": [[3, "فإنه سيأتي زمان لا يطيق الناس فيه التعليم الصحيح، بل تبعا لشهواتهم الخاصة يكدسون لأنفسهم معلمين (يقولون لهم كلاما) يداعب الآذان."]]}, {"l": "Jam 1:14", "n": "", "vs": [[14, "ولكن الإنسان يسقط في التجربة حين يندفع مخدوعا وراء شهوته."]]}, {"l": "Jam 1:15", "n": "", "vs": [[15, "فإذا ما حبلت الشهوة ولدت الخطيئة. ومتى نضجت الخطيئة، أنتجت الموت."]]}, {"l": "1Pe 1:14", "n": "", "vs": [[14, "وبما أنكم صرتم أولادا لله مطيعين له، فلا تعودوا إلى مجاراة الشهوات التي كانت تسيطر عليكم سابقا في أيام جهلكم."]]}, {"l": "1Pe 2:11", "n": "", "vs": [[11, "أيها الأحباء، ما أنتم إلا غرباء تزورون الأرض زيارة عابرة. لذلك أطلب إليكم أن تبتعدوا عن الشهوات الجسدية التي تصارع النفس."]]}, {"l": "1Pe 4:2", "n": "", "vs": [[2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."]]}, {"l": "2Pe 2:10", "n": "", "vs": [[10, "وما أشد العقاب، وبخاصة على الذين ينجرفون وراء الميول الجسدية، مستجيبين لشهوة النجاسة، ومحتقرين سيادة الله! ثم إنهم وقحون، معجبون بأنفسهم، لا يخافون أن يتكلموا بالشتم والإهانة على أصحاب الأمجاد."]]}, {"l": "2Pe 3:3", "n": "", "vs": [[3, "فاعلموا، قبل كل شيء أنه سيأتي في آخر الأيام أناس مستهزئون يسخرون بالحق، ويسلكون منجرفين وراء شهواتهم الخاصة."]]}], "kwAr": "يندفعون وراء شهواتهم", "noteAr": ""}, {"kw": "their mouth", "raw": "Jud_1:15; Job_17:4, Job_17:5; Psa_17:10, Psa_73:9-11; 2Pe_2:18", "note": "", "refs": [{"l": "Jud 1:15", "n": "", "vs": [[15, "ليدين جميع الناس، ويوبخ جميع الأشرار الذين لا يهابون الله ، بسبب جميع أعمالهم الشريرة التي ارتكبوها وجميع أقوالهم القاسية التي أهانوه بها والتي لا تصدر إلا عن الخاطئين الأشرار غير الأتقياء!»"]]}, {"l": "Job 17:4", "n": "", "vs": [[4, "فأنت حجبت الفطنة عن قلوبهم، لذلك لن تظفرهم،"]]}, {"l": "Job 17:5", "n": "", "vs": [[5, "ولتتلف عيون أبناء من يشي بأصحابه طمعا في أملاكهم."]]}, {"l": "Psa 17:10", "n": "", "vs": [[10, "عواطفهم متحجرة لا تشفق. أفواههم تنطق بالكبرياء."]]}, {"l": "Psa 73:9-11", "n": "", "vs": [[9, "جدفوا على السماء بأفواههم، ولوثوا الأرض بخبث ألسنتهم."], [10, "حتى شعب الله يرجعون إليهم، ويصدقون ما يقولونه لهم."], [11, "أما هم فيقولون: كيف يعلم الله، وهل يدري العلي بما يحدث؟"]]}, {"l": "2Pe 2:18", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."]]}], "kwAr": "أمور طنانة", "noteAr": ""}, {"kw": "having", "raw": "Lev_19:15; Job_32:21, Job_34:19; Psa_15:4; Pro_28:21; 1Ti_6:5; Jam_2:1-9; 2Pe_2:1-3", "note": "", "refs": [{"l": "Lev 19:15", "n": "", "vs": [[15, "لا تظلموا في القضاء، ولا تتحيزوا لمسكين ولا تحابوا عظيما. احكم لقريبك بالعدل."]]}, {"l": "Job 32:21", "n": "", "vs": [[21, "لن أحابي إنسانا أو أتملق أحدا."]]}, {"l": "Job 34:19", "n": "", "vs": [[19, "الذي لا يحابي الأمراء، ولا يؤثر الأغنياء على الفقراء، لأنهم جميعا عمل يديه."]]}, {"l": "Psa 15:4", "n": "", "vs": [[4, "يحتقر الأراذل ويكرم خائفي الرب. لا ينقض حلفه ولو فيه أذى له."]]}, {"l": "Pro 28:21", "n": "", "vs": [[21, "المحاباة نقيصة، ومن أجل كسرة خبز يرتكب الإنسان الإساءة."]]}, {"l": "1Ti 6:5", "n": "", "vs": [[5, "وشتى أنواع النزاع بين أناس فاسدي العقول مجردين من الحق، يعتبرون التقوى تجارة."]]}, {"l": "Jam 2:1-9", "n": "", "vs": [[1, "ياإخوتي، نظرا لإيمانكم بربنا يسوع المسيح، رب المجد، لا تعاملوا الناس بالانحياز والتمييز!"], [2, "لنفرض أن إنسانين دخلا مجمعكم، أحدهما غني يلبس ثيابا فاخرة ويزين أصابعه بخواتم من ذهب، والآخر فقير يلبس ثيابا رثة."], [3, "فإن رحبتم بالغني قائلين: «تفضل، اجلس هنا في الصدر!» ثم قلتم للفقير: «وأنت، قف هناك، أو اقعد على الأرض عند أقدامنا!»"], [4, "فإن ذلك يؤكد أنكم تميزون بين الناس بحسب طبقاتهم، جاعلين من أنفسكم قضاة ذوي أفكار سيئة!"], [5, "فياإخوتي الأحباء، أما اختار الله الفقراء في نظر الناس ليجعلهم أغنياء في الإيمان، ويعطيهم حق الإرث في الملكوت الذي وعد به محبيه؟"], [6, "ولكنكم أنتم عاملتم الفقير معاملة مهينة. ألا تعرفون أن الأغنياء هم الذين يتسلطون عليكم ويجرونكم إلى المحاكم،"], [7, "وهم الذين يستهزئون بالمسيح الذي تحملون اسمه الجميل؟"], [8, "ما أحسن عملكم حين تطبقون تلك القاعدة الملوكية الواردة في الكتاب: «تحب قريبك كما تحب نفسك!»"], [9, "ولكن عندما تعاملون الناس بالانحياز والتمييز، ترتكبون خطيئة وتحكم عليكم الشريعة باعتباركم مخالفين لها."]]}, {"l": "2Pe 2:1-3", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."], [2, "وكثيرون سيسيرون وراءهم في طرق الإباحية. وبسببهم توجه الإهانة إلى طريق الحق."], [3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}], "kwAr": "يمدحون من يعجبهم", "noteAr": ""}], "arS": [["وهؤلاء", ["G3778"]], [" المعلمون ", []], ["يتذمرون", ["G1113"]], [" ", []], ["ويشكون", ["G3202"]], [" دائما وفيما هم ", []], ["يندفعون", ["G4198"]], [" ", []], ["وراء", ["G2596"]], [" ", []], ["شهواتهم", ["G848", "G1939"]], ["، ", []], ["يطلقون ألسنتهم", ["G4750"]], [" ", []], ["متحدثين", ["G2980"]], [" ", []], ["بأمور طنانة", ["G5246"]], ["، ", []], ["ويمدحون من يعجبهم", ["G2296", "G4383"]], [" ", []], ["طلبا", ["G5484"]], [" ", []], ["للمنفعة", ["G5622"]], ["!", []]]}, {"c": 1, "v": 17, "text": "أما أنتم أيها الأحباء، فاذكروا دائما ما قاله رسل ربنا يسوع المسيح.", "groups": [{"kw": "remember", "raw": "Mal_4:4; Act_20:35; Eph_2:20, Eph_4:11; 2Pe_3:2; 1Jo_4:6", "note": "", "refs": [{"l": "Mal 4:4", "n": "", "vs": [[4, "اذكروا شريعة موسى عبدي وسائر فرائضي وأحكامي التي أعطيتها في جبل حوريب لجميع شعب إسرائيل."]]}, {"l": "Act 20:35", "n": "", "vs": [[35, "وقد أظهرت لكم بوضوح كيف يجب أن نبذل الجهد لنساعد المحتاجين، متذكرين كلمات الرب يسوع، إذ قال: الغبطة في العطاء أكثر مما في الأخذ!»"]]}, {"l": "Eph 2:20", "n": "", "vs": [[20, "وقد بنيتم على أساس الرسل والأنبياء، والمسيح يسوع نفسه هو حجر الزاوية الأساس،"]]}, {"l": "Eph 4:11", "n": "", "vs": [[11, "وهو قد وهب البعض أن يكونوا رسلا، والبعض أنبياء، والبعض مبشرين والبعض رعاة ومعلمين،"]]}, {"l": "2Pe 3:2", "n": "", "vs": [[2, "وغايتي أن تتذكروا الأقوال التي أعلنها الأنبيا ء القديسون قديما، وكذلك وصية الرب والمخلص، تلك الوصية التي نقلها إليكم الرسل."]]}, {"l": "1Jo 4:6", "n": "", "vs": [[6, "أما نحن، فإننا من الله، ولذلك يصغي إلينا فقط من يعرف الله . أما الذي ليس من الله، فلا يصغي إلينا. وبهذا، نميز بين روح الحق وروح الضلال."]]}], "kwAr": "اذكروا", "noteAr": ""}], "arS": [["أما", ["G1161"]], [" ", []], ["أنتم", ["G5210"]], [" أيها ", []], ["الأحباء", ["G27"]], ["، ", []], ["فاذكروا", ["G3415"]], [" دائما ما ", []], ["قاله", ["G4280", "G4487"]], [" ", []], ["رسل", ["G652"]], [" ", []], ["ربنا", ["G2257", "G2962"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 1, "v": 18, "text": "فقد سبق أن نبهوكم إلى أنه، في نهاية الزمان، سيطلع مستهزئون يعيشون منغمسين في شهواتهم الفاسقة.", "groups": [{"kw": "there", "raw": "Act_20:29; 1Ti_4:1, 1Ti_4:2; 2Ti_3:1-5, 2Ti_3:13, 2Ti_4:3; 2Pe_2:1, 2Pe_3:3", "note": "", "refs": [{"l": "Act 20:29", "n": "", "vs": [[29, "فإني أعلم أنه بعد رحيلي سيندس بينكم ذئاب خاطفة، لا تشفق على القطيع."]]}, {"l": "1Ti 4:1", "n": "", "vs": [[1, "إلا أن الروح يعلن صراحة أن قوما في الأزمنة الأخيرة سوف يرتدون عن الإيمان، منساقين وراء أرواح مضللة وتعاليم شيطانية،"]]}, {"l": "1Ti 4:2", "n": "", "vs": [[2, "في موجة رياء ينشرها معلمون دجالون لهم ضمائر كويت بالنار."]]}, {"l": "2Ti 3:1-5", "n": "", "vs": [[1, "واعلم هذا الأمر: أن أزمنة صعبة ستعم في الأيام الأخيرة؛"], [2, "إذ يكون الناس محبين لأنفسهم، محبين للمال، متكبرين، مباهين بأنفسهم، شتامين، غير مطيعين لوالديهم، ناكرين للجميل، دنسين،"], [3, "متحجري العواطف، غير صفوحين، نمامين، جامحي الأهواء، شرسين غير محبين للصلاح،"], [4, "خائنين، وقحين، مدعين، محبين للذات أكثر من محبتهم لله،"], [5, "لهم من التقوى مظهرها ولكنهم لقوتها منكرون، فعن هؤلاء الناس ابتعد!"]]}, {"l": "2Ti 3:13", "n": "", "vs": [[13, "أما الناس الأشرار والدجالون المحتالون، فيتقدمون في الشر، مضللين الآخرين وهم أنفسهم مضللون!"]]}, {"l": "2Ti 4:3", "n": "", "vs": [[3, "فإنه سيأتي زمان لا يطيق الناس فيه التعليم الصحيح، بل تبعا لشهواتهم الخاصة يكدسون لأنفسهم معلمين (يقولون لهم كلاما) يداعب الآذان."]]}, {"l": "2Pe 2:1", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."]]}, {"l": "2Pe 3:3", "n": "", "vs": [[3, "فاعلموا، قبل كل شيء أنه سيأتي في آخر الأيام أناس مستهزئون يسخرون بالحق، ويسلكون منجرفين وراء شهواتهم الخاصة."]]}], "kwAr": "سيطلع مستهزئون", "noteAr": ""}, {"kw": "who", "raw": "Jud_1:16; Psa_14:1, Psa_14:2", "note": "", "refs": [{"l": "Jud 1:16", "n": "", "vs": [[16, "وهؤلاء المعلمون يتذمرون ويشكون دائما وفيما هم يندفعون وراء شهواتهم، يطلقون ألسنتهم متحدثين بأمور طنانة، ويمدحون من يعجبهم طلبا للمنفعة!"]]}, {"l": "Psa 14:1", "n": "", "vs": [[1, "قال الجاهل في قلبه: لا يوجد إله! قد فسد البشر وارتكبوا الموبقات، وليس بينهم من يعمل الصلاح."]]}, {"l": "Psa 14:2", "n": "", "vs": [[2, "أشرف الرب على بني آدم ليرى هل هناك أي فاهم يطلب الله ؟"]]}], "kwAr": "منغمسين في شهواتهم", "noteAr": ""}], "arS": [["فقد سبق أن ", []], ["نبهوكم", ["G3004", "G5213"]], [" إلى ", []], ["أنه", ["G3754"]], ["، في ", []], ["نهاية", ["G2078"]], [" ", []], ["الزمان", ["G5550"]], ["، ", []], ["سيطلع", ["G2071"]], [" ", []], ["مستهزئون", ["G1703"]], [" ", []], ["يعيشون", ["G4198"]], [" منغمسين في ", []], ["شهواتهم", ["G1438", "G1939"]], [" ", []], ["الفاسقة", ["G763"]], [".", []]]}, {"c": 1, "v": 19, "text": "هؤلاء هم الذين يسببون الانشقاق، وينساقون وراء غرائزهم الحيوانية، وليس الروح القدس فيهم!", "groups": [{"kw": "who", "raw": "Pro_18:1; Isa_65:5; Eze_14:7; Hos_4:14, Hos_9:10; Heb_10:25", "note": "", "refs": [{"l": "Pro 18:1", "n": "", "vs": [[1, "المعتزل (عن الله والناس) ينشد شهوته ويتنكر لكل مشورة صائبة."]]}, {"l": "Isa 65:5", "n": "", "vs": [[5, "ويقول أحدهم للآخر: لا تقترب مني لئلا تدنسني، لأني أقدس منك. (فيثيرون غيظي) كدخان في أنفي ونار تتقد طول النهار."]]}, {"l": "Eze 14:7", "n": "", "vs": [[7, "لأن كل رجل من شعب إسرائيل ومن الغرباء الدخلاء القاطنين في إسرائيل، إذا ارتد عني ونصب أصنامه في قلبه وأقام معثرة إثمه تلقاء وجهه، ثم حضر إلى النبي ليسأله عني، فإني أنا الرب أجيبه بذاتي."]]}, {"l": "Hos 4:14", "n": "", "vs": [[14, "ولكني لن أعاقب بناتكم حين يزنين، ولا كناتكم حين يفسقن لأن الرجال أنفسهم قد تورطوا مع الزانيات، وذبحوا محرمات مع بغايا المعابد الوثنية، والشعب غير المتعقل يلحق به الدمار."]]}, {"l": "Hos 9:10", "n": "", "vs": [[10, "وجدت إسرائيل كعنب في البرية، ورأيت آباءهم كباكورة ثمر شجرة التين في أول موسمها. ولكنهم التصقوا ببعل فغور ونذروا أنفسهم للصنم المخزي، فأصبحوا رجسا نظير الشيء الذي أحبوه."]]}, {"l": "Heb 10:25", "n": "", "vs": [[25, "وعلينا ألا ننقطع عن الاجتماع معا، كما تعود بعضكم أن يفعل. إنما، يجدر بكم أن تحثوا وتشجعوا بعضكم بعضا، وتواظبوا على هذا بقدر ما ترون ذلك اليوم يقترب."]]}], "kwAr": "يسببون الانشقاق", "noteAr": ""}, {"kw": "sensual", "raw": "1Co_2:14; Jam_3:15, Gr", "note": "", "refs": [{"l": "1Co 2:14", "n": "", "vs": [[14, "غير أن الإنسان البشري لا يتقبل أمور روح الله إذ يعتبرها جهالة، ولا يستطيع أن يعرفها لأن تمييزها إنما يحتاج إلى حس روحي."]]}, {"l": "Jam 3:15", "n": "", "vs": [[15, "إن هذه الحكمة التي تدعونها ليست نازلة من عند الله، بل هي «حكمة» أرضية بشرية شيطانية."]]}], "kwAr": "غرائزهم الحيوانية", "noteAr": ""}, {"kw": "having", "raw": "Joh_3:5, Joh_3:6; Rom_8:9; 1Co_6:19", "note": "", "refs": [{"l": "Joh 3:5", "n": "", "vs": [[5, "أجابه يسوع: «الحق الحق أقول لك: لا يمكن أن يدخل أحد ملكوت الله إلا إذا ولد من الماء والروح."]]}, {"l": "Joh 3:6", "n": "", "vs": [[6, "فالمولود ، أو ترجمة. فليتم كل شيء بهدف البنيان."]]}, {"l": "Eph 4:12", "n": "", "vs": [[12, "لتأهيل القديسين من جهة عمل الخدمة، لبنيان جسد المسيح،"]]}, {"l": "Eph 4:16", "n": "", "vs": [[16, "فمنه يستمد الجسد كله تماسكه وترابطه بمساندة كل مفصل وفقا لمقدار العمل المخصص لكل جزء، لينشيء نموا يؤول إلى بنيان الجسد بنيانا ذاتيا في المحبة."]]}, {"l": "Eph 4:29", "n": "", "vs": [[29, "لا تخرج من أفواهكم كلمة فاسدة، بل الكلام الصالح للبنيان الذي تدعو إليه الحاجة، كي يعطي السامعين نعمة."]]}, {"l": "Col 2:7", "n": "", "vs": [[7, "وأنتم متأصلون ومبنيون فيه وراسخون في الإيمان الموافق لما تعلمتم وفائضون بالشكر."]]}, {"l": "1Th 5:11", "n": "", "vs": [[11, "لذلك عزوا بعضكم بعضا وشددوا أحدكم الآخر، كما أنتم فاعلون."]]}, {"l": "1Ti 1:4", "n": "", "vs": [[4, "وتوصي المؤمنين ألا ينشغلوا بالأساطير وسلاسل النسب المتشابكة. فتلك الأمور تثير المجادلات ولا تعمل على تقدم تدبير الله القائم على الإيمان."]]}], "kwAr": "ابنوا أنفسكم", "noteAr": ""}, {"kw": "most", "raw": "Act_15:9, Act_26:18; 2Ti_1:5; Tit_1:1; Jam_2:22; 2Pe_1:1; 1Jo_5:4; Rev_13:10", "note": "", "refs": [{"l": "Act 15:9", "n": "", "vs": [[9, "فهو لم يفرق بيننا وبينهم في شيء، إذ طهر بالإيمان قلوبهم."]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "2Ti 1:5", "n": "", "vs": [[5, "كما أستذكر إيمانك الخالي من الرياء، هذا الإيمان الذي فيك والذي حل أولا في جدتك لوئيس ثم في أمك أفنيكي، وأنا متأكد أنه حال فيك أيضا."]]}, {"l": "Tit 1:1", "n": "", "vs": [[1, "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"]]}, {"l": "Jam 2:22", "n": "", "vs": [[22, "فأنت ترى أن إيمان إبراهيم قد رافقته الأعمال. فبالأعمال قد اكتمل الإيمان."]]}, {"l": "2Pe 1:1", "n": "", "vs": [[1, "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"]]}, {"l": "1Jo 5:4", "n": "", "vs": [[4, "ذلك لأن المولود من الله ينتصر على العالم. فالإيمان هو الذي يجعلنا ننتصر على العالم."]]}, {"l": "Rev 13:10", "n": "", "vs": [[10, "من ساق غيره إلى السبي، فإلى السبي سيساق؛ ومن قتل بالسيف، فبالسيف سيقتل! هنا يظهر صبر القديسين وإيمانهم."]]}], "kwAr": "إيمانكم الأقدس", "noteAr": ""}, {"kw": "praying", "raw": "Zec_12:10; Rom_8:15, Rom_8:26, Rom_8:27; 1Co_14:15; Gal_4:6; Eph_6:18", "note": "", "refs": [{"l": "Zec 12:10", "n": "", "vs": [[10, "وأفيض على ذرية داود وعلى سكان أورشليم روح النعمة والابتهال، حتى إذا نظروا إلي أنا الذي طعنوه ينوحون عليه كما ينوح والد على ولده الوحيد، متفجعين عليه كتفجعهم على موت بكرهم."]]}, {"l": "Rom 8:15", "n": "", "vs": [[15, "إذ إنكم لم تنالوا روح عبودية يعيدكم إلى الخوف، بل نلتم روح بنوة به نصرخ: «أبا! أبانا!»"]]}, {"l": "Rom 8:26", "n": "", "vs": [[26, "وكذلك الروح أيضا يمدنا بالعون لنقهر ضعفنا. فإننا لا نعلم ما يجب أن نصلي لأجله كما يليق، ولكن الروح نفسه يؤدي الشفاعة عنا بأنات تفوق التعبير."]]}, {"l": "Rom 8:27", "n": "", "vs": [[27, "على أن فاحص القلوب يعلم قصد الروح، لأن الروح يشفع في القديسين بما يوافق الله ."]]}, {"l": "1Co 14:15", "n": "", "vs": [[15, "فما العمل إذن؟ سأصلي بالروح، ولكن سأصلي بالعقل أيضا. سأرنم بالروح، ولكن سأرنم بالعقل أيضا."]]}, {"l": "Gal 4:6", "n": "", "vs": [[6, "وبما أنكم أبناء له، أرسل الله إلى قلوبنا روح ابنه، مناديا: «أبا، ياأبانا»."]]}, {"l": "Eph 6:18", "n": "", "vs": [[18, "كونوا مصلين في كل حال، بكل صلاة وطلبة في الروح، وساهرين لهذا الغرض عينه مواظبين تماما على جميع الطلبات لأجل القديسين جميعا،"]]}], "kwAr": "صلوا في الروح القدس", "noteAr": ""}], "arS": [["وأما", ["G1161"]], [" ", []], ["أنتم", ["G5210"]], [" أيها ", []], ["الأحباء", ["G27"]], ["، ", []], ["فابنوا", ["G2026"]], [" ", []], ["أنفسكم", ["G1438"]], [" على ", []], ["إيمانكم", ["G5216", "G4102"]], [" ", []], ["الأقدس", ["G40"]], ["، ", []], ["وصلوا", ["G4336"]], [" دائما ", []], ["في", ["G1722"]], [" ", []], ["الروح القدس", ["G40", "G4151"]], [".", []]]}, {"c": 1, "v": 21, "text": "واحفظوا أنفسكم في محبة الله، منتظرين رحمة ربنا يسوع المسيح إذ يعود ويأخذكم لتحيوا معه إلى الأبد.", "groups": [{"kw": "Keep", "raw": "Jud_1:24; Joh_14:21, Joh_15:9, Joh_15:10; Act_11:23; 1Jo_4:16, 1Jo_5:18, 1Jo_5:21; Rev_12:11", "note": "", "refs": [{"l": "Jud 1:24", "n": "", "vs": [[24, "وللقادر أن يحرسكم من السقوط حتى يوصلكم إلى المثول أمامه في المجد مبتهجين ولا عيب فيكم …"]]}, {"l": "Joh 14:21", "n": "", "vs": [[21, "من كانت عنده وصاياي، ويعمل بها، فذاك يحبني. والذي يحبني، يحبه أبي، وأنا أحبه وأعلن له ذاتي»."]]}, {"l": "Joh 15:9", "n": "", "vs": [[9, "مثلما أحبني الآب، أحببتكم أنا، فاثبتوا في محبتي."]]}, {"l": "Joh 15:10", "n": "", "vs": [[10, "إن عملتم بوصاياي، تثبتون في محبتي، كما عملت أنا بوصايا أبي وأثبت في محبته!"]]}, {"l": "Act 11:23", "n": "", "vs": [[23, "فلما وصل ورأى النعمة التي منحها الله ، امتلأ فرحا، وحث الجميع على الثبات في الرب بعزم القلب."]]}, {"l": "1Jo 4:16", "n": "", "vs": [[16, "ونحن أنفسنا اختبرنا المحبة التي خصنا الله بها، ووضعنا ثقتنا فيها. إن الله محبة. ومن يثبت في المحبة، فإنه يثبت في الله، والله يثبت فيه."]]}, {"l": "1Jo 5:18", "n": "", "vs": [[18, "نحن واثقون بأن كل من ولد من الله لا يمارس الخطيئة، لأن ابن الله يحميه فلا يمسه إبليس الشرير."]]}, {"l": "1Jo 5:21", "n": "", "vs": [[21, "أيها الأولاد الصغار، احفظوا أنفسكم من الأصنام!"]]}, {"l": "Rev 12:11", "n": "", "vs": [[11, "وهم قد انتصروا عليه بدم الحمل وبالكلمة التي شهدوا لها، فلم تكن حياتهم عزيزة لديهم، حتى إنهم ماتوا."]]}], "kwAr": "احفظوا أنفسكم", "noteAr": ""}, {"kw": "in", "raw": "Rom_5:5, Rom_8:39; 2Th_3:5; 1Jo_3:16, 1Jo_3:17", "note": "", "refs": [{"l": "Rom 5:5", "n": "", "vs": [[5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."]]}, {"l": "Rom 8:39", "n": "", "vs": [[39, "ولا الأعالي ولا الأعماق، ولا خليقة أخرى، تقدر أن تفصلنا عن محبة الله التي لنا في المسيح يسوع ربنا."]]}, {"l": "2Th 3:5", "n": "", "vs": [[5, "وليهد الله قلوبكم إلى ما لدى الله من المحبة ولدى المسيح من الصبر!"]]}, {"l": "1Jo 3:16", "n": "", "vs": [[16, "ومقياس المحبة هو العمل الذي قام به المسيح إذ بذل حياته لأجلنا. فعلينا نحن أيضا أن نبذل حياتنا لأجل إخوتنا."]]}, {"l": "1Jo 3:17", "n": "", "vs": [[17, "وأما الذي يملك مالا يمكنه من العيش في بحبوحة، ويقسي قلبه على أحد الإخوة المحتاجين، فكيف تكون محبة الله متأصلة فيه؟"]]}], "kwAr": "في محبة الله", "noteAr": ""}, {"kw": "looking", "raw": "Job_14:14; Lam_3:25, Lam_3:26; Mat_24:42-51; Luk_12:36-40; 2Ti_4:8; Tit_2:13, Tit_2:14; Heb_9:28; 2Pe_3:12", "note": "", "refs": [{"l": "Job 14:14", "n": "", "vs": [[14, "إن مات رجل أفيحيا؟ إذن لصبرت كل أيام مكابدتي، ريثما يأتي زمن إعفائي."]]}, {"l": "Lam 3:25", "n": "", "vs": [[25, "الرب صالح لمن يرجونه وللنفس التي تلتمسه."]]}, {"l": "Lam 3:26", "n": "", "vs": [[26, "خير للمرء أن ينتظر بصمت خلاص الرب."]]}, {"l": "Mat 24:42-51", "n": "", "vs": [[42, "فاسهروا إذن، لأنكم لا تعرفون في أية ساعة يرجع ربكم."], [43, "واعلموا أنه لو عرف رب البيت في أي ربع من الليل يدهمه اللص، لظل ساهرا ولم يدع بيته ينقب."], [44, "فكونوا أنتم أيضا على استعداد، لأن ابن الإنسان سيرجع في ساعة لا تتوقعونها!"], [45, "فمن هو إذن ذلك العبد الأمين والحكيم الذي أقامه سيده على أهل بيته ليقدم لهم الطعام في أوانه؟"], [46, "طوبى لذلك العبد الذي يأتي سيده فيجده يقوم بعمله."], [47, "الحق أقول لكم: إنه سيقيمه على ممتلكاته كلها."], [48, "ولكن إذا قال ذلك العبد الشرير في قلبه: سيتأخر سيدي في رجوعه!"], [49, "وبدأ يضرب زملاءه العبيد ويأكل ويشرب مع السكيرين،"], [50, "فإن سيد ذلك العبد لابد أن يرجع في يوم لا يتوقعه، وساعة لا يعرفها،"], [51, "فيفصله ويجعل نصيبه مع المرائين، هناك يكون البكاء وصرير الأسنان!"]]}, {"l": "Luk 12:36-40", "n": "", "vs": [[36, "وكونوا مثل أناس ينتظرون رجوع سيدهم من وليمة العرس، حتى إذا وصل وقرع الباب يفتحون له حالا."], [37, "طوبى لأولئك العبيد الذين يجدهم سيدهم لدى عودته ساهرين. الحق أقول لكم: إنه يشد وسطه بالحزام ويجعلهم يتكئون ويقوم يخدمهم."], [38, "فطوبى لهم إذا رجع في الربع الثاني أو الثالث من الليل ووجدهم على تلك الحال."], [39, "ولكن اعلموا هذا: أنه لو كان رب البيت يعرف في أية ساعة يدهمه اللص، لكان سهر وما ترك بيته ينقب."], [40, "فكونوا أنتم مستعدين، لأن ابن الإنسان سيعود في ساعة لا تتوقعونها»."]]}, {"l": "2Ti 4:8", "n": "", "vs": [[8, "إنما ينتظرني الآن إكليل البر المحفوظ لي، والذي سيهبه لي الرب الديان العادل في ذلك اليوم؛ ولن يوهب لي وحدي، بل أيضا لجميع الذين يحبون ظهوره."]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Heb 9:28", "n": "", "vs": [[28, "كذلك المسيح أيضا: مات مرة واحدة حاملا خطايا كثيرين، مقربا نفسه (لله) عوضا عنهم. ولا بد أن يعود إلى الظهور. لا ليعالج الخطايا، بل ليحقق الخلاص النهائي لجميع منتظريه!"]]}, {"l": "2Pe 3:12", "n": "", "vs": [[12, "منتظرين «يوم الله» الأبدي وطالبين حلوله بسرعة. ففي ذلك اليوم، تنحل السماوات ملتهبة، وتذوب العناصر محترقة."]]}], "kwAr": "منتظرين", "noteAr": ""}, {"kw": "the mercy", "raw": "Joh_1:17; 1Ti_1:2; 2Ti_1:2, 2Ti_1:16, 2Ti_1:18", "note": "", "refs": [{"l": "Joh 1:17", "n": "", "vs": [[17, "لأن الشريعة أعطيت على يد موسى، أما النعمة والحق فقد تواجدا بيسوع المسيح."]]}, {"l": "1Ti 1:2", "n": "", "vs": [[2, "إلى تيموثاوس ولدي الحقيقي في الإيمان. لتكن لك النعمة والرحمة والسلام من الله أبينا والمسيح يسوع ربنا!"]]}, {"l": "2Ti 1:2", "n": "", "vs": [[2, "إلى تيموثاوس، ولدي الحبيب لتكن لك النعمة والرحمة والسلام من الله الآب والمسيح يسوع ربنا."]]}, {"l": "2Ti 1:16", "n": "", "vs": [[16, "ليرحم الرب عائلة أونيسيفورس، لأنه كثيرا ما أنعشني، ولم يخجل بقيودي،"]]}, {"l": "2Ti 1:18", "n": "", "vs": [[18, "لينعم عليه الرب بأن يلقى الرحمة من الرب في ذلك اليوم! أما كل ما خدمني به في مدينة أفسس، فأنت تعرفه جيدا."]]}], "kwAr": "رحمة ربنا", "noteAr": ""}, {"kw": "unto", "raw": "Rom_5:21, Rom_6:23; 1Jo_5:10,1Jo_5:11", "note": "", "refs": [{"l": "Rom 5:21", "n": "", "vs": [[21, "حتى إنه كما ملكت الخطيئة بالموت، فكذلك أيضا تملك النعمة على أساس البر مؤدية إلى الحياة الأبدية بيسوع المسيح ربنا."]]}, {"l": "Rom 6:23", "n": "", "vs": [[23, "لأن أجرة الخطيئة هي الموت، وأما هبة الله فهي الحياة الأبدية في المسيح يسوع ربنا."]]}, {"l": "1Jo 5:10", "n": "", "vs": [[10, "فمن يؤمن بابن الله، يثق في قلبه بصحة هذه الشهادة. أما من لا يصدق الله ، إذ يرفض تصديق الشهادة التي شهد بها لابنه، فهو يتهم الله بالكذب."]]}, {"l": "1Jo 5:11", "n": "", "vs": [[11, "وهذه الشهادة هي أن الله أعطانا حياة أبدية، وأن هذه الحياة هي في ابنه."]]}], "kwAr": "لتحيوا معه إلى الأبد", "noteAr": ""}], "arS": [["واحفظوا", ["G5083"]], [" ", []], ["أنفسكم", ["G1438"]], [" ", []], ["في", ["G1722"]], [" ", []], ["محبة", ["G26"]], [" ", []], ["الله", ["G2316"]], ["، ", []], ["منتظرين", ["G4327"]], [" ", []], ["رحمة", ["G1656"]], [" ", []], ["ربنا", ["G2257", "G2962"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [" إذ يعود ويأخذكم ", []], ["لتحيوا", ["G2222"]], [" معه ", []], ["إلى الأبد", ["G1519", "G166"]], [".", []]]}, {"c": 1, "v": 22, "text": "بعض الناس يجب أن تعاملوهم بشفقة بسبب شكوكهم.", "groups": [{"kw": "", "raw": "Jud_1:4-13; Eze_34:17; Gal_4:20, Gal_6:1; Heb_6:4-8; Jam_5:19, Jam_5:20; 1Jo_5:16-18", "note": "", "refs": [{"l": "Jud 1:4-13", "n": "", "vs": [[4, "لأنه قد تسلل إلى ما بينكم معلمون لابد أن يلاقوا الحكم بالعقاب الأبدي، كما هو مكتوب لهم منذ القديم. فهم أشرار لا يهابون الله ، يتخذون من نعمة إلهنا فرصة لإباحة الرذائل، وينكرون سيدنا وربنا الوحيد يسوع المسيح."], [5, "فالآن، أريد أن أذكركم بأمور تعرفونها. فأنتم تعرفون أن الرب، بعدما أنقذ الشعب من مصر، عاد فأهلك الذين لم يؤمنوا من ذلك الشعب."], [6, "وأما الملائكة الذين لم يحافظوا على مقامهم الرفيع، بل تركوا مركزهم، فمازال الرب يحفظهم مقيدين بسلاسل أبدية في أعماق الظلام، بانتظار دينونة ذلك اليوم العظيم."], [7, "وتعرفون كذلك ما فعله الرب بمدينتي سدوم وعمورة وبالمدن التي حولهما. فقد كان أهل هذه المدن، مثل أولئك المعلمين، مندفعين وراء الزنى، ومنغمسين في شهوات مخالفة للطبيعة. لذلك عاقب الرب هذه المدن بالنار الأبدية، فدمرها. فكانت بذلك عبرة للآخرين."], [8, "ومع ذلك، فإن أولئك المعلمين المتوهمين يسيرون في الطريق التي سار فيها أهل تلك المدن. إذ يلوثون أجسادهم بالنجاسة، ويحتقرون السيادة الإلهية، ويتكلمون بالإهانة على الكائنات المجيدة!"], [9, "فحتى ميخائيل، وهو رئيس ملائكة، لم يجرؤ أن يحكم على إبليس بكلام مهين عندما خاصمه وتجادل معه بخصوص جثمان موسى، وإنما اكتفى بالقول له: «ليزجرك الرب!»"], [10, "ولكن هؤلاء المعلمين يتكلمون كلاما مهينا على أمور لا يعرفونها. وأما ما يفهمونه بالغريزة، كالحيوانات غير العاقلة، فإنهم به يدمرون أنفسهم."], [11, "الويل لهم! لأنهم سلكوا طريق قايين، واندفعوا إلى ارتكاب خطيئة بلعام طلبا للمال، وتمردوا كما تمرد قورح، فدمروا أنفسهم."], [12, "إنهم يشتركون معكم في ولائم المحبة دون خجل، ولكنهم كصخور تعيقكم. لا هم لهم سوى تعليف أنفسهم! إنهم يشبهون غيوما بلا مطر تسوقها الرياح، وأشجارا خريفية بلا ثمر، يقتلعها أصحابها، فتكون قد ماتت مرتين."], [13, "وبأعمالهم المخجلة يفضحون أنفسهم كأمواج في البحر هائجة تقذف الأوساخ. وهم أشبه بنجوم تائهة في الفضاء، مصيرها الظلام الشديد إلى الأبد!"]]}, {"l": "Eze 34:17", "n": "", "vs": [[17, "أما أنتم ياغنمي فها أنا أقضي بين شاة وشاة، وبين كباش وتيوس."]]}, {"l": "Gal 4:20", "n": "", "vs": [[20, "وكم أود لو أكون الآن حاضرا عندكم، فأخاطبكم بغير هذه اللهجة، لأني متحير في أمركم."]]}, {"l": "Gal 6:1", "n": "", "vs": [[1, "أيها الإخوة، إن سقط أحدكم في خطأ ما فمثل هذا أصلحوه أنتم الروحيين بروح وداعة. واحذر أنت لنفسك لئلا تجرب أيضا."]]}, {"l": "Heb 6:4-8", "n": "", "vs": [[4, "ذلك لأن الذين قد تعرضوا مرة لنور الإيمان بالمسيح، فذاقوا العطية السماوية، وصاروا (إلى حين) من شركاء الروح القدس،"], [5, "وذاقوا كلمة الله الطيبة، وشاهدوا المعجزات التي تظهر عظمة «العالم الآتي»،"], [6, "ثم ارتدوا إلى تلك الأسس القديمة، أولئك يستحيل عليهم أن يتجددوا ثانية فيعودوا إلى التوبة. فهم يجنون على أنفسهم إذ يصلبون ابن الله مرة ثانية ويجعلونه عرضة للعار."], [7, "ولا عجب، فالتربة التي تشرب الأمطار النازلة عليها مرارا كثيرة، ثم تنتج نباتا ينفع الذين حرثوها، تنال البركة من الله!"], [8, "ولكنها، إن أخرجت الشوك والعشب البري، تكون مرفوضة وتستحق اللعنة، وما نهايتها إلا الحريق."]]}, {"l": "Jam 5:19", "n": "", "vs": [[19, "أيها الإخوة، إن ضل أحد بينكم عن الحق، ورده آخر،"]]}, {"l": "Jam 5:20", "n": "", "vs": [[20, "فليتأكد أن الذي يرد خاطئا عن ضلال مسلكه، فإنما ينقذ نفسا من الموت، ويستر خطايا كثيرة!"]]}, {"l": "1Jo 5:16-18", "n": "", "vs": [[16, "إن رأى أحد منكم واحدا من إخوته يمارس خطيئة لا تنتهي به إلى الموت، فمن واجبه أن يصلي إلى الله من أجله، فيبقيه على قيد الحياة. هذا إذا كانت الخطيئة التي يمارسها لا تنتهي به إلى الموت. فهنالك خطيئة لابد أن تنتهي إلى الموت. وطبعا، أنا لا أقصد هذه الخطيئة هنا."], [17, "كل إثم هو خطيئة، ولا تنتهي كل خطيئة إلى الموت."], [18, "نحن واثقون بأن كل من ولد من الله لا يمارس الخطيئة، لأن ابن الله يحميه فلا يمسه إبليس الشرير."]]}], "kwAr": "", "noteAr": ""}], "arS": [["بعض الناس", ["G3739", "G3303"]], [" يجب أن تعاملوهم ", []], ["بشفقة", ["G1653"]], [" بسبب ", []], ["شكوكهم", ["G1252"]], [".", []]]}, {"c": 1, "v": 23, "text": "وبعضهم يجب أن تنقذوهم من النار خطفا. وآخرون يجب أن تعالجوهم بشفقة وحذر، مبغضين حتى الثياب التي يلوثونها بأجسادهم.", "groups": [{"kw": "save", "raw": "Rom_11:14; 1Co_5:3-5; 2Co_7:10-12; 1Ti_4:16", "note": "", "refs": [{"l": "Rom 11:14", "n": "", "vs": [[14, "لعلي أثير غيرة بني جنسي فأنقذ بعضا منهم."]]}, {"l": "1Co 5:3-5", "n": "", "vs": [[3, "فإني، وأنا غائب عنكم بالجسد ولكن حاضر بينكم بالروح، قد حكمت على الفاعل كأني حاضر:"], [4, "باسم ربنا يسوع المسيح، إذ تجتمعون معا، وروحي معكم، فبسلطة ربنا يسوع المسيح،"], [5, "تقررون تسليم مرتكب هذا الفعل إلى الشيطان، ليهلك جسده؛ أما روحه فتخلص في يوم الرب يسوع."]]}, {"l": "2Co 7:10-12", "n": "", "vs": [[10, "فإن الحزن الذي يوافق مشيئة الله ينتج توبة تؤدي إلى الخلاص، وليس عليه ندم. وأما حزن العالم فينتج موتا."], [11, "فانظروا، إذن، هذا الحزن عينه الذي يوافق الله ، كم أنتج فيكم من الاجتهاد، بل من الاعتذار، بل من الاستنكار، بل من الخوف، بل من التشوق، بل من الغيرة، بل من الانتقام! وقد بينتم في كل شيء أنكم أبرياء من ذلك الأمر."], [12, "إذن، كتبت إليكم ما كتبته سابقا لا من أجل المذنب ولا من أجل المذنب إليه، بل لكي يظهر لكم أمام الله مدى حماستكم لطاعتنا."]]}, {"l": "1Ti 4:16", "n": "", "vs": [[16, "انتبه جيدا لنفسك وللتعليم. فإنك إذ تواظب على ذلك، تنقذ نفسك وسامعيك أيضا."]]}], "kwAr": "تنقذوهم", "noteAr": ""}, {"kw": "pulling", "raw": "Amo_4:11; Zec_3:2; 1Co_3:15", "note": "", "refs": [{"l": "Amo 4:11", "n": "", "vs": [[11, "دمرت بعض مدنكم كما دمر الله سدوم وعمورة، فكان من نجا منكم كشعلة منتشلة من النار. ولكنكم لم ترجعوا إلي تائبين."]]}, {"l": "Zec 3:2", "n": "", "vs": [[2, "فقال الرب للشيطان: «إن الرب ينتهرك ياشيطان، الرب الذي اصطفى أورشليم ينتهرك، أليس هذا الرجل كحطبة مشتعلة انتشلت من النار؟»"]]}, {"l": "1Co 3:15", "n": "", "vs": [[15, "ومن احترق عمله، يخسر، إلا أنه هو سيخلص؛ ولكن كمن يمر في النار."]]}], "kwAr": "من النار خطفا", "noteAr": ""}, {"kw": "hating", "raw": "Lev_13:47-59, Lev_14:47, Lev_15:17; Isa_64:6; Lam_4:14; Zec_3:3-5; 1Co_5:9-11; 1Co_15:33; 2Th_3:14; Rev_3:4, Rev_3:18", "note": "", "refs": [{"l": "Lev 13:47-59", "n": "", "vs": [[47, "وإذا بدا داء البرص المعدي، في ثوب صوف أو كتان"], [48, "أو في قطعة قماش منسوجة أو محيكة من صوف أو كتان، أو في جلد، أو في كل مصنوع من جلد،"], [49, "وكانت إصابة الثوب أو الجلد أو قطعة القماش المنسوجة أو المحيكة، أو في شيء مصنوع من جلد، ضاربة إلى الحمرة أو الخضرة، فإنها إصابة برص تعرض على الكاهن."], [50, "فيفحص الإصابة ويحجز الشيء المصاب سبعة أيام،"], [51, "ثم يفحصها في اليوم السابع. فإن وجدها قد امتدت في الثوب أو قطعة القماش، أو في الجلد أو في كل ما يصنع من جلد، ويستخدم في عمل ما، فإن الإصابة تكون برصا معديا وتكون نجسة."], [52, "فيحرق الكاهن بالنار الثوب أو قطعة قماش الصوف أو الكتان أو متاع الجلد المصاب، لأنه داء معد."], [53, "لكن إن وجد الكاهن أن الإصابة لم تمتد في الثوب أو في قطعة القماش المنسوجة أو المحيكة أو في متاع الجلد،"], [54, "يأمر بغسل الشيء ويحجزه سبعة أيام أخرى."], [55, "فإن رأى الكاهن أن لون البقعة في الشيء المصاب لم يتغير، ولا اتسعت البقعة فيه، يأمر بحرقه فهو نجس لأنه انتشر في ظاهر المتاع وفي باطنه."], [56, "ولكن إن وجد الكاهن، بعد فحص الشيء المصاب، أن البقعة قد كمد لونها بعد غسلها، فلينتزعها من الثوب أو الجلد أو قطعة القماش المنسوجة أو المحيكة."], [57, "ثم إن عادت البقعة فظهرت ثانية في الثوب أو في القماش المنسوج أو المحيك أو متاع الجلد، تكون الإصابة معدية. ويجب إحراق الشيء المصاب بالنار."], [58, "وأما الثوب أو بطانته المنسوجة أو المحيكة، أو متاع الجلد الذي يتم غسله وتزول منه البقعة، فيغسل ثانية ويطهر."], [59, "هذه هي نصوص التعليمات المتعلقة بإصابة البرص في الصوف أو الكتان في البطانة المنسوجة أو المحيكة، أو في كل متاع جلدي، وبمقتضاها تحكمون على طهارتها أو نجاستها»."]]}, {"l": "Lev 14:47", "n": "", "vs": [[47, "وعلى كل من نام فيه أو أكل، أن يغسل ثيابه."]]}, {"l": "Lev 15:17", "n": "", "vs": [[17, "وكل ما يقع عليه السائل المنوي من ثياب أو جلد يغسل بماء ويكون نجسا إلى المساء."]]}, {"l": "Isa 64:6", "n": "", "vs": [[6, "كلنا أصبحنا كنجس، وأضحت جميع أعمال برنا كثوب قذر، فذبلنا كأوراق الشجر وعبثت بنا آثامنا كالريح."]]}, {"l": "Lam 4:14", "n": "", "vs": [[14, "تاهوا كعمي في الشوارع، ملطخين بالدم حتى لم يقدر أحد أن يلمس ثيابهم."]]}, {"l": "Zec 3:3-5", "n": "", "vs": [[3, "وكان يهوشع آنئذ واقفا في حضرة الملاك مرتديا ثيابا قذرة."], [4, "فقال الملاك للماثلين في حضرته: «اخلعوا عنه هذه الثياب القذرة». ثم قال ليهوشع: «انظر، ها أنا قد أزلت عنك إثمك وكسوتك ثوبا جديدا»."], [5, "ثم أضاف: «ضعوا عمامة طاهرة على رأسه». فوضعوا العمامة الطاهرة على رأسه وكسوه ثيابا بهية، وملاك الرب ما برح واقفا."]]}, {"l": "1Co 5:9-11", "n": "", "vs": [[9, "كتبت إليكم في رسالتي أن لا تعاشروا الزناة."], [10, "فلا أعني زناة هذا العالم أو الطماعين أو السراقين أو عابدي الأصنام على وجه الإطلاق، وإلا كنتم مضطرين إلى الخروج من المجتمع البشري!"], [11, "أما الآن فقد كتبت إليكم بأن لا تعاشروا من يسمى أخا إن كان زانيا أو طماعا أو عابد أصنام أو شتاما أو سكيرا أو سراقا. فمثل هذا لا تعاشروه ولا تجلسوا معه لتناول الطعام."]]}, {"l": "1Co 15:33", "n": "", "vs": [[33, "لا تنقادوا إلى الضلال: إن المعاشرات الرديئة تفسد الأخلاق الجيدة!"]]}, {"l": "2Th 3:14", "n": "", "vs": [[14, "وإن كان أحد لا يطيع كلمتنا في هذه الرسالة، فميزوه ولا تتعاملوا معه، لتدفعوه إلى الخجل."]]}, {"l": "Rev 3:4", "n": "", "vs": [[4, "إلا أن عندك في ساردس قليلين لم يلوثوا ثيابهم بالنجاسة. هؤلاء سيسيرون معي لابسين ثيابا بيضاء."]]}, {"l": "Rev 3:18", "n": "", "vs": [[18, "نصيحتي لك أن تشتري مني ذهبا نقيا، صفته النار، فتغتني حقا، وثيابا بيضاء ترتديها فتستر عريك المعيب، وكحلا لشفاء عينيك فيعود إليك البصر."]]}], "kwAr": "مبغضين حتى الثياب", "noteAr": ""}], "arS": [["وبعضهم", ["G3739"]], [" يجب أن ", []], ["تنقذوهم", ["G4982"]], [" ", []], ["من", ["G1537"]], [" ", []], ["النار", ["G4442"]], [" ", []], ["خطفا", ["G726"]], [". وآخرون يجب أن تعالجوهم ", []], ["بشفقة وحذر", ["G1722", "G5401"]], ["، ", []], ["مبغضين", ["G3404"]], [" ", []], ["حتى", ["G2532"]], [" ", []], ["الثياب", ["G5509"]], [" التي ", []], ["يلوثونها", ["G4696"]], [" ", []], ["بأجسادهم", ["G4561"]], [".", []]]}, {"c": 1, "v": 24, "text": "وللقادر أن يحرسكم من السقوط حتى يوصلكم إلى المثول أمامه في المجد مبتهجين ولا عيب فيكم …", "groups": [{"kw": "able", "raw": "Jud_1:21; Joh_10:29, Joh_10:30; Rom_8:31, Rom_14:4, Rom_16:25-27; Eph_3:20; 2Ti_4:18", "note": "", "refs": [{"l": "Jud 1:21", "n": "", "vs": [[21, "واحفظوا أنفسكم في محبة الله، منتظرين رحمة ربنا يسوع المسيح إذ يعود ويأخذكم لتحيوا معه إلى الأبد."]]}, {"l": "Joh 10:29", "n": "", "vs": [[29, "إن الآب الذي أعطاني إياها هو أعظم من الجميع، ولا يقدر أحد أن ينتزع من يد الآب شيئا."]]}, {"l": "Joh 10:30", "n": "", "vs": [[30, "أنا والآب واحد!»"]]}, {"l": "Rom 8:31", "n": "", "vs": [[31, "فبعد هذا، ماذا نقول؟ مادام الله معنا، فمن يكون علينا؟ ذاك الذي لم يمسك عنا ابنه،"]]}, {"l": "Rom 14:4", "n": "", "vs": [[4, "فمن أنت لتدين خادم غيرك؟ إنه في نظر سيده يثبت أو يسقط. ولسوف يثبت، لأن الرب قادر أن يثبته."]]}, {"l": "Rom 16:25-27", "n": "", "vs": [[25, "والمجد للقادر أن يثبتكم، وفقا لإنجيلي وللبشارة بيسوع المسيح، ووفقا لإعلان ما كان سرا ظل مكتوما مدى الأزمنة الأزلية،"], [26, "ولكن أذيع الآن، بأمر الله الأزلي في الكتابات النبوية، على جميع الأمم لأجل إطاعة الإيمان؛"], [27, "المجد لله إلى الأبد، الحكيم وحده، بيسوع المسيح. آمين!"]]}, {"l": "Eph 3:20", "n": "", "vs": [[20, "والقادر أن يفعل، وفقا للقدرة العاملة فينا، ما يفوق بلا حصر كل ما نطلب أو نتصور،"]]}, {"l": "2Ti 4:18", "n": "", "vs": [[18, "وسينجيني الرب من كل عمل شرير ويحفظني سالما لملكوته السماوي. فله المجد إلى أبد الآبدين آمين!"]]}], "kwAr": "للقادر", "noteAr": ""}, {"kw": "present", "raw": "2Co_4:14, 2Co_11:2; Eph_5:27; Col_1:22, Col_1:28, Col_3:4; Heb_13:20,Heb_13:21", "note": "", "refs": [{"l": "2Co 4:14", "n": "", "vs": [[14, "ونحن عالمون أن الذي أقام الرب يسوع من الموت سوف يقيمنا نحن أيضا مع يسوع، ويوقفنا في حضرته بصحبتكم."]]}, {"l": "2Co 11:2", "n": "", "vs": [[2, "فإني أغار عليكم غيرة من عند الله لأني خطبتكم لرجل واحد هو المسيح، لأقدمكم إليه عذراء عفيفة."]]}, {"l": "Eph 5:27", "n": "", "vs": [[27, "حتى يزفها إلى نفسه كنيسة بهية لا يشوبها عيب أو تجعد أو أية نقيصة مشابهة بل تكون مقدسة خالية من العيوب."]]}, {"l": "Col 1:22", "n": "", "vs": [[22, "قد صالحكم الآن في جسد بشرية (ابنه) بالموت. وذلك لكي يحضركم فتمثلوا أمامه وأنتم قديسون بلا ذنب ولا لوم."]]}, {"l": "Col 1:28", "n": "", "vs": [[28, "هذا السر نعلنه نحن، واعظين كل إنسان، ومعلمين كل إنسان، في كل حكمة، لكي نحضر كل إنسان كاملا في المسيح."]]}, {"l": "Col 3:4", "n": "", "vs": [[4, "فعندما يظهر المسيح، وهو حياتنا، عندئذ تظهرون أنتم أيضا معه في المجد."]]}, {"l": "Heb 13:20", "n": "", "vs": [[20, "وأسأل الله ، إله السلام الذي أقام من بين الأموات ربنا يسوع راعي الخراف العظيم بفضل دمه الذي ختم به العهد الأبدي"]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}], "kwAr": "المثول أمامه", "noteAr": ""}, {"kw": "faultless", "raw": "Rev_14:5", "note": "", "refs": [{"l": "Rev 14:5", "n": "", "vs": [[5, "لم تنطق أفواههم بالكذب، ولا عيب فيهم."]]}], "kwAr": "لا عيب فيكم", "noteAr": ""}, {"kw": "the presence", "raw": "Mat_16:27, Mat_19:28, Mat_25:31; Luk_9:26; 1Th_4:16, 1Th_4:17; 1Pe_4:13", "note": "", "refs": [{"l": "Mat 16:27", "n": "", "vs": [[27, "فإن ابن الإنسان سوف يعود في مجد أبيه مع ملائكته، فيجازي كل واحد حسب أعماله."]]}, {"l": "Mat 19:28", "n": "", "vs": [[28, "فأجابهم يسوع: «الحق أقول لكم: إنه عندما يجلس ابن الإنسان على عرش مجده في زمن التجديد، تجلسون أنتم الذين تبعتموني على اثني عشر عرشا لتدينوا أسباط إسرائيل الاثني عشر."]]}, {"l": "Mat 25:31", "n": "", "vs": [[31, "وعندما يعود ابن الإنسان في مجده ومعه جميع ملائكته، فإنه يجلس على عرش مجده،"]]}, {"l": "Luk 9:26", "n": "", "vs": [[26, "فإن من يستحي بي وبكلامي، فبه يستحي ابن الإنسان لدى عودته في مجده ومجد الآب والملائكة المقدسين."]]}, {"l": "1Th 4:16", "n": "", "vs": [[16, "لأن الرب نفسه سينزل من السماء حالما يدوي أمر بالتجمع، وينادي رئيس ملائكة، ويبوق في بوق إلهي، عندئذ يقوم الأموات في المسيح أولا."]]}, {"l": "1Th 4:17", "n": "", "vs": [[17, "ثم إننا، نحن الباقين أحياء، نختطف جميعا في السحب للاجتماع بالرب في الهواء. وهكذا نبقى مع الرب على الدوام."]]}, {"l": "1Pe 4:13", "n": "", "vs": [[13, "وإنما افرحوا: لأنكم كما تشاركون المسيح في الآلام الآن، لابد أن تفرحوا بمشاركته في الابتهاج عند ظهور مجده."]]}], "kwAr": "في المجد", "noteAr": ""}, {"kw": "exceeding", "raw": "Psa_21:6, Psa_43:4; Mat_5:12; 2Co_4:17; 1Pe_4:13", "note": "", "refs": [{"l": "Psa 21:6", "n": "", "vs": [[6, "لأنك جعلته أكثر المباركين إلى الأبد. تغمره بفيض الفرح في حضرتك."]]}, {"l": "Psa 43:4", "n": "", "vs": [[4, "فأقبل إلى مذبح الله، إلى الله فرحي وأسبحك بالعود ياإلهي."]]}, {"l": "Mat 5:12", "n": "", "vs": [[12, "افرحوا وتهللوا، فإن مكافأتكم في السماوات عظيمة. فإنهم هكذا اضطهدوا الأنبياء من قبلكم!"]]}, {"l": "2Co 4:17", "n": "", "vs": [[17, "ذلك لأن ما يضايقنا الآن من صعوبات بسيطة عابرة، ينتج لنا بمقدار لا يحد وزنة أبدية من المجد،"]]}, {"l": "1Pe 4:13", "n": "", "vs": [[13, "وإنما افرحوا: لأنكم كما تشاركون المسيح في الآلام الآن، لابد أن تفرحوا بمشاركته في الابتهاج عند ظهور مجده."]]}], "kwAr": "مبتهجين", "noteAr": ""}], "arS": [["وللقادر", ["G1410"]], [" أن ", []], ["يحرسكم", ["G5442", "G5209"]], [" من ", []], ["السقوط", ["G679"]], [" حتى يوصلكم إلى ", []], ["المثول", ["G2476"]], [" ", []], ["أمامه", ["G2714"]], [" في ", []], ["المجد", ["G1391"]], [" ", []], ["مبتهجين", ["G20"]], [" ", []], ["ولا عيب فيكم", ["G299"]], [" …", []]]}, {"c": 1, "v": 25, "text": "لله الواحد، مخلصنا بيسوع المسيح ربنا ... المجد والجلال والقدرة والسلطة، من قبل أن كان الزمان، والآن وطوال الأزمان آمين!", "groups": [{"kw": "the only", "raw": "Psa_104:24, Psa_147:5; Rom_11:33, Rom_16:27; Eph_1:8, Eph_3:10; 1Ti_1:17", "note": "", "refs": [{"l": "Psa 104:24", "n": "", "vs": [[24, "يارب ما أعظم أعمالك، كلها صنعت بحكمة، فامتلأت الأرض من غناك."]]}, {"l": "Psa 147:5", "n": "", "vs": [[5, "عظيم هو سيدنا، وفائقة هي قوته، ولا حد لحكمته."]]}, {"l": "Rom 11:33", "n": "", "vs": [[33, "فما أعمق غنى الله وحكمته وعلمه! ما أبعد أحكامه عن الفحص وطرقه عن التتبع !"]]}, {"l": "Rom 16:27", "n": "", "vs": [[27, "المجد لله إلى الأبد، الحكيم وحده، بيسوع المسيح. آمين!"]]}, {"l": "Eph 1:8", "n": "", "vs": [[8, "التي جعلها تفيض علينا مصحوبة بكل حكمة وفهم."]]}, {"l": "Eph 3:10", "n": "", "vs": [[10, "والغاية أن يتجلى الآن أمام الرئاسات والسلطات في الأماكن السماوية ما يظهر في الكنيسة من حكمة الله المتعددة الوجوه،"]]}, {"l": "1Ti 1:17", "n": "", "vs": [[17, "فللملك الأزلي، الله الواحد غير المنظور وغير الفاني، الكرامة والمجد إلى أبد الآبدين. آمين!"]]}], "kwAr": "الواحد", "noteAr": ""}, {"kw": "God", "raw": "Psa_78:20; Isa_12:2, Isa_45:21; Joh_4:22; 1Ti_2:3; Tit_1:3, Tit_1:4, Tit_2:10,Tit_2:13; Tit_3:4; 2Pe_1:1", "note": "", "refs": [{"l": "Psa 78:20", "n": "", "vs": [[20, "ها هو قد ضرب الصخرة فتفجرت منها المياه وفاضت الأنهار، فهل يقدر أيضا أن يقدم الخبز أو يوفر اللحم لشعبه؟"]]}, {"l": "Isa 12:2", "n": "", "vs": [[2, "ها إن الله خلاصي فأطمئن ولا أرتعد، لأن الرب الله هو قوتي وترنيمتي وقد أصبح لي خلاصا»."]]}, {"l": "Isa 45:21", "n": "", "vs": [[21, "أعلنوا، واعرضوا دعواكم. ليتشاوروا معا. من أنبأ بهذا منذ القدم، ومن أخبر به من زمن بعيد؟ ألست أنا الرب ولا إله غيري؟ بار ومخلص، وليس هناك آخر."]]}, {"l": "Joh 4:22", "n": "", "vs": [[22, "أنتم تعبدون ما تجهلون، ونحن نعبد ما نعلم، لأن الخلاص هو من عند اليهود."]]}, {"l": "1Ti 2:3", "n": "", "vs": [[3, "فإن هذا الأمر جيد ومقبول في نظر الله مخلصنا،"]]}, {"l": "Tit 1:3", "n": "", "vs": [[3, "ثم بين كلمته في أوانها المعين: بالبشارة التي وضعت أمانة بين يدي بموجب أمر مخلصنا الله …"]]}, {"l": "Tit 1:4", "n": "", "vs": [[4, "إلى تيطس، ولدي الحقيقي بالنسبة إلى الإيمان المشترك بيننا."]]}, {"l": "Tit 2:10", "n": "", "vs": [[10, "ولا سارقين، بل مظهرين أمانة كلية صالحة، لكي يزينوا في كل شيء تعليم مخلصنا الله."]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "Tit 3:4", "n": "", "vs": [[4, "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،"]]}, {"l": "2Pe 1:1", "n": "", "vs": [[1, "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"]]}], "kwAr": "مخلصنا", "noteAr": ""}, {"kw": "be glory", "raw": "1Ch_29:11; Psa_72:18, Psa_72:19; Dan_4:37; Mat_6:13; Eph_3:21; 1Pe_4:11; 1Pe_5:10,1Pe_5:11; 2Pe_3:18; Rev_1:6, Rev_4:9-11, Rev_5:13, Rev_5:14", "note": "", "refs": [{"l": "1Ch 29:11", "n": "", "vs": [[11, "لك يارب العظمة والسطوة والجلال والبهاء والمجد، لأن لك كل ما في السماء والأرض. أنت يارب صاحب الملك وقد تعاليت فوق رؤوس الجميع."]]}, {"l": "Psa 72:18", "n": "", "vs": [[18, "تبارك الرب إله إسرائيل، فهو وحده صانع العجائب."]]}, {"l": "Psa 72:19", "n": "", "vs": [[19, "تبارك اسمه المجيد إلى الأبد، ولتمتليء الأرض كلها من مجده. آمين ثم آمين."]]}, {"l": "Dan 4:37", "n": "", "vs": [[37, "فالآن، أنا نبوخذناصر، أسبح وأمجد وأحمد ملك السماء الذي جميع أعماله حق، وطرقه عادلة وقادر على إذلال كل من يسلك بالكبرياء."]]}, {"l": "Mat 6:13", "n": "", "vs": [[13, "ولا تدخلنا في تجربة، لكن نجنا من الشرير، لأن لك الملك والقوة والمجد إلى الأبد. آمين."]]}, {"l": "Eph 3:21", "n": "", "vs": [[21, "له المجد في الكنيسة، في المسيح يسوع، مدى الأجيال والدهور! آمين …"]]}, {"l": "1Pe 4:11", "n": "", "vs": [[11, "فمن يتكلم، عليه أن يتكلم بما يوافق أقوال الله؛ ومن يخدم، عليه أن يخدم بموجب القوة التي يمنحها الله . وذلك لكي يتمجد الله في كل شيء، بيسوع المسيح، له المجد والسلطة إلى أبد الآبدين. آمين!"]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}, {"l": "1Pe 5:11", "n": "", "vs": [[11, "له المجد والسلطة إلى أبد الآبدين. آمين!"]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}, {"l": "Rev 1:6", "n": "", "vs": [[6, "وجعل منا مملكة، وكهنة لله أبيه، له المجد والسلطان إلى أبد الآبدين. آمين!"]]}, {"l": "Rev 4:9-11", "n": "", "vs": [[9, "وكلما قدمت هذه الكائنات التمجيد والإجلال والحمد للجالس على العرش، الحي إلى أبد الآبدين،"], [10, "يجثو الشيوخ الأربعة والعشرون أمام الجالس على العرش ساجدين للحي إلى أبد الآبدين، ويلقون أكاليلهم أمام عرشه وهم يهتفون:"], [11, "«مستحق أنت ياربنا وإلهنا المجد والإجلال والقدرة، لأنك خلقت الأشياء كلها، وهي بإرادتك كائنة وقد خلقت!»"]]}, {"l": "Rev 5:13", "n": "", "vs": [[13, "ثم سمعت كل خليقة في السماء وعلى الأرض، وتحت الأرض، وعلى البحر، هاتفة مع كل ما فيها: «البركة والإجلال والمجد والسلطة للجالس على العرش وللحمل، إلى أبد الآبدين»."]]}, {"l": "Rev 5:14", "n": "", "vs": [[14, "فردت الكائنات الحية الأربعة: «آمين!» وجثا الشيوخ ساجدين."]]}], "kwAr": "المجد والجلال", "noteAr": ""}], "arS": [["لله", ["G2316"]], [" ", []], ["الواحد", ["G3441"]], ["، ", []], ["مخلصنا", ["G2257", "G4990"]], [" بيسوع المسيح ربنا ... ", []], ["المجد", ["G1391"]], [" ", []], ["والجلال", ["G3172"]], [" ", []], ["والقدرة", ["G2904"]], [" ", []], ["والسلطة", ["G1849"]], ["، من قبل أن كان الزمان، ", []], ["والآن", ["G3568"]], [" ", []], ["وطوال الأزمان", ["G1519", "G3956", "G165"]], [" ", []], ["آمين", ["G281"]], ["!", []]]}], "strong": true}];</script>
