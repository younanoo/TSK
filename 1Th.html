"noteAr": ""}, {"kw": "to please", "raw": "Rom_8:8, Rom_12:2; Eph_5:17; Col_1:10; Heb_11:6, Heb_13:16; 1Jo_3:22", "note": "", "refs": [{"l": "Rom 8:8", "n": "", "vs": [[8, "فالذين هم تحت سلطة الجسد لا يستطيعون أن يرضوا الله ."]]}, {"l": "Rom 12:2", "n": "", "vs": [[2, "ولا تتكيفوا مع هذا العالم، بل تغيروا بتجديد الذهن، لتميزوا ما هي إرادة الله الصالحة المقبولة الكاملة."]]}, {"l": "Eph 5:17", "n": "", "vs": [[17, "لذلك لا تكونوا أغبياء، بل افهموا ما هي مشيئة الرب."]]}, {"l": "Col 1:10", "n": "", "vs": [[10, "لكي تسلكوا سلوكا لائقا بالرب ومرضيا في كل شيء، منتجين الثمر في كل عمل صالح ونامين في معرفة الله إلى التمام،"]]}, {"l": "Heb 11:6", "n": "", "vs": [[6, "فمن المستحيل إرضاء الله بدون إيمان. إذ إن من يتقرب إلى الله، لابد له أن يؤمن بأنه موجود، وبأنه يكافيء الذين يسعون إليه."]]}, {"l": "Heb 13:16", "n": "", "vs": [[16, "ولا تغفلوا أيضا عن عمل الخير وإعانة المحتاجين: لأن مثل هذه «الذبائح» تسر الله جدا!"]]}, {"l": "1Jo 3:22", "n": "", "vs": [[22, "ومهما نطلب منه بالصلاة، نحصل عليه: لأننا نطيع ما يوصينا به، ونمارس الأعمال التي ترضيه."]]}], "kwAr": "سلوكا يرضي الله", "noteAr": ""}, {"kw": "so ye", "raw": "1Th_4:10; Job_17:9; Psa_92:14; Pro_4:18; Joh_15:2; 1Co_15:58; Phi_1:9, Phi_3:14; 2Th_1:3; 2Pe_1:5-10, 2Pe_3:18", "note": "", "refs": [{"l": "1Th 4:10", "n": "", "vs": [[10, "ولأنكم أيضا هكذا تعاملون جميع الإخوة في مقاطعة مقدونية كلها. وإنما نحرضكم، أيها الإخوة، أن تضاعفوا ذلك أكثر فأكثر،"]]}, {"l": "Job 17:9", "n": "", "vs": [[9, "أما الصديق فيتمسك بطريقه، ويزداد الطاهر اليدين قوة."]]}, {"l": "Psa 92:14", "n": "", "vs": [[14, "يثمرون أيضا في الشيخوخة، ويظلون موفوري العافية والنضرة"]]}, {"l": "Pro 4:18", "n": "", "vs": [[18, "أما سبيل الأبرار فكنور متلأليء يتزايد إشراقه إلى أن يكتمل النهار،"]]}, {"l": "Joh 15:2", "n": "", "vs": [[2, "كل غصن في لا ينتج ثمرا يقطعه؛ وكل غصن ينتج ثمرا ينقيه لينتج مزيدا من الثمر."]]}, {"l": "1Co 15:58", "n": "", "vs": [[58, "إذن، ياإخوتي الأحباء، كونوا راسخين غير متزحزحين، كثيري الاجتهاد في عمل الرب دائما، عالمين أن جهدكم في الرب ليس عبثا!"]]}, {"l": "Phi 1:9", "n": "", "vs": [[9, "وصلاتي لأجلكم هي هذه: أن تزداد محبتكم أكثر فأكثر في تمام المعرفة والإدراك،"]]}, {"l": "Phi 3:14", "n": "", "vs": [[14, "إذ أسعى إلى الهدف، لنوال تلك الجائزة التي يدعونا الله إليها دعوة عليا في المسيح يسوع."]]}, {"l": "2Th 1:3", "n": "", "vs": [[3, "من واجبنا أن نشكر الله على الدوام لأجلكم أيها الإخوة. كما أن هذا حق: لأن إيمانكم ينمو نموا فائقا، ومحبة أحدكم للآخر تفيض بينكم جميعا."]]}, {"l": "2Pe 1:5-10", "n": "", "vs": [[5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"], [6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"], [7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."], [8, "فحين تكون هذه الصفات الطيبة في داخلكم، وتزداد بوفرة، تجعلكم مجتهدين ومثمرين في معرفتكم لربنا يسوع المسيح."], [9, "أما الذي لا يملك هذه الصفات، فهو أعمى روحيا. إنه قصير البصر، قد نسي أنه تطهر من خطاياه القديمة!"], [10, "فأحرى بكم إذن، أيها الإخوة، أن تجتهدوا لتثبتوا عمليا أن الله قد دعاكم واختاركم حقا. فإنكم، إن فعلتم هذا، لن تسقطوا أبدا!"]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}], "kwAr": "أن تضاعفوا تقدمكم", "noteAr": ""}], "arS": [["وبعد", ["G3063"]], ["، أيها ", []], ["الإخوة", ["G80"]], ["، فمثلما ", []], ["تلقيتم", ["G3880"]], [" منا كيف ", []], ["يجب", ["G1163"]], [" أن ", []], ["تسلكوا", ["G4043"]], [" سلوكا ", []], ["يرضي", ["G700"]], [" ", []], ["الله", ["G2316"]], [" ، وكما أنتم فاعلون، ", []], ["نرجو", ["G2065"]], [" منكم ", []], ["ونحرضكم", ["G3870"]], [" في ", []], ["الرب", ["G2962"]], [" ", []], ["يسوع", ["G2424"]], [" أن ", []], ["تضاعفوا", ["G4052"]], [" تقدمكم في ذلك ", []], ["أكثر", ["G3123"]], [" فأكثر.", []]]}, {"c": 4, "v": 2, "text": "فإنكم تعرفون الوصايا التي لقناكم إياها من قبل الرب يسوع.", "groups": [{"kw": "", "raw": "Eze_3:17; Mat_28:20; 1Co_9:21; 2Th_3:6, 2Th_3:10", "note": "", "refs": [{"l": "Eze 3:17", "n": "", "vs": [[17, "«ياابن آدم، قد جعلتك رقيبا لشعب إسرائيل، فأصغ إلى كلمتي وأنذرهم بها على لساني."]]}, {"l": "Mat 28:20", "n": "", "vs": [[20, "وعلموهم أن يعملوا بكل ما أوصيتكم به. وها أنا معكم كل الأيام إلى انتهاء الزمان! »."]]}, {"l": "1Co 9:21", "n": "", "vs": [[21, "وللذين بلا شريعة كأني بلا شريعة مع أني لست بلا ناموس عند الله بل أنا خاضع لناموس من نحو المسيح حتى أكسب الذين هم بلا شريعة."]]}, {"l": "2Th 3:6", "n": "", "vs": [[6, "ثم نوصيكم، أيها الإخوة، باسم ربنا يسوع المسيح، أن تعتزلوا عن كل أخ يسلك سلوكا فوضويا، لا يوافق التعليم الذي تلقيتم منا."]]}, {"l": "2Th 3:10", "n": "", "vs": [[10, "فلما كنا عندكم، أوصيناكم بهذا المبدأ: إن كان أحد لا يريد أن يشتغل، فلا يأكل!"]]}], "kwAr": "", "noteAr": ""}], "arS": [["فإنكم ", []], ["تعرفون", ["G1492"]], [" ", []], ["الوصايا", ["G3852"]], [" التي ", []], ["لقناكم", ["G1325"]], [" إياها من قبل ", []], ["الرب", ["G2962"]], [" ", []], ["يسوع", ["G2424"]], [".", []]]}, {"c": 4, "v": 3, "text": "فإن مشيئة الله هي هذه: قداستكم. وذلك بأن تمتنعوا عن الزنى،", "groups": [{"kw": "this", "raw": "1Th_5:18; Psa_40:8, Psa_143:10; Mat_7:21, Mat_12:50; Mar_3:35; Joh_4:34, Joh_7:17; Rom_12:2; Eph_5:17, Eph_6:6; Col_1:9, Col_4:12; Heb_10:36, Heb_13:21; 1Pe_4:2; 1Jo_2:17", "note": "", "refs": [{"l": "1Th 5:18", "n": "", "vs": [[18, "ارفعوا الشكر في كل حال: فهذه هي مشيئة الله لكم في المسيح يسوع."]]}, {"l": "Psa 40:8", "n": "", "vs": [[8, "إن مسرتي أن أعمل مشيئتك الصالحة ياإلهي، وشريعتك في صميم قلبي."]]}, {"l": "Psa 143:10", "n": "", "vs": [[10, "علمني أن أعمل ما يرضيك لأنك أنت إلهي، وليهدني روحك الصالح إلى أرض مستوية."]]}, {"l": "Mat 7:21", "n": "", "vs": [[21, "ليس كل من يقول لي: يارب، يارب! يدخل ملكوت السماوات، بل من يعمل بإرادة أبي الذي في السماوات."]]}, {"l": "Mat 12:50", "n": "", "vs": [[50, "لأن كل من يعمل بإرادة أبي الذي في السماوات هو أخي وأختي وأمي ! »"]]}, {"l": "Mar 3:35", "n": "", "vs": [[35, "لأن من يعمل بإرادة الله هو أخي وأختي وأمي! »"]]}, {"l": "Joh 4:34", "n": "", "vs": [[34, "فقال لهم يسوع: «طعامي هو أن أعمل مشيئة الذي أرسلني وأن أنجز عمله."]]}, {"l": "Joh 7:17", "n": "", "vs": [[17, "ومن أراد أن يعمل مشيئة الله يعرف ما إذا كان تعليمي من عند الله، أو أنني أتكلم من عندي."]]}, {"l": "Rom 12:2", "n": "", "vs": [[2, "ولا تتكيفوا مع هذا العالم، بل تغيروا بتجديد الذهن، لتميزوا ما هي إرادة الله الصالحة المقبولة الكاملة."]]}, {"l": "Eph 5:17", "n": "", "vs": [[17, "لذلك لا تكونوا أغبياء، بل افهموا ما هي مشيئة الرب."]]}, {"l": "Eph 6:6", "n": "", "vs": [[6, "غير عاملين بجد فقط حين تكون عيونهم عليكم كمن يحاول إرضاء الناس، بل انطلاقا من كونكم عبيدا للمسيح،"]]}, {"l": "Col 1:9", "n": "", "vs": [[9, "لذلك نحن أيضا، من اليوم الذي فيه سمعنا بأخباركم، مازلنا نصلي ونتضرع لأجلكم، لأن تمتلئوا من تمام المعرفة لمشيئة الله في كل حكمة وإدراك روحي،"]]}, {"l": "Col 4:12", "n": "", "vs": [[12, "يسلم عليكم أبفراس الذي هو منكم، وهو عبد للمسيح يسوع، يجاهد كل حين لأجلكم في الصلوات لتثبتوا كاملين ولكم تمام اليقين من جهة مشيئة الله كلها."]]}, {"l": "Heb 10:36", "n": "", "vs": [[36, "إنكم تحتاجون إلى الصبر لتعملوا إرادة الله، فتنالوا البركة التي وعدتم بها."]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}, {"l": "1Pe 4:2", "n": "", "vs": [[2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."]]}, {"l": "1Jo 2:17", "n": "", "vs": [[17, "وسوف يزول العالم، وما فيه من شهوات أما الذي يعمل بإرادة الله، فيبقى إلى الأبد!"]]}], "kwAr": "مشيئة الله", "noteAr": ""}, {"kw": "your", "raw": "1Th_4:4, 1Th_5:23; Joh_17:17-19; Act_20:32, Act_26:18; Rom_6:22 *Gr: 1Co_1:30, 1Co_6:11; Eph_5:26, Eph_5:27; 2Th_2:13; Tit_2:14; 1Pe_1:2", "note": "", "refs": [{"l": "1Th 4:4", "n": "", "vs": [[4, "وأن يعرف كل واحد منكم كيف يحفظ جسده في الطهارة والكرامة"]]}, {"l": "1Th 5:23", "n": "", "vs": [[23, "وإله السلام نفسه يقدسكم إلى التمام ويحفظكم سالمين، روحا ونفسا وجسدا، لتكونوا بلا لوم عند عودة ربنا يسوع المسيح."]]}, {"l": "Joh 17:17-19", "n": "", "vs": [[17, "قدسهم بالحق؛ إن كلمتك هي الحق."], [18, "وكما أرسلتني أنت إلى العالم، أرسلتهم أنا أيضا إليه."], [19, "ومن أجلهم أنا أقدس ذاتي، ليتقدسوا هم أيضا في الحق."]]}, {"l": "Act 20:32", "n": "", "vs": [[32, "وا لآن أسلمكم إلى الله وإلى كلمة نعمته القادرة أن تبنيكم وتعطيكم ميراثا تشتركون فيه مع جميع المقدسين لله."]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "Rom 6:22", "n": "*Gr:", "vs": [[22, "أما الآن، وقد حررتم من الخطيئة وصرتم عبيدا لله، فإن لكم ثمركم للقداسة، والعاقبة هي الحياة الأبدية."]]}, {"l": "1Co 1:30", "n": "", "vs": [[30, "وبفضل الله صار لكم مقام في المسيح يسوع الذي جعل لنا حكمة من الله وبرا وقداسة وفداء،"]]}, {"l": "1Co 6:11", "n": "", "vs": [[11, "وهكذا كان بعضكم، إلا أنكم قد اغتسلتم، بل تقدستم، بل تبررتم، باسم الرب يسوع المسيح وبروح إلهنا."]]}, {"l": "Eph 5:26", "n": "", "vs": [[26, "لكي يقدسها مطهرا إياها بغسل الماء، بالكلمة،"]]}, {"l": "Eph 5:27", "n": "", "vs": [[27, "حتى يزفها إلى نفسه كنيسة بهية لا يشوبها عيب أو تجعد أو أية نقيصة مشابهة بل تكون مقدسة خالية من العيوب."]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "1Pe 1:2", "n": "", "vs": [[2, "بحسب علمه السابق ثم قدسهم بالروح ليطيعوا يسوع المسيح ويطهروا برش دمه عليهم."]]}], "kwAr": "قداستكم", "noteAr": ""}, {"kw": "that", "raw": "Mat_15:19; Act_15:20,Act_15:29; Rom_1:29; 1Co_5:9-11, 1Co_6:9, 1Co_6:10,1Co_6:13-18, 1Co_7:2; 2Co_12:21; Gal_5:19; Eph_5:3-5; Col_3:5; Heb_12:16, Heb_13:4; Rev_21:8, Rev_22:15 *Gr.", "note": "", "refs": [{"l": "Mat 15:19", "n": "", "vs": [[19, "فمن القلب تنبع الأفكار الشريرة، القتل، الزنى، الفسق، السرقة، شهادة الزور، التجديف."]]}, {"l": "Act 15:20", "n": "", "vs": [[20, "بل نكتب إليهم رسالة نوصيهم فيها بأن يمتنعوا عن الأكل من الذبائح النجسة المقربة للأصنام، وعن ارتكاب الزنى، وعن تناول لحوم الحيوانات المخنوقة، وعن الدم."]]}, {"l": "Act 15:29", "n": "", "vs": [[29, "إنما عليكم أن تمتنعوا عن الأكل من الذبائح المقربة للأصنام، وعن تناول الدم ولحوم الحيوانات المخنوقة، وعن ارتكاب الزنى. وتحسنون عملا إن حفظتم أنفسكم من هذه الأمور. عافاكم الله !»"]]}, {"l": "Rom 1:29", "n": "", "vs": [[29, "إذ قد امتلأوا من كل إثم وشر وجشع وخبث، وشحنوا حسدا وقتلا وخصاما ومكرا وسوءا. وهم ثرثارون،"]]}, {"l": "1Co 5:9-11", "n": "", "vs": [[9, "كتبت إليكم في رسالتي أن لا تعاشروا الزناة."], [10, "فلا أعني زناة هذا العالم أو الطماعين أو السراقين أو عابدي الأصنام على وجه الإطلاق، وإلا كنتم مضطرين إلى الخروج من المجتمع البشري!"], [11, "أما الآن فقد كتبت إليكم بأن لا تعاشروا من يسمى أخا إن كان زانيا أو طماعا أو عابد أصنام أو شتاما أو سكيرا أو سراقا. فمثل هذا لا تعاشروه ولا تجلسوا معه لتناول الطعام."]]}, {"l": "1Co 6:9", "n": "", "vs": [[9, "أما تعلمون أن الظالمين لن يرثوا ملكوت الله؟ لا تضلوا: فإن ملكوت الله لن يرثه الزناة ولا عابدو الأصنام ولا الفاسقون ولا المتخنثون ولا مضاجعو الذكور"]]}, {"l": "1Co 6:10", "n": "", "vs": [[10, "ولا السراقون ولا الطماعون ولا السكيرون ولا الشتامون ولا المغتصبون."]]}, {"l": "1Co 6:13-18", "n": "", "vs": [[13, "الطعام للبطن، والبطن للطعام؛ ولكن الله سيبيد هذا وذاك. غير أن الجسد ليس للزنى، بل للرب؛ والرب للجسد."], [14, "والله قد أقام الرب من الموت، وسيقيمنا نحن أيضا بقدرته!"], [15, "أما تعلمون أن أجسادكم هي أعضاء المسيح؟ فهل يجوز أن آخذ أعضاء المسيح وأجعلها أعضاء زانية؟ حاشا!"], [16, "أوما تعلمون أن من اقترن بزانية صار معها جسدا واحدا؟ فإنه يقول: «إن الاثنين يصيران جسدا واحدا»."], [17, "وأما من اقترن بالرب، فقد صار معه روحا واحدا!"], [18, "اهربوا من الزنا! فكل خطيئة يرتكبها الإنسان هي خارجة عن جسده، وأما من يرتكب الزنا، فهو يسيء إلى جسده الخاص."]]}, {"l": "1Co 7:2", "n": "", "vs": [[2, "ولكن، تجنبا للزنا، ليكن لكل رجل زوجته، ولكل امرأة زوجها."]]}, {"l": "2Co 12:21", "n": "", "vs": [[21, "وأخشى أن يجعلني إلهي ذليلا بينكم عند مجيئي إليكم مرة أخرى، فيكون حزني شديدا على كثيرين من الذين أخطأوا قبلا ولم يتوبوا عما ارتكبوا من دنس وزنى وفسق!"]]}, {"l": "Gal 5:19", "n": "", "vs": [[19, "أما أعمال الجسد فظاهرة، وهي: الزنى والنجاسة والدعارة،"]]}, {"l": "Eph 5:3-5", "n": "", "vs": [[3, "أما الزنى، وكل نجاسة أو شهوة نهمة، فلا يذكر بينكم حتى اسمها، كما يليق بالقديسين."], [4, "وكذلك البذاءة والكلام السفيه والهزل، فهي غير لائقة. وإنما أحرى بكم أن تلهجوا بالشكر لله!"], [5, "فإنكم تعلمون هذا جيدا: أن كل زان أو نجس أو صاحب شهوة نهمة، ما هو إلا عابد أصنام، ليس له ميراث في ملكوت المسيح والله."]]}, {"l": "Col 3:5", "n": "", "vs": [[5, "فأميتوا إذن أعضاءكم الأرضية: الزنى، النجاسة، جموح العاطفة، الشهوة الرديئة، والاشتهاء النهم الذي هو عبادة أصنام."]]}, {"l": "Heb 12:16", "n": "", "vs": [[16, "وحذار أن يكون بينكم زان أو مستهتر مثل عيسو الذي باع حقوقه بوصفه الابن البكر، لقاء أكلة واحدة."]]}, {"l": "Heb 13:4", "n": "", "vs": [[4, "حافظوا جميعا على كرامة الزواج، مبعدين النجاسة عن الفراش. فإن الله سوف يعاقب الذين ينغمسون في خطايا الدعارة والزنى."]]}, {"l": "Rev 21:8", "n": "", "vs": [[8, "أما الجبناء وغير المؤمنين، والفاسدون والقاتلون والزناة، والمتصلون بالشياطين وعبدة الأصنام وجميع الدجالين، فمصيرهم إلى البحيرة المتقدة بالنار والكبريت، الذي هو الموت الثاني»."]]}, {"l": "Rev 22:15", "n": "*Gr.", "vs": [[15, "أما في خارج المدينة، فهنالك الكلاب والمتصلون بالشياطين، والزناة والقتلة، وعبدة الأصنام والدجالون ومحبو التدجيل!"]]}], "kwAr": "بأن تمتنعوا عن الزنى", "noteAr": ""}], "arS": [["فإن ", []], ["مشيئة", ["G2307"]], [" ", []], ["الله", ["G2316"]], [" هي هذه: ", []], ["قداستكم", ["G38", "G5216"]], [". وذلك بأن ", []], ["تمتنعوا", ["G567"]], [" عن ", []], ["الزنى", ["G4202"]], ["،", []]]}, {"c": 4, "v": 4, "text": "وأن يعرف كل واحد منكم كيف يحفظ جسده في الطهارة والكرامة", "groups": [{"kw": "should", "raw": "Rom_6:19, Rom_12:1; 1Co_6:15, 1Co_6:18-20", "note": "", "refs": [{"l": "Rom 6:19", "n": "", "vs": [[19, "أتكلم بشريا هنا بسبب ضعفكم البشري. فكما قدمتم سابقا أعضاءكم عبيدا للنجاسة والإثم في خدمة الإثم، كذلك قدموا الآن أعضاءكم عبيدا للبر في خدمة القداسة."]]}, {"l": "Rom 12:1", "n": "", "vs": [[1, "لذلك أتوسل إليكم أيها الإخوة، نظرا لمراحم الله، أن تقدموا له أجسادكم ذبيحة مقدسة مقبولة عنده، وهي عبادتكم بعقل."]]}, {"l": "1Co 6:15", "n": "", "vs": [[15, "أما تعلمون أن أجسادكم هي أعضاء المسيح؟ فهل يجوز أن آخذ أعضاء المسيح وأجعلها أعضاء زانية؟ حاشا!"]]}, {"l": "1Co 6:18-20", "n": "", "vs": [[18, "اهربوا من الزنا! فكل خطيئة يرتكبها الإنسان هي خارجة عن جسده، وأما من يرتكب الزنا، فهو يسيء إلى جسده الخاص."], [19, "أما تعلمون أن جسدكم هو هيكل للروح القدس الساكن فيكم والذي هو لكم من الله، وأنكم أنتم لستم ملكا لأنفسكم؟"], [20, "لأنكم قد اشتريتم بفدية. إذن، مجدوا الله في أجسادكم."]]}], "kwAr": "وأن يعرف كل واحد منكم", "noteAr": ""}, {"kw": "his", "raw": "1Sa_21:5; Act_9:15; Rom_9:21-23; 2Ti_2:20,2Ti_2:21; 1Pe_3:7", "note": "", "refs": [{"l": "1Sa 21:5", "n": "", "vs": [[5, "فقال داود للكاهن: «إن النساء قد منعن عنا منذ أمس وما قبل، كما هي العادة عند خروجي في مهمة، أما أمتعتهم فهي دائما طاهرة، حتى في أثناء تنفيذ المهمات العادية. فكم بالحري إن كانت المهمة مقدسة؟»"]]}, {"l": "Act 9:15", "n": "", "vs": [[15, "فأمره الرب: «اذهب! فقد اخترت هذا الرجل ليكون إناء يحمل اسمي إلى الأمم والملوك وبني إسرائيل."]]}, {"l": "Rom 9:21-23", "n": "", "vs": [[21, "أوليس لصانع الفخار سلطة على الطين ليصنع من كتلة واحدة وعاء للاستعمال الرفيع وآخر للاستعمال الوضيع؟"], [22, "فماذا إذا إن كان الله ، وقد شاء أن يظهر غضبه ويعلن قدرته، احتمل بكل صبر أوعية غضب جاهزة للهلاك،"], [23, "وذلك بقصد أن يعلن غنى مجده في أوعية الرحمة التي سبق فأعدها للمجد،"]]}, {"l": "2Ti 2:20", "n": "", "vs": [[20, "وإنما، في بيت كبير، لا تكون الأواني كلها من الذهب والفضة وحسب، بل يكون بعضها من الخشب والفخار أيضا. كما يكون بعضها للاستعمال الرفيع، وبعضها للاستعمال الوضيع."]]}, {"l": "2Ti 2:21", "n": "", "vs": [[21, "إذن الذي ينفصل عن هذه الأخيرة، مطهرا نفسه، يكون إناء للاستعمال الرفيع، مقدسا، نافعا لرب البيت، متأهبا لكل عمل صالح."]]}, {"l": "1Pe 3:7", "n": "", "vs": [[7, "وأنتم، أيها الأزواج، إذ تساكنون زوجاتكم عالمين بأنهن أضعف منكم، أكرموهن باعتبارهن شريكات لكم في وراثة نعمة الحياة، لكي لا يعوق صلواتكم شيء."]]}], "kwAr": "يحفظ جسده", "noteAr": ""}, {"kw": "honour", "raw": "Phi_4:8; Heb_13:4", "note": "", "refs": [{"l": "Phi 4:8", "n": "", "vs": [[8, "وختاما، أيها الإخوة: كل ما كان حقا، وكل ما كان شريفا، وكل ما كان عادلا، وكل ما كان طاهرا وكل ما كان مستحبا، وكل ما كان حسن السمعة، وكل ما كان فيه فضيلة وخصلة حميدة، فاشغلوا أفكاركم به."]]}, {"l": "Heb 13:4", "n": "", "vs": [[4, "حافظوا جميعا على كرامة الزواج، مبعدين النجاسة عن الفراش. فإن الله سوف يعاقب الذين ينغمسون في خطايا الدعارة والزنى."]]}], "kwAr": "والكرامة", "noteAr": ""}], "arS": [["وأن ", []], ["يعرف", ["G1492"]], [" ", []], ["كل واحد", ["G1538"]], [" منكم كيف ", []], ["يحفظ", ["G2932"]], [" ", []], ["جسده", ["G4632"]], [" في ", []], ["الطهارة", ["G38"]], [" ", []], ["والكرامة", ["G5092"]]]}, {"c": 4, "v": 5, "text": "غير منساق للشهوة الجامحة كالوثنيين الذين لا يعرفون الله ،", "groups": [{"kw": "in the", "raw": "Rom_1:24, Rom_1:26; Col_3:5", "note": "", "refs": [{"l": "Rom 1:24", "n": "", "vs": [[24, "لذلك أسلمهم الله ، في شهوات قلوبهم، إلى النجاسة، ليهينوا أجسادهم فيما بينهم."]]}, {"l": "Rom 1:26", "n": "", "vs": [[26, "لهذا السبب أسلمهم الله إلى الشهوات المخزية. فإن إناثهم تحولن عن استعمال أجسادهن بالطريقة الطبيعية إلى استعمالها بطريقة مخالفة للطبيعة."]]}, {"l": "Col 3:5", "n": "", "vs": [[5, "فأميتوا إذن أعضاءكم الأرضية: الزنى، النجاسة، جموح العاطفة، الشهوة الرديئة، والاشتهاء النهم الذي هو عبادة أصنام."]]}], "kwAr": "غير منساق للشهوة الجامحة", "noteAr": ""}, {"kw": "as the", "raw": "Mat_6:32; Luk_12:30; Eph_4:17-19; 1Pe_4:3", "note": "", "refs": [{"l": "Mat 6:32", "n": "", "vs": [[32, "فهذه الحاجات كلها تسعى إليها الأمم. فإن أباكم السماوي يعلم حاجتكم إلى هذه كلها."]]}, {"l": "Luk 12:30", "n": "", "vs": [[30, "فهذه الحاجات كلها تسعى إليها أمم العالم، وأبوكم يعلم أنكم تحتاجون إليها."]]}, {"l": "Eph 4:17-19", "n": "", "vs": [[17, "أقول هذا إذن، وأشهد في الرب، راجيا ألا تسلكوا فيما بعد كما يسلك الأمم في عقم ذهنهم،"], [18, "لكونهم مظلمي البصيرة ومتغربين عن حياة الله بسبب ما فيهم من جهل وقساوة قلب."], [19, "فهؤلاء، إذ طرحوا جانبا كل إحساس، استسلموا للإباحية ليرتكبوا كل نجاسة بشهوة نهمة لا ترتوي."]]}, {"l": "1Pe 4:3", "n": "", "vs": [[3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}], "kwAr": "كالوثنيين", "noteAr": ""}, {"kw": "know", "raw": "Act_17:23, Act_17:30,Act_17:31; Rom_1:28; 1Co_1:21, 1Co_15:34; Gal_4:8; Eph_2:12; 2Th_1:8", "note": "", "refs": [{"l": "Act 17:23", "n": "", "vs": [[23, "فبينما كنت أتجول في مدينتكم وأنظر إلى معابدكم وجدت معبدا مكتوبا عليه «إلى الإله المجهول». فبهذا الإله الذي تعبدونه ولا تعرفونه، أنا أبشركم."]]}, {"l": "Act 17:30", "n": "", "vs": [[30, "فالله الآن يدعو جميع الناس في كل مكان أن يرجعوا إليه تائبين، وقد غض النظر عن أزمنة الجهل التي مرت،"]]}, {"l": "Act 17:31", "n": "", "vs": [[31, "لأنه حدد يوما يدين فيه العالم بالعدل على يد رجل اختاره لذلك. وقد قدم للجميع برهانا، إذ أقامه من بين الأموات»."]]}, {"l": "Rom 1:28", "n": "", "vs": [[28, "وبما أنهم لم يتخيروا إبقاء الله ضمن معرفتهم، أسلمهم الله إلى ذهن عاطل عن التمييز دفعهم إلى ممارسة الأمور غير اللائقة."]]}, {"l": "1Co 1:21", "n": "", "vs": [[21, "فبما أن العالم، في حكمة الله، لم يعرف الله عن طريق الحكمة، فقد سر الله أن يخلص بجهالة البشارة الذين يؤمنون."]]}, {"l": "1Co 15:34", "n": "", "vs": [[34, "عودوا إلى الصواب كما يجب ولا تخطئوا، فإن بعضا منكم يجهلون الله تماما أقول هذا لكي تخجلوا!"]]}, {"l": "Gal 4:8", "n": "", "vs": [[8, "ولكن، لما كنتم في ذلك الحين لا تعرفون الله ، كنتم في حال العبودية."]]}, {"l": "Eph 2:12", "n": "", "vs": [[12, "أنكم كنتم في ذلك الحين بلا مسيح، أجانب عن جماعة إسرائيل، وغرباء عن العهود الموعودة، لا رجاء لكم، ومنكرين لله في العالم."]]}, {"l": "2Th 1:8", "n": "", "vs": [[8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."]]}], "kwAr": "الذين لا يعرفون الله", "noteAr": ""}], "arS": [["غير منساق ", []], ["للشهوة", ["G3806"]], [" ", []], ["الجامحة", ["G1939"]], [" ", []], ["كالوثنيين", ["G1484"]], [" الذين لا ", []], ["يعرفون", ["G1492"]], [" ", []], ["الله", ["G2316"]], [" ،", []]]}, {"c": 4, "v": 6, "text": "وألا يتعدى حقوق أخيه ويسيء إليه في هذا الأمر، لأن الرب هو المنتقم لجميع هذه الإساءات، كما أنذرناكم قبلا وشهدنا لكم بحق.", "groups": [{"kw": "go", "raw": "Exo_20:15, Exo_20:17; Lev_19:11, Lev_19:13; Deu_24:7, Deu_25:13-16; Pro_11:1, Pro_16:11, Pro_20:14; Pro_20:23, Pro_28:24; Isa_5:7, Isa_59:4-7; Jer_9:4; Eze_22:13, Eze_45:9-14; Amo_8:5, Amo_8:6; Zep_3:5; Mal_3:5; Mar_10:19; 1Co_6:7-9; Eph_4:28; Jam_5:4", "note": "", "refs": [{"l": "Exo 20:15", "n": "", "vs": [[15, "لا تسرق."]]}, {"l": "Exo 20:17", "n": "", "vs": [[17, "لا تشته بيت جارك، ولا زوجته، ولا عبده، ولا أمته، ولا ثوره، ولا حماره، ولا شيئا مما له»."]]}, {"l": "Lev 19:11", "n": "", "vs": [[11, "لا تسرق، ولا تكذب، ولا تغدر بصاحبك،"]]}, {"l": "Lev 19:13", "n": "", "vs": [[13, "لا تظلم قريبك، ولا تسلب ولا ترجيء دفع أجرة أجيرك إلى الغد."]]}, {"l": "Deu 24:7", "n": "", "vs": [[7, "إذا خطف رجل أحدا من بني إسرائيل إخوته واسترقه وباعه، يموت الخاطف. فتجتثون الشر من بينكم."]]}, {"l": "Deu 25:13-16", "n": "", "vs": [[13, "لا تحتفظ في كيسك بمعيارين مختلفين كبير وصغير،"], [14, "ولا يكن لك في بيتك مكيالان مختلفان كبير وصغير،"], [15, "بل لتكن أوزانك ومكاييلك صحيحة لا غش فيها، لتطول أيامك على الأرض التي يهبها لك الرب إلهك،"], [16, "لأن كل من غش في المكاييل أو الأوزان يصبح مكروها لدى الرب إلهكم."]]}, {"l": "Pro 11:1", "n": "", "vs": [[1, "الميزان المغشوش رجس لدى الرب، والمكيال الوافي يحوز رضاه."]]}, {"l": "Pro 16:11", "n": "", "vs": [[11, "للرب ميزان العدل وقسطاسه، وجميع معايير كيس التاجر من صنعه."]]}, {"l": "Pro 20:14", "n": "", "vs": [[14, "يقول المشتري: هذه بضاعة رديئة! هذه بضاعة رديئة! وإذا مضى بها في حال سبيله يشرع في الافتخار."]]}, {"l": "Pro 20:23", "n": "", "vs": [[23, "التلاعب بالمعايير رجس عند الرب، وميزان الغش أمر رديء."]]}, {"l": "Pro 28:24", "n": "", "vs": [[24, "من يسلب أباه وأمه قائلا: ليس في هذا إثم، هو شريك الهادم."]]}, {"l": "Isa 5:7", "n": "", "vs": [[7, "لأن كرم الرب القدير هو بيت إسرائيل، ورجال يهوذا هم غرس بهجته. ولكن عندما انتظر حقا وجد سفك دماء، وعندما التمس عدلا رأى صراخا."]]}, {"l": "Isa 59:4-7", "n": "", "vs": [[4, "ليس بينكم من يطالب بالعدل، أو يحكم بالحق. يتكلون على الباطل ويتفوهون بالزور، يحبلون بالغش، ويلدون بالإثم."], [5, "يفقسون بيض أفعى، وينسجون خيوط العنكبوت. من يأكل من بيضهم يموت، ومن البيضة المكسورة تخرج حية."], [6, "لا تصلح خيوطهم لنسيج الثياب، ولا يكتسون بأعمالهم، لأن أعمالهم هي أعمال إثم، وأفعال الظلم قد ارتكبتها أيديهم."], [7, "تسرع أرجلهم لاقتراف الشر، ويهرولون لسفك دم البريء، أفكارهم أفكار أثيمة، وفي طرقهم دمار وخراب"]]}, {"l": "Jer 9:4", "n": "", "vs": [[4, "«ليحترس كل واحد من جاره، ولا يثق بأحد من أقربائه، لأن كل قريب مخادع، وكل صاحب واش."]]}, {"l": "Eze 22:13", "n": "", "vs": [[13, "ها أنا قد صفقت بكفي من جراء ما حصلت عليه من ربح حرام، وما سفك من دم في وسطك."]]}, {"l": "Eze 45:9-14", "n": "", "vs": [[9, "وهذا ما يعلنه السيد الرب، حسبكم يارؤساء إسرائيل، توقفوا عن الظلم والاغتصاب، واحكموا بالحق والإنصاف، وكفوا عن ظلم شعبي يقول السيد الرب."], [10, "لتكن لكم موازين عادلة وإيفة حق وبث حق."], [11, "فتكون الإيفة والبث متساويتين في المقدار، وتسع كل منهما عشر الحومر. ويكون الحومر هو المكيال المعتمد."], [12, "ويكون الشاقل معادلا لعشرين جيرة، فتكون قيمة الخمسة شواقل خمسة شواقل، وقيمة العشرة شواقل عشرة شواقل، وقيمة المن خمسين شاقلا."], [13, "وهذه هي التقدمة التي تقدمونها: سدس الإيفة من الحنطة (نحو ثلاثة لترات وثلثي اللتر) لقاء كل حومر حنطة وسدس الإيفة من الشعير لقاء كل حومر شعير"], [14, "أما فريضة الزيت فتقدمون بثا لقاء كل كر، والكر يساوي حومرا، وهو يعادل عشرة أبثاث أيضا."]]}, {"l": "Amo 8:5", "n": "", "vs": [[5, "قائلين: «متى ينقضي أول الشهر حتى نبيع الحنطة؟ متى يمضي السبت لنعرض القمح في السوق، فنعمد إلى تصغير حجم مكيال الإيفة ونرفع الأسعار، ونستعمل ميزانا مغشوشا."]]}, {"l": "Amo 8:6", "n": "", "vs": [[6, "لنشتري المسكين بقطعة من الفضة، والبائس بنعلين، ونبيع نفاية القمح؟»"]]}, {"l": "Zep 3:5", "n": "", "vs": [[5, "ولكن الرب ما برح صديقا في وسطها، لا يرتكب خطأ، ويبدي في كل صباح عدله وفي كل فجر حقه. لا يخفق قط؛ أما الأثيم فلا يعرف ما هو الخزي."]]}, {"l": "Mal 3:5", "n": "", "vs": [[5, "وأقترب منكم لأكون شاهدا سريعا ضد السحرة والزناة والحالفين بالزور والمستغلين لأجرة العامل ومضطهدي الأرامل والأيتام، والذين يظلمون الغرباء ولا يخافونني"]]}, {"l": "Mar 10:19", "n": "", "vs": [[19, "أنت تعرف الوصايا: لا تقتل؛ لا تزن؛ لا تسرق؛ لا تشهد بالزور؛ لا تظلم؛ أكرم أباك وأمك!»"]]}, {"l": "1Co 6:7-9", "n": "", "vs": [[7, "والواقع أنه من العيب على الإطلاق أن يقاضي بعضكم بعضا. أما كان أحر ى بكم أن تحتملوا الظلم وأحرى بكم أن تتقبلوا السلب؟"], [8, "ولكنكم أنتم تظلمون وتسلبون حتى إخوتكم."], [9, "أما تعلمون أن الظالمين لن يرثوا ملكوت الله؟ لا تضلوا: فإن ملكوت الله لن يرثه الزناة ولا عابدو الأصنام ولا الفاسقون ولا المتخنثون ولا مضاجعو الذكور"]]}, {"l": "Eph 4:28", "n": "", "vs": [[28, "ومن كان سارقا، فلا يسرق في ما بعد، بل بالأحرى ليكد ويستخدم يديه في عمل شريف ليكون عنده ما يشارك فيه المحتاجين."]]}, {"l": "Jam 5:4", "n": "", "vs": [[4, "وهذه أجرة العمال الذين حصدوا حقولكم، تلك الأجرة التي مازلتم تحبسونها عنهم ظلما، إنها تصرخ، وصراخ أولئك العمال أنفسهم قد سمعه رب الجنود!"]]}], "kwAr": "وألا يتعدى", "noteAr": ""}, {"kw": "defraud", "raw": "or, oppress, or, over-reach, Lev_25:14, Lev_25:17; 1Sa_12:3, 1Sa_12:4; Pro_22:22; Jer_7:6; Mic_2:2; Zep_3:1; Jam_2:6", "note": "or, oppress, or, over-reach, Lev_25:14, Lev_25:17; 1Sa_12:3, 1Sa_12:4; Pro_22:22; Jer_7:6; Mic_2:2; Zep_3:1; Jam_2:6", "refs": [{"l": "Lev 25:14", "n": "", "vs": [[14, "فإن بعت مواطنك، أو اشتريت منه، فلا تظلمه."]]}, {"l": "Lev 25:17", "n": "", "vs": [[17, "فلا يظلمن أحد صاحبه، بل اتق إلهك، لأني أنا الرب إلهكم."]]}, {"l": "1Sa 12:3", "n": "", "vs": [[3, "فاشهدوا علي في حضرة الرب، وأمام ملكه المختار، إن كنت قد أخذت ثورا أو حمارا من أحد، أو ظلمت أو جرت على أحد أو قبلت رشوة من أحد لأغمض عيني عنه، فأعوض ذلك عليكم»."]]}, {"l": "1Sa 12:4", "n": "", "vs": [[4, "فأجابوه:«لم تظلمنا ولم تجر علينا ولا أخذت شيئا من أحد»."]]}, {"l": "Pro 22:22", "n": "", "vs": [[22, "لا تسلب الفقير لأنه فقير، ولا تسحق البائس الماثل عند الباب،"]]}, {"l": "Jer 7:6", "n": "", "vs": [[6, "إن لم تجوروا على الغريب واليتيم والأرملة، ولم تسفكوا دما بريئا في هذا الموضع، وإن لم تضلوا وراء الأوثان مسيئين بذلك لأنفسكم،"]]}, {"l": "Mic 2:2", "n": "", "vs": [[2, "يشتهون حقولا ويغتصبونها، وبيوتا فيستولون عليها. يجورون على الرجل وعلى بيته والإنسان وميراثه."]]}, {"l": "Zep 3:1", "n": "", "vs": [[1, "ويل للمدينة الظالمة المتمردة الدنسة،"]]}, {"l": "Jam 2:6", "n": "", "vs": [[6, "ولكنكم أنتم عاملتم الفقير معاملة مهينة. ألا تعرفون أن الأغنياء هم الذين يتسلطون عليكم ويجرونكم إلى المحاكم،"]]}], "kwAr": "ويسيء إليه", "noteAr": "أو: يظلم، أو: يطمع (يستغل)."}, {"kw": "in any matter", "raw": "or, in the matter", "note": "or, in the matter", "refs": [], "kwAr": "في هذا الأمر", "noteAr": "أو: في هذا الأمر."}, {"kw": "the Lord", "raw": "Deu_32:35; Job_31:13, Job_31:14; Psa_94:1, Psa_140:12; Pro_22:22, Pro_22:23; Ecc_5:8; Isa_1:23, Isa_1:24; Rom_1:18, Rom_12:19; Eph_5:6; 2Th_1:8", "note": "", "refs": [{"l": "Deu 32:35", "n": "", "vs": [[35, "لي النقمة وأنا أجازي. وفي الوقت المعين تزل أقدامهم فيوم هلاكهم بات وشيكا، ومصيرهم المحتوم يسرع إليهم،"]]}, {"l": "Job 31:13", "n": "", "vs": [[13, "إن كنت قد تنكرت لحق خادمي وأمتي عندما اشتكيا علي،"]]}, {"l": "Job 31:14", "n": "", "vs": [[14, "فماذا أصنع عندما يقوم الله (لمحاكمتي)؟ وبماذا أجيب عندما يتقصى (ليحاسبني)؟"]]}, {"l": "Psa 94:1", "n": "", "vs": [[1, "يارب أنت إله الانتقام، فتجل بغضبك."]]}, {"l": "Psa 140:12", "n": "", "vs": [[12, "قد علمت أن الرب ينصف دعوى المساكين ويحكم بالحق للمحتاجين."]]}, {"l": "Pro 22:22", "n": "", "vs": [[22, "لا تسلب الفقير لأنه فقير، ولا تسحق البائس الماثل عند الباب،"]]}, {"l": "Pro 22:23", "n": "", "vs": [[23, "لأن الرب يدافع عن دعواهم، ويهلك ناهبيهم."]]}, {"l": "Ecc 5:8", "n": "", "vs": [[8, "إن شهدت في البلاد الفقير مظلوما، والحق والعدل مزهوقين فلا تعجب من الأمر، فإن فوق المسئول الكبير مسئولا أعلى منه رتبة يراقبه وفوقهما من هو أعظم مقاما منهما."]]}, {"l": "Isa 1:23", "n": "", "vs": [[23, "أصبح رؤساؤك عصاة وشركاء لصوص، يولعون بالرشوة ويسعون وراء الهبات، لا يدافعون عن اليتيم، ولا ترفع إليهم دعوى الأرملة»."]]}, {"l": "Isa 1:24", "n": "", "vs": [[24, "لذلك يقول السيد رب الجنود، عزيز إسرائيل: «لأستريحن من مقاومي ولأنتقمن من أعدائي."]]}, {"l": "Rom 1:18", "n": "", "vs": [[18, "فإنه قد أعلن غضب الله من السماء على جميع ما يفعله الناس من عصيان وإثم فيحجبون الحق بالإثم."]]}, {"l": "Rom 12:19", "n": "", "vs": [[19, "لا تنتقموا لأنفسكم، أيها الأحباء، بل دعوا الغضب لله، لأنه قد كتب: «لي الانتقام، أنا أجازي، يقول الرب»."]]}, {"l": "Eph 5:6", "n": "", "vs": [[6, "لا يخدعكم أحد بكلام باطل! فبسبب هذه الأمور يحل غضب الله على أبناء العصيان."]]}, {"l": "2Th 1:8", "n": "", "vs": [[8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."]]}], "kwAr": "الرب هو المنتقم", "noteAr": ""}, {"kw": "as we", "raw": "Luk_12:5; Gal_5:21; Eph_4:17", "note": "", "refs": [{"l": "Luk 12:5", "n": "", "vs": [[5, "ولكني أريكم ممن تخافون: خافوا من القادر أن يلقي في جهنم بعد القتل. نعم، أقول لكم، من هذا خافوا!"]]}, {"l": "Gal 5:21", "n": "", "vs": [[21, "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!"]]}, {"l": "Eph 4:17", "n": "", "vs": [[17, "أقول هذا إذن، وأشهد في الرب، راجيا ألا تسلكوا فيما بعد كما يسلك الأمم في عقم ذهنهم،"]]}], "kwAr": "كما أنذرناكم قبلا", "noteAr": ""}], "arS": [["وألا ", []], ["يتعدى", ["G5233"]], [" حقوق ", []], ["أخيه", ["G80"]], [" ", []], ["ويسيء", ["G4122"]], [" إليه في هذا ", []], ["الأمر", ["G4229"]], ["، لأن ", []], ["الرب", ["G2962"]], [" هو ", []], ["المنتقم", ["G1558"]], [" ", []], ["لجميع", ["G3956"]], [" هذه الإساءات، كما ", []], ["أنذرناكم", ["G4277"]], [" قبلا ", []], ["وشهدنا", ["G1263"]], [" لكم بحق.", []]]}, {"c": 4, "v": 7, "text": "فإن الله دعانا لا إلى النجاسة بل (إلى العيش( في القداسة.", "groups": [{"kw": "God", "raw": "Lev_11:44, Lev_19:2; Rom_1:7, Rom_8:29, Rom_8:30; 1Co_1:2; Eph_1:4, Eph_2:10, Eph_4:1; 2Th_2:13, 2Th_2:14; 2Ti_1:9; Heb_12:14; 1Pe_1:14-16, 1Pe_2:9-12, 1Pe_2:21, 1Pe_2:22", "note": "", "refs": [{"l": "Lev 11:44", "n": "", "vs": [[44, "أنا الرب إلهكم، فكرسوا أنفسكم وتقدسوا، لأني أنا قدوس، ولا تنجسوا أنفسكم بشيء من الدبيب المتحرك على الأرض."]]}, {"l": "Lev 19:2", "n": "", "vs": [[2, "«قل لبني إسرائيل: كونوا قديسين لأني أنا الرب إلهكم قدوس."]]}, {"l": "Rom 1:7", "n": "", "vs": [[7, "إلى جميع من هم في روما من أحباء الله القديسين المدعوين. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}, {"l": "Rom 8:29", "n": "", "vs": [[29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."]]}, {"l": "Rom 8:30", "n": "", "vs": [[30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."]]}, {"l": "1Co 1:2", "n": "", "vs": [[2, "إلى كنيسة الله في مدينة كورنثوس، إلى الذين تقدسوا في المسيح يسوع، المدعوين، القديسين؛ وإلى جميع الذين يدعون باسم ربنا يسوع المسيح في كل مكان ربا لهم ولنا."]]}, {"l": "Eph 1:4", "n": "", "vs": [[4, "كما كان قد اختارنا فيه قبل تأسيس العالم، لنكون قديسين بلا لوم أمامه."]]}, {"l": "Eph 2:10", "n": "", "vs": [[10, "فإننا نحن تحفة الله، وقد خلقنا في المسيح يسوع لأعمال صالحة أعدها سلفا لنسلك فيها."]]}, {"l": "Eph 4:1", "n": "", "vs": [[1, "... إذن، أنا السجين في الرب، أناشدكم أن تسلكوا سلوكا يليق بالدعوة التي إليها دعيتم،"]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "2Th 2:14", "n": "", "vs": [[14, "فإلى هذا الأمر قد دعاكم ببشارتنا لكم، لنوال مجد ربنا يسوع المسيح."]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،"]]}, {"l": "Heb 12:14", "n": "", "vs": [[14, "اجعلوا هدفكم أن تسالموا جميع الناس، وتعيشوا حياة مقدسة. فبغير قداسة، لا يقدر أحد أن يرى الرب."]]}, {"l": "1Pe 1:14-16", "n": "", "vs": [[14, "وبما أنكم صرتم أولادا لله مطيعين له، فلا تعودوا إلى مجاراة الشهوات التي كانت تسيطر عليكم سابقا في أيام جهلكم."], [15, "وإنما اسلكوا سلوكا مقدسا في كل أمر، مقتدين بالقدوس الذي دعاكم،"], [16, "لأنه قد كتب: «كونوا قديسين، لأني أنا قدوس!»"]]}, {"l": "1Pe 2:9-12", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"], [10, "فإنكم في الماضي لم تكونوا شعبا؛ أما الآن، فأنتم «شعب الله وقد كنتم سابقا لا تتمتعون برحمة الله، أما الآن، فإنكم تتمتعون بها!»"], [11, "أيها الأحباء، ما أنتم إلا غرباء تزورون الأرض زيارة عابرة. لذلك أطلب إليكم أن تبتعدوا عن الشهوات الجسدية التي تصارع النفس."], [12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالحة يمجدون الله في يوم الافتقاد."]]}, {"l": "1Pe 2:21", "n": "", "vs": [[21, "لأن الله دعاكم إلى الاشتراك في هذا النوع من الآلام. فالمسيح، الذي تألم لأجلكم، هو القدوة التي تقتدون بها. فسيروا على آثار خطواته:"]]}, {"l": "1Pe 2:22", "n": "", "vs": [[22, "إنه لم يفعل خطيئة واحدة، ولا كان في فمه مكر."]]}], "kwAr": "فإن الله دعانا", "noteAr": ""}, {"kw": "uncleanness", "raw": "1Th_2:3; Gal_5:19; Eph_4:19; 2Pe_2:10", "note": "", "refs": [{"l": "1Th 2:3", "n": "", "vs": [[3, "فما كان وعظنا صادرا عن ضلال ولا عن نجاسة، ولا خالطه مكر،"]]}, {"l": "Gal 5:19", "n": "", "vs": [[19, "أما أعمال الجسد فظاهرة، وهي: الزنى والنجاسة والدعارة،"]]}, {"l": "Eph 4:19", "n": "", "vs": [[19, "فهؤلاء، إذ طرحوا جانبا كل إحساس، استسلموا للإباحية ليرتكبوا كل نجاسة بشهوة نهمة لا ترتوي."]]}, {"l": "2Pe 2:10", "n": "", "vs": [[10, "وما أشد العقاب، وبخاصة على الذين ينجرفون وراء الميول الجسدية، مستجيبين لشهوة النجاسة، ومحتقرين سيادة الله! ثم إنهم وقحون، معجبون بأنفسهم، لا يخافون أن يتكلموا بالشتم والإهانة على أصحاب الأمجاد."]]}], "kwAr": "لا إلى النجاسة", "noteAr": ""}], "arS": [["فإن ", []], ["الله", ["G2316"]], [" ", []], ["دعانا", ["G2564"]], [" لا إلى ", []], ["النجاسة", ["G167"]], [" بل (إلى العيش( في ", []], ["القداسة", ["G38"]], [".", []]]}, {"c": 4, "v": 8, "text": "إذن، من استخف بأخيه في هذا الأمر، يستخف لا بإنسان بل بالله، بذاك الذي وهبكم فعلا روحه القدوس.", "groups": [{"kw": "despiseth", "raw": "or, rejecteth, 1Sa_8:7, 1Sa_10:19; Joh_12:48", "note": "or, rejecteth, 1Sa_8:7, 1Sa_10:19; Joh_12:48", "refs": [{"l": "1Sa 8:7", "n": "", "vs": [[7, "فقال الرب له: «لب للشعب طلبه وانزل عند رغبتهم، لأنهم لم يرفضوك أنت بل إياي رفضوا، لكي لا أملك عليهم."]]}, {"l": "1Sa 10:19", "n": "", "vs": [[19, "ولكنكم اليوم تنكرتم لإلهكم، مخلصكم من جميع المسيئين إليكم ومن مضايقيكم، وقلتم له: نصب علينا ملكا. والآن امثلوا أمام الرب حسب أسباطكم وعشائركم»."]]}, {"l": "Joh 12:48", "n": "", "vs": [[48, "فالذي يرفضني ولا يقبل كلامي، له من يحكم عليه: فإن الكلمة التي قلتها هي تحكم عليه في اليوم الأخير؛"]]}], "kwAr": "من استخف", "noteAr": "أو: يرفض."}, {"kw": "despiseth not", "raw": "Pro_1:7, Pro_23:9; Isa_49:7, Isa_53:10; Luk_10:16; Act_13:41; Jud_1:8", "note": "", "refs": [{"l": "Pro 1:7", "n": "", "vs": [[7, "فإن مخافة الرب هي رأس المعرفة، أما الحمقى فيستهينون بالحكمة والتأديب."]]}, {"l": "Pro 23:9", "n": "", "vs": [[9, "لا تتكلم في مسامع الجاهل لأنه يزدري بحكمة أقوالك."]]}, {"l": "Isa 49:7", "n": "", "vs": [[7, "وهذا ما يقوله الرب فادي إسرائيل وقدوسه لمن صار محتقرا ومرذولا لدى الأمم وعبدا للمتسلطين: يراك الملوك وينهضون، ويسجد لك الرؤساء من أجل الرب الأمين، قدوس إسرائيل الذي اصطفاك."]]}, {"l": "Isa 53:10", "n": "", "vs": [[10, "ومع ذلك فقد سر الله أن يسحقه بالحزن. وحين يقدم نفسه ذبيحة إثم فإنه يرى نسله وتطول أيامه، وتفلح مسرة الرب على يده."]]}, {"l": "Luk 10:16", "n": "", "vs": [[16, "من يسمع لكم يسمع لي، ومن يرفضكم يرفضني؛ ومن يرفضني يرفض الذي أرسلني! »"]]}, {"l": "Act 13:41", "n": "", "vs": [[41, "انظروا أيها المتهاونون، وتعجبوا واهلكوا! فإني أعمل في أيامكم عملا لو حدثكم به أحد لما صدقتم!»‍"]]}, {"l": "Jud 1:8", "n": "", "vs": [[8, "ومع ذلك، فإن أولئك المعلمين المتوهمين يسيرون في الطريق التي سار فيها أهل تلك المدن. إذ يلوثون أجسادهم بالنجاسة، ويحتقرون السيادة الإلهية، ويتكلمون بالإهانة على الكائنات المجيدة!"]]}], "kwAr": "يستخف لا بإنسان", "noteAr": ""}, {"kw": "who", "raw": "Neh_9:30; Act_5:3, Act_5:4; 1Co_2:10, 1Co_7:40; 1Pe_1:12; 2Pe_1:21; 1Jo_3:24", "note": "", "refs": [{"l": "Neh 9:30", "n": "", "vs": [[30, "لقد تحملتهم سنين كثيرة، وحذرتهم بروحك على لسان أنبيائك فلم يصغوا، فأسلمتهم لعبودية أمم البلاد."]]}, {"l": "Act 5:3", "n": "", "vs": [[3, "فقال له بطرس: «ياحنانيا، لماذا سمحت للشيطان أن يملأ قلبك، فكذبت على الروح القدس، واحتفظت لنفسك بجزء من ثمن الحقل؟"]]}, {"l": "Act 5:4", "n": "", "vs": [[4, "أما كان بقي لك لو لم تبعه؟ وبعد بيعه أما كان لك حق الاحتفاظ بثمنه؟ لماذا قصدت في قلبك أن تغش؟ إنك لم تكذب على الناس، بل على الله!»"]]}, {"l": "1Co 2:10", "n": "", "vs": [[10, "ولكن الله كشف لنا ذلك بالروح. فإن الروح يتقصى كل شيء، حتى أعماق الله."]]}, {"l": "1Co 7:40", "n": "", "vs": [[40, "ولكنها، برأيي، تكون أسعد إذا بقيت على حالها، وأظن أن عندي، أنا أيضا، روح الله!"]]}, {"l": "1Pe 1:12", "n": "", "vs": [[12, "ولكن الله أوحى إليهم أن اجتهادهم لم يكن لمصلحتهم هم، بل لمصلحتكم أنتم. فقد كان ذلك من أجل البشارة التي نقلها إليكم في الزمان الحاضر مبشرون يؤيدهم الروح القدس المرسل من السماء. ويالها من أمور يتمنى حتى الملائكة أن يطلعوا عليها!"]]}, {"l": "2Pe 1:21", "n": "", "vs": [[21, "إذ لم تأت نبوءة قط بإرادة بشرية، بل تكلم بالنبوآت جميعا رجال الله غالقديسونف مدفوعين بوحي الروح القدس."]]}, {"l": "1Jo 3:24", "n": "", "vs": [[24, "وكل من يطيع وصايا الله، فإنه يثبت في الله، والله يثبت فيه. والذي يؤكد لنا أن الله يثبت فينا، هو الروح القدس الذي وهبه لنا."]]}], "kwAr": "الذي وهبكم فعلا روحه القدوس", "noteAr": ""}], "arS": [["إذن، من ", []], ["استخف", ["G114"]], [" بأخيه في هذا الأمر، ", []], ["يستخف", ["G114"]], [" لا ", []], ["بإنسان", ["G444"]], [" بل ", []], ["بالله", ["G2316"]], ["، بذاك الذي ", []], ["وهبكم", ["G1325"]], [" فعلا ", []], ["روحه", ["G4151"]], [" ", []], ["القدوس", ["G40"]], [".", []]]}, {"c": 4, "v": 9, "text": "أما المحبة الأخوية، فلستم في حاجة لأن أكتب إليكم عنها، لأنكم بأنفسكم قد تعلمتم من الله أن تحبوا بعضكم بعضا،", "groups": [{"kw": "touching", "raw": "Lev_19:8; Psa_133:1; Joh_13:34, Joh_13:35, Joh_15:12-17; Act_4:32; Rom_12:10; Eph_5:1, Eph_5:2; Heb_13:1; 1Pe_3:8; 2Pe_1:7; 1Jo_2:10, 1Jo_3:11, 1Jo_3:14-19, 1Jo_3:23; 1Jo_4:7-16", "note": "", "refs": [{"l": "Lev 19:8", "n": "", "vs": [[8, "والآكل منها يعاقب بذنبه لأنه قد دنس قدس الرب فتستأصل تلك النفس من بين شعبها."]]}, {"l": "Psa 133:1", "n": "", "vs": [[1, "ما أحسن وما أبهج أن يسكن الإخوة معا (بوئام)."]]}, {"l": "Joh 13:34", "n": "", "vs": [[34, "وصية جديدة أنا أعطيكم: أحبوا بعضكم بعضا، كما أحببتكم أنا، تحبون بعضكم."]]}, {"l": "Joh 13:35", "n": "", "vs": [[35, "بهذا يعرف الجميع أنكم تلاميذي: إن كنتم تحبون بعضكم بعضا»."]]}, {"l": "Joh 15:12-17", "n": "", "vs": [[12, "وصيتي لكم هي هذه: أن يحب بعضكم بعضا كما أنا أحببتكم."], [13, "ليس لأحد محبة أعظم من هذه: أن يبذل أحد حياته فدى أحبائه."], [14, "وأنتم أحبائي إن عملتم بما أوصيكم به."], [15, "لا أسميكم عبيدا بعد، لأن العبد لا يطلعه سيده على ما يفعله. ولكني قد سميتكم أحباء لأني أطلعتكم على كل ما سمعته من أبي."], [16, "ليس أنتم اخترتموني، بل أنا اخترتكم وعينتكم لتنطلقوا وتنتجوا ثمرا ويدوم ثمركم، فيعطيكم الآب كل ما تطلبونه باسمي."], [17, "فبهذا أوصيكم إذن: أن تحبوا بعضكم بعضا."]]}, {"l": "Act 4:32", "n": "", "vs": [[32, "وكانت جماعة المؤمنين قلبا واحدا ونفسا واحدة، ولم يكن أحد يقول إن شيئا مما عنده هو له وحده، بل كان كل شيء عندهم مشتركا."]]}, {"l": "Rom 12:10", "n": "", "vs": [[10, "أحبوا بعضكم بعضا محبة أخوية، مفضلين بعضكم على بعض في الكرامة."]]}, {"l": "Eph 5:1", "n": "", "vs": [[1, "فاقتدوا إذن بالله كأولاد أحباء،"]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "Heb 13:1", "n": "", "vs": [[1, "اثبتوا على المحبة الأخوية."]]}, {"l": "1Pe 3:8", "n": "", "vs": [[8, "والخلاصة، كونوا جميعا متحدين في الرأي، متعاطفين بعضكم مع بعض، مبادلين أحدكم الآخر المحبة الأخوية، شفوقين، متواضعين."]]}, {"l": "2Pe 1:7", "n": "", "vs": [[7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."]]}, {"l": "1Jo 2:10", "n": "", "vs": [[10, "فالذي يحب إخوته، هو الذي يحيا في النور فعلا ولا شيء يسقطه."]]}, {"l": "1Jo 3:11", "n": "", "vs": [[11, "فالوصية التي سمعتموها منذ البداية، هي أن يحب بعضنا بعضا،"]]}, {"l": "1Jo 3:14-19", "n": "", "vs": [[14, "إن محبتنا لإخوتنا تبين لنا أننا انتقلنا من الموت إلى الحياة. فالذي لا يحب إخوته، فهو باق في الموت."], [15, "وكل من يبغض أخا له، فهو قاتل. وأنتم تعرفون أن القاتل لا تكون له حياة أبدية ثابتة فيه."], [16, "ومقياس المحبة هو العمل الذي قام به المسيح إذ بذل حياته لأجلنا. فعلينا نحن أيضا أن نبذل حياتنا لأجل إخوتنا."], [17, "وأما الذي يملك مالا يمكنه من العيش في بحبوحة، ويقسي قلبه على أحد الإخوة المحتاجين، فكيف تكون محبة الله متأصلة فيه؟"], [18, "أيها الأولاد الصغار، لا يجب أن تكون محبتنا مجرد ادعاء بالكلام واللسان، بل تكون محبة عملية حقة."], [19, "عندئذ نتأكد أننا نتصرف بحسب الحق، وتطمئن نفوسنا في حضرة الله،"]]}, {"l": "1Jo 3:23", "n": "", "vs": [[23, "وأما وصيته فهي أن نؤمن باسم ابنه يسوع المسيح، وأن يحب بعضنا بعضا كما أوصانا."]]}, {"l": "1Jo 4:7-16", "n": "", "vs": [[7, "أيها الأحباء، لنحب بعضنا بعضا: لأن المحبة تصدر من الله. إذن، كل من يحب، يكون مولودا من الله ويعرف الله ."], [8, "أما من لا يحب، فهو لم يتعرف بالله قط لأن الله محبة!"], [9, "وقد أظهر الله محبته لنا إذ أرسل ابنه الأوحد إلى العالم لكي نحيا به."], [10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."], [11, "ومادام الله قد أحبنا هذه المحبة العظيمة، أيها الأحباء، فعلينا نحن أيضا أن نحب بعضنا بعضا."], [12, "إن الله لم يره أحد من الناس قط. ولكن، حين نحب بعضنا بعضا، نبين أن الله يحيا في داخلنا، وأن محبته قد اكتملت في داخلنا."], [13, "وما يؤكد لنا أننا نثبت في الله، وأنه يثبت فينا هو أنه وهب لنا من روحه."], [14, "ونحن أنفسنا نشهد أن الآب قد أرسل الابن مخلصا للعالم، لأننا رأيناه بعيوننا."], [15, "من يعترف بأن يسوع هو ابن الله، فإن الله يثبت فيه، وهو يثبت في الله،"], [16, "ونحن أنفسنا اختبرنا المحبة التي خصنا الله بها، ووضعنا ثقتنا فيها. إن الله محبة. ومن يثبت في المحبة، فإنه يثبت في الله، والله يثبت فيه."]]}], "kwAr": "أما المحبة الأخوية", "noteAr": ""}, {"kw": "ye need", "raw": "1Th_5:1; Jer_31:34; Heb_8:10,Heb_8:11; 1Jo_2:20-27", "note": "", "refs": [{"l": "1Th 5:1", "n": "", "vs": [[1, "أما مسألة الأزمنة والأوقات المحددة، فلستم في حاجة لأن يكتب إليكم فيها."]]}, {"l": "Jer 31:34", "n": "", "vs": [[34, "ولا يحض في ما بعد كل واحد قريبه قائلا: اعرف الرب إلهك لأنهم جميعا سيعرفونني، من صغيرهم إلى كبيرهم، لأني سأصفح عن إثمهم ولن أذكر خطاياهم من بعد»."]]}, {"l": "Heb 8:10", "n": "", "vs": [[10, "فهذا هو العهد الذي أبرمه مع بني إسرائيل، بعد تلك الأيام، يقول الرب: أضع شرائعي داخل ضمائرهم، وأكتبها على قلوبهم، وأكون لهم إلها، وهم يكونون لي شعبا."]]}, {"l": "Heb 8:11", "n": "", "vs": [[11, "بعد ذلك، لا يعلم أحد منهم ابن وطنه ولا أخاه قائلا: تعرف بالرب! ذلك لأن الجميع سوف يعرفونني حق المعرفة، من الصغير فيهم إلى العظيم."]]}, {"l": "1Jo 2:20-27", "n": "", "vs": [[20, "أما أنتم فلكم مسحة من القدوس، وجميعكم تعرفون الحق."], [21, "فأنا أكتب إليكم ليس لأنكم لا تعرفون الحق، بل لأنكم تعرفونه وتدركون أن كل ما هو كذب لا يأتي من الحق."], [22, "ومن هو الكذاب؟ إنه الذي ينكر أن يسوع هو المسيح حقا. إنه ضد للمسيح ينكر الآب والابن معا."], [23, "وكل من ينكر الابن، لا يكون الآب أيضا من نصيبه. ومن يعترف بالابن، فله الآب أيضا."], [24, "أما أنتم، فالكلام الذي سمعتموه منذ البداية، فليكن راسخا فيكم. فحين يترسخ ذلك الكلام في داخلكم، تتوطد صلتكم بالابن، وبالآب."], [25, "فإن الله نفسه قد وعدنا بالحياة الأبدية."], [26, "كتبت إليكم هذا مشيرا إلى الذين يحاولون أن يضللوكم."], [27, "أما أنتم فقد نلتم من الله مسحة تبقى فيكم دائما. ولذلك، لستم بحاجة إلى من يعلمكم الحق. فتلك المسحة عينها هي التي تعلمكم كل شيء. وهي حق وليست كذبا. فكما علمتكم اثبتوا في المسيح."]]}], "kwAr": "فلستم في حاجة", "noteAr": ""}, {"kw": "for ye", "raw": "Isa_51:13; Mat_22:39; Joh_6:44, Joh_6:45, Joh_13:34, Joh_14:26, Joh_15:12, Joh_15:17; Eph_5:2; Heb_10:16; 1Pe_4:8; 1Jo_3:11, 1Jo_3:23, 1Jo_4:21, 1Jo_5:1", "note": "", "refs": [{"l": "Isa 51:13", "n": "", "vs": [[13, "ونسيت الرب صانعك، باسط السماوات ومرسي قواعد الأرض فتظل في رعب دائم من غضب المضايق حين يوطد العزم على التدمير؟ أين هو غضب المضايق؟"]]}, {"l": "Mat 22:39", "n": "", "vs": [[39, "والثانية مثلها: أحب قريبك كنفسك!"]]}, {"l": "Joh 6:44", "n": "", "vs": [[44, "لا يقدر أحد أن يأتي إلي إلا إذا اجتذبه الآب الذي أرسلني. وأنا أقيمه في اليوم الأخير."]]}, {"l": "Joh 6:45", "n": "", "vs": [[45, "جاء في كتب الأنبياء: سيتعلم الجميع من الله. وكل من يسمع الآب ويتعلم منه يأتي إلي."]]}, {"l": "Joh 13:34", "n": "", "vs": [[34, "وصية جديدة أنا أعطيكم: أحبوا بعضكم بعضا، كما أحببتكم أنا، تحبون بعضكم."]]}, {"l": "Joh 14:26", "n": "", "vs": [[26, "وأما الروح القدس، المعين الذي سيرسله الآب باسمي، فإنه يعلمكم كل شيء، ويذكركم بكل ما قلته لكم."]]}, {"l": "Joh 15:12", "n": "", "vs": [[12, "وصيتي لكم هي هذه: أن يحب بعضكم بعضا كما أنا أحببتكم."]]}, {"l": "Joh 15:17", "n": "", "vs": [[17, "فبهذا أوصيكم إذن: أن تحبوا بعضكم بعضا."]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "Heb 10:16", "n": "", "vs": [[16, "«هذا هو العهد الذي أبرمه معهم بعد تلك الأيام، يقول الرب: أضع شرائعي في داخل قلوبهم، وأكتبها في عقولهم»."]]}, {"l": "1Pe 4:8", "n": "", "vs": [[8, "لكن أهم شيء هو أن تبادلوا بعضكم بعضا المحبة الشديدة. لأن المحبة تستر إساءات كثيرة."]]}, {"l": "1Jo 3:11", "n": "", "vs": [[11, "فالوصية التي سمعتموها منذ البداية، هي أن يحب بعضنا بعضا،"]]}, {"l": "1Jo 3:23", "n": "", "vs": [[23, "وأما وصيته فهي أن نؤمن باسم ابنه يسوع المسيح، وأن يحب بعضنا بعضا كما أوصانا."]]}, {"l": "1Jo 4:21", "n": "", "vs": [[21, "فهذه الوصية جاءتنا من المسيح نفسه: من يحب الله ، يحب أخاه!"]]}, {"l": "1Jo 5:1", "n": "", "vs": [[1, "كل من يؤمن حقا أن يسوع هو المسيح، فهو مولود من الله. ومن يحب الوالد، فلابد أن يحب المولودين منه أيضا."]]}], "kwAr": "قد تعلمتم من الله", "noteAr": ""}], "arS": [["أما ", []], ["المحبة الأخوية", ["G5360"]], ["، فلستم في ", []], ["حاجة", ["G2192", "G5532"]], [" لأن ", []], ["أكتب", ["G1125"]], [" إليكم عنها، لأنكم بأنفسكم قد ", []], ["تعلمتم من الله", ["G2312"]], [" أن ", []], ["تحبوا", ["G25"]], [" ", []], ["بعضكم بعضا", ["G240"]], ["،", []]]}, {"c": 4, "v": 10, "text": "ولأنكم أيضا هكذا تعاملون جميع الإخوة في مقاطعة مقدونية كلها. وإنما نحرضكم، أيها الإخوة، أن تضاعفوا ذلك أكثر فأكثر،", "groups": [{"kw": "all the", "raw": "1Th_1:7; 2Co_8:1, 2Co_8:2, 2Co_8:8-10; Eph_1:15; Col_1:4; 2Th_1:3; Phm_1:5-7", "note": "", "refs": [{"l": "1Th 1:7", "n": "", "vs": [[7, "حتى إنكم صرتم مثالا لجميع المؤمنين المقيمين في مقاطعتي مقدونية وأخائية."]]}, {"l": "2Co 8:1", "n": "", "vs": [[1, "والآن، نعرفكم، أيها الإخوة، بنعمة الله الموهوبة في كنائس مقاطعة مقدونية."]]}, {"l": "2Co 8:2", "n": "", "vs": [[2, "فمع أنهم كانوا في تجربة ضيقة شديدة، فإن فرحهم الوافر مع فقرهم الشديد فاضا فأنتجا منهم سخاء غنيا."]]}, {"l": "2Co 8:8-10", "n": "", "vs": [[8, "لا أقول هذا على سبيل الأمر، بل اختبارا لصدق محبتكم بحماسة الآخرين."], [9, "فأنتم تعرفون نعمة ربنا يسوع المسيح: فمن أجلكم افتقر، وهو الغني لكي تغتنوا أنتم بفقره."], [10, "وأنا أبدي لكم رأيي في الموضوع. فإن هذا نافع لكم أنتم الذين سبق أن بدأتم منذ السنة الماضية لا أن تفعلوا فقط بل أن ترغبوا أيضا:"]]}, {"l": "Eph 1:15", "n": "", "vs": [[15, "لذلك أنا أيضا، وقد سمعت بما فيكم من الإيمان بالرب يسوع والمحبة لجميع القديسين،"]]}, {"l": "Col 1:4", "n": "", "vs": [[4, "إذ بلغنا خبر إيمانكم بالمسيح يسوع والمحبة التي لكم نحو جميع القديسين،"]]}, {"l": "2Th 1:3", "n": "", "vs": [[3, "من واجبنا أن نشكر الله على الدوام لأجلكم أيها الإخوة. كما أن هذا حق: لأن إيمانكم ينمو نموا فائقا، ومحبة أحدكم للآخر تفيض بينكم جميعا."]]}, {"l": "Phm 1:5-7", "n": "", "vs": [[5, "وقد سمعت بما لك من محبة وأمانة من نحو الرب يسوع، ومن نحو جميع القديسين،"], [6, "طالبا أن يكون اشتراكك معنا في الإيمان فعالا، فتدرك إلى التمام ما فينا من كل صلاح لأجل المسيح."], [7, "فقد كان لي أيها الأخ، سرور عظيم وتشجيع، بفضل محبتك، لأن عواطف القديسين قد انتعشت بفضلك!"]]}], "kwAr": "جميع الإخوة", "noteAr": ""}, {"kw": "that ye", "raw": "1Th_4:1, 1Th_3:12; Phi_1:9, Phi_3:13-15; 2Pe_3:18", "note": "", "refs": [{"l": "1Th 4:1", "n": "", "vs": [[1, "وبعد، أيها الإخوة، فمثلما تلقيتم منا كيف يجب أن تسلكوا سلوكا يرضي الله ، وكما أنتم فاعلون، نرجو منكم ونحرضكم في الرب يسوع أن تضاعفوا تقدمكم في ذلك أكثر فأكثر."]]}, {"l": "1Th 3:12", "n": "", "vs": [[12, "وليجعلكم الرب تنمون وتفيضون في المحبة لتحبوا بعضكم بعضا وجميع الناس كمحبتنا لكم،"]]}, {"l": "Phi 1:9", "n": "", "vs": [[9, "وصلاتي لأجلكم هي هذه: أن تزداد محبتكم أكثر فأكثر في تمام المعرفة والإدراك،"]]}, {"l": "Phi 3:13-15", "n": "", "vs": [[13, "أيها الإخوة، أنا لا أعتبر نفسي قد نلت الجائزة، ولكني أفعل أمرا واحدا: أنسى ما هو وراء وأتقدم إلى ما هو أمام،"], [14, "إذ أسعى إلى الهدف، لنوال تلك الجائزة التي يدعونا الله إليها دعوة عليا في المسيح يسوع."], [15, "جميع البالغين فينا، ليكن فيهم هذا الفكر. وإن كان فيكم غير هذا الفكر، فذلك أيضا سيكشفه لكم الله ."]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}], "kwAr": "أن تضاعفوا ذلك", "noteAr": ""}], "arS": [["ولأنكم أيضا هكذا تعاملون ", []], ["جميع", ["G3956"]], [" ", []], ["الإخوة", ["G80"]], [" في مقاطعة ", []], ["مقدونية", ["G3109"]], [" ", []], ["كلها", ["G3650"]], [". وإنما ", []], ["نحرضكم", ["G3870"]], ["، أيها ", []], ["الإخوة", ["G80"]], ["، أن ", []], ["تضاعفوا", ["G4052"]], [" ذلك ", []], ["أكثر", ["G3123"]], [" فأكثر،", []]]}, {"c": 4, "v": 11, "text": "وأن تسعوا بجد إلى العيش بهدوء، مهتمين بممارسة شؤونكم الخاصة، ومحصلين معيشتكم بعمل أيديكم، كما أوصيناكم.", "groups": [{"kw": "that", "raw": "Pro_17:1; Ecc_4:6; Lam_3:26; 2Th_3:12; 1Ti_2:2; 1Pe_3:4", "note": "", "refs": [{"l": "Pro 17:1", "n": "", "vs": [[1, "لقمة خبز جافة مصحوبة بالسلام خير من بيت مليء بذبائح ويسوده الخصام."]]}, {"l": "Ecc 4:6", "n": "", "vs": [[6, "حفنة راحة خير من حفنتي تعب وملاحقة الريح."]]}, {"l": "Lam 3:26", "n": "", "vs": [[26, "خير للمرء أن ينتظر بصمت خلاص الرب."]]}, {"l": "2Th 3:12", "n": "", "vs": [[12, "فمثل هؤلاء نوصيهم ونناشدهم، في الرب يسوع المسيح، أن يكسبوا معيشتهم بأنفسهم، مشتغلين بهدوء."]]}, {"l": "1Ti 2:2", "n": "", "vs": [[2, "ولأجل الملوك وأصحاب السلطة، لكي نعيش حياة مطمئنة هادئة كلية التقوى والرصانة."]]}, {"l": "1Pe 3:4", "n": "", "vs": [[4, "وإنما لتعتمد الزينة الداخلية، ليكون قلبها متزينا بروح الوداعة والهدوء. هذه هي الزينة التي لا تفنى، وهي غالية الثمن في نظر الله!"]]}], "kwAr": "وأن تسعوا بجد", "noteAr": ""}, {"kw": "study", "raw": "Rom_15:20; 2Co_5:9 *Gr.", "note": "", "refs": [{"l": "Rom 15:20", "n": "", "vs": [[20, "وكنت حريصا على التبشير حيث لم يكن قد عرف اسم المسيح، لكي لا أبني على أساس وضعه غيري،"]]}, {"l": "2Co 5:9", "n": "*Gr.", "vs": [[9, "ولذلك أيضا نحرص أن نرضيه، سواء أكنا مقيمين أم مغتربين."]]}], "kwAr": "العيش بهدوء", "noteAr": ""}, {"kw": "and to do", "raw": "Mar_13:34; Luk_12:42, Luk_12:43; Rom_12:4-8; Col_3:22-24; 2Th_3:11; 1Ti_5:13; Tit_2:4-10; 1Pe_4:10,1Pe_4:11, 1Pe_4:15", "note": "", "refs": [{"l": "Mar 13:34", "n": "", "vs": [[34, "فالأمر أشبه بإنسان مسافر، ترك بيته، وأعطى عبيده السلطة معينا لكل واحد عمله، وأوصى حارس الباب أن يسهر."]]}, {"l": "Luk 12:42", "n": "", "vs": [[42, "فقال الرب: «من هو إذن الوكيل الأمين العاقل الذي يقيمه سيده على أهل بيته ليقدم لهم حصتهم من الطعام في حينها؟"]]}, {"l": "Luk 12:43", "n": "", "vs": [[43, "طوبى لذلك العبد الذي يجده سيده ، لدى رجوعه ، يقوم بهذا العمل."]]}, {"l": "Rom 12:4-8", "n": "", "vs": [[4, "فكما أن لنا في جسد واحد أعضاء كثيرة، ولكن ليس لجميع هذه الأعضاء عمل واحد،"], [5, "فكذلك نحن الكثيرين جسد واحد في المسيح، وكلنا أعضاء بعضنا لبعض."], [6, "ولكن، بما أن المواهب موزعة بحسب النعمة الموهوبة لنا، (فلنمارسها): فمن وهب النبوءة، فليتنبأ بحسب مقدار الإيمان؛"], [7, "ومن وهب الخدمة، فلينهمك في الخدمة؛ أو التعليم، ففي التعليم؛"], [8, "أو الوعظ، ففي الوعظ؛ أو العطاء، فليعط بسخاء؛ أو القيادة، فليقد باجتهاد؛ أو إظهار الرحمة، فليرحم بسرور."]]}, {"l": "Col 3:22-24", "n": "", "vs": [[22, "أيها العبيد، أطيعوا في كل أمر سادتكم البشريين، فلا تعملوا بجد فقط حين تكون عيونهم عليكم، كمن يحاول إرضاء الناس، بل بقلب صادق خائفين الرب."], [23, "ومهما عملتم، فاجتهدوا فيه من صميم القلب، وكأنه للرب لا للناس،"], [24, "عالمين أنكم سوف تنالون المكافأة بالميراث من الرب. فإنما أنتم عبيد تخدمون الرب المسيح"]]}, {"l": "2Th 3:11", "n": "", "vs": [[11, "وقد سمعنا أن بينكم بعض الذين يسلكون سلوكا فوضويا فلا يشتغلون شيئا بل يتلهون بشؤون غيرهم."]]}, {"l": "1Ti 5:13", "n": "", "vs": [[13, "وفي الوقت نفسه يتعودن البطالة والتنقل من بيت إلى بيت. ولا تكفيهن البطالة، بل ينصرفن أيضا إلى الثرثرة والتشاغل بما لا يعنيهن والتحدث بأمور غير لائقة."]]}, {"l": "Tit 2:4-10", "n": "", "vs": [[4, "لكي يدربن الشابات على أن يكن محبات لأزواجهن ولأولادهن،"], [5, "متعقلات، عفيفات، مهتمات بشؤون بيوتهن صالحات، خاضعات لأزواجهن، حتى لا يتكلم أحد بالسوء على كلمة الله."], [6, "كذلك عظ الشبان أن يكونوا متعقلين،"], [7, "جاعلا من نفسك في كل شيء قدوة للأعمال الصالحة، مظهرا في تعليمك النقاوة والوقار"], [8, "والكلمة الصحيحة التي لا تلام، لكي يخجل المقاوم حين لا يجد أمرا سيئا يقوله فينا."], [9, "وعلم العبيد أن يكونوا خاضعين لسادتهم، مرضين لهم في كل شيء؛ غير معاندين؛"], [10, "ولا سارقين، بل مظهرين أمانة كلية صالحة، لكي يزينوا في كل شيء تعليم مخلصنا الله."]]}, {"l": "1Pe 4:10", "n": "", "vs": [[10, "وعلى كل واحد منكم أن يخدم الآخرين بالموهبة التي أعطاه الله إياها، باعتباركم وكلاء صالحين مؤتمنين على أنواع متعددة من المواهب التي يمنحها الله بالنعمة."]]}, {"l": "1Pe 4:11", "n": "", "vs": [[11, "فمن يتكلم، عليه أن يتكلم بما يوافق أقوال الله؛ ومن يخدم، عليه أن يخدم بموجب القوة التي يمنحها الله . وذلك لكي يتمجد الله في كل شيء، بيسوع المسيح، له المجد والسلطة إلى أبد الآبدين. آمين!"]]}, {"l": "1Pe 4:15", "n": "", "vs": [[15, "لا يكن بينكم من يتأ لم عقابا على شر ارتكبه: كالقتل أو السرقة، أو غيرهما من الجرائم، أو التدخل في شؤون الآخرين."]]}], "kwAr": "مهتمين بممارسة شؤونكم الخاصة", "noteAr": ""}, {"kw": "to work", "raw": "Act_20:35; Rom_12:11; 1Co_4:12; Eph_4:28; 2Th_3:7-12; Tit_3:14 *marg.", "note": "", "refs": [{"l": "Act 20:35", "n": "", "vs": [[35, "وقد أظهرت لكم بوضوح كيف يجب أن نبذل الجهد لنساعد المحتاجين، متذكرين كلمات الرب يسوع، إذ قال: الغبطة في العطاء أكثر مما في الأخذ!»"]]}, {"l": "Rom 12:11", "n": "", "vs": [[11, "لا تتكاسلوا في الاجتهاد، بل كونوا ملتهبين في الروح، عبيدا خادمين للرب،"]]}, {"l": "1Co 4:12", "n": "", "vs": [[12, "ونجهد أنفسنا في الشغل بأيدينا. نتعرض للإهانة فنبارك، وللاضطهاد فنحتمل"]]}, {"l": "Eph 4:28", "n": "", "vs": [[28, "ومن كان سارقا، فلا يسرق في ما بعد، بل بالأحرى ليكد ويستخدم يديه في عمل شريف ليكون عنده ما يشارك فيه المحتاجين."]]}, {"l": "2Th 3:7-12", "n": "", "vs": [[7, "فأنتم أنفسكم تعرفون كيف ينبغي أن تقتدوا بنا، لأن سلوكنا بينكم لم يكن فوضويا،"], [8, "ولا أكلنا الخبز من عند أحد مجانا، بل كنا نشتغل بتعب وكد ليل نهار، لكي لا نكون عبئا ثقيلا على أي واحد منكم."], [9, "وذلك لا يعني أنه ليس لنا حق، بل لنجعل أنفسنا مثالا لكم لتقتدوا بنا."], [10, "فلما كنا عندكم، أوصيناكم بهذا المبدأ: إن كان أحد لا يريد أن يشتغل، فلا يأكل!"], [11, "وقد سمعنا أن بينكم بعض الذين يسلكون سلوكا فوضويا فلا يشتغلون شيئا بل يتلهون بشؤون غيرهم."], [12, "فمثل هؤلاء نوصيهم ونناشدهم، في الرب يسوع المسيح، أن يكسبوا معيشتهم بأنفسهم، مشتغلين بهدوء."]]}, {"l": "Tit 3:14", "n": "*marg.", "vs": [[14, "وليتعلم ذوونا أيضا أن يمارسوا أعمالا حسنة، لسد الحاجات الضرورية، لكي لا يكونوا عديمي الثمر."]]}], "kwAr": "بعمل أيديكم", "noteAr": ""}], "arS": [["وأن ", []], ["تسعوا بجد", ["G5389"]], [" إلى العيش ", []], ["بهدوء", ["G2270"]], ["، مهتمين بممارسة ", []], ["شؤونكم", ["G4238"]], [" ", []], ["الخاصة", ["G2398"]], ["، ومحصلين ", []], ["معيشتكم", ["G2038"]], [" بعمل ", []], ["أيديكم", ["G5495"]], ["، كما ", []], ["أوصيناكم", ["G3853"]], [".", []]]}, {"c": 4, "v": 12, "text": "عندئذ تكون سيرتكم حسنة السمعة تجاه الذين من خارج الكنيسة، ولا تكونون في حاجة إلى شيء.", "groups": [{"kw": "ye may walk", "raw": "1Th_5:22; Rom_12:17, Rom_13:13; 2Co_8:20,2Co_8:21; Phi_4:8; Tit_2:8-10; 1Pe_2:12; 1Pe_3:16, 1Pe_3:17", "note": "", "refs": [{"l": "1Th 5:22", "n": "", "vs": [[22, "ترفعوا عن كل ما فيه شبهة شر."]]}, {"l": "Rom 12:17", "n": "", "vs": [[17, "لا تردوا لأحد شرا مقابل شر، بل اجتهدوا في تقديم ما هو حسن أمام جميع الناس."]]}, {"l": "Rom 13:13", "n": "", "vs": [[13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."]]}, {"l": "2Co 8:20", "n": "", "vs": [[20, "ونحن حريصون على ألا يلومنا أحد في أمر هذه التقدمة الكبيرة التي نتولى القيام بها."]]}, {"l": "2Co 8:21", "n": "", "vs": [[21, "فإننا نحرص على النزاهة لا أمام الرب فقط، بل أمام الناس أيضا."]]}, {"l": "Phi 4:8", "n": "", "vs": [[8, "وختاما، أيها الإخوة: كل ما كان حقا، وكل ما كان شريفا، وكل ما كان عادلا، وكل ما كان طاهرا وكل ما كان مستحبا، وكل ما كان حسن السمعة، وكل ما كان فيه فضيلة وخصلة حميدة، فاشغلوا أفكاركم به."]]}, {"l": "Tit 2:8-10", "n": "", "vs": [[8, "والكلمة الصحيحة التي لا تلام، لكي يخجل المقاوم حين لا يجد أمرا سيئا يقوله فينا."], [9, "وعلم العبيد أن يكونوا خاضعين لسادتهم، مرضين لهم في كل شيء؛ غير معاندين؛"], [10, "ولا سارقين، بل مظهرين أمانة كلية صالحة، لكي يزينوا في كل شيء تعليم مخلصنا الله."]]}, {"l": "1Pe 2:12", "n": "", "vs": [[12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالحة يمجدون الله في يوم الافتقاد."]]}, {"l": "1Pe 3:16", "n": "", "vs": [[16, "على أن تفعلوا ذلك بوداعة واحترام، محافظين على طهارة ضمائركم، سالكين في المسيح سلوكا صالحا، وعندئذ يخيب الذين يوجهون إليكم التهم الكاذبة ويشتمونكم كأنكم تفعلون شرا."]]}, {"l": "1Pe 3:17", "n": "", "vs": [[17, "فإن كان الله يريد لكم أن تتألموا، فمن الأفضل أن تتألموا وأنتم تفعلون الخير لا الشر."]]}], "kwAr": "تكون سيرتكم حسنة السمعة", "noteAr": ""}, {"kw": "them", "raw": "Mar_4:11; 1Co_5:12, 1Co_5:13; Col_4:5; 1Ti_3:7; 1Pe_3:1", "note": "", "refs": [{"l": "Mar 4:11", "n": "", "vs": [[11, "فقال لهم: «قد أعطي لكم أن تعرفوا سر ملكوت الله. أما الذين من خارج، فكل شيء يقدم لهم بالأمثال،"]]}, {"l": "1Co 5:12", "n": "", "vs": [[12, "فما لي وللذين خارج (الكنيسة) حتى أدينهم؟ ألستم أنتم تدينون الذين داخلها؟"]]}, {"l": "1Co 5:13", "n": "", "vs": [[13, "أما الذين في الخارج، فالله يدينهم. فاعزلوا من هو شرير من بينكم."]]}, {"l": "Col 4:5", "n": "", "vs": [[5, "تصرفوا بحكمة مع الذين هم من خارج الكنيسة، مستغلين الوقت أحسن استغلال."]]}, {"l": "1Ti 3:7", "n": "", "vs": [[7, "ومن الضروري أن تكون له شهادة حسنة من الذين في خارج الكنيسة، لكي لا يقع في العار وفي فخ إبليس."]]}, {"l": "1Pe 3:1", "n": "", "vs": [[1, "كذلك، أيتها الزوجات، اخضعن لأزواجكن. حتى وإن كان الزوج غير مؤمن بالكلمة، تجذبه زوجته إلى الإيمان، بتصرفها اللائق دون كلام،"]]}], "kwAr": "الذين من خارج الكنيسة", "noteAr": ""}, {"kw": "nothing", "raw": "or, no man, 2Co_11:7-9", "note": "or, no man, 2Co_11:7-9", "refs": [{"l": "2Co 11:7-9", "n": "", "vs": [[7, "أيكون ذنبي إذن، أني بشرتكم بالإنجيل دون أجرة منكم، فأنقصت قدري ليزداد قدركم؟"], [8, "ظلمت كنائس أخرى بتحميلها نفقة خدمتكم."], [9, "وحين كنت عندكم واحتجت، لم أثقل على أحد منكم. إذ سد حاجتي الإخوة الذين جاءوا من مقاطعة مقدونية. وقد حفظت نفسي، وسأحفظها أيضا، من أن أكون ثقيلا عليكم في أي شيء."]]}], "kwAr": "في حاجة إلى شيء", "noteAr": "أو: إلى أحد."}], "arS": [["عندئذ تكون ", []], ["سيرتكم", ["G4043"]], [" ", []], ["حسنة السمعة", ["G2156"]], [" تجاه الذين من ", []], ["خارج", ["G1854"]], [" الكنيسة، ولا تكونون في ", []], ["حاجة", ["G5532"]], [" إلى ", []], ["شيء", ["G3367"]], [".", []]]}, {"c": 4, "v": 13, "text": "على أننا نريد، أيها الإخوة، ألا يخفى عليكم أمر الراقدين، حتى لا يصيبكم الحزن كغيركم من الناس الذين لا رجاء لهم.", "groups": [{"kw": "I would", "raw": "Rom_1:13; 1Co_10:1, 1Co_12:1; 2Co_1:8; 2Pe_3:8", "note": "", "refs": [{"l": "Rom 1:13", "n": "", "vs": [[13, "ثم لا أريد أن يخفى عليكم، أيها الإخوة، أنني كثيرا ما قصدت أن آتي إليكم، ليكون لي ثمر من بينكم أيضا كما لي من بين الأمم الأخرى، إلا أنني كنت أعاق حتى الآن"]]}, {"l": "1Co 10:1", "n": "", "vs": [[1, "فإني لا أريد أن يخفى عليكم، أيها الأخوة أن آباءنا كانوا كلهم تحت السحابة، واجتازوا كلهم في البحر،"]]}, {"l": "1Co 12:1", "n": "", "vs": [[1, "وأما بخصوص المواهب الروحية، أيها الإخوة، فلا أريد أن يخفى عليكم أمرها."]]}, {"l": "2Co 1:8", "n": "", "vs": [[8, "فيا أيها الإخوة، نريد أن لا يخفى عليكم أمر الضيقة التي مررنا بها في مقاطعة أسيا. فقد كانت وطأتها علينا شديدة جدا وفوق طاقتنا، حتى يئسنا من الحياة نفسها."]]}, {"l": "2Pe 3:8", "n": "", "vs": [[8, "ولكن، أيها الأحباء، عليكم ألا تنسوا هذه الحقيقة: أن يوما واحدا في نظر الرب هو كألف سنة، وألف سنة كيوم واحد."]]}], "kwAr": "نريد", "noteAr": ""}, {"kw": "which are", "raw": "1Th_4:15, 1Th_5:10; 1Ki_1:21, 1Ki_2:10; Dan_12:2; Mat_27:52; Luk_8:52, Luk_8:53; Joh_11:11-13; Act_7:60, Act_13:36; 1Co_15:6, 1Co_15:18; 2Pe_3:4", "note": "", "refs": [{"l": "1Th 4:15", "n": "", "vs": [[15, "فهذا نقوله لكم بكلمة من عند الرب: إننا نحن الباقين أحياء إلى حين عودة الرب، لن نسبق الراقدين."]]}, {"l": "1Th 5:10", "n": "", "vs": [[10, "الذي مات عنا لكي نحيا جميعا معه، سواء كنا في سهر الحياة أم في رقاد الموت!"]]}, {"l": "1Ki 1:21", "n": "", "vs": [[21, "وإلا حالما ينضم سيدي الملك إلى آبائه نعامل أنا وابني سليمان معاملة المذنبين»."]]}, {"l": "1Ki 2:10", "n": "", "vs": [[10, "ثم مات داود ودفن في أورشليم."]]}, {"l": "Dan 12:2", "n": "", "vs": [[2, "ويستيقظ كثيرون من الأموات المدفونين في تراب الأرض، بعضهم ليثابوا بالحياة الأبدية وبعضهم ليساموا ذل العار والازدراء إلى الأبد."]]}, {"l": "Mat 27:52", "n": "", "vs": [[52, "وتفتحت القبور، وقامت أجساد كثيرة لقديسين كانوا قد رقدوا؛"]]}, {"l": "Luk 8:52", "n": "", "vs": [[52, "وكان الجميع يبكونها ويندبونها. فقال: «لا تبكوا. إنها لم تمت، بل هي نائمة!»"]]}, {"l": "Luk 8:53", "n": "", "vs": [[53, "فضحكوا منه، لعلمهم أنها ماتت."]]}, {"l": "Joh 11:11-13", "n": "", "vs": [[11, "ثم قال يسوع: «لعازر حبيبنا قد رقد، ولكني سأذهب لأنهضه»."], [12, "فقال التلَاميذ: «ياسيد، إن كان قد رقد، فإنه سينهض معافى»."], [13, "وكان يسوع يعني موت لعازر ؛ أما التلاميذ فظنوه يعني رقاد النوم."]]}, {"l": "Act 7:60", "n": "", "vs": [[60, "ثم ركع وصرخ بصوت عال: «يارب، لا تحسب عليهم هذه الخطيئة!» وإذ قال هذا رقد."]]}, {"l": "Act 13:36", "n": "", "vs": [[36, "وقد مات داود بعدما خدم شعبه في عصره وفقا لمشيئة الله، ودفن فلحق بآبائه، ونال منه الفساد."]]}, {"l": "1Co 15:6", "n": "", "vs": [[6, "وبعد ذلك ظهر لأكثر من خمس مئة أخ معا مازال معظمهم حيا، في حين رقد الآخرون."]]}, {"l": "1Co 15:18", "n": "", "vs": [[18, "ولكان الذين رقدوا في المسيح قد هلكوا!"]]}, {"l": "2Pe 3:4", "n": "", "vs": [[4, "وسيقولون: «أين هو الوعد برجوع المسيح؟ فمنذ أن مات آباؤنا الأولون، بل منذ بدء الخليقة، مازال كل شيء على حاله!»"]]}], "kwAr": "أمر الراقدين", "noteAr": ""}, {"kw": "ye sorrow", "raw": "Gen_37:35; Lev_19:28; Deu_14:1, Deu_14:2; 2Sa_12:19, 2Sa_12:20, 2Sa_18:33; Job_1:21; Eze_24:16-18; Joh_11:24; Act_8:2", "note": "", "refs": [{"l": "Gen 37:35", "n": "", "vs": [[35, "وعندما قام جميع أبنائه ليعزوه أبى أن يتعزى وقال: «إني أمضي إلى ابني نائحا إلى الهاوية». وبكى عليه أبوه."]]}, {"l": "Lev 19:28", "n": "", "vs": [[28, "لا تجرحوا أجسامكم حزنا على ميت، ولا ترسم وشما عليه. فأنا الرب."]]}, {"l": "Deu 14:1", "n": "", "vs": [[1, "أنتم أبناء للرب إلهكم، فلا تجرحوا أجسادكم، ولا تحلقوا مقدمة رؤوسكم حزنا على ميت،"]]}, {"l": "Deu 14:2", "n": "", "vs": [[2, "لأنكم شعب مقدس للرب إلهكم، وقد اختاركم من بين شعوب الأرض كافة لتكونوا له شعبا خاصا."]]}, {"l": "2Sa 12:19", "n": "", "vs": [[19, "وإذ شاهد داود رجال حاشيته يتهامسون، أدرك أن الولد قد مات، فسألهم: «هل توفي الولد؟» فأجابوا: «نعم»."]]}, {"l": "2Sa 12:20", "n": "", "vs": [[20, "عندئذ نهض داود عن الأرض واغتسل وتطيب وبدل ثيابه ودخل إلى بيت الرب وصلى ساجدا، ثم عاد إلى قصره وطلب طعاما فأكل."]]}, {"l": "2Sa 18:33", "n": "", "vs": [[33, "فارتعش الملك وصعد إلى علية البوابة باكيا يذرع أرض الحجرة قائلا: «ياابني، ياابني أبشالوم. ياليتني مت عوضا عنك ياأبشالوم ياابني. آه ياابني»."]]}, {"l": "Job 1:21", "n": "", "vs": [[21, "وقال: «عريانا خرجت من بطن أمي وعريانا أعود إلى هناك. الرب أعطى والرب أخذ، فليكن اسم الرب مباركا»."]]}, {"l": "Eze 24:16-18", "n": "", "vs": [[16, "«ياابن آدم، ها أنا أحرمك من بهجة عينيك (أي زوجته) على أثر فاجعة. فلا تنح ولا تبك ولا تذرف دموعك."], [17, "تنهد بصمت. لا تقم مناحة على الموتى. تلفع بعصابتك وضع نعليك في رجليك. لا تحجب شاربيك ولا تأكل من خبز الناس»."], [18, "فخاطبت الشعب في الصباح، وعند المساء توفيت زوجتي، ففعلت في اليوم التالي ما أمرت به."]]}, {"l": "Joh 11:24", "n": "", "vs": [[24, "قالت مرثا: «أعرف أنه سيقوم في القيامة، في اليوم الأخير!»"]]}, {"l": "Act 8:2", "n": "", "vs": [[2, "وأما استفانوس فقد دفنه بعض الرجال الأتقياء، وناحوا عليه كثيرا."]]}], "kwAr": "حتى لا يصيبكم الحزن", "noteAr": ""}, {"kw": "which have", "raw": "Eph_2:12; Job_19:25-27; Pro_14:32; Eze_37:11; 1Co_15:19", "note": "", "refs": [{"l": "Eph 2:12", "n": "", "vs": [[12, "أنكم كنتم في ذلك الحين بلا مسيح، أجانب عن جماعة إسرائيل، وغرباء عن العهود الموعودة، لا رجاء لكم، ومنكرين لله في العالم."]]}, {"l": "Job 19:25-27", "n": "", "vs": [[25, "أما أنا فإني موقن أن فادي حي، وأنه لابد في النهاية أن يقوم على الأرض."], [26, "وبعد أن يفنى جلدي، فإني بذاتي أعاين الله ."], [27, "الذي أشاهده لنفسي فتنظره عيناي وليس عينا آخر، قد فنيت كليتاي شوقا في داخلي."]]}, {"l": "Pro 14:32", "n": "", "vs": [[32, "يعاقب الشرير بمقتضى سوء تصرفاته، أما الصديق فله معتصم عند موته."]]}, {"l": "Eze 37:11", "n": "", "vs": [[11, "ثم قال لي: «ياابن آدم، هذه العظام هي جملة شعب إسرائيل. ها هم يقولون قد يبست عظامنا ومات رجاؤنا وانقطعنا."]]}, {"l": "1Co 15:19", "n": "", "vs": [[19, "ولو كان رجاؤنا في المسيح يقتصر على هذه الحياة، لكنا أشقى الناس جميعا!"]]}], "kwAr": "الذين لا رجاء لهم", "noteAr": ""}], "arS": [["على أننا ", []], ["نريد", ["G2309"]], ["، أيها ", []], ["الإخوة", ["G80"]], ["، ألا ", []], ["يخفى", ["G50"]], [" عليكم أمر ", []], ["الراقدين", ["G2837"]], ["، حتى لا يصيبكم ", []], ["الحزن", ["G3076"]], [" ", []], ["كغيركم", ["G3062"]], [" من الناس الذين لا ", []], ["رجاء", ["G1680"]], [" لهم.", []]]}, {"c": 4, "v": 14, "text": "فمادمنا نؤمن أن يسوع مات ثم قام، فمعه كذلك سيحضر الله أيضا الراقدين بيسوع.", "groups": [{"kw": "if we", "raw": "Isa_26:19; Rom_8:11; 1Co_15:12-23; 2Co_4:13, 2Co_4:14; Rev_1:18", "note": "", "refs": [{"l": "Isa 26:19", "n": "", "vs": [[19, "ولكن أمواتك يحيون، وتقوم أجسادهم فيا سكان التراب استيقظوا واشدوا بفرح لأن طلك هو ندى متلأليء، جعلته يهطل على أرض الأشباح."]]}, {"l": "Rom 8:11", "n": "", "vs": [[11, "وإذا كان روح الذي أقام يسوع من بين الأموات يسكن فيكم، فإن الذي أقام المسيح من بين الأموات سوف يحيي أيضا أجسادكم الفانية بسبب روحه الذي يسكن فيكم."]]}, {"l": "1Co 15:12-23", "n": "", "vs": [[12, "والآن، مادام يبشر بأن المسيح قام من بين الأموات، فكيف يقول بعضكم إنه لا قيامة للأموات؟"], [13, "فإن كانت قيامة الأموات غير موجودة، فمعنى ذلك أن المسيح لم يقم أيضا!"], [14, "ولو لم يكن المسيح قد قام، لكان تبشيرنا عبثا وإيمانكم عبثا،"], [15, "ولكان تبين عندئذ أننا شهود زور على الله، إذ إننا شهدنا على الله أنه أقام المسيح، وهو لم يقمه لو صح أن الأموات لا يقامون."], [16, "إذن، لو كان الأموات لا يقامون، لكان المسيح لم يقم أيضا."], [17, "ولو لم يكن المسيح قد قام، لكان إيمانكم عبثا، ولكنتم بعد في خطاياكم،"], [18, "ولكان الذين رقدوا في المسيح قد هلكوا!"], [19, "ولو كان رجاؤنا في المسيح يقتصر على هذه الحياة، لكنا أشقى الناس جميعا!"], [20, "أما الآن فالمسيح قد قام من بين الأموات بكرا للراقدين."], [21, "فبما أن الموت كان بإنسان، فإن قيامة الأموات أيضا تكون بإنسان."], [22, "فإنه، كما يموت الجميع في آدم، فكذلك سيحيى الجميع في المسيح،"], [23, "على أن لكل واحد رتبته: فأولا المسيح بصفته البكر؛ وبعده خاصته لدى رجوعه،"]]}, {"l": "2Co 4:13", "n": "", "vs": [[13, "وبما أن لنا روح الإيمان عينه، هذا الذي كتب بخصوصه: «آمنت، لذلك تكلمت»، فنحن أيضا نؤمن، ولذلك نتكلم،"]]}, {"l": "2Co 4:14", "n": "", "vs": [[14, "ونحن عالمون أن الذي أقام الرب يسوع من الموت سوف يقيمنا نحن أيضا مع يسوع، ويوقفنا في حضرته بصحبتكم."]]}, {"l": "Rev 1:18", "n": "", "vs": [[18, "أنا الحي. كنت ميتا، ولكن ها أنا حي إلى أبد الآبدين. ولي مفاتيح الموت والهاوية."]]}], "kwAr": "فمادمنا نؤمن", "noteAr": ""}, {"kw": "sleep", "raw": "1Th_4:13, 1Th_3:13; 1Co_15:18; Rev_14:13", "note": "", "refs": [{"l": "1Th 4:13", "n": "", "vs": [[13, "على أننا نريد، أيها الإخوة، ألا يخفى عليكم أمر الراقدين، حتى لا يصيبكم الحزن كغيركم من الناس الذين لا رجاء لهم."]]}, {"l": "1Th 3:13", "n": "", "vs": [[13, "حتى تتثبت قلوبكم بغير لوم في القداسة أمام إلهنا وأبينا عندما يظهر ربنا يسوع عائدا مع جميع قديسيه."]]}, {"l": "1Co 15:18", "n": "", "vs": [[18, "ولكان الذين رقدوا في المسيح قد هلكوا!"]]}, {"l": "Rev 14:13", "n": "", "vs": [[13, "وسمعت صوتا من السماء يقول: «اكتب: طوبى للأموات الذين يموتون منذ الآن وهم في الرب! يقول الروح: نعم! فليستريحوا من متاعبهم، لأن أعمالهم ترافقهم»."]]}], "kwAr": "الراقدين بيسوع", "noteAr": ""}, {"kw": "God", "raw": "1Th_4:17; Gen_49:19; Zec_14:15; Mat_24:31; 1Co_15:23; Phi_3:20,Phi_3:21; 2Th_2:1; Jud_1:14, Jud_1:15", "note": "", "refs": [{"l": "1Th 4:17", "n" لفجر واستغثت؛ رجائي في كلامك."]]}, {"l": "Psa 119:148", "n": "", "vs": [[148, "الليل كله أظل مستيقظا، أتأمل في أقوالك"]]}, {"l": "Mat 17:25", "n": "", "vs": [[25, "وما إن دخل بطرس البيت، حتى بادره يسوع بالسؤال: «مارأيك ياسمعان: ممن يستوفي ملوك الأرض الجزية أو الضريبة؟ أمن أبناء بلادهم، أم من الأجانب؟»"]]}], "kwAr": "لن نسبق", "noteAr": ""}, {"kw": "asleep", "raw": "1Th_4:13", "note": "", "refs": [{"l": "1Th 4:13", "n": "", "vs": [[13, "على أننا نريد، أيها الإخوة، ألا يخفى عليكم أمر الراقدين، حتى لا يصيبكم الحزن كغيركم من الناس الذين لا رجاء لهم."]]}], "kwAr": "الراقدين", "noteAr": ""}], "arS": [["فهذا ", []], ["نقوله", ["G3004"]], [" لكم ", []], ["بكلمة", ["G3056"]], [" من عند ", []], ["الرب", ["G2962"]], [": إننا نحن ", []], ["الباقين", ["G4035"]], [" ", []], ["أحياء", ["G2198"]], [" إلى حين ", []], ["عودة", ["G3952"]], [" ", []], ["الرب", ["G2962"]], ["، لن ", []], ["نسبق", ["G5348"]], [" ", []], ["الراقدين", ["G2837"]], [".", []]]}, {"c": 4, "v": 16, "text": "لأن الرب نفسه سينزل من السماء حالما يدوي أمر بالتجمع، وينادي رئيس ملائكة، ويبوق في بوق إلهي، عندئذ يقوم الأموات في المسيح أولا.", "groups": [{"kw": "the Lord", "raw": "Isa_25:8, Isa_25:9; Mat_16:27, Mat_24:30,Mat_24:31, Mat_25:31, Mat_26:64; Act_1:11; 2Th_1:7; 2Pe_3:10; Rev_1:7", "note": "", "refs": [{"l": "Isa 25:8", "n": "", "vs": [[8, "ويبتلع الموت إلى الأبد، ويمسح السيد الرب الدموع المنهمرة على الوجوه، ويزيل عار شعبه من كل الأرض. هذا ما تكلم به الرب."]]}, {"l": "Isa 25:9", "n": "", "vs": [[9, "ويقولون في ذلك اليوم: «ها هو إلهنا الذي انتظرناه فخلصنا. هذا هو الرب الذي انتظرناه نبتهج ونفرح بخلاصه»."]]}, {"l": "Mat 16:27", "n": "", "vs": [[27, "فإن ابن الإنسان سوف يعود في مجد أبيه مع ملائكته، فيجازي كل واحد حسب أعماله."]]}, {"l": "Mat 24:30", "n": "", "vs": [[30, "وعندئذ تظهر آية ابن الإنسان في السماء، فتنتحب قبائل الأرض كلها، ويرون ابن الإنسان آتيا على سحب السماء بقدرة ومجد عظيم."]]}, {"l": "Mat 24:31", "n": "", "vs": [[31, "ويرسل ملائكته بصوت بوق عظيم ليجمعوا مختاريه من الجهات الأربع، من أقاصي السماوات إلى أقاصيها."]]}, {"l": "Mat 25:31", "n": "", "vs": [[31, "وعندما يعود ابن الإنسان في مجده ومعه جميع ملائكته، فإنه يجلس على عرش مجده،"]]}, {"l": "Mat 26:64", "n": "", "vs": [[64, "فأجابه يسوع: «أنت قلت! وأقول لكم أيضا إنكم منذ الآن سوف ترون ابن الإنسان جالسا عن يمين القدرة ثم آتيا على سحب السماء!»"]]}, {"l": "Act 1:11", "n": "", "vs": [[11, "وقالا لهم: «أيها الجليليون، لماذا تقفون ناظرين إلى السماء؟ إن يسوع، هذا الذي ارتفع عنكم إلى السماء، سيعود منها مثلما رأيتموه منطلقا إليها!»"]]}, {"l": "2Th 1:7", "n": "", "vs": [[7, "وأن يكافئكم، أنتم الذين تتضايقون، كما يكافئنا نحن، بالراحة لدى ظهور الرب يسوع علنا من السماء، ومعه ملائكة قدرته،"]]}, {"l": "2Pe 3:10", "n": "", "vs": [[10, "إلا أن «يوم الرب» سيأتي كما يأتي اللص في الليل. في ذلك اليوم، تزول السماوات محدثة دويا هائلا وتنحل العناصر محترقة بنار شديدة، وتحترق الأرض وما فيها من منجزات."]]}, {"l": "Rev 1:7", "n": "", "vs": [[7, "ها هو آت مع السحاب! ستراه عيون الجميع، حتى أولئك الذين طعنوه، وتنوح بسببه قبائل الأرض كلها! نعم، آمين!"]]}], "kwAr": "الرب نفسه سينزل", "noteAr": ""}, {"kw": "with a", "raw": "Num_23:21; Psa_47:1, Psa_47:5; Zec_4:7, Zec_9:9", "note": "", "refs": [{"l": "Num 23:21", "n": "", "vs": [[21, "لم يشهد إثما في يعقوب، ولم ير مشقة في إسرائيل. الرب إلههم معهم، وهتاف للملك فيهم."]]}, {"l": "Psa 47:1", "n": "", "vs": [[1, "ياجميع الأمم صفقوا بالأيا دي، واهتفوا لله هتاف الابتهاج."]]}, {"l": "Psa 47:5", "n": "", "vs": [[5, "ارتفع الله وسط الهتاف، ارتفع الرب وسط دوي نفخ البوق."]]}, {"l": "Zec 4:7", "n": "", "vs": [[7, "أي شيء أنت أيها الجبل العظيم؟ أنت سهل أمام زربابل، وسيضع زربابل حجر الزاوية في خضم هتاف القائلين: ليباركه، ليباركه الرب»."]]}, {"l": "Zec 9:9", "n": "", "vs": [[9, "»ابتهجي جدا ياابنة صهيون واهتفي ياابنة أورشليم، لأن هوذا ملكك مقبل إليك. هو عادل ظافر، ولكنه وديع راكب على أتان، على جحش ابن أتان."]]}], "kwAr": "يدوي أمر بالتجمع", "noteAr": ""}, {"kw": "the archangel", "raw": "Jud_1:9", "note": "", "refs": [{"l": "Jud 1:9", "n": "", "vs": [[9, "فحتى ميخائيل، وهو رئيس ملائكة، لم يجرؤ أن يحكم على إبليس بكلام مهين عندما خاصمه وتجادل معه بخصوص جثمان موسى، وإنما اكتفى بالقول له: «ليزجرك الرب!»"]]}], "kwAr": "رئيس ملائكة", "noteAr": ""}, {"kw": "with the trump", "raw": "Exo_19:16, Exo_20:18; Isa_27:13; Zec_9:14; 1Co_15:52; Rev_1:10, Rev_8:13", "note": "", "refs": [{"l": "Exo 19:16", "n": "", "vs": [[16, "وفي صباح اليوم الثالث حدثت رعود وبروق، وخيم سحاب كثيف على الجبل، ودوى صوت بوق قوي جدا، فارتعد كل الشعب الذي في المخيم،"]]}, {"l": "Exo 20:18", "n": "", "vs": [[18, "وعندما عاين الشعب كله الرعود والبروق، وسمعوا دوي صوت البوق، ورأوا الجبل يدخن ارتجفوا خوفا ووقفوا من بعيد،"]]}, {"l": "Isa 27:13", "n": "", "vs": [[13, "في ذلك اليوم ينفخ في بوق عظيم فيأتي التائهون في أرض أشور، والمنفيون إلى ديار مصر، ليسجدوا للرب في جبل قدسه، في أورشليم."]]}, {"l": "Zec 9:14", "n": "", "vs": [[14, "ثم يتجلى الرب، وينفذ سهمه كالبرق. ينفخ السيد الرب بالبوق ويقتحم في زوابع الجنوب."]]}, {"l": "1Co 15:52", "n": "", "vs": [[52, "في لحظة، بل في طرفة عين عندما ينفخ في البوق الأخير. فإنه سوف ينفخ في البوق، فيقوم الأموات بلا انحلال. وأما نحن، فسنتغير."]]}, {"l": "Rev 1:10", "n": "", "vs": [[10, "وفي يوم الرب، صرت في الروح، فسمعت من ورائي صوتا عاليا كصوت البوق"]]}, {"l": "Rev 8:13", "n": "", "vs": [[13, "ثم نظرت فرأيت نسرا يطير في وسط السماء وسمعته يصيح بصوت عال: «الويل الويل الويل لسكان الأرض مما سيحدث لهم عندما ينفخ الملائكة الثلاثة الباقون في أبواقهم!»"]]}], "kwAr": "ويبوق في بوق إلهي", "noteAr": ""}, {"kw": "and the", "raw": "1Co_15:23, 1Co_15:51, 1Co_15:52; Rev_20:5, Rev_20:6", "note": "", "refs": [{"l": "1Co 15:23", "n": "", "vs": [[23, "على أن لكل واحد رتبته: فأولا المسيح بصفته البكر؛ وبعده خاصته لدى رجوعه،"]]}, {"l": "1Co 15:51", "n": "", "vs": [[51, "وها أنا أكشف لكم سرا: إننا لن نرقد جميعا، ولكننا سنتغير جميعا،"]]}, {"l": "1Co 15:52", "n": "", "vs": [[52, "في لحظة، بل في طرفة عين عندما ينفخ في البوق الأخير. فإنه سوف ينفخ في البوق، فيقوم الأموات بلا انحلال. وأما نحن، فسنتغير."]]}, {"l": "Rev 20:5", "n": "", "vs": [[5, "هذه هي القيامة الأولى. أما بقية الأموات فلا يعودون إلى الحياة حتى تنقضي الألف سنة."]]}, {"l": "Rev 20:6", "n": "", "vs": [[6, "ما أسعد وأقدس من كان لهم نصيب في القيامة الأولى! لن يكون للموت الثاني سلطة عليهم، بل يكونون كهنة لله والمسيح، ويملكون معه ألف سنة."]]}], "kwAr": "يقوم الأموات في المسيح أولا", "noteAr": ""}], "arS": [["لأن ", []], ["الرب", ["G2962"]], [" ", []], ["نفسه", ["G846"]], [" ", []], ["سينزل", ["G2597"]], [" من ", []], ["السماء", ["G3772"]], [" حالما يدوي ", []], ["أمر بالتجمع", ["G2752"]], ["، وينادي ", []], ["رئيس ملائكة", ["G743", "G5456"]], ["، ويبوق في ", []], ["بوق", ["G4536"]], [" ", []], ["إلهي", ["G2316"]], ["، عندئذ يقوم ", []], ["الأموات", ["G3498"]], [" في ", []], ["المسيح", ["G5547"]], [" ", []], ["أولا", ["G4412"]], [".", []]]}, {"c": 4, "v": 17, "text": "ثم إننا، نحن الباقين أحياء، نختطف جميعا في السحب للاجتماع بالرب في الهواء. وهكذا نبقى مع الرب على الدوام.", "groups": [{"kw": "we which", "raw": "1Th_4:15; 1Co_15:52", "note": "", "refs": [{"l": "1Th 4:15", "n": "", "vs": [[15, "فهذا نقوله لكم بكلمة من عند الرب: إننا نحن الباقين أحياء إلى حين عودة الرب، لن نسبق الراقدين."]]}, {"l": "1Co 15:52", "n": "", "vs": [[52, "في لحظة، بل في طرفة عين عندما ينفخ في البوق الأخير. فإنه سوف ينفخ في البوق، فيقوم الأموات بلا انحلال. وأما نحن، فسنتغير."]]}], "kwAr": "نحن الباقين أحياء", "noteAr": ""}, {"kw": "caught", "raw": "1Ki_18:12; 2Ki_2:11, 2Ki_2:16; Act_8:39; 2Co_12:2-4; Rev_11:12, Rev_12:5", "note": "", "refs": [{"l": "1Ki 18:12", "n": "", "vs": [[12, "وما إن أنطلق من عندك لأخبره حتى يحملك روح الرب إلى حيث لا أدري، فيأتي أخآب ولا يجدك فيقتلني، وأنا عبدك أتقي الرب منذ صباي."]]}, {"l": "2Ki 2:11", "n": "", "vs": [[11, "وفيما هما يسيران ويتجاذبان أطراف الحديث، فصلت بينهما مركبة من نار تجرها خيول نارية، نقلت إيليا في العاصفة إلى السماء."]]}, {"l": "2Ki 2:16", "n": "", "vs": [[16, "وقالوا له: «إن بين عبيدك خمسين رجلا من ذوي البأس، فدعهم يذهبون للبحث عن سيدك. لعل روح الرب حمله وطرحه على أحد الجبال أو في أحد الأودية». فأجاب: «لا ترسلوا أحدا»."]]}, {"l": "Act 8:39", "n": "", "vs": [[39, "وما إن طلعا من الماء حتى خطف روح الرب فيلبس، فلم يعد الخصي يراه. فتابع سفره بفرح."]]}, {"l": "2Co 12:2-4", "n": "", "vs": [[2, "أعرف إنسانا في المسيح، خطف إلى السماء الثالثة قبل أربع عشرة سنة: أكان ذلك بجسده؟ لا أعلم؛ أم كان بغير جسده؟ لا أعلم. الله يعلم!"], [3, "وأنا أعرف أن هذا الإنسان، أبجسده أم بغير جسده؟ لا أعلم؛ الله يعلم؛"], [4, "قد خطف إلى الفردوس، حيث سمع أمورا مدهشة تفوق الوصف ولا يحق لإنسان أن ينطق بها."]]}, {"l": "Rev 11:12", "n": "", "vs": [[12, "ويدعوهما صوت عال من السماء: «اصعدا إلى هنا»، فيصعدان إلى السماء في سحابة بمشهد من أعدائهما."]]}, {"l": "Rev 12:5", "n": "", "vs": [[5, "وولدت المرأة ابنا ذكرا، وهو الذي سيحكم الأمم كلها بعصا من حديد. ورفع الطفل إلى حضرة الله وإلى عرشه."]]}], "kwAr": "نختطف جميعا", "noteAr": ""}, {"kw": "in the", "raw": "Mat_26:64; Mar_14:62; Act_1:9; Rev_1:7", "note": "", "refs": [{"l": "Mat 26:64", "n": "", "vs": [[64, "فأجابه يسوع: «أنت قلت! وأقول لكم أيضا إنكم منذ الآن سوف ترون ابن الإنسان جالسا عن يمين القدرة ثم آتيا على سحب السماء!»"]]}, {"l": "Mar 14:62", "n": "", "vs": [[62, "فقال يسوع: «أنا هو. وسوف ترون ابن الإنسان جالسا عن يمين القدرة، ثم آتيا على سحب السماء! »"]]}, {"l": "Act 1:9", "n": "", "vs": [[9, "قال هذا وارتفع إلى السماء بمشهد منهم. ثم حجبته سحابة عن أنظارهم."]]}, {"l": "Rev 1:7", "n": "", "vs": [[7, "ها هو آت مع السحاب! ستراه عيون الجميع، حتى أولئك الذين طعنوه، وتنوح بسببه قبائل الأرض كلها! نعم، آمين!"]]}], "kwAr": "في السحب", "noteAr": ""}, {"kw": "and so", "raw": "Psa_16:11, Psa_17:15, Psa_49:15, Psa_73:24; Isa_35:10, Isa_60:19, Isa_60:20; Joh_12:26, Joh_14:3; Joh_17:24; 2Co_5:8; Phi_1:23; 2Pe_3:13; Rev_7:14-17, Rev_21:3-7, Rev_21:22, Rev_21:23; Rev_22:3-5", "note": "", "refs": [{"l": "Psa 16:11", "n": "", "vs": [[11, "هديتني سبل الحياة: فإن ملء البهجة في حضرتك، وفي يمينك مسرات أبدية."]]}, {"l": "Psa 17:15", "n": "", "vs": [[15, "أما أنا فبالبر أشاهد وجهك. أشبع، إذا استيقظت، من بهاء طلعتك."]]}, {"l": "Psa 49:15", "n": "", "vs": [[15, "إنما الله يفتدي نفسي من قبضة الهاوية إذ يأخذني إليه."]]}, {"l": "Psa 73:24", "n": "", "vs": [[24, "تهديني بمشورتك، وبعد ذلك تأخذني إلى المجد."]]}, {"l": "Isa 35:10", "n": "", "vs": [[10, "ويرجع إليها مفديو الرب ويقبلون إلى صهيون مترنمين يكلل رؤوسهم فرح أبدي، وتغمرهم الغبطة والسرور، ويهرب الحزن والأنين."]]}, {"l": "Isa 60:19", "n": "", "vs": [[19, "ولا تعود الشمس نورا لك في النهار ولا يشرق ضوء القمر عليك لأن الرب يكون نورك الأبدي، وإلهك يكون مجدك."]]}, {"l": "Isa 60:20", "n": "", "vs": [[20, "ولا تغرب شمسك من بعد، ولا يتضاءل قمرك، لأن الرب يكون نورك الأبدي، وتنقضي أيام مناحتك."]]}, {"l": "Joh 12:26", "n": "", "vs": [[26, "من أراد أن يخدمني فليتبعني. وحيث أكون أنا يكون خادمي أيضا. وكل من يخدمني يكرمه أبي."]]}, {"l": "Joh 14:3", "n": "", "vs": [[3, "وبعدما أذهب وأعد لكم المكان أعود إليكم وآخذكم إلي، لتكونوا حيث أكون أنا."]]}, {"l": "Joh 17:24", "n": "", "vs": [[24, "أيها الآب، أريد لهؤلاء الذين وهبتهم لي أن يكونوا معي حيث أكون أنا، فيشاهدوا مجدي الذي أعطيتني، لأنك أحببتني قبل إنشاء العالم."]]}, {"l": "2Co 5:8", "n": "", "vs": [[8, "فنحن واثقون إذن، وراضون بالأحرى أن نكون مغتربين عن الجسد ومقيمين عند الرب."]]}, {"l": "Phi 1:23", "n": "", "vs": [[23, "فأنا تحت ضغط من كليهما: إذ إني راغب في أن أرحل وأقيم مع المسيح، وهذا أفضل بكثير جدا؛"]]}, {"l": "2Pe 3:13", "n": "", "vs": [[13, "إلا أننا، وفقا لوعد الرب، ننتظر سماوات جديدة وأرضا جديدة، حيث يسكن البر."]]}, {"l": "Rev 7:14-17", "n": "", "vs": [[14, "فأجبته: «أنت أعلم ياسيدي!» فقال: «هؤلاء هم الذين أتوا من الضيقة العظيمة، وقد غسلوا ثيابهم وبيضوها بدم الحمل."], [15, "لهذا هم أمام عرش الله يخدمونه في هيكله ليلا ونهارا والجالس على العرش يبسط خيمته عليهم،"], [16, "فلن يجوعوا ولن يعطشوا، ولن تضربهم الشمس ولا أي حر،"], [17, "لأن الحمل الذي في وسط العرش يرعاهم ويقودهم إلى ينابيع ماء الحياة، ويمسح الله كل دمعة من عيونهم»."]]}, {"l": "Rev 21:3-7", "n": "", "vs": [[3, "وسمعت صوتا هاتفا من العرش: «الآن صار مسكن الله مع الناس، هو يسكن بينهم، وهم يصيرون شعبا له. الله نفسه يكون معهم إلها لهم!"], [4, "وسيمسح كل دمعة من عيونهم. إذ يزول الموت والحزن والصراخ والألم، لأن الأمور القديمة كلها قد زالت!»"], [5, "وقال الجالس على العرش: «سأصنع كل شيء جديدا»
