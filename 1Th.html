. ثم قال لي: «اكتب هذا، فإن ما أقوله هو الصدق والحق»."], [6, "ثم قال: «قد تم. أنا الألف والياء (البداية والنهاية). أنا أسقي العطشان من ينبوع ماء الحياة مجانا."], [7, "هذا كله نصيب المنتصر، وأكون إلها له، وهو يكون ابنا لي."]]}, {"l": "Rev 21:22", "n": "", "vs": [[22, "ولم أجد في المدينة هيكلا، لأن الرب الإله القادر على كل شيء والحمل هما هيكلها."]]}, {"l": "Rev 21:23", "n": "", "vs": [[23, "ولم تكن المدينة في حاجة إلى نور الشمس أو القمر، لأن مجد الله ينيرها، والحمل مصباحها."]]}, {"l": "Rev 22:3-5", "n": "", "vs": [[3, "لن تكون فيما بعد لعنة أبدا. لأن عرش الله والحمل قائم في المدينة، حيث يخدمه عبيده"], [4, "ويرون وجهه، وقد كتب اسمه على جباههم."], [5, "ولن يكون هنالك ليل، فلا يحتاجون إلى نور مصباح أو شمس، لأن الرب الإله ينير عليهم، وهم سيملكون إلى أبد الآبدين!"]]}], "kwAr": "وهكذا نبقى مع الرب", "noteAr": ""}], "arS": [["ثم إننا، نحن ", []], ["الباقين", ["G4035"]], [" ", []], ["أحياء", ["G2198"]], ["، ", []], ["نختطف", ["G726"]], [" ", []], ["جميعا", ["G260"]], [" في ", []], ["السحب", ["G3507"]], [" ", []], ["للاجتماع", ["G529"]], [" ", []], ["بالرب", ["G2962"]], [" في ", []], ["الهواء", ["G109"]], [". ", []], ["وهكذا", ["G3779"]], [" نبقى مع ", []], ["الرب", ["G2962"]], [" على ", []], ["الدوام", ["G3842"]], [".", []]]}, {"c": 4, "v": 18, "text": "لذلك عزوا بعضكم بعضا بهذا الكلام!", "groups": [{"kw": "Wherefore", "raw": "1Th_5:11, 1Th_5:14; Isa_40:1, Isa_40:2; Luk_21:28; Heb_12:12", "note": "", "refs": [{"l": "1Th 5:11", "n": "", "vs": [[11, "لذلك عزوا بعضكم بعضا وشددوا أحدكم الآخر، كما أنتم فاعلون."]]}, {"l": "1Th 5:14", "n": "", "vs": [[14, "إلا أننا نناشدكم، أيها الإخوة، أن تعظوا الفوضويين، وتشددوا فاقدي العزم، وتساندوا الضعفاء، وتعاملوا الجميع بطول البال."]]}, {"l": "Isa 40:1", "n": "", "vs": [[1, "يقول إلهكم: «واسوا، واسوا شعبي!"]]}, {"l": "Isa 40:2", "n": "", "vs": [[2, "طيبوا خاطر أورشليم وبلغوها أن أيام محنتها قد انتهت، وإثمها قد غفر، وتلقت من يد الرب ضعفين عن جميع ما ارتكبته من خطايا»."]]}, {"l": "Luk 21:28", "n": "", "vs": [[28, "ولكن عندما تبدأ هذه الأمور تحدث، فانتصبوا وارفعوا رؤوسكم لأن فداءكم يقترب»."]]}, {"l": "Heb 12:12", "n": "", "vs": [[12, "لذلك، شددوا أيديكم المرتخية، وركبكم المنحلة."]]}], "kwAr": "لذلك", "noteAr": ""}, {"kw": "comfort", "raw": "or, exhort, Heb_10:24, Heb_10:25", "note": "or, exhort, Heb_10:24, Heb_10:25", "refs": [{"l": "Heb 10:24", "n": "", "vs": [[24, "وعلى كل واحد منا أن ينتبه للآخرين، لنحث بعضنا بعضا على المحبة والأعمال الصالحة."]]}, {"l": "Heb 10:25", "n": "", "vs": [[25, "وعلينا ألا ننقطع عن الاجتماع معا، كما تعود بعضكم أن يفعل. إنما، يجدر بكم أن تحثوا وتشجعوا بعضكم بعضا، وتواظبوا على هذا بقدر ما ترون ذلك اليوم يقترب."]]}], "kwAr": "عزوا بعضكم بعضا", "noteAr": "أو: عظوا (حرّضوا)."}], "arS": [["لذلك", ["G5620"]], [" ", []], ["عزوا", ["G3870"]], [" ", []], ["بعضكم بعضا", ["G240"]], [" بهذا ", []], ["الكلام", ["G3056"]], ["!", []]]}, {"c": 5, "v": 1, "text": "أما مسألة الأزمنة والأوقات المحددة، فلستم في حاجة لأن يكتب إليكم فيها.", "groups": [{"kw": "the times", "raw": "Mat_24:3, Mat_24:36; Mar_13:30-32; Act_1:7", "note": "", "refs": [{"l": "Mat 24:3", "n": "", "vs": [[3, "وبينما كان جالسا على جبل الزيتون، تقدم إليه التلاميذ على انفراد وقالوا له: «أخبرنا متى يحدث هذا. وما هي علامة رجوعك وانتهاء الزمان؟»"]]}, {"l": "Mat 24:36", "n": "", "vs": [[36, "أما ذلك اليوم وتلك الساعة، فلا يعرفهما أحد، ولا ملائكة السماوات، إلا الآب وحده."]]}, {"l": "Mar 13:30-32", "n": "", "vs": [[30, "الحق أقول لكم: لا يزول هذا الجيل أبدا حتى تحدث هذه الأمور كلها."], [31, "إن السماء والأرض تزولان، ولكن كلامي لا يزول أبدا."], [32, "وأما ذلك اليوم وتلك الساعة فلا يعرفهما أحد، لا الملائكة الذين في السماء ولا الابن، إلا الآب."]]}, {"l": "Act 1:7", "n": "", "vs": [[7, "فأجابهم: «ليس لكم أن تعرفوا المواعيد والأوقات التي حددها الآب بسلطته."]]}], "kwAr": "الأزمنة والأوقات", "noteAr": ""}, {"kw": "ye", "raw": "1Th_4:9; 2Co_9:1; Jud_1:3", "note": "", "refs": [{"l": "1Th 4:9", "n": "", "vs": [[9, "أما المحبة الأخوية، فلستم في حاجة لأن أكتب إليكم عنها، لأنكم بأنفسكم قد تعلمتم من الله أن تحبوا بعضكم بعضا،"]]}, {"l": "2Co 9:1", "n": "", "vs": [[1, "فإنه من غير الضروري أن أكتب إليكم في موضوع إعانة القديسين،"]]}, {"l": "Jud 1:3", "n": "", "vs": [[3, "أيها الأحباء، كنت قد نويت أن أكتب إليكم في موضوع الخلاص الذي نشترك فيه جميعا. ولكن، أراني الآن مضطرا لأن أكتب لأشجعكم على الجهاد في سبيل الإيمان الذي سلم مرة واحدة للقديسين."]]}], "kwAr": "فلستم في حاجة", "noteAr": ""}], "arS": [["أما مسألة ", []], ["الأزمنة", ["G5550"]], [" ", []], ["والأوقات", ["G2540"]], [" المحددة، فلستم في ", []], ["حاجة", ["G5532"]], [" لأن ", []], ["يكتب", ["G1125"]], [" إليكم فيها.", []]]}, {"c": 5, "v": 2, "text": "لأنكم تعلمون يقينا أن يوم الرب سيأتي كما يأتي اللص في الليل.", "groups": [{"kw": "know", "raw": "Jer_23:20", "note": "", "refs": [{"l": "Jer 23:20", "n": "", "vs": [[20, "فغضب الرب لن يرتد حتى ينجز مقاصد قلبه التي ستدركونها بوضوح في آخر الأيام."]]}], "kwAr": "تعلمون يقينا", "noteAr": ""}, {"kw": "the day", "raw": "Mat_24:42-44, Mat_25:13; Mar_13:34, Mar_13:35; Luk_12:39, Luk_12:40; 2Pe_3:10; Rev_3:3; Rev_16:15", "note": "", "refs": [{"l": "Mat 24:42-44", "n": "", "vs": [[42, "فاسهروا إذن، لأنكم لا تعرفون في أية ساعة يرجع ربكم."], [43, "واعلموا أنه لو عرف رب البيت في أي ربع من الليل يدهمه اللص، لظل ساهرا ولم يدع بيته ينقب."], [44, "فكونوا أنتم أيضا على استعداد، لأن ابن الإنسان سيرجع في ساعة لا تتوقعونها!"]]}, {"l": "Mat 25:13", "n": "", "vs": [[13, "فاسهروا إذن، لأنكم لا تعرفون اليوم ولا الساعة!"]]}, {"l": "Mar 13:34", "n": "", "vs": [[34, "فالأمر أشبه بإنسان مسافر، ترك بيته، وأعطى عبيده السلطة معينا لكل واحد عمله، وأوصى حارس الباب أن يسهر."]]}, {"l": "Mar 13:35", "n": "", "vs": [[35, "إذن اسهروا، لأنكم لا تعرفون متى يعود رب البيت: أمساء، أم في منتصف الليل، أم عند صياح الديك، أم صباحا،"]]}, {"l": "Luk 12:39", "n": "", "vs": [[39, "ولكن اعلموا هذا: أنه لو كان رب البيت يعرف في أية ساعة يدهمه اللص، لكان سهر وما ترك بيته ينقب."]]}, {"l": "Luk 12:40", "n": "", "vs": [[40, "فكونوا أنتم مستعدين، لأن ابن الإنسان سيعود في ساعة لا تتوقعونها»."]]}, {"l": "2Pe 3:10", "n": "", "vs": [[10, "إلا أن «يوم الرب» سيأتي كما يأتي اللص في الليل. في ذلك اليوم، تزول السماوات محدثة دويا هائلا وتنحل العناصر محترقة بنار شديدة، وتحترق الأرض وما فيها من منجزات."]]}, {"l": "Rev 3:3", "n": "", "vs": [[3, "تذكر ما سبق أن تقبلته وسمعته، وتمسك بما آمنت به، وتب! فإن كنت لا تتنبه، آتيك كما يأتي اللص، ولا تدري في أية ساعة أفاجئك!"]]}, {"l": "Rev 16:15", "n": "", "vs": [[15, "»ها أنا آت كما يأتي اللص، طوبى لمن يكون بانتظاري، ساهرا وحارسا لثيابه، لئلا يمشي عريانا فيرى الناس عورته!«"]]}], "kwAr": "يوم الرب", "noteAr": ""}], "arS": [["لأنكم ", []], ["تعلمون", ["G1492"]], [" ", []], ["يقينا", ["G199"]], [" أن ", []], ["يوم", ["G2250"]], [" ", []], ["الرب", ["G2962"]], [" ", []], ["سيأتي", ["G2064"]], [" كما يأتي ", []], ["اللص", ["G2812"]], [" في ", []], ["الليل", ["G3571"]], [".", []]]}, {"c": 5, "v": 3, "text": "فبينما الناس يقولون: حل السلام والأمن! ينزل بهم الهلاك المفاجيء كالمخاض الذي يدهم الحبلى، فلا يستطيعون أبدا أن يفلتوا.", "groups": [{"kw": "Peace", "raw": "Deu_29:19; Jdg_18:27, Jdg_18:28; Psa_10:11-13; Isa_21:4, Isa_56:12; Dan_5:3-6; Nah_1:10; Mat_24:37-39; Luk_17:26-30, Luk_21:34, Luk_21:35", "note": "", "refs": [{"l": "Deu 29:19", "n": "", "vs": [[19, "فإن سمع كلام هذا القسم يستمطر بركة على نفسه قائلا: «سأكون آمنا حتى ولو أصررت على الاستمرار فى سلوك طريقي إن هذا يفضي إلى فناء الأخضر واليابس على حد سواء."]]}, {"l": "Jdg 18:27", "n": "", "vs": [[27, "أما الدانيون فقد أقبلوا إلى لايش ومعهم أصنام ميخا والكاهن، فوجدوا شعبها آمنا مطمئنا مسالما، فهاجموها وقتلوا أهلها بحد السيف وأحرقوها."]]}, {"l": "Jdg 18:28", "n": "", "vs": [[28, "ولم يهب أحد لإنقاذها لأنها كانت بعيدة عن صيدون، ولم يعقد أهلها أحلافا مع أحد. وكانت المدينة تقع في الوادي الذي فيه بيت رحوب. وأعاد الدانيون بناء المدينة وأقاموا فيها،"]]}, {"l": "Psa 10:11-13", "n": "", "vs": [[11, "يقول في قلبه: الله غافل. قد حجب وجهه، ولن يرى ما يجري"], [12, "قم يارب، ارفع يدك ياالله ، لا تنس المساكين."], [13, "لماذا يستهين الشرير بالله قائلا في قلبه: إنك لا تحاسبه؟"]]}, {"l": "Isa 21:4", "n": "", "vs": [[4, "تحير قلبي، وأرعبني الفزع، فتحول ليلي الذي كنت أتوق إليه إلى رعدة."]]}, {"l": "Isa 56:12", "n": "", "vs": [[12, "قائلين: تعالوا نأتي بالخمر، ونشرب مسكرا حتى الثمالة، فالغد يكون مماثلا لهذا اليوم، بل أعظم منه."]]}, {"l": "Dan 5:3-6", "n": "", "vs": [[3, "فأحضروها وشرب بها الملك ونبلاء مملكته وزوجاته ومحظياته"], [4, "وأخذوا يسبحون آلهة الذهب والفضة والنحاس والحديد والخشب والحجر."], [5, "فظهرت أصابع يد إنسان وخطت بإزاء المصباح على كلس جدار قصر الملك، والملك يشهد اليد الكاتبة."], [6, "عندئذ شحب وجه الملك وأفزعته أفكاره واصطكت ركبتاه واعتراه الانهيار،"]]}, {"l": "Nah 1:10", "n": "", "vs": [[10, "وتلتهمهم النار كما تلتهم شجرة عليق كثيفة أو سكارى مترنحين من خمرهم أو حزمة قش جافة."]]}, {"l": "Mat 24:37-39", "n": "", "vs": [[37, "وكما كانت الحال في زمن نوح، كذلك ستكون عند رجوع ابن الإنسان:"], [38, "فقد كان الناس في الأيام السابقة للطوفان يأكلون ويشربون ويتزوجون ويزوجون، حتى فاجأهم اليوم الذي دخل فيه نوح السفينة،"], [39, "ونزل الطوفان وهم لاهون فأخذ الجميع. هكذا ستكون الحال عند رجوع ابن الإنسان:"]]}, {"l": "Luk 17:26-30", "n": "", "vs": [[26, "وكما حدث في زمان نوح، هكذا أيضا سوف يحدث في زمان ابن الإنسان:"], [27, "كان الناس يأكلون ويشربون ويتزوجون ويزوجون، إلى اليوم الذي فيه دخل نوح السفينة وجاء الطوفان فأهلك الجميع."], [28, "وكذلك، كما حدث في زمان لوط: كانوا يأكلون ويشربون ويشترون ويبيعون ويغرسون ويبنون،"], [29, "ولكن في اليوم الذي فيه خرج لوط من سدوم، أمطر (الله ) من السماء نارا وكبريتا، فأهلك الجميع"], [30, "هكذا سيحدث في يوم ظهور ابن الإنسان."]]}, {"l": "Luk 21:34", "n": "", "vs": [[34, "ولكن احذروا لأنفسكم لئلا تتثقل قلوبكم بالانغماس في اللذات وبالسكر وهموم الحياة، فيدهمكم ذلك اليوم فجأة؛"]]}, {"l": "Luk 21:35", "n": "", "vs": [[35, "فإنه سوف يطبق كالفخ على جميع الساكنين على وجه الأرض كلها."]]}], "kwAr": "حل السلام والأمن", "noteAr": ""}, {"kw": "then", "raw": "Exo_15:9, Exo_15:10; Jos_8:20-22; Jdg_20:41, Jdg_20:42; 2Ch_32:19-21; Psa_73:18-20; Pro_29:1; Isa_30:13; Luk_17:27-29, Luk_21:34, Luk_21:35; Act_12:22, Act_12:23, Act_13:41; 2Th_1:9; 2Pe_2:4; Rev_18:7, Rev_18:8", "note": "", "refs": [{"l": "Exo 15:9", "n": "", "vs": [[9, "قال العدو: أسعى وراءهم فأدركهم. أقسم أسلابهم وتشتفي منهم نفسي. أستل سيفي بيدي وأهلكهم."]]}, {"l": "Exo 15:10", "n": "", "vs": [[10, "لكنك أطلقت ريحك فغشيهم البحر، فغرقوا كالرصاص في اللجج العميقة"]]}, {"l": "Jos 8:20-22", "n": "", "vs": [[20, "فالتفت رجال عاي وراءهم وإذ بهم يشاهدون دخان المدينة يتصاعد إلى السماء، فلم يكن لهم من مهرب، فانقلب الجيش الهارب إلى الصحراء على مطارديه."], [21, "ولما رأى يشوع ومحاربوه أن الكمين قد استولى على المدينة، وأن دخانها قد ملأ الفضاء، شرعوا في مهاجمة رجال عاي والقضاء عليهم."], [22, "كذلك خرج الكمين من المدينة لقطع طريق الهرب عليهم. فوجد أهل عاي أنفسهم محصورين بين الإسرائيليين من الأمام ومن الخلف، ففتك بهم الإسرائيليون، فلم ينج منهم أحد."]]}, {"l": "Jdg 20:41", "n": "", "vs": [[41, "فانكفأ رجال إسرائيل على البنيامينيين الذين فروا مرعوبين لأنهم أدركوا أن الكارثة قد أحاقت بهم."]]}, {"l": "Jdg 20:42", "n": "", "vs": [[42, "وتقهقروا أمام بني إسرائيل في طريق الصحراء. ولكن الحرب أدركتهم، وخرج رجال الكمين من المدن وقطعوا عليهم الطريق، فهلك البنيامينيون بين الفريقين."]]}, {"l": "2Ch 32:19-21", "n": "", "vs": [[19, "وكان تهجمهم على الرب إله أورشليم مماثلا لتهجمهم على أصنام الشعوب الأخرى التي صنعتها أيدي الناس."], [20, "فصلى حزقيا الملك وإشعياء بن آموص النبي، واستغاثا بالسماء من جراء ذلك،"], [21, "فأرسل الرب ملاكا فأباد كل بطل صنديد ورئيس وقائد في معسكر ملك أشور، فرجع إلى أرضه مخذولا. وعندما دخل معبد إلهه اغتاله هناك أولاده بالسيف"]]}, {"l": "Psa 73:18-20", "n": "", "vs": [[18, "حقا إنك أوقفتهم في أماكن زلقة، وأوقعتهم في التهلكات."], [19, "كيف صاروا للخر اب فجأة؟ انقرضوا وأفنتهم الدواهي."], [20, "كحلم يتلاشى عند اليقظة هكذا تختفي صورتهم عندما تنهض يارب لمعاقبتهم."]]}, {"l": "Pro 29:1", "n": "", "vs": [[1, "من كثر توبيخه وظل معتصما بعناده، يتحطم فجأة ولا شفاء له."]]}, {"l": "Isa 30:13", "n": "", "vs": [[13, "لذلك يصبح هذا الذنب لكم كصدع ناتيء في سور عال مشرف على الانهيار الذي يحدث بغتة وفى لحظة"]]}, {"l": "Luk 17:27-29", "n": "", "vs": [[27, "كان الناس يأكلون ويشربون ويتزوجون ويزوجون، إلى اليوم الذي فيه دخل نوح السفينة وجاء الطوفان فأهلك الجميع."], [28, "وكذلك، كما حدث في زمان لوط: كانوا يأكلون ويشربون ويشترون ويبيعون ويغرسون ويبنون،"], [29, "ولكن في اليوم الذي فيه خرج لوط من سدوم، أمطر (الله ) من السماء نارا وكبريتا، فأهلك الجميع"]]}, {"l": "Luk 21:34", "n": "", "vs": [[34, "ولكن احذروا لأنفسكم لئلا تتثقل قلوبكم بالانغماس في اللذات وبالسكر وهموم الحياة، فيدهمكم ذلك اليوم فجأة؛"]]}, {"l": "Luk 21:35", "n": "", "vs": [[35, "فإنه سوف يطبق كالفخ على جميع الساكنين على وجه الأرض كلها."]]}, {"l": "Act 12:22", "n": "", "vs": [[22, "فهتف الشعب قائلين: «هذا صوت إله لا صوت إنسان!»"]]}, {"l": "Act 12:23", "n": "", "vs": [[23, "فضربه ملاك من عند الرب في الحال لأنه لم يعط المجد لله، فأكله الدود ومات!"]]}, {"l": "Act 13:41", "n": "", "vs": [[41, "انظروا أيها المتهاونون، وتعجبوا واهلكوا! فإني أعمل في أيامكم عملا لو حدثكم به أحد لما صدقتم!»‍"]]}, {"l": "2Th 1:9", "n": "", "vs": [[9, "فهؤلاء سيكابدون عقاب الهلاك الأبدي، بعيدا من حضرة الرب ومن مجد قوته،"]]}, {"l": "2Pe 2:4", "n": "", "vs": [[4, "فإن الله لم يشفق على الملائكة الذين أخطأوا، بل طرحهم في أعماق هاوية الظلام مقيدين بالسلاسل، حيث يظلون محبوسين إلى يوم الحساب."]]}, {"l": "Rev 18:7", "n": "", "vs": [[7, "أنزلوا بها من العذاب والشقاء على قدر ما عظمت نفسها وترفهت. فإنها تقول في نفسها: أنا ملكة على العرش، ولست أرملة، ولن أذوق طعم الحزن."]]}, {"l": "Rev 18:8", "n": "", "vs": [[8, "لذلك ستنقض عليها البلايا في يوم واحد، من موت وحزن وجوع، وستحترق بالنار، فإن الله الذي يدينها هو رب قدير."]]}], "kwAr": "ينزل بهم الهلاك المفاجيء", "noteAr": ""}, {"kw": "as", "raw": "Psa_48:6; Isa_43:6-9, Isa_21:3; Jer_4:31, Jer_6:24, Jer_13:21, Jer_22:23; Hos_13:13; Mic_4:9, Mic_4:10", "note": "", "refs": [{"l": "Psa 48:6", "n": "", "vs": [[6, "هناك اعترتهم رعدة فتوجعوا كامرأة في مخاضها."]]}, {"l": "Isa 43:6-9", "n": "", "vs": [[6, "أقول للشمال: أطلقهم من عقالك، وللجنوب لا تحجزهم. اجمع أبنائي من بعيد وبناتي من أقاصي الأرض،"], [7, "كل من يدعى باسمي ممن خلقته لمجدي وجبلته وصنعته»."], [8, "أخرج الشعب الأعمى وإن كانت له عيون، والأصم وإن كانت له آذان."], [9, "لتجتمع الأمم بأسرها، ولتحتشد الشعوب. من منهم ينبيء بهذا، ويخبرنا بالأمور السالفة؟ ليقدموا شهودهم إثباتا لصدقهم، أو ليسمعوا ويقولوا: هذا صدق."]]}, {"l": "Isa 21:3", "n": "", "vs": [[3, "لذلك امتلأت حقواى ألما، وانتابني مخاض كمخاض الوالدة. فقدت الوعي من جراء ما سمعت، وذهلت مما رأيت"]]}, {"l": "Jer 4:31", "n": "", "vs": [[31, "لأني سمعت صرخة كصرخة امرأة في مخاض، وأنة عذاب كعذاب من تقاسي في ولادة بكرها. إنها صرخة ابنة صهيون التي تزفر لاهثة وتبسط يديها قائلة: «ويل لي! قد غشي علي أمام القتلة»."]]}, {"l": "Jer 6:24", "n": "", "vs": [[24, "سمعنا أخبارهم المرعبة فدب الوهن في أيدينا، وتولانا كرب وألم كألم امرأة تعاني من المخاض."]]}, {"l": "Jer 13:21", "n": "", "vs": [[21, "ماذا تقولين حين يقيم الرب عليك رؤساء أولئك الذين علمتهم أن يكونوا لك أحلافا؟ أفلا تنتابك الأوجاع كامرأة ماخض؟"]]}, {"l": "Jer 22:23", "n": "", "vs": [[23, "ياساكنة لبنان المعششة في الأرز، لشد ما تئنين عندما تفاجئك الأوجاع، فتكونين كامرأة تقاسي من المخاض»."]]}, {"l": "Hos 13:13", "n": "", "vs": [[13, "آلام مخاض امرأة مشرفة على الولادة حلت به، ولكنه ابن جاهل يأبى أن يقترب من فوهة الرحم عند أوان ولادته."]]}, {"l": "Mic 4:9", "n": "", "vs": [[9, "لماذا تنوحين بصوت مرتفع؟ أليس فيك ملك؟ هل هلك مشيرك حتى ألم بك الألم كامرأة تقاسي من المخاض."]]}, {"l": "Mic 4:10", "n": "", "vs": [[10, "تلوي وجعا وتأوهي ياابنة صهيون كامرأة تعاني من المخاض، لأنك الآن تخرجين من المدينة لتقيمي في الصحراء. ستذهبين إلى بابل، وهناك يتم إنقاذك لأن الرب يفتديك هناك من أيدي أعدائك."]]}], "kwAr": "كالمخاض", "noteAr": ""}, {"kw": "and they", "raw": "Mat_23:33; Heb_2:3, Heb_12:23", "note": "", "refs": [{"l": "Mat 23:33", "n": "", "vs": [[33, "أيها الحيات، أولاد الأفاعي! كيف تفلتون من عقاب جهنم؟"]]}, {"l": "Heb 2:3", "n": "", "vs": [[3, "فكيف نفلت نحن إن أهملنا هذا الخلاص العظيم جدا؟ فإن الرب يسوع نفسه قد أعلنه أولا، ثم تثبت لنا من الذين سمعوه مباشرة."]]}, {"l": "Heb 12:23", "n": "", "vs": [[23, "إلى كنيسة تجمع أبناء لله أبكارا، أسماؤهم مكتوبة في السماء. بل إلى الله نفسه، ديان الجميع، وإلى أرواح أناس بررهم الله وجعلهم كاملين."]]}], "kwAr": "فلا يستطيعون أبدا أن يفلتوا", "noteAr": ""}], "arS": [["فبينما الناس ", []], ["يقولون", ["G3004"]], [": حل ", []], ["السلام", ["G1515"]], [" ", []], ["والأمن", ["G803"]], ["! ", []], ["ينزل", ["G2186"]], [" بهم ", []], ["الهلاك", ["G3639"]], [" ", []], ["المفاجيء", ["G160"]], [" ", []], ["كالمخاض", ["G5604"]], [" الذي يدهم ", []], ["الحبلى", ["G1064"]], ["، فلا يستطيعون أبدا أن ", []], ["يفلتوا", ["G1628"]], [".", []]]}, {"c": 5, "v": 4, "text": "غير أنكم أنتم، أيها الإخوة، لستم في الظلام حتى يفاجئكم ذلك اليوم كأنه لص.", "groups": [{"kw": "are", "raw": "Rom_13:11-13; Col_1:13; 1Pe_2:9, 1Pe_2:10; 1Jo_2:8", "note": "", "refs": [{"l": "Rom 13:11-13", "n": "", "vs": [[11, "وفوق هذا، فأنتم تعرفون الوقت، وأنها الآن الساعة التي يجب أن نستيقظ فيها من النوم. فخلاصنا الآن، أقرب إلينا مما كان يوم آمنا:"], [12, "كاد الليل أن ينتهي والنهار أن يطلع. فلنطرح أعمال الظلام، ونلبس سلاح النور"], [13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."]]}, {"l": "Col 1:13", "n": "", "vs": [[13, "هو الذي أنقذنا من سلطة الظلام ونقلنا إلى ملكوت ابن محبته"]]}, {"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}, {"l": "1Pe 2:10", "n": "", "vs": [[10, "فإنكم في الماضي لم تكونوا شعبا؛ أما الآن، فأنتم «شعب الله وقد كنتم سابقا لا تتمتعون برحمة الله، أما الآن، فإنكم تتمتعون بها!»"]]}, {"l": "1Jo 2:8", "n": "", "vs": [[8, "ومع ذلك فالوصية التي أكتبها إليكم، هي جديدة دائما، وتتضح حقيقتها في المسيح كما تتضح فيكم أنتم. ذلك لأن الظلام قد بدأ يزول منذ أن أشرق النور الحقيقي الذي مازال الآن مشرقا."]]}], "kwAr": "لستم في الظلام", "noteAr": ""}, {"kw": "overtake", "raw": "Deu_19:6, Deu_28:15, Deu_28:45; Jer_42:16; Hos_10:9; Zec_1:6", "note": "", "refs": [{"l": "Deu 19:6", "n": "", "vs": [[6, "لئلا يسعى طالب الثأر وراءه عند احتدام نقمته ويدركه إذا طالت الطريق ويقتله، مع أنه لا يستحق جزاء الموت، لأن القاتل لم يضمر البغضاء للمقتول من قبل"]]}, {"l": "Deu 28:15", "n": "", "vs": [[15, "ولكن إن عصيتم صوت الرب إلهكم ولم تحرصوا على العمل بجميع وصاياه وفرائضه التي أنا آمركم اليوم بها، فإن جميع هذه اللعنات تحل بكم وتلازمكم."]]}, {"l": "Deu 28:45", "n": "", "vs": [[45, "وتحل بكم هذه اللعنات وتلازمكم وتلاحقكم حتى تهلكوا، لأنكم لم تطيعوا صوت الرب إلهكم لتحفظوا وصاياه وفرائضه التي أمركم بها،"]]}, {"l": "Jer 42:16", "n": "", "vs": [[16, "فالسيف الكلداني الذي تخشونه يدرككم هناك في ديار مصر، والجوع الذي تفزعون منه يلاحقكم إلى مصر فتموتون هناك."]]}, {"l": "Hos 10:9", "n": "", "vs": [[9, "لقد أخطأت ياإسرائيل منذ أيام جبعة ولم تكف عن ارتكاب الإثم، ألم تدركهم الحرب في جبعة؟"]]}, {"l": "Zec 1:6", "n": "", "vs": [[6, "ولكن ألم تدرك أقوالي وفرائضي التي أمرت بها عبيدي الأنبياء آباءكم فتابوا قائلين: لقد نفذ الرب القدير ما عزم أن يعاقبنا بمقتضى ما ارتكبناه من أعمال باطلة؟»"]]}], "kwAr": "حتى يفاجئكم", "noteAr": ""}], "arS": [["غير أنكم أنتم، أيها ", []], ["الإخوة", ["G80"]], ["، لستم في ", []], ["الظلام", ["G4655"]], [" حتى ", []], ["يفاجئكم", ["G2638"]], [" ذلك ", []], ["اليوم", ["G2250"]], [" كأنه ", []], ["لص", ["G2812"]], [".", []]]}, {"c": 5, "v": 5, "text": "فأنتم جميعا أبناء النور وأبناء النهار. إننا لسنا أهل الليل ولا أهل الظلام.", "groups": [{"kw": "", "raw": "Luk_16:8; Joh_12:36; Act_26:18; Eph_5:8", "note": "", "refs": [{"l": "Luk 16:8", "n": "", "vs": [[8, "فامتدح السيد وكيله الخائن لأنه تصرف بحكمة. فإن أبناء هذا العالم أحكم مع أهل جيلهم من أبناء النور."]]}, {"l": "Joh 12:36", "n": "", "vs": [[36, "آمنوا بالنور مادام النور معكم، فتصيروا أبناء النور»."]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "Eph 5:8", "n": "", "vs": [[8, "فقد كنتم في الماضي ظلاما، ولكنكم الآن نور في الرب. فاسلكوا سلوك أولاد النور."]]}], "kwAr": "", "noteAr": ""}], "arS": [["فأنتم ", []], ["جميعا", ["G3956"]], [" ", []], ["أبناء", ["G5207"]], [" ", []], ["النور", ["G5457"]], [" ", []], ["وأبناء", ["G5207"]], [" ", []], ["النهار", ["G2250"]], [". إننا لسنا أهل ", []], ["الليل", ["G3571"]], [" ولا أهل ", []], ["الظلام", ["G4655"]], [".", []]]}, {"c": 5, "v": 6, "text": "إذن، لا ننم كما ينام الآخرون، بل لنظل ساهرين وصاحين،", "groups": [{"kw": "let us not", "raw": "Pro_19:15; Isa_56:10; Jon_1:6; Mat_13:25, Mat_25:5; Mar_14:37; Luk_22:46; Rom_13:11-14; 1Co_15:34; Eph_5:14", "note": "", "refs": [{"l": "Pro 19:15", "n": "", "vs": [[15, "الكسل يغرق في سبات عميق، والنفس المتقاعسة تقاسي من الجوع."]]}, {"l": "Isa 56:10", "n": "", "vs": [[10, "فإن رقباءهم عمي، وكلهم جهال، وكلاب بكم عاجزون عن النباح، حالمون راقدون مولعون بالنوم."]]}, {"l": "Jon 1:6", "n": "", "vs": [[6, "فاقترب منه الربان وقال له: «ما بالك مستغرقا في النوم؟ قم وتضرع إلى إلهك لعل الله يذكرنا فلا نهلك»."]]}, {"l": "Mat 13:25", "n": "", "vs": [[25, "وبينما الناس نائمون، جاء عدوه، وبذر زوانا في وسط القمح، ومضى."]]}, {"l": "Mat 25:5", "n": "", "vs": [[5, "وإذ أبطأ العريس، نعسن جميعا ونمن."]]}, {"l": "Mar 14:37", "n": "", "vs": [[37, "ثم رجع فوجد تلاميذه نائمين، فقال لبطرس: «هل أنت نائم ياسمعان؟ ألم تقدر أن تسهر ساعة واحدة؟"]]}, {"l": "Luk 22:46", "n": "", "vs": [[46, "فقال لهم: «ما بالكم نائمين؟ قوموا وصلوا لكي لا تدخلوا في تجربة!»"]]}, {"l": "Rom 13:11-14", "n": "", "vs": [[11, "وفوق هذا، فأنتم تعرفون الوقت، وأنها الآن الساعة التي يجب أن نستيقظ فيها من النوم. فخلاصنا الآن، أقرب إلينا مما كان يوم آمنا:"], [12, "كاد الليل أن ينتهي والنهار أن يطلع. فلنطرح أعمال الظلام، ونلبس سلاح النور"], [13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."], [14, "وإنما البسوا الرب يسوع المسيح (تمثلوا به)، ولا تنشغلوا بالتدبير للجسد لقضاء شهواته."]]}, {"l": "1Co 15:34", "n": "", "vs": [[34, "عودوا إلى الصواب كما يجب ولا تخطئوا، فإن بعضا منكم يجهلون الله تماما أقول هذا لكي تخجلوا!"]]}, {"l": "Eph 5:14", "n": "", "vs": [[14, "لأن الذي يكشف كل شيء هو النور. لذلك يقال: «استيقظ أيها النائم، وقم من بين الأموات، فيشرق عليك نور المسيح!»"]]}], "kwAr": "لا ننم", "noteAr": ""}, {"kw": "watch", "raw": "Mat_24:42, Mat_25:13, Mat_26:38, Mat_26:40,Mat_26:41; Mar_13:34, Mar_13:35, Mar_13:37, Mar_14:38; Luk_12:37, Luk_12:39; Luk_21:36, Luk_22:46; Act_20:31; 1Co_16:13; Eph_6:18; Col_4:2; 2Ti_4:5; 1Pe_4:7; Rev_3:2, Rev_16:15", "note": "", "refs": [{"l": "Mat 24:42", "n": "", "vs": [[42, "فاسهروا إذن، لأنكم لا تعرفون في أية ساعة يرجع ربكم."]]}, {"l": "Mat 25:13", "n": "", "vs": [[13, "فاسهروا إذن، لأنكم لا تعرفون اليوم ولا الساعة!"]]}, {"l": "Mat 26:38", "n": "", "vs": [[38, "فقال لهم: «نفسي حزينة جدا حتى الموت! ابقوا هنا واسهروا معي!»"]]}, {"l": "Mat 26:40", "n": "", "vs": [[40, "ورجع إلى التلاميذ فوجدهم نائمين، فقال لبطرس: «أهكذا لم تقدروا أن تسهروا معي ساعة واحدة؟"]]}, {"l": "Mat 26:41", "n": "", "vs": [[41, "اسهروا وصلوا لكي لا تدخلوا في تجربة. إن الروح نشيط؛ أما الجسد فضعيف»."]]}, {"l": "Mar 13:34", "n": "", "vs": [[34, "فالأمر أشبه بإنسان مسافر، ترك بيته، وأعطى عبيده السلطة معينا لكل واحد عمله، وأوصى حارس الباب أن يسهر."]]}, {"l": "Mar 13:35", "n": "", "vs": [[35, "إذن اسهروا، لأنكم لا تعرفون متى يعود رب البيت: أمساء، أم في منتصف الليل، أم عند صياح الديك، أم صباحا،"]]}, {"l": "Mar 13:37", "n": "", "vs": [[37, "وما أقوله لكم، أقوله للجميع: اسهروا! »"]]}, {"l": "Mar 14:38", "n": "", "vs": [[38, "اسهروا وصلوا لئلا تدخلوا في تجربة. إن الروح نشيط، وأما الجسد فضعيف»."]]}, {"l": "Luk 12:37", "n": "", "vs": [[37, "طوبى لأولئك العبيد الذين يجدهم سيدهم لدى عودته ساهرين. الحق أقول لكم: إنه يشد وسطه بالحزام ويجعلهم يتكئون ويقوم يخدمهم."]]}, {"l": "Luk 12:39", "n": "", "vs": [[39, "ولكن اعلموا هذا: أنه لو كان رب البيت يعرف في أية ساعة يدهمه اللص، لكان سهر وما ترك بيته ينقب."]]}, {"l": "Luk 21:36", "n": "", "vs": [[36, "فاسهروا إذن وتضرعوا في كل حين، لكي تتمكنوا من أن تنجوا من جميع هذه الأمور التي هي على وشك أن تحدث، وتقفوا أمام ابن الإنسان»."]]}, {"l": "Luk 22:46", "n": "", "vs": [[46, "فقال لهم: «ما بالكم نائمين؟ قوموا وصلوا لكي لا تدخلوا في تجربة!»"]]}, {"l": "Act 20:31", "n": "", "vs": [[31, "لذلك كونوا متيقظين، وتذكروا أني، مدة ثلاث سنين، لم أتوقف ليلا ونهارا عن نصح كل واحد منكم وأنا أذرف الدموع."]]}, {"l": "1Co 16:13", "n": "", "vs": [[13, "كونوا متيقظين حذرين. اثبتوا في الإيمان. كونوا رجالا. كونوا أقوياء."]]}, {"l": "Eph 6:18", "n": "", "vs": [[18, "كونوا مصلين في كل حال، بكل صلاة وطلبة في الروح، وساهرين لهذا الغرض عينه مواظبين تماما على جميع الطلبات لأجل القديسين جميعا،"]]}, {"l": "Col 4:2", "n": "", "vs": [[2, "داوموا على الصلاة، متيقظين فيها بالشكر،"]]}, {"l": "2Ti 4:5", "n": "", "vs": [[5, "أما أنت، فكن بصيرا في كل أمر، وتحمل المشقات، واعمل عمل المبشر، وأكمل خدمتك إلى التمام!"]]}, {"l": "1Pe 4:7", "n": "", "vs": [[7, "إن نهاية كل شيء قد صارت قريبة. فتعقلوا إذن، وكونوا متنبهين لرفع الصلاة دائما."]]}, {"l": "Rev 3:2", "n": "", "vs": [[2, "تيقظ، وما تبقى لديك أنعشه قبل أن يموت، لأني وجدت أعمالك غير كاملة في نظر إلهي."]]}, {"l": "Rev 16:15", "n": "", "vs": [[15, "»ها أنا آت كما يأتي اللص، طوبى لمن يكون بانتظاري، ساهرا وحارسا لثيابه، لئلا يمشي عريانا فيرى الناس عورته!«"]]}], "kwAr": "ساهرين", "noteAr": ""}, {"kw": "sober", "raw": "1Th_5:8; Phi_4:5; 1Ti_2:9, 1Ti_2:15, 1Ti_3:2, 1Ti_3:11; Tit_2:6, Tit_2:12; 1Pe_1:13, 1Pe_5:8", "note": "", "refs": [{"l": "1Th 5:8", "n": "", "vs": [[8, "وأما نحن، أهل النهار، فلنظل صاحين، متخذين من الإيمان والمحبة درعا لصدورنا، ومن الرجاء بالخلاص خوذة لرؤوسنا."]]}, {"l": "Phi 4:5", "n": "", "vs": [[5, "ليكن طول بالكم معروفا لدى الناس جميعا. إن الرب قريب."]]}, {"l": "1Ti 2:9", "n": "", "vs": [[9, "كما أريد أيضا، أن تظهر النساء بمظهر لائق محشوم اللباس، متزينات بالحياء والرزانة، غير متحليات بالجدائل والذهب واللاليء والحلل الغالية الثمن،"]]}, {"l": "1Ti 2:15", "n": "", "vs": [[15, "إلا أنها ستحفظ سالمة في ولادة الأولاد، على أن يثبتن في الإيمان والمحبة والقداسة مع الرزانة!"]]}, {"l": "1Ti 3:2", "n": "", "vs": [[2, "إذن، يجب أن يكون الراعي بلا عيب، زوجا لامرأة واحدة، نبيها عاقلا مهذبا مضيافا، قادرا على التعليم؛"]]}, {"l": "1Ti 3:11", "n": "", "vs": [[11, "كذلك يجب أن تكون النساء أيضا رزينات، غير نمامات، نبيهات، أمينات في كل شيء."]]}, {"l": "Tit 2:6", "n": "", "vs": [[6, "كذلك عظ الشبان أن يكونوا متعقلين،"]]}, {"l": "Tit 2:12", "n": "", "vs": [[12, "وهي تعلمنا أن نقطع علاقتنا بالإباحية والشهوات العالمية، وأن نحيا في العصر الحاضر حياة التعقل والبر والتقوى،"]]}, {"l": "1Pe 1:13", "n": "", "vs": [[13, "لذلك اجعلوا أذهانكم متنبهة دائما، وتيقظوا، وعلقوا رجاءكم كله على النعمة التي ستكون من نصيبكم عندما يعود يسوع المسيح ظاهرا بمجده!"]]}, {"l": "1Pe 5:8", "n": "", "vs": [[8, "تعقلوا وتنبهوا. إن خصمكم إبليس كأسد يزأر، يجول باحثا عن فريسة يبتلعها."]]}], "kwAr": "وصاحين", "noteAr": ""}], "arS": [["إذن، لا ", []], ["ننم", ["G2518"]], [" كما ينام ", []], ["الآخرون", ["G3062"]], ["، بل لنظل ", []], ["ساهرين", ["G1127"]], [" ", []], ["وصاحين", ["G3525"]], ["،", []]]}, {"c": 5, "v": 7, "text": "فإنه في الليل ينام الذين ينامون، وفي الليل يسكر الذين يسكرون", "groups": [{"kw": "they that sleep", "raw": "Job_4:13, Job_33:15; Luk_21:34, Luk_21:35; Rom_13:13; 1Co_15:34; Eph_5:14", "note": "", "refs": [{"l": "Job 4:13", "n": "", "vs": [[13, "ففي غمرة الهواجس، في رؤى الليل، عندما طغى السبات على الناس،"]]}, {"l": "Job 33:15", "n": "", "vs": [[15, "يتكلم في حلم، في رؤيا الليل عندما يغشى الناس سبات عميق."]]}, {"l": "Luk 21:34", "n": "", "vs": [[34, "ولكن احذروا لأنفسكم لئلا تتثقل قلوبكم بالانغماس في اللذات وبالسكر وهموم الحياة، فيدهمكم ذلك اليوم فجأة؛"]]}, {"l": "Luk 21:35", "n": "", "vs": [[35, "فإنه سوف يطبق كالفخ على جميع الساكنين على وجه الأرض كلها."]]}, {"l": "Rom 13:13", "n": "", "vs": [[13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."]]}, {"l": "1Co 15:34", "n": "", "vs": [[34, "عودوا إلى الصواب كما يجب ولا تخطئوا، فإن بعضا منكم يجهلون الله تماما أقول هذا لكي تخجلوا!"]]}, {"l": "Eph 5:14", "n": "", "vs": [[14, "لأن الذي يكشف كل شيء هو النور. لذلك يقال: «استيقظ أيها النائم، وقم من بين الأموات، فيشرق عليك نور المسيح!»"]]}], "kwAr": "ينام الذين ينامون", "noteAr": ""}, {"kw": "and they", "raw": "1Sa_25:36, 1Sa_25:37; Pro_23:29-35; Isa_21:4, Isa_21:5; Dan_5:4, Dan_5:5; Act_2:15; 2Pe_2:13", "note": "", "refs": [{"l": "1Sa 25:36", "n": "", "vs": [[36, "فأقبلت أبيجايل إلى نابال، فوجدت أنه قد أقام مأدبة في بيته كمأدبة ملك، وقد أخذته النشوة بعد أن أكثر من احتساء الخمر حتى سكر، فلم تخبره بشيء إطلاقا حتى صباح اليوم التالي."]]}, {"l": "1Sa 25:37", "n": "", "vs": [[37, "وفي الصباح، بعد أن صحا نابال من سكرته، أخبرته بما جرى، فأصابه الشلل وتجمد كحجر."]]}, {"l": "Pro 23:29-35", "n": "", "vs": [[29, "لمن المعاناة؟ لمن الويل والشقاء والمخاصمات والشكوى؟ لمن الجر اح بلا سبب؟ ولمن احمرار العينين؟"], [30, "إنها للمدمنين الخمر، الساعين وراء المسكر الممزوج."], [31, "لا تنظر إلى الخمر إذا التهبت بالاحمرار، وتألقت في الكأس، وسالت سائغة،"], [32, "فإنها في آخرها تلسع كالحية وتلدغ كالأفعوان."], [33, "فتشاهد عيناك أمورا غريبة، وقلبك يحدثك بأشياء ملتوية،"], [34, "فتكون مترنحا كمن يضطجع في وسط عباب البحر، أو كراقد على قمة سارية!"], [35, "فتقول: «ضر بوني ولكن لم أتوجع. لكموني فلم أشعر، فمتى أستيقظ؟ سأذهب ألتمس شربها مرة أخرى»."]]}, {"l": "Isa 21:4", "n": "", "vs": [[4, "تحير قلبي، وأرعبني الفزع، فتحول ليلي الذي كنت أتوق إليه إلى رعدة."]]}, {"l": "Isa 21:5", "n": "", "vs": [[5, "أعدوا مائدة وفرشوا السجاجيد، أكلوا وشربوا، فانهضوا يا أمراء، وادهنوا بالزيت تروسكم."]]}, {"l": "Dan 5:4", "n": "", "vs": [[4, "وأخذوا يسبحون آلهة الذهب والفضة والنحاس والحديد والخشب والحجر."]]}, {"l": "Dan 5:5", "n": "", "vs": [[5, "فظهرت أصابع يد إنسان وخطت بإزاء المصباح على كلس جدار قصر الملك، والملك يشهد اليد الكاتبة."]]}, {"l": "Act 2:15", "n": "", "vs": [[15, "ليس هؤلاء سكارى كما تتوهمون، فالناس لا يسكرون في الساعة التاسعة صباحا."]]}, {"l": "2Pe 2:13", "n": "", "vs": [[13, "وبذلك ينالون أجرة إثمهم! إنهم يحسبون الانغماس في اللذات طول النهار بهجة عظيمة. فهم أوساخ وعيوب: يتلذذون بالنجاسة ويحاولون خداعكم، فيشتركون معكم في الولائم."]]}], "kwAr": "يسكر الذين يسكرون", "noteAr": ""}], "arS": [["فإنه في ", []], ["الليل", ["G3571"]], [" ", []], ["ينام", ["G2518"]], [" الذين ", []], ["ينامون", ["G2518"]], ["، وفي ", []], ["الليل", ["G3571"]], [" ", []], ["يسكر", ["G3184"]], [" الذين ", []], ["يسكرون", ["G3182"]]]}, {"c": 5, "v": 8, "text": "وأما نحن، أهل النهار، فلنظل صاحين، متخذين من الإيمان والمحبة درعا لصدورنا، ومن الرجاء بالخلاص خوذة لرؤوسنا.", "groups": [{"kw": "who", "raw": "1Th_5:5; Rom_13:13; Eph_5:8, Eph_5:9; 1Pe_2:9; 1Jo_1:7", "note": "", "refs": [{"l": "1Th 5:5", "n": "", "vs": [[5, "فأنتم جميعا أبناء النور وأبناء النهار. إننا لسنا أهل الليل ولا أهل الظلام."]]}, {"l": "Rom 13:13", "n": "", "vs": [[13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."]]}, {"l": "Eph 5:8", "n": "", "vs": [[8, "فقد كنتم في الماضي ظلاما، ولكنكم الآن نور في الرب. فاسلكوا سلوك أولاد النور."]]}, {"l": "Eph 5:9", "n": "", "vs": [[9, "فإن ثمر النور يكون في كل صلاح واستقامة وحق."]]}, {"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}, {"l": "1Jo 1:7", "n": "", "vs": [[7, "ولكن، إن كنا فعلا نعيش في النور، كما هو في النور، تكون لنا حقا شركة بعضنا مع بعض، ودم ابنه يسوع يطهرنا من كل خطيئة."]]}], "kwAr": "أهل النهار", "noteAr": ""}, {"kw": "the breastplate", "raw": "Isa_59:17; Rom_13:12; 2Co_6:7; Eph_6:11, Eph_6:13-18", "note": "", "refs": [{"l": "Isa 59:17", "n": "", "vs": [[17, "فتدرع بالبر وارتدى على رأسه خوذة الخلاص، واكتسى بثياب الانتقام، والتف بعباءة الغضب."]]}, {"l": "Rom 13:12", "n": "", "vs": [[12, "كاد الليل أن ينتهي والنهار أن يطلع. فلنطرح أعمال الظلام، ونلبس سلاح النور"]]}, {"l": "2Co 6:7", "n": "", "vs": [[7, "في كلمة الحق وقدرة الله؛ بأسلحة البر في الهجوم والدفاع؛"]]}, {"l": "Eph 6:11", "n": "", "vs": [[11, "البسوا سلاح الله الكامل، لتتمكنوا من الصمود في وجه مكايد إبليس."]]}, {"l": "Eph 6:13-18", "n": "", "vs": [[13, "لذلك اتخذوا سلاح الله الكامل، لتتمكنوا من المقاومة في يوم الشر، ومن الصمود أيضا بعد تحقيق كل هدف."], [14, "فاصمدوا إذن بعد أن تتخذوا الحق حزاما لأوساطكم، والبر درعا لصدوركم،"], [15, "والاستعداد لنشر بشارة السلام حذاء لأقدامكم."], [16, "وفوق هذا كله، احملوا الإيمان ترسا به تقدرون أن تطفئوا جميع سهام الشرير المشتعلة."], [17, "واتخذوا الخلاص خوذة للرأس، وكلمة الله سيف الروح."], [18, "كونوا مصلين في كل حال، بكل صلاة وطلبة في الروح، وساهرين لهذا الغرض عينه مواظبين تماما على جميع الطلبات لأجل القديسين جميعا،"]]}], "kwAr": "درعا لصدورنا", "noteAr": ""}, {"kw": "the hope", "raw": "Job_19:23-27; Psa_42:5, Psa_42:11, Psa_43:5; Lam_3:26; Rom_5:2-5, Rom_8:24, Rom_8:25; 1Co_13:13; Gal_5:5; 2Th_2:16; Heb_6:19, Heb_10:35, Heb_10:36; 1Pe_1:3-5, 1Pe_1:13; 1Jo_3:1-3", "note": "", "refs": [{"l": "Job 19:23-27", "n": "", "vs": [[23, "من لي بأن تدون أقوالي! ياليتها تسجل في كتاب!"], [24, "ياليتها تنقش بقلم حديد وبرصاص على صخر إلى الأبد!"], [25, "أما أنا فإني موقن أن فادي حي، وأنه لابد في النهاية أن يقوم على الأرض."], [26, "وبعد أن يفنى جلدي، فإني بذاتي أعاين الله ."], [27, "الذي أشاهده لنفسي فتنظره عيناي وليس عينا آخر، قد فنيت كليتاي شوقا في داخلي."]]}, {"l": "Psa 42:5", "n": "", "vs": [[5, "لماذا أنت مكتئبة يانفسي؟ ولماذا أنت قلقة في داخلي؟ ترجي الله، فإني سأظل أحمده، لأنه عوني وإلهي."]]}, {"l": "Psa 42:11", "n": "", "vs": [[11, "لماذا أنت مكتئبة يانفسي، ولماذا أنت قلقة؟ ترجي الله ، فإني سأظل أحمده، لأنه عوني وإلهي."]]}, {"l": "Psa 43:5", "n": "", "vs": [[5, "لماذا أنت مكتئبة يانفسي؟ لماذا أنت قلقة في داخلي؟ ترجي الله فإني سأظل أحمده، لأنه عوني وإلهي."]]}, {"l": "Lam 3:26", "n": "", "vs": [[26, "خير للمرء أن ينتظر بصمت خلاص الرب."]]}, {"l": "Rom 5:2-5", "n": "", "vs": [[2, "وبه أيضا تم لنا الدخول بالإيمان إلى هذه النعمة التي نقيم فيها الآن؛ ونحن نفتخر برجائنا في التمتع بمجد الله."], [3, "ليس هذا فقط، بل نفتخر أيضا في وسط الضيقات، لعلمنا أن الضيق ينتج فينا الصبر،"], [4, "والصبر يؤهلنا للفوز في الامتحان، والفوز يبعث فينا الرجاء،"], [5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."]]}, {"l": "Rom 8:24", "n": "", "vs": [[24, "فإننا قد خلصنا، إنما بالرجاء؛ ولكن الرجاء متى رأيناه لا يكون رجاء؛ فما يراه الإنسان لماذا يرجوه بعد؟"]]}, {"l": "Rom 8:25", "n": "", "vs": [[25, "ولكن، إن كنا نرجو ما لا نراه، فبالصبر نتوقعه."]]}, {"l": "1Co 13:13", "n": "", "vs": [[13, "أما الآن، فهذه الثلاثة باقية: الإيمان، والرجاء، والمحبة. ولكن أعظمها هي المحبة!"]]}, {"l": "Gal 5:5", "n": "", "vs": [[5, "فإننا، بالروح وعلى أساس الإيمان، ننتظر الرجاء الذي ينتجه البر."]]}, {"l": "2Th 2:16", "n": "", "vs": [[16, "وليت ربنا يسوع المسيح نفسه، والله أبانا، الذي أحبنا ووهبنا بنعمته راحة أبدية ورجاء صالحا،"]]}, {"l": "Heb 6:19", "n": "", "vs": [[19, "هذا الرجاء هو لنا بمثابة مرساة أمينة ثابتة تشد نفوسنا إلى ما وراء الحجاب السماوي."]]}, {"l": "Heb 10:35", "n": "", "vs": [[35, "إذن، لا تتخلوا عن ثقتكم بالرب. فإن لها مكافأة عظيمة."]]}, {"l": "Heb 10:36", "n": "", "vs": [[36, "إنكم تحتاجون إلى الصبر لتعملوا إرادة الله، فتنالوا البركة التي وعدتم بها."]]}, {"l": "1Pe 1:3-5", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"], [4, "وإرثا لا يفنى ولا يفسد ولا يزول،"], [5, "محفوظا لكم في السماوات. فإنكم محفوظون بقدرة الله العاملة من خلال إيمانكم، إلى أن تفوزوا بالخلاص النهائي المعد لكم والذي سوف يتجلى في الزمان الأخير."]]}, {"l": "1Pe 1:13", "n": "", "vs": [[13, "لذلك اجعلوا أذهانكم متنبهة دائما، وتيقظوا، وعلقوا رجاءكم كله على النعمة التي ستكون من نصيبكم عندما يعود يسوع المسيح ظاهرا بمجده!"]]}, {"l": "1Jo 3:1-3", "n": "", "vs": [[1, "تأملوا ما أعظم المحبة التي أحبنا بها الآب حتى صرنا ندعى «أولاد الله»، ونحن أولاده حقا. ولكن، بما أن أهل العالم لا يعرفون الله، فهم لا يعرفوننا."], [2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"], [3, "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر."]]}], "kwAr": "الرجاء بالخلاص خوذة", "noteAr": ""}], "arS": [["وأما نحن، أهل ", []], ["النهار", ["G2250"]], ["، فلنظل ", []], ["صاحين", ["G3525"]], ["، ", []], ["متخذين", ["G1746"]], [" من ", []], ["الإيمان", ["G4102"]], [" ", []], ["والمحبة", ["G26"]], [" ", []], ["درعا", ["G2382"]], [" لصدورنا، ومن ", []], ["الرجاء", ["G1680"]], [" ", []], ["بالخلاص", ["G4991"]], [" ", []], ["خوذة", ["G4030"]], [" لرؤوسنا.", []]]}, {"c": 5, "v": 9, "text": "فإن الله عيننا لا لينزل علينا الغضب بل لننال الخلاص بربنا يسوع المسيح،", "groups": [{"kw": "not", "raw": "1Th_1:10, 1Th_3:3; Exo_9:16; Pro_16:4; Eze_38:10-17; Mat_26:24; Act_1:20,Act_1:25; Act_13:48; Rom_9:11-23; 2Ti_2:19, 2Ti_2:20; 1Pe_2:8; 2Pe_2:3; Jud_1:4", "note": "", "refs": [{"l": "1Th 1:10", "n": "", "vs": [[10, "وتنتظروا من السماوات ابنه الذي أقامه من بين الأموات، يسوع مخلصنا من الغضب الآتي."]]}, {"l": "1Th 3:3", "n": "", "vs": [[3, "حتى لا يتزعزع أحد منكم من جراء هذه الضيقات. فإنكم تعلمون أننا معينون لذلك؛"]]}, {"l": "Exo 9:16", "n": "", "vs": [[16, "ولكنني أقمتك لأريك قوتي، ولكي يذاع اسمي في جميع الأرض."]]}, {"l": "Pro 16:4", "n": "", "vs": [[4, "لكل شيء صنعه الرب غرض في ذاته، حتى الشرير ليوم الضيق."]]}, {"l": "Eze 38:10-17", "n": "", "vs": [[10, "ويحدث في ذلك اليوم أن أفكار سوء تراودك"], [11, "فتقول: أزحف على أرض عراء مكشوفة وأهاجم المطمئنين الساكنين في أمن، المقيمين كلهم من غير سور يقيهم، وليس لديهم مزاليج ولا مصاريع،"], [12, "للاستيلاء على الأسلاب ونهب الغنائم ومهاجمة الخرائب التي أصبحت آهلة، ولمحاربة الشعب المجتمع من بين الأمم، المقتني ماشية وأملاكا، المستوطن في مركز الأرض."], [13, "ويسألك أهل شبا ورودس وتجار ترشيش وكل قراها؛ أقادم أنت للاستيلاء على الأسلاب؟ هل حشدت جيوشك لنهب الغنائم ولحمل الفضة والذهب وأخذ الماشية والمقتنيات وللسلب العظيم؟"], [14, "لذلك تنبأ ياابن آدم، وقل لجوج هذا ما يعلنه السيد الرب: في ذلك اليوم عندما يسكن شعبي إسرائيل آمنا، ألا تعلم ذلك؟"], [15, "وتقبل أنت من مقرك في أقاصي الشمال مع جيوش غفيرة، تغشي الأرض؛ كلهم راكبو خيل وجمع عظيم وجيش كثير."], [16, "وتزحف على شعبي إسرائيل كسحابة تغطي الأرض، أني في الأيام الأخيرة آتي بك إلى أرضي لكي تعرفني الشعوب عندما تتجلى قداستي حين أدمرك ياجوج أمام عيونهم.هذا ما يقوله السيد الرب:"], [17, "ألست أنت الذي تحدثت عنه في الأيام الغابرة على ألسنة عبيدي أنبياء إسرائيل الذين تنبأوا في تلك الأيام لسنين كثيرة بأني سآتي بك عليهم؟"]]}, {"l": "Mat 26:24", "n": "", "vs": [[24, "إن ابن الإنسان لابد أن يمضي كما قد كتب عنه، ولكن الويل لذلك الرجل الذي على يده يسلم ابن الإنسان. كان خيرا لذلك الرجل لو لم يولد!»"]]}, {"l": "Act 1:20", "n": "", "vs": [[20, "فتمت النبوءة الواردة في كتاب المزامير: لتصر داره خرابا، ولا يسكنها ساكن. وأيضا: ليستلم وظيفته آخر!"]]}, {"l": "Act 1:25", "n": "", "vs": [[25, "ليشاركنا في الخدمة والرسالة بدلا من يهوذا الذي ذهب إلى المكان الذي يستحقه»."]]}, {"l": "Act 13:48", "n": "", "vs": [[48, "فلما سمع غير اليهود ذلك، فرحوا جدا، ومجدوا كلمة الرب. وآمن جميع من أعدهم الله للحياة الأبدية."]]}, {"l": "Rom 9:11-23", "n": "", "vs": [[11, "ولم يكن الولدان قد ولدا بعد ولا فعلا خيرا أو شرا، وذلك كي يبقى قصد الله من جهة الاختيار"], [12, "لا على أساس الأعمال بل على أساس دعوة منه، قيل لها: «إن الولد الأكبر يكون عبدا للأصغر»،"], [13, "كما قد كتب: «أحببت يعقوب، وأبغضت عيسو»."], [14, "إذا، ماذا نقول، أيكون عند الله ظلم، حاشا!"], [15, "فإنه يقول لموسى: «إني أرحم من أرحمه، وأشفق على من أشفق عليه!»"], [16, "إذا، لا يتعلق الأمر برغبة الإنسان ولا بسعيه، وإنما برحمة الله فقط."], [17, "فإن الله يقول لفرعون في الكتاب: «لهذا الأمر بعينه أقمتك: لأظهر فيك قدرتي ويعلن اسمي في الأرض كلها»."], [18, "فالله إذا يرحم من يشاء، ويقسي من يشاء."], [19, "هنا ستقول لي: «لماذ يلوم بعد؟ من يقاوم قصده؟»"], [20, "فأقول: من أنت أيها الإنسان حتى ترد جوابا على الله؟ أيقول الشيء المصنوع لصانعه: لماذا صنعتني هكذا؟"], [21, "أوليس لصانع الفخار سلطة على الطين ليصنع من كتلة واحدة وعاء للاستعمال الرفيع وآخر للاستعمال الوضيع؟"], [22, "فماذا إذا إن كان الله ، وقد شاء أن يظهر غضبه ويعلن قدرته، احتمل بكل صبر أوعية غضب جاهزة للهلاك،"], [23, "وذلك بقصد أن يعلن غنى مجده في أوعية الرحمة التي سبق فأعدها للمجد،"]]}, {"l": "2Ti 2:19", "n": "", "vs": [[19, "إلا أن الأساس الراسخ الذي وضعه الله يظل ثابتا، وعليه هذا الختم: «الرب يعرف خاصته»، وأيضا: «لينفصل عن الإثم كل من يسمي اسم الرب!»"]]}, {"l": "2Ti 2:20", "n": "", "vs": [[20, "وإنما، في بيت كبير، لا تكون الأواني كلها من الذهب والفضة وحسب، بل يكون بعضها من الخشب والفخار أيضا. كما يكون بعضها للاستعمال الرفيع، وبعضها للاستعمال الوضيع."]]}, {"l": "1Pe 2:8", "n": "", "vs": [[8, "كما أنه هو «الحجر الذي يصطدمون به، والصخرة التي يسقطون عليها»! وهم يسقطون لأنهم يرفضون أن يؤمنوا بالكلمة."]]}, {"l": "2Pe 2:3", "n": "", "vs": [[3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "Jud 1:4", "n": "", "vs": [[4, "لأنه قد تسلل إلى ما بينكم معلمون لابد أن يلاقوا الحكم بالعقاب الأبدي، كما هو مكتوب لهم منذ القديم. فهم أشرار لا يهابون الله ، يتخذون من نعمة إلهنا فرصة لإباحة الرذائل، وينكرون سيدنا وربنا الوحيد يسوع المسيح."]]}], "kwAr": "لا لينزل علينا الغضب", "noteAr": ""}, {"kw": "obtain", "raw": "Rom_11:7, Rom_11:30; 2Th_2:13, 2Th_2:14; 1Ti_1:13, 1Ti_1:16; 2Ti_2:10; 1Pe_2:10; 2Pe_1:1", "note": "", "refs": [{"l": "Rom 11:7", "n": "", "vs": [[7, "فما الخلاصة إذا؟ إن ما يسعى إليه إسرائيل لم ينالوه، بل ناله المختارون منهم، والباقون عميت بصائرهم،"]]}, {"l": "Rom 11:30", "n": "", "vs": [[30, "والواقع أنه كما كنتم أنتم في الماضي غير مطيعين لله، ولكنكم الآن نلتم الرحمة من جراء عدم طاعتهم هم،"]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "2Th 2:14", "n": "", "vs": [[14, "فإلى هذا الأمر قد دعاكم ببشارتنا لكم، لنوال مجد ربنا يسوع المسيح."]]}, {"l": "1Ti 1:13", "n": "", "vs": [[13, "مع أني كنت في الماضي مجدفا عليه، ومضطهدا ومهينا له! ولكني عوملت بالرحمة، لأني عملت ما عملته عن جهل وفي عدم إيمان."]]}, {"l": "1Ti 1:16", "n": "", "vs": [[16, "ولكن لهذا السبب عوملت بالرحمة، ليجعل يسوع المسيح مني، أنا أولا، مثالا يظهر صبره الطويل، لجميع الذين سيؤمنون به لنوال الحياة الأبدية."]]}, {"l": "2Ti 2:10", "n": "", "vs": [[10, "لهذا السبب أحتمل كل شيء بصبر لأجل الذين اختارهم الله ، لكي يحصلوا، هم أيضا، على الخلاص الذي في المسيح يسوع مع المجد الأبدي."]]}, {"l": "1Pe 2:10", "n": "", "vs": [[10, "فإنكم في الماضي لم تكونوا شعبا؛ أما الآن، فأنتم «شعب الله وقد كنتم سابقا لا تتمتعون برحمة الله، أما الآن، فإنكم تتمتعون بها!»"]]}, {"l": "2Pe 1:1", "n": "", "vs": [[1, "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"]]}], "kwAr": "بل لننال الخلاص", "noteAr": ""}], "arS": [["فإن ", []], ["الله", ["G2316"]], [" ", []], ["عيننا", ["G5087"]], [" لا لينزل علينا ", []], ["الغضب", ["G3709"]], [" بل ", []], ["لننال", ["G4047"]], [" ", []], ["الخلاص", ["G4991"]], [" ", []], ["بربنا", ["G2962", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], ["،", []]]}, {"c": 5, "v": 10, "text": "الذي مات عنا لكي نحيا جميعا معه، سواء كنا في سهر الحياة أم في رقاد الموت!", "groups": [{"kw": "died", "raw": "Mat_20:28; Joh_10:11, Joh_10:15, Joh_10:17, Joh_15:13; Rom_5:6-8, Rom_8:34, Rom_14:8, Rom_14:9; 1Co_15:3; 2Co_5:15, 2Co_5:21; Eph_5:2; 1Ti_2:6; Tit_2:14; 1Pe_2:24, 1Pe_3:18", "note": "", "refs": [{"l": "Mat 20:28", "n": "", "vs": [[28, "فهكذا ابن الإنسان: قد جاء لا ليخدم، بل ليخدم ويبذل نفسه فدية عن كثيرين. »"]]}, {"l": "Joh 10:11", "n": "", "vs": [[11, "أنا الراعي الصالح، والراعي الصالح يبذل حياته فدى خرافه."]]}, {"l": "Joh 10:15", "n": "", "vs": [[15, "مثلما يعرفني الآب وأنا أعرفه. وأنا أبذل حياتي فدى خرافي."]]}, {"l": "Joh 10:17", "n": "", "vs": [[17, "إن الآب يحبني لأني أبذل حياتي لكي أستردها."]]}, {"l": "Joh 15:13", "n": "", "vs": [[13, "ليس لأحد محبة أعظم من هذه: أن يبذل أحد حياته فدى أحبائه."]]}, {"l": "Rom 5:6-8", "n": "", "vs": [[6, "فإنه ونحن بعد عاجزون، مات المسيح عن العصاة في الوقت المعين."], [7, "إذ قلما يموت أحد فدى إنسان بار، بل قد يتجرأ أحد أن يموت فدى إنسان صالح."], [8, "ولكن الله أثبت لنا محبته، إذ ونحن مازلنا خاطئين مات المسيح عوضا عنا."]]}, {"l": "Rom 8:34", "n": "", "vs": [[34, "فمن ذا يدين؟ إنه المسيح يسوع هو الذي مات، بل بالأحرى قام، وهو أيضا عن يمين الله، وهو يشفع فينا أيضا."]]}, {"l": "Rom 14:8", "n": "", "vs": [[8, "فإن حيينا، فللرب نحيا؛ وإن متنا فللرب نموت. فسواء حيينا أم متنا، فإنما نحن للرب."]]}, {"l": "Rom 14:9", "n": "", "vs": [[9, "فإن المسيح مات وعاد حيا لأجل هذا: أن يكون سيدا على الأموات والأحياء."]]}, {"l": "1Co 15:3", "n": "", "vs": [[3, "فالواقع أني سلمتكم، في أول الأمر، ما كنت قد تسلمته، وهو أن المسيح مات من أجل خطايانا وفقا لما في الكتاب،"]]}, {"l": "2Co 5:15", "n": "", "vs": [[15, "وهو قد مات عوضا عن الجميع حتى لا يعيش الأحياء في ما بعد لأنفسهم بل للذي مات عوضا عنهم ثم قام."]]}, {"l": "2Co 5:21", "n": "", "vs": [[21, "فإن الذي لم يعرف خطيئة، جعله الله خطيئة لأجلنا، لنصير نحن بر الله فيه."]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "1Ti 2:6", "n": "", "vs": [[6, "الذي بذل نفسه فدية عوضا عن الجميع. هذه شهادة تؤدى في أوقاتها الخاصة،"]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "1Pe 2:24", "n": "", "vs": [[24, "وهو نفسه حمل خطايانا في جسده (عندما مات مصلوبا) على الخشبة، لكي نموت بالنسبة للخطايا فنحيا حياة البر. وبجراحه هو تم لكم الشفاء،"]]}, {"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}], "kwAr": "الذي مات عنا", "noteAr": ""}, {"kw": "whether", "raw": "1Th_4:13, 1Th_4:17", "note": "", "refs": [{"l": "1Th 4:13", "n": "", "vs": [[13, "على أننا نريد، أيها الإخوة، ألا يخفى عليكم أمر الراقدين، حتى لا يصيبكم الحزن كغيركم من الناس الذين لا رجاء لهم."]]}, {"l": "1Th 4:17", "n": "", "vs": [[17, "ثم إننا، نحن الباقين أحياء، نختطف جميعا في السحب للاجتماع بالرب في الهواء. وهكذا نبقى مع الرب على الدوام."]]}], "kwAr": "سواء كنا في سهر الحياة", "noteAr": ""}], "arS": [["الذي ", []], ["مات", ["G599"]], [" عنا لكي ", []], ["نحيا", ["G2198"]], [" ", []], ["جميعا", ["G260"]], [" معه، سواء كنا في ", []], ["سهر", ["G1127"]], [" الحياة أم في ", []], ["رقاد", ["G2518"]], [" الموت!", []]]}, {"c": 5, "v": 11, "text": "لذلك عزوا بعضكم بعضا وشددوا أحدكم الآخر، كما أنتم فاعلون.", "groups": [{"kw": "Wherefore", "raw": "1Th_4:18", "note": "", "refs": [{"l": "1Th 4:18", "n": "", "vs": [[18, "لذلك عزوا بعضكم بعضا بهذا الكلام!"]]}], "kwAr": "لذلك", "noteAr": ""}, {"kw": "comfort", "raw": "or, exhort, Heb_3:13, Heb_10:25", "note": "or, exhort, Heb_3:13, Heb_10:25", "refs": [{"l": "Heb 3:13", "n": "", "vs": [[13, "وإنما، شجعوا بعضكم بعضا كل يوم، مادمنا نقول: «اليوم...». وذلك لكي لا تقسي الخطيئة قلب أحد منكم بخداعها."]]}, {"l": "Heb 10:25", "n": "", "vs": [[25, "وعلينا ألا ننقطع عن الاجتماع معا، كما تعود بعضكم أن يفعل. إنما، يجدر بكم أن تحثوا وتشجعوا بعضكم بعضا، وتواظبوا على هذا بقدر ما ترون ذلك اليوم يقترب."]]}], "kwAr": "عزوا بعضكم بعضا", "noteAr": "أو: عظوا (حرّضوا)."}, {"kw": "and edify", "raw": "Rom_14:19, Rom_15:2; 1Co_10:23, 1Co_14:5, 1Co_14:12, 1Co_14:29; 2Co_12:19; Eph_4:12, Eph_4:16, Eph_4:29; 1Ti_1:4; Jud_1:20", "note": "", "refs": [{"l": "Rom 14:19", "n": "", "vs": [[19, "فلنسع إذن وراء ما يؤدي إلى السلام وما يؤدي إلى بنيان بعضنا بعضا."]]}, {"l": "Rom 15:2", "n": "", "vs": [[2, "فليسع كل واحد منا لإرضاء قريبه من جهة ما هو صالح، في سبيل البنيان."]]}, {"l": "1Co 10:23", "n": "", "vs": [[23, "كل شيء حلال، ولكن ليس كل شيء ينفع. كل شيء حلال، ولكن ليس كل شيء يبني."]]}, {"l": "1Co 14:5", "n": "", "vs": [[5, "إني أرغب في أن تتكلموا جميعا بلغات مجهولة، ولكن بالأحرى أن تتنبأوا. فإن من يتنبأ أفضل ممن يتكلم باللغات إلا إذا ترجم (ما يقوله) لتنال الكنيسة بنيانا."]]}, {"l": "1Co 14:12", "n": "", "vs": [[12, "وهكذا أنتم أيضا، إذ إنكم متشوقون إلى المواهب الروحية، اسعوا في طلب المزيد منها لأجل بنيان الكنيسة."]]}, {"l": "1Co 14:29", "n": "", "vs": [[29, "وليتكلم أيضا اثنان أو ثلاثة من المتنبئين وليحكم الآخرون."]]}, {"l": "2Co 12:19", "n": "", "vs": [[19, "طالما كنتم تظنون أننا ندافع عن أنفسنا عندكم! ولكننا إنما نتكلم أمام الله في المسيح. وذلك كله، أيها الأحباء، لأجل بنيانكم."]]}, {"l": "Eph 4:12", "n": "", "vs": [[12, "لتأهيل القديسين من جهة عمل الخدمة، لبنيان جسد المسيح،"]]}, {"l": "Eph 4:16", "n": "", "vs": [[16, "فمنه يستمد الجسد كله تماسكه وترابطه بمساندة كل مفصل وفقا لمقدار العمل المخصص لكل جزء، لينشيء نموا يؤول إلى بنيان الجسد بنيانا ذاتيا في المحبة."]]}, {"l": "Eph 4:29", "n": "", "vs": [[29, "لا تخرج من أفواهكم كلمة فاسدة، بل الكلام الصالح للبنيان الذي تدعو إليه الحاجة، كي يعطي السامعين نعمة."]]}, {"l": "1Ti 1:4", "n": "", "vs": [[4, "وتوصي المؤمنين ألا ينشغلوا بالأساطير وسلاسل النسب المتشابكة. فتلك الأمور تثير المجادلات ولا تعمل على تقدم تدبير الله القائم على الإيمان."]]}, {"l": "Jud 1:20", "n": "", "vs": [[20, "وأما أنتم أيها الأحباء، فابنوا أنفسكم على إيمانكم الأقدس، وصلوا دائما في الروح القدس."]]}], "kwAr": "وشددوا أحدكم الآخر", "noteAr": ""}, {"kw": "even", "raw": "1Th_4:10; Rom_15:14; 2Pe_1:12", "note": "", "refs": [{"l": "1Th 4:10", "n": "", "vs": [[10, "ولأنكم أيضا هكذا تعاملون جميع الإخوة في مقاطعة مقدونية كلها. وإنما نحرضكم، أيها الإخوة، أن تضاعفوا ذلك أكثر فأكثر،"]]}, {"l": "Rom 15:14", "n": "", "vs": [[14, "وأنا نفسي أيضا على يقين من جهتكم أيها الإخوة بأنكم مشحونون صلاحا، وممتلئون بكل معرفة، وقادرون أيضا على نصح بعضكم بعضا."]]}, {"l": "2Pe 1:12", "n": "", "vs": [[12, "لذلك أنوي أن أذكركم دائما بهذه الأمور، وإن كنتم عالمين بها، وراسخين في الحق الذي عندكم."]]}], "kwAr": "كما أنتم فاعلون", "noteAr": ""}], "arS": [["لذلك ", []], ["عزوا", ["G3870"]], [" ", []], ["بعضكم بعضا", ["G240"]], [" ", []], ["وشددوا", ["G3618"]], [" ", []], ["أحدكم الآخر", ["G1520", "G1520"]], ["، كما أنتم ", []], ["فاعلون", ["G4160"]], [".", []]]}, {"c": 5, "v": 12, "text": "على أننا نرجو منكم، أيها الإخوة، أن تميزوا أولئك الذين يجتهدون بينكم، ويرعونكم كما يريد الرب، ويعظونكم،", "groups": [{"kw": "to know", "raw": "1Co_16:18; Phi_2:19; Heb_13:7, Heb_13:17", "note": "", "refs": [{"l": "1Co 16:18", "n": "", "vs": [[18, "إذ أنعشوا روحي وروحكم. فقدروا مثل هؤلاء حق التقدير!"]]}, {"l": "Phi 2:19", "n": "", "vs": [[19, "غير أني أرجو في الرب يسوع أن أرسل إليكم تيموثاوس عن قريب، لكي تطيب نفسي بمعرفة أحوالكم."]]}, {"l": "Heb 13:7", "n": "", "vs": [[7, "اذكروا دائما مرشديكم الذين علموكم كلام الله. تأملوا سيرتهم حتى النهاية، واقتدوا بإيمانهم."]]}, {"l": "Heb 13:17", "n": "", "vs": [[17, "أطيعوا مرشديكم، واخضعوا لهم، لأنهم يسهرون على مصلحتكم الروحية، كما يسهر الذي يحمل مسئولية سوف يقدم حسابا عن قيامه بها. وعندئذ، يؤدون مهمتهم بفرح دون تذمر. فلن يكون في تذمرهم نفع لكم!"]]}], "kwAr": "أن تميزوا", "noteAr": ""}, {"kw": "labour", "raw": "1Th_2:9; Mat_9:37, Mat_9:38; Luk_10:1, Luk_10:2, Luk_10:7; Joh_4:38; Act_20:35; 1Co_3:9, 1Co_15:10; 1Co_16:16; 2Co_5:9, 2Co_6:1, 2Co_11:23; Gal_4:11; Phi_2:16; Col_1:29; 1Ti_5:17, 1Ti_5:18; 2Ti_2:6; Rev_2:3", "note": "", "refs": [{"l": "1Th 2:9", "n": "", "vs": [[9, "فأنتم تذكرون، أيها الإخوة، جهدنا وكدنا، إذ بشرناكم بإنجيل الله ونحن نشتغل ليلا ونهارا لكي لا نكون عبئا ثقيلا على أحد منكم."]]}, {"l": "Mat 9:37", "n": "", "vs": [[37, "عندئذ قال لتلاميذه: «الحصاد كثير، والعمال قليلون."]]}, {"l": "Mat 9:38", "n": "", "vs": [[38, "فاطلبوا من رب الحصاد أن يرسل عمالا إلى حصاده! »"]]}, {"l": "Luk 10:1", "n": "", "vs": [[1, "وبعد ذلك عين الرب أيضا اثنين وسبعين آخرين، وأرسلهم اثنين اثنين، ليسبقوه إلى كل مدينة ومكان كان على وشك الذهاب إليه."]]}, {"l": "Luk 10:2", "n": "", "vs": [[2, "وقال لهم: «إن الحصاد كثير، ولكن العمال قليلون، فتضرعوا إلى رب الحصاد أن يبعث عمالا إلى حصاده."]]}, {"l": "Luk 10:7", "n": "", "vs": [[7, "وانزلوا في ذلك البيت تأكلون وتشربون مما عندهم: لأن العامل يستحق أجرته. لا تنتقلوا من بيت إلى بيت."]]}, {"l": "Joh 4:38", "n": "", "vs": [[38, "إني أرسلتكم لتحصدوا ما لم تتعبوا فيه، فغيركم تعبوا، وأنتم تجنون ثمر أتعابهم»."]]}, {"l": "Act 20:35", "n": "", "vs": [[35, "وقد أظهرت لكم بوضوح كيف يجب أن نبذل الجهد لنساعد المحتاجين، متذكرين كلمات الرب يسوع، إذ قال: الغبطة في العطاء أكثر مما في الأخذ!»"]]}, {"l": "1Co 3:9", "n": "", "vs": [[9, "فإننا نحن جميعا عاملون معا عند الله، وأنتم حقل الله وبناء الله."]]}, {"l": "1Co 15:10", "n": "", "vs": [[10, "ولكن، بنعمة الله صرت على ما أنا عليه الآن، ونعمته الموهوبة لي لم تكن عبثا، إذ عملت جاهدا أكثر من الرسل الآخرين جميعا. إلا أني لم أكن أنا العامل، بل نعمة الله التي كانت معي."]]}, {"l": "1Co 16:16", "n": "", "vs": [[16, "فاخضعوا لهم ولأمثالهم، ولكل من يشترك معهم باجتهاد في العمل."]]}, {"l": "2Co 5:9", "n": "", "vs": [[9, "ولذلك أيضا نحرص أن نرضيه، سواء أكنا مقيمين أم مغتربين."]]}, {"l": "2Co 6:1", "n": "", "vs": [[1, "فبما أننا عاملون معا عند الله، نطلب ألا يكون قبولكم لنعمة الله عبثا."]]}, {"l": "2Co 11:23", "n": "", "vs": [[23, "وإن كانوا خدام المسيح، أتكلم كأني فقدت صوابي، فأنا متفوق عليهم: في الأتعاب أوفر منهم جدا، في الجلدات فوق الحد، في السجون أوفر جدا، في التعرض للموت أكثر مرارا."]]}, {"l": "Gal 4:11", "n": "", "vs": [[11, "أخاف عليكم، خشية أن أكون قد تعبت من أجلكم بلا جدوى."]]}, {"l": "Phi 2:16", "n": "", "vs": [[16, "حاملين كلمة الحياة، لتكونوا في يوم المسيح موضع فخر بأني ما سعيت باطلا ولا اجتهدت عبثا."]]}, {"l": "Col 1:29", "n": "", "vs": [[29, "ولأجل هذا أتعب أنا أيضا وأجاهد، بفضل قدرته العاملة في بقوة."]]}, {"l": "1Ti 5:17", "n": "", "vs": [[17, "أما الشيوخ الذين يحسنون القيادة، فليعتبروا أهلا للإكرام المضاعف، وبخاصة الذين يبذلون الجهد في نشر الكلمة وفي التعليم."]]}, {"l": "1Ti 5:18", "n": "", "vs": [[18, "لأن الكتاب يقول: «لا تضع كمامة على فم الثور وهو يدرس الحبوب»، وأيضا: ¢العامل يستحق أجرته¢."]]}, {"l": "2Ti 2:6", "n": "", "vs": [[6, "كذلك الفلاح الذي يشتغل بجد يجب أن يكون أول من ينال حصته من الغلة."]]}, {"l": "Rev 2:3", "n": "", "vs": [[3, "وقد تألمت من أجل اسمي بصبر وبغير كلل."]]}], "kwAr": "الذين يجتهدون بينكم", "noteAr": ""}, {"kw": "and are", "raw": "Act_20:28; 1Co_12:28; Tit_1:5; Heb_13:7, Heb_13:17; 1Pe_5:2, 1Pe_5:3; Rev_1:20; Rev_2:1, Rev_2:8, Rev_2:12, Rev_2:18, Rev_3:1, Rev_3:7, Rev_3:14", "note": "", "refs": [{"l": "Act 20:28", "n": "", "vs": [[28, "فاسهروا إذن على أنفسكم وعلى جميع القطيع الذي عينكم بينه الروح القدس نظارا، لترعوا كنيسة الله التي اشتراها بدمه."]]}, {"l": "1Co 12:28", "n": "", "vs": [[28, "وقد رتب الله في الكنيسة أشخاصا مخصوصين: أولا الرسل، ثانيا الأنبياء، ثالثا المعلمين، وبعد ذلك أصحاب المواهب المعجزية أو مواهب الشفاء أو إعانة الآخرين أو تدبير الشؤون أو التكلم باللغات المختلفة."]]}, {"l": "Tit 1:5", "n": "", "vs": [[5, "تركتك في جزيرة كريت لكي تكمل ترتيب الأمور الباقية، وتقيم شيوخا في كل مدينة، مثلما أمرتك؛"]]}, {"l": "Heb 13:7", "n": "", "vs": [[7, "اذكروا دائما مرشديكم الذين علموكم كلام الله. تأملوا سيرتهم حتى النهاية، واقتدوا بإيمانهم."]]}, {"l": "Heb 13:17", "n": "", "vs": [[17, "أطيعوا مرشديكم، واخضعوا لهم، لأنهم يسهرون على مصلحتكم الروحية، كما يسهر الذي يحمل مسئولية سوف يقدم حسابا عن قيامه بها. وعندئذ، يؤدون مهمتهم بفرح دون تذمر. فلن يكون في تذمرهم نفع لكم!"]]}, {"l": "1Pe 5:2", "n": "", "vs": [[2, "ارعوا قطيع الله الذي بينكم، كحراس له، لا بدافع الواجب، بل بدافع التطوع، كما يريد الله ، ولا رغبة في الربح الدنيء، بل رغبة في الخدمة بنشاط."]]}, {"l": "1Pe 5:3", "n": "", "vs": [[3, "لا تتسلطوا على القطيع الذي وضعه الله أمانة بين أيديكم، بل كونوا قدوة له."]]}, {"l": "Rev 1:20", "n": "", "vs": [[20, "وهذا سر النجوم السبعة التي رأيتها في يميني، ومنائر الذهب السبع: النجوم السبعة تمثل ملائكة الكنائس السبع، أما المنائر السبع فهي تمثل الكنائس السبع نفسها."]]}, {"l": "Rev 2:1", "n": "", "vs": [[1, "اكتب إلى ملاك الكنيسة في أفسس: إليك ما يقوله الذي يمسك النجوم السبع بيمينه ويمشي بين منائر الذهب السبع:"]]}, {"l": "Rev 2:8", "n": "", "vs": [[8, "واكتب إلى ملاك الكنيسة في سميرنا: إليك ما يقوله الأول والآخر، الذي كان ميتا وعاد حيا:"]]}, {"l": "Rev 2:12", "n": "", "vs": [[12, "واكتب إلى ملاك الكنيسة في برغامس: إليك ما يقوله صاحب السيف القاطع ذي الحدين."]]}, {"l": "Rev 2:18", "n": "", "vs": [[18, "واكتب إلى ملاك الكنيسة في ثياتيرا: إليك ما يقوله ابن الله الذي عيناه كلهيب نار ورجلاه كالنحاس النقي:"]]}, {"l": "Rev 3:1", "n": "", "vs": [[1, "واكتب إلى ملاك الكنيسة في ساردس: إليك ما يقوله من له أرواح الله السبعة والنجوم السبعة: إني عالم بأعمالك. فأنت حي بالاسم، ولكنك ميت فعلا."]]}, {"l": "Rev 3:7", "n": "", "vs": [[7, "واكتب إلى ملاك الكنيسة في فيلادلفيا: إليك ما يقوله القدوس الحق، الذي بيده مفتاح داود، يفتح ولا أحد يغلق، ويغلق ولا أحد يفتح."]]}, {"l": "Rev 3:14", "n": "", "vs": [[14, "واكتب إلى ملاك الكنيسة في لاودكية: إليك ما يقوله الحق، الشاهد الأمين الصادق، رئيس خليقة الله:"]]}], "kwAr": "ويرعونكم", "noteAr": ""}, {"kw": "and admonish", "raw": "1Th_5:14; 1Ti_5:1, 1Ti_5:20; Tit_1:3, Tit_2:15", "note": "", "refs": [{"l": "1Th 5:14", "n": "", "vs": [[14, "إلا أننا نناشدكم، أيها الإخوة، أن تعظوا الفوضويين، وتشددوا فاقدي العزم، وتساندوا الضعفاء، وتعاملوا الجميع بطول البال."]]}, {"l": "1Ti 5:1", "n": "", "vs": [[1, "لا توبخ شيخا توبيخا قاسيا، بل عظه كأنه أب لك. وعامل الشبان كأنهم إخوة لك؛"]]}, {"l": "1Ti 5:20", "n": "", "vs": [[20, "فإذا ثبت أن المتهم مخطيء، وبخه أمام الجميع، ليكون عند الباقين خوف!"]]}, {"l": "Tit 1:3", "n": "", "vs": [[3, "ثم بين كلمته في أوانها المعين: بالبشارة التي وضعت أمانة بين يدي بموجب أمر مخلصنا الله …"]]}, {"l": "Tit 2:15", "n": "", "vs": [[15, "بهذه الأمور تكلم، وعظ، ووبخ بكل سلطان، ولا تدع أحدا يستخف بك!"]]}], "kwAr": "ويعظونكم", "noteAr": ""}], "arS": [["على أننا ", []], ["نرجو", ["G2065"]], [" منكم، أيها ", []], ["الإخوة", ["G80"]], ["، أن ", []], ["تميزوا", ["G1492"]], [" أولئك الذين ", []], ["يجتهدون", ["G2872"]], [" بينكم، ", []], ["ويرعونكم", ["G4291"]], [" كما يريد ", []], ["الرب", ["G2962"]], ["، ", []], ["ويعظونكم", ["G3560"]], ["،", []]]}, {"c": 5, "v": 13, "text": "وأن تقدروهم تقديرا فائقا في المحبة، من أجل عملهم. عيشوا بسلام بعضكم مع بعض.", "groups": [{"kw": "esteem", "raw": "Mat_10:40; 1Co_4:1, 1Co_4:2, 1Co_9:7-11; Gal_4:14, Gal_6:6", "note": "", "refs": [{"l": "Mat 10:40", "n": "", "vs": [[40, "من يقبلكم، يقبلني؛ ومن يقبلني، يقبل الذي أرسلني."]]}, {"l": "1Co 4:1", "n": "", "vs": [[1, "فلينظر إلينا الناس باعتبارنا خداما للمسيح ووكلاء على أسرار الله."]]}, {"l": "1Co 4:2", "n": "", "vs": [[2, "والمطلوب من الوكلاء، قبل كل شيء، أن يوجد كل منهم أمينا."]]}, {"l": "1Co 9:7-11", "n": "", "vs": [[7, "أي جندي يذهب إلى الحرب على نفقته الخاصة؟ وأي مزارع يغرس كرما ولا يأكل من ثماره؟ أم أي راع يرعى قطيعا ولا يأكل من لبن القطيع؟"], [8, "أتظنون أني أتكلم بهذا بمنطق البشر؟ أو ما توصي الشريعة به؟"], [9, "فإنه مكتوب في شريعة موسى: «لا تضع كمامة على فم الثور وهو يدرس الحنطة». ترى، هل تهم الله الثيران،"], [10, "أم يقول ذلك كله من أجلنا؟ نعم، فمن أجلنا قد كتب ذلك، لأنه من حق الفلاح أن يفلح برجاء، والدراس أن يدرس برجاء، على أمل الاشتراك في الغلة."], [11, "وما دمنا نحن قد زرعنا لكم الأمور الروحية، فهل يكون كثيرا علينا أن نحصد منكم الأمور المادية؟"]]}, {"l": "Gal 4:14", "n": "", "vs": [[14, "ومع أن العلة التي في جسدي كانت تجربة لكم، فإنكم لم تحتقروني ولم تنفروا مني بسببها، بل قبلتموني كأني ملاك من عند الله، أو كأني المسيح يسوع."]]}, {"l": "Gal 6:6", "n": "", "vs": [[6, "ليشارك الذي يتعلم الكلمة من يعلمها، في جميع الخيرات."]]}], "kwAr": "وأن تقدروهم تقديرا فائقا", "noteAr": ""}, {"kw": "and be", "raw": "Gen_45:24; Psa_133:1; Mar_9:50; Luk_7:3-5; Joh_13:34, Joh_13:35, Joh_15:17; Rom_4:17-19; 2Co_13:11; Gal_5:22; Eph_4:3; Col_3:15; 2Th_3:16; 2Ti_2:22; Heb_12:14; Jam_3:18", "note": "", "refs": [{"l": "Gen 45:24", "n": "", "vs": [[24, "وهكذا صرف إخوته بعد أن أوصاهم: «لا تتخاصموا في الطريق»."]]}, {"l": "Psa 133:1", "n": "", "vs": [[1, "ما أحسن وما أبهج أن يسكن الإخوة معا (بوئام)."]]}, {"l": "Mar 9:50", "n": "", "vs": [[50, "الملح جيد، ولكن إذا فقد الملح ملوحته، فبماذا تعيدون إليه طعمه؟ فليكن لكم ملح في أنفسكم، وكونوا مسالمين بعضكم لبعض! »"]]}, {"l": "Luk 7:3-5", "n": "", "vs": [[3, "فلما سمع بيسوع، أرسل إليه شيوخ اليهود، متوسلا إليه أن يأتي وينقذ عبده."], [4, "ولما أدركوا يسوع، طلبوا إليه بإلحاح قائلين: «إنه يستحق أن تمنحه طلبه،"], [5, "فهو يحب أمتنا، وقد بنى لنا المجمع»."]]}, {"l": "Joh 13:34", "n": "", "vs": [[34, "وصية جديدة أنا أعطيكم: أحبوا بعضكم بعضا، كما أحببتكم أنا، تحبون بعضكم."]]}, {"l": "Joh 13:35", "n": "", "vs": [[35, "بهذا يعرف الجميع أنكم تلاميذي: إن كنتم تحبون بعضكم بعضا»."]]}, {"l": "Joh 15:17", "n": "", "vs": [[17, "فبهذا أوصيكم إذن: أن تحبوا بعضكم بعضا."]]}, {"l": "Rom 4:17-19", "n": "", "vs": [[17, "كما قد كتب: «إني جعلتك أبا لأمم كثيرة». (إنه أب لنا) في نظر الله الذي به آمن، والذي يحيي الموتى ويستدعي إلى الوجود ما كان غير موجود."], [18, "إذ رغم انقطاع الرجاء، فبالرجاء آمن إبراهيم بأنه سيصير أبا لأمم كثيرة، وفقا لما قيل له: «بهذه الكثرة سيكون نسلك»."], [19, "ولم يضعف في الإيمان حين أدرك موت جسده، لكونه قارب سن المئة، وموت رحم زوجته سارة أيضا؛"]]}, {"l": "2Co 13:11", "n": "", "vs": [[11, "وأخيرا، أيها الإخوة: افرحوا؛ تكملوا؛ تشجعوا؛ اتفقوا في الرأي؛ عيشوا بسلام. وإله المحبة والسلام سيكون معكم!"]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Eph 4:3", "n": "", "vs": [[3, "مجتهدين أن تحافظوا على وحدة الروح برابطة الوفاق. فإنما هناك جسد واحد وروح واحد،"]]}, {"l": "Col 3:15", "n": "", "vs": [[15, "وليملك في قلوبكم سلام المسيح، فإليه قد دعيتم في الجسد الواحد؛ وكونوا شاكرين!"]]}, {"l": "2Th 3:16", "n": "", "vs": [[16, "وليعطكم رب السلام نفسه السلام على الدوام وفي كل حال! وليكن الرب معكم جميعا!"]]}, {"l": "2Ti 2:22", "n": "", "vs": [[22, "إنما اهرب من الشهوات الشبابية، واسع وراء البر والإيمان والمحبة والسلام، مشاركا الذين يدعون الرب من قلب نقي."]]}, {"l": "Heb 12:14", "n": "", "vs": [[14, "اجعلوا هدفكم أن تسالموا جميع الناس، وتعيشوا حياة مقدسة. فبغير قداسة، لا يقدر أحد أن يرى الرب."]]}, {"l": "Jam 3:18", "n": "", "vs": [[18, "والبر هو ثمر ة ما يزرعه في سلام صانعو السلام."]]}], "kwAr": "عيشوا بسلام", "noteAr": ""}], "arS": [["وأن ", []], ["تقدروهم", ["G2233"]], [" تقديرا ", []], ["فائقا", ["G5228", "G1537", "G4053"]], [" في ", []], ["المحبة", ["G26"]], ["، من أجل ", []], ["عملهم", ["G2041"]], [". ", []], ["عيشوا بسلام", ["G1514"]], [" ", []], ["بعضكم مع بعض", ["G1438"]], [".", []]]}, {"c": 5, "v": 14, "text": "إلا أننا نناشدكم، أيها الإخوة، أن تعظوا الفوضويين، وتشددوا فاقدي العزم، وتساندوا الضعفاء، وتعاملوا الجميع بطول البال.", "groups": [{"kw": "exhort", "raw": "or, beseech, Rom_12:1", "note": "or, beseech, Rom_12:1", "refs": [{"l": "Rom 12:1", "n": "", "vs": [[1, "لذلك أتوسل إليكم أيها الإخوة، نظرا لمراحم الله، أن تقدموا له أجسادكم ذبيحة مقدسة مقبولة عنده، وهي عبادتكم بعقل."]]}], "kwAr": "نناشدكم", "noteAr": "أو: نتوسّل إليكم."}, {"kw": "you", "raw": "1Th_5:12", "note": "", "refs": [{"l": "1Th 5:12", "n": "", "vs": [[12, "على أننا نرجو منكم، أيها الإخوة، أن تميزوا أولئك الذين يجتهدون بينكم، ويرعونكم كما يريد الرب، ويعظونكم،"]]}], "kwAr": "أيها الإخوة", "noteAr": ""}, {"kw": "warn", "raw": "Jer_6:12; Eze_3:17-21, Eze_33:3-9; Act_20:27, Act_20:31; 1Co_4:14; Col_1:28", "note": "", "refs": [{"l": "Jer 6:12", "n": "", "vs": [[12, "وتتحول بيوتهم وحقولهم لآخرين، وكذلك نساؤهم، لأني أبسط يدي ضد سكان الأرض»، يقول الرب"]]}, {"l": "Eze 3:17-21", "n": "", "vs": [[17, "«ياابن آدم، قد جعلتك رقيبا لشعب إسرائيل، فأصغ إلى كلمتي وأنذرهم بها على لساني."], [18, "فإذا قلت للشرير: أنت لابد مائت، وأنت لم تنذره ولم تحذره ليرجع عن طرقه الأثيمة فيحيا، فإن ذلك الشرير يموت بذنبه، أما دمه فمن يدك أطلبه."], [19, "لكن إن أنذرت الشرير ولم يرجع عن شره وعن طرقه الأثيمة، فإنه يموت بذنبه، وتنجو أنت بنفسك."], [20, "وكذلك إن حاد البار عن بره وارتكب الإثم، ونصبت أمامه معثرة، فإنه يموت. ولأنك لم تنذره فإنه يموت بذنبه ولا تذكر بعد أعماله الصالحة التي قام بها، أما دمه فمن يدك أطلبه."], [21, "أما إن كنت قد أنذرت البار حتى لا يخطيء، ولم يخطيء، فإنه حتما يحيا لأنه قبل الإنذار، وتنجو أنت بنفسك»."]]}, {"l": "Eze 33:3-9", "n": "", "vs": [[3, "فإذا رأى الأعداء مقبلين لمهاجمة الأرض، فنفخ بالبوق تحذيرا للشعب،"], [4, "فمن يسمع دوي البوق ولا يحترس، ثم أتى السيف وقتله، فدمه يقع على رأسه."], [5, "لأنه سمع دوي البوق ولم يحترس. لهذا يكون دمه على نفسه، إذ لو احترس لأنقذ نفسه."], [6, "ولكن إن رأى الرقيب العدو مقبلا ولم ينفخ بالبوق، فلم يحترس الشعب، فأقدم العدو وقتل نفسا منهم، فالقتيل قد لاقى حتفه جزاء ذنبه، أما دمه فمن يد الرقيب أطلبه."], [7, "وأنت ياابن آدم، قد أقمتك رقيبا لشعب إسرائيل، فتسمع قضائي، وتحذرهم من قبلي."], [8, "إن قلت للشرير: ياشر ير إنك حتما تموت من أجل شرك، ولم تعمد إلى تحذيره من طريقه، فإن ذلك الشرير يموت بذنبه، أما دمه فمن يدك أطلبه."], [9, "ولكن إن حذرت الشرير ليرتدع عن طريقه فأبى فهو يموت بذنبه، أما أنت فتكون قد خلصت نفسك."]]}, {"l": "Act 20:27", "n": "", "vs": [[27, "لأني لم أمتنع عن إبلاغكم جميع مقاصد الله."]]}, {"l": "Act 20:31", "n": "", "vs": [[31, "لذلك كونوا متيقظين، وتذكروا أني، مدة ثلاث سنين، لم أتوقف ليلا ونهارا عن نصح كل واحد منكم وأنا أذرف الدموع."]]}, {"l": "1Co 4:14", "n": "", "vs": [[14, "لا أكتب هذا تخجيلا لكم، بل أنبهكم باعتباركم أولادي الأحباء."]]}, {"l": "Col 1:28", "n": "", "vs": [[28, "هذا السر نعلنه نحن، واعظين كل إنسان، ومعلمين كل إنسان، في كل حكمة، لكي نحضر كل إنسان كاملا في المسيح."]]}], "kwAr": "أن تعظوا", "noteAr": ""}, {"kw": "that", "raw": "Tit_1:6, Tit_1:10", "note": "", "refs": [{"l": "Tit 1:6", "n": "", "vs": [[6, "على أن يكون الواحد منهم بريئا من كل تهمة، زوجا لامرأة واحدة، أبا لأولاد مؤمنين لا يتهمون بالخلاعة والتمرد."]]}, {"l": "Tit 1:10", "n": "", "vs": [[10, "فإن هنالك كثيرين من معلمي الباطل المتمردين وخادعي عقول الناس، وبخاصة الذين من أهل الختان."]]}], "kwAr": "الفوضويين", "noteAr": ""}, {"kw": "unruly", "raw": "or, disorderly, 2Th_3:11-13", "note": "or, disorderly, 2Th_3:11-13", "refs": [{"l": "2Th 3:11-13", "n": "", "vs": [[11, "وقد سمعنا أن بينكم بعض الذين يسلكون سلوكا فوضويا فلا يشتغلون شيئا بل يتلهون بشؤون غيرهم."], [12, "فمثل هؤلاء نوصيهم ونناشدهم، في الرب يسوع المسيح، أن يكسبوا معيشتهم بأنفسهم، مشتغلين بهدوء."], [13, "أما أنتم، أيها الإخوة، فلا تملوا من عمل الخير."]]}], "kwAr": "الفوضويين", "noteAr": "أو: غير المنضبطين (بلا ترتيب)."}, {"kw": "comfort", "raw": "1Th_2:7-12; Isa_35:3, Isa_35:4, Isa_40:1, Isa_40:2, Isa_40:11; Eze_34:16; Mat_12:20; Luk_22:32; Joh_21:15-17; Rom_14:1, Rom_15:1-3; Gal_6:1, Gal_6:2; Heb_12:12", "note": "", "refs": [{"l": "1Th 2:7-12", "n": "", "vs": [[7, "مع أن لنا الحق في أن نفرض أنفسنا عليكم باعتبارنا رسلا للمسيح. ولكننا كنا مترفقين بكم كأم مرضع تحنو على أولادها."], [8, "وإذ كان حنونا عليكم شديدا، ارتضينا أن نقدم إليكم لا إنجيل الله فقط بل أنفسنا أيضا، لأنكم صرتم محبوبين لدينا."], [9, "فأنتم تذكرون، أيها الإخوة، جهدنا وكدنا، إذ بشرناكم بإنجيل الله ونحن نشتغل ليلا ونهارا لكي لا نكون عبئا ثقيلا على أحد منكم."], [10, "فأنتم تشهدون، ويشهد الله ، كيف تصرفنا بينكم، أنتم المؤمنين، بطهارة واستقامة وبراءة من اللوم،"], [11, "كما أنكم تعلمون كيف عاملناكم معاملة الأب لأولاده، فكنا نعظ كل واحد منكم ونشجعكم"], [12, "ونحرضكم أن تسلكوا سلوكا يليق بالله، ذاك الذي يدعوكم إلى ملكوته ومجده."]]}, {"l": "Isa 35:3", "n": "", "vs": [[3, "شددوا الأيدي المسترخية، وثبتوا الركب المرتعشة."]]}, {"l": "Isa 35:4", "n": "", "vs": [[4, "قولوا لذوي القلوب الخائرة: «تقووا ولا تفزعوا، فها هو إلهكم قادم، مقبل بالنقمة، حامل جزاءه. سيأتي ويخلصكم»."]]}, {"l": "Isa 40:1", "n": "", "vs": [[1, "يقول إلهكم: «واسوا، واسوا شعبي!"]]}, {"l": "Isa 40:2", "n": "", "vs": [[2, "طيبوا خاطر أورشليم وبلغوها أن أيام محنتها قد انتهت، وإثمها قد غفر، وتلقت من يد الرب ضعفين عن جميع ما ارتكبته من خطايا»."]]}, {"l": "Isa 40:11", "n": "", "vs": [[11, "يرعى قطيعه كراع، ويجمع الحملان بذراعه، وفي أحضانه يحملها ويقود المرضعات برفق."]]}, {"l": "Eze 34:16", "n": "", "vs": [[16, "وأطلب الضال وأسترجع المطرود وأجبر الكسير وأعصب الجريح وأستأصل السمين والقوي، وأرعاها بعدل."]]}, {"l": "Mat 12:20", "n": "", "vs": [[20, "قصبة مرضوضة لا يكسر، وفتيلة مدخنة لا يطفيء، حتى يقود العدل إلى النصر،"]]}, {"l": "Luk 22:32", "n": "", "vs": [[32, "ولكني تضرعت لأجلك لكي لا يخيب إيمانك. وأنت، بعد أن تسترد، ثبت إخوتك»."]]}, {"l": "Joh 21:15-17", "n": "", "vs": [[15, "وبعدما أكلوا سأل يسوع سمعان بطرس: «ياسمعان بن يونا، أتحبني أكثر مما يحبني هؤلاء؟» فأجابه «نعم يارب، أنت تعلم أني أحبك!» فقال له: «أطعم حملاني!»"], [16, "ثم سأله ثانية: «ياسمعان بن يونا، أتحبني؟» فأجابه: «نعم يارب. أنت تعلم أني أحبك!» قال له: «ارع خرافي»"], [17, "فسأله مرة ثالثة: «ياسمعان بن يونا، أتحبني؟» فحزن بطرس لأن يسوع قال له في المرة الثالثة: «أتحبني». وقال له: «يارب، أنت تعلم كل شيء. أنت تعلم أني أحبك!» فقال له يسوع: «أطعم خرافي!"]]}, {"l": "Rom 14:1", "n": "", "vs": [[1, "ومن كان ضعيفا في الإيمان، فاقبلوه بينكم دون أن تحاكموه على أرائه."]]}, {"l": "Rom 15:1-3", "n": "", "vs": [[1, "ولكن علينا نحن الأقوياء (في الإيمان)، أن نحتمل ضعف الضعفاء (فيه)، وأن لا نرضي أنفسنا."], [2, "فليسع كل واحد منا لإرضاء قريبه من جهة ما هو صالح، في سبيل البنيان."], [3, "فحتى المسيح لم يسع لإرضاء نفسه، بل وفقا لما قد كتب: «تعييرات الذين يعيرونك وقعت علي»."]]}, {"l": "Gal 6:1", "n": "", "vs": [[1, "أيها الإخوة، إن سقط أحدكم في خطأ ما فمثل هذا أصلحوه أنتم الروحيين بروح وداعة. واحذر أنت لنفسك لئلا تجرب أيضا."]]}, {"l": "Gal 6:2", "n": "", "vs": [[2, "ليحمل الواحد منكم أثقال الآخر، وهكذا تتممون شريعة المسيح."]]}, {"l": "Heb 12:12", "n": "", "vs": [[12, "لذلك، شددوا أيديكم المرتخية، وركبكم المنحلة."]]}], "kwAr": "وتشددوا فاقدي العزم", "noteAr": ""}, {"kw": "support", "raw": "Act_20:35 *Gr.", "note": "", "refs": [{"l": "Act 20:35", "n": "*Gr.", "vs": [[35, "وقد أظهرت لكم بوضوح كيف يجب أن نبذل الجهد لنساعد المحتاجين، متذكرين كلمات الرب يسوع، إذ قال: الغبطة في العطاء أكثر مما في الأخذ!»"]]}], "kwAr": "وتساندوا الضعفاء", "noteAr": ""}, {"kw": "be", "raw": "Isa_63:9; 1Co_13:4, 1Co_13:5; Gal_5:22; Eph_4:2, Eph_4:32, Eph_5:1, Eph_5:2; Col_3:12, Col_3:13; 1Ti_3:3, 1Ti_6:11; 2Ti_2:24, 2Ti_2:25, 2Ti_4:2; Heb_5:2, Heb_5:3, Heb_13:3", "note": "", "refs": [{"l": "Isa 63:9", "n": "", "vs": [[9, "فتضايق في كل ضيقاتهم، وملاك حضرته أنقذهم، وبفضل محبته وحنانه افتداهم ورفعهم وحملهم طوال الأيام الغابرة."]]}, {"l": "1Co 13:4", "n": "", "vs": [[4, "المحبة تصبر طويلا؛ وهي لطيفة. المحبة لا تحسد. المحبة لا تتفاخر ولا تتكبر."]]}, {"l": "1Co 13:5", "n": "", "vs": [[5, "لا تتصرف بغير لياقة، ولا تسعى إلى مصلحتها الخاصة. لا تستفز سريعا، ولا تنسب الشر لأحد."]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Eph 4:2", "n": "", "vs": [[2, "بكل تواضع ووداعة وطول بال، محتملين بعضكم بعضا في المحبة،"]]}, {"l": "Eph 4:32", "n": "", "vs": [[32, "وكونوا لطفاء بعضكم نحو بعض، شفوقين، مسامحين بعضكم بعضا كما سامحكم الله في المسيح."]]}, {"l": "Eph 5:1", "n": "", "vs": [[1, "فاقتدوا إذن بالله كأولاد أحباء،"]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "Col 3:12", "n": "", "vs": [[12, "فباعتباركم جماعة مختارة من الله، قديسين محبوبين، البسوا دائما عواطف الحنان واللطف والتواضع والوداعة وطول البال،"]]}, {"l": "Col 3:13", "n": "", "vs": [[13, "محتملين بعضكم بعضا، ومسامحين بعضكم بعضا. إن كان لأحدكم شكوى على آخر، كما سامحكم الرب، هكذا افعلوا أنتم أيضا."]]}, {"l": "1Ti 3:3", "n": "", "vs": [[3, "لا مدمنا للخمر ولا عنيفا؛ بل لطيفا، غير متعود الخصام، غير مولع بالمال،"]]}, {"l": "1Ti 6:11", "n": "", "vs": [[11, "وأما أنت، ياإنسان الله، فاهرب من هذه الأمور، واسع في إثر البر والتقوى والإيمان والمحبة والصبر والوداعة."]]}, {"l": "2Ti 2:24", "n": "", "vs": [[24, "وعبد الرب يجب ألا يتشاجر، بل أن يكون مترفقا تجاه الجميع، قادرا على التعليم، يتحمل المشقات بصبر،"]]}, {"l": "2Ti 2:25", "n": "", "vs": [[25, "ويؤدب بالوداعة مقاومي الإيمان، عسى أن يمنحهم الله التوبة، فيعرفوا الحق بالتمام،"]]}, {"l": "2Ti 4:2", "n": "", "vs": [[2, "أن تنادي بالكلمة منشغلا بها كليا، في الفرص المناسبة وغير المناسبة على السواء، وأن توبخ وتنذر وتشجع بكل صبر في التعليم."]]}, {"l": "Heb 5:2", "n": "", "vs": [[2, "ولكونه، هو أيضا، معرضا للضعف البشري دائما، كان يمكنه أن يعطف على الجهال والضالين."]]}, {"l": "Heb 5:3", "n": "", "vs": [[3, "وبسبب ضعفه، كان من واجبه أيضا أن يكفر عن خطاياه الخاصة كما يكفر عن خطايا الآخرين."]]}, {"l": "Heb 13:3", "n": "", "vs": [[3, "اهتموا دائما بالمسجونين، كأنكم مسجونون معهم. وتعاطفوا مع المظلومين، كأنكم مظلومون معهم."]]}], "kwAr": "بطول البال", "noteAr": ""}], "arS": [["إلا أننا ", []], ["نناشدكم", ["G3870"]], ["، أيها ", []], ["الإخوة", ["G80"]], ["، أن ", []], ["تعظوا", ["G3560"]], [" ", []], ["الفوضويين", ["G813"]], ["، ", []], ["وتشددوا", ["G3888"]], [" ", []], ["فاقدي العزم", ["G3642"]], ["، ", []], ["وتساندوا", ["G472"]], [" ", []], ["الضعفاء", ["G772"]], ["، وتعاملوا ", []], ["الجميع", ["G3956"]], [" ", []], ["بطول البال", ["G3114"]], [".", []]]}, {"c": 5, "v": 15, "text": "حذار أن يبادل أحدكم شر غيره بشر مثله بل اسعوا دائما إلى الخير في معاملتكم بعضكم لبعض وللآخرين جميعا.", "groups": [{"kw": "See", "raw": "Gen_45:24; 1Co_16:10; Eph_5:15, Eph_5:33; 1Pe_1:22; Rev_19:10, Rev_22:9", "note": "", "refs": [{"l": "Gen 45:24", "n": "", "vs": [[24, "وهكذا صرف إخوته بعد أن أوصاهم: «لا تتخاصموا في الطريق»."]]}, {"l": "1Co 16:10", "n": "", "vs": [[10, "وإذا وصل تيموثاوس إليكم، فاهتموا بأن يكون مطمئنا عندكم، لأنه يقوم بعمل الرب مثلي."]]}, {"l": "Eph 5:15", "n": "", "vs": [[15, "فانتبهوا تماما إذن كيف تسلكون بتدقيق، لا سلوك الجهلاء بل سلوك العقلاء،"]]}, {"l": "Eph 5:33", "n": "", "vs": [[33, "إنما أنتم أيضا، كل بمفرده، ليحب كل واحد منكم زوجته كنفسه. وأما الزوجة، فعليها أن تهاب زوجها."]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}, {"l": "Rev 19:10", "n": "", "vs": [[10, "فجثوت عند قدميه لأسجد له، فقال لي: «لا تفعل! إني عبد لله، مثلك ومثل إخوتك المؤمنين الذين لديهم الشهادة المختصة بيسوع: لله اسجد! فإن الشهادة المختصة بيسوع هي روح النبوءة»."]]}, {"l": "Rev 22:9", "n": "", "vs": [[9, "فقال لي: «لا تفعل! إنني عبد مثلك ومثل إخوتك الأنبياء، ومثل الذين يراعون ما جاء في هذا الكتاب. لله اسجد!»"]]}], "kwAr": "حذار", "noteAr": ""}, {"kw": "none", "raw": "Exo_23:4, Exo_23:5; Lev_19:18; 1Sa_24:13; Psa_7:4; Pro_17:13, Pro_20:22, Pro_24:17, Pro_24:29; Pro_25:21; Mat_5:39, Mat_5:44, Mat_5:45; Luk_6:35; Rom_12:17-21; 1Co_6:7; 1Pe_2:22, 1Pe_2:23, 1Pe_3:9", "note": "", "refs": [{"l": "Exo 23:4", "n": "", "vs": [[4, "إذا صادفت ثور عدوك أو حماره شاردا، فرده إليه."]]}, {"l": "Exo 23:5", "n": "", "vs": [[5, "وإذا عاينت حمار مبغضك واقعا تحت حمله، فلا تتجاوزه حتى تسعف عدوك في حل ثقل حماره."]]}, {"l": "Lev 19:18", "n": "", "vs": [[18, "لا تنتقم ولا تحقد على أحد أبناء شعبك، ولكن تحب قريبك كما تحب نفسك، فأنا الرب."]]}, {"l": "1Sa 24:13", "n": "", "vs": [[13, "وكما قيل في مثل القدماء: عن الأشرار يصدر شر، لذلك فإن يدي لن تنالك بأذى."]]}, {"l": "Psa 7:4", "n": "", "vs": [[4, "إن كنت قد أسأت لمن أحسن إلي وسلبت عدوي من غير سبب،"]]}, {"l": "Pro 17:13", "n": "", "vs": [[13, "من يجازي خيرا بشر، لن يبرح الشر من بيته."]]}, {"l": "Pro 20:22", "n": "", "vs": [[22, "لا تقل: لأجازين من أساء إلي شرا. انتظر، فالرب يعينك."]]}, {"l": "Pro 24:17", "n": "", "vs": [[17, "لا تشمت لسقوط عدوك، ولا يبتهج قلبك إذا عثر،"]]}, {"l": "Pro 24:29", "n": "", "vs": [[29, "لا تقل: سأعامله بمثل ما عاملني، وأجازيه على ما ارتكبه في
