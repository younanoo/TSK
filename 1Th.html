<script>window.CATALOG=[{"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 20, "nv": 480, "refs": 6756, "last": "20:49", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "verses": [{"c": 1, "v": 1, "text": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح.", "groups": [{"kw": "Silvanus", "raw": "Act_15:27, Act_15:32, Act_15:34, Act_15:40, Act_16:19, Act_16:25, Act_16:29, Act_17:4, Act_17:15, Act_18:5, Silas, 2Co_1:19; 2Th_1:1; 1Pe_5:12", "note": "Act_15:27, Act_15:32, Act_15:34, Act_15:40, Act_16:19, Act_16:25, Act_16:29, Act_17:4, Act_17:15, Act_18:5, Silas, 2Co_1:19; 2Th_1:1; 1Pe_5:12", "refs": [{"l": "Act 15:27", "n": "", "vs": [[27, "فأرسلنا يهوذا وسيلا، ليبلغاكم الرسالة نفسها شفاها."]]}, {"l": "Act 15:32", "n": "", "vs": [[32, "وكان يهوذا وسيلا نبيين أيضا، فوعظا الإخوة كثيرا، وشددا عزيمتهم."]]}, {"l": "Act 15:34", "n": "", "vs": [[34, "ولكن سيلا استحسن البقاء في أنطاكية، فعاد يهوذا وحده."]]}, {"l": "Act 15:40", "n": "", "vs": [[40, "واختار بولس أن يرافقه سيلا. فأسلمه الإخوة إلى نعمة الله،"]]}, {"l": "Act 16:19", "n": "", "vs": [[19, "ولما رأى سادتها أن مورد رزقهم قد انقطع، قبضوا على بولس وسيلا، وجروهما إلى ساحة المدينة للمحاكمة،"]]}, {"l": "Act 16:25", "n": "", "vs": [[25, "ونحو منتصف الليل كان بولس وسيلا يصليان ويسبحان الله، والمسجونون يسمعونهما،"]]}, {"l": "Act 16:29", "n": "", "vs": [[29, "فطلب ضوءا، واندفع إلى الداخل وهو يرتجف خوفا، وارتمى أمام بولس وسيلا،"]]}, {"l": "Act 17:4", "n": "", "vs": [[4, "فاقتنع بعض الحاضرين وانضموا إلى بولس وسيلا. وكان بينهم عدد كبير من اليونانيين المتعبدين لله وكثيرات من النساء النبيلات."]]}, {"l": "Act 17:15", "n": "", "vs": [[15, "ورافق الإخوة بولس حتى أوصلوه إلى أثينا، ثم رجعوا بعدما أوصاهم بولس بأن يلحق به سيلا وتيموثاوس بأسرع ما يمكن."]]}, {"l": "Act 18:5", "n": "", "vs": [[5, "ولما وصل سيلا وتيموثاوس من مقاطعة مقدونية، تفرغ بولس تماما للتبشير، شاهدا لليهود أن يسوع هو المسيح."]]}, {"l": "2Co 1:19", "n": "", "vs": [[19, "فإن ابن الله، المسيح يسوع، الذي بشرنا به فيما بينكم، أنا وسلوانس وتيموثاوس، لم يكن نعم ولا معا، وإنما فيه نعم."]]}, {"l": "2Th 1:1", "n": "", "vs": [[1, "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."]]}, {"l": "1Pe 5:12", "n": "", "vs": [[12, "إني مرسل إليكم هذه الرسالة القصيرة بيد سلوانس الأخ الأمين. وغايتي أن أحرضكم وأشهد لكم أن النعمة التي تتمتعون بها هي نعمة الله الحقيقية التي أنتم فيها ثابتون."]]}], "kwAr": "سلوانس", "noteAr": "هو سيلا؛ انظر أع 15: 22، 40؛ 2كو 1: 19؛ 1بط 5: 12."}, {"kw": "Timotheus", "raw": "Act_16:1-3, Act_17:14, Act_17:15, Act_18:5, Act_19:22, Act_20:4; 2Co_1:1; Phi_1:1; Col_1:1; 1Ti_1:2; 2Ti_1:2; Heb_13:23", "note": "", "refs": [{"l": "Act 16:1-3", "n": "", "vs": [[1, "ووصل بولس إلى دربة، ثم إلى لسترة، وكان فيها تلميذ اسمه تيموثاوس، أمه يهودية كانت قد آمنت بالمسيح، وأبوه يوناني."], [2, "وكان الإخوة في لسترة وإيقونية يشهدون لتيموثاوس شهادة حسنة."], [3, "فأحب بولس أن يصحبه في التبشير. ولأن يهود تلك المنطقة كانوا يعرفون أن أباه يوناني، فقد أخذه بولس وختنه."]]}, {"l": "Act 17:14", "n": "", "vs": [[14, "وفي الحال أخذ بعض الإخوة بولس نحو البحر ليسافر، وبقي سيلا وتيموثاوس هناك."]]}, {"l": "Act 17:15", "n": "", "vs": [[15, "ورافق الإخوة بولس حتى أوصلوه إلى أثينا، ثم رجعوا بعدما أوصاهم بولس بأن يلحق به سيلا وتيموثاوس بأسرع ما يمكن."]]}, {"l": "Act 18:5", "n": "", "vs": [[5, "ولما وصل سيلا وتيموثاوس من مقاطعة مقدونية، تفرغ بولس تماما للتبشير، شاهدا لليهود أن يسوع هو المسيح."]]}, {"l": "Act 19:22", "n": "", "vs": [[22, "فأرسل إلى مقدونية اثنين من معاونيه، هما تيموثاوس وأرسطوس، وبقي مدة من الزمن في مقاطعة أسيا."]]}, {"l": "Act 20:4", "n": "", "vs": [[4, "ورافقه في السفر سوباترس بن برس من بيرية؛ وأرسترخس وسكوندس من تسالونيكي؛ وغايوس وتيموثاوس من دربة، وتيخيكس وتروفيمس من مقاطعة أسيا."]]}, {"l": "2Co 1:1", "n": "", "vs": [[1, "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."]]}, {"l": "Phi 1:1", "n": "", "vs": [[1, "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."]]}, {"l": "Col 1:1", "n": "", "vs": [[1, "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"]]}, {"l": "1Ti 1:2", "n": "", "vs": [[2, "إلى تيموثاوس ولدي الحقيقي في الإيمان. لتكن لك النعمة والرحمة والسلام من الله أبينا والمسيح يسوع ربنا!"]]}, {"l": "2Ti 1:2", "n": "", "vs": [[2, "إلى تيموثاوس، ولدي الحبيب لتكن لك النعمة والرحمة والسلام من الله الآب والمسيح يسوع ربنا."]]}, {"l": "Heb 13:23", "n": "", "vs": [[23, "واعلموا أن أخانا تيموثاوس قد أطلق من السجن. فإن أسرع في المجيء إلي، نذهب معا لرؤيتكم."]]}], "kwAr": "تيموثاوس", "noteAr": ""}, {"kw": "unto the", "raw": "1Co_1:2; Gal_1:2", "note": "", "refs": [{"l": "1Co 1:2", "n": "", "vs": [[2, "إلى كنيسة الله في مدينة كورنثوس، إلى الذين تقدسوا في المسيح يسوع، المدعوين، القديسين؛ وإلى جميع الذين يدعون باسم ربنا يسوع المسيح في كل مكان ربا لهم ولنا."]]}, {"l": "Gal 1:2", "n": "", "vs": [[2, "ومن جميع الإخوة الذين معي، إلى الكنائس في مقاطعة غلاطية."]]}], "kwAr": "إلى كنيسة", "noteAr": ""}, {"kw": "Thessalonians", "raw": "Act_17:1-9, Act_17:11, Act_17:13", "note": "", "refs": [{"l": "Act 17:1-9", "n": "", "vs": [[1, "وصل بولس وسيلا إلى تسالونيكي بعدما مرا بأمفيبوليس وأبولونية. وكان في تسالونيكي مجمع لليهود."], [2, "فذهب إليه كعادته، وناقشهم لثلاثة سبوت، مستندا إلى الكتاب،"], [3, "وشرح لهم مبينا أن المسيح كان لابد أن يتألم ويقوم من بين الأموات، وأن «المسيح الذي تنتظرونه هو يسوع الذي أبشركم به الآن!»"], [4, "فاقتنع بعض الحاضرين وانضموا إلى بولس وسيلا. وكان بينهم عدد كبير من اليونانيين المتعبدين لله وكثيرات من النساء النبيلات."], [5, "فأثار ذلك حسد اليهود الذين لم يؤمنوا، فأتوا ببعض الأشرار من أبناء الشارع، وجمعوا جمهورا وأخذوا يحرضون الناس حتى أثاروا الفوضى في المدينة، ثم هجموا على بيت ياسون مطالبين بتسليم بولس وسيلا إلى الجمع."], [6, "ولما لم يجدوهما هناك جروا ياسون وبعض الإخوة واقتادوهم إلى حكام المدينة، واشتكوا عليهم صارخين: «إن هذين الرجلين اللذين قلبا الدنيا ، قد جاءا إلى مدينتنا أيضا،"], [7, "فاستضافهما ياسون. وهم جميعا يخالفون أوامر القيصر، وينادون بملك آخر اسمه يسوع»."], [8, "فأحدثوا انزعاجا لدى الجمع والحكام عندما سمعوا هذا."], [9, "فقبض الحكام كفالة من ياسون ومن معه ثم أفرجوا عنهم."]]}, {"l": "Act 17:11", "n": "", "vs": [[11, "وكان يهود بيرية أشرف من يهود تسالونيكي، فقبلوا كلمة الله برغبة شديدة، وأخذوا يدرسون الكتاب يوميا ليتأكدوا من صحة التعليم."]]}, {"l": "Act 17:13", "n": "", "vs": [[13, "وعرف يهود تسالونيكي أن بولس يبشر بكلمة الله في بيرية، فلحقوا به وبدأوا يحرضون الجموع ليثوروا عليه."]]}], "kwAr": "مؤمني تسالونيكي", "noteAr": ""}, {"kw": "in God", "raw": "Gal_1:22; 2Th_1:1; 1Jo_1:3; Jud_1:1", "note": "", "refs": [{"l": "Gal 1:22", "n": "", "vs": [[22, "إلا أنني كنت غير معروف شخصيا لدى كنائس اليهودية التي هي في المسيح."]]}, {"l": "2Th 1:1", "n": "", "vs": [[1, "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."]]}, {"l": "1Jo 1:3", "n": "", "vs": [[3, "فنحن، إذن، نخبركم بما رأيناه وسمعناه، لكي تكونوا شركاءنا. كما أن شركتنا هي مع الآب ومع ابنه يسوع المسيح."]]}, {"l": "Jud 1:1", "n": "", "vs": [[1, "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."]]}], "kwAr": "في الله الآب", "noteAr": ""}, {"kw": "Grace", "raw": "Rom_1:7; Eph_1:2", "note": "", "refs": [{"l": "Rom 1:7", "n": "", "vs": [[7, "إلى جميع من هم في روما من أحباء الله القديسين المدعوين. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}, {"l": "Eph 1:2", "n": "", "vs": [[2, "لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."]]}], "kwAr": "النعمة والسلام", "noteAr": ""}], "arS": [["من ", []], ["بولس", ["G3972"]], [" ", []], ["وسلوانس", ["G4610"]], [" ", []], ["وتيموثاوس", ["G5095"]], ["، إلى ", []], ["كنيسة", ["G1577"]], [" مؤمني ", []], ["تسالونيكي", ["G2331"]], [" الذين هم في ", []], ["الله", ["G2316"]], [" ", []], ["الآب", ["G3962"]], [" ", []], ["والرب", ["G2962"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [". لتكن لكم ", []], ["النعمة", ["G5485"]], [" ", []], ["والسلام", ["G1515"]], [" ", []], ["من", ["G575"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["أبينا", ["G3962", "G2257"]], [" ", []], ["والرب", ["G2962"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 1, "v": 2, "text": "إننا نشكر الله دائما من أجلكم جميعا، إذ نذكركم في صلواتنا دون توقف؛", "groups": [{"kw": "", "raw": "Rom_1:8, Rom_1:9, Rom_6:17; 1Co_1:4; Eph_1:15, Eph_1:16; Phi_1:3, Phi_1:4; Col_1:3; Phm_1:4", "note": "", "refs": [{"l": "Rom 1:8", "n": "", "vs": [[8, "بادىء بدء، أشكر إلهي بيسوع المسيح من أجلكم جميعا، لأن إيمانكم يذاع خبره في العالم كله."]]}, {"l": "Rom 1:9", "n": "", "vs": [[9, "فإن الله الذي أخدمه بروحي في التبشير بإنجيل ابنه، هو شاهد لي كيف لا أتوقف عن ذكركم"]]}, {"l": "Rom 6:17", "n": "", "vs": [[17, "إنما الشكر لله، لأنكم كنتم عبيدا للخطيئة ولكن أطعتم من القلب صيغة التعليم الذي وضعتم في عهدته."]]}, {"l": "1Co 1:4", "n": "", "vs": [[4, "إني أشكر الله من أجلكم دائما، وعلى نعمة الله الموهوبة لكم في المسيح يسوع."]]}, {"l": "Eph 1:15", "n": "", "vs": [[15, "لذلك أنا أيضا، وقد سمعت بما فيكم من الإيمان بالرب يسوع والمحبة لجميع القديسين،"]]}, {"l": "Eph 1:16", "n": "", "vs": [[16, "لا أنقطع عن شكر الله لأجلكم وعن ذكركم في صلواتي،"]]}, {"l": "Phi 1:3", "n": "", "vs": [[3, "إني أشكر إلهي كلما تذكرتكم،"]]}, {"l": "Phi 1:4", "n": "", "vs": [[4, "إذ أتضرع بفرح لأجلكم جميعا كل حين في جميع صلواتي،"]]}, {"l": "Col 1:3", "n": "", "vs": [[3, "إننا دائما نرفع الشكر لله، أبي ربنا يسوع المسيح فيما نصلي لأجلكم."]]}, {"l": "Phm 1:4", "n": "", "vs": [[4, "إني أشكر إلهي، إذ أذكرك دائما في صلواتي،"]]}], "kwAr": "", "noteAr": ""}], "arS": [["إننا ", []], ["نشكر", ["G2168"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["دائما", ["G3842"]], [" من أجلكم ", []], ["جميعا", ["G3956"]], ["، إذ ", []], ["نذكركم", ["G4160", "G3417"]], [" في ", []], ["صلواتنا", ["G4335", "G2257"]], [" دون توقف؛", []]]}, {"c": 1, "v": 3, "text": "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛", "groups": [{"kw": "Remembering", "raw": "1Th_3:6; 2Ti_1:3-5", "note": "", "refs": [{"l": "1Th 3:6", "n": "", "vs": [[6, "أما الآن، وقد عاد تيموثاوس إلينا من عندكم وبشرنا بما لكم من إيمان ومحبة، وبأنكم تذكروننا ذكرا حسنا في كل حين، وتشتاقون كثيرا لرؤيتنا كما نشتاق نحن لرؤيتكم،"]]}, {"l": "2Ti 1:3-5", "n": "", "vs": [[3, "كم أشكر الله ، الذي أعبده بضمير طاهر كما أخذت عن أجدادي، إذ مازلت أذكرك دائما في تضرعاتي ليلا ونهارا؛"], [4, "وإذ أتذكر دموعك (ساعة افتراقنا) أجدني في غاية الشوق لأن أراك لأمتليء فرحا."], [5, "كما أستذكر إيمانك الخالي من الرياء، هذا الإيمان الذي فيك والذي حل أولا في جدتك لوئيس ثم في أمك أفنيكي، وأنا متأكد أنه حال فيك أيضا."]]}], "kwAr": "متذكرين", "noteAr": ""}, {"kw": "your", "raw": "1Th_2:13, 1Th_2:14; Joh_6:27-29; Rom_16:26; 1Co_15:58; Gal_5:6; 2Th_1:3, 2Th_1:11; Heb_4:11, Heb_11:7, Heb_11:8, Heb_11:17, Heb_11:24-34; Jam_2:17-26; Rev_2:19", "note": "", "refs": [{"l": "1Th 2:13", "n": "", "vs": [[13, "ولذلك نحن أيضا نرفع الشكر لله بلا توقف، لأنكم لما تلقيتم منا كلمة البشارة من الله، قبلتموها لا كأنها كلمة بشر، بل كما هي في الحقيقة: باعتبارها كلمة الله العاملة أيضا فيكم أنتم المؤمنين."]]}, {"l": "1Th 2:14", "n": "", "vs": [[14, "فإنكم، أيها الإخوة، قد صرتم على مثال كنائس الله التي في منطقة اليهودية والتي هي في المسيح يسوع. فأنتم أيضا قاسيتم على أيدي بني جنسكم ما قاسوه هم على أيدي اليهود"]]}, {"l": "Joh 6:27-29", "n": "", "vs": [[27, "لا تسعوا وراء الطعام الفاني، بل وراء الطعام الباقي إلى الحياة الأبدية، والذي يعطيكم إياه ابن الإنسان، لأن هذا الطعام قد وضع الله الآب ختمه عليه»."], [28, "فسألوه: «ماذا نفعل لنعمل ما يطلبه الله ؟»"], [29, "أجاب يسوع: «العمل الذي يطلبه الله هو أن تؤمنوا بمن أرسله»."]]}, {"l": "Rom 16:26", "n": "", "vs": [[26, "ولكن أذيع الآن، بأمر الله الأزلي في الكتابات النبوية، على جميع الأمم لأجل إطاعة الإيمان؛"]]}, {"l": "1Co 15:58", "n": "", "vs": [[58, "إذن، ياإخوتي الأحباء، كونوا راسخين غير متزحزحين، كثيري الاجتهاد في عمل الرب دائما، عالمين أن جهدكم في الرب ليس عبثا!"]]}, {"l": "Gal 5:6", "n": "", "vs": [[6, "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة."]]}, {"l": "2Th 1:3", "n": "", "vs": [[3, "من واجبنا أن نشكر الله على الدوام لأجلكم أيها الإخوة. كما أن هذا حق: لأن إيمانكم ينمو نموا فائقا، ومحبة أحدكم للآخر تفيض بينكم جميعا."]]}, {"l": "2Th 1:11", "n": "", "vs": [[11, "لأجل ذلك أيضا نصلي من أجلكم على الدوام، لكي يجعلكم إلهنا مؤهلين للدعوة الإلهية ويتم فيكم، بقدرته، كل ما يسره من الصلاح وفعالية الإيمان،"]]}, {"l": "Heb 4:11", "n": "", "vs": [[11, "لذلك، لنجتهد جميعا للدخول إلى تلك الراحة، لكي لا يسقط أحد منا كما سقط أولئك الذين عصوا أمر الله."]]}, {"l": "Heb 11:7", "n": "", "vs": [[7, "وبالإيمان نوح، لما أنذره الله عن طريق الوحي بالطوفان الآتي، دفعه خوف الله إلى بناء سفينة ضخمة كانت وسيلة النجاة له ولعائلته، مع أنه لم يكن قد رأى طوفانا من قبل. وبعمله هذا، حكم على العالم وأصبح وارثا للبر القائم على أساس الإيمان."]]}, {"l": "Heb 11:8", "n": "", "vs": [[8, "وبالإيمان، لبى إبراهيم دعوة الله، فترك وطنه وانطلق إلى أرض أخرى وعده الله بأن يورثه إياها. ولما خرج من بيته، كان لا يعرف أين يتوجه."]]}, {"l": "Heb 11:17", "n": "", "vs": [[17, "وبالإيمان، إبراهيم أيضا، لما امتحنه الله ، قدم إسحاق ابنه. فإنه، إذ قبل وعود الله، قدم ابنه الوحيد ذبيحة،"]]}, {"l": "Heb 11:24-34", "n": "", "vs": [[24, "وبالإيمان، موسى نفسه، لما كبر، رفض أن يدعى ابنا لابنة فرعون."], [25, "بل اختار أن يتحمل المذلة مع شعب الله، بدلا من التمتع الوقتي بلذات الخطيئة."], [26, "فقد اعتبر أن عار المسيح، هو ثروة أعظم من كنوز مصر، لأنه كان يتطلع إلى المكافأة."], [27, "بالإيمان، ترك أرض مصر وهو غير خائف من غضب الملك. فقد مضى في تنفيذ قراره، كأنه يرى بجانبه الله غير المنظور."], [28, "وبالإيمان، أقام الفصح ورش الدم، لكي لا يمس مهلك الأبكار أحدا من أبناء شعبه."], [29, "بالإيمان اجتاز الشعب في البحر الأحمر كأنه أرض يابسة. أما المصريون، فإذ حاولوا ذلك غرقوا!"], [30, "بالإيمان انهارت أسوار مدينة أريحا، بعدما دار الشعب حولها لمدة سبعة أيام."], [31, "وجزاء للإيمان، نجت راحاب الزانية من الموت المحتم مع المتمردين، بعدما استقبلت الجاسوسين بسلام."], [32, "وهل من حاجة بعد لمزيد من الأمثلة؟ إن الوقت لا يتسع لي حتى أسرد أخبار الإيمان عن: جدعون وباراق وشمشون ويفتاح وداود وصموئيل والأنبياء."], [33, "فبالإيمان، تغلب هؤلاء على ممالك الأعداء، وحكموا حكما عادلا ونالوا ما وعدهم به الله . وبه، أطبقوا أفواه الأسود،"], [34, "وأبطلوا قوة النار، ونجوا من الموت قتلا بالسيف. وبه أيضا نالوا القوة بعد ضعف، فصاروا أشداء في المعارك، وردوا جيوشا غريبة على أعقابها."]]}, {"l": "Jam 2:17-26", "n": "", "vs": [[17, "هكذا نرى أن الإيمان وحده ميت ما لم تنتج عنه أعمال."], [18, "وربما قال أحدكم: «أنت لك إيمان وأنا لي أعمال». أرني كيف يكون إيمانك من غير أعمال، وأنا أريك كيف يكون إيماني بأعمالي."], [19, "أنت تؤمن أن الله واحد؟ حسنا تفعل ! والشياطين أيضا تؤمن بهذه الحقيقة، ولكنها ترتعد خوفا."], [20, "وهذا يؤكد لك، أيها الإنسان الغبي، أن الإيمان الذي لا تنتج عنه أعمال هو إيمان ميت!"], [21, "لنأخذ أبانا إبراهيم مثلا: كيف تبرر؟ أليس بأعماله، إذ أصعد ابنه إسحاق على المذبح"], [22, "فأنت ترى أن إيمان إبراهيم قد رافقته الأعمال. فبالأعمال قد اكتمل الإيمان."], [23, "وهكذا، تم ما قاله الكتاب: «آمن إبراهيم بالله، فحسب له ذلك برا»، حتى إنه دعي «خليل الله»."], [24, "فترون إذن أن الإنسان لا يتبرر بإيمانه فقط، بل بأعماله أيضا."], [25, "على هذا الأساس أيضا، تبررت راحاب التي كانت زانية: فقد استقبلت الرجلين اللذين أرسلا إليها، وصرفتهما في طريق آخر."], [26, "فكما أن جسم الإنسان يكون ميتا إذا فارقته الروح، كذلك يكون الإيمان ميتا إذا لم ترافقه الأعمال!"]]}, {"l": "Rev 2:19", "n": "", "vs": [[19, "إني عالم بأعمالك، ومحبتك، وإيمانك، وتضحيتك، وصبرك؛ وأعلم أن أعمالك الأخيرة زادت عما كانت عليه قبلا!"]]}], "kwAr": "عمل الإيمان", "noteAr": ""}, {"kw": "and labour", "raw": "Gen_29:20; Son_8:7; Joh_14:15, Joh_14:21-23, Joh_15:10, Joh_21:15-17; Rom_16:6; 1Co_13:4-7; 2Co_5:14, 2Co_5:15, 2Co_8:7-9; Gal_5:13; Phm_1:5-7; Heb_6:10,Heb_6:11; 1Jo_3:18, 1Jo_5:3; Rev_2:2-4", "note": "", "refs": [{"l": "Gen 29:20", "n": "", "vs": [[20, "فخدم يعقوب سبع سنوات ليتزوج من راحيل بدت في نظره كأيام قليلة، لفرط محبته لها."]]}, {"l": "Son 8:7", "n": "", "vs": [[7, "لا يمكن للمياه الغزيرة أن تخمد المحبة، ولا تستطيع السيول أن تغمرها. لو بذل الإنسان كل ثروة بيته ثمنا للمحبة لاحتقرت أشد الاحتقار."]]}, {"l": "Joh 14:15", "n": "", "vs": [[15, "إن كنتم تحبونني فاعملوا بوصاياي."]]}, {"l": "Joh 14:21-23", "n": "", "vs": [[21, "من كانت عنده وصاياي، ويعمل بها، فذاك يحبني. والذي يحبني، يحبه أبي، وأنا أحبه وأعلن له ذاتي»."], [22, "فسأله يهوذا، غير الإسخريوطي: «ياسيد، ماذا جرى حتى تعلن لنا ذاتك ولا تعلنها للعالم؟»"], [23, "أجابه يسوع: «من يحبني يعمل بكلمتي، ويحبه أبي، وإليه نأتي، وعنده نجعل لنا منزلا."]]}, {"l": "Joh 15:10", "n": "", "vs": [[10, "إن عملتم بوصاياي، تثبتون في محبتي، كما عملت أنا بوصايا أبي وأثبت في محبته!"]]}, {"l": "Joh 21:15-17", "n": "", "vs": [[15, "وبعدما أكلوا سأل يسوع سمعان بطرس: «ياسمعان بن يونا، أتحبني أكثر مما يحبني هؤلاء؟» فأجابه «نعم يارب، أنت تعلم أني أحبك!» فقال له: «أطعم حملاني!»"], [16, "ثم سأله ثانية: «ياسمعان بن يونا، أتحبني؟» فأجابه: «نعم يارب. أنت تعلم أني أحبك!» قال له: «ارع خرافي»"], [17, "فسأله مرة ثالثة: «ياسمعان بن يونا، أتحبني؟» فحزن بطرس لأن يسوع قال له في المرة الثالثة: «أتحبني». وقال له: «يارب، أنت تعلم كل شيء. أنت تعلم أني أحبك!» فقال له يسوع: «أطعم خرافي!"]]}, {"l": "Rom 16:6", "n": "", "vs": [[6, "سلموا على مريم التي أجهدت نفسها كثيرا في خدمتنا من قبلكم."]]}, {"l": "1Co 13:4-7", "n": "", "vs": [[4, "المحبة تصبر طويلا؛ وهي لطيفة. المحبة لا تحسد. المحبة لا تتفاخر ولا تتكبر."], [5, "لا تتصرف بغير لياقة، ولا تسعى إلى مصلحتها الخاصة. لا تستفز سريعا، ولا تنسب الشر لأحد."], [6, "لا تفرح بالظلم، بل تفرح بالحق."], [7, "إنها تستر كل شيء، وتصدق كل شيء، وترجو كل شيء، وتتحمل كل شيء."]]}, {"l": "2Co 5:14", "n": "", "vs": [[14, "فإن محبة المسيح تسيطر علينا، وقد حكمنا بهذا: مادام واحد قد مات عوضا عن الجميع، فمعنى ذلك أن الجميع ماتوا؛"]]}, {"l": "2Co 5:15", "n": "", "vs": [[15, "وهو قد مات عوضا عن الجميع حتى لا يعيش الأحياء في ما بعد لأنفسهم بل للذي مات عوضا عنهم ثم قام."]]}, {"l": "2Co 8:7-9", "n": "", "vs": [[7, "ولكن، كما أنكم في وفرة من كل شيء: من الإيمان، والكلمة، والمعرفة، والاجتهاد في كل أمر، ومحبتكم لنا، ليتكم تكونون أيضا في وفرة من نعمة العطاء هذه."], [8, "لا أقول هذا على سبيل الأمر، بل اختبارا لصدق محبتكم بحماسة الآخرين."], [9, "فأنتم تعرفون نعمة ربنا يسوع المسيح: فمن أجلكم افتقر، وهو الغني لكي تغتنوا أنتم بفقره."]]}, {"l": "Gal 5:13", "n": "", "vs": [[13, "فإنما إلى الحرية قد دعيتم، أيها الإخوة؛ ولكن لا تتخذوا من الحرية ذريعة لإرضاء الجسد، بل بالمحبة كونوا عبيدا في خدمة أحدكم الآخر."]]}, {"l": "Phm 1:5-7", "n": "", "vs": [[5, "وقد سمعت بما لك من محبة وأمانة من نحو الرب يسوع، ومن نحو جميع القديسين،"], [6, "طالبا أن يكون اشتراكك معنا في الإيمان فعالا، فتدرك إلى التمام ما فينا من كل صلاح لأجل المسيح."], [7, "فقد كان لي أيها الأخ، سرور عظيم وتشجيع، بفضل محبتك، لأن عواطف القديسين قد انتعشت بفضلك!"]]}, {"l": "Heb 6:10", "n": "", "vs": [[10, "وليس الله بظالم حتى ينسى عملكم الجاد في إظهار محبتكم له عن طريق خدمتكم للقديسين إكراما لاسمه، الأمر الذي قمتم به قبلا، وتقومون به الآن!"]]}, {"l": "Heb 6:11", "n": "", "vs": [[11, "وإنما نتمنى أن يظهر كل واحد منكم اجتهادا مماثلا في المحافظة حتى النهاية على الثقة الكاملة بالرجاء."]]}, {"l": "1Jo 3:18", "n": "", "vs": [[18, "أيها الأولاد الصغار، لا يجب أن تكون محبتنا مجرد ادعاء بالكلام واللسان، بل تكون محبة عملية حقة."]]}, {"l": "1Jo 5:3", "n": "", "vs": [[3, "فالمحبة الحقيقية لله هي أن نعمل بما يوصينا به. وهو لا يوصينا وصية فوق طاقتنا."]]}, {"l": "Rev 2:2-4", "n": "", "vs": [[2, "إني عالم بأعمالك، وجهدك، وصبرك، وأعلم أنك لا تستطيع احتمال الأشرار، وأنك دققت في فحص ادعاءات أولئك الذين يزعمون أنهم رسل، وما هم برسل، فتبين لك أنهم دجالون!"], [3, "وقد تألمت من أجل اسمي بصبر وبغير كلل."], [4, "ولي عليك أنك تركت محبتك الأولى!"]]}], "kwAr": "واجتهاد المحبة", "noteAr": ""}, {"kw": "and patience", "raw": "Rom_2:7, Rom_5:3-5, Rom_8:24, Rom_8:25, Rom_12:12, Rom_15:13; 1Co_13:13; Gal_6:9; Heb_6:15; Heb_10:36; Jam_1:3, Jam_1:4, Jam_5:7, Jam_5:8; 1Jo_3:3; Rev_3:10", "note": "", "refs": [{"l": "Rom 2:7", "n": "", "vs": [[7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"]]}, {"l": "Rom 5:3-5", "n": "", "vs": [[3, "ليس هذا فقط، بل نفتخر أيضا في وسط الضيقات، لعلمنا أن الضيق ينتج فينا الصبر،"], [4, "والصبر يؤهلنا للفوز في الامتحان، والفوز يبعث فينا الرجاء،"], [5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."]]}, {"l": "Rom 8:24", "n": "", "vs": [[24, "فإننا قد خلصنا، إنما بالرجاء؛ ولكن الرجاء متى رأيناه لا يكون رجاء؛ فما يراه الإنسان لماذا يرجوه بعد؟"]]}, {"l": "Rom 8:25", "n": "", "vs": [[25, "ولكن، إن كنا نرجو ما لا نراه، فبالصبر نتوقعه."]]}, {"l": "Rom 12:12", "n": "", "vs": [[12, "فرحين بالرجاء، صابرين في الضيق، مواظبين على الصلاة،"]]}, {"l": "Rom 15:13", "n": "", "vs": [[13, "فليملأكم إله الرجاء كل فرح وسلام في إيمانكم حتى تزدادوا رجاء بقوة الروح القدس."]]}, {"l": "1Co 13:13", "n": "", "vs": [[13, "أما الآن، فهذه الثلاثة باقية: الإيمان، والرجاء، والمحبة. ولكن أعظمها هي المحبة!"]]}, {"l": "Gal 6:9", "n": "", "vs": [[9, "لأننا، متى حان الأوان، سنحصد، إن كنا لا نتراخى."]]}, {"l": "Heb 6:15", "n": "", "vs": [[15, "وهكذا، انتظر إبراهيم بصبر فنال ما وعد به."]]}, {"l": "Heb 10:36", "n": "", "vs": [[36, "إنكم تحتاجون إلى الصبر لتعملوا إرادة الله، فتنالوا البركة التي وعدتم بها."]]}, {"l": "Jam 1:3", "n": "", "vs": [[3, "وكونوا على ثقة بأن امتحان إيمانكم هذا ينتج صبرا."]]}, {"l": "Jam 1:4", "n": "", "vs": [[4, "ودعوا الصبر يعمل عمله الكامل فيكم، لكي يكتمل نضوجكم وتصيروا أقوياء قادرين على مواجهة جميع الأحوال."]]}, {"l": "Jam 5:7", "n": "", "vs": [[7, "وأما أنتم، ياإخوتي، فاصبروا منتظرين عودة الرب. خذوا العبرة من الفلاح: فهو ينتظر أن تعطيه الأرض غلالا ثمينة، صابرا على الزرع حتى يشرب من مطر الخريف ومطر الربيع."]]}, {"l": "Jam 5:8", "n": "", "vs": [[8, "فاصبروا أنتم إذن، وشددوا قلوبكم لأن عودة الرب قد صارت قريبة."]]}, {"l": "1Jo 3:3", "n": "", "vs": [[3, "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر."]]}, {"l": "Rev 3:10", "n": "", "vs": [[10, "ولأنك حفظت كلمتي وصبرت، فسأحفظك أنا أيضا من ساعة التجربة التي ستأتي على العالم أجمع لتجرب الساكنين على الأرض."]]}], "kwAr": "وثبات الرجاء", "noteAr": ""}, {"kw": "in the", "raw": "Ecc_2:26; Act_3:19, Act_10:31; 2Co_2:17; 1Ti_2:3; Heb_13:21; 1Pe_3:4; 1Jo_3:21", "note": "", "refs": [{"l": "Ecc 2:26", "n": "", "vs": [[26, "لأن المرء الذي يحظى برضى الله ينعم الله عليه بالحكمة والمعرفة والفرح. أما الخاطيء فيفرض عليه عناء الجمع والادخار، ليكون ذلك من نصيب من يرضي الله . وهذا أيضا باطل كملاحقة الريح."]]}, {"l": "Act 3:19", "n": "", "vs": [[19, "فتوبوا وارجعوا ليمحو الله خطاياكم،"]]}, {"l": "Act 10:31", "n": "", "vs": [[31, "وقال لي: ياكرنيليوس، سمع الله صلاتك وذكر صدقاتك."]]}, {"l": "2Co 2:17", "n": "", "vs": [[17, "فإننا لا نتاجر بكلمة الله كما يفعل الكثيرون، وإنما بإخلاص ومن قبل الله، وأمام الله، نتكلم في المسيح."]]}, {"l": "1Ti 2:3", "n": "", "vs": [[3, "فإن هذا الأمر جيد ومقبول في نظر الله مخلصنا،"]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}, {"l": "1Pe 3:4", "n": "", "vs": [[4, "وإنما لتعتمد الزينة الداخلية، ليكون قلبها متزينا بروح الوداعة والهدوء. هذه هي الزينة التي لا تفنى، وهي غالية الثمن في نظر الله!"]]}, {"l": "1Jo 3:21", "n": "", "vs": [[21, "أيها الأحباء، إذا كانت ضمائرنا لا تلومنا. فهذا دليل على أن لنا ثقة عظيمة من نحو الله."]]}], "kwAr": "أمام إلهنا وأبينا", "noteAr": ""}], "arS": [["متذكرين", ["G3421"]], ["، ", []], ["أمام", ["G1715"]], [" ", []], ["إلهنا", ["G2316"]], [" ", []], ["وأبينا", ["G3962", "G2257"]], ["، ما لكم من ", []], ["عمل", ["G2041"]], [" ", []], ["الإيمان", ["G4102"]], [" ", []], ["واجتهاد", ["G2873"]], [" ", []], ["المحبة", ["G26"]], [" ", []], ["وثبات", ["G5281"]], [" ", []], ["الرجاء", ["G1680"]], ["، في ", []], ["ربنا", ["G2962", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], ["؛", []]]}, {"c": 1, "v": 4, "text": "ونحن عالمون، أيها الإخوة أحباء الله، حقيقة اختياركم من قبل الله:", "groups": [{"kw": "Knowing", "raw": "1Th_1:3; Rom_8:28-30, Rom_11:5-7; Eph_1:4; Phi_1:6, Phi_1:7; 1Pe_1:2; 2Pe_1:10", "note": "", "refs": [{"l": "1Th 1:3", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"]]}, {"l": "Rom 8:28-30", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."], [29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."], [30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."]]}, {"l": "Rom 11:5-7", "n": "", "vs": [[5, "فكذلك، في الزمان الحاضر، ماتزال بقية اختارها الله بالنعمة."], [6, "ولكن، بما أن ذلك قد تم بالنعمة، فليس بعد على أساس الأعمال، وإلا فليست النعمة نعمة بعد."], [7, "فما الخلاصة إذا؟ إن ما يسعى إليه إسرائيل لم ينالوه، بل ناله المختارون منهم، والباقون عميت بصائرهم،"]]}, {"l": "Eph 1:4", "n": "", "vs": [[4, "كما كان قد اختارنا فيه قبل تأسيس العالم، لنكون قديسين بلا لوم أمامه."]]}, {"l": "Phi 1:6", "n": "", "vs": [[6, "ولي ثقة في هذا الأمر بالذات: أن الذي بدأ فيكم عملا صالحا سوف يتممه إلى يوم المسيح يسوع."]]}, {"l": "Phi 1:7", "n": "", "vs": [[7, "كما أن من الحق أن يكون لي هذا الشعور تجاهكم جميعا، لأني أحتفظ بكم في قلبي، لكونكم جميعا شركاء لي في النعمة، سواء أكان في قيودي أم في الدفاع عن الإنجيل وتثبيته."]]}, {"l": "1Pe 1:2", "n": "", "vs": [[2, "بحسب علمه السابق ثم قدسهم بالروح ليطيعوا يسوع المسيح ويطهروا برش دمه عليهم."]]}, {"l": "2Pe 1:10", "n": "", "vs": [[10, "فأحرى بكم إذن، أيها الإخوة، أن تجتهدوا لتثبتوا عمليا أن الله قد دعاكم واختاركم حقا. فإنكم، إن فعلتم هذا، لن تسقطوا أبدا!"]]}], "kwAr": "ونحن عالمون", "noteAr": ""}, {"kw": "your election", "raw": "Rom_1:7, Rom_9:25; Eph_2:4, Eph_2:5; Col_3:12; 2Th_2:13; 2Ti_1:9, 2Ti_1:10; Tit_3:4, Tit_3:5", "note": "", "refs": [{"l": "Rom 1:7", "n": "", "vs": [[7, "إلى جميع من هم في روما من أحباء الله القديسين المدعوين. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}, {"l": "Rom 9:25", "n": "", "vs": [[25, "وذلك على حد ما يقول أيضا في نبوءة هوشع: «من لم يكونوا شعبي سأدعوهم شعبي، ومن لم تكن محبوبة سأدعوها محبوبة."]]}, {"l": "Eph 2:4", "n": "", "vs": [[4, "أما الله ، وهو غني في الرحمة، فبسبب محبته العظيمة التي أحبنا بها،"]]}, {"l": "Eph 2:5", "n": "", "vs": [[5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"]]}, {"l": "Col 3:12", "n": "", "vs": [[12, "فباعتباركم جماعة مختارة من الله، قديسين محبوبين، البسوا دائما عواطف الحنان واللطف والتواضع والوداعة وطول البال،"]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،"]]}, {"l": "2Ti 1:10", "n": "", "vs": [[10, "والتي أعلنت الآن بظهور مخلصنا يسوع المسيح الذي سحق الموت وأنار الحياة والخلود بالإنجيل"]]}, {"l": "Tit 3:4", "n": "", "vs": [[4, "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،"]]}, {"l": "Tit 3:5", "n": "", "vs": [[5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"]]}], "kwAr": "حقيقة اختياركم", "noteAr": ""}, {"kw": "beloved, your election of God", "raw": "or, beloved of God", "note": "or, beloved of God", "refs": [], "kwAr": "أحباء الله", "noteAr": "أو: أيها الإخوة المحبوبون من الله، اختياركم."}], "arS": [["ونحن ", []], ["عالمون", ["G1492"]], ["، أيها ", []], ["الإخوة", ["G80"]], [" ", []], ["أحباء", ["G25"]], [" ", []], ["الله", ["G2316"]], ["، حقيقة ", []], ["اختياركم", ["G1589", "G5216"]], [" من قبل ", []], ["الله", ["G2316"]], [":", []]]}, {"c": 1, "v": 5, "text": "لأن تبشيرنا لكم بالإنجيل لم يكن مجرد كلام، بل كان مصحوبا أيضا بالقوة وبالروح القدس وبتمام اليقين. كما أنكم تعلمون تماما ماذا كنا بينكم لأجل مصلحتكم،", "groups": [{"kw": "our", "raw": "Isa_55:11; Rom_2:16; 2Co_4:3; Gal_1:8-12, Gal_2:2; 2Th_2:14; 2Ti_2:8", "note": "", "refs": [{"l": "Isa 55:11", "n": "", "vs": [[11, "هكذا تكون كلمتي التي تصدر عني مثمرة دائما، وتحقق ما أرغب فيه وتفلح بما أعهد به إليها."]]}, {"l": "Rom 2:16", "n": "", "vs": [[16, "(وتكون الدينونة) يوم يدين الله خفايا الناس، وفقا لإنجيلي، على يد يسوع المسيح."]]}, {"l": "2Co 4:3", "n": "", "vs": [[3, "ولكن إن كان إنجيلنا محجوبا، فإنما هو محجوب لدى الهالكين، لدى غير المؤمنين"]]}, {"l": "Gal 1:8-12", "n": "", "vs": [[8, "ولكن، حتى لو بشرناكم نحن، أو بشركم ملاك من السماء، بغير الإنجيل الذي بشرناكم به، فليكن ملعونا!"], [9, "وكما سبق أن قلنا، أكر ر القول الآن أيضا: إن كان أحد يبشركم بإنجيل غير الذي قبلتموه، فليكن ملعونا!"], [10, "فهل أسعى الآن إلى كسب تأييد الناس أو الله؟ أم تراني أطلب أن أرضي الناس؟ لو كنت حتى الآن أرضي الناس، لما كنت عبدا للمسيح!"], [11, "وأعلمكم، أيها الإخوة، أن الإنجيل الذي بشرتكم به ليس إنجيلا بشريا."], [12, "فلا أنا تسلمته من إنسان، ولا تلقنته، بل جاءني بإعلان من يسوع المسيح."]]}, {"l": "Gal 2:2", "n": "", "vs": [[2, "وإنما صعدت إليها استجابة للوحي؛ وبسطت أمامهم الإنجيل الذي أبشر به بين الأمم، ولكن على انفراد أمام البارزين فيهم، لئلا يكون مسعاي في الحاضر والماضي بلا جدوى."]]}, {"l": "2Th 2:14", "n": "", "vs": [[14, "فإلى هذا الأمر قد دعاكم ببشارتنا لكم، لنوال مجد ربنا يسوع المسيح."]]}, {"l": "2Ti 2:8", "n": "", "vs": [[8, "اذكر يسوع المسيح الذي أقيم من الموت، وهو من نسل داود، كما أعلنه في إنجيلي"]]}], "kwAr": "تبشيرنا لكم بالإنجيل", "noteAr": ""}, {"kw": "in word", "raw": "1Th_2:13; 1Co_4:20; 2Co_3:6", "note": "", "refs": [{"l": "1Th 2:13", "n": "", "vs": [[13, "ولذلك نحن أيضا نرفع الشكر لله بلا توقف، لأنكم لما تلقيتم منا كلمة البشارة من الله، قبلتموها لا كأنها كلمة بشر، بل كما هي في الحقيقة: باعتبارها كلمة الله العاملة أيضا فيكم أنتم المؤمنين."]]}, {"l": "1Co 4:20", "n": "", "vs": [[20, "فإن ملكوت الله ليس بالكلام، بل بالقدرة."]]}, {"l": "2Co 3:6", "n": "", "vs": [[6, "الذي جعلنا أصحاب كفاءة لنكون خداما لعهد جديد قائم لا على الحرف بل على الروح. فالحرف يؤدي إلى الموت؛ أما الروح فيعطي الحياة."]]}], "kwAr": "مجرد كلام", "noteAr": ""}, {"kw": "but", "raw": "Psa_10:2, Psa_10:3; Mar_16:20; Act_11:21, Act_16:14; Rom_1:16, Rom_15:18, Rom_15:19; 1Co_1:24; 1Co_2:4, 1Co_2:5, 1Co_3:6; 2Co_10:4, 2Co_10:5; Eph_1:17-20, Eph_2:4, Eph_2:5, Eph_2:10, Eph_3:20; Phi_2:13; Jam_1:16-18; 1Pe_1:3", "note": "", "refs": [{"l": "Psa 10:2", "n": "", "vs": [[2, "الشرير، بعجرفة، يجد في تعقب المسكين، غير أن الأشرار يسقطون في مؤامرتهم التي فكروا فيها."]]}, {"l": "Psa 10:3", "n": "", "vs": [[3, "الشرير يفتخر بشهوات نفسه، والرجل الطماع يلعن ويجدف على الله."]]}, {"l": "Mar 16:20", "n": "", "vs": [[20, "وأما هم، فانطلقوا يبشرون في كل مكان، والرب يعمل معهم ويؤيد الكلمة بالآيات الملازمة لها."]]}, {"l": "Act 11:21", "n": "", "vs": [[21, "فكانت يد الرب معهم، فآمن عدد كبير واهتدوا إلى الرب."]]}, {"l": "Act 16:14", "n": "", "vs": [[14, "ومن بينهن تاجرة أرجوان من مدينة ثياتيرا، متعبدة لله، اسمها ليدية، كانت تسمع ففتح الله قلبها لتقبل كلام بولس."]]}, {"l": "Rom 1:16", "n": "", "vs": [[16, "فأنا لا أستحي بالإنجيل، لأنه قدرة الله للخلاص، لكل من يؤمن، لليهودي أولا ثم لليوناني على السواء."]]}, {"l": "Rom 15:18", "n": "", "vs": [[18, "فما كنت لأتجاسر أن أتكلم بشيء إلا على ما عمله المسيح على يدي لهداية الأمم إلى الطاعة، بالقول والفعل،"]]}, {"l": "Rom 15:19", "n": "", "vs": [[19, "وبقوة الآيات والعجائب، وبقوة روح الله. حتى إنني، من أورشليم وما حولها حتى مقاطعة إليريكون، قد أكملت التبشير بإنجيل المسيح."]]}, {"l": "1Co 1:24", "n": "", "vs": [[24, "وأما عند المدعوين، سواء من اليهود أو اليونانيين، فإن المسيح هو قدر ة الله وحكمة الله."]]}, {"l": "1Co 2:4", "n": "", "vs": [[4, "ولم يقم كلامي وتبشيري على الإقناع بكلام الحكمة، بل على ما يعلنه الروح والقدرة."]]}, {"l": "1Co 2:5", "n": "", "vs": [[5, "وذلك لكي يتأسس إيمانكم لا على حكمة الناس، بل على قدرة الله."]]}, {"l": "1Co 3:6", "n": "", "vs": [[6, "أنا غرست وأبلوس سقى؛ ولكن الله أنمى."]]}, {"l": "2Co 10:4", "n": "", "vs": [[4, "فإن الأسلحة التي نحارب بها ليست جسدية، بل قادرة بالله على هدم الحصون: بها نهدم النظريات"]]}, {"l": "2Co 10:5", "n": "", "vs": [[5, "وكل ما يعلو مرتفعا لمقاومة معرفة الله، ونأسر كل فكر إلى طاعة المسيح."]]}, {"l": "Eph 1:17-20", "n": "", "vs": [[17, "حتى يهبكم إله ربنا يسوع المسيح، أبو المجد، روح حكمة وإلهام: لتعرفوه معرفة كاملة"], [18, "إذ تستنير بصائر قلوبكم، فتعلموا ما في دعوته لكم من رجاء، وما هو غنى مجد ميراثه في القديسين،"], [19, "وما هي عظمة قدرته الفائقة المعلنة لنا نحن المؤمنين، بحسب عمل اقتدار قوته"], [20, "الذي عمله في المسيح، بإقامته له من بين الأموات. وقد أجلسه عن يمينه في الأماكن السماوية،"]]}, {"l": "Eph 2:4", "n": "", "vs": [[4, "أما الله ، وهو غني في الرحمة، فبسبب محبته العظيمة التي أحبنا بها،"]]}, {"l": "Eph 2:5", "n": "", "vs": [[5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"]]}, {"l": "Eph 2:10", "n": "", "vs": [[10, "فإننا نحن تحفة الله، وقد خلقنا في المسيح يسوع لأعمال صالحة أعدها سلفا لنسلك فيها."]]}, {"l": "Eph 3:20", "n": "", "vs": [[20, "والقادر أن يفعل، وفقا للقدرة العاملة فينا، ما يفوق بلا حصر كل ما نطلب أو نتصور،"]]}, {"l": "Phi 2:13", "n": "", "vs": [[13, "لأن الله هو الذي ينشيء فيكم الإرادة والعمل لأجل مرضاته."]]}, {"l": "Jam 1:16-18", "n": "", "vs": [[16, "فيا إخوتي الأحباء، لا تضلوا:"], [17, "إن كل عطية صالحة وهبة كاملة إنما تنزل من فوق، من لدن أبي الأنوار الذي ليس فيه تحول، ولا ظل لأنه لا يدور."], [18, "وهو قد شاء أن يجعلنا أولادا له، فولدنا بكلمته، كلمة الحق. وغايته أن نكون باكورة خليقته."]]}, {"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}], "kwAr": "بل كان مصحوبا أيضا بالقوة", "noteAr": ""}, {"kw": "in the", "raw": "Joh_16:7-15; Act_2:33, Act_10:44-46, Act_11:15-18; 1Co_3:16, 1Co_12:7-11; 2Co_6:6; Gal_3:2-5, Gal_5:5, Gal_5:22, Gal_5:23; Tit_3:5, Tit_3:6; Heb_2:4; 1Pe_1:12", "note": "", "refs": [{"l": "Joh 16:7-15", "n": "", "vs": [[7, "ولكني أقول لكم الحق: من الأفضل لكم أن أذهب، لأني إن كنت لا أذهب، لا يأتيكم المعين. ولكني إذا ذهبت أرسله إليكم."], [8, "وعندما يجيء يبكت العالم على الخطيئة وعلى البر وعلى الدينونة:"], [9, "أما على الخطيئة، فلأنهم لا يؤمنون بي،"], [10, "وأما على البر، فلأني عائد إلى الآب فلا ترونني بعد؛"], [11, "وأما على الدينونة، فلأن سيد هذا العالم قد صدر عليه حكم الدينونة."], [12, "مازال عندي أمور كثيرة أقولها لكم، ولكنكم الآن تعجزون عن احتمالها."], [13, "ولكن، عندما يأتيكم روح الحق يرشدكم إلى الحق كله، لأنه لا يقول شيئا من عنده، بل يخبركم بما يسمعه، ويطلعكم على ما سوف يحدث."], [14, "وهو سيمجدني لأن كل ما سيحدثكم به صادر عني."], [15, "كل ما هو للآب، فهو لي. ولذلك قلت لكم إن ما سيحدثكم به صادر عني."]]}, {"l": "Act 2:33", "n": "", "vs": [[33, "وإذ رفع إلى يمين الله، وأخذ من الآب الروح القدس الموعود به، أفاضه علينا. وما ترونه الآن وتسمعونه هو نتيجة لذلك."]]}, {"l": "Act 10:44-46", "n": "", "vs": [[44, "وبينما كان بطرس يتكلم بهذا الكلام، حل الروح القدس على جميع الذين كانوا يسمعون."], [45, "فدهش المؤمنون اليهود الذين جاءوا برفقة بطرس، لأن هبة الروح القدس فاضت أيضا على غير اليهود،"], [46, "إذ سمعوهم يتكلمون بلغات، ويسبحون الله . فقال بطرس:"]]}, {"l": "Act 11:15-18", "n": "", "vs": [[15, "ولما ابتدأت أتكلم، حل الروح القدس عليهم كما حل علينا في البداية"], [16, "فتذكرت ما قاله الرب لنا: إن يوحنا عمد بالماء، وأما أنتم فستتعمدون بالروح القدس."], [17, "فإن كان الله قد ساواهم بنا فأعطاهم الهبة التي أعطانا، إذ آمنا بالرب يسوع المسيح، فمن أكون أنا حتى أعيق الله ؟»"], [18, "فلما سمع المعارضون هذا، سكتوا، ومجدوا الله قائلين: «إذن، قد أنعم الله أيضا على غير اليهود بالتوبة لنوال الحياة»."]]}, {"l": "1Co 3:16", "n": "", "vs": [[16, "ألا تعرفون أنكم هيكل الله وأن روح الله ساكن فيكم؟"]]}, {"l": "1Co 12:7-11", "n": "", "vs": [[7, "وإنما كل واحد يوهب موهبة يتجلى الروح فيها لأجل المنفعة."], [8, "فواحد يوهب، عن طريق الروح، كلام الحكمة، وآخر كلام المعرفة وفقا للروح نفسه،"], [9, "وآخر إيمانا بالروح نفسه. ويوهب آخر موهبة شفاء الأمراض بالروح الواحد،"], [10, "وآخر عمل المعجزات، وآخر النبوءة وآخر التمييز بين الأرواح، وآخر التكلم بلغات مختلفة (لم يتعلمها)، وآخر ترجمة اللغات تلك."], [11, "ولكن هذا كله يشغله الروح الواحد نفسه، موزعا المواهب، كما يشاء، على كل واحد."]]}, {"l": "2Co 6:6", "n": "", "vs": [[6, "في الطهارة والمعرفة وطول البال واللطف؛ في الروح القدس والمحبة الخالصة من الرياء؛"]]}, {"l": "Gal 3:2-5", "n": "", "vs": [[2, "أريد أن أستعلم منكم هذا الأمر فقط: أعلى أساس العمل بما في الشريعة نلتم الروح، أم على أساس الإيمان بالبشارة؟"], [3, "أإلى هذا الحد أنتم أغبياء؟ أبعدما ابتدأتم بالروح تكملون بالجسد؟"], [4, "وهل كان اختباركم الطويل بلا جدوى، إن كان حقا بلا جدوى؟"], [5, "فذاك الذي يهبكم الروح، ويجري معجزات في ما بينكم، أيفعل ذلك على أساس أعمال الشريعة أم على أساس الإيمان بالبشارة؟"]]}, {"l": "Gal 5:5", "n": "", "vs": [[5, "فإننا، بالروح وعلى أساس الإيمان، ننتظر الرجاء الذي ينتجه البر."]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Gal 5:23", "n": "", "vs": [[23, "والوداعة وضبط النفس. وليس من قانون يمنع مثل هذه الفضائل."]]}, {"l": "Tit 3:5", "n": "", "vs": [[5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"]]}, {"l": "Tit 3:6", "n": "", "vs": [[6, "الذي سكبه علينا بغنى بيسوع المسيح مخلصنا."]]}, {"l": "Heb 2:4", "n": "", "vs": [[4, "وقد أيد الله شهادتهم بعلامات وعجائب ومعجزات مختلفة، وبالمواهب التي وزعها الروح القدس وفقا لإرادته!"]]}, {"l": "1Pe 1:12", "n": "", "vs": [[12, "ولكن الله أوحى إليهم أن اجتهادهم لم يكن لمصلحتهم هم، بل لمصلحتكم أنتم. فقد كان ذلك من أجل البشارة التي نقلها إليكم في الزمان الحاضر مبشرون يؤيدهم الروح القدس المرسل من السماء. ويالها من أمور يتمنى حتى الملائكة أن يطلعوا عليها!"]]}], "kwAr": "وبالروح القدس", "noteAr": ""}, {"kw": "in much", "raw": "Col_2:2; Heb_2:3, Heb_6:11, Heb_6:18, Heb_6:19, Heb_10:22; 2Pe_1:10,2Pe_1:19", "note": "", "refs": [{"l": "Col 2:2", "n": "", "vs": [[2, "بغرض أن تتشجع قلوبهم وتكون كلها متحدة في المحبة، لبلوغ الإدراك التام بكل غناه، لمعرفة سر الله، أي المسيح،"]]}, {"l": "Heb 2:3", "n": "", "vs": [[3, "فكيف نفلت نحن إن أهملنا هذا الخلاص العظيم جدا؟ فإن الرب يسوع نفسه قد أعلنه أولا، ثم تثبت لنا من الذين سمعوه مباشرة."]]}, {"l": "Heb 6:11", "n": "", "vs": [[11, "وإنما نتمنى أن يظهر كل واحد منكم اجتهادا مماثلا في المحافظة حتى النهاية على الثقة الكاملة بالرجاء."]]}, {"l": "Heb 6:18", "n": "", "vs": [[18, "فاستنادا إلى وعد الله وقسمه، وهما أمران ثابتان لا يتغيران ويستحيل أن يكذب الله فيهما، نحصل على تشجيع قوي، بعدما التجأنا إلى التمسك بالرجاء الموضوع أمامنا."]]}, {"l": "Heb 6:19", "n": "", "vs": [[19, "هذا الرجاء هو لنا بمثابة مرساة أمينة ثابتة تشد نفوسنا إلى ما وراء الحجاب السماوي."]]}, {"l": "Heb 10:22", "n": "", "vs": [[22, "فلنتقدم إلى حضرة الله بقلب صادق وبثقة الإيمان الكاملة، بعدما طهر رش الدم قلوبنا من كل شعور بالذنب، وغسل الماء النقي أجسادنا."]]}, {"l": "2Pe 1:10", "n": "", "vs": [[10, "فأحرى بكم إذن، أيها الإخوة، أن تجتهدوا لتثبتوا عمليا أن الله قد دعاكم واختاركم حقا. فإنكم، إن فعلتم هذا، لن تسقطوا أبدا!"]]}, {"l": "2Pe 1:19", "n": "", "vs": [[19, "وهكذا، صارت الكلمة النبوية أكثر ثباتا عندنا. فحسنا تفعلون إن انتبهتم إلى هذه الكلمة في قلوبكم. إذ إنها أشبه بمصباح يضيء في مكان مظلم، إلى أن يطلع النهار ويظهر كوكب الصبح."]]}], "kwAr": "وبتمام اليقين", "noteAr": ""}, {"kw": "what", "raw": "1Th_2:1-11; Act_20:18, Act_20:19, Act_20:33-35; 1Co_2:2-5, 1Co_4:9-13, 1Co_10:33; 2Co_4:1, 2Co_4:2; 2Co_6:3-10; Phi_4:9; 2Th_3:7-9; 1Ti_4:12-16; 1Pe_5:3", "note": "", "refs": [{"l": "1Th 2:1-11", "n": "", "vs": [[1, "فإنكم، أيها الإخوة، تعلمون أن قدومنا إليكم لم يكن باطلا."], [2, "فمع أننا كنا قد قاسينا الألم والإهانة في مدينة فيلبي، كما تعلمون، فقد تجرأنا في إلهنا أن نكلمكم بإنجيل الله مجاهدين في وجه المعارضة الشديدة."], [3, "فما كان وعظنا صادرا عن ضلال ولا عن نجاسة، ولا خالطه مكر،"], [4, "بل إننا نتكلم كمن تبين من اختبار الله لهم أنهم أهل لأن يؤتمنوا على الإنجيل، لنرضي لا الناس بل الله الذي يختبر قلوبنا."], [5, "وكما تعلمون أيضا، فإننا لم نستعمل معكم قط كلام التملق، ولا اتخذنا ذريعة للطمع إنما الله شاهد"], [6, "ولا سعينا لنوال مجد من الناس، لا منكم ولا من غيركم،"], [7, "مع أن لنا الحق في أن نفرض أنفسنا عليكم باعتبارنا رسلا للمسيح. ولكننا كنا مترفقين بكم كأم مرضع تحنو على أولادها."], [8, "وإذ كان حنونا عليكم شديدا، ارتضينا أن نقدم إليكم لا إنجيل الله فقط بل أنفسنا أيضا، لأنكم صرتم محبوبين لدينا."], [9, "فأنتم تذكرون، أيها الإخوة، جهدنا وكدنا، إذ بشرناكم بإنجيل الله ونحن نشتغل ليلا ونهارا لكي لا نكون عبئا ثقيلا على أحد منكم."], [10, "فأنتم تشهدون، ويشهد الله ، كيف تصرفنا بينكم، أنتم المؤمنين، بطهارة واستقامة وبراءة من اللوم،"], [11, "كما أنكم تعلمون كيف عاملناكم معاملة الأب لأولاده، فكنا نعظ كل واحد منكم ونشجعكم"]]}, {"l": "Act 20:18", "n": "", "vs": [[18, "فلما جاءوا إليه، قال لهم:"]]}, {"l": "Act 20:19", "n": "", "vs": [[19, "فقد كنت أخدم الرب بكل تواضع، وبكثير من الدموع، وأنا أعاني المحن التي أصابتني بها مؤامرات اليهود."]]}, {"l": "Act 20:33-35", "n": "", "vs": [[33, "ما اشتهيت يوما فضة ولا ذهبا ولا ثوبا من عند أحد."], [34, "وأنتم تعلمون أني اشتغلت بيدي هاتين لأسد حاجاتي وحاجات مرافقي."], [35, "وقد أظهرت لكم بوضوح كيف يجب أن نبذل الجهد لنساعد المحتاجين، متذكرين كلمات الرب يسوع، إذ قال: الغبطة في العطاء أكثر مما في الأخذ!»"]]}, {"l": "1Co 2:2-5", "n": "", "vs": [[2, "إذ كنت عازما ألا أعرف شيئا بينكم إلا يسوع المسيح، وأن أعرفه مصلوبا."], [3, "وقد كنت عندكم في حالة من الضعف والخوف والارتعاد الكثير."], [4, "ولم يقم كلامي وتبشيري على الإقناع بكلام الحكمة، بل على ما يعلنه الروح والقدرة."], [5, "وذلك لكي يتأسس إيمانكم لا على حكمة الناس، بل على قدرة الله."]]}, {"l": "1Co 4:9-13", "n": "", "vs": [[9, "فإني أرى أن الله عرضنا، نحن الرسل، في آخر الموكب كأنه محكوم علينا بالموت، لأننا صرنا معرضا للعالم، للملائكة والبشر معا."], [10, "نحن جهلاء من أجل المسيح، وأنتم حكماء في المسيح. نحن ضعفاء وأنتم أقوياء. أنتم مكرمون ونحن مهانون."], [11, "فما زلنا حتى هذه الساعة نجوع ونعطش، ونعرى ونلطم ونحرم محلا للإقامة"], [12, "ونجهد أنفسنا في الشغل بأيدينا. نتعرض للإهانة فنبارك، وللاضطهاد فنحتمل"], [13, "وللتجريح فنسالم. صرنا كأقذار العالم ونفاية الجميع، ومازلنا!"]]}, {"l": "1Co 10:33", "n": "", "vs": [[33, "فهكذا أنا أيضا أسعى لإرضاء الجميع في كل شيء، ولا أهتم بمصلحتي الخاصة، بل بمصلحة الكثيرين، لكي يخلصوا."]]}, {"l": "2Co 4:1", "n": "", "vs": [[1, "فما دامت لنا إذن هذه الخدمة برحمة من الله، فلا تخور عزيمتنا."]]}, {"l": "2Co 4:2", "n": "", "vs": [[2, "ولكننا قد رفضنا الأساليب الخفية المخجلة، إذ لا نسلك في المكر، ولا نزور كلمة الله، بل بإعلاننا للحق نمدح أنفسنا لدى ضمير كل إنسان، أمام الله."]]}, {"l": "2Co 6:3-10", "n": "", "vs": [[3, "ولسنا نتصرف أي تصرف يكون عثرة لأحد، حتى لا يلحق الخدمة أي لوم."], [4, "وإنما نتصرف في كل شيء بما يبين أننا فعلا خدام الله: في تحمل الكثير؛ في الشدائد والحاجات والضيقات والجلدات"], [5, "والسجون والاضطرابات والأتعاب والسهر والصوم؛"], [6, "في الطهارة والمعرفة وطول البال واللطف؛ في الروح القدس والمحبة الخالصة من الرياء؛"], [7, "في كلمة الحق وقدرة الله؛ بأسلحة البر في الهجوم والدفاع؛"], [8, "بالكرامة والهوان؛ بالصيت السييء والصيت الحسن. نعامل كمضللين ونحن صادقون،"], [9, "كمجهولين ونحن معروفون، كمائتين وها نحن نحيا ، كمعاقبين ولا نقتل،"], [10, "كمحزونين ونحن دائما فرحون، كفقراء ونحن نغني كثيرين، كمن لا شيء عندهم ونحن نملك كل شيء."]]}, {"l": "Phi 4:9", "n": "", "vs": [[9, "واعملوا بها ما تعلمتم وتلقيتم وسمعتم مني وما رأيتم في. وإله السلام يكون معكم."]]}, {"l": "2Th 3:7-9", "n": "", "vs": [[7, "فأنتم أنفسكم تعرفون كيف ينبغي أن تقتدوا بنا، لأن سلوكنا بينكم لم يكن فوضويا،"], [8, "ولا أكلنا الخبز من عند أحد مجانا، بل كنا نشتغل بتعب وكد ليل نهار، لكي لا نكون عبئا ثقيلا على أي واحد منكم."], [9, "وذلك لا يعني أنه ليس لنا حق، بل لنجعل أنفسنا مثالا لكم لتقتدوا بنا."]]}, {"l": "1Ti 4:12-16", "n": "", "vs": [[12, "لا يستخف أحد بحداثة سنك. وإنما كن قدوة للمؤمنين، في الكلام والسلوك والمحبة والإيمان والطهارة."], [13, "إلى حين وصولي، انصرف إلى تلاوة الكتاب، وإلى الوعظ، وإلى التعليم."], [14, "لا تهمل الموهبة الخاصة التي فيك والتي أعطيت لك بالتنبوء ووضع الشيوخ أيديهم عليك."], [15, "انصرف إلى هذه الأمور، وانشغل بها كليا، ليكون تقدمك واضحا للجميع."], [16, "انتبه جيدا لنفسك وللتعليم. فإنك إذ تواظب على ذلك، تنقذ نفسك وسامعيك أيضا."]]}, {"l": "1Pe 5:3", "n": "", "vs": [[3, "لا تتسلطوا على القطيع الذي وضعه الله أمانة بين أيديكم، بل كونوا قدوة له."]]}], "kwAr": "ماذا كنا بينكم", "noteAr": ""}, {"kw": "for", "raw": "1Co_9:19-23; 2Ti_2:10", "note": "", "refs": [{"l": "1Co 9:19-23", "n": "", "vs": [[19, "فمع أني حر من الجميع، جعلت نفسي عبدا للجميع، لأكسب أكبر عدد ممكن منهم."], [20, "فصرت لليهود كأني يهودي، حتى أكسب اليهود؛ وللخاضعين للشريعة كأني خاضع لها مع أني لست خاضعا لها حتى أكسب الخاضعين لها؛"], [21, "وللذين بلا شريعة كأني بلا شريعة مع أني لست بلا ناموس عند الله بل أنا خاضع لناموس من نحو المسيح حتى أكسب الذين هم بلا شريعة."], [22, "وصرت للضعفاء ضعيفا، حتى أكسب الضعفاء. صرت للجميع كل شيء، لأنقذ بعضا منهم مهما كلف الأمر."], [23, "وإني أفعل الأمور كلها من أجل الإنجيل، لأكون شريكا فيه مع الآخرين."]]}, {"l": "2Ti 2:10", "n": "", "vs": [[10, "لهذا السبب أحتمل كل شيء بصبر لأجل الذين اختارهم الله ، لكي يحصلوا، هم أيضا، على الخلاص الذي في المسيح يسوع مع المجد الأبدي."]]}], "kwAr": "لأجل مصلحتكم", "noteAr": ""}], "arS": [["لأن ", []], ["تبشيرنا لكم بالإنجيل", ["G2098", "G2257"]], [" لم يكن مجرد ", []], ["كلام", ["G3056"]], ["، بل كان مصحوبا أيضا ", []], ["بالقوة", ["G1411"]], [" ", []], ["وبالروح", ["G4151"]], [" ", []], ["القدس", ["G40"]], [" ", []], ["وبتمام", ["G4183"]], [" ", []], ["اليقين", ["G4136"]], [". كما أنكم ", []], ["تعلمون", ["G1492"]], [" تماما ", []], ["ماذا كنا", ["G3634", "G1096"]], [" بينكم لأجل ", []], ["مصلحتكم", ["G1223", "G5209"]], ["،", []]]}, {"c": 1, "v": 6, "text": "وقد صرتم مقتدين بنا وبالرب، إذ تقبلتم كلمة الله في وسط ضيقة شديدة بفرح الروح القدس.", "groups": [{"kw": "ye", "raw": "1Th_2:14; 1Co_4:16, 1Co_11:1; 2Co_8:5; Phi_3:17; 2Th_3:9", "note": "", "refs": [{"l": "1Th 2:14", "n": "", "vs": [[14, "فإنكم، أيها الإخوة، قد صرتم على مثال كنائس الله التي في منطقة اليهودية والتي هي في المسيح يسوع. فأنتم أيضا قاسيتم على أيدي بني جنسكم ما قاسوه هم على أيدي اليهود"]]}, {"l": "1Co 4:16", "n": "", "vs": [[16, "فأدعوكم إذن إلى الاقتداء بي."]]}, {"l": "1Co 11:1", "n": "", "vs": [[1, "فاقتدوا بي كما أقتدي أنا بالمسيح!"]]}, {"l": "2Co 8:5", "n": "", "vs": [[5, "كما أنهم تجاوزوا ما توقعناه، إذ كرسوا أنفسهم أولا للرب ثم لنا نحن بمشيئة الله،"]]}, {"l": "Phi 3:17", "n": "", "vs": [[17, "كونوا جميعا، أيها الإخوة، مقتدين بي؛ ولاحظوا الذين يسلكون بحسب القدوة التي ترونها فينا."]]}, {"l": "2Th 3:9", "n": "", "vs": [[9, "وذلك لا يعني أنه ليس لنا حق، بل لنجعل أنفسنا مثالا لكم لتقتدوا بنا."]]}], "kwAr": "وقد صرتم مقتدين بنا", "noteAr": ""}, {"kw": "and of", "raw": "Mat_16:24; Joh_8:12, Joh_13:13-15; Eph_5:1; 1Pe_3:13; 3Jo_1:11", "note": "", "refs": [{"l": "Mat 16:24", "n": "", "vs": [[24, "ثم قال يسوع لتلاميذه: «إن أراد أحد أن يسير ورائي، فلينكر نفسه ويحمل صليبه ويتبعني."]]}, {"l": "Joh 8:12", "n": "", "vs": [[12, "وخاطبهم يسوع أيضا فقال: «أنا نور العالم. من يتبعني فلا يتخبط في الظلام بل يكون له نور الحياة»."]]}, {"l": "Joh 13:13-15", "n": "", "vs": [[13, "أنتم تدعونني معلما وسيدا، وقد صدقتم، فأنا كذلك."], [14, "فإن كنت، وأنا السيد والمعلم، قد غسلت أقدامكم، فعليكم أنتم أيضا أن يغسل بعضكم أقدام بعض."], [15, "فقد قدمت لكم مثالا لكي تعملوا مثل ما عملت أنا لكم."]]}, {"l": "Eph 5:1", "n": "", "vs": [[1, "فاقتدوا إذن بالله كأولاد أحباء،"]]}, {"l": "1Pe 3:13", "n": "", "vs": [[13, "من يؤذيكم إن كنتم متحمسين للخير؟"]]}, {"l": "3Jo 1:11", "n": "", "vs": [[11, "أيها الحبيب، لا تقتد بما هو شر، بل بما هو خير. فإن من يفعل الخير، يكون من الله. ومن يفعل الشر، يبين أنه لم يتعرف بالله قط."]]}], "kwAr": "وبالرب", "noteAr": ""}, {"kw": "received", "raw": "1Th_2:13, 1Th_2:14, 1Th_3:2-4; Hos_2:14; Mar_10:29-30; Act_17:5; 2Co_8:1, 2Co_8:2; 2Th_1:4", "note": "", "refs": [{"l": "1Th 2:13", "n": "", "vs": [[13, "ولذلك نحن أيضا نرفع الشكر لله بلا توقف، لأنكم لما تلقيتم منا كلمة البشارة من الله، قبلتموها لا كأنها كلمة بشر، بل كما هي في الحقيقة: باعتبارها كلمة الله العاملة أيضا فيكم أنتم المؤمنين."]]}, {"l": "1Th 2:14", "n": "", "vs": [[14, "فإنكم، أيها الإخوة، قد صرتم على مثال كنائس الله التي في منطقة اليهودية والتي هي في المسيح يسوع. فأنتم أيضا قاسيتم على أيدي بني جنسكم ما قاسوه هم على أيدي اليهود"]]}, {"l": "1Th 3:2-4", "n": "", "vs": [[2, "فبعثنا تيموثاوس، أخانا ومعاوننا في خدمة الله بنشر الإنجيل، لكي يشددكم ويشجعكم في إيمانكم،"], [3, "حتى لا يتزعزع أحد منكم من جراء هذه الضيقات. فإنكم تعلمون أننا معينون لذلك؛"], [4, "وقد سبق لنا، لما كنا عندكم أن أخبرناكم أننا سنقاسي الضيقات، الأمر الذي حدث بعد ذلك كما تعلمون."]]}, {"l": "Hos 2:14", "n": "", "vs": [[14, "لهذا، ها أنا أتملقها وآخذها إلى الصحراء وأخاطبها بحنان،"]]}, {"l": "Mar 10:29-30", "n": "", "vs": [[29, "فأجاب يسوع: «الحق أقول لكم: ما من أحد ترك لأجلي ولأجل الإنجيل بيتا أو إخوة أو أخوات أو أما أو أبا أو أولادا أو حقولا،"], [30, "إلا وينال مئة ضعف الآن في هذا الزمان، وفي الزمان الآتي الحياة الأبدية."]]}, {"l": "Act 17:5", "n": "", "vs": [[5, "فأثار ذلك حسد اليهود الذين لم يؤمنوا، فأتوا ببعض الأشرار من أبناء الشارع، وجمعوا جمهورا وأخذوا يحرضون الناس حتى أثاروا الفوضى في المدينة، ثم هجموا على بيت ياسون مطالبين بتسليم بولس وسيلا إلى الجمع."]]}, {"l": "2Co 8:1", "n": "", "vs": [[1, "والآن، نعرفكم، أيها الإخوة، بنعمة الله الموهوبة في كنائس مقاطعة مقدونية."]]}, {"l": "2Co 8:2", "n": "", "vs": [[2, "فمع أنهم كانوا في تجربة ضيقة شديدة، فإن فرحهم الوافر مع فقرهم الشديد فاضا فأنتجا منهم سخاء غنيا."]]}, {"l": "2Th 1:4", "n": "", "vs": [[4, "حتى إننا، نحن أنفسنا، نفتخر بكم في كنائس الله بسبب ثباتكم وإيمانكم في وسط كل ما تحتملونه من اضطهادات وضيقات."]]}], "kwAr": "إذ تقبلتم كلمة الله", "noteAr": ""}, {"kw": "with joy", "raw": "Joh_14:16-18; Act_5:41, Act_9:31, Act_13:52; Rom_5:3-5, Rom_8:16-18, Rom_15:13; Gal_5:22; Heb_10:34; 1Pe_1:6, 1Pe_1:8", "note": "", "refs": [{"l": "Joh 14:16-18", "n": "", "vs": [[16, "وسوف أطلب من الآب أن يعطيكم معينا آخر يبقى معكم إلى الأبد،"], [17, "وهو روح الحق، الذي لا يقدر العالم أن يتقبله لأنه لا يراه ولا يعرفه، وأما أنتم فتعرفونه لأنه في وسطكم، وسيكون في داخلكم."], [18, "لن أترككم يتامى، بل سأعود إليكم."]]}, {"l": "Act 5:41", "n": "", "vs": [[41, "ولكن الرسل خرجوا من المجلس فرحين، لأنهم اعتبروا أهلا لأن يلقوا الإهانة من أجل اسم يسوع."]]}, {"l": "Act 9:31", "n": "", "vs": [[31, "في أثناء ذلك كانت الكنيسة في مناطق اليهودية والجليل والسامرة تتمتع بالسلام. وكانت تنمو وتسير في تقوى الر ب، بمساندة الروح القدس."]]}, {"l": "Act 13:52", "n": "", "vs": [[52, "أما التلاميذ، فقد امتلأوا من الفرح ومن الروح القدس."]]}, {"l": "Rom 5:3-5", "n": "", "vs": [[3, "ليس هذا فقط، بل نفتخر أيضا في وسط الضيقات، لعلمنا أن الضيق ينتج فينا الصبر،"], [4, "والصبر يؤهلنا للفوز في الامتحان، والفوز يبعث فينا الرجاء،"], [5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."]]}, {"l": "Rom 8:16-18", "n": "", "vs": [[16, "فالروح نفسه يشهد مع أرواحنا بأننا أولاد الله."], [17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."], [18, "فإني مقتنع بأن آلام الزمان الحاضر ليست شيئا إذا قيست بالمجد الآتي الذي سيعلن فينا."]]}, {"l": "Rom 15:13", "n": "", "vs": [[13, "فليملأكم إله الرجاء كل فرح وسلام في إيمانكم حتى تزدادوا رجاء بقوة الروح القدس."]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Heb 10:34", "n": "", "vs": [[34, "فقد تعاطفتم مع المسجونين، كما تقبلتم نهب ممتلكاتكم بفرح، علما منكم بأن لكم في السماء ثروة أفضل وأبقى."]]}, {"l": "1Pe 1:6", "n": "", "vs": [[6, "وهذا يدعوكم إلى الابتهاج، مع أنه لابد لكم الآن من الحزن فترة قصيرة تحت وطأة التجارب المتنوعة!"]]}, {"l": "1Pe 1:8", "n": "", "vs": [[8, "أنتم لم تروا المسيح، ولكنكم تحبونه. ومع أنكم لا ترونه الآن، فأنتم تؤمنون به وتبتهجون بفرح مجيد يفوق الوصف."]]}], "kwAr": "بفرح الروح القدس", "noteAr": ""}], "arS": [["وقد ", []], ["صرتم", ["G1096"]], [" ", []], ["مقتدين", ["G3402"]], [" بنا ", []], ["وبالرب", ["G2962"]], ["، إذ ", []], ["تقبلتم", ["G1209"]], [" ", []], ["كلمة", ["G3056"]], [" الله في وسط ", []], ["ضيقة", ["G2347"]], [" ", []], ["شديدة", ["G4183"]], [" ", []], ["بفرح", ["G5479"]], [" ", []], ["الروح", ["G4151"]], [" ", []], ["القدس", ["G40"]], [".", []]]}, {"c": 1, "v": 7, "text": "حتى إنكم صرتم مثالا لجميع المؤمنين المقيمين في مقاطعتي مقدونية وأخائية.", "groups": [{"kw": "ensamples", "raw": "1Th_4:10; 1Ti_4:12; Tit_2:7; 1Pe_5:3", "note": "", "refs": [{"l": "1Th 4:10", "n": "", "vs": [[10, "ولأنكم أيضا هكذا تعاملون جميع الإخوة في مقاطعة مقدونية كلها. وإنما نحرضكم، أيها الإخوة، أن تضاعفوا ذلك أكثر فأكثر،"]]}, {"l": "1Ti 4:12", "n": "", "vs": [[12, "لا يستخف أحد بحداثة سنك. وإنما كن قدوة للمؤمنين، في الكلام والسلوك والمحبة والإيمان والطهارة."]]}, {"l": "Tit 2:7", "n": "", "vs": [[7, "جاعلا من نفسك في كل شيء قدوة للأعمال الصالحة، مظهرا في تعليمك النقاوة والوقار"]]}, {"l": "1Pe 5:3", "n": "", "vs": [[3, "لا تتسلطوا على القطيع الذي وضعه الله أمانة بين أيديكم، بل كونوا قدوة له."]]}], "kwAr": "مثالا", "noteAr": ""}, {"kw": "in", "raw": "1Th_1:8; Act_16:12, Act_1:13, Act_18:1; 2Co_1:1, 2Co_9:2, 2Co_11:9, 2Co_11:10", "note": "", "refs": [{"l": "1Th 1:8", "n": "", "vs": [[8, "فمن عندكم دوت كلمة الرب، منتشرة لا في مقدونية وأخائية فقط، بل إن إيمانكم بالله ذاع في كل مكان، حتى ليس لنا حاجة لأن نقول شيئا بعد."]]}, {"l": "Act 16:12", "n": "", "vs": [[12, "ومنها إلى مدينة فيلبي، وهي كبرى مدن مقاطعة مقدونية، ومستعمرة للرومان. فبقينا فيها بضعة أيام."]]}, {"l": "Act 1:13", "n": "", "vs": [[13, "ولما وصلوا صعدوا إلى غرفة في الطبقة العليا كانوا يقيمون فيها، وهم: بطرس ويوحنا، ويعقوب وأندراوس، وفيلبس وتوما، وبرثلماوس ومتى، ويعقوب بن حلفى وسمعان الغيور، ويهوذا أخو يعقوب."]]}, {"l": "Act 18:1", "n": "", "vs": [[1, "بعد ذلك ترك بولس أثينا، وسافر إلى مدينة كورنثوس."]]}, {"l": "2Co 1:1", "n": "", "vs": [[1, "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."]]}, {"l": "2Co 9:2", "n": "", "vs": [[2, "مادمت أعرف استعدادكم الذي أفتخر به من جهتكم عند المقدونيين فأقول: إن مقاطعة أخائية جاهزة للإعانة منذ السنة الماضية. وحماستكم كانت دافعا لأكثر الإخوة."]]}, {"l": "2Co 11:9", "n": "", "vs": [[9, "وحين كنت عندكم واحتجت، لم أثقل على أحد منكم. إذ سد حاجتي الإخوة الذين جاءوا من مقاطعة مقدونية. وقد حفظت نفسي، وسأحفظها أيضا، من أن أكون ثقيلا عليكم في أي شيء."]]}, {"l": "2Co 11:10", "n": "", "vs": [[10, "ومادام حق المسيح في، لن يوقف أحد افتخاري هذا في بلاد أخائية كلها!"]]}], "kwAr": "في مقاطعتي مقدونية وأخائية", "noteAr": ""}], "arS": [["حتى إنكم ", []], ["صرتم", ["G1096"]], [" ", []], ["مثالا", ["G5179"]], [" ", []], ["لجميع", ["G3956"]], [" ", []], ["المؤمنين", ["G4100"]], [" المقيمين في مقاطعتي ", []], ["مقدونية", ["G3109"]], [" ", []], ["وأخائية", ["G882"]], [".", []]]}, {"c": 1, "v": 8, "text": "فمن عندكم دوت كلمة الرب، منتشرة لا في مقدونية وأخائية فقط، بل إن إيمانكم بالله ذاع في كل مكان، حتى ليس لنا حاجة لأن نقول شيئا بعد.", "groups": [{"kw": "from", "raw": "Isa_2:3, Isa_52:7, Isa_66:19; Rom_10:14-18; 1Co_14:36; 2Th_3:1; Rev_14:6, Rev_22:17", "note": "", "refs": [{"l": "Isa 2:3", "n": "", "vs": [[3, "وتقبل شعوب كثيرة وتقول: تعالوا لنذهب إلى جبل الرب، إلى بيت إله يعقوب، فيعلمنا طرقه، ونسلك في سبله، لأن من صهيون تخرج الشريعة، ومن أورشليم تعلن كلمة الرب."]]}, {"l": "Isa 52:7", "n": "", "vs": [[7, "ما أجمل على الجبال وقع قدمي المبشر الذي يذيع سلاما وينشر بشائر الخير، القائل لصهيون: قد ملك إلهك!"]]}, {"l": "Isa 66:19", "n": "", "vs": [[19, "وأجعل بينهم آية وأبعث بعض الناجين منهم إلى الأمم: إلى ترشيش، وفول، ولود، المهرة في رمي السهام، وإلى توبال وياوان وإلى الجزائر البعيدة ممن لم يسمعوا بشهرتي أو يروا مجدي، فيذيعون مجدي بين الأمم."]]}, {"l": "Rom 10:14-18", "n": "", "vs": [[14, "ولكن، كيف يدعون من لم يؤمنوا به؟ وكيف يؤمنون بمن لم يسمعوا به؟ وكيف يسمعون بلا مبشر؟"], [15, "وكيف يبشر أحد إلا إذا كان قد أرسل؟ كما قد كتب: «ما أجمل أقدام المبشرين بالخيرات!»"], [16, "ولكن، ليس كلهم أطاعوا الإنجيل. فإن إشعياء يقول: «يارب! من صدق ما أسمعناه إياه؟»"], [17, "إذا، الإيمان نتيجة السماع، والسماع هو من التبشير بكلمة المسيح !"], [18, "ولكني أقول: أما سمعوا؟ بلى، فإن المبشرين «انطلق صوتهم إلى الأرض كلها، وكلامهم إلى أقاصي العالم»."]]}, {"l": "1Co 14:36", "n": "", "vs": [[36, "أمن عندكم انطلقت كلمة الله، أم إليكم وحدكم وصلت؟"]]}, {"l": "2Th 3:1", "n": "", "vs": [[1, "وبعد، أيها الإخوة، صلوا لأجلنا، لتنتشر كلمة الرب بسرعة وتتمجد كما هي الحال عندكم،"]]}, {"l": "Rev 14:6", "n": "", "vs": [[6, "ثم رأيت ملاكا آخر يطير في وسط السماء، معه بشارة أبدية يبشر بها أهل الأرض وكل أمة وقبيلة ولغة وشعب،"]]}, {"l": "Rev 22:17", "n": "", "vs": [[17, "الروح والعروس يقولان: «تعال!» ومن يسمع فليردد النداء: «تعال!»"]]}], "kwAr": "فمن عندكم دوت كلمة الرب", "noteAr": ""}, {"kw": "in every", "raw": "Rom_1:8; 2Th_1:4; 3Jo_1:12", "note": "", "refs": [{"l": "Rom 1:8", "n": "", "vs": [[8, "بادىء بدء، أشكر إلهي بيسوع المسيح من أجلكم جميعا، لأن إيمانكم يذاع خبره في العالم كله."]]}, {"l": "2Th 1:4", "n": "", "vs": [[4, "حتى إننا، نحن أنفسنا، نفتخر بكم في كنائس الله بسبب ثباتكم وإيمانكم في وسط كل ما تحتملونه من اضطهادات وضيقات."]]}, {"l": "3Jo 1:12", "n": "", "vs": [[12, "أما ديمتريوس، فالجميع يشهدون له شهادة طيبة. حتى الحق نفسه يشهد له. ونحن أيضا نشهد له. وأنتم تثقون بصدق ما نشهد به."]]}], "kwAr": "في كل مكان", "noteAr": ""}, {"kw": "God-ward", "raw": "Exo_18:9; 2Co_3:4", "note": "", "refs": [{"l": "Exo 18:9", "n": "", "vs": [[9, "فاغتبط يثرون بجميع ما صنعه الرب من إحسان إلى إسرائيل، إذ أنقذهم من يد المصريين."]]}, {"l": "2Co 3:4", "n": "", "vs": [[4, "وهذه هي ثقتنا العظيمة من جهة الله بالمسيح:"]]}], "kwAr": "إيمانكم بالله", "noteAr": ""}], "arS": [["فمن", ["G575"]], [" عندكم ", []], ["دوت", ["G1837"]], [" ", []], ["كلمة", ["G3056"]], [" ", []], ["الرب", ["G2962"]], ["، منتشرة لا في ", []], ["مقدونية", ["G3109"]], [" ", []], ["وأخائية", ["G882"]], [" ", []], ["فقط", ["G3440"]], ["، بل إن ", []], ["إيمانكم", ["G4102", "G5216"]], [" ", []], ["بالله", ["G2316"]], [" ", []], ["ذاع", ["G1831"]], [" في ", []], ["كل", ["G3956"]], [" ", []], ["مكان", ["G5117"]], ["، حتى ليس لنا ", []], ["حاجة", ["G2192", "G5532"]], [" لأن ", []], ["نقول", ["G2980"]], [" ", []], ["شيئا", ["G5100"]], [" بعد.", []]]}, {"c": 1, "v": 9, "text": "فإن أولئك المؤمنين أنفسهم يخبرون عنا كيف كان قدومنا إليكم أول مرة، وكيف تحولتم إلى الله عن الأصنام، لتصيروا عبيدا يخدمون الله الحي الحق،", "groups": [{"kw": "what", "raw": "1Th_1:5, 1Th_1:6, 1Th_2:1, 1Th_2:13", "note": "", "refs": [{"l": "1Th 1:5", "n": "", "vs": [[5, "لأن تبشيرنا لكم بالإنجيل لم يكن مجرد كلام، بل كان مصحوبا أيضا بالقوة وبالروح القدس وبتمام اليقين. كما أنكم تعلمون تماما ماذا كنا بينكم لأجل مصلحتكم،"]]}, {"l": "1Th 1:6", "n": "", "vs": [[6, "وقد صرتم مقتدين بنا وبالرب، إذ تقبلتم كلمة الله في وسط ضيقة شديدة بفرح الروح القدس."]]}, {"l": "1Th 2:1", "n": "", "vs": [[1, "فإنكم، أيها الإخوة، تعلمون أن قدومنا إليكم لم يكن باطلا."]]}, {"l": "1Th 2:13", "n": "", "vs": [[13, "ولذلك نحن أيضا نرفع الشكر لله بلا توقف، لأنكم لما تلقيتم منا كلمة البشارة من الله، قبلتموها لا كأنها كلمة بشر، بل كما هي في الحقيقة: باعتبارها كلمة الله العاملة أيضا فيكم أنتم المؤمنين."]]}], "kwAr": "كيف كان قدومنا إليكم", "noteAr": ""}, {"kw": "ye", "raw": "Isa_2:17-21; Jer_16:19; Zep_2:11; Zec_8:20-23; Mal_1:11; Act_14:15; Act_26:17, Act_26:18; 1Co_12:2; Gal_4:8, Gal_4:9", "note": "", "refs": [{"l": "Isa 2:17-21", "n": "", "vs": [[17, "فيعتري الهوان غطرسة كل إنسان، ويذل تشامخ البشر، ويتعظم الرب وحده في ذلك اليوم،"], [18, "وتباد الأصنام كلها،"], [19, "ويلجأ الناس إلى مغاور الجبال، وإلى حفائر الأرض، متوارين من هيبة الرب ومن مجد جلاله، عندما يهب ليزلزل الأرض."], [20, "في ذلك اليوم يطرح الناس للجرذان والخفافيش أوثانهم الفضية وأصنامهم الذهبية التي صنعوها ليعبدوها،"], [21, "ويدخلون في كهوف الصخر، وفي شقوق الجروف الجبلية هربا من هيبة الرب ومن مجد جلاله عندما يهب ليزلزل الأرض."]]}, {"l": "Jer 16:19", "n": "", "vs": [[19, "يارب أنت عزي وحصني وملاذي في يوم الضيق، إليك تقبل الأمم من أقاصي الأرض قائلة: «لم يرث آباؤنا سوى الباطل والأكاذيب وما لا جدوى منه."]]}, {"l": "Zep 2:11", "n": "", "vs": [[11, "سيكون الرب مثار رعبهم حين يحطم جميع آلهة الأرض، فيسجد له آنئذ جميع الناس، كل في موضعه، في كل ديار المسكونة."]]}, {"l": "Zec 8:20-23", "n": "", "vs": [[20, "وستأتي شعوب أيضا وأفواج من سكان مدن كثيرة إلى أورشليم."], [21, "ويمضي أهل المدينة الواحدة إلى المدينة الأخرى قائلين: هيا نذهب على الفور لنطلب رضى وجه الرب القدير ونلتمس بركته، لأننا على أي حال منطلقون إلى هناك."], [22, "فتتوافد أمم كثيرة وشعوب قوية ليلتمسوا وجه الرب القدير في أورشليم وليحظوا برضاه."], [23, "في تلك الأيام يتشبث عشرة رجال من أبناء الأمم بثوب رجل يهودي قائلين: دعنا نذهب معكم، لأننا سمعنا أن الرب معكم»."]]}, {"l": "Mal 1:11", "n": "", "vs": [[11, "لأنه من مشرق الشمس إلى مغربها اسمي عظيم بين الأمم، وفي كل مكان يحرق لاسمي بخور وذبائح طاهرة، لأن اسمي عظيم بين الأمم، يقول الرب القدير."]]}, {"l": "Act 14:15", "n": "", "vs": [[15, "وهما يصرخان: «لماذا تفعلون هذا أيها الناس؟ ما نحن إلا بشر ضعفاء مثلكم، نبشركم بأن ترجعوا عن هذه الأشياء الباطلة إلى الله الحي صانع السماء والأرض والبحر، وكل ما فيها،"]]}, {"l": "Act 26:17", "n": "", "vs": [[17, "وسأنقذك من شعبك ومن الأمم التي أرسلك إليها الآن،"]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "1Co 12:2", "n": "", "vs": [[2, "تعلمون أنكم، عندما كنتم من الأمم، كنتم تنجرفون إلى الأصنام الخرساء أيما انجراف."]]}, {"l": "Gal 4:8", "n": "", "vs": [[8, "ولكن، لما كنتم في ذلك الحين لا تعرفون الله ، كنتم في حال العبودية."]]}, {"l": "Gal 4:9", "n": "", "vs": [[9, "أما الآن وقد عرفتم الله ، بل بالأحرى عرفكم الله ، فكيف ترتدون أيضا إلى تلك المباديء العاجزة الفقيرة التي ترغبون في الرجوع إلى العبودية لها من جديد؟"]]}], "kwAr": "وكيف تحولتم إلى الله عن الأصنام", "noteAr": ""}, {"kw": "the living", "raw": "Deu_5:26; 1Sa_17:26, 1Sa_17:36; Psa_42:2, Psa_84:2; Isa_37:4, Isa_37:17; Jer_10:10; Dan_6:26; Hos_1:10; Rom_9:26; 2Co_6:16, 2Co_6:17; 1Ti_4:10; Heb_12:22; Rev_17:2", "note": "", "refs": [{"l": "Deu 5:26", "n": "", "vs": [[26, "إذ أي بشري سمع صوت الله الحي يتكلم من وسط النار مثلنا وعاش؟"]]}, {"l": "1Sa 17:26", "n": "", "vs": [[26, "فسأل داود الرجال الواقفين إلى جواره: «بماذا يكافأ الرجل الذي يقتل ذلك الفلسطيني ويمحو العار عن إسرائيل؟ لأنه من هو هذا الفلسطيني الأغلف حتى يعير جيش الله الحي؟»"]]}, {"l": "1Sa 17:36", "n": "", "vs": [[36, "وهكذا قتل عبدك الأسد والدب كليهما، فليكن هذا الفلسطيني الأغلف كواحد منهما لأنه عير جيش الله الحي»."]]}, {"l": "Psa 42:2", "n": "", "vs": [[2, "نفسي عطشى إلى الله الإله الحي، فمتى أجيء وأمثل أمام الله؟"]]}, {"l": "Psa 84:2", "n": "", "vs": [[2, "تتوق بل تحن نفسي إلى ديار الرب. قلبي وجسمي يرنمان بفرح للإله الحي."]]}, {"l": "Isa 37:4", "n": "", "vs": [[4, "لعل الرب إلهك قد سمع وعيد ربشاقى الذي أوفده سيده ملك أشور ليهين الإله الحي، فيعاقبه الرب إلهك على ما صدر منه من تعيير، فصل من أجل البقية الناجية»."]]}, {"l": "Isa 37:17", "n": "", "vs": [[17, "أرهف يارب أذنيك واصغ. افتح يارب عينيك وانظر، واسمع كل تهديدات سنحاريب التي بعث بها ليعير الله الحي."]]}, {"l": "Jer 10:10", "n": "", "vs": [[10, "أما الرب فهو الإله الحق، الإله الحي والملك السرمدي. ترتعد الأرض أمام غضبه ولا تتحمل الأمم فرط سخطه."]]}, {"l": "Dan 6:26", "n": "", "vs": [[26, "قد صدر مني أمر أن يرتعد كل من يقيم في تخوم مملكتي ويخاف أمام إله دانيآل، لأنه هو الإله الحي القيوم إلى الأبد، لا يزول له ملكوت وسلطانه إلى المنتهى."]]}, {"l": "Hos 1:10", "n": "", "vs": [[10, "ومع ذلك فإن عدد بني إسرائيل يكون كرمل البحر الذي لا يكال ولا يحصى. وفي الموضع الذي قيل لهم فيه: أنتم لستم شعبي، يقال لهم: أنتم أبناء الله الحي."]]}, {"l": "Rom 9:26", "n": "", "vs": [[26, "ويكون أنه حيث قيل لهم: لستم شعبي، فهناك يدعون أبناء الله الحي»."]]}, {"l": "2Co 6:16", "n": "", "vs": [[16, "وأي وفاق لهيكل الله مع الأصنام؟ فإننا نحن هيكل الله الحي، وفقا لما قاله الله : «سأسكن في وسطهم، وأسير بينهم، وأكون إلههم وهم يكونون شعبا لي…"]]}, {"l": "2Co 6:17", "n": "", "vs": [[17, "لذلك اخرجوا من وسطهم، وكونوا منفصلين، يقول الرب، ولا تلمسوا ما هو نجس،"]]}, {"l": "1Ti 4:10", "n": "", "vs": [[10, "فإننا لأجل هذا نعمل باجتهاد ونقاسي التعيير، لأننا وضعنا رجاءنا في الله الحي، حافظ جميع الناس، وبالأخص المؤمنين."]]}, {"l": "Heb 12:22", "n": "", "vs": [[22, "ولكنكم قد اقتربتم إلى جبل صهيون، إلى مدينة الله الحي، أورشليم السماوية. بل تقدمتم إلى حفلة يجتمع فيها عدد لا يحصى من الملائكة،"]]}, {"l": "Rev 17:2", "n": "", "vs": [[2, "والتي زنى معها ملوك الأرض، وسكر أهل الأرض من خمر زناها»."]]}], "kwAr": "الله الحي الحق", "noteAr": ""}], "arS": [["فإن أولئك المؤمنين أنفسهم ", []], ["يخبرون", ["G518"]], [" عنا كيف كان ", []], ["قدومنا", ["G1529"]], [" إليكم أول مرة، ", []], ["وكيف", ["G4459"]], [" ", []], ["تحولتم", ["G1994"]], [" إلى ", []], ["الله", ["G2316"]], [" عن ", []], ["الأصنام", ["G1497"]], ["، لتصيروا عبيدا ", []], ["يخدمون", ["G1398"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["الحي", ["G2198"]], [" ", []], ["الحق", ["G228"]], ["،", []]]}, {"c": 1, "v": 10, "text": "وتنتظروا من السماوات ابنه الذي أقامه من بين الأموات، يسوع مخلصنا من الغضب الآتي.", "groups": [{"kw": "wait", "raw": "1Th_4:16, 1Th_4:17; Gen_49:18; Job_19:25-27; Isa_25:8, Isa_25:9; Luk_2:25; Act_1:11, Act_3:21; Rom_2:7, Rom_8:23-25; 1Co_1:7; Phi_3:20; 1Th_1:7, 1Th_2:7; 2Ti_4:1; Tit_2:13; Heb_9:28; 2Pe_3:12, 2Pe_3:14; Rev_1:7", "note": "", "refs": [{"l": "1Th 4:16", "n": "", "vs": [[16, "لأن الرب نفسه سينزل من السماء حالما يدوي أمر بالتجمع، وينادي رئيس ملائكة، ويبوق في بوق إلهي، عندئذ يقوم الأموات في المسيح أولا."]]}, {"l": "1Th 4:17", "n": "", "vs": [[17, "ثم إننا، نحن الباقين أحياء، نختطف جميعا في السحب للاجتماع بالرب في الهواء. وهكذا نبقى مع الرب على الدوام."]]}, {"l": "Gen 49:18", "n": "", "vs": [[18, "إنني انتظرت خلاصك يارب."]]}, {"l": "Job 19:25-27", "n": "", "vs": [[25, "أما أنا فإني موقن أن فادي حي، وأنه لابد في النهاية أن يقوم على الأرض."], [26, "وبعد أن يفنى جلدي، فإني بذاتي أعاين الله ."], [27, "الذي أشاهده لنفسي فتنظره عيناي وليس عينا آخر، قد فنيت كليتاي شوقا في داخلي."]]}, {"l": "Isa 25:8", "n": "", "vs": [[8, "ويبتلع الموت إلى الأبد، ويمسح السيد الرب الدموع المنهمرة على الوجوه، ويزيل عار شعبه من كل الأرض. هذا ما تكلم به الرب."]]}, {"l": "Isa 25:9", "n": "", "vs": [[9, "ويقولون في ذلك اليوم: «ها هو إلهنا الذي انتظرناه فخلصنا. هذا هو الرب الذي انتظرناه نبتهج ونفرح بخلاصه»."]]}, {"l": "Luk 2:25", "n": "", "vs": [[25, "وكان في أورشليم رجل اسمه سمعان، وهو رجل بار تقي ينتظر العزاء لإسرائيل وكان الروح القدس عليه."]]}, {"l": "Act 1:11", "n": "", "vs": [[11, "وقالا لهم: «أيها الجليليون، لماذا تقفون ناظرين إلى السماء؟ إن يسوع، هذا الذي ارتفع عنكم إلى السماء، سيعود منها مثلما رأيتموه منطلقا إليها!»"]]}, {"l": "Act 3:21", "n": "", "vs": [[21, "إذ لابد أن يبقى المسيح في السماء حتى يأتي الزمن الذي يتم فيه الإصلاح الشامل لكل شيء كما أوحى الله إلى أنبيائه الأتقياء منذ القدم."]]}, {"l": "Rom 2:7", "n": "", "vs": [[7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"]]}, {"l": "Rom 8:23-25", "n": "", "vs": [[23, "وليس هي وحدها، بل أيضا نحن الذين لنا باكورة الروح، نحن أنفسنا نئن في قرارة نفوسنا مترقبين إعلان بنوتنا بافتداء أجسادنا."], [24, "فإننا قد خلصنا، إنما بالرجاء؛ ولكن الرجاء متى رأيناه لا يكون رجاء؛ فما يراه الإنسان لماذا يرجوه بعد؟"], [25, "ولكن، إن كنا نرجو ما لا نراه، فبالصبر نتوقعه."]]}, {"l": "1Co 1:7", "n": "", "vs": [[7, "حتى إنكم لا تحتاجون بعد إلى أية موهبة فيما تتوقعون ظهور ربنا يسوع المسيح علنا."]]}, {"l": "Phi 3:20", "n": "", "vs": [[20, "أما نحن، فإن وطننا في السماوات التي منها ننتظر عودة مخلصنا الرب يسوع المسيح،"]]}, {"l": "1Th 1:7", "n": "", "vs": [[7, "حتى إنكم صرتم مثالا لجميع المؤمنين المقيمين في مقاطعتي مقدونية وأخائية."]]}, {"l": "1Th 2:7", "n": "", "vs": [[7, "مع أن لنا الحق في أن نفرض أنفسنا عليكم باعتبارنا رسلا للمسيح. ولكننا كنا مترفقين بكم كأم مرضع تحنو على أولادها."]]}, {"l": "2Ti 4:1", "n": "", "vs": [[1, "أطلب منك في حضرة الله والمسيح الذي سيدين الأحياء والأموات، بعودته العلنية وملكوته،"]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "Heb 9:28", "n": "", "vs": [[28, "كذلك المسيح أيضا: مات مرة واحدة حاملا خطايا كثيرين، مقربا نفسه (لله) عوضا عنهم. ولا بد أن يعود إلى الظهور. لا ليعالج الخطايا، بل ليحقق الخلاص النهائي لجميع منتظريه!"]]}, {"l": "2Pe 3:12", "n": "", "vs": [[12, "منتظرين «يوم الله» الأبدي وطالبين حلوله بسرعة. ففي ذلك اليوم، تنحل السماوات ملتهبة، وتذوب العناصر محترقة."]]}, {"l": "2Pe 3:14", "n": "", "vs": [[14, "فبينما تنتظرون إتمام هذا الوعد، أيها الأحباء، اجتهدوا أن يجدكم الرب في سلام، خالين من الدنس والعيب."]]}, {"l": "Rev 1:7", "n": "", "vs": [[7, "ها هو آت مع السحاب! ستراه عيون الجميع، حتى أولئك الذين طعنوه، وتنوح بسببه قبائل الأرض كلها! نعم، آمين!"]]}], "kwAr": "وتنتظروا من السماوات ابنه", "noteAr": ""}, {"kw": "whom", "raw": "Act_2:24, Act_3:15, Act_4:10, Act_5:30,Act_5:31, Act_10:40,Act_10:41, Act_17:31; Rom_1:4, Rom_4:25, Rom_8:34; 1Cor. 15:4-21; Col_1:18; 1Pe_1:3, 1Pe_1:21, 1Pe_3:18; Rev_1:18", "note": "", "refs": [{"l": "Act 2:24", "n": "", "vs": [[24, "ولكن الله أقامه من بين الأموات ناقضا أوجاع الموت، فما كان يمكن للموت أن يبقيه في قبضته!"]]}, {"l": "Act 3:15", "n": "", "vs": [[15, "وقتلتم واهب الحياة. ولكن الله أقامه من بين الأموات ونحن شهود لذلك."]]}, {"l": "Act 4:10", "n": "", "vs": [[10, "فاعلموا جميعا، وليعرف شعب إسرائيل كله، أنه باسم يسوع المسيح الناصري الذي صلبتموه أنتم، والذي أقامه الله من بين الأموات، باسمه يقف هذا الكسيح أمامكم في تمام الصحة!"]]}, {"l": "Act 5:30", "n": "", "vs": [[30, "إن إله آبائنا أقام يسوع، الذي قتلتموه أنتم معلقين إياه على الخشبة!"]]}, {"l": "Act 5:31", "n": "", "vs": [[31, "ولكن الله رفعه إلى يمينه وجعله رئيسا ومخلصا ليمنح إسرائيل التوبة وغفران الخطايا؛"]]}, {"l": "Act 10:40", "n": "", "vs": [[40, "ولكن الله أقامه من الموت في اليوم الثالث، وجعله يظهر،"]]}, {"l": "Act 10:41", "n": "", "vs": [[41, "لا للشعب كله، بل للشهود الذين اختارهم الله من قبل، لنا نحن الذين أكلنا وشربنا معه بعد قيامته من بين الأموات."]]}, {"l": "Act 17:31", "n": "", "vs": [[31, "لأنه حدد يوما يدين فيه العالم بالعدل على يد رجل اختاره لذلك. وقد قدم للجميع برهانا، إذ أقامه من بين الأموات»."]]}, {"l": "Rom 1:4", "n": "", "vs": [[4, "ومن ناحية روح القداسة، تبين بقوة أنه ابن الله بالقيامة من بين الأموات. إنه يسوع المسيح ربنا"]]}, {"l": "Rom 4:25", "n": "", "vs": [[25, "الذي أسلم للموت من أجل معاصينا ثم أقيم من أجل تبريرنا."]]}, {"l": "Rom 8:34", "n": "", "vs": [[34, "فمن ذا يدين؟ إنه المسيح يسوع هو الذي مات، بل بالأحرى قام، وهو أيضا عن يمين الله، وهو يشفع فينا أيضا."]]}, {"l": "1Co 15:4-21", "n": "", "vs": [[4, "وأنه دفن، وأنه قام في اليوم الثالث وفقا لما في الكتاب،"], [5, "وأنه ظهر لبطرس، ثم للاثني عشر."], [6, "وبعد ذلك ظهر لأكثر من خمس مئة أخ معا مازال معظمهم حيا، في حين رقد الآخرون."], [7, "ثم ظهر ليعقوب، وبعد ذلك للرسل جميعا."], [8, "وآخر الجميع، ظهر لي أنا أيضا، وكأني طفل ولد في غير أوانه!"], [9, "فإني أنا أصغر الرسل شأنا، ولست أهلا لأن أدعى رسولا لأني اضطهدت كنيسة الله."], [10, "ولكن، بنعمة الله صرت على ما أنا عليه الآن، ونعمته الموهوبة لي لم تكن عبثا، إذ عملت جاهدا أكثر من الرسل الآخرين جميعا. إلا أني لم أكن أنا العامل، بل نعمة الله التي كانت معي."], [11, "وسواء أكنت أنا أم كانوا هم، فهكذا نبش
