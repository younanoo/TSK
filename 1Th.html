هابيل البار إلى دم زكريا بن برخيا الذي قتلتموه بين الهيكل والمذبح."]]}, {"l": "Mat 23:37", "n": "", "vs": [[37, "ياأورشليم، ياأورشليم، ياقاتلة الأنبياء وراجمة المرسلين إليها! كم مرة أردت أن أجمع أولادك كما تجمع الدجاجة فراخها تحت جناحيها، فلم تريدوا!"]]}, {"l": "Mat 27:25", "n": "", "vs": [[25, "فأجاب الشعب بأجمعه: «ليكن دمه علينا وعلى أولادنا!»"]]}, {"l": "Luk 11:48-51", "n": "", "vs": [[48, "فأنتم إذن تشهدون موافقين على أعمال آبائكم: فهم قتلوا الأنبياء، وأنتم تبنون قبورهم."], [49, "لهذا السبب أيضا قالت حكمة الله: سأرسل إليهم أنبياء ورسلا، فيقتلون منهم ويضطهدون،"], [50, "حتى إن دماء جميع الأنبياء المسفوكة منذ تأسيس العالم، يطالب بها هذا الجيل،"], [51, "من دم هابيل إلى دم زكريا الذي قتل بين المذبح والقدس! أقول لكم: نعم، إن تلك الدماء يطالب بها هذا الجيل."]]}, {"l": "Luk 13:33", "n": "", "vs": [[33, "ولكن لابد أن أكمل مسيرتي اليوم وغدا وما بعدهما، لأنه لا يمكن أن يهلك نبي إلا في أورشليم!"]]}, {"l": "Luk 13:34", "n": "", "vs": [[34, "ياأورشليم، ياأورشليم، ياقاتلة الأنبياء وراجمة المرسلين إليها؛ كم مرة أردت أن أجمع أولادك معا كما تجمع الدجاجة فراخها تحت جناحيها، ولكنكم لم تريدوا!"]]}, {"l": "Act 2:23", "n": "", "vs": [[23, "ومع ذلك فقد سمح الله ، وفقا لمشيئته المحتومة وعلمه السابق، أن تقبضوا عليه وتصلبوه وتقتلوه بأيدي الأثمة."]]}, {"l": "Act 3:15", "n": "", "vs": [[15, "وقتلتم واهب الحياة. ولكن الله أقامه من بين الأموات ونحن شهود لذلك."]]}, {"l": "Act 4:10", "n": "", "vs": [[10, "فاعلموا جميعا، وليعرف شعب إسرائيل كله، أنه باسم يسوع المسيح الناصري الذي صلبتموه أنتم، والذي أقامه الله من بين الأموات، باسمه يقف هذا الكسيح أمامكم في تمام الصحة!"]]}, {"l": "Act 5:30", "n": "", "vs": [[30, "إن إله آبائنا أقام يسوع، الذي قتلتموه أنتم معلقين إياه على الخشبة!"]]}, {"l": "Act 7:52", "n": "", "vs": [[52, "فأي نبي نجا من اضطهادهم وقد قتلوا الذين أنبأوا بمجيء البار الذي سلمتموه أنتم وقتلتموه!"]]}], "kwAr": "الذين قتلوا الرب يسوع", "noteAr": ""}, {"kw": "persecuted us", "raw": "or, chased us out, Amo_7:12; Act_22:18-21", "note": "or, chased us out, Amo_7:12; Act_22:18-21", "refs": [{"l": "Amo 7:12", "n": "", "vs": [[12, "ثم قال أمصيا لعاموس: «اهرب أيها الرائي إلى أرض يهوذا، وكل خبزا هناك وتنبأ فيها."]]}, {"l": "Act 22:18-21", "n": "", "vs": [[18, "فرأيت الرب يقول لي: عجل واترك أورشليم بسرعة، لأن أهلها يرفضون أن تشهد لي فيها."], [19, "فقلت: يارب، إنهم يعرفون أني كنت أبحث في المجامع عن المؤمنين بك، لأسجنهم وأجلدهم."], [20, "وكنت حاضرا عندما قتل شهيدك استفانوس، وكنت راضيا بقتله، وحارسا لثياب قاتليه."], [21, "ولكنه قال لي: اذهب ... سأرسلك بعيدا: إلى الأمم!»"]]}], "kwAr": "واضطهدونا", "noteAr": "أو: طردونا."}, {"kw": "please", "raw": "Act_12:3; 1Co_10:5", "note": "", "refs": [{"l": "Act 12:3", "n": "", "vs": [[3, "ولما رأى أن هذا يرضي اليهود، قرر أن يقبض على بطرس أيضا، وكان ذلك في أيام عيد الفطير."]]}, {"l": "1Co 10:5", "n": "", "vs": [[5, "ومع ذلك، فإن الله لم يرتض بأكثرهم إذ طرحوا قتلى في الصحراء."]]}], "kwAr": "وهم لا يرضون الله", "noteAr": ""}, {"kw": "contrary", "raw": "Est_3:8; Luk_11:52, Luk_11:53", "note": "", "refs": [{"l": "Est 3:8", "n": "", "vs": [[8, "فقال هامان للملك أحشويروش: «هناك شعب ما متشتت ومتفرق بين الشعوب في كل أرجاء مملكتك، تغاير شرائعهم شرائع جميع الأمم، وهم لا ينفذون سنن الملك. فلا يجدر بالملك إغفال أمرهم."]]}, {"l": "Luk 11:52", "n": "", "vs": [[52, "الويل لكم ياعلماء الشريعة، فإنكم خطفتم مفتاح المعرفة، فلا أنتم دخلتم ولا تركتم الداخلين يدخلون! »"]]}, {"l": "Luk 11:53", "n": "", "vs": [[53, "وفيما هو خارج من هناك، بدأ الكتبة والفريسيون يضيقون عليه كثيرا، وأخذوا يستدرجونه إلى الكلام في أمور كثيرة،"]]}], "kwAr": "ويعادون الناس جميعا", "noteAr": ""}], "arS": [["الذين ", []], ["قتلوا", ["G615"]], [" ", []], ["الرب", ["G2962"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["والأنبياء", ["G4396"]], [" ", []], ["واضطهدونا", ["G1559"]], [" نحن أيضا، وهم لا ", []], ["يرضون", ["G700"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["ويعادون", ["G1727"]], [" ", []], ["الناس", ["G444"]], [" ", []], ["جميعا", ["G3956"]], ["،", []]]}, {"c": 2, "v": 16, "text": "إذ يمنعوننا من تبشير الأمم ليخلصوا، وبذلك يستكملون خطاياهم كل حين، ولكن الغضب قد حل عليهم إلى الغاية.", "groups": [{"kw": "Forbidding", "raw": "Act_11:2, Act_11:3, Act_11:17, Act_11:18, Act_13:50, Act_14:5, Act_14:19, Act_17:5, Act_17:6, Act_17:13, Act_18:12, Act_18:13, Act_19:9, Act_21:27-31; Act_22:21, Act_22:22; Gal_5:11; Eph_3:8, Eph_3:13", "note": "", "refs": [{"l": "Act 11:2", "n": "", "vs": [[2, "فما إن عاد بطرس إلى أورشليم حتى جادله دعاة الختان، وعارضوه قائلين:"]]}, {"l": "Act 11:3", "n": "", "vs": [[3, "«كيف دخلت بيت رجال غير مختونين، وأكلت معهم؟»"]]}, {"l": "Act 11:17", "n": "", "vs": [[17, "فإن كان الله قد ساواهم بنا فأعطاهم الهبة التي أعطانا، إذ آمنا بالرب يسوع المسيح، فمن أكون أنا حتى أعيق الله ؟»"]]}, {"l": "Act 11:18", "n": "", "vs": [[18, "فلما سمع المعارضون هذا، سكتوا، ومجدوا الله قائلين: «إذن، قد أنعم الله أيضا على غير اليهود بالتوبة لنوال الحياة»."]]}, {"l": "Act 13:50", "n": "", "vs": [[50, "ولكن اليهود حرضوا النساء النبيلات والمتعبدات ووجهاء المدينة، وأثاروا الاضطهاد على بولس وبرنابا، حتى طردوهما من بلدهم،"]]}, {"l": "Act 14:5", "n": "", "vs": [[5, "ولما أوشك غير اليهود واليهود ورؤساؤهم أن يهينوا الرسولين ويرجموهما بالحجارة،"]]}, {"l": "Act 14:19", "n": "", "vs": [[19, "بعد ذلك جاء بعض اليهود من أنطاكية وإيقونية، واستمالوا الجموع، فرجموا بولس حتى ظنوا أنه مات، وجروه إلى خارج المدينة."]]}, {"l": "Act 17:5", "n": "", "vs": [[5, "فأثار ذلك حسد اليهود الذين لم يؤمنوا، فأتوا ببعض الأشرار من أبناء الشارع، وجمعوا جمهورا وأخذوا يحرضون الناس حتى أثاروا الفوضى في المدينة، ثم هجموا على بيت ياسون مطالبين بتسليم بولس وسيلا إلى الجمع."]]}, {"l": "Act 17:6", "n": "", "vs": [[6, "ولما لم يجدوهما هناك جروا ياسون وبعض الإخوة واقتادوهم إلى حكام المدينة، واشتكوا عليهم صارخين: «إن هذين الرجلين اللذين قلبا الدنيا ، قد جاءا إلى مدينتنا أيضا،"]]}, {"l": "Act 17:13", "n": "", "vs": [[13, "وعرف يهود تسالونيكي أن بولس يبشر بكلمة الله في بيرية، فلحقوا به وبدأوا يحرضون الجموع ليثوروا عليه."]]}, {"l": "Act 18:12", "n": "", "vs": [[12, "ولما كان الحاكم الروماني غاليون يتولى الحكم على بلاد أخائية، تجمع اليهود ضد بولس برأي واحد، وساقوه إلى المحكمة،"]]}, {"l": "Act 18:13", "n": "", "vs": [[13, "واشتكوا عليه قائلين: «هذا الرجل يحاول إقناع الناس بأن يعبدوا الله بطريقة تخالف شريعتنا»."]]}, {"l": "Act 19:9", "n": "", "vs": [[9, "ولكن بعضهم عاندوا ولم يقتنعوا، وأخذوا يشتمون الطريق أمام المجتمعين. فانفصل بولس عنهم، وانفرد بالتلاميذ، وبدأ يعقد مناقشات كل يوم في مدرسة رجل اسمه تيرانوس،"]]}, {"l": "Act 21:27-31", "n": "", "vs": [[27, "ولما كادت الأيام السبعة أن تنقضي، رأى بعض اليهود من مقاطعة أسيا بولس في الهيكل، فحرضوا الجمع كله، وقبضوا عليه،"], [28, "وهم يصرخون: «النجدة يابني إسرائيل! هذا هو الرجل الذي يدعو الناس في كل مكان إلى عقيدة تشكل خطرا على شعبنا وشريعتنا وعلى هذا المكان، حتى إنه أدخل اليونانيين إلى الهيكل ودنس هذا المكان المقدس!»"], [29, "فإنهم كانوا قد رأوا تروفيمس الأفسسي مع بولس في المدينة، فظنوا أنه أدخله معه إلى الهيكل."], [30, "عندئذ هاج أهل المدينة جميعا، وهجم الناس على بولس وجروه إلى خارج الهيكل، ثم أغلقت الأبواب حالا."], [31, "وبينما هم يحاولون أن يقتلوه سمع قائد الكتيبة الرومانية أن الاضطراب عم أورشليم كلها."]]}, {"l": "Act 22:21", "n": "", "vs": [[21, "ولكنه قال لي: اذهب ... سأرسلك بعيدا: إلى الأمم!»"]]}, {"l": "Act 22:22", "n": "", "vs": [[22, "ظل المجتمعون يصغون حتى وصل بولس إلى ذكر الأمم، فصرخوا بقائد الكتيبة: «انزع هذا الرجل من الأرض! إنه لا يستحق الحياة!»"]]}, {"l": "Gal 5:11", "n": "", "vs": [[11, "وأما أنا، أيها الإخوة، فلو صح أنني مازلت أدعو إلى الختان، فلماذا مازلت ألقى الاضطهاد؟ إذن لكانت العثرة التي في الصليب قد زالت!"]]}, {"l": "Eph 3:8", "n": "", "vs": [[8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "Eph 3:13", "n": "", "vs": [[13, "فلذلك أطلب إليكم ألا يفتر عزمكم بسبب الضيقات التي أقاسيها لأجلكم، فهي مفخرة لكم."]]}], "kwAr": "إذ يمنعوننا", "noteAr": ""}, {"kw": "that", "raw": "Isa_45:22; Mar_16:16; Act_4:12; Rom_10:13-15; 2Th_2:10; 1Ti_2:4", "note": "", "refs": [{"l": "Isa 45:22", "n": "", "vs": [[22, "التفتوا إلي واخلصوا ياجميع أقاصي الأرض، لأني أنا الله وليس هناك آخر."]]}, {"l": "Mar 16:16", "n": "", "vs": [[16, "من آمن وتعمد، خلص، ومن لم يؤمن فسوف يدان."]]}, {"l": "Act 4:12", "n": "", "vs": [[12, "وليس بأحد غيره الخلاص، إذ ليس تحت السماء اسم آخر قدمه الله للبشر به يجب أن نخلص!»"]]}, {"l": "Rom 10:13-15", "n": "", "vs": [[13, "«فإن كل من يدعو باسم الرب يخلص»."], [14, "ولكن، كيف يدعون من لم يؤمنوا به؟ وكيف يؤمنون بمن لم يسمعوا به؟ وكيف يسمعون بلا مبشر؟"], [15, "وكيف يبشر أحد إلا إذا كان قد أرسل؟ كما قد كتب: «ما أجمل أقدام المبشرين بالخيرات!»"]]}, {"l": "2Th 2:10", "n": "", "vs": [[10, "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا."]]}, {"l": "1Ti 2:4", "n": "", "vs": [[4, "فهو يريد لجميع الناس أن يخلصوا، ويقبلوا إلى معرفة الحق بالتمام:"]]}], "kwAr": "ليخلصوا", "noteAr": ""}, {"kw": "to fill", "raw": "Gen_15:16; Zec_5:6-8; Mat_23:32", "note": "", "refs": [{"l": "Gen 15:16", "n": "", "vs": [[16, "أما هم فسيرجعون بعد أربعة أجيال إلى هنا، لأن إثم الأموريين لم يكتمل بعد»."]]}, {"l": "Zec 5:6-8", "n": "", "vs": [[6, "فسألت: «ما هذا؟» فأجاب: «إنه مكيال، وهو رمز إثمهم في الأرض كلها»."], [7, "وما لبث أن رفع الغطاء الرصاصي من على فوهته، وإذا بامرأة جالسة في داخل المكيال."], [8, "فقال لي: «هذه هي رمز الشر»، وألقى بها إلى داخل المكيال، وألقى الغطاء الثقيل على فوهته."]]}, {"l": "Mat 23:32", "n": "", "vs": [[32, "فأكملوا ما بدأه آباؤكم ليطفح الكيل!"]]}], "kwAr": "يستكملون خطاياهم", "noteAr": ""}, {"kw": "for", "raw": "Joe_2:30,Joe_2:31; Mal_4:1, Mal_4:5; Mat_3:7-10,Mat_3:12, Mat_12:45, Mat_21:41-44, Mat_22:6, Mat_22:7; Mat_24:6, Mat_24:14, Mat_24:21, Mat_24:22; Luk_11:50,Luk_11:51, Luk_19:42-44, Luk_21:20-24; Heb_6:8; Heb_10:27-30; Jam_5:1-6; Rev_22:11", "note": "", "refs": [{"l": "Joe 2:30", "n": "", "vs": [[30, "وأجري آيات في السماء وعلى الأرض، دما ونارا وأعمدة دخان."]]}, {"l": "Joe 2:31", "n": "", "vs": [[31, "وتتحول الشمس إلى ظلام، والقمر إلى دم، قبل مجيء يوم الرب العظيم المخيف."]]}, {"l": "Mal 4:1", "n": "", "vs": [[1, "«انظروا، ها يوم القضاء مقبل، لاهب كتنور يكون فيه جميع المستكبرين وفاعلي الإثم عصافة، فيحرقهم ذلك اليوم ولا يبقي لهم أصلا ولا فرعا، يقول الرب القدير."]]}, {"l": "Mal 4:5", "n": "", "vs": [[5, "ها أنا أرسل إليكم إيليا النبي قبل أن يجيء يوم قضاء الرب الرهيب العظيم"]]}, {"l": "Mat 3:7-10", "n": "", "vs": [[7, "ولما رأى يوحنا كثيرين من الفر يسيين والصدوقيين يأتون إليه ليتعمدوا، قال لهم: «ياأولاد الأفاعي، من أنذركم لتهربوا من الغضب الآتي؟"], [8, "فأثمروا ثمرا يليق بالتوبة."], [9, "ولا تعللوا أنفسكم قائلين: لنا إبراهيم أبا! فإني أقول لكم: إن الله قادر أن يطلع من هذه الحجارة أولادا لإبراهيم."], [10, "وها إن الفأس قد ألقيت على أصل الشجر، فكل شجرة لا تثمر ثمرا جيدا تقطع وتطرح في النار."]]}, {"l": "Mat 3:12", "n": "", "vs": [[12, "فهو يحمل المذرى بيده، وسينقي بيدره تماما: فيجمع قمحه إلى المخزن، وأما التبن فيحرقه بنار لا تطفأ! »"]]}, {"l": "Mat 12:45", "n": "", "vs": [[45, "فيذهب، ويحضر معه سبعة أرواح أخرى أكثر منه شرا، فتدخل جميعا وتسكن ذلك الإنسان، فتكون آخرته أسوأ من حالته الأولى. هكذا تكون حال هذا الجيل الشرير! »"]]}, {"l": "Mat 21:41-44", "n": "", "vs": [[41, "أجابوه: «أولئك الأشرار، يهلكهم شر هلاك. ثم يسلم الكرم إلى مزارعين آخرين يؤدون له الثمر في أوانه»."], [42, "فقال لهم يسوع: «ألم تقرأوا في الكتاب: الحجر الذي رفضه البناة، هو نفسه صار حجر الزاوية الأساسي. من الرب كان هذا، وهو عجيب في أنظارنا!"], [43, "لذلك أقول لكم: إن ملكوت الله سينزع من أيديكم ويسلم إلى شعب يؤدي ثمره."], [44, "فأي من يقع على هذا الحجر يتكسر، ومن يقع الحجر عليه يسحقه سحقا! »"]]}, {"l": "Mat 22:6", "n": "", "vs": [[6, "والباقون قبضوا على عبيد الملك وأهانوهم وقتلوهم."]]}, {"l": "Mat 22:7", "n": "", "vs": [[7, "فغضب الملك وأرسل جيوشه، فأهلك أولئك القتلة وأحرق مدينتهم."]]}, {"l": "Mat 24:6", "n": "", "vs": [[6, "وسوف تسمعون بحروب وأخبار حروب. فإياكم أن ترتعبوا! فلابد أن يحدث هذا كله، ولكن ليست النهاية بعد."]]}, {"l": "Mat 24:14", "n": "", "vs": [[14, "فسوف ينادى ببشارة الملكوت هذه في العالم كله، شهادة لي لدى الأمم جميعا. وبعد ذلك تأتي النهاية."]]}, {"l": "Mat 24:21", "n": "", "vs": [[21, "فسوف تحدث عندئذ ضيقة عظيمة لم يحدث مثلها منذ بدء العالم إلى الآن، ولن يحدث."]]}, {"l": "Mat 24:22", "n": "", "vs": [[22, "ولولا أن تلك الأيام ستختصر، لما كان أحد من البشر ينجو. ولكن من أجل المختارين ستختصر تلك الأيام."]]}, {"l": "Luk 11:50", "n": "", "vs": [[50, "حتى إن دماء جميع الأنبياء المسفوكة منذ تأسيس العالم، يطالب بها هذا الجيل،"]]}, {"l": "Luk 11:51", "n": "", "vs": [[51, "من دم هابيل إلى دم زكريا الذي قتل بين المذبح والقدس! أقول لكم: نعم، إن تلك الدماء يطالب بها هذا الجيل."]]}, {"l": "Luk 19:42-44", "n": "", "vs": [[42, "قائلا: «ليتك أنت أيضا، في يومك هذا، عرفت ما فيه سلامك! ولكن ذلك محجوب الآن عن عينيك."], [43, "فستأتي عليك أيام يحاصرك فيها أعداؤك بالمتاريس، ويطبقون عليك، ويشددون عليك الحصار من كل جهة،"], [44, "ويهدمونك على أبنائك الذين فيك، فلا يتركون فيك حجرا فوق حجر: لأنك لم تعرفي وقت افتقاد الله لك»."]]}, {"l": "Luk 21:20-24", "n": "", "vs": [[20, "وعندما ترون أورشليم محاصرة بالجيوش، فاعلموا أن خرابها قد اقترب."], [21, "عندئذ، ليهرب الذين في منطقة اليهودية إلى الجبال، وليرحل من المدينة من هم فيها، ولا يدخلها من هم في الأرياف:"], [22, "فإن هذه الأيام أيام انتقام يتم فيها كل ما قد كتب."], [23, "ولكن الويل للحبالى والمرضعات في تلك الأيام، لأن ضيقة عظيمة سوف تقع على الأرض وغضبا شديدا سينزل بهذا الشعب،"], [24, "فيسقطون بحد السيف ويساقون أسرى إلى جميع الأمم، وتبقى أورشليم تدوسها الأمم إلى أن تكتمل أزمنة الأمم."]]}, {"l": "Heb 6:8", "n": "", "vs": [[8, "ولكنها، إن أخرجت الشوك والعشب البري، تكون مرفوضة وتستحق اللعنة، وما نهايتها إلا الحريق."]]}, {"l": "Heb 10:27-30", "n": "", "vs": [[27, "بل انتظار العقاب الأكيد في لهيب النار التي ستلتهم المتمردين. ويا له من انتظار مخيف!"], [28, "تعلمون أن من خالف شريعة موسى، كان عقابه الموت دون رحمة، على أن يؤيد مخالفته شاهدان أو ثلاثة."], [29, "ففي ظنكم، كم يكون أشد كثيرا ذلك العقاب الذي يستحقه من يدوس ابن الله، إذ يعتبر أن دم العهد، الذي يتقدس به، هو دم نجس، وبذلك يهين روح النعمة؟"], [30, "فنحن نعرف من قال: «لي الانتقام، أنا أجازي، يقول الرب!» وأيضا: «إن الرب سوف يحاكم شعبه!»"]]}, {"l": "Jam 5:1-6", "n": "", "vs": [[1, "أيها الأغنياء، هيا الآن ابكوا مولولين بسبب ما ينتظركم من أهوال وشقاء."], [2, "إن ثرواتكم الكثيرة قد فسدت، وثيابكم الفاخرة قد أكلها العث"], [3, 1", "n": "", "vs": [[1, "ولكن بالنسبة إلى رجوع ربنا يسوع المسيح واجتماعنا إليه معا، نرجو منكم أيها الإخوة"]]}, {"l": "1Ti 6:14", "n": "", "vs": [[14, "أن تحفظ الوصية خالية من العيب واللوم إلى يوم ظهور ربنا يسوع المسيح علنا."]]}, {"l": "1Ti 6:15", "n": "", "vs": [[15, "هذا الظهور سوف يتممه الله في وقته الخاص، هو السيد المبارك الأوحد، ملك الملوك ورب الأرباب،"]]}, {"l": "2Ti 4:1", "n": "", "vs": [[1, "أطلب منك في حضرة الله والمسيح الذي سيدين الأحياء والأموات، بعودته العلنية وملكوته،"]]}, {"l": "2Ti 4:2", "n": "", "vs": [[2, "أن تنادي بالكلمة منشغلا بها كليا، في الفرص المناسبة وغير المناسبة على السواء، وأن توبخ وتنذر وتشجع بكل صبر في التعليم."]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "1Jo 2:28", "n": "", "vs": [[28, "والآن، أيها الأولاد، كونوا ثابتين في المسيح، حتى تكون لنا نحن ثقة أمامه، ولا نخجل منه، عندما يعود."]]}], "kwAr": "أمام", "noteAr": ""}, {"kw": "our Lord", "raw": "Jud_1:24", "note": "", "refs": [{"l": "Jud 1:24", "n": "", "vs": [[24, "وللقادر أن يحرسكم من السقوط حتى يوصلكم إلى المثول أمامه في المجد مبتهجين ولا عيب فيكم …"]]}], "kwAr": "ربنا يسوع", "noteAr": ""}, {"kw": "at", "raw": "Rev_1:7, Rev_22:12", "note": "", "refs": [{"l": "Rev 1:7", "n": "", "vs": [[7, "ها هو آت مع السحاب! ستراه عيون الجميع، حتى أولئك الذين طعنوه، وتنوح بسببه قبائل الأرض كلها! نعم، آمين!"]]}, {"l": "Rev 22:12", "n": "", "vs": [[12, "إني آت سريعا، ومعي المكافأة لأجازي كل واحد بحسب عمله."]]}], "kwAr": "عند عودته", "noteAr": ""}], "arS": [["فما هو ", []], ["رجاؤنا", ["G1680", "G2257"]], [" أو ", []], ["فرحنا", ["G5479"]], [" أو ", []], ["إكليل", ["G4735"]], [" ", []], ["افتخارنا", ["G2746"]], [" ", []], ["أمام", ["G1715"]], [" ", []], ["ربنا", ["G2962", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [" عند ", []], ["عودته", ["G3952"]], ["؟ أليس أنتم؟ بلى،", []]]}, {"c": 2, "v": 20, "text": "لأنكم فخرنا وفرحنا.", "groups": [{"kw": "", "raw": "Pro_17:6; 1Co_11:7", "note": "", "refs": [{"l": نبقى", ["G2641"]], [" ", []], ["وحدنا", ["G3441"]], [" في مدينة ", []], ["أثينا", ["G116"]], ["،", []]]}, {"c": 3, "v": 2, "text": "فبعثنا تيموثاوس، أخانا ومعاوننا في خدمة الله بنشر الإنجيل، لكي يشددكم ويشجعكم في إيمانكم،", "groups": [{"kw": "Timotheus", "raw": "Act_16:1, Act_17:14, Act_17:15, Act_18:5", "note": "", "refs": [{"l": "Act 16:1", "n": "", "vs": [[1, "ووصل بولس إلى دربة، ثم إلى لسترة، وكان فيها تلميذ اسمه تيموثاوس، أمه يهودية كانت قد آمنت بالمسيح، وأبوه يوناني."]]}, {"l": "Act 17:14", "n": "", "vs": [[14, "وفي الحال أخذ بعض الإخوة بولس نحو البحر ليسافر، وبقي سيلا وتيموثاوس هناك."]]}, {"l": "Act 17:15", "n": "", "vs": [[15, "ورافق الإخوة بولس حتى أوصلوه إلى أثينا، ثم رجعوا بعدما أوصاهم بولس بأن يلحق به سيلا وتيموثاوس بأسرع ما يمكن."]]}, {"l": "Act 18:5", "n": "", "vs": [[5, "ولما وصل سيلا وتيموثاوس من مقاطعة مقدونية، تفرغ بولس تماما للتبشير، شاهدا لليهود أن يسوع هو المسيح."]]}], "kwAr": "تيموثاوس", "noteAr": ""}, {"kw": "our brother", "raw": "Rom_16:21; 1Co_4:17, 1Co_16:10,1Co_16:11, 1Co_16:12; 2Co_1:19, 2Co_2:13, 2Co_8:23; Eph_6:21; Phi_2:19-25; Col_1:7, Col_4:9, Col_4:12", "note": "", "refs": [{"l": "Rom 16:21", "n": "", "vs": [[21, "يسلم عليكم تيموثاوس معاوني، ولوكيوس وياسون وسوسيباترس أقربائي."]]}, {"l": "1Co 4:17", "n": "", "vs": [[17, "لهذا السبب عينه أرسلت إليكم تيموثاوس، ابني الحبيب الأمين في الرب، فهو يذكركم بطرقي في السلوك في المسيح كما أعلم بها في كل مكان في جميع الكنائس."]]}, {"l": "1Co 16:10", "n": "", "vs": [[10, "وإذا وصل تيموثاوس إليكم، فاهتموا بأن يكون مطمئنا عندكم، لأنه يقوم بعمل الرب مثلي."]]}, {"l": "1Co 16:11", "n": "", "vs": [[11, "فلا يستخف به أحد، بل سهلوا له السبيل ليعود إلي بسلام، فأنا أنتظر وصوله، مع الإخوة."]]}, {"l": "1Co 16:12", "n": "", "vs": [[12, "أما الأخ أبلوس، فكثيرا ما توسلت إليه أن يرافق الإخوة في الذهاب إليكم. ولكن، لم تكن رغبة قط في أن يذهب الآن. على أنه سيذهب عندما تتوفر له الفرصة المناسبة."]]}, {"l": "2Co 1:19", "n": "", "vs": [[19, "فإن ابن الله، المسيح يسوع، الذي بشرنا به فيما بينكم، أنا وسلوانس وتيموثاوس، لم يك  [[23, "وعينا للتلاميذ شيوخا في كل كنيسة. ثم صليا بأصوام وأسلما الجميع وديعة بين يدي الرب الذي آمنوا به."]]}, {"l": "Act 16:5", "n": "", "vs": [[5, "فكانت الكنائس تتقوى في الإيمان، ويزداد عددها يوما بعد يوم."]]}, {"l": "Eph 6:22", "n": "", "vs": [[22, "وقد أرسلته إليكم لهذا الأمر بعينه: لتعرفوا أحوالي فتتشجع قلوبكم."]]}, {"l": "Phi 1:25", "n": "", "vs": [[25, "وما دامت لي ثقة بهذا، أعلم أني سأبقى وأقيم معكم جميعا، لأجل تقدمكم في الإيمان وفرحكم فيه،"]]}], "kwAr": "لكي يشددكم", "noteAr": ""}], "arS": [["فبعثنا", ["G3992"]], [" ", []], ["تيموثاوس", ["G5095"]], ["، ", []], ["أخانا", ["G80"]], [" ", []], ["ومعاوننا", ["G4904"]], [" في ", []], ["خدمة", ["G1249"]], [" ", []], ["الله", ["G2316"]], [" بنشر ", []], ["الإنجيل", ["G2098"]], ["، لكي ", []], ["يشددكم", ["G4741"]], [" ", []], ["ويشجعكم", ["G3870"]], [" في ", []], ["إيمانكم", ["G4102"]], ["،", []]]}, {"c": 3, "v": 3, "text": "حتى لا يتزعزع أحد منكم من جراء هذه الضيقات. فإنكم تعلمون أننا معينون لذلك؛", "groups": [{"kw": "moved", "raw": "Psa_112:6; Act_2:25, Act_20:24, Act_21:13; Rom_5:3; 1Co_15:58; Eph_3:13; Phi_1:28; Col_1:23; 2Th_1:4; 2Ti_1:8; 1Pe_4:12-14; Rev_2:10,Rev_2:13", "note": "", "refs": [{"l": "Psa 112:6", "n": "", "vs": [[6, "فإنه لن يتزعزع أبدا. ذكر الصديق يخلد إلى الأبد."]]}, {"l": "Act 2:25", "n": "", "vs": [[25, "فإن داود يقول فيه: كنت أرى الرب أمامي دائما فإنه عن يميني لئلا أتزعزع."]]}, {"l": "Act 20:24", "n": "", "vs": [[24, "ولكني لا أحسب لحياتي أية قيمة، ما دمت أسعى إلى بلوغ غايتي وإتمام الخدمة التي كلفني إياها الرب يسوع: أن أشهد ببشارة نعمة الله."]]}, {"l": "Act 21:13", "n": "", "vs": [[13, "ولكنه قال لنا: «ما لكم تبكون وتحطمون قلبي؟ إني مستعد ليس فقط لأن أقيد في أورشليم، بل أيضا لأن أموت من أجل اسم الرب يسوع!»"]]}, {"l": "Rom 5:3", "n": "", "vs": [[3, "ليس هذا فقط، بل نفتخر أيضا في وسط الضيقات، لعلمنا أن الضيق ينتج فينا الصبر،"]]}, {"l": "1Co 15:58", "n": "", "vs": [[58, "إذن، ياإخوتي الأحباء، كونوا راسخين غير متزحزحين، كثيري الاجتهاد في عمل الرب دائما، عالمين أن جهدكم في الرب ليس عبثا!"]]}, {"l": "Eph 3:13", "n": "", "vs": [[13, "فلذلك أطلب إليكم ألا يفتر عزمكم بسبب الضيقات التي أقاسيها لأجلكم، فهي مفخرة لكم."]]}, {"l": "Phi 1:28", "n": "", "vs": [[28, "غير مرتعبين في شيء من الذين يقاومونكم، فإن في مقاومتهم دليلا على هلاكهم هم وعلى خلاصكم أنتم، وذلك من عند الله."]]}, {"l": "Col 1:23", "n": "", "vs": [[23, "على أن تثبتوا فعلا في الإيمان، مؤسسين وراسخين وغير متحولين عن رجاء الإنجيل الذي سمعتموه والذي بشر به للخليقة كلها تحت السماء، وله صرت أنا بولس خادما."]]}, {"l": "2Th 1:4", "n": "", "vs": [[4, "حتى إننا، نحن أنفسنا، نفتخر بكم في كنائس الله بسبب ثباتكم وإيمانكم في وسط كل ما تحتملونه من اضطهادات وضيقات."]]}, {"l": "2Ti 1:8", "n": "", "vs": [[8, "فلا تخجل إذن بالشهادة لربنا، ولا تخجل بي أنا السجين لأجله، بل شاركني في المشقات لأجل الإنجيل، متوكلا على قدرة الله."]]}, {"l": "1Pe 4:12-14", "n": "", "vs": [[12, "أيها الأحباء، لا تستغربوا نار الاضطهاد المشتعلة عندكم لاختباركم وكأن أمرا غريبا قد أصابكم!"], [13, "وإنما افرحوا: لأنكم كما تشاركون المسيح في الآلام الآن، لابد أن تفرحوا بمشاركته في الابتهاج عند ظهور مجده."], [14, "فإذا لحقتكم الإهانة لأنكم تحملون اسم المسيح، فطوبى لكم! لأن روح المجد، أي روح الله، يستقر عليكم."]]}, {"l": "Rev 2:10", "n": "", "vs": [[10, "دع عنك الخوف مما ينتظرك من آلام، فإن إبليس سيزج ببعضكم في السجن لكي تمتحنوا، فتقاسون الاضطهاد عشرة أيام. فابق أمينا حتى الموت، فأمنحك إكليل الحياة."]]}, {"l": "Rev 2:13", "n": "", "vs": [[13, "إني أعلم أين تسكن، حيث عرش الشيطان! ورغم ذلك تمسكت باسمي، ورفضت أن تنكر الإيمان بي، حتى في أيام أنتيباس شهيدي الأمين، الذي قتل عندكم حيث يسكن الشيطان!"]]}], "kwAr": "حتى لا يتزعزع أحد منكم", "noteAr": ""}, {"kw": "we are", "raw": "1Th_5:9; Mat_10:16-18, Mat_24:9, Mat_24:10; Luk_21:12; Joh_15:19-21, Joh_16:2, Joh_16:33; Act_9:16; Act_14:22, Act_20:23, Act_21:11, Act_21:13; Rom_8:35-37; 1Co_4:9; 2Ti_3:11, 2Ti_3:12; 1Pe_2:21, 1Pe_4:12", "note": "", "refs": [{"l": "1Th 5:9", "n": "", "vs": [[9, "فإن الله عيننا لا لينزل علينا الغضب بل لننال الخلاص بربنا يسوع المسيح،"]]}, {"l": "Mat 10:16-18", "n": "", "vs": [[16, "ها أنا أرسلكم مثل الخراف بين الذئاب، فكونوا متنبهين كالحيات ومسالمين كالحمام."], [17, "احذروا من الناس! فإنهم سيسلمونكم إلى المحاكم، ويجلدونكم في مجامعهم؛"], [18, "وتساقون للمثول أمام الحكام والملوك من أجلي: فيكون ذلك شهادة لي لدى اليهود والأمم على السواء."]]}, {"l": "Mat 24:9", "n": "", "vs": [[9, "عندئذ يسلمكم الناس إلى العذاب، ويقتلونكم، وتكونون مكروهين لدى جميع الأمم من أجل اسمي؛"]]}, {"l": "Mat 24:10", "n": "", "vs": [[10, "فيرتد كثيرون ويسلمون بعضهم بعضا ويبغضون بعضهم بعضا،"]]}, {"l": "Luk 21:12", "n": "", "vs": [[12, "ولكن قبل هذه الأمور كلها يمد الناس أيديهم إليكم ويضطهدونكم، فيسلمونكم إلى المجامع والسجون، ويسوقونكم للمثول أمام الملوك والحكام، من أجل اسمي."]]}, {"l": "Joh 15:19-21", "n": "", "vs": [[19, "لو كنتم من أهل العالم، لكان العالم يحب أهله، ولكن لأنكم لستم من أهل العالم، بل إني اخترتكم من وسط العالم، لذلك يبغضكم العالم."], [20, "اذكروا الكلمة التي قلتها لكم: ليس عبد أعظم من سيده. فإن كان أهل العالم قد اضطهدوني، فسوف يضطهدونكم؛ وإن كانوا قد عملوا بكلمتي، فسوف يعملون بكلمتكم."], [21, "ولكنهم سيفعلون هذا كله بكم من أجل اسمي، لأنهم لا يعرفون الذي أرسلني."]]}, {"l": "Joh 16:2", "n": "", "vs": [[2, "ستطردون خارج المجامع، بل سيأتي وقت يظن فيه من يقتلكم أنه يؤدي خدمة لله."]]}, {"l": "Joh 16:33", "n": "", "vs": [[33, "أخبرتكم بهذا كله ليكون لكم في سلام. فإنكم في العالم ستقاسون الضيق. ولكن تشجعوا، فأنا قد انتصرت على العالم!»"]]}, {"l": "Act 9:16", "n": "", "vs": [[16, "وسأريه كم ينبغي أن يتألم من أجل اسمي!»"]]}, {"l": "Act 14:22", "n": "", "vs": [[22, "وفي هذه الأماكن كلها كانا يشددان عزيمة التلاميذ، ويحثانهم على الثبات في الإيمان، مؤكدين لهم أن دخول ملكوت الله يقتضي أن نقاسي صعوبات كثيرة."]]}, {"l": "Act 20:23", "n": "", "vs": [[23, "إلا أن الروح القدس كان يعلن لي في كل مدينة أذهب إليها أن السجن والمصاعب تنتظرني"]]}, {"l": "Act 21:11", "n": "", "vs": [[11, "فأخذ حزام بولس، وقيد نفسه رابطا يديه ورجليه وقال: «يقول الروح القدس إن صاحب هذا الحزام سيقيده اليهود هكذا في أورشليم، ويسلمونه إلى أيدي الأجانب»."]]}, {"l": "Act 21:13", "n": "", "vs": [[13, "ولكنه قال لنا: «ما لكم تبكون وتحطمون قلبي؟ إني مستعد ليس فقط لأن أقيد في أورشليم، بل أيضا لأن أموت من أجل اسم الرب يسوع!»"]]}, {"l": "Rom 8:35-37", "n": "", "vs": [[35, "فمن سيفصلنا عن محبة المسيح لنا؟ هل الشدة أم الضيق أم الاضطهاد أم الجوع أم العري أم الخطر أم السيف؟"], [36, "بل كما قد كتب: «إننا من أجلك نعاني الموت طول النهار. قد حسبنا كأننا غنم للذبح!»"], [37, "ولكننا، في جميع هذه الأمور، نحرز ما يفوق الانتصار على يد من أحبنا."]]}, {"l": "1Co 4:9", "n": "", "vs": [[9, "فإني أرى أن الله عرضنا، نحن الرسل، في آخر الموكب كأنه محكوم علينا بالموت، لأننا صرنا معرضا للعالم، للملائكة والبشر معا."]]}, {"l": "2Ti 3:11", "n": "", "vs": [[11, "واضطهاداتي، وآلامي تلك التي حدثت لي في مدن أنطاكية وإيقونية ولسترة وغيرها؛ وكم احتملت من اضطهادات، والرب أنقذني منها جميعا!"]]}, {"l": "2Ti 3:12", "n": "", "vs": [[12, "وحقا، إن جميع الذين يعزمون أن يعيشوا عيشة التقوى في المسيح يسوع يضطهدون."]]}, {"l": "1Pe 2:21", "n": "", "vs": [[21, "لأن الله دعاكم إلى الاشتراك في هذا النوع من الآلام. فالمسيح، الذي تألم لأجلكم، هو القدوة التي تقتدون بها. فسيروا على آثار خطواته:"]]}, {"l": "1Pe 4:12", "n": "", "vs": [[12, "أيها الأحباء، لا تستغربوا نار الاضطهاد المشتعلة عندكم لاختباركم وكأن أمرا غريبا قد أصابكم!"]]}], "kwAr": "أننا معينون لذلك", "noteAr": ""}], "arS": [["حتى لا ", []], ["يتزعزع", ["G4525"]], [" أحد منكم من جراء هذه ", []], ["الضيقات", ["G2347"]], [". فإنكم ", []], ["تعلمون", ["G1492"]], [" أننا ", []], ["معينون", ["G2749"]], [" لذلك؛", []]]}, {"c": 3, "v": 4, "text": "وقد سبق لنا، لما كنا عندكم أن أخبرناكم أننا سنقاسي الضيقات، الأمر الذي حدث بعد ذلك كما تعلمون.", "groups": [{"kw": "we told", "raw": "Joh_16:1-3; Act_20:24", "note": "", "refs": [{"l": "Joh 16:1-3", "n": "", "vs": [[1, "قلت لكم هذا لكي لا تتزعزعوا."], [2, "ستطردون خارج المجامع، بل سيأتي وقت يظن فيه من يقتلكم أنه يؤدي خدمة لله."], [3, "وهم يفعلون هذا بكم لأنهم لم يعرفوا أبي، ولا عرفوني."]]}, {"l": "Act 20:24", "n": "", "vs": [[24, "ولكني لا أحسب لحياتي أية قيمة، ما دمت أسعى إلى بلوغ غايتي وإتمام الخدمة التي كلفني إياها الرب يسوع: أن أشهد ببشارة نعمة الله."]]}], "kwAr": "أخبرناكم", "noteAr": ""}, {"kw": "even", "raw": "1Th_2:2, 1Th_2:14; Act_17:1, Act_17:5-9, Act_17:13; 2Co_8:1, 2Co_8:2; 2Th_1:4-6", "note": "", "refs": [{"l": "1Th 2:2", "n": "", "vs": [[2, "فمع أننا كنا قد قاسينا الألم والإهانة في مدينة فيلبي، كما تعلمون، فقد تجرأنا في إلهنا أن نكلمكم بإنجيل الله مجاهدين في وجه المعارضة الشديدة."]]}, {"l": "1Th 2:14", "n": "", "vs": [[14, "فإنكم، أيها الإخوة، قد صرتم على مثال كنائس الله التي في منطقة اليهودية والتي هي في المسيح يسوع. فأنتم أيضا قاسيتم على أيدي بني جنسكم ما قاسوه هم على أيدي اليهود"]]}, {"l": "Act 17:1", "n": "", "vs": [[1, "وصل بولس وسيلا إلى تسالونيكي بعدما مرا بأمفيبوليس وأبولونية. وكان في تسالونيكي مجمع لليهود."]]}, {"l": "Act 17:5-9", "n": "", "vs": [[5, "فأثار ذلك حسد اليهود الذين لم يؤمنوا، فأتوا ببعض الأشرار من أبناء الشارع، وجمعوا جمهورا وأخذوا يحرضون الناس حتى أثاروا الفوضى في المدينة، ثم هجموا على بيت ياسون مطالبين بتسليم بولس وسيلا إلى الجمع."], [6, "ولما لم يجدوهما هناك جروا ياسون وبعض الإخوة واقتادوهم إلى حكام المدينة، واشتكوا عليهم صارخين: «إن هذين الرجلين اللذين قلبا الدنيا ، قد جاءا إلى مدينتنا أيضا،"], [7, "فاستضافهما ياسون. وهم جميعا يخالفون أوامر القيصر، وينادون بملك آخر اسمه يسوع»."], [8, "فأحدثوا انزعاجا لدى الجمع والحكام عندما سمعوا هذا."], [9, "فقبض الحكام كفالة من ياسون ومن معه ثم أفرجوا عنهم."]]}, {"l": "Act 17:13", "n": "", "vs": [[13, "وعرف يهود تسالونيكي أن بولس يبشر بكلمة الله في بيرية، فلحقوا به وبدأوا يحرضون الجموع ليثوروا عليه."]]}, {"l": "2Co 8:1", "n": "", "vs": [[1, "والآن، نعرفكم، أيها الإخوة، بنعمة الله الموهوبة في كنائس مقاطعة مقدونية."]]}, {"l": "2Co 8:2", "n": "", "vs": [[2, "فمع أنهم كانوا في تجربة ضيقة شديدة، فإن فرحهم الوافر مع فقرهم الشديد فاضا فأنتجا منهم سخاء غنيا."]]}, {"l": "2Th 1:4-6", "n": "", "vs": [[4, "حتى إننا، نحن أنفسنا، نفتخر بكم في كنائس الله بسبب ثباتكم وإيمانكم في وسط كل ما تحتملونه من اضطهادات وضيقات."], [5, "وفي هذا دليل على حكم الله العادل، بقصد أن تعتبروا مؤهلين لملكوت الله الذي من أجله تلاقون الآلام."], [6, "فمن العدل عند الله حقا أن يجازي بالضيقة أولئك الذين يضايقونكم،"]]}], "kwAr": "الأمر الذي حدث", "noteAr": ""}], "arS": [["وقد سبق لنا، لما ", []], ["كنا", ["G2258"]], [" عندكم أن ", []], ["أخبرناكم", ["G4302"]], [" أننا ", []], ["سنقاسي الضيقات", ["G3195", "G2346"]], ["، الأمر الذي ", []], ["حدث", ["G1096"]], [" بعد ذلك كما ", []], ["تعلمون", ["G1492"]], [".", []]]}, {"c": 3, "v": 5, "text": "ولهذا أيضا، إذ صار الافتراق عنكم لا يحتمل، أرسلت أستخبر عن إيمانكم لئلا يكون المجرب قد جربكم فيذهب جهدنا سدى!", "groups": [{"kw": "when", "raw": "1Th_3:1", "note": "", "refs": [{"l": "1Th 3:1", "n": "", "vs": [[1, "لذلك لما صار افتراقنا عنكم لا يحتمل، حسن لدينا أن نبقى وحدنا في مدينة أثينا،"]]}], "kwAr": "إذ صار الافتراق عنكم لا يحتمل", "noteAr": ""}, {"kw": "I sent", "raw": "1Th_3:2, 1Th_3:6; Act_15:36; 2Co_7:5-7", "note": "", "refs": [{"l": "1Th 3:2", "n": "", "vs": [[2, "فبعثنا تيموثاوس، أخانا ومعاوننا في خدمة الله بنشر الإنجيل، لكي يشددكم ويشجعكم في إيمانكم،"]]}, {"l": "1Th 3:6", "n": "", "vs": [[6, "أما الآن، وقد عاد تيموثاوس إلينا من عندكم وبشرنا بما لكم من إيمان ومحبة، وبأنكم تذكروننا ذكرا حسنا في كل حين، وتشتاقون كثيرا لرؤيتنا كما نشتاق نحن لرؤيتكم،"]]}, {"l": "Act 15:36", "n": "", "vs": [[36, "وبعد بضعة أيام قال بولس لبرنابا: «هيا نرجع لنتفقد الإخوة ونطلع على أحوالهم في كل مدينة بشرنا فيها بكلمة الرب»."]]}, {"l": "2Co 7:5-7", "n": "", "vs": [[5, "فإننا لما وصلنا إلى مقاطعة مقدونية، لم تذق أجسادنا طعم الراحة، بل واجهتنا الضيقات من كل جهة: إذ كثر حولنا النزاع، وزاد في داخلنا الخوف."], [6, "إلا أن الله ، الذي يشجع المسحوقين، أمدنا بالتشجيع بمجيء تيطس إلينا،"], [7, "لا بمجيئه وحسب، بل بالتشجيع الذي لقيه عندكم. وقد أخبرنا بشوقكم، وحزنكم، وغيرتكم علي، فتضاعف فرحي."]]}], "kwAr": "أرسلت أستخبر عن إيمانكم", "noteAr": ""}, {"kw": "lest", "raw": "Mat_4:3; 1Co_7:5; 2Co_2:11, 2Co_11:2, 2Co_11:3, 2Co_11:13-15; Gal_1:6-9; Eph_4:14; Jam_1:13, Jam_1:14", "note": "", "refs": [{"l": "Mat 4:3", "n": "", "vs": [[3, "فتقدم إليه المجرب وقال له: «إن كنت ابن الله، فقل لهذه الحجارة أن تتحول إلى خبز!»"]]}, { لهنا،"]]}, {"l": "2Co 1:4", "n": "", "vs": [[4, "هو الذي يشجعنا في كل ضيقة نمر بها، حتى نستطيع أن نشجع الذين يمرون بأية ضيقة، بالتشجيع الذي به يشجعنا الله ."]]}, {"l": "2Co 7:6", "n": "", "vs": [[6, "إلا أن الله ، الذي يشجع المسحوقين، أمدنا بالتشجيع بمجيء تيطس إلينا،"]]}, {"l": "2Co 7:7", "n": "", "vs": [[7, "لا بمجيئه وحسب، بل بالتشجيع الذي لقيه عندكم. وقد أخبرنا بشوقكم، وحزنكم، وغيرتكم علي، فتضاعف فرحي."]]}, {"l": "2Co 7:13", "n": "", "vs": [[13, "لهذا السبب قد تعزينا. وفوق تعزيتنا، فرحنا أكثر جدا لفرح تيطس لأن روحه انتعشت بكم جميعا."]]}, {"l": "2Jo 1:4", "n": "", "vs": [[4, "فرحت جدا حين وجدت بعض أولادك يسلكون بحسب الحق، وفقا لما أوصانا به الآب."]]}], "kwAr": "فقد وجدنا بكم عزاء", "noteAr": ""}, {"kw": "in all", "raw": "Act_17:4-10; 1Co_4:9-13; 2Co_11:23-28; 2Ti_3:10-12", "note": "", "refs": [{"l": "Act 17:4-10", "n": "", "vs": [[4, "فاقتنع بعض الحاضرين وانضموا إلى بولس وسيلا. وكان بينهم عدد كبير من اليونانيين المتعبدين لله وكثيرات من النساء النبيلات."], [5, "فأثار ذلك حسد اليهود الذين لم يؤمنوا، فأتوا ببعض الأشرار من أبناء الشارع، وجمعوا جمهورا وأخذوا يحرضون الناس حتى أثاروا الفوضى في المدينة، ثم هجموا على بيت ياسون مطالبين بتسليم بولس وسيلا إلى الجمع."], [6, "ولما لم يجدوهما هناك جروا ياسون وبعض الإخوة واقتادوهم إلى حكام المدينة، واشتكوا عليهم صارخين: «إن هذين الرجلين اللذين قلبا الدنيا ، قد جاءا إلى مدينتنا أيضا،"], [7, "فاستضافهما ياسون. وهم جميعا يخالفون أوامر القيصر، وينادون بملك آخر اسمه يسوع»."], [8, "فأحدثوا انزعاجا لدى الجمع والحكام عندما سمعوا هذا."], [9, "فقبض الحكام كفالة من ياسون ومن معه ثم أفرجوا عنهم."], [10, "وفي الليل رحل الإخوة بولس وسيلا حالا إلى بيرية. ولما وصلا إليها، ذهبا إلى مجمع اليهود فيها."]]}, {"l": "1Co 4:9-13", "n": "", "vs": [[9, "فإني أرى أن الله عرضنا، نحن الرسل، في آخر الموكب كأنه محكوم علينا بالموت، لأننا صرنا معرضا للعالم، للملائكة والبشر معا."], [10, "نحن جهلاء من أجل المسيح، وأنتم حكماء في المسيح. نحن ضعفاء وأنتم أقوياء. أنتم مكرمون ونحن مهانون."], [11, "فما زلنا حتى هذه الساعة نجوع ونعطش، ونعرى ونلطم ونحرم محلا للإقامة"], [12, "ونجهد أنفسنا في الشغل بأيدينا. نتعرض للإهانة فنبارك، وللاضطهاد فنحتمل"], [13, "وللتجريح فنسالم. صرنا كأقذار العالم ونفاية الجميع، ومازلنا!"]]}, {"l": "2Co 11:23-28", "n": "", "vs": [[23, "وإن كانوا خدام المسيح، أتكلم كأني فقدت صوابي، فأنا متفوق عليهم: في الأتعاب أوفر منهم جدا، في الجلدات فوق الحد، في السجون أوفر جدا، في التعرض للموت أكثر مرارا."], [24, "من اليهود تلقيت الجلد خمس مرات، كل مرة أربعين جلدة إلا واحدة."], [25, "ضربت بالعصي ثلاث مرات. رجمت بالحجارة مرة. تحطمت بي السفينة ثلاث مرات. قضيت في عرض البحر يوما بنهاره وليله."], [26, "سافرت أسفارا عديدة؛ وواجهتني أخطار السيول الجارفة، وأخطار قطاع الطرق، وأخطار من بني جنسي، وأخطار من الأمم، وأخطار في المدن، وأخطار في البراري، وأخطار في البحر، وأخطار بين إخوة دجالين."], [27, "وكم عانيت من التعب والكد والسهر الطويل، والجوع والعطش والصوم الكثير، والبرد والعري."], [28, "وفضلا عن هذه المخاطر الخارجية، يزداد علي الضغط يوما بعد يوم، إذ أحمل هم جميع الكنائس."]]}, {"l": "2Ti 3:10-12", "n": "", "vs": [[10, "وأما أنت، فقد عرفت جيدا تعليمي، وسيرتي، وهدفي، وإيماني، وتحملي للمشقات، ومحبتي، وثباتي،"], [11, "واضطهاداتي، وآلامي تلك التي حدثت لي في مدن أنطاكية وإيقونية ولسترة وغيرها؛ وكم احتملت من اضطهادات، والرب أنقذني منها جميعا!"], [12, "وحقا، إن جميع الذين يعزمون أن يعيشوا عيشة التقوى في المسيح يسوع يضطهدون."]]}], "kwAr": "في وسط ضيقتنا وشدتنا", "noteAr": ""}], "arS": [["فقد وجدنا بكم أيها ", []], ["الإخوة", ["G80"]], [" ", []], ["عزاء", ["G3870"]], [" في وسط ", []], ["ضيقتنا", ["G2347"]], [" ", []], ["وشدتنا", ["G318"]], [" من جهة ", []], ["إيمانكم", ["G4102"]], [".", []]]}, {"c": 3, "v": 8, "text": "فقد طابت لنا الحياة مادمتم ثابتين في الرب!", "groups": [{"kw": "we live", "raw": "1Sa_25:6 *Heb: Psa_30:5; Phi_1:21", "note": "", "refs": [{"l": "1Sa 25:6", "n": "*Heb:", "vs": [[6, "«أطال الله بقاءك، وجعلك أنت وبيتك وكل مالك سالما."]]}, {"l": "Psa 30:5", "n": "", "vs": [[5, "فإن غضبه يدوم للحظة، أما رضاه فمدى الحياة. يبقى البكاء لليلة، أما في الصباح فيعم الابتهاج."]]}, {"l": "Phi 1:21", "n": "", "vs": [[21, "فالحياة عندي هي ال  اليهود، أيها الملك:"]]}, {"l": "2Ti 1:3", "n": "", "vs": [[3, "كم أشكر الله ، الذي أعبده بضمير طاهر كما أخذت عن أجدادي، إذ مازلت أذكرك دائما في تضرعاتي ليلا ونهارا؛"]]}, {"l": "Rev 4:8", "n": "", "vs": [[8, "وكان لكل كائن منها ستة أجنحة، تكسوها عيون من الداخل ومن الخارج. وهذه الكائنات الحية الأربعة تهتف ليلا ونهارا دون انقطاع قائلة: «قدوس قدوس قدوس، الرب الإله القادر على كل شيء، الذي كان والكائن والذي سيأتي»."]]}, {"l": "Rev 7:15", "n": "", "vs": [[15, "لهذا هم أمام عرش الله يخدمونه في هيكله ليلا ونهارا والجالس على العرش يبسط خيمته عليهم،"]]}], "kwAr": "ليل نهار", "noteAr": ""}, {"kw": "praying", "raw": "1Th_3:11, 1Th_2:17, 1Th_2:18; Rom_1:10, Rom_15:30-32; Phm_1:22", "note": "", "refs": [{"l": "1Th 3:11", "n": "", "vs": [[11, "ليت الله أبانا نفسه، وربنا يسوع المسيح، يسهل أمامنا الطريق إليكم."]]}, {"l": "1Th 2:17", "n": "", "vs": [[17, "أما نحن، أيها الإخوة، فإذ قد سلخنا عنكم لمدة قصيرة، بالوجه لا بالقلب، بذلنا جهدا أوفر جدا لرؤية وجوهكم ونحن في غاية الشوق إليكم."]]}, {"l": "1Th 2:18", "n": "", "vs": [[18, "ولهذا عزمنا أن نأتي إليكم على الأخص أنا بولس مرة بعد مرة، فعاقنا الشيطان."]]}, {"l": "Rom 1:10", "n": "", "vs": [[10, "في صلواتي، متوسلا دائما عسى الآن أن يتيسر لي مرة بمشيئة الله أن آتي إليكم."]]}, {"l": "Rom 15:30-32", "n": "", "vs": [[30, "فأتوسل إليكم، أيها الإخوة، بربنا يسوع المسيح وبمحبة الروح، أن تجاهدوا معي في الصلوات إلى الله من أجلي،"], [31, "لكي أنجو من غير المؤمنين الذين في اليهودية، ولكي تكون خدمتي هذه للقديسين في أورشليم مقبولة عندهم،"], [32, "حتى أجيء إليكم في فرح بمشيئة الله فأنتعش عندكم وأستريح."]]}, {"l": "Phm 1:22", "n": "", "vs": [[22, "وفضلا عن هذا، أعد لي عندك مكانا للإقامة، لأني أرجو أن أوهب لكم إجابة لصلواتكم."]]}], "kwAr": "نتضرع", "noteAr": ""}, {"kw": "might perfect", "raw": "Rom_1:11, Rom_1:12; 2Co_1:15, 2Co_1:24, 2Co_13:9, 2Co_13:11; Phi_1:25; Col_1:28, Col_4:12; 2Th_1:11", "note": "", "refs": [{"l": "Rom 1:11", "n": "", "vs": [[11, "فإني أشتاق أن أراكم لأحمل إليكم موهبة روحية لتثبيتكم،"]]}, {"l": "Rom 1:12", "n": "", "vs": [[12, "أي اسة أمام إلهنا وأبينا عندما يظهر ربنا يسوع عائدا مع جميع قديسيه."]]}, {"l": "Isa 63:16", "n": "", "vs": [[16, "فأنت هو أبونا، مع أن إبراهيم لا يعرفنا، وإسرائيل لا يعترف بنا، فأنت أيها الرب، هو أبونا، واسمك فادينا منذ القديم."]]}, {"l": "Jer 31:9", "n": "", "vs": [[9, "سيرجعون بنوح، وبتضرعات أهديهم. إلى جوار جداول المياه أسيرهم فيمشون في طريق مستقيمة لا يعثرون فيها، لأني أب لإسرائيل، وأفرايم بكري»."]]}, {"l": "Mal 1:6", "n": "", "vs": [[6, "إن الابن يكرم أباه والعبد سيده. فإن كنت أنا حقا أبا فأين كرامتي؟ وإن كنت حقا سيدا فأين مهابتي؟ إن الرب القدير يقول لكم: أيها الكهنة المزدرون باسمي؛ فتسألون: كيف ازدرينا باسمك؟"]]}, {"l": "Mat 6:4", "n": "", "vs": [[4, "لتكون صدقتك في الخفاء، وأبوك السماوي الذي يرى في الخفاء، هو يكافئك."]]}, {"l": "Mat 6:6", "n": "", "vs": [[6, "أما أنت، فعندما تصلي، فادخل غرفتك، وأغلق الباب عليك، وصل إلى أبيك الذي في الخفاء. وأبوك الذي يرى في الخفاء، هو يكافئك."]]}, {"l": "Mat 6:8", "n": "", "vs": [[8, "فلا تكونوا مثلهم، لأن أباكم يعلم ما تحتاجون إليه قبل أن تسألوه."]]}, {"l": "Mat 6:9", "n": "", "vs": [[9, "فصلوا أنتم مثل هذه الصلاة: أبانا الذي في السماوات، ليتقدس اسمك!"]]}, {"l": "Mat 6:14", "n": "", "vs": [[14, "فإن غفرتم للناس زلاتهم، يغفر لكم أبوكم السماوي زلاتكم."]]}, {"l": "Mat 6:18", "n": "", "vs": [[18, "لكي لا تظهر للناس صائما، بل لأبيك الذي في الخفاء. وأبوك الذي يرى في الخفاء، هو يكافئك."]]}, {"l": "Mat 6:26", "n": "", "vs": [[26, "تأملوا طيور السماء: إنها لا تزرع ولا تحصد ولا تجمع في مخازن، وأبوكم السماوي يعولها. أفلستم أنتم أفضل منها كثيرا؟"]]}, {"l": "Mat 6:32", "n": "", "vs": [[32, "فهذه الحاجات كلها تسعى إليها الأمم. فإن أباكم السماوي يعلم حاجتكم إلى هذه كلها."]]}, {"l": "Luk 12:30", "n": "", "vs": [[30, "فهذه الحاجات كلها تسعى إليها أمم العالم، وأبوكم يعلم أنكم تحتاجون إليها."]]}, {"l": "Luk 12:32", "n": "", "vs": [[32, "لا تخافوا، أيها القطيع الصغير، لأن أباكم قد سر أن يعطيكم الملكوت."]]}, {"l": "Joh 20:17", "n": "", "vs": [[17, "فقال لها: «لا تمسكي بي! فإني لم أصعد بعد إلى الآب، بل اذهبي إلى إخوتي وقولي لهم: إني سأصعد إلى أبي وأبيكم، وإلهي وإلهكم!»"]]}, {"l": "2Co 6:18", "n": "", "vs": [[18, "فأقبلكم، وأكون لكم أبا، وتكونوا لي بنين وبنات»، هذا يقوله الرب القادر على كل شيء."]]}, {"l": "Col 1:2", "n": "", "vs": [[2, "إلى الإخوة القديسين والأمناء في المسيح، المقيمين في مدينة كولوسي. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."]]}, {"l": "1Jo 3:1", "n": "", "vs": [[1, "تأملوا ما أعظم المحبة التي أحبنا بها الآب حتى صرنا ندعى «أولاد الله»، ونحن أولاده حقا. ولكن، بما أن أهل العالم لا يعرفون الله، فهم لا يعرفوننا."]]}], "kwAr": "ليت الله أبانا نفسه", "noteAr": ""}, {"kw": "and our Lord", "raw": "Rom_1:3; 2Th_2:16", "note": "", "refs": [{"l": "Rom 1:3", "n": "", "vs": [[3, "وهو يختص بابنه الذي جاء من نسل داود من الناحية البشرية؛"]]}, {"l": "2Th 2:16", "n": "", "vs": [[16, "وليت ربنا يسوع المسيح نفسه، والله أبانا، الذي أحبنا ووهبنا بنعمته راحة أبدية ورجاء صالحا،"]]}], "kwAr": "وربنا يسوع المسيح", "noteAr": ""}, {"kw": "direct", "raw": "or, guide", "note": "or, guide", "refs": [], "kwAr": "يسهل", "noteAr": "أو: يرشد (يقود)."}, {"kw": "our way", "raw": "Ezr_8:21-23; Pro_3:5, Pro_3:6; Mar_1:3", "note": "", "refs": [{"l": "Ezr 8:21-23", "n": "", "vs": [[21, "وناديت عند نهر أهوا بصوم لنتذلل أمام إلهنا ليشملنا برعايته نحن وأطفالنا وأموالنا في أثناء رحلتنا،"], [22, "لأنني خجلت أن أطلب من الملك أن ينجدنا بجيش وفرسان لحمايتنا في الطريق من الأعداء، لأننا كنا قد قلنا للملك: إن يد إلهنا ترعى طالبيه للخير، وينصب سخطه العظيم على كل من يتركه."], [23, "وبعد أن صمنا وابتهلنا إلى إلهنا استجاب لنا."]]}, {"l": "Pro 3:5", "n": "", "vs": [[5, "اتكل على الرب من كل قلبك، وعلى فطنتك لا تعتمد."]]}, {"l": "Pro 3:6", "n": "", "vs": [[6, "اعرف الرب في كل طرقك وهو يقوم سبلك."]]}, {"l": "Mar 1:3", "n": "", "vs": [[3, "صوت مناد في البرية: أعدوا طريق الرب، واجعلوا سبله مستقيمة!»"]]}], "kwAr": "الطريق إليكم", "noteAr": ""}], "arS": [["ليت ", []], ["الله", ["G2316"]], [" ", []], ["أبانا", ["G3962", "G2257"]], [" ", []], ["نفسه", ["G846"]], ["، ", []], ["وربنا", ["G2962", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], ["، ", []], ["يسهل", ["G2720"]], [" أمامنا ", []], ["الطريق", ["G3598"]], [" إليكم.", []]]}, {"c": 3, "v": 12, "text": "وليجعلكم الرب تنمون وتفيضون في المحبة لتحبوا بعضكم بعضا وجميع الناس كمحبتنا لكم،", "groups": [{"kw": "the Lord", "raw": "1Th_4:10; Psa_115:4; Luk_17:5; 2Co_9:10; Jam_1:17; 2Pe_3:18", "note": "", "refs": [{"l": "1Th 4:10", "n": "", "vs": [[10, "ولأنكم أيضا هكذا تعاملون جميع الإخوة في مقاطعة مقدونية كلها. وإنما نحرضكم، أيها الإخوة، أن تضاعفوا ذلك أكثر فأكثر،"]]}, {"l": "Psa 115:4", "n": "", "vs": [[4, "أما أوثانهم فهي فضة وذهب من صنع أيدي البشر."]]}, {"l": "Luk 17:5", "n": "", "vs": [[5, "وقال الرسل للرب: «زدنا إيمانا!»"]]}, {"l": "2Co 9:10", "n": "", "vs": [[10, "والذي يقدم بذارا للزارع، وخبزا للأكل، سيقدم لكم بذاركم ويكثره ويزيد أثمار بركم:"]]}, {"l": "Jam 1:17", "n": "", "vs": [[17, "إن كل عطية صالحة وهبة كاملة إنما تنزل من فوق، من لدن أبي الأنوار الذي ليس فيه تحول، ولا ظل لأنه لا يدور."]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}], "kwAr": "الرب", "noteAr": ""}, {"kw": "abound", "raw": "1Th_4:9, 1Th_4:10; Phi_1:9; 2Th_1:3", "note": "", "refs": [{"l": "1Th 4:9", "n": "", "vs": [[9, "أما المحبة الأخوية، فلستم في حاجة لأن أكتب إليكم عنها، لأنكم بأنفسكم قد تعلمتم من الله أن تحبوا بعضكم بعضا،"]]}, {"l": "1Th 4:10", "n": "", "vs": [[10, "ولأنكم أيضا هكذا تعاملون جميع الإخوة في مقاطعة مقدونية كلها. وإنما نحرضكم، أيها الإخوة، أن تضاعفوا ذلك أكثر فأكثر،"]]}, {"l": "Phi 1:9", "n": "", "vs": [[9, "وصلاتي لأجلكم هي هذه: أن تزداد محبتكم أكثر فأكثر في تمام المعرفة والإدراك،"]]}, {"l": "2Th 1:3", "n": "", "vs": [[3, "من واجبنا أن نشكر الله على الدوام لأجلكم أيها الإخوة. كما أن هذا حق: لأن إيمانكم ينمو نموا فائقا، ومحبة أحدكم للآخر تفيض بينكم جميعا."]]}], "kwAr": "وتفيضون", "noteAr": ""}, {"kw": "love", "raw": "1Th_5:15; Mat_7:12, Mat_22:39; Rom_13:8; 1Co_13:1-13; Gal_5:6, Gal_5:13, Gal_5:14, Gal_5:22; 2Pe_1:7; 1Jo_3:11-19, 1Jo_4:7-16", "note": "", "refs": [{"l": "1Th 5:15", "n": "", "vs": [[15, "حذار أن يبادل أحدكم شر غيره بشر مثله بل اسعوا دائما إلى الخير في معاملتكم بعضكم لبعض وللآخرين جميعا."]]}, {"l": "Mat 7:12", "n": "", "vs": [[12, "إذن، كل ما تريدون أن يعاملكم الناس به، فعاملوهم أنتم به أيضا: هذه خلاصة تعليم الشريعة والأنبياء."]]}, {"l": "Mat 22:39", "n": "", "vs": [[39, "والثانية مثلها: أحب قريبك كنفسك!"]]}, {"l": "Rom 13:8", "n": "", "vs": [[8, "لا تكونوا في دين لأحد، إلا بأن يحب بعضكم بعضا. فإن من يحب غيره، يكون قد تمم الشريعة،"]]}, {"l": "1Co 13:1-13", "n": "", "vs": [[1, "... لو كنت أتكلم بلغات الناس والملائكة وليس عندي محبة، لما كنت إلا نحاسا يطن وصنجا يرن!"], [2, "ولو كانت لي موهبة النبوءة، وكنت عالما بجميع الأسرار والعلم كله، وكان عندي الإيمان كله حتى أنقل الجبال، وليس عندي محبة، فلست شيئا!"], [3, "ولو قدمت أموالي كلها للإطعام، وسلمت جسدي لأحرق، وليس عندي محبة، لما كنت أنتفع شيئا."], [4, "المحبة تصبر طويلا؛ وهي لطيفة. المحبة لا تحسد. المحبة لا تتفاخر ولا تتكبر."], [5, "لا تتصرف بغير لياقة، ولا تسعى إلى مصلحتها الخاصة. لا تستفز سريعا، ولا تنسب الشر لأحد."], [6, "لا تفرح بالظلم، بل تفرح بالحق."], [7, "إنها تستر كل شيء، وتصدق كل شيء، وترجو كل شيء، وتتحمل كل شيء."], [8, "المحبة لا تزول أبدا. أما مواهب النبوآت فستزال، ومواهب اللغات ستنقطع، والمعرفة ستزال."], [9, "فإن معرفتنا جزئية ونبوءتنا جزئية."], [10, "ولكن، عندما يأتي ما هو كامل، يزال ما هو جزئي."], [11, "فلما كنت طفلا، كنت أتكلم كالطفل، وأشعر كالطفل، وأفكر كالطفل. ولكن، لما صرت رجلا، أبطلت ما يخص الطفل."], [12, "ونحن الآن ننظر إلى الأمور من خلال زجاج قاتم فنراها بغموض. إلا أننا سنراها أخيرا مواجهة. الآن، أعرف معرفة جزئية. ولكني، عندئذ، سأعرف مثلما عرفت."], [13, "أما الآن، فهذه الثلاثة باقية: الإيمان، والرجاء، والمحبة. ولكن أعظمها هي المحبة!"]]}, {"l": "Gal 5:6", "n": "", "vs": [[6, "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة."]]}, {"l": "Gal 5:13", "n": "", "vs": [[13, "فإنما إلى الحرية قد دعيتم، أيها الإخوة؛ ولكن لا تتخذوا من الحرية ذريعة لإرضاء الجسد، بل بالمحبة كونوا عبيدا في خدمة أحدكم الآخر."]]}, {"l": "Gal 5:14", "n": "", "vs": [[14, "فإن الشريعة كلها تتم في وصية واحدة: «أن تحب قريبك كنفسك»."]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "2Pe 1:7", "n": "", "vs": [[7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."]]}, {"l": "1Jo 3:11-19", "n": "", "vs": [[11, "فالوصية التي سمعتموها منذ البداية، هي أن يحب بعضنا بعضا،"], [12, "لا أن نكون مثل قايين الذي قتل أخاه. فقايين كان من أولاد إبليس الشرير. ولماذا قتل أخاه؟ قتله لأن أعماله هو كانت شريرة، أما أعمال أخيه فكانت صالحة."], [13, "إذن، ياإخوتي، لا تتعجبوا إن كان أهل العالم يبغضونكم!"], [14, "إن محبتنا لإخوتنا تبين لنا أننا انتقلنا من الموت إلى الحياة. فالذي لا يحب إخوته، فهو باق في الموت."], [15, "وكل من يبغض أخا له، فهو قاتل. وأنتم تعرفون أن القاتل لا تكون له حياة أبدية ثابتة فيه."], [16, "ومقياس المحبة هو العمل الذي قام به المسيح إذ بذل حياته لأجلنا. فعلينا نحن أيضا أن نبذل حياتنا لأجل إخوتنا."], [17, "وأما الذي يملك مالا يمكنه من العيش في بحبوحة، ويقسي قلبه على أحد الإخوة المحتاجين، فكيف تكون محبة الله متأصلة فيه؟"], [18, "أيها الأولاد الصغار، لا يجب أن تكون محبتنا مجرد ادعاء بالكلام واللسان، بل تكون محبة عملية حقة."], [19, "عندئذ نتأكد أننا نتصرف بحسب الحق، وتطمئن نفوسنا في حضرة الله،"]]}, {"l": "1Jo 4:7-16", "n": "", "vs": [[7, "أيها الأحباء، لنحب بعضنا بعضا: لأن المحبة تصدر من الله. إذن، كل من يحب، يكون مولودا من الله ويعرف الله ."], [8, "أما من لا يحب، فهو لم يتعرف بالله قط لأن الله محبة!"], [9, "وقد أظهر الله محبته لنا إذ أرسل ابنه الأوحد إلى العالم لكي نحيا به."], [10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."], [11, "ومادام الله قد أحبنا هذه المحبة العظيمة، أيها الأحباء، فعلينا نحن أيضا أن نحب بعضنا بعضا."], [12, "إن الله لم يره أحد من الناس قط. ولكن، حين نحب بعضنا بعضا، نبين أن الله يحيا في داخلنا، وأن محبته قد اكتملت في داخلنا."], [13, "وما يؤكد لنا أننا نثبت في الله، وأنه يثبت فينا هو أنه وهب لنا من روحه."], [14, "ونحن أنفسنا نشهد أن الآب قد أرسل الابن مخلصا للعالم، لأننا رأيناه بعيوننا."], [15, "من يعترف بأن يسوع هو ابن الله، فإن الله يثبت فيه، وهو يثبت في الله،"], [16, "ونحن أنفسنا اختبرنا المحبة التي خصنا الله بها، ووضعنا ثقتنا فيها. إن الله محبة. ومن يثبت في المحبة، فإنه يثبت في الله، والله يثبت فيه."]]}], "kwAr": "في المحبة", "noteAr": ""}, {"kw": "even", "raw": "1Th_2:8", "note": "", "refs": [{"l": "1Th 2:8", "n": "", "vs": [[8, "وإذ كان حنونا عليكم شديدا، ارتضينا أن نقدم إليكم لا إنجيل الله فقط بل أنفسنا أيضا، لأنكم صرتم محبوبين لدينا."]]}], "kwAr": "كمحبتنا لكم", "noteAr": ""}], "arS": [["وليجعلكم ", []], ["الرب", ["G2962"]], [" ", []], ["تنمون", ["G4121"]], [" ", []], ["وتفيضون", ["G4052"]], [" في ", []], ["المحبة", ["G26"]], [" لتحبوا ", []], ["بعضكم بعضا", ["G240"]], [" ", []], ["وجميع", ["G3956"]], [" الناس كمحبتنا لكم،", []]]}, {"c": 3, "v": 13, "text": "حتى تتثبت قلوبكم بغير لوم في القداسة أمام إلهنا وأبينا عندما يظهر ربنا يسوع عائدا مع جميع قديسيه.", "groups": [{"kw": "he may", "raw": "1Th_5:23; Rom_14:4, Rom_16:25; 1Co_1:8; Phi_1:10; 2Th_2:16, 2Th_2:17; 1Pe_5:10; 1Jo_3:20,1Jo_3:21", "note": "", "refs": [{"l": "1Th 5:23", "n": "", "vs": [[23, "وإله السلام نفسه يقدسكم إلى التمام ويحفظكم سالمين، روحا ونفسا وجسدا، لتكونوا بلا لوم عند عودة ربنا يسوع المسيح."]]}, {"l": "Rom 14:4", "n": "", "vs": [[4, "فمن أنت لتدين خادم غيرك؟ إنه في نظر سيده يثبت أو يسقط. ولسوف يثبت، لأن الرب قادر أن يثبته."]]}, {"l": "Rom 16:25", "n": "", "vs": [[25, "والمجد للقادر أن يثبتكم، وفقا لإنجيلي وللبشارة بيسوع المسيح، ووفقا لإعلان ما كان سرا ظل مكتوما مدى الأزمنة الأزلية،"]]}, {"l": "1Co 1:8", "n": "", "vs": [[8, "وهو نفسه سيحفظكم ثابتين إلى النهاية حتى تكونوا بلا عيب في يوم ربنا يسوع المسيح."]]}, {"l": "Phi 1:10", "n": "", "vs": [[10, "لكي تستحسنوا الأمور الممتازة، حتى تكونوا طاهرين وخالين من العثرات إلى يوم المسيح،"]]}, {"l": "2Th 2:16", "n": "", "vs": [[16, "وليت ربنا يسوع المسيح نفسه، والله أبانا، الذي أحبنا ووهبنا بنعمته راحة أبدية ورجاء صالحا،"]]}, {"l": "2Th 2:17", "n": "", "vs": [[17, "يشجع قلوبكم ويرسخكم في كل عمل صالح وقول حسن!"]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}, {"l": "1Jo 3:20", "n": "", "vs": [[20, "ولو لامتنا قلوبنا؛ فإن الله أعظم من قلوبنا، وهو العليم بكل شيء."]]}, {"l": "1Jo 3:21", "n": "", "vs": [[21, "أيها الأحباء، إذا كانت ضمائرنا لا تلومنا. فهذا دليل على أن لنا ثقة عظيمة من نحو الله."]]}], "kwAr": "حتى تتثبت قلوبكم", "noteAr": ""}, {"kw": "unblameable", "raw": "Eph_5:27; Col_1:22; 1Jo_3:20,1Jo_3:21; Jud_1:24", "note": "", "refs": [{"l": "Eph 5:27", "n": "", "vs": [[27, "حتى يزفها إلى نفسه كنيسة بهية لا يشوبها عيب أو تجعد أو أية نقيصة مشابهة بل تكون مقدسة خالية من العيوب."]]}, {"l": "Col 1:22", "n": "", "vs": [[22, "قد صالحكم الآن في جسد بشرية (ابنه) بالموت. وذلك لكي يحضركم فتمثلوا أمامه وأنتم قديسون بلا ذنب ولا لوم."]]}, {"l": "1Jo 3:20", "n": "", "vs": [[20, "ولو لامتنا قلوبنا؛ فإن الله أعظم من قلوبنا، وهو العليم بكل شيء."]]}, {"l": "1Jo 3:21", "n": "", "vs": [[21, "أيها الأحباء، إذا كانت ضمائرنا لا تلومنا. فهذا دليل على أن لنا ثقة عظيمة من نحو الله."]]}, {"l": "Jud 1:24", "n": "", "vs": [[24, "وللقادر أن يحرسكم من السقوط حتى يوصلكم إلى المثول أمامه في المجد مبتهجين ولا عيب فيكم …"]]}], "kwAr": "بغير لوم", "noteAr": ""}, {"kw": "before", "raw": "1Th_3:11", "note": "", "refs": [{"l": "1Th 3:11", "n": "", "vs": [[11, "ليت الله أبانا نفسه، وربنا يسوع المسيح، يسهل أمامنا الطريق إليكم."]]}], "kwAr": "أمام إلهنا وأبينا", "noteAr": ""}, {"kw": "at the", "raw": "1Th_2:19, 1Th_4:15, 1Th_5:23; 1Co_1:7, 1Co_15:23; 2Th_2:1", "note": "", "refs": [{"l": "1Th 2:19", "n": "", "vs": [[19, "فما هو رجاؤنا أو فرحنا أو إكليل افتخارنا أمام ربنا يسوع عند عودته؟ أليس أنتم؟ بلى،"]]}, {"l": "1Th 4:15", "n": "", "vs": [[15, "فهذا نقوله لكم بكلمة من عند الرب: إننا نحن الباقين أحياء إلى حين عودة الرب، لن نسبق الراقدين."]]}, {"l": "1Th 5:23", "n": "", "vs": [[23, "وإله السلام نفسه يقدسكم إلى التمام ويحفظكم سالمين، روحا ونفسا وجسدا، لتكونوا بلا لوم عند عودة ربنا يسوع المسيح."]]}, {"l": "1Co 1:7", "n": "", "vs": [[7, "حتى إنكم لا تحتاجون بعد إلى أية موهبة فيما تتوقعون ظهور ربنا يسوع المسيح علنا."]]}, {"l": "1Co 15:23", "n": "", "vs": [[23, "على أن لكل واحد رتبته: فأولا المسيح بصفته البكر؛ وبعده خاصته لدى رجوعه،"]]}, {"l": "2Th 2:1", "n": "", "vs": [[1, "ولكن بالنسبة إلى رجوع ربنا يسوع المسيح واجتماعنا إليه معا، نرجو منكم أيها الإخوة"]]}], "kwAr": "عندما يظهر ربنا يسوع", "noteAr": ""}, {"kw": "with", "raw": "Deu_33:2; Zec_14:5; 2Th_1:10; Jud_1:14", "note": "", "refs": [{"l": "Deu 33:2", "n": "", "vs": [[2, "فقال: «أقبل الرب من سيناء، وأشرف عليهم من سعير، وتألق في جبل فاران؛ جاء محاطا بعشرات الألوف من الملائكة وعن يمينه يومض برق عليهم."]]}, {"l": "Zec 14:5", "n": "", "vs": [[5, "ويهربون من خلال وادي جبالي الممتد إلى آصل. تهربون كما هربتم من الزلزلة في أيام حكم عزيا ملك يهوذا، ويأتي الرب إلهي في موكب من جميع قديسيه."]]}, {"l": "2Th 1:10", "n": "", "vs": [[10, "عندما يعود في ذلك اليوم ليتمجد في قديسيه ويكون موضع العجب عند جميع الذين آمنوا، وأنتم قد آمنتم بشهادتنا لكم!"]]}, {"l": "Jud 1:14", "n": "", "vs": [[14, "عن هؤلاء وأمثالهم، تنبأ أخنوخ السابع بعد آدم، فقال: «انظروا إن الرب آت بصحبة عشرات الألوف من قديسيه،"]]}], "kwAr": "مع جميع قديسيه", "noteAr": ""}], "arS": [["حتى ", []], ["تتثبت", ["G4741"]], [" ", []], ["قلوبكم", ["G2588", "G5216"]], [" ", []], ["بغير لوم", ["G273"]], [" في ", []], ["القداسة", ["G42"]], [" ", []], ["أمام", ["G1715"]], [" ", []], ["إلهنا", ["G2316"]], [" ", []], ["وأبينا", ["G3962", "G2257"]], [" عندما يظهر ", []], ["ربنا", ["G2962", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [" عائدا مع ", []], ["جميع", ["G3956"]], [" ", []], ["قديسيه", ["G40"]], [".", []]]}, {"c": 4, "v": 1, "text": "وبعد، أيها الإخوة، فمثلما تلقيتم منا كيف يجب أن تسلكوا سلوكا يرضي الله ، وكما أنتم فاعلون، نرجو منكم ونحرضكم في الرب يسوع أن تضاعفوا تقدمكم في ذلك أكثر فأكثر.", "groups": [{"kw": "we", "raw": "1Th_2:11; Rom_12:1; 2Co_6:1, 2Co_10:1; Eph_4:1; Phm_1:9, Phm_1:10; Heb_13:22", "not
