ت لأجل القديسين جميعا،"]]}, {"l": "Col 4:2", "n": "", "vs": [[2, "داوموا على الصلاة، متيقظين فيها بالشكر،"]]}, {"l": "1Pe 4:7", "n": "", "vs": [[7, "إن نهاية كل شيء قد صارت قريبة. فتعقلوا إذن، وكونوا متنبهين لرفع الصلاة دائما."]]}], "kwAr": "صلوا دون انقطاع", "noteAr": ""}], "arS": [["صلوا", ["G4336"]], [" دون ", []], ["انقطاع", ["G89"]], ["؛", []]]}, {"c": 5, "v": 18, "text": "ارفعوا الشكر في كل حال: فهذه هي مشيئة الله لكم في المسيح يسوع.", "groups": [{"kw": "every", "raw": "Eph_5:20; Phi_4:6; Col_3:17; Job_1:21; Psa_34:1; Heb_13:15", "note": "", "refs": [{"l": "Eph 5:20", "n": "", "vs": [[20, "رافعين الشكر كل حين وعلى كل شيء لله والآب، باسم ربنا يسوع المسيح؛"]]}, {"l": "Phi 4:6", "n": "", "vs": [[6, "لا تقلقوا من جهة أي شيء، بل في كل أمر لتكن طلباتكم معروفة لدى الله، بالصلاة والدعاء، مع الشكر."]]}, {"l": "Col 3:17", "n": "", "vs": [[17, "ومهما كان ما تعملونه، بالقول أو بالفعل، فليجر كل شيء باسم الرب يسوع، رافعين به الشكر لله الآب."]]}, {"l": "Job 1:21", "n": "", "vs": [[21, "وقال: «عريانا خرجت من بطن أمي وعريانا أعود إلى هناك. الرب أعطى والرب أخذ، فليكن اسم الرب مباركا»."]]}, {"l": "Psa 34:1", "n": "", "vs": [[1, "أبارك الرب في كل حين. تسبيحه دائما في فمي."]]}, {"l": "Heb 13:15", "n": "", "vs": [[15, "فبالمسيح، رئيس كهنتنا، لنقرب لله دائما ذبيحة الحمد والتسبيح، أي الثمار التي تنتجها أفواهنا المعترفة باسمه."]]}], "kwAr": "ارفعوا الشكر في كل حال", "noteAr": ""}, {"kw": "for", "raw": "1Th_4:3; 1Pe_2:15, 1Pe_4:2; 1Jo_2:17", "note": "", "refs": [{"l": "1Th 4:3", "n": "", "vs": [[3, "فإن مشيئة الله هي هذه: قداستكم. وذلك بأن تمتنعوا عن الزنى،"]]}, {"l": "1Pe 2:15", "n": "", "vs": [[15, "فإن هذه هي إرادة الله: أن تفعلوا الخير دائما، فتفحموا جهالة الناس الأغبياء!"]]}, {"l": "1Pe 4:2", "n": "", "vs": [[2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."]]}, {"l": "1Jo 2:17", "n": "", "vs": [[17, "وسوف يزول العالم، وما فيه من شهوات أما الذي يعمل بإرادة الله، فيبقى إلى الأبد!"]]}], "kwAr": "فهذه هي مشيئة الله", "noteAr": ""}], "arS": [["ارفعوا ", []], ["الشكر", ["G2168"]], [" في ", []], ["كل", ["G3956"]], [" حال: فهذه هي ", []], ["مشيئة", ["G2307"]], [" ", []], ["الله", ["G2316"]], [" لكم في ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [".", []]]}, {"c": 5, "v": 19, "text": "لا تخمدوا الروح،", "groups": [{"kw": "Quench", "raw": "Son_8:7; Eph_4:30, Eph_6:16", "note": "", "refs": [{"l": "Son 8:7", "n": "", "vs": [[7, "لا يمكن للمياه الغزيرة أن تخمد المحبة، ولا تستطيع السيول أن تغمرها. لو بذل الإنسان كل ثروة بيته ثمنا للمحبة لاحتقرت أشد الاحتقار."]]}, {"l": "Eph 4:30", "n": "", "vs": [[30, "ولا تحزنوا روح الله، الروح القدس الذي به ختمتم ليوم الفداء."]]}, {"l": "Eph 6:16", "n": "", "vs": [[16, "وفوق هذا كله، احملوا الإيمان ترسا به تقدرون أن تطفئوا جميع سهام الشرير المشتعلة."]]}], "kwAr": "لا تخمدوا", "noteAr": ""}, {"kw": "the Spirit", "raw": "Gen_6:3; 1Sa_16:4; Neh_9:30; Psa_51:11; Isa_63:10; Act_7:51; 1Co_14:30; Eph_4:30; 1Ti_4:14; 2Ti_1:6", "note": "", "refs": [{"l": "Gen 6:3", "n": "", "vs": [[3, "فقال الرب: «لن يمكث روحي مجاهدا في الإنسان إلى الأبد. هو بشري زائغ، لذلك لن تطول أيامه أكثر من مئة وعشرين سنة فقط»."]]}, {"l": "1Sa 16:4", "n": "", "vs": [[4, "ففعل صموئيل بموجب ما تكلم به الرب. وذهب إلى بيت لحم. فاضطرب شيوخ المدينة لدى استقباله وقالوا له: «هل للسلام حضرت؟»"]]}, {"l": "Neh 9:30", "n": "", "vs": [[30, "لقد تحملتهم سنين كثيرة، وحذرتهم بروحك على لسان أنبيائك فلم يصغوا، فأسلمتهم لعبودية أمم البلاد."]]}, {"l": "Psa 51:11", "n": "", "vs": [[11, "لا تطردني من حضرتك، ولا تنزع مني روحك القدوس."]]}, {"l": "Isa 63:10", "n": "", "vs": [[10, "لكنهم تمردوا وأحزنوا روحه فاستحال إلى عدو لهم وحاربهم بنفسه."]]}, {"l": "Act 7:51", "n": "", "vs": [[51, "ثم قال استفانوس: «ياأصحاب الرقاب الصلبة والقلوب والآذان غير المختونة! إنكم دائما تقاومون الروح القدس. وكما فعل آباؤكم تفعلون!"]]}, {"l": "1Co 14:30", "n": "", "vs": [[30, "وإن أوحي إلى أحد من الجالسين، فليسكت المتكلم الأول."]]}, {"l": "Eph 4:30", "n": "", "vs": [[30, "ولا تحزنوا روح الله، الروح القدس الذي به ختمتم ليوم الفداء."]]}, {"l": "1Ti 4:14", "n": "", "vs": [[14, "لا تهمل الموهبة الخاصة التي فيك والتي أعطيت لك بالتنبوء ووضع الشيوخ أيديهم عليك."]]}, {"l": "2Ti 1:6", "n": "", "vs": [[6, "لهذا السبب أنبهك أن تلهب نار موهبة الله التي فيك بوضع يدي عليك."]]}], "kwAr": "الروح", "noteAr": ""}], "arS": [["لا ", []], ["تخمدوا", ["G4570"]], [" ", []], ["الروح", ["G4151"]], ["،", []]]}, {"c": 5, "v": 20, "text": "لا تحتقروا النبوءات؛", "groups": [{"kw": "", "raw": "1Th_4:8; Num_11:25-29; 1Sa_10:5, 1Sa_10:6, 1Sa_10:10-13, 1Sa_19:20-24; Act_19:6; 1Co_11:4; 1Co_12:10,1Co_12:28, 1Co_13:2, 1Co_13:9, 1Co_14:1, 1Co_14:3-6, 1Co_14:22-25, 1Co_14:29-32, 1Co_14:37-39; Eph_4:11, Eph_4:12; Rev_11:3-11", "note": "", "refs": [{"l": "1Th 4:8", "n": "", "vs": [[8, "إذن، من استخف بأخيه في هذا الأمر، يستخف لا بإنسان بل بالله، بذاك الذي وهبكم فعلا روحه القدوس."]]}, {"l": "Num 11:25-29", "n": "", "vs": [[25, "فنزل الرب في سحابة وخاطبه، وأخذ من الروح الحال عليه ووضعه على السبعين رئيسا. فلما حل عليهم الروح تنبأوا لفترة وتوقفوا."], [26, "وكان قد بقي اثنان من الشيوخ المسجلين بين السبعين في المخيم لم يأتيا إلى الخيمة، اسم أحدهما ألداد، واسم الآخر ميداد. فحل عليهما الروح فتنبآ في المخيم."], [27, "فأسرع أحد الشبان وأخبر موسى بذلك،"], [28, "فقال يشوع بن نون، مساعد موسى منذ حداثته: «ياسيدي، امنعهما!»"], [29, "غير أن موسى قال له: «هل ملأتك غيرة علي؟ ليت كل شعب الرب يصبحون أنبياء يحل عليهم الرب بروحه»."]]}, {"l": "1Sa 10:5", "n": "", "vs": [[5, "بعد ذلك تصل إلى تل الله في جبعة حيث تعسكر حامية للفلسطينيين. فتصادفك عند مدخل جبعة مجموعة من الأنبياء نازلين من التل يعزفون على الرباب والدف والناي والعود وهم يتنبأون،"]]}, {"l": "1Sa 10:6", "n": "", "vs": [[6, "فيحل عليك روح الرب فتتنبأ معهم وتصير رجلا آخر."]]}, {"l": "1Sa 10:10-13", "n": "", "vs": [[10, "وعندما وصل جبعة قابلته مجموعة من الأنبياء، فحل عليه روح الله وتنبأ في وسطهم."], [11, "وحين شاهده الذين كانوا يعرفونه من قبل يتنبأ، تساءلوا فيما بينهم: «ماذا جرى لابن قيس؟ أشاول أيضا بين الأنبياء؟»"], [12, "فأجاب رجل من المقيمين هناك: «ومن هو أبو الأنبياء؟» وهكذا صار القول: «أشاول أيضا بين الأنبياء» مثلا."], [13, "ولما فرغ من التنبوء، صعد إلى المرتفع،"]]}, {"l": "1Sa 19:20-24", "n": "", "vs": [[20, "فبعث بجنود للقبض عليه. ولكن عندما شاهدوا جماعة الرب يتنبأون برئاسة صموئيل، حل روح الرب على الجنود فتنبأوا هم أيضا."], [21, "فأخبروا شاول بالأمر، فبعث بجنود آخرين فتنبأوا هم أيضا. ثم عاد شاول فأرسل فرقة ثالثة فتنبأوا هم أيضا."], [22, "وأخيرا ذهب بنفسه إلى الرامة، حتى وصل إلى البئر العظيمة التي عند سيخو وسأل: «أين صموئيل وداود؟» فقيل له: «هما في نايوت في الرامة»."], [23, "فمضى إلى هناك ولكن في أثناء الطريق حل عليه روح الرب، فشرع يتنبأ حتى بلغ نايوت في الرامة."], [24, "فخلع هو أيضا ثيابه وراح يتنبأ أمام صموئيل، ثم انطرح عاريا طول ذلك النهار والليل، لذلك قيل: «أشاول أيضا بين الأنبياء؟»."]]}, {"l": "Act 19:6", "n": "", "vs": [[6, "وما إن وضع بولس يديه عليهم حتى حل عليهم الروح القدس، وأخذوا يتكلمون بلغات أخرى ويتنبأون."]]}, {"l": "1Co 11:4", "n": "", "vs": [[4, "فكل رجل يصلي أو يتنبأ، وعلى رأسه غطاء، يجلب العار على رأسه."]]}, {"l": "1Co 12:10", "n": "", "vs": [[10, "وآخر عمل المعجزات، وآخر النبوءة وآخر التمييز بين الأرواح، وآخر التكلم بلغات مختلفة (لم يتعلمها)، وآخر ترجمة اللغات تلك."]]}, {"l": "1Co 12:28", "n": "", "vs": [[28, "وقد رتب الله في الكنيسة أشخاصا مخصوصين: أولا الرسل، ثانيا الأنبياء، ثالثا المعلمين، وبعد ذلك أصحاب المواهب المعجزية أو مواهب الشفاء أو إعانة الآخرين أو تدبير الشؤون أو التكلم باللغات المختلفة."]]}, {"l": "1Co 13:2", "n": "", "vs": [[2, "ولو كانت لي موهبة النبوءة، وكنت عالما بجميع الأسرار والعلم كله، وكان عندي الإيمان كله حتى أنقل الجبال، وليس عندي محبة، فلست شيئا!"]]}, {"l": "1Co 13:9", "n": "", "vs": [[9, "فإن معرفتنا جزئية ونبوءتنا جزئية."]]}, {"l": "1Co 14:1", "n": "", "vs": [[1, "اسعوا وراء المحبة، وتشوقوا إلى المواهب الروحية، بل بالأحرى موهبة التنبوء."]]}, {"l": "1Co 14:3-6", "n": "", "vs": [[3, "أما الذي يتنبأ، فهو يخاطب الناس بكلام البنيان والتشجيع والتعزية."], [4, "فالذي يتكلم بلغة مجهولة يبني نفسه؛ وأما الذي يتنبأ، فيبني الكنيسة."], [5, "إني أرغب في أن تتكلموا جميعا بلغات مجهولة، ولكن بالأحرى أن تتنبأوا. فإن من يتنبأ أفضل ممن يتكلم باللغات إلا إذا ترجم (ما يقوله) لتنال الكنيسة بنيانا."], [6, "والآن، أيها الإخوة، افرضوا أني جئتكم متكلما بلغات مجهولة، فأية منفعة تنالون مني، إلا إذا كلمتكم بإعلان أو علم أو نبوءة أو تعليم؟"]]}, {"l": "1Co 14:22-25", "n": "", "vs": [[22, "إذن التكلم بلغات مجهولة هو علامة لا لأجل الذين يؤمنون، بل لأجل غير المؤمنين. وأما التنبؤ، فليس لغير المؤمنين، بل للذين يؤمنون."], [23, "فإن اجتمعت الكنيسة كلها معا، وأخذ الجميع يتكلمون بلغات مجهولة، ثم دخل بعض قليلي الخبرة أو غير المؤمنين، أفلا يقولون إنكم مجانين؟"], [24, "ولكن، إن كان الجميع يتنبأون، ثم دخل واحد من غير المؤمنين أو قليلي الخبرة، فإنه يقتنع من الجميع، ويحكم عليه من قبل الجميع،"], [25, "وإذ تنكشف خبايا قلبه، يخر على وجهه ساجدا لله، معترفا بأن الله فيكم حقا."]]}, {"l": "1Co 14:29-32", "n": "", "vs": [[29, "وليتكلم أيضا اثنان أو ثلاثة من المتنبئين وليحكم الآخرون."], [30, "وإن أوحي إلى أحد من الجالسين، فليسكت المتكلم الأول."], [31, "فإنكم جميعا تقدرون أن تتنبأوا واحدا فواحدا، حتى يتعلم الجميع ويتشجع الجميع."], [32, "ولكن مواهب النبوءة هي خاضعة لأصحابها."]]}, {"l": "1Co 14:37-39", "n": "", "vs": [[37, "فإن اعتبر أحد نفسه نبيا أو صاحب موهبة روحية، فليدرك أن ما أكتبه إليكم إنما هو وصية الرب."], [38, "وإن جهل أحد هذا، فسيبقى جاهلا!"], [39, "إذن، أيها الإخوة، تشوقوا إلى التنبوء، ولا تمنعوا التكلم بلغات مجهولة."]]}, {"l": "Eph 4:11", "n": "", "vs": [[11, "وهو قد وهب البعض أن يكونوا رسلا، والبعض أنبياء، والبعض مبشرين والبعض رعاة ومعلمين،"]]}, {"l": "Eph 4:12", "n": "", "vs": [[12, "لتأهيل القديسين من جهة عمل الخدمة، لبنيان جسد المسيح،"]]}, {"l": "Rev 11:3-11", "n": "", "vs": [[3, "ولكني سأمنح شاهدي أن يتنبآ مدة ألف ومئتين وستين يوما، وهما يلبسان ثوبين من الوبر»."], [4, "هذان الشاهدان هما شجرتا الزيتون والمنارتان القائمتان أمام رب الأرض."], [5, "فإذا حاول أحد أن يمسهما بسوء تخرج نار من فمهما وتلتهم أعداءهما. ذلك يجب أن يكون مصير من يحاول أن يؤذيهما."], [6, "وللشاهدين السلطة أن يغلقا السماء فلا تمطر طيلة مدة نبوءتهما، وأن يحولا مياه الأنهار والبحار دما، وأن ينزلا البلايا بالأرض، كلما أرادا."], [7, "وعندما يكملان شهادتهما يعلن الوحش الصاعد من الهاوية الحرب عليهما، ويهزمهما ويقتلهما"], [8, "وتبقى جثتاهما مطروحتين في ساحة المدينة العظمى التي ترمز إليها «سدوم» أو «مصر»، حيث صلب ربهما."], [9, "فيراهما أناس من مختلف الشعوب والقبائل واللغات والأمم، مدة ثلاثة أيام ونصف يوم، ولا يؤذن لأحد بدفنهما."], [10, "ويشمت بهما أهل الأرض، فيفرحون كأنهم في عيد، ويتبادلون الهدايا، لأن هذين النبيين كانا قد عذباهم كثيرا."], [11, "وبعد أن تمر الأيام الثلاثة ونصف اليوم يبعث الله في النبيين روح الحياة، فينهضان واقفين، ويستولي على الناظرين إليهما خوف شديد."]]}], "kwAr": "", "noteAr": ""}], "arS": [["لا ", []], ["تحتقروا", ["G1848"]], [" ", []], ["النبوءات", ["G4394"]], ["؛", []]]}, {"c": 5, "v": 21, "text": "امتحنوا كل شيء وتمسكوا بالحسن.", "groups": [{"kw": "Prove", "raw": "Isa_8:20; Mat_7:15-20; Mar_7:14-16; Luk_12:57; Act_17:11; Rom_12:2; 1Co_2:11, 1Co_2:14, 1Co_2:15, 1Co_14:28; Eph_5:10; Phi_1:10 *marg. 1Jo_4:1; Rev_2:2", "note": "", "refs": [{"l": "Isa 8:20", "n": "", "vs": [[20, "فإلى الشريعة وإلى الشهادة: ومن لا ينطق بمثل هذا القول، فلا فجر له."]]}, {"l": "Mat 7:15-20", "n": "", "vs": [[15, "احذروا الأنبياء الدجالين الذين يأتون إليكم لابسين ثياب الحملان، ولكنهم من الداخل ذئاب خاطفة!"], [16, "من ثمارهم تعرفونهم. هل يجنى من الشوك عنب، أو من العليق تين؟"], [17, "هكذا، كل شجرة جيدة تثمر ثمرا جيدا. أما الشجرة الرديئة، فإنها تثمر ثمرا رديئا."], [18, "لا يمكن أن تثمر الشجرة الجيدة ثمرا رديئا، ولا الشجرة الرديئة ثمرا جيدا."], [19, "وكل شجرة لا تثمر ثمرا جيدا، تقطع وتطرح في النار."], [20, "إذن من ثمارهم تعرفونهم."]]}, {"l": "Mar 7:14-16", "n": "", "vs": [[14, "وإذ دعا الجمع إليه ثانية، قال لهم: «اسمعوا لي كلكم وافهموا!"], [15, "لا شيء من خارج الإنسان إذا دخله يمكن أن ينجسه. أما الأشياء الخارجة من الإنسان، فهي التي تنجسه."], [16, "من له أذنان للسمع، فليسمع»."]]}, {"l": "Luk 12:57", "n": "", "vs": [[57, "ولماذا لا تميزون ما هو حق من تلقاء أنفسكم؟"]]}, {"l": "Act 17:11", "n": "", "vs": [[11, "وكان يهود بيرية أشرف من يهود تسالونيكي، فقبلوا كلمة الله برغبة شديدة، وأخذوا يدرسون الكتاب يوميا ليتأكدوا من صحة التعليم."]]}, {"l": "Rom 12:2", "n": "", "vs": [[2, "ولا تتكيفوا مع هذا العالم، بل تغيروا بتجديد الذهن، لتميزوا ما هي إرادة الله الصالحة المقبولة الكاملة."]]}, {"l": "1Co 2:11", "n": "", "vs": [[11, "فمن من الناس يعرف ما في الإنسان إلا روح الإنسان الذي فيه؛ وكذلك فإن ما في الله أيضا لا يعرفه أحد إلا روح الله."]]}, {"l": "1Co 2:14", "n": "", "vs": [[14, "غير أن الإنسان البشري لا يتقبل أمور روح الله إذ يعتبرها جهالة، ولا يستطيع أن يعرفها لأن تمييزها إنما يحتاج إلى حس روحي."]]}, {"l": "1Co 2:15", "n": "", "vs": [[15, "أما الإنسان الروحي، فهو يميز كل شيء، ولا يحكم فيه من أحد."]]}, {"l": "1Co 14:28", "n": "", "vs": [[28, "وليترجم أحدكم. فإن لم يكن بينكم مترجم، فعلى المتكلم ألا يقول شيئا أمام الجماعة، بل أن يتحدث سرا مع نفسه ومع الله."]]}, {"l": "Eph 5:10", "n": "", "vs": [[10, "هكذا تختبرون الأمور التي ترضي الرب."]]}, {"l": "Phi 1:10", "n": "*marg.", "vs": [[10, "لكي تستحسنوا الأمور الممتازة، حتى تكونوا طاهرين وخالين من العثرات إلى يوم المسيح،"]]}, {"l": "1Jo 4:1", "n": "", "vs": [[1, "أيها الأحباء، لا تصدقوا كل روح، بل امتحنوا الأرواح لتعرفوا ما إذا كانت من عند الله أم لا، لأن عددا كبيرا من الأنبياء الدجالين قد انتشر في العالم."]]}, {"l": "Rev 2:2", "n": "", "vs": [[2, "إني عالم بأعمالك، وجهدك، وصبرك، وأعلم أنك لا تستطيع احتمال الأشرار، وأنك دققت في فحص ادعاءات أولئك الذين يزعمون أنهم رسل، وما هم برسل، فتبين لك أنهم دجالون!"]]}], "kwAr": "امتحنوا كل شيء", "noteAr": ""}, {"kw": "hold", "raw": "Deu_11:6-9, Deu_32:46, Deu_32:47; Pro_3:1, Pro_3:21-24, Pro_4:13, Pro_6:21-23, Pro_23:23; Son_3:4; Joh_8:31, Joh_15:4; Act_11:23, Act_14:22; Rom_12:9; 1Co_15:58; Phi_3:16, Phi_4:8; 2Th_2:15; 2Ti_1:15, 2Ti_3:6, 2Ti_4:14; Heb_10:23; Rev_2:25, Rev_3:3, Rev_3:11", "note": "", "refs": [{"l": "Deu 11:6-9", "n": "", "vs": [[6, "وا لتي أنزلها بداثان وأبيرام ابني أليآب من سبط رأوبين، اللذين انشقت الأرض وابتلعتهما مع عائلتيهما وخيامهما وممتلكاتهما، على مشهد كل الإسرائيليين،"], [7, "بل لكم خاصة لأن أعينكم أنتم هي التي شهدت عظائم الرب التي أجراها."], [8, "لهذا أطيعوا كل الوصايا التي أوصيتكم بها اليوم، لتكون لديكم القوة لدخول وامتلاك الأرض التي أنتم ماضون إليها لترثوها،"], [9, "ولكي تطيلوا أيامكم على الأرض التي أقسم الرب لآبائكم أن يعطيها لهم ولنسلهم، أرض تفيض لبنا وعسلا."]]}, {"l": "Deu 32:46", "n": "", "vs": [[46, "قال لهم: «تأملوا بقلوبكم في جميع هذه الكلمات التي أنا أشهد عليكم بها اليوم، لكي توصوا بها أولادكم، ليحرصوا على العمل بكلمات هذه التوراة كلها."]]}, {"l": "Deu 32:47", "n": "", "vs": [[47, "لأنها ليست كلمات لا جدوى لكم منها. إنها حياتكم وبها تعيشون طويلا في الأرض التي أنتم عابرون نهر الأردن إليها لترثوها»."]]}, {"l": "Pro 3:1", "n": "", "vs": [[1, "ياابني لا تنس تعاليمي، وليراع قلبك وصاياي."]]}, {"l": "Pro 3:21-24", "n": "", "vs": [[21, "فلا تبرح ياابني هذه من أمام عينيك واعمل بالرأي الصائب والتدبير."], [22, "فيكون هذان حياة لنفسك وقلادة تجمل عنقك."], [23, "فتسلك آنئذ في طريقك آمنا ولا تتعثر قدمك."], [24, "إذا اضطجعت لا يعتريك خوف، بل ترقد متمتعا بالنوم اللذيذ."]]}, {"l": "Pro 4:13", "n": "", "vs": [[13, "تمسك بالإرشاد ولا تطرحه. صنه لأنه حياتك."]]}, {"l": "Pro 6:21-23", "n": "", "vs": [[21, "اعقدها دائما على قلبك، وتقلد بها في عنقك،"], [22, "فتهديك كلما مشيت، وترعاك كلما نمت، وتناجيك عندما تستيقظ."], [23, "فالوصية مصباح والشريعة نور، والتوبيخ في سبيل التأديب هو طريق حياة،"]]}, {"l": "Pro 23:23", "n": "", "vs": [[23, "اقتن الحق ولا تبعه، وكذا الحكمة والتأديب والفطنة."]]}, {"l": "Son 3:4", "n": "", "vs": [[4, "وما كدت أتجاوزهم حتى وجدت من تحبه نفسي، فتشبثت به ولم أطلقه حتى أدخلته بيت أمي ومخدع من حملت بي."]]}, {"l": "Joh 8:31", "n": "", "vs": [[31, "فقال لليهود الذين آمنوا به: «إن ثبتم في كلمتي، كنتم حقا تلاميذي."]]}, {"l": "Joh 15:4", "n": "", "vs": [[4, "فاثبتوا في وأنا فيكم. كما أن الغصن لا يقدر أن ينتج ثمرا إلا إذا ثبت في الكرمة؛ فكذلك أنتم، إلا إذا ثبتم في."]]}, {"l": "Act 11:23", "n": "", "vs": [[23, "فلما وصل ورأى النعمة التي منحها الله ، امتلأ فرحا، وحث الجميع على الثبات في الرب بعزم القلب."]]}, {"l": "Act 14:22", "n": "", "vs": [[22, "وفي هذه الأماكن كلها كانا يشددان عزيمة التلاميذ، ويحثانهم على الثبات في الإيمان، مؤكدين لهم أن دخول ملكوت الله يقتضي أن نقاسي صعوبات كثيرة."]]}, {"l": "Rom 12:9", "n": "", "vs": [[9, "ولتكن المحبة بلا رياء. انفروا من الشر، والتصقوا بالخير."]]}, {"l": "1Co 15:58", "n": "", "vs": [[58, "إذن، ياإخوتي الأحباء، كونوا راسخين غير متزحزحين، كثيري الاجتهاد في عمل الرب دائما، عالمين أن جهدكم في الرب ليس عبثا!"]]}, {"l": "Phi 3:16", "n": "", "vs": [[16, "إنما، لنواصل السير من حيث قد وصلنا، في المنهج نفسه."]]}, {"l": "Phi 4:8", "n": "", "vs": [[8, "وختاما، أيها الإخوة: كل ما كان حقا، وكل ما كان شريفا، وكل ما كان عادلا، وكل ما كان طاهرا وكل ما كان مستحبا، وكل ما كان حسن السمعة، وكل ما كان فيه فضيلة وخصلة حميدة، فاشغلوا أفكاركم به."]]}, {"l": "2Th 2:15", "n": "", "vs": [[15, "فاثبتوا إذن، أيها الإخوة، وتمسكوا بالتعاليم التي تلقيتم منا، سواء كان بالكلام أم برسالتنا."]]}, {"l": "2Ti 1:15", "n": "", "vs": [[15, "أنت على علم بأن معاوني الذين في مقاطعة أسيا، ومنهم فيجلس وهرموجينس، قد تخلوا عني."]]}, {"l": "2Ti 3:6", "n": "", "vs": [[6, "فمن هؤلاء من يدخلون البيوت خلسة، ويوقعون في حبائلهم بعض النساء السخيفات المثقلات بالخطايا، اللواتي تجرفهن شهوات مختلفة،"]]}, {"l": "2Ti 4:14", "n": "", "vs": [[14, "إن إسكندر النحاس قد أساء إلي إساءات كثيرة، سيجازيه الرب حسب أعماله."]]}, {"l": "Heb 10:23", "n": "", "vs": [[23, "ولنتمسك دائما بالرجاء الذي نعترف به، دون أن نشك في أنه سيتحقق، لأن الذي وعدنا بتحقيقه، هو أمين وصادق."]]}, {"l": "Rev 2:25", "n": "", "vs": [[25, "فقط تمسكوا بما لديكم إلى أن أجيء."]]}, {"l": "Rev 3:3", "n": "", "vs": [[3, "تذكر ما سبق أن تقبلته وسمعته، وتمسك بما آمنت به، وتب! فإن كنت لا تتنبه، آتيك كما يأتي اللص، ولا تدري في أية ساعة أفاجئك!"]]}, {"l": "Rev 3:11", "n": "", "vs": [[11, "إني آت سريعا، فتمسك بما عندك، لئلا يسلب أحد إكليلك."]]}], "kwAr": "وتمسكوا بالحسن", "noteAr": ""}], "arS": [["امتحنوا", ["G1381"]], [" ", []], ["كل شيء", ["G3956"]], [" ", []], ["وتمسكوا", ["G2722"]], [" ", []], ["بالحسن", ["G2570"]], [".", []]]}, {"c": 5, "v": 22, "text": "ترفعوا عن كل ما فيه شبهة شر.", "groups": [{"kw": "", "raw": "1Th_4:12; Exo_23:7; Isa_33:15; Mat_17:26, Mat_17:27; Rom_12:17; 1Co_8:13, 1Co_10:31-33; 2Co_6:3, 2Co_8:20,2Co_8:21; Phi_4:8; Jud_1:23", "note": "", "refs": [{"l": "1Th 4:12", "n": "", "vs": [[12, "عندئذ تكون سيرتكم حسنة السمعة تجاه الذين من خارج الكنيسة، ولا تكونون في حاجة إلى شيء."]]}, {"l": "Exo 23:7", "n": "", "vs": [[7, "اجتنب الاتهام الكاذب ولا تقتل البريء والصالح، لأنني لا أبرىء المذنب."]]}, {"l": "Isa 33:15", "n": "", "vs": [[15, "السالك في البر، والناطق بالحق، والنابذ ربح الظلم، والنافض يديه من قبض الرشوة، الصام أذنيه عن الاستماع إلى مؤامرات سفك الدماء، المغمض عينيه عن التأمل في الشر،"]]}, {"l": "Mat 17:26", "n": "", "vs": [[26, "أجاب بطرس: «من الأجانب». فقال له يسوع: «إذن الأبناء أحرار …"]]}, {"l": "Mat 17:27", "n": "", "vs": [[27, "ولكن لكي لا نضع لهم عثرة، اذهب إلى البحيرة، وألق صنارة الصيد؛ وأمسك السمكة التي تطلع أولا، ثم افتح فمها تجد فيه قطعة نقد بقيمة أربعة دراهم، فخذها وأد الضريبة عني وعنك! »"]]}, {"l": "Rom 12:17", "n": "", "vs": [[17, "لا تردوا لأحد شرا مقابل شر، بل اجتهدوا في تقديم ما هو حسن أمام جميع الناس."]]}, {"l": "1Co 8:13", "n": "", "vs": [[13, "لذا، إن كان بعض الطعام فخا يسقط فيه أخي، فلن آكل لحما أبدا، لكي لا أسقط أخي!"]]}, {"l": "1Co 10:31-33", "n": "", "vs": [[31, "فإذا أكلتم أو شربتم أو مهما فعلتم، فافعلوا كل شيء لتمجيد الله."], [32, "لا تضعوا عائقا يسبب السقوط لأحد، سواء من اليهود أم اليونانيين أم كنيسة الله."], [33, "فهكذا أنا أيضا أسعى لإرضاء الجميع في كل شيء، ولا أهتم بمصلحتي الخاصة، بل بمصلحة الكثيرين، لكي يخلصوا."]]}, {"l": "2Co 6:3", "n": "", "vs": [[3, "ولسنا نتصرف أي تصرف يكون عثرة لأحد، حتى لا يلحق الخدمة أي لوم."]]}, {"l": "2Co 8:20", "n": "", "vs": [[20, "ونحن حريصون على ألا يلومنا أحد في أمر هذه التقدمة الكبيرة التي نتولى القيام بها."]]}, {"l": "2Co 8:21", "n": "", "vs": [[21, "فإننا نحرص على النزاهة لا أمام الرب فقط، بل أمام الناس أيضا."]]}, {"l": "Phi 4:8", "n": "", "vs": [[8, "وختاما، أيها الإخوة: كل ما كان حقا، وكل ما كان شريفا، وكل ما كان عادلا، وكل ما كان طاهرا وكل ما كان مستحبا، وكل ما كان حسن السمعة، وكل ما كان فيه فضيلة وخصلة حميدة، فاشغلوا أفكاركم به."]]}, {"l": "Jud 1:23", "n": "", "vs": [[23, "وبعضهم يجب أن تنقذوهم من النار خطفا. وآخرون يجب أن تعالجوهم بشفقة وحذر، مبغضين حتى الثياب التي يلوثونها بأجسادهم."]]}], "kwAr": "", "noteAr": ""}], "arS": [["ترفعوا", ["G567"]], [" عن ", []], ["كل", ["G3956"]], [" ما فيه ", []], ["شبهة", ["G1491"]], [" ", []], ["شر", ["G4190"]], [".", []]]}, {"c": 5, "v": 23, "text": "وإله السلام نفسه يقدسكم إلى التمام ويحفظكم سالمين، روحا ونفسا وجسدا، لتكونوا بلا لوم عند عودة ربنا يسوع المسيح.", "groups": [{"kw": "God", "raw": "Rom_15:5, Rom_15:13, Rom_15:33, Rom_16:20; 1Co_14:33; 2Co_5:19; Phi_4:9; 2Th_3:16; Heb_13:20; 1Pe_5:10", "note": "", "refs": [{"l": "Rom 15:5", "n": "", "vs": [[5, "وليعطكم إله الصبر والتعزية أن تكونوا متوافقين بعضكم مع بعض بحسب المسيح يسوع،"]]}, {"l": "Rom 15:13", "n": "", "vs": [[13, "فليملأكم إله الرجاء كل فرح وسلام في إيمانكم حتى تزدادوا رجاء بقوة الروح القدس."]]}, {"l": "Rom 15:33", "n": "", "vs": [[33, "وليكن إله السلام معكم جميعا. آمين!"]]}, {"l": "Rom 16:20", "n": "", "vs": [[20, "وإله السلام سيسحق الشيطان تحت أقدامكم سريعا. لتكن نعمة ربنا يسوع المسيح معكم."]]}, {"l": "1Co 14:33", "n": "", "vs": [[33, "فليس الله إله فوضى بل إله سلام، كما هي الحال في كنائس القديسين كلها."]]}, {"l": "2Co 5:19", "n": "", "vs": [[19, "ذلك أن الله كان في المسيح مصالحا العالم مع نفسه، غير حاسب عليهم خطاياهم، وقد وضع بين أيدينا رسالة هذه المصالحة."]]}, {"l": "Phi 4:9", "n": "", "vs": [[9, "واعملوا بها ما تعلمتم وتلقيتم وسمعتم مني وما رأيتم في. وإله السلام يكون معكم."]]}, {"l": "2Th 3:16", "n": "", "vs": [[16, "وليعطكم رب السلام نفسه السلام على الدوام وفي كل حال! وليكن الرب معكم جميعا!"]]}, {"l": "Heb 13:20", "n": "", "vs": [[20, "وأسأل الله ، إله السلام الذي أقام من بين الأموات ربنا يسوع راعي الخراف العظيم بفضل دمه الذي ختم به العهد الأبدي"]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}], "kwAr": "وإله السلام نفسه", "noteAr": ""}, {"kw": "sanctify", "raw": "1Th_3:13, 1Th_4:3; Lev_20:8, Lev_20:26; Eze_37:28; Joh_17:19; Act_20:32, Act_26:18; 1Co_1:2; Heb_2:11; 1Pe_1:2; Jud_1:1", "note": "", "refs": [{"l": "1Th 3:13", "n": "", "vs": [[13, "حتى تتثبت قلوبكم بغير لوم في القداسة أمام إلهنا وأبينا عندما يظهر ربنا يسوع عائدا مع جميع قديسيه."]]}, {"l": "1Th 4:3", "n": "", "vs": [[3, "فإن مشيئة الله هي هذه: قداستكم. وذلك بأن تمتنعوا عن الزنى،"]]}, {"l": "Lev 20:8", "n": "", "vs": [[8, "أطيعوا فرائضي واعملوا بها، فأنا الرب الذي يقدسكم."]]}, {"l": "Lev 20:26", "n": "", "vs": [[26, "وكونوا قديسين لأني أنا قدوس، وقد أفرزتكم من بين الشعوب لتكونوا خاصتي."]]}, {"l": "Eze 37:28", "n": "", "vs": [[28, "فتدرك الأمم أني أنا الرب مقدس إسرائيل، حين يكون مقدسي قائما في وسطهم إلى الأبد»."]]}, {"l": "Joh 17:19", "n": "", "vs": [[19, "ومن أجلهم أنا أقدس ذاتي، ليتقدسوا هم أيضا في الحق."]]}, {"l": "Act 20:32", "n": "", "vs": [[32, "وا لآن أسلمكم إلى الله وإلى كلمة نعمته القادرة أن تبنيكم وتعطيكم ميراثا تشتركون فيه مع جميع المقدسين لله."]]}, {"l": "Act 26:18", "n": "", "vs": [[18, "لتفتح عيونهم كي يرجعوا من الظلام إلى النور، ومن سيطرة الشيطان إلى الله، فينالوا غفران الخطايا ونصيبا بين الذين تقدسوا بالإيمان بي."]]}, {"l": "1Co 1:2", "n": "", "vs": [[2, "إلى كنيسة الله في مدينة كورنثوس، إلى الذين تقدسوا في المسيح يسوع، المدعوين، القديسين؛ وإلى جميع الذين يدعون باسم ربنا يسوع المسيح في كل مكان ربا لهم ولنا."]]}, {"l": "Heb 2:11", "n": "", "vs": [[11, "فإن للمسيح الذي يقدس المؤمنين به، وللمقدسين أنفسهم، أبا واحدا. لهذا، لا يستحي المسيح أن يدعو المؤمنين به إخوة له."]]}, {"l": "1Pe 1:2", "n": "", "vs": [[2, "بحسب علمه السابق ثم قدسهم بالروح ليطيعوا يسوع المسيح ويطهروا برش دمه عليهم."]]}, {"l": "Jud 1:1", "n": "", "vs": [[1, "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."]]}], "kwAr": "يقدسكم إلى التمام", "noteAr": ""}, {"kw": "your", "raw": "Heb_4:12", "note": "", "refs": [{"l": "Heb 4:12", "n": "", "vs": [[12, "ذلك لأن كلمة الله حية، وفعاله، وأمضى من كل سيف له حدان، وخارقة إلى مفترق النفس والروح والمفاصل ونخاع العظام، وقادرة أن تميز أفكار القلب ونياته."]]}], "kwAr": "روحا ونفسا وجسدا", "noteAr": ""}, {"kw": "preserved", "raw": "1Th_3:13; 1Co_1:8, 1Co_1:9; Eph_5:26, Eph_5:27; Phi_1:6, Phi_1:10, Phi_2:15, Phi_2:16; Col_1:22; Jud_1:24", "note": "", "refs": [{"l": "1Th 3:13", "n": "", "vs": [[13, "حتى تتثبت قلوبكم بغير لوم في القداسة أمام إلهنا وأبينا عندما يظهر ربنا يسوع عائدا مع جميع قديسيه."]]}, {"l": "1Co 1:8", "n": "", "vs": [[8, "وهو نفسه سيحفظكم ثابتين إلى النهاية حتى تكونوا بلا عيب في يوم ربنا يسوع المسيح."]]}, {"l": "1Co 1:9", "n": "", "vs": [[9, "فإن الله أمين، وقد دعاكم إلى الشركة مع ابنه يسوع ربنا."]]}, {"l": "Eph 5:26", "n": "", "vs": [[26, "لكي يقدسها مطهرا إياها بغسل الماء، بالكلمة،"]]}, {"l": "Eph 5:27", "n": "", "vs": [[27, "حتى يزفها إلى نفسه كنيسة بهية لا يشوبها عيب أو تجعد أو أية نقيصة مشابهة بل تكون مقدسة خالية من العيوب."]]}, {"l": "Phi 1:6", "n": "", "vs": [[6, "ولي ثقة في هذا الأمر بالذات: أن الذي بدأ فيكم عملا صالحا سوف يتممه إلى يوم المسيح يسوع."]]}, {"l": "Phi 1:10", "n": "", "vs": [[10, "لكي تستحسنوا الأمور الممتازة، حتى تكونوا طاهرين وخالين من العثرات إلى يوم المسيح،"]]}, {"l": "Phi 2:15", "n": "", "vs": [[15, "لتكونوا بلا أذى وبسطاء، أولادا لله لا يعابون بشيء في وسط جيل منحرف فاسد، تضيئون بينهم كأنوار في العالم،"]]}, {"l": "Phi 2:16", "n": "", "vs": [[16, "حاملين كلمة الحياة، لتكونوا في يوم المسيح موضع فخر بأني ما سعيت باطلا ولا اجتهدت عبثا."]]}, {"l": "Col 1:22", "n": "", "vs": [[22, "قد صالحكم الآن في جسد بشرية (ابنه) بالموت. وذلك لكي يحضركم فتمثلوا أمامه وأنتم قديسون بلا ذنب ولا لوم."]]}, {"l": "Jud 1:24", "n": "", "vs": [[24, "وللقادر أن يحرسكم من السقوط حتى يوصلكم إلى المثول أمامه في المجد مبتهجين ولا عيب فيكم …"]]}], "kwAr": "ويحفظكم سالمين", "noteAr": ""}], "arS": [["وإله", ["G2316"]], [" ", []], ["السلام", ["G1515"]], [" ", []], ["نفسه", ["G846"]], [" ", []], ["يقدسكم", ["G37"]], [" إلى ", []], ["التمام", ["G3651"]], [" ", []], ["ويحفظكم سالمين", ["G5083"]], ["، ", []], ["روحا", ["G4151"]], [" ", []], ["ونفسا", ["G5590"]], [" ", []], ["وجسدا", ["G4983"]], ["، لتكونوا ", []], ["بلا لوم", ["G274"]], [" عند ", []], ["عودة", ["G3952"]], [" ", []], ["ربنا", ["G2962", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 5, "v": 24, "text": "فإن الله الذي يدعوكم صادق، وسوف يتم ذلك.", "groups": [{"kw": "Faithful", "raw": "Deu_7:9; Psa_36:5, Psa_40:10, Psa_86:15, Psa_89:2, Psa_92:2, Psa_100:5, Psa_138:2, Psa_146:6; Isa_25:1; Lam_3:23; Mic_7:20; Joh_1:17, Joh_3:33; 1Co_1:9, 1Co_10:13; 2Th_3:3; 2Ti_2:13; Tit_1:2; Heb_6:17, Heb_6:18", "note": "", "refs": [{"l": "Deu 7:9", "n": "", "vs": [[9, "فاعلموا أن الرب إلهكم هو الله ، الإله الأمين الوفي بالعهد والإحسان لمحبيه وحافظي وصاياه إلى ألف جيل."]]}, {"l": "Psa 36:5", "n": "", "vs": [[5, "يارب، إن رحمتك في السماوات، وأمانتك تبلغ الغيوم."]]}, {"l": "Psa 40:10", "n": "", "vs": [[10, "لم أخف برك داخل قلبي، بل أعلنت أمانتك وخلاصك. لم أكتم رحمتك وحقك عن جماعة شعبك العظيم»."]]}, {"l": "Psa 86:15", "n": "", "vs": [[15, "إنما أنت يارب إله رحيم ورؤوف وبطيء الغضب ووافر الرحمة والحق."]]}, {"l": "Psa 89:2", "n": "", "vs": [[2, "لأني قلت إن مراحمك ثابتة إلى الأبد، وقد ثبت في السماوات أمانتك."]]}, {"l": "Psa 92:2", "n": "", "vs": [[2, "ما أحسن أن يلهج برحمتك في الصباح، وبأمانتك في الليالي،"]]}, {"l": "Psa 100:5", "n": "", "vs": [[5, "فإن الرب صالح، إلى الأبد رحمته وأمانته دائمة من جيل إلى جيل."]]}, {"l": "Psa 138:2", "n": "", "vs": [[2, "أسجد في هيكل قدسك، وأحمد اسمك من أجل رحمتك وحقك، لأنك عظمت كلمتك واسمك فوق كل شيء"]]}, {"l": "Psa 146:6", "n": "", "vs": [[6, "خالق السماوات والأرض والبحر وكل ما فيها، الأمين إلى الأبد."]]}, {"l": "Isa 25:1", "n": "", "vs": [[1, "يارب أنت إلهي، أعظمك وأحمد اسمك لأنك صنعت عجائب كنت قد قضيت بها منذ القدم، وهي حق وصدق."]]}, {"l": "Lam 3:23", "n": "", "vs": [[23, "تتجدد في كل صباح. فائقة أمانتك."]]}, {"l": "Mic 7:20", "n": "", "vs": [[20, "أنت تبدي أمانة لذرية يعقوب، ورحمة لنسل إبراهيم، كما حلفت لأجدادنا منذ القدم."]]}, {"l": "Joh 1:17", "n": "", "vs": [[17, "لأن الشريعة أعطيت على يد موسى، أما النعمة والحق فقد تواجدا بيسوع المسيح."]]}, {"l": "Joh 3:33", "n": "", "vs": [[33, "على أن الذي يقبل شهادته، يصادق على أن الله حق،"]]}, {"l": "1Co 1:9", "n": "", "vs": [[9, "فإن الله أمين، وقد دعاكم إلى الشركة مع ابنه يسوع ربنا."]]}, {"l": "1Co 10:13", "n": "", "vs": [[13, "لم يصبكم من التجارب إلا ما هو بشري. ولكن الله أمين وجدير بالثقة، فلا يدعكم تجربون فوق ما تطيقون، بل يدبر لكم مع التجربة سبيل الخروج منها لتطيقوا احتمالها."]]}, {"l": "2Th 3:3", "n": "", "vs": [[3, "إلا أن الرب جدير بالثقة؛ فهو سيثبتكم ويحميكم من الشر."]]}, {"l": "2Ti 2:13", "n": "", "vs": [[13, "إن تخلينا عن أمانتنا، فهو يبقى على أمانته، إذ لا يمكن أن يتنكر لذاته!»"]]}, {"l": "Tit 1:2", "n": "", "vs": [[2, "في رجاء الحياة الأبدية، التي وعد بها الله المنزه عن الكذب، من قبل أزمنة الأزل،"]]}, {"l": "Heb 6:17", "n": "", "vs": [[17, "ولذلك، لما أراد الله أن يؤكد بصورة قاطعة لوارثي وعده، أن قراره لا يتغير أبدا، ثبته بالقسم."]]}, {"l": "Heb 6:18", "n": "", "vs": [[18, "فاستنادا إلى وعد الله وقسمه، وهما أمران ثابتان لا يتغيران ويستحيل أن يكذب الله فيهما، نحصل على تشجيع قوي، بعدما التجأنا إلى التمسك بالرجاء الموضوع أمامنا."]]}], "kwAr": "صادق", "noteAr": ""}, {"kw": "calleth", "raw": "1Th_2:12; Rom_8:30, Rom_9:24; Gal_1:15; 2Th_2:14; 2Ti_1:9; 1Pe_5:10; 2Pe_1:3; Rev_17:14", "note": "", "refs": [{"l": "1Th 2:12", "n": "", "vs": [[12, "ونحرضكم أن تسلكوا سلوكا يليق بالله، ذاك الذي يدعوكم إلى ملكوته ومجده."]]}, {"l": "Rom 8:30", "n": "", "vs": [[30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."]]}, {"l": "Rom 9:24", "n": "", "vs": [[24, "فينا نحن الذين دعاهم لا من بين اليهود فقط بل من بين الأمم أيضا؟"]]}, {"l": "Gal 1:15", "n": "", "vs": [[15, "ولكن، لما سر الله ، الذي كان قد أفرزني وأنا في بطن أمي ثم دعاني بنعمته،"]]}, {"l": "2Th 2:14", "n": "", "vs": [[14, "فإلى هذا الأمر قد دعاكم ببشارتنا لكم، لنوال مجد ربنا يسوع المسيح."]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لن
