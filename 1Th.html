ر، وهكذا آمنتم."], [12, "والآن، مادام يبشر بأن المسيح قام من بين الأموات، فكيف يقول بعضكم إنه لا قيامة للأموات؟"], [13, "فإن كانت قيامة الأموات غير موجودة، فمعنى ذلك أن المسيح لم يقم أيضا!"], [14, "ولو لم يكن المسيح قد قام، لكان تبشيرنا عبثا وإيمانكم عبثا،"], [15, "ولكان تبين عندئذ أننا شهود زور على الله، إذ إننا شهدنا على الله أنه أقام المسيح، وهو لم يقمه لو صح أن الأموات لا يقامون."], [16, "إذن، لو كان الأموات لا يقامون، لكان المسيح لم يقم أيضا."], [17, "ولو لم يكن المسيح قد قام، لكان إيمانكم عبثا، ولكنتم بعد في خطاياكم،"], [18, "ولكان الذين رقدوا في المسيح قد هلكوا!"], [19, "ولو كان رجاؤنا في المسيح يقتصر على هذه الحياة، لكنا أشقى الناس جميعا!"], [20, "أما الآن فالمسيح قد قام من بين الأموات بكرا للراقدين."], [21, "فبما أن الموت كان بإنسان، فإن قيامة الأموات أيضا تكون بإنسان."]]}, {"l": "Col 1:18", "n": "", "vs": [[18, "وهو رأس الجسد، أي الكنيسة؛ هو البداءة وبكر القائمين من بين الأموات، ليكون له المقام الأول في كل شيء."]]}, {"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}, {"l": "1Pe 1:21", "n": "", "vs": [[21, "أنتم الذين تؤمنون بالله بالمسيح الذي أقامه من الموت وأعطاه المجد، حتى يكون الله غاية إيمانكم ورجائكم."]]}, {"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}, {"l": "Rev 1:18", "n": "", "vs": [[18, "أنا الحي. كنت ميتا، ولكن ها أنا حي إلى أبد الآبدين. ولي مفاتيح الموت والهاوية."]]}], "kwAr": "الذي أقامه من بين الأموات", "noteAr": ""}, {"kw": "Jesus", "raw": "1Th_5:9; Mat_1:21; Rom_5:9, Rom_5:10; Gal_3:13; 1Pe_2:21", "note": "", "refs": [{"l": "1Th 5:9", "n": "", "vs": [[9, "فإن الله عيننا لا لينزل علينا الغضب بل لننال الخلاص بربنا يسوع المسيح،"]]}, {"l": "Mat 1:21", "n": "", "vs": [[21, "فستلد ابنا، وأنت تسميه يسوع، لأنه هو الذي يخلص شعبه من خطاياهم»."]]}, {"l": "Rom 5:9", "n": "", "vs": [[9, "ومادمنا الآن قد تبررنا بدمه، فكم بالأحرى نخلص به من الغضب الآتي!"]]}, {"l": "Rom 5:10", "n": "", "vs": [[10, "فإن كنا، ونحن أعداء، قد تصالحنا مع الله بموت ابنه، فكم بالأحرى نخلص بحياته ونحن مصالحون!"]]}, {"l": "Gal 3:13", "n": "", "vs": [[13, "إن المسيح حررنا بالفداء من لعنة الشريعة، إذ صار لعنة عوضا عنا، لأنه قد كتب: «ملعون كل من علق على خشبة»،"]]}, {"l": "1Pe 2:21", "n": "", "vs": [[21, "لأن الله دعاكم إلى الاشتراك في هذا النوع من الآلام. فالمسيح، الذي تألم لأجلكم، هو القدوة التي تقتدون بها. فسيروا على آثار خطواته:"]]}], "kwAr": "يسوع مخلصنا", "noteAr": ""}, {"kw": "the wrath", "raw": "Mat_3:7; Luk_3:7; Heb_10:27", "note": "", "refs": [{"l": "Mat 3:7", "n": "", "vs": [[7, "ولما رأى يوحنا كثيرين من الفر يسيين والصدوقيين يأتون إليه ليتعمدوا، قال لهم: «ياأولاد الأفاعي، من أنذركم لتهربوا من الغضب الآتي؟"]]}, {"l": "Luk 3:7", "n": "", "vs": [[7, "فقد كان يقول للجموع الذين خرجوا إليه ليتعمدوا على يده: «ياأولاد الأفاعي، من أنذركم لتهربوا من الغضب الآتي؟"]]}, {"l": "Heb 10:27", "n": "", "vs": [[27, "بل انتظار العقاب الأكيد في لهيب النار التي ستلتهم المتمردين. ويا له من انتظار مخيف!"]]}], "kwAr": "من الغضب الآتي", "noteAr": ""}], "arS": [["وتنتظروا", ["G362"]], [" من ", []], ["السماوات", ["G3772"]], [" ", []], ["ابنه", ["G5207"]], [" الذي ", []], ["أقامه", ["G1453"]], [" من بين ", []], ["الأموات", ["G3498"]], ["، ", []], ["يسوع", ["G2424"]], [" ", []], ["مخلصنا", ["G4506"]], [" من ", []], ["الغضب", ["G3709"]], [" ", []], ["الآتي", ["G2064"]], [".", []]]}, {"c": 2, "v": 1, "text": "فإنكم، أيها الإخوة، تعلمون أن قدومنا إليكم لم يكن باطلا.", "groups": [{"kw": "our", "raw": "1Th_2:13, 1Th_1:3-10; 2Th_3:1", "note": "", "refs": [{"l": "1Th 2:13", "n": "", "vs": [[13, "ولذلك نحن أيضا نرفع الشكر لله بلا توقف، لأنكم لما تلقيتم منا كلمة البشارة من الله، قبلتموها لا كأنها كلمة بشر، بل كما هي في الحقيقة: باعتبارها كلمة الله العاملة أيضا فيكم أنتم المؤمنين."]]}, {"l": "1Th 1:3-10", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"], [4, "ونحن عالمون، أيها الإخوة أحباء الله، حقيقة اختياركم من قبل الله:"], [5, "لأن تبشيرنا لكم بالإنجيل لم يكن مجرد كلام، بل كان مصحوبا أيضا بالقوة وبالروح القدس وبتمام اليقين. كما أنكم تعلمون تماما ماذا كنا بينكم لأجل مصلحتكم،"], [6, "وقد صرتم مقتدين بنا وبالرب، إذ تقبلتم كلمة الله في وسط ضيقة شديدة بفرح الروح القدس."], [7, "حتى إنكم صرتم مثالا لجميع المؤمنين المقيمين في مقاطعتي مقدونية وأخائية."], [8, "فمن عندكم دوت كلمة الرب، منتشرة لا في مقدونية وأخائية فقط، بل إن إيمانكم بالله ذاع في كل مكان، حتى ليس لنا حاجة لأن نقول شيئا بعد."], [9, "فإن أولئك المؤمنين أنفسهم يخبرون عنا كيف كان قدومنا إليكم أول مرة، وكيف تحولتم إلى الله عن الأصنام، لتصيروا عبيدا يخدمون الله الحي الحق،"], [10, "وتنتظروا من السماوات ابنه الذي أقامه من بين الأموات، يسوع مخلصنا من الغضب الآتي."]]}, {"l": "2Th 3:1", "n": "", "vs": [[1, "وبعد، أيها الإخوة، صلوا لأجلنا، لتنتشر كلمة الرب بسرعة وتتمجد كما هي الحال عندكم،"]]}], "kwAr": "قدومنا إليكم", "noteAr": ""}, {"kw": "in vain", "raw": "1Th_3:5; Job_39:16; Psa_73:13, Psa_127:1; Isa_49:4, Isa_65:23; Hab_2:13; 1Co_15:2, 1Co_15:10,1Co_15:58; 2Co_6:1; Gal_2:2, Gal_4:11; Phi_2:16", "note": "", "refs": [{"l": "1Th 3:5", "n": "", "vs": [[5, "ولهذا أيضا، إذ صار الافتراق عنكم لا يحتمل، أرسلت أستخبر عن إيمانكم لئلا يكون المجرب قد جربكم فيذهب جهدنا سدى!"]]}, {"l": "Job 39:16", "n": "", "vs": [[16, "إنها تعامل صغارها بقسوة كأنها ليست لها، غير آسفة على ضياع تعبها،"]]}, {"l": "Psa 73:13", "n": "", "vs": [[13, "باطلا قد طهرت قلبي وغسلت يدي بالنقاوة."]]}, {"l": "Psa 127:1", "n": "", "vs": [[1, "إن لم يبن الرب البيت، فباطلا يتعب البناؤون. وإن لم يحرس الرب المدينة فباطلا يسهر الحارس."]]}, {"l": "Isa 49:4", "n": "", "vs": [[4, "ولكنني أجبت: لقد تعبت باطلا. وأفنيت قوتي سدى وعبثا. غير أن حقي محفوظ عند الرب، ومكافأتي عند إلهي."]]}, {"l": "Isa 65:23", "n": "", "vs": [[23, "فهم لن يتعبوا باطلا ولا تنجب نساؤهم أولادا للرعب، لأنهم يكونون ذرية مباركي الرب، ويتبارك أولادهم معهم."]]}, {"l": "Hab 2:13", "n": "", "vs": [[13, "ألم يصدر القضاء من عند الرب القدير أن يؤول تعب الشعوب إلى النار وجهد الأمم إلى الباطل؟"]]}, {"l": "1Co 15:2", "n": "", "vs": [[2, "وبه أيضا أنتم مخلصون، إن كنتم تتمسكون بالكلمة التي بشرتكم بها، إلا إذا كنتم قد آمنتم عبثا."]]}, {"l": "1Co 15:10", "n": "", "vs": [[10, "ولكن، بنعمة الله صرت على ما أنا عليه الآن، ونعمته الموهوبة لي لم تكن عبثا، إذ عملت جاهدا أكثر من الرسل الآخرين جميعا. إلا أني لم أكن أنا العامل، بل نعمة الله التي كانت معي."]]}, {"l": "1Co 15:58", "n": "", "vs": [[58, "إذن، ياإخوتي الأحباء، كونوا راسخين غير متزحزحين، كثيري الاجتهاد في عمل الرب دائما، عالمين أن جهدكم في الرب ليس عبثا!"]]}, {"l": "2Co 6:1", "n": "", "vs": [[1, "فبما أننا عاملون معا عند الله، نطلب ألا يكون قبولكم لنعمة الله عبثا."]]}, {"l": "Gal 2:2", "n": "", "vs": [[2, "وإنما صعدت إليها استجابة للوحي؛ وبسطت أمامهم الإنجيل الذي أبشر به بين الأمم، ولكن على انفراد أمام البارزين فيهم، لئلا يكون مسعاي في الحاضر والماضي بلا جدوى."]]}, {"l": "Gal 4:11", "n": "", "vs": [[11, "أخاف عليكم، خشية أن أكون قد تعبت من أجلكم بلا جدوى."]]}, {"l": "Phi 2:16", "n": "", "vs": [[16, "حاملين كلمة الحياة، لتكونوا في يوم المسيح موضع فخر بأني ما سعيت باطلا ولا اجتهدت عبثا."]]}], "kwAr": "لم يكن باطلا", "noteAr": ""}], "arS": [["فإنكم، أيها ", []], ["الإخوة", ["G80"]], ["، ", []], ["تعلمون", ["G1492"]], [" أن ", []], ["قدومنا", ["G1529"]], [" إليكم لم يكن ", []], ["باطلا", ["G2756"]], [".", []]]}, {"c": 2, "v": 2, "text": "فمع أننا كنا قد قاسينا الألم والإهانة في مدينة فيلبي، كما تعلمون، فقد تجرأنا في إلهنا أن نكلمكم بإنجيل الله مجاهدين في وجه المعارضة الشديدة.", "groups": [{"kw": "shamefully", "raw": "Act_5:41, Act_16:12, Act_16:22-24, Act_16:37; 2Ti_1:12; Heb_11:36, Heb_11:37, Heb_12:2, Heb_12:3; 1Pe_2:14-16", "note": "", "refs": [{"l": "Act 5:41", "n": "", "vs": [[41, "ولكن الرسل خرجوا من المجلس فرحين، لأنهم اعتبروا أهلا لأن يلقوا الإهانة من أجل اسم يسوع."]]}, {"l": "Act 16:12", "n": "", "vs": [[12, "ومنها إلى مدينة فيلبي، وهي كبرى مدن مقاطعة مقدونية، ومستعمرة للرومان. فبقينا فيها بضعة أيام."]]}, {"l": "Act 16:22-24", "n": "", "vs": [[22, "فثار الجمع عليهما، ومزق الحكام ثيابهما وأمروا بجلدهما،"], [23, "فجلدوهما كثيرا وألقوهما في السجن، وأمروا ضابط السجن بتشديد الحراسة عليهما."], [24, "ونفذ ضابط السجن هذا الأمر المشدد. فزج بهما في السجن الداخلي، وأدخل أرجلهما في مقطرة خشبية."]]}, {"l": "Act 16:37", "n": "", "vs": [[37, "فاحتج بولس قائلا: «جلدونا أمام الناس بغير محاكمة، مع أننا نحمل الجنسية الرومانية، وزجوا بنا في السجن. فكيف يطلقون سراحنا الآن سرا! كلا! بل ليأتوا هم ويطلقوا سراحنا!»"]]}, {"l": "2Ti 1:12", "n": "", "vs": [[12, "من أجل ذلك أيضا أقاسي الآن هذه الآلام، ولكني لست أخجل، لأنني أعرف من أنا مؤمن به، ولي تمام الثقة بأنه قادر أن يحفظ لي الأمانة التي أودعتها عنده سالمة إلى ذلك اليوم."]]}, {"l": "Heb 11:36", "n": "", "vs": [[36, "وكثيرون غيرهم تحملوا المحاكمات الظالمة تحت الإهانة والجلد، والإلقاء في السجون مقيدين بالسلاسل."]]}, {"l": "Heb 11:37", "n": "", "vs": [[37, "ومنهم من حوكموا فماتوا رجما بالحجارة، أو نشرا بالمنشار، أو ذبحا بالسيف. وبعضهم، تشردوا متسترين بجلود الغنم والمعزى، يعانون من الحاجة والضيق والظلم،"]]}, {"l": "Heb 12:2", "n": "", "vs": [[2, "متطلعين دائما إلى يسوع: رائد إيماننا ومكمله. فهو قد تحمل الموت صلبا، هازئا بما في ذلك من عار، إذ كان ينظر إلى السرور الذي ينتظره، ثم جلس عن يمين عرش الله."]]}, {"l": "Heb 12:3", "n": "", "vs": [[3, "فتأملوا مليا ما قاساه بتحمله تلك المعاملة العنيفة التي عامله بها الخاطئون، لكي لا تتعبوا وتنهاروا!"]]}, {"l": "1Pe 2:14-16", "n": "", "vs": [[14, "وللحكام، باعتبارهم ممثلي الملك الذين يعاقبون المذنبين ويمدحون الصالحين."], [15, "فإن هذه هي إرادة الله: أن تفعلوا الخير دائما، فتفحموا جهالة الناس الأغبياء!"], [16, "تصرفوا كأحرار حقا، لا كالذين يتخذون من الحرية ستارا لارتكاب الشر بل باعتبار أنكم عبيد لله."]]}], "kwAr": "والإهانة", "noteAr": ""}, {"kw": "bold", "raw": "1Th_1:5; Act_4:13, Act_4:20,Act_4:31, Act_14:3, Act_17:2, Act_17:3; Eph_6:19, Eph_6:20", "note": "", "refs": [{"l": "1Th 1:5", "n": "", "vs": [[5, "لأن تبشيرنا لكم بالإنجيل لم يكن مجرد كلام، بل كان مصحوبا أيضا بالقوة وبالروح القدس وبتمام اليقين. كما أنكم تعلمون تماما ماذا كنا بينكم لأجل مصلحتكم،"]]}, {"l": "Act 4:13", "n": "", "vs": [[13, "فتعجب المجتمعون من جرأة بطرس ويوحنا، لما عرفوا أنهما غير متعلمين وأنهما من عامة الشعب، فأدركوا أنهما كانا مع يسوع."]]}, {"l": "Act 4:20", "n": "", "vs": [[20, "لا نستطيع أن نكف عن التحدث بما رأينا وسمعنا»."]]}, {"l": "Act 4:31", "n": "", "vs": [[31, "وفيما هم يصلون ارتج المكان الذي كانوا مجتمعين فيه، وامتلأوا جميعا بالروح القدس، فأخذوا يعلنون كلمة الله بكل جرأة!"]]}, {"l": "Act 14:3", "n": "", "vs": [[3, "إلا أن بولس وبرنابا بقيا هناك فترة طويلة يبشران بالرب بكل جرأة، وأيدهما الرب شاهدا لكلمة نعمته بما أجراه على أيديهما من آيات وعجائب."]]}, {"l": "Act 17:2", "n": "", "vs": [[2, "فذهب إليه كعادته، وناقشهم لثلاثة سبوت، مستندا إلى الكتاب،"]]}, {"l": "Act 17:3", "n": "", "vs": [[3, "وشرح لهم مبينا أن المسيح كان لابد أن يتألم ويقوم من بين الأموات، وأن «المسيح الذي تنتظرونه هو يسوع الذي أبشركم به الآن!»"]]}, {"l": "Eph 6:19", "n": "", "vs": [[19, "ولأجلي كي ألهم ما أنطق به كلما فتحت فمي لأعلن بجرأة سر الإنجيل"]]}, {"l": "Eph 6:20", "n": "", "vs": [[20, "الذي أنا سفيره المقيد بالسلاسل، فأكون جريئا في إعلانه كما يجب أن أتكلم به."]]}], "kwAr": "فقد تجرأنا في إلهنا", "noteAr": ""}, {"kw": "much", "raw": "Act_6:9, Act_6:10, Act_15:1, Act_15:2, Act_17:2-9, Act_17:17, Act_19:8; Phi_1:27-30; Col_2:1; Jud_1:3", "note": "", "refs": [{"l": "Act 6:9", "n": "", "vs": [[9, "فعارضه بعض المنتمين إلى جماعة العبيد المحررين، يساندهم بعض اليهود من القيروان والإسكندرية، وغيرهم من مقاطعتي كيليكيا وأسيا، وأخذوا يجادلونه."]]}, {"l": "Act 6:10", "n": "", "vs": [[10, "ولكنهم لم يتمكنوا من مقاومة حكمته والروح الذي كان يتكلم به."]]}, {"l": "Act 15:1", "n": "", "vs": [[1, "وجاء بعض اليهود (الذين كانوا قد آمنوا بالمسيح) من منطقة اليهودية إلى أنطاكية، وأخذوا يعلمون الإخوة قائلين: «لا يمكنكم أن تخلصوا ما لم تختنوا حسب شريعة موسى»"]]}, {"l": "Act 15:2", "n": "", "vs": [[2, "فجادلهم بولس وبرنابا جدالا عنيفا. وبعد المناقشة قرر مؤمنو أنطاكية أن يذهب بولس وبرنابا مع بعض المؤمنين ليقابلوا الرسل والشيوخ في أورشليم، ويبحثوا معهم في هذه القضية."]]}, {"l": "Act 17:2-9", "n": "", "vs": [[2, "فذهب إليه كعادته، وناقشهم لثلاثة سبوت، مستندا إلى الكتاب،"], [3, "وشرح لهم مبينا أن المسيح كان لابد أن يتألم ويقوم من بين الأموات، وأن «المسيح الذي تنتظرونه هو يسوع الذي أبشركم به الآن!»"], [4, "فاقتنع بعض الحاضرين وانضموا إلى بولس وسيلا. وكان بينهم عدد كبير من اليونانيين المتعبدين لله وكثيرات من النساء النبيلات."], [5, "فأثار ذلك حسد اليهود الذين لم يؤمنوا، فأتوا ببعض الأشرار من أبناء الشارع، وجمعوا جمهورا وأخذوا يحرضون الناس حتى أثاروا الفوضى في المدينة، ثم هجموا على بيت ياسون مطالبين بتسليم بولس وسيلا إلى الجمع."], [6, "ولما لم يجدوهما هناك جروا ياسون وبعض الإخوة واقتادوهم إلى حكام المدينة، واشتكوا عليهم صارخين: «إن هذين الرجلين اللذين قلبا الدنيا ، قد جاءا إلى مدينتنا أيضا،"], [7, "فاستضافهما ياسون. وهم جميعا يخالفون أوامر القيصر، وينادون بملك آخر اسمه يسوع»."], [8, "فأحدثوا انزعاجا لدى الجمع والحكام عندما سمعوا هذا."], [9, "فقبض الحكام كفالة من ياسون ومن معه ثم أفرجوا عنهم."]]}, {"l": "Act 17:17", "n": "", "vs": [[17, "وأخذ يخاطب اليهود والمتعبدين في المجمع، ومن يلقاهم كل يوم في ساحة المدينة."]]}, {"l": "Act 19:8", "n": "", "vs": [[8, "وأخذ بولس يداوم على الذهاب إلى المجمع مدة ثلاثة أشهر، يتكلم بجرأة فيناقش الحاضرين ويحاول إقناعهم بالحقائق المختصة بملكوت الله."]]}, {"l": "Phi 1:27-30", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"], [28, "غير مرتعبين في شيء من الذين يقاومونكم، فإن في مقاومتهم دليلا على هلاكهم هم وعلى خلاصكم أنتم، وذلك من عند الله."], [29, "فقد وهب لكم، لأجل المسيح، لا أن تؤمنوا به وحسب، بل أيضا أن تتألموا لأجله،"], [30, "مجاهدين الجهاد عينه الذي رأيتموه في والذي تسمعون الآن أنه في."]]}, {"l": "Col 2:1", "n": "", "vs": [[1, "فإني أريد أن تعلموا مقدار جهادي لأجلكم ولأجل الذين في مدينة لاودكية، ولأجل جميع الذين لا يعرفونني بالوجه،"]]}, {"l": "Jud 1:3", "n": "", "vs": [[3, "أيها الأحباء، كنت قد نويت أن أكتب إليكم في موضوع الخلاص الذي نشترك فيه جميعا. ولكن، أراني الآن مضطرا لأن أكتب لأشجعكم على الجهاد في سبيل الإيمان الذي سلم مرة واحدة للقديسين."]]}], "kwAr": "المعارضة الشديدة", "noteAr": ""}], "arS": [["فمع أننا كنا قد ", []], ["قاسينا الألم", ["G4310"]], [" ", []], ["والإهانة", ["G5195"]], [" في مدينة ", []], ["فيلبي", ["G5375"]], ["، كما ", []], ["تعلمون", ["G1492"]], ["، فقد ", []], ["تجرأنا", ["G3955"]], [" في ", []], ["إلهنا", ["G2316", "G2257"]], [" أن ", []], ["نكلمكم", ["G2980"]], [" ", []], ["بإنجيل", ["G2098"]], [" ", []], ["الله", ["G2316"]], [" مجاهدين في وجه ", []], ["المعارضة", ["G73"]], [" ", []], ["الشديدة", ["G4183"]], [".", []]]}, {"c": 2, "v": 3, "text": "فما كان وعظنا صادرا عن ضلال ولا عن نجاسة، ولا خالطه مكر،", "groups": [{"kw": "", "raw": "1Th_2:5, 1Th_2:6, 1Th_2:11, 1Th_4:1, 1Th_4:2; Num_16:15; 1Sa_12:3; Act_20:33, Act_20:34; 2Co_2:17, 2Co_4:2, 2Co_4:5, 2Co_7:2; 2Co_11:13, 2Co_12:16-18; 2Pe_1:16", "note": "", "refs": [{"l": "1Th 2:5", "n": "", "vs": [[5, "وكما تعلمون أيضا، فإننا لم نستعمل معكم قط كلام التملق، ولا اتخذنا ذريعة للطمع إنما الله شاهد"]]}, {"l": "1Th 2:6", "n": "", "vs": [[6, "ولا سعينا لنوال مجد من الناس، لا منكم ولا من غيركم،"]]}, {"l": "1Th 2:11", "n": "", "vs": [[11, "كما أنكم تعلمون كيف عاملناكم معاملة الأب لأولاده، فكنا نعظ كل واحد منكم ونشجعكم"]]}, {"l": "1Th 4:1", "n": "", "vs": [[1, "وبعد، أيها الإخوة، فمثلما تلقيتم منا كيف يجب أن تسلكوا سلوكا يرضي الله ، وكما أنتم فاعلون، نرجو منكم ونحرضكم في الرب يسوع أن تضاعفوا تقدمكم في ذلك أكثر فأكثر."]]}, {"l": "1Th 4:2", "n": "", "vs": [[2, "فإنكم تعرفون الوصايا التي لقناكم إياها من قبل الرب يسوع."]]}, {"l": "Num 16:15", "n": "", "vs": [[15, "فاحتدم غيظ موسى وقال للرب: «لا تقبل تقدمتهما، فأنا لم آخذ حتى حمارا واحدا منهما، ولم أسيء إلى أحد منهما»."]]}, {"l": "1Sa 12:3", "n": "", "vs": [[3, "فاشهدوا علي في حضرة الرب، وأمام ملكه المختار، إن كنت قد أخذت ثورا أو حمارا من أحد، أو ظلمت أو جرت على أحد أو قبلت رشوة من أحد لأغمض عيني عنه، فأعوض ذلك عليكم»."]]}, {"l": "Act 20:33", "n": "", "vs": [[33, "ما اشتهيت يوما فضة ولا ذهبا ولا ثوبا من عند أحد."]]}, {"l": "Act 20:34", "n": "", "vs": [[34, "وأنتم تعلمون أني اشتغلت بيدي هاتين لأسد حاجاتي وحاجات مرافقي."]]}, {"l": "2Co 2:17", "n": "", "vs": [[17, "فإننا لا نتاجر بكلمة الله كما يفعل الكثيرون، وإنما بإخلاص ومن قبل الله، وأمام الله، نتكلم في المسيح."]]}, {"l": "2Co 4:2", "n": "", "vs": [[2, "ولكننا قد رفضنا الأساليب الخفية المخجلة، إذ لا نسلك في المكر، ولا نزور كلمة الله، بل بإعلاننا للحق نمدح أنفسنا لدى ضمير كل إنسان، أمام الله."]]}, {"l": "2Co 4:5", "n": "", "vs": [[5, "فإننا لا نبشر بأنفسنا، بل بالمسيح يسوع ربا، وما نحن إلا عبيد لكم من أجل يسوع."]]}, {"l": "2Co 7:2", "n": "", "vs": [[2, "أفسحوا لنا مكانا في قلوبكم: فنحن لم نعامل أحدا معاملة ظالمة، ولم نؤذ أحدا، ولم نستغل أحدا."]]}, {"l": "2Co 11:13", "n": "", "vs": [[13, "فإن أمثال هؤلاء هم رسل دجالون، عمال ماكرون، يظهرون أنفسهم بمظهر رسل المسيح."]]}, {"l": "2Co 12:16-18", "n": "", "vs": [[16, "ولكن، ليكن كذلك. (تقولون) إني لم أثقل عليكم بنفسي، ولكني كنت محتالا فسلبتكم بمكر."], [17, "هل كسبت منكم شيئا بأحد من الذين أرسلتهم إليكم؟"], [18, "التمست من تيطس أن يتوجه إليكم، وأرسلت معه ذلك الأخ، فهل غنم منكم تيطس شيئا؟ ألم نتصرف معكم، أنا وتيطس، بروح واحد وخطوات واحدة؟"]]}, {"l": "2Pe 1:16", "n": "", "vs": [[16, "فنحن، عندما أخبرناكم بقدرة ربنا يسوع المسيح، وبعودته المجيدة، لم نكن ننقل عن أساطير مختلقة بمهارة. وإنما، تكلمنا باعتبارنا شهود عيان لعظمة المسيح."]]}], "kwAr": "", "noteAr": ""}], "arS": [["فما كان ", []], ["وعظنا", ["G3874"]], [" صادرا عن ", []], ["ضلال", ["G4106"]], [" ولا عن ", []], ["نجاسة", ["G167"]], ["، ولا خالطه ", []], ["مكر", ["G1388"]], ["،", []]]}, {"c": 2, "v": 4, "text": "بل إننا نتكلم كمن تبين من اختبار الله لهم أنهم أهل لأن يؤتمنوا على الإنجيل، لنرضي لا الناس بل الله الذي يختبر قلوبنا.", "groups": [{"kw": "as we", "raw": "1Co_7:25; Eph_3:8; 1Ti_1:11-13", "note": "", "refs": [{"l": "1Co 7:25", "n": "", "vs": [[25, "وأما العزاب، فليس عندي لهم وصية خاصة من الرب، ولكني أعطي رأيا باعتباري نلت رحمة من الرب لأكون جديرا بالثقة."]]}, {"l": "Eph 3:8", "n": "", "vs": [[8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "1Ti 1:11-13", "n": "", "vs": [[11, "الموافق لإنجيل مجد الله المبارك، ذلك الإنجيل الذي وضع أمانة بين يدي."], [12, "وكم أشكر المسيح يسوع ربنا الذي أعطاني القدرة وعينني خادما له، إذ اعتبرني جديرا بثقته،"], [13, "مع أني كنت في الماضي مجدفا عليه، ومضطهدا ومهينا له! ولكني عوملت بالرحمة، لأني عملت ما عملته عن جهل وفي عدم إيمان."]]}], "kwAr": "كمن تبين من اختبار الله", "noteAr": ""}, {"kw": "to be", "raw": "Luk_12:42, Luk_16:11; 1Co_4:1, 1Co_4:2, 1Co_9:17; Gal_2:7; 1Ti_1:11, 1Ti_1:12, 1Ti_6:20; 2Ti_1:14; 2Ti_2:2; Tit_1:3", "note": "", "refs": [{"l": "Luk 12:42", "n": "", "vs": [[42, "فقال الرب: «من هو إذن الوكيل الأمين العاقل الذي يقيمه سيده على أهل بيته ليقدم لهم حصتهم من الطعام في حينها؟"]]}, {"l": "Luk 16:11", "n": "", "vs": [[11, "فإن لم تكونوا أمناء في مال الظلم، فمن يأتمنكم على مال الحق؟"]]}, {"l": "1Co 4:1", "n": "", "vs": [[1, "فلينظر إلينا الناس باعتبارنا خداما للمسيح ووكلاء على أسرار الله."]]}, {"l": "1Co 4:2", "n": "", "vs": [[2, "والمطلوب من الوكلاء، قبل كل شيء، أن يوجد كل منهم أمينا."]]}, {"l": "1Co 9:17", "n": "", "vs": [[17, "فإن قمت بذلك متطوعا، كانت لي مكافأة. ولكن، إن كنت مرغما، فأنا مؤتمن على مسئولية،"]]}, {"l": "Gal 2:7", "n": "", "vs": [[7, "بل بالعكس، رأوا أنه عهد إلي بالإنجيل لأهل عدم الختان، كما عهد به إلى بطرس لأهل الختان."]]}, {"l": "1Ti 1:11", "n": "", "vs": [[11, "الموافق لإنجيل مجد الله المبارك، ذلك الإنجيل الذي وضع أمانة بين يدي."]]}, {"l": "1Ti 1:12", "n": "", "vs": [[12, "وكم أشكر المسيح يسوع ربنا الذي أعطاني القدرة وعينني خادما له، إذ اعتبرني جديرا بثقته،"]]}, {"l": "1Ti 6:20", "n": "", "vs": [[20, "ياتيموثاوس، حافظ على الأمانة المودعة لديك. تجنب الكلام الدنس الباطل، ومناقضات ما يسمى زورا «معرفة»."]]}, {"l": "2Ti 1:14", "n": "", "vs": [[14, "وحافظ على الأمانة الكريمة المودعة لديك، بالروح القدس الحال فينا."]]}, {"l": "2Ti 2:2", "n": "", "vs": [[2, "والتعاليم التي سمعتها مني بحضور شهود عديدين، أودعها أمانة بين أيدي أناس جديرين بالثقة، يكونون قادرين على تعليم الآخرين."]]}, {"l": "Tit 1:3", "n": "", "vs": [[3, "ثم بين كلمته في أوانها المعين: بالبشارة التي وضعت أمانة بين يدي بموجب أمر مخلصنا الله …"]]}], "kwAr": "أن يؤتمنوا على الإنجيل", "noteAr": ""}, {"kw": "not", "raw": "1Co_2:4, 1Co_2:5; 2Co_4:2, 2Co_5:11, 2Co_5:16; Gal_1:10; Eph_6:6; Col_3:22", "note": "", "refs": [{"l": "1Co 2:4", "n": "", "vs": [[4, "ولم يقم كلامي وتبشيري على الإقناع بكلام الحكمة، بل على ما يعلنه الروح والقدرة."]]}, {"l": "1Co 2:5", "n": "", "vs": [[5, "وذلك لكي يتأسس إيمانكم لا على حكمة الناس، بل على قدرة الله."]]}, {"l": "2Co 4:2", "n": "", "vs": [[2, "ولكننا قد رفضنا الأساليب الخفية المخجلة، إذ لا نسلك في المكر، ولا نزور كلمة الله، بل بإعلاننا للحق نمدح أنفسنا لدى ضمير كل إنسان، أمام الله."]]}, {"l": "2Co 5:11", "n": "", "vs": [[11, "فبدافع وعينا لرهبة الرب، نحاول إقناع الناس. ولكننا ظاهرون أمام الله، وأرجو أن نكون ظاهرين أيضا في ضمائركم."]]}, {"l": "2Co 5:16", "n": "", "vs": [[16, "إذن، نحن منذ الآن لا نعرف أحدا معرفة بشرية. ولكن إن كنا قد عرفنا المسيح معرفة بشرية، فنحن الآن لا نعرفه هكذا بعد."]]}, {"l": "Gal 1:10", "n": "", "vs": [[10, "فهل أسعى الآن إلى كسب تأييد الناس أو الله؟ أم تراني أطلب أن أرضي الناس؟ لو كنت حتى الآن أرضي الناس، لما كنت عبدا للمسيح!"]]}, {"l": "Eph 6:6", "n": "", "vs": [[6, "غير عاملين بجد فقط حين تكون عيونهم عليكم كمن يحاول إرضاء الناس، بل انطلاقا من كونكم عبيدا للمسيح،"]]}, {"l": "Col 3:22", "n": "", "vs": [[22, "أيها العبيد، أطيعوا في كل أمر سادتكم البشريين، فلا تعملوا بجد فقط حين تكون عيونهم عليكم، كمن يحاول إرضاء الناس، بل بقلب صادق خائفين الرب."]]}], "kwAr": "لنرضي لا الناس", "noteAr": ""}, {"kw": "but God", "raw": "Num_27:16; 1Ki_8:39; 1Ch_29:17; Psa_7:9, Psa_17:3, Psa_44:21, Psa_139:1, Psa_139:2; Pro_17:3; Jer_17:10, Jer_32:19; Joh_2:24, Joh_2:25, Joh_21:17; Rom_8:27; Heb_4:13; Rev_2:23", "note": "", "refs": [{"l": "Num 27:16", "n": "", "vs": [[16, "«ليقم الرب، إله أرواح جميع الناس، قائدا للشعب،"]]}, {"l": "1Ki 8:39", "n": "", "vs": [[39, "فاستجب أنت من السماء مقر سكناك، واصفح واعمل، واجز كل إنسان بمقتضى طرقه، لأنك تعرف قلبه، فأنت وحدك المطلع على خفايا قلوب الناس،"]]}, {"l": "1Ch 29:17", "n": "", "vs": [[17, "وأنا أعلم ياإلهي أنك تفحص القلوب وتسر بالاستقامة، وأنا قدمت إليك كل هذه بقلب مستقيم، كذلك رأيت شعبك الماثل هنا يتبرع عن رضى بابتهاج."]]}, {"l": "Psa 7:9", "n": "", "vs": [[9, "ضع حدا لشر الأشرار، وأثبت براءة الأبرار، أيها الإله العادل فاحص القلوب والدخائل."]]}, {"l": "Psa 17:3", "n": "", "vs": [[3, "اختبرت قلبي إذ افتقدتني ليلا، وامتحنتني فلم تجد في سوءا. لم تخالف أقوالي أفكاري."]]}, {"l": "Psa 44:21", "n": "", "vs": [[21, "ألا يعرف الله ذلك وهو علام الغيوب؟"]]}, {"l": "Psa 139:1", "n": "", "vs": [[1, "يارب قد فحصتني وعرفتني."]]}, {"l": "Psa 139:2", "n": "", "vs": [[2, "أنت عرفت قعودي ونهوضي. فهمت فكري من بعيد."]]}, {"l": "Pro 17:3", "n": "", "vs": [[3, "كما تنقي البوتقة الفضة، والكور الذهب، فإن الرب يمتحن القلوب أيضا."]]}, {"l": "Jer 17:10", "n": "", "vs": [[10, "أنا الرب أفحص القلوب وأمتحن الأفكار، لأجازي كل واحد حسب طرقه، وبمقتضى أفعاله»."]]}, {"l": "Jer 32:19", "n": "", "vs": [[19, "عظيم في المشورة وقادر في العمل، وعيناك مفتوحتان تراقبان جميع طرق الإنسان لتجازي كل واحد حسب تصرفاته وثمار أعماله."]]}, {"l": "Joh 2:24", "n": "", "vs": [[24, "ولكنه هو لم يأتمنهم على نفسه، لأنه كان يعرف الجميع"]]}, {"l": "Joh 2:25", "n": "", "vs": [[25, "ولم يكن بحاجة إلى من يشهد له عن الإنسان، لأنه يعرف دخيلة الإنسان."]]}, {"l": "Joh 21:17", "n": "", "vs": [[17, "فسأله مرة ثالثة: «ياسمعان بن يونا، أتحبني؟» فحزن بطرس لأن يسوع قال له في المرة الثالثة: «أتحبني». وقال له: «يارب، أنت تعلم كل شيء. أنت تعلم أني أحبك!» فقال له يسوع: «أطعم خرافي!"]]}, {"l": "Rom 8:27", "n": "", "vs": [[27, "على أن فاحص القلوب يعلم قصد الروح، لأن الروح يشفع في القديسين بما يوافق الله ."]]}, {"l": "Heb 4:13", "n": "", "vs": [[13, "وليس هنالك مخلوق واحد محجوب عن نظر الله، بل كل شيء عريان ومكشوف أمام عينيه، هو الذي سنؤدي له حسابا."]]}, {"l": "Rev 2:23", "n": "", "vs": [[23, "سأبيد أولادها بالموت، فتعرف الكنائس كلها أنني أنا الذي أفحص الأفكار والقلوب، وأجازي كل واحد منكم بحسب أعماله."]]}], "kwAr": "بل الله الذي يختبر قلوبنا", "noteAr": ""}], "arS": [["بل إننا ", []], ["نتكلم", ["G2980"]], [" كمن تبين من ", []], ["اختبار", ["G1381"]], [" ", []], ["الله", ["G2316"]], [" لهم أنهم أهل لأن ", []], ["يؤتمنوا", ["G4100"]], [" على ", []], ["الإنجيل", ["G2098"]], ["، ", []], ["لنرضي", ["G700"]], [" لا ", []], ["الناس", ["G444"]], [" بل ", []], ["الله", ["G2316"]], [" الذي ", []], ["يختبر", ["G1381"]], [" ", []], ["قلوبنا", ["G2588", "G2257"]], [".", []]]}, {"c": 2, "v": 5, "text": "وكما تعلمون أيضا، فإننا لم نستعمل معكم قط كلام التملق، ولا اتخذنا ذريعة للطمع إنما الله شاهد", "groups": [{"kw": "used", "raw": "Job_17:5, Job_32:21, Job_32:22; Psa_12:2, Psa_12:3; Pro_20:19, Pro_26:28, Pro_28:23; Isa_30:10; Mat_22:16; 2Pe_2:18", "note": "", "refs": [{"l": "Job 17:5", "n": "", "vs": [[5, "ولتتلف عيون أبناء من يشي بأصحابه طمعا في أملاكهم."]]}, {"l": "Job 32:21", "n": "", "vs": [[21, "لن أحابي إنسانا أو أتملق أحدا."]]}, {"l": "Job 32:22", "n": "", "vs": [[22, "لأني لا أعرف التملق، وإلا يقضي علي صانعي سريعا."]]}, {"l": "Psa 12:2", "n": "", "vs": [[2, "كل إنسان يخاطب صاحبه بالباطل: بشفاه ملقة وقلوب منافقة يتحادثون."]]}, {"l": "Psa 12:3", "n": "", "vs": [[3, "يقطع الرب كل الشفاه الملقة، وكل لسان متبجح."]]}, {"l": "Pro 20:19", "n": "", "vs": [[19, "الواشي يفشي الأسرار، فلا تخالط من يكثر الثرثرة."]]}, {"l": "Pro 26:28", "n": "", "vs": [[28, "اللسان الكاذب يمقت ضحاياه، والفم الملق يسبب خرابا."]]}, {"l": "Pro 28:23", "n": "", "vs": [[23, "من يوبخ إنسانا يحظى من بعد برضاه أكثر ممن يتملق بلسانه."]]}, {"l": "Isa 30:10", "n": "", "vs": [[10, "ويقولون للأنبياء: «لا تتنبأوا لنا بما هو حق، بل كلمونا بالكلام المداهن وتنبأوا بالمخادعات."]]}, {"l": "Mat 22:16", "n": "", "vs": [[16, "فأرسلوا إليه بعض تلاميذهم مع أعضاء حزب هيرودس، يقولون له: «يامعلم، نعلم أنك صادق وتعلم الناس طريق الله في الحق، ولا تبالي بأحد لأنك لا تراعي مقامات الناس،"]]}, {"l": "2Pe 2:18", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."]]}], "kwAr": "لم نستعمل معكم قط كلام التملق", "noteAr": ""}, {"kw": "a cloak", "raw": "Isa_56:11; Jer_6:13, Jer_8:10; Mic_3:5; Mal_1:10; Mat_23:14; Act_20:33; Rom_16:18; 2Co_2:17, 2Co_4:2, 2Co_7:2, 2Co_12:17; 1Ti_3:3, 1Ti_3:8; Tit_1:7; 1Pe_5:2; 2Pe_2:3, 2Pe_2:14, 2Pe_2:15; Jud_1:11; Rev_18:12, Rev_18:13", "note": "", "refs": [{"l": "Isa 56:11", "n": "", "vs": [[11, "هم كلاب نهمة لا تعرف الشبع، ورعاة أيضا مجردون من الفهم، كل مال إلى طريقه طمعا في الربح،"]]}, {"l": "Jer 6:13", "n": "", "vs": [[13, "لأنهم جميعا، صغارهم وكبارهم، مولعون بالربح الحرام. حتى النبي والكاهن يرتكبان الزور في أعمالهما."]]}, {"l": "Jer 8:10", "n": "", "vs": [[10, "لذلك أعطي نساءهم لآخرين وحقولهم للوارثين القاهرين، لأنهم جميعا من صغيرهم إلى كبيرهم مولعون بالربح. حتى النبي والكاهن يرتكبان الزور في أعمالهما،"]]}, {"l": "Mic 3:5", "n": "", "vs": [[5, "وهذا ما يقوله الرب بشأن الأنبياء الذين يضلون شعبه، الذين ينادون قائلين: «سلام» لمن يعطيهم طعاما، ويعلنون الحرب على من لا يلقم أفواههم."]]}, {"l": "Mal 1:10", "n": "", "vs": [[10, "آه، ياليت بينكم من يغلق أبواب الهيكل لئلا توقدوا نارا باطلة على مذبحي، يقول الرب القدير: إذ لا مسرة لي بكم ولا أرضى بتقدمة من أيديكم."]]}, {"l": "Mat 23:14", "n": "", "vs": [[14, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تلتهمون بيوت الأرامل وتتذرعون بإطالة صلواتكم. لذلك ستنزل بكم دينونة أقسى!"]]}, {"l": "Act 20:33", "n": "", "vs": [[33, "ما اشتهيت يوما فضة ولا ذهبا ولا ثوبا من عند أحد."]]}, {"l": "Rom 16:18", "n": "", "vs": [[18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."]]}, {"l": "2Co 2:17", "n": "", "vs": [[17, "فإننا لا نتاجر بكلمة الله كما يفعل الكثيرون، وإنما بإخلاص ومن قبل الله، وأمام الله، نتكلم في المسيح."]]}, {"l": "2Co 4:2", "n": "", "vs": [[2, "ولكننا قد رفضنا الأساليب الخفية المخجلة، إذ لا نسلك في المكر، ولا نزور كلمة الله، بل بإعلاننا للحق نمدح أنفسنا لدى ضمير كل إنسان، أمام الله."]]}, {"l": "2Co 7:2", "n": "", "vs": [[2, "أفسحوا لنا مكانا في قلوبكم: فنحن لم نعامل أحدا معاملة ظالمة، ولم نؤذ أحدا، ولم نستغل أحدا."]]}, {"l": "2Co 12:17", "n": "", "vs": [[17, "هل كسبت منكم شيئا بأحد من الذين أرسلتهم إليكم؟"]]}, {"l": "1Ti 3:3", "n": "", "vs": [[3, "لا مدمنا للخمر ولا عنيفا؛ بل لطيفا، غير متعود الخصام، غير مولع بالمال،"]]}, {"l": "1Ti 3:8", "n": "", "vs": [[8, "أما المدبرون، فيجب أن يكونوا أيضا ذوي رصانة، لا ذوي لسانين، ولا مدمنين للخمر، لا ساعين إلى المكسب الخسيس."]]}, {"l": "Tit 1:7", "n": "", "vs": [[7, "وذلك لأن الناظر يجب أن يكون بريئا من كل تهمة باعتباره وكيلا لله، لا معجبا بنفسه ولا حاد الطبع، ولا مدمن الخمر، ولا عنيفا، ولا ساعيا إلى المكسب الخسيس؛"]]}, {"l": "1Pe 5:2", "n": "", "vs": [[2, "ارعوا قطيع الله الذي بينكم، كحراس له، لا بدافع الواجب، بل بدافع التطوع، كما يريد الله ، ولا رغبة في الربح الدنيء، بل رغبة في الخدمة بنشاط."]]}, {"l": "2Pe 2:3", "n": "", "vs": [[3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "2Pe 2:14", "n": "", "vs": [[14, "عيونهم لا تنظر إلا نظرات الزنى، ولا تشبع من الخطيئة. وكم من نفوس ضعيفة تقع في فخاخهم! أما قلوبهم، فقد تدربت على الشهوة والطمع. إنهم حقا أبناء اللعنة!"]]}, {"l": "2Pe 2:15", "n": "", "vs": [[15, "وإذ خرجوا عن الطريق المستقيم، ضلوا. فهم سائرون في طريق بلعام بن بعور، الذي أحب الحصول على المال أجرة لإثمه."]]}, {"l": "Jud 1:11", "n": "", "vs": [[11, "الويل لهم! لأنهم سلكوا طريق قايين، واندفعوا إلى ارتكاب خطيئة بلعام طلبا للمال، وتمردوا كما تمرد قورح، فدمروا أنفسهم."]]}, {"l": "Rev 18:12", "n": "", "vs": [[12, "فقد كانت هي تشتري منهم الذهب والفضة والحجارة الكريمة واللؤلؤ، والكتان والأرجوان والحرير والقرمز، وجميع الأخشاب العطرة وأدوات العاج والمصنوعات الخشبية الثمينة، والنحاس والحديد والرخام،"]]}, {"l": "Rev 18:13", "n": "", "vs": [[13, "والقرفة والبهار، والعطور والطيب والبخور، والخمر والزيت والدقيق والحبوب، والبهائم والغنم، والخيل والمركبات، والأجساد والنفوس البشرية"]]}], "kwAr": "ذريعة للطمع", "noteAr": ""}, {"kw": "God", "raw": "Rom_1:9, Rom_9:1; Gal_1:20", "note": "", "refs": [{"l": "Rom 1:9", "n": "", "vs": [[9, "فإن الله الذي أخدمه بروحي في التبشير بإنجيل ابنه، هو شاهد لي كيف لا أتوقف عن ذكركم"]]}, {"l": "Rom 9:1", "n": "", "vs": [[1, "أقول الحق في المسيح، لست أكذب، وضميري شاهد لي في الروح القدس،"]]}, {"l": "Gal 1:20", "n": "", "vs": [[20, "إن ما أكتبه إليكم هنا، وها أنا أمام الله، لست أكذب فيه."]]}], "kwAr": "الله شاهد", "noteAr": ""}], "arS": [["وكما ", []], ["تعلمون", ["G1492"]], [" أيضا، فإننا لم نستعمل معكم ", []], ["قط", ["G4218"]], [" ", []], ["كلام التملق", ["G3056", "G2850"]], ["، ولا اتخذنا ", []], ["ذريعة", ["G4392"]], [" ", []], ["للطمع", ["G4124"]], [" إنما ", []], ["الله", ["G2316"]], [" ", []], ["شاهد", ["G3144"]]]}, {"c": 2, "v": 6, "text": "ولا سعينا لنوال مجد من الناس، لا منكم ولا من غيركم،", "groups": [{"kw": "of men", "raw": "Est_1:4, Est_5:11; Pro_25:27; Dan_4:30; Joh_5:41, Joh_5:44, Joh_7:18, Joh_12:43; Gal_1:10; Gal_5:26, Gal_6:13; 1Ti_5:17", "note": "", "refs": [{"l": "Est 1:4", "n": "", "vs": [[4, "وظلت الولائم قائمة طوال مئة وثمانين يوما، أظهر فيها الملك كل بذخ من غنى ملكه وعزة جلال عظمته."]]}, {"l": "Est 5:11", "n": "", "vs": [[11, "وراح يعدد أمامهم ما يملك من ثروات ومن بنين، وكل ما أنعم عليه الملك به من عظمة وجاه، حتى صارت مرتبته فوق مرتبة جميع رؤساء الملك ورجاله!"]]}, {"l": "Pro 25:27", "n": "", "vs": [[27, "كما أن الإكثار من التهام العسل مضر، كذلك التماس المجد الذاتي مدعاة للهوان."]]}, {"l": "Dan 4:30", "n": "", "vs": [[30, "قال: «أليست هذه هي بابل العظيمة التي بنيتها بقوة اقتداري لتكون عاصمة للمملكة، ولجلال مجدي؟»"]]}, {"l": "Joh 5:41", "n": "", "vs": [[41, "لست أقبل مجدا من عند الناس."]]}, {"l": "Joh 5:44", "n": "", "vs": [[44, "من أين لكم أن تؤمنوا بي وأنتم تقبلون المجد بعضكم من بعض، دون أن تسعوا في طلب المجد الذي لا يمنحه إلا الله !"]]}, {"l": "Joh 7:18", "n": "", "vs": [[18, "من يتكلم من عنده يطلب المجد لنفسه؛ أما الذي يطلب المجد لمن أرسله فهو صادق لا إثم فيه."]]}, {"l": "Joh 12:43", "n": "", "vs": [[43, "مفضلين المجد الآتي من الناس على المجد الآتي من الله."]]}, {"l": "Gal 1:10", "n": "", "vs": [[10, "فهل أسعى الآن إلى كسب تأييد الناس أو الله؟ أم تراني أطلب أن أرضي الناس؟ لو كنت حتى الآن أرضي الناس، لما كنت عبدا للمسيح!"]]}, {"l": "Gal 5:26", "n": "", "vs": [[26, "لا نكن طامحين إلى المجد الباطل، يستفز بعضنا بعضا، ويحسد أحدنا الآخر!"]]}, {"l": "Gal 6:13", "n": "", "vs": [[13, "فحتى أولئك الذين يختنون، هم أنفسهم، لا يعملون بالشريعة، بل يريدون لكم أن تختنوا ليفتخروا بجسدكم."]]}, {"l": "1Ti 5:17", "n": "", "vs": [[17, "أما الشيوخ الذين يحسنون القيادة، فليعتبروا أهلا للإكرام المضاعف، وبخاصة الذين يبذلون الجهد في نشر الكلمة وفي التعليم."]]}], "kwAr": "ولا سعينا لنوال مجد من الناس", "noteAr": ""}, {"kw": "when", "raw": "1Th_2:9; 1Co_9:4, 1Co_9:6, 1Co_9:12-18; 2Co_10:1, 2Co_10:2, 2Co_10:10,2Co_10:11, 2Co_13:10; Phm_1:8, Phm_1:9", "note": "", "refs": [{"l": "1Th 2:9", "n": "", "vs": [[9, "فأنتم تذكرون، أيها الإخوة، جهدنا وكدنا، إذ بشرناكم بإنجيل الله ونحن نشتغل ليلا ونهارا لكي لا نكون عبئا ثقيلا على أحد منكم."]]}, {"l": "1Co 9:4", "n": "", "vs": [[4, "أليس لنا حق أن نأكل ونشرب؟"]]}, {"l": "1Co 9:6", "n": "", "vs": [[6, "أم أنا وبرنابا وحدنا لا حق لنا أن ننقطع عن العمل؟"]]}, {"l": "1Co 9:12-18", "n": "", "vs": [[12, "إن كان لغيرنا هذا الحق عليكم، أفلا نكون نحن أحق؟ ولكننا لم نستعمل هذا الحق؟ بل نتحمل كل شيء، مخافة أن نضع أي عائق أمام إنجيل المسيح !"], [13, "أما تعلمون أن الذين يشتغلون بالمقدسات كانوا يأكلون مما يقدم إلى الهيكل، وأن الذين يقومون بخدمة المذبح، كانوا يشتركون في خيرات المذبح؟"], [14, "هكذا أيضا رسم الرب للذين يبشرون بالإنجيل أن يعيشوا من الإنجيل."], [15, "على أني لم أستعمل أيا من هذه الحقوق. وما كتبت هذا الآن لأحظى بشيء. فإني أفضل الموت على أن يعطل أحد فخري."], [16, "فمادمت أبشر بالإنجيل، فليس في ذلك فخر لي، لأنه واجب مفروض علي فالويل لي إن كنت لا أبشر!"], [17, "فإن قمت بذلك متطوعا، كانت لي مكافأة. ولكن، إن كنت مرغما، فأنا مؤتمن على مسئولية،"], [18, "فما هي مكافأتي إذن؟ هي أني في تبشيري أجعل الإنجيل بلا كلفة، غير مستغل كامل حقي لقاء التبشير بالإنجيل."]]}, {"l": "2Co 10:1", "n": "", "vs": [[1, "ولكني أتوسل إليكم بوداعة المسيح وحلمه، أنا بولس «المتواضع وأنا حاضر بينكم، والجريء عليكم وأنا غائب عنكم»،"]]}, {"l": "2Co 10:2", "n": "", "vs": [[2, "راجيا ألا تضطروني لأن أكون جريئا عند حضوري، فألجأ إلى الحزم الذي أظن أني سأتجرأ عليه في معاملة من يظنون منكم أننا نسلك وفقا للجسد."]]}, {"l": "2Co 10:10", "n": "", "vs": [[10, "فمنكم من يقول: «رسائله شديدة اللهجة وقوية؛ أما حضوره الشخصي فضعيف، وكلامه حقير»."]]}, {"l": "2Co 10:11", "n": "", "vs": [[11, "فليتنبه مثل هذا إلى أننا كما نكون بالقول في الرسائل ونحن غائبون، كذلك نحن أيضا بالفعل ونحن حاضرون."]]}, {"l": "2Co 13:10", "n": "", "vs": [[10, "لهذا أكتب إليكم بهذه الأمور وأنا غائب، حتى إذا حضرت لا ألجأ إلى الحزم بحسب السلطة التي منحني إياها الرب للبنيان لا للهدم."]]}, {"l": "Phm 1:8", "n": "", "vs": [[8, "لذلك، فمع أن لي كامل الحق في المسيح أن آمرك بالواجب،"]]}, {"l": "Phm 1:9", "n": "", "vs": [[9, "إلا أني، إكراما للمحبة، اخترت أن أقدم إليك التماسا، بصفتي بولس العجوز والسجين حاليا لأجل المسيح يسوع."]]}], "kwAr": "مع أن لنا الحق", "noteAr": ""}, {"kw": "been burdensome", "raw": "or, used authority, 1Co_11:9, 1Co_12:13-15; 1Th_3:8, 1Th_3:9", "note": "or, used authority, 1Co_11:9, 1Co_12:13-15; 1Th_3:8, 1Th_3:9", "refs": [{"l": "1Co 11:9", "n": "", "vs": [[9, "والرجل لم يوجد لأجل المرأة، بل المرأة وجدت لأجل الرجل."]]}, {"l": "1Co 12:13-15", "n": "", "vs": [[13, "فإننا، بالروح الواحد، قد تعمدنا جميعا لنصير جسدا واحدا، سواء كنا يهودا أم يونانيين، عبيدا أم أحرارا، وقد سقينا جميعا الروح الواحد."], [14, "فليس الجسد عضوا واحدا بل مجموعة أعضاء."], [15, "فإن قالت الرجل: «لأني لست يدا، لست من الجسد!» فهل تصبح من خارج الجسد فعلا؟"]]}, {"l": "1Th 3:8", "n": "", "vs": [[8, "فقد طابت لنا الحياة مادمتم ثابتين في الرب!"]]}, {"l": "1Th 3:9", "n": "", "vs": [[9, "فأي شكر نستطيع أن نؤديه إلى الله عوضا عنكم من أجل كل ما نبتهج به من الفرح بسببكم أمام إلهنا،"]]}], "kwAr": "نفرض أنفسنا عليكم", "noteAr": "أو: استعملنا سلطاننا (ثِقلنا)."}, {"kw": "as the", "raw": "1Co_9:1, 1Co_9:2, 1Co_9:4-6", "note": "", "refs": [{"l": "1Co 9:1", "n": "", "vs": [[1, "ألست أنا حرا؟ أولست رسولا؟ أما رأيت يسوع ربنا؟ ألستم أنتم عمل يدي في الرب؟"]]}, {"l": "1Co 9:2", "n": " ": [[13, "ففي أي مجال كنتم أصغر قدرا من الكنائس الأخرى إلا في أني لم أكن عبئا ثقيلا عليكم؟ اغفروا لي هذه الإساءة!"]]}, {"l": "2Co 12:14", "n": "", "vs": [[14, "أنا مستعد الآن أن آتي إليكم مرة ثالثة، ولن أكون عبئا ثقيلا عليكم. فما أسعى إليه ليس هو ما عندكم بل هو أنتم: لأنه ليس على الأولاد أن يوفروا لوالديهم، بل على الوالدين أن يوفروا لأولادهم."]]}], "kwAr": "عبئا ثقيلا", "noteAr": ""}, {"kw": "the gospel", "raw": "1Th_2:2; Act_20:24; Rom_1:1, Rom_15:16, Rom_15:19; 1Ti_1:11", "note": "", "refs": [{"l": "1Th 2:2", "n": "", "vs": [[2, "فمع أننا كنا قد قاسينا الألم والإهانة في مدينة فيلبي، كما تعلمون، فقد تجرأنا في إلهنا أن نكلمكم بإنجيل الله مجاهدين في وجه المعارضة الشديدة."]]}, {"l": "Act 20:24", "n": "", "vs": [[24, "ولكني لا أحسب لحياتي أية قيمة، ما دمت أسعى إلى بلوغ غايتي وإتمام الخدمة التي كلفني إياها الرب يسوع: أن أشهد ببشارة نعمة الله."]]}, {"l": "Rom 1:1", "n": "", "vs": [[1, "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"]]}, {"l": "Rom 15:16", "n": "", "vs": [[16, "وبذلك أكون خادم المسيح يسوع، المرسل إلى الأمم، حاملا إنجيل الله وكأني أقوم بخدمة كهنوتية، بقصد أن ترفع لله من بين الأمم تقدمة تكون مقبولة ومقدسة بالروح القدس."]]}, {"l": "Rom 15:19", "n": "", "vs": [[19, "وبقوة الآيات والعجائب، وبقوة روح الله. حتى إنني، من أورشليم وما حولها حتى مقاطعة إليريكون، قد أكملت التبشير بإنجيل المسيح."]]}, {"l": "1Ti 1:11", "n": "", "vs": [[11, "الموافق لإنجيل مجد الله المبارك، ذلك الإنجيل الذي وضع أمانة بين يدي."]]}], "kwAr": "بإنجيل الله", "noteAr": ""}], "arS": [["فأنتم ", []], ["تذكرون", ["G3421"]], ["، أيها ", []], ["الإخوة", ["G80"]], ["، ", []], ["جهدنا", ["G2873"]], [" ", []], ["وكدنا", ["G3449"]], ["، إذ ", []], ["بشرناكم", ["G2784"]], [" ", []], ["بإنجيل", ["G2098"]], [" ", []], ["الله", ["G2316"]], [" ونحن ", []], ["نشتغل", ["G2038"]], [" ", []], ["ليلا", ["G3571"]], [" ", []], ["ونهارا", ["G2250"]], [" لكي لا نكون ", []], ["عبئا ثقيلا", ["G1912"]], [" على ", []], ["أحد", ["G5100"]], [" منكم.", []]]}, {"c": 2, "v": 10, "text": "فأنتم تشهدون، ويشهد الله ، كيف تصرفنا بينكم، أنتم المؤمنين، بطهارة واستقامة وبراءة من اللوم،", "groups": [{"kw": "witnesses", "raw": "1Th_1:5; 1Sa_12:3-5; Act_20:18, Act_20:26, Act_20:33, Act_20:34; 2Co_4:2, 2Co_5:11, 2Co_11:11, 2Co_11:31", "note": "", "refs": [{"l": "1Th 1:5", "n": "", "vs": [[5, "لأن تبشيرنا لكم بالإنجيل لم يكن مجرد كلام، بل كان مصحوبا أيضا بالقوة وبالروح القدس وبتمام اليقين. كما أنكم تعلمون تماما ماذا كنا بينكم لأجل مصلحتكم،"]]}, {"l": "1Sa 12:3-5", "n": "", "vs": [[3, "فاشهدوا علي في حضرة الرب، وأمام ملكه المختار، إن كنت قد أخذت ثورا أو حمارا من أحد، أو ظلمت أو جرت على أحد أو قبلت رشوة من أحد لأغمض عيني عنه، فأعوض ذلك عليكم»."], [4, "فأجابوه:«لم تظلمنا ولم تجر علينا ولا أخذت شيئا من أحد»."], [5, "فقال لهم: «ليكن الرب وملكه المختار شاهدين في هذا اليوم على براءتي الكاملة». فقالوا: «يشهد الرب»."]]}, {"l": "Act 20:18", "n": "", "vs": [[18, "فلما جاءوا إليه، قال لهم:"]]}, {"l": "Act 20:26", "n": "", "vs": [[26, "لذلك أشهد لكم اليوم أني بريء من دمكم جميعا،"]]}, {"l": "Act 20:33", "n": "", "vs": [[33, "ما اشتهيت يوما فضة ولا ذهبا ولا ثوبا من عند أحد."]]}, {"l": "Act 20:34", "n": "", "vs": [[34, "وأنتم تعلمون أني اشتغلت بيدي هاتين لأسد حاجاتي وحاجات مرافقي."]]}, {"l": "2Co 4:2", "n": "", "vs": [[2, "ولكننا قد رفضنا الأساليب الخفية المخجلة، إذ لا نسلك في المكر، ولا نزور كلمة الله، بل بإعلاننا للحق نمدح أنفسنا لدى ضمير كل إنسان، أمام الله."]]}, {"l": "2Co 5:11", "n": "", "vs": [[11, "فبدافع وعينا لرهبة الرب، نحاول إقناع الناس. ولكننا ظاهرون أمام الله، وأرجو أن نكون ظاهرين أيضا في ضمائركم."]]}, {"l": "2Co 11:11", "n": "", "vs": [[11, "لماذا؟ ألأني لا أحبكم؟ الله يعلم!"]]}, {"l": "2Co 11:31", "n": "", "vs": [[31, "ويعلم الله ، أبو ربنا يسوع، المبارك إلى الأبد، أني لست أكذب:"]]}], "kwAr": "فأنتم تشهدون", "noteAr": ""}, {"kw": "how", "raw": "Num_16:15; Job_29:11-17, 31:1-39; Psa_7:3-5, Psa_18:20-24; Jer_18:20; Act_24:16; 2Co_1:12, 2Co_6:3-10, 2Co_7:2; 2Th_3:7; 1Ti_4:12; 2Ti_3:10; Tit_2:7, Tit_2:8; 1Pe_5:3", "note": "", "refs": [{"l": "Num 16:15", "n": "", "vs": [[15, "فاحتدم غيظ موسى وقال للرب: «لا تقبل تقدمتهما، فأنا لم آخذ حتى حمارا واحدا منهما، ولم أسيء إلى أحد منهما»."]]}, {"l": "Job 29:11-17", "n": "", "vs": [[11, "إذا سمعت لي الأذن تطوبني، وإذا شهدتني العين تثني علي،"], [12, "لأ ني أنقذت البائس المستغيث، وأجرت اليتيم طالب العون،"], [13, "فحلت علي بركة المشرف على الموت، وجعلت قلب الأرملة يتهلل فرحا."], [14, "ارتديت البر فكساني، وكجبة وعمامة كان عدلي."], [15, "كنت عيونا للأعمى، وأقداما للأعرج،"], [16, "وكنت أبا للمسكين، أتقصى دعوى من لم أعرفه."], [17, "هشمت أنياب الظالم ومن بين أسنانه نزعت الفريسة،"]]}, {"l": "Job 31:1-39", "n": "", "vs": [[1, "أبرمت عهدا مع عيني، فكيف أرنو إلى عذراء؟"], [2, "وماذا يكون نصيبي عند الله من فوق، وما هو إرثي من عند القدير في الأعالي؟"], [3, "أليست البلية من حظ الشرير، والكارثة من نصيب فاعلي الإثم؟"], [4, "ألا يرى الله طرقي ويحصي كل خطواتي؟"], [5, "إن سلكت في ضلال وأسرعت قدمي لارتكاب الغش،"], [6, "فلأوزن في قسطاس العدل، وليعرف الله كمالي."], [7, "إن حادت خطواتي عن الطريق، وغوى قلبي وراء عيني، وعلقت بيدي لطخة عار،"], [8, "فلأزرع أنا وآخر يأكل، وليستأصل محصولي."], [9, "إن هام قلبي وراء امرأة، أو طفت عند باب جاري،"], [10, "فلتطحن زوجتي لآخر، وليضاجعها آخرون."], [11, "لأن هذه رذيلة وإثم يعاقب عليه القضاة،"], [12, "ونار ملتهمة تفضي إلى الهلاك وتقضي على غلاتي."], [13, "إن كنت قد تنكرت لحق خادمي وأمتي عندما اشتكيا علي،"], [14, "فماذا أصنع عندما يقوم الله (لمحاكمتي)؟ وبماذا أجيب عندما يتقصى (ليحاسبني)؟"], [15, "أليس الذي كونني في الرحم كونه أيضا؟ أو ليس الذي شكلنا في الرحم واحد؟"], [16, "إن كنت قد منعت عن المسكين ما يطلبه، أو أوهنت عيني الأرملة من فرط البكاء،"], [17, "أو أكلت كسرة خبزي وحدي ولم أتقاسمها مع اليتيم،"], [18, "إذ منذ حداثتي رعيته كأب، وهديته من رحم أمه."], [19, "إن كنت قد رأيت أحدا مشرفا على الهلاك من العري، أو مسكينا من غير كساء،"], [20, "إن لم تباركني حقواه المستدفئتان بجزة غنمي!"], [21, "إن كنت قد رفعت يدي ضد اليتيم، مستغلا نفوذي في القضاء،"], [22, "فليسقط عضدي من كتفي، ولتنكسر ذراعي من قصبتها."], [23, "لأنني أرتعب من نقمة الله، وما كنت أقوى على مواجهة جلاله."], [24, "إن كنت قد جعلت الذهب متكلي، أو قلت للإبريز أنت معتمدي،"], [25, "إن كنت قد اغتبطت بعظم ثروتي، أو لأن يدي فاضتا بوفرة الكسب،"], [26, "إن كنت قد نظرت إلى الشمس حين أضاءت، أو إلى القمر السائر ببهاء،"], [27, "فغوي قلبي سرا وقبلت يدي توقيرا لهما،"], [28, "فإن هذا أيضا إثم يعاقب عليه القضاة، لأني أكون قد جحدت الله العلي."], [29, "إن كنت قد فرحت بدمار مبغضي أو شمت حين أصابه شر،"], [30, "لا! لم أدع لساني يخطيء بالدعاء على حياته بلعنة."], [31, "إن كان أهل خيمتي لم يقولوا: أهناك من لم يشبع من طعام أيوب؟"], [32, "فالغريب لم يبت في الشارع لأني فتحت أبوابي لعابري السبيل."], [33, "إن كنت قد كتمت آثامي كبقية الناس، طاويا ذنوبي في حضني،"], [34, "رهبة من الجماهير الغفيرة، وخوفا من إهانة العشائر، وصمت واعتصمت داخل الأبواب."], [35, "آه من لي بمن يستمع لي! هوذا توقيعي، فليجبني القدير. ليت خصمي يكتب شكواه ضدي،"], [36, "فأحملها على كتفي وأعصبها تاجا لي،"], [37, "لكنت أقدم له حسابا عن كل خطواتي، وأدنو منه كما أدنو من أمير."], [38, "إن كانت أرضي قد احتجت علي وتباكت أتلامها جميعا،"], [39, "إن كنت قد أكلت غلاتها بلا ثمن، أو سحقت نفوس أصحابها،"]]}, {"l": "Psa 7:3-5", "n": "", "vs": [[3, "أيها الرب إلهي، إن كنت قد اقترفت هذه الإساءة، وكانت يداي قد ارتكبتا هذا الإثم،"], [4, "إن كنت قد أسأت لمن أحسن إلي وسلبت عدوي من غير سبب،"], [5, "إذن فليطارد العدو نفسي وينزعها مني، وليدس في الأرض حياتي، ويعفر في التراب شرفي."]]}, {"l": "Psa 18:20-24", "n": "", "vs": [[20, "يكافئني الرب بمقتضى بري ويعوضني حسب طهارة يدي،"], [21, "لأني سلكت دائما في طرق الرب ولم أعص إلهي."], [22, "جعلت أحكامه دائما نصب عيني، ولم أحد عن فرائضه."], [23, "وأكون معه كاملا وأصون نفسي من إثمي."], [24, "فيكافئني الرب وفقا لبري، بحسب طهارة يدي أمام عينيه."]]}, {"l": "Jer 18:20", "n": "", "vs": [[20, "هل يجازى عن خير بشر؟ قد نقروا حفرة لنفسي. اذكر كيف وقفت أمامك أثني عليهم خيرا لأصرف غضبك عنهم."]]}, {"l": "Act 24:16", "n": "", "vs": [[16, "لذلك أنا أيضا أدرب نفسي لكي أحيا دائما بضمير نقي أمام الله والناس."]]}, {"l": "2Co 1:12", "n": "", "vs": [[12, "فإن فخرنا هو هذا: شهادة ضميرنا بأننا، في قداسة الله وإخلاصه، قد سلكنا في العالم، وبخاصة تجاهكم؛ ولم يكن ذلك بحكمة بشرية بل بنعمة الله."]]}, {"l": "2Co 6:3-10", "n": "", "vs": [[3, "ولسنا نتصرف أي تصرف يكون عثرة لأحد، حتى لا يلحق الخدمة أي لوم."], [4, "وإنما نتصرف في كل شيء بما يبين أننا فعلا خدام الله: في تحمل الكثير؛ في الشدائد والحاجات والضيقات والجلدات"], [5, "والسجون والاضطرابات والأتعاب والسهر والصوم؛"], [6, "في الطهارة والمعرفة وطول البال واللطف؛ في الروح القدس والمحبة الخالصة من الرياء؛"], [7, "في كلمة الحق وقدرة الله؛ بأسلحة البر في الهجوم والدفاع؛"], [8, "بالكرامة والهوان؛ بالصيت السييء والصيت الحسن. نعامل كمضللين ونحن صادقون،"], [9, "كمجهولين ونحن معروفون، كمائتين وها نحن نحيا ، كمعاقبين ولا نقتل،"], [10, "كمحزونين ونحن دائما فرحون، كفقراء ونحن نغني كثيرين، كمن لا شيء عندهم ونحن نملك كل شيء."]]}, {"l": "2Co 7:2", "n": "", "vs": [[2, "أفسحوا لنا مكانا في قلوبكم: فنحن لم نعامل أحدا معاملة ظالمة، ولم نؤذ أحدا، ولم نستغل أحدا."]]}, {"l": "2Th 3:7", "n": "", "vs": [[7, "فأنتم أنفسكم تعرفون كيف ينبغي أن تقتدوا بنا، لأن سلوكنا بينكم لم يكن فوضويا،"]]}, {"l": "1Ti 4:12", "n": "", "vs": [[12, "لا يستخف أحد بحداثة سنك. وإنما كن قدوة للمؤمنين، في الكلام والسلوك والمحبة والإيمان والطهارة."]]}, {"l": "2Ti 3:10", "n": "", "vs": [[10, "وأما أنت، فقد عرفت جيدا تعليمي، وسيرتي، وهدفي، وإيماني، وتحملي للمشقات، ومحبتي، وثباتي،"]]}, {"l": "Tit 2:7", "n": "", "vs": [[7, "جاعلا من نفسك في كل شيء قدوة للأعمال الصالحة، مظهرا في تعليمك النقاوة والوقار"]]}, {"l": "Tit 2:8", "n": "", "vs": [[8, "والكلمة الصحيحة التي لا تلام، لكي يخجل المقاوم حين لا يجد أمرا سيئا يقوله فينا."]]}, {"l": "1Pe 5:3", "n": "", "vs": [[3, "لا تتسلطوا على القطيع الذي وضعه الله أمانة بين أيديكم، بل كونوا قدوة له."]]}], "kwAr": "كيف تصرفنا بينكم", "noteAr": ""}], "arS": [["فأنتم ", []], ["تشهدون", ["G3144"]], ["، ويشهد ", []], ["الله", ["G2316"]], [" ، كيف ", []], ["تصرفنا", ["G1096"]], [" بينكم، أنتم ", []], ["المؤمنين", ["G4100"]], ["، ", []], ["بطهارة", ["G3743"]], [" ", []], ["واستقامة", ["G1346"]], [" ", []], ["وبراءة من اللوم", ["G274"]], ["،", []]]}, {"c": 2, "v": 11, "text": "كما أنكم تعلمون كيف عاملناكم معاملة الأب لأولاده، فكنا نعظ كل واحد منكم ونشجعكم", "groups": [{"kw": "", "raw": "have, 1Th_4:1, 1Th_5:11; Act_20:2; 2Th_3:12; 1Ti_6:2; 2Ti_4:2; Tit_2:6, Tit_2:9, Tit_2:15; Heb_13:22", "note": "have, 1Th_4:1, 1Th_5:11; Act_20:2; 2Th_3:12; 1Ti_6:2; 2Ti_4:2; Tit_2:6, Tit_2:9, Tit_2:15; Heb_13:22", "refs": [{"l": "1Th 4:1", "n": "", "vs": [[1, "وبعد، أيها الإخوة، فمثلما تلقيتم منا كيف يجب أن تسلكوا سلوكا يرضي الله ، وكما أنتم فاعلون، نرجو منكم ونحرضكم في الرب يسوع أن تضاعفوا تقدمكم في ذلك أكثر فأكثر."]]}, {"l": "1Th 5:11", "n": "", "vs": [[11, "لذلك عزوا بعضكم بعضا وشددوا أحدكم الآخر، كما أنتم فاعلون."]]}, {"l": "Act 20:2", "n": "", "vs": [[2, "وتجول فيها يعظ ويشجع التلاميذ في كل مكان. وأخيرا وصل إلى اليونان،"]]}, {"l": "2Th 3:12", "n": "", "vs": [[12, "فمثل هؤلاء نوصيهم ونناشدهم، في الرب يسوع المسيح، أن يكسبوا معيشتهم بأنفسهم، مشتغلين بهدوء."]]}, {"l": "1Ti 6:2", "n": "", "vs": [[2, "وعلى الذين لهم سادة مؤمنون أن لا يستخفوا بهم لأنهم إخوة لهم، بل بالأحرى أن يخدموهم بخضوع، لأن المستفيدين من خدمتهم الصالحة هم مؤمنون محبوبون."]]}, {"l": "2Ti 4:2", "n": "", "vs": [[2, "أن تنادي بالكلمة منشغلا بها كليا، في الفرص المناسبة وغير المناسبة على السواء، وأن توبخ وتنذر وتشجع بكل صبر في التعليم."]]}, {"l": "Tit 2:6", "n": "", "vs": [[6, "كذلك عظ الشبان أن يكونوا متعقلين،"]]}, {"l": "Tit 2:9", "n": "", "vs": [[9, "وعلم العبيد أن يكونوا خاضعين لسادتهم، مرضين لهم في كل شيء؛ غير معاندين؛"]]}, {"l": "Tit 2:15", "n": "", "vs": [[15, "بهذه الأمور تكلم، وعظ، ووبخ بكل سلطان، ولا تدع أحدا يستخف بك!"]]}, {"l": "Heb 13:22", "n": "", "vs": [[22, "إنما أسألكم، أيها الإخوة، أن تحتملوا ما وجهته إليكم من كلام الوعظ في هذه الرسالة، وهو قليل!"]]}], "kwAr": "", "noteAr": "كنا نعظكم؛ انظر 1تس 4: 1؛ 5: 11؛ أع 20: 2."}, {"kw": "charged", "raw": "Num_27:19; Deu_3:28, Deu_31:14; Eph_4:17; 1Ti_5:7, 1Ti_5:21, 1Ti_6:13, 1Ti_6:17; 2Ti_4:1", "note": "", "refs": [{"l": "Num 27:19", "n": "", "vs": [[19, "ثم أوقفه أمام ألعازار وأمام الجماعة كلها، وأوصه بحضرتهم،"]]}, {"l": "Deu 3:28", "n": "", "vs": [[28, "إنما يشوع هو الذي يقود هذا الشعب، وهو الذي يقسم لهم الأرض التي تشاهدها. كذلك أوصه وثبته وشجعه."]]}, {"l": "Deu 31:14", "n": "", "vs": [[14, "وكان الرب قد قال لموسى: «ها أنت قد أوشكت على الموت، وأيام حياتك باتت معدودة. فادع يشوع، وقفا كلاكما عند خيمة الاجتماع لكي أوصيه». فمضى موسى ويشوع ومثلا عند خيمة الاجتماع."]]}, {"l": "Eph 4:17", "n": "", "vs": [[17, "أقول هذا إذن، وأشهد في الرب، راجيا ألا تسلكوا فيما بعد كما يسلك الأمم في عقم ذهنهم،"]]}, {"l": "1Ti 5:7", "n": "", "vs": [[7, "وعليك أن توصي بهذه الأمور، لكي يكون الجميع بلا لوم."]]}, {"l": "1Ti 5:21", "n": "", "vs": [[21, "أطلب منك أمام الله والمسيح والملائكة المختارين أن تعمل بهذه التوصيات دون مراعاة أشخاص، فلا تعمل شيئا بتحيز."]]}, {"l": "1Ti 6:13", "n": "", "vs": [[13, "وأوصيك، أمام الله الذي يحيي كل شيء، والمسيح يسوع الذي شهد أمام بيلاطس البنطي بالاعتراف الحسن،"]]}, {"l": "1Ti 6:17", "n": "", "vs": [[17, "أوص أغنياء هذا الزمان بأن لا يتكبروا، ولا يتكلوا على الغنى غير الثابت، بل على الله الذي يمنحنا كل شيء بوفرة لنتمتع به،"]]}, {"l": "2Ti 4:1", "n": "", "vs": [[1, "أطلب منك في حضرة الله والمسيح الذي سيدين الأحياء والأموات، بعودته العلنية وملكوته،"]]}], "kwAr": "ونحرضكم", "noteAr": ""}, {"kw": "as", "raw": "Gen_50:16, Gen_50:17; 1Ch_22:11-13, 1Ch_28:9, 1Ch_28:20; Psa_34:11; Pro_1:10,Pro_1:15, Pro_2:1, Pro_3:1; Pro_4:1-12, Pro_5:1, Pro_5:2, Pro_6:1, Pro_7:1, Pro_7:24, Pro_31:1-9; 1Co_4:14, 1Co_4:15", "note": "", "refs": [{"l": "Gen 50:16", "n": "", "vs": [[16, "فبعثوا إليه رسولا قائلين: «لقد أوصى أبوك قبل موته وقال:"]]}, {"l": "Gen 50:17", "n": "", "vs": [[17, "هكذا تقولون ليوسف: اغفر لإخوتك ذنبهم وخطيئتهم، فإنهم قد أساءوا إليك. فالآن اصفح عن إثم عبيد إله أبيك». فلما بلغته رسالتهم بكى يوسف."]]}, {"l": "1Ch 22:11-13", "n": "", "vs": [[11, "والآن ياابني ليكن الرب معك فيحالفك التوفيق في بناء بيت الرب إلهك كما تكلم عنك،"], [12, "وليمنحك الرب فطنة ومعرفة عندما يوليك على إسرائيل لتطيع شريعة الرب إلهك،"], [13, "حينئذ تفلح، إذ تحرص على ممارسة الفرائض والأحكام التي أمر بها الرب موسى وسنها لإسرائيل. تشجع وتقو، لا تجزع ولا ترتعب."]]}, {"l": "1Ch 28:9", "n": "", "vs": [[9, "أما أنت ياابني سليمان، فاعرف إله أبيك واعبده بكمال قلب، وبنفس راغبة، لأن الرب يتفحص جميع القلوب، ويفهم كل تصور وفكر. فإن طلبته تجده، وإن تركته ينبذك إلى الأبد."]]}, {"l": "1Ch 28:20", "n": "", "vs": [[20, "فتقو وتشجع واعمل. لا تجزع ولا ترتعب لأن الرب الإله إلهي معك، ولن يخذلك ولا يتركك حتى تستوفي كل عمل خدمة هيكل الرب."]]}, {"l": "Psa 34:11", "n": "", "vs": [[11, "تعالوا أيها البنون وأصغوا إلي، فأعلمكم مخافة الرب."]]}, {"l": "Pro 1:10", "n": "", "vs": [[10, "ياابني إن استغواك الخطاة فلا تقبل."]]}, {"l": "Pro 1:15", "n": "", "vs": [[15, "إن قالوا لك هكذا فلا تسلك ياابني في طريقهم، واكفف قدمك عن سبيلهم."]]}, {"l": "Pro 2:1", "n": "", "vs": [[1, "ياابني إن قبلت كلامي، وادخرت وصاياي في قلبك،"]]}, {"l": "Pro 3:1", "n": "", "vs": [[1, "ياابني لا تنس تعاليمي، وليراع قلبك وصاياي."]]}, {"l": "Pro 4:1-12", "n": "", "vs": [[1, "استمعوا أيها البنون إلى إرشاد الأب، وأصغوا لتكتسبوا الفطنة،"], [2, "فإني أقدم لكم تعليما صالحا، فلا تهملوا شريعتي."], [3, "عندما كنت ابنا لأبي، غضا وحيدا لأمي،"], [4, "قال لي: «ادخر في قلبك كلامي، واحفظ وصاياي فتحيا."], [5, "لا تنس ولا تعرض عن أقوال فمي، بل تلقن الحكمة واقتن الفطنة."], [6, "لا تنبذها فتحفظك. أحببها فتصونك."], [7, "بداية الحكمة أن تكسب حكمة، واقتن الفطنة ولو بذلت كل ما تملك."], [8, "مجدها فتمجدك، اعتنقها فتكرمك."], [9, "تتوج رأسك بإكليل جمال، وتنعم عليك بتاج بهاء»."], [10, "استمع ياابني وتقبل أقوالي، لتطول سنو حياتك."], [11, "قد أرشدتك إلى طريق الحكمة، وهديتك في مناهج الاستقامة."], [12, "عندما تمشي لا تضيق خطواتك، وحين تركض لا تتعثر."]]}, {"l": "Pro 5:1", "n": "", "vs": [[1, "ياابني أصغ إلى حكمتي، وأرهف أذنك إلى قول فطنتي."]]}, {"l": "Pro 5:2", "n": "", "vs": [[2, "لكي تدخر الفطنة، وترعى شفتاك العلم."]]}, {"l": "Pro 6:1", "n": "", "vs": [[1, "ياابني إن ضمنت أحدا، وإن أخذت على نفسك عهدا للغريب؛"]]}, {"l": "Pro 7:1", "n": "", "vs": [[1, "ياابني احفظ أقوالي واذخر وصاياي معك."]]}, {"l": "Pro 7:24", "n": "", "vs": [[24, "والآن أصغوا إلي أيها الأبناء، وأرهفوا آذانكم إلى أقوال فمي:"]]}, {"l": "Pro 31:1-9", "n": "", "vs": [[1, "هذه أقوال لموئيل ملك مسا التي تلقنها من أمه:"], [2, "ماذا ياابني ياابن أحشائي، ياابن نذوري؟"], [3, "لا تنفق قوتك على النساء، ولا تستسلم لمن يهلكن الملوك."], [4, "ليس للملوك يالموئيل، ليس للملوك أن يدمنوا الخمر، ولا للعظماء أن يجرعوا المسكر."], [5, "لئلا يسكروا فينسوا الشريعة، ويجوروا على حقوق البائسين."], [6, "أعطوا المسكر للهالك، والخمر لذوي النفوس التعسة،"], [7, "فيثملوا وينسوا فقرهم، ولا يذكروا بؤسهم بعد."], [8, "افتح فمك مدافعا عن الأخرس، وفي دعوى كل منبوذ."], [9, "افتح فمك قاضيا بالعدل، ودافع عن حقوق الفقراء والمحتاجين."]]}, {"l": "1Co 4:14", "n": "", "vs": [[14, "لا أكتب هذا تخجيلا لكم، بل أنبهكم باعتباركم أولادي الأحباء."]]}, {"l": "1Co 4:15", "n": "", "vs": [[15, "فقد يكون لكم عشر ة آلاف من المرشدين في المسيح، ولكن ليس لكم آباء كثيرون! لأني أنا ولدتكم في المسيح يسوع بالإنجيل."]]}], "kwAr": "معاملة الأب لأولاده", "noteAr": ""}], "arS": [["كما أنكم ", []], ["تعلمون", ["G1492"]], [" كيف عاملناكم معاملة ", []], ["الأب", ["G3962"]], [" ", []], ["لأولاده", ["G5043"]], ["، فكنا ", []], ["نعظ", ["G3870"]], [" ", []], ["كل واحد", ["G1538", "G1520"]], [" منكم ", []], ["ونشجعكم", ["G3888"]]]}, {"c": 2, "v": 12, "text": "ونحرضكم أن تسلكوا سلوكا يليق بالله، ذاك الذي يدعوكم إلى ملكوته ومجده.", "groups": [{"kw": "walk", "raw": "1Th_4:1, 1Th_4:12; Gal_5:16; Eph_4:1, Eph_5:2, Eph_5:8; Phi_1:27; Col_1:10, Col_2:6; 1Pe_1:15, 1Pe_1:16; 1Jo_1:6, 1Jo_1:7, 1Jo_2:6", "note": "", "refs": [{"l": "1Th 4:1", "n": "", "vs": [[1, "وبعد، أيها الإخوة، فمثلما تلقيتم منا كيف يجب أن تسلكوا سلوكا يرضي الله ، وكما أنتم فاعلون، نرجو منكم ونحرضكم في الرب يسوع أن تضاعفوا تقدمكم في ذلك أكثر فأكثر."]]}, {"l": "1Th 4:12", "n": "", "vs": [[12, "عندئذ تكون سيرتكم حسنة السمعة تجاه الذين من خارج الكنيسة، ولا تكونون في حاجة إلى شيء."]]}, {"l": "Gal 5:16", "n": "", "vs": [[16, "إنما أقول: اسلكوا في الروح. وعندئذ لا تتممون شهوة الجسد أبدا."]]}, {"l": "Eph 4:1", "n": "", "vs": [[1, "... إذن، أنا السجين في الرب، أناشدكم أن تسلكوا سلوكا يليق بالدعوة التي إليها دعيتم،"]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "Eph 5:8", "n": "", "vs": [[8, "فقد كنتم في الماضي ظلاما، ولكنكم الآن نور في الرب. فاسلكوا سلوك أولاد النور."]]}, {"l": "Phi 1:27", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"]]}, {"l": "Col 1:10", "n": "", "vs": [[10, "لكي تسلكوا سلوكا لائقا بالرب ومرضيا في كل شيء، منتجين الثمر في كل عمل صالح ونامين في معرفة الله إلى التمام،"]]}, {"l": "Col 2:6", "n": "", "vs": [[6, "فمثلما قبلتم المسيح يسوع الرب، ففيه اسلكوا"]]}, {"l": "1Pe 1:15", "n": "", "vs": [[15, "وإنما اسلكوا سلوكا مقدسا في كل أمر، مقتدين بالقدوس الذي دعاكم،"]]}, {"l": "1Pe 1:16", "n": "", "vs": [[16, "لأنه قد كتب: «كونوا قديسين، لأني أنا قدوس!»"]]}, {"l": "1Jo 1:6", "n": "", "vs": [[6, "فإن كنا ندعي أن لنا شركة معه، ونحن نعيش في الظلام، نكون كاذبين ولا نمارس الحق."]]}, {"l": "1Jo 1:7", "n": "", "vs": [[7, "ولكن، إن كنا فعلا نعيش في النور، كما هو في النور، تكون لنا حقا شركة بعضنا مع بعض، ودم ابنه يسوع يطهرنا من كل خطيئة."]]}, {"l": "1Jo 2:6", "n": "", "vs": [[6, "كل من يعترف أنه ثابت في المسيح، يلتزم أن يسلك كما سلك المسيح!"]]}], "kwAr": "أن تسلكوا سلوكا يليق بالله", "noteAr": ""}, {"kw": "who", "raw": "1Th_5:24; Rom_8:30, Rom_9:23, Rom_9:24; 1Co_1:9; 2Th_1:11, 2Th_1:12, 2Th_2:13, 2Th_2:14; 2Ti_1:9; 1Pe_1:15, 1Pe_2:9, 1Pe_3:9, 1Pe_5:10", "note": "", "refs": [{"l": "1Th 5:24", "n": "", "vs": [[24, "فإن الله الذي يدعوكم صادق، وسوف يتم ذلك."]]}, {"l": "Rom 8:30", "n": "", "vs": [[30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."]]}, {"l": "Rom 9:23", "n": "", "vs": [[23, "وذلك بقصد أن يعلن غنى مجده في أوعية الرحمة التي سبق فأعدها للمجد،"]]}, {"l": "Rom 9:24", "n": "", "vs": [[24, "فينا نحن الذين دعاهم لا من بين اليهود فقط بل من بين الأمم أيضا؟"]]}, {"l": "1Co 1:9", "n": "", "vs": [[9, "فإن الله أمين، وقد دعاكم إلى الشركة مع ابنه يسوع ربنا."]]}, {"l": "2Th 1:11", "n": "", "vs": [[11, "لأجل ذلك أيضا نصلي من أجلكم على الدوام، لكي يجعلكم إلهنا مؤهلين للدعوة الإلهية ويتم فيكم، بقدرته، كل ما يسره من الصلاح وفعالية الإيمان،"]]}, {"l": "2Th 1:12", "n": "", "vs": [[12, "حتى يتمجد اسم ربنا يسوع فيكم وتتمجدوا أنتم فيه وفقا لنعمة إلهنا وربنا يسوع المسيح."]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "2Th 2:14", "n": "", "vs": [[14, "فإلى هذا الأمر قد دعاكم ببشارتنا لكم، لنوال مجد ربنا يسوع المسيح."]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،"]]}, {"l": "1Pe 1:15", "n": "", "vs": [[15, "وإنما اسلكوا سلوكا مقدسا في كل أمر، مقتدين بالقدوس الذي دعاكم،"]]}, {"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}, {"l": "1Pe 3:9", "n": "", "vs": [[9, "لا تبادلوا الشر بشر، ولا الشتيمة بشتيمة. بل بالعكس: باركوا، فترثوا البركة، لأنه لهذا دعاكم الله ."]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}], "kwAr": "الذي يدعوكم إلى ملكوته ومجده", "noteAr": ""}], "arS": [["ونحرضكم", ["G3140"]], [" أن ", []], ["تسلكوا", ["G4043"]], [" سلوكا ", []], ["يليق", ["G516"]], [" ", []], ["بالله", ["G2316"]], ["، ذاك الذي ", []], ["يدعوكم", ["G2564"]], [" إلى ", []], ["ملكوته", ["G932"]], [" ", []], ["ومجده", ["G1391"]], [".", []]]}, {"c": 2, "v": 13, "text": "ولذلك نحن أيضا نرفع الشكر لله بلا توقف، لأنكم لما تلقيتم منا كلمة البشارة من الله، قبلتموها لا كأنها كلمة بشر، بل كما هي في الحقيقة: باعتبارها كلمة الله العاملة أيضا فيكم أنتم المؤمنين.", "groups": [{"kw": "thank", "raw": "1Th_1:2, 1Th_1:3; Rom_1:8, Rom_1:9", "note": "", "refs": [{"l": "1Th 1:2", "n": "", "vs": [[2, "إننا نشكر الله دائما من أجلكم جميعا، إذ نذكركم في صلواتنا دون توقف؛"]]}, {"l": "1Th 1:3", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"]]}, {"l": "Rom 1:8", "n": "", "vs": [[8, "بادىء بدء، أشكر إلهي بيسوع المسيح من أجلكم جميعا، لأن إيمانكم يذاع خبره في العالم كله."]]}, {"l": "Rom 1:9", "n": "", "vs": [[9, "فإن الله الذي أخدمه بروحي في التبشير بإنجيل ابنه، هو شاهد لي كيف لا أتوقف عن ذكركم"]]}], "kwAr": "نرفع الشكر لله بلا توقف", "noteAr": ""}, {"kw": "because", "raw": "Jer_44:16; Mat_10:13, Mat_10:14, Mat_10:40; Act_2:41, Act_10:33, Act_13:45, Act_13:48, Act_16:14, Act_16:30-34; Act_17:11, Act_17:18-20,Act_17:32; Gal_4:14; 2Pe_3:2", "note": "", "refs": [{"l": "Jer 44:16", "n": "", "vs": [[16, "«لن نطيعك في ما خاطبتنا به من كلام باسم الرب،"]]}, {"l": "Mat 10:13", "n": "", "vs": [[13, "فإذا كان ذلك البيت مستحقا فعلا، فليحل سلامكم عليه. وإن لم يكن مستحقا، فليرجع سلامكم لكم"]]}, {"l": "Mat 10:14", "n": "", "vs": [[14, "وإن كان أحد لا يقبلكم ولا يسمع كلامكم في بيت أو مدينة، فاخرجوا من هناك، وانفضوا الغبار عن أقدامكم."]]}, {"l": "Mat 10:40", "n": "", "vs": [[40, "من يقبلكم، يقبلني؛ ومن يقبلني، يقبل الذي أرسلني."]]}, {"l": "Act 2:41", "n": "", "vs": [[41, "فالذين قبلوا كلامه منهم تعمدوا. وانضم في ذلك اليوم نحو ثلاثة آلاف نفس."]]}, {"l": "Act 10:33", "n": "", "vs": [[33, "فأرسلت حالا أدعوك، وقد أحسنت بمجيئك. ونحن الآن جميعا حاضرون أمام الله لنسمع كل ما أمرك به الرب»."]]}, {"l": "Act 13:45", "n": "", "vs": [[45, "فلما رأى اليهود الجموع ملأت الغيرة صدورهم، وأخذوا يعارضون كلام بولس مجدفين."]]}, {"l": "Act 13:48", "n": "", "vs": [[48, "فلما سمع غير اليهود ذلك، فرحوا جدا، ومجدوا كلمة الرب. وآمن جميع من أعدهم الله للحياة الأبدية."]]}, {"l": "Act 16:14", "n": "", "vs": [[14, "ومن بينهن تاجرة أرجوان من مدينة ثياتيرا، متعبدة لله، اسمها ليدية، كانت تسمع ففتح الله قلبها لتقبل كلام بولس."]]}, {"l": "Act 16:30-34", "n": "", "vs": [[30, "ثم أخرجهما خارجا وسألهما: «ياسيدي، ماذا ينبغي أن أفعل لكي أخلص؟»"], [31, "فأجاباه: «آمن بالرب يسوع فتخلص أنت وأهل بيتك!»"], [32, "ثم بشراه وأهل بيته جميعا بكلمة الرب."], [33, "فأخذهما في تلك الساعة من الليل وغسل جراحهما وتعمد حالا هو وأهل بيِته جميعا."], [34, "ثم ذهب بهما إلى بيته وبسط لهما مائدة. وابتهج مع أهل بيته جميعا، إذ كان قد آمن بالله."]]}, {"l": "Act 17:11", "n": "", "vs": [[11, "وكان يهود بيرية أشرف من يهود تسالونيكي، فقبلوا كلمة الله برغبة شديدة، وأخذوا يدرسون الكتاب يوميا ليتأكدوا من صحة التعليم."]]}, {"l": "Act 17:18-20", "n": "", "vs": [[18, "وجرت مناقشة بينه وبين بعض الفلاسفة الأبيقوريين والرواقيين. ولما وجدوا أنه يبشر بيسوع والقيامة من الموت قال بعضهم: «ماذا يعني هذا المدعي الأحمق بكلامه؟» وقال آخرون: «يبدو أنه ينادي بآلهة غريبة»."], [19, "ثم قادوه إلى تلة أريوباغوس (حيث مجلس المدينة) وسألوه: «هل لنا أن نعرف ما هو المذهب الجديد الذي تنادي به؟"], [20, "إننا نسمع منك أقوالا غريبة نريد أن نعرف معناها»."]]}, {"l": "Act 17:32", "n": "", "vs": [[32, "وما إن سمع الحاضرون بالقيامة من بين الأموات حتى بدأ بعضهم يستهزئون. ولكن آخرين قالوا لبولس: «نود أن تحدثنا في هذا الموضوع ثانية»."]]}, {"l": "Gal 4:14", "n": "", "vs": [[14, "ومع أن العلة التي في جسدي كانت تجربة لكم، فإنكم لم تحتقروني ولم تنفروا مني بسببها، بل قبلتموني كأني ملاك من عند الله، أو كأني المسيح يسوع."]]}, {"l": "2Pe 3:2", "n": "", "vs": [[2, "وغايتي أن تتذكروا الأقوال التي أعلنها الأنبيا ء القديسون قديما، وكذلك وصية الرب والمخلص، تلك الوصية التي نقلها إليكم الرسل."]]}], "kwAr": "لأنكم لما تلقيتم منا", "noteAr": ""}, {"kw": "the word of God", "raw": "Jer_23:28, Jer_23:29; Luk_5:1, Luk_8:11, Luk_8:21, Luk_11:28; Act_8:14, Act_13:44, Act_13:46; Rom_10:17; Heb_4:12; 1Pe_1:25; 2Pe_1:16-21", "note": "", "refs": [{"l": "Jer 23:28", "n": "", "vs": [[28, "فليقص النبي الحالم حلمه. ولكن من لديه كلمتي فليعلنها بالحق، إذ ماذا يجمع بين التبن والحنطة؟"]]}, {"l": "Jer 23:29", "n": "", "vs": [[29, "أليست كلمتي كالنار، وكالمطرقة التي تحطم الصخور؟"]]}, {"l": "Luk 5:1", "n": "", "vs": [[1, "وبينما كان الجمع محتشدين حوله ليسمعوا كلمة الله، كان هو واقفا على شاطيء بحيرة جنيسارت."]]}, {"l": "Luk 8:11", "n": "", "vs": [[11, "وهذا مغزى المثل: البذار هو كلمة الله."]]}, {"l": "Luk 8:21", "n": "", "vs": [[21, "ولكنه أجابهم قائلا: «أمي وإخوتي هم الذين يسمعون كلمة الله ويعملون بها»."]]}, {"l": "Luk 11:28", "n": "", "vs": [[28, "إلا أنه قال: «بل طوبى للذين يسمعون كلمة الله ويعملون بها»."]]}, {"l": "Act 8:14", "n": "", "vs": [[14, "وسمع الرسل في أورشليم أن أهل السامرة قبلوا كلمة الله، فأرسلوا إليهم بطرس ويوحنا."]]}, {"l": "Act 13:44", "n": "", "vs": [[44, "وفي السبت التالي اجتمع أهل المدينة كلهم تقريبا ليسمعوا كلمة الله."]]}, {"l": "Act 13:46", "n": "", "vs": [[46, "فخاطبهم بولس وبرنابا بجرأة قائلين: «كان يجب أن نبلغكم أنتم أولا كلمة الله، ولكنكم رفضتموها فأظهرتم أنكم لا تستحقون الحياة الأبدية. وها نحن نتوجه إلى غير اليهود!"]]}, {"l": "Rom 10:17", "n": "", "vs": [[17, "إذا، الإيمان نتيجة السماع، والسماع هو من التبشير بكلمة المسيح !"]]}, {"l": "Heb 4:12", "n": "", "vs": [[12, "ذلك لأن كلمة الله حية، وفعاله، وأمضى من كل سيف له حدان، وخارقة إلى مفترق النفس والروح والمفاصل ونخاع العظام، وقادرة أن تميز أفكار القلب ونياته."]]}, {"l": "1Pe 1:25", "n": "", "vs": [[25, "أما كلمة الرب فتبقى ثابتة إلى الأبد، وهي الكلمة التي وصلت بشارتها إليكم!"]]}, {"l": "2Pe 1:16-21", "n": "", "vs": [[16, "فنحن، عندما أخبرناكم بقدرة ربنا يسوع المسيح، وبعودته المجيدة، لم نكن ننقل عن أساطير مختلقة بمهارة. وإنما، تكلمنا باعتبارنا شهود عيان لعظمة المسيح."], [17, "فإنه قد نال من الله الآب كرامة ومجدا، إذ جاءه من المجد الفائق صوت يقول: «هذا هو ابني الحبيب الذي به سررت كل سرور!»"], [18, "ونحن أنفسنا قد سمعنا هذا الصوت الصادر من السماء لما كنا معه على الجبل المقدس."], [19, "وهكذا، صارت الكلمة النبوية أكثر ثباتا عندنا. فحسنا تفعلون إن انتبهتم إلى هذه الكلمة في قلوبكم. إذ إنها أشبه بمصباح يضيء في مكان مظلم، إلى أن يطلع النهار ويظهر كوكب الصبح."], [20, "ولكن، قبل كل شيء، اعلموا أن كل نبوءة واردة في الكتاب لا تفسر باجتهاد خاص."], [21, "إذ لم تأت نبوءة قط بإرادة بشرية، بل تكلم بالنبوآت جميعا رجال الله غالقديسونف مدفوعين بوحي الروح القدس."]]}], "kwAr": "كلمة الله", "noteAr": ""}, {"kw": "effectually", "raw": "1Th_1:5-10; Joh_15:3, Joh_17:17, Joh_17:19; Rom_6:17, Rom_6:18; 2Co_3:18; Col_1:6; Heb_4:12; Jam_1:18; 1Pe_1:23, 1Pe_2:2; 1Jo_3:3, 1Jo_5:4, 1Jo_5:5", "note": "", "refs": [{"l": "1Th 1:5-10", "n": "", "vs": [[5, "لأن تبشيرنا لكم بالإنجيل لم يكن مجرد كلام، بل كان مصحوبا أيضا بالقوة وبالروح القدس وبتمام اليقين. كما أنكم تعلمون تماما ماذا كنا بينكم لأجل مصلحتكم،"], [6, "وقد صرتم مقتدين بنا وبالرب، إذ تقبلتم كلمة الله في وسط ضيقة شديدة بفرح الروح القدس."], [7, "حتى إنكم صرتم مثالا لجميع المؤمنين المقيمين في مقاطعتي مقدونية وأخائية."], [8, "فمن عندكم دوت كلمة الرب، منتشرة لا في مقدونية وأخائية فقط، بل إن إيمانكم بالله ذاع في كل مكان، حتى ليس لنا حاجة لأن نقول شيئا بعد."], [9, "فإن أولئك المؤمنين أنفسهم يخبرون عنا كيف كان قدومنا إليكم أول مرة، وكيف تحولتم إلى الله عن الأصنام، لتصيروا عبيدا يخدمون الله الحي الحق،"], [10, "وتنتظروا من السماوات ابنه الذي أقامه من بين الأموات، يسوع مخلصنا من الغضب الآتي."]]}, {"l": "Joh 15:3", "n": "", "vs": [[3, "أنتم الآن أنقياء بسبب الكلمة التي خاطبتكم بها."]]}, {"l": "Joh 17:17", "n": "", "vs": [[17, "قدسهم بالحق؛ إن كلمتك هي الحق."]]}, {"l": "Joh 17:19", "n": "", "vs": [[19, "ومن أجلهم أنا أقدس ذاتي، ليتقدسوا هم أيضا في الحق."]]}, {"l": "Rom 6:17", "n": "", "vs": [[17, "إنما الشكر لله، لأنكم كنتم عبيدا للخطيئة ولكن أطعتم من القلب صيغة التعليم الذي وضعتم في عهدته."]]}, {"l": "Rom 6:18", "n": "", "vs": [[18, "والآن، إذ حررتم من الخطيئة، صرتم عبيدا للبر."]]}, {"l": "2Co 3:18", "n": "", "vs": [[18, "ونحن جميعا فيما ننظر إلى مجد الرب بوجوه كالمرآة لا حجاب عليها، نتجلى من مجد إلى مجد لنشابه الصورة الواحدة عينها، وذلك بفعل الرب الروح."]]}, {"l": "Col 1:6", "n": "", "vs": [[6, "والتي وصلت إليكم كما تنتشر الآن في العالم أجمع، منتجة الثمر ونامية، مثلما يحدث بينكم أنتم منذ أن سمعتم بنعمة الله واختبرتموها بالحق،"]]}, {"l": "Heb 4:12", "n": "", "vs": [[12, "ذلك لأن كلمة الله حية، وفعاله، وأمضى من كل سيف له حدان، وخارقة إلى مفترق النفس والروح والمفاصل ونخاع العظام، وقادرة أن تميز أفكار القلب ونياته."]]}, {"l": "Jam 1:18", "n": "", "vs": [[18, "وهو قد شاء أن يجعلنا أولادا له، فولدنا بكلمته، كلمة الحق. وغايته أن نكون باكورة خليقته."]]}, {"l": "1Pe 1:23", "n": "", "vs": [[23, "فأنتم قد ولدتم ولادة ثانية لا من زرع بشري يفنى، بل مما لا يفنى: بكلمة الله الحية الباقية إلى الأبد."]]}, {"l": "1Pe 2:2", "n": "", "vs": [[2, "وكأطفال مولودين حديثا، تشوقوا إلى اللبن الروحي النقي لكي تنموا به إلى أن تبلغوا الخلاص،"]]}, {"l": "1Jo 3:3", "n": "", "vs": [[3, "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر."]]}, {"l": "1Jo 5:4", "n": "", "vs": [[4, "ذلك لأن المولود من الله ينتصر على العالم. فالإيمان هو الذي يجعلنا ننتصر على العالم."]]}, {"l": "1Jo 5:5", "n": "", "vs": [[5, "ومن ينتصر على العالم إلا الذي يؤمن أن يسوع هو ابن الله؟"]]}], "kwAr": "العاملة أيضا فيكم", "noteAr": ""}], "arS": [["ولذلك نحن أيضا ", []], ["نرفع الشكر", ["G2168"]], [" ", []], ["لله", ["G2316"]], [" ", []], ["بلا توقف", ["G89"]], ["، لأنكم لما ", []], ["تلقيتم", ["G3880"]], [" منا ", []], ["كلمة", ["G3056"]], [" البشارة من ", []], ["الله", ["G2316"]], ["، ", []], ["قبلتموها", ["G1209"]], [" لا كأنها ", []], ["كلمة", ["G3056"]], [" ", []], ["بشر", ["G444"]], ["، بل كما هي في ", []], ["الحقيقة", ["G230"]], [": باعتبارها ", []], ["كلمة", ["G3056"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["العاملة", ["G1754"]], [" أيضا فيكم أنتم ", []], ["المؤمنين", ["G4100"]], [".", []]]}, {"c": 2, "v": 14, "text": "فإنكم، أيها الإخوة، قد صرتم على مثال كنائس الله التي في منطقة اليهودية والتي هي في المسيح يسوع. فأنتم أيضا قاسيتم على أيدي بني جنسكم ما قاسوه هم على أيدي اليهود", "groups": [{"kw": "became", "raw": "1Th_1:6", "note": "", "refs": [{"l": "1Th 1:6", "n": "", "vs": [[6, "وقد صرتم مقتدين بنا وبالرب، إذ تقبلتم كلمة الله في وسط ضيقة شديدة بفرح الروح القدس."]]}], "kwAr": "قد صرتم على مثال", "noteAr": ""}, {"kw": "the churches", "raw": "Act_9:31; Gal_1:22", "note": "", "refs": [{"l": "Act 9:31", "n": "", "vs": [[31, "في أثناء ذلك كانت الكنيسة في مناطق اليهودية والجليل والسامرة تتمتع بالسلام. وكانت تنمو وتسير في تقوى الر ب، بمساندة الروح القدس."]]}, {"l": "Gal 1:22", "n": "", "vs": [[22, "إلا أنني كنت غير معروف شخصيا لدى كنائس اليهودية التي هي في المسيح."]]}], "kwAr": "كنائس الله", "noteAr": ""}, {"kw": "are", "raw": "1Th_1:1; 2Th_1:1", "note": "", "refs": [{"l": "1Th 1:1", "n": "", "vs": [[1, "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."]]}, {"l": "2Th 1:1", "n": "", "vs": [[1, "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."]]}], "kwAr": "في المسيح يسوع", "noteAr": ""}, {"kw": "ye also", "raw": "1Th_3:4; Act_17:1-8, Act_17:13; 2Co_8:1, 2Co_8:2", "note": "", "refs": [{"l": "1Th 3:4", "n": "", "vs": [[4, "وقد سبق لنا، لما كنا عندكم أن أخبرناكم أننا سنقاسي الضيقات، الأمر الذي حدث بعد ذلك كما تعلمون."]]}, {"l": "Act 17:1-8", "n": "", "vs": [[1, "وصل بولس وسيلا إلى تسالونيكي بعدما مرا بأمفيبوليس وأبولونية. وكان في تسالونيكي مجمع لليهود."], [2, "فذهب إليه كعادته، وناقشهم لثلاثة سبوت، مستندا إلى الكتاب،"], [3, "وشرح لهم مبينا أن المسيح كان لابد أن يتألم ويقوم من بين الأموات، وأن «المسيح الذي تنتظرونه هو يسوع الذي أبشركم به الآن!»"], [4, "فاقتنع بعض الحاضرين وانضموا إلى بولس وسيلا. وكان بينهم عدد كبير من اليونانيين المتعبدين لله وكثيرات من النساء النبيلات."], [5, "فأثار ذلك حسد اليهود الذين لم يؤمنوا، فأتوا ببعض الأشرار من أبناء الشارع، وجمعوا جمهورا وأخذوا يحرضون الناس حتى أثاروا الفوضى في المدينة، ثم هجموا على بيت ياسون مطالبين بتسليم بولس وسيلا إلى الجمع."], [6, "ولما لم يجدوهما هناك جروا ياسون وبعض الإخوة واقتادوهم إلى حكام المدينة، واشتكوا عليهم صارخين: «إن هذين الرجلين اللذين قلبا الدنيا ، قد جاءا إلى مدينتنا أيضا،"], [7, "فاستضافهما ياسون. وهم جميعا يخالفون أوامر القيصر، وينادون بملك آخر اسمه يسوع»."], [8, "فأحدثوا انزعاجا لدى الجمع والحكام عندما سمعوا هذا."]]}, {"l": "Act 17:13", "n": "", "vs": [[13, "وعرف يهود تسالونيكي أن بولس يبشر بكلمة الله في بيرية، فلحقوا به وبدأوا يحرضون الجموع ليثوروا عليه."]]}, {"l": "2Co 8:1", "n": "", "vs": [[1, "والآن، نعرفكم، أيها الإخوة، بنعمة الله الموهوبة في كنائس مقاطعة مقدونية."]]}, {"l": "2Co 8:2", "n": "", "vs": [[2, "فمع أنهم كانوا في تجربة ضيقة شديدة، فإن فرحهم الوافر مع فقرهم الشديد فاضا فأنتجا منهم سخاء غنيا."]]}], "kwAr": "فأنتم أيضا قاسيتم", "noteAr": ""}, {"kw": "even", "raw": "Act_8:1, Act_8:3, Act_9:1, Act_9:13, Act_11:19, Act_12:1-3; Heb_5:7, Heb_5:8, Heb_10:33, Heb_10:34", "note": "", "refs": [{"l": "Act 8:1", "n": "", "vs": [[1, "وكان شاول موافقا على قتل استفانوس. وفي ذلك اليوم نفسه وقع اضطهاد شديد على الكنيسة التي في أورشليم. فتشتت الإخوة جميعا في نواحي اليهودية والسامرة، ولم يبق في أورشليم إلا الرسل."]]}, {"l": "Act 8:3", "n": "", "vs": [[3, "أما شاول فكان يحاول إبادة الكنيسة، فيذهب من بيت إلى بيت ويجر الرجال والنساء ويلقيهم في السجن."]]}, {"l": "Act 9:1", "n": "", "vs": [[1, "أما شاول فكان لايزال يفور بالتهديد والقتل على تلاميذ الرب. فذهب إلى رئيس الكهنة،"]]}, {"l": "Act 9:13", "n": "", "vs": [[13, "فقال حنانيا للرب: «ولكني، يارب، قد سمعت من كثيرين بالفظائع التي ارتكبها هذا الرجل بقديسيك في أورشليم،"]]}, {"l": "Act 11:19", "n": "", "vs": [[19, "أما المؤمنون الذين تشتتوا بسبب الاضطهاد الذي وقع عليهم بعد موت استفانوس، فمروا بفينيقية وقبرص وأنطاكية، وهم لا يبشرون بالكلمة إلا اليهود."]]}, {"l": "Act 12:1-3", "n": "", "vs": [[1, "في ذلك الوقت بدأ الملك هيرودس يضطهد بعض أفراد الكنيسة،"], [2, "فقتل يعقوب شقيق يوحنا بالسيف."], [3, "ولما رأى أن هذا يرضي اليهود، قرر أن يقبض على بطرس أيضا، وكان ذلك في أيام عيد الفطير."]]}, {"l": "Heb 5:7", "n": "", "vs": [[7, "والمسيح، في أثناء حياته البشرية على الأرض، رفع أدعية وتضرعات مقترنة بصراخ شديد ودموع، إلى القادر أن يخلصه من الموت. وقد لبى الله طلبه إكراما لتقواه."]]}, {"l": "Heb 5:8", "n": "", "vs": [[8, "فمع كونه ابنا تعلم الطاعة من الآلام التي قاساها."]]}, {"l": "Heb 10:33", "n": "", "vs": [[33, "وذلك عندما تعرضتم للإهانات والمضايقات من جهة، وعند
