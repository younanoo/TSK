"Phi 3:1", "n": "", "vs": [[1, "وبعد، ياإخوتي، افرحوا في الرب. لا يزعجني أن أكتب إليكم بالأمور نفسها، فإن ذلك يجعلكم في مأمن."]]}, {"l": "2Co 13:1", "n": "", "vs": [[1, "هذه المرة الثالثة أنا قادم إليكم. بشهادة شاهدين أو ثلاثة يثبت كل أمر."]]}, {"l": "2Co 13:2", "n": "", "vs": [[2, "سبق لي أن أعلنت، وها أنا أقول مقدما وأنا غائب، كما قلت وأنا حاضر عندكم في المرة الثانية، للذين أخطأوا في الماضي وللباقين جميعا: إني إذا عدت إليكم فلا أشفق،"]]}, {"l": "Gal 1:8", "n": "", "vs": [[8, "ولكن، حتى لو بشرناكم نحن، أو بشركم ملاك من السماء، بغير الإنجيل الذي بشرناكم به، فليكن ملعونا!"]]}], "kwAr": "وأقول أيضا", "noteAr": ""}], "arS": [["افرحوا", ["G5463"]], [" في ", []], ["الرب", ["G2962"]], [" ", []], ["دائما", ["G3842"]], ["، ", []], ["وأقول", ["G2046"]], [" ", []], ["أيضا", ["G3825"]], [": ", []], ["افرحوا", ["G5463"]], [".", []]]}, {"c": 4, "v": 5, "text": "ليكن طول بالكم معروفا لدى الناس جميعا. إن الرب قريب.", "groups": [{"kw": "your", "raw": "Mat_5:39-42, Mat_6:25, Mat_6:34; Luk_6:29-35, Luk_12:22-30, Luk_21:34; 1Co_6:7, 1Co_7:29-31; 1Co_8:13, 1Co_9:25; Tit_3:2; Heb_13:5, Heb_13:6; 1Pe_1:11", "note": "", "refs": [{"l": "Mat 5:39-42", "n": "", "vs": [[39, "أما أنا فأقول لكم: لا تقاوموا الشر بمثله، بل من لطمك على خدك الأيمن، فأدر له الخد الآخر؛"], [40, "ومن أراد محاكمتك ليأخذ ثوبك، فاترك له رداءك أيضا؛"], [41, "ومن سخرك أن تسير ميلا، فسر معه ميلين."], [42, "من طلب منك شيئا، فأعطه. ومن جاء يقترض منك، فلا ترده خائبا!"]]}, {"l": "Mat 6:25", "n": "", "vs": [[25, "لذلك أقول لكم: لا تهتموا لمعيشتكم بشأن ما تأكلون وما تشربون، ولا لأجسادكم بشأن ما تكتسون. أليست الحياة أكثر من مجرد طعام، والجسد أكثر من مجرد كساء؟"]]}, {"l": "Mat 6:34", "n": "", "vs": [[34, "لا تهتموا بأمر الغد، فإن الغد يهتم بأمر نفسه. يكفي كل يوم ما فيه من سوء!"]]}, {"l": "Luk 6:29-35", "n": "", "vs": [[29, "ومن ضربك على خدك، فاعرض له الخد الآخر أيضا. ومن انتزع رداءك، فلا تمنع عنه ثوبك أيضا."], [30, "أي من طلب منك شيئا فأعطه؛ ومن اغتصب مالك، فلا تطالبه."], [31, "وبمثل ما تريدون أن يعاملكم الناس عاملوهم أنتم أيضا."], [32, "فإن أحببتم الذين يحبونكم، فأي فضل لكم؟ فحتى الخاطئون يحبون الذين يحبونهم!"], [33, "وإن أحسنتم معاملة الذين يحسنون معاملتكم، فأي فضل لكم؟ فحتى الخاطئون يفعلون هكذا!"], [34, "وإن أقرضتم الذين تأملون أن تستوفوا منهم، فأي فضل لكم؟ فحتى الخاطئون يقرضون الخاطئين لكي يستوفوا منهم ما يساوي قرضهم."], [35, "ولكن، أحبوا أعداءكم، وأحسنوا المعاملة، وأقرضوا دون أن تأملوا استيفاء القرض، فتكون مكافأتكم عظيمة، وتكونوا أبناء العلي، لأنه ينعم على ناكري الجميل والأشرار."]]}, {"l": "Luk 12:22-30", "n": "", "vs": [[22, "ثم قال لتلاميذه: «لهذا السبب أقول لكم: لا تهتموا لحياتكم بما تأكلون، ولا لأجسادكم بما تكتسون."], [23, "إن الحياة أكثر من مجرد طعام، والجسد أكثر من مجرد كساء."], [24, "تأملوا الغربان! فهي لا تزرع ولا تحصد، وليس عندها مخزن ولا مستودع، بل يعولها الله. فكم أنتم أفضل كثيرا من الطيور."], [25, "ولكن، أي منكم، إذا اهتم يقدر أن يطيل عمره ولو ساعة واحدة؟"], [26, "فما دمتم غير قادرين ولو على أصغر الأمور، فلماذا تهتمون بالأمور الأخرى؟"], [27, "تأملوا الزنابق كيف تنمو! فهي لا تتعب ولا تغزل، ولكني أقول لكم: حتى سليمان في قمة مجده لم يكتس ما يعادل واحدة منها بهاء؟"], [28, "فإن كان الله يكسو العشب ثوبا كهذا، مع أنه يكون اليوم في الحقل وغدا يطرح في التنور، فكم أنتم أولى من العشب (بأن يكسوكم الله ) ياقليلي الإيمان؟"], [29, "فعليكم أنتم ألا تسعوا إلى ما تأكلون وتشربون، ولا تكونوا قلقين."], [30, "فهذه الحاجات كلها تسعى إليها أمم العالم، وأبوكم يعلم أنكم تحتاجون إليها."]]}, {"l": "Luk 21:34", "n": "", "vs": [[34, "ولكن احذروا لأنفسكم لئلا تتثقل قلوبكم بالانغماس في اللذات وبالسكر وهموم الحياة، فيدهمكم ذلك اليوم فجأة؛"]]}, {"l": "1Co 6:7", "n": "", "vs": [[7, "والواقع أنه من العيب على الإطلاق أن يقاضي بعضكم بعضا. أما كان أحر ى بكم أن تحتملوا الظلم وأحرى بكم أن تتقبلوا السلب؟"]]}, {"l": "1Co 7:29-31", "n": "", "vs": [[29, "فإني، أيها الإخوة، أقول لكم إن الوقت يتقاصر. ففي ما يخص المسائل الأخرى، ليكن الذين لهم زوجات كأنهم بلا زوجات،"], [30, "والذين يبكون كأنهم لا يبكون، والذين يفرحون كأنهم لا يفرحون، والذين يشترون كأنهم لا يملكون،"], [31, "والذين يستغلون هذا العالم كأنهم لا يستغلونه. ذلك لأن طراز هذا العالم زائل."]]}, {"l": "1Co 8:13", "n": "", "vs": [[13, "لذا، إن كان بعض الطعام فخا يسقط فيه أخي، فلن آكل لحما أبدا، لكي لا أسقط أخي!"]]}, {"l": "1Co 9:25", "n": "", "vs": [[25, "وكل متبار يفرض على نفسه تدريبا صارما في شتى المجالات. فهؤلاء المتبارون يفعلون ذلك ليفوزوا بإكليل فان، وأما نحن فلنفوز بإكليل غير فان."]]}, {"l": "Tit 3:2", "n": "", "vs": [[2, "ولا يقولوا سوءا في أحد، ولا يكونوا مخاصمين، بل لطفاء يعاملون الجميع بوداعة تامة."]]}, {"l": "Heb 13:5", "n": "", "vs": [[5, "اجعلوا سيرتكم مترفعة عن حب المال، واقنعوا بما عندكم، لأن الله يقول: «لا أتركك، ولا أتخلى عنك أبدا!»"]]}, {"l": "Heb 13:6", "n": "", "vs": [[6, "فنستطيع إذن، أن نقول بكل ثقة وجرأة: «الرب معيني، فلن أخاف! ماذا يصنع بي الإنسان؟»"]]}, {"l": "1Pe 1:11", "n": "", "vs": [[11, "واجتهدوا لمعرفة الزمان والأحوال التي كان يشير إليها روح المسيح الذي كان عاملا فيهم، عندما شهد لهم مسبقا بما ينتظر المسيح من آلام، وبما يأتي بعدها من أمجاد."]]}], "kwAr": "ليكن طول بالكم معروفا", "noteAr": ""}, {"kw": "The", "raw": "Mat_24:48-50; 1Th_5:2-4; 2Th_2:2; Heb_10:25; Jam_5:8, Jam_5:9; 1Pe_4:7; 2Pe_3:8-14; Rev_22:7, Rev_22:20", "note": "", "refs": [{"l": "Mat 24:48-50", "n": "", "vs": [[48, "ولكن إذا قال ذلك العبد الشرير في قلبه: سيتأخر سيدي في رجوعه!"], [49, "وبدأ يضرب زملاءه العبيد ويأكل ويشرب مع السكيرين،"], [50, "فإن سيد ذلك العبد لابد أن يرجع في يوم لا يتوقعه، وساعة لا يعرفها،"]]}, {"l": "1Th 5:2-4", "n": "", "vs": [[2, "لأنكم تعلمون يقينا أن يوم الرب سيأتي كما يأتي اللص في الليل."], [3, "فبينما الناس يقولون: حل السلام والأمن! ينزل بهم الهلاك المفاجيء كالمخاض الذي يدهم الحبلى، فلا يستطيعون أبدا أن يفلتوا."], [4, "غير أنكم أنتم، أيها الإخوة، لستم في الظلام حتى يفاجئكم ذلك اليوم كأنه لص."]]}, {"l": "2Th 2:2", "n": "", "vs": [[2, "ألا تضطرب أفكاركم سريعا ولا تقلقوا، لا من إيحاء ولا من خبر ولا من رسالة منسوبة إلينا زورا، يزعم فيها أن يوم الرب قد حل فعلا."]]}, {"l": "Heb 10:25", "n": "", "vs": [[25, "وعلينا ألا ننقطع عن الاجتماع معا، كما تعود بعضكم أن يفعل. إنما، يجدر بكم أن تحثوا وتشجعوا بعضكم بعضا، وتواظبوا على هذا بقدر ما ترون ذلك اليوم يقترب."]]}, {"l": "Jam 5:8", "n": "", "vs": [[8, "فاصبروا أنتم إذن، وشددوا قلوبكم لأن عودة الرب قد صارت قريبة."]]}, {"l": "Jam 5:9", "n": "", "vs": [[9, "أيها الإخوة، لا تتذمروا بعضكم على بعض، لكي لا يصدر الحكم ضدكم. تذكروا دائما أن الديان قريب جدا، إنه أمام الباب."]]}, {"l": "1Pe 4:7", "n": "", "vs": [[7, "إن نهاية كل شيء قد صارت قريبة. فتعقلوا إذن، وكونوا متنبهين لرفع الصلاة دائما."]]}, {"l": "2Pe 3:8-14", "n": "", "vs": [[8, "ولكن، أيها الأحباء، عليكم ألا تنسوا هذه الحقيقة: أن يوما واحدا في نظر الرب هو كألف سنة، وألف سنة كيوم واحد."], [9, "فالرب، إذن، لا يبطيء في إتمام وعده، كما يظن بعض الناس، ولكنه يتأنى عليكم، فهو لا يريد لأحد من الناس أن يهلك، بل يريد لجميع الناس أن يرجعوا إليه تائبين."], [10, "إلا أن «يوم الرب» سيأتي كما يأتي اللص في الليل. في ذلك اليوم، تزول السماوات محدثة دويا هائلا وتنحل العناصر محترقة بنار شديدة، وتحترق الأرض وما فيها من منجزات."], [11, "ومادامت هذه الأشياء جميعا ستنحل، فكيف يجب أن تكونوا أنتم أصحاب سلوك مقدس يتصف بالتقوى،"], [12, "منتظرين «يوم الله» الأبدي وطالبين حلوله بسرعة. ففي ذلك اليوم، تنحل السماوات ملتهبة، وتذوب العناصر محترقة."], [13, "إلا أننا، وفقا لوعد الرب، ننتظر سماوات جديدة وأرضا جديدة، حيث يسكن البر."], [14, "فبينما تنتظرون إتمام هذا الوعد، أيها الأحباء، اجتهدوا أن يجدكم الرب في سلام، خالين من الدنس والعيب."]]}, {"l": "Rev 22:7", "n": "", "vs": [[7, "إني آت سريعا! طوبى لمن يراعي ما ورد في كتاب النبوءة هذا!»"]]}, {"l": "Rev 22:20", "n": "", "vs": [[20, "والذي يشهد بهذه الأمور يقول: «نعم! أنا آت سريعا»."]]}], "kwAr": "إن الرب قريب", "noteAr": ""}], "arS": [["ليكن ", []], ["طول بالكم", ["G1933"]], [" ", []], ["معروفا", ["G1097"]], [" لدى ", []], ["الناس", ["G444"]], [" ", []], ["جميعا", ["G3956"]], [". إن ", []], ["الرب", ["G2962"]], [" ", []], ["قريب", ["G1451"]], [".", []]]}, {"c": 4, "v": 6, "text": "لا تقلقوا من جهة أي شيء، بل في كل أمر لتكن طلباتكم معروفة لدى الله، بالصلاة والدعاء، مع الشكر.", "groups": [{"kw": "careful", "raw": "Dan_3:16; Mat_6:25-33, Mat_10:19, Mat_13:22; Luk_10:41, Luk_12:29; 1Co_7:21, 1Co_7:32; 1Pe_5:7", "note": "", "refs": [{"l": "Dan 3:16", "n": "", "vs": [[16, "فأجابه شدرخ وميشخ وعبدنغو: «لا داعي لأن نجيبك عن هذا الشأن"]]}, {"l": "Mat 6:25-33", "n": "", "vs": [[25, "لذلك أقول لكم: لا تهتموا لمعيشتكم بشأن ما تأكلون وما تشربون، ولا لأجسادكم بشأن ما تكتسون. أليست الحياة أكثر من مجرد طعام، والجسد أكثر من مجرد كساء؟"], [26, "تأملوا طيور السماء: إنها لا تزرع ولا تحصد ولا تجمع في مخازن، وأبوكم السماوي يعولها. أفلستم أنتم أفضل منها كثيرا؟"], [27, "فمن منكم إذا حمل الهموم يقدر أن يطيل عمره ولو ساعة واحدة؟"], [28, "ولماذا تحملون هم الكساء؟ تأملوا زنابق الحقل كيف تنمو: إنها لا تتعب ولا تغزل؛"], [29, "ولكني أقول لكم: حتى سليمان في قمة مجده لم يكتس ما يعادل واحدة منها بهاء!"], [30, "فإن كان الله هكذا يكسو الأعشاب البرية مع أنها توجد اليوم وتطرح غدا في النار، أفلستم أنتم، ياقليلي الإيمان، أحرى جدا بأن يكسوكم؟"], [31, "فلا تحملوا الهم قائلين: ما عسانا نأكل؟ أو: ما عسانا نشرب؟ أو: ما عسانا نكتسي؟"], [32, "فهذه الحاجات كلها تسعى إليها الأمم. فإن أباكم السماوي يعلم حاجتكم إلى هذه كلها."], [33, "أما أنتم، فاطلبوا أولا ملكوت الله وبره، وهذه كلها تزاد لكم."]]}, {"l": "Mat 10:19", "n": "", "vs": [[19, "فحين يسلمونكم، لا تهتموا كيف تتكلمون أو ماذا تقولون. فإنكم في تلك الساعة تلهمون ما تقولون."]]}, {"l": "Mat 13:22", "n": "", "vs": [[22, "أما المزروع بين الأشواك، فهو الذي يسمع الكلمة، ولكن هم الزمان الحاضر وخداع الغنى يخنقان الكلمة، فلا يعطي ثمرا."]]}, {"l": "Luk 10:41", "n": "", "vs": [[41, "ولكن يسوع رد عليها قائلا: «مرثا، مرثا! أنت مهتمة وقلقة لأمور كثيرة."]]}, {"l": "Luk 12:29", "n": "", "vs": [[29, "فعليكم أنتم ألا تسعوا إلى ما تأكلون وتشربون، ولا تكونوا قلقين."]]}, {"l": "1Co 7:21", "n": "", "vs": [[21, "أكنت عبدا حين دعيت؟ فلا يهمك ذلك. لا بل إن سنحت لك الفرصة لتصير حرا، فأحرى بك أن تغتنمها."]]}, {"l": "1Co 7:32", "n": "", "vs": [[32, "فأريد لكم أن تكونوا بلا هم. إن غير المتزوج يهتم بأمور الرب"]]}, {"l": "1Pe 5:7", "n": "", "vs": [[7, "واطرحوا عليه ثقل همومكم كلها، لأنه هو يعتني بكم."]]}], "kwAr": "لا تقلقوا", "noteAr": ""}, {"kw": "in", "raw": "Gen_32:7-12; 1Sa_1:15, 1Sa_30:6; 2Ch_32:20, 2Ch_33:12, 2Ch_33:13; Psa_34:5-7, Psa_51:15; Psa_55:17, Psa_55:22, Psa_62:8; Pro_3:5, Pro_3:6, Pro_16:3; Jer_33:3; Mat_7:7, Mat_7:8; Luk_18:1, Luk_18:7; Luk_12:22; Eph_6:18; Col_4:2; 1Th_5:17, 1Th_5:18; 1Pe_4:7; Jud_1:20,Jud_1:21", "note": "", "refs": [{"l": "Gen 32:7-12", "n": "", "vs": [[7, "فاعترى يعقوب خوف وكرب عظيمان وقسم القوم الذين معه والغنم والبقر والجمال إلى جماعتين."], [8, "وقال: «إن صادف عيسو إحدى الجماعتين وأهلكها، تنج الجماعة الباقية»."], [9, "وصلى يعقوب: «ياإله أبي إبراهيم وإله أبي إسحق، أيها الرب الذي قال لي: ارجع إلى أرضك وإلى قومك فأحسن إليك."], [10, "أنا لا أستحق جميع إحساناتك وأمانتك التي أبديتها نحو عبدك، فقد عبرت الأردن وليس معي سوى عصاي، وها أنا أعود وقد أصبحت جيشين."], [11, "نجني من يد أخي عيسو لأني خائف أن يقدم علي فيهلكني ويهلك معي الأمهات والبنين."], [12, "وأنت قلت: إني أحسن إليك وأجعل ذريتك كرمل البحر فلا تحصى لكثرتها»."]]}, {"l": "1Sa 1:15", "n": "", "vs": [[15, "فأجابته: «لا يا سيِّدي: إنني امرأة حزينة الروح، لم أشرب خمرا ولا مسكرا، بل أسكب نفسي أمام الرب."]]}, {"l": "1Sa 30:6", "n": "", "vs": [[6, "وتفاقم ضيق داود لأن الرجال، من فرط ما حل بهم من مرارة وأسى على أبنائهم وبناتهم، طالبوا برجمه، غير أن داود تشبث وتقوى بالرب إلهه."]]}, {"l": "2Ch 32:20", "n": "", "vs": [[20, "فصلى حزقيا الملك وإشعياء بن آموص النبي، واستغاثا بالسماء من جراء ذلك،"]]}, {"l": "2Ch 33:12", "n": "", "vs": [[12, "وفي ضيقه استغاث بالرب إلهه وتذلل جدا أمام إله آبائه،"]]}, {"l": "2Ch 33:13", "n": "", "vs": [[13, "وابتهل إليه فاستجاب له، وسمع تضرعه ورده إلى أورشليم وإلى مملكته. فعلم منسى أن الرب هو الله ."]]}, {"l": "Psa 34:5-7", "n": "", "vs": [[5, "الذين تطلعوا إليه استناروا، ولم تخجل وجوههم قط."], [6, "هذا المسكين استغاث، فسمعه الرب وأنقذه من جميع ضيقاته."], [7, "ملاك الرب يخيم حول خائفيه، وينجيهم."]]}, {"l": "Psa 51:15", "n": "", "vs": [[15, "يارب افتح شفتي فيذيع فمي تسبيحك."]]}, {"l": "Psa 55:17", "n": "", "vs": [[17, "مساء وصباحا وظهرا أشكو له صارخا ونائحا، فيسمع صوتي."]]}, {"l": "Psa 55:22", "n": "", "vs": [[22, "ألق على الرب همك وهو يعتني بك: إنه لا يدع الصديق يتزعزع إلى الأبد."]]}, {"l": "Psa 62:8", "n": "", "vs": [[8, "ثقوا به في كل حين أيها الشعب. اسكبوا أمامه قلوبكم، الله ملجأنا."]]}, {"l": "Pro 3:5", "n": "", "vs": [[5, "اتكل على الرب من كل قلبك، وعلى فطنتك لا تعتمد."]]}, {"l": "Pro 3:6", "n": "", "vs": [[6, "اعرف الرب في كل طرقك وهو يقوم سبلك."]]}, {"l": "Pro 16:3", "n": "", "vs": [[3, "اطرح على الرب أعمالك فتثبت مقاصدك."]]}, {"l": "Jer 33:3", "n": "", "vs": [[3, "ادعني فأجيبك وأطلعك على عظائم وغرائب لم تعرفها."]]}, {"l": "Mat 7:7", "n": "", "vs": [[7, "اسألوا، تعطوا. اطلبوا، تجدوا. اقرعوا، يفتح لكم."]]}, {"l": "Mat 7:8", "n": "", "vs": [[8, "فكل من يسأل، ينل؛ ومن يطلب، يجد؛ ومن يقرع، يفتح له."]]}, {"l": "Luk 18:1", "n": "", "vs": [[1, "وضرب لهم مثلا في وجوب الصلاة دائما ودون ملل،"]]}, {"l": "Luk 18:7", "n": "", "vs": [[7, "أفلا ينصف الله مختاريه الذين يصرخون إليه نهارا وليلا؟ أما يسرع في الاستجابة لهم؟"]]}, {"l": "Luk 12:22", "n": "", "vs": [[22, "ثم قال لتلاميذه: «لهذا السبب أقول لكم: لا تهتموا لحياتكم بما تأكلون، ولا لأجسادكم بما تكتسون."]]}, {"l": "Eph 6:18", "n": "", "vs": [[18, "كونوا مصلين في كل حال، بكل صلاة وطلبة في الروح، وساهرين لهذا الغرض عينه مواظبين تماما على جميع الطلبات لأجل القديسين جميعا،"]]}, {"l": "Col 4:2", "n": "", "vs": [[2, "داوموا على الصلاة، متيقظين فيها بالشكر،"]]}, {"l": "1Th 5:17", "n": "", "vs": [[17, "صلوا دون انقطاع؛"]]}, {"l": "1Th 5:18", "n": "", "vs": [[18, "ارفعوا الشكر في كل حال: فهذه هي مشيئة الله لكم في المسيح يسوع."]]}, {"l": "1Pe 4:7", "n": "", "vs": [[7, "إن نهاية كل شيء قد صارت قريبة. فتعقلوا إذن، وكونوا متنبهين لرفع الصلاة دائما."]]}, {"l": "Jud 1:20", "n": "", "vs": [[20, "وأما أنتم أيها الأحباء، فابنوا أنفسكم على إيمانكم الأقدس، وصلوا دائما في الروح القدس."]]}, {"l": "Jud 1:21", "n": "", "vs": [[21, "واحفظوا أنفسكم في محبة الله، منتظرين رحمة ربنا يسوع المسيح إذ يعود ويأخذكم لتحيوا معه إلى الأبد."]]}], "kwAr": "بل في كل أمر", "noteAr": ""}, {"kw": "thanksgiving", "raw": "1Sa_7:12; 2Co_1:11; Eph_5:20; Col_3:15, Col_3:17", "note": "", "refs": [{"l": "1Sa 7:12", "n": "", "vs": [[12, "فأخذ صموئيل حجرا ونصبه بين المصفاة والسن، ودعاه «حجر المعونة» وقال: «إلى هنا أعاننا الرب»"]]}, {"l": "2Co 1:11", "n": "", "vs": [[11, "على أن تساعدونا أنتم بالصلاة لأجلنا؛ حتى إن ما يوهب لنا استجابة لصلاة الكثيرين، يدفع الكثيرين إلى الشكر من أجلنا."]]}, {"l": "Eph 5:20", "n": "", "vs": [[20, "رافعين الشكر كل حين وعلى كل شيء لله والآب، باسم ربنا يسوع المسيح؛"]]}, {"l": "Col 3:15", "n": "", "vs": [[15, "وليملك في قلوبكم سلام المسيح، فإليه قد دعيتم في الجسد الواحد؛ وكونوا شاكرين!"]]}, {"l": "Col 3:17", "n": "", "vs": [[17, "ومهما كان ما تعملونه، بالقول أو بالفعل، فليجر كل شيء باسم الرب يسوع، رافعين به الشكر لله الآب."]]}], "kwAr": "مع الشكر", "noteAr": ""}, {"kw": "known", "raw": "Pro_15:8; Son_2:14; Mat_6:8", "note": "", "refs": [{"l": "Pro 15:8", "n": "", "vs": [[8, "قربان المنافقين مكرهة الرب، ومسرته صلاة المستقيمين."]]}, {"l": "Son 2:14", "n": "", "vs": [[14, "(المحب): ياحمامتي اللائذة بشقوق الصخر ومخابيء المعاقل، أريني وجهك وأسمعيني صوتك، لأن صوتك عذب ومحياك رائع."]]}, {"l": "Mat 6:8", "n": "", "vs": [[8, "فلا تكونوا مثلهم، لأن أباكم يعلم ما تحتاجون إليه قبل أن تسألوه."]]}], "kwAr": "لتكن طلباتكم معروفة لدى الله", "noteAr": ""}], "arS": [["لا ", []], ["تقلقوا", ["G3309"]], [" من جهة أي ", []], ["شيء", ["G3367"]], ["، بل في ", []], ["كل", ["G3956"]], [" أمر لتكن ", []], ["طلباتكم", ["G155"]], [" ", []], ["معروفة", ["G1107"]], [" لدى ", []], ["الله", ["G2316"]], ["، ", []], ["بالصلاة", ["G4335"]], [" ", []], ["والدعاء", ["G1162"]], ["، مع ", []], ["الشكر", ["G2169"]], [".", []]]}, {"c": 4, "v": 7, "text": "وسلام الله، الذي تعجز العقول عن إدراكه، يحرس قلوبكم وأفكاركم في المسيح يسوع.", "groups": [{"kw": "the peace", "raw": "Phi_1:2; Num_6:26; Job_22:21, Job_34:29; Psa_29:11, Psa_85:8; Isa_26:3, Isa_26:12, Isa_45:7; Isa_48:18, Isa_48:22, Isa_55:11, Isa_55:12, Isa_57:19-21; Jer_33:6; Luk_1:79, Luk_2:14; Joh_14:27, Joh_16:33; Rom_1:7, Rom_5:1, Rom_8:6, Rom_14:17, Rom_15:13; 2Co_13:11; Gal_5:22; Col_3:15; 2Th_3:16; Heb_13:20; Rev_1:4", "note": "", "refs": [{"l": "Phi 1:2", "n": "", "vs": [[2, "لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."]]}, {"l": "Num 6:26", "n": "", "vs": [[26, "يلتفت الرب بوجهه إليك ويمنحك سلاما."]]}, {"l": "Job 22:21", "n": "", "vs": [[21, "استسلم إلى الله، وتصالح معه فيصيبك خير."]]}, {"l": "Job 34:29", "n": "", "vs": [[29, "فإن هيمن بسكينته فمن يدينه، وإن وارى وجهه فمن يعاينه، سواء أكانوا شعبا أم فردا"]]}, {"l": "Psa 29:11", "n": "", "vs": [[11, "الرب يعطي شعبه عزا. الرب يبارك شعبه بالسلام."]]}, {"l": "Psa 85:8", "n": "", "vs": [[8, "إني أسمع ما يتكلم به الله الرب، فإنه يتكلم بالسلام لشعبه ولأتقيائه، فلا يرجعون إلى الجهالة."]]}, {"l": "Isa 26:3", "n": "", "vs": [[3, "أنت تحفظ ذا الرأي الثابت سالما لأنه عليك توكل."]]}, {"l": "Isa 26:12", "n": "", "vs": [[12, "يارب أنت تجعل سلاما لنا لأنك صنعت لنا كل أعمالنا."]]}, {"l": "Isa 45:7", "n": "", "vs": [[7, "أنا مبدع النور وخالق الظلمة، أنا صانع الخير وخالق الضر، أنا هو الرب فاعل كل هذه."]]}, {"l": "Isa 48:18", "n": "", "vs": [[18, "ليتك أطعت وصاياي لكان سلامك كالنهر، وبرك كأمواج البحر،"]]}, {"l": "Isa 48:22", "n": "", "vs": [[22, "أما الأشرار فلا سلام لهم يقول الرب."]]}, {"l": "Isa 55:11", "n": "", "vs": [[11, "هكذا تكون كلمتي التي تصدر عني مثمرة دائما، وتحقق ما أرغب فيه وتفلح بما أعهد به إليها."]]}, {"l": "Isa 55:12", "n": "", "vs": [[12, "لأنكم ستتركون بابل بفرح وسلام فتترنم الجبال والتلال أمامكم بهجة وتصفق أشجار الحقل بأيديها غبطة،"]]}, {"l": "Isa 57:19-21", "n": "", "vs": [[19, "وأستبدل نواحه بالحمد، يقول الرب؛ فيكون سلام للقريب والبعيد لأنني سأشفيه."], [20, "أما الأشرار فهم كالبحر الهائج الذي لا يهدأ، تقذف مياهه القذر والطين"], [21, "إذ ليس سلام للأشرار، قال إلهي."]]}, {"l": "Jer 33:6", "n": "", "vs": [[6, "ولكن لا ألبث أن أرد لها العافية والشفاء. أبرئهم وأبدي لهم وفرة السلام والأمن."]]}, {"l": "Luk 1:79", "n": "", "vs": [[79, "ليضيء على القابعين في الظلام وظل الموت، ويهدي خطانا في طريق السلام»."]]}, {"l": "Luk 2:14", "n": "", "vs": [[14, "«المجد لله في الأعالي، وعلى الأرض السلام؛ وبالناس المسرة! »"]]}, {"l": "Joh 14:27", "n": "", "vs": [[27, "سلاما أترك لكم. سلامي أعطيكم. ليس كما يعطي العالم أعطيكم أنا. فلا تضطرب قلوبكم، ولا ترتعب."]]}, {"l": "Joh 16:33", "n": "", "vs": [[33, "أخبرتكم بهذا كله ليكون لكم في سلام. فإنكم في العالم ستقاسون الضيق. ولكن تشجعوا، فأنا قد انتصرت على العالم!»"]]}, {"l": "Rom 1:7", "n": "", "vs": [[7, "إلى جميع من هم في روما من أحباء الله القديسين المدعوين. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}, {"l": "Rom 5:1", "n": "", "vs": [[1, "فبما أننا قد تبررنا على أساس الإيمان، صرنا في سلام مع الله بربنا يسوع المسيح."]]}, {"l": "Rom 8:6", "n": "", "vs": [[6, "فاهتمام الجسد هو موت؛ وأما اهتمام الروح فهو حياة وسلام."]]}, {"l": "Rom 14:17", "n": "", "vs": [[17, "إذ ليس ملكوت الله بأكل وشرب، بل هو بر وسلام وفرح في الروح القدس."]]}, {"l": "Rom 15:13", "n": "", "vs": [[13, "فليملأكم إله الرجاء كل فرح وسلام في إيمانكم حتى تزدادوا رجاء بقوة الروح القدس."]]}, {"l": "2Co 13:11", "n": "", "vs": [[11, "وأخيرا، أيها الإخوة: افرحوا؛ تكملوا؛ تشجعوا؛ اتفقوا في الرأي؛ عيشوا بسلام. وإله المحبة والسلام سيكون معكم!"]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Col 3:15", "n": "", "vs": [[15, "وليملك في قلوبكم سلام المسيح، فإليه قد دعيتم في الجسد الواحد؛ وكونوا شاكرين!"]]}, {"l": "2Th 3:16", "n": "", "vs": [[16, "وليعطكم رب السلام نفسه السلام على الدوام وفي كل حال! وليكن الرب معكم جميعا!"]]}, {"l": "Heb 13:20", "n": "", "vs": [[20, "وأسأل الله ، إله السلام الذي أقام من بين الأموات ربنا يسوع راعي الخراف العظيم بفضل دمه الذي ختم به العهد الأبدي"]]}, {"l": "Rev 1:4", "n": "", "vs": [[4, "من يوحنا، إلى الكنائس السبع في مقاطعة آسيا: لكم النعمة والسلام من الكائن والذي كان والذي سيأتي، ومن الأرواح السبعة الماثلة أمام عرشه،"]]}], "kwAr": "وسلام الله", "noteAr": ""}, {"kw": "passeth", "raw": "Eph_3:19; Rev_2:17", "note": "", "refs": [{"l": "Eph 3:19", "n": "", "vs": [[19, "وتعرفوا محبة المسيح التي تفوق المعرفة، فتمتلئوا حتى تبلغوا ملء الله كله."]]}, {"l": "Rev 2:17", "n": "", "vs": [[17, "من له أذن فليسمع ما يقوله الروح للكنائس! كل من سينتصر سأطعمه من المن الخفي، وأعطيه حجرا صغيرا أبيض حفر عليه اسم جديد لا يعرفه إلا الذي يأخذه!"]]}], "kwAr": "الذي تعجز العقول عن إدراكه", "noteAr": ""}, {"kw": "shall", "raw": "Neh_8:10; Pro_2:11, Pro_4:6, Pro_6:22", "note": "", "refs": [{"l": "Neh 8:10", "n": "", "vs": [[10, "ثم استطرد نحميا: «اذهبوا واحتفلوا آكلين أطايب الطعام، وشاربين حلو الشراب، وابعثوا أنصبة لمن لم يعد لهم. ولا تحزنوا لأن هذا اليوم مقدس لسيدنا، ففرح الرب هو قوتكم»."]]}, {"l": "Pro 2:11", "n": "", "vs": [[11, "يرعاك التعقل، ويحرسك الفهم."]]}, {"l": "Pro 4:6", "n": "", "vs": [[6, "لا تنبذها فتحفظك. أحببها فتصونك."]]}, {"l": "Pro 6:22", "n": "", "vs": [[22, "فتهديك كلما مشيت، وترعاك كلما نمت، وتناجيك عندما تستيقظ."]]}], "kwAr": "يحرس", "noteAr": ""}, {"kw": "through", "raw": "1Pe_1:4, 1Pe_1:5; Jud_1:1", "note": "", "refs": [{"l": "1Pe 1:4", "n": "", "vs": [[4, "وإرثا لا يفنى ولا يفسد ولا يزول،"]]}, {"l": "1Pe 1:5", "n": "", "vs": [[5, "محفوظا لكم في السماوات. فإنكم محفوظون بقدرة الله العاملة من خلال إيمانكم، إلى أن تفوزوا بالخلاص النهائي المعد لكم والذي سوف يتجلى في الزمان الأخير."]]}, {"l": "Jud 1:1", "n": "", "vs": [[1, "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."]]}], "kwAr": "في المسيح يسوع", "noteAr": ""}], "arS": [["وسلام", ["G1515"]], [" ", []], ["الله", ["G2316"]], ["، الذي ", []], ["تعجز", ["G5242"]], [" ", []], ["العقول", ["G3563"]], [" عن إدراكه، ", []], ["يحرس", ["G5432"]], [" ", []], ["قلوبكم", ["G2588"]], [" ", []], ["وأفكاركم", ["G3540"]], [" في ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [".", []]]}, {"c": 4, "v": 8, "text": "وختاما، أيها الإخوة: كل ما كان حقا، وكل ما كان شريفا، وكل ما كان عادلا، وكل ما كان طاهرا وكل ما كان مستحبا، وكل ما كان حسن السمعة، وكل ما كان فيه فضيلة وخصلة حميدة، فاشغلوا أفكاركم به.", "groups": [{"kw": "Finally", "raw": "Phi_3:1", "note": "", "refs": [{"l": "Phi 3:1", "n": "", "vs": [[1, "وبعد، ياإخوتي، افرحوا في الرب. لا يزعجني أن أكتب إليكم بالأمور نفسها، فإن ذلك يجعلكم في مأمن."]]}], "kwAr": "وختاما", "noteAr": ""}, {"kw": "whatsoever", "raw": "Rom_12:9-21; 1Co_13:4-7; Gal_5:22; Jam_3:17; 2Pe_1:5-7", "note": "", "refs": [{"l": "Rom 12:9-21", "n": "", "vs": [[9, "ولتكن المحبة بلا رياء. انفروا من الشر، والتصقوا بالخير."], [10, "أحبوا بعضكم بعضا محبة أخوية، مفضلين بعضكم على بعض في الكرامة."], [11, "لا تتكاسلوا في الاجتهاد، بل كونوا ملتهبين في الروح، عبيدا خادمين للرب،"], [12, "فرحين بالرجاء، صابرين في الضيق، مواظبين على الصلاة،"], [13, "متعاونين على سد حاجات القديسين، مداومين على إضافة الغرباء."], [14, "باركوا الذين يضطهدونكم. باركوا ولا تلعنوا!"], [15, "افرحوا مع الفرحين، وابكوا مع الباكين."], [16, "كونوا متوافقين بعضكم مع بعض، غير مهتمين بالأمور العالية، بل مسايرين ذوي المراكز الوضيعة. لا تكونوا حكماء في نظر أنفسكم."], [17, "لا تردوا لأحد شرا مقابل شر، بل اجتهدوا في تقديم ما هو حسن أمام جميع الناس."], [18, "إن كان ممكنا، فمادام الأمر يتعلق بكم، عيشوا في سلام مع جميع الناس."], [19, "لا تنتقموا لأنفسكم، أيها الأحباء، بل دعوا الغضب لله، لأنه قد كتب: «لي الانتقام، أنا أجازي، يقول الرب»."], [20, "وإنما «إن جاع عدوك فأطعمه، وإن عطش فاسقه. فإنك، بعملك هذا تجمع على رأسه جمرا مشتعلا»."], [21, "لا تدع الشر يغلبك، بل اغلب الشر بالخير."]]}, {"l": "1Co 13:4-7", "n": "", "vs": [[4, "المحبة تصبر طويلا؛ وهي لطيفة. المحبة لا تحسد. المحبة لا تتفاخر ولا تتكبر."], [5, "لا تتصرف بغير لياقة، ولا تسعى إلى مصلحتها الخاصة. لا تستفز سريعا، ولا تنسب الشر لأحد."], [6, "لا تفرح بالظلم، بل تفرح بالحق."], [7, "إنها تستر كل شيء، وتصدق كل شيء، وترجو كل شيء، وتتحمل كل شيء."]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Jam 3:17", "n": "", "vs": [[17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}, {"l": "2Pe 1:5-7", "n": "", "vs": [[5, "فمن أجل ذ Heb_13:18; 1Pe_2:12", "refs": [{"l": "Act 6:3", "n": "", "vs": [[3, "فاختاروا، أيها الإخوة، سبعة رجال منكم، لهم شهادة حسنة، ممتلئين من الروح القدس والحكمة، فنعينهم ليقوموا بهذه المهمة."]]}, {"l": "Rom 12:17", "n": "", "vs": [[17, "لا تردوا لأحد شرا مقابل شر، بل اجتهدوا في تقديم ما هو حسن أمام جميع الناس."]]}, {"l": "Rom 13:13", "n": "", "vs": [[13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."]]}, {"l": "2Co 8:21", "n": "", "vs": [[21, "فإننا نحرص على النزاهة لا أمام الرب فقط، بل أمام الناس أيضا."]]}, {"l": "2Co 13:7", "n": "", "vs": [[7, "ونصلي إلى الله ألا تفعلوا أي شر، لا لكي يتبين أننا نحن فاضلون، بل لكي تفعلوا أنتم ما هو حق، وإن كنا نحن كأننا فاشلون."]]}, {"l": "1Th 4:12", "n": "", "vs": [[12, "عندئذ تكون سيرتكم حسنة السمعة تجاه الذين من خارج الكنيسة، ولا تكونون في حاجة إلى شيء."]]}, {"l": "1Ti 2:2", "n": "", "vs": [[2, "ولأجل الملوك وأصحاب السلطة، لكي نعيش حياة مطمئنة هادئة كلية التقوى والرصانة."]]}, {"l": "1Ti 3:4", "n": "", "vs": [[4, "يحسن تدبير بيته، ويربي أولاده في الخضوع بكل احترام."]]}, {"l": "1Ti 3:8", "n": "", "vs": [[8, "أما المدبرون، فيجب أن يكونوا أيضا ذوي رصانة، لا ذوي لسانين، ولا مدمنين للخمر، لا ساعين إلى المكسب الخسيس."]]}, {"l": "1Ti 3:11", "n": "", "vs": [[11, "كذلك يجب أن تكون النساء أيضا رزينات، غير نمامات، نبيهات، أمينات في كل شيء."]]}, {"l": "Tit 2:2", "n": "", "vs": [[2, "أن يكون الشيوخ ذوي رزانة ووقار، متعقلين، صحيحي الإيمان والمحبة والصبر."]]}, {"l": "Tit 2:7", "n": "*Gr:", "vs": [[7, "جاعلا من نفسك في كل شيء قدوة للأعمال الصالحة، مظهرا في تعليمك النقاوة والوقار"]]}, {"l": "Tit 3:14", "n": "*marg.", "vs": [[14, "وليتعلم ذوونا أيضا أن يمارسوا أعمالا حسنة، لسد الحاجات الضرورية، لكي لا يكونوا عديمي الثمر."]]}, {"l": "Heb 13:18", "n": "", "vs": [[18, "صلوا لأجلنا، فنحن مقتنعون بأن لنا ضميرا صالحا وراغبون في أن نحسن التصرف في كل شيء."]]}, {"l": "1Pe 2:12", "n": "", "vs": [[12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالح مصلحتها الخاصة. لا تستفز سريعا، ولا تنسب الشر لأحد."], [6, "لا تفرح بالظلم، بل تفرح بالحق."], [7, "إنها تستر كل شيء، وتصدق كل شيء، وترجو كل شيء، وتتحمل كل شيء."], [8, "المحبة لا تزول أبدا. أما مواهب النبوآت فستزال، ومواهب اللغات ستنقطع، والمعرفة ستزال."], [9, "فإن معرفتنا جزئية ونبوءتنا جزئية."], [10, "ولكن، عندما يأتي ما هو كامل، يزال ما هو جزئي."], [11, "فلما كنت طفلا، كنت أتكلم كالطفل، وأشعر كالطفل، وأفكر كالطفل. ولكن، لما صرت رجلا، أبطلت ما يخص الطفل."], [12, "ونحن الآن ننظر إلى الأمور من خلال زجاج قاتم فنراها بغموض. إلا أننا سنراها أخيرا مواجهة. الآن، أعرف معرفة جزئية. ولكني، عندئذ، سأعرف مثلما عرفت."], [13, "أما الآن، فهذه الثلاثة باقية: الإيمان، والرجاء، والمحبة. ولكن أعظمها هي المحبة!"]]}, {"l": "1Pe 4:8", "n": "", "vs": [[8, "لكن أهم شيء هو أن تبادلوا بعضكم بعضا المحبة الشديدة. لأن المحبة تستر إساءات كثيرة."]]}], "kwAr": "مستحبا", "noteAr": ""}, {"kw": "are of", "raw": "Act_6:3, Act_10:22, Act_22:12; Col_4:5; 1Th_5:22; 1Ti_3:7, 1Ti_5:10; Heb_11:2", "note": "", "refs": [{"l": "Act 6:3", "n": "", "vs": [[3, "فاختاروا، أيها الإخوة، سبعة رجال منكم، لهم شهادة حسنة، ممتلئين من الروح القدس والحكمة، فنعينهم ليقوموا بهذه المهمة."]]}, {"l": "Act 10:22", "n": "", "vs": [[22, "فأجابوه: «قائد المئة كرنيليوس رجل صالح يتقي الله ، ويشهد له بذلك شعب اليهود جميعا. وقد أوحى الله إليه بواسطة ملاك طاهر أن يستدعيك إلى بيته ليسمع ما عندك من كلام»."]]}, {"l": "Act 22:12", "n": "", "vs": [[12, "وكان في دمشق رجل اسمه حنانيا، تقي كما تقضي الشريعة، يشهد له يهود دمشق جميعا شهادة حسنة."]]}, {"l": "Col 4:5", "n": "", "vs": [[5, "تصرفوا بحكمة مع الذين هم من خارج الكنيسة، مستغلين الوقت أحسن استغلال."]]}, {"l": "1Th 5:22", "n": "", "vs": [[22, "ترفعوا عن كل ما فيه شبهة شر."]]}, {"l": "1Ti 3:7", "n": "", "vs": [[7, "ومن الضروري أن تكون له شهادة حسنة من الذين في خارج الكنيسة، لكي لا يقع في العار وفي فخ إبليس."]]}, {"l": "1Ti 5:10", "n": "", "vs": [[10, "ويكون مشهودا لها بالأعمال الصالحة، كأن تكون قد ربت الأولاد، وأضافت الغرباء، وغسلت أقدام القديسين، وأسعفت المتضايقين، ومارست كل عمل صالح!"]]}, {"l": "Heb 11:2", "n": "", "vs": [[2, "بهذا الإيمان، كسب رجال الله قديما شهادة حسنة أمام الله والناس."]]}], "kwAr": "حسن السمعة", "noteAr": ""}, {"kw": "virtue", "raw": "Rth_3:11; Pro_12:4, Pro_31:10,Pro_31:29; 2Pe_1:3, 2Pe_1:4", "note": "", "refs": [{"l": "Rut 3:11", "n": "", "vs": [[11, "والآن لا تخافي ياابنتي، سأفعل كل ما تطلبين، فأهل مدينتي كلهم يعلمون أنك امرأة فاضلة."]]}, {"l": "Pro 12:4", "n": "", "vs": [[4, "المرأة الفاضلة تاج لزوجها، أما جالبة الخزي فكنخر في عظامه."]]}, {"l": "Pro 31:10", "n": "", "vs": [[10, "من يعثر على المرأة الفاضلة؟ إن قيمتها تفوق اللآليء."]]}, {"l": "Pro 31:29", "n": "", "vs": [[29, "«نساء كثيرات قمن بأعمال جليلة، ولكنك تفوقت عليهن جميعا»."]]}, {"l": "2Pe 1:3", "n": "", "vs": [[3, "إن الله، بقدرته الإلهية، قد زودنا بكل ما نحتاج إليه في الحيا ة الروحية المتصفة بالتقوى. ذلك أنه عرفنا بالمسيح الذي دعانا إلى مجده وفضيلته،"]]}, {"l": "2Pe 1:4", "n": "", "vs": [[4, "اللذين بهما أعطانا الله بركاته العظمى الثمينة التي كان قد وعد بها. وبهذا صار بإمكانكم أن تتخلصوا من الفساد الذي تنشره الشهوة في العالم، وتشتركوا في الطبيعة الإلهية."]]}], "kwAr": "فضيلة", "noteAr": ""}, {"kw": "praise", "raw": "Pro_31:31; Rom_2:29, Rom_13:3; 1Co_4:5; 2Co_8:18", "note": "", "refs": [{"l": "Pro 31:31", "n": "", "vs": [[31, "أعطوها من ثمر يديها، ولتكن أعمالها مصدر الثناء عليها."]]}, {"l": "Rom 2:29", "n": "", "vs": [[29, "وإنما اليهودي هو من كان يهوديا في الباطن، والختان هو ما كان ختانا للقلب بالروح لا بالحرف. وهذا يأتيه المدح لا من الناس بل من الله!"]]}, {"l": "Rom 13:3", "n": "", "vs": [[3, "فإن الحكام لا يخافهم من يفعل الصلاح بل من يفعل الشر. أفترغب إذن في أن تكون غير خائف من السلطة؟ اعمل ما هو صالح، فتكون ممدوحا عندها،"]]}, {"l": "1Co 4:5", "n": "", "vs": [[5, "إذن، لا تحكموا في شيء قبل الأوان، ريثما يرجع الرب الذي سيسلط النور على الأشياء التي يحجبها الظلام الآن، ويكشف نيات القلوب، عندئذ ينال كل واحد حقه من المدح من عند الله!"]]}, {"l": "2Co 8:18", "n": "", "vs": [[18, "وقد أرسلنا معه الأخ الذي ذاع مدحه بين الكنائس كلها في خدمة الإنجيل."]]}], "kwAr": "وخصلة حم  "", "vs": [[2, "فمع أننا كنا قد قاسينا الألم والإهانة في مدينة فيلبي، كما تعلمون، فقد تجرأنا في إلهنا أن نكلمكم بإنجيل الله مجاهدين في وجه المعارضة الشديدة."], [3, "فما كان وعظنا صادرا عن ضلال ولا عن نجاسة، ولا خالطه مكر،"], [4, "بل إننا نتكلم كمن تبين من اختبار الله لهم أنهم أهل لأن يؤتمنوا على الإنجيل، لنرضي لا الناس بل الله الذي يختبر قلوبنا."], [5, "وكما تعلمون أيضا، فإننا لم نستعمل معكم قط كلام التملق، ولا اتخذنا ذريعة للطمع إنما الله شاهد"], [6, "ولا سعينا لنوال مجد من الناس، لا منكم ولا من غيركم،"], [7, "مع أن لنا الحق في أن نفرض أنفسنا عليكم باعتبارنا رسلا للمسيح. ولكننا كنا مترفقين بكم كأم مرضع تحنو على أولادها."], [8, "وإذ كان حنونا عليكم شديدا، ارتضينا أن نقدم إليكم لا إنجيل الله فقط بل أنفسنا أيضا، لأنكم صرتم محبوبين لدينا."], [9, "فأنتم تذكرون، أيها الإخوة، جهدنا وكدنا، إذ بشرناكم بإنجيل الله ونحن نشتغل ليلا ونهارا لكي لا نكون عبئا ثقيلا على أحد منكم."], [10, "فأنتم تشهدون، ويشهد الله ، كيف تصرفنا بينكم، أنتم المؤمنين، بطهارة واستقامة وبراءة من اللوم،"], [11, "كما أنكم تعلمون كيف عاملناكم معاملة الأب لأولاده، فكنا نعظ كل واحد منكم ونشجعكم"], [12, "ونحرضكم أن تسلكوا سلوكا يليق بالله، ذاك الذي يدعوكم إلى ملكوته ومجده."]]}, {"l": "1Th 2:14", "n": "", "vs": [[14, "فإنكم، أيها الإخوة، قد صرتم على مثال كنائس الله التي في منطقة اليهودية والتي هي في المسيح يسوع. فأنتم أيضا قاسيتم على أيدي بني جنسكم ما قاسوه هم على أيدي اليهود"]]}, {"l": "1Th 4:1-8", "n": "", "vs": [[1, "وبعد، أيها الإخوة، فمثلما تلقيتم منا كيف يجب أن تسلكوا سلوكا يرضي الله ، وكما أنتم فاعلون، نرجو منكم ونحرضكم في الرب يسوع أن تضاعفوا تقدمكم في ذلك أكثر فأكثر."], [2, "فإنكم تعرفون الوصايا التي لقناكم إياها من قبل الرب يسوع."], [3, "فإن مشيئة الله هي هذه: قداستكم. وذلك بأن تمتنعوا عن الزنى،"], [4, "وأن يعرف كل واحد منكم كيف يحفظ جسده في الطهارة والكرامة"], [5, "غير منساق للشهوة الجامحة كالوثنيين الذين لا يعرفون الله ،"], [6, "وألا يتعدى حقوق أخيه ويسيء إليه في هذا الأمر، لأن الرب هو المنتقم لجميع هذه الإساءات، كما أنذرناكم قبلا وشهدنا لكم بحق."], [7, "فإن الله دعانا لا إلى النجاسة بل (إلى العيش( في القداسة."], [8, "إذن، من استخف بأخيه في هذا الأمر، يستخف لا بإنسان بل بالله، بذاك الذي وهبكم فعلا روحه القدوس."]]}, {"l": "2Th 3:6-10", "n": "", "vs": [[6, "ثم نوصيكم، أيها الإخوة، باسم ربنا يسوع المسيح، أن تعتزلوا عن كل أخ يسلك سلوكا فوضويا، لا يوافق التعليم الذي تلقيتم منا."], [7, "فأنتم أنفسكم تعرفون كيف ينبغي أن تقتدوا بنا، لأن سلوكنا بينكم لم يكن فوضويا،"], [8, "ولا أكلنا الخبز من عند أحد مجانا، بل كنا نشتغل بتعب وكد ليل نهار، لكي لا نكون عبئا ثقيلا على أي واحد منكم."], [9, "وذلك لا يعني أنه ليس لنا حق، بل لنجعل أنفسنا مثالا لكم لتقتدوا بنا."], [10, "فلما كنا عندكم، أوصيناكم بهذا المبدأ: إن كان أحد لا يريد أن يشتغل، فلا يأكل!"]]}], "kwAr": "ما تعلمتم وتلقيتم", "noteAr": ""}, {"kw": "do", "raw": "Deu_5:1; Mat_5:19, Mat_5:20, Mat_7:21, Mat_7:24-27; Luk_6:46, Luk_8:21; Joh_2:5, Joh_13:17, Joh_15:14; Act_9:6; 2Th_3:4; Jam_1:22; 2Pe_1:10; 1Jo_3:22", "note": "", "refs": [{"l": "Deu 5:1", "n": "", "vs": [[1, "واستدعى موسى جميع الإسرائيليين وقال لهم: «اسمعوا يابني إسرائيل الشرائع والأحكام التي أتلوها عليكم في هذا اليوم، وتعلموها واحرصوا على ممارستها."]]}, {"l": "Mat 5:19", "n": "", "vs": [[19, "فأي من خالف واحدة من هذه الوصايا الصغرى، وعلم الناس أن يفعلوا فعله، يدعى الأصغر في ملكوت السماوات. وأما من عمل بها وعلمها، فيدعى عظيما في ملكوت السماوات."]]}, {"l": "Mat 5:20", "n": "", "vs": [[20, "فإني أقول لكم: إن لم يزد بركم على بر الكتبة والفريسيين، لن تدخلوا ملكوت السماوات أبدا."]]}, {"l": "Mat 7:21", "n": "", "vs": [[21, "ليس كل من يقول لي: يارب، يارب! يدخل ملكوت السماوات، بل من يعمل بإرادة أبي الذي في السماوات."]]}, {"l": "Mat 7:24-27", "n": "", "vs": [[24, "فأي من يسمع أقوالي هذه ويعمل بها، أشبهه برجل حكيم بنى بيته على الصخر،"], [25, "فنزلت الأمطار، وجرت السيول، وهبت العواصف، فضربت ذلك البيت، فلم يسقط لأنه مؤسس على الصخر."], [26, "وأي من يسمع أقوالي هذه ولا يعمل بها، يشبه برجل غبي بنى بيته على الرمل،"], [27, "فنزلت الأمطار، وجرت السيول، وهبت العواصف، فضربت ذلك البيت، فسقط، وكان سقوطه عظيما»"]]}, {"l": "Luk 6:46", "n": "", "vs": [[46, "ولماذا تدعونني: يارب، يارب! ولا تعملون بما أقوله؟"]]}, {"l": "Luk 8:21", "n": "", "vs": [[21, "ولكنه أجابهم قائلا: «أمي وإخوتي هم الذين يسمعون كلمة الله ويعملون بها»."]]}, {"l": "Joh 2:5", "n": "", "vs": [[5, "فقالت أمه للخدم: «افعلوا كل ما يأمركم به»."]]}, {"l": "Joh 13:17", "n": "", "vs": [[17, "فإن كنتم قد عرفتم هذا، فطوبى لكم إذا عملتم به."]]}, {"l": "Joh 15:14", "n": "", "vs": [[14, "وأنتم أحبائي إن عملتم بما أوصيكم به."]]}, {"l": "Act 9:6", "n": "", "vs": [[6, "فقال وهو مرتعد ومتحير؛ «يارب ماذا تريد أن أفعل؟» فقال له الرب: «قم، وادخل المدينة فيقال لك ما يجب أن تفعله»."]]}, {"l": "2Th 3:4", "n": "", "vs": [[4, "ولنا في الرب ملء الثقة من جهتكم بأنكم عاملون بما نوصيكم به، وستعملون به أيضا."]]}, {"l": "Jam 1:22", "n": "", "vs": [[22, "لا تكتفوا فقط بسماعها، بل اعملوا بها، وإلا كنتم تغشون أنفسكم."]]}, {"l": "2Pe 1:10", "n": "", "vs": [[10, "فأحرى بكم إذن، أيها الإخوة، أن تجتهدوا لتثبتوا عمليا أن الله قد دعاكم واختاركم حقا. فإنكم، إن فعلتم هذا، لن تسقطوا أبدا!"]]}, {"l": "1Jo 3:22", "n": "", "vs": [[22, "ومهما نطلب منه بالصلاة، نحصل عليه: لأننا نطيع ما يوصينا به، ونمارس الأعمال التي ترضيه."]]}], "kwAr": "واعملوا بها", "noteAr": ""}, {"kw": "the God", "raw": "Phi_4:7; Rom_15:33, Rom_16:20; 1Co_14:33; 2Co_5:19, 2Co_5:20, 2Co_13:11; 1Th_5:23; Heb_13:20,Heb_13:21", "note": "", "refs": [{"l": "Phi 4:7", "n": "", "vs": [[7, "وسلام الله، الذي تعجز العقول عن إدراكه، يحرس قلوبكم وأفكاركم في المسيح يسوع."]]}, {"l": "Rom 15:33", "n": "", "vs": [[33, "وليكن إله السلام معكم جميعا. آمين!"]]}, {"l": "Rom 16:20", "n": "", "vs": [[20, "وإله السلام سيسحق الشيطان تحت أقدامكم سريعا. لتكن نعمة ربنا يسوع المسيح معكم."]]}, {"l": "1Co 14:33", "n": "", "vs": [[33, "فليس الله إله فوضى بل إله سلام، كما هي الحال في كنائس القديسين كلها."]]}, {"l": "2Co 5:19", "n": "", "vs": [[19, "ذلك أن الله كان في المسيح مصالحا العالم مع نفسه، غير حاسب عليهم خطاياهم، وقد وضع بين أيدينا رسالة هذه المصالحة."]]}, {"l": "2Co 5:20", "n": "", "vs": [[20, "فنحن إذن سفراء المسيح، وكأن الله يعظ بنا نتوسل بالنيابة عن المسيح منادين: «تصالحوا مع الله!»"]]}, {"l": "2Co 13:11", "n": "", "vs": [[11, "وأخيرا، أيها الإخوة: افرحوا؛ تكملوا؛ تشجعوا؛ اتفقوا في الرأي؛ عيشوا بسلام. وإله المحبة والسلام سيكون معكم!"]]}, {"l": "1Th 5:23", "n": "", "vs": [[23, "وإله السلام نفسه يقدسكم إلى التمام ويحفظكم سالمين، روحا ونفسا وجسدا، لتكونوا بلا لوم عند عودة ربنا يسوع المسيح."]]}, {"l": "Heb 13:20", "n": "", "vs": [[20, "وأسأل الله ، إله السلام الذي أقام من بين الأموات ربنا يسوع راعي الخراف العظيم بفضل دمه الذي ختم به العهد الأبدي"]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}], "kwAr": "وإله السلام", "noteAr": ""}, {"kw": "with", "raw": "Isa_8:10, Isa_41:10; Mat_1:23, Mat_28:20; 2Ti_4:22", "note": "", "refs": [{"l": "Isa 8:10", "n": "", "vs": [[10, "تشاوروا معا ولكن على غير طائل، ارسموا الخطط فلا تتحقق لأن الله معنا."]]}, {"l": "Isa 41:10", "n": "", "vs": [[10, "لا تخف لأني معك. لا تتلفت حولك جزعا، لأني إلهك، أشددك وأعينك وأعضدك بيمين بري"]]}, {"l": "Mat 1:23", "n": "", "vs": [[23, "«ها إن العذراء تحبل، وتلد ابنا، ويدعى عمانوئيل!» أي «الله معنا»."]]}, {"l": "Mat 28:20", "n": "", "vs": [[20, "وعلموهم أن يعملوا بكل ما أوصيتكم به. وها أنا معكم كل الأيام إلى انتهاء الزمان! »."]]}, {"l": "2Ti 4:22", "n": "", "vs": [[22, "ليكن الرب مع روحك، ولتكن النعمة معكم!"]]}], "kwAr": "يكون معكم", "noteAr": ""}], "arS": [["واعملوا", ["G4238"]], [" بها ما ", []], ["تعلمتم", ["G3129"]], [" ", []], ["وتلقيتم", ["G3880"]], [" ", []], ["وسمعتم", ["G191"]], [" مني وما ", []], ["رأيتم", ["G1492"]], [" في. ", []], ["وإله", ["G2316"]], [" ", []], ["السلام", ["G1515"]], [" ", []], ["يكون", ["G2071"]], [" معكم.", []]]}, {"c": 4, "v": 10, "text": "ثم إني فرحت في الرب فرحا عظيما إذ إنكم الآن قد جددتم مرة أخرى اهتمامكم بي. فمع أنه كان لكم مثل هذا الاهتمام، فإن الفرصة لم تتيسر لكم من قبل.", "groups": [{"kw": "I", "raw": "Phi_1:1, Phi_1:3; 2Co_7:6, 2Co_7:7", "note": "", "refs": [{"l": "Phi 1:1", "n": "", "vs": [[1, "من بولس وتيموثاوس، عبدي ا  تجارة عظيمة."], [7, "فنحن لم ندخل العالم حاملين شيئا، ولا نستطيع أن نخرج منه حاملين شيئا."], [8, "إنما، مادام لنا قوت ولباس، فلنكن قانعين بهما."], [9, "أما الذين يرغبون في أن يصيروا أغنياء، فيسقطون في التجربة والفخ ويتورطون في كثير من الشهوات السفيهة المضرة التي تغرق الناس في الدمار والهلاك."]]}, {"l": "Heb 10:34", "n": "", "vs": [[34, "فقد تعاطفتم مع المسجونين، كما تقبلتم نهب ممتلكاتكم بفرح، علما منكم بأن لكم في السماء ثروة أفضل وأبقى."]]}, {"l": "Heb 13:5", "n": "", "vs": [[5, "اجعلوا سيرتكم مترفعة عن حب المال، واقنعوا بما عندكم، لأن الله يقول: «لا أتركك، ولا أتخلى عنك أبدا!»"]]}, {"l": "Heb 13:6", "n": "", "vs": [[6, "فنستطيع إذن، أن نقول بكل ثقة وجرأة: «الرب معيني، فلن أخاف! ماذا يصنع بي الإنسان؟»"]]}], "kwAr": "قد تعلمت أن أكون قنوعا", "noteAr": ""}], "arS": [["لست ", []], ["أعني", ["G3004"]], [" أني كنت في ", []], ["حاجة", ["G5304"]], ["، فأنا قد ", []], ["تعلمت", ["G3129"]], [" أن أكون ", []], ["قنوعا", ["G842"]], [" في كل حال.", []]]}, {"c": 4, "v": 12, "text": "وأعرف كيف أعيش في العوز، وكيف أعيش في الوفرة. فإني، في كل شيء، وفي جميع الأحوال، متدرب على الشبع وعلى الجوع، وعلى العيش في الوفرة أو في العوز.", "groups": [{"kw": "how to be", "raw": "1Co_4:9-13; 2Co_6:4-10, 2Co_10:1, 2Co_10:10, 2Co_11:7, 2Co_11:27, 2Co_12:7-10", "note": "", "refs": [{"l": "1Co 4:9-13", "n": "", "vs": [[9, "فإني أرى أن الله عرضنا، نحن الرسل، في آخر الموكب كأنه محكوم علينا بالموت، لأننا صرنا معرضا للعالم، للملائكة والبشر معا."], [10, "نحن جهلاء من أجل المسيح، وأنتم حكماء في المسيح. نحن ضعفاء وأنتم أقوياء. أنتم مكرمون ونحن مهانون."], [11, "فما زلنا حتى هذه الساعة نجوع ونعطش، ونعرى ونلطم ونحرم محلا للإقامة"], [12, "ونجهد أنفسنا في الشغل بأيدينا. نتعرض للإهانة فنبارك، وللاضطهاد فنحتمل"], [13, "وللتجريح فنسالم. صرنا كأقذار العالم ونفاية الجميع، ومازلنا!"]]}, {"l": "2Co 6:4-10", "n": "", "vs": [[4, "وإنما نتصرف في كل شيء بما يبين أننا فعلا خدام الله: في تحمل الكثير؛ في الشدائد والحاجات والضيقات والجلدات"], [5, "والسجون والاضطرابات والأتعاب والسهر والصوم؛"], [6, "في الطهارة والمعرفة وطول البال واللطف؛ في الروح القدس والمحبة الخالصة من الرياء؛"], [7, "في كلمة الحق وقدرة الله؛ بأسلحة البر في الهجوم والدفاع؛"], [8, "بالكرامة والهوان؛ بالصيت السييء والصيت الحسن. نعامل كمضللين ونحن صادقون،"], [9, "كمجهولين ونحن معروفون، كمائتين وها نحن نحيا ، كمعاقبين ولا نقتل،"], [10, "كمحزونين ونحن دائما فرحون، كفقراء ونحن نغني كثيرين، كمن لا شيء عندهم ونحن نملك كل شيء."]]}, {"l": "2Co 10:1", "n": "", "vs": [[1, "ولكني أتوسل إليكم بوداعة المسيح وحلمه، أنا بولس «المتواضع وأنا حاضر بينكم، والجريء عليكم وأنا غائب عنكم»،"]]}, {"l": "2Co 10:10", "n": "", "vs": [[10, "فمنكم من يقول: «رسائله شديدة اللهجة وقوية؛ أما حضوره الشخصي فضعيف، وكلامه حقير»."]]}, {"l": "2Co 11:7", "n": "", "vs": [[7, "أيكون ذنبي إذن، أني بشرتكم بالإنجيل دون أجرة منكم، فأنقصت قدري ليزداد قدركم؟"]]}, {"l": "2Co 11:27", "n": "", "vs": [[27, "وكم عانيت من التعب والكد والسهر الطويل، والجوع والعطش والصوم الكثير، والبرد والعري."]]}, {"l": "2Co 12:7-10", "n": "", "vs": [[7, "ولكي لا أتكبر بما لهذه الإعلانات من عظمة فائقة، أعطيت شوكة في جسدي كأنها رسول من الشيطان يلطمني كي لا أتكبر!"], [8, "لأجل هذا تضرعت إلى الرب ثلاث مرات أن ينزعها مني"], [9, "فقال لي: «نعمتي تكفيك، لأن قدرتي تكمل في الضعف!» فأنا أرضى بأن أفتخر مسرورا بالضعفات التي في، لكي تخيم علي قدرة المسيح."], [10, "فلأجل المسيح، تسرني الضعفات والإهانات والضيقات والاضطهادات والصعوبات، لأني حينما أكون ضعيفا، فحينئذ أكون قويا!"]]}], "kwAr": "كيف أعيش في العوز", "noteAr": ""}, {"kw": "I am", "raw": "Deu_32:10; Neh_9:20; Isa_8:11; Jer_31:19; Mat_11:29, Mat_13:52; Eph_4:20,Eph_4:21", "note": "", "refs": [{"l": "Deu 32:10", "n": "", "vs": [[10, "وجدهم في أرض قفر وفي خلاء موحش. فأحاط بهم ورعاهم وصانهم كحدقة عينه."]]}, {"l": "Neh 9:20", "n": "", "vs": [[20, "وأنعمت عليهم بروحك الصالح ليلقنهم، ولم تمنع منك عن أفواههم، ووفرت لهم ماء لإرواء عطشهم."]]}, {"l": "Isa 8:11", "n": "", "vs": [[11, "لأن الرب خاطبني حين وضع يده علي وأنذرني أن لا أسلك في طريق هذا الشعب قائلا:"]]}, {"l": "Jer 31:19", "n": "", "vs": [[19, "فقد تبت بعد أن غويت، وبعد أن تعلمت صفقت على فخذي ندما. خجلت وخزيت لأني حملت عار حداثتي."]]}, {"l": "Mat 11:29", "n": "", "vs": [[29, "احملوا نيري عليكم، وتتلمذوا على يدي، لأني وديع ومتواضع القلب، فتجدوا الراحة لنفوسكم."]]}, {"l": "Mat 13:52", "n": "", "vs": [[52, "فقال: «ولهذا السبب، فأي واحد من الكتبة يصير تلميذا لملكوت السماوات، يشبه بإنسان رب بيت يطلع من كنزه ما هو جديد وما هو عتيق! »"]]}, {"l": "Eph 4:20", "n": "", "vs": [[20, "أما أنتم، فلم تتعلموا المسيح هكذا،"]]}, {"l": "Eph 4:21", "n": "", "vs": [[21, "إذا كنتم قد سمعتموه حقا وتلقيتم فيه التعليم الموافق للحق الذي في يسوع!"]]}], "kwAr": "متدرب", "noteAr": ""}], "arS": [["وأعرف", ["G1492"]], [" كيف أعيش في ", []], ["العوز", ["G5013"]], ["، وكيف أعيش في ", []], ["الوفرة", ["G4052"]], [". فإني، في ", []], ["كل شيء", ["G3956"]], ["، وفي جميع الأحوال، ", []], ["متدرب", ["G3453"]], [" على ", []], ["الشبع", ["G5526"]], [" وعلى ", []], ["الجوع", ["G3983"]], ["، وعلى العيش في ", []], ["الوفرة", ["G4052"]], [" أو في ", []], ["العوز", ["G5302"]], [".", []]]}, {"c": 4, "v": 13, "text": "إني أستطيع كل شيء، في المسيح الذي يقويني.", "groups": [{"kw": "can", "raw": "Joh_15:4, Joh_15:5, Joh_15:7; 2Co_3:4, 2Co_3:5", "note": "", "refs": [{"l": "Joh 15:4", "n": "", "vs": [[4, "فاثبتوا في وأنا فيكم. كما أن الغصن لا يقدر أن ينتج ثمرا إلا إذا ثبت في الكرمة؛ فكذلك أنتم، إلا إذا ثبتم في."]]}, {"l": "Joh 15:5", "n": "", "vs": [[5, "أنا الكرمة وأنتم الأغصان. من يثبت في وأنا فيه، فذاك ينتج ثمرا كثيرا. فإنكم بمعزل عني لا تقدرون أن تفعلوا شيئا."]]}, {"l": "Joh 15:7", "n": "", "vs": [[7, "ولكن، إن ثبتم في، وثبت كلامي فيكم، فاطلبوا ما تريدون يكن لكم."]]}, {"l": "2Co 3:4", "n": "", "vs": [[4, "وهذه هي ثقتنا العظيمة من جهة الله بالمسيح:"]]}, {"l": "2Co 3:5", "n": "", "vs": [[5, "ليس أننا أصحاب كفاءة ذاتية لندعي شيئا لأنفسنا، بل إن كفاءتنا من الله،"]]}], "kwAr": "إني أستطيع كل شيء", "noteAr": ""}, {"kw": "through", "raw": "2Co_12:9, 2Co_12:10; Eph_3:16, Eph_6:10; Col_1:11; Isa_40:29-31, Isa_41:10, Isa_45:24", "note": "", "refs": [{"l": "2Co 12:9", "n": "", "vs": [[9, "فقال لي: «نعمتي تكفيك، لأن قدرتي تكمل في الضعف!» فأنا أرضى بأن أفتخر مسرورا بالضعفات التي في، لكي تخيم علي قدرة المسيح."]]}, {"l": "2Co 12:10", "n": "", "vs": [[10, "فلأجل المسيح، تسرني الضعفات والإهانات والضيقات والاضطهادات والصعوبات، لأني حينما أكون ضعيفا، فحينئذ أكون قويا!"]]}, {"l": "Eph 3:16", "n": "", "vs": [[16, "لكي يمنحكم، وفقا لغنى مجده، أن يمد الروح الكيان الداخلي في كل منكم بالقوة المؤيدة،"]]}, {"l": "Eph 6:10", "n": "", "vs": [[10, "وختاما، تشددوا في الرب وفي قدرة قوته."]]}, {"l": "Col 1:11", "n": "", "vs": [[11, "متشددين بكل قوة موافقة لقدرة مجده، لتتمكنوا تماما من الاحتمال وطول البال،"]]}, {"l": "Isa 40:29-31", "n": "", "vs": [[29, "يهب المنهوك قوة ويمنح الضعيف قدرة عظيمة."], [30, "إن الشبيبة ينالها الإعياء والإرهاق، والفتيان يتعثرون أشد تعثر،"], [31, "أما الراجون الرب فإنهم يجددون قوتهم، ويحلقون بأجنحة النسور. يركضون ولا يعيون. يمشون ولا يتعبون."]]}, {"l": "Isa 41:10", "n": "", "vs": [[10, "لا تخف لأني معك. لا تتلفت حولك جزعا، لأني إلهك، أشددك وأعينك وأعضدك بيمين بري"]]}, {"l": "Isa 45:24", "n": "", "vs": [[24, "ويقولون عني: إنما بالرب وحده البر والقوة، وكل من يغتاظ منه يأتي إلى الرب ويخزى."]]}], "kwAr": "في المسيح الذي يقويني", "noteAr": ""}], "arS": [["إني ", []], ["أستطيع", ["G2480"]], [" ", []], ["كل شيء", ["G3956"]], ["، في ", []], ["المسيح", ["G5547"]], [" الذي ", []], ["يقويني", ["G1743"]], [".", []]]}, {"c": 4, "v": 14, "text": "إلا أنكم حسنا فعلتم إذ ساهمتم في تبديد ضيقتي.", "groups": [{"kw": "ye have", "raw": "1Ki_8:18; 2Ch_6:8; Mat_25:21; 3Jo_1:5-8", "note": "", "refs": [{"l": "1Ki 8:18", "n": "", "vs": [[18, "فقال الرب لداود أبي: لقد أحسنت إذ نويت في قلبك أن تبني لي هيكلا،"]]}, {"l": "2Ch 6:8", "n": "", "vs": [[8, "فقال الرب له: لقد أحسنت إذ نويت في قلبك أن تبني لي هيكلا."]]}, {"l": "Mat 25:21", "n": "", "vs": [[21, "فقال له سيده: حسنا فعلت أيها العبد الصالح والأمين! كنت أمينا على القليل، فسأقيمك على الكثير. ادخل إلى فرح سيدك!"]]}, {"l": "3Jo 1:5-8", "n": "", "vs": [[5, "أيها الحبيب، إن معاملتك الحسنة للإخوة وللغرباء تدل على أنك تتصرف بأمانة نحو الله."], [6, "وقد شهد هؤلاء الإخوة، أمام الكنيسة، شهادة جميلة لمحبتك. فإنك تفعل حسنا إذا زودتهم بما يحتاجون إليه في السفر. فأنت تعرف أن هذا يرضي الله ،"], [7, "لأن هؤلاء الإخوة قد انطلقوا في سبيل خدمة المسيح، وهم لا يتلقون أي عون من غير المؤمنين."], [8, "فعلينا نحن أن نرحب بأمثال هؤلاء لكي نكون حقا شركاء لهم في خدمة الحق."]]}], "kwAr": "حسنا فعلتم", "noteAr": ""}, {"kw": "ye did", "raw": "Phi_4:18, Phi_1:7; Rom_15:27; 1Co_9:10,1Co_9:11; Gal_6:6; 1Ti_6:18; Heb_10:34, Heb_13:16", "note": "", "refs": [{"l": "Phi 4:18", "n": "", "vs": [[18, "فالآن عندي كل ما يسد حاجتي ويزيد عنها. أنا في بحبوحة إذ تسلمت من أبفروديتس ما بعثتم به إلي، عطرا طيب الرائحة، ذبيحة يقبلها الله ويسر بها."]]}, {"l": "Phi 1:7", "n": "", "vs": [[7, "كما أن من الحق أن يكون لي هذا الشعور تجاهكم جميعا، لأني أحتفظ بكم في قلبي، لكونكم جميعا شركاء لي في النعمة، سواء أكان في قيودي أم في الدفاع عن الإنجيل وتثبيته."]]}, {"l": "Rom 15:27", "n": "", "vs": [[27, "حسن لديهم ذلك، وهم في دين لأولئك القديسين: فإذا كان الأمم قد اشتركوا في ما هو روحي عند أولئك، فعليهم أيضا أن يخدموهم في ما هو مادي."]]}, {"l": "1Co 9:10", "n": "", "vs": [[10, "أم يقول ذلك كله من أجلنا؟ نعم، فمن أجلنا قد كتب ذلك، لأنه من حق الفلاح أن يفلح برجاء، والدراس أن يدرس برجاء، على أمل الاشتراك في الغلة."]]}, {"l": "1Co 9:11", "n": "", "vs": [[11, "وما دمنا نحن قد زرعنا لكم الأمور الروحية، فهل يكون كثيرا علينا أن نحصد منكم الأمور المادية؟"]]}, {"l": "Gal 6:6", "n": "", "vs": [[6, "ليشارك الذي يتعلم الكلمة من يعلمها، في جميع الخيرات."]]}, {"l": "1Ti 6:18", "n": "", "vs": [[18, "وأن يفعلوا خيرا، ويكونوا أغنياء بالأعمال الصالحة، ويوزعوا بسخاء، ويكونوا على استعداد دائم لإشراك الآخرين في خيراتهم."]]}, {"l": "Heb 10:34", "n": "", "vs": [[34, "فقد تعاطفتم مع المسجونين، كما تقبلتم نهب ممتلكاتكم بفرح، علما منكم بأن لكم في السماء ثروة أفضل وأبقى."]]}, {"l": "Heb 13:16", "n": "", "vs": [[16, "ولا تغفلوا أيضا عن عمل الخير وإعانة المحتاجين: لأن مثل هذه «الذبائح» تسر الله جدا!"]]}], "kwAr": "إذ ساهمتم", "noteAr": ""}], "arS": [["إلا أنكم ", []], ["حسنا", ["G2573"]], [" ", []], ["فعلتم", ["G4160"]], [" إذ ", []], ["ساهمتم", ["G4790"]], [" في تبديد ", []], ["ضيقتي", ["G2347"]], [".", []]]}, {"c": 4, "v": 15, "text": "وتعرفون أيضا، يامؤمني فيلبي، أنه عند ابتداء خدمتي للإنجيل، إذ انطلقت من مقاطعة مقدونية، ما من كنيسة ساهمت معي في حساب العطاء والأخذ إلا أنتم وحدكم.", "groups": [{"kw": "in the", "raw": "2Ki_5:16, 2Ki_5:20; 2Co_11:8-12, 2Co_12:11-15", "note": "", "refs": [{"l": "2Ki 5:16", "n": "", "vs": [[16, "فأجاب أليشع: «حي هو الرب الذي أنا واقف في حضرته، إني لا أقبل منك هدية». فألح عليه أن يقبل منه الهدية، فأبى أليشع."]]}, {"l": "2Ki 5:20", "n": "", "vs": [[20, "حتى حدث جيحزي خادم أليشع نفسه: «سيدي امتنع عن قبول ما أحضره نعمان من هدايا. حي هو الرب لأسرعن وراءه وآخذ منه شيئا»."]]}, {"l": "2Co 11:8-12", "n": "", "vs": [[8, "ظلمت كنائس أخرى بتحميلها نفقة خدمتكم."], [9, "وحين كنت عندكم واحتجت، لم أثقل على أحد منكم. إذ سد حاجتي الإخوة الذين جاءوا من مقاطعة مقدونية. وقد حفظت نفسي، وسأحفظها أيضا، من أن أكون ثقيلا عليكم في أي شيء."], [10, "ومادام حق المسيح في، لن يوقف أحد افتخاري هذا في بلاد أخائية كلها!"], [11, "لماذا؟ ألأني لا أحبكم؟ الله يعلم!"], [12, "ولكن، سأفعل ما أنا فاعله الآن لأسقط حجة الذين يلتمسون حجة تبين أنهم مثلنا في ما يفتخرون به."]]}, {"l": "2Co 12:11-15", "n": "", "vs": [[11, "ها قد صرت غبيا! ولكن، أنتم أجبرتموني! فقد كان يجب أن تمدحوني أنتم، لأني لست متخلفا في شيء عن أولئك الرسل المتفوقين، وإن كنت لا شيئا."], [12, "إن العلامات التي تميز الرسول أجريت بينكم في كل صبر، من آيات وعجائب ومعجزات."], [13, "ففي أي مجال كنتم أصغر قدرا من الكنائس الأخرى إلا في أني لم أكن عبئا ثقيلا عليكم؟ اغفروا لي هذه الإساءة!"], [14, "أنا مستعد الآن أن آتي إليكم مرة ثالثة، ولن أكون عبئا ثقيلا عليكم. فما أسعى إليه ليس هو ما عندكم بل هو أنتم: لأنه ليس على الأولاد أن يوفروا لوالديهم، بل على الوالدين أن يوفروا لأولادهم."], [15, "وأنا، بكل سرور، أنفق ما عندي، بل أنفق نفسي لأجل أنفسكم، وإن كنت كلما زادت محبتي ألقى حبا أقل."]]}], "kwAr": "عند ابتداء خدمتي للإنجيل", "noteAr": ""}, {"kw": "I", "raw": "Act_16:40, Act_17:1-5", "note": "", "refs": [{"l": "Act 16:40", "n": "", "vs": [[40, "فخرج بولس وسيلا من السجن وتوجها إلى بيت ليدية، حيث قابلا الإخوة وشجعاهم، ثم غادرا المدينة."]]}, {"l": "Act 17:1-5", "n": "", "vs": [[1, "وصل بولس وسيلا إلى تسالونيكي بعدما مرا بأمفيبوليس وأبولونية. وكان في تسالونيكي مجمع لليهود."], [2, "فذهب إليه كعادته، وناقشهم لثلاثة سبوت، مستندا إلى الكتاب،"], [3, "وشرح لهم مبينا أن المسيح كان لابد أن يتألم ويقوم من بين الأموات، وأن «المسيح الذي تنتظرونه هو يسوع الذي أبشركم به الآن!»"], [4, "فاقتنع بعض الحاضرين وانضموا إلى بولس وسيلا. وكان بينهم عدد كبير من اليونانيين المتعبدين لله وكثيرات من النساء النبيلات."], [5, "فأثار ذلك حسد اليهود الذين لم يؤمنوا، فأتوا ببعض الأشرار من أبناء الشارع، وجمعوا جمهورا وأخذوا يحرضون الناس حتى أثاروا الفوضى في المدينة، ثم هجموا على بيت ياسون مطالبين بتسليم بولس وسيلا إلى الجمع."]]}], "kwAr": "إذ انطلقت من مقاطعة مقدونية", "noteAr": ""}], "arS": [["وتعرفون", ["G1492"]], [" أيضا، يامؤمني ", []], ["فيلبي", ["G5374"]], ["، أنه عند ", []], ["ابتداء", ["G746"]], [" خدمتي ", []], ["للإنجيل", ["G2098"]], ["، إذ ", []], ["انطلقت", ["G1831"]], [" من مقاطعة ", []], ["مقدونية", ["G3109"]], ["، ما من ", []], ["كنيسة", ["G1577"]], [" ", []], ["ساهمت", ["G2841"]], [" معي في حساب ", []], ["العطاء", ["G1394"]], [" ", []], ["والأخذ", ["G3028"]], [" إلا أنتم ", []], ["وحدكم", ["G3441"]], [".", []]]}, {"c": 4, "v": 16, "text": "حتى وأنا في مدينة تسالونيكي، بعثتم إلي بما أحتاج إليه، لا مرة واحدة بل أكثر.", "groups": [{"kw": "in", "raw": "1Th_2:9", "note": "", "refs": [{"l": "1Th 2:9", "n": "", "vs": [[9, "فأنتم تذكرون، أيها الإخوة، جهدنا وكدنا، إذ بشرناكم بإنجيل الله ونحن نشتغل ليلا ونهارا لكي لا نكون عبئا ثقيلا على أحد منكم."]]}], "kwAr": "في مدينة تسالونيكي", "noteAr": ""}, {"kw": "once", "raw": "1Th_2:18", "note": "", "refs": [{"l": "1Th 2:18", "n": "", "vs": [[18, "ولهذا عزمنا أن نأتي إليكم على الأخص أنا بولس مرة بعد مرة، فعاقنا الشيطان."]]}], "kwAr": "لا مرة واحدة بل أكثر", "noteAr": ""}], "arS": [["حتى وأنا في مدينة ", []], ["تسالونيكي", ["G2332"]], ["، ", []], ["بعثتم", ["G3992"]], [" إلي بما ", []], ["أحتاج", ["G5532"]], [" إليه، لا ", []], ["مرة", ["G530"]], [" واحدة بل أكثر.", []]]}, {"c": 4, "v": 17, "text": "والواقع أني لا أسعى إلى العطايا، بل أسعى إلى الفائدة المتكاثرة لحسابكم.", "groups": [{"kw": "because", "raw": "Phi_4:11; Mal_1:10; Act_20:33, Act_20:34; 1Co_9:12-15; 2Co_11:16; 1Th_2:5; 1Ti_3:3; 1Ti_6:10; Tit_1:7; 1Pe_5:2; 2Pe_2:3, 2Pe_2:15; Jud_1:11", "note": "", "refs": [{"l": "Phi 4:11", "n": "", "vs": [[11, "لست أعني أني كنت في حاجة، فأنا قد تعلمت أن أكون قنوعا في كل حال."]]}, {"l": "Mal 1:10", "n": "", "vs": [[10, "آه، ياليت بينكم من يغلق أبواب الهيكل لئلا توقدوا نارا باطلة على مذبحي، يقول الرب القدير: إذ لا مسرة لي بكم ولا أرضى بتقدمة من أيديكم."]]}, {"l": "Act 20:33", "n": "", "vs": [[33, "ما اشتهيت يوما فضة ولا ذهبا ولا ثوبا من عند أحد."]]}, {"l": "Act 20:34", "n": "", "vs": [[34, "وأنتم تعلمون أني اشتغلت بيدي هاتين لأسد حاجاتي وحاجات مرافقي."]]}, {"l": "1Co 9:12-15", "n": "", "vs": [[12, "إن كان لغيرنا هذا الحق عليكم، أفلا نكون نحن أحق؟ ولكننا لم نستعمل هذا الحق؟ بل نتحمل كل شيء، مخافة أن نضع أي عائق أمام إنجيل المسيح !"], [13, "أما تعلمون أن الذين يشتغلون بالمقدسات كانوا يأكلون مما يقدم إلى الهيكل، وأن الذين يقومون بخدمة المذبح، كانوا يشتركون في خيرات المذبح؟"], [14, "هكذا أيضا رسم الرب للذين يبشرون بالإنجيل أن يعيشوا من الإنجيل."], [15, "على أني لم أستعمل أيا من هذه الحقوق. وما كتبت هذا الآن لأحظى بشيء. فإني أفضل الموت على أن يعطل أحد فخري."]]}, {"l": "2Co 11:16", "n": "", "vs": [[16, "أقول مرة أخرى: لا يظن أحد أني غبي وإلا، فاقبلوني ولو كغبي، كي أفتخر أنا أيضا قليلا!"]]}, {"l": "1Th 2:5", "n": "", "vs": [[5, "وكما تعلمون أيضا، فإننا لم نستعمل معكم قط كلام التملق، ولا اتخذنا ذريعة للطمع إنما الله شاهد"]]}, {"l": "1Ti 3:3", "n": "", "vs": [[3, "لا مدمنا للخمر ولا عنيفا؛ بل لطيفا، غير متعود الخصام، غير مولع بالمال،"]]}, {"l": "1Ti 6:10", "n": "", "vs": [[10, "فإن حب المال أصل لكل شر؛ وإذ سعى بعضهم إليه، ضلوا عن الإيمان، وطعنوا أنفسهم بأوجاع كثيرة."]]}, {"l": "Tit 1:7", "n": "", "vs": [[7, "وذلك لأن الناظر يجب أن يكون بريئا من كل تهمة باعتباره وكيلا لله، لا معجبا بنفسه ولا حاد الطبع، ولا مدمن الخمر، ولا عنيفا، ولا ساعيا إلى المكسب الخسيس؛"]]}, {"l": "1Pe 5:2", "n": "", "vs": [[2, "ارعوا قطيع الله الذي بينكم، كحراس له، لا بدافع الواجب، بل بدافع التطوع، كما يريد الله ، ولا رغبة في الربح الدنيء، بل رغبة في الخدمة بنشاط."]]}, {"l": "2Pe 2:3", "n": "", "vs": [[3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "2Pe 2:15", "n": "", "vs": [[15, "وإذ خرجوا عن الطريق المستقيم، ضلوا. فهم سائرون في طريق بلعام بن بعور، الذي أحب الحصول على المال أجرة لإثمه."]]}, {"l": "Jud 1:11", "n": "", "vs": [[11, "الويل لهم! لأنهم سلكوا طريق قايين، واندفعوا إلى ارتكاب خطيئة بلعام طلبا للمال، وتمردوا كما تمرد قورح، فدمروا أنفسهم."]]}], "kwAr": "لا أسعى إلى العطايا", "noteAr": ""}, {"kw": "fruit", "raw": "Phi_1:11; Mic_7:1; Joh_15:8, Joh_15:16; Rom_15:28; 2Co_9:9-13; Tit_3:14", "note": "", "refs": [{"l": "Phi 1:11", "n": "", "vs": [[11, "كاملين في ثمار البر الآتية بيسوع المسيح، لمجد الله وحمده."]]}, {"l": "Mic 7:1", "n": "", "vs": [[1, "ويل لي، فقد صرت كرجل جائع جاء يبحث عن جني الصيف وبقايا قطاف العنب، فلم يجد عنقودا للأكل ولا شيئا من باكورة التين مما تشتهيه نفسي."]]}, {"l": "Joh 15:8", "n": "", "vs": [[8, "بهذا يتمجد أبي: أن تنتجوا ثمرا كثيرا فتكونون حقا تلاميذي."]]}, {"l": "Joh 15:16", "n": "", "vs": [[16, "ليس أنتم اخترتموني، بل أنا اخترتكم وعينتكم لتنطلقوا وتنتجوا ثمرا ويدوم ثمركم، فيعطيكم الآب كل ما تطلبونه باسمي."]]}, {"l": "Rom 15:28", "n": "", "vs": [[28, "فبعد انتهائي من هذه المهمة، وتسليمي هذا الثمر للقديسين،"]]}, {"l": "2Co 9:9-13", "n": "", "vs": [[9, "وفقا لما قد كتب: «وزع بسخاء، أعطى الفقراء، بره يدوم إلى الأبد!»"], [10, "والذي يقدم بذارا للزارع، وخبزا للأكل، سيقدم لكم بذاركم ويكثره ويزيد أثمار بركم:"], [11, "إذ تغتنون في كل شيء، لأجل كل سخاء طوعي ينتج بنا شكرا لله"], [12, "ذلك لأن خدمة الله بهذه الإعانة لا تسد حاجة القديسين وحسب، بل تفيض بشكر كثير لله."], [13, "فإن القديسين، إذ يختبرون هذه الخدمة، يمجدون الله على طاعتكم في الشهادة لإنجيل المسيح وعلى السخاء الطوعي في مشاركتكم لهم وللجميع."]]}, {"l": "Tit 3:14", "n": "", "vs": [[14, "وليتعلم ذوونا أيضا أن يمارسوا أعمالا حسنة، لسد الحاجات الضرورية، لكي لا يكونوا عديمي الثمر."]]}], "kwAr": "الفائدة", "noteAr": ""}, {"kw": "to", "raw": "Pro_19:17; Mat_10:40-42, Mat_25:34-40; Luk_14:12-14; Heb_6:10", "note": "", "refs": [{"l": "Pro 19:17", "n": "", "vs": [[17, "من يرحم الفقير يقرض الرب، ويكافئه الرب على حسن صنيعه."]]}, {"l": "Mat 10:40-42", "n": "", "vs": [[40, "من يقبلكم، يقبلني؛ ومن يقبلني، يقبل الذي أرسلني."], [41, "من يرحب بنبي لكونه نبيا، فإنه ينال مكافأة نبي؛ ومن يرحب برجل بار لكونه بارا، فإنه ينال مكافأة بار."], [42, "وأي من سقى واحدا من هؤلاء الصغار ولو كأس ماء بارد، فقط لأنه تلميذ لي، فالحق أقول لكم: إن مكافأته لن تضيع أبدا»."]]}, {"l": "Mat 25:34-40", "n": "", "vs": [[34, "ثم يقول الملك للذين عن يمينه: تعالوا يامن باركهم أبي، رثوا الملكوت الذي أعد لكم منذ إنشاء العالم:"], [35, "لأني جعت فأطعمتموني، عطشت فسقيتموني، كنت غريبا فآويتموني،"], [36, "عريانا فكسوتموني، مريضا فزرتموني، سجينا فأتيتم إلي!"], [37, "فيرد الأبرار قائلين: يارب، متى رأيناك جائعا فأطعمناك، أو عطشانا فسقيناك؟"], [38, "ومتى رأيناك غريبا فآويناك، أو عريانا فكسوناك؟"], [39, "ومتى رأيناك مريضا أو سجينا فزرناك؟"], [40, "فيجيبهم الملك: الحق أقول لكم: بما أنكم فعلتم ذلك بأحد إخوتي هؤلاء الصغار، فبي فعلتم!"]]}, {"l": "Luk 14:12-14", "n": "", "vs": [[12, "وقال أيضا للذي دعاه: «عندما تقيم غداء أو عشاء، فلا تدع أصدقاءك ولا إخوتك ولا أقرباءك ولا جيرانك الأغنياء، لئلا يدعوك هم أيضا بالمقابل، فتكون قد كوفئت."], [13, "ولكن، عندما تقيم وليمة ادع الفقراء والمعاقين والعرج والعمي؛"], [14, "فتكون مباركا لأن هؤلاء لا يملكون ما يكافئونك به، فإنك تكافأ في قيامة الأبرار»."]]}, {"l": "Heb 6:10", "n": "", "vs": [[10, "وليس الله بظالم حتى ينسى عملكم الجاد في إظهار محبتكم له عن طريق خدمتكم للقديسين إكراما لاسمه، الأمر الذي قمتم به قبلا، وتقومون به الآن!"]]}], "kwAr": "المتكاثرة لحسابكم", "noteAr": ""}], "arS": [["والواقع أني لا ", []], ["أسعى", ["G1934"]], [" إلى ", []], ["العطايا", ["G1390"]], ["، بل ", []], ["أسعى", ["G1934"]], [" إلى ", []], ["الفائدة", ["G2590"]], [" ", []], ["المتكاثرة", ["G4121"]], [" ", []], ["لحسابكم", ["G3056"]], [".", []]]}, {"c": 4, "v": 18, "text": "فالآن عندي كل ما يسد حاجتي ويزيد عنها. أنا في بحبوحة إذ تسلمت من أبفروديتس ما بعثتم به إلي، عطرا طيب الرائحة، ذبيحة يقبلها الله ويسر بها.", "groups": [{"kw": "I have all", "raw": "or, I have received all", "note": "or, I have received all", "refs": [], "kwAr": "عندي كل ما يسد حاجتي", "noteAr": "أو: قد تسلّمت كل شيء."}, {"kw": "abound", "raw": "Phi_4:12; 2Th_1:3", "note": "", "refs": [{"l": "Phi 4:12", "n": "", "vs": [[12, "وأعرف كيف أعيش في العوز، وكيف أعيش في الوفرة. فإني، في كل شيء، وفي جميع الأحوال، متدرب على الشبع وعلى الجوع، وعلى العيش في الوفرة أو في العوز."]]}, {"l": "2Th 1:3", "n": "", "vs": [[3, "من واجبنا أن نشكر الله على الدوام لأجلكم أيها الإخوة. كما أن هذا حق: لأن إيمانكم ينمو نموا فائقا، ومحبة أحدكم للآخر تفيض بينكم جميعا."]]}], "kwAr": "ويزيد عنها", "noteAr": ""}, {"kw": "Epaphroditus", "raw": "Phi_2:25, Phi_2:26", "note": "", "refs": [{"l": "Phi 2:25", "n": "", "vs": [[25, "إلا أني رأيت من الضروري أن أرسل إليكم أبفروديتس، أخي ومعاوني ورفيقي في التجند، والمرسل من قبلكم عاملا على سد حاجتي،"]]}, {"l": "Phi 2:26", "n": "", "vs": [[26, "إذ كان مشتاقا إليكم جميعا، ومكتئبا لسماعكم بمرضه."]]}], "kwAr": "أبفروديتس", "noteAr": ""}, {"kw": "an", "raw": "Joh_12:3-8; 2Co_2:15, 2Co_2:16; Eph_5:2; Heb_13:16; 1Pe_2:5", "note": "", "refs": [{"l": "Joh 12:3-8", "n": "", "vs": [[3, "فأخذت مريم منا (أي ثلث لتر) من عطر الناردين الخالص الغالي الثمن، ودهنت به قدمي يسوع، ثم مسحتهما بشعرها، فملأت الرائحة الطيبة أرجاء البيت كله."], [4, "فقال أحد التلاميذ، وهو يهوذا الإسخريوطي، الذي كان سيخون يسوع:"], [5, "«لماذا لم يبع هذا العطر بثلاث مئة دينار توزع على الفقر اء؟»"], [6, "ولم يقل هذا لأنه كان يعطف على الفقراء، بل لأنه كان لصا، فقد كان أمينا للصندوق وكان يختلس مما يودع فيه."], [7, "فأجابه يسوع: «دعها! فقد احتفظت بهذا العطر ليوم دفني،"], [8, "لأن الفقراء عندكم في كل حين؛ أما أنا فلن أكون عندكم في كل حين»."]]}, {"l": "2Co 2:15", "n": "", "vs": [[15, "فإننا رائحة : "", "vs": [[13, "فأجاب ميخا: «حي هو الرب، إنني لن أنطق إلا بما يقول الرب»."]]}, {"l": "Neh 5:19", "n": "", "vs": [[19, "فاذكر لي ياإلهي ما صنعته من خير لهذا الشعب، وأحسن إلي."]]}, {"l": "Dan 6:22", "n": "", "vs": [[22, "قد أرسل إلهي ملاكه فسد أفواه الأسود فلم تؤذني، لأني وجدت بريئا أمامه، ولم أرتكب سوءا أمامك أيضا أيها الملك»."]]}, {"l": "Mic 7:7", "n": "", "vs": [[7, "أما أنا فأرتقب الرب وأنتظر إله خلاصي فيسمعني إلهي."]]}, {"l": "Joh 20:17", "n": "", "vs": [[17, "فقال لها: «لا تمسكي بي! فإني لم أصعد بعد إلى الآب، بل اذهبي إلى إخوتي وقولي لهم: إني سأصعد إلى أبي وأبيكم، وإلهي وإلهكم!»"]]}, {"l": "Joh 20:27", "n": "", "vs": [[27, "ثم قال لتوما: «هات إصبعك إلى هنا، وانظر يدي، وهات يدك وضعها في جنبي. ولا تكن غير مؤمن بل كن مؤمنا!»"]]}, {"l": "Rom 1:8", "n": "", "vs": [[8, "بادىء بدء، أشكر إلهي بيسوع المسيح من أجلكم جميعا، لأن إيمانكم يذاع خبره في العالم كله."]]}, {"l": "2Co 12:21", "n": "", "vs": [[21, "وأخشى أن يجعلني إلهي ذليلا بينكم عند مجيئي إليكم مرة أخرى، فيكون حزني شديدا على كثيرين من الذين أخطأوا قبلا ولم يتوبوا عما ارتكبوا من دنس وزنى وفسق!"]]}, {"l": "Phm 1:4", "n": "", "vs": [[4, "إني أشكر إلهي، إذ أذكرك دائما في صلواتي،"]]}], "kwAr": "إلهي", "noteAr": ""}, {"kw": "supply", "raw": "Gen_48:15; Deu_8:3, Deu_8:4; Neh_9:15; Psa_23:1-5, Psa_41:1-3, Psa_84:11, Psa_112:5-9; Pro_3:9, Pro_3:10, Pro_11:24, Pro_11:25; Mal_3:10; Luk_12:30-33; 2Co_9:8-11", "note": "", "refs": [{"l": "Gen 48:15", "n": "", "vs": [[15, "وبارك يوسف قائلا: «إن الله الذي سلك أمامه أبواي إبراهيم وإسحق، الله الذي رعاني منذ وجودي إلى هذا اليوم،"]]}, {"l": "Deu 8:3", "n": "", "vs": [[3, "فأذلكم ثم أجاعكم وأطعمكم المن الذي لم تكونوا تعرفونه، لا أنتم ولا آباؤكم ليعلمكم أنه ليس بالخبز وحده يحيا الإنسان، بل بكل كلمة ينطق بها فم الرب."]]}, {"l": "Deu 8:4", "n": "", "vs": [[4, "وفي غضون الأربعين سنة لم تبل ثيابكم عليكم، ولم تتورم أقدامكم."]]}, {"l": "Neh 9:15", "n": "", "vs": [[15, "وأشبعت جوعهم بخبز من السماء، وفجرت لهم ماء من الصخرة إرواء لعطشهم، وأمرتهم أن يدخلوا ويرثوا الأرض التي أقسمت أن تهبها لهم."]]}, {"l": "Psa 23:1-5", "n": "", "vs": [[1, "الرب راعي فلست أحتاج إلى شيء."], [2, "في مراع خضراء يربضني، وإلى مياه هادئة يقودني."], [3, "ينعش نفسي ويرشدني إلى طرق البر إكراما لاَسمه."], [4, "حتى إذا اجتزت وادي ظلال الموت، لا أخاف سوءا لأنك ترافقني. عصاك وعكازك هما معي يشددان عزيمتي."], [5, "تبسط أمامي مأدبة على مرأى من أعدائي. مسحت بالزيت رأسي، وأفضت كأسي."]]}, {"l": "Psa 41:1-3", "n": "", "vs": [[1, "طوبى للمترفق بالمسكين، فإن الرب ينقذه في يوم الشر."], [2, "الرب يحفظه ويحييه ويسعده في الأرض، ولا يسلمه إلى مقاصد أعدائه."], [3, "يعضده الرب على فراش الألم، ويرد عافيته."]]}, {"l": "Psa 84:11", "n": "", "vs": [[11, "لأن الرب الإله شمس وترس. الرب يعطي نعمة ومجدا؛ لا يمنع أي خير عن السالكين بالاستقامة."]]}, {"l": "Psa 112:5-9", "n": "", "vs": [[5, "سعيد هو الرجل الذي يتحنن ويقرض مجانا ويدبر شؤونه بالحيطة والعدل."], [6, "فإنه لن يتزعزع أبدا. ذكر الصديق يخلد إلى الأبد."], [7, "لن يخاف من خبر سوء، فقلبه ثابت متكل على الرب."], [8, "قلبه ثابت لا تعتريه المخاوف، ويشهد عقاب مضطهديه."], [9, "يوزع بسخاء ويعطي الفقراء، وبره يدوم إلى الأبد، فيرتفع رأسه باعتزاز."]]}, {"l": "Pro 3:9", "n": "", "vs": [[9, "أكرم الرب من مالك، ومن أوائل غلات محاصيلك."]]}, {"l": "Pro 3:10", "n": "", "vs": [[10, "فتمتليء أهراؤك وفرة، وتفيض معاصرك خمرا."]]}, {"l": "Pro 11:24", "n": "", "vs": [[24, "قد يسخو المرء بما عنده فيزداد غنى ويبخل آخر بما عليه أن يسخو به فيفتقر."]]}, {"l": "Pro 11:25", "n": "", "vs": [[25, "النفس السخية تزداد ثراء، والمروي يروى أيضا."]]}, {"l": "Mal 3:10", "n": "", "vs": [[10, "هاتوا العشور جميعها إلى بيت الخزينة ليتوافر في هيكلي طعام، واختبروني لتروا إن كنت لا أفتح كوى السماء وأفيض عليكم بركة وفيرة، يقول الرب القدير."]]}, {"l": "Luk 12:30-33", "n": "", "vs": [[30, "فهذه الحاجات كلها تسعى إليها أمم العالم، وأبوكم يعلم أنكم تحتاجون إليها."], [31, "إنما اسعوا إلى ملكوته، فتزاد لكم هذه كلها."], [32, "لا تخافوا، أيها القطيع الصغير، لأن أباكم قد سر أن يعطيكم الملكوت."], [33, "بيعوا ما تملكون وأعطوا صدقة، واجعلوا لكم أكياسا لا تبلى، كنزا في السماوات لا ينفد، حيث لا يقترب لص ولا يفسد سوس."]]}, {"l": "2Co 9:8-11", "n": "", "vs": [[8, "والله قادر أن يجعل كل نعمة تفيض عليكم، حتى يكون لكم اكتفاء كلي في كل شيء وكل حين، فتفيضوا في كل عمل صالح؛"], [9, "وفقا لما قد كتب: «وزع بسخاء، أعطى الفقراء، بره يدوم إلى الأبد!»"], [10, "والذي يقدم بذارا للزارع، وخبزا للأكل، سيقدم لكم بذاركم ويكثره ويزيد أثمار بركم:"], [11, "إذ تغتنون في كل شيء، لأجل كل سخاء طوعي ينتج بنا شكرا لله"]]}], "kwAr": "سيسد حاجاتكم كلها", "noteAr": ""}, {"kw": "according", "raw": "Psa_36:8, Psa_104:24, Psa_130:7; Rom_9:23, Rom_11:33; Eph_1:7, Eph_1:18, Eph_2:7, Eph_3:8, Eph_3:16; Col_1:27, Col_3:16; 1Ti_6:17", "note": "", "refs": [{"l": "Psa 36:8", "n": "", "vs": [[8, "يرتوون من خيرات بيتك، ومن نهر نعمك تسقيهم."]]}, {"l": "Psa 104:24", "n": "", "vs": [[24, "يارب ما أعظم أعمالك، كلها صنعت بحكمة، فامتلأت الأرض من غناك."]]}, {"l": "Psa 130:7", "n": "", "vs": [[7, "ليترج إسرائيل الرب، لأن منه الرحمة والفداء الكثير."]]}, {"l": "Rom 9:23", "n": "", "vs": [[23, "وذلك بقصد أن يعلن غنى مجده في أوعية الرحمة التي سبق فأعدها للمجد،"]]}, {"l": "Rom 11:33", "n": "", "vs": [[33, "فما أعمق غنى الله وحكمته وعلمه! ما أبعد أحكامه عن الفحص وطرقه عن التتبع !"]]}, {"l": "Eph 1:7", "n": "", "vs": [[7, "ففيه لنا بدمه الفداء، أي غفران الخطايا؛ بحسب غنى نعمته"]]}, {"l": "Eph 1:18", "n": "", "vs": [[18, "إذ تستنير بصائر قلوبكم، فتعلموا ما في دعوته لكم من رجاء، وما هو غنى مجد ميراثه في القديسين،"]]}, {"l": "Eph 2:7", "n": "", "vs": [[7, "وذلك كي يعرض في الدهور القادمة غنى نعمته الفائق في لطفه علينا في المسيح يسوع."]]}, {"l": "Eph 3:8", "n": "", "vs": [[8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "Eph 3:16", "n": "", "vs": [[16, "لكي يمنحكم، وفقا لغنى مجده، أن يمد الروح الكيان الداخلي في كل منكم بالقوة المؤيدة،"]]}, {"l": "Col 1:27", "n": "", "vs": [[27, "الذين أراد الله أن يعلن لهم كم هو غني مجد هذا السر بين الأمم: إنه المسيح فيكم، وهو رجاء المجد؛"]]}, {"l": "Col 3:16", "n": "", "vs": [[16, "لتسكن كلمة المسيح في داخلكم بغنى، في كل حكمة، معلمين وواعظين بعضكم بعضا، مرنمين بمزامير وتسابيح وأناشيد روحية في قلوبكم لله، رافعين له الحمد."]]}, {"l": "1Ti 6:17", "n": "", "vs": [[17, "أوص أغنياء هذا الزمان بأن لا يتكبروا، ولا يتكلوا على الغنى غير الثابت، بل على الله الذي يمنحنا كل شيء بوفرة لنتمتع به،"]]}], "kwAr": "وفقا لغناه", "noteAr": ""}, {"kw": "glory", "raw": "Rom_8:18; 2Co_4:17; 1Th_2:12; 1Pe_5:1, 1Pe_5:10", "note": "", "refs": [{"l": "Rom 8:18", "n": "", "vs": [[18, "فإني مقتنع بأن آلام الزمان الحاضر ليست شيئا إذا قيست بالمجد الآتي الذي سيعلن فينا."]]}, {"l": "2Co 4:17", "n": "", "vs": [[17, "ذلك لأن ما يضايقنا الآن من صعوبات بسيطة عابرة، ينتج لنا بمقدار لا يحد وزنة أبدية من المجد،"]]}, {"l": "1Th 2:12", "n": "", "vs": [[12, "ونحرضكم أن تسلكوا سلوكا يليق بالله، ذاك الذي يدعوكم إلى ملكوته ومجده."]]}, {"l": "1Pe 5:1", "n": "", "vs": [[1, "وهذه وصيتي إلى الشيوخ الذين بينكم، بصفتي شيخا رفيقا لهم، وشاهدا لآلام المسيح، وشريكا في المجد الذي سيتجلى:"]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}], "kwAr": "في المجد", "noteAr": ""}], "arS": [["وإن ", []], ["إلهي", ["G2316", "G3450"]], [" ", []], ["سيسد", ["G4137"]], [" ", []], ["حاجاتكم", ["G5532"]], [" ", []], ["كلها", ["G3956"]], [" إلى التمام، ", []], ["وفقا", ["G2596"]], [" ", []], ["لغناه", ["G4149"]], [" في ", []], ["المجد", ["G1391"]], ["، في ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [".", []]]}, {"c": 4, "v": 20, "text": "فلإلهنا وأبينا، المجد إلى دهر الدهور. آمين!", "groups": [{"kw": "unto", "raw": "Phi_1:11; Psa_72:19, Psa_115:1; Mat_6:9, Mat_6:13; Rom_11:36, Rom_16:27; Gal_1:5; Eph_3:21; 1Ti_1:17; Jud_1:25; Rev_1:6, Rev_4:9-11, Rev_5:12, Rev_7:12, Rev_11:13, Rev_14:7", "note": "", "refs": [{"l": "Phi 1:11", "n": "", "vs": [[11, "كاملين في ثمار البر الآتية بيسوع المسيح، لمجد الله وحمده."]]}, {"l": "Psa 72:19", "n": "", "vs": [[19, "تبارك اسمه المجيد إلى الأبد، ولتمتليء الأرض كلها من مجده. آمين ثم آمين."]]}, {"l": "Psa 115:1", "n": "", "vs": [[1, "لا تمجدنا يارب، بل مجد اسمك، من أجل رحمتك وحقك."]]}, {"l": "Mat 6:9", "n": "", "vs": [[9, "فصلوا أنتم مثل هذه الصلاة: أبانا الذي في السماوات، ليتقدس اسمك!"]]}, {"l": "Mat 6:13", "n": "", "vs": [[13, "ولا تدخلنا في تجربة، لكن نجنا من الشرير، لأن لك الملك والقوة والمجد إلى الأبد. آمين."]]}, {"l": "Rom 11:36", "n": "", "vs": [[36, "فإن منه وبه وله كل شيء. له المجد إلى الأبد. آمين!"]]}, {"l": "Rom 16:27", "n": "", "vs": [[27, "المجد لله إلى الأبد، الحكيم وحده، بيسوع المسيح. آمين!"]]}, {"l": "Gal 1:5", "n": "", "vs": [[5, "له المجد إلى أبد الآبدين. آمين!"]]}, {"l": "Eph 3:21", "n": "", "vs": [[21, "له المجد في الكنيسة، في المسيح يسوع، مدى الأجيال والدهور! آمين …"]]}, {"l": "1Ti 1:17", "n": "", "vs": [[17, "فللملك الأزلي، الله الواحد غير المنظور وغير الفاني، الكرامة والمجد إلى أبد الآبدين. آمين!"]]}, {"l": "Jud 1:25", "n": "", "vs": [[25, "لله الواحد، مخلصنا بيسوع المسيح ربنا ... المجد والجلال والقدرة والسلطة، من قبل أن كان الزمان، والآن وطوال الأزمان آمين!"]]}, {"l": "Rev 1:6", "n": "", "vs": [[6, "وجعل منا مملكة، وكهنة لله أبيه، له المجد والسلطان إلى أبد الآبدين. آمين!"]]}, {"l": "Rev 4:9-11", "n": "", "vs": [[9, "وكلما قدمت هذه الكائنات التمجيد والإجلال والحمد للجالس على العرش، الحي إلى أبد الآبدين،"], [10, "يجثو الشيوخ الأربعة والعشرون أمام الجالس على العرش ساجدين للحي إلى أبد الآبدين، ويلقون أكاليلهم أمام عرشه وهم يهتفون:"], [11, "«مستحق أنت ياربنا وإلهنا المجد والإجلال والقدرة، لأنك خلقت الأشياء كلها، وهي بإرادتك كائنة وقد خلقت!»"]]}, {"l": "Rev 5:12", "n": "", "vs": [[12, "وهم يهتفون بصوت عال: «مستحق هو الحمل المذبوح أن ينال القدرة والغنى والحكمة والقوة والإجلال والمجد والبركة»."]]}, {"l": "Rev 7:12", "n": "", "vs": [[12, "قائلين: «آمين! لإلهنا البركة والمجد والحكمة والشكر والإجلال والقدرة والقوة إلى أبد الآبدين. آمين!»"]]}, {"l": "Rev 11:13", "n": "", "vs": [[13, "وفي الوقت ذاته يحدث زلزال عنيف يدمر عشر المدينة، ويهلك سبعة آلاف من ساكنيها. فيرتعب الناجون ويمجدون إله السماء."]]}, {"l": "Rev 14:7", "n": "", "vs": [[7, "وهو ينادي عاليا: «اتقوا الله ومجدوه، فقد حانت ساعة دينونته. اسجدوا لمن خلق السماء والأرض والبحر والينابيع»."]]}], "kwAr": "فلإلهنا وأبينا المجد", "noteAr": ""}, {"kw": "Amen", "raw": "Phi_4:23; Mat_6:12, Mat_28:20", "note": "", "refs": [{"l": "Phi 4:23", "n": "", "vs": [[23, "لتكن نعمة ربنا يسوع المسيح مع روحكم. آمين!"]]}, {"l": "Mat 6:12", "n": "", "vs": [[12, "واغفر لنا ذنوبنا، كما نغفر نحن للمذنبين إلينا!"]]}, {"l": "Mat 28:20", "n": "", "vs": [[20, "وعلموهم أن يعملوا بكل ما أوصيتكم به. وها أنا معكم كل الأيام إلى انتهاء الزمان! »."]]}], "kwAr": "آمين", "noteAr": ""}], "arS": [["فلإلهنا", ["G2316"]], [" ", []], ["وأبينا", ["G3962", "G2257"]], ["، ", []], ["المجد", ["G1391"]], [" إلى ", []], ["دهر الدهور", ["G165"]], [". ", []], ["آمين", ["G281"]], ["!", []]]}, {"c": 4, "v": 21, "text": "سلموا على كل قديس في المسيح يسوع.", "groups": [{"kw": "Salute", "raw": "Rom_16:3-16", "note": "", "refs": [{"l": "Rom 16:3-16", "n": "", "vs": [[3, "سلموا على بريسكلا وأكيلا، معاوني في خدمة المسيح يسوع،"], [4, "اللذين عرضا عنقيهما للذبح إنقاذا لحياتي، ولست أنا وحدي شاكرا لهما بل جميع كنائس الأمم أيضا."], [5, "وسلموا على الكنيسة في بيتهما. سلموا على أبينتوس، حبيبي الذي هو باكورة للمسيح من مقاطعة أسيا."], [6, "سلموا على مريم التي أجهدت نفسها كثيرا في خدمتنا من قبلكم."], [7, "سلموا على أندرونيكوس ويونياس، قريبي اللذين سجنا معي، وهما مشهوران بين الرسل، وقد كانا في المسيح قبلي."], [8, "سلموا على أمبلياس، حبيبي في الرب."], [9, "سلموا على أوربانوس، معاوننا في خدمة المسيح، وعلى إستاخيس، حبيبي."], [10, "سلموا على أبلس، الذي برهن عن ثباته في المسيح. سلموا على ذوي أرستوبولوس."], [11, "سلموا على هيروديون، قريبي. سلموا على ذوي نركيسوس الذين في الرب."], [12, "سلموا على تريفينا وتريفوسا اللتين تجهدان نفسيهما في خدمة الرب. سلموا على برسيس المحبوبة، التي أجهدت نفسها كثيرا في خدمة الرب."], [13, "سلموا على روفس المختار في الرب، وعلى أمه التي هي أم لي."], [14, "سلموا على أسينكريتس، وفليغون، وهرمس، وبتروباس، وهرماس، وعلى الإخوة الذين معهم."], [15, "سلموا على فيلولوغوس، وجوليا، ونيريوس، وأخته، وأولمباس، وعلى جميع القديسين الذين معهم."], [16, "سلموا بعضكم على بعض بقبلة مقدسة. تسلم عليكم جميع كنائس المسيح."]]}], "kwAr": "سلموا", "noteAr": ""}, {"kw": "saint", "raw": "Phi_1:1; 1Co_1:2; Eph_1:1", "note": "", "refs": [{"l": "Phi 1:1", "n": "", "vs": [[1, "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."]]}, {"l": "1Co 1:2", "n": "", "vs": [[2, "إلى كنيسة الله في مدينة كورنثوس، إلى الذين تقدسوا في المسيح يسوع، المدعوين، القديسين؛ وإلى جميع الذين يدعون باسم ربنا يسوع المسيح في كل مكان ربا لهم ولنا."]]}, {"l": "Eph 1:1", "n": "", "vs": [[1, "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."]]}], "kwAr": "على كل قديس", "noteAr": ""}, {"kw": "The", "raw": "Rom_16:21, Rom_16:22; Gal_1:2, Gal_2:3; Col_4:10-14; Phm_1:23, Phm_1:24", "note": "", "refs": [{"l": "Rom 16:21", "n": "", "vs": [[21, "يسلم عليكم تيموثاوس معاوني، ولوكيوس وياسون وسوسيباترس أقربائي."]]}, {"l": "Rom 16:22", "n": "", "vs": [[22, "وأنا، ترتيوس الذي أخط هذه الرسالة، أسلم عليكم في الرب."]]}, {"l": "Gal 1:2", "n": "", "vs": [[2, "ومن جميع الإخوة الذين معي، إلى الكنائس في مقاطعة غلاطية."]]}, {"l": "Gal 2:3", "n": "", "vs": [[3, "ولكن، حتى تيطس الذي كان يرافقني وهو يوناني، لم يضطر أن يختن."]]}, {"l": "Col 4:10-14", "n": "", "vs": [[10, "يسلم عليكم أرسترخس رفيقي في السجن؛ ومرقس ابن أخت برنابا، وفي شأنه تلقيتم بعض التوصيات: فإن جاء إليكم، فرحبوا به؛"], [11, "ويسوع المعروف باسم يسطس. هؤلاء جميعا من أهل الختان، وهم وحدهم معاوني لأجل ملكوت الله، وقد كانوا لي عزاء."], [12, "يسلم عليكم أبفراس الذي هو منكم، وهو عبد للمسيح يسوع، يجاهد كل حين لأجلكم في الصلوات لتثبتوا كاملين ولكم تمام اليقين من جهة مشيئة الله كلها."], [13, "فإني أشهد له بأنه يجتهد كثيرا لأجلكم ولأجل الذين في مدينة لاودكية والذين في مدينة هيرابوليس."], [14, "يسلم عليكم لوقا الطبيب الحبيب؛ وديماس."]]}, {"l": "Phm 1:23", "n": "", "vs": [[23, "يسلم عليك أبفراس، رفيق سجني في المسيح يسوع،"]]}, {"l": "Phm 1:24", "n": "", "vs": [[24, "وكذلك مرقس، وأرسترخس، وديماس، ولوقا زملائي في العمل."]]}], "kwAr": "الإخوة الذين معي", "noteAr": ""}], "arS": [["سلموا", ["G782"]], [" على ", []], ["كل", ["G3956"]], [" ", []], ["قديس", ["G40"]], [" في ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [".", []]]}, {"c": 4, "v": 22, "text": "الإخوة الذين معي يسلمون عليكم. ويسلم عليكم جميع القديسين، ولاسيما الذين هم من حاشية القيصر.", "groups": [{"kw": "the", "raw": "Rom_16:16; 2Co_13:13; Heb_13:24; 1Pe_5:13; 3Jo_1:14", "note": "", "refs": [{"l": "Rom 16:16", "n": "", "vs": [[16, "سلموا بعضكم على بعض بقبلة مقدسة. تسلم عليكم جميع كنائس المسيح."]]}, {"l": "2Co 13:13", "n": "", "vs": [[13, "جميع القديسين يسلمون عليكم."]]}, {"l": "Heb 13:24", "n": "", "vs": [[24, "سلموا على جميع مرشديكم، وعلى القديسين جميعا."]]}, {"l": "1Pe 5:13", "n": "", "vs": [[13, "ومن بابل، تسلم عليكم تلك التي اختارها الله معكم، وكذلك مرقس ابني."]]}, {"l": "3Jo 1:14", "n": "", "vs": [[14, "فآمل أن نتقابل عن قريب، فنتكلم مواجهة! (1:15) السلام لك! الأحباء هنا يسلمون عليك. سلم على كل واحد من الأحباء باسمه."]]}], "kwAr": "جميع القديسين", "noteAr": ""}, {"kw": "they", "raw": "Phi_1:13", "note": "", "refs": [{"l": "Phi 1:13", "n": "", "vs": [[13, "حتى إنه قد صار معروفا لدى الحرس الإمبراطوري كله ولدى الباقين جميعا أن قيودي إنما هي لأجل المسيح؛"]]}], "kwAr": "ولاسيما الذين", "noteAr": ""}, {"kw": "Caesars", "raw": "The cruel, worthless, and diabolical Nero was at this time emperor of Rome; but it is not improbable that the empress Poppaea was favourably inclined to Christianity, as Josephus relates that Θεοσεβης [Strongs G2318], γαρ [Strongs G1063], ην [Strongs G2258], she was a worshipper of the true God. Jerome states (in Philemon) that St. Paul had converted many in Caesars family; for being by the emperor cast into prison, he became more known to his family, and turned the house of Christs persecutor into a church.", "note": "The cruel, worthless, and diabolical Nero was at this time emperor of Rome; but it is not improbable that the empress Poppaea was favourably inclined to Christianity, as Josephus relates that Θεοσεβης [Strongs G2318], γαρ [Strongs G1063], ην [Strongs G2258], she was a worshipper of the true God. Jerome states (in Philemon) that St. Paul had converted many in Caesars family; for being by the emperor cast into prison, he became more known to his family, and turned the house of Christs persecutor into a church.", "refs": [], "kwAr": "حاشية القيصر", "noteAr": "كان نيرون القاسي الشرير إمبراطور روما في ذلك الوقت؛ لكن ليس بعيدًا أن تكون الإمبراطورة بوبيّا مائلة إلى المسيحية، إذ يروي يوسيفوس أنها كانت «ثيوسيبيس» أي عابدة للإله الحقيقي. ويذكر جيروم (في تفسيره لفليمون) أن الرسول بولس هدى كثيرين من أهل بيت القيصر؛ فإذ ألقاه الإمبراطور في السجن صار معروفًا أكثر لدى أهل بيته، فحوّل بيت مضطهد المسيح إلى كنيسة."}], "arS": [["الإخوة", ["G80"]], [" الذين معي ", []], ["يسلمون", ["G782"]], [" عليكم. ", []], ["ويسلم", ["G782"]], [" عليكم ", []], ["جميع", ["G3956"]], [" ", []], ["القديسين", ["G40"]], ["، ", []], ["ولاسيما", ["G3122"]], [" الذين هم من ", []], ["حاشية", ["G3614"]], [" ", []], ["القيصر", ["G2541"]], [".", []]]}, {"c": 4, "v": 23, "text": "لتكن نعمة ربنا يسوع المسيح مع روحكم. آمين!", "groups": [{"kw": "", "raw": "Rom_16:20,Rom_16:24; 2Co_13:14", "note": "", "refs": [{"l": "Rom 16:20", "n": "", "vs": [[20, "وإله السلام سيسحق الشيطان تحت أقدامكم سريعا. لتكن نعمة ربنا يسوع المسيح معكم."]]}, {"l": "Rom 16:24", "n": "", "vs": [[24, "«لتكن نعمة ربنا يسوع المسيح معكم. آمين!»"]]}, {"l": "2Co 13:14", "n": "", "vs": [[14, "ولتكن معكم جميعا نعمة ربنا يسوع المسيح، ومحبة الله، وشركة الروح القدس. آمين!"]]}], "kwAr": "", "noteAr": ""}], "arS": [["لتكن ", []], ["نعمة", ["G5485"]], [" ", []], ["ربنا", ["G2962", "G2257"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [" مع روحكم. ", []], ["آمين", ["G281"]], ["!", []]]}], "strong": true}];</script>
