<script>window.CATALOG=[{"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 20, "nv": 480, "refs": 6756, "last": "20:49", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 50, "abbr": "Phi", "en": "Philippians", "verses": [{"c": 1, "v": 1, "text": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين.", "groups": [{"kw": "Paul", "raw": "Rom_1:1; 1Co_1:1", "note": "", "refs": [{"l": "Rom 1:1", "n": "", "vs": [[1, "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"]]}, {"l": "1Co 1:1", "n": "", "vs": [[1, "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"]]}], "kwAr": "بولس", "noteAr": ""}, {"kw": "Timotheus", "raw": "Act_16:1-3; 1Co_16:10; 2Co_1:1; Col_1:1; 1Th_1:1; 2Th_1:1; 1Ti_1:2; Heb_13:23", "note": "", "refs": [{"l": "Act 16:1-3", "n": "", "vs": [[1, "ووصل بولس إلى دربة، ثم إلى لسترة، وكان فيها تلميذ اسمه تيموثاوس، أمه يهودية كانت قد آمنت بالمسيح، وأبوه يوناني."], [2, "وكان الإخوة في لسترة وإيقونية يشهدون لتيموثاوس شهادة حسنة."], [3, "فأحب بولس أن يصحبه في التبشير. ولأن يهود تلك المنطقة كانوا يعرفون أن أباه يوناني، فقد أخذه بولس وختنه."]]}, {"l": "1Co 16:10", "n": "", "vs": [[10, "وإذا وصل تيموثاوس إليكم، فاهتموا بأن يكون مطمئنا عندكم، لأنه يقوم بعمل الرب مثلي."]]}, {"l": "2Co 1:1", "n": "", "vs": [[1, "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."]]}, {"l": "Col 1:1", "n": "", "vs": [[1, "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"]]}, {"l": "1Th 1:1", "n": "", "vs": [[1, "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."]]}, {"l": "2Th 1:1", "n": "", "vs": [[1, "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."]]}, {"l": "1Ti 1:2", "n": "", "vs": [[2, "إلى تيموثاوس ولدي الحقيقي في الإيمان. لتكن لك النعمة والرحمة والسلام من الله أبينا والمسيح يسوع ربنا!"]]}, {"l": "Heb 13:23", "n": "", "vs": [[23, "واعلموا أن أخانا تيموثاوس قد أطلق من السجن. فإن أسرع في المجيء إلي، نذهب معا لرؤيتكم."]]}], "kwAr": "وتيموثاوس", "noteAr": ""}, {"kw": "the servants", "raw": "Mar_13:34; Joh_12:26; Tit_1:1; Jam_1:1; 2Pe_1:1; Jud_1:1; Rev_1:1, Rev_19:10, Rev_22:9", "note": "", "refs": [{"l": "Mar 13:34", "n": "", "vs": [[34, "فالأمر أشبه بإنسان مسافر، ترك بيته، وأعطى عبيده السلطة معينا لكل واحد عمله، وأوصى حارس الباب أن يسهر."]]}, {"l": "Joh 12:26", "n": "", "vs": [[26, "من أراد أن يخدمني فليتبعني. وحيث أكون أنا يكون خادمي أيضا. وكل من يخدمني يكرمه أبي."]]}, {"l": "Tit 1:1", "n": "", "vs": [[1, "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"]]}, {"l": "Jam 1:1", "n": "", "vs": [[1, "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"]]}, {"l": "2Pe 1:1", "n": "", "vs": [[1, "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"]]}, {"l": "Jud 1:1", "n": "", "vs": [[1, "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."]]}, {"l": "Rev 1:1", "n": "", "vs": [[1, "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."]]}, {"l": "Rev 19:10", "n": "", "vs": [[10, "فجثوت عند قدميه لأسجد له، فقال لي: «لا تفعل! إني عبد لله، مثلك ومثل إخوتك المؤمنين الذين لديهم الشهادة المختصة بيسوع: لله اسجد! فإن الشهادة المختصة بيسوع هي روح النبوءة»."]]}, {"l": "Rev 22:9", "n": "", "vs": [[9, "فقال لي: «لا تفعل! إنني عبد مثلك ومثل إخوتك الأنبياء، ومثل الذين يراعون ما جاء في هذا الكتاب. لله اسجد!»"]]}], "kwAr": "عبدي المسيح يسوع", "noteAr": ""}, {"kw": "the saints", "raw": "Rom_1:7; 1Co_1:2; 2Co_1:1; Eph_1:1, Eph_1:15; 2Th_1:10", "note": "", "refs": [{"l": "Rom 1:7", "n": "", "vs": [[7, "إلى جميع من هم في روما من أحباء الله القديسين المدعوين. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}, {"l": "1Co 1:2", "n": "", "vs": [[2, "إلى كنيسة الله في مدينة كورنثوس، إلى الذين تقدسوا في المسيح يسوع، المدعوين، القديسين؛ وإلى جميع الذين يدعون باسم ربنا يسوع المسيح في كل مكان ربا لهم ولنا."]]}, {"l": "2Co 1:1", "n": "", "vs": [[1, "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."]]}, {"l": "Eph 1:1", "n": "", "vs": [[1, "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."]]}, {"l": "Eph 1:15", "n": "", "vs": [[15, "لذلك أنا أيضا، وقد سمعت بما فيكم من الإيمان بالرب يسوع والمحبة لجميع القديسين،"]]}, {"l": "2Th 1:10", "n": "", "vs": [[10, "عندما يعود في ذلك اليوم ليتمجد في قديسيه ويكون موضع العجب عند جميع الذين آمنوا، وأنتم قد آمنتم بشهادتنا لكم!"]]}], "kwAr": "جميع القديسين", "noteAr": ""}, {"kw": "Philippi", "raw": "Act_16:12-15; 1Th_2:2", "note": "", "refs": [{"l": "Act 16:12-15", "n": "", "vs": [[12, "ومنها إلى مدينة فيلبي، وهي كبرى مدن مقاطعة مقدونية، ومستعمرة للرومان. فبقينا فيها بضعة أيام."], [13, "وفي يوم السبت ذهبنا إلى ضفة نهر في إحدى ضواحي المدينة حيث جرت العادة أن تقام الصلاة. فجلسنا نكلم النساء المجتمعات،"], [14, "ومن بينهن تاجرة أرجوان من مدينة ثياتيرا، متعبدة لله، اسمها ليدية، كانت تسمع ففتح الله قلبها لتقبل كلام بولس."], [15, "فلما تعمدت هي وأهل بيتها، دعتنا بإلحاح لقبول ضيافتها قائلة: «إن كنتم قد حكمتم أني مؤمنة بالرب، فانزلوا ضيوفا ببيتي». فاضطرتنا إلى قبول دعوتها."]]}, {"l": "1Th 2:2", "n": "", "vs": [[2, "فمع أننا كنا قد قاسينا الألم والإهانة في مدينة فيلبي، كما تعلمون، فقد تجرأنا في إلهنا أن نكلمكم بإنجيل الله مجاهدين في وجه المعارضة الشديدة."]]}], "kwAr": "مدينة فيلبي", "noteAr": ""}, {"kw": "the bishops", "raw": "Act_1:20; 1Ti_3:1, 1Ti_3:2; Tit_1:7; 1Pe_2:25; Rev_1:20, Rev_2:1, Rev_2:8, Rev_2:12", "note": "", "refs": [{"l": "Act 1:20", "n": "", "vs": [[20, "فتمت النبوءة الواردة في كتاب المزامير: لتصر داره خرابا، ولا يسكنها ساكن. وأيضا: ليستلم وظيفته آخر!"]]}, {"l": "1Ti 3:1", "n": "", "vs": [[1, "ما أصدق القول إن من يرغب في الرعاية فإنما يتوق إلى عمل صالح."]]}, {"l": "1Ti 3:2", "n": "", "vs": [[2, "إذن، يجب أن يكون الراعي بلا عيب، زوجا لامرأة واحدة، نبيها عاقلا مهذبا مضيافا، قادرا على التعليم؛"]]}, {"l": "Tit 1:7", "n": "", "vs": [[7, "وذلك لأن الناظر يجب أن يكون بريئا من كل تهمة باعتباره وكيلا لله، لا معجبا بنفسه ولا حاد الطبع، ولا مدمن الخمر، ولا عنيفا، ولا ساعيا إلى المكسب الخسيس؛"]]}, {"l": "1Pe 2:25", "n": "", "vs": [[25, "فقد كنتم ضالين كخراف ضائعة، ولكنكم قد رجعتم الآن إلى راعي نفوسكم وحارسها!"]]}, {"l": "Rev 1:20", "n": "", "vs": [[20, "وهذا سر النجوم السبعة التي رأيتها في يميني، ومنائر الذهب السبع: النجوم السبعة تمثل ملائكة الكنائس السبع، أما المنائر السبع فهي تمثل الكنائس السبع نفسها."]]}, {"l": "Rev 2:1", "n": "", "vs": [[1, "اكتب إلى ملاك الكنيسة في أفسس: إليك ما يقوله الذي يمسك النجوم السبع بيمينه ويمشي بين منائر الذهب السبع:"]]}, {"l": "Rev 2:8", "n": "", "vs": [[8, "واكتب إلى ملاك الكنيسة في سميرنا: إليك ما يقوله الأول والآخر، الذي كان ميتا وعاد حيا:"]]}, {"l": "Rev 2:12", "n": "", "vs": [[12, "واكتب إلى ملاك الكنيسة في برغامس: إليك ما يقوله صاحب السيف القاطع ذي الحدين."]]}], "kwAr": "رعاة", "noteAr": ""}, {"kw": "and deacons", "raw": "Act_6:1-7; 1Ti_3:8, 1Ti_3:10,1Ti_3:12, 1Ti_3:13", "note": "", "refs": [{"l": "Act 6:1-7", "n": "", "vs": [[1, "وإذ تكاثر التلاميذ في تلك الأيام، احتج اليهود اليونانيون على العبرانيين، لأن أراملهم لم يكن يحصلن على نصيب من الإعانات اليومية."], [2, "فدعا الرسل الاثنا عشر جماعة التلاميذ وقالوا لهم: «لا يصح أن نترك نحن كلمة الله لنقوم بتوزيع الإعانات!"], [3, "فاختاروا، أيها الإخوة، سبعة رجال منكم، لهم شهادة حسنة، ممتلئين من الروح القدس والحكمة، فنعينهم ليقوموا بهذه المهمة."], [4, "أما نحن، فنداوم على الصلاة وخدمة الكلمة»."], [5, "فاستحسنت الجماعة كلها هذا الرأي؛ ووقع الاختيار على استفانوس، وهو رجل مملوء من الإيمان والروح القدس، وفيلبس، وبروخورس، ونيكانور، وتيمون، وبرميناس، ونيقولاوس الأنطاكي المتهود."], [6, "وقدموهم للرسل، فصلوا ووضعوا أيديهم عليهم."], [7, "فزادت كلمة الله انتشارا، وتكاثر عدد التلاميذ في أورشليم، وأذعن للإيمان مجموعة كبيرة من الكهنة."]]}, {"l": "1Ti 3:8", "n": "", "vs": [[8, "أما المدبرون، فيجب أن يكونوا أيضا ذوي رصانة، لا ذوي لسانين، ولا مدمنين للخمر، لا ساعين إلى المكسب الخسيس."]]}, {"l": "1Ti 3:10", "n": "", "vs": [[10, "وأيضا يجب أن يتم اختبار المدبرين أولا، فإذا تبين أنهم بلا شكوى، فليباشروا خدمة التدبير."]]}, {"l": "1Ti 3:12", "n": "", "vs": [[12, "كما يجب أن يكون كل مدبر زوجا لامرأة واحدة، يحسن تدبير أولاده وبيته."]]}, {"l": "1Ti 3:13", "n": "", "vs": [[13, "فإن الذين يقومون بخدمة التدبير خير قيام، يكسبون لأنفسهم مكانة جيدة، وجرأة كبيرة في الإيمان الثابت في المسيح يسوع!"]]}], "kwAr": "ومدبرين", "noteAr": ""}], "arS": [["من ", []], ["بولس", ["G3972"]], [" ", []], ["وتيموثاوس", ["G5095"]], ["، ", []], ["عبدي", ["G1401"]], [" ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], ["، إلى ", []], ["جميع", ["G3956"]], [" ", []], ["القديسين", ["G40"]], [" في ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], ["، المقيمين في مدينة ", []], ["فيلبي", ["G5375"]], ["، بمن فيهم من ", []], ["رعاة", ["G1985"]], [" ", []], ["ومدبرين", ["G1249"]], [".", []]]}, {"c": 1, "v": 2, "text": "لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح.", "groups": [{"kw": "", "raw": "Rom_1:7; 2Co_1:2; 1Pe_1:2", "note": "", "refs": [{"l": "Rom 1:7", "n": "", "vs": [[7, "إلى جميع من هم في روما من أحباء الله القديسين المدعوين. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح!"]]}, {"l": "2Co 1:2", "n": "", "vs": [[2, "لتكن لكم النعمة والسلام من الله أبينا ومن الرب يسوع المسيح!"]]}, {"l": "1Pe 1:2", "n": "", "vs": [[2, "بحسب علمه السابق ثم قدسهم بالروح ليطيعوا يسوع المسيح ويطهروا برش دمه عليهم."]]}], "kwAr": "", "noteAr": ""}], "arS": [["لتكن لكم ", []], ["النعمة", ["G5485"]], [" ", []], ["والسلام", ["G1515"]], [" ", []], ["من", ["G575"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["أبينا", ["G3962", "G2257"]], [" ", []], ["والرب", ["G2962"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 1, "v": 3, "text": "إني أشكر إلهي كلما تذكرتكم،", "groups": [{"kw": "I thank", "raw": "Rom_1:8, Rom_1:9, Rom_6:17; 1Co_1:4", "note": "", "refs": [{"l": "Rom 1:8", "n": "", "vs": [[8, "بادىء بدء، أشكر إلهي بيسوع المسيح من أجلكم جميعا، لأن إيمانكم يذاع خبره في العالم كله."]]}, {"l": "Rom 1:9", "n": "", "vs": [[9, "فإن الله الذي أخدمه بروحي في التبشير بإنجيل ابنه، هو شاهد لي كيف لا أتوقف عن ذكركم"]]}, {"l": "Rom 6:17", "n": "", "vs": [[17, "إنما الشكر لله، لأنكم كنتم عبيدا للخطيئة ولكن أطعتم من القلب صيغة التعليم الذي وضعتم في عهدته."]]}, {"l": "1Co 1:4", "n": "", "vs": [[4, "إني أشكر الله من أجلكم دائما، وعلى نعمة الله الموهوبة لكم في المسيح يسوع."]]}], "kwAr": "إني أشكر إلهي", "noteAr": ""}, {"kw": "upon", "raw": "Eph_1:15, Eph_1:16; Col_1:3, Col_1:4; 1Th_1:2, 1Th_1:3, 1Th_3:9; 2Th_1:3; 2Ti_1:3; Phm_1:4, Phm_1:5", "note": "", "refs": [{"l": "Eph 1:15", "n": "", "vs": [[15, "لذلك أنا أيضا، وقد سمعت بما فيكم من الإيمان بالرب يسوع والمحبة لجميع القديسين،"]]}, {"l": "Eph 1:16", "n": "", "vs": [[16, "لا أنقطع عن شكر الله لأجلكم وعن ذكركم في صلواتي،"]]}, {"l": "Col 1:3", "n": "", "vs": [[3, "إننا دائما نرفع الشكر لله، أبي ربنا يسوع المسيح فيما نصلي لأجلكم."]]}, {"l": "Col 1:4", "n": "", "vs": [[4, "إذ بلغنا خبر إيمانكم بالمسيح يسوع والمحبة التي لكم نحو جميع القديسين،"]]}, {"l": "1Th 1:2", "n": "", "vs": [[2, "إننا نشكر الله دائما من أجلكم جميعا، إذ نذكركم في صلواتنا دون توقف؛"]]}, {"l": "1Th 1:3", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"]]}, {"l": "1Th 3:9", "n": "", "vs": [[9, "فأي شكر نستطيع أن نؤديه إلى الله عوضا عنكم من أجل كل ما نبتهج به من الفرح بسببكم أمام إلهنا،"]]}, {"l": "2Th 1:3", "n": "", "vs": [[3, "من واجبنا أن نشكر الله على الدوام لأجلكم أيها الإخوة. كما أن هذا حق: لأن إيمانكم ينمو نموا فائقا، ومحبة أحدكم للآخر تفيض بينكم جميعا."]]}, {"l": "2Ti 1:3", "n": "", "vs": [[3, "كم أشكر الله ، الذي أعبده بضمير طاهر كما أخذت عن أجدادي، إذ مازلت أذكرك دائما في تضرعاتي ليلا ونهارا؛"]]}, {"l": "Phm 1:4", "n": "", "vs": [[4, "إني أشكر إلهي، إذ أذكرك دائما في ص "n": "", "vs": [[7, "كما أن من الحق أن يكون لي هذا الشعور تجاهكم جميعا، لأني أحتفظ بكم في قلبي، لكونكم جميعا شركاء لي في النعمة، سواء أكان في قيودي أم في الدفاع عن الإنجيل وتثبيته."]]}, {"l": "Phi 4:14", "n": "", "vs": [[14, "إلا أنكم حسنا فعلتم إذ ساهمتم في تبديد ضيقتي."]]}, {"l": "Act 16:15", "n": "", "vs": [[15, "فلما تعمدت هي وأهل بيتها، دعتنا بإلحاح لقبول ضيافتها قائلة: «إن كنتم قد حكمتم أني مؤمنة بالرب، فانزلوا ضيوفا ببيتي». فاضطرتنا إلى قبول دعوتها."]]}, {"l": "Rom 11:17", "n": "", "vs": [[17, "فإذا كانت بعض أغصان الزيتونة قد قطعت، ثم طعمت فيها وأنت من زيتونة برية، فصرت بذلك شريكا في أصل الزيتونة وغذائها،"]]}, {"l": "Rom 12:13", "n": "", "vs": [[13, "متعاونين على سد حاجات القديسين، مداومين على إضافة الغرباء."]]}, {"l": "Rom 15:26", "n": "", "vs": [[26, "ذلك أن مؤمني مقاطعتي مقدونية وأخائية حسن لديهم أن يجمعوا إعانة للفقراء بين القديسين الذين في أورشليم."]]}, {"l": "1Co 1:9", "n": "", "vs": [[9, "فإن الله أمين، وقد دعاكم إلى الشركة مع ابنه يسوع ربنا."]]}, {"l": "2Co 8:1", "n": "", "vs": [[1, "والآن، نعرفكم، أيها الإخوة، بنعمة الله الموهوبة في كنائس مقاطعة مقدونية."]]}, {"l": "Eph 2:19-22", "n": "", "vs": [[19, "إذن، لستم غرباء وأجانب بعد الآن، بل أنتم رعية مع القديسين وأعضاء في عائلة الله،"], [20, "وقد بنيتم على أساس الرسل والأنبياء، والمسيح يسوع نفسه هو حجر الزاوية الأساس،"], [21, "الذي فيه يتناسق البناء كله فيرتفع ليصير هيكلا مقدسا في الرب."], [22, "وفيه أنتم أيضا قد بنيتم معا فصرتم مسكنا لله بوجود الروح."]]}, {"l": "Eph 3:6", "n": "", "vs": [[6, "وهو أن الأمم هم شركاء اليهود في الميراث، وأعضاء في الجسد معهم، ولهم أيضا حق الاستفادة من الوعد. وذلك في المسيح يسوع وبفضل الإنجيل"]]}, {"l": "Col 1:21-23", "n": "", "vs": [[21, "وأنتم، يامن كنتم في الماضي أجانب وأعداء في الفكر، بأعمالكم الشريرة،"], [22, "قد صالحكم الآن في جسد بشرية (ابنه) بالموت. وذلك لكي يحضركم فتمثلوا أمامه وأنتم قديسون بلا ذنب ولا لوم."], [23, "على أن تثبتوا فعلا في الإيمان، مؤسسين وراسخين وغير متحولين عن رجاء الإنجيل الذي سمعتموه والذي بشر به للخليقة كلها تحت السماء، وله صرت أنا بولس خادما."]]}, {"l": "Phm 1:17", "n": "", "vs": [[17, "فإن كنت تعتبرني شريكك، فاقبله كأنه أنا."]]}, {"l": "Heb 3:14", "n": "", "vs": [[14, "فإن تمسكنا دائما بالثقة التي انطلقنا بها في البداية، وأبقيناها ثابتة إلى النهاية، نكون مشاركين للمسيح."]]}, {"l": "2Pe 1:1", "n": "", "vs": [[1, "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"]]}, {"l": "1Jo 1:3", "n": "", "vs": [[3, "فنحن، إذن، نخبركم بما رأيناه وسمعناه، لكي تكونوا شركاءنا. كما أن شركتنا هي مع الآب ومع ابنه يسوع المسيح."]]}, {"l": "1Jo 1:7", "n": "", "vs": [[7, "ولكن، إن كنا فعلا نعيش في النور، كما هو في النور، تكون لنا حقا شركة بعضنا مع بعض، ودم ابنه يسوع يطهرنا من كل خطيئة."]]}], "kwAr": "", "noteAr": ""}], "arS": [["بسبب ", []], ["مساهمتكم", ["G2842"]], [" في نشر ", []], ["الإنجيل", ["G2098"]], [" من ", []], ["أول", ["G4413"]], [" ", []], ["يوم", ["G2250"]], [" إلى ", []], ["الآن", ["G3568"]], [".", []]]}, {"c": 1, "v": 6, "text": "ولي ثقة في هذا الأمر بالذات: أن الذي بدأ فيكم عملا صالحا سوف يتممه إلى يوم المسيح يسوع.", "groups": [{"kw": "confident", "raw": "2Co_1:15, 2Co_2:3, 2Co_7:16, 2Co_9:4; Gal_5:10; 2Th_3:4; Phm_1:21; Heb_10:35", "note": "", "refs": [{"l": "2Co 1:15", "n": "", "vs": [[15, "فبهذه القناعة، كنت قد نويت سابقا أن أجيء إليكم، ليكون لكم فرح مرة أخرى،"]]}, {"l": "2Co 2:3", "n": "", "vs": [[3, "لهذا أكتب إليكم ما أكتبه هنا، حتى عندما أجيء لا يأتيني الحزن من الذي كان يجب أن يأتيني منه الفرح. ولي ثقة بجميعكم أن فرحي هو فرحكم جميعا."]]}, {"l": "2Co 7:16", "n": "", "vs": [[16, "إني أفرح بكوني واثقا بكم في كل شيء."]]}, {"l": "2Co 9:4", "n": "", "vs": [[4, "لئلا نضطر نحن، ولا أقول أنتم، إلى الخجل بهذه الثقة العظيمة إذا ما رافقني بعض المقدونيين ووجدوكم غير جاهزين."]]}, {"l": "Gal 5:10", "n": "", "vs": [[10, "ولكن لي ثقة بكم في الرب أنكم لن تعتنقوا رأيا آخر. وكل من يثير البلبلة بينكم سيلقى عقاب ذلك، كائنا من كان."]]}, {"l": "2Th 3:4", "n": "", "vs": [[4, "ولنا في الرب ملء الثقة من جهتكم بأنكم عاملون بما نوصيكم به، وستعملون به أيضا."]]}, {"l": "Phm 1:21", "n": "", "vs": [[21, "لما كنت واثقا بإطاعتك، كتبت هذه الرسالة إليك، عالما أنك ستفعل أيضا فوق ما أطلب."]]}, {"l": "Heb 10:35", "n": "", "vs": [[35, "إذن، لا تتخلوا عن ثقتكم بالرب. فإن لها مكافأة عظيمة."]]}], "kwAr": "ولي ثقة", "noteAr": ""}, {"kw": "begun", "raw": "Phi_1:29, Phi_2:13; Joh_6:29; Act_11:18, Act_16:14; Rom_8:28-30; Eph_2:4-10; Col_2:12; 1Th_1:3; 2Th_2:13, 2Th_2:14; Tit_3:4-6; Heb_13:20,Heb_13:21; Jam_1:16-18; 1Pe_1:2, 1Pe_1:3", "note": "", "refs": [{"l": "Phi 1:29", "n": "", "vs": [[29, "فقد وهب لكم، لأجل المسيح، لا أن تؤمنوا به وحسب، بل أيضا أن تتألموا لأجله،"]]}, {"l": "Phi 2:13", "n": "", "vs": [[13, "لأن الله هو الذي ينشيء فيكم الإرادة والعمل لأجل مرضاته."]]}, {"l": "Joh 6:29", "n": "", "vs": [[29, "أجاب يسوع: «العمل الذي يطلبه الله هو أن تؤمنوا بمن أرسله»."]]}, {"l": "Act 11:18", "n": "", "vs": [[18, "فلما سمع المعارضون هذا، سكتوا، ومجدوا الله قائلين: «إذن، قد أنعم الله أيضا على غير اليهود بالتوبة لنوال الحياة»."]]}, {"l": "Act 16:14", "n": "", "vs": [[14, "ومن بينهن تاجرة أرجوان من مدينة ثياتيرا، متعبدة لله، اسمها ليدية، كانت تسمع ففتح الله قلبها لتقبل كلام بولس."]]}, {"l": "Rom 8:28-30", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."], [29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."], [30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."]]}, {"l": "Eph 2:4-10", "n": "", "vs": [[4, "أما الله ، وهو غني في الرحمة، فبسبب محبته العظيمة التي أحبنا بها،"], [5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"], [6, "وأقامنا معه وأجلسنا معه في الأماكن السماوية في المسيح يسوع."], [7, "وذلك كي يعرض في الدهور القادمة غنى نعمته الفائق في لطفه علينا في المسيح يسوع."], [8, "فإنكم بالنعمة مخلصون، بالإيمان، وهذا ليس منكم. إنه هبة من الله،"], [9, "لا على أساس الأعمال، حتى لا يفتخر أحد."], [10, "فإننا نحن تحفة الله، وقد خلقنا في المسيح يسوع لأعمال صالحة أعدها سلفا لنسلك فيها."]]}, {"l": "Col 2:12", "n": "", "vs": [[12, "فقد دفنتم معه في المعمودية، وفيها أيضا أقمتم معه، عن طريق إيمانكم بقدرة الله الذي أقامه من بين الأموات."]]}, {"l": "1Th 1:3", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "2Th 2:14", "n": "", "vs": [[14, "فإلى هذا الأمر قد دعاكم ببشارتنا لكم، لنوال مجد ربنا يسوع المسيح."]]}, {"l": "Tit 3:4-6", "n": "", "vs": [[4, "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،"], [5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"], [6, "الذي سكبه علينا بغنى بيسوع المسيح مخلصنا."]]}, {"l": "Heb 13:20", "n": "", "vs": [[20, "وأسأل الله ، إله السلام الذي أقام من بين الأموات ربنا يسوع راعي الخراف العظيم بفضل دمه الذي ختم به العهد الأبدي"]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}, {"l": "Jam 1:16-18", "n": "", "vs": [[16, "فيا إخوتي الأحباء، لا تضلوا:"], [17, "إن كل عطية صالحة وهبة كاملة إنما تنزل من فوق، من لدن أبي الأنوار الذي ليس فيه تحول، ولا ظل لأنه لا يدور."], [18, "وهو قد شاء أن يجعلنا أولادا له، فولدنا بكلمته، كلمة الحق. وغايته أن نكون باكورة خليقته."]]}, {"l": "1Pe 1:2", "n": "", "vs": [[2, "بحسب علمه السابق ثم قدسهم بالروح ليطيعوا يسوع المسيح ويطهروا برش دمه عليهم."]]}, {"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}], "kwAr": "الذي بدأ فيكم", "noteAr": ""}, {"kw": "will", "raw": "Psa_138:8; Joh_6:29; Eph_4:12; 1Th_5:23, 1Th_5:24; 2Th_1:11; 1Pe_5:1 ["المعرفة", ["G1922"]], [" ", []], ["والإدراك", ["G144"]], ["،", []]]}, {"c": 1, "v": 10, "text": "لكي تستحسنوا الأمور الممتازة، حتى تكونوا طاهرين وخالين من العثرات إلى يوم المسيح،", "groups": [{"kw": "ye", "raw": "Isa_7:15, Isa_7:16; Amo_5:14, Amo_5:15; Mic_3:2; Joh_3:20; Rom_2:18, Rom_7:16, Rom_7:22, Rom_8:7; Rom_12:2, Rom_12:9", "note": "", "refs": [{"l": "Isa 7:15", "n": "", "vs": [[15, "وحين يعرف أن يميز بين الخير والشر يأكل زبدا وعسلا،"]]}, {"l": "Isa 7:16", "n": "", "vs": [[16, "لأنه قبل أن يعرف الصبي كيف يرفض الشر ويختار الخير، فإن إسرائيل وأرام اللتين تخشيان ملكيهما تصبحان مهجورتين."]]}, {"l": "Amo 5:14", "n": "", "vs": [[14, "اطلبوا الخير لا الشر لتحيوا، فيكون الرب الإله القدير معكم كما تقولون."]]}, {"l": "Amo 5:15", "n": "", "vs": [[15, "امقتوا الشر وأحبوا الخير وأقيموا العدل في ساحة القضاء، لعل الرب الإله القدير يترفق على بقية بيت يوسف."]]}, {"l": "Mic 3:2", "n": "", "vs": [[2, "أنتم يامن تبغضون الخير وتحبون الشر، وتسلخون جلود شعبي وتجردون لحومهم عن عظامهم."]]}, {"l": "Joh 3:20", "n": "", "vs": [[20, "فكل من يعمل الشر يبغض النور، ولا يأتي إليه مخافة أن تفضح أعماله."]]}, {"l": "Rom 2:18", "n": "", "vs": [[18, "وتميز ما هو الأفضل بسبب ما تعلمته من الشريعة؛"]]}, {"l": "Rom 7:16", "n": "", "vs": [[16, "فما دمت أعمل ما لا أريده، فإني أصادق على صواب الشريعة."]]}, {"l": "Rom 7:22", "n": "", "vs": [[22, "أن لدي الشر. فإنني، وفقا للإنسان الباطن في، أبتهج بشريعة الله."]]}, {"l": "Rom 8:7", "n": "", "vs": [[7, "لأن اهتمام الجسد هو عداوة لله، إذ إنه لا يخضع لناموس الله، بل لا يستطيع ذلك."]]}, {"l": "Rom 12:2", "n": "", "vs": [[2, "ولا تتكيفوا مع هذا العالم، بل تغيروا بتجديد الذهن، لتميزوا ما هي إرادة الله الصالحة المقبولة الكاملة."]]}, {"l": "Rom 12:9", "n": "", "vs": [[9, "ولتكن المحبة بلا رياء. انفروا من الشر، والتصقوا بالخير."]]}], "kwAr": "لكي", "noteAr": ""}, {"kw": "approve things that are excellent", "raw": "or, try things that differ, Job_12:11, Job_34:3; Rom_12:2; 2Co_11:13-15; Eph_5:10; 1Th_5:21; Heb_5:12-14; 1Jo_4:1; Rev_2:2", "note": "or, try things that differ, Job_12:11, Job_34:3; Rom_12:2; 2Co_11:13-15; Eph_5:10; 1Th_5:21; Heb_5:12-14; 1Jo_4:1; Rev_2:2", "refs": [{"l": "Job 12:11", "n": "", "vs": [[11, "أليست الأذن تمتحن الكلام كما يتذوق اللسان الطعام؟"]]}, {"l": "Job 34:3", "n": "", "vs": [[3, "لأن الأذن تمحص الأقوال كما يتذوق الحنك الطعام."]]}, {"l": "Rom 12:2", "n": "", "vs": [[2, "ولا تتكيفوا مع هذا العالم، بل تغيروا بتجديد الذهن، لتميزوا ما هي إرادة الله الصالحة المقبولة الكاملة."]]}, {"l": "2Co 11:13-15", "n": "", "vs": [[13, "فإن أمثال هؤلاء هم رسل دجالون، عمال ماكرون، يظهرون أنفسهم بمظهر رسل المسيح."], [14, "ولا عجب! فالشيطان نفسه يظهر نفسه بمظهر ملاك نور."], [15, "فليس كثيرا إذن أن يظهر خدامه أنفسهم بمظهر خدام البر. وإن عاقبتهم ستكون على حسب أعمالهم."]]}, {"l": "Eph 5:10", "n": "", "vs": [[10, "هكذا تختبرون الأمور التي ترضي الرب."]]}, {"l": "1Th 5:21", "n": "", "vs": [[21, "امتحنوا كل شيء وتمسكوا بالحسن."]]}, {"l": "Heb 5:12-14", "n": "", "vs": [[12, "كان يجب أن تكونوا الآن قادرين على تعليم الآخرين، بعدما مضى زمان طويل على اهتدائكم. ولكنكم مازلتم بحاجة إلى من يعلمكم حتى المباديء الأساسية لإعلانات الله. ها قد عدتم من جديد تحتاجون إلى اللبن! فأنتم غير قادرين على هضم الطعام القوي."], [13, "وكل من يتناول اللبن، يكون عديم الخبرة في التعليم القويم، لأنه مازال طفلا غير ناضج."], [14, "أما الناضجون روحيا، فهم قادرون على تناول الطعام القوي: لأن حواسهم قد تدربت، بالممارسة الصحيحة، على التمييز بين الخير والشر."]]}, {"l": "1Jo 4:1", "n": "", "vs": [[1, "أيها الأحباء، لا تصدقوا كل روح، بل امتحنوا الأرواح لتعرفوا ما إذا كانت من عند الله أم لا، لأن عددا كبيرا من الأنبياء الدجالين قد انتشر في العالم."]]}, {"l": "Rev 2:2", "n": "", "vs": [[2, "إني عالم بأعمالك، وجهدك، وصبرك، وأعلم أنك لا تستطيع احتمال الأشرار، وأنك دققت في فحص ادعاءات أولئك الذين يزعمون أنهم رسل، وما هم برسل، فتبين لك أنهم دجالون!"]]}], "kwAr": "تستحسنوا الأمور الممتازة", "noteAr": "أو: تميّزوا الأمور المتخالفة."}, {"kw": "that ye may be", "raw": "Phi_1:16; Gen_20:5; Jos_24:14; Joh_1:47; Act_24:16; 2Co_1:12, 2Co_2:17, 2Co_8:8; Eph_4:15 *marg. Eph_5:27, Eph_6:24; 1Th_3:13, 1Th_5:23", "note": "", "refs": [{"l": "Phi 1:16", "n": "", "vs": [[16, "فهؤلاء تدفعهم المحبة، عالمين أني قد عينت للدفاع عن الإنجيل؛"]]}, {"l": "Gen 20:5", "n": "", "vs": [[5, "ألم يقل لي إنها أختي وهي نفسها ادعت أنه أخوها؟ ما فعلت هذا إلا بسلامة قلبي وطهارة يدي»."]]}, {"l": "Jos 24:14", "n": "", "vs": [[14, "والآن اتقوا الرب واعبدوه بكل أمانة، وانزعوا الأوثان التي عبدها آباؤكم في شرقي نهر الفرات وفي مصر واعبدوا الرب."]]}, {"l": "Joh 1:47", "n": "", "vs": [[47, "ورأى يسوع نثنائيل قادما نحوه فقال عنه: «هذا إسرائيلي أصيل لا شك فيه!»"]]}, {"l": "Act 24:16", "n": "", "vs": [[16, "لذلك أنا أيضا أدرب نفسي لكي أحيا دائما بضمير نقي أمام الله والناس."]]}, {"l": "2Co 1:12", "n": "", "vs": [[12, "فإن فخرنا هو هذا: شهادة ضميرنا بأننا، في قداسة الله وإخلاصه، قد سلكنا في العالم، وبخاصة تجاهكم؛ ولم يكن ذلك بحكمة بشرية بل بنعمة الله."]]}, {"l": "2Co 2:17", "n": "", "vs": [[17, "فإننا لا نتاجر بكلمة الله كما يفعل الكثيرون، وإنما بإخلاص ومن قبل الله، وأمام الله، نتكلم في المسيح."]]}, {"l": "2Co 8:8", "n": "", "vs": [[8, "لا أقول هذا على سبيل الأمر، بل اختبارا لصدق محبتكم بحماسة الآخرين."]]}, {"l": "Eph 4:15", "n": "*marg.", "vs": [[15, "بل نتمسك بالحق في المحبة، فننمو في كل شيء نحو من هو الرأس، أي المسيح."]]}, {"l": "Eph 5:27", "n": "", "vs": [[27, "حتى يزفها إلى نفسه كنيسة بهية لا يشوبها عيب أو تجعد أو أية نقيصة مشابهة بل تكون مقدسة خالية من العيوب."]]}, {"l": "Eph 6:24", "n": "", "vs": [[24, "لتكن النعمة مع جميع الذين يحبون ربنا يسوع المسيح محبة لا يعتريها الفساد!"]]}, {"l": "1Th 3:13", "n": "", "vs": [[13, "حتى تتثبت قلوبكم بغير لوم في القداسة أمام إلهنا وأبينا عندما يظهر ربنا يسوع عائدا مع جميع قديسيه."]]}, {"l": "1Th 5:23", "n": "", "vs": [[23, "وإله السلام نفسه يقدسكم إلى التمام ويحفظكم سالمين، روحا ونفسا وجسدا، لتكونوا بلا لوم عند عودة ربنا يسوع المسيح."]]}], "kwAr": "حتى تكونوا طاهرين", "noteAr": ""}, {"kw": "without", "raw": "Mat_16:23, Mat_18:6, Mat_18:7, Mat_26:33; Rom_14:20,Rom_14:21, Rom_16:17; 1Co_8:13, 1Co_10:32; 2Co_6:3; Gal_5:11; 1Th_3:13", "note": "", "refs": [{"l": "Mat 16:23", "n": "", "vs": [[23, "فالتفت يسوع إلى بطرس وقال له: «اغرب من أمامي ياشيطان! أنت عقبة أمامي، لأنك تفكر لا بأمور الله، بل بأمور الناس! »"]]}, {"l": "Mat 18:6", "n": "", "vs": [[6, "ومن كان عثرة لأحد هؤلاء الصغار المؤمنين بي، فأفضل له لو علق في عنقه حجر الرحى وأغرق في أعماق البحر."]]}, {"l": "Mat 18:7", "n": "", "vs": [[7, "الويل للعالم من العثرات! فلابد أن تأتي العثرات؛ ولكن الويل لمن تأتي العثرات على يده!"]]}, {"l": "Mat 26:33", "n": "", "vs": [[33, "فرد عليه بطرس قائلا: «ولو شك فيك الجميع، فأنا لن أشك!»"]]}, {"l": "Rom 14:20", "n": "", "vs": [[20, "لا تدمر عمل الله بسبب الطعام! حقا إن الأطعمة كلها طاهرة، ولكن الشر في أن يأكل الإنسان شيئا يسبب العثرة."]]}, {"l": "Rom 14:21", "n": "", "vs": [[21, "فمن الصواب ألا تأكل لحما ولا تشرب خمرا، ولا تفعل شيئا يتعثر فيه أخوك."]]}, {"l": "Rom 16:17", "n": "", "vs": [[17, "ولكن، أتوسل إليكم، أيها الإخوة، أن تنتبهوا إلى مثيري الانقسامات والعثرات، خلافا للتعليم الذي تعلمتم، وأن تبتعدوا عنهم."]]}, {"l": "1Co 8:13", "n": "", "vs": [[13, "لذا، إن كان بعض الطعام فخا يسقط فيه أخي، فلن آكل لحما أبدا، لكي لا أسقط أخي!"]]}, {"l": "1Co 10:32", "n": "", "vs": [[32, "لا تضعوا عائقا يسبب السقوط لأحد، سواء من اليهود أم اليونانيين أم كنيسة الله."]]}, {"l": "2Co 6:3", "n": "", "vs": [[3, "ولسنا نتصرف أي تصرف يكون عثرة لأحد، حتى لا يلحق الخدمة أي لوم."]]}, {"l": "Gal 5:11", "n": "", "vs": [[11, "وأما أنا، أيها الإخوة، فلو صح أنني مازلت أدعو إلى الختان، فلماذا مازلت ألقى الاضطهاد؟ إذن لكانت العثرة التي في الصليب قد زالت!"]]}, {"l": "1Th 3:13", "n": "", "vs": [[13, "حتى تتثبت قلوبكم بغير لوم في القداسة أمام إلهنا وأبينا عندما يظهر ربنا يسوع عائدا مع جميع قديسيه."]]}], "kwAr": "وخالين من العثرات", "noteAr": ""}, {"kw": "till", "raw": "1Co_1:8", "note": "", "refs": [{"l": "1Co 1:8", "n": "", "vs": [[8, "وهو نفسه سيحفظكم ثابتين إلى النهاية حتى تكونوا بلا عيب في يوم ربنا يسوع المسيح."]]}], "kwAr": "إلى يوم المسيح", "noteAr": ""}], "arS": [["لكي ", []], ["تستحسنوا", ["G1381"]], [" الأمور ", []], ["الممتازة", ["G1308"]], ["، حتى تكونوا ", []], ["طاهرين", ["G1506"]], [" ", []], ["وخالين من العثرات", ["G677"]], [" إلى ", []], ["يوم", ["G2250"]], [" ", []], ["المسيح", ["G5547"]], ["،", []]]}, {"c": 1, "v": 11, "text": "كاملين في ثمار البر الآتية بيسوع المسيح، لمجد الله وحمده.", "groups": [{"kw": "filled", "raw": "Phi_4:17; Psa_1:3, Psa_92:12-14; Isa_5:2; Luk_13:6-9; Joh_15:2, Joh_15:8, Joh_15:16; Rom_6:22; Rom_15:28; 2Co_9:10; Gal_5:22, Gal_5:23; Eph_5:9; Col_1:6, Col_1:10; Heb_12:11; Jam_3:17, Jam_3:18", "note": "", "refs": [{"l": "Phi 4:17", "n": "", "vs": [[17, "والواقع أني لا أسعى إلى العطايا، بل أسعى إلى الفائدة المتكاثرة لحسابكم."]]}, {"l": "Psa 1:3", "n": "", "vs": [[3, "فيكون كشجرة مغروسة عند مجاري المياه، تعطي ثمرها في حينه، وورقها لا يذبل، وكل ما يصنعه يفلح."]]}, {"l": "Psa 92:12-14", "n": "", "vs": [[12, "الصديق يزهو كالنخلة وينمو كالأرز في لبنان."], [13, "لأن المغروسين في بيت الرب يزدهرون في ديار بيت إلهنا"], [14, "يثمرون أيضا في الشيخوخة، ويظلون موفوري العافية والنضرة"]]}, {"l": "Isa 5:2", "n": "", "vs": [[2, "حرث أرضه ونقاه من الحجارة، وغرس فيه أفضل كرمة، وشيد في وسطه برجا، ونقر في الصخر معصرة. ثم انتظر أن يثمر له عنبا فأنتج له حصرما!"]]}, {"l": "Luk 13:6-9", "n": "", "vs": [[6, "ثم ضرب هذا المثل: «كان عند أحدهم شجرة تين مغروسة في كرمه. فجاءها طلبا للثمر، فما وجد شيئا."], [7, "فقال للمزارع: هذه ثلاث سنين وأنا أقصد هذه التينة طلبا للثمر فلا أجد شيئا: اقطعها، لماذا نتركها تعطل الأرض؟"], [8, "ولكن المزارع أجابه قائلا: ياسيد اتركها هذه السنة أيضا، حتى أنقب التربة من حولها وأضع سمادا."], [9, "فلعلها تنتج ثمرا! وإلا، فبعد ذلك تقطعها!»"]]}, {"l": "Joh 15:2", "n": "", "vs": [[2, "كل غصن في لا ينتج ثمرا يقطعه؛ وكل غصن ينتج ثمرا ينقيه لينتج مزيدا من الثمر."]]}, {"l": "Joh 15:8", "n": "", "vs": [[8, "بهذا يتمجد أبي: أن تنتجوا ثمرا كثيرا فتكونون حقا تلاميذي."]]}, {"l": "Joh 15:16", "n": "", "vs": [[16, "ليس أنتم اخترتموني، بل أنا اخترتكم وعينتكم لتنطلقوا وتنتجوا ثمرا ويدوم ثمركم، فيعطيكم الآب كل ما تطلبونه باسمي."]]}, {"l": "Rom 6:22", "n": "", "vs": [[22, "أما الآن، وقد حررتم من الخطيئة وصرتم عبيدا لله، فإن لكم ثمركم للقداسة، والعاقبة هي الحياة الأبدية."]]}, {"l": "Rom 15:28", "n": "", "vs": [[28, "فبعد انتهائي من هذه المهمة، وتسليمي هذا الثمر للقديسين،"]]}, {"l": "2Co 9:10", "n": "", "vs": [[10, "والذي يقدم بذارا للزارع، وخبزا للأكل، سيقدم لكم بذاركم ويكثره ويزيد أثمار بركم:"]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Gal 5:23", "n": "", "vs": [[23, "والوداعة وضبط النفس. وليس من قانون يمنع مثل هذه الفضائل."]]}, {"l": "Eph 5:9", "n": "", "vs": [[9, "فإن ثمر النور يكون في كل صلاح واستقامة وحق."]]}, {"l": "Col 1:6", "n": "", "vs": [[6, "والتي وصلت إليكم كما تنتشر الآن في العالم أجمع، منتجة الثمر ونامية، مثلما يحدث بينكم أنتم منذ أن سمعتم بنعمة الله واختبرتموها بالحق،"]]}, {"l": "Col 1:10", "n": "", "vs": [[10, "لكي تسلكوا سلوكا لائقا بالرب ومرضيا في كل شيء، منتجين الثمر في كل عمل صالح ونامين في معرفة الله إلى التمام،"]]}, {"l": "Heb 12:11", "n": "", "vs": [[11, "وطبعا، كل تأديب لا يبدو في الحال باعثا على الفرح، بل على الحزن. ولكنه فيما بعد، ينتج بسلام في الذين يتلقونه ثمر البر."]]}, {"l": "Jam 3:17", "n": "", "vs": [[17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}, {"l": "Jam 3:18", "n": "", "vs": [[18, "والبر هو ثمر ة ما يزرعه في سلام صانعو السلام."]]}], "kwAr": "كاملين في ثمار البر", "noteAr": ""}, {"kw": "are", "raw": "Psa_92:14, Psa_92:15; Isa_60:21, Isa_61:3, Isa_61:11; Mat_5:16; Joh_15:4, Joh_15:5; 1Co_10:31; Eph_2:10; Col_1:6; 2Th_1:12; Heb_13:15, Heb_13:16; 1Pe_2:5, 1Pe_2:9, 1Pe_2:12, 1Pe_4:10,1Pe_4:11, 1Pe_4:14", "note": "", "refs": [{"l": "Psa 92:14", "n": "", "vs": [[14, "يثمرون أيضا في الشيخوخة، ويظلون موفوري العافية والنضرة"]]}, {"l": "Psa 92:15", "n": "", "vs": [[15, "ليشهدوا أن الرب مستقيم. إنه صخرتي وليس فيه سوء."]]}, {"l": "Isa 60:21", "n": "", "vs": [[21, "ويكون شعبك جميعا أبرارا ويرثون الأرض إلى الأبد، فهم غصن غرسي وعمل يدي لأتمجد."]]}, {"l": "Isa 61:3", "n": "", "vs": [[3, "لأمنح نائحي صهيون تاج جمال بدل الرماد، ودهن السرور بدل النوح، ورداء تسبيح بدل الروح اليائسة، فيدعون أشجار البر وغرس الرب لكي يتمجد."]]}, {"l": "Isa 61:11", "n": "", "vs": [[11, "لأنه كما تنبت الأرض مزروعاتها، والحديقة تخرج نباتاتها التي زرعت فيها، هكذا السيد الرب يجعل البر والتسبيح ينبتان أمام جميع الأمم."]]}, {"l": "Mat 5:16", "n": "", "vs": [[16, "هكذا، فليضيء نوركم أمام الناس، ليروا أعمالكم الحسنة ويمجدوا أباكم الذي في السماوات."]]}, {"l": "Joh 15:4", "n": "", "vs": [[4, "فاثبتوا في وأنا فيكم. كما أن الغصن لا يقدر أن ينتج ثمرا إلا إذا ثبت في الكرمة؛ فكذلك أنتم، إلا إذا ثبتم في."]]}, {"l": "Joh 15:5", "n": "", "vs": [[5, "أنا الكرمة وأنتم الأغصان. من يثبت في وأنا فيه، فذاك ينتج ثمرا كثيرا. فإنكم بمعزل عني لا تقدرون أن تفعلوا شيئا."]]}, {"l": "1Co 10:31", "n": "", "vs": [[31, "فإذا أكلتم أو شربتم أو مهما فعلتم، فافعلوا كل شيء لتمجيد الله."]]}, {"l": "Eph 2:10", "n": "", "vs": [[10, "فإننا نحن تحفة الله، وقد خلقنا في المسيح يسوع لأعمال صالحة أعدها سلفا لنسلك فيها."]]}, {"l": "Col 1:6", "n": "", "vs": [[6, "والتي وصلت إليكم كما تنتشر الآن في العالم أجمع، منتجة الثمر ونامية، مثلما يحدث بينكم أنتم منذ أن سمعتم بنعمة الله واختبرتموها بالحق،"]]}, {"l": "2Th 1:12", "n": "", "vs": [[12, "حتى يتمجد اسم ربنا يسوع فيكم وتتمجدوا أنتم فيه وفقا لنعمة إلهنا وربنا يسوع المسيح."]]}, {"l": "Heb 13:15", "n": "", "vs": [[15, "فبالمسيح، رئيس كهنتنا، لنقرب لله دائما ذبيحة الحمد والتسبيح، أي الثمار التي تنتجها أفواهنا المعترفة باسمه."]]}, {"l": "Heb 13:16", "n": "", "vs": [[16, "ولا تغفلوا أيضا عن عمل الخير وإعانة المحتاجين: لأن مثل هذه «الذبائح» تسر الله جدا!"]]}, {"l": "1Pe 2:5", "n": "", "vs": [[5, "إذن اتحدوا به كحجارة حية، مبنيين بيتا روحيا، تكونون فيه كهنة مقدسين تقدمون لله ذبائح روحية مقبولة لديه بفضل يسوع المسيح."]]}, {"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}, {"l": "1Pe 2:12", "n": "", "vs": [[12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالحة يمجدون الله في يوم الافتقاد."]]}, {"l": "1Pe 4:10", "n": "", "vs": [[10, "وعلى كل واحد منكم أن يخدم الآخرين بالموهبة التي أعطاه الله إياها، باعتباركم وكلاء صالحين مؤتمنين على أنواع متعددة من المواهب التي يمنحها الله بالنعمة."]]}, {"l": "1Pe 4:11", "n": "", "vs": [[11, "فمن يتكلم، عليه أن يتكلم بما يوافق أقوال الله؛ ومن يخدم، عليه أن يخدم بموجب القوة التي يمنحها الله . وذلك لكي يتمجد الله في كل شيء، بيسوع المسيح، له المجد والسلطة إلى أبد الآبدين. آمين!"]]}, {"l": "1Pe 4:14", "n": "", "vs": [[14, "فإذا لحقتكم الإهانة لأنكم تحملون اسم المسيح، فطوبى لكم! لأن روح المجد، أي روح الله، يستقر عليكم."]]}], "kwAr": "الآتية بيسوع المسيح", "noteAr": ""}, {"kw": "unto", "raw": "Joh_15:8; Eph_1:12, Eph_1:14", "note": "", "refs": [{"l": "Joh 15:8", "n": "", "vs": [[8, "بهذا يتمجد أبي: أن تنتجوا ثمرا كثيرا فتكونون حقا تلاميذي."]]}, {"l": "Eph 1:12", "n": "", "vs": [[12, "والغاية أن نكون سببا لمدح مجده بعدما سبق لنا أن وضعنا رجاءنا في المسيح."]]}, {"l": "Eph 1:14", "n": "", "vs": [[14, "هذا الروح الذي هو عربون ميراثنا إلى أن يتم فداء ما قد اقتني: بغر ض مدح مجده."]]}], "kwAr": "لمجد الله وحمده", "noteAr": ""}], "arS": [["كاملين", ["G4137"]], [" في ", []], ["ثمار", ["G2590"]], [" ", []], ["البر", ["G1343"]], [" الآتية ", []], ["بيسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], ["، ", []], ["لمجد", ["G1391"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["وحمده", ["G1868"]], [".", []]]}, {"c": 1, "v": 12, "text": "على أني أريد أن تعلموا، أيها الإخوة، أن أحوالي قد أدت في الواقع إلى انتشار الإنجيل بنجاح،", "groups": [{"kw": "that", "raw": "Act_21:28-36, 22:1-30, 28:1-31", "note": "", "refs": [{"l": "Act 21:28-36", "n": "", "vs": [[28, "وهم يصرخون: «النجدة يابني إسرائيل! هذا هو الرجل الذي يدعو الناس في كل مكان إلى عقيدة تشكل خطرا على شعبنا وشريعتنا وعلى هذا المكان، حتى إنه أدخل اليونانيين إلى الهيكل ودنس هذا المكان المقدس!»"], [29, "فإنهم كانوا قد رأوا تروفيمس الأفسسي مع بولس في المدينة، فظنوا أنه أدخله معه إلى الهيكل."], [30, "عندئذ هاج أهل المدينة جميعا، وهجم الناس على بولس وجروه إلى خارج الهيكل، ثم أغلقت الأبواب حالا."], [31, "وبينما هم يحاولون أن يقتلوه سمع قائد الكتيبة الرومانية أن الاضطراب عم أورشليم كلها."], [32, "فأخذ في الحال جماعة من الجنود وقواد المئات وحضر مسرعا. ولما رأى اليهود القائد وجنوده كفوا عن ضرب بولس."], [33, "فاقترب القائد وألقى القبض عليه، وأمر جنوده أن يقيدوه بسلسلتين، وأخذ يسأل: «من هو، وماذا فعل؟»"], [34, "فأخذ بعضهم ينادون بشيء وبعضهم بشيء آخر. ولما لم يقدر أن يتبين حقيقة الأمر بسبب الهياج، أمر أن يؤخذ بولس إلى الثكنة."], [35, "ولما وصل به الجنود إلى الدرج اضطروا أن يحملوه ليخلصوه من عنف المحتشدين."], [36, "فقد كان جمهور المحتشدين يتبعونه صارخين: «ليعدم!»"]]}, {"l": "Act 22:1-30", "n": "", "vs": [[1, "»أيها الإخوة والآباء، اسمعوا الآن دفاعي عن نفسي»."], [2, "فلما سمعوه يخاطبهم باللغة العبرية ازدادوا هدوءا فقال:"], [3, "»أنا رجل يهودي، ولدت في طرسوس الواقعة في مقاطعة كيليكية، ولكني نشأت في هذه المدينة وتعلمت عند قدمي غمالائيل التربية الموافقة تماما لشريعة آبائنا. وكنت غيورا في أمور الله، مثلكم جميعا اليوم."], [4, "فاضطهدت هذا الطريق حتى الموت، فكنت أعتقل أتباعه من الرجال والنساء، وأزج بهم في السجون."], [5, "ويشهد رئيس الكهنة ومجلس الشيوخ على صدق كلامي هذا. فقد أخذت منهم رسائل إلى إخوانهم في دمشق ليعاونوني في القبض على الذين هناك، لأسوقهم إلى أورشليم فينالوا عقابهم."], [6, "ولما وصلت إلى مقربة من دمشق، وكان الوقت نحو الظهر، أضاء حولي فجأة نور باهر،"], [7, "فوقعت على الأرض، وسمعت صوتا يقول لي: شاول، شاول، لماذا تضطهدني؟"], [8, "فأجبت: من أنت ياسيد؟ فقال: أنا يسوع الناصري الذي أنت تضطهده."], [9, "وقد رأى مرافقي النور، ولكنهم لم يسمعوا صوت مخاطبي."], [10, "فسألت: ماذا أفعل يارب؟ فأجابني الرب: قم وادخل دمشق، وهناك يقال لك ما يجب عليك أن تفعله."], [11, "واقتادني مرافقي بيدي حتى أوصلوني إلى دمشق، لأني لم أكن أبصر بسبب شدة ذلك النور الباهر."], [12, "وكان في دمشق رجل اسمه حنانيا، تقي كما تقضي الشريعة، يشهد له يهود دمشق جميعا شهادة حسنة."], [13, "جاء إلي ووقف وقال: أيها الأخ شاول، أبصر. فعاد إلي بصري حالا، ورأيته أمامي،"], [14, "فقال: إله آبائنا اختارك مسبقا لتعرف إرادته، وترى البار وتسمع صوتا من فمه."], [15, "فإنك ستكون شاهدا له، أمام جميع الناس، بما رأيت وسمعت."], [16, "والآن لماذا تبطيء؟ قم تعمد واغتسل من خطايا ك، داعيا باسم الرب."], [17, "بعد ذلك رجعت إلى أورشليم. وبينما كنت أصلي في الهيكل غبت عن الوعي،"], [18, "فرأيت الرب يقول لي: عجل واترك أورشليم بسرعة، لأن أهلها يرفضون أن تشهد لي فيها."], [19, "فقلت: يارب، إنهم يعرفون أني كنت أبحث في المجامع عن المؤمنين بك، لأسجنهم وأجلدهم."], [20, "وكنت حاضرا عندما قتل شهيدك استفانوس، وكنت راضيا بقتله، وحارسا لثياب قاتليه."], [21, "ولكنه قال لي: اذهب ... سأرسلك بعيدا: إلى الأمم!»"], [22, "ظل المجتمعون يصغون حتى وصل بولس إلى ذكر الأمم، فصرخوا بقائد الكتيبة: «انزع هذا الرجل من الأرض! إنه لا يستحق الحياة!»"], [23, "ثم أخذوا يصيحون ويلوحون بثيابهم، ويذرون الغبار في الهواء."], [24, "فأمر القائد جنوده أن يدخلوا بولس إلى الثكنة وأن يستجوبوه تحت جلد السياط ليعرف سبب الهتافات الصاخبة ضده."], [25, "فلما ربطه الجنود ليجلدوه قال لقائد المئة الذي كان واقفا بقربه: «أيسمح لكم القانون بجلد مواطن روماني قبل محاكمته؟»"], [26, "فما إن سمع الضابط ذلك حتى ذهب إلى القائد وأخبره بالأمر، وقال: «أتعلم أية مخالفة كنا سنرتكب لو جلدنا هذا الرجل؟ إنه روماني الجنسية !»"], [27, "فذهب القائد بنفسه إلى بولس وسأله: «أأنت حقا روماني؟» فأجاب: «نعم!»"], [28, "فقال القائد: «أنا دفعت مبلغا كبيرا من المال لأحصل على الجنسية الرومانية». فقال بولس: «وأنا حاصل عليها بالولادة!»"], [29, "وفي الحال ابتعد عنه الجنود المكلفون باستجوابه تحت جلد السياط، ووقع الخوف في نفس القائد من عاقبة تقييده بالسلاسل، بعدما تحقق أنه روماني."], [30, "وفي اليوم التالي أراد القائد أن ينظر في حقيقة التهمة التي وجهها اليهود إلى بولس، ففك قيوده، وأمر بإحضار رؤساء الكهنة وأعضاء المجلس اليهودي جميعا، واستدعى بولس وأوقفه أمامهم."]]}, {"l": "Act 28:1-31", "n": "", "vs": [[1, "وعرفنا بعدما نجونا أن الشاطيء الذي وصلناه هو جزيرة مالطة."], [2, "واستقبلنا أهلها الغرباء بعطف كبير قل نظيره. فإذ كان المطر ينهمر والجو باردا، أوقدوا لنا نارا، ورحبوا بنا."], [3, "وجمع بولس بعض الحطب وألقاه في النار، فخرجت أفعى، دفعتها الحرارة، وتعلقت بيده."], [4, "ورأى أهل مالطة الأفعى عالقة بيده، فقال بعضهم لبعض: «لابد أن هذا الرجل قاتل، فإن العدل لم يدعه يحيا بعدما نجا من البحر»."], [5, "ولكن بولس نفض الأفعى في النار دون أن يمسه أذى."], [6, "وانتظروا أن يتورم جسمه أو يقع ميتا فجأة. وطال انتظارهم، دون أن يصيبه ضرر، فغيروا رأيهم فيه وقالوا: «إنه إله!»"], [7, "وكانت بالقرب من المكان مزارع لحاكم الجزيرة بوبليوس، فدعانا وأحسن ضيافتنا ثلاثة أيام."], [8, "وكان والد بوبليوس طريح الفراش مريضا بالحمى والإسهال الشديد. فزاره بولس وصلى، ووضع يديه عليه، فشفاه."], [9, "فجاء عندئذ مرضى الجزيرة إليه ونالوا الشفاء،"], [10, "فأعطونا هدايا كثيرة، وزودونا عند رحيلنا بما نحتاج إليه في سفرنا."], [11, "وبعد ثلاثة أشهر أقلعنا على سفينة من الإسكندرية، تحمل صورة الجوزاء (أي التوأمين)، كانت قد قضت فصل الشتاء في مالطة."], [12, "فلما وصلنا إلى مدينة سراكوسا قضينا فيها ثلاثة أيام،"], [13, "ثم أبحرنا وسرنا على مقربة من الشاطيء حتى وصلنا مدينة ريغيون. وفي اليوم التالي هبت ريح جنوبية، فوصلنا إلى مدينة بوطيولي في يومين."], [14, "ووجدنا هناك بعض الإخوة، فطلبوا إلينا أن نقضي معهم سبعة أيام. وهكذا وصلنا إلى روما."], [15, "ولما سمع الإخوة فيها بوصولنا، خرجوا لاستقبالنا في ساحة أبيوس وفي الخانات الثلاثة. فلما رآهم بولس شكر الله وتشجع."], [16, "ولما دخلنا روما سمح الضابط لبولس أن يقيم في منزل خاص مع الجندي الذي يحرسه."], [17, "وبعد ثلاثة أيام دعا بولس وجهاء اليهود، وقال لهم: «أيها الإخوة، مع أني لم أفعل ما يسيء إلى الشعب، ولا إلى طقوس آبائنا، فقد سجنت في أورشليم وسلمت إلى الرومان،"], [18, "فاستجوبوني وأرادوا إطلاقي، لأنه لم يكن هناك ما يستوجب إعدامي."], [19, "غير أن اليهود اعترضوا، فاضطررت إلى استئناف دعواي إلى القيصر. وهذا لا يعني أنني أشكو بني وطني بشيء."], [20, "لذلك طلبت أن أراكم وأكلمكم؛ فأنا موثق بهذه السلسلة من أجل رجاء إسرائيل»."], [21, "فقالوا: «لم نتلق بشأنك أية رسالة من بلاد اليهودية، ولا جاء رسول من عند إخواننا يخبرنا عنك بشيء، أو يشتكي عليك."], [22, "ولكننا نرى من المناسب أن نسمع رأيك، لأننا نعلم أن الناس في كل مكان يعارضون هذا المذهب!»"], [23, "فحددوا موعدا للقاء قادم، جاءوا فيه مع كثيرين إلى منزل بولس. فشهد لهم من الصباح إلى المساء شارحا لهم أمور ملكوت الله ومحاولا إقناعهم بالأمور المختصة بيسوع استنادا إلى شريعة موسى وكتب الأنبياء."], [24, "فمنهم من اقتنع بكلامه، ومنهم من لم يؤمن."], [25, "فاختلفوا فيما بينهم، وانصرفوا بعدما قال لهم: «صدق الروح القدس إذ قال لآبائكم بلسان النبي إشعياء:"], [26, "اذهب إلى هذا الشعب وقل له: سمعا ستسمعون، ولكنكم لا تفهمون! ونظرا ستنظرون، ولكنكم لا تبصرون!"], [27, "لأن قلب هذا الشعب قد صار غليظا، وآذانهم قد صارت ثقيلة السمع، وقد أغمضوا عيونهم. لئلا يبصروا بعيونهم، ويسمعوا بآذانهم، ويفهموا بقلوبهم، ويرجعوا إلي فأشفيهم!»"], [28, "وختم بولس كلامه بقوله: «اعلموا إذن أن الله قد أرسل خلاصه هذا إلى الأمم الأخرى، وهم سيستمعون إليه!»"], [29, "فلما قال هذا الكلام، خرج اليهود من عنده وهم يتجادلون بعنف."], [30, "وأقام بولس سنتين كاملتين في المنزل الذي استأجره، وكان يرحب بجميع الذين يأتون لزيارته،"], [31, "مبشرا بملكوت الله، ومعلما الأمور المختصة بالرب يسوع المسيح بكل جرأة وبلا عائق."]]}], "kwAr": "أن أحوالي", "noteAr": ""}, {"kw": "rather", "raw": "Exo_18:11; Est_9:1; Psa_76:10; Act_8:4, Act_11:19-21; Rom_8:28, Rom_8:37; 2Ti_2:9", "note": "", "refs": [{"l": "Exo 18:11", "n": "", "vs": [[11, "الآن أعلم أن الرب هو أعظم من جميع الآلهة، لأنه عاملهم بمثل ما بغوا به»."]]}, {"l": "Est 9:1", "n": "", "vs": [[1, "وفي اليوم الثالث عشر من الشهر الثاني عشر، (أذار ; مارس)، حين آن أوان تنفيذ أمر الملك وحكمه، وهو اليوم الذي كان فيه أعداء اليهود يرجون التسلط عليهم، انقلب الموقف ضدهم، فتسلط اليهود على أعدائهم."]]}, {"l": "Psa 76:10", "n": "", "vs": [[10, "حقا يحمدك غضب الإنسان، وما تبقى من الغضب تتمنطق أنت به."]]}, {"l": "Act 8:4", "n": "", "vs": [[4, "والذين تشتتوا كانوا ينتقلون من مكان إلى مكان مبشرين بالكلمة."]]}, {"l": "Act 11:19-21", "n": "", "vs": [[19, "أما المؤمنون الذين تشتتوا بسبب الاضطهاد الذي وقع عليهم بعد موت استفانوس، فمروا بفينيقية وقبرص وأنطاكية، وهم لا يبشرون بالكلمة إلا اليهود."], [20, "غير أن بعضا منهم، وهم أصلا من قبرص والقيروان، وصلوا أنطاكية، وأخذوا يبشرون اليونانيين أيضا بالرب يسوع."], [21, "فكانت يد الرب معهم، فآمن عدد كبير واهتدوا إلى الرب."]]}, {"l": "Rom 8:28", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."]]}, {"l": "Rom 8:37", "n": "", "vs": [[37, "ولكننا، في جميع هذه الأمور، نحرز ما يفوق الانتصار على يد من أحبنا."]]}, {"l": "2Ti 2:9", "n": "", "vs": [[9, "الذي لأجل التبشير به أقاسي حتى القيود كأني فاعل شر. إلا أن كلمة الله لا تكبلها القيود."]]}], "kwAr": "قد أدت في الواقع", "noteAr": ""}], "arS": [["على أني ", []], ["أريد", ["G1014"]], [" أن ", []], ["تعلموا", ["G1097"]], ["، أيها ", []], ["الإخوة", ["G80"]], ["، أن أحوالي قد ", []], ["أدت", ["G2064"]], [" في ", []], ["الواقع", ["G3123"]], [" إلى ", []], ["انتشار", ["G4297"]], [" ", []], ["الإنجيل", ["G2098"]], [" بنجاح،", []]]}, {"c": 1, "v": 13, "text": "حتى إنه قد صار معروفا لدى الحرس الإمبراطوري كله ولدى الباقين جميعا أن قيودي إنما هي لأجل المسيح؛", "groups": [{"kw": "", "raw": "Act_20:23, Act_20:24, Act_21:11-13, Act_26:29, Act_26:31, Act_28:17, Act_28:20; Eph_3:1, Eph_4:1, Eph_6:20; Col. 4:3-18", "note": "", "refs": [{"l": "Act 20:23", "n": "", "vs": [[23, "إلا أن الروح القدس كان يعلن لي في كل مدينة أذهب إليها أن السجن والمصاعب تنتظرني"]]}, {"l": "Act 20:24", "n": "", "vs": [[24, "ولكني لا أحسب لحياتي أية قيمة، ما دمت أسعى إلى بلوغ غايتي وإتمام الخدمة التي كلفني إياها الرب يسوع: أن أشهد ببشارة نعمة الله."]]}, {"l": "Act 21:11-13", "n": "", "vs": [[11, "فأخذ حزام بولس، وقيد نفسه رابطا يديه ورجليه وقال: «يقول الروح القدس إن صاحب هذا الحزام سيقيده اليهود هكذا في أورشليم، ويسلمونه إلى أيدي الأجانب»."], [12, "فلما سمعنا هذا بدأنا جميعا، نحن مرافقي بولس والمؤمنين من أهل البلدة، نرجو من بولس ألا يذهب إلى أورشليم،"], [13, "ولكنه قال لنا: «ما لكم تبكون وتحطمون قلبي؟ إني مستعد ليس فقط لأن أقيد في أورشليم، بل أيضا لأن أموت من أجل اسم الرب يسوع!»"]]}, {"l": "Act 26:29", "n": "", "vs": [[29, "فقال بولس: «سواء كان قليلا أم كثيرا، فإن صلاتي إلى الله لأجلك ولأجل الحاضرين هنا جميعا أن تصيروا مثلي، ولكن دون هذه السلاسل!»"]]}, {"l": "Act 26:31", "n": "", "vs": [[31, "وتركوا القاعة، وهم يقولون بعضهم لبعض: «لم يرتكب هذا الرجل ما يستحق الموت أو السجن»."]]}, {"l": "Act 28:17", "n": "", "vs": [[17, "وبعد ثلاثة أيام دعا بولس وجهاء اليهود، وقال لهم: «أيها الإخوة، مع أني لم أفعل ما يسيء إلى الشعب، ولا إلى طقوس آبائنا، فقد سجنت في أورشليم وسلمت إلى الرومان،"]]}, {"l": "Act 28:20", "n": "", "vs": [[20, "لذلك طلبت أن أراكم وأكلمكم؛ فأنا موثق بهذه السلسلة من أجل رجاء إسرائيل»."]]}, {"l": "Eph 3:1", "n": "", "vs": [[1, "لهذا السبب، أنا بولس سجين المسيح يسوع لأجلكم أنتم الأمم …"]]}, {"l": "Eph 4:1", "n": "", "vs": [[1, "... إذن، أنا السجين في الرب، أناشدكم أن تسلكوا سلوكا يليق بالدعوة التي إليها دعيتم،"]]}, {"l": "Eph 6:20", "n": "", "vs": [[20, "الذي أنا سفيره المقيد بالسلاسل، فأكون جريئا في إعلانه كما يجب أن أتكلم به."]]}, {"l": "Col 4:3-18", "n": "", "vs": [[3, "مصلين معا لأجلنا أيضا، كي يفتح لنا الله بابا للكلمة، فنتكلم بسر المسيح الذي من أجله أنا مقيد أيضا،"], [4, "حتى أعلنه كما يجب أن أتكلم به."], [5, "تصرفوا بحكمة مع الذين هم من خارج الكنيسة، مستغلين الوقت أحسن استغلال."], [6, "ليكن كلامكم دائما مصحوبا بالنعمة، وليكن مصلحا بملح، فتعرفوا كيف يجب أن تجيبوا كل واحد."], [7, "أما أحوالي كلها، فسيخبركم بها تيخيكس، الأخ الحبيب والخادم الأمين ورفيقنا العبد في الرب،"], [8, "فإياه قد أرسلت إليكم لهذا الغرض عينه، لتعرفوا أحوالنا ويشجع قلوبكم،"], [9, "يرافقه أونسيموس، الأخ الأمين الحبيب الذي هو من عندكم. فهما يطلعانكم على أحوالنا هنا."], [10, "يسلم عليكم أرسترخس رفيقي في السجن؛ ومرقس ابن أخت برنابا، وفي شأنه تلقيتم بعض التوصيات: فإن جاء إليكم، فرحبوا به؛"], [11, "ويسوع المعروف باسم يسطس. هؤلاء جميعا من أهل الختان، وهم وحدهم معاوني لأجل ملكوت الله، وقد كانوا لي عزاء."], [12, "يسلم عليكم أبفراس الذي هو منكم، وهو عبد للمسيح يسوع، يجاهد كل حين لأجلكم في الصلوات لتثبتوا كاملين ولكم تمام اليقين من جهة مشيئة الله كلها."], [13, "فإني أشهد له بأنه يجتهد كثيرا لأجلكم ولأجل الذين في مدينة لاودكية والذين في مدينة هيرابوليس."], [14, "يسلم عليكم لوقا الطبيب الحبيب؛ وديماس."], [15, "سلموا على الإخوة الذين في لاودكية، وعلى نمفاس، وعلى الكنيسة التي في بيته."], [16, "وبعد أن تقرأ هذه الرسالة عليكم، ابعثوا بها لتقرأ على كنيسة مؤمني لاودكية، وخذوا الرسالة التي عندهم لتقرأوها أنتم أيضا."], [17, "وقولوا لأرخبس: «تنبه للخدمة التي تلقيتها في الرب، وقم بها كاملة!»"], [18, "هذا السلام بخط يدي، أنا بولس. تذكروا قيودي. لتكن النعمة معكم."]]}], "kwAr": "", "noteAr": ""}, {"kw": "in Christ", "raw": "or, for Christ, 1Pe_4:12-16", "note": "or, for Christ, 1Pe_4:12-16", "refs": [{"l": "1Pe 4:12-16", "n": "", "vs": [[12, "أيها الأحباء، لا تستغربوا نار الاضطهاد المشتعلة عندكم لاختباركم وكأن أمرا غريبا قد أصابكم!"], [13, "وإنما افرحوا: لأنكم كما تشاركون المسيح في الآلام الآن، لابد أن تفرحوا بمشاركته في الابتهاج عند ظهور مجده."], [14, "فإذا لحقتكم الإهانة لأنكم تحملون اسم المسيح، فطوبى لكم! لأن روح المجد، أي روح الله، يستقر عليكم."], [15, "لا يكن بينكم من يتأ لم عقابا على شر ارتكبه: كالقتل أو السرقة، أو غيرهما من الجرائم، أو التدخل في شؤون الآخرين."], [16, "ولكن إن تألم أحدكم لأنه «مسيحي»، فعليه ألا يخجل، بل أن يمجد الله لأجل هذا الاسم!"]]}], "kwAr": "لأجل المسيح", "noteAr": "أو: لأجل المسيح."}, {"kw": "the palace", "raw": "or, Caesars court, Phi_4:22", "note": "or, Caesars court, Phi_4:22", "refs": [{"l": "Phi 4:22", "n": "", "vs": [[22, "الإخوة الذين معي يسلمون عليكم. ويسلم عليكم جميع القديسين، ولاسيما الذين هم من حاشية القيصر."]]}], "kwAr": "الحرس الإمبراطوري", "noteAr": "أو: بلاط القيصر."}, {"kw": "in all other places", "raw": "or, to all others, 1Th_1:8, 1Th_1:9", "note": "or, to all others, 1Th_1:8, 1Th_1:9", "refs": [{"l": "1Th 1:8", "n": "", "vs": [[8, "فمن عندكم دوت كلمة الرب، منتشرة لا في مقدونية وأخائية فقط، بل إن إيمانكم بالله ذاع في كل مكان، حتى ليس لنا حاجة لأن نقول شيئا بعد."]]}, {"l": "1Th 1:9", "n": "", "vs": [[9, "فإن أولئك المؤمنين أنفسهم يخبرون عنا كيف كان قدومنا إليكم أول مرة، وكيف تحولتم إلى الله عن الأصنام، لتصيروا عبيدا يخدمون الله الحي الحق،"]]}], "kwAr": "ولدى الباقين جميعا", "noteAr": "أو: لدى جميع الآخرين."}], "arS": [["حتى إنه قد صار ", []], ["معروفا", ["G5318"]], [" لدى ", []], ["الحرس الإمبراطوري", ["G4232"]], [" ", []], ["كله", ["G3650"]], [" ولدى ", []], ["الباقين", ["G3062"]], [" ", []], ["جميعا", ["G3956"]], [" أن ", []], ["قيودي", ["G1199", "G3450"]], [" إنما هي لأجل ", []], ["المسيح", ["G5547"]], ["؛", []]]}, {"c": 1, "v": 14, "text": "كما أن أكثر الإخوة، وقد صاروا واثقين بالرب بسبب قيودي، يجرؤون على التبشير بكلمة الله دون خوف.", "groups": [{"kw": "brethren", "raw": "Phi_4:1; Col_4:7", "note": "", "refs": [{"l": "Phi 4:1", "n": "", "vs": [[1, "إذن، ياإخوتي الأحباء والمشتاق إليهم، يافرحي وإكليلي، هكذا اثبتوا في الرب أيها الأحباء."]]}, {"l": "Col 4:7", "n": "", "vs": [[7, "أما أحوالي كلها، فسيخبركم بها تيخيكس، الأخ الحبيب والخادم الأمين ورفيقنا العبد في الرب،"]]}], "kwAr": "أكثر الإخوة", "noteAr": ""}, {"kw": "waxing", "raw": "Act_4:23-31; 2Co_1:3-7; Eph_3:13, Eph_6:19, Eph_6:20; Col_4:4; 1Th_2:2", "note": "", "refs": [{"l": "Act 4:23-31", "n": "", "vs": [[23, "وما إن أطلق بطرس ويوحنا حتى رجعا إلى رفاقهما، وأخبراهم بكل ما قاله لهما رؤساء الكهنة والشيوخ،"], [24, "فتوجهوا بقلب واحد إلى الله بالدعاء، قائلين: «يارب، ياخالق السماء والأرض والبحر وكل ما فيها،"], [25, "يامن قلت بالروح القدس على لسان عبدك داود: لماذا ضجت الأمم؟ ولماذا تآمرت الشعوب باطلا؟"], [26, "اجتمع ملوك الأرض ورؤساؤها، وتحالفوا ليقاوموا الرب ومسيحه!"], [27, "وقد تحققت هذه الكلمات فعلا، إذ تحالف هيرودس، وبيلاطس البنطي، والوثنيون وأسباط إسرائيل، لمقاومة فتاك القدوس يسوع، الذي جعلته مسيحا،"], [28, "وعملوا به كل ما سبق أن رسمت يدك وقضت مشيئتك أن يكون."], [29, "والآن انظر، يارب، إلى تهديدهم، وهبنا نحن عبيدك أن نعلن كلامك بكل جرأة،"], [30, "ومد يدك للشفاء، كي تجرى معجزات وعجائب باسم فتاك القدوس يسوع»."], [31, "وفيما هم يصلون ارتج المكان الذي كانوا مجتمعين فيه، وامتلأوا جميعا بالروح القدس، فأخذوا يعلنون كلمة الله بكل جرأة!"]]}, {"l": "2Co 1:3-7", "n": "", "vs": [[3, "تبارك الله ، أبو ربنا يسوع المسيح، أبو المراحم وإله كل تعزية،"], [4, "هو الذي يشجعنا في كل ضيقة نمر بها، حتى نستطيع أن نشجع الذين يمرون بأية ضيقة، بالتشجيع الذي به يشجعنا الله ."], [5, "فكما فاضت علينا آلام المسيح، يفيض علينا أيضا التشجيع بالمسيح."], [6, "فإن كنا في ضيقة، فذلك لأجل تشجيعكم وخلاصكم؛ وإن كنا متشجعين، فذلك لأجل تشجيعكم، مما يعمل فيكم على احتمال نفس الآلام التي نتألم بها نحن أيضا."], [7, "وإن رجاءنا من أجلكم هو رجاء وطيد، إذ نعلم أنكم كما تشتركون معنا في احتمال الآلام، ستشتركون أيضا في نوال التشجيع."]]}, {"l": "Eph 3:13", "n": "", "vs": [[13, "فلذلك أطلب إليكم ألا يفتر عزمكم بسبب الضيقات التي أقاسيها لأجلكم، فهي مفخرة لكم."]]}, {"l": "Eph 6:19", "n": "", "vs": [[19, "ولأجلي كي ألهم ما أنطق به كلما فتحت فمي لأعلن بجرأة سر الإنجيل"]]}, {"l": "Eph 6:20", "n": "", "vs": [[20, "الذي أنا سفيره المقيد بالسلاسل، فأكون جريئا في إعلانه كما يجب أن أتكلم به."]]}, {"l": "Col 4:4", "n": "", "vs": [[4, "حتى أعلنه كما يجب أن أتكلم به."]]}, {"l": "1Th 2:2", "n": "", "vs": [[2, "فمع أننا كنا قد قاسينا الألم والإهانة في مدينة فيلبي، كما تعلمون، فقد تجرأنا في إلهنا أن نكلمكم بإنجيل الله مجاهدين في وجه المعارضة الشديدة."]]}], "kwAr": "وقد صاروا واثقين", "noteAr": ""}, {"kw": "without", "raw": "Luk_1:74, Luk_12:5-7", "note": "", "refs": [{"l": "Luk 1:74", "n": "", "vs": [[74, "بعد تخليصنا من أيدي أعدائنا، أن نعبده بلا خوف،"]]}, {"l": "Luk 12:5-7", "n": "", "vs": [[5, "ولكني أريكم ممن تخافون: خافوا من القادر أن يلقي في جهنم بعد القتل. نعم، أقول لكم، من هذا خافوا!"], [6, "أما تباع خمسة عصافير بفلسين؟ ومع ذلك لا ينسى الله واحدا منها."], [7, "بل إن شعر رؤوسكم كله معدود. فلا تخافوا إذن، أنتم أفضل من عصافير كثيرة!"]]}], "kwAr": "دون خوف", "noteAr": ""}], "arS": [["كما أن ", []], ["أكثر", ["G4119"]], [" ", []], ["الإخوة", ["G80"]], ["، وقد صاروا ", []], ["واثقين", ["G3982"]], [" ", []], ["بالرب", ["G2962"]], [" بسبب ", []], ["قيودي", ["G1199", "G3450"]], ["، ", []], ["يجرؤون", ["G5111"]], [" على ", []], ["التبشير", ["G2980"]], [" ", []], ["بكلمة", ["G3056"]], [" الله ", []], ["دون خوف", ["G870"]], [".", []]]}, {"c": 1, "v": 15, "text": "حقا أن بعضهم يبشرون بالمسيح عن حسد ونزاع؛ وأما الآخرون فعن حسن نية.", "groups": [{"kw": "preach", "raw": "Phi_1:16, Phi_1:18; Act_5:42, Act_8:5, Act_8:35, Act_9:20, Act_10:36, Act_11:20; 1Co_1:23; 2Co_1:19, 2Co_4:5; 1Ti_3:16", "note": "", "refs": [{"l": "Phi 1:16", "n": "", "vs": [[16, "فهؤلاء تدفعهم المحبة، عالمين أني قد عينت للدفاع عن الإنجيل؛"]]}, {"l": "Phi 1:18", "n": "", "vs": [[18, "فماذا إذن؟ مهما يكن، وفي أي حال، فإن المسيح ينادى به، سواء أكان بذريعة أم بحق. وبهذا أنا أفرح وسأفرح بعد!"]]}, {"l": "Act 5:42", "n": "", "vs": [[42, "وكانوا كل يوم، في الهيكل وفي البيوت، يعلمون ويبشرون بالمسيح يسوع بلا انقطاع."]]}, {"l": "Act 8:5", "n": "", "vs": [[5, "فذهب فيلبس إلى مدينة في منطقة السامرة، وأخذ يبشر أهلها بالمسيح."]]}, {"l": "Act 8:35", "n": "", "vs": [[35, "فتكلم وأخذ يبشره بيسوع انطلاقا من كتاب النبي هذا."]]}, {"l": "Act 9:20", "n": "", "vs": [[20, "وفي الحال بدأ يبشر في المجامع بأن يسوع هو ابن الله."]]}, {"l": "Act 10:36", "n": "", "vs": [[36, "وقد أرسل كلمته إلى بني إسرائيل، وبشرهم بالسلام بواسطة يسوع المسيح، رب الجميع."]]}, {"l": "Act 11:20", "n": "", "vs": [[20, "غير أن بعضا منهم، وهم أصلا من قبرص والقيروان، وصلوا أنطاكية، وأخذوا يبشرون اليونانيين أيضا بالرب يسوع."]]}, {"l": "1Co 1:23", "n": "", "vs": [[23, "ولكننا نحن نبشر بالمسيح مصلوبا، مما يشكل عائقا عند اليهود وجهالة عند الأمم؛"]]}, {"l": "2Co 1:19", "n": "", "vs": [[19, "فإن ابن الله، المسيح يسوع، الذي بشرنا به فيما بينكم، أنا وسلوانس وتيموثاوس، لم يكن نعم ولا معا، وإنما فيه نعم."]]}, {"l": "2Co 4:5", "n": "", "vs": [[5, "فإننا لا نبشر بأنفسنا، بل بالمسيح يسوع ربا، وما نحن إلا عبيد لكم من أجل يسوع."]]}, {"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}], "kwAr": "يبشرون بالمسيح", "noteAr": ""}, {"kw": "even", "raw": "Phi_2:3; Mat_23:5; Rom_16:17, Rom_16:18; 1Co_3:3, 1Co_3:4, 1Co_13:3; 2Co_12:20; Gal_2:4; Jam_4:5, Jam_4:6", "note": "", "refs": [{"l": "Phi 2:3", "n": "", "vs": [[3, "لا يكن بينكم شيء بروح التحزب والافتخار الباطل، بل بالتواضع ليعتبر كل واحد منكم غيره أفضل كثيرا من نفسه،"]]}, {"l": "Mat 23:5", "n": "", "vs": [[5, "وكل ما  "Phi 1:14-17", "n": "", "vs": [[14, "كما أن أكثر الإخوة، وقد صاروا واثقين بالرب بسبب قيودي، يجرؤون على التبشير بكلمة الله دون خوف."], [15, "حقا أن بعضهم يبشرون بالمسيح عن حسد ونزاع؛ وأما الآخرون فعن حسن نية."], [16, "فهؤلاء تدفعهم المحبة، عالمين أني قد عينت للدفاع عن الإنجيل؛"], [17, "وأولئك يدفعهم التحزب، فينادون بالمسيح بغير إخلاص، ظنا منهم أنهم يثيرون علي الضيق إضافة إلى القيود."]]}, {"l": "Mat 23:14", "n": "", "vs": [[14, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تلتهمون بيوت الأرامل وتتذرعون بإطالة صلواتكم. لذلك ستنزل بكم دينونة أقسى!"]]}, {"l": "Mar 12:40", "n": "", "vs": [[40, "يلتهمون بيوت الأرامل، ويتذرعون بإطالة الصلوات. هؤلاء ستنزل بهم دينونة أقسى! »"]]}], "kwAr": "سواء أكان بذريعة أم بحق", "noteAr": ""}, {"kw": "Christ", "raw": "Phi_1:15", "note": "", "refs": [{"l": "Phi 1:15", "n": "", "vs": [[15, "حقا أن بعضهم يبشرون بالمسيح عن حسد ونزاع؛ وأما الآخرون فعن حسن نية."]]}], "kwAr": "فإن المسيح ينادى به", "noteAr": ""}, {"kw": "and I", "raw": "Mar_9:38-40; Luk_9:45, Luk_9:50; 1Co_15:11; 2Jo_1:9-11", "note": "", "refs": [{"l": "Mar 9:38-40", "n": "", "vs": [[38, "فتكلم يوحنا قائلا: «يامعلم، رأينا واحدا يطرد شياطين باسمك، وهو لا يتبعنا، فمنعناه لأنه لا يتبعنا!»"], [39, "فقال يسوع: «لا تمنعوه! فما من أحد يعمل معجزة باسمي ويمكنه أن يتكلم علي بالسوء سريعا بعد ذلك."], [40, "فإن من ليس ضدنا فهو معنا."]]}, {"l": "Luk 9:45", "n": "", "vs": [[45, "إلا أنهم لم يفهموا هذا القول، وقد أغلق عليهم فلم يدركوه، وخافوا أن يسألوه عنه."]]}, {"l": "Luk 9:50", "n": "", "vs": [[50, "فقال له يسوع: «لا تمنعوه: لأن من ليس ضدكم، فهو معكم! »"]]}, {"l": "1Co 15:11", "n": "", "vs": [[11, "وسواء أكنت أنا أم كانوا هم، فهكذا نبشر، وهكذا آمنتم."]]}, {"l": "2Jo 1:9-11", "n": "", "vs": [[9, "لأن من تعدى تعليم المسيح ولم يثبت فيه، فليس الله من نصيبه. أما من يثبت في هذا التعليم، فله الآب والابن معا."], [10, "إن جاءكم أحد بغير هذا التعليم، فلا تستقبلوه في بيتكم، ولا تبادلوه التحية."], [11, "لأن من يسلم عليه، يشاركه في أعماله الشريرة."]]}], "kwAr": "وبهذا أنا أفرح", "noteAr": ""}], "arS": ], ["بقائي", ["G1961"]], [" في ", []], ["الجسد", ["G4561"]], [" أشد ", []], ["ضرورة", ["G316"]], [" من أجلكم.", []]]}, {"c": 1, "v": 25, "text": "وما دامت لي ثقة بهذا، أعلم أني سأبقى وأقيم معكم جميعا، لأجل تقدمكم في الإيمان وفرحكم فيه،", "groups": [{"kw": "confidence", "raw": "Phi_2:24; Act_20:25", "note": "", "refs": [{"l": "Phi 2:24", "n": "", "vs": [[24, "ولكن لي ثقة في الرب بأني، أنا نفسي، سآتي إليكم عن قريب."]]}, {"l": "Act 20:25", "n": "", "vs": [[25, "وأنا أعلم أنكم لن تروا وجهي بعد اليوم، أنتم الذين تجولت بينكم جميعا مبشرا بملكوت الله."]]}], "kwAr": "وما دامت لي ثقة", "noteAr": ""}, {"kw": "for", "raw": "Luk_22:32; Joh_21:15-17; Act_11:23, Act_14:22; Rom_1:11, Rom_1:12, Rom_15:18, Rom_15:29; 2Co_1:24; Eph_4:11-13", "note": "", "refs": [{"l": "Luk 22:32", "n": "", "vs": [[32, "ولكني تضرعت لأجلك لكي لا يخيب إيمانك. وأنت، بعد أن تسترد، ثبت إخوتك»."]]}, {"l": "Joh 21:15-17", "n": "", "vs": [[15, "وبعدما أكلوا سأل يسوع سمعان بطرس: «ياسمعان بن يونا، أتحبني أكثر مما يحبني هؤلاء؟» فأجابه «نعم يارب، أنت تعلم أني أحبك!» فقال له: «أطعم حملاني!»"], [16, "ثم سأله ثانية: «ياسمعان بن يونا، أتحبني؟» فأجابه: «نعم يارب. أنت تعلم أني أحبك!» قال له: «ارع خرافي»"], [17, "فسأله مرة ثالثة: «ياسمعان بن يونا، أتحبني؟» فحزن بطرس لأن يسوع قال له في المرة الثالثة: «أتحبني». وقال له: «يارب، أنت تعلم كل شيء. أنت تعلم أني أحبك!» فقال له يسوع: «أطعم خرافي!"]]}, {"l": "Act 11:23", "n": "", "vs": [[23, "فلما وصل ورأى النعمة التي منحها الله ، امتلأ فرحا، وحث الجميع على الثبات في الرب بعزم القلب."]]}, {"l": "Act 14:22", "n": "", "vs": [[22, "وفي هذه الأماكن كلها كانا يشددان عزيمة التلاميذ، ويحثانهم على الثبات في الإيمان، مؤكدين لهم أن دخول ملكوت الله يقتضي أن نقاسي صعوبات كثيرة."]]}, {"l": "Rom 1:11", "n": "", "vs": [[11, "فإني أشتاق أن أراكم لأحمل إليكم موهبة روحية لتثبيتكم،"]]}, {"l": "Rom 1:12", "n": "", "vs": [[12, "أي ليشجع بعضنا بعضا بالإيمان المشترك، إيمانكم وإيماني."]]}, {"l": "Rom 15:18", "n": "", "vs": [[18, "فما كنت لأتجاسر أن أتكلم بشيء إلا على ما عمله المسيح على يدي لهداية الأمم إلى الطاعة، بالقول والفعل،"]]}, {"l": "Rom 15:29", "n": "", "vs": [[29, "سأنطلق إلى أسبانيا، مارا بكم. وأعلم أني، إذا جئت إليكم، فسوف أجيء في ملء بركة المسيح."]]}, {"l": "2Co 1:24", "n": "", "vs": [[24, "وهذا لا يعني أننا نتسلط على إيمانكم، بل إننا معاونون لكم نعمل لأجل فرحكم. فبالإيمان أنتم ثابتون."]]}, {"l": "Eph 4:11-13", "n": "", "vs": [[11, "وهو قد وهب البعض أن يكونوا رسلا، والبعض أنبياء، والبعض مبشرين والبعض رعاة ومعلمين،"], [12, "لتأهيل القديسين من جهة عمل الخدمة، لبنيان جسد المسيح،"], [13, "حتى نصل جميعا إلى وحدة الإيمان ووحدة المعرفة لابن الله، إلى إنسان تام البلوغ، إلى مقدار قامة ملء المسيح."]]}], "kwAr": "لأجل تقدمكم", "noteAr": ""}, {"kw": "joy", "raw": "Psa_60:6; Rom_5:2, Rom_15:13; 1Pe_1:8", "note": "", "refs": [{"l": "Psa 60:6", "n": "", "vs": [[6, "قد تكلم الله في قداسته، لذلك أبتهج وأقسم أرض شكيم وأقيس وادي سكوت،"]]}, {"l": "Rom 5:2", "n": "", "vs": [[2, "وبه أيضا تم لنا الدخول بالإيمان إلى هذه النعمة التي نقيم فيها الآن؛ ونحن نفتخر برجائنا في التمتع بمجد الله."]]}, {"l": "Rom 15:13", "n": "", "vs": [[13, "فليملأكم إله الرجاء كل فرح وسلام في إيمانكم حتى تزدادوا رجاء بقوة الروح القدس."]]}, {"l": "1Pe 1:8", "n": "", "vs": [[8, "أنتم لم تروا المسيح، ولكنكم تحبونه. ومع أنكم لا ترونه الآن، فأنتم تؤمنون به وتبتهجون بفرح مجيد يفوق الوصف."]]}], "kwAr": "وفرحكم فيه", "noteAr": ""}], "arS": [["وما دامت لي ", []], ["ثقة", ["G3982"]], [" بهذا، ", []], ["أعلم", ["G1492"]], [" أني ", []], ["سأبقى", ["G3306"]], [" ", []], ["وأقيم", ["G4839"]], [" معكم ", []], ["جميعا", ["G3956"]], ["، لأجل ", []], ["تقدمكم", ["G4297"]], [" في ", []], ["الإيمان", ["G4102"]], [" ", []], ["وفرحكم", ["G5479"]], [" فيه،", []]]}, {"c": 1, "v": 26, "text": "ليزداد بسببي افتخاركم بالمسيح بحضوري بينكم من جديد.", "groups": [{"kw": "", "raw": "Phi_2:16-18, Phi_3:1, Phi_3:3, Phi_4:4, Phi_4:10; Son_5:1; Joh_16:22, Joh_16:24; 2Co_1:14, 2Co_5:12, 2Co_7:6", "note": "", "refs": [{"l": "Phi 2:16-18", "n": "", "vs": [[16, "حاملين كلمة الحياة، لتكونوا في يوم المسيح موضع فخر بأني ما سعيت باطلا ولا اجتهدت عبثا."], [17, "حتى لو سفك دمي سكيبا فوق ذبيحة إيمانكم وخدمته، فإني أفرح وأبتهج معكم جميعا."], [18, "هكذا أيضا افرحوا أنتم، وابتهجوا معي."]]}, {"l": "Phi 3:1", "n": "", "vs": [[1, "وبعد، ياإخوتي، افرحوا في الرب. لا يزعجني أن أكتب إليكم بالأمور نفسها، فإن ذلك يجعلكم في مأمن."]]}, {"l": "Phi 3:3", "n": "", "vs": [[3, "فإننا نحن أهل الختان الحق، لأننا إنما نعبد بروح الله ونفتخر في المسيح يسوع، ولا نعتمد على أمور الجسد،"]]}, {"l": "Phi 4:4", "n": "", "vs": [[4, "افرحوا في الرب دائما، وأقول أيضا: افرحوا."]]}, {"l": "Phi 4:10", "n": "", "vs": [[10, "ثم إني فرحت في الرب فرحا عظيما إذ إنكم الآن قد جددتم مرة أخرى اهتمامكم بي. فمع أنه كان لكم مثل هذا الاهتمام، فإن الفرصة لم تتيسر لكم من قبل."]]}, {"l": "Son 5:1", "n": "", "vs": [[1, "(المحب): قد جئت إلى جنتي ياأختي، ياعروسي، وقطفت مري مع أطيابي، وأكلت شهدي مع عسلي، وشربت خمري مع لبني.(بنات أورشليم): كلوا أيها الخلان. اشربوا حتى الانتشاء أيها المحبون."]]}, {"l": "Joh 16:22", "n": "", "vs": [[22, "فكذلك أنتم، تحزنون الآن؛ ولكن عندما أعود للقائكم، تبتهج قلوبكم، ولا أحد يسلبكم فرحكم."]]}, {"l": "Joh 16:24", "n": "", "vs": [[24, "حتى الآن لم تطلبوا باسمي شيئا. اطلبوا تنالوا، فيكون فرحكم كاملا."]]}, {"l": "2Co 1:14", "n": "", "vs": [[14, "كما قد فهمتمونا فهما جزئيا، أننا سنكون فخرا لكم، مثلما أنتم فخر لنا، في يوم ربنا يسوع."]]}, {"l": "2Co 5:12", "n": "", "vs": [[12, "ليس أننا عدنا إلى مدح أنفسنا أمامكم؛ بل إنما نقدم لكم مبررا للافتخار بنا، ليكون لكم حجة تردون بها على الذين يفتخرون بالمظاهر لا بما في القلب."]]}, {"l": "2Co 7:6", "n": "", "vs": [[6, "إلا أن الله ، الذي يشجع المسحوقين، أمدنا بالتشجيع بمجيء تيطس إلينا،"]]}], "kwAr": "", "noteAr": ""}], "arS": [["ليزداد", ["G4052"]], [" بسببي ", []], ["افتخاركم", ["G2745"]], [" ", []], ["بالمسيح", ["G5547"]], [" ", []], ["بحضوري", ["G3952"]], [" بينكم من ", []], ["جديد", ["G3825"]], [".", []]]}, {"c": 1, "v": 27, "text": "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،", "groups": [{"kw": "let", "raw": "Phi_3:18-21; Eph_4:1; Col_1:10; 1Th_2:11, 1Th_2:12, 1Th_4:1; Tit_2:10; 2Pe_1:4-9; 2Pe_3:11, 2Pe_3:14", "note": "", "refs": [{"l": "Phi 3:18-21", "n": "", "vs": [[18, "فإن كثيرين ممن يسلكون بينكم، وقد ذكرتهم لكم مرارا وأذكرهم الآن أيضا باكيا، إنما هم أعداء لصليب المسيح."], [19, "الذين مصيرهم الهلاك، وإلههم بطونهم، ومفخرتهم في عيبتهم، وفكرهم منصرف إلى الأمور الأرضية."], [20, "أما نحن، فإن وطننا في السماوات التي منها ننتظر عودة مخلصنا الرب يسوع المسيح،"], [21, "الذي سيحول جسدنا الوضيع إلى صورة مطابقة لجسده المجيد، وفقا لعمل قدرته على إخضاع كل شيء لنفسه."]]}, {"l": "Eph 4:1", "n": "", "vs": [[1, "... إذن، أنا السجين في الرب، أناشدكم أن تسلكوا سلوكا يليق بالدعوة التي إليها دعيتم،"]]}, {"l": "Col 1:10", "n": "", "vs": [[10, "لكي تسلكوا سلوكا لائقا بالرب ومرضيا في كل شيء، منتجين الثمر في كل عمل صالح ونامين في معرفة الله إلى التمام،"]]}, {"l": "1Th 2:11", "n": "", "vs": [[11, "كما أنكم تعلمون كيف عاملناكم معاملة الأب لأولاده، فكنا نعظ كل واحد منكم ونشجعكم"]]}, {"l": "1Th 2:12", "n": "", "vs": [[12, "ونحرضكم أن تسلكوا سلوكا يليق بالله، ذاك الذي يدعوكم إلى ملكوته ومجده."]]}, {"l": "1Th 4:1", "n": "", "vs": [[1, "وبعد، أيها الإخوة، فمثلما تلقيتم منا كيف يجب أن تسلكوا سلوكا يرضي الله ، وكما أنتم فاعلون، نرجو منكم ونحرضكم في الرب يسوع أن تضاعفوا تقدمكم في ذلك أكثر فأكثر."]]}, {"l": "Tit 2:10", "n": "", "vs": [[10, "ولا سارقين، بل مظهرين أمانة كلية صالحة، لكي يزينوا في كل شيء تعليم مخلصنا الله."]]}, {"l": "2Pe 1:4-9", "n": "", "vs": [[4, "اللذين بهما أعطانا الله بركاته العظمى الثمينة التي كان قد وعد بها. وبهذا صار بإمكانكم أن تتخلصوا من الفساد الذي تنشره الشهوة في العالم، وتشتركوا في الطبيعة الإلهية."], [5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"], [6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"], [7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."], [8, "فحين تكون هذه الصفات الطيبة في داخلكم، وتزداد بوفرة، تجعلكم مجتهدين ومثمرين في معرفتكم لربنا يسوع المسيح."], [9, "أما الذي لا يملك هذه الصفات، فهو أعمى روحيا. إنه قصير البصر، قد نسي أنه تطهر من خطاياه القديمة!"]]}, {"l": "2Pe 3:11", "n": "", "vs": [[11, "ومادامت هذه الأشياء جميعا ستنحل، فكيف يجب أن تكونوا أنتم أصحاب سلوك مقدس يتصف بالتقوى،"]]}, {"l": "2Pe 3:14", "n": "", "vs": [[14, "فبينما تنتظرون إتمام هذا الوعد، أيها الأحباء، اجتهدوا أن يجدكم الرب في سلام، خالين من الدنس والعيب."]]}], "kwAr": "عيشوا عيشة تليق", "noteAr": ""}, {"kw": "the gospel", "raw": "Rom_1:9, Rom_1:16, Rom_15:16, Rom_15:29; 2Co_4:4, 2Co_9:13; Gal_1:7", "note": "", "refs": [{"l": "Rom 1:9", "n": "", "vs": [[9, "فإن الله الذي أخدمه بروحي في التبشير بإنجيل ابنه، هو شاهد لي كيف لا أتوقف عن ذكركم"]]}, {"l": "Rom 1:16", "n": "", "vs": [[16, "فأنا لا أستحي بالإنجيل، لأنه قدرة الله للخلاص، لكل من يؤمن، لليهودي أولا ثم لليوناني على السواء."]]}, {"l": "Rom 15:16", "n": "", "vs": [[16, "وبذلك أكون خادم المسيح يسوع، المرسل إلى الأمم، حاملا إنجيل الله وكأني أقوم بخدمة كهنوتية، بقصد أن ترفع لله من بين الأمم تقدمة تكون مقبولة ومقدسة بالروح القدس."]]}, {"l": "Rom 15:29", "n": "", "vs": [[29, "سأنطلق إلى أسبانيا، مارا بكم. وأعلم أني، إذا جئت إليكم، فسوف أجيء في ملء بركة المسيح."]]}, {"l": "2Co 4:4", "n": "", "vs": [[4, "الذين أعمى إله هذا العالم أذهانهم حتى لا يضيء لهم نور الإنجيل المختص بمجد المسيح الذي هو صورة الله."]]}, {"l": "2Co 9:13", "n": "", "vs": [[13, "فإن القديسين، إذ يختبرون هذه الخدمة، يمجدون الله على طاعتكم في الشهادة لإنجيل المسيح وعلى السخاء الطوعي في مشاركتكم لهم وللجميع."]]}, {"l": "Gal 1:7", "n": "", "vs": [[7, "لا أعني أن هنالك إنجيلا آخر، بل إنما هنالك بعض (المعلمين) الذين يثيرون البلبلة بينكم، راغبين في تحوير إنجيل المسيح."]]}], "kwAr": "بإنجيل المسيح", "noteAr": ""}, {"kw": "whether", "raw": "Phi_2:12, Phi_2:24", "note": "", "refs": [{"l": "Phi 2:12", "n": "", "vs": [[12, "إذن، ياأحبائي، كما كنتم تطيعون دائما، لا كما لو أنني حاضر وحسب، بل بالأحرى كثيرا الآن وأنا غائب، كذلك اسعوا لتحقيق خلاصكم عمليا بخوف وارتعاد،"]]}, {"l": "Phi 2:24", "n": "", "vs": [[24, "ولكن لي ثقة في الرب بأني، أنا نفسي، سآتي إليكم عن قريب."]]}], "kwAr": "إذا جئت وشاهدتكم", "noteAr": ""}, {"kw": "I may", "raw": "Eph_1:15; Col_1:4; 1Th_3:6; Phm_1:5; 3Jo_1:3, 3Jo_1:4", "note": "", "refs": [{"l": "Eph 1:15", "n": "", "vs": [[15, "لذلك أنا أيضا، وقد سمعت بما فيكم من الإيمان بالرب يسوع والمحبة لجميع القديسين،"]]}, {"l": "Col 1:4", "n": "", "vs": [[4, "إذ بلغنا خبر إيمانكم بالمسيح يسوع والمحبة التي لكم نحو جميع القديسين،"]]}, {"l": "1Th 3:6", "n": "", "vs": [[6, "أما الآن، وقد عاد تيموثاوس إلينا من عندكم وبشرنا بما لكم من إيمان ومحبة، وبأنكم تذكروننا ذكرا حسنا في كل حين، وتشتاقون كثيرا لرؤيتنا كما نشتاق نحن لرؤيتكم،"]]}, {"l": "Phm 1:5", "n": "", "vs": [[5, "وقد سمعت بما لك من محبة وأمانة من نحو الرب يسوع، ومن نحو جميع القديسين،"]]}, {"l": "3Jo 1:3", "n": "", "vs": [[3, "فكم كان فرحي عظيما عندما مر بي بعض الإخوة المسافرين وأخبروني أنك تسلك بحسب الحق، وشهدوا للحق الثابت فيك!"]]}, {"l": "3Jo 1:4", "n": "", "vs": [[4, "وما أعظم الفرح الذي يغمر قلبي حين أسمع الأخبار الطيبة التي تؤكد أن أولادي يسلكون بحسب الحق!"]]}], "kwAr": "أسمع أخباركم", "noteAr": ""}, {"kw": "that ye", "raw": "Phi_2:1, Phi_2:2, Phi_4:1; Psa_122:3, Psa_133:1; Mat_12:25; 1Co_1:10, 1Co_15:58, 1Co_16:13, 1Co_16:14; 2Co_13:11", "note": "", "refs": [{"l": "Phi 2:1", "n": "", "vs": [[1, "فما دام لنا التشجيع في المسيح، والتعزية في المحبة، والشركة في الروح، ولنا المراحم والحنو،"]]}, {"l": "Phi 2:2", "n": "", "vs": [[2, "فتمموا فرحي بأن يكون لكم رأي واحد ومحبة واحدة ونفس واحدة وفكر واحد."]]}, {"l": "Phi 4:1", "n": "", "vs": [[1, "إذن، ياإخوتي الأحباء والمشتاق إليهم، يافرحي وإكليلي، هكذا اثبتوا في الرب أيها الأحباء."]]}, {"l": "Psa 122:3", "n": "", "vs": [[3, "أورشليم المبنية كمدينة متماسكة متحدة."]]}, {"l": "Psa 133:1", "n": "", "vs": [[1, "ما أحسن وما أبهج أن يسكن الإخوة معا (بوئام)."]]}, {"l": "Mat 12:25", "n": "", "vs": [[25, "وعلم يسوع أفكارهم، فقال لهم: «كل مملكة تنقسم على ذاتها تخرب. وكل مدينة أو بيت ينقسم على ذاته، لا يصمد."]]}, {"l": "1Co 1:10", "n": "", "vs": [[10, "على أنني أيها الإخوة،
