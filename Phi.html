]]}, {"l": "Rev 19:16", "n": "", "vs": [[16, "وقد كتب على ثوبه وعلى فخذه «ملك الملوك ورب الأرباب»."]]}], "kwAr": "رفعه الله عاليا", "noteAr": ""}, {"kw": "given", "raw": "Psa_89:27; Eph_1:20-23; Col_1:18; Heb_1:4; 1Pe_3:22", "note": "", "refs": [{"l": "Psa 89:27", "n": "", "vs": [[27, "أقيمه بكرا يسمو على ملوك الأرض."]]}, {"l": "Eph 1:20-23", "n": "", "vs": [[20, "الذي عمله في المسيح، بإقامته له من بين الأموات. وقد أجلسه عن يمينه في الأماكن السماوية،"], [21, "أرفع جدا من كل رئاسة وسلطة وقوة وسيا دة، ومن كل اسم يسمى، لا في هذا العالم وحسب، بل في ذلك الآتي أيضا."], [22, "وأخضع كل شيء تحت قدميه، وإياه جعل فوق كل شيء رأسا للكنيسة"], [23, "التي هي جسده وكماله، هو الذي يكمل الكل في الكل."]]}, {"l": "Col 1:18", "n": "", "vs": [[18, "وهو رأس الجسد، أي الكنيسة؛ هو البداءة وبكر القائمين من بين الأموات، ليكون له المقام الأول في كل شيء."]]}, {"l": "Heb 1:4", "n": "", "vs": [[4, "جلس في الأعالي عن يمين الله العظيم. وهكذا، أخذ مكانا أعظم من الملائكة، بما أن الاسم الذي ورثه متفوق جدا على أسماء الملائكة جميعا!"]]}, {"l": "1Pe 3:22", "n": "", "vs": [[22, "الذي انطلق إلى السماء، وهو الآن جالس عن يمين الله؛ وقد جعلت الملائكة والسلطات والقوات (الروحية) خاضعة له!"]]}], "kwAr": "وأعطاه الاسم", "noteAr": ""}], "arS": [["لذلك", ["G1352"]], [" أيضا ", []], ["رفعه", ["G5251"]], [" ", []], ["الله", ["G2316"]], [" عاليا، ", []], ["وأعطاه", ["G5483"]], [" ", []], ["الاسم", ["G3686"]], [" الذي ", []], ["يفوق", ["G5228"]], [" ", []], ["كل", ["G3956"]], [" ", []], ["اسم", ["G3686"]], ["،", []]]}, {"c": 2, "v": 10, "text": "لكي تنحني سجودا لاسم يسوع كل ركبة، سواء في السماء أم على الأرض أم تحت الأرض،", "groups": [{"kw": "every", "raw": "Gen_41:43; Isa_45:23-25; Mat_27:29, Mat_28:18; Rom_11:4, Rom_14:10,Rom_14:11; Eph_3:14; Heb_1:6; Rev_4:10, Rev_5:13, Rev_5:14", "note": "", "refs": [{"l": "Gen 41:43", "n": "", "vs": [[43, "وأركبه في مركبته الثانية، ونادوا: «اركعوا أمامه». وأقامه واليا على كل أرض مصر."]]}, {"l": "Isa 45:23-25", "n": "", "vs": [[23, "لقد أقسمت بذاتي، وخرجت من فمي، بكل صدق، كلمة لا تنقض: إنه ستجثو لي كل ركبة ويقسم بي كل لسان."], [24, "ويقولون عني: إنما بالرب وحده البر والقوة، وكل من يغتاظ منه يأتي إلى الرب ويخزى."], [25, "أما ذرية إسرائيل فبالرب يتبررون وبه يزهون."]]}, {"l": "Mat 27:29", "n": "", "vs": [[29, "وجدلوا إكليلا من شوك وضعوه على رأسه، ووضعوا قصبة في يده اليمنى، وركعوا أمامه يسخرون منه وهم يقولون: «سلام ياملك اليهود!»"]]}, {"l": "Mat 28:18", "n": "", "vs": [[18, "فتقدم يسوع وكلمهم قائلا: «دفع إلي كل سلطان في السماء وعلى الأرض."]]}, {"l": "Rom 11:4", "n": "", "vs": [[4, "ولكن، ماذا كان الجواب الإلهي له؟: «أبقيت لنفسي سبعة آلاف رجل لم يحنوا ركبة للبعل!»"]]}, {"l": "Rom 14:10", "n": "", "vs": [[10, "ولكن، لماذا أنت تدين أخاك؟ وأنت أيضا، لماذا تحتقر أخاك؟ فإننا جميعا سوف نقف أمام عرش الله لنحاسب."]]}, {"l": "Rom 14:11", "n": "", "vs": [[11, "فإنه قد كتب: «أنا حي، يقول الرب، لي ستنحني كل ركبة، وسيعترف كل لسان لله!»"]]}, {"l": "Eph 3:14", "n": "", "vs": [[14, "ولهذا السبب أحني ركبتي للآب"]]}, {"l": "Heb 1:6", "n": "", "vs": [[6, "وعندما يعيد الله ابنه البكر إلى العالم، يقول: «ولتسجد له ملائكة الله جميعا!»"]]}, {"l": "Rev 4:10", "n": "", "vs": [[10, "يجثو الشيوخ الأربعة والعشرون أمام الجالس على العرش ساجدين للحي إلى أبد الآبدين، ويلقون أكاليلهم أمام عرشه وهم يهتفون:"]]}, {"l": "Rev 5:13", "n": "", "vs": [[13, "ثم سمعت كل خليقة في السماء وعلى الأرض، وتحت الأرض، وعلى البحر، هاتفة مع كل ما فيها: «البركة والإجلال والمجد والسلطة للجالس على العرش وللحمل، إلى أبد الآبدين»."]]}, {"l": "Rev 5:14", "n": "", "vs": [[14, "فردت الكائنات الحية الأربعة: «آمين!» وجثا الشيوخ ساجدين."]]}], "kwAr": "كل ركبة", "noteAr": ""}, {"kw": "under", "raw": "Mat_12:40; Joh_5:28, Joh_5:29; Eph_4:9; Rev_20:13", "note": "", "refs": [{"l": "Mat 12:40", "n": "", "vs": [[40, "فكما بقي يونان في جوف الحوت ثلاثة أيام وثلاث ليال، هكذا سيبقى ابن الإنسان في جوف الأرض ثلاثة أيام وثلاث ليال."]]}, {"l": "Joh 5:28", "n": "", "vs": [[28, "لا تتعجبوا من هذا: فسوف تأتي ساعة يسمع فيها جميع من في القبور صوته،"]]}, {"l": "Joh 5:29", "n": "", "vs": [[29, "فيخرجون منها: فالذين عملوا الصالحات يخرج ": "Mat 11:12", "n": "", "vs": [[12, "فمنذ أن بدأ يوحنا المعمدان خدمته وملكوت السماوات معرض للعنف؛ والعنفاء يختطفونه!"]]}, {"l": "Mat 11:29", "n": "", "vs": [[29, "احملوا نيري عليكم، وتتلمذوا على يدي، لأني وديع ومتواضع القلب، فتجدوا الراحة لنفوسكم."]]}, {"l": "Luk 13:23", "n": "", "vs": [[23, "وسأله أحدهم: «ياسيد، أقليل عدد الذين سيخلصون؟» ولكنه قال للجميع:"]]}, {"l": "Luk 13:24", "n": "", "vs": [[24, "«ابذلوا الجهد للدخول من الباب الضيق، فإني أقول لكم إن كثيرين سيسعون إلى الدخول، فلا يتمكنون."]]}, {"l": "Joh 6:27-29", "n": "", "vs": [[27, "لا تسعوا وراء الطعام الفاني، بل وراء الطعام الباقي إلى الحياة الأبدية، والذي يعطيكم إياه ابن الإنسان، لأن هذا الطعام قد وضع الله الآب ختمه عليه»."], [28, "فسألوه: «ماذا نفعل لنعمل ما يطلبه الله ؟»"], [29, "أجاب يسوع: «العمل الذي يطلبه الله هو أن تؤمنوا بمن أرسله»."]]}, {"l": "Rom 2:7", "n": "", "vs": [[7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"]]}, {"l": "1Co 9:24-27", "n": "", "vs": [[24, "أما تعلمون أن المتبارين يركضون جميعا في الميدان ولكن واحدا منهم فقط يفوز بالجائزة؟ هكذا اركضوا أنتم حتى تفوزوا!"], [25, "وكل متبار يفرض على نفسه تدريبا صارما في شتى المجالات. فهؤلاء المتبارون يفعلون ذلك ليفوزوا بإكليل فان، وأما نحن فلنفوز بإكليل غير فان."], [26, "إذن، أنا أركض هكذا، لا كمن لا هدف له، وهكذا ألاكم أيضا، لا كمن يلطم الهواء،"], [27, "بل أسدد اللكمات إلى جسدي وأسوقه أسيرا، مخافة أن يتبين أني غير مؤهل (للمجازاة) بعدما دعوت الآخرين إليها!"]]}, {"l": "1Co 15:58", "n": "", "vs": [[58, "إذن، ياإخوتي الأحباء، كونوا راسخين غير متزحزحين، كثيري الاجتهاد في عمل الرب دائما، عالمين أن جهدكم في الرب ليس عبثا!"]]}, {"l": "Gal 6:7-9", "n": "", "vs": [[7, "لا تنخدعوا: إن الله لا يستهزأ به. فكل ما يزرعه الإنسان، فإياه يحصد أيضا."], [8, "فإن من يزرع لجسده، فمن الجسد يحصد فسادا. ومن يزرع للروح، فمن الروح يحصد حياة أبدية. فلا نفشل في عمل الخير،"], [9, "لأننا، متى حان الأوان، سنحصد، إن كنا لا نتراخى."]]}, {"l": "1Th 1:3", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"]]}, {"l": "Heb 4:11", "n": "", "vs": [[11, "لذلك، لنجتهد جميعا للدخول إلى تلك الراحة، لكي لا يسقط أحد منا كما سقط أولئك الذين عصوا أمر الله."]]}, {"l": "Heb 6:10", "n": "", "vs": [[10, "وليس الله بظالم حتى ينسى عملكم الجاد في إظهار محبتكم له عن طريق خدمتكم للقديسين إكراما لاسمه، الأمر الذي قمتم به قبلا، وتقومون به الآن!"]]}, {"l": "Heb 6:11", "n": "", "vs": [[11, "وإنما نتمنى أن يظهر كل واحد منكم اجتهادا مماثلا في المحافظة حتى النهاية على الثقة الكاملة بالرجاء."]]}, {"l": "Heb 12:1", "n": "", "vs": [[1, "فبما أن هذا العدد الكبير من الشاهدين للإيمان، يتجمع حولنا كأنه سحابة عظيمة، فلنطرح جانبا كل ثقل يعيقنا عن التقدم، ونتخلص من تلك الخطيئة التي نتعرض للسقوط في فخها بسهولة، لكي نتمكن، نحن أيضا، أن نركض باجتهاد في السباق الممتد أمامنا،"]]}, {"l": "2Pe 1:5-10", "n": "", "vs": [[5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"], [6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"], [7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."], [8, "فحين تكون هذه الصفات الطيبة في داخلكم، وتزداد بوفرة، تجعلكم مجتهدين ومثمرين في معرفتكم لربنا يسوع المسيح."], [9, "أما الذي لا يملك هذه الصفات، فهو أعمى روحيا. إنه قصير البصر، قد نسي أنه تطهر من خطاياه القديمة!"], [10, "فأحرى بكم إذن، أيها الإخوة، أن تجتهدوا لتثبتوا عمليا أن الله قد دعاكم واختاركم حقا. فإنكم، إن فعلتم هذا، لن تسقطوا أبدا!"]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}], "kwAr": "اسعوا لتحقيق", "noteAr": ""}, {"kw": "own", "raw": "Phi_2:19; Rom_13:11-14; 1Co_9:20-23; 2Ti_2:10", "note": "", "refs": [{"l": "Phi 2:19", "n": "", "vs": [[19, "غير أني أرجو في الرب يسوع أن أرسل إليكم تيموثاوس عن قريب، لكي تطيب نفسي بمعرفة أحوالكم."]]}, {"l": "Rom 13:11-14", "n": "", "vs": [[11, "وفوق هذا، فأنتم تعرفون الوقت، وأنها الآن الساعة التي يجب أن نستيقظ فيها من النوم. فخلاصنا الآن، أقرب إلينا مما كان يوم آمنا:"], [12, "كاد الليل أن ينتهي والنهار أن يطلع. فلنطرح أعمال الظلام، ونلبس سلاح النور"], [13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."], [14, "وإنما البسوا الرب يسوع المسيح (تمثلوا به)، ولا تنشغلوا بالتدبير للجسد لقضاء شهواته."]]}, {"l": "1Co 9:20-23", "n": "", "vs": [[20, "فصرت لليهود كأني يهودي، حتى أكسب اليهود؛ وللخاضعين للشريعة كأني خاضع لها مع أني لست خاضعا لها حتى أكسب الخاضعين لها؛"], [21, "وللذين بلا شريعة كأني بلا شريعة مع أني لست بلا ناموس عند الله بل أنا خاضع لناموس من نحو المسيح حتى أكسب الذين هم بلا شريعة."], [22, "وصرت للضعفاء ضعيفا، حتى أكسب الضعفاء. صرت للجميع كل شيء، لأنقذ بعضا منهم مهما كلف الأمر."], [23, "وإني أفعل الأمور كلها من أجل الإنجيل، لأكون شريكا فيه مع الآخرين."]]}, {"l": "2Ti 2:10", "n": "", "vs": [[10, "لهذا السبب أحتمل كل شيء بصبر لأجل الذين اختارهم الله ، لكي يحصلوا، هم أيضا، على الخلاص الذي في المسيح يسوع مع المجد الأبدي."]]}], "kwAr": "خلاصكم", "noteAr": ""}, {"kw": "with", "raw": "Ezr_10:3; Psa_2:11, Psa_119:120; Isa_66:2, Isa_66:5; Act_9:6, Act_16:29; 1Co_2:3; 2Co_7:15; Eph_6:5; Heb_4:1, Heb_12:28, Heb_12:29", "note": "", "refs": [{"l": "Ezr 10:3", "n": "", "vs": [[3, "لذلك، لنبرم عهدا مع إلهنا، بأن نخرج كل النساء الغريبات، ومن أنجبن من أبناء بموجب رأي سيدي ومشورة سائر الذين يطيعون وصايا الله مطبقين بذلك نص الشريعة."]]}, {"l": "Psa 2:11", "n": "", "vs": [[11, "اعبدوا الرب بخوف، وابتهجوا برعدة."]]}, {"l": "Psa 119:120", "n": "", "vs": [[120, "اقشعر بدني رعبا منك وجزعت من أحكامك."]]}, {"l": "Isa 66:2", "n": "", "vs": [[2, "جميع هذه صنعتها يدي فوجدت كلها، لكنني أسر بالرجل المتواضع المنسحق الروح الذي يرتعد من كلمتي."]]}, {"l": "Isa 66:5", "n": "", "vs": [[5, "اسمعوا قول الرب أيها المرتعدون من كلامه: يسخر منكم إخوتكم الذين يكرهونكم وينبذونكم لأنكم تخافون اسمي قائلين: ليتمجد الرب حتى نشهد فرحكم. ولكنهم لا يعرفون أنهم هم الذين يخزون."]]}, {"l": "Act 9:6", "n": "", "vs": [[6, "فقال وهو مرتعد ومتحير؛ «يارب ماذا تريد أن أفعل؟» فقال له الرب: «قم، وادخل المدينة فيقال لك ما يجب أن تفعله»."]]}, {"l": "Act 16:29", "n": "", "vs": [[29, "فطلب ضوءا، واندفع إلى الداخل وهو يرتجف خوفا، وارتمى أمام بولس وسيلا،"]]}, {"l": "1Co 2:3", "n": "", "vs": [[3, "وقد كنت عندكم في حالة من الضعف والخوف والارتعاد الكثير."]]}, {"l": "2Co 7:15", "n": "", "vs": [[15, "وإن عواطفه تزداد نحوكم أكثر جدا عندما يتذكر طاعتكم جميعا وكيف استقبلتموه بخوف وارتعاد."]]}, {"l": "Eph 6:5", "n": "", "vs": [[5, "أيها العبيد، أطيعوا سادتكم البشريين بخوف وارتعاد، من قلب صادق، كمن يطيع المسيح،"]]}, {"l": "Heb 4:1", "n": "", "vs": [[1, "ومادام الوعد بالدخول إلى الراحة الإلهية قائما حتى الآن، فلنخف: فربما تبين أن بعضا منكم قد فشلوا في الدخول."]]}, {"l": "Heb 12:28", "n": "", "vs": [[28, "فبما أننا قد حصلنا على مملكة ثابتة لا تتزلزل، لنعبد الله ونخدمه شاكرين، بصورة ترضيه، بكل احترام ومخافة،"]]}, {"l": "Heb 12:29", "n": "", "vs": [[29, "متذكرين أن «إلهنا نار آكلة!»"]]}], "kwAr": "بخوف وارتعاد", "noteAr": ""}], "arS": [["إذن، ", []], ["ياأحبائي", ["G27", "G3450"]], ["، كما كنتم ", []], ["تطيعون", ["G5219"]], [" ", []], ["دائما", ["G3842"]], ["، لا كما لو أنني ", []], ["حاضر", ["G3952"]], [" ", []], ["وحسب", ["G3440"]], ["، بل ", []], ["بالأحرى", ["G3123"]], [" ", []], ["كثيرا", ["G4183"]], [" ", []], ["الآن", ["G3568"]], [" وأنا ", []], ["غائب", ["G666"]], ["، كذلك اسعوا ", []], ["لتحقيق", ["G2716"]], [" ", []], ["خلاصكم", ["G4991", "G1438"]], [" عمليا ", []], ["بخوف", ["G5401"]], [" ", []], ["وارتعاد", ["G5156"]], ["،", []]]}, {"c": 2, "v": 13, "text": "لأن الله هو الذي ينشيء فيكم الإرادة والعمل لأجل مرضاته.", "groups": [{"kw": "God", "raw": "2Ch_30:12; Isa_26:12; Jer_31:33, Jer_32:38; Joh_3:27; Act_11:21; 2Co_3:5; Heb_13:21; Jam_1:16-18", "note": "", "refs": [{"l": "2Ch 30:12", "n": "", "vs": [[12, "وعملت يد الرب في أوساط يهوذا فوحدت قلوبهم لتنفيذ ما أمر به الملك والرؤساء، بموجب وصايا الرب."]]}, {"l": "Isa 26:12", "n": "", "vs": [[12, "يارب أنت تجعل سلاما لنا لأنك صنعت لنا كل أعمالنا."]]}, {"l": "Jer 31:33", "n": "", "vs": [[33, "ولكن هذا هو العهد الذي أبرمه مع ذرية إسرائيل بعد تلك الأيام»، يقول الرب: «سأجعل شريعتي في دواخلهم، وأدونها على قلوبهم وأكون لهم إلها وهم يكونون لي شعبا."]]}, {"l": "Jer 32:38", "n": "", "vs": [[38, "فيكونون لي شعبا وأكون لهم إلها."]]}, {"l": "Joh 3:27", "n": "", "vs": [[27, "فأجاب يوحنا: «لا يقدر أحد أن ينال شيئا إلا إذا أعطي له من السماء!"]]}, {"l": "Act 11:21", "n": "", "vs": [[21, "فكانت يد الرب معهم، فآمن عدد كبير واهتدوا إلى الرب."]]}, {"l": "2Co 3:5", "n": "", "vs": [[5, "ليس أننا أصحاب كفاءة ذاتية لندعي شيئا لأنفسنا، بل إن كفاءتنا من الله،"]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}, {"l": "Jam 1:16-18", "n": "", "vs": [[16, "فيا إخوتي الأحباء، لا تضلوا:"], [17, "إن كل عطية صالحة وهبة كاملة إنما تنزل من فوق، من لدن أبي الأنوار الذي ليس فيه تحول، ولا ظل لأنه لا يدور."], [18, "وهو قد شاء أن يجعلنا أولادا له، فولدنا بكلمته، كلمة الحق. وغايته أن نكون باكورة خليقته."]]}], "kwAr": "لأن الله", "noteAr": ""}, {"kw": "to will", "raw": "1Ki_8:58; 1Ch_29:14-18; Ezr_1:1, Ezr_1:5, Ezr_7:27; Neh_2:4; Psa_110:3, Psa_119:36; Psa_141:4; Pro_21:1; Joh_6:45, Joh_6:65; Eph_2:4, Eph_2:5; 2Th_2:13, 2Th_2:14; Tit_3:4, Tit_3:5; 1Pe_1:3", "note": "", "refs": [{"l": "1Ki 8:58", "n": "", "vs": [[58, "بل ليجتذب قلوبنا إليه لنسلك في سبله ونطيع وصاياه وفرائضه وأحكامه التي أمر بها آباءنا،"]]}, {"l": "1Ch 29:14-18", "n": "", "vs": [[14, "ولكن من أنا، ومن هو شعبي حتى نقدر أن نتبرع بسخاء وعن رضى؟ لأن منك الجميع ومن يدك نقدم لك."], [15, "فنحن مثل آبائنا، غرباء ونزلاء أمامك، وأيامنا كالظل على الأرض، خالية من الرجاء."], [16, "فيا أيها الرب إلهنا، إن كل هذه الثروة التي وفرناها لنشيد لك هيكلا لاسم قدسك إنما هي من نعم يدك وأنت مالك الكل."], [17, "وأنا أعلم ياإلهي أنك تفحص القلوب وتسر بالاستقامة، وأنا قدمت إليك كل هذه بقلب مستقيم، كذلك رأيت شعبك الماثل هنا يتبرع عن رضى بابتهاج."], [18, "فيارب إله آبائنا إبراهيم وإسحق وإسرائيل، اجعل هذه الرغبة أن تظل حية إلى الأبد في قلوب شعبك، واحفظ قلوبهم لتبقى مخلصة لك."]]}, {"l": "Ezr 1:1", "n": "", "vs": [[1, "في السنة الأولى لحكم كورش ملك فارس، وإتماما لكلام الرب الذي نطق به على لسان إرميا، نبه الرب روح كورش فأصدر نداء مكتوبا في كل أرجاء مملكته ورد فيه:"]]}, {"l": "Ezr 1:5", "n": "", "vs": [[5, "فهب رؤساء بيوت يهوذا وبنيامين، والكهنة واللاويون، كل من نبه الرب قلبه ليرجع إلى أورشليم لبناء هيكل الرب هناك."]]}, {"l": "Ezr 7:27", "n": "", "vs": [[27, "فقال عزرا: «مبارك الرب إله آبائنا الذي وضع مثل هذا في قلب الملك لتكريم هيكل الرب في أورشليم،"]]}, {"l": "Neh 2:4", "n": "", "vs": [[4, "فسألني الملك: أي شيء تطلب؟ فصليت إلى إله السماء،"]]}, {"l": "Psa 110:3", "n": "", "vs": [[3, "في يوم محاربة أعدائك يتطوع شعبك. يجيء شبابك إلى التلال المقدسة كالندى في قلب الفجر."]]}, {"l": "Psa 119:36", "n": "", "vs": [[36, "اجتذب قلبي نحو شهاداتك بعيدا عن مطامع المال."]]}, {"l": "Psa 141:4", "n": "", "vs": [[4, "لا تدع قلبي يتعلق بشيء رديء، فيمارس أعمال الشر مع فاعلي الإثم. ولا تدعني آكل من أطايبهم."]]}, {"l": "Pro 21:1", "n": "", "vs": [[1, "قلب الملك في يد الرب كجداول مياه يميله حيثما شاء."]]}, {"l": "Joh 6:45", "n": "", "vs": [[45, "جاء في كتب الأنبياء: سيتعلم الجميع من الله. وكل من يسمع الآب ويتعلم منه يأتي إلي."]]}, {"l": "Joh 6:65", "n": "", "vs": [[65, "ثم قال: «لذلك قلت لكم: لا يقدر أحد أن يأتي إلي إلا إذا وهبه الآب ذلك»."]]}, {"l": "Eph 2:4", "n": "", "vs": [[4, "أما الله ، وهو غني في الرحمة، فبسبب محبته العظيمة التي أحبنا بها،"]]}, {"l": "Eph 2:5", "n": "", "vs": [[5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "2Th 2:14", "n": "", "vs": [[14, "فإلى هذا الأمر قد دعاكم ببشارتنا لكم، لنوال مجد ربنا يسوع المسيح."]]}, {"l": "Tit 3:4", "n": "", "vs": [[4, "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،"]]}, {"l": "Tit 3:5", "n": "", "vs": [[5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"]]}, {"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}], "kwAr": "الإرادة والعمل", "noteAr": ""}, {"kw": "good", "raw": "Luk_12:32; Rom_9:11, Rom_9:16; Eph_1:5, Eph_1:9, Eph_1:11, Eph_2:8; 2Th_1:11; 2Ti_1:9", "note": "", "refs": [{"l": "Luk 12:32", "n": "", "vs": [[32, "لا تخافوا، أيها القطيع الصغير، لأن أباكم قد سر أن يعطيكم الملكوت."]]}, {"l": "Rom 9:11", "n": "", "vs": [[11, "ولم يكن الولدان قد ولدا بعد ولا فعلا خيرا أو شرا، وذلك كي يبقى قصد الله من جهة الاختيار"]]}, {"l": "Rom 9:16", "n": "", "vs": [[16, "إذا، لا يتعلق الأمر برغبة الإنسان ولا بسعيه، وإنما برحمة الله فقط."]]}, {"l": "Eph 1:5", "n": "", "vs": [[5, "إذ سبق فعيننا في المحبة ليتخذنا أبناء له بيسوع المسيح. وذلك موافق للقصد الذي سرت به مشيئته،"]]}, {"l": "Eph 1:9", "n": "", "vs": [[9, "إذ كشف لنا سر مشيئته بحسب مرضاته التي قصدها في نفسه،"]]}, {"l": "Eph 1:11", "n": "", "vs": [[11, "وفي المسيح أيضا قد حصلنا على الميراث الذي سبق أن عينا له، وفقا لقصده، هو الذي يعمل كل شيء كما تقضي مشيئته."]]}, {"l": "Eph 2:8", "n": "", "vs": [[8, "فإنكم بالنعمة مخلصون، بالإيمان، وهذا ليس منكم. إنه هبة من الله،"]]}, {"l": "2Th 1:11", "n": "", "vs": [[11, "لأجل ذلك أيضا نصلي من أجلكم على الدوام، لكي يجعلكم إلهنا مؤهلين للدعوة الإلهية ويتم فيكم، بقدرته، كل ما يسره من الصلاح وفعالية الإيمان،"]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،"]]}], "kwAr": "لأجل مرضاته", "noteAr": ""}], "arS": [["لأن ", []], ["الله", ["G2316"]], [" هو الذي ", []], ["ينشيء", ["G1754"]], [" فيكم ", []], ["الإرادة", ["G2309"]], [" ", []], ["والعمل", ["G1754"]], [" لأجل ", []], ["مرضاته", ["G2107"]], [".", []]]}, {"c": 2, "v": 14, "text": "فافعلوا كل شيء دون تذمر أو جدال،", "groups": [{"kw": "without", "raw": "Phi_2:3; Exo_16:7, Exo_16:8; Num_14:27; Psa_106:25; Mat_20:11; Mar_14:5; Act_6:1; 1Co_10:10; Jam_5:9; 1Pe_4:9; Jud_1:16", "note": "", "refs": [{"l": "Phi 2:3", "n": "", "vs": [[3, "لا يكن بينكم شيء بروح التحزب والافتخار الباطل، بل بالتواضع ليعتبر كل واحد منكم غيره أفضل كثيرا من نفسه،"]]}, {"l": "Exo 16:7", "n": "", "vs": [[7, "وفي الصباح تعاينون مجد الرب، لأنه قد سمع تذمركم عليه، ولكن من نحن حتى تتذمروا علينا؟»"]]}, {"l": "Exo 16:8", "n": "", "vs": [[8, "وقال موسى أيضا: «إنكم ستعلمون أنه هو الرب، عندما يعطيكم لحما في المساء لتأكلوا، وخبزا في الصباح لتشبعوا، لأنه سمع تذمركم عليه. فماذا نحن؟ إنكم تتذمرون على الله»."]]}, {"l": "Num 14:27", "n": "", "vs": [[27, "«إلى متى أصفح عن هذه الجماعة الشريرة المتذمرة علي؟ لقد سمعت تذمرهم علي،"]]}, {"l": "Psa 106:25", "n": "", "vs": [[25, "بل تذمروا داخل خيامهم، غير منصتين لصوت الرب."]]}, {"l": "Mat 20:11", "n": "", "vs": [[11, "وفيما هم يقبضون الدينار، تذمروا على رب البيت،"]]}, {"l": "Mar 14:5", "n": "", "vs": [[5, "فقد كان يمكن أن يباع هذا العطر بأكثر من ثلاث مئة دينار، ويوهب الثمن للفقراء». وأخذوا يؤنبون المرأة."]]}, {"l": "Act 6:1", "n": "", "vs": [[1, "وإذ تكاثر التلاميذ في تلك الأيام، احتج اليهود اليونانيون على العبرانيين، لأن أراملهم لم يكن يحصلن على نصيب من الإعانات اليومية."]]}, {"l": "1Co 10:10", "n": "", "vs": [[10, "ولا تتذمروا، كما تذمر بعضهم، فهلكوا على يد الملاك المهلك."]]}, {"l": "Jam 5:9", "n": "", "vs": [[9, "أيها الإخوة، لا تتذمروا بعضكم على بعض، لكي لا يصدر الحكم ضدكم. تذكروا دائما أن الديان قريب جدا، إنه أمام الباب."]]}, {"l": "1Pe 4:9", "n": "", "vs": [[9, "ومارسوا الضيافة بعضكم نحو بعض بلا تذمر."]]}, {"l": "Jud 1:16", "n": "", "vs": [[16, "وهؤلاء المعلمون يتذمرون ويشكون دائما وفيما هم يندفعون وراء شهواتهم، يطلقون ألسنتهم متحدثين بأمور طنانة، ويمدحون من يعجبهم طلبا للمنفعة!"]]}], "kwAr": "دون تذمر", "noteAr": ""}, {"kw": "disputings", "raw": "Pro_13:10, Pro_15:17, Pro_15:18; Mar_9:33, Mar_9:34; Act_15:2, Act_15:7, Act_15:39; Rom_12:18, Rom_14:1, Rom_16:17; 1Co_1:10-12, 1Co_3:3-5; 2Co_12:20; Gal_5:15, Gal_5:26; Eph_4:31, Eph_4:32; 1Th_5:13, 1Th_5:15; 1Ti_6:3-5; Heb_12:14; Jam_1:20, Jam_3:14-18, Jam_4:1; 1Pe_3:11", "note": "", "refs": [{"l": "Pro 13:10", "n": "", "vs": [[10, "تولد الكبرياء الخصومة، أما المشاورون فذوو حكمة."]]}, {"l": "Pro 15:17", "n": "", "vs": [[17, "أكلة من البقول في جو مشبع بالمحبة خير من أكل وجبة من لحم عجل معلوف في جو من البغضاء."]]}, {"l": "Pro 15:18", "n": "", "vs": [[18, "الرجل الغضوب يثير الخصومة، والطويل الأناة يسكن النزاع."]]}, {"l": "Mar 9:33", "n": "", "vs": [[33, "ثم جاء إلى كفرناحوم. وبينما هو في البيت، سأل تلاميذه: «فيم كنتم تتجادلون في الطريق؟»."]]}, {"l": "Mar 9:34", "n": "", "vs": [[34, "فسكتوا، إذ كانوا في الطريق قد تجادلوا في من هو الأعظم بينهم."]]}, {"l": "Act 15:2", "n": "", "vs": [[2, "فجادلهم بولس وبرنابا جدالا عنيفا. وبعد المناقشة قرر مؤمنو أنطاكية أن يذهب بولس وبرنابا مع بعض المؤمنين ليقابلوا الرسل والشيوخ في أورشليم، ويبحثوا معهم في هذه القضية."]]}, {"l": "Act 15:7", "n": "", "vs": [[7, "وبعد نقاش كثير، وقف بطرس وقال:"]]}, {"l": "Act 15:39", "n": "", "vs": [[39, "فوقعت بينهما مشاجرة حتى انفصل أحدهما عن الآخر. فأخذ برنابا مرقس وسافر بحرا إلى قبرص،"]]}, {"l": "Rom 12:18", "n": "", "vs": [[18, "إن كان ممكنا، فمادام الأمر يتعلق بكم، عيشوا في سلام مع جميع الناس."]]}, {"l": "Rom 14:1", "n": "", "vs": [[1, "ومن كان ضعيفا في الإيمان، فاقبلوه بينكم دون أن تحاكموه على أرائه."]]}, {"l": "Rom 16:17", "n": "", "vs": [[17, "ولكن، أتوسل إليكم، أيها الإخوة، أن تنتبهوا إلى مثيري الانقسامات والعثرات، خلافا للتعليم الذي تعلمتم، وأن تبتعدوا عنهم."]]}, {"l": "1Co 1:10-12", "n": "", "vs": [[10, "على أنني أيها الإخوة، أتوسل إليكم باسم ربنا يسوع المسيح أن يكون لجميعكم صوت واحد وأن لا يكون بينكم أي انقسام. وإنما كونوا جميعا موحدي الفكر والرأي."], [11, "فقد بلغني عنكم، ياإخوتي، على لسان عائلة خلوي، أن بينكم خلافات."], [12, "أعني أن واحدا منكم يقول: «أنا مع بولس» وآخر: «أنا مع أبلوس»، وآخر: «أنا مع بطرس»، وآخر: «أنا مع المسيح»."]]}, {"l": "1Co 3:3-5", "n": "", "vs": [[3, "فإنكم مازلتم جسديين. فمادام بينكم حسد وخصام (وانقسام)، أفلا تكونون جسديين وتسلكون وفقا للبشر؟"], [4, "ومادام أحدكم يقول: «أنا مع بولس»، وآخر: «أنا مع أبلوس»، أفلا تكونون جسديين؟"], [5, "فمن هو بولس؟ ومن هو أبلوس؟ إنهما فقط خادمان آمنتم على أيديهما، وكما أنعم الرب على كل منهما."]]}, {"l": "2Co 12:20", "n": "", "vs": [[20, "فإني أخشى أن آتي إليكم فأجدكم في حالة لا أريدها وتجدوني في حالة لا تريدونها! أي أن يكون بينكم كثير من النزاع والحسد والحقد والتحزب والتجريح والنميمة والتكبر والبلبلة."]]}, {"l": "Gal 5:15", "n": "", "vs": [[15, "فإذا كنتم تنهشون وتفترسون بعضكم بعضا، فاحذروا أن يفني أحدكم الآخر!"]]}, {"l": "Gal 5:26", "n": "", "vs": [[26, "لا نكن طامحين إلى المجد الباطل، يستفز بعضنا بعضا، ويحسد أحدنا الآخر!"]]}, {"l": "Eph 4:31", "n": "", "vs": [[31, "انزعوا عنكم كل حقد ونقمة وغضب وصخب وسباب وكل شر."]]}, {"l": "Eph 4:32", "n": "", "vs": [[32, "وكونوا لطفاء بعضكم نحو بعض، شفوقين، مسامحين بعضكم بعضا كما سامحكم الله في المسيح."]]}, {"l": "1Th 5:13", "n": "", "vs": [[13, "وأن تقدروهم تقديرا فائقا في المحبة، من أجل عملهم. عيشوا بسلام بعضكم مع بعض."]]}, {"l": "1Th 5:15", "n": "", "vs": [[15, "حذار أن يبادل أحدكم شر غيره بشر مثله بل اسعوا دائما إلى الخير في معاملتكم بعضكم لبعض وللآخرين جميعا."]]}, {"l": "1Ti 6:3-5", "n": "", "vs": [[3, "أما إذا كان أحد يعلم ما يخالفها ولا يذعن للكلام الصحيح، كلام ربنا يسوع المسيح، وللتعليم الموافق للتقوى،"], [4, "فهو قد انتفخ تكبرا، ولا يعرف شيئا، وإنما هو مهووس بالمجادلات والمنازعات الكلامية، ومنها ينشأ الحسد والخصام والتجريح والنيات السيئة،"], [5, "وشتى أنواع النزاع بين أناس فاسدي العقول مجردين من الحق، يعتبرون التقوى تجارة."]]}, {"l": "Heb 12:14", "n": "", "vs": [[14, "اجعلوا هدفكم أن تسالموا جميع الناس، وتعيشوا حياة مقدسة. فبغير قداسة، لا يقدر أحد أن يرى الرب."]]}, {"l": "Jam 1:20", "n": "", "vs": [[20, "لأن الإنسان، إذا غضب، لا يعمل الصلاح الذي يريده الله ."]]}, {"l": "Jam 3:14-18", "n": "", "vs": [[14, "أما إن كانت قلوبكم مملوءة بمرارة الحسد وبالتحزب، فلا تفتخروا بحكمتكم، ولا تنكروا الحق."], [15, "إن هذه الحكمة التي تدعونها ليست نازلة من عند الله، بل هي «حكمة» أرضية بشرية شيطانية."], [16, "فحيث تكون مرارة الحسد والتحزب، ينتشر الخلاف والفوضى وجميع الشرور."], [17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."], [18, "والبر هو ثمر ة ما يزرعه في سلام صانعو السلام."]]}, {"l": "Jam 4:1", "n": "", "vs": [[1, "من أين النزاع والخصام بينكم؟ أليس من لذاتكم تلك المتصارعة في أعضائكم؟"]]}, {"l": "1Pe 3:11", "n": "", "vs": [[11, "ليتحول عن الشر ويفعل الخير. ليطلب السلام ويسع للوصول إليه."]]}], "kwAr": "أو جدال", "noteAr": ""}], "arS": [["فافعلوا", ["G4160"]], [" ", []], ["كل شيء", ["G3956"]], [" دون ", []], ["تذمر", ["G1112"]], [" أو ", []], ["جدال", ["G1261"]], ["،", []]]}, {"c": 2, "v": 15, "text": "لتكونوا بلا أذى وبسطاء، أولادا لله لا يعابون بشيء في وسط جيل منحرف فاسد، تضيئون بينهم كأنوار في العالم،", "groups": [{"kw": "blameless", "raw": "Luk_1:6; 1Co_1:8; Eph_5:27; 1Th_5:23; 1Ti_3:2, 1Ti_3:10, 1Ti_5:7; Tit_1:6; 2Pe_3:14", "note": "", "refs": [{"l": "Luk 1:6", "n": "", "vs": [[6, "وكان كلاهما بارين أمام الله، يسلكان وفقا لوصايا الرب وأحكامه كلها بغير لوم."]]}, {"l": "1Co 1:8", "n": "", "vs": [[8, "وهو نفسه سيحفظكم ثابتين إلى النهاية حتى تكونوا بلا عيب في يوم ربنا يسوع المسيح."]]}, {"l": "Eph 5:27", "n": "", "vs": [[27, "حتى يزفها إلى نفسه كنيسة بهية لا يشوبها عيب أو تجعد أو أية نقيصة مشابهة بل تكون مقدسة خالية من العيوب."]]}, {"l": "1Th 5:23", "n": "", "vs": [[23, "وإله السلام نفسه يقدسكم إلى التمام ويحفظكم سالمين، روحا ونفسا وجسدا، لتكونوا بلا لوم عند عودة ربنا يسوع المسيح."]]}, {"l": "1Ti 3:2", "n": "", "vs": [[2, "إذن، يجب أن يكون الراعي بلا عيب، زوجا لامرأة واحدة، نبيها عاقلا مهذبا مضيافا، قادرا على التعليم؛"]]}, {"l": "1Ti 3:10", "n": "", "vs": [[10, "وأيضا يجب أن يتم اختبار المدبرين أولا، فإذا تبين أنهم بلا شكوى، فليباشروا خدمة التدبير."]]}, {"l": "1Ti 5:7", "n": "", "vs": [[7, "وعليك أن توصي بهذه الأمور، لكي يكون الجميع بلا لوم."]]}, {"l": "Tit 1:6", "n": "", "vs": [[6, "على أن يكون الواحد منهم بريئا من كل تهمة، زوجا لامرأة واحدة، أبا لأولاد مؤمنين لا يتهمون بالخلاعة والتمرد."]]}, {"l": "2Pe 3:14", "n": "", "vs": [[14, "فبينما تنتظرون إتمام هذا الوعد، أيها الأحباء، اجتهدوا أن يجدكم الرب في سلام، خالين من الدنس والعيب."]]}], "kwAr": "بلا أذى", "noteAr": ""}, {"kw": "and", "raw": "Mat_10:16; Rom_16:19; Heb_7:26", "note": "", "refs": [{"l": "Mat 10:16", "n": "", "vs": [[16, "ها أنا أرسلكم مثل الخراف بين الذئاب، فكونوا متنبهين كالحيات ومسالمين كالحمام."]]}, {"l": "Rom 16:19", "n": "", "vs": [[19, "إن خبر طاعتكم قد بلغ الجميع. ولذلك أفرح بكم، ولكن أريد لكم أن تكونوا حكماء في ما هو خير، وبسطاء في ما هو شر."]]}, {"l": "Heb 7:26", "n": "", "vs": [[26, "نعم، هذا هو رئيس الكهنة الذي كنا محتاجين إليه. إنه قدوس، لا عيبة فيه، ولا نجاسة، قد انفصل عن الخاطئين، وارتفع حتى صار أسمى من السماوات."]]}], "kwAr": "وبسطاء", "noteAr": ""}, {"kw": "harmless", "raw": "or, sincere, Phi_1:10", "note": "or, sincere, Phi_1:10", "refs": [{"l": "Phi 1:10", "n": "", "vs": [[10, "لكي تستحسنوا الأمور الممتازة، حتى تكونوا طاهرين وخالين من العثرات إلى يوم المسيح،"]]}], "kwAr": "بسطاء", "noteAr": "أو: مخلصين (بسطاء)."}, {"kw": "sons", "raw": "Mat_5:45, Mat_5:48; Luk_6:35; 2Co_6:17; Eph_5:1, Eph_5:2, Eph_5:7; 1Pe_1:14-17, 1Pe_2:9; 1Jo_3:1-3", "note": "", "refs": [{"l": "Mat 5:45", "n": "", "vs": [[45, "فتكونوا أبناء أبيكم الذي في السماوات: فإنه يشرق بشمسه على الأشرار والصالحين، ويمطر على الأبرار وغير الأبرار."]]}, {"l": "Mat 5:48", "n": "", "vs": [[48, "فكونوا أنتم كاملين، كما أن أباكم السماوي هو كامل!"]]}, {"l": "Luk 6:35", "n": "", "vs": [[35, "ولكن، أحبوا أعداءكم، وأحسنوا المعاملة، وأقرضوا دون أن تأملوا استيفاء القرض، فتكون مكافأتكم عظيمة، وتكونوا أبناء العلي، لأنه ينعم على ناكري الجميل والأشرار."]]}, {"l": "2Co 6:17", "n": "", "vs": [[17, "لذلك اخرجوا من وسطهم، وكونوا منفصلين، يقول الرب، ولا تلمسوا ما هو نجس،"]]}, {"l": "Eph 5:1", "n": "", "vs": [[1, "فاقتدوا إذن بالله كأولاد أحباء،"]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "Eph 5:7", "n": "", "vs": [[7, "إذن، لا تكونوا شركاء لهم:"]]}, {"l": "1Pe 1:14-17", "n": "", "vs": [[14, "وبما أنكم صرتم أولادا لله مطيعين له، فلا تعودوا إلى مجاراة الشهوات التي كانت تسيطر عليكم سابقا في أيام جهلكم."], [15, "وإنما اسلكوا سلوكا مقدسا في كل أمر، مقتدين بالقدوس الذي دعاكم،"], [16, "لأنه قد كتب: «كونوا قديسين، لأني أنا قدوس!»"], [17, "وما دمتم تعترفون بالله أبا لكم، وهو يحكم على كل إنسان حسب أعماله دون انحياز، فاسلكوا في مخافته مدة إقامتكم المؤقتة على الأرض."]]}, {"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}, {"l": "1Jo 3:1-3", "n": "", "vs": [[1, "تأملوا ما أعظم المحبة التي أحبنا بها الآب حتى صرنا ندعى «أولاد الله»، ونحن أولاده حقا. ولكن، بما أن أهل العالم لا يعرفون الله، فهم لا يعرفوننا."], [2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"], [3, "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر."]]}], "kwAr": "أولادا لله", "noteAr": ""}, {"kw": "rebuke", "raw": "1Ti_5:14, 1Ti_5:20; Tit_2:10,Tit_2:15; Rev_3:9", "note": "", "refs": [{"l": "1Ti 5:14", "n": "", "vs": [[14, "فأريد إذن أن تتزوج الأرامل الشابات، فيلدن الأولاد، ويدبرن بيوتهن، ولا يفسحن للمقاوم في المجال للطعن في سلوكهن."]]}, {"l": "1Ti 5:20", "n": "", "vs": [[20, "فإذا ثبت أن المتهم مخطيء، وبخه أمام الجميع، ليكون عند الباقين خوف!"]]}, {"l": "Tit 2:10", "n": "", "vs": [[10, "ولا سارقين، بل مظهرين أمانة كلية صالحة، لكي يزينوا في كل شيء تعليم مخلصنا الله."]]}, {"l": "Tit 2:15", "n": "", "vs": [[15, "بهذه الأمور تكلم، وعظ، ووبخ بكل سلطان، ولا تدع أحدا يستخف بك!"]]}, {"l": "Rev 3:9", "n": "", "vs": [[9, "أما الذين هم من مجمع الشيطان، ويدعون كذبا أنهم يهود، فسأجبرهم على أن يسجدوا عند قدميك، ويعترفوا بأني أحببتك."]]}], "kwAr": "لا يعابون بشيء", "noteAr": ""}, {"kw": "a crooked", "raw": "Deu_32:5; Psa_122:5; Mat_17:17; Act_20:30; 1Pe_2:12", "note": "", "refs": [{"l": "Deu 32:5", "n": "", "vs": [[5, "لقد اقترفوا الفساد أمامه، ولم يعودوا له أبناء بل لطخة عار، إنهم جيل أعوج وملتو"]]}, {"l": "Psa 122:5", "n": "", "vs": [[5, "هناك نصبت عروش القضاء، عروش آل داود."]]}, {"l": "Mat 17:17", "n": "", "vs": [[17, "فأجاب يسوع قائلا: «أيها الجيل غير المؤمن والأعوج، إلى متى أبقى معكم؟ إلى متى أحتملكم؟ أحضروه إلي هنا!»"]]}, {"l": "Act 20:30", "n": "", "vs": [[30, "بل إن قوما منكم أنتم سيقومون ويعلمون تعاليم منحرفة، ليجروا التلاميذ وراءهم."]]}, {"l": "1Pe 2:12", "n": "", "vs": [[12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالحة يمجدون الله في يوم الافتقاد."]]}], "kwAr": "جيل منحرف فاسد", "noteAr": ""}, {"kw": "ye shine", "raw": "or, shine ye, Isa_60:1; Mat_5:14-16; Joh_5:35; Eph_5:8", "note": "or, shine ye, Isa_60:1; Mat_5:14-16; Joh_5:35; Eph_5:8", "refs": [{"l": "Isa 60:1", "n": "", "vs": [[1, "قومي استضيئي، فإن نورك قد جاء، ومجد الرب أشرق عليك."]]}, {"l": "Mat 5:14-16", "n": "", "vs": [[14, "أنتم نور العالم. لا يمكن أن تخفى مدينة مبنية على جبل؛"], [15, "ولا يضيء الناس مصباحا ثم يضعونه تحت مكيال، بل يضعونه في مكان مرتفع ليضيء لجميع من في البيت."], [16, "هكذا، فليضيء نوركم أمام الناس، ليروا أعمالكم الحسنة ويمجدوا أباكم الذي في السماوات."]]}, {"l": "Joh 5:35", "n": "", "vs": [[35, "فقد كان يوحنا مصباحا متوهجا مضيئا، وشئتم أن تستمتعوا بنوره فترة من الزمن."]]}, {"l": "Eph 5:8", "n": "", "vs": [[8, "فقد كنتم في الماضي ظلاما، ولكنكم الآن نور في الرب. فاسلكوا سلوك أولاد النور."]]}], "kwAr": "تضيئون بينهم", "noteAr": "أو: أضيئوا (بصيغة الأمر)."}], "arS": [["لتكونوا ", []], ["بلا أذى", ["G273"]], [" ", []], ["وبسطاء", ["G185"]], ["، ", []], ["أولادا", ["G5043"]], [" ", []], ["لله", ["G2316"]], [" لا ", []], ["يعابون", ["G298"]], [" بشيء في ", []], ["وسط", ["G3319"]], [" ", []], ["جيل", ["G1074"]], [" ", []], ["منحرف", ["G4646"]], [" ", []], ["فاسد", ["G1294"]], ["، ", []], ["تضيئون", ["G5316"]], [" بينهم ", []], ["كأنوار", ["G5458"]], [" في ", []], ["العالم", ["G2889"]], ["،", []]]}, {"c": 2, "v": 16, "text": "حاملين كلمة الحياة، لتكونوا في يوم المسيح موضع فخر بأني ما سعيت باطلا ولا اجتهدت عبثا.", "groups": [{"kw": "Holding", "raw": "Phi_1:27; Psa_40:9, Psa_71:17; Mat_10:27; Luk_12:8; Rom_10:8-16; Rev_22:17", "note": "", "refs": [{"l": "Phi 1:27", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"]]}, {"l": "Psa 40:9", "n": "", "vs": [[9, "أعلنت برك وسط جماعة شعبك العظيم، وأنت يارب علمت أنني لم ألجم شفتي."]]}, {"l": "Psa 71:17", "n": "", "vs": [[17, "قد علمتني ياالله منذ صباي، فلم أكف لحظة عن إعلان عجائبك."]]}, {"l": "Mat 10:27", "n": "", "vs": [[27, "ما أقوله لكم في الظلام، قولوه في النور؛ وما تسمعونه همسا، نادوا به على السطوح."]]}, {"l": "Luk 12:8", "n": "", "vs": [[8, "«ولكن أقول لكم: كل من يعترف بي أمام الناس، يعترف به ابن الإنسان أيضا أمام ملائكة الله."]]}, {"l": "Rom 10:8-16", "n": "", "vs": [[8, "فماذا يقول إذا؟ إنه يقول: «إن الكلمة قريبة منك. إنها في فمك وفي قلبك!» وما هذه الكلمة إلا كلمة الإيمان التي نبشر بها:"], [9, "أنك إن اعترفت بفمك بيسوع ربا، وآمنت في قلبك بأن الله أقامه من الأموات، نلت الخلاص."], [10, "فإن الإيمان في القلب يؤدي إلى البر، والاعتراف بالفم يؤيد الخلاص،"], [11, "لأن الكتاب يقول: «كل من هو مؤمن به، لا يخيب»."], [12, "فلا فرق بين اليهودي واليوناني، لأن للجميع ربا واحدا، غنيا تجاه كل من يدعوه»."], [13, "«فإن كل من يدعو باسم الرب يخلص»."], [14, "ولكن، كيف يدعون من لم يؤمنوا به؟ وكيف يؤمنون بمن لم يسمعوا به؟ وكيف يسمعون بلا مبشر؟"], [15, "وكيف يبشر أحد إلا إذا كان قد أرسل؟ كما قد كتب: «ما أجمل أقدام المبشرين بالخيرات!»"], [16, "ولكن، ليس كلهم أطاعوا الإنجيل. فإن إشعياء يقول: «يارب! من صدق ما أسمعناه إياه؟»"]]}, {"l": "Rev 22:17", "n": "", "vs": [[17, "الروح والعروس يقولان: «تعال!» ومن يسمع فليردد النداء: «تعال!»"]]}], "kwAr": "حاملين", "noteAr": ""}, {"kw": "the word", "raw": "Joh_6:63, Joh_6:68; Act_13:26; 2Ti_2:15-17; Heb_4:12; 1Pe_1:23; 1Jo_1:1", "note": "", "refs": [{"l": "Joh 6:63", "n": "", "vs": [[63, "الروح هو الذي يعطي الحياة، أما الجسد فلا يفيد شيئا. الكلام الذي كلمتكم به هو روح وحيا ة."]]}, {"l": "Joh 6:68", "n": "", "vs": [[68, "فأجابه سمعان بطرس: «إلى من نذهب يار ب وعندك كلام الحياة الأبدية."]]}, {"l": "Act 13:26", "n": "", "vs": [[26, "أيها الإخوة، يابني جنس إبراهيم، ويا كل من يتقي الله من الحاضرين هنا: إلينا أرسل الله كلمة هذا الخلاص!"]]}, {"l": "2Ti 2:15-17", "n": "", "vs": [[15, "اجتهد أن تقدم نفسك لله فائزا في الامتحان، عاملا ليس عليه ما يدعو للخجل، مفصلا كلمة الحق باستقامة."], [16, "أما الأحاديث الباطلة الدنسة، فتجنبها؛ فإن المنصرفين إليها يتقدمون إلى فجور أفظع،"], [17, "وكلامهم ينهش كالآكلة، ومنهم هيمنايوس وفيليتوس،"]]}, {"l": "Heb 4:12", "n": "", "vs": [[12, "ذلك لأن كلمة الله حية، وفعاله، وأمضى من كل سيف له حدان، وخارقة إلى مفترق النفس والروح والمفاصل ونخاع العظام، وقادرة أن تميز أفكار القلب ونياته."]]}, {"l": "1Pe 1:23", "n": "", "vs": [[23, "فأنتم قد ولدتم ولادة ثانية لا من زرع بشري يفنى، بل مما لا يفنى: بكلمة الله الحية الباقية إلى الأبد."]]}, {"l": "1Jo 1:1", "n": "", "vs": [[1, "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."]]}], "kwAr": "كلمة الحياة", "noteAr": ""}, {"kw": "that I may", "raw": "Phi_1:26; 2Co_1:14; 1Th_2:19", "note": "", "refs": [{"l": "Phi 1:26", "n": "", "vs": [[26, "ليزداد بسببي افتخاركم بالمسيح بحضوري بينكم من جديد."]]}, {"l": "2Co 1:14", "n": "", "vs": [[14, "كما قد فهمتمونا فهما جزئيا، أننا سنكون فخرا لكم، مثلما أنتم فخر لنا، في يوم ربنا يسوع."]]}, {"l": "1Th 2:19", "n": "", "vs": [[19, "فما هو رجاؤنا أو فرحنا أو إكليل افتخارنا أمام ربنا يسوع عند عودته؟ أليس أنتم؟ بلى،"]]}], "kwAr": "موضع فخر", "noteAr": ""}, {"kw": "that I have", "raw": "Isa_49:4; 1Co_9:26; Gal_2:2, Gal_4:11; 1Th_3:5", "note": "", "refs": [{"l": "Isa 49:4", "n": "", "vs": [[4, "ولكنني أجبت: لقد تعبت باطلا. وأفنيت قوتي سدى وعبثا. غير أن حقي محفوظ عند الرب، ومكافأتي عند إلهي."]]}, {"l": "1Co 9:26", "n": "", "vs": [[26, "إذن، أنا أركض هكذا، لا كمن لا هدف له، وهكذا ألاكم أيضا، لا كمن يلطم الهواء،"]]}, {"l": "Gal 2:2", "n": "", "vs": [[2, "وإنما صعدت إليها استجابة للوحي؛ وبسطت أمامهم الإنجيل الذي أبشر به بين الأمم، ولكن على انفراد أمام البارزين فيهم، لئلا يكون مسعاي في الحاضر والماضي بلا جدوى."]]}, {"l": "Gal 4:11", "n": "", "vs": [[11, "أخاف عليكم، خشية أن أكون قد تعبت من أجلكم بلا جدوى."]]}, {"l": "1Th 3:5", "n": "", "vs": [[5, "ولهذا أيضا، إذ صار الافتراق عنكم لا يحتمل، أرسلت أستخبر عن إيمانكم لئلا يكون المجرب قد جربكم فيذهب جهدنا سدى!"]]}], "kwAr": "ما سعيت باطلا", "noteAr": ""}], "arS": [["حاملين", ["G1907"]], [" ", []], ["كلمة", ["G3056"]], [" ", []], ["الحياة", ["G2222"]], ["، لتكونوا في ", []], ["يوم", ["G2250"]], [" ", []], ["المسيح", ["G5547"]], [" موضع ", []], ["فخر", ["G2745"]], [" بأني ما ", []], ["سعيت", ["G5143"]], [" ", []], ["باطلا", ["G2756"]], [" ولا ", []], ["اجتهدت", ["G2872"]], [" ", []], ["عبثا", ["G2756"]], [".", []]]}, {"c": 2, "v": 17, "text": "حتى لو سفك دمي سكيبا فوق ذبيحة إيمانكم وخدمته، فإني أفرح وأبتهج معكم جميعا.", "groups": [{"kw": "and if", "raw": "Phi_2:30, Phi_1:20; Act_20:24, Act_21:13; 2Co_12:15; 1Th_2:8; 2Ti_4:6; 1Jo_3:16", "note": "", "refs": [{"l": "Phi 2:30", "n": "", "vs": [[30, "فإنه من أجل عمل المسيح أشرف على الموت، مخاطرا بحياته ليسد ما نقص من خدمتكم لي."]]}, {"l": "Phi 1:20", "n": "", "vs": [[20, "وفقا لما أتوقعه وأرجوه: أني لن أفشل في شيء، بل في كل جرأة وكما في كل حين فكذلك الآن أيضا، يتعظم المسيح في جسدي، سواء أكان بالحياة أم بالموت."]]}, {"l": "Act 20:24", "n": "", "vs": [[24, "ولكني لا أحسب لحياتي أية قيمة، ما دمت أسعى إلى بلوغ غايتي وإتمام الخدمة التي كلفني إياها الرب يسوع: أن أشهد ببشارة نعمة الله."]]}, {"l": "Act 21:13", "n": "", "vs": [[13, "ولكنه قال لنا: «ما لكم تبكون وتحطمون قلبي؟ إني مستعد ليس فقط لأن أقيد في أورشليم، بل أيضا لأن أموت من أجل اسم الرب يسوع!»"]]}, {"l": "2Co 12:15", "n": "", "vs": [[15, "وأنا، بكل سرور، أنفق ما عندي، بل أنفق نفسي لأجل أنفسكم، وإن كنت كلما زادت محبتي ألقى حبا أقل."]]}, {"l": "1Th 2:8", "n": "", "vs": [[8, "وإذ كان حنونا عليكم شديدا، ارتضينا أن نقدم إليكم لا إنجيل الله فقط بل أنفسنا أيضا، لأنكم صرتم محبوبين لدينا."]]}, {"l": "2Ti 4:6", "n": "", "vs": [[6, "وأما أنا، فها إن حياتي بدأت تسكب سكيبا، وموعد رحيلي قد اقترب."]]}, {"l": "1Jo 3:16", "n": "", "vs": [[16, "ومقياس المحبة هو العمل الذي قام به المسيح إذ بذل حياته لأجلنا. فعلينا نحن أيضا أن نبذل حياتنا لأجل إخوتنا."]]}], "kwAr": "حتى لو", "noteAr": ""}, {"kw": "offered", "raw": "Gr. poured forth", "note": "Gr. poured forth", "refs": [], "kwAr": "سفك دمي سكيبا", "noteAr": "في اليونانية: سُكب."}, {"kw": "the sacrifice", "raw": "Phi_4:18; Rom_12:1, Rom_15:16; Heb_13:15, Heb_13:16; 1Pe_2:5", "note": "", "refs": [{"l": "Phi 4:18", "n": "", "vs": [[18, "فالآن عندي كل ما يسد حاجتي ويزيد عنها. أنا في بحبوحة إذ تسلمت من أبفروديتس ما بعثتم به إلي، عطرا طيب الرائحة، ذبيحة يقبلها الله ويسر بها."]]}, {"l": "Rom 12:1", "n": "", "vs": [[1, "لذلك أتوسل إليكم أيها الإخوة، نظرا لمراحم الله، أن تقدموا له أجسادكم ذبيحة مقدسة مقبولة عنده، وهي عبادتكم بعقل."]]}, {"l": "Rom 15:16", "n": "", "vs": [[16, "وبذلك أكون خادم المسيح يسوع، المرسل إلى الأمم، حاملا إنجيل الله وكأني أقوم بخدمة كهنوتية، بقصد أن ترفع لله من بين الأمم تقدمة تكون مقبولة ومقدسة بالروح القدس."]]}, {"l": "Heb 13:15", "n": "", "vs": [[15, "فبالمسيح، رئيس كهنتنا، لنقرب لله دائما ذبيحة الحمد والتسبيح، أي الثمار التي تنتجها أفواهنا المعترفة باسمه."]]}, {"l": "Heb 13:16", "n": "", "vs": [[16, "ولا تغفلوا أيضا عن عمل الخير وإعانة المحتاجين: لأن مثل هذه «الذبائح» تسر الله جدا!"]]}, {"l": "1Pe 2:5", "n": "", "vs": [[5, "إذن اتحدوا به كحجارة حية، مبنيين بيتا روحيا، تكونون فيه كهنة مقدسين تقدمون لله ذبائح روحية مقبولة لديه بفضل يسوع المسيح."]]}], "kwAr": "فوق ذبيحة إيمانكم", "noteAr": ""}, {"kw": "I joy", "raw": "2Co_7:4; Col_1:24; 1Th_3:7-9", "note": "", "refs": [{"l": "2Co 7:4", "n": "", "vs": [[4, "كبيرة ثقتي بكم، وعظيم افتخاري بكم. إني ممتليء تشجيعا وفائض فرحا في جميع ضيقاتنا."]]}, {"l": "Col 1:24", "n": "", "vs": [[24, "والآن أنا أفرح في الآلام التي أقاسيها لأجلكم، وأتمم في جسدي ما نقص من ضيقات المسيح لأجل جسده الذي هو الكنيسة،"]]}, {"l": "1Th 3:7-9", "n": "", "vs": [[7, "فقد وجدنا بكم أيها الإخوة عزاء في وسط ضيقتنا وشدتنا من جهة إيمانكم."], [8, "فقد طابت لنا الحياة مادمتم ثابتين في الرب!"], [9, "فأي شكر نستطيع أن نؤديه إلى الله عوضا عنكم من أجل كل ما نبتهج به من الفرح بسببكم أمام إلهنا،"]]}], "kwAr": "فإني أفرح", "noteAr": ""}], "arS": [["حتى لو ", []], ["سفك دمي سكيبا", ["G4689"]], [" فوق ", []], ["ذبيحة", ["G2378"]], [" ", []], ["إيمانكم", ["G4102", "G5216"]], [" ", []], ["وخدمته", ["G3009"]], ["، فإني ", []], ["أفرح", ["G5463"]], [" ", []], ["وأبتهج", ["G4796"]], [" معكم ", []], ["جميعا", ["G3956"]], [".", []]]}, {"c": 2, "v": 18, "text": "هكذا أيضا افرحوا أنتم، وابتهجوا معي.", "groups": [{"kw": "do", "raw": "Phi_3:1, Phi_4:4; Eph_3:13; Jam_1:2-4", "note": "", "refs": [{"l": "Phi 3:1", "n": "", "vs": [[1, "وبعد، ياإخوتي، افرحوا في الرب. لا يزعجني أن أكتب إليكم بالأمور نفسها، فإن ذلك يجعلكم في مأمن."]]}, {"l": "Phi 4:4", "n": "", "vs": [[4, "افرحوا في الرب دائما، وأقول أيضا: افرحوا."]]}, {"l": "Eph 3:13", "n": "", "vs": [[13, "فلذلك أطلب إليكم ألا يفتر عزمكم بسبب الضيقات التي أقاسيها لأجلكم، فهي مفخرة لكم."]]}, {"l": "Jam 1:2-4", "n": "", "vs": [[2, "ياإخوتي، عندما تنزل بكم التجارب والمحن المختلفة، اعتبروها سبيلا إلى الفرح الكلي."], [3, "وكونوا على ثقة بأن امتحان إيمانكم هذا ينتج صبرا."], [4, "ودعوا الصبر يعمل عمله الكامل فيكم، لكي يكتمل نضوجكم وتصيروا أقوياء قادرين على مواجهة جميع الأحوال."]]}], "kwAr": "افرحوا أنتم", "noteAr": ""}], "arS": [["هكذا أيضا ", []], ["افرحوا", ["G5463"]], [" أنتم، ", []], ["وابتهجوا", ["G4796"]], [" معي.", []]]}, {"c": 2, "v": 19, "text": "غير أني أرجو في الرب يسوع أن أرسل إليكم تيموثاوس عن قريب، لكي تطيب نفسي بمعرفة أحوالكم.", "groups": [{"kw": "But", "raw": "or, Moreover, Phi_2:24; Jer_17:5; Mat_12:21; Rom_15:12; Eph_1:13; 2Ti_1:12 *marg. Jam_4:15; 1Pe_1:21", "note": "or, Moreover, Phi_2:24; Jer_17:5; Mat_12:21; Rom_15:12; Eph_1:13; 2Ti_1:12 *marg. Jam_4:15; 1Pe_1:21", "refs": [{"l": "Phi 2:24", "n": "", "vs": [[24, "ولكن لي ثقة في الرب بأني، أنا نفسي، سآتي إليكم عن قريب."]]}, {"l": "Jer 17:5", "n": "", "vs": [[5, "وهذا ما يقوله الرب: «ليكن ملعونا كل من يتوكل على بشر، ويتخذ من الناس ذراع قوة له، ويحول قلبه عن الرب."]]}, {"l": "Mat 12:21", "n": "", "vs": [[21, "وعلى اسمه تعلق الأمم رجاءها! »"]]}, {"l": "Rom 15:12", "n": "", "vs": [[12, "ويقول إشعياء أيضا: «سيطلع أصل يسى، والقائم، ليسود على الأمم: عليه تعلق الشعوب الرجاء»."]]}, {"l": "Eph 1:13", "n": "", "vs": [[13, "وفيه أنتم أيضا (وضعتم رجاءكم) إذ سمعتم كلمة الحق، أي الإنجيل الذي فيه خلاصكم؛ كذلك فيه أيضا ختمتم، إذ آمنتم، بالروح القدس الموعود،"]]}, {"l": "2Ti 1:12", "n": "*marg.", "vs": [[12, "من أجل ذلك أيضا أقاسي الآن هذه الآلام، ولكني لست أخجل، لأنني أعرف من أنا مؤمن به، ولي تمام الثقة بأنه قادر أن يحفظ لي الأمانة التي أودعتها عنده سالمة إلى ذلك اليوم."]]}, {"l": "Jam 4:15", "n": "", "vs": [[15, "بدلا من ذلك، كان يجب أن تقولوا: «إن شاء الرب، نعيش ونعمل هذا الأمر أو ذاك!»"]]}, {"l": "1Pe 1:21", "n": "", "vs": [[21, "أنتم الذين تؤمنون بالله بالمسيح الذي أقامه من الموت وأعطاه المجد، حتى يكون الله غاية إيمانكم ورجائكم."]]}], "kwAr": "غير أني أرجو", "noteAr": "أو: علاوة على ذلك."}, {"kw": "to send", "raw": "Phi_2:23, Phi_2:25, Phi_1:1; Rom_16:21; 1Co_4:17; Eph_6:21, Eph_6:22; Col_4:8, Col_4:9; 1Th_3:2, 1Th_3:6", "note": "", "refs": [{"l": "Phi 2:23", "n": "", "vs": [[23, "فإياه أرجو أن أرسل حالما يتبين لي كيف ستجري أحوالي."]]}, {"l": "Phi 2:25", "n": "", "vs": [[25, "إلا أني رأيت من الضروري أن أرسل إليكم أبفروديتس، أخي ومعاوني ورفيقي في التجند، والمرسل من قبلكم عاملا على سد حاجتي،"]]}, {"l": "Phi 1:1", "n": "", "vs": [[1, "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."]]}, {"l": "Rom 16:21", "n": "", "vs": [[21, "يسلم عليكم تيموثاوس معاوني، ولوكيوس وياسون وسوسيباترس أقربائي."]]}, {"l": "1Co 4:17", "n": "", "vs": [[17, "لهذا السبب عينه أرسلت إليكم تيموثاوس، ابني الحبيب الأمين في الرب، فهو يذكركم بطرقي في السلوك في المسيح كما أعلم بها في كل مكان في جميع الكنائس."]]}, {"l": "Eph 6:21", "n": "", "vs": [[21, "ولكي تعرفوا أحوالي وأخبار عملي، فإن تيخيكس، الأخ الحبيب والخادم الأمين في الرب، يخبركم بها جميعا."]]}, {"l": "Eph 6:22", "n": "", "vs": [[22, "وقد أرسلته إليكم لهذا الأمر بعينه: لتعرفوا أحوالي فتتشجع قلوبكم."]]}, {"l": "Col 4:8", "n": "", "vs": [[8, "فإياه قد أرسلت إليكم لهذا الغرض عينه، لتعرفوا أحوالنا ويشجع قلوبكم،"]]}, {"l": "Col 4:9", "n": "", "vs": [[9, "يرافقه أونسيموس، الأخ الأمين الحبيب الذي هو من عندكم. فهما يطلعانكم على أحوالنا هنا."]]}, {"l": "1Th 3:2", "n": "", "vs": [[2, "فبعثنا تيموثاوس، أخانا ومعاوننا في خدمة الله بنشر الإنجيل، لكي يشددكم ويشجعكم في إيمانكم،"]]}, {"l": "1Th 3:6", "n": "", "vs": [[6, "أما الآن، وقد عاد تيموثاوس إلينا من عندكم وبشرنا بما لكم من إيمان ومحبة، وبأنكم تذكروننا ذكرا حسنا في كل حين، وتشتاقون كثيرا لرؤيتنا كما نشتاق نحن لرؤيتكم،"]]}], "kwAr": "أن أرسل إليكم تيموثاوس", "noteAr": ""}, {"kw": "that I", "raw": "Phi_2:28; 1Th_3:6-8; 2Th_1:3; Phm_1:5-7; 3Jo_1:3, 3Jo_1:4", "note": "", "refs": [{"l": "Phi 2:28", "n": "", "vs": [[28, "لذلك عجلت كثيرا في إرساله إليكم، حتى إذا رأيتموه من جديد تفرحون أنتم وأكون أنا أقل حزنا."]]}, {"l": "1Th 3:6-8", "n": "", "vs": [[6, "أما الآن، وقد عاد تيموثاوس إلينا من عندكم وبشرنا بما لكم من إيمان ومحبة، وبأنكم تذكروننا ذكرا حسنا في كل حين، وتشتاقون كثيرا لرؤيتنا كما نشتاق نحن لرؤيتكم،"], [7, "فقد وجدنا بكم أيها الإخوة عزاء في وسط ضيقتنا وشدتنا من جهة إيمانكم."], [8, "فقد طابت لنا الحياة مادمتم ثابتين في الرب!"]]}, {"l": "2Th 1:3", "n": "", "vs": [[3, "من واجبنا أن نشكر الله على الدوام لأجلكم أيها الإخوة. كما أن هذا حق: لأن إيمانكم ينمو نموا فائقا، ومحبة أحدكم للآخر تفيض بينكم جميعا."]]}, {"l": "Phm 1:5-7", "n": "", "vs": [[5, "وقد سمعت بما لك من محبة وأمانة من نحو الرب يسوع، ومن نحو جميع القديسين،"], [6, "طالبا أن يكون اشتراكك معنا في الإيمان فعالا، فتدرك إلى التمام ما فينا من كل صلاح لأجل المسيح."], [7, "فقد كان لي أيها الأخ، سرور عظيم وتشجيع، بفضل محبتك، لأن عواطف القديسين قد انتعشت بفضلك!"]]}, {"l": "3Jo 1:3", "n": "", "vs": [[3, "فكم كان فرحي عظيما عندما مر بي بعض الإخوة المسافرين وأخبروني أنك تسلك بحسب الحق، وشهدوا للحق الثابت فيك!"]]}, {"l": "3Jo 1:4", "n": "", "vs": [[4, "وما أعظم الفرح الذي يغمر قلبي حين أسمع الأخبار الطيبة التي تؤكد أن أولادي يسلكون بحسب الحق!"]]}], "kwAr": "لكي تطيب نفسي", "noteAr": ""}], "arS": [["غير أني ", []], ["أرجو", ["G1679"]], [" في ", []], ["الرب", ["G2962"]], [" ", []], ["يسوع", ["G2424"]], [" أن ", []], ["أرسل", ["G3992"]], [" إليكم ", []], ["تيموثاوس", ["G5095"]], [" عن ", []], ["قريب", ["G5030"]], ["، لكي ", []], ["تطيب نفسي", ["G2174"]], [" ", []], ["بمعرفة", ["G1097"]], [" ", []], ["أحوالكم", ["G4012", "G5216"]], [".", []]]}, {"c": 2, "v": 20, "text": "فليس عندي أحد غيره يهتم مثلي بأحوالكم بإخلاص.", "groups": [{"kw": "I have", "raw": "Phi_2:2, Phi_2:22; Psa_55:13; Pro_31:29; Joh_10:13, Joh_12:6; 1Co_1:10,1Co_1:11; Col_4:11; 1Ti_1:2; 2Ti_1:5", "note": "", "refs": [{"l": "Phi 2:2", "n": "", "vs": [[2, "فتمموا فرحي بأن يكون لكم رأي واحد ومحبة واحدة ونفس واحدة وفكر واحد."]]}, {"l": "Phi 2:22", "n": "", "vs": [[22, "أما تيموثاوس، فأنتم تعرفون أنه مختبر، إذ خدم معي في التبشير بالإنجيل كأنه ولد يعاون أباه."]]}, {"l": "Psa 55:13", "n": "", "vs": [[13, "ولكنك عديلي، وإلفي وصديقي الحميم،"]]}, {"l": "Pro 31:29", "n": "", "vs": [[29, "«نساء كثيرات قمن بأعمال جليلة، ولكنك تفوقت عليهن جميعا»."]]}, {"l": "Joh 10:13", "n": "", "vs": [[13, "إنه يهرب لأنه أجير ولا يبالي بالخراف!"]]}, {"l": "Joh 12:6", "n": "", "vs": [[6, "ولم يقل هذا لأنه كان يعطف على الفقراء، بل لأنه كان لصا، فقد كان أمينا للصندوق وكان يختلس مما يودع فيه."]]}, {"l": "1Co 1:10", "n": "", "vs": [[10, "على أنني أيها الإخوة، أتوسل إليكم باسم ربنا يسوع المسيح أن يكون لجميعكم صوت واحد وأن لا يكون بينكم أي انقسام. وإنما كونوا جميعا موحدي الفكر والرأي."]]}, {"l": "1Co 1:11", "n": "", "vs": [[11, "فقد بلغني عنكم، ياإخوتي، على لسان عائلة خلوي، أن بينكم خلافات."]]}, {"l": "Col 4:11", "n": "", "vs": [[11, "ويسوع المعروف باسم يسطس. هؤلاء جميعا من أهل الختان، وهم وحدهم معاوني لأجل ملكوت الله، وقد كانوا لي عزاء."]]}, {"l": "1Ti 1:2", "n": "", "vs": [[2, "إلى تيموثاوس ولدي الحقيقي في الإيمان. لتكن لك النعمة والرحمة والسلام من الله أبينا والمسيح يسوع ربنا!"]]}, {"l": "2Ti 1:5", "n": "", "vs": [[5, "كما أستذكر إيمانك الخالي من الرياء، هذا الإيمان الذي فيك والذي حل أولا في جدتك لوئيس ثم في أمك أفنيكي، وأنا متأكد أنه حال فيك أيضا."]]}], "kwAr": "فليس عندي أحد", "noteAr": ""}, {"kw": "likeminded", "raw": "or, so dear unto me, 1Sa_18:1, 1Sa_18:3", "note": "or, so dear unto me, 1Sa_18:1, 1Sa_18:3", "refs": [{"l": "1Sa 18:1", "n": "", "vs": [[1, "وعندما فرغ داود من حديثه مع شاول، تعلقت نفس يوناثان بداود وأحبه كنفسه."]]}, {"l": "1Sa 18:3", "n": "", "vs": [[3, "وتعاهد يوناثان وداود، لأن يوناثان أحبه كنفسه."]]}], "kwAr": "يهتم مثلي", "noteAr": "أو: عزيز عليّ هكذا (كنفسي)."}], "arS": [["فليس عندي ", []], ["أحد", ["G3762"]], [" غيره ", []], ["يهتم", ["G3309"]], [" ", []], ["مثلي", ["G2473"]], [" ", []], ["بأحوالكم", ["G4012", "G5216"]], [" ", []], ["بإخلاص", ["G1104"]], [".", []]]}, {"c": 2, "v": 21, "text": "فإن الجميع يسعون وراء مصالحهم الخاصة، لا لأجل المسيح يسوع.", "groups": [{"kw": "all", "raw": "Phi_2:4; Isa_56:11; Mal_1:10; Mat_16:24; Luk_9:57-62, Luk_14:26; Act_13:13, Act_15:38; 1Co_10:24, 1Co_10:33, 1Co_13:5; 2Ti_1:15, 2Ti_3:2, 2Ti_4:10,2Ti_4:16", "note": "", "refs": [{"l": "Phi 2:4", "n": "", "vs": [[4, "مهتما لا بمصلحته الخاصة بل بمصالح الآخرين أيضا."]]}, {"l": "Isa 56:11", "n": "", "vs": [[11, "هم كلاب نهمة لا تعرف الشبع، ورعاة أيضا مجردون من الفهم، كل مال إلى طريقه طمعا في الربح،"]]}, {"l": "Mal 1:10", "n": "", "vs": [[10, "آه، ياليت بينكم من يغلق أبواب الهيكل لئلا توقدوا نارا باطلة على مذبحي، يقول الرب القدير: إذ لا مسرة لي بكم ولا أرضى بتقدمة من أيديكم."]]}, {"l": "Mat 16:24", "n": "", "vs": [[24, "ثم قال يسوع لتلاميذه: «إن أراد أحد أن يسير ورائي، فلينكر نفسه ويحمل صليبه ويتبعني."]]}, {"l": "Luk 9:57-62", "n": "", "vs": [[57, "وبينما كانوا سائرين في الطريق، قال له أحد الناس: «ياسيد، سأتبعك أينما تذهب!»"], [58, "فقال له يسوع: «للثعالب أوجار، ولطيور السماء أوكار؛ وأما ابن الإنسان فليس له مكان يسند إليه رأسه»."], [59, "وقال لغيره: «اتبعني!» ولكن هذا قال: «ياسيد، اسمح لي أن أذهب أولا وأدفن أبي!»"], [60, "فقال له يسوع: «دع الموتى يدفنون موتاهم، وأما أنت فاذهب وبشر بملكوت الله»."], [61, "وقال له آخر: «ياسيد، سأتبعك، ولكن اسمح لي أولا أن أودع أهل بيتي!»"], [62, "فقال له يسوع: «ما من أحد يضع يده على المحراث ويلتفت إلى الوراء، يصلح لملكوت الله»."]]}, {"l": "Luk 14:26", "n": "", "vs": [[26, "«إن جاء إلي أحد، ولم يبغض أباه وأمه وزوجته وأولاده وإخوته وأخواته، بل نفسه أيضا، فلا يمكنه أن يكون تلميذا لي."]]}, {"l": "Act 13:13", "n": "", "vs": [[13, "وأبحر بولس ورفيقاه من بافوس إلى برجة في بمفيلية. وهناك فارق يوحنا بولس وبرنابا ورجع إلى أورشليم."]]}, {"l": "Act 15:38", "n": "", "vs": [[38, "ولكن بولس رفض أن يأخذاه معهما، لأنه كان قد فارقهما في بمفيلية، ولم يرافقهما في الخدمة."]]}, {"l": "1Co 10:24", "n": "", "vs": [[24, "فلا يسع أحد إلى مصلحة نفسه، بل إلى مصلحة غيره!"]]}, {"l": "1Co 10:33", "n": "", "vs": [[33, "فهكذا أنا أيضا أسعى لإرضاء الجميع في كل شيء، ولا أهتم بمصلحتي الخاصة، بل بمصلحة الكثيرين، لكي يخلصوا."]]}, {"l": "1Co 13:5", "n": "", "vs": [[5, "لا تتصرف بغير لياقة، ولا تسعى إلى مصلحتها الخاصة. لا تستفز سريعا، ولا تنسب الشر لأحد."]]}, {"l": "2Ti 1:15", "n": "", "vs": [[15, "أنت على علم بأن معاوني الذين في مقاطعة أسيا، ومنهم فيجلس وهرموجينس، قد تخلوا عني."]]}, {"l": "2Ti 3:2", "n": "", "vs": [[2, "إذ يكون الناس محبين لأنفسهم، محبين للمال، متكبرين، مباهين بأنفسهم، شتامين، غير مطيعين لوالديهم، ناكرين للجميل، دنسين،"]]}, {"l": "2Ti 4:10", "n": "", "vs": [[10, "لأن ديماس، إذ أحب الحياة الحاضرة، تركني وذهب إلى مدينة تسالونيكي. أما كريسكيس، فقد ذهب إلى مقاطعة غلاطية، وتيطس إلى دلماطية"]]}, {"l": "2Ti 4:16", "n": "", "vs": [[16, "عندما دافعت عن نفسي في محاكمتي أول مرة، لم يقف أحد بجانبي، بل تركني الجميع، لا حاسبهم الله على ذلك!"]]}], "kwAr": "الجميع يسعون وراء مصالحهم", "noteAr": ""}, {"kw": "the", "raw": "Phi_1:20,Phi_1:21; 2Co_1:5, 2Co_5:14, 2Co_5:15", "note": "", "refs": [{"l": "Phi 1:20", "n": "", "vs": [[20, "وفقا لما أتوقعه وأرجوه: أني لن أفشل في شيء، بل في كل جرأة وكما في كل حين فكذلك الآن أيضا، يتعظم المسيح في جسدي، سواء أكان بالحياة أم بالموت."]]}, {"l": "Phi 1:21", "n": "", "vs": [[21, "فالحياة عندي هي المسيح، والموت ربح لي."]]}, {"l": "2Co 1:5", "n": "", "vs": [[5, "فكما فاضت علينا آلام المسيح، يفيض علينا أيضا التشجيع بالمسيح."]]}, {"l": "2Co 5:14", "n": "", "vs": [[14, "فإن محبة المسيح تسيطر علينا، وقد حكمنا بهذا: مادام واحد قد مات عوضا عن الجميع، فمعنى ذلك أن الجميع ماتوا؛"]]}, {"l": "2Co 5:15", "n": "", "vs": [[15, "وهو قد مات عوضا عن الجميع حتى لا يعيش الأحياء في ما بعد لأنفسهم بل للذي مات عوضا عنهم ثم قام."]]}], "kwAr": "لا لأجل المسيح يسوع", "noteAr": ""}], "arS": [["فإن ", []], ["الجميع", ["G3956"]], [" ", []], ["يسعون", ["G2212"]], [" وراء ", []], ["مصالحهم", ["G1438"]], [" الخاصة، لا لأجل ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [".", []]]}, {"c": 2, "v": 22, "text": "أما تيموثاوس، فأنتم تعرفون أنه مختبر، إذ خدم معي في التبشير بالإنجيل كأنه ولد يعاون أباه.", "groups": [{"kw": "ye", "raw": "Act_16:3-12; 2Co_2:9, 2Co_8:8, 2Co_8:22, 2Co_8:24", "note": "", "refs": [{"l": "Act 16:3-12", "n": "", "vs": [[3, "فأحب بولس أن يصحبه في التبشير. ولأن يهود تلك المنطقة كانوا يعرفون أن أباه يوناني، فقد أخذه بولس وختنه."], [4, "وأخذ بولس ورفاقه ينتقلون من مدينة إلى أخرى، يبلغون المؤمنين التوصيات التي أقرها الرسل والشيوخ في أورشليم، لكي يعملوا بها."], [5, "فكانت الكنائس تتقوى في الإيمان، ويزداد عددها يوما بعد يوم."], [6, "ومنعهم الروح القدس من التبشير في مقاطعة أسيا، فسافروا في مقاطعتي فريجية وغلاطية."], [7, "ولما وصلوا حدود مقاطعة ميسيا، اتجهوا نحو مقاطعة بيثينية، ولكن روح يسوع لم يسمح لهم بالدخول إليها،"], [8, "فتوجهوا إلى مدينة ترواس مرورا بميسيا."], [9, "وفي تلك الليلة رأى بولس في رؤيا رجلا من أهل مقدونية يتوسل إليه ويقول: «اعبر إلى مقدونية وأنجدنا!»"], [10, "عندئذ تأكدنا أن الرب دعانا للتبشير في مقدونية. فاتجهنا إليها في الحال."], [11, "فأبحرنا من ميناء ترواس إلى جزيرة ساموثراكي. وفي اليوم التالي تابعنا السفر إلى ميناء نيابوليس،"], [12, "ومنها إلى مدينة فيلبي، وهي كبرى مدن مقاطعة مقدونية، ومستعمرة للرومان. فبقينا فيها بضعة أيام."]]}, {"l": "2Co 2:9", "n": "", "vs": [[9, "وقد كان ما كتبته إليكم بهدف اختباركم أيضا، لأعرف مدى طاعتكم في كل شيء."]]}, {"l": "2Co 8:8", "n": "", "vs": [[8, "لا أقول هذا على سبيل الأمر، بل اختبارا لصدق محبتكم بحماسة الآخرين."]]}, {"l": "2Co 8:22", "n": "", "vs": [[22, "وأرسلنا معهما أخانا الذي تبين لنا بالاختبار مرة بعد مرة، أن له حماسة شديدة في أمور كثيرة، وهو الآن أوفر جدا في الحماسة بسبب ثقته العظيمة بكم."]]}, {"l": "2Co 8:24", "n": "", "vs": [[24, "فأثبتوا لهم إذن أمام الكنائس برهان محبتكم وصواب افتخارنا بكم."]]}], "kwAr": "فأنتم تعرفون أنه مختبر", "noteAr": ""}, {"kw": "as", "raw": "Phi_2:20; 1Co_4:17; 1Ti_1:2, 1Ti_1:18; 2Ti_1:2; Tit_1:4", "note": "", "refs": [{"l": "Phi 2:20", "n": "", "vs": [[20, "فليس عندي أحد غيره يهتم مثلي بأحوالكم بإخلاص."]]}, {"l": "1Co 4:17", "n": "", "vs": [[17, "لهذا السبب عينه أرسلت إليكم تيموثاوس، ابني الحبيب الأمين في الرب، فهو يذكركم بطرقي في السلوك في المسيح كما أعلم بها في كل مكان في جميع الكنائس."]]}, {"l": "1Ti 1:2", "n": "", "vs": [[2, "إلى تيموثاوس ولدي الحقيقي في الإيمان. لتكن لك النعمة والرحمة والسلام من الله أبينا والمسيح يسوع ربنا!"]]}, {"l": "1Ti 1:18", "n": "", "vs": [[18, "هذه التوصيات، ياتيموثاوس ولدي، أسلمها لك، بمقتضى النبوآت السابقة المختصة بك، وغايتي أن تحسن الجهاد في حربك الروحية،"]]}, {"l": "2Ti 1:2", "n": "", "vs": [[2, "إلى تيموثاوس، ولدي الحبيب لتكن لك النعمة والرحمة والسلام من الله الآب والمسيح يسوع ربنا."]]}, {"l": "Tit 1:4", "n": "", "vs": [[4, "إلى تيطس، ولدي الحقيقي بالنسبة إلى الإيمان المشترك بيننا."]]}], "kwAr": "كأنه ولد يعاون أباه", "noteAr": ""}], "arS": [["أما تيموثاوس، فأنتم ", []], ["تعرفون", ["G1097"]], [" أنه ", []], ["مختبر", ["G1382"]], ["، إذ ", []], ["خدم", ["G1398"]], [" معي في التبشير ", []], ["بالإنجيل", ["G2098"]], [" كأنه ", []], ["ولد", ["G5043"]], [" يعاون ", []], ["أباه", ["G3962"]], [".", []]]}, {"c": 2, "v": 23, "text": "فإياه أرجو أن أرسل حالما يتبين لي كيف ستجري أحوالي.", "groups": [{"kw": "so", "raw": "1Sa_22:3", "note": "", "refs": [{"l": "1Sa 22:3", "n": "", "vs": [
