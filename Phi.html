 أتوسل إليكم باسم ربنا يسوع المسيح أن يكون لجميعكم صوت واحد وأن لا يكون بينكم أي انقسام. وإنما كونوا جميعا موحدي الفكر والرأي."]]}, {"l": "1Co 15:58", "n": "", "vs": [[58, "إذن، ياإخوتي الأحباء، كونوا راسخين غير متزحزحين، كثيري الاجتهاد في عمل الرب دائما، عالمين أن جهدكم في الرب ليس عبثا!"]]}, {"l": "1Co 16:13", "n": "", "vs": [[13, "كونوا متيقظين حذرين. اثبتوا في الإيمان. كونوا رجالا. كونوا أقوياء."]]}, {"l": "1Co 16:14", "n": "", "vs": [[14, "وكل ما تعملونه، فاعملوه في المحبة."]]}, {"l": "2Co 13:11", "n": "", "vs": [[11, "وأخيرا، أيها الإخوة: افرحوا؛ تكملوا؛ تشجعوا؛ اتفقوا في الرأي؛ عيشوا بسلام. وإله المحبة والسلام سيكون معكم!"]]}], "kwAr": "أنكم ثابتون", "noteAr": ""}, {"kw": "in one", "raw": "Jer_32:39; Joh_17:20,Joh_17:21; Act_2:46, Act_4:32; Rom_12:4, Rom_12:5; 1Cor. 12:12-31; Eph_4:3-6; Jam_3:18; Jud_1:3", "note": "", "refs": [{"l": "Jer 32:39", "n": "", "vs": [[39, "وأعطيهم قلبا واحدا وطريقا واحدا ليتقوني كل الأيام، وذلك لخيرهم وخير أولادهم من بعدهم."]]}, {"l": "Joh 17:20", "n": "", "vs": [[20, "ولست أصلي من أجل هؤلاء فقط، بل أيضا من أجل الذين سوف يؤمنون بي بسبب كلمة هؤلاء،"]]}, {"l": "Joh 17:21", "n": "", "vs": [[21, "ليكون الجميع واحدا؛ أيها الآب، كما أنك أنت في وأنا فيك، ليكونوا هم أيضا واحدا فينا، لكي يؤمن العالم أنك أنت أرسلتني."]]}, {"l": "Act 2:46", "n": "", "vs": [[46, "ويداومون على الحضور إلى الهيكل يوميا بقلب واحد، ويكسرون الخبز في البيوت، ويتناولون الطعام معا بابتهاج وبساطة قلب،"]]}, {"l": "Act 4:32", "n": "", "vs": [[32, "وكانت جماعة المؤمنين قلبا واحدا ونفسا واحدة، ولم يكن أحد يقول إن شيئا مما عنده هو له وحده، بل كان كل شيء عندهم مشتركا."]]}, {"l": "Rom 12:4", "n": "", "vs": [[4, "فكما أن لنا في جسد واحد أعضاء كثيرة، ولكن ليس لجميع هذه الأعضاء عمل واحد،"]]}, {"l": "Rom 12:5", "n": "", "vs": [[5, "فكذلك نحن الكثيرين جسد واحد في المسيح، وكلنا أعضاء بعضنا لبعض."]]}, {"l": "1Co 12:12-31", "n": "", "vs": [[12, "فكما أن الجسد واحد وله أعضاء كثيرة، ولكن أعضاء الجسد كلها تشكل جسما واحدا مع أنها كثيرة، فكذلك حال المسيح أيضا."], [13, "فإننا، بالروح الواحد، قد تعمدنا جميعا لنصير جسدا واحدا، سواء كنا يهودا أم يونانيين، عبيدا أم أحرارا، وقد سقينا جميعا الروح الواحد."], [14, "فليس الجسد عضوا واحدا بل مجموعة أعضاء."], [15, "فإن قالت الرجل: «لأني لست يدا، لست من الجسد!» فهل تصبح من خارج الجسد فعلا؟"], [16, "وإن قالت الأذن: «لأني لست عينا، لست من الجسد!» فهل تصبح من خارج الجسد فعلا؟"], [17, "فلو كان الجسد كله عينا، فكيف كنا نسمع؟ ولو كان كله أذنا، فكيف كنا نشم؟"], [18, "على أن الله قد رتب كلا من الأعضاء في الجسد كما أراد."], [19, "فلو كانت كلها عضوا واحدا، فكيف يتكون الجسد؟"], [20, "فالواقع أن الأعضاء كثيرة، والجسد واحد."], [21, "وهكذا، لا تستطيع العين أن تقول لليد: «أنا لا أحتاج إليك!» ولا الرأس أن تقول للرجلين: «أنا لا أحتاج إليكما!»،"], [22, "بل بالأحرى جدا، أعضاء الجسد التي تبدو أضعف الأعضاء هي ضرورية،"], [23, "وتلك التي نعتبرها أقل ما في الجسد كرامة، نكسوها بإكرام أوفر. والأعضاء غير اللائقة يكون لها لياقة أوفر؛"], [24, "أما اللائقة، فلا تحتاج إلى ذلك. ولكن الله أحكم صنع الجسد بجملته، معطيا كرامة أوفر لما تنقصه الكرامة،"], [25, "لكي لا يكون في الجسد انقسام بل يكون بين الأعضاء اهتمام واحد لمصلحة الجسد."], [26, "فحين يصيب الألم واحدا من الأعضاء، تشعر الأعضاء الباقية معه بالألم. وحين ينال واحد من الأعضاء إكراما، تفرح معه الأعضاء الباقية."], [27, "فالواقع أنكم أنتم جميعا جسد المسيح، وأعضاء فيه كل بمفرده."], [28, "وقد رتب الله في الكنيسة أشخاصا مخصوصين: أولا الرسل، ثانيا الأنبياء، ثالثا المعلمين، وبعد ذلك أصحاب المواهب المعجزية أو مواهب الشفاء أو إعانة الآخرين أو تدبير الشؤون أو التكلم باللغات المختلفة."], [29, "فهل هم جميعا رسل؟ أجميعهم أنبياء؟ أجميعهم معلمون؟ أجميعهم حائزون على مواهب معجزية؟"], [30, "أجميعهم يملكون مواهب الشفاء؟ أجميعهم يتكلمون بلغات؟ أجميعهم يترجمون؟"], [31, "ولكن تشوقوا إلى المواهب العظمى. وها أنا أرسم لكم بعد طريقا أفضل جدا…"]]}, {"l": "Eph 4:3-6", "n": "", "vs": [[3, "مجتهدين أن تحافظوا على وحدة الروح برابطة الوفاق. فإنما هناك جسد واحد وروح واحد،"], [4, "مثلما دعيتم، جميعكم، دعوة لها رجاء واحد."], [5, "ولكم رب واحد، وإيمان واحد، ومعمودية واحدة،"], [6, "وإله وآب واحد للجميع، وهو فوق الجميع وبالجميع وفي الجميع."]]}, {"l": "Jam 3:18", "n": "", "vs": [[18, "والبر هو ثمر ة ما يزرعه في سلام صانعو السلام."]]}, {"l": "Jud 1:3", "n": "", "vs": [[3, "أيها الأحباء، كنت قد نويت أن أكتب إليكم في موضوع الخلاص الذي نشترك فيه جميعا. ولكن، أراني الآن مضطرا لأن أكتب لأشجعكم على الجهاد في سبيل الإيمان الذي سلم مرة واحدة للقديسين."]]}], "kwAr": "في روح واحد", "noteAr": ""}, {"kw": "the faith", "raw": "Pro_22:23; Act_24:24; Rom_1:5, Rom_10:8; Eph_1:13; 1Ti_1:11, 1Ti_1:19; 2Ti_4:7", "note": "", "refs": [{"l": "Pro 22:23", "n": "", "vs": [[23, "لأن الرب يدافع عن دعواهم، ويهلك ناهبيهم."]]}, {"l": "Act 24:24", "n": "", "vs": [[24, "وبعد بضعة أيام جاء فيلكس ومعه زوجته دروسلا، وكانت يهودية، فاستدعى بولس واستمع إلى حديثه عن الإيمان بالمسيح يسوع."]]}, {"l": "Rom 1:5", "n": "", "vs": [[5, "الذي به ولأجل اسمه نلنا نعمة ورسالة لإطاعة الإيمان بين جميع الأمم،"]]}, {"l": "Rom 10:8", "n": "", "vs": [[8, "فماذا يقول إذا؟ إنه يقول: «إن الكلمة قريبة منك. إنها في فمك وفي قلبك!» وما هذه الكلمة إلا كلمة الإيمان التي نبشر بها:"]]}, {"l": "Eph 1:13", "n": "", "vs": [[13, "وفيه أنتم أيضا (وضعتم رجاءكم) إذ سمعتم كلمة الحق، أي الإنجيل الذي فيه خلاصكم؛ كذلك فيه أيضا ختمتم، إذ آمنتم، بالروح القدس الموعود،"]]}, {"l": "1Ti 1:11", "n": "", "vs": [[11, "الموافق لإنجيل مجد الله المبارك، ذلك الإنجيل الذي وضع أمانة بين يدي."]]}, {"l": "1Ti 1:19", "n": "", "vs": [[19, "متمسكا بالإيمان، وبالضمير الصالح، هذا الضمير الذي تخلى عنه بعضهم، فانكسرت بهم سفينة الإيمان."]]}, {"l": "2Ti 4:7", "n": "", "vs": [[7, "قد جاهدت الجهاد الحسن، قد بلغت نهاية الشوط، قد حافظت على الإيمان."]]}], "kwAr": "لأجل الإيمان", "noteAr": ""}], "arS": [["إنما ", []], ["عيشوا عيشة", ["G4176"]], [" ", []], ["تليق", ["G516"]], [" ", []], ["فقط", ["G3440"]], [" ", []], ["بإنجيل", ["G2098"]], [" ", []], ["المسيح", ["G5547"]], [". حتى إذا ", []], ["جئت", ["G2064"]], [" ", []], ["وشاهدتكم", ["G1492"]], [" أو بقيت ", []], ["غائبا", ["G548"]], [" عنكم، ", []], ["أسمع", ["G191"]], [" أخباركم وأعرف أنكم ", []], ["ثابتون", ["G4739"]], [" في ", []], ["روح", ["G4151"]], [" ", []], ["واحد", ["G1520"]], ["، ", []], ["وبنفس", ["G5590"]], [" ", []], ["واحدة", ["G3391"]], [" ", []], ["تجاهدون معا", ["G4866"]], [" لأجل ", []], ["الإيمان", ["G4102"]], [" المعلن في ", []], ["الإنجيل", ["G2098"]], ["،", []]]}, {"c": 1, "v": 28, "text": "غير مرتعبين في شيء من الذين يقاومونكم، فإن في مقاومتهم دليلا على هلاكهم هم وعلى خلاصكم أنتم، وذلك من عند الله.", "groups": [{"kw": "in", "raw": "Isa_51:7, Isa_51:12; Mat_10:28; Luk_12:4-7, Luk_21:12-19; Act_4:19-31, Act_5:40-42; 1Th_2:2; 2Ti_1:7, 2Ti_1:8; Heb_13:6; Rev_2:10", "note": "", "refs": [{"l": "Isa 51:7", "n": "", "vs": [[7, "استمعوا إلي ياعارفي البر، أيها الشعب الذي شريعتي في قلوبكم. لا تخشوا تعيير الناس ولا ترتعبوا من شتائمهم،"]]}, {"l": "Isa 51:12", "n": "", "vs": [[12, "أنا، أنا هو معزيكم، فمن أنت حتى تخشي إنسانا فانيا أو بشرا يبيدون كالعشب؟"]]}, {"l": "Mat 10:28", "n": "", "vs": [[28, "لا تخافوا الذين يقتلون الجسد، ولكنهم يعجزون عن قتل النفس، بل بالأحرى خافوا القادر أن يهلك النفس والجسد جميعا في جهنم."]]}, {"l": "Luk 12:4-7", "n": "", "vs": [[4, "على أني أقول لكم ياأحبائي: لا تخافوا من الذين يقتلون الجسد ثم لا يستطيعون أن يفعلوا أكثر من ذلك."], [5, "ولكني أريكم ممن تخافون: خافوا من القادر أن يلقي في جهنم بعد القتل. نعم، أقول لكم، من هذا خافوا!"], [6, "أما تباع خمسة عصافير بفلسين؟ ومع ذلك لا ينسى الله واحدا منها."], [7, "بل إن شعر رؤوسكم كله معدود. فلا تخافوا إذن، أنتم أفضل من عصافير كثيرة!"]]}, {"l": "Luk 21:12-19", "n": "", "vs": [[12, "ولكن قبل هذه الأمور كلها يمد الناس أيديهم إليكم ويضطهدونكم، فيسلمونكم إلى المجامع والسجون، ويسوقونكم للمثول أمام الملوك والحكام، من أجل اسمي."], [13, "ولكن ذلك سيتيح لكم فرصة للشهادة."], [14, "فضعوا في قلوبكم ألا تعدوا دفاعكم مسبقا،"], [15, "لأني سوف أعطيكم كلاما وحكمة لا يقدر جميع مقاوميكم أن يردوها أو يناقضوها."], [16, "وسوف يسلمكم حتى الوالدون والإخوة والأقرباء والأصدقاء، ويقتلون بعضا منكم،"], [17, "وتكونون مكروهين لدى الجميع من أجل اسمي."], [18, "ولكن شعرة من رؤوسكم لا تهلك البتة."], [19, "فباحتمالكم تربحون أنفسكم!"]]}, {"l": "Act 4:19-31", "n": "", "vs": [[19, "ولكن بطرس ويوحنا قالا: «احكموا أنتم: أمن الحق أمام الله أن نطيع أمركم لا أمر الله؟"], [20, "لا نستطيع أن نكف عن التحدث بما رأينا وسمعنا»."], [21, "فشدد المجلس إنذاره لهما، دون أن يجد طريقة لمعاقبتهما، وأمر بإطلاقهما خوفا من ثورة الشعب، فقد كان الجميع يمجدون الله على تلك المعجزة،"], [22, "لأن الرجل الذي جرت فيه علامة الشفاء هذه قد جاوز الأربعين عاما!"], [23, "وما إن أطلق بطرس ويوحنا حتى رجعا إلى رفاقهما، وأخبراهم بكل ما قاله لهما رؤساء الكهنة والشيوخ،"], [24, "فتوجهوا بقلب واحد إلى الله بالدعاء، قائلين: «يارب، ياخالق السماء والأرض والبحر وكل ما فيها،"], [25, "يامن قلت بالروح القدس على لسان عبدك داود: لماذا ضجت الأمم؟ ولماذا تآمرت الشعوب باطلا؟"], [26, "اجتمع ملوك الأرض ورؤساؤها، وتحالفوا ليقاوموا الرب ومسيحه!"], [27, "وقد تحققت هذه الكلمات فعلا، إذ تحالف هيرودس، وبيلاطس البنطي، والوثنيون وأسباط إسرائيل، لمقاومة فتاك القدوس يسوع، الذي جعلته مسيحا،"], [28, "وعملوا به كل ما سبق أن رسمت يدك وقضت مشيئتك أن يكون."], [29, "والآن انظر، يارب، إلى تهديدهم، وهبنا نحن عبيدك أن نعلن كلامك بكل جرأة،"], [30, "ومد يدك للشفاء، كي تجرى معجزات وعجائب باسم فتاك القدوس يسوع»."], [31, "وفيما هم يصلون ارتج المكان الذي كانوا مجتمعين فيه، وامتلأوا جميعا بالروح القدس، فأخذوا يعلنون كلمة الله بكل جرأة!"]]}, {"l": "Act 5:40-42", "n": "", "vs": [[40, "فعمل أعضاء المجلس بهذه النصيحة، واستدعوا الرسل، فجلدوهم وأمروهم ألا يعلموا باسم يسوع، ثم أطلقوهم."], [41, "ولكن الرسل خرجوا من المجلس فرحين، لأنهم اعتبروا أهلا لأن يلقوا الإهانة من أجل اسم يسوع."], [42, "وكانوا كل يوم، في الهيكل وفي البيوت، يعلمون ويبشرون بالمسيح يسوع بلا انقطاع."]]}, {"l": "1Th 2:2", "n": "", "vs": [[2, "فمع أننا كنا قد قاسينا الألم والإهانة في مدينة فيلبي، كما تعلمون، فقد تجرأنا في إلهنا أن نكلمكم بإنجيل الله مجاهدين في وجه المعارضة الشديدة."]]}, {"l": "2Ti 1:7", "n": "", "vs": [[7, "فإن الله قد أعطانا لا روح الجبن بل روح القوة والمحبة والبصيرة."]]}, {"l": "2Ti 1:8", "n": "", "vs": [[8, "فلا تخجل إذن بالشهادة لربنا، ولا تخجل بي أنا السجين لأجله، بل شاركني في المشقات لأجل الإنجيل، متوكلا على قدرة الله."]]}, {"l": "Heb 13:6", "n": "", "vs": [[6, "فنستطيع إذن، أن نقول بكل ثقة وجرأة: «الرب معيني، فلن أخاف! ماذا يصنع بي الإنسان؟»"]]}, {"l": "Rev 2:10", "n": "", "vs": [[10, "دع عنك الخوف مما ينتظرك من آلام، فإن إبليس سيزج ببعضكم في السجن لكي تمتحنوا، فتقاسون الاضطهاد عشرة أيام. فابق أمينا حتى الموت، فأمنحك إكليل الحياة."]]}], "kwAr": "غير مرتعبين في شيء", "noteAr": ""}, {"kw": "an", "raw": "2Th_1:5, 2Th_1:6; 1Pe_4:12-14", "note": "", "refs": [{"l": "2Th 1:5", "n": "", "vs": [[5, "وفي هذا دليل على حكم الله العادل، بقصد أن تعتبروا مؤهلين لملكوت الله الذي من أجله تلاقون الآلام."]]}, {"l": "2Th 1:6", "n": "", "vs": [[6, "فمن العدل عند الله حقا أن يجازي بالضيقة أولئك الذين يضايقونكم،"]]}, {"l": "1Pe 4:12-14", "n": "", "vs": [[12, "أيها الأحباء، لا تستغربوا نار الاضطهاد المشتعلة عندكم لاختباركم وكأن أمرا غريبا قد أصابكم!"], [13, "وإنما افرحوا: لأنكم كما تشاركون المسيح في الآلام الآن، لابد أن تفرحوا بمشاركته في الابتهاج عند ظهور مجده."], [14, "فإذا لحقتكم الإهانة لأنكم تحملون اسم المسيح، فطوبى لكم! لأن روح المجد، أي روح الله، يستقر عليكم."]]}], "kwAr": "دليلا على هلاكهم", "noteAr": ""}, {"kw": "but", "raw": "Mat_5:10-12; Rom_8:17; 2Ti_2:11, 2Ti_2:12", "note": "", "refs": [{"l": "Mat 5:10-12", "n": "", "vs": [[10, "طوبى للمضطهدين من أجل البر، فإن لهم ملكوت السماوات."], [11, "طوبى لكم متى أهانكم الناس واضطهدوكم، وقالوا فيكم من أجلي كل سوء كاذبين."], [12, "افرحوا وتهللوا، فإن مكافأتكم في السماوات عظيمة. فإنهم هكذا اضطهدوا الأنبياء من قبلكم!"]]}, {"l": "Rom 8:17", "n": "", "vs": [[17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}, {"l": "2Ti 2:11", "n": "", "vs": [[11, "وما أصدق القول: «إن كنا قد متنا معه، فسوف نحيا أيضا معه؛"]]}, {"l": "2Ti 2:12", "n": "", "vs": [[12, "إن تحملنا الآلام، فسوف نملك أيضا معه؛ إن أنكرناه، فسوف ينكرنا أيضا؛"]]}], "kwAr": "وعلى خلاصكم", "noteAr": ""}, {"kw": "and that", "raw": "Gen_49:18; Psa_50:23, Psa_68:19, Psa_68:20; Isa_12:2; Luk_3:6; Act_28:28", "note": "", "refs": [{"l": "Gen 49:18", "n": "", "vs": [[18, "إنني انتظرت خلاصك يارب."]]}, {"l": "Psa 50:23", "n": "", "vs": [[23, "أما من يقدم لي ذبيحة حمد فهو يمجدني، ومن يقوم طريقه أريه خلاص الله»."]]}, {"l": "Psa 68:19", "n": "", "vs": [[19, "تبارك الرب الذي يحمل أثقالنا يوما فيوما. إنه إله خلاصنا."]]}, {"l": "Psa 68:20", "n": "", "vs": [[20, "إلهنا هو إله الخلاص، وعند الرب السيد منافذ من الموت."]]}, {"l": "Isa 12:2", "n": "", "vs": [[2, "ها إن الله خلاصي فأطمئن ولا أرتعد، لأن الرب الله هو قوتي وترنيمتي وقد أصبح لي خلاصا»."]]}, {"l": "Luk 3:6", "n": "", "vs": [[6, "فيبصر كل بشر الخلاص الإلهي! »"]]}, {"l": "Act 28:28", "n": "", "vs": [[28, "وختم بولس كلامه بقوله: «اعلموا إذن أن الله قد أرسل خلاصه هذا إلى الأمم الأخرى، وهم سيستمعون إليه!»"]]}], "kwAr": "وذلك من عند الله", "noteAr": ""}], "arS": [["غير ", []], ["مرتعبين", ["G4426"]], [" في شيء من الذين ", []], ["يقاومونكم", ["G480"]], ["، فإن في مقاومتهم ", []], ["دليلا", ["G1732"]], [" على ", []], ["هلاكهم", ["G684"]], [" هم وعلى ", []], ["خلاصكم", ["G4991"]], [" أنتم، وذلك من عند ", []], ["الله", ["G2316"]], [".", []]]}, {"c": 1, "v": 29, "text": "فقد وهب لكم، لأجل المسيح، لا أن تؤمنوا به وحسب، بل أيضا أن تتألموا لأجله،", "groups": [{"kw": "it is", "raw": "Act_5:41; Rom_5:3; Jam_1:2; 1Pe_4:13", "note": "", "refs": [{"l": "Act 5:41", "n": "", "vs": [[41, "ولكن الرسل خرجوا من المجلس فرحين، لأنهم اعتبروا أهلا لأن يلقوا الإهانة من أجل اسم يسوع."]]}, {"l": "Rom 5:3", "n": "", "vs": [[3, "ليس هذا فقط، بل نفتخر أيضا في وسط الضيقات، لعلمنا أن الضيق ينتج فينا الصبر،"]]}, {"l": "Jam 1:2", "n": "", "vs": [[2, "ياإخوتي، عندما تنزل بكم التجارب والمحن المختلفة، اعتبروها سبيلا إلى الفرح الكلي."]]}, {"l": "1Pe 4:13", "n": "", "vs": [[13, "وإنما افرحوا: لأنكم كما تشاركون المسيح في الآلام الآن، لابد أن تفرحوا بمشاركته في الابتهاج عند ظهور مجده."]]}], "kwAr": "فقد وهب لكم", "noteAr": ""}, {"kw": "not", "raw": "Mat_16:17; Joh_1:12, Joh_1:13, Joh_6:44, Joh_6:45; Act_13:39, Act_14:27; Eph_2:8; Col_2:12; Jam_1:17, Jam_1:18", "note": "", "refs": [{"l": "Mat 16:17", "n": "", "vs": [[17, "فقال له يسوع: «طوبى لك ياسمعان بن يونا. فما أعلن لك هذا لحم ودم، بل أبي الذي في السماوات."]]}, {"l": "Joh 1:12", "n": "", "vs": [[12, "أما الذين قبلوه، أي الذين آمنوا باسمه، فقد منحهم الحق في أن يصيروا أولاد الله،"]]}, {"l": "Joh 1:13", "n": "", "vs": [[13, "وهم الذين ولدوا ليس من دم، ولا من رغبة جسد، ولا من رغبة بشر، بل من الله."]]}, {"l": "Joh 6:44", "n": "", "vs": [[44, "لا يقدر أحد أن يأتي إلي إلا إذا اجتذبه الآب الذي أرسلني. وأنا أقيمه في اليوم الأخير."]]}, {"l": "Joh 6:45", "n": "", "vs": [[45, "جاء في كتب الأنبياء: سيتعلم الجميع من الله. وكل من يسمع الآب ويتعلم منه يأتي إلي."]]}, {"l": "Act 13:39", "n": "", "vs": [[39, "وأنه به يتبرر كل من يؤمن من كل ما عجزت شريعة موسى أن تبرره منه."]]}, {"l": "Act 14:27", "n": "", "vs": [[27, "ولما وصلا، استدعيا الكنيسة إلى الاجتماع، وأخبرا بكل ما فعل الله بواسطتهما، وبأنه فتح باب الإيمان لغير اليهود."]]}, {"l": "Eph 2:8", "n": "", "vs": [[8, "فإنكم بالنعمة مخلصون، بالإيمان، وهذا ليس منكم. إنه هبة من الله،"]]}, {"l": "Col 2:12", "n": "", "vs": [[12, "فقد دفنتم معه في المعمودية، وفيها أيضا أقمتم معه، عن طريق إيمانكم بقدرة الله الذي أقامه من بين الأموات."]]}, {"l": "Jam 1:17", "n": "", "vs": [[17, "إن كل عطية صالحة وهبة كاملة إنما تنزل من فوق، من لدن أبي الأنوار الذي ليس فيه تحول، ولا ظل لأنه لا يدور."]]}, {"l": "Jam 1:18", "n": "", "vs": [[18, "وهو قد شاء أن يجعلنا أولادا له، فولدنا بكلمته، كلمة الحق. وغايته أن نكون باكورة خليقته."]]}], "kwAr": "لا أن تؤمنوا به وحسب", "noteAr": ""}], "arS": [["فقد ", []], ["وهب", ["G5483"]], [" لكم، لأجل ", []], ["المسيح", ["G5547"]], ["، لا أن ", []], ["تؤمنوا", ["G4100"]], [" به ", []], ["وحسب", ["G3440"]], ["، بل أيضا أن ", []], ["تتألموا", ["G3958"]], [" لأجله،", []]]}, {"c": 1, "v": 30, "text": "مجاهدين الجهاد عينه الذي رأيتموه في والذي تسمعون الآن أنه في.", "groups": [{"kw": "the same", "raw": "Joh_16:33; Rom_8:35-37; 1Co_4:9-14, 1Co_15:30-32; Eph_6:11-18; Col_2:1; 1Th_2:14, 1Th_2:15, 1Th_3:2-4; 2Ti_2:10-12, 2Ti_4:7; Heb_10:32, Heb_10:33, Heb_12:4; Rev_2:10,Rev_2:11; Rev_12:11", "note": "", "refs": [{"l": "Joh 16:33", "n": "", "vs": [[33, "أخبرتكم بهذا كله ليكون لكم في سلام. فإنكم في العالم ستقاسون الضيق. ولكن تشجعوا، فأنا قد انتصرت على العالم!»"]]}, {"l": "Rom 8:35-37", "n": "", "vs": [[35, "فمن سيفصلنا عن محبة المسيح لنا؟ هل الشدة أم الضيق أم الاضطهاد أم الجوع أم العري أم الخطر أم السيف؟"], [36, "بل كما قد كتب: «إننا من أجلك نعاني الموت طول النهار. قد حسبنا كأننا غنم للذبح!»"], [37, "ولكننا، في جميع هذه الأمور، نحرز ما يفوق الانتصار على يد من أحبنا."]]}, {"l": "1Co 4:9-14", "n": "", "vs": [[9, "فإني أرى أن الله عرضنا، نحن الرسل، في آخر الموكب كأنه محكوم علينا بالموت، لأننا صرنا معرضا للعالم، للملائكة والبشر معا."], [10, "نحن جهلاء من أجل المسيح، وأنتم حكماء في المسيح. نحن ضعفاء وأنتم أقوياء. أنتم مكرمون ونحن مهانون."], [11, "فما زلنا حتى هذه الساعة نجوع ونعطش، ونعرى ونلطم ونحرم محلا للإقامة"], [12, "ونجهد أنفسنا في الشغل بأيدينا. نتعرض للإهانة فنبارك، وللاضطهاد فنحتمل"], [13, "وللتجريح فنسالم. صرنا كأقذار العالم ونفاية الجميع، ومازلنا!"], [14, "لا أكتب هذا تخجيلا لكم، بل أنبهكم باعتباركم أولادي الأحباء."]]}, {"l": "1Co 15:30-32", "n": "", "vs": [[30, "ولماذا نعرض نحن أنفسنا للخطر كل ساعة؟"], [31, "فبحسب افتخاري بكم في المسيح يسوع ربنا، أشهد أيها الإخوة أني أموت كل يوم!"], [32, "ولو كنت بمنطق البشر قد تعرضت للموت في أفسس بين مخالب الوحوش، فأي نفع يعود علي إن كان الذين يموتون لا يقومون؟ ولم لا «نأكل ونشرب، لأننا غدا نموت؟»"]]}, {"l": "Eph 6:11-18", "n": "", "vs": [[11, "البسوا سلاح الله الكامل، لتتمكنوا من الصمود في وجه مكايد إبليس."], [12, "فإن حربنا ليست ضد ذوي اللحم والدم، بل ضد الرئاسات، ضد السلطات، ضد أسياد العالم حكام هذا الظلام، ضد قوى الشر الروحية في الأماكن السماوية."], [13, "لذلك اتخذوا سلاح الله الكامل، لتتمكنوا من المقاومة في يوم الشر، ومن الصمود أيضا بعد تحقيق كل هدف."], [14, "فاصمدوا إذن بعد أن تتخذوا الحق حزاما لأوساطكم، والبر درعا لصدوركم،"], [15, "والاستعداد لنشر بشارة السلام حذاء لأقدامكم."], [16, "وفوق هذا كله، احملوا الإيمان ترسا به تقدرون أن تطفئوا جميع سهام الشرير المشتعلة."], [17, "واتخذوا الخلاص خوذة للرأس، وكلمة الله سيف الروح."], [18, "كونوا مصلين في كل حال، بكل صلاة وطلبة في الروح، وساهرين لهذا الغرض عينه مواظبين تماما على جميع الطلبات لأجل القديسين جميعا،"]]}, {"l": "Col 2:1", "n": "", "vs": [[1, "فإني أريد أن تعلموا مقدار جهادي لأجلكم ولأجل الذين في مدينة لاودكية، ولأجل جميع الذين لا يعرفونني بالوجه،"]]}, {"l": "1Th 2:14", "n": "", "vs": [[14, "فإنكم، أيها الإخوة، قد صرتم على مثال كنائس الله التي في منطقة اليهودية والتي هي في المسيح يسوع. فأنتم أيضا قاسيتم على أيدي بني جنسكم ما قاسوه هم على أيدي اليهود"]]}, {"l": "1Th 2:15", "n": "", "vs": [[15, "الذين قتلوا الرب يسوع والأنبياء واضطهدونا نحن أيضا، وهم لا يرضون الله ويعادون الناس جميعا،"]]}, {"l": "1Th 3:2-4", "n": "", "vs": [[2, "فبعثنا تيموثاوس، أخانا ومعاوننا في خدمة الله بنشر الإنجيل، لكي يشددكم ويشجعكم في إيمانكم،"], [3, "حتى لا يتزعزع أحد منكم من جراء هذه الضيقات. فإنكم تعلمون أننا معينون لذلك؛"], [4, "وقد سبق لنا، لما كنا عندكم أن أخبرناكم أننا سنقاسي الضيقات، الأمر الذي حدث بعد ذلك كما تعلمون."]]}, {"l": "2Ti 2:10-12", "n": "", "vs": [[10, "لهذا السبب أحتمل كل شيء بصبر لأجل الذين اختارهم الله ، لكي يحصلوا، هم أيضا، على الخلاص الذي في المسيح يسوع مع المجد الأبدي."], [11, "وما أصدق القول: «إن كنا قد متنا معه، فسوف نحيا أيضا معه؛"], [12, "إن تحملنا الآلام، فسوف نملك أيضا معه؛ إن أنكرناه، فسوف ينكرنا أيضا؛"]]}, {"l": "2Ti 4:7", "n": "", "vs": [[7, "قد جاهدت الجهاد الحسن، قد بلغت نهاية الشوط، قد حافظت على الإيمان."]]}, {"l": "Heb 10:32", "n": "", "vs": [[32, "لا تنسوا أبدا تلك الأيام الماضية التي فيها، بعدما أشرق عليكم نور الإيمان بالمسيح، صبرتم على جهاد مرير طويل، إذ قاسيتم كثيرا من الآلام."]]}, {"l": "Heb 10:33", "n": "", "vs": [[33, "وذلك عندما تعرضتم للإهانات والمضايقات من جهة، وعندما شاركتم الذين عوملوا مثل هذه المعاملة من جهة أخرى."]]}, {"l": "Heb 12:4", "n": "", "vs": [[4, "لم تقاوموا بعد حتى بذل الدم في مجاهدتكم ضد الخطيئة."]]}, {"l": "Rev 2:10", "n": "", "vs": [[10, "دع عنك الخوف مما ينتظرك من آلام، فإن إبليس سيزج ببعضكم في السجن لكي تمتحنوا، فتقاسون الاضطهاد عشرة أيام. فابق أمينا حتى الموت، فأمنحك إكليل الحياة."]]}, {"l": "Rev 2:11", "n": "", "vs": [[11, "من له أذن فليسمع ما يقوله الروح للكنائس! كل من ينتصر لن يلحق به أذى الموت الثاني!"]]}, {"l": "Rev 12:11", "n": "", "vs": [[11, "وهم قد انتصروا عليه بدم الحمل وبالكلمة التي شهدوا لها، فلم تكن حياتهم عزيزة لديهم، حتى إنهم ماتوا."]]}], "kwAr": "الجهاد عينه", "noteAr": ""}, {"kw": "which", "raw": "Acts 16:19-40; 1Th_2:2", "note": "", "refs": [{"l": "Act 16:19-40", "n": "", "vs": [[19, "ولما رأى سادتها أن مورد رزقهم قد انقطع، قبضوا على بولس وسيلا، وجروهما إلى ساحة المدينة للمحاكمة،"], [20, "وقدموهما إلى الحكام قائلين: «هذان الرجلان يثيران الفوضى في المدينة؛ فهما يهوديان"], [21, "يناديان بتقاليد لا يجوز لنا نحن الرومانيين أن نقبلها أو نعمل بها!»"], [22, "فثار الجمع عليهما، ومزق الحكام ثيابهما وأمروا بجلدهما،"], [23, "فجلدوهما كثيرا وألقوهما في السجن، وأمروا ضابط السجن بتشديد الحراسة عليهما."], [24, "ونفذ ضابط السجن هذا الأمر المشدد. فزج بهما في السجن الداخلي، وأدخل أرجلهما في مقطرة خشبية."], [25, "ونحو منتصف الليل كان بولس وسيلا يصليان ويسبحان الله، والمسجونون يسمعونهما،"], [26, "وفجأة حدث زلزال شديد هز أركان السجن، فانفتحت جميع أبوابه حالا، وسقطت قيود السجناء كلهم."], [27, "وأيقظ الزلزال ضابط السجن. فلما رأى الأبواب مفتوحة ظن أن السجناء هربوا، فاستل سيفه ليقتل نفسه،"], [28, "ولكن بولس صاح به بأعلى صوته: «لا تمس نفسك بسوء، فنحن جميعا هنا!»"], [29, "فطلب ضوءا، واندفع إلى الداخل وهو يرتجف خوفا، وارتمى أمام بولس وسيلا،"], [30, "ثم أخرجهما خارجا وسألهما: «ياسيدي، ماذا ينبغي أن أفعل لكي أخلص؟»"], [31, "فأجاباه: «آمن بالرب يسوع فتخلص أنت وأهل بيتك!»"], [32, "ثم بشراه وأهل بيته جميعا بكلمة الرب."], [33, "فأخذهما في تلك الساعة من الليل وغسل جراحهما وتعمد حالا هو وأهل بيِته جميعا."], [34, "ثم ذهب بهما إلى بيته وبسط لهما مائدة. وابتهج مع أهل بيته جميعا، إذ كان قد آمن بالله."], [35, "ولما طلع الصباح أرسل الحكام بعض رجال الشرطة ليبلغوا ضابط السجن أمر الإفراج عن بولس وسيلا."], [36, "فأخبر الضابط بولس بالأمر، قائلا: «أرسل الحكام أمرا بالإفراج عنكما فاخرجا الآن واذهبا بسلام!»"], [37, "فاحتج بولس قائلا: «جلدونا أمام الناس بغير محاكمة، مع أننا نحمل الجنسية الرومانية، وزجوا بنا في السجن. فكيف يطلقون سراحنا الآن سرا! كلا! بل ليأتوا هم ويطلقوا سراحنا!»"], [38, "وأخبر رجال الشرطة الحكام بهذا الاعتراض، فخافوا حين علموا أنهما رومانيان،"], [39, "فجاءوا يعتذرون إليهما، وأطلقوهما طالبين إليهما أن يغادرا المدينة."], [40, "فخرج بولس وسيلا من السجن وتوجها إلى بيت ليدية، حيث قابلا الإخوة وشجعاهم، ثم غادرا المدينة."]]}, {"l": "1Th 2:2", "n": "", "vs": [[2, "فمع أننا كنا قد قاسينا الألم والإهانة في مدينة فيلبي، كما تعلمون، فقد تجرأنا في إلهنا أن نكلمكم بإنجيل الله مجاهدين في وجه المعارضة الشديدة."]]}], "kwAr": "الذي رأيتموه في", "noteAr": ""}, {"kw": "now", "raw": "Phi_1:13", "note": "", "refs": [{"l": "Phi 1:13", "n": "", "vs": [[13, "حتى إنه قد صار معروفا لدى الحرس الإمبراطوري كله ولدى الباقين جميعا أن قيودي إنما هي لأجل المسيح؛"]]}], "kwAr": "تسمعون الآن", "noteAr": ""}], "arS": [["مجاهدين ", []], ["الجهاد", ["G73"]], [" عينه الذي ", []], ["رأيتموه", ["G1492"]], [" في والذي ", []], ["تسمعون", ["G191"]], [" ", []], ["الآن", ["G3568"]], [" أنه في.", []]]}, {"c": 2, "v": 1, "text": "فما دام لنا التشجيع في المسيح، والتعزية في المحبة، والشركة في الروح، ولنا المراحم والحنو،", "groups": [{"kw": "any consolation", "raw": "Phi_3:3; Luk_2:10,Luk_2:11, Luk_2:25; Joh_14:18, Joh_14:27, Joh_15:11, Joh_16:22-24, Joh_17:13; Rom_5:1, Rom_5:2; Rom_15:12, Rom_15:13; 1Co_15:31; 2Co_1:5, 2Co_1:6, 2Co_2:14; 2Th_2:16, 2Th_2:17; Heb_6:18; 1Pe_1:6-8", "note": "", "refs": [{"l": "Phi 3:3", "n": "", "vs": [[3, "فإننا نحن أهل الختان الحق، لأننا إنما نعبد بروح الله ونفتخر في المسيح يسوع، ولا نعتمد على أمور الجسد،"]]}, {"l": "Luk 2:10", "n": "", "vs": [[10, "فقال لهم الملاك: «لا تخافوا! فها أنا أبشركم بفرح عظيم يعم الشعب كله:"]]}, {"l": "Luk 2:11", "n": "", "vs": [[11, "فقد ولد لكم اليوم في مدينة داود مخلص هو المسيح الرب."]]}, {"l": "Luk 2:25", "n": "", "vs": [[25, "وكان في أورشليم رجل اسمه سمعان، وهو رجل بار تقي ينتظر العزاء لإسرائيل وكان الروح القدس عليه."]]}, {"l": "Joh 14:18", "n": "", "vs": [[18, "لن أترككم يتامى، بل سأعود إليكم."]]}, {"l": "Joh 14:27", "n": "", "vs": [[27, "سلاما أترك لكم. سلامي أعطيكم. ليس كما يعطي العالم أعطيكم أنا. فلا تضطرب قلوبكم، ولا ترتعب."]]}, {"l": "Joh 15:11", "n": "", "vs": [[11, "قلت لكم هذا ليكون فيكم فرحي، ويكون فرحكم كاملا."]]}, {"l": "Joh 16:22-24", "n": "", "vs": [[22, "فكذلك أنتم، تحزنون الآن؛ ولكن عندما أعود للقائكم، تبتهج قلوبكم، ولا أحد يسلبكم فرحكم."], [23, "وفي ذلك اليوم لا تسألونني عن شيء. الحق الحق أقول لكم: إن الآب سيعطيكم كل ما تطلبون منه باسمي."], [24, "حتى الآن لم تطلبوا باسمي شيئا. اطلبوا تنالوا، فيكون فرحكم كاملا."]]}, {"l": "Joh 17:13", "n": "", "vs": [[13, "أما الآن فإني عائد إليك، وأتكلم بهذا وأنا بعد في العالم، ليكون لهم فرحي كاملا فيهم."]]}, {"l": "Rom 5:1", "n": "", "vs": [[1, "فبما أننا قد تبررنا على أساس الإيمان، صرنا في سلام مع الله بربنا يسوع المسيح."]]}, {"l": "Rom 5:2", "n": "", "vs": [[2, "وبه أيضا تم لنا الدخول بالإيمان إلى هذه النعمة التي نقيم فيها الآن؛ ونحن نفتخر برجائنا في التمتع بمجد الله."]]}, {"l": "Rom 15:12", "n": "", "vs": [[12, "ويقول إشعياء أيضا: «سيطلع أصل يسى، والقائم، ليسود على الأمم: عليه تعلق الشعوب الرجاء»."]]}, {"l": "Rom 15:13", "n": "", "vs": [[13, "فليملأكم إله الرجاء كل فرح وسلام في إيمانكم حتى تزدادوا رجاء بقوة الروح القدس."]]}, {"l": "1Co 15:31", "n": "", "vs": [[31, "فبحسب افتخاري بكم في المسيح يسوع ربنا، أشهد أيها الإخوة أني أموت كل يوم!"]]}, {"l": "2Co 1:5", "n": "", "vs": [[5, "فكما فاضت علينا آلام المسيح، يفيض علينا أيضا التشجيع بالمسيح."]]}, {"l": "2Co 1:6", "n": "", "vs": [[6, "فإن كنا في ضيقة، فذلك لأجل تشجيعكم وخلاصكم؛ وإن كنا متشجعين، فذلك لأجل تشجيعكم، مما يعمل فيكم على احتمال نفس الآلام التي نتألم بها نحن أيضا."]]}, {"l": "2Co 2:14", "n": "", "vs": [[14, "ولكن، شكرا لله الذي يقودنا دائما في موكب النصر في المسيح، وينشر بنا رائحة معرفته في كل مكان."]]}, {"l": "2Th 2:16", "n": "", "vs": [[16, "وليت ربنا يسوع المسيح نفسه، والله أبانا، الذي أحبنا ووهبنا بنعمته راحة أبدية ورجاء صالحا،"]]}, {"l": "2Th 2:17", "n": "", "vs": [[17, "يشجع قلوبكم ويرسخكم في كل عمل صالح وقول حسن!"]]}, {"l": "Heb 6:18", "n": "", "vs": [[18, "فاستنادا إلى وعد الله وقسمه، وهما أمران ثابتان لا يتغيران ويستحيل أن يكذب الله فيهما، نحصل على تشجيع قوي، بعدما التجأنا إلى التمسك بالرجاء الموضوع أمامنا."]]}, {"l": "1Pe 1:6-8", "n": "", "vs": [[6, "وهذا يدعوكم إلى الابتهاج، مع أنه لابد لكم الآن من الحزن فترة قصيرة تحت وطأة التجارب المتنوعة!"], [7, "إلا أن غاية هذه التجارب هي اختبار حقيقة إيمانكم. فكما تختبر النار الذهب وتنقيه، تختبر التجارب حقيقة إيمانكم، وهو أثمن جدا من الذهب الفاني. وهكذا، يكون إيمانكم مدعاة مدح وإكرام وتمجيد لكم، عندما يعود يسوع المسيح ظاهرا بمجده."], [8, "أنتم لم تروا المسيح، ولكنكم تحبونه. ومع أنكم لا ترونه الآن، فأنتم تؤمنون به وتبتهجون بفرح مجيد يفوق الوصف."]]}], "kwAr": "التشجيع في المسيح", "noteAr": ""}, {"kw": "if any comfort", "raw": "Psa_133:1; Joh_15:10-12; Act_2:46, Act_4:32; Gal_5:22; Eph_4:30-32; Col_2:2; 1Jo_4:7, 1Jo_4:8, 1Jo_4:12, 1Jo_4:16", "note": "", "refs": [{"l": "Psa 133:1", "n": "", "vs": [[1, "ما أحسن وما أبهج أن يسكن الإخوة معا (بوئام)."]]}, {"l": "Joh 15:10-12", "n": "", "vs": [[10, "إن عملتم بوصاياي، تثبتون في محبتي، كما عملت أنا بوصايا أبي وأثبت في محبته!"], [11, "قلت لكم هذا ليكون فيكم فرحي، ويكون فرحكم كاملا."], [12, "وصيتي لكم هي هذه: أن يحب بعضكم بعضا كما أنا أحببتكم."]]}, {"l": "Act 2:46", "n": "", "vs": [[46, "ويداومون على الحضور إلى الهيكل يوميا بقلب واحد، ويكسرون الخبز في البيوت، ويتناولون الطعام معا بابتهاج وبساطة قلب،"]]}, {"l": "Act 4:32", "n": "", "vs": [[32, "وكانت جماعة المؤمنين قلبا واحدا ونفسا واحدة، ولم يكن أحد يقول إن شيئا مما عنده هو له وحده، بل كان كل شيء عندهم مشتركا."]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Eph 4:30-32", "n": "", "vs": [[30, "ولا تحزنوا روح الله، الروح القدس الذي به ختمتم ليوم الفداء."], [31, "انزعوا عنكم كل حقد ونقمة وغضب وصخب وسباب وكل شر."], [32, "وكونوا لطفاء بعضكم نحو بعض، شفوقين، مسامحين بعضكم بعضا كما سامحكم الله في المسيح."]]}, {"l": "Col 2:2", "n": "", "vs": [[2, "بغرض أن تتشجع قلوبهم وتكون كلها متحدة في المحبة، لبلوغ الإدراك التام بكل غناه، لمعرفة سر الله، أي المسيح،"]]}, {"l": "1Jo 4:7", "n": "", "vs": [[7, "أيها الأحباء، لنحب بعضنا بعضا: لأن المحبة تصدر من الله. إذن، كل من يحب، يكون مولودا من الله ويعرف الله ."]]}, {"l": "1Jo 4:8", "n": "", "vs": [[8, "أما من لا يحب، فهو لم يتعرف بالله قط لأن الله محبة!"]]}, {"l": "1Jo 4:12", "n": "", "vs": [[12, "إن الله لم يره أحد من الناس قط. ولكن، حين نحب بعضنا بعضا، نبين أن الله يحيا في داخلنا، وأن محبته قد اكتملت في داخلنا."]]}, {"l": "1Jo 4:16", "n": "", "vs": [[16, "ونحن أنفسنا اختبرنا المحبة التي خصنا الله بها، ووضعنا ثقتنا فيها. إن الله محبة. ومن يثبت في المحبة، فإنه يثبت في الله، والله يثبت فيه."]]}], "kwAr": "والتعزية في المحبة", "noteAr": ""}, {"kw": "if any fellowship", "raw": "Rom_5:5, Rom_8:9-16, Rom_8:26; 1Co_3:16, 1Co_6:19, 1Co_6:20, 1Co_12:13; 2Co_13:14; Gal_4:6; Eph_1:13, Eph_1:14, Eph_2:18-22, Eph_4:4; 1Pe_1:2, 1Pe_1:22, 1Pe_1:23; 1Jo_3:24", "note": "", "refs": [{"l": "Rom 5:5", "n": "", "vs": [[5, "والرجاء لا يخيبنا، لأن الله أفاض محبته في قلوبنا بالروح القدس الذي وهبنا إياه."]]}, {"l": "Rom 8:9-16", "n": "", "vs": [[9, "وأما أنتم، فلستم تحت سلطة الجسد بل تحت سلطة الروح، إذا كان روح الله ساكنا في داخلكم حقا. ولكن، إن كان أحد ليس له روح المسيح، فهو ليس للمسيح."], [10, "وإذا كان المسيح فيكم، فمع أن الجسد مائت بسبب الخطيئة، فإن الروح حياة لكم بسبب البر."], [11, "وإذا كان روح الذي أقام يسوع من بين الأموات يسكن فيكم، فإن الذي أقام المسيح من بين الأموات سوف يحيي أيضا أجسادكم الفانية بسبب روحه الذي يسكن فيكم."], [12, "فليس علينا إذن، أيها الإخوة، أي التزام نحو الجسد لنعيش بحسب الجسد."], [13, "لأنه إن عشتم بحسب الجسد، فإنكم ستموتون، ولكن إن كنتم بالروح تميتون أعمال الجسد، فستحيون."], [14, "فإن جميع الخاضعين لقيادة روح الله، هم أبناء لله."], [15, "إذ إنكم لم تنالوا روح عبودية يعيدكم إلى الخوف، بل نلتم روح بنوة به نصرخ: «أبا! أبانا!»"], [16, "فالروح نفسه يشهد مع أرواحنا بأننا أولاد الله."]]}, {"l": "Rom 8:26", "n": "", "vs": [[26, "وكذلك الروح أيضا يمدنا بالعون لنقهر ضعفنا. فإننا لا نعلم ما يجب أن نصلي لأجله كما يليق، ولكن الروح نفسه يؤدي الشفاعة عنا بأنات تفوق التعبير."]]}, {"l": "1Co 3:16", "n": "", "vs": [[16, "ألا تعرفون أنكم هيكل الله وأن روح الله ساكن فيكم؟"]]}, {"l": "1Co 6:19", "n": "", "vs": [[19, "أما تعلمون أن جسدكم هو هيكل للروح القدس الساكن فيكم والذي هو لكم من الله، وأنكم أنتم لستم ملكا لأنفسكم؟"]]}, {"l": "1Co 6:20", "n": "", "vs": [[20, "لأنكم قد اشتريتم بفدية. إذن، مجدوا الله في أجسادكم."]]}, {"l": "1Co 12:13", "n": "", "vs": [[13, "فإننا، بالروح الواحد، قد تعمدنا جميعا لنصير جسدا واحدا، سواء كنا يهودا أم يونانيين، عبيدا أم أحرارا، وقد سقينا جميعا الروح الواحد."]]}, {"l": "2Co 13:14", "n": "", "vs": [[14, "ولتكن معكم جميعا نعمة ربنا يسوع المسيح، ومحبة الله، وشركة الروح القدس. آمين!"]]}, {"l": "Gal 4:6", "n": "", "vs": [[6, "وبما أنكم أبناء له، أرسل الله إلى قلوبنا روح ابنه، مناديا: «أبا، ياأبانا»."]]}, {"l": "Eph 1:13", "n": "", "vs": [[13, "وفيه أنتم أيضا (وضعتم رجاءكم) إذ سمعتم كلمة الحق، أي الإنجيل الذي فيه خلاصكم؛ كذلك فيه أيضا ختمتم، إذ آمنتم، بالروح القدس الموعود،"]]}, {"l": "Eph 1:14", "n": "", "vs": [[14, "هذا الروح الذي هو عربون ميراثنا إلى أن يتم فداء ما قد اقتني: بغر ض مدح مجده."]]}, {"l": "Eph 2:18-22", "n": "", "vs": [[18, "فبه لنا كلينا اقتراب إلى الآب بروح واحد."], [19, "إذن، لستم غرباء وأجانب بعد الآن، بل أنتم رعية مع القديسين وأعضاء في عائلة الله،"], [20, "وقد بنيتم على أساس الرسل والأنبياء، والمسيح يسوع نفسه هو حجر الزاوية الأساس،"], [21, "الذي فيه يتناسق البناء كله فيرتفع ليصير هيكلا مقدسا في الرب."], [22, "وفيه أنتم أيضا قد بنيتم معا فصرتم مسكنا لله بوجود الروح."]]}, {"l": "Eph 4:4", "n": "", "vs": [[4, "مثلما دعيتم، جميعكم، دعوة لها رجاء واحد."]]}, {"l": "1Pe 1:2", "n": "", "vs": [[2, "بحسب علمه السابق ثم قدسهم بالروح ليطيعوا يسوع المسيح ويطهروا برش دمه عليهم."]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}, {"l": "1Pe 1:23", "n": "", "vs": [[23, "فأنتم قد ولدتم ولادة ثانية لا من زرع بشري يفنى، بل مما لا يفنى: بكلمة الله الحية الباقية إلى الأبد."]]}, {"l": "1Jo 3:24", "n": "", "vs": [[24, "وكل من يطيع وصايا الله، فإنه يثبت في الله، والله يثبت فيه. والذي يؤكد لنا أن الله يثبت فينا، هو الروح القدس الذي وهبه لنا."]]}], "kwAr": "والشركة في الروح", "noteAr": ""}, {"kw": "if any bowels", "raw": "Phi_1:8; Col_3:12", "note": "", "refs": [{"l": "Phi 1:8", "n": "", "vs": [[8, "فإن الله شاهد لي كيف أحن إليكم جميعا في عواطف المسيح يسوع."]]}, {"l": "Col 3:12", "n": "", "vs": [[12, "فباعتباركم جماعة مختارة من الله، قديسين محبوبين، البسوا دائما عواطف الحنان واللطف والتواضع والوداعة وطول البال،"]]}], "kwAr": "المراحم والحنو", "noteAr": ""}], "arS": [["فما دام لنا ", []], ["التشجيع", ["G3874"]], [" في ", []], ["المسيح", ["G5547"]], ["، ", []], ["والتعزية", ["G3890"]], [" في ", []], ["المحبة", ["G26"]], ["، ", []], ["والشركة", ["G2842"]], [" في ", []], ["الروح", ["G4151"]], ["، ولنا ", []], ["المراحم", ["G3628"]], [" ", []], ["والحنو", ["G4698"]], ["،", []]]}, {"c": 2, "v": 2, "text": "فتمموا فرحي بأن يكون لكم رأي واحد ومحبة واحدة ونفس واحدة وفكر واحد.", "groups": [{"kw": "Fulfil", "raw": "Phi_2:16, Phi_1:4, Phi_1:26, Phi_1:27; Joh_3:29; 2Co_2:3, 2Co_7:7; Col_2:5; 1Th_2:19, 1Th_2:20, 1Th_3:6-10; 2Th_2:13; 2Ti_1:4; Phm_1:20; 1Jo_1:3, 1Jo_1:4; 2Jo_1:4; 3Jo_1:4", "note": "", "refs": [{"l": "Phi 2:16", "n": "", "vs": [[16, "حاملين كلمة الحياة، لتكونوا في يوم المسيح موضع فخر بأني ما سعيت باطلا ولا اجتهدت عبثا."]]}, {"l": "Phi 1:4", "n": "", "vs": [[4, "إذ أتضرع بفرح لأجلكم جميعا كل حين في جميع صلواتي،"]]}, {"l": "Phi 1:26", "n": "", "vs": [[26, "ليزداد بسببي افتخاركم بالمسيح بحضوري بينكم من جديد."]]}, {"l": "Phi 1:27", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"]]}, {"l": "Joh 3:29", "n": "", "vs": [[29, "ومن له العروس، يكون هو العريس! أما صديق العريس، الذي يقف قربه ويسمعه، فيبتهج لفرحه بصوت العريس. وها إن فرحي هذا قد تم."]]}, {"l": "2Co 2:3", "n": "", "vs": [[3, "لهذا أكتب إليكم ما أكتبه هنا، حتى عندما أجيء لا يأتيني الحزن من الذي كان يجب أن يأتيني منه الفرح. ولي ثقة بجميعكم أن فرحي هو فرحكم جميعا."]]}, {"l": "2Co 7:7", "n": "", "vs": [[7, "لا بمجيئه وحسب، بل بالتشجيع الذي لقيه عندكم. وقد أخبرنا بشوقكم، وحزنكم، وغيرتكم علي، فتضاعف فرحي."]]}, {"l": "Col 2:5", "n": "", "vs": [[5, "فمع أني في الجسد غائب، إلا أني في الروح حاضر معكم، أفرح إذ أشاهد ترتيبكم وثباتكم في الإيمان بالمسيح."]]}, {"l": "1Th 2:19", "n": "", "vs": [[19, "فما هو رجاؤنا أو فرحنا أو إكليل افتخارنا أمام ربنا يسوع عند عودته؟ أليس أنتم؟ بلى،"]]}, {"l": "1Th 2:20", "n": "", "vs": [[20, "لأنكم فخرنا وفرحنا."]]}, {"l": "1Th 3:6-10", "n": "", "vs": [[6, "أما الآن، وقد عاد تيموثاوس إلينا من عندكم وبشرنا بما لكم من إيمان ومحبة، وبأنكم تذكروننا ذكرا حسنا في كل حين، وتشتاقون كثيرا لرؤيتنا كما نشتاق نحن لرؤيتكم،"], [7, "فقد وجدنا بكم أيها الإخوة عزاء في وسط ضيقتنا وشدتنا من جهة إيمانكم."], [8, "فقد طابت لنا الحياة مادمتم ثابتين في الرب!"], [9, "فأي شكر نستطيع أن نؤديه إلى الله عوضا عنكم من أجل كل ما نبتهج به من الفرح بسببكم أمام إلهنا،"], [10, "ونحن نتضرع ليل نهار متوسلين أن نرى وجوهكم ونكمل ما كان ناقصا في إيمانكم؟"]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "2Ti 1:4", "n": "", "vs": [[4, "وإذ أتذكر دموعك (ساعة افتراقنا) أجدني في غاية الشوق لأن أراك لأمتليء فرحا."]]}, {"l": "Phm 1:20", "n": "", "vs": [[20, "نعم، أيها الأخ، أطلب منك أن تنفعني، في الرب، بهذا المعروف: أنعش عواطفي في المسيح"]]}, {"l": "1Jo 1:3", "n": "", "vs": [[3, "فنحن، إذن، نخبركم بما رأيناه وسمعناه، لكي تكونوا شركاءنا. كما أن شركتنا هي مع الآب ومع ابنه يسوع المسيح."]]}, {"l": "1Jo 1:4", "n": "", "vs": [[4, "ونكتب إليكم هذه الأمور لكي يكتمل فرحكم!"]]}, {"l": "2Jo 1:4", "n": "", "vs": [[4, "فرحت جدا حين وجدت بعض أولادك يسلكون بحسب الحق، وفقا لما أوصانا به الآب."]]}, {"l": "3Jo 1:4", "n": "", "vs": [[4, "وما أعظم الفرح الذي يغمر قلبي حين أسمع الأخبار الطيبة التي تؤكد أن أولادي يسلكون بحسب الحق!"]]}], "kwAr": "فتمموا فرحي", "noteAr": ""}, {"kw": "that", "raw": "Phi_1:27, like minded, Phi_2:20, Phi_3:15, Phi_3:16, Phi_4:2; Rom_12:16, Rom_15:5, Rom_15:6; 1Co_1:10; 2Co_13:11; 1Pe_3:8, 1Pe_3:9", "note": "Phi_1:27, like minded, Phi_2:20, Phi_3:15, Phi_3:16, Phi_4:2; Rom_12:16, Rom_15:5, Rom_15:6; 1Co_1:10; 2Co_13:11; 1Pe_3:8, 1Pe_3:9", "refs": [{"l": "Phi 1:27", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"]]}, {"l": "Phi 2:20", "n": "", "vs": [[20, "فليس عندي أحد غيره يهتم مثلي بأحوالكم بإخلاص."]]}, {"l": "Phi 3:15", "n": "", "vs": [[15, "جميع البالغين فينا، ليكن فيهم هذا الفكر. وإن كان فيكم غير هذا الفكر، فذلك أيضا سيكشفه لكم الله ."]]}, {"l": "Phi 3:16", "n": "", "vs": [[16, "إنما، لنواصل السير من حيث قد وصلنا، في المنهج نفسه."]]}, {"l": "Phi 4:2", "n": "", "vs": [[2, "أحث أفودية، كما أحث سنتيخي، أن يكون لهما، في الرب، فكر واحد،"]]}, {"l": "Rom 12:16", "n": "", "vs": [[16, "كونوا متوافقين بعضكم مع بعض، غير مهتمين بالأمور العالية، بل مسايرين ذوي المراكز الوضيعة. لا تكونوا حكماء في نظر أنفسكم."]]}, {"l": "Rom 15:5", "n": "", "vs": [[5, "وليعطكم إله الصبر والتعزية أن تكونوا متوافقين بعضكم مع بعض بحسب المسيح يسوع،"]]}, {"l": "Rom 15:6", "n": "", "vs": [[6, "لكي تمجدوا الله أبا ربنا يسوع المسيح بنفس واحدة وفم واحد."]]}, {"l": "1Co 1:10", "n": "", "vs": [[10, "على أنني أيها الإخوة، أتوسل إليكم باسم ربنا يسوع المسيح أن يكون لجميعكم صوت واحد وأن لا يكون بينكم أي انقسام. وإنما كونوا جميعا موحدي الفكر والرأي."]]}, {"l": "2Co 13:11", "n": "", "vs": [[11, "وأخيرا، أيها الإخوة: افرحوا؛ تكملوا؛ تشجعوا؛ اتفقوا في الرأي؛ عيشوا بسلام. وإله المحبة والسلام سيكون معكم!"]]}, {"l": "1Pe 3:8", "n": "", "vs": [[8, "والخلاصة، كونوا جميعا متحدين في الرأي، متعاطفين بعضكم مع بعض، مبادلين أحدكم الآخر المحبة الأخوية، شفوقين، متواضعين."]]}, {"l": "1Pe 3:9", "n": "", "vs": [[9, "لا تبادلوا الشر بشر، ولا الشتيمة بشتيمة. بل بالعكس: باركوا، فترثوا البركة، لأنه لهذا دعاكم الله ."]]}], "kwAr": "رأي واحد", "noteAr": "متّفقين في الفكر."}, {"kw": "one accord", "raw": "Act_1:14, Act_2:1, Act_2:46, Act_5:12", "note": "", "refs": [{"l": "Act 1:14", "n": "", "vs": [[14, "وكانوا جميعا يداومون على الصلاة بقلب واحد، ومعهم بعض النساء، ومريم أم يسوع، وإخوته."]]}, {"l": "Act 2:1", "n": "", "vs": [[1, "ولما جاء اليوم الخمسون، كان الإخوة مجتمعين معا في مكان واحد،"]]}, {"l": "Act 2:46", "n": "", "vs": [[46, "ويداومون على الحضور إلى الهيكل يوميا بقلب واحد، ويكسرون الخبز في البيوت، ويتناولون الطعام معا بابتهاج وبساطة قلب،"]]}, {"l": "Act 5:12", "n": "", "vs": [[12, "وجرت على أيدي الرسل معجزات وعجائب كثيرة بين الشعب. وكانوا كلهم يجتمعون بقلب واحد في قاعة سليمان بالهيكل."]]}], "kwAr": "ونفس واحدة", "noteAr": ""}], "arS": [["فتمموا", ["G4137"]], [" ", []], ["فرحي", ["G5479", "G3450"]], [" بأن يكون لكم ", []], ["رأي", ["G5426"]], [" واحد ", []], ["ومحبة", ["G26"]], [" واحدة ", []], ["ونفس واحدة", ["G4861"]], [" ", []], ["وفكر", ["G5426"]], [" ", []], ["واحد", ["G1520"]], [".", []]]}, {"c": 2, "v": 3, "text": "لا يكن بينكم شيء بروح التحزب والافتخار الباطل، بل بالتواضع ليعتبر كل واحد منكم غيره أفضل كثيرا من نفسه،", "groups": [{"kw": "nothing", "raw": "Phi_2:14, Phi_1:15, Phi_1:16; Pro_13:10; Rom_13:13; 1Co_3:3; 2Co_12:20; Gal_5:15, Gal_5:20,Gal_5:21, Gal_5:26; Col_3:8; 1Ti_6:4; Jam_3:14-16, Jam_4:5, Jam_4:6; 1Pe_2:1, 1Pe_2:2", "note": "", "refs": [{"l": "Phi 2:14", "n": "", "vs": [[14, "فافعلوا كل شيء دون تذمر أو جدال،"]]}, {"l": "Phi 1:15", "n": "", "vs": [[15, "حقا أن بعضهم يبشرون بالمسيح عن حسد ونزاع؛ وأما الآخرون فعن حسن نية."]]}, {"l": "Phi 1:16", "n": "", "vs": [[16, "فهؤلاء تدفعهم المحبة، عالمين أني قد عينت للدفاع عن الإنجيل؛"]]}, {"l": "Pro 13:10", "n": "", "vs": [[10, "تولد الكبرياء الخصومة، أما المشاورون فذوو حكمة."]]}, {"l": "Rom 13:13", "n": "", "vs": [[13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."]]}, {"l": "1Co 3:3", "n": "", "vs": [[3, "فإنكم مازلتم جسديين. فمادام بينكم حسد وخصام (وانقسام)، أفلا تكونون جسديين وتسلكون وفقا للبشر؟"]]}, {"l": "2Co 12:20", "n": "", "vs": [[20, "فإني أخشى أن آتي إليكم فأجدكم في حالة لا أريدها وتجدوني في حالة لا تريدونها! أي أن يكون بينكم كثير من النزاع والحسد والحقد والتحزب والتجريح والنميمة والتكبر والبلبلة."]]}, {"l": "Gal 5:15", "n": "", "vs": [[15, "فإذا كنتم تنهشون وتفترسون بعضكم بعضا، فاحذروا أن يفني أحدكم الآخر!"]]}, {"l": "Gal 5:20", "n": "", "vs": [[20, "وعبادة الأصنام والسحر، والعداوة والنزاع والغيرة والغضب، والتحزب والانقسام والتعصب،"]]}, {"l": "Gal 5:21", "n": "", "vs": [[21, "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!"]]}, {"l": "Gal 5:26", "n": "", "vs": [[26, "لا نكن طامحين إلى المجد الباطل، يستفز بعضنا بعضا، ويحسد أحدنا الآخر!"]]}, {"l": "Col 3:8", "n": "", "vs": [[8, "وأما الآن، فانزعوا عنكم، أنتم أيضا، هذه الخطايا كلها: الغضب، النقمة، الخبث، التجديف، الكلام القبيح الخارج من أفواهكم."]]}, {"l": "1Ti 6:4", "n": "", "vs": [[4, "فهو قد انتفخ تكبرا، ولا يعرف شيئا، وإنما هو مهووس بالمجادلات والمنازعات الكلامية، ومنها ينشأ الحسد والخصام والتجريح والنيات السيئة،"]]}, {"l": "Jam 3:14-16", "n": "", "vs": [[14, "أما إن كانت قلوبكم مملوءة بمرارة الحسد وبالتحزب، فلا تفتخروا بحكمتكم، ولا تنكروا الحق."], [15, "إن هذه الحكمة التي تدعونها ليست نازلة من عند الله، بل هي «حكمة» أرضية بشرية شيطانية."], [16, "فحيث تكون مرارة الحسد والتحزب، ينتشر الخلاف والفوضى وجميع الشرور."]]}, {"l": "Jam 4:5", "n": "", "vs": [[5, "أتظنون أن الكتاب يتكلم عبثا! هل الروح الذي حل في داخلنا يغار عن حسد؟"]]}, {"l": "Jam 4:6", "n": "", "vs": [[6, "لا، بل إنه يجود علينا بنعمة أعظم. لذلك يقول الكتاب: «إن الله يقاوم المتكبرين، ولكنه يعطي المتواضعين نعمة»."]]}, {"l": "1Pe 2:1", "n": "", "vs": [[1, "لذلك، تخلصوا من كل أثر للشر والخداع والرياء والحسد والذم."]]}, {"l": "1Pe 2:2", "n": "", "vs": [[2, "وكأطفال مولودين حديثا، تشوقوا إلى اللبن الروحي النقي لكي تنموا به إلى أن تبلغوا الخلاص،"]]}], "kwAr": "لا يكن بينكم شيء بروح التحزب", "noteAr": ""}, {"kw": "but", "raw": "Luk_14:7-11, Luk_18:14; Rom_12:10; 1Co_15:9; Eph_4:2, Eph_5:21; 1Pe_5:5", "note": "", "refs": [{"l": "Luk 14:7-11", "n": "", "vs": [[7, "وضرب للمدعوين مثلا بعدما لاحظ كيف اختاروا أماكن الصدارة، فقال لهم:"], [8, "«عندما يدعوك أحد إلى وليمة عرس، فلا تتكيء في مكان الصدارة، إذ ربما كان قد دعا إليه من هو أرفع منك مقاما،"], [9, "فيأتي الذي دعاك ودعاه ويقول لك: أخل المكان لهذا الرجل! وعندئذ تنسحب بخجل لتأخذ المكان الأخير."], [10, "ولكن، عندما تدعى، فاذهب واتكيء في المكان الأخير، حتى إذا جاء الذي دعاك، يقول لك: ياصديقي، قم إلى الصدر! وعندئذ يرتفع قدرك في نظر المتكئين معك."], [11, "فإن كل من يرفع نفسه يوضع، ومن يضع نفسه يرفع»."]]}, {"l": "Luk 18:14", "n": "", "vs": [[14, "أقول لكم: إن هذا الإنسان نزل إلى بيته مبررا، بعكس الآخر. فإن كل من يرفع نفسه يوضع؛ ومن يضع نفسه يرفع»."]]}, {"l": "Rom 12:10", "n": "", "vs": [[10, "أحبوا بعضكم بعضا محبة أخوية، مفضلين بعضكم على بعض في الكرامة."]]}, {"l": "1Co 15:9", "n": "", "vs": [[9, "فإني أنا أصغر الرسل شأنا، ولست أهلا لأن أدعى رسولا لأني اضطهدت كنيسة الله."]]}, {"l": "Eph 4:2", "n": "", "vs": [[2, "بكل تواضع ووداعة وطول بال، محتملين بعضكم بعضا في المحبة،"]]}, {"l": "Eph 5:21", "n": "", "vs": [[21, "خاضعين بعضكم لبعض في مخافة المسيح."]]}, {"l": "1Pe 5:5", "n": "", "vs": [[5, "كذلك، أيها الشباب، اخضعوا للشيوخ. البسوا جميعا ثوب التواضع في معاملتكم بعضكم لبعض. لأن الله يقاوم المتكبرين، ولكنه يعطي المتواضعين نعمة."]]}], "kwAr": "بل بالتواضع", "noteAr": ""}], "arS": [["لا يكن بينكم ", []], ["شيء", ["G3367"]], [" بروح ", []], ["التحزب", ["G2052"]], [" ", []], ["والافتخار الباطل", ["G2754"]], ["، بل ", []], ["بالتواضع", ["G5012"]], [" ", []], ["ليعتبر", ["G2233"]], [" كل واحد منكم غيره ", []], ["أفضل", ["G5242"]], [" كثيرا من ", []], ["نفسه", ["G1438"]], ["،", []]]}, {"c": 2, "v": 4, "text": "مهتما لا بمصلحته الخاصة بل بمصالح الآخرين أيضا.", "groups": [{"kw": "", "raw": "Mat_18:6; Rom_12:15, Rom_14:19-22, Rom_15:1; 1Co_8:9-13, 1Co_10:24, 1Co_10:32, 1Co_10:33, 1Co_12:22-26; 1Co_13:4, 1Co_13:5; 2Co_6:3, 2Co_11:29; Jam_2:8", "note": "", "refs": [{"l": "Mat 18:6", "n": "", "vs": [[6, "ومن كان عثرة لأحد هؤلاء الصغار المؤمنين بي، فأفضل له لو علق في عنقه حجر الرحى وأغرق في أعماق البحر."]]}, {"l": "Rom 12:15", "n": "", "vs": [[15, "افرحوا مع الفرحين، وابكوا مع الباكين."]]}, {"l": "Rom 14:19-22", "n": "", "vs": [[19, "فلنسع إذن وراء ما يؤدي إلى السلام وما يؤدي إلى بنيان بعضنا بعضا."], [20, "لا تدمر عمل الله بسبب الطعام! حقا إن الأطعمة كلها طاهرة، ولكن الشر في أن يأكل الإنسان شيئا يسبب العثرة."], [21, "فمن الصواب ألا تأكل لحما ولا تشرب خمرا، ولا تفعل شيئا يتعثر فيه أخوك."], [22, "ألك اقتناع ما؟ فليكن لك ذلك بنفسك أمام الله! طوبى لمن لا يدين نفسه في ما يستحسنه."]]}, {"l": "Rom 15:1", "n": "", "vs": [[1, "ولكن علينا نحن الأقوياء (في الإيمان)، أن نحتمل ضعف الضعفاء (فيه)، وأن لا نرضي أنفسنا."]]}, {"l": "1Co 8:9-13", "n": "", "vs": [[9, "ولكن خذوا حذركم لكي لا يكون حقكم هذا فخا يسقط فيه الضعفاء."], [10, "فياصاحب المعرفة، إن رآك أحد جالسا إلى الطعام في هيكل للأصنام، أفلا يتقوى ضميره، هو الضعيف، ليأكل من ذبائح الأصنام،"], [11, "وبذلك يتدمر ذلك الضعيف، وهو أخ لك مات المسيح من أجله، بسبب معرفتك!"], [12, "فإذ تخطئون هكذا إلى الإخوة فتجرحون ضمائرهم الضعيفة، إنما تخطئون إلى المسيح."], [13, "لذا، إن كان بعض الطعام فخا يسقط فيه أخي، فلن آكل لحما أبدا، لكي لا أسقط أخي!"]]}, {"l": "1Co 10:24", "n": "", "vs": [[24, "فلا يسع أحد إلى مصلحة نفسه، بل إلى مصلحة غيره!"]]}, {"l": "1Co 10:32", "n": "", "vs": [[32, "لا تضعوا عائقا يسبب السقوط لأحد، سواء من اليهود أم اليونانيين أم كنيسة الله."]]}, {"l": "1Co 10:33", "n": "", "vs": [[33, "فهكذا أنا أيضا أسعى لإرضاء الجميع في كل شيء، ولا أهتم بمصلحتي الخاصة، بل بمصلحة الكثيرين، لكي يخلصوا."]]}, {"l": "1Co 12:22-26", "n": "", "vs": [[22, "بل بالأحرى جدا، أعضاء الجسد التي تبدو أضعف الأعضاء هي ضرورية،"], [23, "وتلك التي نعتبرها أقل ما في الجسد كرامة، نكسوها بإكرام أوفر. والأعضاء غير اللائقة يكون لها لياقة أوفر؛"], [24, "أما اللائقة، فلا تحتاج إلى ذلك. ولكن الله أحكم صنع الجسد بجملته، معطيا كرامة أوفر لما تنقصه الكرامة،"], [25, "لكي لا يكون في الجسد انقسام بل يكون بين الأعضاء اهتمام واحد لمصلحة الجسد."], [26, "فحين يصيب الألم واحدا من الأعضاء، تشعر الأعضاء الباقية معه بالألم. وحين ينال واحد من الأعضاء إكراما، تفرح معه الأعضاء الباقية."]]}, {"l": "1Co 13:4", "n": "", "vs": [[4, "المحبة تصبر طويلا؛ وهي لطيفة. المحبة لا تحسد. المحبة لا تتفاخر ولا تتكبر."]]}, {"l": "1Co 13:5", "n": "", "vs": [[5, "لا تتصرف بغير لياقة، ولا تسعى إلى مصلحتها الخاصة. لا تستفز سريعا، ولا تنسب الشر لأحد."]]}, {"l": "2Co 6:3", "n": "", "vs": [[3, "ولسنا نتصرف أي تصرف يكون عثرة لأحد، حتى لا يلحق الخدمة أي لوم."]]}, {"l": "2Co 11:29", "n": "", "vs": [[29, "أهنالك من يضعف ولا أضعف أنا، ومن يتعثر ولا أحترق أنا؟"]]}, {"l": "Jam 2:8", "n": "", "vs": [[8, "ما أحسن عملكم حين تطبقون تلك القاعدة الملوكية الواردة في الكتاب: «تحب قريبك كما تحب نفسك!»"]]}], "kwAr": "", "noteAr": ""}], "arS": [["مهتما", ["G4648"]], [" لا ", []], ["بمصلحته", ["G1438"]], [" الخاصة بل ", []], ["بمصالح", ["G2087"]], [" الآخرين أيضا.", []]]}, {"c": 2, "v": 5, "text": "فليكن فيكم هذا الفكر الذي هو أيضا في المسيح يسوع.", "groups": [{"kw": "", "raw": "Mat_11:29, Mat_20:26-28; Luk_22:27; Joh_13:14, Joh_13:15; Act_10:38, Act_20:35; Rom_14:15, Rom_15:3, Rom_15:5; 1Co_10:33, 1Co_11:1; Eph_5:2; 1Pe_2:21, 1Pe_4:1; 1Jo_2:6", "note": "", "refs": [{"l": "Mat 11:29", "n": "", "vs": [[29, "احملوا نيري عليكم، وتتلمذوا على يدي، لأني وديع ومتواضع القلب، فتجدوا الراحة لنفوسكم."]]}, {"l": "Mat 20:26-28", "n": "", "vs": [[26, "وأما أنتم، فلا يكن ذلك بينكم، وإنما أي من أراد أن يصير عظيما بينكم، فليكن لكم خادما،"], [27, "وأي من أراد أن يصير أولا فيكم، فليكن لكم عبدا،"], [28, "فهكذا ابن الإنسان: قد جاء لا ليخدم، بل ليخدم ويبذل نفسه فدية عن كثيرين. »"]]}, {"l": "Luk 22:27", "n": "", "vs": [[27, "فمن هو أعظم: الذي يتكيء أم الذي يخدم؟ أليس الذي يتكيء؟ ولكني أنا في وسطكم كالذي يخدم."]]}, {"l": "Joh 13:14", "n": "", "vs": [[14, "فإن كنت، وأنا السيد والمعلم، قد غسلت أقدامكم، فعليكم أنتم أيضا أن يغسل بعضكم أقدام بعض."]]}, {"l": "Joh 13:15", "n": "", "vs": [[15, "فقد قدمت لكم مثالا لكي تعملوا مثل ما عملت أنا لكم."]]}, {"l": "Act 10:38", "n": "", "vs": [[38, "فقد مسح الله يسوع الناصري بالروح القدس وبالقدرة، فكان ينتقل من مكان إلى مكان يعمل الخير، ويشفي جميع الذين تسلط عليهم إبليس، لأن الله كان معه."]]}, {"l": "Act 20:35", "n": "", "vs": [[35, "وقد أظهرت لكم بوضوح كيف يجب أن نبذل الجهد لنساعد المحتاجين، متذكرين كلمات الرب يسوع، إذ قال: الغبطة في العطاء أكثر مما في الأخذ!»"]]}, {"l": "Rom 14:15", "n": "", "vs": [[15, "فإن كنت بطعامك تسبب الحزن لأخيك، فلست تسلك بعد بما يتفق مع المحبة. لا تدمر بطعامك من لأجله مات المسيح."]]}, {"l": "Rom 15:3", "n": "", "vs": [[3, "فحتى المسيح لم يسع لإرضاء نفسه، بل وفقا لما قد كتب: «تعييرات الذين يعيرونك وقعت علي»."]]}, {"l": "Rom 15:5", "n": "", "vs": [[5, "وليعطكم إله الصبر والتعزية أن تكونوا متوافقين بعضكم مع بعض بحسب المسيح يسوع،"]]}, {"l": "1Co 10:33", "n": "", "vs": [[33, "فهكذا أنا أيضا أسعى لإرضاء الجميع في كل شيء، ولا أهتم بمصلحتي الخاصة، بل بمصلحة الكثيرين، لكي يخلصوا."]]}, {"l": "1Co 11:1", "n": "", "vs": [[1, "فاقتدوا بي كما أقتدي أنا بالمسيح!"]]}, {"l": "Eph 5:2", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."]]}, {"l": "1Pe 2:21", "n": "", "vs": [[21, "لأن الله دعاكم إلى الاشتراك في هذا النوع من الآلام. فالمسيح، الذي تألم لأجلكم، هو القدوة التي تقتدون بها. فسيروا على آثار خطواته:"]]}, {"l": "1Pe 4:1", "n": "", "vs": [[1, "فبما أن المسيح قد تحمل الآلام الجسمية لأجلكم، سلحوا أنفسكم بالاستعداد دائما لتحمل الآلام. فإن من يتحمل الآلام الجسمية، يكون قد قاطع الخطيئة."]]}, {"l": "1Jo 2:6", "n": "", "vs": [[6, "كل من يعترف أنه ثابت في المسيح، يلتزم أن يسلك كما سلك المسيح!"]]}], "kwAr": "", "noteAr": ""}], "arS": [["فليكن فيكم هذا ", []], ["الفكر", ["G5426"]], [" الذي هو أيضا في ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [".", []]]}, {"c": 2, "v": 6, "text": "إذ إنه، وهو الكائن في هيئة الله، لم يعتبر مساواته لله خلسة، أو غنيمة يتمسك بها؛", "groups": [{"kw": "in", "raw": "Isa_7:14, Isa_8:8, Isa_9:6; Jer_23:6; Mic_5:2; Mat_1:23; Joh_1:1, Joh_1:2, Joh_1:18, Joh_17:5; Rom_9:5; 2Co_4:4; Col_1:15, Col_1:16; 1Ti_1:17, 1Ti_3:16; Tit_2:13; Heb_1:3, Heb_1:6, Heb_1:8; Heb_13:8", "note": "", "refs": [{"l": "Isa 7:14", "n": "", "vs": [[14, "ولكن السيد نفسه يعطيكم آية: ها العذراء تحبل وتلد ابنا، وتدعو اسمه عمانوئيل."]]}, {"l": "Isa 8:8", "n": "", "vs": [[8, "فيكتسح أرض يهوذا، ويطفو مرتفعا إلى الأعناق، وتنتشر جيوشه في عرض أرضك ياعمانوئيل»."]]}, {"l": "Isa 9:6", "n": "", "vs": [[6, "لأنه يولد لنا ولد ويعطى لنا ابن يحمل الرياسة على كتفه، ويدعى اسمه عجيبا، مشيرا، إلها قديرا، أبا أبديا، رئيس السلام."]]}, {"l": "Jer 23:6", "n": "", "vs": [[6, "في عهده يتم خلاص شعب يهوذا، ويسكن شعب إسرائيل آمنا. أما الاسم الذي سيدعى به فهو: الرب برنا."]]}, {"l": "Mic 5:2", "n": "", "vs": [[2, "أما أنت يابيت لحم أفراتة، مع أنك قرية صغيرة بين ألوف قرى يهوذا، إلا أن منك يخرج لي من يصبح ملكا في إسرائيل وأصله منذ القديم، منذ الأزل."]]}, {"l": "Mat 1:23", "n": "", "vs": [[23, "«ها إن العذراء تحبل، وتلد ابنا، ويدعى عمانوئيل!» أي «الله معنا»."]]}, {"l": "Joh 1:1", "n": "", "vs": [[1, "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."]]}, {"l": "Joh 1:2", "n": "", "vs": [[2, "هو كان في البدء عند الله."]]}, {"l": "Joh 1:18", "n": "", "vs": [[18, "ما من أحد رأى الله قط. ولكن الابن الوحيد، الذي في حضن الآب، هو الذي كشف عنه."]]}, {"l": "Joh 17:5", "n": "", "vs": [[5, "فمجدني في حضرتك الآن، أيها الآب، بما كان لي من مجد عندك قبل تكوين العالم."]]}, {"l": "Rom 9:5", "n": "", "vs": [[5, "ومنهم كان الآباء ومنهم جاء المسيح حسب الجسد، وهو فوق الجميع الله المبارك إلى الأبد. آمين."]]}, {"l": "2Co 4:4", "n": "", "vs": [[4, "الذين أعمى إله هذا العالم أذهانهم حتى لا يضيء لهم نور الإنجيل المختص بمجد المسيح الذي هو صورة الله."]]}, {"l": "Col 1:15", "n": "", "vs": [[15, "هو صورة الله الذي لا يرى، والبكر على كل ما قد خلق،"]]}, {"l": "Col 1:16", "n": "", "vs": [[16, "إذ به خلقت جميع الأشياء: ما في السماوات وما على الأرض، ما يرى وما لا يرى، أعروشا كانت أم سيادات أم رئاسات أم سلطات. كل ما في الكون قد خلق به ولأجله."]]}, {"l": "1Ti 1:17", "n": "", "vs": [[17, "فللملك الأزلي، الله الواحد غير المنظور وغير الفاني، الكرامة والمجد إلى أبد الآبدين. آمين!"]]}, {"l": "1Ti 3:16", "n": "", "vs": [[16, "وباعتراف الجميع، أن سر التقوى عظيم: الله ظهر في الجسد، شهد الروح لبره، شاهدته الملائكة، بشر به بين الأمم، أومن به في العالم، ثم رفع في المجد."]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "Heb 1:3", "n": "", "vs": [[3, "إنه ضياء مجد الله وصورة جوهره. حافظ كل ما في الكون بكلمته القديرة. وهو الذي بعدما طهرنا بنفسه من خطايانا،"]]}, {"l": "Heb 1:6", "n": "", "vs": [[6, "وعندما يعيد الله ابنه البكر إلى العالم، يقول: «ولتسجد له ملائكة الله جميعا!»"]]}, {"l": "Heb 1:8", "n": "", "vs": [[8, "ولكنه يخاطب الابن قائلا: «إن عرشك، ياالله، ثابت إلى أبد الآبدين، وصولجان حكمك عادل ومستقيم."]]}, {"l": "Heb 13:8", "n": "", "vs": [[8, "يسوع المسيح هو هو أمسا واليوم وإلى الأبد."]]}], "kwAr": "في هيئة الله", "noteAr": ""}, {"kw": "thought", "raw": "Gen_32:24-30, Gen_48:15, Gen_48:16; Eze_8:2-6; Jos_5:13-15; Hos_12:3-5; Zec_13:7; Joh_5:18, Joh_5:23, Joh_8:58, Joh_8:59, Joh_10:30,Joh_10:33, Joh_10:38, Joh_14:9, Joh_20:28; Rev_1:17, Rev_1:18, Rev_21:6", "note": "", "refs": [{"l": "Gen 32:24-30", "n": "", "vs": [[24, "وبقي وحده، صارعه إنسان حتى مطلع الفجر."], [25, "وعندما رأى أنه لم يتغلب على يعقوب، ضربه على حق فخذه، فانخلع مفصل فخذ يعقوب في مصارعته معه."], [26, "وقال له: «أطلقني، فقد طلع الفجر». فأجابه يعقوب: «لا أطلقك حتى تباركني»."], [27, "فسأله: «ما اسمك؟» فأجاب: «يعقوب»."], [28, "فقال: «لا يدعى اسمك في ما بعد يعقوب، بل إسرائيل (ومعناه: يجاهد مع الله)، لأنك جاهدت مع الله والناس وقدرت»."], [29, "فسأله يعقوب: «أخبرني ما اسمك؟» فقال: «لماذا تسأل عن اسمي؟» وباركه هناك."], [30, "ودعا يعقوب اسم المكان فنيئيل (ومعناه: وجه الله) إذ قال: «لأني شاهدت الله وجها لوجه وبقيت حيا»."]]}, {"l": "Gen 48:15", "n": "", "vs": [[15, "وبارك يوسف قائلا: «إن الله الذي سلك أمامه أبواي إبراهيم وإسحق، الله الذي رعاني منذ وجودي إلى هذا اليوم،"]]}, {"l": "Gen 48:16", "n": "", "vs": [[16, "الملاك الذي أنقذني من كل شر، يبارك الغلامين، وليدع عليهما اسمي واسما أبوي إبراهيم وإسحق، وليكثرا كثيرا في الأرض»."]]}, {"l": "Eze 8:2-6", "n": "", "vs": [[2, "فنظرت وإذا بشبه إنسان وكأنه من نار، وبدا وكأن نارا تتأجج من حقويه إلى أسفل. أما من حقويه فما فوق فبدا لمعان كلمعان النحاس المتألق."], [3, "ثم مد شبه يد وقبض علي بناصية رأسي، وحلق بي روح بين الأرض والسماء وأحضرني في رؤى الله إلى أورشليم، إلى مدخل البوابة الشمالية للساحة الداخلية، حيث ينتصب التمثال المثير للغيرة."], [4, "فإذا بمجد إله إسرائيل حال هناك كما كان حالا في الرؤيا التي شاهدتها في السهل."], [5, "ثم خاطبني: «ياابن آدم، التفت الآن نحو الشمال». فالتفت وإذا بي أرى من شمالي باب المذبح تمثال الغيرة هذا منتصبا في المدخل."], [6, "وقال لي: «ياابن آدم، هل شاهدت ما يرتكبون: هذه الرجاسات الفظيعة التي يقترفها شعب إسرائيل ليبعدوني عن مقدسي؟ ولكن انتظر، فلا تلبث أن تشهد أرجاسا أفظع»."]]}, {"l": "Jos 5:13-15", "n": "", "vs": [[13, "وفيما كان يشوع قريبا من أريحا تطلع أمامه وإذا به يشاهد رجلا ينتصب في مواجهته، شاهرا سيفه بيده، فاتجه إليه يشوع وسأله: «هل أنت منا أو من أعدائنا؟»"], [14, "فأجابه: «لا، إنما أنا رئيس جند الرب، وقد أقبلت الآن». فأكب يشوع على وجهه إلى الأرض ساجدا وقال: «أي رسالة يحملها سيدي إلى عبده؟»"], [15, "فقال رئيس جند الرب ليشوع: «اخلع نعليك، لأن الموضع الذي أنت واقف عليه مقدس». فنفذ يشوع الأمر."]]}, {"l": "Hos 12:3-5", "n": "", "vs": [[3, "(لكم طمع يعقوب في بركة الرب)، فقبض وهو ما برح في الرحم على عقب أخيه، وفي رجولته جاهد مع الله."], [4, "تصارع مع الملاك وغلب. بكى والتمس رضاه وبركته، التقاه الله في بيت إيل فخاطبه هناك."], [5, "هو الله القدير ويهوه اسمه."]]}, {"l": "Zec 13:7", "n": "", "vs": [[7, "ويقول الرب القدير: «استيقظ أيها السيف وهاجم راعي ورجل رفقتي. اضرب الراعي فتتبدد الخراف. ولكني أرد يدي عن الصغار (أي القلة المؤمنة)."]]}, {"l": "Joh 5:18", "n": "", "vs": [[18, "لهذا ازداد سعي اليهود إلى قتله، ليس فقط لأنه خالف سنة السبت، بل أيضا لأنه قال إن الله أبوه، مساويا نفسه بالله."]]}, {"l": "Joh 5:23", "n": "", "vs": [[23, "ليكرم الجميع الابن كما يكرمون الآب. ومن لا يكرم الابن لا يكرم الآب الذي أرسله."]]}, {"l": "Joh 8:58", "n": "", "vs": [[58, "أجابهم: الحق الحق أقول لكم: إنني كائن من قبل أن يكون إبراهيم»."]]}, {"l": "Joh 8:59", "n": "", "vs": [[59, "فرفعوا حجارة ليرجموه، ولكنه أخفى نفسه وخرج من الهيكل."]]}, {"l": "Joh 10:30", "n": "", "vs": [[30, "أنا والآب واحد!»"]]}, {"l": "Joh 10:33", "n": "", "vs": [[33, "أجابوه: «لا نرجمك بسبب أي عمل صالح، بل بسبب تجديفك: لأنك تجعل نفسك الله ، وأنت إنسان!»"]]}, {"l": "Joh 10:38", "n": "", "vs": [[38, "أما إن كنت أفعل ذلك، فصدقوا تلك الأعمال، إن كنتم لا تصدقونني أنا. عندئذ تعرفون ويتأكد لكم أن الآب في وأنا فيه»."]]}, {"l": "Joh 14:9", "n": "", "vs": [[9, "فأجابه يسوع: «مضت هذه المدة الطويلة وأنا معكم ولم تعرفني يافيلبس؟ الذي رآني رأى الآب، فكيف تقول: أرنا الآب؟"]]}, {"l": "Joh 20:28", "n": "", "vs": [[28, "فهتف توما: «ربي وإلهي»."]]}, {"l": "Rev 1:17", "n": "", "vs": [[17, "فلما رأيته ارتميت عند قدميه كالميت، فلمسني بيده اليمنى وقال: «لا تخف! أنا الأول والآخر،"]]}, {"l": "Rev 1:18", "n": "", "vs": [[18, "أنا الحي. كنت ميتا، ولكن ها أنا حي إلى أبد الآبدين. ولي مفاتيح الموت والهاوية."]]}, {"l": "Rev 21:6", "n": "", "vs": [[6, "ثم قال: «قد تم. أنا الألف والياء (البداية والنهاية). أنا أسقي العطشان من ينبوع ماء الحياة مجانا."]]}], "kwAr": "لم يعتبر مساواته لله خلسة", "noteAr": ""}], "arS": [["إذ إنه، وهو ", []], ["الكائن", ["G5225"]], [" في ", []], ["هيئة", ["G3444"]], [" ", []], ["الله", ["G2316"]], ["، لم ", []], ["يعتبر", ["G2233"]], [" ", []], ["مساواته", ["G2470"]], [" ", []], ["لله", ["G2316"]], [" ", []], ["خلسة", ["G725"]], ["، أو غنيمة يتمسك بها؛", []]]}, {"c": 2, "v": 7, "text": "بل أخلى نفسه، متخذا صورة عبد، صائرا شبيها بالبشر؛", "groups": [{"kw": "made", "raw": "Psa_22:6; Isa_49:7, Isa_50:5, Isa_50:6, Isa_52:14, Isa_53:2, Isa_53:3; Dan_9:26; Zec_9:9; Mar_9:12; Rom_15:3; 2Co_8:9; Heb_2:9-18, Heb_12:2, Heb_13:3", "note": "", "refs": [{"l": "Psa 22:6", "n": "", "vs": [[6, "أما أنا فدودة لا إنسان. عار في نظر البشر، ومنبوذ في عيني شعبي."]]}, {"l": "Isa 49:7", "n": "", "vs": [[7, "وهذا ما يقوله الرب فادي إسرائيل وقدوسه لمن صار محتقرا ومرذولا لدى الأمم وعبدا للمتسلطين: يراك الملوك وينهضون، ويسجد لك الرؤساء من أجل الرب الأمين، قدوس إسرائيل الذي اصطفاك."]]}, {"l": "Isa 50:5", "n": "", "vs": [[5, "قد فتح السيد الرب أذني فلم أعاند أو أتراجع إلى الوراء"]]}, {"l": "Isa 50:6", "n": "", "vs": [[6, "بذلت ظهري للضاربين، وخدي للناتفين، ولم أحجب وجهي عن الإهانة والبصق."]]}, {"l": "Isa 52:14", "n": "", "vs": [[14, "وكما دهش منه كثيرون، إذ تشوه منظره أكثر من أي رجل، وصورته أكثر من بني البشر،"]]}, {"l": "Isa 53:2", "n": "", "vs": [[2, "نما كبرعم أمامه، وكجذر في أرض يابسة، لا صورة له ولا جمال يسترعيان نظرنا، ولا منظر فنشتهيه."]]}, {"l": "Isa 53:3", "n": "", "vs": [[3, "محتقر ومنبوذ من الناس، رجل آلام ومختبر الحزن، مخذول كمن حجب الناس عنه وجوههم فلم نأبه له."]]}, {"l": "Dan 9:26", "n": "", "vs": [[26, "وبعد اثنين وستين أسبوعا يقتل المسيح، ولكن ليس من أجل نفسه، ويدمر شعب رئيس آت المدينة والقدس، وتقبل آخرتها كطوفان، وتستمر الحرب حتى النهاية، ويعم الخراب المقضي به."]]}, {"l": "Zec 9:9", "n": "", "vs": [[9, "»ابتهجي جدا ياابنة صهيون واهتفي ياابنة أورشليم، لأن هوذا ملكك مقبل إليك. هو عادل ظافر، ولكنه وديع راكب على أتان، على جحش ابن أتان."]]}, {"l": "Mar 9:12", "n": "", "vs": [[12, "فأجابهم: «حقا، إن إيليا يأتي قبلا ويصلح كل شيء. كذلك جاء في الكتاب أن ابن الإنسان لابد أن يتألم كثيرا ويهان."]]}, {"l": "Rom 15:3", "n": "", "vs": [[3, "فحتى المسيح لم يسع لإرضاء نفسه، بل وفقا لما قد كتب: «تعييرات الذين يعيرونك وقعت علي»."]]}, {"l": "2Co 8:9", "n": "", "vs": [[9, "فأنتم تعرفون نعمة ربنا يسوع المسيح: فمن أجلكم افتقر، وهو الغني لكي تغتنوا أنتم بفقره."]]}, {"l": "Heb 2:9-18", "n": "", "vs": [[9, "إلا أننا نرى يسوع الآن مكللا بالمجد والكرامة، لأنه قاسى الموت. وذلك بعدما صار أدنى من الملائكة إلى حين، ليذوق بنعمة الله الموت عوضا عن كل واحد."], [10, "فلما قصد الله ، الذي من أجله كل شيء وبه كل شيء، أن يحضر إلى المجد أبناء كثيرين، كان من اللائق أن يجعل قائدهم إلى الخلاص مؤهلا لإكمال مهمته عن طريق الآلام."], [11, "فإن للمسيح الذي يقدس المؤمنين به، وللمقدسين أنفسهم، أبا واحدا. لهذا، لا يستحي المسيح أن يدعو المؤمنين به إخوة له."], [12, "إذ يقول الكتاب بلسانه: «أعلن اسمك لإخوتي. وأسبحك في وسط الجماعة!»"], [13, "ويقول أيضا: «وأنا أكون متوكلا عليه!» وأيضا: «ها أنا مع الأولاد الذين وهبهم الله لي!»"], [14, "إذن، بما أن هؤلاء الأولاد متشاركون في أجسام بشرية من لحم ودم، اشترك المسيح أيضا في اللحم والدم باتخاذه جسما بشريا. وهكذا تمكن أن يموت، ليقضي على من له سلطة الموت، أي إبليس،"], [15, "ويحرر من كان الخوف من الموت يستعبدهم طوال حياتهم."], [16, "نعم، كانت غايته أن ينقذ لا الملائكة بل نسل إبراهيم."], [17, "ولذلك كان لابد أن يشبه إخوته من جميع النواحي، ليكون هو رئيس الكهنة، الرحيم والأمين، الذي يقوم بعمله أمام الله نيابة عن الشعب، فيكفر عن خطاياهم."], [18, "وبما أنه هو نفسه، قد تألم وتعرض للتجارب، فهو قادر أن يعين الذين يتعرضون للتجارب."]]}, {"l": "Heb 12:2", "n": "", "vs": [[2, "متطلعين دائما إلى يسوع: رائد إيماننا ومكمله. فهو قد تحمل الموت صلبا، هازئا بما في ذلك من عار، إذ كان ينظر إلى السرور الذي ينتظره، ثم جلس عن يمين عرش الله."]]}, {"l": "Heb 13:3", "n": "", "vs": [[3, "اهتموا دائما بالمسجونين، كأنكم مسجونون معهم. وتعاطفوا مع المظلومين، كأنكم مظلومون معهم."]]}], "kwAr": "أخلى نفسه", "noteAr": ""}, {"kw": "the form", "raw": "Isa_42:1, Isa_49:3, Isa_49:6, Isa_52:13, Isa_53:11; Eze_34:23, Eze_34:24; Zec_3:8; Mat_12:18; Mat_20:28; Mar_10:44, Mar_10:45; Luk_22:27; Joh_13:3-14; Rom_15:8", "note": "", "refs": [{"l": "Isa 42:1", "n": "", "vs": [[1, "هوذا عبدي الذي أعضده، مختاري الذي ابتهجت به نفسي. وضعت روحي عليه ليسوس الأمم بالعدل."]]}, {"l": "Isa 49:3", "n": "", "vs": [[3, "وقال لي: «أنت عبدي إسرائيل الذي به أتمجد"]]}, {"l": "Isa 49:6", "n": "", "vs": [[6, "لكم هو يسير أن تكون لي عبدا لتستنهض أسباط يعقوب، وترد من نجيت من إسرائيل، لذلك سأجعلك نورا للأمم لتكون خلاصي إلى أقصى الأرض."]]}, {"l": "Isa 52:13", "n": "", "vs": [[13, "ها هو عبدي يفلح، ويتعظم ويتعالى ويتسامى جدا."]]}, {"l": "Isa 53:11", "n": "", "vs": [[11, "ويرى ثمار تعب نفسه ويشبع، وعبدي البار يبرر بمعرفته كثيرين ويحمل آثامهم."]]}, {"l": "Eze 34:23", "n": "", "vs": [[23, "وأنصب عليها راعيا واحدا عبدي داود (أي المسيح) يرعاها بنفسه ويكون لها راعيا أمينا."]]}, {"l": "Eze 34:24", "n": "", "vs": [[24, "وأنا الرب أكون لهم إلها، وعبدي داود يكون لهم رئيسا. أنا الرب تكلمت."]]}, {"l": "Zec 3:8", "n": "", "vs": [[8, "فأصغ يايهوشع رئيس الكهنة أنت وسائر رفاقك الكهنة الجالسين أمامك. أنتم رجال آية وها أنا آتي بعبدي الذي يدعى الغصن."]]}, {"l": "Mat 12:18", "n": "", "vs": [[18, "«ها هو فتاي الذي اخترته، حبيبي الذي سرت به نفسي! سأضع روحي عليه، فيعلن العدل للأمم."]]}, {"l": "Mat 20:28", "n": "", "vs": [[28, "فهكذا ابن الإنسان: قد جاء لا ليخدم، بل ليخدم ويبذل نفسه فدية عن كثيرين. »"]]}, {"l": "Mar 10:44", "n": "", "vs": [[44, "وأي من أراد أن يصير أولا فيكم، فليكن للجميع عبدا."]]}, {"l": "Mar 10:45", "n": "", "vs": [[45, "فحتى ابن الإنسان قد جاء لا ليخدم، بل ليخدم ويبذل نفسه فدية عن كثيرين»."]]}, {"l": "Luk 22:27", "n": "", "vs": [[27, "فمن هو أعظم: الذي يتكيء أم الذي يخدم؟ أليس الذي يتكيء؟ ولكني أنا في وسطكم كالذي يخدم."]]}, {"l": "Joh 13:3-14", "n": "", "vs": [[3, "وكان يسوع عالما أن الآب قد جعل كل شيء في يديه وأنه من الله خرج وإلى الله سيعود،"], [4, "نهض عن مائدة العشاء، وخلع رداءه وأخذ منشفة لفها على وسطه،"], [5, "ثم صب ماء في وعاء للغسل، وبدأ يغسل أقدام التلاميذ ويمسحها بالمنشفة التي على وسطه."], [6, "فلما وصل إلى سمعان بطرس، قال له سمعان: «ياسيد، أنت تغسل قدمي!»"], [7, "فأجابه يسوع: «أنت الآن لا تفهم ما أعمله، ولكنك ستفهم فيما بعد»."], [8, "ولكن بطرس أصر قائلا: «لا، لن تغسل قدمي أبدا!» فأجابه يسوع: «إن كنت لا أغسلك، فلا يكون لك نصيب معي!»"], [9, "عندئذ قال له سمعان بطرس: «ياسيد، لا قدمي فقط، بل يدي ورأسي أيضا!»"], [10, "فقال يسوع: «من اغتسل صار كله نقيا، ولا يحتاج إلا لغسل قدميه. وأنتم أنقياء، ولكن ليس كلكم»."], [11, "فإن يسوع كان يعلم من الذي سيخونه، ولذلك قال: «لستم كلكم أنقياء»."], [12, "وبعدما انتهى من غسل أقدامهم، أخذ رداءه واتكأ من جديد، وسألهم: «أفهمتم ما عملته لكم؟"], [13, "أنتم تدعونني معلما وسيدا، وقد صدقتم، فأنا كذلك."], [14, "فإن كنت، وأنا السيد والمعلم، قد غسلت أقدامكم، فعليكم أنتم أيضا أن يغسل بعضكم أقدام بعض."]]}, {"l": "Rom 15:8", "n": "", "vs": [[8, "فإني أقول إن المسيح صار خادم أهل الختان إظهارا لصدق الله وتوطيدا لوعوده للآباء،"]]}], "kwAr": "صورة عبد", "noteAr": ""}, {"kw": "in the", "raw": "Phi_2:6; Joh_1:14; Rom_1:3, Rom_8:3; Gal_4:4; Heb_2:14-17, Heb_4:15", "note": "", "refs": [{"l": "Phi 2:6", "n": "", "vs": [[6, "إذ إنه، وهو الكائن في هيئة الله، لم يعتبر مساواته لله خلسة، أو غنيمة يتمسك بها؛"]]}, {"l": "Joh 1:14", "n": "", "vs": [[14, "والكلمة صار بشرا، وخيم بيننا، ونحن رأينا مجده، مجد ابن وحيد عند الآب، وهو ممتلىء بالنعمة والحق."]]}, {"l": "Rom 1:3", "n": "", "vs": [[3, "وهو يختص بابنه الذي جاء من نسل داود من الناحية البشرية؛"]]}, {"l": "Rom 8:3", "n": "", "vs": [[3, "فإن ما عجزت الشريعة عنه، لكون الجسد قد جعلها قاصرة عن تحقيقه، أتمه الله إذ أرسل ابنه، متخذا ما يشبه جسد الخطيئة ومكفرا عن الخطيئة فدان الخطيئة في الجسد"]]}, {"l": "Gal 4:4", "n": "", "vs": [[4, "ولكن لما جاء تمام الزمان، أرسل الله ابنه، وقد ولد من امرأة وكان خاضعا للشريعة،"]]}, {"l": "Heb 2:14-17", "n": "", "vs": [[14, "إذن، بما أن هؤلاء الأولاد متشاركون في أجسام بشرية من لحم ودم، اشترك المسيح أيضا في اللحم والدم باتخاذه جسما بشريا. وهكذا تمكن أن يموت، ليقضي على من له سلطة الموت، أي إبليس،"], [15, "ويحرر من كان الخوف من الموت يستعبدهم طوال حياتهم."], [16, "نعم، كانت غايته أن ينقذ لا الملائكة بل نسل إبراهيم."], [17, "ولذلك كان لابد أن يشبه إخوته من جميع النواحي، ليكون هو رئيس الكهنة، الرحيم والأمين، الذي يقوم بعمله أمام الله نيابة عن الشعب، فيكفر عن خطاياهم."]]}, {"l": "Heb 4:15", "n": "", "vs": [[15, "ذلك لأن رئيس الكهنة الذي لنا، ليس عاجزا عن تفهم ضعفاتنا، بل إنه قد تعرض للتجارب التي نتعرض نحن لها، إلا أنه بلا خطية."]]}], "kwAr": "صائرا", "noteAr": ""}, {"kw": "likeness", "raw": "or, habit", "note": "or, habit", "refs": [], "kwAr": "شبيها بالبشر", "noteAr": "أو: هيئة (زيّ)."}], "arS": [["بل ", []], ["أخلى نفسه", ["G2758", "G1438"]], ["، ", []], ["متخذا", ["G2983"]], [" ", []], ["صورة", ["G3444"]], [" ", []], ["عبد", ["G1401"]], ["، ", []], ["صائرا", ["G1096"]], [" ", []], ["شبيها", ["G3667"]], [" ", []], ["بالبشر", ["G444"]], ["؛", []]]}, {"c": 2, "v": 8, "text": "وإذ ظهر بهيئة إنسان، أمعن في الاتضاع، وكان طائعا حتى الموت، موت الصليب.", "groups": [{"kw": "in", "raw": "Mat_17:2; Mar_9:2, Mar_9:3; Luk_9:29", "note": "", "refs": [{"l": "Mat 17:2", "n": "", "vs": [[2, "وتجلى أمامهم، فشع وجهه كالشمس، وصارت ثيابه بيضاء كالنور."]]}, {"l": "Mar 9:2", "n": "", "vs": [[2, "وبعد ستة أيام، أخذ يسوع بطرس ويعقوب ويوحنا وحدهم، وصعد بهم على انفراد إلى جبل عال، حيث تجلى أمامهم،"]]}, {"l": "Mar 9:3", "n": "", "vs": [[3, "وصارت ثيابه لماعة تفوق الثلج بياضا، يعجز أي قصار على الأرض أن يبيض ما يماثلها."]]}, {"l": "Luk 9:29", "n": "", "vs": [[29, "وبينما هو يصلي، تجلت هيئة وجهه وصارت ثيابه بيضاء لماعة."]]}], "kwAr": "بهيئة إنسان", "noteAr": ""}, {"kw": "he", "raw": "Pro_15:33; Act_8:33; Heb_5:5-7, Heb_12:2", "note": "", "refs": [{"l": "Pro 15:33", "n": "", "vs": [[33, "تقوى الرب تأديب حكمة، وقبل الحظوة بالكرامة يكون التواضع."]]}, {"l": "Act 8:33", "n": "", "vs": [[33, "في أثناء تواضعه عومل بغير عدل. من يخبر عن نسله؟ فإن حياته قد انتزعت من الأرض!»"]]}, {"l": "Heb 5:5-7", "n": "", "vs": [[5, "كذلك المسيح لم يرفع نفسه حتى يصير رئيس كهنة، بل إن الله هو الذي قال له: «أنت ابني. أنا اليوم ولدتك!»"], [6, "وخاطبه في موضع آخر بقوله: «أنت كاهن إلى الأبد على رتبة ملكيصادق!»"], [7, "والمسيح، في أثناء حياته البشرية على الأرض، رفع أدعية وتضرعات مقترنة بصراخ شديد ودموع، إلى القادر أن يخلصه من الموت. وقد لبى الله طلبه إكراما لتقواه."]]}, {"l": "Heb 12:2", "n": "", "vs": [[2, "متطلعين دائما إلى يسوع: رائد إيماننا ومكمله. فهو قد تحمل الموت صلبا، هازئا بما في ذلك من عار، إذ كان ينظر إلى السرور الذي ينتظره، ثم جلس عن يمين عرش الله."]]}], "kwAr": "أمعن في الاتضاع", "noteAr": ""}, {"kw": "and became", "raw": "Psa_40:6-8; Isa_50:5, Isa_50:6; Mat_26:39, Mat_26:42; Joh_4:34, Joh_15:10; Heb_5:8, Heb_5:9; Heb_10:7-9", "note": "", "refs": [{"l": "Psa 40:6-8", "n": "", "vs": [[6, "لم ترد أو تطلب ذبائح ومحر قات عن الخطيئة، لكنك وهبتني أذنين صاغيتين مطيعتين."], [7, "عندئذ قلت: «ها أنا أجيء، كما هو مكتوب عني في درج الكتاب:"], [8, "إن مسرتي أن أعمل مشيئتك الصالحة ياإلهي، وشريعتك في صميم قلبي."]]}, {"l": "Isa 50:5", "n": "", "vs": [[5, "قد فتح السيد الرب أذني فلم أعاند أو أتراجع إلى الوراء"]]}, {"l": "Isa 50:6", "n": "", "vs": [[6, "بذلت ظهري للضاربين، وخدي للناتفين، ولم أحجب وجهي عن الإهانة والبصق."]]}, {"l": "Mat 26:39", "n": "", "vs": [[39, "وابتعد عنهم قليلا وارتمى على وجهه يصلي، قائلا: «ياأبي، إن كان ممكنا، فلتعبر عني هذه الكأس: ولكن، لا كما أريد أنا، بل كما تريد أنت!»"]]}, {"l": "Mat 26:42", "n": "", "vs": [[42, "وذهب ثانية يصلي، فقال: «ياأبي، إن كان لا يمكن أن تعبر عني هذه الكأس إلا بأن أشربها، فلتكن مشيئتك!»"]]}, {"l": "Joh 4:34", "n": "", "vs": [[34, "فقال لهم يسوع: «طعامي هو أن أعمل مشيئة الذي أرسلني وأن أنجز عمله."]]}, {"l": "Joh 15:10", "n": "", "vs": [[10, "إن عملتم بوصاياي، تثبتون في محبتي، كما عملت أنا بوصايا أبي وأثبت في محبته!"]]}, {"l": "Heb 5:8", "n": "", "vs": [[8, "فمع كونه ابنا تعلم الطاعة من الآلام التي قاساها."]]}, {"l": "Heb 5:9", "n": "", "vs": [[9, "وبذلك، أصبح مؤهلا لمهمته، فصار لجميع الذين يطيعونه مصدرا للخلاص الأبدي."]]}, {"l": "Heb 10:7-9", "n": "", "vs": [[7, "عندئذ قلت لك: ها أنا آتي لأعمل إرادتك، ياالله . هذا هو المكتوب عني في صفحة الكتاب !»"], [8, "فبعد أن عبر المسيح عن عدم رضى الله بجميع التقدمات والذبائح التي كانت تقرب مع أنها كانت تقدم وفقا للشريعة،"], [9, "أضاف قائلا: «ها أنا آتي لأعمل إرادتك!» فهو، إذن، يلغي النظام السابق، ليضع محله نظاما جديدا ينسجم مع إرادة الله."]]}], "kwAr": "وكان طائعا حتى الموت", "noteAr": ""}, {"kw": "the death", "raw": "Deu_21:23; Psa_22:16; Joh_10:18, Joh_12:28-32, Joh_14:31; Gal_3:13; Tit_2:14; Heb_12:2; 1Pe_2:24, 1Pe_3:18", "note": "", "refs": [{"l": "Deu 21:23", "n": "", "vs": [[23, "فلا تبت جثته على الخشبة، بل ادفنوه في نفس ذلك اليوم، لأن المعلق ملعون من الله. فلا تنجسوا أرضكم التي يهبها لكم الرب ميراثا."]]}, {"l": "Psa 22:16", "n": "", "vs": [[16, "أحاط بي الأدنياء. جماعة من الأشرار طوقتني. ثقبوا يدي ورجلي."]]}, {"l": "Joh 10:18", "n": "", "vs": [[18, "لا أحد ينتزع حياتي مني، بل أنا أبذلها باختياري. فلي السلطة أن أبذلها ولي السلطة أن أستردها. هذه الوصية تلقيتها من أبي»."]]}, {"l": "Joh 12:28-32", "n": "", "vs": [[28, "أيها الآب، مجد اسمك!»"], [29, "فقال بعض الحاضرين ممن سمعوا الصوت: «هذا صوت رعد!» ولكن غيرهم قالوا: «حدثه ملاك»."], [30, "فأجاب يسوع: «لم يكن هذا الصوت لأجلي بل لأجلكم."], [31, "الآن وقت الحكم على هذا العالم! الآن يطرد سيد هذا العالم خارجا!"], [32, "وحين أعلق مرفوعا عن الأرض أجذب إلي الجميع»."]]}, {"l": "Joh 14:31", "n": "", "vs": [[31, "إلا أن هذا سيحدث ليعرف العالم أني أحب الآب، وأني مثلما أوصاني الآب هكذا أفعل. قوموا! لنذهب من هنا!"]]}, {"l": "Gal 3:13", "n": "", "vs": [[13, "إن المسيح حررنا بالفداء من لعنة الشريعة، إذ صار لعنة عوضا عنا، لأنه قد كتب: «ملعون كل من علق على خشبة»،"]]}, {"l": "Tit 2:14", "n": "", "vs": [[14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}, {"l": "Heb 12:2", "n": "", "vs": [[2, "متطلعين دائما إلى يسوع: رائد إيماننا ومكمله. فهو قد تحمل الموت صلبا، هازئا بما في ذلك من عار، إذ كان ينظر إلى السرور الذي ينتظره، ثم جلس عن يمين عرش الله."]]}, {"l": "1Pe 2:24", "n": "", "vs": [[24, "وهو نفسه حمل خطايانا في جسده (عندما مات مصلوبا) على الخشبة، لكي نموت بالنسبة للخطايا فنحيا حياة البر. وبجراحه هو تم لكم الشفاء،"]]}, {"l": "1Pe 3:18", "n": "", "vs": [[18, "فإن المسيح نفسه مات مرة واحدة لكي يحل مشكلة الخطايا. فمع أنه هو البار، فقد تألم من أجلنا نحن المذنبين، لكي يقربنا إلى الله، فمات بجسمه البشري، ثم عاد حيا بالروح."]]}], "kwAr": "موت الصليب", "noteAr": ""}], "arS": [["وإذ ", []], ["ظهر", ["G2147"]], [" ", []], ["بهيئة", ["G4976"]], [" ", []], ["إنسان", ["G444"]], ["، أمعن في ", []], ["الاتضاع", ["G5013"]], ["، وكان ", []], ["طائعا", ["G5255"]], [" حتى ", []], ["الموت", ["G2288"]], ["، ", []], ["موت", ["G2288"]], [" ", []], ["الصليب", ["G4716"]], [".", []]]}, {"c": 2, "v": 9, "text": "لذلك أيضا رفعه الله عاليا، وأعطاه الاسم الذي يفوق كل اسم،", "groups": [{"kw": "God", "raw": "Gen_3:15; Psa_2:6-12, Psa_8:5-8, Psa_45:6, Psa_45:7, Psa_69:29, Psa_69:30, Psa_72:17-19, Psa_91:14, Psa_110:1, Psa_110:5; Isa_9:7, Isa_49:6-8, Isa_52:13, Isa_53:12; Dan_2:44, Dan_2:45, Dan_7:14; Mat_11:27, Mat_28:18; Luk_10:22; Joh_3:35, Joh_3:36, Joh_5:22-27, Joh_13:3, Joh_17:1-3, Joh_17:5; Act_2:32-36, Act_5:31; Rom_14:9-11; 1Co_15:24-27; Heb_2:9, Heb_12:2; 2Pe_1:17; Rev_1:5, Rev_3:21, Rev_5:12; Rev_11:15, Rev_19:16", "note": "", "refs": [{"l": "Gen 3:15", "n": "", "vs": [[15, "وأثير عداوة دائمة بينك وبين المرأة، وكذلك بين نسليكما. هو يسحق رأسك وأنت تلدغين عقبه»."]]}, {"l": "Psa 2:6-12", "n": "", "vs": [[6, "قائلاَ: «أما أنا فقد مسحت ملكي، وأجلسته على صهيون، جبلي المقدس»."], [7, "وها أنا أعلن ما قضى به الرب: قال لي الرب: «أنت ابني، أنا اليوم ولدتك."], [8, "اطلب مني فأعطيك الأمم ميراثا، وأقاصي الأرض ملكا لك."], [9, "فتكسرهم بقضيب من حديد، وتحطمهم كآنية الفخار»."], [10, "والآن تعقلوا أيها الملوك، واحذروا ياحكام الأرض."], [11, "اعبدوا الرب بخوف، وابتهجوا برعدة."], [12, "قبلوا الابن لئلا يغضب، فتهلكوا في الطريق، لئلا يتوهج غضبه سريعا. طوبى لجميع المتكلين عليه."]]}, {"l": "Psa 8:5-8", "n": "", "vs": [[5, "جعلته أدنى قليلا من الملائكة إلى حين، ثم كللته بالمجد والكرامة"], [6, "وأعطيته السلطة على كل ما صنعته يداك. أخضعت كل شيء تحت قدميه."], [7, "الغنم والبقر وجميع المواشي، ووحوش البرية أيضا،"], [8, "والطيور والأسماك وجميع الحيوانات المائية."]]}, {"l": "Psa 45:6", "n": "", "vs": [[6, "عرشك ياالله إلى دهر الدهور، وصولجان ملكك عادل ومستقيم."]]}, {"l": "Psa 45:7", "n": "", "vs": [[7, "أحببت البر وأبغضت الإثم. من أجل ذلك مسحك الله (ملكا) بدهن الابتهاج أكثر من رفقائك (الملوك)."]]}, {"l": "Psa 69:29", "n": "", "vs": [[29, "أما أنا فمتضايق ومتوجع. فليرفعني خلاصك ياالله ."]]}, {"l": "Psa 69:30", "n": "", "vs": [[30, "أسبح اسم الله بنشيد وأعظمه بحمد."]]}, {"l": "Psa 72:17-19", "n": "", "vs": [[17, "يخلد اسمه إلى الدهر، ويدوم اسمه كديمومة الشمس، ويتبارك الناس به، وتطوبه كل الأمم."], [18, "تبارك الرب إله إسرائيل، فهو وحده صانع العجائب."], [19, "تبارك اسمه المجيد إلى الأبد، ولتمتليء الأرض كلها من مجده. آمين ثم آمين."]]}, {"l": "Psa 91:14", "n": "", "vs": [[14, "قال الرب: أنجيه لأنه تعلق بي. أرفعه لأنه عرف اسمي."]]}, {"l": "Psa 110:1", "n": "", "vs": [[1, "قال الرب لربي: «اجلس عن يميني حتى أضع أعداءك موطئا لقدميك»."]]}, {"l": "Psa 110:5", "n": "", "vs": [[5, "الرب واقف عن يمينك. في يوم غضبه يحطم ملوكا."]]}, {"l": "Isa 9:7", "n": "", "vs": [[7, "ولا تكون نهاية لنمو رياسته وللسلام اللذين يسودان عرش داود ومملكته، ليثبتها ويعضدها بالحق والبر، من الآن وإلى الأبد. إن غيرة الرب القدير تتمم هذا."]]}, {"l": "Isa 49:6-8", "n": "", "vs": [[6, "لكم هو يسير أن تكون لي عبدا لتستنهض أسباط يعقوب، وترد من نجيت من إسرائيل، لذلك سأجعلك نورا للأمم لتكون خلاصي إلى أقصى الأرض."], [7, "وهذا ما يقوله الرب فادي إسرائيل وقدوسه لمن صار محتقرا ومرذولا لدى الأمم وعبدا للمتسلطين: يراك الملوك وينهضون، ويسجد لك الرؤساء من أجل الرب الأمين، قدوس إسرائيل الذي اصطفاك."], [8, "وهذا ما يقوله الرب: «استجبتك في وقت رضى، وفي يوم خلاصي أعنتك فأحفظك وأعطيك عهدا للشعب لتسترد الأرض وتورث الأملاك التي داهمها الدمار،"]]}, {"l": "Isa 52:13", "n": "", "vs": [[13, "ها هو عبدي يفلح، ويتعظم ويتعالى ويتسامى جدا."]]}, {"l": "Isa 53:12", "n": "", "vs": [[12, "لذلك أهبه نصيبا بين العظماء، فيقسم غنيمة مع الأعزاء، لأنه سكب للموت نفسه، وأحصي مع أثمة. وهو حمل خطيئة كثيرين، وشفع في المذنبين."]]}, {"l": "Dan 2:44", "n": "", "vs": [[44, "وفي عهد هؤلاء الملوك يقيم إله السماوات مملكة لا تنقرض إلى الأبد، ولا يترك ملكها لشعب آخر، وتسحق وتبيد جميع هذه الممالك. أما هي فتخلد إلى الأبد."]]}, {"l": "Dan 2:45", "n": "", "vs": [[45, "لأنك رأيت أن الحجر المنقض الذي لم يقطع من الجبل بيدين، قد سحق الحديد والنحاس والخزف والفضة والذهب. إن الله العظيم قد أطلع الملك عما سيحدث في الأيام الآتية؛ فالحلم حقيقة وتفسيره صدق»."]]}, {"l": "Dan 7:14", "n": "", "vs": [[14, "فأنعم عليه بسلطان ومجد وملكوت لتتعبد له كل الشعوب والأمم من كل لسان. سلطانه سلطان أبدي لا يفنى، وملكه لا ينقرض."]]}, {"l": "Mat 11:27", "n": "", "vs": [[27, "كل شيء قد سلمه إلي أبي. ولا أحد يعرف الابن إلا الآب، ولا أحد يعرف الآب إلا الابن، ومن أراد الابن أن يعلنه له."]]}, {"l": "Mat 28:18", "n": "", "vs": [[18, "فتقدم يسوع وكلمهم قائلا: «دفع إلي كل سلطان في السماء وعلى الأرض."]]}, {"l": "Luk 10:22", "n": "", "vs": [[22, "كل شيء قد سلم إلي من قبل أبي، ولا أحد يعرف من هو الابن إلا الآب، ولا من هو الآب إلا الابن ومن أراد الابن أن يعلنه له!»"]]}, {"l": "Joh 3:35", "n": "", "vs": [[35, "فالآب يحب الابن، وقد جعل في يده كل شيء."]]}, {"l": "Joh 3:36", "n": "", "vs": [[36, "من يؤمن بالابن، فله الحياة الأبدية. ومن يرفض أن يؤمن بالابن، فلن يرى الحياة. بل يستقر عليه غضب الله»."]]}, {"l": "Joh 5:22-27", "n": "", "vs": [[22, "والآب لا يحاكم أحدا، بل أعطى الابن سلطة القضاء كلها،"], [23, "ليكرم الجميع الابن كما يكرمون الآب. ومن لا يكرم الابن لا يكرم الآب الذي أرسله."], [24, "الحق الحق أقول لكم إن من يسمع كلامي ويؤمن بالذي أرسلني تكون له الحياة الأبدية، ولا يحاكم في اليوم الأخير، لأنه قد انتقل من الموت إلى الحياة."], [25, "الحق الحق أقول لكم: إن الساعة التي يسمع فيها الأموات صوت ابن الله ستأتي بل هي الآن والذين يسمعونه يحيون."], [26, "لأنه كما أن للآب حياة في ذاته، فقد أعطى الابن أيضا أن تكون له حياة في ذاته،"], [27, "وأعطاه سلطة أن يدين، لأنه ابن الإنسان."]]}, {"l": "Joh 13:3", "n": "", "vs": [[3, "وكان يسوع عالما أن الآب قد جعل كل شيء في يديه وأنه من الله خرج وإلى الله سيعود،"]]}, {"l": "Joh 17:1-3", "n": "", "vs": [[1, "ولما أنهى يسوع هذا الحديث رفع عينيه نحو السماء، وقال: «أيها الآب، قد حانت الساعة! مجد ابنك، ليمجدك ابنك أيضا،"], [2, "فقد أوليته السلطة على جميع البشر، ليمنح جميع الذين قد وهبتهم له حياة أبدية."], [3, "والحياة الأبدية هي أن يعرفوك أنت الإله الحق وحدك، والذي أرسلته: يسوع المسيح."]]}, {"l": "Joh 17:5", "n": "", "vs": [[5, "فمجدني في حضرتك الآن، أيها الآب، بما كان لي من مجد عندك قبل تكوين العالم."]]}, {"l": "Act 2:32-36", "n": "", "vs": [[32, "فيسوع هذا أقامه الله من الموت، ونحن جميعا شهود لذلك."], [33, "وإذ رفع إلى يمين الله، وأخذ من الآب الروح القدس الموعود به، أفاضه علينا. وما ترونه الآن وتسمعونه هو نتيجة لذلك."], [34, "فإن داود لم يرتفع بجسده إلى السماء. ثم إنه هو نفسه يقول: قال الرب لربي: اجلس عن يميني"], [35, "حتى أجعل أعداءك موطئا لقدميك."], [36, "فليعلم يقينا بنو إسر ائيل جميعا، أن الله قد جعل يسوع، هذا الذي صلبتموه أنتم، ربا ومسيحا!»"]]}, {"l": "Act 5:31", "n": "", "vs": [[31, "ولكن الله رفعه إلى يمينه وجعله رئيسا ومخلصا ليمنح إسرائيل التوبة وغفران الخطايا؛"]]}, {"l": "Rom 14:9-11", "n": "", "vs": [[9, "فإن المسيح مات وعاد حيا لأجل هذا: أن يكون سيدا على الأموات والأحياء."], [10, "ولكن، لماذا أنت تدين أخاك؟ وأنت أيضا، لماذا تحتقر أخاك؟ فإننا جميعا سوف نقف أمام عرش الله لنحاسب."], [11, "فإنه قد كتب: «أنا حي، يقول الرب، لي ستنحني كل ركبة، وسيعترف كل لسان لله!»"]]}, {"l": "1Co 15:24-27", "n": "", "vs": [[24, "وبعد ذلك الآخرة حين يسلم المسيح الملك لله الآب بعد أن يكون قد أباد كل رئاسة وكل سلطة وكل قوة."], [25, "فإنه لابد أن يملك «إلى أن يضع جميع الأعداء تحت قدميه»."], [26, "وآخر عدو يباد هو الموت. ذلك بأنه قد «أخضع كل شيء تحت قدميه»."], [27, "ولكن، في قوله إن كل شيء قد أخضع، فمن الواضح أنه يستثني الله الذي جعل كل شيء خاضعا للابن."]]}, {"l": "Heb 2:9", "n": "", "vs": [[9, "إلا أننا نرى يسوع الآن مكللا بالمجد والكرامة، لأنه قاسى الموت. وذلك بعدما صار أدنى من الملائكة إلى حين، ليذوق بنعمة الله الموت عوضا عن كل واحد."]]}, {"l": "Heb 12:2", "n": "", "vs": [[2, "متطلعين دائما إلى يسوع: رائد إيماننا ومكمله. فهو قد تحمل الموت صلبا، هازئا بما في ذلك من عار، إذ كان ينظر إلى السرور الذي ينتظره، ثم جلس عن يمين عرش الله."]]}, {"l": "2Pe 1:17", "n": "", "vs": [[17, "فإنه قد نال من الله الآب كرامة ومجدا، إذ جاءه من المجد الفائق صوت يقول: «هذا هو ابني الحبيب الذي به سررت كل سرور!»"]]}, {"l": "Rev 1:5", "n": "", "vs": [[5, "ومن يسوع المسيح الشاهد الأمين، بكر القائمين من بين الأموات، ملك ملوك الأرض، ذاك الذي بدافع محبته لنا مات لأجلنا فغسلنا بدمه من خطايانا،"]]}, {"l": "Rev 3:21", "n": "", "vs": [[21, "وكل من ينتصر سأجلسه معي على عرشي، كما انتصرت أنا أيضا فجلست مع أبي على عرشه؛"]]}, {"l": "Rev 5:12", "n": "", "vs": [[12, "وهم يهتفون بصوت عال: «مستحق هو الحمل المذبوح أن ينال القدرة والغنى والحكمة والقوة والإجلال والمجد والبركة»."]]}, {"l": "Rev 11:15", "n": "", "vs": [[15, "ونفخ الملاك السابع في بوقه فسمعت أصوات عالية في السماء تقول: «قد صار ملك العالم لربنا ومسيحه. إنه يملك إلى أبد الآبدين»."
