ا لهم، لأنهم يسهرون على مصلحتكم الروحية، كما يسهر الذي يحمل مسئولية سوف يقدم حسابا عن قيامه بها. وعندئذ، يؤدون مهمتهم بفرح دون تذمر. فلن يكون في تذمرهم نفع لكم!"]]}], "kwAr": "في الرب", "noteAr": ""}, {"kw": "hold such in reputation", "raw": "or, honour such, Act_28:10; 1Co_16:18; 1Ti_5:17", "note": "or, honour such, Act_28:10; 1Co_16:18; 1Ti_5:17", "refs": [{"l": "Act 28:10", "n": "", "vs": [[10, "فأعطونا هدايا كثيرة، وزودونا عند رحيلنا بما نحتاج إليه في سفرنا."]]}, {"l": "1Co 16:18", "n": "", "vs": [[18, "إذ أنعشوا روحي وروحكم. فقدروا مثل هؤلاء حق التقدير!"]]}, {"l": "1Ti 5:17", "n": "", "vs": [[17, "أما الشيوخ الذين يحسنون القيادة، فليعتبروا أهلا للإكرام المضاعف، وبخاصة الذين يبذلون الجهد في نشر الكلمة وفي التعليم."]]}], "kwAr": "وعاملوا أمثاله بالإكرام", "noteAr": "أو: أكرموا أمثاله."}], "arS": [["فاقبلوه", ["G4327"]], [" إذن في ", []], ["الرب", ["G2962"]], [" ", []], ["بكل", ["G3956"]], [" ", []], ["فرح", ["G5479"]], ["، وعاملوا ", []], ["أمثاله", ["G5108"]], [" ", []], ["بالإكرام", ["G1784"]], [".", []]]}, {"c": 2, "v": 30, "text": "فإنه من أجل عمل المسيح أشرف على الموت، مخاطرا بحياته ليسد ما نقص من خدمتكم لي.", "groups": [{"kw": "the work", "raw": "1Co_15:53, 1Co_16:10", "note": "", "refs": [{"l": "1Co 15:53", "n": "", "vs": [[53, "فلابد لهذا الجسم القابل للانحلال أن يلبس عدم انحلال، ولهذا الفاني أن يلبس خلودا."]]}, {"l": "1Co 16:10", "n": "", "vs": [[10, "وإذا وصل تيموثاوس إليكم، فاهتموا بأن يكون مطمئنا عندكم، لأنه يقوم بعمل الرب مثلي."]]}], "kwAr": "من أجل عمل المسيح", "noteAr": ""}, {"kw": "nigh", "raw": "Phi_2:17, Phi_2:27, Phi_1:19, Phi_1:20; Mat_25:36-40; Act_20:24; Rom_16:4; 2Co_12:15; Rev_12:11", "note": "", "refs": [{"l": "Phi 2:17", "n": "", "vs": [[17, "حتى لو سفك دمي سكيبا فوق ذبيحة إيمانكم وخدمته، فإني أفرح وأبتهج معكم جميعا."]]}, {"l": "Phi 2:27", "n": "", "vs": [[27, "فقد مرض حتى أشرف على الموت، ولكن الله أشفق عليه، وليس عليه وحده، بل علي أنا أيضا، لئلا يصيبني حزن على حزن."]]}, {"l": "Phi 1:19", "n": "", "vs": [[19, "فإنني أعلم أن هذا الأمر سيؤدي إلى الإفراج عني، بفضل صلاتكم وبمعونة روح يسوع المسيح؛"]]}, {"l": "Phi 1:20", "n": "", "vs": [[20, "وفقا لما أتوقعه وأرجوه: أني لن أفشل في شيء، بل في كل جرأة وكما في كل حين فكذلك الآن أيضا، يتعظم المسيح في جسدي، سواء أكان بالحياة أم بالموت."]]}, {"l": "Mat 25:36-40", "n": "", "vs": [[36, "عريانا فكسوتموني، مريضا فزرتموني، سجينا فأتيتم إلي!"], [37, "فيرد الأبرار قائلين: يارب، متى رأيناك جائعا فأطعمناك، أو عطشانا فسقيناك؟"], [38, "ومتى رأيناك غريبا فآويناك، أو عريانا فكسوناك؟"], [39, "ومتى رأيناك مريضا أو سجينا فزرناك؟"], [40, "فيجيبهم الملك: الحق أقول لكم: بما أنكم فعلتم ذلك بأحد إخوتي هؤلاء الصغار، فبي فعلتم!"]]}, {"l": "Act 20:24", "n": "", "vs": [[24, "ولكني لا أحسب لحياتي أية قيمة، ما دمت أسعى إلى بلوغ غايتي وإتمام الخدمة التي كلفني إياها الرب يسوع: أن أشهد ببشارة نعمة الله."]]}, {"l": "Rom 16:4", "n": "", "vs": [[4, "اللذين عرضا عنقيهما للذبح إنقاذا لحياتي، ولست أنا وحدي شاكرا لهما بل جميع كنائس الأمم أيضا."]]}, {"l": "2Co 12:15", "n": "", "vs": [[15, "وأنا، بكل سرور، أنفق ما عندي، بل أنفق نفسي لأجل أنفسكم، وإن كنت كلما زادت محبتي ألقى حبا أقل."]]}, {"l": "Rev 12:11", "n": "", "vs": [[11, "وهم قد انتصروا عليه بدم الحمل وبالكلمة التي شهدوا لها، فلم تكن حياتهم عزيزة لديهم، حتى إنهم ماتوا."]]}], "kwAr": "أشرف على الموت", "noteAr": ""}, {"kw": "unto", "raw": "Phi_4:10,Phi_4:18; 1Co_16:17; Phm_1:13", "note": "", "refs": [{"l": "Phi 4:10", "n": "", "vs": [[10, "ثم إني فرحت في الرب فرحا عظيما إذ إنكم الآن قد جددتم مرة أخرى اهتمامكم بي. فمع أنه كان لكم مثل هذا الاهتمام، فإن الفرصة لم تتيسر لكم من قبل."]]}, {"l": "Phi 4:18", "n": "", "vs": [[18, "فالآن عندي كل ما يسد حاجتي ويزيد عنها. أنا في بحبوحة إذ تسلمت من أبفروديتس ما بعثتم به إلي، عطرا طيب الرائحة، ذبيحة يقبلها الله ويسر بها."]]}, {"l": "1Co 16:17", "n": "", "vs": [[17, "سررت كثيرا بمجيء استفاناس وفرتوناتوس وأخائيكوس. فقد نابوا عنكم في سد الاحتياج."]]}, {"l": "Phm 1:13", "n": "", "vs": [[13, "وكنت راغبا في الاحتفاظ به لنفسي، لكي يخدمني نيابة عنك في قيود الإنجيل."]]}], "kwAr": "ليسد ما نقص", "noteAr": ""}], "arS": [["فإنه من أجل ", []], ["عمل", ["G2041"]], [" ", []], ["المسيح", ["G5547"]], [" ", []], ["أشرف", ["G1448"]], [" على ", []], ["الموت", ["G2288"]], ["، ", []], ["مخاطرا", ["G3851"]], [" ", []], ["بحياته", ["G5590"]], [" ", []], ["ليسد", ["G378"]], [" ما ", []], ["نقص", ["G5303"]], [" من ", []], ["خدمتكم", ["G3009"]], [" لي.", []]]}, {"c": 3, "v": 1, "text": "وبعد، ياإخوتي، افرحوا في الرب. لا يزعجني أن أكتب إليكم بالأمور نفسها، فإن ذلك يجعلكم في مأمن.", "groups": [{"kw": "Finally", "raw": "Phi_4:8; 2Co_13:11; Eph_6:10; 1Th_4:1 *Gr: 1Pe_3:8", "note": "", "refs": [{"l": "Phi 4:8", "n": "", "vs": [[8, "وختاما، أيها الإخوة: كل ما كان حقا، وكل ما كان شريفا، وكل ما كان عادلا، وكل ما كان طاهرا وكل ما كان مستحبا، وكل ما كان حسن السمعة، وكل ما كان فيه فضيلة وخصلة حميدة، فاشغلوا أفكاركم به."]]}, {"l": "2Co 13:11", "n": "", "vs": [[11, "وأخيرا، أيها الإخوة: افرحوا؛ تكملوا؛ تشجعوا؛ اتفقوا في الرأي؛ عيشوا بسلام. وإله المحبة والسلام سيكون معكم!"]]}, {"l": "Eph 6:10", "n": "", "vs": [[10, "وختاما، تشددوا في الرب وفي قدرة قوته."]]}, {"l": "1Th 4:1", "n": "*Gr:", "vs": [[1, "وبعد، أيها الإخوة، فمثلما تلقيتم منا كيف يجب أن تسلكوا سلوكا يرضي الله ، وكما أنتم فاعلون، نرجو منكم ونحرضكم في الرب يسوع أن تضاعفوا تقدمكم في ذلك أكثر فأكثر."]]}, {"l": "1Pe 3:8", "n": "", "vs": [[8, "والخلاصة، كونوا جميعا متحدين في الرأي، متعاطفين بعضكم مع بعض، مبادلين أحدكم الآخر المحبة الأخوية، شفوقين، متواضعين."]]}], "kwAr": "وبعد", "noteAr": ""}, {"kw": "rejoice", "raw": "Phi_3:3, Phi_4:4; Deu_12:18, Deu_16:11; 1Sa_2:1; 1Ch_15:28, 1Ch_16:10,1Ch_16:31-33, 1Ch_29:22; 2Ch_30:26, 2Ch_30:27; Neh_8:10; Job_22:26; Psa_5:11, Psa_32:11, Psa_33:1, Psa_37:4, Psa_42:4; Psa_97:1, Psa_100:1, Psa_100:2, Psa_149:2; Isa_12:2, Isa_12:3, Isa_41:16, Isa_61:10, Isa_65:14, Isa_66:11, Isa_66:12; Joe_2:23; Hab_3:17, Hab_3:18; Zep_3:14, Zep_3:17; Zec_10:7; Mat_5:12; Luk_1:47; Rom_5:2, Rom_5:3, Rom_5:11; 1Th_5:16; Jam_1:2; 1Pe_1:6-8, 1Pe_4:13", "note": "", "refs": [{"l": "Phi 3:3", "n": "", "vs": [[3, "فإننا نحن أهل الختان الحق، لأننا إنما نعبد بروح الله ونفتخر في المسيح يسوع، ولا نعتمد على أمور الجسد،"]]}, {"l": "Phi 4:4", "n": "", "vs": [[4, "افرحوا في الرب دائما، وأقول أيضا: افرحوا."]]}, {"l": "Deu 12:18", "n": "", "vs": [[18, "بل تأكلونها أنتم وأبناؤكم وبناتكم وعبيدكم وإماؤكم واللاويون المقيمون في جواركم لدى الرب إلهكم في المكان الذي يختاره الرب إلهكم، وتحتفلون أمامه بكل ما تمتلكه أيديكم"]]}, {"l": "Deu 16:11", "n": "", "vs": [[11, "فتحتفلون أنتم وأبناؤكم وبناتكم وعبيدكم وإماؤكم، واللاويون المقيمون في مدنكم، والغريب واليتيم والأرملة الذين بينكم، لدى الرب في الموضع الذي يختاره ليحل اسمه فيه."]]}, {"l": "1Sa 2:1", "n": "", "vs": [[1, "وصلت حنة قائلة: «ابتهج قلبي بالرب وسمت عزتي به. أفتخر على أعدائي لأني فرحت بخلاصك."]]}, {"l": "1Ch 15:28", "n": "", "vs": [[28, "وهكذا احتفل جميع الإسرائيليين بإحضار تابوت عهد الرب هاتفين بفرح ونافخين بالأبواق النحاسية والأصوار، وعازفين على الصنوج والرباب والعيدان."]]}, {"l": "1Ch 16:10", "n": "", "vs": [[10, "تباهوا باسمه القدوس، لتفرح قلوب طالبي الرب."]]}, {"l": "1Ch 16:31-33", "n": "", "vs": [[31, "لتفرح السماوات ولتبتهج الأرض وليذع بين الأمم أن الرب قد ملك."], [32, "ليعج البحر وكل ما يحويه، ليتهلل الحقل وكل ما فيه."], [33, "عندئذ تترنم أشجار الغابة في حضرة الرب لأنه جاء ليدين الأرض."]]}, {"l": "1Ch 29:22", "n": "", "vs": [[22, "واحتفلوا في ذلك اليوم أمام الرب آكلين شاربين بفرح عظيم، وبايعوا سليمان بن داود ثانية ملكا عليهم، ومسحوه للرب رئيسا، واختاروا صادوق كاهنا."]]}, {"l": "2Ch 30:26", "n": "", "vs": [[26, "وغمرت الفرحة العظيمة أورشليم لأنه لم يحتفل بمثل هذا في أورشليم منذ أيام سليمان بن داود."]]}, {"l": "2Ch 30:27", "n": "", "vs": [[27, "ووقف الكهنة واللاويون وطلبوا البركة على الشعب فاستجاب الرب صلاتهم التي صعدت إلى مسكن قدسه في السماء."]]}, {"l": "Neh 8:10", "n": "", "vs": [[10, "ثم استطرد نحميا: «اذهبوا واحتفلوا آكلين أطايب الطعام، وشاربين حلو الشراب، وابعثوا أنصبة لمن لم يعد لهم. ولا تحزنوا لأن هذا اليوم مقدس لسيدنا، ففرح الرب هو قوتكم»."]]}, {"l": "Job 22:26", "n": "", "vs": [[26, "عندئذ تتلذذ نفسك بالقدير، ويرتفع وجهك نحو الله."]]}, {"l": "Psa 5:11", "n": "", "vs": [[11, "ويبتهج جميع المتكلين عليك. إلى الأبد يترنمون، لأنك تظللهم بحمايتك، فيفرح بك الذين يحبون اسمك."]]}, {"l": "Psa 32:11", "n": "", "vs": [[11, "افرحوا بالرب أيها الأبرار وابتهجوا. اهتفوا ياجميع المستقيمي القلوب."]]}, {"l": "Psa 33:1", "n": "", "vs": [[1, "سبحوا الرب أيها الأبرار، فإن الحمد يليق بالمستقيمين."]]}, {"l": "Psa 37:4", "n": "", "vs": [[4, "ابتهج بالرب فيمنحك بغية قلبك."]]}, {"l": "Psa 42:4", "n": "", "vs": [[4, "حين أتأمل في نفسي تعاودني هذه الذكرى: كيف كنت أرافق حشود العابدين المحتفلين بالعيد وأقودهم في الحضور إلى بيت الله، هاتفا معهم فرحا وحمدا."]]}, {"l": "Psa 97:1", "n": "", "vs": [[1, "الرب قد ملك، فلتبتهج الأرض، وليفرح أهل الجزر الكثيرة."]]}, {"l": "Psa 100:1", "n": "", "vs": [[1, "اهتفوا للرب ياسكان الأرض جميعا."]]}, {"l": "Psa 100:2", "n": "", "vs": [[2, "اعبدوا الرب ببهجة، وامثلوا أمامه مترنمين."]]}, {"l": "Psa 149:2", "n": "", "vs": [[2, "ليفرح شعب إسرائيل بصانعه، وليبتهج بنو صهيون بملكهم."]]}, {"l": "Isa 12:2", "n": "", "vs": [[2, "ها إن الله خلاصي فأطمئن ولا أرتعد، لأن الرب الله هو قوتي وترنيمتي وقد أصبح لي خلاصا»."]]}, {"l": "Isa 12:3", "n": "", "vs": [[3, "فتستقون ببهجة من ينابيع الخلاص."]]}, {"l": "Isa 41:16", "n": "", "vs": [[16, "فتذريها، وتحملها الريح بعيدا، وتبددها الزوبعة. أما أنت فتبتهج بالرب وتمجد قدوس إسرائيل."]]}, {"l": "Isa 61:10", "n": "", "vs": [[10, "إنني أبتهج حقا بالرب وتفرح نفسي بإلهي، لأنه كساني ثياب الخلاص وسربلني برداء البر، مثل عريس يزين رأسه بتاج، وكعروس تتجمل بحليها."]]}, {"l": "Isa 65:14", "n": "", "vs": [[14, "ويترنمون في غبطة القلب وأنتم تعولون من أسى القلب، وتولولون من انكسار الروح،"]]}, {"l": "Isa 66:11", "n": "", "vs": [[11, "لكي ترضعوا وتشبعوا من ثدي تعزياتها، ولكي تحلبوا بوفرة وتتلذذوا من درة مجدها."]]}, {"l": "Isa 66:12", "n": "", "vs": [[12, "لأنه هكذا يقول الرب: ها أنا أسبغ عليها الخير كنهر، وأجري إليها ثروة الأمم كسيل متدفق، فترضعون، وتحملون في الحضن، وعلى ركبتيها تدللون."]]}, {"l": "Joe 2:23", "n": "", "vs": [[23, "افرحوا ياأبناء صهيون، ابتهجوا بالرب إلهكم لأنه أنعم عليكم بفضل صلاحه بأمطار الخريف، وسكب عليكم الغيث المبكر والمتأخر بغزارة، كالسابق."]]}, {"l": "Hab 3:17", "n": "", "vs": [[17, "فمع أنه لا يزهر التين ولا يكون حمل في الكروم يكذب عمل الزيتونة والحقول لا تصنع طعاما ينقطع الغنم من الحظيرة ولا بقر في المذاود"]]}, {"l": "Hab 3:18", "n": "", "vs": [[18, "فإني أبتهج بالرب وأفرح بإله خلاصي."]]}, {"l": "Zep 3:14", "n": "", "vs": [[14, "اشدي ياابنة صهيون واهتف ياإسرائيل، ابتهجي وتهللي ياابنة أورشليم."]]}, {"l": "Zep 3:17", "n": "", "vs": [[17, "فالرب إلهك في وسطك، جبار يخلص. يسر فرحا بك، ويجدد بمحبته حياتك، ويبتهج بك مترنما."]]}, {"l": "Zec 10:7", "n": "", "vs": [[7, "ويصبح شعب إسرائيل كجبابرة الحرب، وتنتشي قلوبهم كمن شرب خمرة، ويشهد أبناؤهم هذا ويفرحون، وتبتهج نفوسهم بالرب."]]}, {"l": "Mat 5:12", "n": "", "vs": [[12, "افرحوا وتهللوا، فإن مكافأتكم في السماوات عظيمة. فإنهم هكذا اضطهدوا الأنبياء من قبلكم!"]]}, {"l": "Luk 1:47", "n": "", "vs": [[47, "وتبتهج روحي بالله مخلصي."]]}, {"l": "Rom 5:2", "n": "", "vs": [[2, "وبه أيضا تم لنا الدخول بالإيمان إلى هذه النعمة التي نقيم فيها الآن؛ ونحن نفتخر برجائنا في التمتع بمجد الله."]]}, {"l": "Rom 5:3", "n": "", "vs": [[3, "ليس هذا فقط، بل نفتخر أيضا في وسط الضيقات، لعلمنا أن الضيق ينتج فينا الصبر،"]]}, {"l": "Rom 5:11", "n": "", "vs": [[11, "وليس هذا فقط، بل إننا نفتخر أيضا بالله، بفضل ربنا يسوع المسيح الذي به نلنا المصالحة الآن."]]}, {"l": "1Th 5:16", "n": "", "vs": [[16, "افرحوا على الدوام؛"]]}, {"l": "Jam 1:2", "n": "", "vs": [[2, "ياإخوتي، عندما تنزل بكم التجارب والمحن المختلفة، اعتبروها سبيلا إلى الفرح الكلي."]]}, {"l": "1Pe 1:6-8", "n": "", "vs": [[6, "وهذا يدعوكم إلى الابتهاج، مع أنه لابد لكم الآن من الحزن فترة قصيرة تحت وطأة التجارب المتنوعة!"], [7, "إلا أن غاية هذه التجارب هي اختبار حقيقة إيمانكم. فكما تختبر النار الذهب وتنقيه، تختبر التجارب حقيقة إيمانكم، وهو أثمن جدا من الذهب الفاني. وهكذا، يكون إيمانكم مدعاة مدح وإكرام وتمجيد لكم، عندما يعود يسوع المسيح ظاهرا بمجده."], [8, "أنتم لم تروا المسيح، ولكنكم تحبونه. ومع أنكم لا ترونه الآن، فأنتم تؤمنون به وتبتهجون بفرح مجيد يفوق الوصف."]]}, {"l": "1Pe 4:13", "n": "", "vs": [[13, "وإنما افرحوا: لأنكم كما تشاركون المسيح في الآلام الآن، لابد أن تفرحوا بمشاركته في الابتهاج عند ظهور مجده."]]}], "kwAr": "افرحوا في الرب", "noteAr": ""}, {"kw": "To write", "raw": "Phi_2:17, Phi_2:18; 2Pe_1:12-15, 2Pe_3:1", "note": "", "refs": [{"l": "Phi 2:17", "n": "", "vs": [[17, "حتى لو سفك دمي سكيبا فوق ذبيحة إيمانكم وخدمته، فإني أفرح وأبتهج معكم جميعا."]]}, {"l": "Phi 2:18", "n": "", "vs": [[18, "هكذا أيضا افرحوا أنتم، وابتهجوا معي."]]}, {"l": "2Pe 1:12-15", "n": "", "vs": [[12, "لذلك أنوي أن أذكركم دائما بهذه الأمور، وإن كنتم عالمين بها، وراسخين في الحق الذي عندكم."], [13, "فمادمت في خيمة جسمي هذه، أرى من واجبي أن أنبهكم مذكرا."], [14, "فأنا أعلم أن خيمتي ستطوى بعد وقت قصير، كما سبق أن أعلن لي ربنا يسوع المسيح."], [15, "ولهذا، أجتهد الآن في تذكيركم بهذه الأمور، حتى تستطيعوا أن تتذكروها دائما بعد رحيلي."]]}, {"l": "2Pe 3:1", "n": "", "vs": [[1, "أيها الأحباء، أنا الآن أكتب إليكم رسالتي الثانية. وفي كلتا الرسالتين، أقصد أن أنبه أذهانكم الصافية، مذكرا إياكم بحقائق تعرفونها."]]}], "kwAr": "أن أكتب إليكم", "noteAr": ""}], "arS": [["وبعد", ["G3063"]], ["، ", []], ["ياإخوتي", ["G80", "G3450"]], ["، ", []], ["افرحوا", ["G5463"]], [" في ", []], ["الرب", ["G2962"]], [". لا ", []], ["يزعجني", ["G3636"]], [" أن ", []], ["أكتب", ["G1125"]], [" إليكم بالأمور نفسها، فإن ذلك يجعلكم في ", []], ["مأمن", ["G804"]], [".", []]]}, {"c": 3, "v": 2, "text": "خذوا حذركم من «الكلاب»، من العمال الأشرار، من الذين يبترون الجسد.", "groups": [{"kw": "of dogs", "raw": "Pro_26:11; Isa_56:10,Isa_56:11; Mat_7:6, Mat_7:15, Mat_24:10; Gal_5:15; 2Ti_4:14, 2Ti_4:15; 2Pe_2:22; Rev_22:15", "note": "", "refs": [{"l": "Pro 26:11", "n": "", "vs": [[11, "كما يعود الكلب إلى قيئه، هكذا يعود الجاهل ليرتكب حماقته."]]}, {"l": "Isa 56:10", "n": "", "vs": [[10, "فإن رقباءهم عمي، وكلهم جهال، وكلاب بكم عاجزون عن النباح، حالمون راقدون مولعون بالنوم."]]}, {"l": "Isa 56:11", "n": "", "vs": [[11, "هم كلاب نهمة لا تعرف الشبع، ورعاة أيضا مجردون من الفهم، كل مال إلى طريقه طمعا في الربح،"]]}, {"l": "Mat 7:6", "n": "", "vs": [[6, "لا تعطوا ما هو مقدس للكلاب، ولا تطرحوا جواهركم أمام الخنازير، لكي لا تدوسها بأرجلها وتنقلب عليكم فتمزقكم."]]}, {"l": "Mat 7:15", "n": "", "vs": [[15, "احذروا الأنبياء الدجالين الذين يأتون إليكم لابسين ثياب الحملان، ولكنهم من الداخل ذئاب خاطفة!"]]}, {"l": "Mat 24:10", "n": "", "vs": [[10, "فيرتد كثيرون ويسلمون بعضهم بعضا ويبغضون بعضهم بعضا،"]]}, {"l": "Gal 5:15", "n": "", "vs": [[15, "فإذا كنتم تنهشون وتفترسون بعضكم بعضا، فاحذروا أن يفني أحدكم الآخر!"]]}, {"l": "2Ti 4:14", "n": "", "vs": [[14, "إن إسكندر النحاس قد أساء إلي إساءات كثيرة، سيجازيه الرب حسب أعماله."]]}, {"l": "2Ti 4:15", "n": "", "vs": [[15, "فاحترس منه أنت أيضا، لأنه قاوم كلامنا مقاومة شديدة."]]}, {"l": "2Pe 2:22", "n": "", "vs": [[22, "وينطبق على هؤلاء ما يقوله المثل الصادق: «عاد الكلب إلى تناول ما تقيأه، والخنزيرة المغتسلة إلى التمرغ في الوحل!»"]]}, {"l": "Rev 22:15", "n": "", "vs": [[15, "أما في خارج المدينة، فهنالك الكلاب والمتصلون بالشياطين، والزناة والقتلة، وعبدة الأصنام والدجالون ومحبو التدجيل!"]]}], "kwAr": "من الكلاب", "noteAr": ""}, {"kw": "evil", "raw": "Phi_3:19; Psa_119:115; Mat_7:22, Mat_7:23; 2Co_11:13; Gal_5:13; 1Ti_1:19; 2Ti_3:1-6; 2Ti_4:3, 2Ti_4:4; Tit_1:16; 2Pe_2:18-20; Jud_1:4, Jud_1:10-13; Rev_21:8", "note": "", "refs": [{"l": "Phi 3:19", "n": "", "vs": [[19, "الذين مصيرهم الهلاك، وإلههم بطونهم، ومفخرتهم في عيبتهم، وفكرهم منصرف إلى الأمور الأرضية."]]}, {"l": "Psa 119:115", "n": "", "vs": [[115, "ابتعدوا عني يافاعلي الشر، فأحفظ وصايا إلهي."]]}, {"l": "Mat 7:22", "n": "", "vs": [[22, "في ذلك اليوم سيقول لي كثيرون: يارب، يارب، أليس باسمك تنبأنا، وباسمك طردنا الشياطين، وباسمك عملنا معجزات كثيرة؟"]]}, {"l": "Mat 7:23", "n": "", "vs": [[23, "ولكني عندئذ أصرح لهم: إني لم أعرفكم قط! ابتعدوا عني يافاعلي الإثم!"]]}, {"l": "2Co 11:13", "n": "", "vs": [[13, "فإن أمثال هؤلاء هم رسل دجالون، عمال ماكرون، يظهرون أنفسهم بمظهر رسل المسيح."]]}, {"l": "Gal 5:13", "n": "", "vs": [[13, "فإنما إلى الحرية قد دعيتم، أيها الإخوة؛ ولكن لا تتخذوا من الحرية ذريعة لإرضاء الجسد، بل بالمحبة كونوا عبيدا في خدمة أحدكم الآخر."]]}, {"l": "1Ti 1:19", "n": "", "vs": [[19, "متمسكا بالإيمان، وبالضمير الصالح، هذا الضمير الذي تخلى عنه بعضهم، فانكسرت بهم سفينة الإيمان."]]}, {"l": "2Ti 3:1-6", "n": "", "vs": [[1, "واعلم هذا الأمر: أن أزمنة صعبة ستعم في الأيام الأخيرة؛"], [2, "إذ يكون الناس محبين لأنفسهم، محبين للمال، متكبرين، مباهين بأنفسهم، شتامين، غير مطيعين لوالديهم، ناكرين للجميل، دنسين،"], [3, "متحجري العواطف، غير صفوحين، نمامين، جامحي الأهواء، شرسين غير محبين للصلاح،"], [4, "خائنين، وقحين، مدعين، محبين للذات أكثر من محبتهم لله،"], [5, "لهم من التقوى مظهرها ولكنهم لقوتها منكرون، فعن هؤلاء الناس ابتعد!"], [6, "فمن هؤلاء من يدخلون البيوت خلسة، ويوقعون في حبائلهم بعض النساء السخيفات المثقلات بالخطايا، اللواتي تجرفهن شهوات مختلفة،"]]}, {"l": "2Ti 4:3", "n": "", "vs": [[3, "فإنه سيأتي زمان لا يطيق الناس فيه التعليم الصحيح، بل تبعا لشهواتهم الخاصة يكدسون لأنفسهم معلمين (يقولون لهم كلاما) يداعب الآذان."]]}, {"l": "2Ti 4:4", "n": "", "vs": [[4, "فيحولون آذانهم بعيدا عن الحق، منحرفين إلى الخرافات."]]}, {"l": "Tit 1:16", "n": "", "vs": [[16, "يشهدون معترفين بأنهم يعرفون الله ، ولكنهم بأعمالهم ينكرونه، لأنهم مكروهون وغير طائعين، وقد تبين أنهم غير أهل لكل عمل صالح."]]}, {"l": "2Pe 2:18-20", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."], [19, "يعدون هؤلاء بالحرية، وهم أنفسهم عبيد للفساد! لأن الإنسان يصير عبدا لكل ما يتسلط عليه ويغلبه."], [20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."]]}, {"l": "Jud 1:4", "n": "", "vs": [[4, "لأنه قد تسلل إلى ما بينكم معلمون لابد أن يلاقوا الحكم بالعقاب الأبدي، كما هو مكتوب لهم منذ القديم. فهم أشرار لا يهابون الله ، يتخذون من نعمة إلهنا فرصة لإباحة الرذائل، وينكرون سيدنا وربنا الوحيد يسوع المسيح."]]}, {"l": "Jud 1:10-13", "n": "", "vs": [[10, "ولكن هؤلاء المعلمين يتكلمون كلاما مهينا على أمور لا يعرفونها. وأما ما يفهمونه بالغريزة، كالحيوانات غير العاقلة، فإنهم به يدمرون أنفسهم."], [11, "الويل لهم! لأنهم سلكوا طريق قايين، واندفعوا إلى ارتكاب خطيئة بلعام طلبا للمال، وتمردوا كما تمرد قورح، فدمروا أنفسهم."], [12, "إنهم يشتركون معكم في ولائم المحبة دون خجل، ولكنهم كصخور تعيقكم. لا هم لهم سوى تعليف أنفسهم! إنهم يشبهون غيوما بلا مطر تسوقها الرياح، وأشجارا خريفية بلا ثمر، يقتلعها أصحابها، فتكون قد ماتت مرتين."], [13, "وبأعمالهم المخجلة يفضحون أنفسهم كأمواج في البحر هائجة تقذف الأوساخ. وهم أشبه بنجوم تائهة في الفضاء، مصيرها الظلام الشديد إلى الأبد!"]]}, {"l": "Rev 21:8", "n": "", "vs": [[8, "أما الجبناء وغير المؤمنين، والفاسدون والقاتلون والزناة، والمتصلون بالشياطين وعبدة الأصنام وجميع الدجالين، فمصيرهم إلى البحيرة المتقدة بالنار والكبريت، الذي هو الموت الثاني»."]]}], "kwAr": "من العمال الأشرار", "noteAr": ""}, {"kw": "the", "raw": "Phi_3:3; Rom_2:28; Gal_2:3, Gal_2:4, Gal_5:1-3, Gal_5:6; Rev_2:9, Rev_3:9", "note": "", "refs": [{"l": "Phi 3:3", "n": "", "vs": [[3, "فإننا نحن أهل الختان الحق، لأننا إنما نعبد بروح الله ونفتخر في المسيح يسوع، ولا نعتمد على أمور الجسد،"]]}, {"l": "Rom 2:28", "n": "", "vs": [[28, "فليس بيهودي من كان يهوديا في الظاهر، ولا بختان ما كان ظاهرا في اللحم."]]}, {"l": "Gal 2:3", "n": "", "vs": [[3, "ولكن، حتى تيطس الذي كان يرافقني وهو يوناني، لم يضطر أن يختن."]]}, {"l": "Gal 2:4", "n": "", "vs": [[4, "إنما أثير الأمر بسبب الإخوة الدجالين الذين أدخلوا بيننا خلسة، فاندسوا ليتجسسوا حريتنا التي لنا في المسيح يسوع، لعلهم يعيدوننا إلى العبودية؛"]]}, {"l": "Gal 5:1-3", "n": "", "vs": [[1, "إن المسيح قد حررنا وأطلقنا في سبيل الحرية. فاثبتوا إذن، ولا تعودوا إلى الارتباك بنير العبودية."], [2, "ها أنا بولس أقول لكم: إن ختنتم، لا ينفعكم المسيح شيئا."], [3, "وأشهد مرة أخرى لكل مختون بأنه ملتزم أن يعمل بالشريعة كلها."]]}, {"l": "Gal 5:6", "n": "", "vs": [[6, "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة."]]}, {"l": "Rev 2:9", "n": "", "vs": [[9, "إني أعلم كم تقاسي من ضيق وفقر، رغم أنك غني. وأعلم تجريح الذين يدعون أنهم يهود ولكنهم ليسوا يهودا، بل هم مجمع للشيطان!"]]}, {"l": "Rev 3:9", "n": "", "vs": [[9, "أما الذين هم من مجمع الشيطان، ويدعون كذبا أنهم يهود، فسأجبرهم على أن يسجدوا عند قدميك، ويعترفوا بأني أحببتك."]]}], "kwAr": "من الذين يبترون الجسد", "noteAr": ""}], "arS": [["خذوا حذركم", ["G991"]], [" من «", []], ["الكلاب", ["G2965"]], ["»، من ", []], ["العمال", ["G2040"]], [" ", []], ["الأشرار", ["G2556"]], ["، من الذين ", []], ["يبترون الجسد", ["G2699"]], [".", []]]}, {"c": 3, "v": 3, "text": "فإننا نحن أهل الختان الحق، لأننا إنما نعبد بروح الله ونفتخر في المسيح يسوع، ولا نعتمد على أمور الجسد،", "groups": [{"kw": "we", "raw": "Gen_17:5-11; Deu_10:16, Deu_30:6; Jer_4:4, Jer_9:26; Rom_2:25-29, Rom_4:11, Rom_4:12; Col_2:11", "note": "", "refs": [{"l": "Gen 17:5-11", "n": "", "vs": [[5, "ولن يدعى اسمك بعد الآن أبرام (ومعناه الأب الرفيع) بل يكون اسمك إبراهيم (ومعناه أب لجمهور) لأني أجعلك أبا لجمهور من الأمم؛"], [6, "وأصيرك مثمرا جدا، وأجعل أمما تتفرع منك، ويخرج من نسلك ملوك."], [7, "وأقيم عهدي الأبدي بيني وبينك، وبين نسلك من بعدك جيلا بعد جيل، فأكون إلها لك ولنسلك من بعدك."], [8, "وأهبك أنت وذريتك من بعدك جميع أرض كنعان، التي نزلت فيها غريبا، ملكا أبديا. وأكون لهم إلها»."], [9, "وقال الرب لإبراهيم: «أما أنت فاحفظ عهدي، أنت وذريتك من بعدك مدى أجيالهم."], [10, "هذا هو عهدي الذي بيني وبينك وبين ذريتك من بعدك الذي عليكم أن تحفظوه: أن يختتن كل ذكر منكم"], [11, "تختنون رأس قلفة غرلتكم فتكون علامة العهد الذي بيني وبينكم"]]}, {"l": "Deu 10:16", "n": "", "vs": [[16, "فطهروا قلوبكم الأثيمة، وأقلعوا عن عنادكم،"]]}, {"l": "Deu 30:6", "n": "", "vs": [[6, "ويطهر الرب إلهكم قلوبكم وقلوب نسلكم لتحبوا الرب إلهكم من كل قلوبكم ومن كل نفوسكم لتحيوا مطمئنين"]]}, {"l": "Jer 4:4", "n": "", "vs": [[4, "اختتنوا للرب، وأزيلوا قلف قلوبكم (أي طهروا عقولكم وقلوبكم وليس أجسادكم فقط) لئلا يتفجر غضبي كنار فتحرق وليس من يخمدها، من جراء أعمالكم الشريرة."]]}, {"l": "Jer 9:26", "n": "", "vs": [[26, "أهل مصر ويهوذا وأدوم وبني عمون وموآب، وسائر المقيمين في الصحراء ممن يقصون شعر أصداغهم، لأن جميع الشعوب غلف، أما كل بيت إسرائيل فإنهم ذوو قلوب غلفاء»."]]}, {"l": "Rom 2:25-29", "n": "", "vs": [[25, "فإن الختان ينفع إن كنت تعمل بالشريعة. ولكن إن كنت مخالفا للشريعة، فقد صار ختانك كأنه عدم ختان."], [26, "إذن، إن عمل غير المختون بأحكام الشريعة، أفلا يحسب عدم ختانه كأنه ختان؟"], [27, "وغير المختون بالطبيعة، إذ يتمم الشريعة، يدينك أنت يامن تخالف الشريعة ولديك الكتاب والختان."], [28, "فليس بيهودي من كان يهوديا في الظاهر، ولا بختان ما كان ظاهرا في اللحم."], [29, "وإنما اليهودي هو من كان يهوديا في الباطن، والختان هو ما كان ختانا للقلب بالروح لا بالحرف. وهذا يأتيه المدح لا من الناس بل من الله!"]]}, {"l": "Rom 4:11", "n": "", "vs": [[11, "ثم تلقى إبراهيم علامة الختان ختما للبر الحاصل بالإيمان الذي كان له وهو مازال غير مختون، لكي يكون أبا لجميع الذين يؤمنون من غير المختونين فيحسب البر لهم أيضا،"]]}, {"l": "Rom 4:12", "n": "", "vs": [[12, "وأبا للمختونين الذين ليسوا من أهل الختان وحسب بل الذين يسيرون في خطى الإيمان الذي كان لأبينا إبراهيم وهو بعد غير مختون."]]}, {"l": "Col 2:11", "n": "", "vs": [[11, "وفيه أيضا ختنتم أنتم ختانا لم تجره الأيدي، إذ نزع عنكم جسد الخطايا البشري وهذا هو ختان المسيح:"]]}], "kwAr": "فإننا نحن أهل الختان", "noteAr": ""}, {"kw": "worship", "raw": "Mal_1:11; Joh_4:23, Joh_4:24; Rom_1:9, Rom_7:6, Rom_8:15, Rom_8:26, Rom_8:27; Eph_6:18; Jud_1:20", "note": "", "refs": [{"l": "Mal 1:11", "n": "", "vs": [[11, "لأنه من مشرق الشمس إلى مغربها اسمي عظيم بين الأمم، وفي كل مكان يحرق لاسمي بخور وذبائح طاهرة، لأن اسمي عظيم بين الأمم، يقول الرب القدير."]]}, {"l": "Joh 4:23", "n": "", "vs": [[23, "فستأتي ساعة، لا بل هي الآن، حين يعبد العابدون الصادقون الآب بالروح وبالحق. لأن الآب يبتغي مثل هؤلاء العابدين."]]}, {"l": "Joh 4:24", "n": "", "vs": [[24, "الله روح، فلذلك لابد لعابديه من أن يعبدوه بالروح وبالحق»."]]}, {"l": "Rom 1:9", "n": "", "vs": [[9, "فإن الله الذي أخدمه بروحي في التبشير بإنجيل ابنه، هو شاهد لي كيف لا أتوقف عن ذكركم"]]}, {"l": "Rom 7:6", "n": "", "vs": [[6, "أما الآن، فنحن قد تحررنا من الشريعة، إذ متنا بالنِّسبة لما كان يقيدنا، حتى نكون عبيدا يخدمون وفقا للنظام الروحي الجديد، لا للنظام الحرفي العتيق."]]}, {"l": "Rom 8:15", "n": "", "vs": [[15, "إذ إنكم لم تنالوا روح عبودية يعيدكم إلى الخوف، بل نلتم روح بنوة به نصرخ: «أبا! أبانا!»"]]}, {"l": "Rom 8:26", "n": "", "vs": [[26, "وكذلك الروح أيضا يمدنا بالعون لنقهر ضعفنا. فإننا لا نعلم ما يجب أن نصلي لأجله كما يليق، ولكن الروح نفسه يؤدي الشفاعة عنا بأنات تفوق التعبير."]]}, {"l": "Rom 8:27", "n": "", "vs": [[27, "على أن فاحص القلوب يعلم قصد الروح، لأن الروح يشفع في القديسين بما يوافق الله ."]]}, {"l": "Eph 6:18", "n": "", "vs": [[18, "كونوا مصلين في كل حال، بكل صلاة وطلبة في الروح، وساهرين لهذا الغرض عينه مواظبين تماما على جميع الطلبات لأجل القديسين جميعا،"]]}, {"l": "Jud 1:20", "n": "", "vs": [[20, "وأما أنتم أيها الأحباء، فابنوا أنفسكم على إيمانكم الأقدس، وصلوا دائما في الروح القدس."]]}], "kwAr": "نعبد بروح الله", "noteAr": ""}, {"kw": "rejoice", "raw": "Phi_3:7-9; Psa_105:3; Isa_45:25; Jer_9:23, Jer_9:24; 1Co_1:29-31; Gal_6:13, Gal_6:14", "note": "", "refs": [{"l": "Phi 3:7-9", "n": "", "vs": [[7, "ولكن، ما كان لي من ربح، فقد اعتبرته خسارة، من أجل المسيح."], [8, "بل إني أعتبر كل شيء خسارة، من أجل امتياز معرفة المسيح يسوع ربي؛ فمن أجله تحملت خسارة كل شيء، وأعتبر كل شيء نفاية، لكي أربح المسيح"], [9, "ويكون لي فيه مقام، إذ ليس لي بري الذاتي القائم على أساس الشريعة، بل البر الآتي من الإيمان بالمسيح، البر الذي من عند الله على أساس الإيمان."]]}, {"l": "Psa 105:3", "n": "", "vs": [[3, "تباهوا باسمه القدوس، لتفرح قلوب طالبي الرب."]]}, {"l": "Isa 45:25", "n": "", "vs": [[25, "أما ذرية إسرائيل فبالرب يتبررون وبه يزهون."]]}, {"l": "Jer 9:23", "n": "", "vs": [[23, "«فلا يفتخرن الحكيم بحكمته، ولا يزهون الجبار بجبروته، ولا الغني بثروته."]]}, {"l": "Jer 9:24", "n": "", "vs": [[24, "بل ليفتخر المفتخر بأنه يدرك ويعرفني أني أنا الرب الذي يمارس الرحمة والعدل والبر في الأرض لأني أسر بها»."]]}, {"l": "1Co 1:29-31", "n": "", "vs": [[29, "حتى لا يفتخر أي بشر أمام الله."], [30, "وبفضل الله صار لكم مقام في المسيح يسوع الذي جعل لنا حكمة من الله وبرا وقداسة وفداء،"], [31, "حتى إن «من افتخر، فليفتخر بالرب»، على حد ما قد كتب."]]}, {"l": "Gal 6:13", "n": "", "vs": [[13, "فحتى أولئك الذين يختنون، هم أنفسهم، لا يعملون بالشريعة، بل يريدون لكم أن تختنوا ليفتخروا بجسدكم."]]}, {"l": "Gal 6:14", "n": "", "vs": [[14, "أما أنا فحاشا لي أن أفتخر إلا بصليب ربنا يسوع المسيح، الذي به أصبح العالم بالنسبة لي مصلوبا، وأنا أصبحت بالنسبة له مصلوبا."]]}], "kwAr": "ونفتخر في المسيح يسوع", "noteAr": ""}, {"kw": "have", "raw": "Phi_3:4-6; 1Pe_1:23-25", "note": "", "refs": [{"l": "Phi 3:4-6", "n": "", "vs": [[4, "مع أن من حقي أنا أيضا أن أعتمد عليها. فإن خطر على بال أحد أن يعتمد على أمور الجسد، فأنا أحق منه:"], [5, "فمن جهة الختان، مختون في اليوم الثامن من عمري؛ وأنا من جنس إسرائيل، من سبط بنيامين، عبراني من العبرانيين؛ ومن جهة الشريعة، أنا فريسي؛"], [6, "ومن جهة الحماسة، مضطهد للكنيسة؛ ومن جهة البر المطلوب في الشريعة، كنت بلا لوم."]]}, {"l": "1Pe 1:23-25", "n": "", "vs": [[23, "فأنتم قد ولدتم ولادة ثانية لا من زرع بشري يفنى، بل مما لا يفنى: بكلمة الله الحية الباقية إلى الأبد."], [24, "فإن الحياة البشرية كالعشب، ومجدها كله كزهر العشب. ولابد أن تفنى كما ييبس العشب ويسقط زهره!"], [25, "أما كلمة الرب فتبقى ثابتة إلى الأبد، وهي الكلمة التي وصلت بشارتها إليكم!"]]}], "kwAr": "ولا نعتمد على أمور الجسد", "noteAr": ""}], "arS": [["فإننا ", []], ["نحن", ["G2249"]], [" أهل ", []], ["الختان", ["G4061"]], [" الحق، لأننا إنما ", []], ["نعبد", ["G3000"]], [" ", []], ["بروح", ["G4151"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["ونفتخر", ["G2744"]], [" في ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], ["، ولا ", []], ["نعتمد", ["G3982"]], [" على أمور ", []], ["الجسد", ["G4561"]], ["،", []]]}, {"c": 3, "v": 4, "text": "مع أن من حقي أنا أيضا أن أعتمد عليها. فإن خطر على بال أحد أن يعتمد على أمور الجسد، فأنا أحق منه:", "groups": [{"kw": "", "raw": "2Co_11:18-22", "note": "", "refs": [{"l": "2Co 11:18-22", "n": "", "vs": [[18, "بما أن كثيرين يفتخرون بما يوافق الجسد، فأنا أيضا سأفتخر."], [19, "فلأنكم عقلاء، تحتملون الأغبياء بسرور!"], [20, "فإنكم تحتملون كل من يستعبدكم، ويفترسكم، ويستغلكم، ويتكبر عليكم، ويلطمكم على وجوهكم."], [21, "ياللمهانة! كم كنا ضعفاء في معاملتنا لكم!"], [22, "فإن كانوا عبرانيين، فأنا كذلك؛ أو إسرائيليين، فأنا كذلك؛ أو من نسل إبراهيم؛ فأنا كذلك!"]]}], "kwAr": "", "noteAr": ""}], "arS": [["مع أن من حقي ", []], ["أنا", ["G1473"]], [" أيضا أن ", []], ["أعتمد", ["G4006"]], [" عليها. فإن خطر على بال ", []], ["أحد", ["G1536"]], [" أن ", []], ["يعتمد", ["G3982"]], [" على أمور ", []], ["الجسد", ["G4561"]], ["، ", []], ["فأنا", ["G1473"]], [" ", []], ["أحق", ["G3123"]], [" منه:", []]]}, {"c": 3, "v": 5, "text": "فمن جهة الختان، مختون في اليوم الثامن من عمري؛ وأنا من جنس إسرائيل، من سبط بنيامين، عبراني من العبرانيين؛ ومن جهة الشريعة، أنا فريسي؛", "groups": [{"kw": "Circumcised", "raw": "Gen_17:12; Luk_2:21; Joh_7:21-24", "note": "", "refs": [{"l": "Gen 17:12", "n": "", "vs": [[12, "تختنون على مدى أجيالكم كل ذكر فيكم ابن ثمانية أيام سواء كان المولود من ذريتك أم كان ابنا لغريب مشترى بمالك ممن ليس من نسلك."]]}, {"l": "Luk 2:21", "n": "", "vs": [[21, "ولما تمت ثمانية أيام ليختن الطفل، سمي يسوع، كما كان قد سمي بلسان الملاك قبل أن يحبل به في البطن."]]}, {"l": "Joh 7:21-24", "n": "", "vs": [[21, "فقال يسوع: «عملت يوم السبت عملا واحدا فاستغربتم جميعا."], [22, "إن موسى أوصاكم بالختان وهذا لا يعني أن الختان يرجع إلى موسى بل إلى الآباء ولذلك تختنون الإنسان ولو يوم السبت."], [23, "فإن كنتم تجرون الختان للإنسان يوم السبت لكي لا تخالفوا شريعة موسى، فهل تغضبون علي لأني شفيت إنسانا بكامله في السبت؟"], [24, "لا تحكموا بحسب الظاهر، بل احكموا حكما عادلا»."]]}], "kwAr": "مختون في اليوم الثامن", "noteAr": ""}, {"kw": "of the stock", "raw": "Act_22:3; 2Co_11:22", "note": "", "refs": [{"l": "Act 22:3", "n": "", "vs": [[3, "»أنا رجل يهودي، ولدت في طرسوس الواقعة في مقاطعة كيليكية، ولكني نشأت في هذه المدينة وتعلمت عند قدمي غمالائيل التربية الموافقة تماما لشريعة آبائنا. وكنت غيورا في أمور الله، مثلكم جميعا اليوم."]]}, {"l": "2Co 11:22", "n": "", "vs": [[22, "فإن كانوا عبرانيين، فأنا كذلك؛ أو إسرائيليين، فأنا كذلك؛ أو من نسل إبراهيم؛ فأنا كذلك!"]]}], "kwAr": "من جنس إسرائيل", "noteAr": ""}, {"kw": "of the tribe", "raw": "Rom_11:1", "note": "", "refs": [{"l": "Rom 11:1", "n": "", "vs": [[1, "وهنا أقول: هل رفض الله شعبه؟ حاشا! فأنا أيضا إسرائيلي، من نسل إبراهيم ومن سبط بنيامين."]]}], "kwAr": "من سبط بنيامين", "noteAr": ""}, {"kw": "an", "raw": "Gen_14:13, Gen_40:15, Gen_41:12; 1Sa_4:6; Jon_1:9; Act_6:1; 2Co_11:22", "note": "", "refs": [{"l": "Gen 14:13", "n": "", "vs": [[13, "وجاء أحد الناجين إلى أبرام العبراني الذي كان مازال مقيما عند بلوطات ممرا أخي أشكول وعانر حلفاء أبرام وأبلغه بما جرى."]]}, {"l": "Gen 40:15", "n": "", "vs": [[15, "لأنني حملت عنوة من أرض العبرانيين، وهنا أيضا لم أجن شيئا ليزجوا بي في هذا السجن»."]]}, {"l": "Gen 41:12", "n": "", "vs": [[12, "وكان معنا هناك غلام عبراني، عبد لرئيس الحرس، فسردنا عليه حلمينا ففسرهما لكل منا حسب تعبير حلمه."]]}, {"l": "1Sa 4:6", "n": "", "vs": [[6, "فسمع الفلسطينيون ضجيج الهتاف فتساءلوا: «ما ضجيج الهتاف هذا في معسكر العبرانيين؟» ولما عرفوا أن تابوت الرب قد جيء به إلى المعسكر،"]]}, {"l": "Jon 1:9", "n": "", "vs": [[9, "فأجابهم: «أنا عبراني، وأنا خائف من الرب إله السماوات، صانع البحر والبر»."]]}, {"l": "Act 6:1", "n": "", "vs": [[1, "وإذ تكاثر التلاميذ في تلك الأيام، احتج اليهود اليونانيون على العبرانيين، لأن أراملهم لم يكن يحصلن على نصيب من الإعانات اليومية."]]}, {"l": "2Co 11:22", "n": "", "vs": [[22, "فإن كانوا عبرانيين، فأنا كذلك؛ أو إسرائيليين، فأنا كذلك؛ أو من نسل إبراهيم؛ فأنا كذلك!"]]}], "kwAr": "عبراني من العبرانيين", "noteAr": ""}, {"kw": "Pharisee", "raw": "Act_23:6, Act_26:4, Act_26:5", "note": "", "refs": [{"l": "Act 23:6", "n": "", "vs": [[6, "وإذ كان بولس يعلم أن بعض أعضاء المجلس من مذهب الصدوقيين، وبعضهم من مذهب الفريسيين، نادى في المجلس: «أيها الإخوة، أنا فريسي ابن فريسي، وإني أحاكم الآن لأنني أعتقد أن للموتى رجاء بالقيامة!»"]]}, {"l": "Act 26:4", "n": "", "vs": [[4, "إن اليهود جميعا يعرفون نشأتي من البداية. فقد عشت بين شعبي في أورشليم منذ صغري."]]}, {"l": "Act 26:5", "n": "", "vs": [[5, "وماداموا يعرفونني من البداية، فلو أرادوا لشهدوا أنني كنت فريسيا، أي تابعا للمذهب الأكثر تشددا في ديانتنا."]]}], "kwAr": "فريسي", "noteAr": ""}], "arS": [["فمن جهة ", []], ["الختان", ["G4061"]], ["، مختون في اليوم ", []], ["الثامن", ["G3637"]], [" من عمري؛ وأنا من ", []], ["جنس", ["G1085"]], [" ", []], ["إسرائيل", ["G2474"]], ["، من ", []], ["سبط", ["G5443"]], [" ", []], ["بنيامين", ["G958"]], ["، ", []], ["عبراني", ["G1445"]], [" من ", []], ["العبرانيين", ["G1445"]], ["؛ ومن جهة ", []], ["الشريعة", ["G3551"]], ["، أنا ", []], ["فريسي", ["G5330"]], ["؛", []]]}, {"c": 3, "v": 6, "text": "ومن جهة الحماسة، مضطهد للكنيسة؛ ومن جهة البر المطلوب في الشريعة، كنت بلا لوم.", "groups": [{"kw": "zeal", "raw": "2Sa_21:2; 2Ki_10:16; Act_21:20; Rom_10:2; Gal_1:13, Gal_1:14", "note": "", "refs": [{"l": "2Sa 21:2", "n": "", "vs": [[2, "فاستدعى الملك الجبعونيين، وهم من بقايا شعب الأموريين الذين وقع معهم الإسرائيليون معاهدة صلح، ولكن شاول سعى للقضاء عليهم من فرط غيرته على بني يهوذا وإسرائيل."]]}, {"l": "2Ki 10:16", "n": "", "vs": [[16, "وقال: «تعال معي لترى مدى غيرتي للرب»، وهكذا أركبه معه في المركبة."]]}, {"l": "Act 21:20", "n": "", "vs": [[20, "فلما سمعوا أخباره مجدوا الله ، وقالوا له: «أنت ترى أيها الأخ أن الذين آمنوا بالرب من اليهود يعدون بالآلاف، وهم متحمسون للشريعة،"]]}, {"l": "Rom 10:2", "n": "", "vs": [[2, "فإني أشهد لهم أن عندهم غيرة لله، ولكنها ليست على أساس المعرفة."]]}, {"l": "Gal 1:13", "n": "", "vs": [[13, "فإنكم قد سمعتم بسيرتي الماضية في الديانة اليهودية، كيف كنت أضطهد كنيسة الله متطرفا إلى أقصى حد، ساعيا إلى تخريبها،"]]}, {"l": "Gal 1:14", "n": "", "vs": [[14, "وكيف كنت متفوقا في الديانة اليهودية على كثيرين من أبناء جيلي في أمتي لكوني غيورا أكثر منهم جدا على تقاليد آبائي."]]}], "kwAr": "الحماسة", "noteAr": ""}, {"kw": "persecuting", "raw": "Act_8:3, 9:1-19, Act_22:3, Act_22:4, Act_26:9, Act_26:10; 1Co_15:9; 1Ti_1:13", "note": "", "refs": [{"l": "Act 8:3", "n": "", "vs": [[3, "أما شاول فكان يحاول إبادة الكنيسة، فيذهب من بيت إلى بيت ويجر الرجال والنساء ويلقيهم في السجن."]]}, {"l": "Act 9:1-19", "n": "", "vs": [[1, "أما شاول فكان لايزال يفور بالتهديد والقتل على تلاميذ الرب. فذهب إلى رئيس الكهنة،"], [2, "وطلب منه رسائل إلى مجامع اليهود في دمشق لتسهيل القبض على أتباع هذا الطريق من الرجال والنساء، حيثما يجدهم، ليسوقهم مقيدين إلى أورشليم."], [3, "وفيما هو منطلق إلى دمشق، وقد اقترب منها، لمع حوله فجأة نور من السماء،"], [4, "فوقع إلى الأرض وسمع صوتا يقول له: «شاول! شاول! لماذا تضطهدني؟»"], [5, "فسأل: «من أنت ياسيد؟» فجاءه الجواب: «أنا يسوع الذي أنت تضطهده، صعب عليك أن ترفس المناخس»."], [6, "فقال وهو مرتعد ومتحير؛ «يارب ماذا تريد أن أفعل؟» فقال له الرب: «قم، وادخل المدينة فيقال لك ما يجب أن تفعله»."], [7, "وأما مرافقو شاول فوقفوا مذهولين لا ينطقون، فقد سمعوا الصوت ولكنهم لم يروا أحدا."], [8, "وعندما نهض شاول عن الأرض، فتح عينيه فوجد أنه لا يبصر، فاقتادوه بيده وأدخلوه إلى دمشق،"], [9, "حيث بقي ثلاثة أيام لا يبصر ولا يأكل ولا يشرب."], [10, "وكان في دمشق تلميذ للرب اسمه حنانيا، ناداه الرب في رؤيا: «يا حنانيا!» فقال: «لبيك يارب!»"], [11, "فقال له الرب: «اذهب إلى الشارع المعروف بالمستقيم واسأل في بيت يهوذا، عن رجل من طرسوس اسمه شاول. إنه يصلي هناك الآن."], [12, "وقد رأى في رؤيا رجلا اسمه حنانيا يدخل إليه ويضع يده عليه، فيبصر»."], [13, "فقال حنانيا للرب: «ولكني، يارب، قد سمعت من كثيرين بالفظائع التي ارتكبها هذا الرجل بقديسيك في أورشليم،"], [14, "وقد خوله رؤساء الكهنة السلطة ليلقي القبض على كل من يدعو باسمك»."], [15, "فأمره الرب: «اذهب! فقد اخترت هذا الرجل ليكون إناء يحمل اسمي إلى الأمم والملوك وبني إسرائيل."], [16, "وسأريه كم ينبغي أن يتألم من أجل اسمي!»"], [17, "فذهب حنانيا ودخل بيت يهوذا، ووضع يديه على شاول وقال: «أيها الأخ شاول، إن الرب يسوع، الذي ظهر لك في الطريق التي جئت فيها، أرسلني إليك لكي تبصر وتمتليء من الروح القدس»."], [18, "وفي الحال تساقط من عيني شاول ما يشبه القشور، فأبصر ، ثم قام وتعمد."], [19, "وتناول طعاما فاستعاد قوته وبقي بضعة أيام مع التلاميذ في دمشق."]]}, {"l": "Act 22:3", "n": "", "vs": [[3, "»أنا رجل يهودي، ولدت في طرسوس الواقعة في مقاطعة كيليكية، ولكني نشأت في هذه المدينة وتعلمت عند قدمي غمالائيل التربية الموافقة تماما لشريعة آبائنا. وكنت غيورا في أمور الله، مثلكم جميعا اليوم."]]}, {"l": "Act 22:4", "n": "", "vs": [[4, "فاضطهدت هذا الطريق حتى الموت، فكنت أعتقل أتباعه من الرجال والنساء، وأزج بهم في السجون."]]}, {"l": "Act 26:9", "n": "", "vs": [[9, "وكنت أعتقد أنه يجب أن أبذل غاية جهدي لأقاوم اسم يسوع الناصري."]]}, {"l": "Act 26:10", "n": "", "vs": [[10, "وقد عملت على تنفيذ خطتي في أورشليم بتفويض خاص من رؤساء الكهنة، فألقيت في السجن عددا كبيرا من القديسين. وكنت أعطي صوتي بالموافقة عندما كان المجلس يحكم بإعدامهم."]]}, {"l": "1Co 15:9", "n": "", "vs": [[9, "فإني أنا أصغر الرسل شأنا، ولست أهلا لأن أدعى رسولا لأني اضطهدت كنيسة الله."]]}, {"l": "1Ti 1:13", "n": "", "vs": [[13, "مع أني كنت في الماضي مجدفا عليه، ومضطهدا ومهينا له! ولكني عوملت بالرحمة، لأني عملت ما عملته عن جهل وفي عدم إيمان."]]}], "kwAr": "مضطهد للكنيسة", "noteAr": ""}, {"kw": "touching", "raw": "Mat_5:20, Mat_23:25; Mar_10:20,Mar_10:21; Luk_1:6; Act_26:5; Rom_7:9, Rom_9:31, Rom_9:32, Rom_10:2-5", "note": "", "refs": [{"l": "Mat 5:20", "n": "", "vs": [[20, "فإني أقول لكم: إن لم يزد بركم على بر الكتبة والفريسيين، لن تدخلوا ملكوت السماوات أبدا."]]}, {"l": "Mat 23:25", "n": "", "vs": [[25, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تنظفون الكأس والصحفة من الخارج، ولكنهما من الداخل ممتلئتان بما كسبتم بالنهب والطمع!"]]}, {"l": "Mar 10:20", "n": "", "vs": [[20, "فأجابه قائلا: «هذه كلها عملت بها منذ صغري»"]]}, {"l": "Mar 10:21", "n": "", "vs": [[21, "وإذ نظر يسوع إليه، أحبه، وقال له: «ينقصك شيء واحد: اذهب، بع كل ما عندك، ووزع على الفقراء، فيكون لك كنز في السماء، ثم تعال اتبعني»."]]}, {"l": "Luk 1:6", "n": "", "vs": [[6, "وكان كلاهما بارين أمام الله، يسلكان وفقا لوصايا الرب وأحكامه كلها بغير لوم."]]}, {"l": "Act 26:5", "n": "", "vs": [[5, "وماداموا يعرفونني من البداية، فلو أرادوا لشهدوا أنني كنت فريسيا، أي تابعا للمذهب الأكثر تشددا في ديانتنا."]]}, {"l": "Rom 7:9", "n": "", "vs": [[9, "أما أنا فكنت من قبل عائشا بمعزل عن الشريعة؛ ولكن لما جاءت الشريعة عاشت الخطيئة،"]]}, {"l": "Rom 9:31", "n": "", "vs": [[31, "أما إسرائيل، وقد كانوا يسعون وراء شريعة تهدف إلى البر، فقد فشلوا حتى في بلوغ الشريعة."]]}, {"l": "Rom 9:32", "n": "", "vs": [[32, "ولأي سبب؟ لأن سعيهم لم يكن على أساس الإيمان، بل كان وكأن الأمر قائم على الأعمال. فقد تعثروا بحجر العثرة،"]]}, {"l": "Rom 10:2-5", "n": "", "vs": [[2, "فإني أشهد لهم أن عندهم غيرة لله، ولكنها ليست على أساس المعرفة."], [3, "فبما أنهم جهلوا بر الله وسعوا إلى إثبات برهم الذاتي، لم يخضعوا للبر الإلهي."], [4, "فإن غاية الشريعة هي المسيح لتبرير كل من يؤمن."], [5, "فقد كتب موسى عن البر الآتي من الشريعة: «إن الإنسان الذي يعمل بهذه الأمور، يحيا بها»."]]}], "kwAr": "البر المطلوب في الشريعة", "noteAr": ""}], "arS": [["ومن جهة ", []], ["الحماسة", ["G2205"]], ["، ", []], ["مضطهد", ["G1377"]], [" ", []], ["للكنيسة", ["G1577"]], ["؛ ومن جهة ", []], ["البر", ["G1343"]], [" المطلوب في ", []], ["الشريعة", ["G3551"]], ["، كنت ", []], ["بلا لوم", ["G273"]], [".", []]]}, {"c": 3, "v": 7, "text": "ولكن، ما كان لي من ربح، فقد اعتبرته خسارة، من أجل المسيح.", "groups": [{"kw": "", "raw": "Phi_3:4-6, Phi_3:8-10; Gen_19:17, Gen_19:26; Job_2:4; Pro_13:8, Pro_23:23; Mat_13:44-46, Mat_16:26; Luk_14:26, Luk_14:33, Luk_16:8, Luk_17:31-33; Act_27:18, Act_27:19, Act_27:38; Gal_2:15, Gal_2:16, Gal_5:2-5", "note": "", "refs": [{"l": "Phi 3:4-6", "n": "", "vs": [[4, "مع أن من حقي أنا أيضا أن أعتمد عليها. فإن خطر على بال أحد أن يعتمد على أمور الجسد، فأنا أحق منه:"], [5, "فمن جهة الختان، مختون في اليوم الثامن من عمري؛ وأنا من جنس إسرائيل، من سبط بنيامين، عبراني من العبرانيين؛ ومن جهة الشريعة، أنا فريسي؛"], [6, "ومن جهة الحماسة، مضطهد للكنيسة؛ ومن جهة البر المطلوب في الشريعة، كنت بلا لوم."]]}, {"l": "Phi 3:8-10", "n": "", "vs": [[8, "بل إني أعتبر كل شيء خسارة، من أجل امتياز معرفة المسيح يسوع ربي؛ فمن أجله تحملت خسارة كل شيء، وأعتبر كل شيء نفاية، لكي أربح المسيح"], [9, "ويكون لي فيه مقام، إذ ليس لي بري الذاتي القائم على أساس الشريعة، بل البر الآتي من الإيمان بالمسيح، البر الذي من عند الله على أساس الإيمان."], [10, "وغايتي أن أعرف المسيح وقوة قيامته والشركة في آلامه؛ والتشبه به في موته،"]]}, {"l": "Gen 19:17", "n": "", "vs": [[17, "وما إن أخرجاهم بعيدا حتى قال أحد الملاكين: «انج بحياتك. لا تلتفت وراءك ولا تتوقف في كل منطقة السهل. اهرب إلى الجبل لئلا تهلك»."]]}, {"l": "Gen 19:26", "n": "", "vs": [[26, "وتلفتت زوجة لوط السائرة خلفه وراءها، فتحولت إلى عمود من الملح."]]}, {"l": "Job 2:4", "n": "", "vs": [[4, "فأجاب الشيطان: «جلد بجلد، فالإنسان يبذل كل ما يملك فداء نفسه."]]}, {"l": "Pro 13:8", "n": "", "vs": [[8, "يفتدي المرء نفسه بغناه، أما الفقير فلا يبالي بالتهديد."]]}, {"l": "Pro 23:23", "n": "", "vs": [[23, "اقتن الحق ولا تبعه، وكذا الحكمة والتأديب والفطنة."]]}, {"l": "Mat 13:44-46", "n": "", "vs": [[44, "يشبه ملكوت السماوات بكنز مطمور في حقل، وجده رجل، فعاد وطمره. ومن فرحه، ذهب وباع كل ما كان يملك واشترى ذلك الحقل."], [45, "ويشبه ملكوت السماوات أيضا بتاجر كان يبحث عن اللآليء الجميلة."], [46, "فما إن وجد لؤلؤة ثمينة جدا، حتى ذهب وباع كل ما يملك، واشتراها."]]}, {"l": "Mat 16:26", "n": "", "vs": [[26, "فماذا ينتفع الإنسان لو ربح العالم كله وخسر نفسه؟ أو ماذا يقدم الإنسان فداء عن نفسه؟"]]}, {"l": "Luk 14:26", "n": "", "vs": [[26, "«إن جاء إلي أحد، ولم يبغض أباه وأمه وزوجته وأولاده وإخوته وأخواته، بل نفسه أيضا، فلا يمكنه أن يكون تلميذا لي."]]}, {"l": "Luk 14:33", "n": "", "vs": [[33, "هكذا إذن، كل واحد منكم لا يهجر كل ما يملكه، لا يمكنه أن يكون تلميذا لي."]]}, {"l": "Luk 16:8", "n": "", "vs": [[8, "فامتدح السيد وكيله الخائن لأنه تصرف بحكمة. فإن أبناء هذا العالم أحكم مع أهل جيلهم من أبناء النور."]]}, {"l": "Luk 17:31-33", "n": "", "vs": [[31, "فمن كان في ذلك اليوم على السطح وأمتعته في البيت، فلا ينزل ليأخذها؛ ومن كان في الحقل كذلك، فلا يرجع إلى الوراء."], [32, "تذكروا زوجة لوط!"], [33, "من يسعى لإنقاذ حياته يفقدها، ومن فقدها يحافظ عليها."]]}, {"l": "Act 27:18", "n": "", "vs": [[18, "وفي اليوم الثاني اشتدت علينا العاصفة، فأخذوا يخففون من الحمولة."]]}, {"l": "Act 27:19", "n": "", "vs": [[19, "وفي اليوم الثالث رموا أثاث السفينة بأيديهم."]]}, {"l": "Act 27:38", "n": "", "vs": [[38, "وبعدما شبعوا رموا بالقمح في البحر ليخففوا حمولة السفينة."]]}, {"l": "Gal 2:15", "n": "", "vs": [[15, "نحن يهود بالولادة، ولسنا أمما خاطئين."]]}, {"l": "Gal 2:16", "n": "", "vs": [[16, "ولكننا، إذ علمنا أن الإنسان لا يتبرر على أساس الأعمال المطلوبة في الشريعة بل فقط بالإيمان بيسوع المسيح، آمنا نحن أيضا بالمسيح يسوع، لنتبرر على أساس الإيمان به، لا على أساس أعمال الشريعة، لأنه على أعمال الشريعة لا يبرر أي إنسان."]]}, {"l": "Gal 5:2-5", "n": "", "vs": [[2, "ها أنا بولس أقول لكم: إن ختنتم، لا ينفعكم المسيح شيئا."], [3, "وأشهد مرة أخرى لكل مختون بأنه ملتزم أن يعمل بالشريعة كلها."], [4, "يامن تريدون التبرير عن طريق الشريعة، قد حرمتم المسيح وسقطتم من النعمة!"], [5, "فإننا، بالروح وعلى أساس الإيمان، ننتظر الرجاء الذي ينتجه البر."]]}], "kwAr": "", "noteAr": ""}], "arS": [["ولكن، ما كان لي من ", []], ["ربح", ["G2771"]], ["، فقد ", []], ["اعتبرته", ["G2233"]], [" ", []], ["خسارة", ["G2209"]], ["، من أجل ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 3, "v": 8, "text": "بل إني أعتبر كل شيء خسارة، من أجل امتياز معرفة المسيح يسوع ربي؛ فمن أجله تحملت خسارة كل شيء، وأعتبر كل شيء نفاية، لكي أربح المسيح", "groups": [{"kw": "doubtless", "raw": "Num_14:30; Psa_126:6; Luk_11:20; 1Co_9:10; 1Jo_2:19", "note": "", "refs": [{"l": "Num 14:30", "n": "", "vs": [[30, "لن تدخلوا الأرض التي وعدت رافعا يدي بقسم أن أسكنكم فيها، ما عدا كالب بن يفنة ويشوع بن نون."]]}, {"l": "Psa 126:6", "n": "", "vs": [[6, "ومن يذهب باكيا حاملا بذاره يرجع مترنما حاملا حزم حصيده."]]}, {"l": "Luk 11:20", "n": "", "vs": [[20, "أما إذا كنت أطرد الشياطين بإصبع الله، فقد أقبل عليكم ملكوت الله."]]}, {"l": "1Co 9:10", "n": "", "vs": [[10, "أم يقول ذلك كله من أجلنا؟ نعم، فمن أجلنا قد كتب ذلك، لأنه من حق الفلاح أن يفلح برجاء، والدراس أن يدرس برجاء، على أمل الاشتراك في الغلة."]]}, {"l": "1Jo 2:19", "n": "", "vs": [[19, "هؤلاء الدجالون انفصلوا عنا، لكنهم في الواقع لم يكونوا منا. ولو كانوا منا لظلوا معنا. فانفصالهم عنا إذن برهان على أنهم جميعا ليسوا منا."]]}], "kwAr": "بل", "noteAr": ""}, {"kw": "I count", "raw": "Act_20:24; Rom_8:18", "note": "", "refs": [{"l": "Act 20:24", "n": "", "vs": [[24, "ولكني لا أحسب لحياتي أية قيمة، ما دمت أسعى إلى بلوغ غايتي وإتمام الخدمة التي كلفني إياها الرب يسوع: أن أشهد ببشارة نعمة الله."]]}, {"l": "Rom 8:18", "n": "", "vs": [[18, "فإني مقتنع بأن آلام الزمان الحاضر ليست شيئا إذا قيست بالمجد الآتي الذي سيعلن فينا."]]}], "kwAr": "إني أعتبر كل شيء خسارة", "noteAr": ""}, {"kw": "the excellency", "raw": "Phi_3:10; Isa_53:11; Jer_9:23, Jer_9:24; Mat_11:25-27, Mat_16:16, Mat_16:17; Luk_10:21, Luk_10:22; Joh_14:7, Joh_14:20, Joh_16:3, Joh_17:3, Joh_17:8; 1Co_2:2; 2Co_4:4, 2Co_4:6; Gal_1:16; Eph_1:17, Eph_1:18; Eph_3:8, Eph_3:9, Eph_3:18, Eph_3:19; Col_2:2, Col_2:3; 1Pe_2:7; 2Pe_1:3, 2Pe_3:18; 1Jo_5:20", "note": "", "refs": [{"l": "Phi 3:10", "n": "", "vs": [[10, "وغايتي أن أعرف المسيح وقوة قيامته والشركة في آلامه؛ والتشبه به في موته،"]]}, {"l": "Isa 53:11", "n": "", "vs": [[11, "ويرى ثمار تعب نفسه ويشبع، وعبدي البار يبرر بمعرفته كثيرين ويحمل آثامهم."]]}, {"l": "Jer 9:23", "n": "", "vs": [[23, "«فلا يفتخرن الحكيم بحكمته، ولا يزهون الجبار بجبروته، ولا الغني بثروته."]]}, {"l": "Jer 9:24", "n": "", "vs": [[24, "بل ليفتخر المفتخر بأنه يدرك ويعرفني أني أنا الرب الذي يمارس الرحمة والعدل والبر في الأرض لأني أسر بها»."]]}, {"l": "Mat 11:25-27", "n": "", "vs": [[25, "وفي ذلك الوقت، تكلم يسوع فقال: «أحمدك أيها الآب، رب السماء والأرض، لأنك حجبت هذه الأمور عن الحكماء والفهماء، وكشفتها للأطفال!"], [26, "نعم أيها الآب، لأنه هكذا حسن في نظرك."], [27, "كل شيء قد سلمه إلي أبي. ولا أحد يعرف الابن إلا الآب، ولا أحد يعرف الآب إلا الابن، ومن أراد الابن أن يعلنه له."]]}, {"l": "Mat 16:16", "n": "", "vs": [[16, "فأجاب سمعان بطرس قائلا: «أنت هو المسيح ابن الله الحي!»"]]}, {"l": "Mat 16:17", "n": "", "vs": [[17, "فقال له يسوع: «طوبى لك ياسمعان بن يونا. فما أعلن لك هذا لحم ودم، بل أبي الذي في السماوات."]]}, {"l": "Luk 10:21", "n": "", "vs": [[21, "في تلك الساعة ابتهج يسوع بالروح وقال: «أحمدك أيها الآب، رب السماء والأرض، لأنك حجبت هذه الأمور عن الحكماء والفهماء، وكشفتها للأطفال. نعم، أيها الآب، لأنه هكذا حسن في نظرك!"]]}, {"l": "Luk 10:22", "n": "", "vs": [[22, "كل شيء قد سلم إلي من قبل أبي، ولا أحد يعرف من هو الابن إلا الآب، ولا من هو الآب إلا الابن ومن أراد الابن أن يعلنه له!»"]]}, {"l": "Joh 14:7", "n": "", "vs": [[7, "إن كنتم قد عرفتموني، فقد عرفتم أبي أيضا، ومنذ الآن تعرفونه وقد رأيتموه»."]]}, {"l": "Joh 14:20", "n": "", "vs": [[20, "في ذلك اليوم تعلمون أني أنا في أبي، وأنتم في، وأنا فيكم."]]}, {"l": "Joh 16:3", "n": "", "vs": [[3, "وهم يفعلون هذا بكم لأنهم لم يعرفوا أبي، ولا عرفوني."]]}, {"l": "Joh 17:3", "n": "", "vs": [[3, "والحياة الأبدية هي أن يعرفوك أنت الإله الحق وحدك، والذي أرسلته: يسوع المسيح."]]}, {"l": "Joh 17:8", "n": "", "vs": [[8, "لأني نقلت إليهم الوصايا التي أوصيتني بها، فقبلوها، وعرفوا حقا أني خرجت من عندك، وآمنوا أنك أنت أرسلتني."]]}, {"l": "1Co 2:2", "n": "", "vs": [[2, "إذ كنت عازما ألا أعرف شيئا بينكم إلا يسوع المسيح، وأن أعرفه مصلوبا."]]}, {"l": "2Co 4:4", "n": "", "vs": [[4, "الذين أعمى إله هذا العالم أذهانهم حتى لا يضيء لهم نور الإنجيل المختص بمجد المسيح الذي هو صورة الله."]]}, {"l": "2Co 4:6", "n": "", "vs": [[6, "فإن الله ، الذي أمر أن يشرق نور من الظلام، هو الذي جعل النور يشرق في قلوبنا، لإشعاع معرفة مجد الله المتجلي في وجه المسيح."]]}, {"l": "Gal 1:16", "n": "", "vs": [[16, "أن يعلن ابنه في لأبشر به بين الأمم، في الحال لم أستشر لحما ودما،"]]}, {"l": "Eph 1:17", "n": "", "vs": [[17, "حتى يهبكم إله ربنا يسوع المسيح، أبو المجد، روح حكمة وإلهام: لتعرفوه معرفة كاملة"]]}, {"l": "Eph 1:18", "n": "", "vs": [[18, "إذ تستنير بصائر قلوبكم، فتعلموا ما في دعوته لكم من رجاء، وما هو غنى مجد ميراثه في القديسين،"]]}, {"l": "Eph 3:8", "n": "", "vs": [[8, "فلي، أنا الأصغر من أصغر القديسين جميعا، وهبت هذه النعمة: أن أذيع بين الأمم بشارة غنى المسيح الذي لا يحد،"]]}, {"l": "Eph 3:9", "n": "", "vs": [[9, "وأنير الجميع بمعرفة ما هو تدبير السر الذي أبقاه الله ، خالق كل شيء، مكتوما مدى الأجيال."]]}, {"l": "Eph 3:18", "n": "", "vs": [[18, "تصيرون قادرين تماما أن تدركوا، مع القديسين جميعا، ما هو العرض والطول والعلو والعمق،"]]}, {"l": "Eph 3:19", "n": "", "vs": [[19, "وتعرفوا محبة المسيح التي تفوق المعرفة، فتمتلئوا حتى تبلغوا ملء الله كله."]]}, {"l": "Col 2:2", "n": "", "vs": [[2, "بغرض أن تتشجع قلوبهم وتكون كلها متحدة في المحبة، لبلوغ الإدراك التام بكل غناه، لمعرفة سر الله، أي المسيح،"]]}, {"l": "Col 2:3", "n": "", "vs": [[3, "المخزونة فيه كنوز الحكمة والمعرفة كلها."]]}, {"l": "1Pe 2:7", "n": "", "vs": [[7, "فإن هذا الحجر هو ثمين في نظركم، أنتم المؤمنين به. أما بالنسبة إلى الذين لا يؤمنون، «فالحجر الذي رفضه البناؤون صار هو الحجر الأساسي رأس زاوية البيت»،"]]}, {"l": "2Pe 1:3", "n": "", "vs": [[3, "إن الله، بقدرته الإلهية، قد زودنا بكل ما نحتاج إليه في الحيا ة الروحية المتصفة بالتقوى. ذلك أنه عرفنا بالمسيح الذي دعانا إلى مجده وفضيلته،"]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}, {"l": "1Jo 5:20", "n": "", "vs": [[20, "وإننا نعلم أن ابن الله قد جاء إلى الأرض وأنار أذهاننا لنعرف الإله الحق. ونحن الآن نحيا فيه، لأننا في ابنه يسوع المسيح. هذا هو الإله الحق، والحياة الأبدية."]]}], "kwAr": "امتياز معرفة المسيح", "noteAr": ""}, {"kw": "my", "raw": "Luk_1:43, Luk_20:42-44; Joh_20:13, Joh_20:28", "note": "", "refs": [{"l": "Luk 1:43", "n": "", "vs": [[43, "فمن أين لي هذا: أن تأتي إلي أم ربي؟"]]}, {"l": "Luk 20:42-44", "n": "", "vs": [[42, "فيما يقول داود نفسه في كتاب المزامير: قال الرب لربي: اجلس عن يميني"], [43, "حتى أضع أعداءك موطئا لقدميك؟"], [44, "إذن، داود يدعوه ربا، فكيف يكون ابنه؟»"]]}, {"l": "Joh 20:13", "n": "", "vs": [[13, "فسألاها: «ياامرأة، لماذا تبكين؟» أجابت: «أخذوا سيدي، ولا أدري أين وضعوه»."]]}, {"l": "Joh 20:28", "n": "", "vs": [[28, "فهتف توما: «ربي وإلهي»."]]}], "kwAr": "ربي", "noteAr": ""}, {"kw": "for whom", "raw": "Phi_3:7; Mat_19:27-29; 1Co_4:9-13; 2Co_11:23-27; 2Ti_4:6", "note": "", "refs": [{"l": "Phi 3:7", "n": "", "vs": [[7, "ولكن، ما كان لي من ربح، فقد اعتبرته خسارة، من أجل المسيح."]]}, {"l": "Mat 19:27-29", "n": "", "vs": [[27, "عندئذ قال بطرس: «ها نحن قد تركنا كل شيء وتبعناك، فماذا يكون نصيبنا؟»"], [28, "فأجابهم يسوع: «الحق أقول لكم: إنه عندما يجلس ابن الإنسان على عرش مجده في زمن التجديد، تجلسون أنتم الذين تبعتموني على اثني عشر عرشا لتدينوا أسباط إسرائيل الاث أولادكم، وأنثر روث الحيوانات التي تقدمونها لي على وجوهكم، ثم يطرحونكم معها خارجا فوق القمامة الدنسة."]]}], "kwAr": "نفاية", "noteAr": ""}, {"kw": "win", "raw": "Mat_13:44-46; Heb_3:14; 1Jo_1:3", "note": "", "refs": [{"l": "Mat 13:44-46", "n": "", "vs": [[44, "يشبه ملكوت السماوات بكنز مطمور في حقل، وجده رجل، فعاد وطمره. ومن فرحه، ذهب وباع كل ما كان يملك واشترى ذلك الحقل."], [45, "ويشبه ملكوت السماوات أيضا بتاجر كان يبحث عن اللآليء الجميلة."], [46, "فما إن وجد لؤلؤة ثمينة جدا، حتى ذهب وباع كل ما يملك، واشتراها."]]}, {"l": "Heb 3:14", "n": "", "vs": [[14, "فإن تمسكنا دائما بالثقة التي انطلقنا بها في البداية، وأبقيناها ثابتة إلى النهاية، نكون مشاركين للمسيح."]]}, {"l": "1Jo 1:3", "n": "", "vs": [[3, "فنحن، إذن، نخبركم بما رأيناه وسمعناه، لكي تكونوا شركاءنا. كما أن شركتنا هي مع الآب ومع ابنه يسوع المسيح."]]}], "kwAr": "لكي أربح المسيح", "noteAr": ""}], "arS": [["بل إني ", []], ["أعتبر", ["G2233"]], [" ", []], ["كل شيء", ["G3956"]], [" ", []], ["خسارة", ["G2209"]], ["، من أجل ", []], ["امتياز", ["G5242"]], [" ", []], ["معرفة", ["G1108"]], [" ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["ربي", ["G2962", "G3450"]], ["؛ فمن أجله ", []], ["تحملت خسارة", ["G2210"]], [" ", []], ["كل شيء", ["G3956"]], ["، ", []], ["وأعتبر", ["G2233"]], [" كل شيء ", []], ["نفاية", ["G4657"]], ["، لكي ", []], ["أربح", ["G2770"]], [" ", []], ["المسيح", ["G5547"]]]}, {"c": 3, "v": 9, "text": "ويكون لي فيه مقام، إذ ليس لي بري الذاتي القائم على أساس الشريعة، بل البر الآتي من الإيمان بالمسيح، البر الذي من عند الله على أساس الإيمان.", "groups": [{"kw": "be", "raw": "Gen_7:23; Deu_19:3, Deu_19:4; Heb_6:18; 1Pe_3:19, 1Pe_3:20", "note": "", "refs": [{"l": "Gen 7:23", "n": "", "vs": [[23, "وباد من على سطح الأرض كل كائن حي سواء من الناس أم البهائم أم الزواحف أم الطيور، كلها أبيدت من الأرض، ولم يبق سوى نوح ومن معه في الفلك."]]}, {"l": "Deu 19:3", "n": "", "vs": [[3, "فعبدوا الطرق إليها، وقسموا الأرض التي يهبها الرب إلهكم لكم إلى ثلاث مناطق، لتكون ملجأ يلوذ بها كل من قتل نفسا عن غير عمد."]]}, {"l": "Deu 19:4", "n": "", "vs": [[4, "وهذا هو الحكم المتعلق بالقاتل الذي يلجأ إلى هناك فيحيا: من ضرب صاحبه عن غير قصد، وهو لا يكن له البغضاء سابقا،"]]}, {"l": "Heb 6:18", "n": "", "vs": [[18, "فاستنادا إلى وعد الله وقسمه، وهما أمران ثابتان لا يتغيران ويستحيل أن يكذب الله فيهما، نحصل على تشجيع قوي، بعدما التجأنا إلى التمسك بالرجاء الموضوع أمامنا."]]}, {"l": "1Pe 3:19", "n": "", "vs": [[19, "بهذا الروح نفسه، ذهب قديما وبشر الناس الذين أصبحت أرواحهم الآن في السجن."]]}, {"l": "1Pe 3:20", "n": "", "vs": [[20, "وذلك بعدما رفضوا البشارة في أيام نوح، عندما كان الله يتأنى صابرا طوال المدة التي كان نوح يبني فيها السفينة، التي نجا بها عدد قليل من الناس عبر الماء، ثمانية أشخاص فقط!"]]}], "kwAr": "ويكون لي فيه مقام", "noteAr": ""}, {"kw": "in", "raw": "Rom_8:1, Rom_16:7; 1Co_1:30; 2Co_5:17", "note": "", "refs": [{"l": "Rom 8:1", "n": "", "vs": [[1, "فالآن إذا ليس على الذين في المسيح يسوع أية دينونة بعد."]]}, {"l": "Rom 16:7", "n": "", "vs": [[7, "سلموا على أندرونيكوس ويونياس، قريبي اللذين سجنا معي، وهما مشهوران بين الرسل، وقد كانا في المسيح قبلي."]]}, {"l": "1Co 1:30", "n": "", "vs": [[30, "وبفضل الله صار لكم مقام في المسيح يسوع الذي جعل لنا حكمة من الله وبرا وقداسة وفداء،"]]}, {"l": "2Co 5:17", "n": "", "vs": [[17, "فإنه إذا كان أحد في المسيح، فهو خليقة جديدة: إن الأشياء القديمة قد زالت، وها كل شيء قد صار جديدا."]]}], "kwAr": "فيه", "noteAr": ""}, {"kw": "not", "raw": "Phi_3:6; 1Ki_8:46; 2Ch_32:25, 2Ch_32:31; Job_9:28-31, Job_10:14, Job_10:15, Job_15:14-16, Job_42:5, Job_42:6; Psa_14:3, Psa_19:12, Psa_130:3, Psa_130:4, Psa_143:2; Ecc_7:20; Isa_6:5, Isa_53:6, Isa_64:5, Isa_64:6; Mat_9:13; Rom_9:31, Rom_9:32, Rom_10:1-3, Rom_10:5; 2Ti_1:9; Tit_3:5; Jam_3:2; 1Jo_1:8-10", "note": "", "refs": [{"l": "Phi 3:6", "n": "", "vs": [[6, "ومن جهة الحماسة، مضطهد للكنيسة؛ ومن جهة البر المطلوب في الشريعة، كنت بلا لوم."]]}, {"l": "1Ki 8:46", "n": "", "vs": [[46, "وإذا أخطأوا إليك، إذ ليس إنسان لا يأثم، وغضبت عليهم وأسلمتهم للعدو فسباهم آسروهم إلى ديار العدو، بعيدة أو قريبة."]]}, {"l": "2Ch 32:25", "n": "", "vs": [[25, "ولكن حزقيا لم يتجاوب مع ما أبداه الله نحوه من نعم، إذ امتلأ قلبه كبرياء، فغضب الرب عليه وعلى يهوذا وأورشليم."]]}, {"l": "2Ch 32:31", "n": "", "vs": [[31, "ولكن عندما وفد عليه مبعوثو ملوك بابل ليستعلموا منه عن معجزة شفائه، تركه الله ليختبر سرائر قلبه."]]}, {"l": "Job 9:28-31", "n": "", "vs": [[28, "فإني أظل أخشى أوجاعي، عالما أنك لن تبرئني."], [29, "أنا مستذنب، فلماذا أجاهد عبثا؟"], [30, "وحتى لو اغتسلت بالثلج ونظفت يدي بالإشنان،"], [31, "فإنك تطرحني في مستنقع نتن حتى تكرهني ثيابي"]]}, {"l": "Job 10:14", "n": "", "vs": [[14, "إن أخطأت فأنت تراقبني، ولا تبرئني من إثمي."]]}, {"l": "Job 10:15", "n": "", "vs": [[15, "إن أذنبت فويل لي. وإن كنت بارا لا أرفع رأسي، لأني ممتليء هوانا وناظر مذلتي،"]]}, {"l": "Job 15:14-16", "n": "", "vs": [[14, "من هو الإنسان حتى يزكو أو مولود المرأة حتى يتبرر؟"], [15, "فإن كان الله لا يأتمن قديسيه، والسماوات غير طاهرة لديه،"], [16, "فكم بالأحرى يكون الإنسان الشارب الإثم كالماء مكروها وفاسدا!"]]}, {"l": "Job 42:5", "n": "", "vs": [[5, "بسمع الأذن قد سمعت عنك والآن رأتك عيني،"]]}, {"l": "Job 42:6", "n": "", "vs": [[6, "لذلك ألوم نفسي وأتوب معفرا ذاتي بالتراب والرماد»."]]}, {"l": "Psa 14:3", "n": "", "vs": [[3, "فإذا الجميع قد ضلوا على السواء. كلهم فسدوا، وليس بينهم من يعمل الصلاح، ولا واحد."]]}, {"l": "Psa 19:12", "n": "", "vs": [[12, "من يتنبه إلى سهواته؟ من الخطايا الخفية خلصني،"]]}, {"l": "Psa 130:3", "n": "", "vs": [[3, "إن كنت يارب تترصد الآثام، فمن يستطيع الوقوف في محضرك؟"]]}, {"l": "Psa 130:4", "n": "", "vs": [[4, "ولأنك مصدر الغفران فإن جميع الناس يهابونك."]]}, {"l": "Psa 143:2", "n": "", "vs": [[2, "لا تحاكم عبدك، فلن يتبرر أمامك إنسان."]]}, {"l": "Ecc 7:20", "n": "", "vs": [[20, "ليس من صديق على وجه الأرض يصنع خيرا ولا يخطيء."]]}, {"l": "Isa 6:5", "n": "", "vs": [[5, "فقلت: «ويل لي لأني هلكت لأني إنسان نجس الشفتين، وأسكن وسط قوم دنسي الشفاه. فإن عيني قد أبصرتا الملك الرب القدير»."]]}, {"l": "Isa 53:6", "n": "", "vs": [[6, "كلنا كغنم شردنا ملنا كل واحد إلى سبيله، فأثقل الرب كاهله بإثم جميعنا."]]}, {"l": "Isa 64:5", "n": "", "vs": [[5, "أنت تلاقي من يفرح بعمل البر ومن يسلك دائما في طرقك. لكم سخطت علينا لأننا واظبنا على ارتكاب الآثام زمانا طويلا، فكيف لمثلنا أن يخلص؟"]]}, {"l": "Isa 64:6", "n": "", "vs": [[6, "كلنا أصبحنا كنجس، وأضحت جميع أعمال برنا كثوب قذر، فذبلنا كأوراق الشجر وعبثت بنا آثامنا كالريح."]]}, {"l": "Mat 9:13", "n": "", "vs": [[13, "اذهبوا وتعلموا معنى القول: إني أطلب رحمة لا ذبيحة. فإني ما جئت لأدعو أبرارا بل خاطئين! »"]]}, {"l": "Rom 9:31", "n": "", "vs": [[31, "أما إسرائيل، وقد كانوا يسعون وراء شريعة تهدف إلى البر، فقد فشلوا حتى في بلوغ الشريعة."]]}, {"l": "Rom 9:32", "n": "", "vs": [[32, "ولأي سبب؟ لأن سعيهم لم يكن على أساس الإيمان، بل كان وكأن الأمر قائم على الأعمال. فقد تعثروا بحجر العثرة،"]]}, {"l": "Rom 10:1-3", "n": "", "vs": [[1, "أيها الإخوة، إن رغبة قلبي وتضرعي إلى الله لأجلهم، هما أن يخلصوا."], [2, "فإني أشهد لهم أن عندهم غيرة لله، ولكنها ليست على أساس المعرفة."], [3, "فبما أنهم جهلوا بر الله وسعوا إلى إثبات برهم الذاتي، لم يخضعوا للبر الإلهي."]]}, {"l": "Rom 10:5", "n": "", "vs": [[5, "فقد كتب موسى عن البر الآتي من الشريعة: «إن الإنسان الذي يعمل بهذه الأمور، يحيا بها»."]]}, {"l": "2Ti 1:9", "n": "", "vs": [[9, "فهو قد خلصنا، ودعانا إليه دعوة مقدسة، لا على أساس أعمالنا، بل بموجب قصده ونعمته التي وهبت لنا في المسيح يسوع قبل أزمنة الأزل،"]]}, {"l": "Tit 3:5", "n": "", "vs": [[5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"]]}, {"l": "Jam 3:2", "n": "", "vs": [[2, "فإننا جميعا معرضون للوقوع في أخطاء كثيرة. ولكن من يلجم لسانه ولا يخطيء في كلامه هو ناضج يقدر أن يسيطر على طبيعته سيطرة تامة."]]}, {"l": "1Jo 1:8-10", "n": "", "vs": [[8, "إن كنا ندعي أن لا خطيئة لنا، نخدع أنفسنا، ولا يكون الحق في داخلنا."], [9, "ولكن، إن اعترفنا لله بخطايانا، فهو جدير بالثقة وعادل، يغفر لنا خطايانا ويطهرنا من كل إثم."], [10, "فإن كنا ندعي أننا لم نرتكب خطيئة، نجعل الله كاذبا، ولا تكون كلمته في داخلنا!"]]}], "kwAr": "ليس لي بري الذاتي", "noteAr": ""}, {"kw": "which is of the", "raw": "Deu_27:26; Luk_10:25-29; Rom_3:19, Rom_3:20, Rom_4:13-15, Rom_7:5-13, Rom_8:3, Rom_10:4, Rom_10:5; Gal_3:10-13, Gal_3:21, Gal_3:22; Jam_2:9-11; 1Jo_3:4", "note": "", "refs": [{"l": "Deu 27:26", "n": "", "vs": [[26, "ملعون كل من لا يطيع كلمات هذه الشريعة ولا يعمل بها. فيقول جميع الشعب: آمين."]]}, {"l": "Luk 10:25-29", "n": "", "vs": [[25, "وتصدى له أحد علماء الشريعة ليجربه، فقال: «يامعلم، ماذا أعمل لأرث الحياة الأبدية؟»"], [26, "فقال له: «ماذا كتب في الشريعة؟ وكيف تقرأها؟»"], [27, "فأجاب: «أحب الرب إلهك بكل قلبك وكل نفسك وكل قدرتك وكل فكرك، وأحب قريبك كنفسك»."], [28, "فقال له: «جوابك صحيح. فإن عملت بهذا، تحيا!»"], [29, "لكنه إذ كان راغبا في تبرير نفسه، سأل يسوع: «ومن هو قريبي؟»"]]}, {"l": "Rom 3:19", "n": "", "vs": [[19, "ونحن نعلم أن كل ما تقوله الشريعة إنما تخاطب به الذين هم تحت الشريعة، لكي يسد كل فم ويقع العالم كله تحت دينونة من الله."]]}, {"l": "Rom 3:20", "n": "", "vs": [[20, "فإن أحدا من البشر لا يتبرر أمامه بالأعمال المطلوبة في الشريعة. إذ إن الشريعة هي لإظهار الخطيئة."]]}, {"l": "Rom 4:13-15", "n": "", "vs": [[13, "فليس على أساس الشريعة كان الوعد لإبراهيم، أو لنسله، بأن يكون وارثا للعالم، وإنما على أساس البر الذي بالإيمان."], [14, "فلو كان أهل الشريعة هم أصحاب الإرث، لصار الإيمان بلا فاعلية ونقض الوعد."], [15, "لأن الشريعة إنما تنتج الغضب؛ فلولا الشريعة لما ظهرت المخالفة."]]}, {"l": "Rom 7:5-13", "n": "", "vs": [[5, "فعندما كنا في الجسد، كانت أهواء الخطايا المعلنة في الشريعة عاملة في أعضائنا لكي نثمر للموت."], [6, "أما الآن، فنحن قد تحررنا من الشريعة، إذ متنا بالنِّسبة لما كان يقيدنا، حتى نكون عبيدا يخدمون وفقا للنظام الروحي الجديد، لا للنظام الحرفي العتيق."], [7, "إذن، ماذا نقول؟ هل الشريعة خطيئة؟ حاشا! ولكني ما عرفت الخطيئة إلا بالشريعة. فما كنت لأعرف الشهوة لولا قول الشريعة: «لا تشته!»"], [8, "ولكن الخطيئة استغلت هذه الوصية فأثارت في كل شهوة. فإن الخطيئة، لولا الشريعة، ميتة."], [9, "أما أنا فكنت من قبل عائشا بمعزل عن الشريعة؛ ولكن لما جاءت الشريعة عاشت الخطيئة،"], [10, "فمت أنا. والوصية الهادفة إلى الحياة، صارت لي مؤدية إلى الموت."], [11, "فإن الخطيئة، إذ استغلت الوصية، خدعتني وقتلتني بها."], [12, "فالشريعة إذن مقدسة، والوصية مقدسة وعادلة وصالحة."], [13, "فهل صار ما هو صالح موتا لي؟ حاشا! ولكن الخطيئة، لكي تظهر أنها خطيئة، أنتجت لي الموت بما هو صالح، حتى تصير الخطيئة خاطئة جدا بسبب الوصية."]]}, {"l": "Rom 8:3", "n": "", "vs": [[3, "فإن ما عجزت الشريعة عنه، لكون الجسد قد جعلها قاصرة عن تحقيقه، أتمه الله إذ أرسل ابنه، متخذا ما يشبه جسد الخطيئة ومكفرا عن الخطيئة فدان الخطيئة في الجسد"]]}, {"l": "Rom 10:4", "n": "", "vs": [[4, "فإن غاية الشريعة هي المسيح لتبرير كل من يؤمن."]]}, {"l": "Rom 10:5", "n": "", "vs": [[5, "فقد كتب موسى عن البر الآتي من الشريعة: «إن الإنسان الذي يعمل بهذه الأمور، يحيا بها»."]]}, {"l": "Gal 3:10-13", "n": "", "vs": [[10, "أما جميع الذين على مبدأ أعمال الشريعة، فإنهم تحت اللعنة، لأنه قد كتب: «ملعون كل من لا يثبت على العمل بكل ما هو مكتوب في كتاب الشريعة!»"], [11, "أما أن أحدا لا يتبر ر عند الله بفضل الشريعة، فذلك واضح، لأن «من تبرر بالإيمان فبالإيمان يحيا»."], [12, "ولكن الشريعة لا تراعي مبدأ الإيمان، بل «من عمل بهذه الوصايا، يحيا بها»."], [13, "إن المسيح حررنا بالفداء من لعنة الشريعة، إذ صار لعنة عوضا عنا، لأنه قد كتب: «ملعون كل من علق على خشبة»،"]]}, {"l": "Gal 3:21", "n": "", "vs": [[21, "فهل تناقض الشريعة وعود الله؟ حاشا! فلو أعطيت شريعة قادرة أن تحيي، لكان البر بالحقيقة على مبدأ الشريعة."]]}, {"l": "Gal 3:22", "n": "", "vs": [[22, "ولكن الكتاب حبس الجميع تحت الخطيئة، حتى إن الوعد، على أساس الإيمان بيسوع المسيح، يوهب للذين يؤمنون."]]}, {"l": "Jam 2:9-11", "n": "", "vs": [[9, "ولكن عندما تعاملون الناس بالانحياز والتمييز، ترتكبون خطيئة وتحكم عليكم الشريعة باعتباركم مخالفين لها."], [10, "فأنتم تعرفون أن من يطيع جميع الوصايا الواردة في شريعة موسى، ويخالف واحدة منها فقط، يصير مذنبا، تماما كالذي يخالف الوصايا كلها."], [11, "فإن الله ، مثلا، قال: «لا تزن» كما قال: «لا تقتل!» فإن لم تزن، ولكن قتلت، فقد خرقت الشريعة."]]}, {"l": "1Jo 3:4", "n": "", "vs": [[4, "أما الذي يمارس الخطيئة، فهو يخالف ناموس الله: لأن الخطيئة هي مخالفة الناموس."]]}], "kwAr": "القائم على أساس الشريعة", "noteAr": ""}, {"kw": "the righteousness", "raw": "Psa_71:15, Psa_71:16; Isa_45:24, Isa_45:25, Isa_46:13, Isa_53:11; Jer_23:6, Jer_33:16; Dan_9:24; Joh_16:8-11; Rom_1:17, Rom_3:21, Rom_3:22, Rom_4:5, Rom_4:6, Rom_4:13, Rom_5:21, Rom_9:30, Rom_10:3, Rom_10:6, Rom_10:10; 1Co_1:30; 2Co_5:21; Gal_2:16, Gal_3:11; 2Pe_1:1", "note": "", "refs": [{"l": "Psa 71:15", "n": "", "vs": [[15, "أخبر ببرك وخلاصك طول النهار، وإن كانا يفوقان إدراكي."]]}, {"l": "Psa 71:16", "n": "", "vs": [[16, "أجيء (مؤيدا) بقوة السيد الرب، لأذكر برك وحدك."]]}, {"l": "Isa 45:24", "n": "", "vs": [[24, "ويقولون عني: إنما بالرب وحده البر والقوة، وكل من يغتاظ منه يأتي إلى الرب ويخزى."]]}, {"l": "Isa 45:25", "n": "", "vs": [[25, "أما ذرية إسرائيل فبالرب يتبررون وبه يزهون."]]}, {"l": "Isa 46:13", "n": "", "vs": [[13, "لقد جعلت أوان بري قريبا. لم يعد بعيدا، وخلاصي لا يبطيء. سأجعل خلاصا في صهيون، وفي إسرائيل مجدي."]]}, {"l": "Isa 53:11", "n": "", "vs": [[11, "ويرى ثمار تعب نفسه ويشبع، وعبدي البار يبرر بمعرفته كثيرين ويحمل آثامهم."]]}, {"l": "Jer 23:6", "n": "", "vs": [[6, "في عهده يتم خلاص شعب يهوذا، ويسكن شعب إسرائيل آمنا. أما الاسم الذي سيدعى به فهو: الرب برنا."]]}, {"l": "Jer 33:16", "n": "", "vs": [[16, "في تلك الأيام يخلص يهوذا، وتسكن أورشليم آمنة، وهذا هو الاسم الذي تدعى به: الرب برنا."]]}, {"l": "Dan 9:24", "n": "", "vs": [[24, "قد صدر القضاء أن يمضي سبعون أسبوعا على شعبك وعلى مدينة قدسك، للانتهاء من المعصية والقضاء على الخطيئة، وللتكفير عن الإثم، ولإشاعة البر الأبدي وختم الرؤيا والنبوءة ولمسح قدوس القدوسين."]]}, {"l": "Joh 16:8-11", "n": "", "vs": [[8, "وعندما يجيء يبكت العالم على الخطيئة وعلى البر وعلى الدينونة:"], [9, "أما على الخطيئة، فلأنهم لا يؤمنون بي،"], [10, "وأما على البر، فلأني عائد إلى الآب فلا ترونني بعد؛"], [11, "وأما على الدينونة، فلأن سيد هذا العالم قد صدر عليه حكم الدينونة."]]}, {"l": "Rom 1:17", "n": "", "vs": [[17, "ففيه قد أعلن البر الذي يمنحه الله على أساس الإيمان والذي يؤدي إلى الإيمان، على حد ما قد كتب: «أما من تبرر بالإيمان، فبالإيمان يحيا»."]]}, {"l": "Rom 3:21", "n": "", "vs": [[21, "أما الآن، فقد أعلن البر الذي يمنحه الله ، مستقلا عن الشريعة، ومشهودا له من الشريعة والأنبياء،"]]}, {"l": "Rom 3:22", "n": "", "vs": [[22, "ذلك البر الذي يمنحه الله على أساس الإيمان بيسوع المسيح لجميع الذين يؤمنون. إذ لا فرق،"]]}, {"l": "Rom 4:5", "n": "", "vs": [[5, "وإنما يؤمن بمن يبرر الأثيم، فإن إيمانه يحسب له برا."]]}, {"l": "Rom 4:6", "n": "", "vs": [[6, "كما يهنيء داود أيضا الإنسان الذي يحسب له الله برا بمعزل عن الأعمال، إذ يقول:"]]}, {"l": "Rom 4:13", "n": "", "vs": [[13, "فليس على أساس الشريعة كان الوعد لإبراهيم، أو لنسله، بأن يكون وارثا للعالم، وإنما على أساس البر الذي بالإيمان."]]}, {"l": "Rom 5:21", "n": "", "vs": [[21, "حتى إنه كما ملكت الخطيئة بالموت، فكذلك أيضا تملك النعمة على أساس البر مؤدية إلى الحياة الأبدية بيسوع المسيح ربنا."]]}, {"l": "Rom 9:30", "n": "", "vs": [[30, "فما هي خلاصة القول؟ إن الأمم الذين لم يكونوا يسعون وراء البر، قد بلغوا البر، ولكنه البر القائم على أساس الإيمان."]]}, {"l": "Rom 10:3", "n": "", "vs": [[3, "فبما أنهم جهلوا بر الله وسعوا إلى إثبات برهم الذاتي، لم يخضعوا للبر الإلهي."]]}, {"l": "Rom 10:6", "n": "", "vs": [[6, "غير أن البر الآتي من الإيمان يقول هذا: «لا تقل في قلبك: من يصعد إلى السماوات؟» أي لينزل المسيح،"]]}, {"l": "Rom 10:10", "n": "", "vs": [[10, "فإن الإيمان في القلب يؤدي إلى البر، والاعتراف بالفم يؤيد الخلاص،"]]}, {"l": "1Co 1:30", "n": "", "vs": [[30, "وبفضل الله صار لكم مقام في المسيح يسوع الذي جعل لنا حكمة من الله وبرا وقداسة وفداء،"]]}, {"l": "2Co 5:21", "n": "", "vs": [[21, "فإن الذي لم يعرف خطيئة، جعله الله خطيئة لأجلنا، لنصير نحن بر الله فيه."]]}, {"l": "Gal 2:16", "n": "", "vs": [[16, "ولكننا، إذ علمنا أن الإنسان لا يتبرر على أساس الأعمال المطلوبة في الشريعة بل فقط بالإيمان بيسوع المسيح، آمنا نحن أيضا بالمسيح يسوع، لنتبرر على أساس الإيمان به، لا على أساس أعمال الشريعة، لأنه على أعمال الشريعة لا يبرر أي إنسان."]]}, {"l": "Gal 3:11", "n": "", "vs": [[11, "أما أن أحدا لا يتبر ر عند الله بفضل الشريعة، فذلك واضح، لأن «من تبرر بالإيمان فبالإيمان يحيا»."]]}, {"l": "2Pe 1:1", "n": "", "vs": [[1, "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"]]}], "kwAr": "البر الذي من عند الله", "noteAr": ""}], "arS": [["ويكون لي فيه مقام، إذ ليس لي ", []], ["بري", ["G1343", "G1699"]], [" الذاتي القائم على أساس ", []], ["الشريعة", ["G3551"]], ["، بل ", []], ["البر", ["G1343"]], [" الآتي من ", []], ["الإيمان", ["G4102"]], [" ", []], ["بالمسيح", ["G5547"]], ["، ", []], ["البر", ["G1343"]], [" الذي من عند ", []], ["الله", ["G2316"]], [" على أساس ", []], ["الإيمان", ["G4102"]], [".", []]]}, {"c": 3, "v": 10, "text": "وغايتي أن أعرف المسيح وقوة قيامته والشركة في آلامه؛ والتشبه به في موته،", "groups": [{"kw": "I", "raw": "Phi_3:8; 1Jo_2:3, 1Jo_2:5", "note": "", "refs": [{"l": "Phi 3:8", "n": "", "vs": [[8, "بل إني أعتبر كل شيء خسارة، من أجل امتياز معرفة المسيح يسوع ربي؛ فمن أجله تحملت خسارة كل شيء، وأعتبر كل شيء نفاية، لكي أربح المسيح"]]}, {"l": "1Jo 2:3", "n": "", "vs": [[3, "وما يؤكد لنا أننا قد عرفنا المسيح حقا هو أن نعمل بوصاياه."]]}, {"l": "1Jo 2:5", "n": "", "vs": [[5, "أما الذي يعمل بحسب كلمة المسيح، فإن محبة الله تكون قد اكتملت في داخله. بهذا نعرف أننا ننتمي إلى المسيحِ."]]}], "kwAr": "أن أعرف المسيح", "noteAr": ""}, {"kw": "and the power", "raw": "Joh_5:21-29, Joh_10:18, Joh_11:25, Joh_11:26; Act_2:31-38; Rom_6:4-11, Rom_8:10,Rom_8:11; 1Co_15:21-23; 2Co_1:10, 2Co_4:10-13, 2Co_13:4; Eph_1:19-21; Col_2:13, Col_3:1; 1Th_4:14, 1Th_4:15; 1Pe_1:3, 1Pe_4:1, 1Pe_4:2; Rev_1:18", "note": "", "refs": [{"l": "Joh 5:21-29", "n": "", "vs": [[21, "فكما يقيم الآب الموتى ويحييهم، كذلك يحيي الابن من يشاء."], [22, "والآب لا يحاكم أحدا، بل أعطى الابن سلطة القضاء كلها،"], [23, "ليكرم الجميع الابن كما يكرمون الآب. ومن لا يكرم الابن لا يكرم الآب الذي أرسله."], [24, "الحق الحق أقول لكم إن من يسمع كلامي ويؤمن بالذي أرسلني تكون له الحياة الأبدية، ولا يحاكم في اليوم الأخير، لأنه قد انتقل من الموت إلى الحياة."], [25, "الحق الحق أقول لكم: إن الساعة التي يسمع فيها الأموات صوت ابن الله ستأتي بل هي الآن والذين يسمعونه يحيون."], [26, "لأنه كما أن للآب حياة في ذاته، فقد أعطى الابن أيضا أن تكون له حياة في ذاته،"], [27, "وأعطاه سلطة أن يدين، لأنه ابن الإنسان."], [28, "لا تتعجبوا من هذا: فسوف تأتي ساعة يسمع فيها جميع من في القبور صوته،"], [29, "فيخرجون منها: فالذين عملوا الصالحات يخرجون في القيامة المؤدية إلى الحياة، وأما الذين عملوا السيئات ففي القيامة المؤدية إلى الدينونة."]]}, {"l": "Joh 10:18", "n": "", "vs": [[18, "لا أحد ينتزع حياتي مني، بل أنا أبذلها باختياري. فلي السلطة أن أبذلها ولي السلطة أن أستردها. هذه الوصية تلقيتها من أبي»."]]}, {"l": "Joh 11:25", "n": "", "vs": [[25, "فرد يسوع: «أنا هو القيامة والحياة. من آمن بي، وإن مات فسيحيا."]]}, {"l": "Joh 11:26", "n": "", "vs": [[26, "ومن كان حيا وآمن بي فلن يموت إلى الأبد. أتؤمنين بهذا؟»"]]}, {"l": "Act 2:31-38", "n": "", "vs": [[31, "فقد تكلم عن قيامة المسيح كما رآها مسبقا، فقال إن نفسه لم تترك في هوة الأموات، ولم ينل من جسده الفساد."], [32, "فيسوع هذا أقامه الله من الموت، ونحن جميعا شهود لذلك."], [33, "وإذ رفع إلى يمين الله، وأخذ من الآب الروح القدس الموعود به، أفاضه علينا. وما ترونه الآن وتسمعونه هو نتيجة لذلك."], [34, "فإن داود لم يرتفع بجسده إلى السماء. ثم إنه هو نفسه يقول: قال الرب لربي: اجلس عن يميني"], [35, "حتى أجعل أعداءك موطئا لقدميك."], [36, "فليعلم يقينا بنو إسر ائيل جميعا، أن الله قد جعل يسوع، هذا الذي صلبتموه أنتم، ربا ومسيحا!»"], [37, "فلما سمع الحاضرون هذا الكلام، وخزتهم قلوبهم، فسألوا بطرس وباقي الرسل: «ماذا نعمل أيها الإخوة؟»"], [38, "أجابهم بطرس: «توبوا، وليتعمد كل واحد منكم باسم يسوع المسيح، فيغفر الله خطاياكم وتنالوا هبة الروح القدس،"]]}, {"l": "Rom 6:4-11", "n": "", "vs": [[4, "وبسبب ذلك دفنا معه بالمعمودية للموت، حتى كما أقيم المسيح من الأموات بمجد الآب، كذلك نسلك نحن أيضا في حياة جديدة."], [5, "فما دمنا قد اتحدنا به في ما يشبه موته، فإننا سنتحد به أيضا في قيامته."], [6, "فنحن نعلم هذا: أن الإنسان العتيق فينا قد صلب معه لكي يبطل جسد الخطيئة فلا نبقى عبيدا للخطيئة فيما بعد."], [7, "فإن من مات، قد تحرر من الخطيئة."], [8, "ومادمنا متنا مع المسيح، فنحن نؤمن أننا سنحيا أيضا معه،"], [9, "لكوننا على يقين بأن المسيح، وقد أقيم من بين الأموات، لا يموت مرة ثانية، إذ ليس للموت سيادة عليه بعد."], [10, "لأنه بموته، قد مات لأجل الخطيئة مرة واحدة؛ وبحياته، يحيا لله."], [11, "فكذلك أنتم أيضا، احسبوا أنفسكم أمواتا بالنسبة للخطيئة وأحياء لله في المسيح يسوع."]]}, {"l": "Rom 8:10", "n": "", "vs": [[10, "وإذا كان المسيح فيكم، فمع أن الجسد مائت بسبب الخطيئة، فإن الروح حياة لكم بسبب البر."]]}, {"l": "Rom 8:11", "n": "", "vs": [[11, "وإذا كان روح الذي أقام يسوع من بين الأموات يسكن فيكم، فإن الذي أقام المسيح من بين الأموات سوف يحيي أيضا أجسادكم الفانية بسبب روحه الذي يسكن فيكم."]]}, {"l": "1Co 15:21-23", "n": "", "vs": [[21, "فبما أن الموت كان بإنسان، فإن قيامة الأموات أيضا تكون بإنسان."], [22, "فإنه، كما يموت الجميع في آدم، فكذلك سيحيى الجميع في المسيح،"], [23, "على أن لكل واحد رتبته: فأولا المسيح بصفته البكر؛ وبعده خاصته لدى رجوعه،"]]}, {"l": "2Co 1:10", "n": "", "vs": [[10, "وقد أنقذنا من هذا الموت الشنيع، ومازال ينقذنا حتى الآن، ولنا ملء الثقة بأنه حقا سينقذنا فيما بعد؛"]]}, {"l": "2Co 4:10-13", "n": "", "vs": [[10, "وحيثما ذهبنا، نحمل موت يسوع دائما في أجسادنا لتظهر فيها أيضا حياة يسوع."], [11, "فمع أننا مازلنا أحياء، فإننا نسلم دائما إلى الموت من أجل يسوع، لتظهر في أجسادنا الفانية حياة يسوع أيضا."], [12, "وهكذا، فإن الموت فعال فينا؛ والحياة فعالة فيكم."], [13, "وبما أن لنا روح الإيمان عينه، هذا الذي كتب بخصوصه: «آمنت، لذلك تكلمت»، فنحن أيضا نؤمن، ولذلك نتكلم،"]]}, {"l": "2Co 13:4", "n": "", "vs": [[4, "فمع أنه قد صلب في ضعف، فهو الآن حي بقدرة الله. ونحن أيضا ضعفاء فيه، ولكننا، بتصرفنا معكم، سنكون أحياء معه بقدرة الله."]]}, {"l": "Eph 1:19-21", "n": "", "vs": [[19, "وما هي عظمة قدرته الفائقة المعلنة لنا نحن المؤمنين، بحسب عمل اقتدار قوته"], [20, "الذي عمله في المسيح، بإقامته له من بين الأموات. وقد أجلسه عن يمينه في الأماكن السماوية،"], [21, "أرفع جدا من كل رئاسة وسلطة وقوة وسيا دة، ومن كل اسم يسمى، لا في هذا العالم وحسب، بل في ذلك الآتي أيضا."]]}, {"l": "Col 2:13", "n": "", "vs": [[13, "فأنتم، إذ كنتم أمواتا في الخطايا وعدم ختانكم الجسدي، أحياكم جميعا معه؛ مسامحا لنا جميعا بالخطايا كلها."]]}, {"l": "Col 3:1", "n": "", "vs": [[1, "فبما أنكم قد قمتم مع المسيح، فاسعوا إلى الأمور التي في العلى، حيث المسيح جالس عن يمين الله."]]}, {"l": "1Th 4:14", "n": "", "vs": [[14, "فمادمنا نؤمن أن يسوع مات ثم قام، فمعه كذلك سيحضر الله أيضا الراقدين بيسوع."]]}, {"l": "1Th 4:15", "n": "", "vs": [[15, "فهذا نقوله لكم بكلمة من عند الرب: إننا نحن الباقين أحياء إلى حين عودة الرب، لن نسبق الراقدين."]]}, {"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}, {"l": "1Pe 4:1", "n": "", "vs": [[1, "فبما أن المسيح قد تحمل الآلام الجسمية لأجلكم، سلحوا أنفسكم بالاستعداد دائما لتحمل الآلام. فإن من يتحمل الآلام الجسمية، يكون قد قاطع الخطيئة."]]}, {"l": "1Pe 4:2", "n": "", "vs": [[2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."]]}, {"l": "Rev 1:18", "n": "", "vs": [[18, "أنا الحي. كنت ميتا، ولكن ها أنا حي إلى أبد الآبدين. ولي مفاتيح الموت والهاوية."]]}], "kwAr": "وقوة قيامته", "noteAr": ""}, {"kw": "and the fellowship", "raw": "Mat_20:23; Rom_6:3-5, Rom_8:17, Rom_8:29; 2Co_1:5; Gal_2:20; Col_1:24; 2Ti_2:11, 2Ti_2:12; 1Pe_4:13, 1Pe_4:14", "note": "", "refs": [{"l": "Mat 20:23", "n": "", "vs": [[23, "فقال لهما: «كأسي سوف تشربان. أما الجلوس عن يميني وعن يساري، فليس لي أن أمنحه إلا للذين أعده أبي لهم! »"]]}, {"l": "Rom 6:3-5", "n": "", "vs": [[3, "أم يخفى عليكم أننا جميعا، نحن الذين تعمدنا اتحادا بالمسيح يسوع، قد تعمدنا اتحادا بموته؟"], [4, "وبسبب ذلك دفنا معه بالمعمودية للموت، حتى كما أقيم المسيح من الأموات بمجد الآب، كذلك نسلك نحن أيضا في حياة جديدة."], [5, "فما دمنا قد اتحدنا به في ما يشبه موته، فإننا سنتحد به أيضا في قيامته."]]}, {"l": "Rom 8:17", "n": "", "vs": [[17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}, {"l": "Rom 8:29", "n": "", "vs": [[29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."]]}, {"l": "2Co 1:5", "n": "", "vs": [[5, "فكما فاضت علينا آلام المسيح، يفيض علينا أيضا التشجيع بالمسيح."]]}, {"l": "Gal 2:20", "n": "", "vs": [[20, "مع المسيح صلبت، وفيما بعد لا أحيا أنا بل المسيح يحيا في. أما الحياة التي أحياها الآن في الجسد، فإنما أحياها بالإيمان في ابن الله، الذي أحبني وبذل نفسه عني."]]}, {"l": "Col 1:24", "n": "", "vs": [[24, "والآن أنا أفرح في الآلام التي أقاسيها لأجلكم، وأتمم في جسدي ما نقص من ضيقات المسيح لأجل جسده الذي هو الكنيسة،"]]}, {"l": "2Ti 2:11", "n": "", "vs": [[11, "وما أصدق القول: «إن كنا قد متنا معه، فسوف نحيا أيضا معه؛"]]}, {"l": "2Ti 2:12", "n": "", "vs": [[12, "إن تحملنا الآلام، فسوف نملك أيضا معه؛ إن أنكرناه، فسوف ينكرنا أيضا؛"]]}, {"l": "1Pe 4:13", "n": "", "vs": [[13, "وإنما افرحوا: لأنكم كما تشاركون المسيح في الآلام الآن، لابد أن تفرحوا بمشاركته في الابتهاج عند ظهور مجده."]]}, {"l": "1Pe 4:14", "n": "", "vs": [[14, "فإذا لحقتكم الإهانة لأنكم تحملون اسم المسيح، فطوبى لكم! لأن روح المجد، أي روح الله، يستقر عليكم."]]}], "kwAr": "والشركة في آلامه", "noteAr": ""}], "arS": [["وغايتي أن ", []], ["أعرف", ["G1097"]], [" المسيح ", []], ["وقوة", ["G1411"]], [" ", []], ["قيامته", ["G386"]], [" ", []], ["والشركة", ["G2842"]], [" في ", []], ["آلامه", ["G3804"]], ["؛ ", []], ["والتشبه به", ["G4833"]], [" في ", []], ["موته", ["G2288"]], ["،", []]]}, {"c": 3, "v": 11, "text": "على رجاء القيامة من بين الأموات!", "groups": [{"kw": "by", "raw": "Psa_49:7; Act_27:12; Rom_11:14; 1Co_9:22, 1Co_9:27; 2Co_11:3; 1Th_3:5; 2Th_2:3", "note": "", "refs": [{"l": "Psa 49:7", "n": "", "vs": [[7, "لا يقدر أحد أبدا أن يفتدي أخاه أو يقدم لله كفارة عنه."]]}, {"l": "Act 27:12", "n": "", "vs": [[12, "ولما لم تكن الميناء صالحة لقضاء فصل الشتاء، فقد قرر معظم البحارة أن يغادروها، آملين الوصول إلى ميناء فينكس لقضاء الشتاء فيها، وقد كانت هذه الميناء في كريت تواجه الجنوب والشمال الغربيين."]]}, {"l": "Rom 11:14", "n": "", "vs": [[14, "لعلي أثير غيرة بني جنسي فأنقذ بعضا منهم."]]}, {"l": "1Co 9:22", "n": "", "vs": [[22, "وصرت للضعفاء ضعيفا، حتى أكسب الضعفاء. صرت للجميع كل شيء، لأنقذ بعضا منهم مهما كلف الأمر."]]}, {"l": "1Co 9:27", "n": "", "vs": [[27, "بل أسدد اللكمات إلى جسدي وأسوقه أسيرا، مخافة أن يتبين أني غير مؤهل (للمجازاة) بعدما دعوت الآخرين إليها!"]]}, {"l": "2Co 11:3", "n": "", "vs": [[3, "غير أني أخشى أن تضلل عقولكم عن الإخلاص والطهارة تجاه المسيح مثلما أغوت الحية بمكرها حواء."]]}, {"l": "1Th 3:5", "n": "", "vs": [[5, "ولهذا أيضا، إذ صار الافتراق عنكم لا يحتمل، أرسلت أستخبر عن إيمانكم لئلا يكون المجرب قد جربكم فيذهب جهدنا سدى!"]]}, {"l": "2Th 2:3", "n": "", "vs": [[3, "لا تدعوا أحدا يخدعكم بأية وسيلة! فإن ذلك اليوم لا يأتي دون أن يسبقه انتشار العصيان وظهور الإنسان المتمرد، ابن الهلاك،"]]}], "kwAr": "على رجاء", "noteAr": ""}, {"kw": "attain", "raw": "Luk_14:14, Luk_20:35, Luk_20:36; Joh_11:24; Act_23:6, Act_26:7; Heb_11:35", "note": "", "refs": [{"l": "Luk 14:14", "n": "", "vs": [[14, "فتكون مباركا لأن هؤلاء لا يملكون ما يكافئونك به، فإنك تكافأ في قيامة الأبرار»."]]}, {"l": "Luk 20:35", "n": "", "vs": [[35, "أما الذين حسبوا أهلا للمشاركة في الزمان الآتي والقيامة من بين الأموات، فلا يزوجون ولا يزوجون."]]}, {"l": "Luk 20:36", "n": "", "vs": [[36, "إذ لا يمكن أن يموتوا أيضا بعد ذلك، لأنهم يكونون مثل الملائكة، وهم أبناء الله لكونهم أبناء القيامة."]]}, {"l": "Joh 11:24", "n": "", "vs": [[24, "قالت مرثا: «أعرف أنه سيقوم في القيامة، في اليوم الأخير!»"]]}, {"l": "Act 23:6", "n": "", "vs": [[6, "وإذ كان بولس يعلم أن بعض أعضاء المجلس من مذهب الصدوقيين، وبعضهم من مذهب الفريسيين، نادى في المجلس: «أيها الإخوة، أنا فريسي ابن فريسي، وإني أحاكم الآن لأنني أعتقد أن للموتى رجاء بالقيامة!»"]]}, {"l": "Act 26:7", "n": "", "vs": [[7, "ومازالت أسباط شعبنا الاثنا عشر تواظب على العبادة ليل نهار راجية تحقيقه. من أجل هذا الرجاء يتهمني اليهود، أيها الملك:"]]}, {"l": "Heb 11:35", "n": "", "vs": [[35, "وبالإيمان، استرجعت بعض النساء أمواتهن بعدما أعيدوا إلى الحياة. وبه، تحمل كثيرون العذاب والضرب، وماتوا رافضين النجاة لعلمهم أنهم سوف يقومون إلى حياة أفضل."]]}], "kwAr": "القيامة من بين الأموات", "noteAr": ""}], "arS": [["على رجاء ", []], ["القيامة", ["G1815"]], [" من بين ", []], ["الأموات", ["G3498"]], ["!", []]]}, {"c": 3, "v": 12, "text": "لست أدعي أني قد نلت الجائزة أو بلغت الكمال. ولكني ماأزال أسعى لاقتنائها، كما أن المسيح يسوع قد اقتناني.", "groups": [{"kw": "I had", "raw": "Phi_3:13, Phi_3:16; Psa_119:5, Psa_119:173-176; Rom_7:19-24; Gal_5:17; 1Ti_6:12; Jam_3:2", "note": "", "refs": [{"l": "Phi 3:13", "n": "", "vs": [[13, "أيها الإخوة، أنا لا أعتبر نفسي قد نلت الجائزة، ولكني أفعل أمرا واحدا: أنسى ما هو وراء وأتقدم إلى ما هو أمام،"]]}, {"l": "Phi 3:16", "n": "", "vs": [[16, "إنما، لنواصل السير من حيث قد وصلنا، في المنهج نفسه."]]}, {"l": "Psa 119:5", "n": "", "vs": [[5, "ليتك توجه طرقي لممارسة فرائضك."]]}, {"l": "Psa 119:173-176", "n": "", "vs": [[173, "لتغثني يدك لأني اخترت وصاياك."], [174, "اشتقت إلى خلاصك يارب؛ شريعتك هي مسرتي."], [175, "لتحي نفسي فتسبحك ولتكن أحكامك لي عونا."], [176, "تهت كخروف ضال. فابحث عن عبدك، فإني لم أنس وصاياك."]]}, {"l": "Rom 7:19-24", "n": "", "vs": [[19, "فأنا لا أعمل الصلاح الذي أريده؛ وإنما الشر الذي لا أريده فإياه أمارس."], [20, "ولكن، إن كان ما لا أريده أنا إياه أعمل، فليس بعد أنا من يفعل ذلك، بل الخطيئة التي تسكن في."], [21, "إذن، أجد نفسي، أنا الذي يريد أن يعمل ما هو صالح، خاضعا لهذا الناموس:"], [22, "أن لدي الشر. فإنني، وفقا للإنسان الباطن في، أبتهج بشريعة الله."], [23, "ولكنني أرى في أعضائي ناموسا آخر يحارب الشريعة التي يريدها عقلي، ويجعلني أسيرا لناموس الخطيئة الكائن في أعضائي."], [24, "فيا لي من إنسان تعيس ! من يحررني من جسد الموت هذا؟"]]}, {"l": "Gal 5:17", "n": "", "vs": [[17, "فإن الجسد يشتهي بعكس الروح، والروح بعكس الجسد؛ وهذان يقاوم أحدهما الآخر حتى إنكم لا تفعلون ما ترغبون فيه."]]}, {"l": "1Ti 6:12", "n": "", "vs": [[12, "أحسن الجهاد في معركة الإيمان الجميلة. تمسك بالحياة الأبدية، التي إليها قد دعيت، وقد اعترفت الاعتراف الحسن (بالإيمان) أمام شهود كثيرين."]]}, {"l": "Jam 3:2", "n": "", "vs": [[2, "فإننا جميعا معرضون للوقوع في أخطاء كثيرة. ولكن من يلجم لسانه ولا يخطيء في كلامه هو ناضج يقدر أن يسيطر على طبيعته سيطرة تامة."]]}],
