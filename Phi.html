 "kwAr": "لست أدعي أني قد نلت", "noteAr": ""}, {"kw": "already perfect", "raw": "Job_17:9; Psa_138:8; Pro_4:18; 1Co_13:10; 2Co_7:1, 2Co_13:9; Eph_4:12; Heb_12:23, Heb_13:21; 1Pe_5:10; 2Pe_1:5-8, 2Pe_3:18", "note": "", "refs": [{"l": "Job 17:9", "n": "", "vs": [[9, "أما الصديق فيتمسك بطريقه، ويزداد الطاهر اليدين قوة."]]}, {"l": "Psa 138:8", "n": "", "vs": [[8, "الرب ينجز مقاصده لي. رحمتك يارب إلى الأبد تدوم، فلا تتخل عني لأني صنع يديك."]]}, {"l": "Pro 4:18", "n": "", "vs": [[18, "أما سبيل الأبرار فكنور متلأليء يتزايد إشراقه إلى أن يكتمل النهار،"]]}, {"l": "1Co 13:10", "n": "", "vs": [[10, "ولكن، عندما يأتي ما هو كامل، يزال ما هو جزئي."]]}, {"l": "2Co 7:1", "n": "", "vs": [[1, "فإذ نلنا هذه الوعود، أيها الأحباء، لنطهر أنفسنا من كل ما يدنس الجسد والروح، ونكمل القداسة في مخافة الله."]]}, {"l": "2Co 13:9", "n": "", "vs": [[9, "وكم نفرح عندما نكون نحن ضعفاء وتكونون أنتم أقوياء؛ حتى إننا نصلي طالبين لكم الكمال!"]]}, {"l": "Eph 4:12", "n": "", "vs": [[12, "لتأهيل القديسين من جهة عمل الخدمة، لبنيان جسد المسيح،"]]}, {"l": "Heb 12:23", "n": "", "vs": [[23, "إلى كنيسة تجمع أبناء لله أبكارا، أسماؤهم مكتوبة في السماء. بل إلى الله نفسه، ديان الجميع، وإلى أرواح أناس بررهم الله وجعلهم كاملين."]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}, {"l": "2Pe 1:5-8", "n": "", "vs": [[5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"], [6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"], [7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."], [8, "فحين تكون هذه الصفات الطيبة في داخلكم، وتزداد بوفرة، تجعلكم مجتهدين ومثمرين في معرفتكم لربنا يسوع المسيح."]]}, {"l": "2Pe 3:18", "n": "", "vs": [[18, "ولكن، ازدادوا نموا في النعمة وفي معرفة ربنا ومخلصنا يسوع المسيح. له المجد، الآن وإلى اليوم الأبدي."]]}], "kwAr": "أو بلغت الكمال", "noteAr": ""}, {"kw": "I follow", "raw": "Phi_3:14; Psa_42:1, Psa_63:1-3, Psa_63:8, Psa_84:2, Psa_94:15; Isa_51:1; Hos_6:3; 1Th_5:15; 1Ti_5:10, 1Ti_6:11; Heb_12:14; 1Pe_3:11-13", "note": "", "refs": [{"l": "Phi 3:14", "n": "", "vs": [[14, "إذ أسعى إلى الهدف، لنوال تلك الجائزة التي يدعونا الله إليها دعوة عليا في المسيح يسوع."]]}, {"l": "Psa 42:1", "n": "", "vs": [[1, "مثلما تشتاق الغزلان إلى جداول المياه، هكذا تشتاق نفسي إليك ياالله ."]]}, {"l": "Psa 63:1-3", "n": "", "vs": [[1, "ياالله أنت إلهي وإياك أطلب باكرا. عطشت إليك نفسي ويشتاق إليك جسمي في أرض قاحلة يابسة لا ماء فيها."], [2, "حتى أعاين قدرتك ومجدك، مثلما رأيتك في موضعك المقدس."], [3, "لأن رحمتك خير من الحياة، لذلك تسبحك شفتاي."]]}, {"l": "Psa 63:8", "n": "", "vs": [[8, "تتعلق نفسي بك. يمينك تدعمني"]]}, {"l": "Psa 84:2", "n": "", "vs": [[2, "تتوق بل تحن نفسي إلى ديار الرب. قلبي وجسمي يرنمان بفرح للإله الحي."]]}, {"l": "Psa 94:15", "n": "", "vs": [[15, "لأن القضاء يصبح عدلا ويحبه جميع المستقيمي القلوب."]]}, {"l": "Isa 51:1", "n": "", "vs": [[1, "اسمعوا لي ياملتمسي البر، الساعين وراء الرب: تلفتوا إلى الصخر الذي منه نحتم، وإلى المحجر الذي منه اقتلعتم."]]}, {"l": "Hos 6:3", "n": "", "vs": [[3, "لنعرف، بل لنجد حتى نعرف الرب، فمجيئه يقين كالفجر، يقبل إلينا كإقبال المطر وكغيوث الربيع التي تروي الأرض»."]]}, {"l": "1Th 5:15", "n": "", "vs": [[15, "حذار أن يبادل أحدكم شر غيره بشر مثله بل اسعوا دائما إلى الخير في معاملتكم بعضكم لبعض وللآخرين جميعا."]]}, {"l": "1Ti 5:10", "n": "", "vs": [[10, "ويكون مشهودا لها بالأعمال الصالحة، كأن تكون قد ربت الأولاد، وأضافت الغرباء، وغسلت أقدام القديسين، وأسعفت المتضايقين، ومارست كل عمل صالح!"]]}, {"l": "1Ti 6:11", "n": "", "vs": [[11, "وأما أنت، ياإنسان الله، فاهرب من هذه الأمور، واسع في إثر البر والتقوى والإيمان والمحبة والصبر والوداعة."]]}, {"l": "Heb 12:14", "n": "", "vs": [[14, "اجعلوا هدفكم أن تسالموا جميع الناس، وتعيشوا حياة مقدسة. فبغير قداسة، لا يقدر أحد أن يرى الرب."]]}, {"l": "1Pe 3:11-13", "n": "", "vs": [[11, "ليتحول عن الشر ويفعل الخير. ليطلب السلام ويسع للوصول إليه."], [12, "لأن الرب يرعى الأبرار بعنايته، ويستجيب إلى دعائهم. ولكنه يقف ضد الذين يعملون الشر…"], [13, "من يؤذيكم إن كنتم متحمسين للخير؟"]]}], "kwAr": "ماأزال أسعى", "noteAr": ""}, {"kw": "that I", "raw": "Phi_3:14; 1Ti_6:12", "note": "", "refs": [{"l": "Phi 3:14", "n": "", "vs": [[14, "إذ أسعى إلى الهدف، لنوال تلك الجائزة التي يدعونا الله إليها دعوة عليا في المسيح يسوع."]]}, {"l": "1Ti 6:12", "n": "", "vs": [[12, "أحسن الجهاد في معركة الإيمان الجميلة. تمسك بالحياة الأبدية، التي إليها قد دعيت، وقد اعترفت الاعتراف الحسن (بالإيمان) أمام شهود كثيرين."]]}], "kwAr": "لاقتنائها", "noteAr": ""}, {"kw": "apprehended", "raw": "Psa_110:2, Psa_110:3; Act_9:3-6, Act_9:15; Eph_1:4; 2Th_2:13", "note": "", "refs": [{"l": "Psa 110:2", "n": "", "vs": [[2, "يجعل الرب صهيون منطلقا لسلطانك، ويقول: «احكم في وسط أعدائك»."]]}, {"l": "Psa 110:3", "n": "", "vs": [[3, "في يوم محاربة أعدائك يتطوع شعبك. يجيء شبابك إلى التلال المقدسة كالندى في قلب الفجر."]]}, {"l": "Act 9:3-6", "n": "", "vs": [[3, "وفيما هو منطلق إلى دمشق، وقد اقترب منها، لمع حوله فجأة نور من السماء،"], [4, "فوقع إلى الأرض وسمع صوتا يقول له: «شاول! شاول! لماذا تضطهدني؟»"], [5, "فسأل: «من أنت ياسيد؟» فجاءه الجواب: «أنا يسوع الذي أنت تضطهده، صعب عليك أن ترفس المناخس»."], [6, "فقال وهو مرتعد ومتحير؛ «يارب ماذا تريد أن أفعل؟» فقال له الرب: «قم، وادخل المدينة فيقال لك ما يجب أن تفعله»."]]}, {"l": "Act 9:15", "n": "", "vs": [[15, "فأمره الرب: «اذهب! فقد اخترت هذا الرجل ليكون إناء يحمل اسمي إلى الأمم والملوك وبني إسرائيل."]]}, {"l": "Eph 1:4", "n": "", "vs": [[4, "كما كان قد اختارنا فيه قبل تأسيس العالم، لنكون قديسين بلا لوم أمامه."]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}], "kwAr": "قد اقتناني", "noteAr": ""}], "arS": [["لست أدعي أني قد ", []], ["نلت", ["G2983"]], [" الجائزة أو ", []], ["بلغت الكمال", ["G5048"]], [". ولكني ماأزال ", []], ["أسعى", ["G1377"]], [" ", []], ["لاقتنائها", ["G2638"]], ["، كما أن ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [" قد ", []], ["اقتناني", ["G2638"]], [".", []]]}, {"c": 3, "v": 13, "text": "أيها الإخوة، أنا لا أعتبر نفسي قد نلت الجائزة، ولكني أفعل أمرا واحدا: أنسى ما هو وراء وأتقدم إلى ما هو أمام،", "groups": [{"kw": "I count", "raw": "Phi_3:8, Phi_3:12, Phi_1:18-21, Phi_4:11-13", "note": "", "refs": [{"l": "Phi 3:8", "n": "", "vs": [[8, "بل إني أعتبر كل شيء خسارة، من أجل امتياز معرفة المسيح يسوع ربي؛ فمن أجله تحملت خسارة كل شيء، وأعتبر كل شيء نفاية، لكي أربح المسيح"]]}, {"l": "Phi 3:12", "n": "", "vs": [[12, "لست أدعي أني قد نلت الجائزة أو بلغت الكمال. ولكني ماأزال أسعى لاقتنائها، كما أن المسيح يسوع قد اقتناني."]]}, {"l": "Phi 1:18-21", "n": "", "vs": [[18, "فماذا إذن؟ مهما يكن، وفي أي حال، فإن المسيح ينادى به، سواء أكان بذريعة أم بحق. وبهذا أنا أفرح وسأفرح بعد!"], [19, "فإنني أعلم أن هذا الأمر سيؤدي إلى الإفراج عني، بفضل صلاتكم وبمعونة روح يسوع المسيح؛"], [20, "وفقا لما أتوقعه وأرجوه: أني لن أفشل في شيء، بل في كل جرأة وكما في كل حين فكذلك الآن أيضا، يتعظم المسيح في جسدي، سواء أكان بالحياة أم بالموت."], [21, "فالحياة عندي هي المسيح، والموت ربح لي."]]}, {"l": "Phi 4:11-13", "n": "", "vs": [[11, "لست أعني أني كنت في حاجة، فأنا قد تعلمت أن أكون قنوعا في كل حال."], [12, "وأعرف كيف أعيش في العوز، وكيف أعيش في الوفرة. فإني، في كل شيء، وفي جميع الأحوال، متدرب على الشبع وعلى الجوع، وعلى العيش في الوفرة أو في العوز."], [13, "إني أستطيع كل شيء، في المسيح الذي يقويني."]]}], "kwAr": "لا أعتبر نفسي", "noteAr": ""}, {"kw": "one", "raw": "Psa_27:4; Luk_10:42; 2Pe_3:8", "note": "", "refs": [{"l": "Psa 27:4", "n": "", "vs": [[4, "أمرا واحدا طلبت من الرب وإياه فقط ألتمس: أن أقيم في بيت الرب كل أيام حياتي، لأشاهد جمال الرب وأتأمل في هيكله."]]}, {"l": "Luk 10:42", "n": "", "vs": [[42, "ولكن الحاجة هي إلى واحد، ومريم قد اختارت النصيب الصالح الذي لن يؤخذ منها! »"]]}, {"l": "2Pe 3:8", "n": "", "vs": [[8, "ولكن، أيها الأحباء، عليكم ألا تنسوا هذه الحقيقة: أن يوما واحدا في نظر الرب هو كألف سنة، وألف سنة كيوم واحد."]]}], "kwAr": "أمرا واحدا", "noteAr": ""}, {"kw": "forgetting", "raw": "Psa_45:10; Luk_9:62; 2Co_5:16; Heb_6:1", "note": "", "refs": [{"l": "Psa 45:10", "n": "", "vs": [[10, "اسمعي يابنت وانظري، وأرهفي إلي أذنك، وانسي شعبك وبيت أبيك"]]}, {"l": "Luk 9:62", "n": "", "vs": [[62, "فقال له يسوع: «ما من أحد يضع يده على المحراث ويلتفت إلى الوراء، يصلح لملكوت الله»."]]}, {"l": "2Co 5:16", "n": "", "vs": [[16, "إذن، نحن منذ الآن لا نعرف أحدا معرفة بشرية. ولكن إن كنا قد عرفنا المسيح معرفة بشرية، فنحن الآن لا نعرفه هكذا بعد."]]}, {"l": "Heb 6:1", "n": "", "vs": [[1, "لذلك، فلنترك تلك المباديء الأولية عن المسيح، ونتقدم إلى النضوج الكامل. ولا نضع من جديد تلك الأسس التي تعلمناها سابقا، وهي: التوبة من الأعمال المميتة، والإيمان بالله،"]]}], "kwAr": "أنسى ما هو وراء", "noteAr": ""}, {"kw": "and reaching", "raw": "Phi_2:12; Rom_15:23-29; 1Co_9:24-27; Heb_12:1, Heb_12:2", "note": "", "refs": [{"l": "Phi 2:12", "n": "", "vs": [[12, "إذن، ياأحبائي، كما كنتم تطيعون دائما، لا كما لو أنني حاضر وحسب، بل بالأحرى كثيرا الآن وأنا غائب، كذلك اسعوا لتحقيق خلاصكم عمليا بخوف وارتعاد،"]]}, {"l": "Rom 15:23-29", "n": "", "vs": [[23, "أما الآن، فإذ لم يبق لي مجال للعمل بعد في هذه المناطق، وبي شوق شديد إلى المجيء إليكم طوال هذه السنين الكثيرة،"], [24, "فعندما أذهب إلى أسبانيا أرجو أن أمر بكم، فأراكم وتسهلون لي متابعة السفر بعد أن أتمتع بلقائكم ولو لفترة قصيرة."], [25, "على أني الآن ذاهب إلى أورشليم في خدمة القديسين."], [26, "ذلك أن مؤمني مقاطعتي مقدونية وأخائية حسن لديهم أن يجمعوا إعانة للفقراء بين القديسين الذين في أورشليم."], [27, "حسن لديهم ذلك، وهم في دين لأولئك القديسين: فإذا كان الأمم قد اشتركوا في ما هو روحي عند أولئك، فعليهم أيضا أن يخدموهم في ما هو مادي."], [28, "فبعد انتهائي من هذه المهمة، وتسليمي هذا الثمر للقديسين،"], [29, "سأنطلق إلى أسبانيا، مارا بكم. وأعلم أني، إذا جئت إليكم، فسوف أجيء في ملء بركة المسيح."]]}, {"l": "1Co 9:24-27", "n": "", "vs": [[24, "أما تعلمون أن المتبارين يركضون جميعا في الميدان ولكن واحدا منهم فقط يفوز بالجائزة؟ هكذا اركضوا أنتم حتى تفوزوا!"], [25, "وكل متبار يفرض على نفسه تدريبا صارما في شتى المجالات. فهؤلاء المتبارون يفعلون ذلك ليفوزوا بإكليل فان، وأما نحن فلنفوز بإكليل غير فان."], [26, "إذن، أنا أركض هكذا، لا كمن لا هدف له، وهكذا ألاكم أيضا، لا كمن يلطم الهواء،"], [27, "بل أسدد اللكمات إلى جسدي وأسوقه أسيرا، مخافة أن يتبين أني غير مؤهل (للمجازاة) بعدما دعوت الآخرين إليها!"]]}, {"l": "Heb 12:1", "n": "", "vs": [[1, "فبما أن هذا العدد الكبير من الشاهدين للإيمان، يتجمع حولنا كأنه سحابة عظيمة، فلنطرح جانبا كل ثقل يعيقنا عن التقدم، ونتخلص من تلك الخطيئة التي نتعرض للسقوط في فخها بسهولة، لكي نتمكن، نحن أيضا، أن نركض باجتهاد في السباق الممتد أمامنا،"]]}, {"l": "Heb 12:2", "n": "", "vs": [[2, "متطلعين دائما إلى يسوع: رائد إيماننا ومكمله. فهو قد تحمل الموت صلبا، هازئا بما في ذلك من عار، إذ كان ينظر إلى السرور الذي ينتظره، ثم جلس عن يمين عرش الله."]]}], "kwAr": "وأتقدم إلى ما هو أمام", "noteAr": ""}], "arS": [["أيها ", []], ["الإخوة", ["G80"]], ["، ", []], ["أنا", ["G1473"]], [" لا ", []], ["أعتبر", ["G3049"]], [" ", []], ["نفسي", ["G1683"]], [" قد ", []], ["نلت", ["G2638"]], [" الجائزة، ولكني أفعل أمرا ", []], ["واحدا", ["G1520"]], [": ", []], ["أنسى", ["G1950"]], [" ما هو ", []], ["وراء", ["G3694"]], [" ", []], ["وأتقدم", ["G1901"]], [" إلى ما هو ", []], ["أمام", ["G1715"]], ["،", []]]}, {"c": 3, "v": 14, "text": "إذ أسعى إلى الهدف، لنوال تلك الجائزة التي يدعونا الله إليها دعوة عليا في المسيح يسوع.", "groups": [{"kw": "press", "raw": "Luk_16:16; 2Co_4:17, 2Co_4:18, 2Co_5:1; 2Ti_4:7, 2Ti_4:8; Rev_3:21", "note": "", "refs": [{"l": "Luk 16:16", "n": "", "vs": [[16, "ظلت الشريعة والأنبياء حتى زمن يوحنا: ومنذ ذلك الوقت يبشر بملكوت الله، وكل واحد يشق طريقه باجتهاد للدخول إليه."]]}, {"l": "2Co 4:17", "n": "", "vs": [[17, "ذلك لأن ما يضايقنا الآن من صعوبات بسيطة عابرة، ينتج لنا بمقدار لا يحد وزنة أبدية من المجد،"]]}, {"l": "2Co 4:18", "n": "", "vs": [[18, "إذ نرفع أنظارنا عن الأمور المنظورة ونثبتها على الأمور غير المنظورة. فإن الأمور المنظورة إنما هي إلى حين؛ وأما غير المنظورة فهي أبدية."]]}, {"l": "2Co 5:1", "n": "", "vs": [[1, "فإننا نعلم أنه متى تهدمت خيمتنا الأرضية التي نسكنها الآن، يكون لنا بناء من الله: بيت لم تصنعه أيدي البشر، أبدي في السماوات."]]}, {"l": "2Ti 4:7", "n": "", "vs": [[7, "قد جاهدت الجهاد الحسن، قد بلغت نهاية الشوط، قد حافظت على الإيمان."]]}, {"l": "2Ti 4:8", "n": "", "vs": [[8, "إنما ينتظرني الآن إكليل البر المحفوظ لي، والذي سيهبه لي الرب الديان العادل في ذلك اليوم؛ ولن يوهب لي وحدي، بل أيضا لجميع الذين يحبون ظهوره."]]}, {"l": "Rev 3:21", "n": "", "vs": [[21, "وكل من ينتصر سأجلسه معي على عرشي، كما انتصرت أنا أيضا فجلست مع أبي على عرشه؛"]]}], "kwAr": "أسعى إلى الهدف", "noteAr": ""}, {"kw": "the high", "raw": "Rom_8:28-30, Rom_9:23, Rom_9:24; 1Th_2:12; 2Th_2:13, 2Th_2:14; Heb_3:1; 1Pe_1:3, 1Pe_1:4, 1Pe_1:13; 1Pe_5:10; 2Pe_1:3", "note": "", "refs": [{"l": "Rom 8:28-30", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."], [29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."], [30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."]]}, {"l": "Rom 9:23", "n": "", "vs": [[23, "وذلك بقصد أن يعلن غنى مجده في أوعية الرحمة التي سبق فأعدها للمجد،"]]}, {"l": "Rom 9:24", "n": "", "vs": [[24, "فينا نحن الذين دعاهم لا من بين اليهود فقط بل من بين الأمم أيضا؟"]]}, {"l": "1Th 2:12", "n": "", "vs": [[12, "ونحرضكم أن تسلكوا سلوكا يليق بالله، ذاك الذي يدعوكم إلى ملكوته ومجده."]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "2Th 2:14", "n": "", "vs": [[14, "فإلى هذا الأمر قد دعاكم ببشارتنا لكم، لنوال مجد ربنا يسوع المسيح."]]}, {"l": "Heb 3:1", "n": "", "vs": [[1, "إذن، أيها الإخوة القديسون الذين اشتركتم في الدعوة السماوية، تأملوا يسوع: الرسول ورئيس الكهنة في الإيمان الذي نتمسك به."]]}, {"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}, {"l": "1Pe 1:4", "n": "", "vs": [[4, "وإرثا لا يفنى ولا يفسد ولا يزول،"]]}, {"l": "1Pe 1:13", "n": "", "vs": [[13, "لذلك اجعلوا أذهانكم متنبهة دائما، وتيقظوا، وعلقوا رجاءكم كله على النعمة التي ستكون من نصيبكم عندما يعود يسوع المسيح ظاهرا بمجده!"]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}, {"l": "2Pe 1:3", "n": "", "vs": [[3, "إن الله، بقدرته الإلهية، قد زودنا بكل ما نحتاج إليه في الحيا ة الروحية المتصفة بالتقوى. ذلك أنه عرفنا بالمسيح الذي دعانا إلى مجده وفضيلته،"]]}], "kwAr": "دعوة عليا", "noteAr": ""}], "arS": [["إذ ", []], ["أسعى", ["G1377"]], [" إلى ", []], ["الهدف", ["G4649"]], ["، لنوال تلك ", []], ["الجائزة", ["G1017"]], [" التي ", []], ["يدعونا", ["G2821"]], [" ", []], ["الله", ["G2316"]], [" إليها دعوة ", []], ["عليا", ["G507"]], [" في ", []], ["المسيح", ["G5547"]], [" ", []], ["يسوع", ["G2424"]], [".", []]]}, {"c": 3, "v": 15, "text": "جميع البالغين فينا، ليكن فيهم هذا الفكر. وإن كان فيكم غير هذا الفكر، فذلك أيضا سيكشفه لكم الله .", "groups": [{"kw": "as", "raw": "Rom_15:1; 1Co_2:6, 1Co_14:20; Col_1:28, Col_4:12; 2Ti_3:17; Heb_5:14 *Gr: Jam_1:4; 1Jo_2:5", "note": "", "refs": [{"l": "Rom 15:1", "n": "", "vs": [[1, "ولكن علينا نحن الأقوياء (في الإيمان)، أن نحتمل ضعف الضعفاء (فيه)، وأن لا نرضي أنفسنا."]]}, {"l": "1Co 2:6", "n": "", "vs": [[6, "على أن لنا حكمة نتكلم بها بين البالغين. ولكنها حكمة ليست من هذا العالم ولا من رؤساء هذا العالم الزائلين."]]}, {"l": "1Co 14:20", "n": "", "vs": [[20, "أيها الإخوة، لا تكونوا أولادا في التفكير، بل كونوا أطفالا في الشر. وأما في التفكير، فكونوا راشدين."]]}, {"l": "Col 1:28", "n": "", "vs": [[28, "هذا السر نعلنه نحن، واعظين كل إنسان، ومعلمين كل إنسان، في كل حكمة، لكي نحضر كل إنسان كاملا في المسيح."]]}, {"l": "Col 4:12", "n": "", "vs": [[12, "يسلم عليكم أبفراس الذي هو منكم، وهو عبد للمسيح يسوع، يجاهد كل حين لأجلكم في الصلوات لتثبتوا كاملين ولكم تمام اليقين من جهة مشيئة الله كلها."]]}, {"l": "2Ti 3:17", "n": "", "vs": [[17, "لكي يجعل إنسان الله مؤهلا تأهيلا كاملا، ومجهزا لكل عمل صالح."]]}, {"l": "Heb 5:14", "n": "*Gr:", "vs": [[14, "أما الناضجون روحيا، فهم قادرون على تناول الطعام القوي: لأن حواسهم قد تدربت، بالممارسة الصحيحة، على التمييز بين الخير والشر."]]}, {"l": "Jam 1:4", "n": "", "vs": [[4, "ودعوا الصبر يعمل عمله الكامل فيكم، لكي يكتمل نضوجكم وتصيروا أقوياء قادرين على مواجهة جميع الأحوال."]]}, {"l": "1Jo 2:5", "n": "", "vs": [[5, "أما الذي يعمل بحسب كلمة المسيح، فإن محبة الله تكون قد اكتملت في داخله. بهذا نعرف أننا ننتمي إلى المسيحِ."]]}], "kwAr": "جميع البالغين", "noteAr": ""}, {"kw": "be thus", "raw": "Phi_3:12-14; Gal_5:10", "note": "", "refs": [{"l": "Phi 3:12-14", "n": "", "vs": [[12, "لست أدعي أني قد نلت الجائزة أو بلغت الكمال. ولكني ماأزال أسعى لاقتنائها، كما أن المسيح يسوع قد اقتناني."], [13, "أيها الإخوة، أنا لا أعتبر نفسي قد نلت الجائزة، ولكني أفعل أمرا واحدا: أنسى ما هو وراء وأتقدم إلى ما هو أمام،"], [14, "إذ أسعى إلى الهدف، لنوال تلك الجائزة التي يدعونا الله إليها دعوة عليا في المسيح يسوع."]]}, {"l": "Gal 5:10", "n": "", "vs": [[10, "ولكن لي ثقة بكم في الرب أنكم لن تعتنقوا رأيا آخر. وكل من يثير البلبلة بينكم سيلقى عقاب ذلك، كائنا من كان."]]}], "kwAr": "ليكن فيهم هذا الفكر", "noteAr": ""}, {"kw": "God", "raw": "Psa_25:8, Psa_25:9; Pro_2:3-6, Pro_3:5, Pro_3:6; Isa_35:8; Luk_11:13; Joh_7:17; Jam_1:5", "note": "", "refs": [{"l": "Psa 25:8", "n": "", "vs": [[8, "الرب صالح ومستقيم لذلك يهدي الضالين الطريق."]]}, {"l": "Psa 25:9", "n": "", "vs": [[9, "يدرب الودعاء في سبل الحق ويعلمهم طريقه."]]}, {"l": "Pro 2:3-6", "n": "", "vs": [[3, "وإن نشدت الفطنة، وهتفت داعيا الفهم."], [4, "إن التمسته كما تلتمس الفضة، وبحثت عنه كما يبحث عن الكنوز الدفينة،"], [5, "عندئذ تدرك مخافة الرب وتعثر على معرفة الله،"], [6, "لأن الرب يهب الحكمة، ومن فمه تتدفق المعرفة والفهم."]]}, {"l": "Pro 3:5", "n": "", "vs": [[5, "اتكل على الرب من كل قلبك، وعلى فطنتك لا تعتمد."]]}, {"l": "Pro 3:6", "n": "", "vs": [[6, "اعرف الرب في كل طرقك وهو يقوم سبلك."]]}, {"l": "Isa 35:8", "n": "", "vs": [[8, "وتكون هناك طريق تدعى طريق القداسة، لا يسلك فيها من هو دنس، إنما تكون من نصيب السالكين في تلك الطريق، ولا يضل فيها حتى الجهال."]]}, {"l": "Luk 11:13", "n": "", "vs": [[13, "فإن كنتم، أنتم الأشرار، تعرفون أن تعطوا أولادكم عطايا جيدة، فكم بالأحرى الآب، الذي من السماء يهب الروح القدس لمن يسألونه؟ »"]]}, {"l": "Joh 7:17", "n": "", "vs": [[17, "ومن أراد أن يعمل مشيئة الله يعرف ما إذا كان تعليمي من عند الله، أو أنني أتكلم من عندي."]]}, {"l": "Jam 1:5", "n": "", "vs": [[5, "وإن كان أحد منكم بحاجة إلى الحكمة، فليطلب من الله الذي يعطي الجميع بسخاء ولا يعير. فسيعطى له."]]}], "kwAr": "سيكشفه لكم الله", "noteAr": ""}], "arS": [["جميع", ["G3745"]], [" ", []], ["البالغين", ["G5046"]], [" فينا، ليكن فيهم هذا ", []], ["الفكر", ["G5426"]], [". وإن كان فيكم غير هذا ", []], ["الفكر", ["G5426"]], ["، فذلك أيضا ", []], ["سيكشفه", ["G601"]], [" لكم ", []], ["الله", ["G2316"]], [" .", []]]}, {"c": 3, "v": 16, "text": "إنما، لنواصل السير من حيث قد وصلنا، في المنهج نفسه.", "groups": [{"kw": "whereto", "raw": "Gal_5:7; Heb_10:38, Heb_10:39; 2Pe_2:10-20; Rev_2:4, Rev_2:5, Rev_3:3", "note": "", "refs": [{"l": "Gal 5:7", "n": "", "vs": [[7, "كنتم تجرون جريا جيدا، فمن أعاقكم حتى لا تذعنوا للحق؟"]]}, {"l": "Heb 10:38", "n": "", "vs": [[38, "وأما من تبرر بالإيمان، فبالإيمان يحيا. ومن ارتد لا تسر به نفسي!"]]}, {"l": "Heb 10:39", "n": "", "vs": [[39, "ولكننا نحن لسنا من أهل الارتداد المؤدي إلى الهلاك، بل من أهل الإيمان المؤدي إلى خلاص نفوسنا!"]]}, {"l": "2Pe 2:10-20", "n": "", "vs": [[10, "وما أشد العقاب، وبخاصة على الذين ينجرفون وراء الميول الجسدية، مستجيبين لشهوة النجاسة، ومحتقرين سيادة الله! ثم إنهم وقحون، معجبون بأنفسهم، لا يخافون أن يتكلموا بالشتم والإهانة على أصحاب الأمجاد."], [11, "ومع ذلك، فحتى الملائكة، وهم يتفوقون عليهم في القوة والقدرة، لا يقدمون عليهم أمام الرب أية تهمة مهينة.."], [12, "حقا إن هؤلاء المعلمين الدجالين الذين يتكلمون كلاما مهينا في أمور يجهلونها، يشبهون الحيوانات المفترسة غير العاقلة، المولودة ليصطادها الناس ويقتلوها. فلابد أن يهلكوا مثلها."], [13, "وبذلك ينالون أجرة إثمهم! إنهم يحسبون الانغماس في اللذات طول النهار بهجة عظيمة. فهم أوساخ وعيوب: يتلذذون بالنجاسة ويحاولون خداعكم، فيشتركون معكم في الولائم."], [14, "عيونهم لا تنظر إلا نظرات الزنى، ولا تشبع من الخطيئة. وكم من نفوس ضعيفة تقع في فخاخهم! أما قلوبهم، فقد تدربت على الشهوة والطمع. إنهم حقا أبناء اللعنة!"], [15, "وإذ خرجوا عن الطريق المستقيم، ضلوا. فهم سائرون في طريق بلعام بن بعور، الذي أحب الحصول على المال أجرة لإثمه."], [16, "ولكنه توبخ على هذه المخالفة التي ارتكبها. إذ إن الحمار الأبكم نطق بصوت بشري، فوضع حدا لحماقة ذلك النبي!"], [17, "فليس هؤلاء إلا آبارا لا ماء فيها، وغيوما تسوقها الريح العاصفة. ويا له من مصير مرعب محجوز لهم في الظلام الأبدي القاتم!"], [18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."], [19, "يعدون هؤلاء بالحرية، وهم أنفسهم عبيد للفساد! لأن الإنسان يصير عبدا لكل ما يتسلط عليه ويغلبه."], [20, "فإن الذين يبتعدون عن نجاسات العالم بعد أن يتعرفوا بالرب والمخلص يسوع المسيح، ثم يعودون ويتورطون بها، تتسلط عليهم تلك النجاسات، فتصير نهايتهم أشر من بدايتهم."]]}, {"l": "Rev 2:4", "n": "", "vs": [[4, "ولي عليك أنك تركت محبتك الأولى!"]]}, {"l": "Rev 2:5", "n": "", "vs": [[5, "فاذكر من أين سقطت، وتب راجعا إلى أعمالك السابقة، وإلا أتيت وزحزحت منارتك من موضعها إن كنت لا تتوب!"]]}, {"l": "Rev 3:3", "n": "", "vs": [[3, "تذكر ما سبق أن تقبلته وسمعته، وتمسك بما آمنت به، وتب! فإن كنت لا تتنبه، آتيك كما يأتي اللص، ولا تدري في أية ساعة أفاجئك!"]]}], "kwAr": "من حيث قد وصلنا", "noteAr": ""}, {"kw": "let us walk", "raw": "Rom_12:16, Rom_15:5; Gal_6:16; Eph_5:2-8; Col_2:6", "note": "", "refs": [{"l": "Rom 12:16", "n": "", "vs": [[16, "كونوا متوافقين بعضكم مع بعض، غير مهتمين بالأمور العالية، بل مسايرين ذوي المراكز الوضيعة. لا تكونوا حكماء في نظر أنفسكم."]]}, {"l": "Rom 15:5", "n": "", "vs": [[5, "وليعطكم إله الصبر والتعزية أن تكونوا متوافقين بعضكم مع بعض بحسب المسيح يسوع،"]]}, {"l": "Gal 6:16", "n": "", "vs": [[16, "فالسلام والرحمة على جميع السالكين وفقا لهذا المبدأ، وعلى إسرائيل الله."]]}, {"l": "Eph 5:2-8", "n": "", "vs": [[2, "واسلكوا في المحبة على مثال المسيح الذي أحبنا وبذل نفسه لأجلنا تقدمة وذبيحة لله طيبة الرائحة."], [3, "أما الزنى، وكل نجاسة أو شهوة نهمة، فلا يذكر بينكم حتى اسمها، كما يليق بالقديسين."], [4, "وكذلك البذاءة والكلام السفيه والهزل، فهي غير لائقة. وإنما أحرى بكم أن تلهجوا بالشكر لله!"], [5, "فإنكم تعلمون هذا جيدا: أن كل زان أو نجس أو صاحب شهوة نهمة، ما هو إلا عابد أصنام، ليس له ميراث في ملكوت المسيح والله."], [6, "لا يخدعكم أحد بكلام باطل! فبسبب هذه الأمور يحل غضب الله على أبناء العصيان."], [7, "إذن، لا تكونوا شركاء لهم:"], [8, "فقد كنتم في الماضي ظلاما، ولكنكم الآن نور في الرب. فاسلكوا سلوك أولاد النور."]]}, {"l": "Col 2:6", "n": "", "vs": [[6, "فمثلما قبلتم المسيح يسوع الرب، ففيه اسلكوا"]]}], "kwAr": "لنواصل السير", "noteAr": ""}, {"kw": "let us mind", "raw": "Phi_1:27, Phi_2:2, Phi_4:2", "note": "", "refs": [{"l": "Phi 1:27", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"]]}, {"l": "Phi 2:2", "n": "", "vs": [[2, "فتمموا فرحي بأن يكون لكم رأي واحد ومحبة واحدة ونفس واحدة وفكر واحد."]]}, {"l": "Phi 4:2", "n": "", "vs": [[2, "أحث أفودية، كما أحث سنتيخي، أن يكون لهما، في الرب، فكر واحد،"]]}], "kwAr": "في المنهج نفسه", "noteAr": ""}], "arS": [["إنما، ", []], ["لنواصل السير", ["G4748"]], [" من حيث قد ", []], ["وصلنا", ["G5348"]], ["، في المنهج نفسه.", []]]}, {"c": 3, "v": 17, "text": "كونوا جميعا، أيها الإخوة، مقتدين بي؛ ولاحظوا الذين يسلكون بحسب القدوة التي ترونها فينا.", "groups": [{"kw": "be", "raw": "Phi_4:9; 1Co_4:16, 1Co_10:32, 1Co_10:33, 1Co_11:1; 1Th_1:6, 1Th_2:10-14; 2Th_3:7, 2Th_3:9; 1Ti_4:12; Heb_13:7; 1Pe_5:3", "note": "", "refs": [{"l": "Phi 4:9", "n": "", "vs": [[9, "واعملوا بها ما تعلمتم وتلقيتم وسمعتم مني وما رأيتم في. وإله السلام يكون معكم."]]}, {"l": "1Co 4:16", "n": "", "vs": [[16, "فأدعوكم إذن إلى الاقتداء بي."]]}, {"l": "1Co 10:32", "n": "", "vs": [[32, "لا تضعوا عائقا يسبب السقوط لأحد، سواء من اليهود أم اليونانيين أم كنيسة الله."]]}, {"l": "1Co 10:33", "n": "", "vs": [[33, "فهكذا أنا أيضا أسعى لإرضاء الجميع في كل شيء، ولا أهتم بمصلحتي الخاصة، بل بمصلحة الكثيرين، لكي يخلصوا."]]}, {"l": "1Co 11:1", "n": "", "vs": [[1, "فاقتدوا بي كما أقتدي أنا بالمسيح!"]]}, {"l": "1Th 1:6", "n": "", "vs": [[6, "وقد صرتم مقتدين بنا وبالرب، إذ تقبلتم كلمة الله في وسط ضيقة شديدة بفرح الروح القدس."]]}, {"l": "1Th 2:10-14", "n": "", "vs": [[10, "فأنتم تشهدون، ويشهد الله ، كيف تصرفنا بينكم، أنتم المؤمنين، بطهارة واستقامة وبراءة من اللوم،"], [11, "كما أنكم تعلمون كيف عاملناكم معاملة الأب لأولاده، فكنا نعظ كل واحد منكم ونشجعكم"], [12, "ونحرضكم أن تسلكوا سلوكا يليق بالله، ذاك الذي يدعوكم إلى ملكوته ومجده."], [13, "ولذلك نحن أيضا نرفع الشكر لله بلا توقف، لأنكم لما تلقيتم منا كلمة البشارة من الله، قبلتموها لا كأنها كلمة بشر، بل كما هي في الحقيقة: باعتبارها كلمة الله العاملة أيضا فيكم أنتم المؤمنين."], [14, "فإنكم، أيها الإخوة، قد صرتم على مثال كنائس الله التي في منطقة اليهودية والتي هي في المسيح يسوع. فأنتم أيضا قاسيتم على أيدي بني جنسكم ما قاسوه هم على أيدي اليهود"]]}, {"l": "2Th 3:7", "n": "", "vs": [[7, "فأنتم أنفسكم تعرفون كيف ينبغي أن تقتدوا بنا، لأن سلوكنا بينكم لم يكن فوضويا،"]]}, {"l": "2Th 3:9", "n": "", "vs": [[9, "وذلك لا يعني أنه ليس لنا حق، بل لنجعل أنفسنا مثالا لكم لتقتدوا بنا."]]}, {"l": "1Ti 4:12", "n": "", "vs": [[12, "لا يستخف أحد بحداثة سنك. وإنما كن قدوة للمؤمنين، في الكلام والسلوك والمحبة والإيمان والطهارة."]]}, {"l": "Heb 13:7", "n": "", "vs": [[7, "اذكروا دائما مرشديكم الذين علموكم كلام الله. تأملوا سيرتهم حتى النهاية، واقتدوا بإيمانهم."]]}, {"l": "1Pe 5:3", "n": "", "vs": [[3, "لا تتسلطوا على القطيع الذي وضعه الله أمانة بين أيديكم، بل كونوا قدوة له."]]}], "kwAr": "كونوا جميعا مقتدين بي", "noteAr": ""}, {"kw": "and mark", "raw": "Psa_37:37; Rom_16:17; 2Th_3:14", "note": "", "refs": [{"l": "Psa 37:37", "n": "", "vs": [[37, "لاحظ الكامل وانظر المستقيم، فإن نهاية ذلك الإنسان تكون سلاما."]]}, {"l": "Rom 16:17", "n": "", "vs": [[17, "ولكن، أتوسل إليكم، أيها الإخوة، أن تنتبهوا إلى مثيري الانقسامات والعثرات، خلافا للتعليم الذي تعلمتم، وأن تبتعدوا عنهم."]]}, {"l": "2Th 3:14", "n": "", "vs": [[14, "وإن كان أحد لا يطيع كلمتنا في هذه الرسالة، فميزوه ولا تتعاملوا معه، لتدفعوه إلى الخجل."]]}], "kwAr": "ولاحظوا", "noteAr": ""}], "arS": [["كونوا جميعا، أيها ", []], ["الإخوة", ["G80"]], ["، ", []], ["مقتدين", ["G4831"]], [" بي؛ ", []], ["ولاحظوا", ["G4648"]], [" الذين ", []], ["يسلكون", ["G4043"]], [" بحسب ", []], ["القدوة", ["G5179"]], [" التي ترونها فينا.", []]]}, {"c": 3, "v": 18, "text": "فإن كثيرين ممن يسلكون بينكم، وقد ذكرتهم لكم مرارا وأذكرهم الآن أيضا باكيا، إنما هم أعداء لصليب المسيح.", "groups": [{"kw": "many", "raw": "Isa_8:11; Dan_4:37; Gal_2:14; Eph_4:17; 2Th_3:11; 2Pe_2:10; Jud_1:13", "note": "", "refs": [{"l": "Isa 8:11", "n": "", "vs": [[11, "لأن الرب خاطبني حين وضع يده علي وأنذرني أن لا أسلك في طريق هذا الشعب قائلا:"]]}, {"l": "Dan 4:37", "n": "", "vs": [[37, "فالآن، أنا نبوخذناصر، أسبح وأمجد وأحمد ملك السماء الذي جميع أعماله حق، وطرقه عادلة وقادر على إذلال كل من يسلك بالكبرياء."]]}, {"l": "Gal 2:14", "n": "", "vs": [[14, "فلما رأيت أنهم لا يسلكون باستقامة توافق حق الإنجيل، قلت لبطرس أمام الحاضرين جميعا: «إن كنت وأنت يهودي تعيش كالأمم لا كاليهود، فكيف تجبر الأمم أن يعيشوا كاليهود؟»"]]}, {"l": "Eph 4:17", "n": "", "vs": [[17, "أقول هذا إذن، وأشهد في الرب، راجيا ألا تسلكوا فيما بعد كما يسلك الأمم في عقم ذهنهم،"]]}, {"l": "2Th 3:11", "n": "", "vs": [[11, "وقد سمعنا أن بينكم بعض الذين يسلكون سلوكا فوضويا فلا يشتغلون شيئا بل يتلهون بشؤون غيرهم."]]}, {"l": "2Pe 2:10", "n": "", "vs": [[10, "وما أشد العقاب، وبخاصة على الذين ينجرفون وراء الميول الجسدية، مستجيبين لشهوة النجاسة، ومحتقرين سيادة الله! ثم إنهم وقحون، معجبون بأنفسهم، لا يخافون أن يتكلموا بالشتم والإهانة على أصحاب الأمجاد."]]}, {"l": "Jud 1:13", "n": "", "vs": [[13, "وبأعمالهم المخجلة يفضحون أنفسهم كأمواج في البحر هائجة تقذف الأوساخ. وهم أشبه بنجوم تائهة في الفضاء، مصيرها الظلام الشديد إلى الأبد!"]]}], "kwAr": "فإن كثيرين", "noteAr": ""}, {"kw": "I have", "raw": "1Co_6:9; Gal_5:21; Eph_5:5, Eph_5:6; 1Th_4:6", "note": "", "refs": [{"l": "1Co 6:9", "n": "", "vs": [[9, "أما تعلمون أن الظالمين لن يرثوا ملكوت الله؟ لا تضلوا: فإن ملكوت الله لن يرثه الزناة ولا عابدو الأصنام ولا الفاسقون ولا المتخنثون ولا مضاجعو الذكور"]]}, {"l": "Gal 5:21", "n": "", "vs": [[21, "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!"]]}, {"l": "Eph 5:5", "n": "", "vs": [[5, "فإنكم تعلمون هذا جيدا: أن كل زان أو نجس أو صاحب شهوة نهمة، ما هو إلا عابد أصنام، ليس له ميراث في ملكوت المسيح والله."]]}, {"l": "Eph 5:6", "n": "", "vs": [[6, "لا يخدعكم أحد بكلام باطل! فبسبب هذه الأمور يحل غضب الله على أبناء العصيان."]]}, {"l": "1Th 4:6", "n": "", "vs": [[6, "وألا يتعدى حقوق أخيه ويسيء إليه في هذا الأمر، لأن الرب هو المنتقم لجميع هذه الإساءات، كما أنذرناكم قبلا وشهدنا لكم بحق."]]}], "kwAr": "ذكرتهم لكم مرارا", "noteAr": ""}, {"kw": "even", "raw": "Phi_1:4; Psa_119:136; Jer_9:1, Jer_13:17; Luk_19:41; Act_20:19, Act_20:30,Act_20:31; Rom_9:2; 2Co_2:4, 2Co_11:29", "note": "", "refs": [{"l": "Phi 1:4", "n": "", "vs": [[4, "إذ أتضرع بفرح لأجلكم جميعا كل حين في جميع صلواتي،"]]}, {"l": "Psa 119:136", "n": "", "vs": [[136, "فاضت من عيني ينابيع دمع، لأنهم لم يراعوا شريعتك."]]}, {"l": "Jer 9:1", "n": "", "vs": [[1, "ياليت رأسي فيض مياه، وعيني ينبوع دموع، فأبكي نهارا وليلا قتلى بنت شعبي"]]}, {"l": "Jer 13:17", "n": "", "vs": [[17, "وإن لم تنصتوا فإن نفسي تبكي في الخفاء من أجل كبريائكم، وتذرف عيناي الدموع المريرة، فتسيل العبرات لأن الرب قد سبى شعبه."]]}, {"l": "Luk 19:41", "n": "", "vs": [[41, "ولما اقترب، ورأى المدينة، بكى عليها،"]]}, {"l": "Act 20:19", "n": "", "vs": [[19, "فقد كنت أخدم الرب بكل تواضع، وبكثير من الدموع، وأنا أعاني المحن التي أصابتني بها مؤامرات اليهود."]]}, {"l": "Act 20:30", "n": "", "vs": [[30, "بل إن قوما منكم أنتم سيقومون ويعلمون تعاليم منحرفة، ليجروا التلاميذ وراءهم."]]}, {"l": "Act 20:31", "n": "", "vs": [[31, "لذلك كونوا متيقظين، وتذكروا أني، مدة ثلاث سنين، لم أتوقف ليلا ونهارا عن نصح كل واحد منكم وأنا أذرف الدموع."]]}, {"l": "Rom 9:2", "n": "", "vs": [[2, "إن بي حزنا شديدا، وبقلبي ألم لا ينقطع:"]]}, {"l": "2Co 2:4", "n": "", "vs": [[4, "فإن ما كتبته إليكم سابقا كان نابعا من ضيق شديد واكتئاب في القلب، ومصحوبا بدموع كثيرة. وما كان قصدي أن أحزنكم، بل أن تعرفوا المحبة الفياضة التي عندي من نحوكم."]]}, {"l": "2Co 11:29", "n": "", "vs": [[29, "أهنالك من يضعف ولا أضعف أنا، ومن يتعثر ولا أحترق أنا؟"]]}], "kwAr": "باكيا", "noteAr": ""}, {"kw": "enemies", "raw": "Phi_1:15, Phi_1:16; 1Co_1:18; Gal_1:7, Gal_2:21, Gal_6:12", "note": "", "refs": [{"l": "Phi 1:15", "n": "", "vs": [[15, "حقا أن بعضهم يبشرون بالمسيح عن حسد ونزاع؛ وأما الآخرون فعن حسن نية."]]}, {"l": "Phi 1:16", "n": "", "vs": [[16, "فهؤلاء تدفعهم المحبة، عالمين أني قد عينت للدفاع عن الإنجيل؛"]]}, {"l": "1Co 1:18", "n": "", "vs": [[18, "لأن البشارة بالصليب جهالة عند الهالكين؛ وأما عندنا، نحن المخلصين، فهي قدرة الله."]]}, {"l": "Gal 1:7", "n": "", "vs": [[7, "لا أعني أن هنالك إنجيلا آخر، بل إنما هنالك بعض (المعلمين) الذين يثيرون البلبلة بينكم، راغبين في تحوير إنجيل المسيح."]]}, {"l": "Gal 2:21", "n": "", "vs": [[21, "إني لا أبطل فاعلية نعمة الله، إذ لو كان البر بالشريعة، لكان موت المسيح عملا لا داعي له."]]}, {"l": "Gal 6:12", "n": "", "vs": [[12, "إن الذين يريدون أن يظهروا في الجسد بمظهر حسن، أولئك يرغمونكم أن تختنوا، فقط لئلا يلقوا الاضطهاد بسبب صليب المسيح."]]}], "kwAr": "أعداء لصليب المسيح", "noteAr": ""}], "arS": [["فإن ", []], ["كثيرين", ["G4183"]], [" ممن ", []], ["يسلكون", ["G4043"]], [" بينكم، وقد ", []], ["ذكرتهم", ["G3004"]], [" لكم ", []], ["مرارا", ["G4178"]], [" وأذكرهم ", []], ["الآن", ["G3568"]], [" أيضا ", []], ["باكيا", ["G2799"]], ["، إنما هم ", []], ["أعداء", ["G2190"]], [" ", []], ["لصليب", ["G4716"]], [" ", []], ["المسيح", ["G5547"]], [".", []]]}, {"c": 3, "v": 19, "text": "الذين مصيرهم الهلاك، وإلههم بطونهم، ومفخرتهم في عيبتهم، وفكرهم منصرف إلى الأمور الأرضية.", "groups": [{"kw": "end", "raw": "Mat_25:41; Luk_12:45, Luk_12:46; 2Co_11:15; 2Th_2:8, 2Th_2:12; Heb_6:6-8; 2Pe_2:1, 2Pe_2:3; 2Pe_2:17; Jud_1:4, Jud_1:13; Rev_19:20, Rev_20:9, Rev_20:10, Rev_21:8, Rev_22:15", "note": "", "refs": [{"l": "Mat 25:41", "n": "", "vs": [[41, "ثم يقول للذين عن يساره: ابتعدوا عني ياملاعين إلى النار الأبدية المعدة لإبليس وأعوانه!"]]}, {"l": "Luk 12:45", "n": "", "vs": [[45, "ولكن إذا قال ذلك العبد في نفسه: سيدي سيتأخر في رجوعه؛ وأخذ يضرب الخادمين والخادمات ويأكل ويشرب ويسكر،"]]}, {"l": "Luk 12:46", "n": "", "vs": [[46, "فإن سيد ذلك العبد يرجع في يوم لا يتوقعه وساعة لا يعرفها، فيمزقه ويجعل مصيره مع الخائنين."]]}, {"l": "2Co 11:15", "n": "", "vs": [[15, "فليس كثيرا إذن أن يظهر خدامه أنفسهم بمظهر خدام البر. وإن عاقبتهم ستكون على حسب أعمالهم."]]}, {"l": "2Th 2:8", "n": "", "vs": [[8, "عندئذ سيظهر الإنسان المتمرد ظهورا جليا فيبيده الرب يسوع بنفخة فمه ويلاشيه ببهاء ظهوره عند عودته."]]}, {"l": "2Th 2:12", "n": "", "vs": [[12, "فتقع الدينونة على جميع الذين لم يؤمنوا بالحق بل سرهم الإثم."]]}, {"l": "Heb 6:6-8", "n": "", "vs": [[6, "ثم ارتدوا إلى تلك الأسس القديمة، أولئك يستحيل عليهم أن يتجددوا ثانية فيعودوا إلى التوبة. فهم يجنون على أنفسهم إذ يصلبون ابن الله مرة ثانية ويجعلونه عرضة للعار."], [7, "ولا عجب، فالتربة التي تشرب الأمطار النازلة عليها مرارا كثيرة، ثم تنتج نباتا ينفع الذين حرثوها، تنال البركة من الله!"], [8, "ولكنها، إن أخرجت الشوك والعشب البري، تكون مرفوضة وتستحق اللعنة، وما نهايتها إلا الحريق."]]}, {"l": "2Pe 2:1", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."]]}, {"l": "2Pe 2:3", "n": "", "vs": [[3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}, {"l": "2Pe 2:17", "n": "", "vs": [[17, "فليس هؤلاء إلا آبارا لا ماء فيها، وغيوما تسوقها الريح العاصفة. ويا له من مصير مرعب محجوز لهم في الظلام الأبدي القاتم!"]]}, {"l": "Jud 1:4", "n": "", "vs": [[4, "لأنه قد تسلل إلى ما بينكم معلمون لابد أن يلاقوا الحكم بالعقاب الأبدي، كما هو مكتوب لهم منذ القديم. فهم أشرار لا يهابون الله ، يتخذون من نعمة إلهنا فرصة لإباحة الرذائل، وينكرون سيدنا وربنا الوحيد يسوع المسيح."]]}, {"l": "Jud 1:13", "n": "", "vs": [[13, "وبأعمالهم المخجلة يفضحون أنفسهم كأمواج في البحر هائجة تقذف الأوساخ. وهم أشبه بنجوم تائهة في الفضاء، مصيرها الظلام الشديد إلى الأبد!"]]}, {"l": "Rev 19:20", "n": "", "vs": [[20, "فقبض على الوحش وعلى النبي الدجال الذي قام بالمعجزات في حضور الوحش وأضل بها الذين قبلوا علامة الوحش، وسجدوا لتمثاله. وطرح كلاهما حيا في بحيرة النار والكبريت المتقدة،"]]}, {"l": "Rev 20:9", "n": "", "vs": [[9, "فيصعدون على سهول الأرض العريضة، ويحاصرون من كل جانب معسكر القديسين والمدينة المحبوبة، ولكن نارا من السماء تنزل عليهم وتلتهمهم."]]}, {"l": "Rev 20:10", "n": "", "vs": [[10, "ثم يطرح إبليس الذي كان يضللهم، في بحيرة النار والكبريت، حيث الوحش والنبي الدجال. هناك سوف يعذبون نهارا وليلا، إلى أبد الآبدين."]]}, {"l": "Rev 21:8", "n": "", "vs": [[8, "أما الجبناء وغير المؤمنين، والفاسدون والقاتلون والزناة، والمتصلون بالشياطين وعبدة الأصنام وجميع الدجالين، فمصيرهم إلى البحيرة المتقدة بالنار والكبريت، الذي هو الموت الثاني»."]]}, {"l": "Rev 22:15", "n": "", "vs": [[15, "أما في خارج المدينة، فهنالك الكلاب والمتصلون بالشياطين، والزناة والقتلة، وعبدة الأصنام والدجالون ومحبو التدجيل!"]]}], "kwAr": "مصيرهم الهلاك", "noteAr": ""}, {"kw": "whose God", "raw": "Phi_2:21; 1Sa_2:11-16, 1Sa_2:29; Isa_56:10-12; Eze_13:19, Eze_34:3; Mic_3:5, Mic_3:11; Mal_1:12; Luk_12:19, Luk_16:19; Rom_16:18; 1Ti_6:5; 2Ti_3:4; Tit_1:11, Tit_1:12; 2Pe_2:13; Jud_1:12", "note": "", "refs": [{"l": "Phi 2:21", "n": "", "vs": [[21, "فإن الجميع يسعون وراء مصالحهم الخاصة، لا لأجل المسيح يسوع."]]}, {"l": "1Sa 2:11-16", "n": "", "vs": [[11, "ثم رجع ألقانة إلى بيته في الرامة، وظل الصبي يخدم الرب لدى عالي الكاهن."], [12, "أما ابنا عالي فكانا متورطين في الشر لا يعرفان الرب"], [13, "ولا حق الكهنة المتوجب على الشعب. فكان كلما قدم رجل ذبيحة يأتي غلام الكاهن عند طبخ اللحم حاملا بيده خطافا ذا ثلاث شعب."], [14, "فيغرزه في اللحم الذي في المرحضة أو المرجل أو المقلى أو القدر، ويأخذ الكاهن كل ما يعلق بشعب الخطاف. هكذا كانا يعاملان جميع الإسرائيليين القادمين إلى شيلوه."], [15, "كذلك كان خادم الكاهن يأتي إلى ذابح القربان ويقول له قبل إحراق الشحم: «أعط لحما للكاهن حتى يشوى، فإنه لا يقبل منك لحما مطبوخا بل نيئا»."], [16, "فيجيبه الرجل: «ليحرقوا أولا شحم الذبيحة، ثم خذ ما تشتهيه نفسك». فيقول الخادم: «لا، بل أعطني الآن اللحم وإلا آخذه بالرغم عنك»."]]}, {"l": "1Sa 2:29", "n": "", "vs": [[29, "فلماذا تحتقرون ذبيحتي وتقدمتي التي أمرت بها للمسكن، وتفضل ابنيك عني لتكدسوا الشحم على أبدانكم، مما تخيرتموه من قرابين شعبي؟"]]}, {"l": "Isa 56:10-12", "n": "", "vs": [[10, "فإن رقباءهم عمي، وكلهم جهال، وكلاب بكم عاجزون عن النباح، حالمون راقدون مولعون بالنوم."], [11, "هم كلاب نهمة لا تعرف الشبع، ورعاة أيضا مجردون من الفهم، كل مال إلى طريقه طمعا في الربح،"], [12, "قائلين: تعالوا نأتي بالخمر، ونشرب مسكرا حتى الثمالة، فالغد يكون مماثلا لهذا اليوم، بل أعظم منه."]]}, {"l": "Eze 13:19", "n": "", "vs": [[19, "فتدنسنني عند شعبي لقاء حفنة شعير وفتات خبز حتى تمتن نفوسا ما كان يجب أن تموت، ولكي تستحيين نفوسا أخرى لم يكن لها أن تحيا من جراء كذبكن على شعبي السامع للكذب."]]}, {"l": "Eze 34:3", "n": "", "vs": [[3, "إنما أنتم تأكلون الشحم، وترتدون الصوف، وتذبحون الخروف السمين، ولا ترعون الغنم."]]}, {"l": "Mic 3:5", "n": "", "vs": [[5, "وهذا ما يقوله الرب بشأن الأنبياء الذين يضلون شعبه، الذين ينادون قائلين: «سلام» لمن يعطيهم طعاما، ويعلنون الحرب على من لا يلقم أفواههم."]]}, {"l": "Mic 3:11", "n": "", "vs": [[11, "إذ يحكم رؤساؤها بالرشوة، وكهنتها يعلمون بالأجرة ويتعاطى أنبياؤها العرافة لقاء المال، ومع ذلك يدعون الاتكال على الله قائلين: «أليس الرب في وسطنا؟ لذلك لن يصيبنا مكروه»."]]}, {"l": "Mal 1:12", "n": "", "vs": [[12, "أما أنتم فقد دنستموه، إذ قلتم إن مائدة الرب نجسة، وإن طعامها فاسد ومزدرى."]]}, {"l": "Luk 12:19", "n": "", "vs": [[19, "وأقول لنفسي: يانفس، عندك خيرات كثيرة مخزونة لسنين عديدة، فاستريحي وكلي واشربي واطر بي!"]]}, {"l": "Luk 16:19", "n": "", "vs": [[19, "كان هنالك إنسان غني، يلبس الأرجوان وناعم الثياب، ويقيم الولائم المترفة، متنعما كل يوم."]]}, {"l": "Rom 16:18", "n": "", "vs": [[18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."]]}, {"l": "1Ti 6:5", "n": "", "vs": [[5, "وشتى أنواع النزاع بين أناس فاسدي العقول مجردين من الحق، يعتبرون التقوى تجارة."]]}, {"l": "2Ti 3:4", "n": "", "vs": [[4, "خائنين، وقحين، مدعين، محبين للذات أكثر من محبتهم لله،"]]}, {"l": "Tit 1:11", "n": "", "vs": [[11, "هؤلاء يجب أن تسد أفواههم: فهم يخربون بيوتا بجملتها، إذ يعلمون تعاليم يجب ألا تعلم، في سبيل مكسب خسيس."]]}, {"l": "Tit 1:12", "n": "", "vs": [[12, "وقد قال واحد منهم، وهو عندهم نبي خاص بهم: «أهل كريت دائما كذابون، وحوش شرسة، نهمون كسالى»."]]}, {"l": "2Pe 2:13", "n": "", "vs": [[13, "وبذلك ينالون أجرة إثمهم! إنهم يحسبون الانغماس في اللذات طول النهار بهجة عظيمة. فهم أوساخ وعيوب: يتلذذون بالنجاسة ويحاولون خداعكم، فيشتركون معكم في الولائم."]]}, {"l": "Jud 1:12", "n": "", "vs": [[12, "إنهم يشتركون معكم في ولائم المحبة دون خجل، ولكنهم كصخور تعيقكم. لا هم لهم سوى تعليف أنفسهم! إنهم يشبهون غيوما بلا مطر تسوقها الرياح، وأشجارا خريفية بلا ثمر، يقتلعها أصحابها، فتكون قد ماتت مرتين."]]}], "kwAr": "وإلههم بطونهم", "noteAr": ""}, {"kw": "whose glory", "raw": "Psa_52:1; Hos_4:7; Hab_2:15, Hab_2:16; Luk_18:4; 1Co_5:2, 1Co_5:6; 2Co_11:12; Gal_6:13; Jam_4:16; 2Pe_2:18, 2Pe_2:19; Jud_1:13, Jud_1:16; Rev_18:7", "note": "", "refs": [{"l": "Psa 52:1", "n": "", "vs": [[1, "لماذا تتفاخر بالشر أيها الجبار؟ إن رحمة الله تدوم اليوم كله"]]}, {"l": "Hos 4:7", "n": "", "vs": [[7, "وبقدر ما تكاثروا تفاقمت خطيئتهم، لذلك أحول مجدهم إلى عار."]]}, {"l": "Hab 2:15", "n": "", "vs": [[15, "ويل لمن يسقي صاحبه من كأس الغضب إلى أن يسكر لينظر إلى خزيه."]]}, {"l": "Hab 2:16", "n": "", "vs": [[16, "فأنت تشبع خزيا عوض المجد، فاشرب أنت، وترنح، فإن كأس يمين الرب تدور عليك ويجلل العار مجدك."]]}, {"l": "Luk 18:4", "n": "", "vs": [[4, "فظل يرفض طلبها مدة من الزمن. ولكنه بعد ذلك قال في نفسه: حتى لو كنت لا أخاف الله ولا أحترم إنسانا،"]]}, {"l": "1Co 5:2", "n": "", "vs": [[2, "ومع ذلك، فأنتم منتفخون تكبرا، بدلا من أن تنوحوا حتى يستأصل من بينكم مرتكب هذا الفعل!"]]}, {"l": "1Co 5:6", "n": "", "vs": [[6, "إن افتخاركم ليس في محله! ألستم تعلمون أن خميرة صغيرة تخمر العجين كله؟"]]}, {"l": "2Co 11:12", "n": "", "vs": [[12, "ولكن، سأفعل ما أنا فاعله الآن لأسقط حجة الذين يلتمسون حجة تبين أنهم مثلنا في ما يفتخرون به."]]}, {"l": "Gal 6:13", "n": "", "vs": [[13, "فحتى أولئك الذين يختنون، هم أنفسهم، لا يعملون بالشريعة، بل يريدون لكم أن تختنوا ليفتخروا بجسدكم."]]}, {"l": "Jam 4:16", "n": "", "vs": [[16, "وإلا، فإنكم تفتخرون متكبرين. وكل افتخار كهذا، هو افتخار رديء."]]}, {"l": "2Pe 2:18", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."]]}, {"l": "2Pe 2:19", "n": "", "vs": [[19, "يعدون هؤلاء بالحرية، وهم أنفسهم عبيد للفساد! لأن الإنسان يصير عبدا لكل ما يتسلط عليه ويغلبه."]]}, {"l": "Jud 1:13", "n": "", "vs": [[13, "وبأعمالهم المخجلة يفضحون أنفسهم كأمواج في البحر هائجة تقذف الأوساخ. وهم أشبه بنجوم تائهة في الفضاء، مصيرها الظلام الشديد إلى الأبد!"]]}, {"l": "Jud 1:16", "n": "", "vs": [[16, "وهؤلاء المعلمون يتذمرون ويشكون دائما وفيما هم يندفعون وراء شهواتهم، يطلقون ألسنتهم متحدثين بأمور طنانة، ويمدحون من يعجبهم طلبا للمنفعة!"]]}, {"l": "Rev 18:7", "n": "", "vs": [[7, "أنزلوا بها من العذاب والشقاء على قدر ما عظمت نفسها وترفهت. فإنها تقول في نفسها: أنا ملكة على العرش، ولست أرملة، ولن أذوق طعم الحزن."]]}], "kwAr": "ومفخرتهم في عيبتهم", "noteAr": ""}, {"kw": "who", "raw": "Psa_4:6, Psa_4:7, Psa_17:14; Mat_16:23; Rom_8:5-7; 1Co_3:3; 2Pe_2:3", "note": "", "refs": [{"l": "Psa 4:6", "n": "", "vs": [[6, "ما أكثر المتسائلين: «من يرينا خيرا؟» أشرق علينا أيها الرب بنور وجهك."]]}, {"l": "Psa 4:7", "n": "", "vs": [[7, "غرست في قلبي فرحا أعظم من فرح من امتلأت بيوتهم وأجرانهم بالحنطة والخمر الجديدة."]]}, {"l": "Psa 17:14", "n": "", "vs": [[14, "أنقذني بيدك يارب من الناس. من أهل الدنيا الذين نصيبهم هو في هذه الحياة. أنت تملأ بطونهم من خيراتك المخزونة، فيشبع أبناؤهم، ويورثون أولادهم ما يفضل عنهم."]]}, {"l": "Mat 16:23", "n": "", "vs": [[23, "فالتفت يسوع إلى بطرس وقال له: «اغرب من أمامي ياشيطان! أنت عقبة أمامي، لأنك تفكر لا بأمور الله، بل بأمور الناس! »"]]}, {"l": "Rom 8:5-7", "n": "", "vs": [[5, "فإن الذين هم بحسب الجسد يهتمون بأمور الجسد، والذين هم بحسب الروح يهتمون بأمور الروح."], [6, "فاهتمام الجسد هو موت؛ وأما اهتمام الروح فهو حياة وسلام."], [7, "لأن اهتمام الجسد هو عداوة لله، إذ إنه لا يخضع لناموس الله، بل لا يستطيع ذلك."]]}, {"l": "1Co 3:3", "n": "", "vs": [[3, "فإنكم مازلتم جسديين. فمادام بينكم حسد وخصام (وانقسام)، أفلا تكونون جسديين وتسلكون وفقا للبشر؟"]]}, {"l": "2Pe 2:3", "n": "", "vs": [[3, "وبدافع الطمع، يتاجرون بكم بالأقوال المحرفة المزخرفة."]]}], "kwAr": "وفكرهم منصرف إلى الأمور الأرضية", "noteAr": ""}], "arS": [["الذين ", []], ["مصيرهم", ["G5056"]], [" ", []], ["الهلاك", ["G684"]], ["، ", []], ["وإلههم", ["G2316"]], [" ", []], ["بطونهم", ["G2836"]], ["، ", []], ["ومفخرتهم", ["G1391"]], [" في ", []], ["عيبتهم", ["G152"]], ["، ", []], ["وفكرهم", ["G5426"]], [" منصرف إلى الأمور ", []], ["الأرضية", ["G1919"]], [".", []]]}, {"c": 3, "v": 20, "text": "أما نحن، فإن وطننا في السماوات التي منها ننتظر عودة مخلصنا الرب يسوع المسيح،", "groups": [{"kw": "our", "raw": "Phi_1:18-21; Psa_16:11, Psa_17:15, Psa_73:24-26; Pro_15:24; Mat_6:19-21, Mat_19:21; Luk_12:21, Luk_12:32-34, Luk_14:14; 2Co_4:18, 2Co_5:1, 2Co_5:8; Eph_2:6, Eph_2:19; Col_1:5, Col_3:1-3; Heb_10:34, Heb_10:35; 1Pe_1:3, 1Pe_1:4", "note": "", "refs": [{"l": "Phi 1:18-21", "n": "", "vs": [[18, "فماذا إذن؟ مهما يكن، وفي أي حال، فإن المسيح ينادى به، سواء أكان بذريعة أم بحق. وبهذا أنا أفرح وسأفرح بعد!"], [19, "فإنني أعلم أن هذا الأمر سيؤدي إلى الإفراج عني، بفضل صلاتكم وبمعونة روح يسوع المسيح؛"], [20, "وفقا لما أتوقعه وأرجوه: أني لن أفشل في شيء، بل في كل جرأة وكما في كل حين فكذلك الآن أيضا، يتعظم المسيح في جسدي، سواء أكان بالحياة أم بالموت."], [21, "فالحياة عندي هي المسيح، والموت ربح لي."]]}, {"l": "Psa 16:11", "n": "", "vs": [[11, "هديتني سبل الحياة: فإن ملء البهجة في حضرتك، وفي يمينك مسرات أبدية."]]}, {"l": "Psa 17:15", "n": "", "vs": [[15, "أما أنا فبالبر أشاهد وجهك. أشبع، إذا استيقظت، من بهاء طلعتك."]]}, {"l": "Psa 73:24-26", "n": "", "vs": [[24, "تهديني بمشورتك، وبعد ذلك تأخذني إلى المجد."], [25, "من لي في السماء غيرك؟ ولست أبغي في الأرض أحدا معك."], [26, "إن جسدي وقلبي يفنيان، أما الله فهو صخرة قلبي ونصيبي إلى الدهر."]]}, {"l": "Pro 15:24", "n": "", "vs": [[24, "طريق الإنسان الحكيم ترتقي به صعودا نحو الحياة، لكي يتفادى الهاوية من تحت."]]}, {"l": "Mat 6:19-21", "n": "", "vs": [[19, "لا تكنزوا لكم كنوزا على الأرض، حيث يفسدها السوس والصدأ، وينقب عنها اللصوص ويسرقون."], [20, "بل اكنزوا لكم كنوزا في السماء، حيث لا يفسدها سوس ولا ينقب عنها لصوص ولا يسرقون."], [21, "فحيث يكون كنزك، هناك أيضا يكون قلبك !"]]}, {"l": "Mat 19:21", "n": "", "vs": [[21, "فأجابه يسوع: «إن أردت أن تكون كاملا، فاذهب وبع كل ما تملك، ووزع على الفقراء، فيكون لك كنز في السماوات. وتعال اتبعني!»"]]}, {"l": "Luk 12:21", "n": "", "vs": [[21, "هذه هي حالة من يخزن الكنوز لنفسه ولا يكون غنيا عند الله!»"]]}, {"l": "Luk 12:32-34", "n": "", "vs": [[32, "لا تخافوا، أيها القطيع الصغير، لأن أباكم قد سر أن يعطيكم الملكوت."], [33, "بيعوا ما تملكون وأعطوا صدقة، واجعلوا لكم أكياسا لا تبلى، كنزا في السماوات لا ينفد، حيث لا يقترب لص ولا يفسد سوس."], [34, "لأنه حيث يكون كنزكم، يكون قلبكم أيضا."]]}, {"l": "Luk 14:14", "n": "", "vs": [[14, "فتكون مباركا لأن هؤلاء لا يملكون ما يكافئونك به، فإنك تكافأ في قيامة الأبرار»."]]}, {"l": "2Co 4:18", "n": "", "vs": [[18, "إذ نرفع أنظارنا عن الأمور المنظورة ونثبتها على الأمور غير المنظورة. فإن الأمور المنظورة إنما هي إلى حين؛ وأما غير المنظورة فهي أبدية."]]}, {"l": "2Co 5:1", "n": "", "vs": [[1, "فإننا نعلم أنه متى تهدمت خيمتنا الأرضية التي نسكنها الآن، يكون لنا بناء من الله: بيت لم تصنعه أيدي البشر، أبدي في السماوات."]]}, {"l": "2Co 5:8", "n": "", "vs": [[8, "فنحن واثقون إذن، وراضون بالأحرى أن نكون مغتربين عن الجسد ومقيمين عند الرب."]]}, {"l": "Eph 2:6", "n": "", "vs": [[6, "وأقامنا معه وأجلسنا معه في الأماكن السماوية في المسيح يسوع."]]}, {"l": "Eph 2:19", "n": "", "vs": [[19, "إذن، لستم غرباء وأجانب بعد الآن، بل أنتم رعية مع القديسين وأعضاء في عائلة الله،"]]}, {"l": "Col 1:5", "n": "", "vs": [[5, "بسبب الرجاء المحفوظ لكم في السماوات، الرجاء الذي سمعتم به سابقا في كلمة الحق التي في الإنجيل"]]}, {"l": "Col 3:1-3", "n": "", "vs": [[1, "فبما أنكم قد قمتم مع المسيح، فاسعوا إلى الأمور التي في العلى، حيث المسيح جالس عن يمين الله."], [2, "احصروا اهتمامكم بالأمور التي في العلى، لا بالأمور الأرضية."], [3, "فإنكم قد متم، وحياتكم مستورة مع المسيح في الله."]]}, {"l": "Heb 10:34", "n": "", "vs": [[34, "فقد تعاطفتم مع المسجونين، كما تقبلتم نهب ممتلكاتكم بفرح، علما منكم بأن لكم في السماء ثروة أفضل وأبقى."]]}, {"l": "Heb 10:35", "n": "", "vs": [[35, "إذن، لا تتخلوا عن ثقتكم بالرب. فإن لها مكافأة عظيمة."]]}, {"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}, {"l": "1Pe 1:4", "n": "", "vs": [[4, "وإرثا لا يفنى ولا يفسد ولا يزول،"]]}], "kwAr": "أما نحن", "noteAr": ""}, {"kw": "conversation", "raw": "Gr. Isa_26:1, Isa_26:2; Gal_4:26; Eph_2:19; Heb_12:22; Rev. 21:10-27", "note": "", "refs": [{"l": "Isa 26:1", "n": "", "vs": [[1, "في ذلك اليوم يتردد هذا النشيد في أرض يهوذا: «لنا مدينة منيعة، يجعل الرب الخلاص أسوارا ومترسة."]]}, {"l": "Isa 26:2", "n": "", "vs": [[2, "افتحوا الأبواب لتدخل الأمة البارة التي حافظت على الأمانة."]]}, {"l": "Gal 4:26", "n": "", "vs": [[26, "أما الثاني، فرمزه الحرة التي تمثل أورشليم السماوية التي هي أمنا."]]}, {"l": "Eph 2:19", "n": "", "vs": [[19, "إذن، لستم غرباء وأجانب بعد الآن، بل أنتم رعية مع القديسين وأعضاء في عائلة الله،"]]}, {"l": "Heb 12:22", "n": "", "vs": [[22, "ولكنكم قد اقتربتم إلى جبل صهيون، إلى مدينة الله الحي، أورشليم السماوية. بل تقدمتم إلى حفلة يجتمع فيها عدد لا يحصى من الملائكة،"]]}, {"l": "Rev 21:10-27", "n": "", "vs": [[10, "وأخذني بالروح إلى قمة جبل ضخم عال، وأراني المدينة المقدسة أورشليم نازلة من السماء من عند الله"], [11, "ولها مجد الله، وهي تتلألأ كالأحجار الكريمة، وكأنها من حجر اليشب البلوري!"], [12, "لها سور ضخم عال واثنا عشر بابا يحرسها اثنا عشر ملاكا، وقد كتبت عليها أسماء أسباط إسرائيل الاثني عشر؛"], [13, "إلى الشرق ثلاثة أبواب؛ وإلى الشمال ثلاثة أبواب، وإلى الجنوب ثلاثة أبواب؛ وإلى الغرب ثلاثة أبواب."], [14, "ويقوم سور المدينة على اثنتي عشرة دعامة كتبت عليها أسماء رسل الحمل الاثني عشر."], [15, "وكان الملاك الذي يكلمني يمسك قصبة من الذهب ليقيس بها المدينة وأبوابها وسورها."], [16, "وكانت أرض المدينة مربعة، طولها يساوي عرضها، فلما قاسها بالقصبة تبين أن ضلعها يساوي ألفين وأربعمئة كيلومتر، وهي متساوية الطول والعرض والارتفاع."], [17, "ثم قاس السور، فتبين أنه يساوي مئة وأربعا وأربعين ذراعا، وكان الملاك يستعمل قياسا يعادل ذراع إنسان."], [18, "كانت المدينة مبنية من ذهب خالص شفاف كالزجاج النقي. أما سورها فمن اليشب،"], [19, "وهو قائم على اثنتي عشرة دعامة مرصعة بالأحجار الكريمة: كانت الدعامة الأولى من اليشب؛ والثانية من الياقوت الأزرق؛ والثالثة من العقيق الأبيض؛ والرابعة من الزمرد الذبابي؛"], [20, "والخامسة من الجزع العقيقي؛ والسادسة من العقيق الأحمر؛ والسابعة من الزبرجد؛ والثامنة من الزمرد السلقي؛ والتاسعة من الياقوت الأصفر، والعاشرة من العقيق الأخضر؛ والحادية عشرة من الأسمانجوني؛ والثانية عشرة من الجمشت."], [21, "أما الأبواب الاثنا عشر فهي اثنتا عشرة لؤلؤة: كل باب لؤلؤة واحدة. وساحة المدينة من ذهب خالص كالزجاج الشفاف."], [22, "ولم أجد في المدينة هيكلا، لأن الرب الإله القادر على كل شيء والحمل هما هيكلها."], [23, "ولم تكن المدينة في حاجة إلى نور الشمس أو القمر، لأن مجد الله ينيرها، والحمل مصباحها."], [24, "ستسير بنورها الأمم، ويأتيها ملوك الأرض بكنوزهم."], [25, "ولا تقفل أبوابها أبدا طول النهار، لأن الليل لا يأتي عليها!"], [26, "وستحمل إليها كنوز الأمم وأمجادها."], [27, "ولن يدخلها شيء نجس، ولا الذين يعملون القبائح ويدجلون، بل فقط الذين كتبت أسماؤهم في سجل الحياة للحمل!"]]}], "kwAr": "وطننا في السماوات", "noteAr": ""}, {"kw": "from", "raw": "Act_1:11; 1Th_4:16; 2Th_1:7, 2Th_1:8; Rev_1:7", "note": "", "refs": [{"l": "Act 1:11", "n": "", "vs": [[11, "وقالا لهم: «أيها الجليليون، لماذا تقفون ناظرين إلى السماء؟ إن يسوع، هذا الذي ارتفع عنكم إلى السماء، سيعود منها مثلما رأيتموه منطلقا إليها!»"]]}, {"l": "1Th 4:16", "n": "", "vs": [[16, "لأن الرب نفسه سينزل من السماء حالما يدوي أمر بالتجمع، وينادي رئيس ملائكة، ويبوق في بوق إلهي، عندئذ يقوم الأموات في المسيح أولا."]]}, {"l": "2Th 1:7", "n": "", "vs": [[7, "وأن يكافئكم، أنتم الذين تتضايقون، كما يكافئنا نحن، بالراحة لدى ظهور الرب يسوع علنا من السماء، ومعه ملائكة قدرته،"]]}, {"l": "2Th 1:8", "n": "", "vs": [[8, "وسط نار ملتهبة، منتقما إلى التمام من غير العارفين لله وغير المطيعين لإنجيل ربنا يسوع."]]}, {"l": "Rev 1:7", "n": "", "vs": [[7, "ها هو آت مع السحاب! ستراه عيون الجميع، حتى أولئك الذين طعنوه، وتنوح بسببه قبائل الأرض كلها! نعم، آمين!"]]}], "kwAr": "التي منها", "noteAr": ""}, {"kw": "we look", "raw": "Phi_1:10; 1Co_1:7; 1Th_1:10; 2Ti_4:8; Tit_2:13; Heb_9:28; 2Pe_3:12-14", "note": "", "refs": [{"l": "Phi 1:10", "n": "", "vs": [[10, "لكي تستحسنوا الأمور الممتازة، حتى تكونوا طاهرين وخالين من العثرات إلى يوم المسيح،"]]}, {"l": "1Co 1:7", "n": "", "vs": [[7, "حتى إنكم لا تحتاجون بعد إلى أية موهبة فيما تتوقعون ظهور ربنا يسوع المسيح علنا."]]}, {"l": "1Th 1:10", "n": "", "vs": [[10, "وتنتظروا من السماوات ابنه الذي أقامه من بين الأموات، يسوع مخلصنا من الغضب الآتي."]]}, {"l": "2Ti 4:8", "n": "", "vs": [[8, "إنما ينتظرني الآن إكليل البر المحفوظ لي، والذي سيهبه لي الرب الديان العادل في ذلك اليوم؛ ولن يوهب لي وحدي، بل أيضا لجميع الذين يحبون ظهوره."]]}, {"l": "Tit 2:13", "n": "", "vs": [[13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"]]}, {"l": "Heb 9:28", "n": "", "vs": [[28, "كذلك المسيح أيضا: مات مرة واحدة حاملا خطايا كثيرين، مقربا نفسه (لله) عوضا عنهم. ولا بد أن يعود إلى الظهور. لا ليعالج الخطايا، بل ليحقق الخلاص النهائي لجميع منتظريه!"]]}, {"l": "2Pe 3:12-14", "n": "", "vs": [[12, "منتظرين «يوم الله» الأبدي وطالبين حلوله بسرعة. ففي ذلك اليوم، تنحل السماوات ملتهبة، وتذوب العناصر محترقة."], [13, "إلا أننا، وفقا لوعد الرب، ننتظر سماوات جديدة وأرضا جديدة، حيث يسكن البر."], [14, "فبينما تنتظرون إتمام هذا الوعد، أيها الأحباء، اجتهدوا أن يجدكم الرب في سلام، خالين من الدنس والعيب."]]}], "kwAr": "ننتظر عودة مخلصنا", "noteAr": ""}], "arS": [["أما ", []], ["نحن", ["G2257"]], ["، فإن ", []], ["وطننا", ["G4175"]], [" في ", []], ["السماوات", ["G3772"]], [" التي منها ", []], ["ننتظر", ["G553"]], [" عودة ", []], ["مخلصنا", ["G4990"]], [" ", []], ["الرب", ["G2962"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], ["،", []]]}, {"c": 3, "v": 21, "text": "الذي سيحول جسدنا الوضيع إلى صورة مطابقة لجسده المجيد، وفقا لعمل قدرته على إخضاع كل شيء لنفسه.", "groups": [{"kw": "shall", "raw": "1Co_15:42-44, 1Co_15:48-54", "note": "", "refs": [{"l": "1Co 15:42-44", "n": "", "vs": [[42, "وهكذا الحال في قيامة الأموات: يزرع الجسد منحلا، ويقام غير منحل،"], [43, "يزرع مهانا، ويقام مجيدا، يزرع ضعيفا، ويقام قويا،"], [44, "يزرع جسما ماديا، ويقام جسما روحيا. فبما أن هناك جسما ماديا، فهناك أيضا جسم روحي."]]}, {"l": "1Co 15:48-54", "n": "", "vs": [[48, "فعلى مثال المصنوع من التراب، سيكون المصنوعون من التراب، وعلى مثال السماوي سيكون السماويون."], [49, "ومثلما حملنا صورة المصنوع من التراب، سنحمل أيضا صورة السماوي."], [50, "ثم إني، أيها الإخوة، أؤكد لكم أن الأجسام ذات اللحم والدم لا يمكنها أن ترث ملكوت الله، كما لا يمكن للمنحل أن يرث غير المنحل."], [51, "وها أنا أكشف لكم سرا: إننا لن نرقد جميعا، ولكننا سنتغير جميعا،"], [52, "في لحظة، بل في طرفة عين عندما ينفخ في البوق الأخير. فإنه سوف ينفخ في البوق، فيقوم الأموات بلا انحلال. وأما نحن، فسنتغير."], [53, "فلابد لهذا الجسم القابل للانحلال أن يلبس عدم انحلال، ولهذا الفاني أن يلبس خلودا."], [54, "وبعد أن يلبس هذا المنحل عدم انحلال، وهذا الفاني خلودا، تتم الكلمة التي قد كتبت: «ابتلع الموت في النصر!»"]]}], "kwAr": "الذي سيحول جسدنا الوضيع", "noteAr": ""}, {"kw": "that", "raw": "Mat_17:2; Col_3:4; 1Jo_3:2; Rev_1:13-20", "note": "", "refs": [{"l": "Mat 17:2", "n": "", "vs": [[2, "وتجلى أمامهم، فشع وجهه كالشمس، وصارت ثيابه بيضاء كالنور."]]}, {"l": "Col 3:4", "n": "", "vs": [[4, "فعندما يظهر المسيح، وهو حياتنا، عندئذ تظهرون أنتم أيضا معه في المجد."]]}, {"l": "1Jo 3:2", "n": "", "vs": [[2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"]]}, {"l": "Rev 1:13-20", "n": "", "vs": [[13, "وعندما التفت نحو الصوت، رأيت كائنا يشبه ابن الإنسان، يقف وسط سبع منائر من ذهب، ويرتدي ثوبا طويلا إلى الرجلين، يلف صدره حزام من ذهب."], [14, "شعر رأسه ناصع البياض كالصوف أو الثلج، وعيناه كشعلة ملتهبة."], [15, "رجلاه تلمعان كأنهما نحاس نقي مصقول بالنار، وصوته يدوي كصوت شلال غزير،"], [16, "ووجهه يتوهج بالنور كشمس الظهيرة. وكان في يده اليمنى سبعة نجوم، ومن فمه يخرج سيف قاطع ذو حدين."], [17, "فلما رأيته ارتميت عند قدميه كالميت، فلمسني بيده اليمنى وقال: «لا تخف! أنا الأول والآخر،"], [18, "أنا الحي. كنت ميتا، ولكن ها أنا حي إلى أبد الآبدين. ولي مفاتيح الموت والهاوية."], [19, "دون ما رأيته، وما يحدث الآن، وما يوشك أن يحدث بعده."], [20, "وهذا سر النجوم السبعة التي رأيتها في يميني، ومنائر الذهب السبع: النجوم السبعة تمثل ملائكة الكنائس السبع، أما المنائر السبع فهي تمثل الكنائس السبع نفسها."]]}], "kwAr": "مطابقة لجسده المجيد", "noteAr": ""}, {"kw": "the working", "raw": "Isa_25:8, Isa_26:19; Hos_13:14; Mat_22:29, Mat_28:18; Joh_5:25-29, Joh_11:24-26; 1Co_15:25-27, 1Co_15:53-56; Eph_1:19, Eph_1:20; Rev_1:8, Rev_1:18, Rev_20:11-15", "note": "", "refs": [{"l": "Isa 25:8", "n": "", "vs": [[8, "ويبتلع الموت إلى الأبد، ويمسح السيد الرب الدموع المنهمرة على الوجوه، ويزيل عار شعبه من كل الأرض. هذا ما تكلم به الرب."]]}, {"l": "Isa 26:19", "n": "", "vs": [[19, "ولكن أمواتك يحيون، وتقوم أجسادهم فيا سكان التراب استيقظوا واشدوا بفرح لأن طلك هو ندى متلأليء، جعلته يهطل على أرض الأشباح."]]}, {"l": "Hos 13:14", "n": "", "vs": [[14, "هل أفتديهم من قوة الهاوية؟ هل أنجيهم من الموت؟ أين أوبئتك ياموت؟ أين هلاكك ياهاوية؟ قد احتجبت الرحمة عن عيني."]]}, {"l": "Mat 22:29", "n": "", "vs": [[29, "فرد عليهم يسوع قائلا: «أنتم في ضلال لأنكم لا تفهمون الكتاب ولا قدرة الله."]]}, {"l": "Mat 28:18", "n": "", "vs": [[18, "فتقدم يسوع وكلمهم قائلا: «دفع إلي كل سلطان في السماء وعلى الأرض."]]}, {"l": "Joh 5:25-29", "n": "", "vs": [[25, "الحق الحق أقول لكم: إن الساعة التي يسمع فيها الأموات صوت ابن الله ستأتي بل هي الآن والذين يسمعونه يحيون."], [26, "لأنه كما أن للآب حياة في ذاته، فقد أعطى الابن أيضا أن تكون له حياة في ذاته،"], [27, "وأعطاه سلطة أن يدين، لأنه ابن الإنسان."], [28, "لا تتعجبوا من هذا: فسوف تأتي ساعة يسمع فيها جميع من في القبور صوته،"], [29, "فيخرجون منها: فالذين عملوا الصالحات يخرجون في القيامة المؤدية إلى الحياة، وأما الذين عملوا السيئات ففي القيامة المؤدية إلى الدينونة."]]}, {"l": "Joh 11:24-26", "n": "", "vs": [[24, "قالت مرثا: «أعرف أنه سيقوم في القيامة، في اليوم الأخير!»"], [25, "فرد يسوع: «أنا هو القيامة والحياة. من آمن بي، وإن مات فسيحيا."], [26, "ومن كان حيا وآمن بي فلن يموت إلى الأبد. أتؤمنين بهذا؟»"]]}, {"l": "1Co 15:25-27", "n": "", "vs": [[25, "فإنه لابد أن يملك «إلى أن يضع جميع الأعداء تحت قدميه»."], [26, "وآخر عدو يباد هو الموت. ذلك بأنه قد «أخضع كل شيء تحت قدميه»."], [27, "ولكن، في قوله إن كل شيء قد أخضع، فمن الواضح أنه يستثني الله الذي جعل كل شيء خاضعا للابن."]]}, {"l": "1Co 15:53-56", "n": "", "vs": [[53, "فلابد لهذا الجسم القابل للانحلال أن يلبس عدم انحلال، ولهذا الفاني أن يلبس خلودا."], [54, "وبعد أن يلبس هذا المنحل عدم انحلال، وهذا الفاني خلودا، تتم الكلمة التي قد كتبت: «ابتلع الموت في النصر!»"], [55, "فأين، ياموت، شوكتك؟ وأين، ياموت نصرك؟"], [56, "وشوكة الموت إنما هي الخطيئة، وقوة الخطيئة إنما هي الشريعة."]]}, {"l": "Eph 1:19", "n": "", "vs": [[19, "وما هي عظمة قدرته الفائقة المعلنة لنا نحن المؤمنين، بحسب عمل اقتدار قوته"]]}, {"l": "Eph 1:20", "n": "", "vs": [[20, "الذي عمله في المسيح، بإقامته له من بين الأموات. وقد أجلسه عن يمينه في الأماكن السماوية،"]]}, {"l": "Rev 1:8", "n": "", "vs": [[8, "«أنا الألف والياء» (البداية والنهاية). هذا يقوله الرب الإله الكائن والذي كان والذي سيأتي، القادر على كل شيء."]]}, {"l": "Rev 1:18", "n": "", "vs": [[18, "أنا الحي. كنت ميتا، ولكن ها أنا حي إلى أبد الآبدين. ولي مفاتيح الموت والهاوية."]]}, {"l": "Rev 20:11-15", "n": "", "vs": [[11, "ثم رأيت عرشا عظيما أبيض هربت السماء والأرض من أمام الجالس عليه، فلم يبق لهما مكان."], [12, "ورأيت الأموات، كبارا وصغارا، واقفين قدام العرش. وفتحت الكتب، ثم فتح كتاب آخر هو سجل الحياة، ودين الأموات بحسب ما هو مدون في تلك الكتب، كل واحد حسب أعماله."], [13, "وسلم البحر من فيه من الأموات، وسلم الموت وهاوية الموتى الأموات الذين فيهما، وحكم على كل واحد بحسب أعماله."], [14, "وطرح الموت وهاوية الموتى في بحيرة النار، الذي هو الموت الثاني."], [15, "وكل من لم يوجد اسمه مكتوبا في سجل الحياة طرح في بحيرة النار!"]]}], "kwAr": "وفقا لعمل قدرته", "noteAr": ""}], "arS": [["الذي ", []], ["سيحول", ["G3345"]], [" ", []], ["جسدنا", ["G4983", "G2257"]], [" ", []], ["الوضيع", ["G5014"]], [" إلى صورة ", []], ["مطابقة", ["G4832"]], [" ", []], ["لجسده", ["G4983"]], [" ", []], ["المجيد", ["G1391"]], ["، وفقا ", []], ["لعمل", ["G1753"]], [" ", []], ["قدرته", ["G1410"]], [" على ", []], ["إخضاع", ["G5293"]], [" ", []], ["كل شيء", ["G3956"]], [" ", []], ["لنفسه", ["G1438"]], [".", []]]}, {"c": 4, "v": 1, "text": "إذن، ياإخوتي الأحباء والمشتاق إليهم، يافرحي وإكليلي، هكذا اثبتوا في الرب أيها الأحباء.", "groups": [{"kw": "Therefore", "raw": "Phi_3:20,Phi_3:21; 2Pe_3:11-14", "note": "", "refs": [{"l": "Phi 3:20", "n": "", "vs": [[20, "أما نحن، فإن وطننا في السماوات التي منها ننتظر عودة مخلصنا الرب يسوع المسيح،"]]}, {"l": "Phi 3:21", "n": "", "vs": [[21, "الذي سيحول جسدنا الوضيع إلى صورة مطابقة لجسده المجيد، وفقا لعمل قدرته على إخضاع كل شيء لنفسه."]]}, {"l": "2Pe 3:11-14", "n": "", "vs": [[11, "ومادامت هذه الأشياء جميعا ستنحل، فكيف يجب أن تكونوا أنتم أصحاب سلوك مقدس يتصف بالتقوى،"], [12, "منتظرين «يوم الله» الأبدي وطالبين حلوله بسرعة. ففي ذلك اليوم، تنحل السماوات ملتهبة، وتذوب العناصر محترقة."], [13, "إلا أننا، وفقا لوعد الرب، ننتظر سماوات جديدة وأرضا جديدة، حيث يسكن البر."], [14, "فبينما تنتظرون إتمام هذا الوعد، أيها الأحباء، اجتهدوا أن يجدكم الرب في سلام، خالين من الدنس والعيب."]]}], "kwAr": "إذن", "noteAr": ""}, {"kw": "and", "raw": "Phi_1:8, Phi_2:26", "note": "", "refs": [{"l": "Phi 1:8", "n": "", "vs": [[8, "فإن الله شاهد لي كيف أحن إليكم جميعا في عواطف المسيح يسوع."]]}, {"l": "Phi 2:26", "n": "", "vs": [[26, "إذ كان مشتاقا إليكم جميعا، ومكتئبا لسماعكم بمرضه."]]}], "kwAr": "ياإخوتي الأحباء والمشتاق إليهم", "noteAr": ""}, {"kw": "my joy", "raw": "Phi_2:16; 2Co_1:14; 1Th_2:19, 1Th_2:20, 1Th_3:9", "note": "", "refs": [{"l": "Phi 2:16", "n": "", "vs": [[16, "حاملين كلمة الحياة، لتكونوا في يوم المسيح موضع فخر بأني ما سعيت باطلا ولا اجتهدت عبثا."]]}, {"l": "2Co 1:14", "n": "", "vs": [[14, "كما قد فهمتمونا فهما جزئيا، أننا سنكون فخرا لكم، مثلما أنتم فخر لنا، في يوم ربنا يسوع."]]}, {"l": "1Th 2:19", "n": "", "vs": [[19, "فما هو رجاؤنا أو فرحنا أو إكليل افتخارنا أمام ربنا يسوع عند عودته؟ أليس أنتم؟ بلى،"]]}, {"l": "1Th 2:20", "n": "", "vs": [[20, "لأنكم فخرنا وفرحنا."]]}, {"l": "1Th 3:9", "n": "", "vs": [[9, "فأي شكر نستطيع أن نؤديه إلى الله عوضا عنكم من أجل كل ما نبتهج به من الفرح بسببكم أمام إلهنا،"]]}], "kwAr": "يافرحي وإكليلي", "noteAr": ""}, {"kw": "so", "raw": "Phi_1:27; Psa_27:14, Psa_125:1; Mat_10:22; Joh_8:31, Joh_15:3, Joh_15:4; Act_2:42, Act_11:23; Act_14:22; Rom_2:7; 1Co_15:58, 1Co_16:13; Gal_5:1; Eph_6:10-18; Col_4:12; 1Th_3:8, 1Th_3:13; 2Th_2:15; 2Ti_2:1; Heb_3:14, Heb_4:14, Heb_10:23, Heb_10:35, Heb_10:36; 2Pe_3:17; Jud_1:20,Jud_1:21, Jud_1:24, Jud_1:25; Rev_3:10,Rev_3:11", "note": "", "refs": [{"l": "Phi 1:27", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"]]}, {"l": "Psa 27:14", "n": "", "vs": [[14, "انتظر الرب. تقو وليتشجع قلبك. وانتظر الرب دائما."]]}, {"l": "Psa 125:1", "n": "", "vs": [[1, "الواثقون بالرب هم مثل جبل صهيون الراسخ الذي لا يتزعزع إلى الأبد."]]}, {"l": "Mat 10:22", "n": "", "vs": [[22, "وتكونون مكروهين لدى الجميع من أجل اسمي. ولكن من يثبت إلى النهاية، هو الذي يخلص."]]}, {"l": "Joh 8:31", "n": "", "vs": [[31, "فقال لليهود الذين آمنوا به: «إن ثبتم في كلمتي، كنتم حقا تلاميذي."]]}, {"l": "Joh 15:3", "n": "", "vs": [[3, "أنتم الآن أنقياء بسبب الكلمة التي خاطبتكم بها."]]}, {"l": "Joh 15:4", "n": "", "vs": [[4, "فاثبتوا في وأنا فيكم. كما أن الغصن لا يقدر أن ينتج ثمرا إلا إذا ثبت في الكرمة؛ فكذلك أنتم، إلا إذا ثبتم في."]]}, {"l": "Act 2:42", "n": "", "vs": [[42, "وكان الجميع يداومون على تلقي تعليم الرسل، وعلى حياة الشركة، وكسر الخبز، والصلوات."]]}, {"l": "Act 11:23", "n": "", "vs": [[23, "فلما وصل ورأى النعمة التي منحها الله ، امتلأ فرحا، وحث الجميع على الثبات في الرب بعزم القلب."]]}, {"l": "Act 14:22", "n": "", "vs": [[22, "وفي هذه الأماكن كلها كانا يشددان عزيمة التلاميذ، ويحثانهم على الثبات في الإيمان، مؤكدين لهم أن دخول ملكوت الله يقتضي أن نقاسي صعوبات كثيرة."]]}, {"l": "Rom 2:7", "n": "", "vs": [[7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"]]}, {"l": "1Co 15:58", "n": "", "vs": [[58, "إذن، ياإخوتي الأحباء، كونوا راسخين غير متزحزحين، كثيري الاجتهاد في عمل الرب دائما، عالمين أن جهدكم في الرب ليس عبثا!"]]}, {"l": "1Co 16:13", "n": "", "vs": [[13, "كونوا متيقظين حذرين. اثبتوا في الإيمان. كونوا رجالا. كونوا أقوياء."]]}, {"l": "Gal 5:1", "n": "", "vs": [[1, "إن المسيح قد حررنا وأطلقنا في سبيل الحرية. فاثبتوا إذن، ولا تعودوا إلى الارتباك بنير العبودية."]]}, {"l": "Eph 6:10-18", "n": "", "vs": [[10, "وختاما، تشددوا في الرب وفي قدرة قوته."], [11, "البسوا سلاح الله الكامل، لتتمكنوا من الصمود في وجه مكايد إبليس."], [12, "فإن حربنا ليست ضد ذوي اللحم والدم، بل ضد الرئاسات، ضد السلطات، ضد أسياد العالم حكام هذا الظلام، ضد قوى الشر الروحية في الأماكن السماوية."], [13, "لذلك اتخذوا سلاح الله الكامل، لتتمكنوا من المقاومة في يوم الشر، ومن الصمود أيضا بعد تحقيق كل هدف."], [14, "فاصمدوا إذن بعد أن تتخذوا الحق حزاما لأوساطكم، والبر درعا لصدوركم،"], [15, "والاستعداد لنشر بشارة السلام حذاء لأقدامكم."], [16, "وفوق هذا كله، احملوا الإيمان ترسا به تقدرون أن تطفئوا جميع سهام الشرير المشتعلة."], [17, "واتخذوا الخلاص خوذة للرأس، وكلمة الله سيف الروح."], [18, "كونوا مصلين في كل حال، بكل صلاة وطلبة في الروح، وساهرين لهذا الغرض عينه مواظبين تماما على جميع الطلبات لأجل القديسين جميعا،"]]}, {"l": "Col 4:12", "n": "", "vs": [[12, "يسلم عليكم أبفراس الذي هو منكم، وهو عبد للمسيح يسوع، يجاهد كل حين لأجلكم في الصلوات لتثبتوا كاملين ولكم تمام اليقين من جهة مشيئة الله كلها."]]}, {"l": "1Th 3:8", "n": "", "vs": [[8, "فقد طابت لنا الحياة مادمتم ثابتين في الرب!"]]}, {"l": "1Th 3:13", "n": "", "vs": [[13, "حتى تتثبت قلوبكم بغير لوم في القداسة أمام إلهنا وأبينا عندما يظهر ربنا يسوع عائدا مع جميع قديسيه."]]}, {"l": "2Th 2:15", "n": "", "vs": [[15, "فاثبتوا إذن، أيها الإخوة، وتمسكوا بالتعاليم التي تلقيتم منا، سواء كان بالكلام أم برسالتنا."]]}, {"l": "2Ti 2:1", "n": "", "vs": [[1, "وأنت ياولدي، فكن قويا في النعمة التي في المسيح يسوع."]]}, {"l": "Heb 3:14", "n": "", "vs": [[14, "فإن تمسكنا دائما بالثقة التي انطلقنا بها في البداية، وأبقيناها ثابتة إلى النهاية، نكون مشاركين للمسيح."]]}, {"l": "Heb 4:14", "n": "", "vs": [[14, "فمادام لنا رئيس كهنتنا العظيم الذي ارتفع مجتازا السماوات، وهو يسوع ابن الله، فلنتمسك دائما بالاعتراف به."]]}, {"l": "Heb 10:23", "n": "", "vs": [[23, "ولنتمسك دائما بالرجاء الذي نعترف به، دون أن نشك في أنه سيتحقق، لأن الذي وعدنا بتحقيقه، هو أمين وصادق."]]}, {"l": "Heb 10:35", "n": "", "vs": [[35, "إذن، لا تتخلوا عن ثقتكم بالرب. فإن لها مكافأة عظيمة."]]}, {"l": "Heb 10:36", "n": "", "vs": [[36, "إنكم تحتاجون إلى الصبر لتعملوا إرادة الله، فتنالوا البركة التي وعدتم بها."]]}, {"l": "2Pe 3:17", "n": "", "vs": [[17, "أما أنتم أيها الأحباء، فإذ قد تنبهتم إلى الخطر قبل حدوثه، احذروا أن تسقطوا عن ثباتكم بالانجراف وراء ضلال الأشرار."]]}, {"l": "Jud 1:20", "n": "", "vs": [[20, "وأما أنتم أيها الأحباء، فابنوا أنفسكم على إيمانكم الأقدس، وصلوا دائما في الروح القدس."]]}, {"l": "Jud 1:21", "n": "", "vs": [[21, "واحفظوا أنفسكم في محبة الله، منتظرين رحمة ربنا يسوع المسيح إذ يعود ويأخذكم لتحيوا معه إلى الأبد."]]}, {"l": "Jud 1:24", "n": "", "vs": [[24, "وللقادر أن يحرسكم من السقوط حتى يوصلكم إلى المثول أمامه في المجد مبتهجين ولا عيب فيكم …"]]}, {"l": "Jud 1:25", "n": "", "vs": [[25, "لله الواحد، مخلصنا بيسوع المسيح ربنا ... المجد والجلال والقدرة والسلطة، من قبل أن كان الزمان، والآن وطوال الأزمان آمين!"]]}, {"l": "Rev 3:10", "n": "", "vs": [[10, "ولأنك حفظت كلمتي وصبرت، فسأحفظك أنا أيضا من ساعة التجربة التي ستأتي على العالم أجمع لتجرب الساكنين على الأرض."]]}, {"l": "Rev 3:11", "n": "", "vs": [[11, "إني آت سريعا، فتمسك بما عندك، لئلا يسلب أحد إكليلك."]]}], "kwAr": "هكذا اثبتوا في الرب", "noteAr": ""}], "arS": [["إذن", ["G5620"]], ["، ", []], ["ياإخوتي", ["G80", "G3450"]], [" ", []], ["الأحباء", ["G27"]], [" ", []], ["والمشتاق إليهم", ["G1973"]], ["، ", []], ["يافرحي", ["G5479"]], [" ", []], ["وإكليلي", ["G4735"]], ["، ", []], ["هكذا", ["G3779"]], [" ", []], ["اثبتوا", ["G4739"]], [" في ", []], ["الرب", ["G2962"]], [" أيها ", []], ["الأحباء", ["G27"]], [".", []]]}, {"c": 4, "v": 2, "text": "أحث أفودية، كما أحث سنتيخي، أن يكون لهما، في الرب، فكر واحد،", "groups": [{"kw": "that", "raw": "Phi_2:2, Phi_2:3, Phi_3:16; Gen_45:24; Psa_133:1-3; Mar_9:50; Rom_12:16-18; 1Co_1:10; Eph_4:1-8; 1Th_5:13; Heb_12:14; Jam_3:17, Jam_3:18; 1Pe_3:8-11", "note": "", "refs": [{"l": "Phi 2:2", "n": "", "vs": [[2, "فتمموا فرحي بأن يكون لكم رأي واحد ومحبة واحدة ونفس واحدة وفكر واحد."]]}, {"l": "Phi 2:3", "n": "", "vs": [[3, "لا يكن بينكم شيء بروح التحزب والافتخار الباطل، بل بالتواضع ليعتبر كل واحد منكم غيره أفضل كثيرا من نفسه،"]]}, {"l": "Phi 3:16", "n": "", "vs": [[16, "إنما، لنواصل السير من حيث قد وصلنا، في المنهج نفسه."]]}, {"l": "Gen 45:24", "n": "", "vs": [[24, "وهكذا صرف إخوته بعد أن أوصاهم: «لا تتخاصموا في الطريق»."]]}, {"l": "Psa 133:1-3", "n": "", "vs": [[1, "ما أحسن وما أبهج أن يسكن الإخوة معا (بوئام)."], [2, "فذلك مثل زيت المسحة العطر المسكوب على الرأس، النازل على اللحية، على لحية هارون، الجاري إلى أطراف ثوبه،"], [3, "بل مثل ندى حرمون المتقاطر على جبل صهيون. فإنه هناك أمر الرب أن تحل البركة والحياة إلى الأبد."]]}, {"l": "Mar 9:50", "n": "", "vs": [[50, "الملح جيد، ولكن إذا فقد الملح ملوحته، فبماذا تعيدون إليه طعمه؟ فليكن لكم ملح في أنفسكم، وكونوا مسالمين بعضكم لبعض! »"]]}, {"l": "Rom 12:16-18", "n": "", "vs": [[16, "كونوا متوافقين بعضكم مع بعض، غير مهتمين بالأمور العالية، بل مسايرين ذوي المراكز الوضيعة. لا تكونوا حكماء في نظر أنفسكم."], [17, "لا تردوا لأحد شرا مقابل شر، بل اجتهدوا في تقديم ما هو حسن أمام جميع الناس."], [18, "إن كان ممكنا، فمادام الأمر يتعلق بكم، عيشوا في سلام مع جميع الناس."]]}, {"l": "1Co 1:10", "n": "", "vs": [[10, "على أنني أيها الإخوة، أتوسل إليكم باسم ربنا يسوع المسيح أن يكون لجميعكم صوت واحد وأن لا يكون بينكم أي انقسام. وإنما كونوا جميعا موحدي الفكر والرأي."]]}, {"l": "Eph 4:1-8", "n": "", "vs": [[1, "... إذن، أنا السجين في الرب، أناشدكم أن تسلكوا سلوكا يليق بالدعوة التي إليها دعيتم،"], [2, "بكل تواضع ووداعة وطول بال، محتملين بعضكم بعضا في المحبة،"], [3, "مجتهدين أن تحافظوا على وحدة الروح برابطة الوفاق. فإنما هناك جسد واحد وروح واحد،"], [4, "مثلما دعيتم، جميعكم، دعوة لها رجاء واحد."], [5, "ولكم رب واحد، وإيمان واحد، ومعمودية واحدة،"], [6, "وإله وآب واحد للجميع، وهو فوق الجميع وبالجميع وفي الجميع."], [7, "على أن كل واحد منا قد أعطي نعمة توافق مقدار ما يهبه المسيح."], [8, "لذلك يقول (الوحي): «إذ صعد إلى الأعالي، ساق أسرى، ووهب الناس مواهب!»"]]}, {"l": "1Th 5:13", "n": "", "vs": [[13, "وأن تقدروهم تقديرا فائقا في المحبة، من أجل عملهم. عيشوا بسلام بعضكم مع بعض."]]}, {"l": "Heb 12:14", "n": "", "vs": [[14, "اجعلوا هدفكم أن تسالموا جميع الناس، وتعيشوا حياة مقدسة. فبغير قداسة، لا يقدر أحد أن يرى الرب."]]}, {"l": "Jam 3:17", "n": "", "vs": [[17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}, {"l": "Jam 3:18", "n": "", "vs": [[18, "والبر هو ثمر ة ما يزرعه في سلام صانعو السلام."]]}, {"l": "1Pe 3:8-11", "n": "", "vs": [[8, "والخلاصة، كونوا جميعا متحدين في الرأي، متعاطفين بعضكم مع بعض، مبادلين أحدكم الآخر المحبة الأخوية، شفوقين، متواضعين."], [9, "لا تبادلوا الشر بشر، ولا الشتيمة بشتيمة. بل بالعكس: باركوا، فترثوا البركة، لأنه لهذا دعاكم الله ."], [10, "فمن أراد أن يتمتع بحياة سعيدة وأيام طيبة، فليمنع لسانه عن الشر وشفتيه عن كلام الغش."], [11, "ليتحول عن الشر ويفعل الخير. ليطلب السلام ويسع للوصول إليه."]]}], "kwAr": "أن يكون لهما فكر واحد", "noteAr": ""}], "arS": [["أحث", ["G3870"]], [" ", []], ["أفودية", ["G2136"]], ["، كما ", []], ["أحث", ["G3870"]], [" ", []], ["سنتيخي", ["G4941"]], ["، أن يكون لهما، في ", []], ["الرب", ["G2962"]], ["، ", []], ["فكر", ["G5426"]], [" واحد،", []]]}, {"c": 4, "v": 3, "text": "أجل، أطلب إليك أنت أيضا، أيها الزميل المخلص، أن تساعدهما، لأنهما جاهدتا معي في خدمة الإنجيل، هما وأكليمندس ومعاوني الآخرون، المكتوبة أسماؤهم في سجل الحياة.", "groups": [{"kw": "I", "raw": "Phi_4:2; Rom_12:1; Phm_1:8, Phm_1:9", "note": "", "refs": [{"l": "Phi 4:2", "n": "", "vs": [[2, "أحث أفودية، كما أحث سنتيخي، أن يكون لهما، في الرب، فكر واحد،"]]}, {"l": "Rom 12:1", "n": "", "vs": [[1, "لذلك أتوسل إليكم أيها الإخوة، نظرا لمراحم الله، أن تقدموا له أجسادكم ذبيحة مقدسة مقبولة عنده، وهي عبادتكم بعقل."]]}, {"l": "Phm 1:8", "n": "", "vs": [[8, "لذلك، فمع أن لي كامل الحق في المسيح أن آمرك بالواجب،"]]}, {"l": "Phm 1:9", "n": "", "vs": [[9, "إلا أني، إكراما للمحبة، اخترت أن أقدم إليك التماسا، بصفتي بولس العجوز والسجين حاليا لأجل المسيح يسوع."]]}], "kwAr": "أطلب إليك", "noteAr": ""}, {"kw": "true", "raw": "Phi_2:20-25; Col_1:7", "note": "", "refs": [{"l": "Phi 2:20-25", "n": "", "vs": [[20, "فليس عندي أحد غيره يهتم مثلي بأحوالكم بإخلاص."], [21, "فإن الجميع يسعون وراء مصالحهم الخاصة، لا لأجل المسيح يسوع."], [22, "أما تيموثاوس، فأنتم تعرفون أنه مختبر، إذ خدم معي في التبشير بالإنجيل كأنه ولد يعاون أباه."], [23, "فإياه أرجو أن أرسل حالما يتبين لي كيف ستجري أحوالي."], [24, "ولكن لي ثقة في الرب بأني، أنا نفسي، سآتي إليكم عن قريب."], [25, "إلا أني رأيت من الضروري أن أرسل إليكم أبفروديتس، أخي ومعاوني ورفيقي في التجند، والمرسل من قبلكم عاملا على سد حاجتي،"]]}, {"l": "Col 1:7", "n": "", "vs": [[7, "على حسب ما تعلمتم من أبفراس شريكنا العبد الحبيب، والخادم الأمين للمسيح عندكم"]]}], "kwAr": "أيها الزميل المخلص", "noteAr": ""}, {"kw": "help", "raw": "Phi_1:27; Act_9:36-41, Act_16:14-18; Rom_16:2-4, Rom_16:9, Rom_16:12; 1Ti_5:9, 1Ti_5:10", "note": "", "refs": [{"l": "Phi 1:27", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"]]}, {"l": "Act 9:36-41", "n": "", "vs": [[36, "وكان في مدينة يافا تلميذة اسمها طابيثا، ومعنى اسمها: غزالة، كان يشغلها دائما فعل الخير ومساعدة الفقراء."], [37, "وحدث في ذلك الوقت أنها مرضت وماتت، فغسلوها ووضعوها في غرفة بالطبقة العليا."], [38, "وسمع التلاميذ في يافا أن بطرس في لدة. وإذ كانت يافا قريبة من لدة، أرسلوا إليه رجلين يطلبان إليه قائلين: «تعال إلينا ولا تتأخر!»"], [39, "فقام وذهب. ولما وصل قادوه إلى الطبقة العليا، فتقدمت إليه جميع الأرامل باكيات، يعرضن بعض الأقمصة والثياب مما كانت غزالة تخيطه وهي معهن."], [40, "فطلب بطرس إلى جميع الحاضرين أن يخرجوا من الغرفة، وركع وصلى، ثم التفت إلى الجثة وقال: «ياطابيثا، قومي!» ففتحت عينيها. ولما رأت بطرس جلست،"], [41, "فمد يده إليها وساعدها على النهوض، ثم دعا القديسين والأر امل، وردها إليهم حية."]]}, {"l": "Act 16:14-18", "n": "", "vs": [[14, "ومن بينهن تاجرة أرجوان من مدينة ثياتيرا، متعبدة لله، اسمها ليدية، كانت تسمع ففتح الله قلبها لتقبل كلام بولس."], [15, "فلما تعمدت هي وأهل بيتها، دعتنا بإلحاح لقبول ضيافتها قائلة: «إن كنتم قد حكمتم أني مؤمنة بالرب، فانزلوا ضيوفا ببيتي». فاضطرتنا إلى قبول دعوتها."], [16, "وذات يوم كنا ذاهبين إلى الصلاة، فالتقت بنا خادمة يسكنها روح عرافة، كانت تكسب سادتها ربحا كثيرا من عرافتها،"], [17, "فأخذت تسير وراء بولس ووراءنا صارخة: «هؤلاء الناس هم عبيد الله العلي، يعلنون لكم طريق الخلاص»."], [18, "وظلت تفعل هذا أياما كثيرة، حتى تضايق بولس كثيرا، فالتفت وقال للروح الذي فيها: «باسم يسوع المسيح، آمرك أن تخرج منها!» فخرج حالا."]]}, {"l": "Rom 16:2-4", "n": "", "vs": [[2, "فاقبلوها في الرب قبولا يليق بالقديسين وقدموا لها أي عون تحتاج إليه منكم، لأنها هي كانت معينة لكثيرين ولي أنا أيضا."], [3, "سلموا على بريسكلا وأكيلا، معاوني في خدمة المسيح يسوع،"], [4, "اللذين عرضا عنقيهما للذبح إنقاذا لحياتي، ولست أنا وحدي شاكرا لهما بل جميع كنائس الأمم أيضا."]]}, {"l": "Rom 16:9", "n": "", "vs": [[9, "سلموا على أوربانوس، معاوننا في خدمة المسيح، وعلى إستاخيس، حبيبي."]]}, {"l": "Rom 16:12", "n": "", "vs": [[12, "سلموا على تريفينا وتريفوسا اللتين تجهدان نفسيهما في خدمة الرب. سلموا على برسيس المحبوبة، التي أجهدت نفسها كثيرا في خدمة الرب."]]}, {"l": "1Ti 5:9", "n": "", "vs": [[9, "لتقيد في سجل الأرامل من بلغت سن الستين على الأقل، على أن تكون قد تزوجت من رجل واحد،"]]}, {"l": "1Ti 5:10", "n": "", "vs": [[10, "ويكون مشهودا لها بالأعمال الصالحة، كأن تكون قد ربت الأولاد، وأضافت الغرباء، وغسلت أقدام القديسين، وأسعفت المتضايقين، ومارست كل عمل صالح!"]]}], "kwAr": "أن تساعدهما", "noteAr": ""}, {"kw": "whose", "raw": "Exo_32:32; Psa_69:28; Isa_4:3; Eze_13:9; Dan_12:1; Luk_10:20; Rev_3:5; Rev_13:8, Rev_17:8, Rev_20:12, Rev_20:15, Rev_21:27", "note": "", "refs": [{"l": "Exo 32:32", "n": "", "vs": [[32, "والآن إن شئت، اغفر لهم، وإلا فامحني من كتابك الذي كتبت»."]]}, {"l": "Psa 69:28", "n": "", "vs": [[28, "لتحذف (أسماؤهم) من سجل الحياة ولا تكتب مع الأبرار."]]}, {"l": "Isa 4:3", "n": "", "vs": [[3, "ويدعى كل من يبقى في صهيون ممن مكث في أورشليم قدوسا، كل من كتب للحياة في أورشليم،"]]}, {"l": "Eze 13:9", "n": "", "vs": [[9, "فتكون يدي على الأنبياء ذوي الرؤيا الباطلة والعرافة الكاذبة، فلا يكون لهم مقام في جماعة شعبي، ولا تدون أسماؤهم في كتاب بيت إسرائيل، ولا يدخلون أرض إسرائيل، فتدركون أني أنا السيد الرب."]]}, {"l": "Dan 12:1", "n": "", "vs": [[1, "«وفي ذلك الوقت يقوم الرئيس العظيم الملاك ميخائيل حارس شعبك، وذلك في أثناء ضيق لم يكن له مثيل منذ أن وجدت أمة حتى ذلك الزمان. غير أن كل من كان اسمه مدونا في الكتاب من شعبك ينجو في ذلك الزمان."]]}, {"l": "Luk 10:20", "n": "", "vs": [[20, "إنما لا تفرحوا بهذا: بأن الأرواح تخضع لكم، بل افرحوا بأن أسماءكم قد كتبت في السماوات»."]]}, {"l": "Rev 3:5", "n": "", "vs": [[5, "كل من ينتصر سيلبس ثوبا أبيض، ولن أمحو اسمه من سجل الحياة، وسأعترف باسمه أمام أبي وملائكته."]]}, {"l": "Rev 13:8", "n": "", "vs": [[8, "فيسجد للوحش جميع سكان الأرض الذين لم تكتب أسماؤهم منذ تأسيس العالم في سجل الحياة للحمل الذي ذبح."]]}, {"l": "Rev 17:8", "n": "", "vs": [[8, "هذا الوحش كان موجودا، وهو غير موجود الآن، ولكنه على وشك أن يطلع من الهاوية ويمضي إلى الهلاك. وسيدهش سكان الأرض الذين لم تكتب أسماؤهم منذ تأسيس العالم في سجل الحياة، عندما يرون الوحش، لأنه كان موجودا، ثم أصبح غير موجود، وسيعود!"]]}, {"l": "Rev 20:12", "n": "", "vs": [[12, "ورأيت الأموات، كبارا وصغارا، واقفين قدام العرش. وفتحت الكتب، ثم فتح كتاب آخر هو سجل الحياة، ودين الأموات بحسب ما هو مدون في تلك الكتب، كل واحد حسب أعماله."]]}, {"l": "Rev 20:15", "n": "", "vs": [[15, "وكل من لم يوجد اسمه مكتوبا في سجل الحياة طرح في بحيرة النار!"]]}, {"l": "Rev 21:27", "n": "", "vs": [[27, "ولن يدخلها شيء نجس، ولا الذين يعملون القبائح ويدجلون، بل فقط الذين كتبت أسماؤهم في سجل الحياة للحمل!"]]}], "kwAr": "المكتوبة أسماؤهم في سجل الحياة", "noteAr": ""}], "arS": [["أجل، ", []], ["أطلب", ["G2065"]], [" إليك أنت أيضا، أيها ", []], ["الزميل", ["G4805"]], [" ", []], ["المخلص", ["G1103"]], ["، أن ", []], ["تساعدهما", ["G4815"]], ["، لأنهما ", []], ["جاهدتا معي", ["G4866"]], [" في خدمة ", []], ["الإنجيل", ["G2098"]], ["، هما ", []], ["وأكليمندس", ["G2815"]], [" ", []], ["ومعاوني", ["G4904"]], [" ", []], ["الآخرون", ["G3062"]], ["، المكتوبة ", []], ["أسماؤهم", ["G3686"]], [" في ", []], ["سجل", ["G976"]], [" ", []], ["الحياة", ["G2222"]], [".", []]]}, {"c": 4, "v": 4, "text": "افرحوا في الرب دائما، وأقول أيضا: افرحوا.", "groups": [{"kw": "Rejoice", "raw": "Phi_3:1; Rom_12:12", "note": "", "refs": [{"l": "Phi 3:1", "n": "", "vs": [[1, "وبعد، ياإخوتي، افرحوا في الرب. لا يزعجني أن أكتب إليكم بالأمور نفسها، فإن ذلك يجعلكم في مأمن."]]}, {"l": "Rom 12:12", "n": "", "vs": [[12, "فرحين بالرجاء، صابرين في الضيق، مواظبين على الصلاة،"]]}], "kwAr": "افرحوا في الرب", "noteAr": ""}, {"kw": "alway", "raw": "Psa_34:1, Psa_34:2, Psa_145:1, Psa_145:2, Psa_146:2; Mat_5:12; Act_5:41, Act_16:25; Rom_5:2, Rom_5:3; 1Th_5:16-18; Jam_1:2-4; 1Pe_4:13", "note": "", "refs": [{"l": "Psa 34:1", "n": "", "vs": [[1, "أبارك الرب في كل حين. تسبيحه دائما في فمي."]]}, {"l": "Psa 34:2", "n": "", "vs": [[2, "تفتخر نفسي بالرب، فيسمعني الودعاء ويفرحون."]]}, {"l": "Psa 145:1", "n": "", "vs": [[1, "ياإلهي الملك، إني أعظمك وأبارك اسمك إلى الدهر والأبد."]]}, {"l": "Psa 145:2", "n": "", "vs": [[2, "في كل يوم أباركك، وأسبح اسمك إلى الدهر والأبد."]]}, {"l": "Psa 146:2", "n": "", "vs": [[2, "أسبح الرب مادمت حيا، وأشدو لإلهي مادمت موجودا."]]}, {"l": "Mat 5:12", "n": "", "vs": [[12, "افرحوا وتهللوا، فإن مكافأتكم في السماوات عظيمة. فإنهم هكذا اضطهدوا الأنبياء من قبلكم!"]]}, {"l": "Act 5:41", "n": "", "vs": [[41, "ولكن الرسل خرجوا من المجلس فرحين، لأنهم اعتبروا أهلا لأن يلقوا الإهانة من أجل اسم يسوع."]]}, {"l": "Act 16:25", "n": "", "vs": [[25, "ونحو منتصف الليل كان بولس وسيلا يصليان ويسبحان الله، والمسجونون يسمعونهما،"]]}, {"l": "Rom 5:2", "n": "", "vs": [[2, "وبه أيضا تم لنا الدخول بالإيمان إلى هذه النعمة التي نقيم فيها الآن؛ ونحن نفتخر برجائنا في التمتع بمجد الله."]]}, {"l": "Rom 5:3", "n": "", "vs": [[3, "ليس هذا فقط، بل نفتخر أيضا في وسط الضيقات، لعلمنا أن الضيق ينتج فينا الصبر،"]]}, {"l": "1Th 5:16-18", "n": "", "vs": [[16, "افرحوا على الدوام؛"], [17, "صلوا دون انقطاع؛"], [18, "ارفعوا الشكر في كل حال: فهذه هي مشيئة الله لكم في المسيح يسوع."]]}, {"l": "Jam 1:2-4", "n": "", "vs": [[2, "ياإخوتي، عندما تنزل بكم التجارب والمحن المختلفة، اعتبروها سبيلا إلى الفرح الكلي."], [3, "وكونوا على ثقة بأن امتحان إيمانكم هذا ينتج صبرا."], [4, "ودعوا الصبر يعمل عمله الكامل فيكم، لكي يكتمل نضوجكم وتصيروا أقوياء قادرين على مواجهة جميع الأحوال."]]}, {"l": "1Pe 4:13", "n": "", "vs": [[13, "وإنما افرحوا: لأنكم كما تشاركون المسيح في الآلام الآن، لابد أن تفرحوا بمشاركته في الابتهاج عند ظهور مجده."]]}], "kwAr": "دائما", "noteAr": ""}, {"kw": "again", "raw": "Phi_3:1; 2Co_13:1, 2Co_13:2; Gal_1:8", "note": "", "refs": [{"l":
