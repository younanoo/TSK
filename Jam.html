ا الذي يقضي بأمر فيتحقق إن لم يكن الرب قد أمر به؟"]]}, {"l": "Act 18:21", "n": "", "vs": [[21, "وودعهم قائلا: «سأعود إليكم إن شاء الله !» ثم سافر بحرا من أفسس،"]]}, {"l": "Rom 1:10", "n": "", "vs": [[10, "في صلواتي، متوسلا دائما عسى الآن أن يتيسر لي مرة بمشيئة الله أن آتي إليكم."]]}, {"l": "Rom 15:32", "n": "", "vs": [[32, "حتى أجيء إليكم في فرح بمشيئة الله فأنتعش عندكم وأستريح."]]}, {"l": "1Co 4:19", "n": "", "vs": [[19, "ولكني سآتي إليكم عاجلا، إن شاء الرب، فأختبر لا كلام هؤلاء المنتفخين بل قوتهم."]]}, {"l": "1Co 16:7", "n": "", "vs": [[7, "فأنا لا أريد أن أزوركم كعابر سبيل هذه المرة، بل أرجو أن تطول إقامتي عندكم إن أذن الرب."]]}, {"l": "Heb 6:3", "n": "", "vs": [[3, "وبإذن الله، سنفعل ذلك كله!"]]}], "kwAr": "إن شاء الرب", "noteAr": ""}], "arS": [["بدلا من ", []], ["ذلك", ["G473"]], ["، كان يجب أن ", []], ["تقولوا", ["G3004"]], [": «", []], ["إن", ["G1437"]], [" ", []], ["شاء", ["G2309"]], [" ", []], ["الرب", ["G2962"]], ["، ", []], ["نعيش", ["G2198"]], [" ", []], ["ونعمل", ["G4160"]], [" ", []], ["هذا", ["G5124"]], [" الأمر ", []], ["أو", ["G2228"]], [" ", []], ["ذاك", ["G1565"]], ["!»", []]]}, {"c": 4, "v": 16, "text": "وإلا، فإنكم تفتخرون متكبرين. وكل افتخار كهذا، هو افتخار رديء.", "groups": [{"kw": "", "raw": "Jam_3:14; Psa_52:1, Psa_52:7; Pro_25:14, Pro_27:1; Isa_47:7, Isa_47:8, Isa_47:10; 1Co_4:7, 1Co_4:8, 1Co_5:6; Rev_18:7", "note": "", "refs": [{"l": "Jam 3:14", "n": "", "vs": [[14, "أما إن كانت قلوبكم مملوءة بمرارة الحسد وبالتحزب، فلا تفتخروا بحكمتكم، ولا تنكروا الحق."]]}, {"l": "Psa 52:1", "n": "", "vs": [[1, "لماذا تتفاخر بالشر أيها الجبار؟ إن رحمة الله تدوم اليوم كله"]]}, {"l": "Psa 52:7", "n": "", "vs": [[7, "هذا هو الرجل الذي لم يتخذ الله حصنا له، بل اتكل على وفرة غناه واعتز بغوايته."]]}, {"l": "Pro 25:14", "n": "", "vs": [[14, "المتفاخر بإغداق هدايا كاذبة هو كالسحاب والريح بلا مطر."]]}, {"l": "Pro 27:1", "n": "", "vs": [[1, "لا تتباه بالغد لأنك لا تدري ماذا يلد اليوم."]]}, {"l": "Isa 47:7", "n": "", "vs": [[7, "وقلت: سأظل السيدة إلى الأبد. لذلك لم تفكري بهذه الأمور في نفسك ولا تأملت بما تؤول إليه."]]}, {"l": "Isa 47:8", "n": "", "vs": [[8, "فالآن اسمعي هذا أيتها المترفهة المتنعمة المطمئنة، القائلة في قلبها: أنا وحدي وليس هناك غيري، لن أعرف الترمل ولن أثكل"]]}, {"l": "Isa 47:10", "n": "", "vs": [[10, "قد تولتك طمأنينة في شرك، وقلت: لا يراني أحد ولكن حكمتك ومعرفتك أضلاك، فقلت في نفسك: أنا وحدي، وليس هناك غيري."]]}, {"l": "1Co 4:7", "n": "", "vs": [[7, "فمن جعلك متميزا عن غيرك؟ وأي شيء مما لك لم تكن قد أخذته هبة؟ ومادمت قد أخذت، فلماذا تتباهى كأنك لم تأخذ؟"]]}, {"l": "1Co 4:8", "n": "", "vs": [[8, "إنكم قد شبعتم وقد اغتنيتم! قد صرتم ملوكا وتخليتم عنا! ويا ليتكم ملوك حقا فنشترك معكم في الملك!"]]}, {"l": "1Co 5:6", "n": "", "vs": [[6, "إن افتخاركم ليس في محله! ألستم تعلمون أن خميرة صغيرة تخمر العجين كله؟"]]}, {"l": "Rev 18:7", "n": "", "vs": [[7, "أنزلوا بها من العذاب والشقاء على قدر ما عظمت نفسها وترفهت. فإنها تقول في نفسها: أنا ملكة على العرش، ولست أرملة، ولن أذوق طعم الحزن."]]}], "kwAr": "", "noteAr": ""}], "arS": [["وإلا، فإنكم ", []], ["تفتخرون", ["G2744"]], [" ", []], ["متكبرين", ["G212"]], [". ", []], ["وكل", ["G3956"]], [" ", []], ["افتخار", ["G2746"]], [" ", []], ["كهذا", ["G5108"]], ["، هو افتخار ", []], ["رديء", ["G4190"]], [".", []]]}, {"c": 4, "v": 17, "text": "فمن يعرف أن يعمل الصواب، ولا يعمله، فإن ذلك يحسب له خطيئة.", "groups": [{"kw": "", "raw": "Luk_12:47, Luk_12:48; Joh_9:41, Joh_13:17, Joh_15:22; Rom_1:20,Rom_1:21, Rom_1:32, Rom_2:17-23, Rom_7:13", "note": "", "refs": [{"l": "Luk 12:47", "n": "", "vs": [[47, "وأما ذلك العبد الذي يعمل بإرادة سيده، فإنه سيضرب كثيرا."]]}, {"l": "Luk 12:48", "n": "", "vs": [[48, "ولكن الذي لا يعلمها ويعمل ما يستوجب الضرب، فإنه سيضرب قليلا. فكل من أعطي كثيرا، يطلب منه كثير؛ ومن أودع كثيرا، يطالب بأكثر."]]}, {"l": "Joh 9:41", "n": "", "vs": [[41, "فأجابهم يسوع: «لو كنتم عميانا بالفعل، لما كانت عليكم خطيئة. ولكنكم تدعون أنكم تبصرون، ولذلك فإن خطيئتكم باقية...»"]]}, {"l": "Joh 13:17", "n": "", "vs": [[17, "فإن كنتم قد عرفتم هذا، فطوبى لكم إذا عملتم به."]]}, {"l": "Joh 15:22", "n": "", "vs": [[22, "لو لم آت وأكلمهم، لما كانت لهم خطيئة؛ ولكن لا عذر لهم الآن في خطيئتهم."]]}, {"l": "Rom 1:20", "n": "", "vs": [[20, "فإن ما لا يرى من أمور الله، أي قدرته الأزلية وألوهته، ظاهر للعيان منذ خلق العالم، إذ تدركه العقول من خلال المخلوقات. حتى إن الناس باتوا بلا عذر."]]}, {"l": "Rom 1:21", "n": "", "vs": [[21, "فمع أنهم عرفوا الله ، لم يمجدوه باعتباره الله ، ولا شكروه، بل انحطوا بتفكيرهم إلى الحماقة وصار قلبهم لغباوته مظلما."]]}, {"l": "Rom 1:32", "n": "", "vs": [[32, "إنهم يعلمون حكم الله العادل: أن الذين يفعلون هذه الأمور يستوجبون الموت؛ ومع ذلك، لا يمارسونها وحسب، بل يسرون بفاعليها."]]}, {"l": "Rom 2:17-23", "n": "", "vs": [[17, "ولكن، إن كنت تدعى يهوديا؛ وتتكل على الشريعة؛ وتفتخر بالله؛"], [18, "وتميز ما هو الأفضل بسبب ما تعلمته من الشريعة؛"], [19, "ولك ثقة في نفسك بأنك قائد للعميان، ونور للذين في الظلام،"], [20, "ومؤدب للجهال، ومعلم للأطفال؛ ولك في الشريعة صورة المعرفة والحق؛"], [21, "فأنت إذن، يامن تعلم غيرك، أما تعلم نفسك؟ أنت يامن تعظ أن لا يسرق، أتسرق؟"], [22, "أنت يامن تنهى عن الزنى، أتزني؟ أنت يامن تستنكر الأصنام، أتسرق الهياكل"], [23, "الذي تفتخر بالشريعة، أتهين الله بمخالفة الشريعة؟"]]}, {"l": "Rom 7:13", "n": "", "vs": [[13, "فهل صار ما هو صالح موتا لي؟ حاشا! ولكن الخطيئة، لكي تظهر أنها خطيئة، أنتجت لي الموت بما هو صالح، حتى تصير الخطيئة خاطئة جدا بسبب الوصية."]]}], "kwAr": "", "noteAr": ""}], "arS": [["فمن ", []], ["يعرف", ["G1492"]], [" أن ", []], ["يعمل", ["G4160"]], [" ", []], ["الصواب", ["G2570"]], ["، ", []], ["ولا", ["G3361"]], [" ", []], ["يعمله", ["G4160"]], ["، فإن ذلك يحسب له ", []], ["خطيئة", ["G266"]], [".", []]]}, {"c": 5, "v": 1, "text": "أيها الأغنياء، هيا الآن ابكوا مولولين بسبب ما ينتظركم من أهوال وشقاء.", "groups": [{"kw": "Go", "raw": "Jam_4:13", "note": "", "refs": [{"l": "Jam 4:13", "n": "", "vs": [[13, "وأنتم، يامن تخططون قائلين: «اليوم أو غدا، نذهب إلى مدينة كذا، ونقضي هناك سنة، فنتاجر ونربح...»"]]}], "kwAr": "هيا الآن", "noteAr": ""}, {"kw": "ye", "raw": "Jam_1:11, Jam_2:6; Deu_8:12-14, Deu_32:15; Neh_9:25, Neh_9:26; Job_20:15-29; Psa_17:14; Psa_49:6-20, Psa_73:3-9, Psa_73:18-20; Pro_11:4, Pro_11:28; Ecc_5:13, Ecc_5:14; Jer_9:23; Mic_6:12; Zep_1:18; Mat_19:23, Mat_19:24; Luk_6:24, Luk_12:16-21, Luk_16:19-25; 1Ti_6:9, 1Ti_6:10; Rev_6:15-17", "note": "", "refs": [{"l": "Jam 1:11", "n": "", "vs": [[11, "فعندما تشرق الشمس بحرها المحرق، تيبس تلك الأعشاب، فيسقط زهرها، ويتلاشى جمال منظرها. هكذا يذبل الغني في طرقه!"]]}, {"l": "Jam 2:6", "n": "", "vs": [[6, "ولكنكم أنتم عاملتم الفقير معاملة مهينة. ألا تعرفون أن الأغنياء هم الذين يتسلطون عليكم ويجرونكم إلى المحاكم،"]]}, {"l": "Deu 8:12-14", "n": "", "vs": [[12, "لئلا إذا أكلتم وشبعتم وبنيتم بيوتا جميلة سكنتموها،"], [13, "وتكاثرت أبقاركم وغنمكم وذهبكم وجميع ما لكم."], [14, "تتكبر قلوبكم وتنسون الرب إلهكم الذي أطلقكم من نير عبودية ديار مصر،"]]}, {"l": "Deu 32:15", "n": "", "vs": [[15, "فسمن بنو إسرائيل ورفسوا، سمنوا وغلظوا واكتسوا شحما، فرفضوا الإله صانعهم وتنكروا لصخرة خلاصهم."]]}, {"l": "Neh 9:25", "n": "", "vs": [[25, "فتملكوا مدنا حصينة وأرضا خصيبة، وورثوا بيوتا تفيض خيرا، وآبارا محفورة، وكروما وزيتونا وأشجارا مثمرة كثيرة، فأكلوا وشبعوا وسمنوا وتمتعوا بخيرك العميم."]]}, {"l": "Neh 9:26", "n": "", "vs": [[26, "ومع ذلك ثاروا عليك وتمردوا وطرحوا شريعتك خلف ظهورهم، وقتلوا أنبياءك الذين حذروهم وأنذروهم ليرتدوا إليك، وارتكبوا الشرور الفواحش."]]}, {"l": "Job 20:15-29", "n": "", "vs": [[15, "ويتقيأ ما ابتلعه من أموال، ويستخرجها الله من جوفه."], [16, "لقد رضع سم الصل، فقتله لسان الأفعى."], [17, "لن تكتحل عيناه بمرأى الأنهار الجارية، ولا بالجداول الفياضة بالعسل والزبد."], [18, "يرد ثمار تعبه ولا يبلعه ولا يستمتع بكسب تجارته."], [19, "لأنه هضم حق الفقراء وخذلهم وسلب بيوتا لم يبنها."], [20, "وإذ لا يعرف طمعه قناعة، فإنه لن يدخر شيئا يستمتع به."], [21, "لم يبق نهمه على شيء، لذلك لن يدوم خيره."], [22, "في وفرة سعته يصيبه الضنك، وتحل به أقسى الكوارث."], [23, "وعندما يملأ بطنه ينفث عليه الله غضبه الحارق ويمطره عليه طعاما له."], [24, "إن فر من آلة حرب من حديد، تخترقه قوس النحاس."], [25, "اخترقته عميقا وخرجت من جسده، ونفذ حدها اللامع من مرارته، وحل به رعب."], [26, "كل ظلمة تتربص بذخائره، وتأكله نار لم تنفخ، وتلتهم ما بقي من خيمته."], [27, "تفضح السماوات إثمه، وتتمرد الأرض عليه،"], [28, "تفنى مدخرات بيته وتحترق في يوم غضب الرب."], [29, "هذا هو المصير الذي يعده الله للأشرار، والميراث الذي كتبه الله لهم»."]]}, {"l": "Psa 17:14", "n": "", "vs": [[14, "أنقذني بيدك يارب من الناس. من أهل الدنيا الذين نصيبهم هو في هذه الحياة. أنت تملأ بطونهم من خيراتك المخزونة، فيشبع أبناؤهم، ويورثون أولادهم ما يفضل عنهم."]]}, {"l": "Psa 49:6-20", "n": "", "vs": [[6, "أولئك المتكلون على ثروتهم، وبوفرة غناهم يفتخرون."], [7, "لا يقدر أحد أبدا أن يفتدي أخاه أو يقدم لله كفارة عنه."], [8, "لأن فدية النفوس باهظة يتعذر دفعها مدى الحياة"], [9, "طلبا للخلود على الأرض وتفاديا لرؤية القبر."], [10, "لكن الحكماء يموتون كما يموت الجاهل والغبي، تاركين ثروتهم لغيرهم."], [11, "يتوهمون أن بيوتهم خالدة، وأن مساكنهم باقية من جيل إلى جيل، فأطلقوا أسماءهم على أراضيهم (تخليدا لذكرهم)."], [12, "ولكن الإنسان لا يخلد في أبهته. إنه يماثل البهائم التي تباد."], [13, "هذا هو مصير الجهال الواثقين بأنفسهم، ومصير أعقابهم الذين يستحسنون أقوالهم."], [14, "يساقون للموت كالأغنام، ويكون الموت راعيهم ويسود المستقيمون عليهم. تبلى صورتهم، وتصير الهاوية مسكنهم."], [15, "إنما الله يفتدي نفسي من قبضة الهاوية إذ يأخذني إليه."], [16, "لا تخش إذا اغتنى إنسان، وزاد مجد بيته."], [17, "فإنه عند موته لا يأخذ معه شيئا، ولا يلحق به مجده إلى قبره."], [18, "ومع أنه ينعم نفسه بالبركات في أثناء حياته ويطريه الناس إذ أحسن إلى نفسه،"], [19, "إلا أن نفسه ستلحق بآبائه، الذين لا يرون النور إلى الأبد."], [20, "فالإنسان المتمتع بالكرامة من غير فهم، يماثل البهائم البائدة."]]}, {"l": "Psa 73:3-9", "n": "", "vs": [[3, "لأني حسدت المتكبرين، إذ شاهدت نجاح الأشرار."], [4, "فإن أوجاع الموت لا تصيبهم وأجسامهم سمينة."], [5, "لا يقاسون من أتعاب البشر، ولا يعانون من المصائب كالناس."], [6, "لذلك لبسوا الكبرياء كقلادة، وارتدوا الظلم كثوب."], [7, "عيونهم جاحظة من كثرة شحم طمعهم. وشرهم تجاوز ما يتصوره القلب."], [8, "يستهزئون ويتكلمون بالظلم خبثا، وبكبرياء ينطقون."], [9, "جدفوا على السماء بأفواههم، ولوثوا الأرض بخبث ألسنتهم."]]}, {"l": "Psa 73:18-20", "n": "", "vs": [[18, "حقا إنك أوقفتهم في أماكن زلقة، وأوقعتهم في التهلكات."], [19, "كيف صاروا للخر اب فجأة؟ انقرضوا وأفنتهم الدواهي."], [20, "كحلم يتلاشى عند اليقظة هكذا تختفي صورتهم عندما تنهض يارب لمعاقبتهم."]]}, {"l": "Pro 11:4", "n": "", "vs": [[4, "لا يجدي الغنى في يوم قضاء الرب، أما البر فينجي من الموت."]]}, {"l": "Pro 11:28", "n": "", "vs": [[28, "من يتكل على غناه يسقط، أما الصديقون فيزهون كأوراق الشجر الخضراء."]]}, {"l": "Ecc 5:13", "n": "", "vs": [[13, "قد رأيت شرا مقيتا تحت الشمس: ثروة مدخرة لغير صاحبها."]]}, {"l": "Ecc 5:14", "n": "", "vs": [[14, "أو ثروة تلفت في مشروع خاسر، ولم يبق (صاحبها) لابنه الذي أنجبه شيئا."]]}, {"l": "Jer 9:23", "n": "", "vs": [[23, "«فلا يفتخرن الحكيم بحكمته، ولا يزهون الجبار بجبروته، ولا الغني بثروته."]]}, {"l": "Mic 6:12", "n": "", "vs": [[12, "قد امتلأ أثرياء المدينة ظلما، ونطق سكانها بالكذب وألسنة الغش في أفواههم"]]}, {"l": "Zep 1:18", "n": "", "vs": [[18, "لا ينقذهم ذهبهم ولا فضتهم في يوم غضب الرب، إذ بنار غيرته تلتهم كل الأرض، وفيه يضع نهاية مباغتة كاملة سريعة لكل سكان المعمورة»."]]}, {"l": "Mat 19:23", "n": "", "vs": [[23, "فقال يسوع لتلاميذه: «الحق أقول لكم: إنه من الصعب على الغني أن يدخل ملكوت السماوات."]]}, {"l": "Mat 19:24", "n": "", "vs": [[24, "وأيضا أقول: إنه لأسهل أن يدخل الجمل في ثقب إبرة من أن يدخل الغني ملكوت الله»."]]}, {"l": "Luk 6:24", "n": "", "vs": [[24, "«ولكن الويل لكم أنتم الأغنياء، فإنكم قد نلتم عزاءكم!"]]}, {"l": "Luk 12:16-21", "n": "", "vs": [[16, "وضرب لهم مثلا، قال «إنسان غني غلت له أرضه محاصيل وافرة."], [17, "ففكر في نفسه قائلا: ماذا أعمل وليس عندي مكان أخزن فيه محاصيلي؟"], [18, "وقال: أعمل هذا: أهدم مخازني وأبني أعظم منها، وهناك أخزن جميع غلالي وخيراتي."], [19, "وأقول لنفسي: يانفس، عندك خيرات كثيرة مخزونة لسنين عديدة، فاستريحي وكلي واشربي واطر بي!"], [20, "ولكن الله قال له: ياغبي، هذه الليلة تطلب نفسك منك، فلمن يبقى ما أعددته؟"], [21, "هذه هي حالة من يخزن الكنوز لنفسه ولا يكون غنيا عند الله!»"]]}, {"l": "Luk 16:19-25", "n": "", "vs": [[19, "كان هنالك إنسان غني، يلبس الأرجوان وناعم الثياب، ويقيم الولائم المترفة، متنعما كل يوم."], [20, "وكان إنسان مسكين اسمه لعازر، مطروحا عند بابه وهو مصاب بالقروح،"], [21, "يشتهي أن يشبع من الفتات المتساقط من مائدة الغني. حتى الكلاب كانت تأتاي وتلحس قروحه."], [22, "ومات المسكين، وحملته الملائكة إلى حضن إبراهيم. ثم مات الغني أيضا ودفن."], [23, "وإذ رفع عينيه وهو في الهاوية يتعذب، رأى إبراهيم من بعيد ولعازر في حضنه."], [24, "فنادى قائلا: ياأباي إبراهيم! ارحمني، وأرسل لعازر ليغمس طرف إصبعه في الماء ويبرد لساني: فإني معذب في هذا اللهيب."], [25, "ولكن إبراهيم قال: يابني، تذكر أنك نلت خيراتك كاملة في أثناء حياتك، ولعازر نال البلايا. ولكنه الآن يتعزى هنا، وأنت هناك تتعذب."]]}, {"l": "1Ti 6:9", "n": "", "vs": [[9, "أما الذين يرغبون في أن يصيروا أغنياء، فيسقطون في التجربة والفخ ويتورطون في كثير من الشهوات السفيهة المضرة التي تغرق الناس في الدمار والهلاك."]]}, {"l": "1Ti 6:10", "n": "", "vs": [[10, "فإن حب المال أصل لكل شر؛ وإذ سعى بعضهم إليه، ضلوا عن الإيمان، وطعنوا أنفسهم بأوجاع كثيرة."]]}, {"l": "Rev 6:15-17", "n": "", "vs": [[15, "وملوك الأرض والعظماء والقواد والأغنيا ء والأقوياء والعبيد والأحرار كلهم اختبأوا في المغاور وصخور الجبال،"], [16, "وهم يقولون للجبال والصخور: اسقطي علينا، وأخفينا من وجه الجالس على العرش ومن غضب الحمل!»"], [17, "فإن يوم الغضب العظيم قد جاءهم، ومن يقوى على الوقوف أمامه؟"]]}], "kwAr": "أيها الأغنياء", "noteAr": ""}, {"kw": "weep", "raw": "Jam_4:9; Isa_13:6, Isa_22:12, Isa_22:13; Jer_4:8; Eze_19:2; Joe_1:5, Joe_1:11, Joe_1:13; Amo_6:6, Amo_6:7; Zec_11:2, Zec_11:3; Luk_6:25, Luk_23:28, Luk_23:29", "note": "", "refs": [{"l": "Jam 4:9", "n": "", "vs": [[9, "احزنوا مولولين ونائحين وباكين. ليتحول ضحككم إلى نواح، وفرحكم إلى كآبة."]]}, {"l": "Isa 13:6", "n": "", "vs": [[6, "ولولوا، فإن يوم الرب بات وشيكا قادما من عند الرب محملا بالدمار."]]}, {"l": "Isa 22:12", "n": "", "vs": [[12, "في ذلك اليوم يدعوكم السيد الرب القدير للبكاء والنوح وحلق الشعر والتنطق بالمسوح."]]}, {"l": "Isa 22:13", "n": "", "vs": [[13, "ولكنكم انهمكتم بالفرح والسرور وذبح الثيران وتضحية الغنم وأكل اللحم وشرب الخمر قائلين: «لنأكل ونشرب لأننا غدا نموت»."]]}, {"l": "Jer 4:8", "n": "", "vs": [[8, "لذلك تمنطقوا بالمسوح، ونوحوا وولولوا، لأن غضب الرب المحتدم لم يرتد عنا»"]]}, {"l": "Eze 19:2", "n": "", "vs": [[2, "وقل: ماذا كانت أمك؟ لبوة ربضت بين الأسود وربت جراءها بين الأشبال."]]}, {"l": "Joe 1:5", "n": "", "vs": [[5, "اصحوا أيها السكارى، وابكوا ياجميع مدمني الخمر على العصير لأنه قد انقطع عن أفواهكم."]]}, {"l": "Joe 1:11", "n": "", "vs": [[11, "اخزوا أيها الحراثون وأعولوا أيها الكرامون على الحنطة والشعير، لأن حصاد الحقل قد تلف."]]}, {"l": "Joe 1:13", "n": "", "vs": [[13, "أيها الكهنة اتشحوا بالمسوح ونوحوا. ولولوا ياخدام المذبح. تعالوا وبيتوا ليلتكم بالمسوح ياخدام إلهي، لأن تقدمات الدقيق والخمر قد منعت عن هيكل الله."]]}, {"l": "Amo 6:6", "n": "", "vs": [[6, "الشاربين خمرا في كؤوس، المتطيبين بأفضل العطور، ولا يكتئبون على خراب يوسف."]]}, {"l": "Amo 6:7", "n": "", "vs": [[7, "لهذا سيكونون أول الذاهبين إلى السبي، ويزول ما أنتم عليه من لهو وعبث."]]}, {"l": "Zec 11:2", "n": "", "vs": [[2, "انتحب أيها السرو لأن الأرز قد تهاوى، والعظماء قد هلكوا. انتحب يابلوط باشان لأن الغابات الكثيفة دمرت."]]}, {"l": "Zec 11:3", "n": "", "vs": [[3, "استمعوا إلى نواح الرعاة (أي الحكام) لأن مرابعهم الثرية قد تلفت. أنصتوا إلى زمجرة الأسود لأن أجمات وادي الأردن قد صارت خرابا."]]}, {"l": "Luk 6:25", "n": "", "vs": [[25, "الويل لكم أيها المشبعون الآن، فإنكم سوف تجوعون. الويل لكم أيها الضاحكون الآن، فإنكم سوف تنوحون وتبكون."]]}, {"l": "Luk 23:28", "n": "", "vs": [[28, "فالتفت إليهن يسوع، وقال: «يابنات أورشليم، لا تبكين علي، بل ابكين على أنفسكن وعلى أولادكن!"]]}, {"l": "Luk 23:29", "n": "", "vs": [[29, "فها إن أياما ستأتي فيها يقول الناس: طوبى للعواقر اللواتي ما حملت بطونهن ولا أرضعت أثداؤهن!"]]}], "kwAr": "ابكوا مولولين", "noteAr": ""}], "arS": [["أيها ", []], ["الأغنياء", ["G4145"]], ["، ", []], ["هيا", ["G33"]], [" ", []], ["الآن", ["G3568"]], [" ", []], ["ابكوا", ["G2799"]], [" ", []], ["مولولين", ["G3649"]], [" بسبب ما ", []], ["ينتظركم", ["G1904"]], [" من أهوال ", []], ["وشقاء", ["G5004"]], [".", []]]}, {"c": 5, "v": 2, "text": "إن ثرواتكم الكثيرة قد فسدت، وثيابكم الفاخرة قد أكلها العث", "groups": [{"kw": "Your riches", "raw": "Jer_17:11; Mat_6:19, Mat_6:20; Luk_12:33; 1Pe_1:4", "note": "", "refs": [{"l": "Jer 17:11", "n": "", "vs": [[11, "مكتنز الغنى من غير حق كحجلة تحتضن وتفقس ما لم تبض، لأنه سرعان ما يفقده في منتصف حياته، ويضحى آخر أيامه أحمق."]]}, {"l": "Mat 6:19", "n": "", "vs": [[19, "لا تكنزوا لكم كنوزا على الأرض، حيث يفسدها السوس والصدأ، وينقب عنها اللصوص ويسرقون."]]}, {"l": "Mat 6:20", "n": "", "vs": [[20, "بل اكنزوا لكم كنوزا في السماء، حيث لا يفسدها سوس ولا ينقب عنها لصوص ولا يسرقون."]]}, {"l": "Luk 12:33", "n": "", "vs": [[33, "بيعوا ما تملكون وأعطوا صدقة، واجعلوا لكم أكياسا لا تبلى، كنزا في السماوات لا ينفد، حيث لا يقترب لص ولا يفسد سوس."]]}, {"l": "1Pe 1:4", "n": "", "vs": [[4, "وإرثا لا يفنى ولا يفسد ولا يزول،"]]}], "kwAr": "ثرواتكم الكثيرة قد فسدت", "noteAr": ""}, {"kw": "your garments", "raw": "Jam_2:2; Job_13:28; Psa_39:11; Isa_50:9, Isa_51:8; Hos_5:12", "note": "", "refs": [{"l": "Jam 2:2", "n": "", "vs": [[2, "لنفرض أن إنسانين دخلا مجمعكم، أحدهما غني يلبس ثيابا فاخرة ويزين أصابعه بخواتم من ذهب، والآخر فقير يلبس ثيابا رثة."]]}, {"l": "Job 13:28", "n": "", "vs": [[28, "فأنا كشجرة نخرها السوس وكثوب أكله العث."]]}, {"l": "Psa 39:11", "n": "", "vs": [[11, "عندما تؤدب الإنسان بالتوبيخ على الإثم، تتلف بهاءه إتلاف العث. إنما كل إنسان نفخة."]]}, {"l": "Isa 50:9", "n": "", "vs": [[9, "انظروا، ها السيد الرب يغيثني فمن يستذنبني؟ ها هم جميعا كثوب يبلون ويأكلهم العث."]]}, {"l": "Isa 51:8", "n": "", "vs": [[8, "لأن العث يأكلهم كثوب، ويقرضهم السوس كالصوف، أما بري فيبقى إلى الأبد، وخلاصي يثبت مدى الدهر."]]}, {"l": "Hos 5:12", "n": "", "vs": [[12, "لهذا أكون كالعث لإسرائيل، وكالسوس الناخر لشعب يهوذا."]]}], "kwAr": "ثيابكم الفاخرة قد أكلها العث", "noteAr": ""}], "arS": [["إن ", []], ["ثرواتكم", ["G5216", "G4149"]], [" الكثيرة قد ", []], ["فسدت", ["G4595"]], ["، ", []], ["وثيابكم", ["G2440"]], [" الفاخرة قد أكلها ", []], ["العث", ["G4598"]]]}, {"c": 5, "v": 3, "text": "ذهبكم وفضتكم قد تآكلا، وسيكون تآكلهما شاهدا ضدكم، ويأكل لحمكم كنار جمعتموها ثروة للأيام الأخيرة؟", "groups": [{"kw": "cankered", "raw": "2Ti_2:17", "note": "", "refs": [{"l": "2Ti 2:17", "n": "", "vs": [[17, "وكلامهم ينهش كالآكلة، ومنهم هيمنايوس وفيليتوس،"]]}], "kwAr": "ذهبكم وفضتكم قد تآكلا", "noteAr": ""}, {"kw": "a witness", "raw": "Gen_31:48, Gen_31:52; Jos_24:27; Job_16:8", "note": "", "refs": [{"l": "Gen 31:48", "n": "", "vs": [[48, "وقال لابان: «هذه الرجمة شاهدة اليوم بيني وبينك». لذلك دعي اسمها جلعيد."]]}, {"l": "Gen 31:52", "n": "", "vs": [[52, "شاهدين أن لا أتجاوز هذه الرجمة لإيقاع الأذى بك، أو تتجاوز أنت الرجمة وهذا العمود لإلحاق الضرر بي."]]}, {"l": "Jos 24:27", "n": "", "vs": [[27, "ثم قال للشعب جميعه: «إن هذا الحجر شاهد عليكم لئلا تجحدوا إلهكم»."]]}, {"l": "Job 16:8", "n": "", "vs": [[8, "لقد كبلتني فصار ذلك شاهدا علي، وقام هزالي ليشهد ضدي."]]}], "kwAr": "شاهدا ضدكم", "noteAr": ""}, {"kw": "and shall", "raw": "Jer_19:9; Mic_3:3; Rev_17:16, Rev_20:15, Rev_21:8", "note": "", "refs": [{"l": "Jer 19:9", "n": "", "vs": [[9, "وأطعمهم لحوم أبنائهم وبناتهم، ويأكل كل واحد لحم جاره في أثناء الحصار والضيقة التي يضايقهم بها أعداؤهم وطالبو نفوسهم."]]}, {"l": "Mic 3:3", "n": "", "vs": [[3, "الذين تأكلون لحوم شعبي، وتسلخون جلودهم عنهم وتهشمون عظامهم، وتقطعونهم كما يقطع اللحم في القدر، أو كاللحم المعد للمقلى."]]}, {"l": "Rev 17:16", "n": "", "vs": [[16, "وأما القرون العشرة التي رأيتها، والوحش، فسيبغضون الزانية ويجعلونها معزولة وعارية، ويأكلون لحمها ويحرقونها بالنار،"]]}, {"l": "Rev 20:15", "n": "", "vs": [[15, "وكل من لم يوجد اسمه مكتوبا في سجل الحياة طرح في بحيرة النار!"]]}, {"l": "Rev 21:8", "n": "", "vs": [[8, "أما الجبناء وغير المؤمنين، والفاسدون والقاتلون والزناة، والمتصلون بالشياطين وعبدة الأصنام وجميع الدجالين، فمصيرهم إلى البحيرة المتقدة بالنار والكبريت، الذي هو الموت الثاني»."]]}], "kwAr": "ويأكل لحمكم كنار", "noteAr": ""}, {"kw": "Ye have", "raw": "Deu_32:33, Deu_32:34; Job_14:16, Job_14:17; Rom_2:5", "note": "", "refs": [{"l": "Deu 32:33", "n": "", "vs": [[33, "خمرهم حمة الأفاعي وسم الثعابين المميت."]]}, {"l": "Deu 32:34", "n": "", "vs": [[34, "أليس هذا مدخرا عندي مختوما عليه في خزائني؟"]]}, {"l": "Job 14:16", "n": "", "vs": [[16, "حينئذ تحصي خطواتي حقا، ولكنك لا تراقب خطيئتي،"]]}, {"l": "Job 14:17", "n": "", "vs": [[17, "فتختم معصيتي في صرة، وتستر ذنبي."]]}, {"l": "Rom 2:5", "n": "", "vs": [[5, "ولكنك بسبب قساوتك وقلبك غير التائب، تخزن لنفسك غضبا ليوم الغضب، يوم تعلن دينونة الله العادلة."]]}], "kwAr": "جمعتموها ثروة", "noteAr": ""}, {"kw": "the last", "raw": "Gen_49:1; Isa_2:2; Mic_4:1; Act_2:17; 2Pe_3:3", "note": "", "refs": [{"l": "Gen 49:1", "n": "", "vs": [[1, "ثم استدعى يعقوب أبناءه وقال: «التفوا حولي لأنبئكم بما سيحدث لكم في الأيام المقبلة."]]}, {"l": "Isa 2:2", "n": "", "vs": [[2, "ويحدث في آخر الأيام، أن جبل هيكل الرب يصبح أسمى من كل الجبال، ويعلو فوق كل التلال، فتتوافد إليه جميع الأمم."]]}, {"l": "Mic 4:1", "n": "", "vs": [[1, "ويكون في آخر الأيام أن جبل هيكل الرب يصبح أشهر الجبال، ويعلو فوق كل التلال، فتتقاطر إليه شعوب عديدة،"]]}, {"l": "Act 2:17", "n": "", "vs": [[17, "يقول الله : في الأيام الأخيرة سأسكب روحي على جميع البشر، فيتنبأ بنوكم وبناتكم، ويرى شبابكم رؤى، ويحلم شيوخكم أحلاما."]]}, {"l": "2Pe 3:3", "n": "", "vs": [[3, "فاعلموا، قبل كل شيء أنه سيأتي في آخر الأيام أناس مستهزئون يسخرون بالحق، ويسلكون منجرفين وراء شهواتهم الخاصة."]]}], "kwAr": "للأيام الأخيرة", "noteAr": ""}], "arS": [["ذهبكم", ["G5557"]], [" ", []], ["وفضتكم", ["G696"]], [" قد ", []], ["تآكلا", ["G2728"]], ["، ", []], ["وسيكون", ["G2071"]], [" ", []], ["تآكلهما", ["G2447"]], [" ", []], ["شاهدا", ["G3142"]], [" ", []], ["ضدكم", ["G5213"]], ["، ", []], ["ويأكل", ["G5315"]], [" ", []], ["لحمكم", ["G4561"]], [" ", []], ["كنار", ["G5613", "G4442"]], [" جمعتموها ", []], ["ثروة", ["G2343"]], [" ", []], ["للأيام", ["G2250"]], [" ", []], ["الأخيرة", ["G2078"]], ["؟", []]]}, {"c": 5, "v": 4, "text": "وهذه أجرة العمال الذين حصدوا حقولكم، تلك الأجرة التي مازلتم تحبسونها عنهم ظلما، إنها تصرخ، وصراخ أولئك العمال أنفسهم قد سمعه رب الجن دم أخيك يصرخ إلي من الأرض."]]}, {"l": "Exo 2:23", "n": "", "vs": [[23, "وبعد مرور حقبة طويلة مات ملك مصر. وارتفع أنين بني إسرائيل وصراخهم من وطأة العبودية، وصعد إلى الله."]]}, {"l": "Exo 2:24", "n": "", "vs": [[24, "فأصغى الله إلى أنينهم، وتذكر ميثاقه مع إبراهيم وإسحق ويعقوب."]]}, {"l": "Exo 3:9", "n": "", "vs": [[9, "وها هو الآن قد وصل إلي صراخ بني إسرائيل، ورأيت كيف يضايقهم المصريون."]]}, {"l": "Exo 22:22-24", "n": "", "vs": [[22, "لا تسيء إلى أرملة أو يتيم،"], [23, "لأ نك إن أسأت إليهما وصرخا إلي أسمع صراخهما،"], [24, "فيحتدم غضبي وأقتلكم بالسيف، فتصبح زوجاتكم أرامل وأولادكم يتامى."]]}, {"l": "Exo 22:27", "n": "", "vs": [[27, "لأن ذلك الثوب هو ثوبه الذي يقي به بدنه، وإلا فبأي شيء ينام؟ إذا صرخ إلي أسمعه لأني رحيم."]]}, {"l": "Deu 24:15", "n": "", "vs": [[15, "ادفع له أجرته في يومه قبل غروب الشمس لأنه فقير، أجهد نفسه للحصول عليها. وإلا توجه إلى الرب بالشكوى ضدك، فتكون هذه عليك خطيئة."]]}, {"l": "Job 34:28", "n": "", "vs": [[28, "فكانوا سببا في ارتفاع صراخ البائس إليه، والله يستجيب استغاثة المسكين."]]}, {"l": "Psa 9:12", "n": "", "vs": [[12, "فهو الذي يثأر للدماء. لا ينسى ولا يتجاهل صراخ المتضايقين."]]}, {"l": "Luk 18:7", "n": "", "vs": [[7, "أفلا ينصف الله مختاريه الذين يصرخون إليه نهارا وليلا؟ أما يسرع في الاستجابة لهم؟"]]}], "kwAr": "صراخ أولئك العمال", "noteAr": ""}, {"kw": "Lord", "raw": "Rom_9:29; Isa_1:9 *Heb:", "note": "", "refs": [{"l": "Rom 9:29", "n": "", "vs": [[29, "وكما كان إشعياء قد قال سابقا: «لو لم يبق لنا رب الجنود نسلا، لصرنا مثل سدوم وشابهنا عمورة!»"]]}, {"l": "Isa 1:9", "n": "*Heb:", "vs": [[9, "لولا أن الرب القدير حفظ لنا بقية يسيرة، لأصبحنا مثل سدوم وعمورة."]]}], "kwAr": "رب الجنود", "noteAr": ""}], "arS": [["وهذه", ["G2400"]], [" ", []], ["أجرة", ["G3408"]], [" ", []], ["العمال", ["G2040"]], [" الذين ", []], ["حصدوا", ["G270"]], [" ", []], ["حقولكم", ["G5561"]], ["، تلك الأجرة التي مازلتم ", []], ["تحبسونها", ["G650"]], [" عنهم ظلما، إنها ", []], ["تصرخ", ["G2896"]], ["، ", []], ["وصراخ", ["G994"]], [" أولئك العمال ", []], ["أنفسهم", ["G2325"]], [" قد ", []], ["سمعه", ["G1525", "G3775"]], [" ", []], ["رب", ["G2962"]], [" ", []], ["الجنود", ["G4519"]], ["!", []]]}, {"c": 5, "v": 5, "text": "أنتم تعيشون على الأرض عيشة رفاهية وانصراف إلى المباهج واللذات؛ وقد أصبحت قلوبكم سمينة كأنها جاهزة ليوم الذبح.", "groups": [{"kw": "have lived", "raw": "1Sa_25:6, 1Sa_25:36; Job_21:11-15; Psa_17:14, Psa_73:7; Ecc_11:9; Isa_5:11, Isa_5:12; Isa_47:8, Isa_56:12; Amo_6:1, Amo_6:4-6; Luk_16:19, Luk_16:25; 1Ti_5:6; 2Ti_3:4; Jud_1:12; Rev_18:7", "note": "", "refs": [{"l": "1Sa 25:6", "n": "", "vs": [[6, "«أطال الله بقاءك، وجعلك أنت وبيتك وكل مالك سالما."]]}, {"l": "1Sa 25:36", "n": "", "vs": [[36, "فأقبلت أبيجايل إلى نابال، فوجدت أنه قد أقام مأدبة في بيته كمأدبة ملك، وقد أخذته النشوة بعد أن أكثر من احتساء الخمر حتى سكر، فلم تخبره بشيء إطلاقا حتى صباح اليوم التالي."]]}, {"l": "Job 21:11-15", "n": "", "vs": [[11, "يسرحون صبيانهم كسرب، وأطفالهم يرقصون."], [12, "يغنون بالدف والعود ويطربون لصوت المزمار،"], [13, "يقضون أيامهم في الرغد، ثم في لحظة يهبطون إلى الهاوية."], [14, "يقولون للرب: فارقنا فإننا لا نعبأ بمعرفة طرقك."], [15, "من هو القدير حتى نعبده؟ وأي كسب نجنيه إن صلينا إليه؟"]]}, {"l": "Psa 17:14", "n": "", "vs": [[14, "أنقذني بيدك يارب من الناس. من أهل الدنيا الذين نصيبهم هو في هذه الحياة. أنت تملأ بطونهم من خيراتك المخزونة، فيشبع أبناؤهم، ويورثون أولادهم ما يفضل عنهم."]]}, {"l": "Psa 73:7", "n": "", "vs": [[7, "عيونهم جاحظة من كثرة شحم طمعهم. وشرهم تجاوز ما يتصوره القلب."]]}, {"l": "Ecc 11:9", "n": "", "vs": [[9, "افرح أيها الشاب في حداثتك، وليمتعك قلبك في أيام شبابك، واتبع أهواء قلبك، وكل ما تشهده عيناك. ولكن اعلم أنه بسبب هذه الأمور كلها يأتي الله بك إلى كرسي القضاء."]]}, {"l": "Isa 5:11", "n": "", "vs": [[11, "ويل لمن ينهضون في الصباح مبكرين يسعون وراء المسكر حتى ساعة متأخرة من الليل إلى أن تلهبهم الخمر."]]}, {"l": "Isa 5:12", "n": "", "vs": [[12, "يتلهون في مآدبهم بالعود والرباب والدف والناي والخمر، غير مكترثين لأعمال الرب ولا ناظرين إلى صنع يديه،"]]}, {"l": "Isa 47:8", "n": "", "vs": [[8, "فالآن اسمعي هذا أيتها المترفهة المتنعمة المطمئنة، القائلة في قلبها: أنا وحدي وليس هناك غيري، لن أعرف الترمل ولن أثكل"]]}, {"l": "Isa 56:12", "n": "", "vs": [[12, "قائلين: تعالوا نأتي بالخمر، ونشرب مسكرا حتى الثمالة، فالغد يكون مماثلا لهذا اليوم، بل أعظم منه."]]}, {"l": "Amo 6:1", "n": "", "vs": [[1, "ويل للمترفين في صهيون والمطمئنين في جبل السامرة، نبلاء طليعة الأمم الذين يتوافد إليهم شعب إسرائيل."]]}, {"l": "Amo 6:4-6", "n": "", "vs": [[4, "ويل للراقدين فوق أسرة من عاج، المسترخين فوق الأرائك، الآكلين لحم خيرة الحملان والعجول المختارة من وسط المعلف."], [5, "المغنين على صوت الرباب، المخترعين لأنفسهم آلات غناء كداود."], [6, "الشاربين خمرا في كؤوس، المتطيبين بأفضل العطور، ولا يكتئبون على خراب يوسف."]]}, {"l": "Luk 16:19", "n": "", "vs": [[19, "كان هنالك إنسان غني، يلبس الأرجوان وناعم الثياب، ويقيم الولائم المترفة، متنعما كل يوم."]]}, {"l": "Luk 16:25", "n": "", "vs": [[25, "ولكن إبراهيم قال: يابني، تذكر أنك نلت خيراتك كاملة في أثناء حياتك، ولعازر نال البلايا. ولكنه الآن يتعزى هنا، وأنت هناك تتعذب."]]}, {"l": "1Ti 5:6", "n": "", "vs": [[6, "أما تلك التي تعيش منغمسة في اللذات، فقد ماتت، وإن كانت حية."]]}, {"l": "2Ti 3:4", "n": "", "vs": [[4, "خائنين، وقحين، مدعين، محبين للذات أكثر من محبتهم لله،"]]}, {"l": "Jud 1:12", "n": "", "vs": [[12, "إنهم يشتركون معكم في ولائم المحبة دون خجل، ولكنهم كصخور تعيقكم. لا هم لهم سوى تعليف أنفسهم! إنهم يشبهون غيوما بلا مطر تسوقها الرياح، وأشجارا خريفية بلا ثمر، يقتلعها أصحابها، فتكون قد ماتت مرتين."]]}, {"l": "Rev 18:7", "n": "", "vs": [[7, "أنزلوا بها من العذاب والشقاء على قدر ما عظمت نفسها وترفهت. فإنها تقول في نفسها: أنا ملكة على العرش، ولست أرملة، ولن أذوق طعم الحزن."]]}], "kwAr": "تعيشون عيشة رفاهية", "noteAr": ""}, {"kw": "been", "raw": "Isa_3:16; Rom_13:13", "note": "", "refs": [{"l": "Isa 3:16", "n": "", "vs": [[16, "ويقول الرب: «لأن بنات صهيون متغطرسات، يمشين بأعناق مشرئبة متغزلات بعيونهن، متخطرات في سيرهن، مجلجلات بخلاخيل أقدامهن."]]}, {"l": "Rom 13:13", "n": "", "vs": [[13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."]]}], "kwAr": "انصراف إلى المباهج واللذات", "noteAr": ""}, {"kw": "as in", "raw": "Pro_7:14, Pro_17:1; Isa_22:13; Eze_39:17; Rev_19:17, Rev_19:18", "note": "", "refs": [{"l": "Pro 7:14", "n": "", "vs": [[14, "«كان علي أن أقدم ذبائح سلام، فأوفيت اليوم نذوري."]]}, {"l": "Pro 17:1", "n": "", "vs": [[1, "لقمة خبز جافة مصحوبة بالسلام خير من بيت مليء بذبائح ويسوده الخصام."]]}, {"l": "Isa 22:13", "n": "", "vs": [[13, "ولكنكم انهمكتم بالفرح والسرور وذبح الثيران وتضحية الغنم وأكل اللحم وشرب الخمر قائلين: «لنأكل ونشرب لأننا غدا نموت»."]]}, {"l": "Eze 39:17", "n": "", "vs": [[17, "أما أنت ياابن آدم، فهذا ما يعلنه السيد الرب: قل لكل أصناف الطيور ولجميع وحوش البرية اجتمعي وتعالي، احتشدي من كل جهة حول ذبيحتي التي أعدها لك، ذبيحة عظيمة أقيمها على جبال إسرائيل فتأكلين لحما وتشربين دما."]]}, {"l": "Rev 19:17", "n": "", "vs": [[17, "ثم رأيت ملاكا واقفا في الشمس، ينادي الطيور الطائرة في وسط السماء بصوت عال قائلا: «هلمي اجتمعي معا إلى وليمة الله الكبرى!"]]}, {"l": "Rev 19:18", "n": "", "vs": [[18, "تعالي والتهمي لحوم الملوك والقادة والأبطال، والخيول وفرسانها، ولحوم البشر جميعا من أحرار وعبيد، وصغار وكبار»."]]}], "kwAr": "كأنها جاهزة ليوم الذبح", "noteAr": ""}], "arS": [["أنتم تعيشون على ", []], ["الأرض", ["G1093"]], [" ", []], ["عيشة رفاهية", ["G5171"]], [" وانصراف إلى المباهج ", []], ["واللذات", ["G4684"]], ["؛ وقد أصبحت ", []], ["قلوبكم", ["G2588"]], [" ", []], ["سمينة", ["G5142"]], [" كأنها جاهزة ", []], ["ليوم", ["G2250"]], [" ", []], ["الذبح", ["G4967"]], [".", []]]}, {"c": 5, "v": 6, "text": "والبريء حكمتم عليه وقتلتموه، وهو لا يقاومكم!", "groups": [{"kw": "have", "raw": "Jam_2:6; Mat_21:38, Mat_23:34, Mat_23:35, Mat_27:20,Mat_27:24, Mat_27:25; Joh_16:2, Joh_16:3; Act_2:22, Act_2:23; Act_3:14, Act_3:15, Act_4:10-12, Act_7:52, Act_13:27, Act_13:28, Act_22:14; 1Th_2:15, 1Th_2:16", "note": "", "refs": [{"l": "Jam 2:6", "n": "", "vs": [[6, "ولكنكم أنتم عاملتم الفقير معاملة مهينة. ألا تعرفون أن الأغنياء هم الذين يتسلطون عليكم ويجرونكم إلى المحاكم،"]]}, {"l": "Mat 21:38", "n": "", "vs": [[38, "فما إن رأى المزارعون الابن حتى قال بعضهم لبعض: هذا هو الوريث! تعالوا نقتله فنستولي على ميراثه."]]}, {"l": "Mat 23:34", "n": "", "vs": [[34, "لذلك: ها أنا أرسل إليكم أنبياء وحكماء ومعلمين، فبعضهم تقتلون وتصلبون، وبعضهم تجلدون في مجامعكم، وتطاردونهم من مدينة إلى أخرى."]]}, {"l": "Mat 23:35", "n": "", "vs": [[35, "وبهذا يقع عليكم كل دم زكي سفك على الأرض: من دم هابيل البار إلى دم زكريا بن برخيا الذي قتلتموه بين الهيكل والمذبح."]]}, {"l": "Mat 27:20", "n": "", "vs": [[20, "ولكن رؤساء الكهنة والشيوخ حرضوا الجموع أن يطالبوا بإطلاق باراباس وقتل يسوع."]]}, {"l": "Mat 27:24", "n": "", "vs": [[24, "فلما رأى بيلاطس أنه لا فائدة، وأن فتنة تكاد تنشب بالأحرى، أخذ ماء وغسل يديه أمام الجمع، وقال: «أنا بريء من دم هذا البار. فانظروا أنتم في الأمر!»"]]}, {"l": "Mat 27:25", "n": "", "vs": [[25, "فأجاب الشعب بأجمعه: «ليكن دمه علينا وعلى أولادنا!»"]]}, {"l": "Joh 16:2", "n": "", "vs": [[2, "ستطردون خارج المجامع، بل سيأتي وقت يظن فيه من يقتلكم أنه يؤدي خدمة لله."]]}, {"l": "Joh 16:3", "n": "", "vs": [[3, "وهم يفعلون هذا بكم لأنهم لم يعرفوا أبي، ولا عرفوني."]]}, {"l": "Act 2:22", "n": "", "vs": [[22, "فيا بني إسرائيل، اسمعوا هذا الكلام: إن يسوع الناصري رجل أيده الله بمعجزات وعجائب وعلامات أجراها على يده بينكم، كما تعلمون."]]}, {"l": "Act 2:23", "n": "", "vs": [[23, "ومع ذلك فقد سمح الله ، وفقا لمشيئته المحتومة وعلمه السابق، أن تقبضوا عليه وتصلبوه وتقتلوه بأيدي الأثمة."]]}, {"l": "Act 3:14", "n": "", "vs": [[14, "أنتم أنكرتم القدوس البار وطلبتم العفو عن رجل قاتل،"]]}, {"l": "Act 3:15", "n": "", "vs": [[15, "وقتلتم واهب الحياة. ولكن الله أقامه من بين الأموات ونحن شهود لذلك."]]}, {"l": "Act 4:10-12", "n": "", "vs": [[10, "فاعلموا جميعا، وليعرف شعب إسرائيل كله، أنه باسم يسوع المسيح الناصري الذي صلبتموه أنتم، والذي أقامه الله من بين الأموات، باسمه يقف هذا الكسيح أمامكم في تمام الصحة!"], [11, "يسوع هذا هو الحجر الذي رفضتموه أيها البناة، وهو نفسه صار حجر الزاوية الأساسي،"], [12, "وليس بأحد غيره الخلاص، إذ ليس تحت السماء اسم آخر قدمه الله للبشر به يجب أن نخلص!»"]]}, {"l": "Act 7:52", "n": "", "vs": [[52, "فأي نبي نجا من اضطهادهم وقد قتلوا الذين أنبأوا بمجيء البار الذي سلمتموه أنتم وقتلتموه!"]]}, {"l": "Act 13:27", "n": "", "vs": [[27, "فإن أهل أورشليم ورؤساءهم عملوا على إتمام ما يقرأ عليكم كل يوم سبت من نبوءات، وهم لا يعلمون. إذ حكموا على يسوع بالموت،"]]}, {"l": "Act 13:28", "n": "", "vs": [[28, "ومع أنهم لم يثبتوا عليه أي جرم يستحق الموت، طلبوا من بيلاطس أن يقتله."]]}, {"l": "Act 22:14", "n": "", "vs": [[14, "فقال: إله آبائنا اختارك مسبقا لتعرف إرادته، وترى البار وتسمع صوتا من فمه."]]}, {"l": "1Th 2:15", "n": "", "vs": [[15, "الذين قتلوا الرب يسوع والأنبياء واضطهدونا نحن أيضا، وهم لا يرضون الله ويعادون الناس جميعا،"]]}, {"l": "1Th 2:16", "n": "", "vs": [[16, "إذ يمنعوننا من تبشير الأمم ليخلصوا، وبذلك يستكملون خطاياهم كل حين، ولكن الغضب قد حل عليهم إلى الغاية."]]}], "kwAr": "حكمتم عليه وقتلتموه", "noteAr": ""}, {"kw": "and he", "raw": "Isa_53:7; Mat_5:39, Mat_26:53, Mat_26:54; Luk_22:51-53; Joh_19:9-11; Act_8:32; 1Pe_2:22, 1Pe_2:23", "note": "", "refs": [{"l": "Isa 53:7", "n": "", "vs": [[7, "ظلم وأذل، ولكنه لم يفتح فاه، بل كشاة سيق إلى الذبح، وكنعجة صامتة أمام جازيها لم يفتح فاه."]]}, {"l": "Mat 5:39", "n": "", "vs": [[39, "أما أنا فأقول لكم: لا تقاوموا الشر بمثله، بل من لطمك على خدك الأيمن، فأدر له الخد الآخر؛"]]}, {"l": "Mat 26:53", "n": "", "vs": [[53, "أم تظن أني لا أقدر الآن أن أطلب إلى أبي فيرسل لي أكثر من اثني عشر جيشا من الملائكة؟"]]}, {"l": "Mat 26:54", "n": "", "vs": [[54, "ولكن كيف يتم الكتاب حيث يقول إن ما يحدث الآن لابد أن يحدث؟ »"]]}, {"l": "Luk 22:51-53", "n": "", "vs": [[51, "فأجاب يسوع قائلا: «قفوا عند هذا الحد!» ولمس أذنه فشفاه."], [52, "وقال يسوع لرؤساء الكهنة وقواد حرس الهيكل والشيوخ، الذين أقبلوا عليه: «أكما على لص خرجتم بالسيوف والعصي؟"], [53, "عندما كنت معكم كل يوم في الهيكل، لم تمدوا أيديكم علي. ولكن هذه الساعة لكم، والسلطة الآن للظلام!»"]]}, {"l": "Joh 19:9-11", "n": "", "vs": [[9, "ودخل إلى قصره وسأل يسوع: «من أين أنت؟» فلم يجبه يسوع بشيء."], [10, "فقال له بيلاطس: «أما تكلمني؟ ألا تعلم أن لي سلطة أن  [[10, "وتنتظروا من السماوات ابنه الذي أقامه من بين الأموات، يسوع مخلصنا من الغضب الآتي."]]}, {"l": "2Th 3:5", "n": "", "vs": [[5, "وليهد الله قلوبكم إلى ما لدى الله من المحبة ولدى المسيح من الصبر!"]]}, {"l": "Heb 10:35-37", "n": "", "vs": [[35, "إذن، لا تتخلوا عن ثقتكم بالرب. فإن لها مكافأة عظيمة."], [36, "إنكم تحتاجون إلى الصبر لتعملوا إرادة الله، فتنالوا البركة التي وعدتم بها."], [37, "فقريبا جدا، سيأتي الآتي ولا يتمهل."]]}], "kwAr": "فاصبروا أنتم إذن", "noteAr": ""}, {"kw": "stablish", "raw": "Psa_27:14", "note": "", "refs": [{"l": "Psa 27:14", "n": "", "vs": [[14, "انتظر الرب. تقو وليتشجع قلبك. وانتظر الرب دائما."]]}], "kwAr": "شددوا قلوبكم", "noteAr": ""}, {"kw": "for", "raw": "Jam_5:9; Phi_4:5; Heb_10:25-37; 1Pe_4:7; Rev_22:20", "note": "", "refs": [{"l": "Jam 5:9", "n": "", "vs": [[9, "أيها الإخوة، لا تتذمروا بعضكم على بعض، لكي لا يصدر الحكم ضدكم. تذكروا دائما أن الديان قريب جدا، إنه أمام الباب."]]}, {"l": "Phi 4:5", "n": "", "vs": [[5, "ليكن طول بالكم معروفا لدى الناس جميعا. إن الرب قريب."]]}, {"l": "Heb 10:25-37", "n": "", "vs": [[25, "وعلينا ألا ننقطع عن الاجتماع معا، كما تعود بعضكم أن يفعل. إنما، يجدر بكم أن تحثوا وتشجعوا بعضكم بعضا، وتواظبوا على هذا بقدر ما ترون ذلك اليوم يقترب."], [26, "فإن أخطأنا عمدا برفضنا للمسيح بعد حصولنا على معرفة الحق، لا تبقى هناك ذبيحة لغفران الخطايا،"], [27, "بل انتظار العقاب الأكيد في لهيب النار التي ستلتهم المتمردين. ويا له من انتظار مخيف!"], [28, "تعلمون أن من خالف شريعة موسى، كان عقابه الموت دون رحمة، على أن يؤيد مخالفته شاهدان أو ثلاثة."], [29, "ففي ظنكم، كم يكون أشد كثيرا ذلك العقاب الذي يستحقه من يدوس ابن الله، إذ يعتبر أن دم العهد، الذي يتقدس به، هو دم نجس، وبذلك يهين روح النعمة؟"], [30, "فنحن نعرف من قال: «لي الانتقام، أنا أجازي، يقول الرب!» وأيضا: «إن الرب سوف يحاكم شعبه!»"], [31, "حقا ما أرهب الوقوع في يدي الله الحي!"], [32, "لا تنسوا أبدا تلك الأيام الماضية التي فيها، بعدما أشرق عليكم نور الإيمان بالمسيح، صبرتم على جهاد مرير طويل، إذ قاسيتم كثيرا من الآلام."], [33, "وذلك عندما تعرضتم للإهانات والمضايقات من جهة، وعندما شاركتم الذين عوملوا مثل هذه المعاملة من جهة أخرى."], [34, "فقد تعاطفتم مع المسجونين، كما تقبلتم نهب ممتلكاتكم بفرح، علما منكم بأن لكم في السماء ثروة أفضل وأبقى."], [35, "إذن، لا تتخلوا عن ثقتكم بالرب. فإن لها مكافأة عظيمة."], [36, "إنكم تحتاجون إلى الصبر لتعملوا إرادة الله، فتنالوا البركة التي وعدتم بها."], [37, "فقريبا جدا، سيأتي الآتي ولا يتمهل."]]}, {"l": "1Pe 4:7", "n": "", "vs": [[7, "إن نهاية كل شيء قد صارت قريبة. فتعقلوا إذن، وكونوا متنبهين لرفع الصلاة دائما."]]}, {"l": "Rev 22:20", "n": "", "vs": [[20, "والذي يشهد بهذه الأمور يقول: «نعم! أنا آت سريعا»."]]}], "kwAr": "عودة الرب قد صارت قريبة", "noteAr": ""}], "arS": [["فاصبروا", ["G3114"]], [" ", []], ["أنتم", ["G5210"]], [" إذن، ", []], ["وشددوا", ["G4741"]], [" ", []], ["قلوبكم", ["G2588"]], [" ", []], ["لأن", ["G3754"]], [" ", []], ["عودة", ["G3952"]], [" ", []], ["الرب", ["G2962"]], [" قد صارت ", []], ["قريبة", ["G1448"]], [".", []]]}, {"c": 5, "v": 9, "text": "أيها الإخوة، لا تتذمروا بعضكم على بعض، لكي لا يصدر الحكم ضدكم. تذكروا دائما أن الديان قريب جدا، إنه أمام الباب.", "groups": [{"kw": "Grudge not", "raw": "or, Groan not, or, grieve not, Jam_4:11; Lev_19:18; Psa_59:15; Mar_6:19 *marg. 2Co_9:7; Gal_5:14, Gal_5:26; 1Pe_4:9", "note": "or, Groan not, or, grieve not, Jam_4:11; Lev_19:18; Psa_59:15; Mar_6:19 *marg. 2Co_9:7; Gal_5:14, Gal_5:26; 1Pe_4:9", "refs": [{"l": "Jam 4:11", "n": "", "vs": [[11, "وياإخوتي، لا تذموا بعضكم بعضا. فمن يفعل هذا ويحكم على أخيه، يطعن في شريعة الله ويحكم عليها. فإن كنت تحكم على الشريعة، لا تكون عاملا بها بل تجعل نفسك قاضيا لها."]]}, {"l": "Lev 19:18", "n": "", "vs": [[18, "لا تنتقم ولا تحقد على أحد أبناء شعبك، ولكن تحب قريبك كما تحب نفسك، فأنا الرب."]]}, {"l": "Psa 59:15", "n": "", "vs": [[15, "يهيمون متشردين طلبا للطعام. وإن لم يشبعوا يدمدمون."]]}, {"l": "Mar 6:19", "n": "*marg.", "vs": [[19, "فكانت هيروديا ناقمة على يوحنا، وتتمنى أن تقتله، ولكنها لم تستطع."]]}, {"l": "2Co 9:7", "n": "", "vs": [[7, "فليتبرع كل واحد بما نوى في قلبه، لا بأسف ولا عن اضطرار، لأن الله يحب ال
