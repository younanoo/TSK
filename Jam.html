["، لكي ", []], ["لا", ["G3363"]], [" يصدر الحكم ", []], ["ضدكم", ["G2632"]], [". تذكروا ", []], ["دائما", ["G2400"]], [" أن ", []], ["الديان", ["G2923"]], [" قريب جدا، إنه ", []], ["أمام", ["G4253"]], [" ", []], ["الباب", ["G2374"]], [".", []]]}, {"c": 5, "v": 10, "text": "واقتدوا، ياإخوتي، في احتمال الآلام والصبر عليها، بالأنبياء الذين تكلموا باسم الرب.", "groups": [{"kw": "who", "raw": "Isa_39:8; Jer_23:22, Jer_26:16; Act_3:21; Heb_13:7", "note": "", "refs": [{"l": "Isa 39:8", "n": "", "vs": [[8, "فقال حزقيا لإشعياء: «صالح هو قول الرب الذي أعلنته». ثم حدث نفسه: «ليكن فقط سلام وأمن في عهدي»."]]}, {"l": "Jer 23:22", "n": "", "vs": [[22, "لو مثلوا حقا في مجلسي لبلغوا كلامي لشعبي، ولكانوا ردوهم عن مساوئهم وعن شر أعمالهم."]]}, {"l": "Jer 26:16", "n": "", "vs": [[16, "عندئذ قال الرؤساء وكل الشعب للكهنة والأنبياء: «هذا الرجل لا يستحق حكم الموت لأنه خاطبنا باسم الرب إلهنا»."]]}, {"l": "Act 3:21", "n": "", "vs": [[21, "إذ لابد أن يبقى المسيح في السماء حتى يأتي الزمن الذي يتم فيه الإصلاح الشامل لكل شيء كما أوحى الله إلى أنبيائه الأتقياء منذ القدم."]]}, {"l": "Heb 13:7", "n": "", "vs": [[7, "اذكروا دائما مرشديكم الذين علموكم كلام الله. تأملوا سيرتهم حتى النهاية، واقتدوا بإيمانهم."]]}], "kwAr": "الأنبياء الذين تكلموا باسم الرب", "noteAr": ""}, {"kw": "for", "raw": "2Ch_36:16; Jer_2:30; Mat_5:11, Mat_5:12, Mat_21:34-39, Mat_23:34-37; Luk_6:23, Luk_13:34; Act_7:52; 1Th_2:14, 1Th_2:15; Heb_11:32-38", "note": "", "refs": [{"l": "2Ch 36:16", "n": "", "vs": [[16, "فكانوا يهزأون برسل الله، ورفضوا كلامه، واستهانوا بأنبيائه، حتى ثار غضب الرب على شعبه وامتنع كل شفاء!"]]}, {"l": "Jer 2:30", "n": "", "vs": [[30, "عبثا عاقبت بنيكم، فهم أبوا التقويم وافترست سيوفكم أنبياءكم كأسد كاسر."]]}, {"l": "Mat 5:11", "n": "", "vs": [[11, "طوبى لكم متى أهانكم الناس واضطهدوكم، وقالوا فيكم من أجلي كل سوء كاذبين."]]}, {"l": "Mat 5:12", "n": "", "vs": [[12, "افرحوا وتهللوا، فإن مكافأتكم في السماوات عظيمة. فإنهم هكذا اضطهدوا الأنبياء من قبلكم!"]]}, {"l": "Mat 21:34-39", "n": "", "vs": [[34, "ولما حان أوان القطاف، أرسل عبيده إلى المزارعين ليتسلم ثمر الكرم."], [35, "فقبض المزارعون على العبيد، فضربوا أحدهم، وقتلوا غيره، ورجموا الآخر بالحجارة."], [36, "ثم أرسل رب البيت ثانية عبيدا آخرين أكثر عددا من الأولين. ففعل المزارعون بهؤلاء ما فعلوه بأولئك."], [37, "وأخيرا أرسل إليهم ابنه، قائلا: سيهابون ابني!"], [38, "فما إن رأى المزارعون الابن حتى قال بعضهم لبعض: هذا هو الوريث! تعالوا نقتله فنستولي على ميراثه."], [39, "ثم قبضوا عليه، وطرحوه خارج الكرم، وقتلوه!"]]}, {"l": "Mat 23:34-37", "n": "", "vs": [[34, "لذلك: ها أنا أرسل إليكم أنبياء وحكماء ومعلمين، فبعضهم تقتلون وتصلبون، وبعضهم تجلدون في مجامعكم، وتطاردونهم من مدينة إلى أخرى."], [35, "وبهذا يقع عليكم كل دم زكي سفك على الأرض: من دم هابيل البار إلى دم زكريا بن برخيا الذي قتلتموه بين الهيكل والمذبح."], [36, "الحق أقول لكم: إن عقاب ذلك كله سينزل بهذا الجيل."], [37, "ياأورشليم، ياأورشليم، ياقاتلة الأنبياء وراجمة المرسلين إليها! كم مرة أردت أن أجمع أولادك كما تجمع الدجاجة فراخها تحت جناحيها، فلم تريدوا!"]]}, {"l": "Luk 6:23", "n": "", "vs": [[23, "افرحوا في ذلك اليوم وتهللوا، فها إن مكافأتكم في السماء عظيمة: لأنه هكذا عامل آباؤهم الأنبياء."]]}, {"l": "Luk 13:34", "n": "", "vs": [[34, "ياأورشليم، ياأورشليم، ياقاتلة الأنبياء وراجمة المرسلين إليها؛ كم مرة أردت أن أجمع أولادك معا كما تجمع الدجاجة فراخها تحت جناحيها، ولكنكم لم تريدوا!"]]}, {"l": "Act 7:52", "n": "", "vs": [[52, "فأي نبي نجا من اضطهادهم وقد قتلوا الذين أنبأوا بمجيء البار الذي سلمتموه أنتم وقتلتموه!"]]}, {"l": "1Th 2:14", "n": "", "vs": [[14, "فإنكم، أيها الإخوة، قد صرتم على مثال كنائس الله التي في منطقة اليهودية والتي هي في المسيح يسوع. فأنتم أيضا قاسيتم على أيدي بني جنسكم ما قاسوه هم على أيدي اليهود"]]}, {"l": "1Th 2:15", "n": "", "vs": [[15, "الذين قتلوا الرب يسوع والأنبياء واضطهدونا نحن أيضا، وهم لا يرضون الله ويعادون الناس جميعا،"]]}, {"l": "Heb 11:32-38", "n": "", "vs": [[32, "وهل من حاجة بعد لمزيد من الأمثلة؟ إن الوقت لا يتسع لي حتى أسرد أخبار الإيمان عن: جدعون وباراق وشمشون ويفتاح وداود وصموئيل والأنبياء."], [33, "فبالإيمان، تغلب هؤلاء على ممالك الأعداء، وحكموا حكما عادلا ونالوا ما وعدهم به الله . وبه، أطبقوا أفواه الأسود،"], [34, "وأبطلوا قوة النار، ونجوا من الموت قتلا بالسيف. وبه أيضا نالوا القوة بعد ضعف، فصاروا أشداء في المعارك، وردوا جيوشا غريبة على أعقابها."], [35, "وبالإيمان، استرجعت بعض النساء أمواتهن بعدما أعيدوا إلى الحياة. وبه، تحمل كثيرون العذاب والضرب، وماتوا رافضين النجاة لعلمهم أنهم سوف يقومون إلى حياة أفضل."], [36, "وكثيرون غيرهم تحملوا المحاكمات الظالمة تحت الإهانة والجلد، والإلقاء في السجون مقيدين بالسلاسل."], [37, "ومنهم من حوكموا فماتوا رجما بالحجارة، أو نشرا بالمنشار، أو ذبحا بالسيف. وبعضهم، تشردوا متسترين بجلود الغنم والمعزى، يعانون من الحاجة والضيق والظلم،"], [38, "ولم يكن العالم يستحقهم، تائهين في البراري والجبال والمغاور والكهوف."]]}], "kwAr": "في احتمال الآلام والصبر", "noteAr": ""}], "arS": [["واقتدوا", ["G2983", "G5262"]], ["، ", []], ["ياإخوتي", ["G3450", "G80"]], ["، في احتمال ", []], ["الآلام", ["G2552"]], [" ", []], ["والصبر", ["G3115"]], [" عليها، ", []], ["بالأنبياء", ["G4396"]], [" الذين ", []], ["تكلموا", ["G2980"]], [" ", []], ["باسم", ["G3686"]], [" ", []], ["الرب", ["G2962"]], [".", []]]}, {"c": 5, "v": 11, "text": "فنحن نقول عن الصابرين على الألم: «طوبى لهم!» وقد سمعتم بصبر أيوب، ورأيتم كيف عامله الرب في النهاية. وهذا يبين أن الرب كثير الرحمة والشفقة.", "groups": [{"kw": "we count", "raw": "Jam_1:12; Psa_94:12; Mat_5:10,Mat_5:11, Mat_10:22; Heb_3:6, Heb_3:14, Heb_10:39", "note": "", "refs": [{"l": "Jam 1:12", "n": "", "vs": [[12, "طوبى لمن يتحمل المحنة بصبر. فإنه، بعد أن يجتاز الامتحان بنجاح، سينال «إكليل الحياة» الذي وعد به الرب محبيه!"]]}, {"l": "Psa 94:12", "n": "", "vs": [[12, "طوبى للإنسان الذي تؤدبه، وتعلمه من شريعتك يارب!"]]}, {"l": "Mat 5:10", "n": "", "vs": [[10, "طوبى للمضطهدين من أجل البر، فإن لهم ملكوت السماوات."]]}, {"l": "Mat 5:11", "n": "", "vs": [[11, "طوبى لكم متى أهانكم الناس واضطهدوكم، وقالوا فيكم من أجلي كل سوء كاذبين."]]}, {"l": "Mat 10:22", "n": "", "vs": [[22, "وتكونون مكروهين لدى الجميع من أجل اسمي. ولكن من يثبت إلى النهاية، هو الذي يخلص."]]}, {"l": "Heb 3:6", "n": "", "vs": [[6, "أما المسيح، فهو أمين بصفته ابنا يترَأس على البيت. وهذا البيت هو نحن المؤمنين، على أن نتمسك بالثقة والافتخار برجائنا تمسكا ثابتا حتى النهاية."]]}, {"l": "Heb 3:14", "n": "", "vs": [[14, "فإن تمسكنا دائما بالثقة التي انطلقنا بها في البداية، وأبقيناها ثابتة إلى النهاية، نكون مشاركين للمسيح."]]}, {"l": "Heb 10:39", "n": "", "vs": [[39, "ولكننا نحن لسنا من أهل الارتداد المؤدي إلى الهلاك، بل من أهل الإيمان المؤدي إلى خلاص نفوسنا!"]]}], "kwAr": "طوبى لهم", "noteAr": ""}, {"kw": "Ye", "raw": "Job_1:21, 22-2:9, Job_2:10, Job_13:15, Job_13:16, Job_23:10", "note": "", "refs": [{"l": "Job 1:21", "n": "", "vs": [[21, "وقال: «عريانا خرجت من بطن أمي وعريانا أعود إلى هناك. الرب أعطى والرب أخذ، فليكن اسم الرب مباركا»."]]}, {"l": "Job 2:9", "n": "", "vs": [[9, "فقالت له زوجته: «أما زلت معتصما بكمالك؟ جدف على الله ومت»."]]}, {"l": "Job 2:10", "n": "", "vs": [[10, "فأجابها: «أنت تتكلمين كالجاهلات! أنقبل الخير من عند الله والشر لا نقبل؟». في هذا كله لم ترتكب شفتا أيوب خطأ في حق الله."]]}, {"l": "Job 13:15", "n": "", "vs": [[15, "فها هو حتما يقضي علي ولا أمل لي. ومع ذلك فإني أبسط حجتي لأزكي طريقي أمامه."]]}, {"l": "Job 13:16", "n": "", "vs": [[16, "لأن هذا سبيل خلاصي، إذ لا يمثل الفاجر في حضرته."]]}, {"l": "Job 23:10", "n": "", "vs": [[10, "ولكنه يعرف الطريق الذي أسلكه، وإذا امتحنني أخرج كالذهب"]]}], "kwAr": "سمعتم بصبر أيوب", "noteAr": ""}, {"kw": "and have", "raw": "Job_42:10-17; Psa_37:37; Ecc_7:8; 1Pe_1:6, 1Pe_1:7, 1Pe_1:13; 2Pe_2:9", "note": "", "refs": [{"l": "Job 42:10-17", "n": "", "vs": [[10, "وعندما صلى أيوب من أجل أصدقائه رده الرب من عزلة منفاه، وضاعف كل ما كان له من قبل."], [11, "وأقبل عليه إخوته وأخواته وكل معارفه السابقين، وتناولوا معه طعاما في بيته، وأبدوا له كل رفق، وعزوه عن كل ما أنزله به الرب من بلوى، وقدم له كل واحد منهم بعض المال وخاتما من ذهب."], [12, "وبارك الرب آخرة أيوب أكثر من أولاه، فأصبح له أربعة عشر ألف خروف وستة آلاف من الإبل وألف زوج من البقر وألف أتان."], [13, "ورزقه الله سبعة بنين وثلاث بنات،"], [14, "فدعا الأولى يميمة، والثانية قصيعة والثالثة قرن هفوك."], [15, "ولم توجد في كل البلاد نساء جميلات مثل بنات أيوب، ووهبهن أبوهن ميراثا بين إخوتهن."], [16, "وعاش أيوب بعد تجربته مئة وأربعين سنة، واكتحلت عيناه برؤية أبنائه وأحفاده إلى الجيل الرابع."], [17, "ثم مات أيوب شيخا، وقد شبع من الأيام."]]}, {"l": "Psa 37:37", "n": "", "vs": [[37, "لاحظ الكامل وانظر المستقيم، فإن نهاية ذلك الإنسان تكون سلاما."]]}, {"l": "Ecc 7:8", "n": "", "vs": [[8, "نهاية أمر خير من بدايته، والصبر خير من العجرفة."]]}, {"l": "1Pe 1:6", "n": "", "vs": [[6, "وهذا يدعوكم إلى الابتهاج، مع أنه لابد لكم الآن من الحزن فترة قصيرة تحت وطأة التجارب المتنوعة!"]]}, {"l": "1Pe 1:7", "n": "", "vs": [[7, "إلا أن غاية هذه التجارب هي اختبار حقيقة إيمانكم. فكما تختبر النار الذهب وتنقيه، تختبر التجارب حقيقة إيمانكم، وهو أثمن جدا من الذهب الفاني. وهكذا، يكون إيمانكم مدعاة مدح وإكرام وتمجيد لكم، عندما يعود يسوع المسيح ظاهرا بمجده."]]}, {"l": "1Pe 1:13", "n": "", "vs": [[13, "لذلك اجعلوا أذهانكم متنبهة دائما، وتيقظوا، وعلقوا رجاءكم كله على النعمة التي ستكون من نصيبكم عندما يعود يسوع المسيح ظاهرا بمجده!"]]}, {"l": "2Pe 2:9", "n": "", "vs": [[9, "وهكذا نرى أن الرب يعرف أن ينقذ الأتقياء من المحنة، ويحفظ الأشرار محبوسين ليحكم عليهم بالعقاب في يوم الدينونة."]]}], "kwAr": "رأيتم كيف عامله الرب في النهاية", "noteAr": ""}, {"kw": "the Lord is", "raw": "Exo_34:6; Num_14:18; 1Ch_21:13; 2Ch_30:9; Neh_9:17, Neh_9:31; Psa_25:6, Psa_25:7; Psa_51:1, Psa_78:38, Psa_86:5, Psa_86:15, Psa_103:8, Psa_103:13, Psa_116:5, Psa_119:132, 136:1-26; Psa_145:8; Isa_55:6, Isa_55:7, Isa_63:7, Isa_63:9; Lam_3:22; Dan_9:9, Dan_9:18, Dan_9:19; Joe_2:13; Jon_4:2; Mic_7:18; Luk_1:50, Luk_6:36; Rom_2:4; Eph_1:6, Eph_2:4", "note": "", "refs": [{"l": "Exo 34:6", "n": "", "vs": [[6, "وعبر من أمام موسى مناديا: «أنا الرب. الرب إله رؤوف رحيم، بطيء الغضب وكثير الإحسان والوفاء."]]}, {"l": "Num 14:18", "n": "", "vs": [[18, "الرب طويل الأناة، وافر الرحمة، يغفر الذنب والسيئة. لكنه لا يبريء، بل يفتقد ذنب الآباء في الأبناء إلى الجيل الثالث والرابع."]]}, {"l": "1Ch 21:13", "n": "", "vs": [[13, "فأجاب داود جادا: «إنني واقع في كرب عظيم، ولكن خير لي أن أستسلم لقبضة الرب، لأنه واسع الرحمة، من أن أقع تحت رحمة إنسان»."]]}, {"l": "2Ch 30:9", "n": "", "vs": [[9, "لأن رجوعكم إلى الرب يجعل إخوتكم وأبناءكم يلقون رحمة من آسريهم فيرجعون إلى هذه الأرض، لأن الرب إلهكم رؤوف رحيم، ولا يحول وجهه عنكم إن رجعتم إليه»."]]}, {"l": "Neh 9:17", "n": "", "vs": [[17, "وأبوا أن يسمعوا، وتجاهلوا عجائبك التي أجريتها لهم، وأغلظوا قلوبهم، ثم تمردوا ونصبوا عليهم قائدا ليرجعوا إلى عبوديتهم، ولكنك إله غفور وحنان ورحيم وحكيم وكثير الإحسان، فلم تتخل عنهم،"]]}, {"l": "Neh 9:31", "n": "", "vs": [[31, "ولكن من أجل مراحمك العميمة لم تبدهم، ولم تتخل عنهم، لأنك إله حنان رحيم."]]}, {"l": "Psa 25:6", "n": "", "vs": [[6, "رب، اذكر مراحمك وإحساناتك لأنها منذ الأزل."]]}, {"l": "Psa 25:7", "n": "", "vs": [[7, "لا تذكر خطايا صباي التي ارتكبتها، ولا معاصي، بل اذكرني وفقا لرحمتك ومن أجل جودتك يارب."]]}, {"l": "Psa 51:1", "n": "", "vs": [[1, "ارحمني ياالله حسب رحمتك، وامح معاصي حسب كثرة رأفتك."]]}, {"l": "Psa 78:38", "n": "", "vs": [[38, "لكنه كان رحيما، فعفا عن الإثم ولم يهلكهم. وكثيرا ما كبح غضبه عنهم ولم يضرم كل سخطه."]]}, {"l": "Psa 86:5", "n": "", "vs": [[5, "لأنك أنت يارب طيب وغفور، وكثير الرحمة لجميع الذين يدعونك."]]}, {"l": "Psa 86:15", "n": "", "vs": [[15, "إنما أنت يارب إله رحيم ورؤوف وبطيء الغضب ووافر الرحمة والحق."]]}, {"l": "Psa 103:8", "n": "", "vs": [[8, "الرب رحيم ورؤوف، بطيء الغضب ووافر الرحمة."]]}, {"l": "Psa 103:13", "n": "", "vs": [[13, "مثلما يعطف الأب على بنيه يعطف الرب على أتقيائه."]]}, {"l": "Psa 116:5", "n": "", "vs": [[5, "الرب حنون وبار. إلهنا رحيم."]]}, {"l": "Psa 119:132", "n": "", "vs": [[132, "التفت إلي وتحنن علي، كما تفعل دائما مع محبيك."]]}, {"l": "Psa 136:1-26", "n": "", "vs": [[1, "ارفعوا الشكر للرب لأن رحمته إلى الأبد تدوم."], [2, "ارفعوا الشكر لإله الآلهة، لأن رحمته إلى الأبد تدوم."], [3, "ارفعوا الشكر لرب الأرباب، لأن رحمته إلى الأبد تدوم."], [4, "الصانع العجائب العظام وحده، لأن رحمته إلى الأبد تدوم."], [5, "الصانع السماوات بحكمة، لأن رحمته إلى الأبد تدوم."], [6, "الباسط الأرض فوق المياه، لأن رحمته إلى الأبد تدوم."], [7, "الصانع الأنوار العظيمة لأن رحمته إلى الأبد تدوم."], [8, "الشمس لتضيء نهارا، لأن رحمته إلى الأبد تدوم."], [9, "والقمر والكواكب لتنير ليلا، لأن رحمته إلى الأبد تدوم."], [10, "الذي ضرب مصر مع أبكارها، لأن رحمته إلى الأبد تدوم."], [11, "وأخرج بني إسرائيل من وسطهم، لأن رحمته إلى الأبد تدوم."], [12, "بيد شديدة وذراع قديرة، لأن رحمته إلى الأبد تدوم."], [13, "الذي فلق البحر الأحمر إلى شطرين، لأن رحمته إلى الأبد تدوم."], [14, "وأجاز الإسرائيليين في وسطه، لأن رحمته إلى الأبد تدوم."], [15, "ودفع فرعون وجيشه إلى البحر، لأن رحمته إلى الأبد تدوم."], [16, "الذي قاد شعبه في البرية، لأن رحمته إلى الأبد تدوم."], [17, "الذي أطاح بملوك عظماء. لأن رحمته إلى الأبد تدوم."], [18, "وقتل ملوكا ذوي شهرة، لأن رحمته إلى الأبد تدوم."], [19, "كسيحون ملك الأموريين، لأن رحمته إلى الأبد تدوم."], [20, "وعوج ملك باشان، لأن رحمته إلى الأبد تدوم."], [21, "وأعطى أرضهم ميراثا، لأن رحمته إلى الأبد تدوم."], [22, "ميراثا لإسرائيل عبده، لأن رحمته إلى الأبد تدوم."], [23, "الذي ذكرنا في مذلتنا، لأن رحمته إلى الأبد تدوم."], [24, "وخلصنا من أعدائنا، لأن رحمته إلى الأبد تدوم."], [25, "الذي يرزق خبزا كل بشر لأن رحمته إلى الأبد تدوم."], [26, "ارفعوا الشكر لإله السماوات، لأن رحمته إلى الأبد تدوم."]]}, {"l": "Psa 145:8", "n": "", "vs": [[8, "الرب حنان ورحيم، بطيء الغضب ووافر الرأفة."]]}, {"l": "Isa 55:6", "n": "", "vs": [[6, "اطلبوا الرب مادام موجودا، ادعوه وهو قريب."]]}, {"l": "Isa 55:7", "n": "", "vs": [[7, "ليترك الشرير طريقه والأثيم أفكاره، وليتب إلى الرب فيرحمه، وليرجع إلى إلهنا لأنه يكثر الغفران."]]}, {"l": "Isa 63:7", "n": "", "vs": [[7, "ألهج برأفات الرب وتسابيحه وإحساناته التي أغدقها على بيت إسرائيل بفضل خيره ورحمته."]]}, {"l": "Isa 63:9", "n": "", "vs": [[9, "فتضايق في كل ضيقاتهم، وملاك حضرته أنقذهم، وبفضل محبته وحنانه افتداهم ورفعهم وحملهم طوال الأيام الغابرة."]]}, {"l": "Lam 3:22", "n": "", "vs": [[22, "من إحسانات الرب أننا لم نفن، لأن مراحمه لا تزول."]]}, {"l": "Dan 9:9", "n": "", "vs": [[9, "إنما للرب إلهنا الرحمة والمغفرة لأننا عصيناك."]]}, {"l": "Dan 9:18", "n": "", "vs": [[18, "أرهف أذنك ياإلهي واستمع، وافتح عينيك وشاهد خرائبنا والمدينة التي دعي اسمك عليها، فإننا لا من أجل بر فينا نرفع تضرعاتنا إليك، بل بفضل مراحمك العظيمة."]]}, {"l": "Dan 9:19", "n": "", "vs": [[19, "فاستمع أيها السيد واغفر. أصغ أيها السيد وتصرف ولا تبطىء من أجل نفسك ياإلهي، لأن اسمك دعي على مدينتك وعلى شعبك»."]]}, {"l": "Joe 2:13", "n": "", "vs": [[13, "مزقوا قلوبكم لا ثيابكم. ارجعوا إلى الرب إلهكم لأنه رؤوف ورحيم بطيء الغضب وكثير الرأفة، ولا يسر بالعقاب."]]}, {"l": "Jon 4:2", "n": "", "vs": [[2, "وصلى إلى الرب قائلا: «أيها الرب، أليس هذا ما قلته عندما كنت في بلادي؟ لهذا أسرعت إلى الهرب إلى ترشيش، لأني عرفت أنك إله رحيم رؤوف بطيء الغضب كثير الإحسان، ترجع عن العقاب."]]}, {"l": "Mic 7:18", "n": "", "vs": [[18, "إي إله مثلك يصفح عن الإثم ويعفو عن معصية بقية ميراثه؟ لا يحتفظ إلى الأبد بغضبه لأنه يسر بالرحمة."]]}, {"l": "Luk 1:50", "n": "", "vs": [[50, "ورحمته للذين يتقونه جيلا بعد جيل."]]}, {"l": "Luk 6:36", "n": "", "vs": [[36, "فكونوا أنتم رحماء، كما أن أباكم رحيم."]]}, {"l": "Rom 2:4", "n": "", "vs": [[4, "أم أنك تحتقر غنى لطفه وصبره وطول أناته وأنت لا تعرف أن لطف الله يدفعك إلى التوبة؟"]]}, {"l": "Eph 1:6", "n": "", "vs": [[6, "بغرض مدح مجد نعمته التي بها أعطانا حظوة لديه في المحبوب:"]]}, {"l": "Eph 2:4", "n": "", "vs": [[4, "أما الله ، وهو غني في الرحمة، فبسبب محبته العظيمة التي أحبنا بها،"]]}], "kwAr": "الرب كثير الرحمة والشفقة", "noteAr": ""}], "arS": [["فنحن نقول عن ", []], ["الصابرين", ["G5278"]], [" على الألم: «طوبى ", []], ["لهم", ["G3106"]], ["!» وقد ", []], ["سمعتم", ["G191"]], [" ", []], ["بصبر", ["G5281"]], [" ", []], ["أيوب", ["G2492"]], ["، ", []], ["ورأيتم", ["G1492"]], [" كيف عامله ", []], ["الرب", ["G2962"]], [" في ", []], ["النهاية", ["G5056"]], [". وهذا يبين ", []], ["أن", ["G3754"]], [" ", []], ["الرب", ["G2962"]], [" كثير ", []], ["الرحمة", ["G4184"]], [" ", []], ["والشفقة", ["G3629"]], [".", []]]}, {"c": 5, "v": 12, "text": "ولكن قبل كل شيء، ياإخوتي، لا تحلفوا، لا بالسماء، ولا بالأرض ولا بأي قسم آخر. وإنما ليكن كلامكم «نعم» إن كان نعم، و«لا» إن كان لا. وذلك لكي لا تقعوا تحت الحكم.", "groups": [{"kw": "above", "raw": "1Pe_4:8; 3Jo_1:2", "note": "", "refs": [{"l": "1Pe 4:8", "n": "", "vs": [[8, "لكن أهم شيء هو أن تبادلوا بعضكم بعضا المحبة الشديدة. لأن المحبة تستر إساءات كثيرة."]]}, {"l": "3Jo 1:2", "n": "", "vs": [[2, "أيها الحبيب، أود أن تكون موفقا في كل أمر، وأن تكون صحتك البدنية قوية ومعافاة كصحتك الروحية."]]}], "kwAr": "قبل كل شيء", "noteAr": ""}, {"kw": "swear not", "raw": "Mat_5:33-37, Mat_23:16-22", "note": "", "refs": [{"l": "Mat 5:33-37", "n": "", "vs": [[33, "وسمعتم أنه قيل للأقدمين: لا تخالف قسمك، بل أوف للرب ما نذرته له."], [34, "أما أنا فأقول لكم: لا تحلفوا أبدا، لا بالسماء لأنها عرش الله،"], [35, "ولا بالأرض لأنها موطيء قدميه، ولا بأورشليم لأنها مدينة الملك الأعظم."], [36, "ولا تحلف برأسك لأنك لا تقدر أن تجعل شعرة واحدة فيها بيضاء أو سوداء."], [37, "ليكن كلامكم: نعم، إن كان نعم؛ أو: لا، إن كان لا. وما زاد على ذلك فهو من الشرير."]]}, {"l": "Mat 23:16-22", "n": "", "vs": [[16, "الويل لكم أيها القادة العميان! تقولون: من أقسم بالهيكل، فقسمه غير ملزم؛ أما من أقسم بذهب الهيكل، فقسمه ملزم!"], [17, "أيها الجهال والعميان! أي الاثنين أعظم: الذهب أم الهيكل الذي يجعل الذهب مقدسا؟"], [18, "وتقولون: من أقسم بالمذبح، فقسمه غير ملزم؛ أما من أقسم بالقربان الذي على المذبح، فقسمه ملزم!"], [19, "أيها العميان! أي الاثنين أعظم: القربان أم المذبح الذي يجعل القربان مقدسا؟"], [20, "فإن من أقسم بالمذبح، فقد أقسم به وبكل ما عليه؛"], [21, "ومن أقسم بالهيكل، فقد أقسم به وبالساكن فيه؛"], [22, "ومن أقسم بالسماء، فقد أقسم بعرش الله وبالجالس عليه!"]]}], "kwAr": "لا تحلفوا", "noteAr": ""}, {"kw": "but", "raw": "2Co_1:17-20", "note": "", "refs": [{"l": "2Co 1:17-20", "n": "", "vs": [[17, "فهل تظنون أني باعتمادي لهذه الخطة تصرفت بخفة، أو أني أتخذ قراراتي وفقا لمنطق البشر، ليكون في كلامي نعم نعم ولا لا في آن واحد؟"], [18, "صادق هو الله ، ويشهد أن كلامنا إليكم ليس نعم ولا معا!"], [19, "فإن ابن الله، المسيح يسوع، الذي بشرنا به فيما بينكم، أنا وسلوانس وتيموثاوس، لم يكن نعم ولا معا، وإنما فيه نعم."], [20, "فمهما كانت وعود الله، فإن فيه النعم لها كلها، وفيه الآمين بنا لأجل مجد الله."]]}], "kwAr": "ليكن كلامكم نعم نعم ولا لا", "noteAr": ""}, {"kw": "lest", "raw": "Jam_3:1, Jam_3:2; 1Co_11:34", "note": "", "refs": [{"l": "Jam 3:1", "n": "", "vs": [[1, "ياإخوتي، لا تتسابقوا كي تجعلوا أنفسكم معلمين لغيركم فتزيدوا عدد المعلمين! واذكروا أننا، نحن المعلمين، سوف نحاسب حسابا أقسى من غيرنا."]]}, {"l": "Jam 3:2", "n": "", "vs": [[2, "فإننا جميعا معرضون للوقوع في أخطاء كثيرة. ولكن من يلجم لسانه ولا يخطيء في كلامه هو ناضج يقدر أن يسيطر على طبيعته سيطرة تامة."]]}, {"l": "1Co 11:34", "n": "", "vs": [[34, "وإن كان أحد جائعا فليأكل في بيته، لكي لا يكون اجتماعكم للحكم عليكم. أما المسائل الأخرى، فعندما آتي أرتبها."]]}], "kwAr": "لكي لا تقعوا تحت الحكم", "noteAr": ""}], "arS": [["ولكن ", []], ["قبل", ["G4253"]], [" كل ", []], ["شيء", ["G3956"]], ["، ", []], ["ياإخوتي", ["G3450", "G80"]], ["، ", []], ["لا", ["G3361"]], [" ", []], ["تحلفوا", ["G3660"]], ["، لا ", []], ["بالسماء", ["G3772"]], ["، ولا ", []], ["بالأرض", ["G1093"]], [" ولا ", []], ["بأي", ["G243"]], [" ", []], ["قسم", ["G3727"]], [" آخر. وإنما ", []], ["ليكن", ["G2277"]], [" كلامكم «", []], ["نعم", ["G3483"]], ["» إن كان ", []], ["نعم", ["G3483"]], ["، و«", []], ["لا", ["G3756"]], ["» إن كان ", []], ["لا", ["G3756"]], [". وذلك لكي ", []], ["لا", ["G3363"]], [" ", []], ["تقعوا", ["G4098"]], [" تحت ", []], ["الحكم", ["G5272"]], [".", []]]}, {"c": 5, "v": 13, "text": "هل بينكم من يتألم؟ فليصل! وهل بينكم من هو سعيد؟ فليرتل!", "groups": [{"kw": "any among", "raw": "2Ch_33:12, 2Ch_33:13; Job_33:26; Psa_18:6, Psa_50:15, Psa_91:15, Psa_116:3-5, Psa_118:5; Psa_142:1-3; Lam_3:55, Lam_3:56; Hos_6:1; Jon_2:2, Jon_2:7; Luk_22:44, Luk_23:42; Act_16:24, Act_16:25; 2Co_12:7-10; Heb_5:7", "note": "", "refs": [{"l": "2Ch 33:12", "n": "", "vs": [[12, "وفي ضيقه استغاث بالرب إلهه وتذلل جدا أمام إله آبائه،"]]}, {"l": "2Ch 33:13", "n": "", "vs": [[13, "وابتهل إليه فاستجاب له، وسمع تضرعه ورده إلى أورشليم وإلى مملكته. فعلم منسى أن الرب هو الله ."]]}, {"l": "Job 33:26", "n": "", "vs": [[26, "عندئذ يدعو المرء الله فيرضى عنه، ويمثل في حضرته بفرح، ويرد له الله بره،"]]}, {"l": "Psa 18:6", "n": "", "vs": [[6, "في ضيقي دعوت الرب وصرخت إلى إلهي، فسمع صوتي من هيكله، وصعد صراخي أمامه، بل دخل أذنيه."]]}, {"l": "Psa 50:15", "n": "", "vs": [[15, "ادعني في يوم ضيقك أنقذك فتمجدني»."]]}, {"l": "Psa 91:15", "n": "", "vs": [[15, "يدعوني فأستجيب له، أرافقه في الضيق، أنقذه وأكرمه"]]}, {"l": "Psa 116:3-5", "n": "", "vs": [[3, "طوقتني حبال الموت. أطبق علي رعب الهاوية. قاسيت ضيقا وحزنا."], [4, "فدعوت الرب: آه يارب نج نفسي!"], [5, "الرب حنون وبار. إلهنا رحيم."]]}, {"l": "Psa 118:5", "n": "", "vs": [[5, "دعوت الرب في الضيق فأجابني وفرج عني."]]}, {"l": "Psa 142:1-3", "n": "", "vs": [[1, "بصوتي إلى الرب أصرخ. بصوتي إلى الرب أتضرع."], [2, "أبثه شكواي وأحدثه بضيقي."], [3, "عندما غشي على روحي في داخلي كنت أنت عالما بمسلكي. في الطريق التي سلكتها نصبوا لي فخا."]]}, {"l": "Lam 3:55", "n": "", "vs": [[55, "استغثت باسمك يارب من أعماق الجب،"]]}, {"l": "Lam 3:56", "n": "", "vs": [[56, "فسمعت صوتي. لا تصم أذنيك عن صراخ استغاثتي."]]}, {"l": "Hos 6:1", "n": "", "vs": [[1, "«تعالوا نرجع إلى الرب. هو الذي مزقنا إربا إربا، وهو وحده يبرئنا. هو الذي ضربنا، وهو وحده الذي يجبرنا."]]}, {"l": "Jon 2:2", "n": "", "vs": [[2, "قائلا: «استغثت بالرب في ضيقي فاستجاب لي، ومن جوف الهاوية ابتهلت فسمعت صوتي."]]}, {"l": "Jon 2:7", "n": "", "vs": [[7, "عندما وهنت نفسي في داخلي، تذكرت إلهي، فحلقت صلاتي إليك، إلى هيكلك المقدس."]]}, {"l": "Luk 22:44", "n": "", "vs": [[44, "وإذ كان في صراع، أخذ يصلي بأشد إلحاح؛ حتى إن عرقه صار كقطرات دم نازلة على الأرض."]]}, {"l": "Luk 23:42", "n": "", "vs": [[42, "ثم قال: «يايسوع، اذكرني عندما تجيء في ملكوتك!»"]]}, {"l": "Act 16:24", "n": "", "vs": [[24, "ونفذ ضابط السجن هذا الأمر المشدد. فزج بهما في السجن الداخلي، وأدخل أرجلهما في مقطرة خشبية."]]}, {"l": "Act 16:25", "n": "", "vs": [[25, "ونحو منتصف الليل كان بولس وسيلا يصليان ويسبحان الله، والمسجونون يسمعونهما،"]]}, {"l": "2Co 12:7-10", "n": "", "vs": [[7, "ولكي لا أتكبر بما لهذه الإعلانات من عظمة فائقة، أعطيت شوكة في جسدي كأنها رسول من الشيطان يلطمني كي لا أتكبر!"], [8, "لأجل هذا تضرعت إلى الرب ثلاث مرات أن ينزعها مني"], [9, "فقال لي: «نعمتي تكفيك، لأن قدرتي تكمل في الضعف!» فأنا أرضى بأن أفتخر مسرورا بالضعفات التي في، لكي تخيم علي قدرة المسيح."], [10, "فلأجل المسيح، تسرني الضعفات والإهانات والضيقات والاضطهادات والصعوبات، لأني حينما أكون ضعيفا، فحينئذ أكون قويا!"]]}, {"l": "Heb 5:7", "n": "", "vs": [[7, "والمسيح، في أثناء حياته البشرية على الأرض، رفع أدعية وتضرعات مقترنة بصراخ شديد ودموع، إلى القادر أن يخلصه من الموت. وقد لبى الله طلبه إكراما لتقواه."]]}], "kwAr": "هل بينكم من يتألم؟", "noteAr": ""}, {"kw": "any merry", "raw": "Jdg_16:23-25; Dan_5:4", "note": "", "refs": [{"l": "Jdg 16:23-25", "n": "", "vs": [[23, "واجتمع أقطاب الفلسطينيين ليحتفلوا بتقديم ذبيحة عظيمة لإلههم داجون قائلين: «إن إلهنا قد أظفرنا بشمشون عدونا»."], [24, "ولما شاهد الشعب شمشون في ذلة، مجدوا إلههم قائلين: «قد أظفرنا إلهنا بعدونا الذي خرب أرضنا، وأكثر من قتلانا»."], [25, "وإذ لعبت بهم النشوة هتفوا: «ادعوا شمشون ليسلينا». فجاءوا بشمشون من السجن فلعب أمامهم ثم أوقفوه بين الأعمدة."]]}, {"l": "Dan 5:4", "n": "", "vs": [[4, "وأخذوا يسبحون آلهة الذهب والفضة والنحاس والحديد والخشب والحجر."]]}], "kwAr": "هل بينكم من هو سعيد؟", "noteAr": ""}, {"kw": "let him sing", "raw": "1Ch_16:9; Psa_95:2, Psa_105:2; Mic_4:5; Mat_26:30; 1Co_14:26; Eph_5:19; Col_3:16, Col_3:17; Rev_5:9-14, Rev_7:10, Rev_14:3, Rev_19:1-6", "note": "", "refs": [{"l": "1Ch 16:9", "n": "", "vs": [[9, "غنوا له؛ اشدوا له؛ حدثوا بكل عجائبه."]]}, {"l": "Psa 95:2", "n": "", "vs": [[2, "لنتقدم أمام حضرته بالشكر، ونهتف له بالترنيم."]]}, {"l": "Psa 105:2", "n": "", "vs": [[2, "غنوا له، اشدوا له. حدثوا بكل عجائبه."]]}, {"l": "Mic 4:5", "n": "", "vs": [[5, "فإن جميع الأمم تسلك باسم إلهها، أما نحن فنسلك باسم الرب إلهنا إلى أبد الآبدين."]]}, {"l": "Mat 26:30", "n": "", "vs": [[30, "ثم رتلوا، وانطلقوا خارجا إلى جبل الزيتون."]]}, {"l": "1Co 14:26", "n": "", "vs": [[26, "فما العمل إذن أيها الإخوة؟ كلما تجتمعون معا، سيكون لكل منكم مزمور، أو تعليم، أو كلام بلغة مجهولة، أو إعلان، أو ترجمة. فليتم كل شيء بهدف البنيان."]]}, {"l": "Eph 5:19", "n": "", "vs": [[19, "محدثين بعضكم بعضا بمزامير وتسابيح وأناشيد روحية، مرنمين ومرتلين بقلوبكم للرب؛"]]}, {"l": "Col 3:16", "n": "", "vs": [[16, "لتسكن كلمة المسيح في داخلكم بغنى، في كل حكمة، معلمين وواعظين بعضكم بعضا، مرنمين بمزامير وتسابيح وأناشيد روحية في قلوبكم لله، رافعين له الحمد."]]}, {"l": "Col 3:17", "n": "", "vs": [[17, "ومهما كان ما تعملونه، بالقول أو بالفعل، فليجر كل شيء باسم الرب يسوع، رافعين به الشكر لله الآب."]]}, {"l": "Rev 5:9-14", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"], [10, "وجعلتهم مملكة لإلهنا وكهنة له، وسيملكون على الأرض»."], [11, "ثم نظرت، فسمعت ترتيل الملايين من الملائكة وهي تحيط بالعرش وبالكائنات الحية والشيوخ،"], [12, "وهم يهتفون بصوت عال: «مستحق هو الحمل المذبوح أن ينال القدرة والغنى والحكمة والقوة والإجلال والمجد والبركة»."], [13, "ثم سمعت كل خليقة في السماء وعلى الأرض، وتحت الأرض، وعلى البحر، هاتفة مع كل ما فيها: «البركة والإجلال والمجد والسلطة للجالس على العرش وللحمل، إلى أبد الآبدين»."], [14, "فردت الكائنات الحية الأربعة: «آمين!» وجثا الشيوخ ساجدين."]]}, {"l": "Rev 7:10", "n": "", "vs": [[10, "وهم يهتفون بصوت عال: «الخلاص من عند إلهنا الجالس على العرش ومن عند الحمل!»"]]}, {"l": "Rev 14:3", "n": "", "vs": [[3, "وكانوا ينشدون ترتيلة جديدة أمام عرش الله، وأمام الكائنات الحية الأربعة والشيوخ. ولم يستطع أحد أن يتعلم هذه الترتيلة إلا المئة والأربعة والأربعون ألفا المشترون من الأرض،"]]}, {"l": "Rev 19:1-6", "n": "", "vs": [[1, "وبعد هذا سمعت صوتا عاليا كأنه صادر من جمع كبير في السماء يقول: «هللويا! الخلاص والمجد والكرامة والقدرة للرب إلهنا"], [2, "فإن أحكامه حق وعدل، لأنه عاقب الزانية الكبرى التي أفسدت الأرض، وانتقم لدم عبيده منها»."], [3, "وهتفوا ثانية: «هللويا! دخان حريقها يتصاعد إلى أبد الآبدين!»"], [4, "وجثا الشيوخ الأربعة والعشرون والكائنات الحية الأربعة سجودا لله الجالس على العرش، وهتفوا: «آمين! هللويا!»"], [5, "وخرج من العرش صوت يقول: «سبحوا إلهنا ياجميع عبيده الذين يتقونه صغارا وكبارا!»"], [6, "ثم سمعت صوتا كأنه صوت جمع كبير أو شلال غزير أو رعد شديد، يقول: «هللويا! فإن الرب الإله القادر على كل شيء قد ملك،"]]}], "kwAr": "فليرتل", "noteAr": ""}], "arS": [["هل ", []], ["بينكم", ["G5100", "G1722", "G5213"]], [" من ", []], ["يتألم", ["G2553"]], ["؟ ", []], ["فليصل", ["G4336"]], ["! وهل بينكم من هو ", []], ["سعيد", ["G2114"]], ["؟ ", []], ["فليرتل", ["G5567"]], ["!", []]]}, {"c": 5, "v": 14, "text": "ومن كان منكم مريضا، فليستدع شيوخ الكنيسة ليصلوا من أجله ويدهنوه بزيت باسم الرب.", "groups": [{"kw": "for", "raw": "Act_14:23, Act_15:4; Tit_1:5", "note": "", "refs": [{"l": "Act 14:23", "n": "", "vs": [[23, "وعينا للتلاميذ شيوخا في كل كنيسة. ثم صليا بأصوام وأسلما الجميع وديعة بين يدي الرب الذي آمنوا به."]]}, {"l": "Act 15:4", "n": "", "vs": [[4, "ولما وصلوا إلى أورشليم، رحبت بهم الكنيسة بمن فيها من رسل وشيوخ، فأخبروهم بكل ما فعل الله بواسطتهم."]]}, {"l": "Tit 1:5", "n": "", "vs": [[5, "تركتك في جزيرة كريت لكي تكمل ترتيب الأمور الباقية، وتقيم شيوخا في كل مدينة، مثلما أمرتك؛"]]}], "kwAr": "فليستدع شيوخ الكنيسة", "noteAr": ""}, {"kw": "pray", "raw": "1Ki_17:21; 2Ki_4:33, 2Ki_5:11; Act_9:40, Act_28:8", "note": "", "refs": [{"l": "1Ki 17:21", "n": "", "vs": [[21, "ثم تمدد إيليا على جثة الولد ثلاث مرات وابتهل إلى الرب: «يارب إلهي، أرجع نفس هذا الولد إليه»."]]}, {"l": "2Ki 4:33", "n": "", "vs": [[33, "فدخل العلية وأغلق الباب وتضرع إلى الرب،"]]}, {"l": "2Ki 5:11", "n": "", "vs": [[11, "فغضب نعمان وانصرف قائلا: «ظننت أنه يخرج للقائي ويقف أمامي، ويدعو باسم الرب إلهه، ويمر بيده فوق موضع البرص، فأبرأ."]]}, {"l": "Act 9:40", "n": "", "vs": [[40, "فطلب بطرس إلى جميع الحاضرين أن يخرجوا من الغرفة، وركع وصلى، ثم التفت إلى الجثة وقال: «ياطابيثا، قومي!» ففتحت عينيها. ولما رأت بطرس جلست،"]]}, {"l": "Act 28:8", "n": "", "vs": [[8, "وكان والد بوبليوس طريح الفراش مريضا بالحمى والإسهال الشديد. فزاره بولس وصلى، ووضع يديه عليه، فشفاه."]]}], "kwAr": "ليصلوا من أجله", "noteAr": ""}, {"kw": "anointing", "raw": "Mar_6:13, Mar_16:18", "note": "", "refs": [{"l": "Mar 6:13", "n": "", "vs": [[13, "وطردوا شياطين كثيرة، ودهنوا كثيرين من المرضى بزيت، وشفوهم."]]}, {"l": "Mar 16:18", "n": "", "vs": [[18, "ويقبضون على الحيات، وإن شربوا شرابا قاتلا لا يتأذون البتة، ويضعون أيديهم على المرضى فيتعافون»."]]}], "kwAr": "ويدهنوه بزيت باسم الرب", "noteAr": ""}], "arS": [["ومن كان منكم ", []], ["مريضا", ["G770"]], ["، ", []], ["فليستدع", ["G4341"]], [" ", []], ["شيوخ", ["G4245"]], [" ", []], ["الكنيسة", ["G1577"]], [" ", []], ["ليصلوا", ["G4336"]], [" من أجله ", []], ["ويدهنوه", ["G218"]], [" ", []], ["بزيت", ["G1637"]], [" ", []], ["باسم", ["G3686"]], [" ", []], ["الرب", ["G2962"]], [".", []]]}, {"c": 5, "v": 15, "text": "فالصلاة المرفوعة باءيمان تشفي المريض، إذ يعيد الرب إليه الصحة. وإن كان مرضه بسبب خطيئة ما، يغفرها الرب له.", "groups": [{"kw": "the prayer", "raw": "Jam_5:13, Jam_5:16, Jam_1:6; Mat_17:20,Mat_17:21, Mat_21:21, Mat_21:22; Mar_11:22-24, Mar_16:17, Mar_16:18; 1Co_12:28-30", "note": "", "refs": [{"l": "Jam 5:13", "n": "", "vs": [[13, "هل بينكم من يتألم؟ فليصل! وهل بينكم من هو سعيد؟ فليرتل!"]]}, {"l": "Jam 5:16", "n": "", "vs": [[16, "ليعترف كل واحد منكم لأخيه بزلاته، وصلوا بعضكم لأجل بعض، حتى تشفوا. إن الصلاة الحارة التي يرفعها البار لها فعالية عظيمة."]]}, {"l": "Jam 1:6", "n": "", "vs": [[6, "وإنما، عليه أن يطلب ذلك بإيمان، دون أي تردد أو شك. فإن المتردد كموجة البحر تتلاعب بها الرياح فتقذفها وتردها!"]]}, {"l": "Mat 17:20", "n": "", "vs": [[20, "أجابهم: «لقلة إيمانكم. فالحق أقول لكم: لو كان لكم إيمان مثل بزرة خردل، لكنتم تقولون لهذا الجبل: انتقل من هنا إلى هناك، فينتقل، ولا يستحيل عليكم شيء."]]}, {"l": "Mat 17:21", "n": "", "vs": [[21, "أما هذا النوع من الشياطين، فلا يطرد إلا بالصلاة والصوم»."]]}, {"l": "Mat 21:21", "n": "", "vs": [[21, "فأجابهم: «الحق أقول لكم: إن كان لكم إيمان ولا تشكون، فإنكم تعملون لا مثل ما عملت بالتينة وحسب، بل إن كنتم تقولون لهذا الجبل: انقلع وانطرح في البحر، فإن ذلك يحدث."]]}, {"l": "Mat 21:22", "n": "", "vs": [[22, "وكل ما تطلبونه في الصلاة بإيمان، تنالونه»."]]}, {"l": "Mar 11:22-24", "n": "", "vs": [[22, "فرد يسوع قائلا لهم: «ليكن لكم إيمان بالله!"], [23, "فالحق أقول لكم: إن أي من قال لهذا الجبل: انقلع وانطرح في البحر! ولا يشك في قلبه، بل يؤمن أن ما يقوله سيحدث، فما يقوله يتم له."], [24, "لهذا السبب أقول لكم: إن ما تطلبونه وتصلون لأجله، فآمنوا أنكم قد نلتموه، فيتم لكم."]]}, {"l": "Mar 16:17", "n": "", "vs": [[17, "وأولئك الذين آمنوا، تلازمهم هذه الآيات: باسمي يطردون الشياطين ويتكلمون بلغات جديدة عليهم،"]]}, {"l": "Mar 16:18", "n": "", "vs": [[18, "ويقبضون على الحيات، وإن شربوا شرابا قاتلا لا يتأذون البتة، ويضعون أيديهم على المرضى فيتعافون»."]]}, {"l": "1Co 12:28-30", "n": "", "vs": [[28, "وقد رتب الله في الكنيسة أشخاصا مخصوصين: أولا الرسل، ثانيا الأنبياء، ثالثا المعلمين، وبعد ذلك أصحاب المواهب المعجزية أو مواهب الشفاء أو إعانة الآخرين أو تدبير الشؤون أو التكلم باللغات المختلفة."], [29, "فهل هم جميعا رسل؟ أجميعهم أنبياء؟ أجميعهم معلمون؟ أجميعهم حائزون على مواهب معجزية؟"], [30, "أجميعهم يملكون مواهب الشفاء؟ أجميعهم يتكلمون بلغات؟ أجميعهم يترجمون؟"]]}], "kwAr": "الصلاة المرفوعة بإيمان", "noteAr": ""}, {"kw": "if he", "raw": "Isa_33:24; Mat_9:2-6; Mar_2:5-11; Joh_5:14; 1Co_11:30-32; 1Jo_5:14-16", "note": "", "refs": [{"l": "Isa 33:24", "n": "", "vs": [[24, "لن يقول مقيم في صهيون إنه مريض، وينزع الرب إثم الشعب الساكن فيها."]]}, {"l": "Mat 9:2-6", "n": "", "vs": [[2, "فجاءه بعضهم يحملون مشلولا مطروحا على فراش. فلما رأى يسوع إيمانهم، قال للمشلول: «اطمئن يابني! قد غفرت لك خطاياك»"], [3, "فقال بعض الكتبة في أنفسهم: «إنه يجدف!»"], [4, "وأدرك يسوع ما يفكرون فيه، فسألهم: «لماذا تفكرون بالشر في قلوبكم؟"], [5, "أيهما الأسهل: أن يقال: قد غفرت لك خطاياك، أم أن يقال: قم وامش؟"], [6, "ولكني (قلت ذلك) لكي تعلموا أن لابن الإنسان على الأرض سلطة غفران الخطايا». عندئذ قال للمشلول: «قم احمل فراشك، واذهب إلى بيتك!»"]]}, {"l": "Mar 2:5-11", "n": "", "vs": [[5, "فلما رأى يسوع إيمانهم، قال للمشلول: «يابني، قد غفرت لك خطاياك!»"], [6, "وكان بين الجالسين بعض الكتبة، فأخذوا يفكرون في قلوبهم:"], [7, "«لماذا يتكلم هذا الرجل هكذا؟ إنه يجدف! من يقدر أن يغفر الخطايا إلا الله وحده؟»"], [8, "وفي الحال أدرك يسوع بروحه ما يفكرون فيه في قلوبهم، فسألهم: «لماذا تفكرون بهذا الأمر في قلوبكم؟"], [9, "أي الأمرين أسهل أن يقال للمشلول: قد غفرت لك خطاياك، أو أن يقال له: قم احمل فراشك وامش؟"], [10, "ولكني قلت ذلك لتعلموا أن لابن الإنسان على الأرض سلطة غفران الخطايا». ثم قال للمشلول:"], [11, "«لك أقول: قم احمل فراشك، واذهب إلى بيتك!»"]]}, {"l": "Joh 5:14", "n": "", "vs": [[14, "وبعد ذلك وجده يسوع في الهيكل، فقال له: «ها أنت قد عدت صحيحا فلا ترجع إلى الخطيئة لئلا يصيبك ما هو أسوأ!»"]]}, {"l": "1Co 11:30-32", "n": "", "vs": [[30, "لهذا السبب فيكم كثيرون من الضعفاء والمرضى، وكثيرون يرقدون."], [31, "فلو كنا حكمنا على نفوسنا، لما كان حكم علينا."], [32, "ولكن، ما دام قد حكم علينا، فإننا نؤدب من قبل الرب حتى لا ندان مع العالم."]]}, {"l": "1Jo 5:14-16", "n": "", "vs": [[14, "نحن نثق بالله ثقة عظيمة تؤكد لنا أنه يسمع لنا الطلبات التي نرفعها إليه، إن كانت منسجمة مع إرادته."], [15, "ومادمنا واثقين بأنه يسمع لنا، مهما كانت طلباتنا، فلنا الثقة بأننا قد حصلنا منه على تلك الطلبات."], [16, "إن رأى أحد منكم واحدا من إخوته يمارس خطيئة لا تنتهي به إلى الموت، فمن واجبه أن يصلي إلى الله من أجله، فيبقيه على قيد الحياة. هذا إذا كانت الخطيئة التي يمارسها لا تنتهي به إلى الموت. فهنالك خطيئة لابد أن تنتهي إلى الموت. وطبعا، أنا لا أقصد هذه الخطيئة هنا."]]}], "kwAr": "وإن كان مرضه بسبب خطيئة", "noteAr": ""}], "arS": [["فالصلاة", ["G2171"]], [" المرفوعة ", []], ["باءيمان", ["G4102"]], [" ", []], ["تشفي", ["G4982"]], [" ", []], ["المريض", ["G2577"]], ["، إذ يعيد ", []], ["الرب", ["G2962"]], [" إليه ", []], ["الصحة", ["G1453"]], [". ", []], ["وإن", ["G2579"]], [" كان مرضه بسبب ", []], ["خطيئة", ["G266"]], [" ما، ", []], ["يغفرها", ["G863"]], [" الرب له.", []]]}, {"c": 5, "v": 16, "text": "ليعترف كل واحد منكم لأخيه بزلاته، وصلوا بعضكم لأجل بعض، حتى تشفوا. إن الصلاة الحارة التي يرفعها البار لها فعالية عظيمة.", "groups": [{"kw": "Confess", "raw": "Gen_41:9, Gen_41:10; 2Sa_19:19; Mat_3:6, Mat_18:15-17; Luk_7:3, Luk_7:4; Act_19:18", "note": "", "refs": [{"l": "Gen 41:9", "n": "", "vs": [[9, "عندئذ قال رئيس السقاة لفرعون: «إني أذكر اليوم ذنوبي."]]}, {"l": "Gen 41:10", "n": "", "vs": [[10, "لقد سخط فرعون على عبديه، فزجني ورئيس الخبازين في معتقل بيت رئيس الحرس."]]}, {"l": "2Sa 19:19", "n": "", "vs": [[19, "قائلا: «ليغفر لي سيدي الملك إثمي ولا يذكر افتراء عبده عليه عندما خرج الملك من أورشليم، ولا يكتم ذلك في قلبه،"]]}, {"l": "Mat 3:6", "n": "", "vs": [[6, "فكانوا يتعمدون على يده في نهر الأردن معترفين بخطاياهم."]]}, {"l": "Mat 18:15-17", "n": "", "vs": [[15, "إن أخطأ إليك أخوك، فاذهب إليه وعاتبه بينك وبينه على انفراد. فإذا سمع لك، تكون قد ربحت أخاك."], [16, "وإذا لم يسمع، فخذ معك أخا آخر أو اثنين، حتى يثبت كل أمر بشهادة شاهدين أو ثلاثة."], [17, "فإذا لم يسمع لهما، فاعرض الأمر على الكنيسة. فإذا لم يسمع للكنيسة أيضا، فليكن عندك كالوثني وجابي الضرائب."]]}, {"l": "Luk 7:3", "n": "", "vs": [[3, "فلما سمع بيسوع، أرسل إليه شيوخ اليهود، متوسلا إليه أن يأتي وينقذ عبده."]]}, {"l": "Luk 7:4", "n": "", "vs": [[4, "ولما أدركوا يسوع، طلبوا إليه بإلحاح قائلين: «إنه يستحق أن تمنحه طلبه،"]]}, {"l": "Act 19:18", "n": "", "vs": [[18, "فجاء كثيرون من الذين كانوا قد آمنوا يعترفون ويخبرون بما كانوا يعملون."]]}], "kwAr": "ليعترف كل واحد منكم لأخيه بزلاته", "noteAr": ""}, {"kw": "pray", "raw": "Col_1:9; 1Th_5:17, 1Th_5:23, 1Th_5:25; Heb_13:18", "note": "", "refs": [{"l": "Col 1:9", "n": "", "vs": [[9, "لذلك نحن أيضا، من اليوم الذي فيه سمعنا بأخباركم، مازلنا نصلي ونتضرع لأجلكم، لأن تمتلئوا من تمام المعرفة لمشيئة الله في كل حكمة وإدراك روحي،"]]}, {"l": "1Th 5:17", "n": "", "vs": [[17, "صلوا دون انقطاع؛"]]}, {"l": "1Th 5:23", "n": "", "vs": [[23, "وإله السلام نفسه يقدسكم إلى التمام ويحفظكم سالمين، روحا ونفسا وجسدا، لتكونوا بلا لوم عند عودة ربنا يسوع المسيح."]]}, {"l": "1Th 5:25", "n": "", "vs": [[25, "أيها الإخوة، صلوا لأجلنا."]]}, {"l": "Heb 13:18", "n": "", "vs": [[18, "صلوا لأجلنا، فنحن مقتنعون بأن لنا ضميرا صالحا وراغبون في أن نحسن التصرف في كل شيء."]]}], "kwAr": "وصلوا بعضكم لأجل بعض", "noteAr": ""}, {"kw": "that", "raw": "Gen_20:17; 2Ch_30:20; Luk_9:6; Act_10:38", "note": "", "refs": [{"l": "Gen 20:17", "n": "", "vs": [[17, "فابتهل إبراهيم إلى الله، فشفى أبيمالك وزوجته وجواريه فولدن."]]}, {"l": "2Ch 30:20", "n": "", "vs": [[20, "فاستجاب الرب لحزقيا وأبرأ الشعب."]]}, {"l": "Luk 9:6", "n": "", "vs": [[6, "فانطلقوا يجتازون في القرى وهم يبشرون ويشفون في كل مكان."]]}, {"l": "Act 10:38", "n": "", "vs": [[38, "فقد مسح الله يسوع الناصري بالروح القدس وبالقدرة، فكان ينتقل من مكان إلى مكان يعمل الخير، ويشفي جميع الذين تسلط عليهم إبليس، لأن الله كان معه."]]}], "kwAr": "حتى تشفوا", "noteAr": ""}, {"kw": "The effectual", "raw": "Gen_18:23-32, Gen_19:29, Gen_20:7, Gen_20:17, Gen_32:28; Exo_9:28, Exo_9:29, Exo_9:33, Exo_17:11, Exo_32:10-14; Num_11:2, Num_14:13-20, Num_21:7-9; Deu_9:18-20; Jos_10:12; 1Sa_12:18; 1Ki_13:6, 1Ki_17:18-24; 2Ki_4:33-35, 2Ki_19:15-20, 2Ki_20:2-5; 2Ch_14:11, 2Ch_14:12; 2Ch_32:20-22; Job_42:8; Psa_10:17, Psa_10:18, Psa_34:15, Psa_145:18, Psa_145:19; Pro_15:8, Pro_15:29; Pro_28:9; Jer_15:1, Jer_29:12, Jer_29:13, Jer_33:3; Dan_2:18-23, Dan_9:20-22; Hos_12:3, Hos_12:4; Mat_7:7-11, Mat_21:22; Luk_11:11-13, Luk_18:1-8; Joh_9:31; Act_4:24-31, Act_12:5-11; 1Jo_3:22", "note": "", "refs": [{"l": "Gen 18:23-32", "n": "", "vs": [[23, "فاقترب إبراهيم وقال: «أتهلك البار مع الأثيم؟"], [24, "لو وجد في المدينة خمسون بارا، فهل تدمرها ولا تصفح عنها من أجل الخمسين بارا الذين فيها؟"], [25, "تنزهت عن أن تهلك البار مع الأثيم، فيكون البار كالأثيم؛ حاشا لك. أديان الأرض كلها لا يجري عدلا؟»"], [26, "فقال الرب: «إن وجدت في سدوم خمسين بارا فإنني أصفح عن المكان كله من أجلهم»."], [27, "فأجاب إبراهيم: «ها أنا قد أخذت في مخاطبة المولى، مع أنني لست سوى تراب ورماد."], [28, "ماذا لو نقص الخمسون بارا خمسة؟ أفتهلك المدينة كلها من أجل الخمسة؟» فأجابه: «إن وجدت خمسة وأربعين بارا لا أهلكها»."], [29, "فخاطبه إبراهيم ثانية: «وماذا لو وجد هناك أربعون بارا فقط؟». فأجابه: «لا أهلكها من أجل الأربعين»."], [30, "وقال إبراهيم: «لا يغضب المولى، بل دعني أتكلم. ماذا لو وجد هناك ثلاثون بارا؟». فأجابه: «لا أهلكها إن وجدت ثلاثين»."], [31, "وقال إبراهيم: «ها أنا قد استرسلت في الكلام أمام المولى، فماذا لو وجدت هناك عشرين بارا؟» فقال: «لا أهلكها من أجل العشرين»."], [32, "وقال إبراهيم: «لا يغضب المولى، فأتكلم مرة أخرى: ماذا لو وجد هناك عشرة؟». فأجابه الرب: «لا أهلكها من أجل العشرة»."]]}, {"l": "Gen 19:29", "n": "", "vs": [[29, "وهكذا عندما دمر الله مدن السهل ذكر إبراهيم، فأخرج لوطا قبيل وقوع الكارثة حين قلب المدن التي قطن فيها لوط."]]}, {"l": "Gen 20:7", "n": "", "vs": [[7, "والآن، رد للرجل زوجته فإنه نبي، فيصلي من أجلك فتحيا. وإن لم تردها فإنك وكل من لك حتما تموتون»."]]}, {"l": "Gen 20:17", "n": "", "vs": [[17, "فابتهل إبراهيم إلى الله، فشفى أبيمالك وزوجته وجواريه فولدن."]]}, {"l": "Gen 32:28", "n": "", "vs": [[28, "فقال: «لا يدعى اسمك في ما بعد يعقوب، بل إسرائيل (ومعناه: يجاهد مع الله)، لأنك جاهدت مع الله والناس وقدرت»."]]}, {"l": "Exo 9:28", "n": "", "vs": [[28, "فتضرعا إلى الرب إذ يكفينا ما ابتلينا به من رعود وبرد، فأطلقكم، ولا تمكثون هنا بعد»."]]}, {"l": "Exo 9:29", "n": "", "vs": [[29, "فأجاب موسى: «حالما أخرج من المدينة أبسط يدي في الصلاة إلى الرب فيتوقف الرعد وينقطع البرد لكي تعرف أن الأرض هي للرب."]]}, {"l": "Exo 9:33", "n": "", "vs": [[33, "وانصرف موسى من لدن فرعون من المدينة وبسط يديه إلى الرب، فتوقف الرعد والبرد وانقطع المطر عن الانهمار على الأرض."]]}, {"l": "Exo 17:11", "n": "", "vs": [[11, "فطالما كان موسى رافعا يده، يغلب بنو إسرائيل، وإذا خفضها يفوز العمالقة."]]}, {"l": "Exo 32:10-14", "n": "", "vs": [[10, "والآن دعني وغضبي المحتدم فأفنيهم، ثم أجعلك أنت شعبا عظيما»."], [11, "فابتهل موسى إلى الرب وقال: «لماذا يحتدم غضبك على شعبك الذي أخرجته من ديار مصر بقوة عظيمة وذراع مقتدرة؟"], [12, "لماذا يشمت المصريون فينا قائلين: لقد احتال عليهم إلههم فأخرجهم من ههنا ليهلكهم في الجبال ويفنيهم عن وجه الأرض. ارجع عن حمو غضبك ولا توقع هذا العقاب بشعبك."], [13, "اذكر وعودك لعبيدك إبراهيم وإسحق وإسرائيل الذين أقسمت لهم بنفسك قائلا: أكثر نسلكم كنجوم السماء، وأهبكم جميع هذه الأرض التي وعدت بها فتملكونها إلى الأبد»."], [14, "فتراءف الرب ولم يوقع بشعبه العقاب الذي توعد به."]]}, {"l": "Num 11:2", "n": "", "vs": [[2, "فصرخوا إلى موسى، فصلى موسى إلى الرب فخمدت النار،"]]}, {"l": "Num 14:13-20", "n": "", "vs": [[13, "فقال موسى للرب: «عندئذ يسمع المصريون، الذين أخرجت هذا الشعب من بينهم بقدرتك، بهذا"], [14, "ويخبرون به أهل هذه الأرض، الذين قد سمعوا يارب أنك قائم في وسط هذا الشعب، وأنك قد ظهرت لهم وجها لوجه تظللهم بحمايتك، وتسير أمامهم في عمود سحاب نهارا وفي عمود نار ليلا."], [15, "فإن أهلكت هذا الشعب دفعة واحدة، فإن الأمم التي سمعت بخبرك تقول"], [16, "إنك قد عجزت عن أن تدخل هذا الشعب إلى الأرض التي وعدتهم بها، فأهلكتهم في الصحراء."], [17, "والآن لتتعظم قدرة سيدي كما نطقت قائلا:"], [18, "الرب طويل الأناة، وافر الرحمة، يغفر الذنب والسيئة. لكنه لا يبريء، بل يفتقد ذنب الآباء في الأبناء إلى الجيل الثالث والرابع."], [19, "فاصفح عن ذنب هذا الشعب بحسب نعمتك، واغفر له كما غفرت ذنوبه من مصر إلى ههنا»."], [20, "فأجاب الرب: «قد صفحت بحسب قولك."]]}, {"l": "Num 21:7-9", "n": "", "vs": [[7, "فجاء الشعب إلى موسى قائلين: «لقد أخطأنا إذ تذمرنا على الرب وعليك، فابتهل إلى الرب ليخلصنا من الحيات». فصلى موسى من أجل الشعب،"], [8, "فقال الرب لموسى: «اصنع لك حية سامة وارفعها على عمود، لكي يلتفت إليها كل من تلدغه حية، فيحيا»"], [9, "فصنع موسى حية من نحاس وأقامها على عمود، فكان كل من لدغته حية، يلتفت إلى حية النحاس ويحيا."]]}, {"l": "Deu 9:18-20", "n": "", "vs": [[18, "ثم انطرحت بذل أمام الرب أربعين نهارا وأربعين ليلة، كما في السابق، لا آكل خبزا ولا أشرب ماء، من جراء كل خطاياكم التي ارتكبتموها في عيني الرب لتغيظوه،"], [19, "لأنني جزعت من غضب الرب واحتدام سخطه عليكم، حتى أوشك أن يبيدكم. فاستجاب لي الرب أيضا في تلك المرة."], [20, "كما غضب الرب على هرون أيضا حتى كاد أن يهلكه، فصليت من أجله حينئذ، فقبل الرب تضرعي."]]}, {"l": "Jos 10:12", "n": "", "vs": [[12, "في ذلك اليوم الذي هزم فيه الرب الأموريين أمام بني إسرائيل، ابتهل يشوع إلى الرب على مسمع من الشعب: «ياشمس دومي على جبعون، وياقمر على وادي أيلون»."]]}, {"l": "1Sa 12:18", "n": "", "vs": [[18, "وصلى صموئيل إلى الرب فأرسل رعودا ومطرا في ذلك اليوم، فاستولى خوف شديد على الشعب من الرب ومن صموئيل."]]}, {"l": "1Ki 13:6", "n": "", "vs": [[6, "عندئذ توسل الملك لرجل الله قائلا: «تضرع إلى الرب إلهك، وصل من أجلي لترتد يدي إلى طبيعتها». فابتهل رجل الله إلى الرب، فارتدت يد الملك إلى ما كانت عليه."]]}, {"l": "1Ki 17:18-24", "n": "", "vs": [[18, "فقالت لإيليا: «أي ذنب جنيته بحقك يارجل الله؟ هل جئت إلي لتذكرني بإثمي وتميت ابني؟»"], [19, "فقال لها: «أعطيني ابنك». وأخذه منها وصعد به إلى العلية التي كان مقيما فيها وأضجعه على سريره،"], [20, "واستغاث بالرب متضرعا: «أيها الرب إلهي، أإلى الأرملة التي أنا نازل عندها تسيء أيضا وتميت ابنها؟»"], [21, "ثم تمدد إيليا على جثة الولد ثلاث مرات وابتهل إلى الرب: «يارب إلهي، أرجع نفس هذا الولد إليه»."], [22, "فاستجاب الرب دعاء إيليا، ورجعت نفس الولد إليه فعاش."], [23, "فأخذ إيليا الولد ونزل به من العلية إلى البيت، وسلمه إلى أمه، وقال لها: «انظري، إن ابنك حي»"], [24, "فقالت المرأة لإيليا: «الآن علمت أنك رجل الله، وأن الله ينطق على لسانك بالحق»."]]}, {"l": "2Ki 4:33-35", "n": "", "vs": [[33, "فدخل العلية وأغلق الباب وتضرع إلى الرب،"], [34, "ثم اضطجع فوق جثة الصبي، ووضع فمه على فمه، وعينيه على عينيه، ويديه على يديه، وتمدد عليه، فبدأ الدفء يسري في جسد الصبي."], [35, "فأخذ النبي يذرع أرض العلية ثم عاد وتمدد على الولد، فعطس هذا سبع مرات وفتح عينيه."]]}, {"l": "2Ki 19:15-20", "n": "", "vs": [[15, "وصلى قائلا: «أيها الرب إله إسرائيل، المتربع فوق الكروبيم، أنت وحدك إله كل ممالك الأرض. أنت وحدك خلقت السماوات والأرض."], [16, "أرهف يارب أذنيك واستمع. افتح يارب عينيك وانظر، واسمع كل تهديدات سنحاريب التي أرسلها ليعير الله الحي."], [17, "حقا يارب إن ملوك أشور قد أهلكوا الأمم ودمروا ديارهم،"], [18, "وطرحوا آلهتهم إلى النار وأبادوها لأنها ليست فعلا آلهة بل خشبا وحجارة من صنعة أيدي الناس،"], [19, "فخلصنا الآن أيها الرب إلهنا من يده، فتدرك ممالك الأرض بأسرها أنك أنت وحدك الرب الإله»."], [20, "فبعث إشعيا بن آموص إلى حزقيا قائلا: «هذا ما يقوله الرب إله إسرائيل الذي تضرعت إليه لينقذك من سنحاريب ملك أشور: قد سمعت»."]]}, {"l": "2Ki 20:2-5", "n": "", "vs": [[2, "فأشاح بوجهه نحو الحائط وصلى قائلا:"], [3, "«آه يارب، اذكر كيف سلكت أمامك بأمانة وإخلاص قلب، وصنعت ما يرضيك». وبكى حزقيا بكاء مرا."], [4, "وقبل أن يبلغ إشعياء فناء القصر الأوسط خاطبه الرب قائلا:"], [5, "«ارجع وقل لحزقيا رئيس شعبي: هذا ما يقوله الرب إله داود أبيك: قد سمعت صلاتك، ورأيت دموعك، وها أنا أبرئك، فتذهب في اليوم الثالث للصلاة في هيكل الرب."]]}, {"l": "2Ch 14:11", "n": "", "vs": [[11, "وتضرع آسا إلى الرب إلهه قائلا: «أيها الرب، لا فرق عندك أن تساعد جيشا قويا أو جيشا ضعيفا، فأعنا أيها الرب إلهنا لأننا عليك اتكلنا، وباسمك جئنا لنحارب هذا الجيش. أيها الرب أنت إلهنا، ولا يقوى عليك إنسان»."]]}, {"l": "2Ch 14:12", "n": "", "vs": [[12, "فقضى الرب على الكوشيين أمام آسا وجيش يهوذا، ففر الكوشيون."]]}, {"l": "2Ch 32:20-22", "n": "", "vs": [[20, "فصلى حزقيا الملك وإشعياء بن آموص النبي، واستغاثا بالسماء من جراء ذلك،"], [21, "فأرسل الرب ملاكا فأباد كل بطل صنديد ورئيس وقائد في معسكر ملك أشور، فرجع إلى أرضه مخذولا. وعندما دخل معبد إلهه اغتاله هناك أولاده بالسيف"], [22, "وهكذا أنقذ الرب حزقيا وسكان أورشليم من سنحاريب ملك أشور ومن أيدي سواه من الأعداء، ووقاهم من كل ناحية."]]}, {"l": "Job 42:8", "n": "", "vs": [[8, "فخذوا الآن لكم سبعة ثيران وسبعة كباش، وامضوا إلى عبدي أيوب وقربوها ذبيحة محرقة عن أنفسكم، فيصلي من أجلكم، فأعفو عنكم إكراما له، لئلا أعاقبكم بمقتضى حماقتكم، لأنكم لم تنطقوا بالحق عني كعبدي أيوب»."]]}, {"l": "Psa 10:17", "n": "", "vs": [[17, "أنت يارب تستجيب طلبة الودعاء، تشدد قلوبهم إذ تصغي (إلى تأوهاتهم)."]]}, {"l": "Psa 10:18", "n": "", "vs": [[18, "تنصف اليتيم والمقهور، فلا يعود إنسان في الأرض يرعبهم."]]}, {"l": "Psa 34:15", "n": "", "vs": [[15, "لأن الرب يرعى الأبرار بعنايته ويستجيب إلى دعائهم."]]}, {"l": "Psa 145:18", "n": "", "vs": [[18, "الرب قريب من جميع الذين يدعونه بصدق،"]]}, {"l": "Psa 145:19", "n": "", "vs": [[19, "يجيب سؤل جميع خائفيه، ويسمع تضرعهم فيخلصهم."]]}, {"l": "Pro 15:8", "n": "", "vs": [[8, "قربان المنافقين مكرهة الرب، ومسرته صلاة المستقيمين."]]}, {"l": "Pro 15:29", "n": "", "vs": [[29, "الرب بعيد عن الأشرار، إنما يسمع صلاة الأبرار."]]}, {"l": "Pro 28:9", "n": "", "vs": [[9, "من يصرف أذنه عن الاستماع إلى الشريعة، تصير حتى صلاته رجاسة."]]}, {"l": "Jer 15:1", "n": "", "vs": [[1, "ثم قال لي الرب: «وحتى لو مثل موسى وصموئيل أمامي، من أجل الشعب فإن قلبي لن يلتفت إلى هذا الشعب. اطرحهم من محضري فيخرجوا."]]}, {"l": "Jer 29:12", "n": "", "vs": [[12, "فتدعونني وتقبلون، وتصلون إلي فأستجيب لكم،"]]}, {"l": "Jer 29:13", "n": "", "vs": [[13, "وتلتمسونني فتجدونني إذ تطلبونني بكل قلوبكم."]]}, {"l": "Jer 33:3", "n": "", "vs": [[3, "ادعني فأجيبك وأطلعك على عظائم وغرائب لم تعرفها."]]}, {"l": "Dan 2:18-23", "n": "", "vs": [[18, "ليطلبوا من إله السماوات الرحمة بشأن هذا اللغز لكي لا يهلك دانيآل ورفاقه مع سائر حكماء بابل."], [19, "عندئذ انكشف السر لدانيآل في رؤيا الليل، فبارك إله السماوات،"], [20, "قائلا: «ليكن اسم الله مباركا من الأزل وإلى الأبد لأن له الحكمة والقدرة."], [21, "هو يغير الأوقات والفصول. يعزل ملوكا وينصب ملوكا. يهب الحكماء حكمة وذوي الفطنة معرفة."], [22, "يكشف الأعماق والخفايا ويعلم ما في باطن الظلمة، ولديه يسكن النور."], [23, "لك ياإله آبائي أحمد وأسبح، لأنك أنعمت علي بالحكمة والقوة، أطلعتني الآن على ما التمسناه منك إذ عرفتنا بأمر الملك»."]]}, {"l": "Dan 9:20-22", "n": "", "vs": [[20, "وبينما كنت أصلي وأعترف بخطيئتي وخطيئة شعبي إسرائيل، وأرفع تضرعاتي أمام الرب إلهي من أجل جبل قدس إلهي،"], [21, "إذا بالملاك جبرائيل الذي عاينته في الرؤيا في البدء، قد طار إلي مسرعا ولمسني، في موعد تقدمة المساء."], [22, "وأفهمني قائلا: يادانيآل قد جئت لأعلمك الفهم."]]}, {"l": "Hos 12:3", "n": "", "vs": [[3, "(لكم طمع يعقوب في بركة الرب)، فقبض وهو ما برح في الرحم على عقب أخيه، وفي رجولته جاهد مع الله."]]}, {"l": "Hos 12:4", "n": "", "vs": [[4, "تصارع مع الملاك وغلب. بكى والتمس رضاه وبركته، التقاه الله في بيت إيل فخاطبه هناك."]]}, {"l": "Mat 7:7-11", "n": "", "vs": [[7, "اسألوا، تعطوا. اطلبوا، تجدوا. اقرعوا، يفتح لكم."], [8, "فكل من يسأل، ينل؛ ومن يطلب، يجد؛ ومن يقرع، يفتح له."], [9, "وإلا، فأي إنسان منكم يطلب منه ابنه خبزا، فيعطيه حجرا،"], [10, "أو سمكة، فيعطيه حية؟"], [11, "فإن كنتم وأنتم أشرار، تعرفون أن تعطوا أولادكم عطايا جيدة، فكم بالأحرى جدا يعطي أبوكم السماوي عطايا جيدة للذين يطلبون منه؟"]]}, {"l": "Mat 21:22", "n": "", "vs": [[22, "وكل ما تطلبونه في الصلاة بإيمان، تنالونه»."]]}, {"l": "Luk 11:11-13", "n": "", "vs": [[11, "فأي أب منكم يطلب منه ابنه خبزا فيعطيه حجرا؟ أو يطلب سمكة فيعطيه بدل السمكة حية؟"], [12, "أو يطلب بيضة، فيعطيه عقربا؟"], [13, "فإن كنتم، أنتم الأشرار، تعرفون أن تعطوا أولادكم عطايا جيدة، فكم بالأحرى الآب، الذي من السماء يهب الروح القدس لمن يسألونه؟ »"]]}, {"l": "Luk 18:1-8", "n": "", "vs": [[1, "وضرب لهم مثلا في وجوب الصلاة دائما ودون ملل،"], [2, "قال: «كان في مدينة قاض لا يخاف الله ولا يحترم إنسانا."], [3, "وكان في تلك المدينة أرملة كانت تأتي إليه قائلة: أنصفني من خصمي!"], [4, "فظل يرفض طلبها مدة من الزمن. ولكنه بعد ذلك قال في نفسه: حتى لو كنت لا أخاف الله ولا أحترم إنسانا،"], [5, "فمهما يكن، فلأن هذه الأرملة تزعجني سأنصفها، لئلا تأتي دائما فتصدع رأسي!»"], [6, "وقال الرب: «اسمعوا ما يقوله القاضي الظالم."], [7, "أفلا ينصف الله مختاريه الذين يصرخون إليه نهارا وليلا؟ أما يسرع في الاستجابة لهم؟"], [8, "أقول لكم: إنه ينصفهم سريعا. ولكن، عندما يعود ابن الإنسان، أيجد إيمانا على الأرض؟»"]]}, {"l": "Joh 9:31", "n": "", "vs": [[31, "نحن نعلم أن الله لا يستجيب للخاطئين، ولكنه يستمع لمن يتقيه ويعمل بإرادته،"]]}, {"l": "Act 4:24-31", "n": "", "vs": [[24, "فتوجهوا بقلب واحد إلى الله بالدعاء، قائلين: «يارب، ياخالق السماء والأرض والبحر وكل ما فيها،"], [25, "يامن قلت بالروح القدس على لسان عبدك داود: لماذا ضجت الأمم؟ ولماذا تآمرت الشعوب باطلا؟"], [26, "اجتمع ملوك الأرض ورؤساؤها، وتحالفوا ليقاوموا الرب ومسيحه!"], [27, "وقد تحققت هذه الكلمات فعلا، إذ تحالف هيرودس، وبيلاطس البنطي، والوثنيون وأسباط إسرائيل، لمقاومة فتاك القدوس يسوع، الذي جعلته مسيحا،"], [28, "وعملوا به كل ما سبق أن رسمت يدك وقضت مشيئتك أن يكون."], [29, "والآن انظر، يارب، إلى تهديدهم، وهبنا نحن عبيدك أن نعلن كلامك بكل جرأة،"], [30, "ومد يدك للشفاء، كي تجرى معجزات وعجائب باسم فتاك القدوس يسوع»."], [31, "وفيما هم يصلون ارتج المكان الذي كانوا مجتمعين فيه، وامتلأوا جميعا بالروح القدس، فأخذوا يعلنون كلمة الله بكل جرأة!"]]}, {"l": "Act 12:5-11", "n": "", "vs": [[5, "فأبقاه في السجن. أما الكنيسة فكانت ترفع الصلاة الحارة إلى الله من أجله."], [6, "وفي الليلة التي كان هيرودس قد نوى أن يسلم بطرس بعدها، كان بطرس نائما بين جنديين، مقيدا بسلسلتين، وأمام الباب جنود يحرسون السجن."], [7, "وفجأة حضر ملاك من عند الرب، فامتلأت غرفة السجن نورا. وضرب الملاك بطرس على جنبه وأيقظه وقال: «قم سريعا!» فسقطت السلسلتان من يديه."], [8, "فقال له الملاك: «شد حزامك، والبس حذاءك!» ففعل. ثم قال له: «البس رداءك واتبعني!»"], [9, "فخرج بطرس يتبع الملاك وهو يظن أنه يرى رؤيا، ولا يدري أن ما يجري على يد الملاك أمر حقيقي."], [10, "واجتازا نقطة الحراسة الأولى ثم الثانية. ولما وصلا إلى باب السجن الحديدي الذي يؤدي إلى المدينة انفتح لهما من ذاته، فخرجا. وبعدما عبرا شارعا واحدا، فارقه الملاك حالا."], [11, "عندئذ استعاد بطرس وعيه، فهتف: «الآن أيقنت أن الرب أرسل ملاكه فأنقذني من قبضة هيرودس، ومن توقعات شعب اليهود!»"]]}, {"l": "1Jo 3:22", "n": "", "vs": [[22, "ومهما نطلب منه بالصلاة، نحصل عليه: لأننا نطيع ما يوصينا به، ونمارس الأعمال التي ترضيه."]]}], "kwAr": "الصلاة الحارة لها فعالية عظيمة", "noteAr": ""}, {"kw": "a righteous", "raw": "Rom_3:10, Rom_5:19; Heb_11:4, Heb_11:7", "note": "", "refs": [{"l": "Rom 3:10", "n": "", "vs": [[10, "كما قد كتب:"]]}, {"l": "Rom 5:19", "n": "", "vs": [[19, "فكما أنه بعصيان الإنسان الواحد جعل الكثيرون خاطئين، فكذلك أيضا بطاعة الواحد سيجعل الكثيرون أبرارا."]]}, {"l": "Heb 11:4", "n": "", "vs": [[4, "بالإيمان، قدم هابيل لله ذبيحة أفضل من تلك التي قدمها قايين. وعلى ذلك الأساس، شهد الله بأن هابيل بار، إذ قبل التقدمة التي قربها له. ومع أن هابيل مات قتلا، فإنه مازال الآن يلقننا العبر بإيمانه."]]}, {"l": "Heb 11:7", "n": "", "vs": [[7, "وبالإيمان نوح، لما أنذره الله عن طريق الوحي بالطوفان الآتي، دفعه خوف الله إلى بناء سفينة ضخمة كانت وسيلة النجاة له ولعائلته، مع أنه لم يكن قد رأى طوفانا من قبل. وبعمله هذا، حكم على العالم وأصبح وارثا للبر القائم على أساس الإيمان."]]}], "kwAr": "البار", "noteAr": ""}], "arS": [["ليعترف", ["G1843"]], [" كل واحد منكم ", []], ["لأخيه", ["G240"]], [" ", []], ["بزلاته", ["G3900"]], ["، ", []], ["وصلوا", ["G2172"]], [" بعضكم لأجل ", []], ["بعض", ["G240", "G5228"]], ["، ", []], ["حتى", ["G3704"]], [" ", []], ["تشفوا", ["G2390"]], [". إن ", []], ["الصلاة", ["G1162"]], [" "
