a_130:3, Psa_130:4", "note": "", "refs": [{"l": "Lev 4:2", "n": "", "vs": [[2, "«أوص بني إسرائيل: إن سهت نفس فأخطأت في أمر من كل نواهي الرب، واقترفت ما لا ينبغي، فهذا ما تفعلونه:"]]}, {"l": "Lev 4:13", "n": "", "vs": [[13, "وإن أخطأ شعب إسرائيل كله سهوا، واقترفوا إحدى نواهي الرب التي لا ينبغي اقترافها، وأثموا، وكان المجمع غافلا عن الأمر،"]]}, {"l": "Lev 4:22", "n": "", "vs": [[22, "إن أخطأ أحد قادة الشعب سهوا، واقترف إحدى نواهي الرب التي لا ينبغي اقترافها وأثم،"]]}, {"l": "Psa 130:3", "n": "", "vs": [[3, "إن كنت يارب تترصد الآثام، فمن يستطيع الوقوف في محضرك؟"]]}, {"l": "Psa 130:4", "n": "", "vs": [[4, "ولأنك مصدر الغفران فإن جميع الناس يهابونك."]]}], "kwAr": "فإن لم تزن ولكن قتلت", "noteAr": ""}], "arS": [["فإن الله ، مثلا، ", []], ["قال", ["G2036"]], [": «", []], ["لا", ["G3361"]], [" ", []], ["تزن", ["G3431"]], ["» كما ", []], ["قال", ["G2036"]], [": «", []], ["لا", ["G3361"]], [" ", []], ["تقتل", ["G5407"]], ["!» ", []], ["فإن", ["G1487"]], [" لم ", []], ["تزن", ["G3431", "G3756"]], ["، ولكن ", []], ["قتلت", ["G5407"]], ["، فقد ", []], ["خرقت", ["G3848"]], [" ", []], ["الشريعة", ["G3551"]], [".", []]]}, {"c": 2, "v": 12, "text": "إذن، تصرفوا في القول والعمل بحسب قانون الحرية، كأنكم سوف تحاكمون وفقا له.", "groups": [{"kw": "speak", "raw": "Phi_4:8; Col_3:17; 2Pe_1:4-8", "note": "", "refs": [{"l": "Phi 4:8", "n": "", "vs": [[8, "وختاما، أيها الإخوة: كل ما كان حقا، وكل ما كان شريفا، وكل ما كان عادلا، وكل ما كان طاهرا وكل ما كان مستحبا، وكل ما كان حسن السمعة، وكل ما كان فيه فضيلة وخصلة حميدة، فاشغلوا أفكاركم به."]]}, {"l": "Col 3:17", "n": "", "vs": [[17, "ومهما كان ما تعملونه، بالقول أو بالفعل، فليجر كل شيء باسم الرب يسوع، رافعين به الشكر لله الآب."]]}, {"l": "2Pe 1:4-8", "n": "", "vs": [[4, "اللذين بهما أعطانا الله بركاته العظمى الثمينة التي كان قد وعد بها. وبهذا صار بإمكانكم أن تتخلصوا من الفساد الذي تنشره الشهوة في العالم، وتشتركوا في الطبيعة الإلهية."], [5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"], [6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"], [7, "والتقوى بالمودة الأخوية، والمودة الأخوية بالمحبة."], [8, "فحين تكون هذه الصفات الطيبة في داخلكم، وتزداد بوفرة، تجعلكم مجتهدين ومثمرين في معرفتكم لربنا يسوع المسيح."]]}], "kwAr": "تصرفوا في القول والعمل", "noteAr": ""}, {"kw": "the", "raw": "Jam_2:8, Jam_1:25", "note": "", "refs": [{"l": "Jam 2:8", "n": "", "vs": [[8, "ما أحسن عملكم حين تطبقون تلك القاعدة الملوكية الواردة في الكتاب: «تحب قريبك كما تحب نفسك!»"]]}, {"l": "Jam 1:25", "n": "", "vs": [[25, "أما الذي ينظر بالتدقيق في القانون الكامل، قانون الحرية، ويواظب على ذلك، فيكون كمن يعمل بالكلمة لا كمن يسمعها وينساها، فإن الله يباركه كثيرا في كل ما يعمله."]]}], "kwAr": "قانون الحرية", "noteAr": ""}], "arS": [["إذن", ["G3779"]], ["، تصرفوا في ", []], ["القول", ["G2980"]], [" ", []], ["والعمل", ["G4160"]], [" بحسب ", []], ["قانون", ["G3551"]], [" ", []], ["الحرية", ["G1657"]], ["، ", []], ["كأنكم", ["G5613"]], [" ", []], ["سوف", ["G3195"]], [" ", []], ["تحاكمون", ["G2919"]], [" وفقا له.", []]]}, {"c": 2, "v": 13, "text": "فلابد أن يكون الحكم على الذين لا يمارسون الرحمة، حكما خاليا من الرحمة، أما الرحمة فهي تتفوق على الحكم!", "groups": [{"kw": "he", "raw": "Jam_5:4; Gen_42:21; Jdg_1:7; Job_22:6-10; Pro_21:13; Isa_27:11; Mat_5:7; Mat_6:15, Mat_7:1, Mat_7:2, Mat_18:28-35, Mat_25:41-46; Luk_16:25", "note": "", "refs": [{"l": "Jam 5:4", "n": "", "vs": [[4, "وهذه أجرة العمال الذين حصدوا حقولكم، تلك الأجرة التي مازلتم تحبسونها عنهم ظلما، إنها تصرخ، وصراخ أولئك العمال أنفسهم قد سمعه رب الجنود!"]]}, {"l": "Gen 42:21", "n": "", "vs": [[21, "وقالوا: «حقا إننا أذنبنا في حق أخينا. لقد رأينا ضيقة نفسه عندما استرحمنا فلم نسمع له. لذلك أصابتنا هذه الضيقة»"]]}, {"l": "Jdg 1:7", "n": "", "vs": [[7, "فقال أدوني بازق: «لقد قطعت أباهم أيدي وأرجل سبعين ملكا كانوا يلتقطون الفتات تحت مائدتي، فها الرب قد جازاني بمثل ما فعلت». وأتوا به إلى أورشليم حيث مات."]]}, {"l": "Job 22:6-10", "n": "", "vs": [[6, "لقد ارتهنت أخاك بغير حق، وجردت العراة من ثيابهم."], [7, "لم تسق المعيي ماء، ومنعت عن الجائع طعامك."], [8, "صاحب القوة استحوذ على الأرض، وذو الحظوة أقام فيها."], [9, "أرسلت الأرامل فارغات وحطمت أذرع اليتامى،"], [10, "لذلك أحدقت بك الفخاخ وطغى عليك رعب مفاجيء."]]}, {"l": "Pro 21:13", "n": "", "vs": [[13, "من أصم أذنه عن صراخ المسكين، يصرخ هو أيضا ولا من مجيب."]]}, {"l": "Isa 27:11", "n": "", "vs": [[11, "ومتى يبست فروعها تتكسر، فتقبل النساء ويستخدمنها وقودا للنار. لأن هذا شعب جاهل، لذلك لا يرحمه صانعه ولا يرفق به خالقه."]]}, {"l": "Mat 5:7", "n": "", "vs": [[7, "طوبى للرحماء، فإنهم سيرحمون."]]}, {"l": "Mat 6:15", "n": "", "vs": [[15, "وإن لم تغفروا للناس، لا يغفر لكم أبوكم السماوي زلاتكم."]]}, {"l": "Mat 7:1", "n": "", "vs": [[1, "لا تدينوا لئلا تدانوا."]]}, {"l": "Mat 7:2", "n": "", "vs": [[2, "فإنكم بالدينونة التي بها تدينون تدانون؛ وبالكيل الذي به تكيلون يكال لكم."]]}, {"l": "Mat 18:28-35", "n": "", "vs": [[28, "«ولكن لما خرج ذلك العبد، قصد واحدا من زملائه العبيد كان مديونا له بمئة دينار. فقبض عليه وأخذ بخناقه قائلا: أوفني ما عليك!"], [29, "فخر زميله العبد أمامه وقال متوسلا: أمهلني فأوفيك!"], [30, "فلم يقبل بل مضى وألقاه في السجن حتى يوفي ما عليه."], [31, "وإذ شاهد زملاؤه العبيد ما جرى، حزنوا جدا، فمضوا وأخبروا سيدهم بكل ما جرى."], [32, "فاستدعاه سيده وقال له: أيها العبد الشرير، ذلك الدين كله سامحتك به لأنك توسلت إلي."], [33, "أفما كان يجب أن ترحم زميلك العبد كما رحمتك أنا؟"], [34, "وإذ ثار غضب سيده عليه، دفعه إلى الجلادين ليعذبوه حتى يوفي كل ما عليه."], [35, "هكذا يفعل بكم أبي السماوي إن لم يغفر كل منكم لأخيه من قلبه! »"]]}, {"l": "Mat 25:41-46", "n": "", "vs": [[41, "ثم يقول للذين عن يساره: ابتعدوا عني ياملاعين إلى النار الأبدية المعدة لإبليس وأعوانه!"], [42, "لأني جعت فلم تطعموني، وعطشت فلم تسقوني،"], [43, "كنت غريبا فلم تأووني، عريانا فلم تكسوني، مريضا وسجينا فلم تزوروني!"], [44, "فيرد هؤلاء أيضا قائلين: يارب، متى رأيناك جائعا أو عطشانا أو غريبا أو عريانا أو مريضا أو سجينا، ولم نخدمك؟"], [45, "فيجيبهم: الحق أقول لكم: بما أنكم لم تفعلوا ذلك بأحد إخوتي هؤلاء الصغار، فبي لم تفعلوا!"], [46, "فيذهب هؤلاء إلى العقاب الأبدي، والأبرار إلى الحياة الأبدية! »"]]}, {"l": "Luk 16:25", "n": "", "vs": [[25, "ولكن إبراهيم قال: يابني، تذكر أنك نلت خيراتك كاملة في أثناء حياتك، ولعازر نال البلايا. ولكنه الآن يتعزى هنا، وأنت هناك تتعذب."]]}], "kwAr": "الحكم على الذين لا يمارسون الرحمة", "noteAr": ""}, {"kw": "and", "raw": "Psa_85:10; Jer_9:24; Eze_33:11; Mic_7:18; Eph_1:6, Eph_1:7, Eph_2:4-7; 1Jo_4:8-16, 1Jo_4:18, 1Jo_4:19", "note": "", "refs": [{"l": "Psa 85:10", "n": "", "vs": [[10, "الرحمة والحق تلاقيا، البر والسلام تعانقا."]]}, {"l": "Jer 9:24", "n": "", "vs": [[24, "بل ليفتخر المفتخر بأنه يدرك ويعرفني أني أنا الرب الذي يمارس الرحمة والعدل والبر في الأرض لأني أسر بها»."]]}, {"l": "Eze 33:11", "n": "", "vs": [[11, "قل لهم: حي أنا يقول السيد الرب، إني لا أبتهج بموت الشرير بل بأن يرتدع عن غيه ويحيا. ارجعوا، ارجعوا عن طرقكم الرديئة! لماذا تموتون ياشعب إسرائيل؟"]]}, {"l": "Mic 7:18", "n": "", "vs": [[18, "إي إله مثلك يصفح عن الإثم ويعفو عن معصية بقية ميراثه؟ لا يحتفظ إلى الأبد بغضبه لأنه يسر بالرحمة."]]}, {"l": "Eph 1:6", "n": "", "vs": [[6, "بغرض مدح مجد نعمته التي بها أعطانا حظوة لديه في المحبوب:"]]}, {"l": "Eph 1:7", "n": "", "vs": [[7, "ففيه لنا بدمه الفداء، أي غفران الخطايا؛ بحسب غنى نعمته"]]}, {"l": "Eph 2:4-7", "n": "", "vs": [[4, "أما الله ، وهو غني في الرحمة، فبسبب محبته العظيمة التي أحبنا بها،"], [5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"], [6, "وأقامنا معه وأجلسنا معه في الأماكن السماوية في المسيح يسوع."], [7, "وذلك كي يعرض في الدهور القادمة غنى نعمته الفائق في لطفه علينا في المسيح يسوع."]]}, {"l": "1Jo 4:8-16", "n": "", "vs": [[8, "أما من لا يحب، فهو لم يتعرف بالله قط لأن الله محبة!"], [9, "وقد أظهر الله محبته لنا إذ أرسل ابنه الأوحد إلى العالم لكي نحيا به."], [10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."], [11, "ومادام الله قد أحبنا هذه المحبة العظيمة، أيها الأحباء، فعلينا نحن أيضا أن نحب بعضنا بعضا."], [12, "إن الله لم يره أحد من الناس قط. ولكن، حين نحب بعضنا بعضا، نبين أن الله يحيا في داخلنا، وأن محبته قد اكتملت في داخلنا."], [13, "وما يؤكد لنا أننا نثبت في الله، وأنه يثبت فينا هو أنه وهب لنا من روحه."], [14, "ونحن أنفسنا نشهد أن الآب قد أرسل الابن مخلصا للعالم، لأننا رأيناه بعيوننا."], [15, "من يعترف بأن يسوع هو ابن الله، فإن الله يثبت فيه، وهو يثبت في الله،"], [16, "ونحن أنفسنا اختبرنا المحبة التي خصنا الله بها، ووضعنا ثقتنا فيها. إن الله محبة. ومن يثبت في المحبة، فإنه يثبت في الله، والله يثبت فيه."]]}, {"l": "1Jo 4:18", "n": "", "vs": [[18, "ليس في المحبة أي خوف. بل المحبة الكاملة تطرد الخوف خارجا. فإن الخوف يأتي من العقاب. والخائف لا تكون محبة الله قد اكتملت فيه."]]}, {"l": "1Jo 4:19", "n": "", "vs": [[19, "ونحن نحب، لأن الله أحبنا أولا."]]}], "kwAr": "حكما خاليا من الرحمة", "noteAr": ""}, {"kw": "rejoiceth", "raw": "or, glorieth", "note": "or, glorieth", "refs": [], "kwAr": "الرحمة تتفوق على الحكم", "noteAr": "أو: تفتخر."}], "arS": [["فلابد أن يكون ", []], ["الحكم", ["G2920"]], [" على الذين ", []], ["لا", ["G3361"]], [" ", []], ["يمارسون", ["G4160"]], [" ", []], ["الرحمة", ["G1656"]], ["، حكما خاليا ", []], ["من الرحمة", ["G448"]], ["، أما ", []], ["الرحمة", ["G1656"]], [" فهي ", []], ["تتفوق", ["G2620"]], [" على ", []], ["الحكم", ["G2920"]], ["!", []]]}, {"c": 2, "v": 14, "text": "ياإخوتي، هل ينفع أحدا أن يدعي أنه مؤمن، وليس له أعمال تثبت ذلك، هل يقدر إيمان مثل هذا أن يخلصه؟", "groups": [{"kw": "What", "raw": "Jam_2:16; Jer_7:8; Rom_2:25; 1Co_13:3; 1Ti_4:8; Heb_13:9", "note": "", "refs": [{"l": "Jam 2:16", "n": "", "vs": [[16, "وقال لهما أحدكم: «أتمنى لكما كل خير. البسا ثيابا دافئة، وكلا طعاما جيدا!» دون أن يقدم لهما ما يحتاجان إليه من ثياب وطعام، فأي نفع في ذلك؟"]]}, {"l": "Jer 7:8", "n": "", "vs": [[8, "ها أنتم قد اتكلتم على أقوال الكذب، ولكن من غير جدوى."]]}, {"l": "Rom 2:25", "n": "", "vs": [[25, "فإن الختان ينفع إن كنت تعمل بالشريعة. ولكن إن كنت مخالفا للشريعة، فقد صار ختانك كأنه عدم ختان."]]}, {"l": "1Co 13:3", "n": "", "vs": [[3, "ولو قدمت أموالي كلها للإطعام، وسلمت جسدي لأحرق، وليس عندي محبة، لما كنت أنتفع شيئا."]]}, {"l": "1Ti 4:8", "n": "", "vs": [[8, "فالرياضة البدنية نافعة بعض الشيء. أما التقوى فنافعة لكل شيء، لأن فيها وعدا بالحياة الحاضرة والآتية."]]}, {"l": "Heb 13:9", "n": "", "vs": [[9, "فلا تنخدعوا وتتبعوا تلك التعاليم الغريبة المتنوعة ... فمن الأفضل أن يثبت القلب بالنعمة لا بنظم الأطعمة التي لم تنفع المتقيدين بها."]]}], "kwAr": "هل ينفع أحدا", "noteAr": ""}, {"kw": "though", "raw": "Jam_2:18, Jam_2:26, Jam_1:22-25; Mat_5:20, Mat_7:21-23, Mat_7:26, Mat_7:27; Luk_6:49; Act_8:13, Act_8:21, Act_15:9; 1Co_13:2, 1Co_16:22; Gal_5:6, Gal_5:13; 1Th_1:3; 1Ti_1:5; Tit_1:16, Tit_3:8; Heb_11:7, Heb_11:8, Heb_11:17; 2Pe_1:5; 1Jo_5:4, 1Jo_5:5", "note": "", "refs": [{"l": "Jam 2:18", "n": "", "vs": [[18, "وربما قال أحدكم: «أنت لك إيمان وأنا لي أعمال». أرني كيف يكون إيمانك من غير أعمال، وأنا أريك كيف يكون إيماني بأعمالي."]]}, {"l": "Jam 2:26", "n": "", "vs": [[26, "فكما أن جسم الإنسان يكون ميتا إذا فارقته الروح، كذلك يكون الإيمان ميتا إذا لم ترافقه الأعمال!"]]}, {"l": "Jam 1:22-25", "n": "", "vs": [[22, "لا تكتفوا فقط بسماعها، بل اعملوا بها، وإلا كنتم تغشون أنفسكم."], [23, "فالذي يسمع الكلمة ولا يعمل بها، يكون كمن ينظر إلى المرآة ليشاهد وجهه فيها."], [24, "وبعد أن يرى نفسه، يذهب فينسى صورته حالا."], [25, "أما الذي ينظر بالتدقيق في القانون الكامل، قانون الحرية، ويواظب على ذلك، فيكون كمن يعمل بالكلمة لا كمن يسمعها وينساها، فإن الله يباركه كثيرا في كل ما يعمله."]]}, {"l": "Mat 5:20", "n": "", "vs": [[20, "فإني أقول لكم: إن لم يزد بركم على بر الكتبة والفريسيين، لن تدخلوا ملكوت السماوات أبدا."]]}, {"l": "Mat 7:21-23", "n": "", "vs": [[21, "ليس كل من يقول لي: يارب، يارب! يدخل ملكوت السماوات، بل من يعمل بإرادة أبي الذي في السماوات."], [22, "في ذلك اليوم سيقول لي كثيرون: يارب، يارب، أليس باسمك تنبأنا، وباسمك طردنا الشياطين، وباسمك عملنا معجزات كثيرة؟"], [23, "ولكني عندئذ أصرح لهم: إني لم أعرفكم قط! ابتعدوا عني يافاعلي الإثم!"]]}, {"l": "Mat 7:26", "n": "", "vs": [[26, "وأي من يسمع أقوالي هذه ولا يعمل بها، يشبه برجل غبي بنى بيته على الرمل،"]]}, {"l": "Mat 7:27", "n": "", "vs": [[27, "فنزلت الأمطار، وجرت السيول، وهبت العواصف، فضربت ذلك البيت، فسقط، وكان سقوطه عظيما»"]]}, {"l": "Luk 6:49", "n": "", "vs": [[49, "وأما من سمع ولم يعمل، فهو يشبه إنسانا بنى بيتا على الأرض دون أساس. فلما صدمه السيل، انهار في الحال؛ وكان خراب ذلك البيت جسيما! »"]]}, {"l": "Act 8:13", "n": "", "vs": [[13, "وسيمون نفسه آمن وتعمد، فألصق نفسه بفيلبس، وإذ شاهد الآيات والمعجزات التي أجريت على يده، استولت عليه الدهشة."]]}, {"l": "Act 8:21", "n": "", "vs": [[21, "لا قسمة لك في هذا الأمر ولا نصيب، لأن قلبك ليس مخلصا تجاه الله."]]}, {"l": "Act 15:9", "n": "", "vs": [[9, "فهو لم يفرق بيننا وبينهم في شيء، إذ طهر بالإيمان قلوبهم."]]}, {"l": "1Co 13:2", "n": "", "vs": [[2, "ولو كانت لي موهبة النبوءة، وكنت عالما بجميع الأسرار والعلم كله، وكان عندي الإيمان كله حتى أنقل الجبال، وليس عندي محبة، فلست شيئا!"]]}, {"l": "1Co 16:22", "n": "", "vs": [[22, "إن كان أحد لا يحب الرب فليكن «أناثيما» (أي ملعونا)!"]]}, {"l": "Gal 5:6", "n": "", "vs": [[6, "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة."]]}, {"l": "Gal 5:13", "n": "", "vs": [[13, "فإنما إلى الحرية قد دعيتم، أيها الإخوة؛ ولكن لا تتخذوا من الحرية ذريعة لإرضاء الجسد، بل بالمحبة كونوا عبيدا في خدمة أحدكم الآخر."]]}, {"l": "1Th 1:3", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"]]}, {"l": "1Ti 1:5", "n": "", "vs": [[5, "أما الغاية مما أوصيتك به، فهي المحبة النابعة من قلب طاهر وضمير صالح وإيمان خال من الرياء."]]}, {"l": "Tit 1:16", "n": "", "vs": [[16, "يشهدون معترفين بأنهم يعرفون الله ، ولكنهم بأعمالهم ينكرونه، لأنهم مكروهون وغير طائعين، وقد تبين أنهم غير أهل لكل عمل صالح."]]}, {"l": "Tit 3:8", "n": "", "vs": [[8, "صادق هذا القول! وأريد أن تقرر هذه الأمور قرارا حاسما، حتى يهتم الذين آمنوا بالله بأن يجتهدوا في الأعمال الصالحة. هذه الأمور حسنة ونافعة للناس."]]}, {"l": "Heb 11:7", "n": "", "vs": [[7, "وبالإيمان نوح، لما أنذره الله عن طريق الوحي بالطوفان الآتي، دفعه خوف الله إلى بناء سفينة ضخمة كانت وسيلة النجاة له ولعائلته، مع أنه لم يكن قد رأى طوفانا من قبل. وبعمله هذا، حكم على العالم وأصبح وارثا للبر القائم على أساس الإيمان."]]}, {"l": "Heb 11:8", "n": "", "vs": [[8, "وبالإيمان، لبى إبراهيم دعوة الله، فترك وطنه وانطلق إلى أرض أخرى وعده الله بأن يورثه إياها. ولما خرج من بيته، كان لا يعرف أين يتوجه."]]}, {"l": "Heb 11:17", "n": "", "vs": [[17, "وبالإيمان، إبراهيم أيضا، لما امتحنه الله ، قدم إسحاق ابنه. فإنه، إذ قبل وعود الله، قدم ابنه الوحيد ذبيحة،"]]}, {"l": "2Pe 1:5", "n": "", "vs": [[5, "فمن أجل ذلك، عليكم أن تبذلوا كل اجتهاد ونشاط في ممارسة إيمانكم حتى يؤدي بكم إلى الفضيلة. واقرنوا الفضيلة بالتقدم في المعرفة،"]]}, {"l": "1Jo 5:4", "n": "", "vs": [[4, "ذلك لأن المولود من الله ينتصر على العالم. فالإيمان هو الذي يجعلنا ننتصر على العالم."]]}, {"l": "1Jo 5:5", "n": "", "vs": [[5, "ومن ينتصر على العالم إلا الذي يؤمن أن يسوع هو ابن الله؟"]]}], "kwAr": "أن يدعي أنه مؤمن", "noteAr": ""}, {"kw": "can", "raw": "1Co_15:2; Eph_2:8-10", "note": "", "refs": [{"l": "1Co 15:2", "n": "", "vs": [[2, "وبه أيضا أنتم مخلصون، إن كنتم تتمسكون بالكلمة التي بشرتكم بها، إلا إذا كنتم قد آمنتم عبثا."]]}, {"l": "Eph 2:8-10", "n": "", "vs": [[8, "فإنكم بالنعمة مخلصون، بالإيمان، وهذا ليس منكم. إنه هبة من الله،"], [9, "لا على أساس الأعمال، حتى لا يفتخر أحد."], [10, "فإننا نحن تحفة الله، وقد خلقنا في المسيح يسوع لأعمال صالحة أعدها سلفا لنسلك فيها."]]}], "kwAr": "هل يقدر إيمان مثل هذا أن يخلصه", "noteAr": ""}], "arS": [["ياإخوتي", ["G3450", "G80"]], ["، هل ", []], ["ينفع", ["G3786"]], [" ", []], ["أحدا", ["G5100"]], [" أن ", []], ["يدعي", ["G3004"]], [" أنه ", []], ["مؤمن", ["G2192", "G4102"]], ["، ", []], ["وليس", ["G3361"]], [" له ", []], ["أعمال", ["G2041"]], [" تثبت ذلك، هل ", []], ["يقدر", ["G1410"]], [" ", []], ["إيمان", ["G4102"]], [" مثل هذا أن ", []], ["يخلصه", ["G4982"]], ["؟", []]]}, {"c": 2, "v": 15, "text": "لنفرض أن أخا أو أختا كانا بحاجة شديدة إلى الثياب والطعام اليومي،", "groups": [{"kw": "", "raw": "Jam_2:5; Job_31:16-21; Isa_58:7, Isa_58:10; Eze_18:7; Mat_25:35-40; Mar_14:7; Luk_3:11; Act_9:29; Heb_11:37", "note": "", "refs": [{ والمعزى، يعانون من الحاجة والضيق والظلم،"]]}], "kwAr": "", "noteAr": ""}], "arS": [["لنفرض أن ", []], ["أخا", ["G80"]], [" ", []], ["أو", ["G2228"]], [" ", []], ["أختا", ["G79"]], [" كانا ", []], ["بحاجة", ["G3007"]], [" شديدة إلى ", []], ["الثياب", ["G1131"]], [" ", []], ["والطعام", ["G5160"]], [" ", []], ["اليومي", ["G2184"]], ["،", []]]}, {"c": 2, "v": 16, "text": "وقال لهما أحدكم: «أتمنى لكما كل خير. البسا ثيابا دافئة، وكلا طعاما جيدا!» دون أن يقدم لهما ما يحتاجان إليه من ثياب وطعام، فأي نفع في ذلك؟", "groups": [{"kw": "one", "raw": "Job_22:7-9; Pro_3:27, Pro_3:28; Mat_14:15, Mat_14:16, Mat_15:32, Mat_25:42-45; Rom_12:9; 2Co_8:8; 1Jo_3:16-18", "note": "", "refs": [{"l": "Job 22:7-9", "n": "", "vs": [[7, "لم تسق المعيي ماء، ومنعت عن الجائع طعامك."], [8, "صاحب القوة استحوذ على الأرض، وذو الحظوة أقام فيها."], [9, "أرسلت الأرامل فارغات وحطمت أذرع اليتامى،"]]}, {"l": "Pro 3:27", "n": "", "vs": [[27, "لا تحجب الإحسان عن أهله كلما كان في وسعك أن تقوم به."]]}, {"l": "Pro 3:28", "n": "", "vs": [[28, "لا تقل لجارك: «اذهب الآن، ثم عد ثانية. غدا أعطيك ما تطلب»، طالما لديك ما يطلب."]]}, {"l": "Mat 14:15", "n": "", "vs": [[15, "وعندما حل المساء، اقترب التلاميذ إليه وقالوا: «هذا المكان مقفر، وقد فات الوقت. فاصرف الجموع ليذهبوا إلى القرى ويشتروا طعاما لأنفسهم»."]]}, {"l": "Mat 14:16", "n": "", "vs": [[16, "ولكن يسوع قال لهم: «لا حاجة لهم أن يذهبوا. أعطوهم أنتم ليأكلوا!»"]]}, {"l": "Mat 15:32", "n": "", "vs": [[32, "ولكن يسوع دعا تلاميذه إليه وقال: «إني أشفق على الجمع لأنهم مازالوا معي منذ ثلاثة أيام وليس عندهم ما يأكلون. ولا أريد أن أصرفهم صائمين لئلا تخور قواهم في الطريق»."]]}, {"l": "Mat 25:42-45", "n": "", "vs": [[42, "لأني جعت فلم تطعموني، وعطشت فلم تسقوني،"], [43, "كنت غريبا فلم تأووني، عريانا فلم تكسوني، مريضا وسجينا فلم تزوروني!"], [44, "فيرد هؤلاء أيضا قائلين: يارب، متى رأيناك جائعا أو عطشانا أو غريبا أو عريانا أو مريضا أو سجينا، ولم نخدمك؟"], [45, "فيجيبهم: الحق أقول لكم: بما أنكم لم تفعلوا ذلك بأحد إخوتي هؤلاء الصغار، فبي لم تفعلوا!"]]}, {"l": "Rom 12:9", "n": "", "vs": [[9, "ولتكن المحبة بلا رياء. انفروا من الشر، والتصقوا بالخير."]]}, {"l": "2Co 8:8", "n": "", "vs": [[8, "لا أقول هذا على سبيل الأمر، بل اختبارا لصدق محبتكم بحماسة الآخرين."]]}, {"l": "1Jo 3:16-18", "n": "", "vs": [[16, "ومقياس المحبة هو العمل الذي قام به المسيح إذ بذل حياته لأجلنا. فعلينا نحن أيضا أن نبذل حياتنا لأجل إخوتنا."], [17, "وأما الذي يملك مالا يمكنه من العيش في بحبوحة، ويقسي قلبه على أحد الإخوة المحتاجين، فكيف تكون محبة الله متأصلة فيه؟"], [18, "أيها الأولاد الصغار، لا يجب أن تكون محبتنا مجرد ادعاء بالكلام واللسان، بل تكون محبة عملية حقة."]]}], "kwAr": "قال لهما أحدكم", "noteAr": ""}, {"kw": "what", "raw": "Jam_2:14", "note": "", "refs": [{"l": "Jam 2:14", "n": "", "vs": [[14, "ياإخوتي، هل ينفع أحدا أن يدعي أنه مؤمن، وليس له أعمال تثبت ذلك، هل يقدر إيمان مثل هذا أن يخلصه؟"]]}], "kwAr": "فأي نفع في ذلك", "noteAr": ""}], "arS": [["وقال", ["G2036"]], [" ", []], ["لهما", ["G846"]], [" ", []], ["أحدكم", ["G5100", "G5216"]], [": «أتمنى لكما كل ", []], ["خير", ["G5217", "G1515"]], [". البسا ثيابا ", []], ["دافئة", ["G2328"]], ["، وكلا طعاما ", []], ["جيدا", ["G5526"]], ["!» دون أن ", []], ["يقدم", ["G1325"]], [" لهما ما ", []], ["يحتاجان", ["G2006"]], [" إليه من ثياب وطعام، ", []], ["فأي", ["G5101"]], [" ", []], ["نفع", ["G3786"]], [" في ذلك؟", []]]}, {"c": 2, "v": 17, "text": "هكذا نرى أن الإيمان وحده ميت ما لم تنتج عنه أعمال.", "groups": [{"kw": "so", "raw": "Jam_2:14, Jam_2:19, Jam_2:20,Jam_2:26; 1Co_13:3, 1Co_13:13; 1Th_1:3; 1Ti_1:5; 2Pe_1:5-9", "note": "", "refs": [{"l": "Jam 2:14", "n": "", "vs": [[14, "ياإخوتي، هل ينفع أحدا أن يدعي أنه مؤمن، وليس له أعمال تثبت ذلك، هل يقدر إيمان مثل هذا أن يخلصه؟"]]}, {"l": "Jam 2:19", "n": "", "vs": [[19, "أنت تؤمن أن الله واحد؟ حسنا تفعل ! والشياطين أيضا تؤمن بهذه الحقيقة، ولكنها ترتعد خوفا."]]}, {"l": "Jam 2:20", "n": "", "vs": [[20, "وهذا يؤكد لك، أيها الإنسان الغبي، أن الإيمان الذي لا تنتج عنه أعمال هو إيمان ميت!"]]}, {"l": "Jam 2:26", "n": "", "vs": [[26, "فكما أن جسم الإنسان يكون ميتا إذا فارقته الروح، كذلك يكون 4:23", "n": "", "vs": [[23, "وأما من يشك، فإذا أكل يحكم عليه، لأن ذلك ليس عن إيمان. وكل ما لا يصدر عن الإيمان، فهو خطيئة."]]}, {"l": "1Co 13:2", "n": "", "vs": [[2, "ولو كانت لي موهبة النبوءة، وكنت عالما بجميع الأسرار والعلم كله، وكان عندي الإيمان كله حتى أنقل الجبال، وليس عندي محبة، فلست شيئا!"]]}, {"l": "Gal 5:6", "n": "", "vs": [[6, "ففي المسيح يسوع، لا نفع للختان ولا لعدم الختان، بل للإيمان العامل بالمحبة."]]}, {"l": "Heb 11:6", "n": "", "vs": [[6, "فمن المستحيل إرضاء الله بدون إيمان. إذ إن من يتقرب إلى الله، لابد له أن يؤمن بأنه موجود، وبأنه يكافيء الذين يسعون إليه."]]}, {"l": "Heb 11:31", "n": "", "vs": [[31, "وجزاء للإيمان، نجت راحاب الزانية من الموت المحتم مع المتمردين، بعدما استقبلت الجاسوسين بسلام."]]}], "kwAr": "أنت لك إيمان", "noteAr": ""}, {"kw": "without thy works", "raw": "Some copies read, by thy works.", "note": "Some copies read, by thy works.", "refs": [], "kwAr": "من غير أعمال", "noteAr": "بعض النسخ تقرأ: بأعمالك."}, {"kw": "and I will", "raw": "Jam_2:22-25, Jam_3:13; Mat_7:17; Rom_8:1; 2Co_5:17, 2Co_7:1; 1Th_1:3-10; 1Ti_1:5; Tit_2:7, Tit_2:11-14", "note": "", "refs": [{"l": "Jam 2:22-25", "n": "", "vs": [[22, "فأنت ترى أن إيمان إبراهيم قد رافقته الأعمال. فبالأعمال قد اكتمل الإيمان."], [23, "وهكذا، تم ما قاله الكتاب: «آمن إبراهيم بالله، فحسب له ذلك برا»، حتى إنه دعي «خليل الله»."], [24, "فترون إذن أن الإنسان لا يتبرر بإيمانه فقط، بل بأعماله أيضا."], [25, "على هذا الأساس أيضا، تبررت راحاب التي كانت زانية: فقد استقبلت الرجلين اللذين أرسلا إليها، وصرفتهما في طريق آخر."]]}, {"l": "Jam 3:13", "n": "", "vs": [[13, "أبينكم بعض الحكماء والفهماء؟ إذن، على هؤلاء أن يسلكوا سلوكا حسنا، مظهرين بأعمالهم تلك الوداعة التي تتصف بها الحكمة (الحقيقية)."]]}, {"l": "Mat 7:17", "n": "", "vs": [[17, "هكذا، كل شجرة جيدة تثمر ثمرا جيدا. أما الشجرة الرديئة، فإنها تثمر ثمرا رديئا."]]}, {"l": "Rom 8:1", "n": "", "vs": [[1, "فالآن إذا ليس على الذين في المسيح يسوع أية دينونة بعد."]]}, {"l": "2Co 5:17", "n": "", "vs": [[17, "فإنه إذا كان أحد في المسيح، فهو خليقة جديدة: إن الأشياء القديمة قد زالت، وها كل شيء قد صار جديدا."]]}, {"l": "2Co 7:1", "n": "", "vs": [[1, "فإذ نلنا هذه الوعود، أيها الأحباء، لنطهر أنفسنا من كل ما يدنس الجسد والروح، ونكمل القداسة في مخافة الله."]]}, {"l": "1Th 1:3-10", "n": "", "vs": [[3, "متذكرين، أمام إلهنا وأبينا، ما لكم من عمل الإيمان واجتهاد المحبة وثبات الرجاء، في ربنا يسوع المسيح؛"], [4, "ونحن عالمون، أيها الإخوة أحباء الله، حقيقة اختياركم من قبل الله:"], [5, "لأن تبشيرنا لكم بالإنجيل لم يكن مجرد كلام، بل كان مصحوبا أيضا بالقوة وبالروح القدس وبتمام اليقين. كما أنكم تعلمون تماما ماذا كنا بينكم لأجل مصلحتكم،"], [6, "وقد صرتم مقتدين بنا وبالرب، إذ تقبلتم كلمة الله في وسط ضيقة شديدة بفرح الروح القدس."], [7, "حتى إنكم صرتم مثالا لجميع المؤمنين المقيمين في مقاطعتي مقدونية وأخائية."], [8, "فمن عندكم دوت كلمة الرب، منتشرة لا في مقدونية وأخائية فقط، بل إن إيمانكم بالله ذاع في كل مكان، حتى ليس لنا حاجة لأن نقول شيئا بعد."], [9, "فإن أولئك المؤمنين أنفسهم يخبرون عنا كيف كان قدومنا إليكم أول مرة، وكيف تحولتم إلى الله عن الأصنام، لتصيروا عبيدا يخدمون الله الحي الحق،"], [10, "وتنتظروا من السماوات ابنه الذي أقامه من بين الأموات، يسوع مخلصنا من الغضب الآتي."]]}, {"l": "1Ti 1:5", "n": "", "vs": [[5, "أما الغاية مما أوصيتك به، فهي المحبة النابعة من قلب طاهر وضمير صالح وإيمان خال من الرياء."]]}, {"l": "Tit 2:7", "n": "", "vs": [[7, "جاعلا من نفسك في كل شيء قدوة للأعمال الصالحة، مظهرا في تعليمك النقاوة والوقار"]]}, {"l": "Tit 2:11-14", "n": "", "vs": [[11, "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت."], [12, "وهي تعلمنا أن نقطع علاقتنا بالإباحية والشهوات العالمية، وأن نحيا في العصر الحاضر حياة التعقل والبر والتقوى،"], [13, "فيما ننتظر تحقيق رجائنا السعيد، ثم الظهور العلني لمجد إلهنا ومخلصنا العظيم يسوع المسيح،"], [14, "الذي بذل نفسه لأجلنا لكي يفتدينا من كل إثم ويطهرنا لنفسه شعبا خاصا يجتهد بحماسة في الأعمال الصالحة."]]}], "kwAr": "وأنا أريك إيماني بأعمالي", "noteAr": ""}], "arS": [["وربما ", []], ["قال", ["G2046"]], [" ", []], ["أحدكم", ["G5100"]], [": «", []], ["أنت", ["G4771"]], [" ", []], ["لك", ["G2192"]], [" 12:29", "n": "", "vs": [[29, "فأجابه يسوع: «أولى الوصايا جميعا هي: اسمع ياإسرائيل، الرب إلهنا رب واحد"]]}, {"l": "Joh 17:3", "n": "", "vs": [[3, "والحياة الأبدية هي أن يعرفوك أنت الإله الحق وحدك، والذي أرسلته: يسوع المسيح."]]}, {"l": "Rom 3:30", "n": "", "vs": [[30, "مادام الله الواحد هو الذي سيبرر أهل الختان على أساس الإيمان، وأهل عدم الختان على أساس الإيمان."]]}, {"l": "1Co 8:4", "n": "", "vs": [[4, "ففيما يخص الأكل من ذبائح الأصنام، نحن نعلم أن الصنم ليس بإله موجود في الكون، وأنه لا وجود إلا لإله واحد."]]}, {"l": "1Co 8:6", "n": "", "vs": [[6, "فليس عندنا نحن إلا إله واحد هو الآب الذي منه كل شيء، ونحن له؛ ورب واحد هو يسوع المسيح الذي به كل شيء ونحن به."]]}, {"l": "Gal 3:20", "n": "", "vs": [[20, "ولكن، عندما يصدر الوعد من جانب واحد، فلا لزوم لوسيط. والواعد هنا هو الله وحده."]]}, {"l": "Eph 4:5", "n": "", "vs": [[5, "ولكم رب واحد، وإيمان واحد، ومعمودية واحدة،"]]}, {"l": "Eph 4:6", "n": "", "vs": [[6, "وإله وآب واحد للجميع، وهو فوق الجميع وبالجميع وفي الجميع."]]}, {"l": "1Ti 2:5", "n": "", "vs": [[5, "فإن الله واحد، والوسيط بين الله والناس واحد، وهو الإنسان المسيح يسوع،"]]}, {"l": "Jud 1:4", "n": "", "vs": [[4, "لأنه قد تسلل إلى ما بينكم معلمون لابد أن يلاقوا الحكم بالعقاب الأبدي، كما هو مكتوب لهم منذ القديم. فهم أشرار لا يهابون الله ، يتخذون من نعمة إلهنا فرصة لإباحة الرذائل، وينكرون سيدنا وربنا الوحيد يسوع المسيح."]]}], "kwAr": "الإيمان بإله واحد", "noteAr": ""}, {"kw": "thou doest", "raw": "Jam_2:8; Jon_4:4, Jon_4:9; Mar_7:9", "note": "", "refs": [{"l": "Jam 2:8", "n": "", "vs": [[8, "ما أحسن عملكم حين تطبقون تلك القاعدة الملوكية الواردة في الكتاب: «تحب قريبك كما تحب نفسك!»"]]}, {"l": "Jon 4:4", "n": "", "vs": [[4, "فقال الرب: «أأنت محق في غضبك؟»"]]}, {"l": "Jon 4:9", "n": "", "vs": [[9, "فقال الله ليونان: «أأنت محق في غضبك من أجل اليقطينة؟» فأجاب: «أنا محق في غضبي حتى الموت»."]]}, {"l": "Mar 7:9", "n": "", "vs": [[9, "وقال لهم: «حقا أنكم رفضتم وصية الله لتحافظوا على تقليدكم أنتم!"]]}], "kwAr": "حسنا تفعل", "noteAr": ""}, {"kw": "the", "raw": "Mat_8:29; Mar_1:24, Mar_5:7; Luk_4:34; Act_16:17, Act_19:15, Act_24:25; Jud_1:6; Rev_20:2, Rev_20:3, Rev_20:10", "note": "", "refs": [{"l": "Mat 8:29", "n": "", "vs": [[29, "وفجأة صرخا قائلين: «ما شأنك بنا يايسوع ابن الله؟ أجئت إلى هنا قبل الأوان لتعذبنا؟»"]]}, {"l": "Mar 1:24", "n": "", "vs": [[24, "وقال: «ما شأنك بنا يايسوع الناصري؟ أجئت لتهلكنا؟ أنا أعرف من أنت. أنت قدوس الله!»"]]}, {"l": "Mar 5:7", "n": "", "vs": [[7, "وصرخ بأعلى صوته: «ما شأنك بي يايسوع ابن الله العلي؟ أستحلفك بالله ألا تعذبني!»"]]}, {"l": "Luk 4:34", "n": "", "vs": [[34, "«آه! ما شأنك بنا يايسوع الناصري؟ أجئت لتهلكنا؟ أنا أعرف من أنت: أنت قدوس الله»."]]}, {"l": "Act 16:17", "n": "", "vs": [[17, "فأخذت تسير وراء بولس ووراءنا صارخة: «هؤلاء الناس هم عبيد الله العلي، يعلنون لكم طريق الخلاص»."]]}, {"l": "Act 19:15", "n": "", "vs": [[15, "فأجابهم الروح الشرير: «يسوع أنا أعرفه، وبولس أفهمه. ولكن، من أنتم؟»"]]}, {"l": "Act 24:25", "n": "", "vs": [[25, "ولما تحدث بولس عن البر وضبط النفس والدينونة الآتية ارتعب فيلكس، وقال لبولس: «اذهب الآن، ومتى توفر لي الوقت أستدعيك ثانية»."]]}, {"l": "Jud 1:6", "n": "", "vs": [[6, "وأما الملائكة الذين لم يحافظوا على مقامهم الرفيع، بل تركوا مركزهم، فمازال الرب يحفظهم مقيدين بسلاسل أبدية في أعماق الظلام، بانتظار دينونة ذلك اليوم العظيم."]]}, {"l": "Rev 20:2", "n": "", "vs": [[2, "قيد بها التنين، أي الحية القديمة، وهو إبليس أو الشيطان، وسجنه مدة ألف سنة،"]]}, {"l": "Rev 20:3", "n": "", "vs": [[3, "وطرحه في الهاوية وأغلقها عليه، وختمها، حتى يكف عن تضليل الأمم، إلى أن تنقضي الألف سنة. ولكن لابد من إطلاقه بعد ذلك لمدة قصيرة."]]}, {"l": "Rev 20:10", "n": "", "vs": [[10, "ثم يطرح إبليس الذي كان يضللهم، في بحيرة النار والكبريت، حيث الوحش والنبي الدجال. هناك سوف يعذبون نهارا وليلا، إلى أبد الآبدين."]]}], "kwAr": "الشياطين أيضا تؤمن", "noteAr": ""}], "arS": [["أنت", ["G4771"]], [" ", []], ["تؤمن", ["G4100"]], [" ", []], ["أن", ["G3754"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["واحد", ["G1520"]], ["؟ ", []], ["حسنا", ["G2573"]], [" ", []], ["تفعل", ["G4160"]], [" ! ", []], ["والشياطين", ["G1 17, "وبالإيمان، إبراهيم أيضا، لما امتحنه الله ، قدم إسحاق ابنه. فإنه، إذ قبل وعود الله، قدم ابنه الوحيد ذبيحة،"], [18, "مع أن الله قال له: «بإسحاق سوف يكون لك نسل يحمل اسمك!»"], [19, "فقد آمن إبراهيم بأن الله قادر على إقامة إسحاق من الموت. والواقع أن إبراهيم استعاد ابنه من الموت، على سبيل المثال أو الرمز."]]}], "kwAr": "إيمان إبراهيم قد رافقته الأعمال", "noteAr": ""}, {"kw": "faith made", "raw": "1Jo_2:5, 1Jo_4:17, 1Jo_4:18", "note": "", "refs": [{"l": "1Jo 2:5", "n": "", "vs": [[5, "أما الذي يعمل بحسب كلمة المسيح، فإن محبة الله تكون قد اكتملت في داخله. بهذا نعرف أننا ننتمي إلى المسيحِ."]]}, {"l": "1Jo 4:17", "n": "", "vs": [[17, "وتكون محبة الله قد اكتملت في داخلنا حين تولد فينا ثقة كاملة من جهة يوم الدينونة: لأنه كما المسيح، هكذا نحن أيضا في هذا العالم."]]}, {"l": "1Jo 4:18", "n": "", "vs": [[18, "ليس في المحبة أي خوف. بل المحبة الكاملة تطرد الخوف خارجا. فإن الخوف يأتي من العقاب. والخائف لا تكون محبة الله قد اكتملت فيه."]]}], "kwAr": "فبالأعمال قد اكتمل الإيمان", "noteAr": ""}], "arS": [["فأنت ", []], ["ترى", ["G991"]], [" ", []], ["أن", ["G3754"]], [" ", []], ["إيمان", ["G4102"]], [" إبراهيم قد ", []], ["رافقته", ["G4903"]], [" ", []], ["الأعمال", ["G2041"]], [". ", []], ["فبالأعمال", ["G2041"]], [" قد ", []], ["اكتمل", ["G5048"]], [" ", []], ["الإيمان", ["G4102"]], [".", []]]}, {"c": 2, "v": 23, "text": "وهكذا، تم ما قاله الكتاب: «آمن إبراهيم بالله، فحسب له ذلك برا»، حتى إنه دعي «خليل الله».", "groups": [{"kw": "the scripture", "raw": "Mar_12:10, Mar_15:28; Luk_4:21; Act_1:16; Rom_9:17, Rom_11:2; Gal_3:8-10,Gal_3:22; 2Ti_3:16; 1Pe_2:6", "note": "", "refs": [{"l": "Mar 12:10", "n": "", "vs": [[10, "أفما قرأ تم هذه الآية المكتوبة: الحجر الذي رفضه البناة، هو نفسه صار حجر الزاوية."]]}, {"l": "Mar 15:28", "n": "", "vs": [[28, "فتمت الآية القائلة: «وأحصي مع المجرمين»."]]}, {"l": "Luk 4:21", "n": "", "vs": [[21, "فأخذ يخاطبهم قائلا: «اليوم تم ما قد سمعتم من آيات...»"]]}, {"l": "Act 1:16", "n": "", "vs": [[16, "«أيها الإخوة، كان لابد من أن تتم النبوءة التي قالها الروح ا  ", []], ["آخر", ["G2087"]], [".", []]]}, {"c": 2, "v": 26, "text": "فكما أن جسم الإنسان يكون ميتا إذا فارقته الروح، كذلك يكون الإيمان ميتا إذا لم ترافقه الأعمال!", "groups": [{"kw": "as", "raw": "Job_34:14, Job_34:15; Psa_104:29, Psa_146:4; Ecc_12:7; Isa_2:22; Luk_23:46; Act_7:59, Act_7:60", "note": "", "refs": [{"l": "Job 34:14", "n": "", "vs": [[14, "إن استرجع روحه إليه واستجمع نسمته إلى نفسه"]]}, {"l": "Job 34:15", "n": "", "vs": [[15, "فالبشر جميعا يفنون معا، ويعود الإنسان إلى التراب."]]}, {"l": "Psa 104:29", "n": "", "vs": [[29, "تحجب عنها وجهك فتفزع. تقبض أرواحها فتموت، وإلى ترابها تعود."]]}, {"l": "Psa 146:4", "n": "", "vs": [[4, "تنطلق روحه منه فيعود إلى ترابه، وآنئذ تندثر تدابيره."]]}, {"l": "Ecc 12:7", "n": "", "vs": [[7, "فيعود التراب إلى الأرض كما كان، وترجع الروح إلى الله واهبها."]]}, {"l": "Isa 2:22", "n": "", "vs": [[22, "كفوا عن الاتكال على الإنسان المعرض للموت؛ فأي قيمة له؟"]]}, {"l": "Luk 23:46", "n": "", "vs": [[46, "وقال يسوع صارخا بصوت عظيم: «ياأبي، في يديك أستودع روحي!» وإذ قال هذا، أسلم الروح."]]}, {"l": "Act 7:59", "n": "", "vs": [[59, "وبينما كانوا يرجمون استفانوس، كان يدعو: «أيها الرب يسوع، اقبل روحي!»"]]}, {"l": "Act 7:60", "n": "", "vs": [[60, "ثم ركع وصرخ بصوت عال: «يارب، لا تحسب عليهم هذه الخطيئة!» وإذ قال هذا رقد."]]}], "kwAr": "كما أن جسم الإنسان", "noteAr": ""}, {"kw": "spirit", "raw": "or, breath", "note": "or, breath", "refs": [], "kwAr": "الروح", "noteAr": "أو: النفَس."}, {"kw": "so", "raw": "Jam_2:14, Jam_2:17, Jam_2:20", "note": "", "refs": [{"l": "Jam 2:14", "n": "", "vs": [[14, "ياإخوتي، هل ينفع أحدا أن يدعي أنه مؤمن، وليس له أعمال تثبت ذلك، هل يقدر إيمان مثل هذا أن يخلصه؟"]]}, {"l": "Jam 2:17", "n": "", "vs": [[17, "هكذا نرى أن الإيمان وحده ميت ما لم تنتج عنه أعمال."]]}, {"l": "Jam 2:20", "n": "", "vs": [[20, "وهذا يؤكد لك، أيها الإنسان الغبي، أن الإيمان الذي لا تنتج عنه أعمال هو إيمان ميت!"]]}], "kwAr": "كذلك يكون الإيمان ميتا", "noteAr": ""}], "arS": [["فكما", ["G5618"]], [" أن ", []], ["جسم", ["G4983"]], [" الإنسان يكون ", []], ["ميتا", ["G3498"]], [" إذا ", []], ["فارقته", ["G5565"]], [" ", []], ["الروح", ["G4151"]], ["، ", []], ["كذلك", ["G3779"]], [" يكون ", []], ["الإيمان", ["G4102"]], [" ", []], ["ميتا", ["G3498"]], [" إذا لم ترافقه ", []], ["الأعمال", ["G2041"]], ["!", []]]}, {"c": 3, "v": 1, "text": "ياإخوتي، لا تتسابقوا كي تجعلوا أنفسكم معلمين لغيركم فتزيدوا عدد المعلمين! واذكروا أننا، نحن المعلمين، سوف نحاسب حسابا أقسى من غيرنا.", "groups": [{"kw": "be", "raw": "Mal_2:12; Mat_9:11, Mat_10:24, Mat_23:8-10,Mat_23:14; Joh_3:10; Act_13:1; Rom_2:20,Rom_2:21; 1Co_12:28; Eph_4:11; 1Ti_2:7; 2Ti_1:11 *Gr: 1Pe_5:3", "note": "", "refs": [{"l": "Mal 2:12", "n": "", "vs": [[12, "ليستأصل الرب من شعب إسرائيل كل من فعل هذا، من غير تمييز، وحتى ممن يقدمون قرابين للرب القدير."]]}, {"l": "Mat 9:11", "n": "", "vs": [[11, "وعندما رأى الفريسيون ذلك، قالوا لتلاميذه: «لماذا يأكل معلمكم مع الجباة والخاطئين؟»"]]}, {"l": "Mat 10:24", "n": "", "vs": [[24, "ليس التلميذ أرفع من المعلم، ولا العبد أرفع من سيده."]]}, {"l": "Mat 23:8-10", "n": "", "vs": [[8, "أما أنتم، فلا تقبلوا أن يدعوكم أحد: يامعلم! لأن معلمكم واحد، وأنتم جميعا إخوة."], [9, "ولا تدعوا أحدا على الأرض أبا لكم: لأن أباكم واحد، وهو الآب الذي في السماوات."], [10, "ولا تقبلوا أن يدعوكم أحد رؤساء، لأن رئيسكم واحد، وهو المسيح."]]}, {"l": "Mat 23:14", "n": "", "vs": [[14, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تلتهمون بيوت الأرامل وتتذرعون بإطالة صلواتكم. لذلك ستنزل بكم دينونة أقسى!"]]}, {"l": "Joh 3:10", "n": "", "vs": [[10, "أجابه يسوع: «أنت معلم إسرائيل ولا تعلم هذا!"]]}, {"l": "Act 13:1", "n": "", "vs": [[1, "وكان في الكنيسة التي في أنطاكية بعض الأنبياء والمعلمين؛ ومنهم برنابا؛ وسمعان الذي يدعى الأسود؛ ولوكيوس من القيروان؛ ومناين الذي تربى في طفولته مع هيرودوس حاكم الربع؛ وشاول."]]}, {"l": "Rom 2:20", "n": "", "vs": [[20, "ومؤدب للجهال، ومعلم للأطفال؛ ولك في الشريعة صورة المعرفة والحق؛"]]}, {"l": "Rom 2:21", "n": "", "vs": [[21, "فأنت إذن، يامن تعلم غيرك، أما تعلم نفسك؟ أنت يامن تعظ أن لا يسرق، أتسرق؟"]]}, {"l": "1Co 12:28", "n": "", "vs": [[28, "وقد رتب الله في الكنيسة أشخاصا مخصوصين: أولا الرسل، ثانيا الأنبياء، ثالثا المعلمين، وبعد ذلك أصحاب المواهب المعجزية أو مواهب الشفاء أو إعانة الآخرين أو تدبير الشؤون أو التكلم باللغات المختلفة."]]}, {"l": "Eph 4:11", "n": "", "vs": [[11, "وهو قد وهب البعض أن يكونوا رسلا، والبعض أنبياء، والبعض مبشرين والبعض رعاة ومعلمين،"]]}, {"l": "1Ti 2:7", "n": "", "vs": [[7, "ولها قد عينت أنا مبشرا ورسولا، الحق أقول ولست أكذب، معلما للأمم في الإيمان والحق."]]}, {"l": "2Ti 1:11", "n": "*Gr:", "vs": [[11, "الذي له عينت أنا مبشرا ورسولا ومعلما."]]}, {"l": "1Pe 5:3", "n": "", "vs": [[3, "لا تتسلطوا على القطيع الذي وضعه الله أمانة بين أيديكم، بل كونوا قدوة له."]]}], "kwAr": "لا تتسابقوا كي تجعلوا أنفسكم معلمين", "noteAr": ""}, {"kw": "knowing", "raw": "Lev_10:3; Eze_3:17, Eze_3:18, Eze_33:7-9; Luk_6:37, Luk_12:47, Luk_12:48, Luk_16:2; Act_20:26, Act_20:27; 1Co_4:2-5; 2Co_5:10; Heb_13:17", "note": "", "refs": [{"l": "Lev 10:3", "n": "", "vs": [[3, "فقال موسى لهرون: «إليك ما قاله الرب: في القريبين مني أظهر قداستي، وأعلن مجدي أمام جميع الشعب». فصمت هرون."]]}, {"l": "Eze 3:17", "n": "", "vs": [[17, "«ياابن آدم، قد جعلتك رقيبا لشعب إسرائيل، فأصغ إلى كلمتي وأنذرهم بها على لساني."]]}, {"l": "Eze 3:18", "n": "", "vs": [[18, "فإذا قلت للشرير: أنت لابد مائت، وأنت لم تنذره ولم تحذره ليرجع عن طرقه الأثيمة فيحيا، فإن ذلك الشرير يموت بذنبه، أما دمه فمن يدك أطلبه."]]}, {"l": "Eze 33:7-9", "n": "", "vs": [[7, "وأنت ياابن آدم، قد أقمتك رقيبا لشعب إسرائيل، فتسمع قضائي، وتحذرهم من قبلي."], [8, "إن قلت للشرير: ياشر ير إنك حتما تموت من أجل شرك، ولم تعمد إلى تحذيره من طريقه، فإن ذلك الشرير يموت بذنبه، أما دمه فمن يدك أطلبه."], [9, "ولكن إن حذرت الشرير ليرتدع عن طريقه فأبى فهو يموت بذنبه، أما أنت فتكون قد خلصت نفسك."]]}, {"l": "Luk 6:37", "n": "", "vs": [[37, "ولا تدينوا، فلا تدانوا. لا تحكموا على أحد، فلا يحكم عليكم. اغفروا، يغفر لكم."]]}, {"l": "Luk 12:47", "n": "", "vs": [[47, "وأما ذلك العبد الذي يعمل بإرادة سيده، فإنه سيضرب كثيرا."]]}, {"l": "Luk 12:48", "n": "", "vs": [[48, "ولكن الذي لا يعلمها ويعمل ما يستوجب الضرب، فإنه سيضرب قليلا. فكل من أعطي كثيرا، يطلب منه كثير؛ ومن أودع كثيرا، يطالب بأكثر."]]}, {"l": "Luk 16:2", "n": "", "vs": [[2, "فاستدعاه وسأله: ما هذا الذي أسمع عنك؟ قدم حساب وكالتك، فإنك لا يمكن أن تكون وكيلا لي بعد!"]]}, {"l": "Act 20:26", "n": "", "vs": [[26, "لذلك أشهد لكم اليوم أني بريء من دمكم جميعا،"]]}, {"l": "Act 20:27", "n": "", "vs": [[27, "لأني لم أمتنع عن إبلاغكم جميع مقاصد الله."]]}, {"l": "1Co 4:2-5", "n": "", "vs": [[2, "والمطلوب من الوكلاء، قبل كل شيء، أن يوجد كل منهم أمينا."], [3, "أما أنا، فأقل ما أهتم به هو أن يتم الحكم في من قبلكم أو من قبل محكمة بشرية. بل أنا بذاتي لست أحكم على نفسي."], [4, "فإن ضميري لا يؤنبني بشيء، ولكني لست أعتمد ذلك لتبرير نفسي. فإن الذي يحكم في هو الرب."], [5, "إذن، لا تحكموا في شيء قبل الأوان، ريثما يرجع الرب الذي سيسلط النور على الأشياء التي يحجبها الظلام الآن، ويكشف نيات القلوب، عندئذ ينال كل واحد حقه من المدح من عند الله!"]]}, {"l": "2Co 5:10", "n": "", "vs": [[10, "إذ لابد أن نقف جميعا مكشوفين أمام عرش المسيح، لينال كل واحد منا استحقاق ما عمله حين كان في الجسد، أصالحا كان أم رديئا!"]]}, {"l": "Heb 13:17", "n": "", "vs": [[17, "أطيعوا مرشديكم، واخضعوا لهم، لأنهم يسهرون على مصلحتكم الروحية، كما يسهر الذي يحمل مسئولية سوف يقدم حسابا عن قيامه بها. وعندئذ، يؤدون مهمتهم بفرح دون تذمر. فلن يكون في تذمرهم نفع لكم!"]]}], "kwAr": "واذكروا", "noteAr": ""}, {"kw": "condemnation", "raw": "or, judgment, Mat_7:1, Mat_7:2, Mat_23:14; 1Co_11:29-32 *Gr.", "note": "or, judgment, Mat_7:1, Mat_7:2, Mat_23:14; 1Co_11:29-32 *Gr.", "refs": [{"l": "Mat 7:1", "n": "", "vs": [[1, "لا تدينوا لئلا تدانوا."]]}, {"l": "Mat 7:2", "n": "", "vs": [[2, "فإنكم بالدينونة التي بها تدينون تدانون؛ وبالكيل الذي به تكيلون يكال لكم."]]}, {"l": "Mat 23:14", "n": "", "vs": [[14, "الويل لكم أيها الكتبة والفريسيون المراؤون! فإنكم تلتهمون بيوت الأرامل وتتذرعون بإطالة صلواتكم. لذلك ستنزل بكم دينونة أقسى!"]]}, {"l": "1Co 11:29-32", "n": "*Gr.", "vs": [[29, "لأن الآكل والشارب يأكل ويشرب الحكم على نفسه إذ لا يميز جسد الرب."], [30, "لهذا السبب فيكم كثيرون من الضعفاء والمرضى، وكثيرون يرقدون."], [31, "فلو كنا حكمنا على نفوسنا، لما كان حكم علينا."], [32, "ولكن، ما دام قد حكم علينا، فإننا نؤدب من قبل الرب حتى لا ندان مع العالم."]]}], "kwAr": "حسابا أقسى", "noteAr": "أو: دينونة (حُكم)."}], "arS": [["ياإخوتي", ["G3450", "G80"]], ["، ", []], ["لا", ["G3361"]], [" تتسابقوا كي ", []], ["تجعلوا", ["G1096"]], [" أنفسكم ", []], ["معلمين", ["G1320"]], [" لغيركم فتزيدوا ", []], ["عدد", ["G4183"]], [" المعلمين! ", []], ["واذكروا", ["G1492"]], [" ", []], ["أننا", ["G3754"]], ["، نحن المعلمين، سوف ", []], ["نحاسب", ["G2983"]], [" ", []], ["حسابا", ["G2917"]], [" ", []], ["أقسى", ["G3187"]], [" من غيرنا.", []]]}, {"c": 3, "v": 2, "text": "فإننا جميعا معرضون للوقوع في أخطاء كثيرة. ولكن من يلجم لسانه ولا يخطيء في كلامه هو ناضج يقدر أن يسيطر على طبيعته سيطرة تامة.", "groups": [{"kw": "in", "raw": "1Ki_8:46; 2Ch_6:36; Pro_20:9; Ecc_7:20; Isa_64:6; Rom_3:10, Rom_7:21; Gal_3:22, Gal_5:17; 1Jo_1:8-10", "note": "", "refs": [{"l": "1Ki 8:46", "n": "", "vs": [[46, "وإذا أخطأوا إليك، إذ ليس إنسان لا يأثم، وغضبت عليهم وأسلمتهم للعدو فسباهم آسروهم إلى ديار العدو، بعيدة أو قريبة."]]}, {"l": "2Ch 6:36", "n": "", "vs": [[36, "وإذا أخطأوا إليك، إذ ليس إنسان لا يأثم، وغضبت عليهم وأسلمتهم للعدو، فسباهم آسروهم إلى ديارهم، بعيدة كانت أم قريبة،"]]}, {"l": "Pro 20:9", "n": "", "vs": [[9, "من يدعي قائلا: إني نقيت قلبي، وتطهرت من خطيئتي؟"]]}, {"l": "Ecc 7:20", "n": "", "vs": [[20, "ليس من صديق على وجه الأرض يصنع خيرا ولا يخطيء."]]}, {"l": "Isa 64:6", "n": "", "vs": [[6, "كلنا أصبحنا كنجس، وأضحت جميع أعمال برنا كثوب قذر، فذبلنا كأوراق الشجر وعبثت بنا آثامنا كالريح."]]}, {"l": "Rom 3:10", "n": "", "vs": [[10, "كما قد كتب:"]]}, {"l": "Rom 7:21", "n": "", "vs": [[21, "إذن، أجد نفسي، أنا الذي يريد أن يعمل ما هو صالح، خاضعا لهذا الناموس:"]]}, {"l": "Gal 3:22", "n": "", "vs": [[22, "ولكن الكتاب حبس الجميع تحت الخطيئة، حتى إن الوعد، على أساس الإيمان بيسوع المسيح، يوهب للذين يؤمنون."]]}, {"l": "Gal 5:17", "n": "", "vs": [[17, "فإن الجسد يشتهي بعكس الروح، والروح بعكس الجسد؛ وهذان يقاوم أحدهما الآخر حتى إنكم لا تفعلون ما ترغبون فيه."]]}, {"l": "1Jo 1:8-10", "n": "", "vs": [[8, "إن كنا ندعي أن لا خطيئة لنا، نخدع أنفسنا، ولا يكون الحق في داخلنا."], [9, "ولكن، إن اعترفنا لله بخطايانا، فهو جدير بالثقة وعادل، يغفر لنا خطايانا ويطهرنا من كل إثم."], [10, "فإن كنا ندعي أننا لم نرتكب خطيئة، نجعل الله كاذبا، ولا تكون كلمته في داخلنا!"]]}], "kwAr": "معرضون للوقوع في أخطاء كثيرة", "noteAr": ""}, {"kw": "If", "raw": "Jam_3:5, Jam_3:6, Jam_1:26; Psa_34:13; Pro_13:3; 1Pe_3:10", "note": "", "refs": [{"l": "Jam 3:5", "n": "", "vs": [[5, "ولكن ما أشد فعاليته! انظروا: إن شرارة صغيرة تحرق غابة كبيرة!"]]}, {"l": "Jam 3:6", "n": "", "vs": [[6, "واللسان كالنار خطرا: فهو وحده، بين أعضاء الجسم، جامع للشرور كلها، ويلوث الجسم كله بالفساد. إنه يشعل دائرة الكون، ويستمد ناره من جهنم!"]]}, {"l": "Jam 1:26", "n": "", "vs": [[26, "وإن ظن أحد أنه متدين، وهو لا يلجم لسانه، فإنه يغش قلبه، وديانته غير نافعة!"]]}, {"l": "Psa 34:13", "n": "", "vs": [[13, "فليمنع لسانه عن الشر وشفتيه عن كلام الغش"]]}, {"l": "Pro 13:3", "n": "", "vs": [[3, "من ضبط لسانه صان حياته، ومن فغر شدقيه متهورا بكلامه، فمصيره الدمار."]]}, {"l": "1Pe 3:10", "n": "", "vs": [[10, "فمن أراد أن يتمتع بحياة سعيدة وأيام طيبة، فليمنع لسانه عن الشر وشفتيه عن كلام الغش."]]}], "kwAr": "من لا يخطئ في كلامه", "noteAr": ""}, {"kw": "a perfect", "raw": "Jam_1:4; Mat_12:37; Col_1:28, Col_4:12; Heb_13:21; 1Pe_5:10", "note": "", "refs": [{"l": "Jam 1:4", "n": "", "vs": [[4, "ودعوا الصبر يعمل عمله الكامل فيكم، لكي يكتمل نضوجكم وتصيروا أقوياء قادرين على مواجهة جميع الأحوال."]]}, {"l": "Mat 12:37", "n": "", "vs": [[37, "فإنك بكلامك تبرر، وبكلامك تدان ! »"]]}, {"l": "Col 1:28", "n": "", "vs": [[28, "هذا السر نعلنه نحن، واعظين كل إنسان، ومعلمين كل إنسان، في كل حكمة، لكي نحضر كل إنسان كاملا في المسيح."]]}, {"l": "Col 4:12", "n": "", "vs": [[12, "يسلم عليكم أبفراس الذي هو منكم، وهو عبد للمسيح يسوع، يجاهد كل حين لأجلكم في الصلوات لتثبتوا كاملين ولكم تمام اليقين من جهة مشيئة الله كلها."]]}, {"l": "Heb 13:21", لي هذه الليلة ملاك من عند الله الذي أنا له وإياه أخدم،"], [24, "وقال لي: لا تخف يابولس! فلابد أن تمثل أمام القيصر. وقد وهبك الله حياة جميع المسافرين معك!"], [25, "فاطمئنوا أيها الرجال، لأني أومن بالله وبأن ما قاله لي سيتم."], [26, "ولكن لابد أن تجنح السفينة إلى إحدى الجزر»."], [27, "وفي منتصف الليلة الرابعة عشرة، والرياح تحملنا في بحر أدريا إلى حيث لا ندري، ظن البحارة أنهم يقتربون إلى البر."], [28, "فقاسوا عمق المياه فوجدوه عشرين قامة. وبعد قليل قاسوا العمق فوجدوه خمس عشرة قامة."], [29, "وخافوا أن تجنح السفينة إلى الصخور، فألقوا من مؤخرها أربع مراس، منتظرين طلوع الصباح."], [30, "وحاول البحارة أن يهربوا من السفينة، فأنزلوا قارب النجاة بحجة أنهم سيلقون المراسي من مقدم السفينة."], [31, "فقال بولس لقائد المئة والجنود: «إذا لم يبق هؤلاء البحارة في السفينة فلن تنجوا»."], [32, "فقطع الجنود حبال القارب وتركوه يسقط في الماء."], [33, "ولما اقترب طلوع الصباح، طلب بولس إلى الجميع أن يأكلوا، وقال: «مرت أربعة عشر يوما وأنتم لا تأكلون شيئا،"], [34, "فأدعوكم إلى تناول الطعام، لأنه يساعدكم على النجاة. فلن يفقد أحد منكم شعرة من رأسه»."], [35, "ثم أخذ رغيفا، وشكر الله أمام الجميع، وكسره وابتدأ يأكل،"], [36, "فاطمأنوا كلهم وأكلوا."], [37, "وكان عددنا في السفينة مئتين وستة وسبعين نفسا."], [38, "وبعدما شبعوا رموا بالقمح في البحر ليخففوا حمولة السفينة."]]}], "kwAr": "الرياح التي تدفعها قوية وهوجاء", "noteAr": ""}], "arS": [["ومهما كانت ", []], ["السفينة", ["G4143"]], [" ", []], ["كبيرة", ["G5082"]], [" ", []], ["والرياح", ["G417"]], [" التي ", []], ["تدفعها", ["G1643"]], [" ", []], ["قوية", ["G4642"]], [" وهوجاء، ", []], ["فبدفة", ["G4079"]], [" صغيرة ", []], ["جدا", ["G1646"]], [" ", []], ["يتحكم", ["G3329"]], [" ", []], ["الربان", ["G3730", "G2116"]], [" فيها ويسوقها إلى الجهة ", []], ["التي", ["G3699", "G302"]], [" ", []], ["يريد", ["G1014"]], [". ", []], ["كذلك", ["G3779"]], [" ", []], ["اللسان", ["G1100"]], [" أيضا: فهو ", []], ["عضو", ["G3196"]], [" ", []], ["صغير", ["G3398"]], ["،", []]]}, {"c": 3, "v": 5, "text": "ولكن ما أشد فعاليته! انظروا: إن شرارة صغيرة تحرق غابة كبيرة!", "groups": [{"kw": "so", "raw": "Exo_5:2, Exo_15:9; 2Ki_19:22-24; Job_21:14, Job_21:15, Job_22:17; Psa_10:3, Psa_12:2-4; Psa_17:10, Psa_52:1, Psa_52:2, Psa_73:8, Psa_73:9; Pro_12:18, Pro_15:2, Pro_18:21; Jer_9:3-8, Jer_18:18; Eze_28:2, Eze_29:3; Dan_3:15, Dan_4:30; 2Pe_2:18; Jud_1:16; Rev_13:5, Rev_13:6", "note": "", "refs": [{"l": "Exo 5:2", "n": "", "vs": [[2, "فقال فرعون: «من هو الرب حتى أطيع أمره وأطلق إسرائيل؟ أنا لا أعرف الرب ولن أطلق بني إسرائيل»."]]}, {"l": "Exo 15:9", "n": "", "vs": [[9, "قال العدو: أسعى وراءهم فأدركهم. أقسم أسلابهم وتشتفي منهم نفسي. أستل سيفي بيدي وأهلكهم."]]}, {"l": "2Ki 19:22-24", "n": "", "vs": [[22, "من عيرت وجدفت عليه؟ وعلى من رفعت صوتا وشمخت بعينيك زهوا؟ أعلى قدوس إسرائيل؟"], [23, "لقد عيرت السيد على لسان رسلك، وقلت: بكثرة مركباتي قد صعدت إلى أعالي الجبال، وبلغت أقاصي لبنان قاطعا أطول أرزه وخيار سروه واخترقت أبعد ربوعه وأفضل غاباته."], [24, "قد حفرت آبارا في أرض غريبة وشربت مياها، وبباطن قدمي جففت جميع خلجان مصر."]]}, {"l": "Job 21:14", "n": "", "vs": [[14, "يقولون للرب: فارقنا فإننا لا نعبأ بمعرفة طرقك."]]}, {"l": "Job 21:15", "n": "", "vs": [[15, "من هو القدير حتى نعبده؟ وأي كسب نجنيه إن صلينا إليه؟"]]}, {"l": "Job 22:17", "n": "", "vs": [[17, "قائلين لله: فارقنا. وماذا في وسع الله أن يفعل بهم؟"]]}, {"l": "Psa 10:3", "n": "", "vs": [[3, "الشرير يفتخر بشهوات نفسه، والرجل الطماع يلعن ويجدف على الله."]]}, {"l": "Psa 12:2-4", "n": "", "vs": [[2, "كل إنسان يخاطب صاحبه بالباطل: بشفاه ملقة وقلوب منافقة يتحادثون."], [3, "يقطع الرب كل الشفاه الملقة، وكل لسان متبجح."], [4, "الذين قالوا: ألسنتنا لنا وبها نسود. فمن يتحكم فينا؟"]]}, {"l": "Psa 17:10", "n": "", "vs": [[10, "عواطفهم متحجرة لا تشفق. أفواههم تنطق بالكبرياء."]]}, {"l": "Psa 52:1", "n": "", "vs": [[1, "لماذا تتفاخر بالشر أيها الجبار؟ إن رحمة الله تدوم اليوم كله"]]}, {"l": "Psa 52:2", "n": "", "vs": [[2, "لسانك يخترع المساويء، ويمارس الغش ويجرح كالموسى المسنونة."]]}, {"l": "Psa 73:8", "n": "", "vs": [[8, "يستهزئون ويتكلمون بالظلم خبثا، وبكبرياء ينطقون."]]}, {"l": "Psa 73:9", "n": "", "vs": [[9, "جدفوا على السماء بأفواههم، ولوثوا الأرض بخبث ألسنتهم."]]}, {"l": "Pro 12:18", "n": "", "vs": [[18, "رب مهذار تنفذ كلماته كطعنات السيف، وفي أقوال فم الحكماء شفاء."]]}, {"l": "Pro 15:2", "n": "", "vs": [[2, "لسان الحكيم يتقن المعرفة، وأقوال الجهال تفيض حماقة."]]}, {"l": "Pro 18:21", "n": "", "vs": [[21, "في اللسان حياة أو موت، والمولعون باستخدامه يتحملون العواقب."]]}, {"l": "Jer 9:3-8", "n": "", "vs": [[3, "«قد وتروا ألسنتهم كقسي جاهزة ليطلقوا الأكاذيب التي تقولوا بها في الأرض من دون الحق، إذ أنهم انتهوا من شر إلى شر، وإياي لم يعرفوا» يقول الرب."], [4, "«ليحترس كل واحد من جاره، ولا يثق بأحد من أقربائه، لأن كل قريب مخادع، وكل صاحب واش."], [5, "كل واحد منهم يخدع جاره ولا ينطقون بالصدق. دربوا ألسنتهم على قول الكذب، وأرهقوا أنفسهم في ارتكاب الإثم."], [6, "يجمعون ظلما فوق ظلم، وخداعا على خداع، وأبوا أن يعرفوني»."], [7, "لذلك يعلن الرب القدير: «ها أنا أمحصهم وأمتحنهم، إذ أي شيء آخر يمكن أن أفعله عقابا لخطايا أورشليم؟"], [8, "لسانهم كسهم قاتل يتفوه بالكذب. وبفمه يخاطب جاره بحديث السلام، أما في قلبه فينصب له كمينا."]]}, {"l": "Jer 18:18", "n": "", "vs": [[18, "ثم قالوا: «تعالوا نتآمر على إرميا، لأن الشريعة لا تبيد عن الكاهن، ولا المشورة عن الحكيم، ولا الوحي عن النبي. تعالوا نلذعه بوخزات اللسان ونصم آذاننا عن كلامه»."]]}, {"l": "Eze 28:2", "n": "", "vs": [[2, "«ياابن آدم، قل لملك صور، هذا ما يعلنه السيد الرب: لأنك تكبرت وقلت: «أنا إله، وأتربع في مجلس الآلهة، في قلب البحار»؛ مع أنك إنسان ولست إلها، وإن ظننت أن لديك حكمة الآلهة!"]]}, {"l": "Eze 29:3", "n": "", "vs": [[3, "وقل هذا ما يعلنه السيد الرب: ها أنا أنقلب عليك يافرعون ملك مصر، أيها التمساح الكامن في وسط أنهاره، القائل: النهر لي وقد صنعته لنفسي."]]}, {"l": "Dan 3:15", "n": "", "vs": [[15, "والآن إن كنتم مستعدين لدى سماعكم صوت الالات الموسيقية المختلفة أن تنحنوا وتسجدوا للتمثال الذي صنعته، أعفو عنكم. ولكن إن أبيتم السجود، تطرحون في تلك الساعة في وسط أتون النار المتقدة. وأي إله يقدر أن ينقذكم عندئذ من يدي؟»"]]}, {"l": "Dan 4:30", "n": "", "vs": [[30, "قال: «أليست هذه هي بابل العظيمة التي بنيتها بقوة اقتداري لتكون عاصمة للمملكة، ولجلال مجدي؟»"]]}, {"l": "2Pe 2:18", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."]]}, {"l": "Jud 1:16", "n": "", "vs": [[16, "وهؤلاء المعلمون يتذمرون ويشكون دائما وفيما هم يندفعون وراء شهواتهم، يطلقون ألسنتهم متحدثين بأمور طنانة، ويمدحون من يعجبهم طلبا للمنفعة!"]]}, {"l": "Rev 13:5", "n": "", "vs": [[5, "وأعطى التنين الوحش فما ينطق بكلام الكبرياء والتجديف، وأعطاه سلطة العمل مدة اثنين وأربعين شهرا."]]}, {"l": "Rev 13:6", "n": "", "vs": [[6, "فأخذ الوحش يشتم اسم الله، ويشتم بيته وسكان السماء."]]}], "kwAr": "كذلك اللسان", "noteAr": ""}, {"kw": "matter", "raw": "or, wood", "note": "or, wood", "refs": [], "kwAr": "غابة كبيرة", "noteAr": "أو: حطب (غابة)."}], "arS": [["ولكن ما أشد ", []], ["فعاليته", ["G3166"]], ["! ", []], ["انظروا", ["G2400"]], [": إن ", []], ["شرارة", ["G4442"]], [" ", []], ["صغيرة", ["G3641"]], [" ", []], ["تحرق", ["G381"]], [" ", []], ["غابة", ["G5208"]], [" ", []], ["كبيرة", ["G2245"]], ["!", []]]}, {"c": 3, "v": 6, "text": "واللسان كالنار خطرا: فهو وحده، بين أعضاء الجسم، جامع للشرور كلها، ويلوث الجسم كله بالفساد. إنه يشعل دائرة الكون، ويستمد ناره من جهنم!", "groups": [{"kw": "the tongue", "raw": "Jdg_12:4-6; 2Sa_19:43, 2Sa_20:1; 2Ch_10:13-16, 2Ch_13:17; Psa_64:3, Psa_140:3; Pro_15:1, Pro_16:27, Pro_26:20,Pro_26:21; Isa_30:27", "note": "", "refs": [{"l": "Jdg 12:4-6", "n": "", "vs": [[4, "وحشد يفتاح كل رجال جلعاد وحارب سبط أفرايم وهزمهم، لأن رجال أفرايم استخفوا بالجلعاديين قائلين: «إنهم منبوذو أفرايم ومنسى»."], [5, "فاستولى الجلعاديون على مخاوض نهر الأردن، وكلما قال أحد رجال أفرايم الهاربين: «دعوني أعبر»، كان رجال جلعاد يسألونه: «أأنت أفرايمي؟» فإن قال: «لا»"], [6, "كانوا يطلبون منه أن يقول: «شبولت» فيقول: «سبولت» من غير أن يتحفظ في لفظها لفظا صحيحا، فيقبضون عليه ويذبحونه على مخاوض الأردن. فقتل في ذلك الوقت من أفرايم إثنان وأربعون ألفا."]]}, {"l": "2Sa 19:43", "n": "", "vs": [[43, "فقال رجال إسرائيل لرجال يهوذا: «إن لنا عشرة سهام في الملك، ونحن أولى منكم بداود، فلماذا استخففتم بنا؟ أولم نكن نحن أول من تحدث عن إرجاع ملكنا؟» فكان رد رجال يهوذا أغلظ من كلام رجال إسرائيل."]]}, {"l": "2Sa 20:1", "n": "", "vs": [[1, "وحدث أن كان هناك رجل لئيم يدعى شبع بن بكري من سبط بنيامين، فنفخ هذا بالبوق وقال: «ليس لنا نصيب في داود ولا قسم في ابن يسى، فليرجع كل رجل إلى خيمته ياإسرائيل»."]]}, {"l": "2Ch 10:13-16", "n": "", "vs": [[13, "فأجابهم بقسوة لأنه تجاهل مشورة الشيوخ، التي أسدوها إليه."], [14, "وخاطبهم بما أشار عليه به الشباب قائلا: «أبي ثقل عليكم النير وأنا أزيد عليه. أبي أدبكم بالسياط، وأنا أؤدبكم بالعقارب»."], [15, "ورفض الملك الاستجابة لمطالب الشعب، وكان السبب من الرب ليتم ما تكلم به على لسان أخيا الشيلوني بشأن يربعام بن نباط."], [16, "فلما رأى كل بني إسرائيل أن الملك لم يستجب لمطالبهم، قالوا: «أي نصيب لنا في داود، وأي حظ لنا في ابن يسى؟ فليمض كل واحد إلى بيته ياإسرائيل، واعتن الآن ببيتك ياداود». وانصرف الإسرائيليون عنه إلى منازلهم."]]}, {"l": "2Ch 13:17", "n": "", "vs": [[17, "وتمكن أبيا وجيشه من القضاء عليهم قضاء مبرما، فسقط من الإسرائيليين خمس مئة ألف من خيرة المحاربين."]]}, {"l": "Psa 64:3", "n": "", "vs": [[3, "الذين سنوا ألسنتهم كالسيف، وصوبوا سهام كلامهم المر،"]]}, {"l": "Psa 140:3", "n": "", "vs": [[3, "سنوا ألسنتهم كالحية، وسم الأصلال تحت شفاههم."]]}, {"l": "Pro 15:1", "n": "", "vs": [[1, "الجواب اللين يبدد الغضب، والكلمة القارصة تهيج السخط."]]}, {"l": "Pro 16:27", "n": "", "vs": [[27, "الرجل اللئيم ينبش الشر، وعلى شفتيه تتوهج نار متقدة."]]}, {"l": "Pro 26:20", "n": "", "vs": [[20, "كما تخمد النار لافتقارها إلى الحطب، هكذا تكف الخصومة حينما يغيب النمام."]]}, {"l": "Pro 26:21", "n": "", "vs": [[21, "كما أن الفحم يزيد من اتقاد الجمر، والحطب من اشتعال النار، هكذا صاحب الخصومة يضرم النزاع."]]}, {"l": "Isa 30:27", "n": "", "vs": [[27, "انظروا ها هو الرب مقبل من بعيد بغضب متوهج ودخان متكاثف متصاعد. شفتاه تفيضان سخطا، ولسانه كنار آكلة،"]]}], "kwAr": "اللسان كالنار", "noteAr": ""}, {"kw": "a world", "raw": "Jam_2:7; Gen_3:4-6; Lev_24:11; Num_25:2, Num_31:16; Deu_13:6; Jdg_16:15-20; 1Sa_22:9-17; 2Sa_13:26-29, 2Sa_15:2-6, 2Sa_16:20-23, 2Sa_17:1, 2Sa_17:2; 1Ki_21:5-15; Pro_1:10-14, Pro_6:19, Pro_7:5, Pro_7:21-23; Jer_20:10, Jer_28:16; Mat_12:24, Mat_12:32-36; Mat_15:11-20; Mar_7:15, Mar_7:20-22, Mar_14:55-57; Act_6:13, Act_20:30; Rom_3:13, Rom_3:14; Rom_16:17, Rom_16:18; Eph_5:3, Eph_5:4; Col_3:8, Col_3:9; 2Th_2:10-12; Tit_1:11; 2Pe_2:1, 2Pe_2:2; 2Pe_3:3; 3Jo_1:10; Jud_1:8-10,Jud_1:15-18; Rev_2:14, Rev_2:15, Rev_13:1-5, Rev_13:14, Rev_18:23; Rev_19:20", "note": "", "refs": [{"l": "Jam 2:7", "n": "", "vs": [[7, "وهم الذين يستهزئون بالمسيح الذي تحملون اسمه الجميل؟"]]}, {"l": "Gen 3:4-6", "n": "", "vs": [[4, "فقالت الحية للمرأة: «لن تموتا،"], [5, "بل إن الله يعرف أنه حين تأكلان من ثمر هذه الشجرة تنفتح أعينكما فتصيران مثله، قادرين على التمييز بين الخير والشر»."], [6, "وعندما شاهدت المرأة أن الشجرة لذيذة للمأكل وشهية للعيون، ومثيرة للنظر قطفت من ثمرها وأكلت، ثم أعطت زوجها أيضا فأكل معها،"]]}, {"l": "Lev 24:11", "n": "", "vs": [[11, "فجدف ابن الإسرائيلية، المدعوة شلومية بنت دبري، من سبط دان على اسم الرب وسبه، فأحضروه إلى موسى،"]]}, {"l": "Num 25:2", "n": "", "vs": [[2, "اللواتي أغوين الشعب لحضور ذبائح آلهتهن والأكل منها والسجود لها."]]}, {"l": "Num 31:16", "n": "", "vs": [[16, "إنهن باتباعهن نصيحة بلعام أغوين بني إسرائيل لعبادة فغور، وكن سبب خيانة للرب، فتفشى الوبأ في جماعة الرب."]]}, {"l": "Deu 13:6", "n": "", "vs": [[6, "وإذا أضلك سرا أخوك ابن أمك، أو ابنك أو ابنتك، أو زوجتك المحبوبة، أو صديقك الحميم قائلا: لنذهب ونعبد آلهة أخرى غريبة عنك وعن آبائك"]]}, {"l": "Jdg 16:15-20", "n": "", "vs": [[15, "فقالت له: «كيف تدعي أنك تحبني وقلبك لا يثق بي؟ قد خدعتني ثلاث مرات ولم تطلعني على سر قوتك العظيمة»."], [16, "وظلت تلح عليه وتزعجه كل يوم بمثل هذا الكلام حتى ضاقت نفسه إلى الموت."], [17, "فكشف لها عن مكنون قلبه، وقال لها: «إنني نذير الرب منذ مولدي، لهذا لم أحلق شعري. وإن حلقته فإن قوتي تفارقني وأصبح ضعيفا كأي واحد من الناس»."], [18, "ولما أدركت دليلة أنه قد أسر لها بمكنون قلبه، استدعت أقطاب الفلسطينيين قائلة: «تعالوا هذه المرة، فقد أطلعني على سر قوته». فأقبل عليها أقطاب الفلسطينيين حاملين معهم الفضة."], [19, "فأضجعته على ركبتيها واستدعت رجلا حلق له خصلات شعره السبع، وشرعت في إذلاله بعد أن فارقته قوته."], [20, "وقالت: «الفلسطينيون قادمون عليك ياشمشون» فاستيقظ من نومه وقال: «أقوم مثل كل مرة وأنتفض». ولم يعلم أن الرب قد فارقه."]]}, {"l": "1Sa 22:9-17", "n": "", "vs": [[9, "فأجاب دواغ الأدومي الذي كان واقفا بين حاشية شاول: «لقد شاهدت ابن يسى قادما إلى نوب إلى أخيمالك بن أخيطوب"], [10, "فاستشار له الرب وزوده بطعام وأعطاه سيف جليات»."], [11, "فاستدعى الملك أخيمالك وبقية بيت أبيه من كهنة نوب، فأقبلوا جميعا إلى الملك."], [12, "فقال شاول: «اسمع يا ابن أخيطوب». فأجاب: «نعم يا سيدي»."], [13, "فقال له شاول: «لماذا اتفقتم علي أنت وابن يسى بتزويدك إياه بالخبز وبإعطائه سيفا، واستشرت له الله ليثور علي ويكمن لي كما يفعل هذا اليوم؟»"], [14, "فأجاب أخيمالك: «أي واحد من بين جميع رجالك مثل داود أمين وصهر الملك وقائد حرسه وذو مكانة رفيعة في بيتك؟"], [15, "فهل هذه هي أول مرة أستشير له فيها الله ؟ معاذ الله أن يتهمني الملك أو يتهم جميع بيت أبي بارتكاب شيء»."], [16, "فقال الملك: «إنك لا محالة مائت يا أخيمالك، أنت وجميع بيت أبيك»."], [17, "وأمر الملك حراسه الماثلين لديه: «هيا أحيطوا بكهنة الرب واقتلوهم، لأنهم أيضا قد تحالفوا مع داود، ولأنهم عرفوا أنه كان هاربا فلم يخبروني». فلم يرض حراس الملك أن يقتلوا كهنة الرب."]]}, {"l": "2Sa 13:26-29", "n": "", "vs": [[26, "فقال أبشالوم: «إذا دع أخي أمنون يذهب معنا» فقال الملك: «ولماذا يذهب أمنون معك؟»"], [27, "فألح عليه أبشالوم حتى رضي أن يذهب أمنون وأبناء الملك مع أبشالوم."], [28, "وأوصى أبشالوم رجاله: «متى ذهبت الخمر بعقل أمنون وقلت لكم اضربوا أمنون واقتلوه، فلا تخافوا. ألست أنا الذي أمرتكم بذلك؟ تشجعوا وتصرفوا كأبطال»."], [29, "فنفذ رجال أبشالوم أوامره وقتلوا أمنون، فهب جميع أبناء الملك وامتطوا بغالهم وهربوا."]]}, {"l": "2Sa 15:2-6", "n": "", "vs": [[2, "وكان يستيقظ مبكرا صباح كل يوم ويقف إلى جوار طريق بوابة المدينة، ويدعو إليه كل صاحب دعوى يقصد الملك ليعرض عليه قضيته، فيسأله: «من أية مدينة أنت؟» فيجيب: «عبدك ينتمي إلى أحد أسباط إسرائيل»."], [3, "فيقول أبشالوم له: «إن دعواك حق وقويمة، ولكن لا يوجد مندوب عن الملك ليستمع إليك»."], [4, "ثم يقول أبشالوم: «لو صرت قاضيا في الأرض لكنت أنصف كل إنسان له خصومة أو دعوى»."], [5, "وكان إذا تقدم أحد ليسجد له، يمد يده وينهضه ويقبله."], [6, "وظل أبشالوم يفعل هذا الأمر مع كل قادم بقضية إلى الملك، حتى تمكن من اكتساب قلوب رجال إسرائيل."]]}, {"l": "2Sa 16:20-23", "n": "", "vs": [[20, "وسأل أبشالوم أخيتوفل: «أشيروا ماذا نفعل؟»"], [21, "فأجاب أخيتوفل: «ادخل وضاجع محظيات أبيك اللواتي تركهن للمحافظة على القصر، فيسمع جميع بني إسرائيل أنك قد صرت مكروها لدى أبيك، فتتشدد أيدي مناصريك»."], [22, "فنصبوا لأبشالوم الخيمة على السطح، ودخل لمضاجعة محظيات أبيه على مرأى جميع الإسرائيليين."], [23, "وكانت مشورات أخيتوفل التي يسديها في تلك الأيام تحظى بقبول داود وأبشالوم لأنها كانت في اعتبارهما كأنها صادرة عن فم الله."]]}, {"l": "2Sa 17:1", "n": "", "vs": [[1, "وقال أخيتوفل لأبشالوم: «دعني أختار اثني عشر ألف رجل لأقوم وأتعقب بهم داود هذه الليلة،"]]}, {"l": "2Sa 17:2", "n": "", "vs": [[2, "فأهاجمه وهو متعب خائر القوى، فأثير الذعر بين رجاله، فينفضون من حوله، وأقتل الملك وحده."]]}, {"l": "1Ki 21:5-15", "n": "", "vs": [[5, "فأقبلت إليه زوجته إيزابل قائلة: «مالي أراك منقبضا عازفا عن الطعام؟»"], [6, "فأجابها: «لأني قلت لنابوت اليزرعيلي: بعني كرمك، وإذا شئت قايضتك بكرم آخر، فأجاب: لا أعطيك كرمي»"], [7, "فقالت له إيزابل: «أهكذا تحكم كملك على إسرائيل؟ قم وتناول طعاما وطب نفسا، فأنا أحصل لك على كرم نابوت اليزرعيلي»."], [8, "ثم حررت رسائل باسم أخآب، وختمتها بخاتمه وبعثت بها إلى شيوخ ووجهاء يزرعيل حيث يقيم نابوت."], [9, "وقالت فيها: «ادعوا الشعب للصوم، وأجلسوا نابوت في مكان الصدارة،"], [10, "وأقيموا شاهدي زور ليشهدا أن نابوت جدف على الله وعلى الملك، ثم أخرجوه من المدينة وارجموه حتى يموت»."], [11, "فنفذ شيوخ مدينته ووجهاؤها أوامر إيزابل كما هي واردة في الرسائل التي بعثت بها إليهم."], [12, "فتداعوا للصوم، وأجلسوا نابوت في مكان الصدارة."], [13, "ثم أقبل شاهدا زور وجلسا تجاهه، وشهدا على نابوت أمام الشعب قائلين: «قد جدف نابوت على الله وعلى الملك». فجروه إلى خارج المدينة ورجموه بالحجارة حتى مات."], [14, "وأبلغوا إيزابل أن نابوت قد رجم فمات."], [15, "فلما سمعت إيزابل بموت نابوت قالت لأخآب: «قم ورث كرم نابوت اليزرعيلي، الذي أبى أن يبيعك إياه بفضة، لأن نابوت قد أصبح في عداد الأموات»."]]}, {"l": "Pro 1:10-14", "n": "", "vs": [[10, "ياابني إن استغواك الخطاة فلا تقبل."], [11, "إن قالوا: «تعال معنا لنتربص بالناس حتى نسفك دماء أو نكمن للبريء ونقتله لغير علة."], [12, "أو قالوا لك: تعال لنبتلعهم أحياء كما تبتلعهم الهاوية وأصحاء كالهابطين في حفرة الموت"], [13, "فنغنم كل نفيس ونملأ بيوتنا بالأسلاب."], [14, "اربط مصيرك بمصيرنا، ولنتقاسم أسلابنا بالتساوي»."]]}, {"l": "Pro 6:19", "n": "", "vs": [[19, "وشاهد زور ينفث كذبا، ورجل يزرع خصومات بين الإخوة."]]}, {"l": "Pro 7:5", "n": "", "vs": [[5, "فهما تحفظانك من المرأة العاهرة، والزوجة الفاسقة التي تتملق بكلامها."]]}, {"l": "Pro 7:21-23", "n": "", "vs": [[21, "فأغوته بكثرة أفانين كلامها، ورنحته بتملق شفتيها."], [22, "فمضى على التو في إثرها، كثور مسوق إلى الذبح، أو أيل وقع في فخ."], [23, "إلى أن ينفذ سهم في كبده، ويكون كعصفور مندفع إلى شرك، لا يدري أنه قد نصب للقضاء عليه."]]}, {"l": "Jer 20:10", "n": "", "vs": [[10, "لأني سمعت نفثات تهديد من كثيرين، وأحاط بي رعب من كل جانب. يقولون: «اشتكوا عليه فنشتكي عليه»، حتى جميع أصدقائي الحميمين يرقبون كبوتي قائلين: «لعله يتعثر فنتغلب عليه وننتقم منه»."]]}, {"l": "Jer 28:16", "n": "", "vs": [[16, "لذلك هكذا يعلن الرب: ها أنا أبيدك عن وجه الأرض فتموت في هذه السنة لأنك نطقت بالتمرد على الرب»."]]}, {"l": "Mat 12:24", "n": "", "vs": [[24, "أما الفريسيون، فلما سمعوا بهذا قالوا: «إنه لا يطرد الشياطين إلا ببعلزبول رئيس الشياطين!»"]]}, {"l": "Mat 12:32-36", "n": "", "vs": [[32, "وأما التجديف على الروح (القدس)، فلن يغفر. ومن قال كلمة ضد ابن الإنسان، يغفر له. وأما من قال كلمة ضد الروح القدس، فلن يغفر له، لا في هذا الزمان، ولا في الزمان الآتي."], [33, "لتكن الشجرة جيدة، فتنتج ثمرا جيدا؛ ولتكن الشجرة رديئة، فتنتج ثمرا رديئا! فمن الثمر، تعرف الشجرة."], [34, "ياأولاد الأفاعي، كيف تقدرون، وأنتم أشرار، أن تتكلموا كلاما صالحا؟ لأن الفم يتكلم بما يفيض به القلب."], [35, "فالإنسان الصالح، من الكنز الصالح في قلبه، يصدر ما هو صالح. والإنسان الشرير، يصدر ما هو شرير."], [36, "على أني أقول لكم: إن كل كلمة باطلة يتكلم بها الناس، سوف يؤدون عنها الحساب في يوم الدينونة."]]}, {"l": "Mat 15:11-20", "n": "", "vs": [[11, "ليس ما يدخل الفم ينجس الإنسان، بل ما يخرج من الفم هو الذي ينجس الإنسان»."], [12, "فتقدم إليه تلاميذه وقالوا له: «أتعلم أن هذا القول قد أثار استياء الفريسيين؟»"], [13, "فأجابهم: «كل غرسة لم يغرسها أبي السماوي، لابد أن تقلع."], [14, "دعوهم وشأنهم، فهم عميان يقودون عميانا. وإذا كان الأعمى يقود أعمى، يسقطان معا في حفرة»."], [15, "وقال له بطرس: «فسر لنا ذاك المثل!»"], [16, "فأجاب: «وهل أنتم أيضا بلا فهم؟"], [17, "ألا تدركون بعد أن الطعام الذي يدخل الفم ينزل إلى البطن، ثم يطرح إلى الخلاء؟"], [18, "أما ما يخرج من الفم، فإنه من القلب يصدر، وهو الذي ينجس الإنسان."], [19, "فمن القلب تنبع الأفكار الشريرة، القتل، الزنى، الفسق، السرقة، شهادة الزور، التجديف."], [20, "هذه هي الأمور التي تنجس الإنسان. وأما تناول الطعام بأيد غير مغسولة، فلا ينجس الإنسان! »"]]}, {"l": "Mar 7:15", "n": "", "vs": [[15, "لا شيء من خارج الإنسان إذا دخله يمكن أن ينجسه. أما الأشياء الخارجة من الإنسان، فهي التي تنجسه."]]}, {"l": "Mar 7:20-22", "n": "", "vs": [[20, "ثم قال: «إن الذي يخرج من الإنسان، هو ينجس الإنسان."], [21, "فإنه من الداخل، من قلوب الناس، تنبع الأفكار الشريرة، الفسق، السرقة، القتل،"], [22, "الزنى، الطمع، الخبث، الخداع، العهارة، العين الشريرة، التجديف، الكبرياء، الحماقة"]]}, {"l": "Mar 14:55-57", "n": "", "vs": [[55, "وأخذ رؤساء الكهنة والمجلس الأعلى كله يبحثون عن شهادة على يسوع ليقتلوه، فلم يجدوا."], [56, "فقد شهد كثيرون عليه زورا، ولكن شهاداتهم كانت متناقضة."], [57, "ثم قام بعضهم وشهدوا عليه زورا قائلين:"]]}, {"l": "Act 6:13", "n": "", "vs": [[13, "وأقاموا عليه شهود زور ادعوا أنه: «لا يكف عن التعرض بكلامه للهيكل المقدس وللشريعة"]]}, {"l": "Act 20:30", "n": "", "vs": [[30, "بل إن قوما منكم أنتم سيقومون ويعلمون تعاليم منحرفة، ليجروا التلاميذ وراءهم."]]}, {"l": "Rom 3:13", "n": "", "vs": [[13, "حناجرهم قبور مفتوحة؛ ألسنتهم أدوات للمكر؛ شفاههم تخفي سم الأفاعي القاتلة؛"]]}, {"l": "Rom 3:14", "n": "", "vs": [[14, "أفواههم مملوءة لعنة ومرارة،"]]}, {"l": "Rom 16:17", "n": "", "vs": [[17, "ولكن، أتوسل إليكم، أيها الإخوة، أن تنتبهوا إلى مثيري الانقسامات والعثرات، خلافا للتعليم الذي تعلمتم، وأن تبتعدوا عنهم."]]}, {"l": "Rom 16:18", "n": "", "vs": [[18, "فإن أمثال هؤلاء لا يخدمون ربنا يسوع المسيح بل (يخدمون) بطونهم، وبكلماتهم الطيبة وأقوالهم المعسولة يضللون قلوب البسطاء."]]}, {"l": "Eph 5:3", "n": "", "vs": [[3, "أما الزنى، وكل نجاسة أو شهوة نهمة، فلا يذكر بينكم حتى اسمها، كما يليق بالقديسين."]]}, {"l": "Eph 5:4", "n": "", "vs": [[4, "وكذلك البذاءة والكلام السفيه والهزل، فهي غير لائقة. وإنما أحرى بكم أن تلهجوا بالشكر لله!"]]}, {"l": "Col 3:8", "n": "", "vs": [[8, "وأما الآن، فانزعوا عنكم، أنتم أيضا، هذه الخطايا كلها: الغضب، النقمة، الخبث، التجديف، الكلام القبيح الخارج من أفواهكم."]]}, {"l": "Col 3:9", "n": "", "vs": [[9, "لا يكذب أحدكم على الآخر، إذ قد نزعتم الإنسان العتيق وأعماله"]]}, {"l": "2Th 2:10-12", "n": "", "vs": [[10, "وعلى جميع أنواع التضليل الذي يجرف الهالكين إلى العصيان، لأنهم لم يقبلوا محبة الحق حتى يخلصوا."], [11, "ولهذا السبب، سيرسل الله إليهم طاقة الضلال حتى يصدقوا ما هو دجل،"], [12, "فتقع الدينونة على جميع الذين لم يؤمنوا بالحق بل سرهم الإثم."]]}, {"l": "Tit 1:11", "n": "", "vs": [[11, "هؤلاء يجب أن تسد أفواههم: فهم يخربون بيوتا بجملتها، إذ يعلمون تعاليم يجب ألا تعلم، في سبيل مكسب خسيس."]]}, {"l": "2Pe 2:1", "n": "", "vs": [[1, "ولكن، كما كان في الشعب قديما أنبياء دجالون، كذلك سيكون بينكم أنتم أيضا معلمون دجالون. هؤلاء سيدسون بدعا مهلكة، وينكرون السيد الذي اشتراهم لنفسه. وبذلك يجلبون على أنفسهم دمارا سريعا."]]}, {"l": "2Pe 2:2", "n": "", "vs": [[2, "وكثيرون سيسيرون وراءهم في طرق الإباحية. وبسببهم توجه الإهانة إلى طريق الحق."]]}, {"l": "2Pe 3:3", "n": "", "vs": [[3, "فاعلموا، قبل كل شيء أنه سيأتي في آخر الأيام أناس مستهزئون يسخرون بالحق، ويسلكون منجرفين وراء شهواتهم الخاصة."]]}, {"l": "3Jo 1:10", "n": "", "vs": [[10, "لهذا، سألفت الانتباه إلى الأعمال التي يقوم بها، حين أجيء. إنه يثير ضدنا تهما كاذبة، متكلما بأسلوب خبيث. وهو لا يكتفي بهذا، بل يرفض استقبال الإخوة المسافرين، ويمنع الذين يريدون استقبالهم، ويطردهم من الكنيسة أيضا."]]}, {"l": "Jud 1:8-10", "n": "", "vs": [[8, "ومع ذلك، فإن أولئك المعلمين المتوهمين يسيرون في الطريق التي سار فيها أهل تلك المدن. إذ يلوثون أجسادهم بالنجاسة، ويحتقرون السيادة الإلهية، ويتكلمون بالإهانة على الكائنات المجيدة!"], [9, "فحتى ميخائيل، وهو رئيس ملائكة، لم يجرؤ أن يحكم على إبليس بكلام مهين عندما خاصمه وتجادل معه بخصوص جثمان موسى، وإنما اكتفى بالقول له: «ليزجرك الرب!»"], [10, "ولكن هؤلاء المعلمين يتكلمون كلاما مهينا على أمور لا يعرفونها. وأما ما يفهمونه بالغريزة، كالحيوانات غير العاقلة، فإنهم به يدمرون أنفسهم."]]}, {"l": "Jud 1:15-18", "n": "", "vs": [[15, "ليدين جميع الناس، ويوبخ جميع الأشرار الذين لا يهابون الله ، بسبب جميع أعمالهم الشريرة التي ارتكبوها وجميع أقوالهم القاسية التي أهانوه بها والتي لا تصدر إلا عن الخاطئين الأشرار غير الأتقياء!»"], [16, "وهؤلاء المعلمون يتذمرون ويشكون دائما وفيما هم يندفعون وراء شهواتهم، يطلقون ألسنتهم متحدثين بأمور طنانة، ويمدحون من يعجبهم طلبا للمنفعة!"], [17, "أما أنتم أيها الأحباء، فاذكروا دائما ما قاله رسل ربنا يسوع المسيح."], [18, "فقد سبق أن نبهوكم إلى أنه، في نهاية الزمان، سيطلع مستهزئون يعيشون منغمسين في شهواتهم الفاسقة."]]}, {"l": "Rev 2:14", "n": "", "vs": [[14, "ولكني عاتب عليك قليلا لأنك تتسامح مع القوم الذين يتمسكون بتعليم بلعام عندما علم الملك بالاق أن يدمر بني إسرائيل بتوريطهم في ارتكاب الزنى والأكل من الذبائح المقدمة للأصنام،"]]}, {"l": "Rev 2:15", "n": "", "vs": [[15, "هكذا عندك أنت أيضا قوم يتمسكون بتعاليم النيقولاويين!"]]}, {"l": "Rev 13:1-5", "n": "", "vs": [[1, "ثم رأيت نفسي واقفا على رمل البحر، وإذا وحش خارج من البحر، له سبعة رؤوس وعشرة قرون، على كل قرن منها تاج، وقد كتب على كل رأس اسم تجديف."], [2, "وبدا هذا الوحش مثل النمر وله قوائم كقوائم دب وفم كفم أسد! وأعطاه التنين قدرته وعرشه وسلطة عظيمة."], [3, "وبدا واحد من رؤوسه كأنه ذبح ذبحا مميتا، ولكن الجرح المميت شفي، فتعجب سكان الأرض لذلك، وتبعوا الوحش."], [4, "وسجد الناس للتنين لأنه وهب الوحش سلطته، وعبدوا الوحش وهم يقولون: «من مثل هذا الوحش؟ ومن يجرؤ على محاربته؟»"], [5, "وأعطى التنين الوحش فما ينطق بكلام الكبرياء والتجديف، وأعطاه سلطة العمل مدة اثنين وأربعين شهرا."]]}, {"l": "Rev 13:14", "n": "", "vs": [[14, "فخدع سكان الأرض بالآيات التي كان يقوم بها في حضور الوحش الأول. وأمر سكان الأرض أن يقيموا تمثالا للوحش الأول الذي كان قد جرح جرحا مميتا ولكنه عاش!"]]}, {"l": "Rev 18:23", "n": "", "vs": [[23, "ولن يضيء فيك نور مصباح. ولن يسمع فيك صوت عريس وعروس. فقد كان تجارك سادة الأرض، وبسحرك ضللت جميع الأمم."]]}, {"l": "Rev 19:20", "n": "", "vs": [[20, "فقبض على الوحش وعلى النبي الدجال الذي قام بالمعجزات في حضور الوحش وأضل بها الذين قبلوا علامة الوحش، وسجدوا لتمثاله. وطرح كلاهما حيا في بحيرة النار والكبريت المتقدة،"]]}], "kwAr": "جامع للشرور كلها", "noteAr": ""}, {"kw": "it is", "raw": "Luk_16:24; Act_5:3; 2Co_11:13-15; 2Th_2:9; Rev_12:9", "note": "", "refs": [{"l": "Luk 16:24", "n": "", "vs": [[24, "فنادى قائلا: ياأباي إبراهيم! ارحمني، وأرسل لعازر ليغمس طرف إصبعه في الماء ويبرد لساني: فإني معذب في هذا اللهيب."]]}, {"l": "Act 5:3", "n": "", "vs": [[3, "فقال له بطرس: «ياحنانيا، لماذا سمحت للشيطان أن يملأ قلبك، فكذبت على الروح القدس، واحتفظت لنفسك بجزء من ثمن الحقل؟"]]}, {"l": "2Co 11:13-15", "n": "", "vs": [[13, "فإن أمثال هؤلاء هم رسل دجالون، عمال ماكرون، يظهرون أنفسهم بمظهر رسل المسيح."], [14, "ولا عجب! فالشيطان نفسه يظهر نفسه بمظهر ملاك نور."], [15, "فليس كثيرا إذن أن يظهر خدامه أنفسهم بمظهر خدام البر. وإن عاقبتهم ستكون على حسب أعمالهم."]]}, {"l": "2Th 2:9", "n": "", "vs": [[9, "أما بروز المتمرد، فسوف يكون بقدر طاقة الشيطان على المعجزات والعلامات والعجائب المزيفة كلها،"]]}, {"l": "Rev 12:9", "n": "", "vs": [[9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."]]}], "kwAr": "يستمد ناره من جهنم", "noteAr": ""}], "arS": [["واللسان", ["G1100"]], [" ", []], ["كالنار", ["G4442"]], [" خطرا: فهو وحده، بين ", []], ["أعضاء", ["G3196"]], [" الجسم، ", []], ["جامع للشرور كلها", ["G2889", "G93"]], ["، ", []], ["ويلوث", ["G4695"]], [" ", []], ["الجسم", ["G4983"]], [" ", []], ["كله", ["G3650"]], [" بالفساد. إنه ", []], ["يشعل", ["G5394"]], [" ", []], ["دائرة", ["G5164"]], [" ", []], ["الكون", ["G1078"]], ["، ويستمد ", []], ["ناره", ["G5394"]], [" من ", []], ["جهنم", ["G1067"]], ["!", []]]}, {"c": 3, "v": 7, "text": "من السهل على الإنسان أن يروض الوحوش والطيور والزواحف والحيوانات البحرية، بجميع أجناسها. فهذا ما نراه يحدث.", "groups": [{"kw": "kind", "raw": "Gr. nature", "note": "Gr. nature", "refs": [], "kwAr": "بجميع أجناسها", "noteAr": "في اليونانية: طبيعة."}, {"kw": "is tamed", "raw": "Mar_5:4, Gr", "note": "", "refs": [{"l": "Mar 5:4", "n": "", "vs": [[4, "فإنه كثيرا ما ربط بالقيود والسلاسل، فكان يقطع السلاسل ويحطم القيود، ولم يقدر أحد أن يخضعه."]]}], "kwAr": "يروض", "noteAr": ""}, {"kw": "mankind", "raw": "Gr. the nature of man", "note": "Gr. the nature of man", "refs": [], "kwAr": "الإنسان", "noteAr": "في اليونانية: طبيعة الإنسان."}], "arS": [["من السهل على ", []], ["الإنسان", ["G442"]], [" أن ", []], ["يروض", ["G1150"]], [" ", []], ["الوحوش", ["G2342"]], [" ", []], ["والطيور", ["G4071"]], [" ", []], ["والزواحف", ["G2062"]], [" والحيوانات ", []], ["البحرية", ["G1724"]], ["، ", []], ["بجميع", ["G3956"]], [" ", []], ["أجناسها", ["G5449"]], [". فهذا ما نراه يحدث.", []]]}, {"c": 3, "v": 8, "text": "ولكن أحدا من الناس لا يقدر أن يروض اللسان. فهو شر لا ينضبط، ممتليء بالسم القتال!", "groups": [{"kw": "an unruly", "raw": "Jam_3:6; Psa_55:21, Psa_57:4, Psa_59:7, Psa_64:3, Psa_64:4", "note": "", "refs": [{"l": "Jam 3:6", "n": "", "vs": [[6, "واللسان كالنار خطرا: فهو وحده، بين أعضاء الجسم، جامع للشرور كلها، ويلوث الجسم كله بالفساد. إنه يشعل دائرة الكون، ويستمد ناره من جهنم!"]]}, {"l": "Psa 55:21", "n": "", "vs": [[21, "كان كلامه أنعم من الزبدة، وفي قلبه يضمر القتال. كلماته ألين من الزيت، ولكنها سيوف مسلولة."]]}, {"l": "Psa 57:4", "n": "", "vs": [[4, "حين أرقد بين نافثي السموم من بني البشر أجد نفسي بين الأسود المفترسة؛ أنيابهم كالرماح والسهام، وألسنتهم كالسيوف المرهفة."]]}, {"l": "Psa 59:7", "n": "", "vs": [[7, "تفيض أفواههم سوءا. (ألسنتهم) كسيوف حادة بين شفاههم، قائلين: «من يسمعنا؟»"]]}, {"l": "Psa 64:3", "n": "", "vs": [[3, "الذين سنوا ألسنت  57:8", "n": "", "vs": [[8, "استيقظي يانفسي. استيقظي يارباب وياعود. سأوقظ الفجر على شدوي."]]}, {"l": "Psa 62:4", "n": "", "vs": [[4, "إنما يتآمرون كي يطيحوا به عن مكانته الرفيعة، مبتهجين بالكذب: يباركون بأفواههم ويلعنون بقلوبهم."]]}, {"l": "Psa 71:24", "n": "", "vs": [[24, "ويلهج لساني ببرك اليوم كله، لأن الساعين إلى أذيتي يحل حتما بهم الخزي والعار."]]}, {"l": "Psa 108:1", "n": "", "vs": [[1, "إن قلبي ثابت ياالله . أرنم وأشدو لك. فهيا استيقظي يانفسي."]]}, {"l": "Act 2:26", "n": "", "vs": [[26, "لذلك فرح قلبي وتهلل لساني. حتى إن جسدي سيرقد على رجاء."]]}], "kwAr": "به", "noteAr": ""}, {"kw": "bless", "raw": "1Ch_29:10,1Ch_29:20; Psa_34:1, Psa_63:4, Psa_145:1, Psa_145:21; Isa_29:13; Eph_1:3; 1Pe_1:3", "note": "", "refs": [{"l": "1Ch 29:10", "n": "", "vs": [[10, "وسبح داود الرب أمام الجمع المحتشد قائلا: «لك الحمد أيها الرب إله أبينا إسرائيل، من الأزل وإلى الأبد."]]}, {"l": "1Ch 29:20", "n": "", "vs": [[20, "ثم قال داود للجمع الحاضر: «باركوا الرب إلهكم». فسبح كل الجمع الرب إله آبائهم وسجدوا للرب وللملك."]]}, {"l": "Psa 34:1", "n": "", "vs": [[1, "أبارك الرب في كل حين. تسبيحه دائما في فمي."]]}, {"l": "Psa 63:4", "n": "", "vs": [[4, "أحمدك على بركاتك مدى حياتي، وباسمك أرفع يدي مبتهلا."]]}, {"l": "Psa 145:1", "n": "", "vs": [[1, "ياإلهي الملك، إني أعظمك وأبارك اسمك إلى الدهر والأبد."]]}, {"l": "Psa 145:21", "n": "", "vs": [[21, "يشدو فمي بتسبيح الرب، وليبارك كل إنسان اسمه القدوس، إلى أبد الآبدين."]]}, {"l": "Isa 29:13", "n": "", "vs": [[13, "لذلك يقول الرب: لأن هذا الشعب يقترب مني بفمه ويكرمني بشفتيه، بينما قلبه بعيد عنى. وما مخافتهم مني سوى تقليد تلقنوه من الناس."]]}, {"l": "Eph 1:3", "n": "", "vs": [[3, "تبارك الله ، أبو ربنا يسوع المسيح الذي باركنا بكل بركة روحية في الأماكن السماوية."]]}, {"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}], "kwAr": "نرفع الحمد والشكر للرب والآب", "noteAr": ""}, {"kw": "therewith curse", "raw":
