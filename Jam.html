Ar": ""}, {"kw": "so", "raw": "Exo_15:23-25; 2Ki_2:19-22; Eze_47:8-11", "note": "", "refs": [{"l": "Exo 15:23-25", "n": "", "vs": [[23, "وعندما وصلوا إلى مارة لم يقدروا أن يشربوا ماءها لمرارته، لذلك سميت «مارة»."], [24, "فتذمر الشعب على موسى قائلين: «ماذا نشرب؟»"], [25, "فاستغاث بالرب، فأراه الرب شجرة فألقاها إلى الماء، فصار عذبا. وهناك أيضا وضع الرب للشعب فريضة وشريعة، وامتحنه،"]]}, {"l": "2Ki 2:19-22", "n": "", "vs": [[19, "وقال رجال مدينة أريحا لأليشع: «هوذا المدينة كما ترى ذات موقع جيد، أما المياه فرديئة والأرض مجدبة»."], [20, "فقال: «أحضروا لي صحنا، وضعوا فيه ملحا». فأتوا إليه بما طلب."], [21, "فاتجه نحو نبع الماء وطرح فيه الملح، وقال: «هذا ما تكلم به الرب: لقد أبرأت هذه المياه فلن تسبب الموت أو الجدب بعد الآن»."], [22, "فبرئت المياه إلى هذا اليوم، كما أنبأ أليشع."]]}, {"l": "Eze 47:8-11", "n": "", "vs": [[8, "وقال لي: «هذه المياه جارية نحو المنطقة الشرقية، ومنحدرة إلى الغور حيث تصب في البحر (الميت) فتجعل مياهه عذبة."], [9, "وفي مجاريه تعيش كل نفس حية وتتكاثر الأسماك، لأن مياهه تبلغ إليها، فيبرأ كل ما تبلغ إليه مياه النهر وتسري الحياة فيه."], [10, "ويجتمع الصيادون على شاطئه من عين جدي إلى عين عجلايم، فيصبح مبسطا لشباكهم، ويعج بكل أصناف الأسماك، كسمك البحر العظيم (الأبيض المتوسط)."], [11, "أما مستنقعاته وبركه فلا تبرأ من ملوحتها."]]}], "kwAr": "كذلك لا يمكن أن يعطي النبع المالح ماء عذبا", "noteAr": ""}], "arS": [["أم هل ", []], ["يمكن", ["G1410"]], ["، ", []], ["ياإخوتي", ["G3450", "G80"]], ["، أن ", []], ["تثمر", ["G4160"]], [" ", []], ["التينة", ["G4808"]], [" ", []], ["زيتونا", ["G1636"]], ["، ", []], ["أو", ["G2228"]], [" ", []], ["الكرمة", ["G288"]], [" ", []], ["تينا", ["G4810"]], ["؟ ", []], ["كذلك", ["G3779"]], [" لا يمكن أن ", []], ["يعطي", ["G4160"]], [" ", []], ["النبع", ["G4077"]], [" ", []], ["المالح", ["G252"]], [" ", []], ["ماء", ["G5204"]], [" ", []], ["عذبا", ["G1099"]], [".", []]]}, {"c": 3, "v": 13, "text": "أبينكم بعض الحكماء والفهماء؟ إذن، على هؤلاء أن يسلكوا سلوكا حسنا، مظهرين بأعمالهم تلك الوداعة التي تتصف بها الحكمة (الحقيقية).", "groups": [{"kw": "is a", "raw": "Jam_3:1; Psa_107:43; Ecc_8:1, Ecc_8:5; Jer_9:12, Jer_9:23; Mat_7:24; 1Co_6:5; Gal_6:4", "note": "", "refs": [{"l": "Jam 3:1", "n": "", "vs": [[1, "ياإخوتي، لا تتسابقوا كي تجعلوا أنفسكم معلمين لغيركم فتزيدوا عدد المعلمين! واذكروا أننا، نحن المعلمين، سوف نحاسب حسابا أقسى من غيرنا."]]}, {"l": "Psa 107:43", "n": "", "vs": [[43, "فليتأمل كل حكيم في هذه الأمور، ويمعن النظر في مراحم الرب."]]}, {"l": "Ecc 8:1", "n": "", "vs": [[1, "من هو نظير الحكيم؟ ومن يعرف تعليل الأمور؟ حكمة الإنسان تضيء وجهه وتلطف من صلابة ملامحه."]]}, {"l": "Ecc 8:5", "n": "", "vs": [[5, "من يطع الأمر لا يلق أذى، وقلب الحكيم يدرك الوقت المناسب وأسلوب القضاء."]]}, {"l": "Jer 9:12", "n": "", "vs": [[12, "من هو الإنسان الحكيم حتى يفهم هذا؟ ومن خاطبه فم الرب حتى يعلنها؟ لماذا خربت الأرض، وأوحشت كالبرية فلا يقطعها عابر؟"]]}, {"l": "Jer 9:23", "n": "", "vs": [[23, "«فلا يفتخرن الحكيم بحكمته، ولا يزهون الجبار بجبروته، ولا الغني بثروته."]]}, {"l": "Mat 7:24", "n": "", "vs": [[24, "فأي من يسمع أقوالي هذه ويعمل بها، أشبهه برجل حكيم بنى بيته على الصخر،"]]}, {"l": "1Co 6:5", "n": "", "vs": [[5, "أقول هذا تخجيلا لكم. أهكذا ليس بينكم حتى حكيم واحد يقدر أن يقضي بين إخوته!"]]}, {"l": "Gal 6:4", "n": "", "vs": [[4, "فليمتحن كل واحد عمله الخاص، وعندئذ يكون له أن يفتخر بما يخصه وحده لا بما يخص غيره."]]}], "kwAr": "أبينكم بعض الحكماء", "noteAr": ""}, {"kw": "endued", "raw": "2Ch_2:12, 2Ch_2:13; Job_28:28; Isa_11:3; Dan_2:21", "note": "", "refs": [{"l": "2Ch 2:12", "n": "", "vs": [[12, "فتبارك الرب إله إسرائيل صانع السماوات والأرض الذي رزق داود الملك ابنا حكيما متميزا بالمعرفة والفهم ليبني هيكلا للرب وقصرا لنفسه."]]}, {"l": "2Ch 2:13", "n": "", "vs": [[13, "وها أنا أرسل الآن رجلا حاذقا خبيرا هو حورام أبي،"]]}, {"l": "Job 28:28", "n": "", "vs": [[28, "ثم قال للإنسان: انظر، إن مخافة الرب هي الحكمة، وتفادي الشر هو الفطنة»."]]}, {"l": "Isa 11:3", "n": "", "vs": [[3, "وتكون مسرته في تقوى الرب، ولا يقضي بحسب ما تشهد عيناه، ولا يحكم بمقتضى ما تسمع أذناه،"]]}, {"l": "Dan 2:21", "n": "", "vs": [[21, "هو يغير الأوقات والفصول. يعزل ملوكا وينصب ملوكا. يهب الحكماء حكمة وذوي الفطنة معرفة."]]}], "kwAr": "والفهماء", "noteAr": ""}, {"kw": "let", "raw": "Jam_2:18; Isa_60:6; 2Co_8:24; 1Pe_2:9", "note": "", "refs": [{"l": "Jam 2:18", "n": "", "vs": [[18, "وربما قال أحدكم: «أنت لك إيمان وأنا لي أعمال». أرني كيف يكون إيمانك من غير أعمال، وأنا أريك كيف يكون إيماني بأعمالي."]]}, {"l": "Isa 60:6", "n": "", "vs": [[6, "تكتظ أرضك بكثرة الإبل. من أرض مديان وعيفة تغشاك بكران، تتقاطر إليك من شبا محملة بالذهب واللبان وتذيع تسبيح الرب."]]}, {"l": "2Co 8:24", "n": "", "vs": [[24, "فأثبتوا لهم إذن أمام الكنائس برهان محبتكم وصواب افتخارنا بكم."]]}, {"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}], "kwAr": "على هؤلاء أن يسلكوا", "noteAr": ""}, {"kw": "a good", "raw": "Phi_1:27; 1Ti_4:12; Heb_13:5; 1Pe_2:12, 1Pe_3:1, 1Pe_3:2, 1Pe_3:16", "note": "", "refs": [{"l": "Phi 1:27", "n": "", "vs": [[27, "إنما عيشوا عيشة تليق فقط بإنجيل المسيح. حتى إذا جئت وشاهدتكم أو بقيت غائبا عنكم، أسمع أخباركم وأعرف أنكم ثابتون في روح واحد، وبنفس واحدة تجاهدون معا لأجل الإيمان المعلن في الإنجيل،"]]}, {"l": "1Ti 4:12", "n": "", "vs": [[12, "لا يستخف أحد بحداثة سنك. وإنما كن قدوة للمؤمنين، في الكلام والسلوك والمحبة والإيمان والطهارة."]]}, {"l": "Heb 13:5", "n": "", "vs": [[5, "اجعلوا سيرتكم مترفعة عن حب المال، واقنعوا بما عندكم، لأن الله يقول: «لا أتركك، ولا أتخلى عنك أبدا!»"]]}, {"l": "1Pe 2:12", "n": "", "vs": [[12, "وليكن سلوككم بين الأمم سلوكا حسنا. فمع أنهم يتهمونكم زورا بأنكم تفعلون الشر، فحين يلاحظون أعمالكم الصالحة يمجدون الله في يوم الافتقاد."]]}, {"l": "1Pe 3:1", "n": "", "vs": [[1, "كذلك، أيتها الزوجات، اخضعن لأزواجكن. حتى وإن كان الزوج غير مؤمن بالكلمة، تجذبه زوجته إلى الإيمان، بتصرفها اللائق دون كلام،"]]}, {"l": "1Pe 3:2", "n": "", "vs": [[2, "وذلك حين يلاحظ سلوكها الطاهر ووقارها."]]}, {"l": "1Pe 3:16", "n": "", "vs": [[16, "على أن تفعلوا ذلك بوداعة واحترام، محافظين على طهارة ضمائركم، سالكين في المسيح سلوكا صالحا، وعندئذ يخيب الذين يوجهون إليكم التهم الكاذبة ويشتمونكم كأنكم تفعلون شرا."]]}], "kwAr": "سلوكا حسنا", "noteAr": ""}, {"kw": "with meekness", "raw": "Jam_3:17, Jam_1:21; Num_12:3; Psa_25:9, Psa_45:4, Psa_149:4; Isa_11:4, Isa_29:19, Isa_61:1; Zep_2:3; Mat_5:5, Mat_11:29, Mat_21:5; 2Co_10:1; Gal_5:23, Gal_6:1; Eph_4:2; Col_3:12; 1Ti_6:11; 2Ti_2:25; Tit_3:2; 1Pe_3:4, 1Pe_3:15", "note": "", "refs": [{"l": "Jam 3:17", "n": "", "vs": [[17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}, {"l": "Jam 1:21", "n": "", "vs": [[21, "إذن، تخلصوا من كل ما في حياتكم من نجاسة وشر متزايد. وليكن قبولكم لتلك الكلمة التي غرسها الله في قلوبكم، قبولا وديعا. فهي القادرة أن تخلص نفوسكم."]]}, {"l": "Num 12:3", "n": "", "vs": [[3, "أما موسى فقد كان أكثر حلما من جميع الناس الذين على وجه الأرض."]]}, {"l": "Psa 25:9", "n": "", "vs": [[9, "يدرب الودعاء في سبل الحق ويعلمهم طريقه."]]}, {"l": "Psa 45:4", "n": "", "vs": [[4, "وبجلالك اركب ظافرا لأجل الحق والوداعة والبر، فتقتحم يمينك الأهوال."]]}, {"l": "Psa 149:4", "n": "", "vs": [[4, "لأن الرب يسر بشعبه، يجمل الودعاء بالخلاص."]]}, {"l": "Isa 11:4", "n": "", "vs": [[4, "إنما يقضي بعدل للمساكين، ويحكم بالإنصاف لبائسي الأرض، ويعاقب الأرض بقضيب فمه، ويميت المنافق بنفخة شفتيه،"]]}, {"l": "Isa 29:19", "n": "", "vs": [[19, "أما الوداعاء فيتجدد فرحهم بالرب، ويبتهج البائسون بقدوس إسرائيل،"]]}, {"l": "Isa 61:1", "n": "", "vs": [[1, "روح السيد الرب علي، لأن الرب مسحني لأبشر المساكين، أرسلني لأضمد جراح المنكسري القلوب، لأنادي للمسبيين بالعتق وللمأسورين بالحرية،"]]}, {"l": "Zep 2:3", "n": "", "vs": [[3, "التمسوا الرب ياودعاء الأرض الراضخين لحكمه. اطلبوا البر والتواضع لعلكم تجدون ملاذا في يوم سخط الرب."]]}, {"l": "Mat 5:5", "n": "", "vs": [[5, "طوبى للودعاء، فإنهم سيرثون الأرض."]]}, {"l": "Mat 11:29", "n": "", "vs": [[29, "احملوا نيري عليكم، وتتلمذوا على يدي، لأني وديع ومتواضع القلب، فتجدوا الراحة لنفوسكم."]]}, {"l": "Mat 21:5", "n": "", "vs": [[5, "«بشروا ابنة صهيون: ها هو ملكك قادم إليك وديعا يركب على أتان وجحش ابن أتان !»"]]}, {"l": "2Co 10:1", "n": "", "vs": [[1, "ولكني أتوسل إليكم بوداعة المسيح وحلمه، أنا بولس «المتواضع وأنا حاضر بينكم، والجريء عليكم وأنا غائب عنكم»،"]]}, {"l": "Gal 5:23", "n": "", "vs": [[23, "والوداعة وضبط النفس. وليس من قانون يمنع مثل هذه الفضائل."]]}, {"l": "Gal 6:1", "n": "", "vs": [[1, "أيها الإخوة، إن سقط أحدكم في خطأ ما فمثل هذا أصلحوه أنتم الروحيين بروح وداعة. واحذر أنت لنفسك لئلا تجرب أيضا."]]}, {"l": "Eph 4:2", "n": "", "vs": [[2, "بكل تواضع ووداعة وطول بال، محتملين بعضكم بعضا في المحبة،"]]}, {"l": "Col 3:12", "n": "", "vs": [[12, "فباعتباركم جماعة مختارة من الله، قديسين محبوبين، البسوا دائما عواطف الحنان واللطف والتواضع والوداعة وطول البال،"]]}, {"l": "1Ti 6:11", "n": "", "vs": [[11, "وأما أنت، ياإنسان الله، فاهرب من هذه الأمور، واسع في إثر البر والتقوى والإيمان والمحبة والصبر والوداعة."]]}, {"l": "2Ti 2:25", "n": "", "vs": [[25, "ويؤدب بالوداعة مقاومي الإيمان، عسى أن يمنحهم الله التوبة، فيعرفوا الحق بالتمام،"]]}, {"l": "Tit 3:2", "n": "", "vs": [[2, "ولا يقولوا سوءا في أحد، ولا يكونوا مخاصمين، بل لطفاء يعاملون الجميع بوداعة تامة."]]}, {"l": "1Pe 3:4", "n": "", "vs": [[4, "وإنما لتعتمد الزينة الداخلية، ليكون قلبها متزينا بروح الوداعة والهدوء. هذه هي الزينة التي لا تفنى، وهي غالية الثمن في نظر الله!"]]}, {"l": "1Pe 3:15", "n": "", "vs": [[15, "وإنما كرسوا المسيح ربا في قلوبكم. وكونوا دائما مستعدين لأن تقدموا جوابا مقنعا لكل من يسألكم عن سبب الرجاء الذي في داخلكم"]]}], "kwAr": "الوداعة التي تتصف بها الحكمة", "noteAr": ""}], "arS": [["أبينكم", ["G5213"]], [" بعض ", []], ["الحكماء", ["G4680"]], [" ", []], ["والفهماء", ["G1990"]], ["؟ إذن، على هؤلاء أن ", []], ["يسلكوا", ["G1166"]], [" ", []], ["سلوكا", ["G391"]], [" ", []], ["حسنا", ["G2570"]], ["، مظهرين ", []], ["بأعمالهم", ["G2041"]], [" تلك ", []], ["الوداعة", ["G4240"]], [" التي تتصف بها ", []], ["الحكمة", ["G4678"]], [" (الحقيقية).", []]]}, {"c": 3, "v": 14, "text": "أما إن كانت قلوبكم مملوءة بمرارة الحسد وبالتحزب، فلا تفتخروا بحكمتكم، ولا تنكروا الحق.", "groups": [{"kw": "if", "raw": "Jam_3:16, Jam_4:1-5; Gen_30:1, Gen_30:2, Gen_37:11; Job_5:2; Pro_14:30, Pro_27:4; Isa_11:13; Hab_1:3; Mat_27:18; Act_5:17, Act_7:9, Act_13:45; Rom_1:29, Rom_13:13; 1Co_3:3, 1Co_13:4; 2Co_12:20; Gal_5:15, Gal_5:21, Gal_5:26; Phi_1:15, Phi_2:3; 1Ti_6:4; Tit_3:3; 1Pe_2:1, 1Pe_2:2", "note": "", "refs": [{"l": "Jam 3:16", "n": "", "vs": [[16, "فحيث تكون مرارة الحسد والتحزب، ينتشر الخلاف والفوضى وجميع الشرور."]]}, {"l": "Jam 4:1-5", "n": "", "vs": [[1, "من أين النزاع والخصام بينكم؟ أليس من لذاتكم تلك المتصارعة في أعضائكم؟"], [2, "فأنتم ترغبون في امتلاك ما لا يخصكم، لكن ذلك لا يتحقق لكم، فتقتلون، وتحسدون، ولا تتمكنون من بلوغ غايتكم. وهكذا تتخاصمون وتتصارعون! إنكم لا تمتلكون ما تريدونه، لأنكم لا تطلبونه من الله."], [3, "وإذا طلبتم منه شيئا، فإنكم لا تحصلون عليه: لأنكم تطلبون بدافع شرير، إذ تنوون أن تستهلكوا ما تنالونه لإشباع شهواتكم فقط."], [4, "أيها الخونة! ألستم تعلمون أن مصادقة العالم هي معاداة لله؟ فالذي يريد أن يصادق العالم، يجعل نفسه عدوا لله."], [5, "أتظنون أن الكتاب يتكلم عبثا! هل الروح الذي حل في داخلنا يغار عن حسد؟"]]}, {"l": "Gen 30:1", "n": "", "vs": [[1, "وعندما تبينت راحيل أنها عاقر، غارت من أختها وقالت ليعقوب: «هب لي بنين وإلا فإني أموت»."]]}, {"l": "Gen 30:2", "n": "", "vs": [[2, "فاحتدم غضب يعقوب على راحيل وقال: «ألعلي أقوم مقام الله الذي حرمك من الإنجاب؟»"]]}, {"l": "Gen 37:11", "n": "", "vs": [[11, "فحسده إخوته. أما أبوه فأسر هذا الكلام في قلبه."]]}, {"l": "Job 5:2", "n": "", "vs": [[2, "الغيظ يقتل الأحمق، والغيرة تميت الأبله."]]}, {"l": "Pro 14:30", "n": "", "vs": [[30, "القلب المطمئن يهب أعضاء الجسد حياة، والحسد ينخر في العظام."]]}, {"l": "Pro 27:4", "n": "", "vs": [[4, "الغضب فظ، والسخط قهار، ولكن من يصمد أمام الغيرة؟"]]}, {"l": "Isa 11:13", "n": "", "vs": [[13, "فيتلاشى حسد أفرايم، وتزول عداوة يهوذا، فلا أفرايم يحسد يهوذا، ولا يهوذا يعادي أفرايم،"]]}, {"l": "Hab 1:3", "n": "", "vs": [[3, "لماذا تريني الإثم، وتتحمل رؤية الظلم؟ أينما تلفت أشهد أمامي جورا واغتصابا، ويثور حولي خصام ونزاع."]]}, {"l": "Mat 27:18", "n": "", "vs": [[18, "إذ كان يعلم أنهم سلموه عن حسد."]]}, {"l": "Act 5:17", "n": "", "vs": [[17, "إلا أن رئيس الكهنة وجماعته المنتمين إلى مذهب الصدوقيين ملأتهم الغيرة من الرسل،"]]}, {"l": "Act 7:9", "n": "", "vs": [[9, "وحسد الآباء الأولون يوسف وباعوه، فأصبح عبدا في مصر. ولكن الله كان معه،"]]}, {"l": "Act 13:45", "n": "", "vs": [[45, "فلما رأى اليهود الجموع ملأت الغيرة صدورهم، وأخذوا يعارضون كلام بولس مجدفين."]]}, {"l": "Rom 1:29", "n": "", "vs": [[29, "إذ قد امتلأوا من كل إثم وشر وجشع وخبث، وشحنوا حسدا وقتلا وخصاما ومكرا وسوءا. وهم ثرثارون،"]]}, {"l": "Rom 13:13", "n": "", "vs": [[13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."]]}, {"l": "1Co 3:3", "n": "", "vs": [[3, "فإنكم مازلتم جسديين. فمادام بينكم حسد وخصام (وانقسام)، أفلا تكونون جسديين وتسلكون وفقا للبشر؟"]]}, {"l": "1Co 13:4", "n": "", "vs": [[4, "المحبة تصبر طويلا؛ وهي لطيفة. المحبة لا تحسد. المحبة لا تتفاخر ولا تتكبر."]]}, {"l": "2Co 12:20", "n": "", "vs": [[20, "فإني أخشى أن آتي إليكم فأجدكم في حالة لا أريدها وتجدوني في حالة لا تريدونها! أي أن يكون بينكم كثير من النزاع والحسد والحقد والتحزب والتجريح والنميمة والتكبر والبلبلة."]]}, {"l": "Gal 5:15", "n": "", "vs": [[15, "فإذا كنتم تنهشون وتفترسون بعضكم بعضا، فاحذروا أن يفني أحدكم الآخر!"]]}, {"l": "Gal 5:21", "n": "", "vs": [[21, "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!"]]}, {"l": "Gal 5:26", "n": "", "vs": [[26, "لا نكن طامحين إلى المجد الباطل، يستفز بعضنا بعضا، ويحسد أحدنا الآخر!"]]}, {"l": "Phi 1:15", "n": "", "vs": [[15, "حقا أن بعضهم يبشرون بالمسيح عن حسد ونزاع؛ وأما الآخرون فعن حسن نية."]]}, {"l": "Phi 2:3", "n": "", "vs": [[3, "لا يكن بينكم شيء بروح التحزب والافتخار الباطل، بل بالتواضع ليعتبر كل واحد منكم غيره أفضل كثيرا من نفسه،"]]}, {"l": "1Ti 6:4", "n": "", "vs": [[4, "فهو قد انتفخ تكبرا، ولا يعرف شيئا، وإنما هو مهووس بالمجادلات والمنازعات الكلامية، ومنها ينشأ الحسد والخصام والتجريح والنيات السيئة،"]]}, {"l": "Tit 3:3", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."]]}, {"l": "1Pe 2:1", "n": "", "vs": [[1, "لذلك، تخلصوا من كل أثر للشر والخداع والرياء والحسد والذم."]]}, {"l": "1Pe 2:2", "n": "", "vs": [[2, "وكأطفال مولودين حديثا، تشوقوا إلى اللبن الروحي النقي لكي تنموا به إلى أن تبلغوا الخلاص،"]]}], "kwAr": "إن كانت قلوبكم مملوءة بمرارة الحسد", "noteAr": ""}, {"kw": "glory", "raw": "Rom_2:17, Rom_2:23-29; 1Co_4:7, 1Co_4:8, 1Co_5:2, 1Co_5:6; Gal_6:13", "note": "", "refs": [{"l": "Rom 2:17", "n": "", "vs": [[17, "ولكن، إن كنت تدعى يهوديا؛ وتتكل على الشريعة؛ وتفتخر بالله؛"]]}, {"l": "Rom 2:23-29", "n": "", "vs": [[23, "الذي تفتخر بالشريعة، أتهين الله بمخالفة الشريعة؟"], [24, "فإن «اسم الله يجدف عليه بين الأمم بسببكم»، كما هو مكتوب."], [25, "فإن الختان ينفع إن كنت تعمل بالشريعة. ولكن إن كنت مخالفا للشريعة، فقد صار ختانك كأنه عدم ختان."], [26, "إذن، إن عمل غير المختون بأحكام الشريعة، أفلا يحسب عدم ختانه كأنه ختان؟"], [27, "وغير المختون بالطبيعة، إذ يتمم الشريعة، يدينك أنت يامن تخالف الشريعة ولديك الكتاب والختان."], [28, "فليس بيهودي من كان يهوديا في الظاهر، ولا بختان ما كان ظاهرا في اللحم."], [29, "وإنما اليهودي هو من كان يهوديا في الباطن، والختان هو ما كان ختانا للقلب بالروح لا بالحرف. وهذا يأتيه المدح لا من الناس بل من الله!"]]}, {"l": "1Co 4:7", "n": "", "vs": [[7, "فمن جعلك متميزا عن غيرك؟ وأي شيء مما لك لم تكن قد أخذته هبة؟ ومادمت قد أخذت، فلماذا تتباهى كأنك لم تأخذ؟"]]}, {"l": "1Co 4:8", "n": "", "vs": [[8, "إنكم قد شبعتم وقد اغتنيتم! قد صرتم ملوكا وتخليتم عنا! ويا ليتكم ملوك حقا فنشترك معكم في الملك!"]]}, {"l": "1Co 5:2", "n": "", "vs": [[2, "ومع ذلك، فأنتم منتفخون تكبرا، بدلا من أن تنوحوا حتى يستأصل من بينكم مرتكب هذا الفعل!"]]}, {"l": "1Co 5:6", "n": "", "vs": [[6, "إن افتخاركم ليس في محله! ألستم تعلمون أن خميرة صغيرة تخمر العجين كله؟"]]}, {"l": "Gal 6:13", "n": "", "vs": [[13, "فحتى أولئك الذين يختنون، هم أنفسهم، لا يعملون بالشريعة، بل يريدون لكم أن تختنوا ليفتخروا بجسدكم."]]}], "kwAr": "فلا تفتخروا", "noteAr": ""}, {"kw": "and lie", "raw": "2Ki_10:16, 2Ki_10:31; Joh_16:2; Act_26:9", "note": "", "refs": [{"l": "2Ki 10:16", "n": "", "vs": [[16, "وقال: «تعال معي لترى مدى غيرتي للرب»، وهكذا أركبه معه في المركبة."]]}, {"l": "2Ki 10:31", "n": "", "vs": [[31, "ولكن ياهو لم يحرص على السلوك في شريعة الرب إله إسرائيل من كل قلبه، إذ واظب على ارتكاب خطايا يربعام التي استغوى بها الإسرائيليين وجعلهم يخطئون."]]}, {"l": "Joh 16:2", "n": "", "vs": [[2, "ستطردون خارج المجامع، بل سيأتي وقت يظن فيه من يقتلكم أنه يؤدي خدمة لله."]]}, {"l": "Act 26:9", "n": "", "vs": [[9, "وكنت أعتقد أنه يجب أن أبذل غاية جهدي لأقاوم اسم يسوع الناصري."]]}], "kwAr": "ولا تنكروا الحق", "noteAr": ""}], "arS": [["أما ", []], ["إن", ["G1487"]], [" كانت ", []], ["قلوبكم", ["G2588"]], [" ", []], ["مملوءة", ["G2192"]], [" ", []], ["بمرارة", ["G4089"]], [" ", []], ["الحسد", ["G2205"]], [" ", []], ["وبالتحزب", ["G2052"]], ["، ", []], ["فلا", ["G3361"]], [" ", []], ["تفتخروا", ["G2620"]], [" بحكمتكم، ولا ", []], ["تنكروا", ["G5574"]], [" ", []], ["الحق", ["G225"]], [".", []]]}, {"c": 3, "v": 15, "text": "إن هذه الحكمة التي تدعونها ليست نازلة من عند الله، بل هي «حكمة» أرضية بشرية شيطانية.", "groups": [{"kw": "wisdom", "raw": "Jam_3:17, Jam_1:5, Jam_1:17; Joh_3:17; 1Co_3:3; Phi_3:19", "note": "", "refs": [{"l": "Jam 3:17", "n": "", "vs": [[17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}, {"l": "Jam 1:5", "n": "", "vs": [[5, "وإن كان أحد منكم بحاجة إلى الحكمة، فليطلب من الله الذي يعطي الجميع بسخاء ولا يعير. فسيعطى له."]]}, {"l": "Jam 1:17", "n": "", "vs": [[17, "إن كل عطية صالحة وهبة كاملة إنما تنزل من فوق، من لدن أبي الأنوار الذي ليس فيه تحول، ولا ظل لأنه لا يدور."]]}, {"l": "Joh 3:17", "n": "", "vs": [[17, "فإن الله لم يرسل ابنه إلى العالم ليدين العالم، بل ليخلص العالم به،"]]}, {"l": "1Co 3:3", "n": "", "vs": [[3, "فإنكم مازلتم جسديين. فمادام بينكم حسد وخصام (وانقسام)، أفلا تكونون جسديين وتسلكون وفقا للبشر؟"]]}, {"l": "Phi 3:19", "n": "", "vs": [[19, "الذين مصيرهم الهلاك، وإلههم بطونهم، ومفخرتهم في عيبتهم، وفكرهم منصرف إلى الأمور الأرضية."]]}], "kwAr": "هذه الحكمة", "noteAr": ""}, {"kw": "but", "raw": "2Sa_13:3, 2Sa_15:31, 2Sa_16:23; Jer_4:22; Luk_16:8; Rom_1:22; 1Co_1:19, 1Co_1:20,1Co_1:27; 1Co_2:6, 1Co_2:7, 1Co_3:19; 2Co_1:12; Jud_1:19", "note": "", "refs": [{"l": "2Sa 13:3", "n": "", "vs": [[3, "وكان لأمنون صديق راجح العقل، هو ابن عمه، يوناداب بن شمعى،"]]}, {"l": "2Sa 15:31", "n": "", "vs": [[31, "وقيل لداود إن أخيتوفل بين المتمردين الذين انضموا إلى أبشالوم. فصلى داود: «حمق يارب مشورة أخيتوفل»."]]}, {"l": "2Sa 16:23", "n": "", "vs": [[23, "وكانت مشورات أخيتوفل التي يسديها في تلك الأيام تحظى بقبول داود وأبشالوم لأنها كانت في اعتبارهما كأنها صادرة عن فم الله."]]}, {"l": "Jer 4:22", "n": "", "vs": [[22, "إن قومي حمقى لا يعرفونني. هم أبناء أغبياء مجردون من الفهم، حاذقون في ارتكاب الشر، وجهلاء في صنع الخير»."]]}, {"l": "Luk 16:8", "n": "", "vs": [[8, "فامتدح السيد وكيله الخائن لأنه تصرف بحكمة. فإن أبناء هذا العالم أحكم مع أهل جيلهم من أبناء النور."]]}, {"l": "Rom 1:22", "n": "", "vs": [[22, "وفيما يدعون أنهم حكماء، صاروا جهالا،"]]}, {"l": "1Co 1:19", "n": "", "vs": [[19, "فإنه قد كتب: «سأبيد حكمة الحكماء وأزيل فهم الفهماء!»"]]}, {"l": "1Co 1:20", "n": "", "vs": [[20, "إذن، أين الحكيم؟ وأين الكاتب؟ وأين المجادل في هذا الزمان؟ ألم يقلب الله حكمة هذا العالم جهالة؟"]]}, {"l": "1Co 1:27", "n": "", "vs": [[27, "بل إن الله قد اختار ما هو جاهل في العالم ليخجل الحكماء. وقد اختار الله ما هو ضعيف في العالم ليخجل المقتدرين."]]}, {"l": "1Co 2:6", "n": "", "vs": [[6, "على أن لنا حكمة نتكلم بها بين البالغين. ولكنها حكمة ليست من هذا العالم ولا من رؤساء هذا العالم الزائلين."]]}, {"l": "1Co 2:7", "n": "", "vs": [[7, "بل إننا نتكلم بحكمة الله المطوية في سر، تلك الحكمة المحجوبة التي سبق الله فأعدها قبل الدهور لأجل مجدنا"]]}, {"l": "1Co 3:19", "n": "", "vs": [[19, "فإن حكمة هذا العالم هي جهالة في نظر الله. فإنه قد كتب: «إنه يمسك الحكماء بمكرهم»"]]}, {"l": "2Co 1:12", "n": "", "vs": [[12, "فإن فخرنا هو هذا: شهادة ضميرنا بأننا، في قداسة الله وإخلاصه، قد سلكنا في العالم، وبخاصة تجاهكم؛ ولم يكن ذلك بحكمة بشرية بل بنعمة الله."]]}, {"l": "Jud 1:19", "n": "", "vs": [[19, "هؤلاء هم الذين يسببون الانشقاق، وينساقون وراء غرائزهم الحيوانية، وليس الروح القدس فيهم!"]]}], "kwAr": "بل هي حكمة أرضية", "noteAr": ""}, {"kw": "sensual", "raw": "or, natural, 1Co_2:14", "note": "or, natural, 1Co_2:14", "refs": [{"l": "1Co 2:14", "n": "", "vs": [[14, "غير أن الإنسان البشري لا يتقبل أمور روح الله إذ يعتبرها جهالة، ولا يستطيع أن يعرفها لأن تمييزها إنما يحتاج إلى حس روحي."]]}], "kwAr": "بشرية", "noteAr": "أو: طبيعية."}, {"kw": "devilish", "raw": "Gen_3:1-5; Joh_8:44; Act_13:10; 2Co_11:3, 2Co_11:13-15; 1Jo_3:8-10; Jud_1:19; Rev_9:11, Rev_12:9", "note": "", "refs": [{"l": "Gen 3:1-5", "n": "", "vs": [[1, "وكانت الحية أمكر وحوش البرية التي صنعها الرب الإله، فسألت المرأة: «أحقا أمركما الله ألا تأكلا من جميع شجر الجنة؟»"], [2, "فأجابت المرأة: «يمكننا أن نأكل من ثمر الجنة كلها،"], [3, "ماعدا ثمر الشجرة التي في وسطها، فقد قال الله : لا تأكلا منه ولا تلمساه لكي لا تموتا»."], [4, "فقالت الحية للمرأة: «لن تموتا،"], [5, "بل إن الله يعرف أنه حين تأكلان من ثمر هذه الشجرة تنفتح أعينكما فتصيران مثله، قادرين على التمييز بين الخير والشر»."]]}, {"l": "Joh 8:44", "n": "", "vs": [[44, "إنكم أولاد أبيكم إبليس، وترغبون أن تعملوا شهوات أبيكم. فهو من البدء كان قاتلا للناس، ولم يثبت في الحق لأنه خال من الحق! وعندما ينطق بالكذب فهو ينضح بما فيه، لأنه كذاب وأبو الكذب!"]]}, {"l": "Act 13:10", "n": "", "vs": [[10, "«أيها الممتليء غشا وخبثا! ياابن إبليس! ياعدو كل بر! أما تكف عن تعويج طرق الرب المستقيمة؟"]]}, {"l": "2Co 11:3", "n": "", "vs": [[3, "غير أني أخشى أن تضلل عقولكم عن الإخلاص والطهارة تجاه المسيح مثلما أغوت الحية بمكرها حواء."]]}, {"l": "2Co 11:13-15", "n": "", "vs": [[13, "فإن أمثال هؤلاء هم رسل دجالون، عمال ماكرون، يظهرون أنفسهم بمظهر رسل المسيح."], [14, "ولا عجب! فالشيطان نفسه يظهر نفسه بمظهر ملاك نور."], [15, "فليس كثيرا إذن أن يظهر خدامه أنفسهم بمظهر خدام البر. وإن عاقبتهم ستكون على حسب أعمالهم."]]}, {"l": "1Jo 3:8-10", "n": "", "vs": [[8, "ولكن من يمارس الخطيئة، يظهر أنه من أولاد إبليس، لأن إبليس يمارس الخطيئة منذ البداية. وقد جاء ابن الله إلى الأرض لكي يبطل أعمال إبليس."], [9, "فكل مولود من الله، لا يمارس الخطيئة، لأن طبيعة الله صارت ثابتة فيه. بل إنه لا يستطيع أن يمارس الخطيئة، لأنه مولود من الله."], [10, "إذن، هذا هو المقياس الذي نميز به بين أولاد الله وأولاد إبليس. من لا يمارس الصلاح، فهو ليس من الله. وكذلك من لا يحب أخاه!"]]}, {"l": "Jud 1:19", "n": "", "vs": [[19, "هؤلاء هم الذين يسببون الانشقاق، وينساقون وراء غرائزهم الحيوانية، وليس الروح القدس فيهم!"]]}, {"l": "Rev 9:11", "n": "", "vs": [[11, "أما ملكه فهو «ملاك الهاوية»، واسمه بالعبرية «أبدون»، وباليونانية «أبوليون»."]]}, {"l": "Rev 12:9", "n": "", "vs": [[9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."]]}], "kwAr": "شيطانية", "noteAr": ""}], "arS": [["إن ", []], ["هذه", ["G3778"]], [" ", []], ["الحكمة", ["G4678"]], [" التي تدعونها ", []], ["ليست", ["G3756"]], [" ", []], ["نازلة", ["G2718"]], [" من عند ", []], ["الله", ["G509"]], ["، ", []], ["بل", ["G235"]], [" هي «حكمة» ", []], ["أرضية", ["G1919"]], [" ", []], ["بشرية", ["G5591"]], [" ", []], ["شيطانية", ["G1141"]], [".", []]]}, {"c": 3, "v": 16, "text": "فحيث تكون مرارة الحسد والتحزب، ينتشر الخلاف والفوضى وجميع الشرور.", "groups": [{"kw": "where", "raw": "Jam_3:14; 1Co_3:3; Gal_5:20", "note": "", "refs": [{"l": "Jam 3:14", "n": "", "vs": [[14, "أما إن كانت قلوبكم مملوءة بمرارة الحسد وبالتحزب، فلا تفتخروا بحكمتكم، ولا تنكروا الحق."]]}, {"l": "1Co 3:3", "n": "", "vs": [[3, "فإنكم مازلتم جسديين. فمادام بينكم حسد وخصام (وانقسام)، أفلا تكونون جسديين وتسلكون وفقا للبشر؟"]]}, {"l": "Gal 5:20", "n": "", "vs": [[20, "وعبادة الأصنام والسحر، والعداوة والنزاع والغيرة والغضب، والتحزب والانقسام والتعصب،"]]}], "kwAr": "فحيث تكون مرارة الحسد", "noteAr": ""}, {"kw": "there", "raw": "Gen_11:9 *marg. Act_19:29; 1Co_14:33", "note": "", "refs": [{"l": "Gen 11:9", "n": "*marg.", "vs": [[9, "لذلك سميت المدينة «بابل» لأن الرب بلبل لسان أهل كل الأرض، وبالتالي شتتهم من هناك في أرجاء الأرض كلها."]]}, {"l": "Act 19:29", "n": "", "vs": [[29, "وعم الاضطراب المدينة كلها. وهجم حشد كبير من الناس على غايوس وأرسترخس المقدونيين رفيقي بولس في السفر، وجروهما إلى ساحة الملعب."]]}, {"l": "1Co 14:33", "n": "", "vs": [[33, "فليس الله إله فوضى بل إله سلام، كما هي الحال في كنائس القديسين كلها."]]}], "kwAr": "ينتشر", "noteAr": ""}, {"kw": "confusion", "raw": "Gr. tumult, or, unquietness", "note": "Gr. tumult, or, unquietness", "refs": [], "kwAr": "الخلاف والفوضى", "noteAr": "في اليونانية: شغب، أو: اضطراب."}, {"kw": "every", "raw": "1Jo_3:12", "note": "", "refs": [{"l": "1Jo 3:12", "n": "", "vs": [[12, "لا أن نكون مثل قايين الذي قتل أخاه. فقايين كان من أولاد إبليس الشرير. ولماذا قتل أخاه؟ قتله لأن أعماله هو كانت شريرة، أما أعمال أخيه فكانت صالحة."]]}], "kwAr": "وجميع الشرور", "noteAr": ""}], "arS": [["فحيث", ["G3699"]], [" تكون مرارة ", []], ["الحسد", ["G2205"]], [" ", []], ["والتحزب", ["G2052"]], ["، ينتشر الخلاف ", []], ["والفوضى", ["G181"]], [" ", []], ["وجميع", ["G3956"]], [" ", []], ["الشرور", ["G5337", "G4229"]], [".", []]]}, {"c": 3, "v": 17, "text": "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي.", "groups": [{"kw": "the wisdom", "raw": "Jam_3:15, Jam_1:5, Jam_1:17; Gen_41:38, Gen_41:39; Exo_36:2; 1Ki_3:9, 1Ki_3:12, 1Ki_3:28; 1Ch_22:12; Job_28:12, Job_28:23, Job_28:28; Pro_2:6; Isa_11:2, Isa_11:3; Dan_1:17; Luk_21:15; 1Co_2:6, 1Co_2:7; 1Co_12:8", "note": "", "refs": [{"l": "Jam 3:15", "n": "", "vs": [[15, "إن هذه الحكمة التي تدعونها ليست نازلة من عند الله، بل هي «حكمة» أرضية بشرية شيطانية."]]}, {"l": "Jam 1:5", "n": "", "vs": [[5, "وإن كان أحد منكم بحاجة إلى الحكمة، فليطلب من الله الذي يعطي الجميع بسخاء ولا يعير. فسيعطى له."]]}, {"l": "Jam 1:17", "n": "", "vs": [[17, "إن كل عطية صالحة وهبة كاملة إنما تنزل من فوق، من لدن أبي الأنوار الذي ليس فيه تحول، ولا ظل لأنه لا يدور."]]}, {"l": "Gen 41:38", "n": "", "vs": [[38, "وقال فرعون لعبيده: «هل نجد نظير هذا رجلا فيه روح الله؟»"]]}, {"l": "Gen 41:39", "n": "", "vs": [[39, "ثم قال فرعون ليوسف: «من حيث أن الله قد أطلعك على كل هذا، فليس هناك بصير وحكيم نظيرك."]]}, {"l": "Exo 36:2", "n": "", "vs": [[2, "ثم استدعى موسى بصلئيل وأهوليآب وكل صانع ماهر وهبه الرب حذاقة، وكل من حثه قلبه على المساهمة في إنجاز عمل ما."]]}, {"l": "1Ki 3:9", "n": "", "vs": [[9, "فهب عبدك قلبا فهيما لأقضي بين شعبك، وأميز بين الخير والشر، لأنه من يستطيع أن يحكم شعبك العظيم هذا؟»"]]}, {"l": "1Ki 3:12", "n": "", "vs": [[12, "فإنني سألبي طلبك، فأهبك قلبا حكيما مميزا، فلا يضاهيك أحد من قبل ولا من بعد."]]}, {"l": "1Ki 3:28", "n": "", "vs": [[28, "ولما سرى نبأ هذا الحكم الذي صدر عن الملك بين شعب إسرائيل، امتلأوا توقيرا له، لأنهم رأوا فيه حكمة الله لإجراء العدل."]]}, {"l": "1Ch 22:12", "n": "", "vs": [[12, "وليمنحك الرب فطنة ومعرفة عندما يوليك على إسرائيل لتطيع شريعة الرب إلهك،"]]}, {"l": "Job 28:12", "n": "", "vs": [[12, "ولكن أين توجد الحكمة؟ وأين مقر الفطنة؟"]]}, {"l": "Job 28:23", "n": "", "vs": [[23, "الله وحده يعلم الطريق إليها ويعرف مقرها،"]]}, {"l": "Job 28:28", "n": "", "vs": [[28, "ثم قال للإنسان: انظر، إن مخافة الرب هي الحكمة، وتفادي الشر هو الفطنة»."]]}, {"l": "Pro 2:6", "n": "", "vs": [[6, "لأن الرب يهب الحكمة، ومن فمه تتدفق المعرفة والفهم."]]}, {"l": "Isa 11:2", "n": "", "vs": [[2, "ويستقر عليه روح الرب، روح الحكمة والفطنة، روح المشورة والقوة، روح معرفة الرب ومخافته."]]}, {"l": "Isa 11:3", "n": "", "vs": [[3, "وتكون مسرته في تقوى الرب، ولا يقضي بحسب ما تشهد عيناه، ولا يحكم بمقتضى ما تسمع أذناه،"]]}, {"l": "Dan 1:17", "n": "", "vs": [[17, "ووهب الله أولئك الفتيان الأربعة معرفة وعقلا في كل ضروب الكتابة والعلم. وكان دانيآل فطنا في تفسير جميع الرؤى والأحلام."]]}, {"l": "Luk 21:15", "n": "", "vs": [[15, "لأني سوف أعطيكم كلاما وحكمة لا يقدر جميع مقاوميكم أن يردوها أو يناقضوها."]]}, {"l": "1Co 2:6", "n": "", "vs": [[6, "على أن لنا حكمة نتكلم بها بين البالغين. ولكنها حكمة ليست من هذا العالم ولا من رؤساء هذا العالم الزائلين."]]}, {"l": "1Co 2:7", "n": "", "vs": [[7, "بل إننا نتكلم بحكمة الله المطوية في سر، تلك الحكمة المحجوبة التي سبق الله فأعدها قبل الدهور لأجل مجدنا"]]}, {"l": "1Co 12:8", "n": "", "vs": [[8, "فواحد يوهب، عن طريق الروح، كلام الحكمة، وآخر كلام المعرفة وفقا للروح نفسه،"]]}], "kwAr": "الحكمة النازلة من عند الله", "noteAr": ""}, {"kw": "first", "raw": "Jam_4:8; Mal_3:3; Mat_5:8; Phi_4:8; Tit_1:15; 1Jo_3:3", "note": "", "refs": [{"l": "Jam 4:8", "n": "", "vs": [[8, "اقتربوا إلى الله فيقترب إليكم. أيها الخاطئون نظفوا أيديكم، وياأصحاب الرأيين طهروا قلوبكم."]]}, {"l": "Mal 3:3", "n": "", "vs": [[3, "فيجلس ممحصا ومنقيا للفضة ليطهر أبناء لاوي ويمحصهم كالفضة والذهب، حتى يقربوا للرب تقدمات بقلوب طاهرة."]]}, {"l": "Mat 5:8", "n": "", "vs": [[8, "طوبى لأنقياء القلب، فإنهم سيرون الله ."]]}, {"l": "Phi 4:8", "n": "", "vs": [[8, "وختاما، أيها الإخوة: كل ما كان حقا، وكل ما كان شريفا، وكل ما كان عادلا، وكل ما كان طاهرا وكل ما كان مستحبا، وكل ما كان حسن السمعة، وكل ما كان فيه فضيلة وخصلة حميدة، فاشغلوا أفكاركم به."]]}, {"l": "Tit 1:15", "n": "", "vs": [[15, "عند الطاهرين، كل شيء طاهر. أما عند النجسين وغير المؤمنين، فما من شيء طاهر، بل إن عقولهم وضمائرهم أيضا قد صارت نجسة."]]}, {"l": "1Jo 3:3", "n": "", "vs": [[3, "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر."]]}], "kwAr": "نقية طاهرة قبل كل شيء", "noteAr": ""}, {"kw": "peaceable", "raw": "1Ch_22:9 *marg. Isa_2:4, Isa_9:6, Isa_9:7, Isa_11:2-9, Isa_32:15-17; Rom_12:18; Heb_12:14", "note": "", "refs": [{"l": "1Ch 22:9", "n": "*marg.", "vs": [[9, "غير أنه يولد لك ابن يكون رجل سلام وأمن، وأنا أريحه من جميع أعدائه المحيطين به، فيكون اسمه سليمان، وأجعل السلام والسكينة يسودان إسرائيل في أيامه."]]}, {"l": "Isa 2:4", "n": "", "vs": [[4, "فيقضي بين الأمم ويحكم بين الشعوب الكثيرة، فيطبعون سيوفهم محاريث ورماحهم مناجل، ولا ترفع أمة على أمة سيفا، ولا يتدربون على الحرب فيما بعد."]]}, {"l": "Isa 9:6", "n": "", "vs": [[6, "لأنه يولد لنا ولد ويعطى لنا ابن يحمل الرياسة على كتفه، ويدعى اسمه عجيبا، مشيرا، إلها قديرا، أبا أبديا، رئيس السلام."]]}, {"l": "Isa 9:7", "n": "", "vs": [[7, "ولا تكون نهاية لنمو رياسته وللسلام اللذين يسودان عرش داود ومملكته، ليثبتها ويعضدها بالحق والبر، من الآن وإلى الأبد. إن غيرة الرب القدير تتمم هذا."]]}, {"l": "Isa 11:2-9", "n": "", "vs": [[2, "ويستقر عليه روح الرب، روح الحكمة والفطنة، روح المشورة والقوة، روح معرفة الرب ومخافته."], [3, "وتكون مسرته في تقوى الرب، ولا يقضي بحسب ما تشهد عيناه، ولا يحكم بمقتضى ما تسمع أذناه،"], [4, "إنما يقضي بعدل للمساكين، ويحكم بالإنصاف لبائسي الأرض، ويعاقب الأرض بقضيب فمه، ويميت المنافق بنفخة شفتيه،"], [5, "لأنه سيرتدي البر ويتمنطق بالأمانة."], [6, "فيسكن الذئب مع الحمل، ويربض النمر إلى جوار الجدي، ويتآلف العجل والأسد وكل حيوان معلوف معا، ويسوقها جميعا صبي صغير."], [7, "ترعى البقرة والدب معا، ويربض أولادهما متجاورين، ويأكل الأسد التبن كالثور،"], [8, "ويلعب الرضيع في (أمان) عند جحر الصل، ويمد الفطيم يده إلى وكر الأفعى (فلا يصيبه سوء)."], [9, "لا يؤذون ولا يسيئون في كل جبل قدسي، لأن الأرض تمتليء من معرفة الرب كما تغمر المياه البحر."]]}, {"l": "Isa 32:15-17", "n": "", "vs": [[15, "حتى تنسكب علينا روح من السماء، فتتحول البرية إلى مرج مخصب، ويحسب المرج غابة."], [16, "عندئذ يسكن العدل في الصحراء، ويقيم البر في المرج المخصب،"], [17, "فيكون ثمر البر سلاما، وفعل البر سكينة وطمأنينة إلى الأبد،"]]}, {"l": "Rom 12:18", "n": "", "vs": [[18, "إن كان ممكنا، فمادام الأمر يتعلق بكم، عيشوا في سلام مع جميع الناس."]]}, {"l": "Heb 12:14", "n": "", "vs": [[14, "اجعلوا هدفكم أن تسالموا جميع الناس، وتعيشوا حياة مقدسة. فبغير قداسة، لا يقدر أحد أن يرى الرب."]]}], "kwAr": "المسالمة", "noteAr": ""}, {"kw": "gentle", "raw": "Isa_40:11; 1Co_13:4-7; 2Co_10:1; Gal_5:22, Gal_5:23; Eph_5:9; 1Th_2:7; 2Ti_2:24; Tit_3:2", "note": "", "refs": [{"l": "Isa 40:11", "n": "", "vs": [[11, "يرعى قطيعه كراع، ويجمع الحملان بذراعه، وفي أحضانه يحملها ويقود المرضعات برفق."]]}, {"l": "1Co 13:4-7", "n": "", "vs": [[4, "المحبة تصبر طويلا؛ وهي لطيفة. المحبة لا تحسد. المحبة لا تتفاخر ولا تتكبر."], [5, "لا تتصرف بغير لياقة، ولا تسعى إلى مصلحتها الخاصة. لا تستفز سريعا، ولا تنسب الشر لأحد."], [6, "لا تفرح بالظلم، بل تفرح بالحق."], [7, "إنها تستر كل شيء، وتصدق كل شيء، وترجو كل شيء، وتتحمل كل شيء."]]}, {"l": "2Co 10:1", "n": "", "vs": [[1, "ولكني أتوسل إليكم بوداعة المسيح وحلمه، أنا بولس «المتواضع وأنا حاضر بينكم، والجريء عليكم وأنا غائب عنكم»،"]]}, {"l": "Gal 5:22", "n": "", "vs": [[22, "وأما ثمر الروح فهو: المحبة والفرح والسلام، وطول البال واللطف والصلاح، والأمانة"]]}, {"l": "Gal 5:23", "n": "", "vs": [[23, "والوداعة وضبط النفس. وليس من قانون يمنع مثل هذه الفضائل."]]}, {"l": "Eph 5:9", "n": "", "vs": [[9, "فإن ثمر النور يكون في كل صلاح واستقامة وحق."]]}, {"l": "1Th 2:7", "n": "", "vs": [[7, "مع أن لنا الحق في أن نفرض أنفسنا عليكم باعتبارنا رسلا للمسيح. ولكننا كنا مترفقين بكم كأم مرضع تحنو على أولادها."]]}, {"l": "2Ti 2:24", "n": "", "vs": [[24, "وعبد الرب يجب ألا يتشاجر، بل أن يكون مترفقا تجاه الجميع، قادرا على التعليم، يتحمل المشقات بصبر،"]]}, {"l": "Tit 3:2", "n": "", "vs": [[2, "ولا يقولوا سوءا في أحد، ولا يكونوا مخاصمين، بل لطفاء يعاملون الجميع بوداعة تامة."]]}], "kwAr": "والترفق", "noteAr": ""}, {"kw": "full", "raw": "Joh_1:14; Act_9:36, Act_11:24; Rom_15:14; 2Co_9:10; Phi_1:11; Col_1:10", "note": "", "refs": [{"l": "Joh 1:14", "n": "", "vs": [[14, "والكلمة صار بشرا، وخيم بيننا، ونحن رأينا مجده، مجد ابن وحيد عند الآب، وهو ممتلىء بالنعمة والحق."]]}, {"l": "Act 9:36", "n": "", "vs": [[36, "وكان في مدينة يافا تلميذة اسمها طابيثا، ومعنى اسمها: غزالة، كان يشغلها دائما فعل الخير ومساعدة الفقراء."]]}, {"l": "Act 11:24", "n": "", "vs": [[24, "فقد كان برنابا رجلا صالحا ممتلئا من الروح القدس والإيمان. وانضم إلى الرب جمع كبير."]]}, {"l": "Rom 15:14", "n": "", "vs": [[14, "وأنا نفسي أيضا على يقين من جهتكم أيها الإخوة بأنكم مشحونون صلاحا، وممتلئون بكل معرفة، وقادرون أيضا على نصح بعضكم بعضا."]]}, {"l": "2Co 9:10", "n": "", "vs": [[10, "والذي يقدم بذارا للزارع، وخبزا للأكل، سيقدم لكم بذاركم ويكثره ويزيد أثمار بركم:"]]}, {"l": "Phi 1:11", "n": "", "vs": [[11, "كاملين في ثمار البر الآتية بيسوع المسيح، لمجد الله وحمده."]]}, {"l": "Col 1:10", "n": "", "vs": [[10, "لكي تسلكوا سلوكا لائقا بالرب ومرضيا في كل شيء، منتجين الثمر في كل عمل صالح ونامين في معرفة الله إلى التمام،"]]}], "kwAr": "مملوءة بالرحمة والأعمال الصالحة", "noteAr": ""}, {"kw": "without", "raw": "Jam_2:4; Mal_2:9; 1Ti_5:21", "note": "", "refs": [{"l": "Jam 2:4", "n": "", "vs": [[4, "فإن ذلك يؤكد أنكم تميزون بين الناس بحسب طبقاتهم، جاعلين من أنفسكم قضاة ذوي أفكار سيئة!"]]}, {"l": "Mal 2:9", "n": "", "vs": [[9, "لذلك أحقركم وأذلكم أمام جميع الناس، لأنكم لم تطيعوا طرقي، وحابيتم في تطبيق شريعتي»."]]}, {"l": "1Ti 5:21", "n": "", "vs": [[21, "أطلب منك أمام الله والمسيح والملائكة المختارين أن تعمل بهذه التوصيات دون مراعاة أشخاص، فلا تعمل شيئا بتحيز."]]}], "kwAr": "لا تميز", "noteAr": ""}, {"kw": "partiality", "raw": "or, wrangling", "note": "or, wrangling", "refs": [], "kwAr": "ولا تنحاز", "noteAr": "أو: مخاصمة."}, {"kw": "hypocrisy", "raw": "Isa_32:6; Mat_23:28; Luk_12:1, Luk_12:2; Joh_1:47; Rom_12:9; 1Pe_1:22, 1Pe_2:1; 1Jo_3:18", "note": "", "refs": [{"l": "Isa 32:6", "n": "", "vs": [[6, "لأن اللئيم ينطق باللؤم، وقلبه يتآمر بالإثم ليرتكب شرا وليفتري على الرب، تاركا المتضور جوعا من غير شبع، وحارما الظاميء من الشرب."]]}, {"l": "Mat 23:28", "n": "", "vs": [[28, "كذلك أنتم أيضا، تبدون للناس أبرارا، ولكنكم من الداخل ممتلئون بالرياء والفسق!"]]}, {"l": "Luk 12:1", "n": "", "vs": [[1, "وفي تلك الأثناء، إذ احتشد عشرات الألوف من الشعب حتى داس بعضهم بعضا، أخذ يقول لتلاميذه أولا: «احذروا لأنفسكم من خمير الفريسيين الذي هو الريا ء!"]]}, {"l": "Luk 12:2", "n": "", "vs": [[2, "فما من مستور لن يكشف، ولا من سر لن يعرف."]]}, {"l": "Joh 1:47", "n": "", "vs": [[47, "ورأى يسوع نثنائيل قادما نحوه فقال عنه: «هذا إسرائيلي أصيل لا شك فيه!»"]]}, {"l": "Rom 12:9", "n": "", "vs": [[9, "ولتكن المحبة بلا رياء. انفروا من الشر، والتصقوا بالخير."]]}, {"l": "1Pe 1:22", "n": "", "vs": [[22, "وإذ قد خضعتم للحق، فتطهرت نفوسكم وصرتم قادرين أن تحبوا الآخرين محبة أخوية لا رياء فيها، أحبوا بعضكم بعضا محبة شديدة صادرة من قلب طاهر!"]]}, {"l": "1Pe 2:1", "n": "", "vs": [[1, "لذلك، تخلصوا من كل أثر للشر والخداع والرياء والحسد والذم."]]}, {"l": "1Jo 3:18", "n": "", "vs": [[18, "أيها الأولاد الصغار، لا يجب أن تكون محبتنا مجرد ادعاء بالكلام واللسان، بل تكون محبة عملية حقة."]]}], "kwAr": "ولا ترائي", "noteAr": ""}], "arS": [["أما ", []], ["الحكمة", ["G4678"]], [" النازلة من عند ", []], ["الله", ["G509"]], ["، فهي ", []], ["نقية", ["G53"]], [" طاهرة، قبل كل ", []], ["شيء", ["G4412"]], [". وهي ", []], ["أيضا", ["G1899"]], [" تدفع صاحبها إلى ", []], ["المسالمة", ["G1516"]], [" ", []], ["والترفق", ["G1933"]], [". كما أنها ", []], ["مطاوعة", ["G2138"]], ["، ", []], ["مملوءة", ["G3324"]], [" ", []], ["بالرحمة", ["G1656"]], [" ", []], ["والأعمال", ["G2590"]], [" ", []], ["الصالحة", ["G18"]], ["، مستقيمة: لا ", []], ["تميز", ["G87"]], [" ولا تنحاز ولا ", []], ["ترائي", ["G505"]], [".", []]]}, {"c": 3, "v": 18, "text": "والبر هو ثمر ة ما يزرعه في سلام صانعو السلام.", "groups": [{"kw": "the fruit", "raw": "Jam_1:20; Pro_11:18, Pro_11:28, Pro_11:30; Isa_32:16, Isa_32:17; Hos_10:12; Mat_5:9; Joh_4:36; Phi_1:11; Heb_12:11", "note": "", "refs": [{"l": "Jam 1:20", "n": "", "vs": [[20, "لأن الإنسان، إذا غضب، لا يعمل الصلاح الذي يريده الله ."]]}, {"l": "Pro 11:18", "n": "", "vs": [[18, "الشرير يكسب أجرة غش زائلة، أما زارع البر فله ثواب أكيد دائم."]]}, {"l": "Pro 11:28", "n": "", "vs": [[28, "من يتكل على غناه يسقط، أما الصديقون فيزهون كأوراق الشجر الخضراء."]]}, {"l": "Pro 11:30", "n": "", "vs": [[30, "ثمر الصديق شجرة حياة، ورابح النفوس حكيم."]]}, {"l": "Isa 32:16", "n": "", "vs": [[16, "عندئذ يسكن العدل في الصحراء، ويقيم البر في المرج المخصب،"]]}, {"l": "Isa 32:17", "n": "", "vs": [[17, "فيكون ثمر البر سلاما، وفعل البر سكينة وطمأنينة إلى الأبد،"]]}, {"l": "Hos 10:12", "n": "", "vs": [[12, "ازرعوا لأنفسكم بذار البر، فتحصدوا بمقتضاه ثمار الرحمة، احرثوا لكم حرثا لأن هذا أوان التماس الرب، حتى يأتي ويمطر عليكم غيوث صلاحه."]]}, {"l": "Mat 5:9", "n": "", "vs": [[9, "طوبى لصانعي السلام، فإنهم سيدعون أبناء الله."]]}, {"l": "Joh 4:36", "n": "", "vs": [[36, "والحاصد يأخذ أجرته، ويجمع الثمر للحياة الأبدية، فيفرح الزارع والحاصد معا،"]]}, {"l": "Phi 1:11", "n": "", "vs": [[11, "كاملين في ثمار البر الآتية بيسوع المسيح، لمجد الله وحمده."]]}, {"l": "Heb 12:11", "n": "", "vs": [[11, "وطبعا، كل تأديب لا يبدو في الحال باعثا على الفرح، بل على الحزن. ولكنه فيما بعد، ينتج بسلام في الذين يتلقونه ثمر البر."]]}], "kwAr": "البر هو ثمرة", "noteAr": ""}, {"kw": "make", "raw": "Mat_5:9", "note": "", "refs": [{"l": "Mat 5:9", "n": "", "vs": [[9, "طوبى لصانعي السلام، فإنهم سيدعون أبناء الله."]]}], "kwAr": "صانعو السلام", "noteAr": ""}], "arS": [["والبر", ["G1343"]], [" هو ", []], ["ثمر", ["G2590"]], [" ة ما ", []], ["يزرعه", ["G4687"]], [" في ", []], ["سلام", ["G1515"]], [" ", []], ["صانعو", ["G4160"]], [" ", []], ["السلام", ["G1515"]], [".", []]]}, {"c": 4, "v": 1, "text": "من أين النزاع والخصام بينكم؟ أليس من لذاتكم تلك المتصارعة في أعضائكم؟", "groups": [{"kw": "whence", "raw": "Jam_3:14-18", "note": "", "refs": [{"l": "Jam 3:14-18", "n": "", "vs": [[14, "أما إن كانت قلوبكم مملوءة بمرارة الحسد وبالتحزب، فلا تفتخروا بحكمتكم، ولا تنكروا الحق."], [15, "إن هذه الحكمة التي تدعونها ليست نازلة من عند الله، بل هي «حكمة» أرضية بشرية شيطانية."], [16, "فحيث تكون مرارة الحسد والتحزب، ينتشر الخلاف والفوضى وجميع الشرور."], [17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."], [18, "والبر هو ثمر ة ما يزرعه في سلام صانعو السلام."]]}], "kwAr": "من أين", "noteAr": ""}, {"kw": "fightings", "raw": "or, brawlings", "note": "or, brawlings", "refs": [], "kwAr": "النزاع والخصام", "noteAr": "أو: مشاجرات."}, {"kw": "come they", "raw": "Jam_1:14; Gen_4:5-8; Jer_17:9; Mat_15:19; Mar_7:21-23; Joh_8:44; Rom_8:7; 1Ti_6:4-10; Tit_3:3; 1Pe_1:14, 1Pe_2:11, 1Pe_4:2, 1Pe_4:3; 2Pe_2:18, 2Pe_3:3; 1Jo_2:15-17; Jud_1:16-18", "note": "", "refs": [{"l": "Jam 1:14", "n": "", "vs": [[14, "ولكن الإنسان يسقط في التجربة حين يندفع مخدوعا وراء شهوته."]]}, {"l": "Gen 4:5-8", "n": "", "vs": [[5, "لكنه لم يتقبل قربان قايين ولم يرض عنه. فاغتاظ قايين جدا وتجهم وجهه كمدا."], [6, "فسأل الرب قايين: «لماذا اغتظت؟ لماذا تجهم وجهك؟"], [7, "لو أحسنت في تصرفك ألا يشرق وجهك فرحا؟ وإن لم تحسن التصرف، فعند الباب خطيئة تنتظرك، تتشوق أن تتسلط عليك، لكن يجب أن تتحكم فيها»"], [8, "وعاد قايين يتظاهر بالود لأخيه هابيل. وحدث إذ كانا معا في الحقل أن قايين هجم على أخيه هابيل وقتله."]]}, {"l": "Jer 17:9", "n": "", "vs": [[9, "القلب أخدع من كل شيء وهو نجيس، فمن يقدر أن يفهمه؟"]]}, {"l": "Mat 15:19", "n": "", "vs": [[19, "فمن القلب تنبع الأفكار الشريرة، القتل، الزنى، الفسق، السرقة، شهادة الزور، التجديف."]]}, {"l": "Mar 7:21-23", "n": "", "vs": [[21, "فإنه من الداخل، من قلوب الناس، تنبع الأفكار الشريرة، الفسق، السرقة، القتل،"], [22, "الزنى، الطمع، الخبث، الخداع، العهارة، العين الشريرة، التجديف، الكبرياء، الحماقة"], [23, "هذه الأمور الشريرة كلها تنبع من داخل الإنسان وتنجسه»."]]}, {"l": "Joh 8:44", "n": "", "vs": [[44, "إنكم أولاد أبيكم إبليس، وترغبون أن تعملوا شهوات أبيكم. فهو من البدء كان قاتلا للناس، ولم يثبت في الحق لأنه خال من الحق! وعندما ينطق بالكذب فهو ينضح بما فيه، لأنه كذاب وأبو الكذب!"]]}, {"l": "Rom 8:7", "n": "", "vs": [[7, "لأن اهتمام الجسد هو عداوة لله، إذ إنه لا يخضع لناموس الله، بل لا يستطيع ذلك."]]}, {"l": "1Ti 6:4-10", "n": "", "vs": [[4, "فهو قد انتفخ تكبرا، ولا يعرف شيئا، وإنما هو مهووس بالمجادلات والمنازعات الكلامية، ومنها ينشأ الحسد والخصام والتجريح والنيات السيئة،"], [5, "وشتى أنواع النزاع بين أناس فاسدي العقول مجردين من الحق، يعتبرون التقوى تجارة."], [6, "أما التقوى مع القناعة فهي تجارة عظيمة."], [7, "فنحن لم ندخل العالم حاملين شيئا، ولا نستطيع أن نخرج منه حاملين شيئا."], [8, "إنما، مادام لنا قوت ولباس، فلنكن قانعين بهما."], [9, "أما الذين يرغبون في أن يصيروا أغنياء، فيسقطون في التجربة والفخ ويتورطون في كثير من الشهوات السفيهة المضرة التي تغرق الناس في الدمار والهلاك."], [10, "فإن حب المال أصل لكل شر؛ وإذ سعى بعضهم إليه، ضلوا عن الإيمان، وطعنوا أنفسهم بأوجاع كثيرة."]]}, {"l": "Tit 3:3", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."]]}, {"l": "1Pe 1:14", "n": "", "vs": [[14, "وبما أنكم صرتم أولادا لله مطيعين له، فلا تعودوا إلى مجاراة الشهوات التي كانت تسيطر عليكم سابقا في أيام جهلكم."]]}, {"l": "1Pe 2:11", "n": "", "vs": [[11, "أيها الأحباء، ما أنتم إلا غرباء تزورون الأرض زيارة عابرة. لذلك أطلب إليكم أن تبتعدوا عن الشهوات الجسدية التي تصارع النفس."]]}, {"l": "1Pe 4:2", "n": "", "vs": [[2, "وغايته أن يعيش بقية عمره في الجسد، منقادا لا لشهوات الناس، بل لإرادة الله."]]}, {"l": "1Pe 4:3", "n": "", "vs": [[3, "كفاكم ذلك الزمان الماضي من حياتكم، لتكونوا قد سلكتم سلوك الوثنيين، حين كنتم تعيشون في الدعارة والشهوات وإدمان الخمر، وحفلات السكر والعربدة، وعبادة الأصنام المحرمة."]]}, {"l": "2Pe 2:18", "n": "", "vs": [[18, "ينطقون بأقوال طنانة فارغة، مشجعين على الانغماس في الشهوات الجسدية بممارسة الدعارة، فيصطادون من كانوا قد بدأوا ينفصلون عن رفاق السوء الذين يسلكون في الضلال."]]}, {"l": "2Pe 3:3", "n": "", "vs": [[3, "فاعلموا، قبل كل شيء أنه سيأتي في آخر الأيام أناس مستهزئون يسخرون بالحق، ويسلكون منجرفين وراء شهواتهم الخاصة."]]}, {"l": "1Jo 2:15-17", "n": "", "vs": [[15, "لا تحبوا العالم، ولا الأشياء التي في العالم. فالذي يحب العالم، لا تكون محبة الآب في قلبه."], [16, "لأن كل ما في العالم، من شهوات الجسد وشهوات العين وترف المعيشة، ليس من الآب، بل من العالم."], [17, "وسوف يزول العالم، وما فيه من شهوات أما الذي يعمل بإرادة الله، فيبقى إلى الأبد!"]]}, {"l": "Jud 1:16-18", "n": "", "vs": [[16, "وهؤلاء المعلمون يتذمرون ويشكون دائما وفيما هم يندفعون وراء شهواتهم، يطلقون ألسنتهم متحدثين بأمور طنانة، ويمدحون من يعجبهم طلبا للمنفعة!"], [17, "أما أنتم أيها الأحباء، فاذكروا دائما ما قاله رسل ربنا يسوع المسيح."], [18, "فقد سبق أن نبهوكم إلى أنه، في نهاية الزمان، سيطلع مستهزئون يعيشون منغمسين في شهواتهم الفاسقة."]]}], "kwAr": "أليس من", "noteAr": ""}, {"kw": "lusts", "raw": "or, pleasures, Jam_4:3", "note": "or, pleasures, Jam_4:3", "refs": [{"l": "Jam 4:3", "n": "", "vs": [[3, "وإذا طلبتم منه شيئا، فإنكم لا تحصلون عليه: لأنكم تطلبون بدافع شرير، إذ تنوون أن تستهلكوا ما تنالونه لإشباع شهواتكم فقط."]]}], "kwAr": "لذاتكم", "noteAr": "أو: لذات."}, {"kw": "in", "raw": "Rom_7:5, Rom_7:23; Gal_5:17; Col_3:5", "note": "", "refs": [{"l": "Rom 7:5", "n": "", "vs": [[5, "فعندما كنا في الجسد، كانت أهواء الخطايا المعلنة في الشريعة عاملة في أعضائنا لكي نثمر للموت."]]}, {"l": "Rom 7:23", "n": "", "vs": [[23, "ولكنني أرى في أعضائي ناموسا آخر يحارب الشريعة التي يريدها عقلي، ويجعلني أسيرا لناموس الخطيئة الكائن في أعضائي."]]}, {"l": "Gal 5:17", "n": "", "vs": [[17, "فإن الجسد يشتهي بعكس الروح، والروح بعكس الجسد؛ وهذان يقاوم أحدهما الآخر حتى إنكم لا تفعلون ما ترغبون فيه."]]}, {"l": "Col 3:5", "n": "", "vs": [[5, "فأميتوا إذن أعضاءكم الأرضية: الزنى، النجاسة، جموح العاطفة، الشهوة الرديئة، والاشتهاء النهم الذي هو عبادة أصنام."]]}], "kwAr": "المتصارعة في أعضائكم", "noteAr": ""}], "arS": [["من ", []], ["أين", ["G4159"]], [" ", []], ["النزاع", ["G4171"]], [" ", []], ["والخصام", ["G3163"]], [" ", []], ["بينكم", ["G5213"]], ["؟ ", []], ["أليس", ["G3756"]], [" من ", []], ["لذاتكم", ["G2237"]], [" تلك ", []], ["المتصارعة", ["G4754"]], [" في ", []], ["أعضائكم", ["G3196"]], ["؟", []]]}, {"c": 4, "v": 2, "text": "فأنتم ترغبون في امتلاك ما لا يخصكم، لكن ذلك لا يتحقق لكم، فتقتلون، وتحسدون، ولا تتمكنون من بلوغ غايتكم. وهكذا تتخاصمون وتتصارعون! إنكم لا تمتلكون ما تريدونه، لأنكم لا تطلبونه من الله.", "groups": [{"kw": "lust", "raw": "Jam_5:1-5; Pro_1:19; Ecc_4:8; Hab_2:5; 1Ti_6:9, 1Ti_6:10", "note": "", "refs": [{"l": "Jam 5:1-5", "n": "", "vs": [[1, "أيها الأغنياء، هيا الآن ابكوا مولولين بسبب ما ينتظركم من أهوال وشقاء."], [2, "إن ثرواتكم الكثيرة قد فسدت، وثيابكم الفاخرة قد أكلها العث"], [3, "ذهبكم وفضتكم قد تآكلا، وسيكون تآكلهما شاهدا ضدكم، ويأكل لحمكم كنار جمعتموها ثروة للأيام الأخيرة؟"], [4, "وهذه أجرة العمال الذين حصدوا حقولكم، تلك الأجرة التي مازلتم تحبسونها عنهم ظلما، إنها تصرخ، وصراخ أولئك العمال أنفسهم قد سمعه رب الجنود!"], [5, "أنتم تعيشون على الأرض عيشة رفاهية وانصراف إلى المباهج واللذات؛ وقد أصبحت قلوبكم سمينة كأنها جاهزة ليوم الذبح."]]}, {"l": "Pro 1:19", "n": "", "vs": [[19, "هذا هو مصير كل من يثرى ظلما، فإن الثراء الحرام يذهب بحياة قانيه."]]}, {"l": "Ecc 4:8", "n": "", "vs": [[8, "واحد وحيد، لا ثاني له. لا ابن ولا أخ. ولا نهاية لتعبه. عينه لا تشبع من الغنى، ولا يقول: لمن أكدح وأحرم نفسي من المسرات؟ هذا أيضا باطل وعناء شاق!"]]}, {"l": "Hab 2:5", "n": "", "vs": [[5, "وكما أن الخمر غادرة، كذلك تأخذ المغتر نشوة الانتصار فلا يستكين، فإن جشعه في سعة الهاوية، وهو كالموت لا يشبع. لهذا يجمع لنفسه كل الأمم ويسبي جميع الشعوب."]]}, {"l": "1Ti 6:9", "n": "", "vs": [[9, "أما الذين يرغبون في أن يصيروا أغنياء، فيسقطون في التجربة والفخ ويتورطون في كثير من الشهوات السفيهة المضرة التي تغرق الناس في الدمار والهلاك."]]}, {"l": "1Ti 6:10", "n": "", "vs": [[10, "فإن حب المال أصل لكل شر؛ وإذ سعى بعضهم إليه، ضلوا عن الإيمان، وطعنوا أنفسهم بأوجاع كثيرة."]]}], "kwAr": "ترغبون في امتلاك", "noteAr": ""}, {"kw": "kill", "raw": "or, envy", "note": "or, envy", "refs": [], "kwAr": "فتقتلون", "noteAr": "أو: تحسدون."}, {"kw": "because", "raw": "Jam_1:5; Isa_7:12; Mat_7:7, Mat_7:8; Luk_11:9-13; Joh_4:10, Joh_16:24", "note": "", "refs": [{"l": "Jam 1:5", "n": "", "vs": [[5, "وإن كان أحد منكم بحاجة إلى الحكمة، فليطلب من الله الذي يعطي الجميع بسخاء ولا يعير. فسيعطى له."]]}, {"l": "Isa 7:12", "n": "", "vs": [[12, "فأجاب آحاز: «لن أطلب ولن أجرب الرب»."]]}, {"l": "Mat 7:7", "n": "", "vs": [[7, "اسألوا، تعطوا. اطلبوا، تجدوا. اقرعوا، يفتح لكم."]]}, {"l": "Mat 7:8", "n": "", "vs": [[8, "فكل من يسأل، ينل؛ ومن يطلب، يجد؛ ومن يقرع، يفتح له."]]}, {"l": "Luk 11:9-13", "n": "", "vs": [[9, "فإني أقول لكم: اطلبوا، تعطوا؛ اسعوا، تجدوا؛ اقرعوا، يفتح لكم:"], [10, "فإن كل من يطلب ينال، ومن يسعى يجد، ومن يقرع يفتح له."], [11, "فأي أب منكم يطلب منه ابنه خبزا فيعطيه حجرا؟ أو يطلب سمكة فيعطيه بدل السمكة حية؟"], [12, "أو يطلب بيضة، فيعطيه عقربا؟"], [13, "فإن كنتم، أنتم الأشرار، تعرفون أن تعطوا أولادكم عطايا جيدة، فكم بالأحرى الآب، الذي من السماء يهب الروح القدس لمن يسألونه؟ »"]]}, {"l": "Joh 4:10", "n": "", "vs": [[10, "فأجابها يسوع: «لو كنت تعرفين عطية الله، ومن هو الذي يقول لك: اسقيني، لطلبت أنت منه فأعطاك ماء حيا!»"]]}, {"l": "Joh 16:24", "n": "", "vs": [[24, "حتى الآن لم تطلبوا باسمي شيئا. اطلبوا تنالوا، فيكون فرحكم كاملا."]]}], "kwAr": "لأنكم لا تطلبونه من الله", "noteAr": ""}], "arS": [["فأنتم ", []], ["ترغبون", ["G1937"]], [" في امتلاك ما لا يخصكم، لكن ذلك لا يتحقق ", []], ["لكم", ["G2192", "G3756"]], ["، ", []], ["فتقتلون", ["G5407"]], ["، ", []], ["وتحسدون", ["G2206"]], ["، ولا ", []], ["تتمكنون", ["G1410", "G3756"]], [" من ", []], ["بلوغ", ["G2013"]], [" غايتكم. وهكذا ", []], ["تتخاصمون", ["G3164"]], [" ", []], ["وتتصارعون", ["G4170"]], ["! إنكم لا ", []], ["تمتلكون", ["G2192"]], [" ما تريدونه، لأنكم ", []], ["لا", ["G3361"]], [" ", []], ["تطلبونه", ["G154"]], [" من الله.", []]]}, {"c": 4, "v": 3, "text": "وإذا طلبتم منه شيئا، فإنكم لا تحصلون عليه: لأنكم تطلبون بدافع شرير، إذ تنوون أن تستهلكوا ما تنالونه لإشباع شهواتكم فقط.", "groups": [{"kw": "and", "raw": "Jam_1:6, Jam_1:7; Job_27:8-10, Job_35:12; Psa_18:41, Psa_66:18, Psa_66:19; Pro_1:28, Pro_15:8; Pro_21:13, Pro_21:27; Isa_1:15, Isa_1:16; Jer_11:11, Jer_11:14, Jer_14:12; Mic_3:4; Zec_7:13; Mat_20:22; Mar_10:38; 1Jo_3:22, 1Jo_5:14", "note": "", "refs": [{"l": "Jam 1:6", "n": "", "vs": [[6, "وإنما، عليه أن يطلب ذلك بإيمان، دون أي تردد أو شك. فإن المتردد كموجة البحر تتلاعب بها الرياح فتقذفها وتردها!"]]}, {"l": "Jam 1:7", "n": "", "vs": [[7, "فلا يتوهم المتردد أنه ينال شيئا من الرب."]]}, {"l": "Job 27:8-10", "n": "", "vs": [[8, "إذ ما هو رجاء الفاجر عندما يستأصله الله ويزهق أنفاسه؟"], [9, "هل يستمع الله إلى صرخته إذا حل به ضيق؟"], [10, "هل يسر بالقدير ويستغيث به في كل الأزمنة؟"]]}, {"l": "Job 35:12", "n": "", "vs": [[12, "يستغيثون به فلا يجيب من جراء تشامخ الأشرار"]]}, {"l": "Psa 18:41", "n": "", "vs": [[41, "يستغيثون ولا مخلص. ينادون الرب فلا يستجيب لهم."]]}, {"l": "Psa 66:18", "n": "", "vs": [[18, "إن تعهدت إثما في قلبي لا يستمع لي الرب."]]}, {"l": "Psa 66:19", "n": "", "vs": [[19, "ولكن الله قد استجاب لي. أصغى إلى صوت صلاتي."]]}, {"l": "Pro 1:28", "n": "", "vs": [[28, "حينئذ يستغيثون بي فلا أستجيب، ويلتمسونني فلا يجدونني."]]}, {"l": "Pro 15:8", "n": "", "vs": [[8, "قربان المنافقين مكرهة الرب، ومسرته صلاة المستقيمين."]]}, {"l": "Pro 21:13", "n": "", "vs": [[13, "من أصم أذنه عن صراخ المسكين، يصرخ هو أيضا ولا من مجيب."]]}, {"l": "Pro 21:27", "n": "", "vs": [[27, "ذبيحة الشرير رجس عند الرب، فكم بالحري إن قربها بنية أثيمة؟"]]}, {"l": "Isa 1:15", "n": "", "vs": [[15, "عندما تبسطون نحوي أيديكم أحجب وجهي عنكم، وإن أكثرتم الصلاة لا أستجيب، لأن أيديكم مملوءة دما."]]}, {"l": "Isa 1:16", "n": "", "vs": [[16, "اغتسلوا، تطهروا، أزيلوا شر أعمالكم من أمام عيني. كفوا عن اقتراف الإثم،"]]}, {"l": "Jer 11:11", "n": "", "vs": [[11, "لذلك ها أنا أنزل بهم شرا لن يفلتوا منه، فيستغيثون بي فَلا أستجيب لهم."]]}, {"l": "Jer 11:14", "n": "", "vs": [[14, "فلا تبتهلن من أجل هذا الشعب، ولا ترفعن لأجلهم دعاء ولا صلاة، فإني لن أسمع لهم وقت استغاثتهم بي من محنتهم."]]}, {"l": "Jer 14:12", "n": "", "vs": [[12, "وإن صاموا فلن أستجيب إلى صراخهم، وإن قربوا محرقات وتقدمات دقيق فلن أتقبلها، ولكني أفنيهم بالسيف والمجاعة والوباء»."]]}, {"l": "Mic 3:4", "n": "", "vs": [[4, "ثم حين تستغيثون بالرب لا يستجيب ويحجب وجهه عنكم في ذلك الوقت بسبب ما ارتكبتموه من أعمال شريرة."]]}, {"l": "Zec 7:13", "n": "", "vs": [[13, "وكما ناديت فلم يسمعوا فإني أنا أيضا لا أسمع، يقول الرب القدير."]]}, {"l": "Mat 20:22", "n": "", "vs": [[22, "فأجاب يسوع قائلا ليعقوب ويوحنا: «أنتما لا تدريان ما تطلبان! أتقدران أن تشربا الكأس التي سأشربها؟» أجاباه: «نعم، نقدر!»"]]}, {"l": "Mar 10:38", "n": "", "vs": [[38, "فقال لهما يسوع: «أنتما لا تدريان ما تطلبان: أتقدران أن تشربا الكأس التي سأشربها أنا، أو تتعمدا بالمعمودية التي سأتعمد بها أنا؟»"]]}, {"l": "1Jo 3:22", "n": "", "vs": [[22, "ومهما نطلب منه بالصلاة، نحصل عليه: لأننا نطيع ما يوصينا به، ونمارس الأعمال التي ترضيه."]]}, {"l": "1Jo 5:14", "n": "", "vs": [[14, "نحن نثق بالله ثقة عظيمة تؤكد لنا أنه يسمع لنا الطلبات التي نرفعها إليه، إن كانت منسجمة مع إرادته."]]}], "kwAr": "لا تحصلون عليه لأنكم تطلبون بدافع شرير", "noteAr": ""}, {"kw": "ye may", "raw": "Luk_15:13, Luk_15:30, Luk_16:1, Luk_16:2", "note": "", "refs": [{"l": "Luk 15:13", "n": "", "vs": [[13, "وبعد بضعة أيام، جمع الابن الأصغر كل ما عنده، ومضى إلى بلد بعيد. وهنالك بذر حصته من المال في عيشة الخلاعة."]]}, {"l": "Luk 15:30", "n": "", "vs": [[30, "ولكن لما عاد ابنك هذا الذي أكل مالك مع الفاجرات، ذبحت له العجل المسمن!"]]}, {"l": "Luk 16:1", "n": "", "vs": [[1, "وقال أيضا لتلاميذه: «كان لإنسان غني وكيل. فاتهم لديه بأنه يبذر أمواله."]]}, {"l": "Luk 16:2", "n": "", "vs": [[2, "فاستدعاه وسأله: ما هذا الذي أسمع عنك؟ قدم حساب وكالتك، فإنك لا يمكن أن تكون وكيلا لي بعد!"]]}], "kwAr": "تستهلكوا ما تنالونه", "noteAr": ""}, {"kw": "lusts", "raw": "or, pleasures, Jam_4:1", "note": "or, pleasures, Jam_4:1", "refs": [{"l": "Jam 4:1", "n": "", "vs": [[1, "من أين النزاع والخصام بينكم؟ أليس من لذاتكم تلك المتصارعة في أعضائكم؟"]]}], "kwAr": "شهواتكم", "noteAr": "أو: لذات."}], "arS": [["وإذا ", []], ["طلبتم", ["G154"]], [" منه شيئا، فإنكم ", []], ["لا", ["G3756"]], [" ", []], ["تحصلون", ["G2983"]], [" عليه: ", []], ["لأنكم", ["G1360"]], [" ", []], ["تطلبون", ["G154"]], [" ", []], ["بدافع شرير", ["G2560"]], ["، إذ تنوون أن ", []], ["تستهلكوا", ["G1159"]], [" ما تنالونه لإشباع ", []], ["شهواتكم", ["G2237"]], [" فقط.", []]]}, {"c": 4, "v": 4, "text": "أيها الخونة! ألستم تعلمون أن مصادقة العالم هي معاداة لله؟ فالذي يريد أن يصادق العالم، يجعل نفسه عدوا لله.", "groups": [{"kw": "adulterers", "raw": "Psa_50:18, Psa_73:27; Isa_57:3; Jer_9:2; Hos_3:1; Mat_12:39, Mat_16:4", "note": "", "refs": [{"l": "Psa 50:18", "n": "", "vs": [[18, "ترى سارقا فتوافقه، ومع الزناة نصيبك."]]}, {"l": "Psa 73:27", "n": "", "vs": [[27, "هوذا المبتعدون عنك يهلكون وأنت تدمر كل من يخونك. raw": "Gal_1:10", "note": "", "refs": [{"l": "Gal 1:10", "n": "", "vs": [[10, "فهل أسعى الآن إلى كسب تأييد الناس أو الله؟ أم تراني أطلب أن أرضي الناس؟ لو كنت حتى الآن أرضي الناس، لما كنت عبدا للمسيح!"]]}], "kwAr": "الذي يريد أن يصادق العالم", "noteAr": ""}, {"kw": "is the", "raw": "Psa_21:8; Luk_19:27; Joh_15:23, Joh_15:24; Rom_5:10", "note": "", "refs": [{"l": "Psa 21:8", "n": "", "vs": [[8, "يدك حتما تنال جميع أعدائك، ويمناك حقا تظفر بمبغضيك."]]}, {"l": "Luk 19:27", "n": "", "vs": [[27, "وأما أعدائي أولئك الذين لم يريدوا أن أملك عليهم، فأحضروهم إلى هنا واذبحوهم قدامي!»"]]}, {"l": "Joh 15:23", "n": "", "vs": [[23, "الذي يبغضني، يبغض أبي أيضا."]]}, {"l": "Joh 15:24", "n": "", "vs": [[24, "ولو لم أعمل بينهم أعمالا لم يعملها أحد غيري، لما كانت لهم خطيئة. ولكنهم أبغضوني وأبغضوا أبي، مع أنهم رأوا تلك الأعمال."]]}, {"l": "Rom 5:10", "n": "", "vs": [[10, "فإن كنا، ونحن أعداء، قد تصالحنا مع الله بموت ابنه، فكم بالأحرى نخلص بحياته ونحن مصالحون!"]]}], "kwAr": "يجعل نفسه عدوا لله", "noteAr": ""}], "arS": [["أيها ", []], ["الخونة", ["G3432", "G3428"]], ["! ", []], ["ألستم", ["G3756"]], [" ", []], ["تعلمون", ["G1492"]], [" ", []], ["أن", ["G3754"]], [" ", []], ["مصادقة", ["G5373"]], [" ", []], ["العالم", ["G2889"]], [" هي ", []], ["معاداة", ["G2189"]], [" ", []], ["لله", ["G2316"]], ["؟ فالذي ", []], ["يريد", ["G1014"]], [" أن ", []], ["يصادق", ["G5384"]], [" ", []], ["العالم", ["G2889"]], ["، يجعل نفسه ", []], ["عدوا", ["G2190"]], [" ", []], ["لله", ["G2316"]], [".", []]]}, {"c": 4, "v": 5, "text": "أتظنون أن الكتاب يتكلم عبثا! هل الروح الذي حل في داخلنا يغار عن حسد؟", "groups": [{"kw": "the scripture", "raw": "Joh_7:42, Joh_10:35, Joh_19:37; Rom_9:17; Gal_3:8", "note": "", "refs": [{"l": "Joh 7:42", "n": "", "vs": [[42, "أما قال الكتاب إن المسيح سيأتي من نسل داود، ومن قرية بيت لحم حيث كان داود؟»"]]}, {"l": "Joh 10:35", "n": "", "vs": [[35, "فإذا كانت الشريعة تدعو أولئك الذين نزلت إليهم كلمة الله آلهة والكتاب لا يمكن أن ينقض"]]}, {"l": "Joh 19:37", "n": "", "vs": [[37, "وقد جاء أيضا في موضع آخر من الكتاب: «سينظرون إلى ذاك الذي طعنوه»."]]}, {"l": "Rom 9:17", "n": "", "vs": [[17, "فإن الله يقول لفرعون في الكتاب: «لهذا الأمر بعينه أقمتك: لأظهر فيك قدرتي ويعلن اسمي في الأرض كلها»."]]}, {"l": "Gal 3:8", "n": "", "vs": [[8, "ثم إن الكتاب، إذ سبق فرأى أن الله سوف يبرر الأمم على أساس الإيمان، بشر إبراهيم سلفا بقوله: «فيك تتبارك جميع الأمم!»"]]}], "kwAr": "الكتاب", "noteAr": ""}, {"kw": "The spirit", "raw": "Gen_4:5, Gen_4:6, Gen_6:5, Gen_8:21, Gen_26:14, Gen_30:1, Gen_37:11; Num_11:29; Psa_37:1, Psa_106:16; Pro_21:10; Ecc_4:4; Isa_11:13; Act_7:9; Rom_1:29; Tit_3:3", "note": "", "refs": [{"l": "Gen 4:5", "n": "", "vs": [[5, "لكنه لم يتقبل قربان قايين ولم يرض عنه. فاغتاظ قايين جدا وتجهم وجهه كمدا."]]}, {"l": "Gen 4:6", "n": "", "vs": [[6, "فسأل الرب قايين: «لماذا اغتظت؟ لماذا تجهم وجهك؟"]]}, {"l": "Gen 6:5", "n": "", "vs": [[5, "ورأى الرب أن شر الإنسان قد كثر في الأرض، وأن كل تصور فكر قلبه يتسم دائما بالإثم،"]]}, {"l": "Gen 8:21", "n": "", "vs": [[21, "فتقبلها الرب برضى، وقال في نفسه: «لن ألعن الأرض مرة أخرى من أجل الإنسان، لأن أهواء قلب الإنسان شريرة منذ حداثته ولن أقدم على إهلاك كل حي كما فعلت."]]}, {"l": "Gen 26:14", "n": "", "vs": [[14, "وصارت له ماشية، غنم وقطعان بقر وعبيد كثيرون. فحسده الفلسطينيون."]]}, {"l": "Gen 30:1", "n": "", "vs": [[1, "وعندما تبينت راحيل أنها عاقر، غارت من أختها وقالت ليعقوب: «هب لي بنين وإلا فإني أموت»."]]}, {"l": "Gen 37:11", "n": "", "vs": [[11, "فحسده إخوته. أما أبوه فأسر هذا الكلام في قلبه."]]}, {"l": "Num 11:29", "n": "", "vs": [[29, "غير أن موسى قال له: «هل ملأتك غيرة علي؟ ليت كل شعب الرب يصبحون أنبياء يحل عليهم الرب بروحه»."]]}, {"l": "Psa 37:1", "n": "", "vs": [[1, "لا يقلقك أمر الأشرار، ولا تحسد فاعلي الإثم،"]]}, {"l": "Psa 106:16", "n": "", "vs": [[16, "ثم حسدوا موسى في المخيم، وأيضا هارون المقدس للرب."]]}, {"l": "Pro 21:10", "n": "", "vs": [[10, "نفس المنافق تشتهي الشر، وقريبه لا يحظى برضاه."]]}, {"l": "Ecc 4:4", "n": "", "vs": [[4, "وأدركت أيضا أن كل تعب الإنسان ومنجزاته، ناتجة عن حسده لقريبه. هذا أيضا باطل كملاحقة الريح."]]}, {"l": "Isa 11:13", "n": "", "vs": [[13, "فيتلاشى حسد أفرايم، وتزول عداوة يهوذا، فلا أفرايم يحسد يهوذا، ولا يهوذا يعادي أفرايم،"]]}, {"l": "Act 7:9", "n": "", "vs": [[9, "وحسد الآباء الأولون يوسف وباعوه، فأصبح عبدا في مصر. ولكن الله كان معه،"]]}, {"l": "Rom 1:29", "n": "", "vs": [[29, "إذ قد امتلأوا من كل إثم وشر وجشع وخبث، وشحنوا حسدا وقتلا وخصاما ومكرا وسوءا. وهم ثرثارون،"]]}, {"l": "Tit 3:3", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."]]}], "kwAr": "الروح الذي حل في داخلنا", "noteAr": ""}, {"kw": "to envy", "raw": "or, enviously", "note": "or, enviously", "refs": [], "kwAr": "يغار عن حسد", "noteAr": "أو: بحسد."}], "arS": [["أتظنون", ["G1380"]], [" ", []], ["أن", ["G3754"]], [" ", []], ["الكتاب", ["G1124"]], [" ", []], ["يتكلم", ["G3004"]], [" ", []], ["عبثا", ["G2761"]], ["! هل ", []], ["الروح", ["G4151"]], [" الذي ", []], ["حل", ["G2730"]], [" في ", []], ["داخلنا", ["G2254"]], [" ", []], ["يغار", ["G1971"]], [" عن ", []], ["حسد", ["G5355"]], ["؟", []]]}, {"c": 4, "v": 6, "text": "لا، بل إنه يجود علينا بنعمة أعظم. لذلك يقول الكتاب: «إن الله يقاوم المتكبرين، ولكنه يعطي المتواضعين نعمة».", "groups": [{"kw": "God", "raw": "Exo_10:3, Exo_10:4, Exo_15:9, Exo_15:10, Exo_18:11; 1Sa_2:3; Job_22:29, Job_40:10-12; Psa_138:6; Pro_3:34, Pro_6:16, Pro_6:17, Pro_29:23; Isa_2:11, Isa_2:12, Isa_2:17, Isa_10:8-14, Isa_16:6, Isa_16:7; Dan_4:37; Dan_5:20-23; Mat_23:12; Luk_1:52, Luk_14:11, Luk_18:14; 1Pe_5:5", "note": "", "refs": [{"l": "Exo 10:3", "n": "", "vs": [[3, "فمثل موسى وهرون أمام فرعون وقالا له: «هذا ما يعلنه الرب إله العبرانيين: إلى متى تأبى أن تخضع لي؟ أطلق شعبي ليعبدني."]]}, {"l": "Exo 10:4", "n": "", "vs": [[4, "وإذا أبيت أن تطلق سراح شعبي، فها أنا أجلب غدا الجراد على تخومك،"]]}, {"l": "Exo 15:9", "n": "", "vs": [[9, "قال العدو: أسعى وراءهم فأدركهم. أقسم أسلابهم وتشتفي منهم نفسي. أستل سيفي بيدي وأهلكهم."]]}, {"l": "Exo 15:10", "n": "", "vs": [[10, "لكنك أطلقت ريحك فغشيهم البحر، فغرقوا كالرصاص في اللجج العميقة"]]}, {"l": "Exo 18:11", "n": "", "vs": [[11, "الآن أعلم أن الرب هو أعظم من جميع الآلهة، لأنه عاملهم بمثل ما بغوا به»."]]}, {"l": "1Sa 2:3", "n": "", "vs": [[3, "كفوا عن الكبرياء، وكموا أفواهكم عن الغرور لأن الرب إله عليم وبه توزن الأعمال."]]}, {"l": "Job 22:29", "n": "", "vs": [[29, "حقا إن الله يذل المتكبرين وينقذ المتواضعين،"]]}, {"l": "Job 40:10-12", "n": "", "vs": [[10, "إذا تسربل بالجلال والعظمة، وتزين بالمجد والبهاء."], [11, "صب فيض غضبك، وانظر إلى كل متكبر واخفضه."], [12, "انظر إلى كل متعظم وذلله، ودس الأشرار في مواضعهم."]]}, {"l": "Psa 138:6", "n": "", "vs": [[6, "فمع تعاليك، تلتفت إلى المتواضعين، أما المتكبر فتعرفه من بعيد."]]}, {"l": "Pro 3:34", "n": "", "vs": [[34, "يسخر من المستكبرين الساخرين، ويغدق رضاه على المتواضعين"]]}, {"l": "Pro 6:16", "n": "", "vs": [[16, "ستة أمور يمقتها الرب، وسبعة مكروهة لديه:"]]}, {"l": "Pro 6:17", "n": "", "vs": [[17, "عينان متعجرفتان، ولسان كاذب، ويدان تسفكان دما بريئا."]]}, {"l": "Pro 29:23", "n": "", "vs": [[23, "كبرياء الإنسان تحط من قدره، والمتواضع الروح يحرز كرامة."]]}, {"l": "Isa 2:11", "n": "", "vs": [[11, "فعيون البشر المتشامخة تخفض، وكبرياؤهم تذل، ويتعظم الرب وحده في ذلك اليوم."]]}, {"l": "Isa 2:12", "n": "", "vs": [[12, "فإن للرب القدير يوما فيه يوضع كل متعظم ومتكبر ومتغطرس."]]}, {"l": "Isa 2:17", "n": "", "vs": [[17, "فيعتري الهوان غطرسة كل إنسان، ويذل تشامخ البشر، ويتعظم الرب وحده في ذلك اليوم،"]]}, {"l": "Isa 10:8-14", "n": "", "vs": [[8, "لأنه يقول: أليس كل قوادي ملوكا؟"], [9, "أليس مصير كلنو كمصير كركميش؟ أو ليس مآل حماة كمآل أرفاد؟ أليست السامرة كدمشق؟"], [10, "لقد قضيت على ممالك وثنية أصنامها أعظم من أصنام أورشليم والسامرة!"], [11, "أفلا أقضي على أورشليم وأصنامها كما قضيت على السامرة وأصنامها؟"], [12, "ولكن حالما ينتهي الرب من عمله بجبل صهيون، فإنه سيعاقب ملك أشور على غرور قلبه وتشامخ عينيه،"], [13, "لأنه يقول: بقوة ذراعي قد صنعت هذا، وبحكمتي، لأنني فهيم! قد نقلت تخوم الأمم، ونهبت كنوزهم، وعزلت الجالسين على العروش كما يفعل ذو البطش."], [14, "وكما تستحوذ يد الإنسان على العش، هكذا استحوذت يدي على ثروات الشعوب. وكما يجمع الإنسان البيض المهجور، هكذا جمعت الأرض بأسرها، فلم يجرؤ أحد أن يحرك جناحا أو يفتح فاها أو ينبس بهمسة."]]}, {"l": "Isa 16:6", "n": "", "vs": [[6, "قد سمعنا بكبرياء موآب، وبعجرفتها وغطرستها الطاغيتين، وبغرورها وصلفها، ولكن كل افتخارها باطل."]]}, {"l": "Isa 16:7", "n": "", "vs": [[7, "لذلك يولول الموآبيون على موآب، ويئنون على قير حارس المدمرة."]]}, {"l": "Dan 4:37", "n": "", "vs": [[37, "فالآن، أنا نبوخذناصر، أسبح وأمجد وأحمد ملك السماء الذي جميع أعماله حق، وطرقه عادلة وقادر على إذلال كل من يسلك بالكبرياء."]]}, {"l": "Dan 5:20-23", "n": "", "vs": [[20, "وعندما شمخ قلبه وقست روحه تعنتا، عزل عن عرش ملكه وجرد من جلاله،"], [21, "وطرد من بين الناس، وماثل عقله الحيوانات، وصار مأواه مع الحمير الوحشية، فأطعموه العشب كالثيران، وابتل جسمه بندى السماء، حتى علم أن الله العلي هو المتسلط في مملكة الناس، وأنه يولي عليها من يشاء."], [22, "وأنت يابيلشاصر ابنه لم يتواضع قلبك، مع علمك بكل هذا،"], [23, "بل تغطرست على رب السماء، فأحضروا أمامك آنية هيكله لتشرب بها الخمر، أنت ونبَلاء دولتك وزوجاتك ومحظياتك، وسبحت آلهة الفضة والذهب والنحاس والحديد والخشب والحجر التي لا تبصر ولا تسمع ولا تدرك، أما الله الذي بيده روحك وله كل طرقك، فلم تمجده."]]}, {"l": "Mat 23:12", "n": "", "vs": [[12, "فإن كل من يرفع نفسه يوضع، ومن يضع نفسه يرفع."]]}, {"l": "Luk 1:52", "n": "", "vs": [[52, "أنزل المقتدرين عن عروشهم، ورفع المتواضعين."]]}, {"l": "Luk 14:11", "n": "", "vs": [[11, "فإن كل من يرفع نفسه يوضع، ومن يضع نفسه يرفع»."]]}, {"l": "Luk 18:14", "n": "", "vs": [[14, "أقول لكم: إن هذا الإنسان نزل إلى بيته مبررا، بعكس الآخر. فإن كل من يرفع نفسه يوضع؛ ومن يضع نفسه يرفع»."]]}, {"l": "1Pe 5:5", "n": "", "vs": [[5, "كذلك، أيها الشباب، اخضعوا للشيوخ. البسوا جميعا ثوب التواضع في معاملتكم بعضكم لبعض. لأن الله يقاوم المتكبرين، ولكنه يعطي المتواضعين نعمة."]]}], "kwAr": "الله يقاوم المتكبرين", "noteAr": ""}, {"kw": "giveth grace", "raw": "2Ch_32:26, 2Ch_33:12, 2Ch_33:19, 2Ch_33:23, 2Ch_34:27; Job_22:29; Psa_9:12; Pro_15:33, Pro_18:12; Pro_22:4; Isa_57:15", "note": "", "refs": [{"l": "2Ch 32:26", "n": "", "vs": [[26, "ثم اتضع حزقيا بعد كبريائه، هو وأهل أورشليم، فلم يحل بهم غضب الرب في أيام حزقيا."]]}, {"l": "2Ch 33:12", "n": "", "vs": [[12, "وفي ضيقه استغاث بالرب إلهه وتذلل جدا أمام إله آبائه،"]]}, {"l": "2Ch 33:19", "n": "", "vs": [[19, "كما أن صلاته واستجابة الرب له، وسائر خطاياه وخيانته، والأماكن التي شيد فيها المرتفعات ونصب فيها تماثيل عشتاروث، والأصنام التي أقامها قبل تذلله فهي مدونة في أخبار الأنبياء."]]}, {"l": "2Ch 33:23", "n": "", "vs": [[23, "إلا أنه لم يتذلل أمام الرب كما تذلل أبوه منسى، بل ازداد شرا."]]}, {"l": "2Ch 34:27", "n": "", "vs": [[27, "من حيث أن قلبك قد رق، وتذللت أمام الله لدى سماعك ما قضت به الشريعة على هذا الموضع وعلى أهله، وتواضعت أمامي ومزقت ثيابك وبكيت في حضرتي، فإنني قد استجبت لك أنا أيضا، يقول الرب."]]}, {"l": "Job 22:29", "n": "", "vs": [[29, "حقا إن الله يذل المتكبرين وينقذ المتواضعين،"]]}, {"l": "Psa 9:12", "n": "", "vs": [[12, "فهو الذي يثأر للدماء. لا ينسى ولا يتجاهل صراخ المتضايقين."]]}, {"l": "Pro 15:33", "n": "", "vs": [[33, "تقوى الرب تأديب حكمة، وقبل الحظوة بالكرامة يكون التواضع."]]}, {"l": "Pro 18:12", "n": "", "vs": [[12, "قبل الانكسار تشامخ القلب، وقبل الكرامة التواضع."]]}, {"l": "Pro 22:4", "n": "", "vs": [[4, "ثواب التواضع وتقوى الرب هو الغنى والكرامة والحياة."]]}, {"l": "Isa 57:15", "n": "", "vs": [[15, "لأنه هكذا يقول العلي السامي، المقيم في الأبد، الذي يدعى اسمه القدوس: إنني أسكن في العلى وفي الموضع المقدس، وأقيم مع المنسحق، وذوي الروح المتواضعة، لأحيي أرواح المتواضعين، وأنعش قلوب المنسحقين."]]}], "kwAr": "يعطي المتواضعين نعمة", "noteAr": ""}], "arS": [["لا، بل إنه ", []], ["يجود", ["G1325"]], [" علينا ", []], ["بنعمة", ["G5485"]], [" ", []], ["أعظم", ["G3187"]], [". ", []], ["لذلك", ["G1352"]], [" ", []], ["يقول", ["G3004"]], [" الكتاب: «إن ", []], ["الله", ["G2316"]], [" ", []], ["يقاوم", ["G498"]], [" ", []], ["المتكبرين", ["G5244"]], ["، ولكنه ", []], ["يعطي", ["G1325"]], [" ", []], ["المتواضعين", ["G5011"]], [" ", []], ["نعمة", ["G5485"]], ["».", []]]}, {"c": 4, "v": 7, "text": "إذن، كونوا خاضعين لله. وقاوموا إبليس فيهرب منكم.", "groups": [{"kw": "Submit", "raw": "1Sa_3:18; 2Sa_15:26; 2Ki_1:13-15; 2Ch_30:8, 2Ch_33:12, 2Ch_33:13; Job_1:21; Job_40:3-5, Job_42:1-6; Psa_32:3-5, Psa_66:3, Psa_68:30; Jer_13:18; Dan_4:25, Dan_4:32, Dan_4:34-37; Mat_11:29; Act_9:6, Act_16:29-31, Act_26:19; Rom_10:3, Rom_14:11; Eph_5:21; Heb_12:9; 1Pe_2:13", "note": "", "refs": [{"l": "1Sa 3:18", "n": "", "vs": [[18, "فأطلعه صموئيل على جميع الكلام، ولم يخف عنه شيئا. فقال عالي: «إنه الرب، وهو يفعل ما يشاء»."]]}, {"l": "2Sa 15:26", "n": "", "vs": [[26, "وإن لم أستحوذ على رضاه وقال: «إني لم أسر بك، فليفعل بي ما يطيب له»."]]}, {"l": "2Ki 1:13-15", "n": "", "vs": [[13, "ثم أرسل أخزيا للمرة الثالثة قائدا آخر على رأس خمسين جنديا. فأقبل هذا إلى إيليا وجثا أمامه وتوسل إليه قائلا: «يارجل الله، لتكن نفسي ونفوس عبيدك هؤلاء عزيزة في عينيك."], [14, "لقد نزلت نار من السماء التهمت القائدين السابقين مع رجالهما المئة، فأرجوك لتكن نفسي عزيزة في عينيك (ولا تقض علينا(»."], [15, "فقال ملاك الرب لإيليا: «امض معه ولا تخف منه». فقام وانطلق معه لمقابلة الملك."]]}, {"l": "2Ch 30:8", "n": "", "vs": [[8, "ولا تعاندوا الآن كآبائكم، بل أذعنوا للرب وادخلوا إلى مقدسه الذي قدسه إلى الأبد، واعبدوا الرب إلهكم فيتحول عنكم غضبه اللاهب."]]}, {"l": "2Ch 33:12", "n": "", "vs": [[12, "وفي ضيقه استغاث بالرب إلهه وتذلل جدا أمام إله آبائه،"]]}, {"l": "2Ch 33:13", "n": "", "vs": [[13, "وابتهل إليه فاستجاب له، وسمع تضرعه ورده إلى أورشليم وإلى مملكته. فعلم منسى أن الرب هو الله ."]]}, {"l": "Job 1:21", "n": "", "vs": [[21, "وقال: «عريانا خرجت من بطن أمي وعريانا أعود إلى هناك. الرب أعطى والرب أخذ، فليكن اسم الرب مباركا»."]]}, {"l": "Job 40:3-5", "n": "", "vs": [[3, "عندئذ أجاب أيوب الرب:"], [4, "«انظر، أنا حقير فبماذا أجيبك؟ ها أنا أضع يدي على فمي"], [5, "لقد تكلمت مرة ولن أجيب، ومرتين ولن أضيف»."]]}, {"l": "Job 42:1-6", "n": "", "vs": [[1, "فقال أيوب للرب:"], [2, "«قد أدركت أنك تستطيع كل شيء ولا يتعذر عليك أمر."], [3, "تسألني: من ذا الذي يخفي المشورة من غير معرفة؟ حقا قد نطقت بأمور لم أفهمها، بعجائب تفوق إدراكي."], [4, "اسمع الآن وأنا أتكلم، أسألك وأنت تعلمني."], [5, "بسمع الأذن قد سمعت عنك والآن رأتك عيني،"], [6, "لذلك ألوم نفسي وأتوب معفرا ذاتي بالتراب والرماد»."]]}, {"l": "Psa 32:3-5", "n": "", "vs": [[3, "حين سكت عن الاعتراف بالذنب بليت عظامي في تأوهي النهار كله،"], [4, "فقد كانت يدك ثقيلة الوطأة علي نهارا وليلا، حتى تحولت نضارتي إلى جفاف حر الصيف"], [5, "أعترف لك بخطيئتي، ولا أكتم إثمي. قلت: أعترف للرب بمعاصي، حقا صفحت عن إثم خطيئتي"]]}, {"l": "Psa 66:3", "n": "", "vs": [[3, "قولوا لله: «ما أروع أعمالك». يتملقك أعداؤك لأن قوتك عظيمة."]]}, {"l": "Psa 68:30", "n": "", "vs": [[30, "انتهر مصر، الوحش الكامن بين القصب. انتهر الأمم القوية التي تشبه قطيع الثيران؛ حتى يخضعوا ويدفعوا لك جزية فضة. بدد الشعوب المولعة بالحرب."]]}, {"l": "Jer 13:18", "n": "", "vs": [[18, "قل للملك وللملكة: «تواضعا، وتنازلا عن موضعكما لأن تاج مجدكما قد سقط عن رأسيكما»."]]}, {"l": "Dan 4:25", "n": "", "vs": [[25, "سيطردونك من بين الناس فتأوي مع حيوان الصحراء، يطعمونك العشب كالثيران، وتبتل بندى السماء، إلى أن تنقضي عليك سبعة أزمنة، حتى تعلم أن العلي متسلط في مملكة الناس يهبها من يشاء."]]}, {"l": "Dan 4:32", "n": "", "vs": [[32, "ثم يطردونك من بين الناس فتأوي مع حيوان الصحراء، ويطعمونك العشب كالثيران إلى أن تنقضي عليك سبعة أزمنة، حتى تعلم أن العلي متسلط في مملكة الناس يهبها لمن يشاء»."]]}, {"l": "Dan 4:34-37", "n": "", "vs": [[34, "وفي ختام السبعة الأزمنة، أنا نبوخذناصر، التفت نحو السماء، فرجع إلي عقلي، وباركت العلي وسبحت وحمدت الحي الأبدي ذا السلطان السرمدي، والذي ملكه على مدى الأجيال."], [35, "وعرفت أن كل أهل الأرض لا يحسبون شيئا، وأنه يفعل ما يشاء في جند السماء وسكان الأرض، وليس من يكف يده أو يقول له: ماذا تفعل؟"], [36, "في ذلك الحين ثاب إلي عقلي، وعاد إلي جلال مملكتي ومجدي وبهائي، وطلبني مشيري ونبلاء دولتي، وتثبت على عرش مملكتي وازدادت عظمتي جدا."], [37, "فالآن، أنا نبوخذناصر، أسبح وأمجد وأحمد ملك السماء الذي جميع أعماله حق، وطرقه عادلة وقادر على إذلال كل من يسلك بالكبرياء."]]}, {"l": "Mat 11:29", "n": "", "vs": [[29, "احملوا نيري عليكم، وتتلمذوا على يدي، لأني وديع ومتواضع القلب، فتجدوا الراحة لنفوسكم."]]}, {"l": "Act 9:6", "n": "", "vs": [[6, "فقال وهو مرتعد ومتحير؛ «يارب ماذا تريد أن أفعل؟» فقال له الرب: «قم، وادخل المدينة فيقال لك ما يجب أن تفعله»."]]}, {"l": "Act 16:29-31", "n": "", "vs": [[29, "فطلب ضوءا، واندفع إلى الداخل وهو يرتجف خوفا، وارتمى أمام بولس وسيلا،"], [30, "ثم أخرجهما خارجا وسألهما: «ياسيدي، ماذا ينبغي أن أفعل لكي أخلص؟»"], [31, "فأجاباه: «آمن بالرب يسوع فتخلص أنت وأهل بيتك!»"]]}, {"l": "Act 26:19", "n": "", "vs": [[19, "ومن ذلك الحين لم أعاند الرؤيا السماوية، أيها الملك أغريباس."]]}, {"l": "Rom 10:3", "n": "", "vs": [[3, "فبما أنهم جهلوا بر الله وسعوا إلى إثبات برهم الذاتي، لم يخضعوا للبر الإلهي."]]}, {"l": "Rom 14:11", "n": "", "vs": [[11, "فإنه قد كتب: «أنا حي، يقول الرب، لي ستنحني كل ركبة، وسيعترف كل لسان لله!»"]]}, {"l": "Eph 5:21", "n": "", "vs": [[21, "خاضعين بعضكم لبعض في مخافة المسيح."]]}, {"l": "Heb 12:9", "n": "", "vs": [[9, "إن آباءنا الأرضيين كانوا يؤدبوننا ونحن أولاد، وكنا نحترمهم. أفلا يجدر بنا الآن أن نخضع خضوعا تاما لتأديب أبي الأرواح، لنحيا حياة فضلى؟"]]}, {"l": "1Pe 2:13", "n": "", "vs": [[13, "فإكراما للرب، اخضعوا لكل نظام يدير شؤون الناس: للملك، باعتباره صاحب السلطة العليا،"]]}], "kwAr": "كونوا خاضعين لله", "noteAr": ""}, {"kw": "Resist", "raw": "Mat_4:3-11; Luk_4:2-13; Eph_4:27, Eph_6:11, Eph_6:12; 1Pe_5:8, 1Pe_5:9; Rev_12:9-11", "note": "", "refs": [{"l": "Mat 4:3-11", "n": "", "vs": [[3, "فتقدم إليه المجرب وقال له: «إن كنت ابن الله، فقل لهذه الحجارة أن تتحول إلى خبز!»"], [4, "فأجابه قائلا: «قد كتب: ليس بالخبز وحده يحيا الإنسان، بل بكل كلمة تخرج من فم الله!»"], [5, "ثم أخذه إبليس إلى المدينة المقدسة، وأوقفه على حافة سطح الهيكل،"], [6, "وقال له: «إن كنت ابن الله، فاطرح نفسك إلى أسفل، لأنه قد كتب: يوصي ملائكته بك، فيحملونك على أيديهم لكي لا تصدم قدمك بحجر!»"], [7, "فقال له يسوع: «وقد كتب أيضا: لا تجرب الرب إلهك! »"], [8, "ثم أخذه إبليس أيضا إلى قمة جبل عال جدا، وأراه جميع ممالك العالم وعظمتها،"], [9, "وقال له: «أعطيك هذه كلها إن جثوت وسجدت لي!»"], [10, "فقال له يسوع: «اذهب ياشيطان! فقد كتب: للرب إلهك تسجد، وإياه وحده تعبد! »"], [11, "فتركه إبليس، وإذا بعض الملائكة جاءوا إليه وأخذوا يخدمونه."]]}, {"l": "Luk 4:2-13", "n": "", "vs": [[2, "أربعين يوما، وإبليس يجربه، ولم يأكل شيئا طوال تلك الأيام. فلما تمت، جاع."], [3, "فقال له إبليس: «إن كنت ابن الله، فقل لهذا الحجر أن يتحول إلى خبز»."], [4, "فرد عليه يسوع قائلا: «قد كتب: ليس بالخبز وحده يحيا الإنسان، بل بكل كلمة من الله!»"], [5, "ثم أصعده إبليس إلى جبل عال، وأراه ممالك العالم كلها في لحظة من الزمن،"], [6, "وقال له: «أعطيك السلطة على هذه الممالك كلها وما فيها من عظمة، فإنها قد سلمت إلى وأنا أعطيها لمن أشاء."], [7, "فإن سجدت أمامي، تصير كلها لك!»"], [8, "فر د عليه يسوع قائلا: «قد كتب: للرب إلهك تسجد، وإياه وحده تعبد!»"], [9, "ثم اقتاده إبليس إلى أورشليم، وأوقفه على حافة سطح الهيكل، وقال له: «إن كنت ابن الله، فاطرح نفسك من هنا إلى الأسفل"], [10, "فإنه قد كتب: يوصي ملائكته بك لكي يحفظوك،"], [11, "فعلى أيديهم يحملونك، لئلا تصدم قدمك بحجر»."], [12, "فرد عليه يسوع قائلا: «قد قيل: لا تجرب الرب إلهك!»"], [13, "وبعدما أكمل إبليس كل تجربة، انصرف عن يسوع إلى أن يحين الوقت."]]}, {"l": "Eph 4:27", "n": "", "vs": [[27, "ولا تتيحوا فرصة لإبليس!"]]}, {"l": "Eph 6:11", "n": "", "vs": [[11, "البسوا سلاح الله الكامل، لتتمكنوا من الصمود في وجه مكايد إبليس."]]}, {"l": "Eph 6:12", "n": "", "vs": [[12, "فإن حربنا ليست ضد ذوي اللحم والدم، بل ضد الرئاسات، ضد السلطات، ضد أسياد العالم حكام هذا الظلام، ضد قوى الشر الروحية في الأماكن السماوية."]]}, {"l": "1Pe 5:8", "n": "", "vs": [[8, "تعقلوا وتنبهوا. إن خصمكم إبليس كأسد يزأر، يجول باحثا عن فريسة يبتلعها."]]}, {"l": "1Pe 5:9", "n": "", "vs": [[9, "فقاوموه، ثابتين في الإيمان. واذكروا أن إخوتكم المنتشرين في العالم يجتازون وسط هذه الآلام عينها."]]}, {"l": "Rev 12:9-11", "n": "", "vs": [[9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."], [10, "ثم سمعت صوتا عاليا في السماء يقول: «الآن تم خلاص إلهنا، وآلت القدرة والملك إليه والسلطان إلى مسيحه! فإنه قد طرح من السماء إلى الأرض المشتكي الذي يتهم إخوتنا أمام إلهنا لي  الأغنياء، هيا الآن ابكوا مولولين بسبب ما ينتظركم من أهوال وشقاء."]]}, {"l": "Jam 5:2", "n": "", "vs": [[2, "إن ثرواتكم الكثيرة قد فسدت، وثيابكم الفاخرة قد أكلها العث"]]}, {"l": "Psa 119:67", "n": "", "vs": [[67, "ضللت قبل أن أدبتني، أما الآن فحفظت كلامك."]]}, {"l": "Psa 119:71", "n": "", "vs": [[71, "كان ما ذقت من هوان لخيري فتعلمت فرائضك."]]}, {"l": "Psa 119:136", "n": "", "vs": [[136, "فاضت من عيني ينابيع دمع، لأنهم لم يراعوا شريعتك."]]}, {"l": "Psa 126:5", "n": "", "vs": [[5, "فمن يزرع بالدموع يحصد غلاته بالابتهاج."]]}, {"l": "Psa 126:6", "n": "", "vs": [[6, "ومن يذهب باكيا حاملا بذاره يرجع مترنما حاملا حزم حصيده."]]}, {"l": "Ecc 7:2-5", "n": "", "vs": [[2, "الذهاب إلى بيت النوح خير من الحضور إلى بيت الوليمة، لأن الموت هو مصير كل إنسان. وهذا ما يحتفظ به الحي في قلبه."], [3, "الحزن خير من الضحك، لأنه بكآبة الوجه يصلح القلب."], [4, "قلب الحكماء في بيت النوح، أما قلوب الجهال ففي بيت اللذة."], [5, "الاستماع إلى زجر الحكيم خير من الإصغاء إلى غناء الجهال."]]}, {"l": "Isa 22:12", "n": "", "vs": [[12, "في ذلك اليوم يدعوكم السيد الرب القدير للبكاء والنوح وحلق الشعر والتنطق بالمسوح."]]}, {"l": "Isa 22:13", "n": "", "vs": [[13, "ولكنكم انهمكتم بالفرح والسرور وذبح الثيران وتضحية الغنم وأكل اللحم وشرب الخمر قائلين: «لنأكل ونشرب لأننا غدا نموت»."]]}, {"l": "Jer 31:9", "n": "", "vs": [[9, "سيرجعون بنوح، وبتضرعات أهديهم. إلى جوار جداول المياه أسيرهم فيمشون في طريق مستقيمة لا يعثرون فيها، لأني أب لإسرائيل، وأفرايم بكري»."]]}, {"l": "Jer 31:13", "n": "", "vs": [[13, "حينئذ تبتهج العذارى بالرقص، ويطر ب الشيوخ والشبان على حد سواء. أحول نوحهم إلى سرور وأستبدل حزنهم بالفرح والطمأنينة."]]}, {"l": "Jer 31:18-20", "n": "", "vs": [[18, "قد سمعت أفرايم ينتحب قائلا: أدبتني فتأدبت كعجل غير مروض. أرجعني فأرجع لأنك أنت الرب إلهي."], [19, "فقد تبت بعد أن غويت، وبعد أن تعلمت صفقت على فخذي ندما. خجلت وخزيت لأني حملت عار حداثتي."], [20, "هل أفرايم ابن أثير لدي؟ أليس هو ابنا مسرا؟ لأني مع كثرة تنديدي به فإني مازلت أذكره، لذلك يشتاق قلبي إليه، وأكن له الرحمة»، يقول الرب."]]}, {"l": "Eze 7:16", "n": "", "vs": [[16, "أما الناجون منهم فيلوذون بالجبال كحمام الأودية، يبكي كل واحد منهم على إثمه."]]}, {"l": "Eze 16:63", "n": "", "vs": [[63, "لكي تتذكري فتخجلي ولا تفتحي فمك من بعد بسبب خزيك، حين أغفر لك كل ما ارتكبت من شر يقول السيد الرب»."]]}, {"l": "Zec 12:10-14", "n": "", "vs": [[10, "وأفيض على ذرية داود وعلى سكان أورشليم روح النعمة والابتهال، حتى إذا نظروا إلي أنا الذي طعنوه ينوحون عليه كما ينوح والد على ولده الوحيد، متفجعين عليه كتفجعهم على موت بكرهم."], [11, "في ذلك اليوم يكون النواح في أورشليم مماثلا للنواح في هددرمون في سهل مجدو (حيث قتل الملك يوشيا)."], [12, "فيشيع النحيب بين أهل البلاد، فتنوح كل عشيرة على حدة، فيبكي رجال عشيرة داود منفردين عن النساء، والنساء عن الرجال، ورجال عشيرة ذرية ناثان منفردين عن النساء، والنساء عن الرجال."], [13, "وكذلك ينوح رجال ونساء عشيرة لاوي كل على حدة، ورجال ونساء عشيرة شمعي كل على حدة."], [14, "وأيضا ينوح رجال ونساء سائر العشائر الباقية كل على حدة»."]]}, {"l": "Mat 5:4", "n": "", "vs": [[4, "طوبى للحزانى، فإنهم سيعزون."]]}, {"l": "Luk 6:21", "n": "", "vs": [[21, "طوبى لكم أيها الجائعون الآن، فإنكم سوف تشبعون. طوبى لكم أيها الباكون الآن، فإنكم سوف تضحكون."]]}, {"l": "2Co 7:10", "n": "", "vs": [[10, "فإن الحزن الذي يوافق مشيئة الله ينتج توبة تؤدي إلى الخلاص، وليس عليه ندم. وأما حزن العالم فينتج موتا."]]}, {"l": "2Co 7:11", "n": "", "vs": [[11, "فانظروا، إذن، هذا الحزن عينه الذي يوافق الله ، كم أنتج فيكم من الاجتهاد، بل من الاعتذار، بل من الاستنكار، بل من الخوف، بل من التشوق، بل من الغيرة، بل من الانتقام! وقد بينتم في كل شيء أنكم أبرياء من ذلك الأمر."]]}], "kwAr": "احزنوا مولولين", "noteAr": ""}, {"kw": "let", "raw": "Job_30:31; Pro_14:13; Ecc_2:2, Ecc_7:6; Lam_5:15; Luk_6:25, Luk_16:25; Rev_18:7, Rev_18:8", "note": "", "refs": [{"l": "Job 30:31", "n": "", "vs": [[31, "صارت قيثارتي للنوح، ومزماري لصوت النادبين."]]}, {"l": "Pro 14:13", "n": "", "vs": [[13, "في الضحك أيضا تطغى الكآبة على القلب، وعاقبة الفرح الغم."]]}, {"l": "Ecc 2:2", "n": "", "vs": [[2, "قلت عن الضحك: هذا جنون، وعن اللذة ما جدواها."]]}, {"l": "Ecc 7:6", "n": "", "
