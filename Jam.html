<script>window.CATALOG=[{"id": 26, "abbr": "Eze", "en": "Ezekiel", "nc": 5, "nv": 99, "refs": 1290, "last": "5:17", "first": "وحدث في اليوم الخامس من الشهر الرابع العبري، في السنة الثلاثين، فيما كنت بين المسبيين بجوار نهر خابور، أن انفتحت السماوات فشاهدت رؤى من عند الله."}, {"id": 27, "abbr": "Dan", "en": "Daniel", "nc": 12, "nv": 357, "refs": 5235, "last": "12:13", "first": "في السنة الثالثة من حكم يهوياقيم ملك يهوذا، زحف نبوخذناصر ملك بابل على أورشليم وحاصرها."}, {"id": 28, "abbr": "Hos", "en": "Hosea", "nc": 14, "nv": 197, "refs": 3572, "last": "14:9", "first": "هذه هي كلمة الرب التي أوحى بها إلى هوشع بن بئيري في أثناء حكم كل من عزيا ويوثام وآحاز وحزقيا ملوك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل."}, {"id": 29, "abbr": "Joe", "en": "Joel", "nc": 3, "nv": 73, "refs": 1149, "last": "3:21", "first": "هذا ما أوحى به الرب إلى يوئيل بن فثوئيل:"}, {"id": 30, "abbr": "Amo", "en": "Amos", "nc": 9, "nv": 146, "refs": 2282, "last": "9:15", "first": "هذه كلمات عاموس الذي كان راعيا من رعاة تقوع، ينبيء فيها بما رآه بشأن إسرائيل في أيام عزيا ملك يهوذا، وفي أيام يربعام بن يوآش ملك إسرائيل، قبل وقوع الزلزلة بسنتين."}, {"id": 31, "abbr": "Oba", "en": "Obadiah", "nc": 1, "nv": 21, "refs": 364, "last": "1:21", "first": "هذه نبوءة عوبديا: هذا ما يقوله السيد الرب بشأن أدوم: قد بلغنا خبر من عند الرب أنه أرسل رسولا إلى الأمم قائلا: «تأهبوا، ولننهض لمحاربة أدوم»."}, {"id": 32, "abbr": "Jon", "en": "Jonah", "nc": 4, "nv": 48, "refs": 608, "last": "4:11", "first": "وأمر الرب يونان بن أمتاي:"}, {"id": 33, "abbr": "Mic", "en": "Micah", "nc": 7, "nv": 105, "refs": 2194, "last": "7:20", "first": "هذه كلمة الرب التي أوحى بها إلى ميخا المورشتي في أثناء حكم يوثام وآحاز وحزقيا ملوك يهوذا، بشأن السامرة وأورشليم."}, {"id": 34, "abbr": "Nah", "en": "Nahum", "nc": 3, "nv": 47, "refs": 625, "last": "3:19", "first": "وحي بشأن نينوى، كما ورد في كتاب رؤيا ناحوم الألقوشي."}, {"id": 35, "abbr": "Hab", "en": "Habakkuk", "nc": 3, "nv": 56, "refs": 1031, "last": "3:19", "first": "هذه رؤيا حبقوق النبي:"}, {"id": 36, "abbr": "Zep", "en": "Zephaniah", "nc": 3, "nv": 53, "refs": 1147, "last": "3:20", "first": "هذه كلمة الرب التي أوحى بها إلى صفنيا بن كوشي بن جدليا بن أمريا بن حزقيا، في عهد حكم يوشيا بن آمون ملك يهوذا."}, {"id": 37, "abbr": "Hag", "en": "Haggai", "nc": 2, "nv": 38, "refs": 534, "last": "2:23", "first": "في السنة الثانية لحكم داريوس الملك،في اليوم الأول من الشهر السادس (أي شهر آب ; أوغسطس)، بعث الرب بهذه الرسالة على لسان النبي حجي إلى زربابل بن شألتيئيل حاكم يهوذا، وإلى يهوشع بن يهوصادق رئيس الكهنة قائلا:"}, {"id": 38, "abbr": "Zec", "en": "Zechariah", "nc": 14, "nv": 211, "refs": 4253, "last": "14:21", "first": "في الشهر الثامن من السنة الثانية لحكم داريوس أوحى الرب بهذه الكلمة إلى النبي زكريا بن برخيا بن عدو قائلا:"}, {"id": 39, "abbr": "Mal", "en": "Malachi", "nc": 4, "nv": 55, "refs": 1479, "last": "4:6", "first": "هذه كلمة الرب التي أوحى بها بشأن إسرائيل على لسان ملاخي:"}, {"id": 40, "abbr": "Mat", "en": "Matthew", "nc": 28, "nv": 1071, "refs": 15550, "last": "28:20", "first": "هذا سجل نسب يسوع المسيح ابن داود ابن إبراهيم:"}, {"id": 41, "abbr": "Mar", "en": "Mark", "nc": 16, "nv": 678, "refs": 7233, "last": "16:20", "first": "هذه بداية إنجيل يسوع المسيح ابن الله:"}, {"id": 42, "abbr": "Luk", "en": "Luke", "nc": 24, "nv": 1151, "refs": 13849, "last": "24:53", "first": "لما كان كثيرون قد أقدموا على تدوين قصة في الأحداث التي تمت بيننا،"}, {"id": 43, "abbr": "Joh", "en": "John", "nc": 21, "nv": 879, "refs": 12755, "last": "21:25", "first": "في البدء كان الكلمة، والكلمة كان عند الله. وكان الكلمة هو الله ."}, {"id": 44, "abbr": "Act", "en": "Acts", "nc": 28, "nv": 1007, "refs": 14429, "last": "28:31", "first": "رويت لك في كتابي الأول، ياثاوفيلس، جميع أعمال يسوع وتعاليمه، منذ بدء رسالته"}, {"id": 45, "abbr": "Rom", "en": "Romans", "nc": 16, "nv": 433, "refs": 8603, "last": "16:27", "first": "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"}, {"id": 46, "abbr": "1Co", "en": "1 Corinthians", "nc": 16, "nv": 437, "refs": 6287, "last": "16:24", "first": "من بولس، رسول المسيح يسوع، المدعو بمشيئة الله، ومن الأخ سوستانيس،"}, {"id": 47, "abbr": "2Co", "en": "2 Corinthians", "nc": 13, "nv": 257, "refs": 4756, "last": "13:14", "first": "من بولس، رسول المسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس، إلى كنيسة الله في مدينة كورنثوس، وإلى جميع القديسين المقيمين في مقاطعة أخائية كلها."}, {"id": 48, "abbr": "Gal", "en": "Galatians", "nc": 6, "nv": 149, "refs": 2860, "last": "6:18", "first": "من بولس، وهو رسول لا من قبل الناس ولا بسلطة إنسان، بل بسلطة يسوع المسيح والله الآب الذي أقامه من بين الأموات،"}, {"id": 49, "abbr": "Eph", "en": "Ephesians", "nc": 6, "nv": 155, "refs": 3829, "last": "6:24", "first": "من بولس، وهو رسول للمسيح يسوع بمشيئة الله، إلى القديسين الأمناء في المسيح يسوع، المقيمين في أفسس."}, {"id": 50, "abbr": "Phi", "en": "Philippians", "nc": 4, "nv": 104, "refs": 2514, "last": "4:23", "first": "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."}, {"id": 51, "abbr": "Col", "en": "Colossians", "nc": 4, "nv": 95, "refs": 2387, "last": "4:18", "first": "من بولس وهو رسول للمسيح يسوع بمشيئة الله، ومن الأخ تيموثاوس،"}, {"id": 52, "abbr": "1Th", "en": "1 Thessalonians", "nc": 5, "nv": 89, "refs": 2159, "last": "5:28", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله الآب والرب يسوع المسيح. لتكن لكم النعمة والسلام من الله أبينا والرب يسوع المسيح."}, {"id": 53, "abbr": "2Th", "en": "2 Thessalonians", "nc": 3, "nv": 47, "refs": 989, "last": "3:18", "first": "من بولس وسلوانس وتيموثاوس، إلى كنيسة مؤمني تسالونيكي الذين هم في الله أبينا والرب يسوع المسيح."}, {"id": 54, "abbr": "1Ti", "en": "1 Timothy", "nc": 6, "nv": 113, "refs": 2660, "last": "6:21", "first": "من بولس، رسول المسيح يسوع وفقا لأمر الله مخلصنا والمسيح يسوع رجائنا،"}, {"id": 55, "abbr": "2Ti", "en": "2 Timothy", "nc": 4, "nv": 83, "refs": 1890, "last": "4:22", "first": "من بولس، وهو بمشيئة الله رسول للمسيح يسوع في سبيل الوعد بالحياة التي هي في المسيح،"}, {"id": 56, "abbr": "Tit", "en": "Titus", "nc": 3, "nv": 46, "refs": 1021, "last": "3:15", "first": "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"}, {"id": 57, "abbr": "Phm", "en": "Philemon", "nc": 1, "nv": 25, "refs": 233, "last": "1:25", "first": "من بولس، السجين لأجل المسيح يسوع، ومن تيموثاوس الأخ، إلى فليمون الحبيب شريكنا في العمل،"}, {"id": 58, "abbr": "Heb", "en": "Hebrews", "nc": 13, "nv": 303, "refs": 6178, "last": "13:25", "first": "إن الله ، في الأزمنة الماضية، كلم آباءنا بلسان الأنبياء الذين نقلوا إعلانات جزئية بطرق عديدة ومتنوعة."}, {"id": 59, "abbr": "Jam", "en": "James", "nc": 5, "nv": 108, "refs": 2364, "last": "5:20", "first": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!"}, {"id": 60, "abbr": "1Pe", "en": "1 Peter", "nc": 5, "nv": 105, "refs": 2759, "last": "5:14", "first": "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"}, {"id": 61, "abbr": "2Pe", "en": "2 Peter", "nc": 3, "nv": 61, "refs": 1238, "last": "3:18", "first": "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"}, {"id": 62, "abbr": "1Jo", "en": "1 John", "nc": 5, "nv": 105, "refs": 2219, "last": "5:21", "first": "نكتب إليكم عما كان من البداية بخصوص كلمة الحياة: عما سمعناه، ورأيناه بعيوننا، وشاهدناه، ولمسناه بأيدينا."}, {"id": 63, "abbr": "2Jo", "en": "2 John", "nc": 1, "nv": 13, "refs": 168, "last": "1:13", "first": "من يوحنا الشيخ، إلى السيدة التي اختارها الله ، وإلى أولادها الذين أحبهم جميعا بالحق، ولست أنا وحدي أحبهم، بل أيضا جميع الذين عرفوا الحق."}, {"id": 64, "abbr": "3Jo", "en": "3 John", "nc": 1, "nv": 14, "refs": 162, "last": "1:14", "first": "من يوحنا الشيخ إلى غايوس الحبيب الذي أحبه بالحق."}, {"id": 65, "abbr": "Jud", "en": "Jude", "nc": 1, "nv": 25, "refs": 550, "last": "1:25", "first": "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."}, {"id": 66, "abbr": "Rev", "en": "Revelation", "nc": 22, "nv": 404, "refs": 7038, "last": "22:21", "first": "هذه رؤيا أعطاها الله ليسوع المسيح، ليكشف لعبيده عن أمور لابد أن تحدث عن قريب. وأعلنها المسيح لعبده يوحنا عن طريق ملاك أرسله لذلك."}];</script>
<script>window.LIB=[{"id": 59, "abbr": "Jam", "en": "James", "verses": [{"c": 1, "v": 1, "text": "من يعقوب، عبد الله والرب يسوع المسيح، إلى أسباط اليهود الاثني عشر، المشتتين في كل مكان سلام!", "groups": [{"kw": "James", "raw": "Mat_10:3, Mat_13:55; Mar_3:18; Luk_6:15; Act_1:13, Act_12:17, Act_15:13, Act_21:18; Gal_1:19, Gal_2:9, Gal_2:12; Jud_1:1", "note": "", "refs": [{"l": "Mat 10:3", "n": "", "vs": [[3, "فيلبس، وبرثلماوس؛ توما، ومتى جابي الضرائب؛ يعقوب بن حلفى، وتداوس؛"]]}, {"l": "Mat 13:55", "n": "", "vs": [[55, "أليس هو ابن النجار؟ أليست أمه تدعى مريم وإخوته يعقوب ويوسف وسمعان ويهوذا؟"]]}, {"l": "Mar 3:18", "n": "", "vs": [[18, "وأندراوس، وفيلبس، وبرثلماوس، ومتى وتوما، ويعقوب بن حلفى، وتداوس، وسمعان القانوي،"]]}, {"l": "Luk 6:15", "n": "", "vs": [[15, "متى، وتوما؛ يعقوب بن حلفى، وسمعان المعروف بالغيور؛"]]}, {"l": "Act 1:13", "n": "", "vs": [[13, "ولما وصلوا صعدوا إلى غرفة في الطبقة العليا كانوا يقيمون فيها، وهم: بطرس ويوحنا، ويعقوب وأندراوس، وفيلبس وتوما، وبرثلماوس ومتى، ويعقوب بن حلفى وسمعان الغيور، ويهوذا أخو يعقوب."]]}, {"l": "Act 12:17", "n": "", "vs": [[17, "فأشار بيده أن يسكتوا، وحدثهم كيف أخر جه الرب من السجن، وقال: «أخبروا يعقوب والإخوة بهذا». ثم خرج وذهب إلى مكان آخر."]]}, {"l": "Act 15:13", "n": "", "vs": [[13, "وبعد انتهائهما من الكلام، قال يعقوب:"]]}, {"l": "Act 21:18", "n": "", "vs": [[18, "وفي اليوم التالي لوصولنا رافقنا بولس للاجتماع بيعقوب، وكان الشيوخ كلهم مجتمعين عنده."]]}, {"l": "Gal 1:19", "n": "", "vs": [[19, "ولكني لم أقابل غيره من الرسل إلا يعقوب، أخا الرب."]]}, {"l": "Gal 2:9", "n": "", "vs": [[9, "فلما اتضحت النعمة الموهوبة لي عند يعقوب وبطرس ويوحنا، وهم البارزون باعتبارهم أعمدة، مدوا إلي وإلى برنابا أيديهم اليمنى إشارة إلى المشاركة، فنتوجه نحن إلى الأمم وهم إلى أهل الختان،"]]}, {"l": "Gal 2:12", "n": "", "vs": [[12, "إذ قبل أن يأتي بعضهم من عند يعقوب، كان بطرس يأكل مع الإخوة الذين من الأمم؛ ولكن لما أتى أولئك، انسحب وعزل نفسه، خوفا من أهل الختان."]]}, {"l": "Jud 1:1", "n": "", "vs": [[1, "من يهوذا، عبد يسوع المسيح وشقيق يعقوب، إلى الذين دعاهم الله الآب إليه، المحبوبين منه، والمحفوظين من أجل يسوع المسيح."]]}], "kwAr": "يعقوب", "noteAr": ""}, {"kw": "a servant", "raw": "Joh_12:26; Rom_1:1; Phi_1:1; Tit_1:1; 2Pe_1:1", "note": "", "refs": [{"l": "Joh 12:26", "n": "", "vs": [[26, "من أراد أن يخدمني فليتبعني. وحيث أكون أنا يكون خادمي أيضا. وكل من يخدمني يكرمه أبي."]]}, {"l": "Rom 1:1", "n": "", "vs": [[1, "من بولس عبد يسوع المسيح، الرسول المدعو والمفرز لإنجيل الله،"]]}, {"l": "Phi 1:1", "n": "", "vs": [[1, "من بولس وتيموثاوس، عبدي المسيح يسوع، إلى جميع القديسين في المسيح يسوع، المقيمين في مدينة فيلبي، بمن فيهم من رعاة ومدبرين."]]}, {"l": "Tit 1:1", "n": "", "vs": [[1, "من بولس، عبد الله ورسول يسوع المسيح في سبيل إيمان من اختارهم الله ، ومعرفتهم للحق الموافق للتقوى،"]]}, {"l": "2Pe 1:1", "n": "", "vs": [[1, "من سمعان بطرس، عبد يسوع المسيح ورسوله، إلى الذين يشاركوننا في الإيمان الواحد الثمين الذي نتساوى جميعا في الحصول عليه ببر إلهنا ومخلصنا يسوع المسيح!"]]}], "kwAr": "عبد الله", "noteAr": ""}, {"kw": "to", "raw": "Exo_24:4, Exo_28:21, Exo_39:14; 1Ki_18:31; Ezr_6:17; Mat_19:28; Act_26:7; Rev_7:4", "note": "", "refs": [{"l": "Exo 24:4", "n": "", "vs": [[4, "فكتب موسى جميع أقوال الرب، ثم بكر في الصباح وشيد مذبحا على سفح الجبل، ونصب اثني عشر عمودا على عدد أسباط بني إسرائيل الاثني عشر."]]}, {"l": "Exo 28:21", "n": "", "vs": [[21, "وتنقش على كل حجر كريم اسم سبط من أسباط بني إسرائيل الاثني عشر على غرار نقش الخاتم المحفورة عليه أسماء الاثني عشر سبطا."]]}, {"l": "Exo 39:14", "n": "", "vs": [[14, "ونقش على كل حجر من الأحجار الكريمة اسم واحد من أسماء أسباط بني إسرائيل الاثني عشر كما ينقش على الخاتم،"]]}, {"l": "1Ki 18:31", "n": "", "vs": [[31, "ثم أخذ اثني عشر حجرا حسب عدد أسباط إسرائيل، ذرية يعقوب الذي دعاه الله إسرائيل"]]}, {"l": "Ezr 6:17", "n": "", "vs": [[17, "وقربوا احتفالا بتدشين هيكل الله: مئة ثور ومئتي كبش وأربع مئة خروف؛ واثني عشر تيس معزى، لتكون ذبيحة خطيئة عن جميع إسرائيل، بحسب عدد أسباطهم."]]}, {"l": "Mat 19:28", "n": "", "vs": [[28, "فأجابهم يسوع: «الحق أقول لكم: إنه عندما يجلس ابن الإنسان على عرش مجده في زمن التجديد، تجلسون أنتم الذين تبعتموني على اثني عشر عرشا لتدينوا أسباط إسرائيل الاثني عشر."]]}, {"l": "Act 26:7", "n": "", "vs": [[7, "ومازالت أسباط شعبنا الاثنا عشر تواظب على العبادة ليل نهار راجية تحقيقه. من أجل هذا الرجاء يتهمني اليهود، أيها الملك:"]]}, {"l": "Rev 7:4", "n": "", "vs": [[4, "وسمعت أن عدد المختومين، مئة وأربعة وأربعون ألفا، من جميع أسباط بني إسرائيل:"]]}], "kwAr": "إلى أسباط اليهود الاثني عشر", "noteAr": ""}, {"kw": "scattered", "raw": "Lev_26:33; Deu_4:27, Deu_28:64, Deu_30:3, Deu_32:26; Est_3:8; Eze_12:15; Joh_7:35; Act_2:5, Act_8:1, Act_15:21; 1Pe_1:1", "note": "", "refs": [{"l": "Lev 26:33", "n": "", "vs": [[33, "وأشتتكم بين الشعوب، وأجرد عليكم سيفي، وألاحقكم، وأحول أرضكم إلى قفر ومدنكم إلى خرائب."]]}, {"l": "Deu 4:27", "n": "", "vs": [[27, "ويشتتكم الرب بين الأمم فتصبحون أقلية بين الشعوب التي يسوقكم إليها."]]}, {"l": "Deu 28:64", "n": "", "vs": [[64, "ويشتتكم الرب بين جميع الأمم من أقصى الأرض إلى أقصاها، فتعبدون هناك آلهة أخرى من خشب أو حجر لم تعرفوها أنتم ولا آباؤكم،"]]}, {"l": "Deu 30:3", "n": "", "vs": [[3, "فإن الرب إلهكم يرد سبيكم ويرحمكم، ويلم شتاتكم من بين جميع الشعوب الذين نفاكم الرب إلهكم إليهم."]]}, {"l": "Deu 32:26", "n": "", "vs": [[26, "قلت: أشتتهم في زوايا الأرض، وأمحو من بين الناس ذكرهم."]]}, {"l": "Est 3:8", "n": "", "vs": [[8, "فقال هامان للملك أحشويروش: «هناك شعب ما متشتت ومتفرق بين الشعوب في كل أرجاء مملكتك، تغاير شرائعهم شرائع جميع الأمم، وهم لا ينفذون سنن الملك. فلا يجدر بالملك إغفال أمرهم."]]}, {"l": "Eze 12:15", "n": "", "vs": [[15, "فيدركون أني أنا الرب حين أشتتهم بين الأمم وأبددهم في البلاد."]]}, {"l": "Joh 7:35", "n": "", "vs": [[35, "فتساءل اليهود فيما بينهم: «إلى أين ينوي أن يذهب فلا نجده؟ أيذهب إلى المدن اليونانية التي تشتت فيها اليهود، ويعلم اليونانيين؟"]]}, {"l": "Act 2:5", "n": "", "vs": [[5, "وكانت أورشليم في ذلك الوقت مزدحمة باليهود الأتقياء الذين جاءوا إليها من أمم العالم كلها."]]}, {"l": "Act 8:1", "n": "", "vs": [[1, "وكان شاول موافقا على قتل استفانوس. وفي ذلك اليوم نفسه وقع اضطهاد شديد على الكنيسة التي في أورشليم. فتشتت الإخوة جميعا في نواحي اليهودية والسامرة، ولم يبق في أورشليم إلا الرسل."]]}, {"l": "Act 15:21", "n": "", "vs": [[21, "فإن لموسى، منذ القدم، أتباعا في كل مدينة، يقرأون شريعته ويبشرون بها في المجامع كل سبت»."]]}, {"l": "1Pe 1:1", "n": "", "vs": [[1, "من بطرس، رسول يسوع المسيح إلى المشتتين المغتربين في بلاد بنطس وغلاطية وكبدوكية وآسيا وبيثينية، أولئك الذين اختارهم الله الآب"]]}], "kwAr": "المشتتين في كل مكان", "noteAr": ""}, {"kw": "greeting", "raw": "Act_15:23, Act_23:26; 2Ti_4:21", "note": "", "refs": [{"l": "Act 15:23", "n": "", "vs": [[23, "وسلموهم هذه الرسالة:"]]}, {"l": "Act 23:26", "n": "", "vs": [[26, "»من كلوديوس ليسياس إلى سمو الحاكم فيلكس: سلام!"]]}, {"l": "2Ti 4:21", "n": "", "vs": [[21, "اجتهد أن تجيء إلي قبل حلول الشتاء."]]}], "kwAr": "سلام", "noteAr": ""}], "arS": [["من ", []], ["يعقوب", ["G2385"]], ["، ", []], ["عبد", ["G1401"]], [" ", []], ["الله", ["G2316"]], [" ", []], ["والرب", ["G2962"]], [" ", []], ["يسوع", ["G2424"]], [" ", []], ["المسيح", ["G5547"]], ["، إلى ", []], ["أسباط", ["G5443"]], [" اليهود الاثني ", []], ["عشر", ["G1427"]], ["، ", []], ["المشتتين", ["G1290"]], [" في كل مكان ", []], ["سلام", ["G5463"]], ["!", []]]}, {"c": 1, "v": 2, "text": "ياإخوتي، عندما تنزل بكم التجارب والمحن المختلفة، اعتبروها سبيلا إلى الفرح الكلي.", "groups": [{"kw": "count", "raw": "Jam_1:12; Mat_5:10-12; Luk_6:22, Luk_6:23; Act_5:41; Rom_8:17, Rom_8:18, Rom_8:35-37; 2Co_12:9; 2Co_12:10; Phi_1:29, Phi_2:17; Col_1:24; Heb_10:34; 1Pe_4:13-16", "note": "", "refs": [{"l": "Jam 1:12", "n": "", "vs": [[12, "طوبى لمن يتحمل المحنة بصبر. فإنه، بعد أن يجتاز الامتحان بنجاح، سينال «إكليل الحياة» الذي وعد به الرب محبيه!"]]}, {"l": "Mat 5:10-12", "n": "", "vs": [[10, "طوبى للمضطهدين من أجل البر، فإن لهم ملكوت السماوات."], [11, "طوبى لكم متى أهانكم الناس واضطهدوكم، وقالوا فيكم من أجلي كل سوء كاذبين."], [12, "افرحوا وتهللوا، فإن مكافأتكم في السماوات عظيمة. فإنهم هكذا اضطهدوا الأنبياء من قبلكم!"]]}, {"l": "Luk 6:22", "n": "", "vs": [[22, "طوبى لكم متى أبغضكم الناس، وعزلوكم، وأهانوا اسمكم ونبذوه كأنه شرير، من أجل ابن الإنسان."]]}, {"l": "Luk 6:23", "n": "", "vs": [[23, "افرحوا في ذلك اليوم وتهللوا، فها إن مكافأتكم في السماء عظيمة: لأنه هكذا عامل آباؤهم الأنبياء."]]}, {"l": "Act 5:41", "n": "", "vs": [[41, "ولكن الرسل خرجوا من المجلس فرحين، لأنهم اعتبروا أهلا لأن يلقوا الإهانة من أجل اسم يسوع."]]}, {"l": "Rom 8:17", "n": "", "vs": [[17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}, {"l": "Rom 8:18", "n": "", "vs": [[18, "فإني مقتنع بأن آلام الزمان الحاضر ليست شيئا إذا قيست بالمجد الآتي الذي سيعلن فينا."]]}, {"l": "Rom 8:35-37", "n": "", "vs": [[35, "فمن سيفصلنا عن محبة المسيح لنا؟ هل الشدة أم الضيق أم الاضطهاد أم الجوع أم العري أم الخطر أم السيف؟"], [36, "بل كما قد كتب: «إننا من أجلك نعاني الموت طول النهار. قد حسبنا كأننا غنم للذبح!»"], [37, "ولكننا، في جميع هذه الأمور، نحرز ما يفوق الانتصار على يد من أحبنا."]]}, {"l": "2Co 12:9", "n": "", "vs": [[9, "فقال لي: «نعمتي تكفيك، لأن قدرتي تكمل في الضعف!» فأنا أرضى بأن أفتخر مسرورا بالضعفات التي في، لكي تخيم علي قدرة المسيح."]]}, {"l": "2Co 12:10", "n": "", "vs": [[10, "فلأجل المسيح، تسرني الضعفات والإهانات والضيقات والاضطهادات والصعوبات، لأني حينما أكون ضعيفا، فحينئذ أكون قويا!"]]}, {"l": "Phi 1:29", "n": "", "vs": [[29, "فقد وهب لكم، لأجل المسيح، لا أن تؤمنوا به وحسب، بل أيضا أن تتألموا لأجله،"]]}, {"l": "Phi 2:17", "n": "", "vs": [[17, "حتى لو سفك دمي سكيبا فوق ذبيحة إيمانكم وخدمته، فإني أفرح وأبتهج معكم جميعا."]]}, {"l": "Col 1:24", "n": "", "vs": [[24, "والآن أنا أفرح في الآلام التي أقاسيها لأجلكم، وأتمم في جسدي ما نقص من ضيقات المسيح لأجل جسده الذي هو الكنيسة،"]]}, {"l": "Heb 10:34", "n": "", "vs": [[34, "فقد تعاطفتم مع المسجونين، كما تقبلتم نهب ممتلكاتكم بفرح، علما منكم بأن لكم في السماء ثروة أفضل وأبقى."]]}, {"l": "1Pe 4:13-16", "n": "", "vs": [[13, "وإنما افرحوا: لأنكم كما تشاركون المسيح في الآلام الآن، لابد أن تفرحوا بمشاركته في الابتهاج عند ظهور مجده."], [14, "فإذا لحقتكم الإهانة لأنكم تحملون اسم المسيح، فطوبى لكم! لأن روح المجد، أي روح الله، يستقر عليكم."], [15, "لا يكن بينكم من يتأ لم عقابا على شر ارتكبه: كالقتل أو السرقة، أو غيرهما من الجرائم، أو التدخل في شؤون الآخرين."], [16, "ولكن إن تألم أحدكم لأنه «مسيحي»، فعليه ألا يخجل، بل أن يمجد الله لأجل هذا الاسم!"]]}], "kwAr": "اعتبروها سبيلا إلى الفرح", "noteAr": ""}, {"kw": "divers", "raw": "Heb_11:36-38; 1Pe_1:6-8; 2Pe_2:9; Rev_2:10", "note": "", "refs": [{"l": "Heb 11:36-38", "n": "", "vs": [[36, "وكثيرون غيرهم تحملوا المحاكمات الظالمة تحت الإهانة والجلد، والإلقاء في السجون مقيدين بالسلاسل."], [37, "ومنهم من حوكموا فماتوا رجما بالحجارة، أو نشرا بالمنشار، أو ذبحا بالسيف. وبعضهم، تشردوا متسترين بجلود الغنم والمعزى، يعانون من الحاجة والضيق والظلم،"], [38, "ولم يكن العالم يستحقهم، تائهين في البراري والجبال والمغاور والكهوف."]]}, {"l": "1Pe 1:6-8", "n": "", "vs": [[6, "وهذا يدعوكم إلى الابتهاج، مع أنه لابد لكم الآن من الحزن فترة قصيرة تحت وطأة التجارب المتنوعة!"], [7, "إلا أن غاية هذه التجارب هي اختبار حقيقة إيمانكم. فكما تختبر النار الذهب وتنقيه، تختبر التجارب حقيقة إيمانكم، وهو أثمن جدا من الذهب الفاني. وهكذا، يكون إيمانكم مدعاة مدح وإكرام وتمجيد لكم، عندما يعود يسوع المسيح ظاهرا بمجده."], [8, "أنتم لم تروا المسيح، ولكنكم تحبونه. ومع أنكم لا ترونه الآن، فأنتم تؤمنون به وتبتهجون بفرح مجيد يفوق الوصف."]]}, {"l": "2Pe 2:9", "n": "", "vs": [[9, "وهكذا نرى أن الرب يعرف أن ينقذ الأتقياء من المحنة، ويحفظ الأشرار محبوسين ليحكم عليهم بالعقاب في يوم الدينونة."]]}, {"l": "Rev 2:10", "n": "", "vs": [[10, "دع عنك الخوف مما ينتظرك من آلام، فإن إبليس سيزج ببعضكم في السجن لكي تمتحنوا، فتقاسون الاضطهاد عشرة أيام. فابق أمينا حتى الموت، فأمنحك إكليل الحياة."]]}], "kwAr": "التجارب والمحن المختلفة", "noteAr": ""}], "arS": [["ياإخوتي", ["G3450", "G80"]], ["، ", []], ["عندما", ["G3752"]], [" ", []], ["تنزل", ["G4045"]], [" بكم ", []], ["التجارب", ["G3986"]], [" والمحن ", []], ["المختلفة", ["G4164"]], ["، ", []], ["اعتبروها", ["G2233"]], [" سبيلا إلى ", []], ["الفرح", ["G5479"]], [" ", []], ["الكلي", ["G3956"]], [".", []]]}, {"c": 1, "v": 3, "text": "وكونوا على ثقة بأن امتحان إيمانكم هذا ينتج صبرا.", "groups": [{"kw": "that", "raw": "Rom_5:3, Rom_5:4, Rom_8:28; 2Co_4:17", "note": "", "refs": [{"l": "Rom 5:3", "n": "", "vs": [[3, "ليس هذا فقط، بل نفتخر أيضا في وسط الضيقات، لعلمنا أن الضيق ينتج فينا الصبر،"]]}, {"l": "Rom 5:4", "n": "", "vs": [[4, "والصبر يؤهلنا للفوز في الامتحان، والفوز يبعث فينا الرجاء،"]]}, {"l": "Rom 8:28", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."]]}, {"l": "2Co 4:17", "n": "", "vs": [[17, "ذلك لأن ما يضايقنا الآن من صعوبات بسيطة عابرة، ينتج لنا بمقدار لا يحد وزنة أبدية من المجد،"]]}], "kwAr": "امتحان إيمانكم", "noteAr": ""}, {"kw": "patience", "raw": "Rom_2:7, Rom_8:25, Rom_15:4; Col_1:11; 2Th_1:4, 2Th_3:5; Heb_10:36, Heb_12:1; 2Pe_1:6", "note": "", "refs": [{"l": "Rom 2:7", "n": "", "vs": [[7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"]]}, {"l": "Rom 8:25", "n": "", "vs": [[25, "ولكن، إن كنا نرجو ما لا نراه، فبالصبر نتوقعه."]]}, {"l": "Rom 15:4", "n": "", "vs": [[4, "فإن كل ما سبق أن كتب فإنما كتب لتعليمنا، حتى يكون لنا رجاء بما في الكتاب من الصبر والعزاء."]]}, {"l": "Col 1:11", "n": "", "vs": [[11, "متشددين بكل قوة موافقة لقدرة مجده، لتتمكنوا تماما من الاحتمال وطول البال،"]]}, {"l": "2Th 1:4", "n": "", "vs": [[4, "حتى إننا، نحن أنفسنا، نفتخر بكم في كنائس الله بسبب ثباتكم وإيمانكم في وسط كل ما تحتملونه من اضطهادات وضيقات."]]}, {"l": "2Th 3:5", "n": "", "vs": [[5, "وليهد الله قلوبكم إلى ما لدى الله من المحبة ولدى المسيح من الصبر!"]]}, {"l": "Heb 10:36", "n": "", "vs": [[36, "إنكم تحتاجون إلى الصبر لتعملوا إرادة الله، فتنالوا البركة التي وعدتم بها."]]}, {"l": "Heb 12:1", "n": "", "vs": [[1, "فبما أن هذا العدد الكبير من الشاهدين للإيمان، يتجمع حولنا كأنه سحابة عظيمة، فلنطرح جانبا كل ثقل يعيقنا عن التقدم، ونتخلص من تلك الخطيئة التي نتعرض للسقوط في فخها بسهولة، لكي نتمكن، نحن أيضا، أن نركض باجتهاد في السباق الممتد أمامنا،"]]}, {"l": "2Pe 1:6", "n": "", "vs": [[6, "والمعرفة بضبط النفس، وضبط النفس بالصبر، والصبر بالتقوى،"]]}], "kwAr": "صبرا", "noteAr": ""}], "arS": [["وكونوا على ", []], ["ثقة", ["G1097"]], [" ", []], ["بأن", ["G3754"]], [" ", []], ["امتحان", ["G1383"]], [" ", []], ["إيمانكم", ["G5216", "G4102"]], [" هذا ", []], ["ينتج", ["G2716"]], [" ", []], ["صبرا", ["G5281"]], [".", []]]}, {"c": 1, "v": 4, "text": "ودعوا الصبر يعمل عمله الكامل فيكم، لكي يكتمل نضوجكم وتصيروا أقوياء قادرين على مواجهة جميع الأحوال.", "groups": [{"kw": "let", "raw": "Jam_5:7-11; Job_17:9; Psa_37:7, Psa_40:1; Hab_2:3; Mat_10:22; Luk_8:15, Luk_21:19; Gal_6:9", "note": "", "refs": [{"l": "Jam 5:7-11", "n": "", "vs": [[7, "وأما أنتم، ياإخوتي، فاصبروا منتظرين عودة الرب. خذوا العبرة من الفلاح: فهو ينتظر أن تعطيه الأرض غلالا ثمينة، صابرا على الزرع حتى يشرب من مطر الخريف ومطر الربيع."], [8, "فاصبروا أنتم إذن، وشددوا قلوبكم لأن عودة الرب قد صارت قريبة."], [9, "أيها الإخوة، لا تتذمروا بعضكم على بعض، لكي لا يصدر الحكم ضدكم. تذكروا دائما أن الديان قريب جدا، إنه أمام الباب."], [10, "واقتدوا، ياإخوتي، في احتمال الآلام والصبر عليها، بالأنبياء الذين تكلموا باسم الرب."], [11, "فنحن نقول عن الصابرين على الألم: «طوبى لهم!» وقد سمعتم بصبر أيوب، ورأيتم كيف عامله الرب في النهاية. وهذا يبين أن الرب كثير الرحمة والشفقة."]]}, {"l": "Job 17:9", "n": "", "vs": [[9, "أما الصديق فيتمسك بطريقه، ويزداد الطاهر اليدين قوة."]]}, {"l": "Psa 37:7", "n": "", "vs": [[7, "اسكن أمام الرب وانتظره بصبر، ولا تغر من الذي ينجح في مسعاه، بفضل مكائده."]]}, {"l": "Psa 40:1", "n": "", "vs": [[1, "انتظرت الرب صابرا، فالتفت إلي وسمع صراخ استغاثتي،"]]}, {"l": "Hab 2:3", "n": "", "vs": [[3, "لأن الرؤيا لا تتحقق إلا في ميعادها، وتسرع إلى نهايتها. إنها لا تكذب وإن توانت فانتظرها، لأنها لابد أن تتحقق ولن تتأخر طويلا."]]}, {"l": "Mat 10:22", "n": "", "vs": [[22, "وتكونون مكروهين لدى الجميع من أجل اسمي. ولكن من يثبت إلى النهاية، هو الذي يخلص."]]}, {"l": "Luk 8:15", "n": "", "vs": [[15, "وأما الذي وقع في الأرض الجيدة، فهم الذين يسمعون الكلمة ويحفظونها في قلب جيد مستقيم، وينتجون ثمرا بالصبر."]]}, {"l": "Luk 21:19", "n": "", "vs": [[19, "فباحتمالكم تربحون أنفسكم!"]]}, {"l": "Gal 6:9", "n": "", "vs": [[9, "لأننا، متى حان الأوان، سنحصد، إن كنا لا نتراخى."]]}], "kwAr": "دعوا الصبر يعمل عمله الكامل", "noteAr": ""}, {"kw": "perfect and", "raw": "Jam_3:2; Pro_4:8; Mat_5:48; Joh_17:23; 1Co_2:6; Phi_3:12-15; Col_4:12; 2Ti_3:17; Heb_13:21; 1Pe_5:10; 1Jo_4:17, 1Jo_4:18", "note": "", "refs": [{"l": "Jam 3:2", "n": "", "vs": [[2, "فإننا جميعا معرضون للوقوع في أخطاء كثيرة. ولكن من يلجم لسانه ولا يخطيء في كلامه هو ناضج يقدر أن يسيطر على طبيعته سيطرة تامة."]]}, {"l": "Pro 4:8", "n": "", "vs": [[8, "مجدها فتمجدك، اعتنقها فتكرمك."]]}, {"l": "Mat 5:48", "n": "", "vs": [[48, "فكونوا أنتم كاملين، كما أن أباكم السماوي هو كامل!"]]}, {"l": "Joh 17:23", "n": "", "vs": [[23, "أنا فيهم، وأنت في، ليكتملوا فيصيروا واحدا، حتى يعرف العالم أنك أرسلتني وأنك أحببتهم كما أحببتني."]]}, {"l": "1Co 2:6", "n": "", "vs": [[6, "على أن لنا حكمة نتكلم بها بين البالغين. ولكنها حكمة ليست من هذا العالم ولا من رؤساء هذا العالم الزائلين."]]}, {"l": "Phi 3:12-15", "n": "", "vs": [[12, "لست أدعي أني قد نلت الجائزة أو بلغت الكمال. ولكني ماأزال أسعى لاقتنائها، كما أن المسيح يسوع قد اقتناني."], [13, "أيها الإخوة، أنا لا أعتبر نفسي قد نلت الجائزة، ولكني أفعل أمرا واحدا: أنسى ما هو وراء وأتقدم إلى ما هو أمام،"], [14, "إذ أسعى إلى الهدف، لنوال تلك الجائزة التي يدعونا الله إليها دعوة عليا في المسيح يسوع."], [15, "جميع البالغين فينا، ليكن فيهم هذا الفكر. وإن كان فيكم غير هذا الفكر، فذلك أيضا سيكشفه لكم الله ."]]}, {"l": "Col 4:12", "n": "", "vs": [[12, "يسلم عليكم أبفراس الذي هو منكم، وهو عبد للمسيح يسوع، يجاهد كل حين لأجلكم في الصلوات لتثبتوا كاملين ولكم تمام اليقين من جهة مشيئة الله كلها."]]}, {"l": "2Ti 3:17", "n": "", "vs": [[17, "لكي يجعل إنسان الله مؤهلا تأهيلا كاملا، ومجهزا لكل عمل صالح."]]}, {"l": "Heb 13:21", "n": "", "vs": [[21, "أن يؤهلكم تماما لتعملوا مشيئته في كل عمل صالح، وأن يعمل فينا جميعا ما يرضيه بيسوع المسيح، له المجد إلى أبد الآبدين. آمين!"]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}, {"l": "1Jo 4:17", "n": "", "vs": [[17, "وتكون محبة الله قد اكتملت في داخلنا حين تولد فينا ثقة كاملة من جهة يوم الدينونة: لأنه كما المسيح، هكذا نحن أيضا في هذا العالم."]]}, {"l": "1Jo 4:18", "n": "", "vs": [[18, "ليس في المحبة أي خوف. بل المحبة الكاملة تطرد الخوف خارجا. فإن الخوف يأتي من العقاب. والخائف لا تكون محبة الله قد اكتملت فيه."]]}], "kwAr": "يكتمل نضوجكم", "noteAr": ""}, {"kw": "wanting", "raw": "Jam_1:5; Mat_19:20; Mar_10:21; Luk_18:22; 2Pe_1:9", "note": "", "refs": [{"l": "Jam 1:5", "n": "", "vs": [[5, "وإن كان أحد منكم بحاجة إلى الحكمة، فليطلب من الله الذي يعطي الجميع بسخاء ولا يعير. فسيعطى له."]]}, {"l": "Mat 19:20", "n": "", "vs": [[20, "قال له الشاب: «هذه كلها عملت بها منذ صغري، فماذا ينقصني بعد؟»"]]}, {"l": "Mar 10:21", "n": "", "vs": [[21, "وإذ نظر يسوع إليه، أحبه، وقال له: «ينقصك شيء واحد: اذهب، بع كل ما عندك، ووزع على الفقراء، فيكون لك كنز في السماء، ثم تعال اتبعني»."]]}, {"l": "Luk 18:22", "n": "", "vs": [[22, "فلما سمع يسوع هذا، قال له: «ينقصك شيء واحد: بع كل ما عندك، ووزع على الفقراء، فيكون لك كنز في السماوات. ثم تعال اتبعني!»"]]}, {"l": "2Pe 1:9", "n": "", "vs": [[9, "أما الذي لا يملك هذه الصفات، فهو أعمى روحيا. إنه قصير البصر، قد نسي أنه تطهر من خطاياه القديمة!"]]}], "kwAr": "قادرين على مواجهة جميع الأحوال", "noteAr": ""}], "arS": [["ودعوا ", []], ["الصبر", ["G5281"]], [" ", []], ["يعمل", ["G2192"]], [" ", []], ["عمله", ["G2041"]], [" ", []], ["الكامل", ["G5046"]], [" فيكم، ", []], ["لكي", ["G2443"]], [" ", []], ["يكتمل", ["G5046"]], [" نضوجكم وتصيروا ", []], ["أقوياء", ["G3648"]], [" قادرين على مواجهة جميع ", []], ["الأحوال", ["G3367", "G3007"]], [".", []]]}, {"c": 1, "v": 5, "text": "وإن كان أحد منكم بحاجة إلى الحكمة، فليطلب من الله الذي يعطي الجميع بسخاء ولا يعير. فسيعطى له.", "groups": [{"kw": "any", "raw": "Exo_31:3, Exo_31:6, Exo_36:1-4; 1Ki_3:7-9, 1Ki_3:11, 1Ki_3:12; Job 28:12-28; Pro_3:5-7, Pro_9:4-6; Jer_1:6, Jer_1:7; 2Co_2:16", "note": "", "refs": [{"l": "Exo 31:3", "n": "", "vs": [[3, "وملأته من روح الله ووهبته حكمة ومهارة ومقدرة ومعرفة في كل أنواع الحرف،"]]}, {"l": "Exo 31:6", "n": "", "vs": [[6, "كما اخترت أهوليآب بن أخيساماك من سبط دان، ليكون مساعدا له. وكذلك وهبت جميع الصناع مهارة خاصة ليقوموا بكل ما أمرتك به."]]}, {"l": "Exo 36:1-4", "n": "", "vs": [[1, "وهكذا يقوم بصلئيل وأهوليآب وكل صانع حاذق وهبه الرب مقدرة في تنفيذ بناء خيمة الاجتماع، بإنجاز العمل، بحسب كل ما أمر به الرب."], [2, "ثم استدعى موسى بصلئيل وأهوليآب وكل صانع ماهر وهبه الرب حذاقة، وكل من حثه قلبه على المساهمة في إنجاز عمل ما."], [3, "وتسلموا من موسى جميع تقدمات بني إسرائيل، التي تبرعوا بها لبناء المقدس. وظل الشعب يأتون كل صباح بمزيد من التبرعات."], [4, "فأقبل الصناع المهرة القائمون بأعمال المقدس، من مهامهم،"]]}, {"l": "1Ki 3:7-9", "n": "", "vs": [[7, "والآن أيها الرب إلهي، لقد جعلت عبدك ملكا خلفا لداود أبي، وأنا ما برحت فتى صغيرا غير متمرس بشؤون الحكم،"], [8, "وعبدك يتولى حكم شعبك الذي اخترته، وهو شعب أعظم من أن يعد أو يحصى لكثرته."], [9, "فهب عبدك قلبا فهيما لأقضي بين شعبك، وأميز بين الخير والشر، لأنه من يستطيع أن يحكم شعبك العظيم هذا؟»"]]}, {"l": "1Ki 3:11", "n": "", "vs": [[11, "وقال له: «لأنك قد طلبت هذا الأمر، ولم تطلب حياة طويلة، ولا غنى، ولا انتقاما من أعدائك، بل سألت حكمة لتسوس شؤون الحكم،"]]}, {"l": "1Ki 3:12", "n": "", "vs": [[12, "فإنني سألبي طلبك، فأهبك قلبا حكيما مميزا، فلا يضاهيك أحد من قبل ولا من بعد."]]}, {"l": "Job 28:12-28", "n": "", "vs": [[12, "ولكن أين توجد الحكمة؟ وأين مقر الفطنة؟"], [13, "لا يدرك الإنسان قيمتها، ولا يمكن أن توجد في أرض الأحياء."], [14, "يقول الغمر: ليست هي في؛ ويقول البحر إني لا أملكها."], [15, "لا تقايض بالذهب الخالص، ولا توزن الفضة ثمنا لها."], [16, "لا تثمن بذهب أوفير أو بالجزع الكريم أو بالياقوت الأزرق."], [17, "لا يعادلها ذهب أو زجاج، ولا تستبدل بمجوهرات من الذهب الخالص."], [18, "لا يذكر معها المرجان أو البلور، فثمن الحكمة أغلى من كل اللآليء."], [19, "لا يقارن بها ياقوت كوش ولا تثمن بالذهب النقي."], [20, "إذا من أين تأتي الحكمة، وأين هو مقر الفطنة؟"], [21, "إنها محجوبة عن عيني كل حي، وخافية عن طير السماء."], [22, "الهلاك والموت قالا: قد بلغت مسامعنا شائعة عنها."], [23, "الله وحده يعلم الطريق إليها ويعرف مقرها،"], [24, "لأنه يرى أقصى الأرض ويحيط بجميع ما تحت السماوات."], [25, "عندما جعل للريح وزنا وعاير المياه بمقياس،"], [26, "عندما وضع سننا للمطر وممرا لصواعق الرعود،"], [27, "آنئذ رآها وأذاع خبرها وأثبتها وفحصها،"], [28, "ثم قال للإنسان: انظر، إن مخافة الرب هي الحكمة، وتفادي الشر هو الفطنة»."]]}, {"l": "Pro 3:5-7", "n": "", "vs": [[5, "اتكل على الرب من كل قلبك، وعلى فطنتك لا تعتمد."], [6, "اعرف الرب في كل طرقك وهو يقوم سبلك."], [7, "لا تكن حكيما في عيني نفسك بل اتق الرب وحد عن الشر،"]]}, {"l": "Pro 9:4-6", "n": "", "vs": [[4, "«كل من هو ساذج فليمل إلى هنا». وتدعو كل غبي قائلة:"], [5, "«تعالوا كلوا من خبزي واشربوا من الخمر التي مزجت."], [6, "انبذوا الجهالة فتحيوا، واسلكوا سبيل الفهم»."]]}, {"l": "Jer 1:6", "n": "", "vs": [[6, "فقلت: «آه، أيها السيد الرب إني لا أعرف ماذا أقول، لأني مازلت ولدا»"]]}, {"l": "Jer 1:7", "n": "", "vs": [[7, "ولكن الرب أجابني: «لا تقل إني لست سوى ولد، لأنك ستذهب إلى كل من أبعث بك إليه، وتنطق بكل ما آمرك به."]]}, {"l": "2Co 2:16", "n": "", "vs": [[16, "هؤلاء يشمون فيها رائحة من الموت وإلى الموت، وأولئك رائحة من الحياة وإلى الحياة. ومن هو صاحب الكفاءة لتأدية هذه الأمور؟"]]}], "kwAr": "إن كان أحد منكم بحاجة إلى الحكمة", "noteAr": ""}, {"kw": "let", "raw": "Jam_1:17, Jam_3:17, Jam_5:16; 1Ch_22:12; 2Ch_1:10; Pro_2:3-6; Isa_55:6, Isa_55:7; Jer_29:12; Jer_29:13; Dan_2:18-22; Mat_7:7-11; Luk_11:9-13; Joh_4:10, Joh_14:13, Joh_15:7; Joh_16:23, Joh_16:24; 1Jo_3:22, 1Jo_5:14, 1Jo_5:15", "note": "", "refs": [{"l": "Jam 1:17", "n": "", "vs": [[17, "إن كل عطية صالحة وهبة كاملة إنما تنزل من فوق، من لدن أبي الأنوار الذي ليس فيه تحول، ولا ظل لأنه لا يدور."]]}, {"l": "Jam 3:17", "n": "", "vs": [[17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}, {"l": "Jam 5:16", "n": "", "vs": [[16, "ليعترف كل واحد منكم لأخيه بزلاته، وصلوا بعضكم لأجل بعض، حتى تشفوا. إن الصلاة الحارة التي يرفعها البار لها فعالية عظيمة."]]}, {"l": "1Ch 22:12", "n": "", "vs": [[12, "وليمنحك الرب فطنة ومعرفة عندما يوليك على إسرائيل لتطيع شريعة الرب إلهك،"]]}, {"l": "2Ch 1:10", "n": "", "vs": [[10, "فهبني حكمة ومعرفة لأقود هذا الشعب، لأنه من يستطيع أن يحكم شعبك العظيم هذا؟»"]]}, {"l": "Pro 2:3-6", "n": "", "vs": [[3, "وإن نشدت الفطنة، وهتفت داعيا الفهم."], [4, "إن التمسته كما تلتمس الفضة، وبحثت عنه كما يبحث عن الكنوز الدفينة،"], [5, "عندئذ تدرك مخافة الرب وتعثر على معرفة الله،"], [6, "لأن الرب يهب الحكمة، ومن فمه تتدفق المعرفة والفهم."]]}, {"l": "Isa 55:6", "n": "", "vs": [[6, "اطلبوا الرب مادام موجودا، ادعوه وهو قريب."]]}, {"l": "Isa 55:7", "n": "", "vs": [[7, "ليترك الشرير طريقه والأثيم أفكاره، وليتب إلى الرب فيرحمه، وليرجع إلى إلهنا لأنه يكثر الغفران."]]}, {"l": "Jer 29:12", "n": "", "vs": [[12, "فتدعونني وتقبلون، وتصلون إلي فأستجيب لكم،"]]}, {"l": "Jer 29:13", "n": "", "vs": [[13, "وتلتمسونني فتجدونني إذ تطلبونني بكل قلوبكم."]]}, {"l": "Dan 2:18-22", "n": "", "vs": [[18, "ليطلبوا من إله السماوات الرحمة بشأن هذا اللغز لكي لا يهلك دانيآل ورفاقه مع سائر حكماء بابل."], [19, "عندئذ انكشف السر لدانيآل في رؤيا الليل، فبارك إله السماوات،"], [20, "قائلا: «ليكن اسم الله مباركا من الأزل وإلى الأبد لأن له الحكمة والقدرة."], [21, "هو يغير الأوقات والفصول. يعزل ملوكا وينصب ملوكا. يهب الحكماء حكمة وذوي الفطنة معرفة."], [22, "يكشف الأعماق والخفايا ويعلم ما في باطن الظلمة، ولديه يسكن النور."]]}, {"l": "Mat 7:7-11", "n": "", "vs": [[7, "اسألوا، تعطوا. اطلبوا، تجدوا. اقرعوا، يفتح لكم."], [8, "فكل من يسأل، ينل؛ ومن يطلب، يجد؛ ومن يقرع، يفتح له."], [9, "وإلا، فأي إنسان منكم يطلب منه ابنه خبزا، فيعطيه حجرا،"], [10, "أو سمكة، فيعطيه حية؟"], [11, "فإن كنتم وأنتم أشرار، تعرفون أن تعطوا أولادكم عطايا جيدة، فكم بالأحرى جدا يعطي أبوكم السماوي عطايا جيدة للذين يطلبون منه؟"]]}, {"l": "Luk 11:9-13", "n": "", "vs": [[9, "فإني أقول لكم: اطلبوا، تعطوا؛ اسعوا، تجدوا؛ اقرعوا، يفتح لكم:"], [10, "فإن كل من يطلب ينال، ومن يسعى يجد، ومن يقرع يفتح له."], [11, "فأي أب منكم يطلب منه ابنه خبزا فيعطيه حجرا؟ أو يطلب سمكة فيعطيه بدل السمكة حية؟"], [12, "أو يطلب بيضة، فيعطيه عقربا؟"], [13, "فإن كنتم، أنتم الأشرار، تعرفون أن تعطوا أولادكم عطايا جيدة، فكم بالأحرى الآب، الذي من السماء يهب الروح القدس لمن يسألونه؟ »"]]}, {"l": "Joh 4:10", "n": "", "vs": [[10, "فأجابها يسوع: «لو كنت تعرفين عطية الله، ومن هو الذي يقول لك: اسقيني، لطلبت أنت منه فأعطاك ماء حيا!»"]]}, {"l": "Joh 14:13", "n": "", "vs": [[13, "فأي شيء تطلبونه باسمي أفعله لكم، ليتمجد الآب في الابن."]]}, {"l": "Joh 15:7", "n": "", "vs": [[7, "ولكن، إن ثبتم في، وثبت كلامي فيكم، فاطلبوا ما تريدون يكن لكم."]]}, {"l": "Joh 16:23", "n": "", "vs": [[23, "وفي ذلك اليوم لا تسألونني عن شيء. الحق الحق أقول لكم: إن الآب سيعطيكم كل ما تطلبون منه باسمي."]]}, {"l": "Joh 16:24", "n": "", "vs": [[24, "حتى الآن لم تطلبوا باسمي شيئا. اطلبوا تنالوا، فيكون فرحكم كاملا."]]}, {"l": "1Jo 3:22", "n": "", "vs": [[22, "ومهما نطلب منه بالصلاة، نحصل عليه: لأننا نطيع ما يوصينا به، ونمارس الأعمال التي ترضيه."]]}, {"l": "1Jo 5:14", "n": "", "vs": [[14, "نحن نثق بالله ثقة عظيمة تؤكد لنا أنه يسمع لنا الطلبات التي نرفعها إليه، إن كانت منسجمة مع إرادته."]]}, {"l": "1Jo 5:15", "n": "", "vs": [[15, "ومادمنا واثقين بأنه يسمع لنا، مهما كانت طلباتنا، فلنا الثقة بأننا قد حصلنا منه على تلك الطلبات."]]}], "kwAr": "فليطلب من الله", "noteAr": ""}, {"kw": "and upbraideth", "raw": "Mat_11:20; Mar_16:14; Luk_15:20-22", "note": "", "refs": [{"l": "Mat 11:20", "n": "", "vs": [[20, "ثم بدأ يسوع يوبخ المدن التي جرت فيها أكثر معجزاته، لكون أهلها لم يتوبوا."]]}, {"l": "Mar 16:14", "n": "", "vs": [[14, "أخيرا ظهر للأحد عشر تلميذا فيما كانوا متكئين، ووبخهم على عدم إيمانهم وقساوة قلوبهم، لأنهم لم يصدقوا الذين شاهدوه بعد قيامته."]]}, {"l": "Luk 15:20-22", "n": "", "vs": [[20, "فقام ورجع إلى أبيه. ولكن أباه رآه وهو مازال بعيدا، فتحنن، وركض إليه وعانقه وقبله بحرارة."], [21, "فقال له الابن. ياأبي، أخطأت إلى السماء وأمامك، ولا أستحق بعد أن أدعى ابنا لك…"], [22, "أما الأب فقال لعبيده: أحضروا سريعا أفضل ثوب وألبسوه، وضعوا في إصبعه خاتما وفي قدميه حذاء."]]}], "kwAr": "ولا يعير", "noteAr": ""}], "arS": [["وإن", ["G1487"]], [" كان ", []], ["أحد", ["G5100"]], [" ", []], ["منكم", ["G5216"]], [" ", []], ["بحاجة", ["G3007"]], [" إلى ", []], ["الحكمة", ["G4678"]], ["، ", []], ["فليطلب", ["G154"]], [" ", []], ["من", ["G3844"]], [" ", []], ["الله", ["G2316"]], [" الذي ", []], ["يعطي", ["G1325"]], [" ", []], ["الجميع", ["G3956"]], [" ", []], ["بسخاء", ["G574"]], [" ولا ", []], ["يعير", ["G3679"]], [". ", []], ["فسيعطى", ["G1325"]], [" ", []], ["له", ["G846"]], [".", []]]}, {"c": 1, "v": 6, "text": "وإنما، عليه أن يطلب ذلك بإيمان، دون أي تردد أو شك. فإن المتردد كموجة البحر تتلاعب بها الرياح فتقذفها وتردها!", "groups": [{"kw": "let", "raw": "Mat_21:22; Mar_11:22-24; 1Ti_2:8; Heb_11:6", "note": "", "refs": [{"l": "Mat 21:22", "n": "", "vs": [[22, "وكل ما تطلبونه في الصلاة بإيمان، تنالونه»."]]}, {"l": "Mar 11:22-24", "n": "", "vs": [[22, "فرد يسوع قائلا لهم: «ليكن لكم إيمان بالله!"], [23, "فالحق أقول لكم: إن أي من قال لهذا الجبل: انقلع وانطرح في البحر! ولا يشك في قلبه، بل يؤمن أن ما يقوله سيحدث، فما يقوله يتم له."], [24, "لهذا السبب أقول لكم: إن ما تطلبونه وتصلون لأجله، فآمنوا أنكم قد نلتموه، فيتم لكم."]]}, {"l": "1Ti 2:8", "n": "", "vs": [[8, "فأريد إذن، أن يصلي الرجال في كل مكان، رافعين أيادي طاهرة، وهم لا يضمرون أي حقد أو شكوك."]]}, {"l": "Heb 11:6", "n": "", "vs": [[6, "فمن المستحيل إرضاء الله بدون إيمان. إذ إن من يتقرب إلى الله، لابد له أن يؤمن بأنه موجود، وبأنه يكافيء الذين يسعون إليه."]]}], "kwAr": "يطلب بإيمان دون أي تردد", "noteAr": ""}, {"kw": "he", "raw": "Gen_49:4; Eph_4:14; Heb_10:23, Heb_13:9; 2Pe_2:17; Jud_1:12, Jud_1:13", "note": "", "refs": [{"l": "Gen 49:4", "n": "", "vs": [[4, "لكنك فائر كالماء لذلك لن تظل متفوقا، لأنك اضطجعت في فراش أبيك. صعدت على سريري فدنسته."]]}, {"l": "Eph 4:14", "n": "", "vs": [[14, "وذلك حتى لا نكون فيما بعد أطفالا تتقاذفنا وتحملنا كل ريح تعليم يقوم على خداع الناس والمكر بهم لجرهم إلى الضلال الملفق،"]]}, {"l": "Heb 10:23", "n": "", "vs": [[23, "ولنتمسك دائما بالرجاء الذي نعترف به، دون أن نشك في أنه سيتحقق، لأن الذي وعدنا بتحقيقه، هو أمين وصادق."]]}, {"l": "Heb 13:9", "n": "", "vs": [[9, "فلا تنخدعوا وتتبعوا تلك التعاليم الغريبة المتنوعة ... فمن الأفضل أن يثبت القلب بالنعمة لا بنظم الأطعمة التي لم تنفع المتقيدين بها."]]}, {"l": "2Pe 2:17", "n": "", "vs": [[17, "فليس هؤلاء إلا آبارا لا ماء فيها، وغيوما تسوقها الريح العاصفة. ويا له من مصير مرعب محجوز لهم في الظلام الأبدي القاتم!"]]}, {"l": "Jud 1:12", "n": "", "vs": [[12, "إنهم يشتركون معكم في ولائم المحبة دون خجل، ولكنهم كصخور تعيقكم. لا هم لهم سوى تعليف أنفسهم! إنهم يشبهون غيوما بلا مطر تسوقها الرياح، وأشجارا خريفية بلا ثمر، يقتلعها أصحابها، فتكون قد ماتت مرتين."]]}, {"l": "Jud 1:13", "n": "", "vs": [[13, "وبأعمالهم المخجلة يفضحون أنفسهم كأمواج في البحر هائجة تقذف الأوساخ. وهم أشبه بنجوم تائهة في الفضاء، مصيرها الظلام الشديد إلى الأبد!"]]}], "kwAr": "المتردد كموجة البحر", "noteAr": ""}], "arS": [["وإنما، عليه أن ", []], ["يطلب", ["G154"]], [" ذلك ", []], ["بإيمان", ["G4102"]], ["، دون أي ", []], ["تردد", ["G3367", "G1252"]], [" أو شك. ", []], ["فإن", ["G1063"]], [" ", []], ["المتردد", ["G1252"]], [" ", []], ["كموجة", ["G1503", "G2830"]], [" ", []], ["البحر", ["G2281"]], [" تتلاعب بها ", []], ["الرياح", ["G416"]], [" فتقذفها ", []], ["وتردها", ["G4494"]], ["!", []]]}, {"c": 1, "v": 7, "text": "فلا يتوهم المتردد أنه ينال شيئا من الرب.", "groups": [{"kw": "", "raw": "Jam_4:3; Pro_15:8, Pro_21:27; Isa_1:15, Isa_58:3, Isa_58:4", "note": "", "refs": [{"l": "Jam 4:3", "n": "", "vs": [[3, "وإذا طلبتم منه شيئا، فإنكم لا تحصلون عليه: لأنكم تطلبون بدافع شرير، إذ تنوون أن تستهلكوا ما تنالونه لإشباع شهواتكم فقط."]]}, {"l": "Pro 15:8", "n": "", "vs": [[8, "قربان المنافقين مكرهة الرب، ومسرته صلاة المستقيمين."]]}, {"l": "Pro 21:27", "n": "", "vs": [[27, "ذبيحة الشرير رجس عند الرب، فكم بالحري إن قربها بنية أثيمة؟"]]}, {"l": "Isa 1:15", "n": "", "vs": [[15, "عندما تبسطون نحوي أيديكم أحجب وجهي عنكم، وإن أكثرتم الصلاة لا أستجيب، لأن أيديكم مملوءة دما."]]}, {"l": "Isa 58:3", "n": "", "vs": [[3, "ويسألون: ما بالنا صمنا وأنت لم تلاحظ، وتذللنا ولم تحفل بذلك؟. إنكم في يوم صومكم تلتمسون مسرة أنفسكم وتسخرون جميع عمالكم."]]}, {"l": "Isa 58:4", "n": "", "vs": [[4, "وها أنتم تصومون لكي تتخاصموا وتتشاجروا فقط، وتتضاربوا بكلمات أثيمة. إن مثل صومكم اليوم لا يجعل أصواتكم مسموعة في العلاء."]]}], "kwAr": "", "noteAr": ""}], "arS": [["فلا", ["G3361"]], [" ", []], ["يتوهم", ["G3633"]], [" ", []], ["المتردد", ["G444"]], [" ", []], ["أنه", ["G3754"]], [" ", []], ["ينال", ["G2983"]], [" ", []], ["شيئا", ["G5100"]], [" ", []], ["من", ["G3844"]], [" ", []], ["الرب", ["G2962"]], [".", []]]}, {"c": 1, "v": 8, "text": "فعندما يكون الإنسان برأيين، لا يثبت على قرار في جميع أموره.", "groups": [{"kw": "", "raw": "Jam_4:8; 1Ki_18:21; 2Ki_17:33, 2Ki_17:41; Isa_29:13; Hos_7:8-11, Hos_10:2; Mat_6:22, Mat_6:24; 2Pe_2:14, 2Pe_3:16", "note": "", "refs": [{"l": "Jam 4:8", "n": "", "vs": [[8, "اقتربوا إلى الله فيقترب إليكم. أيها الخاطئون نظفوا أيديكم، وياأصحاب الرأيين طهروا قلوبكم."]]}, {"l": "1Ki 18:21", "n": "", "vs": [[21, "فخاطب إيليا الشعب: «حتى متى تظلون تعرجون بين الفرقتين؟ إن كان الرب هو الله فاتبعوه، وإن كان البعل هو الله فاتبعوه». فلم يجبه الشعب بكلمة."]]}, {"l": "2Ki 17:33", "n": "", "vs": [[33, "وهكذا كانوا يتقون الرب من ناحية، ويعبدون آلهتهم التي حملوها معهم من بين الأمم التي سبوا منها من ناحية أخرى."]]}, {"l": "2Ki 17:41", "n": "", "vs": [[41, "فكانوا يتقون الرب من ناحية، ويعبدون أوثانهم من ناحية أخرى. واقتفى بنوهم خطاهم في ممارساتهم إلى هذا اليوم."]]}, {"l": "Isa 29:13", "n": "", "vs": [[13, "لذلك يقول الرب: لأن هذا الشعب يقترب مني بفمه ويكرمني بشفتيه، بينما قلبه بعيد عنى. وما مخافتهم مني سوى تقليد تلقنوه من الناس."]]}, {"l": "Hos 7:8-11", "n": "", "vs": [[8, "قد اختلط أفرايم بالشعوب، صار كرغيف لم ينضج لأنه لم يقلب."], [9, "استنزف الغرباء قوته وهو لا يدري، وخط الشيب شعر رأسه وهو لا يعلم."], [10, "يشهد غرور إسرائيل عليه ولم يرجع إلى الرب إلهه، ولا التمسه."], [11, "إن أفرايم مثل حمامة غبية حمقاء، تستنجد بمصر تارة وتستغيث بأشور تارة أخرى."]]}, {"l": "Hos 10:2", "n": "", "vs": [[2, "قلوبهم كلها خداع، وعليهم أن يتحملوا عقاب ذنوبهم. إن الرب يهدم مذابحهم ويدمر أوثانهم."]]}, {"l": "Mat 6:22", "n": "", "vs": [[22, "العين مصباح الجسد. فإن كانت عينك سليمة، يكون جسدك كله منورا."]]}, {"l": "Mat 6:24", "n": "", "vs": [[24, "لا يمكن لأحد أن يكون عبدا لسيدين: لأنه إما أن يبغض أحدهما فيحب الآخر، وإما أن يلزم أحدهما فيهجر الآخر. لا يمكنكم أن تكونوا عبيدا لله والمال معا."]]}, {"l": "2Pe 2:14", "n": "", "vs": [[14, "عيونهم لا تنظر إلا نظرات الزنى، ولا تشبع من الخطيئة. وكم من نفوس ضعيفة تقع في فخاخهم! أما قلوبهم، فقد تدربت على الشهوة والطمع. إنهم حقا أبناء اللعنة!"]]}, {"l": "2Pe 3:16", "n": "", "vs": [[16, "وما كتبه في رسالته إليكم، يوافق ما كتبه في باقي رسائله. وفي تلك الرسائل كلها أمور صعبة الفهم، يحرفها الجهال وغير الراسخين في الحق، كما يحرفون غيرها أيضا من الكتابات الموحى بها، فيجلبون الهلاك على أنفسهم."]]}], "kwAr": "", "noteAr": ""}], "arS": [["فعندما يكون ", []], ["الإنسان", ["G435"]], [" ", []], ["برأيين", ["G1374"]], ["، لا ", []], ["يثبت", ["G182"]], [" على قرار في ", []], ["جميع", ["G3956"]], [" ", []], ["أموره", ["G3598"]], [".", []]]}, {"c": 1, "v": 9, "text": "من كان فقيرا وأخا مؤمنا، فليسر بمقامه الذي رفعه الله إليه.", "groups": [{"kw": "the brother", "raw": "Jam_2:5, Jam_2:6; Deu_15:7, Deu_15:9, Deu_15:11; Psa_62:9; Pro_17:5, Pro_19:1; Luk_1:52", "note": "", "refs": [{"l": "Jam 2:5", "n": "", "vs": [[5, "فياإخوتي الأحباء، أما اختار الله الفقراء في نظر الناس ليجعلهم أغنياء في الإيمان، ويعطيهم حق الإرث في الملكوت الذي وعد به محبيه؟"]]}, {"l": "Jam 2:6", "n": "", "vs": [[6, "ولكنكم أنتم عاملتم الفقير معاملة مهينة. ألا تعرفون أن الأغنياء هم الذين يتسلطون عليكم ويجرونكم إلى المحاكم،"]]}, {"l": "Deu 15:7", "n": "", "vs": [[7, "إن وجد بينكم إسرائيلي فقير مقيم في أي مدينة من مدن الأرض التي سيهبها لكم الرب إلهكم، فلا تقسوا قلوبكم وتمتنعوا عن إعانته،"]]}, {"l": "Deu 15:9", "n": "", "vs": [[9, "إياكم أن تحدثوا قلوبكم بخبث قائلين: ها قد قربت السنة السابعة، سنة الإبراء من الديون فيسوء الأمر في أعينكم وتمتنعون عن إقراضه. فإن فعلتم هذا فإنه يستغيث بالرب عليكم، فتصبحون مذنبين في حكم الرب."]]}, {"l": "Deu 15:11", "n": "", "vs": [[11, "فالأرض لن تخلو أبدا من الفقراء، لهذا أوصيكم أن تسخوا على أخيكم المسكين والفقير المقيم في أرضكم."]]}, {"l": "Psa 62:9", "n": "", "vs": [[9, "ليس البشر جميعا، عظماء وأدنياء، سوى باطل ووهم. إن وضعتهم في كفة ميزان لا يزنون شيئا. إنهم أخف من نسمة."]]}, {"l": "Pro 17:5", "n": "", "vs": [[5, "المستهزيء بالفقير يحتقر صانعه، والشامت بالبلية لا يفلت من العقاب."]]}, {"l": "Pro 19:1", "n": "", "vs": [[1, "الفقير السالك بكماله خير من الجاهل المخاتل."]]}, {"l": "Luk 1:52", "n": "", "vs": [[52, "أنزل المقتدرين عن عروشهم، ورفع المتواضعين."]]}], "kwAr": "الفقير الأخ المؤمن", "noteAr": ""}, {"kw": "rejoice", "raw": "or, glory, Jer_9:23, Jer_9:24; Rom_5:2, Rom_5:3; Phi_3:3 *Gr.", "note": "or, glory, Jer_9:23, Jer_9:24; Rom_5:2, Rom_5:3; Phi_3:3 *Gr.", "refs": [{"l": "Jer 9:23", "n": "", "vs": [[23, "«فلا يفتخرن الحكيم بحكمته، ولا يزهون الجبار بجبروته، ولا الغني بثروته."]]}, {"l": "Jer 9:24", "n": "", "vs": [[24, "بل ليفتخر المفتخر بأنه يدرك ويعرفني أني أنا الرب الذي يمارس الرحمة والعدل والبر في الأرض لأني أسر بها»."]]}, {"l": "Rom 5:2", "n": "", "vs": [[2, "وبه أيضا تم لنا الدخول بالإيمان إلى هذه النعمة التي نقيم فيها الآن؛ ونحن نفتخر برجائنا في التمتع بمجد الله."]]}, {"l": "Rom 5:3", "n": "", "vs": [[3, "ليس هذا فقط، بل نفتخر أيضا في وسط الضيقات، لعلمنا أن الضيق ينتج فينا الصبر،"]]}, {"l": "Phi 3:3", "n": "*Gr.", "vs": [[3, "فإننا نحن أهل الختان الحق، لأننا إنما نعبد بروح الله ونفتخر في المسيح يسوع، ولا نعتمد على أمور الجسد،"]]}], "kwAr": "فليسر", "noteAr": "أو: فليفتخر."}, {"kw": "in", "raw": "Jam_2:5; 1Sa_2:8; Psa_113:7, Psa_113:8; Luk_9:48, Luk_10:20; Rom_8:17; 2Co_6:10; Phi_3:14; 1Pe_2:9; 1Jo_3:1-3; Rev_2:9, Rev_5:9, Rev_5:10, Rev_7:9, Rev_7:10", "note": "", "refs": [{"l": "Jam 2:5", "n": "", "vs": [[5, "فياإخوتي الأحباء، أما اختار الله الفقراء في نظر الناس ليجعلهم أغنياء في الإيمان، ويعطيهم حق الإرث في الملكوت الذي وعد به محبيه؟"]]}, {"l": "1Sa 2:8", "n": "", "vs": [[8, "ينهض المسكين من التراب، ويرفع البائس من كومة الرماد، ليجلسه مع النبلاء، ويملكه عرش المجد، لأن للرب أساسات الأرض التي أرسى عليها المسكونة."]]}, {"l": "Psa 113:7", "n": "", "vs": [[7, "ينهض المسكين من التراب، ويرفع البائس من المزبلة،"]]}, {"l": "Psa 113:8", "n": "", "vs": [[8, "ليجلسه مع أشراف شعبه."]]}, {"l": "Luk 9:48", "n": "", "vs": [[48, "وقال لهم: «أي من قبل باسمي هذا الولد الصغير، فقد قبلني؛ ومن قبلني، يقبل الذي أرسلني. فإن من كان الأصغر بينكم جميعا، فهو العظيم»."]]}, {"l": "Luk 10:20", "n": "", "vs": [[20, "إنما لا تفرحوا بهذا: بأن الأرواح تخضع لكم، بل افرحوا بأن أسماءكم قد كتبت في السماوات»."]]}, {"l": "Rom 8:17", "n": "", "vs": [[17, "وما دمنا أولادا، فنحن أيضا وارثون؛ ورثة الله وشركاء المسيح في الإرث. وإن كنا الآن نشاركه في مقاساة الألم، فلأننا سوف نشاركه أيضا في التمتع بالمجد."]]}, {"l": "2Co 6:10", "n": "", "vs": [[10, "كمحزونين ونحن دائما فرحون، كفقراء ونحن نغني كثيرين، كمن لا شيء عندهم ونحن نملك كل شيء."]]}, {"l": "Phi 3:14", "n": "", "vs": [[14, "إذ أسعى إلى الهدف، لنوال تلك الجائزة التي يدعونا الله إليها دعوة عليا في المسيح يسوع."]]}, {"l": "1Pe 2:9", "n": "", "vs": [[9, "فإن سقوطهم أمر حتمي! وأما أنتم، فإنكم تشكلون جماعة كهنة ملوكية، وسلالة اختارها الله ، وأمة كرسها لنفسه، وشعبا امتلكه. وذلك لكي تخبروا بفضائل الرب، الذي دعاكم من الظلام إلى نوره العجيب!"]]}, {"l": "1Jo 3:1-3", "n": "", "vs": [[1, "تأملوا ما أعظم المحبة التي أحبنا بها الآب حتى صرنا ندعى «أولاد الله»، ونحن أولاده حقا. ولكن، بما أن أهل العالم لا يعرفون الله، فهم لا يعرفوننا."], [2, "أيها الأحباء، نحن الآن أولاد الله. ولا نعلم حتى الآن ماذا سنكون، لكننا نعلم أنه متى أظهر المسيح، سنكون مثله، لأننا سنراه عندئذ كما هو!"], [3, "وكل من عنده هذا الرجاء بالمسيح، يطهر نفسه كما أن المسيح طاهر."]]}, {"l": "Rev 2:9", "n": "", "vs": [[9, "إني أعلم كم تقاسي من ضيق وفقر، رغم أنك غني. وأعلم تجريح الذين يدعون أنهم يهود ولكنهم ليسوا يهودا، بل هم مجمع للشيطان!"]]}, {"l": "Rev 5:9", "n": "", "vs": [[9, "وأخذوا يرتلون ترتيلة جديدة يقولون فيها: «مستحق أنت أن تأخذ الكتاب وتفك ختومه، لأنك ذبحت، وبدمك اشتريت لله أناسا من كل قبيلة ولغة وشعب وأمة،"]]}, {"l": "Rev 5:10", "n": "", "vs": [[10, "وجعلتهم مملكة لإلهنا وكهنة له، وسيملكون على الأرض»."]]}, {"l": "Rev 7:9", "n": "", "vs": [[9, "ثم نظرت، فرأيت جمعا كثيرا لا يحصى، من كل أمة وقبيلة وشعب ولغة، واقفين أمام العرش وأمام الحمل، وقد ارتدوا ثيا با بيضاء، وأمسكوا بأيديهم سعف النخل،"]]}, {"l": "Rev 7:10", "n": "", "vs": [[10, "وهم يهتفون بصوت عال: «الخلاص من عند إلهنا الجالس على العرش ومن عند الحمل!»"]]}], "kwAr": "بمقامه الذي رفعه الله إليه", "noteAr": ""}], "arS": [["من كان ", []], ["فقيرا", ["G5011"]], [" ", []], ["وأخا", ["G80"]], [" مؤمنا، ", []], ["فليسر", ["G2744"]], [" بمقامه الذي ", []], ["رفعه", ["G5311"]], [" الله إليه.", []]]}, {"c": 1, "v": 10, "text": "وأما الغني، فعليه أن يسر بأن ما له لا يغنيه عن الله: لأن نهايته ستكون كنهاية الأعشاب المزهرة.", "groups": [{"kw": "in", "raw": "Isa_57:15, Isa_66:2; Mat_5:3; Phi_3:8; 1Ti_6:17", "note": "", "refs": [{"l": "Isa 57:15", "n": "", "vs": [[15, "لأنه هكذا يقول العلي السامي، المقيم في الأبد، الذي يدعى اسمه القدوس: إنني أسكن في العلى وفي الموضع المقدس، وأقيم مع المنسحق، وذوي الروح المتواضعة، لأحيي أرواح المتواضعين، وأنعش قلوب المنسحقين."]]}, {"l": "Isa 66:2", "n": "", "vs": [[2, "جميع هذه صنعتها يدي فوجدت كلها، لكنني أسر بالرجل المتواضع المنسحق الروح الذي يرتعد من كلمتي."]]}, {"l": "Mat 5:3", "n": "", "vs": [[3, "«طوبى للمساكين بالروح، فإن لهم ملكوت السماوات."]]}, {"l": "Phi 3:8", "n": "", "vs": [[8, "بل إني أعتبر كل شيء خسارة، من أجل امتياز معرفة المسيح يسوع ربي؛ فمن أجله تحملت خسارة كل شيء، وأعتبر كل شيء نفاية، لكي أربح المسيح"]]}, {"l": "1Ti 6:17", "n": "", "vs": [[17, "أوص أغنياء هذا الزمان بأن لا يتكبروا، ولا يتكلوا على الغنى غير الثابت، بل على الله الذي يمنحنا كل شيء بوفرة لنتمتع به،"]]}], "kwAr": "أما الغني", "noteAr": ""}, {"kw": "because", "raw": "Jam_4:14; Job_14:2; Psa_37:2, Psa_37:35, Psa_37:36, Psa_90:5, Psa_90:6, Psa_102:11, Psa_103:15; Isa_40:6; Mat_6:30; 1Co_7:31; 1Pe_1:24; 1Jo_2:17", "note": "", "refs": [{"l": "Jam 4:14", "n": "", "vs": [[14, "مهلا! فأنتم لا تعرفون ماذا يحدث غدا! وما هي حياتكم؟ إنها بخار، يظهر فترة قصيرة ثم يتلاشى!"]]}, {"l": "Job 14:2", "n": "", "vs": [[2, "يتفتح كالزهر ثم ينتثر، ويتوارى كالشبح فلا يبقى له أثر."]]}, {"l": "Psa 37:2", "n": "", "vs": [[2, "فإنهم مثل الحشيش سريعا يذوون، وكالعشب الأخضر يذبلون."]]}, {"l": "Psa 37:35", "n": "", "vs": [[35, "قد رأيت الشرير مزدهرا وارفا كالشجرة الخضراء المتأصلة في تربة موطنها،"]]}, {"l": "Psa 37:36", "n": "", "vs": [[36, "ثم عبر ومضى، لم يوجد. فتشت عنه فلم أعثر له على أثر."]]}, {"l": "Psa 90:5", "n": "", "vs": [[5, "تجرف البشر كما يجرفهم الطوفان، فيزولون كالحلم عند الصباح مثل العشب الذي ينمو."]]}, {"l": "Psa 90:6", "n": "", "vs": [[6, "يزهر في الصباح وينمو، وفي المساء يقطع ويجف."]]}, {"l": "Psa 102:11", "n": "", "vs": [[11, "عمري أشبه بظل متقلص، وأنا مثل العشب أذوي."]]}, {"l": "Psa 103:15", "n": "", "vs": [[15, "أيام الإنسان مثل العشب وزهر الحقل،"]]}, {"l": "Isa 40:6", "n": "", "vs": [[6, "وعندئذ قال صوت: «ناد برسالة». فأجبت: «أية رسالة؟» فقال: «كل ذي جسد عشب، وكل بهائه كزهر الصحراء."]]}, {"l": "Mat 6:30", "n": "", "vs": [[30, "فإن كان الله هكذا يكسو الأعشاب البرية مع أنها توجد اليوم وتطرح غدا في النار، أفلستم أنتم، ياقليلي الإيمان، أحرى جدا بأن يكسوكم؟"]]}, {"l": "1Co 7:31", "n": "", "vs": [[31, "والذين يستغلون هذا العالم كأنهم لا يستغلونه. ذلك لأن طراز هذا العالم زائل."]]}, {"l": "1Pe 1:24", "n": "", "vs": [[24, "فإن الحياة البشرية كالعشب، ومجدها كله كزهر العشب. ولابد أن تفنى كما ييبس العشب ويسقط زهره!"]]}, {"l": "1Jo 2:17", "n": "", "vs": [[17, "وسوف يزول العالم، وما فيه من شهوات أما الذي يعمل بإرادة الله، فيبقى إلى الأبد!"]]}], "kwAr": "نهايته كنهاية الأعشاب المزهرة", "noteAr": ""}], "arS": [["وأما ", []], ["الغني", ["G4145"]], ["، فعليه أن يسر بأن ما له لا يغنيه عن ", []], ["الله", ["G5014"]], [": ", []], ["لأن", ["G3754"]], [" نهايته ", []], ["ستكون", ["G3928"]], [" ", []], ["كنهاية", ["G5613"]], [" ", []], ["الأعشاب", ["G5528"]], [" ", []], ["المزهرة", ["G438"]], [".", []]]}, {"c": 1, "v": 11, "text": "فعندما تشرق الشمس بحرها المحرق، تيبس تلك الأعشاب، فيسقط زهرها، ويتلاشى جمال منظرها. هكذا يذبل الغني في طرقه!", "groups": [{"kw": "risen", "raw": "Isa_49:10; Jon_4:7, Jon_4:8; Mat_13:6; Mar_4:6", "note": "", "refs": [{"l": "Isa 49:10", "n": "", "vs": [[10, "لا يجوعون ولا يعطشون، ولا يعييهم لهيب الصحراء ولا لفح الشمس، لأن راحمهم يهديهم ويقودهم إلى ينابيع المياه."]]}, {"l": "Jon 4:7", "n": "", "vs": [[7, "ولكن في فجر اليوم التالي أعد الله دودة قرضت اليقطينة فجفت."]]}, {"l": "Jon 4:8", "n": "", "vs": [[8, "فلما أشرقت الشمس، أرسل الله ريحا شرقية حارة لفحت رأس يونان، فأصابه الإعياء وتمنى لنفسه الموت قائلا: «خير لي أن أموت من أن أظل حيا»."]]}, {"l": "Mat 13:6", "n": "", "vs": [[6, "ولكن لما أشرقت الشمس، احترق ويبس لأنه كان بلا أصل."]]}, {"l": "Mar 4:6", "n": "", "vs": [[6, "ولكن لما أشرقت الشمس، احتر ق ويبس لأنه كان بلا أصل."]]}], "kwAr": "تشرق الشمس بحرها المحرق", "noteAr": ""}, {"kw": "so", "raw": "Jam_5:1-7; Job_21:24-30; Psa_37:35, Psa_37:36, Psa_49:6-14, Psa_73:18-20; Ecc_5:15; Isa_28:1, Isa_28:4, Isa_40:7, Isa_40:8; Luk_12:16-21, Luk_16:19-25; 1Co_7:31; 1Pe_1:4, 1Pe_5:4", "note": "", "refs": [{"l": "Jam 5:1-7", "n": "", "vs": [[1, "أيها الأغنياء، هيا الآن ابكوا مولولين بسبب ما ينتظركم من أهوال وشقاء."], [2, "إن ثرواتكم الكثيرة قد فسدت، وثيابكم الفاخرة قد أكلها العث"], [3, "ذهبكم وفضتكم قد تآكلا، وسيكون تآكلهما شاهدا ضدكم، ويأكل لحمكم كنار جمعتموها ثروة للأيام الأخيرة؟"], [4, "وهذه أجرة العمال الذين حصدوا حقولكم، تلك الأجرة التي مازلتم تحبسونها عنهم ظلما، إنها تصرخ، وصراخ أولئك العمال أنفسهم قد سمعه رب الجنود!"], [5, "أنتم تعيشون على الأرض عيشة رفاهية وانصراف إلى المباهج واللذات؛ وقد أصبحت قلوبكم سمينة كأنها جاهزة ليوم الذبح."], [6, "والبريء حكمتم عليه وقتلتموه، وهو لا يقاومكم!"], [7, "وأما أنتم، ياإخوتي، فاصبروا منتظرين عودة الرب. خذوا العبرة من الفلاح: فهو ينتظر أن تعطيه الأرض غلالا ثمينة، صابرا على الزرع حتى يشرب من مطر الخريف ومطر الربيع."]]}, {"l": "Job 21:24-30", "n": "", "vs": [[24, "والعافية تكسو جنبيه، ومخ عظامه طريء."], [25, "وقد يموت آخر بمرارة نفس ولم يذق خيرا"], [26, "غير أن كليهما يواريهما التراب ويغشاهما الدود."], [27, "انظروا، أنا مطلع على أفكاركم وما تتهمونني به جورا،"], [28, "لأنكم تقولون: أين هو منزل الرجل العظيم، وأين هي خيام الأشرار المقيمين فيها؟"], [29, "هلا سألتم عابري السبيل؟ ألا تكترثون لشهادتهم؟"], [30, "إن الشرير قد أفلت من يوم البوار، ونجا من العقاب في يوم الغضب."]]}, {"l": "Psa 37:35", "n": "", "vs": [[35, "قد رأيت الشرير مزدهرا وارفا كالشجرة الخضراء المتأصلة في تربة موطنها،"]]}, {"l": "Psa 37:36", "n": "", "vs": [[36, "ثم عبر ومضى، لم يوجد. فتشت عنه فلم أعثر له على أثر."]]}, {"l": "Psa 49:6-14", "n": "", "vs": [[6, "أولئك المتكلون على ثروتهم، وبوفرة غناهم يفتخرون."], [7, "لا يقدر أحد أبدا أن يفتدي أخاه أو يقدم لله كفارة عنه."], [8, "لأن فدية النفوس باهظة يتعذر دفعها مدى الحياة"], [9, "طلبا للخلود على الأرض وتفاديا لرؤية القبر."], [10, "لكن الحكماء يموتون كما يموت الجاهل والغبي، تاركين ثروتهم لغيرهم."], [11, "يتوهمون أن بيوتهم خالدة، وأن مساكنهم باقية من جيل إلى جيل، فأطلقوا أسماءهم على أراضيهم (تخليدا لذكرهم)."], [12, "ولكن الإنسان لا يخلد في أبهته. إنه يماثل البهائم التي تباد."], [13, "هذا هو مصير الجهال الواثقين بأنفسهم، ومصير أعقابهم الذين يستحسنون أقوالهم."], [14, "يساقون للموت كالأغنام، ويكون الموت راعيهم ويسود المستقيمون عليهم. تبلى صورتهم، وتصير الهاوية مسكنهم."]]}, {"l": "Psa 73:18-20", "n": "", "vs": [[18, "حقا إنك أوقفتهم في أماكن زلقة، وأوقعتهم في التهلكات."], [19, "كيف صاروا للخر اب فجأة؟ انقرضوا وأفنتهم الدواهي."], [20, "كحلم يتلاشى عند اليقظة هكذا تختفي صورتهم عندما تنهض يارب لمعاقبتهم."]]}, {"l": "Ecc 5:15", "n": "", "vs": [[15, "عريانا يخرج المرء من رحم أمه، وعريانا يفارق الدنيا كما جاء. لا يأخذ شيئا من تعبه يحمله معه في يده."]]}, {"l": "Isa 28:1", "n": "", "vs": [[1, "ويل (لمدينة السامرة) تاج فخر سكارى أفرايم، ولزهرة جمالها المجيدة الذابلة التي تتوج رأس وادي خصب المخمورين."]]}, {"l": "Isa 28:4", "n": "", "vs": [[4, "وتضحى زهرة جمالها المجيد التي تكلل رأس الوادي الخصيب كباكورة التين قبل موسم الصيف التي يراها الناظر فيقتطفها ويبتلعها."]]}, {"l": "Isa 40:7", "n": "", "vs": [[7, "يذبل العشب ويذوي الزهر لأن نفخة الرب تهب عليه. حقا إن الشعب عشب."]]}, {"l": "Isa 40:8", "n": "", "vs": [[8, "يذبل العشب ويذوي الزهر، أما كلمة إلهنا فتثبت إلى الأبد»."]]}, {"l": "Luk 12:16-21", "n": "", "vs": [[16, "وضرب لهم مثلا، قال «إنسان غني غلت له أرضه محاصيل وافرة."], [17, "ففكر في نفسه قائلا: ماذا أعمل وليس عندي مكان أخزن فيه محاصيلي؟"], [18, "وقال: أعمل هذا: أهدم مخازني وأبني أعظم منها، وهناك أخزن جميع غلالي وخيراتي."], [19, "وأقول لنفسي: يانفس، عندك خيرات كثيرة مخزونة لسنين عديدة، فاستريحي وكلي واشربي واطر بي!"], [20, "ولكن الله قال له: ياغبي، هذه الليلة تطلب نفسك منك، فلمن يبقى ما أعددته؟"], [21, "هذه هي حالة من يخزن الكنوز لنفسه ولا يكون غنيا عند الله!»"]]}, {"l": "Luk 16:19-25", "n": "", "vs": [[19, "كان هنالك إنسان غني، يلبس الأرجوان وناعم الثياب، ويقيم الولائم المترفة، متنعما كل يوم."], [20, "وكان إنسان مسكين اسمه لعازر، مطروحا عند بابه وهو مصاب بالقروح،"], [21, "يشتهي أن يشبع من الفتات المتساقط من مائدة الغني. حتى الكلاب كانت تأتاي وتلحس قروحه."], [22, "ومات المسكين، وحملته الملائكة إلى حضن إبراهيم. ثم مات الغني أيضا ودفن."], [23, "وإذ رفع عينيه وهو في الهاوية يتعذب، رأى إبراهيم من بعيد ولعازر في حضنه."], [24, "فنادى قائلا: ياأباي إبراهيم! ارحمني، وأرسل لعازر ليغمس طرف إصبعه في الماء ويبرد لساني: فإني معذب في هذا اللهيب."], [25, "ولكن إبراهيم قال: يابني، تذكر أنك نلت خيراتك كاملة في أثناء حياتك، ولعازر نال البلايا. ولكنه الآن يتعزى هنا، وأنت هناك تتعذب."]]}, {"l": "1Co 7:31", "n": "", "vs": [[31, "والذين يستغلون هذا العالم كأنهم لا يستغلونه. ذلك لأن طراز هذا العالم زائل."]]}, {"l": "1Pe 1:4", "n": "", "vs": [[4, "وإرثا لا يفنى ولا يفسد ولا يزول،"]]}, {"l": "1Pe 5:4", "n": "", "vs": [[4, "وعندما يظهر رئيس الرعاة، تنالون إكليل المجد الذي لا يفنى."]]}], "kwAr": "هكذا يذبل الغني", "noteAr": ""}], "arS": [["فعندما ", []], ["تشرق", ["G393"]], [" ", []], ["الشمس", ["G2246"]], [" بحرها ", []], ["المحرق", ["G2742"]], ["، ", []], ["تيبس", ["G3583"]], [" تلك ", []], ["الأعشاب", ["G5528"]], ["، ", []], ["فيسقط", ["G1601"]], [" ", []], ["زهرها", ["G438"]], ["، ", []], ["ويتلاشى", ["G622"]], [" ", []], ["جمال", ["G2143"]], [" ", []], ["منظرها", ["G4383"]], [". ", []], ["هكذا", ["G3779"]], [" ", []], ["يذبل", ["G3133"]], [" ", []], ["الغني", ["G4145"]], [" في ", []], ["طرقه", ["G4197"]], ["!", []]]}, {"c": 1, "v": 12, "text": "طوبى لمن يتحمل المحنة بصبر. فإنه، بعد أن يجتاز الامتحان بنجاح، سينال «إكليل الحياة» الذي وعد به الرب محبيه!", "groups": [{"kw": "the man", "raw": "Jam_1:2-4, Jam_5:11; Job_5:17; Psa_94:12, Psa_119:67, Psa_119:71, Psa_119:75; Pro_3:11, Pro_3:12; Heb_6:15; Heb_10:32, Heb_12:5; Rev_3:19", "note": "", "refs": [{"l": "Jam 1:2-4", "n": "", "vs": [[2, "ياإخوتي، عندما تنزل بكم التجارب والمحن المختلفة، اعتبروها سبيلا إلى الفرح الكلي."], [3, "وكونوا على ثقة بأن امتحان إيمانكم هذا ينتج صبرا."], [4, "ودعوا الصبر يعمل عمله الكامل فيكم، لكي يكتمل نضوجكم وتصيروا أقوياء قادرين على مواجهة جميع الأحوال."]]}, {"l": "Jam 5:11", "n": "", "vs": [[11, "فنحن نقول عن الصابرين على الألم: «طوبى لهم!» وقد سمعتم بصبر أيوب، ورأيتم كيف عامله الرب في النهاية. وهذا يبين أن الرب كثير الرحمة والشفقة."]]}, {"l": "Job 5:17", "n": "", "vs": [[17, "طوبى للرجل الذي يقومه الله ، فلا ترفض تأديب القدير."]]}, {"l": "Psa 94:12", "n": "", "vs": [[12, "طوبى للإنسان الذي تؤدبه، وتعلمه من شريعتك يارب!"]]}, {"l": "Psa 119:67", "n": "", "vs": [[67, "ضللت قبل أن أدبتني، أما الآن فحفظت كلامك."]]}, {"l": "Psa 119:71", "n": "", "vs": [[71, "كان ما ذقت من هوان لخيري فتعلمت فرائضك."]]}, {"l": "Psa 119:75", "n": "", "vs": [[75, "قد علمت يارب أن أحكامك عادلة، وأنك بالحق أدبتني."]]}, {"l": "Pro 3:11", "n": "", "vs": [[11, "ياابني لا تحتقر تأديب الرب ولا تكره توبيخه،"]]}, {"l": "Pro 3:12", "n": "", "vs": [[12, "لأن الرب يؤدب من يحبه، ويسر به كما يسر أب بابنه."]]}, {"l": "Heb 6:15", "n": "", "vs": [[15, "وهكذا، انتظر إبراهيم بصبر فنال ما وعد به."]]}, {"l": "Heb 10:32", "n": "", "vs": [[32, "لا تنسوا أبدا تلك الأيام الماضية التي فيها، بعدما أشرق عليكم نور الإيمان بالمسيح، صبرتم على جهاد مرير طويل، إذ قاسيتم كثيرا من الآلام."]]}, {"l": "Heb 12:5", "n": "", "vs": [[5, "فهل نسيتم الوعظ الذي يخاطبكم به الله بوصفكم أبناء له؟ إذ يقول: «ياابني، لا تستخف بتأديب الرب. ولا تفقد العزيمة حين يوبخك على الخطأ."]]}, {"l": "Rev 3:19", "n": "", "vs": [[19, "إني أوبخ وأؤدب من أحبه، لذا كن حارا وتب!"]]}], "kwAr": "طوبى لمن يتحمل المحنة", "noteAr": ""}, {"kw": "when", "raw": "Deu_8:2, Deu_13:3; Pro_17:3; Zec_13:9; Mal_3:2, Mal_3:3; Heb_11:17; 1Pe_1:6, 1Pe_1:7; 1Pe_5:10", "note": "", "refs": [{"l": "Deu 8:2", "n": "", "vs": [[2, "وتذكروا كيف قادكم الرب إلهكم في كل طريق الصحراء هذه الأربعين سنة ليذلكم ويمتحنكم، فيعرف ما في قلوبكم: إن كنتم تحفظون أوامره أم تعصونه."]]}, {"l": "Deu 13:3", "n": "", "vs": [[3, "فلا تصغوا إلى كلام ذلك النبي أو صاحب الأحلام، لأن الرب إلهكم يجربكم ليرى إن كنتم تحبونه من كل قلوبكم ومن كل أنفسكم،"]]}, {"l": "Pro 17:3", "n": "", "vs": [[3, "كما تنقي البوتقة الفضة، والكور الذهب، فإن الرب يمتحن القلوب أيضا."]]}, {"l": "Zec 13:9", "n": "", "vs": [[9, "فأجيز هذا الثلث في النار لأنقيه تنقية الفضة، وأمحصه كما يمحص الذهب. هو يدعو باسمي وأنا أستجيبه. أنا أقول: هو شعبي، وهو يقول: الرب هو إلهي»."]]}, {"l": "Mal 3:2", "n": "", "vs": [[2, "ولكن من يحتمل يوم مجيئه؟ ومن يثبت عند ظهوره؟ فإنه مثل نار الممحص أو أشنان القصارين."]]}, {"l": "Mal 3:3", "n": "", "vs": [[3, "فيجلس ممحصا ومنقيا للفضة ليطهر أبناء لاوي ويمحصهم كالفضة والذهب، حتى يقربوا للرب تقدمات بقلوب طاهرة."]]}, {"l": "Heb 11:17", "n": "", "vs": [[17, "وبالإيمان، إبراهيم أيضا، لما امتحنه الله ، قدم إسحاق ابنه. فإنه، إذ قبل وعود الله، قدم ابنه الوحيد ذبيحة،"]]}, {"l": "1Pe 1:6", "n": "", "vs": [[6, "وهذا يدعوكم إلى الابتهاج، مع أنه لابد لكم الآن من الحزن فترة قصيرة تحت وطأة التجارب المتنوعة!"]]}, {"l": "1Pe 1:7", "n": "", "vs": [[7, "إلا أن غاية هذه التجارب هي اختبار حقيقة إيمانكم. فكما تختبر النار الذهب وتنقيه، تختبر التجارب حقيقة إيمانكم، وهو أثمن جدا من الذهب الفاني. وهكذا، يكون إيمانكم مدعاة مدح وإكرام وتمجيد لكم، عندما يعود يسوع المسيح ظاهرا بمجده."]]}, {"l": "1Pe 5:10", "n": "", "vs": [[10, "وبعد أن تتألموا لفترة قصيرة، فإن الله ، إله كل نعمة، الذي دعاكم إلى الاشتراك في مجده الأبدي في المسيح، لابد أن يجعلكم كاملين وثابتين ومؤيدين بالقوة وراسخين."]]}], "kwAr": "بعد أن يجتاز الامتحان", "noteAr": ""}, {"kw": "the crown", "raw": "Mat_25:34; Luk_22:28-30; Rom_2:7-10; 1Co_9:25; 2Ti_4:8; 1Pe_1:7, 1Pe_4:13; 1Pe_5:4; Rev_2:10, Rev_3:21", "note": "", "refs": [{"l": "Mat 25:34", "n": "", "vs": [[34, "ثم يقول الملك للذين عن يمينه: تعالوا يامن باركهم أبي، رثوا الملكوت الذي أعد لكم منذ إنشاء العالم:"]]}, {"l": "Luk 22:28-30", "n": "", "vs": [[28, "أنتم هم الذين صمدوا معي في تجاربي."], [29, "وأنا أعين لكم، كما عين لي أبي، ملكوتا،"], [30, "لكي تأكلوا وتشربوا على مائدتي في ملكوتي، وتجلسوا على عروش تدينون أسباط إسرائيل الاثني عشر."]]}, {"l": "Rom 2:7-10", "n": "", "vs": [[7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"], [8, "ويكون الغضب والسخط للمخاصمين الذين يرفضون الطاعة للحق ولكنهم يخضعون للإثم."], [9, "فالشدة والضيق على نفس كل إنسان يعمل الشر اليهودي أولا ثم اليوناني؛"], [10, "والمجد والكرامة والسلام لكل من يعمل الصلاح اليهودي أولا، ثم اليوناني ."]]}, {"l": "1Co 9:25", "n": "", "vs": [[25, "وكل متبار يفرض على نفسه تدريبا صارما في شتى المجالات. فهؤلاء المتبارون يفعلون ذلك ليفوزوا بإكليل فان، وأما نحن فلنفوز بإكليل غير فان."]]}, {"l": "2Ti 4:8", "n": "", "vs": [[8, "إنما ينتظرني الآن إكليل البر المحفوظ لي، والذي سيهبه لي الرب الديان العادل في ذلك اليوم؛ ولن يوهب لي وحدي، بل أيضا لجميع الذين يحبون ظهوره."]]}, {"l": "1Pe 1:7", "n": "", "vs": [[7, "إلا أن غاية هذه التجارب هي اختبار حقيقة إيمانكم. فكما تختبر النار الذهب وتنقيه، تختبر التجارب حقيقة إيمانكم، وهو أثمن جدا من الذهب الفاني. وهكذا، يكون إيمانكم مدعاة مدح وإكرام وتمجيد لكم، عندما يعود يسوع المسيح ظاهرا بمجده."]]}, {"l": "1Pe 4:13", "n": "", "vs": [[13, "وإنما افرحوا: لأنكم كما تشاركون المسيح في الآلام الآن، لابد أن تفرحوا بمشاركته في الابتهاج عند ظهور مجده."]]}, {"l": "1Pe 5:4", "n": "", "vs": [[4, "وعندما يظهر رئيس الرعاة، تنالون إكليل المجد الذي لا يفنى."]]}, {"l": "Rev 2:10", "n": "", "vs": [[10, "دع عنك الخوف مما ينتظرك من آلام، فإن إبليس سيزج ببعضكم في السجن لكي تمتحنوا، فتقاسون الاضطهاد عشرة أيام. فابق أمينا حتى الموت، فأمنحك إكليل الحياة."]]}, {"l": "Rev 3:21", "n": "", "vs": [[21, "وكل من ينتصر سأجلسه معي على عرشي، كما انتصرت أنا أيضا فجلست مع أبي على عرشه؛"]]}], "kwAr": "إكليل الحياة", "noteAr": ""}, {"kw": "which", "raw": "Jam_2:5; Isa_64:4; Mat_10:22, Mat_19:28, Mat_19:29", "note": "", "refs": [{"l": "Jam 2:5", "n": "", "vs": [[5, "فياإخوتي الأحباء، أما اختار الله الفقراء في نظر الناس ليجعلهم أغنياء في الإيمان، ويعطيهم حق الإرث في الملكوت الذي وعد به محبيه؟"]]}, {"l": "Isa 64:4", "n": "", "vs": [[4, "منذ الأزل لم يسمع أحد ولم تصغ أذن ولم تر عين إلها سواك يجري ما تصنعه للذين ينتظرونك."]]}, {"l": "Mat 10:22", "n": "", "vs": [[22, "وتكونون مكروهين لدى الجميع من أجل اسمي. ولكن من يثبت إلى النهاية، هو الذي يخلص."]]}, {"l": "Mat 19:28", "n": "", "vs": [[28, "فأجابهم يسوع: «الحق أقول لكم: إنه عندما يجلس ابن الإنسان على عرش مجده في زمن التجديد، تجلسون أنتم الذين تبعتموني على اثني عشر عرشا لتدينوا أسباط إسرائيل الاثني عشر."]]}, {"l": "Mat 19:29", "n": "", "vs": [[29, "فأي من ترك بيوتا أو إخوة أو أخوات أو أبا أو أما أو أولادا أو أراضي من أجل اسمي، ينال مئة ضعف ويرث الحياة الأبدية."]]}], "kwAr": "الذي وعد به الرب", "noteAr": ""}, {"kw": "them", "raw": "Jam_2:5; Exo_20:6; Deu_7:9; Neh_1:5; Psa_5:11; Rom_8:28; 1Co_2:9, 1Co_8:3; 1Pe_1:8; 1Jo_4:19", "note": "", "refs": [{"l": "Jam 2:5", "n": "", "vs": [[5, "فياإخوتي الأحباء، أما اختار الله الفقراء في نظر الناس ليجعلهم أغنياء في الإيمان، ويعطيهم حق الإرث في الملكوت الذي وعد به محبيه؟"]]}, {"l": "Exo 20:6", "n": "", "vs": [[6, "وأبدي إحسانا نحو ألوف من محبي الذين يطيعون وصاياي."]]}, {"l": "Deu 7:9", "n": "", "vs": [[9, "فاعلموا أن الرب إلهكم هو الله ، الإله الأمين الوفي بالعهد والإحسان لمحبيه وحافظي وصاياه إلى ألف جيل."]]}, {"l": "Neh 1:5", "n": "", "vs": [[5, "قائلا: أيها الرب إله السماء، أيها الإله العظيم المرهوب، الذي يحافظ على عهد رحمته لمحبيه وحافظي وصاياه،"]]}, {"l": "Psa 5:11", "n": "", "vs": [[11, "ويبتهج جميع المتكلين عليك. إلى الأبد يترنمون، لأنك تظللهم بحمايتك، فيفرح بك الذين يحبون اسمك."]]}, {"l": "Rom 8:28", "n": "", "vs": [[28, "وإننا نعلم أن الله يجعل جميع الأمور تعمل معا لأجل الخير لمحبيه، المدعوين بحسب قصده."]]}, {"l": "1Co 2:9", "n": "", "vs": [[9, "لما صلبوا رب المجد! ولكن، وفقا لما كتب: «إن ما لم تره عين، ولم تسمع به أذن، ولم يخطر على بال بشر قد أعده الله لمحبيه!»"]]}, {"l": "1Co 8:3", "n": "", "vs": [[3, "أما الذي يحب الله ، فإن الله يعرفه."]]}, {"l": "1Pe 1:8", "n": "", "vs": [[8, "أنتم لم تروا المسيح، ولكنكم تحبونه. ومع أنكم لا ترونه الآن، فأنتم تؤمنون به وتبتهجون بفرح مجيد يفوق الوصف."]]}, {"l": "1Jo 4:19", "n": "", "vs": [[19, "ونحن نحب، لأن الله أحبنا أولا."]]}], "kwAr": "محبيه", "noteAr": ""}], "arS": [["طوبى", ["G3107"]], [" لمن ", []], ["يتحمل", ["G5278"]], [" ", []], ["المحنة", ["G3986"]], [" بصبر. فإنه، بعد أن يجتاز ", []], ["الامتحان", ["G1096", "G1384"]], [" بنجاح، ", []], ["سينال", ["G2983"]], [" «", []], ["إكليل", ["G4735"]], [" ", []], ["الحياة", ["G2222"]], ["» الذي ", []], ["وعد", ["G1861"]], [" به ", []], ["الرب", ["G2962"]], [" ", []], ["محبيه", ["G25"]], ["!", []]]}, {"c": 1, "v": 13, "text": "وإذا تعرض أحد لتجربة ما، فلا يقل: «إن الله يجربني!» ذلك لأن الله لا يمكن أن يجربه الشر، وهو لا يجرب به أحدا.", "groups": [{"kw": "no man", "raw": "Jam_1:2, Jam_1:12; Gen_3:12; Isa_63:17; Hab_2:12, Hab_2:13; Rom_9:19, Rom_9:20,", "note": "", "refs": [{"l": "Jam 1:2", "n": "", "vs": [[2, "ياإخوتي، عندما تنزل بكم التجارب والمحن المختلفة، اعتبروها سبيلا إلى الفرح الكلي."]]}, {"l": "Jam 1:12", "n": "", "vs": [[12, "طوبى لمن يتحمل المحنة بصبر. فإنه، بعد أن يجتاز الامتحان بنجاح، سينال «إكليل الحياة» الذي وعد به الرب محبيه!"]]}, {"l": "Gen 3:12", "n": "", "vs": [[12, "فأجاب آدم: «إنها المرأة التي جعلتها رفيقة لي. هي التي أطعمتني من ثمر الشجرة، فأكلت»."]]}, {"l": "Isa 63:17", "n": "", "vs": [[17, "لماذا يارب تركتنا نضل عن طرقك وقسيت قلوبنا حتى لم نعد نتقيك؟ ارجع إلينا من أجل عبيدك، أسباط ميراثك."]]}, {"l": "Hab 2:12", "n": "", "vs": [[12, "ويل لمن يبني مدينة بالدماء، ويؤسس قرية بالإثم."]]}, {"l": "Hab 2:13", "n": "", "vs": [[13, "ألم يصدر القضاء من عند الرب القدير أن يؤول تعب الشعوب إلى النار وجهد الأمم إلى الباطل؟"]]}, {"l": "Rom 9:19", "n": "", "vs": [[19, "هنا ستقول لي: «لماذ يلوم بعد؟ من يقاوم قصده؟»"]]}, {"l": "Rom 9:20", "n": "", "vs": [[20, "فأقول: من أنت أيها الإنسان حتى ترد جوابا على الله؟ أيقول الشيء المصنوع لصانعه: لماذا صنعتني هكذا؟"]]}], "kwAr": "فلا يقل: إن الله يجربني", "noteAr": ""}, {"kw": "evil", "raw": "or, evils", "note": "or, evils", "refs": [], "kwAr": "الشر", "noteAr": "أو: الشرور."}], "arS": [["وإذا تعرض أحد ", []], ["لتجربة", ["G3985"]], [" ما، فلا ", []], ["يقل", ["G3367", "G3004"]], [": «إن ", []], ["الله", ["G2316"]], [" ", []], ["يجربني", ["G3985"]], ["!» ذلك ", []], ["لأن", ["G1063"]], [" ", []], ["الله", ["G2316"]], [" لا يمكن أن ", []], ["يجربه", ["G551"]], [" ", []], ["الشر", ["G2556"]], ["، وهو لا ", []], ["يجرب", ["G3985"]], [" به ", []], ["أحدا", ["G3762"]], [".", []]]}, {"c": 1, "v": 14, "text": "ولكن الإنسان يسقط في التجربة حين يندفع مخدوعا وراء شهوته.", "groups": [{"kw": "when", "raw": "Jam_4:1, Jam_4:2; Gen_6:5, Gen_8:21; Jos_7:21-24; 2Sa_11:2, 2Sa_11:3; 1Ki_21:2-4; Job_31:9; Job_31:27; Pro_4:23; Isa_44:20; Hos_13:9; Mat_5:28, Mat_15:18, Mat_15:20; Mar_7:21; Mar_7:22; Rom_7:11, Rom_7:13; Eph_4:22; Heb_3:13", "note": "", "refs": [{"l": "Jam 4:1", "n": "", "vs": [[1, "من أين النزاع والخصام بينكم؟ أليس من لذاتكم تلك المتصارعة في أعضائكم؟"]]}, {"l": "Jam 4:2", "n": "", "vs": [[2, "فأنتم ترغبون في امتلاك ما لا يخصكم، لكن ذلك لا يتحقق لكم، فتقتلون، وتحسدون، ولا تتمكنون من بلوغ غايتكم. وهكذا تتخاصمون وتتصارعون! إنكم لا تمتلكون ما تريدونه، لأنكم لا تطلبونه من الله."]]}, {"l": "Gen 6:5", "n": "", "vs": [[5, "ورأى الرب أن شر الإنسان قد كثر في الأرض، وأن كل تصور فكر قلبه يتسم دائما بالإثم،"]]}, {"l": "Gen 8:21", "n": "", "vs": [[21, "فتقبلها الرب برضى، وقال في نفسه: «لن ألعن الأرض مرة أخرى من أجل الإنسان، لأن أهواء قلب الإنسان شريرة منذ حداثته ولن أقدم على إهلاك كل حي كما فعلت."]]}, {"l": "Jos 7:21-24", "n": "", "vs": [[21, "رأيت بين الغنائم رداء شنعاريا نفيسا، ومئتي شاقل فضة (نحو كيلوجرامين ونصف)، وسبيكة من ذهب وزنها خمسون شاقلا (نحو ست مئة جرام)، فاشتهيتها وأخذتها. وها هي مطمورة في الأرض في وسط خيمتي، والفضة تحتها»."], [22, "فأرسل يشوع رسلا فهرعوا إلى الخيمة حيث عثروا عليها مطمورة فيها، والفضة تحتها،"], [23, "فأخرجوها من وسط الخيمة وحملوها إلى يشوع وإلى جميع بني إسرائيل وعرضوها أمام الرب."], [24, "فأخذ يشوع وجميع بني إسرائيل عخان بن زارح والفضة والرداء وسبيكة الذهب، وأبناءه وبناته وبقره وحميره وغنمه وخيمته وكل ماله، وذهبوا بهم إلى وادي عخور."]]}, {"l": "2Sa 11:2", "n": "", "vs": [[2, "وفي إحدى الأمسيات نهض داود عن سريره وأخذ يتمشى على سطح قصره، فشاهد امرأة ذات جمال أخاذ تستحم."]]}, {"l": "2Sa 11:3", "n": "", "vs": [[3, "فأرسل داود من يتحرى عنها. فأبلغه أحدهم: «هذه بثشبع بنت أليعام زوجة أوريا الحثي»،"]]}, {"l": "1Ki 21:2-4", "n": "", "vs": [[2, "فقال أخآب لنابوت: «قايضني كرمك لأجعله حديقة خضروات، لأنه مجاور لقصري، فأعطيك بدلا منه كرما أفضل منه، أو إذا راق لك أدفع ثمنه فضة»."], [3, "فأجاب نابوت: «معاذ الله أن أفرط في ميراث آبائي»."], [4, "فدخل أخآب قصره مكتئبا مهموما متأثرا من قول نابوت اليزرعيلي: «لا أفرط في ميراث آبائي». واستلقى فوق سريره مشيحا بوجهه نحو الحائط عازفا عن الطعام."]]}, {"l": "Job 31:9", "n": "", "vs": [[9, "إن هام قلبي وراء امرأة، أو طفت عند باب جاري،"]]}, {"l": "Job 31:27", "n": "", "vs": [[27, "فغوي قلبي سرا وقبلت يدي توقيرا لهما،"]]}, {"l": "Pro 4:23", "n": "", "vs": [[23, "فوق كل حرص احفظ قلبك لأن منه تنبثق الحياة."]]}, {"l": "Isa 44:20", "n": "", "vs": [[20, "لكأنه يأكل الرماد! يجري وراء سراب ويعجز عن إنقاذ نفسه أو الاعتراف أن الصنم الذي يمسكه بيده هو محض ضلال!"]]}, {"l": "Hos 13:9", "n": "", "vs": [[9, "هلاكك منك ياإسرائيل لأنك عاديتني. عاديت معينك."]]}, {"l": "Mat 5:28", "n": "", "vs": [[28, "أما أنا فأقول لكم: كل من ينظر إلى امرأة بقصد أن يشتهيها، فقد زنى بها في قلبه!"]]}, {"l": "Mat 15:18", "n": "", "vs": [[18, "أما ما يخرج من الفم، فإنه من القلب يصدر، وهو الذي ينجس الإنسان."]]}, {"l": "Mat 15:20", "n": "", "vs": [[20, "هذه هي الأمور التي تنجس الإنسان. وأما تناول الطعام بأيد غير مغسولة، فلا ينجس الإنسان! »"]]}, {"l": "Mar 7:21", "n": "", "vs": [[21, "فإنه من الداخل، من قلوب الناس، تنبع الأفكار الشريرة، الفسق، السرقة، القتل،"]]}, {"l": "Mar 7:22", "n": "", "vs": [[22, "الزنى، الطمع، الخبث، الخداع، العهارة، العين الشريرة، التجديف، الكبرياء، الحماقة"]]}, {"l": "Rom 7:11", "n": "", "vs": [[11, "فإن الخطيئة، إذ استغلت الوصية، خدعتني وقتلتني بها."]]}, {"l": "Rom 7:13", "n": "", "vs": [[13, "فهل صار ما هو صالح موتا لي؟ حاشا! ولكن الخطيئة، لكي تظهر أنها خطيئة، أنتجت لي الموت بما هو صالح، حتى تصير الخطيئة خاطئة جدا بسبب الوصية."]]}, {"l": "Eph 4:22", "n": "", "vs": [[22, "وهو أن تخلعوا ما يتعلق بسيرتكم الماضية: الإنسان العتيق الذي يفسد نفسه بالشهوات الخداعة؛"]]}, {"l": "Heb 3:13", "n": "", "vs": [[13, "وإنما، شجعوا بعضكم بعضا كل يوم، مادمنا نقول: «اليوم...». وذلك لكي لا تقسي الخطيئة قلب أحد منكم بخداعها."]]}], "kwAr": "حين يندفع مخدوعا وراء شهوته", "noteAr": ""}], "arS": [["ولكن ", []], ["الإنسان", ["G1538"]], [" يسقط في ", []], ["التجربة", ["G3985"]], [" حين ", []], ["يندفع", ["G1828"]], [" ", []], ["مخدوعا", ["G1185"]], [" وراء ", []], ["شهوته", ["G2398", "G1939"]], [".", []]]}, {"c": 1, "v": 15, "text": "فإذا ما حبلت الشهوة ولدت الخطيئة. ومتى نضجت الخطيئة، أنتجت الموت.", "groups": [{"kw": "when", "raw": "Gen_3:6, Gen_4:5-8; Job_15:35; Psa_7:14; Isa_59:4; Mic_2:1-3; Mat_26:14, Mat_26:48-59; Act_5:1-3", "note": "", "refs": [{"l": "Gen 3:6", "n": "", "vs": [[6, "وعندما شاهدت المرأة أن الشجرة لذيذة للمأكل وشهية للعيون، ومثيرة للنظر قطفت من ثمرها وأكلت، ثم أعطت زوجها أيضا فأكل معها،"]]}, {"l": "Gen 4:5-8", "n": "", "vs": [[5, "لكنه لم يتقبل قربان قايين ولم يرض عنه. فاغتاظ قايين جدا وتجهم وجهه كمدا."], [6, "فسأل الرب قايين: «لماذا اغتظت؟ لماذا تجهم وجهك؟"], [7, "لو أحسنت في تصرفك ألا يشرق وجهك فرحا؟ وإن لم تحسن التصرف، فعند الباب خطيئة تنتظرك، تتشوق أن تتسلط عليك، لكن يجب أن تتحكم فيها»"], [8, "وعاد قايين يتظاهر بالود لأخيه هابيل. وحدث إذ كانا معا في الحقل أن قايين هجم على أخيه هابيل وقتله."]]}, {"l": "Job 15:35", "n": "", "vs": [[35, "حبلوا شقاوة وأنجبوا إثما، وولدت بطونهم غشا»."]]}, {"l": "Psa 7:14", "n": "", "vs": [[14, "هوذا العدو يتمخض بالإثم، يحبل بالأذى، ويلد كذبا."]]}, {"l": "Isa 59:4", "n": "", "vs": [[4, "ليس بينكم من يطالب بالعدل، أو يحكم بالحق. يتكلون على الباطل ويتفوهون بالزور، يحبلون بالغش، ويلدون بالإثم."]]}, {"l": "Mic 2:1-3", "n": "", "vs": [[1, "ويل للمتآمرين بالسوء، الذين يحوكون الشر وهم في مضاجعهم، الذين ينفذون عند طلوع الصباح ما خططوا له، لأن ذلك في متناول قدرتهم."], [2, "يشتهون حقولا ويغتصبونها، وبيوتا فيستولون عليها. يجورون على الرجل وعلى بيته والإنسان وميراثه."], [3, "لهذا، هكذا يقول الرب. ها أنا أدبر شرا لهذا الشعب تعجزون عن فك رقابكم منه، ولن تمشوا بعد متشامخين لأن الزمن يكون زمن سوء."]]}, {"l": "Mat 26:14", "n": "", "vs": [[14, "عندئذ ذهب واحد من الاثني عشر، وهو المدعو يهوذا الإسخريوطي، إلى رؤساء الكهنة،"]]}, {"l": "Mat 26:48-59", "n": "", "vs": [[48, "وكان مسلمه قد أعطاهم علامة قائلا: «الذي أقبله فهو هو؛ فاقبضوا عليه!»"], [49, "فتقدم في الحال إلى يسوع وقال: «سلام ياسيدي!» وقبله."], [50, "فقال له يسوع: «ياصاحبي، لماذا أنت هنا؟» فتقدم الجمع وألقوا القبض على يسوع."], [51, "وإذا واحد من الذين كانوا مع يسوع قد مد يده واستل سيفه، وضرب عبد رئيس الكهنة، فقطع أذنه."], [52, "فقال يسوع له: «رد سيفك إلى غمده! فإن الذين يلجأون إلى السيف، بالسيف يهلكون!"], [53, "أم تظن أني لا أقدر الآن أن أطلب إلى أبي فيرسل لي أكثر من اثني عشر جيشا من الملائكة؟"], [54, "ولكن كيف يتم الكتاب حيث يقول إن ما يحدث الآن لابد أن يحدث؟ »"], [55, "ثم وجه يسوع كلامه إلى الجموع قائلا: «أكما على لص خرجتم بالسيوف والعصي لتقبضوا علي؟ كنت كل يوم بينكم أعلم في الهيكل، ولم تقبضوا علي!"], [56, "ولكن، قد حدث هذا كله لتتم كتابات الأنبياء!» عندئذ تركه التلاميذ كلهم وهربوا!"], [57, "وأما الذين قبضوا على يسوع، فساقوه إلى قيافا رئيس الكهنة، وقد اجتمع عنده الكتبة والشيوخ."], [58, "وتبعه بطرس من بعيد إلى دار رئيس الكهنة، ثم تقدم إلى الداخل، وجلس بين الحراس ليرى النهاية."], [59, "وانعقد المجلس من رؤساء الكهنة والشيوخ كلهم، وبحثوا عن شهادة زور على يسوع، ليحكموا عليه بالموت،"]]}, {"l": "Act 5:1-3", "n": "", "vs": [[1, "ولكن رجلا اسمه حنانيا، اتفق مع زوجته سفيرة فباع حقلا كان يملكه،"], [2, "واحتفظ لنفسه بجزء من الثمن بعلم من زوجته، وجاء بما تبقى ووضعه عند أقدام الرسل."], [3, "فقال له بطرس: «ياحنانيا، لماذا سمحت للشيطان أن يملأ قلبك، فكذبت على الروح القدس، واحتفظت لنفسك بجزء من ثمن الحقل؟"]]}], "kwAr": "حبلت الشهوة ولدت الخطيئة", "noteAr": ""}, {"kw": "when", "raw": "Gen_2:17, Gen_3:17-19; Psa_9:17; Rom_5:12-21, Rom_6:21-23; Rev_20:14, Rev_20:15", "note": "", "refs": [{"l": "Gen 2:17", "n": "", "vs": [[17, "ولكن إياك أن تأكل من شجرة معرفة الخير والشر لأنك حين تأكل منها حتما تموت»."]]}, {"l": "Gen 3:17-19", "n": "", "vs": [[17, "وقال لآدم: «لأنك أذعنت لقول امرأتك، وأكلت من الشجرة التي نهيتك عنها، فالأرض ملعونة بسببك وبالمشقة تقتات منها طوال عمرك."], [18, "شوكا وحسكا تنبت لك، وأنت تأكل عشب الحقل."], [19, "بعرق جبينك تكسب عيشك حتى تعود إلى الأرض، فمن تراب أخذت، وإلى تراب تعود»."]]}, {"l": "Psa 9:17", "n": "", "vs": [[17, "مآل الأشرار إلى الجحيم. وكذلك جميع الأمم الناسين الله ."]]}, {"l": "Rom 5:12-21", "n": "", "vs": [[12, "ولهذا، فكما دخلت الخطيئة إلى العالم على يد إنسان واحد، وبدخول الخطيئة دخل الموت، هكذا جاز الموت على جميع البشر، لأنهم جميعا أخطأوا."], [13, "فإن الخطيئة كانت منتشرة في العالم قبل مجيء الشريعة. إلا أن الخطيئة ما كانت تسجل، لأن الشريعة لم تكن موجودة."], [14, "أما الموت، فقد ملك منذ آدم إلى موسى، حتى على الذين لم يرتكبوا خطيئة شبيهة بمخالفة آدم، الذي هو رمز للآتي بعده."], [15, "ولكن مفعول المعصية ليس كمفعول النعمة! فإذا كان الكثيرون بمعصية إنسان واحد قد ماتوا، فكم بالأحرى في الإنسان الواحد يسوع المسيح تتوافر للكثيرين نعمة الله والعطية المجانية بالنعمة."], [16, "ثم إن أثر خطيئة إنسان واحد ليس كأثر الهبة! فإن الحكم من جراء معصية واحدة يؤدي إلى الدينونة. وأما فعل النعمة، من جراء معاص كثيرة، فيؤدي إلى التبرير."], [17, "فما دام الموت بمعصية الإنسان الواحد، قد ملك بذلك الواحد، فكم بالأحرى يملك في الحياة بيسوع المسيح الواحد أولئك الذين ينالون فيض النعمة وعطية البر المجانية."], [18, "فإذن، كما أن معصية واحدة جلبت الدينونة على جميع البشر، كذلك فإن برا واحدا يجلب التبرير المؤدي إلى الحياة
