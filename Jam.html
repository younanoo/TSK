 لجميع البشر."], [19, "فكما أنه بعصيان الإنسان الواحد جعل الكثيرون خاطئين، فكذلك أيضا بطاعة الواحد سيجعل الكثيرون أبرارا."], [20, "وأما الشريعة فقد أدخلت لتظهر كثرة المعصية. ولكن، حيث كثرت الخطيئة، تتوافر النعمة أكثر جدا،"], [21, "حتى إنه كما ملكت الخطيئة بالموت، فكذلك أيضا تملك النعمة على أساس البر مؤدية إلى الحياة الأبدية بيسوع المسيح ربنا."]]}, {"l": "Rom 6:21-23", "n": "", "vs": [[21, "ولكن أي ثمر أنتجتم حينذاك من الأمور التي تخجلون بها الآن، وما عاقبتها إلا الموت؟"], [22, "أما الآن، وقد حررتم من الخطيئة وصرتم عبيدا لله، فإن لكم ثمركم للقداسة، والعاقبة هي الحياة الأبدية."], [23, "لأن أجرة الخطيئة هي الموت، وأما هبة الله فهي الحياة الأبدية في المسيح يسوع ربنا."]]}, {"l": "Rev 20:14", "n": "", "vs": [[14, "وطرح الموت وهاوية الموتى في بحيرة النار، الذي هو الموت الثاني."]]}, {"l": "Rev 20:15", "n": "", "vs": [[15, "وكل من لم يوجد اسمه مكتوبا في سجل الحياة طرح في بحيرة النار!"]]}], "kwAr": "متى نضجت الخطيئة أنتجت الموت", "noteAr": ""}], "arS": [["فإذا ما ", []], ["حبلت", ["G4815"]], [" ", []], ["الشهوة", ["G1939"]], [" ", []], ["ولدت", ["G5088"]], [" ", []], ["الخطيئة", ["G266"]], [". ومتى ", []], ["نضجت", ["G658"]], [" ", []], ["الخطيئة", ["G266"]], ["، ", []], ["أنتجت", ["G616"]], [" ", []], ["الموت", ["G2288"]], [".", []]]}, {"c": 1, "v": 16, "text": "فيا إخوتي الأحباء، لا تضلوا:", "groups": [{"kw": "Do", "raw": "Mat_22:29; Mar_12:24, Mar_12:27; Gal_6:7; Col_2:4, Col_2:8; 2Ti_2:18", "note": "", "refs": [{"l": "Mat 22:29", "n": "", "vs": [[29, "فرد عليهم يسوع قائلا: «أنتم في ضلال لأنكم لا تفهمون الكتاب ولا قدرة الله."]]}, {"l": "Mar 12:24", "n": "", "vs": [[24, "فرد عليهم يسوع قائلا: «ألستم في ضلال لأنكم لا تفهمون الكتاب ولا قدرة الله؟"]]}, {"l": "Mar 12:27", "n": "", "vs": [[27, "فإنه ليس بإله أموات، بل هو إله أحياء. فأنتم إذن في ضلال عظيم! »"]]}, {"l": "Gal 6:7", "n": "", "vs": [[7, "لا تنخدعوا: إن الله لا يستهزأ به. فكل ما يزرعه الإنسان، فإياه يحصد أيضا."]]}, {"l": "Col 2:4", "n": "", "vs": [[4, "أقول هذا حتى لا يضللكم أحد بكلام خداع."]]}, {"l": "Col 2:8", "n": "", "vs": [[8, "احذروا أن يوقعكم أحد فريسة بالفلسفة والغرور الباطل، عملا بتقاليد الناس ومباديء العالم؛ مما لا يوافق المسيح."]]}, {"l": "2Ti 2:18", "n": "", "vs": [[18, "اللذان زاغا عن الحق؛ إذ يزعمان أن القيامة قد حدثت، ويهدمان إيمان بعض الناس."]]}], "kwAr": "لا تضلوا", "noteAr": ""}, {"kw": "my", "raw": "Jam_1:19, Jam_2:5; Phi_2:12, Phi_4:1; Heb_13:1", "note": "", "refs": [{"l": "Jam 1:19", "n": "", "vs": [[19, "لذلك، ياإخوتي الأحباء، على كل واحد منكم أن يكون مسرعا إلى الإصغاء، غير متسرع في الكلام، بطيء الغضب."]]}, {"l": "Jam 2:5", "n": "", "vs": [[5, "فياإخوتي الأحباء، أما اختار الله الفقراء في نظر الناس ليجعلهم أغنياء في الإيمان، ويعطيهم حق الإرث في الملكوت الذي وعد به محبيه؟"]]}, {"l": "Phi 2:12", "n": "", "vs": [[12, "إذن، ياأحبائي، كما كنتم تطيعون دائما، لا كما لو أنني حاضر وحسب، بل بالأحرى كثيرا الآن وأنا غائب، كذلك اسعوا لتحقيق خلاصكم عمليا بخوف وارتعاد،"]]}, {"l": "Phi 4:1", "n": "", "vs": [[1, "إذن، ياإخوتي الأحباء والمشتاق إليهم، يافرحي وإكليلي، هكذا اثبتوا في الرب أيها الأحباء."]]}, {"l": "Heb 13:1", "n": "", "vs": [[1, "اثبتوا على المحبة الأخوية."]]}], "kwAr": "إخوتي الأحباء", "noteAr": ""}], "arS": [["فيا ", []], ["إخوتي", ["G3450", "G80"]], [" ", []], ["الأحباء", ["G27"]], ["، ", []], ["لا", ["G3361"]], [" ", []], ["تضلوا", ["G4105"]], [":", []]]}, {"c": 1, "v": 17, "text": "إن كل عطية صالحة وهبة كاملة إنما تنزل من فوق، من لدن أبي الأنوار الذي ليس فيه تحول، ولا ظل لأنه لا يدور.", "groups": [{"kw": "good", "raw": "Jam_1:5, Jam_3:15, Jam_3:17; Gen_41:16, Gen_41:38, Gen_41:39; Exo_4:11, Exo_4:12, Exo_31:3-6, Exo_36:1, Exo_36:2; Num_11:17, Num_11:25; 1Ch_22:12, 1Ch_29:19; 2Ch_1:11, 2Ch_1:12; Pro_2:6; Isa_28:26; Dan_2:21, Dan_2:22, Dan_2:27-30; Mat_7:11, Mat_11:25, Mat_11:26, Mat_13:11, Mat_13:12; Luk_11:13; Joh_3:27; Act_5:31, Act_11:18; Rom_6:23, Rom_11:30, Rom_12:6-8; 1Co_4:7, 1Co_12:4-12; Eph_2:3-5, Eph_2:8, Eph_4:8-11; Phi_1:29; Tit_3:3-5; 1Jo_4:10, 1Jo_5:11, 1Jo_5:12", "note": "", "refs": [{"l": "Jam 1:5", "n": "", "vs": [[5, "وإن كان أحد منكم بحاجة إلى الحكمة، فليطلب من الله الذي يعطي الجميع بسخاء ولا يعير. فسيعطى له."]]}, {"l": "Jam 3:15", "n": "", "vs": [[15, "إن هذه الحكمة التي تدعونها ليست نازلة من عند الله، بل هي «حكمة» أرضية بشرية شيطانية."]]}, {"l": "Jam 3:17", "n": "", "vs": [[17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}, {"l": "Gen 41:16", "n": "", "vs": [[16, "فأجاب يوسف: «لا فضل لي في ذلك، بل إن الله هو الذي يعطي فرعون الجواب الصائب»."]]}, {"l": "Gen 41:38", "n": "", "vs": [[38, "وقال فرعون لعبيده: «هل نجد نظير هذا رجلا فيه روح الله؟»"]]}, {"l": "Gen 41:39", "n": "", "vs": [[39, "ثم قال فرعون ليوسف: «من حيث أن الله قد أطلعك على كل هذا، فليس هناك بصير وحكيم نظيرك."]]}, {"l": "Exo 4:11", "n": "", "vs": [[11, "فقال الرب له: «من هو باريء فم الإنسان؟ أو من يجعله أخرس أو أصم أو بصيرا أو كفيفا؟ ألست أنا الرب؟"]]}, {"l": "Exo 4:12", "n": "", "vs": [[12, "فالآن انطلق فألقن فمك النطق، وأعلمك ماذا تقول»."]]}, {"l": "Exo 31:3-6", "n": "", "vs": [[3, "وملأته من روح الله ووهبته حكمة ومهارة ومقدرة ومعرفة في كل أنواع الحرف،"], [4, "وَلابتكار فنون التصميمات المصنوعة من الذهب والفضة والنحاس،"], [5, "وصقل الجواهر وترصيعها، ونجارة الخشب، وليكون محترفا لكل صناعة."], [6, "كما اخترت أهوليآب بن أخيساماك من سبط دان، ليكون مساعدا له. وكذلك وهبت جميع الصناع مهارة خاصة ليقوموا بكل ما أمرتك به."]]}, {"l": "Exo 36:1", "n": "", "vs": [[1, "وهكذا يقوم بصلئيل وأهوليآب وكل صانع حاذق وهبه الرب مقدرة في تنفيذ بناء خيمة الاجتماع، بإنجاز العمل، بحسب كل ما أمر به الرب."]]}, {"l": "Exo 36:2", "n": "", "vs": [[2, "ثم استدعى موسى بصلئيل وأهوليآب وكل صانع ماهر وهبه الرب حذاقة، وكل من حثه قلبه على المساهمة في إنجاز عمل ما."]]}, {"l": "Num 11:17", "n": "", "vs": [[17, "فأنزل وأخاطبك هناك، وآخذ من الروح الذي عليك وأضع عليهم، فيعينونك في حمل مسئولية الشعب، فلا تحملها أنت وحدك."]]}, {"l": "Num 11:25", "n": "", "vs": [[25, "فنزل الرب في سحابة وخاطبه، وأخذ من الروح الحال عليه ووضعه على السبعين رئيسا. فلما حل عليهم الروح تنبأوا لفترة وتوقفوا."]]}, {"l": "1Ch 22:12", "n": "", "vs": [[12, "وليمنحك الرب فطنة ومعرفة عندما يوليك على إسرائيل لتطيع شريعة الرب إلهك،"]]}, {"l": "1Ch 29:19", "n": "", "vs": [[19, "أما سليمان ابني، فهبه قلبا كاملا ليطيع وصاياك وشهاداتك وفرائضك، ويعمل بها كلها وليبني الهيكل الذي أعددت له»."]]}, {"l": "2Ch 1:11", "n": "", "vs": [[11, "فقال الله لسليمان: «من أجل أنك قد عزمت في قلبك على طلب هذا الأمر، ولم تنشد غنى، ولا أموالا، ولا عظمة، ولا الانتقام من أعدائك، ولم تطلب حياة طويلة، بل سألت لنفسك حكمة ومعرفة لتحكم بهما شعبي الذي ملكتك عليه،"]]}, {"l": "2Ch 1:12", "n": "", "vs": [[12, "فإنني أهبك حكمة ومعرفة، وأنعم عليك بالغنى والمال والعظمة، بحيث لا يضاهيك فيها أحد من الملوك السابقين ولا اللاحقين»."]]}, {"l": "Pro 2:6", "n": "", "vs": [[6, "لأن الرب يهب الحكمة، ومن فمه تتدفق المعرفة والفهم."]]}, {"l": "Isa 28:26", "n": "", "vs": [[26, "لأنه قد تلقى المعرفة الصحيحة من إلهه."]]}, {"l": "Dan 2:21", "n": "", "vs": [[21, "هو يغير الأوقات والفصول. يعزل ملوكا وينصب ملوكا. يهب الحكماء حكمة وذوي الفطنة معرفة."]]}, {"l": "Dan 2:22", "n": "", "vs": [[22, "يكشف الأعماق والخفايا ويعلم ما في باطن الظلمة، ولديه يسكن النور."]]}, {"l": "Dan 2:27-30", "n": "", "vs": [[27, "فأجاب دانيآل الملك: «لا يستطيع ساحر أو حكيم أو مجوسي أو منجم أن يطلع الملك على السر الذي طلبه."], [28, "ولكن هناك إله في السماء يعلن الخفايا. وقد عرف الملك نبوخذناصر عما سيحدث في آخر الأيام. أما حلمك والرؤيا التي شهدتها في منامك فهي هذه:"], [29, "أيها الملك، فيما أنت مستلق على مضجعك انتابتك الأفكار عما يحدث في الأيام المقبلة، والذي يكشف الخفايا عرفك بما سيكون."], [30, "وقد أعلن لي هذا السر، لا لحكمة في أكثر من سائر الأحياء، إنما لكي يطلع الملك على تفسيره وتدرك أفكار قلبك."]]}, {"l": "Mat 7:11", "n": "", "vs": [[11, "فإن كنتم وأنتم أشرار، تعرفون أن تعطوا أولادكم عطايا جيدة، فكم بالأحرى جدا يعطي أبوكم السماوي عطايا جيدة للذين يطلبون منه؟"]]}, {"l": "Mat 11:25", "n": "", "vs": [[25, "وفي ذلك الوقت، تكلم يسوع فقال: «أحمدك أيها الآب، رب السماء والأرض، لأنك حجبت هذه الأمور عن الحكماء والفهماء، وكشفتها للأطفال!"]]}, {"l": "Mat 11:26", "n": "", "vs": [[26, "نعم أيها الآب، لأنه هكذا حسن في نظرك."]]}, {"l": "Mat 13:11", "n": "", "vs": [[11, "فأجاب: «لأنه قد أعطي لكم أن تعرفوا أسرار ملكوت السماوات؛ أما أولئك، فلم يعط لهم ذلك."]]}, {"l": "Mat 13:12", "n": "", "vs": [[12, "فإن من عنده، يعطى المزيد فيفيض؛ وأما من ليس عنده، فحتى الذي عنده ينتزع منه."]]}, {"l": "Luk 11:13", "n": "", "vs": [[13, "فإن كنتم، أنتم الأشرار، تعرفون أن تعطوا أولادكم عطايا جيدة، فكم بالأحرى الآب، الذي من السماء يهب الروح القدس لمن يسألونه؟ »"]]}, {"l": "Joh 3:27", "n": "", "vs": [[27, "فأجاب يوحنا: «لا يقدر أحد أن ينال شيئا إلا إذا أعطي له من السماء!"]]}, {"l": "Act 5:31", "n": "", "vs": [[31, "ولكن الله رفعه إلى يمينه وجعله رئيسا ومخلصا ليمنح إسرائيل التوبة وغفران الخطايا؛"]]}, {"l": "Act 11:18", "n": "", "vs": [[18, "فلما سمع المعارضون هذا، سكتوا، ومجدوا الله قائلين: «إذن، قد أنعم الله أيضا على غير اليهود بالتوبة لنوال الحياة»."]]}, {"l": "Rom 6:23", "n": "", "vs": [[23, "لأن أجرة الخطيئة هي الموت، وأما هبة الله فهي الحياة الأبدية في المسيح يسوع ربنا."]]}, {"l": "Rom 11:30", "n": "", "vs": [[30, "والواقع أنه كما كنتم أنتم في الماضي غير مطيعين لله، ولكنكم الآن نلتم الرحمة من جراء عدم طاعتهم هم،"]]}, {"l": "Rom 12:6-8", "n": "", "vs": [[6, "ولكن، بما أن المواهب موزعة بحسب النعمة الموهوبة لنا، (فلنمارسها): فمن وهب النبوءة، فليتنبأ بحسب مقدار الإيمان؛"], [7, "ومن وهب الخدمة، فلينهمك في الخدمة؛ أو التعليم، ففي التعليم؛"], [8, "أو الوعظ، ففي الوعظ؛ أو العطاء، فليعط بسخاء؛ أو القيادة، فليقد باجتهاد؛ أو إظهار الرحمة، فليرحم بسرور."]]}, {"l": "1Co 4:7", "n": "", "vs": [[7, "فمن جعلك متميزا عن غيرك؟ وأي شيء مما لك لم تكن قد أخذته هبة؟ ومادمت قد أخذت، فلماذا تتباهى كأنك لم تأخذ؟"]]}, {"l": "1Co 12:4-12", "n": "", "vs": [[4, "هناك مواهب مختلفة، ولكن الروح واحد."], [5, "وهناك خدمات مختلفة، والرب واحد."], [6, "وهناك أيضا أعمال مختلفة، ولكن الله واحد، وهو يعمل كل شيء في الجميع."], [7, "وإنما كل واحد يوهب موهبة يتجلى الروح فيها لأجل المنفعة."], [8, "فواحد يوهب، عن طريق الروح، كلام الحكمة، وآخر كلام المعرفة وفقا للروح نفسه،"], [9, "وآخر إيمانا بالروح نفسه. ويوهب آخر موهبة شفاء الأمراض بالروح الواحد،"], [10, "وآخر عمل المعجزات، وآخر النبوءة وآخر التمييز بين الأرواح، وآخر التكلم بلغات مختلفة (لم يتعلمها)، وآخر ترجمة اللغات تلك."], [11, "ولكن هذا كله يشغله الروح الواحد نفسه، موزعا المواهب، كما يشاء، على كل واحد."], [12, "فكما أن الجسد واحد وله أعضاء كثيرة، ولكن أعضاء الجسد كلها تشكل جسما واحدا مع أنها كثيرة، فكذلك حال المسيح أيضا."]]}, {"l": "Eph 2:3-5", "n": "", "vs": [[3, "الذين بينهم نحن أيضا كنا نسلك سابقا في شهوات جسدنا، عاملين ما يريده الجسد والأفكار، وكنا بالطبيعة أولاد الغضب كالآخرين أيضا."], [4, "أما الله ، وهو غني في الرحمة، فبسبب محبته العظيمة التي أحبنا بها،"], [5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"]]}, {"l": "Eph 2:8", "n": "", "vs": [[8, "فإنكم بالنعمة مخلصون، بالإيمان، وهذا ليس منكم. إنه هبة من الله،"]]}, {"l": "Eph 4:8-11", "n": "", "vs": [[8, "لذلك يقول (الوحي): «إذ صعد إلى الأعالي، ساق أسرى، ووهب الناس مواهب!»"], [9, "وأما أنه «صعد»، فما معنى هذا سوى أنه كان قد نزل أيضا إلى الأقسام السفلى في الأرض؟"], [10, "إن الذي نزل هو نفسه الذي صعد إلى ما فوق جميع السماوات لكي يملأ كل شيء."], [11, "وهو قد وهب البعض أن يكونوا رسلا، والبعض أنبياء، والبعض مبشرين والبعض رعاة ومعلمين،"]]}, {"l": "Phi 1:29", "n": "", "vs": [[29, "فقد وهب لكم، لأجل المسيح، لا أن تؤمنوا به وحسب، بل أيضا أن تتألموا لأجله،"]]}, {"l": "Tit 3:3-5", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."], [4, "ولكن، لما ظهر لطف مخلصنا الله، ومحبته للناس،"], [5, "خلصنا لا على أساس أعمال بر قمنا بها نحن، وإنما بموجب رحمته، وذلك بأن غسلنا كليا غسل الخليقة الجديدة والتجديد الذي يجريه الروح القدس،"]]}, {"l": "1Jo 4:10", "n": "", "vs": [[10, "وفي هذا نرى المحبة الحقيقية، لا محبتنا نحن لله، بل محبته هو لنا. فبدافع محبته، أرسل ابنه كفارة لخطايانا."]]}, {"l": "1Jo 5:11", "n": "", "vs": [[11, "وهذه الشهادة هي أن الله أعطانا حياة أبدية، وأن هذه الحياة هي في ابنه."]]}, {"l": "1Jo 5:12", "n": "", "vs": [[12, "فمن كان له ابن الله كانت له الحياة. ومن لم يكن له ابن الله، لم تكن له الحياة!"]]}], "kwAr": "كل عطية صالحة وهبة كاملة", "noteAr": ""}, {"kw": "from the", "raw": "Gen_1:2-5, Gen_1:14, Gen_1:15; Deu_4:19; Psa_19:1-8, Psa_84:11; Isa_45:7, Isa_60:19; Joh_1:9; Joh_8:12; 2Co_4:6; Eph_1:18; 1Jo_1:5; Rev_21:23, Rev_22:5", "note": "", "refs": [{"l": "Gen 1:2-5", "n": "", "vs": [[2, "وإذ كانت الأرض مشوشة ومقفرة وتكتنف الظلمة وجه المياه، وإذ كان روح الله يرفرف على سطح المياه،"], [3, "أمر الله : «ليكن نور». فصار نور،"], [4, "ورأى الله النور فاستحسنه وفصل بينه وبين الظلام."], [5, "وسمى الله النور نهارا، أما الظلام فسماه ليلا. وهكذا جاء مساء أعقبه صباح، فكان اليوم الأول."]]}, {"l": "Gen 1:14", "n": "", "vs": [[14, "ثم أمر الله : «لتكن أنوار في جلد السماء لتفرق بين النهار والليل، فتكون علامات لتحديد أزمنة وأيام وسنين."]]}, {"l": "Gen 1:15", "n": "", "vs": [[15, "وتكون أيضا أنوارا في جلد السماء لتضيء الأرض». وهكذا كان."]]}, {"l": "Deu 4:19", "n": "", "vs": [[19, "أو لئلا تتطلعوا إلى السماء فتشاهدوا الشمس والقمر والنجوم والأجرام السماوية التي وزعها الرب إلهكم على جميع الأمم التي تحت السماء، فتغووا وتسجدوا لها وتعبدوها."]]}, {"l": "Psa 19:1-8", "n": "", "vs": [[1, "السماوات تحدث بمجد الله، والفلك يخبر بعمل يديه"], [2, "بذلك تتحادث الأيام أبلغ حديث، وتتخاطب به الليالي."], [3, "لا يصدر عنها كلام، لكن صوتها يسمع واضحا."], [4, "انطلق صوتهم إلى الأرض كلها وكلامهم إلى أقاصي العالم. جعل للشمس مسكنا فيها،"], [5, "وهي مثل العريس الخارج من مخدعه، كالعداء المبتهج للسباق في الطريق."], [6, "تنطلق من أقصى السموات، وتدور إلى أقاصيها، ولا شيء يحتجب من حرها."], [7, "شريعة الرب كاملة تنعش النفس. شهادة الرب صادقة تجعل الجاهل حكيما."], [8, "وصايا الرب مستقيمة تفرح القلب. أمر الرب نقي ينير العينين."]]}, {"l": "Psa 84:11", "n": "", "vs": [[11, "لأن الرب الإله شمس وترس. الرب يعطي نعمة ومجدا؛ لا يمنع أي خير عن السالكين بالاستقامة."]]}, {"l": "Isa 45:7", "n": "", "vs": [[7, "أنا مبدع النور وخالق الظلمة، أنا صانع الخير وخالق الضر، أنا هو الرب فاعل كل هذه."]]}, {"l": "Isa 60:19", "n": "", "vs": [[19, "ولا تعود الشمس نورا لك في النهار ولا يشرق ضوء القمر عليك لأن الرب يكون نورك الأبدي، وإلهك يكون مجدك."]]}, {"l": "Joh 1:9", "n": "", "vs": [[9, "فالنور الحق الذي ينير كل إنسان كان آتيا إلى العالم."]]}, {"l": "Joh 8:12", "n": "", "vs": [[12, "وخاطبهم يسوع أيضا فقال: «أنا نور العالم. من يتبعني فلا يتخبط في الظلام بل يكون له نور الحياة»."]]}, {"l": "2Co 4:6", "n": "", "vs": [[6, "فإن الله ، الذي أمر أن يشرق نور من الظلام، هو الذي جعل النور يشرق في قلوبنا، لإشعاع معرفة مجد الله المتجلي في وجه المسيح."]]}, {"l": "Eph 1:18", "n": "", "vs": [[18, "إذ تستنير بصائر قلوبكم، فتعلموا ما في دعوته لكم من رجاء، وما هو غنى مجد ميراثه في القديسين،"]]}, {"l": "1Jo 1:5", "n": "", "vs": [[5, "وهذا هو الخبر الذي سمعناه من المسيح ونعلنه لكم: إن الله نور، وليس فيه ظلام البتة."]]}, {"l": "Rev 21:23", "n": "", "vs": [[23, "ولم تكن المدينة في حاجة إلى نور الشمس أو القمر، لأن مجد الله ينيرها، والحمل مصباحها."]]}, {"l": "Rev 22:5", "n": "", "vs": [[5, "ولن يكون هنالك ليل، فلا يحتاجون إلى نور مصباح أو شمس، لأن الرب الإله ينير عليهم، وهم سيملكون إلى أبد الآبدين!"]]}], "kwAr": "من لدن أبي الأنوار", "noteAr": ""}, {"kw": "no variableness", "raw": "Num_23:19; 1Sa_15:29; Psa_122:6; Isa_46:10; Mal_3:6; Rom_11:29; Heb_1:11, Heb_1:12, Heb_13:8", "note": "", "refs": [{"l": "Num 23:19", "n": "", "vs": [[19, "ليس الله إنسانا فيكذب. ولا هو ابن آدم فيندم. هل يقول ولا يفعل أو يعد ولا يفي؟"]]}, {"l": "1Sa 15:29", "n": "", "vs": [[29, "فإن قوة إسرائيل (أي الله) لا يكذب ولا يندم. ليس هو إنسانا حتى يغير رأيه»."]]}, {"l": "Psa 122:6", "n": "", "vs": [[6, "صلوا لأجل سلام أورشليم. ليفلح محبوك ويطمئنوا."]]}, {"l": "Isa 46:10", "n": "", "vs": [[10, "وقد أنبأت بالنهاية منذ البدء، وأخبرت من القدم بأمور لم تكن قد حدثت بعد، قائلا: مقاصدي لابد أن تتم، ومشيئتي لابد أن تتحقق."]]}, {"l": "Mal 3:6", "n": "", "vs": [[6, "فإني أنا الرب لا أتغير، لذلك أنتم أيضا لم تفنوا ياأبناء يعقوب."]]}, {"l": "Rom 11:29", "n": "", "vs": [[29, "فإن الله لا يتراجع أبدا عن هباته ودعوته."]]}, {"l": "Heb 1:11", "n": "", "vs": [[11, "هي تفنى، وأنت تبقى. فسوف تبلى كلها كما تبلى الثياب،"]]}, {"l": "Heb 1:12", "n": "", "vs": [[12, "فتطويها كالرداء، ثم تبدلها. ولكنك أنت الدائم الباقي، وسنوك لن تنتهي!»"]]}, {"l": "Heb 13:8", "n": "", "vs": [[8, "يسوع المسيح هو هو أمسا واليوم وإلى الأبد."]]}], "kwAr": "ليس فيه تحول", "noteAr": ""}], "arS": [["إن ", []], ["كل", ["G3956"]], [" ", []], ["عطية", ["G1394"]], [" ", []], ["صالحة", ["G18"]], [" ", []], ["وهبة", ["G1434"]], [" ", []], ["كاملة", ["G5046"]], [" إنما ", []], ["تنزل", ["G2597"]], [" ", []], ["من فوق", ["G509"]], ["، من لدن ", []], ["أبي", ["G3962"]], [" ", []], ["الأنوار", ["G5457"]], [" الذي ليس فيه ", []], ["تحول", ["G3883"]], ["، ولا ", []], ["ظل", ["G644"]], [" لأنه لا ", []], ["يدور", ["G5157"]], [".", []]]}, {"c": 1, "v": 18, "text": "وهو قد شاء أن يجعلنا أولادا له، فولدنا بكلمته، كلمة الحق. وغايته أن نكون باكورة خليقته.", "groups": [{"kw": "his own", "raw": "Joh_1:13, Joh_3:3-5; Rom_4:17, Rom_8:29-31, Rom_9:15-18; Eph_2:4, Eph_2:5; Col_1:20,Col_1:21; 2Th_2:13, 2Th_2:14; 1Pe_1:3, 1Pe_1:23", "note": "", "refs": [{"l": "Joh 1:13", "n": "", "vs": [[13, "وهم الذين ولدوا ليس من دم، ولا من رغبة جسد، ولا من رغبة بشر، بل من الله."]]}, {"l": "Joh 3:3-5", "n": "", "vs": [[3, "فأجابه يسوع: «الحق الحق أقول لك: لا أحد يمكنه أن يرى ملكوت الله إلا إذا ولد من جديد»."], [4, "فسأله نيقوديموس: «كيف يمكن الإنسان أن يولد وهو كبير السن؟ ألعله يستطيع أن يدخل بطن أمه ثانية ثم يولد؟»"], [5, "أجابه يسوع: «الحق الحق أقول لك: لا يمكن أن يدخل أحد ملكوت الله إلا إذا ولد من الماء والروح."]]}, {"l": "Rom 4:17", "n": "", "vs": [[17, "كما قد كتب: «إني جعلتك أبا لأمم كثيرة». (إنه أب لنا) في نظر الله الذي به آمن، والذي يحيي الموتى ويستدعي إلى الوجود ما كان غير موجود."]]}, {"l": "Rom 8:29-31", "n": "", "vs": [[29, "لأن الذين سبق فعرفهم، سبق فعينهم أيضا ليكونوا مشابهين صورة ابنه ليكون هو البكر بين إخوة كثيرين."], [30, "والذين سبق فعينهم، فهؤلاء دعاهم أيضا. والذين دعاهم، فهؤلاء بررهم أيضا. والذين بررهم، فهؤلاء مجدهم أيضا."], [31, "فبعد هذا، ماذا نقول؟ مادام الله معنا، فمن يكون علينا؟ ذاك الذي لم يمسك عنا ابنه،"]]}, {"l": "Rom 9:15-18", "n": "", "vs": [[15, "فإنه يقول لموسى: «إني أرحم من أرحمه، وأشفق على من أشفق عليه!»"], [16, "إذا، لا يتعلق الأمر برغبة الإنسان ولا بسعيه، وإنما برحمة الله فقط."], [17, "فإن الله يقول لفرعون في الكتاب: «لهذا الأمر بعينه أقمتك: لأظهر فيك قدرتي ويعلن اسمي في الأرض كلها»."], [18, "فالله إذا يرحم من يشاء، ويقسي من يشاء."]]}, {"l": "Eph 2:4", "n": "", "vs": [[4, "أما الله ، وهو غني في الرحمة، فبسبب محبته العظيمة التي أحبنا بها،"]]}, {"l": "Eph 2:5", "n": "", "vs": [[5, "وإذ كنا نحن أيضا أمواتا بالذنوب، أحيانا مع المسيح، إنما بالنعمة أنتم مخلصون،"]]}, {"l": "Col 1:20", "n": "", "vs": [[20, "وأن يصالح به كل شيء مع نفسه، إذ أحل السلام بدمه على الصليب، فبه يصالح كل شيء، سواء كان ما على الأرض أو ما في السماوات."]]}, {"l": "Col 1:21", "n": "", "vs": [[21, "وأنتم، يامن كنتم في الماضي أجانب وأعداء في الفكر، بأعمالكم الشريرة،"]]}, {"l": "2Th 2:13", "n": "", "vs": [[13, "أما نحن، فمن واجبنا أن نشكر الله على الدوام من أجلكم، أيها الإخوة الذين يحبهم الرب، لأن الله اختاركم من البدء للخلاص، بتقديس الروح لكم وإيمانكم بالحق."]]}, {"l": "2Th 2:14", "n": "", "vs": [[14, "فإلى هذا الأمر قد دعاكم ببشارتنا لكم، لنوال مجد ربنا يسوع المسيح."]]}, {"l": "1Pe 1:3", "n": "", "vs": [[3, "تبارك الله أبو ربنا يسوع المسيح! فمن فرط رحمته العظيمة ولدنا ولادة ثانية، (معطيا إيانا حياة جديدة) مليئة بالرجاء على أساس قيامة يسوع المسيح من بين الأموات،"]]}, {"l": "1Pe 1:23", "n": "", "vs": [[23, "فأنتم قد ولدتم ولادة ثانية لا من زرع بشري يفنى، بل مما لا يفنى: بكلمة الله الحية الباقية إلى الأبد."]]}], "kwAr": "شاء أن يجعلنا أولادا له", "noteAr": ""}, {"kw": "with", "raw": "Jam_1:21; 1Co_4:15; Eph_1:12; 1Pe_1:23; 1Jo_3:9", "note": "", "refs": [{"l": "Jam 1:21", "n": "", "vs": [[21, "إذن، تخلصوا من كل ما في حياتكم من نجاسة وشر متزايد. وليكن قبولكم لتلك الكلمة التي غرسها الله في قلوبكم، قبولا وديعا. فهي القادرة أن تخلص نفوسكم."]]}, {"l": "1Co 4:15", "n": "", "vs": [[15, "فقد يكون لكم عشر ة آلاف من المرشدين في المسيح، ولكن ليس لكم آباء كثيرون! لأني أنا ولدتكم في المسيح يسوع بالإنجيل."]]}, {"l": "Eph 1:12", "n": "", "vs": [[12, "والغاية أن نكون سببا لمدح مجده بعدما سبق لنا أن وضعنا رجاءنا في المسيح."]]}, {"l": "1Pe 1:23", "n": "", "vs": [[23, "فأنتم قد ولدتم ولادة ثانية لا من زرع بشري يفنى، بل مما لا يفنى: بكلمة الله الحية الباقية إلى الأبد."]]}, {"l": "1Jo 3:9", "n": "", "vs": [[9, "فكل مولود من الله، لا يمارس الخطيئة، لأن طبيعة الله صارت ثابتة فيه. بل إنه لا يستطيع أن يمارس الخطيئة، لأنه مولود من الله."]]}], "kwAr": "بكلمته، كلمة الحق", "noteAr": ""}, {"kw": "kind", "raw": "Lev_23:10; Jer_2:3; Amo_6:1 *marg. Heb_12:23; Rev_14:4", "note": "", "refs": [{"l": "Lev 23:10", "n": "", "vs": [[10, "متى دخلتم الأرض التي أهبها لكم وحصدتم غلاتها، تحضرون أول حزمة من حصادكم للكاهن،"]]}, {"l": "Jer 2:3", "n": "", "vs": [[3, "كان إسرائيل مقدسا للرب وباكورة غلته، وكل من يعتدي عليه، يرتكب إثما ويحل به شر."]]}, {"l": "Amo 6:1", "n": "*marg.", "vs": [[1, "ويل للمترفين في صهيون والمطمئنين في جبل السامرة، نبلاء طليعة الأمم الذين يتوافد إليهم شعب إسرائيل."]]}, {"l": "Heb 12:23", "n": "", "vs": [[23, "إلى كنيسة تجمع أبناء لله أبكارا، أسماؤهم مكتوبة في السماء. بل إلى الله نفسه، ديان الجميع، وإلى أرواح أناس بررهم الله وجعلهم كاملين."]]}, {"l": "Rev 14:4", "n": "", "vs": [[4, "فهؤلاء لم ينجسوا أنفسهم مع النساء لأنهم أطهار، وهم يتبعون الحمل حيثما ذهب، وقد تم شراؤهم من بين الناس باكورة لله، وللحمل،"]]}], "kwAr": "باكورة خليقته", "noteAr": ""}], "arS": [["وهو قد ", []], ["شاء", ["G1014"]], [" أن يجعلنا أولادا له، ", []], ["فولدنا", ["G616"]], [" ", []], ["بكلمته", ["G3056"]], ["، كلمة ", []], ["الحق", ["G225"]], [". وغايته أن ", []], ["نكون", ["G1511"]], [" ", []], ["باكورة", ["G536"]], [" ", []], ["خليقته", ["G2938"]], [".", []]]}, {"c": 1, "v": 19, "text": "لذلك، ياإخوتي الأحباء، على كل واحد منكم أن يكون مسرعا إلى الإصغاء، غير متسرع في الكلام، بطيء الغضب.", "groups": [{"kw": "let", "raw": "Neh_8:2, Neh_8:3, Neh_8:12-14, Neh_8:18, Neh_9:3; Pro_8:32-35; Ecc_5:1; Mar_2:2, Mar_12:37; Luk_15:1; Luk_19:48; Act_2:42, Act_10:33, Act_13:42-44, Act_13:48, Act_17:11; 1Th_2:13", "note": "", "refs": [{"l": "Neh 8:2", "n": "", "vs": [[2, "فأخرج عزرا الكاتب سفر الشريعة في اليوم الأول من الشهر السابع، ونشره أمام الجماعة من الرجال والنساء وكل من يفهم ما يسمع،"]]}, {"l": "Neh 8:3", "n": "", "vs": [[3, "وقرأ منه أمام الساحة الواقعة قبالة بوابة الماء من الصباح حتى انتصاف النهار، في حضرة الرجال والنساء والفاهمين، الذين أرهفوا آذانهم للاستماع إلى كلمات سفر الشريعة."]]}, {"l": "Neh 8:12-14", "n": "", "vs": [[12, "فمضى الشعب كله ليأكل ويشرب ويبعث بأنصبة ويحتفل بفرح عظيم، لأنه فهم نص الشريعة التي علموه إياها."], [13, "وفي اليوم الثاني حضر رؤساء عائلات جميع الشعب والكهنة واللاويون إلى عزرا الكاتب ليفهمهم نص الشريعة،"], [14, "فوجدوا أنه مدون في الشريعة التي أمر بها الرب على لسان موسى أن على بني إسرائيل الإقامة في مظلات في العيد الواقع في الشهر السابع،"]]}, {"l": "Neh 8:18", "n": "", "vs": [[18, "أما سفر شريعة الرب فكان يتلى منه كل يوم طوال أيام العيد السبعة. وفي اليوم الثامن اعتكف الشعب بموجب مراسيم شريعة موسى."]]}, {"l": "Neh 9:3", "n": "", "vs": [[3, "ومكثوا في أماكنهم حيث تلي عليهم من سفر شريعة الرب إلههم ربع النهار، وحمدوا وسجدوا له في الربع الأخير."]]}, {"l": "Pro 8:32-35", "n": "", "vs": [[32, "والآن أصغوا إلي أيها الأبناء، إذ طوبى لمن يمارسون طرقي."], [33, "استمعوا إلى إرشادي، وكونوا حكماء ولا تتجاهلوه."], [34, "طوبى للإنسان الذي يستمع إلي، الحريص على السهر عند أبوابي، حارسا قوائم مصاريعي،"], [35, "لأن من يجدني يجد حياة، ويحوز على مرضاة الرب."]]}, {"l": "Ecc 5:1", "n": "", "vs": [[1, "احرص أن تكون قدمك طاهرة عندما تذهب إلى بيت الرب، فإن الدنو للاستماع خير من تقريب ذبيحة الجهال الذين لا يدركون أنهم يرتكبون شرا."]]}, {"l": "Mar 2:2", "n": "", "vs": [[2, "فاجتمع عدد كبير من الناس، حتى لم يبق مكان لأحد، ولا أمام الباب. فأخذ يلقي عليهم كلمة الله."]]}, {"l": "Mar 12:37", "n": "", "vs": [[37, "فمادام داود نفسه يدعوه الرب فمن أين يكون ابنه؟» وكان الجمع العظيم يسمعه بسرور."]]}, {"l": "Luk 15:1", "n": "", "vs": [[1, "وكان جميع جباة الضرائب والخاطئين يتقدمون إليه ليسمعوه."]]}, {"l": "Luk 19:48", "n": "", "vs": [[48, "ولكنهم لم يهتدوا إلى ما يفعلون، لأن الشعب كله كان ملتصقا به للاستماع إليه."]]}, {"l": "Act 2:42", "n": "", "vs": [[42, "وكان الجميع يداومون على تلقي تعليم الرسل، وعلى حياة الشركة، وكسر الخبز، والصلوات."]]}, {"l": "Act 10:33", "n": "", "vs": [[33, "فأرسلت حالا أدعوك، وقد أحسنت بمجيئك. ونحن الآن جميعا حاضرون أمام الله لنسمع كل ما أمرك به الرب»."]]}, {"l": "Act 13:42-44", "n": "", "vs": [[42, "وفيما الحاضرون ينصرفون، طلبوا إلى بولس وبرنابا أن يعودا في السبت التالي ويحدثاهم بهذا الأمر."], [43, "وتبعهما بعد الاجتماع كثيرون من اليهود والمتهودين العابدين، فأخذا يكلمانهم ويشجعانهم على الثبات في نعمة الله."], [44, "وفي السبت التالي اجتمع أهل المدينة كلهم تقريبا ليسمعوا كلمة الله."]]}, {"l": "Act 13:48", "n": "", "vs": [[48, "فلما سمع غير اليهود ذلك، فرحوا جدا، ومجدوا كلمة الرب. وآمن جميع من أعدهم الله للحياة الأبدية."]]}, {"l": "Act 17:11", "n": "", "vs": [[11, "وكان يهود بيرية أشرف من يهود تسالونيكي، فقبلوا كلمة الله برغبة شديدة، وأخذوا يدرسون الكتاب يوميا ليتأكدوا من صحة التعليم."]]}, {"l": "1Th 2:13", "n": "", "vs": [[13, "ولذلك نحن أيضا نرفع الشكر لله بلا توقف، لأنكم لما تلقيتم منا كلمة البشارة من الله، قبلتموها لا كأنها كلمة بشر، بل كما هي في الحقيقة: باعتبارها كلمة الله العاملة أيضا فيكم أنتم المؤمنين."]]}], "kwAr": "مسرعا إلى الإصغاء", "noteAr": ""}, {"kw": "slow to speak", "raw": "Jam_1:26, Jam_3:1, Jam_3:2; Pro_10:19, Pro_13:3, Pro_15:2, Pro_17:27, Pro_18:13, Pro_18:21, Pro_21:23; Ecc_5:2, Ecc_5:3", "note": "", "refs": [{"l": "Jam 1:26", "n": "", "vs": [[26, "وإن ظن أحد أنه متدين، وهو لا يلجم لسانه، فإنه يغش قلبه، وديانته غير نافعة!"]]}, {"l": "Jam 3:1", "n": "", "vs": [[1, "ياإخوتي، لا تتسابقوا كي تجعلوا أنفسكم معلمين لغيركم فتزيدوا عدد المعلمين! واذكروا أننا، نحن المعلمين، سوف نحاسب حسابا أقسى من غيرنا."]]}, {"l": "Jam 3:2", "n": "", "vs": [[2, "فإننا جميعا معرضون للوقوع في أخطاء كثيرة. ولكن من يلجم لسانه ولا يخطيء في كلامه هو ناضج يقدر أن يسيطر على طبيعته سيطرة تامة."]]}, {"l": "Pro 10:19", "n": "", "vs": [[19, "في كثرة الكلام زلات لسان، ومن يضبط شفتيه فهو عاقل."]]}, {"l": "Pro 13:3", "n": "", "vs": [[3, "من ضبط لسانه صان حياته، ومن فغر شدقيه متهورا بكلامه، فمصيره الدمار."]]}, {"l": "Pro 15:2", "n": "", "vs": [[2, "لسان الحكيم يتقن المعرفة، وأقوال الجهال تفيض حماقة."]]}, {"l": "Pro 17:27", "n": "", "vs": [[27, "ذو المعرفة يتروى في كلماته، والعاقل ذو رباطة جأش."]]}, {"l": "Pro 18:13", "n": "", "vs": [[13, "من أجاب عن أمر مازال يجهله، فذاك حماقة منه وعار له."]]}, {"l": "Pro 18:21", "n": "", "vs": [[21, "في اللسان حياة أو موت، والمولعون باستخدامه يتحملون العواقب."]]}, {"l": "Pro 21:23", "n": "", "vs": [[23, "من يصون فمه ولسانه عن اللغو يحفظ نفسه من المتاعب."]]}, {"l": "Ecc 5:2", "n": "", "vs": [[2, "لا تتسرع في أقوال فمك، ولا يتهور قلبك في نطق كلام لغو أمام الله، فالله في السماء وأنت على الأرض، فلتكن كلماتك قليلة."]]}, {"l": "Ecc 5:3", "n": "", "vs": [[3, "فكما تراود الأحلام النائم من كثرة العناء، كذلك أقوال الجهل تصدر عن الإفراط في الكلام."]]}], "kwAr": "غير متسرع في الكلام", "noteAr": ""}, {"kw": "slow to wrath", "raw": "Neh_9:17; Pro_14:17, Pro_14:29, Pro_15:18, Pro_16:32, Pro_17:14, Pro_19:11, Pro_19:19, Pro_25:28; Ecc_7:8, Ecc_7:9; Mat_5:22; Gal_5:20,Gal_5:21; Eph_4:26, Eph_4:31; Col_3:8, Col_3:15", "note": "", "refs": [{"l": "Neh 9:17", "n": "", "vs": [[17, "وأبوا أن يسمعوا، وتجاهلوا عجائبك التي أجريتها لهم، وأغلظوا قلوبهم، ثم تمردوا ونصبوا عليهم قائدا ليرجعوا إلى عبوديتهم، ولكنك إله غفور وحنان ورحيم وحكيم وكثير الإحسان، فلم تتخل عنهم،"]]}, {"l": "Pro 14:17", "n": "", "vs": [[17, "ذو الطبع الحاد يتصرف بحمق، وذو المكائد ممقوت."]]}, {"l": "Pro 14:29", "n": "", "vs": [[29, "البطيء الغضب ذو فهم كثير، أما السريع إلى السخط فيبدي حماقة."]]}, {"l": "Pro 15:18", "n": "", "vs": [[18, "الرجل الغضوب يثير الخصومة، والطويل الأناة يسكن النزاع."]]}, {"l": "Pro 16:32", "n": "", "vs": [[32, "البطيء الغضب خير من المحارب العاتي، والضابط أهواء روحه خير من قاهر المدن."]]}, {"l": "Pro 17:14", "n": "", "vs": [[14, "بداية الخصام كتفجر المياه، فاترك الخصام قبل انفجاره."]]}, {"l": "Pro 19:11", "n": "", "vs": [[11, "تعقل الإنسان يكبح غضبه، وبهاؤه في العفو عن الخطأ."]]}, {"l": "Pro 19:19", "n": "", "vs": [[19, "الجامح الغضب يدفع ثمن جموحه، وإن كبحته أو اعترضته فإنك تزيده سوءا"]]}, {"l": "Pro 25:28", "n": "", "vs": [[28, "الرجل المفتقر لضبط النفس مثل مدينة منهدمة لا سور لها."]]}, {"l": "Ecc 7:8", "n": "", "vs": [[8, "نهاية أمر خير من بدايته، والصبر خير من العجرفة."]]}, {"l": "Ecc 7:9", "n": "", "vs": [[9, "لا يستسلم قلبك سريعا للغضب، لأن الغضب يستقر في صدور الجهال."]]}, {"l": "Mat 5:22", "n": "", "vs": [[22, "أما أنا فأقول لكم: كل من هو غاضب على أخيه، يستحق المحاكمة؛ ومن يقول لأخيه: ياتافه! يستحق المثول أمام المجلس الأعلى؛ ومن يقول: ياأحمق! يستحق نار جهنم!"]]}, {"l": "Gal 5:20", "n": "", "vs": [[20, "وعبادة الأصنام والسحر، والعداوة والنزاع والغيرة والغضب، والتحزب والانقسام والتعصب،"]]}, {"l": "Gal 5:21", "n": "", "vs": [[21, "والحسد والسكر والعربدة، وما يشبه هذه. وبالنظر إليها، أقول لكم الآن، كما سبق أن قلت أيضا، إن الذين يفعلون مثل هذه لن يرثوا ملكوت الله!"]]}, {"l": "Eph 4:26", "n": "", "vs": [[26, "إن غضبتم، فلا تخطئوا؛ لا تدعوا الشمس تغيب وأنتم غاضبون،"]]}, {"l": "Eph 4:31", "n": "", "vs": [[31, "انزعوا عنكم كل حقد ونقمة وغضب وصخب وسباب وكل شر."]]}, {"l": "Col 3:8", "n": "", "vs": [[8, "وأما الآن، فانزعوا عنكم، أنتم أيضا، هذه الخطايا كلها: الغضب، النقمة، الخبث، التجديف، الكلام القبيح الخارج من أفواهكم."]]}, {"l": "Col 3:15", "n": "", "vs": [[15, "وليملك في قلوبكم سلام المسيح، فإليه قد دعيتم في الجسد الواحد؛ وكونوا شاكرين!"]]}], "kwAr": "بطيء الغضب", "noteAr": ""}], "arS": [["لذلك", ["G5620"]], ["، ", []], ["ياإخوتي", ["G3450", "G80"]], [" ", []], ["الأحباء", ["G27"]], ["، على ", []], ["كل", ["G3956"]], [" واحد منكم أن يكون ", []], ["مسرعا", ["G5036"]], [" إلى ", []], ["الإصغاء", ["G191"]], ["، غير ", []], ["متسرع", ["G1021"]], [" في ", []], ["الكلام", ["G2980"]], ["، ", []], ["بطيء", ["G1021"]], [" ", []], ["الغضب", ["G3709"]], [".", []]]}, {"c": 1, "v": 20, "text": "لأن الإنسان، إذا غضب، لا يعمل الصلاح الذي يريده الله .", "groups": [{"kw": "", "raw": "Jam_3:17, Jam_3:18; Num_20:11, Num_20:12; 2Ti_2:24, 2Ti_2:25", "note": "", "refs": [{"l": "Jam 3:17", "n": "", "vs": [[17, "أما الحكمة النازلة من عند الله، فهي نقية طاهرة، قبل كل شيء. وهي أيضا تدفع صاحبها إلى المسالمة والترفق. كما أنها مطاوعة، مملوءة بالرحمة والأعمال الصالحة، مستقيمة: لا تميز ولا تنحاز ولا ترائي."]]}, {"l": "Jam 3:18", "n": "", "vs": [[18, "والبر هو ثمر ة ما يزرعه في سلام صانعو السلام."]]}, {"l": "Num 20:11", "n": "", "vs": [[11, "ورفع موسى يده وضرب الصخرة بعصاه مرتين، فتفجر ماء غزير، فشربت الجماعة ومواشيها."]]}, {"l": "Num 20:12", "n": "", "vs": [[12, "فقال الرب لموسى وهرون: «من حيث أنكما لم تؤمنا بي حتى تقدساني على مرأى من بني إسرائيل فإنكما لن تدخلا هذا الشعب الأرض التي وهبتها لهم»."]]}, {"l": "2Ti 2:24", "n": "", "vs": [[24, "وعبد الرب يجب ألا يتشاجر، بل أن يكون مترفقا تجاه الجميع، قادرا على التعليم، يتحمل المشقات بصبر،"]]}, {"l": "2Ti 2:25", "n": "", "vs": [[25, "ويؤدب بالوداعة مقاومي الإيمان، عسى أن يمنحهم الله التوبة، فيعرفوا الحق بالتمام،"]]}], "kwAr": "", "noteAr": ""}], "arS": [["لأن", ["G1063"]], [" ", []], ["الإنسان", ["G435"]], ["، إذا ", []], ["غضب", ["G3709"]], ["، ", []], ["لا", ["G3756"]], [" ", []], ["يعمل", ["G2716"]], [" ", []], ["الصلاح", ["G1343"]], [" الذي يريده ", []], ["الله", ["G2316"]], [" .", []]]}, {"c": 1, "v": 21, "text": "إذن، تخلصوا من كل ما في حياتكم من نجاسة وشر متزايد. وليكن قبولكم لتلك الكلمة التي غرسها الله في قلوبكم، قبولا وديعا. فهي القادرة أن تخلص نفوسكم.", "groups": [{"kw": "lay", "raw": "Isa_2:20, Isa_30:22; Eze_18:31; Rom_13:12, Rom_13:13; Eph_4:22; Col_3:5-8; Heb_12:1; 1Pe_2:1, 1Pe_2:11", "note": "", "refs": [{"l": "Isa 2:20", "n": "", "vs": [[20, "في ذلك اليوم يطرح الناس للجرذان والخفافيش أوثانهم الفضية وأصنامهم الذهبية التي صنعوها ليعبدوها،"]]}, {"l": "Isa 30:22", "n": "", "vs": [[22, "«هذه هي الطريق لا تحيدوا عنها يمينا أو يسارا اسلكوا فيها» وتدنسون كل أصنامكم الفضية والذهبية، وتلقون بها بعيدا كخرقة ملوثة بدم حائض وتقولون لها: «اذهبي بلا رجعة»."]]}, {"l": "Eze 18:31", "n": "", "vs": [[31, "اطرحوا عنكم كل ذنوبكم التي ارتكبتموها، واحصلوا لأنفسكم على قلب جديد وروح جديدة. فلماذا تنقرضون ياشعب إسرائيل؟"]]}, {"l": "Rom 13:12", "n": "", "vs": [[12, "كاد الليل أن ينتهي والنهار أن يطلع. فلنطرح أعمال الظلام، ونلبس سلاح النور"]]}, {"l": "Rom 13:13", "n": "", "vs": [[13, "وكما في النهار، لنسلك سلوكا لائقا: لا في العربدة والسكر، ولا في الفحشاء والإباحية، ولا في النزاع والحسد."]]}, {"l": "Eph 4:22", "n": "", "vs": [[22, "وهو أن تخلعوا ما يتعلق بسيرتكم الماضية: الإنسان العتيق الذي يفسد نفسه بالشهوات الخداعة؛"]]}, {"l": "Col 3:5-8", "n": "", "vs": [[5, "فأميتوا إذن أعضاءكم الأرضية: الزنى، النجاسة، جموح العاطفة، الشهوة الرديئة، والاشتهاء النهم الذي هو عبادة أصنام."], [6, "فبسبب هذه الخطايا ينزل غضب الله،"], [7, "وفيها سلكتم في الماضي، حين كنتم تعيشون فيها."], [8, "وأما الآن، فانزعوا عنكم، أنتم أيضا، هذه الخطايا كلها: الغضب، النقمة، الخبث، التجديف، الكلام القبيح الخارج من أفواهكم."]]}, {"l": "Heb 12:1", "n": "", "vs": [[1, "فبما أن هذا العدد الكبير من الشاهدين للإيمان، يتجمع حولنا كأنه سحابة عظيمة، فلنطرح جانبا كل ثقل يعيقنا عن التقدم، ونتخلص من تلك الخطيئة التي نتعرض للسقوط في فخها بسهولة، لكي نتمكن، نحن أيضا، أن نركض باجتهاد في السباق الممتد أمامنا،"]]}, {"l": "1Pe 2:1", "n": "", "vs": [[1, "لذلك، تخلصوا من كل أثر للشر والخداع والرياء والحسد والذم."]]}, {"l": "1Pe 2:11", "n": "", "vs": [[11, "أيها الأحباء، ما أنتم إلا غرباء تزورون الأرض زيارة عابرة. لذلك أطلب إليكم أن تبتعدوا عن الشهوات الجسدية التي تصارع النفس."]]}], "kwAr": "تخلصوا", "noteAr": ""}, {"kw": "filthiness", "raw": "Jam_4:8; Eze_36:25; 2Co_7:1; Eph_5:4", "note": "", "refs": [{"l": "Jam 4:8", "n": "", "vs": [[8, "اقتربوا إلى الله فيقترب إليكم. أيها الخاطئون نظفوا أيديكم، وياأصحاب الرأيين طهروا قلوبكم."]]}, {"l": "Eze 36:25", "n": "", "vs": [[25, "وأرش عليكم ماء نقيا فتطهرون من كل نجاستكم ومن كل أصنامكم،"]]}, {"l": "2Co 7:1", "n": "", "vs": [[1, "فإذ نلنا هذه الوعود، أيها الأحباء، لنطهر أنفسنا من كل ما يدنس الجسد والروح، ونكمل القداسة في مخافة الله."]]}, {"l": "Eph 5:4", "n": "", "vs": [[4, "وكذلك البذاءة والكلام السفيه والهزل، فهي غير لائقة. وإنما أحرى بكم أن تلهجوا بالشكر لله!"]]}], "kwAr": "من كل نجاسة وشر متزايد", "noteAr": ""}, {"kw": "and receive", "raw": "Psa_25:9; Isa_29:19, Isa_61:1; Zep_2:3; Mat_5:5; Act_10:33; 1Th_1:5, 1Th_2:13", "note": "", "refs": [{"l": "Psa 25:9", "n": "", "vs": [[9, "يدرب الودعاء في سبل الحق ويعلمهم طريقه."]]}, {"l": "Isa 29:19", "n": "", "vs": [[19, "أما الوداعاء فيتجدد فرحهم بالرب، ويبتهج البائسون بقدوس إسرائيل،"]]}, {"l": "Isa 61:1", "n": "", "vs": [[1, "روح السيد الرب علي، لأن الرب مسحني لأبشر المساكين، أرسلني لأضمد جراح المنكسري القلوب، لأنادي للمسبيين بالعتق وللمأسورين بالحرية،"]]}, {"l": "Zep 2:3", "n": "", "vs": [[3, "التمسوا الرب ياودعاء الأرض الراضخين لحكمه. اطلبوا البر والتواضع لعلكم تجدون ملاذا في يوم سخط الرب."]]}, {"l": "Mat 5:5", "n": "", "vs": [[5, "طوبى للودعاء، فإنهم سيرثون الأرض."]]}, {"l": "Act 10:33", "n": "", "vs": [[33, "فأرسلت حالا أدعوك، وقد أحسنت بمجيئك. ونحن الآن جميعا حاضرون أمام الله لنسمع كل ما أمرك به الرب»."]]}, {"l": "1Th 1:5", "n": "", "vs": [[5, "لأن تبشيرنا لكم بالإنجيل لم يكن مجرد كلام، بل كان مصحوبا أيضا بالقوة وبالروح القدس وبتمام اليقين. كما أنكم تعلمون تماما ماذا كنا بينكم لأجل مصلحتكم،"]]}, {"l": "1Th 2:13", "n": "", "vs": [[13, "ولذلك نحن أيضا نرفع الشكر لله بلا توقف، لأنكم لما تلقيتم منا كلمة البشارة من الله، قبلتموها لا كأنها كلمة بشر، بل كما هي في الحقيقة: باعتبارها كلمة الله العاملة أيضا فيكم أنتم المؤمنين."]]}], "kwAr": "قبولا وديعا", "noteAr": ""}, {"kw": "the engrafted", "raw": "Joh_6:63, Joh_6:68; Rom_6:17 *marg. Rom_11:17; Heb_4:2", "note": "", "refs": [{"l": "Joh 6:63", "n": "", "vs": [[63, "الروح هو الذي يعطي الحياة، أما الجسد فلا يفيد شيئا. الكلام الذي كلمتكم به هو روح وحيا ة."]]}, {"l": "Joh 6:68", "n": "", "vs": [[68, "فأجابه سمعان بطرس: «إلى من نذهب يار ب وعندك كلام الحياة الأبدية."]]}, {"l": "Rom 6:17", "n": "*marg.", "vs": [[17, "إنما الشكر لله، لأنكم كنتم عبيدا للخطيئة ولكن أطعتم من القلب صيغة التعليم الذي وضعتم في عهدته."]]}, {"l": "Rom 11:17", "n": "", "vs": [[17, "فإذا كانت بعض أغصان الزيتونة قد قطعت، ثم طعمت فيها وأنت من زيتونة برية، فصرت بذلك شريكا في أصل الزيتونة وغذائها،"]]}, {"l": "Heb 4:2", "n": "", "vs": [[2, "ذلك أن البشارة بالوعد قد وصلت إلينا، نحن أيضا، كما كانت قد وصلت إلى ذلك الشعب. ولكن البشارة لم تنفع سامعيها شيئا، لأنهم قابلوها بالرفض فلم يؤمنوا بها."]]}], "kwAr": "الكلمة التي غرسها الله في قلوبكم", "noteAr": ""}, {"kw": "which", "raw": "Act_13:26; Rom_1:16; 1Co_15:2; Eph_1:13; 2Ti_3:15-17; Tit_2:11; Heb_2:3; 1Pe_1:9", "note": "", "refs": [{"l": "Act 13:26", "n": "", "vs": [[26, "أيها الإخوة، يابني جنس إبراهيم، ويا كل من يتقي الله من الحاضرين هنا: إلينا أرسل الله كلمة هذا الخلاص!"]]}, {"l": "Rom 1:16", "n": "", "vs": [[16, "فأنا لا أستحي بالإنجيل، لأنه قدرة الله للخلاص، لكل من يؤمن، لليهودي أولا ثم لليوناني على السواء."]]}, {"l": "1Co 15:2", "n": "", "vs": [[2, "وبه أيضا أنتم مخلصون، إن كنتم تتمسكون بالكلمة التي بشرتكم بها، إلا إذا كنتم قد آمنتم عبثا."]]}, {"l": "Eph 1:13", "n": "", "vs": [[13, "وفيه أنتم أيضا (وضعتم رجاءكم) إذ سمعتم كلمة الحق، أي الإنجيل الذي فيه خلاصكم؛ كذلك فيه أيضا ختمتم، إذ آمنتم، بالروح القدس الموعود،"]]}, {"l": "2Ti 3:15-17", "n": "", "vs": [[15, "وتعلم أنك منذ حداثة سنك تعرف الكتب المقدسة، وهي القادرة أن تجعلك حكيما لبلوغ الخلاص عن طريق الإيمان في المسيح يسوع."], [16, "إن الكتاب بكل ما فيه، قد أوحى به الله؛ وهو مفيد للتعليم والتوبيخ والتقويم وتهذيب الإنسان في البر،"], [17, "لكي يجعل إنسان الله مؤهلا تأهيلا كاملا، ومجهزا لكل عمل صالح."]]}, {"l": "Tit 2:11", "n": "", "vs": [[11, "فإن نعمة الله التي تحمل معها الخلاص لجميع الناس، قد ظهرت."]]}, {"l": "Heb 2:3", "n": "", "vs": [[3, "فكيف نفلت نحن إن أهملنا هذا الخلاص العظيم جدا؟ فإن الرب يسوع نفسه قد أعلنه أولا، ثم تثبت لنا من الذين سمعوه مباشرة."]]}, {"l": "1Pe 1:9", "n": "", "vs": [[9, "إذ بلغتم هدف إيمانكم، وهو خلاص نفوسكم."]]}], "kwAr": "القادرة أن تخلص نفوسكم", "noteAr": ""}], "arS": [["إذن", ["G1352"]], ["، ", []], ["تخلصوا", ["G659"]], [" من ", []], ["كل", ["G3956"]], [" ما في حياتكم من ", []], ["نجاسة", ["G4507"]], [" ", []], ["وشر", ["G2549"]], [" ", []], ["متزايد", ["G4050"]], [". وليكن ", []], ["قبولكم", ["G1209"]], [" لتلك ", []], ["الكلمة", ["G3056"]], [" التي ", []], ["غرسها", ["G1721"]], [" الله في قلوبكم، ", []], ["قبولا وديعا", ["G4240"]], [". فهي ", []], ["القادرة", ["G1410"]], [" أن ", []], ["تخلص", ["G4982"]], [" ", []], ["نفوسكم", ["G5590"]], [".", []]]}, {"c": 1, "v": 22, "text": "لا تكتفوا فقط بسماعها، بل اعملوا بها، وإلا كنتم تغشون أنفسكم.", "groups": [{"kw": "be", "raw": "Jam_4:17; Mat_7:21-25, Mat_12:50, Mat_28:20; Luk_6:46-48, Luk_11:28, Luk_12:47, Luk_12:48; Joh_13:17; Rom_2:13; Phi_4:8; Col_3:17; 1Jo_2:3, 1Jo_3:7; 3Jo_1:11; Rev_22:7", "note": "", "refs": [{"l": "Jam 4:17", "n": "", "vs": [[17, "فمن يعرف أن يعمل الصواب، ولا يعمله، فإن ذلك يحسب له خطيئة."]]}, {"l": "Mat 7:21-25", "n": "", "vs": [[21, "ليس كل من يقول لي: يارب، يارب! يدخل ملكوت السماوات، بل من يعمل بإرادة أبي الذي في السماوات."], [22, "في ذلك اليوم سيقول لي كثيرون: يارب، يارب، أليس باسمك تنبأنا، وباسمك طردنا الشياطين، وباسمك عملنا معجزات كثيرة؟"], [23, "ولكني عندئذ أصرح لهم: إني لم أعرفكم قط! ابتعدوا عني يافاعلي الإثم!"], [24, "فأي من يسمع أقوالي هذه ويعمل بها، أشبهه برجل حكيم بنى بيته على الصخر،"], [25, "فنزلت الأمطار، وجرت السيول، وهبت العواصف، فضربت ذلك البيت، فلم يسقط لأنه مؤسس على الصخر."]]}, {"l": "Mat 12:50", "n": "", "vs": [[50, "لأن كل من يعمل بإرادة أبي الذي في السماوات هو أخي وأختي وأمي ! »"]]}, {"l": "Mat 28:20", "n": "", "vs": [[20, "وعلموهم أن يعملوا بكل ما أوصيتكم به. وها أنا معكم كل الأيام إلى انتهاء الزمان! »."]]}, {"l": "Luk 6:46-48", "n": "", "vs": [[46, "ولماذا تدعونني: يارب، يارب! ولا تعملون بما أقوله؟"], [47, "كل من يأتي إلي، فيسمع كلامي ويعمل به، أريكم من يشبه."], [48, "إنه يشبه إنسانا يبني بيتا، فحفر وعمق ووضع الأساس على الصخر. ثم هطل مطر غزير وصدم السيل ذلك البيت، فلم يقدر أن يزعزعه، لأنه كان مؤسسا على الصخر."]]}, {"l": "Luk 11:28", "n": "", "vs": [[28, "إلا أنه قال: «بل طوبى للذين يسمعون كلمة الله ويعملون بها»."]]}, {"l": "Luk 12:47", "n": "", "vs": [[47, "وأما ذلك العبد الذي يعمل بإرادة سيده، فإنه سيضرب كثيرا."]]}, {"l": "Luk 12:48", "n": "", "vs": [[48, "ولكن الذي لا يعلمها ويعمل ما يستوجب الضرب، فإنه سيضرب قليلا. فكل من أعطي كثيرا، يطلب منه كثير؛ ومن أودع كثيرا، يطالب بأكثر."]]}, {"l": "Joh 13:17", "n": "", "vs": [[17, "فإن كنتم قد عرفتم هذا، فطوبى لكم إذا عملتم به."]]}, {"l": "Rom 2:13", "n": "", "vs": [[13, "فليس سامعو الشريعة هم الأبرار أمام الله؛ بل العاملون بالشريعة يبررون."]]}, {"l": "Phi 4:8", "n": "", "vs": [[8, "وختاما، أيها الإخوة: كل ما كان حقا، وكل ما كان شريفا، وكل ما كان عادلا، وكل ما كان طاهرا وكل ما كان مستحبا، وكل ما كان حسن السمعة، وكل ما كان فيه فضيلة وخصلة حميدة، فاشغلوا أفكاركم به."]]}, {"l": "Col 3:17", "n": "", "vs": [[17, "ومهما كان ما تعملونه، بالقول أو بالفعل، فليجر كل شيء باسم الرب يسوع، رافعين به الشكر لله الآب."]]}, {"l": "1Jo 2:3", "n": "", "vs": [[3, "وما يؤكد لنا أننا قد عرفنا المسيح حقا هو أن نعمل بوصاياه."]]}, {"l": "1Jo 3:7", "n": "", "vs": [[7, "أيها الأولاد الصغار، لا تدعوا أحدا يضللكم. تأكدوا أن من يمارس الصلاح، يظهر أنه بار كما أن المسيح بار."]]}, {"l": "3Jo 1:11", "n": "", "vs": [[11, "أيها الحبيب، لا تقتد بما هو شر، بل بما هو خير. فإن من يفعل الخير، يكون من الله. ومن يفعل الشر، يبين أنه لم يتعرف بالله قط."]]}, {"l": "Rev 22:7", "n": "", "vs": [[7, "إني آت سريعا! طوبى لمن يراعي ما ورد في كتاب النبوءة هذا!»"]]}], "kwAr": "اعملوا بها", "noteAr": ""}, {"kw": "deceiving", "raw": "Jam_1:26; Isa_44:20; Oba_1:3; 1Co_3:18, 1Co_6:9, 1Co_15:33; Gal_6:3, Gal_6:7; 2Ti_3:13; Tit_3:3; 2Pe_2:13; 1Jo_1:8; Rev_12:9", "note": "", "refs": [{"l": "Jam 1:26", "n": "", "vs": [[26, "وإن ظن أحد أنه متدين، وهو لا يلجم لسانه، فإنه يغش قلبه، وديانته غير نافعة!"]]}, {"l": "Isa 44:20", "n": "", "vs": [[20, "لكأنه يأكل الرماد! يجري وراء سراب ويعجز عن إنقاذ نفسه أو الاعتراف أن الصنم الذي يمسكه بيده هو محض ضلال!"]]}, {"l": "Oba 1:3", "n": "", "vs": [[3, "قد غرتك كبرياء قلبك أيها المقيم في شقوق الصخور، ومساكنه في القمم، القائل في قلبه: من يهوي بي إلى الأرض؟"]]}, {"l": "1Co 3:18", "n": "", "vs": [[18, "حذار أن يخدع أحد منكم نفسه! إن ظن أحد بينكم نفسه حكيما في هذا العالم، فليصر جاهلا ليصير حكيما حقا."]]}, {"l": "1Co 6:9", "n": "", "vs": [[9, "أما تعلمون أن الظالمين لن يرثوا ملكوت الله؟ لا تضلوا: فإن ملكوت الله لن يرثه الزناة ولا عابدو الأصنام ولا الفاسقون ولا المتخنثون ولا مضاجعو الذكور"]]}, {"l": "1Co 15:33", "n": "", "vs": [[33, "لا تنقادوا إلى الضلال: إن المعاشرات الرديئة تفسد الأخلاق الجيدة!"]]}, {"l": "Gal 6:3", "n": "", "vs": [[3, "فإن ظن أحد أنه شيء، وهو في الواقع لا شيء، فإنما يخدع نفسه."]]}, {"l": "Gal 6:7", "n": "", "vs": [[7, "لا تنخدعوا: إن الله لا يستهزأ به. فكل ما يزرعه الإنسان، فإياه يحصد أيضا."]]}, {"l": "2Ti 3:13", "n": "", "vs": [[13, "أما الناس الأشرار والدجالون المحتالون، فيتقدمون في الشر، مضللين الآخرين وهم أنفسهم مضللون!"]]}, {"l": "Tit 3:3", "n": "", "vs": [[3, "فإننا نحن أيضا كنا في الماضي جهالا، غير مطيعين، تائهين في الضلال، عبيدا يخدمون الشهوات واللذات المختلفة، نعيش في الخبث والحسد، مكروهين، وكارهين بعضنا لبعض."]]}, {"l": "2Pe 2:13", "n": "", "vs": [[13, "وبذلك ينالون أجرة إثمهم! إنهم يحسبون الانغماس في اللذات طول النهار بهجة عظيمة. فهم أوساخ وعيوب: يتلذذون بالنجاسة ويحاولون خداعكم، فيشتركون معكم في الولائم."]]}, {"l": "1Jo 1:8", "n": "", "vs": [[8, "إن كنا ندعي أن لا خطيئة لنا، نخدع أنفسنا، ولا يكون الحق في داخلنا."]]}, {"l": "Rev 12:9", "n": "", "vs": [[9, "إذ طرحوا إلى الأرض. هذا التنين العظيم هو الحية القديمة، ويسمى إبليس والشيطان الذي يضلل العالم كله."]]}], "kwAr": "تغشون أنفسكم", "noteAr": ""}], "arS": [["لا تكتفوا ", []], ["فقط", ["G3440"]], [" ", []], ["بسماعها", ["G202"]], ["، بل ", []], ["اعملوا", ["G4163"]], [" بها، وإلا كنتم ", []], ["تغشون", ["G3884"]], [" ", []], ["أنفسكم", ["G1438"]], [".", []]]}, {"c": 1, "v": 23, "text": "فالذي يسمع الكلمة ولا يعمل بها، يكون كمن ينظر إلى المرآة ليشاهد وجهه فيها.", "groups": [{"kw": "", "raw": "Jam_2:14-26; Jer_44:16; Eze_33:31, Eze_33:32; Mat_7:26, Mat_7:27; Luke 6:47-7:16", "note": "", "refs": [{"l": "Jam 2:14-26", "n": "", "vs": [[14, "ياإخوتي، هل ينفع أحدا أن يدعي أنه مؤمن، وليس له أعمال تثبت ذلك، هل يقدر إيمان مثل هذا أن يخلصه؟"], [15, "لنفرض أن أخا أو أختا كانا بحاجة شديدة إلى الثياب والطعام اليومي،"], [16, "وقال لهما أحدكم: «أتمنى لكما كل خير. البسا ثيابا دافئة، وكلا طعاما جيدا!» دون أن يقدم لهما ما يحتاجان إليه من ثياب وطعام، فأي نفع في ذلك؟"], [17, "هكذا نرى أن الإيمان وحده ميت ما لم تنتج عنه أعمال."], [18, "وربما قال أحدكم: «أنت لك إيمان وأنا لي أعمال». أرني كيف يكون إيمانك من غير أعمال، وأنا أريك كيف يكون إيماني بأعمالي."], [19, "أنت تؤمن أن الله واحد؟ حسنا تفعل ! والشياطين أيضا تؤمن بهذه الحقيقة، ولكنها ترتعد خوفا."], [20, "وهذا يؤكد لك، أيها الإنسان الغبي، أن الإيمان الذي لا تنتج عنه أعمال هو إيمان ميت!"], [21, "لنأخذ أبانا إبراهيم مثلا: كيف تبرر؟ أليس بأعماله، إذ أصعد ابنه إسحاق على المذبح"], [22, "فأنت ترى أن إيمان إبراهيم قد رافقته الأعمال. فبالأعمال قد اكتمل الإيمان."], [23, "وهكذا، تم ما قاله الكتاب: «آمن إبراهيم بالله، فحسب له ذلك برا»، حتى إنه دعي «خليل الله»."], [24, "فترون إذن أن الإنسان لا يتبرر بإيمانه فقط، بل بأعماله أيضا."], [25, "على هذا الأساس أيضا، تبررت راحاب التي كانت زانية: فقد استقبلت الرجلين اللذين أرسلا إليها، وصرفتهما في طريق آخر."], [26, "فكما أن جسم الإنسان يكون ميتا إذا فارقته الروح، كذلك يكون الإيمان ميتا إذا لم ترافقه الأعمال!"]]}, {"l": "Jer 44:16", "n": "", "vs": [[16, "«لن نطيعك في ما خاطبتنا به من كلام باسم الرب،"]]}, {"l": "Eze 33:31", "n": "", "vs": [[31, "ويقبلون إليك مثل سائر الشعب ويجلسون في حضرتك نظير شعبي، ويصغون إلى كلامك ولا يعملون به. إنهم يعربون عن أشواقهم بكلامهم، أما قلبهم فقد غوى وراء مكسبهم."]]}, {"l": "Eze 33:32", "n": "", "vs": [[32, "وها أنت لهم كقصيدة حب يتغنى بها ذو صوت عذب، يحسن العزف، فيصغون إلى كلامك ولا يعملون به."]]}, {"l": "Mat 7:26", "n": "", "vs": [[26, "وأي من يسمع أقوالي هذه ولا يعمل بها، يشبه برجل غبي بنى بيته على الرمل،"]]}, {"l": "Mat 7:27", "n": "", "vs": [[27, "فنزلت الأمطار، وجرت السيول، وهبت العواصف، فضربت ذلك البيت، فسقط، وكان سقوطه عظيما»"]]}, {"l": "Luk 6:47-7:16", "n": "", "vs": [[47, "كل من يأتي إلي، فيسمع كلامي ويعمل به، أريكم من يشبه."], [48, "إنه يشبه إنسانا يبني بيتا، فحفر وعمق ووضع الأساس على الصخر. ثم هطل مطر غزير وصدم السيل ذلك البيت، فلم يقدر أن يزعزعه، لأنه كان مؤسسا على الصخر."], [49, "وأما من سمع ولم يعمل، فهو يشبه إنسانا بنى بيتا على الأرض دون أساس. فلما صدمه السيل، انهار في الحال؛ وكان خراب ذلك البيت جسيما! »"], [1, "وبعدما أتم إلقاء أقواله كلها في مسامع الشعب، دخل بلدة كفرناحوم."], [2, "وكان عند قائد مئة عبد مريض قد أشرف على الموت، وكان عزيزا عليه."], [3, "فلما سمع بيسوع، أرسل إليه شيوخ اليهود، متوسلا إليه أن يأتي وينقذ عبده."], [4, "ولما أدركوا يسوع، طلبوا إليه بإلحاح قائلين: «إنه يستحق أن تمنحه طلبه،"], [5, "فهو يحب أمتنا، وقد بنى لنا المجمع»."], [6, "فرافقهم يسوع. ولكن ما إن أصبح على مقربة من البيت، حتى أرسل إليه قائد المئة بعض أصدقائه، يقول له: «ياسيد، لا تكلف نفسك، لأني لا أستحق أن تدخل تحت سقف بيتي."], [7, "ولذلك لا أعتبر نفسي أهلا لأن ألاقيك. إنما قل كلمة، فيشفى خادمي:"], [8, "فأنا أيضا رجل موضوع تحت سلطة أعلى مني، ولي جنود تحت إمرتي، أقول لأحدهم: اذهب! فيذهب؛ ولغيره: تعال! فيأتي؛ ولعبدي: افعل هذا! فيفعل»."], [9, "فلما سمع يسوع ذلك، تعجب منه، ثم التفت إلى الجمع الذي يتبعه، وقال: «أقول لكم: لم أجد حتى في إسرائيل إيمانا عظيما كهذا!»"], [10, "ولما رجع المرسلون إلى البيت، وجدوا العبد المريض قد تعافى."], [11, "وفي اليوم التالي، ذهب إلى مدينة اسمها نايين، يرافقه كثيرون من تلاميذه وجمع عظيم."], [12, "ولما اقترب من باب المدينة، إذا ميت محمول، وهو ابن وحيد لأمه التي كانت أرملة، وكان معها جمع كبير من المدينة."], [13, "فلما رآها الرب، تحنن عليها، وقال لها: «لا تبكي!»"], [14, "ثم تقدم ولمس النعش، فتوقف حاملوه. وقال: «أيها الشاب، لك أقول: قم!»"], [15, "فجلس الميت وبدأ يتكلم، فسلمه إلى أمه."], [16, "فاستولى الخوف على الجميع، ومجدوا الله، قائلين: «قد قام فينا نبي عظيم وتفقد الله شعبه !»"]]}], "kwAr": "", "noteAr": ""}], "arS": [["فالذي ", []], ["يسمع", ["G202"]], [" ", []], ["الكلمة", ["G3056"]], [" ", []], ["ولا", ["G3756"]], [" ", []], ["يعمل", ["G4163"]], [" بها، يكون ", []], ["كمن", ["G1503"]], [" ", []], ["ينظر", ["G2657"]], [" إلى ", []], ["المرآة", ["G2072"]], [" ليشاهد ", []], ["وجهه", ["G4383"]], [" فيها.", []]]}, {"c": 1, "v": 24, "text": "وبعد أن يرى نفسه، يذهب فينسى صورته حالا.", "groups": [{"kw": "what", "raw": "Jdg_8:18; Mat_8:27; Luk_1:66, Luk_7:39; 1Th_1:5; 2Pe_3:11", "note": "", "refs": [{"l": "Jdg 8:18", "n": "", "vs": [[18, "وسأل جدعون زبح وصلمناع: «ما هيئة الرجال الذين قتلتماهم في تابور؟» فأجابا: «إنهم يشبهونك كل واحد منهم مثل ابن ملك»."]]}, {"l": "Mat 8:27", "n": "", "vs": [[27, "فتعجب الناس وقالوا: «ترى، من هذا حتى إن الريح والبحر يطيعانه؟ »"]]}, {"l": "Luk 1:66", "n": "", "vs": [[66, "وكان جميع السامعين يضعونها في قلوبهم، قائلين: «ترى، ماذا سيصير هذا الطفل؟» فقد كانت يد الرب معه."]]}, {"l": "Luk 7:39", "n": "", "vs": [[39, "فلما رأى الفريسي الذي دعاه ذلك، حدث نفسه قائلا: «لو كان هذا نبيا، لعلم من هي هذه المرأة التي تلمسه، وما حالها؛ فإنها خاطئة!»"]]}, {"l": "1Th 1:5", "n": "", "vs": [[5, "لأن تبشيرنا لكم بالإنجيل لم يكن مجرد كلام، بل كان مصحوبا أيضا بالقوة وبالروح القدس وبتمام اليقين. كما أنكم تعلمون تماما ماذا كنا بينكم لأجل مصلحتكم،"]]}, {"l": "2Pe 3:11", "n": "", "vs": [[11, "ومادامت هذه الأشياء جميعا ستنحل، فكيف يجب أن تكونوا أنتم أصحاب سلوك مقدس يتصف بالتقوى،"]]}], "kwAr": "فينسى صورته حالا", "noteAr": ""}], "arS": [["وبعد أن ", []], ["يرى", ["G2657"]], [" ", []], ["نفسه", ["G1438"]], ["، ", []], ["يذهب", ["G565"]], [" ", []], ["فينسى", ["G1950"]], [" ", []], ["صورته", ["G3697"]], [" ", []], ["حالا", ["G2112"]], [".", []]]}, {"c": 1, "v": 25, "text": "أما الذي ينظر بالتدقيق في القانون الكامل، قانون الحرية، ويواظب على ذلك، فيكون كمن يعمل بالكلمة لا كمن يسمعها وينساها، فإن الله يباركه كثيرا في كل ما يعمله.", "groups": [{"kw": "looketh", "raw": "Pro_14:15; Isa_8:20; 2Co_13:5; Heb_12:15", "note": "", "refs": [{"l": "Pro 14:15", "n": "", "vs": [[15, "الغبي يصدق كل كلمة تقال له، والعاقل يتنبه إلى موقع خطواته."]]}, {"l": "Isa 8:20", "n": "", "vs": [[20, "فإلى الشريعة وإلى الشهادة: ومن لا ينطق بمثل هذا القول، فلا فجر له."]]}, {"l": "2Co 13:5", "n": "", "vs": [[5, "لذلك امتحنوا أنفسكم لتروا هل أنتم في الإيمان. اختبروا أنفسكم. ألستم تعرفون أنفسكم، أن يسوع المسيح فيكم، إلا إذا تبين أنكم فاشلون؟"]]}, {"l": "Heb 12:15", "n": "", "vs": [[15, "انتبهوا ألا يسقط أحدكم من نعمة الله، حتى لا يتأصل بينكم جذر مرارة، فيسبب بلبلة، وينجس كثيرين منكم."]]}], "kwAr": "ينظر بالتدقيق", "noteAr": ""}, {"kw": "the perfect", "raw": "Jam_2:12; Psa_19:7-10, Psa_119:32, Psa_119:45, Psa_119:96-105; Rom_7:12, Rom_7:22, Rom_7:23", "note": "", "refs": [{"l": "Jam 2:12", "n": "", "vs": [[12, "إذن، تصرفوا في القول والعمل بحسب قانون الحرية، كأنكم سوف تحاكمون وفقا له."]]}, {"l": "Psa 19:7-10", "n": "", "vs": [[7, "شريعة الرب كاملة تنعش النفس. شهادة الرب صادقة تجعل الجاهل حكيما."], [8, "وصايا الرب مستقيمة تفرح القلب. أمر الرب نقي ينير العينين."], [9, "مخافة الرب طاهرة ثابتة إلى الأبد، وأحكام الرب حق وعادلة كلها."], [10, "إنها أشهى من الذهب النقي، وهي أحلى من العسل بل القطر السائل من أقراص الشهد."]]}, {"l": "Psa 119:32", "n": "", "vs": [[32, "أجد مسرعا في طريق وصاياك، لأنك تشرح قلبي."]]}, {"l": "Psa 119:45", "n": "", "vs": [[45, "وأسلك في رحابة الحرية، لأني التمست أوامرك."]]}, {"l": "Psa 119:96-105", "n": "", "vs": [[96, "رأيت لكل كمال حدا، أما وصيتك فلا حد لها."], [97, "كم أحببت شريعتك، إنها موضوع تأملي طول النهار."], [98, "وصيتك جعلتني أحكم من أعدائي، لأنها نصيبي إلى الأبد."], [99, "صرت أكثر فهما من معلمي، لأن شهاداتك هي موضوع تأملي."], [100, "صرت أكثر فطنة من الشيوخ، لأني راعيت وصاياك."], [101, "منعت قدمي عن سلوك كل طريق شر، لكي أحفظ كلامك."], [102, "لم أبتعد عن أحكامك لأنك هكذا علمتني."], [103, "ما أحلى أقوالك لمذاقي. إنها أحلى من العسل في فمي."], [104, "من وصاياك اكتسبت فطنة لذلك أبغضت كل طريق باطل."], [105, "سراج لرجلي كلامك ونور لسبيلي."]]}, {"l": "Rom 7:12", "n": "", "vs": [[12, "فالشريعة إذن مقدسة، والوصية مقدسة وعادلة وصالحة."]]}, {"l": "Rom 7:22", "n": "", "vs": [[22, "أن لدي الشر. فإنني، وفقا للإنسان الباطن في، أبتهج بشريعة الله."]]}, {"l": "Rom 7:23", "n": "", "vs": [[23, "ولكنني أرى في أعضائي ناموسا آخر يحارب الشريعة التي يريدها عقلي، ويجعلني أسيرا لناموس الخطيئة الكائن في أعضائي."]]}], "kwAr": "القانون الكامل", "noteAr": ""}, {"kw": "liberty", "raw": "Joh_8:32, Joh_8:36; Rom_8:15; 2Co_3:17, 2Co_3:18; Gal_5:1; 1Pe_2:16", "note": "", "refs": [{"l": "Joh 8:32", "n": "", "vs": [[32, "وتعرفون الحق، والحق يحرركم»."]]}, {"l": "Joh 8:36", "n": "", "vs": [[36, "فإن حرركم الابن تصيرون بالحق أحرارا."]]}, {"l": "Rom 8:15", "n": "", "vs": [[15, "إذ إنكم لم تنالوا روح عبودية يعيدكم إلى الخوف، بل نلتم روح بنوة به نصرخ: «أبا! أبانا!»"]]}, {"l": "2Co 3:17", "n": "", "vs": [[17, "فإن الرب هو الروح، وحيث يكون روح الرب، فهناك الحرية."]]}, {"l": "2Co 3:18", "n": "", "vs": [[18, "ونحن جميعا فيما ننظر إلى مجد الرب بوجوه كالمرآة لا حجاب عليها، نتجلى من مجد إلى مجد لنشابه الصورة الواحدة عينها، وذلك بفعل الرب الروح."]]}, {"l": "Gal 5:1", "n": "", "vs": [[1, "إن المسيح قد حررنا وأطلقنا في سبيل الحرية. فاثبتوا إذن، ولا تعودوا إلى الارتباك بنير العبودية."]]}, {"l": "1Pe 2:16", "n": "", "vs": [[16, "تصرفوا كأحرار حقا، لا كالذين يتخذون من الحرية ستارا لارتكاب الشر بل باعتبار أنكم عبيد لله."]]}], "kwAr": "قانون الحرية", "noteAr": ""}, {"kw": "and", "raw": "1Sa_12:14; Joh_8:31, Joh_15:9, Joh_15:10; Act_2:42, Act_13:43, Act_26:22; Rom_2:7, Rom_2:8, Rom_11:22; Col_1:23; 1Ti_2:15, 1Ti_4:16; 1Jo_2:24", "note": "", "refs": [{"l": "1Sa 12:14", "n": "", "vs": [[14, "فإن اتقيتم الرب وعبدتموه وأطعتم وصاياه ولم تعصوا أمره واتبعتم الرب إلهكم أنتم وملككم المتسلط عليكم: فلن يصيبكم مكروه."]]}, {"l": "Joh 8:31", "n": "", "vs": [[31, "فقال لليهود الذين آمنوا به: «إن ثبتم في كلمتي، كنتم حقا تلاميذي."]]}, {"l": "Joh 15:9", "n": "", "vs": [[9, "مثلما أحبني الآب، أحببتكم أنا، فاثبتوا في محبتي."]]}, {"l": "Joh 15:10", "n": "", "vs": [[10, "إن عملتم بوصاياي، تثبتون في محبتي، كما عملت أنا بوصايا أبي وأثبت في محبته!"]]}, {"l": "Act 2:42", "n": "", "vs": [[42, "وكان الجميع يداومون على تلقي تعليم الرسل، وعلى حياة الشركة، وكسر الخبز، والصلوات."]]}, {"l": "Act 13:43", "n": "", "vs": [[43, "وتبعهما بعد الاجتماع كثيرون من اليهود والمتهودين العابدين، فأخذا يكلمانهم ويشجعانهم على الثبات في نعمة الله."]]}, {"l": "Act 26:22", "n": "", "vs": [[22, "ولكن الله حفظني حتى هذا اليوم، وبمعونته أقف أمام البسطاء والعظماء شاهدا له ولست أحيد عما تنبأ به موسى والأنبياء،"]]}, {"l": "Rom 2:7", "n": "", "vs": [[7, "فتكون الحياة الأبدية للذين يسعون إلى المجد والكرامة والخلود مثابرين على العمل الصالح؛"]]}, {"l": "Rom 2:8", "n": "", "vs": [[8, "ويكون الغضب والسخط للمخاصمين الذين يرفضون الطاعة للحق ولكنهم يخضعون للإثم."]]}, {"l": "Rom 11:22", "n": "", "vs": [[22, "فتأمل إذا لطف الله وشدته: أما الشدة، فعلى الذين سقطوا؛ وأما لطف الله فمن نحوك مادمت تثبت في اللطف. ولو لم تكن ثابتا، لكنت أنت أيضا تقطع."]]}, {"l": "Col 1:23", "n": "", "vs": [[23, "على أن تثبتوا فعلا في الإيمان، مؤسسين وراسخين وغير متحولين عن رجاء الإنجيل الذي سمعتموه والذي بشر به للخليقة كلها تحت السماء، وله صرت أنا بولس خادما."]]}, {"l": "1Ti 2:15", "n": "", "vs": [[15, "إلا أنها ستحفظ سالمة في ولادة الأولاد، على أن يثبتن في الإيمان والمحبة والقداسة مع الرزانة!"]]}, {"l": "1Ti 4:16", "n": "", "vs": [[16, "انتبه جيدا لنفسك وللتعليم. فإنك إذ تواظب على ذلك، تنقذ نفسك وسامعيك أيضا."]]}, {"l": "1Jo 2:24", "n": "", "vs": [[24, "أما أنتم، فالكلام الذي سمعتموه منذ البداية، فليكن راسخا فيكم. فحين يترسخ ذلك الكلام في داخلكم، تتوطد صلتكم بالابن، وبالآب."]]}], "kwAr": "ويواظب على ذلك", "noteAr": ""}, {"kw": "a forgetful", "raw": "Jam_1:23, Jam_1:24", "note": "", "refs": [{"l": "Jam 1:23", "n": "", "vs": [[23, "فالذي يسمع الكلمة ولا يعمل بها، يكون كمن ينظر إلى المرآة ليشاهد وجهه فيها."]]}, {"l": "Jam 1:24", "n": "", "vs": [[24, "وبعد أن يرى نفسه، يذهب فينسى صورته حالا."]]}], "kwAr": "لا كمن يسمعها وينساها", "noteAr": ""}, {"kw": "this", "raw": "Psa_19:11, Psa_106:3, Psa_119:2, Psa_119:3; Luk_6:47-49, Luk_11:28; Joh_13:17; 1Co_15:58; Rev_14:13, Rev_22:14", "note": "", "refs": [{"l": "Psa 19:11", "n": "", "vs": [[11, "عبدك يهتدي بها، وفي صونها ثواب عظيم."]]}, {"l": "Psa 106:3", "n": "", "vs": [[3, "طوبى للعاملين بالعدل والبر في كل حين."]]}, {"l": "Psa 119:2", "n": "", "vs": [[2, "طوبى لمن يحفظون وصايا الرب، الذين يطلبونه بكل القلب،"]]}, {"l": "Psa 119:3", "n": "", "vs": [[3, "ولا يرتكبون إثما، إنما في طرقه يسيرون."]]}, {"l": "Luk 6:47-49", "n": "", "vs": [[47, "كل من يأتي إلي، فيسمع كلامي ويعمل به، أريكم من يشبه."], [48, "إنه يشبه إنسانا يبني بيتا، فحفر وعمق ووضع الأساس على الصخر. ثم هطل مطر غزير وصدم السيل ذلك البيت، فلم يقدر أن يزعزعه، لأنه كان مؤسسا على الصخر."], [49, "وأما من سمع ولم يعمل، فهو يشبه إنسانا بنى بيتا على الأرض دون أساس. فلما صدمه السيل، انهار في الحال؛ وكان خراب ذلك البيت جسيما! »"]]}, {"l": "Luk 11:28", "n": "", "vs": [[28, "إلا أنه قال: «بل طوبى للذين يسمعون كلمة الله ويعملون بها»."]]}, {"l": "Joh 13:17", "n": "", "vs": [[17, "فإن كنتم قد عرفتم هذا، فطوبى لكم إذا عملتم به."]]}, {"l": "1Co 15:58", "n": "", "vs": [[58, "إذن، ياإخوتي الأحباء، كونوا راسخين غير متزحزحين، كثيري الاجتهاد في عمل الرب دائما، عالمين أن جهدكم في الرب ليس عبثا!"]]}, {"l": "Rev 14:13", "n": "", "vs": [[13, "وسمعت صوتا من السماء يقول: «اكتب: طوبى للأموات الذين يموتون منذ الآن وهم في الرب! يقول الروح: نعم! فليستريحوا من متاعبهم، لأن أعمالهم ترافقهم»."]]}, {"l": "Rev 22:14", "n": "", "vs": [[14, "طوبى للذين يغسلون ثيابهم، فلهم السلطة على شجرة الحياة، والحق في دخول المدينة من الأبواب!"]]}], "kwAr": "فإن الله يباركه", "noteAr": ""}, {"kw": "deed", "raw": "or, doing", "note": "or, doing", "refs": [], "kwAr": "في كل ما يعمله", "noteAr": "أو: عمله."}], "arS": [["أما الذي ينظر ", []], ["بالتدقيق", ["G3879"]], [" في ", []], ["القانون", ["G3551"]], [" ", []], ["الكامل", ["G5046"]], ["، قانون ", []], ["الحرية", ["G1657"]], ["، ", []], ["ويواظب", ["G3887"]], [" على ذلك، فيكون كمن ", []], ["يعمل", ["G4163"]], [" بالكلمة لا كمن ", []], ["يسمعها", ["G202"]], [" ", []], ["وينساها", ["G1953"]], ["، فإن الله ", []], ["يباركه", ["G3107"]], [" كثيرا في كل ما ", []], ["يعمله", ["G4162"]], [".", []]]}, {"c": 1, "v": 26, "text": "وإن ظن أحد أنه متدين، وهو لا يلجم لسانه، فإنه يغش قلبه، وديانته غير نافعة!", "groups": [{"kw": "seem", "raw": "Pro_14:12, Pro_16:25; Luk_8:18; 1Co_3:18; Gal_2:6, Gal_2:9, Gal_6:3", "note": "", "refs": [{"l": "Pro 14:12", "n": "", "vs": [[12, "رب طريق تبدو للإنسان قويمة، ولكن عاقبتها هوة الموت."]]}, {"l": "Pro 16:25", "n": "", "vs": [[25, "رب طريق تبدو للإنسان قويمة ولكن عاقبتها تفضي إلى دروب الموت."]]}, {"l": "Luk 8:18", "n": "", "vs": [[18, "فتنبهوا إذن كيف تسمعون. فإن من عنده، يعطى المزيد؛ ومن لم يكن عنده، فحتى الذي يظنه له، ينتزع منه!»"]]}, {"l": "1Co 3:18", "n": "", "vs": [[18, "حذار أن يخدع أحد منكم نفسه! إن ظن أحد بينكم نفسه حكيما في هذا العالم، فليصر جاهلا ليصير حكيما حقا."]]}, {"l": "Gal 2:6", "n": "", "vs": [[6, "أما الذين كانوا يعتبرون من البارزين، ولا فرق عندي مهما كانت مكانتهم مادام الله لا يراعي وجاهة إنسان، فإنهم لم يزيدوا شيئا على ما أبشر به."]]}, {"l": "Gal 2:9", "n": "", "vs": [[9, "فلما اتضحت النعمة الموهوبة لي عند يعقوب وبطرس ويوحنا، وهم البارزون باعتبارهم أعمدة، مدوا إلي وإلى برنابا أيديهم اليمنى إشارة إلى المشاركة، فنتوجه نحن إلى الأمم وهم إلى أهل الختان،"]]}, {"l": "Gal 6:3", "n": "", "vs": [[3, "فإن ظن أحد أنه شيء، وهو في الواقع لا شيء، فإنما يخدع نفسه."]]}], "kwAr": "إن ظن أحد أنه متدين", "noteAr": ""}, {"kw": "bridleth", "raw": "Jam_1:19, Jam_3:2-6; Psa_32:9, Psa_34:13, Psa_39:1, Psa_39:2, Psa_141:3; Pro_10:19, Pro_10:31, Pro_13:2, Pro_13:3, Pro_15:2; Pro_16:10, Pro_19:1, Pro_21:26; Eph_4:29, Eph_5:4; Col_4:6; 1Pe_3:10", "note": "", "refs": [{"l": "Jam 1:19", "n": "", "vs": [[19, "لذلك، ياإخوتي الأحباء، على كل واحد منكم أن يكون مسرعا إلى الإصغاء، غير متسرع في الكلام، بطيء الغضب."]]}, {"l": "Jam 3:2-6", "n": "", "vs": [[2, "فإننا جميعا معرضون للوقوع في أخطاء كثيرة. ولكن من يلجم لسانه ولا يخطيء في كلامه هو ناضج يقدر أن يسيطر على طبيعته سيطرة تامة."], [3, "فحين نضع لجاما في فم حصان، نتمكن من توجيهه واقتياده كما نريد."], [4, "ومهما كانت السفينة كبيرة والرياح التي تدفعها قوية وهوجاء، فبدفة صغيرة جدا يتحكم الربان فيها ويسوقها إلى الجهة التي يريد. كذلك اللسان أيضا: فهو عضو صغير،"], [5, "ولكن ما أشد فعاليته! انظروا: إن شرارة صغيرة تحرق غابة كبيرة!"], [6, "واللسان كالنار خطرا: فهو وحده، بين أعضاء الجسم، جامع للشرور كلها، ويلوث الجسم كله بالفساد. إنه يشعل دائرة الكون، ويستمد ناره من جهنم!"]]}, {"l": "Psa 32:9", "n": "", "vs": [[9, "لا تكونوا بلا عقل كالحصان والبغل؛ الذي لا يطيع إلا إذا ضبط باللجام وقيد بالحبل."]]}, {"l": "Psa 34:13", "n": "", "vs": [[13, "فليمنع لسانه عن الشر وشفتيه عن كلام الغش"]]}, {"l": "Psa 39:1", "n": "", "vs": [[1, "قلت: «أحرص على حسن المسلك فلا يخطيء لساني القول. سأكم فمي عن الكلام مادام الشرير أمامي»."]]}, {"l": "Psa 39:2", "n": "", "vs": [[2, "صمت صمتا. أمسكت حتى عن الخير، فثار وجعي."]]}, {"l": "Psa 141:3", "n": "", "vs": [[3, "أقم يارب حارسا لفمي، واحفظ باب شفتي."]]}, {"l": "Pro 10:19", "n": "", "vs": [[19, "في كثرة الكلام زلات لسان، ومن يضبط شفتيه فهو عاقل."]]}, {"l": "Pro 10:31", "n": "", "vs": [[31, "من فم الصديق تفيض الحكمة، واللسان المخاتل يقطع."]]}, {"l": "Pro 13:2", "n": "", "vs": [[2, "من ثمر أقوال فمه يأكل الإنسان خيرا، وشهوة الغادرين ارتكاب الظلم."]]}, {"l": "Pro 13:3", "n": "", "vs": [[3, "من ضبط لسانه صان حياته، ومن فغر شدقيه متهورا بكلامه، فمصيره الدمار."]]}, {"l": "Pro 15:2", "n": "", "vs": [[2, "لسان الحكيم يتقن المعرفة، وأقوال الجهال تفيض حماقة."]]}, {"l": "Pro 16:10", "n": "", "vs": [[10, "تنطق شفتا الملك بالوحي، وفمه لا يخون في القضاء."]]}, {"l": "Pro 19:1", "n": "", "vs": [[1, "الفقير السالك بكماله خير من الجاهل المخاتل."]]}, {"l": "Pro 21:26", "n": "", "vs": [[26, "يظل طوال النهار متشهيا متمنيا، أما الصديق فيسخو ولا يضن"]]}, {"l": "Eph 4:29", "n": "", "vs": [[29, "لا تخرج من أفواهكم كلمة فاسدة، بل الكلام الصالح للبنيان الذي تدعو إليه الحاجة، كي يعطي السامعين نعمة."]]}, {"l": "Eph 5:4", "n": "", "vs": [[4, "وكذلك البذاءة والكلام السفيه والهزل، فهي غير لائقة. وإنما أحرى بكم أن تلهجوا بالشكر لله!"]]}, {"l": "Col 4:6", "n": "", "vs": [[6, "ليكن كلامكم دائما مصحوبا بالنعمة، وليكن مصلحا بملح، فتعرفوا كيف يجب أن تجيبوا كل واحد."]]}, {"l": "1Pe 3:10", "n": "", "vs": [[10, "فمن أراد أن يتمتع بحياة سعيدة وأيام طيبة، فليمنع لسانه عن الشر وشفتيه عن كلام الغش."]]}], "kwAr": "لا يلجم لسانه", "noteAr": ""}, {"kw": "but", "raw": "Jam_1:22; Deu_11:16; Isa_44:20; Gal_6:3", "note": "", "refs": [{"l": "Jam 1:22", "n": "", "vs": [[22, "لا تكتفوا فقط بسماعها، بل اعملوا بها، وإلا كنتم تغشون أنفسكم."]]}, {"l": "Deu 11:16", "n": "", "vs":  مكان سلام!"], [2, "ياإخوتي، عندما تنزل بكم التجارب والمحن المختلفة، اعتبروها سبيلا إلى الفرح الكلي."], [3, "وكونوا على ثقة بأن امتحان إيمانكم هذا ينتج صبرا."], [4, "ودعوا الصبر يعمل عمله الكامل فيكم، لكي يكتمل نضوجكم وتصيروا أقوياء قادرين على مواجهة جميع الأحوال."], [5, "وإن كان أحد منكم بحاجة إلى الحكمة، فليطلب من الله الذي يعطي الجميع بسخاء ولا يعير. فسيعطى له."], [6, "وإنما، عليه أن يطلب ذلك بإيمان، دون أي تردد أو شك. فإن المتردد كموجة البحر تتلاعب بها الرياح فتقذفها وتردها!"], [7, "فلا يتوهم المتردد أنه ينال شيئا من الرب."], [8, "فعندما يكون الإنسان برأيين، لا يثبت على قرار في جميع أموره."], [9, "من كان فقيرا وأخا مؤمنا، فليسر بمقامه الذي رفعه الله إليه."], [10, "وأما الغني، فعليه أن يسر بأن ما له لا يغنيه عن الله: لأن نهايته ستكون كنهاية الأعشاب المزهرة."], [11, "فعندما تشرق الشمس بحرها المحرق، تيبس تلك الأعشاب، فيسقط زهرها، ويتلاشى جمال منظرها. هكذا يذبل الغني في طرقه!"], [12, "طوبى لمن يتحمل المحنة بصبر. فإنه، بعد أن يجتاز الامتحان بنجاح، سينال «إكليل الحياة» الذي وعد به الرب محبيه!"], [13, "وإذا تعرض أحد لتجربة ما، فلا يقل: «إن الله يجربني!» ذلك لأن الله لا يمكن أن يجربه الشر، وهو لا يجرب به أحدا."], [14, "ولكن الإنسان يسقط في التجربة حين يندفع مخدوعا وراء شهوته."], [15, "فإذا ما حبلت الشهوة ولدت الخطيئة. ومتى نضجت الخطيئة، أنتجت الموت."], [16, "فيا إخوتي الأحباء، لا تضلوا:"], [17, "إن كل عطية صالحة وهبة كاملة إنما تنزل من فوق، من لدن أبي الأنوار الذي ليس فيه تحول، ولا ظل لأنه لا يدور."], [18, "وهو قد شاء أن يجعلنا أولادا له، فولدنا بكلمته، كلمة الحق. وغايته أن نكون باكورة خليقته."], [19, "لذلك، ياإخوتي الأحباء، على كل واحد منكم أن يكون مسرعا إلى الإصغاء، غير متسرع في الكلام، بطيء الغضب."], [20, "لأن الإنسان، إذا غضب، لا يعمل الصلاح الذي يريده الله ."], [21, "إذن، تخلصوا من كل ما في حياتكم من نجاسة وشر متزايد. وليكن قبولكم لتلك الكلمة التي غرسها الله في قلوبكم، قبولا وديعا. فهي القادرة أن تخلص نفوسكم."], [22, "لا تكتفوا فقط بسماعها، بل اعملوا بها، وإلا كنتم تغشون أنفسكم."], [23, "فالذي يسمع الكلمة ولا يعمل بها، يكون كمن ينظر إلى المرآة ليشاهد وجهه فيها."], [24, "وبعد أن يرى نفسه، يذهب فينسى صورته حالا."], [25, "أما الذي ينظر بالتدقيق في القانون الكامل، قانون الحرية، ويواظب على ذلك، فيكون كمن يعمل بالكلمة لا كمن يسمعها وينساها، فإن الله يباركه كثيرا في كل ما يعمله."], [26, "وإن ظن أحد أنه متدين، وهو لا يلجم لسانه، فإنه يغش قلبه، وديانته غير نافعة!"], [27, "فالديانة الطاهرة النقية في نظر الله الآب، تظهر في زيارة الأيتام والأرامل لإعانتهم في ضيقهم، وفي صيانة النفس من التلوث بفساد العالم."]]}, {"l": "Job 34:19", "n": "", "vs": [[19, "الذي لا يحابي الأمراء، ولا يؤثر الأغنياء على الفقراء، لأنهم جميعا عمل يديه."]]}, {"l": "Mal 2:9", "n": "", "vs": [[9, "لذلك أحقركم وأذلكم أمام جميع الناس، لأنكم لم تطيعوا طرقي، وحابيتم في تطبيق شريعتي»."]]}], "kwAr": "تميزون بين الناس", "noteAr": ""}, {"kw": "judges", "raw": "Jam_4:11; Job_21:27; Psa_58:1, Psa_82:2, Psa_109:31; Mat_7:1-5; Joh_7:24", "note": "", "refs": [{"l": "Jam 4:11", "n": "", "vs": [[11, "وياإخوتي، لا تذموا بعضكم بعضا. فمن يفعل هذا ويحكم على أخيه، يطعن في شريعة الله ويحكم عليها. فإن كنت تحكم على الشريعة، لا تكون عاملا بها بل تجعل نفسك قاضيا لها."]]}, {"l": "Job 21:27", "n": "", "vs": [[27, "انظروا، أنا مطلع على أفكاركم وما تتهمونني به جورا،"]]}, {"l": "Psa 58:1", "n": "", "vs": [[1, "أحقا تنطقون بالحق أيها الحكام، وتقضون بالاستقامة يابني البشر؟"]]}, {"l": "Psa 82:2", "n": "", "vs": [[2, "حتى متى تقضون بالظلم وتنحازون إلى الأشرار؟"]]}, {"l": "Psa 109:31", "n": "", "vs": [[31, "لأنه يقف عن يمين المظلوم ليخلصه من الحاكمين عليه بالموت."]]}, {"l": "Mat 7:1-5", "n": "", "vs": [[1, "لا تدينوا لئلا تدانوا."], [2, "فإنكم بالدينونة التي بها تدينون تدانون؛ وبالكيل الذي به تكيلون يكال لكم."], [3, "لماذا تلاحظ القشة في عين أخيك، ولكنك لا تتنبه إلى الخشبة الكبيرة في عينك؟"], [4, "أو كيف تقول لأخيك: دعني أخرج القشة من عينك، وها هي الخشبة في عينك أنت!"], [5, "يامرائي! أخرج أولا الخشبة من عينك، وعندئذ تبصر جيدا لتخرج القشة من عين أخيك."]]}, {"l": "Joh 7:24", "n": "", "vs": [[24, "لا تحكموا بحسب الظاهر، بل احكموا حكما عادلا»."]]}], "kwAr": "قضاة ذوي أفكار سيئة", "noteAr": ""}], "arS": [["ف h_8:49; 1Co_11:22", "note": "", "refs": [{"l": "Jam 2:3", "n": "", "vs": [[3, "فإن رحبتم بالغني قائلين: «تفضل، اجلس هنا في الصدر!» ثم قلتم للفقير: «وأنت، قف هناك، أو اقعد على الأرض عند أقدامنا!»"]]}, {"l": "Psa 14:6", "n": "", "vs": [[6, "تسفهون رأي المسكين، لأنه جعل الله ملجأه."]]}, {"l": "Pro 14:31", "n": "", "vs": [[31, "من يجور على الفقير يهين صانعه، ومن يرحم البائس يكرم خالقه،"]]}, {"l": "Pro 17:5", "n": "", "vs": [[5, "المستهزيء بالفقير يحتقر صانعه، والشامت بالبلية لا يفلت من العقاب."]]}, {"l": "Ecc 9:15", "n": "", "vs": [[15, "وكان يقيم في تلك المدينة رجل مسكين حكيم أنقذ المدينة بفضل حكمته. ولكن أحدا لم يذكره."]]}, {"l": "Ecc 9:16", "n": "", "vs": [[16, "فقلت: إن الحكمة خير من القوة. غير أن حكمة المسكين محتقرة وكلامه غير مسموع."]]}, {"l": "Isa 53:3", "n": "", "vs": [[3, "محتقر ومنبوذ من الناس، رجل آلام ومختبر الحزن، مخذول كمن حجب الناس عنه وجوههم فلم نأبه له."]]}, {"l": "Joh 8:49", "n": "", "vs": [[49, "أجابهم: «لا شيطان في، لكني أكرم أبي وأنتم تهينونني."]]}, {"l": "1Co 11:22", "n": "", "vs": [[22, "أفليس عندكم بيوت تأكلون وتشربون فيها؟ أم إنكم تحتقرون كنيسة الله وتهينون الذين لا يملكون شيئا؟ فماذا أقول لكم؟ أأمدحكم؟ على هذا لست أمدحكم!"]]}], "kwAr": "عاملتم الفقير معاملة مهينة", "noteAr": ""}, {"kw": "Do", "raw": "Jam_5:4; Job_20:19; Psa_10:2, Psa_10:8, Psa_10:10,Psa_10:14, Psa_12:5; Pro_22:16; Ecc_5:8; Isa_3:14, Isa_3:15; Amo_2:6, Amo_2:7, Amo_4:1, Amo_5:11, Amo_8:4-6; Mic_6:11, Mic_6:12; Hab_3:14; Zec_7:10", "note": "", "refs": [{"l": "Jam 5:4", "n": "", "vs": [[4, "وهذه أجرة العمال الذين حصدوا حقولكم، تلك الأجرة التي مازلتم تحبسونها عنهم ظلما، إنها تصرخ، وصراخ أولئك العمال أنفسهم قد سمعه رب الجنود!"]]}, {"l": "Job 20:19", "n": "", "vs": [[19, "لأنه هضم حق الفقراء وخذلهم وسلب بيوتا لم يبنها."]]}, {"l": "Psa 10:2", "n": "", "vs": [[2, "الشرير، بعجرفة، يجد في تعقب المسكين، غير أن الأشرار يسقطون في مؤامرتهم التي فكروا فيها."]]}, {"l": "Psa 10:8", "n": "", "vs": [[8, "يتربص في كمائن الديار ليقتل البريء. عيناه تترصدان المسكين."]]}, {"l": "Psa 10:10", "n": "", "vs": [[10, "يسحق المساكين ويدوسهم حين يسقطون بين مخالبه القوية."]]}, {"l": "Psa 10:14", "n": "", "vs": [[14, "ولكنك قد رأيت. عاينت ما أصاب المساكين من المشقة والغم، فتجازي الشرير بيدك. يسلم إليك المسكين أمره، فأنت دائما معين اليتيم."]]}, {"l": "Psa 12:5", "n": "", "vs": [[5, "ولكن الرب يقول: إنقاذا للمساكين، واستجابة لتنهدات المظلومين، أهب الآن لأفرج كربة المتضايقين."]]}, {"l": "Pro 22:16", "n": "", "vs": [[16, "من يجور على الفقير ليثرى ظلما، ومن يهدي الغني (على حساب الفقير) يؤول به الأمر إلى الفاقة."]]}, {"l": "Ecc 5:8", "n": "", "vs": [[8, "إن شهدت في البلاد الفقير مظلوما، والحق والعدل مزهوقين فلا تعجب من الأمر، فإن فوق المسئول الكبير مسئولا أعلى منه رتبة يراقبه وفوقهما من هو أعظم مقاما منهما."]]}, {"l": "Isa 3:14", "n": "", "vs": [[14, "الرب يدخل في المحاكمة ضد شيوخ شعبه وقادتهم. ويقول السيد الرب القدير: «أنتم الذين أتلفتم كرمي، وصار سلب البائس في منازلكم."]]}, {"l": "Isa 3:15", "n": "", "vs": [[15, "فماذا تقصدون من سحق شعبي وطحن وجوه البائسين؟»"]]}, {"l": "Amo 2:6", "n": "", "vs": [[6, "هذا ما يقوله الرب: من أجل معاصي إسرائيل الثلاث والأربع لن أرد عنهم سخطي، لأنهم باعوا الصديق لقاء الفضة، والبائس مقابل نعلين."]]}, {"l": "Amo 2:7", "n": "", "vs": [[7, "الذين يسحقون رأس المسكين في التراب، ويجورون على البائسين، ويعاشر الرجل وابنه امرأة واحدة، فيتدنس بذلك اسمي المقدس."]]}, {"l": "Amo 4:1", "n": "", "vs": [[1, "اسمعي هذه الكلمة يانساء باشان، اللواتي يقمن في جبل السامرة، ممن يظلمن المسكين ويسحقن الفقراء واللواتي يقلن لأزواجهن: هاتوا مسكرا لنشرب."]]}, {"l": "Amo 5:11", "n": "", "vs": [[11, "فلأنكم تطأون المسكين وتبتزون منه رشوة قمح حتى تشيدوا بيوتا من حجارة منحوتة، فإنكم لن تسكنوا فيها، وتغرسوا كروما شهية ولكنكم لن تشربوا من خمرها."]]}, {"l": "Amo 8:4-6", "n": "", "vs": [[4, "استمعوا هذا أيها الدائسون على البائسين، يامن حاولتم أن تقضوا على فقراء الأرض،"], [5, "قائلين: «متى ينقضي أول الشهر حتى نبيع الحنطة؟ متى يمضي السبت لنعرض القمح في السوق، فنعمد إلى تصغير حجم مكيال الإيفة ونرفع الأسعار، ونستعمل ميزانا مغشوشا."], [6, "لنشتري المسكين بقطعة من الفضة، والبائس بنعلين، ونب ", "note": "", "refs": [{"l": "Rom 3:20", "n": "", "vs": [[20, "فإن أحدا من البشر لا يتبرر أمامه بالأعمال المطلوبة في الشريعة. إذ إن الشريعة هي لإظهار الخطيئة."]]}, {"l": "Rom 7:7-13", "n": "", "vs": [[7, "إذن، ماذا نقول؟ هل الشريعة خطيئة؟ حاشا! ولكني ما عرفت الخطيئة إلا بالشريعة. فما كنت لأعرف الشهوة لولا قول الشريعة: «لا تشته!»"], [8, "ولكن الخطيئة استغلت هذه الوصية فأثارت في كل شهوة. فإن الخطيئة، لولا الشريعة، ميتة."], [9, "أما أنا فكنت من قبل عائشا بمعزل عن الشريعة؛ ولكن لما جاءت الشريعة عاشت الخطيئة،"], [10, "فمت أنا. والوصية الهادفة إلى الحياة، صارت لي مؤدية إلى الموت."], [11, "فإن الخطيئة، إذ استغلت الوصية، خدعتني وقتلتني بها."], [12, "فالشريعة إذن مقدسة، والوصية مقدسة وعادلة وصالحة."], [13, "فهل صار ما هو صالح موتا لي؟ حاشا! ولكن الخطيئة، لكي تظهر أنها خطيئة، أنتجت لي الموت بما هو صالح، حتى تصير الخطيئة خاطئة جدا بسبب الوصية."]]}, {"l": "Gal 2:19", "n": "", "vs": [[19, "فإنني، بالشريعة، قد مت عن الشريعة، لكي أحيا لله."]]}, {"l": "1Jo 3:4", "n": "", "vs": [[4, "أما الذي يمارس الخطيئة، فهو يخالف ناموس الله: لأن الخطيئة هي مخالفة الناموس."]]}], "kwAr": "مخالفين لها", "noteAr": ""}], "arS": [["ولكن ", []], ["عندما", ["G1487"]], [" تعاملون الناس ", []], ["بالانحياز والتمييز", ["G4380"]], ["، ", []], ["ترتكبون", ["G2038"]], [" ", []], ["خطيئة", ["G266"]], [" ", []], ["وتحكم", ["G1651"]], [" عليكم ", []], ["الشريعة", ["G3551"]], [" ", []], ["باعتباركم", ["G5613"]], [" ", []], ["مخالفين", ["G3848"]], [" لها.", []]]}, {"c": 2, "v": 10, "text": "فأنتم تعرفون أن من يطيع جميع الوصايا الواردة في شريعة موسى، ويخالف واحدة منها فقط، يصير مذنبا، تماما كالذي يخالف الوصايا كلها.", "groups": [{"kw": "For", "raw": "While the Jews taught that he who transgresses all the precepts of the law has broken the yoke, dissolved the covenant, and exposed the law to contempt; and so has he done who has only broken one precept; they also taught, that he who observed any principal command was equal to him who kept the whole law, and gave for an example the forsaking of idolatry. To correct this false doctrine was the object James had in view.", "note": "While the Jews taught that he who transgresses all the precepts of the law has broken the yoke, dissolved the covenant, and exposed the law to contempt; and so has he done who has only broken one precept; they also taught, that he who observed any principal command was equal to him who kept the whole law, and gave for an example the forsaking of idolatry. To correct this false doctrine was the object James had in view.", "refs": [], "kwAr": "فأنتم تعرفون", "noteAr": "كان اليهود يعلّمون أن من يتعدى كل وصايا الناموس قد كسر النير ونقض العهد وعرّض الناموس للاحتقار، وكذلك من يكسر وصية واحدة؛ وعلّموا أيضًا أن من يحفظ وصية رئيسية واحدة يعادل من حفظ الناموس كله، وضربوا مثلًا بترك عبادة الأوثان. وكان قصد يعقوب تصحيح هذا التعليم الخاطئ."}, {"kw": "whosoever", "raw": "Deu_27:26; Mat_5:18, Mat_5:19; Gal_3:10", "note": "", "refs": [{"l": "Deu 27:26", "n": "", "vs": [[26, "ملعون كل من لا يطيع كلمات هذه الشريعة ولا يعمل بها. فيقول جميع الشعب: آمين."]]}, {"l": "Mat 5:18", "n": "", "vs": [[18, "فالحق أقول لكم: إلى أن تزول الأرض والسماء، لن يزول حرف واحد أو نقطة واحدة من الشريعة، حتى يتم كل شيء."]]}, {"l": "Mat 5:19", "n": "", "vs": [[19, "فأي من خالف واحدة من هذه الوصايا الصغرى، وعلم الناس أن يفعلوا فعله، يدعى الأصغر في ملكوت السماوات. وأما من عمل بها وعلمها، فيدعى عظيما في ملكوت السماوات."]]}, {"l": "Gal 3:10", "n": "", "vs": [[10, "أما جميع الذين على مبدأ أعمال الشريعة، فإنهم تحت اللعنة، لأنه قد كتب: «ملعون كل من لا يثبت على العمل بكل ما هو مكتوب في كتاب الشريعة!»"]]}], "kwAr": "من يطيع جميع الوصايا ويخالف واحدة", "noteAr": ""}], "arS": [["فأنتم تعرفون أن من ", []], ["يطيع", ["G5083"]], [" ", []], ["جميع", ["G3650"]], [" الوصايا الواردة في ", []], ["شريعة", ["G3551"]], [" موسى، ", []], ["ويخالف", ["G4417"]], [" ", []], ["واحدة", ["G1520"]], [" منها فقط، يصير ", []], ["مذنبا", ["G1777"]], ["، تماما كالذي يخالف الوصايا ", []], ["كلها", ["G3956"]], [".", []]]}, {"c": 2, "v": 11, "text": "فإن الله ، مثلا، قال: «لا تزن» كم
